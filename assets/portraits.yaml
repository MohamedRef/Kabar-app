schema: kabar.portraits/v1
# One portrait per recurring character in content/cast.yaml, keyed by the
# cast `id` (never by name: names can change, ids can't). The portrait is
# assets/src/personas/<id>.png; `expressions: true` adds <id>-listening,
# -laughing, -thinking and -explaining for characters you talk to.
# `batch` is the Codex prompt (docs/VISUAL-ASSETS.md, prompt 6a-6e) that
# draws it. Tests fail if a cast id has no entry here, if an entry names a
# character that isn't in the cast, or if a portrait file has no entry.
# `scripts/assets/portrait_prompts.py` writes the prompts from this file.
#
# The learner (mohamed) has no portrait: the app never shows his face.

portraits:
  # --- 6a · the people you talk to: coach, chat partners, Radio hosts ------
  - id: kak-nur
    batch: 6a
    expressions: true
    look: a warm, encouraging Indonesian woman in her early 30s, soft pastel headscarf, simple indigo blouse, a small notebook held to her chest
    setting: a bright Jakarta study corner with plants and a window

  - id: mbak-gadis
    batch: 6a
    expressions: true
    look: a young professional Jakarta woman, late 20s, shoulder-length black hair, smart casual blazer, a lanyard with a blank card, a coffee cup in hand
    setting: a modern office window with city towers

  - id: mas-ardi
    batch: 6a
    expressions: true
    look: a Balinese hotel receptionist around 30, short neat hair, a crisp uniform shirt with a small frangipani pin, a calm welcoming smile
    setting: an open-air hotel lobby with carved wood and frangipani

  - id: mas-dimas
    batch: 6a
    expressions: true
    look: a Javanese university student in Yogyakarta, early 20s, short black hair, a relaxed batik shirt, a canvas backpack strap on one shoulder
    setting: a campus courtyard with a frangipani tree

  - id: bu-siti
    batch: 6a
    expressions: true
    look: a Javanese fruit-and-tempe seller in Solo, around 50, warm confident smile, a neat headscarf, a simple kebaya-style blouse
    setting: baskets of fruit and tempe in the Pasar Gede market hall

  - id: kak-tiara
    batch: 6a
    look: a cheerful Jakarta schoolteacher in her early 30s, wavy hair tied back, a light cardigan, studio headphones around her neck
    setting: a cosy radio booth with a microphone on an arm

  - id: kak-reza
    batch: 6a
