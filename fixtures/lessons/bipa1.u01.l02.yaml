# Fixture lesson for the Lesson Player (kabar.lesson/v1, schemas/lesson.schema.json).
# Draft: written by Claude Code, waiting for the learner's review.
schema: kabar.lesson/v1
id: bipa1.u01.l02
language: id
title: Apa kabar?
can_do:
  ar_eg: تسأل حد عامل إيه وترد لما حد يسألك.
  ar: أن تسأل عن حال شخص وتجيب عن السؤال نفسه.
  en: Ask how someone is and answer when they ask you.

slides:
  - title: Apa kabar?
    grammar: id.question.apa
    body:
      ar_eg: |
        kabar جاية من العربي «خبر» — الخ بقت k، زي ما هتشوف في كلمات تانية.
        apa يعني «إيه». فـ«Apa kabar?» حرفيًا «إيه الخبر؟» يعني «إزيك؟ / أخبارك إيه؟».
      ar: |
        kabar مأخوذة من العربية «خبر»، وقد صارت الخاء k كما سترى في كلمات أخرى.
        apa تعني «ما». فعبارة «Apa kabar?» حرفيًا «ما الخبر؟» أي «كيف حالك؟».
      en: |
        kabar comes from Arabic «خبر» (news): the kh sound became k, as in other loans.
        apa means "what". So "Apa kabar?" is literally "what news?", meaning "How are you?".
    examples:
      - text: Apa kabar?
        ar_eg: إزيك؟ / أخبارك إيه؟
        ar: كيف حالك؟
        en: How are you?
      - text: Apa kabar, Bu?
        ar_eg: إزيك يا مدام؟
        ar: كيف حالك يا سيدتي؟
        en: How are you, ma'am?

  - title: Baik!
    body:
      ar_eg: |
        الرد الطبيعي: Baik (كويس) أو Kabar baik (أخباري كويسة).
        ولو عايز تقول «تمام، كله ماشي» قول Baik-baik saja.
        وبعدها terima kasih = شكرًا.
      ar: |
        الجواب المعتاد: Baik (بخير) أو Kabar baik (أخباري طيبة).
        ولقول «كل شيء على ما يرام» قل Baik-baik saja.
        ثم terima kasih = شكرًا.
      en: |
        The usual reply: Baik (fine) or Kabar baik (good news, I'm well).
        "All good" is Baik-baik saja.
        Then terima kasih = thank you.
    examples:
      - text: Kabar baik, terima kasih.
        ar_eg: كويس، شكرًا.
        ar: بخير، شكرًا.
        en: I'm fine, thank you.
      - text: Baik-baik saja.
        ar_eg: تمام، كله تمام.
        ar: كل شيء على ما يرام.
        en: All good.

  - title: Dan Bapak?
    body:
      ar_eg: |
        عشان ترجّع السؤال قول «Dan …?» = «وإنت؟».
        مع صاحبك: Dan kamu? ومع حد أكبر منك بتستخدم لقبه مكان «إنت»: Dan Bapak? (وحضرتك يا أستاذ؟) أو Dan Ibu?
        ده بالظبط زي ما بنقول «وحضرتك؟».
      ar: |
        لإعادة السؤال قل «Dan …?» أي «وأنت؟».
        مع صديق: Dan kamu? ومع من هو أكبر منك يُستعمل اللقب بدل الضمير: Dan Bapak? أو Dan Ibu?
        وهذا قريب من قولنا «وحضرتك؟».
      en: |
        To ask back, say "Dan …?" = "And you?".
        With a friend: Dan kamu? With someone older, use their title instead of "you": Dan Bapak? or Dan Ibu?
        Much like saying «وحضرتك؟» in Arabic.
    examples:
      - text: Baik, terima kasih. Dan kamu?
        ar_eg: كويس، شكرًا. وإنت؟
        ar: بخير، شكرًا. وأنت؟
        en: Fine, thanks. And you?
      - text: Kabar baik. Dan Ibu?
        ar_eg: كويس. وحضرتك يا مدام؟
        ar: بخير. وأنتِ يا سيدتي؟
        en: I'm well. And you, ma'am?

  - title: Terima kasih, maaf, salam
    body:
      ar_eg: |
        terima kasih = شكرًا، والرد عليها sama-sama = العفو.
        maaf = آسف / لا مؤاخذة، وجاية من العربي «معاف» (من «العفو»).
        في إندونيسيا هتسمع «Assalamualaikum» كتير، والرد «Waalaikumsalam» — نفس اللي إنت متعود عليه.
        وكلمة salam نفسها من «سلام»: Salam untuk keluarga = سلّملي على العيلة.
      ar: |
        terima kasih = شكرًا، وجوابها sama-sama = عفوًا.
        maaf = آسف / المعذرة، وهي من العربية «معاف» (من الجذر ع ف و).
        ستسمع في إندونيسيا «Assalamualaikum» كثيرًا، وجوابها «Waalaikumsalam»، كما اعتدت تمامًا.
        وكلمة salam نفسها من «سلام».
      en: |
        terima kasih = thank you; the reply is sama-sama = you're welcome.
        maaf = sorry / excuse me, from Arabic «معاف» (root ع ف و, forgiveness).
        In Indonesia you'll hear "Assalamualaikum" a lot; the reply is "Waalaikumsalam", just as you know it.
        The word salam itself comes from «سلام».
    examples:
      - text: Terima kasih, Pak!
        ar_eg: شكرًا يا أستاذ!
        ar: شكرًا يا سيدي!
        en: Thank you, sir!
      - text: Sama-sama.
        ar_eg: العفو.
        ar: عفوًا.
        en: You're welcome.
      - text: Maaf, Bu.
        ar_eg: لا مؤاخذة يا مدام.
        ar: المعذرة يا سيدتي.
        en: Sorry, ma'am.

