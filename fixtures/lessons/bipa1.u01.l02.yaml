dialogue:
  title: Bertemu Sari
  lines:
    - speaker: Sari
      text: Assalamualaikum, Pak Karim!
      ar_eg: السلام عليكم يا أستاذ كريم!
      ar: السلام عليكم يا أستاذ كريم!
      en: Peace be upon you, Mr Karim!
    - speaker: Karim
      text: Waalaikumsalam, Sari! Apa kabar?
      ar_eg: وعليكم السلام يا ساري! إزيك؟
      ar: وعليكم السلام يا ساري! كيف حالك؟
      en: And upon you be peace, Sari! How are you?
    - speaker: Sari
      text: Kabar baik, terima kasih. Dan Bapak?
      ar_eg: كويسة، شكرًا. وحضرتك؟
      ar: بخير، شكرًا. وحضرتك؟
      en: I'm well, thank you. And you, sir?
    - speaker: Karim
      text: Baik-baik saja. Sampai jumpa, Sari!
      ar_eg: كله تمام. أشوفك على خير يا ساري!
      ar: كل شيء على ما يرام. إلى اللقاء يا ساري!
      en: All good. See you, Sari!
    - speaker: Sari
      text: Sampai jumpa, Pak!
      ar_eg: أشوفك على خير يا أستاذ!
      ar: إلى اللقاء يا أستاذ!
      en: See you, sir!

