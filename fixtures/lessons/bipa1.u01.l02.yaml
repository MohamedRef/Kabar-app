  - id: e05
    type: build_sentence
    source:
      ar_eg: كويس، شكرًا.
      ar: بخير، شكرًا.
      en: I'm fine, thank you.
    answer: Kabar baik, terima kasih.
    alternatives: ["Baik, terima kasih."]
    distractors: [maaf, apa]
    words: [baik, terima kasih]
    explain:
      ar_eg: Kabar baik = أخباري كويسة، وterima kasih = شكرًا. الكلمتين terima kasih دايمًا مع بعض.
      ar: Kabar baik = أخباري طيبة، وterima kasih = شكرًا، ولا تنفصل كلمتا terima kasih.
      en: Kabar baik = (my) news is good; terima kasih = thank you, and the two words always go together.

