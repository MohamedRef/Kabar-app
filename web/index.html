<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f8ef" />
    <title>Kabar</title>
    <link rel="icon" type="image/png" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #f7f8ef; }
      @media (prefers-color-scheme: dark) { html, body { background: #000; color: #eee; } }
      #main:not(:empty) ~ #boot { display: none; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 16px; font: 15px system-ui, sans-serif; text-align: center; }
      #boot img { inline-size: 96px; block-size: 96px; border-radius: 22%;
                  animation: pulse 1.6s ease-in-out infinite; }
      #boot p { margin: 0; padding-inline: 24px; opacity: .7; }
      #boot p:empty { display: none; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.07); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <div id="boot" role="status" aria-label="Kabar بيفتح">
      <img src="icon-192.png" alt="" />
      <p id="boot-msg"></p>
    </div>
    <noscript>Kabar needs JavaScript and WebAssembly.</noscript>
    <script type="module">
      import init from "./kabar.js";
      init({ module_or_path: "./kabar_bg.wasm" })
        .then(() => {
          // Once this visit has everything, keep it on the device for the next.
          if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
        })
        .catch((e) => {
          document.querySelector("#boot img").style.animation = "none";
          document.getElementById("boot-msg").textContent = "Kabar مافتحش في المتصفح ده: " + e;
        });
    </script>
  </body>
</html>
