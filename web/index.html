<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f8ef" />
    <title>Kabar</title>
    <link rel="icon" type="image/png" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #f7f8ef; }
      @media (prefers-color-scheme: dark) { html, body { background: #000; color: #eee; } }
      #main:not(:empty) ~ #boot { display: none; }
      #boot { font: 16px system-ui, sans-serif; text-align: center; padding-block-start: 40vh; opacity: .7; }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <p id="boot">‏<bdi>Kabar</bdi> بيفتح…</p>
    <noscript>Kabar needs JavaScript and WebAssembly.</noscript>
    <script type="module">
      import init from "./kabar.js";
      init({ module_or_path: "./kabar_bg.wasm" }).catch((e) => {
        document.getElementById("boot").textContent = "Kabar مافتحش في المتصفح ده: " + e;
      });
    </script>
  </body>
</html>
