[application]
name = "Kabar"
# Our own manifest so the launcher shows Kabar's icon, not dx's default.
# Permissions, queries and features live in that file now.
android_manifest = "AndroidManifest.xml"

[bundle]
identifier = "app.kabar"
publisher = "Kabar"
short_description = "Indonesian + Javanese, from Arabic."
# App icon (macOS .app); exported by scripts/assets/export_icons.py.
# One 1024px master on purpose: dx 0.7 builds every .icns size from the first
# PNG listed, so a small PNG first would be upscaled into a blurry icon.
icon = ["../../assets/export/macos/Kabar.iconset/icon_512x512@2x.png"]

[android]
min_sdk = 28
