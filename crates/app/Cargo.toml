[package]
name = "kabar-app"
description = "Kabar: the Dioxus app for macOS, Android and web."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kabar"
path = "src/main.rs"

[dependencies]
kabar-core.workspace = true
kabar-protocol.workspace = true
# Dioxus's defaults minus `devtools` (hot reload), which only the native
# builds take (below): in the web app it would knock on a dx dev server forever.
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "logger", "lib"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

rusqlite = { version = "0.41", features = ["bundled", "serialize"] }
uuid = { version = "1", features = ["v4", "v7"] }
futures-channel = "0.3"
# Unpacks the content build.rs compresses (pure Rust, already in the tree).
miniz_oxide = "0.8"

base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
sha2 = "0.10"
# Offline packs: one tar per unit (crates/app/src/packs).
tar = { version = "0.4", default-features = false }
# std::time::{Instant, SystemTime} panic in the browser; this is std on native.
web-time = "1"

# Native builds (Mac, Android): the network, the keychain and real threads.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { version = "0.7.10", features = ["devtools"] }
# Kabar Cloud client: TLS is rustls + ring with webpki roots everywhere, so the
# Android build needs no Java trust-store glue.
keyring-core = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
directories = "6"

# The web build (wasm32, docs/WEB.md): the browser stands in for the OS
# (src/platform/web.rs). SQLite runs in wasm and persists in IndexedDB.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["sync", "macros"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "v7", "js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Window", "Document", "Element", "HtmlElement", "Location", "Storage", "Navigator", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "MediaQueryList", "WebSocket", "MessageEvent", "CloseEvent", "Event", "BinaryType"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
android-native-keyring-store = "1"
# Only for `#[manganis::ffi]`, which tells dx to build android/ into the APK.
# Keep in lockstep with the dioxus version.
manganis = "=0.7.10"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# Apple Vision OCR (Screenshot Decoder).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSCalendar", "NSDate", "NSDictionary", "NSError", "NSObject", "NSString", "NSValue"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation", "objc2-core-graphics", "objc2-image-io"] }
# Kak Nur's reminders as native notifications (bundled Kabar.app only).
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[build-dependencies]
miniz_oxide = "0.8"

[dev-dependencies]
# Render actual shared components for semantic regression coverage.
dioxus = { version = "0.7.10", features = ["ssr"] }
# Serialized events, so tests can tap a button (`src/testkit.rs`) in every
# feature set, including the browser job's `--no-default-features`.
dioxus-html = { version = "0.7.10", features = ["serialize"] }
tempfile = "3"
# Signs test update feeds (the app itself only verifies, via kabar-core).
ed25519-dalek = "2"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# The web app (`just web`, docs/WEB.md).
web = ["dioxus/web"]

[lints]
workspace = true
