[package]
name = "kabar-core"
description = "Pure Kabar logic: no UI, no network, no filesystem."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kabar-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sastrawi-rs = "0.5.3"
fsrs = "6.6"
sha2 = "0.11"
serde_yaml_ng = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

# fsrs pulls rand → getrandom, which needs an explicit JS backend on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
