[package]
name = "kabar-server"
description = "Kabar Cloud: a Cloudflare Worker (workers-rs) with a Durable Object sync hub per account."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kabar-core.workspace = true
kabar-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
sha2 = "0.10"

# Only the Worker build talks to the Cloudflare runtime. Everything else is
# plain Rust and tested natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
worker = { version = "0.8", features = ["d1"] }

[dev-dependencies]
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
rusqlite = { version = "0.41", features = ["bundled"] }

[lints]
workspace = true
