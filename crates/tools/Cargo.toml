[package]
name = "kabar-tools"
description = "Kabar's build-time tools: content pipeline (frequency lists, Wiktionary import, glosses, Arabic Bridge) and generated assets (Journey Map)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "kabar-tools"

[[bin]]
name = "kabar-tools"
path = "src/main.rs"

[[bin]]
name = "journey-map"
path = "src/bin/journey_map.rs"

[dependencies]
kabar-core.workspace = true
kabar-protocol = { workspace = true, features = ["schema"] }
# Kabar Cloud's request builders and reply parsers, so the bake-off sends
# exactly what production sends. Native build: plain Rust, no Worker runtime.
kabar-server = { path = "../server" }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
csv = "1"
serde_yaml_ng = "0.10"
flate2 = "1"
rmp-serde = "1"
bzip2 = "0.6"
quick-xml = "0.38"
unicode-normalization = "0.1"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }

[lints]
workspace = true
