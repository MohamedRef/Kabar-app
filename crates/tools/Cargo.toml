[package]
name = "kabar-tools"
description = "Kabar's build-time tools: content pipeline (frequency lists, Wiktionary import, glosses, Arabic Bridge) and generated assets (Journey Map)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kabar-tools"
path = "src/main.rs"

[[bin]]
name = "journey-map"
path = "src/bin/journey_map.rs"

[dependencies]
kabar-core.workspace = true
kabar-protocol = { workspace = true, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rmp-serde = "1"
bzip2 = "0.6"
quick-xml = "0.38"
unicode-normalization = "0.1"

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }

[lints]
workspace = true
