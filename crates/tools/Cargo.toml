[package]
name = "batna-tools"
description = "Batna's content tools: validate, anki, packs, verdicts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
batna-core.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
# Anki export: the .apkg is a zipped SQLite collection; ids are SHA-1/SHA-256 based.
rusqlite = { version = "0.37", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
