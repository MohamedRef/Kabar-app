# Route table for the AI router (spec §19, PLAN §9).
#
# Per task: engines that passed the task's golden set, best first. The router
# also drops engines that are switched off, paid engines while the $0 hard
# stop is on, and any engine that trains on inputs (gemini_free) for personal
# tasks. A parse check rejects a personal task listed with gemini_free.
#
# status = "provisional" until the bake-off (docs/BAKEOFF.md) has run on the
# Mac; answers from provisional routes carry a badge. Re-write this file from
# the bake-off report.

# --- Reading ---------------------------------------------------------------

[analyze_text]
engines = ["workers_ai", "gemini_free", "local", "claude"]
status = "provisional"

[explain_sentence]
engines = ["workers_ai", "gemini_free", "local", "claude"]
status = "provisional"

[structure_screenshot]
engines = ["local", "workers_ai", "gemini_free", "claude"]
status = "provisional"

