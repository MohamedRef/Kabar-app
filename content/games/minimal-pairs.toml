# --- How to say it ----------------------------------------------------------

[[tips]]
contrast = "d_dh"
arz = "الـ⁨d⁩ الجاوي هو الدال بتاعتنا بالظبط: طرف لسانك ورا سنانك اللي فوق. في الـ⁨dh⁩ رجّع طرف لسانك لورا واثنيه لفوق شوية، ورا اللثة (الحتة الناشفة اللي ورا السنان)، واضرب من هناك. الصوت بيطلع أتقل و«أغمق». ممكن تحسّ إن تقله شبه الضاد شوية، بس مكان اللسان مختلف: ده مش ضاد، ده دال واللسان راجع لورا. ولا هو ذال كمان. جرّب: ⁨wedi⁩ (خايف) و⁨wedhi⁩ (رملة)."
ar = "الـ⁨d⁩ الجاوية هي الدال العربية تمامًا: طرف اللسان خلف الأسنان العليا. أما في الـ⁨dh⁩ فأرجِع طرف اللسان إلى الخلف وأثنِه قليلًا إلى أعلى خلف اللثة، ثم أطلقه من هناك؛ فيخرج الصوت أثقل وأعمق. قد تشعر بأن ثقله يشبه ثقل الضاد بعض الشيء، لكن موضع اللسان مختلف: ليست ضادًا، بل دالًا ارتدّ لسانها إلى الخلف، وليست ذالًا كذلك. جرّب: ⁨wedi⁩ (خائف) و⁨wedhi⁩ (رمل)."
en = "Javanese d is just Arabic د: the tongue tip against the back of your upper teeth. For dh, pull the tongue tip back and curl it up a little, behind the gum ridge, and release it from there. It comes out heavier and 'darker'. It can feel a bit like ض in weight, but the tongue sits somewhere else: it isn't ض, it's a d with the tongue pulled back. It isn't ذ either. Try wedi (afraid) and wedhi (sand)."

[[tips]]
contrast = "t_th"
arz = "الـ⁨t⁩ الجاوي هو التاء بتاعتنا: طرف لسانك ورا سنانك اللي فوق، ومن غير نفَس طالع وراه. الـ⁨th⁩ مش زي ⁨th⁩ الإنجليزي (مش ثاء!): رجّع طرف لسانك لورا واثنيه لفوق شوية ورا اللثة، واضرب من هناك. الصوت بيطلع أتقل و«أغمق». ممكن تحسّ إن تقله شبه الطاء شوية، بس مكان اللسان مختلف: ده مش طاء، ده تاء واللسان راجع لورا. جرّب: ⁨putu⁩ (حفيد) و⁨puthu⁩ (كيكة رز على البخار)."
ar = "الـ⁨t⁩ الجاوية هي التاء العربية: طرف اللسان خلف الأسنان العليا، بلا نفَس يخرج بعدها. والـ⁨th⁩ ليست ⁨th⁩ الإنجليزية (ليست ثاءً): أرجِع طرف اللسان إلى الخلف وأثنِه قليلًا إلى أعلى خلف اللثة، ثم أطلقه من هناك؛ فيخرج الصوت أثقل وأعمق. قد تشعر بأن ثقله يشبه ثقل الطاء بعض الشيء، لكن موضع اللسان مختلف: ليست طاءً، بل تاءً ارتدّ لسانها إلى الخلف. جرّب: ⁨putu⁩ (حفيد) و⁨puthu⁩ (كعكة أرز على البخار)."
en = "Javanese t is just Arabic ت: the tongue tip against the back of your upper teeth, with no puff of air after it. Javanese th is not English th (not ث): pull the tongue tip back and curl it up a little, behind the gum ridge, and release it from there. It comes out heavier and 'darker'. It can feel a bit like ط in weight, but the tongue sits somewhere else: it isn't ط, it's a t with the tongue pulled back. Try putu (grandchild) and puthu (a steamed rice cake)."

