why.ar = "ودودة، لكن وداع الجار المسن يحب شيئًا من الأدب: ⁨kula nyuwun pamit⁩ و⁨sugeng dalu⁩."
why.en = "Friendly, but a goodbye to an elderly neighbour loves a little ceremony: kula nyuwun pamit and sugeng dalu."
