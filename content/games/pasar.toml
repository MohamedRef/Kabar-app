# Pasar! (spec §14): the items you haggle for and every line the seller says,
# in Indonesian or Javanese market speech, with Egyptian Arabic (arz), Modern
# Standard Arabic (ar) and English (en) meanings. Format, placeholders and tone
# rules: see README.md in this folder. Parsed by crates/core/src/games/pasar.rs,
# whose tests are the content gate.
#
# ⁨ … ⁩ are FSI … PDI (first-strong isolate … pop directional isolate). Every
# Latin snippet and every {price} inside an Arabic line sits between them so
# right-to-left text renders correctly.
#
# Prices are in rupiah, as a local would see them in 2026. `floor` is the
# lowest price the seller accepts (never shown), `fair` what a local would
# pay. floor <= fair <= ask.

reviewed = false
version = 1

