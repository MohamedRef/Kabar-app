javanese = true
text = "Mas, balik sik, Mas. {price} oleh."
arz = "ارجع بس يا أستاذ. ⁨{price}⁩ ماشي."
ar = "عُد لحظة يا أخي. ⁨{price}⁩ لا بأس."
en = "Come back a moment. {price} is okay."

[[lines]]
situation = "call_back"
javanese = true
text = "Mas, kanggo penglaris, {price} wis."
arz = "يا أستاذ، عشان الاستفتاح، ⁨{price}⁩ وخلاص."
ar = "يا أخي، من أجل الاستفتاح، ⁨{price}⁩ إذن."
en = "For my first sale of the day, {price}, then."

[[lines]]
situation = "final"
javanese = true
text = "Wis pas, Mas, {price}. Ora isa kurang."
arz = "ده السعر المظبوط يا أستاذ، ⁨{price}⁩. مينفعش أقل."
ar = "هذا هو السعر يا أخي، ⁨{price}⁩. لا يمكن أقل."
en = "That's the right price, {price}. It can't go lower."

[[lines]]
situation = "final"
javanese = true
text = "Iki rega pas, Mas: {price}. Wis ora isa kurang maneh."
arz = "ده آخر سعر يا أستاذ: ⁨{price}⁩. مينفعش أنزل تاني."
ar = "هذا هو السعر النهائي يا أخي: ⁨{price}⁩. لا يمكن أن ينزل أكثر."
en = "This is the fixed price: {price}. It can't go any lower."

[[lines]]
situation = "final"
javanese = true
text = "Sampun pas, Mas, {price}."
arz = "ده آخر كلام يا أستاذ، ⁨{price}⁩."
ar = "هذا هو السعر النهائي يا أخي، ⁨{price}⁩."
en = "That's the final price, {price}."

[[lines]]
situation = "let_go"
javanese = true
text = "Ya wis, Mas, ra papa. Matur nuwun, mampir maneh ya."
arz = "خلاص يا أستاذ، ولا يهمك. شكرًا، وعدّي علينا تاني."
ar = "حسنًا يا أخي، لا بأس. شكرًا، ومرّ بنا مرة أخرى."
en = "Alright, no problem. Thank you, come by again."

[[lines]]
situation = "let_go"
javanese = true
text = "Nggih, Mas, monggo. Sesuk mampir maneh."
arz = "ماشي يا أستاذ، اتفضل. عدّي علينا بكرة."
ar = "حسنًا يا أخي، تفضّل. مرّ بنا غدًا."
en = "Sure, go ahead. Stop by again tomorrow."

[[lines]]
situation = "let_go"
javanese = true
text = "Ora papa, Mas. Ati-ati, nggih."
arz = "ولا يهمك يا أستاذ. خلي بالك من نفسك."
ar = "لا بأس يا أخي. اعتنِ بنفسك."
en = "No worries. Take care."
