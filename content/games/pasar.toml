# The bonus seller talks like a marketplace seller, not a market stall.
[[items.lines]]
situation = "greeting"
text = "Halo, Kak, yang chat WA tadi, ya? Ini unitnya: resmi iBox, mulus, nomin, garansi jalan."
arz = "أهلاً يا أستاذ، إنت اللي كلمتني على ⁨WhatsApp⁩ من شوية، صح؟ ده الجهاز: رسمي من ⁨iBox⁩، نضيف، مفيهوش أي عيب، والضمان شغال."
ar = "مرحبًا يا أخي، أنت من راسلني على ⁨WhatsApp⁩ قبل قليل، أليس كذلك؟ هذا هو الجهاز: رسمي من ⁨iBox⁩، سليم، بلا عيوب، والضمان ساري."
en = "Hi, you're the one who messaged on WhatsApp earlier, right? Here's the unit: official iBox, flawless, no defects, warranty active."

[[items.lines]]
situation = "greeting"
text = "Silakan dicek dulu, Kak. Mulus, nomin, garansi iBox masih jalan."
arz = "اتفضل افحصه الأول يا أستاذ. نضيف، مفيهوش عيب، وضمان ⁨iBox⁩ لسه شغال."
ar = "تفضّل افحصه أولًا يا أخي. سليم، بلا عيوب، وضمان ⁨iBox⁩ ما زال ساريًا."
en = "Go ahead and check it first. Flawless, no defects, and the iBox warranty is still active."

[[items.lines]]
situation = "quote"
text = "Harganya {price}, Kak, nego tipis."
arz = "سعره ⁨{price}⁩ يا أستاذ، والفصال على الضيق."
ar = "سعره ⁨{price}⁩ يا أخي، والتفاوض في حدود ضيقة."
en = "It's {price}, with only a little room to negotiate."

[[items.lines]]
situation = "quote"
text = "{price}, Kak. Masih garansi, lho."
arz = "⁨{price}⁩ يا أستاذ. ولسه في الضمان على فكرة."
ar = "⁨{price}⁩ يا أخي. وما زال في الضمان."
en = "{price}. It's still under warranty, you know."

[[items.lines]]
situation = "final"
text = "Udah harga nett, Kak: {price}. Garansinya masih jalan, lho."
arz = "ده السعر الصافي يا أستاذ: ⁨{price}⁩. والضمان لسه شغال على فكرة."
ar = "هذا هو السعر الصافي يا أخي: ⁨{price}⁩. والضمان ما زال ساريًا."
en = "That's the net price: {price}. The warranty is still running, you know."

# --- Seller lines: Indonesian -------------------------------------------------
# The seller calls the learner "Kak" (يا أستاذ / يا أخي).

[[lines]]
situation = "greeting"
text = "Mari, Kak, silakan dilihat-lihat dulu."
arz = "اتفضل يا أستاذ، اتفرّج براحتك الأول."
ar = "تفضّل يا أخي، انظر على مهلك أولًا."
en = "Come on in, have a look around first."

[[lines]]
situation = "greeting"
text = "Ayo, Kak, mampir dulu. Barangnya bagus-bagus, lho."
arz = "تعالى يا أستاذ، عدّي علينا شوية. البضاعة حلوة والله."
ar = "تعال يا أخي، مرّ بنا قليلًا. البضاعة جيدة حقًا."
en = "Come, stop by for a bit. The goods are really nice, you know."

[[lines]]
situation = "greeting"
text = "Silakan, Kak, boleh dipilih-pilih. Mau cari apa?"
arz = "اتفضل يا أستاذ، نقّي براحتك. بتدوّر على إيه؟"
ar = "تفضّل يا أخي، اختر كما تشاء. عمَّ تبحث؟"
en = "Go ahead, pick whatever you like. What are you looking for?"

[[lines]]
situation = "quote"
text = "Ini {price}, Kak."
arz = "ده بـ⁨{price}⁩ يا أستاذ."
ar = "هذا بـ⁨{price}⁩ يا أخي."
en = "This one's {price}."

[[lines]]
situation = "quote"
text = "Harganya {price}, Kak."
arz = "سعره ⁨{price}⁩ يا أستاذ."
ar = "سعره ⁨{price}⁩ يا أخي."
en = "It's {price}."

[[lines]]
situation = "quote"
text = "Buat Kakak, {price} aja."
arz = "عشانك، ⁨{price}⁩ بس."
ar = "من أجلك، ⁨{price}⁩ فقط."
en = "For you, just {price}."

[[lines]]
situation = "discount"
text = "Ya udah, buat Kakak {price} deh."
arz = "خلاص، عشانك ⁨{price}⁩."
ar = "حسنًا، من أجلك ⁨{price}⁩."
en = "Alright, for you, {price}."

[[lines]]
situation = "discount"
text = "Boleh kurang sedikit, Kak: {price}."
arz = "ممكن أنزل شوية يا أستاذ: ⁨{price}⁩."
ar = "يمكنني أن أخفض قليلًا يا أخي: ⁨{price}⁩."
en = "I can go a little lower: {price}."

[[lines]]
situation = "discount"
text = "Oke, saya kasih {price}, ya."
arz = "ماشي، هديهولك بـ⁨{price}⁩."
ar = "حسنًا، سأعطيك إياه بـ⁨{price}⁩."
en = "Okay, I'll let you have it for {price}."

[[lines]]
situation = "counter"
text = "Belum bisa, Kak. Kalau {price} gimana?"
arz = "لسه مش هينفع يا أستاذ. طب إيه رأيك في ⁨{price}⁩؟"
ar = "لا يمكن بعد يا أخي. ما رأيك في ⁨{price}⁩؟"
en = "Not yet. How about {price}?"

[[lines]]
situation = "counter"
text = "Naik sedikit lagi, Kak. {price}, ya?"
arz = "زوّد شوية كمان يا أستاذ. ⁨{price}⁩، ماشي؟"
ar = "زِد قليلًا يا أخي. ⁨{price}⁩، اتفقنا؟"
en = "Come up a little more. {price}, okay?"

[[lines]]
situation = "counter"
text = "Untungnya tipis, Kak. {price} deh."
arz = "المكسب فيها قليل يا أستاذ. ⁨{price}⁩ وخلاص."
ar = "الربح فيه قليل يا أخي. ⁨{price}⁩ إذن."
en = "My margin is thin. Let's say {price}."

[[lines]]
situation = "refuse_low"
text = "Aduh, belum dapat, Kak. Modalnya aja belum nutup. Paling murah {price}."
arz = "لأ يا أستاذ، كده مش هتيجي. ده حتى مش مغطّي التمن اللي جبتها بيه. أقل حاجة ⁨{price}⁩."
ar = "عذرًا يا أخي، هذا لا يكفي؛ فهو لا يغطي حتى سعر الشراء. أقل سعر ⁨{price}⁩."
en = "Oh, that won't do. It doesn't even cover what I paid. The lowest is {price}."

[[lines]]
situation = "refuse_low"
text = "Wah, jangan segitu, Kak, saya rugi. {price}, ya?"
arz = "لأ يا أستاذ، مش بالسعر ده، كده أنا اللي هخسر. ⁨{price}⁩، ماشي؟"
ar = "لا يا أخي، ليس بهذا السعر، سأخسر. ⁨{price}⁩، اتفقنا؟"
en = "Oh, not that low, I'd lose money. {price}, okay?"

[[lines]]
situation = "refuse_low"
text = "Maaf, Kak, nggak bisa segitu. Paling murah {price}."
arz = "معلش يا أستاذ، مش هينفع بالسعر ده. أقل حاجة ⁨{price}⁩."
ar = "آسف يا أخي، لا يمكن بهذا السعر. أقل سعر ⁨{price}⁩."
en = "Sorry, I can't do that price. The lowest is {price}."

[[lines]]
situation = "accept"
text = "Oke, Kak, boleh. {price}, ya."
arz = "ماشي يا أستاذ، موافق. ⁨{price}⁩ يبقى."
ar = "حسنًا يا أخي، موافق. ⁨{price}⁩ إذن."
en = "Okay, deal. {price} it is."

[[lines]]
situation = "accept"
text = "Ya udah, deal! {price}."
arz = "خلاص، اتفقنا! ⁨{price}⁩."
ar = "حسنًا، اتفقنا! ⁨{price}⁩."
en = "Alright, deal! {price}."

[[lines]]
situation = "accept"
text = "Siap, Kak, {price}. Makasih, ya."
arz = "تمام يا أستاذ، ⁨{price}⁩. شكرًا ليك."
ar = "حاضر يا أخي، ⁨{price}⁩. شكرًا لك."
en = "Sure thing, {price}. Thank you."

[[lines]]
situation = "call_back"
text = "Kak, Kak, sini dulu. Ya udah, {price} deh."
arz = "يا أستاذ، يا أستاذ، تعالى بس. خلاص، ⁨{price}⁩."
ar = "يا أخي، يا أخي، تعال لحظة. حسنًا، ⁨{price}⁩."
en = "Hey, hey, come back a sec. Alright, {price}."

[[lines]]
situation = "call_back"
text = "Eh, Kak, tunggu. {price} boleh, deh."
arz = "استنى يا أستاذ. ⁨{price}⁩ ماشي."
ar = "انتظر يا أخي. ⁨{price}⁩ لا بأس."
en = "Hey, wait. {price} is fine, then."

[[lines]]
situation = "call_back"
text = "Kak, balik dulu. Buat penglaris, {price} aja."
arz = "ارجع يا أستاذ. عشان الاستفتاح، ⁨{price}⁩ بس."
ar = "عُد يا أخي. من أجل الاستفتاح، ⁨{price}⁩ فقط."
en = "Come back. For my first sale of the day, just {price}."

[[lines]]
situation = "final"
text = "Itu udah harga pas, Kak: {price}. Nggak bisa kurang lagi."
arz = "ده آخر سعر يا أستاذ: ⁨{price}⁩. مينفعش أنزل أكتر من كده."
ar = "هذا هو السعر النهائي يا أخي: ⁨{price}⁩. لا يمكن أن ينزل أكثر."
en = "That's the fixed price: {price}. It can't go any lower."

[[lines]]
situation = "final"
text = "Udah pas, Kak, {price}. Beneran nggak bisa kurang."
arz = "ده السعر المظبوط يا أستاذ، ⁨{price}⁩. والله ما ينفع أقل."
ar = "هذا هو السعر يا أخي، ⁨{price}⁩. حقًا لا يمكن أقل."
en = "It's already the right price, {price}. Really, no lower."

[[lines]]
situation = "final"
text = "{price} pas, Kak. Itu harga terakhir."
arz = "⁨{price}⁩ بالظبط يا أستاذ. ده آخر سعر."
ar = "⁨{price}⁩ بالضبط يا أخي. هذا آخر سعر."
en = "{price} flat. That's my last price."

[[lines]]
situation = "let_go"
text = "Ya udah, nggak apa-apa, Kak. Makasih, mampir lagi, ya."
arz = "خلاص، ولا يهمك يا أستاذ. شكرًا، وعدّي علينا تاني."
ar = "حسنًا، لا بأس يا أخي. شكرًا، ومرّ بنا مرة أخرى."
en = "Alright, no problem. Thanks, come by again."

[[lines]]
situation = "let_go"
text = "Oke, Kak. Lain kali mampir lagi, ya."
arz = "ماشي يا أستاذ. المرة الجاية عدّي علينا تاني."
ar = "حسنًا يا أخي. مرّ بنا مرة أخرى في المرة القادمة."
en = "Okay. Drop by again next time."

[[lines]]
situation = "let_go"
text = "Nggak apa-apa, Kak. Hati-hati di jalan."
arz = "ولا يهمك يا أستاذ. توصل بالسلامة."
ar = "لا بأس يا أخي. في أمان الله."
en = "No worries. Take care on the way."

