]
ar = [
  "أصبحنا جاهزين يا ⁨{name}⁩. {minutes|دقيقة|دقيقتان|دقائق} في اليوم، وسترى الفرق. ⁨Ayo⁩، أي هيا بنا.",
  "حسنًا يا ⁨{name}⁩، خطتك جاهزة: {minutes|دقيقة|دقيقتان|دقائق} كل يوم. ⁨Selamat datang⁩، أي أهلًا بك في ⁨Kabar⁩.",
]
en = [
