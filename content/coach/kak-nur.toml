# Kak Nur's voice: every line the coach says, in Egyptian Arabic (ar-eg),
# Modern Standard Arabic (ar) and English (en). Format, placeholders and tone
# rules: see README.md in this folder. Rendered by crates/core/src/coach/voice.rs,
# whose tests are the content gate.
#
# ⁨ … ⁩ are FSI … PDI (first-strong isolate … pop directional
# isolate). Every Latin snippet and every text placeholder inside an Arabic
# line sits between them so right-to-left text renders correctly.

reviewed = false
version = 1

# --- Onboarding -------------------------------------------------------------

[lines.onboard_hello]
moment = "First screen of onboarding: Kak Nur introduces themself and asks for a name."
placeholders = []
ar-eg = [
  "أهلاً بيك! أنا ⁨Kak Nur⁩. ⁨Kak⁩ يعني الأخ أو الأخت الكبيرة بالإندونيسي، و⁨Nur⁩ يعني «نور». أحب أناديك بإيه؟",
  "⁨Halo⁩، يعني أهلاً. أنا ⁨Kak Nur⁩، وهكون معاك خطوة بخطوة في الرحلة دي. قولّي اسمك إيه؟",
]
ar = [
  "أهلًا بك. أنا ⁨Kak Nur⁩؛ و⁨Kak⁩ تعني بالإندونيسية الأخ أو الأخت الأكبر، و⁨Nur⁩ تعني «نور». بمَ تحب أن أناديك؟",
  "⁨Halo⁩، أي مرحبًا. أنا ⁨Kak Nur⁩، وسأرافقك في هذه الرحلة خطوة بخطوة. ما اسمك؟",
]
en = [
  "Halo! I'm Kak Nur. Kak is what Indonesians call an older sibling, and Nur means light. What should I call you?",
  "Hi, I'm Kak Nur, and I'll walk this road with you one step at a time. What's your name?",
]

[lines.onboard_why]
moment = "Onboarding: why are you learning? (several motivations, plus an optional note)"
placeholders = ["name"]
ar-eg = [
  "تشرفنا يا ⁨{name}⁩. إيه اللي شدّك للإندونيسي؟ اختار كل اللي ينطبق، ولو حابب اكتب بكلامك.",
  "يا أهلاً يا ⁨{name}⁩. كل واحد وليه سببه: سفر، شغل، أصحاب، أفلام… سببك إنت إيه؟",
]
ar = [
  "تشرفنا يا ⁨{name}⁩. ما الذي جذبك إلى الإندونيسية؟ اختر كل ما ينطبق، ويمكنك أن تكتب بكلماتك أيضًا.",
  "أهلًا يا ⁨{name}⁩. لكلٍّ سببه: سفر، أو عمل، أو أصدقاء، أو أفلام… فما سببك أنت؟",
]
en = [
  "Nice to meet you, {name}. What draws you to Indonesian? Pick everything that fits, and add your own words if you like.",
  "Welcome, {name}. Everyone has their reason: travel, work, friends, films… What's yours?",
]

[lines.onboard_focus]
moment = "Onboarding: Indonesian, Javanese, or both?"
placeholders = []
ar-eg = [
  "نبدأ بإيه؟ الإندونيسي هو الأساس، والجاوي (⁨Bahasa Jawa⁩) هو لغة البيت في جاوة. ممكن تاخد الاتنين، على راحتك.",
  "عايز تركّز على الإندونيسي، ولا الجاوي، ولا الاتنين مع بعض؟ مفيش اختيار غلط، وتقدر تغيّره بعدين.",
]
ar = [
  "بمَ نبدأ؟ الإندونيسية هي الأساس، والجاوية (⁨Bahasa Jawa⁩) لغة البيت في جاوة. يمكنك أن تتعلم الاثنتين على مهل.",
  "هل تريد التركيز على الإندونيسية، أم الجاوية، أم الاثنتين معًا؟ لا يوجد اختيار خاطئ، ويمكنك تغييره لاحقًا.",
]
en = [
  "Where shall we start? Indonesian is the foundation, and Javanese (Bahasa Jawa) is the language of home in Java. You can take both, at your own pace.",
  "Indonesian, Javanese, or both together? There's no wrong choice, and you can change it later.",
]

[lines.onboard_minutes]
moment = "Onboarding: the usual daily size (5, 15 or 30 minutes)."
placeholders = ["name"]
ar-eg = [
  "⁨{name}⁩، خلينا نختار مقاس يومك: خمس دقايق، ولا ربع ساعة، ولا نص ساعة؟ اختار اللي تقدر تكمّل عليه، مش اللي يتعبك.",
  "قد إيه في اليوم يريّحك؟ خمس دقايق، ربع ساعة، ولا نص ساعة؟ شوية كل يوم أحسن من كتير مرة واحدة. ⁨Sedikit demi sedikit⁩، يعني شوية بشوية.",
]
ar = [
  "كم من وقتك يناسبك يوميًا؟ خمس دقائق، أم ربع ساعة، أم نصف ساعة؟ اختر ما تستطيع الاستمرار عليه، لا ما يرهقك.",
  "قليل دائم خير من كثير منقطع. خمس دقائق في اليوم، أم ربع ساعة، أم نصف ساعة؟ ⁨Sedikit demi sedikit⁩، أي شيئًا فشيئًا.",
]
en = [
  "How much time suits you each day: 5, 15 or 30 minutes? Pick what you can keep doing, not what wears you out.",
  "A little every day beats a lot once in a while. 5, 15 or 30 minutes a day? Sedikit demi sedikit: little by little.",
]

[lines.onboard_target]
moment = "Onboarding: Kak Nur suggests a realistic target, e.g. BIPA 2 by a date."
placeholders = ["level", "date"]
ar-eg = [
  "إيه رأيك نحط هدف: ⁨{level}⁩ قبل ⁨{date}⁩؟ ده هدف واقعي على قد وقتك، وتقدر تغيّره في أي وقت.",
  "اقتراحي: نوصل ⁨{level}⁩ حوالين ⁨{date}⁩. لو حاسس إنه كتير أو قليل، عدّله على راحتك.",
]
ar = [
  "ما رأيك في هدف: ⁨{level}⁩ قبل ⁨{date}⁩؟ إنه هدف واقعي بحسب وقتك، ويمكنك تغييره متى شئت.",
  "أقترح أن نصل إلى ⁨{level}⁩ في حدود ⁨{date}⁩. إن بدا لك كثيرًا أو قليلًا، فعدّله كما تحب.",
]
en = [
  "How about a target: {level} by {date}? It's realistic for your pace, and you can change it any time.",
  "My suggestion: reach {level} around {date}. If that feels like too much or too little, adjust it freely.",
]

[lines.onboard_times]
moment = "Onboarding: preferred study times."
placeholders = []
ar-eg = [
  "إمتى عادةً بتبقى فاضي؟ اختار وقت أو اتنين، وأنا هتعلّم مواعيدك الحقيقية مع الوقت.",
  "الصبح، بعد الشغل، ولا قبل النوم؟ قولّي أنسب وقت للمذاكرة، وأنا هظبط نفسي عليه.",
]
ar = [
  "متى تكون متفرغًا عادةً؟ اختر وقتًا أو وقتين، وسأتعلم مواعيدك الفعلية مع الوقت.",
  "صباحًا، أم بعد العمل، أم قبل النوم؟ أخبرني بأنسب وقت للدراسة، وسأتكيّف معه.",
]
en = [
  "When are you usually free? Pick a time or two, and I'll learn your real rhythm as we go.",
  "Morning, after work, or before bed? Tell me when studying suits you best, and I'll fit around it.",
]

[lines.onboard_reminders]
moment = "Onboarding: reminder style (gentle, steady, off)."
placeholders = []
ar-eg = [
  "تحب أفكّرك إزاي؟ تذكير هادي مرة في اليوم، ولا في كل ميعاد اخترته، ولا من غير تذكير خالص؟ ولما تخلّص هدف اليوم على أي جهاز، كل الأجهزة هتسكت.",
  "أنا مش هزنّ عليك. اختار: تذكير واحد لطيف، ولا في مواعيدك، ولا ولا حاجة. وفي أي وقت تقدر تأجّله بلمسة.",
]
ar = [
  "كيف تحب أن أذكّرك؟ تذكير هادئ مرة في اليوم، أم في كل موعد اخترته، أم بلا تذكير؟ وحين تُنهي هدف اليوم على أي جهاز، تسكت الأجهزة كلها.",
  "لن ألحّ عليك. اختر: تذكيرًا واحدًا لطيفًا، أو تذكيرًا في مواعيدك، أو لا شيء. ويمكنك تأجيله بلمسة واحدة في أي وقت.",
]
en = [
  "How would you like reminders? One gentle nudge a day, one at each time you picked, or none at all? Once today's goal is done on any device, they all go quiet.",
  "I won't nag. Choose one gentle reminder, one at each of your times, or none. You can snooze any of them with a single tap.",
]

[lines.onboard_start]
moment = "Onboarding: where to start, then a two-minute placement chat with Mas Ardi."
placeholders = []
ar-eg = [
  "آخر حاجة: دردشة صغيرة دقيقتين مع ⁨Mas Ardi⁩ عشان نعرف نبدأ منين. دي مش امتحان، مجرد تعارف.",
  "تعرف شوية إندونيسي قبل كده؟ اختار أقرب وصف ليك، و⁨Mas Ardi⁩ هيدردش معاك دقيقتين عشان نظبط نقطة البداية.",
]
ar = [
  "أمر أخير: محادثة قصيرة مدتها دقيقتان مع ⁨Mas Ardi⁩ لنعرف من أين نبدأ. ليست امتحانًا، بل مجرد تعارف.",
  "هل تعرف شيئًا من الإندونيسية من قبل؟ اختر أقرب وصف لك، وسيحادثك ⁨Mas Ardi⁩ دقيقتين لنضبط نقطة البداية.",
]
en = [
