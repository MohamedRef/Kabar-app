  # ---------- essays (p418) ----------
  - id: hb.L20.112
    kind: essay
    topic: practical-advice
    prompt: What would you advise your hepatic patient regarding eating?
    outline:
      - Energy and protein:
          - "≥35 kcal/kg actual BW/day (non-obese); protein 1.2–1.5 g/kg/day; do not restrict protein"
      - Meal pattern:
          - 3 main meals + 3 snacks; late-evening snack most important; include breakfast
      - Food choices:
          - Only alcohol is contraindicated; plenty of fruit and vegetables
          - Salt restriction with ascites (80 mmol Na = 5 g salt/day), keep food palatable
          - In HE, vegetable and dairy protein are better tolerated
      - Special cases:
          - "Obese: −500 to −800 kcal/day, protein >1.5 g/kg ideal BW, ≥5–10% weight loss, exercise"
          - Vitamin D, calcium; report reduced intake to doctor or dietician
    src: { page: 418 }
    status: unverified
    tags: [book-question]
  - id: hb.L20.113
    kind: essay
    topic: he
    prompt: What is the role of sarcopenia in hepatic encephalopathy?
    outline:
      - Link:
          - Muscle mass is inversely related to blood ammonia; HE is more common in malnourished cirrhotics
          - Hyperammonaemia impairs muscle function and causes more muscle loss (vicious circle)
      - Mechanisms of sarcopenia:
          - Accelerated starvation, hyperammonaemia, myostatin, endotoxin, low testosterone/GH, mitochondrial dysfunction
      - Management:
          - Assess nutrition and sarcopenia in HE; avoid protein restriction; same energy/nitrogen as other cirrhotics
          - Vegetable and dairy protein, BCAA, late-evening snack, exercise
    src: { page: 418 }
    status: unverified
    tags: [book-question]
  - id: hb.L20.114
    kind: order
    topic: screening
    prompt: Nutritional screening and assessment pathway in cirrhosis
    steps:
      - Correct body weight for fluid retention (dry weight)
      - Calculate Child–Pugh and BMI
      - Classify risk (high if BMI <18.5 or Child C; screening tool otherwise)
      - Detailed assessment by dietician and assessment of sarcopenia
      - Treat with nutritional supplementation and reassess every 1–3 months in the first year
    src: { page: 406 }
