  # ---------- cases ----------
  - id: hb.L20.109
    kind: case
    topic: screening
    stem: A 62-year-old man with HCV cirrhosis, Child–Pugh B9, comes to clinic. He has moderate ascites. Scale weight 75 kg, height 1.75 m.
    steps:
      - question: How do you get his weight for nutritional calculations?
        options: ["Use 75 kg", "Subtract 10% (moderate ascites): about 67.5 kg", "Subtract 15%: about 64 kg", "Use ideal body weight only"]
        answer: 1
        why: Without a post-paracentesis or pre-retention weight, subtract 5/10/15% for mild/moderate/severe ascites (+5% for pedal oedema).
      - reveal: Dry weight about 67.5 kg, BMI about 22 kg/m².
        question: How do you screen him?
        options: [Use a nutritional screening tool, He is automatically high risk, No screening needed, Re-screen only after decompensation]
        answer: 0
        why: BMI 18.5–29.9 and Child A/B means screening with a tool to classify low, medium or high risk.
      - reveal: The tool rates him high risk. CT done last month for HCC surveillance is available.
        question: How do you assess his muscle mass?
        options: [CT muscle area at L3, MRI of the thigh, Serum albumin, BMI only]
        answer: 0
        why: Use the CT already done for other reasons to measure skeletal muscle at L3.
      - reveal: He is sarcopenic.
        question: What are his daily energy and protein targets?
        options: ["≥35 kcal/kg and 1.2–1.5 g/kg protein", "25 kcal/kg and 0.8 g/kg protein", "20 kcal/kg and 2 g/kg protein", "45 kcal/kg and protein restriction"]
        answer: 0
        why: Not lower than 35 kcal/kg/day and 1.2–1.5 g/kg/day, plus a late-evening snack and breakfast, and exercise.
