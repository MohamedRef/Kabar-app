  - id: hb.L20.104
    kind: mcq
    topic: bone
    stem: A 55-year-old woman with PBC has a DEXA T-score of −2.8 at the lumbar spine. What is the management?
    options:
      - Calcium and 25(OH)D only, repeat DEXA in 3 years
      - Calcium and 25(OH)D plus a bisphosphonate, repeat DEXA in 1 year
      - Observation only
      - Stop ursodeoxycholic acid
      - Start corticosteroids
    answer: 1
    why:
      - That is the plan for normal BMD.
      - Correct. T-score ≤ −2.5 is osteoporosis; treat with Ca, 25(OH)D and bisphosphonates; repeat DEXA in a year.
      - Osteoporosis needs treatment.
      - UDCA is not a cause of bone loss in the lecture.
      - Corticosteroids increase bone loss.
