  # ---------- MCQs ----------
  - id: hb.L20.097
    kind: mcq
    topic: screening
    stem: A 50-year-old man with Child–Pugh C alcohol-related cirrhosis has a BMI of 24 kg/m² after paracentesis. How should his malnutrition risk be classified?
    options:
      - Low risk; re-screen in a year
      - Medium risk; use a screening tool
      - High risk; proceed to detailed nutritional assessment
      - Obese; start a hypocaloric diet
      - Not assessable until ascites resolves
    answer: 2
    why:
      - Child–Pugh C alone puts him at high risk.
      - Screening tools are for Child A/B with BMI 18.5–29.9.
      - Correct. Child–Pugh C or BMI <18.5 means high risk; do a detailed assessment.
      - BMI 24 is not obese, and hypocaloric diets are for BMI >30.
      - Dry weight can be estimated; assessment should not wait.
    src: { page: 404 }
    status: unverified
  - id: hb.L20.098
    kind: mcq
    topic: requirements
    stem: A 60-year-old woman with decompensated cirrhosis weighs 60 kg (dry). What daily protein intake should she receive?
    options:
      - 40 g
      - 50 g
      - 72–90 g
      - 120 g
      - Restrict to 0.6 g/kg because of ascites
    answer: 2
    why:
      - Below 0.7 g/kg; too low.
      - Below the 1.2 g/kg minimum.
      - Correct. 1.2–1.5 g/kg × 60 kg = 72–90 g/day.
      - 2 g/kg is the target only for obese patients on tube feeding after LT (ideal weight).
      - Protein restriction is not advisable in cirrhosis.
    src: { page: 407 }
    status: unverified
    tags: [numbers]
  - id: hb.L20.099
    kind: mcq
    topic: practical-advice
    stem: A patient with cirrhosis asks how to space his meals. What is the best advice?
    options:
      - Two large meals a day to rest the liver
      - Three main meals and three snacks, with a late-evening snack as the most important
      - Fasting overnight for 12 hours to reduce ammonia
      - Avoid breakfast and eat a large lunch
      - Only liquid supplements
    answer: 1
    why:
      - Long gaps worsen the accelerated starvation of cirrhosis.
      - Correct. Split intake into 3 meals and 3 snacks; the late-evening snack matters most.
      - Overnight fasting worsens proteolysis; the late snack shortens it.
      - Breakfast is specifically recommended.
      - Normal food is preferred; supplements are added, not substituted.
    src: { page: 407 }
    status: unverified
  - id: hb.L20.100
    kind: mcq
    topic: he
    stem: A 58-year-old man with cirrhosis is admitted with grade II hepatic encephalopathy. He is eating. What is the right nutritional plan?
    options:
      - Stop all protein for 72 hours
      - Restrict protein to 0.5 g/kg/day
      - Keep normal energy and protein intake, favouring vegetable and dairy protein
      - Give only intravenous glucose
      - Insert a PEG tube
    answer: 2
    why:
      - Protein restriction should be avoided in HE.
      - Protein should not be lower than the general 1.2–1.5 g/kg.
      - Correct. HE needs the same energy and nitrogen as other cirrhotics; encourage vegetable and dairy protein.
      - He can eat; oral intake is preferred.
      - PEG is avoided in cirrhosis because of bleeding risk.
    src: { page: 413 }
    status: unverified
  - id: hb.L20.101
    kind: mcq
    topic: obesity
    stem: A 52-year-old woman with compensated MASH cirrhosis has a BMI of 34 kg/m² with no fluid retention. Which plan matches the guideline in the lecture?
    options:
      - No dietary change; obesity protects against malnutrition
      - A moderately hypocaloric diet (−500 to −800 kcal/day) with protein >1.5 g/kg ideal BW, aiming for ≥5–10% weight loss
      - A very low calorie diet with protein restriction
      - 35 kcal/kg actual BW and 1.2 g/kg actual BW
      - Bariatric surgery for everyone
    answer: 1
    why:
      - Obesity does not rule out malnutrition, and weight loss improves outcomes.
      - Correct. Tailored hypocaloric diet, adequate protein, supervised moderate exercise.
      - Protein restriction would worsen sarcopenia.
      - 35 kcal/kg actual BW is for non-obese patients.
      - Not part of the lecture's recommendations.
    src: { page: 412 }
    status: unverified
  - id: hb.L20.102
    kind: mcq
    topic: critical
    stem: A man with cirrhosis was admitted 12 hours ago with variceal bleeding, now controlled after band ligation. When should enteral feeding start?
    options:
      - Immediately
      - After 48–72 hours
      - After 7 days
      - Only after a PEG is placed
      - Never; use parenteral nutrition only
    answer: 1
    why:
      - Early feeding risks raised portal pressure and re-bleeding.
      - Correct. Withhold enteral nutrition for 48–72 h after acute bleeding.
      - Too long; prolonged fasting worsens starvation.
      - PEG should be avoided in cirrhosis.
      - Enteral feeding is preferred once the window has passed.
