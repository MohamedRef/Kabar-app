  - id: hb.L20.110
    kind: case
    topic: he
    stem: A 66-year-old woman with cirrhosis is admitted confused and drowsy (grade III HE). She cannot swallow safely. Her family says she was put on a "no meat, low protein" diet last year.
    steps:
      - question: What is the link between her nutrition and HE?
        options: [Low muscle mass is linked to higher ammonia, Muscle mass does not affect ammonia, High protein causes sarcopenia, HE needs fewer calories]
        answer: 0
        why: Muscle mass and blood ammonia are inversely related; HE is more common in malnourished patients, and hyperammonaemia worsens muscle loss.
      - question: How should she be fed now?
        options: [Nasogastric tube with airway protected or parenteral, PEG tube, Nothing by mouth for 5 days, Oral protein-free diet]
        answer: 0
        why: In grade III–IV HE unable to eat, feed by NG tube (protected airway) or parenterally. PEG is avoided in cirrhosis.
      - question: Which supplement may improve her neuropsychiatric performance?
        options: [BCAA, Vitamin A, Calcium, Iron]
        answer: 0
        why: BCAA supplementation can improve neuropsychiatric performance and help reach nitrogen targets.
      - reveal: She recovers and goes home.
        question: What protein advice do you give?
        options: ["Do not restrict protein; prefer vegetable and dairy proteins", "Keep the low-protein diet", "Avoid all dairy", "Protein only at breakfast"]
        answer: 0
        why: Avoid protein restriction; nitrogen needs are the same as without HE, and vegetable and dairy protein are better tolerated.
    src: { page: 413 }
    status: unverified
