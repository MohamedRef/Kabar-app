  # --- MCQs ---
  - id: hb.L04.115
    kind: mcq
    topic: budd-chiari
    stem: A 28-year-old woman on oral contraceptives has 3 weeks of right upper quadrant pain, tender hepatomegaly and ascites. The JVP is not raised and hepatojugular reflux is negative. What is the first-line investigation?
    options:
      - Doppler ultrasound of the hepatic veins
      - Transjugular liver biopsy
      - Hepatic venography
      - Echocardiography
      - Upper endoscopy
    answer: 0
    why:
      - Correct. Pain, hepatomegaly and ascites with negative hepatojugular reflux suggests BCS; Doppler US is first line (p70).
      - Biopsy is for SOS when criteria are not met, not first-line for BCS.
      - Invasive; CT/MRI confirm after Doppler.
      - Negative hepatojugular reflux and a normal JVP argue against a cardiac cause.
      - Endoscopy screens for varices later; it does not diagnose the cause.
    src: { page: 70 }
    status: unverified
  - id: hb.L04.116
    kind: mcq
    topic: budd-chiari
    stem: A 32-year-old man with Budd-Chiari syndrome from a JAK2 V617F-positive myeloproliferative neoplasm has been stabilised. Which anticoagulation plan does the lecture recommend?
    options:
      - LMWH for at least 5–7 days with a VKA (INR 2–3), continued indefinitely
      - LMWH for 3 months, then stop
      - VKA for 6 months only
      - Aspirin alone
      - No anticoagulation while he has ascites
    answer: 0
    why:
      - Correct. Anticoagulate as soon as possible, indefinitely, with LMWH then VKA at INR 2–3 (p71).
      - BCS needs indefinite anticoagulation.
      - Six months is the minimum for acute PVT, not BCS.
      - Antiplatelets alone are not the recommended therapy.
      - Treated portal hypertension complications are not a contraindication.
    src: { page: 71 }
    status: unverified
  - id: hb.L04.117
    kind: mcq
    topic: budd-chiari
    stem: A woman with BCS on anticoagulation still has symptoms. Imaging shows a short segmental stenosis of the right hepatic vein. What is the best next decompressive procedure?
    options:
      - Angioplasty with stenting
      - Surgical portocaval shunt
      - Liver transplantation
      - TIPS
      - Systemic thrombolysis
    answer: 0
    why:
      - Correct. Angioplasty/stenting is first line for short hepatic vein thrombosis or stenosis (p72).
      - Surgical shunts show no survival benefit and are discussed only when TIPS fails (p73).
      - Transplant is the last step.
      - TIPS follows failed or unsuitable angioplasty in the stepwise algorithm.
      - Thrombolysis experience is limited.
    src: { page: 72 }
    status: unverified
  - id: hb.L04.118
    kind: mcq
    topic: acute-pvt
    stem: A 40-year-old man has 5 days of abdominal pain and low-grade fever. CT shows a recent thrombus in the main portal vein without cirrhosis or malignancy. Bowel looks viable. Which is the most appropriate initial treatment?
    options:
      - Immediate LMWH
      - Observation and repeat CT in 6 months
      - Aspirin
      - TIPS
      - Surgical thrombectomy
    answer: 0
    why:
      - Correct. Start immediate LMWH unless there is a major contraindication (p75).
      - Waiting risks extension to the mesenteric veins and no recanalization.
      - Antiplatelets are not the treatment.
      - TIPS is not first line in acute non-cirrhotic PVT.
      - Surgery is not part of the recommended management.
    src: { page: 75 }
    status: unverified
  - id: hb.L04.119
    kind: mcq
    topic: acute-pvt
    stem: A patient with acute PVT, on LMWH for 4 days, develops persisting severe abdominal pain, rectal bleeding and rising lactate. What should be suspected?
    options:
      - Intestinal infarction from mesenteric extension
      - Heparin-induced thrombocytopenia
      - Variceal bleeding
      - Spontaneous bacterial peritonitis
      - Peptic ulcer from stress
    answer: 0
    why:
      - Correct. Persisting severe pain, rectal bleeding, ascites or multiorgan dysfunction suggest intestinal infarction (p74).
      - HIT shows a platelet fall; it does not explain rectal bleeding with ischaemic pain.
      - Varices are a late feature of non-recanalized PVT, and would cause hematemesis.
      - No ascites or fever is described.
      - Rectal bleeding with severe pain fits ischaemia better.
    src: { page: 74 }
    status: unverified
  - id: hb.L04.120
    kind: mcq
    topic: incph
    stem: A 35-year-old man has splenomegaly, thrombocytopenia and oesophageal varices. Liver tests are near normal, viral and autoimmune screens are negative, and portal and hepatic veins are patent. Liver stiffness is 8 kPa. Which test is required to confirm the likely diagnosis?
    options:
      - Liver biopsy
      - Repeat transient elastography
      - JAK2 V617F mutation
      - Hepatic venography
      - CT angiography
    answer: 0
    why:
      - Correct. This suggests INCPH (low stiffness < 12 kPa); diagnosis requires biopsy to exclude cirrhosis (p77–78).
      - Elastography gives a clue but cannot exclude cirrhosis by itself.
      - JAK2 is tested in BCS and PVT; his veins are patent.
      - Patent veins already exclude BCS.
      - Imaging shows patent vessels but cannot exclude cirrhosis histologically.
    src: { page: 77 }
    status: unverified
  - id: hb.L04.121
    kind: mcq
    topic: sos
    stem: Twelve days after myeloablative conditioning with busulfan and cyclophosphamide for HSCT, a patient gains 4 kg and develops tender hepatomegaly and jaundice. What is the most likely diagnosis?
    options:
      - Sinusoidal obstruction syndrome
      - Budd-Chiari syndrome
      - Acute portal vein thrombosis
      - Idiopathic non-cirrhotic portal hypertension
      - Acute viral hepatitis
    answer: 0
    why:
      - Correct. Two or more of weight gain, ascites, tender hepatomegaly and jaundice within 20 days of BMT (Seattle/Baltimore) suggests SOS; busulfan and cyclophosphamide are culprits (p80–81).
      - BCS obstructs the large hepatic veins; the HSCT setting and timing point to SOS.
      - Acute PVT presents with pain and SIRS, not jaundice and weight gain after conditioning.
      - INCPH is chronic, with normal liver function.
      - Possible, but the timing after conditioning fits SOS best.
    src: { page: 81 }
    status: unverified
  - id: hb.L04.122
    kind: mcq
    topic: sos
    stem: A haematology team plans HSCT for a patient with pre-existing liver disease and previous SOS. Which drug does the lecture recommend to prevent SOS?
    options:
      - Defibrotide
      - Warfarin
      - Unfractionated heparin
      - Rivaroxaban
      - Prednisolone
