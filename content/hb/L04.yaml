schema: batna.content/v1
lecture: hb.L04
title: Vascular Diseases of the Liver, Anticoagulation in Liver Disease, and Endoscopy
author: Dr. Hend Naguib
book: { chapter: 1, pages: [65, 89] }
topics:
  - { id: overview, title: "Vascular liver diseases overview" }
  - { id: risk-factors, title: "Prothrombotic risk factors in BCS and PVT" }
  - { id: budd-chiari, title: "Budd-Chiari syndrome" }
  - { id: acute-pvt, title: "Acute portal vein thrombosis (non-cirrhotic)" }
  - { id: ehpvo, title: "Extrahepatic portal vein obstruction" }
  - { id: incph, title: "Idiopathic non-cirrhotic portal hypertension" }
  - { id: sos, title: "Sinusoidal obstruction syndrome" }
  - { id: pvt-cirrhosis, title: "PVT in cirrhosis" }
  - { id: anticoagulation, title: "Anticoagulants in liver disease" }
  - { id: endoscopy-antithrombotics, title: "Antithrombotics and endoscopy" }
items:
  # --- Overview (p66-67) ---
  - id: hb.L04.001
    kind: cloze
    topic: overview
    text: Vascular liver diseases are a collection of rare conditions, each affecting fewer than {{c1::5 per 10,000}} people.
    src: { page: 66 }
    status: unverified
    tags: [numbers]
  - id: hb.L04.002
    kind: card
    topic: overview
    front: Common characteristic shared by many vascular liver diseases?
    back: Non-cirrhotic portal hypertension.
    src: { page: 66 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.003
    kind: card
    topic: overview
    front: Why is adequate management of vascular liver disease so important?
    back: Patients are usually young, so poor management reduces life expectancy.
    src: { page: 66 }
    status: unverified
  - id: hb.L04.004
    kind: enumerate
    topic: overview
    prompt: Enumerate the vascular liver disorders covered in the lecture.
    points:
      - Budd-Chiari syndrome
      - Acute portal vein thrombosis (non-cirrhotic)
      - Extrahepatic portal vein obstruction (non-cirrhotic)
      - Idiopathic non-cirrhotic portal hypertension
      - Hepatic vascular malformations
      - Sinusoidal obstruction syndrome
    pass: 5
    src: { page: 67 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.005
    kind: card
    topic: overview
    front: Which veins join to form the portal vein (book figure)?
    back: The splenic vein and the superior mesenteric vein; the inferior mesenteric vein drains into the splenic vein.
    src: { page: 66 }
    status: unverified

  # --- Risk factors (p67-69) ---
  - id: hb.L04.006
    kind: card
    topic: risk-factors
    front: Leading cause of BCS and PVT among the uncommon prothrombotic disorders?
    back: Myeloproliferative neoplasms.
    src: { page: 67, quote: "Myeloproliferative neoplasms are the leading cause." }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.007
    kind: enumerate
    topic: risk-factors
    prompt: Mention the risk-factor groups for Budd-Chiari syndrome and portal vein thrombosis (book table).
    points:
      - Thrombophilia, inherited or acquired
      - Myeloproliferative neoplasm (JAK2V617F positive)
      - Hormonal factors (oral contraceptives, pregnancy)
      - Paroxysmal nocturnal hemoglobinuria
      - Other systemic factors
      - Local factors
    pass: 5
    src: { page: 67 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.008
    kind: card
    topic: risk-factors
    front: Mutation typical of myeloproliferative disease in splanchnic vein thrombosis, and why can the blood film mislead?
    back: JAK2 V617F. Portal hypertension (hypersplenism) can mask the usual peripheral blood features.
    src: { page: 68 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.009
    kind: enumerate
    topic: risk-factors
    prompt: Mention the acquired prothrombotic diseases associated with BCS, PVT or obliterative portal venopathy.
    points:
      - Myeloproliferative disease (JAK2 V617F)
      - Antiphospholipid syndrome
      - Paroxysmal nocturnal hemoglobinuria (BCS)
      - Behcet's disease (BCS)
      - Inflammatory bowel disease
      - Celiac disease (BCS)
      - Sarcoidosis
    pass: 5
    src: { page: 68 }
    status: unverified
  - id: hb.L04.010
    kind: cloze
    topic: risk-factors
    text: "Acquired diseases linked specifically to Budd-Chiari syndrome in the book: {{c1::paroxysmal nocturnal hemoglobinuria}}, {{c2::Behcet's disease}} and {{c3::celiac disease}}."
    src: { page: 68 }
    status: unverified
  - id: hb.L04.011
    kind: card
    topic: risk-factors
    front: Why interpret anticardiolipin antibodies cautiously in liver disease?
    back: Non-specific anticardiolipin antibodies are frequent in liver disease.
    src: { page: 68 }
    status: unverified
  - id: hb.L04.012
    kind: enumerate
    topic: risk-factors
    prompt: Mention the inherited thrombophilias associated with BCS and PVT.
    points:
      - Protein C deficiency
      - Protein S deficiency
      - Antithrombin deficiency
      - Factor V Leiden
      - Prothrombin (factor II) G20210A mutation
    pass: 4
    src: { page: 68 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.013
    kind: card
    topic: risk-factors
    front: Which thrombophilia markers are hard to interpret in liver dysfunction, and why?
    back: Protein C, protein S and antithrombin deficiency, and hyperhomocysteinemia. Liver dysfunction can cause secondary changes that are difficult to rule out.
    src: { page: 68 }
    status: unverified
  - id: hb.L04.014
    kind: enumerate
    topic: risk-factors
    prompt: Mention the other (local and general) risk factors for BCS and PVT.
    points:
      - Inflammatory or malignant foci in the abdomen (PVT)
      - Injury to splanchnic veins (surgery or trauma)
      - Stasis from cirrhosis or another intrahepatic block
      - Hyperhomocysteinemia
      - Oral contraceptives
      - Pregnancy (BCS)
      - Extreme poverty
    pass: 5
    src: { page: 69 }
    status: unverified
  - id: hb.L04.015
    kind: card
    topic: risk-factors
    front: If one prothrombotic risk factor is found in BCS or PVT, should the work-up stop?
    back: No. Finding one risk factor should not stop the search for others.
    src: { page: 69 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.016
    kind: card
    topic: risk-factors
    front: How should patients with BCS or PVT be tested for a myeloproliferative neoplasm?
    back: Test for the JAK2 V617F mutation.
    src: { page: 69 }
    status: unverified
  - id: hb.L04.017
    kind: enumerate
    topic: risk-factors
    prompt: Mention what thrombophilia screening in BCS and PVT should include.
    points:
      - Protein S level
      - Protein C level
      - Antithrombin level
      - Factor V Leiden mutation
      - Prothrombin gene variant
      - Antiphospholipid antibodies
    pass: 5
    src: { page: 69 }
    status: unverified
  - id: hb.L04.018
    kind: cloze
    topic: risk-factors
    text: A positive antiphospholipid antibody test should be repeated after {{c1::12 weeks}}.
    src: { page: 69 }
    status: unverified
    tags: [numbers]

  # --- Budd-Chiari syndrome (p69-74) ---
  - id: hb.L04.019
    kind: card
    topic: budd-chiari
    front: Define Budd-Chiari syndrome.
    back: Obstruction of hepatic venous outflow located anywhere from the small hepatic venules up to the entrance of the IVC into the right atrium.
    src: { page: 69 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.020
    kind: card
    topic: budd-chiari
    front: Primary vs secondary Budd-Chiari syndrome?
    back: Primary BCS is caused by thrombosis. Secondary BCS has other causes, such as malignant invasion.
    src: { page: 70 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.021
    kind: enumerate
    topic: budd-chiari
    prompt: Mention the pathophysiological consequences of hepatic venous outflow obstruction.
    points:
      - Sinusoidal congestion
      - Liver ischaemia
      - Hepatocellular necrosis
    pass: 3
    src: { page: 70 }
    status: unverified
  - id: hb.L04.022
    kind: card
    topic: budd-chiari
    front: Classic triad of chronic Budd-Chiari syndrome, and the hepatojugular reflux finding?
    back: Abdominal pain, hepatomegaly and ascites, with a negative hepatojugular reflux. Liver failure and portal hypertension follow.
    src: { page: 70 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.023
    kind: card
    topic: budd-chiari
    front: Range of clinical pictures in BCS, and the acute form?
    back: From asymptomatic to fulminant liver failure. The acute form presents as acute liver failure.
    src: { page: 70 }
    status: unverified
  - id: hb.L04.024
    kind: cloze
    topic: budd-chiari
    text: "{{c1::Doppler ultrasound}} is the first-line investigation for BCS; {{c2::MRI and CT}} confirm the diagnosis."
    src: { page: 70 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.025
    kind: order
    topic: budd-chiari
    prompt: Put the stepwise therapeutic algorithm for Budd-Chiari syndrome in order.
    steps:
      - Medical treatment (anticoagulation, treat the cause, treat portal hypertension)
      - Angioplasty, stenting or thrombolysis
      - TIPS
      - Liver transplantation
    src: { page: 71 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.026
    kind: card
    topic: budd-chiari
    front: When should anticoagulation start in BCS, and for how long?
    back: As soon as possible, for an indefinite period.
    src: { page: 71 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.027
    kind: cloze
    topic: budd-chiari
    text: In BCS, give LMWH for at least {{c1::5–7 days}} together with a VKA, aiming at an INR of {{c2::2–3}}.
    src: { page: 71 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L04.028
    kind: card
    topic: budd-chiari
    front: Two reasons prompt anticoagulation matters in BCS?
    back: It reduces the risk of clot extension and of new thrombotic episodes.
    src: { page: 71 }
    status: unverified
  - id: hb.L04.029
    kind: card
    topic: budd-chiari
    front: Are portal hypertension complications a contraindication to anticoagulation in BCS?
    back: No, provided they are adequately treated.
    src: { page: 71 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.030
    kind: card
    topic: budd-chiari
    front: What should be done with anticoagulation in BCS before an invasive procedure such as paracentesis?
    back: Consider a brief interruption.
    src: { page: 71 }
    status: unverified
  - id: hb.L04.031
    kind: cloze
    topic: budd-chiari
    text: Angioplasty/stenting is the definitive treatment for fewer than {{c1::10%}} of Western BCS patients.
    src: { page: 72 }
    status: unverified
    tags: [numbers]
  - id: hb.L04.032
    kind: card
    topic: budd-chiari
    front: In which BCS patients is angioplasty/stenting the first-line decompressive procedure?
    back: Those with short-length hepatic vein thrombosis or IVC stenosis (partial or segmental obstruction).
    src: { page: 72 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.033
    kind: card
    topic: budd-chiari
    front: Main problem after angioplasty in BCS, and how is it reduced?
    back: Frequent re-stenosis, reduced by combining angioplasty with a stent.
    src: { page: 72 }
    status: unverified
  - id: hb.L04.034
    kind: card
    topic: budd-chiari
    front: Advantage of angioplasty/stenting over shunts in BCS?
    back: It can re-establish physiological drainage of portal and sinusoidal blood.
    src: { page: 72 }
    status: unverified
  - id: hb.L04.035
    kind: card
    topic: budd-chiari
    front: Why is TIPS preferred over surgical shunts in BCS?
    back: Surgical shunts show no survival advantage, while TIPS has lower morbidity and mortality and is feasible in most patients, even with IVC obstruction or severe stenosis.
    src: { page: 73 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.036
    kind: card
    topic: budd-chiari
    front: What does TIPS do in BCS, and with what stent?
    back: It turns the portal system into an outflow tract by connecting a portal vein branch to a hepatic vein, using a PTFE-covered stent.
    src: { page: 73 }
    status: unverified
  - id: hb.L04.037
    kind: card
    topic: budd-chiari
    front: When is surgical shunting discussed in BCS?
    back: When TIPS is not feasible or fails.
    src: { page: 73 }
    status: unverified
  - id: hb.L04.038
    kind: enumerate
    topic: budd-chiari
    prompt: Mention the key points about liver transplantation in Budd-Chiari syndrome.
    points:
      - It is the last therapeutic step
      - BCS may recur after transplant
      - Anticoagulation continues after transplant in most patients
    pass: 3
    src: { page: 73 }
    status: unverified
  - id: hb.L04.039
    kind: cloze
    topic: budd-chiari
    text: Patients with BCS should be screened for HCC, which occurs in about {{c1::4%}}.
    src: { page: 74 }
    status: unverified
    tags: [numbers]
  - id: hb.L04.040
    kind: card
    topic: budd-chiari
    front: Why may BCS patients with liver nodules need referral to a specialised centre?
    back: Telling benign from malignant nodules in BCS is very difficult.
    src: { page: 74 }
    status: unverified

  # --- Acute PVT (p74-75) ---
  - id: hb.L04.041
    kind: card
    topic: acute-pvt
    front: Define acute portal vein thrombosis.
    back: Recent thrombus in the portal vein and/or its right or left branches, which may extend into the mesenteric or splenic veins. Guidelines mean PVT without malignancy or cirrhosis.
    src: { page: 74 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.042
    kind: card
    topic: acute-pvt
    front: In which patients should acute portal vein obstruction be considered?
    back: Any patient with abdominal pain.
    src: { page: 74 }
    status: unverified
  - id: hb.L04.043
    kind: cloze
    topic: acute-pvt
    text: First-line imaging for acute PVT is {{c1::Doppler ultrasound}}; {{c2::CT (portal phase)}} confirms the diagnosis and shows its extension.
    src: { page: 74 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.044
    kind: card
    topic: acute-pvt
    front: Which imaging is most sensitive for acute PVT?
    back: CT. Doppler ultrasound and MR are less sensitive.
    src: { page: 74 }
    status: unverified
  - id: hb.L04.045
    kind: cloze
    topic: acute-pvt
    text: SIRS is present in {{c1::85%}} of acute PVT patients, with mild non-specific symptoms, so the diagnosis is often missed until {{c2::cavernomatous transformation}}.
    src: { page: 74 }
    status: unverified
    tags: [numbers]
  - id: hb.L04.046
    kind: enumerate
    topic: acute-pvt
    prompt: Mention the features in acute PVT that should raise suspicion of intestinal infarction.
    points:
      - Persisting severe abdominal pain
      - Rectal bleeding
      - Moderate or massive ascites
      - Multiorgan dysfunction
    pass: 3
    src: { page: 74 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.047
    kind: card
    topic: acute-pvt
    front: Two aims of therapy in acute PVT?
    back: Prevent extension of the thrombus into the mesenteric veins and achieve portal vein recanalization.
    src: { page: 74 }
    status: unverified
  - id: hb.L04.048
    kind: card
    topic: acute-pvt
    front: First anticoagulant in acute non-cirrhotic PVT?
    back: Immediate LMWH, unless there is a major contraindication.
    src: { page: 75 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.049
    kind: cloze
    topic: acute-pvt
    text: Screen for HIT if platelets fall suddenly by {{c1::≥ 50%}} or to below {{c2::150 × 10⁹/L}}.
    src: { page: 75 }
    status: unverified
    tags: [numbers]
  - id: hb.L04.050
    kind: cloze
    topic: acute-pvt
    text: Monitor anti-Xa activity in {{c1::overweight patients, pregnancy and poor kidney function}}, targeting {{c2::0.5–0.8 IU/mL}}.
    src: { page: 75 }
    status: unverified
    tags: [numbers]
  - id: hb.L04.051
    kind: cloze
    topic: acute-pvt
    text: In acute PVT, long-term anticoagulation uses {{c1::oral VKA}} (INR 2–3) for at least {{c2::6 months}}.
    src: { page: 75 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L04.052
    kind: cloze
    topic: acute-pvt
    text: Assess recanalization with CT after {{c1::6–12 months}}. The portal vein recanalizes up to {{c2::6 months}}; mesenteric and splenic veins keep recanalizing up to {{c3::12 months}}.
    src: { page: 75 }
    status: unverified
    tags: [numbers]
  - id: hb.L04.053
    kind: card
    topic: acute-pvt
    front: Which patients with acute PVT should be screened for gastroesophageal varices?
    back: Those whose portal vein does not recanalize.
    src: { page: 75 }
    status: unverified

  # --- EHPVO (p75-77) ---
  - id: hb.L04.054
    kind: card
    topic: ehpvo
    front: What happens after acute PVT without recanalization?
    back: The portal lumen obliterates and porto-portal collaterals develop, forming a portal cavernoma (extrahepatic portal vein obstruction).
    src: { page: 75 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.055
    kind: card
    topic: ehpvo
    front: When should EHPVO be considered?
    back: In any patient with features of portal hypertension, hypersplenism or abdominal pain.
    src: { page: 75 }
    status: unverified
  - id: hb.L04.056
    kind: card
    topic: ehpvo
    front: Most frequent complication of EHPVO?
    back: GI bleeding from portal hypertension.
    src: { page: 76 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.057
    kind: order
    topic: ehpvo
    prompt: "Chronic EHPVO: order the decision on permanent anticoagulation (book flowchart)."
    steps:
      - Start prophylaxis for portal hypertension-related bleeding
      - Ask whether there is a permanent, strong prothrombotic condition; if yes, consider long-term anticoagulation
      - If not, ask about a past history of intestinal ischaemia; if yes, consider long-term anticoagulation
      - If neither, monitor
    src: { page: 77 }
    status: unverified

  # --- INCPH (p77-79) ---
  - id: hb.L04.058
    kind: card
    topic: incph
    front: Other names for idiopathic non-cirrhotic portal hypertension (INCPH)?
    back: Hepatoportal sclerosis, non-cirrhotic portal fibrosis, idiopathic portal hypertension.
    src: { page: 77 }
    status: unverified
  - id: hb.L04.059
    kind: cloze
    topic: incph
    text: A non-invasive clue to INCPH is a low liver stiffness on transient elastography, {{c1::< 12 kPa}}.
    src: { page: 77 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L04.060
    kind: card
    topic: incph
    front: Which test is needed to diagnose INCPH?
    back: Liver biopsy (to exclude cirrhosis).
    src: { page: 77 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.061
    kind: enumerate
    topic: incph
    prompt: Mention the five diagnostic criteria of INCPH (all must be fulfilled).
    points:
      - At least 1 clinical sign of portal hypertension
      - Exclusion of cirrhosis on liver biopsy
      - Exclusion of chronic liver diseases causing cirrhosis or non-cirrhotic PH
      - Exclusion of other conditions causing non-cirrhotic PH (congenital hepatic fibrosis, sarcoidosis, schistosomiasis)
      - Patent portal and hepatic veins
    pass: 5
    src: { page: 78 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.062
    kind: enumerate
    topic: incph
    prompt: Mention the clinical signs of portal hypertension accepted for the first INCPH criterion.
    points:
      - Splenomegaly or hypersplenism
      - Oesophageal varices
      - Non-malignant ascites
      - Minimally increased HVPG
      - Portovenous collaterals
    pass: 4
    src: { page: 78 }
    status: unverified
  - id: hb.L04.063
    kind: enumerate
    topic: incph
    prompt: Mention the chronic liver diseases that must be excluded before diagnosing INCPH.
    points:
      - Chronic HCV or HBV
      - NASH or ASH
      - Autoimmune hepatitis
      - Hereditary haemochromatosis
      - Wilson disease
      - Primary biliary cirrhosis (cholangitis)
    pass: 5
    src: { page: 78 }
    status: unverified
  - id: hb.L04.064
    kind: cloze
    topic: incph
    text: Endoscopic therapy controls acute variceal bleeding in {{c1::95%}} of INCPH patients; {{c2::TIPS}} is considered if bleeding is uncontrolled.
    src: { page: 79 }
    status: unverified
    tags: [numbers]
  - id: hb.L04.065
    kind: card
    topic: incph
    front: How is portal hypertension managed in INCPH?
    back: According to the guidelines for cirrhosis.
    src: { page: 79 }
    status: unverified
  - id: hb.L04.066
    kind: cloze
    topic: incph
    text: Patients with INCPH should be screened for PVT at least every {{c1::6 months}}.
    src: { page: 79 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L04.067
    kind: card
    topic: incph
    front: Is anticoagulation recommended in INCPH?
    back: Not generally. Consider it only with a clear underlying prothrombotic condition or if PVT develops.
    src: { page: 79 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.068
    kind: card
    topic: incph
    front: When is liver transplantation considered in INCPH?
    back: When liver failure or unmanageable portal hypertension complications develop.
    src: { page: 79 }
    status: unverified

  # --- SOS (p79-81) ---
  - id: hb.L04.069
    kind: card
    topic: sos
    front: Former name and defining lesion of sinusoidal obstruction syndrome?
    back: Veno-occlusive disease. It is characterised by loss of sinusoidal wall integrity.
    src: { page: 79 }
    status: unverified
  - id: hb.L04.070
    kind: enumerate
    topic: sos
    prompt: Mention the clinical settings in which SOS is a well-established complication.
    points:
      - Myeloablative regimens for haematopoietic stem cell transplantation
      - Cancer chemotherapy
      - Immunosuppression in solid organ transplantation
      - Immunosuppression in IBD
    pass: 3
    src: { page: 79 }
    status: unverified
    tags: [high-yield]
  - id: hb.L04.071
    kind: enumerate
    topic: sos
    prompt: Mention drugs and toxins associated with SOS (any 8).
    points:
      - Actinomycin D
      - Azathioprine
      - Busulfan
      - Carmustine
      - Cytosine arabinoside
      - Cyclophosphamide
      - Dacarbazine
      - Gemtuzumab ozogamicin
      - Melphalan
      - 6-Mercaptopurine
      - Mitomycin
      - Oxaliplatin
      - Pyrrolizidine alkaloids
      - Urethane
      - Terbinafine
      - Traditional herbal remedies
      - 6-Thioguanine
    pass: 8
    src: { page: 80 }
    status: unverified
  - id: hb.L04.072
    kind: card
    topic: sos
    front: Non-drug causes of SOS listed in the book?
    back: Post-bone marrow transplant, total-body irradiation, high-dose hepatic irradiation, and platelet transfusion containing ABO-incompatible plasma.
    src: { page: 80 }
    status: unverified
  - id: hb.L04.073
    kind: card
    topic: sos
    front: Herbal toxin classically causing SOS?
    back: Pyrrolizidine alkaloids (also traditional herbal remedies in general).
    src: { page: 80 }
    status: unverified
  - id: hb.L04.074
    kind: cloze
    topic: sos
    text: "Consider SOS (Seattle or Baltimore criteria) with two or more of: weight gain, ascites, tender hepatomegaly and jaundice within {{c1::20 days}} after {{c2::bone marrow transplant}}."
    src: { page: 81 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L04.075
    kind: enumerate
    topic: sos
    prompt: Mention the conditions that mimic SOS and must be excluded.
    points:
      - Acute liver graft-versus-host disease
      - Liver infections
      - Sepsis with cholestasis
      - Other drug-induced liver disease
      - Cardiac disease
      - Other causes of ascites
      - Renal failure
    pass: 5
    src: { page: 81 }
    status: unverified
  - id: hb.L04.076
    kind: card
    topic: sos
