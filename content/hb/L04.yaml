    status: unverified
  - id: hb.L04.123
    kind: mcq
    topic: pvt-cirrhosis
    stem: A 55-year-old man with Child A HCV cirrhosis on HCC surveillance has a new thrombus occluding 30% of the portal vein lumen. Three months later it has grown and extends into the superior mesenteric vein. He has large untreated varices and platelets of 90,000/µL. What should be done before starting anticoagulation?
