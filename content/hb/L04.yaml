      - Correct. Untreated varices are a bleeding risk factor and should be treated before anticoagulation; progression and SMV spread are indications (p82).
      - The bleeding threshold the book names is < 50 × 10⁹/L; 90,000 does not need transfusion.
      - Varices must be addressed first.
      - TIPS is for transplant candidates with progressive PVT despite anticoagulation (p83).
