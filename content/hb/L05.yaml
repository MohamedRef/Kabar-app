  # --- MCQs ---
  - id: hb.L05.043
    kind: mcq
    topic: diagnosis
    stem: A 34-year-old blood donor in Alexandria is found to be anti-HCV positive. He feels well and his ALT is normal. What is the next step?
    options:
      - Start sofosbuvir/velpatasvir for 12 weeks
      - Request HCV RNA by PCR
      - Request HCV genotyping
      - Arrange a liver biopsy
      - Repeat anti-HCV in 6 months
    answer: 1
    why:
      - Treatment needs confirmed viremia first; antibody alone may mean past cleared infection.
      - Correct. HCV RNA (or core antigen) confirms active infection after a positive screen.
      - Genotyping is for treatment planning and only after viremia is confirmed.
      - Biopsy is rarely used now; fibrosis is staged non-invasively.
      - Waiting delays diagnosis; confirmation is done now, not by repeating the screen.
    src: { page: 92 }
    status: unverified
  - id: hb.L05.044
    kind: mcq
    topic: management
    stem: A 62-year-old man with chronic HCV takes amiodarone for atrial fibrillation. He is about to start a sofosbuvir-based regimen. What is the main danger of this combination?
    options:
      - Severe hepatotoxicity
      - Serious bradycardia
      - Acute kidney injury
      - QT shortening and torsades
      - Loss of DAA efficacy
    answer: 1
    why:
      - Hepatotoxicity is not the interaction the lecture warns about.
      - Correct. Amiodarone is absolutely contraindicated because it can cause serious bradycardia.
      - Renal injury is not the described risk.
      - Amiodarone prolongs, not shortens, the QT; this is not the stated interaction.
      - The risk is cardiac toxicity, not reduced antiviral effect.
    src: { page: 93 }
    status: unverified
    tags: [high-yield]
  - id: hb.L05.045
    kind: mcq
    topic: daas
    stem: Which of these drugs is an NS5B polymerase inhibitor?
    options:
      - Glecaprevir
      - Velpatasvir
      - Sofosbuvir
      - Grazoprevir
      - Pibrentasvir
    answer: 2
    why:
      - Glecaprevir is an NS3/4A protease inhibitor.
      - Velpatasvir is an NS5A inhibitor.
      - Correct. Sofosbuvir inhibits the NS5B polymerase and so viral RNA replication.
      - Grazoprevir is an NS3/4A protease inhibitor.
      - Pibrentasvir is an NS5A inhibitor.
    src: { page: 93 }
    status: unverified
  - id: hb.L05.046
    kind: mcq
    topic: special
    stem: A 55-year-old woman on hemodialysis has chronic HCV (viremic, compensated liver). All DAAs are available. Which regimen does the lecture prefer?
    options:
      - Sofosbuvir + velpatasvir with reduced sofosbuvir dose
      - Glecaprevir + pibrentasvir
      - Sofosbuvir + ledipasvir plus full-dose ribavirin
      - Pegylated interferon + ribavirin
      - Defer treatment until after kidney transplant
    answer: 1
    why:
      - Sofosbuvir is better avoided in severe CKD, and the lecture never reduces its dose.
      - Correct. Glecaprevir/pibrentasvir is the preferred option in severe CKD.
      - Ribavirin needs dose adjustment below CrCl 50, so full dose is wrong.
      - Interferon regimens are toxic, long and less effective.
      - Effective safe DAAs exist; no reason to delay.
    src: { page: 94 }
    status: unverified
  - id: hb.L05.047
    kind: mcq
    topic: natural-history
    stem: A nurse has acute HCV after a needlestick injury. Which statement about her prognosis is most accurate?
    options:
      - Almost all patients clear the virus spontaneously
      - 15–45% clear the virus spontaneously; the rest become chronic
      - Chronic infection is defined as viremia beyond 4 weeks
      - About 80% develop cirrhosis within 5 years
      - HCC usually occurs without cirrhosis
    answer: 1
    why:
      - Most patients (55–85%) do not clear HCV.
      - Correct. Spontaneous clearance is 15–45%; 55–85% persist beyond 6 months.
      - Chronic means more than 6 months.
      - Cirrhosis is about 15–30% over 20 years.
      - HCC occurs mainly with cirrhosis.
    src: { page: 91 }
    status: unverified
    tags: [numbers]
  - id: hb.L05.048
    kind: mcq
    topic: management
    stem: A patient finishes 12 weeks of sofosbuvir/velpatasvir. When is cure confirmed?
    options:
      - HCV RNA undetectable at week 4 of treatment
      - HCV RNA undetectable at the end of treatment
      - HCV RNA undetectable 12 weeks after the end of treatment
      - Anti-HCV becomes negative
      - ALT normalizes
    answer: 2
    why:
      - On-treatment response is not cure.
      - End-of-treatment response can still relapse.
      - Correct. SVR12, undetectable RNA 12 weeks after treatment, equals cure.
      - Anti-HCV usually stays positive for life after cure.
      - ALT can normalize without viral clearance.
    src: { page: 92 }
    status: unverified
    tags: [high-yield]
  - id: hb.L05.049
    kind: mcq
    topic: clinical
    stem: A 50-year-old man with chronic HCV has palpable purpura, arthralgia and proteinuria with hematuria. Which extrahepatic manifestation best explains this?
    options:
      - Porphyria cutanea tarda
      - Mixed cryoglobulinemia with glomerulonephritis
      - IgA vasculitis unrelated to HCV
      - Insulin resistance
      - Non-Hodgkin lymphoma
    answer: 1
    why:
      - Not listed in the lecture, and it causes blistering, not purpura with nephritis.
      - Correct. Cryoglobulinemia and glomerulonephritis are HCV extrahepatic manifestations.
      - With chronic HCV, the HCV-related cause comes first.
      - Insulin resistance does not cause purpura or nephritis.
      - Lymphoma is HCV-related but does not explain purpura and nephritis.
    src: { page: 92 }
    status: unverified
  - id: hb.L05.050
    kind: mcq
    topic: special
    stem: A patient with HCV, Child-Pugh B decompensated cirrhosis, is to start sofosbuvir/velpatasvir. Per the lecture, how is the regimen adjusted?
    options:
      - No adjustment is needed
      - Add ribavirin or extend to 24 weeks
      - Shorten to 8 weeks
      - Halve the sofosbuvir dose
      - Add pegylated interferon
    answer: 1
    why:
      - The lecture says decompensated cirrhosis needs adjusted regimens.
      - Correct. Add ribavirin, or increase the duration to 24 weeks.
      - Shortening is for easy-to-treat patients, not decompensated ones.
      - Sofosbuvir dose is not modified.
      - Interferon is contraindicated and is the old toxic regimen.
    src: { page: 94 }
    status: unverified

  # --- Cases ---
  - id: hb.L05.051
    kind: case
    topic: management
    stem: A 45-year-old Egyptian man is found anti-HCV positive during a national screening campaign. He has no symptoms.
    steps:
      - reveal: ""
        question: What confirms active infection?
        options: [HCV RNA by PCR, Repeat anti-HCV, Liver biopsy, Genotyping]
        answer: 0
        why: HCV RNA (or core antigen) confirms viremia; antibody alone may mean cleared infection.
      - reveal: HCV RNA is detectable. Platelets 210, AST 40, ALT 52. FIB-4 is low and FibroScan 6 kPa.
        question: Before choosing a DAA, which test besides HIV must be done?
        options: [HBsAg and total anti-HBc, Anti-HAV IgM, Serum ceruloplasmin, AFP only]
        answer: 0
        why: The lecture lists HBV testing including total anti-HBc, because DAAs can reactivate HBV.
      - reveal: HBV and HIV tests are negative. Renal function is normal. He takes no other drugs.
        question: Which regimen fits?
        options: ["Sofosbuvir + velpatasvir, 12 weeks", "Interferon + ribavirin, 48 weeks", "Sofosbuvir alone, 12 weeks", "Ribavirin alone"]
        answer: 0
        why: A pangenotypic DAA combination is standard; interferon is obsolete and monotherapy is not a regimen.
      - reveal: He completes treatment.
        question: How is cure documented?
        options: [HCV RNA 12 weeks after treatment, Anti-HCV turning negative, Normal ALT at end of treatment, FibroScan improvement]
        answer: 0
        why: SVR12 equals cure.
    src: { page: 93 }
    status: unverified
  - id: hb.L05.052
    kind: case
    topic: special
    stem: A 58-year-old woman with chronic HCV has cirrhosis on FibroScan (25 kPa). Endoscopy shows small varices.
    steps:
      - reveal: She takes amiodarone for paroxysmal AF.
        question: What must be addressed before a sofosbuvir regimen?
        options: [Stop or replace amiodarone, Double the sofosbuvir dose, Add ribavirin, Nothing]
        answer: 0
        why: Amiodarone is absolutely contraindicated with sofosbuvir because of serious bradycardia.
      - reveal: Her cardiologist switches her to another agent. She is compensated, eGFR 80.
        question: She reaches SVR12. What follow-up does the lecture require?
        options: [HCC surveillance every 6 months plus portal hypertension care, Discharge from clinic, Yearly anti-HCV, Repeat DAA course in 1 year]
        answer: 0
        why: Cirrhotic patients keep 6-monthly HCC surveillance and prophylaxis against bleeding and decompensation when CSPH is present.
    src: { page: 93 }
    status: unverified
  - id: hb.L05.053
    kind: case
    topic: special
    stem: A 30-year-old woman is anti-HCV positive with detectable HCV RNA at her first antenatal visit.
    steps:
      - reveal: ""
        question: Should DAAs be started now?
        options: ["No, DAAs are not approved in pregnancy", "Yes, sofosbuvir/velpatasvir", "Yes, glecaprevir/pibrentasvir", "Yes, with ribavirin"]
        answer: 0
        why: DAAs are not currently approved in pregnancy or lactation.
      - reveal: She asks about the baby.
        question: How common is vertical transmission of HCV?
        options: [Rare, The main route, About 50%, Universal without treatment]
        answer: 0
        why: Vertical transmission is rare; children of HCV-positive mothers are still a risk group.
    src: { page: 94 }
    status: unverified

