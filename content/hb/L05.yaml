  # --- Natural history (p91) ---
  - id: hb.L05.010
    kind: cloze
    topic: natural-history
    text: "After acute HCV infection, {{c1::15–45%}} clear the virus spontaneously, and {{c2::55–85%}} stay infected for more than 6 months."
