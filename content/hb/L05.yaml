  # --- Virology and epidemiology (p90) ---
  - id: hb.L05.001
    kind: cloze
    topic: virology
    text: "HCV belongs to the family {{c1::Flaviviridae}}, genus {{c2::Hepacivirus}}."
    src: { page: 90 }
    status: unverified
  - id: hb.L05.002
    kind: card
    topic: virology
    front: What kind of genome does HCV have?
    back: Single-stranded, positive-sense RNA.
    src: { page: 90, quote: "Single-stranded positive-sense RNA" }
    status: unverified
  - id: hb.L05.003
    kind: cloze
    topic: virology
    text: "HCV has genotypes {{c1::1 to 7}}; the most common in Egypt and the Middle East are {{c2::1, 3 and 4}}."
    src: { page: 90 }
    status: unverified
    tags: [numbers]
  - id: hb.L05.004
    kind: cloze
    topic: virology
    text: "About {{c1::58 million}} people live with chronic HCV (WHO, 2024)."
    src: { page: 90 }
    status: unverified
    tags: [numbers]
  - id: hb.L05.005
    kind: card
    topic: virology
    front: Where did Egypt stand on HCV prevalence, and what changed it?
    back: Egypt historically had the highest HCV prevalence in the world; national screening and treatment campaigns cut the burden sharply.
    src: { page: 90 }
    status: unverified
    tags: [high-yield]
  - id: hb.L05.006
    kind: card
    topic: virology
    front: Three long-term outcomes that make HCV a leading liver disease?
    back: Chronic liver disease, cirrhosis and hepatocellular carcinoma (HCC).
    src: { page: 90 }
    status: unverified

  # --- Transmission and risk groups (p90-91) ---
  - id: hb.L05.007
    kind: enumerate
    topic: transmission
    prompt: Enumerate the modes of HCV transmission, from most to least important.
    points:
      - "Blood-borne (primary): needle sharing in IV drug use"
      - "Blood-borne: blood transfusions"
      - "Blood-borne: unsafe medical procedures"
      - Sexual transmission (less common)
      - Vertical transmission (rare)
    pass: 4
