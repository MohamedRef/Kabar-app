  # --- Management (p93) ---
  - id: hb.L05.028
    kind: order
    topic: management
    prompt: Put the pre-treatment work-up for HCV in the lecture's order.
    steps:
      - Confirm HCV RNA
      - Assess fibrosis (FIB-4, FibroScan)
      - Test for HIV and HBV, including total anti-HBc
      - Check liver and renal function
      - Pregnancy test if relevant
      - Check for drug–drug interactions
    src: { page: 93 }
    status: unverified
  - id: hb.L05.029
    kind: card
    topic: management
    front: Which HBV marker must be checked before starting DAAs, beyond HBsAg?
    back: Total anti-HBc (total HBcAb), because DAAs can reactivate HBV.
    src: { page: 93 }
    status: unverified
    tags: [high-yield]
  - id: hb.L05.030
    kind: card
    topic: management
    front: Which drug does the lecture call absolutely contraindicated with DAAs, and why?
    back: Amiodarone. It can cause serious bradycardia (the known interaction is with sofosbuvir).
    src: { page: 93, quote: "Amiodarone is absolutely contraindicated… can result in serious bradycardia" }
    status: unverified
    tags: [high-yield]
  - id: hb.L05.031
    kind: card
    topic: management
    front: Two things to monitor during DAA treatment?
    back: Adherence and drug interactions.
    src: { page: 93 }
    status: unverified
  - id: hb.L05.032
    kind: enumerate
    topic: management
    prompt: After SVR in a cirrhotic HCV patient, what continued follow-up does the lecture require?
    points:
      - HCV RNA at 12 weeks post-treatment to confirm SVR12
      - HCC surveillance every 6 months
      - Primary prophylaxis against variceal bleeding in those with CSPH
      - Prevention of decompensation in those with CSPH
    pass: 3
    src: { page: 93 }
    status: unverified
    tags: [high-yield]
  - id: hb.L05.033
    kind: cloze
    topic: management
    text: "Cirrhotic patients still need HCC surveillance every {{c1::6 months}} after SVR, because cure does not remove the cancer risk of cirrhosis."
    src: { page: 93 }
    status: unverified

  # --- Special populations (p94) ---
  - id: hb.L05.034
    kind: card
    topic: special
    front: How does the lecture adjust DAA therapy in decompensated cirrhosis?
    back: Add ribavirin, or extend treatment to 24 weeks.
    src: { page: 94 }
    status: unverified
    update:
      text: Protease-inhibitor regimens (glecaprevir/pibrentasvir, grazoprevir) are contraindicated in decompensated (Child-Pugh B or C) cirrhosis; use sofosbuvir/velpatasvir ± ribavirin.
      ref: "EASL recommendations on treatment of hepatitis C 2020; AASLD-IDSA HCV guidance"
    tags: [high-yield]
  - id: hb.L05.035
    kind: card
    topic: special
    front: Preferred DAA regimen in severe CKD, per the lecture?
    back: Glecaprevir/pibrentasvir. Sofosbuvir is better avoided in severe CKD.
    src: { page: 94 }
    status: unverified
    tags: [high-yield]
  - id: hb.L05.036
    kind: card
    topic: special
    front: If only sofosbuvir regimens are available in severe CKD, what does the lecture advise?
    back: Use them with close observation, without changing the sofosbuvir dose.
    src: { page: 94 }
    status: unverified
  - id: hb.L05.037
    kind: cloze
    topic: special
    text: "The ribavirin dose must be adjusted when creatinine clearance is below {{c1::50}} mL/min."
    src: { page: 94 }
    status: unverified
    tags: [numbers]
  - id: hb.L05.038
    kind: card
    topic: special
    front: Are DAAs approved in pregnancy or lactation?
    back: No. DAAs are not currently approved in pregnancy or lactation.
    src: { page: 94 }
    status: unverified
  - id: hb.L05.039
    kind: card
    topic: special
    front: When treating HCV in HBV co-infection, what must you watch for?
    back: HBV reactivation. HCV is still treated in HIV or HBV co-infection.
    src: { page: 94 }
    status: unverified

