  # --- Clinical features (p91-92) ---
  - id: hb.L05.014
    kind: card
    topic: clinical
    front: How does acute HCV usually present?
    back: Often asymptomatic; otherwise nonspecific fatigue, anorexia, nausea and jaundice.
    src: { page: 91 }
    status: unverified
  - id: hb.L05.015
    kind: card
    topic: clinical
    front: Symptoms of chronic HCV when it is not silent?
    back: Fatigue, right upper quadrant discomfort and arthralgia. It is often silent for years.
    src: { page: 92 }
    status: unverified
  - id: hb.L05.016
    kind: enumerate
    topic: clinical
    prompt: Mention four extrahepatic manifestations of chronic HCV named in the lecture.
    points:
      - Cryoglobulinemia
      - Glomerulonephritis
      - Lymphoma
      - Insulin resistance
    pass: 3
    src: { page: 92 }
    status: unverified
    tags: [high-yield]

  # --- Diagnosis (p92) ---
  - id: hb.L05.017
    kind: card
    topic: diagnosis
    front: Screening test for HCV?
    back: HCV antibody (anti-HCV).
    src: { page: 92 }
    status: unverified
  - id: hb.L05.018
    kind: cloze
    topic: diagnosis
    text: "A positive anti-HCV is confirmed with {{c1::HCV RNA (PCR)}} or {{c2::HCV core antigen}}."
    src: { page: 92 }
    status: unverified
    tags: [high-yield]
  - id: hb.L05.019
    kind: card
    topic: diagnosis
    front: Why is HCV genotyping less critical today?
    back: Pangenotypic DAAs work across genotypes. Genotyping is still used for treatment planning.
    src: { page: 92 }
    status: unverified
  - id: hb.L05.020
    kind: cloze
    topic: diagnosis
    text: "HCV fibrosis is assessed non-invasively with {{c1::FibroScan}}, {{c2::APRI}} and {{c3::FIB-4}}; liver biopsy is now rarely used."
    src: { page: 92 }
    status: unverified

  # --- Treatment and DAAs (p92-93) ---
  - id: hb.L05.021
    kind: card
    topic: daas
    front: Define SVR12 in HCV treatment.
    back: Undetectable HCV RNA 12 weeks after the end of treatment. SVR12 means cure.
    src: { page: 92, quote: "undetectable HCV RNA 12 weeks after treatment (SVR12 = cure)" }
    status: unverified
    tags: [high-yield]
  - id: hb.L05.022
    kind: card
    topic: daas
    front: Three drawbacks of the old interferon ± ribavirin regimen?
    back: Toxic, long duration, and low efficacy.
    src: { page: 92 }
    status: unverified
  - id: hb.L05.023
