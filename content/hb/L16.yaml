- id: hb.L16.044
  kind: essay
  topic: mesenchymal
  prompt: How to diagnose liver hemangioma by contrast-enhanced CT?
  outline:
  - Book facts:
    - Most common benign tumour (5-10%)
    - Usually asymptomatic; bruit, pain if large
    - No malignant change; rupture rare
  - Contrast CT (not in the book text):
    - Peripheral nodular discontinuous arterial enhancement
    - Progressive centripetal fill-in on portal and delayed phases
    - Stays iso- or hyperdense to blood pool, no washout
  src:
    page: 317
  status: unverified
  update:
    text: 'The book text does not describe the CT pattern. Standard teaching: peripheral, nodular, discontinuous
      arterial enhancement with progressive centripetal fill-in, iso- or hyperdense to blood pool on delayed phases
      (no washout); MRI is markedly T2 bright.'
    ref: EASL CPG on benign liver tumours 2016
  tags:
  - book-question
