    quote: It is the first most common benign hepatic tumor occurring in 5-10% of population
  status: unverified
- id: hb.L16.035
  kind: card
  topic: mesenchymal
  front: Clinical features of a large hemangioma?
  back: Right hypochondrial pain, mass effect, possibly a vascular bruit. Rupture is rare and malignancy does not
    occur.
  src:
    page: 315
  status: unverified
- id: hb.L16.036
  kind: card
  topic: mesenchymal
  front: What can enlarge a hemangioma?
  back: Pregnancy and oral contraceptives.
  src:
    page: 315
  status: unverified
- id: hb.L16.037
  kind: card
  topic: mesenchymal
  front: Peliosis hepatis versus hemangioma?
  back: Both are blood-filled cavities, but peliosis walls lack the well-developed structure of hemangioma, and
    anabolic steroid use is usually present.
  src:
    page: 316
  status: unverified
- id: hb.L16.038
  kind: cloze
  topic: mesenchymal
  text: Hepatic angiomyolipoma is rare, affects women more than men ({{c1::5:1}}), mean age in the {{c2::fifth decade}},
    usually solitary.
  src:
    page: 316
  status: unverified
- id: hb.L16.039
  kind: card
  topic: mesenchymal
  front: Histological components of angiomyolipoma?
  back: Lipomatous, myomatous, angiomatous and trabecular.
  src:
    page: 316
  status: unverified
- id: hb.L16.040
  kind: mcq
  topic: mesenchymal
  stem: A 45-year-old woman has an incidental 2 cm liver hemangioma. She is asymptomatic. What is true per the book?
  options:
  - It carries a risk of malignant change
  - Rupture is common
  - It may enlarge with pregnancy or OCP
  - It must be resected
  - It is the third commonest benign tumour
  answer: 2
  why:
  - Malignant transformation does not occur.
  - Rupture is rare.
  - 'Correct: hemangiomas may enlarge during pregnancy and with OCP.'
  - Small lesions are asymptomatic and need no surgery.
  - It is the most common.
  src:
    page: 315
  status: unverified
- id: hb.L16.041
  kind: case
  topic: adenoma
  stem: A 32-year-old woman on the combined pill for 12 years has right hypochondrial pain.
  steps:
  - reveal: 'Ultrasound: a single 7 cm solid liver lesion. Transaminases, ALP and AFP are normal.'
    question: Most likely lesion?
    options:
    - Hemangioma
    - Hepatocellular adenoma
    - HCC
    - Simple cyst
    answer: 1
    why: A single solid lesion in a young woman on long-term OCP with normal labs fits adenoma.
  - question: Best test to tell it from FNH?
    options:
    - CT chest
    - Contrast-enhanced ultrasound or MRI
    - AFP-L3
    - ERCP
    answer: 1
    why: The book uses contrast-enhanced US or MRI to differentiate adenoma from FNH.
  - reveal: While awaiting surgery she collapses with diffuse abdominal pain and falling hemoglobin.
    question: Best immediate treatment?
    options:
    - Observation
    - Trans-arterial embolization
    - Start the pill again
    - Liver transplant
    answer: 1
    why: Bleeding adenomas are treated with trans-arterial embolization.
  src:
    page: 312
  status: unverified
