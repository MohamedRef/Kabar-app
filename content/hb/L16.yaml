- id: hb.L16.006
  kind: enumerate
  topic: adenoma
  prompt: Clinical picture of hepatic adenoma?
  points:
  - Asymptomatic
  - Pressure on nearby vessels or bile ducts
  - Right hypochondrial pain from capsule stretch
  - Diffuse abdominal pain with intraperitoneal hemorrhage if it ruptures
  - Malignant transformation
  pass: 4
  src:
    page: 312
  status: unverified
- id: hb.L16.007
  kind: cloze
  topic: adenoma
  text: Hepatic adenoma undergoes malignant transformation in up to {{c1::8%}} of all patients and up to {{c2::40-50%}}
    in men.
  src:
    page: 312
    quote: Malignant transformation in up to 8% of all patients & up to 40-50% in men
  status: unverified
- id: hb.L16.008
  kind: card
  topic: adenoma
  front: Lab findings in hepatic adenoma?
  back: Normal transaminases, alkaline phosphatase and AFP, unless the tumour compresses bile ducts and causes obstructive
    jaundice.
  src:
    page: 312
  status: unverified
- id: hb.L16.009
  kind: enumerate
  topic: adenoma
  prompt: Risk factors for hepatocellular adenoma?
  points:
  - Long-standing oral contraceptive use (up to 90% of cases)
  - Glycogen storage diseases
  - Long-standing anabolic steroid use
  pass: 3
  src:
    page: 312
  status: unverified
  tags:
  - high-yield
- id: hb.L16.010
  kind: cloze
  topic: adenoma
  text: Up to {{c1::90%}} of hepatic adenoma patients have a history of long-term {{c2::oral contraceptive}} use.
  src:
    page: 312
  status: unverified
- id: hb.L16.011
  kind: card
  topic: adenoma
  front: How is hepatic adenoma usually found and then characterised?
  back: Routine abdominal ultrasound (cheap and sensitive), then contrast-enhanced ultrasound or MRI to tell adenoma
    from FNH; liver biopsy if needed.
  src:
    page: 312
  status: unverified
- id: hb.L16.012
  kind: enumerate
  topic: adenoma
  prompt: Indications for surgical excision of hepatic adenoma?
  points:
  - Symptomatic
  - Larger than 5 cm (risk of rupture and bleeding)
  - Pedunculated (risk of torsion)
  - In men (high malignant transformation)
  pass: 4
  src:
    page: 312
  status: unverified
  tags:
  - high-yield
- id: hb.L16.013
  kind: card
  topic: adenoma
  front: Treatment of a bleeding hepatic adenoma?
  back: Trans-arterial embolization (TAE).
  src:
    page: 312
  status: unverified
- id: hb.L16.014
  kind: card
  topic: adenoma
  front: First step in managing any hepatic adenoma?
  back: 'Stop risk factors: hormones (OCP) and anabolic steroids.'
  src:
    page: 312
  status: unverified
- id: hb.L16.015
  kind: mcq
  topic: adenoma
  stem: A 29-year-old woman on the combined pill for 10 years has a single 6 cm liver adenoma found on ultrasound.
    She is asymptomatic. Which is the best management per the book?
  options:
  - Reassure and continue the pill
  - Stop the pill and refer for surgical excision
  - Biopsy and repeat in 5 years
  - Start sorafenib
  - Liver transplant
  answer: 1
  why:
  - Hormones are a risk factor and must be stopped.
  - 'Correct: stop OCP; size >5 cm risks rupture and bleeding, so excise.'
  - A >5 cm adenoma is an indication for surgery, not long observation.
  - This is a benign tumour.
  - Transplant is not needed for a benign resectable lesion.
  src:
    page: 312
  status: unverified
- id: hb.L16.016
  kind: mcq
  topic: adenoma
  stem: A 35-year-old male bodybuilder on anabolic steroids has a 3 cm hepatic adenoma. Why does the book favour
    excision even though it is under 5 cm?
  options:
  - Adenomas in men have a high malignant transformation rate
  - Steroids make adenomas pedunculated
  - Men always bleed
  - AFP is raised in men
  - Adenomas in men are always multiple
  answer: 0
  why:
  - 'Correct: malignant transformation reaches 40-50% in men, so men are an indication for surgery.'
  - Pedunculation is a separate indication, not caused by steroids.
  - Bleeding risk relates to size, not sex.
  - Adenoma labs (including AFP) are normal.
  - Adenomas are usually single.
  src:
    page: 312
  status: unverified
- id: hb.L16.017
  kind: card
  topic: fnh
  front: 'FNH: frequency rank among benign liver tumours?'
  back: Second most frequent.
  src:
    page: 313
  status: unverified
- id: hb.L16.018
  kind: card
  topic: fnh
  front: Do hormonal therapy or pregnancy contraindicate FNH?
  back: No, FNH is not a contraindication to hormonal therapy or pregnancy.
  src:
    page: 313
  status: unverified
  tags:
  - high-yield
- id: hb.L16.019
  kind: card
  topic: fnh
  front: Proposed pathogenesis of FNH?
  back: A hyperplastic response to an artery-to-portal vein shunt.
  src:
    page: 313
  status: unverified
- id: hb.L16.020
  kind: cloze
  topic: fnh
  text: 'FNH histology: normal hepatocytes with fibrous tissue holding large arteries and proliferating bile ducts,
    with a {{c1::central scar}} in up to {{c2::60%}} of cases; the background liver is {{c3::normal}}.'
  src:
    page: 313
    quote: central scar in upto 60% of cases
  status: unverified
- id: hb.L16.021
  kind: card
  topic: fnh
  front: How is FNH diagnosed?
  back: Imaging (ultrasound, contrast-enhanced ultrasound, MRI), with biopsy as for adenoma.
  src:
    page: 313
  status: unverified
- id: hb.L16.022
  kind: card
  topic: fnh
  front: Treatment of FNH?
  back: Conservative follow-up, because FNH is static with rare rupture or malignancy; consider surgery only if
    symptomatic, large or pedunculated.
  src:
    page: 314
  status: unverified
- id: hb.L16.023
  kind: table
  topic: fnh
  title: Adenoma versus FNH
  columns:
  - Feature
  - Hepatic adenoma
  - FNH
  rows:
  - - Frequency
    - 3rd most common
    - 2nd most common
  - - Number (book)
    - Usually single
    - Usually multiple, <2 cm
  - - Hormones / pregnancy
    - OCP is the main risk factor; stop it
    - Not a contraindication
  - - Malignant change
    - Up to 8% (40-50% in men)
    - Rare
  - - Histology clue
    - '-'
    - Central scar (up to 60%), normal background
  - - Management
    - Stop hormones; excise if symptomatic, >5 cm, pedunculated, or male
    - Conservative follow-up
