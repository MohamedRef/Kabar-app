- id: hb.L16.001
  kind: card
  topic: fll
  front: What is a focal liver lesion (FLL)?
  back: An abnormal area of tissue (a mass or cyst) in the liver, often found incidentally on imaging done for other
    organs.
  src:
    page: 311
  status: unverified
- id: hb.L16.002
  kind: card
  topic: fll
  front: Are most focal liver lesions benign or malignant, and why still evaluate them?
  back: Most are benign; they are evaluated to exclude serious disease such as HCC, cholangiocarcinoma or metastases.
  src:
    page: 311
  status: unverified
- id: hb.L16.003
  kind: enumerate
  topic: fll
  prompt: Mention the classification of benign liver tumours.
  points:
  - 'Hepatocellular tumours: adenoma, FNH, NRH'
  - 'Biliary and cystic lesions: bile duct adenoma, biliary adenofibroma, biliary papillomatosis, simple cyst, polycystic
    disease'
  - 'Mesenchymal tumours: hemangioma, peliosis hepatis, angiomyolipoma'
  pass: 3
