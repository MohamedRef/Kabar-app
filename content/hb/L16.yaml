- id: hb.L16.024
  kind: mcq
  topic: fnh
  stem: A 30-year-old woman wants to start the pill. Ultrasound shows two small liver lesions, and MRI shows a central
    scar in a normal background liver. What do you advise?
  options:
  - The pill is contraindicated
  - Resect both lesions
  - The pill and pregnancy are allowed; follow up
  - Trans-arterial embolization
  - Biopsy both before any decision
  answer: 2
  why:
  - That is the adenoma rule; FNH is not a contraindication to hormones.
  - FNH is static with rare complications; surgery only if symptomatic, large or pedunculated.
  - 'Correct: FNH (central scar, normal background) allows hormonal therapy and pregnancy; manage conservatively.'
  - TAE is for bleeding adenomas.
  - Typical imaging is enough here; biopsy is reserved for unclear cases.
  src:
    page: 313
  status: unverified
- id: hb.L16.025
  kind: card
  topic: nrh
  front: What is nodular regenerative hyperplasia (NRH)?
  back: A non-specific response to obliteration of small portal veins.
  src:
    page: 314
  status: unverified
- id: hb.L16.026
  kind: enumerate
  topic: nrh
  prompt: Causes of small portal vein obliteration in NRH?
  points:
  - 'Systemic vasculitis: RA, PAN, SLE, SS'
  - Portal vein thrombosis (hypercoagulable state)
  - 'Toxic drug injury: methotrexate, azathioprine'
  pass: 3
  src:
    page: 314
  status: unverified
- id: hb.L16.027
  kind: cloze
  topic: nrh
  text: NRH shows micronodules of {{c1::1-2 mm}} outlined by atrophy {{c2::without fibrous septa}}.
  src:
    page: 315
  status: unverified
- id: hb.L16.028
  kind: card
  topic: nrh
  front: How does NRH present?
  back: Asymptomatic, or with signs and symptoms of portal hypertension.
  src:
    page: 315
  status: unverified
- id: hb.L16.029
  kind: mcq
  topic: nrh
  stem: A 50-year-old woman with rheumatoid arthritis on long-term methotrexate has splenomegaly and varices. Liver
    biopsy shows 1-2 mm nodules with surrounding atrophy and no fibrous septa. Diagnosis?
  options:
  - Cirrhosis
  - Nodular regenerative hyperplasia
  - FNH
  - Hepatic adenoma
  - Peliosis hepatis
  answer: 1
  why:
  - Cirrhosis has fibrous septa around nodules.
  - 'Correct: NRH, from small portal vein obliteration (RA vasculitis, methotrexate), presents with portal hypertension.'
  - FNH has a central scar with large arteries and bile ducts.
  - Adenoma is a single mass, linked to OCP and steroids.
  - Peliosis is blood-filled cavities.
  src:
    page: 315
  status: unverified
