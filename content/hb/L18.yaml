  - numbers
- id: hb.L18.047
  kind: card
  topic: protective
  front: Why is the protective effect of coffee biologically plausible?
  back: Coffee contains large amounts of antioxidants.
  src:
    page: 349
  status: unverified
- id: hb.L18.048
  kind: card
  topic: protective
  front: Dietary factors linked to lower HCC risk?
  back: White meat, fish, omega-3 fatty acids, vegetables, and vitamin E intake.
  src:
    page: 349
  status: unverified
- id: hb.L18.049
  kind: card
  topic: protective
  front: Possible mechanisms by which exercise lowers HCC risk?
  back: Effects on hepatic glucose and lipid metabolism, and improvement of fatty liver disease.
  src:
    page: 350
  status: unverified
- id: hb.L18.050
  kind: card
  topic: surveillance
  front: Why screen for HCC at all?
  back: The therapeutic window is very narrow and prognosis is poor once symptoms appear; surveillance finds HCC
    at the earliest stage, when cure is most likely.
  src:
    page: 350
  status: unverified
- id: hb.L18.051
  kind: card
  topic: surveillance
  front: What outcomes did one systematic review link to HCC surveillance in cirrhosis?
  back: Better tumour detection, more curative therapy received, and better overall survival.
  src:
    page: 350
  status: unverified
- id: hb.L18.052
  kind: enumerate
  topic: surveillance
  prompt: Whom to screen for HCC (populations in the book)?
  points:
  - Cirrhosis of any etiology
  - Chronic HBV without cirrhosis in the PAGE-B intermediate or high-risk category
  - 'Some societies: non-cirrhotic HCV with bridging fibrosis (F3)'
  pass: 2
  src:
    page: 351
  status: unverified
  tags:
  - high-yield
- id: hb.L18.053
  kind: card
  topic: surveillance
  front: Per EASL and AASLD, which cirrhotic patients should be screened, and what is the exception?
  back: 'Only Child-Pugh A or B. Exception: Child-Pugh C awaiting liver transplantation.'
  src:
    page: 350
  status: unverified
  tags:
  - high-yield
- id: hb.L18.054
  kind: card
  topic: surveillance
  front: How often does AASLD screen patients listed for transplant, and why?
  back: Twice a year, because finding an early HCC can change their transplant priority.
  src:
    page: 350
  status: unverified
- id: hb.L18.055
  kind: card
  topic: surveillance
  front: When is HCC surveillance NOT recommended?
  back: In patients with life-limiting comorbid conditions that transplantation cannot cure.
  src:
    page: 351
  status: unverified
- id: hb.L18.056
  kind: cloze
  topic: surveillance
  text: All guidelines recommend {{c1::abdominal ultrasound}} every {{c2::6 months}} as the screening modality of
    choice.
  src:
    page: 351
    quote: abdominal ultrasound is the screening modality of choice and should be performed every 6 months
  status: unverified
  tags:
  - high-yield
- id: hb.L18.057
  kind: card
  topic: surveillance
  front: Can AFP be used alone for HCC surveillance?
  back: No. It may be added to ultrasound to raise sensitivity, but alone it has poor sensitivity and specificity.
  src:
    page: 351
  status: unverified
- id: hb.L18.058
  kind: card
  topic: surveillance
  front: 'NICE: which patients should have AFP included in surveillance?'
  back: Adults with cirrhosis and concomitant hepatitis B.
  src:
    page: 351
  status: unverified
- id: hb.L18.059
  kind: card
  topic: surveillance
  front: Name the newer biomarkers being validated for HCC screening.
  back: Des-gamma carboxyprothrombin (DCP), AFP-L3 and human growth factors.
  src:
    page: 351
  status: unverified
- id: hb.L18.060
  kind: card
  topic: surveillance
  front: Which HCV patients without cirrhosis do some societies screen?
  back: Those with bridging fibrosis (F3, numerous septa without cirrhosis).
  src:
    page: 351
  status: unverified
