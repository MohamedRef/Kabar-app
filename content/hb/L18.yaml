- id: hb.L18.117
  kind: table
  topic: staging
  title: BCLC staging (book version)
  columns:
  - Stage
  - Performance status
  - Tumour
  - Liver function
  rows:
  - - 0 Very early
    - '0'
    - Solitary <=2 cm, no vascular invasion or spread
    - Preserved
  - - A Early
    - '0'
    - Solitary <=5 cm or up to 3 nodules, none >3 cm; no macrovascular invasion or spread
    - Preserved
  - - B Intermediate
    - '0'
    - Multifocal beyond BCLC-A; no vascular invasion or spread
    - Preserved
  - - C Advanced
    - <=2
    - Vascular invasion or extrahepatic spread
    - Preserved
  - - D End stage
    - '>2'
    - Any tumour burden
    - And/or impaired
  blanks:
  - [0, 2]
  - [1, 2]
  - [2, 2]
  - [3, 1]
  - [3, 2]
  - [4, 1]
  src:
    page: 362
  status: unverified
  update:
    text: 'BCLC 2022 update: BCLC-A is a single tumour of any size, or up to 3 nodules each <=3 cm, with preserved
      liver function and PS 0; BCLC-C is PS 1-2; BCLC-D is end-stage liver function. Liver function is no longer
      defined by Child-Pugh points alone.'
    ref: BCLC 2022 update (Reig et al., J Hepatol 2022)
  tags:
  - high-yield
