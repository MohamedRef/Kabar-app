      g/dL, INR 2.1, ECOG 3.
    question: BCLC stage?
    options:
    - B
    - C
    - D
    - A
    answer: 2
    why: PS >2 and impaired liver function make this BCLC D, whatever the tumour burden.
  - question: Appropriate management?
    options:
    - TACE
    - Atezolizumab plus bevacizumab
    - Hospice and palliative care
    - Resection
    answer: 2
    why: 'BCLC D: hospice care; he is outside the transplant exception (PS <=1 within Milan).'
