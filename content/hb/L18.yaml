- id: hb.L18.111
  kind: mcq
  topic: imaging
  stem: A 45-year-old man with no liver disease, normal liver stiffness and negative HBV/HCV serology has a 4 cm
    liver mass with arterial enhancement and washout on CT. What is the next step to establish the diagnosis?
  options:
  - Diagnose HCC on imaging alone
  - Ultrasound-guided core-needle biopsy
  - Repeat ultrasound in 3-4 months
  - Start atezolizumab plus bevacizumab
  - PET scan
  answer: 1
  why:
  - Imaging diagnosis applies to cirrhotic livers (and chronic HBV); he has neither.
  - 'Correct: biopsy is needed to diagnose HCC in patients without cirrhosis or chronic HBV.'
  - Three-to-four-monthly follow-up is for sub-centimetre surveillance lesions.
  - Treatment needs a diagnosis and staging first.
  - PET is not part of the book's diagnostic pathway.
  src:
    page: 361
  status: unverified
- id: hb.L18.112
  kind: mcq
  topic: imaging
  stem: A 55-year-old man with Budd-Chiari-related cirrhosis has a 2.5 cm arterial-enhancing nodule. A resident
    wants to classify it with LI-RADS. Why is this inappropriate?
  options:
  - LI-RADS needs MRI only
  - LI-RADS is not applied to cirrhosis caused by vascular disorders
  - LI-RADS is only for lesions under 2 cm
  - LI-RADS is only for patients over 65
  - LI-RADS requires a positive AFP
  answer: 1
  why:
  - The book does not limit LI-RADS to MRI.
  - 'Correct: cirrhosis from vascular disorders such as Budd-Chiari is a LI-RADS exception.'
  - Lesion size is not an exclusion in the book.
  - The age exclusion is under 18, not over 65.
  - AFP is not a LI-RADS requirement.
  src:
    page: 360
  status: unverified
- id: hb.L18.113
  kind: mcq
  topic: imaging
  stem: Surveillance ultrasound in a patient with HCV cirrhosis shows a new 8 mm nodule. AFP is normal. What next?
  options:
  - Immediate biopsy
  - Repeat ultrasound every 3-4 months
  - Resume routine 6-monthly ultrasound
  - Start TACE
  - Refer for transplant
  answer: 1
  why:
  - A sub-centimetre nodule is followed, not biopsied first.
  - 'Correct: a lesion under 1 cm is followed at 3-4 month intervals; if stable over 1-2 years, return to 6-monthly.'
  - Routine 6-monthly surveillance resumes only after 1-2 years without growth.
  - There is no diagnosis to treat.
  - There is no diagnosis yet.
  src:
