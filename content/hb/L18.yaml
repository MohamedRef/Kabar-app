- id: hb.L18.092
  kind: mcq
  topic: labs
  stem: A 50-year-old woman with HCV cirrhosis has a 3 cm arterial-enhancing liver lesion with portal venous washout
    on triphasic CT. Her AFP is 6 ng/mL (normal). What is the best interpretation?
  options:
  - Normal AFP excludes HCC
  - AFP is raised in only about 60% of HCC, so the imaging can still be diagnostic
  - She needs biopsy because AFP is normal
  - She has a hemangioma
  - Repeat AFP in 6 months before any decision
  answer: 1
  why:
  - AFP is raised in only about 60%; a normal value does not rule HCC out.
  - 'Correct: in cirrhosis, typical arterial enhancement with washout is diagnostic whatever the AFP.'
  - Biopsy is for indeterminate lesions or non-cirrhotic livers, not for a normal AFP.
  - Arterial enhancement with washout in cirrhosis is the HCC pattern, not hemangioma.
  - Waiting wastes the narrow treatment window.
  src:
    page: 357
  status: unverified
