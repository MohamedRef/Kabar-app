- id: hb.L18.065
  kind: mcq
  topic: surveillance
  stem: A 52-year-old man with chronic HBV and no cirrhosis has a platelet count of 150 x 10^9/L. What is his PAGE-B
    category, and should he be screened?
  options:
  - Low risk (score 7); no screening
  - Intermediate risk (score 13); screen
  - High risk (score 18); screen
  - Intermediate risk (score 12); no screening
  - PAGE-B does not apply to men
  answer: 1
  why:
  - Score is 6 (age 50-59) + 6 (male) + 1 (platelets 100-199) = 13, not 7.
  - 'Correct: 13 is intermediate (10-17), and intermediate or high-risk non-cirrhotic HBV patients are screened.'
  - 18 or more is high risk; his total is 13.
  - Intermediate-risk patients are screened, and the score is 13.
  - 'Gender is a scored item: male = 6 points.'
  src:
    page: 352
  status: unverified
  tags:
  - numbers
- id: hb.L18.066
  kind: mcq
  topic: surveillance
  stem: A 64-year-old woman with HCV cirrhosis, Child-Pugh C, has refractory ascites and is not a transplant candidate
    because of severe heart failure. What does the book advise about HCC surveillance?
  options:
  - Ultrasound every 6 months
  - Ultrasound plus AFP every 3 months
  - AFP alone every 6 months
  - No surveillance
  - Triphasic CT every 6 months
  answer: 3
  why:
  - Surveillance is for Child-Pugh A-B (or C awaiting transplant), not for her.
  - Shorter intervals are for following a <1 cm nodule; she should not be screened at all.
  - AFP is never used alone.
  - 'Correct: Child-Pugh C not awaiting transplant, plus a life-limiting comorbidity, means surveillance is not
    recommended.'
  - CT replaces ultrasound only when ultrasound views are poor, and she is not for surveillance anyway.
  src:
    page: 350
  status: unverified
- id: hb.L18.067
  kind: mcq
  topic: surveillance
  stem: A 47-year-old man with compensated HBV cirrhosis asks how he should be watched for liver cancer. Which plan
    fits the book?
  options:
  - AFP alone every 6 months
  - Ultrasound every 6 months, with AFP to raise sensitivity
  - Triphasic CT every year
  - MRI every 3 months
  - Liver biopsy every 2 years
  answer: 1
  why:
  - AFP alone has poor sensitivity and specificity.
  - 'Correct: ultrasound every 6 months is the modality of choice; NICE adds AFP for cirrhosis with HBV.'
  - CT is for confirming a lesion or when ultrasound views are poor, not routine yearly screening.
  - MRI is not a routine screening tool, and 3-monthly intervals are for following a small nodule.
  - Biopsy is not a screening test.
  src:
    page: 351
  status: unverified
- id: hb.L18.068
  kind: enumerate
  topic: clinical
  prompt: Mention the symptoms and signs of symptomatic HCC.
  points:
  - Hepatomegaly / RUQ mass
  - Abdominal distension (ascites)
  - Variceal bleeding
  - RUQ pain
  - Early satiety, weight loss, cachexia
  - Jaundice (incl. obstructive)
  - Hepatic encephalopathy, asterixis, fetor
  - Lower limb oedema
  - Splenomegaly, spider naevi, palmar erythema, periumbilical collaterals
  - Paraneoplastic syndrome, diarrhoea
  - Bone pain
  - Vascular bruit over the liver
  pass: 6
  src:
    page: 352
  status: unverified
- id: hb.L18.069
  kind: card
  topic: clinical
  front: How does HCC usually present in a patient with no known chronic liver disease?
  back: Right upper quadrant abdominal pain.
  src:
    page: 354
  status: unverified
- id: hb.L18.070
  kind: card
  topic: clinical
  front: Can HCC be asymptomatic?
  back: Yes, a significant number of patients are asymptomatic with well-compensated cirrhosis.
  src:
    page: 354
  status: unverified
- id: hb.L18.071
