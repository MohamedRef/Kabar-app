- id: hb.L18.072
  kind: card
  topic: clinical
  front: Three mechanisms of obstructive jaundice in HCC?
  back: Invasion of the biliary tree, compression of intrahepatic ducts, or rarely haemobilia.
  src:
    page: 354
  status: unverified
- id: hb.L18.073
