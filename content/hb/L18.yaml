  status: unverified
- id: hb.L18.154
  kind: mcq
  topic: early-treatment
  stem: A 50-year-old woman with HBV cirrhosis, Child-Pugh B8, ECOG 0, has two HCC nodules of 2.8 and 2.0 cm, no
    vascular invasion. Her MELD is high. Which treatment best cures both her cancer and liver disease?
  options:
  - Resection
  - Liver transplantation
  - TACE alone
  - Atezolizumab plus bevacizumab
  - PEI
  answer: 1
  why:
  - Poor reserve and cirrhosis make resection risky.
  - 'Correct: she is within Milan (2-3 lesions all <=3 cm) with a high MELD; LT cures tumour and cirrhosis.'
  - TACE is bridging or BCLC B therapy, not cure.
  - Systemic therapy is for advanced disease.
  - PEI is a second-line local option, not curative of the liver disease.
  src:
    page: 367
  status: unverified
- id: hb.L18.155
  kind: mcq
  topic: early-treatment
  stem: Which patient is OUTSIDE the Milan criteria?
  options:
  - Single 4.8 cm HCC, no vascular invasion, PS 0
  - Three nodules of 3, 2.5 and 1 cm, PS 1
  - Two nodules of 3.5 and 2 cm, PS 0
  - Single 2 cm HCC, PS 1
  - Two nodules of 2 and 1.5 cm, PS 0
  answer: 2
  why:
  - A single lesion <=5 cm is within Milan.
  - 2-3 lesions all <=3 cm and PS <=1 is within Milan.
  - 'Correct: with 2-3 lesions, all must be <=3 cm; 3.5 cm exceeds it.'
  - 'Single small lesion, PS 1: within Milan.'
  - 'Two lesions both <=3 cm: within Milan.'
  src:
    page: 368
  status: unverified
- id: hb.L18.156
  kind: card
  topic: locoregional
  front: Which patients may benefit from TACE (early disease)?
