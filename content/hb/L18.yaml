  kind: mcq
  topic: early-treatment
  stem: A 56-year-old man with HCV cirrhosis, Child-Pugh A5, has clinically significant portal hypertension (varices)
    and a single 2.5 cm HCC. He is not a transplant candidate. What is first-line treatment per the book?
  options:
  - Surgical resection
  - RFA
  - TACE
  - Sorafenib
  - Hospice care
  answer: 1
  why:
  - Portal hypertension rules out resection in cirrhosis.
  - 'Correct: for BCLC 0-A not suitable for resection or transplant, RFA is first line (and works best <=3 cm).'
  - TACE is second line here.
  - Systemic therapy is for BCLC C.
  - He has early, treatable disease.
  src:
