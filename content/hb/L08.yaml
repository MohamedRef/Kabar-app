    topic: cholestatic
    prompt: Mention psychotropic drugs that cause chronic cholestasis and vanishing bile duct syndrome.
    points: [Amitriptyline, Barbiturates, Carbamazepine, Chlorpromazine, Haloperidol, Imipramine, Phenothiazines]
