  # --- Cholestatic (p134-137) ---
  - id: hb.L08.045
    kind: card
    topic: cholestatic
    front: Definition of cholestatic DILI?
    back: Reduced bile flow from reduced secretion or obstruction.
    src: { page: 134 }
    status: unverified
  - id: hb.L08.046
    kind: cloze
    topic: cholestatic
    text: "Cholestatic markers: raised {{c1::alkaline phosphatase}}, {{c2::GGT}} and {{c3::5'-nucleotidase}}. Clinically: jaundice and pruritus."
    src: { page: 134 }
    status: unverified
  - id: hb.L08.047
    kind: table
    topic: cholestatic
    title: Types of drug cholestasis (book table)
    columns: [Type, Ductal lesion, ALP, AST/ALT, Example]
    rows:
      - ["Canalicular (bland jaundice)", "−", "<3×", "<5×", "Contraceptives, anabolic steroids"]
      - ["Hepatocanalicular (cholestatic jaundice)", "±", ">3×", "2–10×", "Chlorpromazine, Augmentin, erythromycin"]
      - ["Ductular (cholangiolar)", "+ (bile casts +++)", ">3×", "<5×", "Benoxaprofen"]
      - ["Cholangiodestructive (vanishing bile duct)", "+++", ">3×", "<5×", "Paraquat, chlorpromazine"]
      - ["Cholangiosclerotic (sclerosing cholangitis)", "+++", ">3×", "<5×", "Floxuridine, scolicides"]
    blanks: [[0, 4], [1, 3], [1, 4], [2, 4], [4, 4]]
    src: { page: 135 }
    status: unverified
    tags: [high-yield]
  - id: hb.L08.048
    kind: card
    topic: cholestatic
    front: Bland (canalicular) drug cholestasis, what features and which drugs?
    back: Jaundice with no portal inflammation, necrosis or duct lesion, and ALP below 3×. Caused by contraceptives and anabolic steroids.
    src: { page: 135 }
    status: unverified
    tags: [high-yield]
  - id: hb.L08.049
    kind: card
    topic: cholestatic
    front: Which type of drug cholestasis has the highest transaminases (2–10×)?
    back: Hepatocanalicular (cholestatic jaundice), e.g. chlorpromazine, Augmentin and erythromycin.
    src: { page: 135 }
    status: unverified
  - id: hb.L08.050
    kind: enumerate
    topic: cholestatic
    prompt: Mention antibiotics that cause chronic cholestasis and vanishing bile duct syndrome.
