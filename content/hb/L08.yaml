  # --- Clinical presentations, hepatocellular (p132-134) ---
  - id: hb.L08.037
    kind: card
    topic: hepatocellular
    front: Drug tolerance in DILI, what is it and three examples?
    back: Asymptomatic enzyme rise that does not progress despite continued use. Examples are INH, phenytoin and chlorpromazine.
    src: { page: 132 }
    status: unverified
  - id: hb.L08.038
    kind: card
    topic: hepatocellular
    front: Asymptomatic enzyme rise that progresses with continued drug use, what is the typical level and risk?
    back: AST and ALT 3–5× ULN; it may progress to hepatic failure.
    src: { page: 133 }
    status: unverified
  - id: hb.L08.039
    kind: card
    topic: hepatocellular
    front: Biochemical pattern of acute hepatocellular (direct toxic) DILI?
    back: Marked ALT and AST rise with normal or slightly raised ALP; bilirubin variably raised, and a high bilirubin means worse prognosis.
    src: { page: 133 }
    status: unverified
    tags: [high-yield]
  - id: hb.L08.040
    kind: cloze
    topic: hepatocellular
    text: "Drugs cause about {{c1::one third}} of fulminant hepatic failure in the US: {{c2::20%}} acetaminophen and {{c3::12–15%}} other drugs."
    src: { page: 133 }
    status: unverified
    tags: [numbers]
  - id: hb.L08.041
    kind: cloze
    topic: hepatocellular
    text: "In alcoholic liver injury AST is {{c1::2–3×}} ALT, AST stays below {{c2::300 IU}}, and ALT is almost always below {{c3::100 IU}}."
    src: { page: 133 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L08.042
    kind: enumerate
    topic: hepatocellular
    prompt: Towering ALT and AST (5,000–10,000 IU), what are the causes?
    points: [Drugs (acetaminophen), Chemical toxins, Toxic mushrooms, Shock liver]
    pass: 3
    src: { page: 133 }
    status: unverified
    tags: [high-yield]
  - id: hb.L08.043
    kind: card
    topic: hepatocellular
    front: Is a transaminase level of 5,000–10,000 IU typical of viral hepatitis?
    back: No, it is unusual. Think acetaminophen, toxins, mushrooms or shock liver.
    src: { page: 133 }
    status: unverified
  - id: hb.L08.044
    kind: table
    topic: hepatocellular
    title: Drugs causing acute hepatocellular injury (book examples)
    columns: [Class, Drugs]
    rows:
