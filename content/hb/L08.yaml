items:
  # --- Overview (p125-126) ---
  - id: hb.L08.001
    kind: card
    topic: overview
    front: What is the most important step to prevent acute or chronic liver failure in DILI?
    back: Identify and stop the offending drug as soon as possible. Most benign cases improve after withdrawal.
    src: { page: 125 }
    status: unverified
    tags: [high-yield]
  - id: hb.L08.002
    kind: card
    topic: overview
    front: Who is more susceptible to DILI, even though no specific risk factors are established?
    back: People with genetic susceptibility and those with pre-existing liver disease.
    src: { page: 125 }
    status: unverified
  - id: hb.L08.003
    kind: card
    topic: overview
    front: Treatment of drug- and herb-induced liver injury?
    back: Rapid withdrawal of the drug plus supportive care for symptoms.
    src: { page: 125 }
    status: unverified
    tags: [high-yield]
  - id: hb.L08.004
    kind: table
    topic: overview
    title: WHO grading of hepatotoxicity (book)
    columns: [Class, Fold ULN, ALT (U/L)]
    rows:
      - ["1 (mild)", "<2.5×", "51–125"]
      - ["2 (mild)", "2.5–5×", "126–250"]
      - ["3 (moderate)", "5–10×", "251–500"]
      - ["4 (severe)", ">10×", ">500"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [3, 2]]
    src: { page: 125 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L08.005
    kind: cloze
    topic: overview
    text: "WHO severe (class 4) hepatotoxicity is ALT more than {{c1::10× ULN}}, i.e. above {{c2::500 U/L}}."
    src: { page: 125 }
    status: unverified
    tags: [numbers]
  - id: hb.L08.006
    kind: cloze
    topic: overview
    text: "Drugs cause {{c1::25–40%}} of fulminant hepatic failure and about {{c2::20%}} of jaundice in the elderly (USA)."
    src: { page: 126 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L08.007
    kind: cloze
    topic: overview
    text: "DILI made up {{c1::10%}} of hepatitis cases at a major French hepatology center and {{c2::9%}} of UK inpatients with AST ≥400 IU/L."
    src: { page: 126 }
    status: unverified
    tags: [numbers]

  # --- Mechanisms (p126-127, 132) ---
  - id: hb.L08.008
    kind: table
    topic: mechanism
    title: Predictable vs unpredictable DILI (book)
    columns: [Feature, Predictable, Unpredictable (idiosyncratic)]
    rows:
      - ["Dose relation", "Dose related", "Not dose related"]
      - ["Drug", "Intrinsically hepatotoxic", "Any drug, in susceptible hosts"]
      - ["Onset", "Acute (hours)", "Weeks to months"]
      - ["Frequency", "Common with overdose", "Rare (0.01–1%)"]
      - ["Pattern", "Usually necrosis; fulminant acute hepatitis", "Immune (hypersensitivity) or metabolic idiosyncrasy"]
      - ["Example", "Acetaminophen", "Phenytoin, sulfonamides, valproate; INH, ketoconazole, diclofenac"]
    blanks: [[0, 1], [0, 2], [2, 1], [2, 2], [3, 2], [5, 1]]
    src: { page: 126 }
    status: unverified
    tags: [high-yield]
  - id: hb.L08.009
    kind: enumerate
    topic: mechanism
    prompt: Mention the features of immune-mediated (hypersensitivity) idiosyncratic DILI.
    points: [Rash, Fever, Arthralgia, Eosinophilia]
    pass: 3
    src: { page: 127 }
    status: unverified
  - id: hb.L08.010
    kind: cloze
    topic: mechanism
    text: "Immune idiosyncrasy examples: {{c1::phenytoin, sulfonamides, valproate}}. Metabolic idiosyncrasy (toxic metabolites) examples: {{c2::INH, ketoconazole, diclofenac}}."
    src: { page: 127 }
    status: unverified
    tags: [high-yield]
  - id: hb.L08.011
    kind: cloze
    topic: mechanism
    text: "Idiosyncratic DILI is rare, at {{c1::0.01–1%}}, and appears {{c2::weeks to months}} after starting the drug."
    src: { page: 127 }
    status: unverified
    tags: [numbers]
  - id: hb.L08.012
    kind: card
    topic: mechanism
    front: In the DILI mechanism figure, how can a drug metabolite trigger an immune attack?
    back: It binds protein to form a hapten, which activates B and T cells; antibodies and cytotoxic T cells then injure the liver on re-exposure.
    src: { page: 126 }
    status: unverified
  - id: hb.L08.013
    kind: card
    topic: mechanism
    front: In the DILI mechanism figure, what are the two possible outcomes after liver injury?
    back: Adaptation and recovery to a normal liver, or progression to liver failure.
    src: { page: 126 }
    status: unverified
  - id: hb.L08.014
    kind: table
    topic: classification
    title: Cells targeted in DILI (book figure)
    columns: [Cell, Injuries]
    rows:
      - ["Hepatocyte", "Acute and chronic hepatitis, cholestasis, cirrhosis, steatosis, phospholipidosis, steatohepatitis, granulomatous hepatitis"]
      - ["Cholangiocyte", "Acute and chronic cholangitis, sclerosing cholangitis"]
      - ["Endothelial cell", "Veno-occlusive disease, sinusoidal dilation, peliosis hepatis, Budd-Chiari syndrome"]
      - ["Ito (stellate) cell", "Perisinusoidal fibrosis"]
    blanks: [[1, 1], [2, 1], [3, 1]]
    src: { page: 128 }
    status: unverified

  # --- Classification (p128) ---
  - id: hb.L08.015
    kind: cloze
    topic: classification
    text: "Histologically, DILI is {{c1::hepatocellular}} (hepatocytes), {{c2::cholestatic}} (bile ducts or canaliculi), or {{c3::mixed}}."
    src: { page: 128 }
    status: unverified
  - id: hb.L08.016
    kind: enumerate
    topic: classification
    prompt: Enumerate the categories of DILI by type of reaction (10 in the book).
    points:
      - Direct toxic reactions
      - Idiosyncratic reactions
      - Combined toxic/allergic reactions
      - Allergic hepatitis
      - Cholestatic reactions
      - Granulomatous reactions
      - Chronic hepatitis and cirrhosis
      - Fatty liver / NASH
      - Veno-occlusive disease
      - Neoplastic
    pass: 7
    src: { page: 128 }
    status: unverified
    tags: [high-yield]

  # --- Diagnosis (p129-130) ---
  - id: hb.L08.017
    kind: card
    topic: diagnosis
    front: R value formula for DILI?
    back: R = (ALT ÷ ALT ULN) ÷ (ALP ÷ ALP ULN).
    src: { page: 129 }
    status: unverified
    tags: [high-yield]
  - id: hb.L08.018
    kind: cloze
    topic: diagnosis
    text: "R value bands: {{c1::>5}} hepatocellular, {{c2::2–5}} mixed, {{c3::<2}} cholestatic."
    src: { page: 129 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L08.019
    kind: card
    topic: diagnosis
    front: How far back does the DILI workflow ask about drug and supplement intake?
    back: 6 months.
    src: { page: 129 }
    status: unverified
  - id: hb.L08.020
    kind: order
    topic: diagnosis
    prompt: Order the work-up for suspected cholestatic DILI (R <2).
    steps: [Abdominal ultrasound, MRI or MRCP, Liver biopsy]
    src: { page: 129 }
    status: unverified
  - id: hb.L08.021
    kind: enumerate
    topic: diagnosis
    prompt: For hepatocellular or mixed DILI (R ≥2), what does the workflow test?
    points:
      - Abdominal ultrasound
      - Hepatitis A, B, C and E
      - "Then: other viruses (CMV, EBV, HSV)"
      - Autoimmune hepatitis
      - Budd-Chiari syndrome
      - Ischemic hepatitis
      - Wilson disease
    pass: 5
    src: { page: 129 }
    status: unverified
  - id: hb.L08.022
    kind: enumerate
    topic: diagnosis
    prompt: Mention the three drug-history elements needed to diagnose DILI.
    points: [Dose, Duration of therapy, "Latency: time from starting the drug to liver injury"]
    pass: 3
    src: { page: 129 }
    status: unverified
  - id: hb.L08.023
    kind: enumerate
    topic: diagnosis
    prompt: Which other liver diseases must be excluded before diagnosing DILI (book list)?
    points: [Hepatitis B, Hepatitis C, Alcoholic liver disease, Non-alcoholic fatty liver disease, Hemochromatosis]
    pass: 4
    src: { page: 129 }
    status: unverified
  - id: hb.L08.024
    kind: cloze
    topic: diagnosis
    text: "Most acute DILI occurs within {{c1::1 week to 3 months}} of exposure."
    src: { page: 130 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L08.025
    kind: cloze
    topic: diagnosis
    text: "Positive dechallenge in acute hepatocellular DILI: enzymes fall by {{c1::50%}} within {{c2::2 weeks}} and normalize by {{c3::4 weeks}}."
    src: { page: 130 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L08.026
    kind: card
    topic: diagnosis
    front: How does dechallenge differ in cholestatic DILI?
    back: Recovery may be prolonged.
    src: { page: 130 }
    status: unverified
  - id: hb.L08.027
    kind: card
    topic: diagnosis
    front: What is a structured tool for assessing DILI causality?
    back: RUCAM (Roussel Uclaf Causality Assessment Method). It scores latency, course after dechallenge, risk factors, concomitant drugs, exclusion of other causes, known hepatotoxicity and rechallenge.
    src: { page: 130 }
    status: unverified
    update:
      text: "Not named in the book. EASL recommends RUCAM as a structured aid to causality assessment, on top of expert judgment."
      ref: "EASL CPG drug-induced liver injury 2019"
  - id: hb.L08.028
    kind: calc
    topic: diagnosis
    calculator: r_ratio
    stem: A 45-year-old woman on amoxicillin-clavulanate for 10 days has jaundice and itching. ALT 120 U/L (ULN 40), ALP 600 U/L (ULN 120).
    inputs: { alt: 120, alt_uln: 40, alp: 600, alp_uln: 120 }
    expect: "R = 0.6, cholestatic"
    interpret: "R = 3 ÷ 5 = 0.6, which is below 2: cholestatic pattern. Next: abdominal ultrasound, then MRCP if needed."
    src: { page: 129 }
    status: unverified
  - id: hb.L08.029
    kind: calc
    topic: diagnosis
    calculator: r_ratio
    stem: A 35-year-old man on isoniazid for 6 weeks has nausea. ALT 900 U/L (ULN 40), ALP 130 U/L (ULN 130).
    inputs: { alt: 900, alt_uln: 40, alp: 130, alp_uln: 130 }
    expect: "R = 22.5, hepatocellular"
    interpret: "R = 22.5 ÷ 1 = 22.5, which is above 5: hepatocellular pattern. Next: ultrasound and hepatitis A, B, C, E serology."
    src: { page: 129 }
    status: unverified
  - id: hb.L08.030
    kind: calc
    topic: diagnosis
    calculator: r_ratio
    stem: A 60-year-old man on diclofenac has ALT 280 U/L (ULN 40) and ALP 300 U/L (ULN 120).
    inputs: { alt: 280, alt_uln: 40, alp: 300, alp_uln: 120 }
    expect: "R = 2.8, mixed"
    interpret: "R = 7 ÷ 2.5 = 2.8, between 2 and 5: mixed pattern."
    src: { page: 129 }
    status: unverified
  - id: hb.L08.031
    kind: enumerate
    topic: diagnosis
    prompt: Mention the hypersensitivity features that may accompany DILI.
    points: [Fever, Rash, Arthralgias, Eosinophilia]
    pass: 3
    src: { page: 130 }
    status: unverified

