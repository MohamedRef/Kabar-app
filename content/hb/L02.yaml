schema: batna.content/v1
lecture: hb.L02
title: Non-invasive assessment of liver fibrosis and portal hypertension
author: Dr. Waleed Ibrahim
book: { chapter: 1, pages: [23, 36] }
topics:
  - { id: principles, title: "Who to test and how NITs are used" }
  - { id: serum-tests, title: "Serum biomarkers and scores" }
  - { id: elastography, title: "Elastography and its limitations" }
  - { id: biopsy, title: "Liver biopsy and Metavir staging" }
  - { id: pathways, title: "Risk pathways (NAFLD, ALD, HCV)" }
  - { id: csph, title: "CSPH, varices and Baveno criteria" }
items:
  # ---------- p23-24: principles ----------
  - id: hb.L02.001
    kind: card
    topic: principles
    front: In low-prevalence populations, should non-invasive fibrosis tests be used to rule out or to diagnose advanced fibrosis?
    back: To rule out rather than diagnose advanced fibrosis.
    src: { page: 23, quote: "should be used for ruling out rather than diagnosing advanced fibrosis in low prevalence populations" }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.002
    kind: card
    topic: principles
    front: In whom should non-invasive fibrosis tests preferentially be used?
    back: Patients at risk of advanced fibrosis, such as those with metabolic risk factors and/or harmful use of alcohol, and not unselected general populations.
    src: { page: 23 }
    status: unverified
  - id: hb.L02.003
    kind: enumerate
    topic: serum-tests
    prompt: Mention the non-patented serum biomarkers of fibrosis.
    points: [AST/ALT ratio, APRI, FIB-4, NAFLD fibrosis score (NFS)]
    pass: 3
    src: { page: 23 }
    status: unverified
  - id: hb.L02.004
    kind: enumerate
    topic: serum-tests
    prompt: Mention the patented serum biomarkers of fibrosis.
    points: [FibroTest, ELF, FibroMeter, Hepascore]
    pass: 3
    src: { page: 23 }
    status: unverified
  - id: hb.L02.005
    kind: card
    topic: elastography
    front: Which elastography techniques does the lecture show, and how do availability and cost change across all NITs?
    back: TE, ARFI/2D-SWE and MRE. Serum biomarkers are the most available and cheapest (primary care); availability falls and cost rises towards MRE (liver clinics).
    src: { page: 23 }
    status: unverified
  - id: hb.L02.006
    kind: card
    topic: principles
    front: Which tests should be routine in primary care for suspected liver disease, and why?
    back: ALT, AST and platelet count, so that simple non-invasive scores can be calculated.
    src: { page: 24, quote: "ALT, AST and platelet count should be part of the routin investigations in primary care" }
    status: unverified
  - id: hb.L02.007
    kind: card
    topic: principles
    front: Where is automatic calculation and reporting of FIB-4 recommended?
    back: In primary care, for populations at risk of liver fibrosis (metabolic risk factors and/or harmful alcohol use), to improve risk stratification.
    src: { page: 24 }
    status: unverified
  - id: hb.L02.008
    kind: card
    topic: elastography
    front: Two ways elastography displays tissue response, and an example of each?
    back: Displacement without further processing (ARFI imaging), and shear wave speed (shear wave elastography).
    src: { page: 24 }
    status: unverified
  - id: hb.L02.009
    kind: cloze
    topic: elastography
    text: Shear wave elastography includes {{c1::transient elastography (TE)}}, {{c2::point shear wave elastography (pSWE)}}, and {{c3::2D-SWE and 3D-SWE}}.
    src: { page: 24 }
    status: unverified
  - id: hb.L02.010
    kind: card
    topic: elastography
    front: How is shear wave speed calculated?
    back: By measuring the arrival time of a shear wave at different locations in the tissue.
    src: { page: 24, quote: "calculated by measuring the arrival time of a shear wave at different locations in the tissue" }
    status: unverified
  - id: hb.L02.011
    kind: card
    topic: pathways
    front: "Primary-care pathway (metabolic or alcohol risk only): what happens with FIB-4 below 1.30?"
    back: Low risk. No referral; lifestyle modification; re-test in 1-3 years.
    src: { page: 24 }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.012
    kind: card
    topic: pathways
    front: "Primary-care pathway: FIB-4 of 1.30 or more. What next, and how is the result read?"
    back: Transient elastography. Below 8 kPa is low risk. 8 kPa or more is intermediate-high risk, so add patented serum tests if available; concordance means F3-F4 is highly likely, discordance (or no test) means consider liver biopsy.
    src: { page: 24 }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.013
    kind: card
    topic: pathways
    front: In the primary-care fibrosis pathway, who is sent straight to a liver specialist?
    back: Patients with viral hepatitis or other causes of chronic liver disease, or with clinical signs of advanced liver disease or cirrhosis.
    src: { page: 24 }
    status: unverified
  # ---------- p25: ALD, HCV, NAFLD recommendations ----------
  - id: hb.L02.014
    kind: cloze
    topic: pathways
    text: In patients referred at risk of ALD, LSM by TE {{c1::above 12-15 kPa}} rules in advanced fibrosis, after considering causes of false positives.
    src: { page: 25 }
    status: unverified
    tags: [numbers]
  - id: hb.L02.015
    kind: card
    topic: pathways
    front: An ALD patient has high liver stiffness and AST or GGT above 2x ULN. What should be done?
    back: Repeat LSM by TE after at least 1 week of alcohol abstinence or reduced drinking.
    src: { page: 25, quote: "LSM by TE should be repeated after at least 1 week of alcohol abstinence or reduced drinking" }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.016
    kind: card
    topic: pathways
    front: Should NITs be used routinely to detect fibrosis regression after SVR in HCV?
    back: No. Routine use of scores and elastography for this is not recommended, and untreated-HCV LSM cut-offs should not be used to stage fibrosis after SVR.
    src: { page: 25 }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.017
    kind: card
    topic: pathways
    front: Reference standard for diagnosing NASH, and why?
    back: Liver biopsy, because none of the available NITs has acceptable accuracy.
    src: { page: 25, quote: "Liver biopsy remains the reference standard for the diagnosis of NASH" }
    status: unverified
    update:
      text: Since 2023 NAFLD is called MASLD and NASH is called MASH (multi-society nomenclature). The book uses both names.
      ref: AASLD/EASL/ALEH multi-society Delphi consensus 2023
  - id: hb.L02.018
    kind: cloze
    topic: pathways
    text: "In NAFLD, advanced fibrosis is ruled out by LSM by TE {{c1::below 8 kPa}}, FibroTest {{c2::below 0.48}}, or FIB-4 {{c3::below 1.3}}."
    src: { page: 25 }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L02.019
    kind: card
    topic: pathways
    front: A NAFLD patient is referred with FIB-4 above 1.3. What next?
    back: TE and/or patented serum tests to rule out or rule in advanced fibrosis.
    src: { page: 25 }
    status: unverified
  - id: hb.L02.020
    kind: card
    topic: elastography
    front: Most accurate non-invasive method for staging fibrosis, and why is it not first line?
    back: MR elastography (MRE). It is only marginally better than other NITs for F3-F4, and it is costly with limited availability.
    src: { page: 25, quote: "MRE is the most accurate non-invasive method for staging liver fibrosis" }
    status: unverified
    tags: [high-yield]
  # ---------- p26: biopsy ----------
  - id: hb.L02.021
    kind: cloze
    topic: biopsy
    text: "AASLD liver biopsy: at least {{c1::2-3 cm}} long, with a {{c2::16-gauge}} needle; fewer than {{c3::11}} complete portal tracts may give wrong grading and staging."
    src: { page: 26 }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L02.022
    kind: cloze
    topic: biopsy
    text: Even a 25 mm liver biopsy has a {{c1::25%}} rate of discordance for fibrosis staging.
    src: { page: 26 }
    status: unverified
    tags: [numbers]
  - id: hb.L02.023
    kind: enumerate
    topic: biopsy
    prompt: Mention the contraindications of liver biopsy.
    points:
      - Uncooperative patient
      - Coagulation disorders
      - Severe ascites
      - Cystic lesion
      - Vascular tumour (hemangioma)
      - Amyloidosis
      - Congestive liver disease
    pass: 5
    src: { page: 26 }
    status: unverified
    tags: [high-yield]
  # ---------- p27: comparison and cut-offs ----------
  - id: hb.L02.024
    kind: table
    topic: principles
    title: Comparison of methods for assessing liver fibrosis (book Table 1, p27)
    columns: [Parameter, Liver biopsy, Indirect blood tests, Direct blood tests, US-based elastography, MR-based elastography]
    rows:
      - [Examples, "Percutaneous, transjugular, mini-laparoscopic", "APRI, FIB-4, NFS", "FibroTest, HepaScore, ELF", "VCTE, ARFI, 2D-SWE", Different manufacturers]
      - [Accuracy, "++ to +++", "+ to ++", "++", "++", "++ to +++"]
      - [Validation, "+++ (gold standard)", "++", "++", "++ to +++", "++ to +++"]
      - [Safety, "-", "+++", "+++", "+++", "+++"]
      - [Availability, "++", "+++", "+", "++", "+"]
      - [Cost, "+++", "- to +", "+ to ++", "++", "+++"]
      - [Monitoring, "+", "+++", "+", "++", "+"]
    blanks: [[0, 1], [0, 2], [0, 3], [0, 4], [2, 1], [3, 1], [5, 2]]
    src: { page: 27 }
    status: unverified
  - id: hb.L02.025
    kind: card
    topic: serum-tests
    front: Which blood tests are indirect and which are direct fibrosis markers in the book's table?
    back: "Indirect: APRI, FIB-4, NFS. Direct: FibroTest, HepaScore, ELF."
    src: { page: 27 }
    status: unverified
  - id: hb.L02.026
    kind: card
    topic: principles
    front: Which fibrosis method is best for monitoring, and which is the gold standard for validation?
    back: Indirect blood tests are best for monitoring (+++, also safest, most available, cheapest). Liver biopsy is the gold standard (+++ validation) but the least safe.
    src: { page: 27 }
    status: unverified
  - id: hb.L02.027
    kind: cloze
    topic: elastography
    text: "Liver stiffness cut-offs figure (Metavir): F2 from {{c1::7}} kPa, F3 from {{c2::9.5}} kPa, F4 (cirrhosis) from {{c3::12.5}} kPa, on a scale of 2.5-75 kPa."
    src: { page: 27 }
    status: unverified
    tags: [numbers]
  # ---------- p28: Metavir ----------
  - id: hb.L02.028
    kind: card
    topic: biopsy
    front: What two scores does the Metavir system assign to a biopsy?
    back: Activity (A0 none, A1 mild, A2 moderate, A3 severe) and fibrosis (F0-F4).
    src: { page: 28 }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.029
    kind: cloze
    topic: biopsy
    text: "Metavir fibrosis: F1 = {{c1::portal fibrosis without septa}}; F2 = {{c2::portal fibrosis with infrequent septa}}; F3 = {{c3::numerous septa but no cirrhosis}}; F4 = cirrhosis."
    src: { page: 28 }
    status: unverified
    tags: [high-yield]
  # ---------- p29: LSM algorithm and CAP ----------
  - id: hb.L02.030
    kind: cloze
    topic: elastography
    text: "LSM algorithm (Vizzutti): {{c1::6 kPa or less}} = no significant fibrosis (F0-F1), no biopsy; {{c2::12.5 kPa or more}} = advanced fibrosis (F3-F4), no biopsy, treat or follow up."
    src: { page: 29 }
    status: unverified
    tags: [numbers]
  - id: hb.L02.031
    kind: card
    topic: elastography
    front: What does the LSM algorithm advise for intermediate values (grey area, F2)?
    back: Liver biopsy if the result would change management, and other non-invasive tests.
    src: { page: 29 }
    status: unverified
  - id: hb.L02.032
    kind: table
    topic: elastography
    title: Controlled attenuation parameter (CAP) and steatosis (p29)
    columns: [CAP score, Steatosis grade, Liver with fatty change]
    rows:
      - ["238-260 dB/m", S1, "11-33%"]
      - ["260-290 dB/m", S2, "34-66%"]
      - ["Above 290 dB/m", S3, "67% or more"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 29 }
    status: unverified
    tags: [numbers]
  # ---------- p30: NAFLD algorithm and rule of five ----------
  - id: hb.L02.033
    kind: card
    topic: pathways
    front: "Step 1 of the fibrosis pathway: who is at risk?"
    back: Patients with 2 or more metabolic risk factors, type 2 diabetes, or steatosis on any imaging or raised aminotransferases.
    src: { page: 30 }
    status: unverified
  - id: hb.L02.034
    kind: cloze
    topic: pathways
    text: "Step 3 FIB-4: below {{c1::1.3}} = low risk; 1.3-2.67 = indeterminate; above {{c2::2.67}} = high risk."
    src: { page: 30 }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L02.035
    kind: cloze
    topic: pathways
    text: "Step 4 LSM: below {{c1::8 kPa}} = low risk; 8-12 kPa = indeterminate; above {{c2::12 kPa}} = high risk."
    src: { page: 30 }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L02.036
    kind: card
    topic: pathways
    front: How is each risk level managed in the step-wise fibrosis pathway?
    back: "Low: repeat NIT in 2-3 years unless things change. Indeterminate: hepatologist for biopsy or MR elastography, or monitoring with re-evaluation in 2-3 years. High: refer to a hepatologist."
    src: { page: 30 }
    status: unverified
  - id: hb.L02.037
    kind: order
    topic: pathways
    prompt: Put the step-wise fibrosis risk pathway in order.
    steps:
      - Identify patients at risk (metabolic risk factors, type 2 diabetes, steatosis or raised aminotransferases)
      - History and laboratory tests (alcohol intake, CBC, liver function tests)
      - Non-invasive fibrosis test such as FIB-4
      - Liver stiffness measurement if FIB-4 is indeterminate
      - Classify risk and refer or repeat testing
    src: { page: 30 }
    status: unverified
  - id: hb.L02.038
    kind: cloze
    topic: csph
    text: "Rule-of-five figure: LSM below {{c1::10}} kPa = no cACLD (very low risk of liver-related events); below 15 kPa with platelets above 150 = {{c2::no CSPH}}; {{c3::25}} kPa or more = CSPH."
    src: { page: 30 }
    status: unverified
    tags: [high-yield, numbers]
  # ---------- p31: Baveno flowchart and etiology cut-offs ----------
  - id: hb.L02.039
    kind: cloze
    topic: csph
    text: In compensated chronic liver disease, LSM above {{c1::10}} kPa makes advanced chronic liver disease probable, and above {{c2::12-15}} kPa very probable.
    src: { page: 31 }
    status: unverified
    tags: [numbers]
  - id: hb.L02.040
    kind: card
    topic: csph
    front: Which imaging signs add to LSM for cACLD and for CSPH?
    back: "cACLD: nodular liver surface. CSPH: portosystemic collaterals and spleen size."
    src: { page: 31 }
    status: unverified
  - id: hb.L02.041
    kind: cloze
    topic: csph
    text: LSM above {{c1::20 kPa}} makes CSPH very likely (about {{c2::90%}}).
    src: { page: 31 }
    status: unverified
    tags: [numbers]
  - id: hb.L02.042
    kind: card
    topic: csph
    front: When are the Baveno criteria NOT met, and what follows?
    back: When LSM is 20 kPa or more, or platelets are below 150 G/L. Then perform screening endoscopy.
    src: { page: 31 }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.043
    kind: card
    topic: csph
    front: What follows when LSM is below 20 kPa and platelets above 150 G/L?
    back: Varices needing treatment are very unlikely (under 5%), so endoscopic screening can be safely avoided; repeat LSM and platelets every year.
    src: { page: 31 }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.044
    kind: card
    topic: csph
    front: What does likely CSPH mean for the patient, and which test quantifies it?
    back: Increased risk of clinical decompensation. HVPG is needed to quantify the severity of portal hypertension exactly.
    src: { page: 31 }
    status: unverified
  - id: hb.L02.045
    kind: table
    topic: elastography
    title: Liver stiffness cut-offs (kPa) by etiology (p31)
    columns: [Etiology, F0-F1, F2, F3, F4]
    rows:
      - [Hepatitis B, "2-7", "8-9", "8-11", "18 or higher"]
      - [Hepatitis C, "2-7", "8-9", "9-14", "14 or higher"]
      - [HIV/HCV coinfection, "2-7", "7-11", "11-14", "14 or higher"]
      - [Cholestatic disease, "2-7", "7-9", "9-17", "17 or higher"]
      - [NAFLD or NASH, "2-7", "7.5-10", "10-14", "14 or higher"]
      - [Alcohol-related disease, "2-7", "7-11", "11-19", "19 or higher"]
    blanks: [[0, 4], [1, 4], [2, 4], [3, 4], [4, 4], [5, 4], [1, 3], [5, 3]]
    src: { page: 31 }
    status: unverified
    tags: [numbers]
  - id: hb.L02.046
    kind: cloze
    topic: elastography
    text: "Cirrhosis (F4) stiffness thresholds: hepatitis B {{c1::18}} kPa, hepatitis C {{c2::14}} kPa, alcohol-related disease {{c3::19}} kPa."
    src: { page: 31 }
    status: unverified
    tags: [numbers]
  # ---------- p32: TE limitations ----------
  - id: hb.L02.047
    kind: table
    topic: elastography
    title: Limitations of transient elastography with CAP (p32)
    columns: [Limitation, Explanation]
    rows:
      - [Ascites, Elastic waves do not travel through liquids]
      - [Obesity, "BMI above 30 is associated with TE failure; the XL probe has reduced the failure rate"]
      - [Acute hepatitis, Tissue changes may increase LSM]
      - [Chronic hepatitis with transaminase flare, "ALT above 5x ULN risks overestimating fibrosis stage"]
      - [Extrahepatic cholestasis, Increases LSM independently of fibrosis stage]
      - [Congestive heart failure, Increased blood volume in the liver may increase LSM]
      - [Narrow intercostal spaces, "Lower success or failed acquisition; the S probe has reduced the failure rate"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1]]
    src: { page: 32 }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.048
    kind: cloze
    topic: elastography
    text: In a chronic hepatitis flare, ALT above {{c1::5 times}} the upper normal limit risks overestimating the fibrosis stage on TE.
    src: { page: 32 }
    status: unverified
    tags: [numbers]
  - id: hb.L02.049
    kind: card
    topic: elastography
    front: Which TE probes help in obesity and in narrow intercostal spaces?
    back: The XL probe for obesity (BMI above 30) and the S probe for narrow intercostal spaces.
    src: { page: 32 }
    status: unverified
  - id: hb.L02.050
    kind: card
    topic: elastography
    front: Why does ascites prevent transient elastography?
    back: Elastic (shear) waves do not travel through liquids.
    src: { page: 32 }
    status: unverified
  # ---------- p32-34: scores ----------
  - id: hb.L02.051
    kind: cloze
    topic: serum-tests
    text: "FIB-4 ranges in the book's figure: below {{c1::1.45}} = minimal or no fibrosis; 1.45-3.39 = significant fibrosis; {{c2::3.4}} or more = advanced fibrosis or cirrhosis."
    src: { page: 33 }
    status: unverified
    tags: [numbers]
    update:
      text: "The original FIB-4 cut-offs (HIV/HCV cohort) are below 1.45 and above 3.25; for NAFLD the lecture's own pathway uses 1.3 and 2.67."
      ref: Sterling et al., Hepatology 2006
  - id: hb.L02.052
    kind: card
    topic: serum-tests
    front: Which values are entered to calculate APRI?
    back: AST, the upper limit of normal, and the platelet count. The book's figure says "ALT upper limit"; APRI uses the AST upper limit (see book issues).
    src: { page: 33 }
    status: unverified
  - id: hb.L02.053
    kind: cloze
    topic: serum-tests
    text: "APRI below {{c1::0.5}} = minimal or no fibrosis; 0.5-1.5 = moderate or significant fibrosis; above {{c2::1.5}} = severe fibrosis or cirrhosis."
    src: { page: 34 }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L02.054
    kind: enumerate
    topic: serum-tests
    prompt: Mention the five serum parameters of FibroTest, and what else it takes into account.
    points:
      - Apolipoprotein A1
      - Alpha-2-macroglobulin
      - Gamma-GT
      - Total bilirubin
      - Haptoglobin
      - (Plus patient age and gender)
    pass: 4
    src: { page: 34 }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.055
    kind: card
    topic: serum-tests
    front: FibroTest - US name, standing, and main use?
    back: FibroSure in the USA. It is the most studied and extensively validated algorithm, used mainly in chronic viral hepatitis, and is commercially available.
    src: { page: 34 }
    status: unverified
  - id: hb.L02.056
    kind: enumerate
    topic: serum-tests
    prompt: Mention the six blood indices of FibroMeter.
    points: [Platelet count, Prothrombin index, AST, Alpha-2-macroglobulin, Hyaluronic acid, Blood urea]
    pass: 4
    src: { page: 34 }
    status: unverified
  - id: hb.L02.057
    kind: card
    topic: serum-tests
    front: Components of the ELF score, and where is it most useful?
    back: Hyaluronic acid, TIMP-1 and amino-terminal propeptide of type III collagen. Useful in many chronic liver diseases, especially ALD and NAFLD.
    src: { page: 35 }
    status: unverified
  # ---------- p35-36: CSPH ----------
  - id: hb.L02.058
    kind: cloze
    topic: csph
    text: LSM by TE {{c1::above 20-25 kPa}} should be used to diagnose CSPH in patients with cACLD.
    src: { page: 35, quote: "LSM by TE at a cut-off of >20-25 kPa should be used to diagnose CSPH" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L02.059
    kind: card
    topic: csph
    front: Which additional NITs improve risk stratification for CSPH?
    back: Platelet count, spleen size, and spleen stiffness.
    src: { page: 35 }
    status: unverified
  - id: hb.L02.060
    kind: card
    topic: csph
    front: What do portosystemic collaterals on US, CT or MRI mean in cACLD?
    back: They are a sign of CSPH and should be routinely reported.
    src: { page: 35 }
    status: unverified
  - id: hb.L02.061
    kind: card
    topic: csph
    front: What is the only validated tool for the exact severity of portal hypertension and the response to treatment?
    back: HVPG. It should not be replaced by NITs.
    src: { page: 35, quote: "HVPG remains the only validated tool and should not be substituted by NITS" }
    status: unverified
    tags: [high-yield]
  - id: hb.L02.062
    kind: cloze
    topic: csph
    text: "Baveno VI criteria: LSM by TE {{c1::below 20 kPa}} and platelets {{c2::above 150 G/L}} rule out high-risk varices, so endoscopic screening can be avoided."
    src: { page: 35, quote: "LSM by TE <20 kPa and platelet count >150 G/L (Baveno VI criteria)" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L02.063
    kind: card
    topic: csph
    front: In which etiologies of cACLD are the Baveno VI criteria validated?
    back: Untreated viral hepatitis, HIV-HCV coinfection, alcohol, NAFLD, PBC and PSC.
    src: { page: 35 }
    status: unverified
  - id: hb.L02.064
    kind: card
    topic: csph
    front: Role of spleen stiffness for varices in cACLD?
    back: An additional tool to refine the risk of high-risk varices (weak recommendation).
    src: { page: 35 }
    status: unverified
  - id: hb.L02.065
    kind: card
    topic: csph
    front: Should CT be used to screen for oesophageal and gastric varices?
    back: Not for primary screening, but varices seen on a routine CT should be looked for and reported.
    src: { page: 36 }
    status: unverified
  - id: hb.L02.066
    kind: card
    topic: csph
    front: How is liver stiffness used for prognosis in cACLD?
    back: Stiffness at diagnosis, with liver function tests, stratifies the risk of decompensation and mortality. Annual repeat measurements can refine it (weak recommendation).
    src: { page: 36 }
