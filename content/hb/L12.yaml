items:
- id: hb.L12.001
  kind: cloze
  topic: ald
  text: 'The 3 characteristic hepatic lesions of heavy alcohol use: {{c1::fatty liver (steatosis)}}, {{c2::alcoholic
    hepatitis}} and {{c3::fibrosis/cirrhosis}}.'
  src:
    page: 195
  status: unverified
- id: hb.L12.002
  kind: cloze
  topic: ald
  text: Steatosis is the earliest and most common response to alcohol, seen in more than {{c1::90%}} of problem
    drinkers who take {{c2::4–5 standard drinks}} a day over decades.
  src:
    page: 195
    quote: develops in more than 90 percent of problem drinkers who consume 4 to 5 standard drinks per day
  status: unverified
  tags:
  - numbers
- id: hb.L12.003
  kind: card
  topic: ald
  front: Is alcoholic steatosis benign?
  back: No. It was once thought benign, but chronic steatosis makes the liver more prone to fibrosis, because fat
    raises the risk of lipid peroxidation and oxidative damage.
  src:
    page: 195
  status: unverified
  tags:
  - high-yield
- id: hb.L12.004
  kind: card
  topic: ald
  front: Typical histology of alcoholic fatty liver?
  back: Centrilobular macrovesicular steatosis with a variable degree of fibrosis.
  src:
    page: 195
  status: unverified
- id: hb.L12.005
  kind: card
  topic: ald
  front: Differential diagnosis of alcoholic steatosis given in the book?
  back: Diabetes and obesity (metabolic fatty liver).
  src:
    page: 195
  status: unverified
- id: hb.L12.006
  kind: cloze
  topic: ald
  text: Daily intake of {{c1::40–80 g}} ethanol in men or {{c2::20–40 g}} in women for {{c3::10–12 years}} predicts
    alcoholic steatohepatitis, fibrosis and cirrhosis.
  src:
    page: 195
    quote: 40 to 80 grams ethanol/day by males and of 20 to 40 grams/day by females for 10 to 12 years
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L12.007
  kind: enumerate
  topic: ald
  prompt: Enumerate the modifiers of ALD risk.
  points:
  - Pattern of consumption and beverage type (amount and duration)
  - Female sex (women are more susceptible)
  - Older age (65 and over)
  - Genetics (family history of liver disease)
  - Obesity (high BMI)
  - Smoking
  - Viral infection (HBV, HCV)
  pass: 5
  src:
    page: 195
  status: unverified
  tags:
  - high-yield
- id: hb.L12.008
  kind: card
  topic: ald
  front: How do HBV or HCV coinfection change the course of ALD?
  back: They cause rapid progression to fibrosis, cirrhosis and even HCC.
  src:
    page: 196
  status: unverified
- id: hb.L12.009
  kind: card
  topic: ald
  front: Which sex and which age group are more vulnerable to alcoholic liver damage?
  back: Women, and older adults aged 65 and over.
  src:
    page: 195
  status: unverified
- id: hb.L12.010
  kind: card
  topic: ald
  front: Which lifestyle habit, besides drinking, raises the risk of alcoholic cirrhosis?
  back: Smoking (obesity also adds risk).
  src:
    page: 196
  status: unverified
- id: hb.L12.011
  kind: enumerate
  topic: ald-mx
  prompt: Mention the lines of management of alcoholic liver disease.
  points:
  - Abstinence
  - Corticosteroids (moderate to severe alcoholic hepatitis)
  - Nutritional supplements (zinc)
  - Liver transplantation (end-stage disease)
  pass: 4
  src:
    page: 196
  status: unverified
- id: hb.L12.012
  kind: card
  topic: ald-mx
  front: What does abstinence achieve in ALD?
  back: It resolves alcoholic steatosis and improves survival in patients who already have cirrhosis.
  src:
    page: 196
  status: unverified
  tags:
  - high-yield
- id: hb.L12.013
  kind: card
  topic: ald-mx
  front: For which patients are corticosteroids used in ALD, and why do they work?
  back: Moderate to severe alcoholic hepatitis. They suppress the immune response and the proinflammatory cytokine
    response.
  src:
    page: 196
  status: unverified
- id: hb.L12.014
  kind: cloze
  topic: ald-mx
  text: Liver function in ALD and HCV patients improved with {{c1::50 mg}} of elemental {{c2::zinc}}.
  src:
    page: 196
  status: unverified
  tags:
  - numbers
- id: hb.L12.015
  kind: card
  topic: hh-path
  front: What is hemochromatosis, and how is the classic form inherited?
  back: An inherited disease of excess dietary iron absorption. The patient must inherit two defective genes, one
    from each parent (autosomal recessive).
  src:
    page: 196
  status: unverified
- id: hb.L12.016
  kind: card
  topic: hh-path
  front: Who is affected more by hemochromatosis?
  back: Males, significantly more than females, and prevalence rises with age.
  src:
    page: 197
  status: unverified
- id: hb.L12.017
  kind: cloze
  topic: hh-path
  text: The central regulator of systemic iron homeostasis is {{c1::hepcidin}}, a peptide hormone made mainly by
    {{c2::hepatocytes}}.
  src:
    page: 197
  status: unverified
  tags:
  - high-yield
- id: hb.L12.018
  kind: card
  topic: hh-path
  front: Pathogenesis of hemochromatosis in one chain?
  back: Deficient or impaired hepcidin → more intestinal iron absorption and more iron release from macrophages
    → expanded circulating iron pool → raised transferrin saturation → tissue iron loading.
  src:
    page: 197
  status: unverified
  tags:
  - high-yield
- id: hb.L12.019
  kind: card
  topic: hh-path
  front: Which organ stores iron first in hemochromatosis, and where does it go next?
  back: The liver. Once its capacity is exhausted, iron accumulates in the heart, pituitary, pancreas and elsewhere.
  src:
    page: 197
  status: unverified
- id: hb.L12.020
  kind: cloze
  topic: hh-path
  text: Untreated hemochromatosis leads to liver {{c1::fibrosis}}, {{c2::cirrhosis}} and {{c3::hepatocellular carcinoma}}.
  src:
    page: 197
  status: unverified
- id: hb.L12.021
  kind: table
  topic: hh-path
  title: Types of hemochromatosis
  columns:
  - Type
  - Gene
  - Key feature
  rows:
  - - Type 1 (classic HH)
    - HFE (bi-allelic)
    - Common in Caucasians
  - - Type 2A (juvenile)
    - HJV (hemojuvelin)
    - Rare; severe overload before age 30
  - - Type 2B (juvenile)
    - HAMP (encodes hepcidin)
    - Rare; severe overload before age 30
  - - Type 3
    - TFR2
    - Iron overload with later onset
  - - Type 4 (ferroportin disease)
    - Ferroportin
    - Autosomal dominant, milder; affects iron transport, not absorption
  blanks:
  - - 0
    - 1
  - - 1
    - 1
  - - 2
    - 1
  - - 3
    - 1
  - - 4
    - 2
  - - 1
    - 2
  src:
    page: 197
  status: unverified
  tags:
  - high-yield
- id: hb.L12.022
  kind: card
  topic: hh-path
  front: Which hemochromatosis type is autosomal dominant?
  back: Type 4, ferroportin disease. It is milder and affects iron transport rather than absorption.
  src:
    page: 198
  status: unverified
- id: hb.L12.023
  kind: card
  topic: hh-path
  front: Which hemochromatosis type causes severe iron overload before age 30?
  back: Type 2, juvenile hemochromatosis (HJV = 2A, HAMP = 2B).
  src:
    page: 197
  status: unverified
- id: hb.L12.024
  kind: cloze
  topic: hh-clinical
  text: The liver retains iron from birth, but symptoms may take {{c1::20–30 years}} to appear.
  src:
    page: 198
  status: unverified
  tags:
  - numbers
- id: hb.L12.025
  kind: enumerate
  topic: hh-clinical
  prompt: Mention the typical symptoms and signs of hemochromatosis.
  points:
  - Weakness and fatigue
  - Greyish-brown skin discoloration
  - Diabetes
  - Osteoporosis
  - Arthropathy
  - 'In severe or early-onset disease: hypogonadotrophic hypogonadism, hypothyroidism, heart failure'
  - 'Late: cirrhosis (abdominal pain, jaundice, ascites, variceal bleeding)'
  pass: 5
  src:
    page: 198
  status: unverified
  tags:
  - high-yield
- id: hb.L12.026
  kind: card
  topic: hh-clinical
  front: Which features suggest severe or early-onset hemochromatosis?
  back: Hypogonadotrophic hypogonadism, hypothyroidism and heart failure.
  src:
    page: 198
  status: unverified
- id: hb.L12.027
  kind: cloze
  topic: hh-clinical
  text: The most common tests for hemochromatosis are {{c1::transferrin saturation}} and {{c2::serum ferritin}},
    with a {{c3::genetic test}} as a newer option.
  src:
    page: 198
  status: unverified
  tags:
  - high-yield
- id: hb.L12.028
  kind: card
  topic: hh-clinical
  front: What is the role of liver biopsy in hemochromatosis?
  back: It is not recommended to diagnose iron overload. It may be used to assess for cirrhosis, but not when cirrhosis
    is already clear.
  src:
    page: 198
  status: unverified
- id: hb.L12.029
  kind: card
  topic: hh-clinical
  front: Who should be screened once a patient is diagnosed with hemochromatosis?
  back: The spouse, brothers and sisters, and children over 18. Siblings matter most.
  src:
    page: 198
  status: unverified
  tags:
  - high-yield
- id: hb.L12.030
  kind: cloze
  topic: hh-clinical
  text: Siblings of a hemochromatosis patient have a {{c1::25%}} chance of inheriting both defective genes.
  src:
    page: 198
    quote: they have a 25 percent chance of inheriting the defective genes from their parents
  status: unverified
  tags:
  - numbers
- id: hb.L12.031
  kind: cloze
  topic: hh-clinical
  text: Patients with hemochromatosis and cirrhosis need HCC screening every {{c1::6 months}}, {{c2::regardless
    of iron depletion}}.
  src:
    page: 199
    quote: HCC screening every 6 months, regardless of iron depletion
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L12.032
  kind: card
  topic: hh-clinical
  front: How is HCC surveillance done in hemochromatosis with cirrhosis?
  back: Imaging every 6 months, optionally combined with serum AFP.
  src:
    page: 199
  status: unverified
- id: hb.L12.033
  kind: card
  topic: hh-clinical
  front: First-line treatment for iron depletion in hemochromatosis? Alternative in selected cases?
  back: Therapeutic phlebotomy. Personalized erythrocytapheresis is preferred in selected cases.
  src:
    page: 199
  status: unverified
  tags:
  - high-yield
- id: hb.L12.034
  kind: card
  topic: wilson
  front: Gene and inheritance of Wilson disease?
  back: ATP7B, autosomal recessive. It impairs biliary copper excretion, so copper builds up mainly in the liver
    and brain.
  src:
    page: 199
  status: unverified
  tags:
  - high-yield
- id: hb.L12.035
  kind: cloze
  topic: wilson
  text: Wilson disease affects about {{c1::1 in 30,000}} people.
  src:
    page: 199
  status: unverified
  tags:
  - numbers
- id: hb.L12.036
  kind: card
  topic: wilson
  front: Why is untreated Wilson disease fatal?
  back: Through liver failure, neurological complications or psychiatric disturbance.
  src:
    page: 199
  status: unverified
- id: hb.L12.037
  kind: card
  topic: wilson
  front: How can Wilson disease present in the liver?
  back: As hepatitis, as an abrupt fall in liver function (acute liver failure), or only later as chronic liver
    disease with complications of cirrhosis.
  src:
    page: 199
  status: unverified
  tags:
  - high-yield
- id: hb.L12.038
  kind: enumerate
  topic: wilson
  prompt: Mention the neurological symptoms of Wilson disease.
  points:
  - Problems with speech, swallowing or coordination
  - Stiff muscles
  - Tremor or uncontrolled movements
  pass: 3
  src:
    page: 200
  status: unverified
- id: hb.L12.039
  kind: enumerate
  topic: wilson
  prompt: Mention the psychiatric symptoms of Wilson disease.
  points:
  - Anxiety
  - Changes in mood, personality or behaviour
  - Depression
  - Psychosis
  pass: 3
  src:
    page: 200
  status: unverified
- id: hb.L12.040
  kind: enumerate
  topic: wilson
  prompt: Enumerate the other (non-hepatic, non-neuropsychiatric) features of Wilson disease.
  points:
  - Hemolytic anemia
  - 'Bone and joint: arthritis, osteoporosis'
  - 'Heart: cardiomyopathy'
  - 'Kidney: renal tubular acidosis, kidney stones'
  - 'Eye: Kayser-Fleischer rings'
  pass: 4
  src:
    page: 200
  status: unverified
  tags:
  - high-yield
- id: hb.L12.041
  kind: card
  topic: wilson
  front: What are Kayser-Fleischer rings?
  back: Green, gold or brown rings at the edge of the cornea, caused by copper deposition in the eye.
  src:
    page: 200
  status: unverified
- id: hb.L12.042
  kind: cloze
  topic: wilson
  text: In Wilson disease, serum ceruloplasmin is usually {{c1::low}}, while blood copper may be {{c2::high or low}}.
  src:
    page: 200
  status: unverified
  tags:
  - high-yield
- id: hb.L12.043
  kind: enumerate
  topic: wilson
  prompt: Mention the investigations for Wilson disease listed in the book.
  points:
  - Serum ceruloplasmin (low)
  - Serum copper (high or low)
  - ALT and AST (raised with liver damage)
  - Red cell count (may be low)
  - Liver biopsy
  pass: 4
  src:
    page: 200
  status: unverified
- id: hb.L12.044
  kind: cloze
  topic: wilson
  text: 'Wilson treatment: chelating agents {{c1::penicillamine}} and {{c2::trientine}}, and {{c3::zinc}}, which
    blocks intestinal copper absorption.'
  src:
    page: 201
  status: unverified
  tags:
  - high-yield
- id: hb.L12.045
  kind: card
  topic: aatd
  front: Gene defect in alpha-1 antitrypsin deficiency, and what AAT normally does?
  back: SERPINA1 mutations give low AAT, a protective enzyme made mainly in the liver that shields tissues, especially
    the lungs, from enzymes released by inflammatory cells.
  src:
    page: 201
  status: unverified
  tags:
  - high-yield
- id: hb.L12.046
  kind: cloze
  topic: aatd
  text: In AATD, lung symptoms (COPD-like) usually start between ages {{c1::30 and 50}}. Liver disease develops
    in about {{c2::10%}} of infants and {{c3::15%}} of adults.
  src:
    page: 201
    quote: About 10% of infants and 15% of adults with Alpha-1 develop liver disease
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L12.047
  kind: enumerate
  topic: aatd
  prompt: Mention the investigations for AATD.
  points:
  - Serum AAT level (low)
  - Phenotyping or genotyping (e.g. ZZ, SZ)
  - Pulmonary function tests
  - Chest X-ray or CT (lower-lobe emphysema)
  - Liver ultrasound or elastography (FibroScan)
  pass: 4
  src:
    page: 201
  status: unverified
- id: hb.L12.048
  kind: card
  topic: aatd
  front: Where is emphysema typically seen on imaging in AATD?
  back: In the lower lungs.
  src:
    page: 202
  status: unverified
- id: hb.L12.049
  kind: card
  topic: aatd
  front: Does AAT augmentation therapy help AATD liver disease?
  back: No. IV AAT slows lung damage, but it cannot be targeted to the liver, so it does not treat liver disease.
  src:
    page: 202
  status: unverified
  tags:
  - high-yield
- id: hb.L12.050
  kind: card
  topic: aatd
  front: Why is liver transplantation curative in AATD?
  back: The new liver becomes a source of normal AAT production.
  src:
    page: 202
  status: unverified
  tags:
  - high-yield
- id: hb.L12.051
  kind: enumerate
  topic: aatd
  prompt: Enumerate the supportive measures in AATD besides augmentation and transplant.
  points:
  - Bronchodilators and inhaled corticosteroids for COPD symptoms
  - Antibiotics for respiratory infections
  - Avoid alcohol
  - Stop smoking
  - Avoid dust, fumes and chemicals
  - Balanced diet
  - Vaccinate against influenza, pneumococcus, hepatitis A and B
  pass: 5
  src:
    page: 202
  status: unverified
- id: hb.L12.052
  kind: cloze
  topic: aatd
  text: 'Vaccines for AATD patients: {{c1::influenza}}, {{c2::pneumococcus}}, and {{c3::hepatitis A and B}}.'
  src:
    page: 203
  status: unverified
- id: hb.L12.053
  kind: mcq
  topic: ald
  stem: A 50-year-old woman drinks about 30 g of ethanol a day and has done so for 12 years. Ultrasound shows a
    bright liver. Which statement fits the book best?
  options:
  - Her steatosis is benign and needs no action
  - Her intake and duration predict risk of steatohepatitis, fibrosis and cirrhosis
  - Steatosis protects her from fibrosis
  - Only men are at risk at this level of intake
  - Her intake is too low to cause steatohepatitis in a woman
  answer: 1
  why:
  - Chronic steatosis increases susceptibility to fibrosis.
  - Correct. Women at 20–40 g/day for 10–12 years are at risk.
  - Fat increases lipid peroxidation and oxidative damage.
  - Women are more susceptible, at lower intake.
  - 20–40 g/day for 10–12 years is the risk range for women.
  src:
    page: 195
  status: unverified
- id: hb.L12.054
  kind: mcq
  topic: ald
  stem: Which of the following is NOT listed in the book as a modifier that increases the risk of alcoholic liver
    disease?
  options:
  - Female sex
  - Coffee drinking
  - Chronic HCV infection
  - Obesity
  - Smoking
  answer: 1
  why:
  - Women are more susceptible.
  - Correct. Coffee is not on the book's list.
  - HCV and HBV speed progression to fibrosis, cirrhosis and HCC.
  - High BMI raises the risk.
  - Smoking raises the risk of alcoholic cirrhosis.
  src:
    page: 195
  status: unverified
- id: hb.L12.055
  kind: mcq
  topic: ald-mx
  stem: A 44-year-old man with alcoholic cirrhosis asks which single measure will most improve his survival. What
    is the best answer from the book?
  options:
  - Lifelong corticosteroids
  - Zinc 50 mg daily
  - Phlebotomy
  - Complete abstinence from alcohol
  - Liver biopsy every year
  answer: 3
  why:
  - Steroids are for moderate to severe alcoholic hepatitis, not lifelong cirrhosis care.
  - Zinc may help liver function, but evidence is from few studies.
  - Phlebotomy treats hemochromatosis.
  - Correct. Abstinence resolves steatosis and improves survival in cirrhosis.
  - Biopsy does not improve survival.
  src:
    page: 196
  status: unverified
- id: hb.L12.056
  kind: mcq
  topic: hh-path
  stem: The basic defect behind most forms of hereditary hemochromatosis is
  options:
  - Low alpha-1 antitrypsin
  - Increased iron loss from macrophages to bile
  - Excess hepcidin production
  - Failure of biliary copper excretion
  - Deficient or impaired hepcidin synthesis or function
  answer: 4
  why:
  - That is AATD (SERPINA1).
  - Macrophages release iron into plasma, not bile, and this is increased, not a loss route.
  - Excess hepcidin would lower iron absorption.
  - That is Wilson disease (ATP7B).
  - Correct. Low or ineffective hepcidin raises absorption and macrophage iron release.
  src:
    page: 197
  status: unverified
- id: hb.L12.057
  kind: mcq
  topic: hh-path
  stem: A 22-year-old man has heart failure, hypogonadotrophic hypogonadism and a ferritin of 4000 µg/L. HFE testing
    is negative. The most likely gene involved is
  options:
  - HJV or HAMP
  - Ferroportin
  - ATP7B
  - TFR2
  - HFE
  answer: 0
  why:
  - Correct. Juvenile hemochromatosis (type 2) causes severe overload before 30, with cardiac and endocrine disease.
  - Ferroportin disease is milder.
  - ATP7B causes Wilson disease (copper, not iron).
  - Type 3 (TFR2) has a later onset.
  - HFE testing was negative, and type 1 presents later.
  src:
    page: 197
  status: unverified
- id: hb.L12.058
  kind: mcq
  topic: hh-clinical
  stem: A 48-year-old man has fatigue, arthropathy, diabetes and grey-brown skin. Which initial tests are most appropriate?
  options:
  - Ceruloplasmin and urinary copper
  - Serum AAT level
  - Liver biopsy with iron stain
  - Anti-mitochondrial antibody
  - Transferrin saturation and serum ferritin
  answer: 4
  why:
  - These test for Wilson disease.
  - This tests for AATD.
  - Biopsy is not recommended to diagnose iron overload.
  - AMA tests for PBC.
  - Correct. These are the most common tests for hemochromatosis.
  src:
    page: 198
  status: unverified
  tags:
  - high-yield
- id: hb.L12.059
  kind: mcq
  topic: hh-clinical
  stem: A man with HFE hemochromatosis and cirrhosis has had his ferritin normalized by phlebotomy. How should HCC
    surveillance continue?
  options:
  - AFP alone every year
  - Stop, because iron is depleted
  - Only if ferritin rises again
  - Imaging every 6 months, with or without AFP
  - CT every 3 months
  answer: 3
  why:
  - The book gives 6-monthly imaging-based surveillance.
  - Screening continues regardless of iron depletion.
  - Cirrhosis itself keeps the HCC risk.
  - Correct. 6-monthly imaging, optionally with AFP.
  - The interval is 6 months.
  src:
    page: 199
  status: unverified
  tags:
  - high-yield
- id: hb.L12.060
  kind: mcq
  topic: hh-clinical
  stem: Which relative of a newly diagnosed hemochromatosis patient is most important to screen?
  options:
  - Sibling
  - Grandparent
  - Spouse
  - 10-year-old child
  - Cousin
  answer: 0
  why:
  - Correct. Siblings have a 25% chance of inheriting both defective genes.
  - Grandparents are not in the book's list.
  - The spouse is checked, but has no inherited link to the patient.
  - Children are checked after age 18.
  - Cousins are not in the book's list.
  src:
    page: 198
  status: unverified
- id: hb.L12.061
  kind: mcq
  topic: wilson
  stem: A 17-year-old girl presents with jaundice, Coombs-negative hemolytic anemia and a rapidly rising INR. Slit-lamp
    shows brown corneal rings. Which test result supports the likely diagnosis?
  options:
  - Positive HBsAg
  - High transferrin saturation
  - High ceruloplasmin
  - Low serum AAT
  - Low ceruloplasmin
  answer: 4
  why:
  - Viral hepatitis does not cause Kayser-Fleischer rings.
  - That points to hemochromatosis.
  - Ceruloplasmin is low, not high, in Wilson disease.
  - That points to AATD.
  - Correct. Wilson disease with acute liver failure; ceruloplasmin is often low.
  src:
    page: 200
  status: unverified
  tags:
  - high-yield
- id: hb.L12.062
  kind: mcq
  topic: wilson
  stem: How does zinc work in Wilson disease?
  options:
  - It removes iron
  - It chelates copper in the blood
  - It raises ceruloplasmin synthesis
  - It increases biliary copper excretion through ATP7B
  - It blocks intestinal absorption of copper
  answer: 4
  why:
  - Iron removal is phlebotomy for hemochromatosis.
  - Chelation is how penicillamine and trientine work.
  - The book gives no such effect.
  - ATP7B is the defective gene; zinc does not restore it.
  - Correct. Zinc prevents the intestines from absorbing copper.
  src:
    page: 201
  status: unverified
  tags:
  - book-question
- id: hb.L12.063
  kind: mcq
  topic: aatd
  stem: A 41-year-old non-smoker has basal emphysema and a raised liver stiffness. Serum AAT is low and genotype
    is ZZ. Which treatment will NOT help his liver?
  options:
  - Liver transplantation if he reaches end-stage disease
  - Balanced diet
  - Hepatitis A and B vaccination
