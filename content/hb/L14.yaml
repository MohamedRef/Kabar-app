- id: hb.L14.118
  kind: essay
  topic: heart
  prompt: What is the interaction between the liver and the heart?
  outline:
  - Heart → liver:
    - Forward failure (acute HF) → hypoxic hepatopathy; backward failure (chronic HF) → congestive hepatopathy
    - Congestive hepatopathy - jaundice, ascites, hepatomegaly with HJR, pulsatile liver; cholestatic labs
  - Liver → heart:
    - Cirrhotic cardiomyopathy - blunted stress response; LVEF < 55%, diastolic dysfunction, prolonged QT, BNP
    - 50% of LT candidates have cardiac dysfunction; 7–21% of post-LT deaths from HF; NAFLD → CVD and HF
  - Diseases affecting both:
    - Alcohol; infections (HCV, HIV, CMV, malaria, dengue, sepsis); sarcoidosis, SLE, Graves, hemochromatosis, Wilson,
      amyloidosis
