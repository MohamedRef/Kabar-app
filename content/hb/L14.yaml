items:
- id: hb.L14.001
  kind: card
  topic: overview
  front: When should abnormal LFTs be blamed on a systemic disease?
  back: When screening serology and imaging find no liver cause in a patient who has a systemic disease. The systemic
    disease is then treated primarily.
  src:
    page: 252
  status: unverified
- id: hb.L14.002
  kind: enumerate
  topic: overview
  prompt: Enumerate the groups of systemic disease that involve the liver (6 in the book).
  points:
  - Cardiovascular diseases
  - Collagen vascular diseases
  - Hematolymphoid diseases
  - Systemic infection and sepsis
  - Chronic inflammatory bowel disease
  - Granuloma formation
  pass: 5
  src:
    page: 252
  status: unverified
- id: hb.L14.003
  kind: enumerate
  topic: heart
  prompt: Outline the 3 ways the heart and liver interact.
  points:
  - 'Heart causes liver disease: heart failure → hypoxic hepatopathy, congestive hepatopathy'
  - 'Liver causes cardiovascular disease: cirrhosis → cirrhotic cardiomyopathy; NAFLD → CVD and ventricular dysfunction'
  - 'Common conditions affect both: chronic alcoholism, infections (HCV, HIV, CMV, malaria, dengue, amebiasis, sepsis),
    systemic disease (sarcoidosis, SLE, Graves, hemochromatosis, Wilson, amyloidosis)'
  pass: 3
  src:
    page: 253
  status: unverified
  tags:
  - high-yield
- id: hb.L14.004
  kind: card
  topic: heart
  front: What are the 2 fundamental mechanisms of cardiac hepatopathy?
  back: 'Reduced arterial perfusion (forward failure: hypoxic hepatopathy) and passive congestion from raised systemic
    venous pressure (backward failure: congestive hepatopathy).'
  src:
    page: 254
  status: unverified
  tags:
  - high-yield
- id: hb.L14.005
  kind: cloze
  topic: heart
  text: Arterial hypoperfusion predominates in {{c1::acute}} heart failure (hypoxic hepatopathy); passive congestion
    prevails in {{c2::chronic}} heart failure (congestive hepatopathy).
  src:
    page: 254
  status: unverified
  tags:
  - high-yield
- id: hb.L14.006
  kind: card
  topic: heart
  front: Clinical features of congestive hepatopathy?
  back: Often asymptomatic. Sometimes jaundice, ascites, hepatomegaly with hepatojugular reflux, and a pulsatile
    liver.
  src:
    page: 255
  status: unverified
- id: hb.L14.007
  kind: cloze
  topic: heart
  text: Congestive hepatopathy gives a mainly {{c1::cholestatic}} pattern (raised GGT, ALP, bilirubin), with transaminases
    {{c2::normal or moderately raised}} unless a forward component coexists.
  src:
    page: 255
  status: unverified
  tags:
  - high-yield
- id: hb.L14.008
  kind: card
  topic: heart
  front: Define cirrhotic cardiomyopathy.
  back: A syndrome in cirrhosis of an abnormal, blunted cardiac response to physiological, pathological or drug
    stress, with normal or increased cardiac output and contractility at rest.
  src:
    page: 256
  status: unverified
  tags:
  - high-yield
- id: hb.L14.009
  kind: cloze
  topic: heart
  text: Up to {{c1::50%}} of cirrhotics undergoing LT show cardiac dysfunction, and {{c2::7–21%}} of deaths after
    OLT are from overt heart failure.
  src:
    page: 256
  status: unverified
  tags:
  - numbers
- id: hb.L14.010
  kind: enumerate
  topic: heart
  prompt: Mention the criteria of cirrhotic cardiomyopathy.
  points:
  - Systolic dysfunction (blunted rise in cardiac output with exercise, volume or drugs) and/or resting LVEF < 55%
  - Diastolic dysfunction
  - 'Supportive: electrophysiological abnormalities, abnormal chronotropic response, electromechanical dyssynchrony,
    prolonged QT, enlarged left atrium, increased myocardial mass, raised BNP and troponins'
  pass: 3
  src:
    page: 256
  status: unverified
  tags:
  - high-yield
- id: hb.L14.011
  kind: cloze
  topic: heart
  text: In cirrhotic cardiomyopathy, systolic dysfunction includes a resting LVEF {{c1::< 55%}}; a key supportive
    ECG finding is a {{c2::prolonged QT interval}}.
  src:
    page: 256
  status: unverified
  tags:
  - numbers
- id: hb.L14.012
  kind: card
  topic: heart
  front: Which liver disease, besides cirrhosis, is linked to cardiovascular disease and heart failure?
  back: Nonalcoholic fatty liver disease (NAFLD).
  src:
    page: 255
  status: unverified
  update:
    text: NAFLD is now called MASLD (metabolic dysfunction-associated steatotic liver disease).
    ref: Multisociety Delphi consensus (AASLD/EASL/ALEH), 2023
- id: hb.L14.013
  kind: card
  topic: ctd
  front: Liver involvement in connective tissue disease is usually what, and what must be excluded first?
  back: Common and usually asymptomatic (fulminant cases are reported). Exclude drug toxicity, viral hepatitis and
    autoimmune liver disease first.
  src:
    page: 257
  status: unverified
- id: hb.L14.014
  kind: cloze
  topic: ctd
  text: Among collagen diseases, ALT is highest in {{c1::adult-onset Still's disease}}, while ALP and GGT are highest
    in {{c2::vasculitis}}.
  src:
    page: 257
  status: unverified
  tags:
  - high-yield
- id: hb.L14.015
  kind: cloze
  topic: ctd
  text: In RA, transaminases and bilirubin are usually normal, but ALP is raised in {{c1::18–46%}} and GGT in {{c2::23–77%}},
    correlating with {{c3::disease activity}}.
  src:
    page: 257
  status: unverified
  tags:
  - numbers
- id: hb.L14.016
  kind: card
  topic: ctd
  front: What are the 2 patterns of liver dysfunction in rheumatic disease?
  back: Predominantly hepatocellular (raised ALT, AST) and cholestatic (raised ALP, GGT). Enzyme rises are usually
    mild and track disease activity.
  src:
    page: 257
  status: unverified
- id: hb.L14.017
  kind: enumerate
  topic: ctd
  prompt: Besides nonspecific changes, what liver lesions may be found in RA and its variants (Still's, Felty's)?
  points:
  - Primary biliary cirrhosis
  - Autoimmune chronic hepatitis
  - Nodular regenerative hyperplasia
  - Necrotizing arteritis
  - Amyloidosis
  - Rheumatoid nodules in the liver
  pass: 4
  src:
    page: 258
  status: unverified
- id: hb.L14.018
  kind: cloze
  topic: ctd
  text: Liver dysfunction occurs in {{c1::8.6–59.7%}} of SLE patients; ALT is raised in {{c2::21%}}.
  src:
    page: 258
  status: unverified
  tags:
  - numbers
- id: hb.L14.019
  kind: card
  topic: ctd
  front: What is lupus hepatitis, and how does it behave?
  back: SLE-related hypertransaminasemia with ALT fluctuating with SLE activity. Usually subclinical, responds well
    to moderate-high dose prednisone, and does not progress to end-stage liver disease.
  src:
    page: 258
  status: unverified
  tags:
  - high-yield
- id: hb.L14.020
  kind: card
  topic: ctd
  front: Most common liver histology in SLE?
  back: Steatosis, which may not be related to corticosteroid therapy.
  src:
    page: 258
  status: unverified
- id: hb.L14.021
  kind: card
  topic: ctd
  front: Why must AIH/SLE overlap be distinguished from lupus hepatitis?
  back: AIH can progress to fulminant hepatic failure or cirrhosis, while lupus hepatitis is benign and steroid-responsive.
    (Concomitant SLE and AIH is uncommon.)
  src:
    page: 258
  status: unverified
  tags:
  - high-yield
- id: hb.L14.022
  kind: enumerate
  topic: ctd
  prompt: Mention the clinical features of reactive hemophagocytic syndrome.
  points:
  - High fever
  - Lymphadenopathy
  - Hepatosplenomegaly
  - Pancytopenia
  - Elevated liver enzymes
  - Hyperferritinemia
  - Coagulopathy
  pass: 5
  src:
    page: 259
  status: unverified
- id: hb.L14.023
  kind: card
  topic: ctd
  front: Mechanism of reactive hemophagocytic syndrome, and its triggers?
  back: Sustained macrophage activation driven by cytokines such as IL-6 and TNF-α. Triggered by neoplasms, viral
    infections and autoimmune disease including SLE.
  src:
    page: 259
  status: unverified
- id: hb.L14.024
  kind: cloze
  topic: ctd
  text: Polyarteritis nodosa may cause necrotizing arteritis of the liver leading to {{c1::infarction}}; polymyalgia
    rheumatica-giant cell arteritis may show {{c2::granulomatous arteritis}} in the liver.
  src:
    page: 259
  status: unverified
- id: hb.L14.025
  kind: table
  topic: ctd
  title: Liver damage in connective tissue disease (selected)
  columns:
  - Disease
  - Markers
  - Histology
  rows:
  - - Antiphospholipid syndrome
    - aPL, aCL; Budd-Chiari; hepatosplenomegaly; jaundice
    - Nodular regenerative hyperplasia
  - - Felty's syndrome
    - Raised ALT and ALP; hepatomegaly; portal hypertension
    - Kupffer cell hyperplasia, steatosis, mild portal fibrosis, NRH
  - - Rheumatoid arthritis
    - Raised ALP and GGT
    - Kupffer cell hyperplasia, steatosis
  - - Sjögren's syndrome
    - Raised enzymes; jaundice; AMA, anti-Ro/La
    - PBC, chronic active hepatitis, cryptogenic cirrhosis
  - - SLE
    - Anti-dsDNA; hepatomegaly; jaundice; raised ALT
    - Steatosis, chronic active hepatitis
  blanks:
  - - 0
    - 2
  - - 2
    - 1
  - - 3
    - 2
  - - 4
    - 2
  src:
    page: 260
  status: unverified
- id: hb.L14.026
  kind: table
  topic: rheum-drugs
  title: Hepatotoxicity of rheumatologic drugs
  columns:
  - Hepatotoxic effect
  - Drugs
  rows:
  - - Acute DILI, hepatocellular
    - NSAIDs (diclofenac, sulindac, ibuprofen, ketoprofen, indomethacin); sulfasalazine, leflunomide
  - - Acute DILI, cholestatic
    - NSAIDs (sulindac, ibuprofen, piroxicam, naproxen, celecoxib); sulfasalazine, azathioprine
  - - Nonalcoholic fatty liver
    - Methotrexate
  - - Ductopenic (vanishing bile duct) syndrome
    - Azathioprine, gold salts
  - - Nodular regenerative hyperplasia
    - Azathioprine
  - - Drug-induced autoimmune hepatitis
    - Infliximab, diclofenac, indomethacin
  blanks:
  - - 0
    - 1
  - - 1
    - 1
  - - 2
    - 1
  - - 3
    - 1
  - - 4
    - 1
  - - 5
    - 1
  src:
    page: 259
  status: unverified
  tags:
  - high-yield
  - book-question
- id: hb.L14.027
  kind: card
  topic: rheum-drugs
  front: Which rheumatologic drug causes fatty liver (chronic drug-associated liver disease)?
  back: Methotrexate.
  src:
    page: 259
  status: unverified
- id: hb.L14.028
  kind: card
  topic: rheum-drugs
  front: Which 3 chronic liver lesions are linked to azathioprine in the book?
  back: Cholestatic acute DILI, ductopenic (vanishing bile duct) syndrome and nodular regenerative hyperplasia.
  src:
    page: 259
  status: unverified
  tags:
  - high-yield
- id: hb.L14.029
  kind: cloze
  topic: rheum-drugs
  text: 'Drug-induced autoimmune hepatitis from rheumatologic drugs: {{c1::infliximab}}, {{c2::diclofenac}} and
    {{c3::indomethacin}}.'
  src:
    page: 259
  status: unverified
- id: hb.L14.030
  kind: cloze
  topic: rheum-drugs
  text: 'Ductopenic (vanishing bile duct) syndrome: {{c1::azathioprine}} and {{c2::gold salts}}.'
  src:
    page: 259
  status: unverified
- id: hb.L14.031
  kind: card
  topic: heme
  front: In liver disease, what drives bleeding risk and what drives thrombotic risk?
  back: Bleeding is related to hemodynamic changes (portal pressure, venous congestion); thrombosis stems from changes
    in the coagulation system.
  src:
    page: 260
  status: unverified
  tags:
  - high-yield
- id: hb.L14.032
  kind: card
  topic: heme
  front: How do hematologic malignancies involve the liver?
  back: Malignant cells infiltrate, giving abnormal LFTs with hepatosplenomegaly or multiple nodules; this may progress
    to fulminant hepatic failure.
  src:
    page: 261
  status: unverified
- id: hb.L14.033
  kind: enumerate
  topic: heme
  prompt: Mention how the treatment of hematologic diseases can harm the liver.
  points:
  - Iron overload from regular transfusion (congenital and acquired anemias)
  - HBV reactivation with chemotherapy or immunosuppression (potentially fatal but preventable)
  - Veno-occlusive disease (sinusoidal obstruction syndrome) after hematopoietic cell transplantation
  pass: 3
  src:
    page: 261
  status: unverified
  tags:
  - high-yield
- id: hb.L14.034
  kind: card
  topic: heme
  front: Which 2 enzymes are often raised in malignant hematologic disease with liver involvement?
  back: ALP and LDH. Imaging (scintigraphy, US, CT, MRI) may still miss the liver involvement.
  src:
    page: 261
  status: unverified
- id: hb.L14.035
  kind: card
  topic: heme
  front: Why may peritoneoscopy be needed in malignant lymphoma?
  back: Lymphoma may involve the liver by sinusoidal infiltration, granulomas or nodules that imaging misses.
  src:
    page: 261
  status: unverified
- id: hb.L14.036
  kind: card
  topic: heme
  front: When is liver involvement assumed in a malignant hematologic disorder?
  back: An enlarged liver with high serum ALP or LDH plus raised CRP or ESR.
  src:
    page: 261
  status: unverified
- id: hb.L14.037
  kind: card
  topic: heme
  front: Is hepatic extramedullary hemopoiesis normal?
  back: Physiological in fetal and neonatal life; pathological in adults.
  src:
    page: 262
  status: unverified
- id: hb.L14.038
  kind: enumerate
  topic: heme
  prompt: Enumerate the causes of extramedullary hemopoiesis in the adult liver.
  points:
  - Aplastic anemia
  - Myeloproliferative disease
  - Osteomyelofibrosis
  - Myelomatosis
  - Bone marrow carcinomatosis
  - Osteopetrosis
  pass: 4
  src:
    page: 262
  status: unverified
- id: hb.L14.039
  kind: card
  topic: heme
  front: How does EMH cause portal hypertension, and what can worsen it?
  back: Hepatomegaly and massive splenomegaly with portal hypertension and ascites; nodular regenerative hyperplasia
    after obstruction of intrahepatic portal branches can add to it.
  src:
    page: 262
  status: unverified
- id: hb.L14.040
  kind: enumerate
  topic: sepsis
  prompt: How may sepsis affect the liver directly?
  points:
  - Infection itself
  - Injury from circulating toxins and the inflammatory/immune response
  - Ischemia from septic shock
  - Combination of these
  pass: 3
  src:
    page: 262
  status: unverified
- id: hb.L14.041
  kind: cloze
  topic: sepsis
  text: 'Infective liver lesions in sepsis: abscess, {{c1::cholangitis}}, {{c2::pylephlebitis}}, vasculitis, granulomas
    and tissue necrosis.'
  src:
    page: 262
  status: unverified
- id: hb.L14.042
  kind: card
  topic: sepsis
  front: Through which 2 functions does the liver shape the response to critical illness?
  back: Clearing microbes and toxins from blood, and the acute phase reaction (liver-derived cytokines, mediators
    and coagulation factors). Impaired clearance with endotoxin spillover can drive multiple organ failure.
  src:
    page: 263
  status: unverified
- id: hb.L14.043
  kind: card
  topic: sepsis
  front: What are the 2 categories of new liver dysfunction in critical illness?
  back: Hypoxic (ischemic) hepatitis and cholestatic liver dysfunction.
  src:
    page: 263
  status: unverified
- id: hb.L14.044
  kind: enumerate
  topic: sepsis
  prompt: Mention the diagnostic triad of hypoxic (ischemic) hepatitis.
  points:
  - Setting of cardiac, respiratory or circulatory failure
  - Abrupt rise in transaminases to at least 20 × ULN
  - Exclusion of other causes of acute necrosis, especially viral or drug-induced
  pass: 3
  src:
    page: 263
  status: unverified
  tags:
  - high-yield
- id: hb.L14.045
  kind: cloze
  topic: sepsis
  text: In hypoxic hepatitis, transaminases rise abruptly to at least {{c1::20×}} ULN, for a {{c2::very short}}
    time, followed by coagulopathy.
  src:
    page: 263
    quote: abrupt increase in serum transaminases reaching at least 20× the upper limit of normal
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L14.046
  kind: card
  topic: sepsis
  front: What is the prognostic meaning of jaundice after hypoxic hepatitis?
  back: Significant jaundice follows in a minority and carries a higher risk of complications and death.
  src:
    page: 263
  status: unverified
- id: hb.L14.047
  kind: cloze
  topic: sepsis
  text: Cholestatic liver dysfunction in ICU is accepted with bilirubin > {{c1::2–3 mg/dL}} and ALP and GGT {{c2::2–3
    times}} normal.
  src:
    page: 264
  status: unverified
  tags:
  - numbers
- id: hb.L14.048
  kind: card
  topic: sepsis
  front: How does cholestatic liver dysfunction of critical illness differ in onset from hypoxic hepatitis?
  back: It is insidious, appearing days after ICU admission with progressively rising bilirubin, ALP and GGT, from
    altered hepatobiliary transport.
  src:
    page: 263
  status: unverified
- id: hb.L14.049
  kind: enumerate
  topic: sepsis
  prompt: Mention the clinical risk factors for cholestatic liver dysfunction in critical illness.
  points:
  - Sepsis (endotoxemia and cytokine response)
  - Parenteral nutrition
  - Hyperglycemia
  - Superadded drug-induced cholestasis
  pass: 3
  src:
    page: 264
  status: unverified
- id: hb.L14.050
  kind: card
  topic: sepsis
  front: How do cytokines cause cholestasis in sepsis?
  back: TNF-α, IL-6 and nitric oxide inhibit canalicular excretion of conjugated bilirubin. This happens with gram-negative
    (E. coli, Klebsiella) and gram-positive (S. aureus) infection alike.
  src:
    page: 264
  status: unverified
  tags:
  - high-yield
- id: hb.L14.051
  kind: enumerate
  topic: ibd
  prompt: Enumerate the hepatobiliary diseases that accompany ulcerative colitis and Crohn's disease.
  points:
  - Fatty liver
  - Primary sclerosing cholangitis
  - Chronic hepatitis
  - Cirrhosis
  - Hepatobiliary disease
  pass: 4
  src:
    page: 264
  status: unverified
- id: hb.L14.052
  kind: cloze
  topic: ibd
  text: The most common liver histological abnormality in IBD is {{c1::steatosis}}, in up to {{c2::50%}}.
  src:
    page: 264
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L14.053
  kind: card
  topic: ibd
  front: Causes of severe steatosis in IBD, and does colectomy cure it?
  back: Malnutrition, anemia and toxemia. It may persist after colectomy (and is seen with ileostomy).
  src:
    page: 264
  status: unverified
- id: hb.L14.054
  kind: card
  topic: ibd
  front: What worsens fatty change in IBD and should be avoided?
  back: Long-term IV infusion of high-calorie nutrients and a high-fat diet.
  src:
    page: 265
  status: unverified
- id: hb.L14.055
  kind: card
  topic: granuloma
  front: Most consistently abnormal liver test in hepatic granulomas?
  back: Raised serum ALP (with liver enlargement).
  src:
    page: 265
  status: unverified
  tags:
  - high-yield
- id: hb.L14.056
  kind: enumerate
  topic: granuloma
  prompt: Enumerate the 5 etiological categories of hepatic granulomas, with examples.
  points:
  - 'Immunological: sarcoidosis, PBC, giant cell arteritis, Wegener''s, chronic granulomatous disease, allergic
    granulomatosis'
  - 'Infectious: viral (HCV, CMV, EBV, Q fever, syphilis), bacterial (TB, MAI in HIV, brucella, typhoid, Whipple,
    leprosy, cat-scratch, tularemia), fungal (histoplasma, blastomyces, coccidioides, candida), parasitic (toxoplasma,
    schistosoma)'
  - 'Medications: penicillins, phenytoin (diphenylhydantoin), allopurinol'
  - 'Neoplastic: Hodgkin disease, renal cell carcinoma'
  - 'Foreign body: beryllium, surgical suture material'
  pass: 5
  src:
    page: 265
  status: unverified
  tags:
  - high-yield
  - book-question
- id: hb.L14.057
  kind: cloze
  topic: granuloma
  text: 'Drugs causing hepatic granulomas: {{c1::penicillins}}, {{c2::diphenylhydantoin (phenytoin)}} and {{c3::allopurinol}}.'
  src:
    page: 265
  status: unverified
- id: hb.L14.058
  kind: cloze
  topic: granuloma
  text: 'Neoplastic causes of hepatic granulomas: {{c1::Hodgkin disease}} and {{c2::renal cell carcinoma}}. Foreign
    body causes: {{c3::beryllium}} and suture material.'
  src:
    page: 266
  status: unverified
- id: hb.L14.059
  kind: cloze
  topic: granuloma
  text: 'Parasitic causes of hepatic granulomas: {{c1::toxoplasmosis}} and {{c2::schistosomiasis}}.'
  src:
    page: 265
  status: unverified
- id: hb.L14.060
  kind: enumerate
  topic: preg-general
  prompt: Classify liver disease in pregnancy.
  points:
  - 'Unique to pregnancy (3%): hyperemesis gravidarum, ICP, AFLP, hypertension-related (pre-eclampsia/eclampsia,
    HELLP, liver infarction/rupture)'
  - 'Pre-existing: viral, cirrhosis and portal hypertension, post-LT, autoimmune'
  - 'Coincident with pregnancy: autoimmune, viral, drug-induced, vascular (Budd-Chiari)'
  pass: 3
  src:
    page: 266
  status: unverified
  tags:
  - high-yield
- id: hb.L14.061
  kind: card
  topic: preg-general
  front: Are palmar erythema and spider angiomata in pregnancy signs of chronic liver disease?
  back: Not necessarily. They are common normal findings in pregnancy.
  src:
    page: 266
  status: unverified
- id: hb.L14.062
  kind: card
  topic: preg-general
  front: Which liver test can rise normally in the third trimester, and why? Which rises are always abnormal?
  back: ALP, from the placenta. Any rise in aminotransferases, bilirubin or PT/INR is abnormal and needs evaluation.
  src:
    page: 266
  status: unverified
  tags:
  - high-yield
- id: hb.L14.063
  kind: card
  topic: preg-general
  front: Imaging of the liver in pregnancy - what is preferred, what is allowed, and what is used with care?
  back: Ultrasound is safe and preferred (biliary disease). MRI without gadolinium in the 2nd and 3rd trimesters.
    CT carries a risk of teratogenesis and childhood hematologic malignancy, so only judiciously with low-dose protocols
    (2–5 rads). Biopsy is rarely needed.
  src:
    page: 267
  status: unverified
  tags:
  - high-yield
- id: hb.L14.064
  kind: enumerate
  topic: preg-unique
  prompt: Enumerate the liver diseases unique to pregnancy.
  points:
  - Hyperemesis gravidarum
  - Intrahepatic cholestasis of pregnancy
  - Pre-eclampsia and eclampsia
  - HELLP syndrome
  - Acute fatty liver of pregnancy
  - Hepatic infarction, parenchymal hemorrhage and subcapsular hematoma
  pass: 5
  src:
    page: 267
  status: unverified
- id: hb.L14.065
  kind: table
  topic: preg-unique
  title: Liver diseases unique to pregnancy (book table)
  columns:
  - Disease
  - Timing
  - Frequency (%)
  - Clinical features
  - Pathogenesis
  - Biochemistry
  - Management
  - Recurrence
  rows:
  - - Hyperemesis gravidarum
    - First trimester through 20 weeks
    - 0.2–2
    - Nausea, vomiting, dehydration, thiamine deficiency
    - Starvation, gastric motility, hormonal factors
    - Mild rise in AST and ALT
    - Supportive, hydration
    - Often
  - - ICP
    - Late 2nd and 3rd trimester
    - 0.2–2
    - Pruritus, mild jaundice
    - Hormonal factors
    - Raised serum bile acids, mild rise in transaminases
