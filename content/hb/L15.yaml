items:
- id: hb.L15.001
  kind: card
  topic: basics
  front: Parts of the pancreas?
  back: Head, neck, body, tail and uncinate process.
  src:
    page: 274
  status: unverified
- id: hb.L15.002
  kind: cloze
  topic: basics
  text: The pancreas is a {{c1::retroperitoneal}} organ that extends from the C-loop of the duodenum to the {{c2::splenic
    hilum}}; it is about {{c3::20 cm long and weighs ~90 g}}.
  src:
    page: 274
  status: unverified
- id: hb.L15.003
  kind: enumerate
  topic: basics
  prompt: Enumerate the inactive pro-enzymes (zymogens) secreted by the exocrine pancreas.
  points:
  - Trypsinogen
  - Chymotrypsinogen
  - Pro-carboxypeptidase
  - Pro-elastase
  - Kallikreinogen
  - Pro-phospholipase A and B
  pass: 4
  src:
    page: 274
  status: unverified
- id: hb.L15.004
  kind: cloze
  topic: basics
  text: 'Islet cells: A-cells secrete {{c1::glucagon}}, B-cells secrete {{c2::insulin}}, D-cells secrete {{c3::somatostatin}}.'
  extra: About 1 million islets of Langerhans.
  src:
    page: 275
  status: unverified
- id: hb.L15.005
  kind: enumerate
  topic: basics
  prompt: Enumerate the mechanisms that prevent self-digestion of the pancreas.
  points:
  - Enzymes are secreted as inactive pro-enzymes (except amylase and lipase)
  - The enzymes are membrane-bound
  - Activation needs trypsinogen to be converted to trypsin by duodenal enterokinase
  - Trypsin inhibitors in acinar and ductal secretions
  - Acinar cells resist many enzymes
  pass: 4
  src:
    page: 275
  status: unverified
- id: hb.L15.006
  kind: card
  topic: basics
  front: Which enzyme activates trypsinogen to trypsin, and where?
  back: Enterokinase, in the duodenum.
  src:
    page: 275
  status: unverified
- id: hb.L15.007
  kind: card
  topic: basics
  front: Which two pancreatic enzymes are NOT secreted as inactive pro-enzymes?
  back: Amylase and lipase.
  src:
    page: 275
  status: unverified
- id: hb.L15.008
  kind: card
  topic: congenital
  front: Sites of ectopic (heterotopic) pancreatic tissue?
  back: Stomach, duodenum, jejunum, ileum and Meckel's diverticulum.
  src:
    page: 275
  status: unverified
- id: hb.L15.009
  kind: card
  topic: congenital
  front: Ectopic pancreas — usual course, possible complications, and treatment?
  back: Usually asymptomatic. May cause extrinsic compression, peptic ulceration with bleeding, or intussusception.
    Resect surgically only if symptomatic.
  src:
    page: 275
  status: unverified
- id: hb.L15.010
  kind: cloze
  topic: congenital
  text: The most common congenital anomaly of the pancreas is {{c1::pancreas divisum}} ({{c2::4–14%}}), due to abnormal
    fusion of the two duct systems.
  src:
    page: 276
  status: unverified
- id: hb.L15.011
  kind: card
  topic: congenital
  front: Pancreas divisum — clinical picture?
  back: Often silent; may cause recurrent pancreatitis or recurrent abdominal pain.
  src:
    page: 276
  status: unverified
- id: hb.L15.012
  kind: card
  topic: congenital
  front: Pancreas divisum — imaging tests and the sign they show?
  back: MRI, MRCP or EUS; loss of the "stack sign" or a "crossed duct sign".
  src:
    page: 276
  status: unverified
- id: hb.L15.013
  kind: card
  topic: congenital
  front: Treatment of symptomatic pancreas divisum?
  back: Dorsal duct stent and/or sphincterotomy.
  src:
    page: 276
  status: unverified
- id: hb.L15.014
  kind: card
  topic: congenital
  front: Annular pancreas — what is it and what are its associations?
  back: Pancreatic tissue encircling D2, which may obstruct it. Associated with other gut atresias and Down syndrome.
  src:
    page: 276
  status: unverified
- id: hb.L15.015
  kind: cloze
  topic: congenital
  text: Annular pancreas causes {{c1::non-bilious}} vomiting (duodenal atresia usually causes bilious vomiting),
    shows a {{c2::double bubble sign}} on plain X-ray, and is treated by {{c3::duodenoduodenostomy}}.
  src:
    page: 276
  status: unverified
- id: hb.L15.016
  kind: card
  topic: congenital
  front: Common pancreatobiliary channel — defect, associations, presentation?
  back: Abnormal early fusion of the pancreatic and common bile ducts so biliary and pancreatic secretions mix.
    Associated with biliary atresia and gallbladder dysplasia and malignancy. Presents with recurrent pancreatitis.
  src:
    page: 277
  status: unverified
- id: hb.L15.017
  kind: card
  topic: congenital
  front: Common pancreatobiliary channel — diagnosis and management?
  back: ERCP, MRCP or EUS. Surgical biliary diversion ± clearance of the common channel.
  src:
    page: 277
  status: unverified
- id: hb.L15.018
  kind: card
  topic: ap-cause
  front: Definition of acute pancreatitis?
  back: Acute inflammation of the pancreatic parenchyma.
  src:
    page: 277
  status: unverified
- id: hb.L15.019
  kind: cloze
  topic: ap-cause
  text: In the book's etiology table, gallstones cause {{c1::80%}} of acute pancreatitis and alcohol {{c2::5–60%}}
    (after about 5 years of > 50 g/day).
  src:
    page: 277
  status: unverified
  tags:
  - numbers
- id: hb.L15.020
  kind: cloze
  topic: ap-cause
  text: Hyperlipoproteinemia causes acute pancreatitis when triglycerides exceed {{c1::1000 mg/dl}}.
  src:
    page: 277
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L15.021
  kind: enumerate
  topic: ap-cause
  prompt: Enumerate the etiologic groups of acute pancreatitis with an example of each (book table).
  points:
  - 'Metabolic: alcohol, hyperlipoproteinemia (TG > 1000 mg/dl), hypercalcemia, drugs (azathioprine)'
  - 'Genetic: mutations in cationic trypsinogen and trypsinogen-inhibitor genes'
  - 'Mechanical: gallstones, trauma, operations, post-ERCP'
  - 'Immune: autoimmune pancreatitis, IgG4 disease'
  - 'Vascular: shock, atheroembolism, vasculitis'
  - 'Structural: cystic fibrosis, congenital anomalies, sphincter of Oddi dysfunction, tumors'
  - 'Infections: mumps and other viruses, Ascaris, SARS-CoV-2'
  pass: 5
  src:
    page: 277
  status: unverified
  tags:
  - book-question
  - high-yield
- id: hb.L15.022
  kind: cloze
  topic: ap-cause
  text: The most common causes of acute pancreatitis are {{c1::biliary}}, {{c2::alcohol}} and {{c3::post-ERCP}};
    about 20% are idiopathic.
  src:
    page: 278
  status: unverified
  tags:
  - high-yield
- id: hb.L15.023
  kind: card
  topic: ap-cause
  front: In acute pancreatitis, at what age should cancer be suspected as the cause?
  back: Presentation after 40 years of age.
  src:
    page: 278
  status: unverified
- id: hb.L15.024
  kind: enumerate
  topic: ap-cause
  prompt: Name drugs incriminated in acute pancreatitis (the book lists 13).
  points:
  - Acetaminophen
  - Azathioprine
  - Erythromycin
  - Estrogen
  - Exenatide
  - Furosemide
  - 5-ASA
  - 6-Mercaptopurine
  - Metronidazole
  - NSAIDs
  - Sulindac
  - Tetracycline
  - Valproic acid
  pass: 6
  src:
    page: 278
  status: unverified
- id: hb.L15.025
  kind: card
  topic: ap-cause
  front: Typical pain of acute pancreatitis?
  back: Sudden, sharp epigastric (or left upper quadrant) pain that may radiate to the back, often with severe nausea
    and vomiting.
  src:
    page: 278
  status: unverified
- id: hb.L15.026
  kind: card
  topic: ap-cause
  front: In which types of acute pancreatitis is the pain onset less abrupt and poorly localized?
  back: Alcoholic, hereditary, metabolic and drug-induced pancreatitis.
  src:
    page: 278
  status: unverified
- id: hb.L15.027
  kind: enumerate
  topic: ap-cause
  prompt: Diagnostic criteria of acute pancreatitis (how many are needed?).
  points:
  - 'Clinical: abdominal pain consistent with the disease'
  - 'Lab: serum amylase and/or lipase > 3 times the upper limit of normal'
  - 'Imaging: characteristic findings on abdominal imaging'
  pass: 3
  src:
    page: 278
  status: unverified
  tags:
  - book-question
  - high-yield
- id: hb.L15.028
  kind: cloze
  topic: ap-cause
  text: Diagnosis of acute pancreatitis needs {{c1::2 of 3}} criteria; the enzyme cut-off is amylase and/or lipase
    {{c2::> 3 × ULN}}.
  src:
    page: 278
  status: unverified
  tags:
  - high-yield
  - numbers
- id: hb.L15.029
  kind: card
  topic: ap-cause
  front: Two eponymous skin signs of hemorrhagic pancreatitis pictured in the lecture, and their sites?
  back: Cullen sign (periumbilical bruising) and Grey-Turner sign (flank bruising).
  src:
    page: 279
  status: unverified
- id: hb.L15.030
  kind: cloze
  topic: ap-labs
  text: Serum amylase rises within about {{c1::4 hours}} of symptom onset and returns to normal within {{c2::3–5
    days}}; it may be normal on admission in {{c3::20%}} of cases.
  src:
    page: 279
  status: unverified
  tags:
  - numbers
- id: hb.L15.031
  kind: enumerate
  topic: ap-labs
  prompt: When may serum amylase be normal despite acute pancreatitis?
  points:
  - Alcohol-induced AP
  - Hypertriglyceridemia
  - Acute on chronic pancreatitis
  pass: 3
  src:
    page: 279
  status: unverified
  tags:
  - high-yield
- id: hb.L15.032
  kind: enumerate
  topic: ap-labs
  prompt: Causes of high serum amylase without acute pancreatitis.
  points:
  - Macroamylasemia
  - Low eGFR
  - Salivary gland disease
  - Acute appendicitis, cholecystitis
  - Intestinal obstruction or ischemia
  - Peptic ulcer
  - Gynecological diseases
  pass: 5
  src:
    page: 279
  status: unverified
- id: hb.L15.033
  kind: card
  topic: ap-labs
  front: Lipase vs amylase in acute pancreatitis — two advantages of lipase?
  back: More specific, and stays elevated longer.
  src:
    page: 280
  status: unverified
- id: hb.L15.034
  kind: card
  topic: ap-labs
  front: Causes of falsely high lipase?
  back: Macrolipasemia; renal disease, appendicitis, cholecystitis; diabetics (higher median lipase).
  src:
    page: 280
  status: unverified
- id: hb.L15.035
  kind: card
  topic: ap-labs
  front: Role of amylase and lipase in prognosis, severity or follow-up of acute pancreatitis?
  back: None. They are for diagnosis only.
  src:
    page: 280
  status: unverified
  tags:
  - high-yield
- id: hb.L15.036
  kind: cloze
  topic: ap-labs
  text: CRP {{c1::≥ 150 mg/l}} on the {{c2::third day}} predicts severe acute pancreatitis (90% sensitivity and
    specificity).
  src:
    page: 280
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L15.037
  kind: cloze
  topic: ap-labs
  text: Hematocrit {{c1::> 44%}} is a risk factor for pancreatic necrosis; urea {{c2::> 20 mg/dl}} independently
    predicts mortality.
  src:
    page: 280
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L15.038
  kind: cloze
  topic: ap-labs
  text: Procalcitonin {{c1::≥ 3.8 ng/ml}} in the first 96 h is 93% sensitive and 80% specific for {{c2::pancreatic
    infection}}; low values argue strongly against infected necrosis.
  src:
    page: 280
  status: unverified
  tags:
  - numbers
- id: hb.L15.039
  kind: card
  topic: ap-labs
  front: In acute pancreatitis without gallstones or significant alcohol history, which labs should be measured?
  back: Serum triglycerides and calcium. TG > 1000 mg/dl points to hypertriglyceridemia as the cause.
  src:
    page: 280
  status: unverified
- id: hb.L15.040
  kind: card
  topic: ap-labs
  front: When may genetic testing be considered in acute pancreatitis, and for which genes?
  back: Young patients (< 30 years) with no evident cause and a family history of pancreatic disease (weak recommendation).
    Genes such as PRSS1, SPINK1, CTRC, CASR, CFTR.
  src:
    page: 280
  status: unverified
- id: hb.L15.041
  kind: card
  topic: ap-labs
  front: Which imaging should every patient with acute pancreatitis get on admission, and what may it show?
  back: Abdominal ultrasound. It can detect gallstones and a swollen, non-homogeneous pancreas.
  src:
    page: 281
  status: unverified
  tags:
  - high-yield
- id: hb.L15.042
  kind: card
  topic: ap-labs
  front: Idiopathic AP — what further evaluation do the guidelines in the lecture recommend?
  back: Repeat abdominal ultrasound, MRI and/or EUS.
  src:
    page: 281
  status: unverified
- id: hb.L15.043
  kind: card
  topic: ap-labs
  front: After a second unexplained episode of AP in a surgically fit patient, what does the guideline suggest?
  back: Cholecystectomy, to reduce the risk of recurrent episodes.
  src:
    page: 281
  status: unverified
- id: hb.L15.044
  kind: enumerate
  topic: ap-labs
  prompt: Why is routine contrast CT NOT recommended in acute pancreatitis?
  points:
  - The diagnosis is clear in most patients and most have a mild, uncomplicated course
  - Contrast CT has low sensitivity early, before edema, fat stranding and collections develop
  - IV contrast may worsen pancreatic ischemia, necrosis and AKI, especially before fluid resuscitation
  pass: 2
  src:
    page: 281
  status: unverified
- id: hb.L15.045
  kind: enumerate
  topic: ap-labs
  prompt: Indications for contrast CT in acute pancreatitis.
  points:
  - Uncertain diagnosis
  - No improvement within 48–72 h of admission (to look for necrosis, collections and other complications)
  - Age > 40 with no clear cause (pancreatic tumor?)
  pass: 3
  src:
    page: 282
  status: unverified
  tags:
  - high-yield
- id: hb.L15.046
  kind: table
  topic: ap-labs
  title: CT severity index (Balthazar) — CT grade
  columns:
  - Grade
  - Points
  - CT finding
  rows:
  - - A
    - '0'
    - Normal pancreas
  - - B
    - '1'
    - Pancreatic enlargement
  - - C
    - '2'
    - Pancreatic inflammation and/or peripancreatic fat
  - - D
    - '3'
    - Single peripancreatic fluid collection
  - - E
    - '4'
    - ≥ 2 fluid collections and/or retroperitoneal air
  blanks:
  - - 2
    - 2
  - - 3
    - 2
  - - 4
    - 2
  - - 4
    - 1
  src:
    page: 282
  status: unverified
- id: hb.L15.047
  kind: table
  topic: ap-labs
  title: CT severity index (Balthazar) — necrosis and outcome
  columns:
  - Item
  - Value
  - Value
  rows:
  - - Necrosis none / < 30% / 30–50% / > 50%
    - 0 / 2 / 4 / 6 points
    - —
  - - CTSI 0–1
    - Morbidity 0
    - Mortality 0
  - - CTSI 2–3
    - Morbidity 8%
    - Mortality 3%
  - - CTSI 4–6
    - Morbidity 35%
    - Mortality 6%
  - - CTSI 7–10
    - Morbidity 92%
    - Mortality 17%
  blanks:
  - - 0
    - 1
  - - 4
    - 1
  - - 4
    - 2
  src:
    page: 282
  status: unverified
- id: hb.L15.048
  kind: cloze
  topic: ap-labs
  text: CT severity index = {{c1::CT grade score (0–4)}} + {{c2::necrosis score (0–6)}}, so the maximum is {{c3::10}}.
  src:
    page: 282
  status: unverified
  tags:
  - numbers
- id: hb.L15.049
  kind: cloze
  topic: ap-labs
  text: In severe AP (initial CT severity index {{c1::≥ 3}}), a follow-up contrast CT is done {{c2::7–10 days}}
    after the first scan.
  src:
    page: 283
  status: unverified
  tags:
  - numbers
- id: hb.L15.050
  kind: card
  topic: ap-labs
  front: When are further contrast CT scans indicated in acute pancreatitis (after the follow-up scan)?
  back: Only if the patient deteriorates or stops improving, or when invasive intervention is planned.
  src:
    page: 283
  status: unverified
- id: hb.L15.051
  kind: card
  topic: ap-labs
  front: Who gets MRI instead of CT in acute pancreatitis, and which sequence?
  back: Contrast allergy, renal insufficiency or pregnancy. T2-weighted images without gadolinium can show necrosis
    (less sensitive for gas).
  src:
    page: 283
  status: unverified
- id: hb.L15.052
  kind: card
  topic: ap-labs
  front: Why MRI at 4 weeks in acute pancreatitis when intervention is planned?
  back: It distinguishes solid from fluid components better (ESGE 2018).
  src:
    page: 283
  status: unverified
- id: hb.L15.053
  kind: cloze
  topic: ap-labs
  text: MRCP detects CBD stones down to {{c1::3 mm}} and pancreatic duct disruption (sensitivity 98%, specificity
    84.4%). EUS is used to find the cause in {{c2::recurrent idiopathic}} AP.
  src:
    page: 283
  status: unverified
- id: hb.L15.054
  kind: enumerate
  topic: ap-labs
  prompt: Differential diagnosis of acute pancreatitis.
  points:
  - Myocardial infarction
  - Dissecting aortic aneurysm
  - Mesenteric ischemia
  - Volvulus, intussusception
  - Perforated peptic ulcer
  - Biliary colic, acute cholecystitis
  pass: 4
  src:
    page: 283
  status: unverified
- id: hb.L15.055
  kind: order
  topic: ap-severity
  prompt: Initial assessment of acute pancreatitis (book recommendations).
  steps:
  - Immediate hemodynamic evaluation and start resuscitation
  - Risk assessment to sort patients into higher- and lower-risk groups
  - Admit patients with organ failure to ICU whenever possible
  src:
    page: 284
  status: unverified
- id: hb.L15.056
  kind: cloze
  topic: ap-severity
  text: Severe AP affects about {{c1::25%}} of patients with mortality about {{c2::15%}}, rising to {{c3::35%}}
    with infection.
  src:
    page: 284
  status: unverified
  tags:
  - numbers
- id: hb.L15.057
  kind: enumerate
  topic: ap-severity
  prompt: Patient characteristics that predict a severe course of acute pancreatitis.
  points:
  - Age > 55 years
  - Obesity (BMI > 30)
  - Altered mental status
  - Comorbid disease
  pass: 3
  src:
    page: 284
  status: unverified
- id: hb.L15.058
  kind: enumerate
  topic: ap-severity
  prompt: SIRS criteria (≥ 2 needed).
  points:
  - Pulse > 90/min
  - Respirations > 20/min or PaCO2 < 32 mmHg (the book prints "> 32")
  - Temperature > 38 °C or < 36 °C
  - WBC > 12,000 or < 4,000/mm3, or > 10% bands
  pass: 4
  src:
    page: 284
  status: unverified
  tags:
  - high-yield
- id: hb.L15.059
  kind: card
  topic: ap-severity
  front: Lab risk factors for severe AP (book list)?
  back: BUN > 20 or rising; hematocrit > 44% or rising; elevated creatinine.
  src:
    page: 284
  status: unverified
- id: hb.L15.060
  kind: card
  topic: ap-severity
  front: Radiological risk factors for severe AP?
  back: Pleural effusions, pulmonary infiltrates, multiple or extensive extrapancreatic collections.
  src:
    page: 285
  status: unverified
- id: hb.L15.061
  kind: enumerate
  topic: ap-severity
  prompt: Scoring systems for the severity of acute pancreatitis.
  points:
  - Revised Atlanta criteria 2012 (local complications and organ failure)
  - BISAP score (more reliable after 48 h)
  - Ranson's criteria (more reliable after 48 h)
  - Others (APACHE II, Marshall)
  pass: 3
  src:
    page: 285
  status: unverified
- id: hb.L15.062
  kind: table
  topic: ap-severity
  title: Revised Atlanta classification 2012
  columns:
  - Grade
  - Criteria
  rows:
  - - Mild
    - No organ failure; no local or systemic complications
  - - Moderately severe
    - Transient organ failure (resolves within 48 h) and/or local or systemic complications without persistent organ
      failure
  - - Severe
    - Persistent organ failure (> 48 h), single or multiple
  blanks:
  - - 0
    - 1
  - - 1
    - 1
  - - 2
    - 1
  src:
    page: 285
  status: unverified
  tags:
  - book-question
  - high-yield
- id: hb.L15.063
  kind: cloze
  topic: ap-severity
  text: In Atlanta, the line between moderately severe and severe AP is organ failure lasting {{c1::more than 48
    hours}}.
  src:
    page: 285
  status: unverified
  tags:
  - high-yield
- id: hb.L15.064
  kind: card
  topic: ap-severity
  front: Atlanta grade vs morphology — which grades are interstitial and which necrotizing?
  back: Mild = interstitial AP. Moderately severe and severe = necrotizing AP.
  src:
    page: 285
  status: unverified
- id: hb.L15.065
  kind: enumerate
  topic: ap-severity
  prompt: Organ failure in acute pancreatitis is defined as any of (book list).
  points:
  - 'Shock: SBP < 90 mmHg or MAP < 70 mmHg'
  - 'Pulmonary: PaO2 < 60 mmHg or need for ventilation'
  - 'Renal: creatinine > 2 mg/dl after rehydration or need for dialysis'
  - GI bleeding > 500 ml / 24 h
  - Tachycardia > 90/min
  pass: 4
  src:
    page: 285
  update:
    text: The revised Atlanta classification (2012) defines organ failure only by the respiratory, cardiovascular
      and renal systems using the modified Marshall score (score ≥ 2); GI bleeding and tachycardia are not part
      of it.
    ref: Banks et al., Revised Atlanta classification, Gut 2013
  status: unverified
- id: hb.L15.066
  kind: cloze
  topic: ap-severity
  text: 'Pancreatic necrosis (local complication): non-viable parenchyma {{c1::> 3 cm}} or {{c2::> 30%}} of the
    pancreas.'
  src:
    page: 286
  status: unverified
  tags:
  - numbers
- id: hb.L15.067
  kind: cloze
  topic: ap-severity
  text: Mild AP (~{{c1::80%}}) has mortality {{c2::< 1%}} and resolves within a week; severe AP (~20%) has mortality
    up to {{c3::35%}}.
  src:
    page: 286
  status: unverified
  tags:
  - numbers
- id: hb.L15.068
  kind: enumerate
  topic: ap-severity
  prompt: Components of the BISAP score.
  points:
  - 'B: BUN > 25 mg/dl (8.9 mmol/L)'
  - 'I: impaired mental status (GCS < 15)'
  - 'S: SIRS'
  - 'A: age > 60 years'
  - 'P: pleural effusion'
  pass: 5
  src:
    page: 287
  status: unverified
  tags:
  - high-yield
- id: hb.L15.069
  kind: cloze
  topic: ap-severity
  text: A BISAP score of {{c1::2 or more}} indicates severe acute pancreatitis, organ failure and mortality risk.
  src:
    page: 288
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L15.070
  kind: enumerate
  topic: ap-severity
  prompt: Ranson's criteria on admission.
  points:
  - Age > 55
  - WBC > 16,000
  - Glucose > 200 mg/dl
  - LDH > 350
  - AST > 250
