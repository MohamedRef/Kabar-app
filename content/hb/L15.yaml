- id: hb.L15.078
  kind: card
  topic: ap-treatment
  front: ACG fluid recommendation in acute pancreatitis — volume strategy and fluid type?
  back: Moderately aggressive resuscitation (extra boluses if hypovolemic), using lactated Ringer's rather than
    normal saline.
  src:
    page: 289
  status: unverified
  tags:
  - high-yield
- id: hb.L15.079
  kind: cloze
  topic: ap-treatment
  text: 'AP fluids: no hypovolemia → no more than {{c1::1.5 ml/kg/h}}; hypovolemia → bolus of {{c2::10 ml/kg}} (usually
    {{c3::3–4 L}} in the first 24 h).'
  src:
    page: 289
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L15.080
  kind: card
  topic: ap-treatment
  front: When is IV hydration most beneficial in AP, what is its goal, and how often is it reassessed?
  back: In the first 12–24 h. Goal is to lower BUN and correct fluid status to keep organ perfusion. Reassess every
    6 h for the next 48 h.
  src:
    page: 289
  status: unverified
- id: hb.L15.081
  kind: enumerate
  topic: ap-treatment
  prompt: Why is lactated Ringer's better than normal saline in acute pancreatitis?
  points:
  - More balanced electrolytes
  - Its calcium binds non-esterified fatty acids, so less injury to the pancreas
  - Lactate has an anti-inflammatory effect
  - pH-balanced, so it limits enzyme activation
  - Saline is acidic and causes non-anion-gap hyperchloremic acidosis and renal injury
  - Large-volume saline is linked to compartment syndrome
  pass: 4
  src:
    page: 289
  status: unverified
  tags:
  - high-yield
- id: hb.L15.082
  kind: card
  topic: ap-treatment
  front: Antibiotic and antifungal prophylaxis in severe AP?
  back: Routine antibiotic prophylaxis is not recommended, and neither are routine antifungals.
  src:
    page: 289
  status: unverified
  tags:
  - high-yield
- id: hb.L15.083
  kind: card
  topic: ap-treatment
  front: When are antibiotics allowed in AP without infected necrosis?
  back: For extrapancreatic infections such as cholangitis, UTI or bacteremia.
  src:
    page: 290
  status: unverified
- id: hb.L15.084
  kind: cloze
  topic: ap-treatment
  text: Suspect infected necrosis when the patient deteriorates or fails to improve after {{c1::7–10 days}} in hospital;
    give pancreas-penetrating antibiotics for {{c2::30 days}} before deciding on surgery.
