  stem: A 45-year-old woman has sudden epigastric pain radiating to the back for 6 hours. Lipase is 4 times the
    upper limit of normal. Ultrasound shows gallstones and a normal-looking pancreas. What is needed to diagnose
    acute pancreatitis?
  options:
