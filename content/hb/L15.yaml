  - Serum amylase to confirm the lipase result
  - MRCP to show a CBD stone
  - CRP above 150 mg/l
  - Contrast CT to confirm pancreatic inflammation
  answer: 0
  why:
  - Correct. Typical pain plus lipase > 3 × ULN gives 2 of 3 criteria.
  - Either amylase or lipase > 3 × ULN is enough.
  - MRCP looks for a cause, not the diagnosis.
  - CRP is prognostic for severity, not diagnostic.
  - CT is not needed when the diagnosis is already established, and is not routine early.
