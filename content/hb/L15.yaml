  stem: A 58-year-old obese man (BMI 34) presents with 10 hours of severe epigastric pain radiating to the back
    and vomiting. Lipase is 6 × ULN.
  steps:
  - reveal: 'Pulse 112, RR 24, temperature 38.3 °C, WBC 15,000. BUN 28 mg/dl, Hct 47%. He is alert. Chest X-ray:
      small left pleural effusion.'
    question: What is his BISAP score?
    options:
    - '1'
    - '2'
    - '3'
    - '4'
    answer: 2
    why: BUN > 25, SIRS (pulse, RR, temperature, WBC) and pleural effusion = 3. He is alert and under 60, so I and
      A score 0. A score ≥ 2 predicts severe AP.
  - reveal: Ultrasound shows gallstones and a swollen pancreas. No dilated CBD; bilirubin normal.
    question: What is the best initial fluid plan?
    options:
    - Normal saline 500 ml/h for 24 h
    - Restrict fluid because of the pleural effusion
    - Lactated Ringer's at 1.5 ml/kg/h with no bolus
    - Lactated Ringer's 10 ml/kg bolus then reassess every 6 h
    answer: 3
    why: He is hypovolemic (tachycardia, Hct 47%), so a 10 ml/kg LR bolus with reassessment every 6 h; aim to bring
      BUN down.
  - reveal: 'At 72 h he still has hypotension (SBP 85) and creatinine 2.6 mg/dl after rehydration. Contrast CT:
      40% necrosis and two fluid collections.'
    question: What is his revised Atlanta grade?
    options:
    - Cannot tell without Ranson
    - Severe
    - Mild
    - Moderately severe
    answer: 1
    why: Organ failure persisting beyond 48 h makes it severe AP (necrotizing).
  - question: What is his CT severity index and its predicted mortality?
    options:
    - 8; 17%
    - 6; 6%
    - 7; 3%
    - 10; 92%
    answer: 0
    why: 'Grade E (≥ 2 collections) = 4, necrosis 30–50% = 4, CTSI 8 (range 7–10): morbidity 92%, mortality 17%.'
  - question: Should antibiotics be started now?
    options:
    - Yes, carbapenem prophylaxis
    - Yes, antifungal prophylaxis
    - Only after CT-guided FNA
    - No; prophylaxis is not recommended without suspected infection
    answer: 3
    why: Routine prophylaxis is not recommended. Suspect infection if he deteriorates or fails to improve after
      7–10 days.
  src:
    page: 287
  status: unverified
  tags:
  - high-yield
