  # ---------- essays (end-of-lecture questions, p401) ----------
  - id: hb.L19.096
    kind: essay
    topic: biliary-pain
    prompt: Mention the clinical presentation and the risk factors for gallbladder stones.
    outline:
      - Presentation:
          - About 80% asymptomatic; biliary colic is the commonest symptom; cholecystitis to cholangitis
          - "Colic: sudden RUQ/epigastric pain after fatty food, radiates to back or arm, steady up to 12 h (usually <6 h), nausea, no fever"
          - "Cholecystitis: pain >12 h, fever, Murphy's sign, tender mass, jaundice, high WBC"
      - Risk factors:
          - Female (2:1), obesity, older age, rapid weight loss, family history, Western diet, American Indian ethnicity
          - Drugs (contraceptive pill, anabolic steroids, somatostatin analogues, lipid-lowering drugs); diabetes, gastrectomy, ileal resection, cirrhosis
          - Haemolysis (pigment stones); parasites (Fasciola, Ascaris, Schistosoma, Clonorchis)
    src: { page: 401 }
    status: unverified
