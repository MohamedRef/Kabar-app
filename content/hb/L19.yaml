  - id: hb.L19.097
    kind: essay
    topic: complications
    prompt: What are the complications of gallbladder stones?
    outline:
      - In the gallbladder:
          - Acute and chronic cholecystitis, gangrene, perforation, empyema, mucocele, hydrops, emphysematous cholecystitis
          - Mirizzi syndrome; carcinoma (0.08%/yr of symptomatic patients over 50)
      - In the bile ducts:
          - Obstructive jaundice, cholangitis, acute (relapsing) pancreatitis
      - In the intestine:
          - Gallstone ileus, Bouveret's syndrome
