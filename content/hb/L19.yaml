items:
  # ---------- anatomy (p375-376) ----------
  - id: hb.L19.001
    kind: card
    topic: anatomy
    front: Two functions of the gallbladder?
    back: It stores bile made by the liver and concentrates it.
    src: { page: 375, quote: "It stores and concentrates bile produced in the liver." }
    status: unverified
  - id: hb.L19.002
    kind: card
    topic: anatomy
    front: What triggers release of bile from the gallbladder into the duodenum?
    back: Food, especially fats.
    src: { page: 375 }
    status: unverified
  - id: hb.L19.003
    kind: enumerate
    topic: anatomy
    prompt: Enumerate the congenital gallbladder anomalies shown in the lecture's figure (9).
    points:
      - Double gallbladder
      - Y-shaped cystic duct
      - Bilobed gallbladder
      - Folded gallbladder
      - Retroserosal gallbladder
      - Gallbladder diverticulum
      - Hourglass gallbladder
      - Intrahepatic gallbladder
      - Gallbladder with a mesentery
    pass: 5
    src: { page: 376 }
    status: unverified
  - id: hb.L19.004
    kind: card
    topic: epidemiology
    front: What is the commonest biliary pathology?
    back: Gallstones. Most disorders of the biliary tract result from gallstones.
    src: { page: 376, quote: "Gallstones are the commonest biliary pathology" }
    status: unverified
  # ---------- epidemiology (p377) ----------
  - id: hb.L19.005
    kind: cloze
    topic: epidemiology
    text: Gallstones affect {{c1::10–20%}} of the adult population, with a female-to-male ratio of about {{c2::2:1}}.
    src: { page: 377 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.006
    kind: cloze
    topic: epidemiology
    text: Gallstone prevalence in Egypt is {{c1::20%}}, and among cirrhotics it is {{c2::30%}}.
    src: { page: 377 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L19.007
    kind: card
    topic: epidemiology
    front: Which people are particularly prone to cholesterol stones?
    back: Older people, women with a tendency to obesity, and people with rapid weight loss.
    src: { page: 377 }
    status: unverified
  - id: hb.L19.008
    kind: card
    topic: epidemiology
    front: Which patients are prone to pigment stones?
    back: People with disorders of haemoglobin that increase haemolysis.
    src: { page: 377 }
    status: unverified
  - id: hb.L19.009
    kind: enumerate
    topic: epidemiology
    prompt: Enumerate the risk factors for gallstones given in the lecture.
    points:
      - Female sex
      - Obesity
      - Increasing age
      - American Indian ethnicity
      - Western diet
      - Family history
      - Rapid weight loss
      - "Drugs: contraceptive pills, anabolic steroids, somatostatin analogues (long-term octreotide), lipid-lowering drugs"
      - Diabetes, gastrectomy, ileal resection
      - Cirrhosis
      - Haemolytic disorders (pigment stones)
    pass: 7
    src: { page: 377 }
    status: unverified
    tags: [high-yield]
  - id: hb.L19.010
    kind: cloze
    topic: epidemiology
    text: In Egypt, gallstone prevalence is higher in diabetics, after {{c1::gastrectomy}} and {{c2::ileal resection}}, and with long-term {{c3::octreotide}}, lipid-lowering drugs and contraceptive pills.
    src: { page: 377 }
    status: unverified
  - id: hb.L19.011
    kind: cloze
    topic: natural-history
    text: "{{c1::70–80%}} of people with gallstones stay asymptomatic for life, and about {{c2::1–3%}} of them develop symptoms each year; the risk {{c3::decreases}} with age."
    src: { page: 377 }
    status: unverified
    tags: [numbers]
  # ---------- pathogenesis (p378-379) ----------
  - id: hb.L19.012
    kind: enumerate
    topic: pathogenesis
    prompt: Mention the predisposing factors for gallbladder stone formation (4).
    points:
      - Impaired gallbladder function
      - Supersaturated bile
      - Cholesterol nucleating factors
      - Absorption / enterohepatic circulation of bile acids
    pass: 3
    src: { page: 378 }
    status: unverified
  - id: hb.L19.013
    kind: card
    topic: pathogenesis
    front: What is biliary sludge made of?
    back: Calcium bilirubinate, cholesterol microcrystals and mucin.
    src: { page: 378, quote: "It consists of Ca bilirubinate (a polymer of bilirubin), cholesterol microcrystals, and mucin." }
    status: unverified
    tags: [high-yield]
  - id: hb.L19.014
    kind: card
    topic: pathogenesis
    front: Two situations the book gives where sludge forms from gallbladder stasis?
    back: Pregnancy and total parenteral nutrition (TPN).
    src: { page: 378 }
    status: unverified
  - id: hb.L19.015
    kind: card
    topic: pathogenesis
    front: What usually happens to biliary sludge, and what can it lead to?
    back: Most is asymptomatic and disappears when the cause resolves. It can also become gallstones or migrate and obstruct the ducts, causing biliary pain, cholangitis or pancreatitis.
    src: { page: 378 }
    status: unverified
  - id: hb.L19.016
    kind: card
    topic: pathogenesis
    front: Which bile protein accelerates cholesterol precipitation and forms the scaffold (nucleus) for crystal growth?
    back: Mucin (a glycoprotein).
    src: { page: 379 }
    status: unverified
  - id: hb.L19.017
    kind: enumerate
    topic: pathogenesis
    prompt: Enumerate the nucleating factors for gallstones (6).
    points:
      - Specific heat-labile glycoproteins
      - Gallbladder mucus
      - Biliary calcium
      - Altered gallbladder prostaglandin metabolism
      - Gallbladder stasis
      - Altered gallbladder absorption
    pass: 4
    src: { page: 379 }
    status: unverified
  - id: hb.L19.018
    kind: cloze
    topic: pathogenesis
    text: Once cholesterol crystals cluster, stones are inevitable and grow about {{c1::1–2 mm}} per year, taking {{c2::5–20 years}} to become large enough to cause problems.
    src: { page: 380 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.019
    kind: enumerate
    topic: pathogenesis
    prompt: Mention the biliary parasites commonly associated with cholelithiasis (4).
    points:
      - Fascioliasis
      - Ascariasis
      - Schistosomiasis
      - Clonorchiasis (Clonorchis sinensis), which is precancerous
    pass: 3
    src: { page: 379 }
    status: unverified
  - id: hb.L19.020
    kind: card
    topic: pathogenesis
    front: Which biliary parasite does the book flag as precancerous?
    back: Clonorchis sinensis (clonorchiasis).
    src: { page: 379 }
    status: unverified
  # ---------- stone types (p379-380) ----------
  - id: hb.L19.021
    kind: cloze
    topic: stone-types
    text: The three types of gallstones are {{c1::cholesterol}}, {{c2::pigment (black or brown)}} and {{c3::mixed}} stones.
    src: { page: 379 }
    status: unverified
  - id: hb.L19.022
    kind: cloze
    topic: stone-types
    text: Cholesterol stones make up {{c1::more than 85%}} of gallstones, especially in the Western world.
    src: { page: 380 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.023
    kind: card
    topic: stone-types
    front: How is water-insoluble cholesterol normally kept in solution in bile?
    back: It combines with bile salts and lecithin to form mixed micelles.
    src: { page: 380 }
    status: unverified
  - id: hb.L19.024
    kind: card
    topic: stone-types
    front: Commonest cause of bile supersaturation with cholesterol, and two examples?
    back: Excessive cholesterol secretion, as in obesity or diabetes.
    src: { page: 380 }
    status: unverified
  - id: hb.L19.025
    kind: cloze
    topic: stone-types
    text: Less often, supersaturation comes from low bile salt secretion, as in {{c1::cystic fibrosis}} (bile salt malabsorption), or low lecithin secretion, as in a rare form of {{c2::progressive familial intrahepatic cholestasis}}.
    src: { page: 380 }
    status: unverified
  - id: hb.L19.026
    kind: table
    topic: stone-types
    title: Types of gallstones
    columns: [Type, Consistency, Composition, Where they form, Associations]
    rows:
      - [Cholesterol, "—", "Cholesterol (bile supersaturated with cholesterol)", Gallbladder, "Obesity, diabetes, female, older age, rapid weight loss; >85% of stones"]
      - [Black pigment, Small and hard, "Calcium bilirubinate + inorganic calcium salts (carbonate, phosphate)", Gallbladder, "Alcoholic liver disease, chronic haemolysis, older age"]
      - [Brown pigment, Soft and greasy, "Bilirubinate + fatty acids (calcium palmitate or stearate)", Bile ducts, "Infection, inflammation, parasites (liver flukes in Asia); behind strictures"]
    blanks: [[1, 1], [1, 2], [1, 4], [2, 1], [2, 2], [2, 3], [2, 4]]
    src: { page: 380 }
    status: unverified
    tags: [high-yield]
  - id: hb.L19.027
    kind: card
    topic: stone-types
    front: Which gallstones form in the bile ducts rather than the gallbladder?
    back: Brown pigment stones. They can also form behind strictures because of stasis and infection.
    src: { page: 380, quote: "Most gallstones form within the gallbladder, but brown pigment stones form in the ducts." }
    status: unverified
    tags: [high-yield]
  - id: hb.L19.028
    kind: card
    topic: stone-types
    front: Three factors that speed up black pigment stone formation?
    back: Alcoholic liver disease, chronic haemolysis and older age.
    src: { page: 380 }
    status: unverified
  # ---------- biliary pain (p381-382) ----------
  - id: hb.L19.029
    kind: card
    topic: biliary-pain
    front: Most common symptom of gallstones?
    back: Biliary colic (biliary-type pain).
    src: { page: 381 }
    status: unverified
  - id: hb.L19.030
    kind: card
    topic: biliary-pain
    front: What causes biliary colic?
    back: A stone migrating into the cystic duct, even transiently.
    src: { page: 381 }
    status: unverified
  - id: hb.L19.031
    kind: card
    topic: biliary-pain
    front: Where does biliary pain start and radiate?
    back: It usually starts in the right upper quadrant (it may be elsewhere in the upper abdomen) and may radiate to the back or down the arm.
    src: { page: 381 }
    status: unverified
  - id: hb.L19.032
    kind: card
    topic: biliary-pain
    front: In which patients is biliary pain often poorly localised?
    back: Diabetics and the elderly.
    src: { page: 381 }
    status: unverified
  - id: hb.L19.033
    kind: order
    topic: biliary-pain
    prompt: The time course of an episode of biliary colic
    steps:
      - Begins suddenly
      - Becomes intense within 15 min to 1 h
      - Stays at a steady intensity for up to 12 h (usually under 6 h)
      - Fades gradually over 30–90 min
      - Leaves a dull ache
    src: { page: 381 }
    status: unverified
  - id: hb.L19.034
    kind: cloze
    topic: biliary-pain
    text: Biliary colic stays steady for up to {{c1::12 h}} (usually {{c2::under 6 h}}); pain lasting {{c3::more than 12 h}}, especially with vomiting or fever, suggests acute cholecystitis or pancreatitis.
    src: { page: 382 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L19.035
    kind: card
    topic: biliary-pain
    front: In simple biliary colic, do fever and chills occur? Are there peritoneal signs?
    back: No fever or chills unless cholecystitis has developed, and no peritoneal signs. There may be mild RUQ or epigastric tenderness, and the patient is well between attacks.
    src: { page: 381 }
    status: unverified
  - id: hb.L19.036
    kind: card
    topic: biliary-pain
    front: Usual precipitant of biliary-type pain?
    back: Fatty food (it can also follow a heavy meal).
    src: { page: 382 }
    status: unverified
  - id: hb.L19.037
    kind: card
    topic: biliary-pain
    front: Does the severity and frequency of biliary pain correlate with gallbladder pathology?
    back: Little correlation. Biliary pain can occur without cholecystitis.
    src: { page: 382 }
    status: unverified
  - id: hb.L19.038
    kind: enumerate
    topic: biliary-pain
    prompt: Mention the clinical findings listed in the lecture (when inflammation is present).
    points:
      - Shallow respiration
      - Fever
      - Jaundice
      - Positive Murphy's sign
      - Tender mass in the gallbladder region
      - High white cell count
    pass: 4
    src: { page: 381 }
    status: unverified
  # ---------- natural history (p382-383, figure on p382) ----------
  - id: hb.L19.039
    kind: cloze
    topic: natural-history
    text: "Natural history figure: of asymptomatic stones, about {{c1::2–3%}} per year develop biliary colic and about {{c2::0.2%}} per year present with acute cholecystitis."
    src: { page: 382 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.040
    kind: cloze
    topic: natural-history
    text: "Natural history figure: biliary colic recurs in {{c1::20–50%}} in the first year; acute cholecystitis recurs in {{c2::30%}} within the first month."
    src: { page: 382 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.041
    kind: cloze
    topic: natural-history
    text: Gallbladder carcinoma develops in about {{c1::0.08%}} per year of symptomatic patients over {{c2::50}} years old.
    src: { page: 382 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.042
    kind: cloze
    topic: natural-history
    text: Asymptomatic gallstones become symptomatic at about {{c1::2%}} a year, most often as {{c2::biliary pain}} rather than a major complication.
    src: { page: 383 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.043
    kind: cloze
    topic: natural-history
    text: Once symptoms start, pain returns in {{c1::20–40%}} of patients a year and {{c2::1–2%}} a year develop complications.
    src: { page: 383 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L19.044
    kind: card
    topic: natural-history
    front: Complications that develop in 1–2% a year of symptomatic gallstone patients?
    back: Cholecystitis, choledocholithiasis, cholangitis and gallstone pancreatitis.
    src: { page: 383 }
    status: unverified
  # ---------- cholecystitis (p383-384) ----------
  - id: hb.L19.045
    kind: cloze
    topic: cholecystitis
    text: In cholecystitis the cystic duct is obstructed in {{c1::96%}} of cases.
    src: { page: 383 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.046
    kind: card
    topic: cholecystitis
    front: Typical patient with cholecystitis, according to the book?
    back: An obese, fertile woman over 40.
    src: { page: 383 }
    status: unverified
  - id: hb.L19.047
    kind: card
    topic: cholecystitis
    front: "Pain of cholecystitis: timing, site and referral?"
    back: Late at night, in the right hypochondrium and epigastrium, referred to the right shoulder.
    src: { page: 383 }
    status: unverified
  - id: hb.L19.048
    kind: card
    topic: cholecystitis
    front: When does fever appear in cholecystitis?
    back: When bacterial infection occurs.
    src: { page: 383 }
    status: unverified
  - id: hb.L19.049
    kind: cloze
    topic: cholecystitis
    text: Acalculous cholecystitis causes {{c1::5–10%}} of acute cholecystitis in adults and {{c2::30%}} in children.
    src: { page: 384 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L19.050
    kind: enumerate
    topic: cholecystitis
    prompt: Enumerate the causes/associations of acalculous cholecystitis.
    points:
      - "Critical illness: after major surgery, multiple injuries, major burns, severe sepsis, mechanical ventilation"
      - Typhoid bacilli infection
      - Actinomycosis
      - Parasitic cholecystitis
    pass: 3
    src: { page: 384 }
    status: unverified
    tags: [high-yield]
  # ---------- complications (p386-387) ----------
  - id: hb.L19.051
    kind: enumerate
    topic: complications
    prompt: Mention the complications of gallstone disease (summary list).
    points:
      - Acute cholecystitis
      - Cholangitis
      - Chronic cholecystitis
      - Gallbladder cancer
      - Mucocele and pyocele of the gallbladder
      - Rupture of the gallbladder
      - Acute biliary pancreatitis
      - Obstructive jaundice
      - Mirizzi syndrome
      - Bouveret's syndrome
      - Gallstone ileus
    pass: 7
    src: { page: 386 }
    status: unverified
    tags: [high-yield]
  - id: hb.L19.052
    kind: table
    topic: complications
    title: Complications of gallstones by site
    columns: [Site, Complications]
    rows:
      - [In the gallbladder, "Silent stones, acute and chronic cholecystitis, gangrene, perforation, mucocele, empyema, emphysematous cholecystitis, hydrops, adenomyomatosis, cholesterosis, polyposis, cholecystitis glandularis proliferans, diverticulosis, typhoid gallbladder, carcinoma"]
      - [In the bile ducts, "Obstructive jaundice, cholangitis, acute relapsing pancreatitis"]
      - [In the intestine, "Gallstone ileus (acute intestinal obstruction), Bouveret's syndrome"]
    blanks: [[1, 1], [2, 1]]
    src: { page: 387 }
    status: unverified
  - id: hb.L19.053
    kind: card
    topic: complications
    front: Three complications of gallstones in the bile ducts?
    back: Obstructive jaundice, cholangitis and acute relapsing pancreatitis.
    src: { page: 387 }
    status: unverified
  - id: hb.L19.054
    kind: card
    topic: complications
    front: Two intestinal complications of gallstones?
    back: Gallstone ileus (acute intestinal obstruction) and Bouveret's syndrome.
    src: { page: 387 }
    status: unverified
  - id: hb.L19.055
    kind: enumerate
    topic: complications
    prompt: Enumerate at least 8 complications of gallstones within the gallbladder itself.
    points:
      - Silent gallstones
      - Acute cholecystitis
      - Chronic cholecystitis
      - Gangrene
      - Perforation
      - Mucocele
      - Empyema
      - Emphysematous cholecystitis
      - Hydrops
      - Adenomyomatosis
      - Cholesterosis
      - Polyposis
      - Cholecystitis glandularis proliferans
      - Diverticulosis
      - Typhoid gallbladder
      - Carcinoma
    pass: 8
    src: { page: 386 }
    status: unverified
  - id: hb.L19.056
    kind: card
    topic: post-chole
    front: How may gallstones reach the bile duct after cholecystectomy?
    back: They may migrate there, or (especially brown pigment stones) form behind strictures from stasis and infection.
    src: { page: 380 }
    status: unverified
  # ---------- diagnosis and DD (p391-398) ----------
  - id: hb.L19.057
    kind: enumerate
    topic: diagnosis
    prompt: Mention the diagnostic tools for gallbladder stone disease (7).
    points:
      - Clinical
      - Ultrasound
      - Cholecystography
      - CT scan
      - MRCP
      - ERCP
      - PTC
    pass: 5
    src: { page: 391 }
    status: unverified
  - id: hb.L19.058
    kind: cloze
    topic: diagnosis
    text: Ultrasound is accurate for gallstones in {{c1::more than 95%}} of cases.
    src: { page: 392 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L19.059
    kind: enumerate
    topic: diagnosis
    prompt: Mention the differential diagnosis of gallbladder stone disease (5).
    points:
      - Appendicitis
      - Perforated peptic ulcer
      - Intestinal obstruction
      - Pleurisy
      - Myocardial infarction
    pass: 4
    src: { page: 398 }
    status: unverified
    tags: [high-yield]
  - id: hb.L19.060
    kind: card
    topic: treatment
    front: First-aid treatment of an acute gallbladder attack (book)?
    back: Antibiotics, analgesia and an antispasmodic, then surgery.
    src: { page: 398 }
    status: unverified
  # ---------- treatment (p384-385) ----------
  - id: hb.L19.061
    kind: card
    topic: treatment
    front: Treatment of symptomatic gallstones?
    back: Laparoscopic cholecystectomy, because pain is likely to recur and serious complications can develop.
    src: { page: 384 }
    status: unverified
    tags: [high-yield]
  - id: hb.L19.062
    kind: card
    topic: treatment
    front: Usual approach to asymptomatic gallstones?
    back: Expectant management (sometimes stone dissolution).
    src: { page: 384 }
    status: unverified
  - id: hb.L19.063
    kind: cloze
    topic: treatment
    text: Elective open cholecystectomy, done when free of complications, has an overall mortality of about {{c1::0.1%}}.
    src: { page: 384 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.064
    kind: card
    topic: treatment
    front: Advantages of laparoscopic over open cholecystectomy?
    back: Much shorter convalescence, less postoperative discomfort, better cosmetic result, with no increase in morbidity or mortality.
    src: { page: 384 }
    status: unverified
  - id: hb.L19.065
    kind: cloze
    topic: treatment
    text: Laparoscopic cholecystectomy is converted to open in {{c1::2–5%}} of patients, usually because {{c2::the biliary anatomy cannot be identified}} or a complication cannot be managed.
    src: { page: 384 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.066
    kind: card
    topic: treatment
    front: What does cholecystectomy prevent well, and what less well?
    back: It effectively prevents future biliary colic, but is less effective for atypical symptoms such as dyspepsia.
    src: { page: 385 }
    status: unverified
  - id: hb.L19.067
    kind: card
    topic: treatment
    front: Does cholecystectomy need dietary restriction afterwards? Which bowel symptom can follow?
    back: No nutritional problems or dietary limits. Some patients get diarrhoea, often from unmasked ileal bile salt malabsorption.
    src: { page: 385 }
    status: unverified
  - id: hb.L19.068
    kind: card
    topic: treatment
    front: Two indications for prophylactic cholecystectomy in asymptomatic gallstones?
    back: Very large stones (over 3 cm) and a calcified (porcelain) gallbladder, because of the increased risk of gallbladder carcinoma.
    src: { page: 385 }
    status: unverified
    tags: [high-yield]
  - id: hb.L19.069
    kind: card
    topic: treatment
    front: Who is offered oral bile acid dissolution of gallstones?
    back: Patients who decline surgery or are at high surgical risk (comorbidity, advanced age).
    src: { page: 385 }
    status: unverified
  - id: hb.L19.070
    kind: card
    topic: treatment
    front: Best candidates for oral stone dissolution?
    back: Small, radiolucent (likely cholesterol) stones in a functioning, non-obstructed gallbladder, shown by normal filling on cholescintigraphy or oral cholecystography, or no stones in the neck.
    src: { page: 385 }
    status: unverified
    tags: [high-yield]
  - id: hb.L19.071
    kind: cloze
    topic: treatment
    text: Ursodeoxycholic acid {{c1::8–10 mg/kg/day}} orally dissolves {{c2::80%}} of tiny stones under {{c3::0.5 cm}} within 6 months.
    src: { page: 385 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L19.072
    kind: cloze
    topic: treatment
    text: After successful dissolution, gallstones recur in {{c1::50%}} within {{c2::5 years}}.
    src: { page: 385 }
    status: unverified
    tags: [numbers]
  - id: hb.L19.073
    kind: card
    topic: treatment
    front: What does the book say about extracorporeal shock wave lithotripsy for gallstones?
    back: Stone fragmentation by ESWL to help dissolution is now unavailable.
    src: { page: 385 }
    status: unverified
  - id: hb.L19.074
    kind: card
    topic: treatment
    front: Where is ursodeoxycholic acid useful to prevent gallstones?
    back: In morbidly obese patients losing weight rapidly after bariatric surgery or on a very low calorie diet.
    src: { page: 385 }
    status: unverified
