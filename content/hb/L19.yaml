  - id: hb.L19.099
    kind: essay
    topic: treatment
    prompt: How do you diagnose and treat gallbladder stone disease?
    outline:
      - Diagnosis:
          - Clinical; ultrasound (accurate >95%); cholecystography, CT, MRCP, ERCP, PTC
      - Acute attack:
          - Antibiotics, analgesia, antispasmodics, then surgery
      - Symptomatic stones:
          - Laparoscopic cholecystectomy (treatment of choice, 2–5% converted); open mortality ~0.1%
      - Asymptomatic stones:
          - Expectant; prophylactic cholecystectomy only for stones >3 cm or porcelain gallbladder
      - Dissolution:
          - UDCA 8–10 mg/kg/day for small radiolucent stones in a functioning gallbladder; 80% of <0.5 cm in 6 months; 50% recur in 5 yr
          - UDCA prevents stones in rapid weight loss after bariatric surgery
      - Duct stones:
          - ERCP sphincterotomy and stone extraction
