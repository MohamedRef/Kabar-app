schema: batna.content/v1
lecture: hb.L19
title: Gall Bladder Diseases
author: Dr. Yousry Taher, Prof. Ehab Hassouna
book: { chapter: 1, pages: [375, 401] }
topics:
  - { id: anatomy, title: "Gallbladder function and congenital anomalies" }
  - { id: epidemiology, title: "Epidemiology, Egypt prevalence and risk factors" }
  - { id: pathogenesis, title: "Sludge, nucleation and stone growth" }
  - { id: stone-types, title: "Cholesterol, black and brown pigment stones" }
  - { id: biliary-pain, title: "Biliary pain and clinical findings" }
  - { id: natural-history, title: "Natural history and prognosis" }
  - { id: cholecystitis, title: "Acute, chronic and acalculous cholecystitis" }
  - { id: complications, title: "Complications of gallstones" }
