  - id: hb.L06.062
    kind: card
    topic: cirrhosis-dm
    front: Diabetes treatment in decompensated cirrhosis?
    back: Basal long-acting insulin with or without rapid-acting insulin analogue, with close dose titration and glucose monitoring. Insulin only.
    src: { page: 110 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.063
    kind: card
    topic: cirrhosis-dm
    front: Can resmetirom be used in cirrhosis, per the ADA figure?
    back: No. Avoid resmetirom in cirrhosis.
    src: { page: 111 }
    status: unverified
  - id: hb.L06.064
    kind: card
    topic: cirrhosis-dm
    front: Which extra care team members does the ADA figure add for MASLD cirrhosis?
    back: A transplant team for decompensated cirrhosis and a social support team.
    src: { page: 111 }
    status: unverified

  # --- Obeticholic acid and resmetirom (p110, 112) ---
  - id: hb.L06.065
    kind: card
    topic: new-drugs
    front: What is obeticholic acid (Ocaliva)?
    back: A bile acid analogue of chenodeoxycholic acid, 100× more potent; a first-in-class selective FXR agonist with anti-inflammatory and anti-fibrotic effects.
    src: { page: 110 }
    status: unverified
  - id: hb.L06.066
    kind: card
    topic: new-drugs
    front: What happened to obeticholic acid as a NASH treatment?
    back: The FDA rejected it twice.
    src: { page: 110 }
    status: unverified
  - id: hb.L06.067
