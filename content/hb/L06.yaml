  - id: hb.L06.080
    kind: mcq
    topic: drugs
    stem: An obese 49-year-old man with type 2 diabetes has MASLD at F0–F1. Which diabetes drugs does the ADA algorithm prefer?
    options:
      - Insulin only
      - Sulfonylureas
      - GLP-1RA, dual GIP/GLP-1RA, pioglitazone or SGLT2 inhibitor
      - Resmetirom
      - DPP-4 inhibitors
    answer: 2
    why:
      - Insulin only is for decompensated cirrhosis.
      - Sulfonylureas have no liver benefit and are not preferred.
      - Correct. These lower cardiovascular risk and steatosis.
      - MASH drugs are not indicated at F0–F1.
      - DPP-4 inhibitors are not in the preferred list.
