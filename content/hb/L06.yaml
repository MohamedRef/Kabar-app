    status: unverified
  - id: hb.L06.073
    kind: mcq
    topic: screening
    stem: A 58-year-old woman with type 2 diabetes has normal ALT. FIB-4 is 1.9. Under the EASL 2021 pathway, what is next?
    options:
      - Reassure and re-test in 3 years
      - Transient elastography
      - Liver biopsy
      - Refer directly for transplant assessment
      - No action, because ALT is normal
    answer: 1
    why:
      - Re-testing in 1–3 years is for FIB-4 below 1.30.
      - Correct. FIB-4 ≥1.30 is intermediate-high risk, so measure liver stiffness.
      - Biopsy is considered only after elastography ≥8 kPa with no patented serum test or discordant results.
      - Nothing suggests end-stage disease.
      - Normal enzymes do not exclude NASH or advanced fibrosis in diabetes.
    src: { page: 104 }
    status: unverified
    tags: [high-yield]
