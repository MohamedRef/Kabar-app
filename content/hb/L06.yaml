    kind: mcq
    topic: fibrosis
    stem: A FibroScan report shows median stiffness 9.5 kPa, IQR 3.6, IQR/median 38%. How should it be read?
    options:
      - Reliable; F3–F4 highly likely
      - Unreliable because IQR/median is above 30%
      - Reliable; low risk
      - Unreliable because fewer than 20 measurements are needed
      - Shows steatosis grade only
    answer: 1
    why:
      - The variability is too high to trust the value.
      - Correct. IQR/median above 30% means no reliability.
      - 9.5 kPa is not low, and the reading is not reliable anyway.
      - The median needs 10 valid measurements, not 20.
      - Stiffness in kPa reflects fibrosis; CAP shows steatosis.
