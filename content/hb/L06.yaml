    blanks: [[0, 1], [2, 1], [5, 1], [6, 1]]
    src: { page: 101 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.030
    kind: card
    topic: fibrosis
    front: Why are pre-menopausal women at lower risk of MASH fibrosis?
    back: Estrogen inhibits stellate cell activation and fibrogenesis.
    src: { page: 101 }
    status: unverified
  - id: hb.L06.031
    kind: card
    topic: fibrosis
    front: Two gene polymorphisms that predict fibrosis progression in MASH?
    back: PNPLA3 and TM6SF2.
    src: { page: 101 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.032
    kind: card
    topic: fibrosis
    front: FIB-4 formula?
    back: (Age × AST) ÷ (platelet count × √ALT).
    src: { page: 102 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.033
    kind: cloze
    topic: fibrosis
    text: "FIB-4 bands on page 102: below {{c1::1.3}} is low risk, {{c2::1.3–3.25}} is intermediate, and above {{c3::3.25}} is high risk."
    src: { page: 102 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L06.034
    kind: cloze
    topic: fibrosis
    text: "A FibroScan median stiffness is calculated from {{c1::10}} valid measurements, and IQR/median above {{c2::30%}} means the reading is not reliable."
    src: { page: 102 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L06.035
    kind: card
    topic: fibrosis
    front: On a FibroScan report, what do the two big numbers measure, and in what units?
    back: Liver stiffness E in kPa (fibrosis) and CAP in dB/m (steatosis).
    src: { page: 102 }
    status: unverified

  # --- Who to screen; referral (p102, p104) ---
  - id: hb.L06.036
    kind: card
    topic: screening
    front: Is general population screening for MASLD advised?
    back: No.
    src: { page: 102 }
    status: unverified
  - id: hb.L06.037
    kind: enumerate
    topic: screening
    prompt: Although population screening is not advised, what three things does the lecture say we need to do for MASLD?
    points:
      - Screen all prediabetics and type 2 diabetics
      - Identify patients at high risk of progressive disease
      - Assess the degree of fibrosis and stage the liver disease
    pass: 3
    src: { page: 102 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.038
    kind: order
    topic: screening
    prompt: "EASL 2021 pathway in primary care or diabetology clinic, for a patient with only metabolic co-factors or alcohol: order the steps."
    steps:
      - Check liver risk factors and test AST, ALT, GGT, ALP and platelets
      - Calculate FIB-4
      - "If FIB-4 ≥1.30: transient elastography"
      - "If liver stiffness ≥8 kPa: patented serum test if available, else consider biopsy"
      - "If both agree: F3–F4 highly likely, refer to liver clinic"
    src: { page: 104 }
    status: unverified
  - id: hb.L06.039
    kind: cloze
    topic: screening
    text: "EASL 2021: FIB-4 below {{c1::1.30}} or liver stiffness below {{c2::8 kPa}} means low risk: no referral, lifestyle changes, and re-test in {{c3::1–3 years}}."
    src: { page: 104 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L06.040
    kind: card
    topic: screening
    front: In the EASL 2021 pathway, who goes straight to the liver specialist without FIB-4?
    back: Patients with viral hepatitis or other chronic liver disease, or clinical signs of advanced liver disease or cirrhosis.
    src: { page: 104 }
    status: unverified
  - id: hb.L06.041
    kind: cloze
    topic: screening
    text: "ADA 2025: FIB-4 <{{c1::1.3}} means re-assess every 1–3 years; FIB-4 >{{c2::2.67}} means hepatology referral; in between, do VCTE and refer if stiffness ≥{{c3::8.0 kPa}}."
    src: { page: 104 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L06.042
    kind: card
    topic: screening
    front: Which patients enter the ADA 2025 MASLD fibrosis pathway?
    back: Type 2 diabetes, or obesity with at least one cardiometabolic risk factor, or persistently raised liver enzymes.
    src: { page: 104 }
    status: unverified
  - id: hb.L06.043
    kind: table
    topic: screening
    title: ADA care of people with diabetes and MASLD (liver monitoring)
    columns: [Stage, Liver monitoring, MASH drug]
    rows:
      - ["F0–F1", "FIB-4 every 1–2 years; LSM by elastography (or ELF) if FIB-4 >1.3", "Not indicated"]
      - ["F2–F3 (at-risk MASH)", "Consider annual imaging (LSM by elastography or MRE) and blood fibrosis biomarkers", "Resmetirom, GLP-1RA"]
      - ["Compensated cirrhosis", "Tailored to severity and complications; screen for HCC", "Avoid"]
      - ["Decompensated cirrhosis", "Tailored to severity and complications; screen for HCC", "Avoid"]
    blanks: [[0, 1], [1, 2], [2, 2], [3, 2]]
    src: { page: 111 }
    status: unverified
    tags: [high-yield]

  # --- Lifestyle and supplements (p105-106) ---
  - id: hb.L06.044
    kind: card
    topic: lifestyle
    front: What do the weight-loss studies (diet, diet + exercise, orlistat, surgery) show in NAFLD?
    back: Weight loss by any of these routes improved ALT in nearly all studies, and histology where it was measured.
    src: { page: 105 }
    status: unverified
  - id: hb.L06.045
    kind: card
    topic: lifestyle
    front: Which NAFLD patients does the lecture say may get vitamin E?
    back: Only adults with NASH who do not have diabetes or cirrhosis.
    src: { page: 106, quote: "vitamin E is only recommended in adults with NASH who do not have diabetes or cirrhosis" }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.046
    kind: enumerate
    topic: lifestyle
    prompt: Mention the antioxidant dietary agents listed for NAFLD.
    points:
      - Vitamin E and vitamin C
      - Resveratrol (red grape skin)
      - Green tea extract
      - Coffee
      - Garlic (S-allylmercaptocysteine)
      - Ginger
    pass: 4
    src: { page: 106 }
    status: unverified
  - id: hb.L06.047
    kind: card
    topic: lifestyle
    front: Two liver-related benefits of coffee mentioned in the lecture?
    back: It lowers the risk of type 2 diabetes and is linked to less fibrosis in NASH.
    src: { page: 106 }
    status: unverified
  - id: hb.L06.048
    kind: enumerate
    topic: lifestyle
    prompt: Mention the anti-inflammatory dietary supplements listed for NAFLD.
    points:
      - Polyunsaturated and monounsaturated fatty acids
      - Vitamin D
      - Probiotics, prebiotics and synbiotics
    pass: 3
    src: { page: 106 }
    status: unverified
  - id: hb.L06.049
    kind: card
    topic: lifestyle
    front: Why are probiotics proposed in NAFLD?
    back: The gut–liver axis is an important pathway in NAFLD development.
    src: { page: 106 }
    status: unverified
  - id: hb.L06.050
    kind: cloze
    topic: lifestyle
    text: "Insulin-sensitizing and lipid-lowering supplements for NAFLD: {{c1::cinnamon}}, {{c2::curcumin}} and {{c3::carnitine}}."
    src: { page: 106 }
    status: unverified
  - id: hb.L06.051
    kind: card
    topic: lifestyle
    front: How does carnitine fit into NAFLD treatment?
    back: It is an essential component of mitochondrial beta-oxidation.
    src: { page: 106 }
    status: unverified

  # --- Antidiabetic drugs (p107-109, 111) ---
  - id: hb.L06.052
    kind: card
    topic: drugs
    front: In the insulin-sensitizer table, which drugs improved histology in RCTs, and what about metformin?
    back: Pioglitazone (alone, with vitamin E, or with diet) improved ALT and histology, including in RCTs. Metformin improved ALT, but histology data were few and mixed (one RCT positive, one negative).
    src: { page: 107 }
    status: unverified
  - id: hb.L06.053
    kind: enumerate
    topic: drugs
    prompt: Mention the actions of the GLP-1 analogue liraglutide.
    points:
      - Controls serum glucose
      - Induces insulin secretion
      - Reduces glucagon secretion
      - Weight loss, appetite suppression and delayed gastric emptying
    pass: 3
    src: { page: 107 }
    status: unverified
  - id: hb.L06.054
    kind: card
    topic: drugs
    front: Which DPP-4 inhibitor showed anti-steatotic and anti-inflammatory activity in a NASH mouse model?
    back: Linagliptin, which has high exposure in hepatic tissue.
    src: { page: 108 }
    status: unverified
  - id: hb.L06.055
    kind: card
    topic: drugs
    front: What did empagliflozin do in non-diabetic NAFLD (Taheri RCT, 2020)?
    back: Improved steatosis and, more importantly, fibrosis on transient elastography and CAP.
    src: { page: 109 }
    status: unverified
  - id: hb.L06.056
    kind: cloze
    topic: drugs
    text: "Empagliflozin's antifibrotic effect may come from inhibiting hepatic {{c1::IL-6}}, {{c2::TNF-alpha}} and {{c3::MCP-1}}."
    src: { page: 109 }
    status: unverified
  - id: hb.L06.057
    kind: table
    topic: drugs
    title: How antidiabetic agents improve NAFLD/MASLD (book figure)
    columns: [Agent, Main liver-relevant effects]
    rows:
      - ["Pioglitazone", "↓ insulin resistance, ↓ inflammation, ↓ FFA flux, body fat redistribution"]
      - ["GLP-1 receptor agonists", "↓ FFA flux, ↓ body weight, ↓ gluconeogenesis, ↓ inflammation"]
      - ["SGLT2 inhibitors", "↓ body weight, ↓ insulin/glucagon ratio, ↓ inflammation, ↓ oxidative stress, ↑ adiponectin"]
      - ["Multi-agonists", "↓ insulin resistance, ↓ inflammation, ↓↓ body weight, ↓ FFA flux, glucagon receptor activation"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 109 }
    status: unverified
  - id: hb.L06.058
    kind: table
    topic: drugs
    title: ADA MASLD treatment algorithm for prediabetes or diabetes (book figure)
    columns: [Stage, Obesity drugs, Diabetes drugs, MASH drugs]
    rows:
      - ["F0–F1", "Prefer GLP-1RA, dual GIP/GLP-1RA", "Prefer GLP-1RA, dual GIP/GLP-1RA, pioglitazone, SGLT2i", "Not indicated"]
      - ["F2–F3 (at-risk MASH)", "Prefer GLP-1RA, dual GIP/GLP-1RA", "Prefer GLP-1RA, dual GIP/GLP-1RA, pioglitazone", "Resmetirom, GLP-1RA"]
      - ["Compensated cirrhosis", "As F2–F3, with caution", "As F2–F3, with caution", "Avoid"]
      - ["Decompensated cirrhosis", "Avoid", "Insulin only", "Avoid"]
    blanks: [[0, 3], [1, 2], [1, 3], [2, 3], [3, 1], [3, 2]]
    src: { page: 111 }
    status: unverified
    tags: [high-yield]
    update:
      text: "Semaglutide 2.4 mg received FDA accelerated approval for non-cirrhotic MASH with F2–F3 fibrosis in August 2025."
      ref: "FDA approval of Wegovy for MASH, August 2025"
  - id: hb.L06.059
    kind: card
    topic: drugs
    front: Per the lecture, which MASLD patients should get antidiabetic drugs chosen for liver benefit?
    back: Only diabetic patients with MASLD, if indicated; the evidence for histologic benefit is growing.
    src: { page: 112 }
    status: unverified
  - id: hb.L06.060
    kind: card
    topic: drugs
    front: In F2–F3 MASH with diabetes, when does ADA say to consider resmetirom?
    back: After optimizing treatment of obesity and/or diabetes for at least 6–12 months.
    src: { page: 111 }
    status: unverified

