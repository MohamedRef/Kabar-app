  - id: hb.L06.076
    kind: mcq
    topic: cirrhosis-dm
    stem: A 64-year-old man with MASH cirrhosis, ascites and prior hepatic encephalopathy has HbA1c 8.6%. Which diabetes treatment fits the figure in the lecture?
    options:
      - Metformin
      - Glimepiride
      - Basal insulin with or without rapid-acting insulin
      - Pioglitazone
      - Resmetirom
    answer: 2
    why:
      - Metformin needs caution even in compensated cirrhosis; not for decompensated.
      - Sulfonylureas are for compensated cirrhosis at low doses.
      - Correct. Decompensated cirrhosis means insulin only, with close titration.
      - Thiazolidinediones are not for decompensated cirrhosis.
      - Resmetirom is not a diabetes drug and is avoided in cirrhosis.
