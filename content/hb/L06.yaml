  - { id: lifestyle, title: "Weight loss and supplements" }
  - { id: drugs, title: "Antidiabetic drugs in MASLD" }
  - { id: cirrhosis-dm, title: "Diabetes drugs in cirrhosis" }
  - { id: new-drugs, title: "Obeticholic acid and resmetirom" }
items:
  # --- Pathology and nomenclature (p97-98) ---
  - id: hb.L06.001
    kind: enumerate
    topic: nomenclature
    prompt: Mention the three pathological aspects of steatotic liver disease.
    points: [Steatosis, Inflammation, Fibrosis]
    pass: 3
    src: { page: 97 }
    status: unverified
  - id: hb.L06.002
    kind: card
    topic: nomenclature
    front: In the fibrosis stages figure, where does scar tissue first appear and how does it progress (F1 to F4)?
    back: Scar is laid down around the central veins and portal tracts, then spreads into bridges and finally nodules (F4, cirrhosis).
    src: { page: 97 }
    status: unverified
  - id: hb.L06.003
    kind: card
    topic: nomenclature
    front: What does the NAFLD spectrum figure show, from left to right?
    back: Normal liver, simple steatosis, then NASH.
    src: { page: 97 }
    status: unverified
  - id: hb.L06.004
    kind: enumerate
    topic: nomenclature
    prompt: Enumerate the five categories under the umbrella term steatotic liver disease (SLD).
    points:
      - MASLD (metabolic dysfunction-associated steatotic liver disease), with MASH as its steatohepatitis form
      - MetALD (MASLD with increased alcohol intake)
      - ALD (alcohol-associated liver disease)
      - "Specific aetiology SLD: DILI, monogenic diseases, miscellaneous"
      - Cryptogenic SLD
    pass: 4
    src: { page: 98 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.005
    kind: card
    topic: nomenclature
    front: What do NAFLD and NASH become in the new nomenclature?
    back: NAFLD becomes MASLD (metabolic dysfunction-associated steatotic liver disease); NASH becomes MASH (metabolic dysfunction-associated steatohepatitis).
    src: { page: 98 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.006
    kind: cloze
    topic: nomenclature
    text: "MetALD covers a weekly alcohol intake of about {{c1::140–350 g (women)}} or {{c2::210–420 g (men)}}; above that it is ALD."
    src: { page: 98 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L06.007
    kind: cloze
    topic: nomenclature
    text: "As an average daily intake, MetALD lies between {{c1::20–50 g (women)}} and {{c2::30–60 g (men)}} of alcohol."
    src: { page: 98 }
    status: unverified
    tags: [numbers]
  - id: hb.L06.008
    kind: card
    topic: nomenclature
    front: How many adult cardiometabolic criteria are needed to call steatosis MASLD?
    back: At least 1 of 5.
    src: { page: 98 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.009
    kind: enumerate
    topic: nomenclature
    prompt: Enumerate the 5 adult cardiometabolic criteria for MASLD (with cut-offs).
    points:
      - "BMI ≥25 kg/m² (≥23 in Asians) or waist >94 cm (men) / >80 cm (women), or ethnicity-adjusted equivalent"
      - "Fasting glucose ≥5.6 mmol/L (100 mg/dL), or 2-h post-load glucose ≥7.8 mmol/L (140 mg/dL), or HbA1c ≥5.7%, or type 2 diabetes or its treatment"
      - "Blood pressure ≥130/85 mmHg or antihypertensive drug treatment"
      - "Plasma triglycerides ≥1.70 mmol/L (150 mg/dL) or lipid-lowering treatment"
      - "HDL ≤1.0 mmol/L (40 mg/dL) in men or ≤1.3 mmol/L (50 mg/dL) in women, or lipid-lowering treatment"
    pass: 4
    src: { page: 98 }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L06.010
    kind: cloze
    topic: nomenclature
    text: "MASLD adult criterion for body size: BMI ≥{{c1::25}} kg/m² (≥{{c2::23}} in Asians), or waist circumference >{{c3::94 cm in men and 80 cm in women}}."
    src: { page: 98 }
    status: unverified
    tags: [numbers]
  - id: hb.L06.011
    kind: cloze
    topic: nomenclature
    text: "MASLD adult glycaemic criterion: fasting glucose ≥{{c1::5.6 mmol/L (100 mg/dL)}}, 2-hour glucose ≥{{c2::7.8 mmol/L (140 mg/dL)}}, or HbA1c ≥{{c3::5.7%}}."
    src: { page: 98 }
    status: unverified
    tags: [numbers]
  - id: hb.L06.012
    kind: cloze
    topic: nomenclature
    text: "MASLD adult lipid criteria: triglycerides ≥{{c1::1.70 mmol/L (150 mg/dL)}}, or HDL ≤{{c2::1.0 mmol/L (40 mg/dL)}} in men and ≤{{c3::1.3 mmol/L (50 mg/dL)}} in women."
    src: { page: 98 }
    status: unverified
    tags: [numbers]
  - id: hb.L06.013
    kind: card
    topic: nomenclature
    front: Why was steatotic liver disease adopted as the new name for NAFLD?
    back: It lets clinicians pin down the underlying cause, or mixed causes, more precisely, and it avoids stigmatization.
    src: { page: 112 }
    status: unverified

  # --- MASLD in type 2 diabetes (p99, p103) ---
  - id: hb.L06.014
    kind: card
    topic: t2dm
    front: Do normal transaminases exclude significant liver disease in type 2 diabetes?
    back: No. In diabetics biopsied at low ALT cut-offs, NASH and advanced fibrosis were still common ("do not trust liver enzymes").
    src: { page: 99 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.015
    kind: cloze
    topic: t2dm
    text: "In the biopsy study of type 2 diabetics with low liver enzymes, NASH was present in about {{c1::58%}}, and {{c2::63%}} of patients had ALT below 30 IU/L."
    src: { page: 99 }
    status: unverified
    tags: [numbers]
  - id: hb.L06.016
    kind: enumerate
    topic: t2dm
    prompt: Mention the clinical predictors of advanced fibrosis (F3–F4) in type 2 diabetics from the study on page 99.
    points:
      - GGT
      - "Waist circumference (men >102 cm, women >88 cm)"
      - "Low HDL (men <1.03, women <1.29 mmol/L)"
      - FIB-4
    pass: 3
    src: { page: 99 }
    status: unverified
  - id: hb.L06.017
    kind: card
    topic: t2dm
    front: What is the relationship between MASLD and type 2 diabetes?
    back: Strongly bidirectional. Most researchers think MASLD comes first and starts the chain that leads to T2DM; insulin resistance is the common root of both.
    src: { page: 103 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.018
    kind: card
    topic: t2dm
    front: "\"Chicken or egg\": what matters more than which of MASLD or T2DM comes first?"
    back: The right diagnosis and management at the right time.
    src: { page: 103 }
    status: unverified

  # --- Progression and metabolic links (p100) ---
  - id: hb.L06.019
    kind: cloze
    topic: progression
    text: "MASLD is the hepatic manifestation of {{c1::metabolic syndrome}}."
    src: { page: 100, quote: "MASLD is the hepatic manifestation of metabolic syndrome." }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.020
    kind: card
    topic: progression
    front: Strongest risk factors for fibrosis, cirrhosis, HCC and mortality in MASLD?
    back: Type 2 diabetes and obesity.
    src: { page: 100 }
    status: unverified
    tags: [high-yield]
  - id: hb.L06.021
    kind: order
    topic: progression
