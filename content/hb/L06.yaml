  # --- MCQs ---
  - id: hb.L06.071
    kind: mcq
    topic: nomenclature
    stem: A 46-year-old man has hepatic steatosis on ultrasound. BMI 31, BP 128/80, triglycerides 2.1 mmol/L. He drinks about 280 g of alcohol a week. No other liver disease. How is he classified?
    options:
      - MASLD
      - MetALD
      - ALD
      - Cryptogenic SLD
      - Specific aetiology SLD
    answer: 1
    why:
      - Pure MASLD has lower alcohol intake than 210 g/week in men.
      - Correct. He meets cardiometabolic criteria and drinks 210–420 g/week, so MASLD with increased alcohol intake.
      - ALD starts above about 420 g/week in men.
      - Cryptogenic SLD has no cardiometabolic criteria and no cause.
      - That group is for DILI, monogenic and other specific causes.
    src: { page: 98 }
    status: unverified
    tags: [high-yield]
