    kind: cloze
    topic: steatosis
    text: "The Fatty Liver Index (FLI) is calculated from {{c1::serum triglycerides}}, {{c2::BMI}}, {{c3::waist circumference and GGT}}."
    src: { page: 101 }
    status: unverified
  - id: hb.L06.028
    kind: card
    topic: steatosis
    front: What goes into the NAFLD Liver Score (NLS)?
    back: Presence or absence of metabolic syndrome and type 2 diabetes, fasting serum insulin, and aminotransferases.
    src: { page: 101 }
    status: unverified

  # --- Fibrosis predictors, FIB-4, FibroScan (p101-102) ---
  - id: hb.L06.029
    kind: table
    topic: fibrosis
    title: Predictors of progression to fibrosis in MASH (book table)
    columns: [Factor, Detail]
    rows:
      - ["Sex", "Men and post-menopausal women are at higher risk; estrogen inhibits stellate cell activation and fibrogenesis"]
      - ["Age", "Older age goes with more severe fibrosis"]
      - ["Diabetes", "Onset of diabetes parallels fibrosis progression"]
      - ["BMI", "A rise or fall in BMI goes with progression or resolution of fibrosis"]
      - ["Inflammation", "Degree of inflammation is linked to progression to advanced fibrosis"]
      - ["AST/ALT ratio", "Normal ratio is <1"]
      - ["Hepatic iron / hemochromatosis", "Iron in hepatocytes is linked to mild NAFLD"]
