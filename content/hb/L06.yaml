  - id: hb.L06.077
    kind: mcq
    topic: new-drugs
    stem: A 52-year-old woman has MASH with F3 fibrosis, no cirrhosis. Which drug did the FDA approve on 14 March 2024 for her stage?
    options:
      - Obeticholic acid
      - Resmetirom
      - Vitamin E
      - Metformin
      - Linagliptin
    answer: 1
    why:
      - The FDA rejected obeticholic acid twice for NASH.
      - Correct. Resmetirom, a THR-beta agonist, is approved for F2–F3 with diet and exercise.
      - Vitamin E is a recommendation, not an FDA-approved MASH drug.
