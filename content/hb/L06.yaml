    topic: lifestyle
    stem: A 40-year-old non-diabetic man has biopsy-proven NASH with F2 fibrosis and no cirrhosis. Which supplement does the lecture recommend for him?
    options:
      - Vitamin E
      - Vitamin D for all NASH patients
      - Carnitine
