  - id: hb.L06.022
    kind: card
    topic: progression
    front: In the MASLD progression figure, which cell activation drives MASH to fibrosis?
    back: Activation of hepatic stellate cells.
    src: { page: 100 }
    status: unverified
  - id: hb.L06.023
    kind: card
    topic: progression
    front: Three drivers of steatosis shown in the MASLD progression figure?
    back: Obesity, insulin resistance and increased free fatty acids.
    src: { page: 100 }
    status: unverified
  - id: hb.L06.024
    kind: card
    topic: progression
    front: Two extrahepatic outcomes linked to MASH in the progression figure?
    back: Type 2 diabetes and cardiovascular disease.
    src: { page: 100 }
