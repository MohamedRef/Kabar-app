  - id: hb.L06.078
    kind: mcq
    topic: fibrosis
    stem: A 61-year-old man with MASLD has AST 60, ALT 40, platelets 120. Calculate FIB-4 and place him in the page 102 bands.
    options:
      - About 0.9, low risk
      - About 2.0, intermediate risk
      - About 4.8, high risk
      - About 7.5, high risk
      - Cannot be calculated without age-adjusted cut-offs
    answer: 2
    why:
      - Too low; recompute (61 × 60) / (120 × 6.3).
      - Too low.
      - Correct. 3660 / 759 ≈ 4.8, above 3.25, high risk.
      - Too high.
      - FIB-4 only needs age, AST, ALT and platelets.
