    status: unverified
    tags: [numbers]
  - id: hb.L06.079
    kind: mcq
    topic: fibrosis
    stem: Which factor in the book's table is linked to a lower risk of fibrosis progression in MASH?
    options:
      - Male sex
      - Older age
      - Pre-menopausal female sex
      - New-onset diabetes
      - PNPLA3 polymorphism
    answer: 2
    why:
      - Men are at higher risk.
      - Older age goes with more severe fibrosis.
      - Correct. Estrogen inhibits stellate cell activation, so pre-menopausal women are at lower risk.
