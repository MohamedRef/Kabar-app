- id: hb.L11.065
  kind: essay
  topic: indications
  prompt: Mention the indications for liver transplantation.
  outline:
  - Timing and evaluation triggers:
    - Evaluate at first decompensation, CTP ≥ 7 or MELD ≥ 10 (AASLD)
    - Transplant when the risk of dying from liver disease exceeds surgical risk
  - ESLD with CTP class C (10–15):
    - Recurrent HE; portal hypertension (bleeding varices, intractable ascites)
    - Hyperbilirubinemia; synthetic failure (rising PT, falling albumin); poor quality of life
  - Program rules and MELD exceptions:
    - MELD ≥ 15 transplanted; < 15 if refractory ascites or repeated HE; > 30 case by case
    - Exception points for HCC, HPS, portopulmonary HTN, recurrent cholangitis, Budd-Chiari and others
  - Disease groups:
    - HCC within Milan/San Francisco, no spread, no macrovascular invasion, AFP < 400
    - Cholestatic (PBC, PSC); metabolic (HHC, A1AT, Wilson, tyrosinemia, CF); hepatoblastoma, carcinoid; cryptogenic,
      polycystic, Budd-Chiari, amyloidosis
  - Pediatric:
    - EHBA (50–60%), FIHC, Alagille, Budd-Chiari, AIH, rarely viral
    - 'Metabolic: A1AT, tyrosinemia, hyperoxaluria, amyloidosis'
  src:
    page: 189
  status: unverified
  tags:
  - book-question
- id: hb.L11.066
  kind: essay
  topic: contraindications
  prompt: Enumerate the contraindications for liver transplantation.
  outline:
  - Exclusion criteria:
    - Age > 70 (physiological age case by case); active sepsis; advanced cardiopulmonary disease
    - HIV (ELISA and PCR twice); alcohol or substance abuse in the last 6 months
    - HCC beyond criteria; cholangiocarcinoma; extensive splanchnic (SMV) venous occlusion
  - High-risk factors (case by case):
    - Active variceal bleeding, renal failure/HRS, multiple hepatobiliary operations
    - Severe malnutrition, diabetes, previous or simultaneous organ transplant, portal vein thrombosis
  src:
    page: 191
  status: unverified
  tags:
  - book-question
- id: hb.L11.067
  kind: essay
  topic: evaluation
  prompt: Mention the recipient criteria required for liver transplantation.
  outline:
  - Recipient criteria for LDLT:
    - No extrahepatic malignancy
    - No percutaneous stents in place
    - No previous portocaval shunt (mesocaval is the only exception)
  - Initial assessment:
    - Confirm the cause of the chronic liver disease
    - Calculate Child-Pugh and MELD; update MELD monthly (< 18), 2-weekly (18–25), weekly (> 25)
  - Treat the underlying disease:
    - HBV antivirals for life plus HBIg; HHC phlebotomy; PBC UDCA 13–15 mg/kg; screen PSC for cholangiocarcinoma
  src:
    page: 192
  status: unverified
