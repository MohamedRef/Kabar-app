- id: hb.L11.062
  kind: case
  topic: indications
  stem: A 48-year-old man with HBV cirrhosis is seen in clinic. He had one variceal bleed a year ago, now has tense
    ascites needing large-volume paracentesis every 2 weeks despite diuretics, bilirubin 2.4 mg/dL, INR 1.4, creatinine
    1.1 mg/dL. HBV DNA is detectable on lamivudine.
  steps:
  - reveal: His Child-Pugh score is 9 (class B) and his MELD is 14.
    question: Is he a candidate for LDLT under the book's program rules?
    options:
    - No, Child B is never transplanted
    - Yes, refractory ascites allows LT below MELD 15
    - No, MELD is below 15
    - Only if he develops HCC
    answer: 1
    why: Patients with MELD < 15 are transplanted if they have refractory ascites or repeated HE.
  - reveal: He is listed. His MELD rises to 19.
    question: How often should his MELD be updated now?
    options:
    - Monthly
    - Every 3 months
    - Weekly
    - Every 2 weeks
    answer: 3
    why: MELD 18–25 is updated every 2 weeks.
  - reveal: Pre-transplant work-up continues.
    question: What should be done with his antiviral?
    options:
    - Switch to entecavir 1 mg daily, continued for life
    - Add interferon
    - Keep lamivudine
    - Stop until after LT
    answer: 0
    why: On lamivudine with positive HBV DNA, switch to entecavir; nucleos(t)ides continue for life.
  - reveal: He receives the graft.
    question: What HBIg dose is given intraoperatively?
    options:
    - None
    - 2000 IU IM
    - 10 000 IU IV
    - 4000 IU IM
    answer: 3
    why: 4000 IU IM intraoperatively, then 2000 IU daily for a week until anti-HBs > 300–500.
  src:
    page: 192
  status: unverified
