- id: hb.L11.001
  kind: cloze
  topic: timing
  text: In cirrhosis, the onset of decompensation drops median survival from more than {{c1::12 years}} to about
    {{c2::2 years}}.
  src:
    page: 188
    quote: decreased median survival from greater than 12 years to 2 years
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L11.002
  kind: enumerate
  topic: timing
  prompt: According to the AASLD (as quoted in the book), when should a cirrhotic patient be evaluated for liver
    transplantation? Mention the 3 triggers.
  points:
  - First decompensation
  - CTP (Child-Turcotte-Pugh) score ≥ 7
  - MELD score ≥ 10
  pass: 3
  src:
    page: 188
    quote: develops a decompensation, reaches a CTP score of ≥ 7, or reaches a MELD score of ≥ 10
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L11.003
  kind: card
  topic: timing
  front: What 3 lab values make up the MELD score?
  back: Serum bilirubin, INR and serum creatinine.
  src:
    page: 188
  status: unverified
  update:
    text: US allocation moved to MELD-Na (2016) and then MELD 3.0 (2023), which add sodium, albumin and female sex.
    ref: OPTN/UNOS MELD 3.0 policy, 2023
  tags:
  - high-yield
- id: hb.L11.004
  kind: card
  topic: timing
  front: What was the MELD score originally developed for, and by whom?
  back: To predict survival after TIPS placement in cirrhosis. It was developed at the Mayo Clinic (Rochester, Minnesota).
  src:
    page: 188
  status: unverified
- id: hb.L11.005
  kind: cloze
  topic: timing
  text: MELD was adopted to prioritize end-stage liver disease patients for organ allocation in {{c1::February 2002}}.
  src:
    page: 188
  status: unverified
  tags:
  - numbers
- id: hb.L11.006
  kind: card
  topic: timing
  front: What is the ideal timing of liver transplantation?
  back: When the risk of dying from the liver disease becomes greater than the risk of dying from the operation.
  src:
    page: 188
  status: unverified
  tags:
  - high-yield
- id: hb.L11.007
  kind: card
  topic: timing
  front: What does the MELD score measure, in one phrase?
  back: The "sickness of the liver", a calculated number that predicts short-term mortality and sets priority on
    the waiting list.
  src:
    page: 188
  status: unverified
- id: hb.L11.008
  kind: enumerate
  topic: indications
  prompt: Mention the indications for LDLT in end-stage liver disease with CTP class C (10–15).
  points:
  - Recurrent hepatic encephalopathy
  - 'Portal hypertension: bleeding varices and/or intractable ascites'
  - Hyperbilirubinemia
  - 'Synthetic dysfunction: rising PT and/or falling albumin'
  - 'Unacceptable quality of life: weakness, malaise, cholestasis, itching'
  pass: 4
  src:
    page: 189
  status: unverified
  tags:
  - high-yield
- id: hb.L11.009
  kind: cloze
  topic: indications
  text: 'Listing policy in the book: Child B patients with CPS > 7 are {{c1::listed but not transplanted}} unless
    they become {{c2::Child C}} or reach MELD {{c3::15}}.'
  src:
    page: 189
  status: unverified
  tags:
  - numbers
- id: hb.L11.010
  kind: cloze
  topic: indications
  text: The program transplants patients with MELD {{c1::15 or higher}}; patients with MELD {{c2::> 30}} are discussed
    case by case.
  src:
    page: 189
    quote: We transplant patients with MELD 15 or higher
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L11.011
  kind: card
  topic: indications
  front: Which patients with MELD < 15 are still transplanted?
  back: Those with refractory ascites or repeated hepatic encephalopathy.
  src:
    page: 189
  status: unverified
  tags:
  - high-yield
- id: hb.L11.012
  kind: enumerate
  topic: indications
  prompt: Enumerate the other (non-HCC) diseases treatable by liver transplantation, by group.
  points:
  - 'Cholestatic: PBC, PSC'
  - 'Metabolic: hemochromatosis, alpha-1 antitrypsin deficiency, Wilson disease, tyrosinemia, cystic fibrosis'
  - 'Hepatic malignancy other than HCC: hepatoblastoma, hepatic carcinoid (within criteria, no extrahepatic spread
    or vascular invasion)'
  - 'Miscellaneous: cryptogenic cirrhosis, polycystic liver disease, Budd-Chiari syndrome, amyloidosis'
  pass: 3
  src:
    page: 190
  status: unverified
- id: hb.L11.013
  kind: cloze
  topic: indications
  text: 'Metabolic diseases treatable by LT (adult list): {{c1::hemochromatosis}}, {{c2::alpha-1 antitrypsin deficiency}},
    {{c3::Wilson disease}}, tyrosinemia and cystic fibrosis.'
  src:
    page: 190
  status: unverified
- id: hb.L11.014
  kind: card
  topic: indications
  front: Which non-HCC hepatic malignancies can be treated by LT, and on what condition?
  back: Hepatoblastoma and hepatic carcinoid, if within accepted criteria with no extrahepatic spread and no vascular
    invasion.
  src:
    page: 190
  status: unverified
- id: hb.L11.015
  kind: enumerate
  topic: meld-exceptions
  prompt: Enumerate the conditions for which MELD exception points may be allocated (10 in the book).
  points:
  - HCC
  - Hepatopulmonary syndrome
  - Portopulmonary hypertension
  - Recurrent cholangitis
  - Budd-Chiari syndrome
  - Intractable pruritus
  - Cystic fibrosis
  - Familial amyloidosis
  - Polycystic liver disease
  - Small-for-size syndrome
  pass: 6
  src:
    page: 189
  status: unverified
  tags:
  - high-yield
- id: hb.L11.016
  kind: card
  topic: meld-exceptions
  front: Why do some patients get MELD exception points?
  back: Their real risk (for example HCC progression, hepatopulmonary syndrome, portopulmonary hypertension) is
    not captured by bilirubin, INR and creatinine, so the calculated MELD understates their priority.
  src:
    page: 189
  status: unverified
- id: hb.L11.017
  kind: cloze
  topic: meld-exceptions
  text: 'Cardiopulmonary MELD exceptions: {{c1::hepatopulmonary syndrome}} and {{c2::portopulmonary hypertension}}.'
  src:
    page: 189
  status: unverified
- id: hb.L11.018
  kind: enumerate
  topic: hcc
  prompt: Mention the conditions an HCC patient must meet to be accepted for LDLT.
  points:
  - Within accepted criteria (Milan and San Francisco criteria)
  - No extrahepatic spread, with normal CT chest and bone scan
  - No macrovascular invasion on a dedicated radiological work-up
  - AFP < 400 ng/mL
  pass: 4
  src:
    page: 190
  status: unverified
  tags:
  - high-yield
- id: hb.L11.019
  kind: cloze
  topic: hcc
  text: For LT in HCC, the AFP must be below {{c1::400 ng/mL}}.
  src:
    page: 190
    quote: AFP < 400 ng/ml
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L11.020
  kind: card
  topic: hcc
  front: How are HCC patients managed while waiting for a donor?
  back: With locoregional bridging therapy, if possible, until a donor becomes available.
  src:
    page: 190
  status: unverified
- id: hb.L11.021
  kind: card
  topic: hcc
  front: Which 2 imaging tests exclude extrahepatic spread of HCC before LT?
  back: CT chest and bone scan (both must be normal).
  src:
    page: 190
  status: unverified
- id: hb.L11.022
  kind: cloze
  topic: pediatric
  text: The commonest pediatric indication for LDLT is {{c1::extrahepatic biliary atresia (EHBA)}}, in {{c2::50–60%}}
    of cases.
  src:
    page: 190
    quote: EHBA 50-60% of cases
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L11.023
  kind: enumerate
  topic: pediatric
  prompt: Enumerate the pediatric indications for LDLT.
  points:
  - Extrahepatic biliary atresia (50–60%)
  - Familial intrahepatic cholestasis (FIHC)
  - Alagille syndrome
  - Budd-Chiari syndrome
  - Autoimmune hepatitis
  - Rarely, viral hepatitis leading to ESLD
  - 'Metabolic: alpha-1 antitrypsin deficiency, tyrosinemia, hyperoxaluria, amyloidosis'
  pass: 5
  src:
    page: 190
  status: unverified
- id: hb.L11.024
  kind: cloze
  topic: pediatric
  text: 'Pediatric metabolic indications for LDLT: alpha-1 antitrypsin deficiency, {{c1::tyrosinemia}}, {{c2::hyperoxaluria}}
    and amyloidosis.'
  src:
    page: 191
  status: unverified
- id: hb.L11.025
  kind: enumerate
  topic: contraindications
  prompt: Enumerate the contraindications (exclusion criteria) for LDLT.
  points:
  - Age > 70 years (physiological age judged case by case)
  - Active uncontrolled systemic infection or sepsis
  - Advanced cardiac or pulmonary disease
  - HIV (confirmed twice by ELISA and PCR)
  - Active alcoholism or substance abuse in the last 6 months
  - HCC beyond acceptable criteria
  - Cholangiocarcinoma
  - Total or extensive occlusion of the splanchnic venous inflow (SMV)
  pass: 6
  src:
    page: 191
  status: unverified
  tags:
  - high-yield
  - book-question
- id: hb.L11.026
  kind: cloze
  topic: contraindications
  text: Active alcoholism or substance abuse within the last {{c1::6 months}} excludes LDLT.
  src:
    page: 191
  status: unverified
  tags:
  - numbers
- id: hb.L11.027
  kind: card
  topic: contraindications
  front: How must HIV be confirmed before it counts as an exclusion for LDLT?
  back: By ELISA and PCR, twice.
  src:
    page: 191
  status: unverified
- id: hb.L11.028
  kind: card
  topic: contraindications
  front: Which vascular finding is an absolute exclusion for LDLT, and which is only a high-risk factor?
  back: 'Exclusion: total or extensive occlusion of the splanchnic venous inflow (SMV). High-risk only: portal vein
    thrombosis.'
  src:
    page: 191
  status: unverified
  tags:
  - high-yield
- id: hb.L11.029
  kind: enumerate
  topic: contraindications
  prompt: Enumerate the high-risk factors for LT that are judged case by case and do not necessarily preclude transplant.
  points:
  - Active variceal hemorrhage
  - Renal failure / HRS
  - Multiple previous hepatobiliary operations
  - Severe malnutrition / cachexia
  - Diabetes mellitus
  - Previous organ transplant
  - Need for simultaneous organ transplant (e.g. liver-kidney)
  - Portal vein thrombosis
  pass: 5
  src:
    page: 191
  status: unverified
- id: hb.L11.030
  kind: card
  topic: contraindications
  front: L01 and L11 list LT contraindications slightly differently. What are the differences?
  back: L11 (p.191) lists age > 70 as an exclusion (physiological age case by case); L01 (p.18) calls age > 70 relative.
    L01 also names morbid obesity, poor patient understanding and all malignancy except small HCC; L11 names HIV,
    cholangiocarcinoma and splanchnic venous occlusion. Both exclude sepsis and advanced cardiopulmonary disease.
    Quote the lecture you are asked about.
  src:
    page: 191
  status: unverified
