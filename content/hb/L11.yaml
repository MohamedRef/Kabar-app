  tags:
  - numbers
- id: hb.L11.032
  kind: enumerate
  topic: evaluation
  prompt: Mention the recipient criteria for living donor liver transplantation.
  points:
  - No evidence of extrahepatic malignancy
  - No percutaneous stents in place
  - No previous portocaval shunt (a mesocaval shunt is the only exception)
  pass: 3
  src:
    page: 192
  status: unverified
  tags:
  - high-yield
  - book-question
- id: hb.L11.033
  kind: card
  topic: evaluation
  front: Which previous shunt is still acceptable in an LDLT recipient?
  back: A mesocaval shunt. Any other portocaval shunt excludes the recipient.
  src:
    page: 192
  status: unverified
- id: hb.L11.034
  kind: card
  topic: evaluation
  front: What does the initial assessment of an LT candidate set out to do?
  back: Confirm the cause of the chronic liver disease and calculate the Child-Pugh and MELD scores.
  src:
    page: 192
  status: unverified
- id: hb.L11.035
  kind: card
  topic: hbv
  front: In HBV cirrhosis awaiting LT, when should antiviral therapy be considered?
  back: When HBV is replicating (HBV DNA positive).
  src:
    page: 192
  status: unverified
- id: hb.L11.036
  kind: card
  topic: hbv
  front: A candidate has been on lamivudine. What do you do before LT?
  back: Keep lamivudine if HBV DNA is negative; switch to entecavir 1 mg daily if HBV DNA is positive.
  src:
    page: 192
  status: unverified
  tags:
  - high-yield
- id: hb.L11.037
  kind: card
  topic: hbv
  front: How long is nucleos(t)ide analogue therapy continued in an HBV transplant recipient?
  back: For life, before and after LT.
  src:
    page: 192
  status: unverified
- id: hb.L11.038
  kind: cloze
  topic: hbv
  text: 'HBIg protocol: {{c1::4000 IU IM}} intraoperatively, then {{c2::2000 IU daily}} for one week until anti-HBs
    is {{c3::> 300–500}}.'
  src:
    page: 192
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L11.039
  kind: cloze
  topic: hbv
  text: After the first week, HBIg 2000 IU is given {{c1::weekly}} for the first month, then {{c2::monthly}} to
    keep anti-HBs around {{c3::300}} for one year.
  src:
    page: 192
  status: unverified
  tags:
  - numbers
- id: hb.L11.040
  kind: card
  topic: hbv
  front: When is HBIg stopped after LT?
  back: When HBsAg turns negative.
  src:
    page: 192
  status: unverified
- id: hb.L11.041
  kind: card
  topic: hbv
  front: When does the program accept an anti-HBc (HBcIgG) positive donor?
  back: When the recipient is also anti-HBc positive and accepts lifelong prophylaxis. All donors should be vaccinated.
  src:
    page: 193
  status: unverified
- id: hb.L11.042
  kind: card
  topic: underlying
  front: AASLD advice for hereditary hemochromatosis with iron overload?
  back: Regular phlebotomy until iron stores are depleted, then lifelong maintenance phlebotomy, with frequency
    guided by serum ferritin.
  src:
    page: 193
  status: unverified
- id: hb.L11.043
  kind: cloze
  topic: underlying
  text: The recommended UDCA dose in PBC is {{c1::13–15 mg/kg/day}}, as a single or divided dose.
  src:
    page: 193
    quote: 13 to 15 mg/kg in a divided or single dose
  status: unverified
  tags:
  - numbers
  - high-yield
  update:
    text: PBC is now called primary biliary cholangitis (renamed 2015).
    ref: EASL CPG PBC 2017
- id: hb.L11.044
  kind: card
  topic: underlying
  front: What does UDCA do, and not do, in PBC?
  back: It markedly improves cholestatic biochemistry and slows progression, but it does not resolve the disease.
  src:
    page: 193
  status: unverified
- id: hb.L11.045
  kind: card
  topic: underlying
  front: Which PBC patients should be considered for specific therapy?
  back: All PBC patients with abnormal liver enzymes.
  src:
    page: 193
  status: unverified
- id: hb.L11.046
  kind: card
  topic: underlying
  front: What is the most common known predisposing factor for cholangiocarcinoma?
  back: Primary sclerosing cholangitis, with or without ulcerative colitis. PSC patients should be screened regularly.
  src:
    page: 193
  status: unverified
  tags:
  - high-yield
- id: hb.L11.047
  kind: cloze
  topic: underlying
  text: CA 19-9 is raised in up to {{c1::85%}} of cholangiocarcinomas. In PSC, a value {{c2::> 100 U/mL}} has sensitivity
    {{c3::75%}} and specificity 80%.
  src:
    page: 193
  status: unverified
  tags:
  - numbers
  - high-yield
- id: hb.L11.048
  kind: enumerate
  topic: underlying
  prompt: When may immunosuppression NOT be indicated in autoimmune hepatitis?
  points:
  - Inactive cirrhosis
  - Pre-existing comorbid conditions
  - Drug intolerance
  pass: 3
  src:
    page: 194
  status: unverified
- id: hb.L11.049
  kind: cloze
  topic: underlying
  text: 'AASLD AIH regimens in the book: prednisone {{c1::10 mg/day}} plus {{c2::azathioprine}}, or prednisone {{c3::20
    mg/day}} alone.'
  src:
    page: 194
    quote: prednisone (10 mg/day) in combination with azathioprine or higher dose prednisone (20 mg/day) alone
  status: unverified
  tags:
  - numbers
- id: hb.L11.050
  kind: card
  topic: underlying
  front: In AIH with toxicity to prednisone or azathioprine, which drugs have been used successfully in isolated
    cases?
  back: Cyclosporine, 6-mercaptopurine, cyclophosphamide and mycophenolate mofetil.
  src:
    page: 194
  status: unverified
- id: hb.L11.051
  kind: mcq
  topic: timing
  stem: A 52-year-old man with HCV cirrhosis has had no ascites, bleeding or encephalopathy. His labs give CTP 6
    and MELD 11. By the AASLD triggers quoted in the book, should he be evaluated for transplantation?
  options:
  - No, MELD must reach 15 before evaluation
  - No, because his CTP score is below 7
  - Yes, because his MELD is ≥ 10
  - Yes, but only if he also has HCC
  - No, he must first decompensate
  answer: 2
  why:
  - MELD 15 is the program's threshold to transplant, not to evaluate.
  - The triggers are alternatives; MELD ≥ 10 alone qualifies.
  - Correct. Any one trigger (decompensation, CTP ≥ 7 or MELD ≥ 10) is enough for evaluation.
  - HCC is a reason for exception points, not a condition for evaluation.
  - Decompensation is one trigger, not a requirement.
  src:
    page: 188
  status: unverified
- id: hb.L11.052
  kind: mcq
  topic: indications
  stem: A 45-year-old woman with cirrhosis has Child-Pugh B (8) and MELD 13, but has had three admissions with overt
    hepatic encephalopathy in four months despite lactulose and rifaximin. What does the book's program do?
  options:
  - List her and wait until she becomes Child C
  - Refer for TIPS instead
  - Transplant her, because repeated HE allows LT below MELD 15
  - Decline, as Child B patients are never transplanted
  - Wait until MELD exceeds 30
  answer: 2
  why:
  - That is the rule for Child B without refractory ascites or repeated HE.
  - TIPS would worsen her encephalopathy and is not the book's answer.
  - Correct. Refractory ascites or repeated HE justify LT even with MELD < 15.
  - Child B patients are listed, and transplanted when an exception applies.
  - MELD > 30 is the case-by-case group, not a threshold to wait for.
  src:
    page: 189
  status: unverified
- id: hb.L11.053
  kind: mcq
  topic: hcc
  stem: A 60-year-old with HBV cirrhosis has a 4 cm HCC within Milan criteria, normal CT chest and bone scan, and
    no vascular invasion. His AFP is 620 ng/mL. What prevents LDLT by the book's criteria?
  options:
  - HBV aetiology
  - The need for bridging therapy
  - The tumour size
  - AFP above 400 ng/mL
  - His age
  answer: 3
  why:
  - HBV cirrhosis is treated with antivirals and HBIg, not excluded.
  - Bridging therapy is an option while waiting, not a barrier.
  - A single 4 cm lesion is within Milan criteria.
  - Correct. The book requires AFP < 400 ng/mL.
  - Age 60 is below the 70-year limit.
  src:
    page: 190
  status: unverified
- id: hb.L11.054
  kind: mcq
  topic: contraindications
  stem: Which of the following is an exclusion criterion for LDLT rather than a high-risk factor judged case by
    case?
  options:
  - Cholangiocarcinoma
  - Previous organ transplant
  - Diabetes mellitus
  - Hepatorenal syndrome
  - Portal vein thrombosis
  answer: 0
  why:
  - Correct. Cholangiocarcinoma is on the exclusion list.
  - A previous transplant is a high-risk factor.
  - Diabetes is a high-risk factor.
  - Renal failure/HRS is a high-risk factor.
  - Portal vein thrombosis is a high-risk factor; only extensive splanchnic (SMV) occlusion excludes.
  src:
    page: 191
  status: unverified
  tags:
  - high-yield
- id: hb.L11.055
  kind: mcq
  topic: contraindications
  stem: A 50-year-old man with alcohol-related cirrhosis, MELD 22, stopped drinking 3 months ago. Echo and lungs
    are normal. What is the main barrier to LDLT now?
  options:
  - Alcoholic aetiology itself
  - Nothing; he should be transplanted now
  - He needs a mesocaval shunt first
  - MELD above 18
  - Alcohol use within the last 6 months
  answer: 4
  why:
  - Alcohol-related cirrhosis is transplantable after the abstinence period.
  - He has not yet reached 6 months of abstinence.
  - Shunts are not required; a mesocaval shunt is only tolerated if present.
  - MELD 22 is above the transplant threshold of 15, so it supports LT.
  - Correct. Active alcohol or substance abuse in the last 6 months is an exclusion.
  src:
    page: 191
  status: unverified
- id: hb.L11.056
  kind: mcq
  topic: evaluation
  stem: A listed patient's MELD rises from 16 to 21. How often should his MELD now be updated?
  options:
  - Every 3 months
  - Weekly
  - Monthly
  - Daily
  - Every 2 weeks
  answer: 4
  why:
  - The book gives no 3-month interval.
  - Weekly is for MELD > 25.
  - Monthly is for MELD < 18.
  - The book gives no daily interval.
  - Correct. MELD 18–25 is updated every 2 weeks.
  src:
    page: 192
  status: unverified
  tags:
  - numbers
- id: hb.L11.057
  kind: mcq
  topic: evaluation
  stem: Which previous procedure is still acceptable in a candidate for living donor LT?
  options:
  - Portocaval shunt
  - Splenorenal shunt
  - Resected colon cancer with liver metastasis
  - Percutaneous biliary stent left in place
  - Mesocaval shunt
  answer: 4
  why:
  - A previous portocaval shunt excludes the recipient.
  - The book allows no portocaval shunt other than mesocaval.
  - There must be no extrahepatic malignancy.
  - No percutaneous stents may be in place.
  - Correct. A mesocaval shunt is the only exception.
  src:
    page: 192
  status: unverified
- id: hb.L11.058
  kind: mcq
  topic: hbv
  stem: A man with HBV cirrhosis has taken lamivudine for 4 years and now has detectable HBV DNA. He is being prepared
    for LT. What antiviral plan does the book give?
  options:
  - Switch to entecavir 1 mg daily
  - Switch to interferon
  - Stop antivirals and rely on HBIg after LT
  - Continue lamivudine until after LT
  - Continue lamivudine and add HBIg now
  answer: 0
  why:
  - Correct. HBV DNA positive on lamivudine means switch to entecavir 1 mg daily.
  - Interferon is not part of this protocol and is unsafe in decompensated cirrhosis.
  - Antivirals are continued for life, before and after LT.
  - Lamivudine is kept only if HBV DNA is negative.
  - HBIg is given intra- and postoperatively; a viraemic patient on lamivudine needs a switch.
  src:
    page: 192
  status: unverified
- id: hb.L11.059
  kind: mcq
  topic: pediatric
  stem: What is the most common indication for living donor liver transplantation in children?
  options:
  - Viral hepatitis
  - Alagille syndrome
  - Autoimmune hepatitis
  - Tyrosinemia
  - Extrahepatic biliary atresia
  answer: 4
  why:
  - The book says viral hepatitis is a rare indication in children.
  - Alagille is an indication, but much less common.
  - AIH is an indication, but less common.
  - Tyrosinemia is a rarer metabolic indication.
  - Correct. EHBA accounts for 50–60% of cases.
  src:
    page: 190
  status: unverified
- id: hb.L11.060
  kind: mcq
  topic: underlying
  stem: A 38-year-old man with PSC and ulcerative colitis has new jaundice. His CA 19-9 is 140 U/mL. What is the
    best interpretation from the book?
  options:
  - Diagnostic of cholangiocarcinoma
  - Raises suspicion of cholangiocarcinoma, with sensitivity about 75% and specificity about 80% at this cut-off
  - Proof of benign dominant stricture
  - Irrelevant, because CA 19-9 is not raised in cholangiocarcinoma
  - Only meaningful above 1000 U/mL
  answer: 1
  why:
  - Specificity is only 80%, so it is not diagnostic; early diagnosis stays difficult.
  - Correct. Above 100 U/mL in PSC, sensitivity is 75% and specificity 80%.
  - A raised marker cannot prove a benign cause.
  - CA 19-9 is raised in up to 85% of cholangiocarcinomas.
  - The book's cut-off is 100 U/mL.
