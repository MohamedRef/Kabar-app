  kind: enumerate
  topic: risk-factors
  prompt: Enumerate the strong risk factors for cholangiocarcinoma.
  points:
  - Age >50
  - Cholangitis
  - Choledocholithiasis
  - Cholecystolithiasis
  - Other structural biliary disorders
  - Ulcerative colitis
  - PSC
  - Non-specific cirrhosis
  - Alcoholic liver disease
  - Liver fluke infection
  - Chronic typhoid carrier
  - HCV
  - HIV
  - HBV
  - Thorium dioxide exposure
  pass: 8
