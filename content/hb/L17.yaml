    page: 318
  status: unverified
- id: hb.L17.003
  kind: card
  topic: epidemiology
  front: What is a Klatskin tumour?
  back: A perihilar cholangiocarcinoma involving the bifurcation of the bile ducts.
  src:
    page: 318
  status: unverified
