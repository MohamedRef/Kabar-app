  kind: cloze
  topic: clinical
  text: The commonest presentation of cholangiocarcinoma is {{c1::painless jaundice}} ({{c2::90%}}).
  src:
    page: 323
  status: unverified
- id: hb.L17.037
  kind: cloze
  topic: clinical
  text: 'One study: {{c1::28%}} of intrahepatic and {{c2::4%}} of extrahepatic cholangiocarcinomas presented incidentally.'
  src:
    page: 324
    quote: 28% of intrahepatic cholangiocarcinomas, and 4% of extrahepatic cholangiocarcinomas, presented incidentally
  status: unverified
- id: hb.L17.038
  kind: card
  topic: clinical
  front: How may intrahepatic cholangiocarcinoma be found without symptoms?
  back: Incidentally, during surveillance imaging of a cirrhotic liver.
  src:
    page: 324
  status: unverified
- id: hb.L17.039
  kind: card
  topic: clinical
  front: What do symptoms usually imply about stage in cholangiocarcinoma?
  back: More advanced disease.
  src:
    page: 324
  status: unverified
- id: hb.L17.040
  kind: card
  topic: clinical
  front: Two main determinants of the clinical presentation of cholangiocarcinoma?
  back: Tumour location, and whether obstructive jaundice is present.
  src:
    page: 325
  status: unverified
- id: hb.L17.041
  kind: card
  topic: clinical
  front: How do early, non-obstructing cholangiocarcinomas present?
  back: Vague abdominal pain and abnormal LFTs.
  src:
    page: 325
  status: unverified
- id: hb.L17.042
  kind: card
  topic: clinical
  front: What is Courvoisier's sign, and in which cholangiocarcinoma is it seen?
  back: A distended palpable, painless gallbladder with obstructive jaundice, in advanced distal extrahepatic cholangiocarcinoma.
  src:
    page: 325
  status: unverified
  tags:
  - high-yield
- id: hb.L17.043
  kind: mcq
  topic: clinical
  stem: A 68-year-old man has 3 weeks of painless deepening jaundice, pruritus, dark urine and pale stools. Exam
    shows a non-tender palpable gallbladder. Which cholangiocarcinoma site best fits?
  options:
  - Intrahepatic
  - Perihilar type 4
  - Distal extrahepatic
  - Gallbladder fundus
  - Bismuth type 1 intrahepatic
  answer: 2
  why:
  - iCCA usually presents as a mass, often without jaundice.
  - A hilar tumour obstructs above the cystic duct, so the gallbladder is not distended.
  - 'Correct: Courvoisier''s sign (painless palpable gallbladder with jaundice) points to distal extrahepatic obstruction.'
  - Not a cholangiocarcinoma site in this classification.
  - Bismuth applies to perihilar tumours, not intrahepatic.
  src:
    page: 325
  status: unverified
- id: hb.L17.044
  kind: enumerate
  topic: labs
  prompt: Lab tests in suspected cholangiocarcinoma?
  points:
  - Conjugated bilirubin
  - ALP
  - GGT
  - ALT/AST
  - Prothrombin time
  - CA 19-9
  - CEA
  - CA-125
  pass: 5
  src:
    page: 325
  status: unverified
- id: hb.L17.045
  kind: card
  topic: labs
  front: Aminotransferases in cholangiocarcinoma?
  back: Usually only minimally raised; high levels are more frequent in intrahepatic CCA with direct liver invasion.
  src:
    page: 325
  status: unverified
- id: hb.L17.046
  kind: cloze
  topic: labs
  text: CA 19-9 is raised in up to {{c1::85%}} of cholangiocarcinomas; CA-125 in up to {{c2::65%}}.
