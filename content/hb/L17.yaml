- id: hb.L17.011
  kind: card
  topic: pathology
  front: Why are small biopsies often non-diagnostic in cholangiocarcinoma?
  back: The tumour causes a desmoplastic reaction, so neoplastic cellularity is low.
  src:
    page: 319
  status: unverified
