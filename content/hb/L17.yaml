  status: unverified
- id: hb.L17.015
  kind: card
  topic: risk-factors
  front: Common thread linking cholangiocarcinoma risk factors?
  back: Chronic biliary inflammation (infection, inflammation and cancer are closely linked).
  src:
    page: 320
  status: unverified
