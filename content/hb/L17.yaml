  status: unverified
- id: hb.L17.024
  kind: card
  topic: risk-factors
  front: Proposed mechanism by which liver flukes cause cholangiocarcinoma?
  back: Host immune activation and a chronic inflammatory state start epithelial transformation.
  src:
    page: 322
  status: unverified
- id: hb.L17.025
  kind: card
  topic: risk-factors
  front: How does HIV contribute to biliary cancer risk?
  back: HIV-related cholangitis is common, directly or via opportunistic infections such as CMV.
  src:
    page: 322
  status: unverified
- id: hb.L17.026
  kind: enumerate
  topic: risk-factors
  prompt: Weak risk factors for cholangiocarcinoma?
  points:
  - Diabetes
  - Cigarette smoking
  - 'Toxins / drugs: polychlorinated biphenyls, isoniazid, oral contraceptives'
  - Male sex
  pass: 3
  src:
    page: 322
  status: unverified
- id: hb.L17.027
  kind: mcq
  topic: risk-factors
  stem: A 38-year-old man with ulcerative colitis has a raised ALP. MRCP shows multifocal stricturing and beading
    of large intra- and extrahepatic ducts. How should he be screened for cholangiocarcinoma per AASLD?
  options:
  - No surveillance
  - Annual surveillance
  - Surveillance every 5 years
  - ERCP brushing every 3 months
  - Only CA 19-9 once
  answer: 1
  why:
  - Large-duct PSC needs surveillance.
  - 'Correct: AASLD advises annual surveillance in adults with PSC (not small-duct).'
  - Too infrequent per AASLD.
  - Not the book's recommendation.
  - A single marker is not surveillance.
  src:
    page: 321
  status: unverified
- id: hb.L17.028
  kind: mcq
  topic: risk-factors
  stem: Which of the following is a WEAK, not strong, risk factor for cholangiocarcinoma in the book?
  options:
  - Choledochal cyst
  - Isoniazid exposure
  - Chronic typhoid carriage
  - HBV infection
  - Liver fluke infection
  answer: 1
  why:
  - Structural biliary disorders are strong risk factors.
  - 'Correct: drugs and toxins such as isoniazid are weak risk factors.'
  - Chronic typhoid carriage is a strong risk factor.
  - HBV is on the strong list.
  - Liver flukes are strong risk factors.
  src:
    page: 322
  status: unverified
- id: hb.L17.029
  kind: card
  topic: classification
  front: International Liver Cancer Association sub-classification of cholangiocarcinoma?
  back: Intrahepatic (iCCA, within the liver parenchyma), perihilar (pCCA), and distal (dCCA).
  src:
    page: 322
  status: unverified
  tags:
  - high-yield
- id: hb.L17.030
  kind: card
  topic: classification
  front: Which edition of AJCC TNM is used for cholangiocarcinoma in the book, and what does it assess?
  back: '8th edition: tumour size and extent (T), regional nodes (N), distant metastasis (M); grade and biomarkers
    may supplement.'
  src:
    page: 323
  status: unverified
- id: hb.L17.031
  kind: card
  topic: classification
  front: Why perform staging laparoscopy in potentially resectable cholangiocarcinoma?
  back: To detect peritoneal or superficial liver metastases.
  src:
    page: 323
  status: unverified
- id: hb.L17.032
  kind: table
  topic: classification
  title: Bismuth-Corlette classification of perihilar cholangiocarcinoma
  columns:
  - Type
  - Extent
  rows:
  - - '1'
    - Below the confluence of the right and left ducts
  - - '2'
    - Reaches the confluence, sparing right and left hepatic ducts
  - - 3a
    - Occludes the common hepatic duct and the right hepatic duct
  - - 3b
    - Occludes the common hepatic duct and the left hepatic duct
  - - '4'
    - Multicentric, or involves the confluence and both right and left ducts
  blanks:
  - [0, 1]
  - [1, 1]
  - [2, 1]
  - [3, 1]
  - [4, 1]
  src:
    page: 323
  status: unverified
  tags:
  - high-yield
- id: hb.L17.033
  kind: mcq
  topic: classification
  stem: ERCP and MRCP show a perihilar tumour occluding the common hepatic duct and extending into the left hepatic
    duct, sparing the right. Bismuth-Corlette type?
  options:
  - Type 1
  - Type 2
  - Type 3a
  - Type 3b
  - Type 4
  answer: 3
  why:
  - Type 1 lies below the confluence.
  - Type 2 reaches the confluence but spares both hepatic ducts.
  - 3a involves the right hepatic duct.
  - 'Correct: CHD plus the left hepatic duct is 3b.'
  - Type 4 involves both hepatic ducts or is multicentric.
  src:
    page: 323
  status: unverified
- id: hb.L17.034
  kind: mcq
  topic: classification
  stem: A hilar tumour involves the confluence and both the right and left hepatic ducts. Bismuth-Corlette type?
  options:
  - Type 2
  - Type 3a
  - Type 3b
  - Type 4
  - Type 1
  answer: 3
  why:
  - Type 2 spares both hepatic ducts.
  - 3a is right-sided only.
  - 3b is left-sided only.
  - 'Correct: confluence plus both ducts (or multicentric) is type 4.'
  - Type 1 is below the confluence.
  src:
    page: 323
  status: unverified
