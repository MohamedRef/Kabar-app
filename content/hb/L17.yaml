    page: 325
  status: unverified
- id: hb.L17.047
  kind: enumerate
  topic: labs
  prompt: Non-cholangiocarcinoma causes of a raised CA 19-9?
  points:
  - Pancreatic malignancy
  - Gastric malignancy
  - Severe hepatic injury of any cause
  - Benign obstructive jaundice
  pass: 3
  src:
    page: 325
  status: unverified
- id: hb.L17.048
  kind: card
  topic: labs
  front: What does a CA 19-9 that stays high after biliary decompression suggest?
  back: Malignancy.
  src:
    page: 325
  status: unverified
  tags:
  - high-yield
- id: hb.L17.049
  kind: cloze
  topic: labs
  text: A CA 19-9 above {{c1::1000 U/mL}} may indicate {{c2::metastatic disease}}.
  src:
    page: 326
  status: unverified
- id: hb.L17.050
  kind: cloze
  topic: labs
  text: In PSC with suspected cholangiocarcinoma, CA 19-9 >{{c1::100 U/mL}} has sensitivity {{c2::75%}} and specificity
    {{c3::80%}}.
  src:
    page: 326
    quote: a value of >100 units/mL has a sensitivity of 75% and specificity of 80%
  status: unverified
  tags:
  - numbers
- id: hb.L17.051
  kind: card
  topic: labs
  front: Other causes of a raised CEA?
  back: Inflammatory bowel disease, other tumours, and severe liver injury.
  src:
    page: 326
  status: unverified
- id: hb.L17.052
  kind: mcq
  topic: labs
  stem: A 55-year-old woman with obstructive jaundice from a distal biliary stricture has CA 19-9 of 600 U/mL. After
    successful stenting, bilirubin normalises but CA 19-9 stays at 580 U/mL. Best interpretation?
  options:
  - Benign obstruction confirmed
  - Persistently high CA 19-9 after decompression suggests malignancy
  - CA 19-9 is diagnostic of metastases
  - The test is invalid in women
  - Repeat in a year
  answer: 1
  why:
  - Benign obstruction can raise CA 19-9, but it should fall after drainage.
  - 'Correct: levels that stay high after biliary decompression suggest malignancy.'
  - Metastases are suggested at >1000 U/mL.
  - No such sex limitation.
  - Delay is inappropriate.
  src:
    page: 325
  status: unverified
- id: hb.L17.053
  kind: enumerate
  topic: imaging
  prompt: Imaging tests for cholangiocarcinoma?
  points:
  - Abdominal ultrasound
  - CT
  - MRI
  - EUS
  - MR angiography
  - ERCP
  - MRCP
  - PTC
  - PET
  pass: 6
  src:
    page: 326
  status: unverified
- id: hb.L17.054
  kind: cloze
  topic: imaging
  text: Abdominal ultrasound separates malignant from benign biliary lesions with sensitivity {{c1::92%}} and specificity
    {{c2::93%}}.
  src:
    page: 326
    quote: a sensitivity of 92% and a specificity of 93%
  status: unverified
- id: hb.L17.055
  kind: card
  topic: imaging
  front: Ultrasound clue to cholangiocarcinoma?
  back: Dilated intrahepatic ducts; intrahepatic CCA may appear as a mass.
  src:
    page: 326
  status: unverified
- id: hb.L17.056
  kind: card
  topic: imaging
  front: Why is CT or MRI essential in cholangiocarcinoma?
  back: To assess the primary mass, metastases, vascular invasion and resectability.
  src:
    page: 327
  status: unverified
- id: hb.L17.057
  kind: cloze
  topic: imaging
  text: CT identifies the primary lesion in about {{c1::59%}} of cholangiocarcinomas.
  src:
    page: 327
    quote: CT identifies a primary lesion in approximately 59% of patients
  status: unverified
- id: hb.L17.058
  kind: card
  topic: imaging
  front: CT appearance of mass-forming intrahepatic cholangiocarcinoma?
  back: Low attenuation before contrast, minor heterogeneous peripheral enhancement with gradual centripetal fill-in
    (depending on central fibrosis), capsular retraction, possible calcification, and dilated ducts beyond the mass.
  src:
    page: 327
  status: unverified
  tags:
  - high-yield
- id: hb.L17.059
  kind: card
  topic: imaging
  front: How does a periductal-infiltrating cholangiocarcinoma look on CT, and how does it differ from a benign
    stricture?
  back: Duct wall or periductal thickening with a narrowed, enhancing duct, commonest at the hilum, with upstream
    dilatation; it is longer than a benign stricture (about 20 mm).
  src:
    page: 327
  status: unverified
- id: hb.L17.060
  kind: card
  topic: imaging
  front: CT appearance of intraductal cholangiocarcinoma?
  back: Altered duct calibre, usually ectasia, with or without a polypoid mass that is hypoattenuating and enhances.
  src:
    page: 327
  status: unverified
- id: hb.L17.061
  kind: card
  topic: imaging
  front: Imaging modality of choice for cholangiocarcinoma?
  back: MRI (with performance comparable to CT).
  src:
    page: 327
  status: unverified
  tags:
  - high-yield
- id: hb.L17.062
  kind: card
  topic: imaging
  front: What extra information does MRI give in cholangiocarcinoma?
  back: Solid vs cystic content, tumour size, duct extent, vascular patency, extrahepatic extension, nodal or distant
    metastases, and lobar atrophy.
  src:
    page: 328
  status: unverified
- id: hb.L17.063
  kind: card
  topic: imaging
  front: MRI signal of cholangiocarcinoma?
  back: Hypointense on T1 and hyperintense on T2.
  src:
    page: 328
  status: unverified
- id: hb.L17.064
  kind: card
  topic: imaging
  front: Which DWI appearance favours cholangiocarcinoma over HCC?
  back: A peripherally hyperintense 'target' appearance.
  src:
    page: 328
  status: unverified
  tags:
  - high-yield
- id: hb.L17.065
  kind: card
  topic: imaging
  front: What can EUS add in cholangiocarcinoma?
  back: Views of the extrahepatic duct and fine-needle aspiration of the mass and nodes.
  src:
    page: 328
  status: unverified
- id: hb.L17.066
  kind: card
  topic: imaging
  front: Which patients should NOT have EUS-guided or percutaneous biopsy, and why?
  back: Perihilar cholangiocarcinoma patients who may be transplant candidates, because of the risk of tumour dissemination.
  src:
    page: 328
  status: unverified
  tags:
  - high-yield
- id: hb.L17.067
  kind: card
  topic: imaging
  front: Role of MR angiography in cholangiocarcinoma?
  back: Non-invasive pre-operative staging that helps determine resectability.
  src:
    page: 328
  status: unverified
- id: hb.L17.068
  kind: cloze
  topic: imaging
  text: ERCP gives a tissue diagnosis in {{c1::40% to 70%}} and shows a {{c2::filling defect or narrowing}}.
  src:
    page: 328
    quote: Tissue diagnosis in 40% to 70%
  status: unverified
- id: hb.L17.069
  kind: card
  topic: imaging
  front: 'MRCP: main advantage and main disadvantage?'
  back: Non-invasive, without the risks of ERCP or PTC, with sensitivity comparable to PTC; but it is diagnostic
    only, with no therapy.
  src:
    page: 329
  status: unverified
- id: hb.L17.070
  kind: card
  topic: imaging
  front: When is PTC used, and how sensitive is it?
  back: When the tumour completely obstructs the biliary tree and ERCP cannot see proximal to it; sensitivity up
    to 92%.
  src:
    page: 329
  status: unverified
- id: hb.L17.071
  kind: card
