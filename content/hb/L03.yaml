items:
  # --- Overview (p37) ---
  - id: hb.L03.001
    kind: card
    topic: overview
    front: Most common complication of cirrhosis, and main driver of hepatic decompensation?
    back: Portal hypertension.
    src: { page: 37, quote: "most common complication of cirrhosis and represents the main driver of hepatic decompensation" }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.002
    kind: card
    topic: overview
    front: Overarching goal of portal hypertension treatment in compensated cirrhosis?
    back: To reduce the risk of hepatic decompensation (ascites, variceal bleeding and/or hepatic encephalopathy).
    src: { page: 37 }
    status: unverified
  - id: hb.L03.003
    kind: enumerate
    topic: overview
    prompt: In decompensated cirrhosis, PH-directed therapy aims to avoid further decompensation. Mention the further decompensating events it aims to prevent.
    points:
      - Recurrent or refractory ascites
      - Variceal rebleeding
      - Recurrent encephalopathy
      - Spontaneous bacterial peritonitis
      - Hepatorenal syndrome
    pass: 4
    src: { page: 37 }
    status: unverified
  - id: hb.L03.004
    kind: cloze
    topic: overview
    text: About {{c1::30%}} of cirrhotics have esophageal varices at diagnosis, rising to {{c2::90%}} after about {{c3::ten years}}.
    src: { page: 37 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L03.005
    kind: cloze
    topic: overview
    text: "Three findings that predict the presence of varices in cirrhotics: INR {{c1::>1.5}}, portal vein diameter {{c2::>13 mm}}, and {{c3::thrombocytopenia}}."
    src: { page: 37 }
    status: unverified
    tags: [numbers]

  # --- Definition and classification (p38-39) ---
  - id: hb.L03.006
    kind: cloze
    topic: classification
    text: The book's definition figure shows portal hypertension as a portal-to-hepatic venous pressure gradient (ΔP) {{c1::> 10 mmHg}}.
    src: { page: 38 }
    status: unverified
    tags: [numbers]
    update:
      text: Baveno VII defines portal hypertension as HVPG > 5 mmHg (normal 1–5) and clinically significant portal hypertension (CSPH) as HVPG ≥ 10 mmHg. The book's >10 mmHg figure matches CSPH.
      ref: "Baveno VII consensus, 2021"
  - id: hb.L03.007
    kind: table
    topic: classification
    title: Classification of portal hypertension
    columns: [Site, Causes]
    rows:
      - [Pre-hepatic, "Portal vein thrombosis; splenic vein thrombosis; massive splenomegaly"]
      - ["Hepatic, pre-sinusoidal", "Schistosomiasis; congenital hepatic fibrosis"]
      - ["Hepatic, sinusoidal", "Cirrhosis; alcoholic hepatitis"]
      - ["Hepatic, post-sinusoidal", "Hepatic sinusoidal obstruction"]
      - [Post-hepatic, "Budd-Chiari syndrome; IVC webs; cardiac causes (restrictive cardiomyopathy, constrictive pericarditis, severe CHF)"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 38 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.008
    kind: cloze
    topic: classification
    text: "Pre-sinusoidal intrahepatic causes of portal hypertension: {{c1::schistosomiasis}} and {{c2::congenital hepatic fibrosis}}."
    src: { page: 38 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.009
    kind: card
    topic: classification
    front: Three pre-hepatic causes of portal hypertension?
    back: Portal vein thrombosis, splenic vein thrombosis, massive splenomegaly.
    src: { page: 38 }
    status: unverified
  - id: hb.L03.010
    kind: enumerate
    topic: classification
    prompt: Enumerate the post-hepatic causes of portal hypertension.
    points:
      - Budd-Chiari syndrome
      - Inferior vena caval webs
      - Restrictive cardiomyopathy
      - Constrictive pericarditis
      - Severe congestive heart failure
    pass: 4
    src: { page: 39 }
    status: unverified
  - id: hb.L03.011
    kind: card
    topic: classification
    front: Where does cirrhosis sit in the classification of portal hypertension?
    back: Hepatic, sinusoidal (together with alcoholic hepatitis).
    src: { page: 38 }
    status: unverified

  # --- Pathophysiology (p39-42) ---
  - id: hb.L03.012
    kind: cloze
    topic: pathophysiology
    text: "Portal pressure follows Ohm's law: P = {{c1::R × F}} (resistance × flow)."
    src: { page: 39 }
    status: unverified
  - id: hb.L03.013
    kind: card
    topic: pathophysiology
    front: Two haemodynamic factors that combine to cause portal hypertension?
    back: Increased resistance to portal flow (mechanical and dynamic) and increased portal venous inflow (splanchnic vasodilatation).
    src: { page: 39 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.014
    kind: card
    topic: pathophysiology
    front: How does the normal liver respond to large changes in portal blood flow?
    back: It accommodates them without appreciable change in portal pressure.
    src: { page: 39 }
    status: unverified
  - id: hb.L03.015
    kind: table
    topic: pathophysiology
    title: Components of increased intrahepatic resistance in cirrhosis
    columns: [Component, Mechanism, Share, "Drug-modifiable?"]
    rows:
      - ["Architectural (mechanical, fixed)", "Distortion of vascular architecture by fibrosis, scarring, regenerative nodules; thrombosis", "~70%", "No"]
      - ["Functional (dynamic)", "Active contraction of hepatic stellate cells, portal venule smooth muscle, myofibroblasts", "~30%", "Yes"]
    blanks: [[0, 2], [1, 1], [1, 2], [1, 3]]
    src: { page: 40 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L03.016
    kind: cloze
    topic: pathophysiology
    text: Of the increased intrahepatic resistance in cirrhosis, about {{c1::70%}} is fixed (architectural) and about {{c2::30%}} is dynamic (modifiable by drugs).
    src: { page: 40 }
    status: unverified
    tags: [numbers]
  - id: hb.L03.017
    kind: card
    topic: pathophysiology
    front: Which cells actively contract to produce the dynamic component of intrahepatic resistance?
    back: Hepatic stellate cells, vascular smooth muscle cells of the portal venules, and myofibroblasts.
    src: { page: 40 }
    status: unverified
  - id: hb.L03.018
    kind: card
    topic: pathophysiology
    front: Intrahepatic vasoconstrictors that raise intrahepatic resistance in cirrhosis (book figure)?
    back: Endothelin, angiotensin, norepinephrine, vasopressin, leukotrienes, thromboxane.
    src: { page: 40 }
    status: unverified
  - id: hb.L03.019
    kind: card
    topic: pathophysiology
    front: Two vasodilators on the dilator side of the book's vasodilator/vasoconstrictor balance figure?
    back: Nitric oxide (NO) and carbon monoxide (CO). In cirrhosis the balance tips toward the vasoconstrictors, raising intrahepatic resistance.
    src: { page: 40 }
    status: unverified
  - id: hb.L03.020
    kind: enumerate
    topic: pathophysiology
    prompt: Mention the vasodilators increased in the splanchnic circulation in cirrhosis.
    points:
      - Glucagon
      - Endocannabinoids
      - Nitric oxide
      - Prostacyclin
      - Carbon monoxide
    pass: 4
    src: { page: 41 }
    status: unverified
  - id: hb.L03.021
    kind: card
    topic: pathophysiology
    front: Besides vasodilators, what second process drives splanchnic hyperaemia and new collaterals in cirrhosis?
    back: Increased angiogenesis (angiogenic factors such as VEGF), forming new vessels that feed varices.
    src: { page: 41 }
    status: unverified
  - id: hb.L03.022
    kind: card
    topic: pathophysiology
    front: What does portal pressure correlate with in chronic hepatitis?
    back: The severity of fibrosis.
    src: { page: 41 }
    status: unverified
  - id: hb.L03.023
    kind: order
    topic: pathophysiology
    prompt: Put in order the chain from splanchnic vasodilatation to sodium retention and the hyperdynamic state (Garcia-Tsao and Bosch figure).
    steps:
      - Decreased splanchnic and systemic arteriolar resistance
      - Decreased effective arterial blood volume
      - Activation of neurohumoral systems (RAAS, etc.)
      - Sodium and water retention
      - Hyperdynamic circulatory state, which further increases portal inflow
    src: { page: 42 }
    status: unverified
  - id: hb.L03.024
    kind: enumerate
    topic: pathophysiology
    prompt: Mention the three clinical consequences of increased portal pressure shown in the book figure.
    points:
      - Varices and variceal hemorrhage
      - Ascites
      - Encephalopathy
    pass: 3
    src: { page: 42 }
    status: unverified

  # --- CSPH and natural history (p43-44) ---
  - id: hb.L03.025
    kind: cloze
    topic: csph
    text: Clinically significant portal hypertension (CSPH) is defined as an HVPG {{c1::> 10 mmHg}}.
    src: { page: 43, quote: "Defined as an HVPG >10 mmHg" }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: Baveno VII defines CSPH as HVPG ≥ 10 mmHg.
      ref: "Baveno VII consensus, 2021"
  - id: hb.L03.026
    kind: card
    topic: csph
    front: Three outcomes that CSPH predicts?
    back: Development of varices, clinical decompensation, and HCC.
    src: { page: 43 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.027
    kind: card
    topic: csph
    front: Two liver biopsy findings that independently predict CSPH in cirrhosis?
    back: Thick fibrous septae and small nodule size.
    src: { page: 43 }
    status: unverified
  - id: hb.L03.028
    kind: cloze
    topic: csph
    text: Varices form when HVPG exceeds {{c1::10 mmHg}}; variceal rupture occurs when HVPG exceeds {{c2::12 mmHg}}.
    src: { page: 43 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L03.029
    kind: card
    topic: csph
    front: When should cirrhotic patients be screened for varices (book)?
    back: All cirrhotic patients should be screened for varices at diagnosis.
    src: { page: 44, quote: "All cirrhotic patients should be screened for varices at diagnosis" }
    status: unverified
    update:
      text: Baveno VI/VII allow skipping screening endoscopy when liver stiffness is < 20 kPa and platelets are > 150,000/µL (repeat these tests yearly).
      ref: "Baveno VII consensus, 2021"
  - id: hb.L03.030
    kind: table
    topic: csph
    title: Natural history of esophageal varices (book figure)
    columns: [Stage, Figure]
    rows:
      - ["Cirrhotics without varices", "~50%"]
      - ["New varices form (no varices → varices)", "4–5% per year"]
      - ["Small → large varices", "12% per year"]
      - ["Bleeding risk, small varices", "<10% at 2 years"]
      - ["Bleeding risk, large varices", ">25% at 2 years"]
      - ["Rebleeding after a first bleed", "63% at 2 years"]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 44 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L03.031
    kind: cloze
    topic: csph
    text: Without prevention, the risk of variceal rebleeding after a first bleed is about {{c1::63%}} at 2 years.
    src: { page: 44 }
    status: unverified
    tags: [numbers]
  - id: hb.L03.032
    kind: cloze
    topic: csph
    text: Bleeding risk at 2 years is {{c1::<10%}} for small varices and {{c2::>25%}} for large varices.
    src: { page: 44 }
    status: unverified
    tags: [numbers]
  - id: hb.L03.033
    kind: order
    topic: csph
    prompt: Order the stages of the natural history of varices and the matching level of prevention.
    steps:
      - "No varices: pre-primary prophylaxis (preventing variceal formation)"
      - "Small varices: preventing variceal growth"
      - "Large varices: primary prophylaxis (preventing first bleeding)"
      - "Variceal bleeding: treating acute bleeding"
      - "After the bleed: secondary prophylaxis (preventing rebleeding)"
    src: { page: 44 }
    status: unverified

  # --- PHG (p44-45) ---
  - id: hb.L03.034
    kind: card
    topic: phg
    front: How is portal hypertensive gastropathy (PHG) diagnosed?
    back: Endoscopically.
    src: { page: 45, quote: "The diagnosis of PHG is made endoscopically" }
    status: unverified

  # --- Pre-primary and primary prophylaxis (p45-48) ---
  - id: hb.L03.035
    kind: enumerate
    topic: primary-prophylaxis
    prompt: "Cirrhosis with no varices: what does the book recommend (Conclusion I)?"
    points:
      - No specific pre-primary prophylaxis
      - Treat the underlying liver disease
      - Follow-up endoscopy after 2–3 years
    pass: 3
    src: { page: 45 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.036
    kind: card
    topic: primary-prophylaxis
    front: Can beta-blockers be recommended to prevent the formation of varices?
    back: No. Beta-blockers cannot be recommended to prevent the formation of varices.
    src: { page: 46, quote: "Beta-blockers cannot be recommended to prevent the formation of varices." }
    status: unverified
    tags: [high-yield]
    update:
      text: Baveno VII recommends NSBBs (carvedilol preferred) in compensated cirrhosis with CSPH to prevent decompensation, whether or not varices are present. They are still not given just to stop varices forming in patients without CSPH.
      ref: "Baveno VII consensus, 2021"
  - id: hb.L03.037
    kind: card
    topic: primary-prophylaxis
    front: Which patients with small varices could be treated (book)?
    back: Especially those with red colour signs and/or Child C class.
    src: { page: 45 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.038
    kind: card
    topic: primary-prophylaxis
    front: First-choice primary prophylaxis for moderate or large varices, and the alternative?
    back: Beta-blockers. EBL is offered to those with contraindications or intolerance to beta-blockers.
    src: { page: 45 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.039
    kind: card
    topic: primary-prophylaxis
    front: "Baveno IV (2005): EBL vs non-selective beta-blockers for preventing the first variceal bleed?"
    back: EBL is more effective at preventing the first bleed but does not improve survival; its long-term benefit is uncertain because follow-up was short.
    src: { page: 46 }
    status: unverified
  - id: hb.L03.040
    kind: table
    topic: primary-prophylaxis
    title: Rational basis for treating portal hypertension (P = R × F)
    columns: [Target, Drug or procedure]
    rows:
      - ["Increased hepatic resistance (mechanical/dynamic)", "Vasodilators (nitrates); TIPS"]
      - ["Increased splanchnic blood flow", "Vasoconstrictors: beta-blockers, terlipressin, somatostatin"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 46 }
    status: unverified
  - id: hb.L03.041
    kind: enumerate
    topic: primary-prophylaxis
    prompt: Medium or large varices with contraindications or side-effects of beta-blockers. Mention the options the book lists as assessed.
    points:
      - No treatment
      - Long-acting nitrates
      - Endoscopic band ligation
    pass: 2
    src: { page: 47 }
    status: unverified
  - id: hb.L03.042
    kind: card
    topic: primary-prophylaxis
    front: Carvedilol vs propranolol for HVPG reduction?
    back: Carvedilol lowers HVPG significantly more, and many propranolol non-responders achieve a haemodynamic response on carvedilol.
    src: { page: 47 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.043
    kind: card
    topic: primary-prophylaxis
    front: What extra property of carvedilol explains its greater HVPG effect?
    back: Additional α1-adrenergic blockade, which lowers intrahepatic resistance on top of the beta-blocker fall in portal inflow.
    src: { page: 47 }
    status: unverified
  - id: hb.L03.044
    kind: cloze
    topic: primary-prophylaxis
    text: A haemodynamic response to beta-blockers is an HVPG reduction of {{c1::≥ 20%}} or to {{c2::< 12 mmHg}}.
    src: { page: 47 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L03.045
    kind: card
    topic: primary-prophylaxis
    front: Outcomes improved by achieving a haemodynamic response on carvedilol?
    back: Fewer variceal bleeds, less hepatic decompensation, and lower mortality.
    src: { page: 47 }
    status: unverified
  - id: hb.L03.046
    kind: cloze
    topic: primary-prophylaxis
    text: The target dose of carvedilol to treat portal hypertension is {{c1::12.5 mg/day}}.
    src: { page: 48, quote: "The target dose of carvedilol to treat PH should be 12.5 mg/day." }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L03.047
    kind: card
    topic: primary-prophylaxis
    front: Is carvedilol safe in decompensated cirrhosis with ascites?
    back: Yes, it is not harmful and may improve survival, provided systemic haemodynamics and renal function are not impaired. Maintained arterial blood pressure is the safety surrogate.
    src: { page: 48 }
    status: unverified

  # --- Acute variceal bleeding (p48-50) ---
  - id: hb.L03.048
    kind: card
    topic: acute-bleeding
    front: First measures in acute variceal haemorrhage?
    back: General resuscitation, by securing the airway and stabilising the circulation.
    src: { page: 48 }
    status: unverified
  - id: hb.L03.049
    kind: cloze
    topic: acute-bleeding
    text: Vasoactive drugs (octreotide or terlipressin) stop variceal bleeding, at least temporarily, in up to {{c1::80%}}; endoscopic sclerotherapy or ligation stops it in up to {{c2::90%}}.
    src: { page: 48 }
    status: unverified
    tags: [numbers]
  - id: hb.L03.050
    kind: card
    topic: acute-bleeding
    front: What kinds of drug are octreotide and terlipressin?
    back: Octreotide is a synthetic somatostatin analogue; terlipressin is a synthetic vasopressin analogue.
    src: { page: 48 }
    status: unverified
  - id: hb.L03.051
    kind: card
    topic: acute-bleeding
    front: How does somatostatin lower portal pressure, and how does it compare with octreotide?
    back: It inhibits release of vasodilator hormones, causing splanchnic vasoconstriction and less portal inflow. It may be superior to octreotide; both are safe with very few side effects.
    src: { page: 48 }
    status: unverified
  - id: hb.L03.052
    kind: cloze
    topic: acute-bleeding
    text: Combining octreotide (or terlipressin) for {{c1::3–5 days}} with endoscopic therapy reduces early rebleeding and transfusion needs compared with either alone.
    src: { page: 48 }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: Baveno VII advises continuing the vasoactive drug for 2–5 days. The book's own algorithm on p54 also says 2–5 days.
      ref: "Baveno VII consensus, 2021"
  - id: hb.L03.053
    kind: cloze
    topic: acute-bleeding
    text: In acute variceal bleeding, replace volume carefully, aiming for Hb between {{c1::7 and 9 g/dL}}.
    src: { page: 48 }
    status: unverified
    tags: [numbers, high-yield]
    update:
      text: Baveno VII uses a restrictive strategy, transfusing at Hb about 7 g/dL with a target of 7–8 g/dL.
      ref: "Baveno VII consensus, 2021"
  - id: hb.L03.054
    kind: card
    topic: acute-bleeding
    front: Why avoid over-transfusion in variceal bleeding (rat model evidence)?
    back: Transfusion raised portal pressure, blood loss and mortality.
    src: { page: 48 }
    status: unverified
  - id: hb.L03.055
    kind: card
    topic: acute-bleeding
    front: Is variceal bleeding caused by haemostatic failure?
    back: No. It is attributable to portal hypertension and local vascular abnormalities, not haemostatic failure.
    src: { page: 49 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.056
    kind: card
    topic: acute-bleeding
    front: Effect of FFP transfusion in acute variceal bleeding?
    back: It is ineffective and harmful, linked to more failure to control bleeding at 5 days and higher mortality at 42 days.
    src: { page: 49 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.057
    kind: enumerate
    topic: acute-bleeding
    prompt: Mention the adverse events of FFP or platelet transfusion in acute variceal bleeding.
    points:
      - Infection
      - Transfusion-related acute lung injury (TRALI)
      - Transfusion-associated circulatory overload (TACO)
    pass: 3
    src: { page: 49 }
    status: unverified
  - id: hb.L03.058
    kind: card
    topic: acute-bleeding
    front: Main complication associated with variceal haemorrhage, and its standard prevention?
    back: Bacterial infection. Short-term antibiotic prophylaxis lowers infections and increases survival; it is standard of care.
    src: { page: 49 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.059
    kind: card
    topic: acute-bleeding
    front: Preferred antibiotic in variceal bleeding with advanced liver disease and haemodynamic instability?
    back: Intravenous ceftriaxone.
    src: { page: 50 }
    status: unverified
  - id: hb.L03.060
    kind: order
    topic: acute-bleeding
    prompt: Put the management of acute variceal bleeding in order (book algorithm).
    steps:
      - "General management: airway, antibiotics, careful volume replacement; start a vasoactive drug early (terlipressin, somatostatin, or octreotide/vapreotide)"
      - Endoscopy with EBL or sclerotherapy, keeping the drug for 2–5 days
      - "If bleeding is not controlled or recurs early: a second course of endoscopic therapy"
      - "If that fails or rebleeding recurs: rescue covered TIPS (balloon tamponade or stent as bridge)"
    src: { page: 54 }
    status: unverified
    tags: [high-yield]

  # --- Endoscopic therapy and gastric varices (p50-53) ---
  - id: hb.L03.061
    kind: cloze
    topic: endoscopy
    text: Endoscopic band ligation should be done within the first {{c1::12 hours}} (preferably the first {{c2::6 hours}}) after stabilising the patient.
    src: { page: 52 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L03.062
    kind: cloze
    topic: endoscopy
    text: EBL controls bleeding in {{c1::90%}}, with a rebleeding rate of {{c2::15–20%}}.
    src: { page: 52 }
    status: unverified
    tags: [numbers]
  - id: hb.L03.063
    kind: enumerate
    topic: endoscopy
    prompt: Mention the advantages of band ligation over sclerotherapy.
    points:
      - Less rebleeding
      - Lower mortality
      - Fewer complications
      - Fewer treatment sessions
    pass: 3
    src: { page: 52 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.064
    kind: card
    topic: endoscopy
    front: Common local findings after sclerotherapy?
    back: Ulcers, erosions and adhesions.
    src: { page: 50 }
    status: unverified
  - id: hb.L03.065
    kind: card
    topic: endoscopy
    front: What is seen at banding sites about seven days after band ligation?
    back: Ulceration at the banding sites.
    src: { page: 51 }
    status: unverified
  - id: hb.L03.066
    kind: cloze
    topic: endoscopy
    text: Gastric varices are present in {{c1::5–30%}} of cirrhotics and cause {{c2::10–15%}} of variceal bleeding episodes.
    src: { page: 52 }
    status: unverified
    tags: [numbers]
  - id: hb.L03.067
    kind: card
    topic: endoscopy
    front: Risk factors for gastric variceal bleeding?
    back: Size, Child class, and presence of red spots.
    src: { page: 52 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.068
    kind: card
    topic: endoscopy
    front: Standard endoscopic therapy for gastric varices?
    back: Cyanoacrylate injection.
    src: { page: 52 }
    status: unverified
    tags: [high-yield]
  - id: hb.L03.069
    kind: table
    topic: endoscopy
    title: Cyanoacrylate for gastric varices
    columns: [Pros, Cons]
    rows:
      - ["Effective; most studied", "High risk of complications, local and systemic (embolic)"]
      - ["Standard first line in many centres", "High rebleeding rate"]
      - ["May avoid further interventions; cost-effective", "Cumbersome; can damage the scope; not approved in the USA and other countries"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 53 }
    status: unverified
  - id: hb.L03.070
    kind: card
