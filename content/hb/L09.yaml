  topic: treatment
  prompt: General measures in cirrhotic ascites (5).
  points:
  - Protein intake 1.2–1.5 g/kg
  - Stop alcohol
  - Avoid ACE inhibitors, ARBs and NSAIDs
  - Stop beta blockers only with low arterial pressure and renal dysfunction
  - Avoid aminoglycosides for bacterial infections whenever possible
