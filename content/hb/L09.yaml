- id: hb.L09.073
  kind: mcq
  topic: treatment
  stem: A 58-year-old with Child B cirrhosis has new grade 2 ascites. Creatinine 0.9 mg/dL, Na 136, K 4.2. What
    is the best initial diuretic regimen by the sequential method?
  options:
  - Furosemide 40 mg/day alone
  - Spironolactone 100 mg/day
  - Spironolactone 400 mg/day plus furosemide 160 mg/day
  - Spironolactone 100 mg plus furosemide 40 mg from day 1, as in grade 3
  - Large-volume paracentesis with albumin
  answer: 1
  why:
  - Furosemide monotherapy is less effective and not recommended.
  - 'Correct: start spironolactone 100 mg/day and raise it every 72 h (max 400).'
  - These are maximum doses, not starting doses.
  - The combined 100:40 start is for grade 3 or recurrent ascites.
  - LVP is for grade 3 (tense) ascites.
  src:
    page: 153
  status: unverified
  tags:
  - high-yield
- id: hb.L09.074
  kind: mcq
  topic: treatment
  stem: A cirrhotic patient with ascites and no leg edema has been on spironolactone 200 mg/day for 5 days. Which
    finding shows the diuresis is adequate and safe?
  options:
  - Weight loss of 1.5 kg/day
  - Spot urine Na/K ratio of 0.6
  - Weight loss of 400 g/day with a spot urine Na/K ratio of 1.8
  - Urinary sodium excretion of 40 mmol/day
  - Serum sodium falling to 123 mmol/L
  answer: 2
  why:
  - Without edema, weight loss should not exceed 500 g/day.
  - A Na/K ratio >1 is needed.
  - 'Correct: ≤500 g/day without edema and Na/K >1 mean proper diuresis.'
  - Proper diuresis needs >78 mmol/day.
  - Na <125 mmol/L is a diuretic complication.
  src:
    page: 153
  status: unverified
- id: hb.L09.075
  kind: mcq
  topic: treatment
  stem: A patient with tense ascites has 8 L removed by paracentesis. What should be given and how much?
  options:
  - Nothing, if the blood pressure is normal
  - Normal saline 1 L per 2 L removed
  - Albumin 6–8 g per liter removed (about 48–64 g)
  - Albumin 1.5 g/kg on day 1 and 1 g/kg on day 3
  - Terlipressin 1 mg every 6 hours
  answer: 2
  why:
  - Albumin is recommended for every LVP over 5 L to prevent circulatory dysfunction.
  - The lecture uses albumin and advises caution with saline in ascites.
  - 'Correct: 6–8 g of albumin per liter removed for LVP >5 L.'
  - This is the SBP albumin regimen.
  - Vasoconstrictors are for HRS-AKI, not routine after LVP.
  src:
    page: 154
  status: unverified
  tags:
  - high-yield
- id: hb.L09.076
  kind: mcq
  topic: treatment
  stem: A patient with cirrhotic ascites asks which drug is safe for knee pain and for his blood pressure. Which
    is acceptable per the lecture?
  options:
  - Ibuprofen
  - Lisinopril
  - Losartan
  - Paracetamol in usual doses
  - Gentamicin for a UTI
  answer: 3
  why:
  - NSAIDs must be avoided in ascites.
  - ACE inhibitors must be avoided.
  - ARBs must be avoided.
  - 'Correct: not on the lecture''s avoid list (ACEi, ARBs, NSAIDs, aminoglycosides).'
  - Aminoglycosides should be avoided whenever possible.
  src:
    page: 152
  status: unverified
- id: hb.L09.077
  kind: mcq
  topic: treatment
  stem: A cirrhotic with ascites has serum sodium 122 mmol/L, no neurological symptoms, and is clinically hypervolemic.
    Best next step?
  options:
  - 3% hypertonic saline to raise Na by 12 mmol/L today
  - Fluid restriction to 1–1.5 L/day
  - Isotonic saline infusion
  - Strict sodium restriction to 0.5 g/day
  - Stop all protein intake
  answer: 1
  why:
  - Hypertonic saline is only for severe hyponatremia with life-threatening complications, and never more than 8
    mmol/L per day.
  - 'Correct: for Na <125 mmol/L, restrict fluid to 1–1.5 L/day.'
  - Saline must be given cautiously in ascites; it worsens overload.
  - Strict sodium restriction is not advised (hurts nutrition), and it does not treat dilutional hyponatremia.
  - Protein intake should stay at 1.2–1.5 g/kg.
  src:
    page: 152
  status: unverified
