    serum_albumin_g_dl: 1.6
    ascitic_albumin_g_dl: 0.8
  expect: SAAG = 0.8 g/dL (low)
  interpret: 'Low SAAG: non-portal-hypertensive ascites, here from hypoproteinemia (nephrotic syndrome).'
