  stem: A man with cirrhosis and ascites has creatinine rising from 1.0 to 1.6 mg/dL over 3 days. Diuretics were
    stopped and albumin 1 g/kg/day given for 48 h; creatinine is now 1.9. BP 100/60, no shock, no nephrotoxins,
    urine protein 120 mg/day, no hematuria, normal renal ultrasound. Diagnosis?
  options:
  - Prerenal azotemia
  - HRS-AKI
  - HRS-CKD
  - Acute tubular necrosis
  - HRS-AKD
  answer: 1
  why:
  - Prerenal AKI responds to diuretic withdrawal and albumin; this did not.
  - 'Correct: KDIGO AKI (≥50% rise in <7 days), no response after 2 days of albumin, and all exclusions met.'
  - CKD needs eGFR <60 for ≥3 months.
  - ATN is unlikely with bland urine; urinary NGAL would be higher.
  - AKD applies when AKI criteria are NOT met; here they are.
