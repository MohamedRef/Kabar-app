  src:
    page: 157
  status: unverified
- id: hb.L09.094
  kind: card
  topic: refractory
  front: How do vasoconstrictors help refractory ascites, and which ones?
  back: With albumin, IV terlipressin or oral midodrine reduce splanchnic vasodilatation and vasoconstrictor activation,
    improving renal perfusion, filtration and sodium excretion.
  src:
    page: 157
  status: unverified
- id: hb.L09.095
  kind: card
  topic: refractory
  front: 'Vaptans in refractory ascites: benefit and adverse effects?'
  back: 'They reduce ascites volume and paracentesis need without raising diuretic dose. Adverse: sodium overcorrection
    (osmotic demyelination), dehydration, renal injury, hepatotoxicity.'
  src:
    page: 157
  status: unverified
  update:
    text: EASL 2018 does not recommend vaptans for ascites (satavaptan raised mortality in refractory ascites),
      and AASLD 2021 limits tolvaptan to short courses for severe hyponatremia. Learn the book answer for the exam.
    ref: EASL CPG decompensated cirrhosis 2018; AASLD ascites guidance 2021
- id: hb.L09.096
  kind: card
  topic: refractory
  front: What is CART, its advantages, and its contraindication?
  back: 'Cell-free and concentrated ascites reinfusion: tap, filter out cells, concentrate, reinfuse. No effect
    on renal function, less albumin needed, stable sodium. Contraindicated in SBP.'
  src:
    page: 158
  status: unverified
- id: hb.L09.097
  kind: card
  topic: refractory
  front: 'Tunneled peritoneal drainage catheter: what is it and its risks?'
  back: 'A one-way-valve tunneled catheter with a polyester cuff draining into a vacuum bottle; patients drain at
    home. Risks: catheter problems and bacterial peritonitis.'
  src:
    page: 158
  status: unverified
- id: hb.L09.098
  kind: card
  topic: refractory
  front: 'Peritoneovenous shunt: mechanism and candidates?'
  back: A subcutaneous cannula with a one-way valve carries ascites into the systemic veins, raising cardiac output,
    renal flow, GFR and sodium excretion. For refractory ascites unsuitable for paracentesis, LT or TIPS.
  src:
    page: 158
  status: unverified
- id: hb.L09.099
  kind: cloze
  topic: refractory
  text: 'Complications of a peritoneovenous shunt: shunt occlusion, peritonitis, {{c1::disseminated intravascular
    coagulation}} and bleeding.'
  src:
    page: 158
  status: unverified
- id: hb.L09.100
  kind: mcq
  topic: refractory
  stem: A cirrhotic on spironolactone 400 mg and furosemide 160 mg with a 2 g sodium diet lost 0.5 kg over 4 days.
    Urine sodium is below his intake. Creatinine and sodium are normal. Which term fits?
  options:
  - Diuretic-intractable ascites
  - Diuretic-resistant ascites
  - Grade 1 ascites
  - Hepatorenal syndrome type non-AKI
  - Non-adherence to diet
  answer: 1
  why:
  - Intractable means complications stop dose increase; here doses are maximal with no complications.
  - 'Correct: no response (<0.8 kg/4 days, urine Na < intake) despite maximum doses and sodium restriction.'
  - Grade 1 is ultrasound-only ascites and needs no treatment.
  - Renal function is normal.
  - Urine sodium below intake on full diuretics shows true lack of response, not dietary excess.
  src:
    page: 155
  status: unverified
