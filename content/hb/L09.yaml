- id: hb.L09.187
  kind: essay
  topic: treatment
  prompt: Describe the pathogenesis, diagnosis, and treatment of uncomplicated cirrhotic ascites.
  outline:
  - Pathogenesis:
    - Peripheral arterial vasodilatation (NO, CO, glucagon, prostaglandins, endocannabinoids) → underfilling
    - RAAS, SNS, ADH → renal Na/water retention; portal hypertension localizes fluid
    - Gut bacterial translocation adds vasodilatation
  - Clinical and grading:
    - Grade 1 US only, grade 2 shifting dullness, grade 3 fluid thrill
    - ≥1–2 L needed to detect clinically
  - Diagnosis:
    - 'Diagnostic tap: appearance, cell count, protein, albumin (SAAG ≥1.1 = PHT), LDH, culture, cytology'
    - Serum electrolytes, creatinine, urine sodium
  - Treatment:
    - Grade 1 none; grade 2 Na restriction 2 g/day + diuretics; grade 3 LVP + albumin 6–8 g/L then diuretics
    - Spironolactone 100→400 mg, furosemide 40→160 mg (sequential vs combined 100:40)
    - Avoid NSAIDs, ACEi/ARB, aminoglycosides; monitor weight, Na/K ratio; refer for LT
  src:
    page: 171
  status: unverified
  tags:
  - book-question
- id: hb.L09.188
  kind: essay
  topic: refractory
  prompt: Discuss the definition, types and treatment options of refractory ascites.
  outline:
  - Definition:
    - Cannot be mobilized or recurs early (≤4 weeks) despite Na restriction and diuretics
    - 'Lack of response: <0.8 kg in 4 days and urine Na < intake'
  - Types:
    - Diuretic-resistant
    - Diuretic-intractable
  - Treatment:
    - Na restriction; stop diuretics if urine Na ≤30 mmol/day; palliative care if not for LT
    - Repeated LVP + albumin; TIPS (LVP >3/month); LT definitive (MELD exception)
    - Alfapump, vasoconstrictors, vaptans, CART, tunneled catheter, peritoneovenous shunt
  src:
    page: 171
  status: unverified
  tags:
  - book-question
- id: hb.L09.189
  kind: essay
  topic: hrs
  prompt: Mention the pathogenesis, classification, and management of hepatorenal syndrome.
  outline:
  - Pathogenesis:
    - Severe splanchnic vasodilatation → underfilling → RAAS/SNS/ADH → renal vasoconstriction
    - Failed renal vasodilators (NO, PG, kallikrein) vs ET-1, TXA2, LTE4; cirrhotic cardiomyopathy
    - 'Structural part: inflammation from bacterial translocation'
  - Classification (ICA):
    - HRS-AKI (KDIGO + exclusions)
    - 'HRS-non-AKI: AKD (<3 months) and CKD (≥3 months, eGFR <60)'
  - Management:
    - Stop diuretics, beta blockers, nephrotoxins; albumin; antibiotic; exclude other causes
    - Terlipressin (or norepinephrine, or midodrine+octreotide) + albumin 20–40 g/day
    - TIPS, RRT for non-responders; LT definitive; SLKT if renal recovery unlikely
  src:
    page: 171
  status: unverified
  tags:
  - book-question
- id: hb.L09.190
  kind: essay
  topic: sbp
  prompt: Outline the risk factors, clinical manifestations, diagnosis and treatment of spontaneous bacterial peritonitis.
  outline:
  - Risk factors:
    - GI bleeding, previous SBP, ascitic protein <1 g/dL, Child C, long-term PPI
  - Clinical:
    - Often silent; fever, pain, tenderness, GI upset
    - Worsening liver function, encephalopathy, HRS-AKI
  - Diagnosis:
    - PMN ≥250/mm³ ± culture; mostly monomicrobial Gram-negatives
    - 'Variants: culture-positive, culture-negative neutrocytic, bacterascites; exclude secondary peritonitis'
  - Treatment and prophylaxis:
    - Cefotaxime 2 g 8–12 h or ceftriaxone 2 g/day, ≥5–7 days; albumin 1.5 g/kg + 1 g/kg day 3
    - 'Response: PMN fall >25% at 48 h'
    - 'Prophylaxis: ceftriaxone 1 g in GI bleed (≤7 days); norfloxacin 400/cipro 500 for low protein or prior SBP'
  src:
    page: 171
  status: unverified
  tags:
  - book-question
