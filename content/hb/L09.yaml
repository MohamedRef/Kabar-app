  src:
    page: 152
  status: unverified
  tags:
  - numbers
- id: hb.L09.060
  kind: card
  topic: treatment
  front: How do vaptans work?
  back: They block the vasopressin V2 receptor in the collecting tubules, causing free-water clearance (aquaresis)
    without changing electrolyte excretion, so hyponatremia improves.
  src:
    page: 152
  status: unverified
- id: hb.L09.061
  kind: cloze
  topic: treatment
  text: Hypertonic (3%) saline is for rare severe hyponatremia with life-threatening complications, given slowly
    ({{c1::≤8 mmol/L per day}}) to avoid {{c2::osmotic demyelination}}.
  src:
