- id: hb.L13.009
  kind: enumerate
  topic: aih-diagnosis
  prompt: What does a definite diagnosis of AIH require?
  points: [Exclusion of other similar diseases, Laboratory findings of substantial immunoreactivity, Histologic
      features of interface hepatitis]
  pass: 3
  src: {page: 206}
  status: unverified
  tags: [high-yield]
- id: hb.L13.010
  kind: card
  topic: aih-diagnosis
  front: When is a "probable" diagnosis of AIH justified?
  back: When findings are compatible with AIH but insufficient for a definite diagnosis, for example a patient without
    conventional autoantibodies who is positive for investigational markers.
  src: {page: 206}
  status: unverified
- id: hb.L13.011
  kind: enumerate
  topic: aih-diagnosis
  prompt: Mention the investigational autoantibodies that classify a patient without conventional autoantibodies
    as probable AIH.
  points: [Anti-asialoglycoprotein receptor (anti-ASGPR), Anti-soluble liver antigen/liver-pancreas (anti-SLA/LP),
    Antiactin, Anti-liver cytosol type 1 (anti-LC1)]
  pass: 3
  src: {page: 206}
  status: unverified
- id: hb.L13.012
  kind: enumerate
  topic: aih-diagnosis
  prompt: In the AIH diagnostic algorithm (Fig. 1), which conditions must be excluded before the biopsy step?
  points: [AMA negative, Normal ceruloplasmin, Normal alpha-1 antitrypsin phenotype, Normal or nonspecific iron
      level, 'HBsAg, anti-HCV and IgM anti-HAV negative']
  pass: 4
  src: {page: 206}
  status: unverified
  tags: [figure]
- id: hb.L13.013
  kind: cloze
  topic: aih-diagnosis
  text: 'AIH algorithm (Fig. 1): definite AIH needs gamma globulin ≥ {{c1::1.5}} × normal and ANA, SMA or anti-LKM1
    titre ≥ {{c2::1:80}}; probable AIH accepts a titre ≥ {{c3::1:40}}.'
  src: {page: 206}
  status: unverified
  tags: [figure, numbers, high-yield]
- id: hb.L13.014
  kind: card
  topic: aih-diagnosis
  front: 'AIH algorithm (Fig. 1): how do drug, blood product and alcohol history differ between definite and probable
    AIH?'
  back: 'Definite: no drugs or blood products, and alcohol < 25 g/day. Probable: previous drugs or blood products,
    alcohol use, or other liver-related autoantibodies are allowed.'
  src: {page: 206}
  status: unverified
  tags: [figure, numbers]
- id: hb.L13.015
  kind: card
  topic: aih-diagnosis
  front: 'AIH algorithm (Fig. 1): which antibodies define type 1 and type 2 AIH?'
  back: 'Type 1: ANA and/or SMA. Type 2: anti-LKM1.'
  src: {page: 206}
  status: unverified
  tags: [figure, high-yield]
- id: hb.L13.016
  kind: card
  topic: aih-diagnosis
  front: 'AIH algorithm (Fig. 1): what histology is required after the exclusion step?'
  back: Interface hepatitis, with or without lobular hepatitis.
  src: {page: 206}
  status: unverified
  tags: [figure]
