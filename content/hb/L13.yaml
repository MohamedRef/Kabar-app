- id: hb.L13.117
  kind: card
  topic: psc-disease
  front: Define primary sclerosing cholangitis (PSC).
  back: A chronic cholestatic liver disease with fibrosing inflammation of both the intrahepatic and extrahepatic
    biliary tree.
  src: {page: 224, quote: chronic cholestatic liver disease characterized by fibrosing inflammation of both the
      intrahepatic and extrahepatic biliary tree}
  status: unverified
  tags: [high-yield]
- id: hb.L13.118
  kind: card
  topic: psc-disease
  front: What is the natural history of PSC without transplantation?
  back: Irreversible bile duct damage leading to cholestasis, cirrhosis, liver failure and premature death from
    liver failure.
  src: {page: 224}
  status: unverified
- id: hb.L13.119
  kind: card
  topic: psc-disease
  front: Which cancers are frequent on long-term follow-up of PSC, and why?
