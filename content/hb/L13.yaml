- id: hb.L13.021
  kind: mcq
  topic: aih-diagnosis
  stem: A 35-year-old woman has fatigue and jaundice. AST is 8 times normal and gamma globulin 2 times normal. ANA
    is 1:160. She takes no drugs, has had no blood products and does not drink. AMA, HBsAg, anti-HCV and IgM anti-HAV
    are negative; ceruloplasmin, alpha-1 antitrypsin phenotype and iron are normal. Biopsy shows interface hepatitis.
    How is she classified on the book's algorithm?
  options: [Definite type 1 AIH, Probable type 1 AIH, Definite type 2 AIH, AIH + PBC variant, Cryptogenic chronic
      hepatitis]
  answer: 0
  why: ['Correct: gamma globulin ≥ 1.5× normal, ANA ≥ 1:80, no drugs or blood products, alcohol < 25 g/day, and
      interface hepatitis; ANA positivity makes it type 1.', 'Probable AIH is for weaker findings (titre 1:40, drug
      or alcohol exposure, or only investigational antibodies).', 'Type 2 AIH is defined by anti-LKM1, not ANA.',
    'The AIH + PBC variant needs AMA, which is negative here.', Cryptogenic chronic hepatitis has no autoantibodies;
      she is ANA positive.]
  src: {page: 206}
  status: unverified
  tags: [figure]
- id: hb.L13.022
  kind: mcq
  topic: aih-diagnosis
  stem: Which histologic finding is the hallmark of autoimmune hepatitis?
  options: [Florid bile duct lesion, Onion-skin periductal fibrosis, Interface hepatitis with a lymphoplasmacytic
      infiltrate, Storiform fibrosis with obliterative phlebitis, Noncaseating granuloma in a portal triad]
  answer: 2
  why: [The florid duct lesion is stage I of PBC., Onion-skin fibrosis around an obliterated duct is the lesion
      of PSC., 'Correct: the limiting plate is disrupted by a lymphoplasmacytic infiltrate; this is the hallmark
      of AIH.', Storiform fibrosis and obliterative phlebitis are features of IgG4-related disease., 'A noncaseating
      granuloma appears in the book''s PBC stage IV image, not as the AIH hallmark.']
  src: {page: 205}
  status: unverified
- id: hb.L13.023
  kind: mcq
  topic: aih-diagnosis
  stem: A 40-year-old man has features of AIH. ANA, SMA and anti-LKM1 are negative, but anti-SLA/LP is positive.
    Viral, metabolic and drug causes are excluded. How should he be classified?
  options: [Definite AIH, Probable AIH, AIH excluded because conventional autoantibodies are negative, Primary biliary
      cholangitis, Type 2 AIH]
  answer: 1
  why: [Definite AIH needs conventional autoantibodies at diagnostic titres., 'Correct: lacking conventional autoantibodies
      but positive for investigational markers (anti-ASGPR, anti-SLA/LP, antiactin, anti-LC1) is probable AIH.',
    Seronegativity for conventional antibodies does not exclude AIH., 'PBC is defined by AMA, which is not mentioned.',
    'Type 2 AIH requires anti-LKM1, which is negative.']
  src: {page: 206}
  status: unverified
- id: hb.L13.024
  kind: enumerate
  topic: aih-types
  prompt: Mention the interacting factors proposed in the pathogenesis of AIH.
  points: ['A triggering agent (infectious agents, drugs, toxins)', A genetic predisposition, 'Autoantigen display,
      immunocyte activation and effector cell expansion']
  pass: 3
  src: {page: 207}
  status: unverified
- id: hb.L13.025
  kind: cloze
  topic: aih-types
  text: AIH susceptibility alleles reside on the {{c1::DRB1}} gene; in white northern European and North American
    patients they are {{c2::DRB1*0301}} and {{c3::DRB1*0401}}.
  src: {page: 207}
  status: unverified
  tags: [high-yield]
- id: hb.L13.026
  kind: card
  topic: aih-types
  front: What is the shared motif hypothesis of AIH?
  back: Risk of disease relates to the amino acid sequence in the antigen-binding groove of the class II MHC molecule,
    and several alleles encode the same or a similar sequence (the shared motif).
  src: {page: 207}
  status: unverified
- id: hb.L13.027
  kind: cloze
  topic: aih-types
  text: The critical AIH shared motif in white northern Europeans and North Americans is the six-amino-acid code
    {{c1::LLEQKR}}, with lysine at position {{c2::71}} of the DRβ chain.
  src: {page: 207}
  status: unverified
- id: hb.L13.028
  kind: card
  topic: aih-types
  front: How do DRB1*0404 and DRB1*0405 (Mexican, Japanese and Argentine adults) differ from the northern European
    AIH motif?
  back: They encode a similar sequence, except arginine (R) instead of lysine (K) at DRβ71.
  src: {page: 207}
  status: unverified
- id: hb.L13.029
  kind: card
  topic: aih-types
  front: Which autoantigen is the only one recognised as a target in AIH?
  back: Cytochrome P450 IID6 (CYP2D6).
  src: {page: 207}
  status: unverified
- id: hb.L13.030
  kind: card
  topic: aih-types
  front: By what mechanisms are liver cells destroyed in AIH?
  back: Cell-mediated cytotoxicity, antibody-dependent cell-mediated cytotoxicity, or both.
  src: {page: 208}
  status: unverified
