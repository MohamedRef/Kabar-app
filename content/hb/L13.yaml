- id: hb.L13.001
  kind: card
  topic: aih-diagnosis
  front: Define autoimmune hepatitis (AIH).
  back: A self-perpetuating hepatocellular inflammation of unknown cause.
  src: {page: 204, quote: self-perpetuating hepatocellular inflammation of unknown cause}
  status: unverified
- id: hb.L13.002
  kind: enumerate
  topic: aih-diagnosis
  prompt: Mention the three features that characterise AIH.
  points: [Interface hepatitis on histology, Hypergammaglobulinemia and autoantibodies in the serum, Diagnosis made
      after exclusion of other chronic liver diseases]
  pass: 3
  src: {page: 204}
  status: unverified
- id: hb.L13.003
  kind: card
  topic: aih-diagnosis
  front: What is interface hepatitis?
  back: Disruption of the limiting plate of the portal tract by a lymphoplasmacytic infiltrate.
  src: {page: 205}
  status: unverified
- id: hb.L13.004
  kind: cloze
  topic: aih-diagnosis
  text: '{{c1::Interface hepatitis}} is the histologic hallmark of autoimmune hepatitis.'
  src: {page: 205}
  status: unverified
  tags: [high-yield]
- id: hb.L13.005
  kind: card
  topic: aih-diagnosis
  front: What is lobular hepatitis, and how does it relate to interface hepatitis in AIH?
  back: Mononuclear inflammatory cells lining the sinusoidal spaces. It usually coexists with interface hepatitis
    and may be pronounced in acute presentations.
  src: {page: 205}
  status: unverified
- id: hb.L13.006
  kind: enumerate
  topic: aih-diagnosis
  prompt: The book lists four diagnostic criteria (features) of AIH on page 205. Mention them.
  points: ['Propensity for an acute and, rarely, fulminant hepatitis', Presence of lobular hepatitis, 'Cholestatic
      histologic changes, including bile duct injury and ductopenia', 'Immunoserologic tests (ANA, SMA, anti-LKM1,
      pANCA)']
  pass: 3
  src: {page: 205}
  status: unverified
- id: hb.L13.007
  kind: enumerate
  topic: aih-diagnosis
  prompt: Mention the four immunoserologic tests used in AIH.
  points: [Antinuclear antibodies (ANA), Smooth muscle antibodies (SMA), Liver/kidney microsome type 1 antibodies
      (anti-LKM1), Perinuclear anti-neutrophil cytoplasmic antibodies (pANCA)]
  pass: 4
  src: {page: 205}
  status: unverified
- id: hb.L13.008
  kind: cloze
  topic: aih-diagnosis
  text: pANCA is common in {{c1::type 1}} AIH.
