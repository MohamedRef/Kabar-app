- id: hb.L13.158
  kind: card
  topic: psc-emerging
  front: How does 24-norUDCA differ from UDCA, and what does that allow?
  back: It lacks a methylene group, so it resists conjugation, undergoes cholehepatic shunting and stimulates bicarbonate-rich
    choleresis. It is antilipotoxic, antiproliferative, antifibrotic and anti-inflammatory.
  src: {page: 231}
  status: unverified
- id: hb.L13.159
  kind: card
  topic: psc-emerging
  front: What is the concern with norUDCA in PSC?
  back: Possible disease progression from its choleretic effect, especially in patients with dominant strictures.
  src: {page: 231}
  status: unverified
- id: hb.L13.160
  kind: card
  topic: psc-emerging
  front: Which enzyme does FXR downregulate, and why does it matter?
  back: CYP7A1, the rate-limiting enzyme of bile acid production.
  src: {page: 231}
  status: unverified
- id: hb.L13.161
  kind: card
  topic: psc-emerging
  front: How does FXR activation signal between gut and liver?
  back: It reduces ASBT expression in enterocytes and increases FGF19 secretion; FGF19 reaches hepatocytes through
    the portal blood and activates FGFR4.
  src: {page: 232}
  status: unverified
- id: hb.L13.162
  kind: card
  topic: psc-emerging
  front: Main side effect of obeticholic acid in the AESOP trial in PSC?
  back: Dose-dependent pruritus (67% on 5–10 mg/day, 60% on 1.5–3 mg/day, 45% on placebo); discontinuation was rare.
  src: {page: 232}
  status: unverified
- id: hb.L13.163
  kind: card
  topic: psc-emerging
  front: How do PPAR agonists act against cholestasis?
  back: They enhance biliary phospholipid secretion, promote mixed micelle formation by upregulating MDR3, inhibit
    bile acid synthesis and upregulate bile acid detoxification.
  src: {page: 234}
  status: unverified
- id: hb.L13.164
  kind: card
  topic: psc-emerging
  front: What happened to liver stiffness in the fibrate study in PSC?
  back: It increased significantly on transient elastography, even though ALP fell by 40%.
  src: {page: 234}
  status: unverified
- id: hb.L13.165
  kind: card
  topic: psc-emerging
  front: Have conventional immunosuppressants helped PSC?
  back: No clear benefit. Azathioprine, mycophenolate and tacrolimus have only case reports; budesonide had minimal
    efficacy and worsened osteoporosis; infliximab did not lower ALP or improve histology or symptoms.
  src: {page: 237}
  status: unverified
- id: hb.L13.166
  kind: card
  topic: psc-emerging
  front: Vidofludimus in PSC?
  back: A dihydroorotate dehydrogenase inhibitor that blocks activated T- and B-cell replication; ALP normalised
    in 27.7% at week 24 in a phase II open-label trial.
  src: {page: 236}
  status: unverified
- id: hb.L13.167
  kind: card
  topic: psc-emerging
  front: Rifaximin versus minocycline in PSC?
  back: Rifaximin had no effect on cholestatic markers or Mayo score; minocycline significantly improved ALP and
    Mayo score.
  src: {page: 238}
  status: unverified
- id: hb.L13.168
  kind: card
  topic: psc-emerging
  front: Faecal microbiota transplantation and probiotics in PSC?
  back: FMT gave a ≥ 50% ALP fall in 3 participants of a small pilot. A probiotic mix in a small crossover RCT made
    no significant difference.
  src: {page: 239}
  status: unverified
- id: hb.L13.169
  kind: card
  topic: psc-emerging
  front: Curcumin and docosahexaenoic acid in PSC?
  back: Curcumin did not improve cholestasis or symptoms. Docosahexaenoic acid (enhances PPAR signalling) significantly
    lowered ALP in a 12-month pilot (n = 23).
  src: {page: 239}
  status: unverified
- id: hb.L13.170
  kind: mcq
  topic: psc-emerging
  stem: Simtuzumab failed to improve hepatic collagen or Ishak stage in compensated PSC. What does it inhibit?
  options: [Farnesoid X receptor, Lysyl oxidase-like 2 (LOXL2), Apical sodium-dependent bile acid transporter (ASBT),
    CCR2/CCR5]
  answer: 1
  why: [FXR is the target of OCA and cilofexor (agonists)., 'Correct: simtuzumab inhibits LOXL2, which cross-links
      collagen and elastin.', ASBT is inhibited by maralixibat., CCR2/CCR5 is antagonised by cenicriviroc.]
  src: {page: 235}
  status: unverified
- id: hb.L13.171
  kind: mcq
  topic: psc-emerging
  stem: An FXR agonist in PSC lowers bile acid synthesis mainly by downregulating which enzyme?
  options: [CYP2D6, CYP7A1, HMG-CoA reductase, Dihydroorotate dehydrogenase]
  answer: 1
  why: [CYP2D6 is the AIH autoantigen., 'Correct: FXR downregulates CYP7A1, the rate-limiting enzyme of bile acid
      production.', HMG-CoA reductase is in cholesterol synthesis and is not mentioned., Dihydroorotate dehydrogenase
      is inhibited by vidofludimus.]
  src: {page: 231}
  status: unverified
- id: hb.L13.172
  kind: mcq
  topic: psc-emerging
  stem: Which gut-directed antibiotic lowered ALP and Mayo score in PSC in two randomised trials, and is thought
    to act partly by reducing T-cell cytokine production?
