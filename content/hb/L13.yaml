- id: hb.L13.036
  kind: card
  topic: aih-types
  front: In the AIH + PBC variant, when is UDCA added to prednisone?
  back: When alkaline phosphatase is more than twice normal and/or there are florid duct lesions. If ALP is ≤ 2×
    normal, prednisone alone.
  src: {page: 209}
  status: unverified
- id: hb.L13.037
  kind: card
  topic: aih-types
  front: Which AIH variant has AIH features, no autoantibodies and HLA-B8 or DR3, and how is it treated?
  back: Cryptogenic chronic hepatitis. Histology shows interface hepatitis; treat with conventional AIH regimens.
  src: {page: 209}
  status: unverified
- id: hb.L13.038
  kind: card
  topic: aih-types
  front: Features of autoimmune cholangitis (Table 2)?
  back: ANA and/or SMA present, AMA absent, no chronic ulcerative colitis, normal cholangiogram, cholangitis on
    histology. Treated empirically with prednisone and/or UDCA.
  src: {page: 209}
  status: unverified
- id: hb.L13.039
  kind: mcq
  topic: aih-types
  stem: A 28-year-old man with chronic ulcerative colitis has clinical and laboratory features of AIH. AMA is negative
    and the cholangiogram is abnormal. Biopsy shows cholangitis. Which variant is this?
  options: [AIH + PBC, AIH + PSC, Autoimmune cholangitis, Cryptogenic chronic hepatitis]
  answer: 1
  why: ['AIH + PBC needs AMA, which is absent.', 'Correct: AIH features with CUC, absent AMA and an abnormal cholangiogram
      define AIH + PSC.', Autoimmune cholangitis has no CUC and a normal cholangiogram., 'Cryptogenic chronic hepatitis
      shows interface hepatitis, not cholangitis, and has no autoantibodies.']
  src: {page: 209}
  status: unverified
- id: hb.L13.040
  kind: mcq
  topic: aih-types
  stem: A woman has AIH features with positive AMA. ALP is 3 times normal and the biopsy shows florid duct lesions.
    What is the book's empirical treatment?
  options: [Prednisone alone, UDCA alone, Prednisone and ursodeoxycholic acid, Azathioprine alone, Liver transplantation]
  answer: 2
  why: [Prednisone alone is used only when ALP is ≤ 2× normal., UDCA alone is not the regimen for AIH + PBC; the
      AIH component needs prednisone., 'Correct: AIH + PBC with ALP > 2× normal and/or florid duct lesions gets
      prednisone and UDCA.', Azathioprine alone is not a regimen in the book., Nothing here suggests decompensation
      needing transplantation.]
  src: {page: 209}
  status: unverified
