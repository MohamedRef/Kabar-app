- id: hb.L13.032
  kind: mcq
  topic: aih-types
  stem: A 9-year-old girl presents with acute hepatitis. ANA and SMA are negative; anti-LKM1 is positive. Which
    autoantigen is the target of her autoantibody?
  options: [Asialoglycoprotein receptor, Transfer ribonucleoprotein (tRNP), Cytochrome P450 IID6 (CYP2D6), Pyruvate
      dehydrogenase on mitochondria, Actin]
  answer: 2
  why: [Anti-ASGPR is a novel marker listed for type 1 AIH., tRNP is the novel antibody target in type 3 AIH., 'Correct:
      anti-LKM1 defines type 2 AIH, and CYP2D6 is its target and the only recognised AIH autoantigen.', Mitochondrial
      antigens are the target of AMA in PBC; the book does not name the protein., Antiactin is a novel marker listed
      for type 1 AIH.]
  src: {page: 208}
  status: unverified
- id: hb.L13.033
  kind: mcq
  topic: aih-types
  stem: According to Table 1, which age pattern is typical of type 1 AIH?
  options: ['Pediatric, 2–14 years', 'Adults, 30–50 years', 'Bimodal, 10–20 and 45–70 years', 'Elderly only, over
      70 years']
  answer: 2
  why: [2–14 years is type 2 AIH., 30–50 years is type 3 AIH., 'Correct: type 1 AIH is bimodal, at 10–20 and 45–70
      years.', No AIH type in Table 1 is limited to the elderly.]
  src: {page: 208}
  status: unverified
- id: hb.L13.034
  kind: mcq
  topic: aih-types
  stem: A child with AIH has occasional low IgA, mild gamma globulin elevation and organ-specific antibodies. Which
    type of AIH best fits?
  options: [Type 1, Type 2, Type 3, Cryptogenic chronic hepatitis]
  answer: 1
  why: ['Type 1 has marked gamma globulin elevation, no low IgA, and organ-specific antibodies in only 4%.', 'Correct:
      type 2 is pediatric, with mild gamma globulin elevation, occasional low IgA and organ-specific antibodies
      in 30%.', 'Type 3 affects adults, has moderate gamma globulin elevation and no low IgA.', 'Cryptogenic chronic
      hepatitis is a variant without autoantibodies, not a Table 1 type.']
  src: {page: 208}
  status: unverified
