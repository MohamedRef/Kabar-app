- id: hb.L13.223
  kind: case
  topic: aih-treatment
  stem: A 34-year-old woman has 3 weeks of fatigue and jaundice. AST is 12 times normal, gamma globulin 2.5 times
    normal, ANA 1:320 and SMA positive. AMA, HBsAg, anti-HCV and IgM anti-HAV are negative; ceruloplasmin, alpha-1
    antitrypsin phenotype and iron studies are normal. She drinks no alcohol and takes no drugs.
  steps:
  - question: What is the next step on the book's diagnostic algorithm?
    options: [Liver biopsy, ERCP, Start UDCA, Repeat serology in 6 months]
    answer: 0
    why: After the exclusion step, the algorithm needs histology (interface hepatitis ± lobular hepatitis) before
      classifying AIH.
  - reveal: Biopsy shows interface hepatitis with a lymphoplasmacytic infiltrate and lobular hepatitis. No cholangitis.
    question: How is she classified?
    options: [Definite type 1 AIH, Probable type 1 AIH, Definite type 2 AIH, Autoimmune cholangitis]
    answer: 0
    why: Gamma globulin ≥ 1.5× normal, ANA/SMA ≥ 1:80, no drugs, no alcohol and interface hepatitis make it definite;
      ANA/SMA make it type 1. Autoimmune cholangitis would show cholangitis.
  - question: Which regimen does the book prefer?
    options: [Prednisone 30 mg/day tapering to 10 mg/day plus azathioprine 50 mg/day, Prednisone 60 mg/day tapering
        to 20 mg/day alone, Azathioprine 50 mg/day alone, UDCA]
    answer: 0
    why: AST ≥ 10× normal is an absolute indication, and the combination gives fewer glucocorticoid side effects
      (10% vs 44%).
  - reveal: After 2 years she has no symptoms, AST is 1.5 times normal, gamma globulin is normal and a biopsy shows
      minimal activity.
    question: What now?
    options: [Stop therapy and watch for relapse, Indefinite low-dose prednisone, Increase to high-dose therapy,
      Refer for transplantation]
    answer: 0
    why: She meets the remission criteria, so therapy is stopped.
  - reveal: She relapses, gets a second remission with repeat therapy, stops again, and relapses a second time.
    question: What is the long-term plan?
    options: [Indefinite low-dose prednisone or indefinite azathioprine, Repeat the induction course and stop again,
      Liver transplantation, No treatment]
    answer: 0
    why: After a second relapse, Fig. 2 recommends indefinite low-dose prednisone or azathioprine.
  src: {page: 214}
  status: unverified
  tags: [figure]
- id: hb.L13.224
  kind: case
  topic: pbc-treatment
  stem: A 48-year-old woman has itching for 6 months and tiredness. She has dry eyes and dry mouth. ALP is raised,
