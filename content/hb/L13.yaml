- id: hb.L13.043
  kind: card
  topic: aih-treatment
  front: Which prognostic indices after treatment carry a high mortality in AIH (Table 3)?
  back: 1. Multilobular necrosis with failure to improve on treatment, or hyperbilirubinemia after 2 weeks. 2. Failure
    to enter remission within 4 years, with the first sign of decompensation.
  src: {page: 210}
  status: unverified
- id: hb.L13.044
  kind: card
  topic: aih-treatment
  front: What course goes with HLA-B8, DR3 or DRB1*0301 in AIH?
  back: Onset at a young age, severe inflammation at presentation, relapse propensity, frequent treatment failure,
    and frequent liver transplantation.
  src: {page: 210}
  status: unverified
- id: hb.L13.045
  kind: card
  topic: aih-treatment
  front: What course goes with HLA-DR4 or DRB1*0401 in AIH?
  back: Onset in older women, concurrent immunologic diseases, and response to glucocorticoids.
  src: {page: 210}
  status: unverified
- id: hb.L13.046
  kind: card
  topic: aih-treatment
  front: What is associated with C4A gene deletion in AIH?
  back: Low serum complement level and early-onset disease.
  src: {page: 210}
  status: unverified
