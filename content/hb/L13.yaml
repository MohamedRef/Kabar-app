  - question: What is the main treatment?
    options: [Lifelong ursodeoxycholic acid, Prednisone and azathioprine, Colestyramine alone, Balloon dilatation]
    answer: 0
    why: UDCA is the main treatment; it delays liver damage, especially if started early, and is taken for life.
