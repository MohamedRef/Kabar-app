items:
  # ---------- p1-2: definition, morphology, causes ----------
  - id: hb.L01.001
    kind: card
    topic: definition
    front: Which liver cells are the major fibrogenic cells, and where do they live?
    back: Hepatic stellate cells (HSCs), in the space of Disse between the hepatocytes and the sinusoidal endothelial lining.
    src: { page: 1, quote: "The hepatic stellate cells (HSCs), the major fibrogenic cells in the liver" }
    status: unverified
  - id: hb.L01.002
    kind: cloze
    topic: definition
    text: In the normal liver, HSCs are quiescent and store {{c1::vitamin A and retinoids}}.
    src: { page: 1, quote: "their function is to store vitamin A and retinoids" }
    status: unverified
  - id: hb.L01.003
    kind: card
    topic: definition
    front: Anatomical definition of cirrhosis?
    back: A diffuse process of fibrosis and regenerative nodule formation that disrupts the normal liver architecture. It is the end result of fibrogenesis in chronic liver injury.
    src: { page: 1, quote: "diffuse process with fibrosis and regenerative nodule formation" }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.004
    kind: cloze
    topic: definition
    text: Morphologically, cirrhosis is {{c1::macronodular}}, {{c2::micronodular}}, or {{c3::mixed}}.
    src: { page: 1 }
    status: unverified
  - id: hb.L01.005
    kind: enumerate
    topic: causes
    prompt: Enumerate the causes of liver cirrhosis (book Table 1, 9 groups).
    points:
      - Viral hepatitis B, C and D
      - Alcohol
      - "Metabolic: MASH (formerly NASH), hemochromatosis, Wilson disease, alpha-1 antitrypsin deficiency, type IV glycogenosis, galactosemia, tyrosinemia"
      - "Prolonged cholestasis: PBC, PSC, prolonged extrahepatic cholestasis"
      - "Hepatic venous outflow block: Budd-Chiari, SOS (veno-occlusive disease), right heart failure (cardiac cirrhosis), constrictive pericarditis"
      - Autoimmune hepatitis
      - Toxins and drugs (methotrexate, amiodarone)
      - Tertiary syphilis
      - Cryptogenic (etiology cannot be determined)
    pass: 7
    src: { page: 2 }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.006
    kind: cloze
    topic: causes
    text: "Hepatic venous outflow block causes of cirrhosis: {{c1::Budd-Chiari syndrome}}, {{c2::sinusoidal obstruction syndrome (veno-occlusive disease)}}, {{c3::right heart failure and constrictive pericarditis}}."
    src: { page: 2 }
    status: unverified
  - id: hb.L01.007
    kind: card
    topic: causes
    front: Which two drugs does the book name as causes of cirrhosis?
    back: Methotrexate and amiodarone.
    src: { page: 2, quote: "Toxins and drugs, e.g. methotrexate, amiodarone" }
    status: unverified
  # ---------- p3-4: pathogenesis ----------
  - id: hb.L01.008
    kind: cloze
    topic: pathogenesis
    text: In viral hepatitis and hemochromatosis, fibrosis is mainly {{c1::periportal (zone 1)}}; in alcoholism and right heart failure it is mainly in {{c2::zone 3}}.
    src: { page: 3 }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.009
    kind: card
    topic: pathogenesis
    front: During liver injury, what do activated HSCs become, and what do they do?
    back: They transform into myofibroblasts and deposit collagen, which causes fibrosis.
    src: { page: 3, quote: "HSCs become activated, transform into myofibroblasts, and start depositing collagen" }
    status: unverified
  - id: hb.L01.010
    kind: cloze
    topic: pathogenesis
    text: Matrix laid down in the space of Disse ({{c1::collagenosis of Disse space}}) causes defenestration of the sinusoidal wall, called {{c2::capillarization of the sinusoids}}, which impedes metabolic exchange with liver cells.
    src: { page: 3 }
    status: unverified
  - id: hb.L01.011
    kind: card
    topic: pathogenesis
    front: Two mechanisms that raise portal pressure in cirrhosis?
    back: First, increased intrahepatic vascular resistance (the initial cause). Then increased portal inflow from splanchnic arteriolar vasodilatation, which aggravates it.
    src: { page: 4 }
    status: unverified
    tags: [high-yield]
  # ---------- p4-8: clinical presentation ----------
  - id: hb.L01.012
    kind: card
    topic: presentation
    front: Which three major complications produce the symptoms and signs of cirrhosis?
    back: Portal hypertension, hepatic decompensation (liver failure), and hepatocellular carcinoma.
    src: { page: 4 }
    status: unverified
  - id: hb.L01.013
    kind: card
    topic: presentation
    front: Earliest and most important consequence of cirrhosis?
    back: Portal hypertension. It develops regardless of the severity of the liver disease.
    src: { page: 4, quote: "PH is the earliest and most important consequence of cirrhosis" }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.014
    kind: card
    topic: presentation
    front: How may portosystemic shunts present clinically?
    back: Upper GI bleeding (hematemesis and melena, or melena alone), less often lower GI bleeding, dilated abdominal wall veins, caput medusae, and a venous hum.
    src: { page: 5 }
    status: unverified
  - id: hb.L01.015
    kind: card
    topic: presentation
    front: Definition of compensated cirrhosis?
    back: Absence of clinical complications of hepatic decompensation, now or in the past.
    src: { page: 5 }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.016
    kind: enumerate
    topic: presentation
    prompt: Enumerate the precipitating factors for hepatic decompensation.
    points:
      - Variceal bleeding
      - Major surgery
      - Bacterial infections
      - HCC
      - Superimposed acute alcoholic hepatitis
      - Drug-induced liver injury
      - Superimposed viral hepatitis (HAV, HEV)
      - HBV flares
    pass: 6
    src: { page: 5 }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.017
    kind: card
    topic: presentation
    front: Most frequent first decompensating event in cirrhosis?
    back: Ascites.
    src: { page: 6, quote: "Ascites is the most frequent first decompensating event in cirrhosis" }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.018
    kind: card
    topic: presentation
    front: Manifestations of hepatic encephalopathy listed in the lecture?
    back: Fetor hepaticus, asterixis (flapping tremor), disturbed sleep rhythm, disturbed consciousness, and psychiatric, behaviour and motor changes.
    src: { page: 6 }
    status: unverified
  - id: hb.L01.019
    kind: card
    topic: presentation
    front: Is jaundice alone an early sign of non-cholestatic cirrhosis?
    back: No. In most patients it is not early, and it may reflect superimposed liver injury.
    src: { page: 6 }
    status: unverified
  - id: hb.L01.020
    kind: card
    topic: presentation
    front: Cause of the endocrine changes of cirrhosis (hypogonadism, gynecomastia, loss of body hair)?
    back: Decreased estrogen metabolism, causing hyperestrogenemia.
    src: { page: 6, quote: "result of decreased estrogen metabolism and hyperestrogenemia" }
    status: unverified
  - id: hb.L01.021
    kind: card
    topic: presentation
    front: "Spider angiomas: what are they, where are they, and why?"
    back: A central arteriole surrounded by smaller radiating vessels, found invariably on the upper half of the body. Due to hyperestrogenemia.
    src: { page: 7 }
    status: unverified
  - id: hb.L01.022
    kind: enumerate
    topic: cardiopulmonary
    prompt: Mention the cardiopulmonary manifestations of cirrhosis.
    points:
      - Hyperdynamic circulatory syndrome
      - Cirrhotic cardiomyopathy
      - Portopulmonary hypertension
      - Hepatopulmonary syndrome
    pass: 4
    src: { page: 7 }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.023
    kind: card
    topic: presentation
    front: Define bacterial translocation.
    back: Passage of bacteria and their products from the gut into the circulation, through intestinal wall hyperpermeability caused by portal hypertension.
    src: { page: 7 }
    status: unverified
  - id: hb.L01.024
    kind: cloze
    topic: presentation
    text: "Patients with cirrhosis are in a state of {{c1::accelerated starvation}}: an impaired adaptive response to short periods of fasting."
    src: { page: 7, quote: "accelerated starvation" }
    status: unverified
  - id: hb.L01.025
    kind: enumerate
    topic: presentation
    prompt: Mention the mechanisms of sarcopenia in cirrhosis.
    points:
      - Altered protein turnover
      - Altered energy disposal
      - "Hormonal: increased myostatin, decreased anabolic hormones"
      - "Metabolic: altered lipid and amino acid metabolism"
      - Hyperammonemia
    pass: 4
    src: { page: 7 }
    status: unverified
  - id: hb.L01.026
    kind: enumerate
    topic: presentation
    prompt: Enumerate the events that define further decompensation.
    points:
      - Recurrent variceal bleeding
      - Recurrent HE
      - Refractory ascites
      - SBP
      - HRS-AKI
      - Bacterial infections
      - ACLF
    pass: 5
    src: { page: 8 }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.027
    kind: card
    topic: presentation
    front: HCC is frequent with all forms of cirrhosis except which two?
    back: Biliary and cardiac cirrhosis.
    src: { page: 8, quote: "HCC is frequent with all forms of cirrhosis except the biliary and cardiac types" }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.028
    kind: card
    topic: presentation
    front: Examination findings of a malignant (HCC) liver?
    back: Enlarged and hard, with a sharp irregular edge and nodular surface, and an arterial bruit over the mass. Hemorrhagic ascites may develop.
    src: { page: 8 }
    status: unverified
  - id: hb.L01.029
    kind: enumerate
    topic: presentation
    prompt: Mention the "other manifestations" of cirrhosis.
    points:
      - Digital clubbing
      - Bilateral parotid enlargement
      - Dupuytren contracture
      - Pigment gallstones
      - Relative adrenal insufficiency
    pass: 4
    src: { page: 8 }
    status: unverified
  # ---------- p8-9: ACLF ----------
  - id: hb.L01.030
    kind: card
    topic: aclf
    front: Define acute-on-chronic liver failure (ACLF).
    back: Acute hepatic decompensation in pre-existing chronic liver disease, with multiorgan failure and high short-term mortality (28-day mortality of 15% or more).
    src: { page: 8 }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.031
    kind: cloze
    topic: aclf
    text: ACLF carries a {{c1::28}}-day mortality of {{c2::15% or more}}.
    src: { page: 8, quote: "high short-term (28-day) mortality (≥ 15%)" }
    status: unverified
    tags: [numbers]
  - id: hb.L01.032
    kind: card
    topic: aclf
    front: At which stage of cirrhosis can ACLF develop?
    back: At any stage, from compensated to decompensated cirrhosis.
    src: { page: 8 }
    status: unverified
  - id: hb.L01.033
    kind: enumerate
    topic: aclf
    prompt: Enumerate the precipitating factors of ACLF.
    points:
      - Acute alcoholic injury
      - Bacterial infections
      - Reactivation of hepatitis B
      - Flare of autoimmune hepatitis
      - Superimposed acute hepatitis A or E
      - GI bleeding
      - Drug hepatotoxicity
    pass: 5
    src: { page: 9 }
    status: unverified
  - id: hb.L01.034
    kind: enumerate
    topic: aclf
    prompt: Mention the extrahepatic organ failures in ACLF.
    points: [Renal, Coagulation, Respiratory, Circulatory, Brain]
    pass: 4
    src: { page: 9 }
    status: unverified
  # ---------- p9-11: diagnosis ----------
  - id: hb.L01.035
    kind: card
    topic: diagnosis
    front: Ultrasound features of cirrhosis?
    back: Surface nodularity, dense reflective (coarse) echoes, an enlarged caudate lobe and regenerating nodules. Splenomegaly and ascites can also be seen.
    src: { page: 9 }
    status: unverified
  - id: hb.L01.036
    kind: cloze
    topic: diagnosis
    text: "HCC screening in cirrhosis: {{c1::ultrasound}} with or without {{c2::AFP}} every {{c3::6 months}}."
    src: { page: 13, quote: "Screening for HCC should be scheduled every 6 months with ultrasound" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L01.037
    kind: card
    topic: diagnosis
    front: Gold standard for diagnosing cirrhosis?
    back: Liver biopsy, usually US- or CT-guided. It may also give a clue to the etiology and inflammatory activity.
    src: { page: 10, quote: "is the gold standard for the diagnosis of cirrhosis" }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.038
    kind: card
    topic: diagnosis
    front: When is the transjugular route used for liver biopsy?
    back: When there are contraindications such as ascites or a coagulation defect.
    src: { page: 10 }
    status: unverified
  - id: hb.L01.039
    kind: cloze
    topic: diagnosis
    text: APRI is calculated from {{c1::AST and platelet count}}; FIB-4 from {{c2::age, AST, ALT and platelet count}}.
    src: { page: 10 }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.040
    kind: card
    topic: diagnosis
    front: What does transient elastography (FibroScan) measure, and in what unit?
    back: The velocity of shear waves through the liver (the stiffer the liver, the faster the wave), converted to a liver stiffness measurement (LSM) in kilopascals (kPa).
    src: { page: 11 }
    status: unverified
  - id: hb.L01.041
    kind: enumerate
    topic: diagnosis
    prompt: Mention the causes of overestimated liver stiffness on transient elastography.
    points: [Hepatic inflammation, Cholestasis, Food ingestion, Exercise, Venous congestion]
    pass: 4
    src: { page: 11 }
    status: unverified
    tags: [high-yield]
  # ---------- p11-13: labs ----------
  - id: hb.L01.042
    kind: card
    topic: labs
    front: Typical aminotransferase pattern in cirrhosis?
    back: Mild to moderate elevation with AST greater than ALT. Normal levels do not exclude cirrhosis.
    src: { page: 11 }
    status: unverified
  - id: hb.L01.043
    kind: card
    topic: labs
    front: Why are immunoglobulins (especially gamma-globulins) high in cirrhosis?
    back: Impaired clearance by the liver.
    src: { page: 11 }
    status: unverified
  - id: hb.L01.044
    kind: enumerate
    topic: labs
    prompt: Mention the three types of anemia in cirrhosis and their causes.
    points:
      - "Normocytic normochromic: acute GI bleeding, hypersplenism, marrow aplasia from alcohol or HCV"
      - "Microcytic hypochromic: chronic occult GI blood loss, anemia of chronic disease"
      - "Macrocytic: vitamin B12 and folate deficiency"
    pass: 3
    src: { page: 12 }
    status: unverified
  - id: hb.L01.045
    kind: card
    topic: labs
    front: In a cirrhotic, erythrocytosis suggests what?
    back: HCC. The book attributes it to excess thrombopoietin production by tumour cells (physiologically this is erythropoietin; logged in book issues).
    src: { page: 12, quote: "Erythrocytosis may occur with HCC due to excess thrombopoietinproduction by tumor cells" }
    status: unverified
  - id: hb.L01.046
    kind: enumerate
    topic: labs
    prompt: Mention the causes of thrombocytopenia in cirrhosis.
    points:
      - Hypersplenism
      - Thrombopoietin deficiency
      - Immune thrombocytopenia
      - Bone marrow suppression by alcohol or HCV
    pass: 3
    src: { page: 12 }
    status: unverified
  - id: hb.L01.047
    kind: card
    topic: labs
    front: Tests that point to Wilson disease as the cause of cirrhosis?
    back: Low serum ceruloplasmin, high 24-hour urine copper, and increased hepatic copper concentration.
    src: { page: 12 }
    status: unverified
  - id: hb.L01.048
    kind: card
    topic: labs
    front: Tests that point to hemochromatosis as the cause of cirrhosis?
    back: Increased transferrin saturation, serum ferritin, serum iron and hepatic iron concentration, plus genetic testing.
    src: { page: 12 }
    status: unverified
  - id: hb.L01.049
    kind: card
    topic: labs
    front: Which antibody points to PBC as the cause of cirrhosis?
    back: Anti-mitochondrial antibodies (AMA).
    src: { page: 13 }
    status: unverified
  - id: hb.L01.050
    kind: card
    topic: diagnosis
    front: What can HVPG measurement establish in cirrhosis?
    back: The presence and cause of portal hypertension, and the response to therapy.
    src: { page: 13 }
    status: unverified
  # ---------- p13-15: prognosis ----------
  - id: hb.L01.051
    kind: cloze
    topic: prognosis
    text: Median survival is {{c1::more than 12 years}} in compensated cirrhosis and about {{c2::2 years}} in decompensated cirrhosis.
    src: { page: 13, quote: "median survival time >12 years" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L01.052
    kind: cloze
    topic: prognosis
    text: Compensated cirrhosis becomes decompensated at about {{c1::5-7%}} per year.
    src: { page: 13, quote: "occurs at a rate of about 5-7% per year" }
    status: unverified
    tags: [numbers]
  - id: hb.L01.053
    kind: cloze
    topic: prognosis
    text: HCC develops in alcohol-associated and viral cirrhosis at {{c1::3-5%}} per year.
    src: { page: 13, quote: "with rates of 3–5% per year" }
    status: unverified
    tags: [numbers]
  - id: hb.L01.054
    kind: cloze
    topic: prognosis
    text: A mean arterial pressure of {{c1::82 mmHg or less}} is a poor prognostic factor in cirrhosis.
    src: { page: 13, quote: "mean arterial pressure 82 mm Hg or less" }
    status: unverified
    tags: [numbers]
  - id: hb.L01.055
    kind: enumerate
    topic: prognosis
    prompt: Enumerate the poor prognostic factors in cirrhosis.
    points:
      - Marked ascites (if refractory)
      - Variceal bleeding
      - Advanced age
      - Mean arterial pressure 82 mmHg or less
      - High daily alcohol consumption
      - Prolonged prothrombin time
      - High serum bilirubin and alkaline phosphatase
      - Low albumin
      - Hyponatremia
      - Infections
      - Severe kidney dysfunction
      - Ventilatory insufficiency
      - Poor nutrition
    pass: 9
    src: { page: 13 }
    status: unverified
  - id: hb.L01.056
    kind: enumerate
    topic: prognosis
    prompt: Mention the five parameters of the Child-Pugh classification.
    points: [Ascites, Encephalopathy, Serum albumin, Serum bilirubin, Prothrombin time]
    pass: 5
    src: { page: 14 }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.057
    kind: cloze
    topic: prognosis
    text: "Child-Pugh class A = {{c1::5-6}} points, class B = {{c2::7-9}} points, class C = {{c3::10-15}} points."
    src: { page: 14 }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L01.058
    kind: cloze
    topic: prognosis
    text: "Child-Pugh bilirubin: {{c1::below 2}} mg/dL = 1 point, {{c2::2-3}} mg/dL = 2 points, {{c3::above 3}} mg/dL = 3 points."
    src: { page: 14 }
    status: unverified
    tags: [numbers]
  - id: hb.L01.059
    kind: cloze
    topic: prognosis
    text: "Child-Pugh albumin: {{c1::above 3.5}} g/dL = 1 point, {{c2::2.8-3.5}} g/dL = 2 points, {{c3::below 2.8}} g/dL = 3 points."
    src: { page: 14 }
    status: unverified
    tags: [numbers]
  - id: hb.L01.060
    kind: cloze
    topic: prognosis
    text: "Child-Pugh prothrombin time (seconds prolonged): {{c1::below 4}} = 1 point, {{c2::4-6}} = 2 points, {{c3::above 6}} = 3 points."
    src: { page: 14 }
    status: unverified
    tags: [numbers]
  - id: hb.L01.061
    kind: cloze
    topic: prognosis
    text: "Child-Pugh one- and two-year survival: class A {{c1::100% and 85%}}, class B {{c2::80% and 60%}}, class C {{c3::45% and 35%}}."
    src: { page: 14 }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L01.062
    kind: card
    topic: prognosis
    front: "MELD score: which three variables, and what range?"
    back: Serum creatinine, INR and serum bilirubin. Range 6-40. Adding serum sodium (MELD-Na) improves its predictive ability.
    src: { page: 14 }
    status: unverified
    tags: [high-yield]
    update:
      text: US organ allocation moved to MELD 3.0 in July 2023 (adds sex and albumin). Answer with MELD / MELD-Na in the exam, as the book does.
      ref: OPTN/UNOS MELD 3.0 policy, July 2023
  # ---------- p15-16: general treatment ----------
  - id: hb.L01.063
    kind: cloze
    topic: treatment
    text: "Diet in cirrhosis: {{c1::35-40}} kcal/kg/day and protein {{c2::1.2-1.5}} g/kg/day."
    src: { page: 15, quote: "adequate calories (35–40 kcal/kg body weight per day)" }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L01.064
    kind: card
    topic: treatment
    front: When may protein intake be reduced in cirrhosis, and to no less than what?
    back: Only during an acute episode of hepatic encephalopathy, and to no less than 60-80 g/day.
    src: { page: 15, quote: "reduced only in the presence of acute episode of HE to no less than 60–80 g/day" }
    status: unverified
    tags: [numbers]
    update:
      text: Current guidance advises against restricting protein in hepatic encephalopathy; keep 1.2-1.5 g/kg/day. Answer with the book's 60-80 g/day floor in the exam (lecture 20 already follows the newer advice).
      ref: EASL CPG on nutrition in chronic liver disease 2019
  - id: hb.L01.065
    kind: card
    topic: treatment
    front: Why should proton pump inhibitors be avoided in cirrhosis?
    back: They alter the gut microbiota (dysbiosis) and increase the risk of infection and hepatic encephalopathy.
    src: { page: 15 }
    status: unverified
  - id: hb.L01.066
    kind: enumerate
    topic: treatment
    prompt: Which vaccines should patients with cirrhosis receive?
    points: [Hepatitis A, Hepatitis B, Pneumococcal, Yearly influenza, COVID-19 when available]
    pass: 4
    src: { page: 15 }
    status: unverified
  - id: hb.L01.067
    kind: card
    topic: treatment
    front: Which operations carry a particularly bad prognosis in cirrhosis?
    back: Upper abdominal operations on the biliary tract or for peptic ulcer disease.
    src: { page: 16 }
    status: unverified
  - id: hb.L01.068
    kind: card
    topic: treatment
    front: Which non-selective beta blocker does the lecture prefer in cirrhosis?
    back: Carvedilol, over the traditional NSBBs propranolol and nadolol.
    src: { page: 16, quote: "Carvedilol is more preferred than traditional NSBBs propranolol and nadolol" }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.069
    kind: card
    topic: treatment
    front: Aims of treatment in compensated cirrhosis?
    back: Prevent variceal bleeding and decompensation, and detect HCC early. NSBBs should also be considered, when indicated, to prevent decompensation.
    src: { page: 16 }
    status: unverified
  - id: hb.L01.070
    kind: card
    topic: treatment
    front: In variceal bleeding, when should coagulopathy be corrected?
    back: Only after failure to control the bleeding with portal-hypertension-lowering agents and local hemostasis.
    src: { page: 16 }
    status: unverified
  - id: hb.L01.071
    kind: card
    topic: treatment
    front: "Thrombopoietin receptor agonists before procedures in cirrhosis: names and platelet threshold?"
    back: Avatrombopag or lusutrombopag, when the platelet count is below 50,000/cmm and an invasive procedure is planned.
    src: { page: 16 }
    status: unverified
    tags: [numbers]
  # ---------- p17-18: specific treatment, recompensation, LT ----------
  - id: hb.L01.072
    kind: enumerate
    topic: specific-treatment
    prompt: Mention the etiology-specific treatments of cirrhosis.
    points:
      - "Hepatitis C: antivirals to eliminate the virus"
      - "Hepatitis B: antivirals to suppress the virus"
      - "Autoimmune liver disease: steroids and immunosuppressive drugs"
      - "PBC: ursodeoxycholic acid, early and long term"
      - "Wilson disease: chelation therapy"
      - "Hemochromatosis: venesection and iron chelators"
      - "Alcohol: long-term abstinence"
      - "MASH: lifestyle change (weight loss, diet, exercise), statins, antidiabetics, antioxidants, bariatric surgery"
    pass: 6
