  # ---------- Order ----------
  - id: hb.L01.197
    kind: order
    topic: pathogenesis
    prompt: Put the steps of fibrogenesis in cirrhosis in order.
    steps:
      - Chronic liver injury with hepatocellular necrosis
      - Hepatic stellate cells become activated
      - Stellate cells transform into myofibroblasts
      - Collagen is laid down in the space of Disse and along the sinusoids
      - The sinusoids lose their fenestrations (capillarization)
      - Metabolic exchange with hepatocytes is impaired, causing hepatic dysfunction
    src: { page: 3 }
    status: unverified
  - id: hb.L01.198
    kind: order
    topic: pathogenesis
    prompt: Put the development of portal hypertension in cirrhosis in order.
    steps:
      - Intrahepatic vascular resistance increases
      - Portal pressure rises to a critical level
      - Pre-existing portosystemic collaterals open to decompress the portal circulation
      - Splanchnic arteriolar vasodilatation increases portal inflow and aggravates portal hypertension
    src: { page: 4 }
    status: unverified
