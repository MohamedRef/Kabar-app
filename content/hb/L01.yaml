  - id: hb.L01.093
    kind: mcq
    topic: treatment
    stem: "A 60-year-old man with Child B cirrhosis needs a planned dental extraction. Platelets are 38,000/cmm. Besides platelet transfusion, which drug does the lecture suggest to raise platelets before the procedure?"
    options:
      - Prednisolone
      - Intravenous immunoglobulin
      - Avatrombopag
      - Vitamin K
      - Tranexamic acid
    answer: 2
    why:
      - "Steroids treat immune thrombocytopenia, not the hypersplenism and thrombopoietin deficiency of cirrhosis, and they raise infection risk."
      - "IVIG is for immune thrombocytopenia and is not mentioned for cirrhosis."
      - "Correct: thrombopoietin receptor agonists (avatrombopag or lusutrombopag) are used when platelets are below 50,000/cmm before invasive procedures."
      - "Vitamin K addresses clotting factors, not the platelet count."
      - "Tranexamic acid is an antifibrinolytic; it does not raise the platelet count."
    src: { page: 16 }
    status: unverified
  - id: hb.L01.094
    kind: mcq
    topic: cardiopulmonary
    stem: "A 50-year-old woman with cirrhosis has dyspnea that worsens when she sits up. Her PaO2 falls by 6 mmHg from supine to upright, and her A-a gradient on room air is 22 mmHg. Echocardiography shows normal pulmonary pressures. What is the most likely diagnosis?"
    options:
      - Portopulmonary hypertension
      - Hepatic hydrothorax
      - Cirrhotic cardiomyopathy
      - Hepatopulmonary syndrome
      - Hyperdynamic circulatory syndrome
    answer: 3
    why:
      - "PoPH is pulmonary arterial hypertension; her pulmonary pressures are normal."
      - "Hydrothorax is a pleural effusion with ascites; it does not cause orthodeoxia with a widened A-a gradient as its defining feature."
      - "Cirrhotic cardiomyopathy is silent at rest and shows ventricular dysfunction on echo, not orthodeoxia."
      - "Correct: platypnea and orthodeoxia with an A-a gradient above 15 mmHg reflect basal intrapulmonary vasodilatation, the hallmark of HPS."
      - "The hyperdynamic circulation is the background state; it does not by itself define a gas-exchange syndrome."
    src: { page: 21 }
    status: unverified
    tags: [high-yield]
  - id: hb.L01.095
