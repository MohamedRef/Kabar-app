  - id: hb.L01.155
    kind: card
    topic: cardiopulmonary
    front: Which complications of cirrhosis rest on the hyperdynamic circulatory syndrome?
    back: Ascites, hepatorenal syndrome, and hepatopulmonary syndrome.
    src: { page: 19 }
    status: unverified
  - id: hb.L01.156
    kind: card
    topic: cardiopulmonary
    front: Why is cirrhotic cardiomyopathy usually silent at rest, and when does it show?
    back: Systemic vasodilatation reduces afterload and masks the abnormal cardiac function. Under stress, the impaired cardiac response produces congestive heart failure.
    src: { page: 20 }
    status: unverified
  - id: hb.L01.157
    kind: card
    topic: cardiopulmonary
    front: Pathogenesis of portopulmonary hypertension?
    back: Vasoactive mediators from the splanchnic circulation, normally cleared by the liver, reach the lungs through portosystemic shunts, raising pulmonary vascular resistance and injuring pulmonary vessels.
    src: { page: 20 }
    status: unverified
  - id: hb.L01.158
    kind: card
    topic: cardiopulmonary
    front: Treatment of portopulmonary hypertension in the lecture?
    back: No treatment in mild PoPH; otherwise liver transplantation and diuretics.
    src: { page: 20 }
    status: unverified
  - id: hb.L01.159
    kind: card
    topic: cardiopulmonary
    front: Pathogenesis of hepatopulmonary syndrome?
    back: Pulmonary vascular dilatation from increased nitric oxide production, driven by increased hepatic endothelin-1 and pulmonary ET-B. This impairs gas exchange, widening the A-a gradient and causing hypoxemia.
    src: { page: 21 }
    status: unverified
  - id: hb.L01.160
    kind: card
    topic: cardiopulmonary
    front: Most common presenting symptom of hepatopulmonary syndrome, and its physical signs?
    back: Dyspnea on exertion or at rest. Signs are digital clubbing, cyanosis, and spider angiomas.
    src: { page: 21 }
    status: unverified
  - id: hb.L01.161
    kind: card
    topic: cardiopulmonary
    front: Medical treatment of hepatopulmonary syndrome?
    back: No approved medical therapy. Oxygen is recommended for severe hypoxemia to improve exercise tolerance and quality of life.
    src: { page: 21 }
    status: unverified
