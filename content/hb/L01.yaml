  - { id: causes, title: "Causes of cirrhosis" }
  - { id: pathogenesis, title: "Pathogenesis and portal hypertension" }
  - { id: presentation, title: "Clinical picture, compensated and decompensated" }
  - { id: aclf, title: "Acute-on-chronic liver failure" }
  - { id: diagnosis, title: "Imaging, biopsy and non-invasive tests" }
  - { id: labs, title: "Laboratory findings and etiology tests" }
  - { id: prognosis, title: "Prognosis, Child-Pugh and MELD" }
  - { id: treatment, title: "General measures and treatment of complications" }
