      - APRI
    answer: 1
    why:
      - "FIB-4 is a simple blood-based score, not the gold standard."
      - "Correct: liver biopsy (usually US- or CT-guided) is the gold standard and may also show the etiology and activity."
      - "TE is the most validated non-invasive tool, but it is not the gold standard."
      - "Multiphase CT characterises nodules and HCC; it does not establish fibrosis stage."
      - "APRI is a simple blood-based score, not the gold standard."
    src: { page: 10 }
    status: unverified
