    stem: "A 45-year-old man with chronic HBV has an equivocal FIB-4 and a liver stiffness of 13 kPa. The team wants the gold-standard test to confirm cirrhosis. Which test is it?"
    options:
      - FIB-4 repeated after 3 months
      - Liver biopsy
