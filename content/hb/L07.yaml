    kind: mcq
    topic: serology
    stem: A nursing student's pre-employment screen shows HBsAg negative, anti-HBc negative, anti-HBs 120 mIU/mL. What does this mean?
    options:
      - Recovered HBV infection
      - Immunity after vaccination
      - Occult HBV
      - Window period of acute HBV
      - Needs HBIG now
    answer: 1
    why:
      - Recovery would also give IgG anti-HBc.
      - Correct. Anti-HBs alone means vaccine immunity.
      - Occult HBV usually has anti-HBc.
      - The window period has anti-HBc IgM.
