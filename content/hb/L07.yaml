  # --- MCQs ---
  - id: hb.L07.071
    kind: mcq
    topic: serology
    stem: A 27-year-old man has jaundice 6 weeks after unprotected sex. ALT 1,450 IU/L. HBsAg negative, anti-HBc IgM positive, anti-HBs negative. What is the diagnosis?
    options:
      - Chronic HBV
      - Acute HBV in the window period
      - Past HBV with immunity
      - Immunity after vaccination
      - Occult HBV
    answer: 1
    why:
      - Chronic HBV needs HBsAg positivity with IgG anti-HBc.
      - Correct. HBsAg has gone and anti-HBs has not yet appeared; anti-HBc IgM marks acute infection.
      - Past infection shows IgG anti-HBc with anti-HBs.
      - Vaccination gives anti-HBs alone.
      - Occult HBV is IgG anti-HBc with HBV DNA and no HBsAg, not IgM in an acute illness.
    src: { page: 115 }
    status: unverified
    tags: [high-yield]
