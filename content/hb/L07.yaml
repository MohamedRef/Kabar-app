items:
  # --- Virology (p113) ---
  - id: hb.L07.001
    kind: enumerate
    topic: virology
    prompt: Name the components of the HBV virion shown in the lecture's diagram.
    points:
      - Envelope carrying HBsAg
      - Nuclear capsid (HBcAg)
      - HBeAg
      - DNA polymerase
      - Viral DNA inside the capsid
    pass: 4
    src: { page: 113 }
    status: unverified
  - id: hb.L07.002
    kind: cloze
    topic: virology
    text: "HBV has {{c1::10}} genotypes, labelled {{c2::A to J}}."
    src: { page: 113 }
    status: unverified
    tags: [numbers]
  - id: hb.L07.003
    kind: card
    topic: virology
    front: Which HBV genotype responds better to interferon?
    back: Genotype A.
    src: { page: 113 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.004
    kind: card
    topic: virology
    front: Which HBV genotype has delayed HBeAg seroconversion and a higher HCC risk?
    back: Genotype C.
    src: { page: 113 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.005
    kind: card
    topic: virology
    front: In the HBV life cycle, what forms in the nucleus after uncoating and serves as the transcription template?
    back: cccDNA (covalently closed circular DNA).
    src: { page: 113 }
    status: unverified
  - id: hb.L07.006
    kind: card
    topic: virology
    front: Which steps of the HBV life cycle do nucleos(t)ide analogues block?
    back: Reverse transcription of pregenomic RNA, i.e. negative-strand and positive-strand HBV DNA synthesis inside the capsid.
    src: { page: 113 }
    status: unverified

  # --- Acute HBV (p114-116) ---
  - id: hb.L07.007
    kind: cloze
    topic: acute
    text: "The incubation period of acute HBV is {{c1::1 to 4 months}}."
    src: { page: 114 }
    status: unverified
    tags: [numbers]
  - id: hb.L07.008
    kind: cloze
    topic: acute
    text: "Without prophylaxis, perinatal HBV transmission is {{c1::85–90%}} from HBeAg-positive mothers and about {{c2::30%}} from HBeAg-negative mothers."
    src: { page: 114 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L07.009
    kind: card
    topic: acute
    front: Can an HBsAg-positive mother breastfeed?
    back: Yes. HBsAg can be found in breast milk, but there is no evidence that breastfeeding transmits HBV.
    src: { page: 114 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.010
    kind: enumerate
    topic: acute
    prompt: Mention the three clinical forms of acute HBV.
    points:
      - Asymptomatic, with raised transaminases only
      - Anicteric, with GI and influenza-like symptoms but no jaundice
      - Classic icteric hepatitis in 3 stages
    pass: 3
    src: { page: 114 }
    status: unverified
  - id: hb.L07.011
    kind: order
    topic: acute
    prompt: Put the stages of classic acute hepatitis B in order.
    steps:
      - "Prodromal (3–4 days): malaise, fever, anorexia, nausea, vomiting, abdominal pain"
      - "Icteric (1–4 weeks): dark urine then jaundice and itching; patient feels better; tender hepatomegaly"
      - Convalescent
    src: { page: 114 }
    status: unverified
  - id: hb.L07.012
    kind: cloze
    topic: acute
    text: "Classic acute HBV: the prodrome lasts {{c1::3–4 days}} and the icteric phase {{c2::1–4 weeks}}."
    src: { page: 114 }
    status: unverified
    tags: [numbers]
  - id: hb.L07.013
    kind: card
    topic: acute
    front: In the icteric phase of acute HBV, how does the patient feel?
    back: Generally better, with appetite returning, even as jaundice and itching appear after the urine darkens.
    src: { page: 114 }
    status: unverified
  - id: hb.L07.014
    kind: cloze
    topic: acute
    text: "About {{c1::70%}} of acute HBV is subclinical or anicteric; only {{c2::30%}} is icteric."
    src: { page: 114 }
    status: unverified
    tags: [numbers]
  - id: hb.L07.015
    kind: card
    topic: acute
    front: What immune syndrome can appear in the HBV prodrome?
    back: A serum sickness–like syndrome with fever, skin rash and arthralgia.
    src: { page: 114 }
    status: unverified
  - id: hb.L07.016
    kind: cloze
    topic: acute
    text: "Fewer than {{c1::1%}} of patients with acute hepatitis B develop acute liver failure."
    src: { page: 115 }
    status: unverified
    tags: [numbers]
  - id: hb.L07.017
    kind: card
    topic: acute
    front: Transaminases in acute HBV, when do they peak and how high?
    back: They peak 1–2 days before or after the onset of jaundice, at more than 10× ULN.
    src: { page: 115 }
    status: unverified
  - id: hb.L07.018
    kind: card
    topic: acute
    front: Besides transaminases, which lab results go with acute HBV?
    back: Bilirubin and ALP usually raised, PT prolonged.
    src: { page: 115 }
    status: unverified
  - id: hb.L07.019
    kind: enumerate
    topic: acute
    prompt: Enumerate the characteristics of severe acute hepatitis B.
    points:
      - Coagulopathy (INR >1.5)
      - Protracted course (persistent symptoms or marked jaundice for more than 4 weeks)
      - Hepatic encephalopathy or ascites
    pass: 3
    src: { page: 115 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.020
    kind: card
    topic: acute
    front: Treatment of acute hepatitis B?
    back: Symptomatic and supportive; antivirals (double-dose lamivudine, entecavir or tenofovir) only in severe acute hepatitis B.
    src: { page: 115 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.021
    kind: enumerate
    topic: acute
    prompt: Why should antivirals be used judiciously in early HBV infection?
    points:
      - Adverse effects such as nephrotoxicity and lactic acidosis
      - Resistance
      - Withdrawal flare
      - Extra caution in pregnancy, the elderly and renal impairment
      - Fast drop in HBV proteins may lessen antigen presentation and blunt immunity against HBV
    pass: 3
    src: { page: 116 }
    status: unverified
  - id: hb.L07.022
    kind: cloze
    topic: acute
    text: "About {{c1::90%}} of acute HBV in infants becomes chronic, versus about {{c2::10%}} in adults."
    src: { page: 116 }
    status: unverified
    tags: [numbers, high-yield]

  # --- Serology (p115, p118) ---
  - id: hb.L07.023
    kind: card
    topic: serology
    front: In acute HBV, which marker remains after HBsAg disappears and before anti-HBs appears (the window)?
    back: Anti-HBc IgM (with total anti-HBc).
    src: { page: 115 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.024
    kind: card
    topic: serology
    front: In the acute HBV serology curve, which marker stays positive for life?
    back: Total anti-HBc.
    src: { page: 115 }
    status: unverified
  - id: hb.L07.025
    kind: card
    topic: serology
    front: Which three markers make up the HBV screening panel in the lecture's algorithm?
    back: HBsAg, IgG anti-HBc and anti-HBs.
    src: { page: 118 }
    status: unverified
  - id: hb.L07.026
    kind: table
    topic: serology
    title: Interpreting the HBV serology panel (book algorithm)
    columns: [HBsAg, Anti-HBc, Anti-HBs, Meaning]
    rows:
      - ["+", "IgM +", "−", "Acute HBV: follow clinical course for resolution"]
      - ["+", "IgG +", "−", "Likely chronic HBV"]
      - ["−", "IgG +", "−", "Occult HBV or false-positive anti-HBc: repeat in 4–6 weeks, check anti-HBe and HBV DNA"]
      - ["−", "IgG +", "+", "Immunity after recovery from HBV infection"]
      - ["−", "−", "+", "Immunity after vaccination"]
    blanks: [[0, 3], [1, 3], [2, 3], [3, 3], [4, 3]]
    src: { page: 118 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.027
    kind: card
    topic: serology
    front: HBsAg positive. What extra tests does the algorithm ask for?
    back: Liver panel, HBeAg, anti-HBe and HBV DNA.
    src: { page: 118 }
    status: unverified

  # --- Chronic HBV and phases (p116-118) ---
  - id: hb.L07.028
    kind: card
    topic: phases
    front: Symptoms and signs of chronic HBV?
    back: Often none; some have fatigue or RUQ discomfort. Exam may be normal or show mild hepatomegaly, or signs of cirrhosis.
    src: { page: 116 }
    status: unverified
  - id: hb.L07.029
    kind: order
    topic: phases
    prompt: Put the phases of chronic HBV in their natural order (EASL nomenclature).
    steps:
      - HBeAg-positive chronic infection
      - HBeAg-positive chronic hepatitis
      - HBeAg-negative chronic infection
      - HBeAg-negative chronic hepatitis
      - HBsAg loss
    src: { page: 117 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.030
    kind: table
    topic: phases
    title: Phases of chronic HBV (book table)
    columns: [Phase, HBsAg, HBeAg, HBV DNA, ALT, Liver disease, Old name]
    rows:
      - ["HBeAg+ chronic infection", "High", "Positive", ">10^7 IU/mL", "Normal", "None or minimal", "Immune tolerant"]
      - ["HBeAg+ chronic hepatitis", "High or intermediate", "Positive", "10^4–10^7 IU/mL", "Elevated", "Moderate or severe", "Immune reactive HBeAg positive"]
      - ["HBeAg− chronic infection", "Low", "Negative", "<2,000 IU/mL", "Normal", "None", "Inactive carrier"]
      - ["HBeAg− chronic hepatitis", "Intermediate", "Negative", ">2,000 IU/mL", "Elevated", "Moderate or severe", "HBeAg-negative chronic hepatitis"]
    blanks: [[0, 3], [0, 6], [1, 4], [2, 3], [2, 6], [3, 3], [3, 4]]
    src: { page: 117 }
    status: unverified
    tags: [high-yield, numbers]
  - id: hb.L07.031
    kind: cloze
    topic: phases
    text: "The old term \"inactive carrier\" is now {{c1::HBeAg-negative chronic infection}}: HBeAg negative, HBV DNA {{c2::<2,000 IU/mL}}, normal ALT."
    src: { page: 117 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.032
    kind: cloze
    topic: phases
    text: "The old term \"immune tolerant\" is now {{c1::HBeAg-positive chronic infection}}: HBV DNA {{c2::>10^7 IU/mL}}, normal ALT, minimal fibrosis."
    src: { page: 117 }
    status: unverified
  - id: hb.L07.033
    kind: card
    topic: phases
    front: Which chronic HBV phase has moderate to severe fibrosis with fluctuating ALT and DNA after HBeAg loss?
    back: HBeAg-negative chronic hepatitis.
    src: { page: 117 }
    status: unverified
  - id: hb.L07.034
    kind: card
    topic: phases
    front: Which transmission route leads into the immune-tolerant phase, and which enters at the HBeAg+ immune-active phase?
    back: Perinatal transmission leads to the immune-tolerant phase; horizontal transmission enters at the HBeAg-positive immune-active phase.
    src: { page: 117 }
    status: unverified
  - id: hb.L07.035
    kind: enumerate
    topic: phases
    prompt: Mention the extrahepatic manifestations of HBV.
    points:
      - Polyarteritis nodosa
      - Glomerulonephritis
      - Essential mixed cryoglobulinemia
      - "Papular acrodermatitis: symmetrical, erythematous, maculopapular, non-itchy"
    pass: 3
    src: { page: 118 }
    status: unverified
    tags: [high-yield]

  # --- Who to treat and monitoring (p118-120) ---
  - id: hb.L07.036
    kind: enumerate
    topic: treat-who
    prompt: The decision to treat chronic HBV rests on which three criteria?
    points: [Serum HBV DNA level, Serum ALT level, Severity of liver disease]
    pass: 3
    src: { page: 118 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.037
    kind: card
    topic: treat-who
    front: Do treatment indications differ between HBeAg-positive and HBeAg-negative chronic HBV?
    back: No, they are generally the same.
    src: { page: 118 }
    status: unverified
  - id: hb.L07.038
    kind: order
    topic: treat-who
    prompt: "Who to treat (book algorithm): order the decisions for a non-cirrhotic chronic HBV patient."
    steps:
      - "Check HBV DNA: below 2,000 IU/mL means no treatment"
      - "HBV DNA above 2,000 IU/mL: check ALT"
      - "ALT abnormal: treat"
      - "ALT normal: no treatment; liver biopsy or FibroScan if older than 30"
      - "FibroScan above 9 kPa (severe fibrosis): treat; if no biopsy or FibroScan, observe"
    src: { page: 119 }
    status: unverified
  - id: hb.L07.039
    kind: cloze
    topic: treat-who
    text: "In the book's treatment algorithm, the ALT upper limit of normal is {{c1::40 IU/L}}, and FibroScan above {{c2::9 kPa}} means severe fibrosis."
    src: { page: 119 }
    status: unverified
    tags: [numbers]
  - id: hb.L07.040
    kind: card
    topic: treat-who
    front: HBV DNA >2,000 IU/mL with normal ALT. When does the algorithm ask for biopsy or FibroScan?
    back: If the patient is older than 30 years. Otherwise observe.
    src: { page: 119 }
    status: unverified
  - id: hb.L07.041
    kind: table
    topic: treat-who
    title: Monitoring untreated chronic HBV
    columns: [Group, Interval]
    rows:
      - ["HBeAg-positive", "Every 3–6 months"]
      - ["HBeAg-negative", "Every 6–12 months"]
      - ["HBeAg-negative chronic infection with HBV DNA >2,000 IU/mL", "Every 3 months for the first year, then every 6 months"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 120 }
    status: unverified
    tags: [numbers]

  # --- Drugs, duration, resistance (p119-121) ---
  - id: hb.L07.042
    kind: table
    topic: drugs
    title: Oral drugs for chronic HBV (book table)
    columns: [Generic, Trade name, Daily dose]
    rows:
      - ["Lamivudine", "Zeffix", "100 mg"]
      - ["Adefovir", "Hepsera", "10 mg"]
      - ["Entecavir", "Baraclude", "0.5–1 mg"]
      - ["Tenofovir (TDF)", "Viread", "300 mg"]
      - ["Tenofovir alafenamide (TAF)", "(book: Tenofenamide)", "25 mg"]
    blanks: [[0, 2], [2, 2], [3, 2], [4, 2]]
    src: { page: 119 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L07.043
    kind: card
    topic: drugs
    front: How is pegylated interferon given for HBV, and what are the two brands in the lecture?
    back: Subcutaneously. Peg-Intron and Pegasys.
    src: { page: 119 }
    status: unverified
  - id: hb.L07.044
    kind: card
    topic: drugs
    front: First-line drugs for chronic HBV, and why?
    back: Entecavir, tenofovir and peginterferon alfa-2a, for superior efficacy, tolerability and favorable resistance profiles.
    src: { page: 119 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.045
    kind: card
    topic: drugs
    front: How long are NAs given in HBeAg-positive patients who seroconvert to anti-HBe?
    back: Stop after 12 months of consolidation following HBeAg seroconversion.
    src: { page: 120 }
    status: unverified
  - id: hb.L07.046
    kind: card
    topic: drugs
    front: Treatment duration in HBeAg-negative chronic hepatitis B?
    back: Long-term, until HBsAg seroconversion.
    src: { page: 120 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.047
    kind: card
    topic: drugs
    front: Endpoint at which any HBV patient may stop treatment, per the duration figure?
    back: HBsAg seroconversion.
    src: { page: 120 }
    status: unverified
  - id: hb.L07.048
    kind: cloze
    topic: drugs
    text: "Cumulative lamivudine resistance reaches {{c1::24%}} at 1 year and {{c2::70%}} at 5 years; entecavir only {{c3::1.2%}} at 5 years."
    src: { page: 121 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L07.049
    kind: card
    topic: drugs
    front: Which two NAs show 0% resistance in the lecture's chart?
    back: Tenofovir disoproxil (TDF) and tenofovir alafenamide (TAF).
    src: { page: 121 }
    status: unverified
  - id: hb.L07.050
    kind: cloze
    topic: drugs
    text: "Adefovir resistance reaches {{c1::29%}} at 5 years; telbivudine {{c2::17%}} at 2 years."
    src: { page: 121 }
    status: unverified
    tags: [numbers]
  - id: hb.L07.051
    kind: table
    topic: drugs
    title: Rescue strategies for NA resistance (book table)
    columns: [Resistance, Rescue]
    rows:
      - ["Lamivudine", "Switch to TDF or TAF"]
      - ["Telbivudine", "Switch to TDF or TAF"]
      - ["Entecavir", "Switch to TDF or TAF"]
      - ["Adefovir", "LAM-naive: switch to ETV, TDF or TAF. LAM-resistant: switch to TDF or TAF. DNA plateau: add ETV or switch to ETV"]
      - ["TDF or TAF", "LAM-naive: switch to ETV. LAM-resistant: add ETV"]
      - ["Multidrug", "Switch to ETV plus TDF or TAF combination"]
    blanks: [[0, 1], [2, 1], [4, 1], [5, 1]]
    src: { page: 121 }
    status: unverified
    tags: [high-yield]

  # --- Cirrhosis (p120) ---
  - id: hb.L07.052
    kind: card
    topic: cirrhosis
    front: Which HBV patients with cirrhosis need treatment?
    back: All with compensated or decompensated cirrhosis and any detectable HBV DNA, regardless of ALT.
    src: { page: 120 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.053
    kind: enumerate
    topic: cirrhosis
    prompt: Mention the principles of treating HBV cirrhosis.
    points:
      - Treat with any detectable HBV DNA, regardless of ALT
      - Use an NA with a high barrier to resistance
      - Assess for liver transplantation
      - In decompensated cirrhosis, adjust all NAs to renal function
    pass: 3
    src: { page: 120 }
    status: unverified
  - id: hb.L07.054
    kind: cloze
    topic: cirrhosis
    text: "With NA therapy in decompensated HBV cirrhosis, about {{c1::35%}} can be delisted for transplant, and Child-Pugh improves by more than 2 points in {{c2::40–50%}}."
    src: { page: 120 }
    status: unverified
    tags: [numbers]

  # --- Special groups (p121-123) ---
  - id: hb.L07.055
    kind: cloze
    topic: special
    text: "Healthcare workers doing exposure-prone procedures with HBV DNA above {{c1::200 IU/mL}} may be treated with an NA to cut transmission risk."
    src: { page: 121 }
    status: unverified
    tags: [numbers]
  - id: hb.L07.056
    kind: card
    topic: special
    front: HBV/HCV co-infection treated with DAAs. Who gets an NA, and how are the others followed?
    back: Those meeting standard HBV treatment criteria get an NA. Others are monitored and tested for HBV reactivation if ALT rises.
    src: { page: 121 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.057
    kind: card
    topic: special
    front: Define occult HBV.
    back: HBV DNA detected without HBsAg. DNA is usually in the liver, with undetectable or low levels in serum; anti-HBc is usually positive.
    src: { page: 122, quote: "The detection of HBV DNA in the absence of HBsAg." }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.058
    kind: card
    topic: special
    front: In whom is occult HBV more common, and why?
    back: In cirrhosis and HCC. Many had chronic HBV for decades, but HBsAg is gone by the time cirrhosis or HCC is found.
    src: { page: 122 }
    status: unverified
  - id: hb.L07.059
    kind: order
    topic: special
    prompt: Order the steps for a pregnant woman with chronic HBV (book algorithm).
    steps:
      - "1st trimester: assess HBV replication and liver disease (treat with tenofovir if active disease or advanced fibrosis)"
      - "End of 2nd trimester: quantitative HBV DNA and ALT"
      - "HBV DNA >200,000 IU/mL: consider tenofovir, lamivudine or telbivudine at 28–32 weeks"
      - "At birth: infant receives HBIG plus vaccine"
    src: { page: 123 }
    status: unverified
    update:
      text: "EASL advises tenofovir disoproxil (TDF) prophylaxis from week 24–28 when HBV DNA >200,000 IU/mL, continued up to 12 weeks after delivery; telbivudine is no longer marketed."
      ref: "EASL CPG on HBV 2017"
  - id: hb.L07.060
    kind: cloze
    topic: special
    text: "In pregnancy, antiviral prophylaxis is considered when HBV DNA exceeds {{c1::200,000 IU/mL}}, starting at {{c2::28–32}} weeks (book)."
    src: { page: 123 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L07.061
    kind: card
    topic: special
    front: Infant of an HBsAg-positive mother with HBV DNA below 200,000 IU/mL. What does the infant get?
    back: HBIG plus vaccine at birth (the mother is monitored, no antiviral).
    src: { page: 123 }
    status: unverified

  # --- Reactivation (p123-124) ---
  - id: hb.L07.062
    kind: card
    topic: reactivation
    front: Before immunosuppression, which HBV markers are screened?
    back: HBsAg and anti-HBc.
    src: { page: 123 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.063
    kind: table
    topic: reactivation
    title: HBV before immunosuppression (book algorithm)
    columns: [Serology, Action]
    rows:
      - ["HBsAg−, anti-HBc−, anti-HBs+", "Vaccinated: nothing needed"]
      - ["HBsAg−, anti-HBc−, anti-HBs−", "Naive: vaccinate if indicated"]
      - ["HBsAg−, anti-HBc+, moderate-risk IS", "Monitor ALT, HBV DNA, HBsAg every 1–3 months; treat if reactivation"]
      - ["HBsAg−, anti-HBc+, high-risk IS (B-cell depleting, SCT)", "Start antiviral prophylaxis"]
      - ["HBsAg+, anti-HBc+ (CHB)", "Start antiviral prophylaxis"]
    blanks: [[2, 1], [3, 1], [4, 1]]
    src: { page: 123 }
    status: unverified
    tags: [high-yield]
  - id: hb.L07.064
    kind: table
    topic: reactivation
    title: Definitions of HBV reactivation (book)
    columns: [Group, Reactivation is]
    rows:
      - ["HBsAg+/anti-HBc+, baseline DNA undetectable", "HBV DNA ≥1,000 IU/mL"]
      - ["HBsAg+/anti-HBc+, baseline DNA detectable", "≥100-fold rise in HBV DNA"]
      - ["HBsAg−/anti-HBc+", "Detectable HBV DNA or reappearance of HBsAg"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 123 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L07.065
    kind: cloze
    topic: reactivation
    text: "A clinical hepatitis flare is ALT rising to at least {{c1::3 times baseline}} and above {{c2::100 U/L}}."
    src: { page: 124 }
    status: unverified
    tags: [numbers, high-yield]
  - id: hb.L07.066
    kind: card
    topic: reactivation
    front: Immunosuppressed patient with HBV reactivation and normal ALT. Treat?
    back: Yes. Start antivirals as early as possible, regardless of ALT.
    src: { page: 124 }
    status: unverified
  - id: hb.L07.067
    kind: cloze
    topic: reactivation
    text: "Severe hepatitis or hepatic failure develops in {{c1::25–50%}} of patients with HBV reactivation."
    src: { page: 124 }
    status: unverified
    tags: [numbers]

  # --- Post-exposure prophylaxis (p124) ---
  - id: hb.L07.068
    kind: table
    topic: pep
    title: HBV post-exposure prophylaxis (book)
