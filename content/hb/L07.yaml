      - Liver biopsy before any decision
      - Peginterferon is contraindicated, so observe
      - Treat only if HBeAg turns positive
    answer: 1
    why:
      - DNA >2,000 with abnormal ALT is a treatment indication.
      - Correct. HBV DNA >2,000 IU/mL with abnormal ALT (ULN 40) means treat.
      - Biopsy or FibroScan is for normal ALT in those over 30.
      - Nothing contraindicates therapy here, and NAs are first line too.
