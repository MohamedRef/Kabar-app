  - id: hb.L07.075
    kind: mcq
    topic: cirrhosis
    stem: A 58-year-old man with HBV cirrhosis (Child B) has HBV DNA 150 IU/mL and normal ALT. What is the right management?
    options:
      - No treatment because DNA is below 2,000 IU/mL
      - No treatment because ALT is normal
      - Start an NA with a high barrier to resistance and assess for transplant
      - Start lamivudine
      - Start peginterferon
    answer: 2
    why:
      - In cirrhosis any detectable DNA is an indication.
      - ALT does not matter in cirrhosis.
      - Correct. Treat any detectable DNA with a high-barrier NA, adjust to renal function, and assess for transplant.
      - Lamivudine has a low barrier to resistance (70% at 5 years).
