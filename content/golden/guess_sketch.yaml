# Golden set: guess_sketch (Gambar!, docs/SPEC.md §4, §19).
# input: {target_word?, capture?}; the sketch image goes in `image` once captured.
# expect: {guess_id, alternatives[]}: guess_id is the Indonesian lemma in snake_case (rumah, kucing, sepeda).
# Every item needs a real capture: tag needs-capture, draw exactly what input.capture says,
# save under fixtures/golden/guess_sketch/<id>.png, then set `image`.
task: guess_sketch
version: 1
rubric: |
  3 = guess_id equals expect.guess_id; 2 = guess_id is in expect.alternatives (a fair reading of the sketch) or expect.guess_id is the engine's first alternative; 1 = the right word appears somewhere in alternatives; 0 = otherwise.
  guess_id is always one Indonesian lemma in snake_case (kucing, not "cat", "Kucing" or "seekor kucing"); multiword lemmas use underscores (nasi_goreng).
  Judge the drawing, not the target: when target_word is given but the sketch shows something else, the honest guess wins and echoing the target scores 0.
  alternatives are 1-3 distinct, plausible Indonesian lemmas for the same sketch, never the guess itself.
  A blank canvas or pure scribble has no right answer: the honest result is guess_id "tidak_jelas" (unclear) with empty alternatives.
items:
