# Golden set for analyze_text (docs/SPEC.md §11, §19). Shapes: content/golden/README.md.
# input = {text, words[]}: words is the deterministic tokenizer's word list
# (crates/core/src/lang/token.rs, punctuation and emoji dropped, original casing).
# expect = AnalyzeText (crates/core/src/ai/tasks.rs), exactly one token per word.
# Nothing here is learner-reviewed yet; Javanese stays unverified until a native speaker checks it.
task: analyze_text
version: 1
rubric: |
  - One token per input word, in order, with i = the word's index; no tokens for punctuation or emoji, and surface copied exactly.
  - Meaning in context beats dictionary meaning: chat spellings and abbreviations are expanded in lemma (arp -> arep, udh -> sudah, nomin -> no minus).
  - lang is right per token: Javanese words in a Javanese line are jv (shared loans like lapor may be id), English loans are en, names and numbers other.
  - translation_en is natural English; translation_ar is natural Egyptian Arabic in Arabic script, not MSA and not a word-for-word gloss.
  - register uses the prompt's set (chat, formal, neutral, slang, krama, ngoko, mixed) and fits the text.
  - Real uncertainty (e.g. dhe = Pakdhe or Budhe) is shown with confident false or a hedging note; inventing a confident wrong meaning scores 0.
  - False friends and meaning shifts (kalimat, mungkin, larang, bisa, ojo/aja) must be caught in gloss or note; missing one caps the score at 1.
items:
- id: analyze_text-001
  lang: jv
  input:
    text: Sek tak lapor pusat
    words: [Sek, tak, lapor, pusat]
  expect:
    translation_en: Hold on, I'll report to HQ.
    translation_ar: استنى، هبلّغ الإدارة.
    register: ngoko
    tokens:
    - i: 0
      surface: Sek
      lang: jv
      lemma: sek
      gloss_en: hold on, wait a sec
      gloss_ar: استنى ثانية
      note: Chat spelling of sik / sedhela.
      confident: true
    - i: 1
      surface: tak
      lang: jv
      lemma: tak
      gloss_en: 'I''ll (1st-person proclitic: I + verb)'
      gloss_ar: أنا هـ…
      note: Javanese tak- before a verb = I (will) do it; not Indonesian tak = not.
      confident: true
    - i: 2
      surface: lapor
      lang: id
      lemma: lapor
      gloss_en: report
      gloss_ar: أبلّغ
      note: Same word in Indonesian and Javanese.
      confident: true
    - i: 3
      surface: pusat
      lang: id
      lemma: pusat
      gloss_en: center, HQ
      gloss_ar: الإدارة / المركز
      note: null
      confident: true
  criteria:
  - tak is read as the Javanese first-person proclitic (I'll), not as Indonesian tak = not
  - 'lapor and pusat may be tagged id or jv: they are shared words'
  - translation_ar is Egyptian Arabic
  avoid:
  - Translating tak as a negation ("don't report")
  - Labels a Javanese word as Indonesian (or invents an Indonesian meaning) when the Javanese reading
    is the one that fits
  tags:
  - spec-24
  - chat
  - javanese
  - proclitic
  verified: false
- id: analyze_text-002
  lang: jv
  input:
    text: ng prabowo?
    words: [ng, prabowo]
  expect:
    translation_en: To Prabowo?
    translation_ar: لبرابوو؟
    register: ngoko
    tokens:
    - i: 0
      surface: ng
      lang: jv
      lemma: nang
      gloss_en: to
      gloss_ar: لـ / عند
      note: ng = chat spelling of nang (to).
      confident: true
    - i: 1
      surface: prabowo
      lang: other
      lemma: Prabowo
      gloss_en: Prabowo (a name)
      gloss_ar: برابوو (اسم)
      note: Proper noun written in lower case; in this joke it most likely means President Prabowo.
      confident: true
  criteria:
  - ng is expanded to nang (to)
  - prabowo is treated as a proper noun even though it is written in lower case
  avoid:
  - Treating ng as the Indonesian/Javanese nasal prefix or as a typo for 'nggak'
  - Glossing prabowo as a common noun
  tags:
  - spec-24
  - chat
  - javanese
  - proper-noun
  - abbreviation
  verified: false
- id: analyze_text-003
  lang: jv
  input:
    text: piye dhe
    words: [piye, dhe]
  expect:
    translation_en: So, what do you think, Uncle?
    translation_ar: إيه رأيك يا عمّو؟
    register: ngoko
    tokens:
    - i: 0
      surface: piye
      lang: jv
      lemma: piye
      gloss_en: how; what do you think
      gloss_ar: إزاي / إيه رأيك
      note: null
      confident: true
    - i: 1
      surface: dhe
      lang: jv
      lemma: dhe
      gloss_en: uncle / auntie (friendly address)
      gloss_ar: يا عمّو / يا خالتو
      note: Probably short for Pakdhe or Budhe (an older uncle/aunt, or any older neighbour); the context
        can't tell which.
      confident: false
  criteria:
  - piye is glossed as how / what do you think
  - dhe is read as a term of address (Pakdhe / Budhe) and marked not confident, or with a note saying
    it is a guess
  avoid:
  - Inventing a confident meaning for dhe without any hedge
  - Reading dhe as Indonesian 'dek' (younger sibling) with certainty
  tags:
  - spec-24
  - chat
  - javanese
  - address-term
  - ambiguous
  verified: false
- id: analyze_text-004
  lang: jv
  input:
    text: arp dicul piro
    words: [arp, dicul, piro]
  expect:
    translation_en: How much will you sell it for?
    translation_ar: هتبيعه بكام؟
    register: ngoko
    tokens:
    - i: 0
      surface: arp
      lang: jv
      lemma: arep
      gloss_en: going to, want to
      gloss_ar: هـ / ناوي
      note: arp = chat spelling of arep.
      confident: true
    - i: 1
      surface: dicul
      lang: jv
      lemma: diculke
      gloss_en: be let go of, be sold
      gloss_ar: يتباع / تسيبه
      note: 'dicul = di- + (u)cul, short for diculke: let it go, here ''sell it''.'
      confident: true
    - i: 2
      surface: piro
      lang: jv
      lemma: pira
      gloss_en: how much
      gloss_ar: بكام
      note: piro is the spoken spelling of pira.
      confident: true
  criteria:
  - arp is expanded to arep, piro to pira
  - dicul is understood as letting go / selling (passive), not as a typo
  - translation is a question about the selling price
  avoid:
  - Guessing dicul is Indonesian 'dicolek' or 'dicuil'
  - Labels a Javanese word as Indonesian (or invents an Indonesian meaning) when the Javanese reading
    is the one that fits
  tags:
  - spec-24
  - chat
  - javanese
  - abbreviation
  - market
  verified: false
- id: analyze_text-005
  lang: id
  input:
    text: iphone 17 pm 512gb resmi ibox mulus nomin garansi jalan minat wa
    words: [iphone, '17', pm, 512gb, resmi, ibox, mulus, nomin, garansi, jalan, minat, wa]
  expect:
    translation_en: iPhone 17 Pro Max 512GB, official iBox unit, flawless, no defects, warranty still
      active. Interested? WhatsApp me.
    translation_ar: آيفون 17 برو ماكس 512 جيجا، رسمي من iBox، نضيف، مفيهوش أي عيب، والضمان شغال. لو مهتم
      كلمني واتساب.
    register: chat
    tokens:
    - i: 0
      surface: iphone
      lang: en
      lemma: iPhone
      gloss_en: iPhone
      gloss_ar: آيفون
      note: null
      confident: true
    - i: 1
      surface: '17'
      lang: other
      lemma: '17'
      gloss_en: 17 (model number)
      gloss_ar: 17 (رقم الموديل)
      note: null
      confident: true
    - i: 2
      surface: pm
      lang: en
      lemma: Pro Max
      gloss_en: Pro Max
      gloss_ar: برو ماكس
      note: pm = Pro Max in phone listings.
      confident: true
    - i: 3
      surface: 512gb
      lang: en
      lemma: 512 GB
      gloss_en: 512 GB of storage
      gloss_ar: 512 جيجا
      note: null
      confident: true
    - i: 4
      surface: resmi
      lang: id
      lemma: resmi
      gloss_en: official
      gloss_ar: رسمي
      note: resmi ibox = sold through iBox, Apple's authorized reseller, so the warranty is local.
      confident: true
    - i: 5
      surface: ibox
      lang: other
      lemma: iBox
      gloss_en: iBox (authorized Apple reseller)
      gloss_ar: iBox (موزّع أبل الرسمي)
      note: null
      confident: true
    - i: 6
      surface: mulus
      lang: id
      lemma: mulus
      gloss_en: smooth, flawless
      gloss_ar: نضيف / زي الفل
      note: null
      confident: true
    - i: 7
      surface: nomin
      lang: id
      lemma: no minus
      gloss_en: no defects
      gloss_ar: مفيهوش عيب
      note: 'nomin = no minus: listing slang for ''nothing wrong with it''.'
      confident: true
    - i: 8
      surface: garansi
      lang: id
      lemma: garansi
      gloss_en: warranty
      gloss_ar: ضمان
      note: null
      confident: true
    - i: 9
      surface: jalan
      lang: id
      lemma: jalan
      gloss_en: still running (active)
      gloss_ar: شغال
      note: garansi jalan = the warranty is still active.
      confident: true
    - i: 10
      surface: minat
      lang: id
      lemma: minat
      gloss_en: interested
      gloss_ar: مهتم
      note: minat wa = interested? contact me on WhatsApp.
      confident: true
    - i: 11
      surface: wa
      lang: other
      lemma: WhatsApp
      gloss_en: WhatsApp
      gloss_ar: واتساب
      note: null
      confident: true
  criteria:
  - pm is expanded to Pro Max and nomin to no minus (no defects)
  - garansi jalan is explained as an active warranty, not 'warranty walks'
  - resmi ibox is explained as an official unit from the authorized reseller
  avoid:
  - Literal 'warranty road' / 'walking warranty'
  - Reading pm as p.m. (afternoon)
  - Reading nomin as 'nominal'
  tags:
  - spec-24
  - listing
  - abbreviation
  - numbers
  verified: false
- id: analyze_text-006
  lang: id
  input:
    text: Saya sedang membaca buku.
    words: [Saya, sedang, membaca, buku]
  expect:
    translation_en: I am reading a book.
    translation_ar: أنا بقرا كتاب.
    register: neutral
    tokens:
    - i: 0
      surface: Saya
      lang: id
      lemma: saya
      gloss_en: I
      gloss_ar: أنا
      note: null
      confident: true
    - i: 1
      surface: sedang
      lang: id
      lemma: sedang
      gloss_en: in the middle of (-ing)
      gloss_ar: بـ (دلوقتي)
      note: 'Aspect marker: action in progress.'
      confident: true
    - i: 2
      surface: membaca
      lang: id
      lemma: baca
      gloss_en: reading
      gloss_ar: بقرا
      note: meN- + baca → membaca (active verb).
      confident: true
    - i: 3
      surface: buku
      lang: id
      lemma: buku
      gloss_en: book
      gloss_ar: كتاب
      note: null
      confident: true
  criteria:
  - membaca has lemma baca
  tags:
  - spec-24
  - morphology
  - meN-
  verified: false
- id: analyze_text-007
  lang: id
  input:
    text: Rumahnya dibersihkan kemarin.
    words: [Rumahnya, dibersihkan, kemarin]
  expect:
    translation_en: The house was cleaned yesterday.
    translation_ar: البيت اتنضف إمبارح.
    register: neutral
    tokens:
    - i: 0
      surface: Rumahnya
      lang: id
      lemma: rumah
      gloss_en: the house / his/her house
      gloss_ar: البيت / بيته
      note: 'rumah + -nya: ''the'' or ''his/her/its'', from context.'
      confident: true
    - i: 1
      surface: dibersihkan
      lang: id
      lemma: bersih
      gloss_en: was cleaned
      gloss_ar: اتنضف
      note: 'di- + bersih + -kan: passive of membersihkan (to clean).'
      confident: true
    - i: 2
      surface: kemarin
      lang: id
      lemma: kemarin
      gloss_en: yesterday
      gloss_ar: إمبارح
      note: null
      confident: true
  criteria:
  - Rumahnya → rumah + -nya; dibersihkan → di- + bersih + -kan (passive)
  - Either 'the house' or 'his/her house' is accepted for Rumahnya
  avoid:
  - Translating as active ('He cleaned the house') without noting the passive
  tags:
  - spec-24
  - morphology
  - passive
  - -nya
  verified: false
- id: analyze_text-008
  lang: id
  input:
    text: Anak-anak bermain di taman.
    words: [Anak-anak, bermain, di, taman]
  expect:
    translation_en: The children are playing in the park.
    translation_ar: العيال بيلعبوا في الجنينة.
    register: neutral
    tokens:
    - i: 0
      surface: Anak-anak
      lang: id
      lemma: anak
      gloss_en: children
      gloss_ar: العيال / الأطفال
      note: Full reduplication = plural.
      confident: true
    - i: 1
      surface: bermain
      lang: id
      lemma: main
      gloss_en: play
      gloss_ar: بيلعبوا
      note: ber- + main → bermain.
      confident: true
    - i: 2
      surface: di
      lang: id
      lemma: di
      gloss_en: in, at
      gloss_ar: في
      note: null
      confident: true
    - i: 3
      surface: taman
      lang: id
      lemma: taman
      gloss_en: park, garden
      gloss_ar: جنينة
      note: null
      confident: true
  criteria:
  - Anak-anak is one token with lemma anak and a plural meaning
  - bermain has lemma main
  tags:
  - spec-24
  - morphology
  - reduplication
  - ber-
  verified: false
- id: analyze_text-009
  lang: id
  input:
    text: Kesehatan itu penting.
    words: [Kesehatan, itu, penting]
  expect:
    translation_en: Health is important.
    translation_ar: الصحة حاجة مهمة.
    register: neutral
    tokens:
    - i: 0
      surface: Kesehatan
      lang: id
      lemma: sehat
      gloss_en: health
      gloss_ar: الصحة
      note: ke- + sehat + -an → abstract noun.
      confident: true
    - i: 1
      surface: itu
      lang: id
      lemma: itu
      gloss_en: (topic marker)
      gloss_ar: (أداة بتحدد الموضوع)
      note: Here itu marks the topic; it does not mean 'that'.
      confident: true
    - i: 2
      surface: penting
      lang: id
      lemma: penting
      gloss_en: important
      gloss_ar: مهم
      note: null
      confident: true
  criteria:
  - Kesehatan has lemma sehat with ke-…-an
  - itu is not translated as 'that health'
  avoid:
  - '''That health is important'''
  tags:
  - spec-24
  - morphology
  - ke-an
  - tricky
  verified: false
- id: analyze_text-010
  lang: id
  input:
    text: Apa kabar?
    words: [Apa, kabar]
  expect:
    translation_en: How are you?
    translation_ar: إزيك؟ / أخبارك إيه؟
    register: neutral
    tokens:
    - i: 0
      surface: Apa
      lang: id
      lemma: apa
      gloss_en: what
      gloss_ar: إيه
      note: null
      confident: true
    - i: 1
      surface: kabar
      lang: id
      lemma: kabar
      gloss_en: news
      gloss_ar: أخبار
      note: From Arabic خبر (kh → k).
      confident: true
  criteria:
  - translation is a greeting (How are you?), not 'What news?'
  - kabar is linked to Arabic خبر
  tags:
  - spec-24
  - greeting
  - arabic-bridge
  verified: false
- id: analyze_text-011
  lang: jv
  input:
    text: Kowe wis mangan?
    words: [Kowe, wis, mangan]
  expect:
    translation_en: Have you eaten?
    translation_ar: إنت كلت؟
    register: ngoko
    tokens:
    - i: 0
      surface: Kowe
      lang: jv
      lemma: kowe
      gloss_en: you (ngoko, to friends and younger people)
      gloss_ar: إنت
      note: null
      confident: true
    - i: 1
      surface: wis
      lang: jv
      lemma: wis
      gloss_en: already
      gloss_ar: خلاص
      note: = Indonesian sudah.
      confident: true
    - i: 2
      surface: mangan
      lang: jv
      lemma: mangan
      gloss_en: eat
      gloss_ar: أكلت
      note: null
      confident: true
  criteria:
  - Register is ngoko
  tags:
  - spec-24
  - speech-level
  - ngoko
  verified: false
- id: analyze_text-012
  lang: jv
  input:
    text: Sampeyan sampun nedha?
    words: [Sampeyan, sampun, nedha]
  expect:
    translation_en: Have you eaten? (polite)
    translation_ar: حضرتك أكلت؟
    register: krama
    tokens:
    - i: 0
      surface: Sampeyan
      lang: jv
      lemma: sampeyan
      gloss_en: you (polite)
      gloss_ar: حضرتك
      note: Polite 'you' (krama madya); more respectful still is panjenengan.
      confident: true
    - i: 1
      surface: sampun
      lang: jv
      lemma: sampun
      gloss_en: already (krama)
      gloss_ar: خلاص
      note: Krama of wis.
      confident: true
    - i: 2
      surface: nedha
      lang: jv
      lemma: nedha
      gloss_en: eat (krama)
      gloss_ar: أكلت
      note: Krama of mangan; used for yourself or others.
      confident: true
  criteria:
  - Register is krama
  - Each word is mapped to its ngoko counterpart (kowe / wis / mangan) in notes or glosses
  tags:
  - spec-24
  - speech-level
  - krama
  verified: false
- id: analyze_text-013
  lang: jv
  input:
    text: Panjenengan sampun dhahar?
    words: [Panjenengan, sampun, dhahar]
  expect:
    translation_en: Have you eaten, sir/ma'am? (most respectful)
    translation_ar: سيادتك أكلت؟
    register: krama
    tokens:
    - i: 0
      surface: Panjenengan
      lang: jv
      lemma: panjenengan
      gloss_en: you (honorific)
      gloss_ar: سيادتك / حضرتك
      note: Krama inggil 'you' for elders and respected people.
      confident: true
    - i: 1
      surface: sampun
      lang: jv
      lemma: sampun
      gloss_en: already (krama)
      gloss_ar: خلاص
      note: null
      confident: true
    - i: 2
      surface: dhahar
      lang: jv
      lemma: dhahar
      gloss_en: eat (honorific)
      gloss_ar: أكلت
      note: 'Krama inggil: only for the other person''s eating, never your own.'
      confident: true
  criteria:
  - dhahar is identified as krama inggil and the note says it is never used about yourself
  avoid:
  - Saying dhahar is fine for 'I have eaten'
  tags:
  - spec-24
  - speech-level
  - krama-inggil
  verified: false
- id: analyze_text-014
  lang: jv
  input:
    text: Koen wis mangan ta, rek?
    words: [Koen, wis, mangan, ta, rek]
  expect:
    translation_en: You've eaten, right, mate?
    translation_ar: إنت كلت ولا إيه يا صاحبي؟
    register: ngoko
    tokens:
    - i: 0
      surface: Koen
      lang: jv
      lemma: koen
      gloss_en: you (Surabaya)
      gloss_ar: إنت
      note: Arek (Surabaya/Malang) dialect for kowe; sounds blunt to Central Javanese ears but is friendly.
      confident: true
    - i: 1
      surface: wis
      lang: jv
      lemma: wis
      gloss_en: already
      gloss_ar: خلاص
      note: null
      confident: true
    - i: 2
      surface: mangan
      lang: jv
      lemma: mangan
      gloss_en: eat
      gloss_ar: أكلت
      note: null
      confident: true
    - i: 3
      surface: ta
      lang: jv
      lemma: ta
      gloss_en: right? (question tag)
      gloss_ar: ولا إيه؟
      note: East Javanese particle softening a question.
      confident: true
    - i: 4
      surface: rek
      lang: jv
      lemma: arek
      gloss_en: mate, buddy
      gloss_ar: يا صاحبي / يا جدع
      note: rek = arek (kid, guy), the Surabaya way to address friends.
      confident: true
  criteria:
  - koen is identified as the Surabaya / Arek form of kowe
  - rek is expanded to arek, a friendly address
  avoid:
  - Treating koen as a typo
  tags:
  - spec-24
  - dialect
  - arek
  - surabaya
  verified: false
- id: analyze_text-015
  lang: id
  input:
    text: Which is, gue literally capek banget.
    words: [Which, is, gue, literally, capek, banget]
  expect:
    translation_en: I mean, I'm literally so tired.
    translation_ar: يعني بجد أنا تعبان أوي.
    register: mixed
    tokens:
    - i: 0
      surface: Which
      lang: en
      lemma: which
      gloss_en: I mean (filler, with is)
      gloss_ar: يعني
      note: '''Which is'' is a Jaksel (South Jakarta) filler: English words mixed into Indonesian.'
      confident: true
    - i: 1
      surface: is
      lang: en
      lemma: is
      gloss_en: I mean (filler, with which)
      gloss_ar: يعني
      note: Second half of the filler 'which is'.
      confident: true
    - i: 2
      surface: gue
      lang: id
      lemma: gue
      gloss_en: I
      gloss_ar: أنا
      note: Jakarta slang for saya / aku.
      confident: true
    - i: 3
      surface: literally
      lang: en
      lemma: literally
      gloss_en: literally, really
      gloss_ar: بجد / حرفيًا
      note: null
      confident: true
    - i: 4
      surface: capek
      lang: id
      lemma: capek
      gloss_en: tired
      gloss_ar: تعبان
      note: null
      confident: true
    - i: 5
      surface: banget
      lang: id
      lemma: banget
      gloss_en: very, so
      gloss_ar: أوي
      note: null
      confident: true
  criteria:
  - Which and is are tagged en and explained as a filler, not as a relative clause
  - gue is identified as Jakarta slang for I
  avoid:
  - Translating 'Which is' literally as a relative pronoun
  tags:
  - spec-24
  - code-mixing
  - jakarta-slang
  - jaksel
  verified: false
- id: analyze_text-016
  lang: id
  input:
    text: Kalimat ini punya lima kata.
    words: [Kalimat, ini, punya, lima, kata]
  expect:
    translation_en: This sentence has five words.
    translation_ar: الجملة دي فيها خمس كلمات.
    register: neutral
