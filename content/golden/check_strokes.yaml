# Golden set: check_strokes (Aksara Jawa calligraphy and Latin letter practice, docs/SPEC.md §4, §19, §21 J6).
# input: {target, script: latin|aksara_jawa, capture?}; the image (and stroke JSON) goes in `image` once captured.
# expect: {correct, issues[]}: issues are short English notes on what differs from the target shape.
# Every item needs a real capture: tag needs-capture, write exactly what input.capture says
# (including the intended mistake), save under fixtures/golden/check_strokes/<id>.png + .json, then set `image`.
# Aksara Jawa items are unverified until a native writer or teacher confirms the shapes and the intended errors.
task: check_strokes
version: 1
rubric: |
  correct must match expect.correct; a wrong boolean is 0 whatever the issues say.
  For a flawed attempt, 3 = every intended mistake in expect.issues is named (same part of the glyph, same kind of fault) and nothing invented; 2 = the main mistake named, a secondary one missed; 1 = only says "something is off" without locating it; 0 = misses it or describes a mistake that is not there.
  For a correct attempt, issues stay empty or hold only clearly optional style tips; flagging normal handwriting variation (slight slant, wobbly line, pressure changes) as an error costs a point.
  Aksara Jawa: name the aksara and the sandhangan by their names (ha, na, ka…, wulu, suku, taling, tarung, pepet, cecak, layar, wignyan, pangkon) and say where a sign sits (above, below, before, after).
  A different letter written instead of the target is reported as that letter ("this reads as ga, not ka"), not as a shape fault.
  Issues are kind, concrete and short, the way a calligraphy teacher would say them; no scolding.
items:
  # --- Aksara Jawa: carakan, correct attempts ---
  - id: check_strokes-001
    lang: jv
    input:
      target: ꦲ
      script: aksara_jawa
      capture: "Galaxy Tab S11, S Pen, Aksara Jawa calligraphy canvas, brush tool, pressure on. After the tracing round, write ha (ꦲ) freehand once, carefully and correctly, about 4 cm tall."
    expect:
      correct: true
      issues: []
    tags: [needs-capture, tablet, aksara-jawa, carakan, correct]
    verified: false
  - id: check_strokes-002
    lang: jv
    input:
      target: ꦤ
      script: aksara_jawa
      capture: "Galaxy Tab S11, S Pen, calligraphy canvas, brush tool. Write na (ꦤ) freehand once, correctly."
