    tags: [needs-capture, tablet, aksara-jawa, carakan, correct]
    verified: false
  - id: check_strokes-003
    lang: jv
    input:
      target: ꦏ
      script: aksara_jawa
      capture: "Galaxy Tab S11, S Pen, calligraphy canvas, fine pen tool. Write ka (ꦏ) freehand once, correctly but with a visibly shaky line (as a beginner would)."
    expect:
      correct: true
      issues: []
    avoid:
      - "Calling the shaky line an error."
    tags: [needs-capture, tablet, aksara-jawa, carakan, correct, shaky]
    verified: false
  - id: check_strokes-004
    lang: jv
    input:
      target: ꦱ
      script: aksara_jawa
      capture: "Galaxy S24 Ultra, built-in S Pen, phone tracing screen. Write sa (ꦱ) freehand once, correctly, slanted about 10 degrees to the right."
