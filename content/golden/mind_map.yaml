# Golden set: mind_map (Mind-map generator, docs/SPEC.md §4, §19).
# input: {topic, level, known_words[], lang}
# expect (sketch): {center, branches[{label, words[{word, gloss_en, gloss_ar}]}]}
# The sketch shows one good map, not the only one; criteria and avoid decide. gloss_ar is MSA.
# Javanese items stay unverified until a native speaker checks them.
task: mind_map
version: 1
rubric: |
  The map is in the requested language (lang) and the center names the topic in that language.
  3-6 branches, each a clear sub-theme, with 2-6 words per branch; every word fits the learner's level (bipa1/j1 = concrete everyday words, higher levels may add abstract or formal vocabulary).
  Reuses the relevant known_words (at least half of them when they fit the topic) so the map links new words to old ones; most other words are new but useful.
  Glosses are accurate for the sense used in this topic: gloss_en short English, gloss_ar short MSA; a false-friend or wrong-sense gloss is 0 for the item.
  No duplicate words across the whole map, no English or Indonesian words in a Javanese map (or the reverse) unless the branch is explicitly about loans or code-mixing.
  Javanese maps label speech levels where they matter (ngoko, krama, krama inggil) and never mix them silently.
  No vulgar words, even for slang topics.
items:
