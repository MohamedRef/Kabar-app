    expect:
      center: di pasar
      branches:
        - label: orang
          words:
            - { word: penjual, gloss_en: seller, gloss_ar: بائع }
            - { word: pembeli, gloss_en: buyer, gloss_ar: مشترٍ }
        - label: barang
          words:
            - { word: sayur, gloss_en: vegetables, gloss_ar: خضروات }
            - { word: buah, gloss_en: fruit, gloss_ar: فاكهة }
            - { word: ikan, gloss_en: fish, gloss_ar: سمك }
            - { word: telur, gloss_en: egg, gloss_ar: بيض }
        - label: tawar-menawar
          words:
            - { word: berapa, gloss_en: how much, gloss_ar: كم }
            - { word: murah, gloss_en: cheap, gloss_ar: رخيص }
            - { word: mahal, gloss_en: expensive, gloss_ar: غالٍ }
            - { word: kurang, gloss_en: "less (lower the price)", gloss_ar: أقل }
        - label: kegiatan
          words:
            - { word: beli, gloss_en: buy, gloss_ar: يشتري }
            - { word: bayar, gloss_en: pay, gloss_ar: يدفع }
            - { word: uang, gloss_en: money, gloss_ar: نقود }
    criteria:
      - "Reuses at least 3 of pasar, beli, murah, mahal, berapa."
      - "All words are concrete beginner words."
