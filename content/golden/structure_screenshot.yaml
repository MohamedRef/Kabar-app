# Golden set for structure_screenshot (docs/SPEC.md §11 Screenshot Decoder, §19). Shapes: content/golden/README.md.
# input = {ocr_blocks[{text, box[x, y, w, h]}], image}: what on-device OCR returns for the screenshot,
# boxes in image pixels. expect = {kind, messages[{speaker, side, time?, text}]}.
# Images are synthetic renders (fictional people and shops) under fixtures/golden/structure_screenshot/.
task: structure_screenshot
version: 1
rubric: |
  - kind is right (chat, listing, post, ui); a wrong kind scores at most 1.
  - messages follow the screen top to bottom, one per chat bubble or content block, with text copied as shown (no translation, no expansion of abbreviations); obvious OCR noise is fixed from the image, and emoji may be kept or dropped.
  - side: left or right for chat bubbles (right = the screenshot owner, speaker 'me'); center for every non-bubble block in listings, posts and UI.
  - speaker: chats use the name label above a group bubble (and carry it over to unlabeled follow-up bubbles from the same sender) or the contact name for 1:1 left bubbles; listings use the seller, posts the author/commenter, UI 'app' (notifications: the source app).
  - time is the time printed on the bubble, post or notification, in the screen's own format (10.42); omitted when none is shown; times OCR glued to text are split out.
  - In ui, a label and its value on the same row become one message 'Label: value'.
  - Chrome is dropped: status bar, headers, online/typing status, date chips, encryption notices, input boxes, like counts and generic buttons (except in ui, where buttons are content).
  - No invented messages, merged bubbles or swapped speakers; one hallucinated message scores 0.
