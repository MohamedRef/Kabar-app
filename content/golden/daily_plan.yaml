      why: 42 cards are due; 3 minutes takes the most urgent ones
    - kind: lesson
      minutes: 12
      why: 'Next stop: ''Sudah, belum, sedang, akan'''
    message_ar: 'صباح الفل! ٣ دقايق مراجعة لأهم الكروت من الـ٤٢، وبعدين درس «Sudah, belum, sedang, akan»: هتعرف
      تقول الحاجة حصلت ولا لسه من غير أزمنة خالص.'
    message_en: 'Morning! Three minutes on the most urgent of your 42 reviews, then ''Sudah, belum, sedang, akan'':
      saying whether something happened, with no tenses at all.'
  criteria:
  - item minutes add up to exactly 15
  - reviews come first when due_reviews > 0
  - each `why` points at the input (due count, a weak point's actual words, the lesson title)
  - message_ar is warm Egyptian Arabic (عامية مصرية, e.g. 'برافو', 'النهارده', 'إنت'), not MSA; Indonesian words
    stay in Latin script
  - message_en says the same thing in plain English, 1–2 sentences
  - names the lesson 'Sudah, belum, sedang, akan'
  avoid:
  - guilt about missed days or a broken streak (e.g. 'you broke your streak', 'Pelita went out because of you',
    'don't let me down')
  - fear or loss framing (e.g. 'you'll forget everything', 'all your progress is at risk')
  - fake urgency or countdowns (e.g. 'last chance', 'only 2 hours left', 'hurry')
  - comparison with other learners or 'most people' (e.g. 'other learners already finished BIPA 2')
  - nagging or pushing to study beyond the stated goal
  - empty, generic praise with no detail from the input (e.g. 'Great job! Keep it up!')
  - generic text that would fit any learner on any day
  tags:
  - standard
  - beginner
  verified: false

