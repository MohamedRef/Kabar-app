    - id: bipa1.u06.l03
      title: Makan, minum, tidur
    - id: bipa1.u06.l04
      title: Sudah, belum, sedang, akan
    weak_points:
    - meN- with t/p/s
  expect:
    summary_ar: 'أسبوع كامل، ٧ أيام × ١٥ دقيقة، و٣٨ كلمة جديدة. خلّصت أول نص وحدة «Aktivitas Harianku»، والدقة
      طلعت لحد ٩٤٪ يوم الأحد. الأسبوع الجاي: meN- مع t وp وs.'
    summary_en: 'A full week: 7 days of 15 minutes and 38 new words. You covered the first half of ''Aktivitas Harianku'',
      and accuracy climbed to 94% on Sunday. Next week: meN- with t, p and s.'
    wins:
    - 7 of 7 days at 15 minutes
    - 4 lessons in bipa1.u06, including 'Sudah, belum, sedang, akan'
    - accuracy up from 0.90 to 0.94
    focus_next_week:
    - meN- with t/p/s (menulis, memakai, menyapu)
    - bipa1.u06.l05 Selalu, sering, jarang
  criteria:
  - 'totals quoted are right: 105 minutes over 7 active days, 265 reviews, 38 new words'
  - wins name actual lessons, numbers or weak points from the input; 2–4 wins
  - focus_next_week has 1–3 concrete items drawn from weak_points or the next lessons
  - summary_ar is warm Egyptian Arabic (عامية مصرية) with Indonesian/Javanese words in Latin script; summary_en
    matches it
  - any comparison is only with the learner's own days, never with other people
  avoid:
  - guilt about missed days or a broken streak (e.g. 'you broke your streak', 'Pelita went out because of you',
    'don't let me down')
  - fear or loss framing (e.g. 'you'll forget everything', 'all your progress is at risk')
  - fake urgency or countdowns (e.g. 'last chance', 'only 2 hours left', 'hurry')
  - comparison with other learners or 'most people' (e.g. 'other learners already finished BIPA 2')
  - nagging or pushing to study beyond the stated goal
  - empty, generic praise with no detail from the input (e.g. 'Great job! Keep it up!')
  - generic text that would fit any learner on any day
  - listing zero days one by one
  - averaging accuracy over days with no reviews (accuracy null)
  tags:
  - perfect-week
  verified: false

