        - text: Meja ini harus dibersihkan dulu.
          translation: { arz: "الترابيزة دي لازم تتنضّف الأول.", ar: "يجب تنظيف هذه الطاولة أولًا.", en: "This table has to be cleaned first." }
          sense: 0
      note: { arz: "di- بتعمل المبني للمجهول، و-kan بتعمل الصفة bersih (نضيف) فعل: «يخلّيه نضيف».", ar: "di- للمبني للمجهول، و-kan تجعل الصفة bersih (نظيف) فعلًا: «جعله نظيفًا».", en: "di- makes it passive; -kan turns the adjective bersih (clean) into a verb: 'make clean'." }
      doubts: []
      confident: true
    criteria:
      - "root bersih and affixes [di-, bersih, -kan], agreeing with the hints"
      - "Gloss is passive ('be cleaned'), not active 'to clean'"
      - "The note or senses explain di- (passive) and -kan (make X)"
    avoid:
      - "Lemma or gloss reported as the bare adjective 'clean'"
    tags: [morphology, derived, passive, spec-24]
