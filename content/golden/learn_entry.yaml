  # --- Wrong source (seed learn-06) ---
  - id: learn_entry-005
    lang: id
    input:
      lang: id
      word: lezat
      context: null
      hints: {}
      sources:
        - kind: pasted
          title: null
          url: null
          text: "lezat = slow, not fast. Contoh: mobilnya lezat sekali di jalan tol."
    expect:
      word: lezat
      lemma: lezat
      senses:
        - pos: adjective
          gloss: { arz: "لذيذ، طعمه حلو", ar: "لذيذ", en: "delicious, tasty" }
      examples:
        - text: Sate ayam ini lezat sekali.
          translation: { arz: "الساتيه فراخ ده طعمه حلو أوي.", ar: "ساتيه الدجاج هذا لذيذ جدًّا.", en: "This chicken satay is really delicious." }
          sense: 0
        - text: Masakan ibu Dewi selalu lezat.
          translation: { arz: "أكل مامة ديوي دايمًا لذيذ.", ar: "طبخ والدة ديوي لذيذ دائمًا.", en: "Dewi's mother's cooking is always tasty." }
          sense: 0
      note: { arz: "lezat شوية رسمية؛ في الكلام العادي الناس بتقول enak.", ar: "lezat أفصح قليلًا؛ وفي الكلام اليومي يقال enak.", en: "lezat is a little formal; in everyday talk people say enak." }
      arabic_origin: لَذَّة
      bridge:
        arabic: لَذَّة
        root: ل ذ ذ
        shift: same
        shift_note: { arz: "من «لذة»، وقريبة من «لذيذ» عندنا.", ar: "من «لذّة»، وهي بمعنى «لذيذ».", en: "From Arabic ladhdha 'pleasure'; it means what laziz means." }
      doubts:
        - { arz: "المصدر بيقول lezat يعني «بطيء»، وده غلط: lezat يعني «لذيذ». «بطيء» اسمها lambat.", ar: "المصدر يقول إن lezat تعني «بطيء»، وهذا خطأ: معناها «لذيذ»، أما «بطيء» فهي lambat.", en: "The source says lezat means 'slow'. That's wrong: it means 'delicious'. 'Slow' is lambat." }
      confident: true
    criteria:
      - "Gloss is delicious / tasty, not slow"
      - "doubts says plainly that the source is wrong (ideally naming lambat as 'slow')"
      - "Arabic origin لذة / لذيذ; shift same or narrowed is acceptable"
    avoid:
      - "Any sense meaning slow, or an example built on the source's car sentence"
      - "Empty doubts"
    tags: [wrong-source, arabic-bridge, seed]
    verified: false

