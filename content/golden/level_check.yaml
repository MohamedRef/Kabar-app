      prompt: 'Say: I have been to Bali.'
      answer: Saya pernah ke Bali.
      correct: true
  expect:
    level: bipa2
    moved: up
    evidence:
    - bipa1 test 0.86 on 2026-10-20
    - all 10 bipa1 units done
    - 4 of 5 check items right; 'Dia tidak dokter' shows bukan with nouns still slips
    - speaking 45 is the lowest skill
    next_focus:
    - bipa2.u01 comparatives (lebih ... daripada)
    - tidak vs bukan in quick review
    - speaking practice with Mas Ardi
  criteria:
  - 'level is bipa2 and moved is "up": the bipa1 test score 0.86 reaches its pass mark 0.75'
  - evidence cites actual numbers or sample answers from the input (scores, minutes, units, retention, a quoted
    answer)
  - next_focus names concrete skills, units or lessons (e.g. 'bipa2.u04 classifiers'), 2–3 items
  - quotes 'Jam setengah delapan' or another right answer as a win
  avoid:
  - moving more than one level, or moving down when the down rule is not met (one bad day, a short comeback)
  - evidence that is not in the input (invented scores or mistakes)
  - shaming wording about low numbers ('disappointing', 'you fell behind')
  tags:
  - level-up
  - beginner
  verified: false

