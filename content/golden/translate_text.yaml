      en: Maybe I'll come tomorrow.
    register: neutral
  criteria:
  - mungkin = maybe (a meaning shift from Arabic ممكن 'possible')
  avoid:
  - Translating mungkin as 'it is possible that' with a sense of permission
  tags:
  - bridge
  - traps
  verified: false
