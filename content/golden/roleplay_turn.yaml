    tags: [gadis, register, over-formal]
    verified: false
  - id: roleplay_turn-020
    lang: id
    input:
      persona: mbak_gadis
      level: bipa3
      scenario: "Planning tomorrow's team meeting."
      history:
        - { role: persona, text: "Besok ada meeting sama klien, lo ikut ya." }
      learner: "Oke. Meeting jam berapa besok?"
    expect:
      reply: "Jam sepuluh pagi, tapi kayaknya bakal di-reschedule deh. Nanti gue kabarin di grup ya."
      corrections: []
      register: casual
    criteria:
      - "Gives a concrete time and uses natural English mixing (meeting, reschedule)."
    tags: [gadis, work, time]
    verified: false
  - id: roleplay_turn-021
    lang: id
    input:
      persona: mbak_gadis
      level: bipa3
      scenario: "Talking about a client email."
      history:
        - { role: persona, text: "Lo udah email klien yang kemarin?" }
      learner: "Kemarin saya akan kirim email, tapi dia belum balas."
    expect:
      reply: "Oh udah dikirim ya? Ya udah, tunggu aja, biasanya dia baru bales sore."
      corrections:
        - text: akan kirim
          fix: sudah kirim
          why_en: "akan means \"will\". For something done yesterday, use sudah (or just kirim)."
          why_ar: "«akan» معناها «هـ» للمستقبل. لحاجة حصلت امبارح استخدم «sudah» (أو «kirim» لوحدها)."
      register: casual
    criteria:
      - "Infers the intended meaning (email was sent) and corrects akan to sudah."
    avoid:
      - "Also correcting saya or balas, which are fine."
    tags: [gadis, tense, aspect]
    verified: false
