      prompt: What does 'membersihkan' add to 'bersih'?
      answer: 'Arabic has the same idea: نظّف from نظيف'
      correct: false
    - item: bipa3-04
      prompt: 'Complete with the agent: ''Buku itu sudah ___ baca.'' (I)'
      answer: di
      correct: false
