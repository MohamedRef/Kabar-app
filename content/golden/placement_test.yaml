      prompt: 'Fill the gap: ''Saya sedang ___ buku.'' (read)'
      answer: membaca
      correct: true
    - item: bipa1-06
      prompt: 'Say in Indonesian: ''my older brother''s house'''
      answer: rumah kakak saya
      correct: true
