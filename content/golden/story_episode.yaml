          en: "\"Have you eaten, mate?\" Bayu asks, laughing."
        - id: "Di Surabaya, koen dan rek biasa dipakai antara teman: kedengarannya kasar, tapi sebenarnya akrab."
          arz: "في سورابايا، ⁨koen⁩ و⁨rek⁩ بيتقالوا عادي بين الصحاب: صوتهم ناشف، بس في الحقيقة فيهم ودّ."
          ar: "في سورابايا تُستعمل ⁨koen⁩ و⁨rek⁩ عادةً بين الأصدقاء: تبدوان خشنتين، لكنهما في الحقيقة تعبّران عن الألفة."
          en: "In Surabaya, koen and rek are normal between friends: they sound blunt, but really they're warm."
        - id: "\"Durung, rek. Aku tangi kawanen,\" jawab Andre."
          arz: "«لسه يا صاحبي. أنا صحيت متأخّر،» ردّ أندريه."
          ar: "أجاب أندريه: «ليس بعد يا صاحبي. استيقظت متأخّرًا.»"
          en: "\"Not yet, mate. I overslept,\" Andre answers."
        - id: "\"Ayo mangan rawon disik. Tak bayari!\""
          arz: "«يلا ناكل راون الأول. عليّا أنا!»"
          ar: "«هيّا نأكل الراون أولًا. على حسابي!»"
          en: "\"Let's have rawon first. My treat!\""
        - id: "Mereka makan rawon: sup daging hitam dengan kluwek, tauge pendek, dan telur asin."
          arz: "كلوا راون: شوربة لحمة سودا بالكلويك، وفول نابت قصير، وبيض مملّح."
          ar: "أكلا الراون: حساء لحم أسود اللون بثمار الكلويك، مع براعم فاصولياء قصيرة وبيض مملّح."
          en: "They eat rawon: black beef soup with kluwek nut, short bean sprouts and salted egg."
        - id: "Andre sudah lebih segar setelah makan. \"Suwun, rek. Sesuk gantian aku sing mbayar.\""
          arz: "أندريه فاق بعد الأكل. «متشكر يا صاحبي. بكرة الدور عليّا أنا أدفع.»"
          ar: "صار أندريه أكثر نشاطًا بعد الأكل. «شكرًا يا صاحبي. غدًا دوري أنا في الدفع.»"
          en: "Andre feels fresher after eating. \"Thanks, mate. Tomorrow it's my turn to pay.\""
        - id: "Jam tujuh kurang sepuluh, mereka berangkat kerja bersama."
          arz: "الساعة سبعة إلا عشرة، راحوا الشغل مع بعض."
          ar: "في السابعة إلا عشر دقائق، انطلقا إلى العمل معًا."
          en: "At ten to seven, they head off to work together."
        - id: "Dua teman, satu piring rawon, dan pagi yang hangat di Surabaya."
          arz: "اتنين صحاب، وطبق راون، وصباح دافي في سورابايا."
          ar: "صديقان، وطبق راون، وصباح دافئ في سورابايا."
          en: "Two friends, a plate of rawon, and a warm morning in Surabaya."
      words: [koen, rek, mangan, wis, makan, sudah, teman]
    criteria:
      - Uses the §24 Arek sentence "Koen wis mangan ta, rek?" in a friendly peer scene.
      - Notes or shows that koen/rek are Surabaya-style and blunt but friendly among peers.
      - Surabaya detail plausible (Gubeng station, rawon, lontong balap).
      - 96–144 words.
    avoid:
      - Using koen toward an elder or stranger.
      - Presenting Arek speech as rude or low-class.
    tags: [kabar-pagi, javanese, arek, dialect, test-text]
    verified: false

  - id: story_episode-034
    lang: jv
    input:
      series: sinetron
      level: j2
      target_words: [mangan, sampun, dhahar]
      due_words: [makan, sudah, nenek]
      previous_summary: "Episode 19: Sari meets Ayu before flying back to Cairo. On her last morning, old Mbah Sumi, the eldest neighbour, comes to the warung."
      length_words: 180
    expect:
      title: "Mbah Sumi"
      level: j2
      sentences:
        - id: "Pagi itu adalah pagi terakhir Sari di Madiun sebelum terbang ke Kairo."
          arz: "الصبح ده كان آخر صبح لساري في ماديون قبل ما تطير على القاهرة."
          ar: "كان ذلك الصباح آخر صباح لساري في ماديون قبل أن تطير إلى القاهرة."
          en: "That morning is Sari's last morning in Madiun before she flies to Cairo."
        - id: "Dia membantu ayahnya di warung, ketika Mbah Sumi datang dengan tongkatnya."
          arz: "كانت بتساعد أبوها في المحل، لما تيتة سومي جت بعكازها."
          ar: "كانت تساعد أباها في المطعم حين جاءت الجدّة سومي بعكّازها."
          en: "She is helping her father at the warung when Mbah Sumi arrives with her walking stick."
        - id: "Mbah Sumi adalah nenek paling tua di kampung itu, umurnya hampir sembilan puluh tahun."
          arz: "تيتة سومي أكبر جدّة في الحتة كلها، عندها تقريبًا تسعين سنة."
          ar: "الجدّة سومي أكبر جدّة في ذلك الحيّ، وعمرها قرابة تسعين عامًا."
          en: "Mbah Sumi is the oldest grandmother in the neighbourhood, almost ninety years old."
        - id: "Rudi cepat-cepat menyiapkan kursi dan bertanya, \"Mbah wis mangan?\""
          arz: "رودي بسرعة جهّز لها كرسي وسأل: «إنتي كلتي يا تيتة؟»"
          ar: "أسرع رودي فأعدّ لها كرسيًّا وسأل: «هل أكلتِ يا جدّة؟»"
          en: "Rudi quickly sets out a chair and asks, \"Granny, have you eaten?\""
        - id: "Pak Budi tersenyum dan menepuk bahu Rudi pelan-pelan."
          arz: "عم بودي ابتسم وطبطب على كتف رودي بالراحة."
          ar: "ابتسم السيد بودي وربّت على كتف رودي برفق."
          en: "Pak Budi smiles and pats Rudi gently on the shoulder."
        - id: "\"Rud, kalau dengan teman, 'Kowe wis mangan?' itu sudah benar.\""
          arz: "«يا رودي، مع صحابك، ‹⁨Kowe wis mangan?⁩› يعني ‹إنت كلت؟› تبقى صح.»"
          ar: "«يا رودي، مع أصدقائك تصحّ ‹⁨Kowe wis mangan?⁩›، أي ‹هل أكلت؟›.»"
          en: "\"Rud, with your friends, 'Kowe wis mangan?' is fine.\""
        - id: "\"Tapi kepada orang tua, kita pakai krama: 'Sampeyan sampun nedha?'\""
          arz: "«بس مع الكبار، بنستعمل الكراما: ‹⁨Sampeyan sampun nedha?⁩›، يعني ‹إنت كلت؟› بأدب.»"
          ar: "«لكن مع الكبار نستعمل الكراما: ‹⁨Sampeyan sampun nedha?⁩›، أي ‹هل تناولتَ الطعام؟›.»"
          en: "\"But with older people, we use krama: 'Sampeyan sampun nedha?'\""
        - id: "\"Dan kepada orang yang sangat kita hormati, seperti Mbah, lebih baik: 'Panjenengan sampun dhahar?'\""
          arz: "«ومع اللي بنحترمهم قوي، زي تيتة، الأحسن نقول: ‹⁨Panjenengan sampun dhahar?⁩›، يعني ‹حضرتك كلتي؟›.»"
          ar: "«ومع من نجلّهم كثيرًا، مثل الجدّة، الأفضل أن نقول: ‹⁨Panjenengan sampun dhahar?⁩›، أي ‹هل تناولتِ حضرتكِ الطعام؟›.»"
          en: "\"And with someone we deeply respect, like Mbah, it's better to say: 'Panjenengan sampun dhahar?'\""
        - id: "Rudi tersipu dan mengulang dengan pelan, \"Mbah, panjenengan sampun dhahar?\""
          arz: "رودي اتكسف وقالها تاني بهدوء: «يا تيتة، ⁨panjenengan sampun dhahar?⁩»"
          ar: "احمرّ وجه رودي وأعاد بهدوء: «يا جدّة، ⁨panjenengan sampun dhahar?⁩»"
          en: "Rudi blushes and repeats quietly, \"Mbah, panjenengan sampun dhahar?\""
        - id: "\"Durung, Le,\" jawab Mbah Sumi sambil tertawa. \"Simbah durung mangan, kok.\""
          arz: "«لسه يا ابني،» ردّت تيتة سومي وهي بتضحك. «تيتة لسه ما كلتش.»"
          ar: "أجابت الجدّة سومي ضاحكةً: «ليس بعد يا بنيّ. جدّتك لم تأكل بعد.»"
          en: "\"Not yet, lad,\" Mbah Sumi answers, laughing. \"Granny hasn't eaten yet.\""
        - id: "\"Nah, Mbah boleh bilang mangan untuk dirinya sendiri, tapi kita tidak bilang dhahar untuk diri kita,\" bisik Pak Budi kepada Rudi."
          arz: "«شفت؟ تيتة ممكن تقول ⁨mangan⁩ عن نفسها، بس إحنا عمرنا ما نقول ⁨dhahar⁩ عن نفسنا،» همس عم بودي لرودي."
          ar: "همس السيد بودي لرودي: «أرأيت؟ للجدّة أن تقول ⁨mangan⁩ عن نفسها، لكننا لا نقول ⁨dhahar⁩ عن أنفسنا أبدًا.»"
          en: "\"See, Mbah can say mangan about herself, but we never say dhahar about ourselves,\" Pak Budi whispers to Rudi."
        - id: "Sari membawa sepiring nasi pecel dan teh hangat, dan Mbah Sumi makan dengan senang."
          arz: "ساري جابت طبق بيتشيل وشاي سخن، وتيتة سومي كلت وهي مبسوطة."
          ar: "أحضرت ساري طبق بيتشيل وشايًا دافئًا، فأكلت الجدّة سومي مسرورةً."
          en: "Sari brings a plate of nasi pecel and warm tea, and Mbah Sumi eats happily."
        - id: "Sari ingat Kairo: di sana pun, anak muda tidak bilang \"inta\" kepada orang tua, tetapi \"hadritak\"."
          arz: "ساري افتكرت القاهرة: هناك كمان الشباب مش بيقولوا للكبار «إنت»، بيقولوا «حضرتك»."
          ar: "تذكّرت ساري القاهرة: هناك أيضًا لا يقول الشباب للكبار «إنت»، بل «حضرتك»."
          en: "Sari thinks of Cairo: there too, young people don't say \"inta\" to their elders, but \"hadritak\"."
        - id: "Siang itu, dari jendela pesawat, Sari masih tersenyum mengingat pelajaran kecil di warung ayahnya."
          arz: "الضهر، من شباك الطيارة، ساري كانت لسه بتبتسم وهي فاكرة الدرس الصغير في محل أبوها."
          ar: "ظهر ذلك اليوم، من نافذة الطائرة، كانت ساري لا تزال تبتسم وهي تتذكّر الدرس الصغير في مطعم أبيها."
          en: "That afternoon, at the plane window, Sari is still smiling as she remembers the little lesson at her father's warung."
      words: [mangan, sampun, dhahar, makan, sudah, nenek]
      summary: "When Rudi greets the eldest neighbour, Mbah Sumi, in plain ngoko, Pak Budi gently shows him the respectful way, 'Panjenengan sampun dhahar?', and Mbah Sumi laughs kindly. Sari, flying back to Cairo that day, keeps the lesson."
    criteria:
      - Contrasts levels correctly with the §24 forms - ngoko "Kowe wis mangan?", krama "Sampeyan sampun nedha?", krama inggil "Panjenengan sampun dhahar?"
      - To the elder, krama inggil dhahar (not ngoko mangan) is the respectful choice; the correction is gentle.
      - Narration in Indonesian; continues the last-morning thread.
      - 144–216 words.
    avoid:
      - Using dhahar for oneself (krama inggil is for the other person, never the speaker).
      - Shaming Rudi harshly for the mistake.
    tags: [sinetron, javanese, krama, unggah-ungguh, test-text]
    verified: false

  - id: story_episode-035
    lang: jv
    input:
      series: kabar_pagi
      level: j1
      target_words: [udan, adhem, ngombe, wedang]
      due_words: [hujan, dingin, minum, teh]
      length_words: 120
    expect:
      title: "Wedang Jahe"
      level: j1
      sentences:
        - id: "Pagi itu hujan deras turun di Yogyakarta."
          arz: "الصبح ده المطر كان نازل جامد في يوجياكارتا."
          ar: "في ذلك الصباح هطل مطر غزير على يوغياكارتا."
          en: "That morning heavy rain falls on Yogyakarta."
        - id: "Bagus dan temannya, Wulan, berjalan ke kampus tanpa payung."
          arz: "باجوس وصاحبته وولان كانوا ماشيين للجامعة من غير شمسية."
          ar: "كان باغوس وصديقته وولان يمشيان إلى الجامعة بلا مظلّة."
          en: "Bagus and his friend Wulan are walking to campus without an umbrella."
        - id: "\"Udan, Lan! Ayo ngiyup sik!\""
          arz: "«الدنيا بتمطر يا وولان! تعالي نستخبّى شوية!»"
          ar: "«إنها تمطر يا وولان! هيّا نحتمِ قليلًا!»"
          en: "\"It's raining, Lan! Let's take shelter for a bit!\""
        - id: "Mereka berteduh di sebuah angkringan yang masih buka dari semalam."
          arz: "استخبّوا في أنجكرينجان، عربية أكل في الشارع لسه فاتحة من بالليل."
          ar: "احتميا في أنغكرينغان، وهي عربة طعام في الشارع ما زالت مفتوحة منذ الليلة الماضية."
          en: "They shelter at an angkringan that's still open from the night before."
        - id: "Angkringan itu gerobak kecil dengan terpal, bangku kayu, nasi kucing, sate usus, dan cerek besar di atas arang."
          arz: "الأنجكرينجان دي عربية صغيرة عليها مشمّع، ودكك خشب، ولفّات رز صغيرة، وأسياخ ممبار، وغلاية كبيرة على الفحم."
          ar: "الأنغكرينغان عربة صغيرة بغطاء من القماش المشمّع، ومقاعد خشبية، ولفائف أرز صغيرة، وأسياخ من الأمعاء المشويّة، وإبريق كبير فوق الفحم."
          en: "The angkringan is a small cart with a tarpaulin, wooden benches, nasi kucing, intestine satay and a big kettle over charcoal."
        - id: "Wulan menggosok tangannya. \"Adhem banget, yo.\""
          arz: "وولان فركت إيديها. «الدنيا برد أوي، صح؟»"
          ar: "فركت وولان يديها. «الجوّ بارد جدًّا، أليس كذلك؟»"
          en: "Wulan rubs her hands. \"It's really cold, isn't it?\""
        - id: "\"Ayo ngombe wedang jahe ben anget,\" kata Bagus."
          arz: "«يلا نشرب جنزبيل سخن عشان ندفى،» قال باجوس."
          ar: "قال باغوس: «هيّا نشرب الزنجبيل الساخن لندفأ.»"
          en: "\"Let's drink wedang jahe to warm up,\" says Bagus."
        - id: "Bagus lalu bertanya kepada bapak penjual dalam bahasa krama: \"Pak, wedang jahe kalih, nggih.\""
          arz: "باجوس طلب من عمّو البيّاع بالكراما المؤدّبة: «يا عمّو، اتنين جنزبيل لو سمحت.»"
          ar: "ثم طلب باغوس من البائع المسنّ بلغة الكراما المهذّبة: «يا عمّ، كوبان من الزنجبيل من فضلك.»"
          en: "Then Bagus asks the stall owner in krama: \"Two ginger drinks, please, sir.\""
        - id: "Bapak itu tersenyum dan menuang air panas ke gelas berisi jahe bakar dan gula batu."
          arz: "الراجل ابتسم وصبّ مية سخنة في كوبايات فيها جنزبيل مشوي وسكر نبات."
          ar: "ابتسم الرجل وصبّ الماء الساخن في كوبين فيهما زنجبيل مشويّ وسكّر نبات."
          en: "The man smiles and pours hot water into glasses of roasted ginger and rock sugar."
        - id: "Lalu Wulan juga minta segelas teh panas, dan mereka minum pelan-pelan sambil melihat hujan."
          arz: "وبعدين وولان طلبت كمان كوباية شاي سخن، وشربوا على مهلهم وهما بيتفرّجوا على المطر."
          ar: "ثم طلبت وولان أيضًا كوب شاي ساخن، وشربا على مهل وهما يتأمّلان المطر."
          en: "Then Wulan asks for a glass of hot tea too, and they sip slowly, watching the rain."
        - id: "Dua gelas wedang jahe dan segelas teh hanya Rp10.000."
          arz: "كوبايتين جنزبيل وكوباية شاي بعشرة آلاف روبية بس."
          ar: "كوبان من الزنجبيل وكوب شاي بعشرة آلاف روبية فقط."
          en: "Two ginger drinks and a tea come to only Rp10,000."
        - id: "Setengah jam kemudian hujan berhenti, dan udara yang dingin terasa lebih segar."
          arz: "بعد نص ساعة المطر وقف، والجو البارد بقى أنعش."
          ar: "بعد نصف ساعة توقّف المطر، وصار الهواء البارد أكثر انتعاشًا."
          en: "Half an hour later the rain stops, and the cold air feels fresher."
        - id: "\"Matur nuwun, Pak,\" kata mereka, lalu berjalan ke kampus dengan badan yang hangat."
          arz: "«متشكرين يا عمّو،» قالوا، وبعدين مشيوا للجامعة وهما دفيانين."
          ar: "قالا: «شكرًا يا عمّ»، ثم مشيا إلى الجامعة وقد دفئت أجسادهما."
          en: "\"Thank you, sir,\" they say, then walk to campus feeling warm."
      words: [udan, adhem, ngombe, wedang, hujan, dingin, minum, teh]
    criteria:
      - Angkringan and wedang jahe described accurately (a Yogyakarta/Solo street stall, cheap hot drinks).
      - Ngoko between peers; Javanese words echo the Indonesian due words.
      - Spelling uses dh where Javanese has it (adhem).
      - 96–144 words.
    avoid:
      - Writing "adem" as a different word or translating wedang as "coffee only".
      - Ngoko toward the stall owner if he is clearly older (Indonesian or krama is safer).
    tags: [kabar-pagi, javanese, ngoko, culture, spelling]
    verified: false
