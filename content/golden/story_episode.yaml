        - id: "Jam tujuh pagi, kota Kairo sudah ramai."
          arz: "الساعة سبعة الصبح، القاهرة بقت زحمة."
          ar: "في السابعة صباحًا، تكون مدينة القاهرة قد ازدحمت."
          en: "At seven in the morning, the city of Cairo is already busy."
        - id: "Pak Hasan keluar dari rumahnya dan berjalan ke ujung jalan."
          arz: "عم حسن خرج من بيته ومشي لآخر الشارع."
          ar: "يخرج العم حسن من بيته ويمشي إلى آخر الشارع."
          en: "Pak Hasan leaves his house and walks to the end of the street."
        - id: "Di sana ada gerobak kecil yang menjual ful dan ta'miyah."
          arz: "هناك فيه عربية صغيرة بتبيع فول وطعمية."
          ar: "هناك عربة صغيرة تبيع الفول والطعمية."
          en: "There's a small cart there that sells ful and ta'miya."
        - id: "Ful itu kacang fava yang dimasak lama, dan ta'miyah mirip bakwan kecil dari kacang yang sama."
          arz: "الفول ده فول مدمّس متسوّي على نار هادية مدة طويلة، والطعمية شبه الـ⁨bakwan⁩ الصغير ومعمولة من نفس الفول."
          ar: "الفول هو حبوب الفول المطهوّة طويلًا، والطعمية تشبه فطائر ⁨bakwan⁩ الصغيرة وتُصنع من الفول نفسه."
          en: "Ful is fava beans cooked for a long time, and ta'miya is like small bakwan fritters made from the same beans."
        - id: "Pak Hasan membeli dua roti, ful, dan ta'miyah. Harganya murah, cuma beberapa pound."
          arz: "عم حسن اشترى رغيفين عيش وفول وطعمية. رخاص، كام جنيه بس."
          ar: "يشتري العم حسن رغيفين وفولًا وطعمية. السعر رخيص، بضعة جنيهات فقط."
          en: "Pak Hasan buys two loaves of bread, ful and ta'miya. It's cheap, just a few pounds."
        - id: "Lalu dia minum kopi kecil di warung kopi di pinggir jalan."
          arz: "وبعدين شرب فنجان قهوة صغير في قهوة على جنب الشارع."
          ar: "ثم يشرب فنجان قهوة صغيرًا في مقهى على جانب الطريق."
          en: "Then he has a small coffee at a coffee stall by the road."
        - id: "Jam setengah delapan, dia naik bus ke kantornya di dekat Sungai Nil."
          arz: "الساعة سبعة ونص، ركب الأتوبيس لشغله اللي جنب النيل."
          ar: "في السابعة والنصف، يركب الحافلة إلى مكتبه قرب نهر النيل."
          en: "At half past seven, he takes the bus to his office near the River Nile."
        - id: "Busnya penuh, dan semua jendelanya terbuka."
          arz: "الأتوبيس مليان، وكل شبابيكه مفتوحة."
          ar: "الحافلة ممتلئة، وكل نوافذها مفتوحة."
          en: "The bus is full, and all its windows are open."
        - id: "Matahari sudah tinggi, dan udara mulai panas."
          arz: "الشمس طلعت، والجو ابتدى يحرّ."
          ar: "ارتفعت الشمس، وبدأ الجوّ يحرّ."
          en: "The sun is already high, and the air is getting hot."
        - id: "Dari jendela bus, Pak Hasan melihat Sungai Nil yang lebar dan tenang."
          arz: "من شباك الأتوبيس، عم حسن شاف النيل العريض الهادي."
          ar: "من نافذة الحافلة، يرى العم حسن نهر النيل الواسع الهادئ."
          en: "From the bus window, Pak Hasan sees the wide, calm Nile."
        - id: "Airnya berkilau di bawah matahari pagi, dan ada perahu kecil yang lewat pelan-pelan."
          arz: "المية بتلمع تحت شمس الصبح، وفيه فلوكة صغيرة معدّية على مهلها."
          ar: "تتلألأ مياهه تحت شمس الصباح، ويمرّ قارب صغير على مهل."
          en: "The water sparkles in the morning sun, and a small boat drifts slowly by."
        - id: "Pak Hasan tersenyum. Setiap pagi dia melihat sungai itu, tapi dia tidak pernah bosan."
          arz: "عم حسن ابتسم. كل يوم الصبح بيشوف النيل، وعمره ما بيزهق."
          ar: "يبتسم العم حسن. يرى ذلك النهر كل صباح، لكنه لا يملّ أبدًا."
          en: "Pak Hasan smiles. He sees the river every morning, but he never gets tired of it."
        - id: "\"Kota ini ramai dan panas,\" pikirnya, \"tapi saya cinta Kairo.\""
          arz: "«المدينة دي زحمة وحرّ،» قال في نفسه، «بس أنا بحب القاهرة.»"
          ar: "فكّر في نفسه: «هذه المدينة مزدحمة وحارّة، لكنني أحبّ القاهرة.»"
          en: "\"This city is crowded and hot,\" he thinks, \"but I love Cairo.\""
      words: [jalan, bus, panas, sungai, pagi, kopi, kota]
    criteria:
      - Cairo setting described accurately (ful and ta'meya for breakfast, microbuses or buses, the Nile as Sungai Nil).
      - Simple Indonesian narration; Arabic only as names of foods or places.
      - 128–192 words.
    avoid:
      - Clichés (camels on city streets, everyone living near pyramids).
      - Arabic or English sentences.
    tags: [kabar-pagi, bipa2, egypt-hook, culture]
    verified: false

  - id: story_episode-023
    lang: id
    input:
      series: kabar_pagi
      level: bipa3
      target_words: [kereta, terlambat, penumpang, jadwal]
      due_words: [kantor, pagi, banget]
      length_words: 220
    expect:
      title: "KRL Jam Setengah Tujuh"
      level: bipa3
      sentences:
        - id: "Jam setengah tujuh pagi, Stasiun Bogor sudah penuh penumpang yang mau berangkat kerja ke Jakarta."
          arz: "الساعة ستة ونص الصبح، محطة بوجور كانت مليانة ركّاب رايحين شغلهم في جاكرتا."
          ar: "في السادسة والنصف صباحًا، كانت محطة بوجور مكتظّة بالركّاب المتّجهين إلى أعمالهم في جاكرتا."
          en: "At half past six in the morning, Bogor Station is already full of passengers heading to work in Jakarta."
        - id: "Laras menempelkan kartunya di gerbang, lalu berjalan cepat ke peron."
          arz: "لاراس حطّت الكارت بتاعها على البوابة، وبعدين مشيت بسرعة على الرصيف."
          ar: "تمرّر لاراس بطاقتها على البوابة، ثم تمشي مسرعةً إلى الرصيف."
          en: "Laras taps her card at the gate, then walks quickly to the platform."
        - id: "Di layar, jadwal kereta ke Jakarta Kota menunjukkan bahwa kereta berikutnya terlambat sepuluh menit."
          arz: "على الشاشة، جدول قطارات ⁨Jakarta Kota⁩ بيقول إن القطر الجاي متأخّر عشر دقايق."
          ar: "على الشاشة، يُظهر جدول القطارات إلى ⁨Jakarta Kota⁩ أنّ القطار التالي متأخّر عشر دقائق."
          en: "On the screen, the timetable for trains to Jakarta Kota shows the next train is ten minutes late."
        - id: "\"Duh, telat banget!\" kata Laras pelan, sambil melihat jam tangannya."
          arz: "«يا ساتر، متأخّر أوي!» قالت لاراس بصوت واطي وهي بتبص في ساعتها."
          ar: "قالت لاراس بصوت خافت وهي تنظر إلى ساعتها: «يا إلهي، تأخير كبير!»"
          en: "\"Ugh, so late!\" Laras says quietly, looking at her watch."
        - id: "Rapat di kantornya mulai jam delapan, dan perjalanan ke Sudirman biasanya satu jam lebih."
          arz: "الاجتماع في شغلها بيبدأ الساعة تمانية، والمشوار لسوديرمان عادةً ساعة وشوية."
          ar: "يبدأ الاجتماع في مكتبها في الثامنة، والرحلة إلى سوديرمان تستغرق عادةً أكثر من ساعة."
          en: "The meeting at her office starts at eight, and the ride to Sudirman usually takes over an hour."
        - id: "Di sebelahnya, seorang ibu dengan tas belanja besar tersenyum ramah."
          arz: "جنبها، ست معاها شنطة سوق كبيرة ابتسمتلها بودّ."
          ar: "بجانبها، تبتسم سيدة تحمل حقيبة تسوّق كبيرة ابتسامة ودودة."
          en: "Next to her, a woman with a big shopping bag smiles kindly."
        - id: "\"Tenang aja, Mbak. Kereta jam segini biasanya ngejar waktu, kok,\" katanya."
          arz: "«ولا يهمّك يا بنتي. القطر في الساعة دي عادةً بيعوّض الوقت،» قالت."
          ar: "قالت: «لا تقلقي يا آنسة. قطار هذه الساعة يعوّض التأخير عادةً.»"
          en: "\"Don't worry, love. Trains at this hour usually make up the time,\" she says."
        - id: "Laras tertawa kecil. \"Semoga, Bu. Kalau telat, saya bisa ketinggalan rapat.\""
          arz: "لاراس ضحكت ضحكة صغيرة. «يا رب يا طنط. لو اتأخّرت، ممكن الاجتماع يفوتني.»"
          ar: "تضحك لاراس قليلًا. «أرجو ذلك يا سيدتي. إن تأخّرت فقد يفوتني الاجتماع.»"
          en: "Laras gives a little laugh. \"I hope so, ma'am. If I'm late, I might miss the meeting.\""
        - id: "Akhirnya kereta datang, dan para penumpang masuk dengan tertib ke gerbong khusus wanita di ujung kereta."
          arz: "أخيرًا القطر جه، والركّاب دخلوا بالنظام عربية السيدات اللي في آخر القطر."
          ar: "أخيرًا يصل القطار، فيدخل الركّاب بانتظام إلى عربة النساء في طرف القطار."
          en: "At last the train arrives, and the passengers board the women-only carriage at the end of the train in an orderly way."
        - id: "Di dalam kereta, Laras dan ibu itu mengobrol tentang harga cabai yang naik dan anak-anak yang mulai sekolah."
          arz: "جوّه القطر، لاراس والست دي دردشوا عن سعر الشطة اللي غلي والعيال اللي بادئين المدرسة."
          ar: "داخل القطار، تتحدّث لاراس والسيدة عن ارتفاع سعر الفلفل الحار وعن الأطفال الذين بدأوا المدرسة."
          en: "On the train, Laras and the woman chat about the rising price of chillies and children starting school."
        - id: "Waktu terasa cepat, dan tidak lama kemudian kereta berhenti di Stasiun Sudirman."
          arz: "الوقت عدّى بسرعة، وبعد شوية القطر وقف في محطة سوديرمان."
          ar: "يمرّ الوقت سريعًا، وبعد قليل يتوقّف القطار في محطة سوديرمان."
          en: "Time flies, and before long the train stops at Sudirman Station."
        - id: "Laras berlari kecil dari stasiun ke kantor dan masuk ke ruang rapat tepat jam delapan."
          arz: "لاراس جريت جري خفيف من المحطة للشغل ودخلت أوضة الاجتماعات الساعة تمانية بالظبط."
          ar: "تهرول لاراس من المحطة إلى المكتب وتدخل قاعة الاجتماعات في الثامنة تمامًا."
          en: "Laras jogs from the station to the office and walks into the meeting room at eight on the dot."
        - id: "Teman-temannya bertepuk tangan. \"Wah, tepat waktu banget, Ras! Kereta lagi baik hati, ya?\""
          arz: "زمايلها سقفوا. «الله، في الميعاد بالظبط يا لاراس! القطر كان رايق النهارده؟»"
          ar: "يصفّق زملاؤها. «رائع، في الموعد تمامًا يا لاراس! هل كان القطار لطيفًا اليوم؟»"
          en: "Her colleagues clap. \"Wow, right on time, Ras! Was the train being nice today?\""
        - id: "Laras tertawa lega dan duduk; pagi yang hampir kacau itu ternyata berakhir dengan baik."
          arz: "لاراس ضحكت وهي مرتاحة وقعدت؛ الصبح اللي كان هيبوظ خلص على خير."
          ar: "تضحك لاراس بارتياح وتجلس؛ فقد انتهى ذلك الصباح الذي كاد يفسد على خير."
          en: "Laras laughs with relief and sits down; the morning that nearly went wrong has ended well."
      words: [kereta, terlambat, penumpang, jadwal, kantor, pagi, banget]
    criteria:
      - Jakarta commuter life rendered accurately (KRL Commuter Line, crowded platforms, women's carriage, tapping a card).
      - Narration in standard Indonesian; dialogue may use Jakarta colloquial (telat, banget, gue/lo) at BIPA 3, and banget is used.
      - 176–220 words.
    avoid:
      - Jakarta slang in the narration itself.
      - Stress and fear about being late; tone stays light.
    tags: [kabar-pagi, bipa3, jakarta, colloquial, register]
    verified: false

  - id: story_episode-024
    lang: id
    input:
      series: kabar_pagi
      level: bipa3
      target_words: [kesehatan, penting, olahraga, istirahat]
      due_words: [sehat, pagi, dokter]
      length_words: 220
    expect:
      title: "Jalan Pagi Pak Harun"
      level: bipa3
      sentences:
        - id: "\"Kesehatan itu penting, Pak Harun,\" kata dokter di puskesmas dengan ramah."
          arz: "«الصحة مهمة يا عم هارون،» قالت الدكتورة في الوحدة الصحية بلطف."
          ar: "قالت الطبيبة في المركز الصحي بلطف: «الصحة مهمّة يا عم هارون.»"
          en: "\"Health is important, Pak Harun,\" the doctor at the community health centre says kindly."
        - id: "\"Bapak tidak perlu olahraga berat. Cukup jalan kaki tiga puluh menit setiap pagi.\""
          arz: "«حضرتك مش محتاج رياضة تقيلة. كفاية تتمشّى نص ساعة كل يوم الصبح.»"
          ar: "«لا تحتاج إلى رياضة شاقّة. يكفي أن تمشي نصف ساعة كل صباح.»"
          en: "\"You don't need hard exercise. Just walk for thirty minutes every morning.\""
        - id: "Pak Harun sudah pensiun dari kantor pos dua tahun yang lalu, dan sejak itu ia lebih banyak duduk di rumah."
          arz: "عم هارون طلع على المعاش من البوستة من سنتين، ومن ساعتها بقى قاعد في البيت أغلب الوقت."
          ar: "تقاعد العم هارون من مكتب البريد قبل عامين، ومنذ ذلك الحين صار يقضي معظم وقته جالسًا في البيت."
          en: "Pak Harun retired from the post office two years ago, and since then he has mostly sat at home."
        - id: "Besok paginya, setelah salat subuh, ia memakai sepatu lama dan pergi ke alun-alun."
          arz: "تاني يوم الصبح، بعد صلاة الفجر، لبس جزمته القديمة وراح الميدان."
          ar: "في صباح اليوم التالي، بعد صلاة الفجر، لبس حذاءه القديم وذهب إلى الميدان."
          en: "The next morning, after the dawn prayer, he puts on his old shoes and goes to the town square."
        - id: "Udara masih sejuk, dan di sana sudah banyak orang: ada yang berlari, ada yang senam, ada yang hanya duduk mengobrol."
          arz: "الجو كان لسه منعش، وكان فيه ناس كتير: فيه اللي بيجري، واللي بيعمل تمارين، واللي قاعد يدردش بس."
          ar: "كان الهواء لا يزال منعشًا، وكان هناك كثير من الناس: منهم من يركض، ومن يمارس التمارين، ومن يجلس للدردشة فقط."
          en: "The air is still cool, and there are already lots of people: some running, some doing exercises, some just sitting and chatting."
        - id: "Setelah sepuluh menit, kaki Pak Harun mulai capek, jadi ia istirahat di bangku dekat pohon beringin."
          arz: "بعد عشر دقايق، رجلين عم هارون ابتدت تتعب، فقعد يرتاح على دكّة جنب شجرة التين البنغالي."
          ar: "بعد عشر دقائق، بدأت ساقا العم هارون تتعبان، فاستراح على مقعد قرب شجرة البانيان."
          en: "After ten minutes, Pak Harun's legs start to get tired, so he rests on a bench by the banyan tree."
        - id: "Seorang bapak tua di sebelahnya menawarkan air minum. \"Pelan-pelan saja, Pak. Saya juga dulu begitu.\""
          arz: "راجل كبير جنبه عرض عليه مية. «براحة يا حاج. أنا كمان كنت كده زمان.»"
          ar: "عرض عليه رجل مسنّ بجانبه ماءً. «على مهلك يا أخي. كنت مثلك أنا أيضًا من قبل.»"
          en: "An old man next to him offers him some water. \"Take it slowly. I was the same at first.\""
        - id: "Namanya Pak Slamet, dan ia sudah berjalan di alun-alun setiap pagi selama lima tahun."
          arz: "اسمه عم سلامت، وبقاله خمس سنين بيتمشّى في الميدان كل يوم الصبح."
          ar: "اسمه العم سلامت، وهو يمشي في الميدان كل صباح منذ خمس سنوات."
          en: "His name is Pak Slamet, and he has walked in the square every morning for five years."
        - id: "Sejak hari itu, mereka berjalan bersama dan istirahat bersama sambil minum teh hangat dari termos."
          arz: "من اليوم ده، بقوا يتمشّوا مع بعض ويرتاحوا مع بعض وهما بيشربوا شاي سخن من الترمس."
          ar: "ومنذ ذلك اليوم، صارا يمشيان معًا ويستريحان معًا وهما يشربان الشاي الدافئ من الترمس."
          en: "From that day on, they walk together and rest together, drinking warm tea from a thermos."
        - id: "Kadang-kadang Bu Harun ikut, dan kadang-kadang cucu mereka juga datang untuk bermain sepeda."
          arz: "ساعات مرات عم هارون بتيجي معاهم، وساعات حفيدهم كمان بييجي يلعب بالعجلة."
          ar: "أحيانًا ترافقهما زوجة العم هارون، وأحيانًا يأتي حفيدهما أيضًا ليلعب بالدرّاجة."
          en: "Sometimes Pak Harun's wife comes along, and sometimes their grandchild comes too, to ride a bike."
        - id: "Satu bulan kemudian, Pak Harun bisa berjalan tiga puluh menit tanpa berhenti."
          arz: "بعد شهر، عم هارون بقى يقدر يمشي نص ساعة من غير ما يقف."
          ar: "بعد شهر، صار العم هارون قادرًا على المشي نصف ساعة دون توقّف."
          en: "A month later, Pak Harun can walk for thirty minutes without stopping."
        - id: "Waktu kontrol, dokter tersenyum. \"Bagus, Pak. Bapak kelihatan lebih sehat dan segar.\""
          arz: "في المتابعة، الدكتورة ابتسمت. «برافو يا عم هارون. شكلك بقى أصحّ وأنشط.»"
          ar: "في موعد المتابعة، ابتسمت الطبيبة. «أحسنت يا عم هارون. تبدو أكثر صحّةً ونشاطًا.»"
          en: "At his check-up, the doctor smiles. \"Well done. You look healthier and fresher.\""
        - id: "Pak Harun tertawa. \"Bukan hanya sehat, Dok. Sekarang saya juga punya banyak teman baru.\""
          arz: "عم هارون ضحك. «مش بس صحة يا دكتورة. دلوقتي بقى عندي صحاب جداد كتير كمان.»"
          ar: "يضحك العم هارون. «ليست الصحّة فقط يا دكتورة. صار لي الآن أصدقاء جدد كثيرون أيضًا.»"
          en: "Pak Harun laughs. \"Not just healthier, Doctor. Now I've got lots of new friends too.\""
      words: [kesehatan, penting, olahraga, istirahat, sehat, pagi, dokter]
    criteria:
      - Contains the §24 test sentence "Kesehatan itu penting." (or a natural variant).
      - Health message is gentle and positive, no medical claims.
      - 176–220 words.
    avoid:
      - Fear-based health messaging, body shaming or specific medical advice.
    tags: [kabar-pagi, bipa3, test-text, health]
    verified: false

  - id: story_episode-025
    lang: id
    input:
      series: kabar_pagi
      level: bipa1
      target_words: [hujan, dingin, hangat]
      due_words: []
      length_words: 80
    expect:
      title: "Pagi Hujan"
      level: bipa1
      sentences:
        - id: "Pagi ini hujan."
          arz: "الصبح ده بتمطر."
          ar: "تمطر هذا الصباح."
          en: "It's raining this morning."
        - id: "Udara dingin sekali."
          arz: "الجو برد أوي."
          ar: "الجوّ بارد جدًّا."
          en: "The air is very cold."
        - id: "Hari ini hari Sabtu. Adi tidak pergi ke luar; dia duduk di dekat jendela."
          arz: "النهارده السبت. أدي مش خارج؛ قاعد جنب الشباك."
          ar: "اليوم يوم السبت. لا يخرج أدي؛ بل يجلس قرب النافذة."
          en: "Today is Saturday. Adi doesn't go out; he sits by the window."
