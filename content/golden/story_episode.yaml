  # ───────────── Sinetron, BIPA 2 ─────────────
  - id: story_episode-005
    lang: id
    input:
      series: sinetron
      level: bipa2
      target_words: [hangat, gula, manis, pelanggan]
      due_words: [teh, kopi, harga, murah]
      previous_summary: "Episode 4: Mona cooks koshari for Sari and Sari promises to cook Indonesian food. In Madiun, Pak Budi is quiet without Sari at the warung."
      length_words: 180
    expect:
      title: "Teh Manis dan Teh Mint"
      level: bipa2
      sentences:
        - id: "Di Madiun, pelanggan pertama datang ke warung Pak Budi jam enam pagi."
          arz: "في ماديون، أول زبونة جت محل عم بودي الساعة ستة الصبح."
          ar: "في ماديون، يأتي أول زبون إلى مطعم السيد بودي في السادسة صباحًا."
          en: "In Madiun, the first customer comes to Pak Budi's warung at six in the morning."
        - id: "\"Teh manis hangat satu, Pak!\" kata Bu Wati."
          arz: "«واحد شاي بسكر سخن يا عم بودي!» قالت الست واتي."
          ar: "قالت السيدة واتي: «كوب شاي محلًّى دافئ من فضلك يا سيد بودي!»"
          en: "\"One warm sweet tea, Pak!\" says Bu Wati."
        - id: "Pak Budi menuangkan teh panas ke gelas, lalu menambahkan dua sendok gula."
          arz: "عم بودي صبّ الشاي السخن في الكوباية، وبعدين حطّ معلقتين سكر."
          ar: "يصبّ السيد بودي الشاي الساخن في الكوب، ثم يضيف ملعقتين من السكّر."
          en: "Pak Budi pours hot tea into a glass, then adds two spoons of sugar."
        - id: "Bu Wati duduk di bangku kayu dan bertanya, \"Ada kabar dari Sari, Pak?\""
          arz: "الست واتي قعدت على الدكّة الخشب وسألت: «فيه أخبار من ساري يا عم بودي؟»"
          ar: "تجلس السيدة واتي على المقعد الخشبي وتسأل: «هل من أخبار عن ساري يا سيد بودي؟»"
          en: "Bu Wati sits on the wooden bench and asks, \"Any news from Sari, Pak?\""
        - id: "\"Nanti sore Rudi membantu saya video call dengan Sari, Bu.\""
          arz: "«النهارده العصر رودي هيساعدني أعمل مكالمة فيديو مع ساري.»"
          ar: "«بعد العصر سيساعدني رودي في مكالمة فيديو مع ساري يا سيدتي.»"
          en: "\"This afternoon Rudi is helping me video-call Sari, Bu.\""
        - id: "Sore itu, Sari muncul di layar ponsel dengan segelas teh di tangannya."
          arz: "العصر، ساري ظهرت على شاشة الموبايل وفي إيدها كوباية شاي."
          ar: "في ذلك العصر، تظهر ساري على شاشة الهاتف وفي يدها كوب شاي."
          en: "That afternoon, Sari appears on the phone screen with a glass of tea in her hand."
        - id: "\"Ayah, ini teh Mesir. Orang Mesir suka minum teh dengan daun mint.\""
          arz: "«يا بابا، ده شاي مصري. المصريين بيحبوا يشربوا الشاي بالنعناع.»"
          ar: "«أبي، هذا شاي مصري. يحبّ المصريون شرب الشاي بأوراق النعناع.»"
          en: "\"Dad, this is Egyptian tea. Egyptians like to drink tea with mint leaves.\""
        - id: "\"Manis?\" tanya Pak Budi. \"Manis sekali! Di sini orang suka banyak gula.\""
          arz: "«مسكّر؟» سأل عم بودي. «مسكّر أوي! الناس هنا بتحب السكر الكتير.»"
          ar: "سأل السيد بودي: «هل هو حلو؟» «حلو جدًّا! الناس هنا يحبّون السكّر الكثير.»"
          en: "\"Is it sweet?\" asks Pak Budi. \"Very sweet! People here like lots of sugar.\""
        - id: "\"Sama dengan di warung. Pelanggan paling suka teh manis hangat.\""
          arz: "«زي المحل بالظبط. الزباين أكتر حاجة بيحبوها الشاي بسكر السخن.»"
          ar: "«مثل المطعم تمامًا. أكثر ما يحبّه الزبائن هو الشاي المحلّى الدافئ.»"
          en: "\"Same as at the warung. Customers love warm sweet tea most.\""
        - id: "\"Berapa harga teh di Kairo, Nak?\""
          arz: "«الشاي بكام في القاهرة يا بنتي؟»"
          ar: "«كم ثمن الشاي في القاهرة يا ابنتي؟»"
          en: "\"How much is tea in Cairo, love?\""
        - id: "\"Di kedai kopi dekat kampus, satu gelas teh sepuluh pound. Murah, Yah.\""
          arz: "«في القهوة اللي جنب الجامعة، كوباية الشاي بعشرة جنيه. رخيصة يا بابا.»"
          ar: "«في المقهى القريب من الجامعة، كوب الشاي بعشرة جنيهات. إنه رخيص يا أبي.»"
          en: "\"At the coffee house near campus, a glass of tea is ten pounds. That's cheap, Dad.\""
        - id: "\"Di sini teh manis Ayah juga murah, cuma Rp3.000 segelas,\" kata Pak Budi sambil tertawa."
          arz: "«والشاي بسكر بتاع أبوكي هنا رخيص برضه، الكوباية بتلات آلاف روبية بس،» قال عم بودي وهو بيضحك."
          ar: "قال السيد بودي ضاحكًا: «وشاي أبيكِ المحلّى هنا رخيص أيضًا، ثلاثة آلاف روبية فقط للكوب.»"
          en: "\"Your dad's sweet tea here is cheap too, only Rp3,000 a glass,\" says Pak Budi with a laugh."
        - id: "Bu Wati masih duduk di warung dan ikut melihat layar ponsel itu."
          arz: "الست واتي كانت لسه قاعدة في المحل وبصّت هي كمان على شاشة الموبايل."
          ar: "كانت السيدة واتي لا تزال جالسة في المطعم، فنظرت هي أيضًا إلى شاشة الهاتف."
          en: "Bu Wati is still sitting at the warung and looks at the phone screen too."
        - id: "\"Pak Budi, coba jual teh mint juga! Saya mau jadi pelanggan pertama.\""
          arz: "«يا عم بودي، ما تجرّب تبيع شاي بالنعناع كمان! أنا عايزة أبقى أول زبونة.»"
          ar: "«يا سيد بودي، جرّب أن تبيع شاي النعناع أيضًا! أريد أن أكون أول زبونة.»"
          en: "\"Pak Budi, why not sell mint tea too! I want to be the first customer.\""
      words: [hangat, gula, manis, pelanggan, teh, kopi, harga, murah]
      summary: "On a video call, Pak Budi and Sari compare sweet hot tea at the warung with Egyptian mint tea in Cairo. Bu Wati, a regular customer, suggests adding mint tea to the warung menu."
    criteria:
      - Cuts between Madiun and Cairo or links them by a video call; the cast stays consistent.
      - Teh manis hangat (sweet hot tea) is shown as an everyday warung order; Egyptian tea with mint (shai bi-na'na') as a learner hook.
      - pelanggan used for a warung customer; all four target words appear.
      - BIPA 2 grammar is fine (di-/meN- verbs, time words), still short sentences.
      - 144–216 words.
    avoid:
      - Pak Budi speaking formal textbook Indonesian to a regular (a warm, simple register is expected).
      - Treating one culture's tea as better than the other.
    tags: [sinetron, bipa2, continuity, egypt-hook, food]
    verified: false

  - id: story_episode-006
    lang: id
    input:
      series: sinetron
      level: bipa2
      target_words: [kalimat, mungkin, abad]
      due_words: [bahasa, belajar, kelas]
      previous_summary: "Episode 5: Pak Budi and Sari compare sweet hot tea with Egyptian mint tea. Mona asks Sari to teach her some Indonesian."
      length_words: 200
    expect:
      title: "Kalimat, Bukan Kata"
      level: bipa2
      sentences:
        - id: "Malam ini Mona belajar bahasa Indonesia dengan Sari di kamar mereka yang kecil."
          arz: "الليلة دي منى بتتعلم إندونيسي مع ساري في أوضتهم الصغيرة."
          ar: "الليلة تتعلّم منى اللغة الإندونيسية مع ساري في غرفتهما الصغيرة."
          en: "Tonight Mona is learning Indonesian with Sari in their little room."
        - id: "Mona menunjuk kata \"buku\" di buku catatannya dan bertanya, \"Sari, ini satu kalimat, kan?\""
          arz: "منى شاوِرت على كلمة «⁨buku⁩» في الكشكول بتاعها وسألت: «يا ساري، دي ⁨kalimat⁩ واحدة، صح؟»"
          ar: "تشير منى إلى كلمة «⁨buku⁩» في دفترها وتسأل: «يا ساري، هذه ⁨kalimat⁩ واحدة، أليس كذلك؟»"
          en: "Mona points to the word \"buku\" in her notebook and asks, \"Sari, this is one kalimat, right?\""
        - id: "Sari tertawa kecil. \"Bukan, Mona. Itu satu kata. Kalimat itu beberapa kata bersama, seperti 'Saya membaca buku.'\""
          arz: "ساري ضحكت ضحكة صغيرة. «لأ يا منى. دي كلمة واحدة. الـ⁨kalimat⁩ يعني جملة، كذا كلمة مع بعض، زي ‹⁨Saya membaca buku.⁩›»"
          ar: "تضحك ساري قليلًا. «لا يا منى. هذه كلمة واحدة. الـ⁨kalimat⁩ جملة، أي عدّة كلمات معًا، مثل: ‹⁨Saya membaca buku.⁩›»"
          en: "Sari gives a little laugh. \"No, Mona. That's one word. A kalimat is a sentence, several words together, like 'Saya membaca buku.'\""
        - id: "\"Oh! Dalam bahasa Arab, kalimat artinya kata!\" kata Mona dengan mata besar."
          arz: "«آه! في العربي، ‹كلمة› معناها كلمة واحدة بس!» قالت منى وعينيها مفتوحة على آخرها."
          ar: "قالت منى بعينين واسعتين: «آه! في العربية، ‹الكلمة› لفظة واحدة فقط!»"
          en: "\"Oh! In Arabic, kalima means a word!\" says Mona, her eyes wide."
        - id: "\"Betul. Bunyinya mirip, tapi artinya berbeda,\" jawab Sari."
          arz: "«مظبوط. الصوت شبه بعض، بس المعنى مختلف،» ردّت ساري."
          ar: "أجابت ساري: «صحيح. اللفظ متشابه، لكنّ المعنى مختلف.»"
          en: "\"Right. They sound alike, but the meaning is different,\" Sari answers."
        - id: "\"Ada kata lain seperti itu?\" tanya Mona. \"Ada. Kata abad, misalnya.\""
          arz: "«فيه كلمات تانية زي كده؟» سألت منى. «آه. كلمة ⁨abad⁩ مثلًا.»"
          ar: "سألت منى: «هل توجد كلمات أخرى مثلها؟» «نعم. كلمة ⁨abad⁩ مثلًا.»"
          en: "\"Are there other words like that?\" Mona asks. \"Yes. The word abad, for example.\""
        - id: "\"Abad? Dalam bahasa Arab, itu artinya selamanya!\""
          arz: "«⁨abad⁩؟ دي في العربي معناها ‹الأبد›، يعني على طول!»"
          ar: "«⁨abad⁩؟ معناها في العربية ‹الأبد›!»"
          en: "\"Abad? In Arabic, that means forever!\""
        - id: "\"Di sini, abad artinya seratus tahun. Sekarang kita ada di abad kedua puluh satu.\""
          arz: "«هنا ⁨abad⁩ معناها قرن، يعني مية سنة. إحنا دلوقتي في القرن الواحد والعشرين.»"
          ar: "«هنا تعني ⁨abad⁩ قرنًا، أي مئة سنة. نحن الآن في القرن الحادي والعشرين.»"
          en: "\"Here, abad means a hundred years, a century. Now we're in the twenty-first century.\""
        - id: "\"Dan kata mungkin juga. Di sini artinya biasanya 'barangkali', bukan 'bisa'.\""
          arz: "«وكمان كلمة ⁨mungkin⁩. هنا معناها في الغالب ‹يمكن›، مش ‹ممكن›.»"
          ar: "«وكذلك كلمة ⁨mungkin⁩. معناها هنا في الغالب ‹ربما›، لا ‹ممكن›.»"
          en: "\"And the word mungkin too. Here it usually means 'perhaps', not 'possible'.\""
        - id: "Mona menulis tiga kata itu di buku catatannya, dengan arti Arabnya di sebelah kanan."
          arz: "منى كتبت التلات كلمات في الكشكول، وجنب كل واحدة معناها بالعربي على اليمين."
          ar: "تكتب منى الكلمات الثلاث في دفترها، ومعناها بالعربية إلى اليمين."
          en: "Mona writes the three words in her notebook, with their Arabic meanings on the right."
        - id: "\"Besok di kelas, mungkin saya bisa membuat satu kalimat yang benar,\" kata Mona."
          arz: "«بكرة في الفصل، يمكن أقدر أعمل جملة واحدة صح،» قالت منى."
          ar: "قالت منى: «غدًا في الصف، ربما أستطيع أن أكوّن جملة واحدة صحيحة.»"
          en: "\"Tomorrow in class, maybe I can make one correct sentence,\" says Mona."
        - id: "\"Bukan satu, Mona. Mungkin sepuluh kalimat!\" jawab Sari."
          arz: "«مش واحدة يا منى. يمكن عشر جمل!» ردّت ساري."
          ar: "أجابت ساري: «ليست واحدة يا منى. ربما عشر جمل!»"
          en: "\"Not one, Mona. Maybe ten sentences!\" Sari replies."
        - id: "Mereka tertawa bersama, lalu minum teh hangat sampai jam sebelas malam."
          arz: "ضحكوا مع بعض، وبعدين شربوا شاي سخن لحد الساعة حداشر بالليل."
          ar: "تضحكان معًا، ثم تشربان الشاي الدافئ حتى الحادية عشرة ليلًا."
          en: "They laugh together, then drink warm tea until eleven at night."
        - id: "Belajar bahasa itu seperti punya teman baru: kadang lucu, tapi selalu menyenangkan."
          arz: "تعلّم لغة جديدة زي ما يكون عندك صاحب جديد: ساعات يضحّك، بس دايمًا ممتع."
          ar: "تعلّم لغةٍ يشبه أن يكون لك صديق جديد: مضحك أحيانًا، لكنه ممتع دائمًا."
          en: "Learning a language is like having a new friend: sometimes funny, but always fun."
      words: [kalimat, mungkin, abad, bahasa, belajar, kelas]
      summary: "Sari teaches Mona Indonesian. Mona learns that kalimat means a sentence (not a word), abad a century (not forever), and mungkin usually maybe (not possible), and they laugh about these false friends."
    criteria:
      - Each Bridge word is used in its Indonesian meaning - kalimat = sentence, abad = century, mungkin = maybe.
      - A friendly mix-up scene that makes the Arabic false-friend contrast clear (Arabic words may appear briefly, e.g. كلمة), without a lecture.
      - The translations give the Indonesian meanings (kalimat = جملة, not كلمة; abad = قرن, not أبد).
      - 160–240 words.
    avoid:
      - Using kalimat to mean a single word, or abad to mean eternity.
      - Mocking Mona's mistakes.
    tags: [sinetron, bipa2, bridge, false-friend]
    verified: false

