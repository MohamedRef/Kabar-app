          en: "Raka waves at the window. \"Mum, come and play!\""
        - id: "Bu Rina tertawa, lalu membawa tiga gelas air dingin dan sepiring pisang goreng ke taman."
          arz: "الست رينا ضحكت، وبعدين خدت تلات كوبايات مية ساقعة وطبق موز مقلي للجنينة."
          ar: "تضحك السيدة رينا، ثم تحمل ثلاثة أكواب من الماء البارد وطبقًا من الموز المقلي إلى الحديقة."
          en: "Bu Rina laughs, then carries three glasses of cold water and a plate of fried bananas to the park."
        - id: "Pagi itu terasa segar dan menyenangkan: rumah bersih, taman bersih, dan anak-anak bisa bermain dengan gembira."
          arz: "الصبح ده كان منعش وحلو: البيت نضيف، والجنينة نضيفة، والعيال بيلعبوا وهما فرحانين."
          ar: "كان ذلك الصباح منعشًا وممتعًا: البيت نظيف، والحديقة نظيفة، والأطفال يلعبون بفرح."
