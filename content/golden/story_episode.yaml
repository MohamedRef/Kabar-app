          ar: "في القاهرة، الشوارع مليئة بالفوانيس الملوّنة."
          en: "In Cairo, the streets are full of colourful fanous lanterns."
        - id: "Ibu Mona mengundang Sari untuk buka puasa bersama keluarga besar mereka di rumah."
          arz: "مامة منى عزمت ساري تفطر مع العيلة كلها في البيت."
          ar: "تدعو أمّ منى ساري إلى الإفطار مع عائلتهم الكبيرة في البيت."
          en: "Mona's mother invites Sari to break the fast with their whole family at home."
        - id: "Meja makan penuh makanan: sup lentil, mahsyi, ayam, roti, dan kurma."
          arz: "السفرة مليانة أكل: شوربة عدس، ومحشي، وفراخ، وعيش، وبلح."
          ar: "مائدة الطعام عامرة: حساء العدس، والمحشي، والدجاج، والخبز، والتمر."
          en: "The table is full of food: lentil soup, mahshi, chicken, bread and dates."
        - id: "Waktu azan magrib terdengar, semua orang minum air dan makan kurma dulu."
          arz: "لما أذان المغرب اتسمع، الكل شرب مية وكل بلح الأول."
          ar: "حين يُسمع أذان المغرب، يشرب الجميع الماء ويأكلون التمر أولًا."
          en: "When the sunset call to prayer is heard, everyone drinks water and eats dates first."
        - id: "\"Ayo makan, Sari. Jangan malu-malu!\" kata ibu Mona dengan ramah."
          arz: "«يلا كُلي يا ساري. ما تتكسفيش!» قالت مامة منى بلطف."
          ar: "قالت أمّ منى بلطف: «هيّا كُلي يا ساري. لا تخجلي!»"
          en: "\"Come on, eat, Sari. Don't be shy!\" says Mona's mother kindly."
        - id: "Makanannya enak sekali, tapi Sari sedikit rindu ayahnya dan warung kecil di Madiun."
          arz: "الأكل حلو أوي، بس ساري وحشها أبوها شوية والمحل الصغير في ماديون."
          ar: "الطعام لذيذ جدًّا، لكنّ ساري تشتاق قليلًا إلى أبيها وإلى المطعم الصغير في ماديون."
          en: "The food is delicious, but Sari misses her father a little, and the little warung in Madiun."
        - id: "Setelah makan, Mona berbisik, \"Ayo telepon ayahmu.\""
          arz: "بعد الأكل، منى قالتلها بصوت واطي: «يلا كلّمي باباكي.»"
          ar: "بعد الطعام، همست منى: «هيّا اتصلي بأبيكِ.»"
          en: "After the meal, Mona whispers, \"Go on, call your dad.\""
        - id: "Di Madiun sudah hampir tengah malam, tapi Pak Budi masih menunggu telepon dari Sari."
          arz: "في ماديون الساعة قرّبت على نص الليل، بس عم بودي لسه مستني تليفون ساري."
          ar: "في ماديون اقترب منتصف الليل، لكنّ السيد بودي ما زال ينتظر اتصال ساري."
          en: "In Madiun it is almost midnight, but Pak Budi is still waiting for Sari's call."
        - id: "\"Ayah, keluarga Mona baik sekali. Ibunya masak banyak sekali!\""
          arz: "«يا بابا، عيلة منى طيبين أوي. ومامتها طابخة أكل كتير قوي!»"
          ar: "«أبي، عائلة منى طيبة جدًّا. وقد طبخت أمّها طعامًا كثيرًا جدًّا!»"
          en: "\"Dad, Mona's family is so kind. Her mother cooked so much food!\""
        - id: "\"Alhamdulillah. Bilang terima kasih untuk ibu Mona, ya, Nak,\" kata Pak Budi."
          arz: "«الحمد لله. قولي لمامة منى شكرًا يا بنتي،» قال عم بودي."
          ar: "قال السيد بودي: «الحمد لله. اشكري أمّ منى عنّي يا ابنتي.»"
          en: "\"Thank God. Say thank you to Mona's mother for me, love,\" says Pak Budi."
        - id: "Malam itu Sari tidak terlalu rindu lagi, karena dia punya keluarga di dua negara."
          arz: "الليلة دي ساري ما بقاش وحشها البيت أوي، عشان بقى ليها عيلة في بلدين."
          ar: "في تلك الليلة لم تعد ساري تشتاق كثيرًا، لأنّ لها عائلة في بلدين."
          en: "That night Sari doesn't feel so homesick any more, because she has family in two countries."
      words: [puasa, buka, keluarga, rindu, makan, minum, malam, ibu]
      summary: "Sari's first Ramadan in Cairo: Mona's family invites her to iftar, while in Madiun Pak Budi sells takjil at the warung. Late that night in Madiun, father and daughter talk on a video call after both have broken their fast."
    criteria:
      - Ramadan details are accurate on both sides - takjil/kolak/es buah and bedug or adzan maghrib in Java; fanous lanterns, iftar tables and Mona's family in Cairo.
      - buka used in "buka puasa"; puasa as the fast; all target words appear.
      - Respectful, warm treatment of religious practice; no preaching.
      - The time difference holds (Madiun is five hours ahead of Cairo, so a call after a Cairo iftar is late at night in Madiun).
      - 160–240 words.
    avoid:
      - Religious or ethnic stereotypes; treating either country's Ramadan as more correct.
      - Getting the time of buka puasa wrong (it is at maghrib/sunset).
    tags: [sinetron, bipa2, culture, ramadan, egypt-hook, gloss-outside-content]
    verified: false

  - id: story_episode-008
    lang: id
    input:
      series: sinetron
      level: bipa2
      target_words: [harga, mahal, murah, bayar]
      due_words: [pasar, ayam, ikan, uang]
      previous_summary: "Episode 7: Sari's first iftar with Mona's family; in Madiun Pak Budi sells takjil. Prices at the Madiun market have gone up before Lebaran."
      length_words: 180
    expect:
      title: "Harga Naik"
      level: bipa2
      sentences:
        - id: "Seminggu sebelum Lebaran, Pak Budi pergi ke pasar besar pagi-pagi sekali."
          arz: "قبل العيد بأسبوع، عم بودي راح السوق الكبير من بدري أوي."
          ar: "قبل العيد بأسبوع، يذهب السيد بودي إلى السوق الكبير في الصباح الباكر جدًّا."
          en: "A week before Lebaran, Pak Budi goes to the big market very early in the morning."
        - id: "Pasar sangat ramai karena semua orang belanja untuk Lebaran, dan harga banyak barang naik."
          arz: "السوق زحمة جدًّا عشان الناس كلها بتشتري حاجات العيد، وأسعار حاجات كتير غليت."
          ar: "السوق مزدحم جدًّا لأنّ الجميع يتسوّقون للعيد، وقد ارتفعت أسعار كثير من السلع."
          en: "The market is very crowded because everyone is shopping for Lebaran, and the prices of many things have gone up."
        - id: "\"Bu, ayamnya berapa sekilo?\" tanya Pak Budi kepada penjual ayam."
          arz: "«يا حاجة، كيلو الفراخ بكام؟» سأل عم بودي بيّاعة الفراخ."
          ar: "سأل السيد بودي بائعة الدجاج: «يا سيدتي، بكم كيلو الدجاج؟»"
          en: "\"Ma'am, how much is the chicken per kilo?\" Pak Budi asks the chicken seller."
        - id: "\"Empat puluh lima ribu, Pak. Sebelum Lebaran memang begini.\""
          arz: "«بخمسة وأربعين ألف يا حاج. قبل العيد دايمًا كده.»"
          ar: "«بخمسة وأربعين ألفًا يا سيدي. هكذا الحال دائمًا قبل العيد.»"
          en: "\"Forty-five thousand, sir. It's always like this before Lebaran.\""
        - id: "\"Wah, mahal sekali! Bulan lalu masih tiga puluh lima ribu.\""
          arz: "«ياه، غالي أوي! الشهر اللي فات كان بخمسة وتلاتين ألف.»"
          ar: "«يا إلهي، هذا غالٍ جدًّا! في الشهر الماضي كان بخمسة وثلاثين ألفًا.»"
          en: "\"Wow, that's very expensive! Last month it was still thirty-five thousand.\""
        - id: "\"Kurang sedikit, ya, Bu? Saya beli tiga kilo.\""
          arz: "«نزّلي شوية يا حاجة؟ أنا هاخد تلاتة كيلو.»"
          ar: "«هل تخفّضين قليلًا يا سيدتي؟ سأشتري ثلاثة كيلوغرامات.»"
          en: "\"A little less, ma'am? I'm buying three kilos.\""
        - id: "Penjual itu berpikir sebentar, lalu tersenyum. \"Ya sudah, empat puluh dua ribu, Pak.\""
          arz: "البيّاعة فكّرت شوية، وبعدين ابتسمت. «خلاص، باتنين وأربعين ألف يا حاج.»"
          ar: "تفكّر البائعة قليلًا ثم تبتسم. «حسنًا، باثنين وأربعين ألفًا يا سيدي.»"
          en: "The seller thinks for a moment, then smiles. \"All right, forty-two thousand, sir.\""
        - id: "Pak Budi setuju. Dia membayar Rp126.000 dengan uang pas."
          arz: "عم بودي وافق. دفع ١٢٦ ألف روبية فكّة مظبوطة."
          ar: "يوافق السيد بودي. يدفع ١٢٦ ألف روبية بالمبلغ المضبوط."
          en: "Pak Budi agrees. He pays Rp126,000 in exact change."
        - id: "Lalu dia ke penjual ikan. Ikan lele di sini murah: dua puluh lima ribu sekilo."
          arz: "بعدين راح لبيّاع السمك. القرموط هنا رخيص: الكيلو بخمسة وعشرين ألف."
          ar: "ثم يذهب إلى بائع السمك. سمك السلّور هنا رخيص: خمسة وعشرون ألفًا للكيلو."
          en: "Then he goes to the fish seller. Catfish here is cheap: twenty-five thousand a kilo."
        - id: "\"Lelenya dua kilo, Pak. Bisa bayar pakai QRIS?\" \"Bisa, Pak!\""
          arz: "«اتنين كيلو قرموط يا حاج. ينفع أدفع بـ⁨QRIS⁩؟» «ينفع يا حاج!»"
          ar: "«كيلوغرامان من السلّور يا سيدي. هل يمكنني الدفع عبر ⁨QRIS⁩؟» «نعم يا سيدي!»"
          en: "\"Two kilos of catfish, sir. Can I pay with QRIS?\" \"Sure, sir!\""
        - id: "Di jalan pulang, Pak Budi naik motornya pelan-pelan dan berpikir tentang warungnya."
          arz: "وهو راجع، عم بودي سايق الموتوسيكل على مهله وبيفكّر في المحل بتاعه."
          ar: "في طريق العودة، يقود السيد بودي درّاجته النارية ببطء ويفكّر في مطعمه."
          en: "On the way home, Pak Budi rides his motorbike slowly and thinks about his warung."
        - id: "Harga di pasar naik, tapi banyak pelanggannya tidak punya banyak uang, apalagi sebelum Lebaran."
          arz: "الأسعار في السوق غليت، بس زباين كتير عنده مامعهمش فلوس كتير، خصوصًا قبل العيد."
          ar: "ارتفعت الأسعار في السوق، لكنّ كثيرًا من زبائنه لا يملكون مالًا كثيرًا، لا سيّما قبل العيد."
          en: "Market prices are up, but many of his customers don't have much money, especially before Lebaran."
        - id: "\"Harga pecel di warung tetap Rp10.000,\" katanya dalam hati."
          arz: "«سعر البيتشيل في المحل هيفضل عشرة آلاف روبية،» قال في سرّه."
          ar: "قال في نفسه: «سيبقى سعر طبق البيتشيل في المطعم عشرة آلاف روبية.»"
          en: "\"The pecel at the warung stays Rp10,000,\" he says to himself."
        - id: "Malam itu Bu Wati senang sekali mendengar kabar itu. \"Pak Budi memang baik hati!\" katanya."
          arz: "بالليل الست واتي فرحت أوي لما سمعت الخبر ده. «عم بودي ده قلبه طيب بجد!» قالت."
          ar: "في تلك الليلة فرحت السيدة واتي كثيرًا حين سمعت الخبر. قالت: «السيد بودي طيّب القلب حقًّا!»"
          en: "That evening Bu Wati is very glad to hear the news. \"Pak Budi really is kind-hearted!\" she says."
      words: [harga, mahal, murah, bayar, pasar, ayam, ikan, uang]
      summary: "Before Lebaran, Pak Budi finds chicken expensive at the Madiun market and bargains politely. He pays a fair price and decides not to raise the price of his own dishes for his regular customers."
    criteria:
      - Market haggling is polite and realistic (sekilo, berapa, kurang sedikit, Bu); prices plausible for 2026 East Java, written Rp45.000 or spelled out in dialogue.
      - Continues the pre-Lebaran thread from previous_summary.
      - All target words appear; due words used.
      - 144–216 words.
    avoid:
      - Aggressive or rude bargaining, or sellers portrayed as cheats.
      - Mixing up ribu (thousand) and juta (million).
    tags: [sinetron, bipa2, prices, numbers, continuity]
    verified: false

  - id: story_episode-009
    lang: id
    input:
      series: sinetron
      level: bipa2
      target_words: [jam, setengah, menit, terlambat]
      due_words: [kelas, pagi, bus]
      previous_summary: "Episode 8: Pak Budi bargains for chicken before Lebaran and keeps his warung's prices the same. In Cairo, Sari has her first exam next week."
      length_words: 160
    expect:
      title: "Jangan Terlambat, Sari!"
      level: bipa2
      sentences:
        - id: "Hari ini Sari ada ujian pertama di kampusnya di Kairo."
          arz: "النهارده ساري عندها أول امتحان في جامعتها في القاهرة."
          ar: "اليوم لدى ساري أول امتحان في جامعتها في القاهرة."
          en: "Today Sari has her first exam at her university in Cairo."
        - id: "Ujiannya mulai jam delapan pagi di kelas besar di lantai tiga."
          arz: "الامتحان بيبدأ الساعة تمانية الصبح في مدرّج كبير في الدور التالت."
          ar: "يبدأ الامتحان في الثامنة صباحًا في قاعة كبيرة في الطابق الثالث."
          en: "The exam starts at eight in the morning in a big classroom on the third floor."
        - id: "Sari bangun jam setengah tujuh, lalu cepat-cepat mandi, salat, dan sarapan roti dengan keju."
          arz: "ساري صحيت الساعة ستة ونص، وبعدين بسرعة استحمّت وصلّت وفطرت عيش بجبنة."
          ar: "تستيقظ ساري في السادسة والنصف، ثم تستحمّ وتصلّي وتفطر خبزًا بالجبن على عجل."
          en: "Sari wakes up at half past six, then quickly showers, prays and has bread and cheese for breakfast."
        - id: "Jam tujuh, dia sudah menunggu bus di pinggir jalan dekat apartemennya."
          arz: "الساعة سبعة، كانت مستنية الأتوبيس على جنب الشارع جنب الشقة."
          ar: "في السابعة، تكون قد وقفت تنتظر الحافلة على جانب الطريق قرب شقّتها."
          en: "At seven, she is already waiting for the bus by the road near her flat."
        - id: "Tapi pagi itu busnya penuh sekali, dan jalan ke kampus macet."
          arz: "بس الصبح ده الأتوبيس كان زحمة أوي، والطريق للجامعة واقف."
          ar: "لكنّ الحافلة كانت ممتلئة جدًّا ذلك الصباح، والطريق إلى الجامعة مزدحم."
          en: "But that morning the bus is packed, and the road to campus is jammed."
        - id: "Lima menit, sepuluh menit, dua puluh menit, bus hampir tidak bergerak."
          arz: "خمس دقايق، عشر دقايق، عشرين دقيقة، والأتوبيس يا دوب بيتحرّك."
          ar: "خمس دقائق، عشر دقائق، عشرون دقيقة، والحافلة لا تكاد تتحرّك."
          en: "Five minutes, ten minutes, twenty minutes: the bus barely moves."
        - id: "Sari melihat jamnya: sudah jam setengah delapan."
          arz: "ساري بصّت في الساعة: بقت سبعة ونص."
          ar: "تنظر ساري إلى ساعتها: لقد صارت السابعة والنصف."
          en: "Sari looks at her watch: it's already half past seven."
        - id: "\"Aduh, nanti saya terlambat!\" katanya dalam hati."
          arz: "«يا خبر، كده هتأخّر!» قالت في سرّها."
          ar: "قالت في نفسها: «يا إلهي، سأتأخّر!»"
          en: "\"Oh no, I'm going to be late!\" she thinks."
        - id: "Seorang ibu di sebelahnya tersenyum dan bilang, dalam bahasa Arab, bahwa sebentar lagi jalannya lancar."
          arz: "ست جنبها ابتسمت وقالتلها بالعربي إن الطريق هيفتح كمان شوية."
          ar: "تبتسم سيدة بجانبها وتقول لها بالعربية إنّ الطريق سينفرج بعد قليل."
          en: "A woman next to her smiles and says, in Arabic, that the traffic will clear soon."
        - id: "Benar saja, jalannya mulai lancar, dan bus sampai di kampus jam delapan kurang lima menit."
          arz: "وفعلًا، الطريق ابتدى يمشي، والأتوبيس وصل الجامعة الساعة تمانية إلا خمسة."
          ar: "وبالفعل، بدأ الطريق ينفرج، ووصلت الحافلة إلى الجامعة في الثامنة إلا خمس دقائق."
          en: "Sure enough, the traffic starts moving, and the bus reaches campus at five to eight."
        - id: "Sari berlari ke kelas dan duduk tepat waktu."
          arz: "ساري جريت على الفصل وقعدت في ميعادها بالظبط."
          ar: "تركض ساري إلى القاعة وتجلس في الموعد تمامًا."
          en: "Sari runs to the classroom and sits down right on time."
        - id: "Di ponselnya ada pesan dari ayahnya: \"Semoga sukses, Nak. Ayah bangga.\""
          arz: "على الموبايل كان فيه رسالة من أبوها: «ربنا يوفّقك يا بنتي. أنا فخور بيكي.»"
          ar: "على هاتفها رسالة من أبيها: «بالتوفيق يا ابنتي. أبوكِ فخور بكِ.»"
          en: "On her phone there's a message from her father: \"Good luck, love. Dad is proud.\""
        - id: "Sari tersenyum. Dia tidak terlambat, dan hatinya tenang."
          arz: "ساري ابتسمت. ما اتأخّرتش، وقلبها اطمّن."
          ar: "تبتسم ساري. لم تتأخّر، وقلبها مطمئن."
          en: "Sari smiles. She isn't late, and her heart is calm."
        - id: "Waktu dosen membagikan kertas ujian, Sari menarik napas panjang dan mulai menulis."
          arz: "لما الدكتور وزّع ورق الامتحان، ساري خدت نفس طويل وابتدت تكتب."
          ar: "حين يوزّع الأستاذ أوراق الامتحان، تأخذ ساري نفَسًا عميقًا وتبدأ الكتابة."
          en: "When the lecturer hands out the exam papers, Sari takes a deep breath and starts writing."
      words: [jam, setengah, menit, terlambat, kelas, pagi, bus]
      summary: "On exam day Sari's bus in Cairo is stuck in traffic and she worries about being late. She arrives just in time, and her father's good-luck message makes her smile."
    criteria:
      - "Clock times follow Indonesian usage: jam setengah tujuh = 6:30 (half before seven), not 7:30; any times stay internally consistent."
      - Cairo commuting detail is plausible (crowded bus or microbus, traffic).
      - All target words appear; due words used.
      - 128–192 words.
    avoid:
      - Using setengah delapan to mean 8:30.
      - Panic or fear-based tension; the stakes stay gentle.
    tags: [sinetron, bipa2, numbers, time, tricky]
    verified: false

  - id: story_episode-010
    lang: id
    input:
      series: sinetron
      level: bipa2
      target_words: [online, video, pesan, kirim]
      due_words: [telepon, ayah, foto]
      previous_summary: "Episode 9: Sari makes it to her exam on time. Pak Budi wants to learn to video-call by himself instead of waiting for his nephew Rudi."
      length_words: 180
    expect:
      title: "Pak Budi Belajar Video Call"
      level: bipa2
      sentences:
        - id: "Sore itu warung agak sepi, dan Rudi, keponakan Pak Budi, datang membawa ponsel baru."
          arz: "العصر ده المحل كان هادي شوية، ورودي، ابن أخو عم بودي، جه ومعاه موبايل جديد."
          ar: "كان المطعم هادئًا بعض الشيء ذلك العصر، فجاء رودي، ابن أخي السيد بودي، ومعه هاتف جديد."
          en: "That afternoon the warung is fairly quiet, and Rudi, Pak Budi's nephew, comes with a new phone."
        - id: "\"Pakdhe, sekarang Pakdhe harus bisa video call sendiri,\" kata Rudi."
          arz: "«يا عمّي، لازم من النهارده تعرف تعمل مكالمة فيديو لوحدك،» قال رودي."
          ar: "قال رودي: «يا عمّي، يجب أن تتعلّم الآن إجراء مكالمة الفيديو بنفسك.»"
          en: "\"Uncle, now you have to be able to video-call by yourself,\" says Rudi."
        - id: "Pak Budi memegang ponsel itu dengan hati-hati. \"Bagaimana cara kirim foto ke Sari?\""
          arz: "عم بودي مسك الموبايل بحرص. «أبعت صورة لساري إزاي؟»"
          ar: "يمسك السيد بودي الهاتف بحذر. «كيف أرسل صورة إلى ساري؟»"
          en: "Pak Budi holds the phone carefully. \"How do I send a photo to Sari?\""
        - id: "Rudi menunjukkan aplikasinya. \"Pertama, ponselnya harus online. Lihat, ada sinyal.\""
          arz: "رودي ورّاه البرنامج. «الأول، الموبايل لازم يكون متوصّل بالنت. بص، فيه شبكة.»"
          ar: "يريه رودي التطبيق. «أولًا، يجب أن يكون الهاتف متّصلًا بالإنترنت. انظر، هناك إشارة.»"
          en: "Rudi shows him the app. \"First, the phone has to be online. Look, there's a signal.\""
        - id: "\"Lalu tekan nama Sari, pilih foto, dan tekan kirim.\""
          arz: "«وبعدين دوس على اسم ساري، واختار الصورة، ودوس ‹إرسال›.»"
          ar: "«ثم اضغط على اسم ساري، واختر الصورة، واضغط ‹إرسال›.»"
          en: "\"Then tap Sari's name, choose a photo and tap send.\""
        - id: "Pak Budi pelan-pelan mengirim foto nasi pecel dari warungnya. Berhasil!"
          arz: "عم بودي بعت على مهله صورة طبق بيتشيل من المحل. ونجحت!"
          ar: "يرسل السيد بودي على مهل صورة طبق البيتشيل من مطعمه. لقد نجح!"
          en: "Slowly, Pak Budi sends a photo of nasi pecel from his warung. It works!"
        - id: "Kemudian dia menulis pesan pendek: \"Ini makan siang Ayah hari ini.\""
          arz: "وبعدين كتب رسالة قصيرة: «ده غدا بابا النهارده.»"
          ar: "ثم يكتب رسالة قصيرة: «هذا غداء أبيكِ اليوم.»"
          en: "Then he writes a short message: \"This is Dad's lunch today.\""
        - id: "Lima menit kemudian, ada pesan balasan dari Sari: \"Wah, enak sekali! Kangen pecel!\""
          arz: "بعد خمس دقايق، جه رد من ساري: «الله، شكله يجنّن! البيتشيل وحشني!»"
          ar: "بعد خمس دقائق، تصل رسالة ردّ من ساري: «يا للروعة، يبدو لذيذًا جدًّا! اشتقت إلى البيتشيل!»"
          en: "Five minutes later, a reply comes from Sari: \"Wow, that looks so good! I miss pecel!\""
        - id: "\"Sekarang yang paling sulit: video call,\" kata Rudi sambil tertawa."
          arz: "«دلوقتي أصعب حاجة: مكالمة الفيديو،» قال رودي وهو بيضحك."
          ar: "قال رودي ضاحكًا: «والآن الأصعب: مكالمة الفيديو.»"
          en: "\"Now the hardest part: the video call,\" says Rudi, laughing."
        - id: "\"Tekan gambar kamera kecil ini, Pakdhe. Bukan tombol telepon biasa.\""
          arz: "«دوس على رسمة الكاميرا الصغيرة دي يا عمّي. مش زرار التليفون العادي.»"
          ar: "«اضغط على رمز الكاميرا الصغير هذا يا عمّي، لا على زرّ الهاتف العادي.»"
          en: "\"Tap this little camera icon, Uncle. Not the ordinary phone button.\""
        - id: "Pak Budi menekan tombol itu. Ponselnya berbunyi, dan tiba-tiba wajah Sari muncul di layar."
          arz: "عم بودي داس على الزرار. الموبايل رنّ، وفجأة وش ساري ظهر على الشاشة."
          ar: "يضغط السيد بودي على الزرّ. يرنّ الهاتف، وفجأة يظهر وجه ساري على الشاشة."
          en: "Pak Budi presses the button. The phone rings, and suddenly Sari's face appears on the screen."
        - id: "\"Ayah! Ayah video call sendiri?\" tanya Sari dengan mata besar."
          arz: "«بابا! إنت بتكلمني فيديو لوحدك؟» سألت ساري وعينيها واسعة."
          ar: "سألت ساري بعينين واسعتين: «أبي! هل أجريت مكالمة الفيديو بنفسك؟»"
          en: "\"Dad! Did you video-call by yourself?\" Sari asks, wide-eyed."
        - id: "\"Iya, Nak. Ayah belajar dari Rudi. Sekarang Ayah bisa telepon kamu kapan saja.\""
          arz: "«أيوه يا بنتي. اتعلّمت من رودي. دلوقتي أقدر أكلّمك في أي وقت.»"
          ar: "«نعم يا ابنتي. تعلّمت من رودي. والآن أستطيع أن أتصل بكِ في أي وقت.»"
          en: "\"Yes, love. I learned from Rudi. Now I can call you any time.\""
        - id: "Sari tertawa bahagia. \"Ayah hebat! Saya bangga sekali.\""
          arz: "ساري ضحكت وهي فرحانة. «إنت جامد يا بابا! أنا فخورة بيك أوي.»"
          ar: "تضحك ساري بسعادة. «أنت رائع يا أبي! أنا فخورة بك جدًّا.»"
          en: "Sari laughs happily. \"You're amazing, Dad! I'm so proud.\""
      words: [online, video, pesan, kirim, telepon, ayah, foto]
      summary: "Rudi teaches Pak Budi to send messages and photos and to start a video call. Pak Budi calls Sari by himself for the first time, and she is very proud of him."
    criteria:
      - Loanwords (online, video) are used the way Indonesians use them inside Indonesian sentences.
      - No full English sentences; any "video call" stays a loanword phrase inside Indonesian.
      - Rudi is a nephew (consistent with previous_summary); all target words appear.
      - 144–216 words.
    avoid:
      - "English leaking in beyond loanwords (\"Okay, let me show you how\")."
      - Making fun of an older man for not knowing technology.
    tags: [sinetron, bipa2, loanwords, code-mixing]
    verified: false

  - id: story_episode-011
    lang: id
    input:
      series: sinetron
      level: bipa2
      target_words: [kacang, pedas, sayur, nasi]
      due_words: [makan, enak, pagi, warung]
      previous_summary: "Episode 10: Pak Budi learns to video-call Sari by himself. Mona wants to know what Madiun is famous for."
      length_words: 200
    expect:
      title: "Nasi Pecel Madiun"
      level: bipa2
      sentences:
        - id: "\"Sari, Madiun terkenal dengan apa?\" tanya Mona suatu sore."
          arz: "«يا ساري، ماديون مشهورة بإيه؟» سألت منى في يوم العصر."
          ar: "سألت منى ذات عصر: «يا ساري، بمَ تشتهر ماديون؟»"
          en: "\"Sari, what is Madiun famous for?\" Mona asks one afternoon."
        - id: "\"Nasi pecel!\" jawab Sari. \"Ayo kita tanya ayah saya.\""
          arz: "«البيتشيل!» ردّت ساري. «تعالي نسأل بابا.»"
          ar: "أجابت ساري: «البيتشيل!» «تعالي نسأل أبي.»"
          en: "\"Nasi pecel!\" Sari answers. \"Let's ask my dad.\""
        - id: "Di Madiun sudah malam, tapi Pak Budi masih di warung dan langsung menerima video call."
          arz: "في ماديون كان الوقت بالليل، بس عم بودي كان لسه في المحل وردّ على مكالمة الفيديو على طول."
          ar: "كان الليل قد حلّ في ماديون، لكنّ السيد بودي كان لا يزال في المطعم فقبل مكالمة الفيديو فورًا."
          en: "In Madiun it's already evening, but Pak Budi is still at the warung and picks up the video call at once."
        - id: "\"Ini nasi pecel, Mona,\" kata Pak Budi sambil menunjukkan sepiring nasi."
          arz: "«ده البيتشيل يا منى،» قال عم بودي وهو بيورّيها طبق رز."
          ar: "قال السيد بودي وهو يريها طبقًا من الأرز: «هذا هو البيتشيل يا منى.»"
          en: "\"This is nasi pecel, Mona,\" says Pak Budi, showing a plate of rice."
        - id: "\"Di atas nasi ada sayur rebus: bayam, kangkung, tauge, dan kacang panjang.\""
          arz: "«فوق الرز فيه خضار مسلوق: سبانخ، وكانكونج، وفول نابت، ولوبيا خضرا طويلة.»"
          ar: "«فوق الأرز خضار مسلوقة: سبانخ، وسبانخ الماء، وبراعم الفاصولياء، واللوبياء الطويلة.»"
          en: "\"On the rice there are boiled vegetables: spinach, water spinach, bean sprouts and long beans.\""
        - id: "\"Lalu kami tuang sambal kacang yang manis dan pedas, dan tambah rempeyek.\""
          arz: "«وبعدين بنصبّ عليه صلصة فول سوداني مسكّرة وحرّاقة، ونزوّد رمبييك، يعني مقرمشات.»"
          ar: "«ثم نسكب صلصة الفول السوداني الحلوة الحارّة، ونضيف رقائق الريمبييك المقرمشة.»"
          en: "\"Then we pour on sweet, spicy peanut sauce and add rempeyek crackers.\""
        - id: "\"Di Madiun, orang makan pecel untuk sarapan pagi. Harganya sekitar Rp10.000.\""
          arz: "«في ماديون، الناس بتاكل البيتشيل فطار الصبح. بحوالي عشرة آلاف روبية.»"
          ar: "«في ماديون، يأكل الناس البيتشيل فطورًا في الصباح. سعره نحو عشرة آلاف روبية.»"
          en: "\"In Madiun, people eat pecel for breakfast. It costs about Rp10,000.\""
        - id: "Mona melihat layar dengan senang. \"Kelihatannya enak sekali!\""
          arz: "منى بصّت على الشاشة وهي مبسوطة. «شكله حلو أوي!»"
          ar: "تنظر منى إلى الشاشة بسرور. «يبدو لذيذًا جدًّا!»"
          en: "Mona looks at the screen happily. \"It looks delicious!\""
        - id: "Besoknya, Sari dan Mona pergi ke pasar dekat apartemen untuk membeli kacang tanah, cabai, dan sayur."
          arz: "تاني يوم، ساري ومنى راحوا السوق اللي جنب الشقة يشتروا سوداني وشطة وخضار."
          ar: "في اليوم التالي، تذهب ساري ومنى إلى السوق القريب من الشقة لشراء الفول السوداني والفلفل الحار والخضار."
          en: "The next day, Sari and Mona go to the market near the flat to buy peanuts, chillies and vegetables."
        - id: "Di Mesir, kacang tanah mudah dicari, karena orang Mesir juga suka makan kacang."
          arz: "في مصر، السوداني سهل تلاقيه، عشان المصريين كمان بيحبوا ياكلوا سوداني."
          ar: "في مصر يسهل العثور على الفول السوداني، لأنّ المصريين أيضًا يحبّون أكله."
          en: "In Egypt, peanuts are easy to find, because Egyptians love eating peanuts too."
        - id: "Sari menggoreng kacang, menumbuknya, lalu mencampurnya dengan gula, bawang putih, dan banyak cabai."
          arz: "ساري قلت السوداني، ودقّته، وبعدين خلطته بسكر وتوم وشطة كتير."
          ar: "تقلي ساري الفول السوداني وتدقّه، ثم تخلطه بالسكّر والثوم والكثير من الفلفل الحار."
          en: "Sari fries the peanuts, pounds them, then mixes them with sugar, garlic and lots of chilli."
        - id: "Mona mencoba satu sendok. Matanya basah dan wajahnya merah. \"Pedas sekali, tapi enak!\""
          arz: "منى داقت معلقة. عينيها دمّعت ووشّها احمرّ. «حرّاق أوي، بس حلو!»"
          ar: "تتذوّق منى ملعقة. تدمع عيناها ويحمرّ وجهها. «حارّ جدًّا، لكنه لذيذ!»"
          en: "Mona tries a spoonful. Her eyes water and her face goes red. \"Very spicy, but delicious!\""
        - id: "Sari memberi Mona segelas air dingin dan mereka tertawa bersama."
          arz: "ساري إدّت منى كوباية مية ساقعة وضحكوا مع بعض."
          ar: "تعطي ساري منى كوبًا من الماء البارد وتضحكان معًا."
          en: "Sari gives Mona a glass of cold water and they laugh together."
        - id: "\"Lain kali sambalnya kurang pedas, ya,\" kata Sari. \"Tapi warung Ayah tetap nomor satu!\""
          arz: "«المرة الجاية هخلّي الصلصة أقل حرارة،» قالت ساري. «بس محل بابا هيفضل نمرة واحد!»"
          ar: "قالت ساري: «في المرة القادمة ستكون الصلصة أقلّ حرارة.» «لكنّ مطعم أبي يبقى الأول!»"
          en: "\"Next time the sauce will be less spicy,\" says Sari. \"But Dad's warung is still number one!\""
      words: [kacang, pedas, sayur, nasi, makan, enak, pagi, warung]
      summary: "Mona asks what Madiun is famous for, and Pak Budi shows nasi pecel on a video call: rice, vegetables and spicy peanut sauce. Sari tries to make it in Cairo with Egyptian peanuts and Mona finds it very spicy."
    criteria:
      - Nasi pecel is correctly described as Madiun's signature dish (rice, boiled vegetables, peanut sauce, often with rempeyek), a real cultural fact.
      - An Egyptian-kitchen hook is welcome (where to find peanuts in Cairo, comparison with a familiar dish).
      - All target words appear; warung appears as a due word.
      - 160–240 words.
    avoid:
      - Calling pecel a Balinese or Sundanese dish, or describing it wrongly.
      - Mocking Mona for not handling spicy food.
    tags: [sinetron, bipa2, food, culture, gloss-outside-content]
    verified: false

  # ───────────── Sinetron, BIPA 3–4 ─────────────
  - id: story_episode-012
    lang: id
    input:
      series: sinetron
      level: bipa3
      target_words: [mulus, garansi, minat, resmi]
      due_words: [harga, jual, beli, ponsel, mahal]
      previous_summary: "Episode 11: Sari cooks nasi pecel in Cairo. Her old phone has stopped working, and Rudi says he is selling his iPhone."
      length_words: 220
    expect:
      title: "Iklan Rudi"
      level: bipa3
      sentences:
        - id: "Rudi mengirim iklan ke grup WhatsApp keluarga: \"iphone 17 pm 512gb resmi ibox mulus nomin garansi jalan minat wa\"."
          arz: "رودي بعت إعلان على جروب العيلة على الواتساب: «⁨iphone 17 pm 512gb resmi ibox mulus nomin garansi jalan minat wa⁩»."
          ar: "يرسل رودي إعلانًا إلى مجموعة العائلة على واتساب: «⁨iphone 17 pm 512gb resmi ibox mulus nomin garansi jalan minat wa⁩»."
          en: "Rudi sends an ad to the family WhatsApp group: \"iphone 17 pm 512gb resmi ibox mulus nomin garansi jalan minat wa\"."
        - id: "Pak Budi membaca pesan itu dua kali, lalu menelepon keponakannya."
          arz: "عم بودي قرا الرسالة مرتين، وبعدين كلّم ابن أخوه."
          ar: "يقرأ السيد بودي الرسالة مرتين، ثم يتصل بابن أخيه."
          en: "Pak Budi reads the message twice, then calls his nephew."
        - id: "\"Rud, ini bahasa apa? Pakdhe tidak paham sama sekali.\""
          arz: "«يا رودي، دي لغة إيه؟ عمّك مش فاهم حاجة خالص.»"
          ar: "«يا رودي، ما هذه اللغة؟ عمّك لا يفهم شيئًا على الإطلاق.»"
          en: "\"Rud, what language is this? Your uncle doesn't understand a thing.\""
        - id: "Rudi tertawa. \"Itu bahasa iklan, Pakdhe. Orang yang jual ponsel di internet biasanya menulis singkat.\""
          arz: "رودي ضحك. «دي لغة الإعلانات يا عمّي. اللي بيبيعوا موبايلات على النت بيكتبوا مختصر.»"
          ar: "يضحك رودي. «هذه لغة الإعلانات يا عمّي. من يبيعون الهواتف على الإنترنت يكتبون عادةً باختصار.»"
          en: "Rudi laughs. \"That's ad language, Uncle. People who sell phones online usually write in short form.\""
        - id: "\"PM itu Pro Max, bukan jam sore. Resmi iBox artinya ponselnya dibeli di toko resmi, jadi bukan barang gelap.\""
          arz: "«⁨PM⁩ يعني ⁨Pro Max⁩، مش الساعة بالعصر. و⁨resmi iBox⁩ يعني الموبايل متشتري من توكيل رسمي، يعني مش مهرّب.»"
          ar: "«⁨PM⁩ تعني ⁨Pro Max⁩، لا وقت العصر. و⁨resmi iBox⁩ تعني أنّ الهاتف اشتُري من وكيل رسمي، فهو ليس مهرّبًا.»"
          en: "\"PM means Pro Max, not afternoon. Resmi iBox means the phone was bought from an official dealer, so it's not grey-market.\""
        - id: "\"Mulus berarti tidak ada goresan sama sekali. Nomin itu no minus, tidak ada kekurangan.\""
          arz: "«⁨mulus⁩ يعني مفيهوش ولا خدش. و⁨nomin⁩ يعني ⁨no minus⁩، مفيهوش أي عيب.»"
          ar: "«⁨mulus⁩ تعني أنه بلا أي خدش. و⁨nomin⁩ اختصار ⁨no minus⁩، أي بلا أي عيب.»"
          en: "\"Mulus means not a single scratch. Nomin is no minus: nothing wrong with it.\""
        - id: "\"Garansi jalan artinya garansinya masih berlaku. Minat WA maksudnya kalau minat, kirim pesan WhatsApp.\""
          arz: "«⁨garansi jalan⁩ يعني الضمان لسه شغّال. و⁨minat WA⁩ يعني لو مهتم، ابعت رسالة واتساب.»"
          ar: "«⁨garansi jalan⁩ تعني أنّ الضمان ما زال ساريًا. و⁨minat WA⁩ تعني: إن كنت مهتمًّا، فأرسل رسالة على واتساب.»"
          en: "\"Garansi jalan means the warranty is still valid. Minat WA means: if you're interested, send a WhatsApp message.\""
        - id: "Malam itu, Sari ikut membaca iklan di grup. \"Rud, saya minat! Ponsel saya di Kairo sudah rusak.\""
          arz: "بالليل، ساري هي كمان قرت الإعلان على الجروب. «يا رودي، أنا مهتمة! موبايلي في القاهرة باظ.»"
          ar: "في تلك الليلة، تقرأ ساري الإعلان في المجموعة أيضًا. «يا رودي، أنا مهتمّة! هاتفي في القاهرة تعطّل.»"
          en: "That evening, Sari reads the ad in the group too. \"Rud, I'm interested! My phone in Cairo is broken.\""
        - id: "\"Untuk Mbak Sari, harga khusus: dua puluh dua juta saja,\" balas Rudi dengan emoji tertawa."
          arz: "«عشانك يا ساري، سعر خاص: اتنين وعشرين مليون بس،» ردّ رودي بإيموجي بيضحك."
          ar: "ردّ رودي بوجه ضاحك: «لأجلكِ يا ساري، سعر خاص: اثنان وعشرون مليونًا فقط.»"
          en: "\"For you, Sari, a special price: just twenty-two million,\" Rudi replies with a laughing emoji."
        - id: "\"Dua puluh dua juta? Mahal sekali, Rud! Itu sama dengan sewa kamar saya lebih dari satu tahun.\""
          arz: "«اتنين وعشرين مليون؟ غالي أوي يا رودي! ده أكتر من إيجار أوضتي سنة كاملة.»"
          ar: "«اثنان وعشرون مليونًا؟ هذا غالٍ جدًّا يا رودي! هذا أكثر من إيجار غرفتي لسنة كاملة.»"
          en: "\"Twenty-two million? That's very expensive, Rud! That's more than a year's rent for my room.\""
        - id: "Pak Budi lalu ikut menulis: \"Nak, beli ponsel bekas yang sederhana saja di Kairo. Yang penting bisa video call dengan Ayah.\""
          arz: "عم بودي كتب هو كمان: «يا بنتي، اشتري موبايل مستعمل بسيط في القاهرة. المهم تعرفي تكلّميني فيديو.»"
          ar: "ثم يكتب السيد بودي أيضًا: «يا ابنتي، اشتري هاتفًا مستعملًا بسيطًا في القاهرة. المهمّ أن تستطيعي محادثة أبيكِ بالفيديو.»"
          en: "Then Pak Budi writes too: \"Love, just buy a simple second-hand phone in Cairo. What matters is that you can video-call Dad.\""
        - id: "Sari setuju. Di dekat kampus ada toko kecil yang menjual ponsel bekas dengan harga yang wajar."
          arz: "ساري وافقت. جنب الجامعة فيه محل صغير بيبيع موبايلات مستعملة بأسعار معقولة."
          ar: "توافق ساري. قرب الجامعة متجر صغير يبيع هواتف مستعملة بأسعار معقولة."
          en: "Sari agrees. Near campus there's a small shop that sells used phones at fair prices."
        - id: "Rudi mengirim stiker jempol. \"Oke, Mbak. Iklanku masih ada, siapa tahu ada pembeli lain.\""
          arz: "رودي بعت ستيكر صباع لفوق. «ماشي يا ساري. إعلاني لسه موجود، يمكن ييجي مشتري تاني.»"
          ar: "يرسل رودي ملصق إبهام مرفوع. «حسنًا يا ساري. إعلاني ما زال موجودًا، فربما يأتي مشترٍ آخر.»"
          en: "Rudi sends a thumbs-up sticker. \"Okay, Sari. My ad is still up; maybe another buyer will come along.\""
      words: [mulus, garansi, minat, resmi, harga, jual, beli, ponsel, mahal]
      summary: "Rudi posts a marketplace-style ad for his iPhone and explains its abbreviations to Pak Budi. Sari is interested, but the price is too high, so Pak Budi suggests a cheaper second-hand phone in Cairo."
    criteria:
      - The ad text from SPEC §24 appears and its abbreviations are explained correctly in dialogue - pm = Pro Max, resmi ibox = official iBox unit, nomin = no minus (no defects), garansi jalan = warranty still active, minat wa = interested? WhatsApp me.
      - mulus means flawless/no scratches; minat used as interest (e.g. "Ada yang minat?").
      - A realistic price for a used iPhone 17 Pro Max in 2026 (tens of millions of Rupiah, e.g. Rp20.000.000–Rp26.000.000), not hundreds of thousands.
      - BIPA 3 allows longer sentences and casual family-chat dialogue; narration standard.
      - 176–220 words (length_words is capped at 220).
    avoid:
      - Misreading pm as "afternoon" or nomin as "nominal".
      - Brand promotion or real store names other than the iBox mention in the ad.
    tags: [sinetron, bipa3, test-text, abbreviations, prices, gloss-outside-content]
    verified: false

  - id: story_episode-013
    lang: id
    input:
      series: sinetron
      level: bipa3
      target_words: [bangga, menolak, bantuan, tetangga]
      due_words: [lelah, sibuk, malam, warung]
      previous_summary: "Episode 12: The warung's old gas stove broke on the busiest night of the week. Bu Wati, a neighbour and regular customer, offered to lend hers, but Pak Budi was too proud to say yes. On a video call Sari noticed he looked very tired."
      length_words: 220
    expect:
      title: "Kompor Bu Wati"
      level: bipa3
      sentences:
        - id: "Malam Minggu itu warung Pak Budi sibuk sekali, tapi kompor gasnya masih rusak."
          arz: "ليلة الحد دي محل عم بودي كان زحمة جدًّا، بس البوتاجاز لسه بايظ."
          ar: "في ليلة الأحد تلك كان مطعم السيد بودي مشغولًا جدًّا، لكنّ موقد الغاز ما زال معطّلًا."
          en: "That Saturday night Pak Budi's warung is very busy, but his gas stove is still broken."
        - id: "Pak Budi memasak dengan satu kompor kecil, dan pelanggan harus menunggu lama sekali."
          arz: "عم بودي بيطبخ على بوتاجاز صغير بعين واحدة، والزباين لازم يستنّوا كتير."
          ar: "يطبخ السيد بودي على موقد صغير واحد، فيضطرّ الزبائن إلى الانتظار طويلًا."
          en: "Pak Budi is cooking on one small burner, and the customers have to wait a long time."
        - id: "Bu Wati datang lagi dari rumah sebelah, membawa kompornya sendiri."
          arz: "الست واتي جت تاني من البيت اللي جنبه، شايلة البوتاجاز بتاعها."
          ar: "تأتي السيدة واتي مرة أخرى من البيت المجاور، حاملةً موقدها."
          en: "Bu Wati comes over again from next door, carrying her own stove."
        - id: "\"Pak Budi, jangan menolak terus. Tetangga itu harus saling membantu,\" katanya."
          arz: "«يا عم بودي، ما تفضلش ترفض. الجيران لازم يساعدوا بعض،» قالت."
          ar: "قالت: «يا سيد بودي، لا تظلّ ترفض. على الجيران أن يساعد بعضهم بعضًا.»"
          en: "\"Pak Budi, stop saying no. Neighbours should help each other,\" she says."
        - id: "Pak Budi menggeleng. \"Terima kasih, Bu, tapi saya tidak mau merepotkan.\""
          arz: "عم بودي هزّ راسه. «متشكر يا ست واتي، بس مش عايز أتعبك.»"
          ar: "يهزّ السيد بودي رأسه. «شكرًا يا سيدتي، لكنني لا أريد أن أثقل عليكِ.»"
          en: "Pak Budi shakes his head. \"Thank you, Bu, but I don't want to be a bother.\""
        - id: "Sebenarnya dia malu; dia terlalu bangga untuk menerima bantuan."
          arz: "الحقيقة إنه مكسوف؛ كرامته مش مخلّياه يقبل مساعدة."
          ar: "الحقيقة أنه يشعر بالحرج؛ فكبرياؤه يمنعه من قبول المساعدة."
          en: "In truth he is embarrassed; he is too proud to accept help."
        - id: "Ponselnya berbunyi. Di layar ada wajah Sari, yang baru pulang dari kampus."
          arz: "الموبايل رنّ. على الشاشة وش ساري، اللي لسه راجعة من الجامعة."
          ar: "يرنّ هاتفه. على الشاشة وجه ساري، العائدة للتوّ من الجامعة."
          en: "His phone rings. On the screen is Sari, just back from campus."
        - id: "\"Ayah kelihatan lelah sekali. Kompornya belum diperbaiki?\" tanya Sari."
          arz: "«شكلك تعبان أوي يا بابا. البوتاجاز لسه ما اتصلّحش؟» سألت ساري."
          ar: "سألت ساري: «تبدو متعبًا جدًّا يا أبي. ألم يُصلَح الموقد بعد؟»"
          en: "\"You look very tired, Dad. The stove isn't fixed yet?\" Sari asks."
        - id: "Pak Budi lalu bercerita tentang Bu Wati dan tawaran kompornya."
          arz: "عم بودي حكالها عن الست واتي وإنها عرضت عليه البوتاجاز بتاعها."
          ar: "فيحكي لها السيد بودي عن السيدة واتي وعرضها أن تعيره موقدها."
          en: "Pak Budi then tells her about Bu Wati and her offer of the stove."
        - id: "\"Ayah, ingat waktu Ayah membantu Bu Wati memperbaiki atapnya waktu banjir? Sekarang giliran Bu Wati. Menerima bantuan itu bukan hal yang memalukan.\""
          arz: "«يا بابا، فاكر لما ساعدت الست واتي تصلّح السقف بتاعها أيام الفيضان؟ دلوقتي جه دورها. قبول المساعدة مش عيب.»"
          ar: "«أبي، أتذكر حين ساعدت السيدة واتي في إصلاح سقفها أيام الفيضان؟ الآن جاء دورها. قبول المساعدة ليس عيبًا.»"
          en: "\"Dad, remember when you helped Bu Wati fix her roof during the flood? Now it's her turn. Accepting help is nothing to be ashamed of.\""
        - id: "Pak Budi diam sebentar, lalu tersenyum. \"Kamu benar, Nak. Ayah terlalu keras kepala.\""
          arz: "عم بودي سكت شوية، وبعدين ابتسم. «عندك حق يا بنتي. أبوكي راسه ناشفة زيادة.»"
          ar: "يصمت السيد بودي قليلًا، ثم يبتسم. «معكِ حق يا ابنتي. أبوكِ عنيد أكثر من اللازم.»"
          en: "Pak Budi is quiet for a moment, then smiles. \"You're right, love. Your dad is too stubborn.\""
        - id: "Dia keluar dan berkata, \"Bu Wati, maaf, ya. Saya terima bantuan Ibu dengan senang hati.\""
          arz: "خرج وقال: «يا ست واتي، معلش. أنا قابل مساعدتك وأنا مبسوط.»"
          ar: "يخرج ويقول: «يا سيدة واتي، اعذريني. أقبل مساعدتكِ بكل سرور.»"
          en: "He goes out and says, \"Bu Wati, I'm sorry. I'm glad to accept your help.\""
        - id: "Dengan dua kompor, semua pesanan selesai sebelum jam sepuluh malam."
          arz: "ببوتاجازين، كل الطلبات خلصت قبل الساعة عشرة بالليل."
          ar: "بموقدين، انتهت كل الطلبات قبل العاشرة ليلًا."
          en: "With two stoves, every order is done before ten at night."
        - id: "Sebelum pulang, Bu Wati mendapat sepiring pecel gratis. \"Ini tanda terima kasih untuk tetangga yang paling baik,\" kata Pak Budi."
          arz: "قبل ما تروّح، الست واتي خدت طبق بيتشيل ببلاش. «ده عربون شكر لأحسن جارة،» قال عم بودي."
          ar: "قبل أن تعود إلى بيتها، تحصل السيدة واتي على طبق بيتشيل مجّانًا. قال السيد بودي: «هذا عربون شكر لأفضل جارة.»"
          en: "Before she goes home, Bu Wati gets a free plate of pecel. \"A thank-you for the best neighbour,\" says Pak Budi."
      words: [bangga, menolak, bantuan, tetangga, lelah, sibuk, malam, warung]
      summary: "Pak Budi finally accepts Bu Wati's stove after Sari reminds him that neighbours help each other. The warung gets through the busy night, and he thanks Bu Wati with a free plate of pecel."
    criteria:
      - Picks up the open thread (broken stove, Bu Wati's offer, Pak Budi's pride, Sari's worry) and moves it forward.
      - Gotong royong / neighbours helping each other is shown naturally, without moralising.
      - bangga may be used as pride or "gengsi"; menolak and bantuan fit the conflict.
      - 176–220 words (length_words is capped at 220).
    avoid:
      - Ignoring the stove thread or resolving it off-screen without the target words.
      - Melodrama (fire, injury, bankruptcy).
    tags: [sinetron, bipa3, continuity, cliffhanger, culture]
    verified: false

  - id: story_episode-014
    lang: id
    input:
      series: sinetron
      level: bipa3
      target_words: [menikah, keluarga, hormat, kenal]
      due_words: [video, ayah, kampus, teman]
      previous_summary: "Episode 13: Pak Budi accepts Bu Wati's stove and the warung survives a busy night. Sari tells her father that a classmate from Malang, Arif, would like to meet him on a video call."
      length_words: 220
    expect:
      title: "Arif Menelepon"
      level: bipa3
      sentences:
        - id: "Hari Sabtu sore, Sari dan temannya Arif bersiap untuk video call dengan Pak Budi."
          arz: "يوم السبت العصر، ساري وزميلها عارف كانوا بيجهّزوا لمكالمة فيديو مع عم بودي."
          ar: "عصر يوم السبت، تستعدّ ساري وزميلها عارف لمكالمة فيديو مع السيد بودي."
          en: "On Saturday afternoon, Sari and her friend Arif get ready for a video call with Pak Budi."
        - id: "Arif memakai kemeja batik dan duduk tegak di depan laptop di ruang belajar kampus."
          arz: "عارف لابس قميص باتيك وقاعد مفرود قدام اللابتوب في قاعة المذاكرة في الجامعة."
          ar: "يرتدي عارف قميص باتيك ويجلس منتصبًا أمام الحاسوب في قاعة المطالعة في الجامعة."
          en: "Arif wears a batik shirt and sits up straight in front of the laptop in the campus study room."
        - id: "\"Assalamualaikum, Pak Budi. Saya Arif, teman kuliah Sari dari Malang,\" katanya dengan sopan."
          arz: "«السلام عليكم يا عم بودي. أنا عارف، زميل ساري في الجامعة، من مالانج،» قال بأدب."
          ar: "قال بأدب: «السلام عليكم يا سيد بودي. أنا عارف، زميل ساري في الدراسة، من مالانج.»"
          en: "\"Assalamualaikum, Pak Budi. I'm Arif, Sari's classmate, from Malang,\" he says politely."
        - id: "\"Waalaikumsalam. Senang kenal dengan kamu, Nak Arif,\" jawab Pak Budi dari warung."
          arz: "«وعليكم السلام. اتشرّفت بمعرفتك يا ابني عارف،» ردّ عم بودي من المحل."
          ar: "أجاب السيد بودي من مطعمه: «وعليكم السلام. سعدت بالتعرّف إليك يا بنيّ عارف.»"
          en: "\"Waalaikumsalam. Nice to meet you, Arif,\" Pak Budi answers from the warung."
        - id: "Arif bercerita tentang kuliahnya, keluarganya di Malang, dan cita-citanya menjadi guru bahasa Arab."
          arz: "عارف حكى عن دراسته، وعيلته في مالانج، وحلمه إنه يبقى مدرّس عربي."
          ar: "يتحدّث عارف عن دراسته، وعن عائلته في مالانج، وعن حلمه بأن يصبح معلّمًا للغة العربية."
          en: "Arif talks about his studies, his family in Malang and his dream of becoming an Arabic teacher."
        - id: "Dia selalu memanggil Pak Budi dengan \"Bapak\" dan mendengarkan dengan penuh hormat."
          arz: "كان دايمًا بينادي عم بودي «حضرتك» وبيسمع باحترام كامل."
          ar: "كان دائمًا يخاطب السيد بودي بـ«حضرتك» ويصغي باحترام تامّ."
          en: "He always addresses Pak Budi as \"Bapak\" and listens with full respect."
        - id: "Pak Budi bertanya tentang orang tua Arif, dan Arif menjawab dengan jujur dan tenang."
          arz: "عم بودي سأل عن أهل عارف، وعارف ردّ بصراحة وهدوء."
          ar: "يسأل السيد بودي عن والدَي عارف، فيجيب عارف بصدق وهدوء."
          en: "Pak Budi asks about Arif's parents, and Arif answers honestly and calmly."
        - id: "Lalu Arif menarik napas. \"Pak, kalau Bapak izinkan, saya ingin lebih kenal dengan keluarga Sari.\""
          arz: "بعدين عارف خد نفسه. «يا عمّي، لو حضرتك تسمح، أنا حابب أتعرّف على عيلة ساري أكتر.»"
          ar: "ثم يأخذ عارف نفَسًا. «يا سيدي، إن سمحتَ، أودّ أن أتعرّف إلى عائلة ساري أكثر.»"
          en: "Then Arif takes a breath. \"Sir, if you allow it, I'd like to get to know Sari's family better.\""
        - id: "\"Mungkin suatu hari nanti, setelah kami lulus, saya ingin datang ke Madiun dengan orang tua saya.\""
          arz: "«يمكن في يوم من الأيام، بعد ما نخلّص دراسة، آجي ماديون مع أهلي.»"
          ar: "«ربما يومًا ما، بعد أن نتخرّج، أودّ أن آتي إلى ماديون مع والديّ.»"
          en: "\"Maybe one day, after we graduate, I'd like to come to Madiun with my parents.\""
        - id: "Sari tersipu, tapi dia juga berbicara: \"Ayah, kami belum mau menikah sekarang. Kami mau fokus kuliah dulu.\""
          arz: "ساري وشّها احمرّ، بس اتكلمت هي كمان: «يا بابا، إحنا مش عايزين نتجوّز دلوقتي. عايزين نركّز في الدراسة الأول.»"
          ar: "تحمرّ وجنتا ساري، لكنها تتكلّم أيضًا: «أبي، لا نريد أن نتزوّج الآن. نريد أن نركّز على الدراسة أولًا.»"
          en: "Sari blushes, but she speaks up too: \"Dad, we don't want to marry now. We want to focus on our studies first.\""
        - id: "Pak Budi tersenyum hangat. \"Ayah senang kalian jujur. Menikah itu urusan dua keluarga, bukan hanya dua orang.\""
          arz: "عم بودي ابتسم بحنيّة. «أنا مبسوط إنكم صرحاء. الجواز ده موضوع عيلتين، مش اتنين بس.»"
          ar: "يبتسم السيد بودي بدفء. «يسعدني أنكما صادقان. الزواج شأن عائلتين، لا شخصين فقط.»"
          en: "Pak Budi smiles warmly. \"I'm glad you're both honest. Marriage is a matter for two families, not just two people.\""
        - id: "\"Selesaikan kuliah dulu, kenal satu sama lain dengan baik, dan saling menghormati.\""
          arz: "«خلّصوا دراستكم الأول، واعرفوا بعض كويس، واحترموا بعض.»"
          ar: "«أنهيا دراستكما أولًا، وتعارفا جيدًا، واحترما بعضكما.»"
          en: "\"Finish your studies first, get to know each other well, and respect each other.\""
        - id: "\"Nak Arif, kalau ke Madiun, mampir ke warung, ya. Pecelnya gratis.\""
          arz: "«يا عارف يا ابني، لو جيت ماديون، عدّي على المحل. البيتشيل عليّا.»"
          ar: "«يا بنيّ عارف، إن جئت إلى ماديون فمُرّ بالمطعم. البيتشيل مجّانًا.»"
          en: "\"Arif, if you come to Madiun, drop by the warung. The pecel is on the house.\""
        - id: "Arif tertawa lega, dan Sari melihat ayahnya dengan bangga."
          arz: "عارف ضحك وهو مرتاح، وساري بصّت لأبوها بفخر."
          ar: "يضحك عارف مرتاحًا، وتنظر ساري إلى أبيها بفخر."
          en: "Arif laughs with relief, and Sari looks at her father with pride."
      words: [menikah, keluarga, hormat, kenal, video, ayah, kampus, teman]
      summary: "Arif, Sari's classmate from Malang, introduces himself to Pak Budi politely on a video call. Pak Budi likes him but says they should first get to know each other and finish their studies before talking about marriage."
    criteria:
      - PG and family-centred - a polite introduction (kenalan) to the father, respect (hormat) shown, no physical romance.
      - Pak Budi is warm and sensible, not angry or controlling; Sari keeps her own voice.
      - menikah is mentioned as a future possibility, not a decision made in the episode.
      - 176–220 words (length_words is capped at 220).
    avoid:
      - Romance beyond PG, or any suggestion of an arranged or forced marriage.
      - Stereotypes about Javanese or Muslim families.
    tags: [sinetron, bipa3, pg-romance, sensitive, continuity]
    verified: false

  - id: story_episode-015
    lang: id
    input:
      series: sinetron
      level: bipa3
      target_words: [kecelakaan, polisi, motor, hati-hati]
      due_words: [jalan, hujan, malam, rumah]
      previous_summary: "Episode 14: Arif introduces himself to Pak Budi on a video call. Rudi has just bought a second-hand motorbike and rides it fast."
      length_words: 220
    expect:
      title: "Hujan di Jalan Madiun"
      level: bipa3
      sentences:
        - id: "Malam itu hujan deras turun di Madiun, dan jalan-jalan sepi."
          arz: "الليلة دي المطر كان نازل جامد في ماديون، والشوارع فاضية."
          ar: "في تلك الليلة هطل مطر غزير على ماديون، وكانت الشوارع خالية."
          en: "That night heavy rain falls on Madiun, and the streets are empty."
        - id: "Rudi pulang dari rumah temannya naik motor bekasnya, tanpa jas hujan dan terlalu cepat."
          arz: "رودي كان راجع من عند صاحبه على الموتوسيكل المستعمل بتاعه، من غير جاكيت مطر وبسرعة زيادة."
          ar: "كان رودي عائدًا من بيت صديقه على درّاجته النارية المستعملة، بلا معطف مطر وبسرعة زائدة."
          en: "Rudi is riding home from his friend's house on his second-hand motorbike, without a raincoat and too fast."
        - id: "Di tikungan dekat warung Pak Budi, jalannya basah, gelap, dan licin."
          arz: "في الملف اللي جنب محل عم بودي، الطريق كان مبلول وضلمة وبيزحلق."
          ar: "عند المنعطف القريب من مطعم السيد بودي، كان الطريق مبلّلًا ومظلمًا وزلقًا."
          en: "At the bend near Pak Budi's warung, the road is wet, dark and slippery."
        - id: "Motornya tergelincir, dan Rudi jatuh di pinggir jalan."
          arz: "الموتوسيكل اتزحلق، ورودي وقع على جنب الطريق."
          ar: "انزلقت الدرّاجة، وسقط رودي على جانب الطريق."
          en: "His bike skids, and Rudi falls at the side of the road."
        - id: "Untung kecelakaan itu kecil: Rudi memakai helm, jadi kepalanya aman, dan hanya lututnya yang lecet."
          arz: "الحمد لله الحادثة كانت بسيطة: رودي كان لابس خوذة، فراسه سليمة، وبس ركبته اتجرحت جرح خفيف."
          ar: "لحسن الحظ كان الحادث بسيطًا: كان رودي يرتدي خوذة، فسلم رأسه، ولم يُصَب إلا بخدش في ركبته."
          en: "Luckily it's a small accident: Rudi is wearing a helmet, so his head is safe, and only his knee is scraped."
        - id: "Seorang polisi yang sedang lewat langsung berhenti dan membantunya berdiri."
          arz: "عسكري شرطة كان معدّي وقف على طول وساعده يقوم."
          ar: "يتوقّف شرطيّ كان مارًّا على الفور ويساعده على النهوض."
          en: "A police officer passing by stops at once and helps him up."
        - id: "\"Mas, tidak apa-apa? Ada yang sakit?\" tanya polisi itu dengan ramah."
          arz: "«إنت كويس يا كابتن؟ فيه حاجة بتوجعك؟» سأله الشرطي بلطف."
          ar: "سأله الشرطيّ بلطف: «هل أنت بخير؟ هل يؤلمك شيء؟»"
          en: "\"Are you all right, mate? Does anything hurt?\" the officer asks kindly."
        - id: "Pak Budi mendengar suara itu dari warung dan berlari keluar membawa payung."
          arz: "عم بودي سمع الصوت من المحل وجري برّه ومعاه شمسية."
          ar: "يسمع السيد بودي الصوت من المطعم فيركض إلى الخارج حاملًا مظلّة."
          en: "Pak Budi hears the noise from the warung and runs out with an umbrella."
        - id: "Mereka membawa Rudi ke dalam warung, dan Pak Budi membersihkan lukanya dengan air bersih."
          arz: "دخّلوا رودي جوّه المحل، وعم بودي نضّف الجرح بمية نضيفة."
          ar: "يُدخلون رودي إلى المطعم، وينظّف السيد بودي جرحه بماء نظيف."
          en: "They bring Rudi into the warung, and Pak Budi cleans his scrape with clean water."
        - id: "Polisi itu juga membantu mendorong motor Rudi ke depan warung. Motornya hanya sedikit tergores."
          arz: "الشرطي كمان ساعد يزقّ موتوسيكل رودي لقدام المحل. الموتوسيكل اتخدش خدش صغير بس."
          ar: "ويساعد الشرطيّ أيضًا في دفع درّاجة رودي إلى أمام المطعم. لم تُصَب الدرّاجة إلا بخدش صغير."
          en: "The officer also helps push Rudi's motorbike to the front of the warung. The bike is only slightly scratched."
        - id: "\"Terima kasih banyak, Pak Polisi. Silakan minum teh hangat dulu,\" kata Pak Budi."
          arz: "«متشكرين أوي يا حضرة الظابط. اتفضّل اشرب شاي سخن الأول،» قال عم بودي."
          ar: "قال السيد بودي: «شكرًا جزيلًا أيها الشرطيّ. تفضّل اشرب شايًا دافئًا أولًا.»"
          en: "\"Thank you so much, officer. Please have some warm tea first,\" says Pak Budi."
        - id: "Sambil minum teh, polisi itu berkata pelan, \"Kalau hujan, jalan licin. Pelan-pelan saja, Mas.\""
          arz: "وهو بيشرب الشاي، الشرطي قال بهدوء: «لما الدنيا تمطر، الطريق بيزحلق. براحة يا كابتن.»"
          ar: "قال الشرطيّ بهدوء وهو يشرب الشاي: «حين تمطر يصبح الطريق زلقًا. تمهّل يا أخي.»"
          en: "Sipping his tea, the officer says quietly, \"When it rains, the road gets slippery. Take it slow, mate.\""
        - id: "Rudi mengangguk malu. \"Iya, Pak. Mulai sekarang saya akan lebih hati-hati dan selalu memakai jas hujan.\""
          arz: "رودي هزّ راسه وهو مكسوف. «حاضر يا فندم. من هنا ورايح هاخد بالي أكتر وهلبس جاكيت المطر على طول.»"
          ar: "يومئ رودي خجلًا. «حاضر يا سيدي. من الآن فصاعدًا سأكون أكثر حذرًا وسأرتدي معطف المطر دائمًا.»"
          en: "Rudi nods, embarrassed. \"Yes, sir. From now on I'll be more careful and always wear a raincoat.\""
        - id: "Malam itu Rudi tidur di rumah Pak Budi, dan besok paginya dia pergi membeli jas hujan baru."
          arz: "الليلة دي رودي بات في بيت عم بودي، وتاني يوم الصبح راح اشترى جاكيت مطر جديد."
          ar: "في تلك الليلة نام رودي في بيت السيد بودي، وفي صباح اليوم التالي ذهب واشترى معطف مطر جديدًا."
          en: "That night Rudi sleeps at Pak Budi's house, and the next morning he goes to buy a new raincoat."
      words: [kecelakaan, polisi, motor, hati-hati, jalan, hujan, malam, rumah]
      summary: "Rudi slips on his motorbike in the rain near the warung and scrapes his knee. A police officer helps him, Pak Budi cleans the scrape and serves hot tea, and Rudi promises to ride more carefully and always wear a raincoat."
    criteria:
      - A minor accident only - nobody dies or is badly hurt; no graphic injury.
      - The police are helpful; the episode models safe riding (helmet, slowing in rain) without lecturing.
      - All target words appear; due words used.
      - 176–220 words (length_words is capped at 220).
    avoid:
      - Graphic injury, death, blame, or fear-based messaging.
      - Portraying the police as corrupt (a stereotype) or as threatening.
    tags: [sinetron, bipa3, sensitive, pg-violence]
    verified: false

  - id: story_episode-016
    lang: id
    input:
      series: sinetron
      level: bipa4
      target_words: [penelitian, pengalaman, budaya, perbedaan, kebiasaan]
      due_words: [kampus, belajar, ujian, pikir, kopi]
      previous_summary: "Episode 15: Rudi has a small motorbike accident in the rain and promises to ride carefully. In Cairo, Sari must choose a topic for her research presentation."
      length_words: 220
    expect:
      title: "Kopi Tubruk dan Ahwa"
      level: bipa4
      sentences:
        - id: "Sari menatap layar laptopnya, karena topik penelitiannya harus dikumpulkan ke dosen besok pagi."
          arz: "ساري كانت باصّة لشاشة اللابتوب، عشان موضوع البحث لازم يتسلّم للدكتور بكرة الصبح."
          ar: "كانت ساري تحدّق في شاشة حاسوبها، لأنّ موضوع بحثها يجب أن يُسلَّم إلى الأستاذ صباح الغد."
          en: "Sari stares at her laptop screen, because her research topic is due to her lecturer tomorrow morning."
        - id: "Ujian sudah selesai, tetapi tugas ini terasa lebih sulit daripada belajar untuk ujian."
          arz: "الامتحانات خلصت، بس الواجب ده حاسّة إنه أصعب من المذاكرة للامتحان."
          ar: "انتهت الامتحانات، لكنّ هذه المهمّة تبدو أصعب من المذاكرة للامتحان."
          en: "Exams are over, but this task feels harder than studying for an exam."
        - id: "Tiba-tiba ia mencium aroma kopi yang datang dari ahwa di bawah apartemennya."
          arz: "فجأة شمّت ريحة قهوة جاية من القهوة اللي تحت الشقة."
          ar: "فجأةً شمّت رائحة قهوة آتية من المقهى الشعبي أسفل شقّتها."
          en: "Suddenly she smells coffee coming from the ahwa below her flat."
        - id: "Di sana, bapak-bapak duduk di kursi plastik, minum kopi Turki, bermain tawla, dan berbincang."
          arz: "هناك، الرجّالة قاعدين على كراسي بلاستيك، بيشربوا قهوة تركي، وبيلعبوا طاولة، وبيدردشوا."
          ar: "هناك يجلس الرجال على كراسٍ بلاستيكية، يشربون القهوة التركية، ويلعبون الطاولة، ويتسامرون."
          en: "There, men sit on plastic chairs, drinking Turkish coffee, playing tawla and chatting."
        - id: "\"Ini mirip warung Ayah,\" pikir Sari, \"hanya kopinya lebih kental dan cangkirnya lebih kecil.\""
          arz: "«ده شبه محل بابا،» فكّرت ساري، «بس القهوة أتقل والفناجين أصغر.»"
          ar: "فكّرت ساري: «هذا يشبه مطعم أبي، غير أنّ القهوة أثقل والفناجين أصغر.»"
          en: "\"This is like Dad's warung,\" Sari thinks, \"only the coffee is thicker and the cups are smaller.\""
        - id: "Malam itu juga ia memutuskan topik penelitian: kebiasaan minum kopi di warung Madiun dan di ahwa Kairo."
          arz: "في نفس الليلة اختارت موضوع البحث: عادات شرب القهوة في محلات ماديون وقهاوي القاهرة."
          ar: "في تلك الليلة نفسها اختارت موضوع بحثها: عادات شرب القهوة في مطاعم ماديون الصغيرة ومقاهي القاهرة الشعبية."
          en: "That same night she picks her research topic: coffee-drinking habits in Madiun's warungs and Cairo's ahwas."
        - id: "Keesokan harinya, dosennya di kampus mengatakan bahwa topik itu menarik, asalkan Sari mewawancarai orang-orang secara langsung."
          arz: "تاني يوم، الدكتور بتاعها في الجامعة قال إن الموضوع حلو، بشرط إن ساري تعمل مقابلات مع الناس بنفسها."
          ar: "في اليوم التالي، قال أستاذها في الجامعة إنّ الموضوع مثير للاهتمام، شريطة أن تجري ساري مقابلات مع الناس مباشرةً."
          en: "The next day, her lecturer on campus says the topic is interesting, as long as Sari interviews people in person."
        - id: "Sari pun menelepon ayahnya, yang dengan senang hati menceritakan pengalaman tiga puluh tahun membuat kopi tubruk."
          arz: "فساري كلّمت أبوها، وهو حكالها بكل سرور عن خبرته تلاتين سنة في عمل القهوة التُبروك."
          ar: "فاتصلت ساري بأبيها، الذي حكى لها بكل سرور عن خبرته طوال ثلاثين عامًا في إعداد قهوة التُبروك."
          en: "So Sari calls her father, who happily tells her about his thirty years of experience making kopi tubruk."
        - id: "Menurut Pak Budi, pelanggan datang ke warung bukan hanya untuk kopi, tetapi juga untuk mengobrol."
          arz: "على كلام عم بودي، الزباين بييجوا المحل مش عشان القهوة بس، لكن كمان عشان يدردشوا."
          ar: "بحسب السيد بودي، لا يأتي الزبائن إلى المطعم من أجل القهوة فقط، بل للدردشة أيضًا."
          en: "According to Pak Budi, customers come to the warung not just for coffee but also to chat."
        - id: "Di ahwa, Pak Mahmud, pemiliknya yang ramah, mengatakan hal yang hampir sama sambil menuangkan kopi dari teko kecil."
          arz: "في القهوة، عم محمود، صاحبها الطيب، قال تقريبًا نفس الكلام وهو بيصبّ القهوة من الكنكة."
          ar: "وفي المقهى، قال العم محمود، صاحبه الودود، الكلام نفسه تقريبًا وهو يصبّ القهوة من الكَنَكة."
          en: "At the ahwa, Pak Mahmud, its friendly owner, says almost the same thing as he pours coffee from a small pot."
        - id: "Sari mencatat semua jawaban, dan semakin banyak ia mendengar, semakin sedikit perbedaan yang ia temukan."
          arz: "ساري كتبت كل الإجابات، وكل ما تسمع أكتر، كل ما تلاقي فروق أقل."
          ar: "دوّنت ساري كل الإجابات، وكلما استمعت أكثر، وجدت فروقًا أقلّ."
          en: "Sari notes down every answer, and the more she listens, the fewer differences she finds."
        - id: "Tentu ada perbedaan: di Madiun kopi diseduh langsung di gelas, sedangkan di Kairo kopinya dimasak di teko kecil sampai berbusa."
          arz: "أكيد فيه فروق: في ماديون القهوة بتتعمل في الكوباية على طول، وفي القاهرة بتتغلي في الكنكة لحد ما تعمل وش."
          ar: "بالطبع هناك فروق: في ماديون تُحضَّر القهوة مباشرةً في الكوب، أمّا في القاهرة فتُغلى في الكَنَكة حتى تعلوها الرغوة."
          en: "Of course there are differences: in Madiun the coffee is brewed straight in the glass, while in Cairo it's boiled in a small pot until it foams."
        - id: "Namun, budaya duduk bersama, berbagi cerita, dan saling menyapa ternyata sama di kedua kota."
          arz: "بس ثقافة القعدة مع بعض، والحكايات، وإن الناس تسلّم على بعض، طلعت هي هي في المدينتين."
          ar: "غير أنّ ثقافة الجلوس معًا، وتبادل الحكايات، وتحية بعضنا بعضًا، تبيّن أنها واحدة في المدينتين."
          en: "But the culture of sitting together, sharing stories and greeting one another turns out to be the same in both cities."
        - id: "Sambil tersenyum, Sari menulis judul penelitiannya: \"Secangkir Kopi, Dua Budaya.\""
          arz: "ساري كتبت عنوان البحث وهي مبتسمة: «فنجان قهوة، وثقافتين.»"
          ar: "كتبت ساري عنوان بحثها مبتسمةً: «فنجان قهوة، وثقافتان.»"
          en: "Smiling, Sari writes the title of her research: \"One Cup of Coffee, Two Cultures.\""
      words: [penelitian, pengalaman, budaya, perbedaan, kebiasaan, kampus, belajar, ujian, pikir, kopi]
      summary: "Sari chooses to research coffee-drinking habits in Madiun warungs and Cairo ahwas. She interviews her father and the owner of the ahwa below her flat and finds more similarities than differences."
    criteria:
      - BIPA 4 - longer sentences, relative clauses with yang, some nominalised words (pe-an, ke-an), reported speech.
      - Accurate cultural content on both sides - kopi tubruk with grounds and sugar at a warung; Egyptian ahwa culture (Turkish-style coffee, shisha in the background, backgammon/tawla).
      - Sari's research is believable for a student (interviews, notes) and connects to earlier episodes.
      - All five target words and most due words appear.
      - 176–220 words (length_words is capped at 220).
    avoid:
      - Generalising "all Egyptians" or "all Javanese" do X.
      - An essay voice instead of a story with scenes and dialogue.
    tags: [sinetron, bipa4, long, culture, egypt-hook]
    verified: false

  - id: story_episode-017
    lang: id
    input:
      series: sinetron
      level: bipa4
      target_words: [kesempatan, rencana, lulus, bangga, pulang]
      due_words: [keluarga, bandara, pesawat, tiket, rindu, warung, teman, kampus, Mona, ujian]
      previous_summary: "Episodes 1–16, in short: Pak Budi runs a warung in Madiun; his daughter Sari studies in Cairo, shares a flat with her Egyptian friend Mona and is researching coffee culture. Pak Budi has learned to video-call, accepted help from his neighbour Bu Wati, and met Sari's classmate Arif. Sari's final exams are this week and she is offered a scholarship to stay one more year."
      length_words: 220
    expect:
      title: "Dua Pilihan"
      level: bipa4
      sentences:
        - id: "Hasil ujian keluar hari Kamis: Sari lulus dengan nilai yang sangat baik."
          arz: "نتيجة الامتحانات طلعت يوم الخميس: ساري نجحت بتقدير عالي جدًّا."
          ar: "صدرت نتائج الامتحانات يوم الخميس: نجحت ساري بدرجات ممتازة."
          en: "The exam results come out on Thursday: Sari passes with excellent marks."
        - id: "Mona, teman sekamarnya, memeluknya sambil berteriak senang."
          arz: "منى، اللي ساكنة معاها، حضنتها وهي بتصرّخ من الفرحة."
          ar: "عانقتها منى، زميلتها في الغرفة، وهي تصيح فرحًا."
          en: "Mona, her flatmate, hugs her with a happy shriek."
        - id: "Namun, di email dari kampus ada kabar lain: Sari mendapat kesempatan beasiswa untuk belajar satu tahun lagi di Kairo."
          arz: "بس في إيميل الجامعة كان فيه خبر تاني: ساري جالها فرصة منحة تدرس سنة كمان في القاهرة."
          ar: "لكنّ رسالة الجامعة الإلكترونية حملت خبرًا آخر: حصلت ساري على فرصة منحة للدراسة عامًا آخر في القاهرة."
          en: "But the email from the university brings other news: Sari has the chance of a scholarship to study one more year in Cairo."
        - id: "Ia senang, tetapi juga bingung, karena ia sudah sangat rindu pada ayahnya dan warung kecil di Madiun."
          arz: "فرحت، بس كمان احتارت، عشان أبوها والمحل الصغير في ماديون وحشوها أوي."
          ar: "فرحت، لكنها احتارت أيضًا، لأنها اشتاقت كثيرًا إلى أبيها وإلى المطعم الصغير في ماديون."
          en: "She is happy, but also torn, because she already misses her father and the little warung in Madiun very much."
        - id: "Sore itu ia menelepon Pak Budi, yang sedang menutup warung setelah hari yang panjang."
          arz: "العصر كلّمت عم بودي، اللي كان بيقفل المحل بعد يوم طويل."
          ar: "في ذلك العصر اتصلت بالسيد بودي، الذي كان يغلق المطعم بعد يوم طويل."
          en: "That afternoon she calls Pak Budi, who is closing the warung after a long day."
        - id: "\"Ayah, saya lulus! Tapi saya juga ditawari beasiswa, dan saya tidak tahu harus pilih yang mana,\" katanya pelan."
          arz: "«يا بابا، أنا نجحت! بس كمان عرضوا عليّا منحة، ومش عارفة أختار إيه،» قالت بصوت واطي."
          ar: "قالت بصوت خافت: «أبي، لقد نجحت! لكنهم عرضوا عليّ منحة أيضًا، ولا أعرف ماذا أختار.»"
          en: "\"Dad, I passed! But I've also been offered a scholarship, and I don't know which to choose,\" she says softly."
        - id: "Pak Budi diam sebentar, lalu berkata bahwa ia sangat bangga, dan bahwa kesempatan seperti ini tidak datang dua kali."
          arz: "عم بودي سكت شوية، وبعدين قال إنه فخور بيها جدًّا، وإن فرصة زي دي مش بتيجي مرتين."
          ar: "صمت السيد بودي قليلًا، ثم قال إنه فخور جدًّا، وإنّ فرصة كهذه لا تأتي مرتين."
          en: "Pak Budi is quiet for a moment, then says he is very proud, and that a chance like this doesn't come twice."
        - id: "\"Ambil beasiswanya, Nak. Warung ini tetap di sini, dan Ayah juga tetap di sini,\" katanya sambil tersenyum."
          arz: "«خدي المنحة يا بنتي. المحل هيفضل هنا، وأبوكي كمان هيفضل هنا،» قالها وهو بيبتسم."
          ar: "قال مبتسمًا: «اقبلي المنحة يا ابنتي. المطعم باقٍ هنا، وأبوكِ باقٍ هنا أيضًا.»"
          en: "\"Take the scholarship, love. The warung will still be here, and so will Dad,\" he says with a smile."
        - id: "\"Tapi sebelum tahun kuliah yang baru mulai, pulanglah dulu sebentar. Seluruh keluarga ingin bertemu denganmu.\""
          arz: "«بس قبل ما السنة الدراسية الجديدة تبدأ، تعالي البيت شوية. العيلة كلها عايزة تشوفك.»"
          ar: "«لكن قبل أن يبدأ العام الدراسي الجديد، عودي إلى البيت قليلًا. العائلة كلها تريد أن تراكِ.»"
          en: "\"But before the new academic year starts, come home for a little while. The whole family wants to see you.\""
        - id: "Sari dan ayahnya lalu membuat rencana: ia akan pulang tiga minggu pada bulan Agustus."
          arz: "ساري وأبوها عملوا خطة: هتنزل البلد تلات أسابيع في أغسطس."
          ar: "ثم وضعت ساري وأبوها خطة: ستعود إلى البيت ثلاثة أسابيع في شهر أغسطس."
          en: "So Sari and her father make a plan: she will come home for three weeks in August."
        - id: "Keesokan harinya, Sari membeli tiket pesawat ke Surabaya; dari bandara ia akan naik kereta ke Madiun."
          arz: "تاني يوم، ساري اشترت تذكرة طيارة لسورابايا؛ ومن المطار هتركب القطر لماديون."
          ar: "في اليوم التالي، اشترت ساري تذكرة طيران إلى سورابايا؛ ومن المطار ستستقلّ القطار إلى ماديون."
          en: "The next day, Sari buys a plane ticket to Surabaya; from the airport she'll take the train to Madiun."
        - id: "Mona membantu memilih oleh-oleh: kurma, teh mint, dan sebuah lampu fanus kecil untuk warung."
          arz: "منى ساعدتها تختار الهدايا: بلح، وشاي بالنعناع، وفانوس صغير للمحل."
          ar: "ساعدتها منى في اختيار الهدايا: تمر، وشاي بالنعناع، وفانوس صغير للمطعم."
          en: "Mona helps choose gifts to bring home: dates, mint tea and a small fanous lantern for the warung."
        - id: "\"Jangan lupa kembali, ya,\" kata Mona. \"Kamar ini terlalu sepi tanpa kamu.\""
          arz: "«ما تنسيش ترجعي،» قالت منى. «الأوضة دي هتبقى فاضية أوي من غيرك.»"
          ar: "قالت منى: «لا تنسي أن تعودي.» «هذه الغرفة هادئة جدًّا من دونكِ.»"
          en: "\"Don't forget to come back,\" says Mona. \"This room is far too quiet without you.\""
        - id: "Sari tertawa dan berjanji; ia tahu sekarang bahwa ia punya dua rumah."
          arz: "ساري ضحكت ووعدتها؛ دلوقتي عرفت إن ليها بيتين."
          ar: "ضحكت ساري ووعدت؛ فقد أدركت الآن أنّ لها بيتين."
          en: "Sari laughs and promises; she knows now that she has two homes."
      words: [kesempatan, rencana, lulus, bangga, pulang, keluarga, bandara, pesawat, tiket, rindu, warung, teman, kampus, Mona, ujian]
      summary: "Sari passes her exams and is offered a one-year scholarship. Pak Budi, proud of her, tells her to take the chance; they plan a three-week visit home in August so Sari can see Madiun again before the new year starts."
    criteria:
      - Uses the multi-episode summary - consistent names (Pak Budi, Sari, Mona, Bu Wati, Arif, Rudi if present) and facts.
      - Weighs a real choice with warmth; Pak Budi supports her without guilt-tripping.
      - Ten due words are woven in without becoming a list; Mona is used as a name, not taught as vocabulary.
      - 176–220 words (length_words is capped at 220); the summary stays 1–3 sentences even after a long previous_summary.
    avoid:
      - Contradicting earlier facts (Sari studying elsewhere, Mona as Indonesian).
      - Guilt or emotional pressure from the father ("after all I did for you").
      - A summary longer than three sentences.
    tags: [sinetron, bipa4, long, continuity, many-due-words]
    verified: false

