  - id: story_episode-021
    lang: id
    input:
      series: kabar_pagi
      level: bipa2
      target_words: [kabar, waktu, selamat, paham]
      due_words: [pagi, teman, kelas]
      length_words: 150
    expect:
      title: "Selamat Pagi, Kelas!"
      level: bipa2
      sentences:
        - id: "\"Selamat pagi, semuanya!\" kata Bu Guru di depan kelas."
          arz: "«صباح الخير يا جماعة!» قالت المدرّسة قدام الفصل."
          ar: "قالت المعلّمة أمام الصف: «صباح الخير جميعًا!»"
          en: "\"Good morning, everyone!\" says the teacher at the front of the class."
        - id: "\"Pagi, Bu!\" jawab para mahasiswa."
          arz: "«صباح النور يا أستاذة!» ردّوا الطلبة."
          ar: "أجاب الطلاب: «صباح النور يا أستاذة!»"
          en: "\"Morning, ma'am!\" the students answer."
        - id: "\"Apa kabar hari ini?\" tanya Bu Guru sambil tersenyum."
          arz: "«أخباركم إيه النهارده؟» سألت المدرّسة وهي مبتسمة."
          ar: "سألت المعلّمة مبتسمةً: «كيف حالكم اليوم؟»"
          en: "\"How are you today?\" asks the teacher with a smile."
        - id: "Omar, mahasiswa dari Mesir, tersenyum juga, karena kata kabar mirip bahasa Arab."
          arz: "عمر، طالب من مصر، ابتسم هو كمان، عشان كلمة ⁨kabar⁩ شبه العربي."
          ar: "ابتسم عمر، الطالب القادم من مصر، هو أيضًا، لأنّ كلمة ⁨kabar⁩ تشبه العربية."
          en: "Omar, a student from Egypt, smiles too, because the word kabar sounds like Arabic."
        - id: "Di Kairo, orang bertanya \"Akhbarak eh?\" kepada teman mereka."
          arz: "في القاهرة، الناس بتسأل صحابها: «أخبارك إيه؟»"
          ar: "في القاهرة يسأل الناس أصدقاءهم: «أخبارك إيه؟»"
          en: "In Cairo, people ask their friends \"Akhbarak eh?\""
        - id: "\"Bu, kabar itu dari bahasa Arab, ya?\" tanya Omar."
          arz: "«يا أستاذة، ⁨kabar⁩ دي جاية من العربي، صح؟» سأل عمر."
          ar: "سأل عمر: «يا أستاذة، كلمة ⁨kabar⁩ أصلها عربي، أليس كذلك؟»"
          en: "\"Ma'am, kabar comes from Arabic, right?\" Omar asks."
        - id: "\"Betul, Omar. Banyak kata Indonesia berasal dari bahasa Arab: kabar, waktu, selamat, dan paham.\""
          arz: "«مظبوط يا عمر. كلمات إندونيسي كتير أصلها عربي: ⁨kabar⁩ و⁨waktu⁩ و⁨selamat⁩ و⁨paham⁩.»"
          ar: "«صحيح يا عمر. كثير من الكلمات الإندونيسية أصلها عربي: ⁨kabar⁩ و⁨waktu⁩ و⁨selamat⁩ و⁨paham⁩.»"
          en: "\"That's right, Omar. Many Indonesian words come from Arabic: kabar, waktu, selamat and paham.\""
        - id: "\"Tapi hati-hati, artinya tidak selalu sama persis,\" kata Bu Guru."
          arz: "«بس خلّي بالك، المعنى مش دايمًا هو هو بالظبط،» قالت المدرّسة."
          ar: "قالت المعلّمة: «لكن انتبه، فالمعنى ليس دائمًا مطابقًا تمامًا.»"
          en: "\"But be careful, the meaning isn't always exactly the same,\" says the teacher."
        - id: "\"Selamat di sini dipakai untuk salam, seperti selamat pagi, dan juga untuk ucapan, seperti selamat ulang tahun.\""
          arz: "«⁨selamat⁩ هنا بنستعملها في التحية، زي ‹صباح الخير›، وكمان في التهنئة، زي ‹عيد ميلاد سعيد›.»"
          ar: "«تُستعمل ⁨selamat⁩ هنا في التحية، مثل ‹صباح الخير›، وفي التهنئة أيضًا، مثل ‹عيد ميلاد سعيد›.»"
          en: "\"Here selamat is used in greetings, like good morning, and in good wishes, like happy birthday.\""
        - id: "Omar mencatat semua kalimat itu di bukunya."
          arz: "عمر كتب كل الجمل دي في الكشكول بتاعه."
          ar: "يدوّن عمر كل تلك الجمل في دفتره."
          en: "Omar writes all those sentences in his notebook."
        - id: "\"Saya paham, Bu. Tapi waktu saya sedikit, ujian kita minggu depan!\""
          arz: "«أنا فاهم يا أستاذة. بس وقتي قليل، امتحاننا الأسبوع الجاي!»"
          ar: "«فهمت يا أستاذة. لكنّ وقتي قليل، فامتحاننا الأسبوع القادم!»"
          en: "\"I understand, ma'am. But I don't have much time: our exam is next week!\""
        - id: "Semua teman sekelasnya tertawa."
          arz: "كل زمايله في الفصل ضحكوا."
          ar: "ضحك جميع زملائه في الصف."
          en: "All his classmates laugh."
        - id: "\"Tenang, Omar,\" kata Bu Guru. \"Kalau kamu belajar sedikit setiap hari, waktunya cukup.\""
          arz: "«اهدى يا عمر،» قالت المدرّسة. «لو ذاكرت شوية كل يوم، الوقت هيكفّي.»"
          ar: "قالت المعلّمة: «اطمئنّ يا عمر. إن درست قليلًا كل يوم، فالوقت يكفي.»"
          en: "\"Don't worry, Omar,\" says the teacher. \"If you study a little every day, there's enough time.\""
        - id: "Setelah kelas, Omar menulis pesan untuk ibunya di Kairo: \"Mama, kabar saya baik. Hari ini saya belajar kata-kata yang mirip bahasa Arab!\""
          arz: "بعد الحصة، عمر كتب رسالة لمامته في القاهرة: «يا ماما، أنا كويس. النهارده اتعلمت كلمات شبه العربي!»"
          ar: "بعد الدرس، كتب عمر رسالة إلى أمّه في القاهرة: «أمي، أنا بخير. تعلّمت اليوم كلمات تشبه العربية!»"
          en: "After class, Omar writes to his mother in Cairo: \"Mum, I'm fine. Today I learned words that sound like Arabic!\""
      words: [kabar, waktu, selamat, paham, pagi, teman, kelas]
    criteria:
      - Bridge words are used in their Indonesian meanings; the Arabic link (خبر، وقت، سلامة، فهم) may be a gentle hook.
      - selamat used in a greeting (selamat pagi) and/or congratulations, matching the Indonesian sense.
      - Stand-alone (no Sinetron cast required).
      - 120–180 words.
    avoid:
      - Claiming every Indonesian word with an Arabic look-alike means the same in Arabic.
      - Using selamat only as "safe" in a way that confuses the greeting sense.
    tags: [kabar-pagi, bipa2, bridge, egypt-hook]
    verified: false

