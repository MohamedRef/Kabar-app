        - id: "\"Buku apa?\" tanya Ibu."
          arz: "«كتاب إيه؟» سألت ماما."
          ar: "سألت الأم: «أيّ كتاب؟»"
          en: "\"What book?\" Mum asks."
        - id: "\"Buku cerita tentang kucing kecil. Bagus sekali, Bu.\""
          arz: "«كتاب حكايات عن قطة صغيرة. حلو أوي يا ماما.»"
          ar: "«كتاب قصص عن قطّة صغيرة. إنه جميل جدًّا يا أمي.»"
          en: "\"A storybook about a little cat. It's really good, Mum.\""
        - id: "\"Coba baca sedikit untuk Ibu.\""
          arz: "«طب اقري لي حتة صغيرة.»"
          ar: "«اقرئي لي قليلًا منه.»"
          en: "\"Read a little to me.\""
        - id: "Lina membaca pelan-pelan: \"Kucing kecil itu tidur di bawah pohon.\""
          arz: "لينا قرت على مهلها: «القطة الصغيرة نايمة تحت الشجرة.»"
          ar: "تقرأ لينا على مهل: «تنام القطّة الصغيرة تحت الشجرة.»"
          en: "Lina reads slowly: \"The little cat sleeps under the tree.\""
        - id: "Ibu tersenyum. \"Bagus! Nanti Ibu juga mau membaca buku itu.\""
          arz: "ماما ابتسمت. «حلو! بعدين أنا كمان عايزة أقرا الكتاب ده.»"
          ar: "تبتسم الأم. «جميل! سأقرأ ذلك الكتاب أنا أيضًا لاحقًا.»"
          en: "Mum smiles. \"Lovely! Later I want to read that book too.\""
        - id: "Mereka minum teh dan membaca bersama di rumah."
          arz: "شربوا الشاي وقروا مع بعض في البيت."
          ar: "تشربان الشاي وتقرآن معًا في البيت."
