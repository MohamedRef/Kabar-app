        - id: "Tia bermain ayunan, sedangkan Raka bermain bola dengan teman-temannya dari rumah sebelah."
          arz: "تيا بتلعب على المرجيحة، وراكا بيلعب كورة مع صحابه من البيت اللي جنبهم."
          ar: "تلعب تيا على الأرجوحة، بينما يلعب راكا الكرة مع أصدقائه من البيت المجاور."
          en: "Tia plays on the swing, while Raka plays football with his friends from next door."
        - id: "Taman itu juga bersih, karena kemarin sore warga kampung kerja bakti bersama."
          arz: "الجنينة كمان نضيفة، عشان امبارح العصر أهل الحتة نضّفوها مع بعض متطوّعين."
          ar: "الحديقة نظيفة أيضًا، لأنّ أهل الحيّ قاموا أمس عصرًا بعمل تطوّعي جماعي."
          en: "The park is clean too, because yesterday afternoon the neighbourhood did a community clean-up together."
        - id: "Sampah dipungut, rumput dipotong, dan bangku taman dicat lagi."
