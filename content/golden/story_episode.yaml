          ar: "أنجزت السيدة رينا كل هذا العمل مع ولديها، تيا وراكا، من الصباح حتى العصر."
          en: "Bu Rina did all that work with her two children, Tia and Raka, from morning till afternoon."
        - id: "Sekarang Bu Rina membuka jendela, dan udara pagi masuk ke dalam rumah."
