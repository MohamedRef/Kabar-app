    expect:
      title: "Taman yang Bersih"
      level: bipa2
      sentences:
        - id: "Pagi ini Bu Rina bangun dengan hati yang senang sekali."
          arz: "الصبح ده الست رينا صحيت وهي مبسوطة أوي."
          ar: "استيقظت السيدة رينا هذا الصباح وقلبها مسرور جدًّا."
          en: "This morning Bu Rina wakes up feeling very happy."
        - id: "Rumahnya dibersihkan kemarin."
          arz: "بيتها اتنضّف امبارح."
