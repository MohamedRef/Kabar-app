        - id: "\"Sar! Piye kabarmu?\" teriak Rudi dalam bahasa Jawa."
          arz: "«ساري! إزيك؟» زعّق رودي بالجاوي."
          ar: "صاح رودي بالجاوية: «ساري! كيف حالك؟»"
          en: "\"Sar! How are you?\" Rudi calls out in Javanese."
        - id: "\"Apik, Rud! Aku kangen Madiun,\" jawab Sari sambil tertawa."
          arz: "«كويسة يا رودي! ماديون وحشتني،» ردّت ساري وهي بتضحك."
          ar: "أجابت ساري ضاحكةً: «بخير يا رودي! اشتقت إلى ماديون.»"
          en: "\"Good, Rud! I've missed Madiun,\" Sari answers, laughing."
        - id: "Di atas motor, dalam perjalanan ke warung, Sari bertanya, \"Kowe wis mangan?\""
          arz: "على الموتوسيكل، وهما رايحين المحل، ساري سألته: «إنت كلت؟»"
          ar: "على الدرّاجة النارية، في الطريق إلى المطعم، سألته ساري: «هل أكلت؟»"
          en: "On the motorbike, on the way to the warung, Sari asks, \"Have you eaten?\""
        - id: "\"Durung. Aku ngenteni kowe ket mau,\" jawab Rudi."
          arz: "«لسه. أنا مستنيكي من بدري،» ردّ رودي."
          ar: "أجاب رودي: «ليس بعد. أنا أنتظركِ منذ مدّة.»"
          en: "\"Not yet. I've been waiting for you for ages,\" Rudi answers."
        - id: "Rudi memang belum makan sejak siang, dan Sari juga sudah lapar setelah perjalanan panjang dari Kairo."
          arz: "رودي فعلًا ما كلش من الضهر، وساري كمان كانت جعانة بعد السفر الطويل من القاهرة."
          ar: "لم يأكل رودي فعلًا منذ الظهر، وكانت ساري أيضًا جائعة بعد الرحلة الطويلة من القاهرة."
          en: "Rudi really hasn't eaten since noon, and Sari is hungry too after the long journey from Cairo."
        - id: "\"Ayo mangan pecel nang warung Pakdhe!\""
          arz: "«يلا ناكل بيتشيل في محل عمّي!»"
          ar: "«هيّا نأكل البيتشيل في مطعم عمّي!»"
          en: "\"Let's eat pecel at Uncle's warung!\""
        - id: "Sepuluh menit kemudian, mereka sampai di warung Pak Budi."
          arz: "بعد عشر دقايق، وصلوا محل عم بودي."
          ar: "بعد عشر دقائق، وصلا إلى مطعم السيد بودي."
          en: "Ten minutes later, they reach Pak Budi's warung."
        - id: "Pak Budi keluar dari dapur dan langsung memeluk anaknya."
          arz: "عم بودي خرج من المطبخ وحضن بنته على طول."
          ar: "خرج السيد بودي من المطبخ وعانق ابنته على الفور."
          en: "Pak Budi comes out of the kitchen and hugs his daughter straight away."
        - id: "\"Ayah, Sari sudah pulang. Ayah sehat?\" tanya Sari dalam bahasa Indonesia."
          arz: "«يا بابا، ساري رجعت. إنت بخير؟» سألت ساري بالإندونيسي."
          ar: "سألت ساري بالإندونيسية: «أبي، لقد عادت ساري. هل أنت بخير؟»"
          en: "\"Dad, Sari's home. Are you well?\" Sari asks in Indonesian."
        - id: "\"Sehat, Nak. Kalian sudah makan?\" tanya Pak Budi."
          arz: "«بخير يا بنتي. إنتو كلتوا؟» سأل عم بودي."
          ar: "سأل السيد بودي: «بخير يا ابنتي. هل أكلتما؟»"
          en: "\"I'm well, love. Have you two eaten?\" asks Pak Budi."
        - id: "\"Dereng, Pakdhe,\" jawab Rudi sopan, dengan bahasa krama untuk pamannya."
          arz: "«لسه يا عمّي،» ردّ رودي بأدب، وكلّم عمّه بالكراما."
          ar: "أجاب رودي بأدب: «ليس بعد يا عمّي»، مستعملًا لغة الكراما المهذّبة مع عمّه."
          en: "\"Not yet, Uncle,\" Rudi answers politely, using krama with his uncle."
        - id: "Pak Budi tertawa dan menyiapkan dua piring nasi pecel dengan rempeyek dan teh hangat."
          arz: "عم بودي ضحك وجهّز طبقين بيتشيل بالرمبييك وشاي سخن."
          ar: "ضحك السيد بودي وأعدّ طبقين من البيتشيل مع رقائق الريمبييك وشايًا دافئًا."
          en: "Pak Budi laughs and makes two plates of nasi pecel with rempeyek and warm tea."
      words: [piye, wis, mangan, durung, makan, sudah, belum, warung]
      summary: "Sari arrives in Madiun and her cousin Rudi meets her at the station; chatting in Javanese, they go straight to Pak Budi's warung to eat pecel."
    criteria:
      - Narration in simple Indonesian (BIPA 1–2); the cousins speak ngoko to each other, which is right between peers.
      - Javanese lines are correct ngoko (Kowe wis mangan? / Durung.) and each is understandable from context or the Indonesian due words (makan/sudah/belum mirror mangan/wis/durung).
      - When Sari greets her father she does not use plain ngoko commands; Indonesian or krama (e.g. "Bapak", "sampun") is fine.
      - Continues previous_summary (Sari's visit home).
      - 128–192 words.
    avoid:
      - Mixing krama inggil into the peer chat, or ngoko from Sari to her father.
      - Whole paragraphs in Javanese; narration stays Indonesian.
      - Treating Javanese as "village" or uneducated speech.
    tags: [sinetron, javanese, ngoko, register, continuity]
    verified: false

  - id: story_episode-031
    lang: jv
    input:
      series: kabar_pagi
      level: j1
      target_words: [arep, piro, larang, sek]
      due_words: [harga, mahal, pasar]
      length_words: 140
    expect:
      title: "Tawar-menawar di Pasar Besar"
      level: j1
      sentences:
        - id: "Pagi-pagi, Rudi pergi ke Pasar Besar Madiun."
          arz: "من بدري، رودي راح السوق الكبير في ماديون."
          ar: "في الصباح الباكر، ذهب رودي إلى السوق الكبير في ماديون."
          en: "Early in the morning, Rudi goes to Madiun's Pasar Besar, the big market."
        - id: "Temannya, Joko, menjual sepatu bekas di sana."
          arz: "صاحبه جوكو بيبيع جزم مستعملة هناك."
          ar: "صديقه جوكو يبيع أحذية مستعملة هناك."
          en: "His friend Joko sells second-hand shoes there."
        - id: "Kemarin Rudi melihat foto sepatu itu di status WhatsApp Joko, lalu mengirim pesan: \"arp dicul piro?\""
          arz: "امبارح رودي شاف صورة الجزمة في حالة الواتساب بتاعة جوكو، وبعتله رسالة: «⁨arp dicul piro?⁩»"
          ar: "أمس رأى رودي صورة الحذاء في حالة واتساب جوكو، فأرسل له رسالة: «⁨arp dicul piro?⁩»"
          en: "Yesterday Rudi saw a photo of the shoes on Joko's WhatsApp status and sent a message: \"arp dicul piro?\""
        - id: "Dalam bahasa Jawa yang lengkap: \"Arep diculke pira?\" Artinya, \"Mau dilepas berapa?\""
          arz: "بالجاوي كامل: «⁨Arep diculke pira?⁩» يعني: «هتبيعها بكام؟»"
          ar: "بالجاوية كاملةً: «⁨Arep diculke pira?⁩» أي: «بكم ستبيعه؟»"
          en: "In full Javanese: \"Arep diculke pira?\" That means, \"How much will you let it go for?\""
        - id: "Joko hanya membalas: \"Sek tak lapor pusat.\""
          arz: "جوكو ردّ بس: «استنى، هبلّغ الإدارة.»"
          ar: "ردّ جوكو فقط: «انتظر، سأبلّغ الإدارة.»"
          en: "Joko only replied: \"Hold on, I'll report to HQ.\""
        - id: "Rudi tertawa, karena \"pusat\" pasti ibunya Joko."
          arz: "رودي ضحك، عشان «الإدارة» أكيد مامة جوكو."
          ar: "ضحك رودي، لأنّ «الإدارة» هي بالتأكيد أمّ جوكو."
          en: "Rudi laughed, because \"HQ\" was surely Joko's mum."
        - id: "Sekarang mereka bertemu di pasar. \"Piro, Jok? Aku arep tuku,\" tanya Rudi."
          arz: "دلوقتي اتقابلوا في السوق. «بكام يا جوكو؟ أنا عايز أشتري،» سأل رودي."
          ar: "الآن التقيا في السوق. سأل رودي: «بكم يا جوكو؟ أريد أن أشتري.»"
          en: "Now they meet at the market. \"How much, Jok? I want to buy,\" Rudi asks."
        - id: "\"Satus seket ewu,\" jawab Joko. Itu Rp150.000."
          arz: "«مية وخمسين ألف،» ردّ جوكو. يعني ١٥٠ ألف روبية."
          ar: "أجاب جوكو: «مئة وخمسون ألفًا.» أي ١٥٠ ألف روبية."
          en: "\"A hundred and fifty thousand,\" Joko answers. That's Rp150,000."
        - id: "\"Wah, larang! Satus ewu, yo?\""
          arz: "«ياه، غالية! مية ألف، ماشي؟»"
          ar: "«يا للغلاء! مئة ألف، اتفقنا؟»"
          en: "\"Wow, pricey! A hundred thousand, okay?\""
        - id: "Joko pura-pura berpikir. \"Sek, sek... Satus rong puluh ewu. Rega konco.\""
          arz: "جوكو عمل نفسه بيفكّر. «استنى، استنى... مية وعشرين ألف. سعر صحاب.»"
          ar: "تظاهر جوكو بالتفكير. «انتظر، انتظر... مئة وعشرون ألفًا. سعر الأصدقاء.»"
          en: "Joko pretends to think. \"Hold on, hold on... A hundred and twenty thousand. Mates' rates.\""
        - id: "Harga itu tidak mahal untuk sepatu yang masih bagus, jadi Rudi setuju."
          arz: "السعر ده مش غالي على جزمة لسه حلوة، فرودي وافق."
          ar: "ذلك السعر ليس غاليًا لحذاء ما زال جيدًا، فوافق رودي."
          en: "That price isn't expensive for shoes still in good shape, so Rudi agrees."
        - id: "Rudi membayar Rp120.000, dan Joko memberinya kantong plastik dan senyum lebar."
          arz: "رودي دفع ١٢٠ ألف روبية، وجوكو إدّاله كيس بلاستيك وابتسامة عريضة."
          ar: "دفع رودي ١٢٠ ألف روبية، فأعطاه جوكو كيسًا بلاستيكيًّا وابتسامة عريضة."
          en: "Rudi pays Rp120,000, and Joko gives him a plastic bag and a big grin."
        - id: "\"Suwun, Jok!\" kata Rudi. \"Padha-padha,\" jawab Joko."
          arz: "«متشكر يا جوكو!» قال رودي. «العفو،» ردّ جوكو."
          ar: "قال رودي: «شكرًا يا جوكو!» أجاب جوكو: «العفو.»"
          en: "\"Thanks, Jok!\" says Rudi. \"Same to you,\" Joko replies."
        - id: "Pagi itu Rudi pulang dari pasar dengan sepatu baru dan cerita lucu tentang \"pusat\"."
          arz: "الصبح ده رودي رجع من السوق بجزمة جديدة وحكاية تضحّك عن «الإدارة»."
          ar: "في ذلك الصباح عاد رودي من السوق بحذاء جديد وقصّة طريفة عن «الإدارة»."
          en: "That morning Rudi comes home from the market with new shoes and a funny story about \"HQ\"."
      words: [arep, piro, larang, sek, harga, mahal, pasar]
    criteria:
      - Uses the §24 chat text "arp dicul piro" (arep diculke pira) or "Sek tak lapor pusat" naturally, with meaning clear from context.
      - Ngoko between two friends of the same age is right; larang and piro used correctly in prices.
      - Narration in Indonesian; Javanese only in dialogue and chat.
      - 112–168 words.
    avoid:
      - Ngoko from a young buyer to an older stranger seller without comment.
      - Translating piro as "many" or larang as "forbidden" (Indonesian larang).
    tags: [kabar-pagi, javanese, ngoko, test-text, chat, false-friend]
    verified: false

  - id: story_episode-032
    lang: jv
    input:
      series: sinetron
      level: j2
      target_words: [kangen, mulih, sesuk, omah]
      due_words: [rindu, pulang, besok, rumah]
      previous_summary: "Episode 18: Sari and Rudi eat pecel at the warung. Sari's old school friend Ayu messages her in Javanese."
      length_words: 180
    expect:
      title: "Kangen Omah"
      level: j2
      sentences:
        - id: "Malam itu, ponsel Sari berbunyi. Ada pesan dari Ayu, teman SMA-nya."
          arz: "الليلة دي، موبايل ساري رنّ. رسالة من أيو، صاحبتها من الثانوي."
          ar: "في تلك الليلة رنّ هاتف ساري. رسالة من أيو، صديقتها من المدرسة الثانوية."
          en: "That night, Sari's phone pings. It's a message from Ayu, her friend from high school."
        - id: "\"Sar, aku kangen! Kowe mulih suwe ora?\""
          arz: "«يا ساري، وحشتيني! إنتي نازلة البلد مدة طويلة؟»"
          ar: "«يا ساري، اشتقت إليكِ! هل عدتِ إلى البيت لمدّة طويلة؟»"
          en: "\"Sar, I miss you! Are you home for long?\""
        - id: "Sari membalas, \"Ora suwe, Yu. Mung telung minggu.\""
          arz: "ساري ردّت: «مش كتير يا أيو. تلات أسابيع بس.»"
          ar: "ردّت ساري: «ليس طويلًا يا أيو. ثلاثة أسابيع فقط.»"
          en: "Sari replies, \"Not long, Yu. Just three weeks.\""
        - id: "Ayu langsung membalas: \"Yo wis, sesuk aku dolan nang omahmu, yo!\""
          arz: "أيو ردّت على طول: «خلاص، بكرة هعدّي عليكي في البيت!»"
          ar: "ردّت أيو فورًا: «حسنًا، غدًا سأزوركِ في بيتكِ!»"
          en: "Ayu replies at once: \"Okay then, tomorrow I'll come round to your house!\""
        - id: "Sari tersenyum. Penerbangannya ke Kairo lusa, jadi besok malam adalah malam terakhirnya di Madiun."
          arz: "ساري ابتسمت. طيارتها للقاهرة بعد بكرة، يعني بكرة بالليل آخر ليلة ليها في ماديون."
          ar: "ابتسمت ساري. رحلتها إلى القاهرة بعد غد، فليلة الغد هي ليلتها الأخيرة في ماديون."
          en: "Sari smiles. Her flight to Cairo is the day after tomorrow, so tomorrow night is her last night in Madiun."
        - id: "Besok sorenya, Ayu datang ke rumah Pak Budi membawa martabak manis."
          arz: "تاني يوم العصر، أيو جت بيت عم بودي ومعاها مارتاباك حلو."
          ar: "في عصر اليوم التالي، جاءت أيو إلى بيت السيد بودي حاملةً فطيرة مارتاباك حلوة."
          en: "The next afternoon, Ayu comes to Pak Budi's house with sweet martabak."
        - id: "\"Sugeng sonten, Pakdhe,\" sapa Ayu dengan sopan kepada Pak Budi, dalam bahasa krama."
          arz: "«مسا الخير يا عمّو،» سلّمت أيو على عم بودي بأدب، بالكلام المؤدّب بتاع الكراما."
          ar: "حيّت أيو السيد بودي بأدب بلغة الكراما: «مساء الخير يا عمّي.»"
          en: "\"Good afternoon, Pakdhe,\" Ayu greets Pak Budi politely, in krama."
        - id: "Lalu dua sahabat itu duduk di teras dan mengobrol dalam bahasa Jawa ngoko, seperti waktu SMA."
          arz: "وبعدين الصاحبتين قعدوا في البلكونة ورغيوا بالجاوي العادي، زي أيام الثانوي."
          ar: "ثم جلست الصديقتان في الشرفة وتحادثتا بالجاوية العاميّة (نغوكو)، كما في أيام المدرسة الثانوية."
          en: "Then the two friends sit on the veranda and chat in ngoko Javanese, like in high school."
        - id: "\"Kowe ora kangen omah nang Kairo?\" tanya Ayu."
          arz: "«البيت ما بيوحشكيش وإنتي في القاهرة؟» سألت أيو."
          ar: "سألت أيو: «ألا تشتاقين إلى البيت وأنتِ في القاهرة؟»"
          en: "\"Don't you miss home in Cairo?\" Ayu asks."
        - id: "Sari mengangguk. Di Kairo dia sering rindu rumah, rindu warung, dan rindu pecel ayahnya."
          arz: "ساري هزّت راسها. في القاهرة كتير بيوحشها البيت، والمحل، وبيتشيل أبوها."
          ar: "أومأت ساري. في القاهرة كثيرًا ما تشتاق إلى البيت، وإلى المطعم، وإلى بيتشيل أبيها."
          en: "Sari nods. In Cairo she often misses home, the warung and her father's pecel."
        - id: "\"Kangen banget, Yu. Tapi aku seneng sinau nang kana.\""
          arz: "«وحشني أوي يا أيو. بس أنا مبسوطة بالدراسة هناك.»"
          ar: "«أشتاق كثيرًا يا أيو. لكنني سعيدة بالدراسة هناك.»"
          en: "\"So much, Yu. But I'm happy studying there.\""
        - id: "Ayu memegang tangan Sari. \"Yen kowe mulih maneh, kabari aku, yo.\""
          arz: "أيو مسكت إيد ساري. «لما ترجعي تاني، قوليلي.»"
          ar: "أمسكت أيو يد ساري. «إن عدتِ مرة أخرى، فأخبريني.»"
          en: "Ayu holds Sari's hand. \"When you come home again, let me know.\""
        - id: "Malam itu Sari sadar: pulang ke Madiun bukan hanya pulang ke rumah, tetapi juga pulang ke teman-teman lama."
          arz: "الليلة دي ساري فهمت: الرجوع لماديون مش بس رجوع للبيت، ده كمان رجوع للصحاب القدام."
          ar: "أدركت ساري تلك الليلة أنّ العودة إلى ماديون ليست عودةً إلى البيت فقط، بل إلى الأصدقاء القدامى أيضًا."
          en: "That night Sari realises that coming home to Madiun isn't only coming home to the house, but to old friends too."
        - id: "Sebelum tidur, Sari berkata kepada ayahnya, \"Yah, besok pagi saya bantu di warung dulu, ya.\""
          arz: "قبل ما تنام، ساري قالت لأبوها: «يا بابا، بكرة الصبح هساعدك في المحل الأول.»"
          ar: "قبل النوم، قالت ساري لأبيها: «أبي، صباح الغد سأساعدك في المطعم أولًا.»"
          en: "Before bed, Sari says to her father, \"Dad, tomorrow morning I'll help at the warung first.\""
      words: [kangen, mulih, sesuk, omah, rindu, pulang, besok, rumah]
      summary: "Sari's school friend Ayu messages her in Javanese; they meet the evening before Sari's last day in Madiun, and Sari admits she misses home in Cairo but is happy studying there."
    criteria:
      - Ngoko between childhood friends (Ayu and Sari); Javanese words map to the Indonesian due words (kangen/rindu, mulih/pulang, sesuk/besok, omah/rumah).
      - Any line from Sari to Pak Budi is in Indonesian or krama, not ngoko.
      - Continues the visit-home arc; warm, not sad.
      - 144–216 words.
    avoid:
      - Using krama in the friends' chat (wrong register).
      - Confusing mulih (go home) with lunga (leave).
    tags: [sinetron, javanese, ngoko, register, continuity]
    verified: false

