# Golden set: read_handwriting (docs/SPEC.md §3, §4, §5, §19).
# input: {lang, expected?, capture?}; the image or stroke file goes in `image` once captured.
# expect: {text} = exactly what the learner wrote (including the learner's own misspellings).
# Every item needs a real capture on the learner's devices: tag needs-capture, follow input.capture,
# save under fixtures/golden/read_handwriting/<id>.png (and .json strokes), then set `image`.
task: read_handwriting
version: 1
rubric: |
  Score on exact text: 3 = identical to expect.text (case, spaces, hyphens, punctuation, digits); 2 = one character off or a case/punctuation slip only; 1 = the words are recognisable but two or more characters are wrong; 0 = wrong words or invented text.
  Transcribe what is on the canvas, never what `expected` says: a learner's misspelling (berkerja, makananya) must survive, because grade_answer judges it next.
  Crossed-out words are left out; a word written above a caret is inserted where the caret points.
  Indonesian/Javanese letter clusters must not be "autocorrected" to English words (nomin is not nominal, wes is not west).
  Javanese chat spellings (arp, piro, ng) stay as written; Rupiah amounts keep their dots (Rp26.000.000).
  Empty or scribble-only canvases return an empty string, never a guess.
items:
  # --- Dictation with an expected answer (write-mode lessons) ---
  - id: read_handwriting-001
    lang: id
    input:
      lang: id
      expected: Saya sedang membaca buku.
