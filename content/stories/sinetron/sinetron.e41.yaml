language: id
level: bipa5
unlock_after: bipa5.u01
title:
  target: Dengan Hormat, Saudari Diterima
  ar_eg: مع التحية، تمّ قبولك
  ar: تحية طيبة، لقد قُبلتِ
  en: Dear Ms Sari, You've Been Accepted
summary:
  ar_eg: ساري بتعمل إنترفيو أونلاين مع شركة في باليكبابان - بالبليزر من فوق وبنطلون البيجامة من تحت. الإيميل بييجي، والوداع في القاهرة صعب، وكريم بيخبّي تطبيق غريب على موبايله. وبعدين، أول يوم شغل في «مدينة البترول».
  ar: تُجري ساري مقابلة عمل عبر الإنترنت مع شركة في باليكبابان - بسترة رسمية من الأعلى وسروال النوم من الأسفل. يصل البريد الإلكتروني، ويصعب الوداع في القاهرة، ويخفي كريم تطبيقًا غريبًا في هاتفه. ثم أول يوم عمل في «مدينة النفط».
  en: Sari has an online job interview with a firm in Balikpapan - blazer on top, pyjama trousers below. The email arrives, goodbyes in Cairo are hard, and Karim hides a strange app on his phone. Then, her first day at work in the "Oil City".
cast: [Bu Ratna, Sari, Nadia, Hagga Fatma, Karim, Pak Hendra, Pak Budi]
scenes:
  - setting:
      ar_eg: القاهرة، أول سبتمبر، في شقّة الحاجّة فاطمة. باك بودي وبو راهايو رجعوا ماديون. ساري قاعدة قدّام اللابتوب لإنترفيو شغل أونلاين.
      ar: القاهرة، مطلع سبتمبر، في شقّة الحاجّة فاطمة. عاد باك بودي وبو راهايو إلى ماديون. تجلس ساري أمام الحاسوب لمقابلة عمل عبر الإنترنت.
      en: Cairo, early September, in Hagga Fatma's flat. Pak Budi and Bu Rahayu have flown home to Madiun. Sari sits at her laptop for an online job interview.
    lines:
      - speaker: Narrator
        text: Pak Budi dan Bu Rahayu sudah pulang ke Madiun dengan dua koper oleh-oleh. Sari masih di Kairo, duduk di depan laptop dengan blazer rapi... dan celana tidur bergambar kucing.
        ar_eg: باك بودي وبو راهايو رجعوا ماديون بشنطتين هدايا. وساري لسّه في القاهرة، قاعدة قدّام اللابتوب ببليزر شيك... وبنطلون بيجامة عليه قطط.
        ar: عاد باك بودي وبو راهايو إلى ماديون بحقيبتين من الهدايا. وما زالت ساري في القاهرة، تجلس أمام الحاسوب بسترة أنيقة... وسروال نوم مرسوم عليه قطط.
        en: Pak Budi and Bu Rahayu have gone home to Madiun with two suitcases of gifts. Sari is still in Cairo, sitting at her laptop in a smart blazer... and pyjama trousers with cats on them.
      - speaker: Bu Ratna
        text: Selamat siang, Saudari Sari. Terima kasih telah meluangkan waktu untuk wawancara ini. Silakan memperkenalkan diri secara singkat.
        ar_eg: مساء الخير يا آنسة ساري. شكرًا إنك فضّيتي وقت للمقابلة دي. اتفضّلي عرّفينا بنفسك باختصار.
        ar: مساء الخير يا آنسة ساري. شكرًا لتخصيصكِ وقتًا لهذه المقابلة. تفضّلي بتقديم نفسكِ باختصار.
        en: Good afternoon, Ms Sari. Thank you for making time for this interview. Please introduce yourself briefly.
        note:
          ar_eg: في الشغل والمقابلات بيستعملوا الريجستر الرسمي - Saudari (للست) وSaudara (للراجل) بمعنى «حضرتك» في الكلام المكتوب والرسمي، وAnda بدل kamu. عمر ما حدّ بيقول لأبوه Anda!
          ar: في العمل والمقابلات يُستعمل السجلّ الرسمي - Saudari للمرأة وSaudara للرجل في الخطاب الرسمي والمكتوب، وAnda بدل kamu. ولا أحد يخاطب أباه بـAnda!
          en: Work and interviews use the formal register - Saudari (for a woman) and Saudara (for a man) as formal address, and Anda instead of kamu. Nobody calls their dad Anda!
      - speaker: Sari
        text: Terima kasih, Bu. Nama saya Sari, dari Madiun. Saya baru saja menyelesaikan studi S1 Bahasa Arab di Universitas Al-Azhar. Selama kuliah, saya juga bekerja paruh waktu sebagai pemandu wisata, sehingga saya terbiasa menjembatani dua budaya.
        ar_eg: شكرًا يا مدام. اسمي ساري، من ماديون. لسّه مخلّصة ليسانس لغة عربية من جامعة الأزهر. وأنا بدرس اشتغلت كمان بارت تايم مرشدة سياحية، فاتعوّدت أكون جسر بين ثقافتين.
        ar: شكرًا يا سيّدتي. اسمي ساري، من ماديون. أنهيتُ للتوّ الإجازة في اللغة العربية من جامعة الأزهر. وخلال الدراسة عملتُ أيضًا مرشدة سياحية بدوام جزئي، فاعتدتُ أن أكون جسرًا بين ثقافتين.
        en: Thank you, Ma'am. My name is Sari, from Madiun. I've just finished my degree in Arabic at Al-Azhar University. While studying I also worked part-time as a tour guide, so I'm used to bridging two cultures.
      - speaker: Bu Ratna
        text: Perusahaan kami sedang mencari staf penghubung yang mampu berkomunikasi dengan mitra dari Timur Tengah. Mengapa Anda tertarik dengan posisi ini?
        ar_eg: شركتنا بتدوّر على موظّف تنسيق يقدر يتواصل مع الشركا من الشرق الأوسط. إنتي مهتمّة بالوظيفة دي ليه؟
        ar: تبحث شركتنا عن موظّف اتصال قادر على التواصل مع الشركاء من الشرق الأوسط. لماذا تهتمّين بهذا المنصب؟
        en: Our company is looking for a liaison officer who can communicate with partners from the Middle East. Why are you interested in this position?
      - speaker: Sari
        text: Karena saya ingin bahasa yang saya pelajari selama empat tahun bermanfaat bagi negeri saya sendiri. Kalau saya hanya menyimpannya di Kairo, rasanya sayang.
        ar_eg: عشان عايزة اللغة اللي درستها أربع سنين تفيد بلدي أنا. لو فضلت شايلاها في القاهرة بس، يبقى خسارة.
        ar: لأنّني أريد أن تنفع اللغةُ التي درستُها أربع سنوات بلادي. فلو احتفظتُ بها في القاهرة وحدها لكان ذلك خسارة.
        en: Because I want the language I've studied for four years to be of use to my own country. If I only kept it in Cairo, it would feel like a waste.
        note:
          ar_eg: دي kalimat majemuk bertingkat (جملة مركّبة فيها جملة تابعة) - karena (عشان)، yang (اللي)، kalau (لو)، sehingga (فـ / لدرجة إن). في المقابلات الجمل دي بتبيّنك ناضج ومرتّب.
          ar: هذه kalimat majemuk bertingkat (جملة مركّبة بجملة تابعة) - karena (لأنّ)، yang (الذي)، kalau (إذا)، sehingga (بحيث). وفي المقابلات تُظهرك هذه الجمل ناضجًا مرتّب الفكر.
          en: This is a kalimat majemuk bertingkat (a complex sentence with a subordinate clause) - karena (because), yang (which), kalau (if), sehingga (so that). In interviews they make you sound mature and organised.
      - speaker: Bu Ratna
        text: Baik. Lalu, apa kelemahan Anda?
        ar_eg: تمام. طب، إيه نقطة ضعفك؟
        ar: حسنًا. وما نقطة ضعفكِ؟
        en: Good. And what is your weakness?
      - speaker: Sari
        text: Terkadang saya terlalu teliti, Bu. Satu email bisa saya periksa sampai tiga kali. Dan jujur saja, saya belum pernah menginjakkan kaki di Kalimantan.
        ar_eg: ساعات بكون مدقّقة زيادة عن اللزوم يا مدام. ممكن أراجع الإيميل الواحد تلات مرات. وبصراحة، عمري ما حطّيت رجلي في كاليمانتان.
        ar: أحيانًا أكون مدقّقة أكثر من اللازم يا سيّدتي، فقد أراجع الرسالة الواحدة ثلاث مرّات. وبصراحة، لم تطأ قدمي كاليمانتان قطّ.
        en: Sometimes I'm too thorough, Ma'am. I might check one email three times. And to be honest, I've never set foot in Kalimantan.
      - speaker: Bu Ratna
        text: Apabila diterima, Anda bersedia ditempatkan di Balikpapan dan mulai akhir bulan ini? Kontraknya satu tahun, dengan masa percobaan tiga bulan.
        ar_eg: لو اتقبلتي، مستعدّة تشتغلي في باليكبابان وتبدئي آخر الشهر ده؟ العقد سنة، وأول تلات شهور فترة تجربة.
        ar: إذا قُبلتِ، فهل أنتِ مستعدّة للعمل في باليكبابان والبدء في نهاية هذا الشهر؟ مدّة العقد سنة، منها ثلاثة أشهر فترة تجربة.
        en: If you're accepted, are you prepared to be posted to Balikpapan and start at the end of this month? It's a one-year contract, with a three-month probation period.
      - speaker: Sari
        text: Bersedia, Bu.
        ar_eg: مستعدّة يا مدام.
        ar: مستعدّة يا سيّدتي.
        en: I am, Ma'am.
      - speaker: Narrator
        text: 'Dua hari kemudian, sebuah email masuk. "Dengan hormat, bersama ini kami sampaikan bahwa Saudari dinyatakan diterima sebagai Staf Penghubung Bahasa Arab..."'
        ar_eg: بعد يومين، وصل إيميل. «تحية طيبة وبعد، نحيطكم علمًا بأنه قد تقرّر قبولكم في وظيفة موظّف التنسيق للغة العربية...»
        ar: بعد يومين وصلت رسالة إلكترونية. «تحية طيبة وبعد، نحيطكم علمًا بأنّه تقرّر قبولكم في وظيفة موظّف الاتصال للغة العربية...»
        en: Two days later, an email arrives. "Dear Ms Sari, we hereby inform you that you have been accepted as Arabic Liaison Officer..."
        note:
          ar_eg: الجواب الرسمي بيبدأ بـ Dengan hormat (حرفيًا «مع الاحترام» - زي «تحية طيبة وبعد»)، وفيه عبارات ثابتة زي bersama ini kami sampaikan bahwa (بنبلّغكم بإن) وdinyatakan diterima (اتقرّر قبولك).
          ar: تبدأ الرسالة الرسمية بـ Dengan hormat (حرفيًّا «مع الاحترام»، كقولنا «تحية طيبة وبعد»)، وفيها عبارات ثابتة مثل bersama ini kami sampaikan bahwa (نحيطكم علمًا بأنّ) وdinyatakan diterima (تقرّر قبولكم).
          en: A formal letter opens with Dengan hormat ("with respect", like "Dear Sir or Madam"), and uses set phrases such as bersama ini kami sampaikan bahwa (we hereby inform you that) and dinyatakan diterima (you are declared accepted).
  - setting:
      ar_eg: نفس الليلة، على سطح بيت الحاجّة فاطمة. شاي بالنعناع، ونادية وكريم جم يباركوا.
      ar: الليلة نفسها، على سطح بيت الحاجّة فاطمة. شاي بالنعناع، وقد جاءت نادية وكريم للتهنئة.
      en: The same night, on Hagga Fatma's roof. Mint tea, and Nadia and Karim have come to say congratulations.
    lines:
      - speaker: Sari
        text: Nad! Aku keterima! Akhir bulan ini aku berangkat ke Balikpapan!
        ar_eg: يا ناد! اتقبلت! آخر الشهر ده مسافرة باليكبابان!
        ar: يا ناد! لقد قُبلت! سأسافر إلى باليكبابان في آخر هذا الشهر!
        en: Nad! I got it! I'm off to Balikpapan at the end of the month!
        note:
          ar_eg: keterima = diterima (اتقبلت) - كده بيقولوها في الكلام اليومي.
          ar: keterima = diterima (قُبِلتُ) - هكذا تُقال في الكلام اليومي.
          en: keterima = diterima (accepted) - that is how people say it in everyday speech.
      - speaker: Nadia
        text: Lho, tadi siang kamu bilang "Bersedia, Bu" pake suara kayak penyiar berita. Sekarang "Nad!" sambil lompat-lompat.
        ar_eg: إيه ده، الضهر كنتي بتقولي «مستعدّة يا مدام» بصوت مذيعة نشرة. ودلوقتي «يا ناد!» وإنتي بتنطّي.
        ar: عجبًا، كنتِ ظهرًا تقولين «مستعدّة يا سيّدتي» بصوت مذيعة أخبار، والآن «يا ناد!» وأنتِ تقفزين.
        en: Hang on, this afternoon you were saying "I am, Ma'am" in a newsreader voice. Now it's "Nad!" and you're jumping up and down.
        note:
          ar_eg: الإندونيسي بيبدّل الريجستر بسهولة - في الشغل saya وAnda وBapak/Ibu، ومع الصحاب aku وkamu، والأسماء بتتقصّر (Nadia ← Nad). زي ما المصري بيقول «حضرتك» في الشغل و«إنت» مع صاحبه. وفي الشارع - bilang = berkata (قال)، pake = pakai/dengan (بـ)، kayak = seperti (زي). penyiar berita = مذيع الأخبار.
          ar: تتبدّل مستويات الخطاب في الإندونيسية بسهولة - في العمل saya وAnda وBapak/Ibu، ومع الأصدقاء aku وkamu وتُختصر الأسماء (Nadia ← Nad)، كما يقول المصري «حضرتك» في العمل و«إنت» مع صديقه. وفي الشارع - bilang = berkata (قال)، pake = pakai/dengan (بـ)، kayak = seperti (مثل). penyiar berita = مذيع الأخبار.
          en: Indonesians switch register easily - at work it's saya, Anda and Bapak/Ibu; with friends it's aku, kamu and shortened names (Nadia → Nad). Just as an Egyptian says hadretak at work and enta to a friend. And street forms - bilang = berkata (say), pake = pakai/dengan (with), kayak = seperti (like). penyiar berita = newsreader.
      - speaker: Hagga Fatma
        text: Selamat, Sari. Tapi kamar itu kosong lagi. Pertama Pak Budi sama Bu Rahayu, sekarang kamu. Rumah ini bakal sepi banget.
        ar_eg: مبروك يا ساري. بس الأوضة هتفضى تاني. الأول باك بودي وبو راهايو، ودلوقتي إنتي. البيت ده هيبقى فاضي أوي.
        ar: مبارك يا ساري. لكنّ الغرفة ستخلو من جديد. أوّلًا باك بودي وبو راهايو، والآن أنتِ. سيصير هذا البيت موحشًا جدًّا.
        en: Congratulations, Sari. But that room's empty again. First Pak Budi and Bu Rahayu, now you. This house will be so quiet.
        note:
          ar_eg: sama = dan (و)، bakal = akan (هـ)، banget = sekali (أوي) - كلام يومي.
          ar: sama = dan (و)، bakal = akan (سـ)، banget = sekali (جدًّا) - كلام يومي.
          en: sama = dan (and), bakal = akan (will), banget = sekali (very) - everyday speech.
      - speaker: Sari
        text: Hagga, empat tahun Hagga jadi ibu saya di Kairo. Saya nggak akan lupa. Nanti Hagga harus datang ke Indonesia, ya.
        ar_eg: يا حاجّة، أربع سنين وإنتي أمّي في القاهرة. عمري ما هنسى. ولازم تيجي إندونيسيا بعدين، ماشي؟
        ar: يا حاجّة، كنتِ أمّي في القاهرة أربع سنوات، ولن أنسى ذلك أبدًا. ولا بدّ أن تزوري إندونيسيا يومًا ما.
        en: Hagga, for four years you've been my mother in Cairo. I'll never forget it. One day you have to come to Indonesia, okay?
      - speaker: Karim
        text: Kalimantan... jauh banget dari Kairo, ya. Tapi selamat ya, Sari. Itu rezekimu. Kamu emang pantas kok.
        ar_eg: كاليمانتان... بعيدة أوي عن القاهرة. بس مبروك يا ساري. ده رزقك، وإنتي تستاهليه.
        ar: كاليمانتان... بعيدة جدًّا عن القاهرة. لكن مبارك يا ساري. هذا رزقكِ، وأنتِ جديرة به.
        en: Kalimantan... it's a long way from Cairo. But congratulations, Sari. It's your good fortune, and you deserve it.
        note:
          ar_eg: emang = memang (فعلًا). rezeki = رزق، pantas = تستاهل.
          ar: emang = memang (حقًّا). rezeki = رزق، pantas = تستحقّ.
          en: emang = memang (really, truly). rezeki = god-given fortune, pantas = deserving.
      - speaker: Narrator
        text: 'Tiba-tiba HP Karim berbunyi. Suara seorang perempuan berkata pelan-pelan: "Sugeng dalu. Ayo, ulangi..."'
        ar_eg: 'فجأة موبايل كريم بيرنّ. صوت ست بيقول بالراحة: «سوغنغ دالو. يلا، كرّر ورايا...»'
        ar: 'فجأةً رنّ هاتف كريم، وقال صوت امرأة ببطء: «سوغنغ دالو. هيّا، كرّر...»'
        en: 'Suddenly Karim''s phone goes off. A woman''s voice says slowly: "Sugeng dalu. Now, repeat after me..."'
        note:
          ar_eg: Sugeng dalu يعني «مساء الخير / تصبح على خير» بالجاوي المؤدّب (كراما). مين اللي بيتعلّم كراما في القاهرة؟ افتكروا آخر حلقة!
          ar: Sugeng dalu تعني «مساء الخير» بالجاوية المهذّبة (كراما). فمن الذي يتعلّم الكراما في القاهرة؟ تذكّروا الحلقة الأخيرة!
          en: Sugeng dalu means "good evening" in polite Javanese (krama). Now who in Cairo is learning krama? Remember the last episode!
      - speaker: Nadia
        text: Karim, itu aplikasi apa sih?
        ar_eg: يا كريم، إيه التطبيق ده؟
        ar: يا كريم، ما هذا التطبيق؟
        en: Karim, what app is that?
      - speaker: Karim
        text: Bukan apa-apa kok. Aplikasi... cuaca. Malam ini cerah.
        ar_eg: ولا حاجة. تطبيق... طقس. الجوّ صافي النهارده بالليل.
        ar: لا شيء. تطبيق... للطقس. السماء صافية الليلة.
        en: Nothing. It's a... weather app. Clear skies tonight.
      - speaker: Nadia
        text: Aplikasi cuaca yang bisa bahasa Jawa halus? Canggih banget, ya.
        ar_eg: تطبيق طقس بيتكلّم جاوي مؤدّب؟ لا، متطوّر أوي بصراحة.
        ar: تطبيق طقس يتكلّم الجاوية المهذّبة؟ يا له من تطبيق متطوّر!
        en: A weather app that speaks polite Javanese? How very advanced.
        note:
          ar_eg: halus = مؤدّب/راقي (للغة)، canggih = متطوّر. نادية بتتريق!
          ar: halus = مهذّب راقٍ (للّغة)، canggih = متطوّر. نادية تسخر!
          en: halus = refined, polite (of language), canggih = high-tech. Nadia is teasing!
      - speaker: Hagga Fatma
        text: Udah, udah. Teh mintnya diminum dulu, nanti dingin. Rahasia orang jangan dibuka di atas atap.
        ar_eg: خلاص، خلاص. اشربوا الشاي بالنعناع الأول قبل ما يبرد. وأسرار الناس متتفتحش على السطوح.
        ar: كفى، كفى. اشربوا الشاي بالنعناع قبل أن يبرد. وأسرار الناس لا تُكشف فوق السطوح.
        en: All right, all right. Drink your mint tea before it gets cold. And people's secrets aren't to be opened up on the roof.
        note:
          ar_eg: udah = sudah - هنا بمعنى «خلاص بقى». rahasia = سرّ.
          ar: udah = sudah - وهنا بمعنى «كفى». rahasia = سرّ.
          en: udah = sudah - here it means 'that is enough'. rahasia = secret.
  - setting:
      ar_eg: باليكبابان، آخر سبتمبر. مكتب في الدور العاشر، والشبّاك بيطلّ على البحر وسفن البترول. أول يوم شغل لساري.
      ar: باليكبابان، أواخر سبتمبر. مكتب في الطابق العاشر تطلّ نافذته على البحر وناقلات النفط. أول يوم عمل لساري.
      en: Balikpapan, late September. A tenth-floor office whose window looks out over the sea and the oil tankers. Sari's first day at work.
    lines:
      - speaker: Pak Hendra
        text: Selamat bergabung, Mbak Sari. Saya Hendra, manajer divisi kemitraan. Di kantor ini kami cukup santai, tapi kalau sama mitra dan atasan, bahasanya tetap formal.
        ar_eg: أهلًا بيكي معانا يا مبك ساري. أنا هندرا، مدير قسم الشراكات. إحنا هنا في المكتب مش رسميّين أوي، بس مع الشركا والمديرين الكلام بيفضل رسمي.
        ar: مرحبًا بانضمامكِ إلينا يا مبك ساري. أنا هندرا، مدير قسم الشراكات. نحن في هذا المكتب غير متكلّفين، لكنّ اللغة تبقى رسمية مع الشركاء والرؤساء.
        en: Welcome aboard, Mbak Sari. I'm Hendra, manager of the partnerships division. We're fairly relaxed in this office, but with partners and superiors the language stays formal.
        note:
          ar_eg: mitra = شريك (في الشغل)، santai = مش رسمي/على راحتنا، sama = dengan (مع).
          ar: mitra = شريك (في العمل)، santai = غير متكلّف، sama = dengan (مع).
          en: mitra = (business) partner, santai = relaxed, sama = dengan (with).
      - speaker: Sari
        text: Baik, Pak Hendra. Terima kasih atas kepercayaannya. Apa tugas pertama saya?
        ar_eg: حاضر يا باك هندرا. شكرًا على ثقتك. إيه أول مهمّة ليّا؟
        ar: حسنًا يا باك هندرا. شكرًا على ثقتك. ما أوّل مهمّة لي؟
        en: Certainly, Pak Hendra. Thank you for your trust. What's my first task?
        note:
          ar_eg: في الشغل الإندونيسي بتنادي المدير Pak/Bu + اسمه، عمر ما تقول اسمه لوحده، حتى لو هو قالّك «اعتبرني صاحبك».
          ar: في بيئة العمل الإندونيسية يُنادى المدير بـPak/Bu مع اسمه، ولا يُنادى باسمه مجرّدًا أبدًا، حتى لو قال «اعتبرني صديقك».
          en: In an Indonesian workplace you call your boss Pak/Bu + name, never the bare name - even if they say "treat me like a friend".
      - speaker: Pak Hendra
        text: Ada surat dari mitra kami di Abu Dhabi, dan rapat video dengan mereka besok pagi. Tolong terjemahkan suratnya, lalu siapkan ringkasan dalam bahasa Indonesia.
        ar_eg: فيه جواب من شريكنا في أبو ظبي، واجتماع فيديو معاهم بكرة الصبح. ياريت تترجمي الجواب، وبعدين تحضّري ملخّص بالإندونيسي.
        ar: لدينا رسالة من شريكنا في أبوظبي، واجتماع مرئي معهم صباح الغد. يُرجى ترجمة الرسالة، ثم إعداد ملخّص لها بالإندونيسية.
        en: There's a letter from our partner in Abu Dhabi, and a video meeting with them tomorrow morning. Please translate the letter, then prepare a summary in Indonesian.
      - speaker: Sari
        text: Dari jendela ini kelihatan kapal-kapal tanker. Jadi benar, Balikpapan itu Kota Minyak.
        ar_eg: من الشبّاك ده باينة سفن البترول. يعني بجد، باليكبابان دي مدينة البترول.
        ar: تظهر ناقلات النفط من هذه النافذة. إذن صحيح أنّ باليكبابان مدينة النفط.
        en: You can see the tankers from this window. So it's true - Balikpapan really is the Oil City.
      - speaker: Pak Hendra
        text: Betul. Sumur minyak pertama di sini dibor tahun 1897. Karena itulah kota ini tumbuh, dan orang dari seluruh Indonesia datang untuk bekerja, seperti Mbak Sari.
        ar_eg: مظبوط. أول بير بترول هنا اتحفر سنة ١٨٩٧. وعشان كده المدينة كبرت، والناس جت من كل إندونيسيا تشتغل هنا، زيّك بالظبط.
        ar: صحيح. حُفرت أوّل بئر نفط هنا عام ١٨٩٧، ولذلك نمت المدينة، وجاء الناس من أنحاء إندونيسيا للعمل فيها، مثلكِ تمامًا.
        en: That's right. The first oil well here was drilled in 1897. That's why the city grew, and people came from all over Indonesia to work - like you, Mbak Sari.
        note:
          ar_eg: باليكبابان في كاليمانتان الشرقية، وعيد ميلادها ١٠ فبراير، يوم ما اتحفر بير البترول «ماتيلدا» سنة ١٨٩٧. وعشان كده اسمها Kota Minyak (مدينة البترول).
          ar: تقع باليكبابان في كاليمانتان الشرقية، وتحتفل بذكرى تأسيسها في ١٠ فبراير، يوم حفر بئر النفط «ماتيلدا» عام ١٨٩٧، ولذا تُلقّب Kota Minyak (مدينة النفط).
          en: Balikpapan, in East Kalimantan, marks its birthday on 10 February, the day the Mathilda oil well was drilled in 1897 - hence its nickname, Kota Minyak (Oil City).
      - speaker: Narrator
        text: Waktu istirahat siang, HP Sari berbunyi. Tentu saja, dari Madiun.
        ar_eg: في بريك الضهر، موبايل ساري رنّ. طبعًا، من ماديون.
        ar: في استراحة الظهر رنّ هاتف ساري. من ماديون بالطبع.
        en: At lunch break, Sari's phone rings. From Madiun, of course.
      - speaker: Pak Budi
        text: Nduk, udah makan? Di Balikpapan ada pecel, nggak? Bosnya galak, nggak? Kalau galak, bilang Bapak!
        ar_eg: يا بنتي، كلتي؟ فيه بيتشيل في باليكبابان ولا لأ؟ مديرك شرس ولا لأ؟ لو شرس، قوليلي!
        ar: يا ابنتي، هل أكلتِ؟ أفي باليكبابان بيتشيل أم لا؟ وهل مديركِ شرس؟ إن كان شرسًا فأخبريني!
        en: Sweetheart, have you eaten? Is there pecel in Balikpapan? Is your boss fierce? If he is, you tell me!
        note:
          ar_eg: udah = sudah، nggak = tidak، bilang = قول/بلّغ. pecel = سلطة خضار مسلوقة بصوص الفول السوداني، أكلة ماديون المشهورة.
          ar: udah = sudah، nggak = tidak، bilang = أخبِر. pecel = خضار مسلوقة بصلصة الفول السوداني، أكلة ماديون الشهيرة.
          en: udah = sudah, nggak = tidak, bilang = tell. pecel = boiled vegetables with peanut sauce, Madiun's famous dish.
      - speaker: Sari
        text: Udah, Pak. Pecel ada, tapi nggak seenak pecel Bapak. Bosnya baik kok. Tapi jangan telepon tiap jam dong. Ini kantor, bukan warung.
        ar_eg: كلت يا بابا. البيتشيل موجود، بس مش حلو زي بتاعك. والمدير كويّس. بس متكلّمنيش كل ساعة، ماشي؟ ده مكتب، مش وارونج.
        ar: أكلتُ يا أبي. البيتشيل موجود، لكنّه ليس لذيذًا كبيتشيلك. والمدير طيّب. لكن لا تتّصل كلّ ساعة، فهذا مكتب لا وارونغ.
        en: Yes, Dad. There's pecel, but it's not as good as yours. The boss is nice. But don't ring every hour, okay? This is an office, not a warung.
        note:
          ar_eg: tiap = setiap (كلّ)، seenak = لذيذ قدّ. dong = «بقى» لطلب بلطف.
          ar: tiap = setiap (كلّ)، seenak = بلذّة. dong = أداة لطلب لطيف ملحّ.
          en: tiap = setiap (every), seenak = as tasty as. dong softens and presses a request ("come on").
      - speaker: Pak Budi
        text: Iya, iya. Kalau gitu Bapak telepon tiap dua jam aja.
        ar_eg: حاضر، حاضر. خلاص، هكلّمك كل ساعتين بس.
        ar: حسنًا، حسنًا. إذن سأتّصل كلّ ساعتين فقط.
        en: All right, all right. I'll just ring every two hours, then.
        note:
          ar_eg: gitu = begitu، aja = saja، tiap = setiap.
          ar: gitu = begitu، aja = saja، tiap = setiap.
          en: gitu = begitu, aja = saja, tiap = setiap (every).
