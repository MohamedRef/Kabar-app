next:
  ar_eg: باك هندرا عنده خبر - وفد من الخليج جاي يزور العاصمة الجديدة «نوسانتارا»، وساري هي اللي هتترجم. وفي ماديون، العيلة كلها عندها رأي في العاصمة الجديدة... ومش متّفقين خالص.
  ar: لدى باك هندرا خبر - وفد من الخليج سيزور العاصمة الجديدة «نوسانتارا»، وساري هي المترجمة. وفي ماديون، للعائلة كلّها رأي في العاصمة الجديدة... ولا يتّفقون أبدًا.
  en: Pak Hendra has news - a delegation from the Gulf is visiting Nusantara, the new capital, and Sari will interpret. And in Madiun, the whole family has an opinion on the new capital... and they don't agree at all.
