series: sinetron
episode: 6
language: id
level: bipa1
unlock_after: bipa1.u06
title:
  target: Satu Hari Pak Budi
  ar_eg: يوم في حياة باك بودي
  ar: يوم من حياة باك بودي
  en: A Day in Pak Budi's Life
summary:
  ar_eg: باك بودي بيصحى قبل الفجر وبيشتغل لحد بالليل. ساري بتعرف ده من مامتها، وبتحاول تقنع أبوها ياكل وينام كويس.
  ar: يستيقظ باك بودي قبل الفجر ويعمل حتى الليل. تعرف ساري ذلك من أمها، فتحاول إقناع أبيها بأن يأكل وينام جيدًا.
  en: Pak Budi gets up before dawn and works till night. Sari hears about it from her mum and tries to get her dad to eat and rest.
cast: [Pak Budi, Bu Rahayu, Sari]
scenes:
  - setting:
      ar_eg: ماديون، قبل الفجر. البيت اللي ورا الوارونج.
      ar: ماديون قبل الفجر، في البيت الملحق بالوارونغ.
      en: Madiun, before dawn, in the house behind the warung.
    lines:
      - speaker: Narrator
        text: Madiun. Jam empat pagi. Pak Budi sudah bangun.
        ar_eg: ماديون. الساعة أربعة الفجر. باك بودي صحي خلاص.
        ar: ماديون. الساعة الرابعة فجرًا. استيقظ باك بودي.
        en: Madiun. Four in the morning. Pak Budi is already up.
      - speaker: Narrator
        text: Dia salat subuh, lalu dia memasak pecel.
        ar_eg: بيصلّي الصبح، وبعدين بيطبخ البيتشل.
        ar: يصلّي الفجر، ثم يطبخ البيتشل.
        en: He prays the dawn prayer, then he cooks the pecel.
        note:
          ar_eg: subuh من «صبح» وsalat من «صلاة». في جاوة الفجر بيأذّن بدري، حوالي ٤ ونص.
          ar: subuh من «الصبح» وsalat من «الصلاة». ويؤذَّن للفجر في جاوة مبكرًا، نحو الرابعة والنصف.
          en: subuh comes from Arabic «صبح» and salat from «صلاة». In Java the dawn call to prayer comes early, around 4:30.
      - speaker: Bu Rahayu
        text: Pak, Bapak selalu bangun jam empat. Bapak jarang tidur!
        ar_eg: يا بودي، انت دايمًا بتصحى الساعة أربعة. انت تقريبًا مبتنامش!
        ar: يا بودي، أنت تستيقظ دائمًا في الرابعة. نادرًا ما تنام!
        en: Dear, you always get up at four. You hardly ever sleep!
        note:
          ar_eg: الستات في جاوة كتير بينادوا جوزهم «Pak» أو «Bapak»، والراجل بينادي مراته «Bu».
          ar: كثيرًا ما تنادي الزوجة في جاوة زوجها «Pak» أو «Bapak»، وينادي الزوج زوجته «Bu».
          en: In Java, wives often call their husbands "Pak" and husbands call their wives "Bu".
      - speaker: Pak Budi
        text: Warung buka jam enam, Bu. Setiap hari.
        ar_eg: الوارونج بيفتح الساعة ستة يا راهايو. كل يوم.
        ar: الوارونغ يفتح في السادسة. كل يوم.
        en: The warung opens at six, dear. Every day.
      - speaker: Narrator
        text: Jam enam, warung buka. Pak Budi bekerja sampai malam.
        ar_eg: الساعة ستة الوارونج بيفتح، وباك بودي بيشتغل لحد بالليل.
        ar: في السادسة يفتح الوارونغ، ويعمل باك بودي حتى الليل.
        en: At six the warung opens. Pak Budi works until night.
  - setting:
      ar_eg: الساعة تمانية بالليل في ماديون (تلاتة العصر في القاهرة). ساري بتكلّم مامتها.
      ar: الساعة الثامنة مساءً في ماديون (الثالثة عصرًا في القاهرة). ساري تتصل بأمها.
      en: Eight p.m. in Madiun (three p.m. in Cairo). Sari calls her mum.
    lines:
      - speaker: Sari
        text: Asalamualaikum, Bu. Bapak udah tidur?
        ar_eg: السلام عليكم يا ماما. بابا نام؟
        ar: السلام عليكم يا أمي. هل نام أبي؟
        en: Assalamu alaikum, Mum. Is Dad asleep yet?
        note:
          ar_eg: udah = sudah (خلاص / بالفعل)، دي اللي بتتقال في البيت والشارع.
          ar: udah = sudah (قد / بالفعل)، وهي الصيغة المنطوقة في البيت والشارع.
          en: udah = sudah (already), the form you hear at home and in the street.
      - speaker: Bu Rahayu
        text: Waalaikumsalam. Belum, Nduk. Bapak masih di warung.
        ar_eg: وعليكم السلام. لسه يا بنتي. بابا لسه في الوارونج.
        ar: وعليكم السلام. ليس بعد يا ابنتي. ما زال أبوكِ في الوارونغ.
        en: Wa alaikum salam. Not yet, sweetheart. Dad's still at the warung.
      - speaker: Sari
        text: Jam delapan malam? Bapak kerja dari jam enam pagi!
        ar_eg: الساعة تمانية بالليل؟ ده بيشتغل من الساعة ستة الصبح!
        ar: في الثامنة مساءً؟ إنه يعمل منذ السادسة صباحًا!
        en: At eight at night? He's been working since six in the morning!
        note:
          ar_eg: في الكلام الناس بتشيل البادئة - kerja = bekerja (يشتغل).
          ar: في الكلام اليومي تُحذف البادئة - kerja = bekerja (يعمل).
          en: In speech people drop the prefix - kerja = bekerja (to work).
      - speaker: Bu Rahayu
        text: Iya. Bapak jarang makan siang, dan sering kurang tidur.
        ar_eg: أيوه. نادرًا لما بياكل غدا، وكتير مبينامش كفاية.
        ar: نعم. نادرًا ما يتناول الغداء، وكثيرًا ما لا ينام كفايته.
        en: Yes. He rarely has lunch, and he often doesn't get enough sleep.
        note:
          ar_eg: kurang tidur = «ناقص نوم»، زي kurang sehat. kurang بتقول إن الحاجة مش كفاية.
          ar: kurang tidur = «قلّة النوم»، مثل kurang sehat؛ فـkurang تعني أن الشيء غير كافٍ.
          en: kurang tidur is "short on sleep", like kurang sehat — kurang means "not enough".
      - speaker: Pak Budi
        text: Nduk! Kamu lagi ngapain?
        ar_eg: يا بنتي! بتعملي إيه؟
        ar: يا ابنتي! ماذا تفعلين؟
        en: Sweetheart! What are you up to?
        note:
          ar_eg: «Lagi ngapain?» = «Sedang apa?» (بتعمل إيه؟)، أشهر سؤال في الكلام. lagi = sedang، وngapain = melakukan apa.
          ar: «Lagi ngapain?» = «Sedang apa?» (ماذا تفعل؟)، وهو أشهر سؤال في الكلام اليومي. lagi = sedang، وngapain = melakukan apa.
          en: '"Lagi ngapain?" = "Sedang apa?" (what are you doing?), the everyday way to ask. lagi = sedang, ngapain = melakukan apa.'
      - speaker: Sari
        text: Aku lagi baca buku, Pak. Bapak udah makan?
        ar_eg: بقرا كتاب يا بابا. انت كلت؟
        ar: أقرأ كتابًا يا أبي. هل أكلت؟
        en: I'm reading a book, Dad. Have you eaten?
        note:
          ar_eg: «Udah makan?» (= Sudah makan?) في إندونيسيا زي «عامل إيه؟»، طريقة لإظهار الاهتمام. بس ساري هنا بتسأل بجد! وlagi baca = sedang membaca.
          ar: «Udah makan?» (= Sudah makan?) في إندونيسيا تحية تعبّر عن الاهتمام، كـ«كيف حالك؟». لكن ساري هنا تسأل جادّة! وlagi baca = sedang membaca.
          en: '"Udah makan?" (= Sudah makan?) is a caring greeting in Indonesia, like "how are you?" — but here Sari really means it! lagi baca = sedang membaca.'
      - speaker: Pak Budi
        text: Belum. Nanti, Nduk. Sesudah warung tutup.
        ar_eg: لسه. بعدين يا بنتي. لما الوارونج يقفل.
        ar: ليس بعد. لاحقًا يا ابنتي، بعد أن يُغلق الوارونغ.
        en: Not yet. Later, sweetheart. After the warung closes.
      - speaker: Sari
        text: Pak! Sebelum tidur, Bapak makan, ya. Dan besok Bapak tidur siang!
        ar_eg: يا بابا! قبل ما تنام، كُل، ماشي؟ وبكرة تنام شوية الضهر!
        ar: يا أبي! قبل أن تنام، كُل، اتفقنا؟ وغدًا خذ قيلولة!
        en: Dad! Eat before you sleep, okay? And tomorrow, take a nap!
        note:
          ar_eg: tidur siang = «نوم الضهر»، يعني القيلولة.
          ar: tidur siang = «نوم الظهيرة»، أي القيلولة.
          en: tidur siang, "midday sleep", is a nap.
      - speaker: Pak Budi
        text: Iya, iya. Kamu juga! Sesudah membaca, kamu makan.
        ar_eg: حاضر، حاضر. وانتي كمان! بعد ما تخلّصي قراية، كُلي.
        ar: حسنًا، حسنًا. وأنتِ أيضًا! بعد القراءة، كُلي.
        en: Yes, yes. You too! After reading, you eat.
      - speaker: Bu Rahayu
        text: Bapak dan anak sama aja!
        ar_eg: الأب زي بنته بالظبط!
        ar: الأب وابنته سواء!
        en: Father and daughter — exactly the same!
        note:
          ar_eg: sama aja = sama saja (زي بعض بالظبط)، كده بتتقال في الكلام.
          ar: sama aja = sama saja (سواء)، وهكذا تُنطق في الكلام اليومي.
          en: sama aja = sama saja (just the same), the way it's said out loud.
      - speaker: Narrator
        text: Di Kairo, Sari membaca lagi. Tapi dia lapar. Dia mau makan pecel.
        ar_eg: في القاهرة، ساري رجعت تقرا تاني. بس هي جعانة. نفسها في طبق بيتشل.
        ar: في القاهرة عادت ساري إلى القراءة، لكنها جائعة، وتشتهي طبق بيتشل.
        en: In Cairo, Sari goes back to reading. But she's hungry. She wants pecel.
new_words:
  - word: sama saja
    ar_eg: زي بعض بالظبط (في الكلام - sama aja)
    ar: سواء، الشيء نفسه (في الكلام - sama aja)
    en: just the same (spoken - sama aja)
  - word: tidur siang
    ar_eg: قيلولة، نوم الضهر
    ar: قيلولة
    en: nap
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: باك بودي بيصحى الساعة كام؟
      ar: في أيّ ساعة يستيقظ باك بودي؟
      en: What time does Pak Budi get up?
    options: ["jam empat pagi", "jam delapan malam", "jam enam pagi"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Aku ___ baca buku, Pak.
    meaning:
      ar_eg: بقرا كتاب دلوقتي يا بابا.
      ar: أنا أقرأ كتابًا الآن يا أبي.
      en: I'm reading a book (right now), Dad.
    answers: [lagi]
    options: ["jarang", "lagi", "sebelum"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: باك بودي أكل ولا لأ لما ساري سألته؟
      ar: هل كان باك بودي قد أكل حين سألته ساري؟
      en: Had Pak Budi eaten when Sari asked?
    options: ["Sudah", "Sedang makan", "Belum"]
    answer: 2
  - id: q04
    type: translate
    direction: from_target
    source_text: Bapak jarang makan siang.
    answers_meaning:
      ar_eg: ["بابا نادرًا لما بياكل غدا.", "بابا قليل لما بيتغدّى."]
      ar: ["نادرًا ما يتناول أبي الغداء.", "قلّما يتغدّى أبي."]
      en: ["Dad rarely has lunch.", "Dad rarely eats lunch.", "He rarely has lunch."]
next:
  ar_eg: ساري هتطبخ بيتشل في القاهرة لأول مرة... ونادية عندها رأي في الأكل المصري!
  ar: ستطبخ ساري البيتشل في القاهرة لأول مرة... ولنادية رأي في الطعام المصري!
  en: Sari tries cooking pecel in Cairo for the first time... and Nadia has opinions about Egyptian food!
