title:
  target: Jaring yang Bolong
  ar_eg: الشبكة المخرومة
  ar: الشبكة المثقوبة
  en: The Net with a Hole
summary:
  ar_eg: بايو بيعمل لقاء مع بو يوحانا، مديرة إدارة الثروة السمكية في راجا أمبات، وبيسألها بأدب وبصراحة فلوس رسوم المحميّة بتروح فين. وهي بتردّ بصراحة نادرة. وبالليل بايو بيكتب البروفايل مرتين - مرة للراديو ومرة للجرنال - وباك بودي بيقارن بباك إر تي.
  ar: يحاور بايو بو يوحانا، رئيسة دائرة الشؤون البحرية والثروة السمكية في راجا أمبات، ويسألها بأدب وصراحة أين تذهب رسوم المحميّة، فتجيب بصراحة نادرة. وفي المساء يكتب بايو الصورة الصحفية مرّتين - للإذاعة وللصحيفة - ويقارن باك بودي بباك إر تي.
  en: Bayu interviews Bu Theresia, head of Raja Ampat's marine and fisheries office, and asks - politely but plainly - where the conservation fees go. She answers with rare frankness. That night Bayu writes the profile twice, for radio and for print, and Pak Budi compares her with Pak RT.
cast: [Bu Theresia, Bayu, Kak Nella, Pak Yafet, Pak Budi, Sari]
scenes:
  - setting:
      ar_eg: وايساي، عاصمة مقاطعة راجا أمبات. مكتب مديرة إدارة الثروة السمكية، وعلى حيطة كاملة خريطة كبيرة للبحر.
      ar: وايساي، عاصمة مقاطعة راجا أمبات. مكتب رئيسة دائرة الشؤون البحرية والثروة السمكية، وخريطة بحرية كبيرة تغطّي جدارًا كاملًا.
      en: Waisai, the seat of Raja Ampat regency. The office of the head of marine affairs and fisheries; a huge sea chart covers one whole wall.
    lines:
      - speaker: Narrator
        text: Waisai, ibu kota Kabupaten Raja Ampat. Di ruang kerja Kepala Dinas Kelautan dan Perikanan, sebuah peta laut besar memenuhi satu dinding.
        ar_eg: وايساي، عاصمة مقاطعة راجا أمبات. في مكتب مديرة إدارة الثروة السمكية، خريطة بحر كبيرة مالية حيطة كاملة.
        ar: وايساي، عاصمة مقاطعة راجا أمبات. في مكتب رئيسة دائرة الشؤون البحرية والثروة السمكية خريطة بحرية كبيرة تملأ جدارًا كاملًا.
        en: Waisai, capital of Raja Ampat Regency. In the office of the Head of the Marine and Fisheries Service, a big sea chart fills one wall.
        note:
          ar_eg: تقسيم الحكم المحلي - provinsi (محافظة، عليها gubernur) ← kabupaten (مقاطعة، عليها bupati) أو kota (مدينة، عليها wali kota). والـ dinas هي الإدارة الحكومية المحلية، والـ DPRD هو المجلس المحلي المنتخب.
          ar: مستويات الحكم المحلي - provinsi (محافظة يرأسها gubernur) ← kabupaten (مقاطعة يرأسها bupati) أو kota (مدينة يرأسها wali kota). والـ dinas دائرة حكومية محلية، والـ DPRD هو المجلس التشريعي المحلي المنتخب.
          en: 'Local government: provinsi (province, led by a gubernur) → kabupaten (regency, led by a bupati) or kota (city, led by a wali kota). A dinas is a local government service; the DPRD is the elected regional parliament.'
      - speaker: Bu Theresia
        text: Silakan duduk, Mas Bayu, Ade Nella. Saya dengar tulisan Anda tentang arus kemarin cukup ramai dibaca.
        ar_eg: اتفضّلوا اقعدوا يا ماس بايو ويا أدي نيلا. سمعت إن مقالتكم عن التيّار اتقرت كتير.
        ar: تفضّلا بالجلوس يا ماس بايو ويا أدي نيلا. سمعتُ أنّ مقالتكما عن التيّار لقيت إقبالًا واسعًا.
        en: Please sit down, Mas Bayu, Ade Nella. I hear your piece about the currents was widely read.
        note:
          ar_eg: dibaca = اتقرا. مع مسؤولة، الكلام كله رسمي - Anda وsaya.
          ar: dibaca = قُرئ. مع مسؤولة يكون الكلام رسميًّا - Anda وsaya.
          en: dibaca = read. With an official everyone uses the formal register - Anda, saya.
      - speaker: Bayu
        text: Terima kasih atas waktunya, Bu. Izinkan saya langsung ke pokok persoalan. Setiap wisatawan membayar biaya jasa lingkungan untuk masuk ke kawasan konservasi. Ke mana dana itu digunakan?
        ar_eg: شكرًا على وقتك يا فندم. اسمحيلي أدخل في الموضوع على طول. كل سايح بيدفع رسوم خدمات بيئية عشان يدخل المحميّة. الفلوس دي بتتصرف في إيه؟
        ar: شكرًا على وقتكِ يا سيّدتي. اسمحي لي بالدخول في صلب الموضوع. يدفع كلّ سائح رسوم خدمات بيئية لدخول المنطقة المحميّة. فيمَ تُنفق تلك الأموال؟
        en: Thank you for your time, Bu. Allow me to get straight to the point. Every tourist pays an environmental service fee to enter the conservation area. What is that money used for?
        note:
          ar_eg: digunakan = بيتصرف/بيستخدم، pokok persoalan = لبّ الموضوع. بايو بيعمل لقاء صحفي، فبيتكلّم رسمي.
          ar: digunakan = يُستخدم، pokok persoalan = لبّ الموضوع. يُجري بايو مقابلة صحفية فيتكلّم رسميًّا.
          en: digunakan = used, pokok persoalan = the heart of the matter. A press interview, so Bayu speaks formally.
      - speaker: Bu Theresia
        text: Pertanyaan yang wajar, dan memang harus ditanyakan. Sebagian dana digunakan untuk patroli laut, sebagian untuk program kampung, dan sebagian lagi untuk pengelolaan kawasan. Rinciannya kami laporkan setiap tahun.
        ar_eg: سؤال في محلّه، ولازم يتسأل فعلًا. جزء من الفلوس بيروح للدوريات البحرية، وجزء لمشاريع القرى، وجزء لإدارة المحميّة. والتفاصيل بنعلنها في تقرير كل سنة.
        ar: سؤال مشروع، ويجب أن يُطرح فعلًا. يُنفق جزء من الأموال على الدوريات البحرية، وجزء على برامج القرى، وجزء ثالث على إدارة المنطقة. ونُصدر تفاصيلها في تقرير سنوي.
        en: A fair question, and one that should be asked. Part of the money goes to sea patrols, part to village programmes, and part to managing the area. We report the details every year.
        note:
          ar_eg: patroli = دورية، digunakan = بيتصرف، pengelolaan = إدارة، program = برنامج.
          ar: patroli = دورية، digunakan = يُصرف، pengelolaan = إدارة، program = برنامج.
          en: patroli = patrol, digunakan = used, pengelolaan = management, program = programme.
      - speaker: Kak Nella
        text: Laporan itu bisa dibaca masyarakat umum, Bu?
        ar_eg: والتقرير ده الناس العاديين يقدروا يقروه يا فندم؟
        ar: وهل يستطيع عامّة الناس قراءة ذلك التقرير يا سيّدتي؟
        en: Can the general public read that report, Bu?
      - speaker: Bu Theresia
        text: Bisa. Selain itu, penggunaan anggaran daerah diperiksa oleh BPK dan diawasi oleh DPRD. Kalau masyarakat menemukan pelayanan yang buruk, mereka juga bisa melapor ke Ombudsman.
        ar_eg: أيوه. وغير كده، صرف ميزانية المنطقة بيراجعه «ديوان المحاسبة» (BPK)، وبيراقبه المجلس المحلي (DPRD). ولو الناس لقوا خدمة وحشة، يقدروا كمان يشتكوا لـ «الأمبودسمان».
        ar: نعم. فضلًا عن ذلك، يدقّق ديوان المحاسبة (BPK) في إنفاق الميزانية المحلية ويراقبه المجلس المحلي (DPRD). وإن وجد الناس سوءًا في الخدمة أمكنهم أيضًا الشكوى إلى ديوان المظالم (Ombudsman).
        en: Yes. Besides that, the regional budget is audited by the BPK and overseen by the DPRD. If citizens find poor public service, they can also report it to the Ombudsman.
        note:
          ar_eg: سلسلة المحاسبة - BPK (Badan Pemeriksa Keuangan) زي الجهاز المركزي للمحاسبات عندنا؛ DPRD المجلس المحلي اللي الناس بتنتخبه؛ وOmbudsman RI جهة مستقلّة بتستقبل شكاوى الناس من سوء الخدمة الحكومية.
          ar: سلسلة المساءلة - BPK (Badan Pemeriksa Keuangan) يشبه الجهاز المركزي للمحاسبات في مصر؛ وDPRD المجلس المحلي المنتخب؛ وOmbudsman RI هيئة مستقلّة تتلقّى شكاوى المواطنين من سوء الخدمة العامّة.
          en: 'The accountability chain: the BPK (Supreme Audit Board) is like Egypt''s Central Auditing Organisation; the DPRD is the elected regional parliament; Ombudsman RI is an independent body that takes complaints about poor public service.'
      - speaker: Bayu
        text: Kalau begitu, apakah patroli sudah cukup, Bu? Nelayan di Arborek bilang kapal patroli jarang terlihat.
        ar_eg: طب هل الدوريات كفاية يا فندم؟ الصيّادين في أربوريك بيقولوا إن مراكب الدورية نادرًا ما بتبان.
        ar: إذن، هل الدوريات كافية يا سيّدتي؟ يقول صيّادو أربوريك إنّ زوارق الدورية نادرًا ما تُرى.
        en: In that case, are the patrols enough, Bu? Fishermen in Arborek say the patrol boats are rarely seen.
        note:
          ar_eg: patroli = دورية، jarang = نادرًا.
          ar: patroli = دورية، jarang = نادرًا.
          en: patroli = patrol, jarang = rarely.
      - speaker: Bu Theresia
        text: Saya tidak akan menutup-nutupi. Kapal kami belum cukup untuk ratusan pulau dan laut seluas ini. Karena itu, kami bekerja sama dengan patroli masyarakat dari kampung-kampung, juga dengan polisi perairan dan TNI Angkatan Laut.
        ar_eg: مش هخبّي عليك. مراكبنا لسه مش كفاية لميات الجزر وبحر بالمساحة دي. وعشان كده بنشتغل مع دوريات أهالي القرى، ومع شرطة المسطّحات المائية والبحرية الإندونيسية.
        ar: لن أُخفي شيئًا. زوارقنا لا تكفي بعدُ لمئات الجزر ولبحر بهذه السعة. ولذلك نتعاون مع دوريات الأهالي من القرى، ومع شرطة المياه والقوّات البحرية الإندونيسية.
        en: I won't cover it up. Our boats aren't yet enough for hundreds of islands and a sea this size. That's why we work with community patrols from the villages, and with the water police and the Indonesian Navy.
        note:
          ar_eg: patroli = دورية، menutup-nutupi = يخبّي، ratusan = مئات.
          ar: patroli = دورية، menutup-nutupi = يُخفي، ratusan = مئات.
          en: patroli = patrol, menutup-nutupi = cover up, ratusan = hundreds.
      - speaker: Bayu
        text: Bu, terus terang, jawaban seperti itu jarang saya dengar dari seorang pejabat.
        ar_eg: يا فندم، بصراحة، إجابة زي دي نادرًا ما بسمعها من مسؤول.
        ar: سيّدتي، بصراحة، قلّما أسمع جوابًا كهذا من مسؤول.
        en: Bu, frankly, I rarely hear an answer like that from an official.
      - speaker: Bu Theresia
        text: Mas Bayu, saya ini anak nelayan dari Misool. Bapak saya dulu bilang, jaring yang bolong jangan disembunyikan. Tunjukkan, supaya semua orang bisa membantu menambalnya.
        ar_eg: يا ماس بايو، أنا بنت صيّاد من ميسول. أبويا كان بيقول - الشبكة المخرومة متخبّيهاش. ورّيها، عشان الكل يقدر يساعدك ترقّعها.
        ar: يا ماس بايو، أنا ابنة صيّاد من ميسول. كان أبي يقول - لا تُخفِ الشبكة المثقوبة. أظهِرها كي يستطيع الجميع مساعدتك في رتقها.
        en: Mas Bayu, I'm a fisherman's daughter from Misool. My father used to say, don't hide a net with a hole in it. Show it, so everyone can help you mend it.
        note:
          ar_eg: jaring bolong = شبكة مخرومة، disembunyikan = تتخبّى، tunjukkan = ورّي، menambal = يرقّع.
          ar: jaring bolong = شبكة مثقوبة، disembunyikan = تُخفى، tunjukkan = أظهِر، menambal = يرقّع.
          en: jaring bolong = a net with a hole, disembunyikan = hidden, tunjukkan = show, menambal = patch.
      - speaker: Kak Nella
        text: Boleh kami memotret Ibu di depan peta itu?
        ar_eg: ممكن نصوّر حضرتك قدّام الخريطة دي؟
        ar: هل يمكننا تصويركِ أمام تلك الخريطة؟
        en: May we photograph you in front of that chart?
      - speaker: Bu Theresia
        text: Boleh. Tapi tolong tulis juga nama para petugas patroli kampung. Mereka yang bekerja di laut setiap hari, bukan saya.
        ar_eg: ماشي. بس والنبي اكتبوا كمان أسامي رجّالة دوريات القرى. هم اللي بيشتغلوا في البحر كل يوم، مش أنا.
        ar: لا مانع. لكن رجاءً اكتبوا أيضًا أسماء أفراد دوريات القرى. فهم الذين يعملون في البحر كلّ يوم، لا أنا.
        en: You may. But please also print the names of the village patrol officers. They're the ones out at sea every day, not me.
        note:
          ar_eg: patroli = دورية، tulis = اكتب، petugas = موظّفين.
          ar: patroli = دورية، tulis = اكتب، petugas = موظّفون.
          en: patroli = patrol, tulis = write, petugas = officers.
      - speaker: Bayu
        text: Terima kasih banyak, Bu. Kami akan memuat jawaban Ibu secara utuh, termasuk soal kapal patroli.
        ar_eg: شكرًا جزيلًا يا فندم. هننشر إجابات حضرتك كاملة، ومن ضمنها موضوع مراكب الدورية.
        ar: شكرًا جزيلًا يا سيّدتي. سننشر أجوبتكِ كاملةً، ومنها مسألة زوارق الدورية.
        en: Thank you very much, Bu. We'll run your answers in full, including the part about the patrol boats.
        note:
          ar_eg: patroli = دورية، memuat = ننشر، utuh = كاملة، soal = بخصوص.
          ar: patroli = دورية، memuat = ننشر، utuh = كاملة، soal = بشأن.
          en: patroli = patrol, memuat = print, publish, utuh = in full, soal = about.
  - setting:
      ar_eg: نفس الليلة، في مكتب الجرنال في سورونج. بايو كاتب نسختين من نفس البروفايل - واحدة للجرنال وواحدة لنشرة الراديو الصبح. باك يافت بيسمع.
      ar: الليلة نفسها في مكتب الصحيفة في سورونغ. كتب بايو نسختين من الصورة الصحفية نفسها - واحدة للصحيفة وأخرى لنشرة الإذاعة الصباحية. ويصغي باك يافت.
      en: That night at the newsroom in Sorong. Bayu has written two versions of the same profile - one for the paper, one for the morning radio bulletin. Pak Yafet is listening.
    lines:
      - speaker: Pak Yafet
        text: Baca versi radionya dulu.
        ar_eg: اقرا نسخة الراديو الأول.
        ar: اقرأ نسخة الإذاعة أوّلًا.
        en: Read the radio version first.
        note:
          ar_eg: baca = اقرا.
          ar: baca = اقرأ.
          en: baca = read (aloud).
      - speaker: Bayu
        text: '"Selamat pagi, Sorong. Pagi ini kita berkenalan dengan seorang kepala dinas yang suka bicara terus terang. Namanya Ibu Theresia. Ia anak nelayan. Dan ia tidak malu berkata, kapal patroli kita belum cukup."'
        ar_eg: «صباح الخير يا سورونج. النهارده هنتعرّف على مديرة إدارة بتحبّ تتكلّم بصراحة. اسمها بو يوحانا. هي بنت صيّاد. ومش مكسوفة تقول - مراكب الدورية عندنا مش كفاية.»
        ar: «صباح الخير يا سورونغ. نتعرّف هذا الصباح على رئيسة دائرة تحبّ الصراحة. اسمها السيّدة يوحانا. هي ابنة صيّاد. ولا تخجل من القول - زوارق دوريّتنا لا تكفي بعد.»
        en: '"Good morning, Sorong. This morning we meet a department head who likes to speak plainly. Her name is Ibu Theresia. She''s a fisherman''s daughter. And she isn''t ashamed to say: our patrol boats aren''t enough yet."'
        note:
          ar_eg: patroli = دورية، dinas = مديرية حكومية. نشرة راديو مكتوبة، فهي بالفصحى.
          ar: patroli = دورية، dinas = مديرية حكومية. نشرة إذاعية مكتوبة فهي بالفصحى.
          en: patroli = patrol, dinas = government office. A scripted radio bulletin, so it is standard Indonesian.
      - speaker: Pak Yafet
        text: Bagus. Kalimat pendek, satu gagasan untuk satu kalimat. Telinga tidak bisa membaca ulang. Sekarang versi koran.
        ar_eg: حلو. جمل قصيرة، وكل جملة فيها فكرة واحدة. الودن متقدرش ترجع تقرا تاني. دلوقتي نسخة الجرنال.
        ar: أحسنت. جمل قصيرة، لكلّ جملة فكرة واحدة. فالأذن لا تستطيع إعادة القراءة. والآن نسخة الصحيفة.
        en: Good. Short sentences, one idea per sentence. The ear can't reread. Now the print version.
        note:
          ar_eg: اللغة على حسب الجمهور (sesuai pembaca) - في الراديو، جمل قصيرة وتكرار للمعلومة المهمّة ومن غير أقواس. في الجرنال، جمل أطول، وأسماء مصادر (sorotan، pengelolaan)، وأسلوب رسمي.
          ar: اللغة بحسب الجمهور (sesuai pembaca) - في الإذاعة جمل قصيرة، وتكرار المعلومة المهمّة، ولا أقواس. وفي الصحيفة جمل أطول، ومصادر اسمية (sorotan، pengelolaan)، وأسلوب رسمي.
          en: 'Tune language to the audience (sesuai pembaca): radio wants short sentences, key facts repeated, no brackets; print allows longer sentences, nominalised words (sorotan, pengelolaan) and a formal style.'
      - speaker: Bayu
        text: '"Di tengah sorotan publik terhadap pengelolaan dana konservasi, Kepala Dinas Kelautan dan Perikanan Kabupaten Raja Ampat, Theresia, memilih membuka data. Ia mengakui keterbatasan armada patroli dan menyebut patroli masyarakat sebagai tulang punggung pengawasan."'
        ar_eg: «وسط اهتمام الناس بطريقة إدارة فلوس المحميّة، مديرة إدارة الثروة السمكية في مقاطعة راجا أمبات، يوحانا، اختارت تكشف البيانات. واعترفت إن أسطول الدوريات محدود، وقالت إن دوريات الأهالي هي العمود الفقري للرقابة.»
        ar: «في ظلّ اهتمام الرأي العام بإدارة أموال المحميّة، اختارت رئيسة دائرة الشؤون البحرية والثروة السمكية في مقاطعة راجا أمبات، يوحانا، أن تكشف البيانات. وأقرّت بمحدودية أسطول الدوريات، ووصفت دوريات الأهالي بأنّها العمود الفقري للرقابة.»
        en: '"Amid public scrutiny of how conservation funds are managed, the Head of the Raja Ampat Regency Marine and Fisheries Service, Theresia, has chosen to open up the data. She acknowledged the limits of the patrol fleet and called community patrols the backbone of enforcement."'
        note:
          ar_eg: patroli = دورية، pengelolaan = إدارة، pengawasan = رقابة، keterbatasan = قلّة/نقص.
          ar: patroli = دورية، pengelolaan = إدارة، pengawasan = رقابة، keterbatasan = محدودية.
          en: patroli = patrol, pengelolaan = management, pengawasan = oversight, keterbatasan = limits.
      - speaker: Pak Yafet
        text: Hormat, tapi nggak menjilat. Kritis, tapi nggak kurang ajar. Itu yang namanya seimbang.
        ar_eg: محترم، بس مش بيطبّل. ناقد، بس مش قليل الأدب. ده اللي اسمه توازن.
        ar: فيه احترام بلا تملّق، ونقد بلا وقاحة. هذا ما يُسمّى التوازن.
        en: Respectful, but not bootlicking. Critical, but not rude. That's what balance looks like.
        note:
          ar_eg: nggak = tidak. menjilat = يطبّل/يتملّق، kurang ajar = قليل الأدب.
          ar: nggak = tidak. menjilat = يتملّق، kurang ajar = وقح.
          en: nggak = tidak. menjilat = suck up, kurang ajar = rude.
      - speaker: Narrator
        text: Bayu mengirim kedua versi itu ke grup keluarga. Lima menit kemudian, Pak Budi menelepon.
        ar_eg: بايو بعت النسختين على جروب العيلة. وبعد خمس دقايق، باك بودي اتّصل.
        ar: أرسل بايو النسختين إلى مجموعة العائلة. وبعد خمس دقائق اتّصل باك بودي.
        en: Bayu sends both versions to the family group. Five minutes later, Pak Budi calls.
        note:
          ar_eg: grup = جروب.
          ar: grup = مجموعة.
          en: grup = (chat) group.
      - speaker: Pak Budi
        text: Le, Bapak udah baca. Bu Theresia itu bikin Bapak inget sama Pak RT kita.
        ar_eg: يا ابني، أنا قريت. بو يوحانا دي فكّرتني بباك إر تي بتاعنا.
        ar: يا بنيّ، قرأتُ. ذكّرتني بو يوحانا بباك إر تي عندنا.
        en: Son, I've read it. Bu Theresia reminds me of our Pak RT.
        note:
          ar_eg: Le = يا ابني. udah = sudah، baca = membaca، bikin ... inget = mengingatkan (فكّرني بـ).
          ar: Le = يا بنيّ. udah = sudah، baca = membaca، bikin ... inget = mengingatkan (ذكّرني بـ).
          en: Le = son. udah = sudah, baca = membaca (read), bikin ... inget = mengingatkan (remind).
      - speaker: Bayu
        text: Pak RT? Beliau kan bukan pejabat negara, Pak.
        ar_eg: باك إر تي؟ ده مش مسؤول حكومي يا بابا.
        ar: باك إر تي؟ لكنّه ليس مسؤولًا حكوميًّا يا أبي.
        en: Pak RT? But he isn't a state official, Dad.
      - speaker: Pak Budi
        text: Emang bukan. Tapi setiap akhir tahun Pak RT bacain laporan uang kas di pos ronda, sampai ke receh-recehnya. Kalau uang yang kecil aja harus terbuka, apalagi yang gede.
        ar_eg: صحيح مش مسؤول. بس كل آخر سنة باك إر تي بيقرا حساب الصندوق قدّام الناس في كشك الحراسة، لحد آخر فكّة. لو الفلوس الصغيّرة لازم تبقى على المكشوف، أمال الكبيرة؟
        ar: صحيح أنّه ليس كذلك. لكنّه في نهاية كلّ عام يقرأ حساب صندوق الحيّ في كشك الحراسة حتى آخر قطعة نقدية صغيرة. فإن وجبت الشفافية في المال القليل، فكيف بالكثير؟
        en: True, he isn't. But at the end of every year Pak RT reads out the neighbourhood accounts at the night-watch post, down to the last coin. If even small money has to be open, how much more the big money?
        note:
          ar_eg: emang = memang، bacain = membacakan (يقرا بصوت عالي)، aja = saja، gede = besar. kas = صندوق، receh = فكّة، terbuka = مكشوف. RT (Rukun Tetangga) أصغر وحدة في الحيّ، حوالي ٣٠-٥٠ بيت، ورئيسها متطوّع بينتخبه الجيران. مش مؤسسة دولة رسمية، بس هي أول باب بيخبّط عليه الناس. وpos ronda كشك صغيّر للحراسة الليلية بالدور.
          ar: emang = memang، bacain = membacakan (يقرأ على الملأ)، aja = saja، gede = besar. kas = صندوق، receh = فكّة، terbuka = علني. RT (Rukun Tetangga) أصغر وحدة سكنية، نحو ٣٠-٥٠ بيتًا، يرأسها متطوّع ينتخبه الجيران. ليست مؤسسة رسمية للدولة، لكنّها أوّل باب يطرقه الناس. وpos ronda كشك صغير للحراسة الليلية بالتناوب.
          en: emang = memang, bacain = membacakan (read out), aja = saja, gede = besar. kas = cash fund, receh = small change, terbuka = open. An RT (Rukun Tetangga) is the smallest neighbourhood unit, roughly 30-50 households, led by a volunteer the neighbours choose. It's not formally a state institution, but it's the first door people knock on. A pos ronda is a small hut for the rota'd night watch.
      - speaker: Sari
        text: Bapak bener, Bayu. Kepercayaan itu kayak kaca. Sekali retak, susah disambung lagi.
        ar_eg: بابا عنده حق يا بايو. الثقة زي الإزاز. لو اتشرخت مرّة، صعب تتلحم تاني.
        ar: أبي محقّ يا بايو. الثقة كالزجاج، إذا انكسرت مرّة صعُب جبرها.
        en: Dad's right, Bayu. Trust is like glass. Once it cracks, it's hard to mend.
        note:
          ar_eg: bener = benar، kayak = seperti. kepercayaan = الثقة، susah = صعب، disambung = يتلحم.
          ar: bener = benar، kayak = seperti. kepercayaan = الثقة، susah = صعب، disambung = يُوصل.
          en: bener = benar, kayak = seperti. kepercayaan = trust, susah = hard, disambung = mended.
      - speaker: Bayu
        text: Aku catat, Mbak. Buat kolom opini minggu depan, "Akuntabilitas Dimulai dari Pos Ronda".
        ar_eg: كتبتها يا أبلة. لعمود الرأي الأسبوع الجاي - «المحاسبة بتبدأ من كشك الحراسة».
        ar: سجّلتُها يا أختي. لعمود الرأي في الأسبوع القادم - «المساءلة تبدأ من كشك الحراسة».
        en: Noted, Sis. For next week's opinion column - "Accountability Starts at the Night-Watch Post".
        note:
          ar_eg: catat = يسجّل، buat = untuk.
          ar: catat = يدوّن، buat = untuk.
          en: catat = note down, buat = untuk.
      - speaker: Pak Yafet
        text: Judul itu... sa suka lagi. Bayu, ko mulai berbahaya.
        ar_eg: العنوان ده... عاجبني تاني. يا بايو، انت بدأت تبقى خطر.
        ar: هذا العنوان... يعجبني مرّة أخرى. يا بايو، بدأتَ تصبح خطيرًا.
        en: That title... I like it again. Bayu, you're getting dangerous.
