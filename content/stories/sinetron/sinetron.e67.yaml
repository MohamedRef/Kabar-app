questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب بو يوحانا، مين اللي بيراجع صرف ميزانية المنطقة؟
      ar: بحسب بو يوحانا، من يدقّق في إنفاق الميزانية المحلية؟
      en: According to Bu Theresia, who audits how the regional budget is spent?
    options: ["DPRD", "Ombudsman", "BPK", "patroli kampung"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Saya tidak akan ___. Kapal kami belum cukup untuk ratusan pulau.
    meaning:
      ar_eg: مش هخبّي عليك. مراكبنا لسه مش كفاية لميات الجزر.
      ar: لن أُخفي شيئًا. زوارقنا لا تكفي بعدُ لمئات الجزر.
      en: I won't cover it up. Our boats aren't yet enough for hundreds of islands.
    answers: [menutup-nutupi]
    options: ["menutup-nutupi", "mengawasi", "menjilat"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه جمل نسخة الراديو قصيرة؟
      ar: لماذا جاءت جمل نسخة الإذاعة قصيرة؟
      en: Why are the sentences in the radio version short?
    options: ["Karena waktu siaran sangat mahal.", "Karena pendengar radio masih anak-anak.", "Karena Bu Theresia memintanya.", "Karena telinga tidak bisa membaca ulang."]
    answer: 3
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: باك بودي عايز يقول إيه لما قارن بو يوحانا بباك إر تي؟
      ar: ماذا يريد باك بودي أن يقول حين قارن بو يوحانا بباك إر تي؟
      en: What is Pak Budi getting at when he compares Bu Theresia with Pak RT?
    options: ["Pak RT seharusnya menjadi kepala dinas.", "Keterbukaan penting di semua tingkat, kecil maupun besar.", "Uang kas RT terlalu sedikit.", "Pos ronda juga perlu kapal patroli."]
    answer: 1
  - id: q05
    type: listen
    text: Jaring yang bolong jangan disembunyikan. Tunjukkan, supaya semua orang bisa membantu menambalnya.
    question:
      ar_eg: المثل ده معناه إيه؟
      ar: ما معنى هذا القول؟
      en: What does this saying mean?
    options: ["Masalah sebaiknya diakui supaya bisa diperbaiki bersama.", "Nelayan harus membeli jaring baru setiap tahun.", "Jaring harus disimpan di kantor dinas."]
    answer: 0
    meaning:
      ar_eg: الشبكة المخرومة متخبّيهاش. ورّيها، عشان الكل يقدر يساعدك ترقّعها.
      ar: لا تُخفِ الشبكة المثقوبة. أظهِرها كي يستطيع الجميع مساعدتك في رتقها.
      en: Don't hide a net with a hole in it. Show it, so everyone can help you mend it.
next:
  ar_eg: في ماديون، بو راهايو صحيت الفجر لقت نور الوارونج لسه منوّر. باك بودي قاعد على كشكول مكتوب عليه «مشروع ك»... وحوالين منه آلة حاسبة وتلات حصّالات. ك دي يعني إيه؟
  ar: في ماديون تستيقظ بو راهايو فجرًا فتجد ضوء الوارونغ ما زال مضاءً. باك بودي منكبّ على دفتر كُتب عليه «مشروع ك»... وحوله آلة حاسبة وثلاث حصّالات. فماذا تعني «ك»؟
  en: In Madiun, Bu Rahayu wakes at dawn to find the warung light still on. Pak Budi is hunched over a notebook marked "PROJECT K"... with a calculator and three piggy banks. What does the K stand for?
