title:
  target: Kancil, Buaya, dan Panci Juha
  ar_eg: الكانتشيل والتماسيح وحلّة جحا
  ar: الكانتشيل والتماسيح وقِدر جحا
  en: The Mouse Deer, the Crocodiles and Juha's Pot
summary:
  ar_eg: ليلة حواديت على الفيديو. باك بودي بيحكي إزاي الكانتشيل الصغيّر ضحك على التماسيح وعدّى النهر، ونادية بتحكي حكاية جحا والحلّة اللي «ولدت». والاتنين بيتخانقوا على مين الأشطر.
  ar: ليلة حكايات عبر الاتصال المرئي. يحكي باك بودي كيف خدع الكانتشيل الصغير التماسيح وعبر النهر، وتحكي نادية حكاية جحا والقِدر التي «ولدت». ويتنافس الاثنان على من هو الأذكى.
  en: Story night on video. Pak Budi tells how the little mouse deer tricked the crocodiles to cross the river, and Nadia tells the tale of Juha and the pot that "gave birth". Then everyone argues about who's cleverer.
cast: [Pak Budi, Bayu, Bu Rahayu, Nadia, Sari, Hagga Fatma, Karim]
scenes:
  - setting:
      ar_eg: ماديون بعد العشا. النور خافت، وباك بودي قاعد على الحصيرة زي جدّه زمان. والقاهرة على الفيديو.
      ar: ماديون بعد العشاء. الضوء خافت، ويجلس باك بودي على الحصير كما كان جدّه يجلس. والقاهرة على الاتصال المرئي.
      en: Madiun after the evening prayer. The lights are low, and Pak Budi sits on the mat the way his grandfather used to. Cairo is on video.
    lines:
      - speaker: Pak Budi
        text: Pada zaman dahulu, ada seekor kancil yang cerdik. Suatu hari, dia berjalan-jalan di tepi sungai.
        ar_eg: كان يا ما كان، كان فيه كانتشيل شاطر. وفي يوم من الأيام، كان بيتمشّى على شط النهر.
        ar: كان يا ما كان، كان هناك كانتشيل ذكي. وذات يوم كان يتنزّه على ضفّة النهر.
        en: Once upon a time, there was a clever mouse deer. One day, he was strolling along the riverbank.
        note:
          ar_eg: «Pada zaman dahulu» = «كان يا ما كان». الحدّوتة بتتحكي بإندونيسي الكتب، بس الحيوانات بتتكلّم زي الناس في الشارع. وseekor = «واحد» للحيوانات، وtepi sungai = شط النهر. والكانتشيل (kancil) غزال صغيّر قد القطّة، وهو بطل حواديت كتير في جاوة وماليزيا، زي جحا عندنا.
          ar: «Pada zaman dahulu» تقابل «كان يا ما كان». تُروى الحكاية بلغة الكتب، لكنّ الحيوانات تتكلّم كالناس في الشارع. وseekor = «واحد» للحيوانات، وtepi sungai = ضفّة النهر. والكانتشيل (kancil) غزال صغير بحجم القطّ، بطل حكايات كثيرة في جاوة وماليزيا، كجحا عندنا.
          en: '"Pada zaman dahulu" = "once upon a time". The tale is told in storybook Indonesian, but the animals talk like people in the street. seekor = "a" (for animals); tepi sungai = riverbank. The kancil (mouse deer) is a tiny deer the size of a cat, the trickster hero of countless tales in Java and Malaysia.'
      - speaker: Pak Budi
        text: Di seberang sungai ada banyak buah. Tapi di dalam sungai ada buaya-buaya yang sudah berhari-hari tidak makan.
        ar_eg: على الناحية التانية من النهر كان فيه فاكهة كتير. بس في النهر كان فيه تماسيح بقالها أيام مكلتش.
        ar: على الضفّة الأخرى من النهر فاكهة كثيرة. لكن في النهر تماسيح لم تأكل منذ أيّام.
        en: Across the river there was lots of fruit. But in the river were crocodiles who hadn't eaten for days and days.
        note:
          ar_eg: ber- + كلمة مكرّرة بتدّي معنى «كتير / مدّة طويلة» - berhari-hari = «أيام وأيام»، berjalan-jalan = «يتمشّى ويتفسّح».
          ar: ber- مع الكلمة المكرّرة تفيد الكثرة أو طول المدّة - berhari-hari = «أيّامًا وأيّامًا»، berjalan-jalan = «يتنزّه».
          en: 'ber- + a doubled word means "lots of" or "for a long time": berhari-hari = "for days on end", berjalan-jalan = "to stroll around".'
      - speaker: Pak Budi
        text: Kancil bilang, "Raja nyuruh aku ngitung kalian. Semua buaya nanti dapat daging! Ayo, baris dari tepi ke tepi!"
        ar_eg: الكانتشيل قال «الملك أمرني أعدّكم. كل التماسيح هتاخد لحمة! يلا، اصطفّوا من الشط للشط!»
        ar: قال الكانتشيل «أمرني الملك أن أعدّكم. ستحصل كل التماسيح على لحم! هيّا، اصطفّوا من الضفّة إلى الضفّة!»
        en: The mouse deer said, "The king has ordered me to count you. Every crocodile will get meat! Come on, line up from bank to bank!"
        note:
          ar_eg: bilang = berkata (قال)، وnyuruh = menyuruh (أمر)، وngitung = menghitung (يعدّ)، وbaris = berbaris (يصطفّ). وtepi = شط.
          ar: bilang = berkata (قال)، وnyuruh = menyuruh (أمر)، وngitung = menghitung (يعدّ)، وbaris = berbaris (يصطفّ). وtepi = ضفّة.
          en: bilang = berkata (said), nyuruh = menyuruh (order), ngitung = menghitung (count), baris = berbaris (line up). tepi = bank.
      - speaker: Pak Budi
        text: Kancil lompat dari punggung ke punggung. "Satu, dua, tiga, empat..." Akhirnya dia sampai di seberang.
        ar_eg: الكانتشيل نطّ من ضهر لضهر. «واحد، اتنين، تلاتة، أربعة...» وفي الآخر وصل الناحية التانية.
        ar: قفز الكانتشيل من ظهر إلى ظهر. «واحد، اثنان، ثلاثة، أربعة...» حتى وصل أخيرًا إلى الضفّة الأخرى.
        en: The mouse deer hopped from back to back. "One, two, three, four..." At last he reached the other side.
      - speaker: Pak Budi
        text: Lalu dia tertawa, "Makasih, buaya-buaya bodoh! Nggak ada daging!" Kancil berlari-lari ke kebun buah.
        ar_eg: وبعدين ضحك «شكرًا يا تماسيح يا هبل! مفيش لحمة!» والكانتشيل جري على جنينة الفاكهة.
        ar: ثم ضحك قائلًا «شكرًا أيّتها التماسيح الغبيّة! لا لحم!» وراح الكانتشيل يركض نحو بستان الفاكهة.
        en: Then he laughed, "Thank you, silly crocodiles! There's no meat!" And the mouse deer scampered off to the orchard.
        note:
          ar_eg: bodoh = هبل / أغبيا. وberlari-lari = «يجري ويجري» (ber- + كلمة مكرّرة).
          ar: bodoh = أغبياء. وberlari-lari = «يركض ويركض» (ber- مع كلمة مكرّرة).
          en: bodoh = stupid. berlari-lari = run and run (ber- + doubled word).
      - speaker: Bayu
        text: Ih, kancilnya curang, Pak! Kasihan buayanya.
        ar_eg: الكانتشيل ده غشّاش يا بابا! حرام التماسيح.
        ar: هذا الكانتشيل غشّاش يا أبي! مسكينة التماسيح.
        en: That mouse deer's a cheat, Dad! Poor crocodiles.
        note:
          ar_eg: curang = غشّاش، وkasihan = «حرام / يا عيني». وih = «إيه ده!» للاستنكار.
          ar: curang = غشّاش، وkasihan = «مساكين». وih للاستنكار.
          en: curang = a cheat; kasihan = poor thing(s). ih = "ugh!".
      - speaker: Pak Budi
        text: Amanatnya, yang kecil pun bisa menang kalau pakai akal.
        ar_eg: العبرة إن حتى الصغيّر يقدر يكسب لو استعمل عقله.
        ar: العبرة أنّ الصغير أيضًا يستطيع أن ينتصر إذا استعمل عقله.
        en: The moral is, even the little one can win if he uses his head.
        note:
          ar_eg: amanat (عبرة الحكاية) جاية من العربي «أمانة»، وakal من «عقل». وpun هنا = «حتى»، وpakai = memakai (يستعمل). وفي بعض روايات الحكاية، الملك هو «سليمان».
          ar: amanat (مغزى الحكاية) من العربية «أمانة»، وakal من «عقل». وpun هنا = «حتى»، وpakai = memakai (يستعمل). وفي بعض روايات الحكاية يكون الملك «سليمان».
          en: amanat (a story's moral) comes from Arabic أمانة, and akal from عقل (mind). pun here = "even"; pakai = memakai (use). In some tellings, the king is King Sulaiman (Solomon).
      - speaker: Bu Rahayu
        text: Tapi jangan nipu orang, ya, Le. Akalnya dipake buat yang baik.
        ar_eg: بس متضحكش على الناس يا ابني. العقل يتستعمل في الخير.
        ar: لكن لا تخدع الناس يا بنيّ. العقل يُستعمل في الخير.
        en: But don't go tricking people, son. Use your head for good things.
        note:
          ar_eg: nipu = menipu (يضحك على / يغشّ)، وdipake = dipakai (يتستعمل)، وbuat = untuk. وakalnya = العقل.
          ar: nipu = menipu (يخدع)، وdipake = dipakai (يُستعمل)، وbuat = untuk. وakalnya = العقل.
          en: nipu = menipu (trick), dipake = dipakai (be used), buat = untuk. akalnya = your head (wits).
  - setting:
      ar_eg: دور القاهرة. نادية ماسكة حلّة صغيّرة من مطبخ الحاجّة فاطمة عشان تمثّل الحكاية.
      ar: جاء دور القاهرة. تمسك نادية قِدرًا صغيرة من مطبخ الحاجّة فاطمة لتمثّل الحكاية.
      en: Cairo's turn. Nadia is holding a small pot from Hagga Fatma's kitchen to act out the story.
    lines:
      - speaker: Nadia
        text: Alkisah, Juha meminjam sebuah panci besar dari tetangganya.
        ar_eg: يُحكى إن جحا استلف حلّة كبيرة من جاره.
        ar: يُحكى أنّ جحا استعار قِدرًا كبيرة من جاره.
        en: The story goes that Juha borrowed a big pot from his neighbour.
        note:
          ar_eg: alkisah (يُحكى إن…) جاية من العربي «القصّة»، وبتبدأ بيها الحواديت القديمة. وجحا هو نفسه «نصر الدين خوجة» عند الأتراك.
          ar: alkisah (يُحكى أنّ…) من العربية «القصّة»، وتُفتتح بها الحكايات القديمة. وجحا هو نفسه «نصر الدين خوجة» عند الأتراك.
          en: alkisah ("the story goes…") comes from Arabic القصة and opens old tales. Juha is the same figure as Turkey's Nasreddin Hoca.
      - speaker: Nadia
        text: Besoknya, dia mengembalikan panci itu dengan sebuah panci kecil. "Pancimu melahirkan anak!" katanya.
        ar_eg: تاني يوم، رجّع الحلّة ومعاها حلّة صغيّرة. وقال «حلّتك ولدت!»
        ar: في اليوم التالي أعاد القِدر ومعها قِدر صغيرة، وقال «قِدرك ولدت!»
        en: The next day, he returned the pot along with a little pot. "Your pot has given birth!" he said.
      - speaker: Nadia
        text: Tetangganya senang sekali dan tidak bertanya apa-apa. Lalu Juha meminjam pancinya lagi... dan berhari-hari tidak mengembalikannya.
        ar_eg: جاره اتبسط جدًّا ومسألش ولا سؤال. وبعدين جحا استلف الحلّة تاني... وفضل أيام مرجّعهاش.
        ar: فرح جاره كثيرًا ولم يسأل شيئًا. ثم استعار جحا القِدر مرّة أخرى... ولم يُعِدها أيّامًا.
        en: His neighbour was delighted and asked no questions. Then Juha borrowed the pot again... and didn't return it for days and days.
      - speaker: Hagga Fatma
        text: Lalu tetangganya datang sambil berteriak-teriak, "Mana panci saya?"
        ar_eg: وبعدين الجار جه وهو بيزعّق «فين حلّتي؟»
        ar: ثم جاء الجار وهو يصيح «أين قِدري؟»
        en: Then the neighbour came round, shouting and shouting, "Where's my pot?"
      - speaker: Nadia
        text: Juha menjawab dengan sedih, "Maaf, pancimu udah meninggal."
        ar_eg: جحا ردّ وهو زعلان «البقية في حياتك، حلّتك ماتت.»
        ar: أجاب جحا بحزن «آسف، لقد ماتت قِدرك.»
        en: Juha answered sadly, "I'm sorry, your pot has passed away."
        note:
          ar_eg: meninggal = «اتوفّى» (أرقّ من mati)، وmenjawab = يردّ، وudah = sudah.
          ar: meninggal = «توفّي» (ألطف من mati)، وmenjawab = يجيب، وudah = sudah.
          en: meninggal = pass away (gentler than mati), menjawab = answer, udah = sudah.
      - speaker: Karim
        text: '"Panci nggak bisa meninggal!" kata tetangganya. Juha jawab, "Kalau panci bisa melahirkan, kenapa nggak bisa meninggal?"'
        ar_eg: الجار قال «الحلّة مبتموتش!» وجحا ردّ «لمّا الحلّة تقدر تولد، ليه متقدرش تموت؟»
        ar: قال الجار «القِدر لا تموت!» فأجاب جحا «إذا كانت القِدر تلد، فلماذا لا تموت؟»
        en: '"Pots can''t die!" said the neighbour. Juha replied, "If a pot can give birth, why can''t it die?"'
        note:
          ar_eg: kata = قال (بعد الكلام المنقول)، وjawab = menjawab (ردّ)، وmeninggal = يموت (بأدب).
          ar: kata = قال (بعد الكلام المنقول)، وjawab = menjawab (أجاب)، وmeninggal = يتوفّى.
          en: kata = said (after a quote), jawab = menjawab (replied), meninggal = to pass away.
      - speaker: Bayu
        text: Wah! Juha lebih cerdik dari kancil, dong!
        ar_eg: هههه! جحا أشطر من الكانتشيل!
        ar: ها ها! جحا أذكى من الكانتشيل!
        en: Ha-ha! Juha's even cleverer than the mouse deer!
      - speaker: Sari
        text: Di Indonesia juga ada cerita kayak gini. Namanya cerita Abu Nawas.
        ar_eg: في إندونيسيا فيه حكايات زي دي برضه. اسمها حكايات أبو نواس.
        ar: في إندونيسيا حكايات مثل هذه أيضًا، وتسمّى حكايات أبي نواس.
        en: Indonesia has stories like this too. They're called Abu Nawas stories.
        note:
          ar_eg: kayak gini = seperti ini (زي كده). أبو نواس الشاعر العبّاسي بقى في إندونيسيا بطل حواديت فكاهية، شاطر وبيضحك على السلطان - زي جحا عندنا بالظبط.
          ar: kayak gini = seperti ini (مثل هذا). صار أبو نواس، الشاعر العبّاسي، في إندونيسيا بطلًا لحكايات فكاهية يخدع فيها السلطان بذكائه، تمامًا كجحا عندنا.
          en: kayak gini = seperti ini (like this). In Indonesia, Abu Nawas — the Abbasid poet — became the hero of funny tales, outwitting the sultan, much like Juha.
      - speaker: Pak Budi
        text: Nadia, panci di dapur Hagga Fatma itu... udah melahirkan berapa anak?
        ar_eg: يا نادية، الحلّة اللي في مطبخ الحاجّة فاطمة دي... ولدت كام عيّل لحدّ دلوقتي؟
        ar: يا نادية، تلك القِدر في مطبخ الحاجّة فاطمة... كم ولدًا ولدت حتى الآن؟
        en: Nadia, that pot from Hagga Fatma's kitchen... how many babies has it had so far?
