questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الكانتشيل كان عايز يعدّي النهر ليه؟
      ar: لماذا أراد الكانتشيل عبور النهر؟
      en: Why did the mouse deer want to cross the river?
    options: ["Dia mau bertemu raja.", "Dia mau makan buah di seberang.", "Dia mau menghitung buaya."]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Buaya-buaya itu sudah ___ tidak makan.
    meaning:
      ar_eg: التماسيح دي بقالها أيام وأيام مكلتش.
      ar: لم تأكل تلك التماسيح منذ أيّام عديدة.
      en: Those crocodiles hadn't eaten for days on end.
    answers: [berhari-hari]
    options: ["berjalan-jalan", "berlari-lari", "berhari-hari"]
  - id: q03
