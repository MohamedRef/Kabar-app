next:
  ar_eg: ساري هتتخرّج في أغسطس! وباك بودي وبو راهايو لازم يطلّعوا باسبور وفيزا… وأول مرّة يحجزوا تذكرة طيارة في حياتهم.
  ar: ستتخرّج ساري في أغسطس! وعلى باك بودي وبو راهايو استخراج جواز السفر والتأشيرة… وحجز تذكرة طيران لأوّل مرة في حياتهما.
  en: Sari graduates in August! Pak Budi and Bu Rahayu need passports and visas… and to book a plane ticket for the first time in their lives.
