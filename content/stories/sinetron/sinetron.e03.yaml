title:
  target: Foto Keluarga
  ar_eg: صورة العيلة
  ar: صورة العائلة
  en: The Family Photo
summary:
  ar_eg: نادية بتسأل عن صورة العيلة اللي على حيطة ساري، وبتحكي عن أخوها الكبير كريم. وبعدين أخو ساري الصغير بايو بيظهر في المكالمة.
  ar: تسأل نادية عن صورة العائلة على جدار ساري، وتحكي عن أخيها الأكبر كريم. ثم يظهر بايو، أخو ساري الأصغر، في الاتصال.
  en: Nadia asks about the family photo on Sari's wall and mentions her older brother, Karim. Then Sari's little brother Bayu pops up on the video call.
cast: [Sari, Nadia, Bayu, Bu Rahayu]
scenes:
  - setting:
      ar_eg: أوضة ساري في القاهرة. على الحيطة صورة عيلة قدّام وارونج صغير.
      ar: غرفة ساري في القاهرة. على الجدار صورة عائلية أمام وارونغ صغير.
      en: Sari's room in Cairo. On the wall is a family photo in front of a small warung.
    lines:
      - speaker: Nadia
        text: Sari, itu foto siapa?
        ar_eg: يا ساري، دي صورة مين؟
        ar: يا ساري، صورة مَن هذه؟
        en: Sari, whose photo is that?
      - speaker: Sari
        text: Ini foto keluargaku.
        ar_eg: دي صورة عيلتي.
        ar: هذه صورة عائلتي.
        en: This is a photo of my family.
      - speaker: Nadia
        text: Yang tinggi itu siapa?
        ar_eg: مين الطويل ده؟
        ar: مَن ذلك الطويل؟
        en: Who's the tall one?
      - speaker: Sari
        text: Itu bapakku, Pak Budi. Dan ini ibuku.
        ar_eg: ده بابا، باك بودي. ودي ماما.
        ar: ذاك أبي، باك بودي. وهذه أمي.
        en: That's my dad, Pak Budi. And this is my mum.
      - speaker: Nadia
        text: Anak kecil itu siapa? Lucu banget!
        ar_eg: والعيّل الصغير ده مين؟ عسول أوي!
        ar: ومَن ذلك الطفل الصغير؟ ظريف جدًا!
        en: Who's that little kid? So cute!
        note:
          ar_eg: banget = sekali (أوي / قوي)، وبتيجي بعد الصفة. lucu banget = lucu sekali.
          ar: banget = sekali (جدًا) في الكلام اليومي، وتأتي بعد الصفة. lucu banget = lucu sekali.
          en: banget = sekali (very) in everyday speech; it comes after the adjective. lucu banget = lucu sekali.
      - speaker: Sari
        text: Itu Bayu, adik laki-lakiku.
        ar_eg: ده بايو، أخويا الصغير.
        ar: ذاك بايو، أخي الأصغر.
        en: That's Bayu, my little brother.
        note:
          ar_eg: adik = الأخ أو الأخت الأصغر، وkakak = الأكبر. لو عايز تحدد ولد ولا بنت تزوّد laki-laki أو perempuan.
          ar: adik تعني الأخ أو الأخت الأصغر، وkakak الأكبر. ولتحديد الجنس تضيف laki-laki أو perempuan.
          en: adik is a younger sibling and kakak an older one; add laki-laki (male) or perempuan (female) to say which.
      - speaker: Sari
        text: Nadia punya adik?
        ar_eg: وانتي يا نادية عندك إخوات صغيرين؟
        ar: وهل لديكِ إخوة أصغر يا نادية؟
        en: Do you have younger siblings, Nadia?
      - speaker: Nadia
        text: Belum! Tapi aku punya kakak laki-laki. Namanya Karim.
        ar_eg: لأ! بس عندي أخ كبير. اسمه كريم.
        ar: لا! لكن لديّ أخ أكبر اسمه كريم.
        en: Nope! But I have an older brother. His name is Karim.
        note:
          ar_eg: نادية بتهزّر وبتقول belum («لسه»)، كأن ممكن يجيلها أخ صغير بعدين! الصح هنا tidak («لأ»)، واللي الناس بتقوله في الكلام nggak، وهتتعلمهم قريب.
          ar: تمزح نادية فتقول belum («ليس بعد»)، كأنّ أخًا أصغر قد يأتي لاحقًا! والأصحّ هنا tidak («لا»)، ويقول الناس في الكلام nggak، وستتعلّمهما قريبًا.
          en: Nadia jokes with belum ("not yet"), as if a little sibling might still turn up! The plain answer would be tidak ("no"), or nggak in everyday speech, which you'll learn soon.
      - speaker: Nadia
        text: Karim tinggal di Surabaya, di Indonesia!
        ar_eg: كريم عايش في سورابايا، في إندونيسيا!
        ar: يسكن كريم في سورابايا، في إندونيسيا!
        en: Karim lives in Surabaya, in Indonesia!
      - speaker: Sari
        text: Di Surabaya? Surabaya dan Madiun di Jawa Timur!
        ar_eg: في سورابايا؟ سورابايا وماديون الاتنين في جاوة الشرقية!
        ar: في سورابايا؟ سورابايا وماديون كلتاهما في جاوة الشرقية!
        en: In Surabaya? Surabaya and Madiun are both in East Java!
  - setting:
      ar_eg: مكالمة فيديو مع الوارونج في ماديون. بايو بيخطف الموبايل من بابا.
      ar: اتصال مرئي مع الوارونغ في ماديون. بايو يخطف الهاتف من أبيه.
      en: A video call to the warung in Madiun. Bayu grabs the phone from his dad.
    lines:
      - speaker: Bayu
        text: Mbak Sari! Mbak Sari!
        ar_eg: يا أبلة ساري! يا أبلة ساري!
        ar: يا أختي ساري! يا أختي ساري!
        en: Sis! Sari! Sari!
        note:
          ar_eg: Mbak لقب لست أو بنت شابة. الأخ الصغير بيقول لأخته الكبيرة «Mbak» زي «أبلة» عندنا.
          ar: Mbak لقب للشابة، ويناديه الأخ الصغير لأخته الكبرى كما نقول «أبلة» في مصر.
          en: Mbak is a title for a young woman; a younger sibling calls his big sister "Mbak", like "Abla" in Egypt.
      - speaker: Sari
        text: Hai, Bayu! Nadia, ini adik saya.
        ar_eg: هاي يا بايو! يا نادية، ده أخويا الصغير.
        ar: مرحبًا يا بايو! يا نادية، هذا أخي الأصغر.
        en: Hi, Bayu! Nadia, this is my little brother.
      - speaker: Nadia
        text: Hai, Bayu! Salam kenal!
        ar_eg: هاي يا بايو! اتشرفت بيك!
        ar: مرحبًا يا بايو! تشرّفت بمعرفتك!
        en: Hi, Bayu! Nice to meet you!
      - speaker: Bayu
        text: Salam kenal, Mbak Nadia! Ini warung bapakku!
        ar_eg: اتشرفت يا أبلة نادية! ده الوارونج بتاع بابا!
        ar: تشرّفت يا أختي نادية! هذا وارونغ أبي!
        en: Nice to meet you, Mbak Nadia! This is my dad's warung!
        note:
          ar_eg: الوارونج مطعم أو دكّان صغير شعبي، غالبًا بتديره عيلة. زي محل الفول اللي على الناصية عندنا.
          ar: الوارونغ مطعم أو دكّان شعبي صغير تديره عائلة في الغالب، يشبه محلّ الفول على ناصية الشارع في مصر.
          en: A warung is a small, often family-run eatery or shop — think of the corner foul shop in Egypt.
      - speaker: Nadia
        text: Warung kecil, tapi keluarga besar!
        ar_eg: وارونج صغير، بس عيلة كبيرة!
        ar: وارونغ صغير، لكن العائلة كبيرة!
        en: A small warung, but a big family!
      - speaker: Bu Rahayu
        text: Nadia udah nikah?
        ar_eg: انتي متجوزة يا نادية؟
        ar: هل أنتِ متزوجة يا نادية؟
        en: Are you married, Nadia?
        note:
          ar_eg: سؤال عادي جدًا في إندونيسيا من أول مقابلة؛ ده اهتمام ولطف، مش فضول وحش. وudah nikah = sudah menikah (اتجوز) زي ما الناس بتقولها.
          ar: سؤال مألوف جدًا في إندونيسيا منذ اللقاء الأول، ويُقصد به الاهتمام والودّ لا التطفّل. وudah nikah = sudah menikah كما يقولها الناس.
          en: A very normal question in Indonesia, even at a first meeting — it's friendliness, not nosiness. udah nikah = sudah menikah, the way people say it.
      - speaker: Nadia
        text: Belum, Bu!
        ar_eg: لسه يا طنط!
        ar: ليس بعد يا سيدتي!
        en: Not yet, ma'am!
      - speaker: Bu Rahayu
        text: Dan kakak Nadia, Karim? Karim udah nikah?
        ar_eg: وأخوكي كريم؟ كريم متجوز؟
        ar: وأخوكِ كريم؟ هل كريم متزوج؟
        en: And your brother, Karim? Is Karim married?
      - speaker: Nadia
        text: Belum, Bu!
        ar_eg: لسه يا طنط!
        ar: ليس بعد يا سيدتي!
        en: Not yet, ma'am!
      - speaker: Sari
        text: Ibu!
        ar_eg: ماما!
        ar: أمي!
        en: Mum!
        note:
          ar_eg: ساري اتكسفت؛ ماما بتلعب دور الخاطبة! حاجة مألوفة أوي في المسلسلات الإندونيسية (السينترون) والمصرية كمان.
          ar: خجلت ساري، فأمها تؤدي دور الخاطبة! وهذا مشهد مألوف جدًا في المسلسلات الإندونيسية (السينترون) والمصرية أيضًا.
          en: Sari is embarrassed — Mum is playing matchmaker! A classic scene in Indonesian soap operas (sinetron), and Egyptian ones too.
new_words:
  - word: warung
    pos: noun
    ar_eg: وارونج، مطعم أو دكّان صغير شعبي
    ar: وارونغ، مطعم أو دكّان شعبي صغير
    en: warung, a small family-run eatery or shop
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: مين بايو؟
      ar: مَن بايو؟
      en: Who is Bayu?
    options: ["kakak Sari", "ayah Sari", "adik Sari"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Aku punya kakak laki-laki. ___ Karim.
    meaning:
      ar_eg: عندي أخ كبير. اسمه كريم.
      ar: لديّ أخ أكبر، اسمه كريم.
      en: I have an older brother. His name is Karim.
    answers: [Namanya]
    options: ["Namaku", "Namanya", "Itu"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: كريم ساكن فين؟
      ar: أين يسكن كريم؟
      en: Where does Karim live?
    options: ["Madiun", "Kairo", "Surabaya"]
    answer: 2
  - id: q04
    type: translate
    direction: from_target
    source_text: Warung kecil, tapi keluarga besar!
    answers_meaning:
      ar_eg: ["وارونج صغير، بس عيلة كبيرة!", "محل صغير بس العيلة كبيرة!"]
      ar: ["وارونغ صغير، لكن العائلة كبيرة!", "دكّان صغير لكنّ العائلة كبيرة!"]
      en: ["A small warung, but a big family!", "Small warung, but a big family!"]
next:
  ar_eg: بايو بيوشوش ساري بسرّ صغير... يوم السبت الجاي يوم مهم أوي لباك بودي!
  ar: يهمس بايو لساري بسرّ صغير... السبت القادم يوم مهمّ جدًا لباك بودي!
  en: Bayu whispers a little secret to Sari... next Saturday is a very special day for Pak Budi!
