questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الموظف الطمّاع خد حمير الفلّاح ليه؟
      ar: لماذا أخذ الموظف الجشع حمير الفلّاح؟
      en: Why did the greedy official take the peasant's donkeys?
    options: ["Petani itu tidak membayar pajak.", "Keledainya makan sedikit gandum.", "Keledainya terlalu lambat."]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Ada ___ kepiting raksasa bernama Yuyu Kangkang.
    meaning:
      ar_eg: كان فيه كابوريا عملاقة اسمها يويو كانكانج.
      ar: كان هناك سلطعون عملاق اسمه يويو كانكانغ.
      en: There was a giant crab called Yuyu Kangkang.
    answers: [seekor]
    options: ["seorang", "sebuah", "seekor"]
  - id: q03
    type: listen
    text: Sembilan kali dia mengadu! Diam-diam, raja mengirim makanan untuk keluarganya.
    question:
      ar_eg: الفلّاح اشتكى كام مرة؟
      ar: كم مرّة اشتكى الفلّاح؟
      en: How many times did the peasant make his plea?
    options: ["tiga kali", "empat kali", "tujuh kali", "sembilan kali"]
    answer: 3
    meaning:
      ar_eg: تسع مرات اشتكى! والملك من غير ما حدّ يعرف بعت أكل لعيلته.
      ar: اشتكى تسع مرات! وكان الملك يرسل سرًّا طعامًا لأسرته.
      en: Nine times he made his plea! Secretly, the king sent food to his family.
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: إيه العبرة من حدّوتة «آندي آندي لوموت» حسب بو راهايو؟
      ar: ما مغزى حكاية «آندي آندي لوموت» بحسب بو راهايو؟
      en: According to Bu Rahayu, what's the moral of "Ande-Ande Lumut"?
    options: ["Jangan menilai orang dari penampilannya.", "Jangan menyeberangi sungai.", "Raja harus mendengar rakyatnya.", "Petani harus membawa garam."]
    answer: 0
  - id: q05
    type: translate
    direction: from_target
    source_text: Orang kecil juga harus berani bersuara.
    answers_meaning:
      ar_eg: ["الناس الغلابة كمان لازم يتكلّموا بجرأة.", "حتى البسطاء لازم يطالبوا بحقّهم.", "الناس العادية كمان لازم يبقى عندها الجرأة تتكلّم."]
      ar: ["على البسطاء أيضًا أن يرفعوا أصواتهم بشجاعة.", "حتى عامّة الناس يجب أن يجرؤوا على الكلام.", "ينبغي للبسطاء أيضًا أن يتحلّوا بالجرأة على قول رأيهم."]
      en: ["Ordinary people should dare to speak up too.", "Even ordinary people must be brave enough to speak out.", "The little people should have the courage to speak up as well."]
next:
  ar_eg: باك بودي خفّ وبقى يتمشّى الصبح تاني. وعند عربية الفول، شاف حاجة غريبة - الناس جايبة حللها من البيت. وفي دماغه فكرة للوارونج.
  ar: تعافى باك بودي وعاد إلى مشي الصباح. وعند عربة الفول رأى شيئًا غريبًا - الناس يحضرون قدورهم من البيت. فخطرت له فكرة للوارونغ.
  en: Pak Budi has recovered and is back to his morning walks. At the ful cart he sees something odd - people bring their own pots from home. And he gets an idea for the warung.
