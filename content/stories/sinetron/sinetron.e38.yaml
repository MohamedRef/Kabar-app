title:
  target: Petani yang Pandai Bicara
  ar_eg: الفلّاح الفصيح
  ar: الفلّاح الفصيح
  en: The Eloquent Peasant
summary:
  ar_eg: باك بودي بيرتاح في البيت، والحاجّة فاطمة بتحكيله حدّوتة مصرية عمرها حوالي أربع آلاف سنة - «الفلّاح الفصيح». وباك بودي بيردّ بحدّوتة جاوية - «آندي آندي لوموت» والكابوريا العملاقة.
  ar: يرتاح باك بودي في البيت، فتحكي له الحاجّة فاطمة حكاية مصرية عمرها نحو أربعة آلاف عام - «الفلّاح الفصيح». ويردّ باك بودي بحكاية جاوية - «آندي آندي لوموت» والسلطعون العملاق.
  en: Pak Budi is resting at home, and Hagga Fatma tells him an Egyptian tale nearly four thousand years old - "The Eloquent Peasant". Pak Budi answers with a Javanese one - "Ande-Ande Lumut" and the giant crab.
cast: [Hagga Fatma, Pak Budi, Nadia, Sari, Bu Rahayu]
scenes:
  - setting:
      ar_eg: بيت الحاجّة فاطمة بالليل. باك بودي متمدّد على الكنبة، والحاجّة فاطمة جايبة شاي وقاعدة جنبه. ساري ونادية وبو راهايو قاعدين على الأرض.
      ar: بيت الحاجّة فاطمة ليلًا. باك بودي مستلقٍ على الأريكة، والحاجّة فاطمة أحضرت الشاي وجلست بجانبه. ساري ونادية وبو راهايو جالسات على الأرض.
      en: Hagga Fatma's flat at night. Pak Budi is stretched out on the sofa; Hagga Fatma brings tea and sits beside him. Sari, Nadia and Bu Rahayu sit on the floor.
    lines:
      - speaker: Hagga Fatma
        text: Pak Budi, saya punya cerita yang umurnya hampir empat ribu tahun.
        ar_eg: يا باك بودي، عندي حدّوتة عمرها قرّب أربع آلاف سنة.
        ar: يا باك بودي، عندي حكاية عمرها قرابة أربعة آلاف عام.
        en: Pak Budi, I have a story that's nearly four thousand years old.
      - speaker: Pak Budi
        text: Empat ribu tahun? Lebih tua dari Al-Azhar dong!
        ar_eg: أربع آلاف سنة؟ أقدم من الأزهر كمان!
        ar: أربعة آلاف عام؟ أقدم من الأزهر!
        en: Four thousand years? Older than Al-Azhar!
      - speaker: Hagga Fatma
        text: Dahulu kala, ada seorang petani miskin dari Wadi Natrun. Dia membawa garam dan tumbuh-tumbuhan di atas keledai-keledainya ke kota.
        ar_eg: كان يا ما كان، كان فيه فلّاح غلبان من وادي النطرون. كان شايل ملح ونباتات على حميره ورايح المدينة.
        ar: كان يا ما كان، فلّاح فقير من وادي النطرون، يحمل الملح والنباتات على حميره متّجهًا إلى المدينة.
        en: Once upon a time, there was a poor peasant from Wadi Natrun. He carried salt and plants on his donkeys to the city.
        note:
          ar_eg: «الفلّاح الفصيح» قصة من مصر القديمة (الدولة الوسطى). الفلّاح خون-إنبو ماشي من وادي الملح (وادي النطرون) لهيراكليوبوليس عشان يبيع ويجيب أكل لعيلته.
          ar: «الفلّاح الفصيح» قصة من مصر القديمة (الدولة الوسطى)، بطلها الفلّاح خون-إنبو الذي سار من وادي الملح (وادي النطرون) إلى إهناسيا ليبيع ويشتري طعامًا لأسرته.
          en: The Eloquent Peasant is an ancient Egyptian tale from the Middle Kingdom. The peasant Khun-Anup travels from the Field of Salt (Wadi Natrun) to Herakleopolis to trade for food for his family.
      - speaker: Hagga Fatma
        text: Di jalan, seorang pegawai yang sangat serakah menutup jalan dengan kain. Keledai si petani makan sedikit gandum, lalu pegawai itu mengambil semua keledainya!
        ar_eg: في السكة، موظف طمّاع جدًا قفل الطريق بقماشة. حمار الفلّاح كل شوية قمح، فالموظف ده خد كل الحمير!
        ar: في الطريق سدّ موظف شديد الجشع الطريقَ بقطعة قماش. فأكل حمار الفلّاح قليلًا من القمح، فاستولى ذلك الموظف على حميره كلّها!
        en: On the way, a very greedy official blocked the path with a cloth. The peasant's donkey ate a little grain, and the official took all his donkeys!
        note:
          ar_eg: في الإندونيسي الوصف بييجي بعد الاسم، زي العربي - seorang pegawai yang sangat serakah = «موظف جشع جدًا». بس العدد والمميّز (seorang) بييجوا الأول.
          ar: في الإندونيسية تأتي الصفة بعد الموصوف كالعربية - seorang pegawai yang sangat serakah = «موظف شديد الجشع». أمّا العدد والمميّز (seorang) فيتقدّمان.
          en: Indonesian puts description after the noun, like Arabic - seorang pegawai yang sangat serakah, "a very greedy official". But the number + classifier (seorang) comes first.
      - speaker: Nadia
        text: Kasihan! Terus dia diam aja?
        ar_eg: يا حرام! وبعدين سكت؟
        ar: يا للمسكين! وهل سكت؟
        en: Poor man! So did he just keep quiet?
        note:
          ar_eg: terus = lalu (وبعدين)، aja = saja - كلام كل يوم. وdiam = ساكت.
          ar: terus = lalu (ثمّ)، aja = saja في الكلام اليومي. وdiam = صامت.
          en: terus = lalu (and then), aja = saja - everyday speech. diam = quiet, silent.
      - speaker: Hagga Fatma
        text: Nggak! Dia mengadu kepada pejabat tinggi. Kata-katanya indah sekali, sampai raja ingin mendengarnya lagi dan lagi.
        ar_eg: لأ! اشتكى لموظف كبير. وكلامه كان حلو أوي، لدرجة إن الملك عايز يسمعه تاني وتالت.
        ar: كلّا! اشتكى إلى كبير الموظفين. وكان كلامه بليغًا حتى إنّ الملك أراد أن يسمعه مرّة بعد مرّة.
        en: No! He complained to a high official. His words were so beautiful that the king wanted to hear them again and again.
      - speaker: Hagga Fatma
        text: Sembilan kali dia mengadu! Diam-diam, raja mengirim makanan untuk keluarganya. Akhirnya keadilan menang, dan petani itu mendapat kembali semua keledainya.
        ar_eg: تسع مرات اشتكى! والملك من غير ما حدّ يعرف بعت أكل لعيلته. وفي الآخر العدل انتصر، والفلّاح رجعتله كل حميره.
        ar: اشتكى تسع مرات! وكان الملك يرسل سرًّا طعامًا لأسرته. وفي النهاية انتصر العدل واستعاد الفلّاح حميره كلّها.
        en: Nine times he made his plea! Secretly, the king sent food to his family. In the end justice won, and the peasant got all his donkeys back.
      - speaker: Sari
        text: Amanatnya, orang kecil juga harus berani bersuara. Kayak Bayu sama suratnya!
        ar_eg: والعبرة إن الناس الغلابة كمان لازم يتكلّموا ويطالبوا بحقّهم. زي بايو والجواب بتاعه!
        ar: والعبرة أنّ البسطاء أيضًا عليهم أن يرفعوا أصواتهم بشجاعة. مثل بايو ورسالته!
        en: The moral is, ordinary people should dare to speak up too. Like Bayu and his letter!
        note:
          ar_eg: عناصر الحدّوتة - tokoh (الشخصيات)، latar (المكان والزمان)، alur (الأحداث)، وamanat (العبرة). وamanat أصلها عربي - «أمانة»، يعني الرسالة اللي القصة شايلاها. وkayak = seperti (زي).
          ar: عناصر الحكاية - tokoh (الشخصيات)، latar (الزمان والمكان)، alur (الحبكة)، وamanat (المغزى). وأصل amanat عربي - «أمانة»، أي الرسالة التي تحملها القصة.
          en: 'A tale''s elements: tokoh (characters), latar (setting), alur (plot) and amanat (moral). amanat comes from Arabic أمانة, "a trust" - the message a story carries. kayak = seperti (like).'
  - setting:
      ar_eg: نفس الليلة. باك بودي قعد على الكنبة وشكله بقى أحسن. دوره يحكي.
      ar: الليلة نفسها. يعتدل باك بودي على الأريكة وقد تحسّن حاله. حان دوره في الحكي.
      en: Same night. Pak Budi sits up on the sofa, looking much better. It's his turn.
    lines:
      - speaker: Pak Budi
        text: Sekarang giliran Bapak. Ini cerita rakyat dari Jawa, "Ande-Ande Lumut".
        ar_eg: دلوقتي دوري. دي حدّوتة شعبية من جاوة، «آندي آندي لوموت».
        ar: الآن دوري. هذه حكاية شعبية من جاوة، «آندي آندي لوموت».
        en: Now it's my turn. This is a folk tale from Java, "Ande-Ande Lumut".
      - speaker: Pak Budi
        text: Ada seorang pemuda tampan bernama Ande-Ande Lumut. Dia mencari istri, dan banyak gadis datang, termasuk tiga kakak beradik yang cantik.
        ar_eg: كان فيه شاب حلو اسمه آندي آندي لوموت. كان بيدوّر على عروسة، وبنات كتير جم، منهم تلات أخوات حلوين.
        ar: كان هناك شاب وسيم اسمه آندي آندي لوموت يبحث عن زوجة، فجاءت فتيات كثيرات، منهنّ ثلاث أخوات جميلات.
        en: There was a handsome young man called Ande-Ande Lumut. He was looking for a wife, and many girls came, among them three beautiful sisters.
      - speaker: Pak Budi
        text: Untuk sampai ke rumahnya, mereka harus menyeberangi sungai yang lebar. Di sana ada seekor kepiting raksasa bernama Yuyu Kangkang.
        ar_eg: عشان يوصلوا لبيته، لازم يعدّوا نهر عريض. وهناك كان فيه كابوريا عملاقة اسمها يويو كانكانج.
        ar: وليصلن إلى بيته كان عليهنّ عبور نهر عريض، وفيه سلطعون عملاق اسمه يويو كانكانغ.
        en: To reach his house, they had to cross a wide river. There lived a giant crab called Yuyu Kangkang.
        note:
          ar_eg: seekor (للحيوانات) وseorang (للناس) وsebuah (للحاجات) - مميّزات العدد. زي ما بنقول «راس غنم» أو «نفر».
          ar: seekor (للحيوان) وseorang (للإنسان) وsebuah (للأشياء) مميّزات للعدد، كقولنا «رأس من الغنم».
          en: seekor (animals), seorang (people) and sebuah (things) are classifiers, a bit like "head" in "three head of cattle".
      - speaker: Pak Budi
        text: Yuyu Kangkang mau menyeberangkan mereka, tapi minta dicium dulu. Tiga kakak itu mau!
        ar_eg: يويو كانكانج كان مستعدّ يعدّيهم، بس طلب بوسة الأول. والتلات أخوات وافقوا!
        ar: وافق يويو كانكانغ على أن يعبر بهنّ، لكنه طلب قبلة أولًا. فقبلت الأخوات الثلاث!
        en: Yuyu Kangkang offered to carry them across, but asked for a kiss first. The three sisters agreed!
      - speaker: Nadia
        text: Iih! Nyium kepiting?
        ar_eg: يععع! يبوسوا كابوريا؟
        ar: ياه! يقبّلن سلطعونًا؟
        en: Ew! Kissing a crab?
        note:
          ar_eg: nyium = mencium (يبوس) - في الكلام me- بتقع. وkepiting = كابوريا.
          ar: nyium = mencium (يُقبّل) - تسقط me- في الكلام. وkepiting = سلطعون.
          en: nyium = mencium (to kiss) - speech drops the me-. kepiting = crab.
      - speaker: Pak Budi
        text: Tapi adik mereka yang paling kecil, Kleting Kuning, nggak mau. Dia memukul sungai dengan sebatang lidi sakti, dan Yuyu Kangkang lari ketakutan.
        ar_eg: بس أختهم الصغيرة، كليتينج كونينج، رفضت. ضربت النهر بعود سحري من جريد النخل، ويويو كانكانج هرب من الخوف.
        ar: لكنّ أختهنّ الصغرى، كليتينغ كونينغ، رفضت. ضربت النهر بعود سحري من عرق سعف النخيل، ففرّ يويو كانكانغ مذعورًا.
        en: But their youngest sister, Kleting Kuning, refused. She struck the river with a magic palm-leaf stick, and Yuyu Kangkang fled in terror.
      - speaker: Sari
        text: Terus, Ande-Ande Lumut milih siapa?
        ar_eg: وبعدين آندي آندي لوموت اختار مين؟
        ar: ثمّ مَن اختار آندي آندي لوموت؟
        en: So who did Ande-Ande Lumut choose?
        note:
          ar_eg: milih = memilih (يختار) في الكلام.
          ar: milih = memilih (يختار) في الكلام اليومي.
          en: milih = memilih (to choose) in everyday speech.
      - speaker: Pak Budi
        text: Kleting Kuning, gadis yang sederhana tapi jujur. Ternyata Ande-Ande Lumut adalah seorang pangeran yang menyamar!
        ar_eg: كليتينج كونينج، البنت البسيطة بس الصادقة. وطلع آندي آندي لوموت أمير متنكّر!
        ar: كليتينغ كونينغ، الفتاة البسيطة الصادقة. وتبيّن أنّ آندي آندي لوموت أمير متنكّر!
        en: Kleting Kuning, the simple but honest girl. And it turned out Ande-Ande Lumut was a prince in disguise!
        note:
          ar_eg: آندي آندي لوموت جزء من حواديت «بانجي» الجاوية - الأمير بانجي متنكّر بيدوّر على حبيبته اللي اتفرّقوا. والحدّوتة مشهورة جدًا في جاوة الشرقية.
          ar: آندي آندي لوموت جزء من حكايات «بانجي» الجاوية، وفيها الأمير بانجي متنكّرًا يبحث عن حبيبته التي فرّقتهما الأقدار. والحكاية مشهورة جدًّا في جاوة الشرقية.
          en: Ande-Ande Lumut belongs to the Javanese Panji tales, in which Prince Panji, in disguise, searches for his lost beloved. It's especially loved in East Java.
      - speaker: Bu Rahayu
        text: Amanatnya, jangan menilai orang dari penampilannya. Sama jangan mau dicium kepiting!
        ar_eg: العبرة إنك متحكمش على الناس من شكلهم. ومتوافقيش تبوسي كابوريا!
        ar: والمغزى ألّا تحكم على الناس من مظهرهم. وألّا تقبلي تقبيل سلطعون!
        en: The moral is, don't judge people by their looks. And never agree to kiss a crab!
      - speaker: Nadia
        text: Pangeran yang menyamar... Sari, siapa tahu ada pangeran yang menyamar jadi pemandu wisata di dekatmu?
        ar_eg: أمير متنكّر... يا ساري، يمكن فيه أمير متنكّر في شكل مرشد سياحي قريّب منك؟
        ar: أمير متنكّر... يا ساري، لعلّ هناك أميرًا متنكّرًا في هيئة مرشد سياحي قريبًا منكِ؟
        en: A prince in disguise... Sari, maybe there's a prince disguised as a tour guide somewhere near you?
      - speaker: Sari
        text: Nadia! Apa sih!
        ar_eg: نادية! بطّلي بقى!
        ar: نادية! كفى!
        en: Nadia! Stop it!
