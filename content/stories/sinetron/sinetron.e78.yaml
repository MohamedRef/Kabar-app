series: sinetron
episode: 78
language: jv
level: j2
unlock_after: j2.u01
title:
  target: Kulawargane Pak Budi
  ar_eg: عيلة پاك بودي
  ar: عائلة باك بودي
  en: Pak Budi's family
summary:
  ar_eg: كريم بيوصل الوارونج في ماديون، والعيلة كلها بتستقبله بالجاوي. پاك بودي بيعرّفه على صور العيلة على الحيطة - الجدّ، العمّ، الخالة - وساري بتكلّمهم فيديو من القاهرة. كريم بيتعلّم إن «بتاع» بالجاوي حرف واحد - e.
  ar: يصل كريم إلى الوارونغ في ماديون، وتستقبله العائلة كلّها بالجاوية. يعرّفه باك بودي على صور العائلة على الجدار - الجدّ والعمّ والخالة - وتتّصل ساري بالفيديو من القاهرة. ويتعلّم كريم أنّ الملكية بالجاوية حرف واحد - e.
  en: Karim arrives at the warung in Madiun, and the whole family greets him in Javanese. Pak Budi shows him the family photos on the wall - grandfather, uncle, aunt - and Sari video-calls from Cairo. Karim learns that "of" in Javanese is a single letter - e.
cast: [Karim, Pak Budi, Bu Rahayu, Bayu, Mas Joko, Sari]
scenes:
  - setting:
      ar_eg: وارونج پاك بودي في ماديون، العصر. ريحة صلصة الفول السوداني. على الحيطة صور قديمة بالأبيض والأسود.
      ar: وارونغ باك بودي في ماديون، عصرًا. رائحة صلصة الفول السوداني. وعلى الجدار صور قديمة بالأبيض والأسود.
      en: Pak Budi's warung in Madiun, mid-afternoon. The smell of peanut sauce. Old black-and-white photos on the wall.
    lines:
      - speaker: Pak Budi
        text: Karim! Sugeng rawuh neng Madiun! Piye kabare?
        ar_eg: كريم! أهلًا بيك في ماديون! عامل إيه؟
        ar: كريم! أهلًا بك في ماديون! كيف حالك؟
        en: Karim! Welcome to Madiun! How are you?
        note:
          ar_eg: "كلمات: rawuh = ييجي / يوصل (krama inggil؛ ngoko teka، krama dhateng)."
          ar: "مفردات: rawuh = يأتي / يصل (krama inggil؛ ngoko teka، وkrama dhateng)."
          en: "Words: rawuh = come, arrive (krama inggil; ngoko teka, krama dhateng) = datang."
      - speaker: Karim
        text: Apik, Pak! Aku saiki sinau basa Jawa.
        ar_eg: كويس يا پاك! أنا بتعلّم جاوي دلوقتي.
        ar: بخير يا باك! أنا أتعلّم الجاوية الآن.
        en: Good, Pak! I'm learning Javanese now.
      - speaker: Bu Rahayu
        text: Wah, pinter! Iki Bayu, anakku sing ragil. Lan iki Mas Joko.
        ar_eg: يا سلام، شاطر! ده بايو، ابني الصغيّر. وده ماس جوكو.
        ar: رائع، ذكيّ! هذا بايو، ابني الأصغر. وهذا ماس جوكو.
        en: Oh, clever! This is Bayu, my youngest. And this is Mas Joko.
        note:
          ar_eg: ragil = آخر العنقود، أصغر واحد في الإخوات. وsing = «اللي».
          ar: ragil = أصغر الأبناء، آخر العنقود. وsing = «الذي».
          en: ragil = the youngest child. sing = "who, that".
      - speaker: Mas Joko
        text: Ahlan, Mas Karim! Kopine tak gawekne, ya?
        ar_eg: أهلًا يا ماس كريم! أعملّك القهوة بتاعتك؟
        ar: أهلًا يا ماس كريم! أُعدّ لك قهوتك؟
        en: Ahlan, Mas Karim! Shall I make you a coffee?
      - speaker: Karim
        text: Pak, iki fotone sapa?
        ar_eg: يا پاك، الصورة دي بتاعة مين؟
        ar: يا باك، صورة من هذه؟
        en: Pak, whose photo is this?
        note:
          ar_eg: الإضافة -e (أو -ne بعد حرف متحرّك) معناها «بتاع». foto + -ne = fotone، «صورة (فلان)». وomah + -e = omahe، «بيت (فلان)».
          ar: اللاحقة -e (أو -ne بعد حرف صائت) تعني الملكية. foto + -ne = fotone أي «صورة (فلان)». وomah + -e = omahe أي «بيت (فلان)».
          en: The suffix -e (or -ne after a vowel) means "of, 's". foto + -ne = fotone, "the photo of". omah + -e = omahe, "the house of".
      - speaker: Pak Budi
        text: Iku bapakku, simbahe Bayu. Lan iki pakdhe lan budhe saka Ponorogo.
        ar_eg: ده أبويا، جدّ بايو. ودول عمّي الكبير ومراته من پونوروجو.
        ar: هذا أبي، جدّ بايو. وهذان عمّي الأكبر وزوجته من بونوروغو.
        en: That's my father, Bayu's grandfather. And these are my uncle and aunt from Ponorogo.
        note:
          ar_eg: simbah = جدّ أو جدّة. pakdhe = أخو الأب أو الأم الأكبر، وbudhe = أخته الكبيرة أو مرات pakdhe. والأصغر من الأب = paklik وbulik.
          ar: simbah = الجدّ أو الجدّة. pakdhe = أخو الأب أو الأمّ الأكبر، وbudhe = الأخت الكبرى أو زوجة pakdhe. والأصغر سنًّا = paklik وbulik.
          en: simbah = grandparent. pakdhe = a parent's older brother, budhe = a parent's older sister or pakdhe's wife. Younger ones are paklik and bulik.
  - setting:
      ar_eg: التليفون بيرنّ على الترابيزة - ساري، بنت پاك بودي، من القاهرة. الكل بيتلمّ قدّام الشاشة.
      ar: يرنّ الهاتف على الطاولة - إنها ساري، ابنة باك بودي، من القاهرة. يتجمّع الجميع أمام الشاشة.
      en: The phone on the table rings - it's Sari, Pak Budi's daughter, calling from Cairo. Everyone crowds round the screen.
    lines:
      - speaker: Sari
        text: Assalamualaikum! Lho, Karim wis tekan omahe Bapak?
        ar_eg: السلام عليكم! الله، كريم وصل بيت بابا خلاص؟
        ar: السلام عليكم! كريم وصل إلى بيت أبي؟
        en: Assalamu alaikum! Oh, Karim's already at Dad's house?
      - speaker: Bayu
        text: Mbakyu! Mas Karim nggawa oleh-oleh telung kothak!
        ar_eg: يا أبلة! ماس كريم جايب هدايا، تلات علب!
        ar: يا أختي الكبرى! ماس كريم أحضر هدايا، ثلاث علب!
        en: Sis! Mas Karim brought gifts, three boxes!
        note:
          ar_eg: "mbakyu = الأخت الكبيرة (وكمان «يا أبلة» لست أكبر شوية). والأخ الكبير = mas، والأصغر (ولد أو بنت) = adhi. كلمات: nggawa = يجيب / يشيل معاه (نغوكو)."
          ar: "mbakyu = الأخت الكبرى. والأخ الأكبر = mas، والأصغر (ولدًا أو بنتًا) = adhi. مفردات: nggawa = يحمل / يُحضر (نغوكو)."
          en: "mbakyu = older sister. Older brother = mas, and a younger sibling (boy or girl) = adhi. Words: nggawa = bring, carry (ngoko) = membawa."
      - speaker: Sari
        text: Karim, kowe wis kenal kulawargaku kabeh?
        ar_eg: يا كريم، اتعرّفت على عيلتي كلها؟
        ar: يا كريم، هل تعرّفت إلى عائلتي كلّها؟
        en: Karim, have you met my whole family?
        note:
          ar_eg: "كلمات: kabeh = كله / الكل (= semua)."
          ar: "مفردات: kabeh = الكل / جميع (= semua)."
          en: "Words: kabeh = all, everything (= semua)."
      - speaker: Karim
        text: Wis! Bapakmu, ibumu, adhimu Bayu, lan Mas Joko.
        ar_eg: أيوه! أبوكي، وأمّك، وأخوكي الصغيّر بايو، وماس جوكو.
        ar: نعم! أبوكِ، وأمّكِ، وأخوكِ الأصغر بايو، وماس جوكو.
        en: Yes! Your dad, your mum, your little brother Bayu, and Mas Joko.
      - speaker: Mas Joko
        text: Aku dudu kulawarga, Mbak. Aku mung tukang kopi.
        ar_eg: أنا مش من العيلة يا مدام. أنا بس بتاع القهوة.
        ar: لستُ من العائلة يا سيدتي. أنا مجرّد صانع القهوة.
        en: I'm not family, Sari. I'm just the coffee guy.
      - speaker: Bu Rahayu
        text: Ora, Jok. Kowe ya kulawarga.
        ar_eg: لأ يا جوكو. انت كمان من العيلة.
        ar: لا يا جوكو. أنت أيضًا من العائلة.
        en: No, Jok. You're family too.
      - speaker: Narrator
        text: Kaca wolu. Bapak, ibu, mbakyu, adhi, simbah, pakdhe, budhe. Lan omahe, fotone.
        ar_eg: صفحة تمانية. أب، أمّ، أخت كبيرة، أخ صغيّر، جدّ، عمّ كبير، عمّة كبيرة. وبيته، وصورته.
        ar: الصفحة الثامنة. أب، أمّ، أخت كبرى، أخ أصغر، جدّ، عمّ أكبر، عمّة كبرى. وبيته، وصورته.
        en: Page eight. Father, mother, older sister, younger sibling, grandparent, uncle, aunt. And his house, his photo.
        note:
          ar_eg: "كلمات: kaca = صفحة."
          ar: "مفردات: kaca = صفحة."
          en: "Words: kaca = page (of a book)."
new_words:
  - word: simbah
    pos: noun
    ar_eg: جدّ / جدّة
    ar: جدّ / جدّة
    en: grandparent
  - word: pakdhe
    pos: noun
    ar_eg: العمّ أو الخال الأكبر من الأب أو الأم
    ar: العمّ أو الخال الأكبر سنًّا من الوالد
    en: uncle (older than your parent)
  - word: budhe
    pos: noun
    ar_eg: العمّة أو الخالة الكبيرة
    ar: العمّة أو الخالة الكبرى
    en: aunt (older than your parent)
  - word: mbakyu
    pos: noun
    ar_eg: الأخت الكبيرة
    ar: الأخت الكبرى
    en: older sister
  - word: adhi
    pos: noun
    ar_eg: الأخ أو الأخت الأصغر
    ar: الأخ أو الأخت الأصغر
    en: younger sibling
  - word: ragil
    pos: noun
    ar_eg: آخر العنقود
    ar: أصغر الأبناء
    en: youngest child
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: بايو بالنسبة لبو راهايو إيه؟
      ar: ما صلة بايو ببو راهايو؟
      en: Who is Bayu to Bu Rahayu?
    options: ["anake sing ragil", "pakdhene", "adhine"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Pak, iki ___ sapa?
    meaning:
      ar_eg: يا پاك، الصورة دي بتاعة مين؟
      ar: يا باك، صورة من هذه؟
      en: Pak, whose photo is this?
    answers: [fotone]
    options: ["fotone", "foto", "fotoku"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: بايو بينادي أخته الكبيرة ساري بإيه؟
      ar: بماذا ينادي بايو أخته الكبرى ساري؟
      en: What does Bayu call his older sister Sari?
    options: ["Adhi", "Mbakyu", "Budhe"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Kowe ya kulawarga.
    answers_meaning:
      ar_eg: ["انت كمان من العيلة.", "انت برضه من العيلة."]
      ar: ["أنت أيضًا من العائلة."]
      en: ["You're family too.", "You are family as well."]
next:
  ar_eg: بو راهايو بتبعت كريم وجوكو كاروبان يدوقوا أحسن پيچل في الدنيا... عند بو دارمي. بس الپيچل بيتطلب إزاي؟
  ar: ترسل بو راهايو كريمًا وجوكو إلى كاروبان ليتذوّقا أفضل بيتشل في الدنيا... عند بو دارمي. لكن كيف يُطلب البيتشل؟
  en: Bu Rahayu sends Karim and Joko to Caruban to try the best pecel in the world... at Bu Darmi's. But how do you order pecel?
review:
  status: draft
  verified: false
  notes: Kinship terms follow j2.u01. Javanese use inside the family suits the cast notes (Bu Rahayu speaks Javanese at home). Pakdhe/budhe from Ponorogo are background only.
