title:
  target: Piring yang Tersisa
  ar_eg: الطبق اللي فاضل
  ar: الطبق المتبقّي
  en: The Plate Left Over
summary:
  ar_eg: بايو بدأ الجامعة في ميدان، وبيكتب قصة قصيرة لمسابقة الكلية عن وارونج أبوه. كاك تيور، طالبة باتاك صريحة جدًا، بتعلّمه إن أحلى حاجة في القصة هي اللي متتقالش. وفي مكالمة فيديو العيلة، ساري بتردّ على سؤال مهمّ... من غير ما تقول «أيوه».
  ar: يبدأ بايو دراسته الجامعية في ميدان، ويكتب قصة قصيرة لمسابقة الكلية عن وارونغ أبيه. وتعلّمه كاك تيور، الطالبة الباتاكية الصريحة جدًّا، أنّ أجمل ما في القصة ما لا يُقال. وفي اتصال العائلة المرئي تجيب ساري عن سؤال مهمّ... دون أن تقول «نعم».
  en: Bayu starts university in Medan and writes a short story about his father's warung for a campus contest. Kak Tiur, a very blunt Batak student, teaches him that the best part of a story is what goes unsaid. And on the family video call, Sari answers an important question... without saying "yes".
cast: [Kak Tiur, Bayu, Pak Budi, Bu Rahayu, Sari, Karim]
scenes:
  - setting:
      ar_eg: قهوة صغيرة جنب الجامعة في ميدان، بالليل. بايو قاعد قدّام اللابتوب، وقدّامه كاك تيور، طالبة في سنة تالتة ومسؤولة نادي الكتابة في الكلية.
      ar: مقهى صغير قرب الجامعة في ميدان، ليلًا. يجلس بايو أمام حاسوبه، وأمامه كاك تيور، طالبة في السنة الثالثة ومسؤولة نادي الكتابة في الكلية.
      en: A small coffee shop near campus in Medan, at night. Bayu sits at his laptop, across from Kak Tiur, a third-year student who runs the faculty writing club.
    lines:
      - speaker: Narrator
        text: Sudah dua minggu Bayu kuliah di Prodi Ilmu Komunikasi di Medan. Di jalan, dia mendengar bahasa Batak, Melayu, Hokkien, Jawa, dan Tamil, kadang-kadang dalam satu angkot.
        ar_eg: بقاله أسبوعين بايو بيدرس إعلام في ميدان. وهو ماشي في الشارع بيسمع باتاك وملايو وهوكيين وجاوي وتاميل، وساعات كلّه في ميكروباص واحد.
        ar: مضى أسبوعان على دراسة بايو الإعلام في ميدان. وفي الشوارع يسمع الباتاكية والملايوية والهوكيينية والجاوية والتاميلية، وأحيانًا في حافلة صغيرة واحدة.
        en: Bayu has been studying Communication in Medan for two weeks. On the streets he hears Batak, Malay, Hokkien, Javanese and Tamil, sometimes all in one minibus.
        note:
          ar_eg: ميدان أكبر مدينة في سومطرة، وفيها خليط - الباتاك، والملايو، والصينيين (وكتير منهم بيتكلّموا هوكيين)، والهنود التاميل، والجاويين اللي جدودهم اشتغلوا في مزارع الدخان زمان. وangkot هو الميكروباص الصغير.
          ar: ميدان كبرى مدن سومطرة، وفيها مزيج - الباتاك والملايو والصينيون (وكثير منهم يتكلّم الهوكيينية) والهنود التاميل والجاويون الذين عمل أجدادهم في مزارع التبغ قديمًا. وangkot حافلة صغيرة للنقل العام.
          en: Medan, Sumatra's biggest city, is a mix of Batak, Malay, Chinese (many speak Hokkien), Tamil Indians and Javanese whose grandparents came to work the old tobacco plantations. An angkot is a shared minibus.
      - speaker: Kak Tiur
        text: Jadi kau mau ikut lomba cerpen kampus, Dek? Tenggatnya hari Jumat. Pesertanya banyak kali, lho.
        ar_eg: يعني انت عايز تدخل مسابقة القصة القصيرة بتاعة الجامعة يا صغيّر؟ آخر ميعاد يوم الجمعة. والمشتركين كتير أوي على فكرة.
        ar: إذن تريد المشاركة في مسابقة القصة القصيرة في الجامعة يا صغيري؟ الموعد النهائي يوم الجمعة، والمشاركون كثيرون جدًّا.
        en: So you want to enter the campus short-story contest, kid? The deadline's Friday. There are loads of entries, you know.
        note:
          ar_eg: كلام ميدان - kau (انت) عادي ومش قلّة أدب هناك، وkali بعد الصفة يعني «أوي» (banyak kali = كتير أوي)، وDek (من adik) نداء لحدّ أصغر منك.
          ar: من لهجة ميدان - kau (أنت) مألوفة هناك وليست جافّة، وkali بعد الصفة تعني «جدًّا» (banyak kali = كثير جدًّا)، وDek (من adik) نداء لمن هو أصغر سنًّا.
          en: 'Medan flavour: kau (you) is normal there, not rude; kali after an adjective means "very" (banyak kali = really a lot); Dek (from adik) is how you address someone younger.'
      - speaker: Bayu
        text: Iya, Kak. Judulnya "Warung di Ujung Gang". Tentang warung pecel bapakku di Madiun.
        ar_eg: أيوه يا كاك. اسمها «وارونج في آخر الحارة». عن وارونج البيچيل بتاع أبويا في ماديون.
        ar: نعم يا كاك. عنوانها «وارونغ في آخر الزقاق»، عن وارونغ البيتشيل الخاص بأبي في ماديون.
        en: Yes, Kak. It's called "The Warung at the End of the Lane". It's about my dad's pecel warung in Madiun.
      - speaker: Kak Tiur
        text: Coba bacain paragraf pertamanya. Biar kudengar dulu.
        ar_eg: اقرالي أول فقرة. خليني أسمع الأول.
        ar: اقرأ لي الفقرة الأولى، لأسمعها أوّلًا.
        en: Read me the first paragraph. Let me hear it first.
        note:
          ar_eg: bacain = bacakan (اقرالي بصوت عالي)، وbiar = supaya (عشان) - ده كلام الشارع؛ اللاحقة -in في الكلام بتاخد مكان -kan.
          ar: bacain = bacakan (اقرأ بصوت مسموع)، وbiar = supaya (لكي) - من الكلام اليومي؛ اللاحقة -in في المحادثة تحلّ محلّ -kan.
          en: bacain = bacakan (read out), biar = supaya (so that) - everyday speech; in talk the ending -in replaces -kan.
      - speaker: Bayu
        text: '"Setiap pagi, sebelum azan subuh selesai, Bapak sudah menyalakan kompor. Di ujung meja, ia selalu menyisakan satu piring pecel. Piring itu tidak pernah dijual."'
        ar_eg: «كل يوم الصبح، قبل ما أدان الفجر يخلص، أبويا بيكون ولّع البوتاجاز. وفي آخر الترابيزة، دايمًا بيسيب طبق بيچيل واحد. الطبق ده عمره ما اتباع.»
        ar: «كلّ صباح، قبل أن ينتهي أذان الفجر، يكون أبي قد أشعل الموقد. وفي طرف الطاولة يترك دائمًا طبقًا واحدًا من البيتشيل. ذلك الطبق لم يُبَع قطّ.»
        en: '"Every morning, before the dawn call to prayer was over, Father had already lit the stove. At the end of the table he always left one plate of pecel. That plate was never sold."'
      - speaker: Kak Tiur
        text: Bagus kali! Nah, untuk siapa piring itu?
        ar_eg: حلوة أوي! طب، الطبق ده لمين؟
        ar: رائعة جدًّا! حسنًا، لمن ذلك الطبق؟
        en: That's really good! So, who's the plate for?
      - speaker: Bayu
        text: Buat kakakku yang dulu kuliah di Kairo. Bapak kangen, tapi nggak pernah bilang. Jadi di kalimat berikutnya aku tulis, "Piring itu untuk Mbak Sari, karena Bapak rindu."
        ar_eg: لأختي اللي كانت بتدرس في القاهرة. أبويا كان وحشته، بس عمره ما قال. فكتبت في الجملة اللي بعدها - «الطبق ده لساري، عشان أبويا وحشته.»
        ar: لأختي التي كانت تدرس في القاهرة. كان أبي يشتاق إليها لكنه لم يقل ذلك قطّ. فكتبت في الجملة التالية - «ذلك الطبق لساري، لأنّ أبي يشتاق إليها.»
        en: For my sister, who used to study in Cairo. Dad missed her but never said so. So in the next sentence I wrote, "The plate was for Sari, because Father missed her."
        note:
          ar_eg: bilang = berkata (يقول)، وفي الكلام بنقول tulis بدل menulis (أكتب). وBayu بيتكلّم عادي (buat، kangen) لكن جملة القصة نفسها مكتوبة فصيح (untuk، rindu).
          ar: bilang = berkata (يقول)، وفي المحادثة يُقال tulis بدل menulis. يتكلّم بايو بالعامّية (buat، kangen) لكنّ جملة القصة مكتوبة بالفصحى (untuk، rindu).
          en: bilang = berkata (to say); in speech tulis stands in for menulis. Bayu talks casually (buat, kangen) but the sentence of his story is written standard (untuk, rindu).
      - speaker: Kak Tiur
        text: Hapus! Jangan kau tulis itu. Biar pembaca yang menebak. Cerpen yang bagus itu seperti orang Jawa, Dek. Banyak yang tersirat, sedikit yang tersurat.
        ar_eg: امسحها! متكتبش كده. خلّي القارئ هو اللي يخمّن. القصة القصيرة الحلوة زي الجاويين يا صغيّر - كلام كتير بين السطور، وقليل مكتوب صريح.
        ar: احذفها! لا تكتب ذلك. دع القارئ يخمّن. القصة القصيرة الجيّدة كالجاويين يا صغيري - كثير ممّا بين السطور، وقليل ممّا هو مصرّح به.
        en: Delete it! Don't write that. Let the reader guess. A good short story is like the Javanese, kid. Lots between the lines, very little spelled out.
        note:
          ar_eg: tersurat يعني «مكتوب صريح» (من surat = جواب / حاجة مكتوبة)، وtersirat يعني «متخبّي بين السطور». makna tersirat هو المعنى الضمني - اللي القارئ بيفهمه لوحده. وhapus يعني «امسح» (من menghapus). وbiar = supaya (خلّي)، tulis = menulis.
          ar: tersurat تعني «المصرّح به كتابةً» (من surat أي الرسالة المكتوبة)، وtersirat تعني «المضمَر بين السطور». وmakna tersirat هو المعنى الضمني الذي يستنتجه القارئ بنفسه. وhapus تعني «احذف» (من menghapus). وbiar = supaya (دَع/لكي)، وtulis = menulis.
          en: tersurat means "spelled out in writing" (from surat, a letter); tersirat means "implied, between the lines". makna tersirat is the implicit meaning the reader works out alone. hapus = delete (spoken for menghapus). biar = supaya (let, so that), tulis = menulis.
      - speaker: Bayu
        text: Wah, Kak Tiur kan orang Batak, tapi paham banget soal orang Jawa.
        ar_eg: ياه، انتي باتاك يا كاك تيور، بس فاهمة الجاويين كويس أوي.
        ar: عجبًا، أنتِ باتاكية يا كاك تيور، لكنكِ تفهمين الجاويين جيّدًا.
        en: Wow, you're Batak, Kak Tiur, but you really get the Javanese.
      - speaker: Kak Tiur
        text: Kalau ngomong, orang Batak memang lurus-lurus aja. Tapi kalau nulis, kami juga bisa halus. Satu lagi. Tokoh bapakmu terlalu sempurna. Kasih dia satu kekurangan.
        ar_eg: في الكلام، الباتاك دغري على طول. بس في الكتابة نعرف نبقى رقاق برضه. وحاجة كمان. شخصية أبوك كاملة زيادة عن اللزوم. ادّيله عيب واحد.
        ar: في الكلام يكون الباتاك صريحين مباشرين. لكننا في الكتابة نعرف الرقّة أيضًا. وشيء آخر - شخصية أبيك كاملة أكثر من اللازم. امنحها عيبًا واحدًا.
        en: When we talk, Batak people are straight to the point. But when we write, we can be subtle too. One more thing. Your dad's character is too perfect. Give him one flaw.
        note:
          ar_eg: ngomong = berbicara (يتكلّم)، nulis = menulis (يكتب)، kasih = beri (يدّي) - كلام كل يوم. وhalus هنا يعني «رقيق، غير مباشر».
          ar: ngomong = berbicara (يتكلّم)، nulis = menulis (يكتب)، kasih = beri (يعطي) - من الكلام اليومي. وhalus هنا «رقيق غير مباشر».
          en: ngomong = berbicara (to talk), nulis = menulis (to write), kasih = beri (to give) - everyday speech. halus here means subtle, gentle.
      - speaker: Bayu
        text: Kekurangan? Hmm... Bapakku selalu bilang udah minum obat, padahal belum.
        ar_eg: عيب؟ همم... أبويا دايمًا يقول إنه خد الدوا، وهو لسه ماخدوش.
        ar: عيب؟ همم... يقول أبي دائمًا إنه أخذ الدواء، والحقيقة أنه لم يأخذه.
        en: A flaw? Hmm... My dad always says he's taken his medicine when he hasn't.
        note:
          ar_eg: udah = sudah (خلاص/بالفعل)، وbilang = berkata (يقول) - في الكلام العادي.
          ar: udah = sudah (قد/بالفعل)، وbilang = berkata (يقول) - في الكلام اليومي.
          en: udah = sudah (already), bilang = berkata (to say) - everyday speech.
      - speaker: Kak Tiur
        text: Nah, itu dia! Tokoh jadi hidup karena kekurangannya.
        ar_eg: أهو ده بالظبط! الشخصية بتبقى حيّة بعيوبها.
        ar: هذا هو بالضبط! تدبّ الحياة في الشخصية بفضل عيوبها.
        en: That's it! A character comes alive through their flaws.
        note:
          ar_eg: nah = «أهو!/طب» - بتتقال لما توصل للنقطة المهمّة.
          ar: nah = «ها هو!» - تُقال عند بلوغ النقطة المهمّة.
          en: nah = "there you go!" / "so" - said when you reach the key point.
      - speaker: Narrator
        text: Malam itu Bayu menulis ulang cerpennya sampai jam dua pagi. Di sebelah laptopnya, sepotong bika ambon belum disentuh.
        ar_eg: الليلة دي بايو كتب القصة من الأول لحد الساعة ٢ الفجر. وجنب اللابتوب، حتّة بيكا أمبون محدّش لمسها.
        ar: في تلك الليلة أعاد بايو كتابة قصّته حتى الثانية فجرًا. وبجانب حاسوبه قطعة من كعكة بيكا أمبون لم تُمسّ.
        en: That night Bayu rewrote his story until two in the morning. Beside his laptop, a slice of bika ambon cake sat untouched.
  - setting:
      ar_eg: يوم الحد بالليل. مكالمة فيديو بأربع شاشات - پاك بودي وبو راهايو في ماديون، وساري في باليكپاپان، وبايو في أوضته في ميدان.
      ar: مساء الأحد. اتصال مرئي بأربع نوافذ - باك بودي وبو راهايو في ماديون، وساري في باليكبابان، وبايو في غرفته بميدان.
      en: Sunday evening. A four-way video call - Pak Budi and Bu Rahayu in Madiun, Sari in Balikpapan, Bayu in his room in Medan.
    lines:
      - speaker: Pak Budi
        text: Anak-anak, Bapak sama Ibu udah berembuk. Mas Karim minta izin, biar keluarganya boleh datang melamar.
        ar_eg: يا ولاد، أنا وأمّكم اتشاورنا. ماس كريم طالب الإذن إن أهله ييجوا يطلبوا إيد ساري.
        ar: يا أولادي، تشاورتُ أنا وأمّكم. لقد طلب ماس كريم الإذن بأن تأتي أسرته لخطبة ساري.
        en: Children, your mum and I have talked it over. Mas Karim has asked permission for his family to come and propose.
        note:
          ar_eg: udah = sudah، sama = dan (و)، biar = supaya (عشان) - كلام البيت.
          ar: udah = sudah، وsama = dan (و)، وbiar = supaya (لكي) - من كلام البيت.
          en: udah = sudah (already), sama = dan (and), biar = supaya (so that) - home talk.
      - speaker: Bu Rahayu
        text: Tapi yang mau menikah kan bukan Bapak. Jadi, Nduk, gimana menurutmu?
        ar_eg: بس اللي هيتجوّز مش انت يا بودي. فإيه رأيك انتي يا بنتي؟
        ar: لكنّ الذي سيتزوّج ليس أنت يا باك. فما رأيكِ يا ابنتي؟
        en: But you're not the one getting married, Pak. So, sweetheart, what do you think?
      - speaker: Narrator
        text: Sari diam sebentar. Wajahnya memerah.
        ar_eg: ساري سكتت شوية. ووشّها احمرّ.
        ar: صمتت ساري لحظة، واحمرّ وجهها.
        en: Sari is quiet for a moment. Her face goes red.
      - speaker: Sari
        text: Bu... kebaya hijauku yang dari Lebaran itu masih ada di lemari, kan? Tolong dicuci, ya.
        ar_eg: يا ماما... الكبايا الخضرا بتاعتي اللي من العيد لسه في الدولاب، صح؟ ابقي اغسليها بالله عليكي.
        ar: يا أمي... ثوب الكبايا الأخضر الذي لبسته في العيد ما زال في الخزانة، أليس كذلك؟ اغسليه من فضلكِ.
        en: Mum... my green kebaya from Lebaran is still in the wardrobe, isn't it? Could you wash it, please?
      - speaker: Pak Budi
        text: Kebaya? Bapak tanya soal Mas Karim, kok jawabnya kebaya?
        ar_eg: كبايا؟ أنا بسأل عن ماس كريم، تقوم تردّي عليّا بالكبايا؟
        ar: كبايا؟ أنا أسأل عن ماس كريم، فكيف يكون الجواب عن الكبايا؟
        en: A kebaya? I ask about Mas Karim, and the answer's about a kebaya?
      - speaker: Bayu
        text: Pak, itu makna tersirat! Kebaya itu buat dipake pas lamaran. Artinya, Mbak Sari mau!
        ar_eg: يا بابا، ده معنى بين السطور! الكبايا دي عشان تلبسها يوم الخطوبة. يعني ساري موافقة!
        ar: يا أبي، هذا معنى ضمني! الكبايا لتلبسها يوم الخطبة، أي أنّ ساري موافقة!
        en: Dad, that's the implied meaning! The kebaya is for wearing at the proposal. It means Sari says yes!
        note:
          ar_eg: dipake = dipakai (يتلبس)، pas = waktu (وقت) - كلام الشارع. وlamaran هي الخطوبة (من lamar = يطلب الإيد).
          ar: dipake = dipakai (يُلبَس)، pas = waktu (حين) - من الكلام اليومي. وlamaran هي الخِطبة (من lamar = يخطب).
          en: dipake = dipakai (to be worn), pas = waktu (when) - everyday speech. lamaran is the proposal (from lamar, to propose).
      - speaker: Bu Rahayu
        text: Bapak lupa, ya? Waktu Bapak melamar dulu, Ibu juga nggak bilang "iya". Ibu cuma bilang, "Teh manisnya diminum dulu, Mas."
        ar_eg: انت نسيت يا بودي؟ لما جيت تطلبني زمان، أنا كمان مقلتش «أيوه». قلت بس - «اشرب الشاي بتاعك الأول يا ماس.»
        ar: أنسيتَ يا باك؟ حين جئت تخطبني قديمًا لم أقل «نعم» أيضًا. قلت فقط - «اشرب شايك المحلّى أوّلًا يا ماس.»
        en: Have you forgotten, Pak? When you proposed, I didn't say "yes" either. I just said, "Drink your sweet tea first, Mas."
        note:
          ar_eg: في الثقافة الجاوية الردّ غير المباشر بيعتبر ذوق وأدب، خصوصًا في المواضيع الحسّاسة. والسامع الشاطر بيفهم من غير ما حدّ يقول. زي عندنا لما العروسة تسكت - «السكوت علامة الرضا». وcuma = hanya (بس)، bilang = berkata (يقول).
          ar: في الثقافة الجاوية يُعدّ الجواب غير المباشر لطفًا وأدبًا، لا سيّما في المسائل الحسّاسة، والسامع الفطن يفهم دون تصريح. وهو قريب من قولنا «السكوت علامة الرضا». وcuma = hanya (فقط)، وbilang = berkata (يقول).
          en: In Javanese culture an indirect answer is a mark of tact, especially on delicate matters - a sharp listener understands without being told. Arabic has a cousin of this - "silence is a sign of consent". cuma = hanya (only), bilang = berkata (to say).
      - speaker: Pak Budi
        text: Jadi teh manis itu artinya "iya"? Bapak baru tahu sekarang, hampir tiga puluh tahun kemudian!
        ar_eg: يعني الشاي بالسكر كان معناه «أيوه»؟ أنا لسه عارف دلوقتي، بعد حوالي تلاتين سنة!
        ar: إذن كان الشاي المحلّى يعني «نعم»؟ لم أعرف ذلك إلا الآن، بعد نحو ثلاثين عامًا!
        en: So the sweet tea meant "yes"? I'm only finding out now, nearly thirty years later!
      - speaker: Sari
        text: Bapak, Ibu... aku mau. Insyaallah.
        ar_eg: بابا، ماما... أنا موافقة. إن شاء الله.
        ar: أبي، أمي... أنا موافقة، إن شاء الله.
        en: Dad, Mum... I say yes. Insyaallah.
      - speaker: Pak Budi
        text: Alhamdulillah. Nah, ini baru tersurat! Bapak telepon Mas Karim sekarang.
        ar_eg: الحمد لله. أهو كده بقى الكلام صريح! هكلّم ماس كريم دلوقتي.
        ar: الحمد لله. هكذا صار الكلام صريحًا! سأتّصل بماس كريم الآن.
        en: Alhamdulillah. Now that's spelled out! I'm calling Mas Karim right now.
      - speaker: Narrator
        text: Lima menit kemudian, Karim bergabung. Dia memakai kemeja batik dan duduk sangat tegak.
        ar_eg: بعد خمس دقايق، كريم دخل المكالمة. لابس قميص باتيك وقاعد مفرود ضهره خالص.
        ar: بعد خمس دقائق انضمّ كريم إلى الاتصال، مرتديًا قميص باتيك وجالسًا منتصب الظهر تمامًا.
        en: Five minutes later, Karim joins. He's wearing a batik shirt and sitting bolt upright.
      - speaker: Pak Budi
        text: Mas Karim, keluarga kami menerima niat baik Mas. Silakan datang bersama keluarga.
        ar_eg: يا ماس كريم، عيلتنا قابلة نيّتك الطيبة. اتفضّل تعالى انت وأهلك.
        ar: يا ماس كريم، تقبل أسرتنا نيّتك الطيبة. تفضّل بالمجيء مع أهلك.
        en: Mas Karim, our family accepts your good intentions. Please come, with your family.
        note:
          ar_eg: niat من العربي «نيّة». وniat baik (النيّة الطيبة) هي الكلمة المؤدّبة اللي بتتقال عن طلب الجواز في إندونيسيا.
          ar: niat من العربية «نيّة»، وniat baik (النيّة الطيّبة) هي العبارة المهذّبة التي يُشار بها إلى طلب الزواج في إندونيسيا.
          en: niat is from Arabic نيّة (intention). niat baik, "good intentions", is the polite Indonesian way to refer to a marriage request.
      - speaker: Karim
        text: Matur nuwun sanget, Pak. Bapak lan Ibu kula badhe dhateng saking Mesir.
        ar_eg: (بالجاوي المؤدّب) متشكّر جدًا يا پاك. أبويا وأمّي هييجوا من مصر.
        ar: (بالجاوية المهذّبة) شكرًا جزيلًا يا باك. سيأتي أبي وأمي من مصر.
        en: (in polite Javanese) Thank you so much, Pak. My father and mother will come from Egypt.
      - speaker: Bayu
        text: Mas Karim, krama-mu makin lancar aja! Aku punya ide buat lamarannya. Di Sumatra ada tradisi berbalas pantun, lho!
        ar_eg: يا ماس كريم، الكراما بتاعتك بقت حلوة أوي! أنا عندي فكرة للخطوبة. في سومطرة فيه عادة إن الناس يردّوا على بعض بالپانتون!
        ar: يا ماس كريم، صارت لغتك الكراما أكثر طلاقة! لديّ فكرة للخطبة - في سومطرة تقليد تبادل أبيات البانتون!
        en: Mas Karim, your krama's getting so fluent! I've got an idea for the proposal. In Sumatra there's a tradition of trading pantun!
