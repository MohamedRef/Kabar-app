questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: في قصة بايو، طبق البيچيل اللي فاضل لمين؟
      ar: في قصة بايو، لمن طبق البيتشيل المتبقّي؟
      en: In Bayu's story, who is the left-over plate of pecel for?
    options: ["untuk Kak Tiur", "untuk pelanggan pertama", "untuk kakak Bayu", "untuk Mas Joko"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Cerpen yang bagus itu banyak yang ___, sedikit yang tersurat.
    meaning:
      ar_eg: القصة القصيرة الحلوة فيها كتير بين السطور، وقليل مكتوب صريح.
      ar: القصة القصيرة الجيّدة فيها كثير ممّا بين السطور وقليل ممّا هو مصرّح به.
      en: A good short story has lots between the lines and very little spelled out.
    answers: [tersirat]
    options: ["terlambat", "tersirat", "tersisa"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: (استنتاج) ساري كانت تقصد إيه لما سألت عن الكبايا الخضرا؟
      ar: (استنتاج) ماذا قصدت ساري حين سألت عن الكبايا الخضراء؟
      en: (Inference) What did Sari mean when she asked about her green kebaya?
    options: ["Dia ingin membeli kebaya baru.", "Dia lupa pertanyaan Bapak.", "Kebayanya kotor sejak Lebaran.", "Dia menerima lamaran Karim."]
    answer: 3
  - id: q04
    type: listen
    text: Waktu Bapak melamar dulu, Ibu juga nggak bilang "iya". Ibu cuma bilang, "Teh manisnya diminum dulu, Mas."
    question:
      ar_eg: بو راهايو ردّت إزاي زمان لما پاك بودي طلب إيدها؟
      ar: بماذا ردّت بو راهايو قديمًا حين خطبها باك بودي؟
      en: How did Bu Rahayu answer long ago, when Pak Budi proposed?
    options: ["Dia bilang, \"Ya, saya mau.\"", "Dia menyuruh Pak Budi minum teh manis dulu.", "Dia minta waktu satu bulan."]
    answer: 1
    meaning:
      ar_eg: لما جيت تطلبني زمان، أنا كمان مقلتش «أيوه». قلت بس - «اشرب الشاي بتاعك الأول يا ماس.»
      ar: حين جئت تخطبني قديمًا لم أقل «نعم» أيضًا. قلت فقط - «اشرب شايك المحلّى أوّلًا يا ماس.»
      en: When you proposed, I didn't say "yes" either. I just said, "Drink your sweet tea first, Mas."
  - id: q05
    type: translate
    direction: from_target
    source_text: Tokoh jadi hidup karena kekurangannya.
    answers_meaning:
      ar_eg: ["الشخصية بتبقى حيّة بعيوبها.", "عيوب الشخصية هي اللي بتخلّيها حيّة.", "الشخصية بتعيش بسبب عيوبها."]
      ar: ["تدبّ الحياة في الشخصية بفضل عيوبها.", "عيوب الشخصية هي ما يجعلها حيّة.", "تصبح الشخصية حيّة بسبب نقائصها."]
      en: ["A character comes alive through their flaws.", "Flaws are what make a character come alive.", "A character becomes real because of their shortcomings."]
next:
  ar_eg: پاك محمود وبو سامية، أبو كريم وأمّه، طايرين من القاهرة لجاوة. بو راهايو بتطبخ من الفجر، پاك بودي بيتمرّن على كلامه، وبايو بيكتب پانتون... على الواتساب لكل العيلة.
  ar: باك محمود وبو سامية، والدا كريم، في طريقهما جوًّا من القاهرة إلى جاوة. تطبخ بو راهايو منذ الفجر، ويتدرّب باك بودي على كلمته، ويكتب بايو أبيات بانتون... ويرسلها للعائلة كلّها على الواتساب.
  en: Pak Mahmoud and Bu Samia, Karim's parents, are flying from Cairo to Java. Bu Rahayu is cooking from dawn, Pak Budi is rehearsing his speech, and Bayu is writing pantun... and sending them to the whole family on WhatsApp.
