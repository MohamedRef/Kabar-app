title:
  target: Dolan-dolan neng Ngawi
  ar_eg: فسحة في نجاوي
  ar: نزهة في نغاوي
  en: Out and about in Ngawi
summary:
  ar_eg: بايو بياخد كريم القلعة الهولندية «المدفونة» في نجاوي، وبيعلّمه إن تكرار الكلمة بيغيّر معناها - mlaku يعني يمشي، وmlaku-mlaku يعني يتفسّح. وبالليل، پاك بودي بيودّع كريم بنصيحة كبيرة - في جوجا، الكلام لازم يبقى «ناعم».
  ar: يأخذ بايو كريمًا إلى القلعة الهولندية «المدفونة» في نغاوي، ويعلّمه أنّ تكرار الكلمة يغيّر معناها - mlaku تعني يمشي، وmlaku-mlaku تعني يتنزّه. وفي الليل يودّع باك بودي كريمًا بنصيحة كبيرة - في جوغجا يجب أن يكون الكلام «ناعمًا».
  en: Bayu takes Karim to the "buried" Dutch fort in Ngawi and teaches him that doubling a word changes it - mlaku is walk, mlaku-mlaku is stroll around. That night, Pak Budi sends Karim off with big advice - in Jogja, your speech must be "smooth".
cast: [Karim, Bayu, Pak Budi]
scenes:
  - setting:
      ar_eg: بنتينج پيندم في نجاوي، العصر. قلعة هولندية من الطوب الأحمر، أوطى من الأرض اللي حواليها، وحواليها خندق. بايو بيصوّر.
      ar: بنتينغ بندم في نغاوي، عصرًا. قلعة هولندية من الطوب الأحمر، أخفض من الأرض المحيطة بها، ويحيط بها خندق. بايو يلتقط الصور.
      en: Benteng Pendem in Ngawi, late afternoon. A red-brick Dutch fort, set lower than the land around it, with a moat. Bayu is taking photos.
    lines:
      - speaker: Bayu
        text: Mas, iki Benteng Pendem. Pendem iku "dipendhem", merga bentenge luwih endhek tinimbang lemahe.
        ar_eg: يا ماس، دي بنتينج پيندم. «پيندم» يعني «مدفونة»، عشان القلعة أوطى من الأرض.
        ar: يا ماس، هذه بنتينغ بندم. و«بندم» تعني «مدفونة»، لأنّ القلعة أخفض من الأرض.
        en: Mas, this is Benteng Pendem. Pendem means "buried", because the fort sits lower than the ground.
        note:
          ar_eg: merga = عشان / لأن. القلعة بناها الهولنديين في القرن التسعتاشر (اسمها الرسمي Van den Bosch)، عند التقاء نهر سولو ونهر ماديون.
          ar: merga = لأنّ. وقد بنى الهولنديون القلعة في القرن التاسع عشر (اسمها الرسميّ Van den Bosch)، عند ملتقى نهر سولو ونهر ماديون.
          en: merga = because. The Dutch built the fort in the 19th century (officially Fort Van den Bosch), where the Solo and Madiun rivers meet.
      - speaker: Karim
        text: Apik banget! Ayo mlaku-mlaku.
        ar_eg: حلوة أوي! يلّا نتمشّى شويّة.
        ar: جميلة جدًّا! هيّا نتجوّل.
        en: Beautiful! Let's stroll around.
        note:
          ar_eg: mlaku = يمشي. لكن mlaku-mlaku = يتمشّى للفسحة من غير هدف. وكمان dolan = يزور أو يخرج يتفسّح، وdolan-dolan = يلفّ يتفسّح.
          ar: mlaku = يمشي. أمّا mlaku-mlaku = يتنزّه بلا هدف. وكذلك dolan = يزور أو يخرج للتنزّه، وdolan-dolan = يتجوّل للتسلية.
          en: mlaku = walk. mlaku-mlaku = stroll around for fun. Likewise dolan = go out, visit, and dolan-dolan = wander around for fun.
      - speaker: Bayu
        text: Aku seneng dolan-dolan neng kene karo kanca-kanca. Sepi lan adem.
        ar_eg: أنا بحبّ أتفسّح هنا مع صحابي. هادي وساقع.
        ar: أحبّ أن أتنزّه هنا مع أصدقائي. هادئ ومنعش.
        en: I love hanging out here with my friends. It's quiet and cool.
      - speaker: Karim
        text: Nanging panas tenan saiki!
        ar_eg: بس الدنيا حرّ جدًّا دلوقتي!
        ar: لكنّ الجوّ حارّ فعلًا الآن!
        en: But it's really hot right now!
      - speaker: Bayu
        text: Hahaha! Iya, panas pol. Ayo ngombe es dhawet, terus mulih.
        ar_eg: ههههه! أيوه، حرّ موت. يلّا نشرب «إس داويت»، وبعدين نروّح.
        ar: ههههه! نعم، حارّ جدًّا. هيّا نشرب «إس داويت»، ثمّ نعود إلى البيت.
        en: Hahaha! Yeah, scorching. Let's have an es dhawet, then head home.
        note:
          ar_eg: تلات طرق لـ«أوي» - banget (عادي)، tenan (بجدّ)، pol (للآخر، كلام شباب). وterus = وبعدين.
          ar: ثلاث طرق لقول «جدًّا» - banget (عاديّة)، tenan (حقًّا)، pol (إلى أقصى حدّ، كلام الشباب). وterus = ثمّ.
          en: Three ways to say "very" - banget (neutral), tenan (truly), pol (to the max, young slang). terus = then.
  - setting:
      ar_eg: بالليل في الوارونج في ماديون. شنطة كريم جاهزة. پاك بودي قاعد قدّامه وفي إيده كوباية شاي.
      ar: ليلًا في الوارونغ في ماديون. حقيبة كريم جاهزة. يجلس باك بودي أمامه وفي يده كوب شاي.
      en: Night at the warung in Madiun. Karim's bag is packed. Pak Budi sits across from him with a glass of tea.
    lines:
      - speaker: Pak Budi
        text: Karim, sesuk kowe bali menyang Jogja. Nanging rungokna. Wong tuwa neng Jogja basane alus banget.
        ar_eg: يا كريم، بكرة راجع جوجا. بس اسمع. الكبار في جوجا كلامهم ناعم أوي.
        ar: يا كريم، غدًا تعود إلى جوغجا. لكن اسمع. كبار السنّ في جوغجا كلامهم ناعم جدًّا.
        en: Karim, tomorrow you go back to Jogja. But listen. The elders in Jogja speak very refinedly.
      - speaker: Karim
        text: Alus? Kaya apa, Pak?
        ar_eg: ناعم؟ إزاي يعني يا پاك؟
        ar: ناعم؟ كيف يعني يا باك؟
        en: Refined? How so, Pak?
      - speaker: Pak Budi
        text: Basa sing kok sinau saiki iku ngoko. Karo kanca apik. Nanging karo wong tuwa neng Jogja, kudu krama.
        ar_eg: اللغة اللي انت بتتعلّمها دلوقتي اسمها «نجوكو». مع الصحاب كويسة. بس مع الكبار في جوجا، لازم «كراما».
        ar: اللغة التي تتعلّمها الآن اسمها «نغوكو». جيّدة مع الأصدقاء. لكن مع كبار السنّ في جوغجا، يجب «كراما».
        en: The Javanese you're learning now is ngoko. Fine with friends. But with elders in Jogja, you need krama.
        note:
          ar_eg: الجاوي ليه مستويات كلام - ngoko (العادي) وkrama (المؤدّب). الموسم الجاي كله عنها.
          ar: للجاوية مستويات كلام - ngoko (العاديّة) وkrama (المهذّبة). والجزء القادم كلّه عنها.
          en: Javanese has speech levels - ngoko (plain) and krama (polite). The next part of the journey is all about them.
      - speaker: Karim
        text: Krama? Waduh, aku durung ngerti.
        ar_eg: كراما؟ يا خبر، أنا لسه مش فاهم حاجة فيها.
        ar: كراما؟ يا للهول، لا أعرفها بعد.
        en: Krama? Oh no, I don't know it yet.
      - speaker: Pak Budi
        text: Ora apa-apa. Kancaku Pak Harjo guru basa Jawa neng Jogja. Dheweke bakal mbantu kowe.
        ar_eg: مافيش مشكلة. صاحبي پاك هارجو مدرّس جاوي في جوجا. هيساعدك.
        ar: لا بأس. صديقي باك هارجو معلّم جاوية في جوغجا. سيساعدك.
        en: No problem. My friend Pak Harjo is a Javanese teacher in Jogja. He'll help you.
      - speaker: Narrator
        text: Kaca telulas. Mlaku-mlaku, dolan-dolan, banget, tenan, pol. Lan, nanging, terus, merga.
        ar_eg: صفحة تلتاشر. يتمشّى، يتفسّح، أوي، بجدّ، موت. و، بس، وبعدين، عشان.
        ar: الصفحة الثالثة عشرة. يتجوّل، يتنزّه، جدًّا، حقًّا، للغاية. و، لكن، ثمّ، لأنّ.
        en: Page thirteen. Stroll, wander, very, truly, totally. And, but, then, because.
