      en: ["I love hanging out with my friends.", "I like going out with friends."]
next:
  ar_eg: محطة ليمپويانجان في جوجا. راجل كبير شيك مستنّي كريم... وكريم بيقوله «Kowe wis mangan?»... وكل الرصيف بيسكت.
  ar: محطة ليمبويانغان في جوغجا. رجل مسنّ أنيق ينتظر كريمًا... فيقول له كريم «Kowe wis mangan؟»... ويصمت الرصيف كلّه.
  en: Lempuyangan station in Jogja. A dignified older gentleman is waiting for Karim... and Karim greets him with "Kowe wis mangan?"... and the whole platform goes quiet.
review:
  status: draft
  verified: false
  notes: Benteng Pendem (Fort Van den Bosch) was built c. 1839-1845 at the Solo-Madiun river confluence - verify dates before adding them. Pak Harjo as Pak Budi's friend links J2 to J3.
