questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: باك RT قال إيه يتعمل الأوّل؟
      ar: ماذا قال باك RT أن يُفعل أوّلًا؟
      en: What does Pak RT say to do first?
    options: ["Berkumpul di warung.", "Mematikan listrik di rumah.", "Memasak nasi.", "Membuat teh."]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Kita masak nasi yang banyak ___ semua warga bisa makan.
    meaning:
      ar_eg: هنطبخ رز كتير عشان كل الجيران ياكلوا.
      ar: سنطبخ أرزًّا كثيرًا لكي يأكل كل السكّان.
      en: Let's cook lots of rice so that everyone can eat.
    answers: [supaya]
    options: ["sehingga", "melainkan", "supaya"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: على حسب بايو، الحارة غرقت ليه؟
      ar: لماذا غرق الزقاق بحسب بايو؟
      en: According to Bayu, why did the lane flood?
    options: ["Karena gotnya terlalu kecil.", "Karena angin khamsin.", "Karena Mas Joko lupa menutup pintu."]
    answer: 0
  - id: q04
    type: listen
    text: Setiap musim semi, angin panas dari gurun membawa debu ke kota.
    question:
      ar_eg: رياح الخماسين بتيجي منين؟
      ar: من أين تأتي رياح الخماسين؟
      en: Where does the khamsin wind come from?
    options: ["dari laut", "dari sungai Nil", "dari gurun"]
    answer: 2
    meaning:
      ar_eg: كل ربيع، ريح سخنة جاية من الصحرا بتجيب التراب للمدينة.
      ar: في كل ربيع تحمل ريح حارّة من الصحراء الغبار إلى المدينة.
      en: Every spring, a hot wind from the desert carries dust into the city.
  - id: q05
    type: translate
    direction: from_target
    source_text: Bukan cuma rumah saya yang kebanjiran, tapi juga lima rumah lain.
    answers_meaning:
      ar_eg: ["مش بيتي بس اللي غرق، دي خمس بيوت تانية كمان.", "مش بيتي لوحده اللي غرق، كمان خمس بيوت تانية.", "مش بس بيتي اللي غرق، وخمس بيوت تانية كمان."]
      ar: ["ليس بيتي وحده الذي غمره الماء، بل خمسة بيوت أخرى أيضًا.", "لم يغرق بيتي فقط، بل خمسة بيوت أخرى كذلك.", "لم يُصب الفيضان بيتي وحده، بل خمسة بيوت أخرى أيضًا."]
      en: ["It's not only my house that's flooded, but five other houses too.", "Not just my house — five other houses are flooded too.", "Not only my house but also five other houses were flooded."]
next:
  ar_eg: بعد الفيضان والتراب، الكل محتاج ليلة هادية. ليلة حواديت على الفيديو! باك بودي هيحكي حكاية من جاوة، ونادية هتحكي حكاية جحا.
  ar: بعد الفيضان والغبار يحتاج الجميع إلى ليلة هادئة. ليلة حكايات عبر الاتصال المرئي! سيحكي باك بودي حكاية من جاوة، وتحكي نادية حكاية لجحا.
  en: After the flood and the dust, everyone needs a quiet night. Story night on video! Pak Budi tells a tale from Java, and Nadia tells one about Juha.
