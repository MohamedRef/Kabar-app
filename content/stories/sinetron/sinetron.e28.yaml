title:
  target: Banjir di Gang, Debu di Kairo
  ar_eg: غرق في الحارة، وتراب في القاهرة
  ar: فيضان في الزقاق، وغبار في القاهرة
  en: Flood in the Lane, Dust in Cairo
summary:
  ar_eg: مطر جامد بيغرّق حارة ميلاتي، والوارونج بيتحوّل لمطبخ لكل الجيران. وفي القاهرة، رياح الخماسين بتقلب السما صفرا، والحاجّة فاطمة عندها خطّة لكل ذرّة تراب.
  ar: تُغرق أمطار غزيرة زقاق ميلاتي، ويتحوّل الوارونغ إلى مطبخ لكل الجيران. وفي القاهرة تقلب رياح الخماسين السماء صفراء، ولدى الحاجّة فاطمة خطّة لكل ذرّة غبار.
  en: Heavy rain floods Gang Melati, and the warung turns into a kitchen for all the neighbours. In Cairo, the khamsin wind turns the sky yellow, and Hagga Fatma has a plan for every speck of dust.
cast: [Pak RT, Bu Rahayu, Pak Budi, Bayu, Bu Tini, Mas Joko, Hagga Fatma, Sari, Nadia]
scenes:
  - setting:
      ar_eg: ماديون، الساعة ١١ بالليل. المطر نازل من العصر، والمية في الحارة واصلة للركبة. الوارونج على حتّة عالية شوية، ونوره لسه والع.
      ar: ماديون، الحادية عشرة ليلًا. المطر يهطل منذ العصر، والماء في الزقاق بلغ الركبة. الوارونغ في موضع أعلى قليلًا، وما زال مضاءً.
      en: Madiun, 11 p.m. It's been raining since the afternoon and the water in the lane is knee-deep. The warung sits a little higher, and its light is still on.
    lines:
      - speaker: Narrator
        text: Hujan turun deras sejak sore sehingga kali di belakang gang meluap.
        ar_eg: المطر نازل جامد من العصر، لدرجة إن الترعة اللي ورا الحارة فاضت.
        ar: يهطل المطر بغزارة منذ العصر، حتى فاض الجدول الذي خلف الزقاق.
        en: It's been pouring since the afternoon, so the stream behind the lane has burst its banks.
        note:
          ar_eg: sehingga = «لدرجة إن / فـ» للنتيجة، وsupaya = «عشان» للهدف. المطر مش «عايز» يغرّق الحارة، فبنقول sehingga.
          ar: sehingga تعني «حتى / فـ» للنتيجة، وsupaya تعني «لكي» للغاية. والمطر لا «يقصد» إغراق الزقاق، لذلك نقول sehingga.
          en: sehingga = "so that / with the result that"; supaya = "so that / in order to" (purpose). The rain doesn't mean to flood the lane, so it's sehingga.
      - speaker: Pak RT
        text: Bapak-bapak, ibu-ibu! Pertama, matiin listrik di rumah. Selanjutnya, pindahin barang ke tempat yang tinggi.
        ar_eg: يا جماعة! أوّلًا، اقفلوا الكهربا في البيوت. بعد كده، شيلوا الحاجات لمكان عالي.
        ar: أيّها السادة والسيّدات! أوّلًا، افصلوا الكهرباء في البيوت. بعد ذلك، انقلوا الأغراض إلى مكان مرتفع.
        en: Everyone! First, switch off the electricity at home. Next, move your things somewhere high.
        note:
          ar_eg: matiin = matikan (اقفلوا)، وpindahin = pindahkan (شيلوا / انقلوا) - ‎-kan بتبقى ‎-in في الكلام. وbarang = حاجات.
          ar: matiin = matikan (أطفئوا)، وpindahin = pindahkan (انقلوا) - تصير ‎-kan إلى ‎-in في الكلام. وbarang = أغراض.
          en: matiin = matikan (switch off), pindahin = pindahkan (move) — -kan becomes -in in speech. barang = things.
      - speaker: Pak RT
        text: Akhirnya, kalau air terus naik, semua kumpul di warung Pak Budi, ya!
        ar_eg: وفي الآخر، لو المية فضلت تعلى، الكل يتجمّع في وارونج باك بودي.
        ar: وأخيرًا، إذا استمرّ الماء في الارتفاع، فليجتمع الجميع في وارونغ باك بودي.
        en: Finally, if the water keeps rising, everyone gathers at Pak Budi's warung.
        note:
          ar_eg: kumpul = berkumpul (يتجمّعوا)، وterus naik = «تفضل تعلى».
          ar: kumpul = berkumpul (يجتمعون)، وterus naik = «يستمرّ في الارتفاع».
          en: kumpul = berkumpul (gather); terus naik = keeps rising.
      - speaker: Bu Tini
        text: Bukan cuma rumah saya yang kebanjiran, tapi juga lima rumah lain.
        ar_eg: مش بيتي بس اللي غرق، دي خمس بيوت تانية كمان.
        ar: ليس بيتي وحده الذي غمره الماء، بل خمسة بيوت أخرى أيضًا.
        en: It's not only my house that's flooded — five other houses are too.
        note:
          ar_eg: في الكلام - bukan cuma X, tapi juga Y، وفي الكتابة - bukan hanya X, melainkan juga Y = «مش X بس، لأ وY كمان». وcuma = hanya. وkebanjiran = «اتغرّق»، من banjir (فيضان) بـ ke-…-an اللي بتدّي معنى «حصلّه حاجة وحشة».
          ar: في الكلام - bukan cuma X, tapi juga Y، وفي الكتابة - bukan hanya X, melainkan juga Y = «ليس X فقط بل Y أيضًا». وcuma = hanya. وkebanjiran = «أصابه الفيضان»، من banjir بصيغة ke-…-an التي تفيد وقوع أمر غير مرغوب.
          en: Spoken bukan cuma X, tapi juga Y = written bukan hanya X, melainkan juga Y = "not only X but also Y". cuma = hanya. kebanjiran = "flooded", from banjir (flood) with ke-…-an, "struck by something unwelcome".
      - speaker: Bu Rahayu
        text: Bu Tini, masuk! Kita masak nasi yang banyak biar semua warga bisa makan malam ini.
        ar_eg: ادخلي يا بو تيني! هنطبخ رز كتير عشان كل الجيران ياكلوا الليلة.
        ar: ادخلي يا بو تيني! سنطبخ أرزًّا كثيرًا لكي يأكل كل السكّان الليلة.
        en: Come in, Bu Tini! Let's cook lots of rice so everyone can eat tonight.
        note:
          ar_eg: biar = supaya (عشان) في الكلام، وmasak = يطبخ.
          ar: biar = supaya (لكي) في الكلام، وmasak = يطبخ.
          en: biar = supaya (so that) in speech; masak = to cook.
      - speaker: Pak Budi
        text: Biar saya yang angkat karung berasnya, Bu.
        ar_eg: سيبيني أنا أشيل شوال الرز يا رهايو.
        ar: دعيني أحمل كيس الأرز يا راهايو.
        en: Let me lift the sack of rice.
        note:
          ar_eg: «Biar saya…» = «سيبيني أنا…». وkarung beras = شوال رز.
          ar: «Biar saya…» = «دعني أنا…». وkarung beras = كيس أرز.
          en: '"Biar saya…" = "let me…". karung beras = sack of rice.'
      - speaker: Bu Rahayu
        text: Jangan! Bapak tugasnya bikin teh. Mas Joko aja yang angkat.
        ar_eg: لأ! انت شغلتك تعمل الشاي. ماس جوكو هو اللي يشيل.
        ar: لا! مهمّتك إعداد الشاي. ماس جوكو هو من يحمل.
        en: No! Your job is making tea. Mas Joko does the lifting.
      - speaker: Mas Joko
        text: Siap, Bu! Kalau nggak makan dulu, saya nggak kuat... tapi ya udah, saya angkat sekarang.
        ar_eg: تمام يا بو! لو مكلتش الأول مش هقدر... بس خلاص، هشيله دلوقتي.
        ar: حاضر يا بو! إن لم آكل أوّلًا فلن أقوى... لكن لا بأس، سأحمله الآن.
        en: Ready, Bu! If I don't eat first I won't be strong enough... but fine, I'll lift it now.
      - speaker: Bayu
        text: Aku foto semuanya. Got di gang ini terlalu kecil, jadi airnya nggak bisa lewat.
        ar_eg: أنا بصوّر كل حاجة. البلاعة اللي في الحارة دي صغيّرة أوي، فالمية مش عارفة تعدّي.
        ar: أنا أصوّر كل شيء. مصرف المياه في هذا الزقاق صغير جدًّا، فلا يستطيع الماء أن يمرّ.
        en: I'm photographing everything. The drain in this lane is too small, so the water can't get through.
        note:
          ar_eg: في الكلام jadi بتاخد مكان sehingga (فـ / عشان كده).
          ar: في الكلام تحلّ jadi محلّ sehingga (فـ / لذلك).
          en: In speech, jadi does the job of sehingga (so).
      - speaker: Narrator
        text: Malam itu, warung Pak Budi menjadi dapur umum. Seratus bungkus nasi dimasak, dan tidak ada yang tidur kelaparan.
        ar_eg: الليلة دي، وارونج باك بودي بقى مطبخ للحارة كلها. اتطبخت مية لفّة رز، ومحدّش نام جعان.
        ar: في تلك الليلة صار وارونغ باك بودي مطبخًا عامًّا. طُبخت مئة لفّة أرز، ولم ينم أحد جائعًا.
        en: That night, Pak Budi's warung became a community kitchen. A hundred rice parcels were cooked, and nobody went to bed hungry.
  - setting:
      ar_eg: القاهرة، الضهر. السما لونها أصفر برتقاني، والتراب داخل من كل حتّة. الحاجّة فاطمة بتحطّ فوط مبلولة تحت الأبواب، وساري بتكلّم ماديون فيديو.
      ar: القاهرة، وقت الظهر. السماء صفراء برتقالية، والغبار يدخل من كل مكان. تضع الحاجّة فاطمة مناشف مبلّلة تحت الأبواب، وساري تتّصل بماديون اتصالًا مرئيًّا.
      en: Cairo, midday. The sky is a yellowy orange and dust is getting in everywhere. Hagga Fatma is laying wet towels under the doors, and Sari is video-calling Madiun.
    lines:
      - speaker: Sari
        text: Pak, Bu, baik-baik aja, kan? Di sini juga ada bencana kecil, nih. Langit Kairo kuning!
        ar_eg: بابا، ماما، انتو كويسين؟ هنا كمان فيه كارثة صغيّرة. سما القاهرة صفرا!
        ar: أبي، أمي، هل أنتما بخير؟ هنا أيضًا كارثة صغيرة. سماء القاهرة صفراء!
        en: Dad, Mum, are you all right? There's a little disaster here too. The Cairo sky is yellow!
      - speaker: Hagga Fatma
        text: Ini angin khamsin. Setiap musim semi, angin panas dari gurun membawa debu ke kota.
        ar_eg: دي رياح الخماسين. كل ربيع، ريح سخنة جاية من الصحرا بتجيب التراب للمدينة.
        ar: هذه رياح الخماسين. في كل ربيع تحمل ريح حارّة من الصحراء الغبار إلى المدينة.
        en: This is the khamsin. Every spring, a hot wind from the desert carries dust into the city.
        note:
          ar_eg: الخماسين اسمها جاي من «خمسين» - زمان كانوا بيقولوا إنها بتهبّ في حوالي خمسين يوم في الربيع. وmusim (موسم) جاية من العربي «موسم».
          ar: سُمّيت الخماسين من «خمسين» - إذ قيل قديمًا إنها تهبّ في نحو خمسين يومًا من الربيع. وكلمة musim من العربية «موسم».
          en: The khamsin is named from Arabic خمسين (fifty) — it was said to blow over roughly fifty days of spring. musim (season) comes from Arabic موسم.
      - speaker: Nadia
        text: Kalau ada khamsin, sebaiknya tutup jendela sama pake masker, biar debu nggak masuk ke paru-paru.
        ar_eg: لو فيه خماسين، الأحسن تقفلوا الشبابيك وتلبسوا كمامة عشان التراب ميدخلش الرئة.
        ar: إذا هبّت الخماسين فالأفضل إغلاق النوافذ ولبس الكمّامة لكي لا يدخل الغبار إلى الرئتين.
        en: When there's a khamsin, it's best to shut the windows and wear a mask so the dust doesn't get into your lungs.
        note:
          ar_eg: biar = supaya، وpake = pakai، وsama = dan. وkhamsin = الخماسين، وmasker = كمامة، وdebu = تراب، وparu-paru = الرئة.
          ar: biar = supaya، وpake = pakai، وsama = dan. وkhamsin = الخماسين، وmasker = كمّامة، وdebu = غبار، وparu-paru = الرئتان.
          en: biar = supaya, pake = pakai, sama = dan. khamsin = the khamsin wind, masker = mask, debu = dust, paru-paru = lungs.
      - speaker: Hagga Fatma
        text: Terus handuk basah di bawah pintu. Pertama handuk, selanjutnya jendela, akhirnya teh.
        ar_eg: وفوط مبلولة تحت الباب. الأول الفوط، وبعدين الشبابيك، وفي الآخر الشاي.
        ar: ومناشف مبلّلة تحت الباب. أوّلًا المناشف، ثم النوافذ، وأخيرًا الشاي.
        en: And wet towels under the door. First the towels, next the windows, and finally the tea.
      - speaker: Pak Budi
        text: Hagga Fatma, kita sama! Di sini juga, tugas saya bikin teh.
        ar_eg: يا حاجّة فاطمة، إحنا زيّ بعض! هنا كمان، شغلتي أعمل الشاي.
        ar: يا حاجّة فاطمة، نحن متشابهان! هنا أيضًا مهمّتي إعداد الشاي.
        en: Hagga Fatma, we're the same! Here too, my job is making the tea.
      - speaker: Sari
        text: Madiun kebanjiran air, Kairo kebanjiran debu. Tapi semua aman, alhamdulillah.
        ar_eg: ماديون غرقانة مية، والقاهرة غرقانة تراب. بس الكل بخير، الحمد لله.
        ar: ماديون غمرها الماء، والقاهرة غمرها الغبار. لكن الجميع بأمان، والحمد لله.
        en: Madiun's flooded with water, Cairo's flooded with dust. But everyone's safe, thank God.
        note:
          ar_eg: kebanjiran debu = «غرقانة تراب» - هزار بكلمة kebanjiran (من banjir).
          ar: kebanjiran debu = «غمرها الغبار» - دعابة بكلمة kebanjiran (من banjir).
          en: kebanjiran debu = "flooded with dust" — a joke on kebanjiran (from banjir).
      - speaker: Hagga Fatma
        text: Kalau saya masih muda, saya pindah ke Madiun. Air lebih gampang dibersihin daripada debu!
        ar_eg: لو كنت لسه صغيّرة، كنت عزّلت على ماديون. المية أسهل في التنضيف من التراب!
        ar: لو كنت ما زلت شابّة لانتقلت إلى ماديون. الماء أسهل تنظيفًا من الغبار!
        en: If I were still young, I'd move to Madiun. Water's easier to clean up than dust!
        note:
          ar_eg: gampang = mudah (سهل)، وdibersihin = dibersihkan (يتنضّف). وdebu = تراب.
          ar: gampang = mudah (سهل)، وdibersihin = dibersihkan (يُنظَّف). وdebu = غبار.
          en: gampang = mudah (easy), dibersihin = dibersihkan (be cleaned). debu = dust.
      - speaker: Bu Rahayu
        text: Hagga belum lihat lumpurnya, sih!
        ar_eg: الحاجّة لسه مشافتش الطين!
        ar: الحاجّة لم ترَ الطين بعد!
        en: Hagga hasn't seen the mud yet!
