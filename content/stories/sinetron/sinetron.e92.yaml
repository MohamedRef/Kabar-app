id: sinetron.e92
series: sinetron
episode: 92
language: jv
level: j4
unlock_after: j4.u03
title:
  target: Matur lan sowan
  ar_eg: أعرض وأزور
  ar: أتشرّف بالقول والزيارة
  en: Speaking up and paying respects
summary:
  ar_eg: في الكراتون، قصر سلطان يوجياكارتا، باك ساسترو - واحد من «عبيد القصر» (abdi dalem) - بيعلّم كريم الوشّ التاني للكراما - كلمات بتوطّي بيها نفسك قدّام الكبير - matur، sowan، nyuwun، ngaturi. وبالليل، كريم بيستعملهم عشان يعزم عيلة هارسونو على العشا.
  ar: في الكراتون، قصر سلطان يوغياكارتا، يعلّم باك ساسترو - أحد «خدم القصر» (abdi dalem) - كريمًا الوجه الآخر للكراما - كلمات تتواضع بها أمام الكبير - matur وsowan وnyuwun وngaturi. وفي الليل يستعملها كريم ليدعو عائلة هارسونو إلى العشاء.
  en: At the Kraton, the Sultan of Yogyakarta's palace, Pak Sastro - one of the abdi dalem, the palace's traditional retainers - teaches Karim the other face of krama - words that lower yourself before a respected person - matur, sowan, nyuwun, ngaturi. That night, Karim uses them to invite the Harsono family to dinner.
cast: [Karim, Mas Dimas, Pak Sastro, Pak Harsono]
scenes:
  - setting:
      ar_eg: جوّه الكراتون، الصبح. ساحات رملة وبيوت خشب بسقوف عالية. باك ساسترو، راجل كبير لابس اللبس التقليدي - جاكيتة سودا وقماش باتيك ملفوف وطاقية (blangkon)، وماشي حافي.
      ar: داخل الكراتون، صباحًا. ساحات رملية وأجنحة خشبية بسقوف عالية. باك ساسترو رجل مسنّ بالزيّ التقليديّ - سترة داكنة وإزار باتيك وعمامة (blangkon)، يمشي حافيًا.
      en: Inside the Kraton in the morning. Sandy courtyards and tall-roofed wooden pavilions. Pak Sastro, an older man in traditional dress - a dark jacket, batik wrap and blangkon headcloth - walks barefoot.
    lines:
      - speaker: Mas Dimas
        text: Pak Sastro, menika kanca kula Karim saking Mesir. Piyambakipun badhe nyuwun pirsa babagan Kraton.
        ar_eg: يا باك ساسترو، ده صاحبي كريم من مصر. عايز يسأل عن الكراتون.
        ar: يا باك ساسترو، هذا صديقي كريم من مصر. يودّ أن يسأل عن الكراتون.
        en: Pak Sastro, this is my friend Karim from Egypt. He'd like to ask about the Kraton.
      - speaker: Pak Sastro
        text: Sugeng rawuh, Mas. Mangga, badhe pirsa menapa?
        ar_eg: أهلًا بيك يا ابني. اتفضّل، عايز تعرف إيه؟
        ar: أهلًا بك يا بنيّ. تفضّل، ماذا تودّ أن تعرف؟
        en: Welcome, son. Please, what would you like to know?
      - speaker: Karim
        text: Kula badhe matur, Pak. Panjenengan nyambut damel wonten mriki sampun pinten taun?
        ar_eg: عايز أسأل حضرتك يا باك. حضرتك بتشتغل هنا بقالك كام سنة؟
        ar: أودّ أن أسألك يا باك. منذ كم سنة تعمل هنا؟
        en: May I say something, Pak. How many years have you worked here?
        note:
          ar_eg: matur = «أقول / أعرض» لحدّ أعلى منك (كراما أندهاب، يعني كلمة تواضع). وعكسها ngendika، للكبير لما هو اللي بيتكلّم.
          ar: matur = «أقول / أعرض» لمن هو أعلى منك (كراما أنداب، أي كلمة تواضع). ونقيضها ngendika، للكبير حين يتكلّم هو.
          en: matur = "say, report" up to someone above you (krama andhap, a humble word). Its partner is ngendika, used when the respected person speaks.
      - speaker: Pak Sastro
        text: Sampun tigang dasa taun, Mas. Kula abdi dalem. Saben dinten kula caos wonten Kraton.
        ar_eg: تلاتين سنة يا ابني. أنا خادم من خدّام القصر. كل يوم بقدّم خدمتي في الكراتون.
        ar: ثلاثون سنة يا بنيّ. أنا من خدم القصر. كلّ يوم أقدّم خدمتي في الكراتون.
        en: Thirty years, son. I'm an abdi dalem. Every day I serve at the Kraton.
        note:
          ar_eg: abdi dalem ناس بيخدموا القصر بشكل تقليدي، وكتير منهم بيقولوا إن الخدمة دي «شرف» أكتر منها شغل. وcaos = يقدّم خدمة أو حاجة لحدّ عالي.
          ar: abdi dalem أناس يخدمون القصر خدمة تقليدية، ويقول كثير منهم إنّها «شرف» أكثر منها وظيفة. وcaos = يقدّم خدمة أو شيئًا لمن هو أعلى.
          en: The abdi dalem serve the palace in the traditional way; many say it's an honour more than a job. caos = offer service or something up to someone higher.
      - speaker: Karim
        text: Menawi panjenengan sowan dhateng Ngarsa Dalem, ngagem basa menapa?
        ar_eg: لما حضرتك تقابل السلطان، بتتكلّم بأنهي لغة؟
        ar: حين تمثل أمام السلطان، بأيّ لغة تتكلّم؟
        en: When you go before the Sultan, which language do you use?
        note:
          ar_eg: sowan = يزور حدّ أعلى منك (أنا رايح أزوره بتواضع). وNgarsa Dalem لقب السلطان.
          ar: sowan = يزور من هو أعلى منك (زيارة تواضع). وNgarsa Dalem لقب السلطان.
          en: sowan = visit someone above you, humbly. Ngarsa Dalem is how people refer to the Sultan.
      - speaker: Pak Sastro
        text: Krama ingkang alus sanget, Mas. Saben tembung kangge awak kula, andhap. Saben tembung kangge Ngarsa Dalem, inggil.
        ar_eg: كراما ناعمة جدًّا يا ابني. كل كلمة عن نفسي بتبقى واطية. وكل كلمة عن السلطان بتبقى عالية.
        ar: كراما ناعمة جدًّا يا بنيّ. كلّ كلمة عن نفسي متواضعة. وكلّ كلمة عن السلطان عالية.
        en: Very refined krama, son. Every word about myself goes low. Every word about the Sultan goes high.
  - setting:
      ar_eg: بالليل في بيت هارسونو. كريم واقف قدّام باك هارسونو، وقلبه بيدقّ.
      ar: ليلًا في بيت هارسونو. يقف كريم أمام باك هارسونو، وقلبه يخفق.
      en: Night at the Harsonos'. Karim stands before Pak Harsono, his heart thumping.
    lines:
      - speaker: Karim
        text: Pak, kula nyuwun wekdal sekedhap. Kula badhe matur.
        ar_eg: يا باك، ممكن دقيقة من وقتك. عايز أقول حاجة.
        ar: يا باك، أطلب لحظة من وقتك. أودّ أن أقول شيئًا.
        en: Pak, may I have a moment. I'd like to say something.
      - speaker: Pak Harsono
        text: Mangga, Nak. Wonten menapa?
        ar_eg: اتفضّل يا ابني. فيه إيه؟
        ar: تفضّل يا بنيّ. ما الأمر؟
        en: Go ahead, my boy. What is it?
      - speaker: Karim
        text: Sesuk dalu, kula badhe ngaturi Bapak lan Ibu dhahar gudeg. Kula ingkang mbayar.
        ar_eg: بكرة بالليل، عايز أعزم حضرتك والمدام على عشا جوديج. وأنا اللي هدفع.
        ar: مساء الغد، أودّ أن أدعوك وزوجتك إلى عشاء من الغوديغ. وأنا من سيدفع.
        en: Tomorrow evening, I'd like to invite you and Ibu to a gudeg dinner. My treat.
        note:
          ar_eg: ngaturi = يعزم / يقدّم لحدّ أعلى منك. شوف المزج - ngaturi (أنا بتواضع) + dhahar (هم بتشريف). وgudeg أكلة يوجيا المشهورة - كاكا (جاك فروت) صغيّرة مطبوخة في سكّر النخل وحليب جوز الهند.
          ar: ngaturi = يدعو / يقدّم لمن هو أعلى. لاحظ المزج - ngaturi (أنا بتواضع) + dhahar (هم بتشريف). وgudeg طبق يوغيا الشهير - فاكهة الجاك الصغيرة مطبوخة بسكّر النخيل وحليب جوز الهند.
          en: ngaturi = invite / offer up to someone higher. Note the mix - ngaturi (me, humble) + dhahar (them, honoured). gudeg is Yogya's famous dish - young jackfruit stewed in palm sugar and coconut milk.
      - speaker: Pak Harsono
        text: Wah... Nak Karim sampun saged krama andhap lan krama inggil sesarengan. Kula remen sanget. Nggih, kula purun.
        ar_eg: يا سلام... كريم بقى بيعرف يتواضع ويشرّف في جملة واحدة. أنا مبسوط جدًّا. ماشي، موافق.
        ar: رائع... صار كريم يجمع بين التواضع والتشريف في جملة واحدة. أنا سعيد جدًّا. حسنًا، أوافق.
        en: Well... Karim can now use humble and honorific krama together. I'm delighted. Yes, I accept.
new_words:
  - word: matur
    pos: verb
    ar_eg: يقول لحدّ أعلى (تواضع)
    ar: يقول لمن هو أعلى (تواضع)
    en: say (humbly, to someone higher)
  - word: sowan
    pos: verb
    ar_eg: يزور حدّ أعلى (تواضع)
    ar: يزور من هو أعلى (تواضع)
    en: visit (humbly)
  - word: nyuwun
    pos: verb
    ar_eg: يطلب (تواضع)
    ar: يطلب (تواضع)
    en: ask for, request (humble)
  - word: ngaturi
    pos: verb
    ar_eg: يعزم / يقدّم لحدّ أعلى
    ar: يدعو / يقدّم لمن هو أعلى
    en: invite, offer (humble)
  - word: abdi dalem
    pos: noun
    ar_eg: خادم القصر التقليدي
    ar: خادم القصر التقليديّ
    en: palace retainer
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: باك ساسترو بيخدم في الكراتون بقاله قدّ إيه؟
      ar: منذ متى يخدم باك ساسترو في الكراتون؟
      en: How long has Pak Sastro served at the Kraton?
    options: ["tigang dasa taun", "gangsal taun", "sedasa taun"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Pak, kula nyuwun wekdal sekedhap. Kula badhe ___.
    meaning:
      ar_eg: يا باك، ممكن دقيقة من وقتك. عايز أقول حاجة.
      ar: يا باك، أطلب لحظة من وقتك. أودّ أن أقول شيئًا.
      en: Pak, may I have a moment. I'd like to say something.
    answers: [matur]
    options: ["matur", "ngendika", "ngomong"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: في «ngaturi Bapak dhahar»، أنهي كلمة كلمة تواضع؟
      ar: في «ngaturi Bapak dhahar»، أيّ كلمة هي كلمة التواضع؟
      en: In "ngaturi Bapak dhahar", which word is the humble one?
    options: ["ngaturi", "Bapak", "dhahar"]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Saben dinten kula caos wonten Kraton.
    answers_meaning:
      ar_eg: ["كل يوم بقدّم خدمتي في الكراتون.", "بخدم في القصر كل يوم."]
      ar: ["كلّ يوم أقدّم خدمتي في الكراتون."]
      en: ["Every day I serve at the Kraton.", "I serve in the palace every day."]
next:
  ar_eg: عشا الجوديج بيتأجّل - مباه بوتري عايزة تشوف كريم تاني. وفي الطريق، في قصر الميّة تامان ساري، كريم بيتعلّم إن الجسم كمان بيتكلّم كراما.
  ar: يتأجّل عشاء الغوديغ - فمباه بوتري تريد أن ترى كريمًا مجدّدًا. وفي الطريق، في قصر الماء تامان ساري، يتعلّم كريم أنّ الجسد أيضًا يتكلّم الكراما.
  en: The gudeg dinner is postponed - Mbah Putri wants to see Karim again. On the way, at the Taman Sari water palace, Karim learns that the body speaks krama too.
review:
  status: draft
  verified: false
  notes: Pak Sastro is the abdi dalem from the j4.u03 lessons. Abdi dalem traditionally receive a small stipend; the "honour, not a job" framing is how many describe it. Check "Ngarsa Dalem" usage and Pak Sastro's krama.
