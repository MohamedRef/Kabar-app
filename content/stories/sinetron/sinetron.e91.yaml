title:
  target: Asmanipun sinten, Mbah?
  ar_eg: اسم حضرتك إيه يا حاجّة؟
  ar: ما اسمكِ الكريم يا جدّة؟
  en: What is your name, Grandma?
summary:
  ar_eg: في ماليوبورو، كريم بيقابل ماس ديماس، طالب في يوجيا، وباك سلامت، صايغ فضّة من كوتاجيدي. ديماس بياخده يزور جدّته مباه بوتري، وكريم بيتعلّم إن حتى «الاسم» و«البيت» و«الإيد» ليهم كلمات تشريف للكبار.
  ar: في ماليوبورو يلتقي كريم بماس ديماس، الطالب في يوغيا، وباك سلامت، صائغ الفضّة من كوتاغيدي. يأخذه ديماس لزيارة جدّته مباه بوتري، ويتعلّم كريم أنّ حتى «الاسم» و«البيت» و«اليد» لها كلمات تشريف للكبار.
  en: On Malioboro, Karim meets Mas Dimas, a student in Yogya, and Pak Slamet, a silversmith from Kotagede. Dimas takes him to visit his grandmother, Mbah Putri, and Karim learns that even "name", "house" and "hand" have honorific words for elders.
cast: [Karim, Mas Dimas, Pak Slamet, Mbah Putri]
scenes:
  - setting:
      ar_eg: شارع ماليوبورو، الصبح. محلّات باتيك وفضّة وعربيات حنطور. باك سلامت فارش فضّة على ترابيزة صغيّرة، وجنبه شابّ معاه شنطة ضهر - ماس ديماس.
      ar: شارع ماليوبورو، صباحًا. محلّات باتيك وفضّة وعربات خيل. يعرض باك سلامت مشغولات فضّية على طاولة صغيرة، وبجانبه شابّ بحقيبة ظهر - ماس ديماس.
      en: Malioboro street in the morning. Batik and silver shops, horse carts. Pak Slamet has silver laid out on a small table; beside him is a young man with a backpack - Mas Dimas.
    lines:
      - speaker: Pak Slamet
        text: Mangga, Mas. Salaka saking Kotagede, asli.
        ar_eg: اتفضّل يا ابني. فضّة من كوتاجيدي، أصلي.
        ar: تفضّل يا بنيّ. فضّة من كوتاغيدي، أصلية.
        en: Please, son. Silver from Kotagede, the real thing.
      - speaker: Karim
        text: Sae sanget, Pak. Panjenengan ingkang damel piyambak?
        ar_eg: حلوة أوي يا باك. حضرتك اللي عاملها بنفسك؟
        ar: جميلة جدًّا يا باك. هل صنعتها بنفسك؟
        en: Very beautiful, Pak. Did you make it yourself?
      - speaker: Pak Slamet
        text: Nggih, Mas. Kula ugi saged ngukir asma nganggo aksara Jawa. Mangke dolan dhateng Kotagede, nggih.
        ar_eg: أيوه يا ابني. وكمان بعرف أنقش الأسامي بالحروف الجاوي. ابقى زورني في كوتاجيدي.
        ar: نعم يا بنيّ. وأستطيع أيضًا أن أنقش الأسماء بالحروف الجاوية. زرني يومًا في كوتاغيدي.
        en: Yes, son. I can also engrave names in Javanese script. Come and visit Kotagede sometime.
        note:
          ar_eg: "كلمات: nggih = أيوه، ماشي (كراما)."
          ar: "مفردات: nggih = نعم، حسنًا (كراما)."
          en: "Words: nggih = yes, all right (krama)."
      - speaker: Mas Dimas
        text: Mas, sampeyan sing saka Mesir, kancane Pak Harsono? Aku Dimas. Ayo, tak kenalke karo simbahku!
        ar_eg: يا ماس، انت اللي من مصر، صاحب باك هارسونو؟ أنا ديماس. يلّا، هعرّفك على جدّتي!
        ar: يا ماس، أأنت القادم من مصر، صديق باك هارسونو؟ أنا ديماس. هيّا، سأعرّفك على جدّتي!
        en: Mas, are you the one from Egypt, Pak Harsono's friend? I'm Dimas. Come on, I'll introduce you to my grandma!
        note:
          ar_eg: ديماس بيكلّم كريم نجوكو مع sampeyan - مؤدّب بس قريب، زي ما الشباب بيتكلّموا مع بعض أوّل ما يتعرّفوا.
          ar: يكلّم ديماس كريمًا بالنغوكو مع sampeyan - مهذّب لكنه قريب، كما يتكلّم الشباب حين يتعارفون.
          en: Dimas speaks ngoko to Karim but with sampeyan - polite yet friendly, the way young people talk when they first meet.
  - setting:
      ar_eg: بيت خشب قديم في قرية جنب يوجياكارتا. مباه بوتري قاعدة على كنبة خشب، وقدّامها شاي ومَوز مسلوق.
      ar: بيت خشبيّ قديم في قرية قرب يوغياكارتا. تجلس مباه بوتري على أريكة خشبية، وأمامها شاي وموز مسلوق.
      en: An old wooden house in a village near Yogyakarta. Mbah Putri sits on a wooden bench with tea and boiled bananas in front of her.
    lines:
      - speaker: Mas Dimas
        text: Mas, salim rumiyin. Nyuwun astanipun Mbah.
        ar_eg: يا ماس، سلّم الأول. خد إيد جدّتي.
        ar: يا ماس، سلّم أوّلًا. خذ يد الجدّة.
        en: Mas, salim first. Take Grandma's hand.
        note:
          ar_eg: salim - بتمسك إيد الكبير وتقرّبها من مناخيرك أو جبينك، علامة احترام. وasta = إيد (كراما إنجيل، بدل tangan).
          ar: salim - تمسك يد الكبير وتقرّبها من أنفك أو جبينك، علامة احترام. وasta = يد (كراما إنغيل، بدل tangan).
          en: salim - you take an elder's hand and bring it to your nose or forehead, a sign of respect. asta = hand (krama inggil, instead of tangan).
      - speaker: Karim
        text: Nuwun sewu, Mbah. Asmanipun panjenengan sinten?
        ar_eg: لا مؤاخذة يا حاجّة. اسم حضرتك إيه؟
        ar: عذرًا يا جدّة. ما اسمكِ الكريم؟
        en: Excuse me, Grandma. What is your name?
        note:
          ar_eg: asma = اسم (كراما إنجيل). نام بالجاوي العادي jeneng، وبالكراما nami، وللكبير asma.
          ar: asma = اسم (كراما إنغيل). وبالجاوية العادية jeneng، وبالكراما nami، وللكبير asma.
          en: asma = name (krama inggil). Plain Javanese jeneng, krama nami, and for an elder, asma.
      - speaker: Mbah Putri
        text: Nami kula Putri, Nak. Tiyang-tiyang nyebut kula Mbah Putri.
        ar_eg: اسمي بوتري يا ابني. الناس بيقولولي مباه بوتري.
        ar: اسمي بوتري يا بنيّ. يناديني الناس مباه بوتري.
        en: My name is Putri, dear. People call me Mbah Putri.
      - speaker: Karim
        text: Dalemipun Mbah sae sanget. Yuswanipun Mbah pinten, menawi kepareng?
        ar_eg: بيتك حلو أوي يا حاجّة. وسنّك قدّ إيه، لو تسمحي؟
        ar: بيتكِ جميل جدًّا يا جدّة. وكم عمرك، إن سمحتِ؟
        en: Your home is lovely, Grandma. And how old are you, if I may ask?
        note:
          ar_eg: dalem = بيت (للكبير)، وyuswa = سنّ / عُمر (للكبير). وmenawi kepareng = «لو تسمح».
          ar: dalem = بيت (للكبير)، وyuswa = عمر (للكبير). وmenawi kepareng = «إن سمحت».
          en: dalem = house (honorific), yuswa = age (honorific). menawi kepareng = "if I may".
      - speaker: Mbah Putri
        text: Umur kula pitung dasa gangsal. Lho, Nak Karim pinter basa, nggih.
        ar_eg: عمري خمسة وسبعين. يا سلام، كريم شاطر في اللغة.
        ar: عمري خمسة وسبعون. عجبًا، كريم بارع في اللغة.
        en: I'm seventy-five. Well, Karim is good with language, isn't he.
      - speaker: Mas Dimas
        text: Mas, delengen. Mbah ngendika "umur kula", dudu "yuswa kula".
        ar_eg: يا ماس، شوف. جدّتي قالت «umur kula»، مش «yuswa kula».
        ar: يا ماس، انظر. قالت جدّتي «umur kula»، لا «yuswa kula».
        en: Mas, look. Grandma said "umur kula", not "yuswa kula".
      - speaker: Karim
        text: Merga kanggo awake dhewe, ora oleh krama inggil. Aku wis sinau iku wingi!
        ar_eg: عشان على نفسك ماينفعش كراما إنجيل. أنا اتعلّمت الدرس ده إمبارح!
        ar: لأنّه لا تجوز الكراما إنغيل عن النفس. تعلّمت هذا الدرس أمس!
        en: Because you can't use krama inggil about yourself. I learned that lesson yesterday!
