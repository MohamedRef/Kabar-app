questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: باك سلامت بيبيع إيه؟
      ar: ماذا يبيع باك سلامت؟
      en: What does Pak Slamet sell?
    options: ["batik", "salaka", "tempe"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Nuwun sewu, Mbah. ___ panjenengan sinten?
    meaning:
      ar_eg: لا مؤاخذة يا حاجّة. اسم حضرتك إيه؟
      ar: عذرًا يا جدّة. ما اسمكِ الكريم؟
      en: Excuse me, Grandma. What is your name?
    answers: [Asmanipun]
    options: ["Asmanipun", "Jenengmu", "Namanipun"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: مباه بوتري قالت «umur kula» مش «yuswa kula» ليه؟
      ar: لماذا قالت مباه بوتري «umur kula» لا «yuswa kula»؟
      en: Why did Mbah Putri say "umur kula", not "yuswa kula"?
    options: ["Krama inggil is never used about yourself.", "Yuswa is ngoko.", "She forgot the word."]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Dalemipun Mbah sae sanget.
    answers_meaning:
      ar_eg: ["بيتك حلو أوي يا حاجّة.", "بيت حضرتك جميل جدًّا يا جدّة."]
      ar: ["بيتكِ جميل جدًّا يا جدّة."]
      en: ["Your home is lovely, Grandma.", "Grandma, your house is very beautiful."]
next:
  ar_eg: ديماس بياخد كريم الكراتون، قصر السلطان. هناك بيقابلوا باك ساسترو، خادم القصر... وكريم بيتعلّم إزاي «يوطّي نفسه» بالكلام.
  ar: يأخذ ديماس كريمًا إلى الكراتون، قصر السلطان. وهناك يلتقيان باك ساسترو، خادم القصر... ويتعلّم كريم كيف «يتواضع» بالكلام.
  en: Dimas takes Karim to the Kraton, the Sultan's palace. There they meet Pak Sastro, a palace servant... and Karim learns how to "lower himself" in speech.
review:
  status: draft
  verified: false
  notes: Mas Dimas is Mbah Putri's grandson per the registry; Pak Slamet appears at Malioboro as in j4.u02 and returns in J6. Asking an elder's age is shown with "menawi kepareng" to soften it.
