language: id
level: bipa4
unlock_after: bipa4.u03
title:
  target: Kota Seribu Menara
  ar_eg: مدينة الألف مدنة
  ar: مدينة الألف مئذنة
  en: City of a Thousand Minarets
summary:
  ar_eg: پاك بودي وبو راهايو وصلوا القاهرة بعد أول رحلة طيران ليهم برّه إندونيسيا. وتاني يوم ساري وكريم ونادية بيفرّجوهم على الأزهر والقاهرة الإسلامية والقلعة.
  ar: يصل باك بودي وبو راهايو إلى القاهرة بعد أول رحلة جوية لهما خارج إندونيسيا. وفي اليوم التالي يطوف بهما ساري وكريم ونادية في الأزهر والقاهرة الإسلامية والقلعة.
  en: Pak Budi and Bu Rahayu land in Cairo after their first flight abroad. The next day, Sari, Karim and Nadia show them Al-Azhar, Islamic Cairo and the Citadel.
cast: [Sari, Pak Budi, Nadia, Bu Rahayu, Karim]
scenes:
  - setting:
      ar_eg: مطار القاهرة الدولي، الساعة ٢ بالليل. ساري ونادية وكريم مستنّيين في صالة الوصول.
      ar: مطار القاهرة الدولي، الساعة الثانية فجرًا. تنتظر ساري ونادية وكريم في صالة الوصول.
      en: Cairo International Airport, 2 a.m. Sari, Nadia and Karim are waiting in the arrivals hall.
    lines:
      - speaker: Narrator
        text: Dari Surabaya ke Jakarta, lalu dari Jakarta ke Kairo. Mudik terbalik, kali ini orang tua yang pergi ke anaknya.
        ar_eg: من سورابايا لجاكرتا، ومن جاكرتا للقاهرة. «مودِك بالعكس» - المرة دي الأهل هما اللي مسافرين لبنتهم.
        ar: من سورابايا إلى جاكرتا، ثم من جاكرتا إلى القاهرة. إنها «عودة معكوسة» - هذه المرّة يسافر الوالدان إلى ابنتهما.
        en: Surabaya to Jakarta, then Jakarta to Cairo. A mudik in reverse - this time the parents travel to their child.
        note:
          ar_eg: mudik هو رجوع الناس لبلدهم في العيد. وmudik terbalik (مودِك بالعكس) لما الأهل هما اللي بيسافروا لولادهم في المدينة أو برّه البلد.
          ar: mudik هي عودة الناس إلى قراهم في العيد. وmudik terbalik (العودة المعكوسة) حين يسافر الآباء إلى أبنائهم في المدينة أو في الخارج.
          en: mudik is the trip home to your village for Lebaran. mudik terbalik, "reverse mudik", is when the parents travel to their children in the city or abroad.
      - speaker: Sari
        text: Bapak! Ibu! Selamat datang di Kairo!
        ar_eg: بابا! ماما! أهلًا بيكم في القاهرة!
        ar: أبي! أمي! مرحبًا بكما في القاهرة!
        en: Dad! Mum! Welcome to Cairo!
      - speaker: Pak Budi
        text: Nduk... rasanya Bapak udah duduk di pesawat seratus tahun!
        ar_eg: يا بنتي... حاسس إني قاعد في الطيارة بقالي مية سنة!
        ar: يا ابنتي... أشعر أنني جلست في الطائرة مئة عام!
        en: Sweetheart... I feel like I've been sitting on that plane for a hundred years!
        note:
          ar_eg: ده اسمه hiperbola (مبالغة) - زي ما بنقول «مستنيك بقالي ساعة» واحنا مستنيين خمس دقايق. الإندونيسيين بيحبّوها في الكلام زينا بالظبط. وudah = sudah.
          ar: هذه hiperbola (مبالغة)، كقولنا «أنتظرك منذ دهر» ونحن ننتظر دقائق. ويحبّها الإندونيسيون في كلامهم مثلنا تمامًا.
          en: That's hiperbola (hyperbole) - like saying "I've been waiting forever" after five minutes. Indonesians love it as much as Egyptians do. udah = sudah (already).
      - speaker: Nadia
        text: Ahlan wa sahlan, Pak Budi, Bu Rahayu! Akhirnya kita ketemu juga, nggak di layar HP lagi!
        ar_eg: أهلًا وسهلًا يا پاك بودي ويا بو راهايو! أخيرًا اتقابلنا، ومش على شاشة الموبايل!
        ar: أهلًا وسهلًا يا باك بودي ويا بو راهايو! أخيرًا التقينا، لا على شاشة الهاتف!
        en: Ahlan wa sahlan, Pak Budi, Bu Rahayu! We finally meet - and not on a phone screen!
      - speaker: Bu Rahayu
        text: Nadia! Kamu lebih cantik lho daripada di video.
        ar_eg: نادية! انتي أحلى من الفيديو.
        ar: نادية! أنتِ أجمل ممّا تبدين في الفيديو.
        en: Nadia! You're even prettier than on video.
      - speaker: Karim
        text: Pak, Bu, kopernya biar saya bawain.
        ar_eg: يا پاك، يا بو، سيبوا الشنط أشيلهالكم.
        ar: يا باك، يا بو، دعاني أحمل الحقائب عنكما.
        en: Pak, Bu, let me carry the suitcases for you.
        note:
          ar_eg: -kan هنا معناها «عشان حدّ / بدل حدّ» - bawa (يشيل) → membawakan (يشيل لحدّ)، masak → memasakkan (يطبخ لحدّ)، beli → membelikan (يشتري لحدّ). وفي الكلام -kan دي بتبقى -in - bawain = bawakan، masakin = masakkan، fotoin = fotokan.
          ar: تعني -kan هنا «لأجل أحد» - bawa (يحمل) ← membawakan (يحمل لأحد)، masak ← memasakkan (يطبخ لأحد)، beli ← membelikan (يشتري لأحد).
          en: -kan here means "for someone" - bawa (carry) → membawakan (carry for someone), masak → memasakkan (cook for someone), beli → membelikan (buy for someone). In everyday speech this -kan becomes -in - bawain = bawakan, masakin = masakkan, fotoin = fotokan.
      - speaker: Pak Budi
        text: Makasih, Mas Karim. Pesawatnya tadi besar banget, kayak rumah terbang!
        ar_eg: متشكّر يا ماس كريم. الطيارة كانت كبيرة أوي، زي بيت بيطير!
        ar: شكرًا يا ماس كريم. كانت الطائرة ضخمة جدًّا، كأنها بيت طائر!
        en: Thank you, Mas Karim. That plane was enormous, like a flying house!
        note:
          ar_eg: kayak = seperti (زي) - التشبيه في الكلام اليومي.
          ar: kayak = seperti (مثل) - أداة التشبيه في الكلام اليومي.
          en: kayak = seperti (like) - the everyday way to make a simile.
      - speaker: Bu Rahayu
        text: Bapak juga ngabisin semua kacang di pesawat.
        ar_eg: وبابا خلّص كل الفول السوداني اللي في الطيارة.
        ar: وقد أنهى أبوكِ كلّ الفول السوداني في الطائرة.
        en: And your dad ate every last peanut on the plane.
        note:
          ar_eg: ngabisin = menghabiskan (يخلّص) - في الكلام بنشيل me- وبنقول -in بدل -kan.
          ar: ngabisin = menghabiskan (أنهى) - في الكلام تسقط me- وتحلّ -in محلّ -kan.
          en: ngabisin = menghabiskan (to finish off) - speech drops me- and uses -in for -kan.
      - speaker: Sari
        text: Yuk pulang. Hagga Fatma udah masakin molokhia buat Bapak sama Ibu. Kamarnya juga udah siap!
        ar_eg: يلا نروّح. الحاجّة فاطمة طبختلكم ملوخية. والأوضة كمان جاهزة!
        ar: هيّا إلى البيت. لقد طبخت الحاجّة فاطمة الملوخية لكما، والغرفة جاهزة أيضًا!
        en: Let's go home. Hagga Fatma has cooked molokhia for you, and your room is ready too!
        note:
          ar_eg: فاكرين؟ الحاجّة فاطمة قالت في العيد إن الأوضة اللي عندها لسه فاضية. أهي استنّت پاك بودي لحد ما جه! وmasakin = memasakkan (يطبخ لحدّ)، udah = sudah.
          ar: أتذكرون؟ قالت الحاجّة فاطمة في العيد إنّ الغرفة في بيتها ما زالت شاغرة. وها هي قد انتظرت باك بودي حتى جاء!
          en: Remember? At Lebaran, Hagga Fatma said the room at her house was still free. It waited for Pak Budi after all! masakin = memasakkan (cook for someone), udah = sudah.
  - setting:
      ar_eg: تاني يوم الصبح. شارع الأزهر في القاهرة الإسلامية، وبعد كده القلعة على جبل المقطم.
      ar: صباح اليوم التالي. شارع الأزهر في القاهرة الإسلامية، ثم القلعة على جبل المقطم.
      en: The next morning. Al-Azhar Street in Islamic Cairo, then the Citadel on the Muqattam hills.
    lines:
      - speaker: Sari
        text: Pak, Bu, ini kampus Sari. Masjid Al-Azhar dibangun lebih dari seribu tahun yang lalu, pada zaman Fatimiyah.
        ar_eg: بابا، ماما، دي جامعتي. الجامع الأزهر اتبنى من أكتر من ألف سنة، أيام الفاطميين.
        ar: أبي، أمي، هذه جامعتي. بُني الجامع الأزهر قبل أكثر من ألف عام، في العصر الفاطمي.
        en: Dad, Mum, this is my campus. Al-Azhar Mosque was built more than a thousand years ago, in the Fatimid era.
        note:
          ar_eg: الأزهر اتأسّس سنة ٩٧٠م تقريبًا، وهو من أقدم الجامعات في العالم. وفيه آلاف الطلبة الإندونيسيين، ومن أكبر الجاليات الطلابية الأجنبية هناك.
          ar: أُسّس الأزهر نحو سنة ٩٧٠م، وهو من أقدم الجامعات في العالم. ويدرس فيه آلاف الطلاب الإندونيسيين، وهم من أكبر الجاليات الطلابية الأجنبية فيه.
          en: Al-Azhar was founded around 970 CE and is one of the oldest universities in the world. Thousands of Indonesians study there, one of its largest foreign student communities.
      - speaker: Pak Budi
        text: Seribu tahun... Waktu itu Madiun belum ada!
        ar_eg: ألف سنة... ساعتها ماديون نفسها مكانتش لسه موجودة!
        ar: ألف عام... في ذلك الوقت لم تكن ماديون قد وُجدت بعد!
        en: A thousand years... Madiun didn't even exist back then!
      - speaker: Bu Rahayu
        text: Menaranya banyak banget, kayak hutan menara.
        ar_eg: المدن كتير أوي، زي غابة مدن.
        ar: المآذن كثيرة جدًّا، كأنها غابة من المآذن.
        en: There are so many minarets, like a forest of minarets.
        note:
          ar_eg: seperti (زي) وbagaikan (كأنه) أدوات التشبيه (simile). وفي الكلام بنقول kayak بدل seperti. وmenara (مدنة/منارة) أصلها عربي - «منارة».
          ar: seperti (مثل) وbagaikan (كأنّ) أداتا تشبيه. وأصل menara (مئذنة) عربي - «منارة».
          en: seperti (like) and bagaikan (as if) introduce a simile; speech says kayak for seperti. menara (minaret, tower) comes from Arabic منارة.
      - speaker: Nadia
        text: Makanya Kairo disebut "kota seribu menara", Bu.
        ar_eg: عشان كده القاهرة اسمها «مدينة الألف مدنة» يا بو.
        ar: لهذا تُسمّى القاهرة «مدينة الألف مئذنة» يا بو.
        en: That's why Cairo is called "the city of a thousand minarets", Bu.
      - speaker: Narrator
        text: Siang harinya, mereka naik ke Benteng Salahuddin di atas bukit.
        ar_eg: بعد الضهر، طلعوا قلعة صلاح الدين اللي فوق التلّ.
        ar: وبعد الظهر صعدوا إلى قلعة صلاح الدين فوق التلّ.
        en: That afternoon, they climb up to Saladin's Citadel on the hill.
      - speaker: Karim
        text: Saya ceritakan sedikit, ya. Benteng ini dibangun oleh Salahuddin al-Ayyubi. Masjid di atas itu Masjid Muhammad Ali, terbuat dari batu pualam.
        ar_eg: أحكيلكم شوية. القلعة دي بناها صلاح الدين الأيوبي. والجامع اللي فوق ده جامع محمد علي، معمول من المرمر.
        ar: سأحكي لكم قليلًا. بنى هذه القلعة صلاح الدين الأيوبي، والمسجد في الأعلى هو مسجد محمد علي، وهو مبنيّ من المرمر.
        en: Let me tell you a little. This citadel was built by Saladin. The mosque up there is the Muhammad Ali Mosque, made of alabaster.
        note:
          ar_eg: صلاح الدين بدأ بناء القلعة حوالي سنة ١١٧٦م. وجامع محمد علي اتبنى في القرن ١٩، والناس بيسمّوه «جامع المرمر». وmenceritakan = يحكي (cerita + meN-kan).
          ar: بدأ صلاح الدين بناء القلعة نحو سنة ١١٧٦م، وبُني مسجد محمد علي في القرن التاسع عشر، ويُسمّى «مسجد المرمر». وmenceritakan تعني يحكي (cerita مع meN-kan).
          en: Saladin began the Citadel around 1176 CE; the Muhammad Ali Mosque was built in the 19th century and is nicknamed the Alabaster Mosque. menceritakan = to tell (cerita + meN-kan).
      - speaker: Pak Budi
        text: Aduh, tangganya seribu! Kaki Bapak rasanya mau copot!
        ar_eg: يا خبر، السلالم ألف سلّمة! رجليّ هتتخلع!
        ar: يا إلهي، الدرجات ألف درجة! أشعر أنّ ساقيّ ستنخلعان!
        en: Oh dear, there are a thousand steps! My legs are about to fall off!
      - speaker: Sari
        text: Bapak berlebihan. Bapak kan udah jalan pagi tiap hari sama Karim dan Bayu.
        ar_eg: انت بتبالغ يا بابا. ما انت بتتمشّى كل يوم الصبح مع كريم وبايو.
        ar: أنت تبالغ يا أبي. ألستَ تمشي كلّ صباح مع كريم وبايو؟
        en: You're exaggerating, Dad. You've been walking every morning with Karim and Bayu.
        note:
          ar_eg: udah = sudah، وsama = bersama، dengan (مع) - كلام كل يوم. وtiap hari = كل يوم.
          ar: udah = sudah، وsama = bersama، dengan (مع) في الكلام اليومي. وtiap hari = كل يوم.
          en: udah = sudah, sama = bersama, dengan (with) - everyday speech. tiap hari = every day.
      - speaker: Nadia
        text: Lihat deh, Pak! Kalau udaranya cerah, dari sini piramida kelihatan.
        ar_eg: بصّ يا پاك! لما الجو بيبقى صافي، الأهرامات بتبان من هنا.
        ar: انظر يا باك! حين يكون الجوّ صافيًا تظهر الأهرامات من هنا.
        en: Look, Pak! When the air is clear, you can see the pyramids from here.
      - speaker: Pak Budi
        text: Masyaallah... Mas Karim, tolong fotoin kami ya. Buat Bayu di Madiun.
        ar_eg: ما شاء الله... يا ماس كريم، صوّرنا لو سمحت. عشان بايو اللي في ماديون.
        ar: ما شاء الله... يا ماس كريم، صوّرنا من فضلك. من أجل بايو في ماديون.
        en: Masyaallah... Mas Karim, please take a photo of us. For Bayu back in Madiun.
        note:
          ar_eg: fotoin = fotokan (صوّرلنا) - -in في الكلام مكان -kan. وفي الكتابة tolong fotokan kami.
          ar: fotoin = fotokan (صوِّرنا) - -in في الكلام بدل -kan، وفي الكتابة tolong fotokan kami.
          en: fotoin = fotokan (take a photo for) - speech uses -in for -kan; in writing, tolong fotokan kami.
