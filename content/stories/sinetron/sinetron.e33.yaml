questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: مين طبخ ملوخية لپاك بودي وبو راهايو؟
      ar: من طبخ الملوخية لباك بودي وبو راهايو؟
      en: Who cooked molokhia for Pak Budi and Bu Rahayu?
    options: ["Nadia", "Sari", "Hagga Fatma", "Karim"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Pesawatnya tadi besar banget, ___ rumah terbang!
    meaning:
      ar_eg: الطيارة كانت كبيرة أوي، زي بيت بيطير!
      ar: كانت الطائرة ضخمة جدًّا، كأنها بيت طائر!
      en: That plane was enormous, like a flying house!
    answers: [seperti]
    options: ["seperti", "sejak", "selama"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: الجملة دي فيها إيه - «Kaki Bapak rasanya mau copot!»؟
      ar: ماذا في هذه الجملة - «Kaki Bapak rasanya mau copot!»؟
      en: What is going on in "Kaki Bapak rasanya mau copot!"?
    options: ["Simile (perbandingan dengan seperti)", "Hiperbola (berlebihan)", "Pertanyaan"]
    answer: 1
  - id: q04
    type: listen
    text: Masjid Al-Azhar dibangun lebih dari seribu tahun yang lalu, pada zaman Fatimiyah.
    question:
      ar_eg: الجامع الأزهر اتبنى إمتى؟
      ar: متى بُني الجامع الأزهر؟
      en: When was Al-Azhar Mosque built?
    options: ["seratus tahun yang lalu", "pada zaman Salahuddin", "pada abad kesembilan belas", "lebih dari seribu tahun yang lalu"]
    answer: 3
    meaning:
      ar_eg: الجامع الأزهر اتبنى من أكتر من ألف سنة، أيام الفاطميين.
      ar: بُني الجامع الأزهر قبل أكثر من ألف عام، في العصر الفاطمي.
      en: Al-Azhar Mosque was built more than a thousand years ago, in the Fatimid era.
  - id: q05
    type: translate
    direction: from_target
    source_text: Mas Karim, tolong fotoin kami ya.
    answers_meaning:
      ar_eg: ["يا ماس كريم، صوّرنا لو سمحت.", "يا كريم، ممكن تصوّرنا؟", "يا ماس كريم، اعملّنا صورة من فضلك."]
      ar: ["يا ماس كريم، صوّرنا من فضلك.", "يا كريم، التقط لنا صورة من فضلك.", "يا ماس كريم، هلّا صوّرتنا؟"]
      en: ["Mas Karim, please take a photo of us.", "Karim, could you take our picture, please?", "Mas Karim, please take a picture of us."]
next:
  ar_eg: في ماديون، تليفون الوارونج بيرنّ. واحدة صحفية قرت جواب بايو... وعايزة تيجي تصوّر.
  ar: في ماديون يرنّ هاتف الوارونغ. صحفية قرأت رسالة بايو... وتريد أن تأتي للتصوير.
  en: In Madiun, the warung phone rings. A journalist has read Bayu's letter... and wants to come and film.
