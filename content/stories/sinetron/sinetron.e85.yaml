title:
  target: Kula, sampeyan, panjenengan
  ar_eg: أنا، انت، حضرتك
  ar: أنا، أنت، حضرتك
  en: I, you, and you (sir)
summary:
  ar_eg: في سوق كرانجان، كريم بيقابل بو سيتي، بيّاعة الفاكهة والتمپيه، وبيعرّف نفسه بالكراما لأول مرة - kula بدل aku. بو سيتي بتوريه إمتى تقول sampeyan وإمتى panjenengan... وبتكشف إنها عارفة پاك هارجو كويس أوي.
  ar: في سوق كرانغان يلتقي كريم ببو سيتي، بائعة الفاكهة والتمبيه، ويعرّف نفسه بالكراما لأوّل مرّة - kula بدل aku. وتريه بو سيتي متى يقول sampeyan ومتى panjenengan... وتكشف أنّها تعرف باك هارجو جيّدًا.
  en: At Pasar Kranggan, Karim meets Bu Siti, who sells fruit and tempe, and introduces himself in krama for the first time - kula instead of aku. Bu Siti shows him when to say sampeyan and when panjenengan... and reveals she knows Pak Harjo very well.
cast: [Karim, Bu Siti]
scenes:
  - setting:
      ar_eg: سوق كرانجان في جوجا، الصبح. سوق قديم جنب التوجو. بو سيتي قاعدة ورا أكوام سلّاك ومانجا وتمپيه ملفوف في ورق الموز.
      ar: سوق كرانغان في جوغجا، صباحًا. سوق قديم قرب التوغو. تجلس بو سيتي خلف أكوام من السلاك والمانجو والتمبيه الملفوف بورق الموز.
      en: Pasar Kranggan in Jogja, in the morning. An old market near the Tugu. Bu Siti sits behind heaps of salak, mangoes and tempe wrapped in banana leaves.
    lines:
      - speaker: Karim
        text: Sugeng enjing, Bu. Kula Karim, saking Mesir.
        ar_eg: صباح الخير يا مدام. أنا كريم، من مصر.
        ar: صباح الخير يا سيدتي. أنا كريم، من مصر.
        en: Good morning, ma'am. I'm Karim, from Egypt.
        note:
          ar_eg: kula = أنا (كراما)، بدل aku. وsaking = من (كراما)، بدل saka. ومع حدّ غريب أو أكبر منك، kula دايمًا أأمن.
          ar: kula = أنا (كراما)، بدل aku. وsaking = من (كراما)، بدل saka. ومع الغريب أو الأكبر سنًّا، kula هي الأسلم دائمًا.
          en: kula = I (krama), instead of aku. saking = from (krama), instead of saka. With a stranger or someone older, kula is always safe.
      - speaker: Bu Siti
        text: Wah, saking Mesir! Sugeng rawuh, Mas. Basa Jawanipun sae sanget.
        ar_eg: يا سلام، من مصر! أهلًا بيك يا أستاذ. جاويّك حلو أوي.
        ar: رائع، من مصر! أهلًا بك يا أستاذ. جاويّتك جيّدة جدًّا.
        en: Oh, from Egypt! Welcome, Mas. Your Javanese is very good.
      - speaker: Karim
        text: Matur nuwun, Bu. Sampeyan sade menapa?
        ar_eg: متشكّر يا مدام. حضرتك بتبيعي إيه؟
        ar: شكرًا يا سيدتي. ماذا تبيعين؟
        en: Thank you, ma'am. What do you sell?
        note:
          ar_eg: sampeyan = انت (كراما عادي)، مؤدّب ومستعمل كل يوم، مناسب مع البيّاعين واللي في سنّك ومش قريب منك. وsade = يبيع (كراما)، بدل adol.
          ar: sampeyan = أنت (كراما عادية)، مهذّبة ويوميّة، مناسبة مع الباعة ومن في سنّك من غير المقرّبين. وsade = يبيع (كراما)، بدل adol.
          en: sampeyan = you (everyday krama), polite and common, fine with sellers and people your age you're not close to. sade = sell (krama), instead of adol.
      - speaker: Bu Siti
        text: Kula sade woh-wohan lan tempe. Menika salak, menika pelem.
        ar_eg: أنا ببيع فاكهة وتمپيه. دي سلّاك، ودي مانجا.
        ar: أبيع الفاكهة والتمبيه. هذه سلاك، وهذه مانجو.
        en: I sell fruit and tempe. This is salak, this is mango.
      - speaker: Karim
        text: Salak? Kulitipun kados ula!
        ar_eg: سلّاك؟ قشرتها شبه التعبان!
        ar: سلاك؟ قشرتها مثل الأفعى!
        en: Salak? The skin looks like a snake!
        note:
          ar_eg: salak فاكهة إندونيسية قشرتها بنّي ومقشّرة زي جلد التعبان، عشان كده بالإنجليزي اسمها snake fruit. وkados = زي (كراما).
          ar: salak فاكهة إندونيسية قشرتها بنّية متقشّرة كجلد الأفعى، ولذلك تسمّى بالإنجليزية snake fruit. وkados = مثل (كراما).
          en: salak is an Indonesian fruit with scaly brown skin like a snake's, hence "snake fruit". kados = like (krama).
  - setting:
      ar_eg: بو سيتي بتقشّر سلّاكة لكريم. ست كبيرة أوي ماشية ببطء بتعدّي قدّام الفرشة.
      ar: تقشّر بو سيتي حبّة سلاك لكريم. وتمرّ امرأة مسنّة جدًّا ببطء أمام البسطة.
      en: Bu Siti peels a salak for Karim. A very old woman walks slowly past the stall.
    lines:
      - speaker: Bu Siti
        text: Mbah, panjenengan badhe tindak pundi? Ngatos-atos, nggih.
        ar_eg: يا حاجّة، حضرتك رايحة فين؟ خلّي بالك من نفسك.
        ar: يا جدّة، إلى أين تذهبين يا سيدتي؟ انتبهي لنفسك.
        en: Grandma, where are you off to? Do take care.
      - speaker: Karim
        text: Bu, kenging menapa sampeyan nyebut "panjenengan" dhateng Mbah, nanging "sampeyan" dhateng kula?
        ar_eg: يا مدام، ليه بتقولي للحاجّة «panjenengan»، وليّا أنا «sampeyan»؟
        ar: يا سيدتي، لماذا تقولين للجدّة «panjenengan»، ولي «sampeyan»؟
        en: Ma'am, why do you say "panjenengan" to Grandma, but "sampeyan" to me?
      - speaker: Bu Siti
        text: Mbah punika sepuh lan kinurmatan. Sampeyan taksih enem, Mas.
        ar_eg: الحاجّة كبيرة ومحترمة. وانت لسه صغيّر يا أستاذ.
        ar: الجدّة مسنّة ومحترمة. وأنت ما زلت شابًّا يا أستاذ.
        en: Grandma is elderly and respected. You're still young, Mas.
        note:
          ar_eg: panjenengan للكبار والناس اللي بتكرّمهم (المدرّس، الجدّ، المدير). sampeyan مؤدّب بس عادي. واللي بيتكلّم عنه (هو / هي) بالكراما = piyambakipun.
          ar: panjenengan للكبار ومن تكرّمهم (المعلّم، الجدّ، المدير). وsampeyan مهذّبة لكنها عادية. والغائب (هو / هي) بالكراما = piyambakipun.
          en: panjenengan is for elders and people you honour (teacher, grandparent, boss). sampeyan is polite but everyday. The third person (he / she) in krama is piyambakipun.
      - speaker: Karim
        text: Kula mangertos. Guru kula Pak Harjo. Piyambakipun sepuh.
        ar_eg: فهمت. مدرّسي پاك هارجو. هو راجل كبير.
        ar: فهمت. معلّمي باك هارجو. إنه رجل مسنّ.
        en: I see. My teacher is Pak Harjo. He's elderly.
      - speaker: Bu Siti
        text: Pak Harjo? Lho, piyambakipun langganan kula! Saben Rebo tumbas tempe.
        ar_eg: پاك هارجو؟ يا سلام، ده زبوني الدايم! كل أربع بيشتري تمپيه.
        ar: باك هارجو؟ عجبًا، إنه زبوني الدائم! كلّ أربعاء يشتري التمبيه.
        en: Pak Harjo? Oh, he's one of my regulars! He buys tempe every Wednesday.
      - speaker: Karim
        text: Menawi mekaten, kula tumbas tempe kagem Pak Harjo.
        ar_eg: يبقى خلاص، هشتري تمپيه لپاك هارجو.
        ar: إذن سأشتري التمبيه لباك هارجو.
        en: In that case, I'll buy tempe for Pak Harjo.
        note:
          ar_eg: kagem = عشان / لـ، بس للكبار بس (كراما إنجيل). كريم قالها صحّ - التمپيه «لپاك هارجو» المحترم.
          ar: kagem = من أجل / لـ، لكن للكبار فقط (كراما إنغيل). وقد قالها كريم صحيحةً - التمبيه «لباك هارجو» المحترم.
          en: kagem = for, but only for respected people (krama inggil). Karim got it right - tempe "for the honoured Pak Harjo".
new_words:
  - word: kula
    pos: pronoun
    ar_eg: أنا (كراما)
    ar: أنا (كراما)
    en: I (krama)
  - word: sampeyan
    pos: pronoun
    ar_eg: انت (كراما عادي)
    ar: أنت (كراما عادية)
    en: you (everyday krama)
  - word: piyambakipun
    pos: pronoun
    ar_eg: هو / هي (كراما)
    ar: هو / هي (كراما)
    en: he, she (krama)
  - word: sade
    pos: verb
    ar_eg: يبيع (كراما)
    ar: يبيع (كراما)
    en: sell (krama)
  - word: sepuh
    pos: adjective
    ar_eg: كبير في السنّ (كراما)
    ar: مسنّ (كراما)
    en: elderly (krama)
  - word: kagem
    pos: preposition
    ar_eg: عشان / لـ (للكبار)
    ar: من أجل (للكبار)
    en: for (a respected person)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: بو سيتي بتبيع إيه؟
      ar: ماذا تبيع بو سيتي؟
      en: What does Bu Siti sell?
    options: ["batik", "woh-wohan lan tempe", "kopi"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: ___ Karim, saking Mesir.
    meaning:
      ar_eg: أنا كريم، من مصر.
      ar: أنا كريم، من مصر.
      en: I'm Karim, from Egypt.
    answers: [Kula]
    options: ["Kula", "Aku", "Panjenengan"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: بو سيتي بتقول «panjenengan» لمين؟
      ar: لمن تقول بو سيتي «panjenengan»؟
      en: Who does Bu Siti call "panjenengan"?
    options: ["Karim", "Mbah", "Pak Harjo's cat"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Guru kula Pak Harjo. Piyambakipun sepuh.
    answers_meaning:
      ar_eg: ["مدرّسي پاك هارجو. هو راجل كبير.", "مدرّسي پاك هارجو، وهو كبير في السنّ."]
      ar: ["معلّمي باك هارجو. إنه مسنّ."]
      en: ["My teacher is Pak Harjo. He's elderly.", "My teacher is Pak Harjo; he is old."]
next:
  ar_eg: كريم بيوصل بيت پاك هارجو في حيّ كاومان بالتمپيه. بو هارجو بتسأله «Sampun nedha؟»... وكريم لازم يردّ من غير ما يقع.
  ar: يصل كريم إلى بيت باك هارجو في حيّ كاومان ومعه التمبيه. تسأله بو هارجو «Sampun nedha؟»... وعلى كريم أن يجيب دون أن يتعثّر.
  en: Karim reaches Pak Harjo's house in Kauman with the tempe. Bu Harjo asks him "Sampun nedha?"... and Karim has to answer without tripping up.
review:
  status: draft
  verified: false
  notes: Bu Siti is the Jogja market persona (Kranggan in this episode and j3.u02, Beringharjo in j3.u05); moved from Pasar Gede, Solo, 2026-10-27. Check "kenging menapa ... nyebut" (why ... call) and Karim's "kagem Pak Harjo" as natural market krama.
