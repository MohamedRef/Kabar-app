series: sinetron
episode: 104
language: jv
level: j6
unlock_after: j6.u03
title:
  target: Sugeng rawuh ing makam
  ar_eg: أهلًا بيك في المقابر
  ar: مرحبًا بك في المقابر
  en: Welcome to the royal graves
summary:
  ar_eg: عند مقابر ملوك ماتارام في كوتاجيدي، حارس المقابر بيقول لكريم إنه مينفعش يدخل غير بلبس جاوي. كريم بيأجّر بلانكون وجاريك ويمشي بالراحة زي العريس. وعلى البوّابة بيقرا أول كلمات فيها علامات بتقفل المقطع - ng وr وh - والـpangkon اللي زي السكون.
  ar: عند مقابر ملوك ماتارام في كوتاغيدي، يخبر حارس المقابر كريمًا أنّه لا يدخل إلّا باللباس الجاويّ. يستأجر كريم بلانكون وجاريك ويمشي ببطء كالعريس. وعلى البوّابة يقرأ أولى الكلمات التي فيها علامات تُغلق المقطع - ng وr وh - والـpangkon الذي يشبه السكون.
  en: At the royal graves of Mataram in Kotagede, the caretaker tells Karim he can only enter in Javanese dress. Karim rents a blangkon and a jarik and walks slowly like a bridegroom. At the gate he reads his first words with marks that close a syllable - ng, r and h - and the pangkon, which is like sukun.
cast: [Karim, Pak Slamet, Pak Juru Kunci]
scenes:
  - setting:
      ar_eg: بوّابة مقابر ملوك ماتارام في كوتاجيدي، الصبح بدري. حيطان طوب قديمة وشجر كبير. راجل كبير لابس لبس جاوي وبلانكون قاعد جنب البوّابة.
      ar: بوّابة مقابر ملوك ماتارام في كوتاغيدي، في الصباح الباكر. جدران من الطوب القديم وأشجار كبيرة. رجل مسنّ بلباس جاويّ وبلانكون يجلس بجانب البوّابة.
      en: The gate of the royal graves of Mataram in Kotagede, early morning. Old brick walls and big trees. An elderly man in Javanese dress and a blangkon sits by the gate.
    lines:
      - speaker: Pak Juru Kunci
        text: Nyuwun pangapunten, Mas. Menawi badhe mlebet makam, kedah ngagem ageman Jawi.
        ar_eg: لا مؤاخذة يا ماس. لو عايز تدخل المقابر، لازم تلبس لبس جاوي.
        ar: عذرًا يا ماس. إن أردت دخول المقابر، فعليك أن ترتدي اللباس الجاويّ.
        en: Excuse me, Mas. If you want to enter the graves, you must wear Javanese dress.
        note:
          ar_eg: juru kunci = حارس المكان المقدّس (حرفيًّا «صاحب المفتاح»). وفي مقابر الملوك ده قانون عايش لحدّ النهارده، مش للزينة.
          ar: juru kunci = حارس المكان المقدّس (حرفيًّا «صاحب المفتاح»). وفي مقابر الملوك هذا قانون حيّ حتى اليوم، لا للزينة.
          en: juru kunci = the caretaker of a sacred place (literally "key holder"). At the royal graves this is a living rule, not a costume.
      - speaker: Karim
        text: Waduh, kula mboten gadhah, Pak.
        ar_eg: يا خبر، أنا معنديش يا پاك.
        ar: يا للمصيبة، ليس عندي يا باك.
        en: Oh no, I don't have any, Pak.
      - speaker: Pak Juru Kunci
        text: Mboten menapa. Saged nyewa wonten mriki. Blangkon, beskap, lan jarik.
        ar_eg: مفيش مشكلة. ممكن تأجّر من هنا. بلانكون وبيسكاپ وجاريك.
        ar: لا بأس. يمكنك الاستئجار من هنا. بلانكون وبيسكاب وجاريك.
        en: No problem. You can rent them here. A blangkon, a beskap and a jarik.
        note:
          ar_eg: blangkon = العمّة الجاوي المتطبّقة. beskap = الجاكيت الرسمي. jarik = قماشة باتيك طويلة بتتلفّ زي الجيبة.
          ar: blangkon = العمامة الجاوية المطويّة. وbeskap = السترة الرسمية. وjarik = قماش باتيك طويل يُلفّ كالتنّورة.
          en: blangkon = the folded Javanese headcloth. beskap = the formal jacket. jarik = a long batik cloth wrapped like a skirt.
      - speaker: Narrator
        text: Sepuluh menit sabanjure. Karim wis nganggo jarik. Mlakune alon banget, kaya penganten.
        ar_eg: بعد عشر دقايق. كريم لابس الجاريك. ماشي بالراحة أوي، زي العريس.
        ar: بعد عشر دقائق. صار كريم يرتدي الجاريك. يمشي ببطء شديد، كالعريس.
        en: Ten minutes later. Karim is wearing the jarik. He walks very slowly, like a bridegroom.
        note:
          ar_eg: "كلمات: alon = بالراحة، بطيء."
          ar: "مفردات: alon = بطيء، على مهل."
          en: "Words: alon = slow, slowly."
      - speaker: Pak Slamet
        text: Wah, sampun ngganteng, Mas! Kados priyayi Mataram.
        ar_eg: يا سلام، بقيت حلو يا ماس! زي باشوات ماتارام.
        ar: رائع، صرت وسيمًا يا ماس! كأحد أعيان ماتارام.
        en: Wow, you look handsome, Mas! Like a Mataram nobleman.
        note:
          ar_eg: "كلمات: priyayi = طبقة النبلاء والموظفين."
          ar: "مفردات: priyayi = طبقة النبلاء والموظفين."
          en: "Words: priyayi = Javanese noble and official class."
  - setting:
      ar_eg: لوحة خشب فوق البوّابة، مكتوب عليها بالحروف الجاوي. وجنبها صندوق صغيّر.
      ar: لوحة خشبية فوق البوّابة مكتوبة بالحروف الجاوية. وبجانبها صندوق صغير.
      en: A wooden board above the gate, written in Javanese script. Beside it, a small box.
    lines:
      - speaker: Karim
        text: "Su... gê... Pak, tandha alit ing nginggil ga punika menapa?"
        ar_eg: سو... جه... يا پاك، العلامة الصغيّرة اللي فوق الـga دي إيه؟
        ar: سو... غه... يا باك، ما هذه العلامة الصغيرة فوق الـga؟
        en: Su... gê... Pak, what's the little mark above the ga?
        note:
          ar_eg: "على البوّابة: ꦱꦸꦒꦼꦁꦫꦮꦸꦃ (sugeng rawuh). كلمات: nginggil = فوق (كراما)؛ tandha = علامة، إشارة؛ ga = أسماء حروف جاوية."
          ar: "على البوّابة: ꦱꦸꦒꦼꦁꦫꦮꦸꦃ (sugeng rawuh). مفردات: nginggil = فوق (كراما)؛ tandha = علامة؛ ga = أسماء حروف جاوية."
          en: "On the gate: ꦱꦸꦒꦼꦁꦫꦮꦸꦃ (sugeng rawuh). Words: nginggil = above, on top (krama); tandha = sign, mark; ga = names of Javanese letters."
      - speaker: Pak Slamet
        text: Punika cecak, "ng". Lan ingkang wonten ing pungkasan punika wignyan, "h".
        ar_eg: دي الـcecak، «ng». واللي في الآخر دي الـwignyan، «h».
        ar: هذه الـcecak، «ng». والتي في الآخر هي الـwignyan، «h».
        en: That's cecak, "ng". And the one at the end is wignyan, "h".
        note:
          ar_eg: ꦱꦸꦒꦼꦁ = sugeng (الـcecak ꦁ فوق = ng في الآخر). ꦫꦮꦸꦃ = rawuh (الـwignyan ꦃ = h في الآخر). العلامات دي بتقفل المقطع من غير ما تزوّد حرف.
          ar: ꦱꦸꦒꦼꦁ = sugeng (الـcecak ꦁ فوق = ng في الآخر). وꦫꦮꦸꦃ = rawuh (الـwignyan ꦃ = h في الآخر). هذه العلامات تُغلق المقطع دون إضافة حرف.
          en: ꦱꦸꦒꦼꦁ = sugeng (cecak ꦁ above = final ng). ꦫꦮꦸꦃ = rawuh (wignyan ꦃ = final h). These marks close the syllable without adding a letter.
      - speaker: Karim
        text: "Sugeng rawuh! Lan ing kothak punika... Bayar sukarela?"
        ar_eg: أهلًا بيك! وعلى الصندوق ده... «ادفع اللي تقدر عليه»؟
        ar: مرحبًا بك! وعلى هذا الصندوق... «ادفع تطوّعًا»؟
        en: Welcome! And on this box... "Pay what you wish"?
        note:
          ar_eg: "على الصندوق: ꦧꦪꦂꦱꦸꦏꦫꦺꦭ = bayar sukarela."
          ar: "على الصندوق: ꦧꦪꦂꦱꦸꦏꦫꦺꦭ = bayar sukarela."
          en: "On the box: ꦧꦪꦂꦱꦸꦏꦫꦺꦭ = bayar sukarela."
      - speaker: Pak Slamet
        text: Leres! Tandha ing nginggil ya punika layar, "r". Mboten perlu aksara ra malih.
        ar_eg: صحّ! العلامة اللي فوق الـya دي الـlayar، «r». مش محتاج حرف ra تاني.
        ar: صحيح! العلامة فوق الـya هي الـlayar، «r». لا حاجة إلى حرف ra آخر.
        en: Right! The mark above the ya is layar, "r". No need for another ra letter.
        note:
          ar_eg: ꦧꦪꦂ = bayar. الـlayar ꦂ شَرطة صغيّرة فوق الحرف = r في الآخر. ولأنها بتقفل المقطع، الكلمة اللي بعدها بتبتدي عادي.
          ar: ꦧꦪꦂ = bayar. الـlayar ꦂ خطّ صغير فوق الحرف = r في الآخر. ولأنها تُغلق المقطع تبدأ الكلمة التالية عاديًّا.
          en: ꦧꦪꦂ = bayar. Layar ꦂ is a small stroke above the letter = final r. Because it closes the syllable, the next word starts normally.
  - setting:
      ar_eg: جوّه المقابر. هدوء تام، وريحة ورد وبخور. على حجر صغيّر كلمة واحدة بالحروف الجاوي. پاك سلامت بيتكلّم بصوت واطي.
      ar: داخل المقابر. هدوء تامّ، ورائحة ورد وبخور. على حجر صغير كلمة واحدة بالحروف الجاوية. يتكلّم باك سلامت بصوت خافت.
      en: Inside the graves. Total quiet, the smell of flowers and incense. On a small stone, one word in Javanese script. Pak Slamet speaks softly.
    lines:
      - speaker: Karim
        text: "Ma... ka... m. Makam. Pak, punika pangkon, kados ing nama kula!"
        ar_eg: «مقام»... makam. يا پاك، دي الـpangkon، زي اللي في اسمي!
        ar: «مقام»... makam. يا باك، هذه الـpangkon، كالتي في اسمي!
        en: Makam. Pak, that's pangkon, like in my name!
        note:
          ar_eg: ꦩꦏꦩ꧀ = makam، والكلمة جاية من العربي «مقام». الـpangkon ꧀ بتموّت الحركة زي السكون بالظبط - ma-ka-m. وفي ꦏꦫꦶꦩ꧀ (Karim) نفس الحكاية.
          ar: ꦩꦏꦩ꧀ = makam، والكلمة من العربية «مقام». الـpangkon ꧀ تُميت الحركة تمامًا كالسكون - ma-ka-m. وكذلك في ꦏꦫꦶꦩ꧀ (Karim).
          en: ꦩꦏꦩ꧀ = makam, from Arabic maqam. Pangkon ꧀ kills the vowel exactly like sukun - ma-ka-m. Same in ꦏꦫꦶꦩ꧀ (Karim).
      - speaker: Pak Slamet
        text: Ssst, alon-alon, Mas. Leres. Nanging pangkon namung ing pungkasan ukara.
        ar_eg: هسّ، بالراحة يا ماس. صحّ. بس الـpangkon بتيجي في آخر الجملة بس.
        ar: صه، على مهلك يا ماس. صحيح. لكنّ الـpangkon لا تأتي إلّا في آخر الجملة.
        en: Shh, softly, Mas. Right. But pangkon only goes at the end of a sentence.
      - speaker: Karim
        text: Menawi wonten ing tengah ukara?
        ar_eg: طب ولو في نص الجملة؟
        ar: وإن كانت في وسط الجملة؟
        en: And if it's in the middle of a sentence?
      - speaker: Pak Slamet
        text: Benjing, Mas. Sakmenika kita ndedonga rumiyin.
        ar_eg: بكرة يا ماس. دلوقتي ندعي الأوّل.
        ar: غدًا يا ماس. الآن ندعو أوّلًا.
        en: Tomorrow, Mas. Now we pray first.
      - speaker: Narrator
        text: "Ing kaca telung puluh papat, Karim nulis sugeng rawuh, bayar, makam. Lan ing ngisore, \"Aja lali, jarik!\""
        ar_eg: في صفحة أربعة وتلاتين، كريم كتب «أهلًا بيك» و«ادفع» و«مقام». وتحتهم «متنساش الجاريك!»
        ar: في الصفحة الرابعة والثلاثين، كتب كريم «مرحبًا بك» و«ادفع» و«مقام». وتحتها «لا تنسَ الجاريك!»
        en: On page thirty-four, Karim writes sugeng rawuh, bayar, makam. And underneath, "Don't forget the jarik!"
        note:
          ar_eg: "في الكشكول: ꦱꦸꦒꦼꦁꦫꦮꦸꦃ، ꦧꦪꦂ، ꦩꦏꦩ꧀. كلمات: ngisore = تحته، الجزء اللي تحت."
          ar: "في الدفتر: ꦱꦸꦒꦼꦁꦫꦮꦸꦃ، ꦧꦪꦂ، ꦩꦏꦩ꧀. مفردات: ngisore = أسفله، تحته."
          en: "In the notebook: ꦱꦸꦒꦼꦁꦫꦮꦸꦃ, ꦧꦪꦂ, ꦩꦏꦩ꧀. Words: ngisore = underneath it, the bottom (of it)."
new_words:
  - word: sugeng rawuh
    ar_eg: أهلًا بيك (رسمي)
    ar: مرحبًا بك (رسميّ)
    en: welcome (polite)
  - word: cecak
    pos: noun
    ar_eg: علامة ng في الآخر (فوق)
    ar: علامة ng الأخيرة (فوق)
    en: the final ng mark (above)
  - word: layar
    pos: noun
    ar_eg: علامة r في الآخر (فوق)
    ar: علامة r الأخيرة (فوق)
    en: the final r mark (above)
  - word: wignyan
    pos: noun
    ar_eg: علامة h في الآخر
    ar: علامة h الأخيرة
    en: the final h mark
  - word: nyewa
    pos: verb
    ar_eg: يأجّر
    ar: يستأجر
    en: rent
  - word: jarik
    pos: noun
    ar_eg: قماشة باتيك بتتلفّ زي الجيبة
    ar: قماش باتيك يُلفّ كالتنّورة
    en: batik wrap cloth
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: إيه شرط الدخول للمقابر؟
      ar: ما شرط دخول المقابر؟
      en: What do you need to enter the graves?
    options: ["ageman Jawi", "karcis", "sepatu"]
    answer: 0
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: العلامة ꦃ في آخر ꦫꦮꦸꦃ بتتقري إزاي؟
      ar: كيف تُقرأ العلامة ꦃ في آخر ꦫꦮꦸꦃ؟
      en: How is the mark ꦃ at the end of ꦫꦮꦸꦃ read?
    options: ["ng", "r", "h"]
    answer: 2
  - id: q03
    type: fill_blank
    sentence: Saged ___ wonten mriki. Blangkon, beskap, lan jarik.
    meaning:
      ar_eg: ممكن تأجّر من هنا. بلانكون وبيسكاپ وجاريك.
      ar: يمكنك الاستئجار من هنا. بلانكون وبيسكاب وجاريك.
      en: You can rent them here. A blangkon, a beskap and a jarik.
    answers: [nyewa]
    options: ["nyewa", "tumbas", "ngagem"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: الـpangkon بتيجي فين حسب كلام پاك سلامت؟
      ar: أين تأتي الـpangkon بحسب كلام باك سلامت؟
      en: Where does pangkon go, according to Pak Slamet?
    options: ["ing tengah ukara", "ing pungkasan ukara", "ing wiwitan tembung"]
    answer: 1
  - id: q05
    type: translate
    direction: from_target
    source_text: Menawi badhe mlebet makam, kedah ngagem ageman Jawi.
    answers_meaning:
      ar_eg: ["لو عايز تدخل المقابر، لازم تلبس لبس جاوي.", "عشان تدخل المقابر لازم لبس جاوي."]
      ar: ["إن أردت دخول المقابر، فعليك أن ترتدي اللباس الجاويّ."]
      en: ["If you want to enter the graves, you must wear Javanese dress.", "To enter the graves you have to wear Javanese clothes."]
next:
  ar_eg: في حواري جاجالان الضيّقة، ماس ديماس بياخد كريم لصاحبه الصايغ. كريم بيكتب أول جملة كاملة ليه بالحروف الجاوي... وبيحطّ pangkon في نصّها. والصايغ بيضحك ويوريه «الحروف المستخبّية» - الـpasangan.
  ar: في أزقّة جاغالان الضيّقة يأخذ ماس ديماس كريمًا إلى صديقه الصائغ. يكتب كريم أوّل جملة كاملة له بالحروف الجاوية... ويضع pangkon في وسطها. فيضحك الصائغ ويريه «الحروف المختبئة» - الـpasangan.
  en: In the narrow lanes of Jagalan, Mas Dimas takes Karim to his silversmith friend. Karim writes his first full sentence in Javanese script... with a pangkon in the middle. The silversmith laughs and shows him the "hidden letters" - pasangan.
review:
  status: draft
  verified: false
  notes: Check the aksara strings ꦱꦸꦒꦼꦁꦫꦮꦸꦃ, ꦧꦪꦂꦱꦸꦏꦫꦺꦭ, ꦩꦏꦩ꧀ in a Javanese font. Dress rule per j6.u03 culture note; the exact rented items (blangkon, beskap or surjan, jarik) and whether visitors can rent at the Kotagede gate need a check - left general. Pak Juru Kunci is a one-off role, male voice. "Kados priyayi Mataram" - check register.
