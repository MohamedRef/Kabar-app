title:
  target: Petruk lan Gareng
  ar_eg: بتروك وجارينج
  ar: بتروك وغارينغ
  en: Petruk and Gareng
summary:
  ar_eg: ليلة وايانج كوليت (مسرح العرايس الجلد) في بيندوبو القرية مع مباه بوتري وديماس. الملك بيتكلّم كراما، وخادمه بيردّ بتواضع، والمهرّجين بتروك وجارينج بيهزّروا بالنجوكو والجمهور كله بيضحك. وتاني يوم، باليه رامايانا تحت معبد برامبانان - من غير كلام خالص.
  ar: ليلة واينغ كوليت (مسرح الظلّ بالدمى الجلدية) في بندوبو القرية مع مباه بوتري وديماس. الملك يتكلّم الكراما، وخادمه يردّ بتواضع، والمهرّجان بتروك وغارينغ يمزحان بالنغوكو فيضحك الجمهور. وفي اليوم التالي، باليه الرامايانا تحت معبد برامبانان - بلا كلام تقريبًا.
  en: A wayang kulit (shadow puppet) night in the village pendhapa with Mbah Putri and Dimas. The king speaks krama, his servant answers humbly, and the clowns Petruk and Gareng joke in ngoko while the crowd roars. Next day, the Ramayana ballet beneath Prambanan temple - almost without words.
cast: [Karim, Mbah Putri, Pak Dhalang, Mas Dimas]
scenes:
  - setting:
      ar_eg: بيندوبو في قرية مباه بوتري، بالليل. شاشة قماش أبيض ولمبة زيت وراها، والجاميلان بيعزف. الدالانج (مُحرّك العرايس) قاعد ورا الشاشة ومعاه عرايس جلد.
      ar: بندوبو في قرية مباه بوتري، ليلًا. شاشة قماش بيضاء خلفها مصباح، والغاميلان يعزف. يجلس الدالانغ (محرّك الدمى) خلف الشاشة ومعه دمى جلدية.
      en: The pendhapa in Mbah Putri's village at night. A white cloth screen lit from behind, gamelan playing. The dhalang (puppeteer) sits behind the screen with leather puppets.
    lines:
      - speaker: Mbah Putri
        text: Nak Karim, menika wayang kulit. Pak Dhalang ingkang nyuwara sedaya tokoh.
        ar_eg: يا ابني كريم، ده الوايانج كوليت. الدالانج هو اللي بيعمل صوت كل الشخصيات.
        ar: يا بنيّ كريم، هذا الواينغ كوليت. والدالانغ هو من يؤدّي أصوات كلّ الشخصيات.
        en: Karim, dear, this is wayang kulit. The dhalang voices every single character.
        note:
          ar_eg: الدالانج بيحرّك العرايس، وبيغنّي، وبيقود الجاميلان، وبيعمل كل الأصوات - أحيانًا طول الليل لحدّ الفجر.
          ar: يحرّك الدالانغ الدمى، ويغنّي، ويقود الغاميلان، ويؤدّي كلّ الأصوات - أحيانًا طوال الليل حتى الفجر.
          en: The dhalang moves the puppets, sings, cues the gamelan and does every voice - sometimes all night until dawn.
      - speaker: Pak Dhalang
        text: (Ratu) Patih, kowe wis nindakake dhawuhku?
        ar_eg: (الملك) يا وزير، نفّذت أمري؟
        ar: (الملك) يا وزير، هل نفّذت أمري؟
        en: (King) Minister, have you carried out my order?
        note:
          ar_eg: "الملك بيكلّم وزيره نجوكو - عشان هو الأعلى. وdhawuh = أمر من الكبير. كلمات: patih = الوزير الأكبر."
          ar: "يكلّم الملك وزيره بالنغوكو - لأنّه الأعلى. وdhawuh = أمر من الكبير. مفردات: patih = الوزير الأكبر."
          en: "The king speaks ngoko to his minister - he's the higher one. dhawuh = an order from above. Words: patih = chief minister, grand vizier."
      - speaker: Pak Dhalang
        text: (Patih) Sendika dhawuh, Gusti. Sampun kula lampahi.
        ar_eg: (الوزير) أمرك يا مولاي. نفّذته.
        ar: (الوزير) سمعًا وطاعة يا مولاي. لقد نفّذته.
        en: (Minister) As you command, my lord. It is done.
        note:
          ar_eg: الوزير بيردّ بكراما وبتواضع. وsendika dhawuh = «أمرك يا مولاي» - أشهر جملة طاعة في الوايانج.
          ar: يردّ الوزير بالكراما وبتواضع. وsendika dhawuh = «سمعًا وطاعة» - أشهر عبارة طاعة في الواينغ.
          en: The minister answers in humble krama. sendika dhawuh = "as you command" - wayang's classic line of obedience.
      - speaker: Pak Dhalang
        text: (Petruk) Reng, Gareng! Kowe wis mangan durung? Wetengku muni kaya gamelan!
        ar_eg: (بتروك) يا جارينج! انت كلت ولّا لسه؟ بطني بتزمّر زي الجاميلان!
        ar: (بتروك) يا غارينغ! هل أكلت أم لا؟ بطني تقرقر مثل الغاميلان!
        en: (Petruk) Oi, Gareng! Have you eaten or not? My belly's ringing like a gamelan!
        note:
          ar_eg: "كلمات: kaya = زي، كأنّ؛ muni = بيتنطق / صوته (يرنّ)."
          ar: "مفردات: kaya = مثل؛ muni = يُنطق / يرنّ."
          en: "Words: kaya = like, as = seperti; muni = to sound = berbunyi."
      - speaker: Pak Dhalang
        text: (Gareng) Durung, Truk! Sega entek dipangan Bagong!
        ar_eg: (جارينج) لسه يا بتروك! الرزّ خلص، باجونج أكله!
        ar: (غارينغ) ليس بعد يا بتروك! نفد الأرزّ، أكله باغونغ!
        en: (Gareng) Not yet, Truk! Bagong ate all the rice!
        note:
          ar_eg: "بتروك وجارينج وباجونج ولاد سيمار - الـpunakawan، الخدّامين المهرّجين. بيتكلّموا نجوكو ويهزّروا ويقولوا اللي الجمهور عايز يقوله. وفي الحقيقة سيمار أحكم واحد في الحكاية. كلمات: dipangan = يتاكل، اتاكل."
          ar: "بتروك وغارينغ وباغونغ أبناء سيمار - الـpunakawan، الخدم المهرّجون. يتكلّمون النغوكو ويمزحون ويقولون ما يريد الجمهور قوله. والحقّ أنّ سيمار أحكم شخصيات الحكاية. مفردات: dipangan = يُؤكَل، أُكِل."
          en: "Petruk, Gareng and Bagong are Semar's sons - the punakawan, the clown-servants. They speak ngoko, joke, and say what the audience is thinking. Semar himself is secretly the wisest of all. Words: dipangan = to be eaten, eaten (by)."
      - speaker: Karim
        text: Mbah, kok sedaya tiyang ngguyu?
        ar_eg: يا حاجّة، ليه كل الناس بتضحك؟
        ar: يا جدّة، لماذا يضحك الجميع؟
        en: Mbah, why is everyone laughing?
      - speaker: Mbah Putri
        text: Amargi Petruk ngendika kados tiyang biasa, Nak. Ratu ngagem basa inggil, punakawan ngagem basa padinan. Basa punika ugi lakon.
        ar_eg: عشان بتروك بيتكلّم زي الناس العادية يا ابني. الملك بيتكلّم لغة عالية، والمهرّجين بيتكلّموا لغة كل يوم. والكلام نفسه جزء من الحكاية.
        ar: لأنّ بتروك يتكلّم مثل عامّة الناس يا بنيّ. الملك يتكلّم لغة عالية، والمهرّجون يتكلّمون لغة كلّ يوم. والكلام نفسه جزء من الحكاية.
        en: Because Petruk talks like ordinary people, dear. The king uses high language, the clowns everyday language. The language is part of the play.
        note:
          ar_eg: "كلمات: lakon = البطل؛ حكاية المسرحية؛ amargi = عشان، لأن (بأدب)؛ biasa = عادي."
          ar: "مفردات: lakon = البطل؛ قصة المسرحية؛ amargi = لأنّ؛ biasa = عادي، معتاد."
          en: "Words: lakon = hero, main character; story of a play; amargi = because (polite); biasa = usual, ordinary, normal."
  - setting:
      ar_eg: تاني يوم بالليل، مسرح مفتوح قدّام معبد برامبانان المنوّر. باليه الرامايانا - راقصين ومئات النجوم، والجاميلان.
      ar: في الليلة التالية، مسرح مفتوح أمام معبد برامبانان المضاء. باليه الرامايانا - راقصون ونجوم كثيرة، والغاميلان.
      en: The next night, an open-air stage before the floodlit Prambanan temple. The Ramayana ballet - dancers, a sky full of stars, and gamelan.
    lines:
      - speaker: Mas Dimas
        text: Mas, sendratari iki meh ora nganggo omongan. Mung beksan lan gamelan.
        ar_eg: يا ماس، الباليه ده تقريبًا من غير كلام. بس رقص وجاميلان.
        ar: يا ماس، هذا الباليه بلا كلام تقريبًا. رقص وغاميلان فقط.
        en: Mas, this dance-drama has almost no words. Just dance and gamelan.
        note:
          ar_eg: "كلمات: meh = تقريبًا."
          ar: "مفردات: meh = تقريبًا."
          en: "Words: meh = almost."
      - speaker: Karim
        text: Nanging aku ngerti kabeh. Rama, Sinta, Rahwana... lan Hanoman!
        ar_eg: بس أنا فاهم كل حاجة. راما، وسينتا، ورهوانا... وهانومان!
        ar: لكنّي أفهم كلّ شيء. راما، وسينتا، ورهوانا... وهانومان!
        en: But I understand everything. Rama, Sinta, Rahwana... and Hanoman!
      - speaker: Mas Dimas
        text: Merga sampeyan wis sinau basa sing paling angel. Saiki gamelan wae gampang!
        ar_eg: عشان حضرتك اتعلّمت أصعب لغة. دلوقتي حتى الجاميلان بقى سهل!
        ar: لأنّك تعلّمت أصعب لغة. والآن حتى الغاميلان صار سهلًا!
        en: Because you've learned the hardest language. Now even gamelan is easy!
      - speaker: Narrator
        text: Kaca selawe. Basa iku uga lakon. Ngayogyakarta wis rampung. Madiun, enteni!
        ar_eg: صفحة خمسة وعشرين. الكلام كمان حكاية. يوجياكارتا خلصت. ماديون، استنّي!
        ar: الصفحة الخامسة والعشرون. الكلام أيضًا حكاية. انتهت يوغياكارتا. ماديون، انتظري!
        en: Page twenty-five. Language is a story too. Yogyakarta is done. Madiun, here we come!
