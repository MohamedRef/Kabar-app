next:
  ar_eg: رجوع لماديون، مدينة البيتشل والقطورات. مباك أيو، بنت ماديون وطالبة أدب جاوي، بتدّي كريم أصعب امتحان لحدّ دلوقتي - يقرا مقالة ويكيبيديا بالجاوي... عن القاهرة.
  ar: عودة إلى ماديون، مدينة البيتشل والقطارات. تعطي مباك أيو، ابنة ماديون وطالبة الأدب الجاوي، كريمًا أصعب امتحان حتى الآن - أن يقرأ مقالة ويكيبيديا بالجاوية... عن القاهرة.
  en: Back to Madiun, the town of pecel and trains. Mbak Ayu, a Madiun local and Javanese literature student, gives Karim his hardest test yet - reading a Javanese Wikipedia article... about Cairo.
review:
  status: draft
  verified: false
  notes: The wayang exchange is written for the story. The Prambanan Ramayana ballet is a largely wordless sendratari. Check the king's ngoko ("nindakake dhawuhku") and "Sampun kula lampahi".
