      ar: من يؤدّي أصوات كلّ الشخصيات في الواينغ؟
      en: Who voices every character in wayang?
    options: ["Ratu", "Pak Dhalang", "Petruk"]
    answer: 1
  - id: q02
    type: multiple_choice
