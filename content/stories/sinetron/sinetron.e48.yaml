questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: كام في المية من اللي جاوبوا شكلهم موافقين على الميني ماركت؟
      ar: كم بالمئة من المشاركين يبدو أنّهم يؤيّدون المتجر الصغير؟
      en: What percentage of respondents appear to support the minimarket?
    options: ["dua puluh empat persen", "delapan puluh persen", "tujuh puluh persen", "lima puluh lima persen"]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Jadi, ___ warga tidak menolak minimarket, tetapi ingin warung tetap hidup.
    meaning:
      ar_eg: فغالبًا السكّان مش رافضين الميني ماركت، بس عايزين الوارونج يفضل عايش.
      ar: فالأرجح أنّ السكّان لا يرفضون المتجر، لكنّهم يريدون أن يبقى الوارونغ حيًّا.
      en: So most likely, residents don't reject the minimarket, but they want the warung to stay alive.
    answers: [kemungkinan besar]
    options: ["padahal", "kemungkinan besar", "selain itu"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه پاك بودي مش خايف أوي من الميني ماركت في رأيك؟
      ar: في رأيك، لماذا لا يخاف باك بودي كثيرًا من المتجر الصغير؟
      en: Why do you think Pak Budi isn't very afraid of the minimarket?
    options: ["Karena dia akan menutup warungnya.", "Karena warungnya memberi sesuatu yang tidak bisa dijual minimarket - kebersamaan.", "Karena Pak Darto adalah saudaranya.", "Karena minimarket itu tidak jadi dibuka."]
    answer: 1
  - id: q04
    type: listen
    text: Anak saya baru lulus dan belum bekerja. Barangkali minimarket ini bisa membuka lapangan kerja untuk anak-anak muda di sini.
    question:
      ar_eg: پاك دارتو عايز الميني ماركت ليه؟
      ar: لماذا يريد باك دارتو المتجر الصغير؟
      en: Why does Pak Darto want the minimarket?
    options: ["supaya ada pekerjaan untuk anak-anak muda", "supaya dia bisa menjual pecel", "supaya gang lebih ramai pada malam hari", "supaya warung Pak Budi tutup"]
    answer: 0
    meaning:
      ar_eg: ابني لسّه متخرّج ومش لاقي شغل. يمكن الميني ماركت ده يفتح باب شغل لشباب الحارة.
      ar: تخرّج ابني حديثًا ولم يجد عملًا. ولعلّ هذا المتجر يوفّر فرص عمل لشباب الحيّ.
      en: My son has just graduated and hasn't found work. Perhaps this minimarket could create jobs for the young people here.
