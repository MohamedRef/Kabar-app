  ar_eg: الحارة لسّه هادية بعد الاجتماع... وفجأة، ضيف واقف على باب الوارونج لابس باتيك، وبيقول لپاك بودي - «سوغنغ دالو، پاك». بالكراما. وبغلطات.
  ar: هدأ الزقاق بعد الاجتماع... وفجأة يقف ضيف بقميص باتيك على باب الوارونغ ويقول لباك بودي - «سوغنغ دالو يا باك». بالكراما. وبأخطاء.
