title:
  target: Rezeki Tidak Akan Tertukar
  ar_eg: رزقك مش هياخده غيرك
  ar: الرزق لا يذهب إلى غير صاحبه
  en: Your Daily Bread Won't Go to Someone Else
summary:
  ar_eg: يافطة على الأرض الفاضية قصاد الوارونج - «قريبًا - ميني ماركت». الحارة كلها مقلوبة، وماس جوكو عايز يعمل مظاهرة. بايو بيعمل استبيان، وفي اجتماع السكّان الأرقام بتطلع مفاجأة، وپاك بودي بيقترح حلّ في النص.
  ar: لافتة على الأرض الخالية قبالة الوارونغ - «قريبًا - متجر صغير». الزقاق كلّه في اضطراب، وماس جوكو يريد الاحتجاج. يُجري بايو استبيانًا، وفي اجتماع السكّان تأتي الأرقام مفاجئة، ويقترح باك بودي حلًّا وسطًا.
  en: A banner on the empty lot across from the warung - "Coming soon - minimarket." The whole lane is in uproar, and Mas Joko wants to protest. Bayu runs a survey, the numbers at the residents' meeting are a surprise, and Pak Budi proposes a middle way.
cast: [Bu Tini, Bu Sri, Mas Joko, Pak Budi, Bayu, Bu Rahayu, Pak RT, Pak Darto]
scenes:
  - setting:
      ar_eg: ماديون، الوارونج الضهر. قصاد الوارونج، على الأرض الفاضية اللي كان العيال بيلعبوا فيها كورة، اتعلّقت يافطة جديدة.
      ar: ماديون، الوارونغ ظهرًا. قبالته، على الأرض الخالية التي كان الأطفال يلعبون فيها الكرة، عُلّقت لافتة جديدة.
      en: Madiun, the warung at midday. Across the lane, on the empty lot where the kids used to play football, a new banner has gone up.
    lines:
      - speaker: Narrator
        text: 'Spanduk itu bertuliskan: "Segera Dibuka: Minimarket 24 Jam." Kabarnya menyebar ke seluruh gang lebih cepat daripada bau sate.'
        ar_eg: 'اليافطة مكتوب عليها: «قريبًا - ميني ماركت ٢٤ ساعة». والخبر لفّ الحارة كلها أسرع من ريحة الكباب.'
        ar: 'كُتب على اللافتة: «يُفتتح قريبًا - متجر صغير على مدار الساعة». وانتشر الخبر في الزقاق كلّه أسرع من رائحة المشويّات.'
        en: 'The banner reads: "Opening Soon: 24-Hour Minimarket." The news spreads round the lane faster than the smell of satay.'
      - speaker: Bu Tini
        text: Pak Budi, udah denger? Katanya minimarketnya buka dua puluh empat jam! Terus warung Bapak gimana?
        ar_eg: يا پاك بودي، سمعت؟ بيقولوا الميني ماركت هيفتح ٢٤ ساعة! طب والوارونج بتاعك هيعمل إيه؟
        ar: يا باك بودي، أسمعت؟ يقولون إنّ المتجر سيفتح أربعًا وعشرين ساعة! فماذا عن الوارونغ؟
        en: Pak Budi, have you heard? They say the minimarket will be open twenty-four hours! So what about your warung?
        note:
          ar_eg: نميمة الحارة - udah denger = sudah dengar، terus = lalu، gimana = bagaimana. minimarket = سوبر ماركت صغيّر.
          ar: ثرثرة الحيّ - udah denger = sudah dengar، terus = lalu، gimana = bagaimana. minimarket = متجر صغير.
          en: Lane gossip - udah denger = sudah dengar, terus = lalu, gimana = bagaimana. minimarket = convenience store.
      - speaker: Bu Sri
        text: Kata keponakan saya, kalau ada minimarket, warung-warung kecil pasti tutup. Di kampungnya udah kejadian.
        ar_eg: ابن أختي بيقول إن لو فيه ميني ماركت، الوارونجات الصغيّرة أكيد هتقفل. ده حصل في البلد بتاعتهم.
        ar: يقول ابن أختي إنّه إذا افتُتح متجر صغير فستُغلق الوارونغات الصغيرة حتمًا، وقد حدث ذلك في قريتهم.
        en: My nephew says that when a minimarket opens, the little warungs always close. It's happened in his village.
        note:
          ar_eg: udah kejadian = sudah terjadi (حصل خلاص). keponakan = ابن أختي/أخويا، pasti = أكيد، minimarket = ميني ماركت.
          ar: udah kejadian = sudah terjadi (حدث فعلًا). keponakan = ابن الأخ أو الأخت، pasti = حتمًا، minimarket = متجر صغير.
          en: udah kejadian = sudah terjadi (it has happened). keponakan = nephew or niece, pasti = surely, minimarket = convenience store.
      - speaker: Mas Joko
        text: Pak, kita harus protes! Kita bikin spanduk juga, yang lebih gede!
        ar_eg: يا پاك، لازم نعترض! نعمل يافطة إحنا كمان، أكبر منها!
        ar: يا باك، يجب أن نحتجّ! لنصنع لافتة نحن أيضًا، أكبر منها!
        en: Pak, we have to protest! We'll make a banner too - a bigger one!
        note:
          ar_eg: bikin = membuat، spanduk = يافطة قماش، gede = besar.
          ar: bikin = membuat، spanduk = لافتة قماشية، gede = besar.
          en: bikin = membuat, spanduk = banner, gede = besar.
      - speaker: Pak Budi
        text: Sabar dulu, Mas. Kabar itu barangkali nggak seratus persen bener. Lagian, rezeki nggak akan tertukar.
        ar_eg: استنّى بس يا ماس. الخبر ده يمكن مش صحيح مية في المية. وبعدين، رزقك مش هياخده غيرك.
        ar: تمهّل يا ماس. لعلّ الخبر ليس صحيحًا مئة بالمئة. ثمّ إنّ الرزق لا يذهب إلى غير صاحبه.
        en: Hold on, Mas. That news probably isn't a hundred per cent true. Besides, your daily bread won't go to someone else.
        note:
          ar_eg: rezeki tidak akan tertukar (حرفيًا «الرزق مش هيتبدّل») قول إندونيسي معناه إن رزق كل واحد مكتوب ليه - زي «رزقك هيجيلك». وrezeki من العربي «رزق». وbarangkali (يمكن) من كلمات التحفّظ. nggak = tidak، bener = benar، lagian = lagi pula (وبعدين كمان).
          ar: rezeki tidak akan tertukar (حرفيًّا «الرزق لا يُستبدل») قول إندونيسي معناه أنّ رزق كلّ امرئ مكتوب له، كقولنا «رزقك سيأتيك». وrezeki من العربية «رزق»، وbarangkali (ربّما) من ألفاظ التحفّظ. nggak = tidak، bener = benar، lagian = lagi pula (ثمّ إنّ).
          en: 'rezeki tidak akan tertukar ("provision won''t get swapped") is a saying: what''s meant for you will reach you. rezeki comes from Arabic رزق, and barangkali (perhaps) is a hedging word. nggak = tidak, bener = benar, lagian = lagi pula (besides).'
      - speaker: Bayu
        text: Bapak bener. Sebelum protes, mending kita tahu dulu pendapat warga yang sebenarnya. Aku bikin survei deh.
        ar_eg: بابا عنده حق. قبل ما نعترض، الأحسن نعرف الأول رأي السكّان الحقيقي. أنا هعمل استبيان.
        ar: أبي محقّ. قبل الاحتجاج، يحسن أن نعرف أوّلًا رأي السكّان الحقيقي. سأُعدّ استبيانًا.
        en: Dad's right. Before protesting, we'd better find out what residents really think. I'll do a survey.
        note:
          ar_eg: mending = sebaiknya (الأحسن)، bikin = membuat، deh = «خلاص هعمل كده». survei = استبيان.
          ar: mending = sebaiknya (الأفضل)، bikin = membuat، deh = تعبير عن قرار. survei = استبيان.
          en: mending = sebaiknya (better to), bikin = membuat, deh = all right then (deciding). survei = survey.
      - speaker: Bu Sri
        text: Survei? Kayak di TV waktu pemilu?
        ar_eg: استبيان؟ زي بتاع التلفزيون أيام الانتخابات؟
        ar: استبيان؟ مثل الذي في التلفاز أيّام الانتخابات؟
        en: A survey? Like on TV at election time?
        note:
          ar_eg: kayak = seperti، TV = televisi، pemilu = الانتخابات. survei = استبيان.
          ar: kayak = seperti، TV = televisi، pemilu = الانتخابات. survei = استبيان.
          en: kayak = seperti, TV = televisi, pemilu = elections. survei = survey.
      - speaker: Bayu
        text: Iya, Bu, tapi lebih kecil. Sepuluh pertanyaan aja. Yang muda ngisi formulir online, yang sepuh ngisi di kertas. Mas Joko yang nganterin dari rumah ke rumah.
        ar_eg: أيوه يا طنط، بس أصغر. عشر أسئلة بس. الشباب يملوا الاستمارة أونلاين، والكبار يملوها على ورق. وماس جوكو هو اللي هيلفّ بيها على البيوت.
        ar: نعم يا خالة، لكنّه أصغر. عشرة أسئلة فقط. يملأ الشباب الاستمارة عبر الإنترنت، ويملؤها كبار السنّ على الورق. وماس جوكو هو من سيوزّعها على البيوت.
        en: Yes, Bu, but smaller. Just ten questions. The young ones fill in an online form, the elderly fill it in on paper. Mas Joko will take it door to door.
        note:
          ar_eg: sepuh كلمة جاوية مؤدّبة معناها «كبير في السنّ»، بتتقال باحترام بدل tua (عجوز). وهتلاقيها في الإندونيسي بتاع جاوة كتير. ngisi = mengisi (يملا)، online = daring، nganterin = mengantarkan (يوصّل)، aja = saja، pertanyaan = سؤال.
          ar: sepuh كلمة جاوية مهذّبة بمعنى «مسنّ»، تُقال احترامًا بدل tua (عجوز)، وتتردّد كثيرًا في إندونيسية أهل جاوة. ngisi = mengisi (يملأ)، online = daring، nganterin = mengantarkan (يوصل)، aja = saja، pertanyaan = سؤال.
          en: sepuh is a polite Javanese word for "elderly", used respectfully instead of tua (old). You'll hear it a lot in Javanese-flavoured Indonesian. ngisi = mengisi (fill in), online = daring, nganterin = mengantarkan (deliver), aja = saja, pertanyaan = question.
      - speaker: Mas Joko
        text: Kok selalu saya sih yang keliling gang?
        ar_eg: هو ليه دايمًا أنا اللي ألفّ الحارة؟
        ar: لماذا أنا دائمًا من يطوف الزقاق؟
        en: Why is it always me who goes round the lane?
        note:
          ar_eg: kok... sih = «ليه دايمًا...؟» بتذمّر. keliling = يلفّ.
          ar: kok... sih = «لماذا دائمًا...؟» بتذمّر. keliling = يطوف.
          en: kok... sih = how come it is always... (grumbling). keliling = go round.
      - speaker: Bu Rahayu
        text: Soalnya Mas Joko kenal semua orang, dan semua orang kenal Mas Joko.
        ar_eg: عشان إنت يا ماس جوكو عارف كل الناس، وكل الناس عارفاك.
        ar: لأنّك يا ماس جوكو تعرف الجميع، والجميع يعرفك.
        en: Because you know everyone, Mas Joko, and everyone knows you.
      - speaker: Narrator
        text: Tiga hari kemudian, delapan puluh warga sudah mengisi survei Bayu. Hasilnya tidak seperti yang diduga siapa pun.
        ar_eg: بعد تلات أيام، تمانين واحد من السكّان كانوا ملوا استبيان بايو. والنتيجة مكانتش زي ما أي حدّ كان متوقّع.
        ar: بعد ثلاثة أيام كان ثمانون من السكّان قد ملؤوا استبيان بايو، وجاءت النتيجة على غير ما توقّعه أحد.
        en: Three days later, eighty residents have filled in Bayu's survey. The results aren't what anyone expected.
  - setting:
      ar_eg: قاعة الحيّ بالليل. كراسي بلاستيك، وترمس شاي، وپاك إر تي قاعد قدّام. حتى پاك دارتو، صاحب الأرض، جه.
      ar: قاعة الحيّ ليلًا. كراسٍ بلاستيكية وإبريق شاي، وباك إر تي في الصدارة. وقد حضر حتى باك دارتو، صاحب الأرض.
      en: The neighbourhood hall at night. Plastic chairs, a flask of tea, and Pak RT at the front. Even Pak Darto, who owns the lot, has come.
    lines:
      - speaker: Pak RT
        text: Bapak-bapak, ibu-ibu, terima kasih sudah hadir. Malam ini kita bermusyawarah tentang rencana minimarket. Silakan, Mas Bayu, sampaikan hasil surveinya.
        ar_eg: يا جماعة، شكرًا إنكم حضرتوا. الليلة هنتشاور في موضوع الميني ماركت. اتفضّل يا ماس بايو، قول نتيجة الاستبيان.
        ar: أيّها السادة والسيّدات، شكرًا على حضوركم. نتشاور الليلة في مشروع المتجر الصغير. تفضّل يا ماس بايو، اعرض نتائج الاستبيان.
        en: Ladies and gentlemen, thank you for coming. Tonight we'll deliberate on the minimarket plan. Mas Bayu, please present the survey results.
        note:
          ar_eg: musyawarah من العربي «مشاورة»، وmufakat من «موافقة». musyawarah untuk mufakat (التشاور لحدّ الاتفاق) مبدأ مهمّ في إندونيسيا - الناس بتتكلّم لحدّ ما يوصلوا لرأي واحد، من غير تصويت لو أمكن.
          ar: musyawarah من العربية «مشاورة»، وmufakat من «موافقة». ومبدأ musyawarah untuk mufakat (التشاور حتى التوافق) أساسيّ في إندونيسيا - يتحاور الناس حتى يبلغوا رأيًا واحدًا، دون تصويت إن أمكن.
          en: 'musyawarah comes from Arabic مشاورة (consultation) and mufakat from موافقة (agreement). musyawarah untuk mufakat - deliberating until consensus - is a core Indonesian principle: talk until everyone agrees, without a vote if possible.'
      - speaker: Bayu
        text: Terima kasih, Pak RT. Dari delapan puluh responden, lima puluh lima persen tampaknya setuju dengan minimarket, terutama warga muda. Alasannya praktis, karena buka malam dan ada mesin ATM.
        ar_eg: شكرًا يا پاك إر تي. من تمانين واحد جاوبوا، خمسة وخمسين في المية شكلهم موافقين على الميني ماركت، خصوصًا الشباب. والسبب عملي - عشان بيفتح بالليل وفيه ماكينة ATM.
        ar: شكرًا يا باك إر تي. من بين ثمانين مشاركًا، يبدو أنّ خمسة وخمسين بالمئة يؤيّدون المتجر، ولا سيّما الشباب. والسبب عمليّ - فهو يفتح ليلًا وفيه صرّاف آلي.
        en: Thank you, Pak RT. Of eighty respondents, fifty-five per cent appear to support the minimarket, especially younger residents. Their reasons are practical - it's open at night and has an ATM.
      - speaker: Bayu
        text: Namun, tujuh puluh persen juga khawatir warung-warung kecil akan sepi. Jadi, kemungkinan besar warga tidak menolak minimarket, tetapi ingin warung tetap hidup.
        ar_eg: بس سبعين في المية كمان قلقانين إن الوارونجات الصغيّرة تقفّ. فغالبًا السكّان مش رافضين الميني ماركت، بس عايزين الوارونج يفضل عايش.
        ar: غير أنّ سبعين بالمئة قلقون أيضًا من كساد الوارونغات الصغيرة. فالأرجح أنّ السكّان لا يرفضون المتجر، لكنّهم يريدون أن يبقى الوارونغ حيًّا.
        en: However, seventy per cent are also worried the small warungs will go quiet. So most likely, residents don't reject the minimarket - but they want the warung to stay alive.
        note:
          ar_eg: كلمات التحفّظ بتخلّي كلامك مؤدّب ودقيق - tampaknya (شكله)، kemungkinan besar (غالبًا)، cenderung (بيميل إن)، barangkali (يمكن). في إندونيسيا، الكلام القاطع والمواجهة المباشرة ممكن يبانوا قلّة ذوق.
          ar: ألفاظ التحفّظ تجعل كلامك مهذّبًا ودقيقًا - tampaknya (يبدو)، kemungkinan besar (على الأرجح)، cenderung (يميل إلى)، barangkali (ربّما). وفي إندونيسيا قد يبدو الجزم والمواجهة المباشرة قلّةَ لباقة.
          en: Hedging words keep you polite and precise - tampaknya (it seems), kemungkinan besar (most likely), cenderung (tend to), barangkali (perhaps). In Indonesia, flat assertions and direct confrontation can come across as rude.
      - speaker: Bu Tini
        text: Lho, kok bisa setuju sama khawatir sekaligus?
        ar_eg: إزاي يعني موافقين وقلقانين في نفس الوقت؟
        ar: عجبًا، كيف يكونون موافقين وقلقين في آن واحد؟
        en: Hang on, how can people agree and be worried at the same time?
      - speaker: Bayu
        text: Bisa, Bu. Kayak Ibu sama gorengan. Suka, tapi khawatir kolesterol.
        ar_eg: ينفع يا طنط. زي حضرتك والحاجات المقلية. بتحبّيها، بس قلقانة من الكوليسترول.
        ar: ممكن يا خالة. كحالكِ مع المقليّات - تحبّينها لكنّكِ تخشين الكوليسترول.
        en: They can, Bu. Like you and fried snacks. You love them, but you worry about cholesterol.
        note:
          ar_eg: باي رجع للكلام العادي - kayak = seperti، sama = dengan. gorengan = مقليّات، kolesterol = كوليسترول.
          ar: عاد باي إلى الكلام العادي - kayak = seperti، sama = dengan. gorengan = مقليّات، kolesterol = كوليسترول.
          en: Bayu is back to everyday talk - kayak = seperti, sama = dengan. gorengan = fried snacks, kolesterol = cholesterol.
      - speaker: Pak Darto
        text: Izinkan saya bicara. Tanah itu milik saya, dan saya juga lahir di gang ini. Anak saya baru lulus dan belum bekerja. Barangkali minimarket ini bisa membuka lapangan kerja untuk anak-anak muda di sini.
        ar_eg: اسمحولي أتكلّم. الأرض دي بتاعتي، وأنا كمان اتولدت في الحارة دي. ابني لسّه متخرّج ومش لاقي شغل. يمكن الميني ماركت ده يفتح باب شغل لشباب الحارة.
        ar: اسمحوا لي بالكلام. تلك الأرض ملكي، وأنا أيضًا وُلدت في هذا الزقاق. تخرّج ابني حديثًا ولم يجد عملًا. ولعلّ هذا المتجر يوفّر فرص عمل لشباب الحيّ.
        en: Allow me to speak. That land is mine, and I was born in this lane too. My son has just graduated and hasn't found work. Perhaps this minimarket could create jobs for the young people here.
      - speaker: Bu Sri
        text: Oh, jadi Pak Darto pemiliknya. Saya kira orang kota yang nggak kenal kita.
        ar_eg: آه، يعني پاك دارتو هو صاحبه. أنا كنت فاكرة واحد من المدينة ميعرفناش.
        ar: آه، إذن باك دارتو هو صاحبها. كنت أظنّه رجلًا من المدينة لا يعرفنا.
        en: Oh, so it's Pak Darto's. I thought it was some city person who doesn't know us.
        note:
          ar_eg: kira = فاكرة/ظنّيت، pemilik = صاحب الحاجة.
          ar: kira = ظننتُ، pemilik = المالك.
          en: kira = thought, assumed, pemilik = owner.
      - speaker: Pak Budi
        text: Pak Darto, saya nggak menolak. Tapi gimana kalau kita cari jalan tengah? Pertama, minimarket nggak jual makanan matang kayak pecel sama gorengan. Kedua, ada satu rak khusus buat produk warga, misalnya brem, sambal pecel, sama keripik buatan ibu-ibu gang.
        ar_eg: يا پاك دارتو، أنا مش رافض. بس إيه رأيك ندوّر على حلّ في النص؟ أولًا، الميني ماركت ميبعش أكل مطبوخ زي البيچيل والمقليّات. تانيًا، يبقى فيه رفّ مخصوص لمنتجات السكّان - زي البريم، وصلصة البيچيل، والشيبسي اللي بتعمله ستّات الحارة.
        ar: يا باك دارتو، لستُ رافضًا. لكن ما رأيك أن نبحث عن حلّ وسط؟ أوّلًا، ألّا يبيع المتجر طعامًا مطهوًّا كالبيتشيل والمقليّات. ثانيًا، أن يُخصَّص رفّ لمنتجات السكّان، كالبريم وصلصة البيتشيل والرقائق التي تصنعها نساء الزقاق.
        en: Pak Darto, I'm not against it. But how about we find a middle way? First, the minimarket doesn't sell cooked food like pecel and fritters. Second, there's a special shelf for residents' products - brem, pecel sauce, crisps made by the ladies of the lane.
        note:
          ar_eg: UMKM (مشروعات صغيّرة ومتوسّطة) هي عمود الاقتصاد الإندونيسي، ومناطق كتير بتشجّع المحلات الحديثة إنها تعرض منتجاتها. وصلصة البيچيل المتغلّفة من أشهر هدايا ماديون. jual = menjual، kayak = seperti، buat = untuk. rak = رفّ، produk = منتجات، gorengan = مقليّات، keripik = شيبسي، buatan = صنع، brem = حلوى ماديون.
          ar: UMKM (المشروعات الصغيرة والمتوسّطة) عماد الاقتصاد الإندونيسي، وتشجّع مناطق كثيرة المتاجر الحديثة على عرض منتجاتها. وصلصة البيتشيل المعلّبة من أشهر هدايا ماديون. jual = menjual، kayak = seperti، buat = untuk. rak = رفّ، produk = منتجات، gorengan = مقليّات، keripik = رقائق، buatan = صُنع، brem = حلوى ماديون.
          en: UMKM (micro, small and medium businesses) are the backbone of Indonesia's economy, and many regions encourage modern stores to stock their products. Packaged pecel sauce is one of Madiun's best-known souvenirs. jual = menjual (sell), kayak = seperti, buat = untuk. rak = shelf, produk = products, gorengan = fried snacks, keripik = crisps, buatan = made by, brem = a Madiun sweet.
      - speaker: Pak Darto
        text: Rak buat produk UMKM? Itu ide bagus, Pak. Saya kira pihak waralaba bakal setuju. Pegawainya juga, sebisa mungkin, anak muda dari gang ini.
        ar_eg: رفّ لمنتجات المشروعات الصغيّرة؟ فكرة حلوة يا پاك. أظنّ الشركة صاحبة السلسلة هتوافق. والموظفين كمان، على قدّ ما نقدر، يبقوا من شباب الحارة.
        ar: رفّ لمنتجات المشروعات الصغيرة؟ فكرة جيّدة يا باك. أظنّ أنّ الشركة صاحبة الامتياز ستوافق. وسيكون الموظّفون، قدر الإمكان، من شباب هذا الزقاق.
        en: A shelf for local small businesses? That's a good idea, Pak. I think the franchise will agree. And the staff, as far as possible, will be young people from this lane.
        note:
          ar_eg: buat = untuk، bakal = akan. kira = أظنّ، waralaba = فرانشايز، sebisa mungkin = على قد ما نقدر، rak = رفّ، produk = منتجات.
          ar: buat = untuk، bakal = akan. kira = أظنّ، waralaba = الامتياز التجاري، sebisa mungkin = قدر الإمكان، rak = رفّ، produk = منتجات.
          en: buat = untuk, bakal = akan. kira = think, waralaba = franchise, sebisa mungkin = as far as possible, rak = shelf, produk = products.
      - speaker: Pak RT
        text: Gimana, Bapak-Ibu? Setuju?
        ar_eg: إيه رأيكم يا جماعة؟ موافقين؟
        ar: ما رأيكم أيّها السادة؟ موافقون؟
        en: What do you say, everyone? Agreed?
      - speaker: Narrator
        text: Delapan puluh tangan terangkat. Bahkan Mas Joko mengangkat dua tangan.
        ar_eg: تمانين إيد اترفعت. وحتى ماس جوكو رفع الإيدين الاتنين.
        ar: ارتفعت ثمانون يدًا، بل رفع ماس جوكو يديه كلتيهما.
        en: Eighty hands go up. Mas Joko even raises both of his.
      - speaker: Bu Rahayu
        text: Pak, dari tadi Bapak tenang banget. Bapak nggak takut sama sekali?
        ar_eg: يا أبو ساري، إنت من بدري هادي أوي. مش خايف خالص؟
        ar: يا باك، كنتَ هادئًا جدًّا منذ البداية. ألستَ خائفًا أبدًا؟
        en: Pak, you've been so calm all evening. Aren't you afraid at all?
      - speaker: Pak Budi
        text: Sedikit, Bu. Tapi minimarket bisa jual banyak hal. Yang nggak bisa dijual di sana cuma satu, yaitu obrolan di warung pecel.
        ar_eg: شوية يا رهايو. بس الميني ماركت يقدر يبيع حاجات كتير. الحاجة الوحيدة اللي مش هيقدر يبيعها هي الدردشة في وارونج البيچيل.
        ar: قليلًا. لكنّ المتجر يستطيع أن يبيع أشياء كثيرة، إلّا شيئًا واحدًا - السمر في وارونغ البيتشيل.
        en: A little. But a minimarket can sell lots of things. The one thing it can't sell is a chat at the pecel warung.
        note:
          ar_eg: jual = menjual، cuma = hanya، obrolan = الدردشة/القعدة.
          ar: jual = menjual، cuma = hanya، obrolan = الدردشة.
          en: jual = menjual (sell), cuma = hanya (only), obrolan = chit-chat.
