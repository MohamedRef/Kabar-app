    en: in my opinion (with friends - menurutku)
  - word: setuju
    pos: verb
    ar_eg: موافق
    ar: يوافق
    en: to agree
  - word: walaupun
    ar_eg: رغم إن
    ar: رغم أنّ / مع أنّ
    en: although, even though
  - word: kantong plastik
    pos: noun
    ar_eg: شنطة بلاستيك (كيس)
    ar: كيس بلاستيكي
    en: plastic bag
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: في رأي نادية، إيه المشكلة الحقيقية؟
      ar: ما المشكلة الحقيقية في رأي نادية؟
      en: According to Nadia, what is the real problem?
    options: ["sungainya", "relawannya", "kebiasaan kita", "botolnya"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: ___ sampah pada tempatnya!
    meaning:
      ar_eg: ارمي الزبالة في مكانها!
      ar: ارمِ القمامة في مكانها!
      en: Put your rubbish in the bin!
    answers: [Buanglah]
    options: ["Buangkah", "Buanglah", "Buangpun"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: بو راهايو هتلفّ البيتشل في إيه؟
      ar: بماذا ستلفّ بو راهايو البيتشل؟
      en: What will Bu Rahayu wrap the pecel in?
    options: ["dengan daun pisang", "dengan kantong plastik", "dengan kertas koran"]
    answer: 0
  - id: q04
    type: listen
    text: Hmm, aku kurang setuju, sih... Walaupun gitu, aku beli satu, deh.
    question:
      ar_eg: ماس جوكو عمل إيه في الآخر؟
      ar: ماذا فعل ماس جوكو في النهاية؟
      en: What does Mas Joko do in the end?
    options: ["Dia tidak membeli apa-apa.", "Dia membeli dua kantong plastik.", "Dia pulang tanpa pecel.", "Dia membeli satu tas kain."]
    answer: 3
    meaning:
      ar_eg: اممم، أنا مش موافق قوي... بس برضه هشتري واحدة.
      ar: همم، لست موافقًا تمامًا... ومع ذلك سأشتري واحدة.
      en: Hmm, I'm not so sure... Even so, I'll buy one.
  - id: q05
    type: translate
    direction: from_target
    source_text: Siapa pun bisa bantu.
    answers_meaning:
      ar_eg: ["أي حدّ يقدر يساعد.", "أي واحد ممكن يساعد.", "كل الناس تقدر تساعد."]
      ar: ["أيّ أحد يستطيع أن يساعد.", "يمكن لأيّ شخص أن يساعد.", "كلّ أحد قادر على المساعدة."]
      en: ["Anyone can help.", "Anybody can help.", "Everyone can help."]
next:
  ar_eg: ليلة سينما على الفيديو! نادية والحاجّة فاطمة اختاروا فيلم مصري قديم، وبايو اختار فيلم إندونيسي. مين هيكسب؟
  ar: ليلة سينما عبر الاتصال المرئي! اختارت نادية والحاجّة فاطمة فيلمًا مصريًّا قديمًا، واختار بايو فيلمًا إندونيسيًّا. فمن سيفوز؟
  en: Movie night on video call! Nadia and Hagga Fatma pick an Egyptian classic, Bayu picks an Indonesian film. Who wins?
