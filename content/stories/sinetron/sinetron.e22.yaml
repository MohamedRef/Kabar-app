title:
  target: Buanglah Sampah pada Tempatnya!
  ar_eg: ارمي الزبالة في مكانها!
  ar: ارمِ القمامة في مكانها!
  en: Put Your Rubbish in the Bin!
summary:
  ar_eg: ساري ونادية وكريم بينضّفوا شط النيل مع متطوّعين، وبيتناقشوا الزبالة دي جاية منين. وفي ماديون، بايو منع الشنط البلاستيك في الوارونج… وماس جوكو أول ضحية.
  ar: تنظّف ساري ونادية وكريم ضفّة النيل مع متطوّعين، ويتناقشون من أين تأتي هذه القمامة. وفي ماديون يمنع بايو الأكياس البلاستيكية في الوارونغ… وماس جوكو أوّل الضحايا.
  en: Sari, Nadia and Karim join volunteers cleaning the Nile bank and debate where all the rubbish comes from. In Madiun, Bayu bans plastic bags at the warung… and Mas Joko is the first victim.
cast: [Sari, Nadia, Karim, Bayu, Mas Joko, Pak Budi, Bu Rahayu, Bu Sri]
scenes:
  - setting:
      ar_eg: القاهرة، السبت الصبح بدري، على شط النيل. متطوّعين لابسين جوانتيات وماسكين شنط زبالة كبيرة.
      ar: القاهرة، صباح السبت الباكر، على ضفّة النيل. متطوّعون يرتدون القفّازات ويحملون أكياس قمامة كبيرة.
      en: Cairo, early Saturday morning, on the bank of the Nile. Volunteers in gloves carry big rubbish bags.
    lines:
      - speaker: Narrator
        text: Kairo. Sabtu pagi. Di tepi Sungai Nil, puluhan relawan memungut sampah.
        ar_eg: القاهرة. السبت الصبح. على شط النيل، عشرات المتطوّعين بيلمّوا الزبالة.
        ar: القاهرة. صباح السبت. على ضفّة النيل يجمع عشرات المتطوّعين القمامة.
        en: Cairo. Saturday morning. On the bank of the Nile, dozens of volunteers are picking up rubbish.
      - speaker: Nadia
        text: Sari, lihat deh botol-botol ini! Jumlahnya banyak banget.
        ar_eg: يا ساري، بصّي على الإزايز دي! عددها كبير أوي.
        ar: يا ساري، انظري إلى هذه الزجاجات! عددها كبير جدًّا.
        en: Sari, look at all these bottles! There are so many of them.
        note:
          ar_eg: -nya هنا معناها «بتاعها» - jumlahnya يعني «عددها». بس -nya ليها شغلانات كتير، زي «الـ» للتعريف و«ـه» للضمير.
          ar: -nya هنا تعني «ـها» - jumlahnya أي «عددها». ولـ -nya وظائف كثيرة، كالتعريف («الـ») والضمير («ـه / ـها»).
          en: -nya here means "its/their" — jumlahnya is "their number". -nya does many jobs, from "the" to "his/her/its".
      - speaker: Sari
        text: Sampah sebanyak ini dari mana, sih? Emang orang buang sampah di sini?
        ar_eg: الزبالة دي كلها جاية منين بقى؟ هو الناس بترمي الزبالة هنا؟
        ar: من أين جاءت كل هذه القمامة؟ هل يرمي الناس القمامة هنا حقًّا؟
        en: Where does all this rubbish even come from? Do people really throw rubbish here?
        note:
          ar_eg: كلام شارع - sih بتليّن السؤال، وemang = memang (هو فعلًا؟)، وbuang = membuang (يرمي). الرسمي زي الكتب - «Dari manakah sampah ini? Apakah orang membuangnya di sini?»
          ar: كلام يومي - sih تليّن السؤال، وemang = memang (حقًّا؟)، وbuang = membuang (يرمي). وبالفصحى كما في الكتب - «Dari manakah sampah ini? Apakah orang membuangnya di sini?»
          en: 'Street speech: sih softens a question, emang = memang (really?), buang = membuang (throw away). The formal, book version: "Dari manakah sampah ini? Apakah orang membuangnya di sini?"'
      - speaker: Karim
        text: Katanya sih, sampah plastik di laut banyak yang datang dari sungai.
        ar_eg: بيقولوا إن جزء كبير من زبالة البلاستيك اللي في البحر جاي من الأنهار.
        ar: يُقال إن كثيرًا من النفايات البلاستيكية في البحر يأتي من الأنهار.
        en: They say a lot of the plastic in the sea comes from rivers.
        note:
          ar_eg: katanya = «بيقولوا / على حسب الكلام». و-kah في dari manakah وapakah بتخلّي السؤال أرسم، زي في الكتب واليافطات - في الكلام الناس بتقول «dari mana, sih?».
          ar: katanya تعني «يُقال». و-kah في dari manakah وapakah تجعل السؤال أكثر رسمية، كما في الكتب واللافتات - أمّا في الكلام فيقال «dari mana, sih?».
          en: katanya = "they say / apparently". -kah (dari manakah, apakah) makes a question formal, as in books and signs; out loud people say "dari mana, sih?".
      - speaker: Nadia
        text: Menurutku, masalahnya bukan sungainya. Masalahnya ya kebiasaan kita.
        ar_eg: في رأيي، المشكلة مش في النهر. المشكلة في عادتنا إحنا.
        ar: في رأيي، ليست المشكلة في النهر، بل في عاداتنا.
        en: In my opinion, the problem isn't the river. The problem is our habits.
        note:
          ar_eg: menurutku = menurut saya (في رأيي) بين الصحاب. وmasalah = مشكلة (masalahnya = المشكلة)، وkebiasaan = عادة.
          ar: menurutku = menurut saya (في رأيي) بين الأصدقاء. وmasalah = مشكلة (masalahnya = المشكلة)، وkebiasaan = عادة.
          en: menurutku = menurut saya (in my opinion), between friends. masalah = problem (masalahnya = the problem); kebiasaan = habit.
      - speaker: Sari
        text: Iya, setuju. Di Madiun pun sama aja. Banyak orang buang sampah ke kali.
        ar_eg: أنا موافقة. في ماديون نفس الحكاية. ناس كتير بترمي الزبالة في الترعة.
        ar: أوافقكِ. وفي ماديون الأمر نفسه، فكثيرون يرمون القمامة في الجدول.
        en: I agree. It's the same in Madiun. Lots of people throw rubbish into the stream.
      - speaker: Karim
        text: Walaupun capek, aku senang. Siapa pun bisa bantu, kan?
        ar_eg: رغم إني تعبان، أنا مبسوط. أي حدّ يقدر يساعد، صح؟
        ar: رغم التعب أنا سعيد. أيّ أحد يستطيع أن يساعد، أليس كذلك؟
        en: Even though I'm tired, I'm happy. Anyone can help, right?
        note:
          ar_eg: pun ليها كذا معنى - di Madiun pun = «وفي ماديون كمان»، siapa pun = «أي حدّ»، walaupun = «رغم إن». وbantu = membantu (يساعد) في الكلام.
          ar: لـ pun عدّة معانٍ - di Madiun pun = «وفي ماديون أيضًا»، siapa pun = «أيّ أحد»، walaupun = «رغم أنّ». وbantu = membantu (يساعد) في الكلام.
          en: 'pun has several jobs: di Madiun pun = "in Madiun too", siapa pun = "anyone", walaupun = "although". bantu = membantu (to help) in speech.'
      - speaker: Sari
        text: Ayo, foto dulu! Bayu minta foto Sungai Nil.
        ar_eg: يلا نتصوّر! بايو طالب صور للنيل.
        ar: هيّا نلتقط صورة! بايو طلب صورًا لنهر النيل.
        en: Come on, let's take a photo! Bayu asked for photos of the Nile.
      - speaker: Narrator
        text: Foto pertama Sungai Nil untuk Bayu. Di depannya, dua puluh kantong sampah.
        ar_eg: أول صورة للنيل عشان بايو. وقدّامها عشرين شنطة زبالة.
        ar: أول صورة لنهر النيل من أجل بايو، وأمامها عشرون كيس قمامة.
        en: The first photo of the Nile for Bayu. In front of it, twenty bags of rubbish.
  - setting:
      ar_eg: ماديون، الضهر. على باب الوارونج يافطة جديدة مكتوبة بخط بايو.
      ar: ماديون، وقت الظهر. على باب الوارونغ لافتة جديدة بخطّ بايو.
      en: Madiun, midday. On the warung door hangs a new sign in Bayu's handwriting.
    lines:
      - speaker: Narrator
        text: 'Di pintu warung ada tulisan: "Mulai hari ini, tidak ada kantong plastik. Bawalah tas sendiri!"'
        ar_eg: 'على باب الوارونج مكتوب: «من النهارده مفيش شنط بلاستيك. هات شنطتك معاك!»'
        ar: 'على باب الوارونغ كُتب: «ابتداءً من اليوم لا أكياس بلاستيكية. أحضِر حقيبتك معك!»'
        en: 'On the warung door is a sign: "From today, no plastic bags. Bring your own bag!"'
        note:
          ar_eg: -lah بتيجي في آخر الفعل في اليافطات عشان الأمر يبقى ألطف شوية. أشهر يافطة في إندونيسيا - «Buanglah sampah pada tempatnya» (ارمي الزبالة في مكانها).
          ar: تُلحق -lah بالفعل في اللافتات لتليين الأمر. وأشهر لافتة في إندونيسيا - «Buanglah sampah pada tempatnya» (ارمِ القمامة في مكانها).
          en: -lah on a verb softens a command, as on signs. Indonesia's most famous sign is "Buanglah sampah pada tempatnya" — put your rubbish in its place.
      - speaker: Mas Joko
        text: Pak Budi, nasi pecel dua, dibungkus. Pake kantong plastik, ya.
        ar_eg: يا باك بودي، اتنين رز بالبيتشل تيك أواي. في شنطة بلاستيك، ماشي؟
        ar: يا باك بودي، طبقا أرز بالبيتشل للأخذ، في كيس بلاستيكي من فضلك.
        en: Pak Budi, two rice-and-pecel to take away. In a plastic bag, please.
        note:
          ar_eg: pake = pakai (بـ / مستخدمًا) في الكلام. وdibungkus = «يتلفّ» يعني تيك أواي. وpecel خضار بصلصة الفول السوداني.
          ar: pake = pakai (بـ / باستخدام) في الكلام. وdibungkus = «يُلفّ» أي للأخذ. وpecel خضار بصلصة الفول السوداني.
          en: pake = pakai (with, using) in speech. dibungkus = "wrapped", i.e. to take away. pecel = vegetables in peanut sauce.
      - speaker: Bayu
        text: Maaf, Mas Joko. Kantong plastiknya udah nggak ada. Baca dong tulisannya!
        ar_eg: معلش يا ماس جوكو. الشنط البلاستيك خلاص مبقتش موجودة. اقرا اليافطة بقى!
        ar: آسف يا ماس جوكو، لم تعد هناك أكياس بلاستيكية. اقرأ اللافتة!
        en: Sorry, Mas Joko. There are no more plastic bags. Go on, read the sign!
        note:
          ar_eg: udah nggak ada = sudah tidak ada (خلاص مفيش). وbaca dong = bacalah (اقرا) بس بنبرة «بقى!» الودّية - اليافطة بتقول ‎-lah، والناس بتقول dong.
          ar: udah nggak ada = sudah tidak ada (لم يعد موجودًا). وbaca dong = bacalah (اقرأ) بنبرة ودّية - اللافتة تقول ‎-lah والناس يقولون dong.
          en: udah nggak ada = sudah tidak ada (there's none left). baca dong = bacalah (read it), with a friendly push — signs say -lah, people say dong.
      - speaker: Mas Joko
        text: Lho, terus aku bawa pecelnya pake apa? Pake tangan?
        ar_eg: إيه ده، أمال أشيل البيتشل في إيه؟ في إيدي؟
        ar: ماذا؟ إذن بماذا أحمل البيتشل؟ بيديّ؟
        en: What? So how do I carry the pecel? In my hands?
        note:
          ar_eg: terus = lalu (أمال / وبعدين) في الكلام، وlho = «إيه ده!» للمفاجأة.
          ar: terus = lalu (إذن / ثمّ) في الكلام، وlho للتعبير عن المفاجأة.
          en: terus = lalu (so, then) in speech; lho marks surprise ("hey!").
      - speaker: Bu Rahayu
        text: Tenang, Mas. Pecelnya kami bungkus pake daun pisang, kayak zaman dulu.
        ar_eg: اهدى يا ماس. هنلفّ البيتشل في ورق موز، زي زمان.
        ar: اهدأ يا ماس. سنلفّ البيتشل بورق الموز، كما في الزمن القديم.
        en: Relax, Mas. We'll wrap the pecel in banana leaf, like in the old days.
        note:
          ar_eg: daun = ورقة، وkayak = seperti (زي). في ماديون البيتشل بيتقدّم من زمان على ورقة موز متطبّقة اسمها pincuk. وzaman جاية من العربي «زمان».
          ar: daun = ورقة، وkayak = seperti (مثل). يُقدَّم البيتشل في ماديون تقليديًّا على ورقة موز مطويّة تسمّى pincuk. وzaman من العربية «زمان».
          en: daun = leaf; kayak = seperti (like). In Madiun, pecel has long been served on a folded banana leaf called a pincuk. zaman comes from Arabic زمان (time, era).
      - speaker: Bu Sri
        text: Betul! Dulu pun kami belanja ke pasar pakai keranjang, bukan plastik.
        ar_eg: صحّ! زمان إحنا كمان كنا بنروح السوق بالسَّبَت، مش بالبلاستيك.
        ar: صحيح! في الماضي كنّا نتسوّق أيضًا بالسلال لا بالبلاستيك.
        en: That's right! In the old days we went to market with baskets too, not plastic.
      - speaker: Pak Budi
        text: Menurut Bapak, idenya bagus, Le. Tapi pelanggan kita setuju nggak, ya?
        ar_eg: في رأيي الفكرة حلوة يا ابني. بس يا ترى الزباين هيوافقوا؟
        ar: في رأيي الفكرة جيّدة يا بنيّ. لكن هل سيوافق زبائننا؟
        en: I think it's a good idea, son. But will our customers agree?
        note:
          ar_eg: «…nggak, ya?» في آخر الجملة = «يا ترى؟» - في الكلام بتاخد مكان apakah. وpelanggan = زبون.
          ar: «…nggak, ya?» في آخر الجملة تعني «يا تُرى؟» - وتحلّ في الكلام محلّ apakah. وpelanggan = زبون.
          en: '"…nggak, ya?" at the end = "I wonder if…" — in speech it replaces apakah. pelanggan = customer.'
      - speaker: Bayu
        text: Kalau gitu, kita jual tas kain juga. Harganya sepuluh ribu aja!
        ar_eg: يبقى نبيع شنط قماش كمان. سعرها عشرة آلاف بس!
        ar: إذن نبيع حقائب قماشية أيضًا. سعرها عشرة آلاف فقط!
        en: Then we'll sell cloth bags too. Only ten thousand each!
        note:
          ar_eg: kalau gitu = kalau begitu (يبقى / طب خلاص)، وaja = saja (بس). وjual = يبيع.
          ar: kalau gitu = kalau begitu (إذن)، وaja = saja (فقط). وjual = يبيع.
          en: kalau gitu = kalau begitu (in that case), aja = saja (only). jual = to sell.
      - speaker: Mas Joko
        text: Hmm, aku kurang setuju, sih... Walaupun gitu, aku beli satu, deh.
        ar_eg: اممم، أنا مش موافق قوي... بس برضه هشتري واحدة.
        ar: همم، لست موافقًا تمامًا... ومع ذلك سأشتري واحدة.
        en: Hmm, I'm not so sure... Even so, I'll buy one.
      - speaker: Narrator
        text: Hari itu Bayu menjual lima tas kain. Besoknya, Mas Joko lupa membawa tasnya.
        ar_eg: اليوم ده بايو باع خمس شنط قماش. وتاني يوم، ماس جوكو نسي شنطته.
        ar: باع بايو في ذلك اليوم خمس حقائب قماشية. وفي اليوم التالي نسي ماس جوكو حقيبته.
        en: That day Bayu sold five cloth bags. The next day, Mas Joko forgot to bring his.
