next:
  ar_eg: ساري بتاخد أجازة نهاية الأسبوع وبتركب مركب خشب صغير في نهر لونه زي الشاي، في غابة تانجونج بوتينج. والمرشد بيقولها - «هنا، إحنا الضيوف. صحاب البيت هما الأورانجوتان».
  ar: تأخذ ساري عطلة نهاية الأسبوع وتركب قاربًا خشبيًّا صغيرًا في نهر بلون الشاي، في غابة تانجونغ بوتينغ. ويقول لها المرشد - «هنا نحن الضيوف، وأصحاب البيت هم إنسان الغاب».
  en: Sari takes a weekend off and boards a little wooden boat on a tea-coloured river in the forest of Tanjung Puting. The guide tells her - "Here, we're the guests. The orangutans own the house."
