title:
  target: Katanya, Merantau Itu Sekolah
  ar_eg: بيقولوا إن الغربة مدرسة
  ar: يقولون إنّ الغربة مدرسة
  en: They Say Leaving Home Is a School
summary:
  ar_eg: ليلة آخر يوم تسجيل في امتحان الجامعات، والعيلة كلها حوالين لابتوب بايو - باك بودي عايزه طبّاخ، وبو راهايو عايزاه صحفي، وبايو بيختار حاجة تالتة... في ميدان! وفي القاهرة، نادية بتدرّس عربي مصري أونلاين لطلبة بيسانترين بيحلموا بالأزهر.
  ar: في ليلة آخر موعد للتسجيل في امتحان الجامعات، تتحلّق العائلة حول حاسوب بايو - باك بودي يريده طاهيًا، وبو راهايو تريده صحفيًّا، وبايو يختار شيئًا ثالثًا... في ميدان! وفي القاهرة تدرّس نادية العامية المصرية عبر الإنترنت لطلّاب معهد ديني يحلمون بالأزهر.
  en: On the last night of registration for the university entrance exam, the whole family crowds round Bayu's laptop - Pak Budi wants a chef, Bu Rahayu wants a journalist, and Bayu picks a third option... in Medan! In Cairo, Nadia teaches Egyptian Arabic online to pesantren students who dream of Al-Azhar.
cast: [Pak Budi, Bu Rahayu, Bayu, Mas Joko, Sari, Nadia, Mas Fikri]
scenes:
  - setting:
      ar_eg: ماديون، مارس، بالليل. الوارونج قفل، وبايو قاعد قدّام اللابتوب على موقع التسجيل، والعيلة كلها حواليه.
      ar: ماديون، مارس، ليلًا. أُغلق الوارونغ، ويجلس بايو أمام الحاسوب على موقع التسجيل، والعائلة كلّها حوله.
      en: Madiun, March, at night. The warung is closed, and Bayu sits at the laptop on the registration site with the whole family around him.
    lines:
      - speaker: Narrator
        text: Malam ini adalah batas akhir pendaftaran SNBT, seleksi masuk perguruan tinggi negeri. Bayu harus memilih program studi, dan seluruh keluarga punya pendapat.
        ar_eg: الليلة دي آخر ميعاد للتسجيل في SNBT، امتحان القبول في الجامعات الحكومية. بايو لازم يختار التخصّص، والعيلة كلها عندها رأي.
        ar: هذه الليلة آخر موعد للتسجيل في SNBT، اختبار القبول في الجامعات الحكومية. على بايو أن يختار تخصّصه، وللعائلة كلّها رأي.
        en: Tonight is the registration deadline for SNBT, the state university entrance selection. Bayu has to choose his study programme, and the whole family has an opinion.
        note:
          ar_eg: SNBT (اختيار وطني بالامتحان) بيعتمد على امتحان على الكمبيوتر اسمه UTBK. وفيه طريق تاني اسمه SNBP بيعتمد على درجات المدرسة. زي تنسيق الثانوية العامة عندنا، بس بامتحان مستقلّ.
          ar: يعتمد SNBT (الاختيار الوطني القائم على الاختبار) على اختبار حاسوبي اسمه UTBK. وهناك طريق آخر اسمه SNBP يعتمد على درجات المدرسة. يشبه التنسيق الجامعي في مصر، لكن باختبار مستقلّ.
          en: SNBT (national selection by test) uses a computer-based exam called UTBK. A second route, SNBP, uses school grades. A bit like Egypt's university placement system, but with its own exam.
      - speaker: Pak Budi
        text: Gampang, Le. Pilih Tata Boga aja. Kamu koki, Bapak koki. Warung ini butuh sarjana masak!
        ar_eg: سهلة يا ابني. اختار فنون الطهي. إنت طبّاخ، وأنا طبّاخ. الوارونج ده محتاج خرّيج طبخ!
        ar: الأمر سهل يا بنيّ. اختر فنون الطهي. أنت طاهٍ وأنا طاهٍ، وهذا الوارونغ يحتاج إلى خرّيج في الطبخ!
        en: Easy, son. Pick Culinary Arts. You're a cook, I'm a cook. This warung needs a graduate chef!
        note:
          ar_eg: gampang = سهل، pilih = اختار، aja = saja، koki = طبّاخ، Tata Boga = دراسة الطبخ والضيافة، butuh = محتاج، sarjana masak = خرّيج طبخ.
          ar: gampang = سهل، pilih = اختر، aja = saja، koki = طاهٍ، Tata Boga = دراسة فنون الطهي، butuh = يحتاج، sarjana masak = خرّيج طهي.
          en: gampang = easy, pilih = choose, aja = saja, koki = cook, Tata Boga = culinary studies, butuh = need, sarjana masak = a cooking graduate.
      - speaker: Bu Rahayu
        text: Jangan dipaksa, Pak. Kata guru bahasa Indonesianya, tulisan Bayu yang paling bagus di sekolah. Pilih jurnalistik aja, Le.
        ar_eg: متغصبوش يا أبو ساري. مدرّس الإندونيسي بتاعه بيقول إن كتابة بايو أحسن واحدة في المدرسة. اختار صحافة يا ابني.
        ar: لا تُجبره يا باك. يقول معلّم الإندونيسية إنّ كتابة بايو هي الأفضل في المدرسة. اختر الصحافة يا بنيّ.
        en: Don't push him, Pak. His Indonesian teacher says Bayu's writing is the best in the school. Pick journalism, son.
        note:
          ar_eg: الكلام المنقول بالإندونيسي سهل - kata + الشخص (فلان بيقول)، أو katanya (بيقولوا / سمعت إن)، أو dia bilang bahwa (قال إن). والفعل مش بيتغيّر للماضي. dipaksa = يتغصب، jurnalistik = صحافة، aja = saja.
          ar: الكلام المنقول في الإندونيسية سهل - kata + الشخص (يقول فلان)، أو katanya (يُقال / سمعتُ أنّ)، أو dia bilang bahwa (قال إنّ). ولا يتغيّر الفعل إلى الماضي. dipaksa = يُجبَر، jurnalistik = الصحافة، aja = saja.
          en: Reported speech is easy in Indonesian - kata + person (so-and-so says), katanya (they say / apparently), or dia bilang bahwa (he said that). The verb doesn't shift tense. dipaksa = be forced, jurnalistik = journalism, aja = saja.
      - speaker: Bayu
        text: Bapak, Ibu, aku udah nanya ke guru BK. Beliau bilang bahwa Ilmu Komunikasi cocok buat orang yang suka nulis dan suka ngobrol sama orang. Lulusannya bisa jadi wartawan, bisa juga bikin konten masak.
        ar_eg: بابا، ماما، أنا سألت مدرّس الإرشاد. قالّي إن «علوم الاتصال» مناسبة للي بيحبّ يكتب ويحبّ يتكلّم مع الناس. وخرّيجينها ممكن يبقوا صحفيين، أو يعملوا محتوى طبخ كمان.
        ar: أبي، أمي، سألتُ المرشد المدرسي، فقال إنّ علوم الاتصال تناسب من يحبّ الكتابة ويحبّ الحديث مع الناس. ويمكن لخرّيجيها أن يصبحوا صحفيين، أو أن يصنعوا محتوى عن الطبخ أيضًا.
        en: Dad, Mum, I asked the guidance teacher. He said that Communication Studies suits people who like writing and like talking to people. Graduates can become journalists, or make cooking content too.
        note:
          ar_eg: udah nanya ke = sudah bertanya kepada، nulis = menulis، ngobrol sama = berbicara dengan (يدردش مع)، bikin = membuat. وفي الكلام بيقولوا كمان bilang kalau بدل bilang bahwa. cocok = مناسب، konten masak = محتوى طبخ.
          ar: udah nanya ke = sudah bertanya kepada، nulis = menulis، ngobrol sama = berbicara dengan (يتحادث مع)، bikin = membuat. ويقولون في الكلام أيضًا bilang kalau بدل bilang bahwa. cocok = مناسب، konten masak = محتوى طهي.
          en: udah nanya ke = sudah bertanya kepada, nulis = menulis, ngobrol sama = berbicara dengan (chat with), bikin = membuat. In speech you also hear bilang kalau instead of bilang bahwa. cocok = suitable, konten masak = cooking content.
      - speaker: Mas Joko
        text: Jadi koki yang nulis bisa kuliah di situ, Bay?
        ar_eg: يعني الطبّاخ اللي بيكتب ينفع يدرس هناك يا باي؟
        ar: أي إنّ الطاهي الذي يكتب يستطيع الدراسة هناك يا باي؟
        en: So a chef who writes can study there, Bay?
      - speaker: Bayu
        text: Bisa, Mas! Pilihan pertamaku Ilmu Komunikasi di Universitas Sumatera Utara, di Medan. Pilihan keduaku di Universitas Airlangga, Surabaya.
        ar_eg: ينفع يا ماس! أول اختيار ليّا علوم الاتصال في جامعة سومطرة الشمالية في ميدان. والاختيار التاني جامعة إيرلانجا في سورابايا.
        ar: نعم يا ماس! خياري الأوّل علوم الاتصال في جامعة سومطرة الشمالية في ميدان، والثاني في جامعة إيرلانغا في سورابايا.
        en: Yes, Mas! My first choice is Communication Studies at the University of North Sumatra, in Medan. My second is at Airlangga University in Surabaya.
      - speaker: Pak Budi
        text: Medan?! Le, Medan itu di Sumatra! Naik pesawat lho!
        ar_eg: ميدان؟! يا ابني، ميدان دي في سومطرة! بالطيّارة!
        ar: ميدان؟! يا بنيّ، ميدان في سومطرة! بالطائرة!
        en: Medan?! Son, Medan's in Sumatra! That's a plane ride!
      - speaker: Bayu
        text: Mbak Sari aja kuliah di Kairo, Pak, terus sekarang kerja di Kalimantan. Medan kan masih Indonesia. Kata Mbak Sari, merantau itu sekolah yang paling mahal, tapi juga paling berharga.
        ar_eg: أبلة ساري درست في القاهرة يا بابا، ودلوقتي بتشتغل في كاليمانتان. ميدان لسّه جوّه إندونيسيا. وأبلة ساري بتقول إن الغربة أغلى مدرسة، بس كمان أثمن مدرسة.
        ar: درست أختي ساري في القاهرة يا أبي، وهي الآن تعمل في كاليمانتان. وميدان ما زالت في إندونيسيا. وتقول أختي إنّ الغربة أغلى مدرسة، لكنّها أثمنها أيضًا.
        en: Sari studied in Cairo, Dad, and now she works in Kalimantan. Medan's still Indonesia. Sari says leaving home is the most expensive school, but also the most valuable.
        note:
          ar_eg: merantau يعني تسيب بلدك عشان تتعلّم أو تشتغل وتبني نفسك. ثقافة الـ merantau قويّة قوي في إندونيسيا، خصوصًا عند شعب المينانجكاباو في سومطرة الغربية - زي المصري اللي بيسافر يشتغل ويرجع. aja هنا بمعنى «حتّى» (Mbak Sari aja = حتّى ساري)، kan = مش كده؟، terus = lalu.
          ar: merantau أن تترك موطنك للدراسة أو العمل وبناء نفسك. وثقافة الـ merantau قوية جدًّا في إندونيسيا، ولا سيّما عند شعب المينانغكاباو في سومطرة الغربية - كالمصري الذي يسافر ليعمل ثم يعود. aja هنا بمعنى «حتّى» (Mbak Sari aja = حتّى ساري)، kan = أليس كذلك؟، terus = lalu.
          en: merantau means leaving your home region to study or work and make your way. It's a strong tradition in Indonesia, especially among the Minangkabau of West Sumatra - rather like Egyptians who go abroad to work and come back. aja here means "even" (Mbak Sari aja = even Sari), kan = right?, terus = lalu (then).
      - speaker: Bu Rahayu
        text: Anak-anak Ibu ini kayak burung. Sayapnya terlalu kuat.
        ar_eg: عيالي دول زي العصافير. جناحاتهم قويّة زيادة عن اللزوم.
        ar: أولادي هؤلاء كالطيور، أجنحتهم أقوى من اللازم.
        en: My children are like birds. Their wings are too strong.
        note:
          ar_eg: kayak = seperti، sayap = جناح.
          ar: kayak = seperti، sayap = جناح.
          en: kayak = seperti (like), sayap = wing.
      - speaker: Pak Budi
        text: Ya udah, Le. Tapi kalau kamu keterima di Medan, kamu harus belajar bikin bika ambon, terus bawa resepnya pulang.
        ar_eg: خلاص يا ابني. بس لو اتقبلت في ميدان، لازم تتعلّم تعمل «بيكا أمبون» وترجعلنا بالوصفة.
        ar: حسنًا يا بنيّ. لكن إن قُبلت في ميدان فعليك أن تتعلّم صنع «بيكا أمبون» وتعود بوصفتها.
        en: All right, son. But if you get into Medan, you have to learn to make bika ambon and bring the recipe home.
        note:
          ar_eg: bika ambon كيكة صفرا من ميدان، جوّاها شبكة خروم زي خلية النحل، معمولة بالبيض وحليب جوز الهند. اسمها فيه «أمبون» بس هي من ميدان مش من جزيرة أمبون! ya udah = baiklah، keterima = diterima، bikin = membuat، resep = وصفة.
          ar: bika ambon كعكة صفراء من ميدان، في داخلها ثقوب كخلية النحل، تُصنع من البيض وحليب جوز الهند. واسمها فيه «أمبون» لكنّها من ميدان لا من جزيرة أمبون! ya udah = baiklah، keterima = diterima، bikin = membuat، resep = وصفة.
          en: Bika ambon is a yellow cake from Medan with a honeycomb of holes inside, made with eggs and coconut milk. Despite the name, it comes from Medan, not the island of Ambon! ya udah = baiklah, keterima = diterima, bikin = membuat, resep = recipe.
      - speaker: Narrator
        text: Lima minggu kemudian, Bayu keluar dari ruang ujian UTBK dengan wajah pucat. Dia langsung menelepon kakaknya.
        ar_eg: بعد خمس أسابيع، بايو خرج من لجنة امتحان UTBK ووشّه أصفر. وكلّم أخته على طول.
        ar: بعد خمسة أسابيع خرج بايو من قاعة اختبار UTBK شاحب الوجه، واتّصل بأخته فورًا.
        en: Five weeks later, Bayu comes out of the UTBK exam room looking pale. He rings his sister straight away.
      - speaker: Bayu
        text: Mbak, katanya soal penalaran matematika paling susah. Ternyata bener! Tapi literasi bahasa Indonesia sama bahasa Inggrisnya lancar kok.
        ar_eg: يا أبلة، كانوا بيقولوا إن أسئلة الاستدلال الرياضي أصعب حاجة. وطلع كلامهم صح! بس القراءة بالإندونيسي والإنجليزي كانت سهلة.
        ar: يا أختي، قالوا إنّ أسئلة الاستدلال الرياضي هي الأصعب، وقد صدقوا! لكنّ أسئلة القراءة بالإندونيسية والإنجليزية كانت سلسة.
        en: Sis, they said the maths reasoning questions were the hardest. Turns out they were right! But the Indonesian and English literacy went smoothly.
        note:
          ar_eg: من ٢٠٢٣، امتحان UTBK مفيهوش مواد زي الكيميا والتاريخ - فيه بس اختبار قدرات دراسية، وقراءة بالإندونيسي والإنجليزي، واستدلال رياضي. bener = benar، soal = سؤال امتحان، susah = sulit، sama = dan.
          ar: منذ عام ٢٠٢٣ لم يعد اختبار UTBK يتضمّن موادّ كالكيمياء والتاريخ، بل اختبار القدرات الدراسية، والقراءة بالإندونيسية والإنجليزية، والاستدلال الرياضي. bener = benar، soal = سؤال الامتحان، susah = sulit، sama = dan.
          en: Since 2023, UTBK has no subject tests like chemistry or history - just a scholastic aptitude test, literacy in Indonesian and English, and mathematical reasoning. bener = benar, soal = exam question, susah = sulit (hard), sama = dan.
      - speaker: Sari
        text: Kata Bapak tadi pagi, yang penting kamu udah usaha. Sisanya kita serahin ke Allah. Sekarang pulang, makan, terus tidur.
        ar_eg: بابا قال الصبح إن المهمّ إنك عملت اللي عليك. والباقي على ربنا. دلوقتي روّح، كُل، ونام.
        ar: قال أبي هذا الصباح إنّ المهمّ أنّك بذلت جهدك، والباقي نتوكّل فيه على الله. والآن عُد إلى البيت، وكُل، ونم.
        en: Dad said this morning that what matters is you've done your best. The rest we leave to God. Now go home, eat, and sleep.
        note:
          ar_eg: udah usaha = sudah berusaha (عملت اللي عليك)، serahin ke = serahkan kepada (نسيبها لـ)، sisanya = الباقي.
          ar: udah usaha = sudah berusaha (بذلتَ جهدك)، serahin ke = serahkan kepada (نَكِلُه إلى)، sisanya = الباقي.
          en: udah usaha = sudah berusaha (you have done your best), serahin ke = serahkan kepada (leave it to), sisanya = the rest.
  - setting:
      ar_eg: القاهرة، شقّة كريم ونادية، العصر. نادية قدّام اللابتوب، وعلى الشاشة عشرين طالب من بيسانترين في جاوة الشرقية لابسين طواقي ومحجّبات.
      ar: القاهرة، شقّة كريم ونادية، عصرًا. نادية أمام الحاسوب، وعلى الشاشة عشرون طالبًا وطالبة من معهد ديني في جاوة الشرقية.
      en: Cairo, Karim and Nadia's flat, afternoon. Nadia is at her laptop, and on the screen are twenty students from a pesantren in East Java, the boys in caps and the girls in headscarves.
    lines:
      - speaker: Nadia
        text: Assalamualaikum, para santri! Hari ini kita belajar sedikit bahasa Arab Mesir, biar nanti kalian nggak bingung di jalanan Kairo.
        ar_eg: السلام عليكم يا طلبة! النهارده هنتعلّم شوية عربي مصري، عشان متتوهوش بعدين في شوارع القاهرة.
        ar: السلام عليكم أيّها الطلّاب! سنتعلّم اليوم شيئًا من العامية المصرية، كي لا تحتاروا لاحقًا في شوارع القاهرة.
        en: Assalamu alaikum, students! Today we'll learn a little Egyptian Arabic, so you won't be lost on the streets of Cairo later.
        note:
          ar_eg: pesantren مدرسة إسلامية داخلية، وطالبها اسمه santri. ملايين بيدرسوا فيها، وكتير من خرّيجينها بيكمّلوا في الأزهر. وكلمات كتير هناك عربي - kitab (كتاب)، ilmu (علم)، madrasah (مدرسة). biar = supaya (عشان)، bingung = متلخبط.
          ar: pesantren مدرسة إسلامية داخلية، وطالبها يُسمّى santri. يدرس فيها الملايين، ويواصل كثير من خرّيجيها في الأزهر. وكثير من كلماتها عربي - kitab (كتاب)، ilmu (علم)، madrasah (مدرسة). biar = supaya (كي)، bingung = حائر.
          en: A pesantren is an Islamic boarding school, and its students are santri. Millions study in them, and many graduates go on to Al-Azhar. Lots of the vocabulary is Arabic - kitab (book), ilmu (knowledge), madrasah (school). biar = supaya (so that), bingung = confused.
      - speaker: Mas Fikri
        text: Waalaikumsalam, Ustazah. Kata kakak kelas saya yang di Kairo, orang Mesir nggak bilang "kaifa haluk", tapi "izzayyak". Bener, Ustazah?
        ar_eg: وعليكم السلام يا أستاذة. طالب أكبر منّي في القاهرة بيقول إن المصريين مش بيقولوا «كيف حالك»، بيقولوا «إزّيّك». ده صح؟
        ar: وعليكم السلام يا أستاذة. يقول زميل أقدم منّي يدرس في القاهرة إنّ المصريين لا يقولون «كيف حالك» بل «إزّيّك». هل هذا صحيح؟
        en: Wa alaikum salam, Ustazah. A senior student of mine in Cairo says Egyptians don't say "kaifa haluk", they say "izzayyak". Is that right?
        note:
          ar_eg: Ustazah من العربي «أستاذة» (والراجل Ustaz)، والطلبة في البيسانترين بينادوا بيها المدرّسة.
          ar: Ustazah من العربية «أستاذة» (وللرجل Ustaz)، ويُنادي بها طلّاب المعاهد معلّمتهم.
          en: Ustazah comes from Arabic أستاذة (Ustaz for a man) - it's what pesantren students call their teacher.
      - speaker: Nadia
        text: Kakak kelasmu bener! Di pesantren kalian belajar bahasa Arab fusha dari kitab. Tapi di jalan, kalian bakal dengar "izzayyak" sama "ana kuwayyis". Ayo, ulangi!
        ar_eg: زميلك عنده حق! في البيسانترين بتتعلّموا الفصحى من الكتب. بس في الشارع هتسمعوا «إزّيّك» و«أنا كويّس». يلا، قولوا ورايا!
        ar: زميلك محقّ! تتعلّمون الفصحى من الكتب في المعهد، لكنّكم ستسمعون في الشارع «إزّيّك» و«أنا كويّس». هيّا، ردّدوا!
        en: Your senior's right! At the pesantren you learn fusha from books. But on the street you'll hear "izzayyak" and "ana kuwayyis". Come on, repeat!
        note:
          ar_eg: fusha = الفصحى، kitab = كتاب، bakal = akan. izzayyak = إزيّك، ana kuwayyis = أنا كويّس.
          ar: fusha = الفصحى، kitab = كتاب، bakal = akan. izzayyak = إزيّك (كيف حالك)، ana kuwayyis = أنا كويّس (أنا بخير).
          en: fusha = Standard Arabic, kitab = book, bakal = akan (will). izzayyak = how are you, ana kuwayyis = I am fine (Egyptian).
      - speaker: Mas Fikri
        text: Ustazah, saya mau nanya lagi. Bener nggak, kuliah di Al-Azhar itu gratis?
        ar_eg: يا أستاذة، عايز أسأل تاني. هل صحيح إن الدراسة في الأزهر ببلاش؟
        ar: يا أستاذة، لديّ سؤال آخر. هل صحيح أنّ الدراسة في الأزهر مجّانية؟
        en: Ustazah, I've got another question. Is it true that studying at Al-Azhar is free?
      - speaker: Nadia
        text: Buat banyak mahasiswa asing, biaya kuliahnya gratis atau murah banget, dan ada beasiswa juga. Tapi biaya hidup tetap kalian tanggung sendiri, dan kalian harus lulus tes bahasa Arab dulu.
        ar_eg: لطلبة أجانب كتير، المصاريف ببلاش أو رخيصة جدًا، وفيه منح كمان. بس مصاريف المعيشة عليكم، ولازم تنجحوا في امتحان اللغة العربية الأول.
        ar: بالنسبة إلى كثير من الطلاب الأجانب، الرسوم الدراسية مجّانية أو زهيدة جدًّا، وهناك منح أيضًا. لكنّ نفقات المعيشة عليكم، وعليكم اجتياز اختبار اللغة العربية أوّلًا.
        en: For many international students the tuition is free or very cheap, and there are scholarships too. But you cover your own living costs, and you have to pass an Arabic test first.
        note:
          ar_eg: buat = untuk، tanggung sendiri = تشيلوها لوحدكم (تدفعوها).
          ar: buat = untuk، tanggung sendiri = تتحمّلونها بأنفسكم.
          en: buat = untuk (for), tanggung sendiri = bear (pay) yourselves.
      - speaker: Mas Fikri
        text: Kata ustaz kami, sistem talaqqi di Al-Azhar mirip sama cara ngaji di pesantren. Santri duduk di depan guru, terus baca kitab bareng-bareng.
        ar_eg: شيخنا بيقول إن نظام التلقّي في الأزهر شبه طريقة الدرس في البيسانترين. الطالب بيقعد قدّام الشيخ، ويقروا الكتاب سوا.
        ar: يقول أستاذنا إنّ نظام التلقّي في الأزهر يشبه طريقة الدرس في المعهد، إذ يجلس الطالب أمام الشيخ ويقرآن الكتاب معًا.
        en: Our teacher says the talaqqi system at Al-Azhar is like the way we study at the pesantren. Students sit in front of the teacher and read the book together.
        note:
          ar_eg: talaqqi من العربي «تلقّي» - إنك تاخد العلم من الشيخ وش لوش. والبيسانترين عندها طرق شبهها - bandongan (الشيخ بيقرا والطلبة بيكتبوا الشرح) وsorogan (الطالب بيقرا قدّام الشيخ). mirip sama = mirip dengan (شبه)، ngaji = mengaji (يقرا قرآن/كتب دين)، bareng-bareng = bersama-sama.
          ar: talaqqi من العربية «تلقّي» - أخذ العلم عن الشيخ مشافهةً. وفي المعاهد طرق مشابهة - bandongan (يقرأ الشيخ ويدوّن الطلّاب الشرح) وsorogan (يقرأ الطالب بين يدي الشيخ). mirip sama = mirip dengan (يشبه)، ngaji = mengaji (يقرأ القرآن وكتب الدين)، bareng-bareng = bersama-sama.
          en: talaqqi, from Arabic تلقّي, is learning face to face from a sheikh. Pesantren have similar methods - bandongan (the teacher reads while students annotate) and sorogan (a student reads aloud to the teacher). mirip sama = mirip dengan (similar to), ngaji = mengaji (recite, study religious texts), bareng-bareng = bersama-sama (together).
      - speaker: Nadia
        text: Ustazmu bener. Bedanya, di Al-Azhar kalian bakal duduk bareng mahasiswa dari puluhan negara. Kalian belajar ilmu, dan belajar dunia juga.
        ar_eg: شيخك عنده حق. الفرق إنكم في الأزهر هتقعدوا مع طلبة من عشرات البلاد. هتتعلّموا العلم، وهتتعلّموا الدنيا كمان.
        ar: أستاذك محقّ. والفرق أنّكم ستجلسون في الأزهر مع طلّاب من عشرات البلدان، فتتعلّمون العلم وتتعلّمون العالم أيضًا.
        en: Your teacher's right. The difference is, at Al-Azhar you'll sit with students from dozens of countries. You'll learn knowledge, and learn the world too.
        note:
          ar_eg: bedanya = الفرق، bareng = bersama، puluhan = عشرات.
          ar: bedanya = الفرق، bareng = bersama، puluhan = عشرات.
          en: bedanya = the difference is, bareng = bersama (with), puluhan = dozens.
      - speaker: Narrator
        text: Setelah kelas selesai, Nadia menelepon Sari di Balikpapan.
        ar_eg: بعد ما الحصّة خلصت، نادية كلّمت ساري في باليكبابان.
        ar: بعد انتهاء الدرس اتّصلت نادية بساري في باليكبابان.
        en: After class, Nadia rings Sari in Balikpapan.
      - speaker: Nadia
        text: Sari, murid-muridku nanya apakah kamu mau ngisi kelas tamu. Mereka bilang mereka pengen denger cerita alumni Al-Azhar yang sekarang udah kerja.
        ar_eg: يا ساري، طلبتي بيسألوا لو ممكن تيجي ضيفة في حصّة. بيقولوا إنهم عايزين يسمعوا حكاية خرّيجة أزهر بتشتغل دلوقتي.
        ar: يا ساري، يسأل طلّابي إن كنتِ تقبلين أن تكوني ضيفة في درس. يقولون إنّهم يريدون سماع قصّة خرّيجة من الأزهر تعمل الآن.
        en: Sari, my students are asking whether you'd do a guest class. They said they'd like to hear from an Al-Azhar graduate who's working now.
        note:
          ar_eg: 'السؤال المنقول بيستعمل apakah (هل / لو) - «هم سألوا: إنتي عايزة؟» ← mereka bertanya apakah kamu mau. وفي الكلام بيسيبوا apakah كتير - kamu mau ngisi kelas tamu, nggak? nanya = bertanya، ngisi = mengisi (هنا يدّي حصّة)، pengen denger = ingin mendengar، udah kerja = sudah bekerja، bilang = قال.'
          ar: 'يُنقل السؤال باستعمال apakah (هل / إن كان) - «سألوا: هل تريدين؟» ← mereka bertanya apakah kamu mau. وفي الكلام يحذفون apakah كثيرًا - kamu mau ngisi kelas tamu, nggak? nanya = bertanya، ngisi = mengisi (هنا يُلقي حصّة)، pengen denger = ingin mendengar، udah kerja = sudah bekerja، bilang = قال.'
          en: A reported yes/no question uses apakah (whether) - "they asked, do you want to?" → mereka bertanya apakah kamu mau. In speech apakah is often dropped - kamu mau ngisi kelas tamu, nggak? nanya = bertanya, ngisi = mengisi (here, to lead a class), pengen denger = ingin mendengar, udah kerja = sudah bekerja, bilang = said.
      - speaker: Sari
        text: Mau dong! Bilang ke mereka, empat tahun lalu aku juga nanya hal yang sama persis.
        ar_eg: طبعًا عايزة! قوليلهم إن من أربع سنين، أنا كمان سألت نفس الأسئلة بالظبط.
        ar: طبعًا أريد! قولي لهم إنّني قبل أربع سنوات سألتُ الأسئلة نفسها تمامًا.
        en: Of course! Tell them that four years ago, I asked exactly the same questions.
        note:
          ar_eg: mau dong = طبعًا عايزة!، bilang ke = bilang kepada (قول لـ)، nanya = bertanya، hal = حاجة، persis = بالظبط.
          ar: mau dong = طبعًا أريد!، bilang ke = bilang kepada (قل لـ)، nanya = bertanya، hal = أمر، persis = تمامًا.
          en: mau dong = of course I do!, bilang ke = bilang kepada (tell), nanya = bertanya, hal = thing, persis = exactly.
      - speaker: Nadia
        text: Oh ya, Karim titip salam buat Bayu. Katanya, semoga sukses ujiannya.
        ar_eg: آه صحيح، كريم بيسلّم على بايو. وبيقوله ربنا يوفّقه في الامتحان.
        ar: آه صحيح، كريم يُقرئ بايو السلام، ويقول إنّه يتمنّى له النجاح في الامتحان.
        en: Oh, and Karim sends his regards to Bayu. He says good luck with the exam.
        note:
          ar_eg: titip salam (حرفيًا «يأمّن سلام») يعني تبعت سلامك مع حدّ - زي «سلّملي على فلان». والردّ عليها salam kembali (وعليه السلام).
          ar: titip salam (حرفيًّا «يستودع سلامًا») تعني إرسال التحيّة مع أحد، كقولنا «أقرئه منّي السلام». والردّ salam kembali (وعليه السلام).
          en: titip salam ("to entrust a greeting") means sending your regards through someone - "say hi to so-and-so for me". The reply is salam kembali (regards back).
      - speaker: Sari
        text: Karim? Sejak kapan dia rajin titip salam buat Bayu?
        ar_eg: كريم؟ من إمتى وهو بيسلّم على بايو كده؟
        ar: كريم؟ منذ متى صار يحرص على إرسال السلام إلى بايو؟
        en: Karim? Since when has he been so keen on sending Bayu his regards?
        note:
          ar_eg: titip salam = يبعت سلام، buat = untuk.
          ar: titip salam = يُرسل السلام، buat = untuk.
          en: titip salam = send regards, buat = untuk.
      - speaker: Nadia
        text: Sejak... cuaca di Kairo cerah terus.
        ar_eg: من ساعة... ما الجوّ في القاهرة بقى صافي على طول.
        ar: منذ... أن صار الجوّ في القاهرة صافيًا على الدوام.
        en: Since... the weather in Cairo has been so clear.
