questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الغلط في جملة كريم الأولانية؟
      ar: ما الخطأ في جملة كريم الأولى؟
      en: What was wrong with Karim's first sentence?
    options: ["pangkon ing tengah", "ora ana cecak", "kakehan wulu"]
    answer: 0
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: في ꦏꦫꦶꦩ꧀ꦩꦔꦤ꧀ꦱꦼꦒ، الـma التانية فين؟
      ar: في ꦏꦫꦶꦩ꧀ꦩꦔꦤ꧀ꦱꦼꦒ، أين الـma الثانية؟
      en: In ꦏꦫꦶꦩ꧀ꦩꦔꦤ꧀ꦱꦼꦒ, where is the second ma?
    options: ["ing nduwur", "ing ngisor", "ing sandhinge"]
    answer: 1
  - id: q03
    type: fill_blank
    sentence: Lurunge ___ banget. Yen ana motor liwat, Karim kudu mepet tembok.
    meaning:
      ar_eg: الحارة ضيّقة أوي. لو عدّى موتوسيكل، كريم لازم يلزق في الحيطة.
      ar: الزقاق ضيّق جدًّا. إن مرّت درّاجة نارية، على كريم أن يلتصق بالجدار.
      en: The lane is very narrow. When a motorbike passes, Karim has to press against the wall.
    answers: [ciut]
    options: ["ciut", "amba", "dawa"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: ليه «basa Jawa kanggo wong Mesir» مش محتاجة pasangan؟
      ar: لماذا لا تحتاج «basa Jawa kanggo wong Mesir» إلى pasangan؟
      en: Why does "basa Jawa kanggo wong Mesir" need no pasangan?
    options: ["cecak lan layar nutup wanda", "ora ana aksara", "kabeh nganggo pangkon"]
    answer: 0
  - id: q05
    type: translate
    direction: from_target
    source_text: Iki kanggo bukumu, Mas. Hadiah saka Jagalan.
    answers_meaning:
      ar_eg: ["ده عشان كتابك يا ماس. هدية من جاجالان.", "دي لكتابك يا ماس، هدية من جاجالان."]
      ar: ["هذا لكتابك يا ماس. هديّة من جاغالان."]
      en: ["This is for your book, Mas. A gift from Jagalan.", "Here's something for your book, Mas - a gift from Jagalan."]
next:
  ar_eg: في إيموجيري، كريم بيعدّ ٤٠٩ سلّمة لحدّ مقابر السلطان أجونج... وفوق، صوت يعرفه - باك هارجو، مدرّس الكراما بتاعه! بيكتب له الرقم بالأرقام الجاوي وحروف كبيرة غريبة... وكلمة واحدة بتخلّي كريم يصرّخ - «kabar» جاية من العربي!
  ar: في إيموجيري يعدّ كريم ٤٠٩ درجات حتى مقابر السلطان أغونغ... وفي الأعلى صوت يعرفه - باك هارجو، معلّم الكراما! يكتب له العدد بالأرقام الجاوية وحروفًا كبيرة غريبة... وكلمة واحدة تجعل كريمًا يصيح - «kabar» من العربية!
  en: In Imogiri, Karim counts 409 steps up to Sultan Agung's tomb... and at the top, a voice he knows - Pak Harjo, his krama teacher! He writes the number in Javanese numerals, and strange big letters... and one word makes Karim shout - "kabar" comes from Arabic!
review:
  status: draft
  verified: false
  notes: Mas Bimo is the Jagalan silversmith from lesson j6.u04.l12 (Dimas's friend), kept consistent. Check the aksara strings in a Javanese font, especially that ꦏꦫꦶꦩ꧀ꦩꦔꦤ꧀ꦱꦼꦒ shapes as pasangan ma (below) and pasangan sa (beside), and that the spaced "wrong" version shows visible pangkon. "Tak terke" (I'll take you) and "nempelke" are Yogya ngoko - check spelling.
