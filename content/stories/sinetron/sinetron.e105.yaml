series: sinetron
episode: 105
language: jv
level: j6
unlock_after: j6.u04
title:
  target: Aksara sing ndhelik
  ar_eg: الحروف المستخبّية
  ar: الحروف المختبئة
  en: The hidden letters
summary:
  ar_eg: كريم كتب أول جملة كاملة ليه بالحروف الجاوي، بس حطّ pangkon في نصّها. ماس ديماس بياخده في حواري جاجالان الضيّقة لصاحبه ماس بيمو، الصايغ اللي بيكتب حروف جاوي على الفضّة كل يوم. وبيمو بيوريه الـpasangan - الشكل التاني لكل حرف.
  ar: كتب كريم أوّل جملة كاملة له بالحروف الجاوية، لكنّه وضع pangkon في وسطها. يأخذه ماس ديماس عبر أزقّة جاغالان الضيّقة إلى صديقه ماس بيمو، الصائغ الذي يكتب الحروف الجاوية على الفضّة كلّ يوم. ويريه بيمو الـpasangan - الشكل الثاني لكلّ حرف.
  en: Karim wrote his first full sentence in Javanese script, but put a pangkon in the middle. Mas Dimas leads him through the narrow lanes of Jagalan to his friend Mas Bimo, a silversmith who writes Javanese letters on silver every day. Bimo shows him pasangan - the second form of each letter.
cast: [Karim, Mas Dimas, Mas Bimo]
scenes:
  - setting:
      ar_eg: حارة ضيّقة في جاجالان، الصبح. بيوت قديمة لازقة في بعض، والحارة يدوب تساع اتنين. كريم بيورّي ديماس الكرّاسة بفخر.
      ar: زقاق ضيّق في جاغالان، صباحًا. بيوت قديمة متلاصقة، والزقاق بالكاد يتّسع لشخصين. يُري كريم ديماسَ دفتره بفخر.
      en: A narrow lane in Jagalan, morning. Old houses pressed together, the lane barely wide enough for two. Karim proudly shows Dimas his notebook.
    lines:
      - speaker: Karim
        text: "Dimas, delengen! Karim mangan sega. Aku nulis dhewe!"
        ar_eg: ديماس، بصّ! «كريم بياكل رز». أنا كاتبها بنفسي!
        ar: ديماس، انظر! «كريم يأكل الأرز». كتبتها بنفسي!
        en: Dimas, look! "Karim eats rice." I wrote it myself!
        note:
          ar_eg: "في الكشكول: ꦏꦫꦶꦩ꧀ ꦩꦔꦤ꧀ ꦱꦼꦒ = Karim mangan sega."
          ar: "في الدفتر: ꦏꦫꦶꦩ꧀ ꦩꦔꦤ꧀ ꦱꦼꦒ = Karim mangan sega."
          en: "In the notebook: ꦏꦫꦶꦩ꧀ ꦩꦔꦤ꧀ ꦱꦼꦒ = Karim mangan sega."
      - speaker: Mas Dimas
        text: Hehe, apik, Mas. Nanging pangkone ana ing tengah. Wacane dadi mandheg-mandheg.
        ar_eg: هههه، حلو يا ماس. بس الـpangkon في النصّ. القراية بقت متقطّعة.
        ar: هههه، جميل يا ماس. لكنّ الـpangkon في الوسط. فصارت القراءة متقطّعة.
        en: Hehe, nice, Mas. But the pangkon is in the middle. It reads all stop-start.
        note:
          ar_eg: "كلمات: tengah = نص، وسط."
          ar: "مفردات: tengah = وسط، منتصف."
          en: "Words: tengah = middle, centre."
      - speaker: Karim
        text: Pak Slamet uga ngomong ngono. Banjur kepiye carane?
        ar_eg: باك سلامت قال كده برضه. طب أعمل إيه؟
        ar: قال باك سلامت ذلك أيضًا. فكيف أفعل إذن؟
        en: Pak Slamet said that too. So how do I do it?
        note:
          ar_eg: "كلمات: carane = الطريقة، إزاي؛ kepiye = إزاي، عامل إيه."
          ar: "مفردات: carane = الطريقة، كيفية؛ kepiye = كيف."
          en: "Words: carane = the way (to), how; kepiye = how, what about."
      - speaker: Mas Dimas
        text: Ayo, tak terke menyang kancaku, Mas Bimo. Saben dina dheweke nulis aksara Jawa ing perak.
        ar_eg: يلّا، هوصّلك لصاحبي ماس بيمو. كل يوم بيكتب حروف جاوي على الفضّة.
        ar: هيّا، سأوصلك إلى صديقي ماس بيمو. إنّه يكتب الحروف الجاوية على الفضّة كلّ يوم.
        en: Come on, I'll take you to my friend Mas Bimo. Every day he writes Javanese letters on silver.
        note:
          ar_eg: كوتاجيدي مشهورة بشغل الفضّة من أيام ماتارام. وحواري جاجالان الضيّقة (زي حارة Rukunan) بين بيوت قديمة لازقة في بعض.
          ar: كوتاغيدي مشهورة بصياغة الفضّة منذ أيّام ماتارام. وأزقّة جاغالان الضيّقة (مثل زقاق Rukunan) تمرّ بين بيوت قديمة متلاصقة.
          en: Kotagede has been famous for silverwork since the Mataram days. The narrow Jagalan lanes (like the Rukunan alley) run between old houses pressed together.
      - speaker: Narrator
        text: Lurunge ciut banget. Yen ana motor liwat, Karim kudu mepet tembok.
        ar_eg: الحارة ضيّقة أوي. لو عدّى موتوسيكل، كريم لازم يلزق في الحيطة.
        ar: الزقاق ضيّق جدًّا. إن مرّت درّاجة نارية، على كريم أن يلتصق بالجدار.
        en: The lane is very narrow. When a motorbike passes, Karim has to press against the wall.
  - setting:
      ar_eg: ورشة ماس بيمو. صوت شاكوش صغيّر بيخبّط على الفضّة. على الترابيزة أساور وخواتم وعليها حروف جاوي.
      ar: ورشة ماس بيمو. صوت مطرقة صغيرة تطرق الفضّة. على الطاولة أساور وخواتم عليها حروف جاوية.
      en: Mas Bimo's workshop. A small hammer taps on silver. On the table, bracelets and rings with Javanese letters.
    lines:
      - speaker: Mas Bimo
        text: Monggo pinarak, Mas. Iki tulisane sampeyan? Wah, pangkone kakehan, hehe.
        ar_eg: اتفضّل اقعد يا ماس. دي كتابتك؟ يا راجل، الـpangkon كتير أوي، هههه.
        ar: تفضّل اجلس يا ماس. هذه كتابتك؟ يا رجل، الـpangkon كثيرة جدًّا، هههه.
        en: Please, have a seat, Mas. Is this your writing? Wow, too many pangkon, hehe.
      - speaker: Mas Bimo
        text: Yen aksara mati ana ing tengah ukara, aksara sabanjure ganti rupa. Iki jenenge pasangan.
        ar_eg: لو فيه حرف ساكن في نصّ الجملة، الحرف اللي بعده بيغيّر شكله. ده اسمه pasangan.
        ar: إن كان في وسط الجملة حرف ساكن، غيّر الحرف الذي يليه شكله. هذا اسمه pasangan.
        en: When a dead letter is in the middle of a sentence, the next letter changes its form. That's called pasangan.
        note:
          ar_eg: "كلمات: rupa = شكل، منظر."
          ar: "مفردات: rupa = شكل، هيئة."
          en: "Words: rupa = appearance, look, form."
      - speaker: Mas Bimo
        text: "Delengen. Karim mangan sega. Ma sing kapindho ndhelik ing ngisor. Sa ana ing sandhinge."
        ar_eg: "بصّ. «كريم بياكل رز». الـma التانية مستخبّية تحت. والـsa جنب الحرف."
        ar: "انظر. «كريم يأكل الأرز». الـma الثانية مختبئة في الأسفل. والـsa بجانب الحرف."
        en: "Look. Karim mangan sega. The second ma hides underneath. The sa sits beside."
        note:
          ar_eg: "ꦏꦫꦶꦩ꧀ꦩꦔꦤ꧀ꦱꦼꦒ = Karim mangan sega. الـm بتاعة Karim بتموت، فالـma بتاعة mangan بتنزل تحتها كـpasangan. والـn بتاعة mangan بتموت، فالـsa بتاعة sega بتيجي جنبها بشكلها التاني. ومفيش مسافات - الجاوي بيتكتب لازق. كلمات: ngisor = تحت."
          ar: "ꦏꦫꦶꦩ꧀ꦩꦔꦤ꧀ꦱꦼꦒ = Karim mangan sega. تسكن m في Karim، فتنزل ma في mangan تحتها pasangan. وتسكن n في mangan، فتأتي sa في sega بجانبها بشكلها الثاني. ولا مسافات - تُكتب الجاوية متّصلة. مفردات: ngisor = أسفل، تحت."
          en: "ꦏꦫꦶꦩ꧀ꦩꦔꦤ꧀ꦱꦼꦒ = Karim mangan sega. The m of Karim is dead, so the ma of mangan drops below it as a pasangan. The n of mangan is dead, so the sa of sega comes beside it in its second form. No spaces - Javanese is written joined up. Words: ngisor = below, under, downstairs."
      - speaker: Karim
        text: Kaya huruf Arab sing gandheng! Saben huruf duwe rupa loro.
        ar_eg: زي الحروف العربي اللي بتتوصل في بعض! كل حرف ليه شكلين.
        ar: مثل الحروف العربية المتّصلة! لكلّ حرف شكلان.
        en: Like joined-up Arabic letters! Every letter has two forms.
      - speaker: Mas Dimas
        text: Bener, Mas. Lan saben bocah Jawa ya bingung karo pasangan, aja kuwatir.
        ar_eg: صحّ يا ماس. وكل عيّل جاوي بيتلخبط في الـpasangan برضه، متقلقش.
        ar: صحيح يا ماس. وكلّ طفل جاويّ يرتبك مع الـpasangan أيضًا، لا تقلق.
        en: True, Mas. And every Javanese kid gets confused by pasangan too, don't worry.
  - setting:
      ar_eg: بيمو ماسك ورقة فضّة رفيعة على شكل فاصل كتاب، وبيبدأ ينقش عليها.
      ar: يمسك بيمو صفيحة فضّة رقيقة على شكل فاصل كتاب، ويبدأ بالنقش عليها.
      en: Bimo holds a thin silver strip shaped like a bookmark and starts engraving it.
    lines:
      - speaker: Mas Bimo
        text: Mas Dimas crita, sampeyan nulis buku. Judule apa?
        ar_eg: ماس ديماس حكالي إنك بتكتب كتاب. اسمه إيه؟
        ar: أخبرني ماس ديماس أنّك تكتب كتابًا. ما عنوانه؟
        en: Mas Dimas says you're writing a book. What's the title?
        note:
          ar_eg: "كلمات: judule = العنوان، اسمه."
          ar: "مفردات: judule = العنوان."
          en: "Words: judule = the title."
      - speaker: Karim
        text: Basa Jawa kanggo wong Mesir.
        ar_eg: الجاوي للمصريين.
        ar: الجاوية للمصريين.
        en: Javanese for Egyptians.
      - speaker: Mas Bimo
        text: "Basa Jawa kanggo wong Mesir. Ora butuh pasangan. Cecak lan layar wis nutup wandane."
        ar_eg: "جاوي للمصريين. مش محتاجة pasangan. الـcecak والـlayar قفلوا المقطع خلاص."
        ar: "الجاوية للمصريين. لا تحتاج إلى pasangan. فالـcecak والـlayar أغلقا المقطع."
        en: "Javanese for Egyptians. No pasangan needed. Cecak and layar already close the syllable."
        note:
          ar_eg: "ꦧꦱꦗꦮꦏꦁꦒꦺꦴꦮꦺꦴꦁꦩꦼꦱꦶꦂ = Basa Jawa kanggo wong Mesir. kanggo وwong بيخلصوا بـcecak ꦁ، وMesir بتخلص بـlayar ꦂ. العلامات دي بتقفل المقطع لوحدها، فالحرف اللي بعدها بيفضل بشكله العادي. كلمات: nutup = يقفل، يغطي."
          ar: "ꦧꦱꦗꦮꦏꦁꦒꦺꦴꦮꦺꦴꦁꦩꦼꦱꦶꦂ = Basa Jawa kanggo wong Mesir. تنتهي kanggo وwong بـcecak ꦁ، وتنتهي Mesir بـlayar ꦂ. هذه العلامات تُغلق المقطع وحدها، فيبقى الحرف التالي بشكله العاديّ. مفردات: nutup = يُغلق، يغطّي."
          en: "ꦧꦱꦗꦮꦏꦁꦒꦺꦴꦮꦺꦴꦁꦩꦼꦱꦶꦂ = Basa Jawa kanggo wong Mesir. kanggo and wong end in cecak ꦁ, Mesir ends in layar ꦂ. These marks close the syllable on their own, so the next letter keeps its normal form. Words: nutup = to close, cover."
      - speaker: Mas Bimo
        text: Iki kanggo bukumu, Mas. Hadiah saka Jagalan.
        ar_eg: ده عشان كتابك يا ماس. هدية من جاجالان.
        ar: هذا لكتابك يا ماس. هديّة من جاغالان.
        en: This is for your book, Mas. A gift from Jagalan.
      - speaker: Karim
        text: Matur nuwun sanget, Mas. Saiki cecak lan layar kancaku!
        ar_eg: متشكّر أوي يا ماس. دلوقتي الـcecak والـlayar بقوا صحابي!
        ar: شكرًا جزيلًا يا ماس. صارت الـcecak والـlayar صديقتيّ الآن!
        en: Thank you so much, Mas. Cecak and layar are my friends now!
      - speaker: Narrator
        text: "Ing kaca telung puluh lima, Karim nempelke pembatas buku perak. Lan ngisore, Karim mangan sega, tanpa pangkon ing tengah."
        ar_eg: في صفحة خمسة وتلاتين، كريم لزق فاصل الكتاب الفضّة. وتحته «كريم بياكل رز»، من غير pangkon في النصّ.
        ar: في الصفحة الخامسة والثلاثين ألصق كريم فاصل الكتاب الفضّيّ. وتحته «كريم يأكل الأرز»، دون pangkon في الوسط.
        en: On page thirty-five, Karim sticks in the silver bookmark. And underneath, Karim mangan sega, with no pangkon in the middle.
        note:
          ar_eg: "ꦏꦫꦶꦩ꧀ꦩꦔꦤ꧀ꦱꦼꦒ = Karim mangan sega. كلمات: ngisore = تحته، الجزء اللي تحت؛ telung = تلات (قبل اسم)."
          ar: "ꦏꦫꦶꦩ꧀ꦩꦔꦤ꧀ꦱꦼꦒ = Karim mangan sega. مفردات: ngisore = أسفله، تحته؛ telung = ثلاثة (قبل الاسم)."
          en: "ꦏꦫꦶꦩ꧀ꦩꦔꦤ꧀ꦱꦼꦒ = Karim mangan sega. Words: ngisore = underneath it, the bottom (of it); telung = three (before a noun)."
