title:
  target: Ditulis dening Mbak Ayu
  ar_eg: كتبته مباك أيو
  ar: كتبته مباك أيو
  en: Written by Mbak Ayu
summary:
  ar_eg: في معرض قطورات قديمة في محطة ماديون، كريم بيقرا لوحات المعرض المكتوبة بالمبني للمجهول - dibangun dening، kapilih، tinulis. وبعدين مباك أيو بتورّيه خبر قصيّر نزل في نشرة الجامعة... عنه هو.
  ar: في معرض قطارات قديمة في محطّة ماديون، يقرأ كريم لوحات المعرض المكتوبة بالمبني للمجهول - dibangun dening وkapilih وtinulis. ثمّ تريه مباك أيو خبرًا قصيرًا نُشر في نشرة الجامعة... عنه هو.
  en: At an old-train exhibition in Madiun station, Karim reads exhibition boards written in the passive - dibangun dening, kapilih, tinulis. Then Mbak Ayu shows him a short news item in the university newsletter... about him.
cast: [Karim, Mbak Ayu]
scenes:
  - setting:
      ar_eg: محطة ماديون، الضهر. معرض صور قطورات قديمة على الرصيف، وجنبه عربية قطر جديدة من إينكا.
      ar: محطّة ماديون، ظهرًا. معرض صور قطارات قديمة على الرصيف، وبجانبه عربة قطار جديدة من إينكا.
      en: Madiun station, midday. An exhibition of old train photos on the platform, next to a brand-new INKA carriage.
    lines:
      - speaker: Mbak Ayu
        text: Mas, gerbong anyar kae dibangun neng Madiun, lho. Saiki wacanen papan pameran iki.
        ar_eg: يا ماس، عربية القطر الجديدة اللي هناك دي اتبنت في ماديون على فكرة. دلوقتي اقرا لوحة المعرض دي.
        ar: يا ماس، عربة القطار الجديدة تلك بُنيت في ماديون بالمناسبة. والآن اقرأ لوحة المعرض هذه.
        en: Mas, that new carriage over there was built here in Madiun, you know. Now read this exhibition board.
      - speaker: Karim
        text: "Stasiun iki dibangun dening perusahaan sepur Walanda ing abad kaping sangalas."
        ar_eg: «المحطة دي اتبنت على إيد شركة سكّة حديد هولندية في القرن التسعتاشر».
        ar: «بُنيت هذه المحطّة على يد شركة سكك حديدية هولندية في القرن التاسع عشر».
        en: '"This station was built by a Dutch railway company in the nineteenth century."'
        note:
          ar_eg: "في الكتابة الجاوي، المبني للمجهول هو di- + الفعل + dening (بواسطة). dibangun dening = «اتبنى على إيد». كلمات: kaping = مرة (في العدّ)."
          ar: "في الكتابة الجاوية، المبني للمجهول = di- + الفعل + dening (من قِبَل). dibangun dening = «بُني على يد». مفردات: kaping = مرة، المرة الـ"
          en: "In written Javanese, the passive is di- + verb + dening (by). dibangun dening = \"was built by\". Words: kaping = times, -th (time)."
      - speaker: Karim
        text: "Foto iki kapilih dadi foto paling apik ing pameran."
        ar_eg: «الصورة دي اتختارت أحسن صورة في المعرض».
        ar: «اختيرت هذه الصورة أفضل صورة في المعرض».
        en: '"This photo was chosen as the best photo in the exhibition."'
        note:
          ar_eg: ka- طريقة مجهول تانية، رسمية أكتر - kapilih = «اتختار». وكمان فيه الحشوة -in- - tinulis = «مكتوب».
          ar: ka- صيغة مجهول أخرى أكثر رسمية - kapilih = «اختير». وهناك أيضًا الحشو -in- - tinulis = «مكتوب».
          en: ka- is another, more formal passive - kapilih = "was chosen". There's also the infix -in- - tinulis = "written".
      - speaker: Mbak Ayu
        text: Pinter! Ing kene uga ana majalah Panjebar Semangat lawas. Majalah basa Jawa wiwit taun telung puluhan.
        ar_eg: شاطر! وهنا كمان فيه مجلّة «پانجيبار سيمانجات» قديمة. مجلّة بالجاوي من التلاتينات.
        ar: ممتاز! وهنا أيضًا مجلّة «بانجيبار سيمانغات» قديمة. مجلّة بالجاوية منذ الثلاثينيات.
        en: Clever! There are old copies of Panjebar Semangat here too. A Javanese-language magazine since the 1930s.
        note:
          ar_eg: Panjebar Semangat مجلّة أسبوعية بالجاوي بتطلع من سورابايا من التلاتينات، وJaya Baya كمان. لحدّ النهارده فيه صحافة بالجاوي.
          ar: Panjebar Semangat مجلّة أسبوعية بالجاوية تصدر في سورابايا منذ الثلاثينيات، ومثلها Jaya Baya. وما زالت هناك صحافة بالجاوية حتى اليوم.
          en: Panjebar Semangat is a Javanese weekly published in Surabaya since the 1930s, and so is Jaya Baya. There's still Javanese-language press today.
  - setting:
      ar_eg: على كنبة في الرصيف. مباك أيو بتطلّع تليفونها وبتبتسم ابتسامة غريبة.
      ar: على مقعد في الرصيف. تُخرج مباك أيو هاتفها وتبتسم ابتسامة غامضة.
      en: On a bench on the platform. Mbak Ayu takes out her phone with a mysterious smile.
    lines:
      - speaker: Mbak Ayu
        text: Mas, ana warta cekak anyar. Wacanen.
        ar_eg: يا ماس، فيه خبر قصيّر جديد. اقراه.
        ar: يا ماس، هناك خبر قصير جديد. اقرأه.
        en: Mas, there's a new short news item. Read it.
        note:
          ar_eg: "كلمات: cekak = قصير / مختصر."
          ar: "مفردات: cekak = قصير / مختصر."
          en: "Words: cekak = short, brief = singkat, pendek."
      - speaker: Karim
        text: "Buku basa Jawa kanggo wong Mesir lagi ditulis dening penerjemah saka Kairo..."
        ar_eg: «كتاب جاوي للمصريين بيكتبه مترجم من القاهرة...»
        ar: «كتاب بالجاوية للمصريين يكتبه مترجم من القاهرة...»
        en: '"A Javanese book for Egyptians is being written by a translator from Cairo..."'
        note:
          ar_eg: "كلمات: ditulis = مكتوب، اتكتب."
          ar: "مفردات: ditulis = كُتِب."
          en: "Words: ditulis = to be written."
      - speaker: Karim
        text: Lho! Iki aku!
        ar_eg: إيه ده! ده أنا!
        ar: ماذا! هذا أنا!
        en: What! That's me!
      - speaker: Mbak Ayu
        text: Hehe. Warta iku tinulis dening aku, kanggo buletin kampus. Wis diwaca rong atus wong.
        ar_eg: هيهي. الخبر ده أنا اللي كتبته، لنشرة الجامعة. واتقرا من ميتين واحد.
        ar: هيهي. أنا من كتب هذا الخبر، لنشرة الجامعة. وقد قرأه مئتا شخص.
        en: Hehe. That piece was written by me, for the campus newsletter. Two hundred people have read it.
        note:
          ar_eg: "كلمات: rong = اتنين (قبل وحدة)؛ diwaca = يتقرا."
          ar: "مفردات: rong = اثنان (قبل المعدود)؛ diwaca = يُقرأ."
          en: "Words: rong = two (before a unit); diwaca = to be read."
      - speaker: Karim
        text: Rong atus! Waduh. Saiki bukune kudu apik tenan.
        ar_eg: ميتين! يا خبر. يبقى الكتاب لازم يطلع حلو بجدّ.
        ar: مئتان! يا للهول. إذن يجب أن يكون الكتاب جيّدًا حقًّا.
        en: Two hundred! Oh no. Now the book really has to be good.
        note:
          ar_eg: "كلمات: kudu = لازم."
          ar: "مفردات: kudu = يجب."
          en: "Words: kudu = must = harus."
      - speaker: Mbak Ayu
        text: Mulane, sesuk ayo dandani ejaane. Akeh tembung sing ditulis kaya diucapake.
        ar_eg: عشان كده، بكرة يلّا نصلّح الإملاء. فيه كلمات كتير مكتوبة زي ما بتتنطق.
        ar: لذلك، غدًا هيّا نصحّح الإملاء. كلمات كثيرة مكتوبة كما تُنطق.
        en: That's why tomorrow we fix the spelling. Lots of words are written the way they're pronounced.
        note:
          ar_eg: "كلمات: kaya = زي، كأنّ."
          ar: "مفردات: kaya = مثل."
          en: "Words: kaya = like, as = seperti."
