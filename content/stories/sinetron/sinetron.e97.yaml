title:
  target: Ditulis dening Mbak Ayu
  ar_eg: كتبته مباك أيو
  ar: كتبته مباك أيو
  en: Written by Mbak Ayu
summary:
  ar_eg: في لاوانج سيو، «بيت الألف باب»، كريم بيقرا لوحات المعرض المكتوبة بالمبني للمجهول - dibangun dening، kapilih، tinulis. وبعدين مباك أيو بتورّيه خبر قصيّر نزل في نشرة الجامعة... عنه هو.
  ar: في لاوانغ سيو، «بيت الألف باب»، يقرأ كريم لوحات المعرض المكتوبة بالمبني للمجهول - dibangun dening وkapilih وtinulis. ثمّ تريه مباك أيو خبرًا قصيرًا نُشر في نشرة الجامعة... عنه هو.
  en: At Lawang Sewu, "the house of a thousand doors", Karim reads exhibition boards written in the passive - dibangun dening, kapilih, tinulis. Then Mbak Ayu shows him a short news item in the university newsletter... about him.
cast: [Karim, Mbak Ayu]
scenes:
  - setting:
      ar_eg: لاوانج سيو في سيمارانج، الضهر. مبنى هولندي أبيض ضخم فيه أبواب وشبابيك مالهاش عدد. لوحات معرض في الممرّ.
      ar: لاوانغ سيو في سيمارانغ، ظهرًا. مبنى هولنديّ أبيض ضخم فيه أبواب ونوافذ لا تُحصى. لوحات معرض في الممرّ.
      en: Lawang Sewu in Semarang, midday. A huge white Dutch building with countless doors and windows. Exhibition boards line the corridor.
    lines:
      - speaker: Mbak Ayu
        text: Mas, Lawang Sewu tegese "sewu lawang". Nanging lawange ora tenan sewu, lho.
        ar_eg: يا ماس، «لاوانج سيو» معناها «ألف باب». بس الأبواب مش ألف بجدّ على فكرة.
        ar: يا ماس، «لاوانغ سيو» تعني «ألف باب». لكنّ الأبواب ليست ألفًا فعلًا بالمناسبة.
        en: Mas, Lawang Sewu means "a thousand doors". But there aren't really a thousand, you know.
      - speaker: Karim
        text: "Gedhung iki dibangun dening perusahaan sepur Walanda ing wiwitan abad kaping rong puluh."
        ar_eg: «المبنى ده اتبنى على إيد شركة سكّة حديد هولندية في أوائل القرن العشرين».
        ar: «بُني هذا المبنى على يد شركة سكك حديدية هولندية في أوائل القرن العشرين».
        en: '"This building was built by a Dutch railway company at the start of the twentieth century."'
        note:
          ar_eg: في الكتابة الجاوي، المبني للمجهول هو di- + الفعل + dening (بواسطة). dibangun dening = «اتبنى على إيد».
          ar: في الكتابة الجاوية، المبني للمجهول = di- + الفعل + dening (من قِبَل). dibangun dening = «بُني على يد».
          en: In written Javanese, the passive is di- + verb + dening (by). dibangun dening = "was built by".
      - speaker: Karim
        text: "Saiki gedhung iki kapilih dadi cagar budaya."
        ar_eg: «ودلوقتي المبنى ده اتختار عشان يبقى أثر محمي».
        ar: «والآن اختير هذا المبنى ليكون موقعًا تراثيًّا».
        en: '"Today the building has been chosen as a heritage site."'
        note:
          ar_eg: ka- طريقة مجهول تانية، رسمية أكتر - kapilih = «اتختار». وكمان فيه الحشوة -in- - tinulis = «مكتوب».
          ar: ka- صيغة مجهول أخرى أكثر رسمية - kapilih = «اختير». وهناك أيضًا الحشو -in- - tinulis = «مكتوب».
          en: ka- is another, more formal passive - kapilih = "was chosen". There's also the infix -in- - tinulis = "written".
      - speaker: Mbak Ayu
        text: Pinter! Ing kene uga ana majalah Panjebar Semangat lawas. Majalah basa Jawa saka Suroboyo.
        ar_eg: شاطر! وهنا كمان فيه مجلّة «پانجيبار سيمانجات» قديمة. مجلّة بالجاوي من سورابايا.
        ar: ممتاز! وهنا أيضًا مجلّة «بانجيبار سيمانغات» قديمة. مجلّة بالجاوية من سورابايا.
        en: Clever! There are old copies of Panjebar Semangat here too. A Javanese-language magazine from Surabaya.
        note:
          ar_eg: Panjebar Semangat مجلّة أسبوعية بالجاوي بتطلع من سورابايا من التلاتينات، وJaya Baya كمان. لحدّ النهارده فيه صحافة بالجاوي.
          ar: Panjebar Semangat مجلّة أسبوعية بالجاوية تصدر في سورابايا منذ الثلاثينيات، ومثلها Jaya Baya. وما زالت هناك صحافة بالجاوية حتى اليوم.
          en: Panjebar Semangat is a Javanese weekly published in Surabaya since the 1930s, and so is Jaya Baya. There's still Javanese-language press today.
  - setting:
      ar_eg: على سلّم لاوانج سيو. مباك أيو بتطلّع تليفونها وبتبتسم ابتسامة غريبة.
      ar: على درج لاوانغ سيو. تُخرج مباك أيو هاتفها وتبتسم ابتسامة غامضة.
      en: On the steps of Lawang Sewu. Mbak Ayu takes out her phone with a mysterious smile.
    lines:
      - speaker: Mbak Ayu
        text: Mas, ana warta cekak anyar. Wacanen.
        ar_eg: يا ماس، فيه خبر قصيّر جديد. اقراه.
        ar: يا ماس، هناك خبر قصير جديد. اقرأه.
        en: Mas, there's a new short news item. Read it.
      - speaker: Karim
        text: "Buku basa Jawa kanggo wong Mesir lagi ditulis dening penerjemah saka Kairo..."
        ar_eg: «كتاب جاوي للمصريين بيكتبه مترجم من القاهرة...»
        ar: «كتاب بالجاوية للمصريين يكتبه مترجم من القاهرة...»
        en: '"A Javanese book for Egyptians is being written by a translator from Cairo..."'
      - speaker: Karim
        text: Lho! Iki aku!
        ar_eg: إيه ده! ده أنا!
        ar: ماذا! هذا أنا!
        en: What! That's me!
      - speaker: Mbak Ayu
        text: Hehe. Warta iku tinulis dening aku, kanggo buletin kampus. Wis diwaca rong atus wong.
        ar_eg: هيهي. الخبر ده أنا اللي كتبته، لنشرة الجامعة. واتقرا من ميتين واحد.
        ar: هيهي. أنا من كتب هذا الخبر، لنشرة الجامعة. وقد قرأه مئتا شخص.
        en: Hehe. That piece was written by me, for the campus newsletter. Two hundred people have read it.
      - speaker: Karim
        text: Rong atus! Waduh. Saiki bukune kudu apik tenan.
        ar_eg: ميتين! يا خبر. يبقى الكتاب لازم يطلع حلو بجدّ.
        ar: مئتان! يا للهول. إذن يجب أن يكون الكتاب جيّدًا حقًّا.
        en: Two hundred! Oh no. Now the book really has to be good.
      - speaker: Mbak Ayu
        text: Mulane, sesuk ayo dandani ejaane. Akeh tembung sing ditulis kaya diucapake.
        ar_eg: عشان كده، بكرة يلّا نصلّح الإملاء. فيه كلمات كتير مكتوبة زي ما بتتنطق.
        ar: لذلك، غدًا هيّا نصحّح الإملاء. كلمات كثيرة مكتوبة كما تُنطق.
        en: That's why tomorrow we fix the spelling. Lots of words are written the way they're pronounced.
new_words:
  - word: dening
    pos: preposition
    ar_eg: بواسطة / على إيد
    ar: من قِبَل
    en: by (in passives)
  - word: dibangun
    pos: verb
    ar_eg: اتبنى
    ar: بُني
    en: was built
  - word: kapilih
    pos: verb
    ar_eg: اتختار (رسمي)
    ar: اختير (رسميّ)
    en: was chosen (formal)
  - word: tinulis
    pos: verb
    ar_eg: مكتوب (رسمي)
    ar: مكتوب (رسميّ)
    en: written (formal)
  - word: warta
    pos: noun
    ar_eg: خبر
    ar: خبر
    en: news
  - word: cagar budaya
    pos: noun
    ar_eg: أثر محمي / موقع تراث
    ar: موقع تراثيّ محميّ
    en: heritage site
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: مين بنى لاوانج سيو؟
      ar: من بنى لاوانغ سيو؟
      en: Who built Lawang Sewu?
    options: ["perusahaan sepur Walanda", "Kraton Ngayogyakarta", "Mbak Ayu"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Gedhung iki dibangun ___ perusahaan sepur Walanda.
    meaning:
      ar_eg: المبنى ده اتبنى على إيد شركة سكّة حديد هولندية.
      ar: بُني هذا المبنى على يد شركة سكك حديدية هولندية.
      en: This building was built by a Dutch railway company.
    answers: [dening]
    options: ["dening", "kang", "ing"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: الخبر اللي على تليفون مباك أيو كان عن مين؟
      ar: عمّن كان الخبر على هاتف مباك أيو؟
      en: Who was the news on Mbak Ayu's phone about?
    options: ["Pak Harsono", "Karim", "Panjebar Semangat"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Warta iku tinulis dening aku.
    answers_meaning:
      ar_eg: ["الخبر ده أنا اللي كتبته.", "الخبر ده اتكتب بإيدي."]
      ar: ["أنا من كتب هذا الخبر.", "كُتب هذا الخبر بقلمي."]
      en: ["That piece was written by me.", "I wrote that news item."]
next:
  ar_eg: في ميدان سيمپانج ليما، مباك أيو بتمسك قلم أحمر... وكتاب كريم بيبقى كله أحمر. pira ولّا piro؟ dhuwit ولّا duwit؟
  ar: في ساحة سيمبانغ ليما، تمسك مباك أيو قلمًا أحمر... فيصير كتاب كريم أحمر كلّه. pira أم piro؟ dhuwit أم duwit؟
  en: At Simpang Lima square, Mbak Ayu picks up a red pen... and Karim's book turns red. Pira or piro? Dhuwit or duwit?
review:
  status: draft
  verified: false
  notes: Lawang Sewu was built 1904-1907 for the Dutch NIS railway company (kept as "start of the 20th century"). Panjebar Semangat (founded 1933) and Jaya Baya are real Javanese weeklies. Check "ka-" and "-in-" examples.
