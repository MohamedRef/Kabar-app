questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: مين بنى محطة ماديون؟
      ar: من بنى محطّة ماديون؟
      en: Who built Madiun station?
    options: ["perusahaan sepur Walanda", "Kraton Ngayogyakarta", "Mbak Ayu"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Stasiun iki dibangun ___ perusahaan sepur Walanda.
    meaning:
      ar_eg: المحطة دي اتبنت على إيد شركة سكّة حديد هولندية.
      ar: بُنيت هذه المحطّة على يد شركة سكك حديدية هولندية.
      en: This station was built by a Dutch railway company.
    answers: [dening]
    options: ["dening", "kang", "ing"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: الخبر اللي على تليفون مباك أيو كان عن مين؟
      ar: عمّن كان الخبر على هاتف مباك أيو؟
      en: Who was the news on Mbak Ayu's phone about?
    options: ["Pak Harsono", "Karim", "Panjebar Semangat"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Warta iku tinulis dening aku.
    answers_meaning:
      ar_eg: ["الخبر ده أنا اللي كتبته.", "الخبر ده اتكتب بإيدي."]
      ar: ["أنا من كتب هذا الخبر.", "كُتب هذا الخبر بقلمي."]
      en: ["That piece was written by me.", "I wrote that news item."]
next:
  ar_eg: في ميدان ماديون، مباك أيو بتمسك قلم أحمر... وكتاب كريم بيبقى كله أحمر. pira ولّا piro؟ dhuwit ولّا duwit؟
  ar: في ساحة ماديون، تمسك مباك أيو قلمًا أحمر... فيصير كتاب كريم أحمر كلّه. pira أم piro؟ dhuwit أم duwit؟
  en: At Madiun's town square, Mbak Ayu picks up a red pen... and Karim's book turns red. Pira or piro? Dhuwit or duwit?
review:
  status: draft
  verified: false
  notes: Moved from Lawang Sewu, Semarang to Madiun station (Jogja + Madiun only, 2026-10-27). Madiun station dates from the Dutch state railway line of the 1880s (kept as "the nineteenth century"); the exhibition and the best-photo line are invented. INKA builds carriages in Madiun. Panjebar Semangat (founded 1933) and Jaya Baya are real Javanese weeklies. Check "ka-" and "-in-" examples.
