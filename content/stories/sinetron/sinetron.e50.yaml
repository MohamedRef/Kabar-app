questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: نسبة رضا الشركا وصلت لكام؟
      ar: إلى كم ارتفعت نسبة رضا الشركاء؟
      en: What did partner satisfaction rise to?
    options: ["enam puluh dua persen", "lima puluh lima persen", "delapan puluh delapan persen", "seratus persen"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Demikian presentasi saya. Terima kasih atas ___.
    meaning:
      ar_eg: وده كان عرضي. شكرًا على اهتمامكم.
      ar: وبهذا أختم عرضي. شكرًا على حسن إصغائكم.
      en: That concludes my presentation. Thank you for your attention.
    answers: [perhatiannya]
    options: ["perhatiannya", "rekomendasinya", "latar belakangnya"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه بايو بعت لساري «متناميش بدري النهارده» في رأيك؟
      ar: في رأيك، لماذا أرسل بايو إلى ساري «لا تنامي مبكّرًا الليلة»؟
      en: Why do you think Bayu texted Sari "don't go to sleep early tonight"?
    options: ["Karena ada pertandingan sepak bola.", "Karena dia tahu Karim akan datang, dan keluarga pasti menelepon Sari malam itu.", "Karena dia ingin meminjam uang.", "Karena Pak Budi sakit."]
    answer: 1
  - id: q04
    type: listen
    text: Bapak nggak bisa jawab sendiri malam ini. Bapak harus musyawarah dulu sama keluarga, terutama sama Sari.
    question:
      ar_eg: باك بودي ردّ على كريم بإيه؟
      ar: بمَ أجاب باك بودي كريمًا؟
      en: What is Pak Budi's answer to Karim?
    options: ["Dia langsung setuju.", "Dia menolak.", "Dia akan bermusyawarah dulu dengan keluarga dan Sari.", "Dia meminta Karim belajar krama lagi."]
    answer: 2
    meaning:
      ar_eg: مقدرش أردّ لوحدي الليلة. لازم أتشاور الأول مع العيلة، وأولهم ساري.
      ar: لا أستطيع أن أجيب وحدي الليلة. لا بدّ أن أتشاور أوّلًا مع العائلة، وفي مقدّمتها ساري.
      en: I can't answer on my own tonight. I must talk it over with the family first - above all, with Sari.
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: رضا الشركا زاد.
      ar: ارتفع رضا الشركاء.
      en: Partner satisfaction rose.
    answers: ["Kepuasan mitra meningkat.", "Kepuasan mitra meningkat", "Kepuasan mitra naik.", "Kepuasan mitra naik", "Tingkat kepuasan mitra meningkat.", "Tingkat kepuasan mitra meningkat", "Tingkat kepuasan mitra naik.", "Tingkat kepuasan mitra naik", "Kepuasan para mitra meningkat.", "Kepuasan para mitra meningkat"]
next:
  ar_eg: الموسم الجاي - ساري هتردّ تقول إيه؟ بايو بيحضّر شنطته لميدان، وعيلة كاملة من القاهرة بتحجز تذاكر لماديون... ومعاهم شنطة مليانة حلويات مصرية وورد.
  ar: في الموسم القادم - بمَ ستجيب ساري؟ يحزم بايو حقيبته إلى ميدان، وتحجز عائلة كاملة من القاهرة تذاكر إلى ماديون... ومعها حقيبة ملأى بالحلويات المصرية والورد.
  en: Next season - what will Sari say? Bayu packs his bags for Medan, and a whole family in Cairo books tickets to Madiun... with a suitcase full of Egyptian sweets and flowers.
