schema: kabar.story/v1
id: sinetron.e50
series: sinetron
episode: 50
language: id
level: bipa5
unlock_after: bipa5.u10
title:
  target: Demikian Presentasi Saya
  ar_eg: وده كان عرضي
  ar: وبهذا أختم عرضي
  en: That Concludes My Presentation
summary:
  ar_eg: في باليكبابان، ساري بتقدّم تقرير مشروعها «جسر اللغة» بالأرقام والرسومات - وبتاخد عرض شغل ثابت. وفي نفس اللحظة في ماديون، كريم قاعد قدّام باك بودي وبو راهايو، وبأحسن كراما عنده بيطلب إن عيلته تيجي تخطب ساري. باك بودي بيقول إنه لازم يتشاور مع العيلة... وبيمسك الموبايل.
  ar: في باليكبابان تعرض ساري تقرير مشروعها «جسر اللغة» بالأرقام والرسوم البيانية - وتنال عرض وظيفة دائمة. وفي اللحظة نفسها في ماديون يجلس كريم أمام باك بودي وبو راهايو، ويطلب بأفضل ما لديه من الكراما أن تأتي عائلته لخطبة ساري. يقول باك بودي إنّه لا بدّ أن يتشاور مع العائلة... ويمسك الهاتف.
  en: In Balikpapan, Sari presents her "Language Bridge" project report, with figures and charts - and is offered a permanent job. At that very moment in Madiun, Karim sits before Pak Budi and Bu Rahayu and, in his very best krama, asks whether his family may come to ask for Sari's hand. Pak Budi says he must talk it over with the family... and picks up the phone.
cast: [Sari, Pak Hendra, Bu Ratna, Karim, Pak Budi, Bu Rahayu, Bayu]
scenes:
  - setting:
      ar_eg: باليكبابان، أوضة الاجتماعات في الدور العاشر، العصر. ساري واقفة قدّام الشاشة، لابسة البليزر - وبنطلون رسمي المرّة دي.
      ar: باليكبابان، قاعة الاجتماعات في الطابق العاشر، عصرًا. تقف ساري أمام الشاشة بالسترة - وبسروال رسميّ هذه المرّة.
      en: Balikpapan, the tenth-floor meeting room, late afternoon. Sari stands in front of the screen in her blazer - and proper trousers this time.
    lines:
      - speaker: Narrator
        text: Delapan bulan setelah hari pertamanya, Sari berdiri di depan para manajer. Bu Ratna dari bagian personalia, yang dulu mewawancarainya, duduk di barisan depan.
        ar_eg: بعد تمن شهور من أول يوم ليها، ساري واقفة قدّام المديرين. وبو راتنا من شؤون الموظفين، اللي عملت معاها الإنترفيو زمان، قاعدة في الصفّ الأولاني.
        ar: بعد ثمانية أشهر من يومها الأوّل، تقف ساري أمام المديرين. وتجلس في الصفّ الأوّل بو راتنا من شؤون الموظّفين، التي أجرت معها المقابلة.
        en: Eight months after her first day, Sari stands before the managers. Bu Ratna from HR, who interviewed her back then, sits in the front row.
      - speaker: Sari
        text: Selamat sore, Bapak dan Ibu sekalian. Hari ini saya akan memaparkan laporan proyek "Jembatan Bahasa". Presentasi ini terdiri atas tiga bagian, yaitu latar belakang, hasil, dan rekomendasi.
        ar_eg: مساء الخير يا حضرات. النهارده هعرض تقرير مشروع «جسر اللغة». العرض ده فيه تلات أجزاء - الخلفية، والنتايج، والتوصيات.
        ar: مساء الخير أيّها السادة والسيّدات. سأعرض اليوم تقرير مشروع «جسر اللغة». ويتألّف هذا العرض من ثلاثة أجزاء - الخلفية، والنتائج، والتوصيات.
        en: Good afternoon, ladies and gentlemen. Today I will present the report on the "Language Bridge" project. This presentation has three parts - background, results and recommendations.
        note:
          ar_eg: لغة العروض ليها عبارات ثابتة بترتّب كلامك - terdiri atas (بيتكوّن من)، pertama (أولًا)، selanjutnya (بعد كده)، terakhir (وأخيرًا)، demikian (وبكده خلصنا). المستمع بيعرف هو فين في العرض. كلمات - memaparkan = يعرض، proyek = مشروع، rekomendasi = توصية.
          ar: للغة العروض عبارات ثابتة تنظّم الكلام - terdiri atas (يتألّف من)، pertama (أوّلًا)، selanjutnya (بعد ذلك)، terakhir (أخيرًا)، demikian (وبهذا أختم). فيعرف المستمع موضعه من العرض. مفردات - memaparkan = يعرض، proyek = مشروع، rekomendasi = توصية.
          en: Presentations use set signposts - terdiri atas (consists of), pertama (first), selanjutnya (next), terakhir (finally), demikian (that concludes). The audience always knows where they are. Words - memaparkan = present, proyek = project, rekomendasi = recommendation.
      - speaker: Sari
        text: Pertama, latar belakang. Sebelum proyek ini dimulai, banyak email dari mitra di Timur Tengah tidak terjawab selama berhari-hari karena kendala bahasa. Selain itu, sering terjadi kesalahpahaman budaya, misalnya rapat yang dijadwalkan tepat pada waktu salat Jumat.
        ar_eg: أولًا، الخلفية. قبل ما المشروع يبدأ، إيميلات كتير من الشركا في الشرق الأوسط كانت بتفضل أيام من غير ردّ بسبب مشكلة اللغة. وغير كده، كان بيحصل سوء تفاهم ثقافي كتير - زي اجتماع يتحدّد في ميعاد صلاة الجمعة بالظبط.
        ar: أوّلًا، الخلفية. قبل بدء المشروع كانت رسائل كثيرة من الشركاء في الشرق الأوسط تبقى أيّامًا بلا ردّ بسبب عائق اللغة. علاوة على ذلك، كثيرًا ما وقع سوء فهم ثقافيّ، كاجتماع يُحدَّد في وقت صلاة الجمعة تمامًا.
        en: First, the background. Before the project began, many emails from our Middle Eastern partners went unanswered for days because of the language barrier. Besides that, there were frequent cultural misunderstandings - meetings scheduled right at the time of Friday prayers, for example.
        note:
          ar_eg: kesalahpahaman (سوء تفاهم) كلمة طويلة متركّبة - salah (غلط) + paham (فهم، من العربي «فهم») + ke-...-an. ده مثال حلو على الـ nominalisasi في التقارير. كلمات - mitra = شركا، kendala = عائق، budaya = ثقافة، misalnya = مثلًا، dijadwalkan = متحدّد ميعاده.
          ar: kesalahpahaman (سوء الفهم) كلمة مركّبة طويلة - salah (خطأ) + paham (من العربية «فهم») + ke-...-an. وهي مثال جيّد على الـ nominalisasi في التقارير. مفردات - mitra = شركاء، kendala = عائق، budaya = ثقافة، misalnya = مثلًا، dijadwalkan = مُجدوَل.
          en: kesalahpahaman (misunderstanding) is a long compound - salah (wrong) + paham (understand, from Arabic فهم) + ke-...-an. A fine example of nominalisation in reports. Words - mitra = partners, kendala = obstacle, budaya = culture, misalnya = for example, dijadwalkan = scheduled.
      - speaker: Sari
        text: Selanjutnya, hasil. Seperti yang terlihat pada grafik ini, waktu balasan rata-rata menurun dari lima hari menjadi satu setengah hari. Sementara itu, tingkat kepuasan mitra meningkat dari enam puluh dua persen menjadi delapan puluh delapan persen.
        ar_eg: بعد كده، النتايج. زي ما باين في الرسم البياني ده، متوسّط وقت الردّ نزل من خمس أيام ليوم ونص. وفي نفس الوقت، نسبة رضا الشركا طلعت من ٦٢٪ لـ ٨٨٪.
        ar: بعد ذلك، النتائج. كما يظهر في هذا الرسم البياني، انخفض متوسّط زمن الردّ من خمسة أيام إلى يوم ونصف. وفي الوقت نفسه ارتفعت نسبة رضا الشركاء من ٦٢٪ إلى ٨٨٪.
        en: Next, the results. As you can see in this chart, the average reply time fell from five days to a day and a half. Meanwhile, partner satisfaction rose from sixty-two to eighty-eight per cent.
        note:
          ar_eg: عشان توصف رسم بياني - meningkat / naik (زاد)، menurun / turun (قلّ)، dari... menjadi... (من... لـ...)، stabil (ثابت). والأسماء منهم - peningkatan (زيادة) وpenurunan (انخفاض). كلمات - balasan = ردّ، sementara itu = في نفس الوقت، mitra = شركا.
          ar: لوصف الرسوم البيانية - meningkat / naik (ارتفع)، menurun / turun (انخفض)، dari... menjadi... (من... إلى...)، stabil (ثابت). والأسماء منها - peningkatan (ارتفاع) وpenurunan (انخفاض). مفردات - balasan = ردّ، sementara itu = في الأثناء، mitra = شركاء.
          en: To describe a chart - meningkat / naik (rise), menurun / turun (fall), dari... menjadi... (from... to...), stabil (steady). Their nouns are peningkatan (an increase) and penurunan (a decrease). Words - balasan = reply, sementara itu = meanwhile, mitra = partners.
      - speaker: Narrator
        text: 'HP di saku Sari bergetar. Sebuah pesan dari Bayu: "Mbak, nanti malam jangan tidur dulu, ya." Sari tidak membukanya.'
        ar_eg: 'الموبايل اللي في جيب ساري زنّ. رسالة من بايو: «يا أبلة، متناميش بدري النهارده بالليل». ساري ما فتحتهاش.'
        ar: 'اهتزّ الهاتف في جيب ساري. رسالة من بايو: «يا أختي، لا تنامي مبكّرًا الليلة». لم تفتحها ساري.'
        en: 'The phone in Sari''s pocket buzzes. A message from Bayu: "Sis, don''t go to sleep early tonight, okay?" Sari doesn''t open it.'
      - speaker: Sari
        text: Terakhir, rekomendasi. Menurut saya, panduan budaya dan glosarium dua bahasa ini sebaiknya dipakai oleh semua divisi, bukan hanya divisi kemitraan. Dengan demikian, kesalahpahaman dapat dicegah sejak awal.
        ar_eg: وأخيرًا، التوصيات. في رأيي، دليل الثقافة وقاموس المصطلحات بلغتين ده الأحسن يستعملوه كل الأقسام، مش قسم الشراكات بس. وبكده، سوء التفاهم يتمنع من الأول.
        ar: وأخيرًا، التوصيات. أرى أن تستعمل جميعُ الأقسام دليلَ الثقافة ومسردَ المصطلحات الثنائيّ اللغة، لا قسم الشراكات وحده. وبذلك يُتّقى سوء الفهم من البداية.
        en: Finally, recommendations. In my view, this cultural guide and bilingual glossary should be used by every division, not just partnerships. That way, misunderstandings can be prevented from the start.
        note:
          ar_eg: ده لسّه عرض رسمي. glosarium = قاموس مصطلحات، kesalahpahaman = سوء تفاهم، dicegah = يتمنع، dipakai = يُستعمل، budaya = ثقافة، kemitraan = الشراكات.
          ar: ما زال عرضًا رسميًّا. glosarium = مسرد، kesalahpahaman = سوء فهم، dicegah = يُمنع، dipakai = يُستعمل، budaya = ثقافة، kemitraan = الشراكات.
          en: Still the formal presentation. glosarium = glossary, kesalahpahaman = misunderstanding, dicegah = prevented, dipakai = used, budaya = culture, kemitraan = partnerships.
      - speaker: Sari
        text: Demikian presentasi saya. Terima kasih atas perhatiannya. Saya persilakan Bapak dan Ibu untuk bertanya.
        ar_eg: وده كان عرضي. شكرًا على اهتمامكم. واتفضّلوا اسألوا.
        ar: وبهذا أختم عرضي. شكرًا على حسن إصغائكم. وأدعوكم إلى طرح أسئلتكم.
        en: That concludes my presentation. Thank you for your attention. Please feel free to ask questions.
        note:
          ar_eg: Demikian... Terima kasih atas perhatiannya هي الختمة الكلاسيكية لأي عرض أو خطبة رسمية في إندونيسيا - زي «وشكرًا لحسن استماعكم».
          ar: Demikian... Terima kasih atas perhatiannya هي الخاتمة التقليدية لأيّ عرض أو كلمة رسمية في إندونيسيا، كقولنا «وشكرًا لحسن استماعكم».
          en: Demikian... Terima kasih atas perhatiannya is the classic way to close any formal talk or speech in Indonesia - "thank you for your kind attention".
      - speaker: Bu Ratna
        text: Terima kasih, Mbak Sari. Satu pertanyaan. Apa tantangan terbesar dalam proyek ini?
        ar_eg: شكرًا يا مبك ساري. سؤال واحد. إيه أكبر تحدّي قابلك في المشروع ده؟
        ar: شكرًا يا مبك ساري. سؤال واحد - ما أكبر تحدٍّ في هذا المشروع؟
        en: Thank you, Mbak Sari. One question. What was the biggest challenge in this project?
      - speaker: Sari
        text: Tantangan terbesarnya bukan bahasa, Bu, melainkan kebiasaan. Kata-kata bisa diterjemahkan dalam satu menit, tetapi kebiasaan membutuhkan waktu berbulan-bulan untuk berubah.
        ar_eg: أكبر تحدّي مكانش اللغة يا مدام، كان العادات. الكلام ممكن يتترجم في دقيقة، بس العادة محتاجة شهور عشان تتغيّر.
        ar: أكبر التحدّيات لم يكن اللغة يا سيّدتي، بل العادات. فالكلمات تُترجم في دقيقة، أمّا العادات فتحتاج إلى شهور كي تتغيّر.
        en: The biggest challenge wasn't language, Ma'am, but habits. Words can be translated in a minute, but habits take months to change.
        note:
          ar_eg: bukan... melainkan = مش... لكن (رسمي)، diterjemahkan = يتترجم، berbulan-bulan = شهور، terbesar = أكبر.
          ar: bukan... melainkan = ليس... بل (رسمية)، diterjemahkan = يُترجَم، berbulan-bulan = شهورًا، terbesar = الأكبر.
          en: bukan... melainkan = not... but rather (formal), diterjemahkan = translated, berbulan-bulan = for months, terbesar = biggest.
      - speaker: Pak Hendra
        text: Saya tambahkan satu hal. Sebelum Mbak Sari datang, saya kira "yallah" itu kata orang marah. Ternyata artinya "ayo"!
        ar_eg: أضيف حاجة واحدة. قبل ما مبك ساري تيجي، كنت فاكر إن «يلا» دي كلمة واحد زعلان. طلع معناها «هيّا بينا»!
        ar: أضيف أمرًا واحدًا. قبل مجيء مبك ساري كنتُ أظنّ «يلّا» كلمة يقولها الغاضب، فإذا معناها «هيّا»!
        en: Let me add one thing. Before Mbak Sari came, I thought "yallah" was something angry people say. Turns out it means "come on, let's go"!
        note:
          ar_eg: kira = فاكر/ظنّيت. yallah = «يلّا» بالعربي.
          ar: kira = ظننتُ. yallah = «يلّا» بالعربية.
          en: kira = thought. yallah = Arabic for "come on".
      - speaker: Bu Ratna
        text: Masa percobaan Mbak Sari sudah lama selesai. Atas rekomendasi Pak Hendra, perusahaan menawarkan kepada Mbak status karyawan tetap. Selamat.
        ar_eg: فترة التجربة بتاعتك خلصت من زمان يا مبك ساري. وبناءً على توصية باك هندرا، الشركة بتعرض عليكي تبقي موظّفة ثابتة. مبروك.
        ar: انتهت فترة تجربتكِ منذ زمن يا مبك ساري. وبناءً على توصية باك هندرا، تعرض عليكِ الشركة التثبيت موظّفةً دائمة. مبارك.
        en: Your probation ended long ago, Mbak Sari. On Pak Hendra's recommendation, the company is offering you a permanent position. Congratulations.
      - speaker: Sari
        text: Alhamdulillah. Terima kasih, Bu, Pak. Saya... saya harus menelepon ayah saya.
        ar_eg: الحمد لله. شكرًا يا مدام، شكرًا يا باك. أنا... أنا لازم أكلّم بابا.
        ar: الحمد لله. شكرًا يا سيّدتي، شكرًا يا باك. عليّ... عليّ أن أتّصل بأبي.
        en: Alhamdulillah. Thank you, Ma'am, Pak. I... I have to call my father.
      - speaker: Narrator
        text: Tetapi malam itu, sebelum Sari sempat menelepon, ayahnya yang menelepon lebih dulu.
        ar_eg: بس الليلة دي، قبل ما ساري تلحق تتّصل، أبوها هو اللي اتّصل الأول.
        ar: لكن في تلك الليلة، قبل أن تتمكّن ساري من الاتصال، اتّصل بها أبوها أوّلًا.
        en: But that night, before Sari has a chance to call, her father calls first.
  - setting:
      ar_eg: ماديون، قبلها بساعة، أوضة الضيوف في بيت باك بودي. أحسن شاي في البيت على الترابيزة. كريم قاعد مفرود ضهره، لابس باتيك، وإيده ساقعة.
      ar: ماديون، قبل ذلك بساعة، غرفة الضيوف في بيت باك بودي. أطيب شاي في البيت على الطاولة. يجلس كريم منتصب الظهر بقميص الباتيك، ويداه باردتان.
      en: Madiun, an hour earlier, the front room of Pak Budi's house. The best tea in the house is on the table. Karim sits bolt upright in batik, his hands cold.
    lines:
      - speaker: Karim
        text: Pak Budi, Bu Rahayu, nuwun sewu. Kula ngaturaken agunging panuwun, panjenengan kersa nampi kula ing dalu punika.
        ar_eg: يا باك بودي، يا بو راهايو، لا مؤاخذة. أنا بشكركم جدًا إنكم اتكرّمتوا واستقبلتوني الليلة دي.
        ar: يا باك بودي، يا بو راهايو، عذرًا. أرفع إليكم جزيل الشكر لتكرّمكم باستقبالي هذه الليلة.
        en: Pak Budi, Bu Rahayu, excuse me. I offer you my deepest thanks for so kindly receiving me tonight.
        note:
          ar_eg: كراما رسمي جدًا - ngaturaken agunging panuwun (بقدّم أعظم الشكر)، kersa (اتكرّم، كلمة تكريم)، nampi (يستقبل)، ing dalu punika (الليلة دي). كريم حافظ الجملة دي من أسابيع.
          ar: كراما رسمية جدًّا - ngaturaken agunging panuwun (أقدّم جزيل الشكر)، kersa (تكرّم، لفظ تكريم)، nampi (استقبل)، ing dalu punika (هذه الليلة). وقد حفظ كريم هذه الجملة منذ أسابيع.
          en: Very formal krama - ngaturaken agunging panuwun (I offer my great thanks), kersa (to be so kind, honorific), nampi (receive), ing dalu punika (this evening). Karim has been memorising this for weeks.
      - speaker: Pak Budi
        text: Mangga, Mas. Bapak dengerin.
        ar_eg: اتفضّل يا ماس. أنا سامعك.
        ar: تفضّل يا ماس. أنا مصغٍ إليك.
        en: Go ahead, Mas. I'm listening.
        note:
          ar_eg: dengerin = mendengarkan (سامعك).
          ar: dengerin = mendengarkan (أسمعك).
          en: dengerin = mendengarkan (I am listening).
      - speaker: Karim
        text: Kula sampun dangu tepang kaliyan putri panjenengan, Dhik Sari. Menawi kepareng, tiyang sepuh kula badhe sowan mriki saking Kairo, perlu nembung Dhik Sari.
        ar_eg: أنا عارف بنت حضرتك، ساري، من زمان. ولو تسمحوا، أهلي عايزين ييجوا هنا من القاهرة يزوروكم، عشان يطلبوا إيد ساري.
        ar: إنّني أعرف ابنتكم ساري منذ زمن طويل. وإن أذنتم، فإنّ والديّ يرغبان في المجيء من القاهرة لزيارتكم، طالبَين يد ساري.
        en: I have known your daughter, Sari, for a long time. If you would permit it, my parents wish to come here from Cairo to visit you, to ask for Sari's hand.
        note:
          ar_eg: nembung هو الخطوة الأولى في الخطوبة الجاوية - العريس بيستأذن أهل البنت بأدب قبل ما عيلته تيجي رسمي (lamaran). زي في مصر لما العريس يروح الأول لأبو العروسة ويقول «طالب إيد بنتك».
          ar: nembung هي الخطوة الأولى في الخطبة الجاوية - يستأذن الخاطب أهل الفتاة بأدب قبل أن تأتي أسرته رسميًّا (lamaran). كما يذهب الخاطب في مصر إلى أبي العروس أوّلًا قائلًا «جئت أطلب يد ابنتك».
          en: nembung is the first step of a Javanese engagement - the suitor politely asks the woman's parents before his family comes formally (the lamaran). Just as in Egypt, where a suitor first goes to the father to "ask for his daughter's hand".
      - speaker: Karim
        text: Maksud saya... maaf, krama saya udah habis. Jika Bapak dan Ibu mengizinkan, orang tua saya ingin datang dari Kairo untuk melamar Sari.
        ar_eg: قصدي... آسف، الكراما بتاعي خلص. لو حضرتك وبو راهايو تسمحوا، أهلي عايزين ييجوا من القاهرة يخطبوا ساري.
        ar: أقصد... عذرًا، نفدت الكراما عندي. إن أذنتما، فإنّ والديّ يريدان المجيء من القاهرة لخطبة ساري.
        en: What I mean is... sorry, I've run out of krama. If you'll allow it, my parents would like to come from Cairo to ask for Sari's hand.
        note:
          ar_eg: كريم بيرجع للإندونيسي، والطلب نفسه بيتقال باحترام ورسمي. maksud saya = قصدي، udah habis = sudah habis (خلص)، mengizinkan = يسمح، melamar = يطلب إيدها.
          ar: يعود كريم إلى الإندونيسية، ويقول الطلب نفسه بأدب ورسمية. maksud saya = أعني، udah habis = sudah habis (نفد)، mengizinkan = يأذن، melamar = يخطب.
          en: Karim drops back into Indonesian, and says the proposal itself politely and formally. maksud saya = what I mean, udah habis = sudah habis (ran out), mengizinkan = allow, melamar = ask for her hand. krama = polite Javanese.
      - speaker: Narrator
        text: Bu Rahayu menggenggam tangan suaminya. Di balik pintu dapur, Bayu menutup mulutnya dengan dua tangan. Di luar jendela, Mas Joko hampir menjatuhkan gelas tehnya.
        ar_eg: بو راهايو مسكت إيد جوزها جامد. ورا باب المطبخ، بايو حطّ إيديه الاتنين على بقّه. وبرّه الشبّاك، ماس جوكو كوباية الشاي كانت هتقع من إيده.
        ar: شدّت بو راهايو على يد زوجها. وخلف باب المطبخ وضع بايو يديه على فمه، وخارج النافذة كاد ماس جوكو يُسقط كوب الشاي.
        en: Bu Rahayu squeezes her husband's hand. Behind the kitchen door, Bayu clamps both hands over his mouth. Outside the window, Mas Joko nearly drops his glass of tea.
      - speaker: Pak Budi
        text: Mas Karim... Sari udah tahu?
        ar_eg: يا ماس كريم... ساري عارفة؟
        ar: يا ماس كريم... هل تعلم ساري؟
        en: Mas Karim... does Sari know?
      - speaker: Karim
        text: Belum, Pak. Saya mau minta izin Bapak dan Ibu dulu. Di Mesir juga gitu. Laki-laki datang dulu ke ayahnya, dengan hormat.
        ar_eg: لسّه يا باك. كنت عايز أستأذن حضرتك وبو راهايو الأول. وفي مصر كده برضه - الراجل بيروح لأبوها الأول، باحترام.
        ar: ليس بعد يا باك. أردتُ أن أستأذنكما أوّلًا. وهكذا الأمر في مصر أيضًا - يأتي الرجل إلى أبيها أوّلًا، بكلّ احترام.
        en: Not yet, Pak. I wanted to ask your permission first. It's the same in Egypt. A man goes to her father first, with respect.
        note:
          ar_eg: minta izin = meminta izin (يستأذن)، gitu = begitu، ke = kepada.
          ar: minta izin = meminta izin (يستأذن)، gitu = begitu، ke = kepada.
          en: minta izin = meminta izin (ask permission), gitu = begitu, ke = kepada.
      - speaker: Bu Rahayu
        text: Mas Karim... Ibu udah lama curiga. Sejak "aplikasi cuaca" itu.
        ar_eg: يا ماس كريم... أنا كنت حاسّة من زمان. من ساعة «تطبيق الطقس» ده.
        ar: يا ماس كريم... كنتُ أظنّ ذلك منذ زمن. منذ «تطبيق الطقس» ذاك.
        en: Mas Karim... I've suspected for a long time. Ever since that "weather app".
        note:
          ar_eg: curiga = menduga (شاكّة)، udah = sudah.
          ar: curiga = menduga (تشكّ)، udah = sudah.
          en: curiga = menduga (suspect), udah = sudah.
      - speaker: Pak Budi
        text: Mas, Bapak menghargai cara Mas. Krama Mas tadi hampir sempurna. Tapi ini perkara besar. Bapak nggak bisa jawab sendiri malam ini. Bapak harus musyawarah dulu sama keluarga, terutama sama Sari.
        ar_eg: يا ماس، أنا مقدّر طريقتك. والكراما بتاعك الليلة كانت تقريبًا كاملة. بس ده موضوع كبير. مقدرش أردّ لوحدي الليلة. لازم أتشاور الأول مع العيلة، وأولهم ساري.
        ar: يا ماس، أقدّر طريقتك، وكانت الكراما عندك الليلة شبه كاملة. لكنّ هذا أمر جلل، ولا أستطيع أن أجيب وحدي الليلة. لا بدّ أن أتشاور أوّلًا مع العائلة، وفي مقدّمتها ساري.
        en: Mas, I respect the way you've done this. Your krama just now was almost perfect. But this is a big matter. I can't answer on my own tonight. I must talk it over with the family first - above all, with Sari.
        note:
          ar_eg: nggak bisa jawab = tidak bisa menjawab، musyawarah sama = bermusyawarah dengan (يتشاور مع). menghargai = يقدّر، perkara = موضوع، terutama = خصوصًا، krama = الجاوي المؤدّب.
          ar: nggak bisa jawab = tidak bisa menjawab، musyawarah sama = bermusyawarah dengan (يتشاور مع). menghargai = يقدّر، perkara = أمر، terutama = خصوصًا، krama = الجاوية المهذّبة.
          en: nggak bisa jawab = tidak bisa menjawab, musyawarah sama = bermusyawarah dengan (consult). menghargai = appreciate, perkara = matter, terutama = especially, krama = polite Javanese.
      - speaker: Karim
        text: Kula ngentosi, Pak. Saya bakal nunggu, berapa lama pun.
        ar_eg: هستنّى يا باك. هستنّى مهما طال الوقت.
        ar: سأنتظر يا باك. سأنتظر مهما طال الأمد.
        en: I will wait, Pak. However long it takes.
        note:
          ar_eg: kula ngentosi = هستنّى (جاوي مؤدّب)، bakal nunggu = akan menunggu، berapa lama pun = مهما طال.
          ar: kula ngentosi = سأنتظر (جاوية مهذّبة)، bakal nunggu = akan menunggu، berapa lama pun = مهما طال.
          en: kula ngentosi = I will wait (krama), bakal nunggu = akan menunggu, berapa lama pun = however long.
      - speaker: Narrator
        text: Karim pamit. Rumah menjadi sunyi. Hanya teh yang masih hangat di atas meja. Pak Budi mengambil HP-nya dan menekan satu nama.
        ar_eg: كريم استأذن ومشي. البيت بقى ساكت. مفيش غير الشاي لسّه سخن على الترابيزة. باك بودي مسك الموبايل ودوس على اسم واحد.
        ar: استأذن كريم وانصرف، وساد البيت صمت، ولم يبقَ إلّا الشاي دافئًا على الطاولة. أمسك باك بودي هاتفه وضغط على اسم واحد.
        en: Karim takes his leave. The house goes quiet. Only the tea on the table is still warm. Pak Budi picks up his phone and presses one name.
      - speaker: Sari
        text: Bapak! Aku baru mau telepon. Ada kabar gembira! Tapi... kok Bayu kirim pesan aneh tadi siang? Bapak sakit?
        ar_eg: بابا! لسّه كنت هكلّمك. عندي خبر حلو! بس... ليه بايو بعتلي رسالة غريبة الضهر؟ إنت تعبان؟
        ar: أبي! كنتُ على وشك الاتصال بك. لديّ خبر سارّ! لكن... لماذا أرسل لي بايو رسالة غريبة ظهرًا؟ هل أنت مريض؟
        en: Dad! I was just about to ring you. I've got good news! But... why did Bayu send me a strange message this afternoon? Are you ill?
        note:
          ar_eg: kok = «ليه كده؟»، kirim = mengirim، gembira = مفرح.
          ar: kok = «لماذا هكذا؟»، kirim = mengirim، gembira = سارّ.
          en: kok = how come, kirim = mengirim (send), gembira = happy.
      - speaker: Pak Budi
        text: Bapak sehat, Nduk. Bapak juga punya kabar. Kamu... lagi duduk?
        ar_eg: أنا كويّس يا بنتي. وأنا كمان عندي خبر. إنتي... قاعدة؟
        ar: أنا بخير يا ابنتي. ولديّ خبر أنا أيضًا. هل أنتِ... جالسة؟
        en: I'm fine, sweetheart. I've got news too. Are you... sitting down?
