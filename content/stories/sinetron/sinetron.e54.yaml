title:
  target: Mengalirlah Sungai Musi
  ar_eg: ويجري نهر موسي
  ar: ويجري نهر موسي
  en: And the Musi Flows On
summary:
  ar_eg: ساري وكريم في پاليمبانج في شغل، مع وفد رجال أعمال من مصر في رحلة مركب على نهر موسي. پاك حسن، المرشد، بيحكي عن سريويجايا والتجّار والرهبان وتشينج هو. وبالليل على الپيمپيك، كريم بيلاقي حتّة من مصر في الحكاية.
  ar: ساري وكريم في باليمبانغ في مهمّة عمل، يرافقان وفدًا من رجال الأعمال المصريين في جولة بالقارب على نهر موسي. يحكي المرشد باك حسن عن سريويجايا والتجّار والرهبان وتشنغ خه. وفي المساء، على طبق البيمبيك، يجد كريم قطعة من مصر في الحكاية.
  en: Sari and Karim are in Palembang for work, with a delegation of Egyptian businesspeople on a boat trip down the Musi. Pak Hasan, the guide, tells of Srivijaya, traders, monks and Cheng Ho. And that evening over pempek, Karim finds a piece of Egypt in the story.
cast: [Pak Hasan, Sari, Karim]
scenes:
  - setting:
      ar_eg: الصبح، مركب سياحي على نهر موسي في پاليمبانج. الوفد المصري قاعد على الكراسي، وساري بتترجم، وكريم ماسك ورق البرنامج.
      ar: صباحًا، قارب سياحي على نهر موسي في باليمبانغ. يجلس الوفد المصري على المقاعد، وتترجم ساري، ويمسك كريم أوراق البرنامج.
      en: Morning, a tour boat on the Musi river in Palembang. The Egyptian delegation is seated, Sari is interpreting, and Karim holds the programme.
    lines:
      - speaker: Narrator
        text: Pagi itu, sebuah perahu wisata membawa rombongan pengusaha dari Mesir menyusuri Sungai Musi.
        ar_eg: الصبح ده، مركب سياحي كان شايل وفد رجال أعمال من مصر ماشي بيهم على طول نهر موسي.
        ar: في ذلك الصباح أبحر قارب سياحي بوفد من رجال الأعمال المصريين على امتداد نهر موسي.
        en: That morning, a tour boat carried a group of Egyptian businesspeople along the Musi river.
      - speaker: Pak Hasan
        text: Selamat datang di Palembang, wong kito galo! Di tepi sungai inilah dulu berdiri Kerajaan Sriwijaya.
        ar_eg: أهلًا بيكم في پاليمبانج، كلّنا أهل! على شطّ النهر ده بالذات كانت قايمة زمان مملكة سريويجايا.
        ar: مرحبًا بكم في باليمبانغ، كلّنا أهل! على ضفّة هذا النهر بالذات قامت قديمًا مملكة سريويجايا.
        en: Welcome to Palembang - we're all one family here! It was right on the banks of this river that the kingdom of Srivijaya once stood.
        note:
          ar_eg: «berdiri Kerajaan Sriwijaya» - الفعل قبل الفاعل، وده اسمه inversi. بيتستعمل في الكتابة التاريخية عشان يدّي إحساس قصصي - زي الجملة الفعلية في العربي. وwong kito galo بلهجة پاليمبانج يعني «كلّنا ناسنا».
          ar: في «berdiri Kerajaan Sriwijaya» يتقدّم الفعل على الفاعل، ويسمّى ذلك inversi، ويكثر في السرد التاريخي ليمنحه نبرة قصصية، كالجملة الفعلية في العربية. وwong kito galo بلهجة باليمبانغ تعني «كلّنا أهل».
          en: In "berdiri Kerajaan Sriwijaya" the verb comes before the subject - inversion, common in historical prose for a storytelling tone. wong kito galo is Palembang dialect for "we're all our own people".
      - speaker: Sari
        text: Pak Hasan, pelan-pelan saja, ya. Saya menerjemahkan setiap kalimat ke bahasa Arab.
        ar_eg: يا پاك حسن، بالراحة شوية لو سمحت. أنا بترجم كل جملة للعربي.
        ar: يا باك حسن، تمهّل قليلًا من فضلك؛ إنني أترجم كلّ جملة إلى العربية.
        en: Pak Hasan, nice and slow, please. I'm translating every sentence into Arabic.
      - speaker: Pak Hasan
        text: Selama berabad-abad, Sriwijaya menguasai Selat Malaka. Datanglah kapal-kapal dari India, Arab, Persia, dan Tiongkok. Mereka membawa kain dan keramik, lalu pulang membawa rempah, emas, dan kapur barus.
        ar_eg: سريويجايا فضلت قرون مسيطرة على مضيق ملقا. وجت سفن من الهند والعرب وفارس والصين. كانوا بيجيبوا قماش وخزف، ويرجعوا شايلين توابل ودهب وكافور.
        ar: ظلّت سريويجايا قرونًا تسيطر على مضيق ملقا، فجاءت السفن من الهند وبلاد العرب وفارس والصين، تحمل الأقمشة والخزف، وتعود محمّلة بالتوابل والذهب والكافور.
        en: For centuries, Srivijaya controlled the Strait of Malacca. Ships came from India, Arabia, Persia and China. They brought cloth and ceramics, and went home with spices, gold and camphor.
      - speaker: Karim
        text: Kapur barus? Dalam bahasa Arab namanya kafur. Kata itu ada di dalam Al-Qur'an!
        ar_eg: كافور؟ ده اسمه بالعربي كافور. والكلمة دي موجودة في القرآن!
        ar: كابور باروس؟ اسمه بالعربية الكافور، والكلمة واردة في القرآن الكريم!
        en: Kapur barus? In Arabic that's kafur. The word is in the Qur'an!
        note:
          ar_eg: kapur barus يعني «كافور باروس» - وباروس ميناء على ساحل سومطرة الغربي. الكافور السومطري كان مشهور جدًا عند العرب زمان، والكلمتين العربي والإندونيسي جايين من أصل قديم واحد.
          ar: kapur barus تعني «كافور باروس»، وباروس ميناء على الساحل الغربي لسومطرة. وقد اشتهر الكافور السومطري عند العرب قديمًا، والكلمتان العربية والإندونيسية من أصل قديم مشترك.
          en: kapur barus means "camphor of Barus", a port on Sumatra's west coast. Sumatran camphor was prized in the medieval Arab world; the Arabic and Malay words share an ancient root.
      - speaker: Pak Hasan
        text: Di kota ini pula ditemukan Prasasti Kedukan Bukit dari tahun 683. Prasasti itu ditulis dalam bahasa Melayu Kuno, salah satu nenek moyang bahasa Indonesia.
        ar_eg: وفي المدينة دي كمان لقوا نقش كيدوكان بوكيت من سنة ٦٨٣. النقش ده مكتوب بالملايو القديمة، واحدة من جدود اللغة الإندونيسية.
        ar: وفي هذه المدينة أيضًا عُثر على نقش كيدوكان بوكيت المؤرّخ بعام ٦٨٣، وهو مكتوب بالملايوية القديمة، إحدى أسلاف اللغة الإندونيسية.
        en: It was also in this city that the Kedukan Bukit inscription, from the year 683, was found. It's written in Old Malay, one of the ancestors of Indonesian.
      - speaker: Sari
        text: Jadi bahasa yang kita pakai sekarang punya akar di sini?
        ar_eg: يعني اللغة اللي بنتكلّمها دلوقتي ليها جذور هنا؟
        ar: إذن للّغة التي نتكلّمها اليوم جذور هنا؟
        en: So the language we speak today has roots here?
      - speaker: Pak Hasan
        text: Salah satu akarnya, Mbak. Tidak lama sebelumnya, pada tahun 671, tibalah seorang biksu dari Tiongkok, I-Tsing. Dia belajar di sini sebelum berangkat ke India.
        ar_eg: جذر من جذورها يا مبَك. وقبلها بشوية، سنة ٦٧١، وصل راهب من الصين اسمه إي تسينج. اتعلّم هنا قبل ما يسافر الهند.
        ar: أحد جذورها يا مباك. وقبل ذلك بقليل، عام ٦٧١، وصل راهب صيني يُدعى إي تسينغ، ودرس هنا قبل أن يرحل إلى الهند.
        en: One of its roots, Mbak. Not long before, in 671, a monk arrived from China, I-Tsing. He studied here before setting off for India.
      - speaker: Karim
        text: Jadi dulu Palembang juga kota pelajar, seperti Kairo.
        ar_eg: يعني پاليمبانج زمان كانت مدينة طلبة علم، زي القاهرة.
        ar: إذن كانت باليمبانغ قديمًا مدينة لطلّاب العلم، كالقاهرة.
        en: So Palembang was a city of students too, like Cairo.
      - speaker: Pak Hasan
        text: Bisa dibilang begitu, Mas. Lebih dari tujuh ratus tahun kemudian, datanglah armada Laksamana Cheng Ho. Pada tahun 1407, armadanya mengalahkan bajak laut di sini.
        ar_eg: ممكن نقول كده يا ماس. وبعد أكتر من سبعمية سنة، جه أسطول الأدميرال تشينج هو. وسنة ١٤٠٧، أسطوله هزم القراصنة هنا.
        ar: يمكن قول ذلك يا ماس. وبعد أكثر من سبعة قرون جاء أسطول الأميرال تشنغ خه، فهزم القراصنة هنا عام ١٤٠٧.
        en: You could say so, Mas. More than seven hundred years later came the fleet of Admiral Cheng Ho. In 1407 his fleet defeated the pirates here.
        note:
          ar_eg: تشينج هو (Zheng He) أدميرال صيني مسلم، قاد سبع رحلات بحرية كبيرة بين ١٤٠٥ و١٤٣٣، وأساطيله وصلت لحدّ البحر الأحمر وشرق أفريقيا. وفي پاليمبانج النهارده فيه مسجد على الطراز الصيني على اسمه.
          ar: تشنغ خه (Zheng He) أميرال صيني مسلم قاد سبع رحلات بحرية كبرى بين ١٤٠٥ و١٤٣٣، وبلغت أساطيله البحر الأحمر وشرق أفريقيا. وفي باليمبانغ اليوم مسجد على الطراز الصيني يحمل اسمه.
          en: Cheng Ho (Zheng He) was a Chinese Muslim admiral who led seven great voyages between 1405 and 1433; his fleets reached the Red Sea and East Africa. Palembang today has a Chinese-style mosque named after him.
      - speaker: Narrator
        text: Perahu lewat di bawah Jembatan Ampera. Merah dan tinggi sekali jembatan itu.
        ar_eg: المركب عدّى من تحت كوبري أمپيرا. الكوبري ده أحمر وعالي أوي.
        ar: مرّ القارب تحت جسر أمبيرا. ما أشدّ احمرار ذلك الجسر وما أعلاه!
        en: The boat passes beneath the Ampera Bridge. How red and how tall that bridge is.
  - setting:
      ar_eg: بالليل، وارونج پيمپيك على شطّ النهر. نور كوبري أمپيرا والع فوق المية. ساري وكريم قاعدين مع پاك حسن بعد ما الوفد رجع الفندق.
      ar: ليلًا، وارونغ بيمبيك على ضفّة النهر، وأضواء جسر أمبيرا تتلألأ فوق الماء. يجلس ساري وكريم مع باك حسن بعد أن عاد الوفد إلى الفندق.
      en: Night, a pempek stall on the riverbank. The lights of the Ampera Bridge shine over the water. Sari and Karim sit with Pak Hasan after the delegation has gone back to the hotel.
    lines:
      - speaker: Pak Hasan
        text: Ini pempek kapal selam, Mas. Di dalamnya ada telur. Cukonya jangan sampai tumpah, itu jiwanya pempek.
        ar_eg: ده پيمپيك «غوّاصة» يا ماس. جوّاه بيضة. وخلّي بالك الصوص ميتدلقش، ده روح الپيمپيك.
        ar: هذا بيمبيك «الغوّاصة» يا ماس، وفي داخله بيضة. واحذر أن تسكب الصلصة، فهي روح البيمبيك.
        en: This is pempek kapal selam, Mas - the "submarine". There's an egg inside. Don't spill the cuko - it's the soul of pempek.
        note:
          ar_eg: الپيمپيك أشهر أكلة في پاليمبانج - عجينة سمك بالنشا، بتتاكل بصوص اسمه cuko (حامض حرّاق بالسكّر الأسمر). وkapal selam (غوّاصة) هو النوع الكبير اللي جوّاه بيضة.
          ar: البيمبيك أشهر أطباق باليمبانغ، عجينة من السمك والنشا تؤكل مع صلصة cuko (حامضة حارّة بسكّر النخيل). وkapal selam (الغوّاصة) هو النوع الكبير المحشوّ ببيضة.
          en: Pempek, Palembang's signature dish, is fish-and-tapioca cake eaten with cuko, a sour-hot palm-sugar sauce. kapal selam ("submarine") is the big one with an egg inside.
      - speaker: Karim
        text: Pedas, asam, manis... Rasanya seperti sejarah Palembang, Pak. Campuran dari mana-mana.
        ar_eg: حرّاق وحامض وحلو... طعمه زي تاريخ پاليمبانج يا پاك. خلطة من كل حتّة.
        ar: حارّ وحامض وحلو... طعمه كتاريخ باليمبانغ يا باك، مزيج من كلّ مكان.
        en: Spicy, sour, sweet... It tastes like Palembang's history, Pak. A mix from everywhere.
      - speaker: Sari
        text: Karim, aku harus menulis ringkasan sejarah untuk laporan kantor. Bantu aku, ya. Tiga kalimat saja.
        ar_eg: يا كريم، لازم أكتب ملخّص تاريخي لتقرير الشغل. ساعدني بقى. تلات جمل بس.
        ar: يا كريم، عليّ أن أكتب ملخّصًا تاريخيًّا لتقرير العمل. ساعدني، ثلاث جمل فقط.
        en: Karim, I have to write a historical summary for the office report. Help me out. Just three sentences.
      - speaker: Karim
        text: Pertama, Sriwijaya menguasai jalur laut. Kedua, pedagang dan pelajar datang dari segala penjuru. Ketiga...
        ar_eg: أولًا، سريويجايا كانت مسيطرة على طرق البحر. تانيًا، التجّار وطلبة العلم جم من كل ناحية. تالتًا...
        ar: أوّلًا، سيطرت سريويجايا على الطرق البحرية. ثانيًا، قدم التجّار وطلّاب العلم من كلّ صوب. ثالثًا...
        en: One, Srivijaya controlled the sea routes. Two, traders and students came from every direction. Three...
      - speaker: Karim
        text: Ketiga, rempah dari Nusantara sampai ke Mesir. Di Kairo zaman Mamluk, ada pedagang rempah yang sangat kaya. Mereka disebut pedagang Karimi.
        ar_eg: تالتًا، التوابل من جزر إندونيسيا وصلت لمصر. وفي القاهرة أيام المماليك، كان فيه تجّار توابل أغنيا جدًا. كانوا اسمهم التجّار الكارمية.
        ar: ثالثًا، بلغت التوابل من أرخبيل نوسانتارا مصر. وفي قاهرة المماليك كان هناك تجّار توابل أثرياء جدًّا يُعرفون بالتجّار الكارمية.
        en: Three, spices from the archipelago reached Egypt. In Mamluk Cairo there were very rich spice merchants. They were called the Karimi merchants.
        note:
          ar_eg: التجّار الكارمية كانوا تجّار توابل مصريين من القرن ١٢ للقرن ١٥، وكانوا مسيطرين على تجارة البحر الأحمر. توابل جزر الهند الشرقية كانت بتوصل مصر عن طريق الهند واليمن. وأصل الاسم «كارمي» لسه محدّش متأكّد منه.
          ar: الكارمية تجّار توابل مصريون بين القرنين الثاني عشر والخامس عشر، هيمنوا على تجارة البحر الأحمر، وكانت توابل جزر الهند الشرقية تصل إلى مصر عبر الهند واليمن. وأصل اسم «الكارمي» غير مؤكّد.
          en: The Karimi were Egyptian spice merchants of the 12th to 15th centuries who dominated the Red Sea trade; East Indies spices reached Egypt via India and Yemen. Where the name "Karimi" comes from is still uncertain.
      - speaker: Sari
        text: Pedagang Karimi? Kamu mengarang, ya!
        ar_eg: تجّار كارمية؟ انت بتألّف!
        ar: تجّار كارمية؟ إنك تختلق ذلك!
        en: Karimi merchants? You're making that up!
      - speaker: Karim
        text: Sungguh! Cari saja di internet. Jadi, sejak dulu, ada orang Mesir bernama Karim... eh, Karimi... yang jauh-jauh mencari sesuatu yang berharga dari Nusantara.
        ar_eg: والله! دوّري على النت. يعني من زمان، فيه مصري اسمه كريم... قصدي كارمي... جه من آخر الدنيا يدوّر على حاجة غالية من جزر إندونيسيا.
        ar: حقًّا! ابحثي في الإنترنت. إذن منذ القدم كان هناك مصري اسمه كريم... أقصد كارمي... قطع المسافات بحثًا عن شيء ثمين من نوسانتارا.
        en: Honestly! Look it up. So, since long ago, there's been an Egyptian called Karim... I mean Karimi... who came a very long way looking for something precious from the archipelago.
      - speaker: Pak Hasan
        text: Aduh, Mas. Pempeknya jadi tambah manis.
        ar_eg: يا سلام يا ماس. الپيمپيك بقى مسكّر زيادة.
        ar: يا سلام يا ماس، صار البيمبيك أحلى.
        en: Oh, Mas. Now the pempek's even sweeter.
      - speaker: Sari
        text: Pak Hasan, katanya ada kampung Arab di Palembang, ya?
        ar_eg: يا پاك حسن، بيقولوا فيه حارة عرب في پاليمبانج، صح؟
        ar: يا باك حسن، يُقال إنّ في باليمبانغ حيًّا عربيًّا، أليس كذلك؟
        en: Pak Hasan, they say there's an Arab quarter in Palembang, isn't there?
      - speaker: Pak Hasan
        text: Ada, Mbak. Kampung Al-Munawar, di seberang sana. Rumah-rumahnya sudah berumur ratusan tahun, dan keturunan pedagang dari Hadramaut masih tinggal di sana.
        ar_eg: أيوه يا مبَك. حارة المنوّر، في الناحية التانية من النهر. بيوتها عمرها مئات السنين، ولسه ساكن فيها أحفاد تجّار من حضرموت.
        ar: نعم يا مباك. حيّ المنوّر على الضفّة المقابلة؛ بيوته عمرها مئات السنين، وما زال أحفاد تجّار من حضرموت يسكنونه.
        en: There is, Mbak. Kampung Al-Munawar, just across the river. Its houses are hundreds of years old, and descendants of traders from Hadhramaut still live there.
        note:
          ar_eg: كامبونج المنوّر حارة على نهر موسي، أسّسها تجّار عرب من حضرموت في اليمن، وبيوتها الخشب والحجر من مئات السنين. حضارم كتير استقرّوا في موانئ إندونيسيا واتجوّزوا من أهلها.
          ar: كامبونغ المنوّر حيّ على نهر موسي أسّسه تجّار عرب من حضرموت، وبيوته الخشبية والحجرية قائمة منذ مئات السنين. وقد استقرّ كثير من الحضارم في موانئ إندونيسيا وصاهروا أهلها.
          en: Kampung Al-Munawar, on the Musi, was founded by Arab traders from Hadhramaut in Yemen; its timber and stone houses go back centuries. Many Hadhrami families settled in Indonesian ports and married locally.
      - speaker: Sari
        text: Sungai ini seperti buku sejarah. Setiap halamannya membawa orang dari jauh.
        ar_eg: النهر ده زي كتاب تاريخ. كل صفحة فيه بتجيب ناس من بعيد.
        ar: هذا النهر ككتاب تاريخ، كلّ صفحة منه تحمل أناسًا من بعيد.
        en: This river is like a history book. Every page brings people from far away.
      - speaker: Karim
        text: Termasuk aku.
        ar_eg: وأنا منهم.
        ar: وأنا منهم.
        en: Me included.
new_words:
