  ar: من باليمبانغ إلى باندا آتشيه. يأتي بايو من ميدان للقائهما، ويزور ثلاثتهم مسجد بيت الرحمن ومتحف التسونامي. وفي ماديون عقد باك بودي نيّة جديدة... ويحتاج أن يدّخر لها.
  en: From Palembang to Banda Aceh. Bayu comes over from Medan to meet them, and the three visit the Baiturrahman Mosque and the tsunami museum. Back in Madiun, Pak Budi has a new intention... and needs to save up for it.
