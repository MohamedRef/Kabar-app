questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: التجّار الأجانب كانوا بيرجعوا من سريويجايا شايلين إيه؟
      ar: ماذا حمل التجّار الأجانب عائدين من سريويجايا؟
      en: What did foreign traders take home from Srivijaya?
    options: ["kain dan keramik", "rempah, emas, dan kapur barus", "teh dan kopi", "pempek dan cuko"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Di tepi sungai inilah dulu ___ Kerajaan Sriwijaya.
    meaning:
      ar_eg: على شطّ النهر ده بالذات كانت قايمة زمان مملكة سريويجايا.
      ar: على ضفّة هذا النهر بالذات قامت قديمًا مملكة سريويجايا.
      en: It was right on the banks of this river that the kingdom of Srivijaya once stood.
    answers: [berdiri]
    options: ["berlayar", "berdiri", "berbicara"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: (استنتاج) پاك حسن قصده إيه لما قال «الپيمپيك بقى مسكّر زيادة»؟
      ar: (استنتاج) ماذا قصد باك حسن بقوله «صار البيمبيك أحلى»؟
      en: (Inference) What did Pak Hasan mean by "now the pempek's even sweeter"?
    options: ["Cukonya terlalu banyak gula.", "Dia ingin pesan pempek lagi.", "Penjualnya salah membuat cuko.", "Kata-kata Karim kepada Sari terdengar romantis."]
    answer: 3
  - id: q04
    type: listen
    text: Pada tahun 671, tibalah seorang biksu dari Tiongkok, I-Tsing. Dia belajar di sini sebelum berangkat ke India.
    question:
      ar_eg: إي تسينج وصل سنة كام، وعمل إيه هنا؟
      ar: متى وصل إي تسينغ، وماذا فعل هنا؟
      en: When did I-Tsing arrive, and what did he do here?
    options: ["Tahun 1407, dia mengalahkan bajak laut.", "Tahun 683, dia menulis prasasti.", "Tahun 671, dia belajar sebelum ke India."]
    answer: 2
    meaning:
      ar_eg: سنة ٦٧١، وصل راهب من الصين اسمه إي تسينج. اتعلّم هنا قبل ما يسافر الهند.
      ar: عام ٦٧١ وصل راهب صيني يُدعى إي تسينغ، ودرس هنا قبل أن يرحل إلى الهند.
      en: In 671, a monk arrived from China, I-Tsing. He studied here before setting off for India.
  - id: q05
    type: translate
    direction: from_target
    source_text: Datanglah kapal-kapal dari India, Arab, Persia, dan Tiongkok.
    answers_meaning:
      ar_eg: ["وجت سفن من الهند والعرب وفارس والصين.", "سفن جت من الهند وبلاد العرب وفارس والصين.", "وجم مراكب من الهند والعرب وفارس والصين."]
      ar: ["فجاءت السفن من الهند وبلاد العرب وفارس والصين.", "وقدمت سفن من الهند والجزيرة العربية وفارس والصين.", "ووصلت السفن من الهند وبلاد العرب وفارس والصين."]
      en: ["Ships came from India, Arabia, Persia and China.", "And there came ships from India, Arabia, Persia and China.", "Ships arrived from India, Arabia, Persia and China."]
