schema: kabar.story/v1
id: sinetron.e73
series: sinetron
episode: 73
language: jv
level: j1
unlock_after: j1.u03
title:
  target: Arp ng ndi, Rim?
  ar_eg: رايح فين يا كريم؟
  ar: إلى أين أنت ذاهب يا كريم؟
  en: Where you off to, Rim?
summary:
  ar_eg: رسالة واتساب من هيرو كلها اختصارات - arp، ng، sik، ra. كريم بيفكّها حرف حرف، وبعدين في ألون ألون كيدول بالليل بيتعلّم أربع كلمات بيلفّ عليهم الكلام كله - wis، durung، lagi، arep.
  ar: رسالة واتساب من هيرو كلّها اختصارات - arp وng وsik وra. يفكّها كريم حرفًا حرفًا، ثمّ يتعلّم ليلًا في ألون ألون كيدول أربع كلمات يدور حولها الكلام كلّه - wis وdurung وlagi وarep.
  en: A WhatsApp from Heru that's all abbreviations - arp, ng, sik, ra. Karim decodes it letter by letter, and then, at Alun-alun Kidul at night, learns the four little words everything turns on - wis, durung, lagi, arep.
cast: [Karim, Mas Heru]
scenes:
  - setting:
      ar_eg: أوضة كريم في الفندق، المغرب. التليفون بيرنّ - رسالة من ماس هيرو.
      ar: غرفة كريم في الفندق، عند المغرب. يرنّ الهاتف - رسالة من ماس هيرو.
      en: Karim's hotel room, at sunset. His phone buzzes - a message from Mas Heru.
    lines:
      - speaker: Mas Heru
        text: Rim, arp ng ndi? Aku wis ng Alkid. Sik, ra usah kesusu.
        ar_eg: يا كريم، رايح فين؟ أنا وصلت ألكيد خلاص. استنّى، مش لازم تستعجل.
        ar: يا كريم، إلى أين ستذهب؟ أنا وصلت إلى ألكيد. لحظة، لا داعي للعجلة.
        en: Rim, where you going? I'm already at Alkid. Hang on, no need to rush.
        note:
          ar_eg: ده جاوي الشات. arp = arep (هـ/ناوي)، ng = neng (في/لـ)، ndi = ngendi (فين)، ra = ora (مش)، sik = لحظة/استنّى. وAlkid = ألون ألون كيدول، الميدان الجنوبي. وkesusu يعني «مستعجل».
          ar: هذه جاوية المحادثات. arp = arep (سوف/ينوي)، ng = neng (في/إلى)، ndi = ngendi (أين)، ra = ora (لا)، sik = لحظة. وAlkid = ألون ألون كيدول، الساحة الجنوبية. وkesusu تعني «مستعجل».
          en: This is chat Javanese. arp = arep (going to), ng = neng (to/at), ndi = ngendi (where), ra = ora (not), sik = hang on. Alkid = Alun-alun Kidul, the south square. kesusu means "in a hurry".
      - speaker: Karim
        text: Arp... arep. Ng... neng. Ndi... ngendi! Arep neng ngendi!
        ar_eg: arp... يعني arep. ng... يعني neng. ndi... يعني ngendi! «رايح فين!»
        ar: arp... أي arep. ng... أي neng. ndi... أي ngendi! «إلى أين ستذهب!»
        en: Arp... arep. Ng... neng. Ndi... ngendi! "Where are you going!"
      - speaker: Narrator
        text: Karim mbales nganggo basa Indonesia. "Saya belum makan."
        ar_eg: كريم بيردّ بالإندونيسي، «أنا لسه ماكلتش».
        ar: يردّ كريم بالإندونيسية، «لم آكل بعد».
        en: Karim replies in Indonesian. "I haven't eaten yet."
      - speaker: Mas Heru
        text: Wkwkwk. Jawa, Rim! "Aku durung mangan."
        ar_eg: ههههه. بالجاوي يا كريم! «Aku durung mangan».
        ar: ههههه. بالجاوية يا كريم! «Aku durung mangan».
        en: Hahaha. In Javanese, Rim! "Aku durung mangan."
        note:
          ar_eg: wkwkwk هي الضحكة الإندونيسية في الشات، زي «ههههه». وdurung = belum = «لسه ما». وmangan = makan = «ياكل».
          ar: wkwkwk هي الضحكة الإندونيسية في المحادثات، مثل «ههههه». وdurung = belum أي «لم... بعد». وmangan = makan أي «يأكل».
          en: wkwkwk is the Indonesian chat laugh, like "hahaha". durung = belum, "not yet". mangan = makan, "eat".
  - setting:
      ar_eg: ألون ألون كيدول بالليل - شجرتين بانيان كبار، وعربيّات بدّال منوّرة، وعربيات أكل. هيرو وكريم قاعدين على حصيرة على النجيلة.
      ar: ألون ألون كيدول ليلًا - شجرتا بانيان كبيرتان، وعربات بدّالات مضاءة، وعربات طعام. يجلس هيرو وكريم على حصير فوق العشب.
      en: Alun-alun Kidul at night - two big banyan trees, lit-up pedal cars, food carts. Heru and Karim sit on a mat on the grass.
    lines:
      - speaker: Mas Heru
        text: Rungokna, Rim. Papat tembung. Wis, durung, lagi, arep.
        ar_eg: اسمع يا كريم. أربع كلمات. wis، durung، lagi، arep.
        ar: اسمع يا كريم. أربع كلمات. wis وdurung وlagi وarep.
        en: Listen, Rim. Four words. Wis, durung, lagi, arep.
      - speaker: Karim
        text: Wis iku "sudah", durung iku "belum". Bener?
        ar_eg: wis يعني «خلاص»، وdurung يعني «لسه ما». صح؟
        ar: wis تعني «قد/انتهى»، وdurung تعني «لم بعد». صحيح؟
        en: Wis is "sudah", durung is "belum". Right?
      - speaker: Mas Heru
        text: Bener! Lagi iku saiki, "sedang". Arep iku mengko, "mau".
        ar_eg: صح! lagi يعني دلوقتي، «بـ...» زي «بياكل». وarep يعني بعدين، «هـ...» زي «هياكل».
        ar: صحيح! lagi تعني الآن، «يفعل الآن». وarep تعني لاحقًا، «سوف».
        en: Right! Lagi is now, "in the middle of". Arep is later, "going to".
        note:
          ar_eg: الجاوي ما بيغيّرش الفعل حسب الزمن. بيحطّ قبله كلمة - wis (خلّص)، durung (لسه)، lagi (دلوقتي)، arep (هيعمل). زي بالظبط «خلاص / لسه / بـ / هـ» في العامية.
          ar: لا تغيّر الجاوية الفعل بحسب الزمن، بل تضع قبله كلمة - wis (انتهى)، durung (لم بعد)، lagi (الآن)، arep (سوف).
          en: Javanese doesn't change the verb for tense. It puts a word in front - wis (done), durung (not yet), lagi (right now), arep (going to).
      - speaker: Karim
        text: Aku lagi ngombe es. Aku durung mangan. Aku arep mangan!
        ar_eg: أنا بشرب حاجة ساقعة. أنا لسه ماكلتش. أنا هاكل!
        ar: أنا أشرب مشروبًا باردًا الآن. لم آكل بعد. سآكل!
        en: I'm drinking an iced drink. I haven't eaten yet. I'm going to eat!
      - speaker: Mas Heru
        text: Mantep! Ayo mangan sega sambel. Nanging aja "tidak", Rim. "Ora" utawa "ra".
        ar_eg: جامد! يلّا ناكل رز بالشطّة. بس بلاش «tidak» يا كريم. قول «ora» أو «ra».
        ar: ممتاز! هيّا نأكل أرزًّا بالسامبال. لكن لا تقل «tidak» يا كريم. قل «ora» أو «ra».
        en: Brilliant! Let's go eat rice with sambal. But don't say "tidak", Rim. Say "ora" or "ra".
        note:
          ar_eg: إزاي تعرف إن الكلام جاوي مش إندونيسي؟ دوّر على الكلمات الصغيرة - ora مش tidak، wis مش sudah، aku/kowe مش saya/kamu.
          ar: كيف تعرف أنّ الكلام جاويّ لا إندونيسيّ؟ ابحث عن الكلمات الصغيرة - ora لا tidak، وwis لا sudah، وaku/kowe لا saya/kamu.
          en: How do you know it's Javanese, not Indonesian? Look for the little words - ora not tidak, wis not sudah, aku/kowe not saya/kamu.
      - speaker: Narrator
        text: Status WA Karim. "Wis neng Alkid. Lagi ngombe es. Arep mangan."
        ar_eg: حالة كريم على الواتساب، «وصلت ألكيد. بشرب حاجة ساقعة. هاكل».
        ar: حالة كريم على واتساب، «وصلت إلى ألكيد. أشرب مشروبًا باردًا. سآكل».
        en: Karim's WhatsApp status. "At Alkid. Drinking an iced drink. Going to eat."
new_words:
  - word: wis
    pos: particle
    ar_eg: خلاص (حصل)
    ar: قد / انتهى
    en: already, done (= sudah)
  - word: durung
    pos: particle
    ar_eg: لسه ما...
    ar: لم... بعد
    en: not yet (= belum)
  - word: lagi
    pos: particle
    ar_eg: بـ... دلوقتي
    ar: يفعل الآن
    en: in the middle of (= sedang)
  - word: arep
    pos: particle
    ar_eg: هـ... / ناوي
    ar: سوف / ينوي
    en: going to, want to (= mau, akan)
  - word: mangan
    pos: verb
    ar_eg: ياكل
    ar: يأكل
    en: eat
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: في رسالة هيرو، «ng» معناها إيه؟
      ar: في رسالة هيرو، ماذا تعني «ng»؟
      en: In Heru's message, what does "ng" stand for?
    options: ["ngombe", "neng", "ngendi"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Aku ___ mangan.
    meaning:
      ar_eg: أنا لسه ماكلتش.
      ar: لم آكل بعد.
      en: I haven't eaten yet.
    answers: [durung]
    options: ["durung", "wis", "arep"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة جاوي مش إندونيسي؟
      ar: أيّ كلمة جاوية لا إندونيسية؟
      en: Which word is Javanese, not Indonesian?
    options: ["tidak", "sudah", "ora", "saya"]
    answer: 2
  - id: q04
    type: translate
    direction: from_target
    source_text: Aku lagi ngombe es.
    answers_meaning:
      ar_eg: ["أنا بشرب حاجة ساقعة.", "أنا بشرب مشروب ساقع دلوقتي."]
      ar: ["أنا أشرب مشروبًا باردًا.", "أنا أشرب مشروبًا باردًا الآن."]
      en: ["I'm drinking an iced drink.", "I'm having an iced drink right now."]
next:
  ar_eg: كريم بيروح شارع جاكال جنب الجامعة، لمحلّ صغيّر بيبيع برفان وتمر. ريحة بخور وبلح... وحد بيكلّمه بالعربي بلهجة جاوي!
  ar: يذهب كريم إلى شارع جاكال قرب الجامعة، إلى محلّ صغير يبيع العطور والتمر. رائحة بخور وتمر... وأحدهم يكلّمه بالعربية بلكنة جاوية!
  en: Karim heads up Jakal, by the campus, to a little shop of perfume oil and dates. Incense and dates... and someone speaks to him in Arabic with a Javanese accent!
review:
  status: draft
  verified: false
  notes: Moved from Jalan Tunjungan, Surabaya to Alun-alun Kidul, Jogja, 2026-10-27. Chat abbreviations (arp, ng, ndi, sik, ra) follow the j1.u03 lessons; check "ra usah kesusu" as natural Jogja chat.
