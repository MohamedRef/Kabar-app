schema: kabar.story/v1
id: sinetron.e73
series: sinetron
episode: 73
language: jv
level: j1
unlock_after: j1.u03
title:
  target: Arp nang ndi, rek?
  ar_eg: رايح فين يا صاحبي؟
  ar: إلى أين أنت ذاهب يا صديقي؟
  en: Where you off to, mate?
summary:
  ar_eg: رسالة واتساب من هيرو كلها اختصارات - arp، ng، sek، gk. كريم بيفكّها حرف حرف، وبعدين في شارع تونجونجان بالليل بيتعلّم أربع كلمات بيلفّ عليهم الكلام كله - wis، durung، lagi، arep.
  ar: رسالة واتساب من هيرو كلّها اختصارات - arp وng وsek وgk. يفكّها كريم حرفًا حرفًا، ثمّ يتعلّم ليلًا في شارع تونجونغان أربع كلمات يدور حولها الكلام كلّه - wis وdurung وlagi وarep.
  en: A WhatsApp from Heru that's all abbreviations - arp, ng, sek, gk. Karim decodes it letter by letter, and then, on Jalan Tunjungan at night, learns the four little words everything turns on - wis, durung, lagi, arep.
cast: [Karim, Cak Heru]
scenes:
  - setting:
      ar_eg: أوضة كريم في الفندق، المغرب. التليفون بيرنّ - رسالة من تشاك هيرو.
      ar: غرفة كريم في الفندق، عند المغرب. يرنّ الهاتف - رسالة من تشاك هيرو.
      en: Karim's hotel room, at sunset. His phone buzzes - a message from Cak Heru.
    lines:
      - speaker: Cak Heru
        text: Rim, arp ng ndi? Aku wis ng Tunjungan. Sek, gk usah kesusu.
        ar_eg: يا كريم، رايح فين؟ أنا وصلت تونجونجان خلاص. استنّى، مش لازم تستعجل.
        ar: يا كريم، إلى أين ستذهب؟ أنا وصلت إلى تونجونغان. لحظة، لا داعي للعجلة.
        en: Rim, where you going? I'm already at Tunjungan. Hang on, no need to rush.
        note:
          ar_eg: ده جاوي الشات. arp = arep (هـ/ناوي)، ng = nang (في/لـ)، ndi = ngendi (فين)، gk = gak (مش)، sek = لحظة/استنّى. وkesusu يعني «مستعجل».
          ar: هذه جاوية المحادثات. arp = arep (سوف/ينوي)، ng = nang (في/إلى)، ndi = ngendi (أين)، gk = gak (لا)، sek = لحظة. وkesusu تعني «مستعجل».
          en: This is chat Javanese. arp = arep (going to), ng = nang (to/at), ndi = ngendi (where), gk = gak (not), sek = hang on. kesusu means "in a hurry".
      - speaker: Karim
        text: Arp... arep. Ng... nang. Ndi... ngendi! Arep nang ngendi!
        ar_eg: arp... يعني arep. ng... يعني nang. ndi... يعني ngendi! «رايح فين!»
        ar: arp... أي arep. ng... أي nang. ndi... أي ngendi! «إلى أين ستذهب!»
        en: Arp... arep. Ng... nang. Ndi... ngendi! "Where are you going!"
      - speaker: Narrator
        text: Karim mbales nganggo basa Indonesia. "Saya belum makan."
        ar_eg: كريم بيردّ بالإندونيسي، «أنا لسه ماكلتش».
        ar: يردّ كريم بالإندونيسية، «لم آكل بعد».
        en: Karim replies in Indonesian. "I haven't eaten yet."
      - speaker: Cak Heru
        text: Wkwkwk. Jawa, rek! "Aku durung mangan."
        ar_eg: ههههه. بالجاوي يا صاحبي! «Aku durung mangan».
        ar: ههههه. بالجاوية يا صديقي! «Aku durung mangan».
        en: Hahaha. In Javanese, mate! "Aku durung mangan."
        note:
          ar_eg: wkwkwk هي الضحكة الإندونيسية في الشات، زي «ههههه». وdurung = belum = «لسه ما». وmangan = makan = «ياكل».
          ar: wkwkwk هي الضحكة الإندونيسية في المحادثات، مثل «ههههه». وdurung = belum أي «لم... بعد». وmangan = makan أي «يأكل».
          en: wkwkwk is the Indonesian chat laugh, like "hahaha". durung = belum, "not yet". mangan = makan, "eat".
  - setting:
      ar_eg: شارع تونجونجان بالليل - مباني قديمة منوّرة، ناس بتتصوّر، وعربيات أكل. هيرو وكريم قاعدين على كرسي على الرصيف.
      ar: شارع تونجونغان ليلًا - مبانٍ قديمة مضاءة، وأناس يلتقطون الصور، وعربات طعام. يجلس هيرو وكريم على مقعد على الرصيف.
      en: Jalan Tunjungan at night - old buildings lit up, people taking photos, food carts. Heru and Karim sit on a bench on the pavement.
    lines:
      - speaker: Cak Heru
        text: Rungokna, rek. Papat tembung. Wis, durung, lagi, arep.
        ar_eg: اسمع يا صاحبي. أربع كلمات. wis، durung، lagi، arep.
        ar: اسمع يا صديقي. أربع كلمات. wis وdurung وlagi وarep.
        en: Listen, mate. Four words. Wis, durung, lagi, arep.
      - speaker: Karim
        text: Wis iku "sudah", durung iku "belum". Bener?
        ar_eg: wis يعني «خلاص»، وdurung يعني «لسه ما». صح؟
        ar: wis تعني «قد/انتهى»، وdurung تعني «لم بعد». صحيح؟
        en: Wis is "sudah", durung is "belum". Right?
      - speaker: Cak Heru
        text: Bener! Lagi iku saiki, "sedang". Arep iku mengko, "mau".
        ar_eg: صح! lagi يعني دلوقتي، «بـ...» زي «بياكل». وarep يعني بعدين، «هـ...» زي «هياكل».
        ar: صحيح! lagi تعني الآن، «يفعل الآن». وarep تعني لاحقًا، «سوف».
        en: Right! Lagi is now, "in the middle of". Arep is later, "going to".
        note:
          ar_eg: الجاوي ما بيغيّرش الفعل حسب الزمن. بيحطّ قبله كلمة - wis (خلّص)، durung (لسه)، lagi (دلوقتي)، arep (هيعمل). زي بالظبط «خلاص / لسه / بـ / هـ» في العامية.
          ar: لا تغيّر الجاوية الفعل بحسب الزمن، بل تضع قبله كلمة - wis (انتهى)، durung (لم بعد)، lagi (الآن)، arep (سوف).
          en: Javanese doesn't change the verb for tense. It puts a word in front - wis (done), durung (not yet), lagi (right now), arep (going to).
      - speaker: Karim
        text: Aku lagi ngombe es. Aku durung mangan. Aku arep mangan!
        ar_eg: أنا بشرب حاجة ساقعة. أنا لسه ماكلتش. أنا هاكل!
        ar: أنا أشرب مشروبًا باردًا الآن. لم آكل بعد. سآكل!
        en: I'm drinking an iced drink. I haven't eaten yet. I'm going to eat!
      - speaker: Cak Heru
        text: Mantep! Ayo mangan sega sambel. Nanging ojok "tidak", rek. "Ora" utawa "gak".
        ar_eg: جامد! يلّا ناكل رز بالشطّة. بس بلاش «tidak» يا صاحبي. قول «ora» أو «gak».
        ar: ممتاز! هيّا نأكل أرزًّا بالسامبال. لكن لا تقل «tidak» يا صديقي. قل «ora» أو «gak».
        en: Brilliant! Let's go eat rice with sambal. But don't say "tidak", mate. Say "ora" or "gak".
        note:
          ar_eg: إزاي تعرف إن الكلام جاوي مش إندونيسي؟ دوّر على الكلمات الصغيرة - ora مش tidak، wis مش sudah، aku/kowe مش saya/kamu.
          ar: كيف تعرف أنّ الكلام جاويّ لا إندونيسيّ؟ ابحث عن الكلمات الصغيرة - ora لا tidak، وwis لا sudah، وaku/kowe لا saya/kamu.
          en: How do you know it's Javanese, not Indonesian? Look for the little words - ora not tidak, wis not sudah, aku/kowe not saya/kamu.
      - speaker: Narrator
        text: Status WA Karim. "Wis nang Tunjungan. Lagi ngombe es. Arep mangan."
        ar_eg: حالة كريم على الواتساب، «وصلت تونجونجان. بشرب حاجة ساقعة. هاكل».
        ar: حالة كريم على واتساب، «وصلت إلى تونجونغان. أشرب مشروبًا باردًا. سآكل».
        en: Karim's WhatsApp status. "At Tunjungan. Drinking an iced drink. Going to eat."
new_words:
  - word: wis
    pos: particle
    ar_eg: خلاص (حصل)
    ar: قد / انتهى
    en: already, done (= sudah)
  - word: durung
    pos: particle
    ar_eg: لسه ما...
    ar: لم... بعد
    en: not yet (= belum)
  - word: lagi
    pos: particle
    ar_eg: بـ... دلوقتي
    ar: يفعل الآن
    en: in the middle of (= sedang)
  - word: arep
    pos: particle
    ar_eg: هـ... / ناوي
    ar: سوف / ينوي
    en: going to, want to (= mau, akan)
  - word: mangan
    pos: verb
    ar_eg: ياكل
    ar: يأكل
    en: eat
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: في رسالة هيرو، «ng» معناها إيه؟
      ar: في رسالة هيرو، ماذا تعني «ng»؟
      en: In Heru's message, what does "ng" stand for?
    options: ["ngombe", "nang", "ngendi"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Aku ___ mangan.
    meaning:
      ar_eg: أنا لسه ماكلتش.
      ar: لم آكل بعد.
      en: I haven't eaten yet.
    answers: [durung]
    options: ["durung", "wis", "arep"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة جاوي مش إندونيسي؟
      ar: أيّ كلمة جاوية لا إندونيسية؟
      en: Which word is Javanese, not Indonesian?
    options: ["tidak", "sudah", "ora", "saya"]
    answer: 2
  - id: q04
    type: translate
    direction: from_target
    source_text: Aku lagi ngombe es.
    answers_meaning:
      ar_eg: ["أنا بشرب حاجة ساقعة.", "أنا بشرب مشروب ساقع دلوقتي."]
      ar: ["أنا أشرب مشروبًا باردًا.", "أنا أشرب مشروبًا باردًا الآن."]
      en: ["I'm drinking an iced drink.", "I'm having an iced drink right now."]
next:
  ar_eg: كريم بيزور حيّ أمبيل - الحيّ العربي في سورابايا. ريحة بخور وتمر... وحد بيكلّمه بالعربي بلهجة جاوي!
  ar: يزور كريم حيّ أمبيل - الحيّ العربي في سورابايا. رائحة بخور وتمر... وأحدهم يكلّمه بالعربية بلكنة جاوية!
  en: Karim visits Ampel - Surabaya's Arab quarter. Incense and dates... and someone speaks to him in Arabic with a Javanese accent!
