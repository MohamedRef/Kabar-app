questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: طابور العلم بدأ الساعة كام؟
      ar: متى بدأت مراسم العلم؟
      en: What time did the flag ceremony start?
    options: ["jam enam pagi", "jam tujuh tepat", "jam tujuh belas", "jam dua siang"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Kalian semua adalah ___ bangsa yang mekar di negeri orang.
    meaning:
      ar_eg: انتو كلكم ورد الوطن اللي فتّح في بلاد الغربة.
      ar: أنتم جميعًا زهرة الأمّة التي تفتّحت في بلاد الغربة.
      en: All of you are the flowers of the nation, blooming in a foreign land.
    answers: [bunga]
    options: ["bunga", "bendera", "kerupuk"]
  - id: q03
    type: listen
    text: Tanggal 23 Juli, kami memperingati Revolusi 1952.
    question:
      ar_eg: مصر بتحتفل بإيه يوم ٢٣ يوليو؟
      ar: ماذا تُحيي مصر في الثالث والعشرين من يوليو؟
      en: What does Egypt commemorate on 23 July?
    options: ["Hari Kemerdekaan Indonesia", "kemenangan tahun 1973", "Revolusi 1952"]
    answer: 2
    meaning:
      ar_eg: في ٢٣ يوليو بنحتفل بثورة ٥٢.
      ar: في الثالث والعشرين من يوليو نُحيي ذكرى ثورة ١٩٥٢.
      en: On 23 July we commemorate the 1952 Revolution.
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: پاك بودي طلع كام في مسابقة الكروبوك؟
      ar: في أيّ مركز جاء باك بودي في مسابقة الكروبوك؟
      en: Where did Pak Budi place in the krupuk race?
    options: ["juara satu", "juara tiga", "tidak ikut", "juara dua"]
    answer: 3
  - id: q05
    type: translate
    direction: from_target
    source_text: Kemerdekaan itu nggak datang dengan mudah.
    answers_meaning:
      ar_eg: ["الاستقلال مجاش بالساهل.", "الاستقلال مش بييجي بسهولة.", "الحرية مجاتش بالساهل."]
      ar: ["لم يأتِ الاستقلال بسهولة.", "الاستقلال لا يأتي بسهولة.", "لم تُنَل الحرّية بسهولة."]
      en: ["Independence didn't come easily.", "Independence does not come easily.", "Freedom wasn't won easily."]
next:
  ar_eg: كريم عنده مفاجأة - رحلة لإسكندرية، وهو المرشد! وپاك بودي، اللي جاي من ماديون اللي مالهاش بحر، هيشوف البحر المتوسط لأول مرة.
  ar: لدى كريم مفاجأة - رحلة إلى الإسكندرية، وهو المرشد! وباك بودي، القادم من ماديون البعيدة عن البحر، سيرى البحر المتوسط لأول مرة.
  en: Karim has a surprise - a trip to Alexandria, with him as the guide! And Pak Budi, from landlocked Madiun, is about to see the Mediterranean for the first time.
