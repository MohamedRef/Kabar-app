title:
  target: Merah Putih di Kairo
  ar_eg: الأحمر والأبيض في القاهرة
  ar: الأحمر والأبيض في القاهرة
  en: Red and White in Cairo
summary:
  ar_eg: ١٧ أغسطس في السفارة الإندونيسية في القاهرة. الصبح طابور العلم، وپاك بودي بيغنّي النشيد الوطني لأول مرة برّه بلده. وبعد الضهر المسابقات... وپاك بودي داخل يكسب مسابقة الكروبوك.
  ar: السابع عشر من أغسطس في السفارة الإندونيسية بالقاهرة. في الصباح مراسم رفع العلم، ويُنشد باك بودي النشيد الوطني لأول مرة خارج وطنه. وبعد الظهر المسابقات... وباك بودي عازم على الفوز في مسابقة الكروبوك.
  en: The 17th of August at the Indonesian embassy in Cairo. In the morning, the flag ceremony, and Pak Budi sings the anthem abroad for the first time. In the afternoon, the games... and Pak Budi means to win the krupuk race.
cast: [Sari, Pak Budi, Bu Rahayu, Nadia, Karim]
scenes:
  - setting:
      ar_eg: حوش السفارة الإندونيسية في القاهرة، الساعة ٧ الصبح. مئات الطلبة الإندونيسيين واقفين في صفوف، والستات لابسين كبايا.
      ar: باحة السفارة الإندونيسية في القاهرة، الساعة السابعة صباحًا. مئات الطلاب الإندونيسيين مصطفّون، والنساء يرتدين الكبايا.
      en: The courtyard of the Indonesian embassy in Cairo, 7 a.m. Hundreds of Indonesian students stand in neat rows; the women wear kebaya.
    lines:
      - speaker: Narrator
        text: Tanggal 17 Agustus. Halaman KBRI Kairo penuh warna merah dan putih.
        ar_eg: ١٧ أغسطس. حوش السفارة الإندونيسية في القاهرة كله أحمر وأبيض.
        ar: السابع عشر من أغسطس. باحة السفارة الإندونيسية في القاهرة تكتسي بالأحمر والأبيض.
        en: The 17th of August. The courtyard of the Indonesian embassy in Cairo is a sea of red and white.
        note:
          ar_eg: في ١٧ أغسطس ١٩٤٥ سوكارنو وحتّا أعلنوا استقلال إندونيسيا. وKBRI اختصار Kedutaan Besar Republik Indonesia (سفارة جمهورية إندونيسيا).
          ar: في السابع عشر من أغسطس ١٩٤٥ أعلن سوكارنو وحتّا استقلال إندونيسيا. وKBRI اختصار Kedutaan Besar Republik Indonesia (سفارة جمهورية إندونيسيا).
          en: On 17 August 1945, Sukarno and Hatta proclaimed Indonesia's independence. KBRI stands for Kedutaan Besar Republik Indonesia, the Indonesian embassy.
      - speaker: Sari
        text: Pak, Bu, upacara buat memperingati Hari Kemerdekaan mulai jam tujuh tepat lho. Ayo, berbaris!
        ar_eg: بابا، ماما، طابور الاحتفال بعيد الاستقلال هيبدأ الساعة ٧ بالظبط. يلا، اقفوا في الصفّ!
        ar: أبي، أمي، تبدأ مراسم إحياء ذكرى الاستقلال في السابعة تمامًا. هيّا، اصطفّا!
        en: Dad, Mum, the ceremony to commemorate Independence Day starts at seven sharp. Come on, line up!
        note:
          ar_eg: memperingati (يحيي ذكرى) من ingat (يفتكر). meN-…-i بتعمل أفعال لها مفعول - menghadiri (يحضر)، mengikuti (يشارك في)، menghormati (يحترم).
          ar: memperingati (يُحيي ذكرى) من ingat (يتذكّر). وتصوغ meN-…-i أفعالًا متعدّية - menghadiri (يحضر)، mengikuti (يشارك في)، menghormati (يحترم).
          en: memperingati (to commemorate) comes from ingat (remember). meN-…-i makes verbs that take an object - menghadiri (attend), mengikuti (take part in), menghormati (honour).
      - speaker: Pak Budi
        text: Bapak udah puluhan kali ikut upacara di Madiun. Tapi di luar negeri, baru kali ini.
        ar_eg: أنا حضرت الطابور ده عشرات المرات في ماديون. بس برّه البلد، دي أول مرة.
        ar: شاركت في هذه المراسم عشرات المرات في ماديون، لكنها المرة الأولى خارج الوطن.
        en: I've been to this ceremony dozens of times in Madiun. But abroad, this is the first time.
        note:
          ar_eg: udah = sudah، وikut = mengikuti (يشارك) - كلام كل يوم. وluar negeri = برّه البلد، وpuluhan = عشرات.
          ar: udah = sudah، وikut = mengikuti (يشارك) في الكلام اليومي. وluar negeri = خارج البلاد، وpuluhan = عشرات.
          en: udah = sudah, ikut = mengikuti (take part) - everyday speech. luar negeri = abroad; puluhan = dozens.
      - speaker: Narrator
        text: Bendera Merah Putih naik perlahan-lahan. Semua orang menyanyikan "Indonesia Raya".
        ar_eg: علم الأحمر والأبيض بيطلع بالراحة. والكل بيغنّي «إندونيسيا رايا».
        ar: يرتفع العلم الأحمر والأبيض ببطء، والجميع يُنشدون «إندونيسيا رايا».
        en: The Red and White rises slowly. Everyone sings "Indonesia Raya".
      - speaker: Bu Rahayu
        text: Pak, Bapak nangis lagi ya?
        ar_eg: يا بودي، انت بتعيّط تاني؟
        ar: يا باك، أتبكي مرة أخرى؟
        en: Pak, are you crying again?
        note:
          ar_eg: nangis = menangis (يعيّط) في الكلام.
          ar: nangis = menangis (يبكي) في الكلام اليومي.
          en: nangis = menangis (to cry) in everyday speech.
      - speaker: Pak Budi
        text: Nggak. Mata Bapak kemasukan debu Kairo.
        ar_eg: لأ. عيني دخل فيها تراب القاهرة.
        ar: لا. دخل غبار القاهرة في عيني.
        en: No. I've got Cairo dust in my eye.
      - speaker: Nadia
        text: Pak Budi tahu nggak? Mesir itu termasuk negara pertama yang mengakui kemerdekaan Indonesia lho.
        ar_eg: تعرف يا پاك بودي؟ مصر من أوائل الدول اللي اعترفت باستقلال إندونيسيا.
        ar: أتعلم يا باك بودي؟ مصر من أوائل الدول التي اعترفت باستقلال إندونيسيا.
        en: Did you know, Pak Budi? Egypt was one of the first countries to recognise Indonesia's independence.
        note:
          ar_eg: مصر اعترفت بإندونيسيا سنة ١٩٤٦-١٩٤٧، ووقّعوا معاهدة صداقة سنة ١٩٤٧. الإندونيسيين كتير بيقولوا إن مصر كانت «أول» دولة، وده لسه فاكرينه بامتنان.
          ar: اعترفت مصر بإندونيسيا في ١٩٤٦-١٩٤٧ ووقّع البلدان معاهدة صداقة سنة ١٩٤٧. وكثيرًا ما يقول الإندونيسيون إنّ مصر كانت «الأولى»، ويذكرون ذلك بامتنان.
          en: Egypt recognised Indonesia in 1946-47, and the two signed a friendship treaty in 1947. Indonesians often call Egypt the very first, and remember it fondly.
      - speaker: Karim
        text: Mesir juga punya hari nasional. Tanggal 23 Juli, kami memperingati Revolusi 1952. Tanggal 6 Oktober, kemenangan tahun 1973.
        ar_eg: ومصر كمان عندها أعياد وطنية. في ٢٣ يوليو بنحتفل بثورة ٥٢. وفي ٦ أكتوبر بنصر ٧٣.
        ar: ولمصر أيضًا أعيادها الوطنية. في الثالث والعشرين من يوليو نُحيي ذكرى ثورة ١٩٥٢، وفي السادس من أكتوبر ذكرى نصر ١٩٧٣.
        en: Egypt has national days too. On 23 July we commemorate the 1952 Revolution. On 6 October, the 1973 victory.
      - speaker: Pak Budi
        text: Kalian semua adalah bunga bangsa yang mekar di negeri orang.
        ar_eg: انتو كلكم ورد الوطن اللي فتّح في بلاد الغربة.
        ar: أنتم جميعًا زهرة الأمّة التي تفتّحت في بلاد الغربة.
        en: All of you are the flowers of the nation, blooming in a foreign land.
        note:
          ar_eg: ده metafora (استعارة) - من غير seperti. «bunga bangsa» (ورد الوطن) يعني الشباب الأمل. زي ما بنقول «زهرة شبابه».
          ar: هذه metafora (استعارة) بلا أداة تشبيه. و«bunga bangsa» (زهرة الأمّة) أي الشباب الواعد، كقولنا «زهرة الشباب».
          en: That's a metafora (metaphor) - no seperti. bunga bangsa, "the nation's flowers", means its promising young people.
  - setting:
      ar_eg: بعد الضهر في نفس الحوش. مسابقات ١٧ أغسطس (tujuh belasan). كروبوك متعلّق في خيط قدّام كل متسابق.
      ar: بعد الظهر في الباحة نفسها. مسابقات السابع عشر من أغسطس (tujuh belasan). كروبوك معلّق بخيط أمام كل متسابق.
      en: Afternoon, same courtyard. The tujuh belasan games have begun. A krupuk dangles on a string in front of each contestant.
    lines:
      - speaker: Sari
        text: Peserta lomba makan kerupuk, siap-siap! Tangan di belakang, ya!
        ar_eg: المشتركين في مسابقة أكل الكروبوك، استعدّوا! الإيدين ورا ضهركم!
        ar: المشاركون في مسابقة أكل الكروبوك، استعدّوا! الأيدي خلف الظهر!
        en: Krupuk-eating contestants, get ready! Hands behind your backs!
      - speaker: Pak Budi
        text: Nduk, Bapak juara tiga kali lho di gang. Lawan-lawan Bapak ini masih anak kemarin sore!
        ar_eg: يا بنتي، أنا كسبت المسابقة دي تلات مرات في الحارة. اللي قدّامي دول لسه عيال صغيرين!
        ar: يا ابنتي، فزتُ بها ثلاث مرات في الزقاق. ومنافسيّ هؤلاء ما زالوا صغارًا قليلي الخبرة!
        en: Sweetheart, I've won this three times in our lane. My rivals here are still wet behind the ears!
        note:
          ar_eg: anak kemarin sore (حرفيًا «عيل من امبارح العصر») تعبير معناه حدّ لسه صغير ومعندوش خبرة - زي «لسه بيقول يا هادي». وjuara = بطل، الأول في المسابقة.
          ar: anak kemarin sore (حرفيًّا «ابن عصر الأمس») تعبير يعني شخصًا صغيرًا قليل الخبرة.
          en: anak kemarin sore ("a child of yesterday afternoon") means a newcomer with no experience - "wet behind the ears". juara = champion, winner.
      - speaker: Nadia
        text: Sari, kok kerupuknya digantung sih? Kan jadi susah dimakan.
        ar_eg: يا ساري، ليه الكروبوك متعلّق؟ كده صعب يتّاكل.
        ar: يا ساري، لماذا عُلّق الكروبوك؟ هكذا يصعب أكله.
        en: Sari, why is the krupuk hanging up? That makes it hard to eat.
      - speaker: Sari
        text: Emang biar susah! Katanya, lomba ini ngingetin kita, kemerdekaan itu nggak datang dengan mudah.
        ar_eg: ما هو عشان يبقى صعب! بيقولوا إن المسابقة دي بتفكّرنا إن الاستقلال مجاش بالساهل.
        ar: الغرض أن يكون صعبًا! يُقال إنّ هذه المسابقة تذكّرنا بأنّ الاستقلال لم يأتِ بسهولة.
        en: That's the point! They say the game reminds us that independence didn't come easily.
        note:
          ar_eg: في ١٧ أغسطس كل حارة في إندونيسيا بتعمل مسابقات - أكل الكروبوك، سباق الشوال (balap karung)، شدّ الحبل (tarik tambang)، وتسلّق العمود المدهون (panjat pinang). وفي الكلام - emang = memang، biar = supaya (عشان)، ngingetin = mengingatkan (يذكّر).
          ar: في السابع عشر من أغسطس يقيم كلّ حيّ في إندونيسيا مسابقات - أكل الكروبوك، وسباق الأكياس (balap karung)، وشدّ الحبل (tarik tambang)، وتسلّق العمود المدهون (panjat pinang). وفي الكلام اليومي - emang = memang، biar = supaya (لكي)، ngingetin = mengingatkan (يذكّر).
          en: 'On 17 August every neighbourhood in Indonesia holds games: krupuk-eating, sack races (balap karung), tug of war (tarik tambang) and greased-pole climbing (panjat pinang). In speech, emang = memang, biar = supaya (so that), ngingetin = mengingatkan (remind).'
      - speaker: Bu Rahayu
        text: Ayo, Pak! Ayo! Jangan pake tangan!
        ar_eg: يلا يا بودي! يلا! من غير إيدين!
        ar: هيّا يا باك! هيّا! لا تستعمل يديك!
        en: Go on, Pak! Go! No hands!
        note:
          ar_eg: pake = pakai (يستعمل) في الكلام.
          ar: pake = pakai (يستعمل) في الكلام اليومي.
          en: pake = pakai (use) in everyday speech.
      - speaker: Narrator
        text: Kerupuk Pak Budi bergoyang-goyang ditiup angin. Akhirnya, dia juara dua. Juara satunya seorang mahasiswi yang sangat cepat.
        ar_eg: الكروبوك بتاع پاك بودي بيتهزّ مع الهوا. وفي الآخر طلع التاني. والأولى كانت طالبة سريعة جدًا.
        ar: يتأرجح كروبوك باك بودي مع الريح. وفي النهاية يحلّ ثانيًا، والفائزة الأولى طالبة سريعة جدًّا.
        en: Pak Budi's krupuk swings in the wind. In the end, he comes second. The winner is a very speedy student.
      - speaker: Pak Budi
        text: Juara dua juga bagus kok. Bapak kalah dengan terhormat.
        ar_eg: التاني برضه كويس. أنا خسرت بشرف.
        ar: المركز الثاني جيد أيضًا. لقد خسرتُ بشرف.
        en: Second is good too. I lost with honour.
      - speaker: Karim
        text: Pak Budi, tim tarik tambang saya kurang satu orang. Bapak mau ikut nggak?
        ar_eg: يا پاك بودي، فريق شدّ الحبل بتاعي ناقصه واحد. تيجي معانا؟
        ar: يا باك بودي، ينقص فريقي في شدّ الحبل شخص واحد. هل تنضمّ إلينا؟
        en: Pak Budi, my tug-of-war team is one person short. Want to join?
      - speaker: Pak Budi
        text: Perut Bapak udah penuh kerupuk. Tapi buat Mas Karim... ayo deh!
        ar_eg: بطني اتملت كروبوك. بس عشان خاطرك يا ماس كريم... يلا!
        ar: امتلأت معدتي بالكروبوك. لكن من أجلك يا ماس كريم... هيّا!
        en: My stomach's full of krupuk. But for you, Mas Karim... let's go!
      - speaker: Sari
        text: Bu, sejak kapan Bapak sama Karim jadi satu tim?
        ar_eg: يا ماما، من إمتى بابا وكريم بقوا فريق واحد؟
        ar: يا أمي، منذ متى صار أبي وكريم فريقًا واحدًا؟
        en: Mum, since when are Dad and Karim on the same team?
