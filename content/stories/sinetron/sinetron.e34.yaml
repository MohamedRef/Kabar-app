id: sinetron.e34
series: sinetron
episode: 34
language: id
level: bipa4
unlock_after: bipa4.u04
title:
  target: Bayu Masuk Berita
  ar_eg: بايو في الأخبار
  ar: بايو في الأخبار
  en: Bayu Makes the News
summary:
  ar_eg: صحفية من موقع أخبار محلي بتعمل لقاء مع بايو وبو تيني عن الغرق ومطبخ الوارونج. وفي القاهرة، العيلة بتتفرّج على الخبر على الموبايل... وبتتناقش - الشهرة دي حلوة ولا متعبة؟
  ar: تُجري صحفية من موقع إخباري محلي مقابلة مع بايو وبو تيني عن الفيضان ومطبخ الوارونغ. وفي القاهرة تشاهد العائلة الخبر على الهاتف... وتتناقش في الشهرة، أهي نعمة أم عبء؟
  en: A reporter from a local news site interviews Bayu and Bu Tini about the flood and the warung's kitchen. In Cairo, the family watches the story on a phone... and debates whether fame is a blessing or a headache.
cast: [Mbak Dewi, Bayu, Bu Tini, Mas Joko, Sari, Hagga Fatma, Pak Budi, Bu Rahayu, Nadia]
scenes:
  - setting:
      ar_eg: ماديون، الوارونج الضهر. صحفية شابة معاها موبايل على حامل وميكروفون صغير.
      ar: ماديون، الوارونغ وقت الظهر. صحفية شابة معها هاتف على حامل وميكروفون صغير.
      en: Madiun, the warung at midday. A young reporter arrives with a phone on a tripod and a little microphone.
    lines:
      - speaker: Mbak Dewi
        text: Selamat siang. Saya Dewi, wartawan portal berita daring di Madiun. Saya membaca surat Bayu di koran. Boleh saya wawancara?
        ar_eg: نهاركم سعيد. أنا ديوي، صحفية في موقع أخبار أونلاين في ماديون. قريت جواب بايو في الجرنال. ممكن أعمل لقاء؟
        ar: طاب نهاركم. أنا ديوي، صحفية في بوابة إخبارية إلكترونية في ماديون. قرأت رسالة بايو في الصحيفة. هل تسمحون لي بإجراء مقابلة؟
        en: Good afternoon. I'm Dewi, a reporter for an online news site in Madiun. I read Bayu's letter in the paper. May I interview you?
        note:
          ar_eg: daring اختصار dalam jaringan (على الشبكة) يعني «أونلاين»، وعكسها luring (luar jaringan) يعني «أوفلاين». كلمتين إندونيسيتين معمولين مخصوص بدل الإنجليزي.
          ar: daring اختصار dalam jaringan (داخل الشبكة) أي «متّصل بالإنترنت»، وعكسها luring (luar jaringan). وهما كلمتان إندونيسيتان صيغتا بديلًا عن الإنجليزية.
          en: daring is short for dalam jaringan ("in the network"), i.e. online; its opposite is luring (luar jaringan), offline. Both were coined as Indonesian alternatives to the English words.
      - speaker: Bayu
        text: Bo... boleh, Mbak!
        ar_eg: مـ... ممكن يا مباك!
        ar: نـ... نعم، تفضّلي يا مباك!
        en: S... sure, Mbak!
      - speaker: Mbak Dewi
        text: Bayu, menurutmu, apa penyebab banjir di gang ini?
        ar_eg: يا بايو، في رأيك، إيه سبب الغرق في الحارة دي؟
        ar: يا بايو، ما سبب الفيضان في هذا الزقاق برأيك؟
        en: Bayu, what do you think caused the flood in this lane?
      - speaker: Bayu
        text: Penyebab utamanya saluran air yang terlalu kecil dan tersumbat. Saya sempat memotretnya. Akibatnya, air hujan tidak bisa mengalir dan masuk ke rumah warga.
        ar_eg: السبب الأساسي إن المجرى صغيّر أوي ومسدود. أنا لحقت صوّرته. والنتيجة إن مية المطر مقدرتش تمشي ودخلت بيوت الناس.
        ar: السبب الرئيسي أنّ قناة التصريف أصغر من اللازم ومسدودة، وقد صوّرتها. ونتيجة لذلك لم تستطع مياه المطر أن تجري فدخلت بيوت السكان.
        en: The main cause is the drain - it's too small and it was blocked. I managed to take a photo. As a result, the rainwater couldn't flow away and went into people's homes.
        note:
          ar_eg: akibatnya (والنتيجة) وoleh karena itu (عشان كده) وsehingga (لدرجة إن / فـ) بيربطوا السبب بالنتيجة - أهم كلمات في أي خبر.
          ar: akibatnya (نتيجةً لذلك) وoleh karena itu (لذلك) وsehingga (حتى / فـ) تربط السبب بالنتيجة، وهي من أهم أدوات الخبر.
          en: akibatnya (as a result), oleh karena itu (therefore) and sehingga (so that) link cause and effect - the backbone of any news story.
      - speaker: Mbak Dewi
        text: Waktu banjir, warung ini menjadi dapur umum, ya?
        ar_eg: ووقت الغرق، الوارونج ده بقى مطبخ للحيّ كله، صح؟
        ar: وحين وقع الفيضان صار هذا الوارونغ مطبخًا عامًّا، أليس كذلك؟
        en: And during the flood, this warung became a community kitchen, right?
      - speaker: Bu Tini
        text: Betul, Mbak. Berkat warung Pak Budi, tiga puluh keluarga bisa makan nasi hangat selama tiga hari.
        ar_eg: مظبوط يا مباك. بفضل وارونج باك بودي، تلاتين عيلة لقوا رز سخن ياكلوه تلات أيام.
        ar: صحيح يا مباك. بفضل وارونغ باك بودي استطاعت ثلاثون أسرة أن تأكل أرزًّا ساخنًا ثلاثة أيام.
        en: That's right, Mbak. Thanks to Pak Budi's warung, thirty families had hot rice for three days.
        note:
          ar_eg: berkat (بفضل) لسبب حلو، وgara-gara (بسبب / من ورا) لسبب وحش. وberkat أصلها عربي - «بركة».
          ar: berkat (بفضل) لسبب حسن، وgara-gara (بسبب، من جرّاء) لسبب سيّئ. وأصل berkat عربي - «بركة».
          en: berkat (thanks to) is for a good cause, gara-gara (because of, all thanks to) for a bad one. berkat comes from Arabic بركة (blessing).
      - speaker: Mas Joko
        text: Gara-gara banjir, kompor di rumah saya rusak. Jadi saya ikut masak di sini. Tapi lebih banyak makannya sih.
        ar_eg: بسبب الغرق، البوتاجاز اللي في بيتي باظ. عشان كده جيت أطبخ هنا معاهم. بس الصراحة كنت باكل أكتر ما بطبخ.
        ar: بسبب الفيضان تعطّل الموقد في بيتي، لذلك شاركت في الطبخ هنا. لكنّي كنت آكل أكثر ممّا أطبخ.
        en: Because of the flood, the stove at my house broke. So I helped cook here. Mostly I helped eat, though.
      - speaker: Mbak Dewi
        text: Terakhir, Bayu, ada pesan untuk pemerintah kota?
        ar_eg: آخر سؤال يا بايو، عندك رسالة للحكومة المحلية؟
        ar: أخيرًا يا بايو، هل لديك رسالة إلى حكومة المدينة؟
        en: Finally, Bayu, do you have a message for the city government?
      - speaker: Bayu
        text: Ada, Mbak. Banjir bukan salah hujan. Kalau salurannya bersih, airnya bisa lewat. Oleh karena itu, ayo kita jaga sama-sama.
        ar_eg: أيوه يا مباك. الغرق مش ذنب المطر. لو المجاري نضيفة، المية هتعدّي. عشان كده، يلا كلنا نحافظ عليها مع بعض.
        ar: نعم يا مباك. الفيضان ليس ذنب المطر. إن كانت القنوات نظيفة مرّ الماء. لذلك فلنحافظ عليها معًا.
        en: Yes, Mbak. The flood isn't the rain's fault. If the drains are clean, the water gets through. So let's look after them together.
  - setting:
      ar_eg: القاهرة، بالليل، في صالة الحاجّة فاطمة. العيلة متجمّعة حوالين موبايل ساري.
      ar: القاهرة، ليلًا، في صالة الحاجّة فاطمة. العائلة ملتفّة حول هاتف ساري.
      en: Cairo, that night, in Hagga Fatma's sitting room. The family is crowded around Sari's phone.
    lines:
      - speaker: Sari
        text: Pak, Bu, lihat deh! Judulnya, "Warung Jadi Dapur Umum, Pelajar SMA Kirim Surat untuk Wali Kota".
        ar_eg: بابا، ماما، بصّوا! العنوان - «وارونج يتحوّل لمطبخ للحيّ، وطالب ثانوي يبعت جواب لرئيس المدينة».
        ar: أبي، أمي، انظرا! العنوان - «وارونغ يتحوّل إلى مطبخ عام، وطالب ثانوي يراسل عمدة المدينة».
        en: 'Dad, Mum, look! The headline says: "Warung Becomes Community Kitchen, High-Schooler Writes to Mayor".'
        note:
          ar_eg: عناوين الأخبار الإندونيسية بتشيل الكلمات الصغيرة زي yang وsudah، زي عناويننا بالظبط. وwali kota هو رئيس المدينة (العمدة).
          ar: تحذف عناوين الأخبار الإندونيسية الكلمات الصغيرة مثل yang وsudah، كعناويننا تمامًا. وwali kota هو رئيس بلدية المدينة.
          en: Indonesian headlines drop small words like yang and sudah, just like English ones. A wali kota is a city mayor.
      - speaker: Hagga Fatma
        text: Masyaallah, Bayu masuk berita! Kayak artis!
        ar_eg: ما شاء الله، بايو طلع في الأخبار! زي الفنانين!
        ar: ما شاء الله، ظهر بايو في الأخبار! كأنه نجم!
        en: Masyaallah, Bayu's in the news! Like a film star!
        note:
          ar_eg: kayak = seperti (زي) في الكلام. وartis = فنان، نجم.
          ar: kayak = seperti (مثل) في الكلام اليومي. وartis = فنان، نجم.
          en: kayak = seperti (like) in everyday speech. artis = celebrity, star.
      - speaker: Pak Budi
        text: Bapak bangga, tapi khawatir juga. Gara-gara berita ini, warung bisa ramai banget, nanti Bayu kecapekan.
        ar_eg: أنا فخور، بس قلقان كمان. بسبب الخبر ده، الوارونج ممكن يتزحم أوي، وبايو يتهلك.
        ar: أنا فخور، لكنّي قلق أيضًا. بسبب هذا الخبر قد يزدحم الوارونغ كثيرًا فيُرهَق بايو.
        en: I'm proud, but I'm worried too. Because of this story, the warung could get too busy, and Bayu will wear himself out.
      - speaker: Bu Rahayu
        text: Bapak ini... Kalau warung ramai, itu kan rezeki, Pak.
        ar_eg: يا بودي بقى... لو الوارونج اتزحم، ده رزق.
        ar: يا باك... إن ازدحم الوارونغ فذلك رزق.
        en: Oh, you... If the warung's busy, that's a blessing, Pak.
        note:
          ar_eg: rezeki جاية من العربي «رزق»، وبيتقال على أي خير بييجي من ربنا - فلوس، زباين، أو حتى ضيف.
          ar: rezeki من العربية «رزق»، وتُقال على كلّ خير يأتي من الله - مالًا أو زبائن أو حتى ضيفًا.
          en: rezeki comes from Arabic رزق - any good fortune sent by God, whether money, customers or even a guest.
      - speaker: Nadia
        text: Ada pro sama kontranya, Pak. Beritanya bagus buat warung, tapi Bayu kan tetap harus sekolah.
        ar_eg: ليها مميزات وعيوب يا باك. الخبر حلو للوارونج، بس بايو لازم يفضل يروح المدرسة.
        ar: للأمر إيجابيات وسلبيات يا باك. الخبر مفيد للوارونغ، لكن على بايو أن يواظب على المدرسة.
        en: There are pros and cons, Pak. The story's good for the warung, but Bayu still has to go to school.
      - speaker: Sari
        text: Bentar, Bayu nelepon!
        ar_eg: ثانية واحدة، بايو بيتّصل!
        ar: لحظة، بايو يتّصل!
        en: Hang on, Bayu's calling!
        note:
          ar_eg: bentar = sebentar (ثانية)، nelepon = menelepon (بيتّصل) - في الكلام الحرف الأولاني أو me- بيقع.
          ar: bentar = sebentar (لحظة)، nelepon = menelepon (يتّصل) - يسقط المقطع الأول أو me- في الكلام.
          en: bentar = sebentar (a moment), nelepon = menelepon (to phone) - speech clips the first syllable or the me-.
      - speaker: Bayu
        text: Pak! Bu! Tadi Pak RT datang ke warung. Katanya, dari kelurahan, saluran air di Gang Melati mau diperbaiki bulan depan!
        ar_eg: بابا! ماما! باك إر تي (كبير الحارة) جه الوارونج النهارده. وبيقول إن الحيّ قرّر يصلّح مجرى حارة ميلاتي الشهر الجاي!
        ar: أبي! أمي! جاء رئيس الزقاق (باك إر تي) إلى الوارونغ اليوم، وقال إنّ الحيّ سيُصلح قناة زقاق ميلاتي الشهر القادم!
        en: Dad! Mum! Pak RT came to the warung today. He says the kelurahan is fixing the Gang Melati drain next month!
      - speaker: Pak Budi
        text: Alhamdulillah! Jadi berkat suratmu, gang kita aman dari banjir.
        ar_eg: الحمد لله! يعني بفضل جوابك، حارتنا هتبقى في أمان من الغرق.
        ar: الحمد لله! إذن بفضل رسالتك سيكون زقاقنا في مأمن من الفيضان.
        en: Alhamdulillah! So thanks to your letter, our lane will be safe from floods.
      - speaker: Hagga Fatma
        text: Nah, Bayu. Jadi koki apa wartawan? Udah jelas sekarang?
        ar_eg: أهو يا بايو. طبّاخ ولا صحفي؟ بقت واضحة دلوقتي؟
        ar: ها يا بايو. طاهٍ أم صحفي؟ هل اتّضح الأمر الآن؟
        en: Well then, Bayu. Chef or journalist? Clear now?
        note:
          ar_eg: في السؤال الكلام بيقول apa بدل atau (ولا). وudah = sudah.
          ar: في السؤال يقال في الكلام apa بدل atau (أم). وudah = sudah.
          en: In spoken questions apa often replaces atau (or). udah = sudah.
      - speaker: Bayu
        text: Masih bingung, Hagga. Tapi sekarang aku tahu, tulisan itu bisa ngubah sesuatu.
        ar_eg: لسه محتار يا حاجّة. بس دلوقتي عرفت إن الكتابة ممكن تغيّر حاجة.
        ar: ما زلت حائرًا يا حاجّة. لكنّي عرفت الآن أنّ الكتابة قادرة على التغيير.
        en: Still not sure, Hagga. But now I know that writing can change things.
        note:
          ar_eg: ngubah = mengubah (يغيّر) في الكلام. وbingung = محتار.
          ar: ngubah = mengubah (يغيّر) في الكلام اليومي. وbingung = حائر.
          en: ngubah = mengubah (to change) in speech. bingung = confused, unsure.
