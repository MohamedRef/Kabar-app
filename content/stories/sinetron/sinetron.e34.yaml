questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب بايو، إيه السبب الأساسي للغرق؟
      ar: ما السبب الرئيسي للفيضان بحسب بايو؟
      en: According to Bayu, what was the main cause of the flood?
    options: ["hujan yang terlalu deras", "saluran air yang terlalu kecil dan tersumbat", "sungai yang terlalu dekat", "kompor Mas Joko"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: ___ warung Pak Budi, tiga puluh keluarga bisa makan nasi hangat.
    meaning:
      ar_eg: بفضل وارونج باك بودي، تلاتين عيلة لقوا رز سخن ياكلوه.
      ar: بفضل وارونغ باك بودي استطاعت ثلاثون أسرة أن تأكل أرزًّا ساخنًا.
      en: Thanks to Pak Budi's warung, thirty families had hot rice to eat.
    answers: [Berkat]
    options: ["Gara-gara", "Akibatnya", "Berkat"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: باك بودي قلقان من إيه؟
      ar: ممّ يقلق باك بودي؟
      en: What is Pak Budi worried about?
    options: ["Warung terlalu ramai, sehingga Bayu kecapekan.", "Bayu tidak mau sekolah lagi.", "Wartawan menulis berita yang salah."]
    answer: 0
  - id: q04
    type: listen
    text: Tadi Pak RT datang ke warung. Katanya, dari kelurahan, saluran air di Gang Melati mau diperbaiki bulan depan!
    question:
      ar_eg: إمتى المجاري هتتصلّح؟
      ar: متى ستُصلَح قنوات التصريف؟
      en: When will the drains be fixed?
    options: ["besok", "minggu depan", "bulan depan", "tahun depan"]
    answer: 2
    meaning:
      ar_eg: باك إر تي جه الوارونج النهارده. وبيقول إن الحيّ هيصلّح مجرى حارة ميلاتي الشهر الجاي!
      ar: جاء باك إر تي إلى الوارونغ اليوم، وقال إنّ الحيّ سيُصلح قناة زقاق ميلاتي الشهر القادم!
      en: Pak RT came to the warung today. He says the kelurahan is fixing the Gang Melati drain next month!
  - id: q05
    type: translate
    direction: from_target
    source_text: Gara-gara banjir, kompor di rumah saya rusak.
    answers_meaning:
      ar_eg: ["بسبب الغرق، البوتاجاز اللي في بيتي باظ.", "من ورا الغرق، البوتاجاز في البيت عندي اتعطل.", "الغرق بوّظ البوتاجاز اللي في بيتي."]
      ar: ["بسبب الفيضان تعطّل الموقد في بيتي.", "من جرّاء الفيضان تعطّل موقد بيتي.", "تعطّل الموقد في بيتي بسبب الفيضان."]
      en: ["Because of the flood, the stove at my house broke.", "The flood broke the stove in my house.", "Thanks to the flood, my stove at home is broken."]
next:
  ar_eg: ١٧ أغسطس قرّب - عيد استقلال إندونيسيا. والسفارة في القاهرة عاملة مسابقات... وباك بودي سجّل اسمه في مسابقة أكل الكروبوك.
  ar: اقترب السابع عشر من أغسطس، عيد استقلال إندونيسيا. والسفارة في القاهرة تنظّم مسابقات... وقد سجّل باك بودي اسمه في مسابقة أكل الكروبوك.
  en: The 17th of August is coming - Indonesia's Independence Day. The embassy in Cairo is holding games... and Pak Budi has signed up for the krupuk-eating race.
