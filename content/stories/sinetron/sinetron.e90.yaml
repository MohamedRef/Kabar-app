id: sinetron.e90
series: sinetron
episode: 90
language: jv
level: j4
unlock_after: j4.u01
title:
  target: Kula sampun dhahar?
  ar_eg: «أنا اتعشّيت يا فندم»؟
  ar: «لقد تناولتُ طعامي يا سيدي»؟
  en: '"I have dined, sir"?'
summary:
  ar_eg: كريم بيوصل يوجياكارتا عند عيلة باك وبو هارسونو جنب عمود توجو. بيسلّم جواب باك هارجو، وبيقع في أشهر غلطة بيعملها الأجانب - بيكرّم نفسه بكلمة مخصوصة للكبار. والعيلة بتعلّمه أفعال التشريف - dhahar، tindak، sare، rawuh، kondur.
  ar: يصل كريم إلى يوغياكارتا عند عائلة باك وبو هارسونو قرب عمود توغو. يسلّم رسالة باك هارجو، ويقع في أشهر خطأ للأجانب - يكرّم نفسه بكلمة مخصّصة للكبار. وتعلّمه العائلة أفعال التشريف - dhahar وtindak وsare وrawuh وkondur.
  en: Karim arrives in Yogyakarta at Pak and Bu Harsono's house near the Tugu monument. He hands over Pak Harjo's letter - and makes the most famous foreigner's mistake, honouring himself with a word reserved for elders. The family teaches him the honorific verbs - dhahar, tindak, sare, rawuh, kondur.
cast: [Karim, Bu Harsono, Pak Harsono]
scenes:
  - setting:
      ar_eg: يوجياكارتا، المغرب. بيت بحوش صغيّر في شارع جانبي جنب عمود توجو الأبيض. بو هارسونو بتفتح الباب.
      ar: يوغياكارتا، عند المغرب. بيت بفناء صغير في شارع جانبيّ قرب عمود توغو الأبيض. تفتح بو هارسونو الباب.
      en: Yogyakarta at dusk. A house with a little courtyard on a side street near the white Tugu monument. Bu Harsono opens the door.
    lines:
      - speaker: Karim
        text: Kula nuwun. Kula Karim, muridipun Pak Harjo. Menika serat saking Pak Harjo.
        ar_eg: السلام عليكم. أنا كريم، تلميذ باك هارجو. ده جواب من باك هارجو.
        ar: عن إذنكم. أنا كريم، تلميذ باك هارجو. هذه رسالة من باك هارجو.
        en: Hello, may I? I'm Karim, Pak Harjo's student. Here's a letter from Pak Harjo.
        note:
          ar_eg: "كلمات: nuwun = nuwun sewu = لو سمحت؛ kula nuwun = ممكن أدخل؟."
          ar: "مفردات: nuwun = nuwun sewu = عفوًا؛ kula nuwun = هل لي بالدخول؟."
          en: "Words: nuwun = nuwun sewu = excuse me; kula nuwun = may I come in?"
      - speaker: Bu Harsono
        text: Mangga, Nak! Sugeng rawuh. Bapak sekedhap malih kondur saking masjid.
        ar_eg: اتفضّل يا ابني! أهلًا بيك. باك هارسونو جاي من الجامع كمان شويّة.
        ar: تفضّل يا بنيّ! أهلًا بك. سيعود باك هارسونو من المسجد بعد قليل.
        en: Come in, my boy! Welcome. My husband will be back from the mosque shortly.
        note:
          ar_eg: "rawuh = يوصل (للكبير أو الضيف المحترم)، وkondur = يرجع البيت (للكبير). الاتنين كراما إنجيل. كلمات: nak = يا ابني (نداء)."
          ar: "rawuh = يصل (للكبير أو الضيف المحترم)، وkondur = يعود إلى البيت (للكبير). وكلاهما كراما إنغيل. مفردات: nak = يا بنيّ (نداء)."
          en: "rawuh = arrive (for a respected person or guest), kondur = go home (for a respected person). Both are krama inggil. Words: nak = my boy, son (calling someone)."
      - speaker: Bu Harsono
        text: Nak Karim sampun nedha?
        ar_eg: انت كلت يا ابني كريم؟
        ar: هل أكلت يا بنيّ كريم؟
        en: Have you eaten, Karim?
      - speaker: Karim
        text: Sampun, Bu. Kula sampun dhahar.
        ar_eg: أيوه يا مدام. «أنا اتعشّيت يا فندم».
        ar: نعم يا سيدتي. «لقد تناولت طعامي يا سيدي».
        en: Yes, ma'am. "I have dined, sir."
      - speaker: Bu Harsono
        text: Hahaha! Nak, Nak... nyuwun pangapunten, kula mboten saged ngampet ngguyu.
        ar_eg: ههههه! يا ابني، يا ابني... لا مؤاخذة، مش قادرة أمسك نفسي من الضحك.
        ar: ههههه! يا بنيّ، يا بنيّ... عذرًا، لا أستطيع أن أمسك نفسي عن الضحك.
        en: Hahaha! Oh, my boy... forgive me, I can't stop laughing.
        note:
          ar_eg: "كلمات: nyuwun = يطلب (كراما وتواضع؛ ngoko njaluk)."
          ar: "مفردات: nyuwun = يطلب (كراما وتواضع؛ ngoko njaluk)."
          en: "Words: nyuwun = ask for, request (krama, humble; ngoko njaluk) = minta."
  - setting:
      ar_eg: باك هارسونو بيدخل، لابس سارونج وطاقية، ومراته لسه بتمسح دموعها من الضحك. بيقرا جواب باك هارجو.
      ar: يدخل باك هارسونو، مرتديًا السارونغ والطاقية، وزوجته ما زالت تمسح دموع الضحك. يقرأ رسالة باك هارجو.
      en: Pak Harsono comes in, in a sarong and cap, while his wife is still wiping away tears of laughter. He reads Pak Harjo's letter.
    lines:
      - speaker: Pak Harsono
        text: Wonten menapa, Bu? Kok ngguyu kados mekaten?
        ar_eg: فيه إيه يا حاجّة؟ بتضحكي كده ليه؟
        ar: ما الأمر يا عزيزتي؟ لماذا تضحكين هكذا؟
        en: What's going on, dear? Why are you laughing like that?
        note:
          ar_eg: "كلمات: mekaten = كده (كراما)."
          ar: "مفردات: mekaten = هكذا (كراما)."
          en: "Words: mekaten = thus, like this (krama)."
      - speaker: Bu Harsono
        text: Nak Karim matur, "Kula sampun dhahar."
        ar_eg: كريم قال، «أنا اتعشّيت يا فندم».
        ar: قال كريم، «لقد تناولت طعامي يا سيدي».
        en: Karim said, "Kula sampun dhahar."
        note:
          ar_eg: "كلمات: matur = يقول / يعرض على حد كبير (krama andhap)."
          ar: "مفردات: matur = يقول / يعرض على الكبير (krama andhap)."
          en: "Words: matur = say, tell, report to an elder (krama andhap) = berkata kepada (yang dihormati)."
      - speaker: Pak Harsono
        text: Oh, Nak. Dhahar punika krama inggil. Namung kangge tiyang sanes ingkang dipunkurmati. Kangge awak piyambak, "nedha".
        ar_eg: آه يا ابني. «دهاهار» دي كراما إنجيل. بتتقال بس لحدّ تاني بتحترمه. لنفسك قول «نيدا».
        ar: آه يا بنيّ. «ذهاهار» كراما إنغيل. تقال فقط لغيرك ممّن تحترم. وعن نفسك قل «نيدا».
        en: Oh, my boy. Dhahar is krama inggil. It's only for other people you respect. For yourself, say "nedha".
        note:
          ar_eg: القاعدة الذهبية - كراما إنجيل عمرها ما تتقال على نفسك. «Kula dhahar» زي ما تقول بالمصري «أنا سيادتي اتعشّيت». ولحدّ كبير - Panjenengan sampun dhahar؟
          ar: القاعدة الذهبية - لا تُقال الكراما إنغيل عن نفسك أبدًا. فـ«Kula dhahar» كأن تقول «تناولت سيادتي العشاء». وللكبير - Panjenengan sampun dhahar؟
          en: The golden rule - never use krama inggil about yourself. "Kula dhahar" is like saying "My Excellency has dined". For an elder - Panjenengan sampun dhahar?
      - speaker: Karim
        text: Ngapunten, Pak! Kula sampun nedha. Panjenengan sampun dhahar?
        ar_eg: لا مؤاخذة يا باك! أنا كلت. وحضرتك اتعشّيت؟
        ar: عذرًا يا باك! لقد أكلت. وهل تناولت طعامك يا سيدي؟
        en: Sorry, Pak! I have eaten. Have you dined, sir?
        note:
          ar_eg: "كلمات: ngapunten = آسف / لا مؤاخذة (كراما يومي)."
          ar: "مفردات: ngapunten = عفوًا / آسف (كراما يومية)."
          en: "Words: ngapunten = sorry, excuse me (everyday krama) = maaf."
      - speaker: Pak Harsono
        text: Lha, sampun leres! Dereng, Nak. Mangga sareng-sareng.
        ar_eg: أهو كده صحّ! لسه يا ابني. يلّا ناكل مع بعض.
        ar: هكذا صحيح! ليس بعد يا بنيّ. هيّا نأكل معًا.
        en: Now that's right! Not yet, my boy. Let's eat together.
        note:
          ar_eg: "كلمات: lha = طب، أهو، ما (للاستغراب)."
          ar: "مفردات: lha = حسنًا، ها (للتنبيه والتعجب)."
          en: "Words: lha = well, so, see (surprise or emphasis)."
      - speaker: Narrator
        text: Sakwise mangan, Pak Harsono arep sare. Karim matur, "Sugeng sare, Pak."
        ar_eg: بعد العشا، باك هارسونو رايح ينام. كريم بيقول، «تصبح على خير يا باك».
        ar: بعد العشاء يتوجّه باك هارسونو إلى النوم. يقول كريم، «تصبح على خير يا باك».
        en: After dinner, Pak Harsono goes to bed. Karim says, "Sleep well, Pak."
        note:
          ar_eg: sare = ينام (كراما إنجيل)، وعلى نفسك تقول tilem. وكمان tindak = يروح، ngunjuk = يشرب، ngendika = يقول.
          ar: sare = ينام (كراما إنغيل)، وعن نفسك تقول tilem. وكذلك tindak = يذهب، وngunjuk = يشرب، وngendika = يقول.
          en: sare = sleep (krama inggil); for yourself, tilem. Also tindak = go, ngunjuk = drink, ngendika = say.
new_words:
  - word: nedha
    pos: verb
    ar_eg: ياكل (كراما، لنفسك)
    ar: يأكل (كراما، عن نفسك)
    en: eat (krama, for yourself)
  - word: rawuh
    pos: verb
    ar_eg: يوصل (للكبير)
    ar: يصل (للكبير)
    en: arrive (honorific)
  - word: kondur
    pos: verb
    ar_eg: يرجع البيت (للكبير)
    ar: يعود إلى البيت (للكبير)
    en: go home (honorific)
  - word: sare
    pos: verb
    ar_eg: ينام (للكبير)
    ar: ينام (للكبير)
    en: sleep (honorific)
  - word: tindak
    pos: verb
    ar_eg: يروح (للكبير)
    ar: يذهب (للكبير)
    en: go (honorific)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: بو هارسونو ضحكت ليه؟
      ar: لماذا ضحكت بو هارسونو؟
      en: Why did Bu Harsono laugh?
    options: ["Karim used krama inggil about himself.", "Karim spoke Arabic.", "Karim forgot the letter."]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Kula sampun ___.
    meaning:
      ar_eg: أنا كلت (كراما، على نفسي).
      ar: لقد أكلت (كراما، عن نفسي).
      en: I have eaten (krama, about myself).
    answers: [nedha]
    options: ["nedha", "dhahar", "mangan"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: تقول إيه لراجل كبير رايح ينام؟
      ar: ماذا تقول لرجل مسنّ ذاهب إلى النوم؟
      en: What do you say to an elder going to bed?
    options: ["Sugeng tilem.", "Sugeng sare.", "Turu kana."]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Panjenengan sampun dhahar?
    answers_meaning:
      ar_eg: ["حضرتك كلت؟", "حضرتك اتعشّيت؟"]
      ar: ["هل تناولت طعامك يا سيدي؟", "هل أكلت يا سيدي؟"]
      en: ["Have you eaten, sir?", "Have you dined?"]
next:
  ar_eg: في شارع ماليوبورو، كريم بيقابل ماس ديماس، طالب جامعة، اللي بياخده يزور جدّته مباه بوتري. بس إزاي تسأل ست كبيرة عن اسمها... من غير كلمة «اسم»؟
  ar: في شارع ماليوبورو يلتقي كريم بماس ديماس، الطالب الجامعيّ، الذي يأخذه لزيارة جدّته مباه بوتري. لكن كيف تسأل امرأة مسنّة عن اسمها... من دون كلمة «اسم»؟
  en: On Malioboro street, Karim meets Mas Dimas, a university student who takes him to visit his grandmother, Mbah Putri. But how do you ask an old lady her name... without the word for "name"?
review:
  status: draft
  verified: false
  notes: The "kula dhahar" mistake is the j4.u01 culture note. The narrator speaks ngoko but uses sare for Pak Harsono and matur (humble) for Karim. Check "ngampet ngguyu".
