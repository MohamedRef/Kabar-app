questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: بو راهايو طلبت من كريم يعمل إيه؟
      ar: ماذا طلبت بو راهايو من كريم؟
      en: What did Bu Rahayu ask Karim to do?
    options: ["nyapu latar", "tuku gula", "nyirami kembang"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Latare ___, ya.
    meaning:
      ar_eg: امسح الحوش، ماشي.
      ar: اكنس الفناء، حسنًا.
      en: Sweep the yard, okay.
    answers: [sapunen]
    options: ["sapunen", "sapu", "nyapu"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه بو راهايو قالت إن «enteni» لوحدها ناشفة؟
      ar: لماذا قالت بو راهايو إنّ «enteni» وحدها جافّة؟
      en: Why did Bu Rahayu say a bare "enteni" was rude?
    options: ["It needs ya or nggih to soften it.", "It's the wrong verb.", "It's Indonesian, not Javanese."]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Saben esuk aku tangi jam papat.
    answers_meaning:
      ar_eg: ["كل يوم الصبح بصحى الساعة أربعة.", "بصحى كل يوم الساعة أربعة الصبح."]
      ar: ["كلّ صباح أستيقظ في الرابعة."]
      en: ["Every morning I get up at four.", "I wake up at four every morning."]
next:
  ar_eg: يوم أخير في الريف - بايو بياخد كريم القلعة الهولندية القديمة في نجاوي. «Dolan-dolan» يعني إيه؟ ومين اللي بيستنّى كريم في سولو؟
  ar: يوم أخير في الريف - يأخذ بايو كريمًا إلى القلعة الهولندية القديمة في نغاوي. ما معنى «Dolan-dolan»؟ ومن ينتظر كريمًا في سولو؟
  en: One last day in the countryside - Bayu takes Karim to the old Dutch fort in Ngawi. What does "dolan-dolan" mean? And who's waiting for Karim in Solo?
review:
  status: draft
  verified: false
  notes: Check command forms tangia, sapunen, sirami, tukokna, enteni against jv.imperative.ngoko. Sarangan sits on Mount Lawu's slopes; satay there is a known treat.
