series: sinetron
episode: 82
language: jv
level: j2
unlock_after: j2.u05
title:
  target: Tukokna gula, ya!
  ar_eg: هاتلي سكّر، ماشي!
  ar: اشترِ لي سكّرًا، حسنًا!
  en: Get me some sugar, okay!
summary:
  ar_eg: الساعة خمسة الصبح، بو راهايو بتشغّل البيت كله بالأوامر - صحّي! امسح! هاتلي! استنّى! كريم بيتعلّم إن الأمر الجاوي من غير «ya» بيبقى ناشف. وبعدين يوم إجازة على بحيرة سارانجان مع بايو، والكلام عن «كل يوم بنعمل إيه».
  ar: في الخامسة صباحًا تدير بو راهايو البيت كلّه بالأوامر - استيقظ! اكنس! اشترِ لي! انتظر! ويتعلّم كريم أنّ الأمر الجاويّ من دون «ya» يبدو جافًّا. ثمّ يوم عطلة على بحيرة سارانغان مع بايو، وحديث عن «ماذا نفعل كلّ يوم».
  en: Five in the morning, and Bu Rahayu runs the whole house on orders - get up! sweep! buy me! wait! Karim learns that a Javanese command without "ya" sounds harsh. Then a day off at Lake Sarangan with Bayu, talking about what they do every day.
cast: [Karim, Bu Rahayu, Bayu]
scenes:
  - setting:
      ar_eg: بيت پاك بودي، الفجر. الديك بيصيح، وبو راهايو واقفة في المطبخ بالمقشّة.
      ar: بيت باك بودي، عند الفجر. يصيح الديك، وبو راهايو واقفة في المطبخ تحمل المكنسة.
      en: Pak Budi's house at dawn. The rooster crows, and Bu Rahayu stands in the kitchen holding a broom.
    lines:
      - speaker: Bu Rahayu
        text: Bayu! Tangia! Wis jam lima.
        ar_eg: يا بايو! اصحى! الساعة بقت خمسة.
        ar: يا بايو! استيقظ! صارت الساعة الخامسة.
        en: Bayu! Get up! It's five o'clock.
        note:
          ar_eg: tangi = يصحى، وtangia = «اصحى!». الأوامر الجاوي بتاخد في آخرها -a أو -en أو -na.
          ar: tangi = يستيقظ، وtangia = «استيقظ!». وتأخذ الأوامر الجاوية في آخرها -a أو -en أو -na.
          en: tangi = wake up, tangia = "get up!". Javanese commands end in -a, -en or -na.
      - speaker: Bayu
        text: Sedhela, Bu... limang menit maneh.
        ar_eg: لحظة يا ماما... خمس دقايق كمان.
        ar: لحظة يا أمّي... خمس دقائق أخرى.
        en: Just a sec, Mum... five more minutes.
      - speaker: Bu Rahayu
        text: Ora! Latare sapunen, ya. Kembange sirami.
        ar_eg: لأ! امسح الحوش، ماشي. واسقي الورد.
        ar: لا! اكنس الفناء، حسنًا. واسقِ الزهور.
        en: No! Sweep the yard, okay. And water the flowers.
        note:
          ar_eg: sapu = مقشّة، وsapunen = «امسحه!». وsiram = يرشّ ميّة، وsirami = «اسقيه!». الـ-i بتقول إن الفعل بيقع على حاجة أو مكان.
          ar: sapu = مكنسة، وsapunen = «اكنسه!». وsiram = يرشّ الماء، وsirami = «اسقِه!». واللاحقة -i تعني أنّ الفعل يقع على شيء أو مكان.
          en: sapu = broom, sapunen = "sweep it!". siram = pour water, sirami = "water it!". The -i means the action lands on a thing or place.
      - speaker: Karim
        text: Bu, aku isa mbantu?
        ar_eg: يا بو راهايو، أقدر أساعد؟
        ar: يا بو راهايو، هل أستطيع المساعدة؟
        en: Bu, can I help?
      - speaker: Bu Rahayu
        text: Wah, matur nuwun. Tukokna gula sekilo nang toko pojok, ya.
        ar_eg: يا سلام، متشكّرة. هاتلي كيلو سكّر من الدكّان اللي على الناصية، ماشي.
        ar: رائع، شكرًا. اشترِ لي كيلو سكّر من الدكّان عند الزاوية، حسنًا.
        en: Oh, thank you. Get me a kilo of sugar from the corner shop, okay.
        note:
          ar_eg: tuku = يشتري، وtukokna = «اشتريلي!» (اشتري عشاني). الـ-na أو -ke معناها «لحدّ تاني».
          ar: tuku = يشتري، وtukokna = «اشترِ لي!». واللاحقة -na أو -ke تعني «من أجل شخص آخر».
          en: tuku = buy, tukokna = "buy it for me!". The -na or -ke means "for someone".
      - speaker: Karim
        text: Siap, Bu! Enteni sedhela.
        ar_eg: حاضر يا بو راهايو! استنّي شويّة.
        ar: حاضر يا بو راهايو! انتظري قليلًا.
        en: Right away, Bu! Wait a moment.
      - speaker: Bu Rahayu
        text: Lho, Karim! Ngomong "enteni" kok ora nganggo "ya"? Kasar, lho.
        ar_eg: الله يا كريم! بتقول «استنّي» من غير «ya»؟ دي ناشفة على فكرة.
        ar: يا كريم! تقول «انتظري» من دون «ya»؟ هذا جافّ بالمناسبة.
        en: Hey, Karim! Saying "enteni" without "ya"? That's rude, you know.
      - speaker: Karim
        text: Ngapunten! Enteni sedhela, nggih.
        ar_eg: لا مؤاخذة! استنّي شويّة، لو سمحتي.
        ar: عذرًا! انتظري قليلًا، من فضلك.
        en: Sorry! Wait a moment, please.
        note:
          ar_eg: الأمر الجاوي من غير ya أو to (أو nggih لحدّ أكبر منك) بيبان زي الزعيق. ya بتحوّل «استنّى!» لـ«استنّى، ماشي؟».
          ar: يبدو الأمر الجاويّ من دون ya أو to (أو nggih مع من هو أكبر منك) كأنّه صراخ. وya تحوّل «انتظر!» إلى «انتظر، حسنًا؟».
          en: A Javanese command without ya or to (or nggih for an elder) sounds like barking. ya turns "Wait!" into "Wait, okay?".
  - setting:
      ar_eg: بحيرة سارانجان في ماجيتان، على سفح جبل لاوو. هوا ساقع، ومراكب صغيّرة. كريم وبايو بياكلوا ساتيه على الشطّ.
      ar: بحيرة سارانغان في ماغيتان، على سفح جبل لاوو. هواء بارد، وقوارب صغيرة. يأكل كريم وبايو الساتيه على الضفّة.
      en: Lake Sarangan in Magetan, on the slopes of Mount Lawu. Cool air and little boats. Karim and Bayu eat satay by the shore.
    lines:
      - speaker: Bayu
        text: Mas Karim, saben dina kowe ngapa wae?
        ar_eg: يا ماس كريم، انت كل يوم بتعمل إيه؟
        ar: يا ماس كريم، ماذا تفعل كلّ يوم؟
        en: Mas Karim, what do you do every day?
      - speaker: Karim
        text: Saben esuk aku tangi jam papat, sholat subuh, ngombe kopi, terus nulis.
        ar_eg: كل يوم الصبح بصحى الساعة أربعة، أصلّي الفجر، أشرب قهوة، وبعدين أكتب.
        ar: كلّ صباح أستيقظ في الرابعة، أصلّي الفجر، أشرب القهوة، ثمّ أكتب.
        en: Every morning I get up at four, pray the dawn prayer, drink coffee, then write.
      - speaker: Bayu
        text: Jam papat? Waduh. Aku saben esuk... turu.
        ar_eg: الساعة أربعة؟ يا ساتر. أنا كل يوم الصبح... نايم.
        ar: الرابعة؟ يا للهول. أنا كلّ صباح... نائم.
        en: Four? Yikes. Every morning I'm... asleep.
      - speaker: Karim
        text: Hahaha! Saiki aku ngerti, kok ibumu bengok "Tangia!"
        ar_eg: ههههه! دلوقتي فهمت ليه مامتك بتزعّق «اصحى!».
        ar: ههههه! الآن فهمت لماذا تصرخ أمّك «استيقظ!».
        en: Hahaha! Now I get why your mum shouts "Tangia!"
new_words:
