title:
  target: Arus yang Memberi Makan
  ar_eg: التيّار اللي بيأكّل البحر
  ar: التيّار الذي يُطعم البحر
  en: The Current That Feeds
summary:
  ar_eg: بايو طالع مع فريق علماء بحار لراجا أمبات، والعالِمة بو فرانسينا بتشرح قبل الغطس - الشعاب المرجانية عبارة عن حيوانات، والتيّار جاي من المحيط الهادي، والمرجان ممكن «يجيله سخونية». وبالليل بايو بيحكي للعيلة، وكريم بيقارن بالبحر الأحمر.
  ar: يرافق بايو فريقًا من علماء البحار إلى راجا أمبات، وتشرح العالِمة بو فرانسينا قبل الغوص أنّ المرجان حيوانات، وأنّ التيّار يأتي من المحيط الهادئ، وأنّ المرجان قد «يُصاب بالحمّى». وفي المساء يحكي بايو للعائلة، ويقارن كريم بالبحر الأحمر.
  en: Bayu heads to Raja Ampat with a team of marine scientists, and Bu Fransina explains before the dive - corals are animals, the current comes from the Pacific, and coral can "run a fever". That night Bayu tells the family, and Karim compares it with the Red Sea.
cast: [Bu Fransina, Bayu, Kak Nella, Pak Budi, Sari, Karim, Bu Rahayu]
scenes:
  - setting:
      ar_eg: راجا أمبات، الساعة ٧ الصبح. لانش سريع بتاع فريق البحث واقف فوق مية صافية لدرجة إن القاع باين. بو فرانسينا، عالمة بحار من مانوكواري، واقفة قدّام الفريق. وكاك نيلا، المصوّرة اللي بتشتغل مع بايو في الجرنال، شايلة الكاميرا.
      ar: راجا أمبات، السابعة صباحًا. قارب الفريق البحثي السريع متوقّف فوق ماء صافٍ يبدو قاعه. تقف بو فرانسينا، عالمة البحار القادمة من مانوكواري، أمام الفريق، وتحمل كاك نيلا، المصوّرة التي تعمل مع بايو في الصحيفة، الكاميرا.
      en: Raja Ampat, 7 a.m. The research team's speedboat sits over water so clear the seabed shows. Bu Fransina, a marine scientist from Manokwari, faces the team. Kak Nella, the photographer Bayu works with at the paper, has the camera.
    lines:
      - speaker: Narrator
        text: Raja Ampat, pukul tujuh pagi. Perahu cepat tim peneliti berhenti di atas air yang begitu jernih sehingga dasar lautnya kelihatan.
        ar_eg: راجا أمبات، الساعة سبعة الصبح. لانش فريق الباحثين وقف فوق مية صافية أوي لدرجة إن قاع البحر باين.
        ar: راجا أمبات، السابعة صباحًا. توقّف قارب الباحثين السريع فوق ماء بالغ الصفاء حتى بدا قاع البحر.
        en: Raja Ampat, seven in the morning. The research team's speedboat stops over water so clear that the seabed is visible.
      - speaker: Bu Fransina
        text: Baik, Bapak-Ibu sekalian. Sebelum turun ke air, izinkan saya menjelaskan secara singkat apa yang akan kita amati hari ini.
        ar_eg: طيب يا جماعة. قبل ما ننزل المية، اسمحولي أشرح باختصار احنا هنراقب إيه النهارده.
        ar: حسنًا أيّها السادة والسيّدات. قبل النزول إلى الماء، اسمحوا لي أن أشرح باختصار ما سنرصده اليوم.
        en: All right, everyone. Before we go into the water, allow me to explain briefly what we'll be observing today.
        note:
          ar_eg: تعبيرات العرض الرسمي (presentasi) - izinkan saya menjelaskan (اسمحولي أشرح)، pertama-tama (أولًا)، selanjutnya (بعد كده)، terakhir (وأخيرًا)، sebagai kesimpulan (الخلاصة)، demikian yang dapat saya sampaikan (ده كل اللي عندي). خلّي بالك منهم في الحلقة كلها.
          ar: من عبارات العرض الرسمي (presentasi) - izinkan saya menjelaskan (اسمحوا لي أن أشرح)، pertama-tama (أوّلًا)، selanjutnya (بعد ذلك)، terakhir (أخيرًا)، sebagai kesimpulan (خلاصة القول)، demikian yang dapat saya sampaikan (هذا ما لديّ). تتبّعها في الحلقة كلّها.
          en: 'Presentation phrases: izinkan saya menjelaskan (allow me to explain), pertama-tama (first of all), selanjutnya (next), terakhir (finally), sebagai kesimpulan (to conclude), demikian yang dapat saya sampaikan (that is all I have to say). Watch for them throughout.'
      - speaker: Bu Fransina
        text: Pertama-tama, Raja Ampat terletak di jantung Segitiga Terumbu Karang, kawasan laut yang membentang dari Indonesia sampai Kepulauan Solomon. Di sini tercatat ratusan jenis karang dan lebih dari seribu jenis ikan karang.
        ar_eg: أولًا، راجا أمبات في قلب «مثلث الشعاب المرجانية»، منطقة بحرية ممتدّة من إندونيسيا لحد جزر سليمان. هنا متسجّل مئات الأنواع من المرجان وأكتر من ألف نوع من سمك الشعاب.
        ar: أوّلًا، تقع راجا أمبات في قلب «مثلّث الشعاب المرجانية»، وهو نطاق بحري يمتدّ من إندونيسيا إلى جزر سليمان. وقد سُجّلت هنا مئات الأنواع من المرجان وأكثر من ألف نوع من أسماك الشعاب.
        en: First of all, Raja Ampat lies at the heart of the Coral Triangle, a sea region stretching from Indonesia to the Solomon Islands. Hundreds of coral species and over a thousand species of reef fish have been recorded here.
        note:
          ar_eg: jenis = نوع، ratusan = مئات، seribu = ألف. مثلث الشعاب المرجانية (Segitiga Terumbu Karang) بيضمّ ست دول - إندونيسيا، ماليزيا، الفلبين، بابوا غينيا الجديدة، تيمور الشرقية، وجزر سليمان. وراجا أمبات من أغنى أماكن في العالم في التنوّع البحري.
          ar: jenis = نوع، ratusan = مئات، seribu = ألف. يضمّ مثلّث الشعاب المرجانية (Segitiga Terumbu Karang) ست دول - إندونيسيا وماليزيا والفلبين وبابوا غينيا الجديدة وتيمور الشرقية وجزر سليمان. وراجا أمبات من أغنى بقاع الأرض تنوّعًا بحريًّا.
          en: jenis = kind, species; ratusan = hundreds; seribu = a thousand. The Coral Triangle spans six countries - Indonesia, Malaysia, the Philippines, Papua New Guinea, Timor-Leste and the Solomon Islands. Raja Ampat is among the richest places on Earth for marine life.
      - speaker: Bayu
        text: Maaf, Bu, saya ingin memastikan sesuatu. Karang itu sebenarnya batu atau tumbuhan?
        ar_eg: لا مؤاخذة يا دكتورة، عايز أتأكّد من حاجة. المرجان ده أصلًا حجر ولا نبات؟
        ar: عذرًا يا دكتورة، أودّ التأكّد من أمر. هل المرجان في الحقيقة حجر أم نبات؟
        en: Sorry, Bu, I'd like to check something. Is coral actually a rock or a plant?
      - speaker: Bu Fransina
        text: Pertanyaan yang bagus. Karang sebenarnya hewan, Mas Bayu. Setiap koloni terdiri atas ribuan hewan kecil yang disebut polip, dan di dalam tubuh polip hidup alga mungil yang memberinya warna dan makanan.
        ar_eg: سؤال حلو. المرجان في الحقيقة حيوان يا بايو. كل مستعمرة فيها آلاف الحيوانات الصغيرة اسمها «بوليب»، وجوّه جسم البوليب عايشة طحالب صغنّنة بتدّيه لونه وأكله.
        ar: سؤال جيّد. المرجان في الحقيقة حيوان يا ماس بايو. تتألّف كلّ مستعمرة من آلاف الحيوانات الدقيقة تُسمّى البوليبات، وفي جسم البوليب تعيش طحالب صغيرة تمنحه لونه وغذاءه.
        en: Good question. Coral is actually an animal, Mas Bayu. Each colony is made of thousands of tiny animals called polyps, and inside the polyps live tiny algae that give them their colour and food.
        note:
          ar_eg: hewan = حيوان، ribuan = آلاف، disebut = اسمه، mungil = صغنّن. بو فرانسينا بتشرح للفريق، فبتتكلّم بالفصحى.
          ar: hewan = حيوان، ribuan = آلاف، disebut = يُسمّى، mungil = دقيق. تشرح بو فرانسينا للفريق فتتكلّم بالفصحى.
          en: hewan = animal, ribuan = thousands, disebut = called, mungil = tiny. Bu Fransina is briefing the team, so she speaks standard Indonesian.
      - speaker: Kak Nella
        text: Jadi kalau kita injek karang, kita injek ribuan makhluk hidup. Inget itu ya, Pak Wartawan.
        ar_eg: يعني لو دُسنا على المرجان، بندوس على آلاف الكائنات الحيّة. افتكر الكلام ده يا أستاذ صحفي.
        ar: أي إنّنا إذا وطئنا المرجان وطئنا آلاف الكائنات الحيّة. تذكّر ذلك يا حضرة الصحفي.
        en: So if we step on coral, we're stepping on thousands of living things. Remember that, Mr Reporter.
        note:
          ar_eg: injek = menginjak (يدوس)، inget = ingat (افتكر) - كاك نيلا زميلة، فبتتكلّم عادي.
          ar: injek = menginjak (يطأ)، inget = ingat (تذكّر) - كاك نيلا زميلة فتتكلّم بالعامّية.
          en: injek = menginjak (step on), inget = ingat (remember) - Kak Nella is a colleague, so she talks casually. ribuan = thousands.
      - speaker: Bu Fransina
        text: Selanjutnya, perhatikan arusnya. Air dari Samudra Pasifik mengalir melewati kepulauan ini menuju Samudra Hindia. Arus itulah yang membawa makanan dan larva ikan ke terumbu karang.
        ar_eg: بعد كده، خدوا بالكم من التيّار. المية بتيجي من المحيط الهادي وبتعدّي بين الجزر دي رايحة للمحيط الهندي. والتيّار ده هو اللي بيجيب الأكل ويرقات السمك للشعاب.
        ar: بعد ذلك، لاحظوا التيّار. تتدفّق المياه من المحيط الهادئ عبر هذه الجزر نحو المحيط الهندي، وهذا التيّار هو ما يحمل الغذاء ويرقات الأسماك إلى الشعاب.
        en: Next, notice the current. Water from the Pacific Ocean flows through these islands towards the Indian Ocean. That current is what carries food and fish larvae to the reefs.
        note:
          ar_eg: ده اسمه Arus Lintas Indonesia (التيّار العابر لإندونيسيا) - الممرّ الاستوائي الوحيد بين محيطين، وبيأثّر على مناخ مناطق كتير.
          ar: يُسمّى Arus Lintas Indonesia (التيّار العابر لإندونيسيا)، وهو الممرّ المداري الوحيد بين محيطين، ويؤثّر في مناخ مناطق واسعة.
          en: This is the Arus Lintas Indonesia, the Indonesian Throughflow - the only tropical passage between two oceans, and it shapes climate far beyond Indonesia.
      - speaker: Bayu
        text: Pantes perahu kita goyang terus dari tadi. Arus juga yang bikin perut saya ikut goyang.
        ar_eg: عشان كده اللانش عمّال يتهزّ من الصبح. والتيّار ده برضه اللي مخلّي بطني بتتهزّ معاه.
        ar: لا عجب أنّ قاربنا يتمايل منذ الصباح. والتيّار أيضًا هو ما يجعل معدتي تتمايل معه.
        en: No wonder our boat's been rocking all morning. The current's what's making my stomach rock too.
        note:
          ar_eg: pantes = pantas (عشان كده بقى)، goyang = bergoyang (يتهزّ)، bikin = membuat (يخلّي).
          ar: pantes = pantas (لا عجب)، goyang = bergoyang (يتمايل)، bikin = membuat (يجعل).
          en: pantes = pantas (no wonder), goyang = bergoyang (rock), bikin = membuat (make).
      - speaker: Bu Fransina
        text: Terakhir, satu ancaman, yaitu pemutihan karang. Jika suhu laut terlalu tinggi terlalu lama, karang mengusir alganya dan berubah putih. Apabila suhunya segera turun, karang masih bisa pulih. Jika tidak, ia mati.
        ar_eg: وأخيرًا، فيه خطر واحد، هو ابيضاض المرجان. لو حرارة البحر عليت أوي لمدّة طويلة، المرجان بيطرد الطحالب ويبقى أبيض. لو الحرارة نزلت بسرعة، ممكن يرجع يخفّ. ولو منزلتش، بيموت.
        ar: وأخيرًا، ثمّة خطر واحد هو ابيضاض المرجان. إذا ارتفعت حرارة البحر أكثر من اللازم مدّة طويلة، طرد المرجان طحالبه وابيضّ. فإن انخفضت الحرارة سريعًا أمكنه التعافي، وإلّا مات.
        en: 'Finally, one threat: coral bleaching. If the sea stays too hot for too long, the coral expels its algae and turns white. If the temperature drops soon, the coral can still recover. If not, it dies.'
      - speaker: Kak Nella
        text: Mas Bayu, pelampungnya udah dipake? Jangan sampai besok kita harus nulis berita soal wartawan yang hanyut, lho.
        ar_eg: يا بايو، لبست الجاكيت بتاع النجاة؟ مش عايزين بكرة نكتب خبر عن صحفي التيّار شاله.
        ar: يا ماس بايو، هل لبست سترة النجاة؟ لا نريد أن نكتب غدًا خبرًا عن صحفي جرفه التيّار.
        en: Mas Bayu, have you got your life jacket on? We don't want to be writing a story tomorrow about a reporter who got swept away.
        note:
          ar_eg: udah = sudah، dipake = dipakai (اتلبس)، nulis = menulis، soal = عن. berita = خبر، hanyut = التيّار شاله.
          ar: udah = sudah، dipake = dipakai، nulis = menulis، soal = عن. berita = خبر، hanyut = جرفه التيّار.
          en: udah = sudah, dipake = dipakai (worn), nulis = menulis, soal = about. berita = news story, hanyut = swept away.
      - speaker: Bayu
        text: Udah, Kak. Dua lapis. Aku ini anak Madiun, kota yang nggak punya laut.
        ar_eg: لبسته يا كاك. طبقتين. أنا ابن ماديون، مدينة مالهاش بحر.
        ar: نعم يا كاك، طبقتان. فأنا ابن ماديون، المدينة التي لا بحر لها.
        en: Yes, Kak. Two of them. I'm a boy from Madiun, a city with no sea.
        note:
          ar_eg: udah = sudah، nggak = tidak. lapis = طبقة.
          ar: udah = sudah، nggak = tidak. lapis = طبقة.
          en: udah = sudah, nggak = tidak. lapis = layer.
      - speaker: Bu Fransina
        text: Sebagai kesimpulan, lihat, catat, jangan sentuh. Demikian yang dapat saya sampaikan. Selamat menyelam!
        ar_eg: الخلاصة - بصّوا، اكتبوا، ومتلمسوش. ده كل اللي عندي. غطس سعيد!
        ar: خلاصة القول - انظروا، دوّنوا، ولا تلمسوا. هذا ما لديّ. غوصًا ممتعًا!
        en: To conclude - look, take notes, don't touch. That is all I have to say. Happy diving!
  - setting:
      ar_eg: بالليل، في بيت ضيافة صغير في وايساي. شعر بايو لسه مبلول ومناخيره حمرا من الشمس. بيكلّم العيلة فيديو.
      ar: ليلًا، في نُزُل صغير في وايساي. شعر بايو ما زال مبلّلًا وأنفه محمرّ من الشمس. يتّصل بعائلته اتصالًا مرئيًّا.
      en: Evening, at a small homestay in Waisai. Bayu's hair is still wet and his nose is sunburnt. He video-calls his family.
    lines:
      - speaker: Pak Budi
        text: Le, gimana? Kamu lihat ikan apa aja?
        ar_eg: إيه يا ابني؟ شفت سمك إيه؟
        ar: كيف كان يا بنيّ؟ أيّ أسماك رأيت؟
        en: Well, son? What fish did you see?
        note:
          ar_eg: Le = يا ابني (جاوي). gimana = bagaimana، aja = saja.
          ar: Le = يا بنيّ (جاوية). gimana = bagaimana، aja = saja.
          en: Le = son (Javanese). gimana = bagaimana, aja = saja.
      - speaker: Bayu
        text: Banyak banget, Pak! Ikan badut, penyu, sama pari manta segede pintu warung kita. Tapi aku juga lihat karang yang putih kayak tulang.
        ar_eg: كتير أوي يا بابا! سمك المهرّج، وسلاحف بحرية، وسمكة مانتا قدّ باب الوارونج بتاعنا. بس شفت كمان مرجان أبيض زي العضم.
        ar: كثير جدًّا يا أبي! سمك المهرّج، وسلاحف بحرية، وشفنين المانتا بحجم باب الوارونغ. لكنّي رأيت أيضًا مرجانًا أبيض كالعظم.
        en: Loads, Dad! Clownfish, turtles, and a manta ray as big as the warung door. But I also saw coral as white as bone.
        note:
          ar_eg: banget = sekali، segede = sebesar (قدّ)، kayak = seperti، sama = dan. badut = مهرّج.
          ar: banget = sekali، segede = sebesar (بحجم)، kayak = seperti، sama = dan. badut = مهرّج.
          en: banget = sekali, segede = sebesar (as big as), kayak = seperti, sama = dan. badut = clown.
      - speaker: Sari
        text: Itu pemutihan karang, kan? Berarti karangnya udah mati?
        ar_eg: ده ابيضاض المرجان، صح؟ يعني المرجان مات خلاص؟
        ar: هذا ابيضاض المرجان، أليس كذلك؟ أيعني ذلك أنّ المرجان مات؟
        en: That's coral bleaching, isn't it? So the coral's dead?
        note:
          ar_eg: berarti = يعني، udah = sudah.
          ar: berarti = يعني، udah = sudah.
          en: berarti = that means, udah = sudah.
      - speaker: Bayu
        text: Belum tentu, Mbak. Kata Bu Fransina, karang yang memutih itu lagi "demam". Kalau lautnya dingin lagi, dia bisa sembuh. Para peneliti juga menduga arus yang kuat di sini bantu dinginin air.
        ar_eg: مش شرط يا أبلة. بو فرانسينا بتقول إن المرجان اللي ابيضّ ده «سخن». لو البحر برد، ممكن يخفّ. والباحثين كمان بيرجّحوا إن التيّار القوي هنا بيساعد يبرّد المية.
        ar: ليس بالضرورة يا أختي. تقول بو فرانسينا إنّ المرجان المبيضّ «محموم»، فإن برد البحر أمكنه أن يُشفى. ويرجّح الباحثون أيضًا أنّ التيّار القوي هنا يساعد على تبريد الماء.
        en: Not necessarily, Sis. Bu Fransina says bleached coral has a "fever". If the sea cools down, it can heal. The researchers also suspect the strong current here helps cool the water.
        note:
          ar_eg: lagi = sedang (دلوقتي)، dinginin = mendinginkan (يبرّد)، memutih = يبيضّ. النصوص العلمية بتتكلّم بحذر - belum tentu (مش شرط)، menduga (يرجّح، يخمّن)، diperkirakan (متوقّع)، kemungkinan besar (غالبًا). ده مش ضعف، ده أمانة علمية.
          ar: lagi = sedang (الآن)، dinginin = mendinginkan (يبرّد)، memutih = يبيضّ. تتكلّم النصوص العلمية بحذر - belum tentu (ليس بالضرورة)، menduga (يرجّح)، diperkirakan (يُقدَّر)، kemungkinan besar (على الأرجح). وليس هذا ضعفًا بل أمانة علمية.
          en: "lagi = sedang (right now), dinginin = mendinginkan (cool down), memutih = turn white. Science talk hedges: belum tentu (not necessarily), menduga (suspect), diperkirakan (it is estimated), kemungkinan besar (most likely). That's not weakness - it's scientific honesty."
      - speaker: Karim
        text: Di Laut Merah, dekat Hurghada, ada karang yang katanya tahan panas banget. Ilmuwan dari banyak negara datang buat neliti. Mungkin karang Mesir sama karang Papua harus saling belajar, ya.
        ar_eg: في البحر الأحمر، جنب الغردقة، فيه مرجان بيقولوا إنه بيستحمل الحرّ جدًا. علما من بلاد كتير بييجوا يدرسوه. يمكن مرجان مصر ومرجان بابوا لازم يتعلّموا من بعض.
        ar: في البحر الأحمر، قرب الغردقة، مرجان يُقال إنّه شديد التحمّل للحرارة، ويأتي علماء من بلدان كثيرة لدراسته. لعلّ على مرجان مصر ومرجان بابوا أن يتعلّم كلّ منهما من الآخر.
        en: In the Red Sea, near Hurghada, there's coral that's said to be very heat-tolerant. Scientists from lots of countries come to study it. Maybe Egyptian coral and Papuan coral should learn from each other.
        note:
          ar_eg: buat = untuk (عشان)، neliti = meneliti (يدرس)، saling = بعض. المرجان في شمال البحر الأحمر معروف بين العلما إنه بيستحمل درجات حرارة أعلى من مرجان أماكن تانية، وعشان كده بيدرسوه كأمل للشعاب في عالم بيسخن.
          ar: buat = untuk (لـ)، neliti = meneliti (يدرس)، saling = بعضهما. يُعرف مرجان شمال البحر الأحمر بين العلماء بتحمّله حرارةً أعلى من مرجان مناطق أخرى، ولذلك يُدرس أملًا للشعاب في عالم يزداد حرارة.
          en: buat = untuk (to, for), neliti = meneliti (study), saling = each other. Northern Red Sea corals are known among scientists for tolerating higher temperatures than corals elsewhere, so they're studied as a hope for reefs in a warming world.
      - speaker: Bu Rahayu
        text: Le, besok kamu nyelam lagi? Ibu nggak tenang.
        ar_eg: يا ابني، هتغطس تاني بكرة؟ أنا مش مطمّنة.
        ar: يا بنيّ، أستغوص غدًا مرّة أخرى؟ لستُ مطمئنّة.
        en: Son, are you diving again tomorrow? I'm worried.
        note:
          ar_eg: Le = يا ابني. nyelam = menyelam (يغطس)، nggak = tidak.
          ar: Le = يا بنيّ. nyelam = menyelam (يغوص)، nggak = tidak.
          en: Le = son. nyelam = menyelam (dive), nggak = tidak.
      - speaker: Bayu
        text: Tenang, Bu. Aku cuma snorkeling di permukaan kok. Kata Kak Nella, aku ngapung kayak kerupuk di kuah soto.
        ar_eg: اطمّني يا ماما. أنا بعمل سنوركل على الوشّ بس. وكاك نيلا بتقول إني عايم زي الكروبوك في الشوربة.
        ar: اطمئنّي يا أمي. أنا أسبح بالأنبوب على السطح فقط. وتقول كاك نيلا إنّي أطفو كالكروبوك في الحساء.
        en: Don't worry, Mum. I'm only snorkelling on the surface. Kak Nella says I float like a krupuk in soto broth.
        note:
          ar_eg: ngapung = mengapung (يعوم)، kayak = seperti. kerupuk = كروبوك، kuah soto = شوربة السوتو.
          ar: ngapung = mengapung (يطفو)، kayak = seperti. kerupuk = كروبوك، kuah soto = مرق السوتو.
          en: ngapung = mengapung (float), kayak = seperti. kerupuk = krupuk crackers, kuah soto = soto broth.
      - speaker: Pak Budi
        text: Itu pujian, Le. Kerupuk yang bagus emang nggak pernah tenggelam.
        ar_eg: ده مدح يا ابني. الكروبوك الكويس عمره ما بيغرق.
        ar: هذا مديح يا بنيّ. فالكروبوك الجيّد لا يغرق أبدًا.
        en: That's a compliment, son. A good krupuk never sinks.
        note:
          ar_eg: emang = memang (فعلًا). majas perbandingan (تشبيه) - mengapung seperti kerupuk (عايم زي الكروبوك). وباك بودي قلب التريقة لتشجيع - ده نوع من الفكاهة الجاوية اللطيفة.
          ar: emang = memang (حقًّا). هذا تشبيه (majas perbandingan) - mengapung seperti kerupuk (يطفو كالكروبوك). وقد قلب باك بودي المزاح تشجيعًا، وهذا من الدعابة الجاوية اللطيفة.
          en: emang = memang (indeed). kerupuk = krupuk. A simile (majas perbandingan) - mengapung seperti kerupuk, floating like a krupuk. Pak Budi turns the teasing into encouragement, a very Javanese kind of gentle humour.
      - speaker: Sari
        text: Terus, artikel pertamamu soal apa?
        ar_eg: طب أول مقالة ليك هتبقى عن إيه؟
        ar: إذن، عمّ ستكون مقالتك الأولى؟
        en: So what's your first article about?
        note:
          ar_eg: artikel = مقالة، terus = طب/وبعدين.
          ar: artikel = مقالة، terus = إذن.
          en: artikel = article, terus = so, then.
      - speaker: Bayu
        text: Soal arus. Judulnya "Arus yang Memberi Makan Raja Ampat". Redakturku, Pak Yafet, minta naskahnya udah ada di mejanya besok pagi.
        ar_eg: عن التيّار. عنوانها «التيّار اللي بيأكّل راجا أمبات». ومحرّري، باك يافت، عايز المقالة على مكتبه بكرة الصبح.
        ar: عن التيّار. عنوانها «التيّار الذي يُطعم راجا أمبات». ويريد محرّري، باك يافت، أن يجد النصّ على مكتبه صباح الغد.
        en: About the current. It's called "The Current That Feeds Raja Ampat". My editor, Pak Yafet, wants the copy on his desk tomorrow morning.
      - speaker: Karim
        text: Kalau gitu, tidur sana. Wartawan yang ngantuk nulis berita yang ngantuk juga.
        ar_eg: يبقى نام. الصحفي اللي نعسان بيكتب خبر نعسان زيّه.
        ar: إذن نَم. فالصحفي الناعس يكتب خبرًا ناعسًا مثله.
        en: Then get some sleep. A sleepy reporter writes sleepy news.
        note:
          ar_eg: gitu = begitu، ngantuk = mengantuk (نعسان)، nulis = menulis. berita = خبر.
          ar: gitu = begitu، ngantuk = mengantuk (ناعس)، nulis = menulis. berita = خبر.
          en: gitu = begitu, ngantuk = mengantuk (sleepy), nulis = menulis. berita = news.
