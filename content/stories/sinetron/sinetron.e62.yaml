questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب بو فرانسينا، المرجان في الحقيقة إيه؟
      ar: ما المرجان في الحقيقة بحسب بو فرانسينا؟
      en: According to Bu Fransina, what is coral really?
    options: ["batu", "tumbuhan", "hewan", "pasir"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Apabila suhunya segera turun, karang masih bisa ___.
    meaning:
      ar_eg: لو الحرارة نزلت بسرعة، المرجان ممكن يرجع يخفّ.
      ar: إن انخفضت الحرارة سريعًا أمكن للمرجان أن يتعافى.
      en: If the temperature drops soon, the coral can still recover.
    answers: [pulih]
    options: ["hanyut", "pulih", "memutih"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه باك بودي قال «ده مدح يا ابني»؟
      ar: لماذا قال باك بودي «هذا مديح يا بنيّ»؟
      en: Why does Pak Budi say "That's a compliment, son"?
    options: ["Karena dia lebih suka kerupuk daripada soto.", "Karena Kak Nella memang memuji kerupuk warung.", "Karena Bayu sudah pandai berenang.", "Karena dia ingin menenangkan Bu Rahayu dan menyemangati Bayu."]
    answer: 3
  - id: q04
    type: listen
    text: Air dari Samudra Pasifik mengalir melewati kepulauan ini menuju Samudra Hindia.
    question:
      ar_eg: التيّار رايح على فين؟
      ar: إلى أين يتّجه التيّار؟
      en: Where is the current heading?
    options: ["ke Samudra Pasifik", "ke Samudra Hindia", "ke Laut Merah", "ke Kepulauan Solomon"]
    answer: 1
    meaning:
      ar_eg: المية بتيجي من المحيط الهادي وبتعدّي بين الجزر دي رايحة للمحيط الهندي.
      ar: تتدفّق المياه من المحيط الهادئ عبر هذه الجزر نحو المحيط الهندي.
      en: Water from the Pacific Ocean flows through these islands towards the Indian Ocean.
  - id: q05
    type: translate
    direction: from_target
    source_text: Lihat, catat, jangan sentuh.
    answers_meaning:
      ar_eg: ["بصّ، اكتب، ومتلمسش.", "اتفرّج واكتب ومتلمسش.", "شوف وسجّل ومتلمسش حاجة."]
      ar: ["انظر، دوّن، ولا تلمس.", "شاهِد وسجّل ولا تلمس.", "انظروا ودوّنوا ولا تلمسوا."]
      en: ["Look, take notes, don't touch.", "Look, write it down, and don't touch.", "Watch, record, don't touch."]
next:
  ar_eg: باك يافت قرا مقالة التيّار وقال - «حلوة، بس مفيهاش صوت أهل البلد.» وبعتوا بايو لجزيرة أربوريك، يسمع من راجل كبير اسمه باباك ياكوب حكاية أصل راجا أمبات.
  ar: يقرأ باك يافت مقالة التيّار ويقول - «جيّدة، لكن ينقصها صوت أهل المكان.» فيُرسَل بايو إلى قرية أربوريك ليسمع من شيخ اسمه باباك ياكوب حكاية أصل راجا أمبات.
  en: Pak Yafet reads the current piece and says, "Good, but there's no local voice in it." So Bayu is sent to Arborek village to hear an elder, Bapak Yakob, tell how Raja Ampat began.
