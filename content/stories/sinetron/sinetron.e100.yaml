next:
  ar_eg: آخر يوم في جاوة الوسطى - المطر نازل على جامع ديماك القديم. مباك أيو بتغنّي لكريم «ليرـإيلير»، الأغنية اللي بيقولوا إن وليّ كتبها من خمسمية سنة.
  ar: آخر يوم في جاوة الوسطى - المطر يهطل على مسجد ديماك العتيق. تغنّي مباك أيو لكريم «لير-إيلير»، الأغنية التي يقال إنّ وليًّا كتبها منذ خمسمئة عام.
  en: The last day in Central Java - rain falls on the old Demak mosque. Mbak Ayu sings Karim "Lir-ilir", the song a saint is said to have written five hundred years ago.
review:
  status: draft
  verified: false
  notes: The Sunan Kudus cow tradition and the temple-like Menara Kudus are well known, but the cerkak is Mbak Ayu's retelling, framed as tradition. Soto kerbau is a Kudus speciality. Check narrative connectors and "panjenengane" in written ngoko.
