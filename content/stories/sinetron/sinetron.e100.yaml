title:
  target: Ing sawijining dina ing Kudus
  ar_eg: في يوم من الأيام في قدس
  ar: ذات يوم في قدس
  en: One day in Kudus
summary:
  ar_eg: قدّام منارة قدس اللي شكلها زي معبد قديم، مباك أيو بتحكي لكريم قصّة قصيّرة عن ليه أهل قدس، من زمان، بياكلوا لحمة جاموس مش لحمة بقر. كريم بيلاحظ كلمات الحكي - ing sawijining dina، banjur، sawise، dumadakan، pungkasane - وبيعيد الحكاية بنفسه على غدا سوتو الجاموس.
  ar: أمام مئذنة قدس التي تشبه معبدًا قديمًا، تحكي مباك أيو لكريم قصّة قصيرة عن سبب أكل أهل قدس، منذ القدم، لحم الجاموس لا لحم البقر. يلاحظ كريم كلمات السرد - ing sawijining dina وbanjur وsawise وdumadakan وpungkasane - ويعيد الحكاية بنفسه على غداء من سوتو الجاموس.
  en: Before the Kudus minaret, which looks like an old temple, Mbak Ayu tells Karim a short story about why Kudus people have long eaten buffalo rather than beef. Karim notices the storytelling words - ing sawijining dina, banjur, sawise, dumadakan, pungkasane - and retells it himself over a lunch of buffalo soto.
cast: [Karim, Mbak Ayu]
scenes:
  - setting:
      ar_eg: قدّام منارة قدس، الضهر. منارة من الطوب الأحمر شكلها زي المعابد الجاوي القديمة، وجنبها الجامع. مباك أيو فاتحة كرّاسة صغيّرة.
      ar: أمام مئذنة قدس، ظهرًا. مئذنة من الطوب الأحمر تشبه المعابد الجاوية القديمة، وبجانبها المسجد. تفتح مباك أيو دفترًا صغيرًا.
      en: In front of the Kudus minaret, midday. A red-brick minaret shaped like an old Javanese temple, with the mosque beside it. Mbak Ayu opens a small notebook.
    lines:
      - speaker: Karim
        text: Mbak, menara iki kok kaya candhi?
        ar_eg: يا مباك، المنارة دي شكلها زي المعبد ليه؟
        ar: يا مباك، لماذا تشبه هذه المئذنة المعبد؟
        en: Mbak, how come this minaret looks like a temple?
      - speaker: Mbak Ayu
        text: Merga iku, Mas, ana critane. Rungokna, aku nulis cerkak cilik.
        ar_eg: عشان كده يا ماس، فيه حكاية. اسمع، أنا كاتبة قصّة قصيّرة.
        ar: لهذا يا ماس، هناك حكاية. اسمع، كتبت قصّة قصيرة.
        en: That's why there's a story, Mas. Listen, I've written a little short story.
        note:
          ar_eg: cerkak (من cerita cekak) = قصّة قصيّرة بالجاوي. فيه مجلّات جاوي لسه بتنشر cerkak كل أسبوع.
          ar: cerkak (من cerita cekak) = قصّة جاوية قصيرة. وما زالت مجلّات جاوية تنشر cerkak كلّ أسبوع.
          en: cerkak (from cerita cekak) = a Javanese short story. Javanese magazines still publish one every week.
      - speaker: Mbak Ayu
        text: Ing sawijining dina, wong-wong ing Kudus isih akeh sing ngurmati sapi.
        ar_eg: في يوم من الأيام، كان لسه ناس كتير في قدس بيقدّسوا البقرة.
        ar: ذات يوم، كان كثير من الناس في قدس ما زالوا يوقّرون البقرة.
        en: Once upon a time, many people in Kudus still revered the cow.
        note:
          ar_eg: Ing sawijining dina = «في يوم من الأيام»، أول جملة في حكايات كتير، زي «كان يا ما كان».
          ar: Ing sawijining dina = «ذات يوم»، أوّل جملة في حكايات كثيرة، مثل «كان يا ما كان».
          en: Ing sawijining dina = "one day, once upon a time", the opening of many tales.
      - speaker: Mbak Ayu
        text: Nalika semana, Sunan Kudus mulang agama Islam. Sadurunge mulang, panjenengane mirengake tangga-tanggane.
        ar_eg: في الوقت ده، كان سونان قدس بيعلّم الإسلام. وقبل ما يعلّم، كان بيسمع جيرانه الأول.
        ar: في ذلك الوقت، كان سونان قدس يعلّم الإسلام. وقبل أن يعلّم، كان يستمع إلى جيرانه.
        en: At that time, Sunan Kudus was teaching Islam. Before teaching, he listened to his neighbours.
      - speaker: Mbak Ayu
        text: Sawise kuwi, panjenengane ngendika, "Aja nyembelih sapi ing kene, kanggo ngajeni tangga."
        ar_eg: وبعد كده، قال، «ماتدبحوش بقر هنا، احترامًا للجيران».
        ar: وبعد ذلك قال، «لا تذبحوا البقر هنا، احترامًا للجيران».
        en: After that, he said, "Don't slaughter cows here, out of respect for our neighbours."
        note:
          ar_eg: الحكاية الشعبية بتقول إن سونان قدس (واحد من الأولياء التسعة) طلب كده احترامًا للهندوس، وأهل قدس لحدّ النهارده كتير منهم بياكلوا جاموس بدل البقر. وشوف - panjenengane وngendika لأنه شخص محترم.
          ar: تقول الرواية الشعبية إنّ سونان قدس (أحد الأولياء التسعة) طلب ذلك احترامًا للهندوس، وما زال كثير من أهل قدس يأكلون الجاموس بدل البقر. ولاحظ panjenengane وngendika لأنّه شخص محترم.
          en: Tradition says Sunan Kudus (one of the nine saints, the Wali Sanga) asked this out of respect for Hindu neighbours, and many in Kudus still eat buffalo instead of beef. Note panjenengane and ngendika - he's a respected figure.
      - speaker: Mbak Ayu
        text: Pungkasane, wong-wong padha seneng. Lan menara iki dibangun kaya candhi, supaya kabeh rumangsa ing omahe dhewe.
        ar_eg: وفي الآخر، الناس كلها فرحت. والمنارة دي اتبنت زي المعبد، عشان الكل يحسّ إنه في بيته.
        ar: وفي النهاية فرح الناس جميعًا. وبُنيت هذه المئذنة على هيئة المعبد، ليشعر الجميع أنّهم في بيتهم.
        en: In the end, everyone was happy. And this minaret was built like a temple, so everyone would feel at home.
  - setting:
      ar_eg: وارونج سوتو في قدس. طبقين شوربة سوتو بلحمة جاموس. مباك أيو بتقفل الكرّاسة.
      ar: وارونغ سوتو في قدس. طبقان من حساء السوتو بلحم الجاموس. تغلق مباك أيو الدفتر.
      en: A soto warung in Kudus. Two bowls of soto with buffalo meat. Mbak Ayu closes her notebook.
    lines:
      - speaker: Mbak Ayu
        text: Saiki giliranmu. Critakna maneh nganggo tembungmu dhewe.
        ar_eg: دلوقتي دورك. احكيها تاني بكلامك انت.
        ar: الآن دورك. أعد حكايتها بكلماتك.
        en: Now it's your turn. Retell it in your own words.
      - speaker: Karim
        text: Ing sawijining dina, Sunan Kudus mirengake tangga. Banjur panjenengane ngendika, "Aja nyembelih sapi."
        ar_eg: في يوم من الأيام، سونان قدس سمع جيرانه. وبعدين قال، «ماتدبحوش بقر».
        ar: ذات يوم، استمع سونان قدس إلى جيرانه. ثمّ قال، «لا تذبحوا البقر».
        en: One day, Sunan Kudus listened to his neighbours. Then he said, "Don't slaughter cows."
      - speaker: Karim
        text: Dumadakan... wong Kudus mangan soto kebo! Pungkasane, aku uga mangan soto kebo.
        ar_eg: وفجأة... أهل قدس بقوا ياكلوا سوتو جاموس! وفي الآخر، أنا كمان باكل سوتو جاموس.
        ar: وفجأة... صار أهل قدس يأكلون سوتو الجاموس! وفي النهاية، أنا أيضًا آكل سوتو الجاموس.
        en: Suddenly... Kudus people were eating buffalo soto! And in the end, I'm eating buffalo soto too.
        note:
          ar_eg: كلمات الحكي - banjur وnuli (وبعدين)، sawise (بعد ما)، sadurunge (قبل ما)، nalika (لمّا / وقت)، dumadakan (فجأة)، pungkasane (في الآخر).
          ar: كلمات السرد - banjur وnuli (ثمّ)، sawise (بعد أن)، sadurunge (قبل أن)، nalika (حين)، dumadakan (فجأة)، pungkasane (في النهاية).
          en: Story words - banjur and nuli (then), sawise (after), sadurunge (before), nalika (when), dumadakan (suddenly), pungkasane (in the end).
      - speaker: Mbak Ayu
        text: Hahaha! "Dumadakan" ora pas, Mas. Nanging pungkasane... apik!
        ar_eg: ههههه! «فجأة» مش في محلّها يا ماس. بس «في الآخر»... حلوة!
        ar: ههههه! «فجأة» ليست في محلّها يا ماس. لكن «في النهاية»... جميلة!
        en: Hahaha! "Suddenly" doesn't quite fit, Mas. But your ending... lovely!
