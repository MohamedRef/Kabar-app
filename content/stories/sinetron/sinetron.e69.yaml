next:
  ar_eg: الحلقة الأخيرة. بايو بيقدّم تقريره النهائي قدّام لجنة في جاكرتا... وبعدها، أخيرًا، العيلة كلها طايرة على القاهرة. والأوضة اللي عند الحاجّة فاطمة، اللي فضلت فاضية من زمان، مستنياهم.
  ar: الحلقة الأخيرة. يقدّم بايو تقريره النهائي أمام لجنة في جاكرتا... ثمّ، أخيرًا، تطير العائلة كلّها إلى القاهرة. والغرفة في بيت الحاجّة فاطمة، التي ظلّت شاغرة طويلًا، تنتظرهم.
  en: The final episode. Bayu presents his final report to a panel in Jakarta... and then, at last, the whole family flies to Cairo. The room at Hagga Fatma's, empty for so long, is waiting for them.
