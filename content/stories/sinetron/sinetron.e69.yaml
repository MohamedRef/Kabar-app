title:
  target: Bagai Aur dengan Tebing
  ar_eg: زي الغاب والجُرف
  ar: كالخيزران والجُرف
  en: Like Bamboo and Riverbank
summary:
  ar_eg: ليلة الكريسماس في سينتاني جنب جايابورا. بايو بيساعد ماما يوليانا تجهّز لضيوف الكريسماس، وجارها المسلم باك دارمان جايب تلج وناوي يحرس الكنيسة بالليل مع شباب الجامع - زي ما شباب الكنيسة حرسوا صلاة العيد. وتاني يوم العيلة بتتكلّم عن الجيران في ماديون والقاهرة كمان.
  ar: ليلة عيد الميلاد في سينتاني قرب جايابورا. يساعد بايو ماما يوليانا في الاستعداد لضيوف الميلاد، وجارها المسلم باك دارمان يحمل الثلج وينوي حراسة الكنيسة ليلًا مع شباب المسجد - كما حرس شباب الكنيسة صلاة العيد. وفي الصباح تتأمّل العائلة حال الجيران في ماديون والقاهرة أيضًا.
  en: Christmas Eve in Sentani, near Jayapura. Bayu helps Mama Yuliana get ready for her Christmas guests, while her Muslim neighbour Pak Darman brings ice and plans to help keep watch at the church with the mosque youth - just as the church youth kept watch over the Eid prayer. Next morning, the family reflects on neighbours in Madiun and Cairo too.
cast: [Mama Yuliana, Bayu, Pak Darman, Bu Rahayu, Pak Budi, Hagga Fatma, Sari, Karim]
scenes:
  - setting:
      ar_eg: سينتاني، ٢٤ ديسمبر، بعد الضهر. بحيرة سينتاني بتلمع تحت تلال خضرا. في حوش بيت ماما يوليانا، كراسي بلاستيك متصفّفة لضيوف الكريسماس.
      ar: سينتاني، الرابع والعشرون من ديسمبر، بعد الظهر. تتلألأ بحيرة سينتاني تحت تلال خضراء. وفي باحة بيت ماما يوليانا كراسٍ بلاستيكية مصفوفة لضيوف عيد الميلاد.
      en: Sentani, 24 December, afternoon. Lake Sentani glitters below green hills. In Mama Yuliana's yard, plastic chairs are lined up for Christmas guests.
    lines:
      - speaker: Narrator
        text: Sentani, 24 Desember. Danau Sentani berkilau di bawah bukit-bukit hijau. Di halaman rumah Mama Yuliana, kursi-kursi plastik disusun berbaris untuk tamu Natal.
        ar_eg: سينتاني، ٢٤ ديسمبر. بحيرة سينتاني بتلمع تحت التلال الخضرا. وفي حوش بيت ماما يوليانا، الكراسي البلاستيك متصفّفة صفوف لضيوف الكريسماس.
        ar: سينتاني، الرابع والعشرون من ديسمبر. تتلألأ بحيرة سينتاني تحت التلال الخضراء. وفي باحة بيت ماما يوليانا صُفّت الكراسي البلاستيكية لضيوف عيد الميلاد.
        en: Sentani, 24 December. Lake Sentani glitters beneath the green hills. In Mama Yuliana's yard, plastic chairs are set out in rows for Christmas guests.
      - speaker: Mama Yuliana
        text: Bayu, angkat kursi yang di sana juga, e. Sebentar lagi tamu dari gereja datang.
        ar_eg: يا بايو، شيل الكراسي اللي هناك كمان. شوية والضيوف جايين من الكنيسة.
        ar: يا بايو، احمل الكراسي التي هناك أيضًا. بعد قليل يصل الضيوف من الكنيسة.
        en: Bayu, bring those chairs over there too, eh. The guests from church will be here soon.
      - speaker: Bayu
        text: Siap, Mama. Ini udah rumah ketiga yang saya bantu hari ini. Rasanya kayak mau Lebaran di Madiun.
        ar_eg: حاضر يا ماما. ده تالت بيت أساعد فيه النهارده. الجوّ حاسس إنه زي قبل العيد في ماديون.
        ar: حاضر يا ماما. هذا ثالث بيت أساعد فيه اليوم. الأجواء تشبه ما قبل العيد في ماديون.
        en: Will do, Mama. This is the third house I've helped at today. It feels like the days before Lebaran in Madiun.
        note:
          ar_eg: udah = sudah، kayak = seperti. ketiga = التالت.
          ar: udah = sudah، kayak = seperti. ketiga = الثالث.
          en: udah = sudah, kayak = seperti. ketiga = third.
      - speaker: Pak Darman
        text: Mama Yuliana! Es batunya udah datang. Saya bawa tiga karung, cukup buat satu kampung.
        ar_eg: يا ماما يوليانا! التلج وصل. جبت تلات شكاير، يكفّوا قرية بحالها.
        ar: يا ماما يوليانا! وصل الثلج. أحضرتُ ثلاثة أكياس، تكفي قرية كاملة.
        en: Mama Yuliana! The ice is here. I've brought three sacks - enough for the whole village.
        note:
          ar_eg: udah = sudah، buat = untuk. karung = شوال.
          ar: udah = sudah، buat = untuk. karung = كيس كبير.
          en: udah = sudah, buat = untuk. karung = sack.
      - speaker: Mama Yuliana
        text: Pak Darman, makasih banyak. Tapi Bapak nggak usah repot-repot.
        ar_eg: يا باك دارمان، متشكّرة أوي. بس متتعبش نفسك كده.
        ar: يا باك دارمان، شكرًا جزيلًا. لكن لا داعي لأن تُتعب نفسك.
        en: Pak Darman, thank you so much. But you really needn't go to all this trouble.
        note:
          ar_eg: nggak usah = tidak usah (مالوش لزوم). repot-repot = تتعب نفسك.
          ar: nggak usah = tidak usah (لا داعي). repot-repot = تتكلّف.
          en: nggak usah = tidak usah (no need). repot-repot = go to any trouble.
      - speaker: Pak Darman
        text: Repot apa, Mama? Lebaran kemarin Mama yang mengirim ikan kuah kuning ke rumah kami. Kita ini bagai aur dengan tebing.
        ar_eg: تعب إيه يا ماما؟ العيد اللي فات انتي اللي بعتّي لنا السمك بالشوربة الصفرا. احنا زي الغاب والجُرف.
        ar: أيّ تعب يا ماما؟ في العيد الماضي أرسلتِ أنتِ السمك بالمرق الأصفر إلى بيتنا. نحن كالخيزران والجُرف.
        en: What trouble, Mama? Last Lebaran it was you who sent yellow fish soup to our house. We're like bamboo and the riverbank.
        note:
          ar_eg: repot = تعب، kuah = شوربة. peribahasa «bagai aur dengan tebing» - الغاب (aur) بيمسك تراب الجُرف من الانهيار، والجُرف بيسند الغاب. يعني ناس بتسند بعضها. زي ما بنقول «إيد لوحدها متصقّفش».
          ar: repot = عناء، kuah = مرق. المثل «bagai aur dengan tebing» - الخيزران (aur) يمسك تربة الجرف من الانهيار، والجرف يسند الخيزران، أي يسند بعضهم بعضًا. كقولنا «يد واحدة لا تصفّق».
          en: "repot = trouble, kuah = broth. The proverb bagai aur dengan tebing: bamboo (aur) holds the riverbank together, and the bank holds up the bamboo - people who support each other. Like \"one hand can't clap\"."
      - speaker: Bayu
        text: Pak Darman aslinya dari mana, Pak?
        ar_eg: حضرتك أصلك منين يا باك دارمان؟
        ar: من أين أصلك يا باك دارمان؟
        en: Where are you from originally, Pak Darman?
      - speaker: Pak Darman
        text: Bapak saya dari Bone, Sulawesi Selatan. Tapi saya lahir di sini dan besar di sini. Saya orang Bugis, tapi saya juga anak Sentani.
        ar_eg: أبويا من بوني في جنوب سولاويزي. بس أنا اتولدت هنا واتربّيت هنا. أنا بوجيسي، بس كمان ابن سينتاني.
        ar: أبي من بوني في جنوب سولاويسي. لكنّي وُلدت هنا ونشأت هنا. أنا بوغيسي، لكنّي أيضًا ابن سينتاني.
        en: My father came from Bone, in South Sulawesi. But I was born here and grew up here. I'm Bugis, but I'm also a son of Sentani.
        note:
          ar_eg: في بابوا عايشين ناس كتير أصلهم من سولاويزي (بوجيس، بوتون) وجاوة ومالوكو، أغلبهم مسلمين، جنب أهل بابوا اللي أغلبهم مسيحيين. والهوية هنا طبقات - تقدر تبقى بوجيسي وابن سينتاني في نفس الوقت.
          ar: يعيش في بابوا كثيرون أصولهم من سولاويسي (البوغيس والبوتون) وجاوة ومالوكو، وأغلبهم مسلمون، إلى جانب أهل بابوا وأغلبهم مسيحيون. والهويّة هنا طبقات - يمكن أن تكون بوغيسيًّا وابن سينتاني معًا.
          en: Papua is home to many people of Sulawesi (Bugis, Butonese), Javanese and Maluku origin, mostly Muslim, alongside Papuans, who are mostly Christian. Identity comes in layers - you can be Bugis and a son of Sentani at once.
      - speaker: Mama Yuliana
        text: Buat makan malam nanti, masakan buat tamu-tamu Muslim dimasak terpisah, Bayu. Pancinya juga baru. Pak Darman sendiri yang beli ayamnya.
        ar_eg: وعلى العشا بالليل يا بايو، أكل الضيوف المسلمين بيتطبخ لوحده. حتى الحلل جديدة. وباك دارمان بنفسه هو اللي اشترى الفراخ.
        ar: ولعشاء الليلة يا بايو، يُطهى طعام الضيوف المسلمين على حدة، وحتى القدور جديدة. وباك دارمان نفسه اشترى الدجاج.
        en: For dinner tonight, Bayu, the food for Muslim guests is cooked separately. Even the pots are new. Pak Darman bought the chicken himself.
        note:
          ar_eg: buat = untuk/bagi، beli = membeli. dimasak = بيتطبخ، terpisah = لوحده.
          ar: buat = untuk/bagi، beli = membeli. dimasak = يُطبخ، terpisah = على حدة.
          en: buat = untuk / bagi, beli = membeli. dimasak = cooked, terpisah = separately.
      - speaker: Pak Darman
        text: Dan nanti malam, anak saya dan teman-teman remaja masjid ikut menjaga parkir di gereja. Waktu salat Id, pemuda gereja yang menjaga masjid kami.
        ar_eg: وبالليل، ابني وصحابه من شباب الجامع هيساعدوا في تنظيم الركنة عند الكنيسة. ووقت صلاة العيد، شباب الكنيسة هم اللي حرسوا الجامع بتاعنا.
        ar: والليلة يشارك ابني ورفاقه من شباب المسجد في تنظيم المواقف عند الكنيسة. وفي صلاة العيد كان شباب الكنيسة هم من حرسوا مسجدنا.
        en: And tonight my son and his friends from the mosque youth group will help with parking at the church. At the Eid prayer, it was the church youth who watched over our mosque.
        note:
          ar_eg: pemuda = الشباب. في مدن إندونيسية كتير، شباب الجامع بيساعدوا في الأمن والتنظيم عند الكنايس ليلة الكريسماس، وشباب الكنيسة بيعملوا نفس الحاجة وقت صلاة العيد. حاجة عادية بس بتعني كتير.
          ar: pemuda = الشباب. في مدن إندونيسية كثيرة يساعد شباب المساجد في تأمين الكنائس وتنظيمها ليلة الميلاد، ويفعل شباب الكنائس الشيء نفسه في صلاة العيد. أمر مألوف لكنّه عميق الدلالة.
          en: pemuda = youth. In many Indonesian towns, mosque youth help with security and parking at churches on Christmas Eve, and church youth do the same at the Eid prayer. Ordinary, but it means a lot.
      - speaker: Bayu
        text: Boleh saya nulis soal ini, Pak? Orang di luar Papua perlu baca cerita kayak gini.
        ar_eg: ينفع أكتب عن ده يا باك؟ الناس برّه بابوا محتاجين يقروا حكايات زي دي.
        ar: هل لي أن أكتب عن هذا يا باك؟ يحتاج الناس خارج بابوا إلى قراءة حكايات كهذه.
        en: May I write about this, Pak? People outside Papua need to read stories like this.
        note:
          ar_eg: nulis = menulis، soal = tentang، baca = membaca، kayak gini = seperti ini.
          ar: nulis = menulis، soal = tentang، baca = membaca، kayak gini = seperti ini.
          en: nulis = menulis, soal = tentang, baca = membaca, kayak gini = seperti ini (like this).
      - speaker: Pak Darman
        text: Tulis aja. Tapi jangan tulis seolah-olah ini luar biasa. Di sini, ini biasa.
        ar_eg: اكتب. بس متكتبش كأنها حاجة خارقة. هنا، دي حاجة عادية.
        ar: اكتب. لكن لا تكتب كأنّه أمر خارق. هنا، هذا أمر عادي.
        en: Go ahead. But don't write it as if it's extraordinary. Here, it's ordinary.
        note:
          ar_eg: aja = saja. tulis = اكتب، seolah-olah = كأن.
          ar: aja = saja. tulis = اكتب، seolah-olah = كأنّ.
          en: aja = saja. tulis = write, seolah-olah = as if.
  - setting:
      ar_eg: صباح الكريسماس. بايو قاعد على رصيف خشب على البحيرة، وبيكلّم العيلة فيديو - ماديون والقاهرة في نفس المكالمة.
      ar: صباح عيد الميلاد. يجلس بايو على رصيف خشبي عند البحيرة ويتّصل بالعائلة اتصالًا مرئيًّا - ماديون والقاهرة في المكالمة نفسها.
      en: Christmas morning. Bayu sits on a wooden jetty by the lake and video-calls the family - Madiun and Cairo on the same call.
    lines:
      - speaker: Bayu
        text: Pak, Bu, semalam aku lihat sesuatu yang nggak bakal aku lupain. Pemuda masjid ngatur parkir di depan gereja, sementara di dalam orang-orang nyanyi lagu Natal.
        ar_eg: بابا، ماما، امبارح بالليل شفت حاجة عمري ما هنساها. شباب الجامع بينظّموا الركنة قدّام الكنيسة، وجوّه الناس بيغنّوا ترانيم الكريسماس.
        ar: أبي، أمي، رأيتُ البارحة شيئًا لن أنساه. شباب المسجد ينظّمون المواقف أمام الكنيسة، وفي الداخل يُنشد الناس تراتيل الميلاد.
        en: Dad, Mum, last night I saw something I'll never forget. The mosque youth were directing parking outside the church while inside people sang Christmas carols.
        note:
          ar_eg: nggak bakal = tidak akan، lupain = lupakan، ngatur = mengatur، nyanyi = menyanyi. semalam = امبارح بالليل، pemuda = شباب.
          ar: nggak bakal = tidak akan، lupain = lupakan، ngatur = mengatur، nyanyi = menyanyi. semalam = البارحة، pemuda = شباب.
          en: nggak bakal = tidak akan (will never), lupain = lupakan (forget), ngatur = mengatur (direct), nyanyi = menyanyi (sing). semalam = last night, pemuda = youth.
      - speaker: Bu Rahayu
        text: Masyaallah. Kayak di buku PPKn-mu dulu, Le. Bhinneka Tunggal Ika.
        ar_eg: ما شاء الله. زي اللي كان في كتاب التربية الوطنية بتاعك زمان يا ابني. «الوحدة في التنوّع».
        ar: ما شاء الله. كما في كتاب التربية الوطنية الذي كنت تدرسه يا بنيّ. «الوحدة في التنوّع».
        en: Masyaallah. Just like in your old civics textbook, son. Bhinneka Tunggal Ika.
        note:
          ar_eg: kayak = seperti. «Bhinneka Tunggal Ika» (مختلفين بس واحد) شعار إندونيسيا، مكتوب على شعار النسر «جارودا». الجملة بالجاوي القديم، من قصيدة «سوتاسوما» للشاعر «مبو تانتولار» من أيام مملكة ماجاباهيت في القرن ١٤. وPPKn هي مادّة التربية الوطنية في المدارس.
          ar: kayak = seperti. «Bhinneka Tunggal Ika» (مختلفون لكنّهم واحد) شعار إندونيسيا المكتوب على شعار النسر «غارودا». والعبارة بالجاوية القديمة، من قصيدة «سوتاسوما» للشاعر «مبو تانتولار» في عهد مملكة ماجاباهيت في القرن الرابع عشر. وPPKn مادّة التربية الوطنية في المدارس.
          en: kayak = seperti (like). Bhinneka Tunggal Ika ("diverse yet one") is Indonesia's motto, on the Garuda emblem. It's Old Javanese, from the poem Sutasoma by Mpu Tantular, Majapahit era, 14th century. PPKn is the school civics subject.
      - speaker: Bayu
        text: Bedanya, Bu, di buku itu cuma semboyan. Di sini aku lihat sendiri dia angkat kursi sama bawa es batu.
        ar_eg: الفرق يا ماما إن في الكتاب ده كان مجرّد شعار. هنا أنا شفته بعيني بيشيل كراسي وبيجيب تلج.
        ar: الفرق يا أمي أنّه في الكتاب كان مجرّد شعار. أمّا هنا فرأيته يحمل الكراسي ويُحضر الثلج.
        en: The difference is, Mum, in that book it was just a slogan. Here I saw it with my own eyes, lifting chairs and carrying ice.
        note:
          ar_eg: bedanya = الفرق، angkat = يشيل، sama = dan.
          ar: bedanya = الفرق، angkat = يحمل، sama = dan.
          en: bedanya = the difference is, angkat = lift, sama = dan (and).
      - speaker: Pak Budi
        text: Di Madiun juga ada, Le, walaupun nggak masuk berita. Setiap Natal, gereja di ujung jalan besar pesan nasi kotak dari warung kita. Kata pendetanya, pecel kita udah jadi menu Natal.
        ar_eg: في ماديون كمان فيه يا ابني، حتى لو مبيطلعش في الأخبار. كل كريسماس، الكنيسة اللي في آخر الشارع الكبير بتطلب علب أكل من الوارونج بتاعنا. والقسّيس بيقول إن البيتشيل بتاعنا بقى أكلة الكريسماس.
        ar: وفي ماديون أيضًا يا بنيّ، وإن لم يظهر في الأخبار. في كلّ عيد ميلاد تطلب الكنيسة التي في آخر الشارع الكبير علب طعام من الوارونغ. ويقول قسّها إنّ البيتشيل صار طبق الميلاد عندهم.
        en: We have it in Madiun too, son, even if it never makes the news. Every Christmas, the church at the end of the main road orders boxed meals from our warung. The pastor says our pecel has become their Christmas dish.
        note:
          ar_eg: nggak = tidak، pesan = memesan، udah = sudah. berita = أخبار، pendeta = قسّيس.
          ar: nggak = tidak، pesan = memesan، udah = sudah. berita = أخبار، pendeta = قسّ.
          en: nggak = tidak, pesan = memesan (order), udah = sudah. berita = news, pendeta = pastor.
      - speaker: Hagga Fatma
        text: Di Kairo juga, Bayu! Tetangga saya, Umm Mina, orang Kristen Koptik. Setiap Idulfitri dia mengirim kahk, dan setiap tanggal 7 Januari saya yang mengirim kue untuk Natalnya.
        ar_eg: وفي القاهرة كمان يا بايو! جارتي، أم مينا، قبطية. كل عيد فطر بتبعتلي كحك، وكل ٧ يناير أنا اللي ببعتلها حلويات لعيد الميلاد.
        ar: وفي القاهرة أيضًا يا بايو! جارتي أمّ مينا مسيحية قبطية. في كلّ عيد فطر ترسل إليّ الكعك، وفي السابع من يناير من كلّ عام أرسل أنا إليها الحلوى لعيد ميلادها.
        en: In Cairo too, Bayu! My neighbour, Umm Mina, is a Coptic Christian. Every Eid al-Fitr she sends me kahk, and every 7 January I'm the one sending cakes for her Christmas.
        note:
          ar_eg: kahk = كحك. الأقباط بيحتفلوا بعيد الميلاد يوم ٧ يناير، وهو أجازة رسمية في مصر. وصورة «الهلال مع الصليب» من ثورة ١٩١٩ لسه رمز للوحدة الوطنية.
          ar: kahk = الكعك. يحتفل الأقباط بعيد الميلاد في السابع من يناير، وهو عطلة رسمية في مصر. وما زال شعار «الهلال مع الصليب» من ثورة ١٩١٩ رمزًا للوحدة الوطنية.
          en: kahk = Egyptian Eid biscuits. Copts celebrate Christmas on 7 January, a public holiday in Egypt. The "crescent with the cross" image from the 1919 revolution is still a symbol of national unity.
      - speaker: Sari
        text: Jadi di Sentani, di Madiun, dan di Kairo, resepnya sama. Berat sama dipikul, ringan sama dijinjing.
        ar_eg: يعني في سينتاني وفي ماديون وفي القاهرة، الوصفة واحدة. التقيل نشيله سوا، والخفيف نشيله سوا.
        ar: إذن في سينتاني وماديون والقاهرة، الوصفة واحدة - الثقيل نحمله معًا، والخفيف نحمله معًا.
        en: So in Sentani, in Madiun and in Cairo, the recipe's the same. Heavy loads carried together, light ones too.
        note:
          ar_eg: «Berat sama dipikul, ringan sama dijinjing» - حرفيًا «التقيل نشيله على الكتف سوا، والخفيف نشيله في الإيد سوا»، يعني نتقاسم الحلو والمرّ.
          ar: «Berat sama dipikul, ringan sama dijinjing» - حرفيًّا «الثقيل نحمله على الكتف معًا، والخفيف نحمله باليد معًا»، أي نتقاسم السرّاء والضرّاء.
          en: 'Berat sama dipikul, ringan sama dijinjing - literally "the heavy we shoulder together, the light we carry together": sharing good times and bad.'
      - speaker: Bayu
        text: Tapi aku juga belajar, Mbak. Toleransi itu bukan berarti semua orang harus sama. Mama Yuliana tetep ke gereja, Pak Darman tetep ke masjid. Mereka beda, dan justru karena itu mereka saling jaga.
        ar_eg: بس أنا اتعلّمت كمان يا أبلة. التسامح مش معناه إن الناس كلها لازم تبقى زي بعض. ماما يوليانا بتروح الكنيسة، وباك دارمان بيروح الجامع. هم مختلفين، وبالذات عشان كده بيحموا بعض.
        ar: لكنّي تعلّمتُ أيضًا يا أختي أنّ التسامح لا يعني أن يكون الجميع متشابهين. ماما يوليانا تذهب إلى الكنيسة، وباك دارمان إلى المسجد. هما مختلفان، ولهذا بالذات يحمي كلّ منهما الآخر.
        en: But I learnt something else too, Sis. Tolerance doesn't mean everyone has to be the same. Mama Yuliana still goes to church, Pak Darman still goes to the mosque. They're different, and that's exactly why they look out for each other.
        note:
          ar_eg: tetep = tetap، beda = berbeda، saling jaga = saling menjaga (بيحموا بعض). berarti = معناه.
          ar: tetep = tetap، beda = berbeda، saling jaga = saling menjaga (يحمي بعضهم بعضًا). berarti = يعني.
          en: tetep = tetap (still), beda = berbeda (different), saling jaga = saling menjaga (look out for each other). berarti = mean.
      - speaker: Karim
        text: Itu bagian yang paling susah ditulis, Bayu. Jangan dibikin terlalu manis. Tulis apa adanya.
        ar_eg: ده أصعب جزء في الكتابة يا بايو. متخلّيهاش مسكّرة أوي. اكتبها زي ما هي.
        ar: هذا أصعب جزء في الكتابة يا بايو. لا تُفرط في تحليته. اكتبه كما هو.
        en: That's the hardest part to write, Bayu. Don't make it too sweet. Write it as it is.
        note:
          ar_eg: dibikin = dibuat، susah = sulit. tulis = اكتب.
          ar: dibikin = dibuat، susah = sulit. tulis = اكتب.
          en: dibikin = dibuat (made), susah = sulit (hard). tulis = write.
      - speaker: Bayu
        text: Pak Darman juga bilang gitu, Mas. "Jangan tulis seolah-olah ini luar biasa."
        ar_eg: باك دارمان قال كده برضه يا ماس. «متكتبش كأنها حاجة خارقة.»
        ar: وقال باك دارمان ذلك أيضًا يا ماس - «لا تكتب كأنّه أمر خارق.»
        en: Pak Darman said the same, Mas. "Don't write it as if it's extraordinary."
        note:
          ar_eg: gitu = begitu. tulis = تكتب، seolah-olah = كأن.
          ar: gitu = begitu. tulis = تكتب، seolah-olah = كأنّ.
          en: gitu = begitu. tulis = write, seolah-olah = as if.
      - speaker: Pak Budi
        text: Le, bentar lagi Ramadan. Bapak sama Ibu umrah dulu di akhir Ramadan, terus langsung terbang ke Kairo. Proyek K udah hampir lunas. Kita ketemu di sana, ya.
        ar_eg: يا ابني، رمضان قرّب. أنا وأمّك هنعمل عمرة الأول في آخر رمضان، وبعدها نطير على القاهرة على طول. مشروع ك قرّب يتسدّد. نتقابل هناك، ماشي؟
        ar: يا بنيّ، اقترب رمضان. سنؤدّي أنا وأمّك العمرة أوّلًا في آخر رمضان، ثمّ نطير مباشرة إلى القاهرة. أوشك مشروع ك أن يُسدَّد. نلتقي هناك، اتفقنا؟
        en: Son, Ramadan's nearly here. Your mum and I will do umrah first, at the end of Ramadan, then fly straight on to Cairo. Project K is nearly paid off. We'll meet you there, all right?
        note:
          ar_eg: Le = يا ابني. bentar = sebentar، udah = sudah، ketemu = bertemu. umrah = عمرة، proyek = مشروع، lunas = خالص.
          ar: Le = يا بنيّ. bentar = sebentar، udah = sudah، ketemu = bertemu. umrah = عمرة، proyek = مشروع، lunas = مسدَّد.
          en: Le = son. bentar = sebentar, udah = sudah, ketemu = bertemu (meet). umrah = umrah, proyek = project, lunas = paid off.
      - speaker: Bayu
        text: Siap, Pak. Mama Yuliana titip salam. Katanya, "Kalau ke Kairo, jangan lupa bawa pulang cerita untuk torang di Sentani."
        ar_eg: حاضر يا بابا. وماما يوليانا بتسلّم عليكم. وبتقول «لو رحتوا القاهرة، متنسوش تجيبوا حكايات لينا احنا في سينتاني.»
        ar: حاضر يا أبي. وماما يوليانا تبلغكم السلام، وتقول «إن ذهبتم إلى القاهرة فلا تنسوا أن تحملوا حكايات لنا في سينتاني.»
        en: Will do, Dad. Mama Yuliana sends her regards. She says, "If you go to Cairo, don't forget to bring back stories for us in Sentani."
        note:
          ar_eg: titip salam = بيسلّم عليكم، torang = kita.
          ar: titip salam = يبلّغكم السلام، torang = kita.
          en: titip salam = sends her regards, torang = kita (Papuan Malay).
