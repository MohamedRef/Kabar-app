questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الورق اللي بلغة أجنبية لازم يترجمه مين؟
      ar: من يجب أن يترجم الوثائق المحرّرة بلغة أجنبية؟
      en: Who must translate documents in a foreign language?
    options: ["Google Translate", "Pak Syamsul", "Bayu", "penerjemah tersumpah"]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Hak dan kedudukan isteri adalah ___ dengan hak dan kedudukan suami.
    meaning:
      ar_eg: حقوق الزوجة ومكانتها متوازنة مع حقوق الزوج ومكانته.
      ar: حقوق الزوجة ومكانتها متوازنة مع حقوق الزوج ومكانته.
      en: The rights and standing of the wife are equal to those of the husband.
    answers: [seimbang]
    options: ["berlainan", "seimbang", "tunduk"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: (استنتاج) باك بودي قصده إيه لما قال «انتي متوازنة شوية زيادة»؟
      ar: (استنتاج) ماذا قصد باك بودي بقوله «أنتِ متوازنة أكثر قليلًا»؟
      en: (Inference) What did Pak Budi mean by "you're slightly more equal"?
    options: ["Dia mengaku Bu Rahayu sebenarnya lebih berkuasa di rumah.", "Dia tidak paham Pasal 31.", "Dia ingin memegang uang belanja.", "Bu Rahayu lebih tinggi daripada dia."]
    answer: 0
  - id: q04
    type: listen
    text: Kalau akad dilaksanakan di kantor KUA pada jam kerja, tidak dipungut biaya. Kalau di luar kantor atau di luar jam kerja, biayanya enam ratus ribu rupiah.
    question:
      ar_eg: كتب الكتاب في البيت يوم السبت بيكلّف كام؟
      ar: كم يكلّف عقد القران في البيت يوم السبت؟
      en: How much does a marriage contract at home on a Saturday cost?
    options: ["gratis", "enam puluh ribu rupiah", "enam ratus ribu rupiah", "enam juta rupiah"]
    answer: 2
    meaning:
      ar_eg: لو كتب الكتاب في مكتب KUA في مواعيد الشغل، ببلاش. لو برّه المكتب أو برّه مواعيد الشغل، بستمية ألف روبية.
      ar: إذا عُقد القران في مكتب الشؤون الدينية خلال ساعات العمل فلا رسوم، وإذا عُقد خارجه أو خارج ساعات العمل فالرسوم ستمئة ألف روبية.
      en: At the KUA office in working hours there's no fee. Outside the office or outside working hours, it's six hundred thousand rupiah.
  - id: q05
    type: translate
    direction: from_target
    source_text: Dokumen berbahasa asing harus diterjemahkan oleh penerjemah tersumpah.
    answers_meaning:
      ar_eg: ["الورق اللي بلغة أجنبية لازم يترجمه مترجم محلّف.", "المستندات الأجنبية لازم تتترجم ترجمة معتمدة من مترجم محلّف.", "أي ورق بلغة أجنبية لازم مترجم محلّف يترجمه."]
      ar: ["يجب أن يترجم مترجم محلّف الوثائق المحرّرة بلغة أجنبية.", "الوثائق الأجنبية يجب أن تُترجم على يد مترجم محلّف.", "يلزم أن تُترجم المستندات بلغة أجنبية من قِبل مترجم محلّف."]
      en: ["Documents in a foreign language must be translated by a sworn translator.", "Foreign-language documents have to be translated by a sworn translator.", "A sworn translator must translate any documents in a foreign language."]
next:
  ar_eg: يوم الفرح. الأختام كلها خلصت، والكراسي متصفّفة، والسما... سودا. باك بودي بيبصّ للسحاب بقلق، وبو تيني بتقترح تجيب «باوانج هوجان». وبايو عنده تفسير علمي.
  ar: يوم العرس. اكتملت الأختام كلّها، وصُفّت الكراسي، والسماء... سوداء. يرمق باك بودي الغيوم بقلق، وتقترح بو تيني استدعاء «باوانغ هوجان». ولدى بايو تفسير علمي.
  en: The wedding day. Every stamp is done, the chairs are set out, and the sky is... black. Pak Budi eyes the clouds nervously, Bu Tini suggests calling a pawang hujan, and Bayu has a scientific explanation.
