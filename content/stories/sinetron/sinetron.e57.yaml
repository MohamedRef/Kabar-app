language: id
level: bipa6
unlock_after: bipa6.u07
title:
  target: Dalam Bahasa Manusia
  ar_eg: بلغة البني آدمين
  ar: بلغة البشر
  en: In Human Language
summary:
  ar_eg: ساري وكريم وباك بودي في مكتب KUA في ماديون. باك شمسول بيقرا مادّة من قانون الجواز بلغة قانونية طويلة، وبيطلب ورق كتير - ترجمة محلّفة، وتصديقات، وشهود. وبالليل بايو بيكتب للعيلة ملخّص «بلغة البني آدمين».
  ar: ساري وكريم وباك بودي في مكتب الشؤون الدينية بماديون. يقرأ باك شمسول مادّة من قانون الزواج بلغة قانونية طويلة، ويطلب أوراقًا كثيرة - ترجمة محلّفة وتصديقات وشهودًا. وفي المساء يكتب بايو للعائلة ملخّصًا «بلغة البشر».
  en: Sari, Karim and Pak Budi go to the KUA office in Madiun. Pak Syamsul reads out an article of the Marriage Law in long legal language and asks for a pile of papers - sworn translations, legalisation, witnesses. That night Bayu writes the family a summary "in human language".
cast: [Pak Syamsul, Pak Budi, Sari, Karim, Bayu, Mas Joko, Bu Rahayu]
scenes:
  - setting:
      ar_eg: مكتب KUA (مكتب الشؤون الدينية) في ماديون، الصبح. على مكتب باك شمسول ملفّ تخين فيه ورق كريم.
      ar: مكتب الشؤون الدينية (KUA) في ماديون، صباحًا. على مكتب باك شمسول ملفّ سميك فيه أوراق كريم.
      en: The KUA (Office of Religious Affairs) in Madiun, morning. On Pak Syamsul's desk is a thick folder of Karim's documents.
    lines:
      - speaker: Narrator
        text: Kantor Urusan Agama, Madiun. Di atas meja Pak Syamsul ada map tebal berisi dokumen Karim.
        ar_eg: مكتب الشؤون الدينية في ماديون. وعلى مكتب باك شمسول ملفّ تخين فيه ورق كريم.
        ar: مكتب الشؤون الدينية في ماديون. وعلى مكتب باك شمسول ملفّ سميك يضمّ وثائق كريم.
        en: The Office of Religious Affairs, Madiun. On Pak Syamsul's desk is a thick folder of Karim's documents.
      - speaker: Pak Syamsul
        text: Baik. Karena calon suami adalah warga negara asing, pernikahan ini disebut perkawinan campuran. Saya bacakan dasar hukumnya, ya.
        ar_eg: تمام. عشان العريس أجنبي، الجواز ده اسمه «زواج مختلط». هقرالكم الأساس القانوني بتاعه.
        ar: حسنًا. لمّا كان الخاطب أجنبيّ الجنسية، يُسمّى هذا الزواج «زواجًا مختلطًا». سأقرأ عليكم سنده القانوني.
        en: Right. Since the groom-to-be is a foreign national, this is called a mixed marriage. Let me read you the legal basis.
      - speaker: Pak Syamsul
        text: '"Pasal 57. Yang dimaksud dengan perkawinan campuran dalam Undang-undang ini ialah perkawinan antara dua orang yang di Indonesia tunduk pada hukum yang berlainan, karena perbedaan kewarganegaraan dan salah satu pihak berkewarganegaraan Indonesia."'
        ar_eg: «المادة ٥٧. المقصود بالزواج المختلط في القانون ده هو الجواز بين اتنين خاضعين في إندونيسيا لقوانين مختلفة، بسبب اختلاف الجنسية، ويكون واحد من الطرفين جنسيته إندونيسية.»
        ar: «المادة ٥٧. يُقصد بالزواج المختلط في هذا القانون الزواجُ بين شخصين يخضعان في إندونيسيا لقوانين مختلفة بسبب اختلاف الجنسية، على أن يكون أحد الطرفين إندونيسيّ الجنسية.»
        en: '"Article 57. Mixed marriage in this Law means a marriage between two persons who, in Indonesia, are subject to different laws because of a difference in nationality, one party being of Indonesian nationality."'
        note:
          ar_eg: دي المادة ٥٧ من قانون الجواز رقم ١ لسنة ١٩٧٤. لغة القوانين ليها تركيبات ثابتة - Yang dimaksud dengan... ialah (المقصود بـ... هو)، tunduk pada (خاضع لـ)، pihak (طرف). نفس إحساس «يُقصد بـ» في القوانين المصرية.
          ar: هذه المادة ٥٧ من قانون الزواج رقم ١ لسنة ١٩٧٤. وللغة القانون صيغ ثابتة - Yang dimaksud dengan... ialah (يُقصد بـ... كذا)، tunduk pada (يخضع لـ)، pihak (طرف)، كما في صياغة القوانين العربية.
          en: This is Article 57 of the Marriage Law, No. 1 of 1974. Legal Indonesian has fixed frames - Yang dimaksud dengan... ialah ("... means ..."), tunduk pada (subject to), pihak (party).
      - speaker: Pak Budi
        text: Maaf, Pak Syamsul. Kalimatnya panjang banget. Sampai di titik, saya sudah lupa awalnya.
        ar_eg: لا مؤاخذة يا باك شمسول. الجملة طويلة أوي. لما وصلت للنقطة كنت نسيت أوّلها.
        ar: عفوًا يا باك شمسول، الجملة طويلة جدًّا؛ حين بلغتُ نهايتها كنت قد نسيت أوّلها.
        en: Excuse me, Pak Syamsul. That sentence is very long. By the full stop, I'd forgotten how it began.
      - speaker: Sari
        text: Gampangnya gini, Pak. Kalau yang satu orang Indonesia, yang satu lagi orang asing, ya itu perkawinan campuran.
        ar_eg: معناها بسيط يا بابا. لو واحد إندونيسي والتاني أجنبي، يبقى ده جواز مختلط.
        ar: معناها بسيط يا أبي - إن كان أحدهما إندونيسيًّا والآخر أجنبيًّا فهذا زواج مختلط.
        en: It's simple, Dad. If one's Indonesian and the other is foreign, it's a mixed marriage.
        note:
          ar_eg: ساري بتترجم كلام القانون للغة الناس - gampangnya gini = ببساطة كده (gampang = سهل، gini = begini). وperkawinan campuran = جواز مختلط.
          ar: تنقل ساري لغة القانون إلى لغة الناس - gampangnya gini = ببساطة هكذا (gampang = سهل، وgini = begini). وperkawinan campuran = زواج مختلط.
          en: Sari turns legal language into people language - gampangnya gini = simply put (gampang = easy, gini = begini). perkawinan campuran = mixed marriage.
      - speaker: Pak Syamsul
        text: Betul, Mbak. Sekarang syaratnya. Calon suami wajib menyerahkan paspor, akta kelahiran, dan surat keterangan dari kedutaan negaranya bahwa ia boleh menikah.
        ar_eg: مظبوط يا مبَك. ودلوقتي الشروط. العريس لازم يقدّم الباسبور، وشهادة الميلاد، وجواب من سفارة بلده إنه ينفع يتجوّز.
        ar: صحيح يا مباك. والآن الشروط - يجب على الخاطب تقديم جواز السفر وشهادة الميلاد وإفادة من سفارة بلده بأنّه لا مانع من زواجه.
        en: Correct, Mbak. Now the requirements. The groom must submit his passport, birth certificate, and a letter from his country's embassy stating he's free to marry.
      - speaker: Karim
        text: Surat dari Kedutaan Mesir di Jakarta sudah ada, Pak. Ini aslinya.
        ar_eg: جواب السفارة المصرية في جاكرتا جاهز يا باك. ده الأصل.
        ar: إفادة السفارة المصرية في جاكرتا جاهزة يا باك، وهذا أصلها.
        en: The letter from the Egyptian Embassy in Jakarta is here, Pak. This is the original.
      - speaker: Pak Syamsul
        text: Bagus. Tetapi dokumen berbahasa asing harus diterjemahkan oleh penerjemah tersumpah. Akta kelahiran Mas Karim juga perlu dilegalisasi.
        ar_eg: كويس. بس الورق اللي بلغة أجنبية لازم يترجمه مترجم محلّف. وشهادة ميلاد ماس كريم كمان محتاجة تصديق.
        ar: جيّد. لكنّ الوثائق المحرّرة بلغة أجنبية يجب أن يترجمها مترجم محلّف، وشهادة ميلاد ماس كريم تحتاج أيضًا إلى تصديق.
        en: Good. But documents in a foreign language must be translated by a sworn translator. Mas Karim's birth certificate also needs to be legalised.
        note:
          ar_eg: penerjemah tersumpah يعني مترجم حلف اليمين قدّام الدولة - زي «الترجمة المعتمدة» عندنا. وlegalisasi هي سلسلة التصديقات (من الخارجية والسفارة) - زي «تصديق الخارجية» اللي المصريين عارفينه كويس.
          ar: penerjemah tersumpah مترجم أدّى اليمين أمام الدولة، كـ«الترجمة المعتمدة» عندنا. وlegalisasi سلسلة التصديقات من الخارجية والسفارة، كـ«تصديق الخارجية» المعروف في مصر.
          en: A penerjemah tersumpah is a sworn translator. legalisasi is the chain of official stamps (foreign ministry, embassy) - Egyptians know it as tasdeeq el-kharegeya.
      - speaker: Karim
        text: Legalisasi... Di Kairo, saya udah antre di tiga kantor buat tiga cap.
        ar_eg: تصديق... في القاهرة أنا وقفت في طابور تلات مكاتب عشان تلات أختام.
        ar: التصديق... وقفتُ في القاهرة في طوابير ثلاثة مكاتب من أجل ثلاثة أختام.
        en: Legalisation... In Cairo I queued at three offices for three stamps.
        note:
          ar_eg: udah = sudah - كريم بيكلّم نفسه أكتر ما بيكلّم الموظف. وcap = ختم.
          ar: udah = sudah - يحدّث كريم نفسه أكثر من الموظّف. وcap = ختم.
          en: udah = sudah - Karim is talking to himself more than to the official. cap = stamp.
      - speaker: Pak Budi
        text: Terus biayanya berapa, Pak?
        ar_eg: وطب التكلفة كام يا باك؟
        ar: وكم التكلفة يا باك؟
        en: And how much does it cost, Pak?
      - speaker: Pak Syamsul
        text: Kalau akad dilaksanakan di kantor KUA pada jam kerja, tidak dipungut biaya. Kalau di luar kantor atau di luar jam kerja, biayanya enam ratus ribu rupiah, dibayar melalui bank.
        ar_eg: لو كتب الكتاب في مكتب KUA في مواعيد الشغل، ببلاش. لو برّه المكتب أو برّه مواعيد الشغل، بستمية ألف روبية، بتدفعوها في البنك.
        ar: إذا عُقد القران في مكتب الشؤون الدينية خلال ساعات العمل فلا رسوم. وإذا عُقد خارجه أو خارج ساعات العمل فالرسوم ستمئة ألف روبية تُدفع عبر المصرف.
        en: If the contract takes place at the KUA office in working hours, there's no fee. Outside the office or outside working hours, it's six hundred thousand rupiah, paid through the bank.
        note:
          ar_eg: ده حسب لايحة حكومية من ٢٠١٤ - كتب الكتاب في المكتب ببلاش، وبرّه بـ ٦٠٠ ألف روبية بتتدفع للبنك مش للموظّف، عشان محدّش ياخد فلوس من تحت الترابيزة. ولاحظ الصيغة القانونية - tidak dipungut biaya (لا تُحصَّل رسوم).
          ar: هذا وفق لائحة حكومية صدرت عام ٢٠١٤ - العقد في المكتب مجّاني، وخارجه بستمئة ألف روبية تُودَع في المصرف لا تُسلَّم للموظّف، منعًا للرشوة. ولاحظ الصيغة القانونية tidak dipungut biaya (لا تُستوفى رسوم).
          en: This follows a 2014 government regulation - free at the office, 600,000 rupiah elsewhere, paid into a bank rather than to the official, to keep things clean. Note the legal phrase tidak dipungut biaya, "no fee is levied".
      - speaker: Pak Budi
        text: Akadnya di rumah, hari Sabtu. Jadi enam ratus ribu. Masih lebih murah daripada tiga ratus tamunya Bu Tini.
        ar_eg: كتب الكتاب في البيت يوم السبت. يبقى ستمية ألف. لسه أرخص من التلتمية ضيف بتوع بو تيني.
        ar: العقد في البيت يوم السبت، إذن ستمئة ألف. وهذا أرخص من ضيوف بو تيني الثلاثمئة.
        en: The contract's at home, on a Saturday. So six hundred thousand. Still cheaper than Bu Tini's three hundred guests.
        note:
          ar_eg: akad = عقد (الجواز).
          ar: akad = عقد (الزواج).
          en: akad = the (marriage) contract, from Arabic عقد.
      - speaker: Pak Syamsul
        text: Satu lagi, Pak. Walinya Bapak sendiri, ya? Dan perlu dua orang saksi laki-laki yang beragama Islam.
        ar_eg: حاجة كمان يا باك. الوليّ حضرتك، صح؟ ومحتاجين اتنين شهود رجّالة مسلمين.
        ar: أمر أخير يا باك. أنت الوليّ، أليس كذلك؟ ونحتاج إلى شاهدين ذكرين مسلمين.
        en: One more thing, Pak. You'll be the wali yourself? And we need two male Muslim witnesses.
      - speaker: Pak Budi
        text: Walinya saya. Saksinya Mas Joko sama Pak RT. Mereka udah latihan bilang "sah" dari minggu lalu.
        ar_eg: الوليّ أنا. والشهود ماس جوكو وباك RT. بقالهم أسبوع بيتمرّنوا يقولوا «صحّ».
        ar: أنا الوليّ، والشاهدان ماس جوكو وباك RT، وهما يتدرّبان على قول «صحّ» منذ الأسبوع الماضي.
        en: I'm the wali. The witnesses are Mas Joko and Pak RT. They've been practising saying "sah" since last week.
        note:
          ar_eg: udah = sudah، bilang = berkata (يقول)، dari = sejak (من) في الكلام. وwali = وليّ، saksi = شاهد.
          ar: udah = sudah، وbilang = berkata (يقول)، وdari = sejak في الكلام. وwali = وليّ، وsaksi = شاهد.
          en: udah = sudah, bilang = berkata (to say), dari = sejak (since) in speech. wali = guardian (وليّ), saksi = witness (شاهد).
  - setting:
      ar_eg: بالليل. بايو في أوضته في ميدان بيكتب في جروب «العيلة الكبيرة»، والكل بيردّ من ماديون ومن باليكبابان.
      ar: ليلًا. يكتب بايو من غرفته في ميدان في مجموعة «العائلة الكبيرة»، والجميع يردّون من ماديون وباليكبابان.
      en: Night. Bayu, in his room in Medan, is typing in the "Big Family" group, and everyone's replying from Madiun and Balikpapan.
    lines:
      - speaker: Narrator
        text: Malam itu Bayu mengirim ringkasan ke grup keluarga. Judulnya "Aturan Nikah Campur dalam Bahasa Manusia".
        ar_eg: بالليل بايو بعت ملخّص لجروب العيلة. عنوانه «قوانين الجواز المختلط بلغة البني آدمين».
        ar: في تلك الليلة أرسل بايو ملخّصًا إلى مجموعة العائلة بعنوان «قواعد الزواج المختلط بلغة البشر».
        en: That night Bayu sends a summary to the family group. It's called "Mixed-Marriage Rules in Human Language".
      - speaker: Bayu
        text: Poin satu. Nikah itu sah kalau dilakukan menurut agama. Terus nikahnya wajib dicatat negara. Buat yang Islam, dicatatnya di KUA.
        ar_eg: النقطة الأولى. الجواز بيبقى صحيح لو اتعمل حسب الدين. وبعدين لازم الدولة تسجّله. وللمسلمين، بيتسجّل في KUA.
        ar: النقطة الأولى - يصحّ الزواج إذا عُقد وفق الدين، ثمّ يجب أن تسجّله الدولة؛ وللمسلمين يُسجَّل في مكتب الشؤون الدينية.
        en: Point one. A marriage is valid if it's done according to religion. Then it must be registered by the state. For Muslims, that's at the KUA.
        note:
          ar_eg: بايو بيعمل parafrasa (يعيد الصياغة) للمادة ٢ من نفس القانون - «Perkawinan adalah sah, apabila dilakukan menurut hukum masing-masing agamanya» و«Tiap-tiap perkawinan dicatat menurut peraturan perundang-undangan yang berlaku». قارن الجملتين بكلامه! وبايو بيكتب بلغة الشات - nikahnya = pernikahannya، terus = lalu، وdicatat = يتسجّل. وpoin = نقطة.
          ar: يعيد بايو صياغة المادة ٢ من القانون نفسه - «Perkawinan adalah sah, apabila dilakukan menurut hukum masing-masing agamanya» و«Tiap-tiap perkawinan dicatat menurut peraturan perundang-undangan yang berlaku». قارن بين النصّ وصياغته! ويكتب بايو بلغة المحادثات - nikahnya = pernikahannya، وterus = lalu، وdicatat = يُسجَّل. وpoin = نقطة.
          en: Bayu is paraphrasing Article 2 of the same law - "Perkawinan adalah sah, apabila dilakukan menurut hukum masing-masing agamanya" and "Tiap-tiap perkawinan dicatat menurut peraturan perundang-undangan yang berlaku". Compare! Bayu writes in chat language - nikahnya = pernikahannya, terus = lalu, dicatat = registered. poin = point.
      - speaker: Bayu
        text: Poin dua. Semua surat Mas Karim yang bahasa Arab harus diterjemahin sama penerjemah tersumpah. Google Translate nggak dihitung.
        ar_eg: النقطة التانية. كل ورق ماس كريم اللي بالعربي لازم يترجمه مترجم محلّف. وجوجل ترانسليت مش محسوب.
        ar: النقطة الثانية - يجب أن يترجم مترجم محلّف كلّ وثائق ماس كريم العربية. ولا يُعتدّ بترجمة غوغل.
        en: Point two. All Mas Karim's papers in Arabic must be translated by a sworn translator. Google Translate doesn't count.
        note:
          ar_eg: diterjemahin = diterjemahkan (يتترجم)، وsama هنا = oleh (عن طريق). وdihitung = يتحسب.
          ar: diterjemahin = diterjemahkan (يُترجَم)، وsama هنا بمعنى oleh. وdihitung = يُحسَب.
          en: diterjemahin = diterjemahkan (be translated); sama here = oleh (by). dihitung = counted.
      - speaker: Mas Joko
        text: Mas Bayu, kalau saksinya lupa bilang "sah", nikahnya batal, nggak?
        ar_eg: يا ماس بايو، لو الشاهد نسي يقول «صحّ»، الجواز يبقى باطل؟
        ar: يا ماس بايو، إن نسي الشاهد أن يقول «صحّ»، أيبطل الزواج؟
        en: Mas Bayu, if a witness forgets to say "sah", is the marriage void?
        note:
          ar_eg: bilang = berkata، nikahnya = pernikahannya. وbatal = باطل - من العربي.
          ar: bilang = berkata، وnikahnya = pernikahannya. وbatal = باطل، من العربية.
          en: bilang = berkata, nikahnya = pernikahannya. batal = void (Arabic باطل).
      - speaker: Bayu
        text: Tenang, Mas. Saksi nggak wajib bilang "sah". Tugas saksi itu cuma nyaksiin akad. Tapi silakan aja teriak "sah" sekeras-kerasnya.
        ar_eg: اطمّن يا ماس. الشاهد مش مطلوب منه يقول «صحّ». واجبه إنه يشهد على العقد. بس اتفضّل قول «صحّ» بأعلى صوتك.
        ar: اطمئنّ يا ماس. لا يجب على الشاهد أن يقول «صحّ»، فواجبه أن يشهد العقد. لكن قلها بأعلى صوتك إن شئت.
        en: Relax, Mas. A witness doesn't have to say "sah". A witness's duty is to witness the contract. But feel free to shout "sah" as loud as you like.
        note:
          ar_eg: nyaksiin = menyaksikan (يشهد)، cuma = hanya (بس)، bilang = berkata، teriak = يزعّق. وsekeras-kerasnya = بأعلى صوت.
          ar: nyaksiin = menyaksikan (يشهد)، وcuma = hanya (فقط)، وbilang = berkata، وteriak = يصرخ. وsekeras-kerasnya = بأعلى صوت.
          en: nyaksiin = menyaksikan (to witness), cuma = hanya (only), bilang = berkata, teriak = to shout. sekeras-kerasnya = as loud as possible.
      - speaker: Bayu
        text: Poin tiga. Anak dari perkawinan campuran boleh punya dua kewarganegaraan sampai umur delapan belas tahun. Habis itu, dia harus pilih salah satu.
        ar_eg: النقطة التالتة. ولاد الجواز المختلط ينفع يبقى معاهم جنسيتين لحدّ ١٨ سنة. بعد كده لازم يختاروا واحدة.
        ar: النقطة الثالثة - يجوز لأبناء الزواج المختلط حمل جنسيتين حتى سنّ الثامنة عشرة، ثمّ عليهم اختيار إحداهما.
        en: Point three. Children of a mixed marriage may hold two nationalities until age eighteen. After that, they must choose one.
        note:
          ar_eg: ده حسب قانون الجنسية رقم ١٢ لسنة ٢٠٠٦ - الجنسية المزدوجة «محدودة» للأطفال، ولازم يختاروا خلال تلات سنين بعد ما يكمّلوا ١٨. والقوانين بتتغيّر، فلازم تتأكّد دايمًا من الجهات الرسمية. habis itu = setelah itu (بعد كده)، pilih = memilih (يختار).
          ar: وفق قانون الجنسية رقم ١٢ لسنة ٢٠٠٦ - الجنسية المزدوجة «محدودة» للأطفال، وعليهم الاختيار خلال ثلاث سنوات من بلوغ الثامنة عشرة. والقوانين قد تتغيّر، فالتحقّق من الجهات الرسمية واجب دائمًا. habis itu = setelah itu (بعد ذلك)، وpilih = memilih (يختار).
          en: This follows Citizenship Law No. 12 of 2006 - "limited" dual nationality for children, who must choose within three years of turning eighteen. Laws change, so always check with the authorities. habis itu = setelah itu (after that), pilih = memilih (to choose).
      - speaker: Bu Rahayu
        text: Anak? Le, nikahnya aja belum!
        ar_eg: عيال؟ يا ابني، لسه حتى متجوّزوش!
        ar: أطفال؟ يا بنيّ، لم يتزوّجا بعد!
        en: Children? Son, they're not even married yet!
        note:
          ar_eg: nikahnya = menikahnya (يتجوّز) في الكلام.
          ar: nikahnya = menikahnya (يتزوّج) في الكلام اليومي.
          en: nikahnya = menikahnya (to marry) in speech.
      - speaker: Karim
        text: Poin empat dari saya. Setelah menikah, saya bisa mengurus izin tinggal sebagai suami WNI. Pernikahan kami juga akan saya laporkan ke Kedutaan Mesir.
        ar_eg: النقطة الرابعة منّي. بعد الجواز أقدر أطلع إقامة كجوز واحدة إندونيسية. وكمان هبلّغ السفارة المصرية بجوازنا.
        ar: النقطة الرابعة منّي - بعد الزواج يمكنني استخراج إقامة بصفتي زوج مواطنة إندونيسية، وسأبلّغ السفارة المصرية بزواجنا أيضًا.
        en: Point four, from me. After the wedding I can apply for a residence permit as the husband of an Indonesian citizen. And I'll report our marriage to the Egyptian Embassy too.
        note:
          ar_eg: WNI اختصار Warga Negara Indonesia (مواطن إندونيسي)، وعكسها WNA (Warga Negara Asing - أجنبي). جوز أو مرات المواطن الإندونيسي ممكن ياخد إقامة مؤقّتة (KITAS) والزوج أو الزوجة يبقى هو الكفيل.
          ar: WNI اختصار Warga Negara Indonesia (مواطن إندونيسي)، ومقابلها WNA (Warga Negara Asing - أجنبي). ويستطيع زوج المواطن الإندونيسي الحصول على إقامة مؤقّتة (KITAS) بكفالة شريكه.
          en: WNI stands for Warga Negara Indonesia (Indonesian citizen); its opposite is WNA (foreign national). The spouse of an Indonesian can get a temporary stay permit (KITAS), sponsored by their partner.
      - speaker: Sari
        text: 'Dan ini pasal favoritku. Pasal 31: "Hak dan kedudukan isteri adalah seimbang dengan hak dan kedudukan suami dalam kehidupan rumah tangga..."'
        ar_eg: ودي المادة اللي بحبّها. المادة ٣١ - «حقوق الزوجة ومكانتها متوازنة مع حقوق الزوج ومكانته في الحياة الزوجية...»
        ar: وهذه مادّتي المفضّلة، المادة ٣١ - «حقوق الزوجة ومكانتها متوازنة مع حقوق الزوج ومكانته في الحياة الأسرية...»
        en: 'And here''s my favourite. Article 31: "The rights and standing of the wife are equal to the rights and standing of the husband in household life..."'
      - speaker: Pak Budi
        text: Seimbang. Kayak Bapak sama Ibu.
        ar_eg: متوازنة. زيّي أنا وأمّك.
        ar: متوازنة، مثلي ومثل أمّك.
        en: Equal. Like your mum and me.
        note:
          ar_eg: kayak = seperti (زي)، sama = dan (و).
          ar: kayak = seperti (مثل)، وsama = dan (و).
          en: kayak = seperti (like), sama = dan (and).
      - speaker: Bu Rahayu
        text: Seimbang, Pak? Yang pegang uang belanja siapa, hayo?
        ar_eg: متوازنة يا بودي؟ ومين اللي ماسك فلوس البيت؟
        ar: متوازنة يا باك؟ ومن الذي يمسك مصروف البيت؟
        en: Equal, Pak? And who holds the housekeeping money?
        note:
          ar_eg: hayo = «هه؟ قول بقى!» - بتتقال لما حدّ اتمسك.
          ar: hayo = «هيّا قُل!» - تُقال حين يُضبط أحد.
          en: hayo = "go on, admit it!" - said when you have caught someone out.
      - speaker: Pak Budi
        text: Ibu. Jadi, Ibu sedikit lebih seimbang.
        ar_eg: انتي. يبقى انتي متوازنة شوية زيادة.
        ar: أنتِ. إذن أنتِ متوازنة أكثر قليلًا.
        en: You. So you're slightly more equal.
      - speaker: Bayu
        text: Catatan terakhir. Aturan bisa berubah. Jadi, selalu cek ke KUA sama kedutaan, jangan cuma ke grup WhatsApp keluarga.
        ar_eg: ملاحظة أخيرة. القوانين ممكن تتغيّر. فاسألوا دايمًا الـ KUA والسفارة، مش جروب الواتساب بتاع العيلة بس.
        ar: ملاحظة أخيرة - القواعد قد تتغيّر، فارجعوا دائمًا إلى مكتب الشؤون الدينية والسفارة، لا إلى مجموعة واتساب العائلة وحدها.
        en: Final note. Rules can change. So always check with the KUA and the embassy, not just the family WhatsApp group.
        note:
          ar_eg: cuma = hanya (بس)، sama = dan. وcek = يتأكّد، وgrup = جروب.
          ar: cuma = hanya (فقط)، وsama = dan. وcek = يتحقّق، وgrup = مجموعة.
          en: cuma = hanya (only), sama = dan. cek = to check; grup = group.
