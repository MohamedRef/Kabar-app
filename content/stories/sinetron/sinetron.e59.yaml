questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: اتّفقوا على سعر كام للعلبة في الآخر؟
      ar: على أيّ سعر للعلبة اتّفقوا في النهاية؟
      en: What price per box did they finally agree on?
    options: ["tiga puluh ribu rupiah", "dua puluh dua ribu rupiah", "dua puluh lima ribu rupiah", "dua puluh ribu rupiah"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Mohon maaf sebelumnya, Mas. Sepertinya angka itu agak ___ untuk anggaran kami.
    meaning:
      ar_eg: معلش متآخذنيش يا ماس. شكل الرقم ده تقيل شوية على ميزانيتنا.
      ar: أعتذر مسبقًا يا ماس، يبدو أنّ هذا الرقم ثقيل بعض الشيء على ميزانيتنا.
      en: Forgive me in advance, Mas. That figure seems a little heavy for our budget.
    answers: [berat]
    options: ["ringan", "manis", "berat"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: (استنتاج) بو إنداه كانت تقصد إيه بجد لما قالت «تقيل شوية على ميزانيتنا»؟
      ar: (استنتاج) ماذا قصدت بو إنداه حقًّا بقولها «ثقيل بعض الشيء على ميزانيتنا»؟
      en: (Inference) What did Bu Indah really mean by "a little heavy for our budget"?
    options: ["Dia menolak harga itu dengan sopan dan ingin harga yang lebih rendah.", "Kotak makanannya terlalu berat dibawa.", "Dia ingin menambah jumlah karyawan.", "Dia langsung setuju dengan harga itu."]
    answer: 0
  - id: q04
    type: listen
    text: Kalau baru dua jam, namanya masih kalio, kuahnya masih banyak. Rendang yang sejati itu kering dan cokelat tua.
    question:
      ar_eg: إيه الفرق بين الكاليو والرندانج الحقيقي؟
      ar: ما الفرق بين الكاليو والرندانغ الحقيقي؟
      en: What's the difference between kalio and true rendang?
    options: ["Kalio lebih pedas daripada rendang.", "Kalio dibuat dari ayam.", "Rendang dimasak dua jam saja.", "Kalio masih berkuah; rendang sejati kering dan cokelat tua."]
    answer: 3
    meaning:
      ar_eg: لو لسه ساعتين، يبقى اسمه «كاليو»، لسه فيه صلصة كتير. الرندانج الحقيقي ناشف ولونه بنّي غامق.
      ar: إن مرّت ساعتان فقط فهو ما زال «كاليو» كثير المرق. أمّا الرندانغ الحقّ فجافّ بنّيّ داكن.
      en: After only two hours it's still kalio - lots of sauce. True rendang is dry and dark brown.
  - id: q05
    type: translate
    direction: from_target
    source_text: Harga bisa ditawar, tapi rasa nggak bisa ditawar.
    answers_meaning:
      ar_eg: ["السعر فيه فصال، بس الطعم مفيهوش فصال.", "ممكن نفاصل في السعر، بس مش في الطعم.", "السعر يتفاصل فيه، والطعم لأ."]
      ar: ["السعر يُساوَم عليه، أمّا الطعم فلا.", "يمكن المساومة على السعر لا على الطعم.", "السعر قابل للتفاوض، والطعم غير قابل له."]
      en: ["Price can be negotiated, but flavour can't.", "You can bargain over the price, not the taste.", "The price is negotiable; the flavour is not."]
next:
  ar_eg: بايو رجع ميدان، والدكتورة بتاعته طالبة منه أول ورقة بحثية - عن ثقافة الوارونج. وساري وكريم قدّامهم سؤال كبير - يعيشوا فين؟ باليكبابان، ماديون، ولا القاهرة؟ وفي آخر الحلقة، إعلان صغيّر على موبايل بايو بيشاور على أقصى شرق إندونيسيا.
  ar: عاد بايو إلى ميدان، وطلبت منه أستاذته أوّل ورقة بحثية - عن ثقافة الوارونغ. وأمام ساري وكريم سؤال كبير - أين يعيشان؟ باليكبابان أم ماديون أم القاهرة؟ وفي آخر الحلقة يشير إعلان صغير على هاتف بايو إلى أقصى شرق إندونيسيا.
  en: Bayu is back in Medan, and his lecturer wants his first academic paper - on warung culture. Sari and Karim face a big question - where to live? Balikpapan, Madiun or Cairo? And at the very end, a small announcement on Bayu's phone points to Indonesia's far east.
