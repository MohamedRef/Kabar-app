title:
  target: Rasa Tidak Bisa Ditawar
  ar_eg: الطعم مفيهوش فصال
  ar: الطعم لا يُساوَم عليه
  en: Flavour Is Not Negotiable
summary:
  ar_eg: بو إنداه، مديرة في شركة في ماديون وكانت ضيفة في الفرح، عايزة الوارونج يعمل غدا يومي لخمسين موظّف. بايو وماس جوكو بيتفاوضوا بالأدب الإندونيسي - من غير ولا «لأ» صريحة. والاتفاق بيطلع بشرط - رندانج كل جمعة. فبيروحوا يتعلّموا من باك روسدي، الطبّاخ المينانجي.
  ar: تريد بو إنداه، مديرة في شركة بماديون وإحدى ضيفات العرس، أن يعدّ الوارونغ غداءً يوميًّا لخمسين موظفًا. يتفاوض بايو وماس جوكو على الطريقة الإندونيسية المهذّبة - دون «لا» صريحة واحدة. وينتهي الاتفاق بشرط - رندانغ كلّ جمعة. فيذهبان ليتعلّما من باك روسدي، الطاهي المينانغي.
  en: Bu Indah, a manager at a Madiun company and a wedding guest, wants the warung to cater daily lunches for fifty staff. Bayu and Mas Joko negotiate the polite Indonesian way - without a single outright "no". The deal comes with a condition - rendang every Friday. So off they go to learn from Pak Rusdi, a Minang chef.
cast: [Bu Indah, Bayu, Mas Joko, Pak Budi, Pak Rusdi]
scenes:
  - setting:
      ar_eg: الوارونج، أسبوع بعد الفرح. بايو لسه في أجازة نص السنة. بو إنداه قاعدة على الترابيزة ومعاها نوتة، وباك بودي قاعد في الركن عامل نفسه بيقرا الجرنال.
      ar: الوارونغ بعد العرس بأسبوع. بايو ما زال في عطلة منتصف العام. تجلس بو إنداه إلى الطاولة ومعها مفكّرة، وباك بودي في الركن يتظاهر بقراءة الجريدة.
      en: The warung, a week after the wedding. Bayu is still on his semester break. Bu Indah sits at a table with a notebook, and Pak Budi is in the corner pretending to read the paper.
    lines:
      - speaker: Narrator
        text: Seminggu setelah pernikahan, Bu Indah datang ke warung. Dia manajer di sebuah perusahaan di Madiun, dan dia masih ingat rasa pecel di pesta Sari.
        ar_eg: بعد الفرح بأسبوع، بو إنداه جت الوارونج. هي مديرة في شركة في ماديون، ولسه فاكرة طعم البيتشيل في فرح ساري.
        ar: بعد العرس بأسبوع جاءت بو إنداه إلى الوارونغ. إنها مديرة في شركة بماديون، وما زالت تذكر طعم البيتشيل في عرس ساري.
        en: A week after the wedding, Bu Indah comes to the warung. She's a manager at a Madiun company, and she still remembers the taste of the pecel at Sari's wedding.
      - speaker: Bu Indah
        text: Mas Bayu, Mas Joko, kantor kami sedang mencari katering makan siang untuk lima puluh karyawan, Senin sampai Jumat. Kira-kira berapa harganya per kotak?
        ar_eg: يا ماس بايو، يا ماس جوكو، شركتنا بتدوّر على حدّ يعمل غدا لخمسين موظّف، من الاتنين للجمعة. العلبة تقريبًا بكام؟
        ar: يا ماس بايو، يا ماس جوكو، تبحث شركتنا عن خدمة تموين للغداء لخمسين موظفًا من الاثنين إلى الجمعة. كم سعر العلبة تقريبًا؟
        en: Mas Bayu, Mas Joko, our office is looking for lunch catering for fifty staff, Monday to Friday. Roughly how much would it be per box?
      - speaker: Bayu
        text: Untuk nasi, pecel, lauk, dan buah, harga kami tiga puluh ribu rupiah per kotak, Bu.
        ar_eg: رز وبيتشيل وصنف وفاكهة، سعرنا تلاتين ألف روبية للعلبة يا بو.
        ar: الأرز والبيتشيل والطبق الجانبي والفاكهة، سعرنا ثلاثون ألف روبية للعلبة يا بو.
        en: For rice, pecel, a side dish and fruit, our price is thirty thousand rupiah a box, Bu.
      - speaker: Bu Indah
        text: Hmm. Mohon maaf sebelumnya, Mas. Sepertinya angka itu agak berat untuk anggaran kami.
        ar_eg: همم. معلش متآخذنيش يا ماس. شكل الرقم ده تقيل شوية على ميزانيتنا.
        ar: همم. أعتذر مسبقًا يا ماس، يبدو أنّ هذا الرقم ثقيل بعض الشيء على ميزانيتنا.
        en: Hmm. Forgive me in advance, Mas. That figure seems a little heavy for our budget.
        note:
          ar_eg: في الشغل الإندونيسيين نادرًا ما بيقولوا «لأ» على طول. بيقولوا agak berat (تقيل شوية)، kurang pas (مش مظبوط أوي)، kami pertimbangkan dulu (هنفكّر الأول). وmohon maaf sebelumnya (متآخذنيش مقدّمًا) بتمهّد لأي رفض. زي «ربنا يسهّل» عندنا.
          ar: نادرًا ما يقول الإندونيسيون «لا» صريحة في العمل؛ بل يقولون agak berat (ثقيل قليلًا)، وkurang pas (غير مناسب تمامًا)، وkami pertimbangkan dulu (سننظر في الأمر). وتمهّد mohon maaf sebelumnya (أعتذر مسبقًا) لأيّ رفض.
          en: In business Indonesians rarely say a flat "no". They say agak berat (a bit heavy), kurang pas (not quite right), kami pertimbangkan dulu (we'll consider it). mohon maaf sebelumnya (forgive me in advance) cushions any refusal.
      - speaker: Mas Joko
        text: Mas, "agak berat" itu artinya "nggak", kan?
        ar_eg: يا ماس، «تقيل شوية» دي معناها «لأ»، صح؟
        ar: يا ماس، «ثقيل قليلًا» تعني «لا»، أليس كذلك؟
        en: Mas, "a bit heavy" means "no", right?
        note:
          ar_eg: ماس جوكو بيوشوش بايو بكلام عادي، أما الكلام مع الزبونة فمؤدّب ورسمي.
          ar: يهمس ماس جوكو لبايو بالعامّية، أمّا الحديث مع العميلة فمهذّب رسمي.
          en: Mas Joko whispers to Bayu in everyday speech; talk with the client stays polite and formal.
      - speaker: Bayu
        text: Artinya, "turunin dikit, tapi jangan kebanyakan."
        ar_eg: معناها «نزّل السعر شوية، بس مش أوي.»
        ar: معناها «اخفض السعر قليلًا، لكن ليس كثيرًا.»
        en: It means "come down a little, but not too much."
        note:
          ar_eg: turunin = turunkan (نزّل)، dikit = sedikit (شوية)، kebanyakan = terlalu banyak (كتير زيادة).
          ar: turunin = turunkan (اخفض)، وdikit = sedikit (قليلًا)، وkebanyakan = terlalu banyak (أكثر من اللازم).
          en: turunin = turunkan (bring down), dikit = sedikit (a little), kebanyakan = terlalu banyak (too much).
      - speaker: Bayu
        text: Kami mengerti, Bu. Bagaimana kalau dua puluh lima ribu, dengan syarat kontraknya enam bulan dan pembayarannya setiap minggu?
        ar_eg: فاهمين يا بو. إيه رأيك في خمسة وعشرين ألف، بشرط العقد يبقى ست شهور والدفع كل أسبوع؟
        ar: نتفهّم ذلك يا بو. ما رأيك في خمسة وعشرين ألفًا، بشرط أن يكون العقد لستّة أشهر والدفع أسبوعيًّا؟
        en: We understand, Bu. How about twenty-five thousand, on condition of a six-month contract and weekly payment?
      - speaker: Bu Indah
        text: Dua puluh lima ribu... Kalau dua puluh dua ribu, apakah memungkinkan?
        ar_eg: خمسة وعشرين ألف... طب لو اتنين وعشرين ألف، ينفع؟
        ar: خمسة وعشرون ألفًا... وهل يمكن أن يكون اثنين وعشرين ألفًا؟
        en: Twenty-five thousand... Would twenty-two thousand be possible?
      - speaker: Mas Joko
        text: Bu, kalau dua puluh dua ribu, lauknya mungkin harus sedikit lebih... kurus.
        ar_eg: يا بو، لو اتنين وعشرين ألف، الصنف يمكن يبقى... أرفع شوية.
        ar: يا بو، إن كان اثنين وعشرين ألفًا فقد يصير الطبق الجانبي... أنحف قليلًا.
        en: Bu, at twenty-two thousand, the side dish might have to be a little more... slim.
      - speaker: Bu Indah
        text: Hahaha! Baiklah, dua puluh lima ribu. Tapi setiap Jumat, apakah bisa ada menu spesial?
        ar_eg: هههه! خلاص، خمسة وعشرين ألف. بس كل جمعة، ينفع يبقى فيه أكلة مميّزة؟
        ar: هاهاها! حسنًا، خمسة وعشرون ألفًا. لكن هل يمكن أن يكون هناك طبق مميّز كلّ جمعة؟
        en: Hahaha! All right, twenty-five thousand. But on Fridays, could there be a special dish?
      - speaker: Bayu
        text: Tentu bisa, Bu. Insyaallah setiap Jumat ada rendang.
        ar_eg: أكيد يا بو. إن شاء الله كل جمعة فيه رندانج.
        ar: بالتأكيد يا بو. إن شاء الله سيكون هناك رندانغ كلّ جمعة.
        en: Certainly, Bu. Every Friday there'll be rendang, insyaallah.
      - speaker: Pak Budi
        text: Rendang? Le, warung kita nggak pernah bikin rendang!
        ar_eg: رندانج؟ يا ابني، الوارونج بتاعنا عمره ما عمل رندانج!
        ar: رندانغ؟ يا بنيّ، لم يصنع الوارونغ الرندانغ قطّ!
        en: Rendang? Son, our warung has never made rendang!
        note:
          ar_eg: bikin = membuat (يعمل). وrendang = لحمة بجوز الهند على نار هادية لساعات.
          ar: bikin = membuat (يصنع). وrendang = لحم بجوز الهند يُطهى ساعات.
          en: bikin = membuat (to make). rendang = beef slow-cooked in coconut milk for hours.
      - speaker: Bayu
        text: Belum pernah, Pak. Belum.
        ar_eg: لسه معملش يا بابا. لسه.
        ar: لم يصنعه بعد يا أبي. بعد.
        en: Not yet, Dad. Not yet.
      - speaker: Narrator
        text: 'Malam itu Bayu mengirim email: "Dengan hormat, menindaklanjuti pertemuan kita pada hari Senin, bersama ini kami sampaikan penawaran harga katering sebesar Rp25.000 per kotak. Atas perhatian Ibu, kami ucapkan terima kasih. Hormat kami, Warung Pecel Pak Budi."'
        ar_eg: بالليل بايو بعت إيميل - «تحية طيبة وبعد، إلحاقًا باجتماعنا يوم الاتنين، نتشرّف بأن نقدّم لحضرتك عرض سعر للتموين قدره ٢٥ ألف روبية للعلبة. وشكرًا على اهتمام حضرتك. مع خالص التحية، وارونج بيتشيل باك بودي.»
        ar: في تلك الليلة أرسل بايو بريدًا إلكترونيًّا - «تحية طيبة وبعد، إلحاقًا باجتماعنا يوم الاثنين، يسرّنا أن نقدّم إليكم عرض سعر للتموين قدره ٢٥ ألف روبية للعلبة. شاكرين لكم حسن اهتمامكم. وتفضّلوا بقبول فائق الاحترام، وارونغ بيتشيل باك بودي.»
        en: 'That night Bayu sends an email: "Dear Madam, further to our meeting on Monday, we are pleased to submit our catering quotation of Rp25,000 per box. Thank you for your attention. Yours faithfully, Pak Budi''s Pecel Warung."'
        note:
          ar_eg: الجواب الرسمي ليه صيغ ثابتة - Dengan hormat (في الأول، زي «تحية طيبة وبعد»)، menindaklanjuti (إلحاقًا بـ)، bersama ini kami sampaikan (نتشرّف نقدّم)، Atas perhatian... kami ucapkan terima kasih (شكرًا لاهتمامكم)، وHormat kami (مع خالص التحية). شوف الفرق بينه وبين كلام ماس جوكو!
          ar: للرسالة الرسمية صيغ ثابتة - Dengan hormat (في المطلع، كـ«تحية طيبة وبعد»)، وmenindaklanjuti (إلحاقًا بـ)، وbersama ini kami sampaikan (نرفق/نقدّم)، وAtas perhatian... kami ucapkan terima kasih (شاكرين حسن اهتمامكم)، وHormat kami (وتفضّلوا بقبول الاحترام). لاحظ الفرق عن كلام ماس جوكو!
          en: 'A formal letter has fixed formulas: Dengan hormat (opening, "Dear Sir/Madam"), menindaklanjuti ("further to"), bersama ini kami sampaikan ("we hereby submit"), Atas perhatian... kami ucapkan terima kasih ("thank you for your attention") and Hormat kami ("yours faithfully"). Compare Mas Joko''s style!'
  - setting:
      ar_eg: يوم السبت الساعة ٧ الصبح، مطبخ «مطعم بادانج» بتاع باك روسدي جنب السوق. حلّة كبيرة (كوالي) على النار، وريحة جوز الهند والتوابل مالية المكان.
      ar: السبت في السابعة صباحًا، مطبخ «مطعم بادانغ» الذي يملكه باك روسدي قرب السوق. قدر كبيرة (كوالي) على النار، ورائحة جوز الهند والتوابل تملأ المكان.
      en: Saturday, 7 a.m., the kitchen of Pak Rusdi's Padang restaurant near the market. A big wok (kuali) is on the fire, and the smell of coconut and spices fills the room.
    lines:
      - speaker: Pak Rusdi
        text: Rendang itu bukan resep, Mas Bayu. Rendang itu kesabaran. Daging, santan, cabai, lengkuas, serai, daun kunyit... lalu diaduk berjam-jam.
        ar_eg: الرندانج مش وصفة يا ماس بايو. الرندانج صبر. لحمة، ولبن جوز هند، وشطّة، وخولنجان، وليمون عشب، وورق كركم... وبعدين تقلّب ساعات.
        ar: الرندانغ ليس وصفة يا ماس بايو، بل صبر. لحم وحليب جوز الهند وفلفل حارّ وخولنجان وعشبة الليمون وورق الكركم... ثمّ يُقلَّب ساعات.
        en: Rendang isn't a recipe, Mas Bayu. Rendang is patience. Beef, coconut milk, chilli, galangal, lemongrass, turmeric leaf... then you stir for hours.
      - speaker: Bayu
        text: Berapa jam, Pak?
        ar_eg: كام ساعة يا باك؟
        ar: كم ساعة يا باك؟
        en: How many hours, Pak?
      - speaker: Pak Rusdi
        text: Paling nggak empat jam. Kalau baru dua jam, namanya masih kalio, kuahnya masih banyak. Rendang yang sejati itu kering dan cokelat tua.
        ar_eg: أربع ساعات على الأقل. لو لسه ساعتين، يبقى اسمه «كاليو»، لسه فيه صلصة كتير. الرندانج الحقيقي ناشف ولونه بنّي غامق.
        ar: أربع ساعات على الأقلّ. فإن مرّت ساعتان فقط فهو ما زال «كاليو» كثير المرق. أمّا الرندانغ الحقّ فجافّ بنّيّ داكن.
        en: Four at the very least. After only two hours it's still kalio - lots of sauce. True rendang is dry and dark brown.
        note:
          ar_eg: الرندانج أكلة المينانجكاباو من سومطرة الغربية. الاسم جاي من طريقة الطبخ «marandang» - تطبخ على نار هادية لحد ما الصلصة تنشف خالص. وزمان المسافرين المينانج كانوا بياخدوه معاهم في السفر الطويل لأنه بيعيش أسابيع. paling nggak = paling sedikit (على الأقل).
          ar: الرندانغ طبق المينانغكاباو في سومطرة الغربية، واسمه من طريقة الطهو «marandang» - الطهي على نار هادئة حتى يجفّ المرق تمامًا. وكان المسافرون المينانغ يحملونه في أسفارهم الطويلة لأنه يبقى صالحًا أسابيع. paling nggak = paling sedikit (على الأقلّ).
          en: Rendang is a Minangkabau dish from West Sumatra, named after the cooking method marandang - simmering until the sauce cooks away completely. Minang travellers once carried it on long journeys because it keeps for weeks. paling nggak = paling sedikit (at least).
      - speaker: Mas Joko
        text: Empat jam ngaduk? Lengan saya bisa segede lengan Pak Rusdi, dong.
        ar_eg: أربع ساعات تقليب؟ دراعي هيبقى قدّ دراع باك روسدي.
        ar: أربع ساعات من التقليب؟ سيصير ذراعي بحجم ذراع باك روسدي.
        en: Four hours of stirring? My arm will end up as big as Pak Rusdi's.
        note:
          ar_eg: ngaduk = mengaduk (يقلّب)، segede = sebesar (قدّ).
          ar: ngaduk = mengaduk (يحرّك)، وsegede = sebesar (بحجم).
          en: ngaduk = mengaduk (to stir), segede = sebesar (as big as).
      - speaker: Pak Rusdi
        text: Itu bonusnya, Mas. Gratis.
        ar_eg: دي هديّة يا ماس. ببلاش.
        ar: هذه مكافأة يا ماس، بلا مقابل.
        en: That's the bonus, Mas. Free of charge.
      - speaker: Bayu
        text: Pak, kemarin saya nawar harga sama klien. Rasanya kayak ngaduk rendang. Pelan-pelan, nggak boleh buru-buru.
        ar_eg: يا باك، امبارح كنت بفاصل في السعر مع زبونة. كان زي تقليب الرندانج. بالراحة، ممنوع الاستعجال.
        ar: يا باك، فاوضتُ أمس عميلة على السعر، فكان الأمر كتقليب الرندانغ - على مهل، بلا عجلة.
        en: Pak, yesterday I was negotiating a price with a client. It felt like stirring rendang. Slowly, no rushing.
        note:
          ar_eg: nawar = menawar (يفاصل)، sama = dengan، kayak = seperti، ngaduk = mengaduk، buru-buru = terburu-buru (مستعجل). وklien = عميل.
          ar: nawar = menawar (يساوم)، وsama = dengan، وkayak = seperti، وngaduk = mengaduk، وburu-buru = terburu-buru (مستعجل). وklien = عميل.
          en: nawar = menawar (to bargain), sama = dengan, kayak = seperti, ngaduk = mengaduk, buru-buru = terburu-buru (in a hurry). klien = client.
      - speaker: Pak Rusdi
        text: Nah, Mas udah ngerti cara dagang orang Minang. Hubungan dulu, harga belakangan. Harga bisa ditawar, tapi rasa nggak bisa ditawar.
        ar_eg: أهو كده انت فهمت تجارة المينانج يا ماس. العلاقة الأول، والسعر بعدين. السعر فيه فصال، بس الطعم مفيهوش فصال.
        ar: ها قد فهمتَ تجارة المينانغ يا ماس - العلاقة أوّلًا والسعر لاحقًا. السعر يُساوَم عليه، أمّا الطعم فلا.
        en: There you go, you've understood how the Minang do business. Relationship first, price later. Price can be negotiated, but flavour can't.
        note:
          ar_eg: المينانج مشهورين إنهم تجّار شاطرين وبيحبّوا السفر للشغل (merantau). و«مطعم بادانج» (Rumah Makan Padang) تلاقيه في كل مدينة في إندونيسيا تقريبًا، وأغلب أصحابه مينانج. udah = sudah، belakangan = kemudian (بعدين)، وditawar = يتفاصل فيه.
          ar: يشتهر المينانغ بالمهارة في التجارة وبالهجرة للعمل (merantau). و«مطعم بادانغ» (Rumah Makan Padang) تجده في كلّ مدينة إندونيسية تقريبًا، وأغلب ملّاكه من المينانغ. udah = sudah، وbelakangan = kemudian (لاحقًا)، وditawar = يُساوَم عليه.
          en: The Minang are famed traders with a tradition of leaving home to make their way (merantau). A Rumah Makan Padang is in almost every Indonesian town, and most are run by Minang families. udah = sudah, belakangan = kemudian (later); ditawar = haggled over.
      - speaker: Mas Joko
        text: Kalau gitu, satu pelajaran rendang berapa, Pak?
        ar_eg: طب لو كده، درس الرندانج بكام يا باك؟
        ar: إذن كم ثمن درس واحد في الرندانغ يا باك؟
        en: In that case, how much is one rendang lesson, Pak?
        note:
          ar_eg: gitu = begitu (كده).
          ar: gitu = begitu (هكذا).
          en: gitu = begitu (so, like that).
      - speaker: Pak Rusdi
        text: Buat keluarga Pak Budi, gratis. Tapi saya minta satu hal. Ajarin saya bikin pecel Madiun.
        ar_eg: لعيلة باك بودي، ببلاش. بس عايز حاجة واحدة. علّموني أعمل بيتشيل ماديون.
        ar: لأسرة باك بودي مجّانًا. لكنّي أطلب أمرًا واحدًا - علّموني صنع بيتشيل ماديون.
        en: For Pak Budi's family, free. But I ask one thing. Teach me to make Madiun pecel.
        note:
          ar_eg: ajarin = ajari (علّمني)، bikin = membuat (يعمل). وpecel = سلطة خضار بصوص الفول السوداني.
          ar: ajarin = ajari (علّمني)، وbikin = membuat (يصنع). وpecel = سلطة خضار بصلصة الفول السوداني.
          en: ajarin = ajari (teach me), bikin = membuat (to make). pecel = vegetables in peanut sauce.
      - speaker: Pak Budi
        text: Itu namanya tukar ilmu, Pak Rusdi. Lebih adil daripada tukar uang.
        ar_eg: ده اسمه تبادل علم يا باك روسدي. أعدل من تبادل الفلوس.
        ar: هذا تبادل للعلم يا باك روسدي، وهو أعدل من تبادل المال.
        en: That's a swap of knowledge, Pak Rusdi. Fairer than swapping money.
      - speaker: Pak Rusdi
        text: Kata orang Minang, "Alam takambang jadi guru." Alam yang terbentang menjadi guru kita. Dari pecel pun saya bisa belajar.
        ar_eg: المينانج بيقولوا - «الطبيعة المفرودة قدّامنا هي مدرّسنا.» حتى من البيتشيل أقدر أتعلّم.
        ar: يقول المينانغ - «الطبيعة المنبسطة معلّمتنا.» وحتى من البيتشيل أستطيع أن أتعلّم.
        en: As the Minang say, "Alam takambang jadi guru" - the world spread out before us is our teacher. I can learn even from pecel.
        note:
          ar_eg: «Alam takambang jadi guru» من أشهر حِكم المينانج - اتعلّم من كل حاجة حواليك، من الطبيعة ومن الناس. وtakambang كلمة مينانج معناها terkembang (مفرود، مفتوح).
          ar: «Alam takambang jadi guru» من أشهر حِكم المينانغ - تعلّم من كلّ ما حولك من طبيعة وبشر. وtakambang لفظ مينانغي بمعنى terkembang (المنبسط المفتوح).
          en: '"Alam takambang jadi guru" is one of the best-known Minang sayings - learn from everything around you, nature and people alike. takambang is Minang for terkembang, "spread open".'
      - speaker: Narrator
        text: Empat jam kemudian, daging di dalam kuali sudah berwarna cokelat tua. Bayu mencicipinya, lalu diam lama sekali.
        ar_eg: بعد أربع ساعات، اللحمة في الحلّة بقت بنّي غامق. بايو داقها، وسكت مدّة طويلة أوي.
        ar: بعد أربع ساعات صار اللحم في القدر بنّيًّا داكنًا. تذوّقه بايو، ثمّ صمت طويلًا.
        en: Four hours later, the meat in the wok is dark brown. Bayu tastes it, then goes quiet for a very long time.
      - speaker: Bayu
        text: Pak Rusdi... ini rasa yang nggak bisa ditawar.
        ar_eg: يا باك روسدي... ده طعم مفيهوش فصال.
        ar: يا باك روسدي... هذا طعم لا يُساوَم عليه.
        en: Pak Rusdi... this is a flavour you can't negotiate.
