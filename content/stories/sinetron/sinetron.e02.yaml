title:
  target: Nama Saya Nadia
  ar_eg: اسمي نادية
  ar: اسمي نادية
  en: My Name Is Nadia
summary:
  ar_eg: زميلة مصرية جديدة في الأزهر بتخبّط على باب ساري، والحاجّة فاطمة صاحبة البيت بتعزم الكل على شاي. وبعدين ساري بتعرّف نادية على أهلها في ماديون.
  ar: زميلة مصرية جديدة في الأزهر تطرق باب ساري، وتدعو الحاجّة فاطمة صاحبة البيت الجميع إلى الشاي. ثم تعرّف ساري نادية بأهلها في ماديون.
  en: A new Egyptian classmate from Al-Azhar knocks on Sari's door, and Hagga Fatma, the landlady, offers everyone tea. Then Sari introduces Nadia to her parents in Madiun.
cast: [Sari, Nadia, Hagga Fatma, Pak Budi, Bu Rahayu]
scenes:
  - setting:
      ar_eg: شقة ساري في القاهرة، الصبح. حد بيخبّط على الباب.
      ar: شقة ساري في القاهرة، صباحًا. أحدهم يطرق الباب.
      en: Sari's flat in Cairo, in the morning. Someone is at the door.
    lines:
      - speaker: Sari
        text: Ya? Siapa?
        ar_eg: أيوه؟ مين؟
        ar: نعم؟ من هناك؟
        en: Yes? Who is it?
      - speaker: Nadia
        text: Selamat pagi! Maaf, Sari? Nama saya Nadia.
        ar_eg: صباح الخير! لا مؤاخذة، انتي ساري؟ اسمي نادية.
        ar: صباح الخير! عذرًا، هل أنتِ ساري؟ اسمي نادية.
        en: Good morning! Sorry — Sari? My name is Nadia.
      - speaker: Sari
        text: Selamat pagi! Ya, saya Sari. Nadia dari mana?
        ar_eg: صباح النور! أيوه، أنا ساري. انتي منين يا نادية؟
        ar: صباح النور! نعم، أنا ساري. من أين أنتِ يا نادية؟
        en: Good morning! Yes, I'm Sari. Where are you from, Nadia?
        note:
          ar_eg: الإندونيسيين كتير بيقولوا اسم الشخص بدل «انت»، فـ«Nadia dari mana?» معناها «انتي منين؟».
          ar: كثيرًا ما يستعمل الإندونيسيون اسم الشخص بدل ضمير المخاطَب، فـ«Nadia dari mana?» تعني «من أين أنتِ؟».
          en: Indonesians often use the person's name instead of "you", so "Nadia dari mana?" means "Where are you from?".
      - speaker: Nadia
        text: Saya orang Mesir, dari Kairo. Saya mahasiswa Al-Azhar juga.
        ar_eg: أنا مصرية، من القاهرة. وأنا كمان طالبة في الأزهر.
        ar: أنا مصرية من القاهرة، وطالبة في الأزهر أيضًا.
        en: I'm Egyptian, from Cairo. I'm a student at Al-Azhar too.
        note:
          ar_eg: نادية بتتعلم إندونيسي عشان عايزة تشتغل مترجمة. في الأزهر طلبة إندونيسيين كتير جدًا.
          ar: تتعلّم نادية الإندونيسية لأنها تريد أن تعمل مترجمة، وفي الأزهر عدد كبير جدًا من الطلاب الإندونيسيين.
          en: Nadia is learning Indonesian because she wants to be a translator. Al-Azhar has a very large number of Indonesian students.
      - speaker: Sari
        text: Salam kenal, Nadia! Saya orang Indonesia, dari Madiun.
        ar_eg: اتشرفت بيكي يا نادية! أنا إندونيسية، من ماديون.
        ar: تشرّفت بمعرفتك يا نادية! أنا إندونيسية من ماديون.
        en: Nice to meet you, Nadia! I'm Indonesian, from Madiun.
      - speaker: Nadia
        text: Madiun di mana?
        ar_eg: ماديون فين؟
        ar: أين تقع ماديون؟
        en: Where is Madiun?
      - speaker: Sari
        text: Di Jawa Timur, Indonesia.
        ar_eg: في جاوة الشرقية، في إندونيسيا.
        ar: في جاوة الشرقية بإندونيسيا.
        en: In East Java, Indonesia.
      - speaker: Hagga Fatma
        text: Sari! Nadia! Selamat pagi! Mau teh? Mau kopi?
        ar_eg: يا ساري! يا نادية! صباح الخير! تشربوا شاي؟ قهوة؟
        ar: يا ساري! يا نادية! صباح الخير! أتريدان شايًا؟ أم قهوة؟
        en: Sari! Nadia! Good morning! Want some tea? Some coffee?
        note:
          ar_eg: الحاجّة فاطمة بقالها سنين بتأجّر لطلبة إندونيسيين، فاتعلمت شوية كلمات. وفي مصر بنقول «يا حاجّة» للست الكبيرة اللي حجّت؛ الإندونيسيين بيقولوا «Bu Haji».
          ar: تؤجّر الحاجّة فاطمة لطلاب إندونيسيين منذ سنوات، فتعلّمت بعض الكلمات. وفي مصر تُنادى المرأة الكبيرة التي أدّت الحج «يا حاجّة»، ويقول الإندونيسيون «Bu Haji».
          en: Hagga Fatma has rented to Indonesian students for years and picked up a few words. In Egypt an older woman who has made the Hajj is called "Hagga"; Indonesians say "Bu Haji".
      - speaker: Nadia
        text: Saya minta teh, Hagga. Terima kasih.
        ar_eg: شاي لو سمحتي يا حاجّة. شكرًا.
        ar: شايًا من فضلكِ يا حاجّة. شكرًا.
        en: Tea for me, please, Hagga. Thank you.
      - speaker: Sari
        text: Saya juga mau teh, Hagga.
        ar_eg: وأنا كمان عايزة شاي يا حاجّة.
        ar: وأنا أيضًا أريد شايًا يا حاجّة.
        en: I'd like tea too, Hagga.
  - setting:
      ar_eg: مكالمة فيديو مع ماديون. هناك بالليل، وهنا الصبح.
      ar: اتصال مرئي مع ماديون. الوقت هناك ليل، وهنا صباح.
      en: A video call to Madiun. It's evening there and morning here.
    lines:
      - speaker: Sari
        text: Pak, Bu! Ini Nadia. Dia orang Mesir.
        ar_eg: بابا، ماما! دي نادية. هي مصرية.
        ar: أبي، أمي! هذه نادية. هي مصرية.
        en: Dad, Mum! This is Nadia. She's Egyptian.
      - speaker: Pak Budi
        text: Salam kenal, Nadia! Nama saya Budi.
        ar_eg: اتشرفنا يا نادية! أنا اسمي بودي.
        ar: تشرّفنا يا نادية! اسمي بودي.
        en: Nice to meet you, Nadia! My name is Budi.
      - speaker: Nadia
        text: Salam kenal, Pak Budi, Bu Rahayu! Bapak bisa bahasa Arab?
        ar_eg: اتشرفت يا پاك بودي ويا بو راهايو! حضرتك بتعرف عربي؟
        ar: تشرّفت يا باك بودي ويا بو راهايو! هل تعرف العربية؟
        en: Nice to meet you, Pak Budi, Bu Rahayu! Do you speak Arabic?
      - speaker: Pak Budi
        text: Sedikit, sedikit! Tapi saya bisa bahasa Jawa!
        ar_eg: شوية صغيرين! بس أنا بعرف جاوي!
        ar: قليلًا جدًا! لكنني أتكلّم الجاوية!
        en: Just a little! But I speak Javanese!
        note:
          ar_eg: في ماديون الناس بيتكلموا جاوي في البيت والسوق، والإندونيسي في الشغل والمدرسة.
          ar: في ماديون يتكلم الناس الجاوية في البيت والسوق، والإندونيسية في العمل والمدرسة.
          en: In Madiun people speak Javanese at home and in the market, and Indonesian at work and school.
      - speaker: Bu Rahayu
        text: Nadia bisa bahasa Indonesia?
        ar_eg: وانتي يا نادية بتعرفي إندونيسي؟
        ar: وهل تعرفين الإندونيسية يا نادية؟
        en: Do you speak Indonesian, Nadia?
      - speaker: Nadia
        text: Sedikit, Bu. Sari guru saya!
        ar_eg: شوية يا طنط. ساري هي المدرّسة بتاعتي!
        ar: قليلًا يا سيدتي. ساري هي معلّمتي!
        en: A little, ma'am. Sari is my teacher!
      - speaker: Sari
        text: Dan Nadia guru bahasa Arab saya!
        ar_eg: ونادية هي مدرّسة العربي بتاعتي!
        ar: ونادية معلّمتي للعربية!
        en: And Nadia is my Arabic teacher!
