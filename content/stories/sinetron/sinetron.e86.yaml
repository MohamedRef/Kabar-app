id: sinetron.e86
series: sinetron
episode: 86
language: jv
level: j3
unlock_after: j3.u03
title:
  target: Sampun nedha?
  ar_eg: كلت خلاص؟
  ar: هل أكلت؟
  en: Eaten yet?
summary:
  ar_eg: في بيت پاك هارجو في حيّ كاومان جنب الجامع الكبير، بو هارجو بتستقبل كريم بالكراما. وبعد الغدا، پاك هارجو بيلعب معاه لعبة - «حوّل من نجوكو لكراما» - وكريم بيكتشف إن الكلمات الصغيّرة هي اللي بتتغيّر الأول.
  ar: في بيت باك هارجو في حيّ كاومان قرب المسجد الكبير، تستقبل بو هارجو كريمًا بالكراما. وبعد الغداء يلعب معه باك هارجو لعبة - «حوّل من نغوكو إلى كراما» - ويكتشف كريم أنّ الكلمات الصغيرة هي أوّل ما يتغيّر.
  en: At Pak Harjo's house in Kauman, beside the Grand Mosque, Bu Harjo welcomes Karim in krama. After lunch Pak Harjo plays a game with him - "turn ngoko into krama" - and Karim discovers the little words are the first to change.
cast: [Karim, Bu Harjo, Pak Harjo]
scenes:
  - setting:
      ar_eg: بيت قديم في حيّ كاومان في جوجا، ورا الجامع الكبير (Masjid Gedhe). قماش باتيك متعلّق على حبل في الحوش. بو هارجو بتفتح الباب.
      ar: بيت قديم في حيّ كاومان في جوغجا، خلف المسجد الكبير (Masjid Gedhe). أقمشة باتيك معلّقة على حبل في الفناء. تفتح بو هارجو الباب.
      en: An old house in Kauman, Jogja, behind the Grand Mosque (Masjid Gedhe). Batik cloth hangs on a line in the courtyard. Bu Harjo opens the door.
    lines:
      - speaker: Karim
        text: Kula nuwun.
        ar_eg: السلام... (حدّ هنا؟)
        ar: هل من أحد؟ (عن إذنكم)
        en: Hello, may I come in?
        note:
          ar_eg: Kula nuwun بتتقال على الباب لما تيجي بيت حدّ، زي «يا أهل الدار». والردّ - Mangga (اتفضّل).
          ar: Kula nuwun تقال عند الباب حين تزور بيتًا، مثل «يا أهل الدار». والردّ - Mangga (تفضّل).
          en: Kula nuwun is what you say at someone's door, like "anyone home?". The reply is Mangga (come in).
      - speaker: Bu Harjo
        text: Mangga, mangga! Nak Karim, nggih? Bapak dereng kondur saking masjid.
        ar_eg: اتفضّل، اتفضّل! انت كريم يا ابني، صح؟ پاك هارجو لسه مارجعش من الجامع.
        ar: تفضّل، تفضّل! أنت كريم يا بنيّ، أليس كذلك؟ لم يعد باك هارجو بعد من المسجد.
        en: Come in, come in! You're Karim, aren't you? My husband isn't back from the mosque yet.
        note:
          ar_eg: dereng = لسه ما (كراما durung). وsaking = من. وBapak هنا يعني جوزها، الستّات الجاويات كتير بيقولوا على أجوازهم «Bapak».
          ar: dereng = لم بعد (كراما durung). وsaking = من. وBapak هنا تعني زوجها؛ إذ تشير كثير من الجاويات إلى أزواجهنّ بـ«Bapak».
          en: dereng = not yet (krama of durung). saking = from. Bapak here means her husband; Javanese wives often call their husbands "Bapak".
      - speaker: Karim
        text: Nggih, Bu. Menika tempe saking Bu Siti.
        ar_eg: حاضر يا مدام. ده تمپيه من عند بو سيتي.
        ar: حسنًا يا سيدتي. هذا تمبيه من عند بو سيتي.
        en: Yes, ma'am. Here's some tempe from Bu Siti.
      - speaker: Bu Harjo
        text: Wah, matur nuwun! Sampeyan sampun nedha, Nak?
        ar_eg: يا سلام، متشكّرة! انت كلت يا ابني؟
        ar: رائع، شكرًا! هل أكلت يا بنيّ؟
        en: Oh, thank you! Have you eaten, my boy?
      - speaker: Karim
        text: Dereng, Bu.
        ar_eg: لسه يا مدام.
        ar: ليس بعد يا سيدتي.
        en: Not yet, ma'am.
      - speaker: Bu Harjo
        text: Lha, mangga nedha rumiyin. Wonten sayur asem lan tempe goreng.
        ar_eg: طب يلّا كُل الأول. فيه شوربة حامضة وتمپيه مقلي.
        ar: إذن تفضّل كُل أوّلًا. يوجد حساء حامض وتمبيه مقليّ.
        en: Well, please eat first. There's sour vegetable soup and fried tempe.
        note:
          ar_eg: wonten = فيه / موجود (كراما ana)، وmboten wonten = مافيش. وrumiyin = الأول.
          ar: wonten = يوجد (كراما ana)، وmboten wonten = لا يوجد. وrumiyin = أوّلًا.
          en: wonten = there is (krama of ana), mboten wonten = there isn't. rumiyin = first.
  - setting:
      ar_eg: بعد الغدا في الصالة. پاك هارجو رجع، وقاعد بكوباية شاي ياسمين وكرّاسة.
      ar: بعد الغداء في الصالة. عاد باك هارجو، ويجلس بكوب شاي بالياسمين ودفتر.
      en: After lunch, in the front room. Pak Harjo is back, sitting with a glass of jasmine tea and an exercise book.
    lines:
      - speaker: Pak Harjo
        text: Nak Karim, dolanan sekedhik. Kula ngendika ngoko, sampeyan dadosaken krama.
        ar_eg: يا ابني كريم، نلعب لعبة صغيّرة. أنا أقول نجوكو، وانت تحوّلها كراما.
        ar: يا بنيّ كريم، لنلعب لعبة صغيرة. أقول بالنغوكو، وأنت تحوّلها إلى كراما.
        en: Karim, my boy, a little game. I say it in ngoko, you turn it into krama.
      - speaker: Pak Harjo
        text: "Aku durung mangan."
        ar_eg: «أنا لسه ماكلتش».
        ar: «لم آكل بعد».
        en: '"I haven''t eaten yet."'
      - speaker: Karim
        text: Kula dereng nedha.
        ar_eg: «أنا لسه ماكلتش» (كراما).
        ar: «لم آكل بعد» (كراما).
        en: I haven't eaten yet (krama).
      - speaker: Pak Harjo
        text: Sae! "Aku arep lunga menyang masjid."
        ar_eg: حلو! «أنا رايح الجامع».
        ar: جيّد! «سأذهب إلى المسجد».
        en: Good! "I'm going to the mosque."
      - speaker: Karim
        text: Kula... badhe kesah dhateng masjid.
        ar_eg: أنا... رايح الجامع (كراما).
        ar: أنا... سأذهب إلى المسجد (كراما).
        en: I... am going to the mosque (krama).
        note:
          ar_eg: arep = badhe، lunga = kesah، menyang = dhateng (لـ)، وing / neng = wonten (في). كل الكلمات الصغيّرة ليها نسخة كراما.
          ar: arep = badhe، وlunga = kesah، وmenyang = dhateng (إلى)، وing / neng = wonten (في). لكلّ الكلمات الصغيرة نسخة كراما.
          en: arep = badhe, lunga = kesah, menyang = dhateng (to), and ing / neng = wonten (at). All the little words have a krama twin.
      - speaker: Pak Harjo
        text: Leres! Pungkasan. "Ora ana kopi."
        ar_eg: صحّ! آخر واحدة. «مافيش قهوة».
        ar: صحيح! الأخيرة. «لا توجد قهوة».
        en: Correct! Last one. "There's no coffee."
      - speaker: Karim
        text: Mboten wonten kopi... Lho, saestu, Pak? Mboten wonten?
        ar_eg: مافيش قهوة... إيه، بجدّ يا پاك؟ مافيش خالص؟
        ar: لا توجد قهوة... ماذا، حقًّا يا باك؟ لا توجد أبدًا؟
        en: There's no coffee... Wait, really, Pak? None at all?
      - speaker: Bu Harjo
        text: Hahaha! Wonten, Nak. Kula damelaken sakmenika.
        ar_eg: ههههه! فيه يا ابني. هعملهولك دلوقتي.
        ar: ههههه! توجد يا بنيّ. سأعدّها لك الآن.
        en: Hahaha! There is, my boy. I'll make you some right now.
new_words:
  - word: dereng
    pos: particle
    ar_eg: لسه ما (كراما durung)
    ar: لم بعد (كراما durung)
    en: not yet (krama)
  - word: badhe
    pos: particle
    ar_eg: هـ / ناوي (كراما arep)
    ar: سوف (كراما arep)
    en: going to (krama)
  - word: mboten
    pos: particle
    ar_eg: لأ / مش (كراما ora)
    ar: لا (كراما ora)
    en: not, no (krama)
  - word: wonten
    pos: verb
    ar_eg: فيه / موجود (كراما ana)
    ar: يوجد (كراما ana)
    en: there is, at (krama)
  - word: dhateng
    pos: preposition
    ar_eg: لـ / رايح (كراما)
    ar: إلى (كراما)
    en: to (krama)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: پاك هارجو كان فين لما كريم وصل؟
      ar: أين كان باك هارجو حين وصل كريم؟
      en: Where was Pak Harjo when Karim arrived?
    options: ["wonten peken", "wonten masjid", "wonten Madiun"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Kula ___ nedha.
    meaning:
      ar_eg: أنا لسه ماكلتش.
      ar: لم آكل بعد.
      en: I haven't eaten yet.
    answers: [dereng]
    options: ["dereng", "durung", "sampun"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: «Ora ana» بالكراما إيه؟
      ar: ما «Ora ana» بالكراما؟
      en: What is "Ora ana" in krama?
    options: ["Mboten wonten", "Dereng wonten", "Mboten badhe"]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Kula badhe kesah dhateng masjid.
    answers_meaning:
      ar_eg: ["أنا رايح الجامع.", "أنا هروح الجامع."]
      ar: ["سأذهب إلى المسجد.", "أنا ذاهب إلى المسجد."]
      en: ["I'm going to the mosque.", "I will go to the mosque."]
next:
  ar_eg: پاك هارجو بيبعت كريم يجيب حاجة من عند صاحبه پاك ويريو قرب قصر پاكوالامان. بس كريم بيتوه... ولازم يسأل على الطريق بالكراما.
  ar: يرسل باك هارجو كريمًا لإحضار شيء من صديقه باك ويريو قرب قصر باكوالامان. لكنّ كريمًا يضيع... ويجب أن يسأل عن الطريق بالكراما.
  en: Pak Harjo sends Karim to fetch something from his friend Pak Wiryo near the Pakualaman palace. But Karim gets lost... and has to ask the way in krama.
review:
  status: draft
  verified: false
  notes: Kula nuwun / mangga door etiquette, krama function words per j3.u03. Bu Harjo using "Bapak" for her husband is common. Check "dadosaken" (make into) and "damelaken" (make for).
