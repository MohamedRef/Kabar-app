questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: قلعة قايتباي اتبنت فين؟
      ar: أين بُنيت قلعة قايتباي؟
      en: Where was Qaitbay Citadel built?
    options: ["di dekat Stasiun Ramses", "di tempat Mercusuar Aleksandria", "di atas bukit di Kairo"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Anginnya ___, ombaknya besar!
    meaning:
      ar_eg: الهوا شديد والموج عالي!
      ar: الريح شديدة والموج عالٍ!
      en: The wind's strong and the waves are huge!
    answers: [kencang]
    options: ["deras", "tinggi", "kencang"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: نادية شايفة إيه الأثر السلبي للسياحة في إسكندرية؟
      ar: ما الأثر السلبي للسياحة في الإسكندرية بحسب نادية؟
      en: What negative impact of tourism does Nadia mention?
    options: ["Harga ikan terlalu murah.", "Tidak ada lapangan kerja.", "Kereta selalu terlambat.", "Pantai penuh sampah dan jalan macet."]
    answer: 3
  - id: q04
    type: listen
    text: Wisatawan makan pecel di warung Bapak, lalu beli brem untuk oleh-oleh.
    question:
      ar_eg: السيّاح هيشتروا إيه هدايا؟
      ar: ماذا سيشتري السيّاح هدايا؟
      en: What will the tourists buy as souvenirs?
    options: ["brem", "pecel", "ikan", "kerupuk"]
    answer: 0
    meaning:
      ar_eg: السيّاح ياكلوا بيچيل في وارونج بابا، وبعدين يشتروا بريم هدايا.
      ar: يأكل السيّاح البيتشيل في وارونغ أبي، ثم يشترون البريم هدايا.
      en: Tourists eat pecel at Dad's warung, then buy brem as souvenirs.
  - id: q05
    type: translate
    direction: from_target
    source_text: Pariwisata membuka banyak lapangan kerja.
    answers_meaning:
      ar_eg: ["السياحة بتفتح فرص شغل كتير.", "السياحة بتعمل شغل لناس كتير.", "السياحة بتوفّر فرص عمل كتير."]
      ar: ["السياحة توفّر فرص عمل كثيرة.", "تفتح السياحة فرص عمل كثيرة.", "تخلق السياحة وظائف كثيرة."]
      en: ["Tourism creates lots of jobs.", "Tourism opens up many job opportunities.", "Tourism provides a lot of employment."]
next:
  ar_eg: پاك بودي بيقول «أكيد خدت الدوا»... بس العلبة لسه مليانة في الشنطة. وفي القطر الراجع للقاهرة، راسه بقت تقيلة.
  ar: يقول باك بودي «بالتأكيد أخذت الدواء»... لكن العلبة ما زالت ممتلئة في الحقيبة. وفي قطار العودة إلى القاهرة، يثقل رأسه.
  en: Pak Budi says "of course I took it"... but the pill box in his bag is still full. And on the train back to Cairo, his head feels heavy.
