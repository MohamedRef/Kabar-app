title:
  target: Satu Hari di Aleksandria
  ar_eg: يوم في إسكندرية
  ar: يوم في الإسكندرية
  en: A Day in Alexandria
summary:
  ar_eg: كريم بيعمل رحلة يوم واحد لإسكندرية للعيلة، وهو المرشد. پاك بودي بيشوف البحر المتوسط لأول مرة، وعلى السمك على الكورنيش الكل بيتناقش - السياحة نافعة ولا ضارّة؟ وممكن ماديون تجذب سيّاح؟
  ar: ينظّم كريم للعائلة رحلة يوم واحد إلى الإسكندرية ويكون مرشدها. يرى باك بودي البحر المتوسط لأول مرة، وعلى مائدة السمك في الكورنيش يتناقش الجميع - هل السياحة نافعة أم ضارّة؟ وهل تستطيع ماديون جذب السيّاح؟
  en: Karim takes the family on a day trip to Alexandria as their guide. Pak Budi sees the Mediterranean for the first time, and over fish on the Corniche everyone debates - is tourism good or bad? And could Madiun attract tourists?
cast: [Karim, Bu Rahayu, Pak Budi, Sari, Nadia]
scenes:
  - setting:
      ar_eg: قلعة قايتباي في إسكندرية، الصبح بعد ما وصلوا بالقطر من محطة رمسيس. الهوا شديد والموج عالي.
      ar: قلعة قايتباي في الإسكندرية، صباحًا بعد الوصول بالقطار من محطة رمسيس. الريح شديدة والموج عالٍ.
      en: Qaitbay Citadel in Alexandria, in the morning, after the train from Ramses Station. The wind is strong and the waves are high.
    lines:
      - speaker: Narrator
        text: Pagi-pagi mereka naik kereta dari Stasiun Ramses. Tiga jam kemudian, mereka sampai di Aleksandria.
        ar_eg: الصبح بدري ركبوا القطر من محطة رمسيس. وبعد تلات ساعات وصلوا إسكندرية.
        ar: في الصباح الباكر ركبوا القطار من محطة رمسيس، وبعد ثلاث ساعات وصلوا إلى الإسكندرية.
        en: Early in the morning they took the train from Ramses Station. Three hours later, they reached Alexandria.
      - speaker: Karim
        text: Bapak-Ibu, selamat datang di tur "Aleksandria Satu Hari". Pemandu wisata Anda hari ini... saya sendiri!
        ar_eg: يا جماعة، أهلًا بيكم في رحلة «إسكندرية في يوم». المرشد السياحي بتاعكم النهارده... أنا شخصيًا!
        ar: سيداتي سادتي، مرحبًا بكم في جولة «الإسكندرية في يوم». مرشدكم السياحي اليوم... أنا بنفسي!
        en: Ladies and gentlemen, welcome to the "Alexandria in a Day" tour. Your tour guide today is... yours truly!
      - speaker: Bu Rahayu
        text: Wah, Mas Karim sudah seperti pemandu profesional.
        ar_eg: الله! ماس كريم بقى زي المرشدين المحترفين.
        ar: رائع! صار ماس كريم كالمرشد المحترف.
        en: Wow, Mas Karim's like a real professional guide.
      - speaker: Karim
        text: Ini tiket masuknya. Benteng Qaitbay dibangun di tempat Mercusuar Aleksandria, salah satu dari tujuh keajaiban dunia kuno.
        ar_eg: دي تذاكر الدخول. قلعة قايتباي اتبنت مكان فنار إسكندرية، واحد من عجايب الدنيا السبع القديمة.
        ar: هذه تذاكر الدخول. بُنيت قلعة قايتباي في موضع منارة الإسكندرية، إحدى عجائب الدنيا السبع القديمة.
        en: Here are the entrance tickets. Qaitbay Citadel was built where the Lighthouse of Alexandria stood, one of the seven wonders of the ancient world.
        note:
          ar_eg: السلطان المملوكي قايتباي بنى القلعة في القرن ١٥ مكان الفنار القديم اللي وقع من الزلازل. وmercusuar (فنار) - وmenara كمان ممكن تعني فنار.
          ar: بنى السلطان المملوكي قايتباي القلعة في القرن الخامس عشر في موضع المنارة القديمة التي هدمتها الزلازل. وmercusuar تعني منارة السفن.
          en: The Mamluk sultan Qaitbay built the citadel in the 15th century where the ancient lighthouse had fallen in earthquakes. mercusuar means lighthouse.
      - speaker: Pak Budi
        text: Masyaallah... lautnya biru sekali. Anginnya kencang, ombaknya besar!
        ar_eg: ما شاء الله... البحر أزرق أوي. الهوا شديد والموج عالي!
        ar: ما شاء الله... البحر أزرق جدًّا. الريح شديدة والموج عالٍ!
        en: Masyaallah... the sea is so blue. The wind's strong and the waves are huge!
        note:
          ar_eg: كلمات بتمشي مع بعض (kolokasi) - angin kencang (هوا شديد) مش angin keras، وombak besar (موج عالي)، وhujan deras (مطر جامد). احفظهم كده على طول.
          ar: كلمات متلازمة (kolokasi) - angin kencang (ريح شديدة) لا angin keras، وombak besar (موج عالٍ)، وhujan deras (مطر غزير). احفظها أزواجًا.
          en: 'Collocations (kolokasi): angin kencang (strong wind), not angin keras; ombak besar (big waves); hujan deras (heavy rain). Learn them as pairs.'
      - speaker: Sari
        text: Bapak belum pernah melihat laut seperti ini, ya?
        ar_eg: انت عمرك ما شفت بحر زي ده، صح يا بابا؟
        ar: لم ترَ بحرًا كهذا من قبل، أليس كذلك يا أبي؟
        en: You've never seen a sea like this, have you, Dad?
      - speaker: Pak Budi
        text: Madiun kan tidak punya laut, Nduk. Paling jauh Bapak ke pantai di Pacitan, waktu Bapak masih muda.
        ar_eg: ما ماديون مالهاش بحر يا بنتي. أبعد حاجة رحتها شطّ في پاچيتان، وأنا لسه شاب.
        ar: ماديون لا بحر فيها يا ابنتي. أبعد ما ذهبت إليه شاطئ في باتشيتان حين كنت شابًّا.
        en: Madiun has no sea, sweetheart. The furthest I went was a beach in Pacitan, when I was young.
        note:
          ar_eg: ماديون بعيدة عن البحر. وپاچيتان منطقة على ساحل المحيط الهندي جنوب ماديون، مشهورة بشطوطها وكهوفها.
          ar: ماديون بعيدة عن البحر. وباتشيتان منطقة على ساحل المحيط الهندي جنوب ماديون، تشتهر بشواطئها وكهوفها.
          en: Madiun is inland. Pacitan, south of it on the Indian Ocean coast, is known for its beaches and caves.
      - speaker: Nadia
        text: Ingat, Sari? Kita pernah liburan di sini. Waktu itu hadiah ulang tahun Pak Budi belum sampai!
        ar_eg: فاكرة يا ساري؟ احنا اتفسّحنا هنا قبل كده. ساعتها هدية عيد ميلاد پاك بودي مكانتش وصلت!
        ar: أتذكرين يا ساري؟ قضينا عطلة هنا من قبل، وحينها لم تكن هدية عيد ميلاد باك بودي قد وصلت!
        en: Remember, Sari? We had a holiday here once. Pak Budi's birthday present hadn't arrived yet!
      - speaker: Pak Budi
        text: Hadiah yang paling bagus datang hari ini. Bapak bisa melihat laut ini bersama kalian.
        ar_eg: أحلى هدية جت النهارده. إني أشوف البحر ده معاكم.
        ar: أجمل هدية جاءت اليوم - أن أرى هذا البحر معكم.
        en: The best present has come today. Seeing this sea with all of you.
  - setting:
      ar_eg: وقت المغرب، مطعم سمك على الكورنيش. الشمس بتغطس في البحر.
      ar: وقت الغروب، في مطعم سمك على الكورنيش. الشمس تغرق في البحر.
      en: Sunset at a fish restaurant on the Corniche. The sun is sinking into the sea.
    lines:
      - speaker: Pak Budi
        text: Ikannya segar sekali. Tapi Mas Karim, harganya tidak selangit, kan?
        ar_eg: السمك طازة أوي. بس يا ماس كريم، أسعاره مش في السما، صح؟
        ar: السمك طازج جدًّا. لكن يا ماس كريم، أسعاره ليست خيالية، أليس كذلك؟
        en: The fish is so fresh. But Mas Karim, the prices aren't sky-high, are they?
      - speaker: Karim
        text: Tenang, Pak. Saya sudah menawar. Restoran ini ramai karena menarik wisatawan lokal, bukan hanya turis asing.
        ar_eg: اطمّن يا پاك. أنا فاصلت. المطعم ده زحمة عشان بيجذب السيّاح المصريين، مش بس الأجانب.
        ar: اطمئنّ يا باك. لقد ساومت. هذا المطعم مزدحم لأنه يجذب السيّاح المحليين، لا الأجانب فقط.
        en: Don't worry, Pak. I've haggled. This place is busy because it attracts local tourists, not just foreigners.
      - speaker: Bu Rahayu
        text: Pariwisata itu bagus, ya. Membuka banyak lapangan kerja, seperti pekerjaan Mas Karim.
        ar_eg: السياحة حاجة حلوة. بتفتح فرص شغل كتير، زي شغل ماس كريم.
        ar: السياحة أمر جيّد. فهي تفتح فرص عمل كثيرة، مثل عمل ماس كريم.
        en: Tourism's a good thing, isn't it. It creates lots of jobs, like Mas Karim's.
        note:
          ar_eg: كمان kolokasi - membuka lapangan kerja (يفتح فرص شغل)، menarik wisatawan (يجذب سيّاح)، dampak positif / negatif (أثر إيجابي / سلبي).
          ar: ومن المتلازمات أيضًا - membuka lapangan kerja (يوفّر فرص العمل)، menarik wisatawan (يجذب السيّاح)، dampak positif / negatif (أثر إيجابي / سلبي).
          en: 'More collocations: membuka lapangan kerja (create jobs), menarik wisatawan (attract tourists), dampak positif / negatif (positive / negative impact).'
      - speaker: Nadia
        text: Tapi ada dampak negatifnya juga, Bu. Di musim panas, pantainya penuh sampah dan jalannya macet total.
        ar_eg: بس ليها أثر سلبي كمان يا بو. في الصيف، الشطّ بيتملي زبالة والشوارع بتتقفل خالص.
        ar: لكن لها أثرًا سلبيًّا أيضًا يا بو. ففي الصيف يمتلئ الشاطئ بالقمامة وتختنق الشوارع بالزحام.
        en: But there's a downside too, Bu. In summer the beach fills with rubbish and the traffic is total gridlock.
      - speaker: Pak Budi
        text: Bagaimana kalau Madiun juga menarik wisatawan? Pecel Madiun kan sudah terkenal.
        ar_eg: إيه رأيكم لو ماديون كمان جذبت سيّاح؟ ما البيچيل بتاع ماديون مشهور أصلًا.
        ar: ما رأيكم لو جذبت ماديون السيّاح أيضًا؟ فالبيتشيل الماديوني مشهور أصلًا.
        en: What if Madiun attracted tourists too? Madiun pecel is famous already.
      - speaker: Sari
        text: Paket wisata "Pecel dan Brem"! Wisatawan makan pecel di warung Bapak, lalu beli brem untuk oleh-oleh.
        ar_eg: رحلة «بيچيل وبريم»! السيّاح ياكلوا بيچيل في وارونج بابا، وبعدين يشتروا بريم هدايا.
        ar: رحلة «بيتشيل وبريم»! يأكل السيّاح البيتشيل في وارونغ أبي، ثم يشترون البريم هدايا.
        en: The "Pecel and Brem" tour package! Tourists eat pecel at Dad's warung, then buy brem as souvenirs.
        note:
          ar_eg: ماديون اسمها «Kota Pecel» (مدينة البيچيل). وbrem حلوى من الرز المخمّر، أشهر حاجة بتتشترى من منطقة ماديون. وoleh-oleh هي الهدايا اللي بتجيبها من السفر.
          ar: تُلقّب ماديون بـ «Kota Pecel» (مدينة البيتشيل). وbrem حلوى من الأرز المخمّر، أشهر ما يُشترى من منطقة ماديون. وoleh-oleh هدايا السفر.
          en: Madiun is nicknamed "Kota Pecel" (Pecel City). Brem is a sweet made from fermented rice, the area's best-known souvenir. oleh-oleh are gifts you bring back from a trip.
      - speaker: Karim
        text: Saya mau jadi pemandunya. Saya sudah hafal semua jalan di gang Pak Budi!
        ar_eg: أنا عايز أبقى المرشد. أنا حافظ كل شوارع حارة پاك بودي!
        ar: أريد أن أكون المرشد. فأنا أحفظ كلّ دروب زقاق باك بودي!
        en: I want to be the guide. I know every corner of Pak Budi's lane by heart!
      - speaker: Bu Rahayu
        text: Mas Karim ini sudah seperti keluarga sendiri.
        ar_eg: ماس كريم ده بقى زي واحد من العيلة.
        ar: صار ماس كريم كأنه واحد من العائلة.
        en: Mas Karim's practically family by now.
      - speaker: Pak Budi
        text: Aduh, hari ini panas sekali... Kepala Bapak agak pusing.
        ar_eg: يوه، النهارده حرّ أوي... راسي داخت شوية.
        ar: آه، الجوّ حارّ جدًّا اليوم... أشعر بدوار خفيف.
        en: Phew, it's so hot today... My head's a bit dizzy.
      - speaker: Sari
        text: Bapak sudah minum obat dari Dokter Wulan, kan?
        ar_eg: انت خدت دوا الدكتورة وولان، صح يا بابا؟
        ar: لقد أخذت دواء الدكتورة وولان، أليس كذلك يا أبي؟
        en: You've taken Dr Wulan's medicine, haven't you, Dad?
