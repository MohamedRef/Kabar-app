title:
  target: Hadiah untuk Bapak
  ar_eg: هدية لبابا
  ar: هدية لأبي
  en: A Present for Dad
summary:
  ar_eg: پاك بودي هيكمّل خمسين سنة يوم السبت. في القاهرة، ساري ونادية بيدوّروا على هدية في خان الخليلي، وبيحسبوا فرق الساعات بين القاهرة وماديون.
  ar: يبلغ باك بودي الخمسين يوم السبت. وفي القاهرة تبحث ساري ونادية عن هدية في خان الخليلي، وتحسبان فرق التوقيت بين القاهرة وماديون.
  en: Pak Budi turns fifty on Saturday. In Cairo, Sari and Nadia hunt for a present in Khan el-Khalili and work out the time difference between Cairo and Madiun.
cast: [Pak Budi, Mas Joko, Sari, Nadia]
scenes:
  - setting:
      ar_eg: الوارونج في ماديون، الصبح. ماس جوكو خلّص فطاره وعايز يدفع.
      ar: الوارونغ في ماديون صباحًا. أنهى ماس جوكو فطوره ويريد أن يدفع.
      en: The warung in Madiun, in the morning. Mas Joko has finished breakfast and wants to pay.
    lines:
      - speaker: Mas Joko
        text: Pak, pecel satu, kopi satu. Berapa, Pak?
        ar_eg: يا پاك، طبق پيتشل وقهوة. الحساب كام؟
        ar: يا باك، طبق بيتشل وقهوة. كم الحساب؟
        en: Pak, one pecel and one coffee. How much is it?
        note:
          ar_eg: الپيتشل (pecel) أشهر أكلة في ماديون، خضار مسلوقة بصوص فول سوداني حرّاق شوية.
          ar: البيتشل (pecel) أشهر أكلات ماديون، وهو خضار مسلوقة بصلصة الفول السوداني الحارّة قليلًا.
          en: Pecel is Madiun's most famous dish — blanched vegetables with a slightly spicy peanut sauce.
      - speaker: Pak Budi
        text: Pecel dua belas ribu, kopi tiga ribu. Semua lima belas ribu, Mas.
        ar_eg: الپيتشل بـ١٢ ألف، والقهوة بـ٣ آلاف. الكل ١٥ ألف يا ماس.
        ar: البيتشل باثني عشر ألفًا، والقهوة بثلاثة آلاف. المجموع خمسة عشر ألفًا يا ماس.
        en: Pecel is twelve thousand, coffee three thousand. Fifteen thousand altogether, Mas.
        note:
          ar_eg: الأسعار بالروبية. ١٥٬٠٠٠ روبية حاجة بسيطة، تقريبًا تمن فطار شعبي.
          ar: الأسعار بالروبية، و١٥٬٠٠٠ روبية مبلغ بسيط يقارب ثمن فطور شعبي.
          en: Prices are in rupiah; 15,000 rupiah is roughly the price of a simple street breakfast.
      - speaker: Mas Joko
        text: Ini, Pak. Makasih. Pak, hari Sabtu ulang tahun Bapak, ya?
        ar_eg: اتفضل يا پاك. شكرًا. يا پاك، يوم السبت عيد ميلادك، صح؟
        ar: تفضّل يا باك. شكرًا. يا باك، يوم السبت عيد ميلادك، أليس كذلك؟
        en: Here you go, Pak. Thanks. Pak, Saturday's your birthday, right?
        note:
          ar_eg: makasih = terima kasih (شكرًا) في الكلام العادي. وya في آخر الجملة زي «صح؟».
          ar: makasih = terima kasih (شكرًا) في الكلام اليومي. وya في آخر الجملة بمعنى «أليس كذلك؟».
          en: makasih = terima kasih (thanks) in everyday speech. ya at the end works like "right?".
      - speaker: Pak Budi
        text: Iya. Umur saya lima puluh tahun!
        ar_eg: أيوه. هكمّل خمسين سنة!
        ar: نعم. سأبلغ الخمسين من عمري!
        en: Yes. I'll be fifty!
      - speaker: Mas Joko
        text: Wah, lima puluh! Pesta di warung, Pak?
        ar_eg: خمسين! هنعمل حفلة في الوارونج يا پاك؟
        ar: خمسون! أستقام حفلة في الوارونغ يا باك؟
        en: Fifty! A party at the warung, Pak?
      - speaker: Pak Budi
        text: Pesta kecil aja. Tapi Sari di Kairo...
        ar_eg: حفلة صغيرة بس. بس ساري في القاهرة...
        ar: حفلة صغيرة فقط. لكن ساري في القاهرة...
        en: Just a small party. But Sari is in Cairo...
        note:
          ar_eg: aja = saja (بس / فقط)، دي اللي بتسمعها في الشارع.
          ar: aja = saja (فقط)، وهي الصيغة المسموعة في الشارع.
          en: aja = saja (just, only) — the form you'll hear in the street.
  - setting:
      ar_eg: القاهرة، خان الخليلي. ساري ونادية قدّام محل قماش.
      ar: القاهرة، خان الخليلي. ساري ونادية أمام متجر أقمشة.
      en: Cairo, Khan el-Khalili bazaar. Sari and Nadia stop at a fabric shop.
    lines:
      - speaker: Sari
        text: Nadia, hari Sabtu bapakku ulang tahun. Aku mau beli hadiah.
        ar_eg: يا نادية، يوم السبت عيد ميلاد بابا. عايزة أشتري هدية.
        ar: يا نادية، يوم السبت عيد ميلاد أبي. أريد أن أشتري هدية.
        en: Nadia, Saturday is my dad's birthday. I want to buy a present.
      - speaker: Nadia
        text: Ini bagus, Sari! Kain Mesir buat Pak Budi.
        ar_eg: دي حلوة يا ساري! قماشة مصري لپاك بودي.
        ar: هذه جميلة يا ساري! قماش مصري لباك بودي.
        en: This one's nice, Sari! Egyptian cloth for Pak Budi.
        note:
          ar_eg: bagus («حلو/كويس») هتتعلمها في الوحدة ٥. وbuat = untuk (عشان / لـ) في الكلام. والقماشة دي ممكن تبقى شال قطن مصري.
          ar: bagus («جميل/جيد») ستتعلّمها في الوحدة الخامسة. وbuat = untuk (لـ) في الكلام اليومي. والقماش هنا قد يكون شالًا من القطن المصري.
          en: bagus ("nice, good") comes properly in Unit 5. buat = untuk (for) in everyday speech. The cloth could be a shawl of Egyptian cotton.
      - speaker: Sari
        text: Berapa harganya?
        ar_eg: بكام؟
        ar: كم ثمنها؟
        en: How much is it?
      - speaker: Nadia
        text: Dua ratus pound.
        ar_eg: بـ٢٠٠ جنيه.
        ar: بمئتي جنيه.
        en: Two hundred pounds.
        note:
          ar_eg: نادية سألت البيّاع بالعربي وترجمت. الجنيه المصري بالإندونيسي «pound Mesir».
          ar: سألت نادية البائع بالعربية وترجمت. ويُسمّى الجنيه المصري بالإندونيسية «pound Mesir».
          en: Nadia asked the seller in Arabic and translated. The Egyptian pound is "pound Mesir" in Indonesian.
      - speaker: Sari
        text: Dua ratus? Mahal banget!
        ar_eg: ميتين؟ غالية أوي!
        ar: مئتان؟ غالية جدًا!
        en: Two hundred? That's expensive!
      - speaker: Nadia
        text: Seratus lima puluh. Murah!
        ar_eg: ميّة وخمسين. رخيصة!
        ar: مئة وخمسون. رخيصة!
        en: One hundred and fifty. Cheap!
        note:
          ar_eg: نادية فاصلت البيّاع بالمصري؛ «آخر كلام يا حاج؟». الفصال في خان الخليلي حاجة طبيعية.
          ar: ساومت نادية البائع باللهجة المصرية قائلة «آخر كلام يا حاج؟»؛ فالمساومة في خان الخليلي أمر عادي.
          en: Nadia haggled in Egyptian Arabic — "akher kalam ya Hagg?" (final price?). Haggling is normal in Khan el-Khalili.
  - setting:
      ar_eg: في الشارع بعد الشرا. ساري ماسكة الهدية وبتبص في الساعة.
      ar: في الشارع بعد الشراء. ساري تحمل الهدية وتنظر إلى الساعة.
      en: Outside, after shopping. Sari holds the present and checks the time.
    lines:
      - speaker: Sari
        text: Sekarang jam berapa di Madiun?
        ar_eg: الساعة كام دلوقتي في ماديون؟
        ar: كم الساعة الآن في ماديون؟
        en: What time is it in Madiun now?
      - speaker: Nadia
        text: Di Kairo jam sepuluh pagi. Di Madiun jam tiga sore.
        ar_eg: في القاهرة الساعة عشرة الصبح. في ماديون الساعة تلاتة العصر.
        ar: في القاهرة الساعة العاشرة صباحًا، وفي ماديون الثالثة عصرًا.
        en: In Cairo it's ten in the morning. In Madiun it's three in the afternoon.
      - speaker: Sari
        text: Hari ini hari Senin. Hadiahnya datang hari Sabtu, nggak?
        ar_eg: النهارده الاتنين. يا ترى الهدية توصل يوم السبت؟
        ar: اليوم الاثنين. هل تصل الهدية يوم السبت؟
        en: Today is Monday. Will the present get there by Saturday?
        note:
          ar_eg: Senin جاية من «الاثنين» وSabtu من «السبت»، أيام الأسبوع الإندونيسي أغلبها عربي! وnggak = tidak (لأ / مش)؛ «..., nggak?» في الآخر زي «ولا لأ؟».
          ar: Senin من «الاثنين» وSabtu من «السبت»؛ فمعظم أسماء أيام الأسبوع الإندونيسية عربية الأصل! وnggak = tidak (لا) في الكلام، و«..., nggak?» في آخر السؤال بمعنى «أم لا؟».
          en: Senin comes from Arabic «الاثنين» and Sabtu from «السبت» — most Indonesian weekday names are Arabic! nggak = tidak (no, not) in speech; "..., nggak?" at the end means "or not?".
      - speaker: Nadia
        text: Hmm... Senin, Selasa, Rabu, Kamis, Jumat, Sabtu...
        ar_eg: امممم... الاتنين، التلات، الأربع، الخميس، الجمعة، السبت...
        ar: همم... الاثنين، الثلاثاء، الأربعاء، الخميس، الجمعة، السبت...
        en: Hmm... Monday, Tuesday, Wednesday, Thursday, Friday, Saturday...
new_words:
  - word: pecel
    pos: noun
    ar_eg: پيتشل، خضار مسلوقة بصوص فول سوداني (أكلة ماديون المشهورة)
    ar: بيتشل، خضار مسلوقة بصلصة الفول السوداني (أكلة ماديون الشهيرة)
    en: pecel, blanched vegetables with peanut sauce (Madiun's signature dish)
  - word: bagus
    pos: adjective
    ar_eg: حلو، كويس
    ar: جميل، جيد
    en: nice, good
  - word: pound
    pos: noun
    ar_eg: جنيه (pound Mesir = الجنيه المصري)
    ar: جنيه (pound Mesir = الجنيه المصري)
    en: pound (pound Mesir = Egyptian pound)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الپيتشل بكام في وارونج پاك بودي؟
      ar: كم سعر البيتشل في وارونغ باك بودي؟
      en: How much is pecel at Pak Budi's warung?
    options: ["dua belas ribu", "tiga ribu", "lima belas ribu"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Umur saya lima ___ tahun!
    meaning:
      ar_eg: هكمّل خمسين سنة!
      ar: سأبلغ الخمسين من عمري!
      en: I'll be fifty!
    answers: [puluh]
    options: ["puluh", "belas", "ratus"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: عيد ميلاد پاك بودي إمتى؟
      ar: متى عيد ميلاد باك بودي؟
      en: When is Pak Budi's birthday?
    options: ["hari Sabtu", "hari Senin", "hari Jumat"]
    answer: 0
  - id: q04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الساعة كام دلوقتي؟
      ar: كم الساعة الآن؟
      en: What time is it now?
    answers: ["Sekarang jam berapa?", "Jam berapa sekarang?", "Sekarang pukul berapa?", "Pukul berapa sekarang?", "Sekarang jam berapa", "Jam berapa sekarang"]
next:
  ar_eg: السبت جه! ساري ونادية في إسكندرية، وفي ماديون حفلة صغيرة في الوارونج... بس هل الهدية وصلت؟
  ar: جاء السبت! ساري ونادية في الإسكندرية، وفي ماديون حفلة صغيرة في الوارونغ... لكن هل وصلت الهدية؟
  en: Saturday is here! Sari and Nadia are in Alexandria, there's a little party at the warung in Madiun... but did the present arrive?
