series: sinetron
episode: 99
language: jv
level: j5
unlock_after: j5.u04
title:
  target: Postinganmu viral, Mas!
  ar_eg: البوست بتاعك اتنشر في كل حتّة يا ماس!
  ar: منشورك انتشر يا ماس!
  en: Your post went viral, Mas!
summary:
  ar_eg: من متحف القطورات في أمباراوا، كريم بينزّل أول بوست ليه بالجاوي. التعليقات بتيجي بالجاوي والإندونيسي والإنجليزي متلخبطين، وماس يودا من جوجا بيبعت فويس نوت فيه تلات لغات. مباك أيو بتعلّم كريم يفكّ الكلام ده كلمة كلمة.
  ar: من متحف القطارات في أمباراوا ينشر كريم أوّل منشور له بالجاوية. تنهال التعليقات بالجاوية والإندونيسية والإنجليزية مختلطة، ويرسل ماس يودا من جوغجا رسالة صوتية بثلاث لغات. وتعلّم مباك أيو كريمًا تفكيك هذا الكلام كلمةً كلمة.
  en: From the Ambarawa railway museum, Karim makes his first Javanese post. The comments pour in, mixing Javanese, Indonesian and English, and Mas Yudha in Jogja sends a voice note in three languages. Mbak Ayu teaches Karim to untangle it word by word.
cast: [Karim, Mbak Ayu, Mas Yudha]
scenes:
  - setting:
      ar_eg: متحف القطورات في أمباراوا، الصبح. قطورات بخار قديمة سودا على القضبان، وجبال خضرا وراها. كريم بيصوّر سيلفي.
      ar: متحف القطارات في أمباراوا، صباحًا. قاطرات بخارية سوداء قديمة على القضبان، وخلفها جبال خضراء. يلتقط كريم صورة سيلفي.
      en: The Ambarawa railway museum, morning. Old black steam locomotives on the tracks, green mountains behind. Karim takes a selfie.
    lines:
      - speaker: Karim
        text: Mbak, iki captionku. "Dolan neng museum sepur Ambarawa. Sepure lawas banget, but so cool!"
        ar_eg: يا مباك، دي الكابشن بتاعتي. «فسحة في متحف القطورات في أمباراوا. القطورات قديمة أوي، but so cool!»
        ar: يا مباك، هذا تعليقي. «نزهة في متحف القطارات في أمباراوا. القطارات قديمة جدًّا، but so cool!»
        en: Mbak, here's my caption. "Visiting the Ambarawa railway museum. The trains are so old, but so cool!"
      - speaker: Mbak Ayu
        text: Hahaha! Sampeyan wis campur kode kaya bocah Madiun.
        ar_eg: ههههه! انت بقيت بتخلط اللغات زي ولاد ماديون.
        ar: ههههه! صرت تخلط اللغات مثل شباب ماديون.
        en: Hahaha! You're code-mixing like a Madiun kid already.
        note:
          ar_eg: campur kode = خلط اللغات في نفس الجملة. أغلب الجاوي على النت كده - جاوي، إندونيسي، إنجليزي، وساعات عربي.
          ar: campur kode = خلط اللغات في الجملة الواحدة. ومعظم الجاوية على الإنترنت هكذا - جاوية وإندونيسية وإنجليزية، وأحيانًا عربية.
          en: campur kode = code-mixing within a sentence. Most Javanese online is like this - Javanese, Indonesian, English, sometimes Arabic.
      - speaker: Narrator
        text: Sejam sabanjure. Ana sewu like. Postingane Karim wis dishare atusan wong.
        ar_eg: بعد ساعة. ألف لايك. بوست كريم اتشيّر من مئات الناس.
        ar: بعد ساعة. ألف إعجاب. شارك مئات الأشخاص منشور كريم.
        en: An hour later. A thousand likes. Karim's post has been shared by hundreds of people.
        note:
          ar_eg: dishare - فعل إنجليزي (share) بإضافة جاوي/إندونيسي (di-) يعني «اتشيّر». زي ما بنقول بالمصري «اتشيّر» بالظبط!
          ar: dishare - فعل إنجليزيّ (share) بسابقة جاوية/إندونيسية (di-)، بمعنى «تمّت مشاركته». تمامًا مثل «اتشيّر» بالعامّية المصرية!
          en: dishare - an English verb (share) with a Javanese/Indonesian prefix (di-), "got shared". Just like Egyptians say "ets-shayyar"!
      - speaker: Mbak Ayu
        text: Wacanen komentare. "Wah Mase keren pol, basa Jawane lancar!"
        ar_eg: اقرا التعليقات. «واو الأستاذ جامد موت، جاويّه طلق!»
        ar: اقرأ التعليقات. «رائع، الأستاذ مذهل جدًّا، جاويّته طليقة!»
        en: Read the comments. "Wow, this guy's awesome, his Javanese is fluent!"
      - speaker: Karim
        text: Keren iku Indonesia, pol iku Jawa, lancar iku... loro-lorone?
        ar_eg: «keren» إندونيسي، «pol» جاوي، و«lancar»... الاتنين؟
        ar: «keren» إندونيسية، و«pol» جاوية، و«lancar»... كلتاهما؟
        en: Keren is Indonesian, pol is Javanese, lancar is... both?
      - speaker: Mbak Ayu
        text: Pinter! Lan "basa Jawane" - basa Jawa plus "-ne" Jawa.
        ar_eg: شاطر! و«basa Jawane» - «basa Jawa» زائد «-ne» بتاعة الجاوي.
        ar: ممتاز! و«basa Jawane» - «basa Jawa» زائد «-ne» الجاوية.
        en: Clever! And "basa Jawane" - basa Jawa plus Javanese "-ne".
  - setting:
      ar_eg: تليفون كريم بيرنّ - فويس نوت من ماس يودا، الطالب اللي قابله في جوجا.
      ar: يرنّ هاتف كريم - رسالة صوتية من ماس يودا، الطالب الذي التقاه في جوغجا.
      en: Karim's phone buzzes - a voice note from Mas Yudha, the student he met in Jogja.
    lines:
      - speaker: Mas Yudha
        text: Mas Karim! Aku liat postinganmu, apik tenan! Next time nek neng Jogja, kabari ya. Tak traktir gudeg!
        ar_eg: يا ماس كريم! شفت البوست بتاعك، حلو بجدّ! المرّة الجاية لو جيت جوجا، قولّي. عليّا الجوديج!
        ar: يا ماس كريم! رأيت منشورك، رائع حقًّا! في المرّة القادمة إن جئت جوغجا، أخبرني. الغوديغ على حسابي!
        en: Mas Karim! I saw your post, it's great! Next time you're in Jogja, let me know. Gudeg's on me!
        note:
          ar_eg: جملة يودا فيها تلات لغات - liat وpostingan (إندونيسي شباب)، next time (إنجليزي)، nek وkabari وtak traktir (جاوي). وgudeg أكلة جوجا المشهورة، جاك فروت مطبوخ حلو.
          ar: في جملة يودا ثلاث لغات - liat وpostingan (إندونيسية الشباب)، وnext time (إنجليزية)، وnek وkabari وtak traktir (جاوية). والغوديغ طبق جوغجا الشهير، من الجاك فروت المطبوخ الحلو.
          en: Yudha's sentence has three languages - liat and postingan (young Indonesian), next time (English), nek, kabari, tak traktir (Javanese). Gudeg is Jogja's famous sweet jackfruit stew.
      - speaker: Karim
        text: Mbak, aku ngerti kabeh! Nanging "liat" iku apa? Dudu Jawa, ta?
        ar_eg: يا مباك، أنا فاهم كل حاجة! بس «liat» يعني إيه؟ مش جاوي، صح؟
        ar: يا مباك، فهمت كلّ شيء! لكن ما «liat»؟ ليست جاوية، أليس كذلك؟
        en: Mbak, I understand it all! But what's "liat"? Not Javanese, is it?
      - speaker: Mbak Ayu
        text: Dudu. "Liat" iku "lihat" Indonesia, cara cekak. Basa Jawane "weruh" utawa "ndeleng".
        ar_eg: لأ. «liat» هي «lihat» بالإندونيسي، مختصرة. بالجاوي «weruh» أو «ndeleng».
        ar: لا. «liat» هي «lihat» الإندونيسية مختصرة. وبالجاوية «weruh» أو «ndeleng».
        en: No. "Liat" is Indonesian "lihat", shortened. In Javanese it's "weruh" or "ndeleng".
      - speaker: Karim
        text: Saiki aku bisa ndeleng saben tembung, saka basa endi. Kaya detektif!
        ar_eg: دلوقتي أقدر أشوف كل كلمة جاية من أنهي لغة. زي المخبر!
        ar: الآن أستطيع أن أرى من أيّ لغة جاءت كلّ كلمة. مثل المحقّق!
        en: Now I can see which language every word comes from. Like a detective!
new_words:
  - word: campur kode
    pos: noun
    ar_eg: خلط اللغات
    ar: خلط اللغات
    en: code-mixing
  - word: dishare
    pos: verb
    ar_eg: اتشيّر
    ar: تمّت مشاركته
    en: shared (on social media)
  - word: kabari
    pos: verb
    ar_eg: قولّي / بلّغني
    ar: أخبرني
    en: let (me) know
  - word: traktir
    pos: verb
    ar_eg: يعزم (على حسابه)
    ar: يدعو على حسابه
    en: treat (someone, paying)
  - word: ndeleng
    pos: verb
    ar_eg: يشوف
    ar: يرى
    en: look, see
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: في «Wah Mase keren pol»، أنهي كلمة جاوي؟
      ar: في «Wah Mase keren pol»، أيّ كلمة جاوية؟
      en: In "Wah Mase keren pol", which word is Javanese?
    options: ["keren", "pol", "Wah"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Postingane Karim wis ___ atusan wong.
    meaning:
      ar_eg: بوست كريم اتشيّر من مئات الناس.
      ar: شارك مئات الأشخاص منشور كريم.
      en: Karim's post has been shared by hundreds of people.
    answers: [dishare]
    options: ["dishare", "share", "nge-share"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: يودا عايز يعزم كريم على إيه؟
      ar: على ماذا يريد يودا أن يدعو كريمًا؟
      en: What does Yudha want to treat Karim to?
    options: ["rawon", "gudeg", "pecel"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Nek neng Jogja, kabari ya.
    answers_meaning:
      ar_eg: ["لو جيت جوجا، قولّي.", "لو رحت جوجا بلّغني."]
      ar: ["إن جئت جوغجا، أخبرني.", "إذا كنت في جوغجا فأخبرني."]
      en: ["If you're in Jogja, let me know.", "Let me know when you're in Jogja."]
next:
  ar_eg: في قدس، مباك أيو بتحكي لكريم قصّة قصيّرة جاوي عن المنارة اللي شكلها معبد... وكريم بيلاحظ إن القصص الجاوي ليها كلمات بتربط الأحداث - banjur، nuli، sawise...
  ar: في قدس، تحكي مباك أيو لكريم قصّة جاوية قصيرة عن المئذنة التي تشبه المعبد... ويلاحظ كريم أنّ للقصص الجاوية كلمات تربط الأحداث - banjur وnuli وsawise...
  en: In Kudus, Mbak Ayu tells Karim a Javanese short story about the minaret that looks like a temple... and Karim notices Javanese stories have words that link events - banjur, nuli, sawise...
review:
  status: draft
  verified: false
  notes: Mas Yudha's code-mixed voice note matches j5.u04. Ambarawa's museum keeps old steam locomotives (and a rack railway) - left general. Check "Postinganmu viral". Yudha now lives in Jogja (Kotabaru, see e72), so Surabaya/rawon became Jogja/gudeg (2026-10-27).
