language: id
level: bipa2
unlock_after: bipa2.u04
title:
  target: Boleh Kurang, Bu?
  ar_eg: ممكن تنزّلي شوية؟
  ar: هل يمكن أن تخفّضي السعر؟
  en: Can You Go Lower?
summary:
  ar_eg: بو راهايو وبايو في سوق ماديون بيشتروا حاجات الكولاك وبيفاصلوا، وبايو قلقان على أبوه. وفي القاهرة نادية بتفاصل في فانوس لبايو.
  ar: تشتري بو راهايو وبايو مستلزمات الكولاك في سوق ماديون ويساومان، وبايو قلق على أبيه. وفي القاهرة تساوم نادية على فانوس لبايو.
  en: Bu Rahayu and Bayu shop for kolak ingredients at Madiun market and haggle, and Bayu worries about his dad. In Cairo, Nadia haggles over a fanous for Bayu.
cast: [Bu Rahayu, Bayu, Bu Sri, Nadia, Sari]
scenes:
  - setting:
      ar_eg: السوق الكبير في ماديون الصبح. زحمة ستّات بيشتروا حاجات الفطار.
      ar: السوق الكبير في ماديون صباحًا، مزدحم بنساء يشترين مستلزمات الإفطار.
      en: Madiun's big market in the morning, busy with people buying iftar supplies.
    lines:
      - speaker: Narrator
        text: Pasar Madiun. Pagi. Bu Rahayu dan Bayu belanja untuk takjil.
        ar_eg: سوق ماديون. الصبح. بو راهايو وبايو بيشتروا حاجات التعجيل.
        ar: سوق ماديون. صباحًا. تتسوّق بو راهايو وبايو لأجل التعجيل.
        en: Madiun market. Morning. Bu Rahayu and Bayu are shopping for takjil.
      - speaker: Bu Rahayu
        text: Bu Sri, kelapanya berapa?
        ar_eg: يا بو سري، جوز الهند بكام؟
        ar: يا بو سري، بكم جوز الهند؟
        en: Bu Sri, how much are the coconuts?
      - speaker: Bu Sri
        text: Sebuah sepuluh ribu, Bu.
        ar_eg: الواحدة بعشرة آلاف يا بو.
        ar: الواحدة بعشرة آلاف يا بو.
        en: Ten thousand each, Bu.
        note:
          ar_eg: sebuah = se (واحد) + buah - «بُوَه» دي كلمة عدّ للحاجات المدوّرة والحاجات عمومًا. sebuah kelapa يعني «جوزة هند واحدة».
          ar: sebuah = se (واحد) + buah، وbuah مُعدِّد للأشياء المستديرة وللأشياء عمومًا. sebuah kelapa تعني «جوزة هند واحدة».
          en: sebuah = se (one) + buah, the classifier for round things and things in general. sebuah kelapa = one coconut.
      - speaker: Bu Rahayu
        text: Boleh kurang, Bu? Dua buah lima belas ribu?
        ar_eg: ممكن تنزّلي يا بو؟ الاتنين بخمستاشر ألف؟
        ar: هل يمكن أن تخفّضي يا بو؟ الاثنتان بخمسة عشر ألفًا؟
        en: Can you go lower, Bu? Two for fifteen thousand?
      - speaker: Bu Sri
        text: Aduh, rugi, Bu! Dua buah delapan belas ribu.
        ar_eg: يا ساتر، كده أخسر يا بو! الاتنين بتمنتاشر ألف.
        ar: آه، سأخسر يا بو! الاثنتان بثمانية عشر ألفًا.
        en: Oh no, I'd lose money, Bu! Two for eighteen thousand.
      - speaker: Bu Rahayu
        text: Ya sudah. Dan pisang dua kilo, gula merah tiga bungkus.
        ar_eg: خلاص ماشي. وكمان ٢ كيلو موز، و٣ أكياس سكر نخل.
        ar: حسنًا، لا بأس. وأيضًا كيلوان من الموز وثلاثة أكياس من سكّر النخيل.
        en: All right then. And two kilos of bananas, three packs of palm sugar.
        note:
          ar_eg: الفصال في السوق الشعبي عادي ومتوقّع، بس بابتسامة. «Ya sudah» يعني «خلاص، ماشي» لما بتقبل.
          ar: المساومة في السوق الشعبي عادية ومتوقّعة، لكن بابتسامة. و«Ya sudah» تعني «حسنًا، لا بأس» عند القبول.
          en: Haggling at a traditional market is expected, but with a smile. "Ya sudah" = "okay then" when you accept.
      - speaker: Bayu
        text: Bu, jangan lupa kurma!
        ar_eg: ماما، متنسيش التمر!
        ar: أمي، لا تنسي التمر!
        en: Mum, don't forget the dates!
      - speaker: Bayu
        text: Bu, mengapa Bapak tidak ke pasar?
        ar_eg: ماما، هو بابا مجاش السوق ليه؟
        ar: أمي، لماذا لم يأتِ أبي إلى السوق؟
        en: Mum, why didn't Dad come to the market?
      - speaker: Bu Rahayu
        text: Karena Bapak capek, Le. Bapak tidur.
        ar_eg: عشان بابا تعبان يا ابني. بابا نايم.
        ar: لأن أباك متعب يا بنيّ. إنه نائم.
        en: Because Dad's tired, son. He's asleep.
      - speaker: Bayu
        text: Bapak sering capek sekarang. Saya khawatir, Bu.
        ar_eg: بابا بقى بيتعب كتير. أنا قلقان يا ماما.
        ar: صار أبي يتعب كثيرًا. أنا قلق يا أمي.
        en: Dad's tired a lot now. I'm worried, Mum.
      - speaker: Bu Rahayu
        text: Jangan khawatir, Le. Ayo, kita pulang.
        ar_eg: متقلقش يا ابني. يلا نروّح.
        ar: لا تقلق يا بنيّ. هيّا نعود إلى البيت.
        en: Don't worry, son. Come on, let's go home.
  - setting:
      ar_eg: القاهرة بالليل بعد التراويح، في سوق فوانيس في السيدة زينب.
      ar: القاهرة ليلًا بعد صلاة التراويح، في سوق للفوانيس في حيّ السيدة زينب.
      en: Cairo at night after tarawih prayers, at a lantern market in Sayeda Zeinab.
    lines:
      - speaker: Nadia
        text: Ayo, Sari! Kita beli fanous untuk Bayu.
        ar_eg: يلا يا ساري! نشتري فانوس لبايو.
        ar: هيّا يا ساري! لنشترِ فانوسًا لبايو.
        en: Come on, Sari! Let's buy a fanous for Bayu.
      - speaker: Sari
        text: Yang biru itu sebesar yang merah.
        ar_eg: الأزرق ده قدّ الأحمر بالظبط.
        ar: ذلك الأزرق بحجم الأحمر.
        en: That blue one is as big as the red one.
        note:
          ar_eg: se- + صفة = «قدّ / زيّ»، sebesar يعني «قدّ ... في الكِبَر»، وsemahal يعني «غالي زيّ».
          ar: se- مع الصفة تفيد المساواة، فـ sebesar تعني «بحجم»، وsemahal تعني «بغلاء».
          en: se- + adjective = "as … as". sebesar = as big as, semahal = as expensive as.
      - speaker: Nadia
        text: Ya, sama besar. Tapi yang biru lebih murah. Seratus pound.
        ar_eg: آه، نفس الحجم. بس الأزرق أرخص. بمية جنيه.
        ar: نعم، بالحجم نفسه. لكن الأزرق أرخص، بمئة جنيه.
        en: Yes, the same size. But the blue one is cheaper. A hundred pounds.
      - speaker: Narrator
        text: Nadia menawar dalam bahasa Arab. Lama sekali!
        ar_eg: نادية فاصلت بالعربي. وقت طويل أوي!
        ar: ساومت نادية بالعربية، واستغرق ذلك وقتًا طويلًا جدًّا!
        en: Nadia haggles in Arabic. For ages!
      - speaker: Nadia
        text: Tujuh puluh pound. Harga pas!
        ar_eg: سبعين جنيه. ده آخر سعر!
        ar: سبعون جنيهًا. هذا السعر النهائي!
        en: Seventy pounds. Final price!
      - speaker: Sari
        text: Nadia hebat! Saya mau mengirim fanous ini ke Madiun.
        ar_eg: نادية جامدة! أنا عايزة أبعت الفانوس ده لماديون.
        ar: نادية رائعة! أريد أن أرسل هذا الفانوس إلى ماديون.
        en: Nadia, you're amazing! I want to send this fanous to Madiun.
      - speaker: Nadia
        text: Jangan kirim, Sari. Mahal! Bawa ke Madiun nanti.
        ar_eg: متبعتيهوش يا ساري. غالي! خديه معاكي ماديون بعدين.
        ar: لا ترسليه يا ساري، فهذا غالٍ! خذيه معك إلى ماديون لاحقًا.
        en: Don't send it, Sari. Too expensive! Take it to Madiun yourself later.
      - speaker: Sari
        text: Tiket ke Madiun semahal seribu fanous!
        ar_eg: تذكرة ماديون غالية قدّ ألف فانوس!
        ar: تذكرة ماديون بثمن ألف فانوس!
        en: A ticket to Madiun costs as much as a thousand fanous!
