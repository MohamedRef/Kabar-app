questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: بو راهايو اشترت جوزتين الهند بكام في الآخر؟
      ar: بكم اشترت بو راهايو جوزتي الهند في النهاية؟
      en: In the end, how much does Bu Rahayu pay for two coconuts?
    options: ["sepuluh ribu", "lima belas ribu", "dua puluh ribu", "delapan belas ribu"]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Bu, jangan ___ kurma!
    meaning:
      ar_eg: ماما، متنسيش التمر!
      ar: أمي، لا تنسي التمر!
      en: Mum, don't forget the dates!
    answers: [lupa]
    options: ["lupa", "khawatir", "pulang"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: پاك بودي مجاش السوق ليه؟
      ar: لماذا لم يأتِ باك بودي إلى السوق؟
      en: Why didn't Pak Budi come to the market?
    options: ["Karena Bapak sedang bekerja di warung.", "Karena Bapak capek dan tidur.", "Karena Bapak ke masjid."]
    answer: 1
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: الفانوس الأزرق والأحمر مقارنين ببعض إزاي؟
      ar: كيف يقارَن الفانوس الأزرق بالأحمر؟
      en: How do the blue and red fanous compare?
    options: ["Yang biru lebih besar.", "Yang merah lebih murah.", "Sama besar, tapi yang biru lebih murah."]
    answer: 2
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ممكن تنزّل السعر شوية؟
      ar: هل يمكن أن تخفّض السعر قليلًا؟
      en: Can you go a bit lower?
    answers: ["Boleh kurang?", "Boleh kurang, Bu?", "Boleh kurang, Pak?", "Boleh kurang sedikit?", "Bisa kurang?", "Bisa kurang sedikit?", "Boleh kurang", "Bisa kurang"]
next:
  ar_eg: پاك بودي بيعلّم بايو وكريم وصفة الكولاك بتاعته... بس في نص الطبخ بيحصل حاجة بتقلق الكل.
  ar: يعلّم باك بودي بايو وكريمًا وصفة الكولاك الخاصة به... لكن في منتصف الطبخ يحدث أمر يُقلق الجميع.
  en: Pak Budi teaches Bayu and Karim his kolak recipe... but halfway through the cooking, something happens that worries everyone.
