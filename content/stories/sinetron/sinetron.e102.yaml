title:
  target: Ha na ca ra ka
  ar_eg: ها نا تشا را كا
  ar: ها نا تشا را كا
  en: Ha na ca ra ka
summary:
  ar_eg: في كوتاجيدي، بلد الفضّة، باك سلامت بينقش اسم كريم على قطعة فضّة بالحروف الجاوي - ꦏꦫꦶꦩ꧀. وبيحكيله إن ترتيب الأبجدية الجاوي نفسه قصيدة - حكاية آجي ساكا ورسولين وفيّين ماتوا الاتنين عشان الأمانة.
  ar: في كوتاغيدي، بلدة الفضّة، ينقش باك سلامت اسم كريم على قطعة فضّة بالحروف الجاوية - ꦏꦫꦶꦩ꧀. ويحكي له أنّ ترتيب الأبجدية الجاوية نفسه قصيدة - حكاية آجي ساكا ورسولين وفيّين ماتا كلاهما وفاءً للأمانة.
  en: In Kotagede, the silver town, Pak Slamet engraves Karim's name on a piece of silver in Javanese script - ꦏꦫꦶꦩ꧀. And he tells him that the order of the Javanese alphabet is itself a poem - the tale of Aji Saka and two loyal messengers who both died keeping their word.
cast: [Karim, Pak Slamet]
scenes:
  - setting:
      ar_eg: ورشة باك سلامت جنب سوق كوتاجيدي، الصبح. صوت شاكوش صغيّر على الفضّة. حيطان خشب قديمة، وعلى الترابيزة أدوات نقش.
      ar: ورشة باك سلامت قرب سوق كوتاغيدي، صباحًا. صوت مطرقة صغيرة على الفضّة. جدران خشبية قديمة، وعلى الطاولة أدوات نقش.
      en: Pak Slamet's workshop by Kotagede market, in the morning. The tap of a small hammer on silver. Old wooden walls, engraving tools on the table.
    lines:
      - speaker: Pak Slamet
        text: Mas Karim! Pungkasane rawuh ugi. Mangga lenggah.
        ar_eg: ماس كريم! وصلت أخيرًا. اتفضّل اقعد.
        ar: ماس كريم! وصلت أخيرًا. تفضّل بالجلوس.
        en: Mas Karim! You've come at last. Please, have a seat.
      - speaker: Karim
        text: Matur nuwun, Pak. Kula badhe sinau aksara Jawa. Kangge bab pungkasan buku kula.
        ar_eg: متشكّر يا باك. عايز أتعلّم الحروف الجاوي. عشان آخر فصل في كتابي.
        ar: شكرًا يا باك. أريد أن أتعلّم الحروف الجاوية. من أجل الفصل الأخير من كتابي.
        en: Thank you, Pak. I'd like to learn Javanese script. For the last chapter of my book.
        note:
          ar_eg: "كلمات: bab = فصل؛ موضوع."
          ar: "مفردات: bab = فصل؛ موضوع."
          en: "Words: bab = chapter; topic."
      - speaker: Pak Slamet
        text: Sae. Kula wiwiti saking asma panjenengan. Ka... ri... m.
        ar_eg: حلو. هبتدي باسمك. كا... ري... م.
        ar: جميل. سأبدأ باسمك. كا... ري... م.
        en: Good. I'll start with your name. Ka... ri... m.
        note:
          ar_eg: ꦏꦫꦶꦩ꧀ = Karim. ꦏ (ka) + ꦫ (ra) + ꦶ (علامة i اسمها wulu) = ri + ꦩ (ma) + ꧀ (pangkon، بتشيل الحركة) = m. زي العربي بالظبط - الحرف فيه حركة جوّاه، والسكون بيشيلها.
          ar: ꦏꦫꦶꦩ꧀ = Karim. ꦏ (ka) + ꦫ (ra) + ꦶ (علامة i واسمها wulu) = ri + ꦩ (ma) + ꧀ (pangkon، تحذف الحركة) = m. تمامًا كالعربية - في الحرف حركة كامنة، والسكون يحذفها.
          en: ꦏꦫꦶꦩ꧀ = Karim. ꦏ (ka) + ꦫ (ra) + ꦶ (the i mark, wulu) = ri + ꦩ (ma) + ꧀ (pangkon, which removes the vowel) = m. Just like Arabic - each letter carries a vowel, and a sukun-like mark takes it away.
      - speaker: Karim
        text: Saben aksara gadhah swanten "a" piyambak? Kados huruf Arab ingkang mawi fathah!
        ar_eg: كل حرف ليه صوت «a» لوحده؟ زي الحرف العربي اللي عليه فتحة!
        ar: لكلّ حرف صوت «a» من ذاته؟ مثل الحرف العربيّ الذي عليه فتحة!
        en: Every letter has its own "a" sound? Like an Arabic letter with a fatha!
        note:
          ar_eg: "كلمات: piyambak = بنفسه، لوحده (كراما)؛ fathah = فتحة؛ mawi = بـ، فيه (كراما)."
          ar: "مفردات: piyambak = بنفسه، وحده (كراما)؛ fathah = فتحة؛ mawi = بـ، مع (كراما)."
          en: "Words: piyambak = oneself, alone (krama); fathah = fatha (Arabic vowel mark); mawi = with (krama)."
      - speaker: Pak Slamet
        text: Leres! Aksara Jawa wonten kalih dasa. Ha na ca ra ka, da ta sa wa la, pa dha ja ya nya, ma ga ba tha nga.
        ar_eg: صحّ! الحروف الجاوي عشرين. ها نا تشا را كا، دا تا سا وا لا، با دها جا يا نيا، ما جا با ثا نجا.
        ar: صحيح! الحروف الجاوية عشرون. ها نا تشا را كا، دا تا سا وا لا، با ذها جا يا نيا، ما غا با ثا نغا.
        en: Right! There are twenty Javanese letters. Ha na ca ra ka, da ta sa wa la, pa dha ja ya nya, ma ga ba tha nga.
        note:
          ar_eg: "ꦲꦤꦕꦫꦏ ꦢꦠꦱꦮꦭ ꦥꦝꦗꦪꦚ ꦩꦒꦧꦛꦔ - العشرين حرف الأساسيين (aksara nglegena). خلّي بالك - في آخر الكلمة الـ«a» بتتنطق قريب من «o» زي ما اتعلّمت في سيمارانج. كلمات: ba, ca, da, dha, ga, ha, ja, la, na, nga, nya = أسماء حروف جاوية."
          ar: "ꦲꦤꦕꦫꦏ ꦢꦠꦱꦮꦭ ꦥꦝꦗꦪꦚ ꦩꦒꦧꦛꦔ - الحروف الأساسية العشرون (aksara nglegena). وانتبه - في آخر الكلمة تُنطق «a» قريبة من «o» كما تعلّمت في سيمارانغ. مفردات: ba, ca, da, dha, ga, ha, ja, la, na, nga, nya = أسماء حروف جاوية."
          en: "ꦲꦤꦕꦫꦏ ꦢꦠꦱꦮꦭ ꦥꦝꦗꦪꦚ ꦩꦒꦧꦛꦔ - the twenty base letters (aksara nglegena). Remember - at the end of a word the \"a\" sounds close to \"o\", as you learned in Semarang. Words: ba, ca, da, dha, ga, ha, ja, la, na, nga, nya = names of Javanese letters."
  - setting:
      ar_eg: باك سلامت بيحطّ القطعة الفضّة اللي عليها اسم كريم قدّامه، وبيحكي بصوت واطي.
      ar: يضع باك سلامت قطعة الفضّة المنقوش عليها اسم كريم أمامه، ويحكي بصوت خافت.
      en: Pak Slamet sets the silver piece with Karim's name before him and tells the story softly.
    lines:
      - speaker: Pak Slamet
        text: Urutan aksara punika sejatosipun geguritan. Wonten satunggaling ratu, asmanipun Aji Saka.
        ar_eg: "ترتيب الحروف ده في الحقيقة قصيدة. كان فيه ملك اسمه آجي ساكا."
        ar: "ترتيب هذه الحروف في الحقيقة قصيدة. كان هناك ملك اسمه آجي ساكا."
        en: "The order of these letters is really a poem. There was once a king named Aji Saka."
        note:
          ar_eg: "كلمات: aji = قيمة؛ ajining = قيمة الـ…؛ geguritan = شعر جاوي حديث."
          ar: "مفردات: aji = قيمة؛ ajining = قيمةُ…؛ geguritan = شعر جاوي حديث."
          en: "Words: aji = worth, value; ajining = the worth of = nilai, harga; geguritan = modern Javanese poem."
      - speaker: Pak Slamet
        text: Aji Saka gadhah abdi kalih, Dora lan Sembada. Sembada dipunparingi pusaka, lan dipundhawuhi, "Sampun ngantos dipunparingaken dhateng sinten kemawon, kajaba kula piyambak."
        ar_eg: آجي ساكا كان عنده خدّامين اتنين، دورا وسيمبادا. سيمبادا اتسلّم سلاح مقدّس، واتقاله «ماتدّيهوش لأيّ حدّ، غير ليّا أنا بنفسي».
        ar: كان لآجي ساكا خادمان، دورا وسيمبادا. سُلّم سيمبادا سلاحًا مقدّسًا، وقيل له «لا تعطه لأحد إلّا لي أنا بنفسي».
        en: Aji Saka had two servants, Dora and Sembada. Sembada was given a sacred heirloom and told, "Don't hand it to anyone, except me myself."
        note:
          ar_eg: "كلمات: dipundhawuhi = اتأمر، اتقاله (كراما)؛ dipunparingaken = اتدّى، اتحطّ (كراما)؛ dipunparingi = اتدّاله (كراما)؛ kajaba = إلا، ما عدا."
          ar: "مفردات: dipundhawuhi = أُمر (كراما)؛ dipunparingaken = أُعطي، وُضع (كراما)؛ dipunparingi = أُعطي (كراما)؛ kajaba = إلا، باستثناء."
          en: "Words: dipundhawuhi = was told, ordered (krama); dipunparingaken = given, added (krama); dipunparingi = was given (krama); kajaba = except, unless."
      - speaker: Pak Slamet
        text: Lajeng Aji Saka ngutus Dora mendhet pusaka punika. Sembada mboten purun. Dora mboten purun wangsul tanpa pusaka.
        ar_eg: وبعدين آجي ساكا بعت دورا ياخد السلاح. سيمبادا رفض يدّيه. ودورا رفض يرجع من غيره.
        ar: ثمّ أرسل آجي ساكا دورا ليأخذ السلاح. رفض سيمبادا أن يعطيه. ورفض دورا أن يعود من دونه.
        en: Then Aji Saka sent Dora to fetch the heirloom. Sembada refused. Dora refused to go back without it.
        note:
          ar_eg: "كلمات: mendhet = ياخد، يجيب (كراما)."
          ar: "مفردات: mendhet = يأخذ، يجلب (كراما)."
          en: "Words: mendhet = to fetch, take (krama)."
      - speaker: Karim
        text: Kalihipun setya... lajeng?
        ar_eg: الاتنين وفيّين... وبعدين؟
        ar: كلاهما وفيّ... ثمّ؟
        en: Both were loyal... and then?
      - speaker: Pak Slamet
        text: "Sami-sami santosa, sami-sami pejah. \"Ha na ca ra ka, da ta sa wa la, pa dha ja ya nya, ma ga ba tha nga.\""
        ar_eg: الاتنين كانوا قويّين قدّ بعض، والاتنين ماتوا. «كان فيه رسولين، اتخانقوا، كانوا أقويا زي بعض، وبصّ - الاتنين بقوا جثث».
        ar: كانا متساويين في القوّة، وماتا كلاهما. «كان هناك رسولان، تنازعا، تساويا قوّةً، وانظر - صارا جثّتين».
        en: They were equally strong, and both died. "There were two messengers, they quarrelled, they were equally powerful, and behold - both became corpses."
        note:
          ar_eg: الأبجدية الجاوي لو قريتها على أربع حتت بتطلع الحكاية دي - hana caraka (كان فيه رسولين)، data sawala (اتخانقوا)، padha jayanya (قوّتهم واحدة)، maga bathanga (وبقوا جثث). وآجي ساكا كتبها عشان يفتكرهم.
          ar: إن قرأت الأبجدية الجاوية على أربعة أجزاء ظهرت هذه الحكاية - hana caraka (كان هناك رسولان)، data sawala (تنازعا)، padha jayanya (تساويا قوّة)، maga bathanga (فصارا جثّتين). ويقال إنّ آجي ساكا كتبها تخليدًا لهما.
          en: Read the alphabet in four parts and you get the story - hana caraka (there were two messengers), data sawala (they quarrelled), padha jayanya (equally powerful), maga bathanga (they became corpses). Aji Saka is said to have written it in their memory.
      - speaker: Karim
        text: Saben aksara, satunggal crita. Kula mboten badhe kesupen.
        ar_eg: كل حرف، حكاية. مش هنسى أبدًا.
        ar: كلّ حرف، حكاية. لن أنسى أبدًا.
        en: Every letter, a story. I'll never forget.
