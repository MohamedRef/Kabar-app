questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الحروف الجاوي الأساسية كام؟
      ar: كم عدد الحروف الجاوية الأساسية؟
      en: How many Javanese base letters are there?
    options: ["kalih dasa", "tigang dasa", "sedasa"]
    answer: 0
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: مين خدّامين آجي ساكا؟
      ar: من خادما آجي ساكا؟
      en: Who were Aji Saka's two servants?
    options: ["Dora lan Sembada", "Petruk lan Gareng", "Rama lan Sinta"]
    answer: 0
  - id: q03
    type: fill_blank
    sentence: Hana caraka, data sawala, padha ___, maga bathanga.
    meaning:
      ar_eg: كان فيه رسولين، اتخانقوا، كانوا أقويا زي بعض، والاتنين بقوا جثث.
      ar: كان هناك رسولان، تنازعا، تساويا قوّة، فصارا جثّتين.
      en: There were two messengers, they quarrelled, they were equally powerful, and both became corpses.
    answers: [jayanya]
    options: ["jayanya", "caraka", "sawala"]
  - id: q04
    type: translate
    direction: from_target
    source_text: Saben aksara, satunggal crita.
    answers_meaning:
      ar_eg: ["كل حرف، حكاية.", "كل حرف وراه حكاية."]
      ar: ["كلّ حرف، حكاية."]
      en: ["Every letter, a story.", "Each letter is a story."]
next:
  ar_eg: باك سلامت بياخد كريم جامع كوتاجيدي الكبير، أقدم جامع في مملكة ماتارام. على البوّابة، كلمات مكتوبة بحروف جاوي عليها علامات صغيّرة فوق وتحت...
  ar: يأخذ باك سلامت كريمًا إلى مسجد كوتاغيدي الكبير، أقدم مساجد مملكة ماتارام. وعلى البوّابة كلمات بحروف جاوية عليها علامات صغيرة من فوق ومن تحت...
  en: Pak Slamet takes Karim to the Kotagede Grand Mosque, the oldest in the Mataram kingdom. On the gate, words in Javanese script with little marks above and below...
review:
  status: draft
  verified: false
  notes: ꦏꦫꦶꦩ꧀ (Karim) and the 20 nglegena letters need checking in a Javanese font. The Aji Saka story follows the common telling (Dora and Sembada); versions differ in detail.
