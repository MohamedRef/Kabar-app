series: sinetron
episode: 98
language: jv
level: j5
unlock_after: j5.u03
title:
  target: Loro utawa lara?
  ar_eg: «اتنين» ولّا «عيّان»؟
  ar: «اثنان» أم «مريض»؟
  en: Two, or sick?
summary:
  ar_eg: في ميدان سيمپانج ليما، مباك أيو بتراجع كتاب كريم بقلم أحمر. كريم كاتب الكلام زي ما بيسمعه - piro بدل pira، sego بدل sega... وجملة فيها «loro» بتقلب المعنى خالص. وبعدين لعبة ودان - d ولّا dh؟
  ar: في ساحة سيمبانغ ليما، تراجع مباك أيو كتاب كريم بقلم أحمر. كتب كريم الكلام كما يسمعه - piro بدل pira، وsego بدل sega... وجملة فيها «loro» تقلب المعنى تمامًا. ثمّ لعبة للأذن - d أم dh؟
  en: At Simpang Lima square, Mbak Ayu goes through Karim's book with a red pen. Karim has spelled everything by ear - piro for pira, sego for sega... and one sentence with "loro" turns the meaning upside down. Then an ear game - d or dh?
cast: [Karim, Mbak Ayu]
scenes:
  - setting:
      ar_eg: ميدان سيمپانج ليما في سيمارانج، العصر. عربيات أكل وعيال بيلعبوا. مباك أيو فاتحة كتاب كريم على رجليها، وفي إيدها قلم أحمر.
      ar: ساحة سيمبانغ ليما في سيمارانغ، عصرًا. عربات طعام وأطفال يلعبون. تفتح مباك أيو كتاب كريم على ركبتيها، وفي يدها قلم أحمر.
      en: Simpang Lima square in Semarang, late afternoon. Food carts, children playing. Mbak Ayu has Karim's book open on her knees and a red pen in her hand.
    lines:
      - speaker: Mbak Ayu
        text: Mas, iki ditulis "piro". Ejaan baku "pira".
        ar_eg: يا ماس، دي مكتوبة «piro». الإملاء الصحيح «pira».
        ar: يا ماس، هذه مكتوبة «piro». والإملاء الفصيح «pira».
        en: Mas, this is written "piro". The standard spelling is "pira".
      - speaker: Karim
        text: Nanging wong-wong ngomong "piro", Mbak!
        ar_eg: بس الناس بتقول «piro» يا مباك!
        ar: لكنّ الناس يقولون «piro» يا مباك!
        en: But people say "piro", Mbak!
      - speaker: Mbak Ayu
        text: Bener. Diucapake "o", nanging ditulis "a". Pira, sega, apa, lara.
        ar_eg: صحّ. بتتنطق «o»، بس بتتكتب «a». pira، sega، apa، lara.
        ar: صحيح. تُنطق «o»، لكنها تُكتب «a». pira، sega، apa، lara.
        en: Right. It's pronounced "o" but written "a". Pira, sega, apa, lara.
        note:
          ar_eg: في الجاوي الفصيح، الـ«a» في آخر الكلمة (وساعات قبل الآخر) بتتنطق قريبة من «و» مفتوحة - pira تتنطق «پيرو»، وsega «سيجو». بس في الكتابة الرسمية بتفضل «a». الشات بيكتب زي النطق.
          ar: في الجاوية الفصيحة تُنطق «a» في آخر الكلمة (وأحيانًا قبلها) قريبة من «و» مفتوحة - pira تُنطق «بيرو»، وsega «سيغو». لكنها تبقى «a» في الكتابة الرسمية، أمّا المحادثات فتكتب كما يُنطق.
          en: In standard Javanese, a final "a" (and sometimes the one before it) sounds like an open "o" - pira sounds "piro", sega "sego". Formal writing keeps "a"; chats spell by ear.
      - speaker: Mbak Ayu
        text: Lan iki, Mas. Sampeyan nulis, "Yen loro, ngombe jamu."
        ar_eg: وده يا ماس. انت كاتب «Yen loro, ngombe jamu».
        ar: وهذه يا ماس. كتبتَ «Yen loro, ngombe jamu».
        en: And this, Mas. You wrote, "Yen loro, ngombe jamu."
      - speaker: Karim
        text: Iya. "Yen lagi lara, ngombe jamu." Bener ta?
        ar_eg: أيوه. «لو عيّان، اشرب جامو». صحّ؟
        ar: نعم. «إن كنت مريضًا، فاشرب الجامو». صحيح؟
        en: Yes. "If you're sick, drink jamu." Right?
      - speaker: Mbak Ayu
        text: Hahaha! Sing sampeyan tulis tegese, "Yen loro, ngombe jamu" - "Yen ana wong loro, ngombe jamu!"
        ar_eg: ههههه! اللي انت كاتبه معناه «لو اتنين، اشربوا جامو» - «لو فيه اتنين، يشربوا جامو!»
        ar: ههههه! ما كتبته معناه «إن كانوا اثنين فليشربوا الجامو» - «إن وُجد شخصان، فليشربا الجامو!»
        en: Hahaha! What you wrote means "If two, drink jamu" - "If there are two people, they drink jamu!"
        note:
          ar_eg: lara (عيّان) وloro (اتنين) بيتنطقوا قريّبين جدًّا، بس بيتكتبوا مختلف. عشان كده الإملاء مهم. وjamu مشروب أعشاب تقليدي.
          ar: lara (مريض) وloro (اثنان) متقاربتان جدًّا في النطق، لكنهما تُكتبان مختلفتين. ولذلك الإملاء مهمّ. والجامو مشروب أعشاب تقليديّ.
          en: lara (sick) and loro (two) sound very close but are spelled differently. That's why spelling matters. Jamu is a traditional herbal drink.
  - setting:
      ar_eg: نفس الميدان بعد شويّة. مباك أيو بتلعب مع كريم لعبة الأزواج - بتقول كلمة، وهو يقول d ولّا dh.
      ar: الساحة نفسها بعد قليل. تلعب مباك أيو مع كريم لعبة الأزواج - تقول كلمة، ويقول هو d أم dh.
      en: The same square, a little later. Mbak Ayu plays a minimal-pairs game with Karim - she says a word, he says d or dh.
    lines:
      - speaker: Mbak Ayu
        text: Rungokna. "Wedi."
        ar_eg: اسمع. «Wedi».
        ar: اسمع. «Wedi».
        en: Listen. "Wedi."
      - speaker: Karim
        text: D! Wedi, tegese "takut".
        ar_eg: D! «wedi» يعني «خايف».
        ar: D! «wedi» تعني «خائف».
        en: D! Wedi means "afraid".
      - speaker: Mbak Ayu
        text: Bener. Saiki, "wedhi."
        ar_eg: صحّ. ودلوقتي، «wedhi».
        ar: صحيح. والآن، «wedhi».
        en: Right. Now, "wedhi."
      - speaker: Karim
        text: Dh... kaya "dzal" ing basa Arab?
        ar_eg: Dh... زي حرف «الذال» في العربي؟
        ar: Dh... مثل حرف «الذال» في العربية؟
        en: Dh... like Arabic "dhal"?
      - speaker: Mbak Ayu
        text: Dudu, Mas! Ilat munggah mburi, abot. Wedhi iku "pasir".
        ar_eg: لأ يا ماس! اللسان بيطلع لورا، والصوت تقيل. «wedhi» يعني «رملة».
        ar: لا يا ماس! يرتفع اللسان إلى الخلف، والصوت ثقيل. «wedhi» تعني «رمل».
        en: No, Mas! The tongue goes up and back, heavy. Wedhi means "sand".
        note:
          ar_eg: مهمّ جدًّا للعرب - dh وth في الجاوي مش «ذ» و«ث»! دول d وt بس اللسان مرفوع لورا شويّة (صوت تقيل). وd وt العاديين بطرف اللسان على السنان. wedi (خايف) ≠ wedhi (رملة).
          ar: مهمّ جدًّا للعرب - dh وth في الجاوية ليستا «ذ» و«ث»! بل d وt مع رفع اللسان إلى الخلف قليلًا (صوت ثقيل). أمّا d وt العاديّتان فبطرف اللسان على الأسنان. wedi (خائف) ≠ wedhi (رمل).
          en: Key for Arabic speakers - Javanese dh and th are NOT Arabic ذ and ث! They're d and t with the tongue curled up and back (a heavy sound). Plain d and t touch the teeth. wedi (afraid) ≠ wedhi (sand).
      - speaker: Karim
        text: Wedhi. Wedhi. Aku wedi wedhi!
        ar_eg: wedhi. wedhi. أنا خايف من الرملة!
        ar: wedhi. wedhi. أنا خائف من الرمل!
        en: Wedhi. Wedhi. I'm afraid of sand!
      - speaker: Mbak Ayu
        text: Hahaha! Wong Mesir wedi wedhi? Ora percaya!
        ar_eg: ههههه! مصري وخايف من الرملة؟ مش مصدّقة!
        ar: ههههه! مصريّ يخاف من الرمل؟ لا أصدّق!
        en: Hahaha! An Egyptian afraid of sand? I don't believe it!
