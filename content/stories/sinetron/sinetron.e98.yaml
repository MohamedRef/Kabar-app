questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الإملاء الصحيح لـ«piro» إيه؟
      ar: ما الإملاء الفصيح لـ«piro»؟
      en: What's the standard spelling of "piro"?
    options: ["pira", "piro", "pyra"]
    answer: 0
  - id: q02
    type: listen
    text: Wedhi
    question:
      ar_eg: سمعت أنهي كلمة؟
      ar: أيّ كلمة سمعت؟
      en: Which word did you hear?
    options: ["wedi", "wedhi"]
    answer: 1
    meaning:
      ar_eg: رملة
      ar: رمل
      en: sand
  - id: q03
    type: fill_blank
    sentence: Yen lagi ___, ngombe jamu.
    meaning:
      ar_eg: لو عيّان، اشرب جامو.
      ar: إن كنت مريضًا، فاشرب الجامو.
      en: If you're sick, drink jamu.
    answers: [lara]
    options: ["lara", "loro", "lori"]
  - id: q04
    type: translate
    direction: from_target
    source_text: Diucapake "o", nanging ditulis "a".
    answers_meaning:
      ar_eg: ["بتتنطق o، بس بتتكتب a.", "بنقولها o ونكتبها a."]
      ar: ["تُنطق o، لكنها تُكتب a."]
      en: ["It's pronounced o, but written a.", "Said with o, written with a."]
next:
  ar_eg: كريم بينزّل أول بوست ليه بالجاوي على إنستجرام من متحف القطورات في أمباراوا. والتعليقات بتيجي - جاوي وإندونيسي وإنجليزي في جملة واحدة!
  ar: ينشر كريم أوّل منشور له بالجاوية على إنستغرام من متحف القطارات في أمباراوا. وتنهال التعليقات - جاوية وإندونيسية وإنجليزية في جملة واحدة!
  en: Karim posts his first Javanese Instagram post from the Ambarawa railway museum. The comments pour in - Javanese, Indonesian and English in one sentence!
review:
  status: draft
  verified: false
  notes: wedi/wedhi and lara/loro are classic minimal pairs (j5.u03). The listen question plays "Wedhi" in the jv voice; check the TTS keeps the retroflex distinction. Note that dh/th are not Arabic interdentals.
