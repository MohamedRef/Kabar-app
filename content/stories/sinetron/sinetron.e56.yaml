language: id
level: bipa6
unlock_after: bipa6.u06
title:
  target: Kapan Undangan Ada?
  ar_eg: الدعوات هتبقى جاهزة إمتى؟
  ar: متى تجهز بطاقات الدعوة؟
  en: When Will the Invitations Be Ready?
summary:
  ar_eg: فاضل شهرين على الفرح والفوضى بدأت - بو تيني ضافت تلتمية ضيف، والقاعة اتحجزت لفرحين، وباك محمود بيسأل عن جمل للزفّة. وعلى بحيرة توبا، بايو بيقرا لكاك تيور مقاله الساخر عن الأفراح في إندونيسيا، وهي بتعلّمه إن السخرية سكّينة.
  ar: بقي شهران على العرس وبدأت الفوضى - أضافت بو تيني ثلاثمئة ضيف، وحُجزت القاعة لعرسين، ويسأل باك محمود عن جمل للزفّة. وعلى بحيرة توبا يقرأ بايو لكاك تيور مقاله الساخر عن الأعراس في إندونيسيا، فتعلّمه أنّ السخرية سكّين.
  en: Two months to the wedding, and chaos reigns - Bu Tini has added three hundred guests, the hall is double-booked, and Pak Mahmoud is asking about a camel for the zaffa. By Lake Toba, Bayu reads Kak Tiur his satirical column on Indonesian weddings, and she teaches him that satire is a knife.
cast: [Mas Joko, Pak Budi, Bu Rahayu, Bu Tini, Bayu, Kak Tiur]
scenes:
  - setting:
      ar_eg: الوارونج بعد الضهر. باك بودي ماسك راسه، وموبايل ماس جوكو مش بيبطّل يرنّ من جروب الواتساب «العيلة الكبيرة».
      ar: الوارونغ بعد الظهر. باك بودي يمسك رأسه، وهاتف ماس جوكو لا يكفّ عن الرنين من مجموعة الواتساب «العائلة الكبيرة».
      en: The warung in the afternoon. Pak Budi is holding his head, and Mas Joko's phone won't stop pinging with the "Big Family" WhatsApp group.
    lines:
      - speaker: Narrator
        text: Dua bulan sebelum pernikahan. Sejak subuh, grup WhatsApp "Keluarga Besar" sudah berisi empat ratus dua belas pesan.
        ar_eg: فاضل شهرين على الفرح. ومن الفجر، جروب الواتساب «العيلة الكبيرة» فيه أربعمية واتناشر رسالة.
        ar: قبل العرس بشهرين. ومنذ الفجر امتلأت مجموعة الواتساب «العائلة الكبيرة» بأربعمئة واثنتي عشرة رسالة.
        en: Two months before the wedding. Since dawn, the "Big Family" WhatsApp group has racked up four hundred and twelve messages.
      - speaker: Mas Joko
        text: Ada pesan dari Bu Tini, Pak. "Pak Budi, saya tambahin 300 tamu ya. Teman pengajian, teman senam, sama teman SD saya."
        ar_eg: فيه رسالة من بو تيني يا باك. «يا باك بودي، أنا ضفت تلتمية ضيف. صحابي من درس الدين، وصحابي من الرياضة، وصحابي من الابتدائي.»
        ar: هناك رسالة من بو تيني يا باك - «يا باك بودي، أضفت ثلاثمئة ضيف؛ رفيقاتي في حلقة القرآن، وفي الرياضة، وفي المدرسة الابتدائية.»
        en: 'There''s a message from Bu Tini, Pak. "Pak Budi, I''ve added three hundred guests, okay? My Qur''an-study friends, my exercise-class friends and my primary-school friends."'
        note:
          ar_eg: tambahin = tambahkan (أزوّد) - بالـ -in زي ما الناس بتكتب في الشات. وpengajian = حلقة قرآن، وsenam = تمارين رياضة.
          ar: tambahin = tambahkan (أضيف) - اللاحقة -in كما يكتب الناس في المحادثات. وpengajian = حلقة تلاوة، وsenam = تمارين رياضية.
          en: tambahin = tambahkan (add) - the -in ending, the way people write in chats. pengajian = Qur'an-study group; senam = exercise class.
      - speaker: Pak Budi
        text: Tiga ratus? Bagus banget. Sekalian aja kita sewa stadion.
        ar_eg: تلتمية؟ يا سلام، حلو أوي. ما نأجّر الاستاد بقى وخلاص.
        ar: ثلاثمئة؟ رائع جدًّا. فلنستأجر الملعب إذن.
        en: Three hundred? Marvellous. We'll just hire the stadium, then.
        note:
          ar_eg: ده sarkasme (تريقة) - تقول «حلو أوي» وانت قصدك العكس خالص. وفي الإندونيسي اسمه برضه ironi لو المعنى معكوس من غير هجوم. والمصريين أبطال العالم في الحتّة دي - «يا سلام! ما تجيبوا الجيران كمان!»
          ar: هذا sarkasme (تهكّم) - أن تقول «رائع» وأنت تقصد العكس تمامًا. وتسمّى ironi إذا كان المعنى معكوسًا دون لسع. والمصريون أساتذة هذا الفنّ.
          en: That's sarkasme - saying "marvellous" when you mean the opposite. A gentler reversal is ironi. Egyptians are world champions at this.
      - speaker: Bu Rahayu
        text: Pak, jangan nyindir gitu, ah. Bu Tini udah di depan pintu.
        ar_eg: يا بودي، بلاش التلقيح ده. بو تيني واقفة على الباب.
        ar: يا باك، كفّ عن التلميح الساخر؛ بو تيني عند الباب.
        en: Pak, stop being snide. Bu Tini's at the door.
        note:
          ar_eg: nyindir = menyindir (يلقّح بالكلام)، gitu = begitu، udah = sudah - كلام البيت. وah في الآخر بتخفّف العتاب.
          ar: nyindir = menyindir (يلمّح ساخرًا)، وgitu = begitu، وudah = sudah - من كلام البيت. وah في آخر الجملة تلطّف العتاب.
          en: nyindir = menyindir (to make digs), gitu = begitu, udah = sudah - home talk. ah at the end softens the scolding.
      - speaker: Bu Tini
        text: Pak Budi, kalau nggak diundang, nanti mereka tersinggung. Di Madiun, kabar pernikahan lebih cepat daripada internet.
        ar_eg: يا باك بودي، لو معزمتهمش هيزعلوا. في ماديون، خبر الفرح بيجري أسرع من النت.
        ar: يا باك بودي، إن لم تدعُهم سيستاؤون. ففي ماديون ينتشر خبر العرس أسرع من الإنترنت.
        en: Pak Budi, if they're not invited, they'll be offended. In Madiun, wedding news travels faster than the internet.
        note:
          ar_eg: الأفراح في إندونيسيا كبيرة جدًا - الجيران وصحاب الشغل وناس كتير بيتعزموا. والضيوف (اسمهم tamu kondangan) بيدّوا ظرف فيه فلوس (amplop) - زي «النقطة» في الأفراح المصرية بالظبط.
          ar: الأعراس في إندونيسيا كبيرة جدًّا يُدعى إليها الجيران وزملاء العمل وخلق كثير. ويقدّم الضيوف (tamu kondangan) ظرفًا فيه نقود (amplop)، كـ«النقطة» في الأعراس المصرية.
          en: Indonesian weddings are huge - neighbours, colleagues, everyone is invited. Guests (tamu kondangan) hand over an envelope of money (amplop), much like the Egyptian nu'ta.
      - speaker: Bu Rahayu
        text: Pak, ada masalah lagi. Gedungnya dipesan dua kali. Hari Sabtu itu ada pernikahan lain juga.
        ar_eg: يا بودي، فيه مصيبة تانية. القاعة اتحجزت مرتين. يوم السبت ده فيه فرح تاني كمان.
        ar: يا باك، ثمّة مشكلة أخرى. حُجزت القاعة مرّتين، ففي ذلك السبت عرس آخر أيضًا.
        en: Pak, there's another problem. The hall's been booked twice. There's another wedding that Saturday too.
      - speaker: Mas Joko
        text: Bagus dong, Pak. Tamunya bisa dibagi dua. Yang lapar ke sini, yang kenyang ke sana.
        ar_eg: حلو يا باك. نقسم الضيوف نصّين. اللي جعان ييجي هنا، واللي شبعان يروح هناك.
        ar: ممتاز يا باك. نقسم الضيوف قسمين - الجائع يأتي إلى هنا، والشبعان يذهب إلى هناك.
        en: Great, Pak. We split the guests in two. The hungry ones come here, the full ones go there.
      - speaker: Pak Budi
        text: Mas Joko, ini bukan waktu untuk melawak.
        ar_eg: يا ماس جوكو، ده مش وقت هزار.
        ar: يا ماس جوكو، ليس هذا وقت المزاح.
        en: Mas Joko, this is no time for jokes.
      - speaker: Mas Joko
        text: Maaf, Pak. Satu lagi. Pak Mahmoud kirim pesan suara. Kata Karim, ayahnya tanya, "Di Madiun ada unta buat zaffa, nggak?"
        ar_eg: آسف يا باك. حاجة كمان. باك محمود بعت فويس. كريم بيقول إن أبوه بيسأل - «هو في ماديون فيه جمل للزفّة؟»
        ar: عذرًا يا باك. أمر أخير. أرسل باك محمود رسالة صوتية، ويقول كريم إنّ أباه يسأل - «أفي ماديون جمل للزفّة؟»
        en: 'Sorry, Pak. One more. Pak Mahmoud sent a voice note. Karim says his father''s asking, "Is there a camel in Madiun for the zaffa?"'
        note:
          ar_eg: tanya = bertanya (يسأل) في الكلام. وunta = جمل.
          ar: tanya = bertanya (يسأل) في الكلام اليومي. وunta = جمل.
          en: tanya = bertanya (to ask) in speech. unta = camel.
      - speaker: Pak Budi
        text: Unta? Di Madiun? Yang ada cuma kambing Pak RT.
        ar_eg: جمل؟ في ماديون؟ اللي موجود بس معزة باك RT.
        ar: جمل؟ في ماديون؟ ليس عندنا إلّا عنزة باك RT.
        en: A camel? In Madiun? All we've got is Pak RT's goat.
        note:
          ar_eg: cuma = hanya (بس)، وkambing = معزة.
          ar: cuma = hanya (فقط)، وkambing = ماعز.
          en: cuma = hanya (only); kambing = goat.
      - speaker: Bu Tini
        text: Kalau dihias, kambing Pak RT itu mirip unta kecil, Pak.
        ar_eg: لو زيّناها، معزة باك RT تبقى شبه جمل صغيّر يا باك.
        ar: لو زُيّنت عنزة باك RT لبدت كجمل صغير يا باك.
        en: If we dress it up, Pak RT's goat looks a bit like a small camel, Pak.
      - speaker: Bu Rahayu
        text: Udah, udah. Kata orang Jawa, "alon-alon asal kelakon". Pelan-pelan, yang penting terlaksana.
        ar_eg: خلاص، خلاص. الجاويين بيقولوا «ألون ألون أسال كيلاكون» - بالراحة، المهمّ الحاجة تخلص.
        ar: كفى، كفى. يقول الجاويون «ألون ألون أسال كيلاكون» - على مهل، المهمّ أن يتمّ الأمر.
        en: Enough, enough. As the Javanese say, "alon-alon asal kelakon" - slowly does it, as long as it gets done.
        note:
          ar_eg: «alon-alon asal kelakon» مثل جاوي مشهور - زي «في التأنّي السلامة وفي العجلة الندامة». Udah, udah = Sudah, sudah (خلاص، خلاص).
          ar: «alon-alon asal kelakon» مثل جاوي شهير، يقابله «في التأنّي السلامة وفي العجلة الندامة». Udah, udah = Sudah, sudah (كفى، كفى).
          en: '"alon-alon asal kelakon" is a well-known Javanese saying - "slow and steady gets it done". Udah, udah = Sudah, sudah (that''s enough).'
      - speaker: Pak Budi
        text: Alon-alon, Bu? Undangannya harus dicetak minggu ini!
        ar_eg: بالراحة يا رهايو؟ الدعوات لازم تتطبع الأسبوع ده!
        ar: على مهل يا رهايو؟ يجب أن تُطبع الدعوات هذا الأسبوع!
        en: Slowly, dear? The invitations have to be printed this week!
      - speaker: Narrator
        text: Pesan keempat ratus tiga belas masuk ke grup. Dari Bayu, sebuah tautan berjudul "Panduan Menikah di Indonesia".
        ar_eg: الرسالة رقم أربعمية وتلتاشر وصلت الجروب. من بايو - لينك عنوانه «دليل الجواز في إندونيسيا».
        ar: وصلت الرسالة الرابعة عشرة بعد الأربعمئة إلى المجموعة، من بايو - رابط بعنوان «دليل الزواج في إندونيسيا».
        en: Message number four hundred and thirteen arrives in the group. From Bayu - a link titled "A Guide to Getting Married in Indonesia".
  - setting:
      ar_eg: بحيرة توبا في سومطرة الشمالية، رحلة لنادي الكتابة في جزيرة ساموسير. بحيرة واسعة جدًا وسط جبال خضرا - البحيرة دي فوهة بركان ضخم اتكوّنت من حوالي ٧٤ ألف سنة. بايو وكاك تيور قاعدين على الشطّ.
      ar: بحيرة توبا في سومطرة الشمالية، في رحلة لنادي الكتابة إلى جزيرة ساموسير. بحيرة شاسعة بين جبال خضراء، تشكّلت في فوّهة بركان هائل قبل نحو ٧٤ ألف عام. يجلس بايو وكاك تيور على الشاطئ.
      en: Lake Toba in North Sumatra, on a writing-club trip to Samosir island. A vast lake among green mountains, formed in the crater of a supervolcano some 74,000 years ago. Bayu and Kak Tiur sit on the shore.
    lines:
      - speaker: Bayu
        text: '"Langkah pertama: undanglah semua orang. Teman SD, tetangga lama, dan orang yang pernah duduk di sebelah Anda di bus. Mereka mungkin tidak ingat Anda, tapi mereka pasti ingat makanannya."'
        ar_eg: «الخطوة الأولى - اعزم الناس كلّها. صحاب الابتدائي، والجيران القدام، والراجل اللي قعد جنبك مرة في الأتوبيس. يمكن ميكونوش فاكرينك، بس أكيد هيفتكروا الأكل.»
        ar: «الخطوة الأولى - ادعُ الجميع. رفاق المدرسة الابتدائية، والجيران القدامى، ومن جلس بجانبك مرّة في الحافلة. قد لا يتذكّرونك، لكنهم حتمًا سيتذكّرون الطعام.»
        en: '"Step one: invite everyone. Primary-school friends, old neighbours, and the person who once sat next to you on a bus. They may not remember you, but they''ll certainly remember the food."'
        note:
          ar_eg: بايو بيقرا مقاله المكتوب، فاللغة فصيحة (Anda، tidak). undanglah = اعزم (الأمر المكتوب بـ -lah)، وpasti = أكيد.
          ar: يقرأ بايو مقاله المكتوب، فاللغة فصحى (Anda، tidak). undanglah = ادعُ (صيغة الأمر المكتوبة بـ -lah)، وpasti = حتمًا.
          en: Bayu is reading his written column, so it is standard (Anda, tidak). undanglah = invite (the written -lah imperative); pasti = surely.
      - speaker: Kak Tiur
        text: Lumayan. Tapi itu belum seberapa, Dek. Pesta adat Batak bisa sampai ribuan tamu. Dan semuanya datang, karena semua merasa bersaudara.
        ar_eg: مش بطّال. بس ده ولا حاجة يا صغيّر. فرح الباتاك على الأصول ممكن يوصل لآلاف الضيوف. والكل بييجي، عشان الكل حاسس إنه قرايب.
        ar: لا بأس. لكنّ هذا لا شيء يا صغيري؛ فعرس الباتاك التقليدي قد يبلغ آلاف الضيوف، ويحضرون جميعًا لأنهم يشعرون أنهم أقارب.
        en: Not bad. But that's nothing, kid. A traditional Batak wedding can have thousands of guests. And they all come, because they all feel like family.
        note:
          ar_eg: الباتاك متقسّمين لعشائر اسمها marga (والاسم ده جزء من اسم العيلة)، وكل الناس من نفس الـ marga بيعتبروا نفسهم قرايب. وفي الفرح، الأهل بيلفّوا العرسان بقماش منسوج اسمه ulos كبركة.
          ar: ينتظم الباتاك في عشائر تُسمّى marga (وتصير جزءًا من اسم الأسرة)، ويعدّ أبناء العشيرة الواحدة أنفسهم أقارب. وفي العرس يلفّ الأهل العروسين بنسيج يدوي يُسمّى ulos مباركةً لهما.
          en: Batak society is organised into clans called marga (the marga is your surname), and everyone in a marga counts as kin. At a wedding, elders wrap the couple in a woven ulos cloth as a blessing.
      - speaker: Bayu
        text: '"Langkah kedua: pilihlah tanggal. Tanyakan kepada sesepuh, aplikasi cuaca, dan tetangga yang tahu segalanya. Jawaban mereka pasti berbeda. Jadi, pilih saja tanggal ketika gedungnya kosong."'
        ar_eg: «الخطوة التانية - اختار الميعاد. اسأل الكبار، وأبلكيشن الطقس، والجارة اللي عارفة كل حاجة. أكيد كل واحد هيقولك حاجة. فاختار وخلاص اليوم اللي القاعة فيه فاضية.»
        ar: «الخطوة الثانية - اختر الموعد. اسأل الشيوخ، وتطبيق الطقس، والجار الذي يعرف كلّ شيء. ستختلف إجاباتهم حتمًا، فاختر ببساطة اليوم الذي تكون فيه القاعة شاغرة.»
        en: '"Step two: pick a date. Ask the elders, the weather app and the neighbour who knows everything. Their answers will all differ. So just pick the day the hall is free."'
        note:
          ar_eg: pilihlah / pilih = اختار، tanyakan = اسأل، segalanya = كل حاجة، berbeda = مختلف، sesepuh = كبار العيلة.
          ar: pilihlah / pilih = اختر، وtanyakan = اسأل، وsegalanya = كلّ شيء، وberbeda = مختلف، وsesepuh = كبار العائلة.
          en: pilihlah / pilih = choose, tanyakan = ask, segalanya = everything, berbeda = different, sesepuh = the elders.
      - speaker: Kak Tiur
        text: Nah, ironinya di situ. Semua orang ditanya, tapi yang menentukan tetap gedung.
        ar_eg: أهو، السخرية هنا بالظبط. الكل بيتسأل، وفي الآخر القاعة هي اللي بتقرّر.
        ar: ها هنا موضع المفارقة - يُسأل الجميع، ثمّ تقرّر القاعة في النهاية.
        en: There's the irony. Everyone gets asked, but the hall decides in the end.
      - speaker: Bayu
        text: '"Langkah ketiga: siapkan jawaban. Setelah pertanyaan Kapan nikah? terjawab, akan datang Kapan punya anak?, lalu Kapan anak kedua?. Pertanyaan ini tidak akan habis, seperti nasi di prasmanan."'
        ar_eg: «الخطوة التالتة - جهّز ردودك. بعد ما سؤال "هتتجوّز إمتى؟" يخلص، هييجي "هتخلّف إمتى؟"، وبعده "التاني إمتى؟". الأسئلة دي عمرها ما هتخلص، زي الرز في البوفيه.»
        ar: «الخطوة الثالثة - جهّز أجوبتك. فبعد أن يُجاب سؤال "متى تتزوّج؟" سيأتي "متى تُنجب؟"، ثمّ "متى الطفل الثاني؟". ولن تنفد هذه الأسئلة، كالأرز في البوفيه.»
        en: '"Step three: have your answers ready. Once When are you getting married? is answered, along comes When are you having a baby?, then When''s the second one?. These questions never run out, like the rice at a buffet."'
        note:
          ar_eg: «Kapan nikah?» (هتتجوّز إمتى؟) أشهر سؤال في المناسبات الإندونيسية، خصوصًا في العيد، والشباب بيعملوا عليه نكت كتير. وعندنا نفس الحكاية - «عقبالك!» و«إمتى نفرح بيك؟».
          ar: «Kapan nikah?» (متى تتزوّج؟) أشهر سؤال في المناسبات الإندونيسية، ولا سيّما في العيد، وعليه نكات لا تُحصى. وعندنا نظيره - «عقبالك!» و«متى نفرح بك؟».
          en: '"Kapan nikah?" (when are you getting married?) is the most famous question at Indonesian family gatherings, especially at Lebaran, and the butt of endless jokes. Egyptians know it as "3o2balak!"'
      - speaker: Kak Tiur
        text: Hahaha! Itu bagus kali! Tapi hati-hati, Dek. Satire itu pisau. Yang kau tertawakan budayanya, bukan orangnya.
        ar_eg: هههه! دي حلوة أوي! بس خلّي بالك يا صغيّر. السخرية سكّينة. انت بتضحك على الثقافة، مش على الناس.
        ar: هاهاها! هذه رائعة جدًّا! لكن احذر يا صغيري؛ السخرية سكّين. اضحك من الثقافة لا من الأشخاص.
        en: Hahaha! That's really good! But careful, kid. Satire is a knife. You laugh at the culture, not at the people.
        note:
          ar_eg: kau = kamu بلهجة ميدان، وtertawakan = تضحك على، وbudaya = ثقافة.
          ar: kau = kamu بلهجة ميدان، وtertawakan = تضحك من، وbudaya = الثقافة.
          en: kau = kamu in Medan speech; tertawakan = laugh at; budaya = culture.
      - speaker: Bayu
        text: Jadi aku nggak boleh nulis soal Bu Tini sama tiga ratus tamunya?
        ar_eg: يعني مينفعش أكتب عن بو تيني والتلتمية ضيف بتوعها؟
        ar: أي لا يجوز أن أكتب عن بو تيني وضيوفها الثلاثمئة؟
        en: So I can't write about Bu Tini and her three hundred guests?
        note:
          ar_eg: nulis = menulis (يكتب)، soal = tentang (عن)، sama = dan.
          ar: nulis = menulis (يكتب)، وsoal = tentang (عن)، وsama = dan.
          en: nulis = menulis (to write), soal = tentang (about), sama = dan (and).
      - speaker: Kak Tiur
        text: Boleh. Tapi ganti namanya. Misalnya, "Bu Tiga Ratus".
        ar_eg: ينفع. بس غيّر الاسم. مثلًا، «بو تلتمية».
        ar: يجوز، لكن غيّر الاسم. مثلًا «بو ثلاثمئة».
        en: You can. But change her name. Say, "Mrs Three Hundred".
      - speaker: Bayu
        text: Itu malah lebih jelas, Kak!
        ar_eg: ده كده أوضح يا كاك!
        ar: هكذا يصبح أوضح يا كاك!
        en: That makes it even more obvious, Kak!
      - speaker: Kak Tiur
        text: Judulmu juga terlalu serius. Pakai plesetan. "KUA, Kapan Undangan Ada?"
        ar_eg: والعنوان بتاعك جدّ زيادة. استعمل لعب بالكلام. «KUA - الدعوات هتبقى جاهزة إمتى؟»
        ar: وعنوانك جادّ أكثر من اللازم. استعمل التلاعب بالألفاظ - «KUA - متى تجهز الدعوات؟»
        en: Your title's too serious too. Use a play on words. "KUA - Kapan Undangan Ada?", "When Will the Invitations Be Ready?"
        note:
          ar_eg: plesetan يعني تلعب بالكلمة أو الاختصار وتطلّعله معنى تاني بيضحّك. KUA في الحقيقة اختصار Kantor Urusan Agama (مكتب الشؤون الدينية) اللي بيسجّل الجواز، وكاك تيور حوّلته لـ «Kapan Undangan Ada?».
          ar: plesetan تلاعب بكلمة أو اختصار لاستخراج معنى طريف آخر. فـKUA في الحقيقة اختصار Kantor Urusan Agama (مكتب الشؤون الدينية) الذي يوثّق الزواج، وقد حوّلته كاك تيور إلى «Kapan Undangan Ada?».
          en: plesetan is wordplay that twists a word or acronym into a funny new meaning. KUA really stands for Kantor Urusan Agama, the Office of Religious Affairs that registers marriages; Kak Tiur turns it into "Kapan Undangan Ada?".
      - speaker: Bayu
        text: Ha! Tapi Kak, kalau keluargaku membaca ini...
        ar_eg: هه! بس يا كاك، لو أهلي قروا ده...
        ar: ها! لكن يا كاك، لو قرأ أهلي هذا...
        en: Ha! But Kak, if my family reads this...
      - speaker: Kak Tiur
        text: Kalau mereka tertawa, berarti tulisanmu jujur. Kalau mereka marah... berarti tulisanmu terlalu jujur.
        ar_eg: لو ضحكوا، يبقى كتابتك صادقة. لو زعلوا... يبقى كتابتك صادقة زيادة عن اللزوم.
        ar: إن ضحكوا فكتابتك صادقة. وإن غضبوا... فكتابتك صادقة أكثر من اللازم.
        en: If they laugh, your writing's honest. If they get angry... your writing's too honest.
      - speaker: Narrator
        text: Malam itu kolom Bayu terbit di portal berita kampus. Komentar pertama datang dari Madiun. "Le, 300 itu blm termasuk teman arisan lho. Salam, Bu Tini."
        ar_eg: بالليل مقال بايو اتنشر على موقع أخبار الجامعة. وأول تعليق جه من ماديون - «يا ابني، التلتمية دول من غير صحابي بتوع الجمعية. سلامات، بو تيني.»
        ar: في تلك الليلة نُشر مقال بايو في موقع أخبار الجامعة، وجاء أوّل تعليق من ماديون - «يا بنيّ، الثلاثمئة لا يشملون رفيقات الجمعية. تحياتي، بو تيني.»
        en: 'That night Bayu''s column goes up on the campus news site. The first comment comes from Madiun. "Son, those three hundred don''t include my arisan friends. Regards, Bu Tini."'
        note:
          ar_eg: blm = belum (لسه) - اختصار في الشات. وarisan = جمعية الستّات بالدور.
          ar: blm = belum (لم بعد) - اختصار في المحادثات. وarisan = جمعية ادّخار دوريّة.
          en: blm = belum (not yet) - chat shorthand. arisan = a rotating savings club.
