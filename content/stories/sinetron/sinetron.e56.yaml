next:
  ar_eg: الضحك خلص، وجه وقت الورق. مكتب KUA في ماديون، وظرف من السفارة المصرية، وترجمة محلّفة، وأختام... كتير أختام. وبايو بيحاول يشرح القانون بكلام بسيط للعيلة.
  ar: انتهى الضحك وحان وقت الأوراق. مكتب الشؤون الدينية في ماديون، وظرف من السفارة المصرية، وترجمة محلّفة، وأختام... أختام كثيرة. ويحاول بايو أن يشرح القانون للعائلة بكلمات بسيطة.
  en: The laughing's over; now for the paperwork. The KUA office in Madiun, an envelope from the Egyptian embassy, sworn translations, and stamps... lots of stamps. And Bayu tries to explain the law to the family in plain words.
