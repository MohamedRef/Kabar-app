title:
  target: Sayap Enggang dan Raksasa Kecil
  ar_eg: جناح البوقير والعملاق الصغيّر
  ar: جناح أبي قرن والعملاق الصغير
  en: Hornbill Wings and a Little Giant
summary:
  ar_eg: في پالانجكا رايا، پاك هندرا بياخد ساري لمهرجان «إيسن مولانج» - رقصة بريش طير البوقير، وبعدين الكل بيمسك إيد بعض ويرقص في دايرة. وفي نفس الليلة في ماديون، بايو بيرقص «دونجكريك» في حفلة المدرسة لابس ماسك عملاق... وبينسى كل الخطوات.
  ar: في بالانغكا رايا يأخذ باك هندرا ساري إلى مهرجان «إيسن مولانغ» - رقصة بريش طائر أبي قرن، ثم يمسك الجميع بأيدي بعضهم ويرقصون في دائرة. وفي الليلة نفسها في ماديون يرقص بايو «الدونغكريك» في حفل المدرسة بقناع عملاق... وينسى الخطوات كلّها.
  en: In Palangka Raya, Pak Hendra takes Sari to the Isen Mulang festival - a dance with hornbill feathers, then everyone holds hands and dances in a circle. The same night in Madiun, Bayu performs dongkrek at the school arts night in a giant's mask... and forgets every step.
cast: [Pak Hendra, Sari, Bu Rahayu, Pak Budi, Mas Joko, Bayu]
scenes:
  - setting:
      ar_eg: پالانجكا رايا، عاصمة كاليمانتان الوسطى، مايو، بالليل. مسرح مفتوح في المهرجان، وريحة سمك مشوي جاية من الأكشاك.
      ar: بالانغكا رايا، عاصمة كاليمانتان الوسطى، مايو، ليلًا. مسرح مكشوف في المهرجان، ورائحة السمك المشويّ تفوح من الأكشاك.
      en: Palangka Raya, capital of Central Kalimantan, May, at night. An open-air stage at the festival, and the smell of grilled fish from the stalls.
    lines:
      - speaker: Narrator
        text: Pekerjaan membawa Sari ke Palangka Raya. Kebetulan, kota ini sedang merayakan Festival Isen Mulang, dan Pak Hendra ternyata lahir dan besar di sini.
        ar_eg: الشغل ودّى ساري پالانجكا رايا. وبالصدفة، المدينة كانت بتحتفل بمهرجان إيسن مولانج، وطلع إن پاك هندرا اتولد واتربّى هنا.
        ar: قاد العمل ساري إلى بالانغكا رايا. وصادف أنّ المدينة تحتفل بمهرجان إيسن مولانغ، وتبيّن أنّ باك هندرا وُلد ونشأ فيها.
        en: Work takes Sari to Palangka Raya. As it happens, the city is celebrating the Isen Mulang Festival - and it turns out Pak Hendra was born and raised here.
        note:
          ar_eg: Isen Mulang بلغة الدياك نجاجو معناها «عمرنا ما نرجع لورا» - وده شعار محافظة كاليمانتان الوسطى. المهرجان بيتعمل كل سنة قريب من عيد المحافظة في مايو.
          ar: Isen Mulang بلغة داياك نغاجو تعني «لا تراجع أبدًا»، وهو شعار محافظة كاليمانتان الوسطى. ويُقام المهرجان سنويًّا قرب ذكرى تأسيس المحافظة في مايو.
          en: Isen Mulang means "never retreat" in Dayak Ngaju - it's the motto of Central Kalimantan. The festival is held every year around the province's anniversary in May.
      - speaker: Pak Hendra
        text: Festival ini ngenalin budaya Dayak ke orang luar, Mbak. Malam ini, sanggar tempat keponakan saya latihan bakal nampilin tari enggang.
        ar_eg: المهرجان ده بيعرّف الناس اللي من برّه بثقافة الدياك يا مبك. والليلة دي، الفرقة اللي بنت أختي بتتمرّن فيها هتقدّم رقصة البوقير.
        ar: يعرّف هذا المهرجان الغرباء بثقافة الداياك يا مبك. والليلة ستقدّم الفرقة التي تتدرّب فيها ابنة أختي رقصة أبي قرن.
        en: This festival introduces Dayak culture to outsiders, Mbak. Tonight, the dance studio where my niece trains is performing the hornbill dance.
        note:
          ar_eg: البادئة memper- بتعمل أفعال معناها «يخلّي الحاجة أكتر» أو «يقدّم» - kenal ← memperkenalkan (يعرّف)، tunjuk ← mempertunjukkan (يعرض على المسرح)، erat ← mempererat (يقوّي الرابطة)، baik ← memperbaiki (يصلّح). وپاك هندرا برّه الشغل بيتكلّم عادي - ngenalin = memperkenalkan، ke = kepada، latihan = berlatih، bakal = akan، nampilin = mempertunjukkan (يقدّم عرض). budaya = ثقافة، keponakan = ابن/بنت الأخ، enggang = طائر أبو قرن.
          ar: تصوغ السابقة memper- أفعالًا بمعنى «جعل الشيء أكثر» أو «قدّم» - kenal ← memperkenalkan (عرّف)، tunjuk ← mempertunjukkan (عرض على المسرح)، erat ← mempererat (وثّق)، baik ← memperbaiki (أصلح). وباك هندرا خارج العمل يتكلّم ببساطة - ngenalin = memperkenalkan، ke = kepada، latihan = berlatih، bakal = akan، nampilin = mempertunjukkan (يعرض). budaya = ثقافة، keponakan = ابن الأخ أو الأخت، enggang = طائر البوقير.
          en: The prefix memper- makes verbs meaning "make more so" or "present" - kenal → memperkenalkan (introduce), tunjuk → mempertunjukkan (stage, perform), erat → mempererat (strengthen a bond), baik → memperbaiki (repair, improve). Off duty, Pak Hendra talks casually - ngenalin = memperkenalkan, ke = kepada, latihan = berlatih, bakal = akan, nampilin = mempertunjukkan (perform). budaya = culture, keponakan = nephew or niece, enggang = hornbill.
      - speaker: Narrator
        text: Gong dan gendang berbunyi. Para penari keluar dengan bulu-bulu panjang hitam-putih di kepala dan di jari-jari tangan mereka.
        ar_eg: الجونج والطبول بدأت. والرقّاصات طلعوا بريش طويل أبيض وأسود على راسهم وعلى صوابع إيديهم.
        ar: دوّت الصنوج والطبول، وخرجت الراقصات بريش طويل أسود وأبيض على رؤوسهنّ وأصابع أيديهنّ.
        en: Gongs and drums sound. The dancers come out with long black-and-white feathers on their heads and on their fingers.
      - speaker: Sari
        text: Gerakan tangannya pelan dan lebar ya, Pak, kayak sayap burung yang lagi terbang tinggi di atas hutan.
        ar_eg: حركة إيديهم بطيئة وواسعة يا پاك، زي جناحات طير طاير عالي فوق الغابة.
        ar: حركات أيديهنّ بطيئة واسعة يا باك، كجناحَي طائر يحلّق عاليًا فوق الغابة.
        en: Their arm movements are slow and wide, Pak, like the wings of a bird flying high above the forest.
        note:
          ar_eg: kayak = seperti، lagi = sedang، sayap = جناح.
          ar: kayak = seperti، lagi = sedang، sayap = جناح.
          en: kayak = seperti, lagi = sedang, sayap = wing.
      - speaker: Pak Hendra
        text: Betul. Buat banyak suku Dayak, burung enggang itu lambang dunia atas, juga lambang persatuan dan kepemimpinan. Makanya, tarian ini dibawakan dengan penuh hormat.
        ar_eg: مظبوط. عند قبايل دياك كتير، طير البوقير رمز للعالم اللي فوق، ورمز للوحدة والقيادة كمان. وعشان كده الرقصة دي بتترقص باحترام كبير.
        ar: صحيح. طائر أبي قرن عند كثير من قبائل الداياك رمز للعالم العلويّ، ورمز للوحدة والقيادة أيضًا، ولذلك تُؤدّى هذه الرقصة بكلّ إجلال.
        en: That's right. For many Dayak peoples, the hornbill is a symbol of the upper world, and also of unity and leadership. That's why this dance is performed with deep respect.
        note:
          ar_eg: buat = bagi، makanya = karena itu (عشان كده). lambang = رمز، suku = قبيلة، persatuan = وحدة، dibawakan = بتتأدّى.
          ar: buat = bagi، makanya = karena itu (لذلك). lambang = رمز، suku = قبيلة، persatuan = وحدة، dibawakan = تُؤدّى.
          en: buat = bagi (for), makanya = karena itu (that is why). lambang = symbol, suku = tribe, persatuan = unity, dibawakan = is performed.
      - speaker: Sari
        text: Bulunya asli, Pak?
        ar_eg: الريش ده حقيقي يا پاك؟
        ar: هل هذا الريش حقيقيّ يا باك؟
        en: Are the feathers real, Pak?
      - speaker: Pak Hendra
        text: Sekarang kebanyakan tiruan, Mbak. Enggang udah jadi satwa yang dilindungi, jadi bulunya nggak boleh diambil sembarangan.
        ar_eg: دلوقتي أغلبه تقليد يا مبك. البوقير بقى حيوان محمي، فريشه ماينفعش يتاخد كده وخلاص.
        ar: معظمه اليوم مقلَّد. فطائر أبي قرن صار محميًّا، ولا يجوز أخذ ريشه كيفما اتّفق.
        en: Mostly imitation these days, Mbak. The hornbill is a protected species now, so its feathers can't just be taken.
        note:
          ar_eg: البوقير (enggang، وبالدياك نجاجو tingang) طير كبير بمنقار ضخم. فيه نوع منه، «البوقير أبو خوذة»، مهدّد بالانقراض بشدّة بسبب الصيد، فالفرق بقت تستعمل ريش صناعي. tiruan = تقليد، kebanyakan = أغلبها، sembarangan = كده وخلاص، udah jadi = sudah menjadi.
          ar: أبو قرن (enggang، وبلغة نغاجو tingang) طائر كبير ذو منقار ضخم. ومن أنواعه «أبو قرن ذو الخوذة» المهدّد بالانقراض بشدّة بسبب الصيد، فصارت الفرق تستعمل ريشًا صناعيًّا. tiruan = مقلَّد، kebanyakan = معظمها، sembarangan = عشوائيًّا، udah jadi = sudah menjadi.
          en: The hornbill (enggang, tingang in Ngaju) is a large bird with a huge beak. One species, the helmeted hornbill, is critically endangered by hunting, so troupes now use artificial feathers. tiruan = imitation, kebanyakan = mostly, sembarangan = just as you please, udah jadi = sudah menjadi.
      - speaker: Narrator
        text: Di akhir acara, para penari mengajak semua penonton turun. Ratusan orang bergandengan tangan dan membentuk lingkaran besar. Ini tari manasai.
        ar_eg: في آخر العرض، الرقّاصات نادوا كل المتفرّجين ينزلوا. مئات الناس مسكوا إيدين بعض وعملوا دايرة كبيرة. دي رقصة «ماناساي».
        ar: في ختام العرض دعت الراقصات المتفرّجين جميعًا إلى النزول، فتشابكت أيدي المئات وشكّلوا دائرة كبيرة. هذه رقصة «ماناساي».
        en: At the end, the dancers invite the whole audience down. Hundreds of people join hands and form a huge circle. This is the manasai dance.
        note:
          ar_eg: الماناساي رقصة اجتماعية عند الدياك نجاجو، الكل بيرقص فيها في دايرة، وبيرحّبوا بيها بالضيوف. شبه الدبكة شوية، بس أهدى بكتير.
          ar: الماناساي رقصة اجتماعية عند داياك نغاجو يرقص فيها الجميع في دائرة، ويُرحَّب بها بالضيوف. تشبه الدبكة قليلًا لكنّها أهدأ بكثير.
          en: Manasai is a Dayak Ngaju social dance in which everyone dances in a circle, often to welcome guests. A bit like a dabke, but much gentler.
      - speaker: Sari
        text: Pak, saya nggak bisa nari!
        ar_eg: يا پاك، أنا مبعرفش أرقص!
        ar: يا باك، لا أجيد الرقص!
        en: Pak, I can't dance!
      - speaker: Pak Hendra
        text: Nggak perlu bisa, Mbak. Manasai itu untuk mempererat persaudaraan, bukan untuk lomba. Ikutin aja langkah kaki orang di sebelah Mbak.
        ar_eg: مش لازم تعرفي يا مبك. الماناساي عشان يقوّي الأخوّة بين الناس، مش مسابقة. امشي بس ورا رجلين اللي جنبك.
        ar: لا يلزم أن تجيديه. الماناساي لتوثيق الأخوّة لا للمنافسة. اتّبعي خطوات من بجانبك فحسب.
        en: You don't need to be able to, Mbak. Manasai is for strengthening the bonds between people, not a competition. Just follow the feet of the person next to you.
        note:
          ar_eg: ikutin aja = ikuti saja (امشي ورا)، nari = menari. mempererat = يقوّي، persaudaraan = الأخوّة.
          ar: ikutin aja = ikuti saja (اتبعي فقط)، nari = menari. mempererat = يوطّد، persaudaraan = الأخوّة.
          en: ikutin aja = ikuti saja (just follow), nari = menari. mempererat = strengthen, persaudaraan = brotherhood.
      - speaker: Narrator
        text: Malam itu, di kamar hotel, Sari menulis ulasan pendek untuk buletin kantornya.
        ar_eg: الليلة دي، في أوضة الفندق، ساري كتبت مراجعة قصيّرة لنشرة الشركة.
        ar: في تلك الليلة كتبت ساري في غرفة الفندق مراجعة قصيرة لنشرة الشركة.
        en: That night, in her hotel room, Sari writes a short review for the company newsletter.
      - speaker: Sari
        text: '"Tari enggang malam ini mempertunjukkan keindahan yang tenang. Musiknya kuat, tetapi gerakannya lembut dan penuh makna. Satu-satunya kekurangan: panggungnya terlalu kecil untuk sayap sebesar itu."'
        ar_eg: '«رقصة البوقير الليلة عرضت جمال هادي. الموسيقى قويّة، بس الحركات ناعمة ومليانة معنى. العيب الوحيد: المسرح كان صغيّر أوي على جناحات بالحجم ده».'
        ar: '«قدّمت رقصة أبي قرن الليلة جمالًا هادئًا. الموسيقى قويّة، لكنّ الحركات ناعمة مفعمة بالمعنى. العيب الوحيد: المسرح أصغر من أن يتّسع لأجنحة بهذا الحجم».'
        en: '"Tonight''s hornbill dance showed a quiet kind of beauty. The music is powerful, but the movements are gentle and full of meaning. The only weakness: the stage was too small for wings that size."'
        note:
          ar_eg: المراجعة الكويسة بتذكر kelebihan (المميزات) وkekurangan (العيوب)، وبتستعمل أسماء مجرّدة زي keindahan (جمال) وmakna (معنى، من العربي «معنى»).
          ar: المراجعة الجيّدة تذكر kelebihan (المزايا) وkekurangan (العيوب)، وتستعمل أسماء مجرّدة مثل keindahan (الجمال) وmakna (المعنى، من العربية «معنى»).
          en: A good review names the kelebihan (strengths) and kekurangan (weaknesses), and uses abstract nouns like keindahan (beauty) and makna (meaning, from Arabic معنى).
  - setting:
      ar_eg: نفس الليلة، ماديون. قاعة مدرسة بايو مليانة أهالي. حفلة فنون طلبة سنة تالتة ثانوي.
      ar: الليلة نفسها، ماديون. قاعة مدرسة بايو مكتظّة بأولياء الأمور. حفل الفنون لطلّاب الصفّ الثاني عشر.
      en: The same night, Madiun. The hall at Bayu's school is packed with parents. It's the year-twelve arts night.
    lines:
      - speaker: Bu Rahayu
        text: Pak, Bayu tampil nomor berapa sih? Ibu udah duduk di sini dari jam tujuh.
        ar_eg: يا أبو ساري، بايو نمرة كام؟ أنا قاعدة هنا من الساعة سبعة.
        ar: يا باك، ما رقم فقرة بايو؟ أجلس هنا منذ السابعة.
        en: Pak, what number is Bayu on? I've been sitting here since seven.
      - speaker: Pak Budi
        text: Nomor tujuh, Bu. Dia ikut dongkrek. Katanya, dia jadi raksasa.
        ar_eg: نمرة سبعة يا رهايو. داخل في رقصة «دونجكريك». بيقول إنه عامل دور عملاق.
        ar: الرقم سبعة. يشارك في الدونغكريك، ويقول إنّه سيؤدّي دور عملاق.
        en: Number seven. He's in the dongkrek. Says he's playing a giant.
        note:
          ar_eg: الدونجكريك فنّ شعبي أصله من ميجايان في ماديون، من القرن الـ ١٩. اسمه جاي من صوت الطبلة «دونج» والخشبة اللي بتطقطق «كريك». بيحكي عن عمالقة بماسكات - رمز للوباء والشرّ - وراجل عجوز بيطردهم. raksasa = عملاق.
          ar: الدونغكريك فنّ شعبي نشأ في ميجايان بماديون في القرن التاسع عشر. اسمه من صوت الطبل «دونغ» والآلة الخشبية المطقطقة «كريك». ويصوّر عمالقة مقنّعين - رمز الوباء والشرّ - وشيخًا يطردهم. raksasa = عملاق.
          en: Dongkrek is a folk art from Mejayan in Madiun, dating from the 19th century. Its name comes from the sound of the drum, "dung", and a wooden rattle, "krek". Masked giants - standing for plague and evil - are driven out by an old man. raksasa = giant.
      - speaker: Mas Joko
        text: Cocok. Kalau lagi lapar, Bayu emang kayak raksasa.
        ar_eg: لايق عليه. بايو لمّا بيجوع بيبقى عملاق فعلًا.
        ar: مناسب له. فبايو حين يجوع يصير عملاقًا فعلًا.
        en: Suits him. When he's hungry, Bayu really is a giant.
        note:
          ar_eg: cocok = لايق عليه، lagi = sedang، emang = memang، kayak = seperti، raksasa = عملاق.
          ar: cocok = يليق به، lagi = sedang، emang = memang، kayak = seperti، raksasa = عملاق.
          en: cocok = suits him, lagi = sedang, emang = memang, kayak = seperti, raksasa = giant.
      - speaker: Narrator
        text: Dung... krek... dung... krek. Tiga raksasa bertopeng masuk ke panggung. Raksasa yang paling kecil berjalan ke arah yang salah.
        ar_eg: دونج... كريك... دونج... كريك. تلات عمالقة بماسكات دخلوا المسرح. وأصغر عملاق فيهم ماشي في الاتجاه الغلط.
        ar: دونغ... كريك... دونغ... كريك. دخل المسرحَ ثلاثة عمالقة مقنّعين، وأصغرهم يسير في الاتجاه الخطأ.
        en: Dung... krek... dung... krek. Three masked giants come on stage. The smallest giant walks the wrong way.
      - speaker: Bu Rahayu
        text: Itu Bayu! Ke kiri, Le! Ke kiri!
        ar_eg: ده بايو! شمال يا ابني! شمال!
        ar: هذا بايو! إلى اليسار يا بنيّ! إلى اليسار!
        en: That's Bayu! Left, son! Go left!
      - speaker: Narrator
        text: Bayu lupa semua langkahnya. Lalu dia mulai menari dengan gayanya sendiri, setengah dongkrek, setengah orang mengulek sambal. Penonton tertawa dan bertepuk tangan.
        ar_eg: بايو نسي كل الخطوات. وبعدين بدأ يرقص على طريقته - نصّها دونجكريك، ونصّها واحد بيدقّ صلصة في الهون. والمتفرّجين ضحكوا وسقّفوا.
        ar: نسي بايو كلّ خطواته، فأخذ يرقص على طريقته - نصفها دونغكريك ونصفها رجل يسحق الصلصة. فضحك الجمهور وصفّق.
        en: Bayu has forgotten every step. So he starts dancing his own way - half dongkrek, half someone grinding sambal. The audience laughs and claps.
      - speaker: Pak Budi
        text: Gerakan ulekan! Itu jurus rahasia warung kita!
        ar_eg: حركة الهون! دي الحركة السرّية بتاعة الوارونج!
        ar: حركة الهاون! هذه حركة الوارونغ السرّية!
        en: The grinding move! That's our warung's secret technique!
        note:
          ar_eg: ulekan = حركة الدقّ في الهون، jurus rahasia = الحركة السرّية.
          ar: ulekan = حركة السحق بالمدقّة، jurus rahasia = الحركة السرّية.
          en: ulekan = the pestle-grinding move, jurus rahasia = secret move.
      - speaker: Narrator
        text: Akhirnya, tokoh orang tua datang membawa tongkat, dan para raksasa lari keluar panggung. Raksasa kecil lari paling cepat.
        ar_eg: في الآخر، الراجل العجوز جه ومعاه عصاية، والعمالقة جريوا برّه المسرح. والعملاق الصغيّر كان أسرع واحد.
        ar: وأخيرًا جاء الشيخ بعصاه، ففرّ العمالقة من المسرح، وكان العملاق الصغير أسرعهم.
        en: Finally, the old man arrives with his staff, and the giants flee the stage. The little giant runs fastest of all.
      - speaker: Bayu
        text: Pak, Bu, aku malu banget. Aku lupa semua langkahnya. Tiga minggu latihan, hilang dalam satu menit.
        ar_eg: بابا، ماما، أنا مكسوف أوي. نسيت كل الخطوات. تلات أسابيع تمرين، راحوا في دقيقة.
        ar: أبي، أمي، أنا خجلان جدًّا. نسيتُ الخطوات كلّها. ثلاثة أسابيع من التدريب ضاعت في دقيقة.
        en: Dad, Mum, I'm so embarrassed. I forgot all the steps. Three weeks of practice, gone in one minute.
      - speaker: Bu Rahayu
        text: Kata ibu-ibu di sebelah Ibu, raksasa kecil itu yang paling menghibur malam ini lho.
        ar_eg: الستّات اللي جنبي كانوا بيقولوا إن العملاق الصغيّر ده كان أكتر واحد بسطهم الليلة.
        ar: قالت السيّدات بجانبي إنّ العملاق الصغير كان أمتع ما في الليلة.
        en: The ladies next to me said that little giant was the most entertaining thing all night.
        note:
          ar_eg: menghibur = مسلّي، raksasa = عملاق.
          ar: menghibur = مُسلٍّ، raksasa = عملاق.
          en: menghibur = entertaining, raksasa = giant.
      - speaker: Sari
        text: Le, Mbak udah lihat videonya. Ini ulasan dari Mbak. Teknik, perlu diperbaiki. Keberanian, luar biasa. Penonton, terhibur banget.
        ar_eg: يا بايو، أنا شفت الڤيديو. ودي مراجعتي - التكنيك محتاج يتصلّح. الشجاعة، فوق الوصف. الجمهور، مبسوط جدًا.
        ar: يا بنيّ، شاهدتُ الفيديو، وهذه مراجعتي - الأداء يحتاج إلى تحسين. الجرأة مذهلة. والجمهور استمتع كثيرًا.
        en: Little brother, I've seen the video. Here's my review. Technique - needs improvement. Courage - outstanding. Audience - thoroughly entertained.
        note:
          ar_eg: udah = sudah، banget = sekali. teknik = تكنيك، diperbaiki = يتصلّح، keberanian = شجاعة، luar biasa = هايل، terhibur = مستمتعين.
          ar: udah = sudah، banget = sekali. teknik = التقنية، diperbaiki = يُصلَح، keberanian = الشجاعة، luar biasa = رائع، terhibur = مستمتعون.
          en: udah = sudah, banget = sekali. teknik = technique, diperbaiki = be improved, keberanian = courage, luar biasa = amazing, terhibur = entertained.
      - speaker: Bayu
        text: Mbak, itu ulasan apa rapor?
        ar_eg: يا أبلة، دي مراجعة ولا شهادة درجات؟
        ar: يا أختي، أهذه مراجعة أم شهادة مدرسية؟
        en: Sis, is that a review or a school report?
      - speaker: Pak Budi
        text: Yang penting, kamu ikut melestarikan kesenian Madiun, Le. Bapak bangga.
        ar_eg: المهمّ إنك شاركت في الحفاظ على فنّ ماديون يا ابني. أنا فخور بيك.
        ar: المهمّ أنّك شاركت في صون فنون ماديون يا بنيّ. أنا فخور بك.
        en: What matters is you helped keep Madiun's own art alive, son. I'm proud of you.
