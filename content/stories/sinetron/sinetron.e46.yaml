questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: طير البوقير رمز لإيه عند قبايل دياك كتير؟
      ar: إلامَ يرمز طائر أبي قرن عند كثير من قبائل الداياك؟
      en: What does the hornbill symbolise for many Dayak peoples?
    options: ["dunia atas, persatuan, dan kepemimpinan", "minyak dan kekayaan", "hujan dan banjir", "perang dan musuh"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Manasai itu untuk ___ persaudaraan, bukan untuk lomba.
    meaning:
      ar_eg: الماناساي عشان يقوّي الأخوّة بين الناس، مش مسابقة.
      ar: الماناساي لتوثيق الأخوّة لا للمنافسة.
      en: Manasai is for strengthening the bonds between people, not a competition.
    answers: [mempererat]
    options: ["mempertunjukkan", "memperbaiki", "mempererat"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الجمهور ضحك وسقّف لبايو في رأيك؟
      ar: في رأيك، لماذا ضحك الجمهور وصفّق لبايو؟
      en: Why do you think the audience laughed and clapped for Bayu?
    options: ["Karena topengnya jatuh.", "Karena dia menari dengan sempurna.", "Karena dia lupa langkahnya tetapi menari dengan gaya lucu dan berani.", "Karena dia bernyanyi lagu Mesir."]
    answer: 2
  - id: q04
    type: listen
    text: 'Satu-satunya kekurangan: panggungnya terlalu kecil untuk sayap sebesar itu.'
    question:
      ar_eg: إيه العيب الوحيد اللي ساري كتبته؟
      ar: ما العيب الوحيد الذي كتبته ساري؟
      en: What is the only weakness Sari wrote about?
    options: ["Musiknya terlalu keras.", "Panggungnya terlalu kecil.", "Penarinya terlambat.", "Bulunya tiruan."]
    answer: 1
    meaning:
      ar_eg: العيب الوحيد - المسرح كان صغيّر أوي على جناحات بالحجم ده.
      ar: العيب الوحيد - المسرح أصغر من أن يتّسع لأجنحة بهذا الحجم.
      en: 'The only weakness: the stage was too small for wings that size.'
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الجمهور ضحك وسقّف.
      ar: ضحك الجمهور وصفّق.
      en: The audience laughed and clapped.
    answers: ["Penonton tertawa dan bertepuk tangan.", "Penonton tertawa dan bertepuk tangan", "Para penonton tertawa dan bertepuk tangan.", "Para penonton tertawa dan bertepuk tangan", "Penontonnya tertawa dan bertepuk tangan.", "Penontonnya tertawa dan bertepuk tangan", "Penonton tertawa dan tepuk tangan.", "Penonton tertawa dan tepuk tangan", "Para penonton tertawa dan tepuk tangan.", "Para penonton tertawa dan tepuk tangan"]
next:
  ar_eg: الساعة خمسة الفجر في سوق عايم في بانجارماسين. ساري بتشتري كيك من مركب... وصوت مألوف جاي من المركب اللي جنبها بيقول - «واحد كمان لساري، لو سمحتي».
  ar: الخامسة فجرًا في سوق عائم في بانجارماسين. تشتري ساري كعكًا من قارب... فيأتي صوت مألوف من القارب المجاور - «وواحدة أخرى لساري، من فضلك».
  en: Five in the morning at a floating market in Banjarmasin. Sari is buying cakes from a boat... when a familiar voice from the next boat says, "And one more for Sari, please."
