series: sinetron
episode: 32
language: id
level: bipa4
unlock_after: bipa4.u02
title:
  target: Redaksi yang Terhormat
  ar_eg: حضرات المحرّرين المحترمين
  ar: السادة المحرّرون المحترمون
  en: Dear Editor
summary:
  ar_eg: البيت مقلوب بالشنط عشان السفر للقاهرة، وبايو بيكتب جواب للجرنال عن مجاري الحارة اللي اتسدّت وقت الغرق. وصباح السفر، ماس جوكو جاي جري ومعاه خبر.
  ar: البيت مزدحم بالحقائب استعدادًا للسفر إلى القاهرة، وبايو يكتب رسالة إلى الصحيفة عن مصارف الزقاق التي انسدّت أثناء الفيضان. وفي صباح السفر يأتي ماس جوكو مسرعًا ومعه خبر.
  en: The house is full of suitcases for the Cairo trip, and Bayu is writing to the newspaper about the lane's blocked drains during the flood. On the morning of departure, Mas Joko comes running with news.
cast: [Pak Budi, Bu Rahayu, Bayu, Mas Joko, Bu Tini]
scenes:
  - setting:
      ar_eg: ماديون، بعد الغرق بكام أسبوع. في أوضة الضيوف شنطتين كبار مفتوحين، وبايو قاعد بالموبايل بيكتب.
      ar: ماديون، بعد الفيضان ببضعة أسابيع. في غرفة الضيوف حقيبتان كبيرتان مفتوحتان، وبايو يكتب على هاتفه.
      en: Madiun, a few weeks after the flood. Two big suitcases lie open in the front room, and Bayu is typing on his phone.
    lines:
      - speaker: Narrator
        text: Akhir Juli. Tiga hari lagi Pak Budi dan Bu Rahayu berangkat ke Kairo. Rumah penuh koper.
        ar_eg: آخر يوليو. فاضل تلات أيام وپاك بودي وبو راهايو يسافروا القاهرة. البيت مليان شنط.
        ar: نهاية يوليو. بقيت ثلاثة أيام على سفر باك بودي وبو راهايو إلى القاهرة. البيت مليء بالحقائب.
        en: The end of July. In three days, Pak Budi and Bu Rahayu leave for Cairo. The house is full of suitcases.
      - speaker: Pak Budi
        text: Bu, sarung batik Bapak di mana sih? Bapak udah bolak-balik ke kamar tiga kali!
        ar_eg: يا رهايو، فين السارونج الباتيك بتاعي؟ أنا رحت وجيت على الأوضة تلات مرات!
        ar: أين إزاري الباتيك؟ ذهبت إلى الغرفة وعدت ثلاث مرات!
        en: Where's my batik sarong? I've been back and forth to the bedroom three times!
        note:
          ar_eg: bolak-balik (رايح جاي) تكرار بيتغيّر فيه حرف - زي lalu-lalang (ناس رايحة وجاية) وsayur-mayur (خضار من كل نوع). التكرار ده بيدّي إحساس الحركة والكترة. وudah = sudah (خلاص، بقى) في الكلام.
          ar: bolak-balik (ذهابًا وإيابًا) تكرار يتغيّر فيه صوت - مثل lalu-lalang (غدوّ ورواح) وsayur-mayur (خضروات متنوّعة). يعطي هذا التكرار معنى الحركة أو الكثرة.
          en: bolak-balik (back and forth) is a doubled word with a sound change - like lalu-lalang (people coming and going) and sayur-mayur (all sorts of vegetables). It adds a sense of movement or variety. udah = sudah (already) in everyday speech.
      - speaker: Bu Rahayu
        text: Ada di koper, Pak. Sabar dong. Bayu, suratmu buat koran sudah selesai?
        ar_eg: في الشنطة يا بودي. اصبر. بايو، جوابك للجرنال خلص؟
        ar: إنه في الحقيبة يا باك. اصبر. بايو، هل انتهيت من رسالتك إلى الصحيفة؟
        en: It's in the suitcase. Patience. Bayu, is your letter to the paper done?
      - speaker: Bayu
        text: Hampir, Bu. Dengerin, ya. "Redaksi yth. Waktu hujan deras, banjir masuk ke Gang Melati. Saluran airnya terlalu kecil dan penuh sampah, sehingga air masuk ke rumah-rumah warga. Fotonya saya lampirkan."
        ar_eg: قرّبت يا ماما. اسمعي. «حضرات المحرّرين المحترمين. وقت المطر الجامد، الغرق دخل حارة ميلاتي. المجرى صغيّر أوي ومليان زبالة، فالمية دخلت بيوت الناس. ومرفق الصورة.»
        ar: أوشكت يا أمي. اسمعي. «السادة المحرّرون المحترمون، حين هطل المطر الغزير غمر الفيضان زقاق ميلاتي. فقناة التصريف أصغر من اللازم ومليئة بالقمامة، فدخل الماء بيوت السكان. وأرفق الصورة.»
        en: 'Nearly, Mum. Listen. "Dear Editor, in the heavy rain, floodwater came into Gang Melati. The drain is too small and full of rubbish, so water got into people''s homes. I attach a photo."'
        note:
          ar_eg: surat pembaca (رسالة القرّاء) بتبدأ بـ «Redaksi yth.» - yth. اختصار yang terhormat (المحترم). الإندونيسيين بيستعملوا الصفحة دي من زمان عشان يشتكوا من مشاكل الحيّ. وdengerin = dengarkan (اسمع) - في الكلام -in بتاخد مكان -kan.
          ar: تبدأ surat pembaca (رسالة القرّاء) بـ «Redaksi yth.»، وyth. اختصار yang terhormat (المحترم). ويستعمل الإندونيسيون هذه الصفحة منذ زمن طويل للشكوى من مشكلات الحيّ.
          en: A surat pembaca (reader's letter) opens with "Redaksi yth." - yth. is short for yang terhormat (respected). Indonesians have long used this page to raise local problems. dengerin = dengarkan (listen) - in speech -in takes the place of -kan.
      - speaker: Mas Joko
        text: Tambahin cerita warung, Bay. Waktu banjir, warga saling tolong-menolong. Warung jadi dapur umum!
        ar_eg: زوّد حكاية الوارونج يا باي. وقت الغرق، الجيران ساعدوا بعض. والوارونج بقى مطبخ للكل!
        ar: أضف قصة الوارونغ يا باي. حين جاء الفيضان تعاون السكان، وصار الوارونغ مطبخًا عامًّا!
        en: Add the warung story, Bay. During the flood, the neighbours all helped each other. The warung became a community kitchen!
        note:
          ar_eg: tolong-menolong (يساعدوا بعض) تكرار بيدلّ على حاجة متبادلة، زي وزن «تَفاعَل» في العربي - تعاون، تساعد. وكمان pukul-memukul (يضربوا بعض). وtambahin = tambahkan (زوّد) في الكلام.
          ar: tolong-menolong (يتساعدون) تكرار يدلّ على المشاركة، كوزن «تَفاعَل» في العربية - تعاون، تساعد. ومثله pukul-memukul (يتضاربون).
          en: tolong-menolong (helping one another) is a "mutual" doubling, much like the Arabic تفاعل pattern (تعاون، تساعد). Another one - pukul-memukul (hitting each other). tambahin = tambahkan (add) in everyday speech.
      - speaker: Bayu
        text: Udah, Mas. Penutupnya gini, "Kami mohon pemerintah kota memperbaiki saluran air sebaik-baiknya dan secepat-cepatnya, sebelum musim hujan datang lagi."
        ar_eg: كتبتها يا ماس. والختام كده - «بنرجو من الحكومة المحلية تصلّح المجاري على أحسن وجه وبأسرع وقت، قبل ما موسم المطر ييجي تاني.»
        ar: كتبتها يا ماس. والخاتمة هكذا - «نرجو من حكومة المدينة إصلاح قنوات التصريف على أحسن وجه وبأسرع ما يمكن، قبل أن يعود موسم الأمطار.»
        en: 'Done, Mas. The ending goes like this: "We ask the city government to repair the drains as well and as quickly as possible, before the rainy season comes again."'
        note:
          ar_eg: se- + صفة مكرّرة + -nya = «على أكمل وجه / بأقصى درجة» - sebaik-baiknya (على أحسن وجه)، secepat-cepatnya (بأسرع ما يمكن). جملة مثالية في آخر أي شكوى. وفي الكلام udah = sudah وgini = begini (كده).
          ar: se- مع صفة مكرّرة و-nya تعني «بأقصى درجة» - sebaik-baiknya (على أحسن وجه)، secepat-cepatnya (بأسرع ما يمكن). وهي خاتمة مثالية لأيّ شكوى.
          en: se- + doubled adjective + -nya means "as … as possible" - sebaik-baiknya (as well as possible), secepat-cepatnya (as soon as possible). Perfect for the end of any complaint. In speech udah = sudah, gini = begini (like this).
      - speaker: Pak Budi
        text: Bagus, Le! Tapi kurang sopan. Tambahin, "Semoga Bapak-Ibu redaksi sehat selalu, salam untuk keluarga..."
        ar_eg: حلو يا ابني! بس ناقصه أدب. زوّد - «ربنا يديم الصحة على حضرات المحرّرين، وسلّملي على العيلة...»
        ar: أحسنت يا بنيّ! لكنّ فيها نقصًا في الأدب. أضف - «أدام الله الصحة على السادة المحرّرين، وتحياتي إلى العائلة...»
        en: Good, son! But it's not polite enough. Add "Wishing the editors good health always, regards to your families..."
      - speaker: Bayu
        text: Pak, ini surat pembaca lho, bukan kartu Lebaran!
        ar_eg: يا بابا، ده جواب للجرنال، مش كارت تهنئة بالعيد!
        ar: يا أبي، هذه رسالة قرّاء، لا بطاقة تهنئة بالعيد!
        en: Dad, it's a letter to the editor, not a Lebaran card!
      - speaker: Bu Rahayu
        text: Udah, kirim aja lewat email, Le. Mudah-mudahan dimuat.
        ar_eg: خلاص، ابعته بالإيميل يا ابني. يا رب ينزل في الجرنال.
        ar: حسنًا، أرسله بالبريد الإلكتروني يا بنيّ. عسى أن يُنشر.
        en: All right, just send it by email, son. Fingers crossed they print it.
  - setting:
      ar_eg: يوم السفر، أول أغسطس، الساعة ٥ الصبح. عربية ماس جوكو مستنية قدّام البيت، زي ما وصّلت ساري قبل كده.
      ar: يوم السفر في مطلع أغسطس، الساعة الخامسة صباحًا. سيارة ماس جوكو تنتظر أمام البيت، كما أوصلت ساري من قبل.
      en: Departure day, early August, 5 a.m. Mas Joko's car is waiting outside the house, just as it once did for Sari.
    lines:
      - speaker: Mas Joko
        text: Bayu! Bayu! Suratmu dimuat di koran!
        ar_eg: بايو! بايو! جوابك نزل في الجرنال!
        ar: بايو! بايو! نُشرت رسالتك في الصحيفة!
        en: Bayu! Bayu! Your letter's in the paper!
      - speaker: Bayu
        text: Yang bener, Mas? Mana, mana?
        ar_eg: بجد يا ماس؟ فين، فين؟
        ar: حقًّا يا ماس؟ أين، أين؟
        en: Seriously, Mas? Where, where?
        note:
          ar_eg: yang bener? = yang benar? (بجد؟) - في الكلام بنقول bener بدل benar.
          ar: yang bener? = yang benar? (حقًّا؟) - في الكلام يقال bener بدل benar.
          en: yang bener? = yang benar? (seriously?) - speech says bener for benar.
      - speaker: Mas Joko
        text: Ini, di halaman surat pembaca. Judulnya "Saluran Air Gang Melati", lengkap sama fotomu!
        ar_eg: أهو، في صفحة رسايل القرّاء. العنوان «مجرى حارة ميلاتي»، وكمان بالصورة بتاعتك!
        ar: هاهي، في صفحة رسائل القرّاء. عنوانها «قناة تصريف زقاق ميلاتي»، ومعها صورتك أيضًا!
        en: Here, on the readers' letters page. It's called "The Gang Melati Drain" - with your photo and all!
      - speaker: Bu Tini
        text: Saya udah beli lima koran! Satu buat Pak Budi, dibawa ke Kairo, ya.
        ar_eg: أنا اشتريت خمس جرايد! واحدة لپاك بودي ياخدها معاه القاهرة.
        ar: اشتريت خمس صحف! واحدة لباك بودي يأخذها معه إلى القاهرة.
        en: I've bought five copies! One's for Pak Budi to take to Cairo.
      - speaker: Pak Budi
        text: Anak Bapak masuk koran... Bapak bangga banget, Le.
        ar_eg: ابني في الجرنال... أنا فخور بيك أوي يا ابني.
        ar: ابني في الصحيفة... أنا فخور بك جدًّا يا بنيّ.
        en: My boy's in the newspaper... I'm so proud of you, son.
      - speaker: Bayu
        text: Jangan nangis dong, Pak. Nanti matanya bengkak waktu pemeriksaan paspor!
        ar_eg: متعيّطش يا بابا. لحسن عينيك تبقى وارمة في تفتيش الباسبور!
        ar: لا تبكِ يا أبي، وإلّا تورّمت عيناك عند فحص الجواز!
        en: Don't cry, Dad. Your eyes will be all puffy at passport control!
        note:
          ar_eg: nangis = menangis (يعيّط) - في الكلام me- بتقع. وbengkak = وارم.
          ar: nangis = menangis (يبكي) - تسقط me- في الكلام. وbengkak = متورّم.
          en: nangis = menangis (to cry) - speech drops the me-. bengkak = swollen, puffy.
      - speaker: Bu Rahayu
        text: Udah, udah. Ayo berangkat, nanti kita ketinggalan pesawat!
        ar_eg: خلاص، خلاص. يلا نمشي، لحسن الطيارة تفوتنا!
        ar: كفى، كفى. هيّا بنا، وإلّا فاتتنا الطائرة!
        en: All right, all right. Let's go, or we'll miss the plane!
        note:
          ar_eg: Udah, udah = Sudah, sudah (خلاص، خلاص) - بنقولها عشان نهدّي حد أو ننهي الكلام.
          ar: Udah, udah = Sudah, sudah (كفى، كفى) - تقال لتهدئة أحد أو لإنهاء الكلام.
          en: Udah, udah = Sudah, sudah (that's enough now) - said to calm someone down or wrap things up.
      - speaker: Bayu
        text: Hati-hati di jalan, Pak, Bu. Warung aman kok sama aku, Mas Joko, sama Bu Tini.
        ar_eg: توصلوا بالسلامة يا بابا ويا ماما. الوارونج في أمان معايا أنا وماس جوكو وبو تيني.
        ar: رافقتكما السلامة يا أبي ويا أمي. الوارونغ في أمان معي ومع ماس جوكو وبو تيني.
        en: Safe travels, Dad, Mum. The warung's in good hands with me, Mas Joko and Bu Tini.
      - speaker: Narrator
        text: Di jalan, motor sudah lalu-lalang. Pak Budi memeluk koran itu sampai ke Surabaya.
        ar_eg: في الشارع، الموتوسيكلات رايحة جاية. وپاك بودي حاضن الجرنال طول السكة لحد سورابايا.
        ar: في الطريق كانت الدرّاجات النارية تروح وتجيء، وباك بودي يحتضن الصحيفة حتى سورابايا.
        en: On the road, motorbikes are already coming and going. Pak Budi hugs that newspaper all the way to Surabaya.
