questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب جواب بايو، المية دخلت البيوت ليه؟
      ar: بحسب رسالة بايو، لماذا دخل الماء البيوت؟
      en: According to Bayu's letter, why did water get into the houses?
    options: ["Atap rumah-rumah warga rusak.", "Sungai di dekat gang terlalu jauh.", "Warga lupa menutup pintu.", "Saluran airnya terlalu kecil dan penuh sampah."]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Waktu banjir, warga saling ___. Warung jadi dapur umum!
    meaning:
      ar_eg: وقت الغرق، الجيران ساعدوا بعض. والوارونج بقى مطبخ للكل!
      ar: حين جاء الفيضان تعاون السكان، وصار الوارونغ مطبخًا عامًّا!
      en: During the flood, the neighbours helped each other. The warung became a community kitchen!
    answers: [tolong-menolong]
    options: ["bolak-balik", "tolong-menolong", "lalu-lalang"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه بايو قال لأبوه «ده مش كارت عيد»؟
      ar: لماذا قال بايو لأبيه «هذه ليست بطاقة عيد»؟
      en: Why does Bayu tell his dad "this isn't a Lebaran card"?
    options: ["Pak Budi mau menambahkan salam yang terlalu panjang.", "Pak Budi lupa membaca suratnya.", "Pak Budi mau mengirim kartu ke Kairo."]
    answer: 0
  - id: q04
    type: listen
    text: Saya udah beli lima koran! Satu buat Pak Budi, dibawa ke Kairo, ya.
    question:
      ar_eg: بو تيني اشترت كام جرنال؟
      ar: كم صحيفة اشترت بو تيني؟
      en: How many newspapers did Bu Tini buy?
    options: ["satu", "lima", "tiga", "dua"]
    answer: 1
    meaning:
      ar_eg: أنا اشتريت خمس جرايد! واحدة لپاك بودي ياخدها معاه القاهرة.
      ar: اشتريت خمس صحف! واحدة لباك بودي يأخذها معه إلى القاهرة.
      en: I've bought five copies! One's for Pak Budi to take to Cairo.
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بأسرع وقت ممكن
      ar: بأسرع ما يمكن
      en: as soon as possible
    answers: ["secepat-cepatnya", "Secepat-cepatnya", "secepatnya", "Secepatnya", "secepat mungkin", "Secepat mungkin", "sesegera mungkin", "Sesegera mungkin", "sesegera-segeranya", "Sesegera-segeranya"]
next:
  ar_eg: أول مرة پاك بودي وبو راهايو يطلعوا برّه إندونيسيا. ٢٠ ساعة سفر... وفي آخرها القاهرة!
  ar: إنها أول مرة يغادر فيها باك بودي وبو راهايو إندونيسيا. عشرون ساعة من السفر... وفي آخرها القاهرة!
  en: Pak Budi and Bu Rahayu's first time outside Indonesia. Twenty hours of travel... and at the end of it, Cairo!
