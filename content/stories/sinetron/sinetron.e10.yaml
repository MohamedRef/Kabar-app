title:
  target: Pernah ke Mesir?
  ar_eg: عمرك رحت مصر؟
  ar: هل زرت مصر من قبل؟
  en: Ever Been to Egypt?
summary:
  ar_eg: كريم بيحكي يومه في ماديون وبيطبخ كشري في الوارونج، وساري أخيرًا عملت پيتشل بجد في القاهرة. وبعدين سؤال واحد بيقلب الترابيزة على پاك بودي.
  ar: يروي كريم يومه في ماديون ويطبخ الكشري في الوارونغ، وأخيرًا تنجح ساري في طبخ البيتشل في القاهرة. ثم يقلب سؤال واحد الطاولة على باك بودي.
  en: Karim tells the story of his day in Madiun and cooks koshari at the warung, and Sari finally makes proper pecel in Cairo. Then one question turns the tables on Pak Budi.
cast: [Karim, Sari, Nadia, Mas Joko, Pak Budi, Bayu, Bu Rahayu, Hagga Fatma]
scenes:
  - setting:
      ar_eg: الاتنين الصبح في الوارونج. ريحة كشري جاية من المطبخ، وموبايل پاك بودي على مكالمة مع القاهرة.
      ar: صباح الاثنين في الوارونغ. رائحة الكشري تفوح من المطبخ، وهاتف باك بودي في اتصال مع القاهرة.
      en: Monday morning at the warung. The smell of koshari drifts from the kitchen, and Pak Budi's phone is on a call with Cairo.
    lines:
      - speaker: Narrator
        text: Hari Senin. Pagi. Di dapur warung, Karim memasak koshari.
        ar_eg: يوم الاتنين. الصبح. في مطبخ الوارونج، كريم بيطبخ كشري.
        ar: يوم الاثنين. صباحًا. في مطبخ الوارونغ يطبخ كريم الكشري.
        en: Monday. Morning. In the warung's kitchen, Karim is cooking koshari.
      - speaker: Sari
        text: Karim, bagaimana kemarin?
        ar_eg: يا كريم، إمبارح كان عامل إزاي؟
        ar: يا كريم، كيف كان يوم أمس؟
        en: Karim, how was yesterday?
      - speaker: Karim
        text: Kemarin pagi saya naik kereta dari Surabaya ke Madiun. Lalu saya jalan kaki ke warung.
        ar_eg: إمبارح الصبح ركبت القطر من سورابايا لماديون. وبعدين مشيت لحد الوارونج.
        ar: صباح أمس ركبت القطار من سورابايا إلى ماديون، ثم مشيت إلى الوارونغ.
        en: Yesterday morning I took the train from Surabaya to Madiun. Then I walked to the warung.
      - speaker: Karim
        text: Setelah itu saya makan pecel, dan saya salat zuhur dengan Mas Joko.
        ar_eg: بعد كده كلت پيتشل، وصلّيت الضهر مع ماس جوكو.
        ar: بعد ذلك أكلت البيتشل، وصلّيت الظهر مع ماس جوكو.
        en: After that I ate pecel, and I prayed the noon prayer with Mas Joko.
        note:
          ar_eg: الإندونيسي مفيهوش ماضي في الفعل؛ كلمات زي kemarin وsetelah itu هي اللي بتقول إن الحاجة حصلت.
          ar: لا تصريف للماضي في الإندونيسية؛ فكلمات مثل kemarin وsetelah itu هي التي تدلّ على أن الحدث وقع.
          en: Indonesian verbs have no past tense — words like kemarin and setelah itu do the work.
      - speaker: Mas Joko
        text: Dan tadi pagi Karim memasak koshari di warung!
        ar_eg: والنهارده الصبح كريم طبخ كشري في الوارونج!
        ar: وهذا الصباح طبخ كريم الكشري في الوارونغ!
        en: And this morning Karim cooked koshari at the warung!
      - speaker: Pak Budi
        text: Ini pertama kali saya makan koshari. Enak sekali!
        ar_eg: دي أول مرة آكل كشري. حلو جدًا!
        ar: هذه أول مرة آكل فيها الكشري. لذيذ جدًا!
        en: This is the first time I've eaten koshari. Delicious!
      - speaker: Nadia
        text: Sari, kamu juga cerita!
        ar_eg: يا ساري، احكي انتي كمان!
        ar: يا ساري، احكي أنتِ أيضًا!
        en: Sari, tell them your news too!
      - speaker: Sari
        text: Kemarin saya memasak pecel dengan kencur dari Bapak. Enak sekali, Pak!
        ar_eg: إمبارح عملت پيتشل بالكينتشور اللي بعته بابا. طلع حلو جدًا يا بابا!
        ar: أمس طبخت البيتشل بالكنتشور الذي أرسله أبي. كان لذيذًا جدًا يا أبي!
        en: Yesterday I made pecel with the kencur you sent, Dad. It was delicious!
      - speaker: Pak Budi
        text: Alhamdulillah!
        ar_eg: الحمد لله!
        ar: الحمد لله!
        en: Thank God!
  - setting:
      ar_eg: نفس المكالمة. الكل اتلمّ قدّام الموبايل، وكريم عنده سؤال.
      ar: الاتصال نفسه. اجتمع الجميع أمام الهاتف، ولدى كريم سؤال.
      en: Same call. Everyone crowds around the phone, and Karim has a question.
    lines:
      - speaker: Karim
        text: Pak Budi, Bapak pernah ke Mesir?
        ar_eg: يا پاك بودي، حضرتك عمرك رحت مصر؟
        ar: يا باك بودي، هل زرت مصر من قبل؟
        en: Pak Budi, have you ever been to Egypt?
      - speaker: Pak Budi
        text: Belum pernah, Mas. Saya belum pernah naik pesawat.
        ar_eg: لسه يا كريم. عمري ما ركبت طيارة.
        ar: لم يحدث بعد يا كريم. لم أركب طائرة قطّ.
        en: Not yet, Karim. I've never even been on a plane.
        note:
          ar_eg: belum pernah = «لسه ما حصلش»، وفيها أمل إنه يحصل. tidak pernah = «عمره ما حصل» ومفيش نية.
          ar: belum pernah = «لم يحدث بعد» مع أمل في حدوثه، أمّا tidak pernah = «لم يحدث قطّ» بلا نيّة.
          en: belum pernah is "never yet" (it still might happen); tidak pernah is a flat "never".
      - speaker: Bayu
        text: Saya juga belum pernah!
        ar_eg: وأنا كمان لسه!
        ar: وأنا أيضًا لم أفعل بعد!
        en: Me neither — not yet!
      - speaker: Bu Rahayu
        text: Pak... bagaimana kalau tahun depan kita ke Kairo?
        ar_eg: يا بودي... إيه رأيك السنة الجاية نروح القاهرة؟
        ar: يا بودي... ما رأيك أن نذهب إلى القاهرة العام القادم؟
        en: Dear... how about we go to Cairo next year?
      - speaker: Pak Budi
        text: Ke Kairo? Bu... tiketnya mahal!
        ar_eg: القاهرة؟ يا راهايو... التذكرة غالية!
        ar: إلى القاهرة؟ يا راهايو... التذكرة غالية!
        en: To Cairo? Dear... the tickets are expensive!
      - speaker: Hagga Fatma
        text: Pak Budi! Di rumah saya ada kamar. Silakan datang!
        ar_eg: يا پاك بودي! عندي أوضة فاضية في البيت. اتفضل تعالى!
        ar: يا باك بودي! في بيتي غرفة. تفضّل بالحضور!
        en: Pak Budi! There's a room at my place. Do come!
      - speaker: Sari
        text: Pak, Bu, Bayu... saya tunggu di Kairo!
        ar_eg: يا بابا، يا ماما، يا بايو... أنا مستنياكم في القاهرة!
        ar: يا أبي، يا أمي، يا بايو... أنا بانتظاركم في القاهرة!
        en: Dad, Mum, Bayu... I'll be waiting for you in Cairo!
      - speaker: Pak Budi
        text: Hmm... Insyaallah.
        ar_eg: امممم... إن شاء الله.
        ar: همم... إن شاء الله.
        en: Hmm... God willing.
      - speaker: Narrator
        text: Pak Budi belum pernah ke Mesir. Belum.
        ar_eg: پاك بودي لسه ما راحش مصر. لسه.
        ar: لم يزر باك بودي مصر بعد. بعد.
        en: Pak Budi has never been to Egypt. Not yet.
