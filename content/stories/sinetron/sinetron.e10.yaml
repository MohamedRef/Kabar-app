next:
  ar_eg: رمضان قرّب... أول رمضان لساري بعيد عن ماديون. وفي الوارونج، بايو عنده خطة سرّية عشان تذاكر القاهرة.
  ar: اقترب رمضان... أول رمضان لساري بعيدًا عن ماديون. وفي الوارونغ، لدى بايو خطة سرّية لتذاكر القاهرة.
  en: Ramadan is coming... Sari's first Ramadan away from Madiun. And at the warung, Bayu has a secret plan for those Cairo tickets.
