  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: كريم جه من سورابايا لماديون إزاي؟
      ar: كيف جاء كريم من سورابايا إلى ماديون؟
      en: How did Karim get from Surabaya to Madiun?
    options: ["naik pesawat", "naik kereta", "naik bus"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Saya belum ___ naik pesawat.
    meaning:
      ar_eg: عمري ما ركبت طيارة (لسه).
      ar: لم أركب طائرة بعد.
      en: I've never been on a plane (yet).
    answers: [pernah]
    options: ["pernah", "sedang", "sudah"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: مين طبخ الكشري في الوارونج؟
      ar: مَن طبخ الكشري في الوارونغ؟
      en: Who cooked koshari at the warung?
    options: ["Karim", "Sari", "Mas Joko"]
