title:
  target: Koen wis mangan ta, rek?
  ar_eg: انت كلت ولّا إيه يا صاحبي؟
  ar: هل أكلت يا صديقي؟
  en: You eaten yet, mate?
summary:
  ar_eg: على شطّ كنجيران، صاحب هيرو اسمه تشاك مات بيكلّم كريم بجاوي سورابايا الناشف - koen، gak، rek. كريم بيتضايق ويفتكره بيهزّق فيه... لحد ما هيرو يشرح إن ده كلام الصحاب، ومعناه «انت مننا».
  ar: على شاطئ كنجيران، يكلّم صديق هيرو، تشاك مات، كريمًا بجاوية سورابايا الجافّة - koen وgak وrek. يتضايق كريم ويظنّه يهينه... حتى يشرح هيرو أنّ هذا كلام الأصدقاء، ومعناه «أنت منّا».
  en: At Kenjeran beach, Heru's friend Cak Mat talks to Karim in blunt Surabaya Javanese - koen, gak, rek. Karim bristles, thinking he's being insulted... until Heru explains it's how friends talk, and it means "you're one of us".
cast: [Karim, Cak Heru, Cak Mat]
scenes:
  - setting:
      ar_eg: شطّ كنجيران قبل المغرب. مراكب صيّادين ملوّنة، وعشّة سمك مشوي. تشاك مات، صاحب هيرو من أيام المدرسة، بيقلّب السمك على الفحم.
      ar: شاطئ كنجيران قبيل المغرب. قوارب صيّادين ملوّنة، وكوخ للسمك المشويّ. تشاك مات، صديق هيرو منذ أيّام المدرسة، يقلّب السمك على الفحم.
      en: Kenjeran beach before sunset. Colourful fishing boats and a grilled-fish shack. Cak Mat, Heru's friend since school, is turning fish over the charcoal.
    lines:
      - speaker: Cak Mat
        text: Rek! Iki kancamu sing saka Ampel?
        ar_eg: يا جدع! ده صاحبك اللي من أمبيل؟
        ar: يا رجل! هذا صديقك الذي من أمبيل؟
        en: Hey! Is this your mate from Ampel?
      - speaker: Cak Heru
        text: Dudu, Cak. Karim dudu wong Ampel. Wong Mesir!
        ar_eg: لأ يا تشاك. كريم مش من أمبيل. ده مصري!
        ar: لا يا تشاك. كريم ليس من أمبيل. إنه مصري!
        en: No, Cak. Karim's not from Ampel. He's Egyptian!
        note:
          ar_eg: dudu يعني «مش» قبل اسم (مش ده، ده تاني). أمّا قبل فعل أو صفة بنقول ora أو gak.
          ar: dudu تعني «ليس» قبل الاسم (ليس هذا، بل ذاك). أمّا قبل الفعل أو الصفة فنقول ora أو gak.
          en: dudu means "not" before a noun (not this, but that). Before a verb or adjective you use ora or gak.
      - speaker: Cak Mat
        text: Lho! Koen wis mangan ta, rek?
        ar_eg: يا سلام! انت كلت ولّا إيه يا جدع؟
        ar: عجبًا! هل أكلت يا رجل؟
        en: Whoa! You eaten yet, mate?
        note:
          ar_eg: koen (أو awakmu) هي «انت» بتاعة سورابايا. بين الصحاب دافية جدًّا، بس في نُصّ جاوة صوتها ناشف.
          ar: koen (أو awakmu) هي «أنت» في سورابايا. دافئة جدًّا بين الأصدقاء، لكنها تبدو جافّة في وسط جاوة.
          en: koen (or awakmu) is Surabaya's "you". Very warm between friends, but it sounds blunt in Central Java.
      - speaker: Karim
        text: Hmm... durung.
        ar_eg: امم... لسه.
        ar: امم... ليس بعد.
        en: Hmm... not yet.
      - speaker: Cak Mat
        text: Lungguh kono! Gak usah isin. Iwake gak larang, rek.
        ar_eg: اقعد هناك! ماتتكسفش. السمك مش غالي يا جدع.
        ar: اجلس هناك! لا تخجل. السمك ليس غاليًا يا رجل.
        en: Sit over there! Don't be shy. The fish isn't pricey, mate.
      - speaker: Karim
        text: Cak Heru... dheweke nesu?
        ar_eg: يا تشاك هيرو... هو زعلان؟
        ar: يا تشاك هيرو... هل هو غاضب؟
        en: Cak Heru... is he angry?
  - setting:
      ar_eg: كريم وهيرو قاعدين على الرملة بياكلوا. تشاك مات بيضحك بصوت عالي مع الصيّادين.
      ar: يجلس كريم وهيرو على الرمل يأكلان. ويضحك تشاك مات بصوت عالٍ مع الصيّادين.
      en: Karim and Heru sit on the sand eating. Cak Mat laughs loudly with the fishermen.
    lines:
      - speaker: Cak Heru
        text: Ora nesu, rek! Iku basa Suroboyo. Koen, gak, rek, kabeh iku tandha kanca.
        ar_eg: مش زعلان يا صاحبي! ده كلام سورابايا. koen وgak وrek، كلّه علامة إنك صاحب.
        ar: ليس غاضبًا يا صديقي! هذه لهجة سورابايا. koen وgak وrek، كلّها علامات صداقة.
        en: He's not angry, mate! That's Surabaya talk. Koen, gak, rek - it all means you're a friend.
      - speaker: Karim
        text: Kaya "yalla ya ṣaḥbi" nang Mesir!
        ar_eg: زي «يلّا يا صاحبي» في مصر!
        ar: مثل «يلّا يا صاحبي» في مصر!
        en: Like "yalla ya sahbi" in Egypt!
      - speaker: Cak Heru
        text: Persis! Nanging karo wong sing durung kenal, ora oleh. Nganggo "kowe" ae.
        ar_eg: بالظبط! بس مع حد لسه ماتعرفوش، ماينفعش. قول «kowe» وخلاص.
        ar: تمامًا! لكن مع من لم تتعرّف إليه بعد، لا يصحّ. استعمل «kowe» فقط.
        en: Exactly! But with someone you don't know yet, it's not okay. Just use "kowe".
        note:
          ar_eg: ora oleh = «ماينفعش / ممنوع». القاعدة - اعرف كلام سورابايا عشان تفهمه، بس مع الغُرب استعمل الجاوي العادي.
          ar: ora oleh = «لا يجوز». والقاعدة أن تعرف لهجة سورابايا لتفهمها، لكن مع الغرباء استعمل الجاوية العادية.
          en: ora oleh = "not allowed". The rule - know Surabaya speech so you understand it, but use standard ngoko with strangers.
      - speaker: Cak Mat
        text: Piye, rek? Iwake enak ta?
        ar_eg: إيه يا جدع؟ السمك حلو ولّا لأ؟
        ar: ما رأيك يا رجل؟ السمك لذيذ، أليس كذلك؟
        en: Well, mate? Fish good, eh?
      - speaker: Karim
        text: Enak pol, rek! Koen koki paling apik!
        ar_eg: حلو موت يا جدع! انت أحسن طبّاخ!
        ar: لذيذ جدًّا يا رجل! أنت أفضل طاهٍ!
        en: Seriously good, mate! You're the best cook!
      - speaker: Cak Mat
        text: Hahaha! Iki arek Suroboyo saiki!
        ar_eg: ههههه! ده بقى ابن سورابايا دلوقتي!
        ar: ههههه! صار الآن ابن سورابايا!
        en: Hahaha! He's a Surabaya kid now!
new_words:
  - word: koen
    pos: pronoun
    ar_eg: انت (سورابايا، بين الصحاب)
    ar: أنت (سورابايا، بين الأصدقاء)
    en: you (Surabaya, between friends)
  - word: gak
    pos: particle
    ar_eg: مش / لأ (سورابايا)
    ar: لا / ليس (سورابايا)
    en: not, no (Surabaya; = ora)
  - word: dudu
    pos: particle
    ar_eg: مش (قبل اسم)
    ar: ليس (قبل الاسم)
    en: not (before a noun)
  - word: nesu
    pos: adjective
    ar_eg: زعلان، متعصّب
    ar: غاضب
    en: angry
  - word: ora oleh
    ar_eg: ماينفعش، ممنوع
    ar: لا يجوز، ممنوع
    en: not allowed
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: تشاك مات افتكر كريم منين؟
      ar: من أين ظنّ تشاك مات أنّ كريمًا جاء؟
      en: Where did Cak Mat think Karim was from?
    options: ["Ampel", "Kairo", "Jakarta"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Karim ___ wong Ampel. Wong Mesir!
    meaning:
      ar_eg: كريم مش من أمبيل. ده مصري!
      ar: كريم ليس من أمبيل. إنه مصري!
      en: Karim's not from Ampel. He's Egyptian!
    answers: [dudu]
    options: ["dudu", "gak", "ora"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: مع حد غريب في جاوة، الأحسن تقول «انت» إزاي؟
      ar: مع شخص غريب في جاوة، كيف الأفضل أن تقول «أنت»؟
      en: With a stranger in Java, what's the safer word for "you"?
    options: ["koen", "kowe", "awakmu"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Dheweke ora nesu.
    answers_meaning:
      ar_eg: ["هو مش زعلان.", "هو مش متعصّب."]
      ar: ["هو ليس غاضبًا.", "إنه ليس غاضبًا."]
      en: ["He's not angry.", "He isn't angry."]
next:
  ar_eg: كريم بيتوه في وونوكرومو وهو رايح جنينة الحيوانات. بيسأل على الطريق... والناس بتشاور بطريقة غريبة.
  ar: يضيع كريم في وونوكرومو في طريقه إلى حديقة الحيوان. يسأل عن الطريق... والناس يشيرون بطريقة غريبة.
  en: Karim gets lost in Wonokromo on his way to the zoo. He asks for directions... and people point in a strange way.
review:
  status: draft
  verified: false
  notes: Arek forms (koen, gak, pol, iwak) to be checked by a Surabaya speaker. Cak Mat is a one-off.
