schema: kabar.story/v1
id: sinetron.e75
series: sinetron
episode: 75
language: jv
level: j1
unlock_after: j1.u05
title:
  target: Sumuk banget, je!
  ar_eg: حرّ أوي والله!
  ar: الجوّ خانق جدًّا!
  en: So hot, man!
summary:
  ar_eg: على شطّ بارانجتريتيس، صاحب هيرو اسمه ماس باجوس بيكلّم كريم بجاوي الشارع السريع - ra، je، og. كريم مش فاهم حاجة ونفسه ينزل البحر... لحد ما هيرو يشرح الكلمات الصغيّرة، ويمنعه من الموج الخطر.
  ar: على شاطئ بارانغتريتيس، يكلّم صديقُ هيرو ماس باغوس كريمًا بجاوية الشارع السريعة - ra وje وog. لا يفهم كريم شيئًا ويريد نزول البحر... حتى يشرح له هيرو الكلمات الصغيرة ويمنعه من الأمواج الخطرة.
  en: At Parangtritis beach, Heru's friend Mas Bagus talks to Karim in fast street Javanese - ra, je, og. Karim can't follow and wants to go in the sea... until Heru explains the little words, and keeps him out of the dangerous waves.
cast: [Karim, Mas Heru, Mas Bagus]
scenes:
  - setting:
      ar_eg: شطّ بارانجتريتيس العصر. رملة سودا، وموج عالي، وحناطير، وطيّارات ورق. ماس باجوس، صاحب هيرو من أيام المدرسة، بيبيع جوز هند أخضر ودرة مشوي.
      ar: شاطئ بارانغتريتيس عصرًا. رمال سوداء، وأمواج عالية، وعربات خيل، وطائرات ورقية. ماس باغوس، صديق هيرو منذ المدرسة، يبيع جوز الهند الأخضر والذرة المشوية.
      en: Parangtritis beach in the late afternoon. Black sand, big waves, horse carts and kites. Mas Bagus, Heru's friend since school, sells young coconuts and grilled corn.
    lines:
      - speaker: Mas Bagus
        text: Her! Iki kancamu sing saka Jakarta?
        ar_eg: يا هيرو! ده صاحبك اللي من جاكرتا؟
        ar: يا هيرو! أهذا صديقك القادم من جاكرتا؟
        en: Heru! Is this your friend from Jakarta?
      - speaker: Mas Heru
        text: Dudu, Gus. Karim dudu wong Jakarta. Wong Mesir!
        ar_eg: لأ يا جوس. كريم مش من جاكرتا. ده مصري!
        ar: لا يا غوس. كريم ليس من جاكرتا. إنه مصري!
        en: No, Gus. Karim's not from Jakarta. He's Egyptian!
        note:
          ar_eg: dudu يعني «مش» قبل اسم (مش ده، ده تاني). أمّا قبل فعل أو صفة بنقول ora أو ra. وHer وGus اختصار هيرو وباجوس، زي ما بنقول «يا كيمو».
          ar: dudu تعني «ليس» قبل الاسم. أمّا قبل الفعل أو الصفة فنقول ora أو ra. وHer وGus اختصار هيرو وباغوس، كما يُختصر الاسم بين الأصدقاء.
          en: dudu means "not" before a noun (not this, but that). Before a verb or adjective you use ora or ra. Her and Gus are short for Heru and Bagus, the way friends clip names.
      - speaker: Mas Bagus
        text: Lho! Sumuk banget, je. Ngombe degan sik, Mas!
        ar_eg: يا سلام! حرّ أوي والله. اشرب جوز هند الأول يا أستاذ!
        ar: عجبًا! الجوّ خانق جدًّا. اشرب جوز الهند أوّلًا يا أستاذ!
        en: Whoa! It's so hot, man. Have a coconut first, Mas!
        note:
          ar_eg: "sumuk = حرّ ورطوبة. وje في آخر الجملة بتأكّد الكلام، زي «والله». كلمة جوجاوية ولسّه «unverified». كلمات: ngombe = يشرب."
          ar: "sumuk = حرّ رطب خانق. وje في آخر الجملة تؤكّد الكلام مثل «والله». وهي كلمة جوغجاوية ما زالت «unverified». مفردات: ngombe = يشرب."
          en: "sumuk = hot and sticky. je at the end adds emphasis, like \"honestly\". A Jogja word, still marked unverified. Words: ngombe = to drink."
      - speaker: Karim
        text: Hmm... matur nuwun.
        ar_eg: امم... متشكّر.
        ar: امم... شكرًا.
        en: Hmm... thank you.
      - speaker: Mas Bagus
        text: Ra sah bayar. Degane enak og, seger banget!
        ar_eg: مش لازم تدفع. جوز الهند حلو والله، منعش أوي!
        ar: لا داعي للدفع. جوز الهند لذيذ حقًّا، منعش جدًّا!
        en: No need to pay. The coconut's really good, so refreshing!
        note:
          ar_eg: "ra sah = ora usah = «مش لازم». وog زي je، بتأكّد - ولسّه «unverified» برضه. كلمات: bayar = يدفع."
          ar: "ra sah = ora usah أي «لا داعي». وog مثل je للتأكيد، وهي أيضًا «unverified». مفردات: bayar = يدفع."
          en: "ra sah = ora usah = \"no need\". og, like je, adds emphasis - also still unverified. Words: bayar = pay."
      - speaker: Karim
        text: Mas Heru... aku ora ngerti. Je? Og?
        ar_eg: يا ماس هيرو... أنا مش فاهم. je؟ og؟
        ar: يا ماس هيرو... لا أفهم. je؟ og؟
        en: Mas Heru... I don't get it. Je? Og?
  - setting:
      ar_eg: كريم وهيرو قاعدين على الرملة بيشربوا جوز الهند. الموج بيخبط جامد، وكريم بيبصّ على البحر.
      ar: يجلس كريم وهيرو على الرمل يشربان جوز الهند. تضرب الأمواج بقوّة، وكريم ينظر إلى البحر.
      en: Karim and Heru sit on the sand with their coconuts. The waves crash hard, and Karim gazes at the sea.
    lines:
      - speaker: Mas Heru
        text: Ra popo, Rim. Je lan og iku mung kanggo nguwatake. Kaya "wallahi" neng Mesir.
        ar_eg: مفيش مشكلة يا كريم. je وog بس للتأكيد. زي «والله» في مصر.
        ar: لا بأس يا كريم. je وog للتأكيد فقط. مثل «والله» في مصر.
        en: No worries, Rim. Je and og just add punch. Like "wallahi" in Egypt.
        note:
          ar_eg: "كلمات: iku = ده، دي، دول (البعيد)؛ kanggo = لـ، عشان (نغوكو)؛ kaya = زي، كأنّ؛ popo = ra popo = مفيش مشكلة."
          ar: "مفردات: iku = ذلك، تلك؛ kanggo = لِـ، من أجل (نغوكو)؛ kaya = مثل؛ popo = ra popo = لا بأس."
          en: "Words: iku = that, those; kanggo = for (ngoko) = untuk; kaya = like, as = seperti; popo = ra popo = no problem (ora apa-apa)."
      - speaker: Karim
        text: Oh! Sumuk banget, je. Degane enak, og!
        ar_eg: آه! حرّ أوي والله. جوز الهند حلو والله!
        ar: آه! الجوّ خانق جدًّا. جوز الهند لذيذ حقًّا!
        en: Oh! So hot, man. The coconut's really good!
      - speaker: Mas Heru
        text: Hahaha, pinter! Nanging karo wong tuwa, ora usah nganggo je.
        ar_eg: ههههه، شاطر! بس مع الكبار، مش لازم تقول je.
        ar: ههههه، أحسنت! لكن مع الكبار لا داعي لقول je.
        en: Hahaha, clever! But with elders, don't bother with je.
        note:
          ar_eg: "كلمات: nanging = بس، لكن؛ nganggo = بـ / بيستخدم."
          ar: "مفردات: nanging = لكن، غير أنّ؛ nganggo = بـ / يستعمل."
          en: "Words: nanging = but, however; nganggo = with, using (pakai)."
      - speaker: Karim
        text: Mengko aku arep nglangi. Ombake apik!
        ar_eg: بعدين هعوم. الموج حلو!
        ar: سأسبح لاحقًا. الأمواج جميلة!
        en: Later I'm going to swim. The waves look great!
      - speaker: Mas Heru
        text: Aja! Ombak neng kene gedhe banget, mbebayani. Mung lungguh neng pasir wae.
        ar_eg: لأ! الموج هنا عالي أوي وخطر. اقعد على الرملة بس.
        ar: لا! الأمواج هنا عالية جدًّا وخطرة. اجلس على الرمل فقط.
        en: Don't! The waves here are huge, dangerous. Just sit on the sand.
        note:
          ar_eg: "بارانجتريتيس معروفة بموجها العالي والتيّار الجامد، والعوم فيها خطر. الناس بتروح عشان المنظر والغروب والطيّارات الورق. كلمات: aja = متـ… (نهي)؛ kene = هنا (= sini)؛ lungguh = يقعد."
          ar: "يُعرف بارانغتريتيس بأمواجه العالية وتيّاراته القويّة، والسباحة فيه خطرة. يقصده الناس للمنظر والغروب والطائرات الورقية. مفردات: aja = لا (الناهية)؛ kene = هنا (= sini)؛ lungguh = يجلس."
          en: "Parangtritis is known for high waves and strong currents; swimming there is dangerous. People go for the view, the sunset and the kites. Words: aja = don't; kene = here (= sini); lungguh = sit."
      - speaker: Mas Bagus
        text: Piye, Mas? Degane enak to?
        ar_eg: إيه يا أستاذ؟ جوز الهند حلو، صح؟
        ar: ما رأيك يا أستاذ؟ جوز الهند لذيذ، أليس كذلك؟
        en: Well, Mas? The coconut's good, right?
      - speaker: Karim
        text: Enak banget, je! Matur nuwun, Mas Bagus!
        ar_eg: حلو أوي والله! متشكّر يا ماس باجوس!
        ar: لذيذ جدًّا حقًّا! شكرًا يا ماس باغوس!
        en: Really good, man! Thank you, Mas Bagus!
      - speaker: Mas Bagus
        text: Hahaha! Iki wong Jogja saiki!
        ar_eg: ههههه! ده بقى ابن جوجا دلوقتي!
        ar: ههههه! صار ابن جوغجا الآن!
        en: Hahaha! He's a Jogja local now!
        note:
          ar_eg: "كلمات: saiki = دلوقتي (sekarang)."
          ar: "مفردات: saiki = الآن (sekarang)."
          en: "Words: saiki = now (sekarang)."
      - speaker: Narrator
        text: Kaca lima. Ora, dudu, ra, je, og. Lan aja nglangi neng Parangtritis.
        ar_eg: صفحة خمسة. ora، dudu، ra، je، og. وماتعومش في بارانجتريتيس.
        ar: الصفحة الخامسة. ora وdudu وra وje وog. ولا تسبح في بارانغتريتيس.
        en: Page five. Ora, dudu, ra, je, og. And don't swim at Parangtritis.
        note:
          ar_eg: "كلمات: kaca = صفحة."
          ar: "مفردات: kaca = صفحة."
          en: "Words: kaca = page (of a book)."
new_words:
  - word: dudu
    pos: particle
    ar_eg: مش (قبل اسم)
    ar: ليس (قبل الاسم)
    en: not (before a noun)
  - word: sumuk
    pos: adjective
    ar_eg: حرّ ورطوبة
    ar: حارّ رطب
    en: hot and sticky
  - word: degan
    pos: noun
    ar_eg: جوز هند أخضر بتشرب ميّته
    ar: جوز هند أخضر يُشرب ماؤه
    en: young green coconut (to drink)
  - word: ra sah
    ar_eg: مش لازم (= ora usah)
    ar: لا داعي (= ora usah)
    en: no need (= ora usah)
  - word: ombak
    pos: noun
    ar_eg: موج
    ar: موج
    en: wave
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: ماس باجوس افتكر كريم منين؟
      ar: من أين ظنّ ماس باغوس أنّ كريمًا؟
      en: Where did Mas Bagus think Karim was from?
    options: ["Jakarta", "Kairo", "Madiun"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Karim ___ wong Jakarta. Wong Mesir!
    meaning:
      ar_eg: كريم مش من جاكرتا. ده مصري!
      ar: كريم ليس من جاكرتا. إنه مصري!
      en: Karim's not from Jakarta. He's Egyptian!
    answers: [dudu]
    options: ["dudu", "ra", "ora"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه هيرو منع كريم إنه يعوم؟
      ar: لماذا منع هيرو كريمًا من السباحة؟
      en: Why did Heru stop Karim from swimming?
    options: ["Banyune adem", "Ombake gedhe banget", "Wis bengi"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Ra sah bayar.
    answers_meaning:
      ar_eg: ["مش لازم تدفع.", "ماتدفعش."]
      ar: ["لا داعي للدفع.", "لا تدفع."]
      en: ["No need to pay.", "You don't need to pay."]
next:
  ar_eg: كريم راجع المدينة بأتوبيس ترانس جوجا لحيّ براويروتامان... وبيتوه، ويسأل على الطريق، والناس بتشاور بطريقة غريبة.
  ar: يعود كريم إلى المدينة بحافلة ترانس جوغجا إلى حيّ براويروتامان... فيضيع ويسأل عن الطريق، والناس يشيرون بطريقة غريبة.
  en: Karim heads back to town on the Trans Jogja bus to Prawirotaman... gets lost, asks the way, and people point in a strange way.
review:
  status: draft
  verified: false
  notes: Moved from Kenjeran, Surabaya (Cak Mat, Arek speech) to Parangtritis, Jogja (Mas Bagus, street ngoko), 2026-10-27. je and og stay unverified, as in the j1.u05 lessons. Mas Bagus is a one-off. Check "Ra sah bayar" and clipped names (Her, Gus) as natural Jogja speech.
