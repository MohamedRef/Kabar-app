    ar_eg: صبور / صبرك
    ar: صبور
    en: patient
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: المية قطعت كام مرة الأسبوع ده في عمارة الحاجّة فاطمة؟
      ar: كم مرّة انقطع الماء هذا الأسبوع في عمارة الحاجّة فاطمة؟
      en: How many times has the water been cut off this week in Hagga Fatma's building?
    options: ["dua kali", "seminggu sekali", "tiga kali"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Kami mohon masalah ini diperbaiki ___.
    meaning:
      ar_eg: نرجو إصلاح المشكلة دي في أسرع وقت.
      ar: نرجو إصلاح هذه المشكلة في أسرع وقت.
      en: We kindly ask that this problem be fixed as soon as possible.
    answers: [secepatnya]
    options: ["seorang", "secepatnya", "sebuah"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: پاك RT نصح بايو بإيه؟
      ar: بماذا نصح باك RT بايو؟
      en: What does Pak RT advise Bayu to do?
    options: ["Semua warga gang menandatangani suratnya.", "Bayu menelepon kelurahan sekarang.", "Bayu membeli lampu baru sendiri.", "Bayu menulis surat yang lebih marah."]
    answer: 0
  - id: q04
    type: listen
    text: Lampu jalan di gang kita udah mati seminggu, lho. Gang kita segelap gua!
    question:
      ar_eg: بو تيني بتشتكي من إيه؟
      ar: ممّا تشتكي بو تيني؟
      en: What is Bu Tini complaining about?
    options: ["Airnya mati.", "Lampu jalannya mati.", "Gangnya kotor."]
    answer: 1
    meaning:
      ar_eg: عمود النور اللي في حارتنا بقاله أسبوع بايظ. الحارة بقت ضلمة زي المغارة!
      ar: مصباح الشارع في زقاقنا معطّل منذ أسبوع. صار زقاقنا مظلمًا كالكهف!
      en: The street light in our lane has been out for a week. The lane is as dark as a cave!
  - id: q05
    type: translate
    direction: from_target
    source_text: Mohon maaf sebelumnya.
    answers_meaning:
      ar_eg: ["آسفين مقدّمًا.", "متأسّف مقدّمًا.", "بعتذر من الأول."]
      ar: ["نعتذر مسبقًا.", "أعتذر مسبقًا.", "عذرًا مقدّمًا."]
      en: ["Apologies in advance.", "Sorry in advance.", "I apologise in advance."]
next:
  ar_eg: بايو عنده بحث في المدرسة عن بطل قومي إندونيسي. نادية بتختار بطلة مصرية… والاتنين اتولدوا في نفس السنة! وپاك بودي عنده بطل تالت خالص.
  ar: لدى بايو بحث مدرسي عن بطل وطني إندونيسي. وتختار نادية بطلة مصرية… وُلدت الاثنتان في السنة نفسها! ولدى باك بودي بطل ثالث مختلف تمامًا.
  en: Bayu has a school project on an Indonesian national hero. Nadia picks an Egyptian heroine… and they were born in the same year! And Pak Budi has a completely different hero.
