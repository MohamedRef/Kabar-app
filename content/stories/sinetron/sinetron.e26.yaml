  - word: dengan hormat
    ar_eg: تحية طيبة وبعد (فتحة جواب رسمي)
    ar: تحيّة طيّبة وبعد (افتتاحية رسالة رسمية)
    en: Dear Sir or Madam (formal letter opening)
  - word: secepatnya
    ar_eg: في أسرع وقت
    ar: في أسرع وقت
    en: as soon as possible
  - word: sebaiknya
