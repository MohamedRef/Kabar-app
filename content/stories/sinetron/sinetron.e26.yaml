title:
  target: Dengan Hormat, Airnya Mati
  ar_eg: تحية طيبة وبعد، المية مقطوعة
  ar: تحيّة طيّبة وبعد، الماء مقطوع
  en: Dear Sir or Madam, the Water's Off
summary:
  ar_eg: المية قطعت تالت مرة في عمارة الحاجّة فاطمة، وساري بتساعدها تكتب شكوى مؤدّبة… أكتر بكتير من الحاجّة نفسها. وفي ماديون، بايو بيكتب للكيلوراهان عن عمود نور بايظ في الحارة.
  ar: انقطع الماء للمرة الثالثة في عمارة الحاجّة فاطمة، فتساعدها ساري على كتابة شكوى مهذّبة… أكثر تهذيبًا من الحاجّة نفسها بكثير. وفي ماديون يكتب بايو إلى الكيلوراهان عن مصباح شارع معطّل في الزقاق.
  en: The water goes off for the third time in Hagga Fatma's building, and Sari helps her write a polite complaint… far more polite than Hagga herself. In Madiun, Bayu writes to the kelurahan about a broken street light in the lane.
cast: [Hagga Fatma, Sari, Nadia, Bayu, Pak RT, Bu Tini, Mas Joko, Pak Budi]
scenes:
  - setting:
      ar_eg: القاهرة، الصبح. الحنفيّة ناشفة، وفيه جراكن مية في المطبخ. الحاجّة فاطمة متضايقة، وساري فاتحة اللابتوب.
      ar: القاهرة، صباحًا. الصنبور جافّ، وفي المطبخ جراكن ماء. الحاجّة فاطمة منزعجة، وساري تفتح الحاسوب.
      en: Cairo, morning. The tap is dry and there are water jerrycans in the kitchen. Hagga Fatma is fed up, and Sari has her laptop open.
    lines:
      - speaker: Hagga Fatma
        text: Seminggu ini airnya mati tiga kali! Sari, tolong tulisin surat keluhan. Tulis, "Kalian semua nggak kerja!"
        ar_eg: الأسبوع ده المية قطعت تلات مرّات! يا ساري، اكتبي جواب شكوى. اكتبي «انتو كلّكم مش بتشتغلوا!»
        ar: انقطع الماء ثلاث مرّات هذا الأسبوع! يا ساري، اكتبي رسالة شكوى من فضلك. اكتبي «أنتم جميعًا لا تعملون!»
        en: The water's been off three times this week! Sari, please write a complaint letter. Write, "None of you do any work!"
        note:
          ar_eg: se- معناها «واحد» أو «كل الـ…» - seminggu = «أسبوع» أو «الأسبوع كلّه»، seorang = «شخص واحد»، sebuah = «واحدة (لحاجة)». وtulisin = tuliskan (اكتبيلي)، وtulis = اكتبي.
          ar: se- تعني «واحد» أو «كامل الـ…» - seminggu = «أسبوع» أو «الأسبوع كلّه»، seorang = «شخص واحد»، sebuah = «واحد (للأشياء)». وtulisin = tuliskan (اكتبي لي)، وtulis = اكتبي.
          en: 'se- means "one" or "the whole": seminggu = "a week / all week", seorang = "one person", sebuah = "one (thing)". tulisin = tuliskan (write it for me); tulis = write.'
      - speaker: Sari
        text: Sabar, Hagga. Surat keluhan harus sopan, dong. Kita mulai dengan "Dengan hormat."
        ar_eg: صبرك يا حاجّة. جواب الشكوى لازم يبقى مؤدّب. هنبدأ بـ «تحية طيبة وبعد».
        ar: صبرًا يا حاجّة. يجب أن تكون رسالة الشكوى مهذّبة. سنبدأ بـ «تحيّة طيّبة وبعد».
        en: Patience, Hagga. A complaint letter has to be polite. We start with "Dengan hormat."
        note:
          ar_eg: «Dengan hormat» (حرفيًّا «باحترام») هي فتحة أي جواب رسمي، و«Hormat saya» هي الختام. وhormat جاية من العربي «حُرمة»، وsabar من «صبر».
          ar: «Dengan hormat» (حرفيًّا «مع الاحترام») افتتاحية كل رسالة رسمية، و«Hormat saya» ختامها. وhormat من العربية «حُرمة»، وsabar من «صبر».
          en: '"Dengan hormat" (literally "with respect") opens every formal letter, and "Hormat saya" closes it. hormat comes from Arabic حُرمة; sabar from صبر (patience).'
      - speaker: Nadia
        text: Terus tulis, "Mohon maaf sebelumnya." Orang Indonesia tuh selalu minta maaf dulu, walaupun mereka yang marah!
        ar_eg: وبعدين اكتبي «آسفين مقدّمًا». الإندونيسيين دايمًا بيعتذروا الأول، حتى لو هما اللي زعلانين!
        ar: ثم اكتبي «نعتذر مسبقًا». الإندونيسيون يعتذرون دائمًا أولًا، حتى لو كانوا هم الغاضبين!
        en: Then write, "Apologies in advance." Indonesians always apologise first, even when they're the angry ones!
        note:
          ar_eg: terus = lalu (وبعدين)، وtuh بعد الكلمة بتشاور عليها - «الإندونيسيين بقى…». الكلام عادي، بس الجواب نفسه رسمي. وtulis = اكتبي.
          ar: terus = lalu (ثمّ)، وtuh بعد الكلمة تبرزها - «الإندونيسيون، كما تعرفين…». الحديث عامّي، أمّا الرسالة نفسها ففصحى. وtulis = اكتبي.
          en: terus = lalu (then); tuh after a word points at it — "Indonesians, you know…". The talk is casual; the letter itself is formal. tulis = write.
      - speaker: Sari
        text: '"Saya seorang warga di gedung nomor dua belas. Selama seminggu ini, air di gedung kami mati tiga kali."'
        ar_eg: «أنا ساكنة في عمارة رقم ١٢. خلال الأسبوع ده، المية في عمارتنا قطعت تلات مرّات.»
        ar: «أنا من سكّان المبنى رقم ١٢. خلال هذا الأسبوع انقطع الماء في مبنانا ثلاث مرّات.»
        en: '"I am a resident of building number twelve. This week, the water in our building has been cut off three times."'
      - speaker: Hagga Fatma
        text: Tulis juga, tekanan airnya nggak sekuat dulu. Mandi aja susah!
        ar_eg: واكتبي كمان إن ضغط المية مبقاش قوي زي زمان. حتى الاستحمام بقى صعب!
        ar: واكتبي أيضًا أن ضغط الماء لم يعد قويًّا كما كان. حتى الاستحمام صار صعبًا!
        en: Write that the water pressure isn't as strong as it used to be, too. Even showering is hard!
        note:
          ar_eg: se- + صفة = «قد / زي» - tidak sekuat dulu = «مش قوي زي زمان». وsesuai = «مطابق / على حسب». وmandi aja susah = mandi pun susah (حتى الاستحمام صعب)، وsusah = sulit، وtekanan = ضغط، وtulis = اكتبي.
          ar: se- مع الصفة تعني «بقدر / مثل» - tidak sekuat dulu = «ليس قويًّا كما كان». وsesuai تعني «مطابق / وفقًا لـ». وmandi aja susah = mandi pun susah (حتى الاستحمام صعب)، وsusah = sulit، وtekanan = ضغط، وtulis = اكتبي.
          en: se- + adjective = "as … as" — tidak sekuat dulu = "not as strong as before". sesuai = "in line with". mandi aja susah = mandi pun susah (even showering is hard); susah = sulit; tekanan = pressure; tulis = write.
      - speaker: Sari
        text: '"Kami mohon masalah ini diperbaiki secepatnya. Terima kasih atas perhatiannya. Hormat saya, Fatma."'
        ar_eg: «نرجو إصلاح المشكلة دي في أسرع وقت. شكرًا على اهتمامكم. مع خالص الاحترام، فاطمة.»
        ar: «نرجو إصلاح هذه المشكلة في أسرع وقت. شكرًا لاهتمامكم. مع فائق الاحترام، فاطمة.»
        en: '"We kindly ask that this problem be fixed as soon as possible. Thank you for your attention. Yours faithfully, Fatma."'
      - speaker: Narrator
        text: Tiba-tiba, dari kamar mandi terdengar suara air. Byur!
        ar_eg: فجأة، اتسمع صوت مية من الحمّام. شششش!
        ar: فجأة سُمع صوت الماء من الحمّام. شششش!
        en: Suddenly, the sound of water comes from the bathroom. Splash!
      - speaker: Hagga Fatma
        text: Airnya datang! Tapi kirim aja suratnya, Sari. Sebaiknya mereka tahu.
        ar_eg: المية جت! بس ابعتي الجواب برضه يا ساري. الأحسن إنهم يعرفوا.
        ar: جاء الماء! لكن أرسلي الرسالة على أيّ حال يا ساري. من الأفضل أن يعرفوا.
        en: The water's back! But send the letter anyway, Sari. Better that they know.
        note:
          ar_eg: kirim aja = kirim saja (ابعتي وخلاص). وkirim = يبعت.
          ar: kirim aja = kirim saja (أرسليها فحسب). وkirim = يرسل.
          en: kirim aja = kirim saja (just send it). kirim = to send.
  - setting:
      ar_eg: ماديون بالليل. الحارة ضلمة، وبايو قاعد في الوارونج بيكتب جواب. پاك RT، رئيس الجيران في الحارة، داخل يشرب قهوة.
      ar: ماديون ليلًا. الزقاق مظلم، وبايو يكتب رسالة في الوارونغ. يدخل باك RT، رئيس الجيران في الزقاق، ليشرب القهوة.
      en: Madiun at night. The lane is dark, and Bayu is writing a letter in the warung. Pak RT, the head of the lane's neighbourhood unit, comes in for a coffee.
    lines:
      - speaker: Bu Tini
        text: Lampu jalan di gang kita udah mati seminggu, lho. Gang kita segelap gua!
        ar_eg: عمود النور اللي في حارتنا بقاله أسبوع بايظ. الحارة بقت ضلمة زي المغارة!
        ar: مصباح الشارع في زقاقنا معطّل منذ أسبوع. صار زقاقنا مظلمًا كالكهف!
        en: The street light in our lane has been out for a week. The lane is as dark as a cave!
        note:
          ar_eg: udah = sudah. وsegelap gua = «ضلمة قدّ المغارة» (se- + gelap)، وgua = مغارة.
          ar: udah = sudah. وsegelap gua = «مظلم كالكهف» (se- + gelap)، وgua = كهف.
          en: udah = sudah. segelap gua = as dark as a cave (se- + gelap); gua = cave.
      - speaker: Bayu
        text: Makanya saya nulis surat ke kelurahan, Bu. Pak RT, surat saya udah sesuai belum, ya?
        ar_eg: عشان كده بكتب جواب للكيلوراهان يا بو. يا پاك RT، هو الجواب بتاعي مظبوط كده؟
        ar: لهذا أكتب رسالة إلى الكيلوراهان يا بو. يا باك RT، هل رسالتي مناسبة؟
        en: That's why I'm writing to the kelurahan, Bu. Pak RT, is my letter all right?
        note:
          ar_eg: makanya = «عشان كده»، وnulis = menulis، و«udah … belum?» = «apakah sudah …?» في الكلام. بايو مؤدّب مع الكبار (saya، Bu، Pak) بس بيتكلّم عادي. الكيلوراهان (kelurahan) هي مكتب الحيّ في المدينة. وتحتها الـ RT (Rukun Tetangga)، أصغر وحدة جيران، ورئيسها اسمه Pak RT أو Bu RT، وبيروحوله الأول في أي مشكلة.
          ar: makanya = «لهذا»، وnulis = menulis، و«udah … belum?» = «apakah sudah …?» في الكلام. بايو مهذّب مع الكبار (saya، Bu، Pak) لكنه يتكلّم بعامّية. الكيلوراهان (kelurahan) مكتب الحيّ في المدينة، وتحته الـ RT (Rukun Tetangga)، أصغر وحدة للجيران، ويُدعى رئيسها Pak RT أو Bu RT، ويُقصد أوّلًا عند أيّ مشكلة.
          en: makanya = that's why; nulis = menulis; "udah … belum?" = "apakah sudah …?" in speech. Bayu is polite to elders (saya, Bu, Pak) but still talks naturally. A kelurahan is the urban ward office. Below it is the RT (Rukun Tetangga), the smallest neighbourhood unit; its head is "Pak RT" or "Bu RT", the first person you go to with any problem.
      - speaker: Pak RT
        text: Coba saya baca. "Dengan hormat... Mohon maaf sebelumnya..." Bagus, Bayu. Sopan banget.
        ar_eg: وريني أقراه. «تحية طيبة وبعد... آسفين مقدّمًا...» حلو يا بايو. مؤدّب خالص.
        ar: دعني أقرأها. «تحيّة طيّبة وبعد... نعتذر مسبقًا...» جيّد يا بايو. مهذّبة جدًّا.
        en: Let me read it. "Dengan hormat... Mohon maaf sebelumnya..." Good, Bayu. Very polite.
      - speaker: Bayu
        text: '"Lampu jalan di Gang Melati mati sejak hari Senin. Sebaiknya lampu itu diganti secepatnya, supaya warga aman."'
        ar_eg: «عمود النور في حارة ميلاتي بايظ من يوم الاتنين. الأفضل يتغيّر في أسرع وقت، عشان السكّان يبقوا في أمان.»
        ar: «مصباح الشارع في زقاق ميلاتي معطّل منذ يوم الاثنين. والأفضل أن يُستبدل في أسرع وقت ليكون السكّان في أمان.»
        en: '"The street light in Gang Melati has been out since Monday. It should be replaced as soon as possible, so residents are safe."'
        note:
          ar_eg: se- + صفة + -nya بتعمل ظرف - secepatnya = «في أسرع وقت»، sebaiknya = «الأحسن / يُفضّل». الاتنين مهمّين جدًّا في الشكاوى.
          ar: se- مع الصفة و-nya تصوغ ظرفًا - secepatnya = «في أسرع وقت»، sebaiknya = «الأفضل / يُستحسن». وكلاهما مهمّ جدًّا في الشكاوى.
          en: se- + adjective + -nya makes an adverb — secepatnya = "as soon as possible", sebaiknya = "it would be best". Both are complaint-letter essentials.
      - speaker: Pak RT
        text: Sebaiknya surat ini ditandatangani semua warga gang. Suratnya jadi lebih kuat.
        ar_eg: الأحسن الجواب ده يمضي عليه كل سكّان الحارة. كده يبقى أقوى.
        ar: الأفضل أن يوقّع على هذه الرسالة جميع سكّان الزقاق، فتصبح أقوى.
        en: It would be best if everyone in the lane signed this letter. It'll carry more weight.
      - speaker: Mas Joko
        text: Saya tanda tangan pertama! Kemarin malam saya jatuh di depan warung, lho.
        ar_eg: أنا أوّل واحد يمضي! إمبارح بالليل وقعت قدّام الوارونج.
        ar: سأوقّع أوّلًا! سقطت أمس ليلًا أمام الوارونغ.
        en: I'll sign first! Last night I fell over in front of the warung.
      - speaker: Pak Budi
        text: Anak saya nulis surat resmi, lho. Bapak bangga, Le.
        ar_eg: ابني بيكتب جوابات رسمية. أنا فخور بيك يا ابني.
        ar: ابني يكتب رسائل رسمية. أنا فخور بك يا بنيّ.
        en: My son writing official letters. I'm proud of you, son.
      - speaker: Pak RT
        text: Besok pagi saya antar suratnya ke kelurahan. Makasih, Bayu.
        ar_eg: بكرة الصبح هودّي الجواب للكيلوراهان بنفسي. شكرًا يا بايو.
        ar: غدًا صباحًا سأوصل الرسالة إلى الكيلوراهان. شكرًا يا بايو.
        en: Tomorrow morning I'll take the letter to the kelurahan. Thank you, Bayu.
      - speaker: Narrator
        text: Tiga hari kemudian, Gang Melati terang lagi. Dan Bayu mulai suka menulis.
        ar_eg: بعد تلات أيام، حارة ميلاتي نوّرت تاني. وبايو بدأ يحبّ الكتابة.
        ar: بعد ثلاثة أيام عاد النور إلى زقاق ميلاتي، وبدأ بايو يحبّ الكتابة.
        en: Three days later, Gang Melati is bright again. And Bayu is starting to enjoy writing.
