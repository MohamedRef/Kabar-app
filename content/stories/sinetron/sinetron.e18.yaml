questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: ساري راحت فين الأول؟
      ar: إلى أين ذهبت ساري أولًا؟
      en: Where does Sari go first?
    options: ["ke Surabaya", "ke Jakarta", "ke Madiun"]
    answer: 1
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي ساق العربية؟
      ar: مَن قاد السيارة؟
      en: Who drives the car?
    options: ["Karim", "Sari", "Hagga Fatma", "Mas Joko"]
    answer: 3
  - id: q03
    type: fill_blank
    sentence: Ketika di Jakarta, pesawat saya ___ dua jam.
    meaning:
      ar_eg: وأنا في جاكرتا، الطيارة اتأخّرت ساعتين.
      ar: حين كنت في جاكرتا، تأخّرت طائرتي ساعتين.
      en: When I was in Jakarta, my flight was two hours late.
    answers: [terlambat]
    options: ["menyetir", "terlambat", "sambil"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: فطروا فين؟
      ar: أين أفطروا؟
      en: Where do they break their fast?
    options: ["di mobil", "di bandara", "di warung"]
    answer: 0
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: وفي الآخر، وصلت ماديون.
      ar: وأخيرًا وصلت إلى ماديون.
      en: Finally, I arrived in Madiun.
    answers: ["Akhirnya, saya sampai di Madiun.", "Akhirnya saya sampai di Madiun.", "Akhirnya, saya tiba di Madiun.", "Akhirnya saya tiba di Madiun.", "Akhirnya, aku sampai di Madiun.", "Akhirnya aku sampai di Madiun.", "Akhirnya, saya sampai di Madiun", "Akhirnya saya sampai di Madiun"]
next:
  ar_eg: طُق طُق طُق... زي أول حلقة بالظبط. بس المرة دي، ساري هي اللي برّه الباب.
  ar: طَق طَق طَق... تمامًا كما في الحلقة الأولى. لكن هذه المرة ساري هي التي خارج الباب.
  en: Knock, knock, knock... just like episode one. But this time, it's Sari outside the door.
