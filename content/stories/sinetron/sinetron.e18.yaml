episode: 18
language: id
level: bipa2
unlock_after: bipa2.u08
title:
  target: Perjalanan Mudik
  ar_eg: رحلة الرجوع للبلد
  ar: رحلة العودة إلى الديار
  en: The Journey Home
summary:
  ar_eg: نادية والحاجّة فاطمة بيودّعوا ساري في مطار القاهرة. بعد رحلة طويلة، كريم وماس جوكو مستنّيينها في سورابايا، والتلاتة بيفطروا في العربية وهما في الطريق لماديون.
  ar: تودّع نادية والحاجّة فاطمة ساري في مطار القاهرة. وبعد رحلة طويلة ينتظرها كريم وماس جوكو في سورابايا، ويفطر ثلاثتهم في السيارة في الطريق إلى ماديون.
  en: Nadia and Hagga Fatma see Sari off at Cairo airport. After a long trip, Karim and Mas Joko meet her in Surabaya, and the three break their fast in the car on the road to Madiun.
cast: [Hagga Fatma, Nadia, Sari, Mas Joko, Karim]
scenes:
  - setting:
      ar_eg: مطار القاهرة، الساعة ٤ العصر. ساري معاها شنطة كبيرة... وفانوس أزرق.
      ar: مطار القاهرة، الساعة الرابعة عصرًا. مع ساري حقيبة كبيرة... وفانوس أزرق.
      en: Cairo airport, 4 p.m. Sari has a big suitcase... and a blue fanous.
    lines:
      - speaker: Narrator
        text: Bandara Kairo. Jam empat sore.
        ar_eg: مطار القاهرة. الساعة ٤ العصر.
        ar: مطار القاهرة. الساعة الرابعة عصرًا.
        en: Cairo airport. Four in the afternoon.
      - speaker: Hagga Fatma
        text: Sari, ini kurma untuk keluargamu. Salam untuk Pak Budi!
        ar_eg: يا ساري، ده تمر لأهلك. سلّميلي على پاك بودي!
        ar: يا ساري، هذا تمر لعائلتكِ. بلّغي سلامي باك بودي!
        en: Sari, here are some dates for your family. Give my regards to Pak Budi!
      - speaker: Nadia
        text: Jadi, mula-mula kamu ke mana?
        ar_eg: طب، هتروحي فين الأول؟
        ar: إذن، إلى أين تذهبين أولًا؟
        en: So, where do you go first?
      - speaker: Sari
        text: Mula-mula saya naik pesawat ke Jakarta. Setelah itu, ke Surabaya.
        ar_eg: الأول هركب طيارة لجاكرتا. بعد كده، لسورابايا.
        ar: أولًا أركب الطائرة إلى جاكرتا، بعد ذلك إلى سورابايا.
        en: First I fly to Jakarta. After that, to Surabaya.
        note:
          ar_eg: عشان تحكي رحلة بالترتيب - mula-mula (الأول)، setelah itu (بعد كده)، selanjutnya (وبعدين)، akhirnya (وفي الآخر).
          ar: لسرد رحلة بالترتيب - mula-mula (أولًا)، setelah itu (بعد ذلك)، selanjutnya (ثم)، akhirnya (وأخيرًا).
          en: 'To tell a trip in order: mula-mula (first), setelah itu (after that), selanjutnya (next), akhirnya (finally).'
      - speaker: Nadia
        text: Selanjutnya?
        ar_eg: وبعدين؟
        ar: ثم؟
        en: And next?
      - speaker: Sari
        text: Akhirnya, saya naik mobil Mas Joko ke Madiun. Karim juga ada!
        ar_eg: وفي الآخر، هركب عربية ماس جوكو لماديون. وكريم كمان هيبقى معانا!
        ar: وأخيرًا أركب سيارة ماس جوكو إلى ماديون. وكريم أيضًا سيكون معنا!
        en: Finally, I ride in Mas Joko's car to Madiun. Karim's coming too!
      - speaker: Hagga Fatma
        text: Hati-hati di jalan, Nak!
        ar_eg: خلّي بالك من نفسك في السكة يا بنتي!
        ar: انتبهي لنفسكِ في الطريق يا ابنتي!
        en: Safe travels, dear!
        note:
          ar_eg: Nak (من anak) يعني «يا ابني / يا بنتي»، بيقولها الكبار لأي حدّ صغير بحنية. وHati-hati di jalan هي «توصل بالسلامة» بتاعتهم.
          ar: Nak (من anak) تعني «يا بنيّ / يا ابنتي»، يقولها الكبار للصغار تحبّبًا. وHati-hati di jalan هي عبارتهم بمعنى «في أمان الله».
          en: Nak (from anak, child) is how elders tenderly address a younger person. Hati-hati di jalan is the Indonesian "safe journey".
  - setting:
      ar_eg: مطار جواندا في سورابايا، تاني يوم الساعة ٥ العصر. كريم وماس جوكو مستنّيين برّه.
      ar: مطار جواندا في سورابايا، في اليوم التالي الساعة الخامسة عصرًا. ينتظر كريم وماس جوكو في الخارج.
      en: Juanda airport in Surabaya, the next day at 5 p.m. Karim and Mas Joko are waiting outside.
    lines:
      - speaker: Mas Joko
        text: Sari! Selamat datang kembali!
        ar_eg: ساري! حمد الله على السلامة!
        ar: ساري! حمدًا لله على سلامتكِ!
        en: Sari! Welcome back!
      - speaker: Karim
        text: Bagaimana perjalanannya? Kamu capek?
        ar_eg: الرحلة كانت عاملة إزاي؟ انتي تعبانة؟
        ar: كيف كانت الرحلة؟ هل أنتِ متعبة؟
        en: How was the journey? Are you tired?
      - speaker: Sari
        text: Capek sekali! Ketika di Jakarta, pesawat saya terlambat dua jam.
        ar_eg: تعبانة جدًا! وأنا في جاكرتا، الطيارة اتأخّرت ساعتين.
        ar: متعبة جدًّا! حين كنت في جاكرتا تأخّرت طائرتي ساعتين.
        en: So tired! When I was in Jakarta, my flight was two hours late.
        note:
          ar_eg: ketika = «لمّا / وقت ما»، بتربط حاجتين حصلوا في نفس الوقت.
          ar: ketika تعني «حين / عندما»، وتربط بين حدثين في الوقت نفسه.
          en: ketika = "when / while", linking two things happening at the same time.
      - speaker: Mas Joko
        text: Ayo! Kita buka puasa di jalan.
        ar_eg: يلا! هنفطر في السكة.
        ar: هيّا! سنفطر في الطريق.
        en: Let's go! We'll break our fast on the road.
  - setting:
      ar_eg: على الطريق من سورابايا لماديون (حوالي ٣ ساعات). الشمس بتغيب على الغيطان الخضرا.
      ar: على الطريق من سورابايا إلى ماديون (نحو ثلاث ساعات). الشمس تغرب فوق الحقول الخضراء.
      en: On the road from Surabaya to Madiun (about three hours). The sun is setting over green rice fields.
    lines:
      - speaker: Narrator
        text: Mas Joko menyetir. Sari melihat pemandangan sambil minum air putih.
        ar_eg: ماس جوكو بيسوق. ساري بتتفرّج على المنظر وهي بتشرب ميّة.
        ar: يقود ماس جوكو. وتتأمّل ساري المنظر وهي تشرب الماء.
        en: Mas Joko drives. Sari watches the scenery while drinking water.
        note:
          ar_eg: sambil = «وهو بيعمل كذا»، لحاجتين بيعملهم نفس الشخص في نفس الوقت.
          ar: sambil تعني «وهو يفعل كذا»، لفعلين يقوم بهما الشخص نفسه في الوقت ذاته.
          en: sambil = "while (doing)", for two things the same person does at once.
      - speaker: Narrator
        text: Saat magrib, Sari, Karim, dan Mas Joko buka puasa di mobil dengan kurma dari Hagga Fatma.
        ar_eg: وقت المغرب، ساري وكريم وماس جوكو فطروا في العربية بتمر الحاجّة فاطمة.
        ar: عند المغرب أفطرت ساري وكريم وماس جوكو في السيارة بتمر الحاجّة فاطمة.
        en: At sunset, Sari, Karim and Mas Joko break their fast in the car with Hagga Fatma's dates.
      - speaker: Sari
        text: Pemandangannya indah sekali! Saya senang di Jawa lagi.
        ar_eg: المنظر حلو أوي! أنا مبسوطة إني رجعت جاوة تاني.
        ar: المنظر جميل جدًّا! أنا سعيدة بعودتي إلى جاوة.
        en: The view is so beautiful! I'm happy to be back in Java.
      - speaker: Mas Joko
        text: Sari, jangan tidur! Sebentar lagi Madiun.
        ar_eg: يا ساري، متناميش! ماديون قرّبت.
        ar: يا ساري، لا تنامي! اقتربنا من ماديون.
        en: Sari, don't fall asleep! Madiun's coming up.
      - speaker: Karim
        text: Kita langsung ke rumah?
        ar_eg: هنروح على البيت على طول؟
        ar: هل نذهب إلى البيت مباشرة؟
        en: Are we going straight to the house?
      - speaker: Sari
        text: Ya, langsung! Tapi pelan-pelan... Bapak dan Ibu tidak tahu!
        ar_eg: آه، على طول! بس بالراحة... بابا وماما ميعرفوش!
        ar: نعم، مباشرة! لكن بهدوء... أبي وأمي لا يعلمان!
        en: Yes, straight there! But quietly... Mum and Dad don't know!
      - speaker: Narrator
        text: Akhirnya, jam sembilan malam, mobil Mas Joko sampai di gang. Tok, tok, tok!
        ar_eg: وفي الآخر، الساعة ٩ بالليل، عربية ماس جوكو وصلت الحارة. طُق، طُق، طُق!
        ar: وأخيرًا، في التاسعة ليلًا، وصلت سيارة ماس جوكو إلى الزقاق. طَق، طَق، طَق!
        en: Finally, at nine at night, Mas Joko's car reaches the lane. Knock, knock, knock!
new_words:
