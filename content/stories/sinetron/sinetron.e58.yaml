title:
  target: Hujan Membawa Kebaikan
  ar_eg: المطر خير
  ar: المطر خير
  en: Rain Brings Good Things
summary:
  ar_eg: يوم الفرح في ماديون والسما سودا. بو تيني عايزة تجيب «شيخ المطر»، وبايو بيشرح علم المطر - مرة بلغة المقالات العلمية ومرة لماس جوكو كإنه طفل. وبعدين كتب الكتاب - باك بودي وكريم إيد في إيد، والشهود بيقولوا «صحّ!»... والمطر بينزل في نفس اللحظة.
  ar: يوم العرس في ماديون والسماء سوداء. تريد بو تيني استدعاء «حابس المطر»، ويشرح بايو علم المطر - مرّة بلغة المقالات العلمية ومرّة لماس جوكو كأنه طفل. ثم عقد القران - يد باك بودي في يد كريم، ويقول الشهود «صحّ!»... وفي اللحظة نفسها ينهمر المطر.
  en: Wedding day in Madiun, under a black sky. Bu Tini wants to call a rain handler, and Bayu explains the science of rain - once in science-article language, once to Mas Joko as if to a child. Then the marriage contract - Pak Budi's hand in Karim's, the witnesses cry "sah!"... and at that very moment the rain comes down.
cast: [Pak Budi, Bu Tini, Bayu, Mas Joko, Karim, Bu Rahayu, Pak Syamsul, Sari, Nadia]
scenes:
  - setting:
      ar_eg: حارة ميلاتي، يوم سبت الصبح في ديسمبر. الكراسي متصفّفة قدّام البيت، بس الخيمة لسه ماتركّبتش. السما ضلمة خالص.
      ar: زقاق ميلاتي صباح سبت في ديسمبر. الكراسي مصفوفة أمام البيت، لكنّ الخيمة لم تُنصب بعد، والسماء شديدة القتامة.
      en: Gang Melati, a Saturday morning in December. Chairs are lined up in front of the house, but the marquee isn't up yet. The sky is very dark.
    lines:
      - speaker: Narrator
        text: Sabtu pagi, bulan Desember. Kursi-kursi sudah berjajar, tenda belum dipasang, dan langit di atas Gang Melati gelap sekali.
        ar_eg: سبت الصبح، في ديسمبر. الكراسي متصفّفة، والخيمة لسه متركّبتش، والسما فوق حارة ميلاتي ضلمة أوي.
        ar: صباح سبت من ديسمبر. صُفّت الكراسي ولم تُنصب الخيمة بعد، والسماء فوق زقاق ميلاتي مظلمة جدًّا.
        en: Saturday morning, in December. The chairs are lined up, the marquee isn't up, and the sky over Gang Melati is very dark.
      - speaker: Pak Budi
        text: Le, lihat awan itu. Hitam kayak kopi tubruk. Kalau hujan, gimana akadnya?
        ar_eg: يا ابني، بصّ السحاب ده. أسود زي القهوة التُركي. لو مطرت، كتب الكتاب هيبقى إزاي؟
        ar: يا بنيّ، انظر إلى تلك الغيوم. سوداء كالقهوة المغليّة. إن أمطرت فكيف يكون العقد؟
        en: Son, look at those clouds. Black as kopi tubruk. If it rains, what happens to the ceremony?
        note:
          ar_eg: kayak = seperti (زي) في الكلام. وkopi tubruk = قهوة سادة تقيلة بالتفل، وakad = عقد الجواز.
          ar: kayak = seperti (مثل) في الكلام اليومي. وkopi tubruk = قهوة ثقيلة بالتفل، وakad = عقد الزواج.
          en: kayak = seperti (like) in speech. kopi tubruk = strong coffee with the grounds in; akad = the marriage contract.
      - speaker: Bu Tini
        text: Pak Budi, saya kenal pawang hujan yang bagus, lho. Pas anak saya menikah, hujannya pindah ke kecamatan sebelah!
        ar_eg: يا باك بودي، أنا أعرف «شيخ مطر» شاطر. لما بنتي اتجوّزت، المطر راح الحيّ اللي جنبنا!
        ar: يا باك بودي، أعرف حابس مطر ماهرًا. حين تزوّجت ابنتي انتقل المطر إلى الناحية المجاورة!
        en: Pak Budi, I know a good pawang hujan. When my daughter got married, the rain moved to the next district!
        note:
          ar_eg: pawang hujan هو «شيخ المطر» - شخص الناس بتؤمن إنه يقدر يبعد المطر عن الأفراح والمناسبات بطقوس ودعوات. العادة دي لسه موجودة، والعالم كلّه اتفرّج على واحدة منهم في سباق موتو جي بي في لومبوك سنة ٢٠٢٢. pas = waktu (لما) في الكلام، وkecamatan = حيّ/مركز إداري.
          ar: pawang hujan «حابس المطر» - شخص يُعتقد أنه يصرف المطر عن الأعراس والمناسبات بطقوس وأدعية. وما زالت هذه العادة حيّة، وقد شاهد العالم إحداهنّ في سباق موتو جي بي في لومبوك عام ٢٠٢٢. pas = waktu (حين) في الكلام اليومي، وkecamatan = ناحية إدارية.
          en: A pawang hujan is a rain handler, believed to steer rain away from weddings and events with rituals and prayers. The practice is alive and well - the world watched one at work at the MotoGP race on Lombok in 2022. pas = waktu (when) in speech; kecamatan = district.
      - speaker: Bayu
        text: Bu Tini, pawang hujan nggak bisa mindahin awan. Desember itu memang musim hujan. Saya jelasin secara ilmiah, ya.
        ar_eg: يا بو تيني، شيخ المطر مش هيقدر يزقّ السحاب. ديسمبر ده موسم المطر. خلّيني أشرحلك علميًا.
        ar: يا بو تيني، لا يستطيع حابس المطر تحريك الغيوم. ديسمبر موسم الأمطار. دعيني أشرح ذلك علميًّا.
        en: Bu Tini, a rain handler can't move clouds. December is the rainy season. Let me explain it scientifically.
        note:
          ar_eg: mindahin = memindahkan (ينقل)، jelasin = jelaskan (أشرح) - بالـ -in. وilmiah = علمي (من العربي «علم»). وبعدها بايو بيقلب على لغة علمية فصيحة.
          ar: mindahin = memindahkan (ينقل)، وjelasin = jelaskan (أشرح) - باللاحقة -in. وilmiah = علميّ (من العربية). ثمّ ينتقل بايو إلى لغة علمية فصحى.
          en: mindahin = memindahkan (to move), jelasin = jelaskan (explain) - the -in ending. ilmiah = scientific (Arabic علمي). Bayu then switches to formal science language.
      - speaker: Bayu
        text: Pembentukan awan hujan di Pulau Jawa pada bulan Desember dipengaruhi oleh angin muson barat yang membawa banyak uap air.
        ar_eg: تكوين سحاب المطر في جزيرة جاوة في شهر ديسمبر بيتأثّر بالرياح الموسمية الغربية اللي بتشيل بخار مية كتير.
        ar: يتأثّر تكوّن سحب المطر في جزيرة جاوة في شهر ديسمبر بالرياح الموسمية الغربية المحمّلة بكثير من بخار الماء.
        en: The formation of rain clouds over Java in December is influenced by the west monsoon, which carries a great deal of water vapour.
        note:
          ar_eg: كلمة muson (الرياح الموسمية) جت للإندونيسي من الهولندي، وأصلها البعيد عربي - «موسم»! البحّارة العرب كانوا بيسمّوا مواسم الرياح في المحيط الهندي «مواسم». pembentukan = تكوين، dipengaruhi = متأثّر، barat = غرب، uap = بخار.
          ar: كلمة muson دخلت الإندونيسية من الهولندية، وأصلها البعيد عربي من «موسم»؛ فقد سمّى البحّارة العرب مواقيت الرياح في المحيط الهندي مواسم. pembentukan = تكوُّن، وdipengaruhi = يتأثّر، وbarat = الغرب، وuap = بخار.
          en: muson (monsoon) came into Indonesian via Dutch, but its distant origin is Arabic موسم (season) - Arab sailors named the Indian Ocean's wind seasons that way. pembentukan = formation, dipengaruhi = influenced, barat = west, uap = vapour.
      - speaker: Mas Joko
        text: Mas Bayu, saya nggak kuliah. Jelasin kayak ke anak kecil aja.
        ar_eg: يا ماس بايو، أنا مدخلتش جامعة. اشرحلي كإنّي عيّل صغيّر.
        ar: يا ماس بايو، لم أدرس في الجامعة. اشرح لي كأنني طفل صغير.
        en: Mas Bayu, I never went to university. Explain it like I'm a little kid.
        note:
          ar_eg: jelasin = jelaskan (اشرح)، kayak = seperti (زي).
          ar: jelasin = jelaskan (اشرح)، وkayak = seperti (مثل).
          en: jelasin = jelaskan (explain), kayak = seperti (like).
      - speaker: Bayu
        text: Oke. Matahari memasak air laut. Airnya naik jadi uap. Di atas, uapnya kedinginan, lalu berkumpul jadi awan. Kalau awannya sudah terlalu gemuk, airnya jatuh. Itulah hujan.
        ar_eg: ماشي. الشمس بتطبخ مية البحر. المية بتطلع بخار. فوق، البخار بيبرد، ويتلمّ ويبقى سحاب. ولما السحاب يتخن أوي، الميّة بتقع. ده هو المطر.
        ar: حسنًا. الشمس تطهو ماء البحر، فيصعد الماء بخارًا. وفي الأعلى يبرد البخار ويتجمّع سحابًا. وحين يثقل السحاب أكثر من اللازم يسقط الماء. هذا هو المطر.
        en: Okay. The sun cooks the seawater. The water rises as vapour. Up high, the vapour gets cold and gathers into clouds. When the clouds get too fat, the water falls. That's rain.
        note:
          ar_eg: uap = بخار، وkedinginan = بيبرد (حاسس بالبرد).
          ar: uap = بخار، وkedinginan = يبرد (يشعر بالبرد).
          en: uap = vapour; kedinginan = to get cold, feel cold.
      - speaker: Mas Joko
        text: Oh! Kayak saya habis makan di kondangan. Terlalu gemuk, terus ketiduran.
        ar_eg: آه! زيّي بعد ما آكل في فرح. أتخن أوي، وبعدين أقع نايم.
        ar: آه! مثلي بعد الأكل في عرس - أمتلئ كثيرًا ثمّ أسقط نائمًا.
        en: Oh! Like me after eating at a wedding. Too full, then I fall asleep.
        note:
          ar_eg: kayak = seperti، habis = sehabis (بعد)، ketiduran = jatuh tertidur (راح في النوم من غير ما يقصد). وkondangan = فرح بتروحه ضيف.
          ar: kayak = seperti، وhabis = sehabis (بعد)، وketiduran = jatuh tertidur (غلبه النوم). وkondangan = حفل عرس تحضره ضيفًا.
          en: kayak = seperti, habis = sehabis (after), ketiduran = jatuh tertidur (nod off without meaning to). kondangan = a wedding party you attend as a guest.
      - speaker: Bayu
        text: Nama ilmiahnya penguapan, pendinginan, dan pengembunan. Semuanya kata benda. Ilmuwan memang suka mengubah kata kerja menjadi kata benda.
        ar_eg: أساميهم العلمية تبخّر، وتبريد، وتكثّف. وكلّهم أسماء. العلماء بيحبّوا يحوّلوا الأفعال لأسماء.
        ar: أسماؤها العلمية التبخّر والتبريد والتكثّف، وكلّها أسماء. فالعلماء يحبّون تحويل الأفعال إلى أسماء.
        en: The scientific names are evaporation, cooling and condensation. All nouns. Scientists do love turning verbs into nouns.
        note:
          ar_eg: ده اسمه nominalisasi - تحويل الفعل لاسم بـ peN-...-an أو pe-...-an. uap (بخار) ← penguapan (تبخّر)، dingin (برد) ← pendinginan (تبريد)، embun (ندى) ← pengembunan (تكثّف). زي المصدر في العربي - «تبخّر» من «تبخّر».
          ar: 'هذا ما يُسمّى nominalisasi - تحويل الفعل إلى اسم بـ peN-...-an أو pe-...-an: uap (بخار) ← penguapan (تبخّر)، dingin (برد) ← pendinginan (تبريد)، embun (ندى) ← pengembunan (تكثّف). وهو كالمصدر في العربية.'
          en: 'This is nominalisation - turning verbs into nouns with peN-...-an: uap (vapour) → penguapan (evaporation), dingin (cold) → pendinginan (cooling), embun (dew) → pengembunan (condensation). Like the Arabic masdar.'
      - speaker: Karim
        text: Di Mesir, hujan itu jarang. Jadi kalau hujan, orang bilang, "Ad-dunya bitmattar khair." Hujan membawa kebaikan.
        ar_eg: في مصر المطر قليل. فلما تمطر، الناس بتقول «الدنيا بتمطّر خير.»
        ar: في مصر المطر نادر. فإذا أمطرت قال الناس «الدنيا تمطر خيرًا.»
        en: In Egypt, rain is rare. So when it rains, people say "it's raining good things." Rain brings blessings.
        note:
          ar_eg: bilang = berkata (يقول). وkebaikan = خير.
          ar: bilang = berkata (يقول). وkebaikan = الخير.
          en: bilang = berkata (to say). kebaikan = goodness, blessings.
      - speaker: Bu Rahayu
        text: Mas Karim! Pengantin laki-laki nggak boleh keliling di luar sebelum akad. Masuk dulu, sana!
        ar_eg: يا ماس كريم! العريس ميلفّش برّه قبل كتب الكتاب. ادخل جوّه!
        ar: يا ماس كريم! لا يتجوّل العريس في الخارج قبل العقد. ادخل!
        en: Mas Karim! The groom doesn't wander about outside before the ceremony. Inside, now!
      - speaker: Pak Budi
        text: Ya udah. Ilmu sama doa sama-sama penting. Kita pasang tenda, terus kita berdoa.
        ar_eg: خلاص. العلم والدعا الاتنين مهمّين. نركّب الخيمة، وبعدين ندعي.
        ar: حسنًا. العلم والدعاء كلاهما مهمّ. ننصب الخيمة ثمّ ندعو.
        en: Very well. Science and prayer both matter. We put up the marquee, and then we pray.
        note:
          ar_eg: ya udah = baiklah (خلاص ماشي)، sama = dan (و) - كلام كل يوم.
          ar: ya udah = baiklah (حسنًا إذن)، وsama = dan (و) - من الكلام اليومي.
          en: ya udah = baiklah (OK then), sama = dan (and) - everyday speech.
      - speaker: Bayu
        text: Setuju, Pak. Tenda adalah teknologi pencegahan basah yang sudah terbukti.
        ar_eg: موافق يا بابا. الخيمة تكنولوجيا مجرّبة للوقاية من البلّ.
        ar: موافق يا أبي. الخيمة تقنية مجرَّبة للوقاية من البلل.
        en: Agreed, Dad. A marquee is a proven wetness-prevention technology.
  - setting:
      ar_eg: الساعة تسعة. تحت الخيمة، قدّام ترابيزة صغيّرة، باك شمسول من KUA قاعد. كريم لابس «بيسكاب» و«بلانكون» - الجاكيت وغطا الراس الجاويين الرسميين - وقاعد قصاد باك بودي. ساري مستنّية في أوضتها.
      ar: الساعة التاسعة. تحت الخيمة يجلس باك شمسول من مكتب الشؤون الدينية أمام طاولة صغيرة. يرتدي كريم «البيسكاب» و«البلانكون» - السترة وغطاء الرأس الجاويّين الرسميّين - ويجلس قبالة باك بودي. وساري تنتظر في غرفتها.
      en: Nine o'clock. Under the marquee, Pak Syamsul from the KUA sits at a small table. Karim, in a Javanese beskap jacket and blangkon headcloth, sits facing Pak Budi. Sari waits in her room.
    lines:
      - speaker: Pak Syamsul
        text: Bismillahirrahmanirrahim. Akad nikah antara Saudara Karim bin Mahmoud dan Saudari Sari binti Budi kita mulai. Silakan, Pak Budi.
        ar_eg: بسم الله الرحمن الرحيم. نبدأ عقد القران بين الأستاذ كريم بن محمود والآنسة ساري بنت بودي. اتفضّل يا باك بودي.
        ar: بسم الله الرحمن الرحيم. نبدأ عقد القران بين السيّد كريم بن محمود والآنسة ساري بنت بودي. تفضّل يا باك بودي.
        en: In the name of God, the Most Gracious, the Most Merciful. We begin the marriage contract between Mr Karim bin Mahmoud and Miss Sari binti Budi. Please, Pak Budi.
        note:
          ar_eg: هنا الكلام رسمي جدًا عشان ده عقد الجواز. akad nikah = عقد النكاح، bin / binti = ابن / بنت، وSaudara / Saudari = السيد / الآنسة.
          ar: الكلام هنا رسميّ تمامًا لأنه عقد الزواج. akad nikah = عقد النكاح، وbin / binti = ابن / بنت، وSaudara / Saudari = السيّد / الآنسة.
          en: Fully formal here - it is the marriage contract. akad nikah = عقد النكاح, bin / binti = son of / daughter of, Saudara / Saudari = Mr / Miss.
      - speaker: Pak Budi
        text: Saudara Karim bin Mahmoud, saya nikahkan dan saya kawinkan engkau dengan putri kandung saya, Sari binti Budi, dengan mas kawin seperangkat alat salat dan cincin emas, dibayar tunai.
        ar_eg: يا كريم بن محمود، زوّجتك وأنكحتك بنتي، ساري بنت بودي، على مهر طقم صلاة وخاتم دهب، مدفوع حالًا.
        ar: يا كريم بن محمود، أنكحتُك وزوّجتُك ابنتي ساري بنت بودي، على مهرٍ هو طقم صلاة وخاتم ذهب، معجَّلًا.
        en: Karim bin Mahmoud, I marry you to my own daughter, Sari binti Budi, with a dowry of a set of prayer things and a gold ring, paid in full.
        note:
          ar_eg: ده الإيجاب، والردّ القبول - ijab وkabul من العربي. وmas kawin هو المهر (وكمان بيتقال mahar من «مهر»). وseperangkat alat salat (سجّادة ولبس صلاة ومصحف) مهر منتشر جدًا في إندونيسيا. وdibayar tunai يعني «مدفوع على طول» - جزء ثابت من الصيغة. nikahkan / kawinkan = أزوّجك، engkau = انت (كلمة رسمية قديمة)، kandung = من صلبي، seperangkat = طقم.
          ar: هذا هو الإيجاب، ويليه القبول - ijab وkabul من العربية. وmas kawin هو المهر (ويُقال أيضًا mahar من «مهر»). وseperangkat alat salat (سجّادة وثوب صلاة ومصحف) مهر شائع جدًّا في إندونيسيا. وdibayar tunai أي «معجَّلًا»، جزء ثابت من الصيغة. nikahkan / kawinkan = أُزوِّج، وengkau = أنت (صيغة رسمية قديمة)، وkandung = من صلبي، وseperangkat = طقم.
          en: This is the ijab (offer) and the reply is the kabul (acceptance), both from Arabic. mas kawin is the dowry (also mahar, from مهر); a set of prayer things - mat, prayer clothes, a Qur'an - is a very common one in Indonesia. dibayar tunai, "paid in cash", is a fixed part of the formula. nikahkan / kawinkan = I marry (you) off, engkau = you (old, solemn), kandung = by blood, seperangkat = a set of.
      - speaker: Karim
        text: Saya terima nikah dan kawinnya Sari binti Budi dengan mas kawin tersebut, dibayar tunai.
        ar_eg: قبلت زواج ساري بنت بودي على المهر المذكور، مدفوع حالًا.
        ar: قبلتُ نكاح ساري بنت بودي وزواجها على المهر المذكور، معجَّلًا.
        en: I accept the marriage of Sari binti Budi with the said dowry, paid in full.
        note:
          ar_eg: وده القبول. kawinnya = زواجها، tersebut = المذكور، dibayar = مدفوع، binti = بنت.
          ar: وهذا هو القبول. kawinnya = زواجها، وtersebut = المذكور، وdibayar = مدفوع، وbinti = بنت.
          en: This is the kabul. kawinnya = her marriage, tersebut = the said, dibayar = paid, binti = daughter of.
      - speaker: Pak Syamsul
        text: Bagaimana, para saksi? Sah?
        ar_eg: إيه رأي الشهود؟ صحّ؟
        ar: ما قول الشهود؟ صحّ؟
        en: Witnesses? Is it valid?
      - speaker: Mas Joko
        text: SAH!
        ar_eg: صحّ!
        ar: صحّ!
        en: VALID!
      - speaker: Pak Syamsul
        text: Alhamdulillah. Barakallahu laka wa baraka 'alaika wa jama'a bainakuma fi khair.
        ar_eg: الحمد لله. بارك الله لك وبارك عليك وجمع بينكما في خير.
        ar: الحمد لله. بارك الله لك وبارك عليك وجمع بينكما في خير.
        en: Praise be to God. May God bless you, shower blessings upon you, and bring you together in goodness.
        note:
          ar_eg: الدعوة دي من الحديث الشريف، وبتتقال للعرسان في إندونيسيا ومصر والعالم الإسلامي كلّه - حتّة من العربي الكل بيفهمها في الفرح.
          ar: هذا الدعاء مأثور في الحديث الشريف، ويُقال للعروسين في إندونيسيا ومصر والعالم الإسلامي كلّه - عبارة عربية يفهمها الجميع في العرس.
          en: This prayer comes from the hadith and is said to newlyweds across the Muslim world, Indonesia and Egypt alike - a piece of Arabic everyone at the wedding understands.
      - speaker: Narrator
        text: Tepat pada saat itu, hujan turun dengan deras. Bu Samia berseru, "Khair!" Tetapi di bawah tenda, tidak ada yang basah.
        ar_eg: في اللحظة دي بالظبط، المطر نزل جامد. بو سامية قالت بصوت عالي «خير!» بس تحت الخيمة، محدّش اتبلّ.
        ar: في تلك اللحظة بالذات انهمر المطر غزيرًا، فهتفت بو سامية «خير!». لكنّ أحدًا تحت الخيمة لم يبتلّ.
        en: At that very moment, the rain pours down. Bu Samia cries, "Khair!" But under the marquee, nobody gets wet.
      - speaker: Narrator
        text: Pintu kamar terbuka. Sari keluar dengan kebaya putih, lalu mencium tangan suaminya.
        ar_eg: باب الأوضة اتفتح. ساري طلعت بكبايا بيضا، وباست إيد جوزها.
        ar: فُتح باب الغرفة، وخرجت ساري بكبايا بيضاء، ثمّ قبّلت يد زوجها.
        en: The bedroom door opens. Sari comes out in a white kebaya and kisses her husband's hand.
      - speaker: Sari
        text: Mas Karim.
        ar_eg: ماس كريم.
        ar: ماس كريم.
        en: Mas Karim.
      - speaker: Karim
        text: '"Mas"? Kamu belum pernah manggil aku "Mas".'
        ar_eg: «ماس»؟ انتي عمرك ما ندهتيلي «ماس».
        ar: «ماس»؟ لم تناديني «ماس» من قبل قطّ.
        en: '"Mas"? You''ve never called me "Mas" before.'
        note:
          ar_eg: manggil = memanggil (ينادي) - في الكلام بنشيل me-.
          ar: manggil = memanggil (ينادي) - في المحادثة تسقط me-.
          en: manggil = memanggil (to call) - speech drops the me-.
      - speaker: Sari
        text: Sekarang udah boleh, dong.
        ar_eg: دلوقتي بقى ينفع.
        ar: الآن صار ذلك جائزًا.
        en: Now I'm allowed to.
        note:
          ar_eg: udah = sudah، يعني «خلاص/بقى» في الكلام العادي.
          ar: udah = sudah، أي «قد/صار» في الكلام اليومي.
          en: udah = sudah (already).
      - speaker: Pak Budi
        text: Bu, jangan salah paham. Ini bukan air mata. Ini... air hujan.
        ar_eg: يا رهايو، متفهميش غلط. دي مش دموع. دي... مية مطر.
        ar: يا رهايو، لا تسيئي الفهم. هذه ليست دموعًا. إنها... ماء مطر.
        en: Dear, don't misunderstand. These aren't tears. This is... rainwater.
      - speaker: Bu Rahayu
        text: Pak, tendanya nggak bocor, lho.
        ar_eg: يا بودي، الخيمة مش بتخرّ.
        ar: يا باك، الخيمة لا تسرّب الماء.
        en: Pak, the marquee isn't leaking.
      - speaker: Nadia
        text: Udah, udah! Sekarang... zaffa! Tabla, mulai!
        ar_eg: خلاص، خلاص! ودلوقتي... الزفّة! يلا يا طبلة!
        ar: كفى، كفى! والآن... الزفّة! هيّا يا طبلة!
        en: Right, right! And now... the zaffa! Drums, go!
        note:
          ar_eg: Udah, udah = Sudah, sudah (خلاص بقى!). وzaffa = الزفّة.
          ar: Udah, udah = Sudah, sudah (كفى!). وzaffa = الزفّة.
          en: Udah, udah = Sudah, sudah (OK, enough!). zaffa = the Egyptian wedding procession.
