questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: ليه بيمطر كتير في جاوة في ديسمبر حسب بايو؟
      ar: لماذا تكثر الأمطار في جاوة في ديسمبر بحسب بايو؟
      en: According to Bayu, why does it rain so much in Java in December?
    options: ["Karena pawang hujan sedang libur.", "Karena ada pernikahan di Gang Melati.", "Karena musim hujan, dan angin muson barat membawa banyak uap air.", "Karena matahari tidak bersinar."]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Saya terima nikah dan kawinnya Sari binti Budi dengan mas kawin tersebut, dibayar ___.
    meaning:
      ar_eg: قبلت زواج ساري بنت بودي على المهر المذكور، مدفوع حالًا.
      ar: قبلتُ نكاح ساري بنت بودي على المهر المذكور، معجَّلًا.
      en: I accept the marriage of Sari binti Budi with the said dowry, paid in full.
    answers: [tunai]
    options: ["tunai", "besok", "kredit"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: (استنتاج) ليه ساري قالت «دلوقتي بقى ينفع» أنادي كريم «ماس»؟
      ar: (استنتاج) لماذا قالت ساري «الآن صار ذلك جائزًا» عن مناداة كريم بـ«ماس»؟
      en: (Inference) Why does Sari say "now I'm allowed to" call Karim "Mas"?
    options: ["Karena Karim sekarang lebih tua.", "Karena sekarang dia istrinya, dan \"Mas\" menunjukkan kedekatan dan hormat kepada suami.", "Karena Pak Syamsul menyuruhnya.", "Karena Karim sudah bisa bahasa Jawa."]
    answer: 1
  - id: q04
    type: listen
    text: Matahari memasak air laut. Airnya naik jadi uap. Di atas, uapnya kedinginan, lalu berkumpul jadi awan.
    question:
      ar_eg: إيه اللي بيحصل للبخار فوق؟
      ar: ماذا يحدث للبخار في الأعلى؟
      en: What happens to the vapour up high?
    options: ["Uapnya menjadi panas.", "Uapnya jatuh ke laut.", "Uapnya hilang.", "Uapnya dingin, lalu berkumpul jadi awan."]
    answer: 3
    meaning:
      ar_eg: الشمس بتطبخ مية البحر. المية بتطلع بخار. فوق، البخار بيبرد، ويتلمّ ويبقى سحاب.
      ar: الشمس تطهو ماء البحر، فيصعد الماء بخارًا. وفي الأعلى يبرد البخار ويتجمّع سحابًا.
      en: The sun cooks the seawater. The water rises as vapour. Up high, the vapour gets cold and gathers into clouds.
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المطر بيجيب الخير.
      ar: المطر يجلب الخير.
      en: Rain brings good things.
    answers: ["Hujan membawa kebaikan.", "Hujan membawa kebaikan", "Hujan itu membawa kebaikan.", "Hujan itu membawa kebaikan", "Hujan membawa berkah.", "Hujan membawa berkah", "Hujan itu membawa berkah.", "Hujan itu membawa berkah", "Hujan adalah kebaikan.", "Hujan adalah kebaikan", "Hujan itu berkah.", "Hujan itu berkah", "Hujan itu kebaikan.", "Hujan itu kebaikan"]
next:
  ar_eg: بعد الفرح، ضيفة من الضيوف - مديرة في شركة في ماديون - عايزة الوارونج يعمل أكل يومي لخمسين موظّف. بايو وماس جوكو هيتفاوضوا... وطبّاخ من بادانج عنده درس رندانج مبيخلصش قبل أربع ساعات.
  ar: بعد العرس، تريد إحدى الضيفات - مديرة في شركة بماديون - أن يعدّ الوارونغ وجبات يومية لخمسين موظفًا. سيتفاوض بايو وماس جوكو... وعند طاهٍ من بادانغ درس في الرندانغ لا ينتهي قبل أربع ساعات.
  en: After the wedding, one of the guests - a manager at a Madiun company - wants the warung to cater daily lunches for fifty staff. Bayu and Mas Joko will negotiate... and a chef from Padang has a rendang lesson that takes at least four hours.
