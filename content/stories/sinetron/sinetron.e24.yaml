title:
  target: Pecel Kurang Garam
  ar_eg: پيتشل بملح أقل
  ar: بيتشل قليل الملح
  en: Pecel, Hold the Salt
summary:
  ar_eg: الدكتورة وولان بتقول لپاك بودي يقلّل الملح والسكر، وده بالنسبة له كارثة. بس بايو بيعمل «منيو صحّي» في الوارونج، والقاهرة بتدافع عن الفول المدمّس.
  ar: تطلب الدكتورة وولان من باك بودي أن يقلّل الملح والسكّر، وهذا عنده كارثة. لكن بايو يصنع «قائمة صحّية» في الوارونغ، والقاهرة تدافع عن الفول المدمّس.
  en: Dokter Wulan tells Pak Budi to cut down on salt and sugar, which to him is a disaster. But Bayu creates a "healthy menu" at the warung, and Cairo sticks up for ful medames.
cast: [Dokter Wulan, Pak Budi, Bu Rahayu, Bayu, Mas Joko, Nadia, Sari]
scenes:
  - setting:
      ar_eg: عيادة الدكتورة وولان في ماديون، كشف متابعة. بو راهايو قاعدة جنب جوزها ومعاها نوتة.
      ar: عيادة الدكتورة وولان في ماديون، زيارة متابعة. تجلس بو راهايو بجانب زوجها ومعها دفتر.
      en: Dokter Wulan's clinic in Madiun, a check-up. Bu Rahayu sits beside her husband with a notebook.
    lines:
      - speaker: Dokter Wulan
        text: Pak Budi, Bapak sudah lebih sehat. Tapi tekanan darah Bapak masih agak tinggi.
        ar_eg: يا پاك بودي، انت بقيت أحسن. بس الضغط لسه عالي شوية.
        ar: يا باك بودي، صرت بصحّة أفضل، لكن ضغط دمك ما زال مرتفعًا قليلًا.
        en: Pak Budi, you're healthier now. But your blood pressure is still a bit high.
      - speaker: Pak Budi
        text: Kenapa, Bu Dokter? Saya sudah jalan kaki setiap pagi.
        ar_eg: ليه يا دكتورة؟ ده أنا بتمشّى كل يوم الصبح.
        ar: لماذا يا دكتورة؟ إنني أمشي كل صباح.
        en: Why, Doctor? I walk every morning now.
      - speaker: Dokter Wulan
        text: Olahraganya bagus. Tapi garam bisa menaikkan tekanan darah. Gula juga tidak menyehatkan.
        ar_eg: الرياضة كويسة. بس الملح ممكن يعلّي الضغط. والسكر كمان مش صحّي.
        ar: الرياضة جيّدة. لكن الملح قد يرفع ضغط الدم، والسكّر أيضًا غير صحّي.
        en: The exercise is good. But salt can raise blood pressure. And sugar isn't healthy either.
        note:
          ar_eg: -kan بتعمل فعل «بيخلّي حاجة تبقى كذا» - naik (يطلع) ← menaikkan (يعلّي)، sehat (صحّي) ← menyehatkan (يفيد الصحة). وsehat نفسها من العربي «صحّة».
          ar: -kan تصوغ فعلًا بمعنى «جعل الشيء كذا» - naik (يصعد) ← menaikkan (يرفع)، sehat ← menyehatkan (يفيد الصحّة). وsehat نفسها من العربية «صحّة».
          en: '-kan makes "cause to be": naik (go up) → menaikkan (raise), sehat (healthy) → menyehatkan (make healthy). sehat itself comes from Arabic صحّة.'
      - speaker: Dokter Wulan
        text: Jadi mulai sekarang, Bapak harus mengurangi garam dan gula.
        ar_eg: فمن النهارده، لازم تقلّل الملح والسكر.
        ar: لذلك عليك من الآن أن تقلّل الملح والسكّر.
        en: So from now on, you need to cut down on salt and sugar.
      - speaker: Pak Budi
        text: Tapi Bu Dokter, sambal pecel tanpa gula merah... itu bukan pecel!
        ar_eg: بس يا دكتورة، صوص الپيتشل من غير سكر النخل... ده مبقاش پيتشل!
        ar: لكن يا دكتورة، صلصة البيتشل بلا سكّر النخيل... ليست بيتشل!
        en: But Doctor, pecel sauce without palm sugar... that's not pecel!
      - speaker: Dokter Wulan
        text: Pecel merupakan makanan yang sehat, Pak, yaitu sayuran rebus dengan sambal kacang. Masalahnya bukan pecelnya, tetapi garam dan gulanya.
        ar_eg: الپيتشل أكلة صحّية يا پاك، يعني خضار مسلوق بصوص الفول السوداني. المشكلة مش في الپيتشل، المشكلة في الملح والسكر اللي فيه.
        ar: البيتشل طعام صحّي يا باك، أي خضار مسلوقة بصلصة الفول السوداني. المشكلة ليست في البيتشل، بل في الملح والسكّر.
        en: Pecel is a healthy dish, Pak — boiled vegetables with peanut sauce. The problem isn't the pecel, it's the salt and sugar.
        note:
          ar_eg: عشان تعرّف حاجة - X adalah… أو X merupakan… (أرسم شوية)، وyaitu = «يعني / وهو». وbukan X, tetapi Y = «مش X، لكن Y».
          ar: للتعريف - X adalah… أو X merupakan… (أكثر رسمية)، وyaitu تعني «أي / وهو». وbukan X, tetapi Y تعني «ليس X بل Y».
          en: 'To define: X adalah… or X merupakan… (more formal); yaitu = "namely, that is". bukan X, tetapi Y = "not X but Y".'
      - speaker: Bu Rahayu
        text: Saya catat, Bu Dokter. Garam sedikit, gula sedikit, sayur banyak.
        ar_eg: أنا بكتب يا دكتورة. ملح قليل، سكر قليل، خضار كتير.
        ar: أنا أدوّن يا دكتورة. ملح قليل، سكّر قليل، خضار كثيرة.
        en: I'm writing it down, Doctor. Little salt, little sugar, lots of vegetables.
      - speaker: Pak Budi
        text: Aduh... hidup saya tidak manis lagi.
        ar_eg: يا خبر... حياتي مبقتش حلوة خلاص.
        ar: آه... لم تعد حياتي حلوة.
        en: Oh dear... my life isn't sweet any more.
  - setting:
      ar_eg: الوارونج بعد يومين. على السبّورة الصغيّرة مكتوب «MENU SEHAT» بخط بايو. وعلى الموبايل، ساري ونادية بيفطروا فول في القاهرة.
      ar: الوارونغ بعد يومين. على السبّورة الصغيرة كُتب «MENU SEHAT» بخطّ بايو. وعلى الهاتف تتناول ساري ونادية فطور الفول في القاهرة.
      en: The warung two days later. On the little chalkboard, "MENU SEHAT" in Bayu's handwriting. On the phone, Sari and Nadia are having ful for breakfast in Cairo.
    lines:
      - speaker: Bayu
        text: Mas Joko, coba menu baru kami! Pecel sehat, sambalnya kurang garam dan kurang gula.
        ar_eg: يا ماس جوكو، جرّب المنيو الجديد! پيتشل صحّي، الصوص بتاعه ملح أقل وسكر أقل.
        ar: يا ماس جوكو، جرّب قائمتنا الجديدة! بيتشل صحّي، صلصته قليلة الملح والسكّر.
        en: Mas Joko, try our new menu! Healthy pecel, with less salt and less sugar in the sauce.
      - speaker: Mas Joko
        text: Hmm... rasanya... sehat.
        ar_eg: امم... طعمه... صحّي.
        ar: همم... طعمه... صحّي.
        en: Hmm... it tastes... healthy.
      - speaker: Bu Rahayu
        text: Tunggu, Mas. Saya tambahkan kencur dan daun jeruk. Nah, sekarang?
        ar_eg: استنّى يا ماس. هزوّد كينتشور وورق ليمون. ها، ودلوقتي؟
        ar: انتظر يا ماس. سأضيف الكنتشور وورق الليمون. والآن؟
        en: Wait, Mas. I'll add kencur and lime leaves. There — how about now?
      - speaker: Mas Joko
        text: Wah, enak! Tidak asin, tapi harum. Menu ini menyenangkan perut saya.
        ar_eg: واو، حلو! مش مالح، بس ريحته حلوة. المنيو ده بسط بطني.
        ar: رائع، لذيذ! ليس مالحًا لكنه عطِر. هذه القائمة تُسعد معدتي.
        en: Wow, tasty! Not salty, but fragrant. This menu makes my stomach happy.
      - speaker: Nadia
        text: Di Mesir juga ada makanan sehat untuk rakyat, yaitu ful medames. Ful adalah kacang fava yang dimasak pelan-pelan.
        ar_eg: في مصر كمان فيه أكلة صحّية للغلابة، وهي الفول المدمّس. الفول ده فول بيتسوى على نار هادية.
        ar: وفي مصر أيضًا طعام صحّي للشعب، وهو الفول المدمّس، أي فول يُطهى على نار هادئة.
        en: Egypt has a healthy food for ordinary people too — ful medames. Ful is fava beans cooked slowly.
        note:
          ar_eg: الفول والپيتشل شبه بعض - الاتنين رخاص وفيهم بروتين نباتي والناس بتاكلهم كل يوم. وكلمة gizi (التغذية) بالإندونيسي جاية من العربي «غذاء».
          ar: الفول والبيتشل متشابهان - كلاهما رخيص وفيه بروتين نباتي ويأكله الناس كل يوم. وكلمة gizi (التغذية) في الإندونيسية من العربية «غذاء».
          en: Ful and pecel are cousins — both cheap, full of plant protein, eaten every day. The Indonesian word gizi (nutrition) comes from Arabic غذاء.
      - speaker: Sari
        text: Tapi orang Mesir suka menambahkan banyak minyak dan garam, Pak. Sama seperti pecel Bapak!
        ar_eg: بس المصريين بيحبّوا يحطّوا زيت وملح كتير يا بابا. زي الپيتشل بتاعك بالظبط!
        ar: لكن المصريين يحبّون إضافة كثير من الزيت والملح يا أبي، تمامًا مثل بيتشلك!
        en: But Egyptians love adding lots of oil and salt, Dad. Just like your pecel!
      - speaker: Pak Budi
        text: Jadi masalahnya bukan pecel atau ful. Masalahnya tangan kita!
        ar_eg: يبقى المشكلة مش في الپيتشل ولا الفول. المشكلة في إيدينا!
        ar: إذن ليست المشكلة في البيتشل ولا في الفول، بل في أيدينا!
        en: So the problem isn't pecel or ful. The problem is our hands!
      - speaker: Bayu
        text: Betul! Menu sehat ini menyenangkan Bapak, kan?
        ar_eg: صحّ! المنيو الصحّي ده بيبسطك يا بابا، مش كده؟
        ar: صحيح! هذه القائمة الصحّية تُسعدك يا أبي، أليس كذلك؟
        en: Exactly! This healthy menu makes you happy, right, Dad?
      - speaker: Pak Budi
        text: Hmm... menyenangkan Dokter Wulan, Le.
        ar_eg: امم... بتبسط الدكتورة وولان يا ابني.
        ar: همم... تُسعد الدكتورة وولان يا بنيّ.
        en: Hmm... it makes Dokter Wulan happy, son.
        note:
          ar_eg: senang (مبسوط) ← menyenangkan (يبسط حدّ / ممتع). نفس الطريقة اللي اتعملت بيها menyehatkan.
          ar: senang (سعيد) ← menyenangkan (يُسعد / ممتع)، على نمط menyehatkan نفسه.
          en: senang (happy) → menyenangkan (to make someone happy; pleasant). Same pattern as menyehatkan.
new_words:
  - word: tekanan darah
    pos: noun
    ar_eg: الضغط (ضغط الدم)
    ar: ضغط الدم
    en: blood pressure
  - word: mengurangi
    pos: verb
    ar_eg: يقلّل
    ar: يقلّل / يخفّض
    en: to reduce, cut down on
  - word: menyehatkan
    pos: verb
    ar_eg: مفيد للصحة
    ar: يفيد الصحّة
    en: to make healthy, be good for you
  - word: merupakan
    pos: verb
    ar_eg: يبقى / يُعتبر (رسمي)
    ar: يُعدّ / هو (رسمي)
    en: to be, constitute (formal)
  - word: yaitu
    ar_eg: يعني / وهو
    ar: أي / وهو
    en: namely, that is
  - word: gizi
    pos: noun
    arabic: غذاء
    ar_eg: التغذية
    ar: التغذية
    en: nutrition
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الدكتورة وولان قالت إيه عن الملح؟
      ar: ماذا قالت الدكتورة وولان عن الملح؟
      en: What does Dokter Wulan say about salt?
    options: ["Garam menyehatkan badan.", "Garam merupakan makanan sehat.", "Garam tidak apa-apa.", "Garam bisa menaikkan tekanan darah."]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Pecel ___ makanan yang sehat, yaitu sayuran rebus dengan sambal kacang.
    meaning:
      ar_eg: الپيتشل أكلة صحّية، يعني خضار مسلوق بصوص الفول السوداني.
      ar: البيتشل طعام صحّي، أي خضار مسلوقة بصلصة الفول السوداني.
      en: Pecel is a healthy dish — boiled vegetables with peanut sauce.
    answers: [merupakan]
    options: ["yaitu", "merupakan", "mengurangi"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: بو راهايو زوّدت إيه عشان الپيتشل الصحّي يبقى طعمه حلو؟
      ar: ماذا أضافت بو راهايو ليصبح البيتشل الصحّي لذيذًا؟
      en: What does Bu Rahayu add to make the healthy pecel tasty?
    options: ["gula merah dan garam", "kencur dan daun jeruk", "minyak dan kacang fava"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Bapak harus mengurangi garam dan gula.
    answers_meaning:
      ar_eg: ["لازم تقلّل الملح والسكر يا بابا.", "حضرتك لازم تقلّل الملح والسكر.", "بابا لازم يقلّل الملح والسكر."]
      ar: ["يجب أن تقلّل الملح والسكّر يا أبي.", "عليك أن تقلّل الملح والسكّر.", "يجب على أبي أن يقلّل الملح والسكّر."]
      en: ["You have to cut down on salt and sugar.", "You need to reduce salt and sugar, Dad.", "Dad has to cut down on salt and sugar."]
  - id: q05
    type: listen
    text: Jadi masalahnya bukan pecel atau ful. Masalahnya tangan kita!
    question:
      ar_eg: پاك بودي وصل لإيه في الآخر؟
      ar: إلى أيّ نتيجة وصل باك بودي في النهاية؟
      en: What does Pak Budi conclude in the end?
    options: ["Ful lebih sehat daripada pecel.", "Kita harus berhenti makan pecel.", "Masalahnya cara kita memasak, bukan makanannya."]
    answer: 2
    meaning:
      ar_eg: يبقى المشكلة مش في الپيتشل ولا الفول. المشكلة في إيدينا!
      ar: إذن ليست المشكلة في البيتشل ولا في الفول، بل في أيدينا!
      en: So the problem isn't pecel or ful. The problem is our hands!
next:
  ar_eg: پاك بودي بدأ يكتب يوميات - كل حاجة كلها، وبيعمل إيه، ومشي قد إيه. وفي القاهرة، كريم بيحكي أول أسبوع ليه بعد الرجوع.
  ar: بدأ باك بودي يكتب يوميّات - ماذا أكل، وماذا فعل، وكم مشى. وفي القاهرة يروي كريم أسبوعه الأول بعد العودة.
  en: Pak Budi starts keeping a diary — what he ate, what he did, how far he walked. And in Cairo, Karim recounts his first week back.
