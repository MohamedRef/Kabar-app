title:
  target: Serambi Mekkah
  ar_eg: شرفة مكّة
  ar: شرفة مكّة
  en: The Veranda of Mecca
summary:
  ar_eg: ساري وكريم وبايو في بندا آتشيه. بيصلّوا الجمعة في مسجد بيت الرحمن، وبيزوروا متحف التسونامي مع بو نورول، المرشدة اللي نجت وهي صغيّرة. وبالليل پاك بودي بيقول نيّته الجديدة - العمرة... وبعدها، العيد في القاهرة.
  ar: ساري وكريم وبايو في باندا آتشيه. يصلّون الجمعة في مسجد بيت الرحمن، ويزورون متحف التسونامي مع بو نورول، المرشدة التي نجت في صغرها. وفي المساء يعلن باك بودي نيّته الجديدة - العمرة... ثم العيد في القاهرة.
  en: Sari, Karim and Bayu are in Banda Aceh. They pray Friday prayers at the Baiturrahman Mosque and visit the tsunami museum with Bu Nurul, a guide who survived as a child. That night Pak Budi announces his new intention - umrah... and after it, Lebaran in Cairo.
cast: [Karim, Bayu, Sari, Bu Nurul, Pak Budi, Bu Rahayu]
scenes:
  - setting:
      ar_eg: بندا آتشيه، يوم جمعة. الصبح في صحن مسجد بيت الرحمن الأبيض بقببه السودا، وبعد الضهر في متحف التسونامي.
      ar: باندا آتشيه، يوم الجمعة. صباحًا في صحن مسجد بيت الرحمن الأبيض ذي القباب السوداء، وبعد الظهر في متحف التسونامي.
      en: Banda Aceh, a Friday. Morning in the courtyard of the white Baiturrahman Mosque with its black domes; afternoon at the tsunami museum.
    lines:
      - speaker: Narrator
        text: Sari, Karim, dan Bayu berdiri di halaman Masjid Raya Baiturrahman. Payung-payung putih raksasa terbuka di atas kepala mereka.
        ar_eg: ساري وكريم وبايو واقفين في صحن مسجد بيت الرحمن الكبير. ومظلّات بيضا عملاقة مفتوحة فوق راسهم.
        ar: يقف ساري وكريم وبايو في صحن المسجد الجامع بيت الرحمن، ومظلّات بيضاء عملاقة مفتوحة فوق رؤوسهم.
        en: Sari, Karim and Bayu stand in the courtyard of the Baiturrahman Grand Mosque. Giant white umbrellas are open above their heads.
      - speaker: Karim
        text: Masyaallah. Payung-payung ini seperti di Masjid Nabawi di Madinah!
        ar_eg: ما شاء الله. المظلّات دي زي اللي في المسجد النبوي في المدينة!
        ar: ما شاء الله. هذه المظلّات كمظلّات المسجد النبوي في المدينة المنوّرة!
        en: Masha'Allah. These umbrellas are just like the ones at the Prophet's Mosque in Medina!
        note:
          ar_eg: Baiturrahman من العربي «بيت الرحمن». المبنى الحالي خلص سنة ١٨٨١، ونجا من تسونامي ٢٠٠٤ وبقى ملجأ للناس. والمظلّات اللي في الصحن اتعملت بعدين على شكل مظلّات المسجد النبوي.
          ar: Baiturrahman من العربية «بيت الرحمن». اكتمل المبنى الحالي عام ١٨٨١، ونجا من تسونامي ٢٠٠٤ فصار ملاذًا للناس. وأُضيفت المظلّات في صحنه لاحقًا على هيئة مظلّات المسجد النبوي.
          en: Baiturrahman is Arabic for "House of the Merciful". The present building was finished in 1881, survived the 2004 tsunami and sheltered survivors. The courtyard umbrellas were added later, modelled on those in Medina.
      - speaker: Bayu
        text: Aceh disebut Serambi Mekkah. Dulu, jemaah haji dari seluruh Nusantara berangkat dari sini, naik kapal ke Jeddah.
        ar_eg: آتشيه اسمها «شرفة مكّة». زمان، الحجّاج من كل جزر إندونيسيا كانوا بيسافروا من هنا، بالمركب لجدّة.
        ar: تُلقَّب آتشيه بـ«شرفة مكّة»؛ فقديمًا كان الحجّاج من أنحاء نوسانتارا كلّها ينطلقون من هنا بالسفن إلى جدّة.
        en: Aceh is called the Veranda of Mecca. In the old days, pilgrims from all over the archipelago set sail from here for Jeddah.
        note:
          ar_eg: آتشيه أول مكان الإسلام انتشر فيه في جزر إندونيسيا (مملكة سامودرا پاساي من القرن ١٣)، وكانت آخر محطة للحجّاج قبل المحيط الهندي. وجماعة الحجّاج اسمها jemaah - من «جماعة».
          ar: كانت آتشيه أوّل موطن رسخ فيه الإسلام في الأرخبيل (مملكة سامودرا باساي منذ القرن الثالث عشر)، وآخر محطّة للحجّاج قبل المحيط الهندي. وjemaah من العربية «جماعة».
          en: Aceh is where Islam first took root in the archipelago (the Samudera Pasai sultanate, 13th century) and was pilgrims' last stop before the Indian Ocean. jemaah comes from Arabic جماعة.
      - speaker: Sari
        text: Waktu tsunami tahun 2004, masjid ini tetap berdiri. Banyak orang berlindung di dalamnya.
        ar_eg: وقت التسونامي سنة ٢٠٠٤، المسجد ده فضل واقف. وناس كتير استخبّوا جوّاه.
        ar: حين وقع تسونامي ٢٠٠٤ بقي هذا المسجد قائمًا، ولجأ إليه كثير من الناس.
        en: During the 2004 tsunami, this mosque stayed standing. Many people sheltered inside it.
      - speaker: Narrator
        text: Siang itu, mereka mengunjungi Museum Tsunami Aceh. Seorang pemandu menyambut mereka dengan senyum yang tenang.
        ar_eg: بعد الضهر زاروا متحف تسونامي آتشيه. ومرشدة استقبلتهم بابتسامة هادية.
        ar: بعد الظهر زاروا متحف تسونامي آتشيه، فاستقبلتهم مرشدة بابتسامة هادئة.
        en: That afternoon they visit the Aceh Tsunami Museum. A guide welcomes them with a calm smile.
      - speaker: Bu Nurul
        text: Selamat datang. Saya Nurul. Sebelum masuk, saya mohon, berjalanlah pelan-pelan dan tidak usah berbicara di lorong pertama.
        ar_eg: أهلًا بيكم. أنا نورول. قبل ما ندخل، بالله عليكم، امشوا بالراحة ومتتكلّموش في أول ممرّ.
        ar: مرحبًا بكم. أنا نورول. قبل الدخول أرجو أن تمشوا ببطء وألّا تتكلّموا في الممرّ الأوّل.
        en: Welcome. I'm Nurul. Before we go in, I'd ask you to walk slowly and not to speak in the first corridor.
      - speaker: Narrator
        text: Lorong itu gelap dan sempit. Air mengalir di kedua dindingnya, dan suara gemuruh terdengar dari atas.
        ar_eg: الممرّ ضلمة وضيّق. المية بتنزل على الحيطتين، وصوت هدير جاي من فوق.
        ar: الممرّ مظلم وضيّق، والماء ينساب على جداريه، وهدير يُسمع من الأعلى.
        en: The corridor is dark and narrow. Water runs down both walls, and a rumbling sound comes from above.
      - speaker: Bu Nurul
        text: Pada tanggal 26 Desember 2004, terjadi gempa besar di laut. Tidak lama kemudian, gelombang tsunami datang. Di Aceh saja, lebih dari seratus ribu orang meninggal dunia.
        ar_eg: يوم ٢٦ ديسمبر ٢٠٠٤، حصل زلزال كبير في البحر. وبعدها بشوية جت موجة التسونامي. في آتشيه لوحدها، مات أكتر من مية ألف إنسان.
        ar: في السادس والعشرين من ديسمبر ٢٠٠٤ وقع زلزال عظيم في البحر، وبعد قليل جاءت أمواج التسونامي. وفي آتشيه وحدها توفّي أكثر من مئة ألف إنسان.
        en: On 26 December 2004, a huge earthquake struck under the sea. Soon after, the tsunami came. In Aceh alone, more than a hundred thousand people died.
      - speaker: Bayu
        text: Maaf, Bu, kalau boleh tahu... waktu itu Ibu di mana?
        ar_eg: لا مؤاخذة يا بو، لو ينفع أسأل... حضرتك كنتي فين ساعتها؟
        ar: عفوًا يا بو، إن سمحتِ بالسؤال... أين كنتِ حينها؟
        en: Forgive me, Bu, if I may ask... where were you at the time?
      - speaker: Bu Nurul
        text: Saya berumur dua belas tahun. Saya selamat, tapi saya kehilangan nenek dan dua sepupu. Ruangan berikutnya kami sebut Sumur Doa.
        ar_eg: كان عندي اتناشر سنة. أنا نجيت، بس فقدت ستّي واتنين من ولاد عمّي. الأوضة اللي جاية بنسمّيها بير الدعا.
        ar: كنت في الثانية عشرة. نجوت، لكنني فقدت جدّتي واثنين من أبناء عمومتي. والقاعة التالية نسمّيها بئر الدعاء.
        en: I was twelve. I survived, but I lost my grandmother and two cousins. The next room is what we call the Well of Prayer.
      - speaker: Narrator
        text: Di Sumur Doa, nama-nama para korban tertulis di dinding yang tinggi. Di puncaknya, tertulis lafaz "Allah".
        ar_eg: في بير الدعا، أسامي الضحايا مكتوبة على حيطة عالية. وفي أعلاها، مكتوب لفظ الجلالة «الله».
        ar: في بئر الدعاء كُتبت أسماء الضحايا على جدار شاهق، وفي أعلاه لفظ الجلالة «الله».
        en: In the Well of Prayer, the victims' names are written on a towering wall. At the very top is the word "Allah".
        note:
          ar_eg: Sumur Doa أوضة طويلة على شكل بير، على حيطانها آلاف الأسامي، ونورها جاي من فوق بس، عند اسم الجلالة. والزوّار بيقفوا فيها ساكتين يدعوا. المتحف صمّمه المعماري (وبعدين المحافظ) رضوان كامل.
          ar: Sumur Doa قاعة شاهقة كالبئر، على جدرانها آلاف الأسماء، ولا يدخلها الضوء إلّا من الأعلى عند لفظ الجلالة، ويقف فيها الزوّار صامتين داعين. صمّم المتحفَ المعماريُّ رضوان كامل الذي صار محافظًا لاحقًا.
          en: The Well of Prayer is a tall shaft-like room lined with thousands of names, lit only from above where the word Allah is written; visitors stand in silent prayer. The museum was designed by architect (and later governor) Ridwan Kamil.
      - speaker: Karim
        text: Innalillahi wa inna ilaihi raji'un. Allahummaghfir lahum.
        ar_eg: إنّا لله وإنّا إليه راجعون. اللهم اغفر لهم.
        ar: إنّا لله وإنّا إليه راجعون. اللهم اغفر لهم.
        en: To God we belong and to Him we return. O God, forgive them.
      - speaker: Bu Nurul
        text: Amin. Kami tidak lupa, tapi kami bangkit. Di Jembatan Harapan di depan sana, ada bendera puluhan negara yang dulu menolong Aceh.
        ar_eg: آمين. احنا مش ناسيين، بس قمنا تاني. وعلى كوبري الأمل اللي قدّام، فيه أعلام عشرات البلاد اللي ساعدت آتشيه.
        ar: آمين. لم ننسَ، لكننا نهضنا. وعلى جسر الأمل هناك أعلام عشرات الدول التي هبّت لنجدة آتشيه.
        en: Amen. We haven't forgotten, but we've risen again. On the Bridge of Hope up ahead are the flags of dozens of countries that helped Aceh.
  - setting:
      ar_eg: بالليل، لوبي الفندق في بندا آتشيه. التلاتة قاعدين حوالين موبايل ساري، وپاك بودي وبو راهايو على الفيديو من ماديون.
      ar: ليلًا، بهو الفندق في باندا آتشيه. يلتفّ الثلاثة حول هاتف ساري، وباك بودي وبو راهايو على الاتصال المرئي من ماديون.
      en: Night, a hotel lobby in Banda Aceh. The three huddle round Sari's phone, with Pak Budi and Bu Rahayu on video from Madiun.
    lines:
      - speaker: Pak Budi
        text: Anak-anak, Bapak mau menyampaikan sesuatu. Bapak sudah berniat umrah, insyaallah tahun depan, bersama Ibu.
        ar_eg: يا ولاد، عايز أقولكم حاجة. أنا نويت أعمل عمرة، إن شاء الله السنة الجاية، أنا وأمّكم.
        ar: يا أولادي، أريد أن أخبركم بأمر. لقد عقدتُ النيّة على العمرة، إن شاء الله في العام القادم، مع أمّكم.
        en: Children, I have something to tell you. I've made the intention to do umrah, God willing next year, with your mother.
      - speaker: Bu Rahayu
        text: Bapak sudah menabung sejak lama. Uangnya disimpan di kaleng biskuit di bawah tempat tidur.
        ar_eg: أبوكم بيحوّش من زمان. والفلوس محطوطة في علبة بسكويت تحت السرير.
        ar: يدّخر أبوكم منذ زمن، ويحفظ المال في علبة بسكويت تحت السرير.
        en: Your father's been saving for ages. The money's in a biscuit tin under the bed.
      - speaker: Bayu
        text: Kaleng biskuit, Pak? Sekarang ada tabungan umrah di bank syariah.
        ar_eg: علبة بسكويت يا بابا؟ دلوقتي فيه حساب توفير للعمرة في البنوك الإسلامية.
        ar: علبة بسكويت يا أبي؟ اليوم هناك حسابات ادّخار للعمرة في المصارف الإسلامية.
        en: A biscuit tin, Dad? These days there are umrah savings accounts at Islamic banks.
      - speaker: Pak Budi
        text: Haji juga sudah Bapak daftarkan, Le. Tapi antreannya puluhan tahun. Jadi, umrah dulu.
        ar_eg: والحجّ كمان أنا متسجّل له يا ابني. بس الطابور بتاعه عشرات السنين. فالعمرة الأول.
        ar: وقد سجّلت للحجّ أيضًا يا بنيّ، لكنّ قائمة الانتظار عشرات السنين؛ فلتكن العمرة أوّلًا.
        en: I've registered for hajj too, son. But the waiting list is decades long. So, umrah first.
        note:
          ar_eg: إندونيسيا أكبر بلد مسلم في العالم، وليها حصّة حجّ محدودة كل سنة. فطابور الحجّ العادي في محافظات كتير زي جاوة الشرقية بيوصل لعشرات السنين. عشان كده ناس كتير بتعمل عمرة الأول.
          ar: إندونيسيا أكبر بلد مسلم في العالم ولها حصّة حجّ سنوية محدودة، فتمتدّ قائمة انتظار الحجّ النظامي في محافظات كثيرة كجاوة الشرقية إلى عشرات السنين؛ لذا يؤدّي كثيرون العمرة أوّلًا.
          en: Indonesia, the world's largest Muslim country, has a limited yearly hajj quota, so the regular hajj queue in provinces like East Java runs to decades. Many people do umrah first.
      - speaker: Sari
        text: Bapak, hari ini kami ke Museum Tsunami. Ada seorang ibu yang kehilangan keluarganya, tapi wajahnya tenang sekali.
        ar_eg: بابا، النهارده رحنا متحف التسونامي. فيه ستّ فقدت ناس من عيلتها، بس وشّها هادي جدًا.
        ar: يا أبي، زرنا اليوم متحف التسونامي. هناك سيّدة فقدت بعض أهلها، لكنّ وجهها هادئ جدًّا.
        en: Dad, today we went to the Tsunami Museum. There was a woman who'd lost her family, but her face was so peaceful.
      - speaker: Pak Budi
        text: Itu namanya ikhlas, Nduk. Ikhlas bukan berarti tidak sedih. Ikhlas itu sedih, tapi tetap percaya kepada Allah.
        ar_eg: ده اسمه «إخلاص» بالمعنى الإندونيسي يا بنتي - الرضا. الرضا مش معناه إنك متزعليش. الرضا إنك تزعل، بس تفضل واثق في ربنا.
        ar: هذا ما نسمّيه «ikhlas» يا ابنتي، أي الرضا والتسليم. ليس معناه ألّا تحزن، بل أن تحزن وتبقى واثقًا بالله.
        en: That's called ikhlas, sweetheart. Ikhlas doesn't mean not being sad. Ikhlas is being sad, and still trusting in God.
        note:
          ar_eg: ikhlas جاية من العربي «إخلاص»، بس معناها في الإندونيسي اتغيّر شوية - بقت «الرضا وقبول اللي حصل من القلب»، وكمان «تعمل حاجة من غير ما تستنّى مقابل».
          ar: ikhlas من العربية «إخلاص»، لكنّ معناها في الإندونيسية انزاح قليلًا فصار «الرضا بما وقع والتسليم به عن طيب نفس»، وكذلك «العمل بلا انتظار مقابل».
          en: ikhlas is from Arabic إخلاص (sincerity), but in Indonesian it has shifted to "accepting what happened with a willing heart", and also "doing something without expecting anything back".
      - speaker: Karim
        text: Di Mesir, kami bilang, "Qaddarallahu wa ma sya'a fa'al." Allah sudah menakdirkan, dan apa yang Dia kehendaki, Dia lakukan.
        ar_eg: في مصر بنقول - «قدّر الله وما شاء فعل.»
        ar: في مصر نقول - «قدّر الله وما شاء فعل.»
        en: In Egypt we say, "God has decreed, and what He wills, He does."
      - speaker: Bu Rahayu
        text: Mas Karim, nanti ikut umrah bersama kami, ya? Sari juga.
        ar_eg: يا ماس كريم، ما تيجي تعمل العمرة معانا؟ وساري كمان.
        ar: يا ماس كريم، هلّا أدّيت العمرة معنا؟ وساري أيضًا.
        en: Mas Karim, you'll come on umrah with us, won't you? Sari too.
      - speaker: Karim
        text: Insyaallah, Bu. Dan setelah umrah... Kairo tidak jauh dari Mekkah.
        ar_eg: إن شاء الله يا بو. وبعد العمرة... القاهرة مش بعيدة عن مكّة.
        ar: إن شاء الله يا بو. وبعد العمرة... ليست القاهرة بعيدة عن مكّة.
        en: Insyaallah, Bu. And after umrah... Cairo isn't far from Mecca.
      - speaker: Pak Budi
        text: Nah! Bapak juga berpikir begitu. Umrah dulu, lalu Lebaran di Kairo. Janji Bapak belum lunas!
        ar_eg: أهو! أنا كمان بفكّر كده. العمرة الأول، وبعدين العيد في القاهرة. الوعد اللي عليّا لسه متسدّش!
        ar: أحسنت! هذا ما أفكّر فيه أيضًا - العمرة أوّلًا، ثم العيد في القاهرة. فوعدي لم يُوفَ بعد!
        en: Exactly! That's what I've been thinking. Umrah first, then Lebaran in Cairo. My promise isn't paid off yet!
      - speaker: Bayu
        text: Umrah dan Lebaran di Kairo? Pak, kaleng biskuitnya harus lebih besar.
        ar_eg: عمرة وعيد في القاهرة؟ يا بابا، علبة البسكويت لازم تبقى أكبر.
        ar: عمرة وعيد في القاهرة؟ يا أبي، يجب أن تكون علبة البسكويت أكبر.
        en: Umrah and Lebaran in Cairo? Dad, that biscuit tin will need to be bigger.
      - speaker: Pak Budi
        text: Rezeki sudah ada yang mengatur, Le. Tugas kita berusaha dan berdoa, lalu bertawakal.
        ar_eg: الرزق ليه اللي بيدبّره يا ابني. وإحنا علينا نسعى وندعي، وبعدين نتوكّل على الله.
        ar: للرزق مدبّر يا بنيّ؛ وعلينا أن نسعى وندعو ثم نتوكّل.
        en: Provision is in God's hands, son. Our job is to strive and pray, then trust in Him.
      - speaker: Bu Rahayu
        text: Dan berusaha itu termasuk tidak membeli kerupuk setiap hari, Pak.
        ar_eg: والسعي ده يشمل كمان إنك متشتريش كروبوك كل يوم يا بودي.
        ar: والسعي يشمل أيضًا ألّا تشتري الكروبوك كلّ يوم يا باك.
        en: And striving includes not buying krupuk every single day, Pak.
new_words:
  - word: jemaah
    arabic: جماعة
    pos: noun
    ar_eg: جماعة (المصلّين أو الحجّاج)
    ar: جماعة
    en: congregation, group of pilgrims
  - word: berlindung
    pos: verb
    ar_eg: يحتمي، يستخبّى
    ar: يحتمي، يلجأ
    en: to take shelter
  - word: korban
    pos: noun
    ar_eg: ضحيّة
    ar: ضحيّة
    en: victim
  - word: bangkit
    pos: verb
    ar_eg: يقوم تاني، ينهض
