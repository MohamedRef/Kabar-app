  - word: ikhlas
    arabic: إخلاص
    pos: adjective
    ar_eg: راضي من قلبه
    ar: راضٍ مُسلِّم
    en: accepting with a willing heart; sincere
  - word: antrean
    pos: noun
    ar_eg: طابور، قايمة انتظار
    ar: طابور، قائمة انتظار
    en: queue, waiting list
  - word: rezeki
    arabic: رزق
    pos: noun
    ar_eg: رزق
    ar: رزق
    en: (God-given) livelihood, provision
  - word: bertawakal
    arabic: توكّل
    pos: verb
    ar_eg: يتوكّل على الله
    ar: يتوكّل على الله
    en: to put one's trust in God
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: ليه آتشيه اسمها «شرفة مكّة» حسب بايو؟
      ar: لماذا تُلقَّب آتشيه بـ«شرفة مكّة» بحسب بايو؟
      en: According to Bayu, why is Aceh called the Veranda of Mecca?
    options: ["Karena dulu jemaah haji berangkat dari sini.", "Karena masjidnya mirip Ka'bah.", "Karena Aceh sangat dekat dengan Mekkah.", "Karena payungnya dari Madinah."]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Ikhlas itu sedih, tapi tetap ___ kepada Allah.
    meaning:
      ar_eg: الرضا إنك تزعل، بس تفضل واثق في ربنا.
      ar: الرضا أن تحزن وتبقى واثقًا بالله.
      en: Ikhlas is being sad, and still trusting in God.
    answers: [percaya]
    options: ["marah", "lupa", "percaya"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: (استنتاج) ليه پاك بودي هيعمل عمرة الأول قبل الحجّ؟
      ar: (استنتاج) لماذا سيؤدّي باك بودي العمرة قبل الحجّ؟
      en: (Inference) Why will Pak Budi do umrah before hajj?
    options: ["Karena umrah lebih murah dari kerupuk.", "Karena Karim tinggal di Mekkah.", "Karena antrean haji puluhan tahun.", "Karena Bu Rahayu tidak mau haji."]
    answer: 2
  - id: q04
    type: listen
    text: Kami tidak lupa, tapi kami bangkit.
    question:
      ar_eg: بو نورول بتقول إيه عن أهل آتشيه؟
      ar: ماذا تقول بو نورول عن أهل آتشيه؟
      en: What does Bu Nurul say about the people of Aceh?
    options: ["Mereka sudah lupa semuanya.", "Mereka tidak lupa, tapi bangkit lagi.", "Mereka pindah ke kota lain."]
    answer: 1
    meaning:
      ar_eg: احنا مش ناسيين، بس قمنا تاني.
      ar: لم ننسَ، لكننا نهضنا.
      en: We haven't forgotten, but we've risen again.
  - id: q05
    type: translate
    direction: from_target
    source_text: Rezeki sudah ada yang mengatur.
    answers_meaning:
      ar_eg: ["الرزق ليه اللي بيدبّره.", "ربنا هو اللي بيقسم الأرزاق.", "الرزق على الله."]
      ar: ["للرزق مدبّر.", "الله هو الذي يقسم الأرزاق.", "الرزق بيد الله."]
      en: ["Provision is in God's hands.", "Someone already arranges our livelihood - God.", "Our sustenance is already taken care of by God."]
next:
  ar_eg: فاضل شهرين على الفرح، والجروب «العيلة الكبيرة» قلب ساحة حرب. بو تيني ضافت تلتمية ضيف، والكوشة اتحجزت مرتين، وپاك محمود عايز جمل. وبايو بيكتب عن ده كله مقال ساخر للجامعة.
  ar: بقي شهران على العرس، وانقلبت مجموعة «العائلة الكبيرة» ساحة معركة. أضافت بو تيني ثلاثمئة ضيف، وحُجزت المنصّة مرّتين، ويريد باك محمود جملًا. ويكتب بايو عن ذلك كلّه مقالًا ساخرًا لصحيفة الجامعة.
  en: Two months to the wedding, and the "Big Family" WhatsApp group has become a battlefield. Bu Tini has added three hundred guests, the dais has been booked twice, and Pak Mahmoud wants a camel. Bayu turns it all into a satirical column for the campus paper.
