title:
  target: Pecel atau Koshari?
  ar_eg: پيتشل ولا كشري؟
  ar: بيتشل أم كشري؟
  en: Pecel or Koshari?
summary:
  ar_eg: ساري بتحاول تعمل پيتشل في مطبخ القاهرة، بس الطعم مش زي بتاع أبوها. نادية بتدافع عن الكشري، وپاك بودي بيكشف السر الناقص.
  ar: تحاول ساري طبخ البيتشل في مطبخ القاهرة، لكن الطعم ليس كطعم أبيها. تدافع نادية عن الكشري، ويكشف باك بودي السرّ الناقص.
  en: Sari tries to make pecel in a Cairo kitchen, but it doesn't taste like Dad's. Nadia champions koshari, and Pak Budi reveals the missing secret.
cast: [Sari, Nadia, Pak Budi, Mas Joko]
scenes:
  - setting:
      ar_eg: مطبخ شقة ساري في القاهرة. ريحة فول سوداني محمّص.
      ar: مطبخ شقة ساري في القاهرة. رائحة فول سوداني محمّص.
      en: The kitchen of Sari's flat in Cairo. It smells of roasted peanuts.
    lines:
      - speaker: Nadia
        text: Sari, kamu sedang memasak apa?
        ar_eg: يا ساري، بتطبخي إيه؟
        ar: يا ساري، ماذا تطبخين؟
        en: Sari, what are you cooking?
      - speaker: Sari
        text: Pecel! Makanan favorit saya dari Madiun.
        ar_eg: پيتشل! أكلتي المفضّلة من ماديون.
        ar: بيتشل! طعامي المفضّل من ماديون.
        en: Pecel! My favourite food from Madiun.
      - speaker: Nadia
        text: Pecel itu apa?
        ar_eg: يعني إيه پيتشل؟
        ar: ما البيتشل؟
        en: What's pecel?
      - speaker: Sari
        text: Nasi, sayur, dan sambal kacang. Pedas dan manis.
        ar_eg: رز، وخضار، وصوص فول سوداني. حرّاق وحلو.
        ar: أرز وخضار وصلصة الفول السوداني. حارّ وحلو.
        en: Rice, vegetables and peanut sauce. Spicy and sweet.
      - speaker: Nadia
        text: Saya mau coba! Hmm... enak, tapi pedas banget!
        ar_eg: عايزة أدوق! امممم... حلو، بس حرّاق أوي!
        ar: أريد أن أتذوّق! همم... لذيذ، لكنه حارّ جدًا!
        en: I want to try! Hmm... tasty, but super spicy!
        note:
          ar_eg: banget يعني «أوي»، بس عامية. في الكلام الرسمي بيقولوا sekali أو sangat.
          ar: banget تعني «جدًا» في العامية، وفي الكلام الرسمي يُقال sekali أو sangat.
          en: banget means "very" but is casual; formal speech uses sekali or sangat.
      - speaker: Sari
        text: Tapi ini kurang enak. Pecel Bapak enak sekali.
        ar_eg: بس ده مش حلو أوي. پيتشل بابا بيجنن.
        ar: لكنّ هذا ليس لذيذًا بما يكفي. بيتشل أبي لذيذ جدًا.
        en: But this isn't quite right. Dad's pecel is so delicious.
      - speaker: Nadia
        text: Kamu harus coba koshari! Makanan Mesir yang terkenal. Murah dan enak sekali!
        ar_eg: لازم تدوقي الكشري! أكلة مصرية مشهورة. رخيص وحلو جدًا!
        ar: يجب أن تجرّبي الكشري! طعام مصري مشهور، رخيص ولذيذ جدًا!
        en: You have to try koshari! A famous Egyptian dish. Cheap and really delicious!
  - setting:
      ar_eg: مكالمة فيديو مع الوارونج. ماس جوكو قاعد بيشرب قهوة.
      ar: اتصال مرئي مع الوارونغ. ماس جوكو جالس يشرب قهوة.
      en: A video call to the warung. Mas Joko is there, drinking coffee.
    lines:
      - speaker: Sari
        text: Pak, pecel saya kurang enak. Kenapa?
        ar_eg: يا بابا، الپيتشل بتاعي مش حلو كفاية. ليه؟
        ar: يا أبي، البيتشل الذي صنعته ليس لذيذًا كفاية. لماذا؟
        en: Dad, my pecel isn't quite right. Why?
      - speaker: Pak Budi
        text: Sambalnya perlu kencur, Nduk.
        ar_eg: الصوص محتاج «كينتشور» يا بنتي.
        ar: الصلصة تحتاج إلى «كنتشور» يا ابنتي.
        en: The sauce needs kencur, sweetheart.
        note:
          ar_eg: الكينتشور (kencur) جذر عطري من عيلة الجنزبيل، وهو سر طعم الپيتشل في ماديون.
          ar: الكنتشور (kencur) جذر عطري من فصيلة الزنجبيل، وهو سرّ نكهة بيتشل ماديون.
          en: Kencur (aromatic ginger) is a root from the ginger family — the secret of Madiun pecel.
      - speaker: Sari
        text: Di Kairo tidak ada kencur, Pak!
        ar_eg: مفيش كينتشور في القاهرة يا بابا!
        ar: لا يوجد كنتشور في القاهرة يا أبي!
        en: There's no kencur in Cairo, Dad!
      - speaker: Mas Joko
        text: Pak Budi bisa mengirim kencur ke Kairo!
        ar_eg: پاك بودي ممكن يبعت كينتشور للقاهرة!
        ar: يستطيع باك بودي أن يرسل الكنتشور إلى القاهرة!
        en: Pak Budi can send kencur to Cairo!
      - speaker: Pak Budi
        text: Bisa! Saya akan mengirim kencur dan sambal pecel.
        ar_eg: أكيد! هبعت كينتشور وصوص پيتشل.
        ar: بالتأكيد! سأرسل الكنتشور وصلصة البيتشل.
        en: Sure! I'll send kencur and pecel sauce.
      - speaker: Nadia
        text: Pak Budi, Bapak suka koshari?
        ar_eg: يا پاك بودي، حضرتك بتحب الكشري؟
        ar: يا باك بودي، هل تحب الكشري؟
        en: Pak Budi, do you like koshari?
      - speaker: Pak Budi
        text: Koshari itu apa?
        ar_eg: يعني إيه كشري؟
        ar: ما الكشري؟
        en: What's koshari?
      - speaker: Nadia
        text: Ada nasi, makaroni, dan bawang goreng. Enak banget!
        ar_eg: فيه رز ومكرونة وبصل مقلي. حلو أوي!
        ar: فيه أرز ومعكرونة وبصل مقلي. لذيذ جدًا!
        en: There's rice, pasta and fried onions. Super tasty!
        note:
          ar_eg: الكشري فيه كمان عدس وصلصة طماطم وشطة، بس نادية اختصرت.
          ar: في الكشري أيضًا عدس وصلصة طماطم وشطة، لكنّ نادية اختصرت.
          en: Koshari also has lentils, tomato sauce and chilli — Nadia kept it short.
      - speaker: Pak Budi
        text: Saya ingin coba!
        ar_eg: نفسي أدوقه!
        ar: أودّ أن أتذوّقه!
        en: I'd love to try it!
      - speaker: Nadia
        text: Kakak saya, Karim, mau ke Madiun! Dia bisa memasak koshari.
        ar_eg: أخويا كريم جاي ماديون! وهو بيعرف يطبخ كشري.
        ar: أخي كريم سيأتي إلى ماديون! وهو يجيد طبخ الكشري.
        en: My brother Karim is coming to Madiun! He can cook koshari.
