language: id
level: bipa1
unlock_after: bipa1.u07
title:
  target: Pecel atau Koshari?
  ar_eg: بيتشل ولا كشري؟
  ar: بيتشل أم كشري؟
  en: Pecel or Koshari?
summary:
  ar_eg: ساري بتحاول تعمل بيتشل في مطبخ القاهرة، بس الطعم مش زي بتاع أبوها. نادية بتدافع عن الكشري، وباك بودي بيكشف السر الناقص.
  ar: تحاول ساري طبخ البيتشل في مطبخ القاهرة، لكن الطعم ليس كطعم أبيها. تدافع نادية عن الكشري، ويكشف باك بودي السرّ الناقص.
  en: Sari tries to make pecel in a Cairo kitchen, but it doesn't taste like Dad's. Nadia champions koshari, and Pak Budi reveals the missing secret.
cast: [Sari, Nadia, Pak Budi, Mas Joko]
scenes:
  - setting:
      ar_eg: مطبخ شقة ساري في القاهرة. ريحة فول سوداني محمّص.
      ar: مطبخ شقة ساري في القاهرة. رائحة فول سوداني محمّص.
      en: The kitchen of Sari's flat in Cairo. It smells of roasted peanuts.
    lines:
      - speaker: Nadia
        text: Sari, kamu lagi masak apa?
        ar_eg: يا ساري، بتطبخي إيه؟
        ar: يا ساري، ماذا تطبخين؟
        en: Sari, what are you cooking?
        note:
          ar_eg: lagi masak = sedang memasak (بتطبخ دلوقتي). في الكلام الناس بتقول lagi وبتشيل البادئة me-.
          ar: lagi masak = sedang memasak (يطبخ الآن). في الكلام يقول الناس lagi ويحذفون البادئة me-.
          en: lagi masak = sedang memasak (cooking right now). In speech people say lagi and drop the me- prefix.
      - speaker: Sari
        text: Pecel! Makanan favoritku dari Madiun.
        ar_eg: بيتشل! أكلتي المفضّلة من ماديون.
        ar: بيتشل! طعامي المفضّل من ماديون.
        en: Pecel! My favourite food from Madiun.
      - speaker: Nadia
        text: Pecel itu apa?
        ar_eg: يعني إيه بيتشل؟
        ar: ما البيتشل؟
        en: What's pecel?
      - speaker: Sari
        text: Nasi, sayur, dan sambal kacang. Pedas dan manis.
        ar_eg: رز، وخضار، وصوص فول سوداني. حرّاق وحلو.
        ar: أرز وخضار وصلصة الفول السوداني. حارّ وحلو.
        en: Rice, vegetables and peanut sauce. Spicy and sweet.
        note:
          ar_eg: sambal kacang = صوص فول سوداني حرّاق (kacang = فول سوداني، sambal = صوص حرّاق).
          ar: sambal kacang = صلصة الفول السوداني الحارّة (kacang = فول سوداني، sambal = صلصة حارّة).
          en: sambal kacang = peanut chilli sauce (kacang = peanut, sambal = chilli sauce).
      - speaker: Nadia
        text: Aku mau coba! Hmm... enak, tapi pedas banget!
        ar_eg: عايزة أدوق! امممم... حلو، بس حرّاق أوي!
        ar: أريد أن أتذوّق! همم... لذيذ، لكنه حارّ جدًا!
        en: I want to try! Hmm... tasty, but super spicy!
        note:
          ar_eg: banget يعني «أوي»، بس عامية. في الكلام الرسمي بيقولوا sekali أو sangat.
          ar: banget تعني «جدًا» في العامية، وفي الكلام الرسمي يُقال sekali أو sangat.
          en: banget means "very" but is casual; formal speech uses sekali or sangat.
      - speaker: Sari
        text: Tapi ini kurang enak. Pecel Bapak enak banget.
        ar_eg: بس ده مش حلو أوي. بيتشل بابا بيجنن.
        ar: لكنّ هذا ليس لذيذًا بما يكفي. بيتشل أبي لذيذ جدًا.
        en: But this isn't quite right. Dad's pecel is so delicious.
      - speaker: Nadia
        text: Kamu harus coba koshari! Makanan Mesir yang terkenal. Murah, enak banget!
        ar_eg: لازم تدوقي الكشري! أكلة مصرية مشهورة. رخيص وحلو أوي!
        ar: يجب أن تجرّبي الكشري! طعام مصري مشهور، رخيص ولذيذ جدًا!
        en: You have to try koshari! A famous Egyptian dish. Cheap and really delicious!
        note:
          ar_eg: koshari = الكشري، بالإندونيسي بيتكتب كده.
          ar: koshari = الكشري، وهكذا يُكتب بالإندونيسية.
          en: koshari is Egyptian «كشري», spelled the Indonesian way.
  - setting:
      ar_eg: مكالمة فيديو مع الوارونج. ماس جوكو قاعد بيشرب قهوة.
      ar: اتصال مرئي مع الوارونغ. ماس جوكو جالس يشرب قهوة.
      en: A video call to the warung. Mas Joko is there, drinking coffee.
    lines:
      - speaker: Sari
        text: Pak, pecel Sari kurang enak. Kenapa, ya?
        ar_eg: يا بابا، البيتشل بتاعي مش حلو كفاية. ليه؟
        ar: يا أبي، البيتشل الذي صنعته ليس لذيذًا كفاية. لماذا؟
        en: Dad, my pecel isn't quite right. Why?
        note:
          ar_eg: kenapa = mengapa (ليه؟)، والناس بتقول kenapa أكتر بكتير. وya في الآخر بتليّن السؤال، زي «يا ترى».
          ar: kenapa = mengapa (لماذا؟)، والناس يقولون kenapa أكثر بكثير. وya في آخر السؤال تلطّفه، مثل «يا تُرى».
          en: kenapa = mengapa (why), and people say kenapa far more. ya at the end softens the question, like "I wonder".
      - speaker: Pak Budi
        text: Sambalnya perlu kencur, Nduk.
        ar_eg: الصوص محتاج «كينتشور» يا بنتي.
        ar: الصلصة تحتاج إلى «كنتشور» يا ابنتي.
        en: The sauce needs kencur, sweetheart.
        note:
          ar_eg: الكينتشور (kencur) جذر عطري من عيلة الجنزبيل، وهو سر طعم البيتشل في ماديون. وsambal = الصوص الحرّاق.
          ar: الكنتشور (kencur) جذر عطري من فصيلة الزنجبيل، وهو سرّ نكهة بيتشل ماديون. وsambal هي الصلصة الحارّة.
          en: Kencur (aromatic ginger) is a root from the ginger family — the secret of Madiun pecel. sambal is chilli sauce.
      - speaker: Sari
        text: Di Kairo nggak ada kencur, Pak!
        ar_eg: مفيش كينتشور في القاهرة يا بابا!
        ar: لا يوجد كنتشور في القاهرة يا أبي!
        en: There's no kencur in Cairo, Dad!
        note:
          ar_eg: nggak = tidak (مش / مفيش)، ودي اللي هتسمعها في الشارع. nggak ada kencur = tidak ada kencur.
          ar: nggak = tidak (لا / ليس)، وهي ما ستسمعه في الشارع. nggak ada kencur = tidak ada kencur.
          en: nggak = tidak (not, no), what you'll hear in the street. nggak ada kencur = tidak ada kencur.
      - speaker: Mas Joko
        text: Pak Budi bisa kirim dari Madiun!
        ar_eg: باك بودي ممكن يبعته من ماديون!
        ar: يستطيع باك بودي أن يرسله من ماديون!
        en: Pak Budi can send it from Madiun!
        note:
          ar_eg: kirim = mengirim (يبعت)، من غير البادئة زي ما الناس بتتكلم.
          ar: kirim = mengirim (يرسل)، بلا البادئة كما يتكلّم الناس.
          en: kirim = mengirim (to send), without the prefix, the way people talk.
      - speaker: Pak Budi
        text: Bisa! Nanti aku kirim kencur, Nduk.
        ar_eg: أكيد! هبعتلك كينتشور يا بنتي.
        ar: بالتأكيد! سأرسل لكِ الكنتشور يا ابنتي.
        en: Sure! I'll send you some kencur, sweetheart.
      - speaker: Nadia
        text: Pak Budi, Bapak suka koshari?
        ar_eg: يا باك بودي، حضرتك بتحب الكشري؟
        ar: يا باك بودي، هل تحب الكشري؟
        en: Pak Budi, do you like koshari?
      - speaker: Pak Budi
        text: Koshari itu apa?
        ar_eg: يعني إيه كشري؟
        ar: ما الكشري؟
        en: What's koshari?
      - speaker: Nadia
        text: Ada nasi, makaroni, sama bawang goreng. Enak banget!
        ar_eg: فيه رز ومكرونة وبصل مقلي. حلو أوي!
        ar: فيه أرز ومعكرونة وبصل مقلي. لذيذ جدًا!
        en: There's rice, pasta and fried onions. Super tasty!
        note:
          ar_eg: الكشري فيه كمان عدس وصلصة طماطم وشطة، بس نادية اختصرت. bawang goreng = بصل مقلي، وsama هنا = dan (و) في الكلام.
          ar: في الكشري أيضًا عدس وصلصة طماطم وشطة، لكنّ نادية اختصرت. bawang goreng = بصل مقلي، وsama هنا = dan (و) في الكلام اليومي.
          en: Koshari also has lentils, tomato sauce and chilli — Nadia kept it short. bawang goreng = fried onions; sama here = dan (and) in speech.
      - speaker: Pak Budi
        text: Wah, saya mau coba!
        ar_eg: نفسي أدوقه!
        ar: أودّ أن أتذوّقه!
        en: I'd love to try it!
      - speaker: Nadia
        text: Kakakku, Karim, mau ke Madiun! Dia bisa masak koshari.
        ar_eg: أخويا كريم جاي ماديون! وهو بيعرف يطبخ كشري.
        ar: أخي كريم سيأتي إلى ماديون! وهو يجيد طبخ الكشري.
        en: My brother Karim is coming to Madiun! He can cook koshari.
