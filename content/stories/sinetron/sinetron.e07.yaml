next:
  ar_eg: كريم جاي ماديون! بس إزاي باك بودي هيعرفه؟ نادية لازم توصفه كويس.
  ar: كريم قادم إلى ماديون! لكن كيف سيعرفه باك بودي؟ على نادية أن تصفه جيدًا.
  en: Karim is coming to Madiun! But how will Pak Budi recognise him? Nadia had better describe him well.
