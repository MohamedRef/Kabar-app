title:
  target: Tarik Napas, Pak!
  ar_eg: خُد نفَس يا بابا!
  ar: خذ نفَسًا يا أبي!
  en: Breathe In, Dad!
summary:
  ar_eg: الدكتور قال لپاك بودي يمشي ويتحرّك كل يوم، وكريم وبايو بيدرّبوه بعد الفجر. وبالليل بايو بيكشف لساري خطّته الحقيقية لفلوس التعجيل.
  ar: أمر الطبيب باك بودي بالمشي والحركة كل يوم، فيدرّبه كريم وبايو بعد الفجر. وفي الليل يكشف بايو لساري خطّته الحقيقية لمال التعجيل.
  en: The doctor wants Pak Budi moving every day, so Karim and Bayu coach him after dawn prayers. That night, Bayu reveals to Sari his real plan for the takjil money.
cast: [Karim, Pak Budi, Bayu, Bu Rahayu, Sari, Nadia]
scenes:
  - setting:
      ar_eg: قدّام البيت في ماديون، الساعة ٥ الصبح بعد صلاة الفجر. الجو لسه طري.
      ar: أمام البيت في ماديون، الساعة الخامسة صباحًا بعد صلاة الفجر. الجوّ ما زال لطيفًا.
      en: Outside the house in Madiun, 5 a.m., after the dawn prayer. The air is still cool.
    lines:
      - speaker: Narrator
        text: Madiun. Jam lima pagi. Sesudah salat subuh.
        ar_eg: ماديون. الساعة ٥ الصبح. بعد صلاة الفجر.
        ar: ماديون. الساعة الخامسة صباحًا. بعد صلاة الفجر.
        en: Madiun. Five in the morning. After the dawn prayer.
      - speaker: Karim
        text: Pak Budi, ayo! Resep dokter, Pak. Jalan kaki tiga puluh menit setiap hari.
        ar_eg: يلا يا پاك بودي! دي روشتة الدكتور. مشي نص ساعة كل يوم.
        ar: هيّا يا باك بودي! هذه وصفة الطبيب، مشي ثلاثين دقيقة كل يوم.
        en: Come on, Pak Budi! Doctor's orders. A thirty-minute walk every day.
      - speaker: Bayu
        text: Pak, sudah berapa lama Bapak tidak berolahraga?
        ar_eg: بابا، بقالك قد إيه مش بتعمل رياضة؟
        ar: أبي، منذ متى لم تمارس الرياضة؟
        en: Dad, how long has it been since you exercised?
        note:
          ar_eg: «Sudah berapa lama…?» = «بقالك قد إيه…؟». الرد بـ sejak (من ساعة / من سنة كذا) أو selama (لمدة).
          ar: «Sudah berapa lama…?» تعني «منذ متى…؟»، ويكون الجواب بـ sejak (منذ) أو selama (طوال / لمدّة).
          en: '"Sudah berapa lama…?" = "How long has it been…?". Answer with sejak (since) or selama (for, during).'
      - speaker: Pak Budi
        text: Hmm... sejak warung buka. Dua puluh tahun!
        ar_eg: امم... من ساعة ما الوارونج فتح. عشرين سنة!
        ar: امم... منذ افتتاح الوارونغ. عشرون سنة!
        en: Hmm... since the warung opened. Twenty years!
      - speaker: Pak Budi
        text: Tapi tiga puluh tahun lalu saya bermain bulu tangkis setiap minggu!
        ar_eg: بس من تلاتين سنة كنت بلعب ريشة كل أسبوع!
        ar: لكن قبل ثلاثين سنة كنت ألعب الريشة كل أسبوع!
        en: But thirty years ago I played badminton every week!
        note:
          ar_eg: البادمنتون (bulu tangkis، حرفيًّا «ريشة وصدّ») فخر إندونيسيا في الأوليمبياد، وكل حارة تقريبًا فيها ملعب صغير.
          ar: الريشة الطائرة (bulu tangkis، حرفيًّا «ريش وصدّ») مفخرة إندونيسيا في الأولمبياد، وفي كل حيّ تقريبًا ملعب صغير لها.
          en: Badminton (bulu tangkis, literally "feather parry") is Indonesia's Olympic pride; almost every neighbourhood has a court.
      - speaker: Karim
        text: Sekarang pelan-pelan saja, Pak. Berdiri. Angkat tangan.
        ar_eg: دلوقتي بالراحة بس يا پاك. اقف. ارفع إيديك.
        ar: الآن على مهل فقط يا باك. قف. ارفع يديك.
        en: Slowly for now, Pak. Stand up. Raise your arms.
      - speaker: Karim
        text: Tarik napas... buang napas.
        ar_eg: خُد نفَس... طلّع نفَس.
        ar: خذ نفَسًا... أخرج النفَس.
        en: Breathe in... breathe out.
      - speaker: Bayu
        text: Sekarang putar bahu, Pak. Sepuluh kali!
        ar_eg: دلوقتي لفّ كتافك يا بابا. عشر مرات!
        ar: الآن أدِر كتفيك يا أبي. عشر مرّات!
        en: Now roll your shoulders, Dad. Ten times!
      - speaker: Pak Budi
        text: Aduh, lutut saya!
        ar_eg: آه يا ركبتي!
        ar: آه، ركبتي!
        en: Ow, my knee!
      - speaker: Bu Rahayu
        text: Bapak berolahraga! Bapak, Bayu, dan Mas Karim bertiga di jalan. Ini pertama kali!
        ar_eg: بابا بيعمل رياضة! التلاتة في الشارع. دي أول مرة!
        ar: أبوكم يمارس الرياضة! ثلاثتهم في الشارع. هذه أول مرة!
        en: Dad's exercising! The three of them out in the street. A first!
        note:
          ar_eg: ber- ليها معاني كتير - berolahraga (يعمل رياضة)، bertiga (هما التلاتة سوا)، bersedih (يزعل).
          ar: لـ ber- معانٍ كثيرة - berolahraga (يمارس الرياضة)، bertiga (هم الثلاثة معًا)، bersedih (يحزن).
          en: 'ber- has many meanings: berolahraga (do sport), bertiga (the three of them together), bersedih (be sad).'
  - setting:
      ar_eg: القاهرة الساعة ١٢ بالليل. ساري ونادية بياكلوا كنافة بعد التراويح، وموبايل ساري بيرنّ.
      ar: القاهرة في منتصف الليل. ساري ونادية تأكلان الكنافة بعد التراويح، ويرنّ هاتف ساري.
      en: Cairo at midnight. Sari and Nadia are eating konafa after tarawih, and Sari's phone rings.
    lines:
      - speaker: Bayu
        text: Mbak Sari! Sst... Bapak dan Ibu tidak tahu.
        ar_eg: أبلة ساري! هِشّ... بابا وماما ميعرفوش.
        ar: يا أختي ساري! صه... أبي وأمي لا يعلمان.
        en: Sis! Shh... Mum and Dad don't know.
      - speaker: Sari
        text: Bayu? Ada apa? Kamu bersedih?
        ar_eg: بايو؟ فيه إيه؟ انت زعلان؟
        ar: بايو؟ ماذا هناك؟ هل أنت حزين؟
        en: Bayu? What's up? Are you sad?
      - speaker: Bayu
        text: Tidak! Saya berjualan takjil selama dua minggu. Uangnya untuk tiket Mbak!
        ar_eg: لأ! أنا بعت تعجيل لمدة أسبوعين. الفلوس عشان تذكرتك!
        ar: لا! بعت التعجيل طوال أسبوعين. المال لتذكرتكِ!
        en: No! I've sold takjil for two weeks. The money's for your ticket!
      - speaker: Sari
        text: Tiket saya? Bayu, uang itu untuk tiket ke Kairo!
        ar_eg: تذكرتي أنا؟ يا بايو، الفلوس دي كانت عشان تذاكر القاهرة!
        ar: تذكرتي؟ يا بايو، هذا المال كان لتذاكر القاهرة!
        en: My ticket? Bayu, that money was for tickets to Cairo!
      - speaker: Bayu
        text: Bapak belum boleh naik pesawat. Jadi Mbak yang mudik. Untuk Lebaran!
        ar_eg: بابا لسه مينفعش يركب طيارة. يبقى انتي اللي ترجعي البلد. عشان العيد!
        ar: أبي لا يُسمح له بركوب الطائرة بعد. إذن أنتِ من تعودين إلى البلد. من أجل العيد!
        en: Dad can't fly yet. So you're the one who comes home for the holiday. For Lebaran!
        note:
          ar_eg: Lebaran هو عيد الفطر في إندونيسيا. ملايين الناس بيرجعوا بلادهم قبله - ودي اسمها mudik.
          ar: Lebaran هو عيد الفطر في إندونيسيا، ويعود قبله ملايين الناس إلى بلداتهم، وتسمّى هذه العودة mudik.
          en: Lebaran is Eid al-Fitr in Indonesia. Millions travel back to their home towns before it — that's mudik.
      - speaker: Nadia
        text: Sari, kamu juga punya uang dari pekerjaanmu!
        ar_eg: يا ساري، وانتي كمان معاكي فلوس من شغلك!
        ar: يا ساري، ولديكِ أيضًا مال من عملكِ!
        en: Sari, you've got money from your job too!
      - speaker: Sari
        text: Ya... Uang saya dan uang Bayu... cukup!
        ar_eg: آه... فلوسي وفلوس بايو... كفاية!
        ar: نعم... مالي ومال بايو... يكفيان!
        en: Yes... My money plus Bayu's... it's enough!
      - speaker: Bayu
        text: Tapi ini rahasia, Mbak! Jangan cerita ke Bapak dan Ibu!
        ar_eg: بس ده سرّ يا أبلة! متقوليش لبابا وماما!
        ar: لكن هذا سرّ يا أختي! لا تخبري أبي وأمي!
        en: But it's a secret, Sis! Don't tell Mum and Dad!
      - speaker: Narrator
        text: Malam itu, Sari tidak bersedih lagi.
        ar_eg: الليلة دي، ساري مبقتش زعلانة.
        ar: في تلك الليلة لم تعد ساري حزينة.
        en: That night, Sari isn't sad any more.
new_words:
  - word: berolahraga
    pos: verb
    ar_eg: يعمل رياضة
    ar: يمارس الرياضة
    en: to exercise
  - word: menit
    pos: noun
    ar_eg: دقيقة
    ar: دقيقة
    en: minute
  - word: Lebaran
    pos: noun
    ar_eg: عيد الفطر (في إندونيسيا)
    ar: عيد الفطر (في إندونيسيا)
    en: Eid al-Fitr (in Indonesia)
  - word: mudik
    pos: verb
    ar_eg: يرجع بلده قبل العيد
    ar: يعود إلى بلدته قبل العيد
    en: to go home for the holiday
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الدكتور قال لپاك بودي يمشي قد إيه؟
      ar: كم يجب أن يمشي باك بودي بحسب الطبيب؟
      en: How long should Pak Budi walk, according to the doctor?
    options: ["dua puluh menit setiap minggu", "satu jam setiap pagi", "tiga puluh menit setiap hari"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Tarik napas, lalu ___ napas.
    meaning:
      ar_eg: خد نفَس، وبعدين طلّع نفَس.
      ar: خذ نفَسًا، ثم أخرج النفَس.
      en: Breathe in, then breathe out.
    answers: [buang]
    options: ["angkat", "buang", "putar"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: بايو باع تعجيل قد إيه؟
      ar: كم من الوقت باع بايو التعجيل؟
      en: How long has Bayu been selling takjil?
    options: ["selama dua minggu", "sejak hari Minggu", "selama dua hari"]
    answer: 0
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: بايو عايز يعمل إيه بفلوس التعجيل دلوقتي؟
      ar: ماذا يريد بايو أن يفعل بمال التعجيل الآن؟
      en: What does Bayu now want to do with the takjil money?
    options: ["membeli tiket Bapak ke Kairo", "membeli raket bulu tangkis", "membantu Sari pulang untuk Lebaran"]
    answer: 2
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بقالك قد إيه بتتعلّم إندونيسي؟
      ar: منذ متى تتعلّم الإندونيسية؟
      en: How long have you been learning Indonesian?
    answers: ["Sudah berapa lama kamu belajar bahasa Indonesia?", "Sudah berapa lama Anda belajar bahasa Indonesia?", "Berapa lama kamu sudah belajar bahasa Indonesia?", "Berapa lama Anda sudah belajar bahasa Indonesia?", "Sudah berapa lama belajar bahasa Indonesia?", "Sejak kapan kamu belajar bahasa Indonesia?", "Sejak kapan Anda belajar bahasa Indonesia?"]
next:
  ar_eg: ساري حاجزة تذكرة! القاهرة ← جاكرتا ← سورابايا ← ماديون. رحلة طويلة... وسرّ لازم يفضل سرّ لحد آخر لحظة.
  ar: حجزت ساري تذكرة! القاهرة ← جاكرتا ← سورابايا ← ماديون. رحلة طويلة... وسرّ يجب أن يبقى سرًّا حتى آخر لحظة.
  en: Sari has a ticket! Cairo → Jakarta → Surabaya → Madiun. A long trip... and a secret that has to stay secret till the very last moment.
