id: sinetron.e74
series: sinetron
episode: 74
language: jv
level: j1
unlock_after: j1.u04
title:
  target: Sik, tak lapor pusat
  ar_eg: ثانية، هبلّغ الإدارة
  ar: لحظة، سأبلّغ الإدارة
  en: Hold on, I'll report to HQ
summary:
  ar_eg: في شارع جاكال جنب الجامعة، كريم بيشتري تمر من پاك حسن، بيّاع برفان وتمر جدّه جه من حضرموت من زمان. بيتعلّم يقول «tak tuku» (هشتري)، و«wis dibungkus» (اتلفّ). وبعدين مكالمة من مكتبه في القاهرة بتخلّيه يقول أشهر جملة في الحلقة.
  ar: في شارع جاكال قرب الجامعة، يشتري كريم تمرًا من باك حسن، بائع العطور والتمر الذي جاء جدّه من حضرموت منذ زمن. يتعلّم أن يقول «tak tuku» (سأشتري) و«wis dibungkus» (تمّ لفّه). ثمّ يجعله اتّصال من مكتبه في القاهرة يقول أشهر جملة في الحلقة.
  en: On Jakal, by the campus, Karim buys dates from Pak Hasan, a perfume-and-dates seller whose grandfather came from Hadramaut long ago. He learns to say "tak tuku" (I'll buy) and "wis dibungkus" (it's been wrapped). Then a call from his office in Cairo makes him say the episode's most famous line.
cast: [Karim, Mas Heru, Pak Hasan]
scenes:
  - setting:
      ar_eg: شارع جاكال (Jalan Kaliurang) جنب جامعة UGM، الضهر. محلّ صغيّر فيه تمر وبرفان زيتي وسبح وطواقي. البيّاع پاك حسن، راجل كبير لابس طاقية.
      ar: شارع جاكال (Jalan Kaliurang) قرب جامعة UGM، ظهرًا. محلّ صغير فيه تمر وعطور زيتية وسبح وطواقٍ. البائع باك حسن، رجل مسنّ يعتمر طاقية.
      en: Jakal (Jalan Kaliurang) near UGM university, at midday. A little shop of dates, perfume oil, prayer beads and caps. The seller, Pak Hasan, is an older man in a skullcap.
    lines:
      - speaker: Pak Hasan
        text: Ahlan, Mas! Saka Mesir ta? Logatmu kok Mesir banget.
        ar_eg: أهلًا يا أستاذ! انت من مصر، صح؟ لهجتك مصري أوي.
        ar: أهلًا يا أستاذ! أنت من مصر، أليس كذلك؟ لهجتك مصرية جدًّا.
        en: Ahlan, Mas! You're from Egypt, aren't you? Your accent is so Egyptian.
        note:
          ar_eg: ta في آخر الجملة بتطلب تأكيد، زي «صح؟» أو «مش كده؟». وkok هنا بتبيّن الاستغراب.
          ar: ta في آخر الجملة تطلب التأكيد، مثل «أليس كذلك؟». وkok هنا تدلّ على الاستغراب.
          en: ta at the end asks for confirmation, like "right?". kok here shows surprise.
      - speaker: Karim
        text: Iya, Pak! Sampeyan bisa basa Arab?
        ar_eg: أيوه يا حاج! حضرتك بتعرف عربي؟
        ar: نعم يا حاجّ! هل تتكلّم العربية؟
        en: Yes, sir! Can you speak Arabic?
      - speaker: Pak Hasan
        text: "Sithik wae. Mbahku saka Hadramaut."
        ar_eg: "شويّة بس. جدّي من حضرموت."
        ar: "قليلًا فقط. جدّي من حضرموت."
        en: "Just a little. My grandfather was from Hadramaut."
        note:
          ar_eg: "في جاوة عائلات عربية-جاوية من قرون، كتير منهم أصلهم من حضرموت في اليمن، وفيه منهم في جوجا كمان. وwae (= saja) يعني «بس». كلمات: sithik = شوية."
          ar: "في جاوة عائلات عربية جاوية منذ قرون، أصل كثير منها من حضرموت في اليمن، ومنها عائلات في جوغجا. وwae (= saja) تعني «فقط». مفردات: sithik = قليل."
          en: "Java has had Arab-Javanese families for centuries, many of them from Hadramaut in Yemen, Jogja included. wae (= saja) means \"just\". Words: sithik = a little (sedikit)."
      - speaker: Karim
        text: Kurma iki enak ta, Pak?
        ar_eg: التمر ده حلو، صح يا حاج؟
        ar: هذا التمر لذيذ، أليس كذلك يا حاجّ؟
        en: These dates are good, aren't they, sir?
        note:
          ar_eg: "كلمات: iki = ده / دي (= ini)؛ kurma = بلح، تمر."
          ar: "مفردات: iki = هذا / هذه (= ini)؛ kurma = تمر."
          en: "Words: iki = this (= ini); kurma = dates (the fruit)."
      - speaker: Pak Hasan
        text: Enak lho! Cobaen sik.
        ar_eg: حلو والله! دوق الأول.
        ar: لذيذ فعلًا! تذوّق أوّلًا.
        en: They're really good! Try one first.
        note:
          ar_eg: lho بتأكّد وتلفت النظر، زي «والله!» أو «على فكرة!».
          ar: lho تؤكّد وتلفت الانتباه، مثل «فعلًا!» أو «بالمناسبة!».
          en: lho adds emphasis and draws attention, like "honestly!" or "you know!".
      - speaker: Karim
        text: Mmm! Oke, tak tuku sakilo.
        ar_eg: ممم! تمام، هشتري كيلو.
        ar: ممم! حسنًا، سأشتري كيلو.
        en: Mmm! Okay, I'll buy a kilo.
        note:
          ar_eg: "tak- قبل الفعل يعني «أنا هعمل»، بتقولها لما تعرض أو تقرّر. tak tuku = «هشتري أنا». كلمات: oke = أوكي، ماشي."
          ar: "tak- قبل الفعل تعني «سأفعل أنا»، تقال عند العرض أو القرار. tak tuku = «سأشتري». مفردات: oke = حسنًا."
          en: "tak- before a verb means \"I'll do it\", for offers and decisions. tak tuku = \"I'll buy\". Words: oke = OK."
      - speaker: Pak Hasan
        text: "Siap. Wis dibungkus, Mas."
        ar_eg: "حاضر. اتلفّ خلاص يا أستاذ."
        ar: "حاضر. تمّ لفّه يا أستاذ."
        en: "Done. It's wrapped, Mas."
        note:
          ar_eg: "di- قبل الفعل يعمل مبني للمجهول، زي الإندونيسي. dibungkus = «اتلفّ». وdituku = «اتشرى». كلمات: siap = تمام! حاضر!"
          ar: "di- قبل الفعل يجعله مبنيًّا للمجهول، كما في الإندونيسية. dibungkus = «لُفّ». وdituku = «اشتُري». مفردات: siap = حاضر!"
          en: "di- before a verb makes it passive, as in Indonesian. dibungkus = \"wrapped\". dituku = \"bought\". Words: siap = got it!, will do!"
  - setting:
      ar_eg: قدّام الجامع. هيرو مستنّي، وتليفون كريم بيرنّ - مديره في مكتب الترجمة في القاهرة.
      ar: أمام المسجد. هيرو ينتظر، ويرنّ هاتف كريم - مديره في مكتب الترجمة في القاهرة.
      en: Outside the mosque. Heru is waiting, and Karim's phone rings - his boss at the translation office in Cairo.
    lines:
      - speaker: Mas Heru
        text: "Sapa kuwi, Rim?"
        ar_eg: "مين ده يا كريم؟"
        ar: "من المتّصل يا كريم؟"
        en: "Who's that, Rim?"
        note:
          ar_eg: "كلمات: kuwi = ده، دي، دول (البعيد)."
          ar: "مفردات: kuwi = ذلك، تلك."
          en: "Words: kuwi = that, those."
      - speaker: Karim
        text: Bosku saka Kairo. Takon bukune wis dadi apa durung.
        ar_eg: مديري من القاهرة. بيسأل الكتاب خلص ولّا لسه.
        ar: مديري من القاهرة. يسأل إن كان الكتاب قد اكتمل أم لا.
        en: My boss in Cairo. Asking if the book's done yet or not.
        note:
          ar_eg: "كلمات: dadi = يبقى / يطلع."
          ar: "مفردات: dadi = يصير / يساوي."
          en: "Words: dadi = to become, come to (jadi)."
      - speaker: Mas Heru
        text: Lho, wis dadi ta?
        ar_eg: يا راجل، خلص خلاص؟
        ar: هل اكتمل فعلًا؟
        en: Oh, is it done then?
      - speaker: Karim
        text: Durung, ya! Sik, sik... tak lapor pusat.
        ar_eg: لسه طبعًا! ثانية، ثانية... هبلّغ الإدارة.
        ar: ليس بعد طبعًا! لحظة، لحظة... سأبلّغ الإدارة.
        en: Not yet, obviously! Hang on, hang on... I'll report to HQ.
        note:
          ar_eg: «Sik, tak lapor pusat» جملة مشهورة على السوشيال ميديا، بيقولوها بهزار لما حد يأجّل حاجة. وya في آخر الكلام بتليّن الجملة.
          ar: «Sik, tak lapor pusat» عبارة مشهورة على وسائل التواصل، تقال مزاحًا عند تأجيل أمر ما. وya في آخر الجملة تليّنها.
          en: '"Sik, tak lapor pusat" is a famous social-media line, said jokingly when putting something off. ya at the end softens a sentence.'
      - speaker: Mas Heru
        text: "Wkwkwk! Kowe kok wis bisa!"
        ar_eg: "ههههه! انت إزاي بقيت تعرف!"
        ar: "ههههه! كيف صرت تستطيع!"
        en: "Hahaha! How come you can already!"
      - speaker: Narrator
        text: Kaca papat. Tak tuku, dibungkus, ta, wae, lho, ya.
        ar_eg: صفحة أربعة. هشتري، اتلفّ، صح؟، بس، والله، ماشي.
        ar: الصفحة الرابعة. سأشتري، لُفّ، أليس كذلك، فقط، فعلًا، حسنًا.
        en: Page four. I'll buy, wrapped, right?, just, honestly, okay.
        note:
          ar_eg: "كلمات: kaca = صفحة؛ papat = أربعة (empat)؛ قبل ewu: patang."
          ar: "مفردات: kaca = صفحة؛ papat = أربعة (empat)؛ قبل ewu: patang."
          en: "Words: kaca = page (of a book); papat = four (empat); before ewu: patang."
new_words:
  - word: tak tuku
    pos: verb phrase
    ar_eg: هشتري (أنا)
    ar: سأشتري
    en: I'll buy
  - word: dibungkus
    pos: verb
    ar_eg: اتلفّ / اتغلّف
    ar: لُفّ / غُلّف
    en: wrapped
  - word: ta
    pos: particle
    ar_eg: صح؟ / مش كده؟
    ar: أليس كذلك؟
    en: right? isn't it?
  - word: wae
    pos: particle
    ar_eg: بس
    ar: فقط
    en: just (= saja)
  - word: lho
    pos: particle
    ar_eg: والله / على فكرة
    ar: فعلًا / بالمناسبة
    en: really, you know (emphasis)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: جدّ البيّاع جه منين؟
      ar: من أين جاء جدّ البائع؟
      en: Where did the seller's grandfather come from?
    options: ["Mesir", "Hadramaut", "Jogja"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Oke, ___ tuku sakilo.
    meaning:
      ar_eg: تمام، هشتري كيلو.
      ar: حسنًا، سأشتري كيلو.
      en: Okay, I'll buy a kilo.
    answers: [tak]
    options: ["tak", "di", "ta"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: «Wis dibungkus» معناها إيه؟
      ar: ما معنى «Wis dibungkus»؟
      en: What does "Wis dibungkus" mean?
    options: ["It's been wrapped.", "I'll wrap it.", "Not wrapped yet."]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Sik, tak lapor pusat.
    answers_meaning:
      ar_eg: ["ثانية، هبلّغ الإدارة.", "استنّى، هقول للإدارة."]
      ar: ["لحظة، سأبلّغ الإدارة.", "انتظر، سأخبر الإدارة."]
      en: ["Hold on, I'll report to HQ.", "Wait, I'll tell head office."]
next:
  ar_eg: هيرو بياخد كريم على شطّ پارانجتريتيس، رملة سودا وموج عالي. وهناك صحاب هيرو بيتكلّموا بسرعة وبكلمات زي «je» و«og»... كريم هيفهم حاجة؟
  ar: يأخذ هيرو كريمًا إلى شاطئ بارانغتريتيس، برماله السوداء وأمواجه العالية. وهناك يتكلّم أصدقاء هيرو بسرعة وبكلمات مثل «je» و«og»... فهل سيفهم كريم شيئًا؟
  en: Heru takes Karim to Parangtritis beach - black sand, big waves. Heru's friends talk fast, full of "je" and "og"... will Karim understand a thing?
review:
  status: draft
  verified: false
  notes: Moved from the Ampel quarter, Surabaya (Pak Salim) to Jakal, Jogja (Pak Hasan, as in the j1.u04 lessons), 2026-10-27. Hadrami ancestry is common among Arab-Javanese families; "Sik tak lapor pusat" is the j1.u04 meme line. Check "Logatmu kok Mesir banget" as natural Jogja ngoko.
