language: jv
level: j1
unlock_after: j1.u04
title:
  target: Sek, tak lapor pusat
  ar_eg: ثانية، هبلّغ الإدارة
  ar: لحظة، سأبلّغ الإدارة
  en: Hold on, I'll report to HQ
summary:
  ar_eg: في حيّ أمبيل العربي، كريم بيشتري تمر من بيّاع جدّه جه من حضرموت من زمان. بيتعلّم يقول «tak tuku» (هشتري)، و«wis dibungkus» (اتلفّ). وبعدين مكالمة من مكتبه في القاهرة بتخلّيه يقول أشهر جملة في الحلقة.
  ar: في حيّ أمبيل العربيّ، يشتري كريم تمرًا من بائع جاء جدّه من حضرموت منذ زمن. يتعلّم أن يقول «tak tuku» (سأشتري) و«wis dibungkus» (تمّ لفّه). ثمّ تجعله مكالمة من مكتبه في القاهرة يقول أشهر جملة في الحلقة.
  en: In the Arab quarter of Ampel, Karim buys dates from a seller whose grandfather came from Hadramaut long ago. He learns to say "tak tuku" (I'll buy) and "wis dibungkus" (it's been wrapped). Then a call from his office in Cairo makes him say the episode's most famous line.
cast: [Karim, Cak Heru, Pak Salim]
scenes:
  - setting:
      ar_eg: حواري أمبيل الضيّقة جنب جامع سونان أمبيل، الضهر. محلّات تمر وعطور وسبح وطواقي. البيّاع پاك سالم، راجل كبير لابس طاقية.
      ar: أزقّة أمبيل الضيّقة قرب مسجد سونان أمبيل، ظهرًا. محلّات تمر وعطور وسبح وطواقٍ. البائع باك سالم، رجل مسنّ يعتمر طاقية.
      en: The narrow lanes of Ampel by the Sunan Ampel mosque, at midday. Shops of dates, perfume, prayer beads and caps. The seller, Pak Salim, is an older man in a skullcap.
    lines:
      - speaker: Pak Salim
        text: Ahlan, Mas! Saka Mesir ta? Logatmu kok Mesir banget.
        ar_eg: أهلًا يا أستاذ! انت من مصر، صح؟ لهجتك مصري أوي.
        ar: أهلًا يا أستاذ! أنت من مصر، أليس كذلك؟ لهجتك مصرية جدًّا.
        en: Ahlan, Mas! You're from Egypt, aren't you? Your accent is so Egyptian.
        note:
          ar_eg: ta في آخر الجملة بتطلب تأكيد، زي «صح؟» أو «مش كده؟». وkok هنا بتبيّن الاستغراب.
          ar: ta في آخر الجملة تطلب التأكيد، مثل «أليس كذلك؟». وkok هنا تدلّ على الاستغراب.
          en: ta at the end asks for confirmation, like "right?". kok here shows surprise.
      - speaker: Karim
        text: Iya, Pak! Sampeyan bisa basa Arab?
        ar_eg: أيوه يا حاج! حضرتك بتعرف عربي؟
        ar: نعم يا حاجّ! هل تتكلّم العربية؟
        en: Yes, sir! Can you speak Arabic?
      - speaker: Pak Salim
        text: Sithik ae. Mbahku saka Hadramaut, biyen banget.
        ar_eg: شويّة بس. جدّي جه من حضرموت، من زمان أوي.
        ar: قليلًا فقط. جدّي من حضرموت، منذ زمن بعيد جدًّا.
        en: Just a little. My grandfather came from Hadramaut, a very long time ago.
        note:
          ar_eg: حيّ أمبيل فيه عائلات عربية-جاوية من قرون، أغلبهم أصلهم من حضرموت في اليمن. وae (= saja) يعني «بس».
          ar: في حيّ أمبيل عائلات عربية جاوية منذ قرون، أصل كثير منها من حضرموت في اليمن. وae (= saja) تعني «فقط».
          en: Ampel has had Arab-Javanese families for centuries, many of them from Hadramaut in Yemen. ae (= saja) means "just".
      - speaker: Karim
        text: Kurma iki enak ta, Pak?
        ar_eg: التمر ده حلو، صح يا حاج؟
        ar: هذا التمر لذيذ، أليس كذلك يا حاجّ؟
        en: These dates are good, aren't they, sir?
      - speaker: Pak Salim
        text: Enak lho! Cobaen sek.
        ar_eg: حلو والله! دوق الأول.
        ar: لذيذ فعلًا! تذوّق أوّلًا.
        en: They're really good! Try one first.
        note:
          ar_eg: lho بتأكّد وتلفت النظر، زي «والله!» أو «على فكرة!».
          ar: lho تؤكّد وتلفت الانتباه، مثل «فعلًا!» أو «بالمناسبة!».
          en: lho adds emphasis and draws attention, like "honestly!" or "you know!".
      - speaker: Karim
        text: Mmm! Oke, tak tuku sakilo.
        ar_eg: ممم! تمام، هشتري كيلو.
        ar: ممم! حسنًا، سأشتري كيلو.
        en: Mmm! Okay, I'll buy a kilo.
        note:
          ar_eg: tak- قبل الفعل يعني «أنا هعمل»، بتقولها لما تعرض أو تقرّر. tak tuku = «هشتري أنا».
          ar: tak- قبل الفعل تعني «سأفعل أنا»، تقال عند العرض أو القرار. tak tuku = «سأشتري».
          en: tak- before a verb means "I'll do it", for offers and decisions. tak tuku = "I'll buy".
      - speaker: Pak Salim
        text: Siap. Wis dibungkus, Mas. Iki bonus, kurma ajwa siji.
        ar_eg: حاضر. اتلفّ خلاص يا أستاذ. ودي هديّة، تمرة عجوة واحدة.
        ar: حاضر. تمّ لفّه يا أستاذ. وهذه هديّة، تمرة عجوة واحدة.
        en: Done. It's wrapped, Mas. And here's a bonus, one ajwa date.
        note:
          ar_eg: di- قبل الفعل يعمل مبني للمجهول، زي الإندونيسي. dibungkus = «اتلفّ». وdituku = «اتشرى».
          ar: di- قبل الفعل يجعله مبنيًّا للمجهول، كما في الإندونيسية. dibungkus = «لُفّ». وdituku = «اشتُري».
          en: di- before a verb makes it passive, as in Indonesian. dibungkus = "wrapped". dituku = "bought".
  - setting:
      ar_eg: قدّام الجامع. هيرو مستنّي، وتليفون كريم بيرنّ - مديره في مكتب الترجمة في القاهرة.
      ar: أمام المسجد. هيرو ينتظر، ويرنّ هاتف كريم - مديره في مكتب الترجمة في القاهرة.
      en: Outside the mosque. Heru is waiting, and Karim's phone rings - his boss at the translation office in Cairo.
    lines:
      - speaker: Cak Heru
        text: Sapa iku, rek? Kok raimu serius ngono?
        ar_eg: مين ده يا صاحبي؟ وشّك جدّ كده ليه؟
        ar: من المتّصل يا صديقي؟ لماذا وجهك جادّ هكذا؟
        en: Who's that, mate? How come your face looks so serious?
      - speaker: Karim
        text: Bosku saka Kairo. Takon bukune wis dadi apa durung.
        ar_eg: مديري من القاهرة. بيسأل الكتاب خلص ولّا لسه.
        ar: مديري من القاهرة. يسأل إن كان الكتاب قد اكتمل أم لا.
        en: My boss in Cairo. Asking if the book's done yet or not.
      - speaker: Cak Heru
        text: Lho, wis dadi ta?
        ar_eg: يا راجل، خلص خلاص؟
        ar: هل اكتمل فعلًا؟
        en: Oh, is it done then?
      - speaker: Karim
        text: Durung, ya! Sek, sek... tak lapor pusat.
        ar_eg: لسه طبعًا! ثانية، ثانية... هبلّغ الإدارة.
        ar: ليس بعد طبعًا! لحظة، لحظة... سأبلّغ الإدارة.
        en: Not yet, obviously! Hang on, hang on... I'll report to HQ.
        note:
          ar_eg: «Sek, tak lapor pusat» جملة مشهورة على السوشيال ميديا، بيقولوها بهزار لما حد يأجّل حاجة. وya في آخر الكلام بتليّن الجملة.
          ar: «Sek, tak lapor pusat» عبارة مشهورة على وسائل التواصل، تقال مزاحًا عند تأجيل أمر ما. وya في آخر الجملة تليّنها.
          en: '"Sek, tak lapor pusat" is a famous social-media line, said jokingly when putting something off. ya at the end softens a sentence.'
      - speaker: Cak Heru
        text: Wkwkwk! Kowe kok wis isa ngomong ngono!
        ar_eg: ههههه! انت إزاي بقيت تعرف تقول كده!
        ar: ههههه! كيف صرت تستطيع أن تقول هذا!
        en: Hahaha! How come you can already say that!
      - speaker: Narrator
        text: Kaca papat. Tak tuku, dibungkus, ta, ae, lho, ya.
        ar_eg: صفحة أربعة. هشتري، اتلفّ، صح؟، بس، والله، ماشي.
        ar: الصفحة الرابعة. سأشتري، لُفّ، أليس كذلك، فقط، فعلًا، حسنًا.
        en: Page four. I'll buy, wrapped, right?, just, honestly, okay.
new_words:
  - word: tak tuku
    pos: verb phrase
    ar_eg: هشتري (أنا)
    ar: سأشتري
    en: I'll buy
  - word: dibungkus
    pos: verb
    ar_eg: اتلفّ / اتغلّف
    ar: لُفّ / غُلّف
    en: wrapped
  - word: ta
    pos: particle
    ar_eg: صح؟ / مش كده؟
    ar: أليس كذلك؟
    en: right? isn't it?
  - word: ae
    pos: particle
    ar_eg: بس
    ar: فقط
    en: just (= saja)
  - word: lho
    pos: particle
    ar_eg: والله / على فكرة
    ar: فعلًا / بالمناسبة
    en: really, you know (emphasis)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: جدّ البيّاع جه منين؟
      ar: من أين جاء جدّ البائع؟
      en: Where did the seller's grandfather come from?
    options: ["Mesir", "Hadramaut", "Suroboyo"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Oke, ___ tuku sakilo.
    meaning:
      ar_eg: تمام، هشتري كيلو.
      ar: حسنًا، سأشتري كيلو.
      en: Okay, I'll buy a kilo.
    answers: [tak]
    options: ["tak", "di", "ta"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: «Wis dibungkus» معناها إيه؟
      ar: ما معنى «Wis dibungkus»؟
      en: What does "Wis dibungkus" mean?
    options: ["It's been wrapped.", "I'll wrap it.", "Not wrapped yet."]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Sek, tak lapor pusat.
    answers_meaning:
      ar_eg: ["ثانية، هبلّغ الإدارة.", "استنّى، هقول للإدارة."]
      ar: ["لحظة، سأبلّغ الإدارة.", "انتظر، سأخبر الإدارة."]
      en: ["Hold on, I'll report to HQ.", "Wait, I'll tell head office."]
next:
  ar_eg: هيرو بياخد كريم على شطّ كنجيران، وهناك صحاب هيرو بيتكلّموا بطريقة كريم فاكرها قلّة أدب... هي فعلًا كده؟
  ar: يأخذ هيرو كريمًا إلى شاطئ كنجيران، وهناك يتكلّم أصدقاء هيرو بطريقة يظنّها كريم وقاحة... فهل هي كذلك فعلًا؟
  en: Heru takes Karim to Kenjeran beach, where Heru's friends talk in a way Karim thinks is rude... but is it really?
review:
  status: draft
  verified: false
  notes: Hadrami ancestry of many Ampel families is well documented; "Sek tak lapor pusat" is the j1.u04 meme line. Check "Logatmu kok Mesir banget" and "raimu" (blunt Arek for face, used between friends).
