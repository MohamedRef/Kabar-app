title:
  target: Papat wong, papat basa
  ar_eg: أربع أشخاص، أربع لغات
  ar: أربعة أشخاص، أربع لغات
  en: Four people, four ways of speaking
summary:
  ar_eg: أخيرًا عشا الجوديج في حيّ كوتابارو القديم. كريم بيلاحظ إن بو هارسونو بتكلّم جوزها بجاوي عادي فيه كلمات تشريف، وإن ديماس بيكلّمه هو كده كمان. ده اسمه «نجوكو ألوس» - الكلام القريب اللي فيه احترام. وكريم بيرسم خريطة الترابيزة - أربع أشخاص، أربع طرق كلام.
  ar: أخيرًا عشاء الغوديغ في حيّ كوتابارو القديم. يلاحظ كريم أنّ بو هارسونو تكلّم زوجها بجاوية عادية تتخلّلها كلمات تشريف، وأنّ ديماس يكلّمه هو بالطريقة نفسها. هذا اسمه «نغوكو ألوس» - الكلام القريب المحترم. ويرسم كريم خريطة المائدة - أربعة أشخاص، وأربع طرق للكلام.
  en: The gudeg dinner, at last, in the old Kotabaru quarter. Karim notices Bu Harsono speaks to her husband in plain Javanese with honorific words inside it, and that Dimas speaks to him the same way. It's called ngoko alus - close but respectful. Karim maps the table - four people, four ways of speaking.
cast: [Karim, Bu Harsono, Pak Harsono, Mas Dimas]
scenes:
  - setting:
      ar_eg: وارونج جوديج في كوتابارو، حيّ فيه بيوت هولندية قديمة وشجر عالي. بالليل. العيلة قاعدة حوالين ترابيزة طويلة.
      ar: وارونغ غوديغ في كوتابارو، حيّ فيه بيوت هولندية قديمة وأشجار عالية. ليلًا. تجلس العائلة حول طاولة طويلة.
      en: A gudeg warung in Kotabaru, a quarter of old Dutch houses and tall trees. Night. The family sits round a long table.
    lines:
      - speaker: Bu Harsono
        text: Pak, sampeyan arep ngunjuk apa? Wedang jahe?
        ar_eg: يا حاجّ، تحبّ تشرب إيه؟ زنجبيل سخن؟
        ar: يا عزيزي، ماذا تحبّ أن تشرب؟ شاي الزنجبيل؟
        en: Dear, what would you like to drink? Ginger tea?
        note:
          ar_eg: شوف الجملة - arep وapa نجوكو، بس ngunjuk (يشرب) كراما إنجيل عشان جوزها. ده «نجوكو ألوس» - جاوي قريب، والكلمة اللي بتوصف فعل الكبير بس هي اللي بتتشرّف.
          ar: لاحظ الجملة - arep وapa نغوكو، لكن ngunjuk (يشرب) كراما إنغيل احترامًا لزوجها. هذا «نغوكو ألوس» - جاوية قريبة، ولا تتشرّف إلّا الكلمة التي تصف فعل المحترم.
          en: Look at the sentence - arep and apa are ngoko, but ngunjuk (drink) is krama inggil, for her husband. That's ngoko alus - familiar Javanese where only the words for the respected person's actions are raised.
      - speaker: Pak Harsono
        text: Iya, Bu. Wedang jahe wae. Kowe arep mangan gudeg kering?
        ar_eg: أيوه يا حاجّة. زنجبيل بس. وانتي هتاكلي جوديج ناشف؟
        ar: نعم يا عزيزتي. زنجبيل فقط. وأنتِ، هل ستأكلين الغوديغ الجافّ؟
        en: Yes, dear. Just ginger tea. Will you have the dry gudeg?
      - speaker: Mas Dimas
        text: Mas Karim, sampeyan wis dhahar gudeg durung? Sing iki legi banget lho.
        ar_eg: يا ماس كريم، حضرتك كلت جوديج قبل كده؟ ده مسكّر أوي على فكرة.
        ar: يا ماس كريم، هل أكلت الغوديغ من قبل؟ هذا حلو جدًّا بالمناسبة.
        en: Mas Karim, have you had gudeg before? This one is really sweet, you know.
      - speaker: Karim
        text: Dimas! Kowe ngomong "dhahar" marang aku?
        ar_eg: ديماس! انت بتقولّي «dhahar» أنا؟
        ar: ديماس! هل تقول لي «dhahar»؟
        en: Dimas! You're saying "dhahar" to me?
      - speaker: Mas Dimas
        text: Iya, Mas. Sampeyan luwih tuwa tinimbang aku. Nanging kita kanca. Dadi ngoko alus.
        ar_eg: أيوه يا ماس. انت أكبر منّي. بس إحنا صحاب. فبقت «نجوكو ألوس».
        ar: نعم يا ماس. أنت أكبر منّي. لكنّنا صديقان. لذا صارت «نغوكو ألوس».
        en: Yes, Mas. You're older than me. But we're friends. So it's ngoko alus.
        note:
          ar_eg: ngoko alus بيتقال للناس القريبين اللي بتحترمهم - الأخ الكبير، الجوز أو المراة، الزميل الأكبر. زي ما تقول بالمصري «انت» بس تضيف «يا أستاذ» في الآخر.
          ar: تقال ngoko alus للمقرّبين الذين تحترمهم - الأخ الأكبر، والزوج أو الزوجة، والزميل الأكبر. كأن تقول «أنت» ثمّ تضيف «يا أستاذ».
          en: Ngoko alus is for close people you respect - an older sibling, a spouse, a senior colleague. Like saying "you" but adding "sir" at the end.
      - speaker: Bu Harsono
        text: Leres, Nak. Ing kulawarga Jawa, basa punika kados benang. Saben tiyang benangipun beda.
        ar_eg: صحّ يا ابني. في العيلة الجاوي، الكلام زي الخيط. كل واحد خيطه لون.
        ar: صحيح يا بنيّ. في العائلة الجاوية، الكلام مثل الخيط. لكلّ شخص خيط مختلف.
        en: That's right, my boy. In a Javanese family, language is like thread. Everyone has a different one.
  - setting:
      ar_eg: كريم بيطلّع الكشكول ويرسم الترابيزة - أربع دواير وأسهم بينهم.
      ar: يُخرج كريم الدفتر ويرسم المائدة - أربع دوائر وأسهم بينها.
      en: Karim takes out the notebook and draws the table - four circles with arrows between them.
    lines:
      - speaker: Karim
        text: Aku marang Dimas, ngoko. Dimas marang aku, ngoko alus.
        ar_eg: أنا لديماس، نجوكو. ديماس ليّا، نجوكو ألوس.
        ar: أنا إلى ديماس، نغوكو. ديماس إليّ، نغوكو ألوس.
        en: Me to Dimas, ngoko. Dimas to me, ngoko alus.
      - speaker: Karim
        text: Kula dhateng Pak Harsono, krama alus. Bu Harsono dhateng Bapak, ngoko alus.
        ar_eg: أنا لباك هارسونو، كراما ناعمة. بو هارسونو لجوزها، نجوكو ألوس.
        ar: أنا إلى باك هارسونو، كراما ناعمة. وبو هارسونو إلى زوجها، نغوكو ألوس.
        en: Me to Pak Harsono, krama alus. Bu Harsono to her husband, ngoko alus.
        note:
          ar_eg: krama alus = كراما كاملة مع كراما إنجيل للمحترم وكراما أندهاب لنفسك - أعلى درجة أدب في الكلام اليومي.
          ar: krama alus = كراما كاملة مع الكراما إنغيل للمحترم والكراما أنداب للنفس - أعلى درجات الأدب في الكلام اليومي.
          en: Krama alus = full krama, with krama inggil for the respected person and krama andhap for yourself - the most polite everyday register.
      - speaker: Pak Harsono
        text: Lha, Pak Harsono dhateng Bu Harsono?
        ar_eg: طب وباك هارسونو لبو هارسونو؟
        ar: وماذا عن باك هارسونو إلى بو هارسونو؟
        en: And Pak Harsono to Bu Harsono?
      - speaker: Karim
        text: Ngoko... nanging alus atine.
        ar_eg: نجوكو... بس قلبه ناعم.
        ar: نغوكو... لكنّ قلبه رقيق.
        en: Ngoko... but with a gentle heart.
      - speaker: Bu Harsono
        text: Hahaha! Leres sanget, Nak!
        ar_eg: ههههه! صحّ جدًّا يا ابني!
        ar: ههههه! صحيح جدًّا يا بنيّ!
        en: Hahaha! Very true, my boy!
new_words:
  - word: ngoko alus
    pos: noun
    ar_eg: نجوكو فيه كلمات تشريف (قريب ومحترم)
    ar: نغوكو تتخلّله كلمات تشريف (قريب ومحترم)
    en: polite ngoko (familiar but respectful)
  - word: krama alus
    pos: noun
    ar_eg: أعلى كراما في الكلام اليومي
    ar: أرقى كراما في الكلام اليوميّ
    en: refined krama
  - word: ngunjuk
    pos: verb
    ar_eg: يشرب (للكبير)
    ar: يشرب (للكبير)
    en: drink (honorific)
  - word: wedang jahe
    pos: noun
    ar_eg: زنجبيل سخن
    ar: مشروب الزنجبيل الساخن
    en: hot ginger drink
  - word: luwih tuwa
    ar_eg: أكبر في السنّ
    ar: أكبر سنًّا
    en: older
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: ديماس بيكلّم كريم بإيه؟
      ar: بأيّ مستوى يكلّم ديماس كريمًا؟
      en: How does Dimas speak to Karim?
    options: ["ngoko", "ngoko alus", "krama inggil"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Pak, sampeyan arep ___ apa?
    meaning:
      ar_eg: يا حاجّ، تحبّ تشرب إيه؟
      ar: يا عزيزي، ماذا تحبّ أن تشرب؟
      en: Dear, what would you like to drink?
    answers: [ngunjuk]
    options: ["ngunjuk", "ngombe", "mangan"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه ديماس بيستعمل نجوكو ألوس مع كريم؟
      ar: لماذا يستعمل ديماس النغوكو ألوس مع كريم؟
      en: Why does Dimas use ngoko alus with Karim?
    options: ["Karim is older, but they're friends.", "Karim is a king.", "Karim is a stranger."]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Sampeyan luwih tuwa tinimbang aku.
    answers_meaning:
      ar_eg: ["انت أكبر منّي.", "حضرتك أكبر منّي في السنّ."]
      ar: ["أنت أكبر منّي.", "أنت أكبر سنًّا منّي."]
      en: ["You're older than me.", "You are older than I am."]
next:
  ar_eg: ليلة الجاميلان في برامبانان - باليه الرامايانا تحت المعبد. وكريم بيكتشف إن المهرّجين في الحكاية بيتكلّموا نجوكو والملوك بيتكلّموا كراما... والمستويات هي نفسها الدراما.
  ar: ليلة الغاميلان في برامبانان - باليه الرامايانا تحت المعبد. ويكتشف كريم أنّ المهرّجين في الحكاية يتكلّمون نغوكو والملوك يتكلّمون كراما... وأنّ المستويات هي الدراما نفسها.
  en: Gamelan night at Prambanan - the Ramayana ballet beneath the temple. Karim discovers the clowns in the story speak ngoko and the kings speak krama... and the levels are the drama itself.
review:
  status: draft
  verified: false
  notes: Ngoko alus between spouses and with older friends follows j4.u05. Pak Harsono answers his wife in plain ngoko, which sets up Karim's "gentle heart" joke. Gudeg kering = the drier, longer-keeping style.
