schema: kabar.story/v1
id: sinetron.e43
series: sinetron
episode: 43
language: id
level: bipa5
unlock_after: bipa5.u03
title:
  target: Pak Budi Melawan Kotak yang Bisa Bicara
  ar_eg: باك بودي ضد العلبة اللي بتتكلّم
  ar: باك بودي في مواجهة الصندوق الناطق
  en: Pak Budi Versus the Talking Box
summary:
  ar_eg: بايو بيلزق كود QRIS على حيطة الوارونج، وباك بودي بيتخضّ من علبة صغيرة بتعلن كل فلوس بتدخل. وفي القاهرة، الساعة واحدة بالليل، نادية بتقفش كريم بيقول «صباح الخير» بالجاوي لتطبيق... وكريم أخيرًا بيعترف.
  ar: يلصق بايو رمز QRIS على جدار الوارونغ، فيفزع باك بودي من صندوق صغير يعلن عن كلّ دفعة تصل. وفي القاهرة، في الواحدة ليلًا، تضبط نادية كريمًا يقول «صباح الخير» بالجاوية لتطبيق... ويعترف كريم أخيرًا.
  en: Bayu sticks a QRIS code on the warung wall, and Pak Budi jumps at a little box that announces every payment. In Cairo, at one in the morning, Nadia catches Karim saying "good morning" in Javanese to an app... and Karim finally confesses.
cast: [Bayu, Pak Budi, Bu Sri, Mas Joko, Bu Rahayu, Nadia, Karim]
scenes:
  - setting:
      ar_eg: ماديون، نوفمبر، الصبح بدري. على حيطة الوارونج، جنب النتيجة، فيه كود QR جديد متلزّق، وعلى الترابيزة علبة صغيرة سودا.
      ar: ماديون، نوفمبر، في الصباح الباكر. على جدار الوارونغ بجانب التقويم رمز QR جديد ملصق، وعلى الطاولة صندوق أسود صغير.
      en: Madiun, November, early morning. On the warung wall, next to the calendar, a new QR code has been stuck up, and there's a little black box on the table.
    lines:
      - speaker: Bayu
        text: Pak, mulai hari ini warung kita bisa terima pembayaran pakai QRIS. Pelanggan cukup memindai kode ini pakai HP, terus uangnya langsung masuk ke rekening Bapak.
        ar_eg: يا بابا، من النهارده الوارونج بتاعنا بيقبل الدفع بـ QRIS. الزبون بس يعمل سكان للكود ده بالموبايل، والفلوس تدخل حسابك على طول.
        ar: يا أبي، من اليوم يقبل الوارونغ الدفع عبر QRIS. يكفي أن يمسح الزبون هذا الرمز بهاتفه، فيصل المال إلى حسابك مباشرة.
        en: Dad, from today our warung takes QRIS payments. Customers just scan this code with their phone, and the money goes straight into your account.
        note:
          ar_eg: QRIS (بينطقوها «كيو-ريس») هو كود QR موحّد عمله البنك المركزي الإندونيسي سنة ٢٠١٩ - كود واحد بيشتغل مع كل محافظ الموبايل والبنوك. حتى بيّاعين الشارع بقوا يستعملوه. memindai = يعمل سكان، وفي الشارع بيقولوا scan على طول. pembayaran = الدفع، rekening = حساب بنكي، pakai = بـ.
          ar: QRIS (تُنطق «كيو-ريس») رمز QR موحّد أطلقه البنك المركزي الإندونيسي عام ٢٠١٩ - رمز واحد يعمل مع كلّ المحافظ الإلكترونية والتطبيقات المصرفية، وحتى الباعة الجائلون يستعملونه. memindai = يمسح ضوئيًّا، ويقول الناس في الشارع scan. pembayaran = الدفع، rekening = حساب مصرفي، pakai = بـ.
          en: QRIS (said "kyoo-ris") is a single national QR code launched by Bank Indonesia in 2019 - one code that works with every e-wallet and banking app. Even street vendors use it. memindai = to scan - on the street people just say scan. pembayaran = payment, rekening = bank account, pakai = with (using).
      - speaker: Pak Budi
        text: Bapak lebih percaya uang kertas, Le. Bisa dipegang, bisa dihitung, bisa disimpen di kaleng biskuit.
        ar_eg: أنا بثق في الفلوس الورق أكتر يا ابني. تتمسك، وتتعدّ، وتتشال في علبة البسكويت.
        ar: أنا أثق بالنقود الورقية أكثر يا بنيّ. تُمسك وتُعدّ وتُحفظ في علبة البسكويت.
        en: I trust paper money more, son. You can hold it, count it, and keep it in a biscuit tin.
        note:
          ar_eg: علبة البسكويت في إندونيسيا نكتة مشهورة - كل بيت عنده علبة بسكويت عيد، بس لما تفتحها تلاقي فيها عدّة خياطة أو فلوس أو كيك رز (rengginang)، إلا البسكويت! disimpen = disimpan (يتشال). kaleng biskuit = علبة بسكويت.
          ar: علبة البسكويت نكتة شائعة في إندونيسيا - في كلّ بيت علبة بسكويت العيد، لكن إن فتحتها وجدت فيها أدوات الخياطة أو النقود أو رقائق الأرز (rengginang)، إلّا البسكويت! disimpen = disimpan (يُحفَظ). kaleng biskuit = علبة بسكويت.
          en: The biscuit tin is a classic Indonesian joke - every home has a festive biscuit tin, but open it and you'll find sewing things, money or rice crackers (rengginang) - anything but biscuits! disimpen = disimpan (kept, stored). kaleng biskuit = biscuit tin.
      - speaker: Bu Sri
        text: Pak Budi, pecel dua bungkus, ya. Saya bayar pakai QRIS aja, nggak ada uang kecil.
        ar_eg: يا باك بودي، اتنين بيتشيل تيك أواي. هدفع بـ QRIS أحسن، معييش فكّة.
        ar: يا باك بودي، علبتان من البيتشيل من فضلك. سأدفع عبر QRIS، فليس معي نقود صغيرة.
        en: Pak Budi, two pecel to take away, please. I'll pay with QRIS - I haven't got any change.
        note:
          ar_eg: aja = saja، nggak = tidak. pecel dua bungkus = طبقين بيتشل تيك أواي.
          ar: aja = saja، nggak = tidak. pecel dua bungkus = لفّتان من البيتشل.
          en: aja = saja, nggak = tidak. pecel dua bungkus = two takeaway packs of pecel.
      - speaker: Narrator
        text: 'Bu Sri memindai kode itu. Tiba-tiba, kotak hitam di meja berbunyi keras: "Pembayaran berhasil. Dua puluh empat ribu rupiah."'
        ar_eg: 'بو سري عملت سكان للكود. وفجأة، العلبة السودا اللي على الترابيزة قالت بصوت عالي: «تمّ الدفع بنجاح. أربعة وعشرين ألف روبية».'
        ar: 'مسحت بو سري الرمز. وفجأة نطق الصندوق الأسود على الطاولة بصوت عالٍ: «تمّت عملية الدفع بنجاح. أربعة وعشرون ألف روبية».'
        en: 'Bu Sri scans the code. Suddenly the black box on the table announces loudly: "Payment successful. Twenty-four thousand rupiah."'
      - speaker: Pak Budi
        text: Astaghfirullah! Kotaknya bisa ngomong!
        ar_eg: أستغفر الله! العلبة بتتكلّم!
        ar: أستغفر الله! الصندوق يتكلّم!
        en: Astaghfirullah! The box can talk!
        note:
          ar_eg: ngomong = bicara (يتكلّم).
          ar: ngomong = bicara (يتكلّم).
          en: ngomong = bicara (talk).
      - speaker: Bayu
        text: Itu speaker notifikasi, Pak. Tiap ada yang bayar, dia ngumumin. Jadi Bapak nggak perlu lihat HP sambil ngulek sambal.
        ar_eg: دي سمّاعة إشعارات يا بابا. كل ما حدّ يدفع، بتعلن. فمش محتاج تبصّ في الموبايل وإنت بتدقّ الصلصة.
        ar: هذا مكبّر صوت للإشعارات يا أبي. يعلن عن كلّ دفعة، فلا تحتاج إلى النظر في الهاتف وأنت تسحق الصلصة.
        en: It's a notification speaker, Dad. It announces every payment. So you don't need to check your phone while you're grinding the sambal.
        note:
          ar_eg: speaker = pengeras suara، tiap = setiap، ngumumin = mengumumkan (يعلن)، ngulek = mengulek (يدقّ السامبال في الهون).
          ar: speaker = pengeras suara، tiap = setiap، ngumumin = mengumumkan (يُعلن)، ngulek = mengulek (يسحق الصلصة في الهاون).
          en: speaker = pengeras suara, tiap = setiap, ngumumin = mengumumkan (announce), ngulek = mengulek (grind sambal in a mortar).
      - speaker: Mas Joko
        text: Enak, Pak. Nggak perlu nyari uang kembalian lagi. Kemarin saya keliling gang setengah jam cuma buat nuker uang lima puluh ribuan.
        ar_eg: حلو يا باك. مش هنحتاج ندوّر على فكّة تاني. إمبارح لفّيت الحارة نص ساعة عشان بس أفكّ خمسين ألف.
        ar: هذا مريح يا باك. لن نحتاج إلى البحث عن الفكّة بعد اليوم. بالأمس طفتُ الزقاق نصف ساعة لأصرف ورقة خمسين ألفًا فقط.
        en: It's handy, Pak. No more hunting for change. Yesterday I went round the lane for half an hour just to break a fifty-thousand note.
        note:
          ar_eg: nyari = mencari، cuma = hanya، buat = untuk، nuker = menukar (يفكّ فلوس). keliling = يلفّ، ribuan = ورقة الـ... ألف.
          ar: nyari = mencari، cuma = hanya، buat = untuk، nuker = menukar (يصرف النقود). keliling = يطوف، ribuan = فئة الألف.
          en: nyari = mencari, cuma = hanya, buat = untuk, nuker = menukar (change money). keliling = go around, ribuan = ...-thousand note.
      - speaker: Pak Budi
        text: Tapi gimana keamanannya, Le? Di TV banyak berita penipuan lewat HP. Gimana kalau ada orang jahat yang nyuri data Bapak?
        ar_eg: بس طب والأمان يا ابني؟ في التلفزيون فيه أخبار كتير عن نصب بالموبايل. افرض حدّ وحش سرق بياناتي؟
        ar: لكن ماذا عن الأمان يا بنيّ؟ في التلفاز أخبار كثيرة عن الاحتيال عبر الهاتف. ماذا لو سرق شخص شرّير بياناتي؟
        en: But what about security, son? There's lots of news on TV about phone scams. What if some crook steals my data?
        note:
          ar_eg: gimana = bagaimana، TV = televisi، nyuri = mencuri (يسرق). berita = أخبار، data = بيانات.
          ar: gimana = bagaimana، TV = televisi، nyuri = mencuri (يسرق). berita = أخبار، data = بيانات.
          en: gimana = bagaimana, TV = televisi, nyuri = mencuri (steal). berita = news, data = data.
      - speaker: Bayu
        text: Kekhawatiran Bapak masuk akal kok. Kuncinya satu, Pak. Jangan pernah kasih PIN atau kode OTP ke siapa pun, walaupun orangnya ngaku dari bank.
        ar_eg: قلقك ده منطقي يا بابا. المفتاح حاجة واحدة - عمرك ما تدّي الـ PIN أو كود الـ OTP لأي حدّ، حتى لو قال إنه من البنك.
        ar: قلقك منطقي يا أبي. والمفتاح أمر واحد - لا تُعطِ رقمك السرّي أو رمز التحقّق لأيّ أحد أبدًا، حتى لو ادّعى أنّه من البنك.
        en: Your worry makes sense, Dad. There's one key rule. Never give your PIN or OTP code to anyone, even if they say they're from the bank.
        note:
          ar_eg: kasih = memberikan، ke = kepada، ngaku = mengaku (يدّعي). masuk akal = منطقي، kekhawatiran = القلق، kode = كود.
          ar: kasih = memberikan، ke = kepada، ngaku = mengaku (يدّعي). masuk akal = منطقي، kekhawatiran = القلق، kode = رمز.
          en: kasih = memberikan (give), ke = kepada (to), ngaku = mengaku (claim). masuk akal = makes sense, kekhawatiran = worry, kode = code.
      - speaker: Bu Rahayu
        text: Denger tuh, Pak. Kemudahan boleh, tapi kehati-hatian tetap nomor satu.
        ar_eg: سامع يا أبو ساري؟ السهولة ماشي، بس الحرص أولًا.
        ar: أسمعت يا باك؟ السهولة لا بأس بها، لكنّ الحذر أوّلًا.
        en: Hear that, Pak? Convenience is fine, but caution comes first.
        note:
          ar_eg: النهارده الحلقة مليانة nominalisasi (تحويل الفعل أو الصفة لاسم) - mudah ← kemudahan (سهولة)، hati-hati ← kehati-hatian (حرص)، aman ← keamanan (أمان)، bayar ← pembayaran (دفع)، khawatir ← kekhawatiran (قلق). ده أسلوب الكتابة الرسمية. denger = dengar، tuh = itu.
          ar: الحلقة مليئة بالـ nominalisasi (تحويل الفعل أو الصفة إلى اسم) - mudah ← kemudahan (سهولة)، hati-hati ← kehati-hatian (حذر)، aman ← keamanan (أمان)، bayar ← pembayaran (دفع)، khawatir ← kekhawatiran (قلق). وهو أسلوب الكتابة الرسمية. denger = dengar، tuh = itu.
          en: This episode is full of nominalisasi (turning verbs and adjectives into nouns) - mudah → kemudahan (convenience), hati-hati → kehati-hatian (caution), aman → keamanan (security), bayar → pembayaran (payment), khawatir → kekhawatiran (worry). It's the style of formal writing. denger = dengar (listen), tuh = itu (that).
      - speaker: Pak Budi
        text: Ya udah. Tapi kaleng biskuit Bapak tetap di sini. Buat jaga-jaga.
        ar_eg: ماشي. بس علبة البسكويت بتاعتي هتفضل هنا. احتياطي.
        ar: لا بأس. لكنّ علبة البسكويت تبقى هنا، احتياطًا.
        en: All right. But my biscuit tin stays right here. Just in case.
        note:
          ar_eg: ya udah = baiklah (خلاص ماشي)، buat jaga-jaga = للاحتياط.
          ar: ya udah = baiklah (حسنًا إذن)، buat jaga-jaga = للاحتياط.
          en: ya udah = baiklah (oh well, fine), buat jaga-jaga = just in case.
      - speaker: Narrator
        text: 'Sore harinya, kotak itu sudah berbunyi tiga puluh kali. Dan Pak Budi mulai menjawabnya dengan sopan: "Sama-sama, Kotak."'
        ar_eg: 'العصر، العلبة كانت اتكلّمت تلاتين مرّة. وباك بودي بدأ يردّ عليها بأدب: «العفو يا علبة».'
        ar: 'وبحلول العصر كان الصندوق قد نطق ثلاثين مرّة، وبدأ باك بودي يردّ عليه بأدب: «عفوًا يا صندوق».'
        en: 'By the afternoon, the box has spoken thirty times. And Pak Budi has started answering it politely: "You''re welcome, Box."'
  - setting:
      ar_eg: القاهرة، الساعة واحدة بالليل. نادية صحيت تشرب مية، وسمعت صوت جاي من البلكونة. كريم قاعد هناك بسمّاعات.
      ar: القاهرة، الواحدة ليلًا. استيقظت نادية لتشرب، فسمعت صوتًا من الشرفة. كريم جالس هناك بسمّاعتين.
      en: Cairo, one in the morning. Nadia gets up for a drink of water and hears a voice from the balcony. Karim is sitting out there with earphones in.
    lines:
      - speaker: Karim
        text: Sugeng enjang, Pak Budi. Kula Karim. Pripun kabaripun?
        ar_eg: صباح الخير يا باك بودي. أنا كريم. أخبار حضرتك إيه؟
        ar: صباح الخير يا باك بودي. أنا كريم. كيف حالكم؟
        en: Good morning, Pak Budi. It's Karim. How are you?
        note:
          ar_eg: 'ده جاوي «كراما» (المؤدّب) - sugeng enjang (صباح الخير)، kula (أنا)، pripun kabaripun (أخبارك إيه). بالجاوي العادي «نغوكو» هيبقى: piye kabare?'
          ar: 'هذه جاوية «كراما» (المهذّبة) - sugeng enjang (صباح الخير)، kula (أنا)، pripun kabaripun (كيف حالكم). وبالجاوية العادية «نغوكو» تصبح: piye kabare?'
          en: 'This is krama (polite) Javanese - sugeng enjang (good morning), kula (I), pripun kabaripun (how are you). In everyday ngoko Javanese it would be: piye kabare?'
      - speaker: Nadia
        text: Karim! "Sugeng enjang" jam satu malam? Kamu ngomong sama siapa?
        ar_eg: يا كريم! «صباح الخير» الساعة واحدة بالليل؟ إنت بتكلّم مين؟
        ar: يا كريم! «صباح الخير» في الواحدة ليلًا؟ مع من تتكلّم؟
        en: Karim! "Good morning" at one in the morning? Who are you talking to?
        note:
          ar_eg: ngomong sama = berbicara dengan. sugeng enjang = صباح الخير بالجاوي المؤدّب (krama).
          ar: ngomong sama = berbicara dengan. sugeng enjang = صباح الخير بالجاوية المهذّبة (krama).
          en: ngomong sama = berbicara dengan (talk to). sugeng enjang = good morning in polite Javanese (krama).
      - speaker: Karim
        text: Sama... aplikasi. Aplikasi ini pakai AI, kecerdasan buatan. Dia dengerin pengucapanku, terus kasih nilai.
        ar_eg: مع... تطبيق. التطبيق ده بيستعمل ذكاء اصطناعي. بيسمع نطقي، وبعدين يدّيني درجة.
        ar: مع... تطبيق. يستعمل هذا التطبيق الذكاء الاصطناعي، فيستمع إلى نطقي ثم يعطيني درجة.
        en: With... an app. It uses artificial intelligence. It listens to my pronunciation, then gives me a score.
        note:
          ar_eg: kecerdasan buatan (حرفيًا «ذكاء مصنوع») هو الذكاء الاصطناعي - cerdas (ذكي) ← kecerdasan، وbuat (يعمل) ← buatan (مصنوع). وpengucapan (نطق) من ucap (يقول). وفي الكلام اليومي بيقولوا AI أكتر. dengerin = mendengarkan، kasih nilai = memberi nilai (يدّي درجة).
          ar: kecerdasan buatan (حرفيًّا «ذكاء مصنوع») هو الذكاء الاصطناعي - cerdas (ذكيّ) ← kecerdasan، وbuat (صنع) ← buatan (مصنوع). وpengucapan (النطق) من ucap (قال). وفي الكلام اليومي يقولون AI غالبًا. dengerin = mendengarkan، kasih nilai = memberi nilai (يعطي درجة).
          en: kecerdasan buatan ("made intelligence") is artificial intelligence - cerdas (clever) → kecerdasan, buat (make) → buatan (man-made). pengucapan (pronunciation) comes from ucap (to utter). In everyday talk people mostly just say AI. dengerin = mendengarkan (listen to), kasih nilai = memberi nilai (give a score).
      - speaker: Nadia
        text: Aplikasi "cuaca" yang waktu itu, kan? Ayo, jujur deh. Buat apa sih kamu belajar bahasa Jawa halus?
        ar_eg: «تطبيق الطقس» بتاع المرّة اللي فاتت، صح؟ يلا، قول الحقيقة. بتتعلّم جاوي مؤدّب ليه؟
        ar: «تطبيق الطقس» ذاك، أليس كذلك؟ هيّا، كن صادقًا. لماذا تتعلّم الجاوية المهذّبة؟
        en: The "weather app" from that time, right? Come on, be honest. What are you learning polite Javanese for?
        note:
          ar_eg: deh = «بقى» (ayo jujur deh = يلّا اعترف بقى)، buat apa = untuk apa. halus = راقي/مؤدّب.
          ar: deh = أداة حثّ (ayo jujur deh = هيّا اعترف)، buat apa = untuk apa. halus = مهذّب راقٍ.
          en: deh pushes gently (ayo jujur deh = come on, own up), buat apa = untuk apa (what for). halus = refined, polite.
      - speaker: Karim
        text: Buat kerjaan. Banyak turis dari Jawa.
        ar_eg: عشان الشغل. فيه سيّاح كتير من جاوة.
        ar: من أجل العمل. هناك سيّاح كثيرون من جاوة.
        en: For work. Lots of tourists come from Java.
        note:
          ar_eg: kerjaan = pekerjaan (الشغل).
          ar: kerjaan = pekerjaan (العمل).
          en: kerjaan = pekerjaan (work, job).
      - speaker: Nadia
        text: Turis dari Jawa ngomong bahasa Indonesia sama kamu, Karim. Nggak ada turis yang minta dipandu pakai bahasa krama.
        ar_eg: السيّاح اللي من جاوة بيكلّموك إندونيسي يا كريم. مفيش سايح بيطلب جولة بالكراما.
        ar: السيّاح القادمون من جاوة يكلّمونك بالإندونيسية يا كريم. لا يطلب أيّ سائح جولة بلغة الكراما.
        en: Tourists from Java speak Indonesian to you, Karim. No tourist ever asked for a tour in krama.
        note:
          ar_eg: ngomong sama kamu = berbicara denganmu. dipandu = حدّ يرشده (مرشد سياحي)، krama = الجاوي المؤدّب.
          ar: ngomong sama kamu = berbicara denganmu. dipandu = أن يُرشَد، krama = الجاوية المهذّبة.
          en: ngomong sama kamu = berbicara denganmu (talk to you). dipandu = be guided, krama = polite Javanese.
      - speaker: Karim
        text: Ya udah deh. Bahasa Indonesia aku udah bisa. Tapi di Jawa, orang nunjukin hormat ke orang tua lewat bahasa krama. Aku pengen suatu hari bisa ngomong sama Pak Budi pakai bahasanya sendiri, dengan penuh hormat.
        ar_eg: خلاص. الإندونيسي أنا بعرفه. بس في جاوة، الناس بتبيّن احترامها للكبار بالكراما. وأنا نفسي في يوم أتكلّم مع باك بودي بلغته هو، وباحترام كامل.
        ar: حسنًا. الإندونيسية أتقنها. لكنّ الناس في جاوة يُظهرون احترامهم للكبار بلغة الكراما. وأريد يومًا ما أن أكلّم باك بودي بلغته هو، بكلّ احترام.
        en: All right. I can already speak Indonesian. But in Java, people show respect to their elders through krama. One day I want to be able to speak to Pak Budi in his own language, with real respect.
        note:
          ar_eg: الجاوي ليه مستويات كلام - ngoko (عادي، مع الصحاب والأصغر)، krama (مؤدّب)، وkrama inggil (كلمات تكريم للي قدّامك). زي «إنت» و«حضرتك»، بس هنا كلمات كتير بتتغيّر خالص، مش الضمير بس. وفي الشارع - nunjukin = menunjukkan (يبيّن)، pengen = ingin، udah = sudah.
          ar: للجاوية مستويات كلام - ngoko (عادي، مع الأصدقاء والأصغر سنًّا)، وkrama (مهذّب)، وkrama inggil (ألفاظ تكريم للمخاطَب). كالفرق بين «أنت» و«حضرتك»، لكنّ كلمات كثيرة تتغيّر هنا كليًّا لا الضمير وحده. وبلغة الشارع - nunjukin = menunjukkan (يُظهر)، pengen = ingin، udah = sudah.
          en: Javanese has speech levels - ngoko (plain, for friends and juniors), krama (polite) and krama inggil (honorific words for the person you address). Like enta versus hadretak, except many whole words change, not just the pronoun. Street forms - nunjukin = menunjukkan (show), pengen = ingin (want), udah = sudah.
      - speaker: Nadia
        text: Karim... "suatu hari" itu kapan?
        ar_eg: يا كريم... «في يوم» ده إمتى بالظبط؟
        ar: يا كريم... «يومًا ما» هذا متى بالضبط؟
        en: Karim... and when exactly is "one day"?
      - speaker: Karim
        text: Kantorku mungkin ngirim aku ke Indonesia awal tahun depan, buat pameran wisata. Tapi jangan bilang Sari dulu ya. Ini rahasia.
        ar_eg: الشركة ممكن تبعتني إندونيسيا أول السنة الجاية، لمعرض سياحة. بس متقوليش لساري دلوقتي. ده سرّ.
        ar: ربما ترسلني شركتي إلى إندونيسيا مطلع العام القادم من أجل معرض سياحي. لكن لا تخبري ساري الآن. هذا سرّ.
        en: My office might send me to Indonesia early next year, for a travel fair. But don't tell Sari yet. It's a secret.
        note:
          ar_eg: ngirim = mengirim (يبعت)، bilang = يقول لـ، rahasia = سرّ.
          ar: ngirim = mengirim (يُرسل)، bilang = يُخبر، rahasia = سرّ.
          en: ngirim = mengirim (send), bilang = tell, rahasia = secret.
      - speaker: Nadia
        text: Rahasiamu aman sama aku. Paling nggak sampai sarapan.
        ar_eg: سرّك في بير. على الأقل لحد الفطار.
        ar: سرّك في أمان معي. على الأقلّ حتى الإفطار.
        en: Your secret's safe with me. At least until breakfast.
        note:
          ar_eg: sama aku = bersamaku (معايا)، paling nggak = setidaknya (على الأقل).
          ar: sama aku = bersamaku (معي)، paling nggak = setidaknya (على الأقلّ).
          en: sama aku = bersamaku (with me), paling nggak = setidaknya (at least).
      - speaker: Narrator
        text: 'Aplikasi di HP Karim berbunyi lagi: "Pengucapan Anda: enam puluh dua persen. Silakan coba lagi."'
        ar_eg: 'التطبيق اللي على موبايل كريم اتكلّم تاني: «نطقك: ٦٢ في المية. حاول تاني من فضلك».'
        ar: 'نطق التطبيق في هاتف كريم من جديد: «نطقك: اثنان وستون بالمئة. حاول مرّة أخرى من فضلك».'
        en: 'The app on Karim''s phone speaks again: "Your pronunciation: sixty-two per cent. Please try again."'
      - speaker: Karim
        text: Matur nuwun. Sugeng enjang, Pak Budi. Sugeng enjang...
        ar_eg: متشكّر. صباح الخير يا باك بودي. صباح الخير...
        ar: شكرًا. صباح الخير يا باك بودي. صباح الخير...
        en: Thank you. Good morning, Pak Budi. Good morning...
