unlock_after: bipa5.u03
title:
  target: Pak Budi Melawan Kotak yang Bisa Bicara
  ar_eg: پاك بودي ضد العلبة اللي بتتكلّم
  ar: باك بودي في مواجهة الصندوق الناطق
  en: Pak Budi Versus the Talking Box
summary:
  ar_eg: بايو بيلزق كود QRIS على حيطة الوارونج، وپاك بودي بيتخضّ من علبة صغيرة بتعلن كل فلوس بتدخل. وفي القاهرة، الساعة واحدة بالليل، نادية بتقفش كريم بيقول «صباح الخير» بالجاوي لتطبيق... وكريم أخيرًا بيعترف.
  ar: يلصق بايو رمز QRIS على جدار الوارونغ، فيفزع باك بودي من صندوق صغير يعلن عن كلّ دفعة تصل. وفي القاهرة، في الواحدة ليلًا، تضبط نادية كريمًا يقول «صباح الخير» بالجاوية لتطبيق... ويعترف كريم أخيرًا.
  en: Bayu sticks a QRIS code on the warung wall, and Pak Budi jumps at a little box that announces every payment. In Cairo, at one in the morning, Nadia catches Karim saying "good morning" in Javanese to an app... and Karim finally confesses.
cast: [Bayu, Pak Budi, Bu Sri, Mas Joko, Bu Rahayu, Nadia, Karim]
scenes:
  - setting:
      ar_eg: ماديون، نوفمبر، الصبح بدري. على حيطة الوارونج، جنب النتيجة، فيه كود QR جديد متلزّق، وعلى الترابيزة علبة صغيرة سودا.
      ar: ماديون، نوفمبر، في الصباح الباكر. على جدار الوارونغ بجانب التقويم رمز QR جديد ملصق، وعلى الطاولة صندوق أسود صغير.
      en: Madiun, November, early morning. On the warung wall, next to the calendar, a new QR code has been stuck up, and there's a little black box on the table.
    lines:
      - speaker: Bayu
        text: Pak, mulai hari ini warung kita menerima pembayaran dengan QRIS. Pelanggan cukup memindai kode ini dengan HP, lalu uangnya langsung masuk ke rekening Bapak.
        ar_eg: يا بابا، من النهارده الوارونج بتاعنا بيقبل الدفع بـ QRIS. الزبون بس يعمل سكان للكود ده بالموبايل، والفلوس تدخل حسابك على طول.
        ar: يا أبي، من اليوم يقبل الوارونغ الدفع عبر QRIS. يكفي أن يمسح الزبون هذا الرمز بهاتفه، فيصل المال إلى حسابك مباشرة.
        en: Dad, from today our warung takes QRIS payments. Customers just scan this code with their phone, and the money goes straight into your account.
        note:
          ar_eg: QRIS (بينطقوها «كيو-ريس») هو كود QR موحّد عمله البنك المركزي الإندونيسي سنة ٢٠١٩ - كود واحد بيشتغل مع كل محافظ الموبايل والبنوك. حتى بيّاعين الشارع بقوا يستعملوه.
          ar: QRIS (تُنطق «كيو-ريس») رمز QR موحّد أطلقه البنك المركزي الإندونيسي عام ٢٠١٩ - رمز واحد يعمل مع كلّ المحافظ الإلكترونية والتطبيقات المصرفية، وحتى الباعة الجائلون يستعملونه.
          en: QRIS (said "kyoo-ris") is a single national QR code launched by Bank Indonesia in 2019 - one code that works with every e-wallet and banking app. Even street vendors use it.
      - speaker: Pak Budi
        text: Bapak lebih percaya uang kertas, Le. Bisa dipegang, bisa dihitung, bisa disimpan di kaleng biskuit.
        ar_eg: أنا بثق في الفلوس الورق أكتر يا ابني. تتمسك، وتتعدّ، وتتشال في علبة البسكويت.
        ar: أنا أثق بالنقود الورقية أكثر يا بنيّ. تُمسك وتُعدّ وتُحفظ في علبة البسكويت.
        en: I trust paper money more, son. You can hold it, count it, and keep it in a biscuit tin.
        note:
          ar_eg: علبة البسكويت في إندونيسيا نكتة مشهورة - كل بيت عنده علبة بسكويت عيد، بس لما تفتحها تلاقي فيها عدّة خياطة أو فلوس أو كيك رز (rengginang)، إلا البسكويت!
          ar: علبة البسكويت نكتة شائعة في إندونيسيا - في كلّ بيت علبة بسكويت العيد، لكن إن فتحتها وجدت فيها أدوات الخياطة أو النقود أو رقائق الأرز (rengginang)، إلّا البسكويت!
          en: The biscuit tin is a classic Indonesian joke - every home has a festive biscuit tin, but open it and you'll find sewing things, money or rice crackers (rengginang) - anything but biscuits!
      - speaker: Bu Sri
        text: Pak Budi, pecel dua bungkus, ya. Saya bayar pakai QRIS saja, tidak ada uang kecil.
        ar_eg: يا پاك بودي، اتنين بيچيل تيك أواي. هدفع بـ QRIS أحسن، معييش فكّة.
        ar: يا باك بودي، علبتان من البيتشيل من فضلك. سأدفع عبر QRIS، فليس معي نقود صغيرة.
        en: Pak Budi, two pecel to take away, please. I'll pay with QRIS - I haven't got any change.
      - speaker: Narrator
        text: 'Bu Sri memindai kode itu. Tiba-tiba, kotak hitam di meja berbunyi keras: "Pembayaran berhasil. Dua puluh empat ribu rupiah."'
        ar_eg: 'بو سري عملت سكان للكود. وفجأة، العلبة السودا اللي على الترابيزة قالت بصوت عالي: «تمّ الدفع بنجاح. أربعة وعشرين ألف روبية».'
        ar: 'مسحت بو سري الرمز. وفجأة نطق الصندوق الأسود على الطاولة بصوت عالٍ: «تمّت عملية الدفع بنجاح. أربعة وعشرون ألف روبية».'
        en: 'Bu Sri scans the code. Suddenly the black box on the table announces loudly: "Payment successful. Twenty-four thousand rupiah."'
      - speaker: Pak Budi
        text: Astaghfirullah! Kotaknya bisa bicara!
        ar_eg: أستغفر الله! العلبة بتتكلّم!
        ar: أستغفر الله! الصندوق يتكلّم!
        en: Astaghfirullah! The box can talk!
      - speaker: Bayu
        text: Itu pengeras suara notifikasi, Pak. Setiap ada pembayaran, dia mengumumkannya. Jadi Bapak tidak perlu melihat HP sambil mengulek sambal.
        ar_eg: دي سمّاعة إشعارات يا بابا. كل ما حدّ يدفع، بتعلن. فمش محتاج تبصّ في الموبايل وإنت بتدقّ الصلصة.
        ar: هذا مكبّر صوت للإشعارات يا أبي. يعلن عن كلّ دفعة، فلا تحتاج إلى النظر في الهاتف وأنت تسحق الصلصة.
        en: It's a notification speaker, Dad. It announces every payment. So you don't need to check your phone while you're grinding the sambal.
      - speaker: Mas Joko
        text: Enak, Pak. Tidak perlu mencari uang kembalian lagi. Kemarin saya keliling gang setengah jam hanya untuk menukar uang lima puluh ribuan.
        ar_eg: حلو يا پاك. مش هنحتاج ندوّر على فكّة تاني. إمبارح لفّيت الحارة نص ساعة عشان بس أفكّ خمسين ألف.
        ar: هذا مريح يا باك. لن نحتاج إلى البحث عن الفكّة بعد اليوم. بالأمس طفتُ الزقاق نصف ساعة لأصرف ورقة خمسين ألفًا فقط.
        en: It's handy, Pak. No more hunting for change. Yesterday I went round the lane for half an hour just to break a fifty-thousand note.
      - speaker: Pak Budi
        text: Tapi bagaimana dengan keamanannya, Le? Di televisi banyak berita penipuan lewat HP. Bagaimana kalau ada orang jahat yang mencuri data Bapak?
        ar_eg: بس طب والأمان يا ابني؟ في التلفزيون فيه أخبار كتير عن نصب بالموبايل. افرض حدّ وحش سرق بياناتي؟
        ar: لكن ماذا عن الأمان يا بنيّ؟ في التلفاز أخبار كثيرة عن الاحتيال عبر الهاتف. ماذا لو سرق شخص شرّير بياناتي؟
        en: But what about security, son? There's lots of news on TV about phone scams. What if some crook steals my data?
      - speaker: Bayu
        text: Kekhawatiran Bapak masuk akal. Kuncinya satu, Pak. Jangan pernah memberikan PIN atau kode OTP kepada siapa pun, walaupun orang itu mengaku dari bank.
        ar_eg: قلقك ده منطقي يا بابا. المفتاح حاجة واحدة - عمرك ما تدّي الـ PIN أو كود الـ OTP لأي حدّ، حتى لو قال إنه من البنك.
        ar: قلقك منطقي يا أبي. والمفتاح أمر واحد - لا تُعطِ رقمك السرّي أو رمز التحقّق لأيّ أحد أبدًا، حتى لو ادّعى أنّه من البنك.
        en: Your worry makes sense, Dad. There's one key rule. Never give your PIN or OTP code to anyone, even if they say they're from the bank.
      - speaker: Bu Rahayu
        text: Dengar itu, Pak. Kemudahan boleh, tetapi kehati-hatian tetap nomor satu.
        ar_eg: سامع يا أبو ساري؟ السهولة ماشي، بس الحرص أولًا.
        ar: أسمعت يا باك؟ السهولة لا بأس بها، لكنّ الحذر أوّلًا.
        en: Hear that, Pak? Convenience is fine, but caution comes first.
        note:
          ar_eg: النهارده الحلقة مليانة nominalisasi (تحويل الفعل أو الصفة لاسم) - mudah ← kemudahan (سهولة)، hati-hati ← kehati-hatian (حرص)، aman ← keamanan (أمان)، bayar ← pembayaran (دفع)، khawatir ← kekhawatiran (قلق). ده أسلوب الكتابة الرسمية.
          ar: الحلقة مليئة بالـ nominalisasi (تحويل الفعل أو الصفة إلى اسم) - mudah ← kemudahan (سهولة)، hati-hati ← kehati-hatian (حذر)، aman ← keamanan (أمان)، bayar ← pembayaran (دفع)، khawatir ← kekhawatiran (قلق). وهو أسلوب الكتابة الرسمية.
          en: This episode is full of nominalisasi (turning verbs and adjectives into nouns) - mudah → kemudahan (convenience), hati-hati → kehati-hatian (caution), aman → keamanan (security), bayar → pembayaran (payment), khawatir → kekhawatiran (worry). It's the style of formal writing.
      - speaker: Pak Budi
        text: Baiklah. Tapi kaleng biskuit Bapak tetap di sini. Untuk jaga-jaga.
        ar_eg: ماشي. بس علبة البسكويت بتاعتي هتفضل هنا. احتياطي.
        ar: لا بأس. لكنّ علبة البسكويت تبقى هنا، احتياطًا.
        en: All right. But my biscuit tin stays right here. Just in case.
      - speaker: Narrator
        text: 'Sore harinya, kotak itu sudah berbunyi tiga puluh kali. Dan Pak Budi mulai menjawabnya dengan sopan: "Sama-sama, Kotak."'
        ar_eg: 'العصر، العلبة كانت اتكلّمت تلاتين مرّة. وپاك بودي بدأ يردّ عليها بأدب: «العفو يا علبة».'
        ar: 'وبحلول العصر كان الصندوق قد نطق ثلاثين مرّة، وبدأ باك بودي يردّ عليه بأدب: «عفوًا يا صندوق».'
        en: 'By the afternoon, the box has spoken thirty times. And Pak Budi has started answering it politely: "You''re welcome, Box."'
  - setting:
      ar_eg: القاهرة، الساعة واحدة بالليل. نادية صحيت تشرب مية، وسمعت صوت جاي من البلكونة. كريم قاعد هناك بسمّاعات.
      ar: القاهرة، الواحدة ليلًا. استيقظت نادية لتشرب، فسمعت صوتًا من الشرفة. كريم جالس هناك بسمّاعتين.
      en: Cairo, one in the morning. Nadia gets up for a drink of water and hears a voice from the balcony. Karim is sitting out there with earphones in.
    lines:
      - speaker: Karim
        text: Sugeng enjang, Pak Budi. Kula Karim. Pripun kabaripun?
        ar_eg: صباح الخير يا پاك بودي. أنا كريم. أخبار حضرتك إيه؟
        ar: صباح الخير يا باك بودي. أنا كريم. كيف حالكم؟
        en: Good morning, Pak Budi. It's Karim. How are you?
        note:
          ar_eg: 'ده جاوي «كراما» (المؤدّب) - sugeng enjang (صباح الخير)، kula (أنا)، pripun kabaripun (أخبارك إيه). بالجاوي العادي «نغوكو» هيبقى: piye kabare?'
          ar: 'هذه جاوية «كراما» (المهذّبة) - sugeng enjang (صباح الخير)، kula (أنا)، pripun kabaripun (كيف حالكم). وبالجاوية العادية «نغوكو» تصبح: piye kabare?'
          en: 'This is krama (polite) Javanese - sugeng enjang (good morning), kula (I), pripun kabaripun (how are you). In everyday ngoko Javanese it would be: piye kabare?'
      - speaker: Nadia
        text: Karim! "Sugeng enjang" jam satu malam? Kamu bicara dengan siapa?
        ar_eg: يا كريم! «صباح الخير» الساعة واحدة بالليل؟ إنت بتكلّم مين؟
        ar: يا كريم! «صباح الخير» في الواحدة ليلًا؟ مع من تتكلّم؟
        en: Karim! "Good morning" at one in the morning? Who are you talking to?
      - speaker: Karim
        text: Dengan... aplikasi. Aplikasi ini memakai kecerdasan buatan. Dia mendengarkan pengucapanku, lalu memberi nilai.
        ar_eg: مع... تطبيق. التطبيق ده بيستعمل ذكاء اصطناعي. بيسمع نطقي، وبعدين يدّيني درجة.
        ar: مع... تطبيق. يستعمل هذا التطبيق الذكاء الاصطناعي، فيستمع إلى نطقي ثم يعطيني درجة.
        en: With... an app. It uses artificial intelligence. It listens to my pronunciation, then gives me a score.
        note:
          ar_eg: kecerdasan buatan (حرفيًا «ذكاء مصنوع») هو الذكاء الاصطناعي - cerdas (ذكي) ← kecerdasan، وbuat (يعمل) ← buatan (مصنوع). وpengucapan (نطق) من ucap (يقول).
          ar: kecerdasan buatan (حرفيًّا «ذكاء مصنوع») هو الذكاء الاصطناعي - cerdas (ذكيّ) ← kecerdasan، وbuat (صنع) ← buatan (مصنوع). وpengucapan (النطق) من ucap (قال).
          en: kecerdasan buatan ("made intelligence") is artificial intelligence - cerdas (clever) → kecerdasan, buat (make) → buatan (man-made). pengucapan (pronunciation) comes from ucap (to utter).
      - speaker: Nadia
        text: Aplikasi "cuaca" yang waktu itu, ya? Ayo, jujur. Untuk apa kamu belajar bahasa Jawa halus?
        ar_eg: «تطبيق الطقس» بتاع المرّة اللي فاتت، صح؟ يلا، قول الحقيقة. بتتعلّم جاوي مؤدّب ليه؟
        ar: «تطبيق الطقس» ذاك، أليس كذلك؟ هيّا، كن صادقًا. لماذا تتعلّم الجاوية المهذّبة؟
        en: The "weather app" from that time, right? Come on, be honest. What are you learning polite Javanese for?
      - speaker: Karim
        text: Untuk pekerjaan. Banyak turis dari Jawa.
        ar_eg: عشان الشغل. فيه سيّاح كتير من جاوة.
        ar: من أجل العمل. هناك سيّاح كثيرون من جاوة.
        en: For work. Lots of tourists come from Java.
      - speaker: Nadia
        text: Turis dari Jawa bicara bahasa Indonesia denganmu, Karim. Tidak ada turis yang minta dipandu dalam bahasa krama.
        ar_eg: السيّاح اللي من جاوة بيكلّموك إندونيسي يا كريم. مفيش سايح بيطلب جولة بالكراما.
        ar: السيّاح القادمون من جاوة يكلّمونك بالإندونيسية يا كريم. لا يطلب أيّ سائح جولة بلغة الكراما.
        en: Tourists from Java speak Indonesian to you, Karim. No tourist ever asked for a tour in krama.
      - speaker: Karim
        text: Baiklah. Bahasa Indonesia aku sudah bisa. Tetapi di Jawa, orang menunjukkan hormat kepada orang tua lewat bahasa krama. Aku ingin suatu hari bisa berbicara dengan Pak Budi dalam bahasanya sendiri, dengan penuh hormat.
        ar_eg: خلاص. الإندونيسي أنا بعرفه. بس في جاوة، الناس بتبيّن احترامها للكبار بالكراما. وأنا نفسي في يوم أتكلّم مع پاك بودي بلغته هو، وباحترام كامل.
        ar: حسنًا. الإندونيسية أتقنها. لكنّ الناس في جاوة يُظهرون احترامهم للكبار بلغة الكراما. وأريد يومًا ما أن أكلّم باك بودي بلغته هو، بكلّ احترام.
        en: All right. I can already speak Indonesian. But in Java, people show respect to their elders through krama. One day I want to be able to speak to Pak Budi in his own language, with real respect.
        note:
          ar_eg: الجاوي ليه مستويات كلام - ngoko (عادي، مع الصحاب والأصغر)، krama (مؤدّب)، وkrama inggil (كلمات تكريم للي قدّامك). زي «إنت» و«حضرتك»، بس هنا كلمات كتير بتتغيّر خالص، مش الضمير بس.
          ar: للجاوية مستويات كلام - ngoko (عادي، مع الأصدقاء والأصغر سنًّا)، وkrama (مهذّب)، وkrama inggil (ألفاظ تكريم للمخاطَب). كالفرق بين «أنت» و«حضرتك»، لكنّ كلمات كثيرة تتغيّر هنا كليًّا لا الضمير وحده.
          en: Javanese has speech levels - ngoko (plain, for friends and juniors), krama (polite) and krama inggil (honorific words for the person you address). Like enta versus hadretak, except many whole words change, not just the pronoun.
      - speaker: Nadia
        text: Karim... "suatu hari" itu kapan?
        ar_eg: يا كريم... «في يوم» ده إمتى بالظبط؟
        ar: يا كريم... «يومًا ما» هذا متى بالضبط؟
        en: Karim... and when exactly is "one day"?
      - speaker: Karim
        text: Kantorku mungkin mengirim aku ke Indonesia awal tahun depan, untuk pameran wisata. Tapi jangan bilang Sari dulu. Ini rahasia.
        ar_eg: الشركة ممكن تبعتني إندونيسيا أول السنة الجاية، لمعرض سياحة. بس متقوليش لساري دلوقتي. ده سرّ.
        ar: ربما ترسلني شركتي إلى إندونيسيا مطلع العام القادم من أجل معرض سياحي. لكن لا تخبري ساري الآن. هذا سرّ.
        en: My office might send me to Indonesia early next year, for a travel fair. But don't tell Sari yet. It's a secret.
      - speaker: Nadia
        text: Rahasiamu aman bersamaku. Setidaknya sampai sarapan.
        ar_eg: سرّك في بير. على الأقل لحد الفطار.
        ar: سرّك في أمان معي. على الأقلّ حتى الإفطار.
        en: Your secret's safe with me. At least until breakfast.
      - speaker: Narrator
        text: 'Aplikasi di HP Karim berbunyi lagi: "Pengucapan Anda: enam puluh dua persen. Silakan coba lagi."'
        ar_eg: 'التطبيق اللي على موبايل كريم اتكلّم تاني: «نطقك: ٦٢ في المية. حاول تاني من فضلك».'
        ar: 'نطق التطبيق في هاتف كريم من جديد: «نطقك: اثنان وستون بالمئة. حاول مرّة أخرى من فضلك».'
        en: 'The app on Karim''s phone speaks again: "Your pronunciation: sixty-two per cent. Please try again."'
      - speaker: Karim
        text: Matur nuwun. Sugeng enjang, Pak Budi. Sugeng enjang...
        ar_eg: متشكّر. صباح الخير يا پاك بودي. صباح الخير...
        ar: شكرًا. صباح الخير يا باك بودي. صباح الخير...
        en: Thank you. Good morning, Pak Budi. Good morning...
