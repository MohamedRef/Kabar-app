questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي خضّ باك بودي؟
      ar: ما الذي أفزع باك بودي؟
      en: What gave Pak Budi a fright?
    options: ["Bu Sri tidak punya uang kecil.", "Kaleng biskuitnya kosong.", "HP Bayu rusak.", "Kotak hitam yang bisa bicara."]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Pelanggan cukup ___ kode ini pakai HP.
    meaning:
      ar_eg: الزبون بس يعمل سكان للكود ده بالموبايل.
      ar: يكفي أن يمسح الزبون هذا الرمز بهاتفه.
      en: Customers just scan this code with their phone.
    answers: [memindai]
    options: ["memindai", "menyimpan", "menukar"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه كريم مش عايز ساري تعرف دلوقتي في رأيك؟
      ar: في رأيك، لماذا لا يريد كريم أن تعرف ساري الآن؟
      en: Why do you think Karim doesn't want Sari to know yet?
    options: ["Karena dia malu nilainya hanya enam puluh dua persen.", "Karena dia ingin memberi kejutan dan belum yakin akan ke Indonesia.", "Karena Sari tidak suka bahasa Jawa.", "Karena Nadia akan marah."]
    answer: 1
  - id: q04
    type: listen
    text: Jangan pernah kasih PIN atau kode OTP ke siapa pun, walaupun orangnya ngaku dari bank.
    question:
      ar_eg: بايو بيقول إيه عن الـ PIN؟
      ar: ماذا يقول بايو عن الرقم السرّي؟
      en: What does Bayu say about the PIN?
    options: ["Boleh diberikan kepada pegawai bank.", "Jangan pernah diberikan kepada siapa pun.", "Harus ditulis di kaleng biskuit.", "Harus diganti setiap hari."]
    answer: 1
    meaning:
      ar_eg: عمرك ما تدّي الـ PIN أو كود الـ OTP لأي حدّ، حتى لو قال إنه من البنك.
      ar: لا تُعطِ رقمك السرّي أو رمز التحقّق لأيّ أحد أبدًا، حتى لو ادّعى أنّه من البنك.
      en: Never give your PIN or OTP code to anyone, even if they say they're from the bank.
  - id: q05
    type: translate
    direction: from_target
    source_text: Kemudahan boleh, tapi kehati-hatian tetap nomor satu.
    answers_meaning:
      ar_eg: ["السهولة ماشي، بس الحرص أولًا.", "السهولة حلوة، بس الحذر أهمّ حاجة.", "مفيش مشكلة في السهولة، بس الحرص رقم واحد."]
      ar: ["السهولة لا بأس بها، لكنّ الحذر أوّلًا.", "لا بأس بالسهولة، لكنّ الحيطة تبقى في المقام الأول.", "السهولة مقبولة، لكنّ الحذر هو الأهمّ."]
      en: ["Convenience is fine, but caution comes first.", "Convenience is fine, but caution is still number one.", "Ease is okay, but carefulness comes first."]
next:
  ar_eg: بايو داخل امتحان القبول في الجامعة، وساعة ما يختار التخصّص العيلة كلها هتتخانق. وفي القاهرة، نادية بقت «أستاذة» - بتدرّس عربي أونلاين لطلبة من بيسانترين في جاوة.
  ar: يدخل بايو امتحان القبول الجامعي، وحين يختار تخصّصه تتشاجر العائلة كلّها. وفي القاهرة تصبح نادية «أستاذة» - تدرّس العربية عبر الإنترنت لطلاب من معهد ديني في جاوة.
  en: Bayu sits his university entrance exam, and when it's time to choose a major, the whole family has a say. And in Cairo, Nadia becomes "Ustazah" - teaching Arabic online to students from a pesantren in Java.
