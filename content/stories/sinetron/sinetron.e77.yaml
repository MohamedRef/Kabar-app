next:
  ar_eg: كريم بيوصل الوارونج في ماديون. باك بودي، بو راهايو، بايو، ماس جوكو... وساري على الفيديو من القاهرة. بس الكل بيتكلّم جاوي!
  ar: يصل كريم إلى الوارونغ في ماديون. باك بودي وبو راهايو وبايو وماس جوكو... وساري على الفيديو من القاهرة. لكنّ الجميع يتكلّمون الجاوية!
  en: Karim arrives at the warung in Madiun. Pak Budi, Bu Rahayu, Bayu, Mas Joko... and Sari on video from Cairo. But everyone's speaking Javanese!
review:
  status: draft
  verified: false
  notes: Moved from Pasar Atom, Surabaya to Pasar Klithikan, Jogja (Cak Heru → Mas Heru), 2026-10-27; "diculke" now means "sold", as in the j1.u07 lessons. Prices are plausible for an old radio. Check "Isih urip" (still works) and "Madiun karo Jogja meh padha, kok".
