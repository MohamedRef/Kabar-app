      ar: كم دفع كريم في العلب الثلاث؟
      en: How much did Karim pay for the three boxes?
    options: ["satus ewu", "patang puluh ewu", "telung puluh lima ewu"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Wah, ___, Bu! Arp dicul piro?
    meaning:
      ar_eg: يا خبر، غالي يا مدام! هتسيبيها بكام؟
      ar: يا إلهي، غالية يا سيدتي! بكم ستبيعينها؟
      en: Wow, that's pricey, ma'am! How much will you let it go for?
    answers: [larang]
    options: ["larang", "murah", "apik"]
  - id: q03
