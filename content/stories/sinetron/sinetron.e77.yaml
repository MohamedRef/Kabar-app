language: jv
level: j1
unlock_after: j1.u07
title:
  target: Arp dicul piro?
  ar_eg: هتبيعه بكام؟
  ar: بكم ستبيعه؟
  en: How much are you selling it for?
summary:
  ar_eg: آخر يوم في جوجا. في باسار كليتيكان، سوق المستعمل، كريم بيدوّر على راديو قديم هديّة لباك بودي في ماديون، وهيرو بيعلّمه الأرقام وسرّ الفصال - «Arep diculke pira?». وفي محطة توجو، هيرو بيسيبله آخر درس في الكشكول.
  ar: آخر يوم في جوغجا. في سوق كليتيكان للمستعمل يبحث كريم عن راديو قديم هديّةً لباك بودي في ماديون، ويعلّمه هيرو الأرقام وسرّ المساومة - «Arep diculke pira؟». وفي محطة توغو يترك له هيرو آخر درس في الدفتر.
  en: The last day in Jogja. At Pasar Klithikan, the second-hand market, Karim hunts for an old radio as a gift for Pak Budi in Madiun, and Heru teaches him numbers and the secret of haggling - "Arep diculke pira?". At Tugu station, Heru leaves one last lesson in the notebook.
cast: [Karim, Mas Heru, Bakul]
scenes:
  - setting:
      ar_eg: باسار كليتيكان في باكونتشين، سوق مستعمل زحمة - موبايلات وكاميرات وعِدد وراديوهات قديمة. ستّ بتبيع راديوهات خشب على ترابيزة.
      ar: سوق كليتيكان في باكونتشين، سوق مستعمل مزدحم - هواتف وكاميرات وأدوات وأجهزة راديو قديمة. بائعة تعرض أجهزة راديو خشبية على طاولة.
      en: Pasar Klithikan in Pakuncen, a busy second-hand market - phones, cameras, tools and old radios. A woman sells wooden radios from a table.
    lines:
      - speaker: Karim
        text: Bu, radio iki arep diculke pira?
        ar_eg: يا مدام، الراديو ده هتبيعيه بكام؟
        ar: يا سيدتي، بكم ستبيعين هذا الراديو؟
        en: Ma'am, how much are you selling this radio for?
        note:
          ar_eg: diculke من ucul (يسيب). في سوق المستعمل معناها «يتباع» - arep diculke pira? = ناوي تبيعه بكام؟ وفي الشات بتتكتب «arp dicul piro?».
          ar: diculke من ucul (يترك). وفي سوق المستعمل تعني «يُباع» - arep diculke pira? = بكم ستبيعه؟ وفي الدردشة تُكتب «arp dicul piro?».
          en: diculke comes from ucul (let go). At a second-hand market it means "sold" - arep diculke pira? = how much are you selling it for? In chat it's written "arp dicul piro?".
      - speaker: Bakul
        text: Satus seket ewu, Mas. Isih urip, lho.
        ar_eg: بميّة وخمسين ألف يا أستاذ. لسّه شغّال على فكرة.
        ar: بمئة وخمسين ألفًا يا أستاذ. وما زال يعمل.
        en: A hundred and fifty thousand, Mas. It still works, you know.
        note:
          ar_eg: satus = ميّة، seket = خمسين، ewu = ألف. الأسعار في إندونيسيا بالآلاف، فهتسمع ewu كتير.
          ar: satus = مئة، seket = خمسون، ewu = ألف. الأسعار في إندونيسيا بالآلاف، فستسمع ewu كثيرًا.
          en: satus = a hundred, seket = fifty, ewu = thousand. Indonesian prices run in thousands, so you'll hear ewu a lot.
      - speaker: Mas Heru
        text: Wah, larang, Bu! Oleh kurang, ta?
        ar_eg: يا خبر، غالي يا مدام! ينفع تنزّلي، مش كده؟
        ar: يا إلهي، غالٍ يا سيدتي! يمكن أن تخفّضي، أليس كذلك؟
        en: Wow, that's pricey, ma'am! You can go lower, right?
        note:
          ar_eg: oleh kurang? = «ينفع أقلّ؟»، أسهل جملة فصال. وta في الآخر بتليّن السؤال.
          ar: oleh kurang? = «هل يمكن أقلّ؟»، أسهل جملة مساومة. وta في آخرها تليّن السؤال.
          en: oleh kurang? = "can it be less?", the easiest haggling line. ta at the end softens the question.
      - speaker: Bakul
        text: Satus telung puluh wis, Mas. Murah kuwi.
        ar_eg: ميّة وتلاتين وخلاص يا أستاذ. ده رخيص.
        ar: مئة وثلاثون وانتهينا يا أستاذ. هذا رخيص.
        en: A hundred and thirty then, Mas. That's cheap.
      - speaker: Karim
        text: Satus ewu wae, Bu. Aku tuku karo kasete loro.
        ar_eg: ميّة ألف بس يا مدام. وهاخد معاه شريطين كاسيت.
        ar: مئة ألف فقط يا سيدتي. وسآخذ معه شريطين.
        en: Just a hundred thousand, ma'am. And I'll take two of the cassettes with it.
      - speaker: Bakul
        text: Waduh! Mas iki pinter nawa. Ya wis, satus ewu. Laris!
        ar_eg: يا لهوي! الأستاذ ده شاطر في الفصال. خلاص، ميّة ألف. استفتاح!
        ar: يا للهول! هذا الأستاذ بارع في المساومة. حسنًا، مئة ألف. فاتحة خير!
        en: Oh my! This gentleman knows how to haggle. All right, a hundred thousand. Sold!
        note:
          ar_eg: ya wis = «خلاص، ماشي». وlaris = البيع ماشي، البيّاعين بيقولوها زي «استفتاح».
          ar: ya wis = «حسنًا، اتّفقنا». وlaris = البيع رائج، يقولها الباعة كأنّها «استفتاح».
          en: ya wis = "all right then". laris = selling well, sellers say it like a blessing on the sale.
  - setting:
      ar_eg: محطة توجو بالليل. القطر رايح ماديون. هيرو بياخد الكشكول من كريم ويكتب فيه.
      ar: محطة توغو ليلًا. القطار متّجه إلى ماديون. يأخذ هيرو الدفتر من كريم ويكتب فيه.
      en: Tugu station at night. The train is bound for Madiun. Heru takes Karim's notebook and writes in it.
    lines:
      - speaker: Mas Heru
        text: Neng Madiun, kowe arep nginep neng ndi?
        ar_eg: في ماديون، هتبات فين؟
        ar: في ماديون، أين ستبيت؟
        en: Where are you staying in Madiun?
        note:
          ar_eg: "كلمات: ndi = فين؛ nginep = يبات."
          ar: "مفردات: ndi = أين؛ nginep = يبيت."
          en: "Words: ndi = where; nginep = stay the night."
      - speaker: Karim
        text: Neng omahe Pak Budi. Dheweke kanca lawasku. Warunge pecel.
        ar_eg: في بيت باك بودي. ده صاحبي من زمان. عنده مطعم بيتشل.
        ar: في بيت باك بودي. إنه صديقي القديم. لديه مطعم بيتشل.
        en: At Pak Budi's house. He's an old friend of mine. He runs a pecel warung.
        note:
          ar_eg: "كلمات: pecel = بيتشل (خضار مسلوقة بصوص فول سوداني)."
          ar: "مفردات: pecel = بيتشل، خضار بصلصة الفول السوداني."
          en: "Words: pecel = pecel (boiled vegetables with peanut sauce)."
      - speaker: Mas Heru
        text: "Apik! Basa Madiun karo basa Jogja meh padha, kok."
        ar_eg: "حلو! جاوي ماديون وجاوي جوجا تقريبًا زي بعض."
        ar: "جميل! جاوية ماديون وجاوية جوغجا متقاربتان تقريبًا."
        en: "Nice! Madiun Javanese and Jogja Javanese are almost the same."
        note:
          ar_eg: "الاتنين جاوي «ماتارامان»، فاللي اتعلّمته في جوجا هينفعك في ماديون. كلمات: meh = تقريبًا؛ padha = زي بعض / نفس (= sama)."
          ar: "كلتاهما جاوية «ماتارامان»، فما تعلّمته في جوغجا ينفعك في ماديون. مفردات: meh = تقريبًا؛ padha = متساوٍ / نفس (= sama)."
          en: "Both are Mataraman Javanese, so what you learned in Jogja works in Madiun. Words: meh = almost; padha = same (= sama)."
      - speaker: Karim
        text: Matur nuwun, Mas. Kowe guru sing paling apik.
        ar_eg: متشكّر يا ماس. انت أحسن مدرّس.
        ar: شكرًا يا ماس. أنت أفضل معلّم.
        en: Thank you, Mas. You're the best teacher.
        note:
          ar_eg: "كلمات: paling = أكتر حاجة، الأـ (تفضيل)."
          ar: "مفردات: paling = الأكثر (للتفضيل)."
          en: "Words: paling = most, -est."
      - speaker: Mas Heru
        text: Aja lali, ya. Siji, loro, telu... lan "arp dicul piro?"
        ar_eg: ماتنساش، ماشي. واحد، اتنين، تلاتة... و«هتبيعه بكام؟»
        ar: لا تنسَ. واحد، اثنان، ثلاثة... و«بكم ستبيعه؟»
        en: Don't forget, okay. One, two, three... and "arp dicul piro?"
        note:
          ar_eg: "كلمات: aja = متـ… (نهي)؛ lali = ينسى."
          ar: "مفردات: aja = لا (الناهية)؛ lali = ينسى."
          en: "Words: aja = don't; lali = to forget (lupa)."
      - speaker: Narrator
        text: Kaca pitu. Tulisane Mas Heru, "Jogja wis rampung. Madiun, enteni!"
        ar_eg: صفحة سبعة. بخطّ ماس هيرو، «جوجا خلصت. ماديون، استنّي!»
        ar: الصفحة السابعة. بخطّ ماس هيرو، «انتهت جوغجا. ماديون، انتظري!»
        en: Page seven. In Mas Heru's handwriting, "Jogja's done. Madiun, here we come!"
        note:
          ar_eg: "كلمات: enteni = استنى!؛ kaca = صفحة."
          ar: "مفردات: enteni = انتظر!؛ kaca = صفحة."
          en: "Words: enteni = wait for (someone)! (tunggu); kaca = page (of a book)."
