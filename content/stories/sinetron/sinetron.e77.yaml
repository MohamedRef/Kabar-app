language: jv
level: j1
unlock_after: j1.u07
title:
  target: Arp dicul piro?
  ar_eg: هتسيبها بكام؟
  ar: بكم ستبيعها؟
  en: How much will you let it go for?
summary:
  ar_eg: آخر يوم في سورابايا. في سوق أتوم، كريم بيشتري هدايا لعيلة صاحبه پاك بودي في ماديون، وهيرو بيعلّمه الأرقام وسرّ الفصال - «Diculke pira?». وفي المحطة، هيرو بيسيبله آخر درس في الكشكول.
  ar: آخر يوم في سورابايا. في سوق أتوم يشتري كريم هدايا لعائلة صديقه باك بودي في ماديون، ويعلّمه هيرو الأرقام وسرّ المساومة - «Diculke pira؟». وفي المحطة يترك له هيرو آخر درس في الدفتر.
  en: The last day in Surabaya. At Pasar Atom, Karim buys gifts for his friend Pak Budi's family in Madiun, and Heru teaches him numbers and the secret of haggling - "Diculke pira?". At the station, Heru leaves one last lesson in the notebook.
cast: [Karim, Cak Heru, Bakul]
scenes:
  - setting:
      ar_eg: سوق أتوم، سوق كبير مقفول في سورابايا، مليان هدوم وحلويات وهدايا. بيّاعة ست قدّامها علب حلويات.
      ar: سوق أتوم، سوق كبير مغطّى في سورابايا، مليء بالملابس والحلويات والهدايا. بائعة أمامها علب حلويات.
      en: Pasar Atom, a big indoor market in Surabaya full of clothes, snacks and souvenirs. A woman sells boxes of sweets.
    lines:
      - speaker: Karim
        text: Bu, iki pira?
        ar_eg: يا مدام، دي بكام؟
        ar: يا سيدتي، بكم هذه؟
        en: Ma'am, how much is this?
      - speaker: Bakul
        text: Siji patang puluh ewu, Mas.
        ar_eg: الواحدة بأربعين ألف يا أستاذ.
        ar: الواحدة بأربعين ألفًا يا أستاذ.
        en: Forty thousand each, Mas.
        note:
          ar_eg: الأرقام بالجاوي - siji، loro، telu، papat، lima، enem، pitu، wolu، sanga، sepuluh. وpatang puluh = أربعين، وewu = ألف.
          ar: الأرقام بالجاوية - siji، loro، telu، papat، lima، enem، pitu، wolu، sanga، sepuluh. وpatang puluh = أربعون، وewu = ألف.
          en: Javanese numbers - siji, loro, telu, papat, lima, enem, pitu, wolu, sanga, sepuluh. patang puluh = forty, ewu = thousand.
      - speaker: Cak Heru
        text: Wah, larang, Bu! Arp dicul piro?
        ar_eg: يا خبر، غالي يا مدام! هتسيبيها بكام؟
        ar: يا إلهي، غالية يا سيدتي! بكم ستبيعينها؟
        en: Wow, that's pricey, ma'am! How much will you let it go for?
        note:
          ar_eg: arp dicul piro = arep diculke pira، حرفيًا «هتتساب بكام؟». ده أشهر سؤال فصال في جاوة الشرقية. والإضافة -ke/-ake بتعمل فعل «خلّى حاجة تحصل» - culke = «سيبها».
          ar: arp dicul piro = arep diculke pira، حرفيًّا «بكم ستُترك؟». وهو أشهر سؤال مساومة في جاوة الشرقية. واللاحقة -ke/-ake تصنع فعلًا سببيًّا - culke = «اتركها».
          en: arp dicul piro = arep diculke pira, literally "how much will it be released for?" - East Java's classic haggling question. The -ke/-ake suffix makes "cause to" verbs - culke = "let it go".
      - speaker: Bakul
        text: Telung puluh lima ewu wis, Mas. Murah iku.
        ar_eg: خمسة وتلاتين ألف وخلاص يا أستاذ. ده رخيص.
        ar: خمسة وثلاثون ألفًا وانتهينا يا أستاذ. هذا رخيص.
        en: Thirty-five thousand then, Mas. That's cheap.
      - speaker: Karim
        text: Tak tuku telu. Diculke satus ewu, Bu?
        ar_eg: هشتري تلاتة. تسيبيهم بمية ألف يا مدام؟
        ar: سأشتري ثلاثًا. أتبيعينها بمئة ألف يا سيدتي؟
        en: I'll buy three. Let them go for a hundred thousand, ma'am?
      - speaker: Bakul
        text: Waduh! Mas iki pinter. Oke, satus ewu.
        ar_eg: يا لهوي! الأستاذ ده شاطر. ماشي، مية ألف.
        ar: يا للهول! هذا الأستاذ ذكيّ. حسنًا، مئة ألف.
        en: Oh my! This gentleman's clever. Okay, a hundred thousand.
        note:
          ar_eg: satus = مية، sewu = ألف، sejuta = مليون. الأسعار في إندونيسيا بالآلاف، فهتسمع ewu كتير.
          ar: satus = مئة، sewu = ألف، sejuta = مليون. الأسعار في إندونيسيا بالآلاف، فستسمع ewu كثيرًا.
          en: satus = a hundred, sewu = a thousand, sejuta = a million. Indonesian prices run in thousands, so you'll hear ewu a lot.
  - setting:
      ar_eg: محطة جوبينج بالليل. القطر رايح ماديون. هيرو بياخد الكشكول من كريم ويكتب فيه.
      ar: محطة غوبينغ ليلًا. القطار متّجه إلى ماديون. يأخذ هيرو الدفتر من كريم ويكتب فيه.
      en: Gubeng station at night. The train is bound for Madiun. Heru takes Karim's notebook and writes in it.
    lines:
      - speaker: Cak Heru
        text: Nang Madiun, koen arep nginep nang endi?
        ar_eg: في ماديون، هتبات فين؟
        ar: في ماديون، أين ستبيت؟
        en: Where are you staying in Madiun?
      - speaker: Karim
        text: Nang omahe Pak Budi. Dheweke kanca lawasku. Warunge pecel.
        ar_eg: في بيت پاك بودي. ده صاحبي من زمان. عنده مطعم پيچل.
        ar: في بيت باك بودي. إنه صديقي القديم. لديه مطعم بيتشل.
        en: At Pak Budi's house. He's an old friend of mine. He runs a pecel warung.
      - speaker: Cak Heru
        text: Apik! Nanging ati-ati, rek. Nang Madiun wong ngomong alon. Ojok kesusu kaya arek Suroboyo.
        ar_eg: حلو! بس خلّي بالك يا صاحبي. في ماديون الناس بتتكلّم براحة. ماتستعجلش زي ولاد سورابايا.
        ar: جميل! لكن انتبه يا صديقي. في ماديون يتكلّم الناس ببطء. لا تستعجل مثل أبناء سورابايا.
        en: Nice! But careful, mate. In Madiun people speak slowly. Don't rush like Surabaya kids.
      - speaker: Karim
        text: Matur nuwun, Cak. Kowe guru sing paling apik.
        ar_eg: متشكّر يا تشاك. انت أحسن مدرّس.
        ar: شكرًا يا تشاك. أنت أفضل معلّم.
        en: Thank you, Cak. You're the best teacher.
      - speaker: Cak Heru
        text: Ojok lali, rek. Siji, loro, telu... lan "arp dicul piro?"
        ar_eg: ماتنساش يا صاحبي. واحد، اتنين، تلاتة... و«هتسيبها بكام؟»
        ar: لا تنسَ يا صديقي. واحد، اثنان، ثلاثة... و«بكم ستبيعها؟»
        en: Don't forget, mate. One, two, three... and "arp dicul piro?"
      - speaker: Narrator
        text: Kaca pitu. Tulisane Cak Heru, "Suroboyo wis rampung. Madiun, enteni!"
        ar_eg: صفحة سبعة. بخطّ تشاك هيرو، «سورابايا خلصت. ماديون، استنّي!»
        ar: الصفحة السابعة. بخطّ تشاك هيرو، «انتهت سورابايا. ماديون، انتظري!»
        en: Page seven. In Cak Heru's handwriting, "Surabaya's done. Madiun, here we come!"
