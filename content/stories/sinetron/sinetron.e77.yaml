      ar_eg: كريم هيبات فين في ماديون؟
      ar: أين سيبيت كريم في ماديون؟
      en: Where will Karim stay in Madiun?
    options: ["nang hotel", "nang omahe Pak Budi", "nang omahe Cak Heru"]
