language: id
level: bipa4
unlock_after: bipa4.u01
title:
  target: Koki atau Wartawan?
  ar_eg: طبّاخ ولا صحفي؟
  ar: طاهٍ أم صحفي؟
  en: Chef or Journalist?
summary:
  ar_eg: بايو لازم يكتب موضوع تعبير عن الشغلانة اللي بيحلم بيها، ومحتار بين الطبخ والصحافة. وفي القاهرة، كريم بيقود أول مجموعة إندونيسية في شغله الجديد... وواحدة من المجموعة تاهت في خان الخليلي.
  ar: على بايو أن يكتب مقالًا عن المهنة التي يحلم بها، وهو حائر بين الطهي والصحافة. وفي القاهرة يقود كريم أول مجموعة إندونيسية في عمله الجديد... وتتخلّف إحدى السائحات في خان الخليلي.
  en: Bayu has to write an essay about his dream job, and he can't choose between cooking and journalism. In Cairo, Karim leads his first Indonesian tour group... and one of them goes missing in Khan el-Khalili.
cast: [Bayu, Pak Budi, Bu Rahayu, Mas Joko, Karim, Sari, Bu Ani]
scenes:
  - setting:
      ar_eg: ماديون، بالليل بعد ما الوارونج قفل. بايو قاعد قدّام اللابتوب ووشّه محتار. ماس جوكو لسه بيخلّص قهوته.
      ar: ماديون، ليلًا بعد إغلاق الوارونغ. يجلس بايو أمام الحاسوب المحمول وعلى وجهه الحيرة، وماس جوكو ما زال ينهي قهوته.
      en: Madiun, at night after the warung has closed. Bayu sits at the laptop looking lost. Mas Joko is still finishing his coffee.
    lines:
      - speaker: Narrator
        text: Madiun. Warung sudah tutup, tapi lampu dapur masih menyala.
        ar_eg: ماديون. الوارونج قفل، بس نور المطبخ لسه منوّر.
        ar: ماديون. أُغلق الوارونغ، لكن ضوء المطبخ ما زال مضاءً.
        en: Madiun. The warung is closed, but the kitchen light is still on.
      - speaker: Bayu
        text: Pak, Bu, guru BK nyuruh kita nulis teks eksposisi tentang profesi impian. Besok harus dikumpulin!
        ar_eg: بابا، ماما، مدرّس الإرشاد قال لنا نكتب موضوع عن الشغلانة اللي بنحلم بيها. ولازم يتسلّم بكرة!
        ar: أبي، أمي، طلب منّا المرشد المدرسي أن نكتب نصًّا تفسيريًّا عن مهنة الأحلام، ويجب تسليمه غدًا!
        en: Dad, Mum, the guidance teacher told us to write an exposition about our dream job. It's due tomorrow!
        note:
          ar_eg: guru BK (bimbingan konseling) هو المرشد في المدرسة الثانوي اللي بيساعد الطلبة يختاروا الكلية والشغلانة. وteks eksposisi موضوع بيعرض رأي ويدافع عنه بحجج. وفي الكلام - nyuruh = menyuruh، nulis = menulis، dikumpulin = dikumpulkan (الناس بتشيل me- وبتقول -in بدل -kan).
          ar: guru BK (bimbingan konseling) هو المرشد في المدرسة الثانوية الذي يساعد الطلاب على اختيار التخصّص والمهنة. وteks eksposisi نصّ يعرض رأيًا ويدعمه بالحجج. وفي الكلام اليومي - nyuruh = menyuruh، nulis = menulis، dikumpulin = dikumpulkan (تُحذف me- وتحلّ -in محلّ -kan).
          en: The guru BK (bimbingan konseling, "guidance and counselling") is the school counsellor who helps students choose a course and a career. A teks eksposisi states a view and argues for it. In speech, nyuruh = menyuruh, nulis = menulis, dikumpulin = dikumpulkan (me- drops, -in replaces -kan).
      - speaker: Pak Budi
        text: Gampang! Jadi koki aja. Kolakmu waktu Ramadan kan terkenal di seluruh gang.
        ar_eg: سهلة! اشتغل طبّاخ وخلاص. الكولاك بتاعك في رمضان بقى مشهور في الحارة كلها.
        ar: سهل! كن طاهيًا. فالكولاك الذي صنعته في رمضان اشتهر في الزقاق كلّه.
        en: Easy! Be a chef. Your kolak last Ramadan is famous all over the lane.
      - speaker: Bu Rahayu
        text: Jangan dipaksa, Pak. Bayu kan pintar menulis. Suratnya ke kelurahan itu bagus banget. Jadi wartawan aja, Le.
        ar_eg: متغصبش عليه يا بودي. بايو شاطر في الكتابة. الجواب اللي بعته للحيّ كان حلو أوي. اشتغل صحفي يا ابني.
        ar: لا تُجبره يا باك. فبايو بارع في الكتابة، ورسالته إلى مكتب الحيّ كانت رائعة. كن صحفيًّا يا بنيّ.
        en: Don't push him, Pak. Bayu's good at writing, you know. His letter to the kelurahan was excellent. Be a journalist, son.
      - speaker: Bayu
        text: Itu dia masalahnya, Bu. Aku suka dua-duanya. Koki butuh keahlian sama kesabaran. Wartawan butuh keberanian sama kejujuran.
        ar_eg: هي دي المشكلة يا ماما. أنا بحبّ الاتنين. الطبّاخ محتاج مهارة وصبر. والصحفي محتاج شجاعة وأمانة.
        ar: هذه هي المشكلة يا أمي. أحبّ الاثنين. الطاهي يحتاج إلى المهارة والصبر، والصحفي يحتاج إلى الشجاعة والصدق.
        en: That's the problem, Mum. I like both. A chef needs skill and patience. A journalist needs courage and honesty.
        note:
          ar_eg: ke-…-an بتعمل أسماء معنى من الصفات - ahli → keahlian (مهارة)، sabar → kesabaran (صبر)، berani → keberanian (شجاعة). وahli وsabar أصلهم عربي - «أهل» و«صبر». وbutuh = perlu (محتاج)، وsama هنا = dan (و) في الكلام.
          ar: تصوغ ke-…-an أسماء المعاني من الصفات - ahli ← keahlian (المهارة)، sabar ← kesabaran (الصبر)، berani ← keberanian (الشجاعة). وأصل ahli وsabar عربي - «أهل» و«صبر». وbutuh = perlu (يحتاج)، وsama هنا = dan (و) في الكلام اليومي.
          en: ke-…-an turns adjectives into abstract nouns - ahli → keahlian (skill), sabar → kesabaran (patience), berani → keberanian (courage). ahli and sabar come from Arabic أهل and صبر. butuh = perlu (need); sama here = dan (and) in everyday speech.
      - speaker: Mas Joko
        text: Dua-duanya capek, Bay. Koki kepanasan di dapur, wartawan kehujanan di jalan!
        ar_eg: الاتنين متعبين يا باي. الطبّاخ بيتحرّ في المطبخ، والصحفي بيتبلّ من المطر في الشارع!
        ar: كلاهما متعب يا باي. الطاهي يعاني الحرّ في المطبخ، والصحفي يبلّله المطر في الشارع!
        en: Both are hard work, Bay. A chef gets cooked in the kitchen, a journalist gets rained on in the street!
        note:
          ar_eg: ke-…-an على صفة أو اسم ممكن كمان توصف حاجة وحشة حصلتلك غصب عنك - kepanasan (اتحرّيت)، kehujanan (المطر نزل عليّا)، kesiangan (صحيت متأخّر).
          ar: وقد تصف ke-…-an أيضًا أمرًا سيئًا أصابك رغمًا عنك - kepanasan (أصابني الحرّ)، kehujanan (أصابني المطر)، kesiangan (استيقظت متأخرًا).
          en: ke-…-an can also describe something bad that happened to you - kepanasan (suffering from the heat), kehujanan (caught in the rain), kesiangan (oversleeping).
      - speaker: Pak Budi
        text: Betul itu. Bapak tiap hari kepanasan di dapur. Tapi Bapak senang kok.
        ar_eg: صح. أنا كل يوم بتحرّ في المطبخ. بس مبسوط.
        ar: صحيح. يصيبني الحرّ في المطبخ كلّ يوم، لكنني سعيد.
        en: True. I roast in that kitchen every day. But I'm happy.
      - speaker: Bayu
        text: Terus aku harus pilih yang mana dong?
        ar_eg: طب أختار أنهي فيهم؟
        ar: إذن أيّهما أختار؟
        en: So which one am I supposed to choose?
      - speaker: Bu Rahayu
        text: Ya tulis aja dua-duanya, kelebihan sama kekurangannya. Teks eksposisi kan gitu.
        ar_eg: اكتب عن الاتنين وخلاص، المميزات والعيوب. ما هو موضوع التعبير ده كده.
        ar: اكتب عن الاثنين، المزايا والعيوب. أليس النصّ التفسيري هكذا؟
        en: Just write about both, the pros and the cons. That's what an exposition is, isn't it?
        note:
          ar_eg: gitu = begitu (كده)، aja = saja (بس، وخلاص) - كلام كل يوم.
          ar: gitu = begitu (هكذا)، aja = saja (فقط) - في الكلام اليومي.
          en: gitu = begitu (like that), aja = saja (just) - everyday speech.
      - speaker: Bayu
        text: Ide bagus, Bu! Aduh, udah jam sebelas. Besok aku pasti kesiangan!
        ar_eg: فكرة حلوة يا ماما! يا خبر، الساعة بقت ١١. بكرة أكيد هصحى متأخّر!
        ar: فكرة جيدة يا أمي! يا إلهي، صارت الساعة الحادية عشرة. سأستيقظ متأخرًا غدًا بالتأكيد!
        en: Good idea, Mum! Oh no, it's eleven already. I'm definitely going to oversleep tomorrow!
        note:
          ar_eg: udah = sudah (خلاص، بقى) - كلام كل يوم. pasti = أكيد.
          ar: udah = sudah (قد، صار) - في الكلام اليومي. pasti = بالتأكيد.
          en: udah = sudah (already) - everyday speech. pasti = definitely.
  - setting:
      ar_eg: القاهرة، خان الخليلي، الضهر والدنيا حرّ. بعد العقد والتدريب، كريم بيقود أول مجموعة في شغلانته الجديدة - إندونيسيين جايين عمرة وزيارة لمصر.
      ar: القاهرة، خان الخليلي، وقت الظهر والجوّ حارّ. بعد توقيع العقد والتدريب يقود كريم أول مجموعة في عمله الجديد، إندونيسيين جاؤوا للعمرة ثم زيارة مصر.
      en: Cairo, Khan el-Khalili, midday heat. After his contract and his guide training, Karim is leading his very first group - Indonesians on an umrah-plus-Egypt trip.
    lines:
      - speaker: Karim
        text: Bapak-Ibu, pasar ini sudah ada sejak abad keempat belas. Jalannya sempit dan ramai, jadi jangan berpencar, ya!
        ar_eg: يا جماعة، السوق ده موجود من القرن الرابع عشر. الشوارع ضيّقة وزحمة، فمحدّش يبعد عن المجموعة، ماشي؟
        ar: أيّها السادة والسيدات، هذا السوق قائم منذ القرن الرابع عشر. شوارعه ضيقة ومزدحمة، فلا تتفرّقوا من فضلكم!
        en: Ladies and gentlemen, this market has been here since the fourteenth century. The lanes are narrow and busy, so please don't split up!
        note:
          ar_eg: خان الخليلي اتسمّى على اسم الأمير المملوكي الخليلي اللي بنى الخان في أواخر القرن ١٤. ومجموعات «عمرة بلس» اللي بتزور مصر بعد مكة حاجة مشهورة عند الإندونيسيين.
          ar: سُمّي خان الخليلي باسم الأمير المملوكي الخليلي الذي بنى الخان في أواخر القرن الرابع عشر. ورحلات «العمرة بلس» التي تزور مصر بعد مكة شائعة بين الإندونيسيين.
          en: Khan el-Khalili is named after the Mamluk emir al-Khalili, who built the khan in the late 14th century. "Umrah plus" tours that add Egypt after Mecca are popular with Indonesians.
      - speaker: Narrator
        text: Satu jam kemudian, Karim menghitung rombongan pertamanya. Enam belas, tujuh belas, delapan belas, sembilan belas...
        ar_eg: بعد ساعة، كريم بيعدّ أول مجموعة ليه. ستاشر، سبعتاشر، تمنتاشر، تسعتاشر...
        ar: بعد ساعة، يعدّ كريم أفراد مجموعته الأولى. ستة عشر، سبعة عشر، ثمانية عشر، تسعة عشر...
        en: An hour later, Karim counts his first-ever group. Sixteen, seventeen, eighteen, nineteen...
      - speaker: Karim
        text: Lho, kok sembilan belas? Harusnya dua puluh. Ada yang tertinggal!
        ar_eg: إيه ده، تسعتاشر بس؟ المفروض عشرين. فيه حدّ اتنسى ورا!
        ar: ماذا؟ تسعة عشر فقط؟ يُفترض أن يكونوا عشرين. هناك من تخلّف!
        en: Hang on, nineteen? It should be twenty. Someone's been left behind!
        note:
          ar_eg: ter- كتير بتوصف حاجة حصلت من غير قصد - tertinggal (اتساب ورا)، tertidur (نام من غير ما ياخد باله)، tersesat (تاه).
          ar: كثيرًا ما تصف ter- أمرًا حدث دون قصد - tertinggal (تخلّف عن غير قصد)، tertidur (غلبه النوم)، tersesat (ضلّ الطريق).
          en: ter- often marks something that happens by accident - tertinggal (left behind), tertidur (dozed off), tersesat (got lost).
      - speaker: Narrator
        text: Karim menelepon Sari. Dulu Sari juga pernah menjadi pemandu wisata.
        ar_eg: كريم كلّم ساري. ساري كمان اشتغلت مرشدة سياحية قبل كده.
        ar: يتّصل كريم بساري، فقد عملت ساري هي الأخرى مرشدة سياحية من قبل.
        en: Karim phones Sari. Sari used to work as a tour guide too.
      - speaker: Sari
        text: Tenang aja, Karim. Ibu-ibu biasanya nggak tersesat kok. Mereka cuma terlalu asyik nawar!
        ar_eg: اهدى يا كريم. الستات عادةً مبيتوهوش. هما بس بيبقوا مندمجين في الفصال!
        ar: اهدأ يا كريم. السيدات عادةً لا يضللن الطريق، بل ينشغلن بالمساومة أكثر من اللازم!
        en: Relax, Karim. The ladies don't usually get lost. They just get carried away haggling!
        note:
          ar_eg: nawar = menawar (يفاصل) - كلام كل يوم. cuma = بس، وasyik = مندمج، مبسوط.
          ar: nawar = menawar (يساوم) في الكلام اليومي. cuma = فقط، وasyik = منهمك، مستمتع.
          en: nawar = menawar (to haggle) in everyday speech. cuma = only, just; asyik = absorbed, having fun.
      - speaker: Narrator
        text: Sari benar. Bu Ani ada di toko lampu. Dia sedang menawar tiga lampu gantung tembaga.
        ar_eg: ساري كان عندها حق. بو آني كانت في محلّ فوانيس، بتفاصل على تلات فوانيس نحاس معلّقة.
        ar: كانت ساري محقّة. كانت بو آني في متجر للمصابيح تساوم على ثلاثة مصابيح نحاسية معلّقة.
        en: Sari was right. Bu Ani is in a lamp shop, haggling over three hanging copper lamps.
      - speaker: Bu Ani
        text: Aduh, maaf, Mas Karim! Saya nggak sengaja. Lampunya cantik banget, saya sampai lupa waktu.
        ar_eg: يا خبر، آسفة يا ماس كريم! مكانش قصدي. الفوانيس حلوة أوي، نسيت الوقت خالص.
        ar: آه، آسفة يا ماس كريم! لم أقصد ذلك. المصابيح جميلة جدًّا حتى إنني نسيت الوقت.
        en: Oh dear, sorry, Mas Karim! I didn't mean to. The lamps are so pretty, I completely lost track of time.
      - speaker: Karim
        text: Nggak apa-apa, Bu. Tapi ayo cepat, nanti kita ketinggalan bus!
        ar_eg: ولا يهمّك يا بو. بس يلا بسرعة، لحسن الأتوبيس يفوتنا!
        ar: لا بأس يا بو. لكن هيّا بسرعة، وإلّا فاتتنا الحافلة!
        en: No problem, Bu. But let's hurry, or we'll miss the bus!
        note:
          ar_eg: ketinggalan يعني «فاتني» (الأتوبيس، القطر). وtertinggal يعني «اتساب ورا». الاتنين من tinggal.
          ar: ketinggalan تعني «فاتني» (الحافلة أو القطار)، وtertinggal تعني «تُرك متخلّفًا». وكلتاهما من tinggal.
          en: ketinggalan means "to miss" (a bus, a train); tertinggal means "left behind". Both come from tinggal.
      - speaker: Sari
        text: Nah, sekarang kamu tahu sendiri kan. Pemandu wisata harus sabar banget!
        ar_eg: أهو، دلوقتي عرفت بنفسك. المرشد السياحي لازم يكون صبور أوي!
        ar: ها أنت الآن تعرف بنفسك. على المرشد السياحي أن يكون صبورًا جدًّا!
        en: See, now you know for yourself. A tour guide has to be really patient!
      - speaker: Karim
        text: Iya. Bilang ke Bayu ya, pemandu juga butuh dua-duanya. Pintar cerita, sama tahu tempat makan yang enak!
        ar_eg: صح. قولي لبايو إن المرشد كمان محتاج الاتنين. يعرف يحكي حكايات، ويعرف أماكن الأكل الحلوة!
        ar: صحيح. قولي لبايو إنّ المرشد يحتاج إلى الاثنين أيضًا، أن يُحسن الحكي، وأن يعرف أين الطعام اللذيذ!
        en: True. Tell Bayu a guide needs both, too. Good at telling stories, and knows where the good food is!
        note:
          ar_eg: bilang = berkata، mengatakan (يقول) - كلام كل يوم. وbutuh = perlu (محتاج).
          ar: bilang = berkata، mengatakan (قال) في الكلام اليومي. وbutuh = perlu (يحتاج).
          en: bilang = berkata, mengatakan (say, tell) - everyday speech. butuh = perlu (need).
