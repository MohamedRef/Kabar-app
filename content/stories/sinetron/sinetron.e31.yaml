questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: مدرّس الإرشاد طلب من بايو يكتب إيه؟
      ar: ماذا طلب المرشد المدرسي من بايو أن يكتب؟
      en: What does the guidance teacher ask Bayu to write?
    options: ["surat ke kelurahan", "resep kolak", "teks eksposisi tentang profesi impian", "berita tentang Kairo"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Koki kepanasan di dapur, wartawan ___ di jalan!
    meaning:
      ar_eg: الطبّاخ بيتحرّ في المطبخ، والصحفي بيتبلّ من المطر في الشارع!
      ar: الطاهي يعاني الحرّ في المطبخ، والصحفي يبلّله المطر في الشارع!
      en: A chef gets cooked in the kitchen, a journalist gets rained on in the street!
    answers: [kehujanan]
    options: ["kesiangan", "kehujanan", "ketinggalan"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه كريم عدّ تسعتاشر بس؟
      ar: لماذا عدّ كريم تسعة عشر فقط؟
      en: Why does Karim only count nineteen?
    options: ["Satu orang tertinggal di toko lampu.", "Satu orang sakit di hotel.", "Bus sudah berangkat."]
    answer: 0
  - id: q04
    type: listen
    text: Ibu-ibu biasanya nggak tersesat kok. Mereka cuma terlalu asyik nawar!
    question:
      ar_eg: حسب كلام ساري، الستات بيتأخّروا ليه؟
      ar: بحسب ساري، لماذا تتأخّر السيدات؟
      en: According to Sari, why do the ladies go missing?
    options: ["Mereka tersesat.", "Mereka ketinggalan bus.", "Mereka tertidur.", "Mereka asyik menawar."]
    answer: 3
    meaning:
      ar_eg: الستات عادةً مبيتوهوش. هما بس بيبقوا مندمجين في الفصال!
      ar: السيدات عادةً لا يضللن الطريق، بل ينشغلن بالمساومة!
      en: The ladies don't usually get lost. They just get carried away haggling!
