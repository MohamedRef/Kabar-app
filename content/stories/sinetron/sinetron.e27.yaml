questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: كارتيني اتولدت إمتى؟
      ar: متى وُلدت كارتيني؟
      en: When was Kartini born?
    options: ["17 Agustus 1945", "10 November 1945", "1 Januari 1911", "21 April 1879"]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Pada tahun 1923, Persatuan Feminis Mesir didirikan ___ Huda Sya'rawi.
    meaning:
      ar_eg: سنة ١٩٢٣، الاتحاد النسائي المصري اتأسّس على إيد هدى شعراوي.
      ar: في عام ١٩٢٣ أُسّس الاتحاد النسائي المصري على يد هدى شعراوي.
      en: In 1923, the Egyptian Feminist Union was founded by Huda Sha'arawi.
    answers: [oleh]
    options: ["untuk", "oleh", "kepada"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: مين بطل پاك بودي؟
      ar: من بطل باك بودي؟
      en: Who is Pak Budi's hero?
    options: ["Bu Rahayu", "Bung Tomo", "Pangeran Diponegoro"]
    answer: 0
  - id: q04
    type: listen
    text: Hmm... bab pertamanya udah aku baca, kok.
    question:
      ar_eg: بايو قرا قد إيه من كتاب كارتيني؟
      ar: كم قرأ بايو من كتاب كارتيني؟
      en: How much of Kartini's book has Bayu read?
    options: ["semua bab", "belum sama sekali", "bab pertama saja"]
    answer: 2
    meaning:
      ar_eg: اممم... الفصل الأول قريته.
      ar: همم... قرأت الفصل الأول.
      en: Hmm... the first chapter, I've read.
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الكتاب ده أنا قريته.
      ar: هذا الكتاب قرأته.
      en: I have read that book.
    answers: ["Buku itu udah aku baca.", "Buku itu udah aku baca", "Buku itu udah saya baca.", "Buku itu sudah saya baca.", "Buku itu sudah saya baca", "Buku ini sudah saya baca.", "Buku itu saya baca.", "Saya sudah membaca buku itu.", "Saya sudah membaca buku itu", "Saya sudah membaca buku ini.", "Aku sudah membaca buku itu.", "Buku itu sudah kubaca.", "Buku itu telah saya baca."]
next:
  ar_eg: المطر نازل جامد على ماديون، والمية دخلت الحارة. ومن غير ما حدّ يخطّط، الوارونج بقى مطبخ لكل الجيران. وفي القاهرة… السما بقت صفرا.
  ar: تهطل أمطار غزيرة على ماديون ويدخل الماء إلى الزقاق. ودون تخطيط يصبح الوارونغ مطبخًا لكل الجيران. وفي القاهرة… صارت السماء صفراء.
  en: Heavy rain pours down on Madiun and the lane floods. Without anyone planning it, the warung becomes a kitchen for the whole street. And in Cairo… the sky has turned yellow.
