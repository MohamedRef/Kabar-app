title:
  target: Pahlawan di Rumah Kami
  ar_eg: البطلة اللي في بيتنا
  ar: البطلة في بيتنا
  en: The Hero in Our House
summary:
  ar_eg: بايو بيقدّم بحث المدرسة عن كارتيني، ونادية بتقارنها بهدى شعراوي - والاتنين اتولدوا سنة ١٨٧٩. وبعدين پاك بودي بيعلن مين البطل بتاعه هو.
  ar: يقدّم بايو بحثه المدرسي عن كارتيني، وتقارنها نادية بهدى شعراوي - وقد وُلدت الاثنتان عام ١٨٧٩. ثم يعلن باك بودي من بطله هو.
  en: Bayu presents his school project on Kartini, and Nadia compares her with Huda Sha'arawi — both born in 1879. Then Pak Budi announces who his own hero is.
cast: [Bayu, Pak Budi, Bu Rahayu, Nadia, Sari]
scenes:
  - setting:
      ar_eg: ماديون، الأوضة القدّامية بالليل. بايو بيتمرّن على البحث بتاعه قدّام العيلة وقدّام القاهرة على الفيديو.
      ar: ماديون، غرفة الضيوف ليلًا. يتدرّب بايو على عرض بحثه أمام العائلة وأمام القاهرة عبر الاتصال المرئي.
      en: Madiun, the front room at night. Bayu rehearses his project in front of the family — and Cairo, on video.
    lines:
      - speaker: Bayu
        text: Pahlawan saya adalah Raden Ajeng Kartini. Kartini lahir di Jepara pada tanggal 21 April 1879.
        ar_eg: البطلة بتاعتي هي رادين أجينج كارتيني. كارتيني اتولدت في جيبارا يوم ٢١ أبريل ١٨٧٩.
        ar: بطلتي هي رادين أجنغ كارتيني. وُلدت كارتيني في جيبارا في ٢١ أبريل ١٨٧٩.
        en: My hero is Raden Ajeng Kartini. Kartini was born in Jepara on 21 April 1879.
        note:
          ar_eg: lahir (يتولد) جاية من العربي «ظاهر» - نفس الكلمة اللي في «lahir dan batin». ويوم ميلاد كارتيني، ٢١ أبريل، اسمه Hari Kartini، والبنات في المدارس بيلبسوا فيه الكبايا.
          ar: lahir (وُلد) من العربية «ظاهر» - وهي الكلمة نفسها في «lahir dan batin». ويوم ميلاد كارتيني، ٢١ أبريل، يسمّى Hari Kartini، وتلبس فيه الطالبات الكبايا.
          en: lahir (to be born) comes from Arabic ظاهر (to appear) — the same word as in "lahir dan batin". Kartini's birthday, 21 April, is Hari Kartini, when schoolgirls wear the kebaya.
      - speaker: Bayu
        text: Pada zaman itu, anak perempuan tidak boleh sekolah tinggi. Kartini dipingit di rumah.
        ar_eg: في الزمن ده، البنات مكانش مسموح لهم يكمّلوا تعليمهم. وكارتيني اتقفل عليها في البيت.
        ar: في ذلك الزمن لم يكن يُسمح للبنات بمواصلة التعليم، وحُبست كارتيني في البيت.
        en: In those days, girls weren't allowed to stay on at school. Kartini was kept secluded at home.
        note:
          ar_eg: بايو بيعرض بحثه بالإندونيسي الرسمي، زي ما بيتعمل في المدرسة. وdipingit = «اتحبست في البيت» (عادة قديمة للبنات قبل الجواز)، وzaman = زمن.
          ar: يعرض بايو بحثه بالإندونيسية الفصحى كما في المدرسة. وdipingit = «حُبست في البيت» (عادة قديمة للفتيات قبل الزواج)، وzaman = زمن.
          en: Bayu presents in standard Indonesian, as you do at school. dipingit = kept secluded at home (an old custom for girls before marriage); zaman = era.
      - speaker: Bayu
        text: Tapi dia menulis banyak surat kepada sahabat-sahabatnya di Belanda. Surat-surat itu dibukukan pada tahun 1911.
        ar_eg: بس كانت بتكتب جوابات كتير لصحابها في هولندا. والجوابات دي اتجمعت في كتاب سنة ١٩١١.
        ar: لكنها كتبت رسائل كثيرة إلى صديقاتها في هولندا، وجُمعت تلك الرسائل في كتاب عام ١٩١١.
        en: But she wrote many letters to her friends in the Netherlands. Those letters were published as a book in 1911.
      - speaker: Bayu
        text: Judulnya Habis Gelap Terbitlah Terang. Buku itu sudah saya baca!
        ar_eg: اسمه «بعد الضلمة بيطلع النور». والكتاب ده أنا قريته!
        ar: عنوانه «بعد الظلام يشرق النور». وقد قرأت هذا الكتاب!
        en: It's called "After Darkness Comes Light". And I've read that book!
        note:
          ar_eg: «Buku itu sudah saya baca» = «الكتاب ده أنا قريته». ده مبني للمجهول بالضمير - المفعول الأول، وبعدين saya، وبعدين الفعل من غير meN-.
          ar: «Buku itu sudah saya baca» = «ذلك الكتاب قرأته». وهذا مبنيّ للمجهول بالضمير - المفعول أولًا، ثم saya، ثم الفعل بلا meN-.
          en: '"Buku itu sudah saya baca" = "That book, I have read." It''s the pronoun passive: object first, then saya, then the bare verb (no meN-).'
      - speaker: Pak Budi
        text: Kamu baca semuanya, Le?
        ar_eg: انت قريته كلّه يا ابني؟
        ar: هل قرأته كلّه يا بنيّ؟
        en: You read all of it, son?
        note:
          ar_eg: بعد العرض الرسمي، الكلام في البيت بيرجع عادي - baca = membaca (يقرا).
          ar: بعد العرض الرسمي يعود الحديث في البيت إلى العامّية - baca = membaca (يقرأ).
          en: After the formal presentation, family talk goes back to everyday speech — baca = membaca (read).
      - speaker: Bayu
        text: Hmm... bab pertamanya udah aku baca, kok.
        ar_eg: اممم... الفصل الأول قريته.
        ar: همم... قرأت الفصل الأول.
        en: Hmm... the first chapter, I've read.
        note:
          ar_eg: udah aku baca = sudah saya baca - نفس المبني للمجهول بالضمير، بس بكلام البيت. وbab = فصل، وbaca = يقرا.
          ar: udah aku baca = sudah saya baca - المبنيّ للمجهول بالضمير نفسه، لكن بلغة البيت. وbab = فصل، وbaca = يقرأ.
          en: udah aku baca = sudah saya baca — the same pronoun passive, in home speech. bab = chapter; baca = read.
      - speaker: Nadia
        text: Bayu, di Mesir ada Huda Sya'rawi. Dia juga lahir tahun 1879, sama kayak Kartini!
        ar_eg: يا بايو، في مصر عندنا هدى شعراوي. هي كمان اتولدت سنة ١٨٧٩، زي كارتيني بالظبط!
        ar: يا بايو، في مصر هدى شعراوي. وُلدت هي أيضًا عام ١٨٧٩، مثل كارتيني تمامًا!
        en: Bayu, in Egypt we have Huda Sha'arawi. She was born in 1879 too, just like Kartini!
        note:
          ar_eg: sama kayak = sama seperti (زي بالظبط) في الكلام.
          ar: sama kayak = sama seperti (تمامًا مثل) في الكلام.
          en: sama kayak = sama seperti (just like) in speech.
      - speaker: Nadia
        text: Pada tahun 1923, Persatuan Feminis Mesir didirikan olehnya. Dia memperjuangkan sekolah untuk anak perempuan.
        ar_eg: سنة ١٩٢٣، أسّست الاتحاد النسائي المصري. وحاربت عشان البنات يتعلّموا.
        ar: في عام ١٩٢٣ أسّست الاتحاد النسائي المصري، وناضلت من أجل تعليم البنات.
        en: In 1923, she founded the Egyptian Feminist Union. She fought for girls' schooling.
        note:
          ar_eg: الـ di- (didirikan) مبني للمجهول، وoleh = «بواسطة / على إيد» - didirikan olehnya = «اتأسّس على إيدها».
          ar: البادئة di- (didirikan) للمبني للمجهول، وoleh تعني «من قِبَل» - didirikan olehnya = «أُسّس على يدها».
          en: di- (didirikan) is the passive, and oleh = "by" — didirikan olehnya = "was founded by her".
      - speaker: Sari
        text: Dua perempuan, dua negara, satu mimpi yang sama. Bagus, Bayu!
        ar_eg: ستّين، بلدين، وحلم واحد. حلو يا بايو!
        ar: امرأتان، وبلدان، وحلم واحد. أحسنت يا بايو!
        en: Two women, two countries, one shared dream. Nice one, Bayu!
  - setting:
      ar_eg: بعد البروفة. بو راهايو في المطبخ بتغسل المواعين، وپاك بودي عنده حاجة عايز يقولها.
      ar: بعد التدريب. بو راهايو في المطبخ تغسل الأطباق، ولدى باك بودي ما يريد قوله.
      en: After the rehearsal. Bu Rahayu is in the kitchen doing the dishes, and Pak Budi has something to say.
    lines:
      - speaker: Bayu
        text: Pak, siapa pahlawan Bapak? Pangeran Diponegoro? Bung Tomo?
        ar_eg: بابا، مين البطل بتاعك؟ الأمير ديبونيجورو؟ بونج تومو؟
        ar: أبي، من بطلك؟ الأمير ديبونيغورو؟ بونغ تومو؟
        en: Dad, who's your hero? Prince Diponegoro? Bung Tomo?
        note:
          ar_eg: ديبونيجورو قاد حرب جاوة ضد الهولنديين (١٨٢٥–١٨٣٠). وبونج تومو صوته كان بيشجّع أهل سورابايا في معركة ١٠ نوفمبر ١٩٤٥، وعشان كده ١٠ نوفمبر هو «يوم الأبطال». وكلمة pahlawan أصلها فارسي.
          ar: قاد ديبونيغورو حرب جاوة ضد الهولنديين (١٨٢٥–١٨٣٠). وكان صوت بونغ تومو يشجّع أهل سورابايا في معركة ١٠ نوفمبر ١٩٤٥، ولذلك صار ١٠ نوفمبر «يوم الأبطال». وكلمة pahlawan فارسية الأصل.
          en: Diponegoro led the Java War against the Dutch (1825–1830). Bung Tomo's radio speeches rallied Surabaya in the battle of 10 November 1945 — hence 10 November is Heroes' Day. The word pahlawan comes from Persian.
      - speaker: Pak Budi
        text: Bukan. Pahlawan Bapak ada di dapur sekarang.
        ar_eg: لأ. البطل بتاعي في المطبخ دلوقتي.
        ar: لا. بطلي في المطبخ الآن.
        en: No. My hero is in the kitchen right now.
      - speaker: Pak Budi
        text: Waktu Bapak sakit, warung dijaga sama Ibu. Kamu diurus sama Ibu. Bapak juga diurus sama Ibu.
        ar_eg: لمّا كنت عيّان، ماما هي اللي شالت الوارونج. وهي اللي خلّت بالها منك. وأنا كمان، هي اللي خلّت بالها منّي.
        ar: حين مرضت، كانت أمّك هي التي ترعى الوارونغ، وترعاك، وترعاني أنا أيضًا.
        en: When I was ill, the warung was run by Mum. You were looked after by Mum. And I was looked after by Mum, too.
        note:
          ar_eg: في الكلام sama بتاخد مكان oleh في المبني للمجهول - dijaga sama Ibu = dijaga oleh Ibu (اتشال على إيد ماما). وdiurus = اتّاخد باله منه، وdijaga = اتحرس / اتشال.
          ar: في الكلام تحلّ sama محلّ oleh في المبنيّ للمجهول - dijaga sama Ibu = dijaga oleh Ibu (رعته أمّك). وdiurus = رُعي، وdijaga = حُرس / أُدير.
          en: In speech, sama replaces oleh in passives — dijaga sama Ibu = dijaga oleh Ibu (run by Mum). diurus = looked after; dijaga = kept, minded.
      - speaker: Bu Rahayu
        text: Aduh, Pak. Ibu kan cuma ngerjain yang harus dikerjain.
        ar_eg: يا خبر يا بودي. أنا عملت اللي المفروض يتعمل وبس.
        ar: آه يا بودي. لم أفعل إلا ما يجب فعله.
        en: Oh, stop it. I only did what needed doing.
        note:
          ar_eg: cuma = hanya (بس)، وngerjain / dikerjain = mengerjakan / dikerjakan (يعمل / يتعمل) بـ ‎-in بتاعة الشارع.
          ar: cuma = hanya (فقط)، وngerjain / dikerjain = mengerjakan / dikerjakan (يعمل / يُعمل) بـ ‎-in العامّية.
          en: cuma = hanya (only); ngerjain / dikerjain = mengerjakan / dikerjakan (do / be done), with the street -in.
      - speaker: Sari
        text: Itu namanya pahlawan, Bu. Pahlawan nggak pernah bilang dia pahlawan.
        ar_eg: ده اللي اسمه بطل يا ماما. البطل عمره ما بيقول إنه بطل.
        ar: هذا هو البطل يا أمي. البطل لا يقول أبدًا إنه بطل.
        en: That's what a hero is, Mum. Heroes never say they're heroes.
        note:
          ar_eg: bilang = يقول (أبسط من berkata / mengatakan)، وnggak pernah = tidak pernah (عمره ما).
          ar: bilang = يقول (أبسط من berkata / mengatakan)، وnggak pernah = tidak pernah (لم … قطّ).
          en: bilang = say (everyday for berkata / mengatakan); nggak pernah = tidak pernah (never).
      - speaker: Bu Rahayu
        text: Kalau gitu, pahlawan ini mau istirahat. Piring-piring ini Bapak yang cuci, ya!
        ar_eg: طب لو كده، البطلة دي عايزة ترتاح. المواعين دي انت اللي هتغسلها!
        ar: إذن، هذه البطلة تريد أن ترتاح. هذه الأطباق ستغسلها أنت!
        en: In that case, this hero would like a rest. These dishes — you're washing them!
        note:
          ar_eg: kalau gitu = kalau begitu (طب لو كده).
          ar: kalau gitu = kalau begitu (إذن).
          en: kalau gitu = kalau begitu (in that case).
      - speaker: Narrator
        text: Malam itu, piring-piring dicuci oleh Pak Budi. Dan Bayu menambah satu halaman di proyeknya.
        ar_eg: الليلة دي، المواعين اتغسلت على إيد پاك بودي. وبايو زوّد صفحة في البحث بتاعه.
        ar: في تلك الليلة غسل باك بودي الأطباق، وأضاف بايو صفحة إلى بحثه.
        en: That night, the dishes were washed by Pak Budi. And Bayu added one more page to his project.
      - speaker: Bayu
        text: '"Pahlawan saya yang kedua: Ibu saya, Rahayu. Lahir di Madiun. Belum pernah dipingit."'
        ar_eg: «البطلة التانية بتاعتي - ماما، راهايو. اتولدت في ماديون. عمرها ما اتحبست في البيت.»
        ar: «بطلتي الثانية - أمي، راهايو. وُلدت في ماديون. ولم تُحبس في البيت قطّ.»
        en: '"My second hero: my mum, Rahayu. Born in Madiun. Has never been kept at home."'
