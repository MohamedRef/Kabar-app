title:
  target: Pecel Bu Darmi
  ar_eg: پيچل بو دارمي
  ar: بيتشل بو دارمي
  en: Bu Darmi's pecel
summary:
  ar_eg: جوكو بياخد كريم كاروبان عند بو دارمي، اللي بتعمل پيچل على ورق شجر الساج. كريم بيطلب لأول مرة بالجاوي، وبيتعلّم إن الأفعال بتبتدي بصوت في المناخير - nulis، maca، nggawe، ngombe... والشطّة بتعلّمه كلمة pedhes بالطريقة الصعبة.
  ar: يأخذ جوكو كريمًا إلى كاروبان عند بو دارمي، التي تقدّم البيتشل على ورق شجر الساج. يطلب كريم الطعام بالجاوية لأوّل مرّة، ويتعلّم أنّ الأفعال تبدأ بصوت أنفيّ - nulis وmaca وnggawe وngombe... ويعلّمه السامبال كلمة pedhes بالطريقة الصعبة.
  en: Joko takes Karim to Caruban, to Bu Darmi, who serves pecel on teak leaves. Karim orders in Javanese for the first time and learns that action verbs start with a nasal sound - nulis, maca, nggawe, ngombe... and the sambal teaches him the word pedhes the hard way.
cast: [Karim, Mas Joko, Bu Darmi]
scenes:
  - setting:
      ar_eg: وارونج صغير على الطريق في كاروبان، الصبح. بو دارمي بتطحن الفول السوداني بالهون. على الترابيزة ورق شجر ساج أخضر.
      ar: وارونغ صغير على الطريق في كاروبان، صباحًا. تطحن بو دارمي الفول السوداني في الهاون. وعلى الطاولة أوراق ساج خضراء.
      en: A little roadside warung in Caruban, in the morning. Bu Darmi is grinding peanuts in a stone mortar. Green teak leaves lie on the table.
    lines:
      - speaker: Bu Darmi
        text: Monggo, Mas. Aku lagi nggawe sambel kacang.
        ar_eg: اتفضّلوا يا أساتذة. أنا بعمل صلصة الفول السوداني.
        ar: تفضّلا يا أستاذان. أنا أعدّ صلصة الفول السوداني.
        en: Come in, lads. I'm making the peanut sauce.
        note:
          ar_eg: gawe (يعمل) لما تبقى فعل «بيعمل» بتبقى nggawe. ده الحرف الأنفي N- - بيدّي الفعل معنى «بيعمل الحاجة دي».
          ar: gawe (عمل) تصير nggawe بمعنى «يصنع». هذه هي البادئة الأنفية N- التي تعطي الفعل معنى الفاعلية.
          en: gawe (make) becomes nggawe, "making". This is the nasal prefix N-, which turns a root into an active verb.
      - speaker: Mas Joko
        text: Bu Darmi, iki Mas Karim saka Mesir. Arep nyoba pecel paling enak sak Madiun.
        ar_eg: يا بو دارمي، ده ماس كريم من مصر. عايز يجرّب أطعم پيچل في ماديون كلّها.
        ar: يا بو دارمي، هذا ماس كريم من مصر. يريد أن يجرّب ألذّ بيتشل في ماديون كلّها.
        en: Bu Darmi, this is Mas Karim from Egypt. He wants to try the best pecel in all of Madiun.
      - speaker: Karim
        text: Bu, tumbas sega pecel siji, nggih. Lan teh anget.
        ar_eg: يا مدام، طبق رز بيچل واحد لو سمحتي. وشاي سخن.
        ar: يا سيدتي، طبق أرز بالبيتشل واحد من فضلك. وشاي ساخن.
        en: Ma'am, one rice with pecel, please. And a hot tea.
        note:
          ar_eg: كريم استعمل كلمتين مؤدّبين اتعلّمهم من جوكو - tumbas (يشتري، أرقى من tuku) وnggih (أيوه، أرقى من iya). مع ست أكبر منك ده أحسن.
          ar: استعمل كريم كلمتين مهذّبتين تعلّمهما من جوكو - tumbas (يشتري، أرقى من tuku) وnggih (نعم، أرقى من iya). وهذا أفضل مع امرأة أكبر سنًّا.
          en: Karim used two polite words Joko taught him - tumbas (buy, politer than tuku) and nggih (yes, politer than iya). Better with an older woman.
      - speaker: Bu Darmi
        text: Wah, Mase pinter! Sambele pedhes apa ora?
        ar_eg: يا سلام، الأستاذ شاطر! الصلصة حرّاقة ولّا لأ؟
        ar: رائع، الأستاذ ذكيّ! الصلصة حارّة أم لا؟
        en: Oh, clever lad! Do you want the sauce spicy or not?
      - speaker: Karim
        text: Pedhes, Bu! Aku seneng pedhes.
        ar_eg: حرّاقة يا مدام! أنا بحبّ الحرّاق.
        ar: حارّة يا سيدتي! أحبّ الطعام الحارّ.
        en: Spicy, ma'am! I like spicy.
      - speaker: Mas Joko
        text: Ati-ati, Mas. Pedhese Madiun dudu pedhese Mesir.
        ar_eg: خلّي بالك يا ماس. حرارة ماديون مش زي حرارة مصر.
        ar: انتبه يا ماس. حرارة ماديون ليست كحرارة مصر.
        en: Careful, Mas. Madiun spicy isn't Egyptian spicy.
  - setting:
      ar_eg: بعد خمس دقايق. كريم وشّه أحمر، ودموعه نازلة، وبيشرب الشاي جرعة ورا جرعة. جوكو بيضحك ويكتب في كشكول كريم.
      ar: بعد خمس دقائق. وجه كريم أحمر، ودموعه تسيل، ويشرب الشاي جرعة بعد جرعة. يضحك جوكو ويكتب في دفتر كريم.
      en: Five minutes later. Karim's face is red, his eyes are streaming, and he's gulping tea. Joko laughs and writes in Karim's notebook.
    lines:
      - speaker: Karim
        text: Pedhes banget! Banyu! Banyu!
        ar_eg: حرّاق أوي! ميّة! ميّة!
        ar: حارّ جدًّا! ماء! ماء!
        en: So spicy! Water! Water!
      - speaker: Bu Darmi
        text: Ngombe teh sek, Mas. Tehe legi, ben adhem.
        ar_eg: اشرب الشاي الأول يا ابني. الشاي مسكّر، عشان يبرّد.
        ar: اشرب الشاي أوّلًا يا بنيّ. الشاي محلّى، ليبرّد فمك.
        en: Drink your tea first, son. The tea's sweet, it'll cool you down.
        note:
          ar_eg: ombe (شرب) بقت ngombe. والطعوم - pedhes (حرّاق)، legi (مسكّر)، asin (مالح)، kecut (حامض)، pait (مرّ).
          ar: ombe (شرب) صارت ngombe. والطعوم - pedhes (حارّ)، legi (حلو)، asin (مالح)، kecut (حامض)، pait (مرّ).
          en: ombe (drink) became ngombe. Tastes - pedhes (spicy), legi (sweet), asin (salty), kecut (sour), pait (bitter).
      - speaker: Mas Joko
        text: Mas Karim, aku nulis nang bukumu, ya. "Pecel Caruban, pedhes pol."
        ar_eg: يا ماس كريم، هكتب في كشكولك. «پيچل كاروبان، حرّاق موت».
        ar: يا ماس كريم، سأكتب في دفترك. «بيتشل كاروبان، حارّ جدًّا».
        en: Mas Karim, I'm writing in your book, okay. "Caruban pecel, ridiculously spicy."
      - speaker: Karim
        text: Tulis maneh, Jok. "Nanging enak tenan."
        ar_eg: اكتب كمان يا جوكو. «بس طعمه حلو جدًّا».
        ar: اكتب أيضًا يا جوكو. «لكنه لذيذ جدًّا».
        en: Write this too, Jok. "But really delicious."
      - speaker: Bu Darmi
        text: Mas maca basa Jawa ya? Iki menuku. Coba waca.
        ar_eg: انت بتقرا جاوي يا ابني؟ ده المنيو بتاعي. جرّب اقراه.
        ar: هل تقرأ الجاوية يا بنيّ؟ هذه قائمتي. جرّب أن تقرأها.
        en: Can you read Javanese, son? Here's my menu. Try reading it.
      - speaker: Karim
        text: Sega pecel, sega jagung, tempe, peyek... Aku maca! Aku isa maca!
        ar_eg: رز بيچل، رز بالدرة، تمپيه، پييك... أنا بقرا! أنا عارف أقرا!
        ar: أرز بالبيتشل، أرز بالذرة، تمبيه، بييك... أنا أقرأ! أستطيع أن أقرأ!
        en: Pecel rice, corn rice, tempe, peyek... I'm reading! I can read!
        note:
          ar_eg: waca (قراية) بقت maca (بيقرا). وtulis بقت nulis (بيكتب). شوف إزاي الحرف الأول بيتغيّر - t يبقى n، وw يبقى m.
          ar: waca (قراءة) صارت maca (يقرأ). وtulis صارت nulis (يكتب). لاحظ تغيّر الحرف الأوّل - t تصير n، وw تصير m.
          en: waca (read) became maca (reading). tulis became nulis (writing). Notice the first letter changes - t becomes n, w becomes m.
new_words:
  - word: nggawe
    pos: verb
    ar_eg: بيعمل، بيصنع
    ar: يصنع
    en: make, making
  - word: ngombe
    pos: verb
    ar_eg: بيشرب
    ar: يشرب
    en: drink
  - word: nulis
    pos: verb
    ar_eg: بيكتب
    ar: يكتب
    en: write
  - word: maca
    pos: verb
    ar_eg: بيقرا
    ar: يقرأ
    en: read
  - word: pedhes
    pos: adjective
    ar_eg: حرّاق
    ar: حارّ (الطعم)
    en: spicy
  - word: legi
    pos: adjective
    ar_eg: مسكّر، حلو
    ar: حلو المذاق
    en: sweet
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: بو دارمي كانت بتعمل إيه لما وصلوا؟
      ar: ماذا كانت بو دارمي تعدّ حين وصلا؟
      en: What was Bu Darmi making when they arrived?
    options: ["teh anget", "sambel kacang", "sega jagung"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: ___ teh sek, Mas.
    meaning:
      ar_eg: اشرب الشاي الأول يا ابني.
      ar: اشرب الشاي أوّلًا يا بنيّ.
      en: Drink your tea first, son.
    answers: [Ngombe]
    options: ["Ngombe", "Ombe", "Nulis"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: «tulis» لما تبقى فعل بيعمله حد بتبقى إيه؟
      ar: ماذا تصير «tulis» حين تصبح فعلًا فاعليًّا؟
      en: What does "tulis" become as an active verb?
    options: ["nulis", "ngulis", "mulis"]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Pedhes banget, nanging enak tenan.
    answers_meaning:
      ar_eg: ["حرّاق أوي، بس طعمه حلو جدًّا.", "حرّاق جدًّا بس لذيذ أوي."]
      ar: ["حارّ جدًّا، لكنه لذيذ جدًّا."]
      en: ["Very spicy, but really delicious.", "So spicy, but truly tasty."]
next:
  ar_eg: بو راهايو محتاجة بصل. والبصل الأحسن في نجانجوك... بس الأسعار بالجاوي فيها أرقام غريبة - selikur؟ selawe؟
  ar: تحتاج بو راهايو إلى بصل. وأفضل البصل في نغانجوك... لكنّ الأسعار بالجاوية فيها أرقام غريبة - selikur؟ selawe؟
  en: Bu Rahayu needs shallots. The best ones are in Nganjuk... but Javanese prices have strange numbers - selikur? selawe?
review:
  status: draft
  verified: false
  notes: Nasi pecel on teak leaves (godhong jati) is typical of Madiun/Caruban. Karim's tumbas/nggih is a deliberate krama preview.
