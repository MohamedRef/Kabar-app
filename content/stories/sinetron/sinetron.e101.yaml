title:
  target: Lir-ilir ing Demak
  ar_eg: «ليرـإيلير» في ديماك
  ar: «لير-إيلير» في ديماك
  en: Lir-ilir in Demak
summary:
  ar_eg: المطر نازل على جامع ديماك القديم. مباك أيو بتغنّي «ليرـإيلير»، أغنية بينسبوها للوليّ سونان كاليجاجا، وبتشرح إن الأولياء علّموا الناس بالأغاني. وفي الآخر، بترجّع لكريم كتابه متصحّح... وبتبعته لآخر محطّة - كوتاجيدي، عند پاك سلامت.
  ar: المطر يهطل على مسجد ديماك العتيق. تغنّي مباك أيو «لير-إيلير»، أغنية تُنسب إلى الوليّ سونان كاليجاغا، وتشرح أنّ الأولياء علّموا الناس بالأغاني. وفي النهاية تعيد إلى كريم كتابه مصحّحًا... وترسله إلى المحطّة الأخيرة - كوتاغيدي، عند باك سلامت.
  en: Rain falls on the old Demak mosque. Mbak Ayu sings "Lir-ilir", a song attributed to the saint Sunan Kalijaga, and explains that the saints taught through song. At the end, she hands Karim back his corrected book... and sends him to the last stop - Kotagede, to Pak Slamet.
cast: [Karim, Mbak Ayu]
scenes:
  - setting:
      ar_eg: رواق جامع ديماك الكبير، العصر. مطر جامد. سقف خشب بطبقات، وعواميد خشب قديمة. مباك أيو وكريم قاعدين مستنّيين المطر يهدى.
      ar: رواق مسجد ديماك الكبير، عصرًا. مطر غزير. سقف خشبيّ بطبقات، وأعمدة خشبية عتيقة. تجلس مباك أيو وكريم بانتظار أن يهدأ المطر.
      en: The veranda of the Great Mosque of Demak, late afternoon. Heavy rain. A tiered wooden roof and ancient timber pillars. Mbak Ayu and Karim sit waiting for the rain to ease.
    lines:
      - speaker: Mbak Ayu
        text: Masjid iki salah siji masjid paling tuwa ing tanah Jawa. Dibangun nalika jaman Wali Sanga.
        ar_eg: الجامع ده من أقدم الجوامع في جاوة. اتبنى أيام الأولياء التسعة.
        ar: هذا المسجد من أقدم المساجد في جاوة. بُني في عصر الأولياء التسعة.
        en: This mosque is one of the oldest in Java. It was built in the time of the Wali Sanga.
        note:
          ar_eg: "Wali Sanga = «الأولياء التسعة» اللي بيتقال إنهم نشروا الإسلام في جاوة في القرن الخمستاشر والستّاشر. جامع ديماك من أواخر القرن الخمستاشر. كلمات: tanah = أرض، تراب."
          ar: "Wali Sanga = «الأولياء التسعة» الذين يقال إنّهم نشروا الإسلام في جاوة في القرنين الخامس عشر والسادس عشر. ومسجد ديماك من أواخر القرن الخامس عشر. مفردات: tanah = أرض، تربة."
          en: "The Wali Sanga, the \"nine saints\", are said to have spread Islam in Java in the 15th-16th centuries. The Demak mosque dates from the late 15th century. Words: tanah = land, soil, ground."
      - speaker: Karim
        text: Wali Sanga mulang nganggo apa, Mbak? Nganggo buku?
        ar_eg: الأولياء التسعة كانوا بيعلّموا بإيه يا مباك؟ بالكتب؟
        ar: بماذا كان الأولياء التسعة يعلّمون يا مباك؟ بالكتب؟
        en: What did the Wali Sanga teach with, Mbak? Books?
        note:
          ar_eg: "كلمات: mulang = يدرّس."
          ar: "مفردات: mulang = يدرّس."
          en: "Words: mulang = teach."
      - speaker: Mbak Ayu
        text: Akeh-akehe nganggo tembang lan wayang. Rungokna. Iki "Lir-ilir", jarene anggitane Sunan Kalijaga.
        ar_eg: أغلبه بالأغاني والوايانج. اسمع. دي «ليرـإيلير»، بيقولوا إن سونان كاليجاجا اللي ألّفها.
        ar: غالبًا بالأغاني والواينغ. اسمع. هذه «لير-إيلير»، يقال إنّ سونان كاليجاغا ألّفها.
        en: Mostly with songs and wayang. Listen. This is "Lir-ilir", said to be composed by Sunan Kalijaga.
        note:
          ar_eg: "كلمات: akeh-akehe = أغلب، في الغالب."
          ar: "مفردات: akeh-akehe = معظم، في الغالب."
          en: "Words: akeh-akehe = mostly, the majority."
      - speaker: Mbak Ayu
        text: Lir-ilir, lir-ilir, tandure wus sumilir. Tak ijo royo-royo, tak sengguh temanten anyar.
        ar_eg: صحّي، صحّي، الزرع طلع وبيتهزّ. أخضر أخضر أوي، زي العرسان الجداد.
        ar: استيقظ، استيقظ، النبت طلع يتمايل. أخضر نضر جدًّا، كأنّه عروسان جديدان.
        en: Wake up, wake up, the seedlings are sprouting. So lush and green, like a newly-wed couple.
        note:
          ar_eg: «ليرـإيلير» أغنية تقليدية لسه بيغنّيها العيال والكبار. ناس كتير بيفسّروها إن «الزرع» هو الإيمان اللي بيطلع في القلب. الأغنية دي من الـtembang، الشعر الجاوي المغنّى.
          ar: «لير-إيلير» أغنية تقليدية ما زال يغنّيها الصغار والكبار. ويفسّرها كثيرون بأنّ «النبت» هو الإيمان الذي ينمو في القلب. وهي من الـtembang، أي الشعر الجاويّ المغنّى.
          en: Lir-ilir is a traditional song still sung by children and adults. Many read the "seedlings" as faith sprouting in the heart. It belongs to tembang, sung Javanese verse.
      - speaker: Karim
        text: Kaya inshad ing Mesir! Tembang kanggo mulang ati.
        ar_eg: زي الإنشاد في مصر! غُنا عشان يعلّم القلب.
        ar: مثل الإنشاد في مصر! غناء يعلّم القلب.
        en: Like inshad in Egypt! Songs to teach the heart.
      - speaker: Mbak Ayu
        text: Persis. Saiki campursari lan dangdut koplo uga nganggo basa Jawa. Tembang ora tau mati.
        ar_eg: بالظبط. ودلوقتي الكامپورساري والدانجدوت كوپلو برضه بالجاوي. الغُنا الجاوي عمره ما بيموت.
        ar: تمامًا. والآن الكامبورساري والدانغدوت كوبلو أيضًا بالجاوية. الغناء الجاويّ لا يموت أبدًا.
        en: Exactly. Today campursari and dangdut koplo are in Javanese too. Javanese song never dies.
        note:
          ar_eg: "campursari = موسيقى بتخلط الجاميلان بالآلات الحديثة، ودangdut koplo = دانجدوت سريع للرقص. الاتنين أغانيهم كتير بالجاوي، وبتسمعهم في الأفراح والأتوبيسات. كلمات: persis = بالظبط، زي بالظبط."
          ar: "campursari = موسيقى تمزج الغاميلان بالآلات الحديثة، وdangdut koplo = دانغدوت سريع للرقص. وكثير من أغانيهما بالجاوية، وتُسمع في الأعراس والحافلات. مفردات: persis = تمامًا، بالضبط."
          en: "Campursari mixes gamelan with modern instruments; dangdut koplo is fast dance dangdut. Both have many Javanese songs - you'll hear them at weddings and on buses. Words: persis = exactly, just like."
  - setting:
      ar_eg: المطر وقف. مباك أيو بتطلّع كتاب كريم من الشنطة - مليان علامات حمرا، وفي الآخر صفحة مكتوبة بخطّها.
      ar: توقّف المطر. تُخرج مباك أيو كتاب كريم من الحقيبة - مليء بعلامات حمراء، وفي آخره صفحة بخطّ يدها.
      en: The rain stops. Mbak Ayu takes Karim's book out of her bag - full of red marks, with a page in her handwriting at the end.
    lines:
      - speaker: Mbak Ayu
        text: Mas, bukumu wis tak dandani. Saiki ejaane bener kabeh.
        ar_eg: يا ماس، صلّحت كتابك. دلوقتي الإملاء كله صحّ.
        ar: يا ماس، صحّحت كتابك. الآن الإملاء كلّه صحيح.
        en: Mas, I've fixed your book. Now all the spelling is right.
      - speaker: Karim
        text: Matur nuwun sanget, Mbak. Nanging bukune durung rampung. Kurang siji bab.
        ar_eg: متشكّر جدًّا يا مباك. بس الكتاب لسه ماخلصش. ناقصه فصل واحد.
        ar: شكرًا جزيلًا يا مباك. لكنّ الكتاب لم يكتمل بعد. ينقصه فصل واحد.
        en: Thank you so much, Mbak. But the book isn't finished. It's missing one chapter.
        note:
          ar_eg: "كلمات: bab = فصل؛ موضوع."
          ar: "مفردات: bab = فصل؛ موضوع."
          en: "Words: bab = chapter; topic."
      - speaker: Mbak Ayu
        text: Bab apa?
        ar_eg: فصل إيه؟
        ar: أيّ فصل؟
        en: Which chapter?
      - speaker: Karim
        text: Aksara Jawa. Wong Mesir kudu weruh yen basa Jawa duwe aksara dhewe.
        ar_eg: الحروف الجاوي. المصريين لازم يعرفوا إن الجاوي ليه حروف خاصّة بيه.
        ar: الحروف الجاوية. يجب أن يعرف المصريّون أنّ للجاوية حروفها الخاصّة.
        en: Javanese script. Egyptians need to know Javanese has its own alphabet.
        note:
          ar_eg: "كلمات: aksara = حرف، أبجدية."
          ar: "مفردات: aksara = حرف، أبجدية."
          en: "Words: aksara = letter, script."
      - speaker: Mbak Ayu
        text: Yen ngono, sampeyan kudu menyang Kotagede. Ana tukang salaka sing bisa nulis aksara Jawa.
        ar_eg: يبقى لازم تروح كوتاجيدي. فيه صايغ فضّة بيعرف يكتب بالحروف الجاوي.
        ar: إذن يجب أن تذهب إلى كوتاغيدي. هناك صائغ فضّة يعرف الكتابة بالحروف الجاوية.
        en: Then you have to go to Kotagede. There's a silversmith who can write Javanese script.
      - speaker: Karim
        text: Pak Slamet! Aku wis kenal. Dheweke ngundang aku!
        ar_eg: پاك سلامت! أنا أعرفه. هو عزمني!
        ar: باك سلامت! أعرفه. لقد دعاني!
        en: Pak Slamet! I know him. He invited me!
