questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: بيقولوا إن مين اللي ألّف «ليرـإيلير»؟
      ar: من يقال إنّه ألّف «لير-إيلير»؟
      en: Who is said to have composed "Lir-ilir"?
    options: ["Sunan Kalijaga", "Sunan Kudus", "Mbak Ayu"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Wali Sanga mulang nganggo ___ lan wayang.
    meaning:
      ar_eg: الأولياء التسعة علّموا بالأغاني والوايانج.
      ar: علّم الأولياء التسعة بالأغاني والواينغ.
      en: The Wali Sanga taught with songs and wayang.
    answers: [tembang]
    options: ["tembang", "buku", "warta"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: كتاب كريم ناقصه فصل إيه؟
      ar: أيّ فصل ينقص كتاب كريم؟
      en: Which chapter is Karim's book missing?
    options: ["Aksara Jawa", "Basa krama", "Tembang"]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Tembang ora tau mati.
    answers_meaning:
      ar_eg: ["الغُنا عمره ما بيموت.", "الأغاني الجاوي مابتموتش أبدًا."]
      ar: ["الغناء لا يموت أبدًا."]
      en: ["Song never dies.", "Javanese song never dies."]
next:
  ar_eg: كوتاجيدي، بلد الفضّة. پاك سلامت بينقش اسم كريم بحروف غريبة... وبيحكيله حكاية الأبجدية الجاوي - قصّة رسولين وفيّين.
  ar: كوتاغيدي، بلدة الفضّة. ينقش باك سلامت اسم كريم بحروف غريبة... ويحكي له قصّة الأبجدية الجاوية - حكاية رسولين وفيّين.
  en: Kotagede, the silver town. Pak Slamet engraves Karim's name in strange letters... and tells him the story of the Javanese alphabet - a tale of two loyal messengers.
review:
  status: draft
  verified: false
  notes: The Lir-ilir lines are the traditional public-domain opening; the Sunan Kalijaga attribution is traditional, kept as "jarene" (it is said). Demak mosque dates to the late 15th century.
