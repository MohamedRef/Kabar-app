title:
  target: Tujuh Telur di Kali Raja
  ar_eg: سبع بيضات في نهر الملوك
  ar: سبع بيضات في نهر الملوك
  en: Seven Eggs at Kali Raja
summary:
  ar_eg: في قرية أربوريك، بايو بيتعلّم إزاي يستأذن بأدب قبل ما يسأل. وباپاك ياكوب، حارس الحكايات في القرية، ومراته ماما إستر بيحكوا حكاية السبع بيضات اللي منها اتولدوا ملوك راجا أمبات الأربعة... وفي الحكاية درس عن البحر لسه عايش لحد النهارده.
  ar: في قرية أربوريك يتعلّم بايو كيف يستأذن بأدب قبل أن يسأل. ويحكي باباك ياكوب، حافظ الحكايات في القرية، وزوجته ماما إستر حكاية البيضات السبع التي خرج منها ملوك راجا أمبات الأربعة... وفي الحكاية درس عن البحر ما زال حيًّا إلى اليوم.
  en: In Arborek village, Bayu learns how to ask permission politely before asking questions. Bapak Yakob, the village's keeper of stories, and his wife Mama Ester tell the tale of the seven eggs that gave Raja Ampat its four kings... and the tale holds a lesson about the sea that is still alive today.
cast: [Kak Nella, Bayu, Mama Ester, Bapak Yakob]
scenes:
  - setting:
      ar_eg: قرية أربوريك، جزيرة صغيرة في راجا أمبات، العصر. عيال بينطّوا من الرصيف الخشب في المية. باپاك ياكوب وماما إستر قاعدين على البلكونة الخشب قدّام بيتهم.
      ar: قرية أربوريك في جزيرة صغيرة من جزر راجا أمبات، عصرًا. أطفال يقفزون من الرصيف الخشبي إلى الماء. باباك ياكوب وماما إستر جالسان في الشرفة الخشبية أمام بيتهما.
      en: Arborek village, a small island in Raja Ampat, in the afternoon. Children jump off the wooden jetty into the water. Bapak Yakob and Mama Ester sit on the wooden veranda of their house.
    lines:
      - speaker: Narrator
        text: Kampung Arborek, sore hari. Anak-anak melompat dari dermaga ke air yang biru kehijauan, dan tawa mereka memantul di antara rumah-rumah panggung.
        ar_eg: قرية أربوريك، العصر. العيال بينطّوا من الرصيف في مية لونها أزرق مخضّر، وضحكهم بيرنّ بين البيوت اللي على أعمدة.
        ar: قرية أربوريك، عصرًا. يقفز الأطفال من الرصيف إلى ماء أزرق مخضرّ، وترتدّ ضحكاتهم بين البيوت القائمة على الأعمدة.
        en: Arborek village, late afternoon. Children leap from the jetty into blue-green water, and their laughter bounces between the stilt houses.
      - speaker: Kak Nella
        text: Mas Bayu, di sini kita tamu. Kasih salam dulu, duduk kalau udah dipersilakan, terus jangan langsung keluarin perekam, ya.
        ar_eg: يا بايو، احنا هنا ضيوف. سلّم الأول، اقعد لما يقولولك اتفضّل، ومتطلّعش جهاز التسجيل على طول، ماشي؟
        ar: يا ماس بايو، نحن هنا ضيوف. ألقِ التحيّة أوّلًا، واجلس إذا دُعيت إلى الجلوس، ولا تُخرج جهاز التسجيل فورًا.
        en: Mas Bayu, we're guests here. Greet them first, sit when you're invited to, and don't pull out the recorder straight away.
        note:
          ar_eg: kasih = beri (يدّي)، udah = sudah، keluarin = keluarkan (يطلّع). perekam = جهاز تسجيل.
          ar: kasih = beri (يعطي)، udah = sudah، keluarin = keluarkan (يُخرج). perekam = جهاز تسجيل.
          en: kasih = beri (give), udah = sudah, keluarin = keluarkan (take out). perekam = recorder.
      - speaker: Bayu
        text: Selamat sore, Bapak, Mama. Saya Bayu, wartawan magang dari Warta Pesisir di Sorong. Mohon izin, kalau Bapak berkenan, saya ingin mendengar cerita tentang asal-usul Raja Ampat.
        ar_eg: مساء الخير يا باپاك، يا ماما. أنا بايو، صحفي متدرّب في جرنال «وارتا پيسيسير» في سورونج. بعد إذنكم، لو حضرتك تسمح، حابب أسمع حكاية أصل راجا أمبات.
        ar: مساء الخير يا باباك، يا ماما. أنا بايو، صحفي متدرّب في صحيفة «وارتا بيسيسير» في سورونغ. بعد إذنكما، إن تكرّمتَ، أودّ أن أسمع حكاية أصل راجا أمبات.
        en: Good afternoon, Bapak, Mama. I'm Bayu, a trainee reporter with Warta Pesisir in Sorong. With your permission, if you'd be so kind, I'd like to hear the story of how Raja Ampat began.
        note:
          ar_eg: لغة على قدّ المقام (bahasa sesuai konteks) - mohon izin (بعد إذنك) وkalau Bapak berkenan (لو حضرتك تتكرّم) أدب عالي جدًا. وفي پاپوا الست الكبيرة بيتقال لها Mama، والراجل الكبير Bapak أو Bapa.
          ar: لغة تناسب المقام (bahasa sesuai konteks) - mohon izin (بعد إذنك) وkalau Bapak berkenan (إن تكرّمتَ) من أرفع صيغ الأدب. وفي بابوا تُخاطَب المرأة الكبيرة بـ Mama، والرجل الكبير بـ Bapak أو Bapa.
          en: 'Language to suit the setting (bahasa sesuai konteks): mohon izin (with your permission) and kalau Bapak berkenan (if you would be so kind) are very respectful. In Papua an older woman is addressed as Mama, an older man as Bapak or Bapa.'
      - speaker: Mama Ester
        text: Selamat sore, anak. Duduk dulu, minum teh dulu. Cerita tidak bisa didengar dengan perut kosong.
        ar_eg: مساء النور يا ابني. اقعد الأول، واشرب شاي الأول. الحكاية متتسمعش على معدة فاضية.
        ar: مساء النور يا بنيّ. اجلس أوّلًا واشرب الشاي. فالحكاية لا تُسمع على معدة فارغة.
        en: Good afternoon, child. Sit down first, have some tea first. A story can't be heard on an empty stomach.
      - speaker: Bapak Yakob
        text: Ko dari Jawa, to? Dari logatmu saja sa sudah tahu.
        ar_eg: انت من جاوة، مش كده؟ من لهجتك بس عرفت.
        ar: أنت من جاوة، أليس كذلك؟ عرفتُ ذلك من لهجتك وحدها.
        en: You're from Java, aren't you? I can tell just from your accent.
        note:
          ar_eg: طعم من ملايو پاپوا - sa (أنا)، ko (انت)، وto في آخر الجملة يعني «مش كده؟». هنتعلّمهم كويس الحلقة الجاية.
          ar: لمحة من ملايو بابوا - sa (أنا)، وko (أنت)، وto في آخر الجملة بمعنى «أليس كذلك؟». سنتعلّمها جيّدًا في الحلقة القادمة.
          en: 'A taste of Papuan Malay: sa (I), ko (you), and to at the end of a sentence means "right?". We''ll learn them properly next episode.'
      - speaker: Bayu
        text: Betul, Bapak. Dari Madiun. Kata orang, logat saya emang medok.
        ar_eg: مظبوط يا باپاك. من ماديون. الناس بتقول إن لهجتي تقيلة فعلًا.
        ar: صحيح يا باباك. من ماديون. يقول الناس إنّ لهجتي ثقيلة فعلًا.
        en: That's right, Bapak. From Madiun. People say my accent is pretty thick.
        note:
          ar_eg: emang = memang (فعلًا). medok = لهجة جاوية تقيلة.
          ar: emang = memang (حقًّا). medok = لكنة جاوية ثقيلة.
          en: emang = memang (indeed). medok = a thick Javanese accent.
      - speaker: Bapak Yakob
        text: Tidak apa-apa. Laut ini sudah mendengar banyak logat. Dia tidak pilih kasih.
        ar_eg: ولا يهمّك. البحر ده سمع لهجات كتير. ومبيفرّقش بين حد وحد.
        ar: لا بأس. لقد سمع هذا البحر لهجات كثيرة، وهو لا يحابي أحدًا.
        en: That's fine. This sea has heard plenty of accents. It doesn't play favourites.
        note:
          ar_eg: pilih kasih = يفرّق في المعاملة. ده majas personifikasi (تشخيص) - البحر «بيسمع» و«مبيفرّقش» زي البني آدم. الحكّايين في پاپوا وفي كل مكان بيحبّوا يكلّموا الطبيعة كأنها حدّ عايش.
          ar: pilih kasih = المحاباة. هذا تشخيص (majas personifikasi) - البحر «يسمع» و«لا يحابي» كالإنسان. ويحبّ الرواة في بابوا وغيرها أن يتحدّثوا عن الطبيعة كأنّها كائن حيّ.
          en: pilih kasih = to play favourites. That's personification (majas personifikasi) - the sea "hears" and "plays no favourites" like a person. Storytellers in Papua, as everywhere, speak of nature as if it were alive.
      - speaker: Kak Nella
        text: Bapak Yakob ini penjaga cerita di kampung, Mas. Kalau ada pesta atau duka, beliau yang ngomong.
        ar_eg: باپاك ياكوب ده حارس الحكايات في القرية يا بايو. لو فيه فرح أو عزا، هو اللي بيتكلّم.
        ar: باباك ياكوب حافظ الحكايات في القرية يا ماس. في الأفراح والأتراح هو من يتكلّم.
        en: Bapak Yakob is the village's keeper of stories, Mas. At every celebration or funeral, he's the one who speaks.
        note:
          ar_eg: ngomong = berbicara (يتكلّم). duka = عزا، penjaga = حارس.
          ar: ngomong = berbicara (يتكلّم). duka = عزاء، penjaga = حارس.
          en: ngomong = berbicara (speak). duka = mourning, penjaga = keeper.
      - speaker: Bapak Yakob
        text: Ah, Nella terlalu tinggi angkat sa. Sa cuma orang tua yang ingatannya lebih panjang daripada jaring ikan.
        ar_eg: يا شيخة، نيلا مكبّراني أوي. أنا مجرد راجل كبير ذاكرته أطول من شبكة الصيد.
        ar: آه، نيلا ترفعني أكثر ممّا أستحقّ. لستُ سوى شيخ ذاكرته أطول من شبكة الصيد.
        en: Ah, Nella lifts me up too high. I'm just an old man whose memory is longer than a fishing net.
        note:
          ar_eg: sa = saya في ملايو پاپوا. jaring = شبكة صيد.
          ar: sa = saya في ملايو بابوا. jaring = شبكة صيد.
          en: sa = saya in Papuan Malay. jaring = fishing net.
      - speaker: Bayu
        text: Boleh saya rekam, Bapak?
        ar_eg: ممكن أسجّل يا باپاك؟
        ar: هل تسمح لي بالتسجيل يا باباك؟
        en: May I record, Bapak?
        note:
          ar_eg: rekam = يسجّل. بايو بيكلّم راجل كبير، فبيستأذن بأدب.
          ar: rekam = يسجّل. يخاطب بايو شيخًا فيستأذن بأدب.
          en: rekam = record. Bayu is speaking to an elder, so he asks politely.
      - speaker: Bapak Yakob
        text: Rekam suara boleh. Tapi tulis juga dengan hatimu. Cerita ini bukan dongeng pengantar tidur; ini cerita tentang siapa kami.
        ar_eg: تسجّل الصوت ماشي. بس اكتب بقلبك كمان. الحكاية دي مش حدّوتة قبل النوم؛ دي حكاية عن احنا مين.
        ar: سجّل الصوت لا بأس. لكن اكتب بقلبك أيضًا. هذه ليست حكاية قبل النوم؛ إنّها حكاية مَن نحن.
        en: You may record my voice. But write with your heart too. This isn't a bedtime story; it's a story about who we are.
        note:
          ar_eg: tulis = اكتب.
          ar: tulis = اكتب.
          en: tulis = write.
  - setting:
      ar_eg: الشمس بتغرب. الشاي في الكوبايات، وباپاك ياكوب بيبدأ يحكي بصوت واطي، وماما إستر بتكمّل وراه أحيانًا.
      ar: الشمس تغرب. الشاي في الأكواب، ويبدأ باباك ياكوب الحكي بصوت خفيض، وتكمل ماما إستر وراءه أحيانًا.
      en: The sun is setting. Tea in the cups, Bapak Yakob begins in a low voice, and now and then Mama Ester picks up the thread.
    lines:
      - speaker: Bapak Yakob
        text: Dahulu kala, sepasang suami istri mencari makan di tepi sebuah kali di Pulau Waigeo. Orang sekarang menyebut tempat itu Kali Raja.
        ar_eg: زمان أوي، راجل ومراته كانوا بيدوّروا على أكل على شطّ نهر صغيّر في جزيرة وايجيو. الناس دلوقتي بيسمّوا المكان ده «كالي راجا» - نهر الملوك.
        ar: في قديم الزمان، كان زوجان يبحثان عن الطعام على ضفّة جدول في جزيرة وايغيو. ويسمّي الناس ذلك المكان اليوم «كالي راجا» - نهر الملوك.
        en: Long, long ago, a husband and wife were looking for food on the bank of a stream on Waigeo island. Today people call that place Kali Raja - the River of Kings.
      - speaker: Bapak Yakob
        text: Di antara akar-akar pohon, mereka menemukan tujuh butir telur. Telur-telur itu bukan telur biasa; kulitnya berkilau seperti bulan di atas air.
        ar_eg: بين جذور الشجر، لقوا سبع بيضات. البيض ده ماكانش بيض عادي؛ قشره كان بيلمع زي القمر على وشّ المية.
        ar: وبين جذور الأشجار وجدا سبع بيضات. لم تكن بيضًا عاديًّا؛ كانت قشرتها تتلألأ كالقمر فوق الماء.
        en: Among the tree roots, they found seven eggs. They weren't ordinary eggs; their shells shone like the moon on the water.
      - speaker: Mama Ester
        text: Mereka bawa pulang, simpan baik-baik di dalam noken. Malamnya, mereka dengar suara orang berbisik dari dalam noken itu.
        ar_eg: خدوهم البيت، وشالوهم كويس في شنطة النوكين. وبالليل، سمعوا صوت ناس بتوشوش من جوّه الشنطة.
        ar: حملاها إلى البيت وحفظاها جيّدًا في كيس النوكين. وفي الليل سمعا أصواتًا تهمس من داخل الكيس.
        en: They took them home and kept them safe in a noken bag. That night, they heard voices whispering from inside it.
      - speaker: Bapak Yakob
        text: Empat telur menetas menjadi empat anak laki-laki. Setelah dewasa, mereka menjadi raja di empat pulau, yaitu Waigeo, Batanta, Salawati, dan Misool. Karena itulah tanah ini disebut Raja Ampat, empat raja.
        ar_eg: أربع بيضات فقسوا وطلع منهم أربع ولاد. ولما كبروا، بقوا ملوك على أربع جزر - وايجيو، باتانتا، سالاواتي، وميسول. وعشان كده الأرض دي اسمها راجا أمبات، يعني الأربع ملوك.
        ar: فقست أربع بيضات عن أربعة صبيان، وحين كبروا صاروا ملوكًا على أربع جزر هي وايغيو وباتانتا وسالاواتي وميسول. ولهذا سُمّيت هذه الأرض راجا أمبات، أي الملوك الأربعة.
        en: Four eggs hatched into four boys. When they grew up, they became kings of four islands - Waigeo, Batanta, Salawati and Misool. That's why this land is called Raja Ampat, the four kings.
        note:
          ar_eg: ampat صيغة قديمة من empat (أربعة). وتاريخيًا، كان فيه فعلًا ممالك صغيرة في الجزر دي، ليها علاقة بسلطنة تيدوري في مالوكو.
          ar: ampat صيغة قديمة لـ empat (أربعة). وتاريخيًّا قامت في هذه الجزر فعلًا ممالك صغيرة ارتبطت بسلطنة تيدوري في مالوكو.
          en: ampat is an old form of empat (four). Historically there really were small kingdoms on these islands, linked to the Sultanate of Tidore in Maluku.
      - speaker: Bayu
        text: Lalu tiga telur yang lain, Bapak?
        ar_eg: والتلات بيضات التانيين يا باپاك؟
        ar: والبيضات الثلاث الأخرى يا باباك؟
        en: And the other three eggs, Bapak?
      - speaker: Bapak Yakob
        text: Satu menjadi seorang putri yang kemudian pergi jauh menyeberangi laut. Satu menjadi roh, makhluk yang tidak kelihatan. Dan satu lagi tidak pernah menetas.
        ar_eg: واحدة طلع منها بنت، أميرة، وبعدين راحت بعيد وعدّت البحر. وواحدة بقت روح، كائن محدّش بيشوفه. والأخيرة عمرها ما فقست.
        ar: خرجت من إحداها أميرة رحلت بعيدًا عبر البحر، وصارت أخرى روحًا لا تُرى، والأخيرة لم تفقس قطّ.
        en: One became a princess who later went far away across the sea. One became a spirit, a being no one can see. And one never hatched at all.
      - speaker: Mama Ester
        text: Telur itu menjadi batu. Sampai hari ini orang menjaganya di Kali Raja dan menghormatinya seperti seorang raja.
        ar_eg: البيضة دي بقت حجر. ولحد النهارده الناس بيحرسوها في «كالي راجا» وبيحترموها كأنها ملك.
        ar: صارت تلك البيضة حجرًا، وما زال الناس إلى اليوم يحرسونها في «كالي راجا» ويُجلّونها كما يُجلّ الملك.
        en: That egg turned to stone. To this day people guard it at Kali Raja and honour it like a king.
        note:
          ar_eg: الحكاية ليها كذا رواية بتختلف من قرية لقرية، وده العادي في الحكايات الشفهية. والبيضة الحجر لسه محفوظة في مكان مقدّس عند «كالي راجا» في وايجيو، والزوّار بيدخلوا بإذن وباحترام.
          ar: للحكاية روايات تختلف من قرية إلى أخرى، وهذا شأن الحكايات الشفهية. وما زالت البيضة الحجرية محفوظة في موضع مقدّس عند «كالي راجا» في وايغيو، يدخله الزوّار بإذن واحترام.
          en: The tale has several versions that differ from village to village, as oral tales do. The stone egg is still kept at a sacred site at Kali Raja on Waigeo, and visitors enter with permission and respect.
      - speaker: Kak Nella
        text: Jadi ada raja yang nggak pernah ngomong, tapi juga nggak pernah pergi.
        ar_eg: يعني فيه ملك عمره ما اتكلّم، بس كمان عمره ما مشي.
        ar: إذن ثمّة ملك لم يتكلّم قطّ، لكنّه أيضًا لم يرحل قطّ.
        en: So there's a king who never speaks, but who never leaves either.
        note:
          ar_eg: nggak = tidak، ngomong = berbicara.
          ar: nggak = tidak، ngomong = berbicara.
          en: nggak = tidak, ngomong = berbicara.
      - speaker: Bapak Yakob
        text: Nah, itu dia. Raja yang diam itu menjaga tanah. Empat raja yang lain harus berbagi laut. Kalau satu serakah, yang lain lapar.
        ar_eg: أهو ده بالظبط. الملك الساكت ده بيحرس الأرض. والأربع ملوك التانيين لازم يتقاسموا البحر. لو واحد طمع، الباقيين يجوعوا.
        ar: هو ذاك بعينه. الملك الصامت يحرس الأرض، والملوك الأربعة الآخرون عليهم أن يتقاسموا البحر. فإن طمع أحدهم جاع الباقون.
        en: There you have it. The silent king guards the land. The other four kings have to share the sea. If one is greedy, the others go hungry.
      - speaker: Bayu
        text: Apa karena itu kampung-kampung di sini punya sasi, Bapak? Lautnya ditutup sementara?
        ar_eg: هو عشان كده القرى هنا عندها «ساسي» يا باپاك؟ يقفلوا البحر فترة؟
        ar: أهذا سبب وجود «الساسي» في قرى هذه المنطقة يا باباك؟ إغلاق البحر مدّة من الزمن؟
        en: Is that why the villages here have sasi, Bapak? Closing the sea for a while?
        note:
          ar_eg: Apa = Apakah في الكلام. ditutup = بيتقفل.
          ar: Apa = Apakah في الكلام. ditutup = يُغلق.
          en: Apa = Apakah in speech. ditutup = closed.
      - speaker: Bapak Yakob
        text: Ko cepat belajar. Selama sasi, tidak ada yang boleh mengambil teripang atau lola. Kami biarkan laut bernapas. Waktu sasi dibuka, hasilnya berlipat.
        ar_eg: انت بتتعلّم بسرعة. طول فترة الساسي، محدّش مسموح له ياخد خيار البحر ولا صدف اللولا. بنسيب البحر ياخد نفسه. ولما الساسي يتفتح، الخير بيبقى أضعاف.
        ar: أنت سريع التعلّم. في مدّة الساسي لا يُسمح لأحد بأخذ خيار البحر أو صدف اللولا. ندع البحر يتنفّس، فإذا رُفع الساسي تضاعف المحصول.
        en: You learn fast. During sasi, no one may take sea cucumbers or top shells. We let the sea breathe. When the sasi is lifted, the harvest is many times bigger.
        note:
          ar_eg: sasi عرف قديم في مالوكو وپاپوا - يقفلوا حتّة من البحر أو الغابة فترة ومحدّش ياخد منها حاجة، عشان الحياة ترجع. وفي قرى كتير في راجا أمبات الساسي بيتعلن في الكنيسة. teripang = خيار البحر، وlola = نوع صدف كبير.
          ar: sasi عرف قديم في مالوكو وبابوا، يُغلق فيه جزء من البحر أو الغابة مدّة فلا يؤخذ منه شيء حتى تتجدّد الحياة. وفي قرى كثيرة في راجا أمبات يُعلن الساسي في الكنيسة. teripang خيار البحر، وlola نوع من الأصداف الكبيرة.
          en: Sasi is an old custom in Maluku and Papua - an area of sea or forest is closed for a time and nothing is taken, so life can recover. In many Raja Ampat villages sasi is declared in church. teripang is sea cucumber; lola is a large top shell.
      - speaker: Mama Ester
        text: Laut itu seperti mama, anak. Kalau ko ambil terus tanpa kasih dia istirahat, dia capek.
        ar_eg: البحر زي الأم يا ابني. لو فضلت تاخد منه على طول من غير ما تريّحه، بيتعب.
        ar: البحر كالأمّ يا بنيّ. إن ظللت تأخذ منه دون أن تمنحه راحة، تعب.
        en: The sea is like a mother, child. If you keep taking without letting her rest, she gets tired.
        note:
          ar_eg: ko = kamu، kasih = beri (يدّي).
          ar: ko = kamu، kasih = beri (يعطي).
          en: ko = kamu (Papuan Malay), kasih = beri (give).
      - speaker: Bayu
        text: Bapak, Mama, makasih banyak. Saya datang cari cerita, tapi pulang bawa pelajaran.
        ar_eg: يا باپاك، يا ماما، شكرًا. أنا جيت أدوّر على حكاية، بس راجع معايا درس.
        ar: يا باباك، يا ماما، شكرًا لكما. جئتُ أبحث عن حكاية، فعدتُ بدرس.
        en: Bapak, Mama, thank you. I came looking for a story, but I'm leaving with a lesson.
