questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: اسم «راجا أمبات» معناه إيه؟
      ar: ما معنى اسم «راجا أمبات»؟
      en: What does the name "Raja Ampat" mean?
    options: ["empat pulau besar", "tujuh telur", "raja laut", "empat raja"]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Mohon izin, kalau Bapak ___, saya ingin mendengar cerita tentang asal-usul Raja Ampat.
    meaning:
      ar_eg: بعد إذنك، لو حضرتك تسمح، حابب أسمع حكاية أصل راجا أمبات.
      ar: بعد إذنك، إن تكرّمتَ، أودّ أن أسمع حكاية أصل راجا أمبات.
      en: With your permission, if you'd be so kind, I'd like to hear the story of how Raja Ampat began.
    answers: [berkenan]
    options: ["menetas", "berkenan", "berbagi"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: إيه المعنى المستخبّي في جملة «الأربع ملوك لازم يتقاسموا البحر»؟
      ar: ما المعنى الضمني في عبارة «على الملوك الأربعة أن يتقاسموا البحر»؟
      en: What is the implicit message of "the four kings have to share the sea"?
    options: ["Kalau satu orang serakah, semua ikut rugi.", "Laut harus dibagi rata untuk turis.", "Raja harus tinggal di pulau yang besar.", "Telur harus disimpan di dalam noken."]
    answer: 0
  - id: q04
    type: listen
    text: Satu menjadi seorang putri yang kemudian pergi jauh menyeberangi laut.
    question:
      ar_eg: واحدة من البيضات طلع منها إيه؟
      ar: ماذا خرج من إحدى البيضات؟
      en: What did one of the eggs become?
    options: ["seekor penyu", "seorang putri", "sebuah perahu"]
    answer: 1
    meaning:
      ar_eg: واحدة طلع منها أميرة، وبعدين راحت بعيد وعدّت البحر.
      ar: خرجت من إحداها أميرة رحلت بعيدًا عبر البحر.
      en: One became a princess who later went far away across the sea.
  - id: q05
    type: translate
    direction: from_target
    source_text: Kami biarkan laut bernapas.
    answers_meaning:
      ar_eg: ["بنسيب البحر ياخد نفسه.", "بنخلّي البحر يتنفّس.", "بنسيب البحر يرتاح."]
      ar: ["ندع البحر يتنفّس.", "نترك البحر يتنفّس.", "نمنح البحر فرصة ليتنفّس."]
      en: ["We let the sea breathe.", "We leave the sea to breathe.", "We give the sea a chance to breathe."]
next:
  ar_eg: بايو راجع سورونج وبيكتب الحكاية، وكاك نيلا بتضحك عليه - «انت بتكتب saya saya على طول... هنا الناس بتقول sa!» وبالليل، مكالمة العيلة بقت فيها أربع لغات في دقيقة واحدة.
  ar: يعود بايو إلى سورونغ ويكتب الحكاية، فتضحك منه كاك نيلا - «تكتب saya في كلّ سطر... هنا يقول الناس sa!» وفي المساء يجتمع في مكالمة العائلة أربع لغات في دقيقة واحدة.
  en: Back in Sorong, Bayu writes up the tale, and Kak Nella laughs at him - "You keep writing saya, saya... here people say sa!" And that night, the family call fits four languages into one minute.
