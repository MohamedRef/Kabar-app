questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: ڤ في الـPegon بتتقري إزّاي؟
      ar: كيف تُقرأ ڤ في الـPegon؟
      en: How is ڤ read in Pegon?
    options: ["fa", "pa", "va"]
    answer: 1
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: في الـmakna gandul، «iku» بتعلّم إيه؟
      ar: في الـmakna gandul، علامَ تدلّ «iku»؟
      en: In makna gandul, what does "iku" mark?
    options: ["mubtada", "khabar", "fi'il"]
    answer: 1
  - id: q03
    type: fill_blank
    sentence: Ain mawi titik tiga punika "___".
    meaning:
      ar_eg: العين اللي فوقها تلات نقط دي «nga».
      ar: العين ذات النقاط الثلاث هي «nga».
      en: The ain with three dots is "nga".
    answers: [nga]
    options: ["nga", "nya", "gha"]
  - id: q04
    type: listen
    text: Nak Karim, kula tumut bingah sanget. Krama panjenengan sampun sae.
    question:
      ar_eg: پاك هارجو بيقول إيه عن كريم؟
      ar: ماذا يقول باك هارجو عن كريم؟
      en: What does Pak Harjo say about Karim?
    options: ["Krama panjenengan sampun sae", "Panjenengan kesupen", "Bukunipun dereng dados"]
    answer: 0
    meaning:
      ar_eg: يا ابني كريم، أنا مبسوط معاك أوي. الكراما بتاعتك بقت حلوة.
      ar: يا بنيّ كريم، أشاركك فرحتك كثيرًا. صارت كراماك حسنة.
      en: Karim, my boy, I'm truly happy for you. Your krama is good now.
  - id: q05
    type: translate
    direction: from_target
    source_text: Basa Arab lan basa Jawa sampun kekancan dangu sanget.
    answers_meaning:
      ar_eg: ["العربي والجاوي صحاب من زمان أوي.", "العربي والجاوي بقالهم زمان صحاب."]
      ar: ["العربية والجاوية صديقتان منذ زمن بعيد."]
      en: ["Arabic and Javanese have been friends for a very long time.", "Arabic and Javanese have long been friends."]
next:
  ar_eg: خلص الموسم الجاوي! كريم خلّص كرّاسته - سبعة وتلاتين صفحة، من جوجا لپليريد. والكتاب «الجاوي للمصريين»... لسّه بيستنّى أول قارئ - انت.
  ar: انتهى الموسم الجاويّ! أنهى كريم دفتره - سبع وثلاثون صفحة، من جوغجا إلى بليريد. والكتاب «الجاوية للمصريين»... ما زال ينتظر قارئه الأوّل - أنت.
  en: The Javanese season is over! Karim has finished his notebook - thirty-seven pages, from Jogja to Plered. And the book "Javanese for Egyptians"... is still waiting for its first reader - you.
