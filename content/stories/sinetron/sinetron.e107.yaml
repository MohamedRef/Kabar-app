title:
  target: Kaca pungkasan
  ar_eg: الصفحة الأخيرة
  ar: الصفحة الأخيرة
  en: The last page
summary:
  ar_eg: آخر حلقة في الموسم. في معهد ديني في پليريد، پاك كياي بيورّي كريم الجاوي مكتوب بالحروف العربي - الـPegon - وكريم بيقرا من أول نظرة. وفي كتاب قديم بيلاقي ترجمة كلمة بكلمة تحت العربي، وفيها كلمة «خبر» تاني. وفي الآخر، مكالمة فيديو مع كل صحابه من الرحلة، وكل واحد بيكلّمه بطريقته - وكريم بيردّ على كل واحد بلغته.
  ar: الحلقة الأخيرة من الموسم. في معهد دينيّ في بليريد، يُري باك كياي كريمًا الجاويةَ مكتوبةً بالحروف العربية - الـPegon - فيقرأ كريم من النظرة الأولى. وفي كتاب قديم يجد ترجمة كلمة بكلمة تحت العربية، وفيها كلمة «خبر» من جديد. وفي النهاية مكالمة فيديو مع كلّ أصدقاء الرحلة، يكلّمه كلّ منهم بطريقته، ويردّ كريم على كلّ واحد بلغته.
  en: The season finale. At a pesantren in Plered, Pak Kyai shows Karim Javanese written in Arabic letters - Pegon - and Karim reads it at first sight. In an old book he finds a word-by-word translation under the Arabic, with the word "khabar" again. At the end, a video call with all his friends from the journey, each speaking their own way - and Karim answers each in kind.
cast: [Karim, Pak Kyai, Mas Heru, Pak Budi, Pak Harjo, Mbak Ayu, Mas Dimas]
scenes:
  - setting:
      ar_eg: معهد ديني (pesantren) في پليريد، بعد المغرب. صوت الطلبة بيقروا قرآن. على الحيطة جدول مكتوب بحروف عربي، بس الكلام مش عربي.
      ar: معهد دينيّ (pesantren) في بليريد، بعد المغرب. أصوات الطلبة يقرؤون القرآن. على الجدار جدول بحروف عربية، لكنّ الكلام ليس عربيًّا.
      en: A pesantren in Plered, after the sunset prayer. The students' voices reciting. On the wall, a timetable in Arabic letters - but the words aren't Arabic.
    lines:
      - speaker: Pak Kyai
        text: Monggo pinarak, Nak Karim. Pak Harjo sampun cariyos babagan panjenengan.
        ar_eg: اتفضّل اقعد يا ابني كريم. پاك هارجو حكالي عنّك.
        ar: تفضّل اجلس يا بنيّ كريم. حدّثني باك هارجو عنك.
        en: Please have a seat, Karim. Pak Harjo has told me about you.
        note:
          ar_eg: "kyai = الشيخ اللي ماسك المعهد الديني. والمعاهد دي في جاوة بقالها قرون، وبيكتبوا فيها الجاوي بالحروف العربي. كلمات: nak = يا ابني (نداء)."
          ar: "kyai = الشيخ القائم على المعهد الدينيّ. ولهذه المعاهد في جاوة قرون، يُكتب فيها الجاويّ بالحروف العربية. مفردات: nak = يا بنيّ (نداء)."
          en: "kyai = the cleric who leads a pesantren. Java's pesantren go back centuries, and they write Javanese in Arabic letters. Words: nak = my boy, son (calling someone)."
      - speaker: Karim
        text: "Matur nuwun, Pak Kyai. Pak, ing tembok punika... nga... ji... ngaji! Kula saged maos!"
        ar_eg: متشكّر يا پاك كياي. يا پاك، على الحيطة دي... «ngaji»! أنا عارف أقرا!
        ar: شكرًا يا باك كياي. يا باك، على هذا الجدار... «ngaji»! أستطيع أن أقرأ!
        en: Thank you, Pak Kyai. Pak, on this wall... ngaji! I can read it!
        note:
          ar_eg: "على الحيطة بالپيجون (حروف عربي للجاوي): ڠاجي = ngaji. كلمات: tembok = حيطة، سور."
          ar: "على الجدار بالبيغون (حروف عربية للجاوية): ڠاجي = ngaji. مفردات: tembok = جدار، سور."
          en: "On the wall, in pegon (Arabic letters for Javanese): ڠاجي = ngaji. Words: tembok = wall."
      - speaker: Pak Kyai
        text: Punika Pegon, Nak. Aksara Arab kangge basa Jawa. Ain mawi titik tiga punika "nga".
        ar_eg: ده الـPegon يا ابني. حروف عربي للجاوي. العين اللي فوقها تلات نقط دي «nga».
        ar: هذا الـPegon يا بنيّ. حروف عربية للجاوية. والعين ذات النقاط الثلاث هي «nga».
        en: That's Pegon, my boy. Arabic letters for Javanese. The ain with three dots is "nga".
        note:
          ar_eg: "الحروف الزيادة في الـPegon - ڠ = ng، ڤ = p (مش ف!)، چ = c (تش)، ۑ = ny، ڮ = g، ڎ = dh، ڟ = th. وكل حركة بتتكتب حرف - ا ي و. كلمات: mawi = بـ، فيه (كراما)؛ nga = أسماء حروف جاوية."
          ar: "الحروف الزائدة في الـPegon - ڠ = ng، وڤ = p (لا ف!)، وچ = c (تش)، وۑ = ny، وڮ = g، وڎ = dh، وڟ = th. ويُكتب كلّ صائت حرفًا - ا ي و. مفردات: mawi = بـ، مع (كراما)؛ nga = أسماء حروف جاوية."
          en: "Pegon's extra letters - ڠ = ng, ڤ = p (not f!), چ = c (ch), ۑ = ny, ڮ = g, ڎ = dh, ڟ = th. Every vowel is written as a letter - ا ي و. Words: mawi = with (krama); nga = names of Javanese letters."
      - speaker: Karim
        text: "Lan pa ingkang mawi titik tiga punika \"pa\", sanes \"fa\"? Sae, tiyang Mesir asring kesupen \"p\", hehe."
        ar_eg: "والحرف اللي عليه تلات نقط ده «pa» مش «fa»؟ حلو، إحنا المصريين ساعات بننسى الـ«p»، هههه."
        ar: "وهذا الحرف ذو النقاط الثلاث «pa» لا «fa»؟ جميل، فنحن المصريين ننسى الـ«p» أحيانًا، هههه."
        en: "And the one with three dots is \"pa\", not \"fa\"? Good - we Egyptians often forget our \"p\", hehe."
        note:
          ar_eg: "ڤ = pa في الپيجون: فاء عليها تلات نقط. كلمات: sanes = مش (كراما)."
          ar: "ڤ = pa في البيغون: فاء عليها ثلاث نقاط. مفردات: sanes = ليس (كراما)."
          en: "ڤ = pa in pegon: fa with three dots. Words: sanes = not (krama)."
      - speaker: Pak Kyai
        text: Hahaha! Sakmenika "p" sampun wonten aksaranipun piyambak.
        ar_eg: ههههه! دلوقتي الـ«p» بقى ليها حرف لوحدها.
        ar: ههههه! صار للـ«p» الآن حرفها الخاصّ.
        en: Hahaha! Now "p" has a letter of its own.
        note:
          ar_eg: "كلمات: sakmenika = دلوقتي."
          ar: "مفردات: sakmenika = الآن."
          en: "Words: sakmenika = now."
  - setting:
      ar_eg: پاك كياي بيفتح كتاب قديم. سطور عربي كبيرة، وتحت كل كلمة كلام جاوي صغيّر مكتوب مايل.
      ar: يفتح باك كياي كتابًا قديمًا. سطور عربية كبيرة، وتحت كلّ كلمة كلام جاويّ صغير مكتوب مائلًا.
      en: Pak Kyai opens an old book. Big Arabic lines, and under each word, small slanted Javanese writing.
    lines:
      - speaker: Karim
        text: "Al-ilmu nur! Lan ing ngandhapipun... utawi ilmu iku cahya."
        ar_eg: العلم نور! وتحتها... «utawi ilmu iku cahya».
        ar: العلم نور! وتحتها... «utawi ilmu iku cahya».
        en: Knowledge is light! And underneath... utawi ilmu iku cahya.
        note:
          ar_eg: "مكتوب بالعربي: العلم نور. كلمات: ilmu = علم، معرفة."
          ar: "مكتوب بالعربية: العلم نور. مفردات: ilmu = علم، معرفة."
          en: "Written in Arabic: العلم نور. Words: ilmu = knowledge, science."
      - speaker: Pak Kyai
        text: Punika makna gandul, Nak. "Utawi" nedahaken mubtada, "iku" nedahaken khabar.
        ar_eg: دي اسمها «makna gandul» يا ابني، المعنى المتعلّق. «utawi» بتعلّم المبتدأ، و«iku» بتعلّم الخبر.
        ar: هذه تسمّى «makna gandul» يا بنيّ، المعنى المعلّق. «utawi» تدلّ على المبتدأ، و«iku» تدلّ على الخبر.
        en: That's makna gandul, my boy - the hanging meaning. "Utawi" marks the mubtada, "iku" marks the khabar.
        note:
          ar_eg: "makna gandul = ترجمة جاوي كلمة بكلمة «متعلّقة» تحت النص العربي، وبتشرح النحو كمان. utawi = المبتدأ (رمزها م)، iku = الخبر (رمزها خ). طريقة المعاهد في جاوة من قرون. كلمات: nedahaken = بيشاور على، بيوضّح (كراما)."
          ar: "makna gandul = ترجمة جاوية كلمةً بكلمة «معلّقة» تحت النصّ العربيّ، تشرح النحو أيضًا. utawi = المبتدأ (رمزها م)، وiku = الخبر (رمزها خ). طريقة معاهد جاوة منذ قرون. مفردات: nedahaken = يشير إلى، يُظهر (كراما)."
          en: "makna gandul = a word-by-word Javanese gloss \"hanging\" under the Arabic text, which also shows the grammar. utawi = mubtada (marked م), iku = khabar (marked خ). The way Java's pesantren have read for centuries. Words: nedahaken = to show, mark (krama)."
      - speaker: Karim
        text: Khabar! Malih tembung kabar! Pak, basa Arab lan basa Jawa sampun kekancan dangu sanget.
        ar_eg: خبر! كلمة «kabar» تاني! يا پاك، العربي والجاوي صحاب من زمان أوي.
        ar: خبر! كلمة «kabar» من جديد! يا باك، العربية والجاوية صديقتان منذ زمن بعيد.
        en: Khabar! The word kabar again! Pak, Arabic and Javanese have been friends for a very long time.
        note:
          ar_eg: "كلمات: kekancan = يصاحب، يبقوا صحاب."
          ar: "مفردات: kekancan = يصادق، يكونان صديقين."
          en: "Words: kekancan = to be friends (with)."
      - speaker: Pak Kyai
        text: Leres, Nak. Kados panjenengan kaliyan kita sedaya.
        ar_eg: صحّ يا ابني. زيّك انت وإحنا كلّنا.
        ar: صحيح يا بنيّ. مثلك أنت ونحن جميعًا.
        en: True, my boy. Like you and all of us.
  - setting:
      ar_eg: بالليل، على حصيرة في المعهد. تليفون كريم بيرنّ - مكالمة فيديو جماعية. وشوش كتير على الشاشة، من جوجا لماديون.
      ar: ليلًا، على حصير في المعهد. يرنّ هاتف كريم - مكالمة فيديو جماعية. وجوه كثيرة على الشاشة، من جوغجا إلى ماديون.
      en: Night, on a mat at the pesantren. Karim's phone rings - a group video call. Many faces on the screen, from Jogja to Madiun.
    lines:
      - speaker: Mas Heru
        text: Rim! Piye kabare? Wis dadi wong Jawa tenan, durung?
        ar_eg: يا كريم! أخبارك إيه؟ بقيت جاوي بجدّ ولّا لسّه؟
        ar: يا كريم! كيف حالك؟ هل صرت جاويًّا حقًّا أم ليس بعد؟
        en: Rim! How are you? Turned into a real Javanese yet?
      - speaker: Karim
        text: Apik, Mas! Wis, to. Suwun, ya!
        ar_eg: تمام يا ماس! طبعًا بقيت. تسلم!
        ar: بخير يا ماس! طبعًا صرت. شكرًا!
        en: Great, Mas! Of course I have. Cheers!
        note:
          ar_eg: كريم بيردّ على كل واحد بلغته - نجوكو الشارع مع ماس هيرو، نجوكو مع پاك بودي، كراما مع پاك هارجو. ده بالظبط اللي اتعلّمه في الرحلة كلّها.
          ar: يردّ كريم على كلّ واحد بلغته - ونغوكو الشارع مع ماس هيرو، والنغوكو مع باك بودي، والكراما مع باك هارجو. هذا بالضبط ما تعلّمه في الرحلة كلّها.
          en: Karim answers each in kind - street ngoko with Mas Heru, ngoko with Pak Budi, krama with Pak Harjo. Exactly what he learned on the whole journey.
      - speaker: Pak Budi
        text: Karim, aku bangga karo kowe. Mampir Madiun maneh, ya. Pecele isih enak!
        ar_eg: يا كريم، أنا فخور بيك. عدّي على ماديون تاني. البيتشيل لسّه حلو!
        ar: يا كريم، أنا فخور بك. مرّ بماديون مجدّدًا. ما زال البيتشيل لذيذًا!
        en: Karim, I'm proud of you. Drop by Madiun again. The pecel is still delicious!
        note:
          ar_eg: "كلمات: pecele = البيچل (pecel + -e)."
          ar: "مفردات: pecele = البيتشل (pecel + -e)."
          en: "Words: pecele = the pecel (pecel + -e)."
      - speaker: Karim
        text: Mesthi, Pak Budi! Aku kangen sambel pecele.
        ar_eg: أكيد يا پاك بودي! وحشتني صلصة البيتشيل.
        ar: بالتأكيد يا باك بودي! اشتقت إلى صلصة البيتشيل.
        en: Of course, Pak Budi! I miss the pecel sauce.
      - speaker: Pak Harjo
        text: Nak Karim, kula tumut bingah sanget. Krama panjenengan sampun sae.
        ar_eg: يا ابني كريم، أنا مبسوط معاك أوي. الكراما بتاعتك بقت حلوة.
        ar: يا بنيّ كريم، أشاركك فرحتك كثيرًا. صارت كراماك حسنة.
        en: Karim, my boy, I'm truly happy for you. Your krama is good now.
      - speaker: Karim
        text: Matur nuwun sanget, Pak Harjo. Sedaya punika saking piwulang panjenengan.
        ar_eg: متشكّر أوي يا پاك هارجو. كل ده من تعليم حضرتك.
        ar: شكرًا جزيلًا يا باك هارجو. كلّ هذا من تعليمك.
        en: Thank you so much, Pak Harjo. All of this comes from your teaching.
      - speaker: Mbak Ayu
        text: Mas, bukumu kapan dadi? Aku pengin tuku sing pertama!
        ar_eg: يا ماس، كتابك هيخلص إمتى؟ أنا عايزة أشتري أول نسخة!
        ar: يا ماس، متى ينتهي كتابك؟ أريد أن أشتري النسخة الأولى!
        en: Mas, when will your book be done? I want to buy the first copy!
        note:
          ar_eg: "كلمات: pengin = عايز، نفسه."
          ar: "مفردات: pengin = يريد، يرغب."
          en: "Words: pengin = to want, wish."
      - speaker: Mas Dimas
        text: Lan aja lali pembatas buku saka Jagalan, Mas!
        ar_eg: ومتنساش فاصل الكتاب بتاع جاجالان يا ماس!
        ar: ولا تنسَ فاصل الكتاب من جاغالان يا ماس!
        en: And don't forget the bookmark from Jagalan, Mas!
      - speaker: Narrator
        text: Ing kaca pungkasan, Karim nulis judhul bukune ing telung aksara. Latin, aksara Jawa, lan Pegon. Kabar saka Mesir wis tekan Jawa.
        ar_eg: في الصفحة الأخيرة، كريم كتب اسم كتابه بتلات خطوط. لاتيني، وجاوي، وعربي. «خبر» من مصر وصل جاوة.
        ar: في الصفحة الأخيرة كتب كريم عنوان كتابه بثلاثة خطوط. اللاتينيّ والجاويّ والعربيّ. «خبرٌ» من مصر بلغ جاوة.
        en: On the last page, Karim writes his book's title in three scripts. Latin, Javanese script and Pegon (Basa Jawa, ꦧꦱꦗꦮ, باسا جاوا). News from Egypt has reached Java.
        note:
          ar_eg: "كلمات: telung = تلات (قبل اسم)."
          ar: "مفردات: telung = ثلاثة (قبل الاسم)."
          en: "Words: telung = three (before a noun)."
