questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الناس في القاهرة بيجيبوا معاهم إيه لعربية الفول؟
      ar: ماذا يحمل الناس في القاهرة إلى عربة الفول؟
      en: What do people in Cairo bring to the ful cart?
    options: ["kantong plastik", "botol minum", "panci sendiri", "daun pisang"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Penjualnya ___ ful langsung ke panci pembeli.
    meaning:
      ar_eg: البيّاع بيصبّ الفول في حلّة الزبون على طول.
      ar: يصبّ البائع الفول مباشرة في قدر المشتري.
      en: The seller pours the ful straight into the customer's pot.
    answers: [menuangkan]
    options: ["menuangkan", "menyediakan", "mengurangi"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه ورق الموز بقى غالي في ماديون؟
      ar: لماذا غلا ورق الموز في ماديون؟
      en: Why have banana leaves become expensive in Madiun?
    options: ["Karena hujan deras.", "Karena semua warung ikut-ikutan.", "Karena Mas Joko membeli semuanya.", "Karena pasar tutup."]
    answer: 1
  - id: q04
    type: listen
    text: Pelanggan yang bawa rantang sendiri dapat diskon dua ribu rupiah.
    question:
      ar_eg: الزبون اللي يجيب عموده ياخد خصم قدّ إيه؟
      ar: كم خصمًا يحصل عليه الزبون الذي يحضر عموده؟
      en: How much discount does a customer with their own rantang get?
    options: ["dua ribu rupiah", "dua puluh ribu rupiah", "lima ribu rupiah"]
    answer: 0
    meaning:
      ar_eg: الزبون اللي يجيب عموده معاه ياخد خصم ألفين روبية.
      ar: الزبون الذي يحضر عموده يحصل على خصم ألفي روبية.
      en: Customers who bring their own rantang get two thousand rupiah off.
  - id: q05
    type: translate
    direction: from_target
    source_text: Kantin nggak menyediakan sedotan plastik lagi.
    answers_meaning:
      ar_eg: ["الكانتين بطّل يدّي شفاطات بلاستيك.", "الكانتين مبقاش فيه شفّاطات بلاستيك.", "خلاص الكانتين مبقاش بيوفّر شفّاطات بلاستيك."]
      ar: ["لم يعد المقصف يوفّر الشفّاطات البلاستيكية.", "لم يعد المقصف يقدّم المصّاصات البلاستيكية.", "توقّف المقصف عن توفير الشفّاطات البلاستيكية."]
      en: ["The canteen doesn't provide plastic straws any more.", "The canteen no longer gives out plastic straws.", "The canteen has stopped providing plastic straws."]
next:
  ar_eg: بكرة حفلة تخرّج ساري. هي سهرانة بتكتب الخطبة... وكريم اشترى قميص جديد. ليه يا ترى؟
  ar: غدًا حفل تخرّج ساري. إنها ساهرة تكتب خطبتها... وكريم اشترى قميصًا جديدًا. تُرى لماذا؟
  en: Tomorrow is Sari's graduation. She's up late writing her speech... and Karim has bought a new shirt. Now why would that be?
