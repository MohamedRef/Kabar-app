title:
  target: Panci, Rantang, dan Kendi
  ar_eg: الحلّة والعَمود والقلّة
  ar: القِدر والعمود والقُلّة
  en: Pots, Tiffins and Water Jars
summary:
  ar_eg: في مشية الصبح في القاهرة، پاك بودي بيشوف الناس جايبين حللهم لعربية الفول، وزير مية في ناصية الشارع لأي حدّ معدّي. الأفكار دي بتسافر لماديون، والوارونج بيقلّل الزبالة... ومدرسة بايو بتنضمّ كمان.
  ar: في نزهة الصباح في القاهرة يرى باك بودي الناس يحملون قدورهم إلى عربة الفول، وزيرًا من الماء عند ناصية الشارع لكلّ عابر. تسافر هذه الأفكار إلى ماديون، فيقلّل الوارونغ نفاياته... وتنضمّ مدرسة بايو أيضًا.
  en: On a morning walk in Cairo, Pak Budi sees people bringing their own pots to the ful cart, and a water jar on the corner for anyone passing by. The ideas travel to Madiun, the warung cuts its waste... and Bayu's school joins in.
cast: [Pak Budi, Karim, Bayu, Bu Tini, Mas Joko, Bu Rahayu]
scenes:
  - setting:
      ar_eg: القاهرة، الساعة ٧ الصبح. پاك بودي خفّ ورجع يتمشّى الصبح، وكريم ماشي معاه زي أيام ماديون.
      ar: القاهرة، السابعة صباحًا. تعافى باك بودي وعاد إلى مشي الصباح، وكريم يرافقه كما في أيام ماديون.
      en: Cairo, 7 a.m. Pak Budi is well again and back to his morning walks, with Karim beside him just like in Madiun.
    lines:
      - speaker: Pak Budi
        text: Mas Karim, lihat deh! Orang-orang itu bawa panci sendiri ke gerobak ful.
        ar_eg: يا ماس كريم، بصّ! الناس دي جايبة حللها معاها لعربية الفول.
        ar: يا ماس كريم، انظر! هؤلاء الناس يحملون قدورهم إلى عربة الفول.
        en: Mas Karim, look! Those people are bringing their own pots to the ful cart.
      - speaker: Karim
        text: Di Mesir itu biasa, Pak. Penjualnya menuangkan ful langsung ke panci pembeli, jadi nggak perlu kantong plastik.
        ar_eg: ده عادي في مصر يا پاك. البيّاع بيصبّ الفول في حلّة الزبون على طول، فمش محتاجين أكياس بلاستيك.
        ar: هذا مألوف في مصر يا باك. يصبّ البائع الفول مباشرة في قدر المشتري، فلا حاجة إلى الأكياس البلاستيكية.
        en: That's normal in Egypt, Pak. The seller pours the ful straight into the customer's pot, so there's no need for plastic bags.
        note:
          ar_eg: menuangkan (يصبّ) من tuang + meN-kan. أفعال meN-kan بتيجي كتير في كلام البيئة - menggunakan (يستعمل)، menyediakan (يوفّر)، membersihkan (ينضّف).
          ar: menuangkan (يصبّ) من tuang مع meN-kan. وتكثر أفعال meN-kan في حديث البيئة - menggunakan (يستعمل)، menyediakan (يوفّر)، membersihkan (ينظّف).
          en: menuangkan (to pour) is tuang + meN-kan. meN-kan verbs are everywhere in environmental talk - menggunakan (use), menyediakan (provide), membersihkan (clean).
      - speaker: Pak Budi
        text: Kayak rantang di Jawa zaman dulu! Almarhumah ibu Bapak dulu beli lauk pake rantang.
        ar_eg: زي العَمود (الرانتانج) في جاوة زمان! أمّي الله يرحمها كانت بتشتري الأكل بالعمود.
        ar: كالعمود (الرانتانغ) في جاوة قديمًا! كانت أمّي رحمها الله تشتري الطعام بالعمود.
        en: Like the rantang tiffins in old Java! My late mother used to buy food in a rantang.
        note:
          ar_eg: rantang هو العَمود - صفايح معدن فوق بعض بيد واحدة، كان الناس بيشيلوا فيه الأكل في جاوة، زي العمود اللي كان بيتبعت فيه الأكل للشغل في مصر زمان. وفي الكلام kayak = seperti، pake = pakai (بـ).
          ar: rantang هو «العمود» - أوعية معدنية متراكبة بمقبض واحد، كان الناس في جاوة يحملون فيها الطعام، كالعمود الذي كان يُرسل فيه الغداء إلى العمل في مصر قديمًا.
          en: A rantang is a stacked metal tiffin carrier with one handle - Javanese families carried food in them, much like the old Egyptian "amood" lunch carrier. In speech, kayak = seperti, pake = pakai (with, using).
      - speaker: Narrator
        text: Di pojok jalan, ada sebuah kendi besar dari tanah liat. Orang yang lewat bisa minum air dingin dengan gratis.
        ar_eg: في ناصية الشارع فيه زير كبير من الفخّار. أي حدّ معدّي يقدر يشرب مية ساقعة ببلاش.
        ar: عند ناصية الشارع زير كبير من الفخّار، يشرب منه كلّ عابر ماءً باردًا مجّانًا.
        en: On the street corner there's a big clay water jar. Anyone passing by can drink cold water for free.
      - speaker: Karim
        text: Itu namanya zir. Orang nyediain air buat siapa aja yang lewat. Kata nenek saya, pahalanya besar.
        ar_eg: ده اسمه زير. الناس بيحطّوا مية لأي حدّ معدّي. وستّي كانت بتقول إن ثوابه كبير.
        ar: هذا اسمه الزير. يوفّر الناس الماء لكلّ عابر سبيل. وكانت جدّتي تقول إنّ ثوابه عظيم.
        en: That's called a zir. People provide water for anyone who passes. My grandmother used to say it earns great reward.
        note:
          ar_eg: والغريب إن في جاوة كمان فيه عادة قديمة - الناس بتحطّ kendi (قلّة) مية قدّام البيت للماشيين في الطريق. وpahala (ثواب) أصلها سنسكريتي، مش عربي. وnyediain = menyediakan (يوفّر) في الكلام.
          ar: والطريف أنّ في جاوة عادة قديمة مشابهة - يضع الناس kendi (قُلّة) ماء أمام البيت للمارّة. أمّا pahala (الثواب) فأصلها سنسكريتي لا عربي.
          en: Funnily enough, Java has an old custom too - people put a kendi (clay jug) of water outside the house for passers-by. pahala (religious reward) is from Sanskrit, not Arabic. nyediain = menyediakan (provide) in everyday speech.
      - speaker: Pak Budi
        text: Dingin, gratis, nggak pakai botol plastik! Ide-ide ini harus Bapak bawa pulang ke Madiun.
        ar_eg: ساقعة، ببلاش، ومن غير إزايز بلاستيك! الأفكار دي لازم أخدها معايا لماديون.
        ar: باردة ومجّانية وبلا زجاجات بلاستيكية! لا بدّ أن آخذ هذه الأفكار معي إلى ماديون.
        en: Cold, free, and no plastic bottles! I have to take these ideas home to Madiun.
      - speaker: Karim
        text: Bapak mau bikin warung bebas sampah?
        ar_eg: عايز تخلّي الوارونج من غير زبالة يا پاك؟
        ar: أتريد أن تجعل الوارونغ خاليًا من النفايات؟
        en: You want to make the warung zero-waste?
        note:
          ar_eg: bikin = membuat، menjadikan (يعمل، يخلّي) - كلام كل يوم.
          ar: bikin = membuat، menjadikan (يجعل) في الكلام اليومي.
          en: bikin = membuat, menjadikan (make) - everyday speech.
      - speaker: Pak Budi
        text: Bayu udah mulai tanpa kantong plastik. Sekarang kita lanjutin. Pecel dibungkus daun pisang lagi, kayak dulu.
        ar_eg: بايو بدأ خلاص من غير أكياس بلاستيك. ودلوقتي نكمّل. البيچيل يتلفّ في ورق موز تاني، زي زمان.
        ar: بدأ بايو بالاستغناء عن الأكياس البلاستيكية، والآن نواصل. يُلفّ البيتشيل بورق الموز من جديد كما كان قديمًا.
        en: Bayu already started with no plastic bags. Now we keep going. Pecel wrapped in banana leaves again, like the old days.
        note:
          ar_eg: البيچيل الماديوني من زمان بيتقدّم في pincuk - ورقة موز متطبّقة على شكل طبق. ده «الطبق» الأصلي اللي بيرجع للأرض. وudah = sudah، lanjutin = lanjutkan (نكمّل)، kayak = seperti.
          ar: يُقدَّم البيتشيل الماديوني تقليديًّا في pincuk، وهي ورقة موز مطويّة على هيئة طبق. إنه الطبق الأصلي الذي يعود إلى الأرض. وفي الكلام اليومي udah = sudah، lanjutin = lanjutkan (نواصل)، kayak = seperti.
          en: Madiun pecel is traditionally served in a pincuk, a banana leaf folded into a bowl - the original plate that goes back to the soil. udah = sudah, lanjutin = lanjutkan (carry on), kayak = seperti.
  - setting:
      ar_eg: ماديون، بالليل، بعد أسبوع. بايو بيكلّم القاهرة فيديو من الوارونج. ورا منه، رانتانجات متصفّفة على الرفّ.
      ar: ماديون، ليلًا، بعد أسبوع. يتّصل بايو بالقاهرة من الوارونغ. وخلفه أوعية رانتانغ مصفوفة على الرفّ.
      en: Madiun, one evening a week later. Bayu video-calls Cairo from the warung. Behind him, rantang tiffins are lined up on a shelf.
    lines:
      - speaker: Bayu
        text: Pak! Ide rantang Bapak udah jalan lho. Pelanggan yang bawa rantang sendiri dapat diskon dua ribu rupiah.
        ar_eg: بابا! فكرة العمود بتاعتك اشتغلت. الزبون اللي يجيب عموده معاه ياخد خصم ألفين روبية.
        ar: أبي! نُفّذت فكرة العمود. الزبون الذي يحضر عموده يحصل على خصم ألفي روبية.
        en: Dad! Your rantang idea is up and running. Customers who bring their own rantang get two thousand rupiah off.
        note:
          ar_eg: udah = sudah، وbawa = membawa (يجيب) في الكلام.
          ar: udah = sudah، وbawa = membawa (يُحضر) في الكلام اليومي.
          en: udah = sudah, bawa = membawa (bring) in everyday speech.
      - speaker: Bu Tini
        text: Tiga hari ini saya bawa rantang terus, Pak Budi. Hemat, sampahnya juga nggak ada!
        ar_eg: أنا بقالي تلات أيام بجيب العمود يا پاك بودي. توفير، ومفيش زبالة خالص!
        ar: أحضر عمودي منذ ثلاثة أيام يا باك بودي. توفير، ولا نفايات على الإطلاق!
        en: I've brought my rantang three days running, Pak Budi. It saves money, and there's no rubbish at all!
      - speaker: Mas Joko
        text: Tapi ada masalah, Pak. Gara-gara semua warung ikut-ikutan, daun pisang di pasar jadi mahal!
        ar_eg: بس فيه مشكلة يا پاك. عشان كل الوارونجات قلّدونا، ورق الموز في السوق بقى غالي!
        ar: لكن هناك مشكلة يا باك. بسبب تقليد كلّ الوارونغات لنا، صار ورق الموز في السوق غاليًا!
        en: But there's a problem, Pak. Because every warung's copying us, banana leaves at the market have got expensive!
      - speaker: Pak Budi
        text: Wah, itu sih masalah yang bagus, Mas!
        ar_eg: ياه، دي مشكلة حلوة يا ماس!
        ar: يا سلام، هذه مشكلة جميلة يا ماس!
        en: Well, that's a nice problem to have, Mas!
      - speaker: Bayu
        text: Ada berita lagi. Guru BK baca berita tentang warung kita. Akibatnya, sekolahku ikut! Kantin nggak menyediakan sedotan plastik lagi, terus semua siswa bawa botol minum sendiri.
        ar_eg: وفيه خبر كمان. مدرّس الإرشاد قرا الخبر عن الوارونج. والنتيجة إن مدرستي دخلت معانا! الكانتين بطّل يدّي شفاطات بلاستيك، وكل الطلبة بيجيبوا إزايزهم معاهم.
        ar: وهناك خبر آخر. قرأ المرشد المدرسي الخبر عن الوارونغ، ونتيجة لذلك انضمّت مدرستي! لم يعد المقصف يوفّر الشفّاطات البلاستيكية، وصار كلّ الطلاب يحضرون قواريرهم.
        en: There's more news. The guidance teacher read the story about our warung. As a result, my school's joining in! The canteen doesn't give out plastic straws any more, and every student brings their own water bottle.
        note:
          ar_eg: في إندونيسيا فيه برنامج حكومي اسمه Adiwiyata بيدّي لقب «مدرسة خضرا» للمدارس اللي بتحافظ على البيئة. ومدن كتير منعت أكياس البلاستيك واحدة ورا التانية. وفي الكلام baca = membaca، bawa = membawa.
          ar: في إندونيسيا برنامج حكومي اسمه Adiwiyata يمنح المدارس الصديقة للبيئة لقب «المدرسة الخضراء». وقد منعت مدن كثيرة الأكياس البلاستيكية واحدة تلو الأخرى.
          en: Indonesia has a government programme, Adiwiyata, that recognises environmentally friendly "green schools". And city after city has banned plastic bags. In speech, baca = membaca, bawa = membawa.
      - speaker: Bu Rahayu
        text: Masyaallah, Le. Dari satu surat jadi satu sekolah!
        ar_eg: ما شاء الله يا ابني. من جواب واحد لمدرسة بحالها!
        ar: ما شاء الله يا بنيّ. من رسالة واحدة إلى مدرسة كاملة!
        en: Masyaallah, son. From one letter to a whole school!
      - speaker: Mas Joko
        text: Ide zir dari Kairo juga udah ada, Pak. Kita taruh kendi air di depan warung buat orang yang lewat.
        ar_eg: وفكرة الزير اللي من القاهرة اتعملت كمان يا پاك. حطّينا قلّة مية قدّام الوارونج للناس المعدّية.
        ar: وفكرة الزير القادمة من القاهرة نُفّذت أيضًا يا باك. وضعنا قُلّة ماء أمام الوارونغ للمارّة.
        en: The zir idea from Cairo is here too, Pak. We've put a water jug outside the warung for passers-by.
        note:
          ar_eg: taruh = menaruh (يحطّ)، udah = sudah - كلام كل يوم. وkendi = قلّة.
          ar: taruh = menaruh (يضع)، udah = sudah في الكلام اليومي. وkendi = إبريق فخّار.
          en: taruh = menaruh (put), udah = sudah - everyday speech. kendi = clay jug.
      - speaker: Bayu
        text: Tugas eksposisiku berikutnya tentang lingkungan. Judulnya, "Dari Kairo ke Madiun, Belajar Mengurangi Sampah".
        ar_eg: موضوع التعبير الجاي بتاعي عن البيئة. عنوانه «من القاهرة لماديون - نتعلّم نقلّل الزبالة».
        ar: مقالي التفسيري القادم عن البيئة، وعنوانه «من القاهرة إلى ماديون - نتعلّم تقليل النفايات».
        en: My next exposition is about the environment. It's called "From Cairo to Madiun - Learning to Cut Waste".
      - speaker: Pak Budi
        text: Jadi, koki apa wartawan, Le?
        ar_eg: يعني طبّاخ ولا صحفي يا ابني؟
        ar: إذن، طاهٍ أم صحفي يا بنيّ؟
        en: So, chef or journalist, son?
      - speaker: Bayu
        text: Dua-duanya, Pak. Koki yang menulis!
        ar_eg: الاتنين يا بابا. طبّاخ بيكتب!
        ar: الاثنان يا أبي. طاهٍ يكتب!
        en: Both, Dad. A chef who writes!
