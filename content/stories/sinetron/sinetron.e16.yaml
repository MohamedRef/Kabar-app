questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: پاك بودي لازم يرتاح قد إيه؟
      ar: كم يجب أن يرتاح باك بودي؟
      en: How long does Pak Budi have to rest?
    options: ["dua hari", "dua minggu", "dua bulan"]
    answer: 1
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: الأوضة اللي للإيجار فين؟
      ar: أين الغرفة المعروضة للإيجار؟
      en: Where is the room for rent?
    options: ["di seberang warung", "di sebelah masjid", "di rumah sakit", "di ujung gang"]
    answer: 3
  - id: q03
    type: fill_blank
    sentence: Bu Rahayu, ___ istirahat.
    meaning:
      ar_eg: يا بو راهايو، ارتاحي من فضلك.
      ar: يا بو راهايو، استريحي من فضلك.
      en: Bu Rahayu, please rest.
    answers: [tolong]
    options: ["tolong", "kosong", "sewa"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: الإيجار كام وشامل إيه؟
      ar: كم الإيجار وماذا يشمل؟
      en: How much is the rent, and what's included?
    options: ["Lima ratus ribu sebulan, termasuk listrik.", "Lima puluh ribu sehari, termasuk makan.", "Lima ratus ribu seminggu, termasuk listrik."]
    answer: 0
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اتفضّل ادخل المطبخ.
      ar: تفضّل بالدخول إلى المطبخ.
      en: Please, come into the kitchen.
    answers: ["Silakan masuk ke dapur.", "Silakan masuk ke dapur", "Silakan masuk dapur.", "Silakan ke dapur.", "Mari masuk ke dapur."]
next:
  ar_eg: الدكتور إدّى پاك بودي «روشتة» غريبة شوية - رياضة كل يوم! وبالليل، بايو بيكلّم ساري سرًّا عشان يقولها على خطته الحقيقية.
  ar: وصف الطبيب لباك بودي «وصفة» غريبة بعض الشيء، وهي الرياضة كل يوم! وفي الليل يتّصل بايو بساري سرًّا ليكشف لها خطّته الحقيقية.
  en: The doctor has given Pak Budi an unusual prescription — exercise every day! And at night, Bayu secretly calls Sari to tell her his real plan.
