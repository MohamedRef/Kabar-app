title:
  target: Tetangga di Gang Kami
  ar_eg: جيران حارتنا
  ar: جيران زقاقنا
  en: The Neighbours on Our Lane
summary:
  ar_eg: ساري عرفت إن أبوها لازم يرتاح أسبوعين، والحاجّة فاطمة بتهوّن عليها. وفي ماديون الجيران بيشيلوا الوارونج مع بعض، وكريم بيدوّر على أوضة يأجّرها في آخر الحارة.
  ar: تعلم ساري أن أباها يجب أن يرتاح أسبوعين، وتواسيها الحاجّة فاطمة. وفي ماديون يتعاون الجيران على تشغيل الوارونغ، ويبحث كريم عن غرفة يستأجرها في آخر الزقاق.
  en: Sari learns her dad must rest for two weeks, and Hagga Fatma comforts her. In Madiun the neighbours pitch in at the warung, and Karim looks for a room to rent at the end of the lane.
cast: [Sari, Bu Rahayu, Hagga Fatma, Mas Joko, Bu Tini, Karim, Pak Budi]
scenes:
  - setting:
      ar_eg: أوضة ساري في القاهرة، الساعة ١١ بالليل (في ماديون ٤ الفجر، وقت السحور).
      ar: غرفة ساري في القاهرة، الساعة الحادية عشرة ليلًا (الرابعة فجرًا في ماديون، وقت السحور).
      en: Sari's room in Cairo, 11 p.m. (4 a.m. in Madiun — sahur time).
    lines:
      - speaker: Narrator
        text: Kairo. Jam sebelas malam. Di Madiun sudah jam empat pagi.
        ar_eg: القاهرة. الساعة ١١ بالليل. في ماديون الساعة بقت ٤ الفجر.
        ar: القاهرة. الساعة الحادية عشرة ليلًا. في ماديون صارت الرابعة فجرًا.
        en: Cairo. Eleven at night. In Madiun it's already four in the morning.
      - speaker: Sari
        text: Bu, bagaimana Bapak?
        ar_eg: ماما، بابا عامل إيه؟
        ar: أمي، كيف حال أبي؟
        en: Mum, how's Dad?
      - speaker: Bu Rahayu
        text: Kemarin Bapak ke rumah sakit, Nduk. Bapak harus istirahat dua minggu.
        ar_eg: إمبارح بابا راح المستشفى يا بنتي. لازم يرتاح أسبوعين.
        ar: أمس ذهب أبوكِ إلى المستشفى يا ابنتي. يجب أن يرتاح أسبوعين.
        en: Yesterday Dad went to the hospital, sweetheart. He has to rest for two weeks.
        note:
          ar_eg: rumah sakit حرفيًا «بيت العيانين» - اسم مركّب من rumah (بيت) وsakit (عيّان). زي rumah makan (مطعم) وkamar mandi (حمّام).
          ar: rumah sakit حرفيًّا «بيت المرضى»، اسم مركّب من rumah (بيت) وsakit (مريض)، مثل rumah makan (مطعم) وkamar mandi (حمّام).
          en: rumah sakit is literally "sick house" — a compound like rumah makan (restaurant) and kamar mandi (bathroom).
      - speaker: Sari
        text: Dua minggu? Bu, saya mau pulang!
        ar_eg: أسبوعين؟ ماما، أنا عايزة أرجع!
        ar: أسبوعان؟ أمي، أريد أن أعود!
        en: Two weeks? Mum, I want to come home!
      - speaker: Bu Rahayu
        text: Jangan, Nduk. Kamu belajar di sana. Tetangga kita baik.
        ar_eg: لأ يا بنتي. انتي بتذاكري هناك. وجيراننا ناس طيبين.
        ar: لا يا ابنتي. أنتِ تدرسين هناك. وجيراننا طيّبون.
        en: No, sweetheart. You're studying there. Our neighbours are good people.
      - speaker: Hagga Fatma
        text: Sari? Kamu belum tidur? Ini teh untuk kamu. Silakan.
        ar_eg: ساري؟ لسه منمتيش؟ ده شاي عشانك. اتفضّلي.
        ar: ساري؟ ألم تنامي بعد؟ هذا شاي لكِ. تفضّلي.
        en: Sari? Not asleep yet? Here's some tea for you. Go on.
      - speaker: Sari
        text: Terima kasih, Hagga. Ayah saya kurang sehat.
        ar_eg: شكرًا يا حاجّة. أبويا صحته مش كويسة.
        ar: شكرًا يا حاجّة. أبي ليس بصحّة جيّدة.
        en: Thank you, Hagga. My father isn't well.
      - speaker: Hagga Fatma
        text: Kalau kamu perlu apa-apa, tolong panggil saya. Kamar saya di seberang.
        ar_eg: لو احتجتي أي حاجة، نادي عليّا. أوضتي قصادك.
        ar: إن احتجتِ إلى أيّ شيء فنادِيني من فضلكِ. غرفتي في الجهة المقابلة.
        en: If you need anything at all, please call me. My room is just across.
        note:
          ar_eg: tolong قبل الفعل = «لو سمحت / من فضلك» لما بتطلب مساعدة. وsilakan = «اتفضّل» لما بتعزم أو بتدّي حاجة.
          ar: tolong قبل الفعل تعني «من فضلك» عند طلب المساعدة، وsilakan تعني «تفضّل» عند الدعوة أو العرض.
          en: tolong + verb = "please (help me)"; silakan = "go ahead / please do", for offers.
  - setting:
      ar_eg: ماديون الصبح. الوارونج مقفول، بس الحارة الضيّقة (gang) اللي قدّامه مليانة جيران.
      ar: ماديون صباحًا. الوارونغ مغلق، لكن الزقاق الضيّق (gang) أمامه مليء بالجيران.
      en: Madiun, morning. The warung is shut, but the narrow lane (gang) in front of it is full of neighbours.
    lines:
      - speaker: Narrator
        text: Madiun. Pagi. Warung Pak Budi tutup. Tapi di gang ramai.
        ar_eg: ماديون. الصبح. وارونج پاك بودي مقفول. بس الحارة زحمة.
        ar: ماديون. صباحًا. وارونغ باك بودي مغلق، لكن الزقاق مزدحم.
        en: Madiun. Morning. Pak Budi's warung is shut. But the lane is busy.
        note:
          ar_eg: gang هي الحارة الضيّقة بين البيوت. في جاوة الجيران في الـ gang قريبين من بعض أوي، وبيساعدوا بعض في الأفراح والأحزان - اسمها gotong royong.
          ar: gang هو الزقاق الضيّق بين البيوت. وفي جاوة يكون جيران الزقاق قريبين جدًّا ويتعاونون في الأفراح والأحزان، ويسمّى ذلك gotong royong.
          en: A gang is a narrow lane between houses. In Java, gang neighbours are close and pitch in for weddings and hard times alike — gotong royong.
      - speaker: Mas Joko
        text: Bu Rahayu, tolong istirahat. Hari ini saya membantu di warung.
        ar_eg: يا بو راهايو، ارتاحي من فضلك. النهارده أنا هساعد في الوارونج.
        ar: يا بو راهايو، استريحي من فضلك. اليوم سأساعد في الوارونغ.
        en: Bu Rahayu, please rest. Today I'll help at the warung.
      - speaker: Bu Tini
        text: Saya tetangga di seberang, Bu. Saya bisa memasak pecel untuk buka puasa!
        ar_eg: أنا جارتك اللي قصادك يا بو. أقدر أعمل پيتشل للفطار!
        ar: أنا جارتكِ في الجهة المقابلة يا بو. أستطيع أن أطبخ البيتشل للإفطار!
        en: I'm your neighbour across the way, Bu. I can cook pecel for iftar!
      - speaker: Bu Rahayu
        text: Terima kasih, Bu Tini, Mas Joko. Silakan masuk ke dapur.
        ar_eg: متشكّرة يا بو تيني، يا ماس جوكو. اتفضّلوا ادخلوا المطبخ.
        ar: شكرًا يا بو تيني، ويا ماس جوكو. تفضّلا بالدخول إلى المطبخ.
        en: Thank you, Bu Tini, Mas Joko. Please, come into the kitchen.
      - speaker: Karim
        text: Mas Joko, saya mau tinggal di Madiun dua minggu. Ada kos dekat sini?
        ar_eg: يا ماس جوكو، أنا عايز أقعد في ماديون أسبوعين. فيه أوضة للإيجار قريب من هنا؟
        ar: يا ماس جوكو، أريد أن أبقى في ماديون أسبوعين. هل توجد غرفة للإيجار قريبًا من هنا؟
        en: Mas Joko, I want to stay in Madiun for two weeks. Is there a kos near here?
        note:
          ar_eg: kos أوضة بتتأجّر بالشهر في بيت، وده السكن العادي للطلبة والموظفين في إندونيسيا. كريم مترجم، فيقدر يشتغل من أي حتة.
          ar: kos غرفة تُؤجَّر شهريًّا داخل بيت، وهي السكن المعتاد للطلبة والموظفين في إندونيسيا. وكريم مترجم يستطيع العمل من أي مكان.
          en: A kos is a room rented by the month inside a house — the usual home for students and workers in Indonesia. Karim is a translator, so he can work from anywhere.
      - speaker: Mas Joko
        text: Ada! Di ujung gang. Kamarnya kosong, ada kamar mandi dan lemari.
        ar_eg: فيه! في آخر الحارة. الأوضة فاضية، وفيها حمّام ودولاب.
        ar: نعم! في آخر الزقاق. الغرفة شاغرة، وفيها حمّام وخزانة.
        en: There is! At the end of the lane. The room's free, with a bathroom and a wardrobe.
      - speaker: Karim
        text: Sewanya berapa?
        ar_eg: الإيجار بكام؟
        ar: كم الإيجار؟
        en: How much is the rent?
      - speaker: Mas Joko
        text: Lima ratus ribu sebulan. Termasuk listrik.
        ar_eg: خمسمية ألف في الشهر. شامل الكهربا.
        ar: خمسمئة ألف في الشهر، شاملًا الكهرباء.
        en: Five hundred thousand a month. Electricity included.
      - speaker: Pak Budi
        text: Mas Karim! Terima kasih. Tapi tolong, jangan masak koshari setiap hari, ya!
        ar_eg: يا ماس كريم! متشكّر. بس أبوس إيدك، متطبخش كشري كل يوم!
        ar: يا ماس كريم! شكرًا لك. لكن من فضلك، لا تطبخ الكشري كل يوم!
        en: Mas Karim! Thank you. But please, don't cook koshari every day!
      - speaker: Narrator
        text: Di kamar tidur, Pak Budi istirahat. Tapi dia senang.
        ar_eg: في أوضة النوم، پاك بودي بيرتاح. بس هو مبسوط.
        ar: في غرفة النوم يرتاح باك بودي، لكنه سعيد.
        en: In the bedroom, Pak Budi rests. But he's happy.
