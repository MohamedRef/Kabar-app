title:
  target: Resep Kolak Bapak
  ar_eg: وصفة كولاك بابا
  ar: وصفة كولاك أبي
  en: Dad's Kolak Recipe
summary:
  ar_eg: باك بودي بيعلّم بايو وكريم يعملوا كولاك خطوة بخطوة. بس فجأة بيقعد ومش قادر يكمّل، وبو راهايو بتاخد قرار كبير بخصوص الوارونج.
  ar: يعلّم باك بودي بايو وكريمًا إعداد الكولاك خطوة بخطوة. لكنه يجلس فجأة عاجزًا عن المواصلة، وتتّخذ بو راهايو قرارًا كبيرًا بشأن الوارونغ.
  en: Pak Budi teaches Bayu and Karim to make kolak step by step. But suddenly he has to sit down, and Bu Rahayu makes a big decision about the warung.
cast: [Pak Budi, Bayu, Karim, Bu Rahayu]
scenes:
  - setting:
      ar_eg: مطبخ الوارونج، السبت الساعة ٣ العصر. على الترابيزة الموز وجوز الهند وسكر النخل اللي اشتروهم من السوق.
      ar: مطبخ الوارونغ، يوم السبت في الثالثة عصرًا. على الطاولة الموز وجوز الهند وسكّر النخيل التي اشتُريت من السوق.
      en: The warung kitchen, Saturday, 3 p.m. On the table are the bananas, coconuts and palm sugar from the market.
    lines:
      - speaker: Narrator
        text: Hari Sabtu. Jam tiga sore. Di dapur warung.
        ar_eg: يوم السبت. الساعة ٣ العصر. في مطبخ الوارونج.
        ar: يوم السبت. الساعة الثالثة عصرًا. في مطبخ الوارونغ.
        en: Saturday. Three in the afternoon. In the warung kitchen.
      - speaker: Pak Budi
        text: Bayu, Mas Karim, ini resep kolak saya. Pertama, cuci dan potong pisang.
        ar_eg: يا بايو، يا ماس كريم، دي وصفة الكولاك بتاعتي. أولًا، اغسلوا الموز وقطّعوه.
        ar: يا بايو، يا ماس كريم، هذه وصفة الكولاك الخاصة بي. أولًا، اغسلا الموز وقطّعاه.
        en: Bayu, Mas Karim, this is my kolak recipe. First, wash and cut the bananas.
        note:
          ar_eg: في الوصفات بيستعملوا الفعل من غير me-، زي cuci وpotong، وده الأمر في الإندونيسي.
          ar: في الوصفات يُستعمل الفعل بلا me-، مثل cuci وpotong، وهذه صيغة الأمر في الإندونيسية.
          en: Recipes use the bare verb without me- (cuci, potong) — that's the Indonesian imperative.
      - speaker: Bayu
        text: Udah, Pak!
        ar_eg: خلصت يا بابا!
        ar: انتهيت يا أبي!
        en: Done, Dad!
        note:
          ar_eg: udah = sudah (خلاص) في الكلام اليومي.
          ar: udah = sudah (انتهيت / تمّ) في الكلام اليومي.
          en: udah = sudah (done, already) in everyday speech.
      - speaker: Pak Budi
        text: Lalu rebus santan sama gula merah. Setelah itu, masukkan pisang.
        ar_eg: بعدين اسلقوا لبن جوز الهند مع سكر النخل. وبعد كده، حطّوا الموز.
        ar: ثم اغلوا حليب جوز الهند مع سكّر النخيل. بعد ذلك، أضيفوا الموز.
        en: Then boil the coconut milk with the palm sugar. After that, put in the bananas.
        note:
          ar_eg: sama = dengan (مع) في الكلام.
          ar: sama = dengan (مع) في الكلام.
          en: sama = dengan (with) in speech.
      - speaker: Karim
        text: Pak, kok ada garam? Kolak itu manis.
        ar_eg: يا باك، ليه فيه ملح؟ الكولاك ده حلو.
        ar: يا باك، لماذا يوجد ملح؟ الكولاك حلو.
        en: Pak, why is there salt? Kolak is sweet.
        note:
          ar_eg: kok = «إزاي؟ / ليه كده؟» لما حاجة تستغربها.
          ar: kok = «كيف ذلك؟» عند الاستغراب.
          en: kok = "how come?", when something surprises you.
      - speaker: Pak Budi
        text: Sedikit garam aja, Mas. Jadi kolaknya lebih gurih.
        ar_eg: شوية ملح بس يا ماس. عشان الكولاك يبقى طعمه أغنى.
        ar: قليل من الملح فقط يا ماس، فيصبح الكولاك أغنى طعمًا.
        en: Just a little salt, Mas. That way the kolak tastes richer.
        note:
          ar_eg: gurih طعم مالوش كلمة واحدة بالعربي - زي طعم الحاجة اللي فيها دسم وملح خفيف (savoury). الإندونيسيين بيحبّوا شوية ملح في الحلو. وaja = saja (بس).
          ar: gurih طعم لا تقابله كلمة عربية واحدة، وهو طعم الدسم مع ملوحة خفيفة. ويحبّ الإندونيسيون قليلًا من الملح في الحلوى. وaja = saja (فقط).
          en: gurih is that rich, savoury taste (fat plus a touch of salt). Indonesians like a pinch of salt even in sweets. aja = saja (just).
      - speaker: Pak Budi
        text: Aduk pelan-pelan, Le.
        ar_eg: قلّب بالراحة يا ابني.
        ar: حرّك ببطء يا بنيّ.
        en: Stir it slowly, son.
      - speaker: Bayu
        text: Pak, boleh aku cicipi?
        ar_eg: بابا، ممكن أدوق؟
        ar: أبي، هل يمكنني أن أتذوّق؟
        en: Dad, can I taste it?
      - speaker: Pak Budi
        text: Jangan! Kamu puasa!
        ar_eg: لأ! انت صايم!
        ar: لا! أنت صائم!
        en: No! You're fasting!
      - speaker: Bayu
        text: Aduh, lupa!
        ar_eg: يا خبر، نسيت!
        ar: آه، نسيت!
        en: Oops, I forgot!
  - setting:
      ar_eg: بعد شوية في نفس المطبخ. ريحة الكولاك حلوة، بس باك بودي ساكت.
      ar: بعد قليل في المطبخ نفسه. رائحة الكولاك زكيّة، لكن باك بودي صامت.
      en: A little later, same kitchen. The kolak smells wonderful, but Pak Budi has gone quiet.
    lines:
      - speaker: Narrator
        text: Lalu Pak Budi duduk di kursi. Dia capek sekali.
        ar_eg: وبعدين باك بودي قعد على الكرسي. كان تعبان أوي.
        ar: ثم جلس باك بودي على الكرسي. كان متعبًا جدًّا.
        en: Then Pak Budi sits down on a chair. He's very tired.
      - speaker: Karim
        text: Pak? Bapak nggak apa-apa?
        ar_eg: يا باك؟ حضرتك كويس؟
        ar: يا باك؟ هل أنت بخير؟
        en: Pak? Are you all right?
        note:
          ar_eg: nggak apa-apa = tidak apa-apa (مفيش حاجة / تمام؟).
          ar: nggak apa-apa = tidak apa-apa (لا بأس).
          en: nggak apa-apa = tidak apa-apa (all right, nothing wrong).
      - speaker: Pak Budi
        text: Nggak apa-apa, Mas. Saya capek aja.
        ar_eg: مفيش حاجة يا ماس. أنا تعبان بس.
        ar: لا شيء يا ماس. أنا متعب فقط.
        en: It's nothing, Mas. I'm just tired.
        note:
          ar_eg: nggak = tidak، aja = saja.
          ar: nggak = tidak، aja = saja.
          en: nggak = tidak, aja = saja.
      - speaker: Bu Rahayu
        text: Pak! Bapak kurang sehat. Besok kita ke dokter.
        ar_eg: يا بودي! انت صحتك مش تمام. بكرة نروح للدكتور.
        ar: يا باك! صحّتك ليست على ما يرام. غدًا نذهب إلى الطبيب.
        en: Pak! You're not well. Tomorrow we're going to the doctor.
      - speaker: Pak Budi
        text: Tapi besok hari Minggu, Bu. Warung ramai!
        ar_eg: بس بكرة الأحد يا رهايو. الوارونج بيبقى زحمة!
        ar: لكن غدًا الأحد، والوارونغ يكون مزدحمًا!
        en: But tomorrow's Sunday. The warung will be busy!
      - speaker: Bu Rahayu
        text: Warung tutup! Bapak harus istirahat.
        ar_eg: الوارونج هيقفل! انت لازم ترتاح.
        ar: الوارونغ سيُغلق! يجب أن ترتاح.
        en: The warung is closing! You have to rest.
      - speaker: Bayu
        text: Jangan tutup, Bu! Aku bisa masak. Aku udah tahu resepnya!
        ar_eg: متقفليهوش يا ماما! أنا أعرف أطبخ. أنا خلاص عرفت الوصفة!
        ar: لا تغلقيه يا أمي! أستطيع أن أطبخ. لقد عرفت الوصفة!
        en: Don't close it, Mum! I can cook. I know the recipe now!
        note:
          ar_eg: masak = memasak (يطبخ)، وudah = sudah.
          ar: masak = memasak (يطبخ)، وudah = sudah.
          en: masak = memasak (to cook), udah = sudah.
      - speaker: Karim
        text: Saya juga di sini, Bu. Saya bisa bantu.
        ar_eg: وأنا كمان هنا يا بو. أقدر أساعد.
        ar: وأنا هنا أيضًا يا بو. أستطيع أن أساعد.
        en: I'm here too, Bu. I can help.
        note:
          ar_eg: bantu = membantu (يساعد)؛ في الكلام الفعل بييجي من غير me‑. كريم بيقول saya عشان بيكلّم ست أكبر منه.
          ar: bantu = membantu (يساعد)؛ في الكلام يُحذف me‑. ويستعمل كريم saya احترامًا لسيّدة أكبر منه.
          en: bantu = membantu (to help); speech drops me-. Karim keeps saya because he's talking to an older lady.
      - speaker: Narrator
        text: Sesudah magrib, semua mencicipi kolak Bayu. Manis dan gurih. Lezat!
        ar_eg: بعد المغرب، الكل داق كولاك بايو. حلو وطعمه غني. لذيذ!
        ar: بعد المغرب، تذوّق الجميع كولاك بايو. حلو وغنيّ الطعم. لذيذ!
        en: After sunset, everyone tastes Bayu's kolak. Sweet and rich. Delicious!
        note:
          ar_eg: lezat جاية من العربي «لذّة» - «لذيذ».
          ar: lezat من العربية «لذّة».
          en: lezat comes from Arabic لذّة (pleasure, deliciousness).
      - speaker: Narrator
        text: Tapi Pak Budi tidak makan. Malam itu, Bu Rahayu menelepon Sari.
        ar_eg: بس باك بودي ماكلش. والليلة دي، بو راهايو كلّمت ساري.
        ar: لكن باك بودي لم يأكل. وفي تلك الليلة اتّصلت بو راهايو بساري.
        en: But Pak Budi doesn't eat. That night, Bu Rahayu calls Sari.
new_words:
  - word: santan
    pos: noun
    ar_eg: لبن جوز الهند
    ar: حليب جوز الهند
    en: coconut milk
  - word: membantu
    pos: verb
    ar_eg: "يساعد (في الكلام: bantu)"
    ar: "يساعد (في الكلام: bantu)"
    en: "to help (spoken: bantu)"
  - word: menelepon
    pos: verb
    ar_eg: يتّصل / يكلّم في التليفون
    ar: يتّصل هاتفيًّا
    en: to phone
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: أول خطوة في الوصفة إيه؟
      ar: ما أول خطوة في الوصفة؟
      en: What's the first step of the recipe?
    options: ["Rebus santan.", "Masukkan pisang.", "Cuci dan potong pisang.", "Aduk pelan-pelan."]
    answer: 2
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: باك بودي بيحط ملح في الكولاك ليه؟
      ar: لماذا يضع باك بودي الملح في الكولاك؟
      en: Why does Pak Budi put salt in the kolak?
    options: ["Jadi kolaknya lebih gurih.", "Jadi kolaknya lebih pedas.", "Karena gulanya habis."]
    answer: 0
  - id: q03
    type: fill_blank
    sentence: ___ pelan-pelan, Le.
    meaning:
      ar_eg: قلّب بالراحة يا ابني.
      ar: حرّك ببطء يا بنيّ.
      en: Stir it slowly, son.
    answers: [Aduk]
    options: ["Goreng", "Aduk", "Potong"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: بو راهايو قرّرت إيه؟
      ar: ماذا قرّرت بو راهايو؟
      en: What does Bu Rahayu decide?
    options: ["Bayu tidak boleh memasak.", "Warung buka sampai malam.", "Warung tutup, dan Bapak harus istirahat."]
    answer: 2
  - id: q05
    type: translate
    direction: from_target
    source_text: Bapak harus istirahat.
    answers_meaning:
      ar_eg: ["لازم ترتاح يا بابا.", "بابا لازم يرتاح.", "حضرتك لازم ترتاح."]
      ar: ["يجب أن ترتاح يا أبي.", "على أبي أن يرتاح.", "يجب أن ترتاح يا سيدي."]
      en: ["You have to rest, Dad.", "Dad has to rest.", "You must rest, sir."]
next:
  ar_eg: باك بودي راح المستشفى، والوارونج مقفول... بس الحارة كلها عندها خطة. وساري في القاهرة مش قادرة تنام.
  ar: ذهب باك بودي إلى المستشفى، والوارونغ مغلق... لكن لدى الحيّ كلّه خطة. وساري في القاهرة لا تستطيع النوم.
  en: Pak Budi has been to the hospital and the warung is shut... but the whole street has a plan. And in Cairo, Sari can't sleep.
