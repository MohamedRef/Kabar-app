questions:
  - id: q01
    type: translate
    direction: from_target
    source_text: Sa tra tahu.
    answers_meaning:
      ar_eg: ["أنا مش عارف.", "معرفش.", "مش عارف."]
      ar: ["لا أعرف.", "أنا لا أعلم.", "لا أدري."]
      en: ["I don't know.", "I've no idea.", "Dunno."]
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: في ميدان، كلمة kereta معناها إيه؟
      ar: ما معنى كلمة kereta في ميدان؟
      en: In Medan, what does kereta mean?
    options: ["mobil", "kereta api", "perahu", "sepeda motor"]
    answer: 3
  - id: q03
    type: fill_blank
    sentence: Melayu Papua itu bukan bahasa Indonesia yang rusak. Ini ___ sendiri, dengan aturannya sendiri.
    meaning:
      ar_eg: ملايو پاپوا مش إندونيسي مكسّر. ده نوع لغوي لوحده، وليه قواعده.
      ar: ملايو بابوا ليست إندونيسية مكسّرة، بل ضرب لغوي قائم بذاته له قواعده.
      en: Papuan Malay isn't broken Indonesian. It's a variety of its own, with its own rules.
    answers: [ragam]
    options: ["harga", "ragam", "kampung"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: ليه كريم بيعتذر لساري بالكراما؟
      ar: لماذا يعتذر كريم لساري بالكراما؟
      en: Why does Karim apologise to Sari in krama?
    options: ["Karena Sari tidak mengerti bahasa Jawa.", "Karena bahasa krama terlalu halus untuk dimarahi lama-lama.", "Karena Pak Budi menyuruhnya.", "Karena dia lupa bahasa Arab."]
    answer: 1
  - id: q05
    type: listen
    text: Sa su makan papeda, sa su beli ikan sendiri.
    question:
      ar_eg: بايو قال إيه بالظبط؟
      ar: ماذا قال بايو بالضبط؟
      en: What exactly did Bayu say?
    options: ["Saya sudah makan papeda dan sudah membeli ikan sendiri.", "Saya mau makan papeda besok.", "Saya tidak suka papeda.", "Saya belum membeli ikan."]
    answer: 0
    meaning:
      ar_eg: أنا كلت پاپيدا خلاص، واشتريت سمك بنفسي.
      ar: أكلتُ البابيدا، واشتريتُ السمك بنفسي.
      en: I've had papeda, I've bought fish all by myself.
