title:
  target: Sa, Ko, dan Torang
  ar_eg: أنا وانت واحنا - على طريقة پاپوا
  ar: أنا وأنت ونحن - على طريقة بابوا
  en: Sa, Ko and Torang
summary:
  ar_eg: في سوق السمك في سورونج، كاك نيلا بتعلّم بايو ملايو پاپوا، وماما روس البيّاعة بتدّيله «سعر الصحفيين». وبالليل في مكالمة العيلة - بايو بيتكلّم پاپوي، وبو راهايو جاوي، وكريم كراما، وكلمة حبيبتي بالمصري... وساري بتدّي الحاجة دي اسم علمي.
  ar: في سوق السمك في سورونغ تعلّم كاك نيلا بايو ملايو بابوا، وتعطيه البائعة ماما روس «سعر الصحفيين». وفي المساء في مكالمة العائلة - بايو يتكلّم البابوية، وبو راهايو الجاوية، وكريم الكراما، مع «حبيبتي» بالمصرية... وتمنح ساري ذلك كلّه اسمًا علميًّا.
  en: At the fish market in Sorong, Kak Nella teaches Bayu Papuan Malay, and Mama Ros the fishmonger gives him the "journalist price". That night on the family call, Bayu speaks Papuan, Bu Rahayu Javanese, Karim krama, with an Egyptian "habibti" thrown in... and Sari gives it all a scientific name.
cast: [Kak Nella, Mama Ros, Bayu, Bu Rahayu, Karim, Pak Budi, Sari]
scenes:
  - setting:
      ar_eg: سوق سمك قريب من ميناء سورونج، الصبح بدري. الصيّادين لسه نازلين من القوارب. كاك نيلا واخدة بايو يشتروا غدا لزمايلهم في الجرنال.
      ar: سوق سمك قرب ميناء سورونغ، في الصباح الباكر. الصيّادون نزلوا للتوّ من القوارب. تصطحب كاك نيلا بايو لشراء غداء لزملاء التحرير.
      en: A fish market near Sorong harbour, early morning. The fishermen have just come off the boats. Kak Nella has brought Bayu to buy lunch for the newsroom.
    lines:
      - speaker: Kak Nella
        text: Mas Bayu, hari ini ko belajar bahasa pasar. Dengerin baik-baik, jangan banyak tanya dulu.
        ar_eg: يا بايو، النهارده هتتعلّم لغة السوق. اسمع كويس، ومتسألش كتير دلوقتي.
        ar: يا ماس بايو، اليوم تتعلّم لغة السوق. أصغِ جيّدًا، ولا تُكثر الأسئلة الآن.
        en: Mas Bayu, today you learn market language. Listen carefully, and don't ask too many questions yet.
        note:
          ar_eg: dengerin = dengarkan (اسمع كويس)، tanya = يسأل.
          ar: dengerin = dengarkan (أصغِ)، tanya = يسأل.
          en: dengerin = dengarkan (listen), tanya = ask.
      - speaker: Mama Ros
        text: Kaka, mo beli ikan apa? Ini cakalang baru naik dari perahu. Sa kasih harga bagus.
        ar_eg: يا كاكا، عايز تشتري سمك إيه؟ ده تونة لسه طالعة من المركب. هدّيك سعر حلو.
        ar: يا كاكا، أيّ سمك تريد أن تشتري؟ هذه تونة نزلت للتوّ من القارب. سأعطيك سعرًا جيّدًا.
        en: Kaka, what fish do you want? This skipjack just came off the boat. I'll give you a good price.
        note:
          ar_eg: cakalang = سمك بونيتو (تونة صغيرة). ملايو پاپوا - sa = saya (أنا)، ko = kamu (انت)، mo = mau (عايز)، kasih = beri (يدّي). وkaka (من kakak) بيتقال لأي حد قدّامك باحترام وودّ، حتى لو أصغر منك.
          ar: cakalang = سمك البونيتو. من ملايو بابوا - sa = saya (أنا)، وko = kamu (أنت)، وmo = mau (يريد)، وkasih = beri (يعطي). وkaka (من kakak) نداء ودود محترم لأيّ شخص، ولو كان أصغر منك.
          en: "cakalang = skipjack tuna. Papuan Malay: sa = saya (I), ko = kamu (you), mo = mau (want), kasih = beri (give). kaka (from kakak) is a warm, polite way to address almost anyone, even someone younger."
      - speaker: Bayu
        text: Eh... saya mau... sa mo beli cakalang, Mama. Berapa satu ekor?
        ar_eg: إيه... أنا عايز... عايز أشتري تونة يا ماما. الواحدة بكام؟
        ar: آه... أريد... أريد أن أشتري تونة يا ماما. بكم الواحدة؟
        en: Er... I want... I wanna buy skipjack, Mama. How much for one?
        note:
          ar_eg: eh = أمم، mo = mau. cakalang = بونيتو.
          ar: eh = أمم، mo = mau. cakalang = البونيتو.
          en: eh = um, mo = mau. cakalang = skipjack tuna.
      - speaker: Mama Ros
        text: Aduh, kaka dari Jawa ini bicaranya manis sekali. Satu ekor lima puluh ribu. Tapi untuk kaka, sa kasih empat puluh lima.
        ar_eg: يا خبر، الكاكا اللي من جاوة ده كلامه زي العسل. الواحدة بخمسين ألف. بس عشانك، هدّيهالك بخمسة وأربعين.
        ar: يا لَلطافة، كلام هذا الكاكا القادم من جاوة حلو جدًّا. الواحدة بخمسين ألفًا، لكن لك سأجعلها بخمسة وأربعين.
        en: Oh my, this kaka from Java talks so sweetly. Fifty thousand each. But for you, forty-five.
        note:
          ar_eg: kaka = kakak، kasih = beri (يدّي) - ملايو پاپوا.
          ar: kaka = kakak، kasih = beri (يعطي) - ملايو بابوا.
          en: kaka = kakak, kasih = beri (give) - Papuan Malay.
      - speaker: Kak Nella
        text: Mama, dia wartawan baru. Jangan kasih harga orang luar, kasih harga torang.
        ar_eg: يا ماما، ده صحفي جديد. متدّيهوش سعر الغُرب، ادّيه سعرنا احنا.
        ar: يا ماما، إنّه صحفي جديد. لا تعطيه سعر الغرباء، أعطيه سعرنا نحن.
        en: Mama, he's a new reporter. Don't give him the outsiders' price, give him our price.
        note:
          ar_eg: kasih = beri (يدّي)، وtorang = kita (إحنا) بلهجة الشرق.
          ar: kasih = beri (يعطي)، وtorang = kita (نحن) بلهجة الشرق.
          en: kasih = beri (give). torang = kita (us).
      - speaker: Mama Ros
        text: Iyo, iyo. Empat puluh sudah. Su, sa bungkus!
        ar_eg: ماشي ماشي. أربعين خلاص. خلّصنا، هلفّهالك!
        ar: حسنًا حسنًا. أربعون إذن. انتهينا، سأغلّفها!
        en: Yeah, yeah. Forty, then. Done, I'll wrap it!
        note:
          ar_eg: iyo = iya (أيوه)، su = sudah.
          ar: iyo = iya (نعم)، su = sudah.
          en: iyo = iya (yes), su = sudah.
      - speaker: Bayu
        text: Kak, "su" itu "sudah", ya? Kemarin Pak Yafet bilang, "Sa tra tahu." Itu "saya tidak tahu"?
        ar_eg: يا كاك، «su» يعني «sudah» (خلاص)، صح؟ وامبارح پاك يافت قال «Sa tra tahu». يعني «أنا مش عارف»؟
        ar: يا كاك، «su» تعني «sudah» (قد)، أليس كذلك؟ وأمس قال باك يافت «Sa tra tahu». أهي «لا أعرف»؟
        en: Kak, "su" means "sudah", right? Yesterday Pak Yafet said "Sa tra tahu". Is that "I don't know"?
      - speaker: Kak Nella
        text: Betul. Tra itu tidak, trada itu tidak ada, torang itu kita, dong itu mereka. Tapi inget ya, Mas, Melayu Papua itu bukan bahasa Indonesia yang rusak. Ini ragam sendiri, dengan aturannya sendiri.
        ar_eg: مظبوط. tra يعني «مش»، وtrada يعني «مفيش»، وtorang يعني «احنا»، وdong يعني «هم». بس افتكر يا بايو، ملايو پاپوا مش إندونيسي مكسّر. ده نوع لغوي لوحده، وليه قواعده.
        ar: صحيح. tra تعني «لا»، وtrada «لا يوجد»، وtorang «نحن»، وdong «هم». لكن تذكّر يا ماس، ملايو بابوا ليست إندونيسية مكسّرة، بل ضرب لغوي قائم بذاته له قواعده.
        en: Right. tra is "not", trada is "there isn't", torang is "we", dong is "they". But remember, Mas, Papuan Malay isn't broken Indonesian. It's a variety of its own, with its own rules.
        note:
          ar_eg: inget = ingat (افتكر)، trada = tidak ada. ملايو پاپوا هي لغة التفاهم اليومية بين ناس پاپوا اللي عندهم أكتر من ٢٥٠ لغة محلية، والإندونيسي الفصيح بيتستعمل في المدرسة والأخبار. torang من kita orang، وdong من dia orang، وkam = kalian (انتو).
          ar: inget = ingat (تذكّر)، trada = tidak ada. ملايو بابوا لغة التخاطب اليومي بين أهل بابوا الذين يتكلّمون أكثر من ٢٥٠ لغة محلية، أمّا الإندونيسية الفصيحة فللمدرسة والأخبار. وtorang من kita orang، وdong من dia orang، وkam = kalian (أنتم).
          en: inget = ingat (remember), trada = tidak ada. Papuan Malay is the everyday bridge language in a region of over 250 local languages; standard Indonesian is for school and the news. torang comes from kita orang, dong from dia orang, and kam = kalian (you all).
      - speaker: Bayu
        text: Di Medan juga gitu, Kak. Hari pertama kuliah, Kak Tiur bilang, "Naik kereta sajalah kau ke kampus." Aku cari stasiun kereta api. Eh, ternyata maksudnya sepeda motor!
        ar_eg: في ميدان نفس الحكاية يا كاك. أول يوم في الجامعة، كاك تيور قالت لي «اركب القطر للجامعة». قعدت أدوّر على محطة قطر. وطلع قصدها الموتوسيكل!
        ar: في ميدان الأمر نفسه يا كاك. في أوّل يوم جامعي قالت لي كاك تيور «اركب القطار إلى الجامعة». فبحثتُ عن محطة قطار، وإذا بها تقصد الدرّاجة النارية!
        en: Medan's the same, Kak. My first day at uni, Kak Tiur said, "Just take the kereta to campus." I went looking for the train station. Turns out she meant a motorbike!
        note:
          ar_eg: gitu = begitu، bilang = قال، maksudnya = قصدها، kau = kamu في ميدان. في ميدان، kereta معناها موتوسيكل، مش قطر. وفي جاكرتا بيقولوا gue (أنا) وlu (انت). وفي جاوة بيحطّوا kok وto في الكلام. كل منطقة ليها بصمتها.
          ar: gitu = begitu، bilang = قال، maksudnya = مقصودها، kau = kamu في ميدان. في ميدان تعني kereta الدرّاجة النارية لا القطار. وفي جاكرتا يقولون gue (أنا) وlu (أنت)، وفي جاوة يُدخلون kok وto في الكلام. لكلّ منطقة بصمتها.
          en: gitu = begitu, bilang = said, maksudnya = what she meant, kau = kamu in Medan. In Medan, kereta means a motorbike, not a train. In Jakarta people say gue (I) and lu (you); in Java they sprinkle in kok and to. Every region leaves its fingerprint.
      - speaker: Kak Nella
        text: Hahaha! Jadi ko sudah belajar tiga ragam. Jawa di rumah, Medan di kampus, Papua di pasar.
        ar_eg: هاهاها! يعني انت اتعلّمت تلات أنواع خلاص. جاوي في البيت، وميداني في الجامعة، وپاپوي في السوق.
        ar: هاهاها! إذن تعلّمتَ ثلاثة ضروب. الجاوية في البيت، ولهجة ميدان في الجامعة، والبابوية في السوق.
        en: Hahaha! So you've learnt three varieties. Javanese at home, Medan at uni, Papuan at the market.
      - speaker: Bayu
        text: Empat, Kak. Di rumah kakakku ada bahasa Arab Mesir juga. Tunggu aja nanti malam.
        ar_eg: أربعة يا كاك. في بيت أختي فيه عربي مصري كمان. استنّي بالليل وانتي تشوفي.
        ar: أربعة يا كاك. ففي بيت أختي عربية مصرية أيضًا. انتظري الليلة وسترين.
        en: Four, Kak. At my sister's place there's Egyptian Arabic too. Just wait till tonight.
  - setting:
      ar_eg: ليلة الجمعة، الساعة تمانية بتوقيت WIB - عشرة بتوقيت WIT. بايو بينفّذ وعده ويكلّم العيلة. كاك نيلا قاعدة جنبه بتسمع وبتضحك.
      ar: ليلة الجمعة، الثامنة بتوقيت WIB - العاشرة بتوقيت WIT. يفي بايو بوعده ويتّصل بالعائلة، وكاك نيلا جالسة بجانبه تسمع وتضحك.
      en: Thursday night, eight o'clock WIB - ten o'clock WIT. Bayu keeps his promise and calls the family. Kak Nella sits beside him, listening and laughing.
    lines:
      - speaker: Bayu
        text: Selamat malam, Bapak, Ibu! Sa su makan papeda, sa su beli ikan sendiri. Torang baik-baik saja!
        ar_eg: مساء الخير يا بابا ويا ماما! أنا كلت پاپيدا خلاص، واشتريت سمك بنفسي. احنا كلنا كويسين!
        ar: مساء الخير يا أبي ويا أمي! أكلتُ البابيدا، واشتريتُ السمك بنفسي. نحن بخير!
        en: Evening, Dad, Mum! I've had papeda, I've bought fish all by myself. We're all good!
      - speaker: Bu Rahayu
        text: Lho, Le, kowe ngomong apa? "Sa", "su"... Ibu kok ora mudeng.
        ar_eg: إيه ده يا ابني، انت بتقول إيه؟ «سا»، «سو»... أنا مش فاهمة حاجة.
        ar: ما هذا يا بنيّ، ماذا تقول؟ «سا»، «سو»... لا أفهم شيئًا.
        en: Hey, son, what are you saying? "Sa", "su"... I don't understand a thing.
        note:
          ar_eg: بو راهايو قلبت جاوي من غير ما تاخد بالها - kowe = kamu (انت)، ngomong = bicara (يتكلّم)، ora = tidak (مش)، mudeng = paham (فاهم). ده جاوي «ngoko» العادي بتاع البيت.
          ar: انتقلت بو راهايو إلى الجاوية دون أن تنتبه - kowe = kamu (أنت)، وngomong = bicara (يتكلّم)، وora = tidak (لا)، وmudeng = paham (يفهم). وهذه جاوية «ngoko» اليومية في البيت.
          en: 'Bu Rahayu slips into Javanese without noticing: kowe = kamu (you), ngomong = bicara (talk), ora = tidak (not), mudeng = paham (understand). This is everyday home "ngoko" Javanese.'
      - speaker: Karim
        text: Sugeng dalu, Bapak, Ibu. Menawi kepareng, kula badhe matur sekedhik.
        ar_eg: مساء الخير يا بابا ويا ماما. لو تسمحوا، حابب أقول كلمتين.
        ar: مساء الخير يا أبي ويا أمي. إن أذنتما، أودّ أن أقول كلمة قصيرة.
        en: Good evening, Father, Mother. If I may, I'd like to say a few words.
        note:
          ar_eg: كريم بيتكلّم «كراما» - الجاوي المؤدّب اللي بيتعلّمه بقاله سنين. kula = أنا، badhe = عايز، matur = يقول (لحد أكبر منه)، menawi kepareng = لو تسمحوا. (الجمل الجاوية لسه مستنية مراجعة.)
          ar: يتكلّم كريم «الكراما» - الجاوية المهذّبة التي يتعلّمها منذ سنوات. kula = أنا، وbadhe = يريد، وmatur = يقول (لمن هو أعلى)، وmenawi kepareng = إن أذنتم. (الجمل الجاوية بانتظار المراجعة.)
          en: 'Karim speaks krama, the polite Javanese he''s been learning for years: kula = I, badhe = want to, matur = say (to someone senior), menawi kepareng = if I may. (The Javanese lines still await review.)'
      - speaker: Pak Budi
        text: Wah, mantuku iki kramane luwih alus tinimbang anakku dhewe!
        ar_eg: الله! جوز بنتي ده الكراما بتاعته أرقّ من ابني أنا شخصيًا!
        ar: الله! صهري هذا أرقّ في الكراما من ابني نفسه!
        en: Well! My son-in-law's krama is more refined than my own son's!
      - speaker: Bayu
        text: Pak, aku denger, lho! Lagian, di sini krama nggak laku. Kalau mau sopan, panggil orang "Bapa", "Mama", "Kaka", terus banyak senyum.
        ar_eg: يا بابا، أنا سامعك على فكرة! وبعدين الكراما هنا ملهاش سوق. لو عايز تبقى مؤدّب، قول للناس «باپا» و«ماما» و«كاكا»، واضحك كتير.
        ar: يا أبي، إنّي أسمعك! ثمّ إنّ الكراما لا تنفع هنا. إن أردتَ التأدّب فنادِ الناس «بابا» و«ماما» و«كاكا»، وأكثِر من الابتسام.
        en: Dad, I can hear you, you know! Anyway, krama doesn't work here. If you want to be polite, call people "Bapa", "Mama", "Kaka", and smile a lot.
        note:
          ar_eg: denger = dengar، lagian = lagi pula (وبعدين)، nggak = tidak. krama = الجاوي المؤدّب، laku = ليه قيمة/بيمشي، panggil = نادي، senyum = ابتسامة.
          ar: denger = dengar، lagian = lagi pula (ثمّ إنّ)، nggak = tidak. krama = الجاوية المهذّبة، laku = رائج، panggil = نادِ، senyum = ابتسامة.
          en: denger = dengar, lagian = lagi pula (besides), nggak = tidak. krama = polite Javanese, laku = work, sell, panggil = call, senyum = smile. bapa = Papuan form of bapak.
      - speaker: Sari
        text: Kalian sadar nggak? Dalam satu menit kita udah pake empat bahasa. Di linguistik, itu namanya alih kode.
        ar_eg: انتو واخدين بالكم؟ في دقيقة واحدة استعملنا أربع لغات. في علم اللغة، ده اسمه «التحويل اللغوي».
        ar: هل تنتبهون؟ في دقيقة واحدة استعملنا أربع لغات. وفي علم اللغة يُسمّى هذا «التناوب اللغوي».
        en: Do you all realise? In one minute we've used four languages. In linguistics, that's called code-switching.
        note:
          ar_eg: sadar = واخدين بالكم، udah = sudah، pake = pakai. linguistik = علم اللغة. alih kode (التحويل اللغوي) يعني تقلب من لغة للغة على حسب الكلام أو الشخص، وcampur kode (خلط اللغات) يعني تحطّ كلمات من لغة جوّه جملة بلغة تانية. زي ما المصريين بيقولوا «أنا busy النهارده».
          ar: sadar = منتبهون، udah = sudah، pake = pakai. linguistik = اللسانيات. alih kode (التناوب اللغوي) هو الانتقال من لغة إلى أخرى بحسب الموقف أو المخاطَب، وcampur kode (الخلط اللغوي) هو إدخال كلمات لغة في جملة بلغة أخرى، كقول بعضهم «أنا busy اليوم».
          en: sadar = aware, udah = sudah, pake = pakai. linguistik = linguistics. alih kode (code-switching) is moving between languages to suit the topic or person; campur kode (code-mixing) is dropping words of one language into a sentence in another - like an Egyptian saying "ana busy el-naharda".
      - speaker: Karim
        text: Ya habibti, di rumah kita juga gitu. Pagi bahasa Indonesia, siang bahasa Arab, malam... bahasa Jawa kalau aku mau minta maaf.
        ar_eg: يا حبيبتي، في بيتنا نفس الحكاية. الصبح إندونيسي، الضهر عربي، وبالليل... جاوي لو عايز أعتذر.
        ar: يا حبيبتي، في بيتنا الأمر نفسه. صباحًا الإندونيسية، وظهرًا العربية، وليلًا... الجاوية إذا أردتُ الاعتذار.
        en: Habibti, it's the same at our place. Indonesian in the morning, Arabic at midday, and at night... Javanese if I need to apologise.
        note:
          ar_eg: habibti = حبيبتي. gitu = begitu.
          ar: habibti = حبيبتي. gitu = begitu.
          en: habibti = my love (Arabic). gitu = begitu.
      - speaker: Bu Rahayu
        text: Lho, kenapa minta maafnya pakai bahasa Jawa, Mas Karim?
        ar_eg: وليه الاعتذار بالجاوي يا ماس كريم؟
        ar: ولماذا تعتذر بالجاوية يا ماس كريم؟
        en: Why apologise in Javanese, Mas Karim?
      - speaker: Karim
        text: Soalnya kalau pakai krama, Sari nggak bisa marah lama-lama, Bu. Bahasanya halus banget.
        ar_eg: عشان لو بالكراما، ساري مبتعرفش تزعل كتير يا ماما. اللغة ناعمة أوي.
        ar: لأنّي إن اعتذرتُ بالكراما لم تستطع ساري أن تغضب طويلًا يا أمي. فاللغة رقيقة جدًّا.
        en: Because if I use krama, Sari can't stay angry for long, Bu. The language is so gentle.
        note:
          ar_eg: soalnya = karena (أصل)، nggak = tidak، banget = sekali. krama = الجاوي المؤدّب.
          ar: soalnya = karena (لأنّ)، nggak = tidak، banget = sekali. krama = الجاوية المهذّبة.
          en: soalnya = karena (because), nggak = tidak, banget = sekali. krama = polite Javanese.
      - speaker: Pak Budi
        text: Itu ilmu yang Bapak pakai hampir tiga puluh tahun, Le. Jangan dibocorin!
        ar_eg: ده السرّ اللي أنا مستعمله بقالي قرب تلاتين سنة يا ابني. متفضحوش!
        ar: هذا علم أستعمله منذ قرابة ثلاثين عامًا يا بنيّ. لا تُفشِه!
        en: That's a trick I've been using for nearly thirty years, son. Don't give it away!
        note:
          ar_eg: dibocorin = dibocorkan (يتفضح/يتسرّب) - ‎-in‎ بدل ‎-kan‎.
          ar: dibocorin = dibocorkan (يُفشى) - ‎-in‎ بدل ‎-kan‎.
          en: dibocorin = dibocorkan (be leaked) - -in for -kan.
      - speaker: Bayu
        text: Ini bahan laporanku minggu ini. Judulnya "Satu Keluarga, Empat Bahasa - Catatan tentang Alih Kode". Boleh aku kutip semuanya?
        ar_eg: ده موضوع تقريري الأسبوع ده. عنوانه «عيلة واحدة وأربع لغات - ملاحظات عن التحويل اللغوي». ينفع أنقل كل الكلام ده؟
        ar: هذه مادّة تقريري لهذا الأسبوع، بعنوان «أسرة واحدة وأربع لغات - ملاحظات عن التناوب اللغوي». أيمكنني أن أقتبس كلّ هذا؟
        en: This is my report for the week. It's called "One Family, Four Languages - Notes on Code-Switching". Can I quote all of it?
        note:
          ar_eg: kutip = يقتبس.
          ar: kutip = يقتبس.
          en: kutip = quote.
      - speaker: Sari
        text: Boleh. Tapi kalimat Mas Karim soal minta maaf tadi... off the record, ya!
        ar_eg: ماشي. بس جملة كريم بتاعة الاعتذار دي... مش للنشر!
        ar: لك ذلك. لكنّ عبارة كريم عن الاعتذار... ليست للنشر!
        en: Fine. But Karim's line about apologising... that's off the record!
        note:
          ar_eg: soal = عن. off the record = مش للنشر (بالإنجليزي).
          ar: soal = عن. off the record = ليس للنشر.
          en: soal = about. off the record - English, not for publication.
