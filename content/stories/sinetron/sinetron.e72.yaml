schema: kabar.story/v1
id: sinetron.e72
series: sinetron
episode: 72
language: jv
level: j1
unlock_after: j1.u02
title:
  target: Sapa kowe?
  ar_eg: انت مين؟
  ar: من أنت؟
  en: Who are you?
summary:
  ar_eg: في قهوة صغيرة جنب التوجو، شابّ اسمه ماس يودا بيرمي على كريم أسئلة ورا بعض - مين، منين، إمتى، قدّ إيه. كريم بيكتشف إن كلمات السؤال بالجاوي هي أول مفتاح.
  ar: في مقهى صغير قرب التوغو، يمطر شابّ اسمه ماس يودا كريمًا بالأسئلة - من، ومن أين، ومتى، وكم. ويكتشف كريم أنّ أدوات الاستفهام الجاوية هي المفتاح الأوّل.
  en: At a little coffee stall near the Tugu, a young man called Mas Yudha fires question after question at Karim - who, where from, when, how much. Karim discovers that Javanese question words are the first key.
cast: [Karim, Mas Yudha, Mas Heru, Bakul]
scenes:
  - setting:
      ar_eg: قهوة على الرصيف جنب التوجو، بعد الضهر. كريم مستنّي ماس هيرو، وجنبه شابّ معاه شنطة كتب.
      ar: مقهى على الرصيف قرب التوغو، بعد الظهر. ينتظر كريم ماس هيرو، وبجانبه شابّ يحمل حقيبة كتب.
      en: A pavement coffee stall near the Tugu, in the afternoon. Karim is waiting for Mas Heru; beside him sits a young man with a bag of books.
    lines:
      - speaker: Mas Yudha
        text: Mas, sapa kowe? Kok nulis basa Jawa?
        ar_eg: يا أستاذ، انت مين؟ وبتكتب جاوي ليه؟
        ar: يا أستاذ، من أنت؟ ولماذا تكتب بالجاوية؟
        en: Mas, who are you? How come you're writing Javanese?
        note:
          ar_eg: "sapa = مين. وkok في أول السؤال بتبيّن الاستغراب، زي «ليه بقى؟» أو «إزّاي يعني؟». كلمات: nulis = يكتب."
          ar: "sapa = من. وkok في أوّل السؤال تدلّ على الاستغراب، مثل «كيف يعني؟». مفردات: nulis = يكتب."
          en: "sapa = who. kok at the start of a question shows surprise, like \"how come?\". Words: nulis = to write."
      - speaker: Karim
        text: Jenengku Karim. Aku saka Mesir.
        ar_eg: اسمي كريم. أنا من مصر.
        ar: اسمي كريم. أنا من مصر.
        en: My name's Karim. I'm from Egypt.
        note:
          ar_eg: jeneng = اسم، و-ku = بتاعي، يبقى Jenengku = «اسمي». وsaka = «من» (مكان).
          ar: jeneng = اسم، و-ku = ـي، فـJenengku = «اسمي». وsaka = «من» للمكان.
          en: jeneng = name, -ku = my, so Jenengku = "my name". saka = "from".
      - speaker: Mas Yudha
        text: Mesir? Saka ngendi? Kairo?
        ar_eg: مصر؟ منين بالظبط؟ القاهرة؟
        ar: مصر؟ من أين بالضبط؟ القاهرة؟
        en: Egypt? From where? Cairo?
      - speaker: Karim
        text: Iya, Kairo. Kowe sapa?
        ar_eg: أيوه، القاهرة. وانت مين؟
        ar: نعم، القاهرة. ومن أنت؟
        en: Yes, Cairo. And who are you?
      - speaker: Mas Yudha
        text: Aku Yudha, mahasiswa. Omahku neng Kotabaru. Kapan tekan Jogja?
        ar_eg: أنا يودا، طالب في الجامعة. ساكن في كوتابارو. وصلت جوجا إمتى؟
        ar: أنا يودا، طالب جامعي. أسكن في كوتابارو. متى وصلت إلى جوغجا؟
        en: I'm Yudha, a university student. I live in Kotabaru. When did you get to Jogja?
        note:
          ar_eg: kapan = إمتى. وtekan هنا يعني «وصل لـ». وneng = «في / لـ»، بيقولوها في جوجا على طول.
          ar: kapan = متى. وtekan هنا تعني «وصل إلى». وneng = «في / إلى»، ويكثر قولها في جوغجا.
          en: kapan = when. tekan here means "reach, arrive at". neng = at / to, said all the time in Jogja.
      - speaker: Karim
        text: Wingi. Aku neng kene sesasi.
        ar_eg: إمبارح. أنا هنا شهر.
        ar: أمس. سأبقى هنا شهرًا.
        en: Yesterday. I'm here for a month.
        note:
          ar_eg: "كلمات: kene = هنا (= sini)."
          ar: "مفردات: kene = هنا (= sini)."
          en: "Words: kene = here (= sini)."
      - speaker: Mas Yudha
        text: Lho, apik! Kerjamu apa, Mas?
        ar_eg: يا سلام، حلو! شغلك إيه يا أستاذ؟
        ar: رائع! ما عملك يا أستاذ؟
        en: Oh, nice! What's your job, Mas?
        note:
          ar_eg: "كلمات: lho = على فكرة! / إيه ده!"
          ar: "مفردات: lho = للتنبيه أو الدهشة."
          en: "Words: lho = you know! / oh!"
      - speaker: Karim
        text: Aku penerjemah. Arab, Inggris, Indonesia. Saiki Jawa!
        ar_eg: أنا مترجم. عربي وإنجليزي وإندونيسي. ودلوقتي جاوي!
        ar: أنا مترجم. عربية وإنجليزية وإندونيسية. والآن الجاوية!
        en: I'm a translator. Arabic, English, Indonesian. And now Javanese!
  - setting:
      ar_eg: ماس هيرو بيوصل جري، والبيّاعة بتيجي بالقهوة.
      ar: يصل ماس هيرو مسرعًا، وتأتي البائعة بالقهوة.
      en: Mas Heru arrives at a run, and the stallholder brings coffee.
    lines:
      - speaker: Mas Heru
        text: Sori, cah! Lho, Yudha? Wis kenalan karo Karim?
        ar_eg: معلش يا جماعة! الله، يودا؟ اتعرّفت على كريم خلاص؟
        ar: آسف يا جماعة! يودا؟ هل تعرّفت إلى كريم؟
        en: Sorry, guys! Oh, Yudha? Have you met Karim already?
        note:
          ar_eg: "كلمات: wis = خلاص، قبل كده (حصل)؛ karo = مع (= dengan / sama)."
          ar: "مفردات: wis = قد، بالفعل؛ karo = مع (= dengan / sama)."
          en: "Words: wis = already; karo = with (= dengan / sama)."
      - speaker: Mas Yudha
        text: Wis, Mas. Dheweke takon akeh!
        ar_eg: أيوه يا ماس. ده بيسأل كتير!
        ar: نعم يا ماس. إنه يسأل كثيرًا!
        en: Yep, Mas. He asks a lot of questions!
        note:
          ar_eg: "كلمات: akeh = كتير."
          ar: "مفردات: akeh = كثير."
          en: "Words: akeh = many, a lot (banyak)."
      - speaker: Karim
        text: Iki apa, Bu?
        ar_eg: ده إيه يا مدام؟
        ar: ما هذا يا سيدتي؟
        en: What's this, ma'am?
        note:
          ar_eg: "كلمات: iki = ده / دي (= ini)."
          ar: "مفردات: iki = هذا / هذه (= ini)."
          en: "Words: iki = this (= ini)."
      - speaker: Bakul
        text: Kopi tubruk, Mas. Kopi Jawa.
        ar_eg: قهوة توبروك يا أستاذ. قهوة جاوي.
        ar: قهوة توبروك يا أستاذ. قهوة جاوية.
        en: Kopi tubruk, Mas. Javanese coffee.
        note:
          ar_eg: kopi tubruk قهوة مطحونة ناعم بيتصبّ عليها الميّة السخنة في الكوباية، والبنّ بيرسب تحت - قريبة من القهوة التركي عندنا.
          ar: kopi tubruk قهوة مطحونة ناعمًا يُصبّ عليها الماء الساخن في الكوب ويرسب البنّ في القاع، وهي قريبة من القهوة التركية.
          en: kopi tubruk is finely ground coffee with hot water poured over it in the glass; the grounds settle at the bottom - close to Turkish coffee.
      - speaker: Karim
        text: Kaya kopi Mesir! Pira, Bu?
        ar_eg: زي القهوة المصري! بكام يا مدام؟
        ar: مثل القهوة المصرية! بكم يا سيدتي؟
        en: Like Egyptian coffee! How much, ma'am?
        note:
          ar_eg: "كلمات: kaya = زي، كأنّ."
          ar: "مفردات: kaya = مثل."
          en: "Words: kaya = like, as = seperti."
      - speaker: Bakul
        text: Limang ewu, Mas.
        ar_eg: خمسة آلاف يا أستاذ.
        ar: خمسة آلاف يا أستاذ.
        en: Five thousand, Mas.
        note:
          ar_eg: "كلمات: ewu = ألف (ribu)؛ sewu = 1000؛ limang = خمسة (قبل الوحدة)."
          ar: "مفردات: ewu = ألف (ribu)؛ sewu = 1000؛ limang = خمسة."
          en: "Words: ewu = thousand (ribu); sewu = 1,000; limang = five (before a unit)."
      - speaker: Narrator
        text: Kaca loro. Apa, sapa, ngendi, kapan, piye, pira.
        ar_eg: صفحة اتنين. إيه، مين، فين، إمتى، إزاي، كام.
        ar: الصفحة الثانية. ماذا، من، أين، متى، كيف، كم.
        en: Page two. What, who, where, when, how, how much.
        note:
          ar_eg: "كلمات: kaca = صفحة؛ loro = اتنين (dua)؛ قبل ewu: rong."
          ar: "مفردات: kaca = صفحة؛ loro = اثنان (dua)؛ قبل ewu: rong."
          en: "Words: kaca = page (of a book); loro = two (dua); before ewu: rong."
new_words:
  - word: sapa
    pos: question word
    ar_eg: مين
    ar: من
    en: who
  - word: ngendi
    pos: question word
    ar_eg: فين / منين (مع saka)
    ar: أين / من أين (مع saka)
    en: where (saka ngendi = from where)
  - word: kapan
    pos: question word
    ar_eg: إمتى
    ar: متى
    en: when
  - word: pira
    pos: question word
    ar_eg: كام، بكام
    ar: كم، بكم
    en: how much, how many
  - word: wingi
    pos: adverb
    ar_eg: إمبارح
    ar: أمس
    en: yesterday
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: يودا شغلته إيه؟
      ar: ما عمل يودا؟
      en: What does Yudha do?
    options: ["penerjemah", "mahasiswa", "bakul kopi"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Aku ___ Mesir.
    meaning:
      ar_eg: أنا من مصر.
      ar: أنا من مصر.
      en: I'm from Egypt.
    answers: [saka]
    options: ["saka", "sapa", "pira"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: لو عايز تسأل «بكام؟» بالجاوي، تقول إيه؟
      ar: إن أردت أن تسأل «بكم؟» بالجاوية، فماذا تقول؟
      en: To ask "how much?" in Javanese, what do you say?
    options: ["Kapan?", "Pira?", "Sapa?", "Ngendi?"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Jenengku Karim.
    answers_meaning:
      ar_eg: ["اسمي كريم.", "أنا اسمي كريم."]
      ar: ["اسمي كريم."]
      en: ["My name is Karim.", "My name's Karim."]
next:
  ar_eg: بالليل كريم بيلاقي رسالة من هيرو على الواتساب... بس مكتوبة بحروف ناقصة ومش فاهم منها حاجة.
  ar: في المساء يجد كريم رسالة من هيرو على واتساب... لكنها مكتوبة بحروف ناقصة ولا يفهم منها شيئًا.
  en: That night Karim gets a WhatsApp from Heru... but it's written with half the letters missing, and he can't make sense of it.
review:
  status: draft
  verified: false
  notes: Moved from Gubeng, Surabaya to the Tugu, Jogja (Mas Yudha lives in Kotabaru), 2026-10-27. Check "Kapan tekan Jogja?" and "Kerjamu apa?" as natural Jogja ngoko; 5,000 rupiah for kopi tubruk is a plausible street price.
