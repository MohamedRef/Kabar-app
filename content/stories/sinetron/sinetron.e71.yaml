id: sinetron.e71
series: sinetron
episode: 71
language: jv
level: j1
unlock_after: j1.u01
title:
  target: Piye kabare, Mas?
  ar_eg: إزيّك يا ماس؟
  ar: كيف حالك يا ماس؟
  en: How are you, Mas?
summary:
  ar_eg: موسم جديد بالجاوي! كريم، المترجم المصري، بيوصل جوجا عشان شغل ترجمة، ومعاه كشكول فاضي - عايز يكتب فيه كتاب صغير «جاوي للمصريين». أول مدرّس له؟ ماس هيرو، صاحب أنجكرينجان جنب ماليوبورو، اللي بيتكلّم جاوي الشارع.
  ar: موسم جديد بالجاوية! يصل كريم، المترجم المصري، إلى جوغجا في عمل ترجمة، ومعه دفتر فارغ يريد أن يكتب فيه كتيّبًا «الجاوية للمصريين». وأوّل معلّميه ماس هيرو، صاحب عربة أنغكرينغان قرب ماليوبورو، الذي يتكلّم جاوية الشارع.
  en: A new season, in Javanese! Karim, the Egyptian translator, arrives in Jogja for a translation job, carrying an empty notebook - he wants to write a little "Javanese for Egyptians" phrasebook. His first teacher? Mas Heru, who runs an angkringan near Malioboro and speaks street Javanese.
cast: [Karim, Mas Heru]
scenes:
  - setting:
      ar_eg: محطة توجو في جوجا، الصبح بدري. كريم نازل من قطر جاي من جاكرتا، وماس هيرو مستنّيه على الرصيف.
      ar: محطة توغو في جوغجا، في الصباح الباكر. ينزل كريم من قطار قادم من جاكرتا، وماس هيرو ينتظره على الرصيف.
      en: Tugu station in Jogja, early morning. Karim steps off a train from Jakarta, and Mas Heru is waiting on the platform.
    lines:
      - speaker: Narrator
        text: Jogja. Esuk.
        ar_eg: جوجا. الصبح.
        ar: جوغجا. الصباح.
        en: Jogja. Morning.
        note:
          ar_eg: الناس بيقولوا على يوجياكارتا «Jogja» على طول. وesuk يعني «الصبح» بالجاوي (بالإندونيسي pagi).
          ar: يسمّي الناس يوغياكارتا «Jogja» اختصارًا. وesuk تعني «الصباح» بالجاوية (وبالإندونيسية pagi).
          en: Everyone calls Yogyakarta "Jogja". esuk is Javanese for "morning" (Indonesian pagi).
      - speaker: Mas Heru
        text: Mas Karim! Sugeng enjing! Aku Heru.
        ar_eg: يا أستاذ كريم! صباح الخير! أنا هيرو.
        ar: أستاذ كريم! صباح الخير! أنا هيرو.
        en: Mas Karim! Good morning! I'm Heru.
      - speaker: Karim
        text: Selamat pagi, Pak Heru!
        ar_eg: صباح الخير يا أستاذ هيرو!
        ar: صباح الخير يا سيد هيرو!
        en: Good morning, Pak Heru!
        note:
          ar_eg: كريم لسه بيتكلّم إندونيسي، فقال Selamat pagi. هيرو قال بالجاوي Sugeng enjing - نفس المعنى، بس أرقى شوية.
          ar: ما زال كريم يتكلّم الإندونيسية، فقال Selamat pagi. أمّا هيرو فقال بالجاوية Sugeng enjing، وهي بالمعنى نفسه لكنها أرقى قليلًا.
          en: Karim still speaks Indonesian, so he says Selamat pagi. Heru said it in Javanese, Sugeng enjing - same meaning, a little more polite.
      - speaker: Mas Heru
        text: "Aja \"Pak\", Mas. \"Mas Heru\" wae."
        ar_eg: "بلاش «باك» يا أستاذ. «ماس هيرو» وخلاص."
        ar: "لا تقل «باك» يا أستاذ. «ماس هيرو» يكفي."
        en: "Not \"Pak\", Mas. Just \"Mas Heru\"."
        note:
          ar_eg: "Pak للراجل الكبير، وMas للراجل الشاب اللي أكبر منك شوية - زي «يا أستاذ» من غير رسميات. وaja يعني «ماتعملش / بلاش»، وwae يعني «بس / وخلاص»."
          ar: "Pak للرجل الكبير، وMas للرجل الشاب الأكبر منك قليلًا، مثل «يا أستاذ» بلا رسميات. وaja تعني «لا تفعل»، وwae تعني «فقط»."
          en: "Pak is for an older man, Mas for a young man a bit older than you - friendly, not formal. aja means \"don't\", wae means \"just\"."
      - speaker: Karim
        text: Mas Heru. Oke! Piye... kabare?
        ar_eg: ماس هيرو. ماشي! إزيّ... الحال؟
        ar: ماس هيرو. حسنًا! كيف... الحال؟
        en: Mas Heru. Okay! How... are you?
        note:
          ar_eg: "كلمات: oke = أوكي، ماشي."
          ar: "مفردات: oke = حسنًا."
          en: "Words: oke = OK."
      - speaker: Mas Heru
        text: Apik, apik! Kowe piye kabare, Mas?
        ar_eg: كويس، كويس! وانت عامل إيه يا أستاذ؟
        ar: بخير، بخير! وأنت، كيف حالك يا أستاذ؟
        en: Good, good! How are you, Mas?
        note:
          ar_eg: Piye kabare? = إزيّك؟ (بالإندونيسي Apa kabar?). والرد Apik يعني «كويس». وkowe يعني «انت» بالجاوي العادي (ngoko)، للصحاب واللي في سنّك.
          ar: Piye kabare? تعني «كيف حالك؟» (بالإندونيسية Apa kabar?). والردّ Apik أي «بخير». وkowe تعني «أنت» في الجاوية العادية (ngoko)، للأصدقاء ومن في سنّك.
          en: Piye kabare? = How are you? (Indonesian Apa kabar?). The answer Apik means "good". kowe is "you" in everyday Javanese (ngoko), for friends and people your age.
      - speaker: Karim
        text: Aku... apik. Nanging kesel.
        ar_eg: أنا... كويس. بس تعبان.
        ar: أنا... بخير. لكنّي متعب.
        en: I'm... fine. But tired.
        note:
          ar_eg: "كلمات: nanging = بس، لكن؛ kesel = تعبان."
          ar: "مفردات: nanging = لكن، غير أنّ؛ kesel = متعب."
          en: "Words: nanging = but, however; kesel = tired (capek)."
      - speaker: Mas Heru
        text: "Ya wajar to, Mas. Wah, Jakarta - Jogja!"
        ar_eg: "طبيعي طبعًا يا أستاذ. ياه، من جاكرتا لجوجا!"
        ar: "هذا طبيعي يا أستاذ. من جاكرتا إلى جوغجا، يا لها من رحلة!"
        en: "Of course, Mas. Phew, Jakarta to Jogja!"
        note:
          ar_eg: "to في آخر الكلام بتقول «طبعًا / أكيد»، وبيقولوها كتير في جوجا."
          ar: "to في آخر الجملة تعني «طبعًا»، ويكثر قولها في جوغجا."
          en: "to at the end means \"of course, obviously\" - very Jogja."
  - setting:
      ar_eg: بالليل، عند أنجكرينجان ماس هيرو جنب ماليوبورو. فانوس صغيّر، وشاي سخن، وكريم بيطلّع الكشكول الفاضي من الشنطة.
      ar: ليلًا، عند عربة أنغكرينغان ماس هيرو قرب ماليوبورو. فانوس صغير وشاي ساخن، ويُخرج كريم الدفتر الفارغ من حقيبته.
      en: Night, at Mas Heru's angkringan near Malioboro. A little lamp, hot tea, and Karim takes the empty notebook out of his bag.
    lines:
      - speaker: Karim
        text: "Mas, iki bukuku. Jawa kanggo Mesir!"
        ar_eg: "يا ماس، ده كشكولي. جاوي للمصريين!"
        ar: "يا ماس، هذا دفتري. الجاوية للمصريين!"
        en: "Mas, this is my book. Javanese for Egypt!"
        note:
          ar_eg: "angkringan = عربية أكل في الشارع - أكل رخيص وشاي سخن وقعدة على دكك. أشهر قعدة في جوجا. كلمات: iki = ده / دي (= ini)؛ kanggo = لـ، عشان (نغوكو)."
          ar: "angkringan = عربة طعام في الشارع - أكل رخيص وشاي ساخن وجلسة على مقاعد خشبية. أشهر جلسة في جوغجا. مفردات: iki = هذا / هذه (= ini)؛ kanggo = لِـ، من أجل (نغوكو)."
          en: "An angkringan is a street cart with cheap food, hot tea and wooden benches - Jogja's favourite hangout. Words: iki = this (= ini); kanggo = for (ngoko) = untuk."
      - speaker: Mas Heru
        text: "Wah, apik! Nanging kosong, Mas!"
        ar_eg: "واو، حلو! بس ده فاضي يا أستاذ!"
        ar: "رائع! لكنه فارغ يا أستاذ!"
        en: "Wow, nice! But it's empty, Mas!"
        note:
          ar_eg: "كلمات: kosong = فاضي."
          ar: "مفردات: kosong = فارغ."
          en: "Words: kosong = empty (= kosong)."
      - speaker: Karim
        text: Iya. Kowe guruku, Mas.
        ar_eg: أيوه. انت المدرّس بتاعي يا ماس.
        ar: نعم. أنت معلّمي يا ماس.
        en: Yes. You're my teacher, Mas.
      - speaker: Mas Heru
        text: Aku? Guru? Hahaha! Oke. Pelajaran siji, "Piye kabare?"
        ar_eg: أنا؟ مدرّس؟ ههههه! ماشي. الدرس الأول، «Piye kabare؟».
        ar: أنا؟ معلّم؟ ههههه! حسنًا. الدرس الأوّل، «Piye kabare؟».
        en: Me? A teacher? Hahaha! Okay. Lesson one, "Piye kabare?"
        note:
          ar_eg: "كلمات: siji = واحد (satu)."
          ar: "مفردات: siji = واحد (satu)."
          en: "Words: siji = one (satu)."
      - speaker: Karim
        text: Piye kabare? Apik!
        ar_eg: إزيّك؟ كويس!
        ar: كيف حالك؟ بخير!
        en: How are you? Good!
      - speaker: Mas Heru
        text: Pelajaran loro, aku lan kowe. Aku Heru, kowe Karim.
        ar_eg: الدرس التاني، «أنا» و«انت». أنا هيرو، وانت كريم.
        ar: الدرس الثاني، «أنا» و«أنت». أنا هيرو، وأنت كريم.
        en: Lesson two, "I" and "you". I'm Heru, you're Karim.
        note:
          ar_eg: "aku = أنا، kowe = انت، lan = و. الإضافة -ku في bukuku وguruku معناها «بتاعي» زي الإندونيسي. كلمات: loro = اتنين (dua)؛ قبل ewu: rong."
          ar: "aku = أنا، kowe = أنت، lan = و. واللاحقة -ku في bukuku وguruku تعني «ـي» (الملكية) كما في الإندونيسية. مفردات: loro = اثنان (dua)؛ قبل ewu: rong."
          en: "aku = I, kowe = you, lan = and. The -ku in bukuku and guruku means \"my\", just like in Indonesian. Words: loro = two (dua); before ewu: rong."
      - speaker: Narrator
        text: Kaca siji. Piye kabare, Mas?
        ar_eg: صفحة واحد. إزيّك يا ماس؟
        ar: الصفحة الأولى. كيف حالك يا ماس؟
        en: Page one. How are you, Mas?
        note:
          ar_eg: "كلمات: kaca = صفحة."
          ar: "مفردات: kaca = صفحة."
          en: "Words: kaca = page (of a book)."
new_words:
  - word: Piye kabare?
    ar_eg: إزيّك؟ / عامل إيه؟
    ar: كيف حالك؟
    en: How are you?
  - word: apik
    pos: adjective
    ar_eg: كويس، حلو
    ar: جيّد، حسن
    en: good, fine
  - word: kowe
    pos: pronoun
    ar_eg: انت (جاوي عادي)
    ar: أنت (الجاوية العادية)
    en: you (everyday Javanese)
  - word: Mas
    pos: noun
    ar_eg: لقب لراجل شاب أكبر منك شوية
    ar: لقب للرجل الشاب الأكبر منك قليلًا
    en: title for a young man a bit older than you
  - word: kesel
    pos: adjective
    ar_eg: تعبان
    ar: متعب
    en: tired
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: هيرو عايز كريم يناديه إزاي؟
      ar: بماذا يريد هيرو أن يناديه كريم؟
      en: What does Heru want Karim to call him?
    options: ["Pak Heru", "Mas Heru", "Mbah Heru"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Kowe piye ___, Mas?
    meaning:
      ar_eg: وانت عامل إيه يا أستاذ؟
      ar: وأنت، كيف حالك يا أستاذ؟
      en: How are you, Mas?
    answers: [kabare]
    options: ["kabare", "kesel", "apik"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: كريم عايز يكتب إيه في الكشكول؟
      ar: ماذا يريد كريم أن يكتب في الدفتر؟
      en: What does Karim want to write in his notebook?
    options: ["buku masak", "basa Jawa kanggo wong Mesir", "jadwal sepur"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Aku apik, nanging kesel.
    answers_meaning:
      ar_eg: ["أنا كويس، بس تعبان.", "أنا كويس لكن تعبان."]
      ar: ["أنا بخير، لكنّي متعب.", "أنا بخير لكنّي تعبان."]
      en: ["I'm fine, but tired.", "I'm good, but I'm tired."]
next:
  ar_eg: كريم بيقابل هيرو في قهوة جنب التوجو... وأول سؤال من حد غريب بيوقّعه، Sapa kowe؟
  ar: يلتقي كريم بهيرو في مقهى قرب التوغو... وأوّل سؤال من غريب يوقعه في الحيرة، Sapa kowe؟
  en: Karim meets Heru at a coffee stall near the Tugu... and a stranger's first question trips him up - Sapa kowe?
review:
  status: draft
  verified: false
  notes: Moved from Surabaya (Cak Heru, Arek speech) to Jogja (Mas Heru, Mataraman street ngoko), 2026-10-27. Check "Aja 'Pak', aku isih enom" and "Ya wajar to" as natural Jogja ngoko.
