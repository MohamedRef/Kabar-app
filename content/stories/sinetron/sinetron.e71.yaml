id: sinetron.e71
series: sinetron
episode: 71
language: jv
level: j1
unlock_after: j1.u01
title:
  target: Piye kabare, rek?
  ar_eg: إزيّك يا صاحبي؟
  ar: كيف حالك يا صديقي؟
  en: How are you, mate?
summary:
  ar_eg: موسم جديد بالجاوي! كريم، المترجم المصري، بيوصل سورابايا عشان شغل ترجمة، ومعاه كشكول فاضي - عايز يكتب فيه كتاب صغير «جاوي للمصريين». أول مدرّس له؟ زميله تشاك هيرو، اللي بيتكلّم جاوي سورابايا السريع.
  ar: موسم جديد بالجاوية! يصل كريم، المترجم المصري، إلى سورابايا في عمل ترجمة، ومعه دفتر فارغ يريد أن يكتب فيه كتيّبًا «الجاوية للمصريين». وأوّل معلّميه زميله تشاك هيرو، الذي يتكلّم جاوية سورابايا السريعة.
  en: A new season, in Javanese! Karim, the Egyptian translator, arrives in Surabaya for a translation job, carrying an empty notebook - he wants to write a little "Javanese for Egyptians" phrasebook. His first teacher? His colleague Cak Heru, who speaks fast Surabaya Javanese.
cast: [Karim, Cak Heru]
scenes:
  - setting:
      ar_eg: محطة باسار توري في سورابايا، الصبح بدري. كريم نازل من قطر جاي من جاكرتا، وتشاك هيرو مستنّيه على الرصيف.
      ar: محطة باسار توري في سورابايا، في الصباح الباكر. ينزل كريم من قطار قادم من جاكرتا، وتشاك هيرو ينتظره على الرصيف.
      en: Pasar Turi station in Surabaya, early morning. Karim steps off a train from Jakarta, and Cak Heru is waiting on the platform.
    lines:
      - speaker: Narrator
        text: Suroboyo. Esuk.
        ar_eg: سورابايا. الصبح.
        ar: سورابايا. الصباح.
        en: Surabaya. Morning.
        note:
          ar_eg: أهل سورابايا بيقولوا على مدينتهم Suroboyo. وesuk يعني «الصبح» بالجاوي (بالإندونيسي pagi).
          ar: يسمّي أهل سورابايا مدينتهم Suroboyo. وesuk تعني «الصباح» بالجاوية (وبالإندونيسية pagi).
          en: Locals call their city Suroboyo. esuk is Javanese for "morning" (Indonesian pagi).
      - speaker: Cak Heru
        text: Mas Karim! Sugeng enjing! Aku Heru.
        ar_eg: يا أستاذ كريم! صباح الخير! أنا هيرو.
        ar: أستاذ كريم! صباح الخير! أنا هيرو.
        en: Mas Karim! Good morning! I'm Heru.
      - speaker: Karim
        text: Selamat pagi, Mas Heru!
        ar_eg: صباح الخير يا ماس هيرو!
        ar: صباح الخير يا ماس هيرو!
        en: Good morning, Mas Heru!
        note:
          ar_eg: كريم لسه بيتكلّم إندونيسي، فقال Selamat pagi. هيرو قال بالجاوي Sugeng enjing - نفس المعنى، بس أرقى شوية.
          ar: ما زال كريم يتكلّم الإندونيسية، فقال Selamat pagi. أمّا هيرو فقال بالجاوية Sugeng enjing، وهي بالمعنى نفسه لكنها أرقى قليلًا.
          en: Karim still speaks Indonesian, so he says Selamat pagi. Heru said it in Javanese, Sugeng enjing - same meaning, a little more polite.
      - speaker: Cak Heru
        text: Ojok "Mas", rek. Nang Suroboyo, aku "Cak Heru".
        ar_eg: بلاش «ماس» يا صاحبي. في سورابايا، أنا «تشاك هيرو».
        ar: لا تقل «ماس» يا صديقي. في سورابايا أنا «تشاك هيرو».
        en: Not "Mas", mate. In Surabaya, I'm "Cak Heru".
        note:
          ar_eg: Cak هي «ماس» بتاعة سورابايا - لقب لراجل شاب، زي «يا معلّم» عندنا. وrek (من arek، يعني «عيّل») بتتقال في آخر الكلام زي «يا صاحبي». وojok يعني «ماتعملش / بلاش» بلهجة سورابايا.
          ar: Cak هي «ماس» في سورابايا، لقب للرجل الشاب. وrek (من arek أي «ولد») تُقال في آخر الجملة بمعنى «يا صاحبي». وojok تعني «لا تفعل» بلهجة سورابايا.
          en: Cak is Surabaya's "Mas" - a title for a young man. rek (from arek, "kid") ends sentences like "mate". ojok is Surabaya dialect for "don't".
      - speaker: Karim
        text: Cak Heru. Oke! Piye... kabare?
        ar_eg: تشاك هيرو. ماشي! إزيّ... الحال؟
        ar: تشاك هيرو. حسنًا! كيف... الحال؟
        en: Cak Heru. Okay! How... are you?
      - speaker: Cak Heru
        text: Apik, apik! Kowe piye kabare, rek?
        ar_eg: كويس، كويس! وانت عامل إيه يا صاحبي؟
        ar: بخير، بخير! وأنت، كيف حالك يا صديقي؟
        en: Good, good! How are you, mate?
        note:
          ar_eg: Piye kabare? = إزيّك؟ (بالإندونيسي Apa kabar?). والرد Apik يعني «كويس». وkowe يعني «انت» بالجاوي العادي (ngoko)، للصحاب واللي في سنّك.
          ar: Piye kabare? تعني «كيف حالك؟» (بالإندونيسية Apa kabar?). والردّ Apik أي «بخير». وkowe تعني «أنت» في الجاوية العادية (ngoko)، للأصدقاء ومن في سنّك.
          en: Piye kabare? = How are you? (Indonesian Apa kabar?). The answer Apik means "good". kowe is "you" in everyday Javanese (ngoko), for friends and people your age.
      - speaker: Karim
        text: Aku... apik. Nanging kesel.
        ar_eg: أنا... كويس. بس تعبان.
        ar: أنا... بخير. لكنّي متعب.
        en: I'm... fine. But tired.
      - speaker: Cak Heru
        text: Yo wajar, rek. Sepur saka Jakarta suwe.
        ar_eg: طبيعي يا صاحبي. القطر من جاكرتا طويل.
        ar: هذا طبيعي يا صديقي. القطار من جاكرتا رحلته طويلة.
        en: Of course, mate. The train from Jakarta takes ages.
  - setting:
      ar_eg: في أتوبيس سورابايا الأحمر. كريم بيطلّع الكشكول الفاضي من الشنطة.
      ar: في حافلة سورابايا الحمراء. يُخرج كريم الدفتر الفارغ من حقيبته.
      en: On the red Suroboyo Bus. Karim takes the empty notebook out of his bag.
    lines:
      - speaker: Karim
        text: Cak, iki bukuku. Buku cilik, basa Jawa kanggo wong Mesir.
        ar_eg: يا تشاك، ده كشكولي. كتاب صغير، جاوي للمصريين.
        ar: يا تشاك، هذا دفتري. كتيّب صغير، الجاوية للمصريين.
        en: Cak, this is my book. A little book, Javanese for Egyptians.
      - speaker: Cak Heru
        text: Wah, apik tenan! Nanging kosong, rek!
        ar_eg: واو، حلو أوي! بس ده فاضي يا صاحبي!
        ar: رائع جدًّا! لكنه فارغ يا صديقي!
        en: Wow, really nice! But it's empty, mate!
      - speaker: Karim
        text: Iya. Kowe guruku, Cak.
        ar_eg: أيوه. انت المدرّس بتاعي يا تشاك.
        ar: نعم. أنت معلّمي يا تشاك.
        en: Yes. You're my teacher, Cak.
      - speaker: Cak Heru
        text: Aku? Guru? Hahaha! Oke, rek. Pelajaran siji, "Piye kabare?"
        ar_eg: أنا؟ مدرّس؟ ههههه! ماشي يا صاحبي. الدرس الأول، «Piye kabare؟».
        ar: أنا؟ معلّم؟ ههههه! حسنًا يا صديقي. الدرس الأوّل، «Piye kabare؟».
        en: Me? A teacher? Hahaha! Okay, mate. Lesson one, "Piye kabare?"
      - speaker: Karim
        text: Piye kabare? Apik!
        ar_eg: إزيّك؟ كويس!
        ar: كيف حالك؟ بخير!
        en: How are you? Good!
      - speaker: Cak Heru
        text: Pelajaran loro, aku lan kowe. Aku Heru, kowe Karim.
        ar_eg: الدرس التاني، «أنا» و«انت». أنا هيرو، وانت كريم.
        ar: الدرس الثاني، «أنا» و«أنت». أنا هيرو، وأنت كريم.
        en: Lesson two, "I" and "you". I'm Heru, you're Karim.
        note:
          ar_eg: aku = أنا، kowe = انت، lan = و. الإضافة -ku في bukuku وguruku معناها «بتاعي» زي الإندونيسي.
          ar: aku = أنا، kowe = أنت، lan = و. واللاحقة -ku في bukuku وguruku تعني «ـي» (الملكية) كما في الإندونيسية.
          en: aku = I, kowe = you, lan = and. The -ku in bukuku and guruku means "my", just like in Indonesian.
      - speaker: Narrator
        text: Kaca siji. Piye kabare, rek?
        ar_eg: صفحة واحد. إزيّك يا صاحبي؟
        ar: الصفحة الأولى. كيف حالك يا صديقي؟
        en: Page one. How are you, mate?
new_words:
  - word: Piye kabare?
    ar_eg: إزيّك؟ / عامل إيه؟
    ar: كيف حالك؟
    en: How are you?
  - word: apik
    pos: adjective
    ar_eg: كويس، حلو
    ar: جيّد، حسن
    en: good, fine
  - word: kowe
    pos: pronoun
    ar_eg: انت (جاوي عادي)
    ar: أنت (الجاوية العادية)
    en: you (everyday Javanese)
  - word: Cak
    pos: noun
    ar_eg: لقب لراجل شاب في سورابايا
    ar: لقب للرجل الشاب في سورابايا
    en: title for a young man in Surabaya
  - word: kesel
    pos: adjective
    ar_eg: تعبان
    ar: متعب
    en: tired
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: هيرو عايز كريم يناديه إزاي في سورابايا؟
      ar: بماذا يريد هيرو أن يناديه كريم في سورابايا؟
      en: What does Heru want Karim to call him in Surabaya?
    options: ["Mas Heru", "Cak Heru", "Pak Heru"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Kowe piye ___, rek?
    meaning:
      ar_eg: وانت عامل إيه يا صاحبي؟
      ar: وأنت، كيف حالك يا صديقي؟
      en: How are you, mate?
    answers: [kabare]
    options: ["kabare", "kesel", "apik"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: كريم عايز يكتب إيه في الكشكول؟
      ar: ماذا يريد كريم أن يكتب في الدفتر؟
      en: What does Karim want to write in his notebook?
    options: ["buku masak", "basa Jawa kanggo wong Mesir", "jadwal sepur"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Aku apik, nanging kesel.
    answers_meaning:
      ar_eg: ["أنا كويس، بس تعبان.", "أنا كويس لكن تعبان."]
      ar: ["أنا بخير، لكنّي متعب.", "أنا بخير لكنّي تعبان."]
      en: ["I'm fine, but tired.", "I'm good, but I'm tired."]
next:
  ar_eg: كريم بيقابل هيرو في قهوة جنب محطة جوبينج... وأول سؤال من حد غريب بيوقّعه، Sapa kowe؟
  ar: يلتقي كريم بهيرو في مقهى قرب محطة غوبينغ... وأوّل سؤال من غريب يوقعه في الحيرة، Sapa kowe؟
  en: Karim meets Heru at a coffee stall near Gubeng station... and a stranger's first question trips him up - Sapa kowe?
review:
  status: draft
  verified: false
  notes: Arek forms (ojok, rek, Cak) to be checked by a Surabaya speaker.
