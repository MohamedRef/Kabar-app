questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: ليه مية النهر لونها زي الشاي؟
      ar: لماذا لون ماء النهر كالشاي؟
      en: Why is the river water the colour of tea?
    options: ["Karena airnya kotor.", "Karena orang membuang teh ke sungai.", "Karena daun-daun terendam di air dari hutan gambut.", "Karena klotok mengeluarkan minyak."]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Itu salah satu sebab mereka terancam ___.
    meaning:
      ar_eg: وده سبب من أسباب إنهم مهدّدين بالانقراض.
      ar: وهذا من أسباب تهدّدهم بالانقراض.
      en: That's one reason they're endangered.
    answers: [punah]
    options: ["punah", "terbakar", "terendam"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه باك رحمت مش قادر يقول إن نخل الزيت وحش؟
      ar: لماذا لا يستطيع باك رحمت أن يقول إنّ نخيل الزيت شرّ؟
      en: Why can't Pak Rahmat say that palm oil is evil?
    options: ["Karena dia tidak tahu apa-apa tentang sawit.", "Karena dia pemilik kebun sawit.", "Karena orangutan suka makan sawit.", "Karena keluarga kakaknya hidup dari kebun sawit."]
    answer: 3
  - id: q04
    type: listen
    text: Hutan dan lahan gambut terbakar berbulan-bulan. Kota kami tertutup asap, sekolah diliburkan.
    question:
      ar_eg: إيه اللي حصل للمدارس سنة ٢٠١٥؟
      ar: ماذا حدث للمدارس عام ٢٠١٥؟
      en: What happened to the schools in 2015?
    options: ["Sekolah terbakar.", "Sekolah diliburkan.", "Sekolah kebanjiran.", "Sekolah pindah ke kota lain."]
    answer: 1
    meaning:
      ar_eg: الغابات وأراضي الخُثّ فضلت تولّع شهور. مدينتنا اتغطّت دخان، والمدارس قفلت.
      ar: احترقت الغابات وأراضي الخُثّ شهورًا، وغطّى الدخان مدينتنا، وعُطّلت المدارس.
      en: The forests and peatland burned for months. Our town was covered in smoke, and schools were closed.
  - id: q05
    type: translate
    direction: from_target
    source_text: Di sini kita tamunya. Pemilik rumahnya mereka.
    answers_meaning:
      ar_eg: ["هنا إحنا الضيوف. صحاب البيت هما.", "إحنا هنا ضيوف، وهما صحاب البيت.", "هنا إحنا الضيوف، وأصحاب البيت هما."]
      ar: ["نحن هنا الضيوف، وأصحاب البيت هم.", "هنا نحن الضيوف، وهم أصحاب البيت.", "نحن ضيوف هنا، وأصحاب الدار هم."]
      en: ["Here we're the guests. They own the house.", "Here, we are the guests and they are the owners of the house.", "We're the guests here; the house belongs to them."]
next:
  ar_eg: شغل ساري بياخدها لبالانجكا رايا، وهناك بتتفرّج على رقصة دياك بريش طير البوقير. وفي ماديون، بايو داخل حفلة فنون المدرسة... لابس ماسك، ومش فاكر الخطوات.
  ar: يأخذ العمل ساري إلى بالانغكا رايا، فتشاهد رقصة داياكية بريش طائر أبي قرن. وفي ماديون يشارك بايو في حفل الفنون المدرسي... مرتديًا قناعًا، وقد نسي الخطوات.
  en: Work takes Sari to Palangka Raya, where she watches a Dayak dance with hornbill feathers. And in Madiun, Bayu takes part in the school arts night... wearing a mask, and with no memory of the steps.
