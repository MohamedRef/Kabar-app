title:
  target: Di Sini, Kita Tamunya
  ar_eg: هنا، إحنا الضيوف
  ar: هنا نحن الضيوف
  en: Here, We're the Guests
summary:
  ar_eg: ساري وزميلتها لينا بيركبوا «كلوتوك» - مركب خشب - في نهر لونه زي الشاي في حديقة تانجونج بوتينج الوطنية. بيشوفوا قرود بمناخير كبيرة، وأم أورانجوتان شايلة بنتها. وبالليل، تحت اليراعات، المرشد بيحكي عن نخل الزيت والحرايق... ومفيش إجابة سهلة.
  ar: تركب ساري وزميلتها لينا «كلوتوك» - قاربًا خشبيًّا - في نهر بلون الشاي في متنزّه تانجونغ بوتينغ الوطني. يريان قرودًا ذوات أنوف كبيرة، وأمًّا من إنسان الغاب تحمل صغيرتها. وفي الليل، تحت اليراعات، يحدّثهما المرشد عن نخيل الزيت والحرائق... ولا جواب سهلًا.
  en: Sari and her colleague Lina board a klotok - a wooden riverboat - on a tea-coloured river in Tanjung Puting National Park. They see big-nosed monkeys and a mother orangutan carrying her baby. At night, under the fireflies, the guide talks about palm oil and fires... and there's no easy answer.
cast: [Pak Rahmat, Sari, Mbak Lina, Bayu, Pak Budi]
scenes:
  - setting:
      ar_eg: كاليمانتان الوسطى، نهاية الأسبوع. مركب «كلوتوك» خشب بدورين ماشي بالراحة في نهر سيكونيير، والغابة على الناحيتين.
      ar: كاليمانتان الوسطى، عطلة نهاية الأسبوع. قارب «كلوتوك» خشبيّ بطابقين يسير ببطء في نهر سيكونيير، والغابة على الضفّتين.
      en: Central Kalimantan, at the weekend. A two-deck wooden klotok chugs slowly up the Sekonyer River, with forest on both banks.
    lines:
      - speaker: Narrator
        text: Sari dan Mbak Lina, teman kantornya, terbang ke Pangkalan Bun. Dari Pelabuhan Kumai, mereka naik klotok menuju Taman Nasional Tanjung Puting.
        ar_eg: ساري ولينا زميلتها في الشغل طاروا لبانكالان بون. ومن ميناء كوماي، ركبوا الكلوتوك رايحين حديقة تانجونج بوتينج الوطنية.
        ar: سافرت ساري وزميلتها لينا جوًّا إلى بانكالان بون، ومن ميناء كوماي ركبتا الكلوتوك متّجهتين إلى متنزّه تانجونغ بوتينغ الوطني.
        en: Sari and her office colleague, Mbak Lina, fly to Pangkalan Bun. From Kumai harbour, they take a klotok to Tanjung Puting National Park.
        note:
          ar_eg: الكلوتوك اسمه جاي من صوت الموتور بتاعه «توك-توك-توك». في رحلات تانجونج بوتينج الناس بتاكل وتنام على سطح المركب نفسه، تحت ناموسية.
          ar: اسم الكلوتوك مأخوذ من صوت محرّكه «توك-توك-توك». وفي رحلات تانجونغ بوتينغ يأكل الزوّار وينامون على سطح القارب نفسه تحت ناموسية.
          en: The klotok is named after the sound of its engine, "tok-tok-tok". On Tanjung Puting trips, visitors eat and sleep on the deck itself, under a mosquito net.
      - speaker: Pak Rahmat
        text: Selamat datang di klotok saya, Mbak-Mbak. Tiga hari ini, perahu ini rumah kalian. Kita makan, tidur, sama lihat matahari terbit dari sini.
        ar_eg: أهلًا بيكم في الكلوتوك بتاعي يا بنات. تلات أيام، المركب ده بيتكم. هناكل وننام ونشوف الشمس وهي طالعة من هنا.
        ar: أهلًا بكما في قاربي. ثلاثة أيام سيكون هذا القارب بيتكما، نأكل وننام ونرى شروق الشمس من هنا.
        en: Welcome to my klotok, ladies. For three days, this boat is your home. We'll eat, sleep, and watch the sunrise from here.
        note:
          ar_eg: klotok = مركب خشب في النهر، sama = dan، lihat = melihat.
          ar: klotok = قارب نهري خشبي، sama = dan، lihat = melihat.
          en: klotok = wooden river boat, sama = dan (and), lihat = melihat (see).
      - speaker: Mbak Lina
        text: Pak, kok air sungainya warnanya cokelat tua, kayak teh?
        ar_eg: يا باك، ليه مية النهر لونها بنّي غامق كده، زي الشاي؟
        ar: يا باك، لماذا لون ماء النهر بنّيّ داكن كالشاي؟
        en: Pak, why is the river water dark brown, like tea?
        note:
          ar_eg: kok = «إزّاي/ليه كده» باستغراب، kayak = seperti، warnanya = لونه.
          ar: kok = «كيف ذلك؟» مع تعجّب، kayak = seperti، warnanya = لونه.
          en: kok = how come (surprised why), kayak = seperti (like), warnanya = its colour.
      - speaker: Pak Rahmat
        text: Soalnya airnya ngalir dari hutan rawa gambut. Daun-daun yang terendam bertahun-tahun bikin warnanya kayak teh. Tapi airnya nggak kotor kok, Mbak.
        ar_eg: عشان المية جاية من غابة مستنقعات الخُثّ. ورق الشجر اللي غرقان فيها بقاله سنين بيدّيها اللون ده. بس المية مش وسخة يا بنتي.
        ar: لأنّ الماء يجري من غابة مستنقعات الخُثّ، والأوراق المغمورة فيها منذ سنين تمنحه لون الشاي. لكنّ الماء ليس متّسخًا.
        en: Because the water flows out of the peat swamp forest. Leaves that have soaked in it for years give it that tea colour. But the water isn't dirty, Mbak.
        note:
          ar_eg: gambut (الخُثّ) تربة من نباتات متحلّلة، مليانة مية وكربون. وterendam (غرقان / متنقّع) فيها بادئة ter- اللي بتوصف حالة، مش فعل حدّ عمله قاصد. وفي الكلام - soalnya = karena، ngalir = mengalir (يجري)، bikin = membuat.
          ar: gambut (الخُثّ) تربة من نباتات متحلّلة غنيّة بالماء والكربون. وterendam (مغمور) فيها السابقة ter- التي تصف حالة لا فعلًا مقصودًا. وفي الكلام - soalnya = karena، ngalir = mengalir (يجري)، bikin = membuat.
          en: gambut (peat) is soil made of rotting plants, full of water and carbon. terendam (soaked, submerged) uses ter- for a state, not a deliberate action. Spoken forms - soalnya = karena (because), ngalir = mengalir (flow), bikin = membuat (make).
      - speaker: Narrator
        text: Di pohon-pohon di tepi sungai, sekelompok monyet berhidung besar melompat dari dahan ke dahan.
        ar_eg: على الشجر اللي على حرف النهر، مجموعة قرود مناخيرها كبيرة بتنطّ من فرع لفرع.
        ar: على الأشجار عند ضفّة النهر، جماعة من القرود ذات الأنوف الكبيرة تقفز من غصن إلى غصن.
        en: In the trees along the bank, a troop of big-nosed monkeys leaps from branch to branch.
      - speaker: Sari
        text: Lihat, Lin! Hidungnya gede banget, perutnya buncit lagi!
        ar_eg: بصّي يا لين! مناخيره كبيرة أوي، وكرشه كبير!
        ar: انظري يا لين! أنفه كبير جدًّا، وبطنه منتفخ!
        en: Look, Lin! What a huge nose - and what a pot belly!
        note:
          ar_eg: gede banget = besar sekali، buncit = كرشه كبير، lagi هنا = «وكمان».
          ar: gede banget = besar sekali، buncit = ذو كرش، lagi هنا = «وفوق ذلك».
          en: gede banget = besar sekali, buncit = pot-bellied, lagi here = on top of that.
      - speaker: Pak Rahmat
        text: Itu bekantan, Mbak. Bekantan cuma ada di Kalimantan. Mereka jago berenang, kakinya agak berselaput kayak kaki bebek.
        ar_eg: ده «بيكانتان» يا بنتي. البيكانتان مالوش وجود غير في كاليمانتان. شاطر في العوم، وصوابع رجليه بينها جلدة صغيّرة زي البطّة.
        ar: هذا قرد «بيكانتان». لا يعيش إلّا في كاليمانتان، ويجيد السباحة، وبين أصابع قدميه أغشية صغيرة كقدم البطّة.
        en: That's a bekantan, Mbak - a proboscis monkey. They're only found in Borneo. They're good swimmers, and their feet are slightly webbed, like a duck's.
        note:
          ar_eg: البيكانتان (قرد الأنف الطويل) من الحيوانات اللي بتعيش في بورنيو بس، وهو رمز محافظة كاليمانتان الجنوبية. cuma = hanya، jago = pandai (شاطر)، agak = sedikit، berselaput = برجل غشائية، bebek = بطّة.
          ar: البيكانتان (قرد الأنف الطويل) من الحيوانات المستوطنة في بورنيو وحدها، وهو رمز محافظة كاليمانتان الجنوبية. cuma = hanya، jago = pandai (ماهر)، agak = sedikit، berselaput = ذو أغشية، bebek = بطّة.
          en: The proboscis monkey (bekantan) lives only on Borneo, and it's the mascot of South Kalimantan province. cuma = hanya, jago = pandai (good at), agak = sedikit (a bit), berselaput = webbed, bebek = duck.
      - speaker: Narrator
        text: Siang harinya, mereka berjalan ke tempat pemberian makan di Camp Leakey. Seorang penjaga meletakkan pisang di atas panggung kayu. Hutan menjadi sunyi.
        ar_eg: الضهر، مشيوا لمكان الأكل في كامب ليكي. حارس حطّ موز على منصّة خشب. والغابة سكتت خالص.
        ar: ظهرًا سارتا إلى منصّة الإطعام في معسكر ليكي. وضع أحد الحرّاس الموز على منصّة خشبية، وساد الغابةَ صمت.
        en: At midday, they walk to the feeding platform at Camp Leakey. A ranger puts bananas on a wooden platform. The forest goes quiet.
        note:
          ar_eg: كامب ليكي اتأسّس سنة ١٩٧١ عشان يدرس الأورانجوتان ويرجّع اللي اتنقذ منهم للغابة. وكلمة orangutan جاية من الملايو - orang (إنسان) + hutan (غابة)، يعني «إنسان الغابة».
          ar: أُسّس معسكر ليكي عام ١٩٧١ لدراسة إنسان الغاب وإعادة المُنقَذ منه إلى الغابة. وكلمة orangutan ملايوية - orang (إنسان) + hutan (غابة)، أي «إنسان الغاب».
          en: Camp Leakey was set up in 1971 to study orangutans and return rescued ones to the forest. The word orangutan is Malay - orang (person) + hutan (forest), "person of the forest".
      - speaker: Pak Rahmat
        text: Ssst. Ingat, di sini kita tamunya. Pemilik rumahnya mereka.
        ar_eg: هسّ. افتكروا، هنا إحنا الضيوف. صحاب البيت هما.
        ar: صه. تذكّرا أنّنا هنا الضيوف، وأصحاب البيت هم.
        en: Shh. Remember, here we're the guests. They own the house.
      - speaker: Sari
        text: Itu dia... Ada bayi kecil di punggung ibunya. Matanya kayak mata manusia.
        ar_eg: أهي جت... فيه بيبي صغيّر على ضهر أمّه. عينيه زي عينين البني آدمين.
        ar: ها هي... ثمّة صغير على ظهر أمّه، وعيناه كعينَي إنسان.
        en: There she is... There's a tiny baby on its mother's back. Its eyes are just like a person's.
      - speaker: Pak Rahmat
        text: Induk orangutan ngerawat anaknya sampai tujuh atau delapan tahun. Itu salah satu sebab mereka terancam punah. Anaknya sedikit, hutannya makin berkurang.
        ar_eg: أمّ الأورانجوتان بتربّي ابنها لحد سبع أو تمن سنين. وده سبب من أسباب إنهم مهدّدين بالانقراض. عيالهم قليلين، والغابة بتقلّ أكتر وأكتر.
        ar: ترعى أمّ إنسان الغاب صغيرها حتى سبع سنوات أو ثمانٍ، وهذا من أسباب تهدّده بالانقراض - صغاره قليلة، والغابة تتناقص باستمرار.
        en: An orangutan mother looks after her baby for seven or eight years. That's one reason they're critically endangered. They have few young, while the forest keeps shrinking.
        note:
          ar_eg: terancam punah (مهدّد بالانقراض) - تاني ter- للحالة. الأورانجوتان البورنيوي متصنّف «مهدّد بالانقراض بشدّة» من ٢٠١٦. ngerawat = merawat (يربّي)، induk = الأمّ (للحيوان)، makin berkurang = بيقلّ أكتر وأكتر.
          ar: terancam punah (مهدّد بالانقراض) - مرّة أخرى ter- للحالة. وقد صُنّف إنسان الغاب البورنيوي «مهدّدًا بالانقراض بشدّة» منذ ٢٠١٦. ngerawat = merawat (يرعى)، induk = الأمّ (للحيوان)، makin berkurang = يتناقص باستمرار.
          en: terancam punah (threatened with extinction) - ter- for a state again. The Bornean orangutan has been listed as critically endangered since 2016. ngerawat = merawat (look after), induk = mother (animal), makin berkurang = keeps shrinking.
      - speaker: Mbak Lina
        text: Delapan tahun buat satu anak? Ibu orangutan lebih sabar daripada ibuku. Kami lima bersaudara, Ibu udah capek di anak ketiga.
        ar_eg: تمن سنين لعيّل واحد؟ أمّ الأورانجوتان أصبر من أمّي. إحنا خمس إخوات، وماما كانت تعبت خلاص من التالت.
        ar: ثماني سنوات لصغير واحد؟ أمّ إنسان الغاب أصبر من أمّي. نحن خمسة إخوة، وكانت أمّي قد تعبت منذ الثالث.
        en: Eight years for one baby? An orangutan mum is more patient than mine. There are five of us, and Mum was worn out by the third.
        note:
          ar_eg: buat = untuk، udah = sudah، bersaudara = إخوات، ketiga = التالت.
          ar: buat = untuk، udah = sudah، bersaudara = إخوة، ketiga = الثالث.
          en: buat = untuk, udah = sudah, bersaudara = siblings, ketiga = third. orangutan = orangutan.
  - setting:
      ar_eg: بالليل، الكلوتوك راسي على حرف النهر. آلاف اليراعات بتنوّر وتطفي في الشجر، وريحة القهوة طالعة من المطبخ الصغير.
      ar: ليلًا، الكلوتوك راسٍ عند ضفّة النهر. آلاف اليراعات تومض بين الأشجار، ورائحة القهوة تفوح من المطبخ الصغير.
      en: Night. The klotok is moored by the bank. Thousands of fireflies blink in the trees, and the smell of coffee drifts from the little galley.
    lines:
      - speaker: Sari
        text: Pak Rahmat, tadi di jalan ke Kumai saya lihat kebun sawit yang luas banget. Sawit itu musuh hutan, ya?
        ar_eg: يا باك رحمت، وإحنا رايحين كوماي شفت مزارع نخل زيت واسعة جدًا. هو نخل الزيت ده عدوّ الغابة؟
        ar: يا باك رحمت، رأيتُ في الطريق إلى كوماي مزارع نخيل زيت شاسعة. فهل نخيل الزيت عدوّ الغابة؟
        en: Pak Rahmat, on the road to Kumai I saw enormous oil palm plantations. Is palm oil the forest's enemy?
      - speaker: Pak Rahmat
        text: Pertanyaannya nggak gampang, Mbak. Kakak saya kerja di kebun sawit. Dari sawit, anak-anaknya bisa sekolah. Saya nggak bisa bilang sawit itu jahat.
        ar_eg: السؤال ده مش بسيط يا بنتي. أخويا الكبير بيشتغل في مزرعة نخل زيت. ومن النخل ده عياله بيتعلّموا. مقدرش أقول إن النخل ده وحش.
        ar: السؤال ليس بسيطًا. أخي الأكبر يعمل في مزرعة نخيل زيت، ومنها يتعلّم أولاده. لا أستطيع القول إنّ النخيل شرّ.
        en: It's not a simple question, Mbak. My older brother works on an oil palm plantation. Palm oil pays for his children's schooling. I can't say palm oil is evil.
        note:
          ar_eg: إندونيسيا أكبر منتج لزيت النخيل في العالم، وملايين بيشتغلوا فيه. وفي نفس الوقت، فتح المزارع كان من أكبر أسباب ضياع الغابات في كاليمانتان وسومطرة. nggak gampang = tidak sederhana/mudah، bilang = يقول.
          ar: إندونيسيا أكبر منتج لزيت النخيل في العالم، ويعمل فيه الملايين. وفي الوقت نفسه كان فتح المزارع من أكبر أسباب فقدان الغابات في كاليمانتان وسومطرة. nggak gampang = tidak mudah، bilang = يقول.
          en: Indonesia is the world's largest palm oil producer, and millions work in the industry. At the same time, clearing land for plantations has been one of the biggest causes of forest loss in Kalimantan and Sumatra. nggak gampang = not simple, not easy, bilang = say.
      - speaker: Pak Rahmat
        text: Tapi saya juga ingat tahun 2015. Hutan dan lahan gambut terbakar berbulan-bulan. Kota kami tertutup asap, sekolah diliburkan, dan banyak anak kena penyakit pernapasan.
        ar_eg: بس أنا كمان فاكر سنة ٢٠١٥. الغابات وأراضي الخُثّ فضلت تولّع شهور. مدينتنا اتغطّت دخان، والمدارس قفلت، وعيال كتير جالهم أمراض في الصدر.
        ar: لكنّني أذكر أيضًا عام ٢٠١٥. احترقت الغابات وأراضي الخُثّ شهورًا، وغطّى الدخان مدينتنا، وعُطّلت المدارس، وأُصيب أطفال كثيرون بأمراض تنفّسية.
        en: But I also remember 2015. The forests and peatland burned for months. Our town was covered in smoke, schools were closed, and lots of children got breathing problems.
        note:
          ar_eg: حرايق ٢٠١٥ في إندونيسيا عملت ضباب دخان (kabut asap) وصل لسنغافورة وماليزيا. وحريق الخُثّ صعب يتطفي لأنه بيولّع تحت الأرض. لاحظ terbakar (اتحرق) وtertutup (اتغطّى) - ter- للحالة اللي حصلت.
          ar: سبّبت حرائق ٢٠١٥ في إندونيسيا ضبابًا دخانيًّا (kabut asap) بلغ سنغافورة وماليزيا. وحرائق الخُثّ عسيرة الإطفاء لأنّها تشتعل تحت الأرض. ولاحظ terbakar (احترق) وtertutup (غُطّي) - ter- للحالة الحاصلة.
          en: The 2015 fires in Indonesia caused a haze (kabut asap) that reached Singapore and Malaysia. Peat fires are hard to put out because they burn underground. Note terbakar (burned) and tertutup (covered) - ter- for a resulting state.
      - speaker: Mbak Lina
        text: Jadi masalahnya bukan pohon sawitnya, tapi cara buka lahannya, gitu?
        ar_eg: يعني المشكلة مش في شجرة النخل نفسها، المشكلة في طريقة فتح الأرض؟
        ar: أي إنّ المشكلة ليست في شجرة النخيل، بل في طريقة فتح الأرض؟
        en: So the problem isn't the palm tree itself, but the way the land is cleared?
        note:
          ar_eg: buka lahan = membuka lahan (تجهيز أرض للزراعة)، gitu = «يعني كده؟».
          ar: buka lahan = membuka lahan (تهيئة الأرض للزراعة)، gitu = «أهكذا؟».
          en: buka lahan = membuka lahan (clear land), gitu = is that it?
      - speaker: Pak Rahmat
        text: Sebagian, Mbak. Kalau gambut dikeringkan terus lahannya dibuka pakai cara dibakar, api gampang banget nyebar. Kebun yang udah ada harus dikelola dengan baik, dan hutan yang tersisa harus dijaga.
        ar_eg: جزء من المشكلة يا بنتي. لما الخُثّ يتنشّف والأرض تتفتح بالحرق، النار بتنتشر بسهولة جدًا. المزارع اللي موجودة لازم تتدار كويس، والغابة اللي فاضلة لازم تتحمي.
        ar: هذا جزء منها. حين يُجفَّف الخُثّ وتُفتح الأرض بالحرق تنتشر النار بسهولة شديدة. ويجب أن تُدار المزارع القائمة جيّدًا، وأن تُحمى الغابة المتبقّية.
        en: Partly, Mbak. When peat is drained and land is cleared by burning, fire spreads very easily. The plantations that exist must be managed well, and the forest that's left must be protected.
        note:
          ar_eg: nyebar = menyebar (ينتشر)، api = نار، dikeringkan = يتنشّف، dikelola = يتدار، dijaga = يتحمى. udah = sudah.
          ar: nyebar = menyebar (ينتشر)، api = نار، dikeringkan = يُجفَّف، dikelola = يُدار، dijaga = يُحمى. udah = sudah.
          en: nyebar = menyebar (spread), api = fire, dikeringkan = drained, dikelola = managed, dijaga = protected. udah = sudah.
      - speaker: Sari
        text: Di satu sisi, orang butuh kerjaan. Di sisi lain, hutan sama orangutan butuh rumah. Dua-duanya bener, ya, Pak.
        ar_eg: من ناحية، الناس محتاجة شغل. ومن ناحية تانية، الغابة والأورانجوتان محتاجين بيت. الاتنين صح، مش كده يا باك؟
        ar: من جهة، يحتاج الناس إلى العمل. ومن جهة أخرى، تحتاج الغابة وإنسان الغاب إلى بيت. كلاهما محقّ، أليس كذلك يا باك؟
        en: On the one hand, people need jobs. On the other hand, the forest and the orangutans need a home. Both are true, aren't they, Pak.
        note:
          ar_eg: di satu sisi... di sisi lain... (من ناحية... ومن ناحية تانية...) أحسن طريقة تعرض بيها وجهتين نظر قبل ما تقول رأيك. kerjaan = pekerjaan، sama = dan، bener = benar.
          ar: di satu sisi... di sisi lain... (من جهة... ومن جهة أخرى...) أفضل طريقة لعرض وجهتَي نظر قبل إبداء رأيك. kerjaan = pekerjaan، sama = dan، bener = benar.
          en: di satu sisi... di sisi lain... (on the one hand... on the other...) is the classic way to present two viewpoints before giving your own. kerjaan = pekerjaan, sama = dan, bener = benar.
      - speaker: Pak Rahmat
        text: Orang Dayak di sini punya hutan adat. Mereka ambil dari hutan secukupnya aja. Kata kakek saya, hutan ini bukan warisan dari nenek moyang, tetapi titipan untuk anak cucu kita.
        ar_eg: الدياك هنا عندهم غابات عُرفية. بياخدوا من الغابة على قدّ احتياجهم بس. وجدّي كان بيقول إن الغابة دي مش ورث من جدودنا، دي أمانة لولادنا وأحفادنا.
        ar: لشعب الداياك هنا غابات عُرفية، يأخذون منها قدر الحاجة فقط. وكان جدّي يقول إنّ هذه الغابة ليست ميراثًا من الأجداد، بل أمانة للأبناء والأحفاد.
        en: The Dayak people here have customary forests. They only take what they need from them. My grandfather used to say this forest isn't an inheritance from our ancestors - it's held in trust for our grandchildren.
        note:
          ar_eg: في ٢٠١٣، المحكمة الدستورية الإندونيسية قرّرت إن الغابة العُرفية (hutan adat) ملك للمجتمع الأصلي، مش للدولة. وtitipan (أمانة / وديعة) من titip، نفس كلمة titip salam.
          ar: في عام ٢٠١٣ قضت المحكمة الدستورية الإندونيسية بأنّ الغابة العُرفية (hutan adat) تعود إلى المجتمع الأصلي لا إلى الدولة. وtitipan (أمانة، وديعة) من titip، كما في titip salam.
          en: In 2013 Indonesia's Constitutional Court ruled that customary forest (hutan adat) belongs to indigenous communities, not the state. titipan (something held in trust) comes from titip, as in titip salam.
      - speaker: Narrator
        text: HP Sari bergetar. Sinyalnya lemah, tetapi foto bayi orangutan berhasil terkirim ke grup keluarga.
        ar_eg: موبايل ساري زنّ. الشبكة ضعيفة، بس صورة البيبي الأورانجوتان اتبعتت لجروب العيلة.
        ar: اهتزّ هاتف ساري. الإشارة ضعيفة، لكنّ صورة صغير إنسان الغاب وصلت إلى مجموعة العائلة.
        en: Sari's phone buzzes. The signal is weak, but the photo of the baby orangutan has made it to the family group.
      - speaker: Bayu
        text: Mbak!! Bayi orangutannya lucu bgt! Bawa pulang satu dong, buat maskot warung wkwk
        ar_eg: يا أبلة! البيبي الأورانجوتان عسل أوي! هاتي واحد معاكي، يبقى تميمة الوارونج!
        ar: يا أختي! صغير إنسان الغاب ظريف جدًّا! أحضري واحدًا ليكون تميمة الوارونغ!
        en: Sis! The baby orangutan's so cute! Bring one home - it can be the warung's mascot!
        note:
          ar_eg: كتابة شات - bgt = banget (sekali)، wkwk = هههه، dong = «بقى»، maskot = تميمة/ماسكوت.
          ar: كتابة الدردشة - bgt = banget (sekali)، wkwk = ضحك، dong = أداة إلحاح لطيف، maskot = تميمة.
          en: Chat spelling - bgt = banget (sekali), wkwk = haha, dong = come on, maskot = mascot.
      - speaker: Sari
        text: Nggak boleh, Le! Orangutan itu satwa yang dilindungi, bukan oleh-oleh. Mbak bawain kaus gambar orangutan aja, ya.
        ar_eg: ممنوع يا بايو! الأورانجوتان حيوان محمي بالقانون، مش هدية سفر. هجيبلك تيشيرت عليه صورة أورانجوتان وخلاص.
        ar: لا يجوز يا بنيّ! إنسان الغاب حيوان محميّ، لا هديّة سفر. سأحضر لك قميصًا عليه صورته.
        en: No way, little brother! Orangutans are a protected species, not souvenirs. I'll bring you a T-shirt with an orangutan on it.
        note:
          ar_eg: bawain = bawakan (أجيبلك)، satwa yang dilindungi = حيوان محمي، kaus = تيشيرت.
          ar: bawain = bawakan (أُحضر لك)، satwa yang dilindungi = حيوان محميّ، kaus = قميص قطني.
          en: bawain = bawakan (bring you), satwa yang dilindungi = protected animal, kaus = T-shirt. orangutan = orangutan.
      - speaker: Pak Budi
        text: Bapak oleh-olehnya madu hutan aja, Nduk. Kata Dokter Wulan, madu lebih baik daripada gula.
        ar_eg: وأنا عايز هدية عسل غابة بس يا بنتي. دكتورة وولان بتقول إن العسل أحسن من السكّر.
        ar: أمّا أنا فأريد عسل الغابة هديّةً يا ابنتي. تقول الطبيبة وولان إنّ العسل أفضل من السكّر.
        en: All I want is some forest honey, sweetheart. Dr Wulan says honey's better than sugar.
