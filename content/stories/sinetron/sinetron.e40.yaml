title:
  target: Habis Gelap Terbitlah Terang
  ar_eg: بعد الضلمة بيطلع النور
  ar: بعد الظلام يشرق النور
  en: After Darkness Comes Light
summary:
  ar_eg: يوم تخرّج ساري. في حفلة الطلبة الإندونيسيين في القاهرة، ساري بتلقي خطبة عن شخصيتين ألهموها - كارتيني... وراجل تاني قاعد في الصفّ الأولاني. وبعد الحفلة، كريم جاي بورد وقميص جديد.
  ar: يوم تخرّج ساري. في حفل الطلاب الإندونيسيين بالقاهرة تُلقي ساري خطبة عن شخصيتين ألهمتاها - كارتيني... ورجل آخر يجلس في الصفّ الأول. وبعد الحفل يأتي كريم بباقة ورد وقميص جديد.
  en: Sari's graduation day. At the Indonesian students' ceremony in Cairo, Sari gives a speech about two people who inspired her - Kartini... and a man sitting in the front row. Afterwards, Karim turns up with flowers and a new shirt.
cast: [Sari, Bayu, Hagga Fatma, Nadia, Karim, Pak Budi, Bu Rahayu]
scenes:
  - setting:
      ar_eg: قاعة في القاهرة، حفلة تخرّج الطلبة الإندونيسيين خرّيجين الأزهر. ساري واقفة على المنصّة بالروب الأسود، بالنيابة عن الخرّيجين. پاك بودي وبو راهايو في الصفّ الأول.
      ar: قاعة في القاهرة، حفل تخرّج الطلاب الإندونيسيين في الأزهر. تقف ساري على المنصّة بالرداء الأسود نائبةً عن الخرّيجين. باك بودي وبو راهايو في الصفّ الأول.
      en: A hall in Cairo, the graduation ceremony for Indonesian Al-Azhar students. Sari stands at the podium in a black gown, speaking for the graduates. Pak Budi and Bu Rahayu are in the front row.
    lines:
      - speaker: Sari
        text: Yang terhormat Bapak Duta Besar, yang saya hormati para dosen, dan hadirin yang berbahagia. Assalamualaikum warahmatullahi wabarakatuh.
        ar_eg: سعادة السفير المحترم، أساتذتي الأفاضل، والحضور الكرام. السلام عليكم ورحمة الله وبركاته.
        ar: سعادة السفير المحترم، أساتذتي الأفاضل، أيّها الحضور الكرام. السلام عليكم ورحمة الله وبركاته.
        en: His Excellency the Ambassador, respected lecturers, and honoured guests. Assalamu alaikum warahmatullahi wabarakatuh.
        note:
          ar_eg: الخطبة الإندونيسية الرسمية بتبدأ بتحية كل الحاضرين حسب مقامهم - Yang terhormat (المحترم) للأعلى مقامًا، Yang saya hormati (اللي بحترمهم) للي بعدهم، وhadirin yang berbahagia (الحضور الكرام) للكل.
          ar: تبدأ الخطبة الإندونيسية الرسمية بتحيّة الحاضرين بحسب مقاماتهم - Yang terhormat (المحترم) للأعلى مقامًا، وYang saya hormati (من أحترمهم) لمن يليهم، وhadirin yang berbahagia (الحضور الكرام) للجميع.
          en: A formal Indonesian speech opens by greeting everyone by rank - Yang terhormat (the honourable) for the most senior, Yang saya hormati (whom I respect) for the next, and hadirin yang berbahagia (honoured guests) for all.
      - speaker: Sari
        text: Puji syukur kita panjatkan ke hadirat Allah SWT, karena hari ini kita dapat berkumpul di sini.
        ar_eg: نحمد الله سبحانه وتعالى إننا قدرنا نتجمّع هنا النهارده.
        ar: نرفع الحمد والشكر إلى حضرة الله سبحانه وتعالى إذ جمعنا اليوم هنا.
        en: We give praise and thanks to God Almighty that we are able to gather here today.
        note:
          ar_eg: hadirat من العربي «حضرة»، وSWT اختصار «سبحانه وتعالى». جملة puji syukur دي بتيجي في أول أي خطبة رسمية تقريبًا.
          ar: hadirat من العربية «حضرة»، وSWT اختصار «سبحانه وتعالى». وتأتي عبارة puji syukur هذه في مطلع كلّ خطبة رسمية تقريبًا.
          en: hadirat comes from Arabic حضرة (presence), and SWT abbreviates "subhanahu wa ta'ala". This puji syukur line opens almost every formal speech.
      - speaker: Sari
        text: Hari ini saya ingin bercerita tentang seorang tokoh yang menginspirasi saya, yaitu Raden Ajeng Kartini.
        ar_eg: النهارده عايزة أحكي عن شخصية ألهمتني، وهي رادين أجينج كارتيني.
        ar: أودّ اليوم أن أحدّثكم عن شخصية ألهمتني، هي رادين أجينغ كارتيني.
        en: Today I'd like to tell you about a figure who inspired me - Raden Ajeng Kartini.
      - speaker: Sari
        text: Lebih dari seratus tahun yang lalu, Kartini memperjuangkan pendidikan untuk perempuan. Surat-suratnya dibukukan dengan judul "Habis Gelap Terbitlah Terang".
        ar_eg: من أكتر من مية سنة، كارتيني ناضلت عشان البنات يتعلّموا. وجواباتها اتجمعت في كتاب اسمه «بعد الضلمة بيطلع النور».
        ar: قبل أكثر من مئة عام ناضلت كارتيني من أجل تعليم المرأة، وجُمعت رسائلها في كتاب بعنوان «بعد الظلام يشرق النور».
        en: More than a hundred years ago, Kartini fought for girls' education. Her letters were collected in a book called "After Darkness Comes Light".
        note:
          ar_eg: كارتيني (١٨٧٩-١٩٠٤) من جيپارا في جاوة الوسطى. جواباتها لصحابها الهولنديين اتنشرت بعد وفاتها، وعيد ميلادها ٢١ أبريل بقى «يوم كارتيني» في إندونيسيا.
          ar: كارتيني (١٨٧٩-١٩٠٤) من جيبارا في جاوة الوسطى. نُشرت رسائلها إلى أصدقائها الهولنديين بعد وفاتها، وصار يوم مولدها ٢١ أبريل «يوم كارتيني» في إندونيسيا.
          en: Kartini (1879-1904) was from Jepara in Central Java. Her letters to Dutch friends were published after her death, and her birthday, 21 April, is Hari Kartini in Indonesia.
      - speaker: Sari
        text: Kartini tidak pernah belajar di luar negeri. Tapi hari ini, anak-anak perempuan Indonesia bisa belajar sampai ke Kairo.
        ar_eg: كارتيني عمرها ما اتعلّمت برّه بلدها. بس النهارده، بنات إندونيسيا بيتعلّموا لحد القاهرة.
        ar: لم تدرس كارتيني خارج بلادها قطّ. لكنّ بنات إندونيسيا اليوم يستطعن الدراسة حتى في القاهرة.
        en: Kartini never got to study abroad. But today, Indonesian girls can study as far away as Cairo.
      - speaker: Sari
        text: Tokoh kedua saya duduk di barisan depan. Seorang penjual pecel dari Madiun yang membanting tulang dari subuh sampai malam, supaya anaknya bisa sekolah.
        ar_eg: الشخصية التانية قاعدة في الصفّ الأولاني. بيّاع بيچيل من ماديون بيشقى من الفجر لحد بالليل، عشان بنته تتعلّم.
        ar: أمّا شخصيتي الثانية فتجلس في الصفّ الأول. بائع بيتشيل من ماديون يكدّ من الفجر حتى الليل ليتعلّم أبناؤه.
        en: My second figure is sitting in the front row. A pecel seller from Madiun who works his fingers to the bone from dawn till night, so his children can go to school.
        note:
          ar_eg: membanting tulang (حرفيًا «يخبط العضم») تعبير معناه يشتغل بجهد كبير جدًا - زي «بيطلّع عينه» أو «بيشقى».
          ar: membanting tulang (حرفيًّا «يضرب العظم») تعبير يعني العمل بجهد شاقّ، كقولنا «يكدّ ويشقى».
          en: membanting tulang ("to slam one's bones") means to work extremely hard - "to work one's fingers to the bone".
      - speaker: Narrator
        text: Pak Budi menangis. Kali ini, debu Kairo tidak dijadikan kambing hitam.
        ar_eg: پاك بودي بيعيّط. والمرة دي، تراب القاهرة متشالش الليلة.
        ar: يبكي باك بودي. وهذه المرّة لم يُجعل غبار القاهرة كبش فداء.
        en: Pak Budi is crying. This time, the Cairo dust doesn't get the blame.
        note:
          ar_eg: kambing hitam (معزة سودا) يعني اللي بيشيل الليلة أو «كبش الفدا». فاكرين في حلقة ١٧ أغسطس پاك بودي قال إن التراب هو اللي في عينه؟
          ar: kambing hitam (الماعز الأسود) تعني «كبش الفداء». أتذكرون حين قال باك بودي في حلقة السابع عشر من أغسطس إنّ الغبار في عينه؟
          en: kambing hitam ("black goat") means a scapegoat. Remember on 17 August, when Pak Budi blamed the dust in his eye?
      - speaker: Sari
        text: Bapak, Ibu, terima kasih. Saya buah hati kalian, dan hari ini adalah buah kerja keras kalian.
        ar_eg: بابا، ماما، شكرًا. أنا حتّة من قلبكم، والنهارده ده تعبكم اللي طرح.
        ar: أبي، أمي، شكرًا لكما. أنا فلذة كبدكما، وهذا اليوم ثمرة كدّكما.
        en: Dad, Mum, thank you. I am the apple of your eye, and today is the fruit of your hard work.
      - speaker: Narrator
        text: Tepuk tangan memenuhi aula. Bu Rahayu memegang tangan suaminya erat-erat.
        ar_eg: التصفيق ملا القاعة. وبو راهايو ماسكة إيد جوزها جامد.
        ar: ملأ التصفيق القاعة، وأمسكت بو راهايو بيد زوجها بقوّة.
        en: Applause fills the hall. Bu Rahayu holds her husband's hand tight.
  - setting:
      ar_eg: برّه القاعة بعد الحفلة. الكل بيتصوّر. بايو على الفيديو من ماديون. كريم واقف على جنب لابس قميص جديد ومعاه بوكيه ورد.
      ar: خارج القاعة بعد الحفل. الجميع يلتقطون الصور. بايو على الاتصال المرئي من ماديون. ويقف كريم جانبًا بقميص جديد وفي يده باقة ورد.
      en: Outside the hall after the ceremony. Everyone's taking photos. Bayu is on video from Madiun. Karim stands to one side in a new shirt, holding a bouquet.
    lines:
      - speaker: Bayu
        text: Mbak Sari! Pidatomu sudah jadi buah bibir di grup WhatsApp. Ibu-ibu di gang menangis semua!
        ar_eg: أبلة ساري! خطبتك بقت على كل لسان في جروب الواتساب. ستات الحارة كلهم عيّطوا!
        ar: يا أختي ساري! صارت خطبتكِ حديث الجميع في مجموعة الواتساب. بكت نساء الزقاق كلّهنّ!
        en: Sis! Your speech is the talk of the WhatsApp group. All the ladies in the lane are in tears!
        note:
          ar_eg: تعابير بـ buah (فاكهة / تمرة) - buah hati (حتّة من القلب)، buah bibir (على كل لسان)، buah tangan (هدية بتجيبها للزيارة)، buah kerja keras (تمرة التعب).
          ar: تعابير بكلمة buah (ثمرة) - buah hati (فلذة الكبد)، buah bibir (حديث الناس)، buah tangan (هدية الزيارة)، buah kerja keras (ثمرة الكدّ).
          en: 'Idioms with buah (fruit): buah hati (apple of your eye), buah bibir (talk of the town), buah tangan (a gift you bring on a visit), buah kerja keras (the fruit of hard work).'
      - speaker: Hagga Fatma
        text: Mabruk, ya Sari! Selamat, anakku!
        ar_eg: مبروك يا ساري! ألف مبروك يا بنتي!
        ar: مبارك يا ساري! تهانيّ يا ابنتي!
        en: Mabruk, Sari! Congratulations, my girl!
      - speaker: Nadia
        text: Sekarang kamu resmi sarjana Al-Azhar!
        ar_eg: دلوقتي انتي رسمي خرّيجة الأزهر!
        ar: أنتِ الآن رسميًّا خرّيجة الأزهر!
        en: Now you're officially an Al-Azhar graduate!
      - speaker: Karim
        text: Sari... selamat, ya. Ini, bunga. Dari... dari kami semua.
        ar_eg: ساري... مبروك. ده... ورد. من... مننا كلنا.
        ar: ساري... مبارك. هذه... باقة ورد. من... منّا جميعًا.
        en: Sari... congratulations. Here, flowers. From... from all of us.
      - speaker: Nadia
        text: Dari kami semua? Aku tidak ikut beli bunga, lho.
        ar_eg: مننا كلنا؟ أنا مدفعتش حاجة في الورد على فكرة.
        ar: منّا جميعًا؟ أنا لم أشارك في شراء الورد، للعلم.
        en: From all of us? I didn't chip in for any flowers, you know.
      - speaker: Sari
        text: Terima kasih, Karim. Kemejamu baru, ya?
        ar_eg: شكرًا يا كريم. قميصك جديد؟
        ar: شكرًا يا كريم. قميصك جديد، أليس كذلك؟
        en: Thank you, Karim. Is that a new shirt?
      - speaker: Karim
        text: Eh... iya. Untuk acara penting.
        ar_eg: آه... أيوه. عشان مناسبة مهمّة.
        ar: آ... نعم. من أجل مناسبة مهمّة.
        en: Er... yes. For an important occasion.
      - speaker: Pak Budi
        text: Bu, Mas Karim itu rendah hati dan rajin. Tapi sedikit keras kepala... seperti Bapak waktu muda.
        ar_eg: يا رهايو، ماس كريم ده متواضع وشغّيل. بس دماغه ناشفة شوية... زيّي وأنا صغيّر.
        ar: يا رهايو، ماس كريم متواضع ومجتهد، لكنّه عنيد قليلًا... مثلي حين كنت شابًّا.
        en: Mas Karim is humble and hard-working. But a bit stubborn... like me when I was young.
        note:
          ar_eg: rendah hati (حرفيًا «قلبه واطي») يعني متواضع، وعكسه tinggi hati أو besar kepala (شايف نفسه). وkeras kepala (راسه ناشفة) يعني عنيد.
          ar: rendah hati (حرفيًّا «منخفض القلب») تعني متواضعًا، وعكسها tinggi hati أو besar kepala (متكبّر). وkeras kepala (صلب الرأس) تعني عنيدًا.
          en: rendah hati ("low heart") means humble; its opposite is tinggi hati or besar kepala (big-headed). keras kepala ("hard head") means stubborn.
      - speaker: Bu Rahayu
        text: Bapak sudah banyak makan garam. Bapak tahu sesuatu, ya?
        ar_eg: انت شفت كتير في الدنيا. انت عارف حاجة، صح؟
        ar: لقد خبرتَ الحياة طويلًا. أنت تعرف شيئًا، أليس كذلك؟
        en: You've seen a thing or two in your time. You know something, don't you?
      - speaker: Pak Budi
        text: Bapak tidak tahu apa-apa, Bu. Tapi Bapak punya mata.
        ar_eg: أنا مش عارف حاجة يا ستّي. بس عندي عينين.
        ar: لا أعرف شيئًا. لكن لي عينين.
        en: I don't know anything, dear. But I have eyes.
      - speaker: Hagga Fatma
        text: Ayo, foto keluarga! Mas Karim, kamu juga. Ayo, masuk!
        ar_eg: يلا، صورة عيلة! يا ماس كريم، وانت كمان. يلا، ادخل معاهم!
        ar: هيّا، صورة عائلية! يا ماس كريم، وأنت أيضًا. هيّا، انضمّ إليهم!
        en: Come on, family photo! Mas Karim, you too. Come on, get in!
      - speaker: Narrator
        text: Klik. Satu foto, dua negara, satu keluarga besar.
        ar_eg: تِك. صورة واحدة، بلدين، وعيلة واحدة كبيرة.
        ar: طَق. صورة واحدة، وبلدان اثنان، وعائلة واحدة كبيرة.
        en: Click. One photo, two countries, one big family.
