questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: مين أول شخصية ألهمت ساري؟
      ar: من الشخصية الأولى التي ألهمت ساري؟
      en: Who is the first figure who inspired Sari?
    options: ["Bapak Duta Besar", "Hagga Fatma", "Salahuddin al-Ayyubi", "Raden Ajeng Kartini"]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Seorang penjual pecel dari Madiun yang membanting ___ dari subuh sampai malam.
    meaning:
      ar_eg: بيّاع بيچيل من ماديون بيشقى من الفجر لحد بالليل.
      ar: بائع بيتشيل من ماديون يكدّ من الفجر حتى الليل.
      en: A pecel seller from Madiun who works his fingers to the bone from dawn till night.
    answers: [tulang]
    options: ["kepala", "tulang", "hati"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: «Pidatomu sudah jadi buah bibir» معناها إيه؟
      ar: ما معنى «Pidatomu sudah jadi buah bibir»؟
      en: What does "Pidatomu sudah jadi buah bibir" mean?
    options: ["Semua orang membicarakan pidatomu.", "Pidatomu terlalu panjang.", "Kamu lupa pidatomu."]
    answer: 0
  - id: q04
    type: listen
    text: Bu, Mas Karim itu rendah hati dan rajin. Tapi sedikit keras kepala.
    question:
      ar_eg: پاك بودي شايف كريم إزاي؟
      ar: كيف يرى باك بودي كريمًا؟
      en: How does Pak Budi see Karim?
    options: ["sombong dan malas", "rendah hati, rajin, sedikit keras kepala", "besar kepala tapi pintar", "pendiam dan pemalu"]
    answer: 1
    meaning:
