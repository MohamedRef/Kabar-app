next:
  ar_eg: الموسم الجاي - پاك بودي وبو راهايو راجعين ماديون بشنطتين هدايا. وساري جالها عرض شغل من كاليمانتان... بس القاهرة صعب تسيبها. وفي القاهرة، فيه حدّ بدأ في السرّ يتعلّم جاوي مؤدّب (كراما)... يا ترى عشان مين؟
  ar: في الموسم القادم - يعود باك بودي وبو راهايو إلى ماديون بحقيبتين من الهدايا. وتتلقّى ساري عرض عمل من كاليمانتان... لكنّ فراق القاهرة صعب. وفي القاهرة بدأ أحدهم سرًّا يتعلّم الجاوية المهذّبة (كراما)... تُرى من أجل مَن؟
  en: Next season - Pak Budi and Bu Rahayu fly home to Madiun with two suitcases of gifts. Sari gets a job offer from Kalimantan... but Cairo is hard to leave. And in Cairo, someone has secretly started learning polite Javanese (krama)... now who could he want to impress?
