episode: 23
language: id
level: bipa3
unlock_after: bipa3.u03
title:
  target: Malam Film, Kairo Lawan Madiun
  ar_eg: ليلة أفلام، القاهرة ضد ماديون
  ar: ليلة الأفلام - القاهرة في مواجهة ماديون
  en: Movie Night, Cairo vs Madiun
summary:
  ar_eg: ليلة سينما على الفيديو. الحاجّة فاطمة ونادية بيحكوا قصة «غزل البنات»، وبايو بيحكي قصة «لاسكار پيلانجي». الفيلمين عن مدرّس… وپاك بودي بيعيّط في الاتنين.
  ar: ليلة سينما عبر الاتصال المرئي. تروي الحاجّة فاطمة ونادية قصة «غزل البنات»، ويروي بايو قصة «لاسكار بيلانغي». الفيلمان عن معلّم… وباك بودي يبكي في كليهما.
  en: Movie night on video call. Hagga Fatma and Nadia tell the story of "Ghazal al-Banat", and Bayu tells the story of "Laskar Pelangi". Both films are about a teacher… and Pak Budi cries at both.
cast: [Hagga Fatma, Nadia, Sari, Karim, Bayu, Pak Budi, Bu Rahayu]
scenes:
  - setting:
      ar_eg: صالة الحاجّة فاطمة في القاهرة، الساعة ٨ بالليل، وفيه فشار على الترابيزة. في ماديون الساعة ١ بعد نص الليل، بس محدّش نايم.
      ar: صالة الحاجّة فاطمة في القاهرة، الثامنة مساءً، وعلى الطاولة فشار. في ماديون الساعة الواحدة بعد منتصف الليل، لكن لا أحد نائم.
      en: Hagga Fatma's living room in Cairo, 8 p.m., popcorn on the table. In Madiun it's 1 a.m., but nobody is asleep.
    lines:
      - speaker: Narrator
        text: Malam Jumat. Kairo dan Madiun punya malam film lewat video call.
        ar_eg: ليلة الجمعة. القاهرة وماديون عاملين ليلة أفلام على مكالمة فيديو.
        ar: ليلة الجمعة. تقيم القاهرة وماديون ليلة أفلام عبر اتصال مرئي.
        en: Thursday night. Cairo and Madiun are holding a movie night over video call.
        note:
          ar_eg: malam Jumat يعني «ليلة الجمعة»، أي الخميس بالليل، زي العربي بالظبط. والخميس بالليل في مصر بداية الويكند. وvideo call = مكالمة فيديو.
          ar: malam Jumat تعني «ليلة الجمعة» أي مساء الخميس، تمامًا كما في العربية. ومساء الخميس في مصر بداية عطلة نهاية الأسبوع. وvideo call = اتصال مرئي.
          en: malam Jumat is "the eve of Friday" — Thursday night, exactly as in Arabic. In Egypt, Thursday night starts the weekend. video call is used as is.
      - speaker: Hagga Fatma
        text: Malam ini kita nonton film Mesir yang paling saya sukai, Ghazal al-Banat. Filmnya dari tahun 1949, lho!
        ar_eg: الليلة هنتفرّج على أكتر فيلم مصري بحبّه، «غزل البنات». الفيلم ده من سنة ١٩٤٩!
        ar: الليلة سنشاهد أحبّ فيلم مصري إليّ، «غزل البنات». هذا الفيلم من عام ١٩٤٩!
        en: Tonight we're watching my favourite Egyptian film, Ghazal al-Banat. It's from 1949!
        note:
          ar_eg: nonton = menonton (يتفرّج) في الكلام. وsuka (يحبّ) + ‎-i = menyukai، و«yang paling saya sukai» = «اللي بحبّه أكتر حاجة». وGhazal al-Banat = «غزل البنات».
          ar: nonton = menonton (يشاهد) في الكلام. وsuka (يحبّ) مع ‎-i تصبح menyukai، و«yang paling saya sukai» = «الذي أحبّه أكثر من غيره». وGhazal al-Banat = «غزل البنات».
          en: 'nonton = menonton (to watch) in speech. suka + -i gives menyukai; "yang paling saya sukai" = "the one I like most". Ghazal al-Banat = غزل البنات.'
      - speaker: Bayu
        text: Tahun 1949? Filmnya hitam putih, dong, Hagga? Saya sih lebih suka film horor.
        ar_eg: سنة ١٩٤٩؟ الفيلم أبيض وأسود يا حاجّة؟ أنا بحبّ أفلام الرعب أكتر.
        ar: عام ١٩٤٩؟ هل الفيلم بالأبيض والأسود يا حاجّة؟ أنا أفضّل أفلام الرعب.
        en: 1949? Is it black and white, Hagga? I prefer horror films.
        note:
          ar_eg: في الكلام الناس بتقول «lebih suka» (بحبّ أكتر)، وفي الكتابة «lebih menyukai». وhoror = رعب. وأفلام الرعب في إندونيسيا من أكتر الأفلام اللي بتكسّر شبّاك التذاكر.
          ar: في الكلام يقال «lebih suka» (أفضّل)، وفي الكتابة «lebih menyukai». وhoror = رعب. وأفلام الرعب من أعلى الأفلام إيرادًا في إندونيسيا.
          en: In speech people say "lebih suka" (prefer); in writing, "lebih menyukai". horor = horror. Horror films are among Indonesia's biggest box-office hits.
      - speaker: Nadia
        text: Dengerin dulu, Bayu! Tokoh utamanya Hamam, guru bahasa Arab yang miskin.
        ar_eg: اسمع الأول يا بايو! البطل اسمه حمام، مدرّس عربي غلبان.
        ar: اسمع أولًا يا بايو! بطل الفيلم حمام، معلّم لغة عربية فقير.
        en: Listen first, Bayu! The main character is Hamam, a poor Arabic teacher.
        note:
          ar_eg: dengerin = dengarkan (اسمع) - ‎-kan بتبقى ‎-in في الشارع. وtokoh utama (tokoh utamanya) = البطل، وmiskin = فقير / غلبان.
          ar: dengerin = dengarkan (استمع) - تصير ‎-kan إلى ‎-in في الكلام اليومي. وtokoh utama (tokoh utamanya) = البطل، وmiskin = فقير.
          en: dengerin = dengarkan (listen) — -kan becomes -in in street speech. tokoh utama (tokoh utamanya) = main character; miskin = poor.
      - speaker: Nadia
        text: Dia ngajarin Laila, anak pasha yang kaya. Lama-lama, Hamam diam-diam jatuh cinta sama muridnya.
        ar_eg: بيدّي دروس لليلى، بنت باشا غني. ومع الوقت، حمام بيحبّ تلميذته في السرّ.
        ar: يعلّم ليلى، ابنة باشا ثري. ومع الوقت يحبّ حمام تلميذته سرًّا.
        en: He tutors Laila, the daughter of a rich pasha. Little by little, Hamam secretly falls in love with his student.
        note:
          ar_eg: ajar + -i = mengajari (يعلّم حدّ)، وفي الشارع ngajarin. وcinta + -i = mencintai (يحبّ حدّ)، وفي الكلام jatuh cinta sama. اللاحقة -i بتخلّي الشخص هو المفعول على طول. وkaya = غني، وdiam-diam = في السرّ، وmurid (muridnya) = تلميذ، وpasha = باشا.
          ar: ajar مع -i تصبح mengajari (يعلّم شخصًا)، وفي الكلام ngajarin. وcinta مع -i تصبح mencintai (يحبّ شخصًا)، وفي الكلام jatuh cinta sama. اللاحقة -i تجعل الشخص مفعولًا مباشرًا. وkaya = غني، وdiam-diam = سرًّا، وmurid (muridnya) = تلميذ، وpasha = باشا.
          en: ajar + -i = mengajari (to teach someone) — in the street, ngajarin. cinta + -i = mencintai (to love someone) — in speech, jatuh cinta sama. The -i makes the person the direct object. kaya = rich, diam-diam = secretly, murid (muridnya) = pupil, pasha = pasha.
      - speaker: Sari
        text: Guru bahasa Arab yang ngajarin murid? Kayak Nadia sama aku, dong!
        ar_eg: مدرّسة عربي بتعلّم تلميذة؟ زيّ نادية وأنا بالظبط!
        ar: معلّم عربية يعلّم تلميذة؟ مثل نادية وأنا تمامًا!
        en: An Arabic teacher tutoring a student? Just like Nadia and me!
        note:
          ar_eg: kayak = seperti (زي)، وsama هنا = dan (و). وngajarin murid = mengajari murid (يعلّم تلميذ).
          ar: kayak = seperti (مثل)، وsama هنا = dan (و). وngajarin murid = mengajari murid (يعلّم تلميذًا).
          en: kayak = seperti (like), sama here = dan (and). ngajarin murid = mengajari murid (teaching a pupil).
      - speaker: Karim
        text: Tapi Hamam nggak nikah sama Laila, kan? Akhirnya Laila milih orang lain.
        ar_eg: بس حمام مبيتجوّزش ليلى، صح؟ في الآخر ليلى بتختار حدّ تاني.
        ar: لكن حمام لا يتزوّج ليلى، أليس كذلك؟ في النهاية تختار ليلى رجلًا آخر.
        en: But Hamam doesn't marry Laila, does he? In the end Laila chooses someone else.
        note:
          ar_eg: nikah sama = menikahi (يتجوّز)، وmilih = memilih (يختار) - كلام كل يوم. وorang lain = حدّ تاني.
          ar: nikah sama = menikahi (يتزوّج)، وmilih = memilih (يختار) - في الكلام اليومي. وorang lain = شخص آخر.
          en: nikah sama = menikahi (to marry), milih = memilih (to choose) — everyday speech. orang lain = someone else.
      - speaker: Hagga Fatma
        text: Karim! Jangan ceritain akhirnya, dong! Saya udah nonton film ini puluhan kali di TV, tapi masih nangis juga.
        ar_eg: يا كريم! متحكيش النهاية! أنا شفت الفيلم ده عشرات المرّات في التليفزيون، ولسه بعيّط.
        ar: يا كريم! لا تحكِ النهاية! شاهدت هذا الفيلم عشرات المرّات على التلفاز، وما زلت أبكي.
        en: Karim! Don't tell the ending! I've seen this film dozens of times on TV, and I still cry.
        note:
          ar_eg: ceritain = ceritakan (احكي)، وnangis = menangis (يعيّط)، وudah = sudah، وnonton = menonton. وpuluhan kali = عشرات المرّات.
          ar: ceritain = ceritakan (احكِ)، وnangis = menangis (يبكي)، وudah = sudah، وnonton = menonton. وpuluhan kali = عشرات المرّات.
          en: ceritain = ceritakan (tell), nangis = menangis (cry), udah = sudah, nonton = menonton. puluhan kali = dozens of times.
  - setting:
      ar_eg: دور بايو. ماسك ورقة كاتب عليها الملخّص، وواقف قدّام الموبايل زي المذيع.
      ar: جاء دور بايو. يمسك ورقة كتب عليها الملخّص، ويقف أمام الهاتف كالمذيع.
      en: Bayu's turn. He holds a sheet with his synopsis on it and stands in front of the phone like a presenter.
    lines:
      - speaker: Bayu
        text: Sekarang film Indonesia favorit saya, Laskar Pelangi. Film ini diangkat dari novel karya Andrea Hirata.
        ar_eg: ودلوقتي فيلمي الإندونيسي المفضّل، «لاسكار پيلانجي». الفيلم ده مأخوذ من رواية لأندريا هيراتا.
        ar: والآن فيلمي الإندونيسي المفضّل، «لاسكار بيلانغي». هذا الفيلم مقتبس من رواية للكاتب أندريا هيراتا.
        en: Now my favourite Indonesian film, Laskar Pelangi. It's based on a novel by Andrea Hirata.
        note:
          ar_eg: diangkat dari novel karya… = «مأخوذ من رواية لـ…». وLaskar Pelangi يعني «جيش قوس قزح». الفيلم (٢٠٠٨) والرواية (٢٠٠٥) من أشهر القصص في إندونيسيا، وبتحصل في جزيرة بيليتونج.
          ar: diangkat dari novel karya… = «مقتبس من رواية لـ…». وLaskar Pelangi تعني «جيش قوس قزح». والفيلم (٢٠٠٨) والرواية (٢٠٠٥) من أشهر القصص في إندونيسيا، وتدور أحداثهما في جزيرة بيليتونغ.
          en: diangkat dari novel karya… = based on a novel by…. Laskar Pelangi means "Rainbow Troops". The film (2008) and the novel (2005) are among Indonesia's best-loved stories, set on the island of Belitung.
      - speaker: Bayu
        text: Di Belitung ada sebuah sekolah kecil yang miskin. Kalau anaknya kurang dari sepuluh, sekolah itu harus tutup.
        ar_eg: في بيليتونج فيه مدرسة صغيّرة وفقيرة. لو التلاميذ أقل من عشرة، المدرسة لازم تتقفل.
        ar: في بيليتونغ مدرسة صغيرة فقيرة. إذا قلّ عدد تلاميذها عن عشرة وجب إغلاقها.
        en: On Belitung there's a small, poor school. If it has fewer than ten pupils, it has to close.
      - speaker: Bayu
        text: Pada hari pertama, ada sembilan anak saja. Semua menunggu dengan sedih...
        ar_eg: في أول يوم، كان فيه تسع عيال بس. والكل مستني وهو زعلان...
        ar: في اليوم الأول لم يكن هناك سوى تسعة أطفال، وكان الجميع ينتظرون بحزن...
        en: On the first day there are only nine children. Everyone waits, sadly...
      - speaker: Bayu
        text: Tiba-tiba, Harun mendatangi sekolah itu. Anak kesepuluh! Sekolahnya selamat!
        ar_eg: وفجأة، هارون جه المدرسة. التلميذ العاشر! المدرسة اتنقذت!
        ar: وفجأة جاء هارون إلى المدرسة. التلميذ العاشر! نجت المدرسة!
        en: Suddenly, Harun arrives at the school. The tenth pupil! The school is saved!
        note:
          ar_eg: datang ke sekolah = mendatangi sekolah. الـ -i بتشيل حرف الجر (ke) وبتخلّي المكان مفعول. وkesepuluh = العاشر.
          ar: datang ke sekolah = mendatangi sekolah، فاللاحقة -i تحذف حرف الجرّ (ke) وتجعل المكان مفعولًا. وkesepuluh = العاشر.
          en: datang ke sekolah = mendatangi sekolah. The -i drops the preposition (ke) and makes the place the object. kesepuluh = the tenth.
      - speaker: Bayu
        text: Lalu Bu Muslimah, guru mereka, mengajari mereka dengan penuh cinta. Tamat!
        ar_eg: وبعدين بو مسلمة، المدرّسة بتاعتهم، بتعلّمهم بكل حب. النهاية!
        ar: ثم تعلّمهم بو مسلمة، معلّمتهم، بكل حبّ. النهاية!
        en: Then Bu Muslimah, their teacher, teaches them with all her heart. The end!
        note:
          ar_eg: بايو بيحكي زي المذيع، بالإندونيسي الرسمي - mengajari مش ngajarin. وpenuh cinta = بكل حب، وtamat = النهاية.
          ar: يروي بايو كالمذيع بالإندونيسية الفصحى - mengajari لا ngajarin. وpenuh cinta = بكلّ حبّ، وtamat = النهاية.
          en: Bayu narrates like a presenter, in standard Indonesian — mengajari, not ngajarin. penuh cinta = with all her love; tamat = the end.
      - speaker: Sari
        text: Bagus banget, Bayu! Sinopsismu lengkap. Dua film itu sama-sama tentang guru, ya.
        ar_eg: حلو أوي يا بايو! الملخّص بتاعك كامل. والفيلمين عن مدرّسين، صح؟
        ar: رائع يا بايو! ملخّصك كامل. وكلا الفيلمين عن معلّمين، أليس كذلك؟
        en: Brilliant, Bayu! Your synopsis is complete. Both films are about teachers, aren't they?
      - speaker: Bu Rahayu
        text: Lihat Bapak! Dari tadi nangisin Hamam, sekarang nangisin Harun.
        ar_eg: بصّوا على بابا! من بدري وهو بيعيّط على حمام، ودلوقتي بيعيّط على هارون.
        ar: انظروا إلى أبيكم! منذ قليل وهو يبكي على حمام، والآن يبكي على هارون.
        en: Look at Dad! First he was crying over Hamam, now he's crying over Harun.
        note:
          ar_eg: nangisin = menangisi (يعيّط على) - نفس ‎-i بس بطريقة الشارع ‎-in.
          ar: nangisin = menangisi (يبكي على) - اللاحقة ‎-i نفسها بصيغتها العامّية ‎-in.
          en: nangisin = menangisi (to cry over) — the same -i, in its street form -in.
      - speaker: Pak Budi
        text: Bapak nggak nangis, kok. Mata Bapak kena asap... asap popcorn.
        ar_eg: أنا مش بعيّط. عينيّا دخل فيها دخان... دخان فشار.
        ar: أنا لا أبكي. دخل الدخان عينيّ... دخان الفشار.
        en: I'm not crying. I've got smoke in my eyes... popcorn smoke.
        note:
          ar_eg: kena asap = «دخل فيها دخان»، asap = دخان، وpopcorn = فشار. وkok هنا بتأكّد النفي - «مش بعيّط والله!».
          ar: kena asap = «أصابها الدخان»، asap = دخان، وpopcorn = فشار. وkok هنا تؤكّد النفي.
          en: kena asap = got smoke in them; asap = smoke, popcorn = popcorn. kok here insists — "I'm really not!".
      - speaker: Hagga Fatma
        text: Pak Budi, saya juga gitu! Film yang bagus selalu bikin kita nangis.
        ar_eg: يا پاك بودي، وأنا كمان كده! الفيلم الحلو دايمًا بيعيّطنا.
        ar: يا باك بودي، وأنا كذلك! الفيلم الجيّد يُبكينا دائمًا.
        en: Pak Budi, I'm the same! A good film always makes us cry.
        note:
          ar_eg: gitu = begitu (كده)، وbikin = membuat (يخلّي / يعمل).
          ar: gitu = begitu (هكذا)، وbikin = membuat (يجعل / يصنع).
          en: gitu = begitu (like that), bikin = membuat (to make).
new_words:
  - word: tokoh utama
    pos: noun
    ar_eg: البطل / الشخصية الرئيسية
    ar: البطل / الشخصية الرئيسية
    en: main character
  - word: sinopsis
    pos: noun
    ar_eg: ملخّص القصة
    ar: ملخّص القصّة
    en: synopsis
  - word: menyukai
    pos: verb
    ar_eg: يحبّ (حاجة)
    ar: يحبّ
    en: to like (something)
  - word: mengajari
    pos: verb
    ar_eg: يعلّم (حدّ) - في الكلام ngajarin
    ar: يعلّم (شخصًا) - في الكلام ngajarin
    en: "to teach (someone) (spoken: ngajarin)"
  - word: mendatangi
    pos: verb
    ar_eg: ييجي لـ / يزور
    ar: يأتي إلى / يقصد
    en: to come to, to visit
  - word: menangisi
    pos: verb
    ar_eg: يعيّط على - في الكلام nangisin
    ar: يبكي على - في الكلام nangisin
    en: "to cry over (spoken: nangisin)"
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: حمام بطل «غزل البنات» شغلته إيه؟
      ar: ما مهنة حمام بطل «غزل البنات»؟
      en: What does Hamam, the hero of Ghazal al-Banat, do?
    options: ["pasha yang kaya", "guru bahasa Arab", "penjual koran", "dokter"]
    answer: 1
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: في «لاسكار پيلانجي»، المدرسة كانت محتاجة كام تلميذ؟
      ar: في «لاسكار بيلانغي»، كم تلميذًا كانت المدرسة تحتاج؟
      en: In Laskar Pelangi, how many pupils does the school need?
    options: ["sembilan", "sebelas", "dua puluh", "sepuluh"]
    answer: 3
  - id: q03
    type: fill_blank
    sentence: Tiba-tiba, Harun ___ sekolah itu.
    meaning:
      ar_eg: وفجأة، هارون جه المدرسة.
      ar: وفجأة جاء هارون إلى المدرسة.
      en: Suddenly, Harun arrives at the school.
    answers: [mendatangi]
    options: ["mendatangi", "menyukai", "menangisi"]
  - id: q04
    type: listen
    text: Dari tadi nangisin Hamam, sekarang nangisin Harun.
    question:
      ar_eg: بو راهايو بتضحك على پاك بودي ليه؟
      ar: لماذا تضحك بو راهايو من باك بودي؟
      en: Why is Bu Rahayu teasing Pak Budi?
    options: ["Karena dia menangis saat menonton kedua film.", "Karena dia tidur saat film diputar.", "Karena dia makan semua popcorn."]
    answer: 0
    meaning:
      ar_eg: من بدري وهو بيعيّط على حمام، ودلوقتي بيعيّط على هارون.
      ar: منذ قليل وهو يبكي على حمام، والآن يبكي على هارون.
      en: First he was crying over Hamam, now he's crying over Harun.
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
