next:
  ar_eg: تالت يوم في سورونج، رئيس التحرير بيدّي بايو أول مهمّة - يطلع مع فريق علماء بحار لراجا أمبات. فيه مشكلة صغيرة بس... بايو بيعوم زي الحجر.
  ar: في اليوم الثالث في سورونغ يكلّف رئيس التحرير بايو بمهمّته الأولى - مرافقة فريق من علماء البحار إلى راجا أمبات. لكن ثمّة مشكلة صغيرة... بايو يسبح كالحجر.
  en: On his third day in Sorong, the editor gives Bayu his first assignment - go to Raja Ampat with a team of marine scientists. There's just one small problem... Bayu swims like a stone.
