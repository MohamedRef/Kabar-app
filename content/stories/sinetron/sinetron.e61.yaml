title:
  target: Dari Medan ke Kepala Burung
  ar_eg: من ميدان لراس العصفورة
  ar: من ميدان إلى رأس الطائر
  en: From Medan to the Bird's Head
summary:
  ar_eg: ماس جوكو بيقرا في الوارونج خبر على النت عن بايو - كسب منحة للصحفيين الشباب، وهيتدرّب خمس شهور في جرنال في سورونج في پاپوا. وبالليل العيلة كلها على الفيديو، وپاك بودي بيتلخبط في فرق الساعات تاني.
  ar: يقرأ ماس جوكو في الوارونغ خبرًا على الإنترنت عن بايو - فاز بمنحة للصحفيين الشباب، وسيتدرّب خمسة أشهر في صحيفة في سورونغ في بابوا. وفي المساء تجتمع العائلة على الاتصال المرئي، ويرتبك باك بودي في فروق التوقيت من جديد.
  en: In the warung, Mas Joko reads an online news story about Bayu - he has won a fellowship for young journalists and will spend five months at a paper in Sorong, Papua. That night the whole family is on video, and Pak Budi gets muddled by time zones all over again.
cast: [Mas Joko, Pak Budi, Bu Rahayu, Bayu, Sari, Karim]
scenes:
  - setting:
      ar_eg: ماديون، ٢٩ أكتوبر، الصبح في الوارونج. ماس جوكو داخل جري وفي إيده الموبايل.
      ar: ماديون، التاسع والعشرون من أكتوبر، صباحًا في الوارونغ. يدخل ماس جوكو مسرعًا وهاتفه في يده.
      en: Madiun, 29 October, morning at the warung. Mas Joko rushes in, phone in hand.
    lines:
      - speaker: Narrator
        text: Madiun, 29 Oktober. Pagi-pagi, Mas Joko berlari masuk ke warung sambil mengacungkan ponselnya tinggi-tinggi.
        ar_eg: ماديون، ٢٩ أكتوبر. الصبح بدري، ماس جوكو داخل الوارونج جري ورافع الموبايل لفوق.
        ar: ماديون، التاسع والعشرون من أكتوبر. في الصباح الباكر يدخل ماس جوكو الوارونغ مسرعًا رافعًا هاتفه عاليًا.
        en: Madiun, 29 October. Early in the morning, Mas Joko runs into the warung, holding his phone up high.
      - speaker: Mas Joko
        text: Pak Budi! Bu Rahayu! Bayu masuk berita! Dengar, saya bacakan, ya.
        ar_eg: يا پاك بودي! يا بو راهايو! بايو طلع في الأخبار! اسمعوا، هقرالكم.
        ar: يا باك بودي! يا بو راهايو! بايو في الأخبار! اسمعا، سأقرأ لكما.
        en: Pak Budi! Bu Rahayu! Bayu's in the news! Listen, I'll read it out.
      - speaker: Mas Joko
        text: '"MEDAN - Seorang mahasiswa Ilmu Komunikasi asal Madiun, Jawa Timur, terpilih sebagai salah satu dari dua puluh penerima Fellowship Jurnalis Muda tahun ini. Pengumuman tersebut disampaikan di Jakarta (28/10), bertepatan dengan peringatan Hari Sumpah Pemuda."'
        ar_eg: «ميدان - طالب إعلام من ماديون في جاوة الشرقية اتختار واحد من عشرين فايزين بمنحة الصحفيين الشباب السنة دي. الإعلان اتقال في جاكرتا يوم ٢٨/١٠، في نفس يوم ذكرى قَسَم الشباب.»
        ar: «ميدان - اختير طالب في قسم الإعلام من ماديون بجاوة الشرقية واحدًا من عشرين حاصلًا على منحة الصحفيين الشباب لهذا العام. وأُعلن ذلك في جاكرتا (٢٨/١٠)، متزامنًا مع ذكرى يوم قَسَم الشباب.»
        en: '"MEDAN - A communication studies student from Madiun, East Java, has been selected as one of twenty recipients of this year''s Young Journalists Fellowship. The announcement was made in Jakarta (28/10), coinciding with the commemoration of Youth Pledge Day."'
        note:
          ar_eg: لغة الخبر - المدينة بحروف كبيرة في الأول وبعدها شَرطة، والتاريخ بين قوسين (28/10). وكلمات زي tersebut (المذكور)، disampaikan (اتقال/اتعلن)، bertepatan dengan (في نفس توقيت) بتتكرّر كتير في الأخبار.
          ar: من سمات لغة الخبر - اسم المدينة بحروف كبيرة في البداية تليه شَرطة، والتاريخ بين قوسين (28/10). وتكثر فيها ألفاظ مثل tersebut (المذكور)، وdisampaikan (أُعلن)، وbertepatan dengan (متزامنًا مع).
          en: 'News style: the city in capitals and a dash up front, the date in brackets (28/10). Words like tersebut (the said, that), disampaikan (was conveyed) and bertepatan dengan (coinciding with) are everywhere in Indonesian news.'
      - speaker: Bu Rahayu
        text: Dua puluh orang dari seluruh Indonesia, dan anak kita salah satunya? Masyaallah, Le...
        ar_eg: عشرين واحد من إندونيسيا كلها، وابننا واحد منهم؟ ما شاء الله يا ابني...
        ar: عشرون شخصًا من إندونيسيا كلّها، وابننا واحد منهم؟ ما شاء الله يا بنيّ...
        en: Twenty people from all over Indonesia, and our boy is one of them? Masyaallah, son...
      - speaker: Mas Joko
        text: '"Menurut panitia, para penerima akan ditempatkan di media lokal selama lima bulan. Ia dijadwalkan bertugas di sebuah harian di Sorong, Papua Barat Daya."'
        ar_eg: «وحسب اللجنة المنظّمة، الفايزين هيشتغلوا في وسائل إعلام محلية خمس شهور. وهو متحدّد له يشتغل في جرنال يومي في سورونج، في پاپوا الجنوبية الغربية.»
        ar: «وبحسب اللجنة المنظّمة، سيُلحَق الفائزون بوسائل إعلام محلية مدّة خمسة أشهر. ومن المقرّر أن يعمل في صحيفة يومية في سورونغ، بمقاطعة بابوا الجنوبية الغربية.»
        en: '"According to the organisers, the recipients will be placed with local media for five months. He is scheduled to work at a daily paper in Sorong, Southwest Papua."'
      - speaker: Pak Budi
        text: Sorong? Itu di mana, Joko? Lebih jauh dari Kairo?
        ar_eg: سورونج؟ دي فين يا جوكو؟ أبعد من القاهرة؟
        ar: سورونغ؟ أين تقع يا جوكو؟ أأبعد من القاهرة؟
        en: Sorong? Where's that, Joko? Further than Cairo?
      - speaker: Mas Joko
        text: Tidak, Pak. Kairo jauh di barat, Sorong jauh di timur. Lihat petanya - Pulau Papua bentuknya seperti burung, dan Sorong ada di kepalanya.
        ar_eg: لأ يا پاك. القاهرة بعيد في الغرب، وسورونج بعيد في الشرق. بصّ على الخريطة - جزيرة پاپوا شكلها زي العصفورة، وسورونج في راسها.
        ar: لا يا باك. القاهرة بعيدًا في الغرب، وسورونغ بعيدًا في الشرق. انظر إلى الخريطة - جزيرة بابوا على هيئة طائر، وسورونغ في رأسه.
        en: No, Pak. Cairo's far to the west, Sorong's far to the east. Look at the map - Papua island is shaped like a bird, and Sorong is on its head.
        note:
          ar_eg: الجزء الغربي من جزيرة پاپوا اسمه Kepala Burung (راس العصفورة) عشان الجزيرة كلها شكلها طير. وسورونج عاصمة مقاطعة Papua Barat Daya، اللي اتعملت سنة ٢٠٢٢ لما منطقة پاپوا اتقسمت لست مقاطعات.
          ar: يُسمّى الطرف الغربي من جزيرة بابوا Kepala Burung (رأس الطائر)، لأنّ الجزيرة كلّها على شكل طائر. وسورونغ عاصمة مقاطعة Papua Barat Daya التي أُنشئت عام ٢٠٢٢ حين قُسّمت منطقة بابوا إلى ست مقاطعات.
          en: The western end of New Guinea is called Kepala Burung, the Bird's Head Peninsula, because the whole island looks like a bird. Sorong is the capital of Papua Barat Daya (Southwest Papua), a province created in 2022 when the Papua region was split into six provinces.
      - speaker: Pak Budi
        text: Anak bungsu Bapak... dulu menulis surat tentang got di gang. Sekarang mau terbang ke kepala burung.
        ar_eg: ابني الصغيّر... كان بيكتب جوابات عن البلّاعة اللي في الحارة. ودلوقتي هيطير لراس العصفورة.
        ar: ابني الأصغر... كان يكتب الرسائل عن مجرى الماء في الزقاق، وها هو الآن سيطير إلى رأس الطائر.
        en: My youngest... he used to write letters about the drain in our lane. Now he's flying off to the bird's head.
      - speaker: Bu Rahayu
        text: Prestasi itu tidak jatuh dari langit, Pak. Sejak suratnya dimuat di koran, Bayu tidak pernah berhenti menulis, setiap malam.
        ar_eg: النجاح ده مش بينزل من السما يا بودي. من ساعة ما جوابه اتنشر في الجرنال، بايو مبطّلش كتابة، كل ليلة.
        ar: الإنجاز لا يهبط من السماء يا باك. منذ نُشرت رسالته في الصحيفة لم يتوقّف بايو عن الكتابة كلّ ليلة.
        en: Achievements don't fall from the sky, Pak. Ever since his letter was printed in the paper, Bayu has written every single night.
      - speaker: Mas Joko
        text: '"Saya ingin belajar mendengar sebelum menulis," ujar Bayu. Ini kutipannya, Pak!'
        ar_eg: «عايز أتعلّم أسمع قبل ما أكتب»، قال بايو. ودي الجملة اللي نقلوها عنه يا پاك!
        ar: «أريد أن أتعلّم الإصغاء قبل الكتابة»، قال بايو. وهذا هو الاقتباس يا باك!
        en: '"I want to learn to listen before I write," said Bayu. That''s the quote, Pak!'
      - speaker: Pak Budi
        text: '"Ujar Bayu"... Joko, cetak berita itu dan tempel di dinding warung. Di sebelah suratnya yang dulu.'
        ar_eg: «قال بايو»... يا جوكو، اطبع الخبر ده والزقه على حيطة الوارونج. جنب جوابه القديم.
        ar: «قال بايو»... يا جوكو، اطبع هذا الخبر وألصقه على جدار الوارونغ، بجانب رسالته القديمة.
        en: '"Said Bayu"... Joko, print that story and stick it on the warung wall. Next to his old letter.'
        note:
          ar_eg: الأخبار بتغيّر فعل «قال» عشان متكرّرش - ujar، kata، tutur، ungkap، jelas (وضّح). وujar ده تقريبًا مش بيتقال غير في الكتابة.
          ar: تنوّع الأخبار فعل القول تجنّبًا للتكرار - ujar، kata، tutur، ungkap، jelas (أوضح). وujar يكاد يقتصر على الكتابة.
          en: 'News writers vary "said" to avoid repetition: ujar, kata, tutur, ungkap, jelas (explained). ujar is almost only used in writing.'
  - setting:
      ar_eg: نفس الليلة. مكالمة فيديو عائلية. بايو في أوضته في السكن في ميدان، وساري وكريم داخلين من بيتهم.
      ar: الليلة نفسها. اتصال مرئي عائلي. بايو في غرفته المستأجرة في ميدان، وساري وكريم ينضمّان من بيتهما.
      en: That night. A family video call. Bayu is in his rented room in Medan; Sari and Karim join from home.
    lines:
      - speaker: Bayu
        text: Pak, Bu, maaf baru sempat telepon. Dari pagi wartawan kampus mewawancaraiku terus. Sekarang aku tahu rasanya jadi narasumber!
        ar_eg: بابا، ماما، معلش لسه فاضي أتّصل دلوقتي. من الصبح صحفيين الجامعة عمّالين يعملوا معايا لقاءات. دلوقتي عرفت يعني إيه تبقى انت المصدر!
        ar: أبي، أمي، عذرًا لم أتمكّن من الاتصال إلا الآن. منذ الصباح وصحفيّو الجامعة يُجرون معي المقابلات. الآن عرفت شعور أن تكون مصدر الخبر!
        en: Dad, Mum, sorry I'm only calling now. Campus reporters have been interviewing me all day. Now I know what it's like to be the source!
      - speaker: Sari
        text: Adikku sekarang jadi berita, bukan cuma penulis berita. Selamat, Bayu! Kami bangga sekali.
        ar_eg: أخويا بقى هو الخبر، مش بس اللي بيكتب الأخبار. مبروك يا بايو! احنا فخورين بيك أوي.
        ar: أخي صار هو الخبر، لا كاتب الأخبار فحسب. مبارك يا بايو! نحن فخورون بك جدًّا.
        en: My little brother is the news now, not just the one writing it. Congratulations, Bayu! We're so proud.
      - speaker: Karim
        text: Mabruk, ya Bayu! Kata orang Mesir, "illi yizra' yihsid". Dalam bahasa Indonesia ada juga, kan? Siapa menanam, dia menuai.
        ar_eg: مبروك يا بايو! زي ما بنقول في مصر، «اللي يزرع يحصد». وفي الإندونيسي فيه نفس المثل، صح؟ اللي يزرع يحصد.
        ar: مبارك يا بايو! يقول المصريون «اللي يزرع يحصد». وفي الإندونيسية مثل مشابه، أليس كذلك؟ من زرع حصد.
        en: Mabruk, Bayu! As we say in Egypt, "whoever plants, harvests". Indonesian has it too, right? You reap what you sow.
      - speaker: Pak Budi
        text: Le, Bapak sudah buka peta. Di Sorong sekarang jam berapa?
        ar_eg: يا ابني، أنا فتحت الخريطة. الساعة كام دلوقتي في سورونج؟
        ar: يا بنيّ، فتحتُ الخريطة. كم الساعة الآن في سورونغ؟
        en: Son, I've opened the map. What time is it in Sorong right now?
      - speaker: Bayu
        text: Di Sorong sudah jam sepuluh malam, Pak. Di Madiun dan Medan baru jam delapan. Sorong pakai WIT, dua jam lebih cepat dari WIB.
        ar_eg: في سورونج الساعة بقت عشرة بالليل يا بابا. في ماديون وميدان لسه تمانية. سورونج على توقيت WIT، قدّام توقيت WIB بساعتين.
        ar: الساعة في سورونغ العاشرة ليلًا يا أبي، وفي ماديون وميدان الثامنة فقط. تتبع سورونغ توقيت WIT، وهو يسبق WIB بساعتين.
        en: In Sorong it's already ten at night, Dad. In Madiun and Medan it's only eight. Sorong is on WIT, two hours ahead of WIB.
        note:
          ar_eg: إندونيسيا فيها ٣ مناطق زمنية - WIB (الغرب، جاوة وسومطرة)، WITA (الوسط، بالي وكاليمانتان الشرقية)، وWIT (الشرق، مالوكو وپاپوا). فاكرين في الحلقة الأولى لخبطة صباح الخير ونهارك سعيد مع القاهرة؟
          ar: في إندونيسيا ثلاث مناطق زمنية - WIB (الغرب، جاوة وسومطرة)، وWITA (الوسط، بالي وشرق كاليمانتان)، وWIT (الشرق، مالوكو وبابوا). أتذكرون ارتباك التحيات مع القاهرة في الحلقة الأولى؟
          en: 'Indonesia has three time zones: WIB (west - Java, Sumatra), WITA (central - Bali, East Kalimantan) and WIT (east - Maluku, Papua). Remember the greeting mix-up with Cairo back in episode one?'
      - speaker: Pak Budi
        text: Aduh. Dulu Kairo lebih lambat, sekarang Sorong lebih cepat. Kepala Bapak berputar seperti jarum jam dinding!
        ar_eg: يا ساتر. زمان القاهرة كانت ورانا، ودلوقتي سورونج قدّامنا. راسي بتلفّ زي عقارب الساعة!
        ar: يا إلهي. كانت القاهرة متأخرة عنّا، والآن سورونغ متقدّمة علينا. رأسي يدور كعقارب ساعة الحائط!
        en: Oh dear. Cairo used to be behind, now Sorong is ahead. My head's spinning like the hands of the wall clock!
      - speaker: Bu Rahayu
        text: Le, di sana kamu tinggal di mana? Makan apa? Ada yang jual pecel?
        ar_eg: يا ابني، هتقعد فين هناك؟ هتاكل إيه؟ فيه حدّ بيبيع بيچيل؟
        ar: يا بنيّ، أين ستسكن هناك؟ ماذا ستأكل؟ هل يبيع أحد البيتشيل؟
        en: Son, where will you stay? What will you eat? Does anyone sell pecel?
      - speaker: Bayu
        text: Kantor redaksi menyiapkan kamar dekat pelabuhan, Bu. Soal makanan, kata mereka aku wajib mencoba papeda dengan ikan kuah kuning.
        ar_eg: الجرنال مجهّز لي أوضة قريبة من الميناء يا ماما. وبالنسبة للأكل، بيقولوا لازم أجرّب الپاپيدا بالسمك في الشوربة الصفرا.
        ar: جهّزت هيئة التحرير غرفة قرب الميناء يا أمي. أمّا الطعام فيقولون إنّ عليّ أن أجرّب البابيدا مع السمك بالمرق الأصفر.
        en: The newsroom has a room ready near the harbour, Mum. As for food, they say I absolutely have to try papeda with yellow fish soup.
        note:
          ar_eg: papeda عصيدة شفافة ولزجة من نشا شجر الساجو، الأكل الأساسي في پاپوا ومالوكو، وبتتاكل مع ikan kuah kuning - سمك في شوربة صفرا بالكركم والليمون.
          ar: papeda عصيدة شفّافة لزجة من نشا نخيل الساغو، وهي الغذاء الأساسي في بابوا ومالوكو، وتؤكل مع ikan kuah kuning - سمك في مرق أصفر بالكركم والليمون.
          en: Papeda is a clear, sticky porridge of sago starch, a staple in Papua and Maluku, eaten with ikan kuah kuning - fish in a yellow turmeric-and-lime broth.
      - speaker: Karim
        text: Pidatomu tadi bagaimana? Kamu mengutip Sumpah Pemuda, kan?
        ar_eg: وخطبتك النهارده كانت إزاي؟ اقتبست من قَسَم الشباب، صح؟
        ar: وكيف كانت كلمتك اليوم؟ اقتبستَ من قَسَم الشباب، أليس كذلك؟
        en: How did your speech go today? You quoted the Youth Pledge, didn't you?
      - speaker: Bayu
        text: Iya, Mas. Aku menutup dengan butir ketiga, "Kami putra dan putri Indonesia menjunjung bahasa persatuan, bahasa Indonesia." Di Papua ada lebih dari dua ratus lima puluh bahasa daerah. Aku ingin mendengar bagaimana bahasa persatuan itu hidup di sana.
        ar_eg: أيوه يا ماس. ختمت بالبند التالت - «إحنا ولاد وبنات إندونيسيا نرفع لغة الوحدة، اللغة الإندونيسية». في پاپوا فيه أكتر من ميتين وخمسين لغة محلية. عايز أسمع لغة الوحدة دي عايشة إزاي هناك.
        ar: نعم يا ماس. ختمتُ بالبند الثالث - «نحن أبناء إندونيسيا وبناتها نُعلي لغة الوحدة، اللغة الإندونيسية». في بابوا أكثر من مئتين وخمسين لغة محلية، وأريد أن أسمع كيف تحيا لغة الوحدة هناك.
        en: 'Yes. I closed with the third pledge: "We, the sons and daughters of Indonesia, uphold the language of unity, Indonesian." Papua has more than two hundred and fifty local languages. I want to hear how that language of unity lives there.'
        note:
          ar_eg: قَسَم الشباب (Sumpah Pemuda) اتقال في مؤتمر الشباب في ٢٨ أكتوبر ١٩٢٨. البندين الأولانيين بيقولوا mengaku (نعترف بـ) وطن واحد وأمّة واحدة، بس التالت بيقول menjunjung (نرفع/نعلي) - يعني الإندونيسي لغة الوحدة، مش بديل عن اللغات المحلية.
          ar: أُعلن قَسَم الشباب (Sumpah Pemuda) في مؤتمر الشباب في ٢٨ أكتوبر ١٩٢٨. يقول البندان الأوّلان mengaku (نُقرّ بـ) وطنًا واحدًا وأمّة واحدة، أمّا الثالث فيقول menjunjung (نُعلي) - فالإندونيسية لغة الوحدة لا بديل عن اللغات المحلية.
          en: The Youth Pledge was made at the Youth Congress on 28 October 1928. The first two pledges say mengaku (we acknowledge) one homeland and one nation, but the third says menjunjung (we uphold) - Indonesian is the language of unity, not a replacement for local languages.
      - speaker: Sari
        text: Bayu, satu pesan dari kakakmu yang pernah lama tinggal jauh dari rumah. Jangan cuma mendengar orang yang bicara paling keras.
        ar_eg: يا بايو، نصيحة واحدة من أختك اللي عاشت سنين بعيد عن البيت. متسمعش بس للي صوته أعلى واحد.
        ar: يا بايو، نصيحة واحدة من أختك التي عاشت طويلًا بعيدًا عن البيت - لا تُصغِ فقط إلى صاحب الصوت الأعلى.
        en: Bayu, one piece of advice from a sister who lived far from home for years. Don't just listen to whoever talks loudest.
      - speaker: Pak Budi
        text: Dan satu pesan dari Bapak. Telepon ibumu setiap Jumat malam. Jam delapan WIB, bukan WIT!
        ar_eg: ونصيحة واحدة مني أنا. كلّم أمّك كل جمعة بالليل. الساعة تمانية بتوقيت WIB، مش WIT!
        ar: ونصيحة واحدة منّي. اتّصل بأمّك كلّ ليلة جمعة، في الثامنة بتوقيت WIB، لا WIT!
        en: And one from me. Call your mother every Friday evening. Eight o'clock WIB, not WIT!
