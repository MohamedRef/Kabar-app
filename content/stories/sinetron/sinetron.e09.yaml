title:
  target: Lurus, Lalu Belok Kiri
  ar_eg: على طول، وبعدين شمال
  ar: إلى الأمام، ثم يسارًا
  en: Straight On, Then Left
summary:
  ar_eg: في ماديون، كريم بيسأل على طريق الجامع. وفي القاهرة، الحاجّة فاطمة بتوصف لساري طريق البوسطة عشان تستلم طرد من إندونيسيا.
  ar: في ماديون يسأل كريم عن طريق المسجد. وفي القاهرة تصف الحاجّة فاطمة لساري طريق مكتب البريد لتستلم طردًا من إندونيسيا.
  en: In Madiun, Karim asks the way to the mosque. In Cairo, Hagga Fatma tells Sari how to get to the post office to collect a parcel from Indonesia.
cast: [Karim, Pak Budi, Mas Joko, Hagga Fatma, Sari, Nadia]
scenes:
  - setting:
      ar_eg: الوارونج في ماديون، قرب الضهر. كريم خلّص طبق الپيتشل.
      ar: الوارونغ في ماديون قرب الظهر. أنهى كريم طبق البيتشل.
      en: The warung in Madiun, near noon. Karim has just finished his pecel.
    lines:
      - speaker: Karim
        text: Pecelnya enak sekali, Pak! Tapi pedas!
        ar_eg: الپيتشل حلو جدًا يا پاك! بس حرّاق!
        ar: البيتشل لذيذ جدًا يا باك! لكنه حارّ!
        en: The pecel is delicious, Pak! But spicy!
      - speaker: Karim
        text: Pak, masjid di mana? Saya mau salat zuhur.
        ar_eg: يا پاك، الجامع فين؟ عايز أصلّي الضهر.
        ar: يا باك، أين المسجد؟ أريد أن أصلّي الظهر.
        en: Pak, where's the mosque? I'd like to pray the noon prayer.
        note:
          ar_eg: zuhur من «الظهر»، وmasjid من «مسجد». كلمات الصلاة في الإندونيسي أغلبها عربي.
          ar: zuhur من «الظهر»، وmasjid من «مسجد»؛ فمعظم ألفاظ الصلاة في الإندونيسية عربية.
          en: zuhur comes from Arabic «الظهر» and masjid from «مسجد» — most prayer words in Indonesian are Arabic.
      - speaker: Pak Budi
        text: Dekat, Mas. Dari sini, jalan lurus, lalu belok kiri di perempatan.
        ar_eg: قريب يا كريم. من هنا، امشي على طول، وبعدين خُش شمال عند التقاطع.
        ar: قريب يا كريم. من هنا امشِ إلى الأمام، ثم انعطف يسارًا عند التقاطع.
        en: It's close, Karim. From here, go straight, then turn left at the crossroads.
      - speaker: Pak Budi
        text: Masjidnya di sebelah kanan, di samping pasar.
        ar_eg: الجامع هيبقى على إيدك اليمين، جنب السوق.
        ar: المسجد على يمينك، بجانب السوق.
        en: The mosque is on the right, next to the market.
      - speaker: Karim
        text: Lurus, belok kiri, lalu... kanan atau kiri?
        ar_eg: على طول، شمال، وبعدين... يمين ولا شمال؟
        ar: إلى الأمام، يسارًا، ثم... يمينًا أم يسارًا؟
        en: Straight, left, then... right or left?
      - speaker: Mas Joko
        text: Ayo, Mas Karim! Saya juga mau ke masjid. Kita jalan kaki.
        ar_eg: يلا يا كريم! أنا كمان رايح الجامع. نتمشّى سوا.
        ar: هيّا يا كريم! أنا أيضًا ذاهب إلى المسجد. لنمشِ معًا.
        en: Come on, Karim! I'm going to the mosque too. Let's walk.
        note:
          ar_eg: في إندونيسيا الناس كتير بتوصّلك بنفسها بدل ما توصف الطريق، زي عندنا في مصر بالظبط!
          ar: كثيرًا ما يرافقك الناس في إندونيسيا بأنفسهم بدل وصف الطريق، تمامًا كما في مصر!
          en: In Indonesia people will often walk you there instead of explaining — just like in Egypt!
  - setting:
      ar_eg: القاهرة، على باب الشقة. الحاجّة فاطمة ماسكة ورقة.
      ar: القاهرة، عند باب الشقة. الحاجّة فاطمة تحمل ورقة.
      en: Cairo, at the flat door. Hagga Fatma is holding a slip of paper.
    lines:
      - speaker: Hagga Fatma
        text: Sari! Ada surat dari kantor pos. Paket dari Indonesia!
        ar_eg: يا ساري! فيه ورقة من البوسطة. طرد من إندونيسيا!
        ar: يا ساري! وصلت ورقة من مكتب البريد. طرد من إندونيسيا!
        en: Sari! A note from the post office. A parcel from Indonesia!
      - speaker: Sari
        text: Kencur dari Bapak! Kantor posnya di mana, Hagga?
        ar_eg: الكينتشور من بابا! البوسطة فين يا حاجّة؟
        ar: الكنتشور من أبي! أين مكتب البريد يا حاجّة؟
        en: The kencur from Dad! Where's the post office, Hagga?
      - speaker: Hagga Fatma
        text: Tidak jauh. Dari pintu, belok kanan, lalu jalan lurus.
        ar_eg: مش بعيد. من الباب خُشي يمين، وبعدين امشي على طول.
        ar: ليس بعيدًا. من الباب انعطفي يمينًا، ثم امشي إلى الأمام.
        en: Not far. From the door, turn right, then go straight.
      - speaker: Hagga Fatma
        text: Kantor pos di antara masjid dan bank.
        ar_eg: البوسطة بين الجامع والبنك.
        ar: مكتب البريد بين المسجد والبنك.
        en: The post office is between the mosque and the bank.
      - speaker: Nadia
        text: Saya tahu! Di depan halte bus.
        ar_eg: أنا عارفاه! قدّام محطة الأتوبيس.
        ar: أعرفه! أمام موقف الحافلات.
        en: I know it! Opposite the bus stop.
      - speaker: Sari
        text: Kita naik bus atau jalan kaki?
        ar_eg: نركب أتوبيس ولا نمشي؟
        ar: هل نركب الحافلة أم نمشي؟
        en: Shall we take the bus or walk?
      - speaker: Nadia
        text: Jalan kaki! Dekat.
        ar_eg: نمشي! قريبة.
        ar: نمشي! إنه قريب.
        en: Walk! It's close.
      - speaker: Hagga Fatma
        text: Pelan-pelan, ya! Di jalan banyak mobil.
        ar_eg: براحة يا بنات! الشارع فيه عربيات كتير.
        ar: على مهلكما! في الشارع سيارات كثيرة.
        en: Take it easy! There are lots of cars on the road.
      - speaker: Narrator
        text: Di Madiun, Karim dan Mas Joko pulang dari masjid. Di Kairo, Sari pulang dengan paket.
        ar_eg: في ماديون، كريم وماس جوكو راجعين من الجامع. وفي القاهرة، ساري راجعة بالطرد.
        ar: في ماديون يعود كريم وماس جوكو من المسجد، وفي القاهرة تعود ساري ومعها الطرد.
        en: In Madiun, Karim and Mas Joko walk back from the mosque. In Cairo, Sari comes home with the parcel.
