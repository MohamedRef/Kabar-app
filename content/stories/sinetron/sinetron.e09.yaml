next:
  ar_eg: الطرد وصل! وفي ماديون، كريم بيحكي حكايته... وپاك بودي بيعترف بحاجة، عمره ما سافر بره إندونيسيا.
  ar: وصل الطرد! وفي ماديون يروي كريم حكايته... ويعترف باك بودي بأنه لم يسافر قطّ خارج إندونيسيا.
  en: The parcel has arrived! In Madiun, Karim tells his story... and Pak Budi admits something — he has never been outside Indonesia.
