next:
  ar_eg: ساري قلقانة. إزاي يوم باك بودي بيعدّي من الفجر لحد بالليل؟
  ar: ساري قلقة. كيف يمضي يوم باك بودي من الفجر حتى الليل؟
  en: Sari is worried. What does Pak Budi's day look like, from dawn till night?
