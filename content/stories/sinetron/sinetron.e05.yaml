title:
  target: Selamat Ulang Tahun dari Pantai
  ar_eg: كل سنة وانت طيب من على البحر
  ar: عيد ميلاد سعيد من الشاطئ
  en: Happy Birthday from the Beach
summary:
  ar_eg: ساري ونادية في إجازة في إسكندرية، وبيكلموا الحفلة الصغيرة في الوارونج فيديو. الهدية لسه موصلتش، بس پاك بودي عنده رأي تاني في موضوع الهدايا.
  ar: ساري ونادية في عطلة بالإسكندرية، وتتصلان بالحفلة الصغيرة في الوارونغ. لم تصل الهدية بعد، لكن لباك بودي رأيًا آخر في الهدايا.
  en: Sari and Nadia are on holiday in Alexandria and video-call the little party at the warung. The present hasn't arrived — but Pak Budi sees presents differently.
cast: [Sari, Nadia, Pak Budi, Bu Rahayu, Mas Joko, Bayu]
scenes:
  - setting:
      ar_eg: إسكندرية، يوم السبت، على البحر. الشمس طالعة والجو حر.
      ar: الإسكندرية يوم السبت، على الشاطئ. الشمس مشرقة والجو حار.
      en: Alexandria, Saturday, on the beach. Sunny and hot.
    lines:
      - speaker: Nadia
        text: Sari, cuacanya bagus! Cerah!
        ar_eg: يا ساري، الجو حلو! صحو!
        ar: يا ساري، الطقس جميل! صحو!
        en: Sari, the weather's lovely! So sunny!
      - speaker: Sari
        text: Ya, tapi panas! Bagaimana kalau kita berenang?
        ar_eg: أيوه، بس حر! إيه رأيك نعوم؟
        ar: نعم، لكنه حار! ما رأيك أن نسبح؟
        en: Yes, but it's hot! How about a swim?
      - speaker: Nadia
        text: Boleh! Tapi hari ini ulang tahun Pak Budi!
        ar_eg: ماشي! بس النهارده عيد ميلاد پاك بودي!
        ar: حسنًا! لكن اليوم عيد ميلاد باك بودي!
        en: Sure! But today is Pak Budi's birthday!
      - speaker: Sari
        text: Ya! Sekarang jam berapa di Madiun?
        ar_eg: صح! الساعة كام دلوقتي في ماديون؟
        ar: صحيح! كم الساعة الآن في ماديون؟
        en: Right! What time is it in Madiun now?
      - speaker: Nadia
        text: Jam tiga sore. Telepon, Sari!
        ar_eg: تلاتة العصر. كلّميهم يا ساري!
        ar: الثالثة عصرًا. اتّصلي بهم يا ساري!
        en: Three in the afternoon. Call them, Sari!
  - setting:
      ar_eg: مكالمة فيديو مع الوارونج في ماديون. فيه حفلة صغيرة، والمطر نازل برّه.
      ar: اتصال مرئي مع الوارونغ في ماديون. هناك حفلة صغيرة، والمطر يهطل في الخارج.
      en: A video call to the warung in Madiun. A small party is on, and it's raining outside.
    lines:
      - speaker: Sari
        text: Selamat ulang tahun, Pak!
        ar_eg: كل سنة وانت طيب يا بابا!
        ar: عيد ميلاد سعيد يا أبي!
        en: Happy birthday, Dad!
      - speaker: Pak Budi
        text: Terima kasih, Nduk! Kamu di mana? Ada pantai!
        ar_eg: شكرًا يا بنتي! انتي فين؟ ده فيه بحر!
        ar: شكرًا يا ابنتي! أين أنتِ؟ هناك شاطئ!
        en: Thank you, sweetheart! Where are you? There's a beach!
      - speaker: Sari
        text: Kami di Aleksandria, Pak. Kami berlibur.
        ar_eg: إحنا في إسكندرية يا بابا. إحنا في إجازة.
        ar: نحن في الإسكندرية يا أبي، في عطلة.
        en: We're in Alexandria, Dad. We're on holiday.
        note:
          ar_eg: في مصر الإجازة الأسبوعية الجمعة والسبت، فطلبة كتير بيسافروا إسكندرية آخر الأسبوع.
          ar: العطلة الأسبوعية في مصر يوما الجمعة والسبت، فيسافر كثير من الطلاب إلى الإسكندرية في نهاية الأسبوع.
          en: Egypt's weekend is Friday and Saturday, so plenty of students pop over to Alexandria.
      - speaker: Mas Joko
        text: Wah, pantainya bagus! Di Madiun hujan.
        ar_eg: يا سلام، البحر حلو! هنا في ماديون بتمطر.
        ar: يا للروعة، الشاطئ جميل! في ماديون تمطر.
        en: Wow, the beach looks great! It's raining in Madiun.
      - speaker: Bu Rahayu
        text: Bagaimana liburanmu, Nduk?
        ar_eg: الإجازة عاملة إيه يا بنتي؟
        ar: كيف عطلتك يا ابنتي؟
        en: How's your holiday, sweetheart?
      - speaker: Sari
        text: Seru, Bu! Tapi, Pak... maaf. Hadiahnya belum datang.
        ar_eg: تجنن يا ماما! بس يا بابا... أنا آسفة. الهدية لسه موصلتش.
        ar: ممتعة يا أمي! لكن يا أبي... آسفة، لم تصل الهدية بعد.
        en: It's great, Mum! But Dad... I'm sorry. The present hasn't arrived yet.
      - speaker: Pak Budi
        text: Hadiah? Nduk, ada kamu. Itu hadiah saya.
        ar_eg: هدية؟ يا بنتي، انتي موجودة. دي هديتي.
        ar: هدية؟ يا ابنتي، أنتِ موجودة، وهذه هديتي.
        en: A present? Sweetheart, I've got you. That's my present.
      - speaker: Bayu
        text: Mbak, boleh saya ke pantai juga?
        ar_eg: يا أبلة، ممكن آجي البحر أنا كمان؟
        ar: يا أختي، هل يمكنني أن آتي إلى الشاطئ أيضًا؟
        en: Sis, can I come to the beach too?
      - speaker: Sari
        text: Boleh, Bayu! Tapi tiketnya mahal!
        ar_eg: ماشي يا بايو! بس التذكرة غالية!
        ar: حسنًا يا بايو! لكن التذكرة غالية!
        en: Sure, Bayu! But the ticket's expensive!
      - speaker: Nadia
        text: Permisi, Pak Budi. Selamat ulang tahun dari Mesir!
        ar_eg: لو سمحت يا پاك بودي. كل سنة وانت طيب من مصر!
        ar: عن إذنك يا باك بودي. عيد ميلاد سعيد من مصر!
        en: Excuse me, Pak Budi. Happy birthday from Egypt!
      - speaker: Pak Budi
        text: Terima kasih, Nadia! Silakan datang ke Madiun!
        ar_eg: شكرًا يا نادية! اتفضلي زورينا في ماديون!
        ar: شكرًا يا نادية! تفضّلي بزيارتنا في ماديون!
        en: Thank you, Nadia! Do come and visit Madiun!
  - setting:
      ar_eg: بعد المكالمة. بو راهايو بتبعت رسالة صوتية لساري لوحدها.
      ar: بعد الاتصال، ترسل بو راهايو رسالة صوتية لساري وحدها.
      en: After the call, Bu Rahayu sends Sari a private voice message.
    lines:
      - speaker: Bu Rahayu
        text: Nduk... Bapak kurang sehat.
        ar_eg: يا بنتي... بابا مش في أحسن حالاته.
        ar: يا ابنتي... أبوكِ ليس بصحة جيدة تمامًا.
        en: Sweetheart... Dad isn't very well.
        note:
          ar_eg: kurang sehat حرفيًا «ناقص صحة»، طريقة لطيفة للقول إن حد تعبان شوية.
          ar: kurang sehat حرفيًا «ناقص الصحة»، وهي طريقة لطيفة للقول إن أحدًا متوعّك قليلًا.
          en: kurang sehat is literally "short on health" — a gentle way of saying someone is a bit unwell.
