title:
  target: Sekawan atus sanga undhak-undhakan
  ar_eg: ٤٠٩ سلّمة
  ar: ٤٠٩ درجات
  en: Four hundred and nine steps
summary:
  ar_eg: كريم بيطلع سلالم إيموجيري لحدّ مقابر السلطان أجونج، وفوق بيلاقي پاك هارجو، مدرّس الكراما بتاعه، شغّال حارس للمقابر. پاك هارجو بيعلّمه الأرقام الجاوي، والحروف الكبيرة (murda) لأسماء الناس المحترمين، والحروف اللي فيها تلات نقط (rekan) للأصوات العربي. وكريم بيكتشف إن «kabar» نفسها جاية من العربي.
  ar: يصعد كريم درجات إيموجيري حتى مقابر السلطان أغونغ، وفي الأعلى يجد باك هارجو، معلّمه للكراما، يعمل حارسًا للمقابر. يعلّمه باك هارجو الأرقام الجاوية، والحروف الكبيرة (murda) لأسماء ذوي المقام، والحروف ذات النقاط الثلاث (rekan) للأصوات العربية. ويكتشف كريم أنّ «kabar» نفسها من العربية.
  en: Karim climbs the Imogiri stairs to Sultan Agung's tomb, and at the top finds Pak Harjo, his krama teacher from Jogja, serving as a tomb keeper. Pak Harjo teaches him Javanese numerals, the big letters (murda) for honoured names, and the three-dot letters (rekan) for Arabic sounds. And Karim finds out that "kabar" itself comes from Arabic.
cast: [Karim, Pak Harjo]
scenes:
  - setting:
      ar_eg: سلالم إيموجيري الطويلة على التلّ، الصبح. شجر عالي على الجنبين. كريم بيطلع ويعدّ بصوت عالي ونَفَسه مقطوع.
      ar: درجات إيموجيري الطويلة على التلّ، صباحًا. أشجار عالية على الجانبين. يصعد كريم ويعدّ بصوت عالٍ لاهثًا.
      en: The long Imogiri stairs up the hill, morning. Tall trees on both sides. Karim climbs, counting aloud, out of breath.
    lines:
      - speaker: Karim
        text: Satus... rong atus... telung atus... Aduh, sikilku!
        ar_eg: ميّة... ميتين... تلتميّة... آه يا رجلي!
        ar: مئة... مئتان... ثلاثمئة... آه، رجلاي!
        en: One hundred... two hundred... three hundred... Ouch, my legs!
        note:
          ar_eg: "كلمات: telung = تلات (قبل اسم)؛ aduh = آه! (من الوجع)؛ rong = اتنين (قبل وحدة)."
          ar: "مفردات: telung = ثلاثة (قبل الاسم)؛ aduh = آه! (ألم)؛ rong = اثنان (قبل المعدود)."
          en: "Words: telung = three (before a noun); aduh = ouch!; rong = two (before a unit)."
      - speaker: Narrator
        text: Ing pucuking undhak-undhakan, ana priyayi sepuh nganggo ageman abdi dalem. Karim kenal swarane.
        ar_eg: فوق في آخر السلّم، فيه راجل كبير لابس لبس خدّام القصر. كريم عارف صوته.
        ar: في أعلى الدرج رجل مسنّ بلباس خدم القصر. يعرف كريم صوته.
        en: At the top of the stairs stands an elderly man in court servant's dress. Karim knows his voice.
        note:
          ar_eg: "كلمات: swarane = صوته، الصوت."
          ar: "مفردات: swarane = صوته."
          en: "Words: swarane = his/her voice, the sound."
      - speaker: Pak Harjo
        text: Lho, Nak Karim? Kok saged dumugi Imogiri?
        ar_eg: إيه ده، يا ابني كريم؟ إزّاي وصلت إيموجيري؟
        ar: عجبًا، يا بنيّ كريم؟ كيف وصلت إلى إيموجيري؟
        en: Well, Karim, my boy? How did you get all the way to Imogiri?
      - speaker: Karim
        text: Pak Harjo! Kula mboten nyana! Panjenengan nyambut damel wonten mriki?
        ar_eg: پاك هارجو! أنا مكنتش متوقّع! حضرتك بتشتغل هنا؟
        ar: باك هارجو! لم أتوقّع ذلك! أتعمل حضرتك هنا؟
        en: Pak Harjo! I never expected this! Do you work here?
      - speaker: Pak Harjo
        text: Inggih, Nak. Kula abdi dalem, njagi makam para raja. Wonten ing ngriki wonten raja Solo lan raja Ngayogyakarta.
        ar_eg: أيوه يا ابني. أنا من خدّام القصر، بحرس مقابر الملوك. هنا فيه ملوك سولو وملوك يوجياكارتا.
        ar: نعم يا بنيّ. أنا من خدم القصر، أحرس مقابر الملوك. هنا ملوك سولو وملوك يوغياكارتا.
        en: Yes, my boy. I'm a court servant, I keep the kings' tombs. Kings of Solo and of Yogyakarta both lie here.
        note:
          ar_eg: "مقابر إيموجيري بناها السلطان أجونج، أعظم ملوك ماتارام، في القرن السبعتاشر. ولمّا ماتارام اتقسمت، ملوك سولو ويوجيا الاتنين اندفنوا هنا، وكل قصر ليه خدّامه. كلمات: raja = ملك؛ para = الـ… (جمع للناس)."
          ar: "بنى السلطان أغونغ، أعظم ملوك ماتارام، مقابر إيموجيري في القرن السابع عشر. ولمّا انقسمت ماتارام دُفن هنا ملوك سولو ويوغيا معًا، ولكلّ قصر خدمه. مفردات: raja = ملك؛ para = أداة جمع للأشخاص."
          en: "Sultan Agung, the greatest Mataram king, built the Imogiri cemetery in the 17th century. After Mataram split, kings of both Solo and Yogya were buried here, and each court has its own keepers. Words: raja = king; para = plural marker for people."
      - speaker: Karim
        text: Undhak-undhakanipun kathah sanget, Pak. Kula ngetang ngantos kesupen.
        ar_eg: السلالم كتير أوي يا پاك. أنا كنت بعدّ لحدّ ما نسيت.
        ar: الدرجات كثيرة جدًّا يا باك. كنت أعدّ حتى نسيت.
        en: There are so many steps, Pak. I counted until I lost track.
      - speaker: Pak Harjo
        text: "Hahaha! Kula serataken. Sekawan atus sanga."
        ar_eg: ههههه! أكتبهولك. أربعميّة وتسعة.
        ar: ههههه! سأكتبه لك. أربعمئة وتسعة.
        en: Hahaha! I'll write it for you. Four hundred and nine.
        note:
          ar_eg: الأرقام الجاوي ꧐ ꧑ ꧒ ꧓ ꧔ ꧕ ꧖ ꧗ ꧘ ꧙ = ٠–٩. والرقم بيتكتب بين علامتين ꧇...꧇ عشان ميتلخبطش مع الحروف. ꧇꧔꧐꧙꧇ = ٤٠٩.
          ar: الأرقام الجاوية ꧐ ꧑ ꧒ ꧓ ꧔ ꧕ ꧖ ꧗ ꧘ ꧙ = ٠–٩. ويُكتب العدد بين علامتين ꧇...꧇ كي لا يلتبس بالحروف. ꧇꧔꧐꧙꧇ = ٤٠٩.
          en: Javanese numerals ꧐ ꧑ ꧒ ꧓ ꧔ ꧕ ꧖ ꧗ ꧘ ꧙ = 0-9. A number is written between two marks ꧇...꧇ so it isn't mixed up with letters. ꧇꧔꧐꧙꧇ = 409.
  - setting:
      ar_eg: قدّام بوّابة المقابر، لوحة حجر عليها اسم بالحروف الجاوي. أول حرف شكله أكبر وغريب.
      ar: أمام بوّابة المقابر لوحة حجرية عليها اسم بالحروف الجاوية. الحرف الأوّل أكبر وغريب الشكل.
      en: In front of the tomb gate, a stone plaque with a name in Javanese script. The first letter looks bigger and strange.
    lines:
      - speaker: Karim
        text: "Sul... tan... Sultan! Nanging Pak, aksara sa punika kok benten?"
        ar_eg: سلطان! بس يا پاك، الـsa دي شكلها مختلف ليه؟
        ar: سلطان! لكن يا باك، لماذا تبدو الـsa هذه مختلفة؟
        en: Sultan! But Pak, why does this sa look different?
        note:
          ar_eg: "ꦯꦸꦭ꧀ꦠꦤ꧀ = Sultan. كلمات: benten = مختلف (كراما)؛ sa = أسماء حروف جاوية."
          ar: "ꦯꦸꦭ꧀ꦠꦤ꧀ = Sultan. مفردات: benten = مختلف (كراما)؛ sa = أسماء حروف جاوية."
          en: "ꦯꦸꦭ꧀ꦠꦤ꧀ = Sultan. Words: benten = different (krama for beda); sa = names of Javanese letters."
      - speaker: Pak Harjo
        text: Punika aksara murda, Nak. Kangge nami tiyang ingkang dipunurmati, kados Sultan utawi Gusti.
        ar_eg: دي «الحروف الكبيرة» يا ابني. لأسماء الناس اللي ليهم مقام، زي السلطان أو «Gusti».
        ar: هذه «الحروف الكبيرة» يا بنيّ. لأسماء ذوي المقام، كالسلطان أو «Gusti».
        en: That's aksara murda, my boy. For the names of honoured people, like Sultan or Gusti.
        note:
          ar_eg: "aksara murda زي الحرف الكابيتال في الإنجليزي، بس مش لكل اسم - بس للناس والحاجات اللي ليها احترام. ꦯ = sa murda، وꦓꦸꦱ꧀ꦠꦶ = Gusti بالـga murda ꦓ. كلمات: dipunurmati = محترم، الناس بتحترمه."
          ar: "aksara murda كالحرف الكبير في الإنجليزية، لكن ليس لكلّ اسم - بل لذوي المقام وما يُبجَّل. ꦯ = sa murda، وꦓꦸꦱ꧀ꦠꦶ = Gusti بالـga murda ꦓ. مفردات: dipunurmati = مُحترَم."
          en: "Aksara murda are like English capitals, but not for every name - only for people and things held in honour. ꦯ = sa murda, and ꦓꦸꦱ꧀ꦠꦶ = Gusti with ga murda ꦓ. Words: dipunurmati = respected, honoured."
      - speaker: Karim
        text: Kados huruf ageng ing basa Inggris!
        ar_eg: زي الحروف الكابيتال في الإنجليزي!
        ar: مثل الحروف الكبيرة في الإنجليزية!
        en: Like capital letters in English!
      - speaker: Pak Harjo
        text: Meh, Nak. Nanging nami kula, Harjo, mboten mawi murda. Kula namung abdi.
        ar_eg: تقريبًا يا ابني. بس اسمي أنا، هارجو، مش بيتكتب بالـmurda. أنا مجرّد خدّام.
        ar: تقريبًا يا بنيّ. لكنّ اسمي، هارجو، لا يُكتب بالـmurda. أنا مجرّد خادم.
        en: Almost, my boy. But my name, Harjo, isn't written with murda. I'm only a servant.
        note:
          ar_eg: "كلمات: mawi = بـ، فيه (كراما)؛ meh = تقريبًا."
          ar: "مفردات: mawi = بـ، مع (كراما)؛ meh = تقريبًا."
          en: "Words: mawi = with (krama); meh = almost."
  - setting:
      ar_eg: قاعدين على السلالم بيرتاحوا. پاك هارجو ماسك كرّاسة كريم وقلم.
      ar: يجلسان على الدرج يستريحان. يمسك باك هارجو دفتر كريم وقلمًا.
      en: Sitting on the steps, resting. Pak Harjo holds Karim's notebook and a pen.
    lines:
      - speaker: Karim
        text: Pak, kados pundi nyerat "dzikir"? Wonten swanten Arab.
        ar_eg: يا پاك، أكتب «ذِكر» إزّاي؟ فيها صوت عربي.
        ar: يا باك، كيف أكتب «ذِكر»؟ فيها صوت عربيّ.
        en: Pak, how do I write "dzikir"? It has an Arabic sound.
      - speaker: Pak Harjo
        text: "Dzikir. Aksara da mawi cecak telu ing nginggil, dados \"dz\". Punika aksara rekan."
        ar_eg: "ذِكر. حرف الـda وفوقه تلات نقط، يبقى «ذ». دي اسمها aksara rekan."
        ar: "ذِكر. حرف الـda وفوقه ثلاث نقاط، فيصير «ذ». هذه تسمّى aksara rekan."
        en: "Dzikir. The letter da with three dots on top becomes \"dz\". That's aksara rekan."
        note:
          ar_eg: "ꦢ꦳ꦶꦏꦶꦂ = dzikir. aksara rekan = حروف للأصوات العربي، بيتحطّ عليها cecak telu ꦳ (تلات نقط). ꦏ꦳ = خ، ꦢ꦳ = ذ، ꦥ꦳ = ف، ꦗ꦳ = ز، ꦒ꦳ = غ. كلمات: da = أسماء حروف جاوية؛ nginggil = فوق (كراما)."
          ar: "ꦢ꦳ꦶꦏꦶꦂ = dzikir. aksara rekan = حروف للأصوات العربية، توضع عليها cecak telu ꦳ (ثلاث نقاط). ꦏ꦳ = خ، وꦢ꦳ = ذ، وꦥ꦳ = ف، وꦗ꦳ = ز، وꦒ꦳ = غ. مفردات: da = أسماء حروف جاوية؛ nginggil = فوق (كراما)."
          en: "ꦢ꦳ꦶꦏꦶꦂ = dzikir. aksara rekan = letters for Arabic sounds, marked with cecak telu ꦳ (three dots). ꦏ꦳ = kh, ꦢ꦳ = dz, ꦥ꦳ = f, ꦗ꦳ = z, ꦒ꦳ = gh. Words: da = names of Javanese letters; nginggil = above, on top (krama)."
      - speaker: Karim
        text: Telung titik! Kados ing basa Arab!
        ar_eg: تلات نقط! زي العربي بالظبط!
        ar: ثلاث نقاط! تمامًا كالعربية!
        en: Three dots! Just like Arabic!
        note:
          ar_eg: "كلمات: titik = نقطة."
          ar: "مفردات: titik = نقطة."
          en: "Words: titik = dot, point; full stop."
      - speaker: Pak Harjo
        text: Lan tembung "kabar" ugi saking basa Arab, Nak. Khabar.
        ar_eg: وكلمة «kabar» برضه جاية من العربي يا ابني. «خبر».
        ar: وكلمة «kabar» أيضًا من العربية يا بنيّ. «خبر».
        en: And the word "kabar" comes from Arabic too, my boy. Khabar.
      - speaker: Pak Harjo
        text: Menawi badhe nedahaken swanten Arab, ka dipunparingi cecak telu. Nanging tiyang Jawa ngucap "kabar", mila limrahipun ka biasa kemawon.
        ar_eg: لو عايز توضّح الصوت العربي، تكتبها بالـkha اللي فوقها تلات نقط. بس الجاويين بيقولوا «kabar»، فالعادي إنها تتكتب بالـka العادية.
        ar: إن أردت إظهار الصوت العربيّ كتبتها بالـkha ذات النقاط الثلاث. لكنّ الجاويّين يقولون «kabar»، فالمعتاد أن تُكتب بالـka العادية.
        en: If you want to show the Arabic sound, ka gets the three dots (ꦏ꦳ꦧꦂ). But Javanese people say "kabar", so it's usually written with a plain ka (ꦏꦧꦂ).
        note:
          ar_eg: "كلمات: biasa = عادي؛ dipunparingi = اتدّاله (كراما)؛ nedahaken = بيشاور على، بيوضّح (كراما)."
          ar: "مفردات: biasa = عادي، معتاد؛ dipunparingi = أُعطي (كراما)؛ nedahaken = يشير إلى، يُظهر (كراما)."
          en: "Words: biasa = usual, ordinary, normal; dipunparingi = was given (krama); nedahaken = to show, mark (krama)."
      - speaker: Karim
        text: Kabar! Kula sampun mbekta kabar saking Mesir ngantos Imogiri.
        ar_eg: خبر! أنا جبت «خبر» من مصر لحدّ إيموجيري.
        ar: خبر! لقد حملت «خبرًا» من مصر حتى إيموجيري.
        en: Kabar! I've carried news all the way from Egypt to Imogiri.
      - speaker: Narrator
        text: Ing kaca telung puluh enem, Karim nulis patang atus sanga, Sultan, dzikir, lan khabar nganggo aksara Jawa. Basa Jawa ora adoh saka basa Arab.
        ar_eg: في صفحة ستّة وتلاتين، كريم كتب ٤٠٩ و«سلطان» و«ذكر» و«خبر». الجاوي مش بعيد عن العربي.
        ar: في الصفحة السادسة والثلاثين كتب كريم ٤٠٩ و«سلطان» و«ذكر» و«خبر». ليست الجاوية بعيدة عن العربية.
        en: On page thirty-six, Karim writes 409, Sultan, dzikir and khabar in Javanese script (꧇꧔꧐꧙꧇, ꦯꦸꦭ꧀ꦠꦤ꧀, ꦢ꦳ꦶꦏꦶꦂ, ꦏ꦳ꦧꦂ). Javanese isn't far from Arabic.
        note:
          ar_eg: "كلمات: patang = أربع (قبل كلمة)."
          ar: "مفردات: patang = أربعة (قبل الاسم)."
          en: "Words: patang = four (before a noun)."
