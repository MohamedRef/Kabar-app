questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: ꧇꧔꧐꧙꧇ يعني كام؟
      ar: كم يساوي ꧇꧔꧐꧙꧇؟
      en: What number is ꧇꧔꧐꧙꧇?
    options: ["409", "490", "904"]
    answer: 0
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: الـaksara murda بتستخدم لإيه؟
      ar: فيمَ تُستخدم الـaksara murda؟
      en: What is aksara murda used for?
    options: ["swanten Arab", "nami tiyang ingkang dipunurmati", "angka"]
    answer: 1
  - id: q03
    type: fill_blank
    sentence: Aksara da mawi cecak ___ ing nginggil, dados "dz".
    meaning:
      ar_eg: حرف الـda وفوقه تلات نقط، يبقى «ذ».
      ar: حرف الـda وفوقه ثلاث نقاط، فيصير «ذ».
      en: The letter da with three dots on top becomes "dz".
    answers: [telu]
    options: ["telu", "loro", "siji"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: ليه «kabar» عادةً بتتكتب ꦏꦧꦂ مش ꦏ꦳ꦧꦂ؟
      ar: لماذا تُكتب «kabar» عادةً ꦏꦧꦂ لا ꦏ꦳ꦧꦂ؟
      en: Why is "kabar" usually written ꦏꦧꦂ, not ꦏ꦳ꦧꦂ?
    options: ["tiyang Jawa ngucap kabar", "ꦏ꦳ punika murda", "mboten wonten rekan"]
    answer: 0
  - id: q05
    type: translate
    direction: from_target
    source_text: Kula abdi dalem, njagi makam para raja.
    answers_meaning:
      ar_eg: ["أنا من خدّام القصر، بحرس مقابر الملوك.", "أنا خدّام القصر وبحرس مقابر الملوك."]
      ar: ["أنا من خدم القصر، أحرس مقابر الملوك."]
      en: ["I'm a court servant, I keep the kings' tombs.", "I serve the court and guard the royal tombs."]
next:
  ar_eg: آخر حلقة في الموسم. في معهد ديني في پليريد، پاك كياي بيورّي كريم مخطوطة جاوي مكتوبة بالحروف العربي - الـPegon. لأول مرّة في الرحلة، كريم بيقرا الجاوي بحروف يعرفها من وهو صغيّر... ومكالمة فيديو مع كل صحابه من جوجا لماديون.
  ar: الحلقة الأخيرة من الموسم. في معهد دينيّ في بليريد، يُري باك كياي كريمًا مخطوطة جاوية مكتوبة بالحروف العربية - الـPegon. لأوّل مرّة في الرحلة يقرأ كريم الجاوية بحروف يعرفها منذ صغره... ومكالمة فيديو مع كلّ أصدقائه من جوغجا إلى ماديون.
  en: The season finale. At a pesantren in Plered, Pak Kyai shows Karim a Javanese manuscript written in Arabic letters - Pegon. For the first time on the journey, Karim reads Javanese in letters he's known since childhood... and a video call with all his friends from Jogja to Madiun.
