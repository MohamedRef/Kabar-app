title:
  target: Dengan Demikian
  ar_eg: وبناءً على ده
  ar: وبناءً على ذلك
  en: It May Therefore Be Concluded
summary:
  ar_eg: في بيراستاجي، تحت بركان سينابونج، الدكتورة لاكشمي بتقرا أول ورقة بحثية لبايو - عن ثقافة الوارونج - وبتعلّمه الفرق بين النقل وإعادة الصياغة. وبالليل ساري وكريم بيقرّروا هيعيشوا فين، وبايو بيحوّل القرار لفقرة أكاديمية. وفي الآخر، إعلان صغيّر بيشاور على پاپوا.
  ar: في بيراستاغي، تحت بركان سينابونغ، تقرأ الدكتورة لاكشمي أوّل ورقة بحثية لبايو - عن ثقافة الوارونغ - وتعلّمه الفرق بين النقل وإعادة الصياغة. وفي المساء يقرّر ساري وكريم أين يعيشان، فيحوّل بايو القرار إلى فقرة أكاديمية. وفي النهاية يشير إعلان صغير إلى بابوا.
  en: In Berastagi, beneath Mount Sinabung, Bu Laksmi reads Bayu's first academic paper - on warung culture - and teaches him the difference between copying and paraphrasing. That night Sari and Karim decide where to live, and Bayu turns the decision into an academic paragraph. At the very end, a small announcement points to Papua.
cast: [Bu Laksmi, Bayu, Kak Tiur, Sari, Karim, Pak Budi]
scenes:
  - setting:
      ar_eg: بيراستاجي، في هضبة كارو جنب ميدان، في رحلة ميدانية للكلّية. من شبّاك الكافيه باين جبل سينابونج - بركان نشط صحي سنة ٢٠١٠ بعد حوالي أربعمية سنة نوم. بايو وكاك تيور قاعدين مع الدكتورة لاكشمي.
      ar: بيراستاغي في هضبة كارو قرب ميدان، في رحلة ميدانية للكلّية. من نافذة المقهى يظهر جبل سينابونغ، البركان النشط الذي استيقظ عام ٢٠١٠ بعد نحو أربعة قرون من الخمود. يجلس بايو وكاك تيور مع الدكتورة لاكشمي.
      en: Berastagi, in the Karo highlands near Medan, on a faculty field trip. From the café window you can see Mount Sinabung - an active volcano that woke in 2010 after some four hundred years asleep. Bayu and Kak Tiur sit with Bu Laksmi, his lecturer.
    lines:
      - speaker: Bu Laksmi
        text: Bayu, saya sudah membaca draf makalahmu tentang budaya warung. Isinya menarik. Tapi ada satu masalah besar.
        ar_eg: يا بايو، أنا قريت المسودّة بتاعة ورقتك عن ثقافة الوارونج. محتواها حلو. بس فيه مشكلة كبيرة.
        ar: يا بايو، قرأت مسودّة ورقتك عن ثقافة الوارونغ. محتواها شائق، لكن فيها مشكلة كبيرة.
        en: Bayu, I've read the draft of your paper on warung culture. The content is interesting. But there's one big problem.
      - speaker: Bu Laksmi
        text: Paragraf keduamu. Kalimat-kalimatnya sama persis dengan sebuah artikel di internet. Itu plagiarisme, walaupun kamu tidak sengaja.
        ar_eg: الفقرة التانية بتاعتك. جملها هي هي جمل مقالة على النت بالحرف. ده انتحال، حتى لو انت مكنتش تقصد.
        ar: فقرتك الثانية - جملها مطابقة حرفيًّا لمقالة على الإنترنت. هذا انتحال، وإن لم تتعمّده.
        en: Your second paragraph. Its sentences are exactly the same as an article online. That's plagiarism, even if you didn't mean it.
      - speaker: Bayu
        text: Tapi saya sudah mencantumkan sumbernya di daftar pustaka, Bu.
        ar_eg: بس أنا كاتب المصدر في قايمة المراجع يا دكتورة.
        ar: لكنّي أدرجت المصدر في قائمة المراجع يا دكتورة.
        en: But I listed the source in the bibliography, Bu.
      - speaker: Bu Laksmi
        text: Mencantumkan sumber saja tidak cukup. Kalau kamu mengutip langsung, pakai tanda kutip. Kalau tidak, kamu harus memparafrasakan, yaitu menulis ulang idenya dengan kalimatmu sendiri.
        ar_eg: إنك تكتب المصدر بس مش كفاية. لو بتنقل الكلام زي ما هو، حطّه بين علامات تنصيص. لو لأ، لازم تعيد صياغته - يعني تكتب الفكرة من جديد بجملك انت.
        ar: لا يكفي إدراج المصدر. فإن نقلت النصّ حرفيًّا فضعه بين علامتي تنصيص، وإلّا فعليك أن تعيد صياغته، أي أن تكتب الفكرة من جديد بعباراتك.
        en: Listing the source isn't enough. If you quote directly, use quotation marks. If not, you have to paraphrase - rewrite the idea in your own sentences.
        note:
          ar_eg: kutipan langsung (اقتباس مباشر) بيبقى بين علامات تنصيص. parafrasa (إعادة صياغة) فكرة الكاتب بكلامك انت - ومع ذلك لازم تذكر المصدر. ده نفس الكلام في الجامعات المصرية - «النقل من غير توثيق» سرقة علمية.
          ar: الاقتباس المباشر (kutipan langsung) يوضع بين علامتي تنصيص، وإعادة الصياغة (parafrasa) نقل فكرة الكاتب بعباراتك مع ذكر المصدر أيضًا. وهو المبدأ نفسه في الجامعات العربية - النقل دون توثيق سرقة علمية.
          en: A direct quote (kutipan langsung) goes in quotation marks; a paraphrase (parafrasa) puts the author's idea in your own words - and still names the source.
      - speaker: Kak Tiur
        text: Dek, coba parafrasakan satu kalimat sekarang. Biar Bu Laksmi dengar.
        ar_eg: يا صغيّر، جرّب تعيد صياغة جملة واحدة دلوقتي. خلّي الدكتورة تسمع.
        ar: يا صغيري، جرّب أن تعيد صياغة جملة واحدة الآن لتسمعها الدكتورة لاكشمي.
        en: Kid, try paraphrasing one sentence right now. Let Bu Laksmi hear it.
      - speaker: Bayu
        text: Baik. Menurut Geertz (1963), ekonomi pasar di sebuah kota kecil di Jawa Timur sangat bergantung pada hubungan pribadi antara pedagang dan pembeli.
        ar_eg: ماشي. حسب جيرتز (١٩٦٣)، اقتصاد السوق في مدينة صغيّرة في جاوة الشرقية بيعتمد جدًا على العلاقات الشخصية بين البيّاع والزبون.
        ar: حسنًا. يرى غيرتز (١٩٦٣) أنّ اقتصاد السوق في بلدة صغيرة بجاوة الشرقية يعتمد اعتمادًا كبيرًا على العلاقات الشخصية بين التاجر والمشتري.
        en: All right. According to Geertz (1963), the market economy of a small town in East Java depends heavily on personal relationships between traders and buyers.
        note:
          ar_eg: كليفورد جيرتز عالم أنثروبولوجيا أمريكي، درس في الخمسينات مدينة صغيّرة في جاوة الشرقية سمّاها «موجوكوتو»، وكتب عن تجّارها كتاب «Peddlers and Princes» سنة ١٩٦٣. ولاحظ طريقة الإسناد - Menurut + اسم المؤلّف (السنة).
          ar: كليفورد غيرتز عالم أنثروبولوجيا أمريكي درس في الخمسينيات بلدة صغيرة في جاوة الشرقية سمّاها «موجوكوتو»، وكتب عن تجّارها كتاب «Peddlers and Princes» عام ١٩٦٣. ولاحظ صيغة الإسناد - Menurut + اسم المؤلّف (السنة).
          en: Clifford Geertz, an American anthropologist, studied a small East Java town he called "Modjokuto" in the 1950s and wrote about its traders in Peddlers and Princes (1963). Note the citation frame - Menurut + author (year).
      - speaker: Bu Laksmi
        text: Bagus. Itu parafrasa. Sekarang hubungkan dengan data wawancaramu.
        ar_eg: برافو. دي إعادة صياغة. دلوقتي اربطها ببيانات المقابلات بتاعتك.
        ar: أحسنت. هذه إعادة صياغة. والآن اربطها ببيانات مقابلاتك.
        en: Good. That's a paraphrase. Now link it to your interview data.
      - speaker: Bayu
        text: Selain itu, hasil wawancara saya menunjukkan hal yang serupa. Seorang pemilik warung di Madiun menyatakan bahwa pelanggannya datang "bukan karena pecelnya paling murah, tetapi karena mereka merasa dikenal."
        ar_eg: وكمان، نتايج المقابلات بتاعتي بتورّي حاجة شبه كده. صاحب وارونج في ماديون قال إن زباينه بييجوا «مش عشان البيچيل بتاعه أرخص حاجة، لكن عشان حاسّين إنه عارفهم.»
        ar: فضلًا عن ذلك، تُظهر نتائج مقابلاتي أمرًا مشابهًا؛ إذ صرّح صاحب وارونغ في ماديون بأنّ زبائنه يأتون «لا لأنّ البيتشيل عنده الأرخص، بل لأنهم يشعرون بأنه يعرفهم.»
        en: In addition, my interview results show something similar. A warung owner in Madiun stated that his customers come "not because his pecel is the cheapest, but because they feel known."
        note:
          ar_eg: الكتابة الأكاديمية بتحبّ أدوات الربط - Selain itu (كمان / علاوة على ده)، Namun (لكن)، Oleh karena itu (عشان كده)، Dengan demikian (وبناءً عليه). والكلام المنقول بيتقال بـ menyatakan bahwa (صرّح بإنّ) أو mengatakan bahwa (قال إنّ).
          ar: تكثر في الكتابة الأكاديمية أدوات الربط - Selain itu (فضلًا عن ذلك)، Namun (غير أنّ)، Oleh karena itu (لذلك)، Dengan demikian (وبناءً عليه). ويُنقل الكلام بـ menyatakan bahwa (صرّح بأنّ) أو mengatakan bahwa (قال إنّ).
          en: 'Academic writing loves connectors: Selain itu (in addition), Namun (however), Oleh karena itu (therefore), Dengan demikian (thus). Reported speech uses menyatakan bahwa (stated that) or mengatakan bahwa (said that).'
      - speaker: Kak Tiur
        text: Pemilik warung itu bapakmu, kan?
        ar_eg: صاحب الوارونج ده أبوك، صح؟
        ar: صاحب الوارونغ هذا أبوك، أليس كذلك؟
        en: That warung owner is your dad, isn't he?
      - speaker: Bayu
        text: Dalam makalah akademik, namanya "Informan B".
        ar_eg: في الورقة الأكاديمية اسمه «المصدر ب».
        ar: في الورقة الأكاديمية اسمه «المُخبِر ب».
        en: In an academic paper, he's "Informant B".
      - speaker: Bu Laksmi
        text: Namun, hati-hati. Kalau informannya ayahmu sendiri, kamu harus menuliskannya di bagian metode. Itu namanya kejujuran ilmiah.
        ar_eg: بس خلّي بالك. لو المصدر بتاعك أبوك نفسه، لازم تكتب ده في جزء المنهجية. ده اسمه أمانة علمية.
        ar: لكن احذر. إن كان مخبرك أباك نفسه فعليك أن تذكر ذلك في قسم المنهجية. هذه هي الأمانة العلمية.
        en: However, be careful. If your informant is your own father, you have to say so in the methods section. That's called academic honesty.
      - speaker: Bayu
        text: 'Oleh karena itu, Bu, saya akan menambahkan satu kalimat. "Peneliti adalah anak Informan B, dan sudah makan pecelnya selama delapan belas tahun."'
        ar_eg: عشان كده يا دكتورة، هضيف جملة واحدة. «الباحث ابن المصدر ب، وبياكل البيچيل بتاعه من تمنتاشر سنة.»
        ar: لذلك يا دكتورة سأضيف جملة واحدة - «الباحث ابنُ المُخبِر ب، وقد أكل البيتشيل الذي يصنعه طوال ثمانية عشر عامًا.»
        en: Therefore, Bu, I'll add one sentence. "The researcher is the son of Informant B, and has eaten his pecel for eighteen years."
      - speaker: Bu Laksmi
        text: Dengan demikian, makalahmu jujur... dan bikin lapar.
        ar_eg: وبناءً على ده، ورقتك أمينة... وبتجوّع.
        ar: وبناءً على ذلك، ورقتك أمينة... وتفتح الشهيّة.
        en: It may therefore be concluded that your paper is honest... and makes people hungry.
  - setting:
      ar_eg: نفس الليلة، مكالمة فيديو. ساري وكريم في شقّتهم الصغيّرة في باليكپاپان - عدّى شهر على الجواز. پاك بودي وبو راهايو في ماديون، وبايو في الأوضة بتاعته في ميدان.
      ar: الليلة نفسها، اتصال مرئي. ساري وكريم في شقّتهما الصغيرة في باليكبابان بعد شهر من الزواج، وباك بودي وبو راهايو في ماديون، وبايو في غرفته بميدان.
      en: That evening, a video call. Sari and Karim are in their little flat in Balikpapan, a month after the wedding. Pak Budi and Bu Rahayu are in Madiun, and Bayu is in his room in Medan.
    lines:
      - speaker: Sari
        text: Pak, Bu, kami sudah berdiskusi. Kantor saya di Balikpapan menawarkan kontrak dua tahun lagi.
        ar_eg: بابا، ماما، احنا اتناقشنا. الشغل بتاعي في باليكپاپان عرض عليّا عقد سنتين كمان.
        ar: أبي، أمي، تناقشنا. عرض عليّ مكتبي في باليكبابان تجديد العقد عامين آخرين.
        en: Dad, Mum, we've talked it over. My office in Balikpapan has offered me another two-year contract.
      - speaker: Karim
        text: Dan kantor Sari membutuhkan pemandu untuk tamu-tamu dari Timur Tengah. Mereka menawari saya pekerjaan.
        ar_eg: وشركة ساري محتاجة مرشد للضيوف اللي جايين من الشرق الأوسط. وعرضوا عليّا الشغل.
        ar: وتحتاج شركة ساري إلى مرشد لضيوفها القادمين من الشرق الأوسط، وقد عرضوا عليّ الوظيفة.
        en: And Sari's company needs a guide for its visitors from the Middle East. They've offered me the job.
      - speaker: Bayu
        text: Tunggu, tunggu. Ini harus dibahas secara akademik. Pertama, argumen untuk Balikpapan.
        ar_eg: استنّوا، استنّوا. ده لازم يتناقش بطريقة أكاديمية. أولًا، الحجج اللي في صالح باليكپاپان.
        ar: مهلًا، مهلًا. يجب أن يُناقَش هذا أكاديميًّا. أوّلًا، الحجج المؤيّدة لباليكبابان.
        en: Wait, wait. This needs an academic discussion. First, the arguments for Balikpapan.
      - speaker: Sari
        text: Pekerjaan kami berdua ada di sana. Selain itu, penerbangan ke Surabaya hanya sekitar satu setengah jam.
        ar_eg: شغلنا احنا الاتنين هناك. وكمان، الطيارة لسورابايا ساعة ونص بس تقريبًا.
        ar: عمل كلينا هناك. فضلًا عن ذلك، الرحلة الجوّية إلى سورابايا لا تتجاوز ساعة ونصفًا تقريبًا.
        en: Both our jobs are there. In addition, the flight to Surabaya is only about an hour and a half.
      - speaker: Bayu
        text: Argumen untuk Madiun?
        ar_eg: والحجج اللي في صالح ماديون؟
        ar: والحجج المؤيّدة لماديون؟
        en: Arguments for Madiun?
      - speaker: Pak Budi
        text: Pecel. Dan Bapak.
        ar_eg: البيچيل. وأنا.
        ar: البيتشيل. وأنا.
        en: Pecel. And me.
      - speaker: Bayu
        text: Argumen untuk Kairo?
        ar_eg: والحجج اللي في صالح القاهرة؟
        ar: والحجج المؤيّدة للقاهرة؟
        en: Arguments for Cairo?
      - speaker: Karim
        text: Ayah dan ibu saya, Nadia, dan Hagga Fatma, yang setiap minggu bertanya kapan Sari pulang ke Kairo.
        ar_eg: أبويا وأمّي، ونادية، والحاجّة فاطمة اللي كل أسبوع بتسأل ساري راجعة القاهرة إمتى.
        ar: أبي وأمي ونادية والحاجّة فاطمة التي تسأل كلّ أسبوع متى تعود ساري إلى القاهرة.
        en: My father and mother, Nadia, and Hagga Fatma, who asks every week when Sari's coming home to Cairo.
      - speaker: Sari
        text: Namun demikian, kami masih muda, dan kami ingin membangun sesuatu di Indonesia dulu. Oleh karena itu, kami memilih Balikpapan, untuk dua tahun.
        ar_eg: ومع ذلك، احنا لسه صغيّرين، وعايزين نبني حاجة في إندونيسيا الأول. عشان كده اخترنا باليكپاپان، لمدّة سنتين.
        ar: ومع ذلك، ما زلنا شابّين ونريد أن نبني شيئًا في إندونيسيا أوّلًا. لذلك اخترنا باليكبابان لمدّة عامين.
        en: Nevertheless, we're still young, and we want to build something in Indonesia first. Therefore, we've chosen Balikpapan, for two years.
      - speaker: Karim
        text: Setelah itu, kita lihat lagi. Tapi janji Bapak, Lebaran di Kairo, tetap akan kami tagih.
        ar_eg: وبعدها نشوف. بس وعد بابا - العيد في القاهرة - هنفضل نطالبه بيه.
        ar: وبعد ذلك ننظر في الأمر من جديد. لكنّنا سنظلّ نطالب أبي بوعده - العيد في القاهرة.
        en: After that, we'll see. But we're still holding Dad to his promise - Lebaran in Cairo.
      - speaker: Bayu
        text: Dengan demikian, dapat disimpulkan bahwa keluarga ini tersebar di tiga pulau dan dua benua, tetapi tetap dalam satu grup WhatsApp.
        ar_eg: وبناءً على ده، نقدر نستنتج إن العيلة دي متوزّعة على تلات جزر وقارّتين، بس لسه في جروب واتساب واحد.
        ar: وبناءً على ذلك، يمكن الاستنتاج بأنّ هذه الأسرة موزّعة على ثلاث جزر وقارّتين، لكنها ما زالت في مجموعة واتساب واحدة.
        en: It may therefore be concluded that this family is spread over three islands and two continents, yet remains in one WhatsApp group.
        note:
          ar_eg: Dengan demikian, dapat disimpulkan bahwa... (وبناءً عليه يمكن استنتاج إنّ...) أشهر جملة في آخر أي فقرة أكاديمية إندونيسية. والتلات جزر هم - جاوة (ماديون)، وسومطرة (ميدان)، وكاليمانتان (باليكپاپان).
          ar: Dengan demikian, dapat disimpulkan bahwa... (وبناءً عليه يمكن الاستنتاج بأنّ...) أشهر عبارة لختام الفقرة الأكاديمية الإندونيسية. والجزر الثلاث هي جاوة (ماديون) وسومطرة (ميدان) وكاليمانتان (باليكبابان).
          en: Dengan demikian, dapat disimpulkan bahwa... ("it may therefore be concluded that...") is the classic way to close an Indonesian academic paragraph. The three islands are Java (Madiun), Sumatra (Medan) and Borneo (Balikpapan).
      - speaker: Narrator
        text: 'Setelah panggilan selesai, HP Bayu berbunyi. Ada pengumuman dari kampus: "Program Fellowship Jurnalis Muda. Penempatan di Sorong, Papua."'
        ar_eg: بعد ما المكالمة خلصت، موبايل بايو رنّ. إعلان من الجامعة - «برنامج زمالة الصحفيين الشباب. مكان التدريب - سورونج، پاپوا.»
        ar: بعد انتهاء الاتصال رنّ هاتف بايو. إعلان من الجامعة - «برنامج زمالة الصحفيين الشباب. مكان التعيين - سورونغ، بابوا.»
        en: 'After the call ends, Bayu''s phone pings. An announcement from the university: "Young Journalists Fellowship Programme. Placement: Sorong, Papua."'
      - speaker: Bayu
        text: Papua... "Dari Sabang sampai Merauke." Aku sudah sampai di dekat Sabang. Sekarang giliran Merauke.
        ar_eg: پاپوا... «من سابانج لميراوكي.» أنا وصلت جنب سابانج خلاص. دلوقتي دور ميراوكي.
        ar: بابوا... «من سابانغ إلى ميراوكي.» لقد بلغتُ جوار سابانغ، والآن جاء دور ميراوكي.
        en: Papua... "From Sabang to Merauke." I've already made it near Sabang. Now it's Merauke's turn.
        note:
          ar_eg: «Dari Sabang sampai Merauke» (من سابانج لميراوكي) جملة من أغنية وطنية مشهورة، ومعناها «إندونيسيا كلّها». سابانج جزيرة في آتشيه في أقصى الغرب، وميراوكي في پاپوا في أقصى الشرق - المسافة بينهم أكتر من خمس آلاف كيلو.
          ar: «Dari Sabang sampai Merauke» (من سابانغ إلى ميراوكي) عبارة من أغنية وطنية شهيرة تعني «إندونيسيا كلّها». فسابانغ جزيرة في آتشيه في أقصى الغرب، وميراوكي في بابوا في أقصى الشرق، وبينهما أكثر من خمسة آلاف كيلومتر.
          en: '"Dari Sabang sampai Merauke" (from Sabang to Merauke), a line from a well-known patriotic song, means "all of Indonesia". Sabang is an island off Aceh in the far west; Merauke is in Papua in the far east - more than 5,000 km apart.'
