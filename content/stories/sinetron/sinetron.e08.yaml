series: sinetron
episode: 8
language: id
level: bipa1
unlock_after: bipa1.u08
title:
  target: Yang Mana Karim?
  ar_eg: أنهو فيهم كريم؟
  ar: أيّهم كريم؟
  en: Which One Is Karim?
summary:
  ar_eg: نادية بتوصف أخوها كريم لپاك بودي وماس جوكو. يوم الأحد الوارونج زحمة، وماس جوكو بيخمّن غلط أكتر من مرة.
  ar: تصف نادية أخاها كريم لباك بودي وماس جوكو. ويوم الأحد يزدحم الوارونغ، فيخطئ ماس جوكو في التخمين أكثر من مرة.
  en: Nadia describes her brother Karim to Pak Budi and Mas Joko. On Sunday the warung is packed, and Mas Joko keeps guessing wrong.
cast: [Pak Budi, Nadia, Sari, Mas Joko, Karim]
scenes:
  - setting:
      ar_eg: مكالمة فيديو بين القاهرة والوارونج، قبل زيارة كريم بيوم.
      ar: اتصال مرئي بين القاهرة والوارونغ، قبل زيارة كريم بيوم.
      en: A video call between Cairo and the warung, the day before Karim's visit.
    lines:
      - speaker: Pak Budi
        text: Nadia, Karim orangnya bagaimana?
        ar_eg: يا نادية، كريم شكله وطبعه عامل إزاي؟
        ar: يا نادية، كيف هو كريم؟
        en: Nadia, what's Karim like?
        note:
          ar_eg: «orangnya bagaimana?» حرفيًا «الشخص عامل إزاي؟»، بتسأل عن الطبع والشكل مع بعض.
          ar: «orangnya bagaimana?» حرفيًا «كيف هو كشخص؟»، ويُسأل بها عن الطباع والمظهر معًا.
          en: '"orangnya bagaimana?" is literally "how is he as a person?" — it asks about character and looks.'
      - speaker: Nadia
        text: Dia tinggi, rambutnya pendek, dan dia pakai kacamata.
        ar_eg: هو طويل، وشعره قصير، ولابس نضارة.
        ar: هو طويل، شعره قصير، ويضع نظارة.
        en: He's tall, his hair is short, and he wears glasses.
      - speaker: Nadia
        text: Dia ramah dan pintar, tapi agak pendiam.
        ar_eg: هو لطيف وذكي، بس هادي شوية.
        ar: هو ودود وذكي، لكنه هادئ بعض الشيء.
        en: He's friendly and smart, but a bit quiet.
      - speaker: Sari
        text: Dan Karim bukan orang Indonesia, Pak. Dia orang Mesir!
        ar_eg: وكريم مش إندونيسي يا بابا. هو مصري!
        ar: وكريم ليس إندونيسيًا يا أبي. إنه مصري!
        en: And Karim isn't Indonesian, Dad. He's Egyptian!
        note:
          ar_eg: bukan قدّام الأسماء (orang Indonesia)، وtidak قدّام الأفعال والصفات (tidak tinggi).
          ar: bukan قبل الأسماء (orang Indonesia)، وtidak قبل الأفعال والصفات (tidak tinggi).
          en: bukan negates nouns (orang Indonesia); tidak negates verbs and adjectives (tidak tinggi).
      - speaker: Mas Joko
        text: Gampang, Pak! Di Madiun orang Mesir sedikit!
        ar_eg: سهلة يا پاك! المصريين في ماديون قليلين!
        ar: سهل يا باك! المصريون في ماديون قليلون!
        en: Easy, Pak! There aren't many Egyptians in Madiun!
  - setting:
      ar_eg: يوم الأحد في الوارونج. زحمة، وماس جوكو بيراقب الباب.
      ar: يوم الأحد في الوارونغ. ازدحام، وماس جوكو يراقب الباب.
      en: Sunday at the warung. It's busy, and Mas Joko keeps watching the door.
    lines:
      - speaker: Narrator
        text: Hari Minggu. Warung Pak Budi ramai.
        ar_eg: يوم الأحد. وارونج پاك بودي زحمة.
        ar: يوم الأحد. وارونغ باك بودي مزدحم.
        en: Sunday. Pak Budi's warung is busy.
      - speaker: Mas Joko
        text: Pak! Itu Karim? Yang tinggi itu!
        ar_eg: يا پاك! ده كريم؟ الطويل ده!
        ar: يا باك! أهذا كريم؟ ذلك الطويل!
        en: Pak! Is that Karim? The tall one!
      - speaker: Pak Budi
        text: Bukan, Mas. Itu Pak Hadi. Dia tidak pakai kacamata.
        ar_eg: لأ يا ماس. ده پاك هادي. ده مش لابس نضارة.
        ar: لا يا ماس. ذاك باك هادي، وهو لا يضع نظارة.
        en: No, Mas. That's Pak Hadi. He doesn't wear glasses.
      - speaker: Mas Joko
        text: Yang pakai kacamata itu? Yang rambutnya pendek?
        ar_eg: طب اللي لابس نضارة؟ اللي شعره قصير؟
        ar: إذن ذاك الذي يضع نظارة؟ ذو الشعر القصير؟
        en: The one with glasses, then? The one with short hair?
      - speaker: Pak Budi
        text: Bukan! Itu Bu Tini. Dia perempuan, Mas!
        ar_eg: لأ! دي بو تيني. دي ست يا ماس!
        ar: لا! تلك بو تيني. إنها امرأة يا ماس!
        en: No! That's Bu Tini. She's a woman, Mas!
      - speaker: Karim
        text: Permisi. Asalamualaikum. Ini warung Pak Budi?
        ar_eg: لو سمحت. السلام عليكم. ده وارونج پاك بودي؟
        ar: عن إذنكم. السلام عليكم. هل هذا وارونغ باك بودي؟
        en: Excuse me. Assalamu alaikum. Is this Pak Budi's warung?
      - speaker: Pak Budi
        text: Waalaikumsalam! Betul, saya Budi. Mas Karim?
        ar_eg: وعليكم السلام! أيوه، أنا بودي. انت كريم؟
        ar: وعليكم السلام! نعم، أنا بودي. هل أنت كريم؟
        en: Wa alaikum salam! That's right, I'm Budi. Karim?
      - speaker: Karim
        text: Betul, Pak. Saya Karim, kakak Nadia.
        ar_eg: أيوه يا پاك. أنا كريم، أخو نادية.
        ar: نعم يا باك. أنا كريم، أخو نادية.
        en: That's right, Pak. I'm Karim, Nadia's brother.
      - speaker: Mas Joko
        text: Tinggi, pakai kacamata... tapi rambutnya panjang!
        ar_eg: طويل، ولابس نضارة... بس شعره طويل!
        ar: طويل، ويضع نظارة... لكنّ شعره طويل!
        en: Tall, glasses... but his hair is long!
      - speaker: Karim
        text: Maaf! Saya sibuk di Surabaya. Rambut saya panjang sekarang.
        ar_eg: معلش! كنت مشغول في سورابايا. شعري طوّل دلوقتي.
        ar: عذرًا! كنت مشغولًا في سورابايا، وشعري طويل الآن.
        en: Sorry! I've been busy in Surabaya. My hair's long now.
      - speaker: Pak Budi
        text: Tidak apa-apa! Selamat datang, Mas Karim. Silakan duduk.
        ar_eg: ولا يهمك! أهلًا بيك يا كريم. اتفضل اقعد.
        ar: لا بأس! أهلًا بك يا كريم. تفضّل بالجلوس.
        en: No problem! Welcome, Karim. Please, have a seat.
new_words:
  - word: gampang
    pos: adjective
    ar_eg: سهل (عامية)
    ar: سهل (عامي)
    en: easy (casual)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: نادية قالت إيه عن شعر كريم؟
      ar: ماذا قالت نادية عن شعر كريم؟
      en: What did Nadia say about Karim's hair?
    options: ["merah", "pendek", "panjang"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Karim ___ orang Indonesia. Dia orang Mesir.
    meaning:
      ar_eg: كريم مش إندونيسي. هو مصري.
      ar: كريم ليس إندونيسيًا. إنه مصري.
      en: Karim isn't Indonesian. He's Egyptian.
    answers: [bukan]
    options: ["bukan", "belum", "tidak"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: كريم طبعه إيه؟
      ar: ما طباع كريم؟
      en: What is Karim like?
    options: ["lucu, tapi tidak ramah", "malas dan pendiam", "ramah, pintar, agak pendiam"]
    answer: 2
  - id: q04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هو لابس نضارة.
      ar: هو يضع نظارة.
      en: He wears glasses.
    answers: ["Dia pakai kacamata.", "Dia pakai kacamata", "Dia memakai kacamata.", "Dia memakai kacamata"]
next:
  ar_eg: كريم داق الپيتشل... بس بعدين عايز يروح الجامع يصلّي الضهر. إزاي هيوصل؟
  ar: تذوّق كريم البيتشل... ثم أراد الذهاب إلى المسجد لصلاة الظهر. كيف سيصل؟
  en: Karim tries the pecel... then wants to go to the mosque for the noon prayer. How will he get there?
