title:
  target: Satu Mangkuk, Banyak Bangsa
  ar_eg: طبق واحد وشعوب كتير
  ar: وعاء واحد وشعوب كثيرة
  en: One Bowl, Many Peoples
summary:
  ar_eg: الفجر في السوق العايم في لوك باينتان. ساري بتشتري كيك من مركب، وفجأة كريم بيطلعلها من المركب اللي جنبها - جاي إندونيسيا عشان الشغل، ونادية قالتله هي فين. بعد كده، على طبق سوتو بانجار، كريم بيدوق كل حاجة... وبيقول إن عنده حاجة عايز يقولها لپاك بودي.
  ar: الفجر في سوق لوك باينتان العائم. تشتري ساري كعكًا من قارب، وفجأة يظهر لها كريم من القارب المجاور - جاء إلى إندونيسيا للعمل، وأخبرته نادية بمكانها. ثمّ على وعاء من سوتو بانجار يتذوّق كريم كلّ شيء... ويقول إنّ لديه أمرًا يريد أن يقوله لباك بودي.
  en: Dawn at the Lok Baintan floating market. Sari is buying cakes from a boat when Karim pops up in the boat next to her - he's in Indonesia for work, and Nadia told him where she'd be. Later, over soto Banjar, Karim tastes everything... and says there's something he wants to tell Pak Budi.
cast: [Bu Ijah, Sari, Karim]
scenes:
  - setting:
      ar_eg: نهر مارتاپورا جنب بانجارماسين، الساعة خمسة الفجر. عشرات المراكب الخشب الصغيّرة مليانة خضار وفاكهة وكيك، والبيّاعات لابسين برانيط واسعة.
      ar: نهر مارتابورا قرب بانجارماسين، الخامسة فجرًا. عشرات القوارب الخشبية الصغيرة محمّلة بالخضار والفواكه والكعك، والبائعات يعتمرن قبّعات عريضة.
      en: The Martapura River near Banjarmasin, 5 a.m. Dozens of little wooden boats loaded with vegetables, fruit and cakes, the women sellers in wide hats.
    lines:
      - speaker: Narrator
        text: Pasar Terapung Lok Baintan. Puluhan jukung berdesakan di atas air, dan para pedagang perempuan bertopi lebar mendayung dari satu perahu ke perahu lain.
        ar_eg: السوق العايم في لوك باينتان. عشرات المراكب الصغيّرة لازقة في بعض على المية، والبيّاعات بالبرانيط الواسعة بيجدّفوا من مركب لمركب.
        ar: سوق لوك باينتان العائم. عشرات القوارب الصغيرة متزاحمة على الماء، والبائعات بقبّعاتهنّ العريضة يجدّفن من قارب إلى آخر.
        en: Lok Baintan Floating Market. Dozens of jukung boats jostle on the water, and women traders in wide hats paddle from boat to boat.
        note:
          ar_eg: الـ jukung مركب خشب صغيّر، والبرنيطة الواسعة اسمها tanggui ومعمولة من ورق النخل. السوق بيبدأ مع الفجر وبيخلص قبل الضهر بكتير.
          ar: الـ jukung قارب خشبيّ صغير، والقبّعة العريضة تُسمّى tanggui وتُصنع من سعف النخيل. يبدأ السوق مع الفجر وينفضّ قبل الظهر بوقت طويل.
          en: A jukung is a small wooden canoe, and the wide hat is a tanggui, woven from palm leaves. The market starts at dawn and is over long before noon.
      - speaker: Bu Ijah
        text: Kue, Nak? Ada bingka, ada amparan tatak. Masih hangat!
        ar_eg: كيك يا بنتي؟ عندي بينجكا وأمپاران تاتاك. لسّه سخنين!
        ar: كعك يا ابنتي؟ عندي بينغكا وأمباران تاتاك، وما زالا دافئين!
        en: Cakes, dear? There's bingka, there's amparan tatak. Still warm!
      - speaker: Sari
        text: Satu bingka, Cil. Berapa?
        ar_eg: واحدة بينجكا يا خالتي. بكام؟
        ar: قطعة بينغكا يا خالة. بكم؟
        en: One bingka, Auntie. How much?
        note:
          ar_eg: Cil اختصار Acil، يعني «خالتي / عمّتي» بلغة البانجار. كده بينادوا البيّاعات في السوق العايم - زي «يا خالتي» في سوق مصري.
          ar: Cil اختصار Acil، أي «خالة» بلغة البانجار. وهكذا تُنادى البائعات في السوق العائم، كقولنا «يا خالتي» في سوق مصري.
          en: Cil is short for Acil, "auntie" in the Banjar language. It's how you address the women traders on the floating market - like "khalti" in an Egyptian market.
      - speaker: Bu Ijah
        text: Lima ribu saja, Nak.
        ar_eg: خمسة آلاف بس يا بنتي.
        ar: خمسة آلاف فقط يا ابنتي.
        en: Just five thousand, dear.
      - speaker: Karim
        text: Dua bingka, Cil. Yang satu untuk Sari. Saya yang bayar.
        ar_eg: اتنين بينجكا يا خالتي. واحدة لساري. وأنا اللي هدفع.
        ar: قطعتا بينغكا يا خالة. إحداهما لساري، وأنا من سيدفع.
        en: Two bingka, Auntie. One's for Sari. I'm paying.
      - speaker: Sari
        text: Karim?! Kamu... di sini? Di Banjarmasin? Di atas perahu?
        ar_eg: كريم؟! إنت... هنا؟ في بانجارماسين؟ على مركب؟
        ar: كريم؟! أنت... هنا؟ في بانجارماسين؟ على قارب؟
        en: Karim?! You're... here? In Banjarmasin? On a boat?
      - speaker: Karim
        text: Kejutan! Kantorku mengirim aku ke pameran pariwisata di Surabaya minggu depan. Aku datang lebih awal untuk perjalanan dinas kecil... dan Nadia bilang kamu di sini hari ini.
        ar_eg: مفاجأة! الشركة بعتتني معرض سياحة في سورابايا الأسبوع الجاي. جيت بدري شوية في سفرية شغل صغيّرة... ونادية قالتلي إنك هنا النهارده.
        ar: مفاجأة! أرسلتني شركتي إلى معرض سياحي في سورابايا الأسبوع المقبل. جئتُ مبكّرًا في رحلة عمل صغيرة... وأخبرتني نادية أنّك هنا اليوم.
        en: Surprise! My office is sending me to a travel fair in Surabaya next week. I came early for a little business trip... and Nadia told me you'd be here today.
      - speaker: Sari
        text: Nadia! Pantas dia bertanya terus tentang rencana akhir pekanku.
        ar_eg: نادية! عشان كده كانت عمّالة تسألني على خطّتي في الويك إند.
        ar: نادية! لا عجب أنّها ظلّت تسألني عن خططي لعطلة نهاية الأسبوع.
        en: Nadia! No wonder she kept asking about my weekend plans.
      - speaker: Narrator
        text: Karim mencoba melangkah ke jukung Sari. Perahu kecil itu bergoyang keras, dan Bu Ijah memegang topinya.
        ar_eg: كريم حاول يخطي لمركب ساري. المركب الصغيّر اتهزّ جامد، وبو إيجاه مسكت برنيطتها.
        ar: حاول كريم أن يخطو إلى قارب ساري، فاهتزّ القارب الصغير بشدّة، وأمسكت بو إيجاه بقبّعتها.
        en: Karim tries to step across into Sari's jukung. The little boat rocks hard, and Bu Ijah grabs her hat.
      - speaker: Bu Ijah
        text: Hati-hati, Nak! Ini jukung, bukan unta!
        ar_eg: حاسب يا ابني! دي مركب، مش جمل!
        ar: انتبه يا بنيّ! هذا قارب لا جمل!
        en: Careful, lad! This is a jukung, not a camel!
      - speaker: Karim
        text: Maaf, Cil! Di Mesir kami punya Sungai Nil, tetapi kami tidak berbelanja sambil berdiri di atas perahu.
        ar_eg: آسف يا خالتي! إحنا في مصر عندنا النيل، بس مبنشتريش حاجة وإحنا واقفين على مركب.
        ar: آسف يا خالة! لدينا النيل في مصر، لكنّنا لا نتسوّق ونحن واقفون على قارب.
        en: Sorry, Auntie! We've got the Nile in Egypt, but we don't go shopping standing up in a boat.
      - speaker: Bu Ijah
        text: Pasar terapung sudah ada sejak zaman Kerajaan Banjar, Nak. Dulu sungai adalah jalan raya kami. Perdagangan, pertemuan, bahkan perjodohan, semuanya di atas air.
        ar_eg: السوق العايم موجود من أيام مملكة بانجار يا ابني. زمان النهر كان هو الطريق بتاعنا. التجارة، والمقابلات، وحتى الجواز، كله كان على المية.
        ar: السوق العائم قائم منذ عهد مملكة بانجار يا بنيّ. كان النهر قديمًا طريقنا العامّ - التجارة واللقاءات وحتى الخِطبة، كلّها على الماء.
        en: The floating market goes back to the days of the Banjar Sultanate, lad. The river used to be our highway. Trade, meetings, even matchmaking - all of it on the water.
        note:
          ar_eg: الصيغة per-...-an بتعمل أسماء لنشاط أو نتيجته - dagang ← perdagangan (تجارة)، temu ← pertemuan (لقاء)، jalan ← perjalanan (رحلة)، jodoh ← perjodohan (توفيق راسين في الحلال). وبانجارماسين اسمها «مدينة الألف نهر».
          ar: الصيغة per-...-an تصوغ أسماء للنشاط أو نتيجته - dagang ← perdagangan (تجارة)، temu ← pertemuan (لقاء)، jalan ← perjalanan (رحلة)، jodoh ← perjodohan (التوفيق بين زوجين). وتُلقّب بانجارماسين «مدينة الألف نهر».
          en: per-...-an makes nouns for an activity or its result - dagang → perdagangan (trade), temu → pertemuan (meeting), jalan → perjalanan (journey), jodoh → perjodohan (matchmaking). Banjarmasin is nicknamed the "City of a Thousand Rivers".
      - speaker: Karim
        text: Kairo kota seribu menara, Banjarmasin kota seribu sungai. Ternyata Mesir dan Indonesia sama-sama suka angka seribu!
        ar_eg: القاهرة مدينة الألف مدنة، وبانجارماسين مدينة الألف نهر. طلع إن مصر وإندونيسيا الاتنين بيحبّوا رقم ألف!
        ar: القاهرة مدينة الألف مئذنة، وبانجارماسين مدينة الألف نهر. يبدو أنّ مصر وإندونيسيا تحبّان العدد ألفًا!
        en: Cairo's the city of a thousand minarets, Banjarmasin's the city of a thousand rivers. Turns out Egypt and Indonesia both love the number one thousand!
  - setting:
      ar_eg: بعد السوق، مطعم سوتو صغيّر على حرف النهر. ترابيزات خشب، وريحة القرفة والقرنفل في كل حتّة.
      ar: بعد السوق، مطعم سوتو صغير على ضفّة النهر. طاولات خشبية، ورائحة القرفة والقرنفل في كلّ مكان.
      en: After the market, a little soto restaurant on the riverbank. Wooden tables, and the smell of cinnamon and cloves everywhere.
    lines:
      - speaker: Sari
        text: Ini soto Banjar. Kuahnya bening, tetapi wangi sekali. Isinya ayam suwir, telur rebus, perkedel, dan ketupat. Jangan lupa jeruk nipisnya.
        ar_eg: ده سوتو بانجار. الشوربة رايقة، بس ريحتها تجنّن. جوّاه فراخ مقطّعة، وبيض مسلوق، وكفتة بطاطس، ورز معمول في ورق نخل. ومتنساش الليمون.
        ar: هذا سوتو بانجار. مرقه صافٍ لكنّه عطر جدًّا، وفيه دجاج مقطّع وبيض مسلوق وأقراص بطاطس وأرزّ مضغوط في سعف النخيل. ولا تنسَ الليمون.
        en: This is soto Banjar. The broth is clear, but so fragrant. It's got shredded chicken, boiled egg, potato fritters and ketupat rice cake. Don't forget the lime.
      - speaker: Karim
        text: Kayu manis... cengkih... pala... Sari, baunya seperti kaldu daging nenekku waktu Idul Adha!
        ar_eg: قرفة... قرنفل... جوزة الطيب... يا ساري، ريحته زي شوربة اللحمة بتاعة ستّي في العيد الكبير!
        ar: قرفة... قرنفل... جوزة الطيب... يا ساري، رائحته كمرق اللحم الذي كانت جدّتي تعدّه في عيد الأضحى!
        en: Cinnamon... cloves... nutmeg... Sari, it smells like my grandmother's meat broth at Eid al-Adha!
      - speaker: Sari
        text: Katanya, satu mangkuk soto Banjar bercerita tentang sejarah kota ini. Rempahnya mengingatkan pada masakan pedagang Arab dan India, kuahnya dipengaruhi masakan Tionghoa, dan ketupatnya khas Melayu.
        ar_eg: بيقولوا إن طبق سوتو بانجار واحد بيحكي تاريخ المدينة دي. البهارات بتفكّرك بأكل التجّار العرب والهنود، والشوربة متأثّرة بالأكل الصيني، والرز في ورق النخل ده ملاوي أصلي.
        ar: يُقال إنّ وعاء سوتو بانجار يروي تاريخ هذه المدينة - توابله تذكّر بطعام التجّار العرب والهنود، ومرقه متأثّر بالمطبخ الصيني، وأرزّه المضغوط ملاويّ أصيل.
        en: They say one bowl of soto Banjar tells the history of this city. The spices recall the cooking of Arab and Indian traders, the broth shows Chinese influence, and the ketupat is purely Malay.
        note:
          ar_eg: تاريخ الأكل في إندونيسيا فيه آراء كتير، وعشان كده ساري بتقول katanya (بيقولوا). كاليمانتان الجنوبية كانت مركز تجارة على النهر من قرون، والتجّار العرب والصينيين سابوا بصمتهم في المطبخ.
          ar: لتاريخ الطعام في إندونيسيا روايات كثيرة، ولذا تقول ساري katanya (يُقال). كانت كاليمانتان الجنوبية مركزًا تجاريًّا نهريًّا منذ قرون، وترك التجّار العرب والصينيون أثرهم في مطبخها.
          en: Food history in Indonesia has many versions, which is why Sari says katanya (they say). South Kalimantan has been a river trading hub for centuries, and Arab and Chinese traders left their mark on its cooking.
      - speaker: Karim
        text: Jadi satu mangkuk ini adalah pertemuan banyak bangsa. Seperti kita sekarang, orang Mesir dan orang Jawa, makan soto Banjar di Kalimantan.
        ar_eg: يعني الطبق الواحد ده ملتقى شعوب كتير. زيّنا دلوقتي - واحد مصري وواحدة جاوية، بياكلوا سوتو بانجار في كاليمانتان.
        ar: إذن هذا الوعاء الواحد ملتقى شعوب كثيرة. مثلنا الآن - مصريّ وجاويّة يأكلان سوتو بانجار في كاليمانتان.
        en: So this one bowl is a meeting of many peoples. Like us right now - an Egyptian and a Javanese eating soto Banjar in Kalimantan.
      - speaker: Narrator
        text: Karim mencoba sambalnya. Wajahnya merah. Lalu dia memesan semangkuk lagi, dan sate ayam, dan es teh, dan kue bingka untuk dibawa pulang.
        ar_eg: كريم دايق الشطّة. وشّه احمرّ. وبعدين طلب طبق كمان، وسيخ فراخ، وشاي بتلج، وبينجكا تيك أواي.
        ar: تذوّق كريم الصلصة الحارّة فاحمرّ وجهه. ثمّ طلب وعاءً آخر، ودجاجًا مشويًّا على أسياخ، وشايًا مثلّجًا، وكعك بينغكا ليأخذه معه.
        en: Karim tries the sambal. His face goes red. Then he orders another bowl, and chicken satay, and iced tea, and bingka to take away.
      - speaker: Sari
        text: Karim, itu sudah mangkuk ketiga.
        ar_eg: يا كريم، ده تالت طبق.
        ar: يا كريم، هذا الوعاء الثالث.
        en: Karim, that's your third bowl.
      - speaker: Karim
        text: Di Mesir, makanan adalah identitas. Kalau kamu bertanya kepada orang Mesir siapa dia, mungkin dia akan menjawab, "Aku orang yang makan ful setiap pagi."
        ar_eg: في مصر، الأكل هوية. لو سألتي واحد مصري هو مين، يمكن يقولّك «أنا اللي بفطر فول كل يوم».
        ar: في مصر الطعام هويّة. لو سألتِ مصريًّا من هو، فلعلّه يجيب «أنا من يأكل الفول كلّ صباح».
        en: In Egypt, food is identity. If you ask an Egyptian who he is, he might answer, "I'm someone who eats ful every morning."
        note:
          ar_eg: كلمات ke-...-an المجرّدة مهمّة في كلام الهوية - budaya ← kebudayaan (ثقافة)، biasa ← kebiasaan (عادة)، bersama ← kebersamaan (لَمّة، روح الجماعة). وidentitas كلمة دولية زي «هوية».
          ar: الأسماء المجرّدة بصيغة ke-...-an مهمّة في الحديث عن الهويّة - budaya ← kebudayaan (ثقافة)، biasa ← kebiasaan (عادة)، bersama ← kebersamaan (روح الجماعة). وidentitas كلمة دولية بمعنى «هويّة».
          en: Abstract ke-...-an nouns matter when talking about identity - budaya → kebudayaan (culture), biasa → kebiasaan (habit), bersama → kebersamaan (togetherness). identitas is the international word for identity.
      - speaker: Sari
        text: Di Madiun juga sama. Bapak selalu bilang, orang yang belum makan pecel belum benar-benar pernah ke Madiun.
        ar_eg: في ماديون نفس الحكاية. بابا دايمًا بيقول إن اللي مكلش بيچيل عمره ما زار ماديون بجد.
        ar: والأمر نفسه في ماديون. يقول أبي دائمًا إنّ من لم يأكل البيتشيل لم يزر ماديون حقًّا.
        en: It's the same in Madiun. Dad always says that if you haven't eaten pecel, you've never really been to Madiun.
      - speaker: Karim
        text: Kalau begitu, aku sudah orang Madiun. Waktu tinggal di sana, aku makan pecel Bapakmu ratusan kali.
        ar_eg: يبقى أنا بقيت ماديوني. لمّا كنت عايش هناك كلت بيچيل أبوكي مئات المرّات.
        ar: إذن صرتُ ماديونيًّا. فحين أقمتُ هناك أكلتُ بيتشيل أبيكِ مئات المرّات.
        en: Then I'm a Madiun man already. When I lived there, I ate your dad's pecel hundreds of times.
      - speaker: Karim
        text: Sari... setelah pameran di Surabaya, aku ingin mampir ke Madiun. Bertemu Pak Budi dan Bu Rahayu.
        ar_eg: يا ساري... بعد المعرض في سورابايا، عايز أعدّي على ماديون. أشوف پاك بودي وبو راهايو.
        ar: يا ساري... بعد المعرض في سورابايا أودّ أن أمرّ بماديون لأزور باك بودي وبو راهايو.
        en: Sari... after the fair in Surabaya, I'd like to stop by Madiun. To see Pak Budi and Bu Rahayu.
      - speaker: Sari
        text: Bapak pasti senang sekali. Tapi kenapa tiba-tiba?
        ar_eg: بابا أكيد هيفرح جدًا. بس ليه فجأة كده؟
        ar: سيفرح أبي كثيرًا بالتأكيد. لكن لماذا فجأة؟
        en: Dad will be thrilled. But why all of a sudden?
      - speaker: Karim
        text: Ada sesuatu yang ingin aku sampaikan kepada beliau. Dalam bahasa yang tepat.
        ar_eg: فيه حاجة عايز أقولها لحضرته. باللغة المناسبة.
        ar: ثمّة أمر أريد أن أبلغه لسيادته. باللغة اللائقة.
        en: There's something I want to say to him. In the right language.
