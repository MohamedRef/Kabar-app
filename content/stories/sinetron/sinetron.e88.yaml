title:
  target: Regi pinten, Bu?
  ar_eg: السعر كام يا حاجّة؟
  ar: كم السعر يا سيدتي؟
  en: What's the price, ma'am?
summary:
  ar_eg: في سوق بيرينجهارجو، كريم عايز يشتري باتيك هدية لبو راهايو وبو هارجو. البيّاعة الكبيرة بتقول الأسعار بالكراما - kalih atus، tiga atus - وكريم بيفاصل بأرقام الكراما لأول مرة. وفي البيت، باك هارجو بيراجع الفاتورة.
  ar: في سوق بيرينغهارجو، يريد كريم شراء باتيك هديةً لبو راهايو وبو هارجو. تذكر البائعة المسنّة الأسعار بالكراما - kalih atus وtiga atus - ويساوم كريم بأرقام الكراما لأوّل مرّة. وفي البيت يراجع باك هارجو الفاتورة.
  en: At Pasar Beringharjo, Karim wants to buy batik as gifts for Bu Rahayu and Bu Harjo. The older seller quotes prices in krama - kalih atus, tiga atus - and Karim haggles with krama numbers for the first time. At home, Pak Harjo checks the receipt.
cast: [Karim, Bakul, Pak Harjo]
scenes:
  - setting:
      ar_eg: سوق بيرينجهارجو في جوجا، الضهر. ممرّات ضيّقة وعليها رفوف قماش باتيك لحدّ السقف. بيّاعة كبيرة بتطبّق قماش.
      ar: سوق بيرينغهارجو في جوغجا، ظهرًا. ممرّات ضيّقة ترتفع فيها رفوف أقمشة الباتيك حتى السقف. بائعة مسنّة تطوي الأقمشة.
      en: Pasar Beringharjo in Jogja, midday. Narrow aisles stacked with batik cloth to the ceiling. An older seller is folding fabric.
    lines:
      - speaker: Karim
        text: Sugeng siang, Bu. Kula badhe tumbas batik kalih.
        ar_eg: نهارك سعيد يا حاجّة. عايز أشتري قطعتين باتيك.
        ar: طاب نهارك يا سيدتي. أريد أن أشتري قطعتي باتيك.
        en: Good afternoon, ma'am. I'd like to buy two batiks.
        note:
          ar_eg: الأرقام بالكراما - setunggal (1)، kalih (2)، tiga (3)، sekawan (4)، gangsal (5)، enem (6)، pitu (7)، wolu (8)، sanga (9)، sedasa (10). خلّي بالك - setunggal وkalih وsekawan وgangsal مختلفين خالص عن النجوكو.
          ar: الأرقام بالكراما - setunggal (1)، kalih (2)، tiga (3)، sekawan (4)، gangsal (5)، enem (6)، pitu (7)، wolu (8)، sanga (9)، sedasa (10). انتبه - setunggal وkalih وsekawan وgangsal تختلف تمامًا عن النغوكو.
          en: Krama numbers - setunggal (1), kalih (2), tiga (3), sekawan (4), gangsal (5), enem (6), pitu (7), wolu (8), sanga (9), sedasa (10). Note setunggal, kalih, sekawan and gangsal differ completely from ngoko.
      - speaker: Bakul
        text: Mangga, Mas. Menika batik tulis saking Jogja, menika batik cap.
        ar_eg: اتفضّل يا ابني. ده باتيك مرسوم بالإيد من جوجا، وده باتيك مطبوع بالختم.
        ar: تفضّل يا بنيّ. هذا باتيك مرسوم يدويًّا من جوغجا، وهذا باتيك مطبوع بالختم.
        en: Please, son. This is hand-drawn batik from Jogja, and this is stamped batik.
        note:
          ar_eg: batik tulis بيترسم بالشمع بإيد بأداة اسمها canting، وبياخد أسابيع، فغالي. batik cap بيتطبع بختم نحاس، أسرع وأرخص.
          ar: يُرسم batik tulis بالشمع يدويًّا بأداة اسمها canting، ويستغرق أسابيع، فهو غالٍ. أمّا batik cap فيُطبع بختم نحاسيّ، فهو أسرع وأرخص.
          en: batik tulis is drawn by hand in wax with a canting pen and takes weeks, so it's pricey. batik cap is printed with a copper stamp, faster and cheaper.
      - speaker: Karim
        text: Ingkang cap, regi pinten?
        ar_eg: المطبوع، سعره كام؟
        ar: المطبوع، كم سعره؟
        en: The stamped one, what's the price?
      - speaker: Bakul
        text: Setunggal, satus pitung dasa ewu. Kalih, tiga atus sekawan dasa ewu.
        ar_eg: الواحدة، مية وسبعين ألف. الاتنين، تلتمية وأربعين ألف.
        ar: الواحدة، مئة وسبعون ألفًا. الاثنتان، ثلاثمئة وأربعون ألفًا.
        en: One, a hundred and seventy thousand. Two, three hundred and forty thousand.
        note:
          ar_eg: dasa = عشرات بالكراما (sedasa 10، kalih dasa 20، pitung dasa 70). وatus = مية (kalih atus 200، tiga atus 300).
          ar: dasa = العشرات بالكراما (sedasa 10، kalih dasa 20، pitung dasa 70). وatus = مئة (kalih atus 200، tiga atus 300).
          en: dasa = tens in krama (sedasa 10, kalih dasa 20, pitung dasa 70). atus = hundred (kalih atus 200, tiga atus 300).
      - speaker: Karim
        text: Tiga atus, angsal, Bu?
        ar_eg: تلتمية، ينفع يا حاجّة؟
        ar: ثلاثمئة، هل يجوز يا سيدتي؟
        en: Three hundred, may I, ma'am?
      - speaker: Bakul
        text: Waduh, Mase saged krama! Tiga atus kalih dasa, nggih.
        ar_eg: يا سلام، الأستاذ بيعرف كراما! تلتمية وعشرين، ماشي.
        ar: عجبًا، الأستاذ يعرف الكراما! ثلاثمئة وعشرون، حسنًا.
        en: Oh my, this gentleman speaks krama! Three hundred and twenty, all right.
      - speaker: Karim
        text: Nggih, Bu. Matur nuwun sanget.
        ar_eg: ماشي يا حاجّة. متشكّر جدًّا.
        ar: حسنًا يا سيدتي. شكرًا جزيلًا.
        en: All right, ma'am. Thank you very much.
  - setting:
      ar_eg: بالليل في بيت باك هارجو. كريم بيفرد القطعتين على الترابيزة، وباك هارجو ماسك الفاتورة بنضّارته.
      ar: ليلًا في بيت باك هارجو. يبسط كريم القطعتين على الطاولة، ويمسك باك هارجو الفاتورة بنظّارته.
      en: Night at Pak Harjo's house. Karim spreads the two cloths on the table; Pak Harjo holds the receipt with his reading glasses on.
    lines:
      - speaker: Pak Harjo
        text: Batik kalih, tiga atus kalih dasa ewu. Sinten ingkang nawar?
        ar_eg: قطعتين باتيك، بتلتمية وعشرين ألف. مين اللي فاصل؟
        ar: قطعتا باتيك، بثلاثمئة وعشرين ألفًا. من ساوم؟
        en: Two batiks, three hundred and twenty thousand. Who did the haggling?
      - speaker: Karim
        text: Kula piyambak, Pak! Mawi basa krama.
        ar_eg: أنا بنفسي يا باك! بالكراما.
        ar: أنا بنفسي يا باك! بالكراما.
        en: Me, myself, Pak! In krama.
      - speaker: Pak Harjo
        text: Sae sanget. Lajeng, ingkang setunggal kagem sinten?
        ar_eg: حلو أوي. طب، واحدة منهم لمين؟
        ar: ممتاز. إذن، لمن الواحدة منهما؟
        en: Very good. So, who is one of them for?
      - speaker: Karim
        text: Setunggal kagem Bu Rahayu wonten Madiun. Setunggal malih kagem Bu Harjo.
        ar_eg: واحدة لبو راهايو في ماديون. والتانية لبو هارجو.
        ar: واحدة لبو راهايو في ماديون. والأخرى لبو هارجو.
        en: One for Bu Rahayu in Madiun. The other for Bu Harjo.
      - speaker: Pak Harjo
        text: Wah! Garwa kula mesthi remen. Motif parang, nggih? Saking Jogja asli.
        ar_eg: يا سلام! مراتي أكيد هتفرح. موتيف «بارانج»، صح؟ أصلي من جوجا.
        ar: رائع! ستفرح زوجتي حتمًا. نقشة «بارانغ»، أليس كذلك؟ أصيلة من جوغجا.
        en: Oh! My wife will surely love it. The parang pattern, isn't it? Jogja through and through.
        note:
          ar_eg: garwa = زوجة / زوج (كراما). وparang موتيف باتيك قديم على شكل موج مايل، مرتبط بقصور جاوة الوسطى.
          ar: garwa = زوج / زوجة (كراما). وparang نقشة باتيك قديمة على شكل موج مائل، مرتبطة بقصور جاوة الوسطى.
          en: garwa = spouse (krama). parang is an old batik pattern of slanting waves, linked to the courts of Central Java.
