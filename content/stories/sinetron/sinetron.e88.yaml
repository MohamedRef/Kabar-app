questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: كريم دفع كام في الآخر؟
      ar: كم دفع كريم في النهاية؟
      en: How much did Karim pay in the end?
    options: ["tiga atus ewu", "tiga atus kalih dasa ewu", "tiga atus sekawan dasa ewu"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Ingkang cap, ___ pinten?
    meaning:
      ar_eg: المطبوع، سعره كام؟
      ar: المطبوع، كم سعره؟
      en: The stamped one, what's the price?
    answers: [regi]
    options: ["regi", "rega", "kalih"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: «kalih» يعني كام؟
      ar: كم تعني «kalih»؟
      en: What number is "kalih"?
    options: ["1", "2", "4", "5"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Setunggal kagem Bu Rahayu.
    answers_meaning:
      ar_eg: ["واحدة لبو راهايو.", "واحدة عشان بو راهايو."]
      ar: ["واحدة لبو راهايو."]
      en: ["One for Bu Rahayu.", "One is for Bu Rahayu."]
next:
  ar_eg: باك هارجو بياخد كريم جيريلويو، قرية الباتيك المرسوم في إيموجيري. على باب بيت قديم، لوحة مكتوبة بكراما رسمية فيها dipun- و-ipun... وكريم لازم يترجمها.
  ar: يأخذ باك هارجو كريمًا إلى جيريلويو، قرية الباتيك المرسوم في إيموغيري. على باب بيت قديم لوحة مكتوبة بكراما رسمية فيها dipun- و-ipun... وعلى كريم أن يترجمها.
  en: Pak Harjo takes Karim to Giriloyo, the hand-drawn batik village in Imogiri. By the door of an old house is a sign in formal krama full of dipun- and -ipun... and Karim has to translate it.
review:
  status: draft
  verified: false
  notes: Krama numbers per j3.u05. Batik prices are illustrative (stamped cotton batik at Beringharjo varies widely). Check "Mawi basa krama" (in krama).
