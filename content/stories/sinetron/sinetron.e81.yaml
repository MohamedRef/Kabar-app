    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحد من دول من أيام السوق الخمسة؟
      ar: أيّ هذه من أيّام السوق الخمسة؟
      en: Which of these is one of the five market days?
    options: ["Setu", "Kliwon", "Minggu"]
    answer: 1
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: «setengah wolu» الساعة كام؟
      ar: كم الساعة «setengah wolu»؟
      en: What time is "setengah wolu"?
    options: ["8:30", "7:30", "8:00"]
