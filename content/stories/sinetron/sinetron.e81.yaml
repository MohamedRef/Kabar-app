next:
  ar_eg: الصبح بدري في ماديون، بو راهايو بتصحّي الكل وبتدّي أوامر - امسح! اشتري! استنّى! بس كل أمر في آخره «ya». ليه؟
  ar: في الصباح الباكر في ماديون، توقظ بو راهايو الجميع وتصدر الأوامر - امسح! اشترِ! انتظر! لكنّ كلّ أمر ينتهي بـ«ya». لماذا؟
  en: Early morning in Madiun, Bu Rahayu wakes everyone up and gives orders - sweep! buy! wait! But every order ends in "ya". Why?
review:
  status: draft
  verified: false
  notes: Reog Ponorogo was inscribed on UNESCO's Urgent Safeguarding List in December 2024 - verify. Mask weight is often quoted at 50-60 kg; "puluhan kilo" keeps it safe. Selapan = 35-day cycle.
