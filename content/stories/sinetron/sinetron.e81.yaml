title:
  target: Setu Pon, jam setengah wolu
  ar_eg: السبت «پون»، الساعة سبعة ونص
  ar: السبت «بون»، الساعة السابعة والنصف
  en: Saturday Pon, half past seven
summary:
  ar_eg: جوكو بيخطّط ياخد كريم پونوروجو يتفرّج على ريوج. بس الميعاد مكتوب «Setu Pon» - السبت... وكمان «پون»؟ بو راهايو بتشرح إن الجاوي عنده أسبوعين في نفس الوقت، أسبوع بسبع أيام وأسبوع سوق بخمسة. وبالليل، الطاووس العملاق بيرقص.
  ar: يخطّط جوكو لأخذ كريم إلى بونوروغو لمشاهدة الريوغ. لكنّ الموعد مكتوب «Setu Pon» - السبت... و«بون» أيضًا؟ تشرح بو راهايو أنّ للجاويين أسبوعين معًا، أسبوعًا من سبعة أيّام وأسبوع سوق من خمسة. وفي الليل يرقص الطاووس العملاق.
  en: Joko plans to take Karim to Ponorogo to see Reog. But the date says "Setu Pon" - Saturday... and Pon? Bu Rahayu explains that Javanese has two weeks at once, a seven-day week and a five-day market week. And at night, the giant peacock dances.
cast: [Karim, Mas Joko, Bu Rahayu]
scenes:
  - setting:
      ar_eg: الوارونج في ماديون، الضهر. جوكو ماسك تليفونه وعليه بوستر - «Pentas Reog, Setu Pon». بو راهايو بتقطّع خضار.
      ar: الوارونغ في ماديون، ظهرًا. يمسك جوكو هاتفه وعليه ملصق - «Pentas Reog, Setu Pon». وبو راهايو تقطّع الخضار.
      en: The warung in Madiun, midday. Joko holds up his phone showing a poster - "Pentas Reog, Setu Pon". Bu Rahayu is chopping vegetables.
    lines:
      - speaker: Mas Joko
        text: Mas Karim, Setu Pon ana Reog neng alun-alun Ponorogo. Ayo!
        ar_eg: يا ماس كريم، السبت «پون» فيه ريوج في الميدان الكبير في پونوروجو. يلّا!
        ar: يا ماس كريم، يوم السبت «بون» هناك عرض ريوغ في الساحة الكبرى في بونوروغو. هيّا!
        en: Mas Karim, on Setu Pon there's Reog on the town square in Ponorogo. Let's go!
      - speaker: Karim
        text: Setu iku dina Sabtu. Nanging Pon iku apa?
        ar_eg: Setu يعني السبت. بس Pon دي إيه؟
        ar: Setu تعني السبت. لكن ما Pon؟
        en: Setu is Saturday. But what's Pon?
      - speaker: Bu Rahayu
        text: Wong Jawa duwe pasaran, Karim. Limang dina. Legi, Pahing, Pon, Wage, Kliwon.
        ar_eg: الجاويين عندهم أيام السوق يا كريم. خمس أيام. ليجي، پاهينج، پون، واجي، كليوون.
        ar: لدى الجاويين أيّام السوق يا كريم. خمسة أيّام. ليغي، باهينغ، بون، واغي، كليوون.
        en: Javanese people have pasaran days, Karim. Five of them. Legi, Pahing, Pon, Wage, Kliwon.
        note:
          ar_eg: زمان الأسواق في القرى كانت بتتنقل كل يوم من الخمسة لبلد. التقويم الجاوي بيجمع الأسبوع العادي (Senen، Selasa، Rebo، Kemis، Jemuwah، Setu، Minggu) مع الخمسة دول، فكل يوم ليه اسمين، زي «Setu Pon».
          ar: كانت أسواق القرى قديمًا تتنقّل في كلّ يوم من هذه الخمسة إلى بلدة. ويجمع التقويم الجاوي الأسبوع العاديّ (Senen وSelasa وRebo وKemis وJemuwah وSetu وMinggu) مع هذه الخمسة، فيصير لكلّ يوم اسمان، مثل «Setu Pon».
          en: Village markets used to rotate between towns on these five days. The Javanese calendar combines the ordinary week (Senen, Selasa, Rebo, Kemis, Jemuwah, Setu, Minggu) with the five, so every day has two names, like "Setu Pon".
      - speaker: Karim
        text: Pitu karo lima... dadi saben telung puluh lima dina, Setu Pon bali maneh!
        ar_eg: سبعة في خمسة... يعني كل خمسة وتلاتين يوم، السبت «پون» بيرجع تاني!
        ar: سبعة في خمسة... أي أنّ السبت «بون» يعود كلّ خمسة وثلاثين يومًا!
        en: Seven times five... so every thirty-five days, Setu Pon comes round again!
      - speaker: Bu Rahayu
        text: Lho, pinter! Iku jenenge selapan.
        ar_eg: يا سلام، شاطر! ده اسمه «سيلاپان».
        ar: رائع، ذكيّ! هذا اسمه «سيلابان».
        en: Oh, clever! That's called selapan.
      - speaker: Mas Joko
        text: Nanging ati-ati, Mas. Minggu ngarep Jemuwah Kliwon. Bengine... hiii!
        ar_eg: بس خلّي بالك يا ماس. الأسبوع الجاي جمعة «كليوون». وليلتها... هيييي!
        ar: لكن انتبه يا ماس. الأسبوع القادم جمعة «كليوون». وفي ليلتها... هيييي!
        en: But careful, Mas. Next week is Jemuwah Kliwon. And that night... ooooh!
        note:
          ar_eg: «جمعة كليوون» أشهر تركيبة في التقويم الجاوي. في الحكايات الشعبية والأفلام ليلتها «غامضة»، وناس كتير بتعتبرها ليلة دعاء وزيارة. جوكو هنا بيهزّر بس.
          ar: «جمعة كليوون» أشهر تركيبة في التقويم الجاوي. ليلتها «غامضة» في الحكايات الشعبية والأفلام، ويعدّها كثيرون ليلة دعاء وزيارة. وجوكو هنا يمزح فقط.
          en: Jemuwah Kliwon (Friday Kliwon) is the calendar's most famous combination. In folk tales and films its night is "mysterious"; many people treat it as a night for prayer and visits. Joko is just joking.
      - speaker: Bu Rahayu
        text: Jok! Ojo medeni tamu.
        ar_eg: يا جوكو! ماتخوّفش الضيف.
        ar: يا جوكو! لا تخِف الضيف.
        en: Jok! Don't scare our guest.
  - setting:
      ar_eg: ميدان پونوروجو الكبير، السبت بالليل. طبول وناي. راقص شايل قناع نمر عليه ريش طاووس عملاق، وبيرفعه بسنانه.
      ar: الساحة الكبرى في بونوروغو، ليلة السبت. طبول ومزامير. راقص يحمل قناع نمر عليه ريش طاووس عملاق، ويرفعه بأسنانه.
      en: Ponorogo's town square on Saturday night. Drums and pipes. A dancer carries a tiger mask crowned with giant peacock feathers - lifting it with his teeth.
    lines:
      - speaker: Karim
        text: Jok, jam pira saiki?
        ar_eg: يا جوكو، الساعة كام دلوقتي؟
        ar: يا جوكو، كم الساعة الآن؟
        en: Jok, what time is it now?
      - speaker: Mas Joko
        text: Jam setengah wolu. Pas!
        ar_eg: سبعة ونص. في الميعاد بالظبط!
        ar: السابعة والنصف. في الموعد تمامًا!
        en: Half past seven. Right on time!
        note:
          ar_eg: خلّي بالك - setengah wolu حرفيًا «نصّ تمانية» يعني سبعة ونص (نصّ الطريق لتمانية). زي الألماني والهولندي.
          ar: انتبه - setengah wolu حرفيًّا «نصف الثامنة» أي السابعة والنصف (نصف الطريق إلى الثامنة).
          en: Careful - setengah wolu is literally "half eight", meaning 7:30 (halfway to eight), as in Dutch or German.
      - speaker: Karim
        text: Topenge gedhe banget! Abote pira?
        ar_eg: القناع كبير أوي! وزنه قدّ إيه؟
        ar: القناع كبير جدًّا! كم وزنه؟
        en: The mask is enormous! How heavy is it?
      - speaker: Mas Joko
        text: Puluhan kilo, Mas. Lan diangkat nganggo untu!
        ar_eg: عشرات الكيلوهات يا ماس. وبيترفع بالسنان!
        ar: عشرات الكيلوغرامات يا ماس. ويُرفع بالأسنان!
        en: Dozens of kilos, Mas. And he lifts it with his teeth!
        note:
          ar_eg: القناع ده اسمه dadak merak - راس نمر وريش طاووس حقيقي. الريوج فخر پونوروجو، واليونسكو سجّلته في ٢٠٢٤ تراث محتاج حماية عاجلة.
          ar: يسمّى هذا القناع dadak merak - رأس نمر وريش طاووس حقيقيّ. والريوغ فخر بونوروغو، وقد أدرجته اليونسكو عام ٢٠٢٤ تراثًا يحتاج إلى صون عاجل.
          en: The mask is the dadak merak - a tiger's head with real peacock feathers. Reog is Ponorogo's pride; UNESCO inscribed it in 2024 as heritage in need of urgent safeguarding.
      - speaker: Karim
        text: Aku tak nulis. "Setu Pon, jam setengah wolu bengi, Reog Ponorogo. Apik banget."
        ar_eg: هكتب. «السبت پون، الساعة سبعة ونص بالليل، ريوج پونوروجو. حلو أوي».
        ar: سأكتب. «السبت بون، السابعة والنصف ليلًا، ريوغ بونوروغو. جميل جدًّا».
        en: I'll write it down. "Setu Pon, half seven at night, Reog Ponorogo. Amazing."
