title:
  target: Fanous Paling Indah
  ar_eg: أحلى فانوس
  ar: أجمل فانوس
  en: The Most Beautiful Fanous
summary:
  ar_eg: رمضان وصل. في القاهرة نادية بتجيب لساري أول فانوس في حياتها، وفي ماديون بايو بيصحّي الحارة على السحور بطبلة صوتها عالي أوي... وعنده سرّ.
  ar: حلّ رمضان. في القاهرة تهدي نادية ساري أول فانوس في حياتها، وفي ماديون يوقظ بايو الحيّ للسحور بطبلة صوتها عالٍ جدًّا... ولديه سرّ.
  en: Ramadan has arrived. In Cairo, Nadia gives Sari her very first fanous, and in Madiun, Bayu wakes the neighbourhood for sahur with a very loud drum... and he has a secret.
cast: [Sari, Nadia, Bayu, Pak Budi, Bu Rahayu]
scenes:
  - setting:
      ar_eg: القاهرة بالليل، ليلة أول يوم رمضان. الشوارع متعلّق فيها فوانيس وزينة ملوّنة.
      ar: القاهرة ليلًا، ليلة أول يوم من رمضان. الشوارع مزيّنة بالفوانيس والزينة الملوّنة.
      en: Cairo at night, the eve of the first day of Ramadan. The streets are hung with lanterns and coloured decorations.
    lines:
      - speaker: Narrator
        text: Kairo. Malam. Besok hari pertama Ramadan.
        ar_eg: القاهرة. بالليل. بكرة أول يوم في رمضان.
        ar: القاهرة. ليلًا. غدًا أول يوم من رمضان.
        en: Cairo. Night. Tomorrow is the first day of Ramadan.
      - speaker: Nadia
        text: Sari, lihat! Di jalan ada banyak fanous.
        ar_eg: يا ساري، بصّي! في الشارع فوانيس كتير.
        ar: يا ساري، انظري! في الشارع فوانيس كثيرة.
        en: Sari, look! There are lots of fanous lanterns in the street.
        note:
          ar_eg: الفانوس رمز رمضان في مصر. الإندونيسيين معندهمش فانوس، فساري هتشوفه لأول مرة. (lihat يعني «بُصّ»، من melihat.)
          ar: الفانوس رمز رمضان في مصر، ولا يعرفه الإندونيسيون، فساري تراه لأول مرة. (lihat تعني «انظر»، من melihat.)
          en: The fanous is Egypt's symbol of Ramadan. Indonesia doesn't have it, so this is Sari's first. (lihat = "look", from melihat.)
      - speaker: Sari
        text: Indah sekali! Yang merah itu paling indah.
        ar_eg: حلو أوي! الأحمر ده أحلى واحد فيهم.
        ar: جميل جدًّا! ذلك الأحمر هو الأجمل.
        en: So beautiful! That red one is the most beautiful.
      - speaker: Nadia
        text: Yang merah lebih besar, tapi yang kecil lebih murah.
        ar_eg: الأحمر أكبر، بس الصغير أرخص.
        ar: الأحمر أكبر، لكن الصغير أرخص.
        en: The red one is bigger, but the small one is cheaper.
      - speaker: Nadia
        text: Ini untuk kamu, Sari. Fanous pertama kamu!
        ar_eg: ده عشانك يا ساري. أول فانوس ليكي!
        ar: هذا لكِ يا ساري. أول فانوس لكِ!
        en: This is for you, Sari. Your first fanous!
      - speaker: Sari
        text: Terima kasih, Nadia! Ramadan di Kairo lebih ramai daripada di Madiun.
        ar_eg: شكرًا يا نادية! رمضان في القاهرة زحمة وحيوية أكتر من ماديون.
        ar: شكرًا يا نادية! رمضان في القاهرة أكثر حيوية وازدحامًا منه في ماديون.
        en: Thank you, Nadia! Ramadan in Cairo is livelier than in Madiun.
        note:
          ar_eg: «A lebih … daripada B» يعني «A … أكتر من B». زي ما بنقول بالعربي «أكبر من»، بس بالإندونيسي الصفة مبتتغيّرش.
          ar: «A lebih … daripada B» تعني «A أكثر … من B». الصفة نفسها لا تتغيّر كما في «أفعل التفضيل» العربي.
          en: '"A lebih … daripada B" = "A is more … than B". The adjective itself never changes.'
      - speaker: Sari
        text: Tapi ini Ramadan pertama saya jauh dari keluarga.
        ar_eg: بس ده أول رمضان ليّا بعيد عن أهلي.
        ar: لكن هذا أول رمضان لي بعيدًا عن عائلتي.
        en: But this is my first Ramadan far from my family.
  - setting:
      ar_eg: ماديون، الساعة ٣ الفجر (في القاهرة لسه ١٠ بالليل). عيال الحارة ماشيين في الشارع بيطبّلوا عشان يصحّوا الناس على السحور.
      ar: ماديون، الساعة الثالثة فجرًا (في القاهرة ما زالت العاشرة ليلًا). أطفال الحيّ يجوبون الشارع ويقرعون الطبول ليوقظوا الناس للسحور.
      en: Madiun, 3 a.m. (still 10 p.m. in Cairo). The neighbourhood kids walk the street with drums to wake everyone for sahur.
    lines:
      - speaker: Narrator
        text: Madiun. Jam tiga pagi. Anak-anak bermain gendang di jalan.
        ar_eg: ماديون. الساعة ٣ الفجر. العيال بيطبّلوا في الشارع.
        ar: ماديون. الساعة الثالثة فجرًا. الأطفال يقرعون الطبول في الشارع.
        en: Madiun. Three in the morning. Kids are playing drums in the street.
        note:
          ar_eg: في جاوة العيال بيلفّوا قبل السحور بطبول وكَنْتونجان (طبلة خشب) — اسمها «patrol sahur». زي المسحراتي عندنا بالظبط!
          ar: في جاوة يطوف الأطفال قبل السحور بالطبول والكنتونغان (ناقوس خشبي)، ويسمّى ذلك «patrol sahur»، تمامًا مثل المسحّراتي في مصر.
          en: In Java, kids go round before sahur with drums and wooden kentongan — "patrol sahur". Just like Egypt's mesaharati!
      - speaker: Bayu
        text: Sahur! Sahur! Bangun, bangun!
        ar_eg: سحور! سحور! اصحوا، اصحوا!
        ar: السحور! السحور! استيقظوا، استيقظوا!
        en: Sahur! Sahur! Wake up, wake up!
      - speaker: Pak Budi
        text: Le! Suara gendangmu terlalu keras!
        ar_eg: يا واد! صوت طبلتك عالي زيادة عن اللزوم!
        ar: يا بنيّ! صوت طبلتك عالٍ أكثر من اللازم!
        en: Son! Your drum is way too loud!
        note:
          ar_eg: Le (من Thole) كلمة جاوية الأهل بيقولوها لابنهم، زي Nduk للبنت. وterlalu يعني «زيادة عن اللزوم».
          ar: Le (من Thole) كلمة جاوية ينادي بها الأهل ابنهم، كما ينادون البنت Nduk. وterlalu تعني «أكثر من اللازم».
          en: Le (from Thole) is Javanese for a son, the way Nduk is for a daughter. terlalu = "too (much)".
      - speaker: Bayu
        text: Harus keras, Pak! Semua orang harus bangun.
        ar_eg: لازم يبقى عالي يا بابا! كل الناس لازم تصحى.
        ar: يجب أن يكون عاليًا يا أبي! على الجميع أن يستيقظوا.
        en: It has to be loud, Dad! Everyone has to wake up.
      - speaker: Bu Rahayu
        text: Bayu, makan sahur sekarang, ya. Hari ini hari pertama puasa.
        ar_eg: يا بايو، تعالى اتسحّر دلوقتي. النهارده أول يوم صيام.
        ar: يا بايو، تسحّر الآن. اليوم أول أيام الصيام.
        en: Bayu, eat your sahur now, okay? Today is the first day of fasting.
      - speaker: Sari
        text: Pak, Bu, selamat sahur! Di Kairo masih jam sepuluh malam.
        ar_eg: بابا، ماما، سحور سعيد! في القاهرة لسه الساعة ١٠ بالليل.
        ar: أبي، أمي، سحورًا هنيئًا! ما زالت الساعة العاشرة ليلًا في القاهرة.
        en: Dad, Mum, happy sahur! It's still ten at night in Cairo.
      - speaker: Pak Budi
        text: Nduk! Bapak paling suka sahur dengan pecel.
        ar_eg: يا بنتي! أنا أكتر حاجة بحبها السحور بالپيتشل.
        ar: يا ابنتي! أكثر ما أحبّه هو السحور مع البيتشل.
        en: Sweetheart! What I like most is sahur with pecel.
      - speaker: Bayu
        text: Bapak paling suka pecel setiap hari!
        ar_eg: بابا بيحب الپيتشل أكتر حاجة كل يوم أصلًا!
        ar: أبي يحبّ البيتشل أكثر من أي شيء كل يوم!
        en: Dad likes pecel most every single day!
      - speaker: Bayu
        text: Mbak, sst! Saya mau bekerja. Uangnya untuk tiket ke Kairo!
        ar_eg: يا أبلة، هِشّ! أنا عايز أشتغل. الفلوس عشان تذاكر القاهرة!
        ar: يا أختي، صه! أريد أن أعمل. المال لتذاكر القاهرة!
        en: Sis, shh! I want to work. The money's for tickets to Cairo!
      - speaker: Sari
        text: Bekerja? Bayu, kamu masih kecil!
        ar_eg: تشتغل؟ يا بايو، انت لسه صغير!
        ar: تعمل؟ يا بايو، ما زلت صغيرًا!
        en: Work? Bayu, you're still little!
      - speaker: Narrator
        text: Ramadan pertama. Sari di Kairo, keluarganya di Madiun.
        ar_eg: أول رمضان. ساري في القاهرة، وأهلها في ماديون.
        ar: أول رمضان. ساري في القاهرة، وعائلتها في ماديون.
        en: The first Ramadan. Sari in Cairo, her family in Madiun.
new_words:
  - word: Ramadan
    arabic: رمضان
    pos: noun
    ar_eg: رمضان
    ar: رمضان
    en: Ramadan
  - word: puasa
    pos: noun
    ar_eg: صيام / صايم
    ar: الصيام / صائم
    en: fasting; to fast
  - word: sahur
    arabic: سحور
    pos: noun
    ar_eg: السحور
    ar: السحور
    en: the pre-dawn meal
  - word: fanous
    pos: noun
    ar_eg: فانوس رمضان (كلمة مصرية، مش إندونيسي)
    ar: فانوس رمضان (كلمة مصرية لا إندونيسية)
    en: Ramadan lantern (Egyptian word, not Indonesian)
  - word: Le
    pos: noun
    ar_eg: يا ابني (كلمة جاوية فيها حنية)
    ar: يا بنيّ (كلمة جاوية للتحبّب)
    en: son, my boy (Javanese, to a son)
  - word: lihat
    pos: verb
    ar_eg: بُصّ / شوف
    ar: انظر
    en: look!
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: نادية جابت لساري إيه؟
      ar: ماذا أهدت نادية لساري؟
      en: What does Nadia give Sari?
    options: ["gendang", "fanous", "tiket"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Ramadan di Kairo lebih ramai ___ di Madiun.
    meaning:
      ar_eg: رمضان في القاهرة زحمة أكتر من ماديون.
      ar: رمضان في القاهرة أكثر حيوية منه في ماديون.
      en: Ramadan in Cairo is livelier than in Madiun.
    answers: [daripada]
    options: ["paling", "terlalu", "daripada"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: پاك بودي اشتكى من إيه؟
      ar: ممّ اشتكى باك بودي؟
      en: What does Pak Budi complain about?
    options: ["Bayu terlambat sahur.", "Gendangnya terlalu mahal.", "Suara gendang Bayu terlalu keras."]
    answer: 2
  - id: q04
    type: translate
    direction: from_target
    source_text: Ini Ramadan pertama saya jauh dari keluarga.
    answers_meaning:
      ar_eg: ["ده أول رمضان ليّا بعيد عن أهلي.", "ده أول رمضان أقضيه بعيد عن عيلتي."]
      ar: ["هذا أول رمضان لي بعيدًا عن عائلتي.", "هذا أول رمضان أقضيه بعيدًا عن أهلي."]
      en: ["This is my first Ramadan far from my family.", "This is my first Ramadan away from my family."]
  - id: q05
    type: multiple_choice
    question_meaning:
      ar_eg: بايو عايز يشتغل ليه؟
      ar: لماذا يريد بايو أن يعمل؟
      en: Why does Bayu want to work?
    options: ["untuk membeli gendang baru", "untuk tiket ke Kairo", "untuk membeli fanous"]
    answer: 1
next:
  ar_eg: بايو لقى شغلانة! قدّام الوارونج كل يوم العصر... بس ليه هو محتاج فلوس كده؟ ومين تاني بيشتغل زيادة عن اللزوم؟
  ar: وجد بايو عملًا! أمام الوارونغ كل عصر... لكن لماذا يحتاج المال إلى هذا الحدّ؟ ومن غيره يعمل أكثر من اللازم؟
  en: Bayu has found a job! In front of the warung every afternoon... but why does he need money so badly? And who else is working far too hard?
