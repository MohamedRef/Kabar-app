id: sinetron.e103
series: sinetron
episode: 103
language: jv
level: j6
unlock_after: j6.u02
title:
  target: Wulu, suku, taling
  ar_eg: علامات الحركات
  ar: علامات الحركات
  en: The vowel marks
summary:
  ar_eg: في جامع كوتاجيدي الكبير، أقدم جامع في مملكة ماتارام، پاك سلامت بيعلّم كريم إن الحركات في الحروف الجاوي علامات صغيّرة فوق وتحت وجنب الحرف - زي الكسرة والضمّة. وكريم بيقرا أول كلمات ليه - soto، kopi، buku... وجدول الدروس على باب الجامع.
  ar: في مسجد كوتاغيدي الكبير، أقدم مساجد مملكة ماتارام، يعلّم باك سلامت كريمًا أنّ الحركات في الحروف الجاوية علامات صغيرة فوق الحرف وتحته وبجانبه - كالكسرة والضمّة. ويقرأ كريم أولى كلماته - soto وkopi وbuku... وجدول الدروس على باب المسجد.
  en: At the Kotagede Grand Mosque, the oldest in the Mataram kingdom, Pak Slamet teaches Karim that Javanese vowels are small marks above, below and beside the letter - like kasra and damma. Karim reads his first words - soto, kopi, buku... and the class timetable on the mosque door.
cast: [Karim, Pak Slamet]
scenes:
  - setting:
      ar_eg: بوّابة جامع كوتاجيدي الكبير، العصر. بوّابة طوب أحمر بشكل هندوسي-جاوي قديم. جنبها لوحة خشب مكتوب عليها بحروف جاوي.
      ar: بوّابة مسجد كوتاغيدي الكبير، عصرًا. بوّابة من الطوب الأحمر على الطراز الهندوسيّ-الجاويّ القديم. وبجانبها لوحة خشبية مكتوبة بالحروف الجاوية.
      en: The gate of the Kotagede Grand Mosque, late afternoon. A red-brick gate in old Hindu-Javanese style. Beside it, a wooden board written in Javanese script.
    lines:
      - speaker: Pak Slamet
        text: Mas, masjid punika ingkang paling sepuh ing Mataram. Gapuranipun kados candhi, kados menara ing Kudus.
        ar_eg: يا ماس، الجامع ده أقدم جامع في ماتارام. بوّابته زي المعبد، زي منارة قدس.
        ar: يا ماس، هذا المسجد أقدم مساجد ماتارام. بوّابته مثل المعبد، كمئذنة قدس.
        en: Mas, this mosque is the oldest in Mataram. Its gate is like a temple, like the minaret in Kudus.
        note:
          ar_eg: "جامع كوتاجيدي الكبير من أواخر القرن الستّاشر، أيام بداية مملكة ماتارام الإسلامية. وبوّابته (paduraksa) على الطراز الجاوي القديم. كلمات: candhi = معبد قديم (زي بوروبودور)."
          ar: "يعود مسجد كوتاغيدي الكبير إلى أواخر القرن السادس عشر، في بدايات مملكة ماتارام الإسلامية. وبوّابته (paduraksa) على الطراز الجاويّ القديم. مفردات: candhi = معبد قديم."
          en: "The Kotagede Grand Mosque dates from the late 16th century, at the start of the Islamic Mataram kingdom. Its gate (paduraksa) is in the old Javanese style. Words: candhi = old temple (like Borobudur)."
      - speaker: Karim
        text: Pak, aksara ing papan punika wonten tandha alit-alit. Menika menapa?
        ar_eg: يا پاك، الحروف اللي على اللوحة دي عليها علامات صغيّرة. دي إيه؟
        ar: يا باك، على حروف هذه اللوحة علامات صغيرة. ما هي؟
        en: Pak, the letters on this board have little marks. What are they?
        note:
          ar_eg: "كلمات: tandha = علامة، إشارة."
          ar: "مفردات: tandha = علامة."
          en: "Words: tandha = sign, mark."
      - speaker: Pak Slamet
        text: Menika sandhangan swara. Kados harakat ing basa Arab.
        ar_eg: دي «علامات الحركات». زي الحركات في العربي.
        ar: هذه «علامات الحركات». مثل الحركات في العربية.
        en: Those are the vowel marks. Like harakat in Arabic.
        note:
          ar_eg: "كلمات: swara = صوت (sandhangan swara = علامات الحركات)."
          ar: "مفردات: swara = صوت (sandhangan swara = علامات الحركات)."
          en: "Words: swara = sound, voice (sandhangan swara = vowel marks)."
      - speaker: Pak Slamet
        text: Wulu ing nginggil, "i". Suku ing ngandhap, "u". Taling ing ngajeng, "é". Pepet ing nginggil, "ê".
        ar_eg: الـwulu فوق، «i». الـsuku تحت، «u». الـtaling قدّام، «é». الـpepet فوق، «ê» (زي الكسرة المكتومة).
        ar: الـwulu فوق، «i». والـsuku تحت، «u». والـtaling أمام الحرف، «é». والـpepet فوق، «ê» (صوت مبهم).
        en: Wulu on top, "i". Suku underneath, "u". Taling in front, "é". Pepet on top, "ê".
        note:
          ar_eg: "ꦏꦶ = ki (wulu فوق)، ꦏꦸ = ku (suku تحت)، ꦏꦺ = ké (taling قبل الحرف)، ꦏꦼ = kê (pepet فوق، صوت مبهم زي اللي في «sega»)، ꦏꦺꦴ = ko (taling + tarung، الحرف بين علامتين). كلمات: nginggil = فوق (كراما)."
          ar: "ꦏꦶ = ki (wulu فوق)، ꦏꦸ = ku (suku تحت)، ꦏꦺ = ké (taling قبل الحرف)، ꦏꦼ = kê (pepet فوق، صوت مبهم كالذي في «sega»)، ꦏꦺꦴ = ko (taling + tarung، الحرف بين علامتين). مفردات: nginggil = فوق (كراما)."
          en: "ꦏꦶ = ki (wulu above), ꦏꦸ = ku (suku below), ꦏꦺ = ké (taling before the letter), ꦏꦼ = kê (pepet above, the neutral vowel in \"sega\"), ꦏꦺꦴ = ko (taling + tarung, the letter between two marks). Words: nginggil = above, on top (krama)."
      - speaker: Karim
        text: Lajeng "o"?
        ar_eg: طب و«o»؟
        ar: و«o» إذن؟
        en: And "o"?
      - speaker: Pak Slamet
        text: '"O" punika taling tarung. Aksara dipunapit kalih tandha. Kados tiyang dipunrangkul.'
        ar_eg: «o» هي taling tarung. الحرف بيبقى بين علامتين. زي واحد حدّ واخده في حضنه.
        ar: «o» هي taling tarung. يكون الحرف بين علامتين. كشخص يحتضنه أحدهم.
        en: '"O" is taling tarung. The letter sits between two marks. Like someone being hugged.'
        note:
          ar_eg: "كلمات: dipunapit = محطوط بين اتنين (كراما)؛ dipunrangkul = اتحضن (كراما)."
          ar: "مفردات: dipunapit = محاط من الجانبين؛ dipunrangkul = احتُضن (كراما)."
          en: "Words: dipunapit = flanked, between two (krama); dipunrangkul = hugged (krama)."
  - setting:
      ar_eg: على باب الجامع، ورقة جدول الدروس بالحروف الجاوي. كريم بيقرا بصوت عالي وصباعه ماشي على الحروف.
      ar: على باب المسجد ورقة جدول الدروس بالحروف الجاوية. يقرأ كريم بصوت عالٍ وإصبعه يتتبّع الحروف.
      en: On the mosque door, the class timetable in Javanese script. Karim reads aloud, his finger following the letters.
    lines:
      - speaker: Karim
        text: Ja... dwal... ngaji. "Jadwal ngaji!"
        ar_eg: جا... دوال... نجاجي. «جدول التحفيظ!»
        ar: جا... دوال... نغاجي. «جدول تعلّم القرآن!»
        en: Ja... dwal... ngaji. "Qur'an class timetable!"
        note:
          ar_eg: ngaji = يتعلّم قراية القرآن أو يحضر درس دين. كلمة بتتقال في كل جاوة.
          ar: ngaji = يتعلّم قراءة القرآن أو يحضر درسًا دينيًّا. كلمة تقال في كلّ جاوة.
          en: ngaji = learn to recite the Qur'an or attend a religious class. You hear it all over Java.
      - speaker: Karim
        text: Senen... Rebo... Setu. Ba'da Asar!
        ar_eg: الاتنين... الأربع... السبت. بعد العصر!
        ar: الاثنين... الأربعاء... السبت. بعد العصر!
        en: Monday... Wednesday... Saturday. After the afternoon prayer!
        note:
          ar_eg: "ba'da = بعد (من العربي). ba'da Asar = بعد صلاة العصر."
          ar: "ba'da = بعد (من العربية). ba'da Asar = بعد صلاة العصر."
          en: "ba'da = after (from Arabic). ba'da Asar = after the Asr prayer."
      - speaker: Pak Slamet
        text: Sae sanget! Sakmenika kula serat tembung, sampeyan waos.
        ar_eg: حلو أوي! دلوقتي أنا هكتب كلمات، وانت تقرا.
        ar: ممتاز! الآن سأكتب كلمات، وأنت تقرأ.
        en: Excellent! Now I'll write words, and you read.
        note:
          ar_eg: "كلمات: sakmenika = دلوقتي."
          ar: "مفردات: sakmenika = الآن."
          en: "Words: sakmenika = now."
      - speaker: Karim
        text: ꦱꦺꦴꦠꦺꦴ... soto! ꦏꦺꦴꦥꦶ... kopi! ꦧꦸꦏꦸ... buku!
        ar_eg: سوتو! كوپي! بوكو!
        ar: سوتو! كوبي! بوكو!
        en: Soto! Kopi! Buku!
        note:
          ar_eg: ꦱꦺꦴꦠꦺꦴ = soto (sa وta، كل واحد بين taling وtarung). ꦏꦺꦴꦥꦶ = kopi. ꦧꦸꦏꦸ = buku (suku تحت الاتنين).
          ar: ꦱꦺꦴꦠꦺꦴ = soto (sa وta، كلّ منهما بين taling وtarung). ꦏꦺꦴꦥꦶ = kopi. ꦧꦸꦏꦸ = buku (suku تحت الحرفين).
          en: ꦱꦺꦴꦠꦺꦴ = soto (sa and ta, each between taling and tarung). ꦏꦺꦴꦥꦶ = kopi. ꦧꦸꦏꦸ = buku (suku under both).
      - speaker: Pak Slamet
        text: Lho, sampun saged! Mangke kula traktir soto, kangge hadiah.
        ar_eg: يا سلام، بقيت تعرف! بعدين هعزمك على سوتو، هدية.
        ar: رائع، صرت تستطيع! سأدعوك لاحقًا إلى السوتو، هديةً.
        en: Well, you've got it! Later I'll treat you to soto, as a prize.
new_words:
  - word: sandhangan swara
    pos: noun
    ar_eg: علامات الحركات
    ar: علامات الحركات
    en: vowel marks
  - word: suku
    pos: noun
    ar_eg: علامة u (تحت)
    ar: علامة u (تحت)
    en: the u mark (below)
  - word: taling
    pos: noun
    ar_eg: علامة é (قدّام)
    ar: علامة é (أمام)
    en: the é mark (in front)
  - word: pepet
    pos: noun
    ar_eg: علامة ê المبهمة (فوق)
    ar: علامة ê المبهمة (فوق)
    en: the ê mark (above)
  - word: taling tarung
    pos: noun
    ar_eg: علامة o (الحرف بين علامتين)
    ar: علامة o (الحرف بين علامتين)
    en: the o marks (around the letter)
  - word: ngaji
    pos: verb
    ar_eg: يتعلّم القرآن / يحضر درس دين
    ar: يتعلّم القرآن / يحضر درسًا دينيًّا
    en: study the Qur'an
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: علامة «u» بتتحطّ فين؟
      ar: أين توضع علامة «u»؟
      en: Where does the "u" mark go?
    options: ["ing nginggil", "ing ngandhap", "ing ngajeng"]
    answer: 1
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: ꦏꦺꦴꦥꦶ بتتقري إزاي؟
      ar: كيف تُقرأ ꦏꦺꦴꦥꦶ؟
      en: How do you read ꦏꦺꦴꦥꦶ?
    options: ["kapi", "kopi", "kupi"]
    answer: 1
  - id: q03
    type: fill_blank
    sentence: Menika sandhangan swara. Kados ___ ing basa Arab.
    meaning:
      ar_eg: دي علامات الحركات. زي الحركات في العربي.
      ar: هذه علامات الحركات. مثل الحركات في العربية.
      en: Those are the vowel marks. Like harakat in Arabic.
    answers: [harakat]
    options: ["harakat", "huruf", "angka"]
  - id: q04
    type: translate
    direction: from_target
    source_text: Sakmenika kula serat tembung, sampeyan waos.
    answers_meaning:
      ar_eg: ["دلوقتي أنا هكتب كلمات، وانت تقرا.", "أنا أكتب الكلمات وانت تقراها."]
      ar: ["الآن سأكتب كلمات، وأنت تقرأ."]
      en: ["Now I'll write words, and you read.", "I'll write words now; you read them."]
next:
  ar_eg: مقابر ملوك ماتارام. ممنوع تدخل غير بلبس جاوي تقليدي... وكريم لازم يقرا لوحة القواعد، وفيها حروف بتقفل آخر الكلمة - ng، r، h.
  ar: مقابر ملوك ماتارام. ممنوع الدخول إلّا باللباس الجاويّ التقليديّ... وعلى كريم أن يقرأ لوحة القواعد، وفيها علامات تُغلق آخر الكلمة - ng وr وh.
  en: The royal graves of Mataram. No entry except in traditional Javanese dress... and Karim has to read the rules board, full of marks that close a syllable - ng, r, h.
review:
  status: draft
  verified: false
  notes: Check the aksara strings ꦱꦺꦴꦠꦺꦴ, ꦏꦺꦴꦥꦶ, ꦧꦸꦏꦸ and the vowel examples in a Javanese font. The line with aksara text will be read by TTS - confirm the jv voice handles or skips the script. Mosque date per j6.u02 (1587-1589).
