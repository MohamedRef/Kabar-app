language: jv
level: j1
unlock_after: j1.u06
title:
  target: Nang endi, Pak?
  ar_eg: فين يا عمّ؟
  ar: أين يا عمّ؟
  en: Where to, sir?
summary:
  ar_eg: كريم تايه في وونوكرومو، ورايح جنينة حيوانات سورابايا يقابل هيرو. راجل بيركّن العربيات بيوصفله الطريق - قدّام، ورا، شمال، يمين... هنا، هناك، وهناك بعيد. وعند البوّابة مستنّيهم تمثال قرش وتمساح.
  ar: كريم تائه في وونوكرومو في طريقه إلى حديقة حيوان سورابايا للقاء هيرو. يصف له منظّم المواقف الطريق - أمام، وخلف، ويسار، ويمين... هنا، وهناك، وهناك بعيدًا. وعند البوّابة ينتظرهما تمثال قرش وتمساح.
  en: Karim is lost in Wonokromo on his way to Surabaya Zoo to meet Heru. A parking attendant gives him directions - ahead, behind, left, right... here, there, and over there. At the gate, a statue of a shark and a crocodile awaits.
cast: [Karim, Bapak, Cak Heru]
scenes:
  - setting:
      ar_eg: تقاطع زحمة في وونوكرومو، الصبح. موتوسيكلات في كل حتّة. راجل كبير بصفّارة بيركّن العربيات.
      ar: تقاطع مزدحم في وونوكرومو، صباحًا. درّاجات نارية في كلّ مكان. رجل مسنّ يحمل صفّارة ينظّم وقوف السيّارات.
      en: A busy junction in Wonokromo, in the morning. Motorbikes everywhere. An older man with a whistle is directing parking.
    lines:
      - speaker: Karim
        text: Nuwun sewu, Pak. Kebun binatang nang endi?
        ar_eg: لا مؤاخذة يا عمّ. جنينة الحيوانات فين؟
        ar: عذرًا يا عمّ. أين حديقة الحيوان؟
        en: Excuse me, sir. Where's the zoo?
        note:
          ar_eg: nang endi (أو nang ngendi) = فين / رايح فين. وNuwun sewu = «لا مؤاخذة»، أدب في أول السؤال.
          ar: nang endi (أو nang ngendi) = أين / إلى أين. وNuwun sewu = «عذرًا»، أدب في أوّل السؤال.
          en: nang endi (or nang ngendi) = where / where to. Nuwun sewu = "excuse me", a polite opener.
      - speaker: Bapak
        text: Kebun binatang? Ora adoh, Mas. Saka kene mlaku limang menit.
        ar_eg: جنينة الحيوانات؟ مش بعيد يا ابني. من هنا خمس دقايق مشي.
        ar: حديقة الحيوان؟ ليست بعيدة يا بنيّ. من هنا خمس دقائق مشيًا.
        en: The zoo? Not far, son. Five minutes' walk from here.
      - speaker: Bapak
        text: Terus wae, terus ngiwa nang lampu abang. Kebun binatang nang ngarepmu.
        ar_eg: امشي على طول، وبعدين شمال عند الإشارة الحمرا. الجنينة هتبقى قدّامك.
        ar: امشِ مباشرة، ثمّ انعطف يسارًا عند الإشارة الحمراء. ستكون الحديقة أمامك.
        en: Keep going straight, then left at the red light. The zoo will be in front of you.
        note:
          ar_eg: ngiwa = شمال، nengen = يمين، ngarep = قدّام، mburi = ورا. وlampu abang = «النور الأحمر» = إشارة المرور.
          ar: ngiwa = يسار، nengen = يمين، ngarep = أمام، mburi = خلف. وlampu abang = «الضوء الأحمر» أي إشارة المرور.
          en: ngiwa = left, nengen = right, ngarep = in front, mburi = behind. lampu abang = "red light", i.e. traffic lights.
      - speaker: Karim
        text: Ngiwa... iki? Utawa iku?
        ar_eg: شمال... دي؟ ولّا دي؟
        ar: يسار... هذا؟ أم ذاك؟
        en: Left... this one? Or that one?
      - speaker: Bapak
        text: Dudu iku, Mas. Kae, sing adoh kana.
        ar_eg: مش دي يا ابني. دي اللي هناك بعيد.
        ar: ليس ذاك يا بنيّ. ذاك البعيد هناك.
        en: Not that one, son. That one, the far one over there.
        note:
          ar_eg: الجاوي عنده تلات درجات للمسافة - iki (ده، جنبي)، iku أو kuwi (ده، جنبك)، kae (ده اللي بعيد). وزيّهم kene (هنا)، kono (هناك)، kana (هناك بعيد).
          ar: للجاوية ثلاث درجات للمسافة - iki (هذا، قربي)، iku أو kuwi (ذاك، قربك)، kae (ذاك البعيد). ومثلها kene (هنا)، kono (هناك)، kana (هناك بعيدًا).
          en: Javanese has three distances - iki (this, near me), iku or kuwi (that, near you), kae (that, far away). Likewise kene (here), kono (there), kana (way over there).
      - speaker: Karim
        text: Kae. Matur nuwun, Pak!
        ar_eg: دي اللي بعيد. متشكّر يا عمّ!
        ar: ذاك البعيد. شكرًا يا عمّ!
        en: That one over there. Thank you, sir!
  - setting:
      ar_eg: قدّام بوّابة جنينة حيوانات سورابايا. تمثال كبير لقرش وتمساح. التليفون بيرنّ - هيرو.
      ar: أمام بوّابة حديقة حيوان سورابايا. تمثال كبير لقرش وتمساح. يرنّ الهاتف - إنه هيرو.
      en: At the gate of Surabaya Zoo. A big statue of a shark and a crocodile. The phone rings - it's Heru.
    lines:
      - speaker: Cak Heru
        text: Rek, koen nang endi?
        ar_eg: يا صاحبي، انت فين؟
        ar: يا صديقي، أين أنت؟
        en: Mate, where are you?
      - speaker: Karim
        text: Aku nang ngarep patung iwak hiu lan baya.
        ar_eg: أنا قدّام تمثال القرش والتمساح.
        ar: أنا أمام تمثال القرش والتمساح.
        en: I'm in front of the shark and crocodile statue.
      - speaker: Cak Heru
        text: Suro lan Boyo! Iku jenenge kutha iki, rek. Aku nang mburimu.
        ar_eg: سورو وبويو! ده اسم المدينة دي يا صاحبي. أنا وراك.
        ar: سورو وبويو! هذا اسم المدينة يا صديقي. أنا خلفك.
        en: Suro and Boyo! That's this city's name, mate. I'm behind you.
        note:
          ar_eg: الحكاية الشعبية بتقول إن اسم سورابايا جاي من خناقة بين القرش (sura) والتمساح (baya). والتمثال ده رمز المدينة.
          ar: تقول الحكاية الشعبية إنّ اسم سورابايا جاء من عراك بين القرش (sura) والتمساح (baya). والتمثال رمز المدينة.
          en: Folk tradition says Surabaya's name comes from a fight between the shark (sura) and the crocodile (baya). The statue is the city's symbol.
      - speaker: Karim
        text: Nang mburiku? Lho! Kowe kok wis nang kene?
        ar_eg: ورايا؟ يا سلام! انت إزاي وصلت هنا قبلي؟
        ar: خلفي؟ عجبًا! كيف وصلت إلى هنا قبلي؟
        en: Behind me? Whoa! How come you're already here?
      - speaker: Cak Heru
        text: Aku saka kono, numpak motor. Kowe saka kana, mlaku. Wkwk!
        ar_eg: أنا جيت من هناك بالموتوسيكل. وانت جيت من هناك بعيد مشي. ههه!
        ar: أنا جئت من هناك على درّاجة نارية. وأنت جئت من هناك البعيد مشيًا. ههه!
        en: I came from there, by motorbike. You came from way over there, on foot. Haha!
      - speaker: Narrator
        text: Kaca enem. Nang, saka, kene, kono, kana. Iki, iku, kae.
        ar_eg: صفحة ستّة. في، من، هنا، هناك، هناك بعيد. ده، ده، ده اللي بعيد.
        ar: الصفحة السادسة. في، من، هنا، هناك، هناك بعيدًا. هذا، ذاك، ذاك البعيد.
        en: Page six. To, from, here, there, way over there. This, that, that one yonder.
new_words:
  - word: nang endi
    ar_eg: فين / رايح فين
    ar: أين / إلى أين
    en: where, where to
  - word: ngiwa
    pos: verb
    ar_eg: يلفّ شمال
    ar: ينعطف يسارًا
    en: turn left
  - word: ngarep
    pos: preposition
    ar_eg: قدّام
    ar: أمام
    en: in front
  - word: mburi
    pos: preposition
    ar_eg: ورا
    ar: خلف
    en: behind
  - word: kae
    pos: pronoun
    ar_eg: ده اللي بعيد
    ar: ذاك البعيد
    en: that (far away)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الراجل قال لكريم يلفّ فين؟
      ar: أين قال الرجل لكريم أن ينعطف؟
      en: Where did the man tell Karim to turn?
    options: ["nengen nang pasar", "ngiwa nang lampu abang", "mburi masjid"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Aku nang ___ patung iwak hiu lan baya.
    meaning:
      ar_eg: أنا قدّام تمثال القرش والتمساح.
      ar: أنا أمام تمثال القرش والتمساح.
      en: I'm in front of the shark and crocodile statue.
    answers: [ngarep]
    options: ["ngarep", "mburi", "kana"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة للحاجة اللي بعيد عنّي وعنك؟
      ar: أيّ كلمة تُقال للشيء البعيد عنّي وعنك؟
      en: Which word is for something far from both of us?
    options: ["iki", "iku", "kae"]
    answer: 2
  - id: q04
    type: translate
    direction: from_target
    source_text: Saka kene mlaku limang menit.
    answers_meaning:
      ar_eg: ["من هنا خمس دقايق مشي.", "خمس دقايق مشي من هنا."]
      ar: ["من هنا خمس دقائق مشيًا.", "خمس دقائق سيرًا من هنا."]
      en: ["Five minutes' walk from here.", "It's a five-minute walk from here."]
next:
  ar_eg: آخر يوم لكريم في سورابايا. هيرو بياخده سوق أتوم يشتري هدايا لعيلة في ماديون... والفصال بالجاوي فنّ.
  ar: آخر يوم لكريم في سورابايا. يأخذه هيرو إلى سوق أتوم ليشتري هدايا لعائلة في ماديون... والمساومة بالجاوية فنّ.
  en: Karim's last day in Surabaya. Heru takes him to Pasar Atom to buy gifts for a family in Madiun... and haggling in Javanese is an art.
review:
