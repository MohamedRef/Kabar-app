schema: kabar.story/v1
id: sinetron.e76
series: sinetron
episode: 76
language: jv
level: j1
unlock_after: j1.u06
title:
  target: Neng ndi, Pak?
  ar_eg: على فين يا عمّ؟
  ar: إلى أين يا عمّ؟
  en: Which way, sir?
summary:
  ar_eg: كريم نزل من ترانس جوجا في پراويروتامان وتاه وهو رايح جنينة حيوانات جمبيرا لوكا يقابل هيرو. سوّاق بيچاك بيوصفله الطريق - قدّام، ورا، شمال، يمين... هنا، هناك، وهناك بعيد - وبيشاور بصباعه الكبير بدل السبّابة.
  ar: نزل كريم من ترانس جوغجا في براويروتامان وضلّ طريقه إلى حديقة حيوان غمبيرا لوكا حيث ينتظره هيرو. يصف له سائق بيتشاك الطريق - أمام، وخلف، ويسار، ويمين... هنا، وهناك، وهناك بعيدًا - ويشير بإبهامه بدل السبّابة.
  en: Karim gets off the Trans Jogja in Prawirotaman and gets lost on his way to Gembira Loka zoo to meet Heru. A becak driver gives him directions - ahead, behind, left, right... here, there, and way over there - pointing with his thumb, not his finger.
cast: [Karim, Bapak, Mas Heru]
scenes:
  - setting:
      ar_eg: شارع پراويروتامان الصبح، كافيهات ورسومات على الحيطان. راجل كبير قاعد على بيچاكه مستنّي زباين.
      ar: شارع براويروتامان صباحًا، مقاهٍ ورسوم على الجدران. رجل مسنّ يجلس على عربة البيتشاك ينتظر الزبائن.
      en: Prawirotaman street in the morning, cafés and murals. An older man sits on his becak waiting for passengers.
    lines:
      - speaker: Karim
        text: Nuwun sewu, Pak. Gembira Loka neng ndi?
        ar_eg: لا مؤاخذة يا عمّ. جمبيرا لوكا فين؟
        ar: عذرًا يا عمّ. أين غمبيرا لوكا؟
        en: Excuse me, sir. Where's Gembira Loka?
        note:
          ar_eg: neng ndi (أو neng endi) = فين / على فين، كلام الشارع في جوجا. وفي الكلام الرسمي شويّة menyang ngendi. وNuwun sewu = «لا مؤاخذة»، أدب في أول السؤال.
          ar: neng ndi (أو neng endi) = أين / إلى أين، كلام الشارع في جوغجا. وفي الكلام الأقرب للرسمي menyang ngendi. وNuwun sewu = «عذرًا»، أدب في أوّل السؤال.
          en: neng ndi (or neng endi) = where / where to, Jogja street speech. In more careful speech, menyang ngendi. Nuwun sewu = "excuse me", a polite opener.
      - speaker: Bapak
        text: Kebun binatang? Ora cedhak, Mas. Numpak becak wae, tak terke.
        ar_eg: جنينة الحيوانات؟ مش قريبة يا ابني. اركب البيچاك وأنا أوصّلك.
        ar: حديقة الحيوان؟ ليست قريبة يا بنيّ. اركب البيتشاك وأوصلك.
        en: The zoo? It's not close, son. Just hop in the becak, I'll take you.
        note:
          ar_eg: "كلمات: numpak = يركب (مواصلة)."
          ar: "مفردات: numpak = يركب (وسيلة نقل)."
          en: "Words: numpak = ride, take (transport) = naik."
      - speaker: Karim
        text: Pira, Pak?
        ar_eg: بكام يا عمّ؟
        ar: بكم يا عمّ؟
        en: How much, sir?
      - speaker: Bapak
        text: Telung puluh ewu. Utawa mlaku, ya isa. Lurus wae, terus ngiwa neng lampu abang.
        ar_eg: تلاتين ألف. ولو عايز تمشي، ينفع برضه. على طول، وبعدين شمال عند الإشارة الحمرا.
        ar: ثلاثون ألفًا. وإن شئت المشي فممكن. مباشرة، ثمّ يسارًا عند الإشارة الحمراء.
        en: Thirty thousand. Or you can walk. Straight on, then left at the red light.
        note:
          ar_eg: "ngiwa = شمال، nengen = يمين، ngarep = قدّام، mburi = ورا. وlampu abang = «النور الأحمر» = إشارة المرور. وفي جوجا بتتّفق على أجرة البيچاك قبل ما تركب. كلمات: ewu = ألف (ribu)؛ sewu = 1000؛ telung = تلات (قبل اسم)؛ utawa = أو."
          ar: "ngiwa = يسار، nengen = يمين، ngarep = أمام، mburi = خلف. وlampu abang = «الضوء الأحمر» أي إشارة المرور. وفي جوغجا يُتّفق على أجرة البيتشاك قبل الركوب. مفردات: ewu = ألف (ribu)؛ sewu = 1000؛ telung = ثلاثة (قبل الاسم)؛ utawa = أو."
          en: "ngiwa = left, nengen = right, ngarep = in front, mburi = behind. lampu abang = \"red light\", i.e. traffic lights. In Jogja you agree a becak fare before you ride. Words: ewu = thousand (ribu); sewu = 1,000; telung = three (before a noun); utawa = or (atau)."
      - speaker: Karim
        text: Ngiwa... sing iki? Utawa sing kuwi?
        ar_eg: شمال... اللي هنا ده؟ ولّا اللي عندك ده؟
        ar: يسارًا... هذا؟ أم ذاك؟
        en: Left... this one? Or that one?
      - speaker: Bapak
        text: Dudu kuwi, Mas. Kae, sing adoh kana.
        ar_eg: مش ده يا ابني. ده اللي هناك بعيد.
        ar: ليس ذاك يا بنيّ. ذاك البعيد هناك.
        en: Not that one, son. That one, the far one over there.
        note:
          ar_eg: "الراجل شاور بصباعه الكبير مش بالسبّابة - ده الأدب في جاوة. وللمسافة تلات درجات - iki (ده، جنبي)، kuwi أو iku (ده، جنبك)، kae (ده اللي بعيد). وزيّهم kene (هنا)، kono (هناك)، kana (هناك بعيد). كلمات: adoh = بعيد (jauh)."
          ar: "أشار الرجل بإبهامه لا بالسبّابة - هذا هو الأدب في جاوة. وللمسافة ثلاث درجات - iki (هذا، قربي)، kuwi أو iku (ذاك، قربك)، kae (ذاك البعيد). ومثلها kene (هنا)، kono (هناك)، kana (هناك بعيدًا). مفردات: adoh = بعيد (jauh)."
          en: "He points with his thumb, not his index finger - that's the polite way in Java. And Javanese has three distances - iki (this, near me), kuwi or iku (that, near you), kae (that, far away). Likewise kene (here), kono (there), kana (way over there). Words: adoh = far (jauh)."
      - speaker: Karim
        text: Kae. Ya wis, aku numpak becak wae. Telung puluh ewu, Pak.
        ar_eg: اللي هناك. خلاص، هركب البيچاك أحسن. تلاتين ألف يا عمّ.
        ar: ذاك البعيد. حسنًا، سأركب البيتشاك. ثلاثون ألفًا يا عمّ.
        en: That one. All right, I'll just take the becak. Thirty thousand, sir.
  - setting:
      ar_eg: قدّام بوّابة جنينة حيوانات جمبيرا لوكا. عيال المدارس طالعين في رحلة. التليفون بيرنّ - هيرو.
      ar: أمام بوّابة حديقة حيوان غمبيرا لوكا. أطفال المدارس في رحلة. يرنّ الهاتف - إنه هيرو.
      en: At the gate of Gembira Loka zoo. School kids on a trip. The phone rings - it's Heru.
    lines:
      - speaker: Mas Heru
        text: Rim, kowe neng ndi?
        ar_eg: يا كريم، انت فين؟
        ar: يا كريم، أين أنت؟
        en: Rim, where are you?
      - speaker: Karim
        text: Aku neng ngarep lawang kebun binatang.
        ar_eg: أنا قدّام باب جنينة الحيوانات.
        ar: أنا أمام باب حديقة الحيوان.
        en: I'm in front of the zoo gate.
      - speaker: Mas Heru
        text: Lho, aku ya neng kene! Aku neng mburimu, to.
        ar_eg: يا سلام، وأنا كمان هنا! أنا وراك أهو.
        ar: عجبًا، وأنا هنا أيضًا! أنا خلفك.
        en: Hey, I'm here too! I'm right behind you.
        note:
          ar_eg: lho = تعجّب «يا سلام!». وto في آخر الجملة بتأكّد - «أهو / مش كده».
          ar: lho للتعجّب. وto في آخر الجملة للتأكيد - «ها أنا / أليس كذلك».
          en: lho = surprise, "hey!". to at the end of a sentence adds emphasis - "you see / right".
      - speaker: Karim
        text: Neng mburiku? Kowe kok wis neng kene?
        ar_eg: ورايا؟ انت إزاي وصلت هنا قبلي؟
        ar: خلفي؟ كيف وصلت إلى هنا قبلي؟
        en: Behind me? How come you're already here?
      - speaker: Mas Heru
        text: Aku saka kono, numpak motor. Kowe saka kana, numpak becak. Wkwk!
        ar_eg: أنا جيت من هناك بالموتوسيكل. وانت جيت من هناك بعيد بالبيچاك. ههه!
        ar: أنا جئت من هناك على درّاجة نارية. وأنت جئت من هناك البعيد بالبيتشاك. ههه!
        en: I came from there, by motorbike. You came from way over there, by becak. Haha!
      - speaker: Narrator
        text: Kaca enem. Neng, saka, kene, kono, kana. Iki, kuwi, kae.
        ar_eg: صفحة ستّة. لـ، من، هنا، هناك، هناك بعيد. ده، ده، ده اللي بعيد.
        ar: الصفحة السادسة. إلى، من، هنا، هناك، هناك بعيدًا. هذا، ذاك، ذاك البعيد.
        en: Page six. To, from, here, there, way over there. This, that, that one yonder.
new_words:
  - word: neng ndi
    ar_eg: فين / على فين
    ar: أين / إلى أين
    en: where, where to
  - word: ngiwa
    pos: verb
    ar_eg: يلفّ شمال
    ar: ينعطف يسارًا
    en: turn left
  - word: ngarep
    pos: preposition
    ar_eg: قدّام
    ar: أمام
    en: in front
  - word: mburi
    pos: preposition
    ar_eg: ورا
    ar: خلف
    en: behind
  - word: kae
    pos: pronoun
    ar_eg: ده اللي بعيد
    ar: ذاك البعيد
    en: that (far away)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الراجل قال لكريم يلفّ فين؟
      ar: أين قال الرجل لكريم أن ينعطف؟
      en: Where did the man tell Karim to turn?
    options: ["nengen neng pasar", "ngiwa neng lampu abang", "mburi masjid"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Aku neng ___ lawang kebun binatang.
    meaning:
      ar_eg: أنا قدّام باب جنينة الحيوانات.
      ar: أنا أمام باب حديقة الحيوان.
      en: I'm in front of the zoo gate.
    answers: [ngarep]
    options: ["ngarep", "mburi", "kana"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة للحاجة اللي بعيد عنّي وعنك؟
      ar: أيّ كلمة تُقال للشيء البعيد عنّي وعنك؟
      en: Which word is for something far from both of us?
    options: ["iki", "kuwi", "kae"]
    answer: 2
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: سوّاق البيچاك شاور بإيه؟ (jempol = الصباع الكبير، driji = صباع، sikil = رِجل)
      ar: بماذا أشار سائق البيتشاك؟ (jempol = الإبهام، driji = إصبع، sikil = رِجل)
      en: What did the becak driver point with? (jempol = thumb, driji = finger, sikil = foot)
    options: ["jempol", "driji", "sikil"]
    answer: 0
next:
  ar_eg: آخر يوم لكريم في جوجا. هيرو بياخده باسار كليتيكان، سوق الحاجات المستعملة، يشتري هديّة لعيلة پاك بودي في ماديون... والفصال بالجاوي فنّ.
  ar: آخر يوم لكريم في جوغجا. يأخذه هيرو إلى سوق كليتيكان للأشياء المستعملة ليشتري هديّة لعائلة باك بودي في ماديون... والمساومة بالجاوية فنّ.
  en: Karim's last day in Jogja. Heru takes him to Pasar Klithikan, the second-hand market, to buy a gift for Pak Budi's family in Madiun... and haggling in Javanese is an art.
review:
  status: draft
  verified: false
  notes: Moved from Wonokromo, Surabaya to Prawirotaman and Gembira Loka, Jogja (Cak Heru → Mas Heru, Arek preposition → neng), 2026-10-27. Check "tak terke" (I'll take you) and the 30,000 becak fare. Thumb-pointing (ngacungke jempol) is standard Javanese etiquette.
