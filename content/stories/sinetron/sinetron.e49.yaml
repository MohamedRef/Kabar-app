questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: إيه غلطة كريم في جملة «Kula sampun dhahar»؟
      ar: ما خطأ كريم في جملة «Kula sampun dhahar»؟
      en: What was Karim's mistake in "Kula sampun dhahar"?
    options: ["Dia memakai kata hormat untuk dirinya sendiri.", "Dia berbicara terlalu pelan.", "Dia lupa mengucapkan salam.", "Dia memakai bahasa Arab."]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Kata "kabar" itu dari bahasa ___.
    meaning:
      ar_eg: كلمة «كابار» دي من العربي.
      ar: كلمة «كابار» من العربية.
      en: The word "kabar" comes from Arabic.
    answers: [Arab]
    options: ["Belanda", "Arab", "Sanskerta"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه باك بودي اتأثّر في رأيك؟
      ar: في رأيك، لماذا تأثّر باك بودي؟
      en: Why do you think Pak Budi was moved?
    options: ["Karena Karim membawa oleh-oleh yang mahal.", "Karena Bayu mendapat nilai bagus.", "Karena Karim, orang asing, berusaha keras menghormatinya dengan bahasanya sendiri.", "Karena warungnya ramai."]
    answer: 2
  - id: q04
    type: listen
    text: Kata-kata dari Arab, Sanskerta, Belanda, Portugis, sama Tionghoa semuanya masuk, duduk, makan, terus jadi keluarga.
    question:
      ar_eg: باك بودي بيشبّه اللغة بإيه؟
      ar: بمَ يشبّه باك بودي اللغة؟
      en: What does Pak Budi compare language to?
    options: ["sebuah sungai", "sebuah warung", "sebuah pasar terapung", "sebuah sekolah"]
    answer: 1
    meaning:
      ar_eg: كلمات من العربي والسنسكريتي والهولندي والبرتغالي والصيني، كلها بتدخل وتقعد وتاكل، وبعدين تبقى من العيلة.
      ar: كلمات من العربية والسنسكريتية والهولندية والبرتغالية والصينية، كلّها تدخل وتجلس وتأكل، ثمّ تصير من أهل البيت.
      en: Words from Arabic, Sanskrit, Dutch, Portuguese and Chinese all come in, sit down, eat, and become family.
  - id: q05
    type: translate
    direction: from_target
    source_text: Bahasa itu kayak warung. Pintunya terbuka buat semua orang.
    answers_meaning:
      ar_eg: ["اللغة زي الوارونج. بابها مفتوح لكل الناس.", "اللغة زي المطعم الصغيّر، بابه مفتوح للكل.", "اللغة شبه الوارونج، بابها مفتوح لأي حدّ."]
      ar: ["اللغة كالوارونغ، بابها مفتوح للجميع.", "اللغة مثل المطعم الصغير، بابه مفتوح لكلّ الناس.", "اللغة كالوارونغ، يُفتح بابها لكلّ أحد."]
      en: ["Language is like a warung. Its door is open to everyone.", "A language is like a small eatery - its door is open to all.", "Language is like a warung; its doors are open to everybody."]
next:
  ar_eg: في باليكبابان، ساري لابسة أحسن بليزر عندها وبتقدّم تقرير مشروعها قدّام المديرين. وفي نفس اللحظة في ماديون، كريم قاعد قدّام باك بودي وبو راهايو، وإيده بتترعش، وبيبدأ بأحسن كراما عنده...
  ar: في باليكبابان ترتدي ساري أفضل سترة لديها وتعرض تقرير مشروعها أمام المديرين. وفي اللحظة نفسها في ماديون يجلس كريم أمام باك بودي وبو راهايو، ويداه ترتجفان، ويبدأ بأفضل ما لديه من الكراما...
  en: In Balikpapan, Sari puts on her best blazer to present her project report to the managers. At that very moment in Madiun, Karim sits before Pak Budi and Bu Rahayu, hands trembling, and begins in his very best krama...
