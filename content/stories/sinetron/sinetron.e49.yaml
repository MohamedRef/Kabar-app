series: sinetron
episode: 49
language: id
level: bipa5
unlock_after: bipa5.u09
title:
  target: Kula Sampun Dhahar
  ar_eg: «أنا اتفضّلت أكلت»
  ar: «لقد تناولتُ - بحضرتي - الطعام»
  en: '"I Have Graciously Dined"'
summary:
  ar_eg: كريم بيظهر على باب الوارونج في ماديون وبيتكلّم جاوي «كراما» قدّام العيلة كلها - وبيغلط غلطات تموّت من الضحك. بس الصبح، في مشية زي زمان، باك بودي بيعترف إنه اتأثّر جدًا. وبيتكلّموا عن الكلمات اللي جاية من العربي، والصحاب المزيّفين... وكريم بيطلب ميعاد «رسمي».
  ar: يظهر كريم على باب الوارونغ في ماديون ويتكلّم الجاوية «كراما» أمام العائلة كلّها - بأخطاء مضحكة جدًّا. لكن في الصباح، في نزهة كما في الأيام الخوالي، يعترف باك بودي بأنّه تأثّر كثيرًا. ويتحدّثون عن الكلمات العربية الأصل والأصدقاء المخادعين... ويطلب كريم موعدًا «رسميًّا».
  en: Karim appears at the warung door in Madiun and speaks krama Javanese in front of the whole family - with hilarious mistakes. But the next morning, on a walk like old times, Pak Budi admits he was deeply moved. They talk about Arabic loanwords and false friends... and Karim asks for a "formal" visit.
cast: [Karim, Pak Budi, Bu Rahayu, Bayu, Mas Joko]
scenes:
  - setting:
      ar_eg: حارة ميلاتي بالليل. الوارونج لسّه قافل. حدّ لابس باتيك مكوي واقف على الباب، ومعاه علبة هدايا من سورابايا.
      ar: زقاق ميلاتي ليلًا. أُغلق الوارونغ للتوّ. شخص بقميص باتيك مكويّ يقف عند الباب، وفي يده علبة هدايا من سورابايا.
      en: Gang Melati at night. The warung has just closed. Someone in a neatly pressed batik shirt stands at the door, holding a box of gifts from Surabaya.
    lines:
      - speaker: Karim
        text: Sugeng dalu, Pak Budi. Sugeng dalu, Bu Rahayu. Kula Karim.
        ar_eg: مساء الخير يا باك بودي. مساء الخير يا بو راهايو. أنا كريم.
        ar: مساء الخير يا باك بودي. مساء الخير يا بو راهايو. أنا كريم.
        en: Good evening, Pak Budi. Good evening, Bu Rahayu. It's Karim.
      - speaker: Pak Budi
        text: Mas... Mas Karim?! Masyaallah! Dari mana Mas belajar bahasa Jawa halus?
        ar_eg: ماس... ماس كريم؟! ما شاء الله! اتعلّمت الجاوي المؤدّب ده منين يا ماس؟
        ar: ماس... ماس كريم؟! ما شاء الله! من أين تعلّمت الجاوية المهذّبة يا ماس؟
        en: Mas... Mas Karim?! Masyaallah! Where did you learn polite Javanese?
      - speaker: Karim
        text: Saking aplikasi, Pak. Wonten Kairo. Saben dalu.
        ar_eg: من تطبيق يا باك. في القاهرة. كل ليلة.
        ar: من تطبيق يا باك. في القاهرة. كلّ ليلة.
        en: From an app, Pak. In Cairo. Every night.
        note:
          ar_eg: 'كلمات كراما: saking (من)، wonten (في / فيه)، saben dalu (كل ليلة). بالإندونيسي: dari aplikasi, di Kairo, setiap malam.'
          ar: 'من مفردات الكراما: saking (من)، wonten (في)، saben dalu (كلّ ليلة). وبالإندونيسية: dari aplikasi, di Kairo, setiap malam.'
          en: 'Krama words: saking (from), wonten (in, at), saben dalu (every night). In Indonesian: dari aplikasi, di Kairo, setiap malam.'
      - speaker: Bu Rahayu
        text: Ayo masuk, Mas, masuk! Bayu, Mas Joko, lihat siapa yang datang!
        ar_eg: اتفضّل ادخل يا ماس، ادخل! يا بايو، يا ماس جوكو، تعالوا شوفوا مين جه!
        ar: تفضّل بالدخول يا ماس! يا بايو، يا ماس جوكو، انظرا من جاء!
        en: Come in, Mas, come in! Bayu, Mas Joko, look who's here!
      - speaker: Pak Budi
        text: Mangga, Mas, dipundhahar. Masih ada pecel sedikit.
        ar_eg: اتفضّل يا ماس، كُل. لسّه فيه شوية بيتشيل.
        ar: تفضّل يا ماس، كُل. ما زال هناك قليل من البيتشيل.
        en: Please, Mas, do eat. There's still a little pecel left.
        note:
          ar_eg: باك بودي بيستعمل dhahar، وده فعل «ياكل» بالكراما إنغيل - كلمة تكريم للضيف. الجاوي عنده كلمات مختلفة لنفس الفعل - mangan (عادي)، nedha (مؤدّب، وتقولها عن نفسك)، dhahar (تكريم للي قدّامك).
          ar: يستعمل باك بودي dhahar، وهي فعل «أكل» بالكراما إنغيل - لفظ تكريم للضيف. فللجاوية ألفاظ مختلفة للفعل نفسه - mangan (عاديّ)، nedha (مهذّب، تقوله عن نفسك)، dhahar (تكريم للمخاطَب).
          en: Pak Budi uses dhahar, the krama inggil (honorific) verb "to eat", to honour his guest. Javanese has different words for the same verb - mangan (plain), nedha (polite, used of yourself) and dhahar (honouring the other person).
      - speaker: Karim
        text: Matur nuwun, Pak. Kula sampun dhahar wonten Surabaya.
        ar_eg: متشكّر يا باك. أنا اتفضّلت أكلت في سورابايا.
        ar: شكرًا يا باك. لقد تناولتُ - بحضرتي - الطعام في سورابايا.
        en: Thank you, Pak. I have graciously dined in Surabaya.
      - speaker: Narrator
        text: Pak Budi, Bu Rahayu, dan Mas Joko saling memandang. Lalu Pak Budi tertawa sampai matanya berair.
        ar_eg: باك بودي وبو راهايو وماس جوكو بصّوا لبعض. وبعدين باك بودي ضحك لحد ما عينيه دمّعت.
        ar: تبادل باك بودي وبو راهايو وماس جوكو النظرات، ثمّ ضحك باك بودي حتى دمعت عيناه.
        en: Pak Budi, Bu Rahayu and Mas Joko look at each other. Then Pak Budi laughs until his eyes water.
      - speaker: Pak Budi
        text: Aduh, Mas. "Dhahar" itu buat orang yang kita hormati, bukan buat diri sendiri. Buat diri sendiri, "nedha". Tadi Mas bilang, kira-kira, "Saya yang mulia sudah bersantap."
        ar_eg: يا خبر يا ماس. «داهار» دي للي بنحترمه، مش ليك إنت. عن نفسك تقول «نيدا». إنت قلت تقريبًا - «أنا، سموّي، تناولت الطعام».
        ar: يا إلهي يا ماس. «داهار» لمن نوقّره، لا للمرء نفسه. وعن نفسك تقول «نيدا». لقد قلتَ ما معناه «أنا - صاحب السموّ - تناولتُ الطعام».
        en: Oh dear, Mas. "Dhahar" is for people we honour, not for yourself. For yourself, it's "nedha". What you just said was roughly, "I, Your Excellency, have dined."
        note:
          ar_eg: القاعدة الذهبية في الكراما - كلمات التكريم (krama inggil) عمرها ما تتقال عن نفسك. زي ما المصري عمره ما يقول «حضرتي» عن نفسه. buat = untuk، bilang = قال، kira-kira = حاجة زي كده، bersantap = «تناول الطعام» (رسمي جدًّا - ودي النكتة).
          ar: القاعدة الذهبية في الكراما - ألفاظ التكريم (krama inggil) لا تُقال عن النفس أبدًا، كما لا يقول المصري «حضرتي» عن نفسه. buat = untuk، bilang = قال، kira-kira = ما معناه تقريبًا، bersantap = «تناول الطعام» (رسمية جدًّا - وهنا النكتة).
          en: The golden rule of krama - honorific (krama inggil) words are never used about yourself. Just as an Egyptian would never call himself "hadreti" ("my honour"). buat = untuk, bilang = said, kira-kira = roughly, bersantap = to dine (very formal - that is the joke).
      - speaker: Karim
        text: Kula nyuwun pangapunten, Pak...
        ar_eg: أنا بعتذر لحضرتك يا باك...
        ar: أرجو المعذرة يا باك...
        en: I beg your pardon, Pak...
      - speaker: Karim
        text: Bu Rahayu, panjenengan sampun... sare?
        ar_eg: بو راهايو، حضرتك... نمتي؟
        ar: بو راهايو، هل... نمتِ؟
        en: Bu Rahayu, have you... slept yet?
      - speaker: Bu Rahayu
        text: Sare? Belum, Mas! Kalau Ibu udah tidur, siapa yang bukain pintu tadi? Mas mau nanya Ibu udah makan apa belum, ya?
        ar_eg: نمت؟ لسّه يا ماس! لو كنت نايمة، مين اللي فتحلك الباب؟ إنت عايز تسألني أكلت ولا لأ، صح؟
        ar: نمتُ؟ ليس بعد يا ماس! لو كنتُ نائمة فمن فتح لك الباب؟ أردتَ أن تسأل هل أكلتُ، أليس كذلك؟
        en: Slept? Not yet, Mas! If I were asleep, who'd have opened the door for you? You meant to ask if I'd eaten, didn't you?
        note:
          ar_eg: udah = sudah، bukain = membukakan (فتح لـ)، nanya = bertanya، apa belum = atau belum.
          ar: udah = sudah، bukain = membukakan (فتح لـ)، nanya = bertanya، apa belum = atau belum.
          en: udah = sudah, bukain = membukakan (open for someone), nanya = bertanya, apa belum = atau belum (or not yet).
      - speaker: Bayu
        text: Mas Karim, kosakata krama-mu enam puluh persen. Tapi niatnya seratus persen.
        ar_eg: يا ماس كريم، كلماتك الكراما ستّين في المية. بس نيّتك مية في المية.
        ar: يا ماس كريم، مفرداتك من الكراما بنسبة ستّين بالمئة، لكنّ نيّتك مئة بالمئة.
        en: Mas Karim, your krama vocabulary is sixty per cent. But your intentions are a hundred.
        note:
          ar_eg: niat = نيّة، seratus = مية. krama = الجاوي المؤدّب.
          ar: niat = نيّة، seratus = مئة. krama = الجاوية المهذّبة.
          en: niat = intention, seratus = a hundred. krama = polite Javanese.
      - speaker: Mas Joko
        text: Kalau krama saya, Mas, cuma sepuluh persen. Jadi Mas Karim udah lebih Jawa daripada saya.
        ar_eg: وأنا الكراما بتاعي يا ماس عشرة في المية بس. يعني ماس كريم بقى جاوي أكتر منّي.
        ar: أمّا الكراما عندي يا ماس فعشرة بالمئة فقط. إذن صار ماس كريم جاويًّا أكثر منّي.
        en: And my krama's only ten per cent, Mas. So Mas Karim's already more Javanese than I am.
        note:
          ar_eg: cuma = hanya، udah = sudah. krama = الجاوي المؤدّب.
          ar: cuma = hanya، udah = sudah. krama = الجاوية المهذّبة.
          en: cuma = hanya (only), udah = sudah. krama = polite Javanese.
  - setting:
      ar_eg: الصبح بدري. زي زمان، باك بودي وكريم وبايو بيتمشّوا جنب الغيطان على طرف ماديون. الضباب لسّه فوق الرز.
      ar: الصباح الباكر. كما في الأيّام الخوالي، يتمشّى باك بودي وكريم وبايو بجانب حقول الأرزّ عند أطراف ماديون، والضباب ما زال فوق الحقول.
      en: Early morning. Like old times, Pak Budi, Karim and Bayu walk past the rice fields on the edge of Madiun. Mist still hangs over the paddies.
    lines:
      - speaker: Pak Budi
        text: Mas Karim, tadi malam Bapak ketawa. Tapi sebenernya Bapak terharu. Sekarang banyak anak muda Jawa yang udah nggak bisa krama. Tapi Mas, orang Mesir, malah belajar tiap malam buat Bapak.
        ar_eg: يا ماس كريم، إمبارح بالليل ضحكت. بس الحقيقة أنا اتأثّرت جدًا. دلوقتي شباب جاويين كتير مبقوش يعرفوا كراما. وإنت، واحد مصري، بتتعلّم كل ليلة عشاني.
        ar: يا ماس كريم، ضحكتُ البارحة، لكنّي في الحقيقة تأثّرت كثيرًا. فكثير من شباب جاوة اليوم لم يعودوا يحسنون الكراما، وأنت - المصريّ - تتعلّم كلّ ليلة من أجلي.
        en: Mas Karim, last night I laughed. But really, I was moved. These days lots of young Javanese can't speak krama any more. And you, an Egyptian, studied every night for me.
        note:
          ar_eg: ketawa = tertawa، sebenernya = sebenarnya، tiap = setiap، buat = untuk. terharu = اتأثّر، krama = الجاوي المؤدّب. malah = «بالعكس/ده كمان» (حاجة عكس المتوقّع)، udah = sudah.
          ar: ketawa = tertawa، sebenernya = sebenarnya، tiap = setiap، buat = untuk. terharu = تأثّر، krama = الجاوية المهذّبة. malah = «بل على العكس»، udah = sudah.
          en: ketawa = tertawa, sebenernya = sebenarnya, tiap = setiap, buat = untuk. terharu = moved, krama = polite Javanese. malah = instead, of all people (against expectation), udah = sudah.
      - speaker: Bayu
        text: Itu nyindir aku, ya, Pak? Krama-ku emang kalah sama Mas Karim. Di sekolah, kami lebih sering pakai bahasa gaul. "Mager", "santuy"...
        ar_eg: إنت بتلقّح عليّا يا بابا، صح؟ الكراما بتاعي فعلًا أضعف من ماس كريم. في المدرسة بنتكلّم لغة الشباب أكتر - «ماجير»، «سانتوي»...
        ar: أنت تُعرّض بي يا أبي، أليس كذلك؟ الكراما عندي أضعف فعلًا ممّا عند ماس كريم. ففي المدرسة نستعمل لغة الشباب أكثر - «ماغير» و«سانتوي»...
        en: That's a dig at me, isn't it, Dad? My krama really is worse than Mas Karim's. At school we mostly use slang. "Mager", "santuy"...
        note:
          ar_eg: bahasa gaul لغة الشباب - mager اختصار malas gerak (كسلان أتحرّك)، وsantuy يعني santai (روّق). وbahasa baku هي الإندونيسي الفصيح بتاع الكتب والأخبار. ولغات المناطق زي الجاوي بتضعف عند الشباب في المدن. nyindir = menyindir (يلقّح الكلام)، emang = memang، kalah sama = kalah dari.
          ar: bahasa gaul لغة الشباب - mager اختصار malas gerak (كسول عن الحركة)، وsantuy تحريف santai (استرخِ). أمّا bahasa baku فهي الإندونيسية المعيارية في الكتب والأخبار. وتتراجع لغات الأقاليم كالجاوية بين شباب المدن. nyindir = menyindir (يعرّض بالكلام)، emang = memang، kalah sama = kalah dari.
          en: bahasa gaul is youth slang - mager is short for malas gerak ("too lazy to move"), santuy is a play on santai ("chill"). bahasa baku is standard Indonesian, as in books and the news. Regional languages like Javanese are weakening among urban youth. nyindir = menyindir (have a dig at), emang = memang, kalah sama = kalah dari (lose to).
      - speaker: Karim
        text: Tapi aku nemu sesuatu yang lucu. "Pripun kabaripun" - kata "kabar" itu dari bahasa Arab, "khabar"! Aku belajar bahasa Jawa, eh ternyata bahasa Arab udah nungguin di dalamnya.
        ar_eg: بس أنا لقيت حاجة تضحّك. «بريبون كاباريبون» - كلمة «كابار» دي من العربي «خبر»! أنا بتعلّم جاوي، وطلع العربي مستنّيني جوّاه.
        ar: لكنّني اكتشفتُ أمرًا طريفًا. «بريبون كابارِيبون» - كلمة «كابار» من العربية «خبر»! أتعلّم الجاوية، فإذا العربية تنتظرني في داخلها.
        en: But I found something funny. "Pripun kabaripun" - the word "kabar" comes from Arabic "khabar"! I set out to learn Javanese, and Arabic was already waiting inside it.
        note:
          ar_eg: kabar (خبر) موجودة في الإندونيسي والجاوي الاتنين - وهي كمان اسم التطبيق اللي إنت بتتعلّم بيه دلوقتي! وكلمات تانية من العربي - kursi (كرسي)، waktu (وقت)، ilmu (علم)، kitab (كتاب). nemu = menemukan (لقيت)، nungguin = menunggu (مستنّي)، udah = sudah.
          ar: kabar (خبر) موجودة في الإندونيسية والجاوية كلتيهما - وهي أيضًا اسم التطبيق الذي تتعلّم به الآن! ومن الكلمات العربية الأخرى - kursi (كرسيّ)، waktu (وقت)، ilmu (علم)، kitab (كتاب). nemu = menemukan (وجدتُ)، nungguin = menunggu (ينتظر)، udah = sudah.
          en: kabar (خبر, news) exists in both Indonesian and Javanese - and it's the name of the app you're learning with right now! Other Arabic loans include kursi (chair), waktu (time), ilmu (knowledge) and kitab (book). nemu = menemukan (find), nungguin = menunggu (wait for), udah = sudah.
      - speaker: Bayu
        text: Hati-hati lho, Mas. Ada juga kata yang menipu. "Kalimat" dalam bahasa Indonesia artinya rangkaian kata, bukan satu kata. Dan "ahli" artinya orang yang pandai, bukan keluarga.
        ar_eg: خلّي بالك يا ماس. فيه كلمات بتضحك عليك. «كاليمات» بالإندونيسي معناها جملة، مش كلمة واحدة. و«آهلي» معناها خبير، مش أهل.
        ar: انتبه يا ماس. ثمّة كلمات خادعة. فـ«كاليمات» في الإندونيسية تعني جملة لا كلمة واحدة، و«أهلي» تعني الخبير لا الأهل.
        en: Careful, Mas. Some words are tricky. "Kalimat" in Indonesian means a sentence, not a single word. And "ahli" means an expert, not your family.
        note:
          ar_eg: «أصحاب مزيّفين» (false friends) - kalimat (جملة، مش «كلمة»)، ahli (خبير، مش «أهل»)، والأصل عربي، بس المعنى اتنقل. pandai = شاطر.
          ar: «أصدقاء مخادعون» (false friends) - kalimat (جملة لا «كلمة»)، وahli (خبير لا «أهل»). الأصل عربيّ، لكنّ المعنى انتقل. pandai = ماهر.
          en: False friends - kalimat (a sentence, not "a word") and ahli (an expert, not "family"). The roots are Arabic, but the meanings have shifted. pandai = clever, skilled.
      - speaker: Karim
        text: Pantesan! Dulu aku bilang ke pemilik toko di Madiun, "Ahli saya di Kairo." Dia kira keluargaku profesor semua.
        ar_eg: عشان كده! مرّة قلت لصاحب محلّ في ماديون «أهلي في القاهرة». افتكر إن عيلتي كلها بروفيسورات.
        ar: لهذا إذن! قلتُ مرّة لصاحب متجر في ماديون «أهلي في القاهرة»، فظنّ أنّ أسرتي كلّها أساتذة جامعيّون.
        en: That explains it! I once told a shopkeeper in Madiun, "My ahli are in Cairo." He thought my whole family were professors.
        note:
          ar_eg: pantesan = pantas (عشان كده!)، bilang ke = berkata kepada، kira = فاكر، pemilik = صاحب.
          ar: pantesan = pantas (لا عجب!)، bilang ke = berkata kepada، kira = ظنّ، pemilik = صاحب.
          en: pantesan = pantas (no wonder!), bilang ke = berkata kepada, kira = thought, pemilik = owner.
      - speaker: Pak Budi
        text: Bahasa itu kayak warung, Mas. Pintunya terbuka buat semua orang. Kata-kata dari Arab, Sanskerta, Belanda, Portugis, sama Tionghoa semuanya masuk, duduk, makan, terus jadi keluarga.
        ar_eg: اللغة زي الوارونج يا ماس. بابها مفتوح لكل الناس. كلمات من العربي والسنسكريتي والهولندي والبرتغالي والصيني، كلها بتدخل وتقعد وتاكل، وبعدين تبقى من العيلة.
        ar: اللغة كالوارونغ يا ماس، بابها مفتوح للجميع. كلمات من العربية والسنسكريتية والهولندية والبرتغالية والصينية، كلّها تدخل وتجلس وتأكل، ثمّ تصير من أهل البيت.
        en: Language is like a warung, Mas. Its door is open to everyone. Words from Arabic, Sanskrit, Dutch, Portuguese and Chinese all come in, sit down, eat, and become family.
        note:
          ar_eg: الإندونيسي طالع من الملايو، لغة التجارة القديمة. bahasa وagama من السنسكريتي، وkantor (مكتب) من الهولندي، وmeja (ترابيزة) وsepatu (جزمة) من البرتغالي، وteh (شاي) من لهجة هوكيان الصينية. kayak = seperti، buat = untuk، sama = dan، terus jadi = lalu menjadi. terbuka = مفتوح.
          ar: نشأت الإندونيسية من الملايوية، لغة التجارة القديمة. فـbahasa وagama من السنسكريتية، وkantor (مكتب) من الهولندية، وmeja (طاولة) وsepatu (حذاء) من البرتغالية، وteh (شاي) من لهجة هوكيان الصينية. kayak = seperti، buat = untuk، sama = dan، terus jadi = lalu menjadi. terbuka = مفتوح.
          en: Indonesian grew out of Malay, the old trade language. bahasa and agama are Sanskrit, kantor (office) is Dutch, meja (table) and sepatu (shoe) are Portuguese, and teh (tea) is Hokkien Chinese. kayak = seperti, buat = untuk, sama = dan, terus jadi = lalu menjadi. terbuka = open.
      - speaker: Bayu
        text: Wah, Bapak kayak dosen linguistik.
        ar_eg: يا سلام، بابا بقى زي دكتور لغويّات.
        ar: يا سلام، صار أبي كأستاذ لسانيّات.
        en: Wow, Dad, you sound like a linguistics lecturer.
      - speaker: Pak Budi
        text: Bapak kan udah banyak makan garam, Le. Sama banyak makan pecel.
        ar_eg: ما أنا شفت كتير في الدنيا يا ابني. وكلت بيتشيل كتير.
        ar: لقد خبرتُ الحياة طويلًا يا بنيّ، وأكلتُ كثيرًا من البيتشيل.
        en: I've seen a thing or two in my time, son. And eaten a lot of pecel.
        note:
          ar_eg: banyak makan garam (أكل ملح كتير) = عنده خبرة - زي «أكبر منك بيوم...». udah = sudah، sama = dan.
          ar: banyak makan garam (أكل الملح كثيرًا) = صاحب خبرة. udah = sudah، sama = dan.
          en: banyak makan garam ("has eaten a lot of salt") = has lots of life experience. udah = sudah, sama = dan.
      - speaker: Karim
        text: Pak Budi, nuwun sewu. Besok malam, kalau Bapak dan Ibu berkenan, saya ingin sowan secara resmi. Ada hal penting yang ingin saya sampaikan.
        ar_eg: يا باك بودي، لا مؤاخذة. بكرة بالليل، لو حضرتك وبو راهايو تسمحوا، عايز أزوركم زيارة رسمية. فيه موضوع مهمّ عايز أقوله.
        ar: يا باك بودي، عذرًا. مساء الغد، إن أذنتَ أنت وبو راهايو، أودّ أن أزوركم زيارة رسمية. ثمّة أمر مهمّ أريد أن أبلغكم إيّاه.
        en: Pak Budi, excuse me. Tomorrow evening, if you and Bu Rahayu would allow it, I'd like to pay you a formal visit. There's something important I want to say.
        note:
          ar_eg: sowan كلمة جاوية دخلت الإندونيسي، معناها «يزور حدّ أكبر منه باحترام». وberkenan يعني «يتكرّم / يسمح» - فعل مؤدّب للي أعلى منك. وnuwun sewu (لا مؤاخذة) بتتقال قبل ما تقاطع أو تطلب حاجة.
          ar: sowan كلمة جاوية دخلت الإندونيسية، ومعناها «يزور من هو أعلى منه بتوقير». وberkenan تعني «يتكرّم / يأذن»، فعل مهذّب لمن هو أعلى منك. وتُقال nuwun sewu (عذرًا) قبل المقاطعة أو الطلب.
          en: sowan is a Javanese word used in Indonesian for respectfully visiting someone senior. berkenan means "to be so kind as to, to permit" - a polite verb for someone above you. nuwun sewu (excuse me) comes before you interrupt or ask for something.
      - speaker: Narrator
        text: Pak Budi berhenti berjalan. Bayu membuka mulutnya, lalu menutupnya lagi.
        ar_eg: باك بودي وقف. وبايو فتح بقّه، وبعدين قفله تاني.
        ar: توقّف باك بودي عن المشي. وفتح بايو فمه، ثمّ أغلقه من جديد.
        en: Pak Budi stops walking. Bayu opens his mouth, then shuts it again.
      - speaker: Pak Budi
        text: Resmi...? Le, nanti bilang Ibu. Besok malam, siapin teh yang paling enak. Terus jangan cerita ke grup WhatsApp dulu!
        ar_eg: رسمي...؟ يا بايو، قول لماما. بكرة بالليل، تجهّز أحلى شاي عندنا. ومتحكيش لجروب الواتساب دلوقتي!
        ar: رسميّة...؟ يا بنيّ، أخبر أمّك. مساء الغد فلتُعدّ أطيب شاي عندنا. ولا تخبر مجموعة الواتساب الآن!
        en: Formal...? Son, tell your mum. Tomorrow evening, she's to make the very best tea. And not a word to the WhatsApp group yet!
        note:
          ar_eg: resmi = رسمي، bilang = قول لـ، siapin = siapkan (جهّز)، grup = جروب.
          ar: resmi = رسميّ، bilang = أخبِر، siapin = siapkan (جهّز)، grup = مجموعة.
          en: resmi = official, formal, bilang = tell, siapin = siapkan (prepare), grup = group chat.
      - speaker: Bayu
        text: Siap, Pak. Grup WhatsApp nggak. Tapi kalau Mbak Sari?
        ar_eg: حاضر يا بابا. جروب الواتساب لأ. بس طب وأبلة ساري؟
        ar: حسنًا يا أبي. مجموعة الواتساب لا. لكن ماذا عن أختي ساري؟
        en: Got it, Dad. Not the WhatsApp group. But what about Sari?
      - speaker: Pak Budi
        text: Apalagi Mbak Sari!
        ar_eg: وأبلة ساري بالذات لأ!
        ar: وساري خصوصًا لا!
        en: Especially not Sari!
