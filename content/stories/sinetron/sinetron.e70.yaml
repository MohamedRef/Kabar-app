      ar_eg: حسب پاك بودي، البيت هو إيه؟
      ar: ما البيت بحسب باك بودي؟
      en: According to Pak Budi, what is home?
    options: ["warung di Gang Melati", "kamar Hagga Fatma", "kota Kairo", "orang-orang yang menunggu kita pulang"]
    answer: 3
    meaning:
      ar_eg: طلع إن البيت مش مكان. البيت هو الناس اللي مستنيينّا نرجع.
      ar: تبيّن أنّ البيت ليس مكانًا. البيت هو الناس الذين ينتظرون عودتنا.
      en: It turns out home isn't a place. Home is the people waiting for us to come back.
  - id: q05
