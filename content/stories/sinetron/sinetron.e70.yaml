title:
  target: Lebaran di Kairo
  ar_eg: العيد في القاهرة
  ar: العيد في القاهرة
  en: Lebaran in Cairo
summary:
  ar_eg: بايو بيقدّم تقريره النهائي قدّام لجنة المنحة بلغة أكاديمية. وبعدها، أخيرًا، الوعد اللي من الحلقة ٢٠ بيتحقّق - العيلة كلها بتعيّد في القاهرة. كحك وكتوپات، جاوي وعربي وإندونيسي، وعيدية للصحفي الشاب... ومكالمة من ماديون بتلخبط الساعات زي أول حلقة بالظبط.
  ar: يقدّم بايو تقريره النهائي أمام لجنة المنحة بلغة أكاديمية. ثمّ يتحقّق أخيرًا وعد الحلقة العشرين - تعيّد العائلة كلّها في القاهرة. كعك وكتوبات، جاوية وعربية وإندونيسية، وعيديّة للصحفي الشابّ... ومكالمة من ماديون تخلط المواقيت كما في الحلقة الأولى تمامًا.
  en: Bayu presents his final report to the fellowship panel in academic language. Then, at last, the promise from episode 20 is kept - the whole family celebrates Lebaran in Cairo. Kahk and ketupat, Javanese, Arabic and Indonesian, holiday money for the young journalist... and a call from Madiun mixes up the clocks just like in the very first episode.
cast: [Bu Laksmi, Bayu, Pak Yafet, Pak Budi, Hagga Fatma, Bu Rahayu, Sari, Karim, Nadia, Bu Samia, Pak Mahmoud, Mas Joko]
scenes:
  - setting:
      ar_eg: نص رمضان، مكتب الجرنال في سورونج. بايو قاعد قدّام اللابتوب، وعلى الشاشة لجنة المنحة من جاكرتا. رئيسة اللجنة بو لاكشمي. پاك يافت قاعد ورا بايو.
      ar: منتصف رمضان، مكتب الصحيفة في سورونغ. يجلس بايو أمام الحاسوب، وعلى الشاشة لجنة المنحة من جاكرتا ترأسها بو لاكشمي. ويجلس باك يافت خلف بايو.
      en: Mid-Ramadan, the newsroom in Sorong. Bayu sits at his laptop; on screen is the fellowship panel in Jakarta, chaired by Bu Laksmi. Pak Yafet sits behind Bayu.
    lines:
      - speaker: Bu Laksmi
        text: Silakan, Saudara Bayu. Waktu Anda lima belas menit, termasuk tanya jawab.
        ar_eg: اتفضّل يا أستاذ بايو. قدّامك ربع ساعة، ومعاها الأسئلة.
        ar: تفضّل يا سيّد بايو. لديك خمس عشرة دقيقة، بما فيها الأسئلة والأجوبة.
        en: Go ahead, Mr Bayu. You have fifteen minutes, including questions.
        note:
          ar_eg: Saudara / Saudari نداء رسمي محايد في المواقف الأكاديمية والرسمية، زي «الأستاذ فلان». ومش بيتقال في البيت خالص.
          ar: Saudara / Saudari نداء رسمي محايد في المواقف الأكاديمية والرسمية، بمعنى «السيّد فلان». ولا يُستعمل في البيت أبدًا.
          en: Saudara / Saudari is a neutral formal address in academic and official settings, like "Mr / Ms". You'd never use it at home.
      - speaker: Bayu
        text: Terima kasih, Bu. Laporan akhir ini berjudul "Mendengar sebelum Menulis - Praktik Jurnalisme Lokal di Papua Barat Daya". Tulisan ini bertujuan menggambarkan cara media lokal membangun kepercayaan publik.
        ar_eg: شكرًا يا دكتورة. التقرير النهائي ده عنوانه «نسمع قبل ما نكتب - ممارسة الصحافة المحلية في پاپوا الجنوبية الغربية». الورقة دي هدفها توصف إزاي الإعلام المحلي بيبني ثقة الناس.
        ar: شكرًا يا دكتورة. عنوان هذا التقرير النهائي «الإصغاء قبل الكتابة - ممارسة الصحافة المحلية في بابوا الجنوبية الغربية». ويهدف هذا البحث إلى وصف كيفية بناء وسائل الإعلام المحلية لثقة الجمهور.
        en: Thank you, Bu. This final report is entitled "Listening before Writing - Local Journalism Practice in Southwest Papua". It aims to describe how local media build public trust.
        note:
          ar_eg: اللغة الأكاديمية (ragam ilmiah) - من غير aku/kamu، والكاتب بيسمّي نفسه penulis، وجمل زي Tulisan ini bertujuan... (الورقة دي هدفها...) وData dikumpulkan melalui... (البيانات اتجمعت عن طريق...) - مبني للمجهول كتير.
          ar: اللغة الأكاديمية (ragam ilmiah) - لا aku ولا kamu، ويسمّي الكاتب نفسه penulis (الباحث)، وتكثر العبارات مثل Tulisan ini bertujuan... (يهدف هذا البحث إلى...) وData dikumpulkan melalui... (جُمعت البيانات عبر...)، مع كثرة المبني للمجهول.
          en: 'Academic register (ragam ilmiah): no aku/kamu, the author calls himself penulis ("the writer"), and phrases like Tulisan ini bertujuan... (this paper aims to...) and Data dikumpulkan melalui... (data were collected through...) - lots of passives.'
      - speaker: Bayu
        text: Data dikumpulkan melalui wawancara mendalam dengan dua puluh tiga narasumber serta observasi partisipatif selama lima bulan.
        ar_eg: البيانات اتجمعت عن طريق لقاءات معمّقة مع تلاتة وعشرين مصدر، وكمان ملاحظة بالمشاركة على مدار خمس شهور.
        ar: جُمعت البيانات عبر مقابلات معمّقة مع ثلاثة وعشرين مصدرًا، فضلًا عن الملاحظة بالمشاركة طوال خمسة أشهر.
        en: Data were collected through in-depth interviews with twenty-three sources and participant observation over five months.
      - speaker: Bayu
        text: Temuan menunjukkan bahwa kepercayaan pembaca tidak terutama dibangun oleh kecepatan, melainkan oleh kehadiran - wartawan yang datang, duduk, dan mendengarkan.
        ar_eg: النتايج بتبيّن إن ثقة القرّاء مش مبنية أساسًا على السرعة، لكن على الحضور - الصحفي اللي بييجي، ويقعد، ويسمع.
        ar: تُظهر النتائج أنّ ثقة القرّاء لا تُبنى أساسًا على السرعة، بل على الحضور - الصحفي الذي يأتي ويجلس ويُصغي.
        en: The findings show that readers' trust is built not mainly by speed, but by presence - the journalist who comes, sits down and listens.
        note:
          ar_eg: «tidak... melainkan...» (مش... لكن...) أسلوب رسمي للمقابلة بعد النفي، أقوى وأشيك من tetapi في الكتابة الأكاديمية.
          ar: «tidak... melainkan...» (لا... بل...) أسلوب رسمي للاستدراك بعد النفي، وهو أقوى وأفصح من tetapi في الكتابة الأكاديمية.
          en: '"tidak... melainkan..." ("not... but rather...") is the formal way to correct after a negative - stronger and more academic than tetapi.'
      - speaker: Bu Laksmi
        text: Menarik. Namun, apa keterbatasan penelitian Anda?
        ar_eg: مثير للاهتمام. بس إيه حدود البحث بتاعك؟
        ar: مثير للاهتمام. ولكن، ما حدود بحثك؟
        en: Interesting. However, what are the limitations of your research?
      - speaker: Bayu
        text: Penulis hanya meneliti satu media, dan sebagian besar narasumber berbicara dalam bahasa Indonesia atau Melayu Papua. Suara dalam bahasa-bahasa daerah belum terwakili. Hal tersebut perlu dikaji dalam penelitian selanjutnya.
        ar_eg: الباحث درس جرنال واحد بس، وأغلب المصادر اتكلّموا إندونيسي أو ملايو پاپوا. الأصوات اللي بتتكلّم اللغات المحلية لسه مش متمثّلة. والنقطة دي محتاجة تتدرس في أبحاث جاية.
        ar: اقتصر الباحث على دراسة مؤسسة إعلامية واحدة، وتكلّم معظم المصادر بالإندونيسية أو بملايو بابوا، فلم تُمثَّل بعدُ الأصوات الناطقة باللغات المحلية. وهذا أمر ينبغي بحثه في دراسات لاحقة.
        en: The writer studied only one media outlet, and most sources spoke Indonesian or Papuan Malay. Voices in the local languages are not yet represented. This should be examined in further research.
      - speaker: Pak Yafet
        text: Boleh sa tambahkan, Ibu? Anak ini datang ke Sorong sebagai tamu. Dia pulang sebagai bagian dari keluarga redaksi.
        ar_eg: تسمحيلي أزوّد حاجة يا دكتورة؟ الولد ده جه سورونج ضيف. وراجع وهو واحد من عيلة الجرنال.
        ar: أتسمحين لي بإضافة يا سيّدتي؟ جاء هذا الشابّ إلى سورونغ ضيفًا، ويعود فردًا من أسرة التحرير.
        en: May I add something, Ibu? This boy came to Sorong as a guest. He leaves as part of the newsroom family.
      - speaker: Bu Laksmi
        text: Terima kasih, Pak Yafet. Saudara Bayu, panel menyatakan laporan Anda diterima dengan predikat sangat baik. Selamat.
        ar_eg: شكرًا يا پاك يافت. يا أستاذ بايو، اللجنة بتعلن إن تقريرك اتقبل بتقدير «جيد جدًا». مبروك.
        ar: شكرًا يا باك يافت. سيّد بايو، تعلن اللجنة قبول تقريرك بتقدير «جيّد جدًّا». تهانينا.
        en: Thank you, Pak Yafet. Mr Bayu, the panel declares your report accepted with the grade "very good". Congratulations.
      - speaker: Bayu
        text: Terima kasih, Bu. Mohon maaf, saya harus pamit. Malam ini saya terbang ke Jakarta, lalu ke Kairo.
        ar_eg: شكرًا يا دكتورة. لا مؤاخذة، لازم أستأذن. الليلة طاير على جاكرتا، وبعدها على القاهرة.
        ar: شكرًا يا دكتورة. أستميحكم عذرًا، عليّ أن أستأذن. الليلة أطير إلى جاكرتا، ثمّ إلى القاهرة.
        en: Thank you, Bu. Forgive me, I must take my leave. Tonight I fly to Jakarta, and then on to Cairo.
  - setting:
      ar_eg: القاهرة، أول يوم العيد. العيلة لسه راجعة من صلاة العيد على بيت الحاجّة فاطمة. على الترابيزة كحك وكتوپات. أهل كريم، پاك محمود وبو سامية، موجودين، ونادية كمان.
      ar: القاهرة، أوّل أيّام العيد. عادت العائلة للتوّ من صلاة العيد إلى بيت الحاجّة فاطمة. على المائدة كعك وكتوبات. ووالدا كريم، باك محمود وبو سامية، حاضران، ونادية كذلك.
      en: Cairo, the first day of Eid. The family has just come back from the Eid prayer to Hagga Fatma's flat. Kahk and ketupat are on the table. Karim's parents, Pak Mahmoud and Bu Samia, are there, and Nadia too.
    lines:
      - speaker: Narrator
        text: Kairo, 1 Syawal. Takbir masih terdengar dari masjid-masjid ketika keluarga Pak Budi pulang dari salat Id.
        ar_eg: القاهرة، ١ شوّال. التكبير لسه طالع من الجوامع وعيلة پاك بودي راجعة من صلاة العيد.
        ar: القاهرة، الأوّل من شوّال. ما زال التكبير يتردّد من المساجد حين تعود عائلة باك بودي من صلاة العيد.
        en: Cairo, 1 Syawal. The takbir still echoes from the mosques as Pak Budi's family return from the Eid prayer.
      - speaker: Pak Budi
        text: Bu... kita di Kairo. Lebaran. Seminggu yang lalu Bapak masih di Makkah, dan hari ini Lebaran di Kairo. Bertahun-tahun Bapak hanya bisa bilang "insyaallah". Hari ini Bapak bilang "alhamdulillah".
        ar_eg: يا رهايو... احنا في القاهرة. والنهارده العيد. من أسبوع كنت لسه في مكّة، والنهارده بعيّد في القاهرة. سنين وأنا مش قادر أقول غير «إن شاء الله». النهارده بقول «الحمد لله».
        ar: يا رهايو... نحن في القاهرة. إنّه العيد. قبل أسبوع كنت ما أزال في مكّة، واليوم أعيّد في القاهرة. سنوات لم أكن أقول فيها إلّا «إن شاء الله»، واليوم أقول «الحمد لله».
        en: Dear... we're in Cairo. It's Lebaran. A week ago I was still in Mecca, and today it's Lebaran in Cairo. For years all I could say was "insyaallah". Today I say "alhamdulillah".
      - speaker: Hagga Fatma
        text: Ahlan, ahlan! Kahk sudah di meja. Dan kamar di rumah saya itu akhirnya tidak kosong lagi!
        ar_eg: أهلًا أهلًا! الكحك على الترابيزة. والأوضة اللي عندي أخيرًا مبقتش فاضية!
        ar: أهلًا أهلًا! الكعك على المائدة. والغرفة في بيتي لم تعد شاغرة أخيرًا!
        en: Welcome, welcome! The kahk is on the table. And the room at my place is finally not empty any more!
        note:
          ar_eg: فاكرين؟ في الحلقة ٢٠، يوم عيد في ماديون، الحاجّة فاطمة قالت على الفيديو «الأوضة اللي عندي لسه فاضية». وبعد سنين، اتملت. والكحك هو بسكوت العيد المصري بالسكر البودرة.
          ar: أتذكرون؟ في الحلقة العشرين، يوم عيد في ماديون، قالت الحاجّة فاطمة على الاتصال «الغرفة في بيتي ما زالت شاغرة». وبعد سنوات امتلأت. والكعك حلوى العيد المصرية المرشوشة بالسكّر الناعم.
          en: Remember? In episode 20, on Lebaran in Madiun, Hagga Fatma said on video, "The room at my house is still free." Years later, it's full. Kahk are Egypt's Eid biscuits, dusted with icing sugar.
      - speaker: Bu Rahayu
        text: Ketupat dari Madiun juga sudah matang, Hagga. Janurnya saya bawa di koper. Petugas bandara sampai bingung.
        ar_eg: والكتوپات بتاع ماديون استوى كمان يا حاجّة. السعف جبته في الشنطة. موظّف المطار نفسه اتلخبط.
        ar: والكتوبات القادم من ماديون نضج أيضًا يا حاجّة. حملتُ سعف جوز الهند في الحقيبة، حتى إنّ موظّف المطار احتار.
        en: And the ketupat from Madiun is cooked too, Hagga. I brought the young palm leaves in my suitcase. The airport officer didn't know what to make of it.
        note:
          ar_eg: ketupat رز بيتطبخ جوّه شنط صغيرة متضفّرة من سعف جوز الهند الصغيّر (janur)، وهو رمز العيد في إندونيسيا، وبيتاكل مع opor ayam (فراخ بلبن جوز الهند).
          ar: ketupat أرز يُطهى داخل أكياس صغيرة مضفورة من سعف جوز الهند الغضّ (janur)، وهو رمز العيد في إندونيسيا، ويؤكل مع opor ayam (دجاج بحليب جوز الهند).
          en: Ketupat is rice cooked in little pouches woven from young coconut leaves (janur) - the symbol of Lebaran in Indonesia, eaten with opor ayam (chicken in coconut milk).
      - speaker: Sari
        text: Bapak, Ibu, sebelum makan... mohon maaf lahir dan batin.
        ar_eg: بابا، ماما، قبل الأكل... سامحوني ظاهرًا وباطنًا.
        ar: أبي، أمي، قبل الطعام... أرجو العفو ظاهرًا وباطنًا.
        en: Dad, Mum, before we eat... please forgive me, body and soul.
      - speaker: Karim
        text: Bapak, Ibu, sugeng riyadi. Kula nyuwun pangapunten sedaya kalepatan kula.
        ar_eg: بابا، ماما، عيد سعيد. بطلب منكم تسامحوني على كل غلطاتي.
        ar: أبي، أمي، عيد سعيد. ألتمس منكما العفو عن جميع أخطائي.
        en: Father, Mother, happy Eid. I ask your forgiveness for all my wrongs.
        note:
          ar_eg: تهنئة العيد بالجاوي المؤدّب (كراما) - sugeng riyadi (عيد سعيد)، nyuwun pangapunten (بطلب السماح)، sedaya kalepatan (كل الغلطات). كريم بقاله سنين بيتعلّم عشان اللحظة دي. (الجمل الجاوية لسه مستنية مراجعة.)
          ar: تهنئة العيد بالجاوية المهذّبة (كراما) - sugeng riyadi (عيد سعيد)، وnyuwun pangapunten (ألتمس العفو)، وsedaya kalepatan (جميع الأخطاء). تعلّم كريم سنوات من أجل هذه اللحظة. (الجمل الجاوية بانتظار المراجعة.)
          en: 'A Lebaran greeting in polite Javanese (krama): sugeng riyadi (happy Eid), nyuwun pangapunten (I ask forgiveness), sedaya kalepatan (all my wrongs). Karim has studied for years for this moment. (The Javanese lines still await review.)'
      - speaker: Pak Budi
        text: Sami-sami, Le. Bapak juga minta maaf.
        ar_eg: وانت كمان يا ابني. وأنا كمان بطلب السماح.
        ar: وأنت كذلك يا بنيّ. وأنا أيضًا ألتمس العفو.
        en: Same to you, son. I ask your forgiveness too.
      - speaker: Bu Samia
        text: Bu Rahayu... ketupat ini... enak sekali! Kahk saya... untuk Ibu.
        ar_eg: يا بو راهايو... الكتوپات ده... حلو أوي! والكحك بتاعي... ليكي.
        ar: يا بو راهايو... هذا الكتوبات... لذيذ جدًّا! وكعكي... لكِ.
        en: Bu Rahayu... this ketupat... is delicious! My kahk... is for you.
      - speaker: Bayu
        text: Mohon maaf lahir dan batin, Pak, Bu, Mbak, Mas, Hagga, semuanya! Ada amplop untuk saya?
        ar_eg: سامحوني يا بابا، يا ماما، يا أبلة، يا ماس، يا حاجّة، يا كل الناس! فيه عيدية ليّا؟
        ar: أرجو العفو يا أبي ويا أمي ويا أختي ويا ماس ويا حاجّة ويا جميع الحاضرين! هل من عيديّة لي؟
        en: Forgive me, Dad, Mum, Sis, Mas, Hagga, everyone! Is there an envelope for me?
      - speaker: Nadia
        text: Bayu, kamu sudah mahasiswa, sudah wartawan, sudah terkenal. Masih minta amplop?
        ar_eg: يا بايو، انت بقيت طالب جامعة، وصحفي، ومشهور كمان. ولسه بتطلب عيدية؟
        ar: يا بايو، صرتَ طالبًا جامعيًّا وصحفيًّا ومشهورًا. وما زلت تطلب العيديّة؟
        en: Bayu, you're a university student, a journalist, and famous. And you still want an envelope?
      - speaker: Pak Mahmoud
        text: Bayu... ini, dari saya. 'Idiyya. Untuk... wartawan muda.
        ar_eg: يا بايو... خد، دي منّي. عيدية. عشان... الصحفي الصغيّر.
        ar: يا بايو... تفضّل، هذه منّي. عيديّة. من أجل... الصحفي الشابّ.
        en: Bayu... here, from me. 'Idiyya. For... the young journalist.
      - speaker: Hagga Fatma
        text: Dari saya juga, dalam pound Mesir. Kalau mau senang, hitung saja dalam rupiah. Angkanya jauh lebih besar!
        ar_eg: ومنّي أنا كمان، بالجنيه المصري. ولو عايز تفرح، احسبها بالروپية. الرقم هيطلع أكبر بكتير!
        ar: ومنّي أيضًا، بالجنيه المصري. وإن أردتَ أن تفرح فاحسبها بالروبية، فالرقم أكبر بكثير!
        en: And from me too, in Egyptian pounds. If you want to feel happy, just count it in rupiah. The number's much bigger!
      - speaker: Narrator
        text: Di ruang tamu Hagga Fatma, dua keluarga duduk berdesakan. Ada kahk dan ketupat, ful dan opor ayam. Ada bahasa Arab, bahasa Indonesia, dan bahasa Jawa, dan semua orang mengerti.
        ar_eg: في صالون الحاجّة فاطمة، عيلتين قاعدين لازقين في بعض. فيه كحك وكتوپات، وفول وفراخ بجوز الهند. فيه عربي وإندونيسي وجاوي، والكل فاهم.
        ar: في صالة الحاجّة فاطمة تجلس أسرتان متلاصقتين. ثمّة كعك وكتوبات، وفول ودجاج بحليب جوز الهند. ثمّة عربية وإندونيسية وجاوية، والجميع يفهم.
        en: In Hagga Fatma's front room, two families sit squeezed together. There's kahk and ketupat, ful and opor ayam. There's Arabic, Indonesian and Javanese, and everyone understands.
  - setting:
      ar_eg: بعد العصر، على بلكونة بيت الحاجّة فاطمة. موبايل پاك بودي بيرنّ - مكالمة فيديو من ماديون من ماس جوكو. الوارونج مقفول للعيد.
      ar: بعد العصر، على شرفة بيت الحاجّة فاطمة. يرنّ هاتف باك بودي - اتصال مرئي من ماس جوكو في ماديون. والوارونغ مغلق للعيد.
      en: Late afternoon on Hagga Fatma's balcony. Pak Budi's phone rings - a video call from Mas Joko in Madiun. The warung is closed for Lebaran.
    lines:
      - speaker: Mas Joko
        text: Asalamualaikum! Selamat malam, Pak Budi! Mohon maaf lahir dan batin dari Madiun!
        ar_eg: السلام عليكم! مساء الخير يا پاك بودي! سامحونا ظاهرًا وباطنًا من ماديون!
        ar: السلام عليكم! مساء الخير يا باك بودي! نرجو العفو ظاهرًا وباطنًا من ماديون!
        en: Assalamu alaikum! Good evening, Pak Budi! Forgive me, body and soul, from Madiun!
      - speaker: Pak Budi
        text: Waalaikumsalam, Mas Joko! Di sini masih sore, Mas. Selamat sore!
        ar_eg: وعليكم السلام يا ماس جوكو! هنا لسه العصر يا ماس. مساء الخير!
        ar: وعليكم السلام يا ماس جوكو! ما زال العصر هنا يا ماس. طاب مساؤك!
        en: Wa alaikum salam, Mas Joko! It's still afternoon here, Mas. Good afternoon!
        note:
          ar_eg: الدايرة اتقفلت! في الحلقة الأولى، كانت ساري في القاهرة الصبح وپاك بودي في ماديون الضهر، والتحيات اتلخبطت. دلوقتي پاك بودي هو اللي في القاهرة، وماديون قدّامه بحوالي ٥ ساعات.
          ar: اكتملت الدائرة! في الحلقة الأولى كانت ساري في القاهرة صباحًا وباك بودي في ماديون ظهرًا، فاختلطت التحيّات. والآن باك بودي هو من في القاهرة، وماديون تسبقه بنحو خمس ساعات.
          en: The circle closes! In episode one, Sari was in Cairo in the morning and Pak Budi in Madiun at midday, and the greetings got mixed up. Now Pak Budi is the one in Cairo, and Madiun is about five hours ahead.
      - speaker: Mas Joko
        text: Hehe, sama seperti dulu, Pak. Waktu Mbak Sari pertama kali menelepon dari Kairo, kita juga bingung mengucapkan salam.
        ar_eg: هيهي، زي زمان بالظبط يا پاك. أول مرة أبلة ساري اتّصلت من القاهرة، احنا كمان اتلخبطنا في التحية.
        ar: هيهي، كما في الماضي تمامًا يا باك. حين اتّصلت ساري أوّل مرّة من القاهرة ارتبكنا نحن أيضًا في التحيّة.
        en: Hehe, just like before, Pak. When Sari first called from Cairo, we got the greetings muddled too.
      - speaker: Sari
        text: Mas Joko ingat? Aku bilang, "Di Kairo pagi." Sekarang semua orang yang kusayangi ada di Kairo... kecuali Mas Joko.
        ar_eg: فاكر يا ماس جوكو؟ أنا قلت «في القاهرة لسه الصبح». دلوقتي كل الناس اللي بحبّهم في القاهرة... ما عدا ماس جوكو.
        ar: أتذكر يا ماس جوكو؟ قلتُ «الوقت صباح في القاهرة». والآن كلّ من أحبّهم في القاهرة... إلّا ماس جوكو.
        en: Remember, Mas Joko? I said, "It's morning in Cairo." Now everyone I love is in Cairo... except Mas Joko.
      - speaker: Mas Joko
        text: Tahun depan, Mbak. Kata Pak Budi, sesudah Proyek K, ada Proyek J. J untuk Joko!
        ar_eg: السنة الجاية يا أبلة. پاك بودي بيقول بعد مشروع ك، فيه مشروع ج. ج يعني جوكو!
        ar: في العام القادم يا أختي. يقول باك بودي إنّ بعد مشروع ك يأتي مشروع ج. ج لجوكو!
        en: Next year, Sari. Pak Budi says after Project K comes Project J. J for Joko!
      - speaker: Bu Rahayu
        text: Pak? Proyek apa lagi ini? Tekanan darah, Pak!
        ar_eg: يا بودي؟ مشروع إيه تاني ده؟ الضغط يا بودي!
        ar: يا باك؟ أيّ مشروع جديد هذا؟ ضغط الدم يا باك!
        en: Pak? What project is this now? Your blood pressure, Pak!
      - speaker: Pak Budi
        text: Tenang, Bu. Proyek J diaudit oleh Bayu. Transparan, akuntabel, dan tidak menutup-nutupi.
        ar_eg: اهدي يا رهايو. مشروع ج تحت مراجعة بايو. شفّاف، وفيه محاسبة، ومفيهوش تخبية.
        ar: اطمئنّي. مشروع ج يدقّقه بايو. شفّاف وخاضع للمساءلة ولا يُخفي شيئًا.
        en: Relax, dear. Project J is audited by Bayu. Transparent, accountable, and nothing covered up.
      - speaker: Narrator
        text: Malam itu, seperti setiap malam sejak dia sakit dulu, Pak Budi menulis di buku hariannya.
        ar_eg: الليلة دي، زي كل ليلة من ساعة ما عيي زمان، پاك بودي كتب في دفتر يومياته.
        ar: في تلك الليلة، كما في كلّ ليلة منذ مرضه قديمًا، كتب باك بودي في دفتر يومياته.
        en: That night, as he has every night since his illness long ago, Pak Budi wrote in his diary.
      - speaker: Pak Budi
        text: '"1 Syawal. Kairo. Hari ini janji Bapak lunas. Sari sudah punya rumah tangga, Bayu sudah punya suara, dan Bapak masih punya warung, istri yang sabar, dan tekanan darah yang normal. Alhamdulillah."'
        ar_eg: «١ شوّال. القاهرة. النهارده وعدي اتوفّى. ساري بقى ليها بيت وعيلة، وبايو بقى ليه صوت، وأنا لسه عندي الوارونج، ومراتي الصبورة، وضغطي مظبوط. الحمد لله.»
        ar: «الأوّل من شوّال. القاهرة. اليوم وفيتُ بوعدي. صار لساري بيت وأسرة، وصار لبايو صوت، وما زال لي الوارونغ، وزوجتي الصبور، وضغط دم طبيعي. الحمد لله.»
        en: '"1 Syawal. Cairo. Today my promise is paid in full. Sari has a home of her own, Bayu has found his voice, and I still have my warung, a patient wife and normal blood pressure. Alhamdulillah."'
      - speaker: Bayu
        text: Pak, boleh catatan itu kukutip untuk tulisanku berikutnya?
        ar_eg: يا بابا، ينفع أقتبس الكلام ده في مقالتي الجاية؟
        ar: يا أبي، هل لي أن أقتبس هذه السطور في مقالتي القادمة؟
        en: Dad, can I quote that in my next piece?
      - speaker: Pak Budi
        text: Boleh, Le. Tapi kutip lengkap. Jangan lupa kalimat terakhirnya.
        ar_eg: ماشي يا ابني. بس انقلها كاملة. ومتنساش آخر جملة.
        ar: لك ذلك يا بنيّ. لكن اقتبسها كاملة، ولا تنسَ الجملة الأخيرة.
        en: You may, son. But quote it in full. Don't forget the last line.
      - speaker: Pak Budi
        text: '"Ternyata rumah itu bukan tempat. Rumah itu orang-orang yang menunggu kita pulang, di Madiun, di Kairo, di mana saja."'
        ar_eg: «طلع إن البيت مش مكان. البيت هو الناس اللي مستنيينّا نرجع - في ماديون، في القاهرة، في أي حتّة.»
        ar: «تبيّن أنّ البيت ليس مكانًا. البيت هو الناس الذين ينتظرون عودتنا - في ماديون، وفي القاهرة، وفي كلّ مكان.»
        en: '"It turns out home isn''t a place. Home is the people waiting for us to come back - in Madiun, in Cairo, anywhere."'
      - speaker: Narrator
        text: Tamat.
        ar_eg: النهاية.
        ar: النهاية.
        en: The End.
