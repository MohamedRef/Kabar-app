  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: بايو جمع البيانات إزاي؟
      ar: كيف جمع بايو البيانات؟
      en: How did Bayu collect his data?
    options: ["melalui survei daring", "melalui wawancara mendalam dan observasi", "dari media sosial saja", "dari buku sejarah"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Kepercayaan pembaca tidak terutama dibangun oleh kecepatan, ___ oleh kehadiran.
    meaning:
      ar_eg: ثقة القرّاء مش مبنية أساسًا على السرعة، لكن على الحضور.
      ar: لا تُبنى ثقة القرّاء أساسًا على السرعة، بل على الحضور.
      en: Readers' trust is built not mainly by speed, but by presence.
    answers: [melainkan]
    options: ["sehingga", "bahkan", "melainkan"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الحاجّة فاطمة قالت «الأوضة أخيرًا مبقتش فاضية»؟
      ar: لماذا قالت الحاجّة فاطمة «لم تعد الغرفة شاغرة أخيرًا»؟
      en: Why does Hagga Fatma say the room is "finally not empty any more"?
    options: ["Karena dia baru menyewakannya kepada turis.", "Karena Nadia pindah ke sana.", "Karena dia sudah bertahun-tahun menunggu Pak Budi datang untuk Lebaran.", "Karena kamar itu baru dicat."]
    answer: 2
  - id: q04
    type: listen
    text: Ternyata rumah itu bukan tempat. Rumah itu orang-orang yang menunggu kita pulang.
