      ar: ["اليوم وفيتُ بوعدي.", "اليوم أُوفي وعدي كاملًا.", "اليوم تحقّق وعدي."]
      en: ["Today my promise is paid in full.", "Today I've kept my promise.", "Today my promise is fulfilled."]
next:
  ar_eg: وبعد العيد، الوارونج في جانج ميلاتي هيفتح تاني. وعلى الترابيزة اللي في الركن، دايمًا فيه كرسي فاضي... ليك انت، يا اللي سمعت الحكاية من أولها. شكرًا إنك كنت معانا.
  ar: وبعد العيد سيفتح الوارونغ في زقاق ميلاتي أبوابه من جديد. وعلى المائدة التي في الزاوية كرسيّ شاغر دائمًا... لك أنت، يا من سمعت الحكاية من أوّلها. شكرًا لأنّك كنت معنا.
  en: After Lebaran, the warung in Gang Melati will open again. At the corner table there's always one empty chair... for you, who heard this story from the very beginning. Thank you for being with us.
