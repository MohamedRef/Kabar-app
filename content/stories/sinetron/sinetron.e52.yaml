questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: مين قرا البانتون بتاع أهل العريس؟
      ar: من قرأ بانتون أهل العريس؟
      en: Who read the pantun for the groom's side?
    options: ["Nadia", "Karim", "Pak Mahmoud", "Bayu"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Kami datang membawa doa, ingin memetik ___ yang anggun.
    meaning:
      ar_eg: جايين ومعانا دعوة، عايزين نقطف وردة حلوة.
      ar: جئنا نحمل الدعاء، نرجو قطف الزهرة الأنيقة.
      en: We come bearing prayers, hoping to pick the graceful flower.
    answers: [bunga]
    options: ["kurma", "bunga", "brem"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: (استنتاج) ليه كريم وطّى راسه ومسك ركبه جامد؟
      ar: (استنتاج) لماذا أطرق كريم وأمسك ركبتيه بقوّة؟
      en: (Inference) Why did Karim look down and grip his knees?
    options: ["Dia sakit perut setelah makan pecel.", "Dia mencari HP-nya di lantai.", "Dia gugup menunggu jawaban Sari.", "Dia tidak suka pantun Pak Budi."]
    answer: 2
  - id: q04
    type: listen
    text: Di Mesir, pesta pernikahan sering diadakan malam Jumat.
    question:
      ar_eg: الأفراح في مصر كتير بتبقى إمتى؟
      ar: متى تُقام الأعراس في مصر غالبًا؟
      en: When are Egyptian weddings often held?
    options: ["Jumat pagi", "Kamis malam", "Minggu siang"]
    answer: 1
    meaning:
      ar_eg: في مصر الأفراح كتير بتبقى ليلة الجمعة.
      ar: في مصر كثيرًا ما تُقام حفلات الزفاف ليلة الجمعة.
      en: In Egypt, weddings are often held on the eve of Friday.
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كل الأيام حلوة.
      ar: كلّ الأيّام طيّبة.
      en: Every day is a good day.
    answers: ["Semua hari itu baik.", "Semua hari itu baik", "Semua hari baik.", "Semua hari baik", "Setiap hari itu baik.", "Setiap hari itu baik", "Setiap hari baik.", "Setiap hari baik", "Semua hari adalah hari baik.", "Semua hari adalah hari baik"]
next:
  ar_eg: الخطوبة خلصت، ودلوقتي التخطيط للفرح. بو راهايو عايزة سيرامان جاوي، وبو سامية عايزة زفّة مصرية بالطبل. ولكل واحدة ليستة طويلة... ومفيش ولا بند مشترك.
  ar: انتهت الخطبة وبدأ التخطيط للعرس. تريد بو راهايو طقس السيرامان الجاوي، وتريد بو سامية زفّة مصرية بالطبول. ولكلّ منهما قائمة طويلة... بلا بند مشترك واحد.
  en: The proposal's done; now for the wedding plans. Bu Rahayu wants a Javanese siraman, Bu Samia wants an Egyptian zaffa with drums. Each has a long list... with not a single item in common.
