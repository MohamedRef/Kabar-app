episode: 52
language: id
level: bipa6
unlock_after: bipa6.u02
title:
  target: Memetik Bunga yang Anggun
  ar_eg: نقطف الوردة الحلوة
  ar: قطف الزهرة الأنيقة
  en: Picking the Graceful Flower
summary:
  ar_eg: يوم الخطوبة في ماديون. أهل كريم جايين من القاهرة، وبايو مقترح فكرة من سومطرة - العيلتين يردّوا على بعض بالبانتون. باك بودي بيقرا بانتون كتبهوله بايو، وساري بتردّ ببانتون من تأليفها. وعلى الغدا، الأمّهات بيتفاهموا من غير لغة واحدة.
  ar: يوم الخطبة في ماديون. تصل أسرة كريم من القاهرة، ويقترح بايو فكرة من سومطرة - أن تتبادل الأسرتان أبيات البانتون. يقرأ باك بودي بانتونًا كتبه له بايو، وتجيب ساري ببانتون من تأليفها. وعلى الغداء تتفاهم الأمّان بلا لغة مشتركة.
  en: Proposal day in Madiun. Karim's family arrives from Cairo, and Bayu brings an idea from Sumatra - the two families trade pantun. Pak Budi reads a pantun Bayu wrote for him, and Sari answers with one of her own. Over lunch, the two mothers get along with no shared language at all.
cast: [Pak Budi, Pak Mahmoud, Karim, Bayu, Nadia, Bu Samia, Sari, Bu Rahayu]
scenes:
  - setting:
      ar_eg: يوم حد الصبح، أوضة الضيوف في بيت باك بودي في حارة ميلاتي. الكراسي متصفّفة صفّين قصاد بعض - صفّ لأهل العريس وصفّ لأهل العروسة. ساري لابسة الكبايا الخضرا.
      ar: صباح الأحد، غرفة الضيوف في بيت باك بودي بزقاق ميلاتي. الكراسي مصفوفة صفّين متقابلين - صفّ لأهل العريس وصفّ لأهل العروس. ساري ترتدي الكبايا الخضراء.
      en: Sunday morning, the front room of Pak Budi's house in Gang Melati. The chairs are set in two facing rows - one for the groom's family, one for the bride's. Sari is wearing the green kebaya.
    lines:
      - speaker: Narrator
        text: Rumah Pak Budi harum bunga melati. Keluarga Karim datang membawa wajik, jadah, dan sekotak basbousa dari Kairo.
        ar_eg: بيت باك بودي ريحته فلّ. وأهل كريم جايين ومعاهم واجيك وجاداه، وعلبة بسبوسة من القاهرة.
        ar: يعبق بيت باك بودي برائحة الياسمين. وجاءت أسرة كريم تحمل الواجيك والجاداه وعلبة بسبوسة من القاهرة.
        en: Pak Budi's house smells of jasmine. Karim's family arrives bearing wajik, jadah, and a box of basbousa from Cairo.
        note:
          ar_eg: في الخطوبة الجاوية أهل العريس بيجيبوا حلويات لزقة من الرز اللزج، زي wajik وjadah. والمعنى إن العيلتين يلزقوا في بعض ويبقوا قريبين على طول.
          ar: في الخطبة الجاوية يحمل أهل العريس حلويات لزجة من الأرز الدبق مثل wajik وjadah، رمزًا لالتصاق الأسرتين وقربهما الدائم.
          en: At a Javanese proposal the groom's side brings sticky-rice sweets such as wajik and jadah - the stickiness stands for two families that will stay close.
      - speaker: Pak Budi
        text: Bapak Mahmoud, Ibu Samia, selamat datang di gubuk kami yang sederhana.
        ar_eg: يا أستاذ محمود، يا مدام سامية، أهلًا بيكم في عشّتنا المتواضعة.
        ar: يا سيّد محمود، يا سيّدة سامية، مرحبًا بكم في كوخنا المتواضع.
        en: Mr Mahmoud, Mrs Samia, welcome to our humble little hut.
        note:
          ar_eg: gubuk يعني «عشّة»، والبيت مش عشّة خالص! ده تواضع في الكلام (merendah) بيتقال للضيوف المهمّين - زي ما المصري يقول «نوّرتوا بيتكم» أو «البيت بيتكم».
          ar: gubuk تعني «كوخ»، والبيت ليس كوخًا! إنه تواضع في القول (merendah) يُقال للضيوف المكرَّمين، كما نقول «البيت بيتكم».
          en: gubuk means "hut", which the house certainly isn't! It's polite self-lowering (merendah) for honoured guests, like an Egyptian saying "it's your home".
      - speaker: Pak Mahmoud
        text: Terima kasih, Pak Budi. Kami datang... dengan niat baik.
        ar_eg: شكرًا يا باك بودي. احنا جايين... بنيّة طيبة.
        ar: شكرًا يا باك بودي. جئنا... بنيّة طيّبة.
        en: Thank you, Pak Budi. We have come... with good intentions.
      - speaker: Karim
        text: Ayah saya menghafal kalimat itu di pesawat, lho. Sebelas jam, Pak, cuma satu kalimat.
        ar_eg: أبويا حفظ الجملة دي في الطيارة. إحداشر ساعة يا باك، على جملة واحدة.
        ar: حفظ أبي هذه الجملة في الطائرة. إحدى عشرة ساعة يا باك، لجملة واحدة.
        en: My father memorised that sentence on the plane. Eleven hours, Pak, for one sentence.
        note:
          ar_eg: menghafal = يحفظ (زي حفظ القرآن). وcuma = hanya (بس) - كلام كل يوم.
          ar: menghafal = يحفظ عن ظهر قلب. وcuma = hanya (فقط) - من الكلام اليومي.
          en: menghafal = to memorise. cuma = hanya (only) - everyday speech.
      - speaker: Bayu
        text: Sebelum ngomong serius, gimana kalau kita mulai sama berbalas pantun dulu? Di adat Melayu, lamaran sering dibuka pakai pantun.
        ar_eg: قبل ما نتكلّم جدّ، إيه رأيكم نبدأ بالردّ على بعض بالبانتون؟ في عادات الملايو، الخطوبة كتير بتبتدي ببانتون.
        ar: قبل الحديث الجادّ، ما رأيكم أن نبدأ بتبادل البانتون؟ ففي عادات الملايو كثيرًا ما تُفتتح الخطبة بالبانتون.
        en: Before we get serious, how about we start by trading pantun? In Malay custom, a proposal often opens with pantun.
        note:
          ar_eg: البانتون قصيدة من أربع سطور، القافية أ ب أ ب. أول سطرين (sampiran) صورة من الطبيعة أو الحياة، وآخر سطرين (isi) هما الرسالة. اليونسكو سجّلته تراث سنة ٢٠٢٠. والردّ بالبانتون في الخطوبة عادة ملايوية؛ أمّا الخطوبة الجاوية فبيتكلّم فيها متحدّث باسم العيلة بالكراما. ngomong = berbicara (يتكلّم)، sama = dengan - كلام الشارع. وlamaran = الخطوبة.
          ar: البانتون قصيدة من أربعة أسطر بقافية أ ب أ ب؛ السطران الأوّلان (sampiran) صورة من الطبيعة أو الحياة، والأخيران (isi) هما الرسالة. وقد أدرجته اليونسكو تراثًا عام ٢٠٢٠. وتبادل البانتون في الخطبة عادة ملايوية، أمّا في الخطبة الجاوية فيتكلّم ناطق باسم الأسرة بلغة الكراما. ngomong = berbicara (يتكلّم)، وsama = dengan - من الكلام اليومي. وlamaran = الخِطبة.
          en: A pantun has four lines rhyming ABAB. The first two (sampiran) paint a picture; the last two (isi) carry the message. UNESCO listed it in 2020. Trading pantun at a proposal is a Malay custom; a Javanese one usually has a family spokesman speaking krama. ngomong = berbicara (to talk), sama = dengan (with) - everyday speech. lamaran = the proposal.
      - speaker: Nadia
        text: Saya yang membaca pantun dari pihak laki-laki! Dari Kairo terbang ke Jawa, singgah sebentar di Kota Madiun. Kami datang membawa doa, ingin memetik bunga yang anggun.
        ar_eg: أنا اللي هقرا بانتون أهل العريس! «من القاهرة طرنا لجاوة، ونزلنا شوية في ماديون. جايين ومعانا دعوة، عايزين نقطف وردة حلوة.»
        ar: أنا من سيقرأ بانتون أهل العريس! «من القاهرة طرنا إلى جاوة، وحططنا قليلًا في مدينة ماديون. جئنا نحمل الدعاء، نرجو قطف الزهرة الأنيقة.»
        en: 'I''ll read the pantun for the groom''s side! "From Cairo we flew to Java, and stopped a while in Madiun town. We come bearing prayers, hoping to pick the graceful flower."'
      - speaker: Bu Samia
        text: Bunganya... cantik sekali. Masyaallah.
        ar_eg: الوردة... حلوة أوي. ما شاء الله.
        ar: الزهرة... جميلة جدًّا. ما شاء الله.
        en: The flower... is so beautiful. Masha'Allah.
      - speaker: Bayu
        text: Sampirannya tentang perjalanan, isinya tentang niat. Dan "memetik bunga" itu majas, Pak. Artinya melamar seorang gadis.
        ar_eg: الصورة في الأول عن السفر، والرسالة عن النيّة. و«نقطف وردة» دي مجاز يا بابا. معناها نطلب إيد بنت.
        ar: السطران الأوّلان عن السفر، والرسالة عن النيّة. و«قطف الزهرة» مجاز يا أبي، معناه خطبة فتاة.
        en: The sampiran is about the journey, the isi about their intention. And "picking a flower" is a figure of speech, Dad. It means proposing to a girl.
      - speaker: Pak Budi
        text: Wah, Bapak harus jawab pakai pantun juga? Le, bantu Bapak, dong!
        ar_eg: يا خبر، أنا لازم أردّ ببانتون كمان؟ يا ابني، الحقني!
        ar: يا إلهي، عليّ أن أجيب ببانتون أيضًا؟ يا بنيّ، أنقذني!
        en: Oh dear, I have to answer in pantun too? Son, help me out!
        note:
          ar_eg: في الكلام بنقول jawab بدل menjawab (يردّ)، وdong بتخلّي الطلب فيه رجاء وحماس - «ساعدني بقى!».
          ar: في المحادثة يُقال jawab بدل menjawab (يجيب)، وdong تضفي على الطلب إلحاحًا وديًّا.
          en: In speech jawab stands in for menjawab (to answer); dong adds a friendly push to a request - "come on, help me!".
      - speaker: Pak Budi
        text: Beli brem di Kota Madiun, dibawa pulang hari Kamis. Bunga kami memang anggun, tapi jawabnya dari si manis.
        ar_eg: «اشترينا بريم من ماديون، وروّحنا بيه يوم الخميس. وردتنا حلوة وكلّها ذوق، بس الردّ عند الحلوة نفسها.»
        ar: «اشترينا البريم من ماديون، وعدنا به يوم الخميس. زهرتنا أنيقة حقًّا، لكنّ الجواب عند الحلوة نفسها.»
        en: '"We bought brem in Madiun town, and took it home on Thursday. Our flower is graceful indeed, but the answer is the sweet one''s to give."'
      - speaker: Narrator
        text: Semua orang menoleh ke Sari. Karim menunduk dan memegang lututnya erat-erat.
        ar_eg: الكل بصّ لساري. وكريم وطّى راسه ومسك ركبه جامد.
        ar: التفت الجميع إلى ساري. وأطرق كريم برأسه وأمسك ركبتيه بقوّة.
        en: Everyone turns to Sari. Karim looks down and grips his knees tight.
      - speaker: Sari
        text: Burung merpati terbang ke Mesir, hinggap sebentar di pohon kurma. Sudah lama saya berpikir... bismillah, lamaran saya terima.
        ar_eg: «حمامة طارت لحدّ مصر، ووقفت شوية على نخلة. من زمان وأنا بفكّر... بسم الله، الخطوبة أنا قابلاها.»
        ar: «طارت حمامة إلى مصر، وحطّت قليلًا على نخلة. طالما فكّرت... بسم الله، أقبل الخطبة.»
        en: '"A dove flew off to Egypt, and rested a while on a date palm. I have thought for a long time... bismillah, I accept the proposal."'
      - speaker: Narrator
        text: Nadia bersorak. Bu Samia memeluk Bu Rahayu, dan Pak Mahmoud mengucapkan "Alhamdulillah" tiga kali.
        ar_eg: نادية زغرطت. وبو سامية حضنت بو راهايو، وباك محمود قال «الحمد لله» تلات مرات.
        ar: هلّلت نادية، وعانقت بو سامية بو راهايو، وقال باك محمود «الحمد لله» ثلاث مرات.
        en: Nadia cheers. Bu Samia hugs Bu Rahayu, and Pak Mahmoud says "Alhamdulillah" three times.
  - setting:
      ar_eg: بعد الخطوبة، كلّه قاعد ياكل على الحصيرة. الأمّهات مش بيتكلّموا نفس اللغة، وكريم ونادية بيترجموا.
      ar: بعد الخطبة يأكل الجميع جالسين على الحصير. لا تتكلّم الأمّان لغة واحدة، ويترجم كريم ونادية.
      en: After the proposal, everyone eats sitting on mats. The mothers don't share a language, so Karim and Nadia translate.
    lines:
      - speaker: Narrator
        text: Bu Rahayu dan Bu Samia tidak punya satu bahasa yang sama. Tapi mereka terus menambahkan lauk ke piring satu sama lain.
        ar_eg: بو راهايو وبو سامية مالهمش لغة واحدة. بس كل واحدة فيهم مش بطّالة تحطّ أكل في طبق التانية.
        ar: لا تجمع بو راهايو وبو سامية لغة واحدة، لكنّ كلّ واحدة منهما لا تكفّ عن وضع الطعام في طبق الأخرى.
        en: Bu Rahayu and Bu Samia don't have a language in common. But they keep piling food onto each other's plates.
      - speaker: Bu Samia
        text: Bu Rahayu, ini... enak sekali! Apa namanya?
        ar_eg: يا بو راهايو، ده... حلو أوي! اسمه إيه؟
        ar: يا بو راهايو، هذا... لذيذ جدًّا! ما اسمه؟
        en: Bu Rahayu, this is... delicious! What's it called?
      - speaker: Bu Rahayu
        text: Pecel, Bu. Mas Karim, tolong bilang sama ibumu, resepnya rahasia, tapi buat calon besan nggak ada rahasia.
        ar_eg: بيتشيل يا ستّ سامية. يا ماس كريم، قول لمامتك إن الوصفة سرّ، بس للنسايب مفيش أسرار.
        ar: بيتشيل يا سيّدتي. يا ماس كريم، قل لأمّك إنّ الوصفة سرّ، لكن لا أسرار أمام أصهارنا المقبلين.
        en: Pecel, Bu. Mas Karim, please tell your mother the recipe's a secret, but there are no secrets from family-to-be.
        note:
          ar_eg: besan كلمة مفيش زيها في الإنجليزي - هي العلاقة بين أبو وأم العريس وأبو وأم العروسة. في المصري بنقول «النسايب». وcalon يعني «اللي هيبقى» - calon besan، calon suami (العريس). bilang sama = قول لـ (bilang = berkata، sama = kepada).
          ar: besan كلمة تصف العلاقة بين والدي العريس ووالدي العروس، ويقابلها في العامية المصرية «النسايب». وcalon تعني «المرتقَب» - calon besan، calon suami (الخطيب). bilang sama = قُل لـ (bilang = berkata، وsama = kepada).
          en: besan names the bond between the two sets of parents - English has no single word for it; Egyptians say nasayeb. calon means "to-be" - calon besan, calon suami (fiancé). bilang sama = tell (bilang = berkata, sama = kepada).
      - speaker: Karim
        text: Kata ibu saya, besok pagi beliau mau ikut ke warung jam empat, buat belajar.
        ar_eg: ماما بتقول إنها عايزة تيجي الوارونج بكرة الساعة ٤ الفجر عشان تتعلّم.
        ar: تقول أمي إنها تريد الذهاب إلى الوارونغ غدًا في الرابعة فجرًا لتتعلّم.
        en: My mother says she wants to come to the warung at four tomorrow morning to learn.
      - speaker: Pak Budi
        text: Jam empat pagi? Wah, besan Bapak ini serius banget.
        ar_eg: الساعة ٤ الفجر؟ لأ دي نسيبتي جدّ أوي.
        ar: الرابعة فجرًا؟ إنّ نسيبتي جادّة جدًّا.
        en: Four in the morning? My co-in-law means business.
      - speaker: Pak Mahmoud
        text: Pak Budi... tanggal pernikahan?
        ar_eg: يا باك بودي... ميعاد الفرح؟
        ar: يا باك بودي... موعد الزفاف؟
        en: Pak Budi... the wedding date?
      - speaker: Pak Budi
        text: Di Jawa, sebagian keluarga masih menghitung hari baik. Tapi buat kami, semua hari itu baik, asal pengantinnya siap.
        ar_eg: في جاوة فيه عيلات لسه بتحسب الأيام المبروكة. بس احنا شايفين إن كل الأيام حلوة، طالما العرسان جاهزين.
        ar: في جاوة ما زالت بعض الأسر تحسب الأيّام المباركة. أمّا نحن فكلّ الأيّام عندنا طيّبة ما دام العروسان مستعدَّين.
        en: In Java, some families still work out an auspicious day. But for us, every day is a good day, as long as the couple are ready.
      - speaker: Nadia
        text: Di Mesir, pesta pernikahan sering diadakan malam Jumat.
        ar_eg: في مصر الأفراح كتير بتبقى ليلة الجمعة.
        ar: في مصر كثيرًا ما تُقام حفلات الزفاف ليلة الجمعة.
        en: In Egypt, weddings are often held on the eve of Friday.
      - speaker: Bayu
        text: Malam Jumat? Di sini, malam Jumat itu Kamis malam. Sama kayak bahasa Arab, kan? "Lailatul jumu'ah"!
        ar_eg: ليلة الجمعة؟ هنا ليلة الجمعة يعني الخميس بالليل. زي العربي بالظبط، صح؟ «ليلة الجمعة»!
        ar: ليلة الجمعة؟ هنا ليلة الجمعة هي مساء الخميس، تمامًا كالعربية، أليس كذلك؟ «ليلة الجمعة»!
        en: Malam Jumat? Here, "Friday night" means Thursday evening. Same as in Arabic, right? Laylat al-jumu'a!
        note:
          ar_eg: زي العربي، الليلة في الإندونيسي بتتنسب لليوم اللي بعدها - malam Jumat هي ليلة الخميس، وmalam Minggu ليلة السبت (ليلة الخروجات للشباب!). وkayak = seperti (زي) في الكلام. وLailatul jumu'ah = ليلة الجمعة.
          ar: كما في العربية، تُنسب الليلة في الإندونيسية إلى اليوم الذي يليها - فmalam Jumat هي مساء الخميس، وmalam Minggu مساء السبت (ليلة نزهات الشباب!). وkayak = seperti (مثل) في الكلام اليومي. وLailatul jumu'ah = ليلة الجمعة.
          en: As in Arabic, a night belongs to the day after it - malam Jumat is Thursday night, and malam Minggu is Saturday night (the big night out for young people!). kayak = seperti (like) in speech. Lailatul jumu'ah = ليلة الجمعة.
      - speaker: Nadia
        text: Oh iya, kakakku menyimpan satu puisi di HP-nya. Setiap malam dia baca terus. "Aku ingin mencintaimu dengan sederhana..."
        ar_eg: آه صحيح، أخويا شايل قصيدة على موبايله. بيقراها كل ليلة. «عايز أحبّك ببساطة...»
        ar: آه بالمناسبة، يحتفظ أخي بقصيدة في هاتفه ويقرؤها كلّ ليلة. «أريد أن أحبّكِ ببساطة...»
        en: Oh, and my brother keeps a poem on his phone. He reads it every night. "I want to love you simply..."
      - speaker: Bu Rahayu
        text: Itu puisi Sapardi Djoko Damono! Dulu waktu muda, Ibu juga suka banget puisi itu.
        ar_eg: دي قصيدة ساباردي جوكو دامونو! وأنا صغيّرة كنت بحبّها أوي.
        ar: هذه قصيدة سابردي جوكو دامونو! وكنت أحبّها كثيرًا في شبابي.
        en: That's Sapardi Djoko Damono's poem! I loved it too when I was young.
        note:
          ar_eg: ساباردي جوكو دامونو (١٩٤٠-٢٠٢٠) من أشهر شعراء إندونيسيا الحديثين. وقصيدته «Aku Ingin» (عايز) كلامها بسيط جدًا ومعناها عميق، والناس بتقراها كتير في الأفراح.
          ar: سابردي جوكو دامونو (١٩٤٠-٢٠٢٠) من أشهر شعراء إندونيسيا المحدثين. وقصيدته «Aku Ingin» (أريد) بسيطة الألفاظ عميقة المعنى، وكثيرًا ما تُقرأ في الأعراس.
          en: Sapardi Djoko Damono (1940-2020) is one of Indonesia's best-loved modern poets. His "Aku Ingin" (I Want) uses the plainest words for a deep idea, and is often read at weddings.
      - speaker: Karim
        text: Nadia... kamu udah selesai belum?
        ar_eg: نادية... خلصتي؟
        ar: نادية... هل انتهيتِ؟
        en: Nadia... are you quite finished?
        note:
          ar_eg: udah = sudah - في الكلام. وudah... belum? = «خلّصت ولا لسه؟».
          ar: udah = sudah في الكلام اليومي، وudah... belum? = «هل انتهيتَ أم لا بعد؟».
          en: udah = sudah (already) in speech; udah... belum? = "done yet or not?".
      - speaker: Pak Budi
        text: Puisi yang bagus itu seperti pecel, Mas. Sederhana, tapi nggak bisa dilupakan.
        ar_eg: الشعر الحلو زي البيتشيل يا ماس. بسيط، بس متتنسيش.
        ar: الشعر الجيّد كالبيتشيل يا ماس - بسيط لكنه لا يُنسى.
        en: A good poem is like pecel, Mas. Simple, but unforgettable.
