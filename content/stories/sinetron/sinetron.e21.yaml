questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الخبرين الحلوين بتوع كريم؟
      ar: ما خبرا كريم السعيدان؟
      en: What are Karim's two pieces of good news?
    options: ["Nadia menikah dan Karim pindah ke Madiun.", "Sari lulus dan Karim membuka warung.", "Nadia akan diwisuda dan Karim punya pekerjaan baru di Kairo."]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: Selamat, Nadia! ___ ilmunya bermanfaat.
    meaning:
      ar_eg: مبروك يا نادية! ربنا يجعل علمك نافع.
      ar: مبارك يا نادية! جعل الله علمكِ نافعًا.
      en: Congratulations, Nadia! May your knowledge be of benefit.
    answers: [Semoga]
    options: ["Semoga", "Sampai", "Selamat"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: باك بودي بعت البريم لمين؟
      ar: لمن أرسل باك بودي البريم؟
      en: Who is the brem for?
    options: ["untuk Hagga Fatma", "untuk Nadia", "untuk Mas Joko", "untuk Bayu"]
    answer: 0
  - id: q04
    type: listen
    text: Mas Karim, sampaikan salam saya kepada Hagga Fatma, ya.
    question:
      ar_eg: ماس جوكو عايز كريم يعمل إيه؟
      ar: ماذا يريد ماس جوكو من كريم؟
      en: What does Mas Joko want Karim to do?
    options: ["Membeli kopi untuknya.", "Menyampaikan salamnya kepada Hagga Fatma.", "Menelepon Hagga Fatma sekarang."]
    answer: 1
    meaning:
      ar_eg: يا ماس كريم، سلّملي على الحاجّة فاطمة.
      ar: يا ماس كريم، بلّغ سلامي الحاجّة فاطمة.
      en: Mas Karim, give my regards to Hagga Fatma.
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: توصل بالسلامة!
      ar: وصلتَ بالسلامة!
      en: Hope you arrive safely!
    answers: ["Semoga selamat sampai tujuan!", "Semoga selamat sampai tujuan", "Semoga selamat sampai di tujuan!", "Semoga selamat sampai di tujuan", "Selamat sampai tujuan!", "Selamat sampai tujuan", "Semoga sampai dengan selamat!", "Semoga sampai dengan selamat", "Semoga kamu selamat sampai tujuan!", "Semoga Anda selamat sampai tujuan!"]
next:
  ar_eg: في القاهرة، ساري ونادية لابسين جوانتيات ومعاهم شنط زبالة على شط النيل. وفي ماديون، بايو حطّ قانون جديد في الوارونج… ومش الكل مبسوط بيه.
  ar: في القاهرة ترتدي ساري ونادية قفّازات وتحملان أكياس قمامة على ضفّة النيل. وفي ماديون وضع بايو قاعدة جديدة في الوارونغ… ولا يرضى عنها الجميع.
  en: In Cairo, Sari and Nadia are on the Nile bank with gloves and rubbish bags. And in Madiun, Bayu has a new rule for the warung… which not everyone likes.
