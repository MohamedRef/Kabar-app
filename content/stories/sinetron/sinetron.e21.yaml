title:
  target: Selamat Jalan, Semoga Selamat
  ar_eg: مع السلامة، توصلوا بالسلامة
  ar: رافقتكم السلامة، وصلتم بالسلامة
  en: Farewell, and Arrive Safely
summary:
  ar_eg: آخر ليلة لساري في ماديون، وكريم عنده خبرين حلوين - نادية هتتخرّج، وهو لقى شغل جديد في القاهرة. الكل بيبارك، وتاني يوم الصبح العيلة والجيران بيودّعوهم بالدعا.
  ar: إنها الليلة الأخيرة لساري في ماديون، ولدى كريم خبران سعيدان - نادية ستتخرّج، وهو حصل على عمل جديد في القاهرة. يهنّئ الجميع، وفي صباح اليوم التالي تودّعهما العائلة والجيران بالدعاء.
  en: It's Sari's last night in Madiun, and Karim has two pieces of good news — Nadia is graduating, and he has a new job in Cairo. Congratulations all round, and next morning family and neighbours see them off with a prayer.
cast: [Pak Budi, Bu Rahayu, Bayu, Sari, Karim, Nadia, Mas Joko, Bu Tini]
scenes:
  - setting:
      ar_eg: الوارونج بعد العشا، يوم قبل السفر. شنطتين جنب الباب، ونادية على مكالمة فيديو من القاهرة.
      ar: الوارونغ بعد العشاء، قبل السفر بيوم. حقيبتان بجانب الباب، ونادية في اتصال مرئي من القاهرة.
      en: The warung after the evening prayer, the day before the flight. Two suitcases by the door, and Nadia is on a video call from Cairo.
    lines:
      - speaker: Narrator
        text: Malam terakhir di Madiun. Ada dua koper di dekat pintu warung, koper Sari dan koper Karim.
        ar_eg: آخر ليلة في ماديون. فيه شنطتين جنب باب الوارونج، شنطة ساري وشنطة كريم.
        ar: الليلة الأخيرة في ماديون. هناك حقيبتان قرب باب الوارونغ، حقيبة ساري وحقيبة كريم.
        en: The last night in Madiun. There are two suitcases by the warung door — Sari's and Karim's.
      - speaker: Karim
        text: Pak Budi, Bu Rahayu, saya punya dua kabar gembira. Pertama, Nadia diwisuda bulan depan!
        ar_eg: يا باك بودي، يا بو راهايو، عندي خبرين حلوين. أولًا، نادية هتتخرّج الشهر الجاي!
        ar: يا باك بودي، يا بو راهايو، لديّ خبران سعيدان. أولًا، ستتخرّج نادية الشهر القادم!
        en: Pak Budi, Bu Rahayu, I've got two pieces of good news. First, Nadia graduates next month!
        note:
          ar_eg: kabar جاية من العربي «خبر» - وده اسم الأبلكيشن نفسه! وwisuda يعني حفلة التخرّج، وdiwisuda «يتخرّج رسمي في الحفلة».
          ar: kabar من العربية «خبر» - وهو اسم التطبيق نفسه! وwisuda تعني حفل التخرّج، وdiwisuda «يُحتفى بتخرّجه رسميًّا».
          en: kabar comes from Arabic خبر (news) — it's this app's name! wisuda is a graduation ceremony; diwisuda means "to have your graduation".
      - speaker: Bu Rahayu
        text: Masyaallah! Selamat, Nadia! Semoga ilmunya bermanfaat.
        ar_eg: ما شاء الله! مبروك يا نادية! ربنا يجعل علمك نافع.
        ar: ما شاء الله! مبارك يا نادية! جعل الله علمكِ نافعًا.
        en: Masha'Allah! Congratulations, Nadia! May your knowledge be of benefit.
        note:
          ar_eg: «Selamat» لوحدها = «مبروك»، و«semoga» = «يا ريت / ربنا يجعل». الجملة دي دعوة مشهورة للمتخرّجين، وفيها كلمتين عربي - ilmu (علم) وbermanfaat (من منفعة).
          ar: «Selamat» وحدها تعني «مبارك»، و«semoga» تعني «عسى / جعل الله». وهذه دعوة شائعة للخرّيجين فيها كلمتان عربيّتان - ilmu (علم) وbermanfaat (من منفعة).
          en: '"Selamat" alone means "congratulations"; "semoga" means "may…". This is a classic wish for graduates, with two Arabic words in it: ilmu (علم, knowledge) and bermanfaat (from منفعة, benefit).'
      - speaker: Nadia
        text: Amin! Makasih, Bu. Doain saya, ya. Saya masih gugup.
        ar_eg: آمين! متشكّرة يا بو. ادعيلي بقى. أنا لسه متوترة.
        ar: آمين! شكرًا يا بو. ادعي لي. ما زلت متوتّرة.
        en: Amen! Thank you, Bu. Pray for me, okay? I'm still nervous.
        note:
          ar_eg: «Doain» هي doakan (ادعي لـ) في كلام الشارع - الـ ‎-kan بتبقى ‎-in. وmakasih = terima kasih. وgugup = متوتّر.
          ar: «Doain» هي doakan (ادعُ لـ) في الكلام اليومي - تصير اللاحقة ‎-kan إلى ‎-in. وmakasih = terima kasih. وgugup = متوتّر.
          en: Doain = doakan (pray for) — in everyday speech -kan becomes -in. makasih = terima kasih. gugup = nervous.
      - speaker: Pak Budi
        text: Lalu kabar yang kedua apa, Mas?
        ar_eg: وإيه الخبر التاني يا ماس؟
        ar: وما الخبر الثاني يا ماس؟
        en: And the second piece of news, Mas?
      - speaker: Karim
        text: Saya diterima kerja di biro perjalanan di Kairo. Saya mulai sesudah wisuda Nadia!
        ar_eg: اتقبلت في شغل في شركة سياحة في القاهرة. هبدأ بعد حفلة تخرّج نادية!
        ar: قُبلت للعمل في شركة سياحة في القاهرة. سأبدأ بعد حفل تخرّج نادية!
        en: I've been taken on at a travel agency in Cairo. I start after Nadia's graduation!
      - speaker: Bayu
        text: Wah, selamat, Mas Karim! Tapi... nanti siapa yang ngajarin aku masak koshari, dong?
        ar_eg: واو، مبروك يا ماس كريم! بس... مين اللي هيعلّمني أعمل كشري؟
        ar: رائع، مبارك يا ماس كريم! لكن... من سيعلّمني طبخ الكشري؟
        en: Wow, congratulations, Mas Karim! But... who's going to teach me to cook koshari?
        note:
          ar_eg: ngajarin = mengajari (يعلّم) في كلام الشارع - الـ me- بتقع والـ ‎-i بتبقى ‎-in. و«dong» بتدّي الكلام نبرة «بقى!». koshari = كشري، وmasak = يطبخ.
          ar: ngajarin = mengajari (يعلّم) في الكلام اليومي - تسقط me- وتصير ‎-i إلى ‎-in. و«dong» تضيف نبرة إلحاح ودّية. koshari = الكشري، وmasak = يطبخ.
          en: ngajarin = mengajari (to teach) in street speech — me- drops and -i becomes -in. "dong" adds a friendly "come on!". koshari is the Egyptian dish; masak = to cook.
      - speaker: Pak Budi
        text: Selamat atas pekerjaan barunya, Mas. Ini oleh-oleh dari kami. Brem buat Hagga Fatma, bumbu pecel buat Nadia.
        ar_eg: مبروك على الشغل الجديد يا ماس. ودي هدايا من عندنا. «بريم» للحاجّة فاطمة، وتتبيلة بيتشل لنادية.
        ar: مبارك على العمل الجديد يا ماس. وهذه هدايا منّا. «بريم» للحاجّة فاطمة، وتتبيلة البيتشل لنادية.
        en: Congratulations on the new job, Mas. Here's something from us. Brem for Hagga Fatma, pecel paste for Nadia.
        note:
          ar_eg: selamat atas = «مبروك على». وbuat = untuk (لـ) في الكلام. وbumbu = تتبيلة. وoleh-oleh هدايا السفر اللي بتجيبها من بلدك. وbrem حلويات من الرز المخمّر وتتبيلة البيتشل - الاتنين ماديون مشهورة بيهم.
          ar: selamat atas تعني «مبارك على». وbuat = untuk (لـ) في الكلام. وbumbu = تتبيلة. وoleh-oleh هدايا السفر من بلدك. والـ brem حلوى من الأرز المخمّر، وتتبيلة البيتشل - وماديون مشهورة بالاثنين.
          en: selamat atas = "congratulations on". buat = untuk (for) in speech; bumbu = spice paste. oleh-oleh are gifts you bring from home. Brem (a fermented-rice sweet) and pecel paste are both things Madiun is famous for.
      - speaker: Karim
        text: Makasih banyak, Pak. Bapak sama Ibu udah kayak keluarga saya.
        ar_eg: متشكّر أوي يا باك. حضرتك والمدام بقيتوا زي أهلي.
        ar: شكرًا جزيلًا يا باك. لقد صرتَ أنت وزوجتك مثل عائلتي.
        en: Thank you so much, Pak. You and Ibu have become like family to me.
        note:
          ar_eg: udah = sudah (خلاص / بقى)، وkayak = seperti (زي) - كلام كل يوم. وsama هنا = dan (و). مع الكبار بنقول Bapak / Ibu بدل kalian.
          ar: udah = sudah (قد / صار)، وkayak = seperti (مثل) - في الكلام اليومي. وsama هنا = dan (و). ومع الكبار يقال Bapak / Ibu بدل kalian.
          en: udah = sudah (already), kayak = seperti (like) — everyday speech. sama here = dan (and). With elders you say Bapak / Ibu rather than kalian.
  - setting:
      ar_eg: تاني يوم الساعة ٥ الصبح، في الحارة قدّام البيت. عربية ماس جوكو مستنية، والجيران صاحيين بدري.
      ar: صباح اليوم التالي في الخامسة، في الزقاق أمام البيت. سيارة ماس جوكو تنتظر، والجيران استيقظوا مبكّرًا.
      en: Next morning at five, in the lane outside the house. Mas Joko's car is waiting, and the neighbours are up early.
    lines:
      - speaker: Bu Tini
        text: Sari, Mas Karim, hati-hati di jalan, ya. Semoga selamat sampai tujuan!
        ar_eg: يا ساري، يا ماس كريم، خلّوا بالكم في السكة. توصلوا بالسلامة!
        ar: يا ساري، يا ماس كريم، انتبها في الطريق. وصلتما بالسلامة!
        en: Sari, Mas Karim, travel safely. Hope you arrive safe and sound!
        note:
          ar_eg: selamat جاية من العربي «سلامة». عشان كده «Selamat jalan» (للي مسافر) و«Selamat tinggal» (للي قاعد) معناهم الحرفي «سلامة في الطريق» و«سلامة في القعدة».
          ar: selamat من العربية «سلامة»؛ لذلك فإن «Selamat jalan» (للمسافر) و«Selamat tinggal» (للمقيم) تعنيان حرفيًّا «سلامة في الطريق» و«سلامة في البقاء».
          en: selamat comes from Arabic سلامة (safety). So "Selamat jalan" (to the one leaving) and "Selamat tinggal" (to the one staying) literally wish safety on the road and safety at home.
      - speaker: Mas Joko
        text: Mas Karim, sampaikan salam saya kepada Hagga Fatma, ya. Bilangin, kopinya kurang manis!
        ar_eg: يا ماس كريم، سلّملي على الحاجّة فاطمة. وقولها القهوة بتاعتها محتاجة سكّر!
        ar: يا ماس كريم، بلّغ سلامي الحاجّة فاطمة، وقل لها إن قهوتها تحتاج إلى سكّر!
        en: Mas Karim, give my regards to Hagga Fatma. Tell her her coffee isn't sweet enough!
        note:
          ar_eg: kepada بتيجي قبل الأشخاص (sampaikan salam kepada…)، وuntuk / bagi = «لـ / عشان». bagi أرسم شوية من untuk، وفي الكلام بنقول buat. وbilangin = «قولها» (من bilang).
          ar: تأتي kepada قبل الأشخاص (sampaikan salam kepada…)، أمّا untuk / bagi فتعنيان «لـ / من أجل»، وbagi أكثر رسمية من untuk، وفي الكلام يقال buat. وbilangin = «قل لها» (من bilang).
          en: kepada goes before people (sampaikan salam kepada… = give regards to…); untuk and bagi mean "for", bagi being a little more formal, and in speech people say buat. bilangin = "tell her" (from bilang, to say).
      - speaker: Bu Rahayu
        text: Nduk, jangan lupa makan, ya. Jangan tidur terlalu malam.
        ar_eg: يا بنتي، متنسيش تاكلي. ومتسهريش أوي.
        ar: يا ابنتي، لا تنسي أن تأكلي، ولا تسهري كثيرًا.
        en: Sweetheart, don't forget to eat. And don't stay up too late.
      - speaker: Sari
        text: Iya, Bu. Bapak juga, obatnya diminum, ya. Semoga Bapak sehat selalu.
        ar_eg: حاضر يا ماما. وانت كمان يا بابا، خُد الدوا بتاعك. ربنا يديم عليك الصحة.
        ar: حسنًا يا أمي. وأنت أيضًا يا أبي، تناول دواءك. أدام الله عليك الصحّة.
        en: Okay, Mum. And Dad, take your medicine, okay? Stay healthy always.
      - speaker: Pak Budi
        text: Ayo, kita berdoa dulu. Semoga Allah melindungi kalian di perjalanan.
        ar_eg: يلا، ندعي الأول. ربنا يحفظكم في السفر.
        ar: هيّا، لندعُ أولًا. حفظكم الله في سفركم.
        en: Come on, let's say a prayer first. May God protect you on the journey.
        note:
          ar_eg: doa من العربي «دعاء». وفي إندونيسيا زي مصر، الناس بتقرا دعاء السفر - «سبحان الذي سخّر لنا هذا…» - وهي راكبة.
          ar: doa من العربية «دعاء». وفي إندونيسيا كما في مصر يقرأ الناس دعاء السفر - «سبحان الذي سخّر لنا هذا…» - عند الركوب.
          en: doa comes from Arabic دعاء. In Indonesia, as in Egypt, people recite the travel prayer ("Glory be to Him who has placed this at our service…") as they set off.
      - speaker: Karim
        text: Amin. Pak, Bu, makasih buat semuanya. Insyaallah kita ketemu lagi di Kairo.
        ar_eg: آمين. يا باك، يا بو، شكرًا على كل حاجة. إن شاء الله نتقابل تاني في القاهرة.
        ar: آمين. يا باك، يا بو، شكرًا على كل شيء. إن شاء الله نلتقي مجدّدًا في القاهرة.
        en: Amen. Pak, Bu, thank you for everything. God willing, we'll meet again in Cairo.
        note:
          ar_eg: Insyaallah = إن شاء الله. وketemu = bertemu (نتقابل) في كلام الشارع.
          ar: Insyaallah = إن شاء الله. وketemu = bertemu (نلتقي) في الكلام اليومي.
          en: Insyaallah = God willing (إن شاء الله). ketemu = bertemu (to meet) in everyday speech.
      - speaker: Bayu
        text: Mbak, Mas Karim, sampai jumpa! Kirimin aku foto Sungai Nil, ya!
        ar_eg: أبلة، ماس كريم، سلام! ابعتولي صور النيل!
        ar: يا أختي، يا ماس كريم، إلى اللقاء! أرسلا لي صور نهر النيل!
        en: Sis, Mas Karim, see you! Send me photos of the Nile!
        note:
          ar_eg: kirimin = kirimi / kirimkan (ابعتلي) - تاني ‎-in بتاعة الشارع. وكلمة kirim لوحدها = يبعت.
          ar: kirimin = kirimi / kirimkan (أرسل لي) - مرّة أخرى ‎-in العامّية. وkirim وحدها = يرسل.
          en: kirimin = kirimi / kirimkan (send me) — the street -in again. kirim on its own = to send.
      - speaker: Narrator
        text: Mobil Mas Joko berangkat. Bu Rahayu melambaikan tangan, lalu melihat Pak Budi. Dia tersenyum.
        ar_eg: عربية ماس جوكو مشيت. بو راهايو بتشاور بإيدها، وبعدين بصّت لباك بودي. وابتسمت.
        ar: انطلقت سيارة ماس جوكو. لوّحت بو راهايو بيدها، ثم نظرت إلى باك بودي وابتسمت.
        en: Mas Joko's car pulls away. Bu Rahayu waves, then looks at Pak Budi. She smiles.
