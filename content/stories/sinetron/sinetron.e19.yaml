title:
  target: Lho, Kok Ada Sari?
  ar_eg: إيه ده، ساري هنا؟!
  ar: ماذا؟ ساري هنا؟!
  en: Wait — Sari's Here?!
summary:
  ar_eg: ساري بتخبّط على باب بيتها في ماديون، والمفاجأة بتقلب البيت. وتاني يوم الكل بيحكي الحكاية في جروب الواتساب، بالكتابة السريعة بتاعة الشات.
  ar: تطرق ساري باب بيتها في ماديون، فتقلب المفاجأة البيت رأسًا على عقب. وفي اليوم التالي يروي الجميع الحكاية في مجموعة واتساب بأسلوب الكتابة السريعة.
  en: Sari knocks on her own front door in Madiun, and the surprise turns the house upside down. Next day, everyone retells it in the WhatsApp group, in chat-speak.
cast: [Bu Rahayu, Sari, Pak Budi, Bayu, Nadia, Karim, Mas Joko, Hagga Fatma]
scenes:
  - setting:
      ar_eg: ماديون، الساعة ٩ بالليل بعد التراويح. بو راهايو بتفتح الباب.
      ar: ماديون، الساعة التاسعة ليلًا بعد التراويح. تفتح بو راهايو الباب.
      en: Madiun, 9 p.m., after tarawih. Bu Rahayu opens the door.
    lines:
      - speaker: Bu Rahayu
        text: Siapa? Udah malam!
        ar_eg: مين؟ الوقت متأخّر!
        ar: مَن؟ لقد تأخّر الوقت!
        en: Who is it? It's late!
        note:
          ar_eg: udah = sudah في الكلام اليومي.
          ar: udah = sudah في الكلام اليومي.
          en: udah = sudah (already) in everyday speech.
      - speaker: Sari
        text: Asalamualaikum, Bu.
        ar_eg: السلام عليكم يا ماما.
        ar: السلام عليكم يا أمي.
        en: Assalamu alaikum, Mum.
      - speaker: Bu Rahayu
        text: Lho? Sari?! Kok kamu di sini?
        ar_eg: إيه ده؟ ساري؟! انتي بتعملي إيه هنا؟!
        ar: ماذا؟ ساري؟! كيف أنتِ هنا؟!
        en: What? Sari?! How come you're here?
        note:
          ar_eg: lho بتعبّر عن المفاجأة (زي «إيه ده!»)، وkok يعني «إزاي / ليه كده؟» لما حاجة متوقّعتهاش. الاتنين جاويين في الأصل وبيتقالوا في كل إندونيسيا.
          ar: lho تعبّر عن المفاجأة (مثل «ماذا!»)، وkok تعني «كيف / لماذا؟» أمام أمر غير متوقَّع. أصلهما جاوي ويُستعملان في كل إندونيسيا.
          en: lho expresses surprise ("hey, what!"), and kok means "how come?" about something unexpected. Both are Javanese in origin and used all over Indonesia.
      - speaker: Pak Budi
        text: Ada apa, Bu? Nduk?! Ini betul kamu?
        ar_eg: فيه إيه يا راهايو؟ يا بنتي؟! ده بجد انتي؟
        ar: ماذا هناك؟ يا ابنتي؟! أهذه أنتِ حقًّا؟
        en: What's going on? Sweetheart?! Is it really you?
      - speaker: Sari
        text: Betul, Pak! Aku pulang untuk Lebaran!
        ar_eg: أيوه يا بابا! رجعت عشان العيد!
        ar: نعم يا أبي! عدت من أجل العيد!
        en: It's me, Dad! I've come home for Lebaran!
      - speaker: Bu Rahayu
        text: Aduh, Nduk... Kok kamu nggak cerita?
        ar_eg: يا خبر يا بنتي... ليه مقولتيش؟
        ar: آه يا ابنتي... لماذا لم تخبرينا؟
        en: Oh, sweetheart... why didn't you tell us?
        note:
          ar_eg: nggak = tidak (مش).
          ar: nggak = tidak (لا).
          en: nggak = tidak (not).
      - speaker: Bayu
        text: Rahasia, dong! Uang takjilku untuk tiket Mbak Sari!
        ar_eg: سرّ طبعًا! فلوس التعجيل بتاعتي راحت لتذكرة أبلة ساري!
        ar: سرّ طبعًا! مال التعجيل الذي جمعته كان لتذكرة أختي ساري!
        en: It was a secret, obviously! My takjil money went on Sari's ticket!
        note:
          ar_eg: dong في آخر الجملة بتدّي معنى «طبعًا / أومال!» - الحاجة واضحة. وtakjilku = takjil saya.
          ar: dong في آخر الجملة تعني «طبعًا!»، أي أن الأمر بديهي. وtakjilku = takjil saya.
          en: dong at the end adds "obviously!" — it's clear as day. takjilku = takjil saya (my takjil).
      - speaker: Pak Budi
        text: Bayu... Uang untuk tiket ke Kairo?
        ar_eg: بايو... الفلوس اللي كانت لتذاكر القاهرة؟
        ar: بايو... المال الذي كان لتذاكر القاهرة؟
        en: Bayu... the money for the Cairo tickets?
      - speaker: Bayu
        text: Bapak harus sehat. Kairo nanti aja, Pak!
        ar_eg: انت لازم تبقى كويس يا بابا. القاهرة بعدين!
        ar: يجب أن تكون بصحّة جيّدة يا أبي. القاهرة لاحقًا!
        en: You need to get well, Dad. Cairo can wait!
        note:
          ar_eg: aja = saja (بس / وخلاص).
          ar: aja = saja (فقط).
          en: aja = saja (just).
      - speaker: Narrator
        text: Pak Budi, Bu Rahayu, Sari, dan Bayu berpelukan.
        ar_eg: باك بودي وبو راهايو وساري وبايو حضنوا بعض.
        ar: تعانق باك بودي وبو راهايو وساري وبايو.
        en: Pak Budi, Bu Rahayu, Sari and Bayu hug one another.
  - setting:
      ar_eg: تاني يوم. جروب واتساب اسمه «Kairo–Madiun». الرسايل مكتوبة بالاختصارات اللي الإندونيسيين بيستعملوها في الشات.
      ar: اليوم التالي. مجموعة واتساب اسمها «Kairo–Madiun». الرسائل مكتوبة بالاختصارات التي يستعملها الإندونيسيون في المحادثات.
      en: The next day. A WhatsApp group called "Kairo–Madiun". The messages are written in Indonesian chat shorthand.
    lines:
      - speaker: Nadia
        text: Sari udh sampai? Pak Budi senang gk?
        ar_eg: ساري وصلت؟ باك بودي اتبسط ولا لأ؟
        ar: هل وصلت ساري؟ هل فرح باك بودي أم لا؟
        en: Has Sari arrived? Was Pak Budi happy?
        note:
          ar_eg: في الشات - udh = sudah، وgk = nggak (لأ)، وbgt = banget (أوي)، وwkwk = ضحك (زي «هههه»).
          ar: في المحادثات - udh = sudah، وgk = nggak (لا)، وbgt = banget (جدًّا)، وwkwk = ضحك (مثل «هههه»).
          en: 'In chat: udh = sudah, gk = nggak (no/not), bgt = banget (very), wkwk = laughter ("haha").'
      - speaker: Sari
        text: Udh! Bapak senang bgt. Ibu juga wkwk
        ar_eg: وصلت! بابا مبسوط أوي. وماما كمان هههه
        ar: وصلت! أبي سعيد جدًّا. وأمي أيضًا هههه
        en: Yep! Dad's super happy. Mum too haha
      - speaker: Karim
        text: Perjalanannya melelahkan, tapi seru! Mas Joko nyetir 3 jam. Mantap!
        ar_eg: الرحلة كانت مُتعبة، بس كانت حلوة! ماس جوكو ساق ٣ ساعات. جامد!
        ar: كانت الرحلة متعبة، لكنها ممتعة! قاد ماس جوكو ثلاث ساعات. رائع!
        en: The trip was exhausting, but fun! Mas Joko drove for 3 hours. Legend!
      - speaker: Mas Joko
        text: Makasih, Mas Karim. Tapi Sari tidur di mobil wkwk
        ar_eg: متشكّر يا ماس كريم. بس ساري نامت في العربية هههه
        ar: شكرًا يا ماس كريم. لكن ساري نامت في السيارة هههه
        en: Thanks, Mas Karim. But Sari fell asleep in the car haha
      - speaker: Hagga Fatma
        text: Alhamdulillah. Kurmanya udh sampai?
        ar_eg: الحمد لله. التمر وصل؟
        ar: الحمد لله. هل وصل التمر؟
        en: Thank God. Did the dates arrive?
      - speaker: Bayu
        text: Udh, Hagga! Enak bgt. Makasih!
        ar_eg: وصل يا حاجّة! حلو أوي. شكرًا!
        ar: وصل يا حاجّة! لذيذ جدًّا. شكرًا!
        en: Yes, Hagga! Super tasty. Thanks!
      - speaker: Pak Budi
        text: Terima kasih semua. Bapak sudah lebih sehat. Salam dari Madiun.
        ar_eg: شكرًا للكل. أنا بقيت أحسن. سلام من ماديون.
        ar: شكرًا للجميع. صرت بصحّة أفضل. تحيّة من ماديون.
        en: Thank you, everyone. I'm feeling better already. Greetings from Madiun.
        note:
          ar_eg: باك بودي بيكتب كلام كامل ورسمي في الشات - من غير اختصارات - زي أغلب الأهالي الكبار. الشباب في الجروب أكيد بيضحكوا.
          ar: يكتب باك بودي كلمات كاملة رسمية بلا اختصارات، كأغلب الآباء الكبار، والشباب في المجموعة يبتسمون بالتأكيد.
          en: Pak Budi types full, formal words — no shorthand — like most older parents. The young ones in the group are surely smiling.
      - speaker: Nadia
        text: Gaes, 3 hari lagi Lebaran!
        ar_eg: يا جماعة، فاضل ٣ أيام على العيد!
        ar: يا جماعة، بقيت ثلاثة أيام على العيد!
        en: Guys, Lebaran's in 3 days!
new_words:
  - word: lho
    ar_eg: إيه ده! (مفاجأة)
    ar: ماذا! (للمفاجأة)
    en: hey! what! (surprise)
  - word: kok
    ar_eg: إزاي؟ / ليه كده؟
    ar: كيف؟ / لماذا؟ (استغراب)
    en: how come?
  - word: berpelukan
    pos: verb
    ar_eg: يحضنوا بعض
    ar: يتعانقون
    en: to hug each other
  - word: nyetir
    pos: verb
    ar_eg: يسوق (عامية من menyetir)
    ar: يقود (عامية من menyetir)
    en: to drive (informal of menyetir)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: بو راهايو قالت إيه لما شافت ساري؟
      ar: ماذا قالت بو راهايو حين رأت ساري؟
      en: What does Bu Rahayu say when she sees Sari?
    options: ["Sampai jumpa, Nduk!", "Lho? Sari?! Kok kamu di sini?", "Selamat pagi, Sari!"]
    answer: 1
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: «udh» في الشات معناها إيه؟
      ar: ماذا تعني «udh» في المحادثات؟
      en: What does "udh" mean in chat?
    options: ["sudah", "juga", "untuk", "tidak"]
    answer: 0
  - id: q03
    type: fill_blank
    sentence: Bapak senang ___. Ibu juga wkwk
    meaning:
      ar_eg: بابا مبسوط أوي. وماما كمان هههه
      ar: أبي سعيد جدًّا. وأمي أيضًا هههه
      en: Dad's super happy. Mum too haha
    answers: [bgt]
    options: ["gk", "udh", "bgt"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: بايو عمل إيه بفلوس التعجيل؟
      ar: ماذا فعل بايو بمال التعجيل؟
      en: What did Bayu do with his takjil money?
    options: ["Dia membeli fanous.", "Dia membeli tiket ke Kairo untuk Bapak.", "Dia membantu membeli tiket Sari."]
    answer: 2
  - id: q05
    type: translate
    direction: from_target
    source_text: Kok kamu nggak cerita?
    answers_meaning:
      ar_eg: ["ليه مقولتليش؟", "إزاي محكيتيش؟", "ليه محكيتلناش؟"]
      ar: ["لماذا لم تخبرني؟", "كيف لم تحكِ لنا؟", "لماذا لم تقل شيئًا؟"]
      en: ["How come you didn't tell us?", "Why didn't you say anything?", "Why didn't you tell me?"]
next:
  ar_eg: باك بودي عنده آخر زيارة للدكتور قبل العيد... وبعدين صباح العيد، الكل مع بعض لأول مرة من زمان.
  ar: لدى باك بودي زيارة أخيرة للطبيب قبل العيد... ثم صباح العيد، والجميع معًا لأول مرة منذ زمن.
  en: Pak Budi has one last doctor's visit before Lebaran... and then it's Lebaran morning, and everyone is together for the first time in ages.
