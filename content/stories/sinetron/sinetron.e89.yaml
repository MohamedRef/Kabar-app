title:
  target: Dipunyasa dening saudagar
  ar_eg: بناه تاجر
  ar: بناه تاجر
  en: Built by a merchant
summary:
  ar_eg: في جيريلويو، قرية الباتيك المرسوم في إيموجيري، كريم بيترجم لوحة بكراما رسمي على بيت تاجر باتيك قديم - وبيفهم إن dipun- و-ipun و-aken هم نسخة الكراما من di- و-e و-ke. وفي الآخر، پاك هارجو بيدّيله جواب توصية لعيلة ساكنة جنب التوجو.
  ar: في جيريلويو، قرية الباتيك المرسوم في إيموغيري، يترجم كريم لوحة بكراما رسمية على بيت تاجر باتيك قديم - ويفهم أنّ dipun- و-ipun و-aken هي نسخ الكراما من di- و-e و-ke. وفي النهاية يعطيه باك هارجو رسالة توصية إلى عائلة تسكن قرب التوغو.
  en: In Giriloyo, the hand-drawn batik village in Imogiri, Karim translates a formal krama sign on an old batik merchant's house - and works out that dipun-, -ipun and -aken are the krama twins of di-, -e and -ke. At the end, Pak Harjo gives him a letter of introduction to a family near the Tugu.
cast: [Karim, Pak Harjo]
scenes:
  - setting:
      ar_eg: قرية جيريلويو، العصر. الغيطان خضرا، والستّات بيرسموا باتيك قدّام البيوت. على باب بيت قديم لوحة خشب.
      ar: قرية جيريلويو، عصرًا. حقول خضراء، والنساء يرسمن الباتيك أمام البيوت. وعلى باب بيت قديم لوحة خشبية.
      en: Giriloyo village, late afternoon. Green rice fields, and women drawing batik on their porches. A wooden sign hangs by the door of an old house.
    lines:
      - speaker: Pak Harjo
        text: Nak, menika papan wonten griya saudagar. Mangga dipunwaos.
        ar_eg: يا ابني، دي لوحة على بيت تاجر. اتفضّل اقراها.
        ar: يا بنيّ، هذه لوحة على بيت تاجر. تفضّل اقرأها.
        en: My boy, here's a sign on a merchant's house. Go on, read it.
        note:
          ar_eg: "كلمات: nak = يا ابني (نداء)؛ papan = مكان."
          ar: "مفردات: nak = يا بنيّ (نداء)؛ papan = مكان."
          en: "Words: nak = my boy, son (calling someone); papan = place = tempat."
      - speaker: Karim
        text: "Griya punika dipunyasa dening saudagar batik ing taun 1910."
        ar_eg: "«البيت ده بناه تاجر باتيك سنة 1910»."
        ar: "«بنى هذا البيتَ تاجرُ باتيك سنة 1910»."
        en: "\"This house was built by a batik merchant in 1910.\""
        note:
          ar_eg: "dipun- = di- بالكراما (مبني للمجهول). dipunyasa = «اتبنى». وdening = بواسطة."
          ar: "dipun- = di- بالكراما (للمبني للمجهول). dipunyasa = «بُني». وdening = من قِبَل."
          en: "dipun- = krama di- (passive). dipunyasa = \"was built\". dening = by."
      - speaker: Pak Harjo
        text: Leres. Lajeng?
        ar_eg: صحّ. وبعدين؟
        ar: صحيح. ثمّ؟
        en: Right. Then?
      - speaker: Karim
        text: "Batikipun dipundamel kanthi tangan, lajeng dipunsade wonten Pasar Beringharjo."
        ar_eg: «الباتيك بتاعه كان بيتعمل بالإيد، وبعدين بيتباع في سوق بيرينجهارجو».
        ar: «كان الباتيك يُصنع يدويًّا، ثمّ يُباع في سوق بيرينغهارجو».
        en: '"Its batik was made by hand, then sold at Pasar Beringharjo."'
        note:
          ar_eg: "-ipun = -e بالكراما («بتاعه / الـ»). batikipun = «الباتيك بتاعه». وdipundamel = «اتعمل»، dipunsade = «اتباع». كلمات: kanthi = بـ / عن طريق (في الكتابة)."
          ar: "-ipun = -e بالكراما (الملكية أو التعريف). batikipun = «الباتيك الخاصّ به». وdipundamel = «صُنع»، dipunsade = «بيع». مفردات: kanthi = بـ / عن طريق (في الكتابة)."
          en: "-ipun = krama -e (\"its / the\"). batikipun = \"its batik\". dipundamel = \"was made\", dipunsade = \"was sold\". Words: kanthi = by means of, with (written) = dengan."
      - speaker: Pak Harjo
        text: "Sae sanget! Wonten Giriloyo, ibu-ibu nyerat batik tulis wiwit rumiyin."
        ar_eg: "حلو أوي! في جيريلويو، الستّات بيرسموا باتيك من زمان."
        ar: "ممتاز! في جيريلويو ترسم النساء الباتيك منذ زمن بعيد."
        en: "Excellent! In Giriloyo, the women have drawn batik tulis since long ago."
        note:
          ar_eg: "nyerat = يكتب بالكراما، وبيتقال كمان على رسم الباتيك. جيريلويو قريبة من مقابر الملوك في إيموجيري، وبعد زلزال ٢٠٠٦ القرية قامت تاني بالباتيك."
          ar: "nyerat = يكتب بالكراما، ويقال أيضًا عن رسم الباتيك. جيريلويو قريبة من المقابر الملكية في إيموغيري، وبعد زلزال ٢٠٠٦ نهضت القرية من جديد بالباتيك."
          en: "nyerat = krama \"write\", also said of drawing batik. Giriloyo sits near the royal tombs of Imogiri; after the 2006 earthquake the village rebuilt itself through batik."
      - speaker: Karim
        text: "Kula badhe nerjemahaken menika dhateng basa Arab, kangge buku kula."
        ar_eg: "هترجم ده للعربي، عشان كتابي."
        ar: "سأترجم هذا إلى العربية، من أجل كتابي."
        en: "I'll translate this into Arabic, for my book."
        note:
          ar_eg: -aken = -ke / -ake بالكراما. nerjemahaken = «يترجم (حاجة) لـ». وكمان ngaturaken = «يقدّم لـ (حدّ محترم)».
          ar: -aken = -ke / -ake بالكراما. nerjemahaken = «يترجم (شيئًا) إلى». وكذلك ngaturaken = «يقدّم إلى (شخص محترم)».
          en: -aken = krama -ke / -ake. nerjemahaken = "translate (something) into". Likewise ngaturaken = "present to (someone respected)".
  - setting:
      ar_eg: آخر ليلة في بيت پاك هارجو. بو هارجو لابسة الباتيك الجديد. پاك هارجو بيدّي كريم ظرف.
      ar: الليلة الأخيرة في بيت باك هارجو. ترتدي بو هارجو الباتيك الجديد. ويعطي باك هارجو كريمًا ظرفًا.
      en: The last night at Pak Harjo's house. Bu Harjo is wearing her new batik. Pak Harjo hands Karim an envelope.
    lines:
      - speaker: Pak Harjo
        text: Nak, menika serat kangge Pak Harsono, cedhak Tugu. Piyambakipun kanca kula.
        ar_eg: يا ابني، ده جواب لپاك هارسونو، جنب التوجو. ده صاحبي.
        ar: يا بنيّ، هذه رسالة إلى باك هارسونو قرب التوغو. إنه صديقي.
        en: My boy, here's a letter for Pak Harsono, near the Tugu. He's a friend of mine.
        note:
          ar_eg: "كلمات: serat = جواب، رسالة (كراما)."
          ar: "مفردات: serat = رسالة (كراما)."
          en: "Words: serat = letter (krama; ngoko layang)."
      - speaker: Karim
        text: "Matur nuwun sanget, Pak."
        ar_eg: "متشكّر جدًّا يا پاك."
        ar: "شكرًا جزيلًا يا باك."
        en: "Thank you so much, Pak."
      - speaker: Pak Harjo
        text: Ananging kulawarga Pak Harsono ngagem krama inggil langkung kathah. Ngatos-atos, nggih.
        ar_eg: بس عيلة پاك هارسونو بيستعملوا كراما إنجيل أكتر. خلّي بالك، ماشي.
        ar: لكنّ عائلة باك هارسونو تستعمل الكراما إنغيل أكثر. انتبه، حسنًا.
        en: But Pak Harsono's family uses even more krama inggil. Take care, all right.
        note:
          ar_eg: "كلمات: ananging = بس، لكن."
          ar: "مفردات: ananging = لكن."
          en: "Words: ananging = but, however."
      - speaker: Narrator
        text: "Kaca sangalas. Giriloyo sampun rampung."
        ar_eg: "صفحة تسعتاشر. جيريلويو خلصت."
        ar: "الصفحة التاسعة عشرة. انتهت جيريلويو."
        en: "Page nineteen. Giriloyo is done."
