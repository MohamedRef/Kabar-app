    question_meaning:
      ar_eg: مين بنى البيت حسب اللوحة؟
      ar: من بنى البيت بحسب اللوحة؟
      en: According to the sign, who built the house?
    options: ["saudagar batik", "Pak Harjo", "Walanda"]
    answer: 0
