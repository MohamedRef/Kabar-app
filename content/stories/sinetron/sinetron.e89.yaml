title:
  target: Dipunyasa dening saudagar
  ar_eg: بناه تاجر
  ar: بناه تاجر
  en: Built by a merchant
summary:
  ar_eg: في لاوييان، حيّ تجّار الباتيك، كريم بيترجم لوحة بكراما رسمي على بيت تاجر قديم - وبيفهم إن dipun- و-ipun و-aken هم نسخة الكراما من di- و-e و-ke. وفي الآخر، پاك هارجو بيدّيله جواب توصية لعيلة في يوجياكارتا.
  ar: في لاوييان، حيّ تجّار الباتيك، يترجم كريم لوحة بكراما رسمية على بيت تاجر قديم - ويفهم أنّ dipun- و-ipun و-aken هي نسخ الكراما من di- و-e و-ke. وفي النهاية يعطيه باك هارجو رسالة توصية إلى عائلة في يوغياكارتا.
  en: In Laweyan, the batik merchants' quarter, Karim translates a formal krama sign on an old merchant's house - and works out that dipun-, -ipun and -aken are the krama twins of di-, -e and -ke. At the end, Pak Harjo gives him a letter of introduction to a family in Yogyakarta.
cast: [Karim, Pak Harjo]
scenes:
  - setting:
      ar_eg: حواري لاوييان، العصر. حيطان عالية، وبيوت تجّار قديمة فيها شبابيك أوروبية. على باب واحد منهم لوحة نحاس.
      ar: أزقّة لاوييان، عصرًا. جدران عالية، وبيوت تجّار قديمة بنوافذ أوروبية الطراز. وعلى باب أحدها لوحة نحاسية.
      en: The lanes of Laweyan, late afternoon. High walls and old merchants' houses with European-style windows. A brass plaque hangs by one door.
    lines:
      - speaker: Pak Harjo
        text: Nak, menika papan wonten griya saudagar. Mangga dipunwaos.
        ar_eg: يا ابني، دي لوحة على بيت تاجر. اتفضّل اقراها.
        ar: يا بنيّ، هذه لوحة على بيت تاجر. تفضّل اقرأها.
        en: My boy, here's a sign on a merchant's house. Go on, read it.
      - speaker: Karim
        text: "Griya punika dipunyasa dening saudagar batik ing awal abad kaping kalih dasa."
        ar_eg: «البيت ده بناه تاجر باتيك في أوائل القرن العشرين».
        ar: «بنى هذا البيتَ تاجرُ باتيك في أوائل القرن العشرين».
        en: '"This house was built by a batik merchant in the early twentieth century."'
        note:
          ar_eg: dipun- = di- بالكراما (مبني للمجهول). dipunyasa = «اتبنى». وdening = بواسطة.
          ar: dipun- = di- بالكراما (للمبني للمجهول). dipunyasa = «بُني». وdening = من قِبَل.
          en: dipun- = krama di- (passive). dipunyasa = "was built". dening = by.
      - speaker: Pak Harjo
        text: Leres. Lajeng?
        ar_eg: صحّ. وبعدين؟
        ar: صحيح. ثمّ؟
        en: Right. Then?
      - speaker: Karim
        text: "Batikipun dipundamel kanthi tangan, lajeng dipunsade dumugi Singapura."
        ar_eg: «الباتيك بتاعه كان بيتعمل بالإيد، وبعدين بيتباع لحدّ سنغافورة».
        ar: «كان الباتيك يُصنع يدويًّا، ثمّ يُباع حتى سنغافورة».
        en: '"Its batik was made by hand, then sold as far as Singapore."'
        note:
          ar_eg: -ipun = -e بالكراما («بتاعه / الـ»). batikipun = «الباتيك بتاعه». وdipundamel = «اتعمل»، dipunsade = «اتباع».
          ar: -ipun = -e بالكراما (الملكية أو التعريف). batikipun = «الباتيك الخاصّ به». وdipundamel = «صُنع»، dipunsade = «بيع».
          en: -ipun = krama -e ("its / the"). batikipun = "its batik". dipundamel = "was made", dipunsade = "was sold".
      - speaker: Pak Harjo
        text: Sae sanget! Wonten Laweyan ugi kawiwitan Sarekat Dagang Islam. Para saudagar Muslim nyawiji.
        ar_eg: حلو أوي! وفي لاوييان كمان اتأسّست «جمعية التجّار المسلمين». التجّار المسلمين اتّحدوا.
        ar: ممتاز! وفي لاوييان أيضًا نشأت «جمعية التجّار المسلمين». اتّحد التجّار المسلمون.
        en: Excellent! Laweyan is also where Sarekat Dagang Islam began. The Muslim merchants joined together.
        note:
          ar_eg: Sarekat Dagang Islam اتأسّست في سولو حوالي ١٩٠٥ (وفيه مؤرّخين بيقولوا ١٩١١) على إيد تاجر باتيك اسمه الحاج سمنهودي، وكانت من أوائل الحركات المنظّمة في إندونيسيا.
          ar: تأسّست Sarekat Dagang Islam في سولو نحو عام ١٩٠٥ (ويقول بعض المؤرّخين ١٩١١) على يد تاجر الباتيك الحاج سمنهودي، وكانت من أوائل الحركات المنظّمة في إندونيسيا.
          en: Sarekat Dagang Islam was founded in Solo around 1905 (some historians say 1911) by batik trader Haji Samanhudi, one of Indonesia's first organised movements.
      - speaker: Karim
        text: Kula badhe nerjemahaken papan menika dhateng basa Arab, kangge buku kula.
        ar_eg: هترجم اللوحة دي للعربي، عشان كتابي.
        ar: سأترجم هذه اللوحة إلى العربية، من أجل كتابي.
        en: I'll translate this sign into Arabic, for my book.
        note:
          ar_eg: -aken = -ke / -ake بالكراما. nerjemahaken = «يترجم (حاجة) لـ». وكمان ngaturaken = «يقدّم لـ (حدّ محترم)».
          ar: -aken = -ke / -ake بالكراما. nerjemahaken = «يترجم (شيئًا) إلى». وكذلك ngaturaken = «يقدّم إلى (شخص محترم)».
          en: -aken = krama -ke / -ake. nerjemahaken = "translate (something) into". Likewise ngaturaken = "present to (someone respected)".
  - setting:
      ar_eg: آخر ليلة في سولو. بيت پاك هارجو. بو هارجو لابسة الباتيك الجديد. پاك هارجو بيدّي كريم ظرف.
      ar: الليلة الأخيرة في سولو. بيت باك هارجو. ترتدي بو هارجو الباتيك الجديد. ويعطي باك هارجو كريمًا ظرفًا.
      en: The last night in Solo. Pak Harjo's house. Bu Harjo is wearing her new batik. Pak Harjo hands Karim an envelope.
    lines:
      - speaker: Pak Harjo
        text: Nak, menika serat kangge Pak Harsono wonten Ngayogyakarta. Piyambakipun kanca kula.
        ar_eg: يا ابني، ده جواب لپاك هارسونو في يوجياكارتا. ده صاحبي.
        ar: يا بنيّ، هذه رسالة إلى باك هارسونو في يوغياكارتا. إنه صديقي.
        en: My boy, here's a letter for Pak Harsono in Yogyakarta. He's a friend of mine.
      - speaker: Karim
        text: Matur nuwun sanget, Pak. Serat menika badhe kula aturaken.
        ar_eg: متشكّر جدًّا يا پاك. هسلّم الجواب ده بإيدي.
        ar: شكرًا جزيلًا يا باك. سأسلّم هذه الرسالة.
        en: Thank you so much, Pak. I'll deliver this letter.
      - speaker: Pak Harjo
        text: Ananging wonten Ngayogyakarta, tiyang sepuh ngagem krama inggil langkung kathah. Ngatos-atos, nggih.
        ar_eg: بس في يوجياكارتا، الناس الكبار بيستعملوا كراما إنجيل أكتر. خلّي بالك، ماشي.
        ar: لكن في يوغياكارتا يستعمل كبار السنّ الكراما إنغيل أكثر. انتبه، حسنًا.
        en: But in Yogyakarta, elders use even more krama inggil. Take care, all right.
      - speaker: Narrator
        text: Kaca sangalas. Dipun-, -ipun, -aken. Solo sampun rampung.
        ar_eg: صفحة تسعتاشر. dipun-، -ipun، -aken. سولو خلصت.
        ar: الصفحة التاسعة عشرة. dipun-، -ipun، -aken. انتهت سولو.
        en: Page nineteen. Dipun-, -ipun, -aken. Solo is done.
