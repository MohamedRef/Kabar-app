next:
  ar_eg: يوجياكارتا. عيلة پاك هارسونو بتستقبل كريم بحرارة... وكريم بيقول «Kula sampun dhahar» - وبو هارسونو بتضحك لحدّ ما بتعيّط.
  ar: يوغياكارتا. تستقبل عائلة باك هارسونو كريمًا بحفاوة... فيقول كريم «Kula sampun dhahar» - وتضحك بو هارسونو حتى تدمع عيناها.
  en: Yogyakarta. Pak Harsono's family welcomes Karim warmly... and Karim says "Kula sampun dhahar" - and Bu Harsono laughs until she cries.
review:
  status: draft
  verified: false
  notes: Moved from Laweyan (Solo) to Giriloyo (Imogiri) for the Jogja-only Javanese track, 2026-10-27; the Sarekat Dagang Islam line went with Laweyan. The plaque text is invented for the story. Check "nyerat batik" as a natural phrase (nulis/mbatik in ngoko) and the 2006 earthquake note.
