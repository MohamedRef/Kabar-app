title:
  target: Meskipun Jauh, Tetap Ibu Kota
  ar_eg: بعيدة آه، بس عاصمة برضه
  ar: بعيدة، لكنّها العاصمة
  en: Far Away, But Still the Capital
summary:
  ar_eg: ساري بتترجم لوفد من الإمارات في زيارة للعاصمة الجديدة «نوسانتارا» - من نقطة الصفر للقصر اللي على شكل جارودا. وبالليل، العيلة بتتناقش على الفيديو - العاصمة الجديدة فكرة كويسة ولا لأ؟ وبايو بيكتب مقال عن الموضوع.
  ar: تترجم ساري لوفد من الإمارات في زيارة إلى العاصمة الجديدة «نوسانتارا» - من نقطة الصفر إلى القصر الذي يتّخذ شكل الغارودا. وفي الليل تتناقش العائلة عبر الفيديو - هل العاصمة الجديدة فكرة جيّدة؟ ويكتب بايو مقالًا عن ذلك.
  en: Sari interprets for a delegation from the UAE on a visit to Nusantara, the new capital - from Zero Point to the Garuda-shaped palace. That night the family argues on video - is the new capital a good idea? And Bayu writes an essay about it.
cast: [Pak Hendra, Sari, Bayu, Pak Budi, Bu Rahayu, Mas Joko, Nadia]
scenes:
  - setting:
      ar_eg: أتوبيس الوفد في الطريق من باليكپاپان لـ IKN نوسانتارا، الساعة ٦ الصبح. ضيوف من الإمارات قاعدين قدّام، وساري جنبهم ومعاها نوتة.
      ar: حافلة الوفد في الطريق من باليكبابان إلى العاصمة نوسانتارا، السادسة صباحًا. يجلس الضيوف الإماراتيون في الأمام، وساري بجانبهم ومعها مفكّرة.
      en: The delegation's bus on the road from Balikpapan to IKN Nusantara, 6 a.m. Guests from the UAE sit at the front, with Sari beside them holding a notebook.
    lines:
      - speaker: Narrator
        text: Perjalanan dari Balikpapan ke Ibu Kota Nusantara memakan waktu sekitar dua jam. Di luar jendela, hutan dan kebun berganti dengan alat-alat berat dan jalan baru.
        ar_eg: الطريق من باليكپاپان لعاصمة نوسانتارا بياخد حوالي ساعتين. برّه الشبّاك، الغابات والمزارع بتتبدّل بمعدّات تقيلة وطرق جديدة.
        ar: تستغرق الرحلة من باليكبابان إلى العاصمة نوسانتارا نحو ساعتين. وخارج النافذة تتبدّل الغابات والمزارع بالآليات الثقيلة والطرق الجديدة.
        en: The journey from Balikpapan to the capital Nusantara takes about two hours. Outside the window, forest and plantations give way to heavy machinery and new roads.
        note:
          ar_eg: IKN اختصار Ibu Kota Nusantara (عاصمة نوسانتارا). إندونيسيا قرّرت بقانون سنة ٢٠٢٢ إنها تنقل العاصمة من جاكرتا لكاليمانتان الشرقية، والبناء لسّه شغّال.
          ar: IKN اختصار Ibu Kota Nusantara (عاصمة نوسانتارا). قرّرت إندونيسيا بقانون صدر عام ٢٠٢٢ نقل العاصمة من جاكرتا إلى كاليمانتان الشرقية، وما زال البناء جاريًا.
          en: IKN stands for Ibu Kota Nusantara (Nusantara Capital City). A 2022 law set out the move of the capital from Jakarta to East Kalimantan, and building is still under way.
      - speaker: Pak Hendra
        text: Mbak Sari, hari ini Mbak menjadi jembatan kami. Tamu kita ingin melihat pembangunan IKN secara langsung, karena mereka tertarik bekerja sama.
        ar_eg: يا مبك ساري، النهارده إنتي الجسر بتاعنا. ضيوفنا عايزين يشوفوا بناء العاصمة بعينهم، عشان مهتمّين يتعاونوا معانا.
        ar: يا مبك ساري، أنتِ جسرنا اليوم. يريد ضيوفنا رؤية بناء العاصمة بأعينهم، لأنّهم مهتمّون بالتعاون.
        en: Mbak Sari, today you're our bridge. Our guests want to see the building of IKN with their own eyes, because they're interested in working together.
      - speaker: Sari
        text: Pak Hendra, beliau bertanya, mengapa ibu kota harus pindah dari Jakarta, padahal Jakarta sudah punya segalanya?
        ar_eg: يا پاك هندرا، حضرته بيسأل - ليه العاصمة لازم تتنقل من جاكرتا، مع إن جاكرتا فيها كل حاجة؟
        ar: يا باك هندرا، يسأل سيادته - لماذا يجب أن تنتقل العاصمة من جاكرتا، مع أنّ جاكرتا فيها كلّ شيء؟
        en: Pak Hendra, he's asking why the capital has to move from Jakarta, when Jakarta already has everything?
        note:
          ar_eg: beliau ضمير الغايب المؤدّب (هو/هي بس باحترام) - زي «حضرته». والمترجم بيستعمله لما ينقل كلام ضيف كبير. وpadahal يعني «مع إن» (وده عكس المتوقّع).
          ar: beliau ضمير الغائب المهذّب، كقولنا «سيادته» أو «حضرته». ويستعمله المترجم حين ينقل كلام ضيف رفيع. وpadahal تعني «مع أنّ» لما يخالف المتوقّع.
          en: beliau is the respectful "he/she" - an interpreter uses it when relaying an important guest's words. padahal means "even though", for something that goes against expectations.
      - speaker: Pak Hendra
        text: Meskipun Jakarta punya segalanya, Jakarta juga punya banyak masalah. Macet, banjir, dan sebagian tanahnya turun setiap tahun. Selain itu, pembangunan selama ini terlalu terpusat di Pulau Jawa.
        ar_eg: صحيح جاكرتا فيها كل حاجة، بس عندها مشاكل كتير كمان - زحمة، وفيضانات، وحتّة من أرضها بتهبط كل سنة. وغير كده، التنمية طول السنين اللي فاتت كانت متركّزة في جزيرة جاوة.
        ar: مع أنّ جاكرتا فيها كلّ شيء، فإنّ لديها مشكلات كثيرة أيضًا - ازدحام وفيضانات، وجزء من أرضها يهبط كلّ عام. علاوة على ذلك، تركّزت التنمية حتى الآن في جزيرة جاوة.
        en: Although Jakarta has everything, it also has a lot of problems. Traffic, floods, and part of its land sinks every year. Besides that, development so far has been too concentrated on Java.
        note:
          ar_eg: meskipun وwalaupun يعني «مع إن / رغم إن» - بتعترف بحاجة وبعدين تردّ عليها. وselain itu (غير كده / كمان) بتضيف حجّة جديدة.
          ar: meskipun وwalaupun تعنيان «مع أنّ / رغم أنّ» - تقرّ بأمر ثم تردّ عليه. وselain itu (علاوة على ذلك) تضيف حجّة جديدة.
          en: meskipun and walaupun mean "although" - you concede a point, then answer it. selain itu (besides that) adds a new argument.
      - speaker: Narrator
        text: Sari menerjemahkan ke dalam bahasa Arab. Tamu itu mengangguk pelan, lalu menulis sesuatu di bukunya.
        ar_eg: ساري ترجمت للعربي. الضيف هزّ راسه بالراحة، وبعدين كتب حاجة في نوتته.
        ar: ترجمت ساري إلى العربية. أومأ الضيف برأسه ببطء، ثم كتب شيئًا في دفتره.
        en: Sari translates into Arabic. The guest nods slowly, then writes something in his notebook.
      - speaker: Pak Hendra
        text: Ini Titik Nol Nusantara. Pada tahun 2022, para gubernur dari 34 provinsi membawa tanah dan air dari daerah masing-masing, lalu menyatukannya di dalam sebuah kendi besar.
        ar_eg: دي نقطة الصفر في نوسانتارا. سنة ٢٠٢٢، المحافظين من ٣٤ محافظة جابوا تراب ومية من بلادهم، وحطّوهم مع بعض في قلّة كبيرة.
        ar: هذه نقطة الصفر في نوسانتارا. في عام ٢٠٢٢ حمل المحافظون من ٣٤ محافظة ترابًا وماءً من مناطقهم، ثم جمعوها في قُلّة كبيرة.
        en: This is Nusantara's Zero Point. In 2022, the governors of 34 provinces brought soil and water from their own regions, then united them in one big jar.
        note:
          ar_eg: الطقس ده اسمه Kendi Nusantara واتعمل في مارس ٢٠٢٢ - تراب ومية من كل إندونيسيا في قلّة واحدة، رمز للوحدة. وإندونيسيا عندها النهارده أكتر من ٣٤ محافظة، بعد ما اتعملت محافظات جديدة في پاپوا.
          ar: يُسمّى هذا الطقس Kendi Nusantara وأُقيم في مارس ٢٠٢٢ - تراب وماء من أنحاء إندونيسيا في قُلّة واحدة رمزًا للوحدة. ولإندونيسيا اليوم أكثر من ٣٤ محافظة بعد إنشاء محافظات جديدة في بابوا.
          en: The ceremony, called Kendi Nusantara, took place in March 2022 - soil and water from all over Indonesia in one jar, a symbol of unity. Indonesia now has more than 34 provinces, after new ones were created in Papua.
      - speaker: Sari
        text: Kendi lagi! Bapak saya baru saja menaruh kendi air di depan warungnya. Ternyata kendi bisa jadi lambang persatuan juga.
        ar_eg: قلّة تاني! بابا لسّه حاطط قلّة مية قدّام الوارونج بتاعه. طلع إن القلّة ممكن تبقى رمز للوحدة كمان.
        ar: قُلّة مرّة أخرى! وضع أبي للتوّ قُلّة ماء أمام الوارونغ. يبدو أنّ القُلّة قد تكون رمزًا للوحدة أيضًا.
        en: Another kendi! My dad's just put a water jug in front of his warung. Turns out a kendi can be a symbol of unity too.
      - speaker: Sari
        text: Pak, beliau bertanya lagi. Apakah kota baru ini akan menghabiskan hutan Kalimantan?
        ar_eg: يا پاك، حضرته بيسأل تاني. هل المدينة الجديدة دي هتخلّص على غابات كاليمانتان؟
        ar: يا باك، يسأل سيادته مرّة أخرى. هل ستقضي هذه المدينة الجديدة على غابات كاليمانتان؟
        en: Pak, he has another question. Will this new city wipe out Kalimantan's forests?
      - speaker: Pak Hendra
        text: Rencananya, IKN dibangun sebagai kota hutan, dan sebagian besar wilayahnya tetap hijau. Walaupun demikian, masih banyak orang yang ragu. Menurut saya, keraguan itu wajar.
        ar_eg: الخطّة إن العاصمة تتبني «مدينة غابة»، ومعظم مساحتها تفضل خضرا. ومع ذلك، لسّه فيه ناس كتير شاكّين. وفي رأيي، الشكّ ده طبيعي.
        ar: المخطّط أن تُبنى العاصمة «مدينةَ غابة»، وأن يبقى معظم مساحتها أخضر. ومع ذلك ما زال كثيرون متشكّكين، وفي رأيي هذا الشكّ مشروع.
        en: The plan is for IKN to be built as a forest city, with most of its area staying green. Even so, many people still have doubts. In my view, those doubts are fair.
      - speaker: Narrator
        text: Di depan mereka berdiri Istana Garuda. Ribuan bilah logam membentuk sayap burung garuda yang sedang terbang.
        ar_eg: قدّامهم واقف قصر جارودا. آلاف الشرايح المعدن عاملة جناحات نسر جارودا وهو طاير.
        ar: يقف أمامهم قصر غارودا، حيث تشكّل آلاف الشرائح المعدنية جناحَي طائر الغارودا وهو يطير.
        en: Before them stands the Garuda Palace. Thousands of metal blades form the wings of a garuda in flight.
        note:
          ar_eg: الجارودا طير أسطوري وهو شعار إندونيسيا الرسمي (Garuda Pancasila). وفي ١٧ أغسطس ٢٠٢٤ اتعمل احتفال عيد الاستقلال لأول مرّة في نوسانتارا.
          ar: الغارودا طائر أسطوري وهو شعار إندونيسيا الرسمي (Garuda Pancasila). وفي ١٧ أغسطس ٢٠٢٤ أُقيم احتفال عيد الاستقلال لأوّل مرّة في نوسانتارا.
          en: The garuda is a mythical bird and Indonesia's national emblem (Garuda Pancasila). On 17 August 2024, the Independence Day ceremony was held in Nusantara for the first time.
      - speaker: Sari
        text: Dengan demikian, saya sekarang bekerja dekat ibu kota negara... walaupun harus naik bus dua jam.
        ar_eg: وبكده، أنا بقيت بشتغل جنب عاصمة البلد... حتى لو لازم أركب أتوبيس ساعتين.
        ar: وبذلك صرتُ أعمل قرب عاصمة البلاد... وإن كان عليّ ركوب الحافلة ساعتين.
        en: So I now work near the nation's capital... even if it's a two-hour bus ride away.
  - setting:
      ar_eg: نفس الليلة. مكالمة ڤيديو جماعية - ساري في أوضتها في باليكپاپان، والعيلة في الوارونج في ماديون، ونادية من القاهرة.
      ar: الليلة نفسها. مكالمة فيديو جماعية - ساري في غرفتها في باليكبابان، والعائلة في الوارونغ في ماديون، ونادية من القاهرة.
      en: The same night. A group video call - Sari in her room in Balikpapan, the family at the warung in Madiun, and Nadia in Cairo.
    lines:
      - speaker: Bayu
        text: Mbak, aku sedang menulis esai argumentasi tentang IKN untuk sekolah. Jadi, menurut keluarga ini, memindahkan ibu kota itu baik atau tidak?
        ar_eg: يا أبلة، أنا بكتب مقال جدلي عن العاصمة الجديدة للمدرسة. فبصراحة، العيلة دي شايفة إن نقل العاصمة حاجة كويسة ولا لأ؟
        ar: يا أختي، أكتب مقالًا جدليًّا عن العاصمة الجديدة للمدرسة. فما رأي هذه العائلة، هل نقل العاصمة أمر جيّد أم لا؟
        en: Sis, I'm writing an argumentative essay about IKN for school. So, according to this family, is moving the capital a good thing or not?
      - speaker: Pak Budi
        text: Menurut Bapak, baik. Meskipun Bapak orang Jawa, Bapak setuju. Jawa sudah terlalu penuh, Le. Kalimantan juga berhak maju.
        ar_eg: في رأيي كويسة. مع إني جاوي، أنا موافق. جاوة اتملت خلاص يا ابني. وكاليمانتان من حقّها تتقدّم هي كمان.
        ar: في رأيي إنّه جيّد. مع أنّني جاويّ فأنا موافق. لقد امتلأت جاوة يا بنيّ، ومن حقّ كاليمانتان أن تتقدّم أيضًا.
        en: I think it's good. Although I'm Javanese, I agree. Java's too crowded already, son. Kalimantan has the right to move forward too.
      - speaker: Bu Rahayu
        text: Ibu juga setuju, walaupun Ibu kasihan pada pegawai di Jakarta yang harus pindah jauh dari keluarganya.
        ar_eg: وأنا كمان موافقة، مع إني صعبان عليّا الموظفين اللي في جاكرتا ولازم يتنقلوا بعيد عن عيلاتهم.
        ar: وأنا موافقة أيضًا، وإن كنتُ أشفق على الموظّفين في جاكرتا الذين سيُنقلون بعيدًا عن عائلاتهم.
        en: I agree too, although I feel sorry for the civil servants in Jakarta who have to move far from their families.
      - speaker: Bayu
        text: Tapi biayanya sangat besar, Bu. Selain itu, bagaimana dengan hutan dan masyarakat adat yang sudah tinggal di sana sejak dulu?
        ar_eg: بس التكلفة كبيرة أوي يا ماما. وغير كده، طب والغابات والسكّان الأصليين اللي عايشين هناك من زمان؟
        ar: لكنّ التكلفة باهظة جدًّا يا أمي. علاوة على ذلك، ماذا عن الغابات والمجتمعات الأصلية التي تعيش هناك منذ القدم؟
        en: But it costs a huge amount, Mum. Besides that, what about the forest and the indigenous communities who've lived there for generations?
        note:
          ar_eg: masyarakat adat هم الجماعات الأصلية اللي عايشة بأعرافها (adat من العربي «عادة»). حوالين نوسانتارا عايشين ناس من شعب پاسير وشعب باليك، وفيه نقاش كبير على حقوقهم في الأرض.
          ar: masyarakat adat هي الجماعات الأصلية التي تعيش وفق أعرافها (adat من العربية «عادة»). ويعيش حول نوسانتارا أبناء شعبَي باسير وباليك، ويدور نقاش واسع حول حقوقهم في الأرض.
          en: masyarakat adat are indigenous communities living by customary law (adat comes from Arabic عادة, "custom"). Paser and Balik people live around Nusantara, and their land rights are widely debated.
      - speaker: Sari
        text: Pertanyaan yang bagus, Le. Tadi tamu kami menanyakan hal yang sama. Yang Mbak lihat, pembangunannya besar sekali, tetapi masih banyak yang belum selesai, termasuk jawaban untuk pertanyaanmu.
        ar_eg: سؤال حلو يا بايو. الضيف بتاعنا النهارده سأل نفس السؤال. اللي أنا شفته إن البناء ضخم جدًا، بس لسّه حاجات كتير مخلصتش، ومنها إجابة سؤالك.
        ar: سؤال جيّد يا بنيّ. سأل ضيفنا اليوم السؤال نفسه. والذي رأيتُه أنّ البناء ضخم جدًّا، لكنّ أمورًا كثيرة لم تكتمل بعد، ومنها جواب سؤالك.
        en: Good question, little brother. Our guest asked the same thing today. What I saw is that the construction is enormous, but a lot isn't finished yet - including the answer to your question.
      - speaker: Mas Joko
        text: Kalau ibu kota pindah, apa pecel juga harus pindah?
        ar_eg: طب لو العاصمة اتنقلت، البيچيل كمان لازم يتنقل؟
        ar: إذا انتقلت العاصمة، فهل يجب أن ينتقل البيتشيل أيضًا؟
        en: If the capital moves, does pecel have to move too?
      - speaker: Pak Budi
        text: Pecel tidak ke mana-mana, Mas. Ibu kota boleh pindah, tetapi ibu kota pecel tetap Madiun!
        ar_eg: البيچيل مش رايح في حتّة يا ماس. العاصمة تتنقل براحتها، بس عاصمة البيچيل هتفضل ماديون!
        ar: البيتشيل لن يذهب إلى أيّ مكان يا ماس. قد تنتقل العاصمة، لكنّ عاصمة البيتشيل تبقى ماديون!
        en: Pecel isn't going anywhere, Mas. The capital can move, but the capital of pecel stays Madiun!
      - speaker: Nadia
        text: Di Mesir juga sama, Pak! Kami sedang membangun Ibu Kota Administratif Baru di sebelah timur Kairo. Kementerian-kementerian sudah mulai pindah ke sana.
        ar_eg: نفس الحكاية في مصر يا پاك! بنبني العاصمة الإدارية الجديدة شرق القاهرة. والوزارات بدأت تتنقل هناك خلاص.
        ar: الأمر نفسه في مصر يا باك! نحن نبني العاصمة الإدارية الجديدة شرقيّ القاهرة، وقد بدأت الوزارات بالانتقال إليها.
        en: Same in Egypt, Pak! We're building the New Administrative Capital east of Cairo. The ministries have already started moving there.
        note:
          ar_eg: العاصمة الإدارية الجديدة على بعد حوالي ٤٥ كيلو شرق القاهرة، والوزارات بدأت تنقل شغلها هناك من ٢٠٢٣. مصر وإندونيسيا الاتنين بيحاولوا يخفّفوا الزحمة عن عاصمة قديمة كبيرة.
          ar: تقع العاصمة الإدارية الجديدة على بعد نحو ٤٥ كيلومترًا شرق القاهرة، وبدأت الوزارات بنقل أعمالها إليها منذ ٢٠٢٣. فمصر وإندونيسيا كلتاهما تحاولان تخفيف الضغط عن عاصمة عريقة مزدحمة.
          en: Egypt's New Administrative Capital lies about 45 km east of Cairo, and ministries began moving there in 2023. Both Egypt and Indonesia are trying to take pressure off a big, old capital.
      - speaker: Bu Rahayu
        text: Wah, Mesir dan Indonesia sama-sama pindah rumah. Semoga tidak ada yang lupa membawa kunci.
        ar_eg: يا سلام، مصر وإندونيسيا الاتنين بيعزّلوا. ربنا يستر وماحدّش ينسى المفاتيح.
        ar: يا للطرافة، مصر وإندونيسيا تنتقلان معًا إلى بيت جديد. نرجو ألّا ينسى أحد المفاتيح.
        en: Well, Egypt and Indonesia are both moving house. Let's hope nobody forgets the keys.
      - speaker: Bayu
        text: Oke, ini kesimpulanku. Meskipun biayanya besar, pemindahan ibu kota dapat memeratakan pembangunan, asalkan hutan dan hak masyarakat adat dihormati. Dengan demikian, setiap pulau punya kesempatan yang sama.
        ar_eg: تمام، دي خلاصتي. رغم إن التكلفة كبيرة، نقل العاصمة ممكن يوزّع التنمية بالعدل، بشرط إن الغابات وحقوق السكّان الأصليين تتحترم. وبكده، كل جزيرة يبقى عندها نفس الفرصة.
        ar: حسنًا، هذه خلاصتي. مع أنّ التكلفة كبيرة، فإنّ نقل العاصمة قد يوزّع التنمية بعدل، شريطة احترام الغابات وحقوق المجتمعات الأصلية. وبذلك تحظى كلّ جزيرة بالفرصة نفسها.
        en: Okay, here's my conclusion. Although the cost is high, moving the capital can spread development more evenly, provided the forest and the rights of indigenous communities are respected. That way, every island gets the same chance.
        note:
          ar_eg: dengan demikian (وبكده / وبالتالي) بتقفل بيها حجّتك في المقال. وasalkan يعني «بشرط إن».
          ar: dengan demikian (وبذلك / وبالتالي) تُختم بها الحجّة في المقال. وasalkan تعني «شريطة أن».
          en: dengan demikian (thus, in this way) wraps up an argument in an essay. asalkan means "provided that".
      - speaker: Pak Budi
        text: Wah, Le. Kamu sudah bicara seperti menteri.
        ar_eg: يا سلام يا ابني. إنت بقيت بتتكلّم زي الوزير.
        ar: يا سلام يا بنيّ. صرتَ تتكلّم كالوزير.
        en: Well, son. You already sound like a minister.
      - speaker: Bayu
        text: Bukan menteri, Pak. Koki yang menulis!
        ar_eg: مش وزير يا بابا. طبّاخ بيكتب!
        ar: لستُ وزيرًا يا أبي. طاهٍ يكتب!
        en: Not a minister, Dad. A chef who writes!
