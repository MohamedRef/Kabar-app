  ar: يواجه باك بودي أكبر خصم في حياته - هاتف يتكلّم. يدخل الوارونغ عصر الدفع برمز QR. وفي القاهرة تضبط نادية كريمًا يكلّم نفسه بالجاوية في منتصف الليل.
  en: Pak Budi faces the greatest enemy of his life - a talking phone. The warung enters the age of QR payments. And in Cairo, Nadia catches Karim talking to himself in Javanese in the middle of the night.
