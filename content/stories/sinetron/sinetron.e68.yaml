title:
  target: Proyek K
  ar_eg: مشروع ك
  ar: مشروع ك
  en: Project K
summary:
  ar_eg: پاك بودي سهران على كشكول «مشروع ك» - ك يعني القاهرة! حسابات الوارونج، والغلا، وتلات حصّالات، ومفاجأة لماس جوكو. وفي اجتماع العيلة على الفيديو، بايو بيشرح دور المشاريع الصغيرة في اقتصاد إندونيسيا، وكريم بيحكي عن «الجمعية» المصرية... وبو راهايو بتلاقي لها اسم إندونيسي.
  ar: يسهر باك بودي على دفتر «مشروع ك» - و«ك» تعني القاهرة! حسابات الوارونغ، والتضخّم، وثلاث حصّالات، ومفاجأة لماس جوكو. وفي اجتماع العائلة المرئي يشرح بايو دور المشاريع الصغيرة في اقتصاد إندونيسيا، ويحكي كريم عن «الجمعية» المصرية... فتجد لها بو راهايو اسمًا إندونيسيًّا.
  en: Pak Budi has been up all night over his "Project K" notebook - K for Kairo! Warung accounts, inflation, three piggy banks and a surprise for Mas Joko. At the family video meeting, Bayu explains small businesses' place in Indonesia's economy, and Karim describes the Egyptian gam'iyya... which Bu Rahayu recognises at once.
cast: [Bu Rahayu, Pak Budi, Mas Joko, Bayu, Sari, Karim]
scenes:
  - setting:
      ar_eg: ماديون، قبل الفجر. الوارونج مقفول بس النور منوّر. پاك بودي موطّي على كشكول مسطّر، ومعاه آلة حاسبة وتلات حصّالات خشب. ماس جوكو لسه واصل عشان يحضّر الأكل.
      ar: ماديون، قبيل الفجر. الوارونغ مغلق لكنّ ضوءه مشتعل. ينحني باك بودي على دفتر مسطّر ومعه آلة حاسبة وثلاث حصّالات خشبية. وقد وصل ماس جوكو للتوّ ليُعدّ الطعام.
      en: Madiun, before dawn. The warung is closed but the light is on. Pak Budi is hunched over a lined notebook with a calculator and three wooden piggy banks. Mas Joko has just arrived to start the cooking.
    lines:
      - speaker: Narrator
        text: Menjelang subuh, lampu warung masih menyala. Pak Budi membungkuk di atas buku tulis bergaris yang sampulnya bertuliskan "PROYEK K".
        ar_eg: قبل الفجر، نور الوارونج لسه منوّر. پاك بودي موطّي على كشكول مسطّر مكتوب على غلافه «مشروع ك».
        ar: قُبيل الفجر، ما زال ضوء الوارونغ مشتعلًا. ينحني باك بودي على دفتر مسطّر كُتب على غلافه «مشروع ك».
        en: Just before dawn, the warung light is still on. Pak Budi is bent over a lined exercise book with "PROJECT K" written on the cover.
      - speaker: Bu Rahayu
        text: Pak! Bapak tidak tidur semalaman? Ingat tekanan darah! Lagi pula, "Proyek K" itu apa? Kerupuk?
        ar_eg: يا بودي! انت منمتش طول الليل؟ افتكر الضغط! وبعدين «مشروع ك» ده إيه؟ كروبوك؟
        ar: يا باك! ألم تنم طوال الليل؟ تذكّر ضغط الدم! ثمّ ما «مشروع ك» هذا؟ كروبوك؟
        en: Pak! Haven't you slept all night? Remember your blood pressure! And what is this "Project K"? Krupuk?
      - speaker: Pak Budi
        text: Kairo, Bu. Tabungan umrah kita sudah aman di bank. Tinggal satu janji lagi, Lebaran di Kairo. Janji itu masih utang. Belum lunas.
        ar_eg: القاهرة يا رهايو. فلوس العمرة في أمان في البنك خلاص. فاضل وعد واحد - العيد في القاهرة. الوعد ده لسه دَين عليّا. لسه متسدّدش.
        ar: القاهرة. مدّخرات العمرة في أمان في المصرف، وبقي وعد واحد - العيد في القاهرة. وهذا الوعد ما زال دَينًا عليّ، لم يُسدَّد بعد.
        en: Kairo, dear. Our umrah savings are safe in the bank. There's just one promise left - Lebaran in Cairo. That promise is still a debt. It isn't paid off yet.
        note:
          ar_eg: lunas يعني «اتسدّد بالكامل» - بتتقال على الديون والأقساط. وپاك بودي بيعامل وعده من الحلقة ٢٠ كأنه دَين، زي ما بنقول «وعد الحرّ دَين عليه».
          ar: lunas تعني «سُدّد بالكامل»، وتقال للديون والأقساط. ويعامل باك بودي وعده في الحلقة العشرين كأنّه دَين، كقولنا «وعد الحرّ دَين عليه».
          en: lunas means "paid in full" - for debts and instalments. Pak Budi treats his promise from episode 20 like a debt, much as Arabic says "a free man's promise is a debt upon him".
      - speaker: Mas Joko
        text: Jadi itu sebabnya Bapak minta laporan QRIS setiap minggu!
        ar_eg: أهو عشان كده بقى حضرتك بتطلب تقرير الـ QRIS كل أسبوع!
        ar: إذن لهذا تطلب تقرير QRIS كلّ أسبوع!
        en: So that's why you've been asking for the QRIS report every week!
      - speaker: Pak Budi
        text: Betul. Dulu Bapak menghitung dengan perasaan, sekarang dengan data. Omzet bulan ini naik lima belas persen. Akan tetapi, harga cabai dan beras juga naik. Oleh karena itu, labanya hanya naik sedikit.
        ar_eg: مظبوط. زمان كنت بحسب بالإحساس، دلوقتي بالأرقام. المبيعات الشهر ده زادت خمستاشر في المية. بس، أسعار الشطّة والرز غليت برضه. وعشان كده، المكسب زاد حاجة بسيطة بس.
        ar: صحيح. كنتُ أحسب بالإحساس، والآن بالبيانات. ارتفع حجم المبيعات هذا الشهر خمسة عشر في المئة. غير أنّ أسعار الفلفل الحارّ والأرز ارتفعت أيضًا. ولذلك لم يرتفع الربح إلّا قليلًا.
        en: That's right. I used to count by feel; now I count with data. Turnover is up fifteen percent this month. However, the price of chillies and rice has gone up too. Therefore, profit has only risen a little.
        note:
          ar_eg: أدوات الربط بين الجمل (konjungsi antarkalimat) بتيجي في أول الجملة الجديدة - Akan tetapi (لكن)، Oleh karena itu (عشان كده)، Selain itu (غير كده)، Dengan demikian (وبكده)، Meskipun demikian (ومع ذلك). وomzet من الهولندي ومعناها «إجمالي المبيعات»، وlaba «المكسب».
          ar: أدوات الربط بين الجمل (konjungsi antarkalimat) تأتي في أوّل الجملة الجديدة - Akan tetapi (غير أنّ)، وOleh karena itu (لذلك)، وSelain itu (فضلًا عن ذلك)، وDengan demikian (وبذلك)، وMeskipun demikian (ومع ذلك). وomzet من الهولندية بمعنى «حجم المبيعات»، وlaba «الربح».
          en: 'Between-sentence connectors (konjungsi antarkalimat) open the new sentence: Akan tetapi (however), Oleh karena itu (therefore), Selain itu (besides), Dengan demikian (thus), Meskipun demikian (even so). omzet (turnover) is from Dutch; laba is profit.'
      - speaker: Bu Rahayu
        text: Itu namanya inflasi, Pak. Uangnya sama, tapi belanjaannya makin sedikit.
        ar_eg: ده اسمه تضخّم يا بودي. الفلوس هي هي، بس اللي بتجيبه بيها بيقلّ.
        ar: هذا يُسمّى التضخّم. المال هو نفسه، لكنّ ما يشتريه يقلّ.
        en: That's called inflation, Pak. Same money, smaller shopping bag.
      - speaker: Pak Budi
        text: Maka dari itu, Bapak membuat tiga celengan. Satu untuk modal warung, satu untuk THR Mas Joko, dan satu untuk tiket.
        ar_eg: وعشان كده عملت تلات حصّالات. واحدة لرأس مال الوارونج، وواحدة لعيدية ماس جوكو، وواحدة للتذاكر.
        ar: ولذلك صنعتُ ثلاث حصّالات. واحدة لرأس مال الوارونغ، وأخرى لمنحة العيد لماس جوكو، وثالثة للتذاكر.
        en: That's why I've made three piggy banks. One for the warung's capital, one for Mas Joko's THR, and one for the tickets.
        note:
          ar_eg: THR (Tunjangan Hari Raya) مكافأة العيد - في إندونيسيا صاحب الشغل ملزم يدّيها للموظفين قبل العيد، غالبًا مرتّب شهر. زي «منحة العيد» عندنا بس إجبارية.
          ar: THR (Tunjangan Hari Raya) منحة العيد - يُلزَم صاحب العمل في إندونيسيا بدفعها لموظّفيه قبل العيد، وتعادل غالبًا راتب شهر.
          en: THR (Tunjangan Hari Raya) is the holiday bonus - Indonesian employers must pay it before Lebaran, usually a month's wages.
      - speaker: Mas Joko
        text: THR saya juga masuk rencana? Pak... saya terharu.
        ar_eg: عيديتي أنا كمان داخلة في الخطّة؟ يا پاك... أنا اتأثّرت.
        ar: منحتي أيضًا ضمن الخطّة؟ يا باك... لقد تأثّرت.
        en: My THR's in the plan too? Pak... I'm touched.
      - speaker: Pak Budi
        text: Tentu. Selain itu, warung tutup seminggu waktu Lebaran. Kamu juga harus mudik dengan uang di saku, bukan hanya dengan cerita.
        ar_eg: طبعًا. وغير كده، الوارونج هيقفل أسبوع في العيد. وانت كمان لازم تسافر بلدك والفلوس في جيبك، مش بالحكايات بس.
        ar: بالطبع. فضلًا عن ذلك، سيُغلق الوارونغ أسبوعًا في العيد، وعليك أن تعود إلى قريتك وفي جيبك مال، لا حكايات فقط.
        en: Of course. Besides, the warung closes for a week at Lebaran. You should go home to your village with money in your pocket, not just stories.
      - speaker: Bu Rahayu
        text: Pak, celengan Ibu yang dulu itu... boleh Ibu ikut menabung lagi?
        ar_eg: يا بودي، الحصّالة بتاعتي اللي زمان دي... ينفع أشارك وأحوّش تاني؟
        ar: يا باك، حصّالتي القديمة تلك... أيمكنني أن أشارك في الادّخار مرّة أخرى؟
        en: Pak, my old piggy bank... may I chip in and save again?
      - speaker: Pak Budi
        text: Tidak, Bu. Dulu Ibu menabung diam-diam untuk Bapak. Sekarang giliran Bapak. Meskipun demikian... kalau Ibu mau menyumbang kerupuk untuk bekal di pesawat, Bapak terima.
        ar_eg: لأ يا رهايو. زمان انتي حوّشتي في السرّ عشاني. دلوقتي دوري أنا. ومع ذلك... لو عايزة تساهمي بكروبوك للطيارة، أنا قابل.
        ar: لا. في الماضي ادّخرتِ سرًّا من أجلي، والآن جاء دوري. ومع ذلك... إن أردتِ التبرّع بكروبوك زادًا للطائرة، فأنا أقبل.
        en: No, dear. Back then you saved in secret for me. Now it's my turn. Even so... if you'd like to contribute krupuk as a snack for the plane, I accept.
      - speaker: Mas Joko
        text: Dengan demikian, Proyek K resmi dimulai!
        ar_eg: وبكده، مشروع ك بدأ رسمي!
        ar: وبذلك يبدأ مشروع ك رسميًّا!
        en: And thus, Project K is officially under way!
  - setting:
      ar_eg: يوم الحد، اجتماع العيلة على الفيديو. پاك بودي ماسك كشكول «مشروع ك» كأنه التقرير السنوي لشركة. بايو من سورونج، وساري وكريم من بيتهم.
      ar: يوم الأحد، اجتماع عائلي مرئي. يمسك باك بودي دفتر «مشروع ك» كأنّه تقرير سنوي لشركة. بايو من سورونغ، وساري وكريم من بيتهما.
      en: Sunday, a family meeting on video. Pak Budi holds the "Project K" notebook like a company's annual report. Bayu joins from Sorong, Sari and Karim from home.
    lines:
      - speaker: Bayu
        text: Pak, warung Bapak itu bagian dari sesuatu yang besar. Indonesia punya lebih dari enam puluh juta UMKM, dan sebagian besar pekerja di negeri ini bekerja di usaha kecil seperti warung kita.
        ar_eg: يا بابا، الوارونج بتاعك حتّة من حاجة كبيرة. إندونيسيا فيها أكتر من ستين مليون مشروع صغير ومتوسط، وأغلب الشغّيلة في البلد بيشتغلوا في مشاريع صغيرة زي الوارونج بتاعنا.
        ar: يا أبي، الوارونغ جزء من شيء كبير. في إندونيسيا أكثر من ستّين مليون منشأة صغيرة ومتوسّطة، ومعظم العاملين في البلاد يعملون في مشاريع صغيرة كالوارونغ.
        en: Dad, your warung is part of something big. Indonesia has more than sixty million MSMEs, and most of the country's workers work in small businesses like ours.
        note:
          ar_eg: UMKM = Usaha Mikro, Kecil, dan Menengah (المشروعات متناهية الصغر والصغيرة والمتوسطة). بتشغّل الغالبية العظمى من العمّال في إندونيسيا، وإندونيسيا أكبر اقتصاد في جنوب شرق آسيا.
          ar: UMKM = Usaha Mikro, Kecil, dan Menengah (المنشآت متناهية الصغر والصغيرة والمتوسّطة)، وتوظّف الغالبية العظمى من العاملين في إندونيسيا، أكبر اقتصاد في جنوب شرق آسيا.
          en: UMKM = micro, small and medium enterprises. They employ the vast majority of Indonesia's workers, in what is Southeast Asia's largest economy.
      - speaker: Pak Budi
        text: Jadi Bapak ini... tulang punggung ekonomi nasional?
        ar_eg: يعني أنا كده... العمود الفقري للاقتصاد القومي؟
        ar: إذن أنا... العمود الفقري للاقتصاد الوطني؟
        en: So I'm... the backbone of the national economy?
      - speaker: Sari
        text: Salah satu dari enam puluh juta tulang punggung, Pak. Jangan sombong dulu.
        ar_eg: واحد من ستين مليون عمود فقري يا بابا. متتغرّش أوي كده.
        ar: واحد من ستّين مليون عمود فقري يا أبي. لا تغترّ بعد.
        en: One of sixty million backbones, Dad. Don't get big-headed just yet.
      - speaker: Karim
        text: Di Mesir juga begitu. Ada gerobak ful di setiap sudut jalan dan toko kecil di bawah setiap gedung. Kalau mereka berhenti satu hari saja, Kairo kelaparan.
        ar_eg: في مصر نفس الكلام. فيه عربية فول على كل ناصية، ودكّان صغيّر تحت كل عمارة. لو وقفوا يوم واحد بس، القاهرة تجوع.
        ar: والأمر نفسه في مصر. عربة فول في كلّ ناصية، ودكّان صغير تحت كلّ عمارة. لو توقّفت يومًا واحدًا لجاعت القاهرة.
        en: It's the same in Egypt. A ful cart on every corner and a little shop under every building. If they stopped for a single day, Cairo would go hungry.
      - speaker: Pak Budi
        text: Mas Karim, Bapak mau tanya. Orang Mesir biasanya menabung bagaimana?
        ar_eg: يا ماس كريم، عايز أسألك. المصريين عادةً بيحوّشوا إزاي؟
        ar: يا ماس كريم، أريد أن أسألك. كيف يدّخر المصريون عادةً؟
        en: Mas Karim, let me ask you. How do Egyptians usually save?
      - speaker: Karim
        text: Banyak yang ikut gam'iyya, Pak. Misalnya sepuluh orang menyetor uang setiap bulan, lalu setiap bulan satu orang menerima semuanya, bergiliran.
        ar_eg: ناس كتير بتدخل جمعية يا بابا. مثلًا عشرة أنفار كل واحد بيدفع فلوس كل شهر، وكل شهر واحد بياخد القبض كله، بالدور.
        ar: كثيرون يشاركون في «الجمعية» يا أبي. مثلًا يدفع عشرة أشخاص مبلغًا كلّ شهر، ويقبض أحدهم المجموع كلّ شهر بالتناوب.
        en: Lots of people join a gam'iyya, Dad. Say ten people each pay in every month, and every month one of them gets the whole pot, taking turns.
      - speaker: Bu Rahayu
        text: Lho, itu arisan! Di gang kita juga ada arisan ibu-ibu, setiap Kamis.
        ar_eg: إيه ده، دي «أريسان»! في حارتنا كمان فيه أريسان للستات، كل خميس.
        ar: هذه «أريسان»! في زقاقنا أيضًا أريسان للسيّدات كلّ خميس.
        en: Why, that's arisan! Our lane has a ladies' arisan too, every Thursday.
        note:
          ar_eg: arisan هي نفس «الجمعية» المصرية بالظبط - ناس بتدفع كل فترة وواحد بياخد المبلغ بالدور، بالقرعة غالبًا. وفي إندونيسيا كمان مناسبة اجتماعية، فيها أكل ورغي.
          ar: arisan هي «الجمعية» المصرية تمامًا - يدفع المشاركون دوريًّا ويقبض أحدهم المبلغ بالتناوب، بالقرعة غالبًا. وهي في إندونيسيا مناسبة اجتماعية أيضًا، فيها طعام وأحاديث.
          en: Arisan is exactly the Egyptian gam'iyya - members pay in regularly and take turns collecting the pot, usually by lottery. In Indonesia it's a social occasion too, with food and chat.
      - speaker: Bayu
        text: Tapi untuk tiket, Pak, lebih aman di bank. Uang di celengan tidak bertambah, dan kalau inflasi naik, nilainya justru turun.
        ar_eg: بس للتذاكر يا بابا، البنك أأمن. الفلوس في الحصّالة مبتزيدش، ولو التضخّم زاد، قيمتها بتقلّ.
        ar: لكن للتذاكر يا أبي، البنك أكثر أمانًا. المال في الحصّالة لا ينمو، وإذا ارتفع التضخّم انخفضت قيمته.
        en: But for the tickets, Dad, a bank is safer. Money in a piggy bank doesn't grow, and if inflation rises, it actually loses value.
      - speaker: Pak Budi
        text: Bapak setuju ke bank, Le. Tapi bank syariah, seperti tabungan umrah kita. Bapak lebih tenang dengan sistem bagi hasil.
        ar_eg: موافق على البنك يا ابني. بس بنك إسلامي، زي فلوس العمرة. أنا مرتاح أكتر لنظام المشاركة في الأرباح.
        ar: أوافق على البنك يا بنيّ، لكن مصرفًا إسلاميًّا، كمدّخرات العمرة. أنا أكثر اطمئنانًا لنظام تقاسم الأرباح.
        en: I agree on the bank, son. But a sharia bank, like our umrah savings. I'm more at ease with profit-sharing.
        note:
          ar_eg: bank syariah (من «شريعة») بنك إسلامي بيدّي bagi hasil (نصيب من الأرباح) بدل الفايدة. البنوك الإسلامية منتشرة جدًا في إندونيسيا، أكبر بلد مسلم في العالم.
          ar: bank syariah (من «شريعة») مصرف إسلامي يعطي bagi hasil (حصّة من الأرباح) بدل الفائدة. والمصارف الإسلامية واسعة الانتشار في إندونيسيا، أكبر بلد مسلم في العالم.
          en: A bank syariah (from Arabic شريعة) is an Islamic bank that pays bagi hasil (a profit share) instead of interest. Islamic banking is widespread in Indonesia, the world's largest Muslim-majority country.
      - speaker: Sari
        text: Jadi rencananya begini. Celengan untuk uang receh, bank syariah untuk tiket, dan arisan untuk... gosip.
        ar_eg: يعني الخطّة كده - الحصّالة للفكّة، والبنك الإسلامي للتذاكر، والأريسان عشان... الرغي.
        ar: إذن الخطّة كالآتي - الحصّالة للفكّة، والمصرف الإسلامي للتذاكر، والأريسان من أجل... النميمة.
        en: 'So here''s the plan: the piggy bank for loose change, the sharia bank for the tickets, and the arisan for... gossip.'
      - speaker: Bu Rahayu
        text: Arisan itu untuk silaturahmi, Nduk!
        ar_eg: الأريسان ده عشان صلة الرحم يا بنتي!
        ar: الأريسان لصلة الرحم يا ابنتي!
        en: Arisan is for keeping ties, sweetheart!
      - speaker: Pak Budi
        text: Baik. Dengan demikian, rapat ditutup. Targetnya Lebaran, tempatnya Kairo, dan semua ikut.
        ar_eg: تمام. وبكده، الاجتماع انتهى. الهدف العيد، المكان القاهرة، والكل جاي.
        ar: حسنًا. وبذلك يُختتم الاجتماع. الهدف العيد، والمكان القاهرة، والجميع ذاهبون.
        en: Right. And thus the meeting is closed. The target is Lebaran, the place is Cairo, and everyone's coming.
