      ar: كم شخصًا في الجمعية في مثال كريم؟
      en: In Karim's example, how many people are in the gam'iyya?
    options: ["sepuluh orang", "satu orang", "enam puluh orang"]
    answer: 0
    meaning:
      ar_eg: مثلًا عشرة أنفار كل واحد بيدفع فلوس كل شهر، وكل شهر واحد بياخد القبض كله، بالدور.
      ar: مثلًا يدفع عشرة أشخاص مبلغًا كلّ شهر، ويقبض أحدهم المجموع كلّ شهر بالتناوب.
      en: Say ten people each pay in every month, and every month one of them gets the whole pot, taking turns.
