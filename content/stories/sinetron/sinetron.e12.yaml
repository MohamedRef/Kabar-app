title:
  target: Penjual Takjil
  ar_eg: بيّاع التَّعجيل
  ar: بائع التَّعجيل
  en: The Takjil Seller
summary:
  ar_eg: بايو فتح ترابيزة صغيرة قدّام الوارونج يبيع فيها أكل الفطار، وكريم بيحكي شغلته. وفي القاهرة ساري بتشتغل مرشدة سياحية... وبو راهايو قلقانة إن پاك بودي بيشتغل زيادة عن اللزوم.
  ar: يفتح بايو طاولة صغيرة أمام الوارونغ يبيع عليها طعام الإفطار، ويحكي كريم عن عمله. وفي القاهرة تعمل ساري مرشدة سياحية... وبو راهايو قلقة لأن باك بودي يعمل أكثر من اللازم.
  en: Bayu sets up a little table outside the warung selling iftar snacks, and Karim talks about his job. In Cairo, Sari works as a tour guide... and Bu Rahayu worries that Pak Budi works far too hard.
cast: [Bayu, Mas Joko, Karim, Pak Budi, Sari, Bu Rahayu]
scenes:
  - setting:
      ar_eg: ماديون، الساعة ٥ العصر، ساعة قبل المغرب. قدّام الوارونج ترابيزة صغيرة عليها أكل للفطار.
      ar: ماديون، الساعة الخامسة عصرًا، قبل المغرب بساعة. أمام الوارونغ طاولة صغيرة عليها طعام للإفطار.
      en: Madiun, 5 p.m., an hour before sunset. Outside the warung stands a little table of iftar snacks.
    lines:
      - speaker: Narrator
        text: Madiun. Jam lima sore. Di depan warung ada meja kecil.
        ar_eg: ماديون. الساعة ٥ العصر. قدّام الوارونج فيه ترابيزة صغيرة.
        ar: ماديون. الساعة الخامسة عصرًا. أمام الوارونغ طاولة صغيرة.
        en: Madiun. Five in the afternoon. There's a little table in front of the warung.
      - speaker: Mas Joko
        text: Bayu! Kamu lagi apa?
        ar_eg: بايو! بتعمل إيه؟
        ar: بايو! ماذا تفعل؟
        en: Bayu! What are you up to?
        note:
          ar_eg: lagi = sedang (بيعمل دلوقتي) في الكلام اليومي.
          ar: lagi = sedang (يفعل الآن) في الكلام اليومي.
          en: lagi = sedang (doing right now) in everyday speech.
      - speaker: Bayu
        text: Saya penjual takjil, Mas! Ada kolak dan kurma.
        ar_eg: أنا بيّاع تعجيل يا ماس! فيه كولاك وتمر.
        ar: أنا بائع تعجيل يا ماس! عندي كولاك وتمر.
        en: I'm a takjil seller, Mas! There's kolak and dates.
        note:
          ar_eg: takjil جاية من العربي «تعجيل» (تعجيل الفطر). هي الحاجات الحلوة الخفيفة اللي بيفطروا عليها في إندونيسيا، زي الكولاك (موز ورز مطبوخين في لبن جوز الهند بسكر النخل). قبل المغرب الشوارع بتتملي ترابيزات takjil.
          ar: كلمة takjil من العربية «تعجيل» (تعجيل الفطر)، وهي الأطعمة الحلوة الخفيفة التي يُفطَر عليها في إندونيسيا، مثل الكولاك (موز مطبوخ في حليب جوز الهند بسكّر النخيل). قبل المغرب تمتلئ الشوارع بطاولات التعجيل.
          en: takjil comes from Arabic تعجيل (hastening to break the fast). It's the light sweet food Indonesians break their fast with, like kolak (banana in coconut milk with palm sugar). Before sunset the streets fill with takjil stalls.
      - speaker: Mas Joko
        text: Kenapa kamu jual takjil?
        ar_eg: وبتبيع تعجيل ليه؟
        ar: لماذا تبيع التعجيل؟
        en: Why are you selling takjil?
        note:
          ar_eg: kenapa = mengapa (ليه)، وjual = menjual (يبيع). في الكلام الفعل بييجي من غير me‑.
          ar: kenapa = mengapa (لماذا)، وjual = menjual (يبيع)؛ في الكلام يُحذف me‑.
          en: kenapa = mengapa (why), jual = menjual (to sell). Speech often drops me-.
      - speaker: Bayu
        text: Karena saya perlu uang. Sst, ini rahasia!
        ar_eg: عشان محتاج فلوس. هِشّ، ده سرّ!
        ar: لأنني أحتاج إلى المال. صه، هذا سرّ!
        en: Because I need money. Shh, it's a secret!
        note:
          ar_eg: Mengapa (أو kenapa وهي أخفّ في الكلام) يعني «ليه»، والرد بيبدأ بـ karena يعني «عشان».
          ar: Mengapa (أو kenapa، وهي أخفّ في الكلام) تعني «لماذا»، ويبدأ الجواب بـ karena أي «لأنّ».
          en: Mengapa (or the chattier kenapa) means "why"; answer with karena, "because".
      - speaker: Karim
        text: Asalamualaikum! Bayu, saya mau kolak dua.
        ar_eg: السلام عليكم! يا بايو، عايز اتنين كولاك.
        ar: السلام عليكم! يا بايو، أريد اثنين من الكولاك.
        en: Assalamu alaikum! Bayu, two kolak, please.
      - speaker: Bayu
        text: Waalaikumsalam, Mas Karim! Dua kolak, sepuluh ribu.
        ar_eg: وعليكم السلام يا ماس كريم! اتنين كولاك بعشرة آلاف.
        ar: وعليكم السلام يا ماس كريم! اثنان من الكولاك بعشرة آلاف.
        en: Wa alaikum salam, Mas Karim! Two kolak, ten thousand.
      - speaker: Pak Budi
        text: Mas Karim, hari ini nggak kerja?
        ar_eg: يا ماس كريم، مش بتشتغل النهارده؟
        ar: يا ماس كريم، ألا تعمل اليوم؟
        en: Mas Karim, not working today?
        note:
          ar_eg: nggak = tidak (مش)، وkerja = bekerja (يشتغل) — كلام كل يوم.
          ar: nggak = tidak (لا)، وkerja = bekerja (يعمل) في الكلام اليومي.
          en: nggak = tidak (not), kerja = bekerja (to work) — everyday speech.
      - speaker: Karim
        text: Hari ini Sabtu, Pak. Saya penerjemah bahasa Arab. Kantor saya di Surabaya.
        ar_eg: النهارده السبت يا پاك. أنا مترجم عربي. مكتبي في سورابايا.
        ar: اليوم السبت يا باك. أنا مترجم للغة العربية، ومكتبي في سورابايا.
        en: It's Saturday, Pak. I'm an Arabic translator. My office is in Surabaya.
        note:
          ar_eg: البادئة peN- بتعمل «اللي بيعمل الحاجة»، زي «فاعل» بالعربي - penjual (بيّاع) من jual، وpenerjemah (مترجم) من terjemah، ودي أصلها «ترجمة» العربية.
          ar: البادئة peN- تصوغ اسم الفاعل، مثل وزن «فاعل»، فـ penjual (بائع) من jual، وpenerjemah (مترجم) من terjemah، وأصلها العربي «ترجمة».
          en: The prefix peN- makes "the one who does it", like Arabic فاعل — penjual (seller) from jual, penerjemah (translator) from terjemah, itself from Arabic ترجمة.
  - setting:
      ar_eg: نفس الليلة، بعد الفطار. ساري في القاهرة بتكلّم مامتها فيديو. في القاهرة لسه الضهر.
      ar: الليلة نفسها، بعد الإفطار في ماديون. ساري في القاهرة تتّصل بأمّها اتصالًا مرئيًّا، والوقت ظهر في القاهرة.
      en: That evening, after iftar in Madiun. Sari video-calls her mum from Cairo, where it's still midday.
    lines:
      - speaker: Bu Rahayu
        text: Nduk, kok kamu kelihatan capek? Sibuk, ya?
        ar_eg: يا بنتي، شكلك تعبانة. انتي مشغولة؟
        ar: يا ابنتي، تبدين متعبة. هل أنتِ مشغولة؟
        en: Sweetheart, you look tired. Are you busy?
        note:
          ar_eg: kok = «إزاي كده؟ / ليه كده؟» لما حاجة تستغربها.
          ar: kok = «كيف ذلك؟» تعبيرًا عن الاستغراب.
          en: kok = "how come?", for something surprising.
      - speaker: Sari
        text: Iya, Bu. Sekarang aku pemandu wisata untuk turis Indonesia di Kairo. Setiap Sabtu.
        ar_eg: آه يا ماما. أنا دلوقتي مرشدة سياحية للسيّاح الإندونيسيين في القاهرة. كل سبت.
        ar: نعم يا أمي. أعمل الآن مرشدة سياحية للسيّاح الإندونيسيين في القاهرة، كل سبت.
        en: Yes, Mum. I'm a tour guide for Indonesian tourists in Cairo now. Every Saturday.
        note:
          ar_eg: iya = ya (أيوه)، وaku = saya مع الأهل.
          ar: iya = ya (نعم)، وaku = saya مع الأهل.
          en: iya = ya (yes); aku = saya with family.
      - speaker: Bu Rahayu
        text: Kenapa kamu kerja? Kamu harus belajar!
        ar_eg: وبتشتغلي ليه؟ انتي لازم تذاكري!
        ar: لماذا تعملين؟ يجب أن تدرسي!
        en: Why are you working? You need to study!
      - speaker: Sari
        text: Karena tiket ke Madiun mahal, Bu. Aku mau pulang.
        ar_eg: عشان تذكرة ماديون غالية يا ماما. أنا عايزة أرجع البيت.
        ar: لأن تذكرة ماديون غالية يا أمي. أريد أن أعود إلى البيت.
        en: Because a ticket to Madiun is expensive, Mum. I want to come home.
      - speaker: Bu Rahayu
        text: Nduk... Bapak juga kerja terlalu keras. Bapak puasa, tapi kerja sampai malam.
        ar_eg: يا بنتي... وأبوكي كمان بيشتغل جامد زيادة عن اللزوم. صايم، وبرضه بيشتغل لحد بالليل.
        ar: يا ابنتي... وأبوكِ أيضًا يعمل بجهد أكثر من اللازم. هو صائم، ومع ذلك يعمل حتى الليل.
        en: Sweetheart... your dad works far too hard too. He's fasting, but he works till night.
      - speaker: Sari
        text: Pak? Bapak capek?
        ar_eg: بابا؟ انت تعبان؟
        ar: أبي؟ هل أنت متعب؟
        en: Dad? Are you tired?
      - speaker: Pak Budi
        text: Nggak, Nduk! Pedagang harus rajin!
        ar_eg: لأ يا بنتي! التاجر لازم يبقى شغّيل!
        ar: لا يا ابنتي! على التاجر أن يكون مجتهدًا!
        en: No, sweetheart! A trader has to work hard!
      - speaker: Narrator
        text: Tapi sesudah buka puasa, Pak Budi tidur di kursi.
        ar_eg: بس بعد الفطار، پاك بودي نام على الكرسي.
        ar: لكن بعد الإفطار، نام باك بودي على الكرسي.
        en: But after iftar, Pak Budi falls asleep in his chair.
