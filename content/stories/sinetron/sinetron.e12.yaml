questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: بايو بيبيع إيه؟
      ar: ماذا يبيع بايو؟
      en: What is Bayu selling?
    options: ["pecel dan kopi", "koshari", "kolak dan kurma", "fanous"]
    answer: 2
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: كريم شغلته إيه؟
      ar: ما عمل كريم؟
      en: What is Karim's job?
    options: ["penerjemah", "pemandu wisata", "pedagang"]
    answer: 0
  - id: q03
    type: fill_blank
    sentence: Kenapa kamu kerja? ___ tiket ke Madiun mahal.
    meaning:
      ar_eg: بتشتغلي ليه؟ عشان تذكرة ماديون غالية.
      ar: لماذا تعملين؟ لأن تذكرة ماديون غالية.
      en: Why are you working? Because a ticket to Madiun is expensive.
    answers: [Karena]
    options: ["Kenapa", "Karena", "Tapi"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: ساري بتشتغل إيه في القاهرة؟
      ar: ما عمل ساري في القاهرة؟
      en: What does Sari do for work in Cairo?
    options: ["penjual takjil", "penerjemah", "guru", "pemandu wisata"]
    answer: 3
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا مترجم.
      ar: أنا مترجم.
      en: I'm a translator.
    answers: ["Saya penerjemah.", "Saya penerjemah", "Aku penerjemah.", "Aku penerjemah", "Saya seorang penerjemah.", "Pekerjaan saya penerjemah."]
next:
  ar_eg: الأحد الساعة ٥، كريم في محطة القطر عشان يرجع سورابايا... والمغرب قرّب، والإذاعة بتقول خبر وحش.
  ar: يوم الأحد في الخامسة، كريم في محطة القطار ليعود إلى سورابايا... والمغرب يقترب، والإذاعة تعلن خبرًا سيّئًا.
  en: Sunday at five, Karim is at the station to head back to Surabaya... sunset is near, and the loudspeaker has bad news.
