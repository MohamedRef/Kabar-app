title:
  target: Kairo ing Wikipedia
  ar_eg: القاهرة على ويكيبيديا
  ar: القاهرة في ويكيبيديا
  en: Cairo on Wikipedia
summary:
  ar_eg: كريم بيرجع ماديون ويقابل مباك أيو، طالبة الأدب الجاوي اللي هتراجع كتابه. أول امتحان - مقالة ويكيبيديا بالجاوي عن القاهرة. كريم بيكتشف إن الجاوي المكتوب ليه كلماته - iku، yaiku، kang، minangka - وإن مدينته باينة غريبة وحلوة بلغة تانية.
  ar: يعود كريم إلى ماديون ويلتقي بمباك أيو، طالبة الأدب الجاوي التي ستراجع كتابه. الامتحان الأوّل - مقالة ويكيبيديا بالجاوية عن القاهرة. يكتشف كريم أنّ للجاوية المكتوبة كلماتها - iku وyaiku وkang وminangka - وأنّ مدينته تبدو غريبة وجميلة بلغة أخرى.
  en: Karim is back in Madiun and meets Mbak Ayu, the Javanese literature student who will review his book. First test - a Javanese Wikipedia article about Cairo. Karim discovers written Javanese has its own little words - iku, yaiku, kang, minangka - and that his own city looks strange and lovely in another language.
cast: [Karim, Mbak Ayu]
scenes:
  - setting:
      ar_eg: قهوة قصاد محطة ماديون، على شارع پاهلاوان. قطورات إينكا الجديدة بتعدّي. مباك أيو قاعدة ومعاها لابتوب وكومة كتب.
      ar: مقهى قبالة محطّة ماديون، في شارع باهلاوان. تمرّ قطارات إينكا الجديدة. تجلس مباك أيو ومعها حاسوب وكومة كتب.
      en: A café across from Madiun station, on Jalan Pahlawan. New INKA trains roll past. Mbak Ayu sits with a laptop and a pile of books.
    lines:
      - speaker: Mbak Ayu
        text: Mas Karim, ya? Aku Ayu. Pak Harsono wis crita akeh babagan sampeyan.
        ar_eg: ماس كريم، صح؟ أنا أيو. پاك هارسونو حكالي عنك كتير.
        ar: ماس كريم، أليس كذلك؟ أنا أيو. حكى لي باك هارسونو عنك الكثير.
        en: Mas Karim, right? I'm Ayu. Pak Harsono has told me a lot about you.
      - speaker: Karim
        text: Mbak Ayu, matur nuwun. Iki bukuku. Isih akeh salahe.
        ar_eg: يا مباك أيو، متشكّر. ده كتابي. لسه فيه غلطات كتير.
        ar: يا مباك أيو، شكرًا. هذا كتابي. ما زالت فيه أخطاء كثيرة.
        en: Mbak Ayu, thank you. Here's my book. It still has lots of mistakes.
      - speaker: Mbak Ayu
        text: Ra papa. Nanging sadurunge, ayo maca bareng. Iki Wikipedia basa Jawa, babagan Kairo.
        ar_eg: مافيش مشكلة. بس الأول، يلّا نقرا مع بعض. دي ويكيبيديا بالجاوي، عن القاهرة.
        ar: لا بأس. لكن قبل ذلك، هيّا نقرأ معًا. هذه ويكيبيديا بالجاوية، عن القاهرة.
        en: No problem. But first, let's read together. This is the Javanese Wikipedia, about Cairo.
        note:
          ar_eg: ويكيبيديا الجاوي مكتوبة أغلبها نجوكو بأسلوب رسمي، ومجانية - فهي تمرين حقيقي ببلاش.
          ar: ويكيبيديا الجاوية مكتوبة غالبًا بالنغوكو بأسلوب رسميّ، وهي مجانية - فهي تمرين حقيقيّ بلا كلفة.
          en: Javanese Wikipedia is written mostly in formal-style ngoko, and it's free - real reading practice at no cost.
      - speaker: Karim
        text: "Kairo iku kutha kang dadi ibukutha Mesir."
        ar_eg: «القاهرة هي المدينة اللي هي عاصمة مصر».
        ar: «القاهرة هي المدينة التي هي عاصمة مصر».
        en: '"Cairo is the city that is the capital of Egypt."'
        note:
          ar_eg: iku في الكتابة بتقوم بدور «هي / هو» زي «is». وkang (أو sing في الكلام) = «اللي / الذي».
          ar: تؤدّي iku في الكتابة دور «هو / هي» مثل is. وkang (أو sing في الكلام) = «الذي».
          en: In writing, iku works like "is". kang (sing in speech) = "which, that".
      - speaker: Karim
        text: "Kutha iki dumunung ing pinggir Kali Nil, lan kalebu salah siji kutha paling gedhe ing Afrika."
        ar_eg: «المدينة دي واقعة على ضفّة النيل، وهي من أكبر المدن في أفريقيا».
        ar: «تقع هذه المدينة على ضفّة نهر النيل، وهي من أكبر المدن في أفريقيا».
        en: '"The city lies on the bank of the Nile, and is one of the largest cities in Africa."'
        note:
          ar_eg: ing = في (كتابة، بدل neng). وdumunung = يقع. وkalebu = من ضمن / يُعتبر.
          ar: ing = في (للكتابة، بدل neng). وdumunung = يقع. وkalebu = من ضمن / يُعدّ.
          en: ing = in, at (written, instead of neng). dumunung = is located. kalebu = belongs to, counts among.
      - speaker: Mbak Ayu
        text: Apik! Terus ukara iki.
        ar_eg: حلو! كمّل الجملة دي.
        ar: جيّد! تابع هذه الجملة.
        en: Good! Now this sentence.
      - speaker: Karim
        text: "Masjid Al-Azhar, yaiku salah siji universitas paling tuwa ing donya, uga ana ing Kairo."
        ar_eg: «جامع الأزهر، وهو من أقدم الجامعات في الدنيا، موجود كمان في القاهرة».
        ar: «والجامع الأزهر، وهو من أقدم الجامعات في العالم، يقع أيضًا في القاهرة».
        en: '"Al-Azhar Mosque, that is, one of the oldest universities in the world, is also in Cairo."'
        note:
          ar_eg: yaiku = «يعني / وهو»، بتشرح الكلمة اللي قبلها، زي «أي» في الفصحى.
          ar: yaiku = «أي / وهو»، تشرح ما قبلها.
          en: yaiku = "that is, namely", explaining what came before.
  - setting:
      ar_eg: بعد ساعة. القهوة بردت. كريم ساكت وبيبصّ على صورة النيل على الشاشة.
      ar: بعد ساعة. بردت القهوة. كريم صامت ينظر إلى صورة النيل على الشاشة.
      en: An hour later. The coffee's gone cold. Karim is quiet, looking at a picture of the Nile on the screen.
    lines:
      - speaker: Mbak Ayu
        text: Mas, kok meneng?
        ar_eg: يا ماس، ساكت ليه؟
        ar: يا ماس، لماذا أنت صامت؟
        en: Mas, why so quiet?
      - speaker: Karim
        text: Aneh, Mbak. Kairo kuthaku. Nanging nganggo basa Jawa, kaya kutha anyar.
        ar_eg: غريبة يا مباك. القاهرة مدينتي. بس بالجاوي، كأنها مدينة جديدة.
        ar: غريب يا مباك. القاهرة مدينتي. لكنها بالجاوية تبدو مدينة جديدة.
        en: It's strange, Mbak. Cairo is my city. But in Javanese, it's like a new city.
      - speaker: Mbak Ayu
        text: Iku tandha sampeyan wis tenan sinau basa. Basa anyar, mripat anyar.
        ar_eg: دي علامة إنك اتعلّمت اللغة بجدّ. لغة جديدة، عين جديدة.
        ar: هذه علامة أنّك تعلّمت اللغة فعلًا. لغة جديدة، عين جديدة.
        en: That's the sign you've really learned the language. New language, new eyes.
      - speaker: Karim
        text: Tak tulis neng bukuku. "Kairo, minangka kuthaku, saiki uga kutha Jawa."
        ar_eg: هكتبها في كتابي. «القاهرة، بصفتها مدينتي، بقت كمان مدينة جاوي».
        ar: سأكتبها في كتابي. «القاهرة، بوصفها مدينتي، صارت أيضًا مدينة جاوية».
        en: I'll write it in my book. "Cairo, as my city, is now a Javanese city too."
        note:
          ar_eg: minangka = «بصفته / كـ»، كلمة كتابة رسمية.
          ar: minangka = «بوصفه / كـ»، كلمة كتابة رسمية.
          en: minangka = "as, in the role of", a formal written word.
new_words:
  - word: iku
    pos: particle
    ar_eg: هو / هي (في الكتابة، زي is)
    ar: هو / هي (في الكتابة، مثل is)
    en: is (written), that
  - word: kang
    pos: pronoun
    ar_eg: اللي / الذي (كتابة)
    ar: الذي (كتابة)
    en: which, who (written)
  - word: yaiku
    pos: conjunction
    ar_eg: يعني / وهو
    ar: أي / وهو
    en: namely, that is
  - word: ing
    pos: preposition
    ar_eg: في (كتابة)
    ar: في (كتابة)
    en: in, at (written)
  - word: minangka
    pos: conjunction
    ar_eg: بصفته / كـ
    ar: بوصفه / كـ
    en: as, in the role of
  - word: dumunung
    pos: verb
    ar_eg: يقع (مكان)
    ar: يقع (مكان)
    en: is located
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب المقالة، القاهرة واقعة فين؟
      ar: بحسب المقالة، أين تقع القاهرة؟
      en: According to the article, where is Cairo?
    options: ["ing pinggir Kali Nil", "ing pinggir segara", "ing gunung"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Kairo iku kutha ___ dadi ibukutha Mesir.
    meaning:
      ar_eg: القاهرة هي المدينة اللي هي عاصمة مصر.
      ar: القاهرة هي المدينة التي هي عاصمة مصر.
      en: Cairo is the city that is the capital of Egypt.
    answers: [kang]
    options: ["kang", "yaiku", "ing"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: «yaiku» معناها إيه؟
      ar: ما معنى «yaiku»؟
      en: What does "yaiku" mean?
    options: ["namely, that is", "but", "because"]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Basa anyar, mripat anyar.
    answers_meaning:
      ar_eg: ["لغة جديدة، عين جديدة.", "لغة جديدة بعيون جديدة."]
      ar: ["لغة جديدة، عين جديدة."]
      en: ["New language, new eyes.", "A new language gives new eyes."]
next:
  ar_eg: مباك أيو بتاخد كريم معرض قطورات قديمة في محطة ماديون. وهناك، خبر قصيّر بالجاوي بيفاجئ كريم... عشان هو بطل الخبر.
  ar: تأخذ مباك أيو كريمًا إلى معرض قطارات قديمة في محطّة ماديون. وهناك يفاجئ كريمًا خبر قصير بالجاوية... لأنّه بطل الخبر.
  en: Mbak Ayu takes Karim to an old-train exhibition at Madiun station. There, a short Javanese news item surprises Karim... because he's in it.
review:
  status: draft
  verified: false
  notes: The "Wikipedia" sentences are written for the story in Wikipedia style, not quoted. Cairo as "one of the largest cities in Africa" is safe; Al-Azhar "one of the oldest universities" is the usual hedge. Check written-style ngoko. Moved from Kota Lama, Semarang to Madiun station (Jogja + Madiun only, 2026-10-27).
