schema: kabar.story/v1
id: sinetron.e80
series: sinetron
episode: 80
language: jv
level: j2
unlock_after: j2.u03
title:
  target: Selikur, selawe, seket
  ar_eg: واحد وعشرين، خمسة وعشرين، خمسين
  ar: واحد وعشرون، خمسة وعشرون، خمسون
  en: Twenty-one, twenty-five, fifty
summary:
  ar_eg: كريم بيروح مع بو راهايو سوق نجانجوك، بلد البصل الأحمر. البيّاعة بو كارتي بتقول أسعار بأرقام جاوي مالهاش علاقة بالحساب - selikur، selawe، seket. وبو راهايو بتوريه إزاي الفصال المؤدّب بيكسب.
  ar: يذهب كريم مع بو راهايو إلى سوق نغانجوك، بلد البصل الأحمر. وتذكر البائعة بو كارتي أسعارًا بأرقام جاوية لا تشبه الحساب - selikur وselawe وseket. وتريه بو راهايو كيف تنجح المساومة المهذّبة.
  en: Karim goes with Bu Rahayu to the market in Nganjuk, shallot country. The seller, Bu Karti, quotes prices in Javanese numbers that don't follow the pattern - selikur, selawe, seket. And Bu Rahayu shows him how polite haggling wins.
cast: [Karim, Bu Rahayu, Bu Karti]
scenes:
  - setting:
      ar_eg: سوق نجانجوك، الصبح بدري. أكوام بصل أحمر صغيّر في كل حتّة، والهوا شديد. بو كارتي قاعدة ورا شوالات بصل.
      ar: سوق نغانجوك، في الصباح الباكر. أكوام من البصل الأحمر الصغير في كلّ مكان، والريح شديدة. تجلس بو كارتي خلف أكياس البصل.
      en: Nganjuk market, early morning. Heaps of small red shallots everywhere, and a strong wind. Bu Karti sits behind sacks of shallots.
    lines:
      - speaker: Bu Rahayu
        text: Bu Karti, brambange pira sekilo?
        ar_eg: يا بو كارتي، البصل بكام الكيلو؟
        ar: يا بو كارتي، بكم كيلو البصل؟
        en: Bu Karti, how much a kilo for the shallots?
        note:
          ar_eg: brambang = البصل الأحمر الصغيّر (بالإندونيسي bawang merah). نجانجوك مشهورة بيه في جاوة كلّها، وكمان اسمها «مدينة الهوا».
          ar: brambang = البصل الأحمر الصغير (بالإندونيسية bawang merah). وتشتهر به نغانجوك في جاوة كلّها، وتسمّى أيضًا «مدينة الريح».
          en: brambang = shallots (Indonesian bawang merah). Nganjuk is famous for them across Java; it's also called "the city of wind".
      - speaker: Bu Karti
        text: Selawe ewu, Bu.
        ar_eg: خمسة وعشرين ألف يا مدام.
        ar: خمسة وعشرون ألفًا يا سيدتي.
        en: Twenty-five thousand, ma'am.
      - speaker: Karim
        text: Selawe? Bu, selawe iku pira?
        ar_eg: «سيلاوي»؟ يا بو راهايو، يعني كام «سيلاوي» دي؟
        ar: «سيلاوي»؟ يا بو راهايو، كم تعني «سيلاوي»؟
        en: Selawe? Bu, how much is selawe?
      - speaker: Bu Rahayu
        text: Selawe iku rong puluh lima. Selikur rong puluh siji. Seket iku limang puluh.
        ar_eg: «سيلاوي» يعني خمسة وعشرين. و«سيليكور» واحد وعشرين. و«سيكيت» يعني خمسين.
        ar: «سيلاوي» تعني خمسة وعشرين. و«سيليكور» واحد وعشرون. و«سيكيت» تعني خمسين.
        en: Selawe is twenty-five. Selikur is twenty-one. Seket is fifty.
        note:
          ar_eg: "الجاوي عنده أرقام خاصّة - sewelas (11)، rolas (12)، selikur (21) لحد sanga likur (29)، selawe (25)، seket (50)، sewidak (60). الباقي منتظم - telung puluh (30)، patang puluh (40). كلمات: rong = اتنين (قبل وحدة)؛ limang = خمسة (قبل الوحدة)."
          ar: "للجاوية أرقام خاصّة - sewelas (11)، rolas (12)، selikur (21) حتى sanga likur (29)، selawe (25)، seket (50)، sewidak (60). والباقي منتظم - telung puluh (30)، patang puluh (40). مفردات: rong = اثنان (قبل المعدود)؛ limang = خمسة."
          en: "Javanese has special numbers - sewelas (11), rolas (12), selikur (21) up to sanga likur (29), selawe (25), seket (50), sewidak (60). The rest are regular - telung puluh (30), patang puluh (40). Words: rong = two (before a unit); limang = five (before a unit)."
      - speaker: Karim
        text: Kok aneh! Kaya "khamsa w ʿishrīn" dadi siji tembung.
        ar_eg: غريبة! كأن «خمسة وعشرين» بقت كلمة واحدة.
        ar: غريب! كأنّ «خمسة وعشرين» صارت كلمة واحدة.
        en: How odd! Like "khamsa w ishrin" turned into one word.
        note:
          ar_eg: "كلمات: kaya = زي، كأنّ."
          ar: "مفردات: kaya = مثل."
          en: "Words: kaya = like, as = seperti."
      - speaker: Bu Rahayu
        text: Bu Karti, aku tuku telung kilo. Seket ewu, oleh?
        ar_eg: يا بو كارتي، هاخد تلاتة كيلو. بخمسين ألف، ينفع؟
        ar: يا بو كارتي، سآخذ ثلاثة كيلوغرامات. بخمسين ألفًا، هل يجوز؟
        en: Bu Karti, I'll take three kilos. Fifty thousand, all right?
      - speaker: Bu Karti
        text: Waduh, Bu. Sewidak ewu wis. Brambange apik-apik iki.
        ar_eg: يا ساتر يا مدام. ستّين ألف وخلاص. البصل ده حلو أوي.
        ar: يا إلهي يا سيدتي. ستّون ألفًا وانتهينا. هذا البصل ممتاز.
        en: Oh dear, ma'am. Sixty thousand, then. These are lovely shallots.
      - speaker: Bu Rahayu
        text: Seket lima, nggih? Aku langganan saben sasi lho.
        ar_eg: خمسة وخمسين، ماشي؟ أنا زبونة دايمة كل شهر على فكرة.
        ar: خمسة وخمسون، حسنًا؟ أنا زبونة دائمة كلّ شهر بالمناسبة.
        en: Fifty-five, all right? I'm a regular every month, you know.
        note:
          ar_eg: "كلمات: nggih = أيوه، ماشي (كراما)؛ saben = كل (يوم، صبح …)؛ sasi = شهر."
          ar: "مفردات: nggih = نعم، حسنًا (كراما)؛ saben = كلّ (يوم، صباح …)؛ sasi = شهر."
          en: "Words: nggih = yes, all right (krama); saben = every (setiap); sasi = month."
      - speaker: Bu Karti
        text: Nggih, nggih. Seket lima. Kanggo langganan.
        ar_eg: ماشي، ماشي. خمسة وخمسين. عشان زبونة دايمة.
        ar: حسنًا، حسنًا. خمسة وخمسون. من أجل الزبونة الدائمة.
        en: All right, all right. Fifty-five. For a regular.
        note:
          ar_eg: "كلمات: kanggo = لـ، عشان (نغوكو)."
          ar: "مفردات: kanggo = لِـ، من أجل (نغوكو)."
          en: "Words: kanggo = for (ngoko) = untuk."
  - setting:
      ar_eg: في الطريق للأتوبيس. كريم شايل شوال البصل، وبيقرا الفاتورة اللي بو كارتي كتبتها بإيدها.
      ar: في الطريق إلى الحافلة. يحمل كريم كيس البصل، ويقرأ الفاتورة التي كتبتها بو كارتي بخطّ يدها.
      en: On the way to the bus. Karim carries the bag of shallots and reads the receipt Bu Karti wrote by hand.
    lines:
      - speaker: Karim
        text: Brambang telung kilo, seket lima ewu. Bu, kowe pinter nawar!
        ar_eg: بصل تلاتة كيلو، خمسة وخمسين ألف. يا بو راهايو، انتي شاطرة في الفصال!
        ar: بصل ثلاثة كيلوغرامات، خمسة وخمسون ألفًا. يا بو راهايو، أنتِ ماهرة في المساومة!
        en: Shallots, three kilos, fifty-five thousand. Bu, you're great at haggling!
        note:
          ar_eg: "كلمات: nawar = يفاصل (من tawar)."
          ar: "مفردات: nawar = يساوم (من tawar)."
          en: "Words: nawar = bargain, haggle (from tawar) = menawar."
      - speaker: Bu Rahayu
        text: Kuncine alon-alon lan esem, Karim. Ora tau nesu.
        ar_eg: السرّ إنك تمشي براحة وتبتسم يا كريم. وعمرك ما تتعصّب.
        ar: السرّ أن تتمهّل وتبتسم يا كريم. ولا تغضب أبدًا.
        en: The secret is to go slowly and smile, Karim. Never get angry.
        note:
          ar_eg: "الفصال في جاوة لعبة هادية - بابتسامة، وبكلمة «نجيه» (nggih)، ومن غير صوت عالي. والكلام الحادّ بيبوّظ السعر. كلمات: alon-alon = على مهلك، بالراحة؛ nesu = زعلان ومتعصّب."
          ar: "المساومة في جاوة لعبة هادئة - بابتسامة وبكلمة nggih ومن دون صوت مرتفع. والكلام الحادّ يفسد السعر. مفردات: alon-alon = ببطء، على مهل؛ nesu = غاضب."
          en: "Haggling in Java is a quiet game - a smile, a \"nggih\", no raised voices. Sharp words spoil the price. Words: alon-alon = slowly, carefully (= pelan-pelan); nesu = angry, cross."
      - speaker: Karim
        text: Neng Mesir, wong nawar karo bengok-bengok!
        ar_eg: في مصر، الناس بتفاصل بالزعيق!
        ar: في مصر يساوم الناس بالصراخ!
        en: In Egypt, people haggle by shouting!
        note:
          ar_eg: "كلمات: bengok-bengok = يزعّق، يصرّخ."
          ar: "مفردات: bengok-bengok = يصرخ."
          en: "Words: bengok-bengok = shouting, yelling."
      - speaker: Bu Rahayu
        text: Hahaha! Neng kene, sing bengok-bengok mung bakul es.
        ar_eg: ههههه! هنا، اللي بيزعّق بس هو بتاع الآيس كريم.
        ar: ههههه! هنا لا يصرخ إلّا بائع المثلّجات.
        en: Hahaha! Here, the only one who shouts is the ice-cream seller.
