questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: «selawe» كام؟
      ar: كم تساوي «selawe»؟
      en: What number is "selawe"?
    options: ["21", "25", "50", "60"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Brambang telung kilo, ___ lima ewu.
    meaning:
      ar_eg: بصل تلاتة كيلو، خمسة وخمسين ألف.
      ar: بصل ثلاثة كيلوغرامات، خمسة وخمسون ألفًا.
      en: Shallots, three kilos, fifty-five thousand.
    answers: [seket]
    options: ["seket", "sewidak", "selawe"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: بو راهايو دفعت كام في الآخر؟
      ar: كم دفعت بو راهايو في النهاية؟
      en: How much did Bu Rahayu pay in the end?
    options: ["seket ewu", "seket lima ewu", "sewidak ewu"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Kuncine alon-alon lan esem.
    answers_meaning:
      ar_eg: ["السرّ إنك تمشي براحة وتبتسم.", "المفتاح الهدوء والابتسامة."]
      ar: ["السرّ هو التمهّل والابتسامة.", "المفتاح التمهّل والابتسام."]
      en: ["The secret is to go slowly and smile.", "The key is patience and a smile."]
next:
  ar_eg: جوكو عايز ياخد كريم بونوروجو يتفرّج على ريوج، الرقصة بالقناع العملاق. بس ميعاد العرض مكتوب بأيام كريم عمره ما سمع عنها - Pon؟ Wage؟ Kliwon؟
  ar: يريد جوكو أن يأخذ كريمًا إلى بونوروغو لمشاهدة ريوغ، الرقصة ذات القناع العملاق. لكنّ موعد العرض مكتوب بأيّام لم يسمع بها كريم قطّ - Pon؟ Wage؟ Kliwon؟
  en: Joko wants to take Karim to Ponorogo to watch Reog, the dance with the giant mask. But the show's date is written in days Karim has never heard of - Pon? Wage? Kliwon?
review:
  status: draft
  verified: false
  notes: Bu Karti is the seller from the j2.u03 receipt lesson. Shallot prices swing a lot by season; 25,000/kg is illustrative. Nganjuk's shallots and "Kota Angin" nickname are well known.
