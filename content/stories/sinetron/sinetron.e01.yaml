id: sinetron.e01
series: sinetron
episode: 1
language: id
level: bipa1
unlock_after: bipa1.u01
title:
  target: Selamat Pagi, Kairo!
  ar_eg: صباح الخير يا القاهرة!
  ar: صباح الخير يا القاهرة!
  en: Good Morning, Cairo!
summary:
  ar_eg: پاك بودي في الوارونج بتاعه في ماديون بيكلّم بنته ساري فيديو في القاهرة. عنده الضهر وعندها الصبح، فالتحيات بتلخبط الكل.
  ar: يتّصل باك بودي من دكّانه الصغير في ماديون بابنته ساري في القاهرة اتصالًا مرئيًا. الوقت عنده ظهر وعندها صباح، فتختلط التحيات.
  en: Pak Budi calls his daughter Sari in Cairo from his little warung in Madiun. It's midday for him and morning for her, so the greetings get mixed up.
cast: [Pak Budi, Sari, Bu Rahayu, Mas Joko]
scenes:
  - setting:
      ar_eg: ماديون في جاوة الشرقية، الضهر، في الوارونج (مطعم صغير شعبي) بتاع پاك بودي. وفي نفس اللحظة في القاهرة، الصبح بدري.
      ar: ماديون في جاوة الشرقية، وقت الظهر، في الوارونغ (مطعم شعبي صغير) الذي يملكه باك بودي. وفي اللحظة نفسها في القاهرة، الصباح الباكر.
      en: Madiun, East Java, at midday, in Pak Budi's warung (a small family eatery). At the same moment in Cairo, it's early morning.
    lines:
      - speaker: Narrator
        text: Madiun, Indonesia. Siang.
        ar_eg: ماديون، إندونيسيا. الضهر.
        ar: ماديون، إندونيسيا. الظهيرة.
        en: Madiun, Indonesia. Midday.
      - speaker: Narrator
        text: Kairo, Mesir. Pagi.
        ar_eg: القاهرة، مصر. الصبح.
        ar: القاهرة، مصر. الصباح.
        en: Cairo, Egypt. Morning.
        note:
          ar_eg: ماديون قدّام القاهرة بحوالي ٤–٥ ساعات (حسب التوقيت الصيفي في مصر). فلما يبقى الضهر في ماديون، بيبقى لسه الصبح في القاهرة.
          ar: تسبق ماديونُ القاهرةَ بنحو أربع إلى خمس ساعات بحسب التوقيت الصيفي في مصر، فإذا كان الظهر في ماديون كان الصباح في القاهرة.
          en: Madiun is about 4–5 hours ahead of Cairo (depending on Egypt's summer time), so midday in Madiun is still morning in Cairo.
      - speaker: Sari
        text: Asalamualaikum, Pak!
        ar_eg: السلام عليكم يا بابا!
        ar: السلام عليكم يا أبي!
        en: Assalamu alaikum, Dad!
        note:
          ar_eg: Pak (من Bapak) معناها «يا أستاذ»، بس الولاد في جاوة بيقولوها لأبوهم كمان، زي «يا بابا».
          ar: كلمة Pak (من Bapak) تعني «يا سيدي»، لكن الأبناء في جاوة يخاطبون بها آباءهم أيضًا، بمعنى «يا أبي».
          en: Pak (from Bapak) means "sir", but children in Java also use it for their own father, like "Dad".
      - speaker: Pak Budi
        text: Waalaikumsalam, Nduk! Selamat siang!
        ar_eg: وعليكم السلام يا بنتي! نهارك سعيد!
        ar: وعليكم السلام يا ابنتي! طاب نهارك!
        en: Wa alaikum salam, sweetheart! Good afternoon!
        note:
          ar_eg: Nduk كلمة جاوية (مش إندونيسي)، الأهل بيقولوها لبنتهم بحنية، زي «يا بنتي» أو «يا حبيبتي».
          ar: Nduk كلمة جاوية لا إندونيسية، يقولها الأهل لابنتهم تحبّبًا، بمعنى «يا ابنتي».
          en: Nduk is Javanese, not Indonesian — parents call a daughter this, tenderly, like "my girl".
      - speaker: Sari
        text: Selamat pagi, Pak! Di Kairo pagi.
        ar_eg: صباح الخير يا بابا! في القاهرة لسه الصبح.
        ar: صباح الخير يا أبي! الوقت صباح في القاهرة.
        en: Good morning, Dad! It's morning in Cairo.
      - speaker: Pak Budi
        text: Ya, ya! Selamat pagi, Sari! Apa kabar?
        ar_eg: آه صح! صباح الخير يا ساري! عاملة إيه؟
        ar: نعم، صحيح! صباح الخير يا ساري! كيف حالك؟
        en: Oh yes, right! Good morning, Sari! How are you?
      - speaker: Sari
        text: Kabar baik, Pak. Terima kasih. Bapak sehat?
        ar_eg: كويسة يا بابا، شكرًا. وانت بصحتك؟
        ar: بخير يا أبي، شكرًا. هل أنت بصحة جيدة؟
        en: I'm fine, Dad, thanks. Are you well?
        note:
          ar_eg: الإندونيسيين بيقولوا لبعض «Bapak» بدل «انت» عشان الاحترام، حتى لو بيكلموا أبوهم.
          ar: يستعمل الإندونيسيون «Bapak» بدل ضمير المخاطَب احترامًا، حتى مع آبائهم.
          en: Indonesians often say "Bapak" instead of "you" out of respect, even to their own father.
      - speaker: Pak Budi
        text: Sehat, sehat. Saya baik-baik saja.
        ar_eg: الحمد لله بصحتي. أنا كويس خالص.
        ar: بصحة جيدة. أنا بخير تمامًا.
        en: Healthy, healthy. I'm doing just fine.
      - speaker: Bu Rahayu
        text: Sari! Hai, Sari! Apa kabar?
        ar_eg: ساري! هاي يا ساري! عاملة إيه؟
        ar: ساري! مرحبًا يا ساري! كيف حالك؟
        en: Sari! Hi, Sari! How are you?
      - speaker: Sari
        text: Hai, Bu! Saya baik. Ibu sehat?
        ar_eg: هاي يا ماما! أنا كويسة. وانتي بصحتك؟
        ar: مرحبًا يا أمي! أنا بخير. هل أنتِ بصحة جيدة؟
        en: Hi, Mum! I'm fine. Are you well?
      - speaker: Bu Rahayu
        text: Sehat, Nduk. Kami baik-baik saja.
        ar_eg: بصحتي يا بنتي. إحنا كلنا كويسين.
        ar: بصحة جيدة يا ابنتي. نحن جميعًا بخير.
        en: I'm well, sweetheart. We're all fine.
  - setting:
      ar_eg: زبون بيدخل الوارونج، اسمه ماس جوكو، واحد من الزباين الدايمين.
      ar: يدخل زبون إلى الوارونغ، وهو ماس جوكو، أحد الزبائن الدائمين.
      en: A customer walks into the warung — Mas Joko, one of the regulars.
    lines:
      - speaker: Mas Joko
        text: Permisi! Selamat siang, Pak Budi!
        ar_eg: لو سمحت! نهارك سعيد يا پاك بودي!
        ar: عن إذنك! طاب نهارك يا باك بودي!
        en: Excuse me! Good afternoon, Pak Budi!
      - speaker: Pak Budi
        text: Selamat siang, Mas Joko! Ini Sari.
        ar_eg: نهارك سعيد يا ماس جوكو! دي ساري.
        ar: طاب نهارك يا ماس جوكو! هذه ساري.
        en: Good afternoon, Mas Joko! This is Sari.
        note:
          ar_eg: Mas بيتقال لراجل شاب، زي «يا أخ» أو «يا أستاذ». هتتعلمها كويس في الوحدة الجاية. وini يعني «ده/دي».
          ar: تُقال Mas للرجل الشاب، مثل «يا أخي». ستتعلّمها جيدًا في الوحدة القادمة. وini تعني «هذا/هذه».
          en: Mas is how you address a young man, like "bro" or "mate" — you'll meet it properly next unit. ini means "this".
      - speaker: Mas Joko
        text: Hai, Sari! Selamat siang!
        ar_eg: هاي يا ساري! نهارك سعيد!
        ar: مرحبًا يا ساري! طاب نهارك!
        en: Hi, Sari! Good afternoon!
      - speaker: Sari
        text: Selamat pagi, Mas Joko! Di Kairo pagi.
        ar_eg: صباح الخير يا ماس جوكو! في القاهرة لسه الصبح.
        ar: صباح الخير يا ماس جوكو! الوقت صباح في القاهرة.
        en: Good morning, Mas Joko! It's morning in Cairo.
      - speaker: Mas Joko
        text: Ya, ya! Selamat pagi, Sari!
        ar_eg: آه صح! صباح الخير يا ساري!
        ar: نعم، صحيح! صباح الخير يا ساري!
        en: Oh, right! Good morning, Sari!
      - speaker: Pak Budi
        text: Maaf, Nduk. Sampai jumpa besok, ya!
        ar_eg: معلش يا بنتي (عندي زباين). نتكلم بكرة، ماشي؟
        ar: آسف يا ابنتي (لديّ زبائن). إلى اللقاء غدًا، اتفقنا؟
        en: Sorry, sweetheart (customers!). See you tomorrow, okay?
      - speaker: Sari
        text: Ya, Pak. Sampai jumpa besok, Pak, Bu!
        ar_eg: ماشي يا بابا. أشوفكم بكرة يا بابا ويا ماما!
        ar: حسنًا يا أبي. إلى اللقاء غدًا يا أبي ويا أمي!
        en: Okay, Dad. See you tomorrow, Dad, Mum!
      - speaker: Bu Rahayu
        text: Sampai jumpa, Nduk! Salam!
        ar_eg: مع السلامة يا بنتي! سلام!
        ar: إلى اللقاء يا ابنتي! سلام!
        en: Bye, sweetheart! Take care!
      - speaker: Narrator
        text: Kairo. Pagi. Tok, tok, tok!
        ar_eg: القاهرة. الصبح. طُق، طُق، طُق!
        ar: القاهرة. الصباح. طَق، طَق، طَق!
        en: Cairo. Morning. Knock, knock, knock!
        note:
          ar_eg: «tok, tok» هو صوت خبط الباب بالإندونيسي.
          ar: «tok, tok» هو صوت طرق الباب بالإندونيسية.
          en: '"tok, tok" is the Indonesian sound of knocking on a door.'
new_words:
  - word: Nduk
    pos: noun
    ar_eg: يا بنتي (كلمة جاوية، فيها حنية)
    ar: يا ابنتي (كلمة جاوية للتحبّب)
    en: my girl, sweetheart (Javanese, to a daughter)
  - word: Mas
    pos: noun
    ar_eg: لقب لراجل شاب، زي «يا أخ»
    ar: لقب للرجل الشاب، مثل «يا أخي»
    en: title for a young man ("brother", "mate")
  - word: ini
    pos: pronoun
    ar_eg: ده / دي
    ar: هذا / هذه
    en: this
  - word: tok, tok
    ar_eg: صوت خبط الباب
    ar: صوت طرق الباب
    en: knock, knock
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: الوقت إيه في ماديون في الحلقة دي؟
      ar: ما الوقت في ماديون في هذه الحلقة؟
      en: What time of day is it in Madiun in this episode?
    options: ["sore", "siang", "pagi", "malam"]
    answer: 1
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: ساري بتقول لأبوها إيه في الأول؟
      ar: ماذا تقول ساري لأبيها أولًا؟
      en: What does Sari say to her dad first?
    options: ["Asalamualaikum, Pak!", "Sampai jumpa, Pak!", "Selamat malam, Pak!"]
    answer: 0
  - id: q03
    type: fill_blank
    sentence: Kabar ___, Pak. Terima kasih.
    meaning:
      ar_eg: أنا كويسة يا بابا. شكرًا.
      ar: أنا بخير يا أبي. شكرًا.
      en: I'm fine, Dad. Thanks.
    answers: [baik]
    options: ["baik", "maaf", "malam"]
  - id: q04
    type: translate
    direction: from_target
    source_text: Sampai jumpa besok!
    answers_meaning:
      ar_eg: ["أشوفك بكرة!", "نتقابل بكرة!", "سلام لحد بكرة!"]
      ar: ["إلى اللقاء غدًا!", "أراك غدًا!", "نلتقي غدًا!"]
      en: ["See you tomorrow!", "Until tomorrow!", "Bye, see you tomorrow!"]
next:
  ar_eg: مين اللي بيخبّط على باب ساري في القاهرة الصبح بدري كده؟
  ar: من يطرق باب ساري في القاهرة في هذا الصباح الباكر؟
  en: Who is knocking on Sari's door in Cairo so early in the morning?
