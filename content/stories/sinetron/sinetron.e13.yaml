title:
  target: Buka Puasa di Stasiun
  ar_eg: فطار في المحطة
  ar: إفطار في المحطة
  en: Iftar at the Station
summary:
  ar_eg: قطر كريم لسورابايا اتأخّر ساعة، والمغرب داخل ومعهوش أكل. لحسن الحظ بو تيني، زبونة الوارونج، موجودة. وفي القاهرة لسه الضهر ونادية وساري صايمين.
  ar: تأخّر قطار كريم إلى سورابايا ساعة، والمغرب يقترب وليس معه طعام. لحسن الحظ أن بو تيني، زبونة الوارونغ، هناك. وفي القاهرة ما زال الظهر، ونادية وساري صائمتان.
  en: Karim's train to Surabaya is an hour late, sunset is coming and he has no food. Luckily Bu Tini, a warung regular, is there. In Cairo it's still midday, and Nadia and Sari are still fasting.
cast: [Karim, Petugas, Bu Tini, Nadia, Sari]
scenes:
  - setting:
      ar_eg: محطة قطر ماديون، الأحد الساعة ٥ ونص العصر. المحطة زحمة ناس صايمين راجعين لشغلهم.
      ar: محطة قطار ماديون، يوم الأحد في الخامسة والنصف عصرًا. المحطة مزدحمة بصائمين عائدين إلى أعمالهم.
      en: Madiun railway station, Sunday, 5:30 p.m. The station is full of fasting people heading back to work.
    lines:
      - speaker: Narrator
        text: Hari Minggu. Jam setengah enam sore. Karim di stasiun Madiun.
        ar_eg: يوم الأحد. الساعة ٥ ونص العصر. كريم في محطة ماديون.
        ar: يوم الأحد. الساعة الخامسة والنصف عصرًا. كريم في محطة ماديون.
        en: Sunday. Half past five in the afternoon. Karim is at Madiun station.
        note:
          ar_eg: خلّي بالك - setengah enam يعني «نص ساعة قبل ٦»، يعني ٥ ونص، مش ٦ ونص!
          ar: انتبه - setengah enam تعني «نصف ساعة قبل السادسة»، أي الخامسة والنصف، لا السادسة والنصف!
          en: 'Careful: setengah enam means "half to six" = 5:30, not 6:30!'
      - speaker: Petugas
        text: Perhatian, perhatian! Para penumpang kereta tujuan Surabaya, mohon maaf. Kereta terlambat satu jam.
        ar_eg: انتباه، انتباه! حضرات الركّاب المسافرين لسورابايا، بنعتذر. القطر متأخّر ساعة.
        ar: انتباه، انتباه! السادة ركّاب القطار المتّجه إلى سورابايا، نعتذر إليكم. القطار متأخّر ساعة.
        en: Attention, please! Passengers for the train to Surabaya, we apologise. The train is one hour late.
        note:
          ar_eg: الإعلانات بتتقال بالإندونيسي الرسمي. para قبل الاسم معناها «حضرات / كل الـ»، وmohon أدبّ من minta.
          ar: تُقال الإعلانات بالإندونيسية الرسمية. وpara قبل الاسم تعني «السادة / جميع الـ»، وmohon أكثر تهذيبًا من minta.
          en: Announcements use formal Indonesian. para before a noun means "all the / dear", and mohon is politer than minta.
      - speaker: Karim
        text: Satu jam? Jam enam buka puasa, dan saya tidak punya makanan!
        ar_eg: ساعة؟ الفطار الساعة ٦، وأنا معييش أكل!
        ar: ساعة؟ الإفطار في السادسة، وليس معي طعام!
        en: An hour? Iftar is at six, and I don't have any food!
      - speaker: Narrator
        text: Di stasiun ada banyak penumpang. Semua puasa. Beberapa penumpang punya takjil.
        ar_eg: في المحطة ركّاب كتير. كلّهم صايمين. وكام راكب معاهم تعجيل.
        ar: في المحطة ركّاب كثيرون، كلّهم صائمون، وبعضهم معه تعجيل.
        en: There are lots of passengers at the station. Everyone is fasting. A few passengers have takjil.
      - speaker: Bu Tini
        text: Mas Karim? Teman Pak Budi, ya? Ini, ada kurma dan air putih.
        ar_eg: ماس كريم؟ صاحب پاك بودي، صح؟ اتفضّل، معايا تمر وميّة.
        ar: ماس كريم؟ صديق باك بودي، أليس كذلك؟ تفضّل، معي تمر وماء.
        en: Mas Karim? Pak Budi's friend, right? Here, I've got dates and water.
        note:
          ar_eg: بو تيني هي الست اللي ماس جوكو افتكرها كريم في الحلقة ٨!
          ar: بو تيني هي السيدة التي ظنّها ماس جوكو كريمًا في الحلقة الثامنة!
          en: Bu Tini is the lady Mas Joko mistook for Karim back in episode 8!
      - speaker: Karim
        text: Terima kasih, Bu Tini! Ibu sering naik kereta?
        ar_eg: متشكّر يا بو تيني! حضرتك بتركبي القطر كتير؟
        ar: شكرًا يا بو تيني! هل تركبين القطار كثيرًا؟
        en: Thank you, Bu Tini! Do you often take the train?
      - speaker: Bu Tini
        text: Setiap minggu, Mas. Dan kereta ini sering terlambat!
        ar_eg: كل أسبوع يا ماس. والقطر ده بيتأخّر كتير!
        ar: كل أسبوع يا ماس. وهذا القطار يتأخّر كثيرًا!
        en: Every week, Mas. And this train is often late!
      - speaker: Petugas
        text: Para penumpang yang berpuasa, selamat berbuka puasa.
        ar_eg: حضرات الركّاب الصايمين، فطار هنيّ.
        ar: السادة الركّاب الصائمون، إفطارًا شهيًّا.
        en: To all passengers who are fasting, enjoy breaking your fast.
      - speaker: Narrator
        text: Dari masjid ada suara azan magrib.
        ar_eg: من الجامع جه صوت أذان المغرب.
        ar: من المسجد جاء صوت أذان المغرب.
        en: From the mosque comes the sound of the sunset call to prayer.
      - speaker: Karim
        text: Alhamdulillah. Di Mesir kami juga buka puasa dengan kurma.
        ar_eg: الحمد لله. في مصر إحنا كمان بنفطر على تمر.
        ar: الحمد لله. في مصر نفطر نحن أيضًا على التمر.
        en: Thank God. In Egypt we break our fast with dates too.
  - setting:
      ar_eg: في نفس اللحظة في القاهرة - الساعة واحدة الضهر. كريم بيكلّم أخته نادية، وساري معاها.
      ar: في اللحظة نفسها في القاهرة، الساعة الواحدة ظهرًا. يتّصل كريم بأخته نادية، وساري معها.
      en: At the same moment in Cairo it's 1 p.m. Karim calls his sister Nadia, who is with Sari.
    lines:
      - speaker: Nadia
        text: Karim! Kamu sudah buka puasa?
        ar_eg: كريم! انت فطرت خلاص؟
        ar: كريم! هل أفطرت؟
        en: Karim! Have you broken your fast already?
      - speaker: Karim
        text: Sudah. Di stasiun, dengan kurma dari Bu Tini.
        ar_eg: آه. في المحطة، بتمر من بو تيني.
        ar: نعم. في المحطة، بتمر من بو تيني.
        en: Yes. At the station, with dates from Bu Tini.
      - speaker: Nadia
        text: Di Kairo masih jam satu siang! Saya dan Sari puasa lima jam lagi.
        ar_eg: في القاهرة لسه الساعة واحدة الضهر! أنا وساري قدّامنا خمس ساعات صيام.
        ar: ما زالت الساعة الواحدة ظهرًا في القاهرة! أمامي أنا وساري خمس ساعات أخرى من الصيام.
        en: It's still one in the afternoon in Cairo! Sari and I have five more hours of fasting.
        note:
          ar_eg: ماديون قدّام القاهرة بـ ٥ ساعات في الشتا. فلما ماديون تفطر، القاهرة لسه في نص النهار.
          ar: تسبق ماديون القاهرة بخمس ساعات في الشتاء، فحين تفطر ماديون تكون القاهرة في منتصف النهار.
          en: In winter Madiun is five hours ahead of Cairo, so when Madiun breaks its fast, Cairo is only at midday.
      - speaker: Sari
        text: Untung ada Bu Tini, Karim!
        ar_eg: الحمد لله إن بو تيني كانت موجودة يا كريم!
        ar: من حسن الحظ أن بو تيني كانت هناك يا كريم!
        en: Lucky Bu Tini was there, Karim!
      - speaker: Petugas
        text: Perhatian! Kereta tujuan Surabaya segera datang. Harap antre dan hati-hati.
        ar_eg: انتباه! القطر المسافر لسورابايا داخل حالًا. برجاء الوقوف في الطابور والحذر.
        ar: انتباه! القطار المتّجه إلى سورابايا قادم حالًا. يُرجى الوقوف في الطابور والحذر.
        en: Attention! The train to Surabaya is arriving shortly. Please queue and take care.
      - speaker: Bu Tini
        text: Mas Karim, salam untuk Pak Budi, ya. Sekarang Pak Budi sering capek.
        ar_eg: يا ماس كريم، سلّملي على پاك بودي. پاك بودي اليومين دول بيتعب كتير.
        ar: يا ماس كريم، بلّغ سلامي باك بودي. باك بودي يتعب كثيرًا هذه الأيام.
        en: Mas Karim, give my regards to Pak Budi. He gets tired a lot these days.
      - speaker: Karim
        text: Ya, Bu. Pak Budi terlalu sering bekerja sampai malam.
        ar_eg: آه يا بو. پاك بودي بيشتغل لحد بالليل كتير أوي.
        ar: نعم يا بو. باك بودي يعمل حتى الليل كثيرًا جدًّا.
        en: Yes, Bu. Pak Budi works till night far too often.
new_words:
  - word: magrib
    arabic: مغرب
    pos: noun
    ar_eg: المغرب
    ar: المغرب
    en: sunset (prayer time)
  - word: azan
    arabic: أذان
    pos: noun
    ar_eg: الأذان
    ar: الأذان
    en: call to prayer
  - word: berbuka puasa
    pos: verb
    ar_eg: يفطر (في رمضان)
    ar: يُفطر
    en: to break the fast
  - word: stasiun
    pos: noun
    ar_eg: محطة قطر
    ar: محطة قطار
    en: railway station
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: القطر اتأخّر قد إيه؟
      ar: كم تأخّر القطار؟
      en: How late is the train?
    options: ["lima jam", "setengah jam", "satu jam"]
    answer: 2
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: مين إدّى كريم تمر؟
      ar: مَن أعطى كريمًا التمر؟
      en: Who gives Karim dates?
    options: ["Petugas", "Bu Tini", "Nadia"]
    answer: 1
  - id: q03
    type: fill_blank
    sentence: Dan kereta ini ___ terlambat!
    meaning:
      ar_eg: والقطر ده بيتأخّر كتير!
      ar: وهذا القطار يتأخّر كثيرًا!
      en: And this train is often late!
    answers: [sering]
    options: ["beberapa", "sering", "semua"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: الساعة كام في القاهرة لما كريم فطر؟
      ar: كم الساعة في القاهرة حين أفطر كريم؟
      en: What time is it in Cairo when Karim breaks his fast?
    options: ["jam satu siang", "jam enam sore", "jam lima pagi"]
    answer: 0
  - id: q05
    type: translate
    direction: from_target
    source_text: Harap antre dan hati-hati.
    answers_meaning:
      ar_eg: ["ياريت تقفوا في الطابور وخلّوا بالكم.", "برجاء الوقوف في الطابور والحذر."]
      ar: ["يُرجى الوقوف في الطابور والحذر.", "الرجاء الاصطفاف والانتباه."]
      en: ["Please queue and take care.", "Please line up and be careful."]
next:
  ar_eg: بو راهايو وبايو رايحين السوق يشتروا حاجات التعجيل... بس پاك بودي مش معاهم. وفي القاهرة نادية ناوية تفاصل في فانوس!
  ar: تذهب بو راهايو وبايو إلى السوق لشراء مستلزمات التعجيل... لكن باك بودي ليس معهما. وفي القاهرة تنوي نادية المساومة على فانوس!
  en: Bu Rahayu and Bayu go to the market for takjil supplies... but Pak Budi isn't with them. And in Cairo, Nadia is ready to haggle over a fanous!
