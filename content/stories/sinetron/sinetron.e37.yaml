title:
  target: Pencegahan Lebih Baik
  ar_eg: الوقاية خير
  ar: الوقاية خير
  en: Prevention Is Better
summary:
  ar_eg: پاك بودي نسي دواه تلات أيام في حرّ أغسطس، فالعيلة بتاخده لعيادة صغيرة في القاهرة وساري بتترجم. وفي البيت، الحاجّة فاطمة بتطلّع وصفاتها، والدكتورة وولان بتتّصل من ماديون.
  ar: نسي باك بودي دواءه ثلاثة أيام في حرّ أغسطس، فتأخذه العائلة إلى عيادة صغيرة في القاهرة وتترجم ساري. وفي البيت تُخرج الحاجّة فاطمة وصفاتها، وتتّصل الدكتورة وولان من ماديون.
  en: Pak Budi forgot his medicine for three days in the August heat, so the family takes him to a small Cairo clinic, with Sari translating. Back home, Hagga Fatma brings out her remedies, and Dr Wulan calls from Madiun.
cast: [Bu Rahayu, Pak Budi, Sari, Hagga Fatma, Dokter Wulan]
scenes:
  - setting:
      ar_eg: تاني يوم الصبح، عيادة صغيرة قريبة من بيت الحاجّة فاطمة. پاك بودي قاعد على السرير، ووشّه أحسن من امبارح.
      ar: صباح اليوم التالي، عيادة صغيرة قرب بيت الحاجّة فاطمة. باك بودي جالس على السرير، ووجهه أفضل من الأمس.
      en: The next morning, a small clinic near Hagga Fatma's house. Pak Budi sits on the examination bed, looking better than yesterday.
    lines:
      - speaker: Bu Rahayu
        text: Pak, jujur aja. Obatnya diminum apa nggak?
        ar_eg: يا بودي، قول الحقيقة. الدوا اتاخد ولا لأ؟
        ar: يا باك، قل الحقيقة. هل أخذت الدواء أم لا؟
        en: Pak, be honest. Did you take the medicine or not?
      - speaker: Pak Budi
        text: Bapak lupa, Bu. Tiga hari. Di Kairo jadwal Bapak kacau, makan jam berapa aja.
        ar_eg: نسيت يا رهايو. تلات أيام. هنا في القاهرة مواعيدي ملخبطة، باكل في أي وقت.
        ar: نسيت. ثلاثة أيام. مواعيدي في القاهرة مضطربة، آكل في أيّ ساعة.
        en: I forgot. Three days. In Cairo my schedule's all over the place - I eat whenever.
      - speaker: Narrator
        text: Dokter melakukan pemeriksaan. Dia berbicara bahasa Arab, dan Sari menerjemahkan untuk orang tuanya.
        ar_eg: الدكتور بيكشف. بيتكلّم عربي، وساري بتترجم لأهلها.
        ar: يُجري الطبيب الفحص. يتكلّم العربية، وتترجم ساري لوالديها.
        en: The doctor does an examination. He speaks Arabic, and Sari translates for her parents.
        note:
          ar_eg: peN-…-an بتعمل اسم للعملية - periksa (يكشف) → pemeriksaan (الكشف)، obat → pengobatan (العلاج)، cegah (يمنع) → pencegahan (الوقاية)، layan → pelayanan (الخدمة).
          ar: تصوغ peN-…-an اسمًا للعملية - periksa (يفحص) ← pemeriksaan (الفحص)، obat ← pengobatan (العلاج)، cegah (يمنع) ← pencegahan (الوقاية)، layan ← pelayanan (الخدمة).
          en: peN-…-an names a process - periksa (examine) → pemeriksaan (examination), obat → pengobatan (treatment), cegah (prevent) → pencegahan (prevention), layan → pelayanan (service).
      - speaker: Sari
        text: Kata dokter, tekanan darah Bapak naik lagi. Gara-garanya cuaca panas, kurang minum, sama obat yang nggak diminum.
        ar_eg: الدكتور بيقول إن ضغطك علي تاني. والسبب الحرّ، وإنك مش بتشرب مية كفاية، والدوا اللي متاخدش.
        ar: يقول الطبيب إنّ ضغط دمك ارتفع مجدّدًا، والسبب الحرّ وقلّة شرب الماء والدواء الذي لم يُؤخذ.
        en: The doctor says your blood pressure has gone up again. The causes are the heat, not drinking enough, and the medicine you didn't take.
      - speaker: Pak Budi
        text: Parah, Nduk?
        ar_eg: الموضوع خطير يا بنتي؟
        ar: هل الأمر خطير يا ابنتي؟
        en: Is it serious, sweetheart?
      - speaker: Sari
        text: Nggak parah kok, Pak. Tapi pengobatannya harus rutin. Obatnya jangan lupa lagi, terus minum air putih yang banyak.
        ar_eg: مش خطير يا بابا. بس العلاج لازم يبقى بانتظام. متنساش الدوا تاني، واشرب مية كتير.
        ar: ليس خطيرًا يا أبي، لكن يجب أن يكون العلاج منتظمًا. لا تنسَ الدواء مرة أخرى، واشرب الكثير من الماء.
        en: It's not serious, Dad. But the treatment has to be regular. Don't forget your medicine again, and drink plenty of water.
      - speaker: Bu Rahayu
        text: Buku harian Bapak juga kosong tiga hari! Untung kita punya asuransi perjalanan. Dulu Bapak bilang nggak perlu!
        ar_eg: وكمان دفتر يومياتك فاضي بقاله تلات أيام! الحمد لله إن معانا تأمين سفر. وانت كنت بتقول مش لازم!
        ar: ودفتر يومياتك فارغ منذ ثلاثة أيام! من حسن الحظّ أنّ لدينا تأمين سفر، وكنتَ تقول إنه غير ضروري!
        en: And your diary's been empty for three days too! Lucky we've got travel insurance. You said we didn't need it!
        note:
          ar_eg: في إندونيسيا فيه تأمين صحي حكومي اسمه BPJS بيغطّي أغلب الناس، والـ puskesmas هي الوحدة الصحية بتاعة الحيّ. بس برّه البلد لازم تأمين سفر. وbilang = berkata (يقول) في الكلام.
          ar: في إندونيسيا تأمين صحي حكومي اسمه BPJS يغطّي معظم السكان، والـ puskesmas هي المراكز الصحية المحلية. لكن في الخارج يلزم تأمين السفر.
          en: In Indonesia, the national health insurance BPJS covers most people, and a puskesmas is the local health centre. Abroad, though, you need travel insurance. bilang = berkata (say) in everyday speech.
      - speaker: Pak Budi
        text: Pelayanan di sini cepat, ya. Dokternya ramah banget.
        ar_eg: الخدمة هنا سريعة. والدكتور لطيف أوي.
        ar: الخدمة هنا سريعة، والطبيب لطيف جدًّا.
        en: The service here is quick. The doctor is so friendly.
      - speaker: Sari
        text: Dokternya bilang, "Ahlan bik fi Masr. Tapi jangan kembali ke klinik ini lagi... sebagai pasien!"
        ar_eg: الدكتور بيقول - «أهلًا بيك في مصر. بس متجيش العيادة دي تاني... كعيّان!»
        ar: يقول الطبيب - «أهلًا بك في مصر. لكن لا تعد إلى هذه العيادة مرة أخرى... مريضًا!»
        en: The doctor says, "Welcome to Egypt. But don't come back to this clinic... as a patient!"
  - setting:
      ar_eg: بيت الحاجّة فاطمة، بعد الضهر. الشبابيك مقفولة من الحرّ، وعلى الترابيزة كوبايات حمرا وصفرا.
      ar: بيت الحاجّة فاطمة بعد الظهر. النوافذ مغلقة من الحرّ، وعلى الطاولة أكواب حمراء وصفراء.
      en: Hagga Fatma's flat in the afternoon. The shutters are closed against the heat, and there are red and yellow drinks on the table.
    lines:
      - speaker: Hagga Fatma
        text: Pak Budi, ini karkadeh dingin. Kata nenek saya, karkadeh bagus buat tekanan darah.
        ar_eg: يا پاك بودي، ده كركديه ساقع. ستّي كانت بتقول إن الكركديه كويس للضغط.
        ar: يا باك بودي، هذا كركديه بارد. كانت جدّتي تقول إنّ الكركديه مفيد لضغط الدم.
        en: Pak Budi, here's some cold karkadeh. My grandmother always said karkadeh is good for blood pressure.
        note:
          ar_eg: الكركديه في إندونيسيا اسمه teh rosela، وبيتشرب هناك كمان. والحاجّة فاطمة بتسمّيه باسمه المصري طبعًا.
          ar: يُسمّى الكركديه في إندونيسيا teh rosela، ويُشرب هناك أيضًا. والحاجّة فاطمة تسمّيه باسمه المصري طبعًا.
          en: Hibiscus tea is called teh rosela in Indonesia, and people drink it there too. Hagga Fatma, naturally, uses the Egyptian name.
      - speaker: Pak Budi
        text: Merah kayak sirup! Segar banget, Hagga.
        ar_eg: أحمر زي الشربات! منعش أوي يا حاجّة.
        ar: أحمر كالشراب! منعش جدًّا يا حاجّة.
        en: Red like cordial! So refreshing, Hagga.
        note:
          ar_eg: kayak = seperti (زي) في الكلام.
          ar: kayak = seperti (مثل) في الكلام اليومي.
          en: kayak = seperti (like) in everyday speech.
      - speaker: Hagga Fatma
        text: Terus ini lemon sama daun mint, buat panas. Ingat ya, jangan keluar rumah jam dua belas siang di bulan Agustus!
        ar_eg: وده لمون بالنعناع، عشان الحرّ. وافتكر، متخرجش من البيت الساعة ١٢ الضهر في أغسطس!
        ar: وهذا ليمون بالنعناع للحرّ. وتذكّر، لا تخرج من البيت في الثانية عشرة ظهرًا في أغسطس!
        en: And this is lemon with mint, for the heat. And remember, never go out at noon in August!
      - speaker: Sari
        text: Pak, ada telepon dari Dokter Wulan di Madiun.
        ar_eg: بابا، الدكتورة وولان بتتّصل من ماديون.
        ar: أبي، الدكتورة وولان تتّصل من ماديون.
        en: Dad, Dr Wulan is calling from Madiun.
      - speaker: Dokter Wulan
        text: Pak Budi, saya sudah membaca hasil pemeriksaan dari Kairo. Tidak berbahaya, asal obatnya diminum dua kali sehari.
        ar_eg: يا پاك بودي، أنا قريت نتيجة الكشف اللي من القاهرة. مفيش خطر، بشرط الدوا يتاخد مرتين في اليوم.
        ar: يا باك بودي، قرأت نتيجة الفحص من القاهرة. لا خطر، بشرط أن يُؤخذ الدواء مرّتين يوميًّا.
        en: Pak Budi, I've read the examination results from Cairo. Nothing dangerous, as long as you take the medicine twice a day.
      - speaker: Pak Budi
        text: Bu Dokter, Hagga Fatma kasih saya karkadeh. Boleh nggak?
        ar_eg: يا دكتورة، الحاجّة فاطمة ادّتني كركديه. ينفع؟
        ar: يا دكتورة، أعطتني الحاجّة فاطمة كركديه. هل يجوز؟
        en: Doctor, Hagga Fatma gave me karkadeh. Is that all right?
        note:
          ar_eg: kasih = memberi (يدّي) في الكلام. پاك بودي بيكلّم الدكتورة بأدب (saya، Bu Dokter) بس بكلام عادي.
          ar: kasih = memberi (أعطى) في الكلام اليومي. يكلّم پاك بودي الطبيبة بأدب (saya، Bu Dokter) لكن بلغة عادية.
          en: kasih = memberi (give) in everyday speech. Pak Budi is polite to the doctor (saya, Bu Dokter) but still talks normally.
      - speaker: Dokter Wulan
        text: Boleh, Pak. Tapi karkadeh itu teman obat, bukan pengganti obat. Pencegahan lebih baik daripada pengobatan.
        ar_eg: ينفع يا پاك. بس الكركديه صاحب الدوا، مش بديله. والوقاية خير من العلاج.
        ar: يجوز يا باك. لكن الكركديه رفيق للدواء لا بديل عنه. والوقاية خير من العلاج.
        en: Yes, Pak. But karkadeh is the medicine's friend, not its replacement. Prevention is better than cure.
      - speaker: Hagga Fatma
        text: Betul! Di Mesir juga ada pepatah itu, "al-wiqaya khairun min al-'ilaj".
        ar_eg: مظبوط! وعندنا في مصر نفس المثل - «الوقاية خير من العلاج».
        ar: صحيح! وفي مصر المثل نفسه - «الوقاية خير من العلاج».
        en: Exactly! We have the same saying in Egypt - "prevention is better than cure".
        note:
          ar_eg: «Pencegahan lebih baik daripada pengobatan» هي نفس «الوقاية خير من العلاج» حرفيًا - وفيها اسمين بـ peN-…-an في جملة واحدة!
          ar: «Pencegahan lebih baik daripada pengobatan» هي «الوقاية خير من العلاج» حرفيًّا، وفيها اسمان على وزن peN-…-an في جملة واحدة!
          en: Pencegahan lebih baik daripada pengobatan is word for word the Arabic proverb - and it holds two peN-…-an nouns in one sentence!
      - speaker: Bu Rahayu
        text: Mulai sekarang, Ibu yang pegang jadwal obat Bapak. Alarm di HP, dua kali sehari.
        ar_eg: من النهارده، أنا اللي ماسكة مواعيد دواك. منبّه على الموبايل، مرتين في اليوم.
        ar: من الآن فصاعدًا أنا من يتولّى مواعيد دوائك. منبّه على الهاتف مرّتين يوميًّا.
        en: From now on, I'm in charge of your medicine schedule. Phone alarm, twice a day.
      - speaker: Pak Budi
        text: Siap, Bu! Nduk, jangan cerita ke Bayu, ya.
        ar_eg: تمام يا فندم! يا بنتي، متحكيش لبايو، ماشي؟
        ar: أمرك! يا ابنتي، لا تخبري بايو، اتفقنا؟
        en: Yes, ma'am! Sweetheart, don't tell Bayu, okay?
      - speaker: Sari
        text: Telat, Pak. Ibu udah cerita di grup WhatsApp.
        ar_eg: فات الأوان يا بابا. ماما حكت خلاص في جروب الواتساب.
        ar: فات الأوان يا أبي. لقد روت أمي كلّ شيء في مجموعة الواتساب.
        en: Too late, Dad. Mum already told the WhatsApp group.
        note:
          ar_eg: telat = terlambat (متأخّر)، udah = sudah - كلام كل يوم.
          ar: telat = terlambat (متأخّر)، udah = sudah في الكلام اليومي.
          en: telat = terlambat (late), udah = sudah - everyday speech.
