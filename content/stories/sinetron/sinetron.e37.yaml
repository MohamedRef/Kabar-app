    text: Ingat ya, jangan keluar rumah jam dua belas siang di bulan Agustus!
    question:
      ar_eg: الحاجّة فاطمة نصحت پاك بودي بإيه؟
      ar: بماذا نصحت الحاجّة فاطمة باك بودي؟
      en: What does Hagga Fatma advise Pak Budi?
    options: ["Minum obat jam dua belas.", "Pulang ke Madiun bulan Agustus.", "Tidur siang setiap hari.", "Jangan keluar rumah jam dua belas siang."]
    answer: 3
    meaning:
      ar_eg: افتكر، متخرجش من البيت الساعة ١٢ الضهر في أغسطس!
      ar: تذكّر، لا تخرج من البيت في الثانية عشرة ظهرًا في أغسطس!
      en: Remember, never go out at noon in August!
  - id: q05
