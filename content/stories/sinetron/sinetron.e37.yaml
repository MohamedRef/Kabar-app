    direction: to_target
    source_meaning:
      ar_eg: الوقاية خير من العلاج.
      ar: الوقاية خير من العلاج.
      en: Prevention is better than cure.
    answers: ["Pencegahan lebih baik daripada pengobatan.", "Pencegahan lebih baik daripada pengobatan", "Mencegah lebih baik daripada mengobati.", "Mencegah lebih baik daripada mengobati", "Pencegahan lebih baik dari pengobatan.", "Pencegahan lebih baik dari pengobatan", "Mencegah lebih baik dari mengobati.", "Mencegah lebih baik dari mengobati"]
next:
  ar_eg: پاك بودي لازم يرتاح في البيت كام يوم. وبالليل، الحاجّة فاطمة عندها حدّوتة مصرية قديمة... وپاك بودي عنده حدّوتة يردّ بيها.
  ar: على باك بودي أن يرتاح في البيت بضعة أيام. وفي المساء لدى الحاجّة فاطمة حكاية مصرية قديمة... ولدى باك بودي حكاية يردّ بها.
  en: Pak Budi has to rest at home for a few days. In the evenings, Hagga Fatma has an old Egyptian tale... and Pak Budi has one of his own to answer it.
