    type: multiple_choice
    question_meaning:
      ar_eg: پاك بودي نسي الدوا كام يوم؟
      ar: كم يومًا نسي باك بودي الدواء؟
      en: For how many days did Pak Budi forget his medicine?
    options: ["satu hari", "dua hari", "tiga hari", "seminggu"]
    answer: 2
  - id: q02
    type: fill_blank
    sentence: ___ lebih baik daripada pengobatan.
    meaning:
      ar_eg: الوقاية خير من العلاج.
      ar: الوقاية خير من العلاج.
      en: Prevention is better than cure.
    answers: [Pencegahan]
    options: ["Pemeriksaan", "Pencegahan", "Pelayanan"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: الدكتورة وولان قالت إيه عن الكركديه؟
      ar: ماذا قالت الدكتورة وولان عن الكركديه؟
      en: What does Dr Wulan say about karkadeh?
    options: ["Karkadeh itu teman obat, bukan pengganti obat.", "Karkadeh tidak boleh diminum.", "Karkadeh lebih baik daripada obat."]
    answer: 0
  - id: q04
