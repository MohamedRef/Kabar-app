id: sinetron.e84
series: sinetron
episode: 84
language: jv
level: j3
unlock_after: j3.u01
title:
  target: Kowe wis mangan?
  ar_eg: انت كلت؟
  ar: هل أكلت؟
  en: Have you eaten?
summary:
  ar_eg: في محطة ليمپويانجان، كريم بيسلّم على پاك هارجو، المدرّس الكبير، بنفس الجاوي اللي بيكلّم بيه صحابه. پاك هارجو مش بيزعل - بيضحك، وبيشرح لكريم إن الجاوي فيه «درجات» زي «انت» و«حضرتك» و«سيادتك» عندنا.
  ar: في محطة ليمبويانغان، يحيّي كريم باك هارجو، المعلّم المسنّ، بالجاوية نفسها التي يكلّم بها أصدقاءه. لا يغضب باك هارجو - بل يضحك، ويشرح لكريم أنّ في الجاوية «درجات» مثل «أنت» و«حضرتك» و«سيادتك» عندنا.
  en: At Lempuyangan station, Karim greets Pak Harjo, the elderly teacher, in the same Javanese he uses with his mates. Pak Harjo isn't offended - he laughs, and explains that Javanese has "levels", like "enta", "hadritak" and "siyadtak" in Egyptian Arabic.
cast: [Karim, Pak Harjo]
scenes:
  - setting:
      ar_eg: محطة ليمپويانجان، الصبح. پاك هارجو، راجل في السبعين لابس قميص باتيك وطاقية سودا (pici)، مستنّي على الرصيف.
      ar: محطة ليمبويانغان، صباحًا. باك هارجو، رجل في السبعين يرتدي قميص باتيك وطاقية سوداء (pici)، ينتظر على الرصيف.
      en: Lempuyangan station, in the morning. Pak Harjo, a man of seventy in a batik shirt and black cap (pici), waits on the platform.
    lines:
      - speaker: Pak Harjo
        text: Nak Karim? Sugeng rawuh wonten Jogja.
        ar_eg: "إنت كريم يا ابني؟ أهلًا وسهلًا بيك في جوجا."
        ar: "أأنت كريم يا بنيّ؟ أهلًا وسهلًا بك في جوغجا."
        en: "Karim, my boy? Welcome to Jogja."
        note:
          ar_eg: "Nak (من anak) يعني «يا ابني»، الكبار بيقولوها للأصغر بحنية. وwonten = في (كراما)، بدل neng. كلمات: rawuh = ييجي / يوصل (krama inggil؛ ngoko teka، krama dhateng)؛ sugeng = (تحية) سعيد، صباح/مسا…"
          ar: "Nak (من anak) تعني «يا بنيّ»، يقولها الكبار للأصغر تحبّبًا. وwonten = في (كراما)، بدل neng. مفردات: rawuh = يأتي / يصل (krama inggil؛ ngoko teka، وkrama dhateng)؛ sugeng = تحية: طاب، سعيد."
          en: "Nak (from anak) means \"my boy/girl\", what elders call younger people kindly. wonten = at, in (krama), instead of neng. Words: rawuh = come, arrive (krama inggil; ngoko teka, krama dhateng) = datang; sugeng = (greeting) good …, happy …"
      - speaker: Karim
        text: Pak Harjo! Piye kabare? Kowe wis mangan?
        ar_eg: يا پاك هارجو! عامل إيه؟ انت كلت؟
        ar: يا باك هارجو! كيف حالك؟ هل أكلت؟
        en: Pak Harjo! How are you? Have you eaten?
      - speaker: Narrator
        text: Wong-wong ing peron padha meneng. Ana mbak-mbak sing mesem.
        ar_eg: الناس على الرصيف سكتوا. وفيه بنت ابتسمت.
        ar: سكت الناس على الرصيف. وابتسمت إحدى الفتيات.
        en: The people on the platform go quiet. A young woman smiles.
        note:
          ar_eg: "كلمات: meneng = ساكت."
          ar: "مفردات: meneng = صامت، ساكت."
          en: "Words: meneng = quiet, silent."
      - speaker: Pak Harjo
        text: Hahaha! Mboten menapa-menapa, Nak. Nanging mangke kula wucal, nggih.
        ar_eg: ههههه! مافيش مشكلة يا ابني. بس بعدين هعلّمك، ماشي.
        ar: ههههه! لا بأس يا بنيّ. لكنّي سأعلّمك لاحقًا، حسنًا.
        en: Hahaha! No harm done, my boy. But I'll teach you later, all right.
        note:
          ar_eg: "كلمات: mangke = بعدين (mengko ← mangke)، كراما؛ mboten = مش / لأ (krama لـ ora) = tidak؛ menapa-menapa = mboten menapa-menapa = مفيش حاجة؛ nggih = أيوه، ماشي (كراما)."
          ar: "مفردات: mangke = لاحقًا (mengko ← mangke)، كراما؛ mboten = لا / ليس (krama لـ ora) = tidak؛ menapa-menapa = mboten menapa-menapa = لا بأس؛ nggih = نعم، حسنًا (كراما)."
          en: "Words: mangke = later (ngoko mengko, Indonesian nanti), krama; mboten = not, no (krama for ora) = tidak; menapa-menapa = mboten menapa-menapa = no problem (krama); nggih = yes, all right (krama)."
      - speaker: Karim
        text: Lho... aku salah?
        ar_eg: إيه... أنا غلطت؟
        ar: ماذا... هل أخطأت؟
        en: Oh... did I get it wrong?
  - setting:
      ar_eg: قهوة في المحطة. پاك هارجو بيرسم على منديل ورق تلات سلالم.
      ar: مقهى في المحطة. يرسم باك هارجو على منديل ورقيّ ثلاث درجات.
      en: A café in the station. Pak Harjo draws three steps on a paper napkin.
    lines:
      - speaker: Pak Harjo
        text: Basa Jawa punika gadhah undha-usuk. Ngoko, krama, lan krama inggil.
        ar_eg: الجاوي ليه درجات. «نجوكو»، و«كراما»، و«كراما إنجيل».
        ar: للجاوية درجات. «نغوكو»، و«كراما»، و«كراما إنغيل».
        en: Javanese has levels. Ngoko, krama, and krama inggil.
        note:
          ar_eg: "undha-usuk يعني درجات الكلام. ngoko للصحاب والأصغر، krama للناس اللي مش قريبين أو أكبر، krama inggil كلمات تشريف للكبير ولأفعاله. كلمات: punika = ده (iki ← punika)، كراما رسمي؛ gadhah = عندي / يملك (كراما، عن نفسك)."
          ar: "undha-usuk تعني درجات الكلام. ngoko للأصدقاء والأصغر، وkrama لغير المقرّبين أو الأكبر، وkrama inggil كلمات تشريف للكبير ولأفعاله. مفردات: punika = هذا (iki ← punika)، كراما رسمي؛ gadhah = يملك (كراما، عن النفس)."
          en: "undha-usuk means speech levels. Ngoko for friends and younger people, krama for people you're not close to or who are older, krama inggil for honorific words about a respected person and what they do. Words: punika = this (ngoko iki), formal krama; everyday menika, niki; gadhah = have, own (krama, about yourself) = punya."
      - speaker: Karim
        text: "Kaya basa Mesir! \"Enta\" lan \"ḥaḍritak\"."
        ar_eg: "زي المصري! «انت» و«حضرتك»."
        ar: "مثل العامّية المصرية! «إنت» و«حضرتك»."
        en: "Like Egyptian Arabic! \"Enta\" and \"hadritak\"."
        note:
          ar_eg: "كلمات: kaya = زي، كأنّ."
          ar: "مفردات: kaya = مثل."
          en: "Words: kaya = like, as = seperti."
      - speaker: Pak Harjo
        text: Leres! Kalih kanca, "Kowe wis mangan?". Kalih bakul, "Sampeyan sampun nedha?".
        ar_eg: صح! مع صاحبك، «Kowe wis mangan؟». مع البيّاع، «Sampeyan sampun nedha؟».
        ar: صحيح! مع صديقك، «Kowe wis mangan؟». ومع البائع، «Sampeyan sampun nedha؟».
        en: Right! To a friend, "Kowe wis mangan?". To a seller, "Sampeyan sampun nedha?".
        note:
          ar_eg: "كلمات: kalih = اتنين (loro ← dua)، كراما."
          ar: "مفردات: kalih = اثنان (loro ← dua)، كراما."
          en: "Words: kalih = two (ngoko loro, Indonesian dua), krama."
      - speaker: Pak Harjo
        text: Kalih tiyang sepuh, "Panjenengan sampun dhahar?".
        ar_eg: ومع حدّ كبير في السنّ، «Panjenengan sampun dhahar؟».
        ar: ومع كبير السنّ، «Panjenengan sampun dhahar؟».
        en: And to an elder, "Panjenengan sampun dhahar?".
        note:
          ar_eg: "نفس السؤال «كلت؟» بتلات طرق. «انت» - kowe ثم sampeyan ثم panjenengan. «خلاص» - wis ثم sampun. «ياكل» - mangan ثم nedha ثم dhahar. والسرّ - الكلمة اللي بتشرّف الكبير ما بتتقالش على نفسك أبدًا. كلمات: sepuh = كبير في السن (krama لـ tuwa) = tua."
          ar: "السؤال نفسه «هل أكلت؟» بثلاث طرق. «أنت» - kowe ثمّ sampeyan ثمّ panjenengan. و«قد» - wis ثمّ sampun. و«يأكل» - mangan ثمّ nedha ثمّ dhahar. والسرّ أنّ كلمة التشريف لا تقال عن نفسك أبدًا. مفردات: sepuh = مسنّ (krama لـ tuwa) = tua."
          en: "The same question \"have you eaten?\" three ways. \"You\" - kowe, then sampeyan, then panjenengan. \"Already\" - wis, then sampun. \"Eat\" - mangan, then nedha, then dhahar. The secret - an honorific word is never used about yourself. Words: sepuh = old, elderly (krama for tuwa) = tua."
      - speaker: Karim
        text: Pak Harjo... panjenengan sampun dhahar?
        ar_eg: يا پاك هارجو... حضرتك فطرت؟
        ar: يا باك هارجو... هل تناولت طعامك يا سيدي؟
        en: Pak Harjo... have you eaten, sir?
      - speaker: Pak Harjo
        text: Sampun, Nak. Matur nuwun. Lha, punika saestu sae!
        ar_eg: أيوه يا ابني. متشكّر. أهو كده بالظبط، حلو أوي!
        ar: نعم يا بنيّ. شكرًا. هكذا تمامًا، ممتاز!
        en: Yes, my boy. Thank you. Now that is truly good!
        note:
          ar_eg: "كلمات: lha = طب، أهو، ما (للاستغراب)؛ sae = كويس / حلو (krama لـ apik)."
          ar: "مفردات: lha = حسنًا، ها (للتنبيه والتعجب)؛ sae = حسن / جيد (krama لـ apik)."
          en: "Words: lha = well, so, see (surprise or emphasis); sae = good, nice (krama for apik)."
      - speaker: Narrator
        text: "Kaca patbelas. Ngoko, krama, krama inggil. Siji pitakon."
        ar_eg: "صفحة أربعتاشر. نجوكو، كراما، كراما إنجيل. سؤال واحد."
        ar: "الصفحة الرابعة عشرة. نغوكو، كراما، كراما إنغيل. سؤال واحد."
        en: "Page fourteen. Ngoko, krama, krama inggil. One question."
        note:
          ar_eg: "كلمات: kaca = صفحة."
          ar: "مفردات: kaca = صفحة."
          en: "Words: kaca = page (of a book)."
new_words:
  - word: ngoko
    pos: noun
    ar_eg: الجاوي العادي (للصحاب)
    ar: الجاوية العادية (للأصدقاء)
    en: plain Javanese (for friends)
  - word: krama
    pos: noun
    ar_eg: الجاوي المؤدّب
    ar: الجاوية المهذّبة
    en: polite Javanese
  - word: krama inggil
    pos: noun
    ar_eg: كلمات التشريف للكبار
    ar: كلمات التشريف للكبار
    en: honorific words for respected people
  - word: panjenengan
    pos: pronoun
    ar_eg: حضرتك
    ar: حضرتك / سيادتك
    en: you (honorific)
  - word: sampun
    pos: particle
    ar_eg: خلاص (كراما)
    ar: قد (كراما)
    en: already (krama of wis)
  - word: dhahar
    pos: verb
    ar_eg: ياكل (للكبار)
    ar: يأكل (للكبار)
    en: eat (honorific)
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: كريم غلط في إيه في المحطة؟
      ar: ما خطأ كريم في المحطة؟
      en: What was Karim's mistake at the station?
    options: ["He spoke Indonesian.", "He used ngoko with an elder.", "He forgot to say salam."]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Pak Harjo... ___ sampun dhahar?
    meaning:
      ar_eg: يا پاك هارجو... حضرتك فطرت؟
      ar: يا باك هارجو... هل تناولت طعامك يا سيدي؟
      en: Pak Harjo... have you eaten, sir?
    answers: [panjenengan]
    options: ["panjenengan", "kowe", "aku"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: مع البيّاع، تقول «كلت؟» إزاي؟
      ar: مع البائع، كيف تقول «هل أكلت؟»؟
      en: With a seller, how do you say "have you eaten?"?
    options: ["Kowe wis mangan?", "Sampeyan sampun nedha?", "Panjenengan sampun dhahar?"]
    answer: 1
  - id: q04
    type: translate
    direction: from_target
    source_text: Sugeng rawuh wonten Jogja.
    answers_meaning:
      ar_eg: ["أهلًا بيك في جوجا.", "أهلًا وسهلًا في جوجا."]
      ar: ["أهلًا وسهلًا بك في جوغجا.", "مرحبًا بك في جوغجا."]
      en: ["Welcome to Jogja.", "Welcome, you've arrived in Jogja."]
next:
  ar_eg: پاك هارجو بيبعت كريم سوق كرانجان عند بو سيتي، بيّاعة الفاكهة. أول امتحان - «kula» و«sampeyan» ولّا «panjenengan»؟
  ar: يرسل باك هارجو كريمًا إلى سوق كرانغان عند بو سيتي، بائعة الفاكهة. الامتحان الأوّل - «kula» و«sampeyan» أم «panjenengan»؟
  en: Pak Harjo sends Karim to Pasar Kranggan, to Bu Siti the fruit seller. First test - "kula" and "sampeyan", or "panjenengan"?
review:
  status: draft
  verified: false
  notes: Speech-level triplet (kowe wis mangan / sampeyan sampun nedha / panjenengan sampun dhahar) follows the j3.u01 lessons. Pak Harjo's krama to a young guest is deliberate politeness; check "kula wucal" (I'll teach).
