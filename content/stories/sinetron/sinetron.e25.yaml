title:
  target: Buku Harian Pak Budi
  ar_eg: يوميات پاك بودي
  ar: يوميّات باك بودي
  en: Pak Budi's Diary
summary:
  ar_eg: پاك بودي بيكتب يوميّاته عشان صحّته، وبايو بيكتشف إن اليوميات مش صريحة قوي في موضوع البلح المقلي. وفي القاهرة، كريم بيحكي أسبوعه الأول بعد ما رجع.
  ar: يكتب باك بودي يوميّاته من أجل صحّته، ويكتشف بايو أنها ليست صادقة تمامًا في مسألة الموز المقلي. وفي القاهرة يروي كريم أسبوعه الأول بعد العودة.
  en: Pak Budi keeps a diary for his health, and Bayu discovers it isn't entirely honest about the fried bananas. In Cairo, Karim recounts his first week back.
cast: [Pak Budi, Bayu, Bu Rahayu, Karim, Nadia, Sari]
scenes:
  - setting:
      ar_eg: ماديون، الجمعة بالليل. پاك بودي قاعد على الترابيزة ومعاه كشكول صغيّر مكتوب عليه «Buku Harian».
      ar: ماديون، مساء الجمعة. يجلس باك بودي إلى الطاولة ومعه دفتر صغير كُتب عليه «Buku Harian».
      en: Madiun, Friday evening. Pak Budi sits at the table with a small notebook labelled "Buku Harian".
    lines:
      - speaker: Narrator
        text: Dokter Wulan menyuruh Pak Budi menulis buku harian. Setiap malam, dia mencatat kegiatannya.
        ar_eg: الدكتورة وولان قالت لپاك بودي يكتب يوميّات. كل ليلة بيكتب هو عمل إيه.
        ar: طلبت الدكتورة وولان من باك بودي أن يكتب يوميّات، فهو يدوّن أنشطته كل ليلة.
        en: Dokter Wulan told Pak Budi to keep a diary. Every night, he writes down what he did.
      - speaker: Pak Budi
        text: Senin. Saya bangun jam lima. Sesudah salat subuh, saya jalan kaki tiga puluh menit dengan Bayu.
        ar_eg: الاتنين. صحيت الساعة ٥. بعد صلاة الفجر، اتمشّيت نص ساعة مع بايو.
        ar: الاثنين. استيقظت في الخامسة. بعد صلاة الفجر مشيت ثلاثين دقيقة مع بايو.
        en: Monday. I got up at five. After the dawn prayer, I walked for thirty minutes with Bayu.
      - speaker: Pak Budi
        text: Lalu saya menyapu halaman, dan Bu Rahayu menjemur pakaian. Siang, saya makan pecel sehat dan minum obat.
        ar_eg: وبعدين كنست الحوش، وبو راهايو نشرت الغسيل. الضهر، كلت پيتشل صحّي وخدت الدوا.
        ar: ثم كنست الفناء، ونشرت بو راهايو الغسيل. وفي الظهر أكلت بيتشل صحّيًّا وتناولت الدواء.
        en: Then I swept the yard, and Bu Rahayu hung out the washing. At midday, I ate healthy pecel and took my medicine.
        note:
          ar_eg: الأفعال اللي بتاخد مفعول بتبدأ غالبًا بـ meN- - menyapu (يكنس) من sapu (مقشّة)، menjemur (ينشر في الشمس) من jemur. في اليوميات بنحكي بالترتيب - lalu، siang، malam.
          ar: الأفعال المتعدّية تبدأ غالبًا بـ meN- - menyapu (يكنس) من sapu (مكنسة)، وmenjemur (ينشر في الشمس) من jemur. وفي اليوميّات نروي بالترتيب - lalu، siang، malam.
          en: Verbs that take an object usually start with meN- — menyapu (sweep) from sapu (broom), menjemur (dry in the sun) from jemur. A diary goes in order — lalu, siang, malam.
      - speaker: Pak Budi
        text: Kamis. Saya membelikan Bu Rahayu bunga melati di pasar.
        ar_eg: الخميس. اشتريت لبو راهايو فُل من السوق.
        ar: الخميس. اشتريت لبو راهايو زهور الياسمين من السوق.
        en: Thursday. I bought Bu Rahayu some jasmine at the market.
        note:
          ar_eg: membelikan = «يشتري لحدّ». الفعل هنا بياخد مفعولين - membelikan Bu Rahayu (لمين) bunga (إيه). زي «اشتريت لماما ورد».
          ar: membelikan تعني «يشتري لشخص». يأخذ الفعل هنا مفعولين - membelikan Bu Rahayu (لمن) bunga (ماذا).
          en: 'membelikan = "buy for someone". It takes two objects: membelikan Bu Rahayu (who for) bunga (what).'
      - speaker: Bu Rahayu
        text: Melati? Pantesan Bapak senyum-senyum terus hari Kamis.
        ar_eg: فُل؟ عشان كده كنت مبتسم كده يوم الخميس.
        ar: ياسمين؟ لهذا كنتَ تبتسم يوم الخميس.
        en: Jasmine? No wonder you were all smiles on Thursday.
        note:
          ar_eg: اليوميات مكتوبة بالإندونيسي الرسمي، بس الكلام حواليها عادي. pantesan = pantas (عشان كده!)، وsenyum-senyum = «يبتسم ويبتسم». وmelati = فُل / ياسمين.
          ar: اليوميّات مكتوبة بالفصحى، أمّا الحديث حولها فعامّي. pantesan = pantas (لا عجب!)، وsenyum-senyum = «يبتسم مرارًا». وmelati = الياسمين.
          en: The diary is written in standard Indonesian; the talk around it is everyday speech. pantesan = pantas (no wonder!), senyum-senyum = smiling away. melati = jasmine.
      - speaker: Bayu
        text: Lho, Pak, di sini tulisannya, "Selasa, saya makan satu pisang goreng." Satu?
        ar_eg: بابا، هنا مكتوب «التلات، كلت صباع موز مقلي واحد». واحد؟
        ar: أبي، مكتوب هنا «الثلاثاء، أكلت موزة مقلية واحدة». واحدة؟
        en: Dad, it says here, "Tuesday, I ate one fried banana." One?
      - speaker: Pak Budi
        text: Hmm... satu. Satu piring.
        ar_eg: امم... واحد. طبق واحد.
        ar: همم... واحدة. طبق واحد.
        en: Hmm... one. One plate.
      - speaker: Bu Rahayu
        text: Pak! Buku harian itu harus jujur. Nanti Dokter Wulan baca, lho!
        ar_eg: يا بودي! اليوميات لازم تبقى صريحة. الدكتورة وولان هتقراها!
        ar: يا بودي! يجب أن تكون اليوميّات صادقة. ستقرؤها الدكتورة وولان!
        en: Pak! A diary has to be honest. Dokter Wulan is going to read it!
        note:
          ar_eg: baca = membaca (يقرا)، وnanti … baca = «هتقرا» - في الكلام بنقول nanti بدل akan. وharian = يومي.
          ar: baca = membaca (يقرأ)، وnanti … baca = «ستقرأ» - في الكلام يقال nanti بدل akan. وharian = يومي.
          en: baca = membaca (read); nanti … baca = "will read" — in speech nanti often does the job of akan. harian = daily.
  - setting:
      ar_eg: القاهرة، السبت. كريم ونادية وساري على مكالمة فيديو مع ماديون. كريم لسه بيفضّي الشنط في شقّته الجديدة.
      ar: القاهرة، السبت. كريم ونادية وساري في اتصال مرئي مع ماديون. ما زال كريم يفرغ حقائبه في شقّته الجديدة.
      en: Cairo, Saturday. Karim, Nadia and Sari are on a video call with Madiun. Karim is still unpacking in his new flat.
    lines:
      - speaker: Pak Budi
        text: Mas Karim, gimana minggu pertama di Kairo?
        ar_eg: يا ماس كريم، أول أسبوع في القاهرة كان عامل إزاي؟
        ar: يا ماس كريم، كيف كان أسبوعك الأول في القاهرة؟
        en: Mas Karim, how was your first week in Cairo?
      - speaker: Karim
        text: Sibuk banget, Pak! Hari Minggu saya cari apartemen. Hari Senin saya tanda tangan kontrak kerja di kantor baru.
        ar_eg: مشغول أوي يا پاك! يوم الحد دوّرت على شقّة. يوم الاتنين مضيت عقد الشغل في المكتب الجديد.
        ar: مشغول جدًّا يا باك! يوم الأحد بحثت عن شقّة، ويوم الاثنين وقّعت عقد العمل في المكتب الجديد.
        en: Really busy, Pak! On Sunday I looked for a flat. On Monday I signed my work contract at the new office.
        note:
          ar_eg: كريم بيحكي بأفعال من غير me- زي الكلام العادي - cari = mencari (يدوّر)، وtanda tangan = menandatangani (يمضي). وkontrak = عقد. في مصر الحد أول يوم شغل في الأسبوع، والجمعة والسبت الويكند. في إندونيسيا الويكند السبت والحد.
          ar: يروي كريم بأفعال بلا me- كما في الكلام - cari = mencari (يبحث)، وtanda tangan = menandatangani (يوقّع). وkontrak = عقد. في مصر يوم الأحد أوّل أيام العمل، والجمعة والسبت عطلة. أمّا في إندونيسيا فالعطلة السبت والأحد.
          en: Karim talks with bare verbs, as people do — cari = mencari (look for), tanda tangan = menandatangani (sign). kontrak = contract. In Egypt, Sunday is the first working day and the weekend is Friday and Saturday. In Indonesia the weekend is Saturday and Sunday.
      - speaker: Karim
        text: Selasa sampai Kamis, saya ikut pelatihan pemandu wisata. Kantor kasih saya buku tebal tentang sejarah Kairo.
        ar_eg: من التلات للخميس، حضرت تدريب للمرشدين السياحيين. والمكتب إدّاني كتاب تخين عن تاريخ القاهرة.
        ar: من الثلاثاء إلى الخميس حضرت تدريبًا للمرشدين السياحيين، وأعطاني المكتب كتابًا سميكًا عن تاريخ القاهرة.
        en: From Tuesday to Thursday I did a tour-guide training course. The office gave me a thick book on the history of Cairo.
        note:
          ar_eg: kasih saya buku = memberi saya buku = «إدّاني كتاب» - الشخص الأول وبعدين الحاجة، وkasih هي اللي بتتقال في الكلام. وpelatihan = تدريب. وsejarah (تاريخ) جاية من العربي «شجرة»، زي شجرة العيلة.
          ar: kasih saya buku = memberi saya buku أي «أعطاني كتابًا» - الشخص أولًا ثم الشيء، وkasih هي المستعملة في الكلام. وpelatihan = تدريب. وsejarah (التاريخ) من العربية «شجرة»، أي شجرة النسب.
          en: kasih saya buku = memberi saya buku = "gave me a book" — person first, then the thing; kasih is the everyday verb. pelatihan = training. sejarah (history) comes from Arabic شجرة (tree), as in family tree.
      - speaker: Nadia
        text: Terus hari Jumat, dia nemenin Hagga Fatma ke pasar. Hagga nawar harga tomat satu jam!
        ar_eg: ويوم الجمعة راح مع الحاجّة فاطمة السوق. والحاجّة فضلت تفاصل في سعر الطماطم ساعة كاملة!
        ar: ويوم الجمعة رافق الحاجّة فاطمة إلى السوق، فساومت الحاجّة على سعر الطماطم ساعة كاملة!
        en: And on Friday he went to the market with Hagga Fatma. Hagga haggled over the price of tomatoes for an hour!
        note:
          ar_eg: nemenin = menemani (يروح مع حدّ)، وnawar = menawar (يفاصل) - الشارع بيشيل me- وبيحوّل ‎-i لـ ‎-in. وterus = lalu (وبعدين).
          ar: nemenin = menemani (يرافق)، وnawar = menawar (يساوم) - تسقط me- في الكلام وتصير ‎-i إلى ‎-in. وterus = lalu (ثمّ).
          en: nemenin = menemani (keep someone company), nawar = menawar (haggle) — speech drops me- and turns -i into -in. terus = lalu (then).
      - speaker: Karim
        text: Hari ini saya bantu Nadia cari baju buat wisudanya. Itu yang paling capek!
        ar_eg: والنهارده ساعدت نادية تدوّر على لبس للتخرّج. ودي كانت أتعب حاجة!
        ar: واليوم ساعدت نادية في البحث عن ملابس لحفل تخرّجها، وكان ذلك الأكثر إرهاقًا!
        en: Today I helped Nadia look for an outfit for her graduation. That was the most tiring part!
      - speaker: Nadia
        text: Kami keliling tujuh toko, Pak. Eh, akhirnya saya beli baju di toko yang pertama.
        ar_eg: لفّينا على سبع محلّات يا پاك. وفي الآخر اشتريت اللبس من أول محل.
        ar: زرنا سبعة متاجر يا باك. لكنني في النهاية اشتريت الملابس من المتجر الأول.
        en: We visited seven shops, Pak. But in the end I bought the outfit from the first one.
        note:
          ar_eg: keliling = يلفّ على (أسهل من mengunjungi في الكلام)، وbeli = membeli. وeh = «إيه رأيك…!» للمفاجأة.
          ar: keliling = يطوف على (أبسط من mengunjungi في الكلام)، وbeli = membeli. وeh للتعبير عن مفاجأة طريفة.
          en: keliling = go round (simpler than mengunjungi in speech), beli = membeli. eh = "and guess what".
      - speaker: Sari
        text: Pak, Mas Karim juga harus nulis buku harian, dong. Tapi yang jujur, ya!
        ar_eg: بابا، ماس كريم كمان لازم يكتب يوميّات. بس بصراحة، ماشي؟
        ar: أبي، يجب على ماس كريم أيضًا أن يكتب يوميّات. لكن بصدق!
        en: Dad, Mas Karim should keep a diary too. An honest one, though!
        note:
          ar_eg: nulis = menulis (يكتب) في الكلام، وbuku harian = يوميّات.
          ar: nulis = menulis (يكتب) في الكلام، وbuku harian = يوميّات.
          en: nulis = menulis (write) in speech; buku harian = diary.
      - speaker: Pak Budi
        text: Iya, jujur. Satu pisang goreng... satu piring.
        ar_eg: آه، بصراحة. صباع موز مقلي واحد... طبق واحد.
        ar: نعم، بصدق. موزة مقلية واحدة... طبق واحد.
        en: Yes, honest. One fried banana... one plate.
