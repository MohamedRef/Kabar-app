questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: پاك بودي عمل إيه يوم الاتنين بعد صلاة الفجر؟
      ar: ماذا فعل باك بودي يوم الاثنين بعد صلاة الفجر؟
      en: What did Pak Budi do on Monday after the dawn prayer?
    options: ["Dia jalan kaki dengan Bayu.", "Dia ke pasar dengan Bu Rahayu.", "Dia makan pisang goreng.", "Dia menjemur pakaian."]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Kamis. Saya ___ Bu Rahayu bunga melati di pasar.
    meaning:
      ar_eg: الخميس. اشتريت لبو راهايو فُل من السوق.
      ar: الخميس. اشتريت لبو راهايو زهور الياسمين من السوق.
      en: Thursday. I bought Bu Rahayu some jasmine at the market.
    answers: [membelikan]
    options: ["menyapu", "membelikan", "menemani"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: كريم عمل إيه من التلات للخميس؟
      ar: ماذا فعل كريم من الثلاثاء إلى الخميس؟
      en: What did Karim do from Tuesday to Thursday?
    options: ["Dia mencari apartemen.", "Dia membeli baju wisuda.", "Dia ikut pelatihan pemandu wisata."]
    answer: 2
  - id: q04
    type: listen
    text: Kami keliling tujuh toko, tapi akhirnya saya beli baju di toko yang pertama.
    question:
      ar_eg: نادية اشترت لبس التخرّج منين؟
      ar: من أين اشترت نادية ملابس التخرّج؟
      en: Where did Nadia buy her graduation outfit?
    options: ["dari toko ketujuh", "dari toko pertama", "dari pasar dengan Hagga Fatma"]
    answer: 1
    meaning:
      ar_eg: لفّينا على سبع محلّات، بس في الآخر اشتريت اللبس من أول محل.
      ar: زرنا سبعة متاجر، لكنني في النهاية اشتريت الملابس من المتجر الأول.
      en: We visited seven shops, but in the end I bought the outfit from the first one.
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المكتب إدّاني كتاب.
      ar: أعطاني المكتب كتابًا.
      en: The office gave me a book.
    answers: ["Kantor kasih saya buku.", "Kantor kasih saya buku", "Kantor kasih aku buku.", "Kantor memberi saya buku.", "Kantor memberi saya buku", "Kantor memberi saya sebuah buku.", "Kantor memberikan saya buku.", "Kantor memberikan buku kepada saya.", "Kantor memberi buku kepada saya.", "Kantor memberi aku buku.", "Kantor memberiku buku.", "Kantor memberikan sebuah buku kepada saya."]
next:
  ar_eg: المية قطعت في عمارة الحاجّة فاطمة… للمرة التالتة الأسبوع ده! والحاجّة قرّرت تكتب شكوى رسمية. وفي ماديون، بايو كمان عنده شكوى.
  ar: انقطعت المياه في عمارة الحاجّة فاطمة… للمرة الثالثة هذا الأسبوع! فقرّرت الحاجّة كتابة شكوى رسمية. وفي ماديون لدى بايو شكوى أيضًا.
  en: The water's off in Hagga Fatma's building… for the third time this week! Hagga decides to write a formal complaint. And in Madiun, Bayu has a complaint of his own.
