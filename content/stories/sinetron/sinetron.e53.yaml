title:
  target: Bulat Kata karena Mufakat
  ar_eg: الكلمة بتكمل بالاتفاق
  ar: الكلمة تكتمل بالتوافق
  en: A Word Made Whole by Agreement
summary:
  ar_eg: العيلتين بيخطّطوا لفرح جاوي مصري. بو راهايو عايزة سيرامان وپانجيه، وبو سامية عايزة ليلة حنّة وزفّة. كريم بيقول مثل عن احترام عادات البلد، وبو راهايو بتردّ بمثل عن الاتفاق. وبايو من بوكيتينجي بيورّيهم إزاي العادة والدين بيتقابلوا عند المينانجكاباو.
  ar: تخطّط الأسرتان لعرس جاوي مصري. تريد بو راهايو السيرامان والبانغيه، وتريد بو سامية ليلة الحنّاء والزفّة. يذكر كريم مثلًا عن احترام عادات البلد، فتردّ بو راهايو بمثل عن التوافق. ومن بوكيتينغي يريهم بايو كيف تلتقي العادة بالشرع عند المينانغكاباو.
  en: The two families plan a Javanese-Egyptian wedding. Bu Rahayu wants a siraman and a panggih; Bu Samia wants a henna night and a zaffa. Karim quotes a proverb about following local custom, and Bu Rahayu answers with one about agreement. From Bukittinggi, Bayu shows them how custom and faith meet among the Minangkabau.
cast: [Bu Rahayu, Nadia, Sari, Bu Samia, Karim, Pak Budi, Bayu, Pak Mahmoud]
scenes:
  - setting:
      ar_eg: تلات أيام بعد الخطوبة. ترابيزة السفرة في بيت پاك بودي، وعليها شاي وليستتين طوال.
      ar: بعد الخطبة بثلاثة أيام. مائدة الطعام في بيت باك بودي، وعليها شاي وقائمتان طويلتان.
      en: Three days after the proposal. The dining table at Pak Budi's house, with tea and two long lists.
    lines:
      - speaker: Narrator
        text: Di meja makan ada dua daftar panjang. Yang satu ditulis Bu Rahayu dalam bahasa Indonesia, yang lain ditulis Bu Samia dalam bahasa Arab.
        ar_eg: على ترابيزة السفرة فيه ليستتين طوال. واحدة كتبتها بو راهايو بالإندونيسي، والتانية كتبتها بو سامية بالعربي.
        ar: على مائدة الطعام قائمتان طويلتان؛ كتبت بو راهايو إحداهما بالإندونيسية، وكتبت بو سامية الأخرى بالعربية.
        en: On the dining table are two long lists. One was written by Bu Rahayu in Indonesian, the other by Bu Samia in Arabic.
      - speaker: Bu Rahayu
        text: Pertama, siraman. Sehari sebelum akad, Sari dimandikan dengan air kembang oleh orang tua dan para sesepuh.
        ar_eg: أولًا، السيرامان. قبل كتب الكتاب بيوم، أهل ساري والكبار بيحمّوها بمية فيها ورد.
        ar: أولًا، السيرامان. قبل عقد القران بيوم يغسل الوالدان والشيوخ ساري بماء فيه زهور.
        en: First, the siraman. The day before the marriage contract, Sari is bathed in flower water by her parents and the elders.
        note:
          ar_eg: siraman (من siram = يرشّ) طقس جاوي - الأهل والكبار بيصبّوا على العروسة مية فيها ورد بسبع ألوان (kembang setaman). المعنى إنها تبدأ حياتها الجديدة نضيفة من جوّه وبرّه، وبدعوات الكبار.
          ar: siraman (من siram أي يرشّ) طقس جاوي يصبّ فيه الأهل والشيوخ على العروس ماءً فيه زهور متنوّعة (kembang setaman)، رمزًا لبدء حياتها الجديدة طاهرة ظاهرًا وباطنًا وبدعاء الكبار.
          en: siraman (from siram, to pour) is a Javanese rite - parents and elders pour flower water (kembang setaman) over the bride, so she begins her new life cleansed inside and out, carried by her elders' prayers.
      - speaker: Nadia
        text: Ibu saya bilang, di Mesir ada malam hena. Teman-teman perempuan berkumpul dan menyanyi, lalu tangan pengantin dihias dengan hena.
        ar_eg: ماما بتقول إن في مصر فيه ليلة الحنّة. صحاب العروسة البنات بيتجمّعوا ويغنّوا، وإيدين العروسة بتتنقش بالحنّة.
        ar: تقول أمي إنّ في مصر ليلة الحنّاء؛ تجتمع صديقات العروس ويغنّين، وتُزيَّن يدا العروس بالحنّاء.
        en: My mother says in Egypt there's a henna night. The bride's girlfriends gather and sing, and her hands are decorated with henna.
      - speaker: Sari
        text: Kalau begitu, malam hena bisa digabung dengan malam midodareni! Di malam sebelum akad itu, pengantin perempuan juga tinggal di rumah dan ditemani keluarganya.
        ar_eg: يبقى ليلة الحنّة ممكن نجمعها مع ليلة الميدوداريني! في الليلة اللي قبل كتب الكتاب، العروسة برضه بتقعد في البيت وأهلها معاها.
        ar: إذن يمكن جمع ليلة الحنّاء مع ليلة الميدوداريني! ففي الليلة السابقة للعقد تبقى العروس أيضًا في البيت ويرافقها أهلها.
        en: Then the henna night can be combined with midodareni night! On the night before the contract, the bride also stays at home with her family around her.
      - speaker: Bu Samia
        text: Dan zaffa... harus ada!
        ar_eg: والزفّة... لازم تبقى موجودة!
        ar: والزفّة... لا بدّ منها!
        en: And the zaffa... we must have one!
      - speaker: Karim
        text: Zaffa itu arak-arakan, Pak, Bu. Ada tabla, ada mizmar, dan semua orang menari mengantar pengantin. Suaranya... cukup keras.
        ar_eg: الزفّة دي موكب يا پاك يا بو. فيه طبلة ومزمار، والكل بيرقص وهو بيزفّ العرسان. وصوتها... عالي شوية.
        ar: الزفّة موكب يا باك ويا بو؛ فيها الطبلة والمزمار، ويرقص الجميع وهم يزفّون العروسين. وصوتها... عالٍ بعض الشيء.
        en: A zaffa is a procession, Pak, Bu. There's tabla and mizmar, and everyone dances as they lead the couple in. It's... fairly loud.
      - speaker: Pak Budi
        text: Cukup keras itu seberapa keras, Mas?
        ar_eg: عالي شوية يعني قدّ إيه يا ماس؟
        ar: عالٍ بعض الشيء، أي إلى أيّ حدّ يا ماس؟
        en: Fairly loud meaning how loud, Mas?
      - speaker: Nadia
        text: Satu gang bisa ikut menari, Pak.
        ar_eg: الحارة كلّها ممكن ترقص معاها يا پاك.
        ar: قد يرقص الزقاق كلّه معها يا باك.
        en: The whole lane might end up dancing, Pak.
      - speaker: Bu Rahayu
        text: Lalu panggih. Pengantin laki-laki menginjak telur, lalu pengantin perempuan membasuh kakinya.
        ar_eg: بعد كده البانجيه. العريس يدوس على بيضة، والعروسة تغسل رجله.
        ar: ثمّ البانغيه؛ يدوس العريس بيضة، ثمّ تغسل العروس قدمه.
        en: Then the panggih. The groom steps on an egg, and the bride washes his foot.
      - speaker: Nadia
        text: Ibu saya bertanya, kenapa telurnya diinjak? Sayang, kan?
        ar_eg: ماما بتسأل - ليه يدوسوا على البيضة؟ خسارة، مش كده؟
        ar: تسأل أمي - لماذا تُداس البيضة؟ أليس ذلك هدرًا؟
        en: My mother asks why the egg gets stepped on. Isn't it a waste?
      - speaker: Bu Rahayu
        text: Itu lambang, Bu. Telur yang pecah artinya mereka siap punya keturunan. Air di kaki artinya istri menghormati suami, dan suami berjanji menjaga istrinya.
        ar_eg: دي رموز يا ستّ سامية. البيضة اللي بتتكسر معناها إنهم جاهزين يبقى عندهم ذرّية. والمية على الرجل معناها إن الزوجة بتقدّر جوزها، والجوز بيوعد إنه يحافظ عليها.
        ar: إنها رموز يا سيّدتي. البيضة المكسورة تعني استعدادهما للذرّية، والماء على القدم يعني أنّ الزوجة توقّر زوجها، وأنّ الزوج يعِد بحمايتها.
        en: It's symbolic, Bu. The broken egg means they're ready to have children. The water on his foot means the wife honours her husband, and he promises to look after her.
      - speaker: Karim
        text: Saya pernah membaca peribahasa, "Di mana bumi dipijak, di situ langit dijunjung." Kami di Jawa, jadi kami ikut adat Jawa saja.
        ar_eg: أنا قريت مرة مثل بيقول - «مطرح ما بتدوس على الأرض، ارفع سماها.» احنا في جاوة، يبقى نمشي على العادات الجاوية وخلاص.
        ar: قرأت مرّة مثلًا يقول - «حيثما وطئتَ أرضًا فاحمل سماءها.» نحن في جاوة، فلنتّبع العادات الجاوية فحسب.
        en: I once read a proverb, "Wherever you tread the earth, there you hold up its sky." We're in Java, so we'll just follow Javanese custom.
        note:
          ar_eg: peribahasa يعني مثل شعبي. والمثل ده معناه احترم عادات المكان اللي انت فيه - زي «يا غريب كون أديب». وadat أصلها عربي، من «عادة».
          ar: peribahasa تعني المثل السائر. ومعنى هذا المثل أن تحترم عادات المكان الذي تحلّ فيه، كقولهم «يا غريب كن أديبًا». وأصل adat عربي من «عادة».
          en: A peribahasa is a proverb. This one means respect the customs of wherever you are - "when in Rome". adat (custom) comes from Arabic عادة.
      - speaker: Bu Rahayu
        text: Mas Karim baik sekali. Tapi ada peribahasa lain, "Bulat air karena pembuluh, bulat kata karena mufakat." Kita putuskan bersama, ya.
        ar_eg: انت ذوق أوي يا ماس كريم. بس فيه مثل تاني بيقول - «المية بتاخد شكل الماسورة، والكلمة بتكمل بالاتفاق.» نقرّر مع بعض بقى.
        ar: ما أطيبك يا ماس كريم. لكنّ هناك مثلًا آخر - «يستدير الماء بالأنبوب، وتكتمل الكلمة بالتوافق.» فلنقرّر معًا.
        en: That's very kind, Mas Karim. But there's another proverb, "Water is shaped by its pipe, a word is made whole by agreement." Let's decide together.
        note:
          ar_eg: mufakat من العربي «موافقة» - ومعناها في الإندونيسي القرار اللي الكل بيتّفق عليه. وmusyawarah untuk mufakat (من «مشاورة») مبدأ مهمّ جدًا في الثقافة الإندونيسية.
          ar: mufakat من العربية «موافقة»، وتعني في الإندونيسية القرار الذي يُجمع عليه الكلّ. وmusyawarah untuk mufakat (من «مشاورة») مبدأ أساسي في الثقافة الإندونيسية.
          en: mufakat comes from Arabic موافقة and means a decision everyone agrees on. musyawarah untuk mufakat, "deliberation to reach consensus" (from مشاورة), is a core Indonesian principle.
  - setting:
      ar_eg: نفس الليلة. بايو بيكلّمهم فيديو من بوكيتينجي في سومطرة الغربية، من قدّام بيت خشب كبير سقفه مدبّب زي قرون الجاموس.
      ar: الليلة نفسها. يتّصل بايو بالفيديو من بوكيتينغي في سومطرة الغربية، واقفًا أمام بيت خشبي كبير سقفه مدبّب كقرون الجاموس.
      en: That evening. Bayu video-calls from Bukittinggi in West Sumatra, standing in front of a big wooden house whose roof curves up like buffalo horns.
    lines:
      - speaker: Bayu
        text: Assalamualaikum! Aku di Bukittinggi, di kampung temanku. Rumah ini namanya rumah gadang. Rumah ini milik ibu temanku, bukan milik ayahnya.
        ar_eg: السلام عليكم! أنا في بوكيتينجي، في بلد صاحبي. البيت ده اسمه رومه جادانج. والبيت ده بتاع أمّ صاحبي، مش بتاع أبوه.
        ar: السلام عليكم! أنا في بوكيتينغي، في قرية صديقي. يُسمّى هذا البيت «رومه غادانغ»، وهو ملك لأمّ صديقي لا لأبيه.
        en: Assalamualaikum! I'm in Bukittinggi, in my friend's home village. This house is called a rumah gadang. It belongs to my friend's mother, not his father.
        note:
          ar_eg: المينانجكاباو في سومطرة الغربية من أكبر المجتمعات الأمومية في العالم - البيت والأرض بيتورّثوا من الأمّ لبنتها، والعيلة بتتنسب للأمّ. ومع ده هم مسلمين متديّنين جدًا.
          ar: المينانغكاباو في سومطرة الغربية من أكبر المجتمعات الأمومية في العالم؛ يُورَّث البيت والأرض من الأمّ إلى ابنتها ويُنسب الأولاد إلى عشيرة الأمّ، وهم مع ذلك مسلمون شديدو التديّن.
          en: The Minangkabau of West Sumatra are among the world's largest matrilineal societies - house and land pass from mother to daughter, and children belong to the mother's clan. They are also devoutly Muslim.
      - speaker: Pak Budi
        text: Milik ibunya? Bu, bagaimana kalau warung kita juga...
        ar_eg: بتاع الأمّ؟ يا رهايو، إيه رأيك لو الوارونج بتاعنا كمان...
        ar: ملك الأمّ؟ يا رهايو، ما رأيك لو كان الوارونغ أيضًا...
        en: The mother's? Dear, what if our warung was also...
      - speaker: Bu Rahayu
        text: Warung itu memang sudah milik Ibu, Pak. Bapak saja yang belum tahu.
        ar_eg: ما الوارونج أصلًا بتاعي يا بودي. انت بس اللي متعرفش.
        ar: الوارونغ ملكي أصلًا يا باك. أنت وحدك من لا يعلم.
        en: The warung's been mine all along, Pak. You just hadn't noticed.
      - speaker: Bayu
        text: Orang Minang punya pepatah, "Adat basandi syarak, syarak basandi Kitabullah." Adat bersendi syariat, syariat bersendi Al-Qur'an.
        ar_eg: المينانج عندهم مثل - «العادة قايمة على الشرع، والشرع قايم على كتاب الله.»
        ar: للمينانغ قول مأثور - «العادة تقوم على الشرع، والشرع يقوم على كتاب الله.»
        en: The Minang have a saying, "Custom rests on sharia, sharia rests on the Book of God."
        note:
          ar_eg: الجملة دي مليانة عربي - adat (عادة)، syarak (شرع)، Kitabullah (كتاب الله). وbasandi كلمة مينانج معناها bersendi، يعني «قايم على» أو «متركّب على».
          ar: هذه العبارة زاخرة بالعربية - adat (عادة) وsyarak (شرع) وKitabullah (كتاب الله). وbasandi لفظ مينانغي بمعنى bersendi، أي «قائم على».
          en: 'The saying is full of Arabic: adat (عادة), syarak (شرع), Kitabullah (كتاب الله). basandi is Minang for bersendi, "is founded on".'
      - speaker: Nadia
        text: Di Mesir juga begitu. Banyak adat pernikahan kami tidak berasal dari agama, tapi juga tidak bertentangan dengan agama.
        ar_eg: وفي مصر برضه كده. عادات جواز كتير عندنا مش جاية من الدين، بس كمان مش ضدّ الدين.
        ar: والأمر كذلك في مصر؛ فكثير من عادات زواجنا لم تأتِ من الدين، لكنها لا تتعارض معه أيضًا.
        en: It's the same in Egypt. Many of our wedding customs don't come from religion, but they don't go against it either.
      - speaker: Karim
        text: Jadi intinya sama. Akad nikahnya sesuai syariat. Adatnya boleh dua-duanya.
        ar_eg: يبقى الأساس واحد. كتب الكتاب على الشرع. والعادات ينفع الاتنين.
        ar: إذن الجوهر واحد. عقد القران وفق الشرع، والعادات يمكن أن تكون من الجانبين.
        en: So at heart it's the same. The marriage contract follows sharia. The customs can be both.
      - speaker: Sari
        text: Jadi rencananya begini. Siraman di pagi hari, malamnya midodareni dengan hena. Besoknya akad nikah, lalu panggih, dan zaffa mengantar kami ke pelaminan.
        ar_eg: يبقى الخطّة كده - السيرامان الصبح، وبالليل الميدوداريني مع الحنّة. وتاني يوم كتب الكتاب، وبعدين البانجيه، والزفّة توصّلنا للكوشة.
        ar: إذن الخطّة كالتالي - السيرامان صباحًا، وفي المساء الميدوداريني مع الحنّاء. وفي الغد عقد القران، ثمّ البانغيه، ثمّ تزفّنا الزفّة إلى منصّة العروسين.
        en: So here's the plan. Siraman in the morning, midodareni with henna that night. The next day the contract, then panggih, and the zaffa leads us to the bridal dais.
      - speaker: Bu Samia
        text: Pelaminan... apa itu?
        ar_eg: پيلامينان... يعني إيه؟
        ar: بيلامينان... ما هي؟
        en: Pelaminan... what is that?
      - speaker: Nadia
        text: Kursi pengantin di atas panggung, Bu. Kata orang Indonesia, pengantin itu raja dan ratu sehari.
        ar_eg: دي الكوشة يا ماما، كراسي العرسان على المسرح. والإندونيسيين بيقولوا العرسان ملك وملكة ليوم واحد.
        ar: إنها منصّة العروسين يا أمي، كرسيّاهما على المسرح. ويقول الإندونيسيون إنّ العروسين ملك وملكة ليوم واحد.
        en: It's the couple's seats up on the stage, Mama. Indonesians say a bride and groom are king and queen for a day.
      - speaker: Pak Budi
        text: Lalu makanannya? Pecel harus ada.
        ar_eg: وطب الأكل؟ البيچيل لازم يبقى موجود.
        ar: وماذا عن الطعام؟ لا بدّ من البيتشيل.
        en: And the food? There has to be pecel.
      - speaker: Bu Samia
        text: Fatta... harus ada!
        ar_eg: الفتّة... لازم تبقى موجودة!
        ar: الفتّة... لا بدّ منها!
        en: Fatta... there has to be fatta!
      - speaker: Karim
        text: Berat sama dipikul, ringan sama dijinjing, Pak. Pecel dan fatta, dua-duanya.
        ar_eg: الحمل التقيل نشيله سوا، والخفيف نشيله سوا يا پاك. بيچيل وفتّة، الاتنين.
        ar: الثقيل نحمله معًا والخفيف نحمله معًا يا باك. البيتشيل والفتّة، كلاهما.
        en: Heavy loads we carry together, light ones we carry together, Pak. Pecel and fatta, both.
        note:
          ar_eg: «Berat sama dipikul, ringan sama dijinjing» مثل معناه نتشارك في الصعب والسهل - زي «إيد لوحدها متسقّفش». وpikul يعني تشيل على كتفك، وjinjing يعني تشيل في إيدك.
          ar: «Berat sama dipikul, ringan sama dijinjing» مثل معناه التشارك في الشدّة والرخاء، كقولنا «يد واحدة لا تصفّق». وpikul الحمل على الكتف، وjinjing الحمل باليد.
          en: '"Berat sama dipikul, ringan sama dijinjing" means sharing the hard and the easy alike. pikul is carrying on your shoulder; jinjing is carrying in your hand.'
      - speaker: Pak Mahmoud
        text: Dan zaffa!
        ar_eg: والزفّة!
        ar: والزفّة!
        en: And the zaffa!
      - speaker: Narrator
        text: Semua tertawa. Untuk pertama kalinya, dua daftar itu menjadi satu.
        ar_eg: الكل ضحك. ولأوّل مرة، الليستتين بقوا ليستة واحدة.
        ar: ضحك الجميع. ولأوّل مرة صارت القائمتان قائمة واحدة.
        en: Everyone laughs. For the first time, the two lists become one.
new_words:
