questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي بيحصل في ليلة الحنّة في مصر حسب نادية؟
      ar: ماذا يحدث في ليلة الحنّاء في مصر بحسب نادية؟
      en: According to Nadia, what happens on an Egyptian henna night?
    options: ["Pengantin laki-laki menginjak telur.", "Pengantin dimandikan dengan air kembang.", "Semua orang menari di jalan.", "Teman-teman perempuan menyanyi dan tangan pengantin dihias hena."]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Di mana bumi dipijak, di situ ___ dijunjung.
    meaning:
      ar_eg: مطرح ما بتدوس على الأرض، ارفع سماها.
      ar: حيثما وطئتَ أرضًا فاحمل سماءها.
      en: Wherever you tread the earth, there you hold up its sky.
    answers: [langit]
    options: ["adat", "langit", "kepala"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: (استنتاج) بو راهايو كانت تقصد إيه لما قالت «الوارونج أصلًا بتاعي»؟
      ar: (استنتاج) ماذا قصدت بو راهايو بقولها «الوارونغ ملكي أصلًا»؟
      en: (Inference) What did Bu Rahayu mean by "the warung's been mine all along"?
    options: ["Dia sudah membeli warung itu dari Pak Budi.", "Dia bercanda bahwa dialah yang sebenarnya mengatur warung.", "Dia ingin pindah ke Bukittinggi.", "Dia marah kepada Pak Budi."]
    answer: 1
  - id: q04
    type: listen
    text: Bulat air karena pembuluh, bulat kata karena mufakat. Kita putuskan bersama, ya.
    question:
      ar_eg: بو راهايو عايزة تقول إيه بالمثل ده؟
      ar: ماذا تريد بو راهايو أن تقول بهذا المثل؟
      en: What does Bu Rahayu mean with this proverb?
    options: ["Keputusan diambil bersama.", "Air harus dimasak dulu.", "Adat Jawa yang harus menang."]
    answer: 0
    meaning:
      ar_eg: المية بتاخد شكل الماسورة، والكلمة بتكمل بالاتفاق. نقرّر مع بعض بقى.
      ar: يستدير الماء بالأنبوب، وتكتمل الكلمة بالتوافق. فلنقرّر معًا.
      en: Water is shaped by its pipe, a word is made whole by agreement. Let's decide together.
  - id: q05
    type: translate
    direction: from_target
    source_text: Berat sama dipikul, ringan sama dijinjing.
    answers_meaning:
      ar_eg: ["الحمل التقيل نشيله سوا، والخفيف نشيله سوا.", "نتشارك في الصعب والسهل.", "في الحلوة والمرّة مع بعض."]
      ar: ["الثقيل نحمله معًا والخفيف نحمله معًا.", "نتشارك في الشدّة والرخاء.", "نتقاسم الصعب والسهل معًا."]
      en: ["We carry heavy loads together and light ones together.", "We share the hard things and the easy things.", "Through thick and thin, we do it together."]
next:
  ar_eg: قبل الفرح، ساري وكريم مسافرين پاليمبانج في شغل. على نهر موسي، بين سفن تجّار قدام ومسجد على اسم بحّار صيني مسلم، كريم بيلاقي حتّة من مصر في حكاية سومطرة.
  ar: قبل العرس يسافر ساري وكريم إلى باليمبانغ في مهمّة عمل. وعلى نهر موسي، بين سفن تجّار الأزمنة الغابرة ومسجد يحمل اسم بحّار صيني مسلم، يجد كريم قطعة من مصر في حكاية سومطرة.
  en: Before the wedding, Sari and Karim travel to Palembang for work. On the Musi river - among the ships of ancient traders and a mosque named after a Chinese Muslim admiral - Karim finds a piece of Egypt in Sumatra's story.
