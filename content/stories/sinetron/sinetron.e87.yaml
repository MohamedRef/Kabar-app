series: sinetron
episode: 87
language: jv
level: j3
unlock_after: j3.u04
title:
  target: Nyuwun pirsa, wonten pundi?
  ar_eg: لو سمحت، فين؟
  ar: من فضلك، أين؟
  en: Excuse me, where is it?
summary:
  ar_eg: كريم رايح قصر پاكوالامان يقابل پاك ويريو، صاحب پاك هارجو والمرشد هناك. بيتوه، وبيسأل سوّاق بيچاك بالكراما - وبيتعلّم إن الإيد جزء من القواعد. وفي الپيندوپو الكبير، بيسأل پاك ويريو كل أدوات السؤال المؤدّبة.
  ar: يتوجّه كريم إلى قصر باكوالامان للقاء باك ويريو، صديق باك هارجو والمرشد هناك. يضيع، فيسأل سائق ريكشا بالكراما - ويتعلّم أنّ اليد جزء من القواعد. وفي الجناح الكبير يسأل باك ويريو بكلّ أدوات الاستفهام المهذّبة.
  en: Karim heads to the Pakualaman palace to meet Pak Wiryo, Pak Harjo's friend and a guide there. He gets lost and asks a becak driver in krama - learning that the hand is part of the grammar. In the great pendhapa, he asks Pak Wiryo every polite question word.
cast: [Karim, Bapak, Pak Wiryo]
scenes:
  - setting:
      ar_eg: شارع في جوجا الضهر. سوّاق بيچاك (عجلة بتلات عجلات) كبير في السنّ قاعد مستريّح في الضلّ.
      ar: شارع في جوغجا ظهرًا. سائق ريكشا (بيتشاك بثلاث عجلات) مسنّ يستريح في الظلّ.
      en: A Jogja street at midday. An older becak (pedicab) driver rests in the shade.
    lines:
      - speaker: Karim
        text: Nuwun sewu, Pak. Nyuwun pirsa, Pura Pakualaman wonten pundi?
        ar_eg: لا مؤاخذة يا عمّ. لو سمحت، قصر پاكوالامان فين؟
        ar: عذرًا يا عمّ. من فضلك، أين قصر باكوالامان؟
        en: Excuse me, sir. May I ask, where is the Pakualaman palace?
        note:
          ar_eg: "Nyuwun pirsa = «لو سمحت أسأل» (حرفيًا «أطلب أن أعرف»)، أدب السؤال مع الكبار. وpundi = فين (كراما ngendi). كلمات: nuwun = nuwun sewu = لو سمحت؛ kula nuwun = ممكن أدخل؟."
          ar: "Nyuwun pirsa = «أستأذن في السؤال» (حرفيًّا «أطلب أن أعرف»)، وهو أدب السؤال مع الكبار. وpundi = أين (كراما ngendi). مفردات: nuwun = nuwun sewu = عفوًا؛ kula nuwun = هل لي بالدخول؟."
          en: "Nyuwun pirsa = \"may I ask\" (literally \"I request to know\"), the polite way to ask an elder. pundi = where (krama of ngendi). Words: nuwun = nuwun sewu = excuse me; kula nuwun = may I come in?"
      - speaker: Bapak
        text: Mboten tebih, Mas. Saking mriki lurus, lajeng nengen.
        ar_eg: مش بعيد يا ابني. من هنا على طول، وبعدين يمين.
        ar: ليس بعيدًا يا بنيّ. من هنا مباشرة، ثمّ يمينًا.
        en: Not far, son. Straight on from here, then right.
      - speaker: Bapak
        text: Menika, ingkang wonten gapura ijem.
        ar_eg: هناك، اللي عنده البوّابة الخضرا.
        ar: هناك، حيث البوّابة الخضراء.
        en: That one, with the green gate.
        note:
          ar_eg: "كلمات: ingkang = اللي (sing ← yang)، كراما."
          ar: "مفردات: ingkang = الذي (sing ← yang)، كراما."
          en: "Words: ingkang = who / which / the one that (ngoko sing, Indonesian yang), krama."
      - speaker: Narrator
        text: Bapak sopir nuding nganggo jempol, ora nganggo driji panuding.
        ar_eg: عمّ السوّاق شاور بصباع الإبهام، مش بالسبّابة.
        ar: أشار السائق بإبهامه، لا بالسبّابة.
        en: The driver points with his thumb, not his index finger.
        note:
          ar_eg: "في جاوة، التشاور بالسبّابة قلّة أدب. بيشاوروا بالإبهام، والإيد مقفولة شويّة. ده جزء من الكلام المؤدّب. كلمات: driji = صباع؛ jempol = الإبهام، الصباع الكبير؛ nuding = يشاور على."
          ar: "في جاوة، الإشارة بالسبّابة قلّة أدب. فيشيرون بالإبهام، مع ضمّ اليد قليلًا. وهذا جزء من الكلام المهذّب. مفردات: driji = إصبع؛ jempol = الإبهام؛ nuding = يشير إلى."
          en: "In Java, pointing with the index finger is rude. People point with the thumb, hand slightly closed. It's part of polite speech. Words: driji = finger; jempol = thumb; nuding = point at."
      - speaker: Karim
        text: Matur nuwun sanget, Pak. Pinten menawi numpak becak?
        ar_eg: متشكّر جدًّا يا عمّ. وبكام لو ركبت البيچاك؟
        ar: شكرًا جزيلًا يا عمّ. وبكم لو ركبت الريكشا؟
        en: Thank you very much, sir. How much if I take the becak?
        note:
          ar_eg: "كلمات: numpak = يركب (مواصلة)."
          ar: "مفردات: numpak = يركب (وسيلة نقل)."
          en: "Words: numpak = ride, take (transport) = naik."
      - speaker: Bapak
        text: Mboten usah, Mas. Mlampah mawon, celak kok.
        ar_eg: مالوش لزوم يا ابني. امشي وخلاص، قريب.
        ar: لا داعي يا بنيّ. امشِ فقط، إنها قريبة.
        en: No need, son. Just walk, it's close.
        note:
          ar_eg: "كلمات: celak = قريب (كراما)."
          ar: "مفردات: celak = قريب (كراما)."
          en: "Words: celak = near (krama for cedhak)."
  - setting:
      ar_eg: الپيندوپو الكبير في قصر پاكوالامان - سقف خشب ضخم على عواميد، والأرض رخام. پاك ويريو، مرشد من كلاتين، بيرحّب بكريم.
      ar: الجناح الكبير (بندوبو) في قصر باكوالامان - سقف خشبيّ ضخم على أعمدة، وأرضيّة رخامية. يرحّب باك ويريو، المرشد من كلاتن، بكريم.
      en: The great pendhapa of the Pakualaman palace - a huge wooden roof on pillars over a marble floor. Pak Wiryo, a guide from Klaten, welcomes Karim.
    lines:
      - speaker: Pak Wiryo
        text: Sugeng rawuh, Mas Karim. Pak Harjo sampun ngendika. Mangga, taken kemawon!
        ar_eg: أهلًا بيك يا ماس كريم. پاك هارجو قالّي. اتفضّل، اسأل اللي انت عايزه!
        ar: أهلًا بك يا ماس كريم. أخبرني باك هارجو. تفضّل، اسأل ما شئت!
        en: Welcome, Mas Karim. Pak Harjo told me. Please, ask away!
        note:
          ar_eg: "كلمات: ngendika = يقول (krama inggil، للكبير)."
          ar: "مفردات: ngendika = يقول (krama inggil، للكبير)."
          en: "Words: ngendika = say (krama inggil, for the elder) = berkata."
      - speaker: Karim
        text: Matur nuwun, Pak. Menika menapa?
        ar_eg: متشكّر يا پاك. ده إيه؟
        ar: شكرًا يا باك. ما هذا؟
        en: Thank you, Pak. What is this?
      - speaker: Pak Wiryo
        text: Menika pendhapa. Papan kangge tamu lan gamelan.
        ar_eg: دي «پيندوپو». مكان للضيوف والجاميلان.
        ar: هذا «بندوبو». مكان للضيوف وللغاميلان.
        en: This is a pendhapa. A place for guests and gamelan.
        note:
          ar_eg: "الپيندوپو صالة مفتوحة من غير حيطان، بيستقبلوا فيها الضيوف ويعزفوا الجاميلان. وپيندوپو پاكوالامان واسع وجميل، زي پيندوپو الكراتون. كلمات: kangge = عشان / لـ (kanggo ← untuk)، كراما؛ papan = مكان."
          ar: "البندوبو قاعة مفتوحة بلا جدران، يُستقبل فيها الضيوف ويُعزف الغاميلان. وبندوبو باكوالامان واسع جميل، مثل بندوبو الكراتون. مفردات: kangge = لِـ (kanggo ← untuk)، كراما؛ papan = مكان."
          en: "A pendhapa is an open, wall-less hall for receiving guests and playing gamelan. Pakualaman's is wide and beautiful, like the Kraton's. Words: kangge = for (ngoko kanggo, Indonesian untuk), krama; papan = place = tempat."
      - speaker: Karim
        text: Ingkang yasa sinten?
        ar_eg: مين اللي بناه؟
        ar: من بناه؟
        en: Who built it?
      - speaker: Pak Wiryo
        text: Para Adipati Pakualaman, wiwit abad kaping sangalas.
        ar_eg: أمرا پاكوالامان، من القرن التسعتاشر.
        ar: أمراء باكوالامان، منذ القرن التاسع عشر.
        en: The Pakualaman princes, from the nineteenth century on.
        note:
          ar_eg: "كلمات: abad = قرن؛ kaping = مرة (في العدّ)؛ para = الـ… (جمع للناس)."
          ar: "مفردات: abad = قرن؛ kaping = مرة، المرة الـ؛ para = أداة جمع للأشخاص."
          en: "Words: abad = century; kaping = times, -th (time); para = plural marker for people."
      - speaker: Karim
        text: Kados pundi kula saged mlebet griya museum?
        ar_eg: أقدر أدخل المتحف إزاي؟
        ar: كيف أستطيع دخول المتحف؟
        en: How can I get into the museum?
        note:
          ar_eg: أدوات السؤال بالكراما - menapa (إيه)، sinten (مين)، pundi (فين)، pinten (كام)، kados pundi (إزاي).
          ar: أدوات الاستفهام بالكراما - menapa (ماذا)، sinten (من)، pundi (أين)، pinten (كم)، kados pundi (كيف).
          en: Krama question words - menapa (what), sinten (who), pundi (where), pinten (how much), kados pundi (how).
      - speaker: Pak Wiryo
        text: Mangga, kula dherekaken. Pitakenan sampeyan sae-sae sanget, Mas.
        ar_eg: اتفضّل، هوصّلك أنا. أسئلتك حلوة أوي يا ماس.
        ar: تفضّل، سأرافقك. أسئلتك ممتازة جدًّا يا ماس.
        en: Please, I'll take you. Your questions are excellent, Mas.
