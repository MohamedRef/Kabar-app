    ar_eg: لو سمحت أسأل
    ar: أستأذن في السؤال
    en: may I ask (polite)
  - word: pundi
    pos: question word
    ar_eg: فين (كراما)
    ar: أين (كراما)
    en: where (krama)
  - word: sinten
    pos: question word
    ar_eg: مين (كراما)
    ar: من (كراما)
    en: who (krama)
  - word: pinten
    pos: question word
    ar_eg: كام / بكام (كراما)
    ar: كم / بكم (كراما)
    en: how much (krama)
  - word: kados pundi
    pos: question word
    ar_eg: إزاي (كراما)
    ar: كيف (كراما)
    en: how (krama)
  - word: jempol
    pos: noun
    ar_eg: صباع الإبهام
    ar: الإبهام
    en: thumb
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: السوّاق شاور بإيه؟
      ar: بماذا أشار السائق؟
      en: What did the driver point with?
    options: ["driji panuding", "jempol", "sikil"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Nyuwun pirsa, Pura Pakualaman wonten ___?
    meaning:
      ar_eg: لو سمحت، قصر پاكوالامان فين؟
      ar: من فضلك، أين قصر باكوالامان؟
      en: May I ask, where is the Pakualaman palace?
    answers: [pundi]
    options: ["pundi", "sinten", "pinten"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: «Ingkang yasa sinten؟» معناها إيه؟
      ar: ما معنى «Ingkang yasa sinten؟»؟
      en: What does "Ingkang yasa sinten?" mean?
    options: ["Who built it?", "How much is it?", "Where is it?"]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Mboten tebih, Mas. Mlampah mawon.
    answers_meaning:
      ar_eg: ["مش بعيد يا ابني. امشي وخلاص.", "مش بعيد، امشي بس."]
      ar: ["ليس بعيدًا يا بنيّ. امشِ فقط."]
      en: ["Not far, son. Just walk.", "It's not far. Just walk."]
next:
  ar_eg: سوق بيرينجهارجو، السوق القديم الكبير في ماليوبورو. كريم عايز يشتري باتيك هدية... والبيّاعة الكبيرة مش هتنزل في السعر غير لما يعدّ بالكراما.
  ar: سوق بيرينغهارجو، السوق القديم الكبير في ماليوبورو. يريد كريم شراء باتيك هديةً... والبائعة المسنّة لن تخفض السعر إلّا إذا عدّ بالكراما.
  en: Pasar Beringharjo, the big old market on Malioboro. Karim wants to buy batik as a gift... and the older seller won't drop the price unless he counts in krama.
review:
  status: draft
  verified: false
  notes: Pak Wiryo is the Klaten-born guide from the j3.u04 lessons. Moved from Mangkunegaran (Solo) to Pakualaman (Jogja), 2026-10-27. Pakualaman dates from 1812-1813 (Paku Alam I), hence "abad kaping sangalas"; the pendhapa description is kept general. Thumb-pointing etiquette per j3.u04/j4.u04.
