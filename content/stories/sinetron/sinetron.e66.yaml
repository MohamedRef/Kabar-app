series: sinetron
episode: 66
language: id
level: bipa7
unlock_after: bipa7.u06
title:
  target: Saring sebelum Sharing
  ar_eg: صفّي قبل ما تشيّر
  ar: تحقّق قبل أن تنشر
  en: Filter Before You Share
summary:
  ar_eg: مقالة بايو عملت «تريند»، وحساب كبير نشر عنها بوست غلط - إن وارونج پاك بودي «من سنة ٩٨ وبيأكّل الناس ببلاش». وفي ماديون، طابور قدّام الوارونج بيسأل عن الأكل المجاني... وبو راهايو نفسها بعتت في جروب العيلة وصفة «معجزة» للضغط.
  ar: انتشرت مقالة بايو انتشارًا واسعًا، ونشر عنها حساب كبير منشورًا مضلّلًا - أنّ وارونغ باك بودي «قائم منذ ١٩٩٨ ويُطعم الناس مجّانًا». وفي ماديون يصطفّ الناس أمام الوارونغ يسألون عن الطعام المجّاني... وبو راهايو نفسها أرسلت في مجموعة العائلة وصفة «معجزة» لضغط الدم.
  en: Bayu's article goes viral, and a big account posts a misleading version - that Pak Budi's warung "has fed people for FREE since 1998". In Madiun, a queue forms asking for free food... and Bu Rahayu herself has forwarded a "miracle" blood-pressure cure to the family group.
cast: [Kak Nella, Bayu, Pak Yafet, Mas Joko, Pak Budi, Bu Rahayu]
scenes:
  - setting:
      ar_eg: مكتب الجرنال في سورونج، الساعة ٩ الصبح بتوقيت WIT. موبايل بايو بيزنّ من غير ما يبطّل.
      ar: مكتب الصحيفة في سورونغ، التاسعة صباحًا بتوقيت WIT. هاتف بايو يهتزّ بلا توقّف.
      en: The newsroom in Sorong, 9 a.m. WIT. Bayu's phone is buzzing non-stop.
    lines:
      - speaker: Narrator
        text: Sorong, pukul sembilan pagi. Ponsel Bayu bergetar tanpa henti, seakan-akan ada seekor lebah di dalam sakunya.
        ar_eg: سورونج، الساعة تسعة الصبح. موبايل بايو بيزنّ من غير ما يبطّل، كأن فيه نحلة في جيبه.
        ar: سورونغ، التاسعة صباحًا. هاتف بايو يهتزّ بلا انقطاع، كأنّ في جيبه نحلة.
        en: Sorong, nine in the morning. Bayu's phone buzzes non-stop, as if there were a bee in his pocket.
      - speaker: Kak Nella
        text: Mas Bayu! Tulisanmu sudah dibagikan dua puluh ribu kali. Kalimat juragan bapakmu jadi kutipan di mana-mana.
        ar_eg: يا بايو! مقالتك اتشيّرت عشرين ألف مرة. جملة المعلّم بتاع أبوك بقت في كل حتّة.
        ar: يا ماس بايو! شوركت مقالتك عشرين ألف مرّة، وصارت عبارة معلّم أبيك تُقتبس في كلّ مكان.
        en: Mas Bayu! Your piece has been shared twenty thousand times. Your dad's old boss's line is being quoted everywhere.
      - speaker: Bayu
        text: '"Kalau mereka tidak makan, kita juga tidak makan"? Ada yang menjadikannya poster!'
        ar_eg: «لو هم ماكلوش، احنا كمان مش هناكل»؟ فيه ناس عملوها بوستر!
        ar: «إن لم يأكلوا هم، لن نأكل نحن أيضًا»؟ ثمّة من جعلها ملصقًا!
        en: '"If they don''t eat, we don''t eat either"? Someone''s made it into a poster!'
      - speaker: Pak Yafet
        text: Selamat. Tapi wartawan yang baik tidak berhenti di angka. Coba lihat unggahan akun besar ini.
        ar_eg: مبروك. بس الصحفي الشاطر مبيقفش عند الأرقام. بصّ كده على البوست بتاع الحساب الكبير ده.
        ar: تهانينا. لكنّ الصحفي الجيّد لا يقف عند الأرقام. انظر إلى منشور هذا الحساب الكبير.
        en: Congratulations. But a good journalist doesn't stop at the numbers. Have a look at this post from a big account.
      - speaker: Kak Nella
        text: '"VIRAL!!! Warung legendaris di Madiun ini sudah berdiri sejak 1998 dan memberi makan GRATIS setiap hari. Bagikan sebelum dihapus!!!"'
        ar_eg: «ترند!!! الوارونج الأسطوري ده في ماديون موجود من سنة ٩٨ وبيأكّل الناس ببلاش كل يوم. شيّر قبل ما يتمسح!!!»
        ar: «انتشار واسع!!! هذا الوارونغ الأسطوري في ماديون قائم منذ ١٩٩٨ ويُطعم الناس مجّانًا كلّ يوم. شارِك قبل الحذف!!!»
        en: '"VIRAL!!! This legendary warung in Madiun has been around since 1998 and feeds people for FREE every day. Share before it''s deleted!!!"'
        note:
          ar_eg: علامات الخبر المضروب - حروف كبيرة، علامات تعجّب كتير، استعجال زي «شيّر قبل ما يتمسح»، ومفيش مصدر. وكلمة hoaks (خبر كاذب) كلمة رسمية في قاموس KBBI.
          ar: من علامات الخبر الكاذب - الحروف الكبيرة، وكثرة علامات التعجّب، والاستعجال مثل «شارِك قبل الحذف»، وغياب المصدر. وكلمة hoaks (خبر كاذب) مدرجة رسميًّا في معجم KBBI.
          en: 'Signs of a hoax: capital letters, piles of exclamation marks, urgency ("share before it''s deleted"), and no source. hoaks is an official word in the KBBI dictionary.'
      - speaker: Bayu
        text: Ini salah dua kali. Warung Bapak baru buka sekitar dua puluh tahun yang lalu. Dan makanannya tidak gratis. Kalau gratis, Mas Joko bisa bangkrut!
        ar_eg: ده غلط مرتين. وارونج أبويا فاتح من حوالي عشرين سنة بس. والأكل مش ببلاش. لو ببلاش، ماس جوكو هيفلّس!
        ar: هذا خطأ مضاعف. فوارونغ أبي افتُتح قبل نحو عشرين عامًا فقط. والطعام ليس مجّانيًّا. ولو كان مجّانيًّا لأفلس ماس جوكو!
        en: That's wrong twice over. Dad's warung only opened about twenty years ago. And the food isn't free. If it were, Mas Joko would go bankrupt!
      - speaker: Pak Yafet
        text: Nah, itu namanya misinformasi, yaitu informasi keliru yang disebarkan, kadang tanpa niat jahat. Kalau sengaja untuk menipu, itu disinformasi.
        ar_eg: أهو ده اسمه «معلومات مغلوطة» - معلومة غلط بتنتشر، ساعات من غير نيّة وحشة. أما لو قاصدين يضحكوا على الناس، يبقى اسمه «تضليل».
        ar: هذا ما يُسمّى «المعلومات المغلوطة»، أي معلومات خاطئة تُنشر أحيانًا بلا نيّة سيّئة. أمّا إذا قُصد بها الخداع فهي «تضليل».
        en: That's what we call misinformation - false information that spreads, sometimes with no bad intent. If it's deliberately meant to deceive, it's disinformation.
      - speaker: Kak Nella
        text: Akun itu juga memotong foto dari artikelmu tanpa menyebut sumbernya.
        ar_eg: والحساب ده كمان قصّ صورة من مقالتك من غير ما يذكر المصدر.
        ar: وقد قصّ ذلك الحساب أيضًا صورة من مقالتك دون أن يذكر مصدرها.
        en: That account also cropped a photo from your article without crediting the source.
      - speaker: Bayu
        text: Lalu apa yang harus kulakukan? Marah-marah di kolom komentar?
        ar_eg: طب أعمل إيه؟ أزعّق في الكومنتات؟
        ar: فماذا أفعل؟ أثور غضبًا في خانة التعليقات؟
        en: So what do I do? Rant in the comments?
      - speaker: Pak Yafet
        text: Jangan. Tulis klarifikasi yang tenang. Fakta, sumber, dan tautan ke artikel aslinya. Kebohongan memang berlari cepat, tetapi kebenaran yang sabar biasanya sampai juga.
        ar_eg: لأ. اكتب توضيح هادي. حقايق، ومصدر، ولينك للمقالة الأصلية. الكدب بيجري بسرعة آه، بس الحقيقة الصبورة غالبًا بتوصل برضه.
        ar: لا. اكتب توضيحًا هادئًا - حقائق ومصدرًا ورابطًا إلى المقالة الأصلية. الكذب يركض سريعًا حقًّا، لكنّ الحقيقة الصبورة تصل في الغالب.
        en: Don't. Write a calm clarification. Facts, a source, and a link to the original article. Lies do run fast, but patient truth usually gets there in the end.
      - speaker: Kak Nella
        text: Sa bantu bikin versi pendeknya untuk Instagram. Orang sekarang membaca dengan jempol.
        ar_eg: أنا هساعدك نعمل نسخة قصيرة لإنستجرام. الناس دلوقتي بتقرا بصباعها الكبير.
        ar: سأساعدك في نسخة قصيرة لإنستغرام. فالناس اليوم يقرؤون بإبهامهم.
        en: I'll help you make a short version for Instagram. People read with their thumbs these days.
      - speaker: Bayu
        text: Baik. Tapi sebelumnya aku harus menelepon Madiun. Firasatku tidak enak.
        ar_eg: تمام. بس قبلها لازم أكلّم ماديون. قلبي مش مطمّن.
        ar: حسنًا. لكن عليّ أوّلًا أن أتّصل بماديون. لديّ إحساس سيّئ.
        en: Okay. But first I need to call Madiun. I've got a bad feeling.
  - setting:
      ar_eg: جانج ميلاتي في ماديون، الضهر. طابور طويل قدّام الوارونج، والناس معاهم موبايلات. ماس جوكو عرقان ورا الكاونتر، وپاك بودي وبو راهايو على الفيديو مع بايو.
      ar: زقاق ميلاتي في ماديون ظهرًا. طابور طويل أمام الوارونغ والناس يحملون هواتفهم. ماس جوكو يتصبّب عرقًا خلف المنضدة، وباك بودي وبو راهايو على الاتصال المرئي مع بايو.
      en: Gang Melati in Madiun, midday. A long queue in front of the warung, phones in hand. Mas Joko is sweating behind the counter; Pak Budi and Bu Rahayu are on video with Bayu.
    lines:
      - speaker: Narrator
        text: Gang Melati, Madiun. Di depan warung, antrean mengular sampai ke rumah Pak RT.
        ar_eg: جانج ميلاتي، ماديون. قدّام الوارونج، الطابور ملفوف زي التعبان لحد بيت پاك إر تي.
        ar: زقاق ميلاتي، ماديون. أمام الوارونغ طابور يتلوّى كالأفعى حتى بيت باك إر تي.
        en: Gang Melati, Madiun. In front of the warung, the queue snakes all the way to Pak RT's house.
      - speaker: Mas Joko
        text: Bayu! Untung kamu telepon. Sejak pagi orang datang membawa ponsel dan bertanya, "Mana pecel gratisnya?"
        ar_eg: يا بايو! الحمد لله إنك اتّصلت. من الصبح الناس جايّة ماسكة موبايلاتها وبتسأل «فين البيچيل المجاني؟»
        ar: يا بايو! لحسن الحظّ أنّك اتّصلت. منذ الصباح يأتي الناس بهواتفهم ويسألون «أين البيتشيل المجّاني؟»
        en: Bayu! Thank goodness you called. Since morning people have been turning up with their phones asking, "Where's the free pecel?"
      - speaker: Pak Budi
        text: Bapak sudah menjelaskan baik-baik. Mereka tetap makan, tetap bayar, tapi minta foto bersama Bapak. Bapak sudah seperti bintang sinetron.
        ar_eg: أنا شرحت لهم بالذوق. هم أكلوا ودفعوا عادي، بس عايزين يتصوّروا معايا. بقيت زي نجوم المسلسلات.
        ar: شرحتُ لهم بلطف. فأكلوا ودفعوا كالعادة، لكنّهم طلبوا صورًا معي. صرتُ كنجوم المسلسلات.
        en: I've explained nicely. They still eat, they still pay, but they want photos with me. I'm like a soap-opera star.
      - speaker: Bayu
        text: Pak, maaf, ya. Aku sedang menulis klarifikasi. Nanti kukirim ke grup keluarga juga.
        ar_eg: معلش يا بابا. أنا بكتب توضيح دلوقتي. وهبعته على جروب العيلة كمان.
        ar: آسف يا أبي. أكتب الآن توضيحًا، وسأرسله إلى مجموعة العائلة أيضًا.
        en: Sorry, Dad. I'm writing a clarification. I'll send it to the family group too.
      - speaker: Bu Rahayu
        text: Grup keluarga? Oh iya, Le, tadi pagi Ibu meneruskan pesan penting. Katanya, minum air kelapa dicampur garam setiap pagi bisa menyembuhkan darah tinggi. Untuk Bapak.
        ar_eg: جروب العيلة؟ آه صحيح يا ابني، أنا الصبح بعتّ رسالة مهمّة. بيقولوا إن شرب مية جوز الهند بالملح كل يوم الصبح بيشفي الضغط العالي. عشان أبوك.
        ar: مجموعة العائلة؟ آه صحيح يا بنيّ، أعدتُ صباح اليوم إرسال رسالة مهمّة. تقول إنّ شرب ماء جوز الهند مع الملح كلّ صباح يشفي ارتفاع ضغط الدم. من أجل أبيك.
        en: The family group? Oh yes, son, this morning I forwarded an important message. It says drinking coconut water mixed with salt every morning cures high blood pressure. For your dad.
      - speaker: Bayu
        text: Bu... siapa yang menulis pesan itu? Dokter? Lembaga kesehatan?
        ar_eg: يا ماما... مين اللي كاتب الرسالة دي؟ دكتور؟ جهة صحّية؟
        ar: يا أمي... من كتب تلك الرسالة؟ طبيب؟ هيئة صحّية؟
        en: Mum... who wrote that message? A doctor? A health body?
      - speaker: Bu Rahayu
        text: Tidak ada namanya. Tapi yang mengirim Bu Sri, dan Bu Sri dapat dari grup pengajian.
        ar_eg: مفيهاش اسم. بس اللي بعتتها بو سري، وبو سري جاتلها من جروب الدرس الديني.
        ar: لا اسم عليها. لكنّ التي أرسلتها بو سري، وقد وصلتها من مجموعة حلقة التلاوة.
        en: There's no name. But Bu Sri sent it, and Bu Sri got it from her Quran-study group.
      - speaker: Bayu
        text: Justru itu masalahnya, Bu. Semakin banyak tangan yang meneruskan, semakin terasa benar, padahal sumbernya tidak jelas. Lagi pula, garam itu musuh tekanan darah Bapak!
        ar_eg: هي دي المشكلة بالظبط يا ماما. كل ما إيدين أكتر تعيد إرسالها، كل ما تبان صحّ أكتر، مع إن مصدرها مش معروف. وبعدين الملح ده عدوّ ضغط بابا!
        ar: تلك هي المشكلة بعينها يا أمي. كلّما كثرت الأيدي التي تعيد إرسالها بدت أصدق، مع أنّ مصدرها مجهول. ثمّ إنّ الملح عدوّ ضغط أبي!
        en: That's exactly the problem, Mum. The more hands forward it, the truer it feels, even though the source is unclear. And besides, salt is the enemy of Dad's blood pressure!
        note:
          ar_eg: في إندونيسيا فيه مواقع لفحص الأخبار زي cekfakta.com، اللي عاملاه جمعية Mafindo مع مواقع إخبارية. والسؤال الأول دايمًا - مين اللي قال؟ وفين المصدر؟
          ar: في إندونيسيا مواقع لتدقيق الأخبار مثل cekfakta.com، أنشأته جمعية Mafindo بالتعاون مع مؤسسات إخبارية. والسؤال الأوّل دائمًا - من قال؟ وأين المصدر؟
          en: Indonesia has fact-checking sites such as cekfakta.com, run by the anti-hoax group Mafindo together with news outlets. The first question is always - who said it, and where's the source?
      - speaker: Pak Budi
        text: Dokter Wulan juga bilang begitu. Garam dikurangi, obat diminum, jalan kaki setiap pagi. Tidak ada air ajaib.
        ar_eg: الدكتورة وولان قالت كده برضه. قلّل الملح، خد الدوا، وامشي كل يوم الصبح. مفيش مية سحرية.
        ar: والدكتورة وولان قالت ذلك أيضًا - تقليل الملح، وأخذ الدواء، والمشي كلّ صباح. لا يوجد ماء سحري.
        en: Dr Wulan said the same. Less salt, take your medicine, walk every morning. There's no magic water.
      - speaker: Bu Rahayu
        text: Ya Allah. Ibu yang setiap hari melarang Bapak makan asin malah menyebarkan resep garam. Ibu hapus sekarang, dan Ibu minta maaf di grup.
        ar_eg: يا ربّي. أنا اللي كل يوم بمنع أبوك من الأكل المالح، أروح أنشر وصفة ملح! همسحها دلوقتي، وهعتذر في الجروب.
        ar: يا الله. أنا التي أمنع أباك كلّ يوم من المالح، أنشر وصفة ملح! سأحذفها الآن وأعتذر في المجموعة.
        en: Oh my goodness. I'm the one who stops your dad eating salty food every day, and I go spreading a salt recipe! I'll delete it now and apologise in the group.
      - speaker: Bayu
        text: '"Kabar bahwa warung tersebut memberi makan gratis sejak 1998 tidak benar. Informasi keliru itu berasal dari unggahan yang memotong artikel asli tanpa mencantumkan sumber. Berita palsu semacam ini sebaiknya diperiksa sebelum dibagikan."'
        ar_eg: «الكلام اللي بيقول إن الوارونج ده بيأكّل الناس ببلاش من سنة ٩٨ مش صحيح. المعلومة الغلط دي جاية من بوست قصّ المقالة الأصلية من غير ما يذكر المصدر. والأخبار المضروبة اللي زي دي الأحسن نتأكّد منها قبل ما نشيّرها.»
        ar: «الخبر القائل إنّ الوارونغ المذكور يُطعم الناس مجّانًا منذ ١٩٩٨ غير صحيح. وقد نشأت هذه المعلومة الخاطئة من منشور اقتطع المقالة الأصلية دون ذكر المصدر. والأخبار الزائفة من هذا النوع ينبغي التحقّق منها قبل مشاركتها.»
        en: '"The claim that the warung has fed people for free since 1998 is not true. The false information came from a post that cropped the original article without citing the source. Fake news of this kind should be checked before it is shared."'
        note:
          ar_eg: الترابط المعجمي (kohesi leksikal) - بايو قال نفس الحاجة بكلمات مختلفة - kabar ← informasi keliru ← berita palsu، وwarung tersebut بيرجع على الوارونج. ده بيربط النصّ من غير تكرار ممل.
          ar: الترابط المعجمي (kohesi leksikal) - عبّر بايو عن الشيء نفسه بألفاظ مترادفة - kabar ← informasi keliru ← berita palsu، وتحيل warung tersebut إلى الوارونغ. فيترابط النصّ بلا تكرار مملّ.
          en: 'Lexical cohesion (kohesi leksikal): Bayu names the same thing with different words - kabar → informasi keliru → berita palsu - and warung tersebut points back to the warung. The text hangs together without dull repetition.'
      - speaker: Mas Joko
        text: Bagus. Tapi tolong tambahkan satu kalimat lagi, "Pecelnya tetap enak walaupun tidak gratis."
        ar_eg: حلو. بس والنبي زوّد جملة كمان - «البيچيل لسه طعمه حلو حتى لو مش ببلاش.»
        ar: جميل. لكن أرجوك أضف جملة أخرى - «البيتشيل لذيذ وإن لم يكن مجّانيًّا.»
        en: 'Good. But please add one more line: "The pecel is still delicious, even if it isn''t free."'
      - speaker: Pak Budi
        text: Dan satu lagi, Le. "Saring sebelum sharing." Bapak dengar itu di radio. Bapak suka bunyinya.
        ar_eg: وحاجة كمان يا ابني. «صفّي قبل ما تشيّر.» سمعتها في الراديو. عاجبني رنّتها.
        ar: وشيء آخر يا بنيّ - «تحقّق قبل أن تنشر.» سمعتها في الإذاعة، وأعجبني جرسها.
        en: And one more thing, son. "Filter before you share." I heard it on the radio. I like the sound of it.
        note:
          ar_eg: «Saring sebelum sharing» شعار مشهور لحملات التوعية الرقمية في إندونيسيا. saring يعني «يصفّي»، وsharing كلمة إنجليزي - والاتنين مسجوعين.
          ar: «Saring sebelum sharing» شعار شائع لحملات التوعية الرقمية في إندونيسيا. saring تعني «يصفّي»، وsharing كلمة إنجليزية، وبينهما سجع.
          en: '"Saring sebelum sharing" is a well-known Indonesian digital-literacy slogan. saring means "to filter", sharing is borrowed from English - and they rhyme.'
new_words:
  - word: unggahan
    pos: noun
    ar_eg: بوست، منشور
    ar: منشور
    en: post, upload
  - word: hoaks
