title:
  target: Nama, Harga, dan Harapan
  ar_eg: الاسم والسعر والأمل
  ar: الاسم والسعر والأمل
  en: Names, Prices and Hope
summary:
  ar_eg: بايو بيعمل لقاء بالتليفون مع أبوه عن الأزمة المالية سنة ١٩٩٨ وعن «الإصلاح» - الأسعار اللي كانت بتتكتب بالطباشير، والوارونج اللي اتحوّش فيه الناس قدّام التلفزيون. وفي سورونج، پاك يافت بيصلّح المسوّدة بقلم أحمر، وبيحكي ذكرياته هو كمان - يوم ما اسم «پاپوا» رجع.
  ar: يحاور بايو أباه هاتفيًّا عن الأزمة المالية عام ١٩٩٨ وعن «الإصلاح» - الأسعار التي كانت تُكتب بالطباشير، والوارونغ الذي تجمّع فيه الناس أمام التلفاز. وفي سورونغ يصحّح باك يافت المسوّدة بقلم أحمر، ويروي ذكرياته هو أيضًا - يوم عاد اسم «بابوا».
  en: Bayu interviews his father by phone about the 1998 financial crisis and Reformasi - prices written in chalk, and a warung crowded round the television. In Sorong, Pak Yafet edits the draft in red pen and shares his own memory - the day the name "Papua" came back.
cast: [Bayu, Pak Budi, Bu Rahayu, Pak Yafet]
scenes:
  - setting:
      ar_eg: بايو في أوضته في سورونج، الريكوردر شغّال. وفي ماديون، پاك بودي وبو راهايو قاعدين جنب التليفون في البيت.
      ar: بايو في غرفته في سورونغ، وجهاز التسجيل يعمل. وفي ماديون يجلس باك بودي وبو راهايو بجانب الهاتف في البيت.
      en: Bayu in his room in Sorong, recorder running. In Madiun, Pak Budi and Bu Rahayu sit by the phone at home.
    lines:
      - speaker: Narrator
        text: Malam itu Bayu menelepon Madiun. Kali ini dia tidak menelepon sebagai anak, tetapi sebagai wartawan. Perekamnya sudah menyala.
        ar_eg: الليلة دي بايو اتّصل بماديون. المرة دي مش بيتّصل كابن، لكن كصحفي. والريكوردر شغّال.
        ar: في تلك الليلة اتّصل بايو بماديون. لم يتّصل هذه المرّة ابنًا، بل صحفيًّا. وجهاز التسجيل يعمل.
        en: That night Bayu called Madiun. This time he wasn't calling as a son, but as a journalist. The recorder was already on.
      - speaker: Bayu
        text: Pak, untuk tulisan sejarahku, aku butuh narasumber yang mengalami sendiri tahun 1998. Bapak bersedia?
        ar_eg: يا بابا، عشان مقالة التاريخ بتاعتي، محتاج مصدر عاش سنة ٩٨ بنفسه. توافق؟
        ar: يا أبي، أحتاج لمقالتي التاريخية إلى مصدر عايش عام ١٩٩٨ بنفسه. هل توافق؟
        en: Dad, for my history piece I need a source who lived through 1998 himself. Are you willing?
      - speaker: Pak Budi
        text: Narasumber? Wah, Bapak harus pakai kemeja batik dulu.
        ar_eg: مصدر؟ ياه، يبقى لازم ألبس القميص الباتيك الأول.
        ar: مصدر؟ إذن عليّ أن ألبس قميص الباتيك أوّلًا.
        en: A source? Well, then I'll have to put on my batik shirt first.
      - speaker: Bu Rahayu
        text: Ini telepon, Pak, bukan televisi.
        ar_eg: ده تليفون يا بودي، مش تلفزيون.
        ar: هذا هاتف يا باك، لا تلفاز.
        en: It's a phone call, Pak, not television.
      - speaker: Bayu
        text: Pertanyaan pertama. Apa yang paling Bapak ingat dari krisis moneter?
        ar_eg: أول سؤال. إيه أكتر حاجة فاكرها من الأزمة المالية؟
        ar: السؤال الأوّل. ما أكثر ما تتذكّره من الأزمة النقدية؟
        en: First question. What do you remember most about the monetary crisis?
        note:
          ar_eg: krisis moneter أو «krismon» هي الأزمة المالية الآسيوية ١٩٩٧-١٩٩٨. الروپية وقعت من حوالي ٢٥٠٠ للدولار لأكتر من ١٥ ألف في أسوأ وقت، والأسعار طارت.
          ar: krisis moneter أو «krismon» هي الأزمة المالية الآسيوية ١٩٩٧-١٩٩٨. هوت الروبية من نحو ٢٥٠٠ للدولار إلى أكثر من ١٥ ألفًا في أسوأ أوقاتها، وقفزت الأسعار.
          en: Krisis moneter, or "krismon", was the 1997-98 Asian financial crisis. The rupiah fell from about 2,500 to the dollar to over 15,000 at its worst, and prices soared.
      - speaker: Pak Budi
        text: Harga. Waktu itu Bapak dan Ibu baru menikah, dan Bapak masih jadi juru masak di warung orang dekat Pasar Besar. Pagi harga minyak goreng sekian, sore sudah naik lagi. Juragan Bapak sampai menulis harga dengan kapur supaya gampang dihapus.
        ar_eg: الأسعار. ساعتها أنا وأمّك كنّا لسه متجوّزين، وكنت لسه طبّاخ في وارونج حد تاني جنب السوق الكبير. الصبح الزيت بسعر، والعصر يغلى تاني. المعلّم بتاعي وصل إنه بقى يكتب الأسعار بالطباشير عشان تتمسح بسهولة.
        ar: الأسعار. كنّا أنا وأمّك حديثَي الزواج، وكنتُ طاهيًا في وارونغ يملكه غيري قرب السوق الكبير. في الصباح لزيت القلي سعر، وفي العصر يرتفع من جديد. حتى إنّ معلّمي صار يكتب الأسعار بالطباشير لتُمحى بسهولة.
        en: Prices. Your mum and I had just got married, and I was still a cook at someone else's warung near the Pasar Besar. In the morning cooking oil cost one thing, by afternoon it had gone up again. My boss ended up writing the prices in chalk so they were easy to rub out.
      - speaker: Bayu
        text: Lalu bagaimana warung itu bisa bertahan?
        ar_eg: وبعدين الوارونج ده قدر يصمد إزاي؟
        ar: وكيف استطاع ذلك الوارونغ أن يصمد؟
        en: So how did that warung survive?
      - speaker: Pak Budi
        text: Porsinya kami kecilkan sedikit, tapi harganya tidak kami naikkan untuk tukang becak dan buruh pasar. Kata juragan Bapak, "Kalau mereka tidak makan, kita juga tidak makan." Kalimat itu Bapak bawa sampai sekarang.
        ar_eg: صغّرنا الطبق شوية، بس مغلّيناش السعر على سوّاقين البيچاك وشيّالين السوق. المعلّم بتاعي كان بيقول «لو هم ماكلوش، احنا كمان مش هناكل». والجملة دي شايلها معايا لحد النهارده.
        ar: صغّرنا الحصص قليلًا، لكنّنا لم نرفع السعر على سائقي الدرّاجات الثلاثية وعمّال السوق. كان معلّمي يقول «إن لم يأكلوا هم، لن نأكل نحن أيضًا». وما زلت أحمل هذه العبارة حتى اليوم.
        en: We made the portions a bit smaller, but we didn't raise the price for the becak drivers and market porters. My boss used to say, "If they don't eat, we don't eat either." I've carried that sentence with me ever since.
      - speaker: Bayu
        text: Dan bulan Mei 1998?
        ar_eg: وشهر مايو ٩٨؟
        ar: وشهر مايو ١٩٩٨؟
        en: And May 1998?
      - speaker: Pak Budi
        text: Semua orang menonton televisi di warung. Mahasiswa menduduki gedung DPR di Jakarta. Lalu tanggal 21 Mei, Pak Harto mengumumkan bahwa beliau berhenti. Warung mendadak sunyi. Ada yang menangis, ada yang bersorak, ada yang diam saja.
        ar_eg: الناس كلها كانت بتتفرّج على التلفزيون في الوارونج. الطلبة احتلّوا مبنى البرلمان في جاكرتا. وبعدين يوم ٢١ مايو، «پاك هارتو» أعلن إنه هيتنحّى. الوارونج سكت مرة واحدة. فيه اللي عيّط، وفيه اللي هلّل، وفيه اللي فضل ساكت.
        ar: كان الجميع يشاهدون التلفاز في الوارونغ. احتلّ الطلّاب مبنى البرلمان في جاكرتا. ثمّ في الحادي والعشرين من مايو أعلن «باك هارتو» تنحّيه. فساد الصمت فجأة في الوارونغ. منهم من بكى، ومنهم من هلّل، ومنهم من لزم الصمت.
        en: Everyone was watching television at the warung. Students had occupied the parliament building in Jakarta. Then on 21 May, Pak Harto announced that he was stepping down. The warung went quiet all at once. Some cried, some cheered, some just sat in silence.
        note:
          ar_eg: «Pak Harto» هو الرئيس سوهارتو اللي حكم ٣٢ سنة. اتنحّى في ٢١ مايو ١٩٩٨ بعد مظاهرات الطلبة، ونائبه حبيبي (B.J. Habibie) مسك الرئاسة، وبدأت فترة اسمها Reformasi (الإصلاح). ولاحظ إن پاك بودي بيقول beliau حتى عنه - الاحترام في الكلام عادة إندونيسية.
          ar: «Pak Harto» هو الرئيس سوهارتو الذي حكم ٣٢ عامًا. تنحّى في ٢١ مايو ١٩٩٨ بعد احتجاجات الطلّاب، وتولّى نائبه حبيبي (B.J. Habibie) الرئاسة، وبدأ عهد يُعرف بـ Reformasi (الإصلاح). ولاحظ أنّ باك بودي يقول beliau حتى عنه، فالتوقير في الكلام عادة إندونيسية.
          en: Pak Harto is President Suharto, who ruled for 32 years. He resigned on 21 May 1998 after student protests; his vice-president B.J. Habibie took over, and the era called Reformasi began. Note that Pak Budi says beliau even of him - respectful speech is an Indonesian habit.
      - speaker: Bu Rahayu
        text: Ibu ingat, malam itu Bapak bilang, "Anak-anak kita nanti boleh menulis apa saja." Ternyata benar, Le.
        ar_eg: أنا فاكرة إن الليلة دي أبوك قال «ولادنا بعدين هيقدروا يكتبوا أي حاجة». وطلع كلامه صح يا ابني.
        ar: أذكر أنّ أباك قال تلك الليلة «سيكون لأولادنا أن يكتبوا ما يشاؤون». وقد صدق يا بنيّ.
        en: I remember that night your dad said, "Our children will be free to write anything." And he was right, son.
        note:
          ar_eg: من نتايج الإصلاح - حرية الصحافة (قانون الصحافة سنة ١٩٩٩)، وانتخاب الرئيس مباشرة من الشعب من سنة ٢٠٠٤، وصلاحيات أكتر للمحافظات.
          ar: من ثمار الإصلاح حرّية الصحافة (قانون الصحافة عام ١٩٩٩)، وانتخاب الرئيس انتخابًا شعبيًّا مباشرًا منذ ٢٠٠٤، ومزيد من الحكم الذاتي للأقاليم.
          en: 'Reformasi brought press freedom (the 1999 Press Law), direct presidential elections from 2004, and more regional autonomy.'
      - speaker: Bayu
        text: Pak... Bapak bilang begitu? Padahal waktu itu aku belum lahir.
        ar_eg: بابا... انت قلت كده؟ ده أنا ساعتها كنت لسه مااتولدتش.
        ar: أبي... أقلتَ ذلك حقًّا؟ مع أنّي لم أكن قد وُلدتُ بعد.
        en: Dad... you said that? I wasn't even born yet.
      - speaker: Pak Budi
        text: Belum. Mbakmu juga belum. Tapi doa orang tua itu kadang berangkat lebih dulu daripada anaknya.
        ar_eg: لأ لسه. وأختك كمان لسه. بس دعوة الأهل ساعات بتسافر قبل العيل نفسه.
        ar: لم تكن قد وُلدت، ولا أختك. لكنّ دعاء الوالدين قد ينطلق أحيانًا قبل الأبناء أنفسهم.
        en: No. Nor was your sister. But a parent's prayer sometimes sets off before the child does.
  - setting:
      ar_eg: تاني يوم، مكتب جرنال «وارتا پيسيسير» في سورونج. پاك يافت، رئيس التحرير، بيقرا مسوّدة بايو وفي إيده قلم أحمر.
      ar: في اليوم التالي، مكتب صحيفة «وارتا بيسيسير» في سورونغ. يقرأ باك يافت، رئيس التحرير، مسوّدة بايو وبيده قلم أحمر.
      en: The next day, the Warta Pesisir office in Sorong. Pak Yafet, the editor, reads Bayu's draft with a red pen in hand.
    lines:
      - speaker: Pak Yafet
        text: Bayu, ko punya bahan yang bagus sekali. Tapi coba dengar paragraf ini.
        ar_eg: يا بايو، عندك مادّة حلوة أوي. بس اسمع الفقرة دي كده.
        ar: يا بايو، لديك مادّة رائعة. لكن أصغِ إلى هذه الفقرة.
        en: Bayu, you've got excellent material. But listen to this paragraph.
      - speaker: Pak Yafet
        text: '"Pada tahun 1998 rupiah jatuh. Rupiah jatuh sehingga harga naik. Harga naik setiap hari. Bapak saya bekerja di warung. Bapak saya melihat harga naik."'
        ar_eg: «سنة ١٩٩٨ الروپية وقعت. الروپية وقعت فالأسعار غليت. الأسعار غليت كل يوم. أبويا كان بيشتغل في وارونج. أبويا شاف الأسعار بتغلى.»
        ar: «في عام ١٩٩٨ هوت الروبية. هوت الروبية فارتفعت الأسعار. ارتفعت الأسعار كلّ يوم. كان أبي يعمل في وارونغ. رأى أبي الأسعار ترتفع.»
        en: '"In 1998 the rupiah fell. The rupiah fell so prices rose. Prices rose every day. My father worked at a warung. My father saw prices rise."'
      - speaker: Bayu
        text: Aduh. Kalau dibaca keras-keras, kedengarannya seperti mesin fotokopi.
        ar_eg: يا نهار. لما تتقري بصوت عالي، تبان زي مكنة التصوير.
        ar: يا إلهي. حين تُقرأ بصوت عالٍ تبدو كآلة نسخ.
        en: Oh no. Read aloud, it sounds like a photocopier.
      - speaker: Pak Yafet
        text: Itu karena ko ulang kata yang sama terus. Pakai kohesi. Dengar, "Rupiah jatuh sehingga harga naik setiap hari. Ayah saya, yang saat itu bekerja di sebuah warung, menyaksikannya sendiri." Kata "-nya" itu menunjuk ke kenaikan harga tadi. Pembaca tidak capek.
        ar_eg: ده عشان انت بتكرّر نفس الكلمة على طول. استعمل الترابط. اسمع - «الروپية وقعت فالأسعار فضلت تغلى كل يوم. وأبويا، اللي كان ساعتها بيشتغل في وارونج، شاف ده بعينه.» الـ «-nya» دي بترجع على غلو الأسعار اللي فات. والقارئ مبيتعبش.
        ar: هذا لأنّك تكرّر الكلمة نفسها. استعمل الترابط. اسمع - «هوت الروبية فارتفعت الأسعار يومًا بعد يوم. وقد شهد أبي، الذي كان يعمل يومئذ في وارونغ، ذلك بنفسه.» فالضمير «-nya» يحيل إلى ارتفاع الأسعار المذكور. ولا يتعب القارئ.
        en: 'That''s because you keep repeating the same words. Use cohesion. Listen: "The rupiah fell, so prices rose every day. My father, who was working at a warung at the time, witnessed it himself." That "-nya" points back to the price rises. The reader doesn''t get tired.'
        note:
          ar_eg: الترابط النحوي (kohesi gramatikal) ليه ٣ أدوات - الإحالة (rujukan) بـ -nya وtersebut وitu، والاستبدال (substitusi) بـ begitu وdemikian، والحذف (elipsis) - تشيل الفاعل المتكرّر. زي الضمير العائد في العربي بالظبط.
          ar: للترابط النحوي (kohesi gramatikal) ثلاث أدوات - الإحالة (rujukan) بـ -nya وtersebut وitu، والاستبدال (substitusi) بـ begitu وdemikian، والحذف (elipsis) أي إسقاط الفاعل المتكرّر. وهي تشبه الضمير العائد في العربية.
          en: 'Grammatical cohesion has three tools: reference (rujukan) with -nya, tersebut and itu; substitution (substitusi) with begitu and demikian; and ellipsis (elipsis), dropping a repeated subject. Much like the Arabic returning pronoun.'
      - speaker: Bayu
        text: Jadi rujukan, substitusi, dan elipsis. Tiga alat supaya kalimat-kalimat saling berpegangan tangan.
        ar_eg: يعني إحالة واستبدال وحذف. تلات أدوات عشان الجمل تمسك في إيد بعض.
        ar: إذن الإحالة والاستبدال والحذف. ثلاث أدوات تجعل الجمل يمسك بعضها بيد بعض.
        en: So reference, substitution and ellipsis. Three tools that make sentences hold hands.
      - speaker: Pak Yafet
        text: Nah. Sekarang tambahkan suara dari Papua. Waktu Reformasi, sa masih SMA di Manokwari.
        ar_eg: بالظبط. دلوقتي ضيف صوت من پاپوا. أيام الإصلاح، أنا كنت لسه في ثانوي في مانوكواري.
        ar: أحسنت. والآن أضف صوتًا من بابوا. في أيّام الإصلاح كنت ما أزال في الثانوية في مانوكواري.
        en: Right. Now add a voice from Papua. At the time of Reformasi, I was still at high school in Manokwari.
      - speaker: Bayu
        text: Apa yang paling Bapak ingat?
        ar_eg: إيه أكتر حاجة فاكرها حضرتك؟
        ar: ما أكثر ما تتذكّره يا باك؟
        en: What do you remember most, Pak?
      - speaker: Pak Yafet
        text: Yang paling sa ingat justru sesudahnya. Pada malam pergantian tahun 2000, Presiden Gus Dur datang ke Jayapura dan mengembalikan nama "Papua". Sebelumnya, nama resminya Irian Jaya.
        ar_eg: أكتر حاجة فاكرها جت بعدها. ليلة رأس سنة ٢٠٠٠، الرئيس «جوس دور» جه جاياپورا ورجّع اسم «پاپوا». قبلها، الاسم الرسمي كان «إريان جايا».
        ar: أكثر ما أتذكّره جاء بعد ذلك. ليلة رأس سنة ٢٠٠٠ جاء الرئيس «غوس دور» إلى جايابورا وأعاد اسم «بابوا». وكان الاسم الرسمي قبلها «إريان جايا».
        en: What I remember most actually came afterwards. On New Year's Eve 2000, President Gus Dur came to Jayapura and gave back the name "Papua". Before that, the official name was Irian Jaya.
        note:
          ar_eg: «جوس دور» هو الرئيس عبد الرحمن واحد (١٩٩٩-٢٠٠١)، عالم دين معروف بحبّه للتسامح. أعلن رجوع اسم «پاپوا» في جاياپورا مع بداية سنة ٢٠٠٠، واتثبّت بعدها في قانون الحكم الذاتي الخاص سنة ٢٠٠١.
          ar: «غوس دور» هو الرئيس عبد الرحمن واحد (١٩٩٩-٢٠٠١)، العالم الديني المعروف بنزعته إلى التسامح. أعلن عودة اسم «بابوا» في جايابورا مطلع عام ٢٠٠٠، ثمّ ثُبّت ذلك في قانون الحكم الذاتي الخاص عام ٢٠٠١.
          en: Gus Dur is President Abdurrahman Wahid (1999-2001), a Muslim scholar known for championing tolerance. He announced the return of the name Papua in Jayapura at the turn of 2000; it was later fixed in the 2001 Special Autonomy law.
      - speaker: Pak Yafet
        text: Bagi bapak sa, itu bukan sekadar nama. Rasanya seperti orang akhirnya memanggil ko dengan nama yang diberikan mamamu sendiri.
        ar_eg: بالنسبة لأبويا، ده ماكانش مجرد اسم. كان إحساسه كأن الناس أخيرًا بقوا ينادوك بالاسم اللي أمّك سمّتهولك.
        ar: لم يكن ذلك عند أبي مجرّد اسم. كان كأنّ الناس صاروا أخيرًا ينادونك بالاسم الذي سمّتك به أمّك.
        en: For my father, it wasn't just a name. It felt like people finally calling you by the name your own mother gave you.
      - speaker: Bayu
        text: Kalau begitu, judulnya saya ubah. Bukan "Sejarah 1998", tetapi "Nama, Harga, dan Harapan - Reformasi dari Madiun sampai Manokwari".
        ar_eg: يبقى هغيّر العنوان. مش «تاريخ ١٩٩٨»، لكن «الاسم والسعر والأمل - الإصلاح من ماديون لمانوكواري».
        ar: إذن سأغيّر العنوان. لا «تاريخ ١٩٩٨»، بل «الاسم والسعر والأمل - الإصلاح من ماديون إلى مانوكواري».
        en: Then I'll change the title. Not "History of 1998", but "Names, Prices and Hope - Reformasi from Madiun to Manokwari".
      - speaker: Pak Yafet
        text: Judulnya panjang. Tapi... sa suka. Kirim malam ini, besok pagi kita terbitkan.
        ar_eg: العنوان طويل. بس... عاجبني. ابعتها الليلة، وبكرة الصبح ننشرها.
        ar: العنوان طويل. لكن... يعجبني. أرسلها الليلة، وننشرها صباح الغد.
        en: Long title. But... I like it. Send it tonight; we'll publish tomorrow morning.
