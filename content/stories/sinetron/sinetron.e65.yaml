questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: پاك بودي كان بيشتغل إيه سنة ١٩٩٨؟
      ar: ماذا كان عمل باك بودي عام ١٩٩٨؟
      en: What was Pak Budi's job in 1998?
    options: ["juru masak di warung orang", "pemilik warung di Gang Melati", "tukang becak", "wartawan"]
    answer: 0
  - id: q02
    type: fill_blank
    sentence: Porsinya kami kecilkan sedikit, tapi harganya tidak kami ___.
    meaning:
      ar_eg: صغّرنا الطبق شوية، بس مغلّيناش السعر.
      ar: صغّرنا الحصص قليلًا، لكنّنا لم نرفع السعر.
      en: We made the portions a bit smaller, but we didn't raise the price.
    answers: [naikkan]
    options: ["hapus", "tonton", "naikkan"]
  - id: q03
    type: listen
    text: Pada malam pergantian tahun 2000, Presiden Gus Dur datang ke Jayapura dan mengembalikan nama Papua.
    question:
      ar_eg: الرئيس «جوس دور» عمل إيه في جاياپورا؟
      ar: ماذا فعل الرئيس «غوس دور» في جايابورا؟
      en: What did President Gus Dur do in Jayapura?
    options: ["menutup gedung DPR", "membuka sekolah di Manokwari", "mengembalikan nama Papua"]
    answer: 2
    meaning:
      ar_eg: ليلة رأس سنة ٢٠٠٠، الرئيس «جوس دور» جه جاياپورا ورجّع اسم «پاپوا».
      ar: ليلة رأس سنة ٢٠٠٠ جاء الرئيس «غوس دور» إلى جايابورا وأعاد اسم «بابوا».
      en: On New Year's Eve 2000, President Gus Dur came to Jayapura and gave back the name Papua.
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: پاك بودي قصده إيه بـ «دعوة الأهل ساعات بتسافر قبل العيل نفسه»؟
      ar: ماذا يقصد باك بودي بقوله «دعاء الوالدين قد ينطلق قبل الأبناء أنفسهم»؟
      en: What does Pak Budi mean by "a parent's prayer sometimes sets off before the child does"?
    options: ["Orang tua berdoa sebelum anaknya bepergian.", "Orang tua harus bangun lebih pagi daripada anaknya.", "Anak-anak harus berangkat sekolah lebih dulu.", "Harapan orang tua untuk anaknya sudah ada sebelum anak itu lahir."]
    answer: 3
  - id: q05
    type: translate
    direction: from_target
    source_text: Kalau mereka tidak makan, kita juga tidak makan.
    answers_meaning:
      ar_eg: ["لو هم ماكلوش، احنا كمان مش هناكل.", "لو هم مش هياكلوا، احنا كمان مش هناكل.", "لو هم جاعوا، احنا كمان هنجوع."]
      ar: ["إن لم يأكلوا هم، لن نأكل نحن أيضًا.", "إذا لم يأكلوا فلن نأكل نحن كذلك.", "إن جاعوا جعنا نحن أيضًا."]
      en: ["If they don't eat, we don't eat either.", "If they can't eat, neither can we.", "If they go hungry, so do we."]
