title:
  target: Tiketnya Sudah Dipesan!
  ar_eg: التذاكر اتحجزت!
  ar: حُجزت التذاكر!
  en: The Tickets Are Booked!
summary:
  ar_eg: ساري هتتخرّج في أغسطس، فباك بودي وبو راهايو بيروحوا مكتب الجوازات لأول مرّة في حياتهم. وبالليل، بو راهايو بتطلّع سرّ مستخبّي من سنة… والتذاكر بتتحجز أخيرًا.
  ar: ستتخرّج ساري في أغسطس، فيذهب باك بودي وبو راهايو إلى مكتب الهجرة لأوّل مرّة في حياتهما. وفي الليل تكشف بو راهايو سرًّا مخبّأً منذ عام… وتُحجز التذاكر أخيرًا.
  en: Sari graduates in August, so Pak Budi and Bu Rahayu visit the immigration office for the first time in their lives. That night, Bu Rahayu reveals a secret she's kept for a year… and the tickets are finally booked.
cast: [Sari, Pak Budi, Bu Rahayu, Bayu, Petugas, Hagga Fatma, Mas Joko]
scenes:
  - setting:
      ar_eg: مكتب الهجرة والجوازات في ماديون، الصبح. باك بودي لابس أحسن قميص باتيك عنده، وماسك ملف فيه كل الورق - ونسخة احتياطي من كل ورقة.
      ar: مكتب الهجرة في ماديون، صباحًا. يرتدي باك بودي أفضل قميص باتيك لديه، ويمسك ملفًّا فيه كل الأوراق - ونسخة احتياطية من كل ورقة.
      en: The immigration office in Madiun, morning. Pak Budi is wearing his best batik shirt and holding a folder with every document — and a spare copy of each.
    lines:
      - speaker: Narrator
        text: Kemarin Sari menelepon. Rencananya, wisuda Sari akan diadakan pada akhir bulan Agustus.
        ar_eg: إمبارح ساري كلّمتهم. والمخطّط إن حفلة تخرّج ساري هتبقى آخر شهر أغسطس.
        ar: اتّصلت ساري أمس. ومن المقرّر أن يُقام حفل تخرّجها في أواخر شهر أغسطس.
        en: Sari rang yesterday. Her graduation is planned for the end of August.
        note:
          ar_eg: rencananya = «المخطّط إن / النيّة إن»، وakan = علامة المستقبل («هـ»)، وnanti = «بعدين / لمّا ييجي الوقت». الإندونيسي مفيهوش تصريف للمستقبل، الكلمات دي هي اللي بتقول.
          ar: rencananya تعني «من المقرّر أن»، وakan علامة المستقبل («سـ»)، وnanti تعني «لاحقًا / حين يحين الوقت». ولا تصريف للمستقبل في الإندونيسية، فهذه الكلمات تؤدّي المعنى.
          en: rencananya = "the plan is…", akan marks the future ("will"), nanti = "later / when the time comes". Indonesian verbs don't change for the future — these words do the job.
      - speaker: Petugas
        text: Selamat pagi, Pak, Bu. Ini pertama kali membuat paspor? Tujuannya ke mana?
        ar_eg: صباح الخير يا باك، يا بو. دي أول مرّة تطلّعوا باسبور؟ رايحين فين إن شاء الله؟
        ar: صباح الخير يا سيدي، يا سيدتي. هل هذه أول مرّة تستخرجان جواز سفر؟ وإلى أين وجهتكما؟
        en: Good morning, sir, madam. Is this your first passport? Where are you travelling to?
      - speaker: Pak Budi
        text: Ke Mesir, Pak. Kami akan menghadiri wisuda anak kami di Universitas Al-Azhar.
        ar_eg: مصر يا أستاذ. هنحضر حفلة تخرّج بنتنا في جامعة الأزهر.
        ar: إلى مصر يا سيدي. سنحضر حفل تخرّج ابنتنا في جامعة الأزهر.
        en: Egypt, sir. We're going to attend our daughter's graduation at Al-Azhar University.
      - speaker: Bu Rahayu
        text: Bapak udah bilang gitu ke semua orang di gang, Pak. Dua kali.
        ar_eg: هو قال كده لكل الناس في الحارة يا أستاذ. مرّتين.
        ar: لقد قال ذلك لكل الناس في الزقاق يا سيدي. مرّتين.
        en: He's told everyone in our lane that, sir. Twice.
        note:
          ar_eg: باك بودي بيكلّم الموظّف رسمي (Kami akan menghadiri…)، وبو راهايو مؤدّبة بس بتتكلّم عادي - udah = sudah، وgitu = begitu، وke = kepada. وbilang = يقول.
          ar: يكلّم باك بودي الموظّف بالفصحى (Kami akan menghadiri…)، وبو راهايو مهذّبة لكنها تتكلّم بعامّية - udah = sudah، وgitu = begitu، وke = kepada. وbilang = يقول.
          en: Pak Budi speaks formally to the official (Kami akan menghadiri…); Bu Rahayu is polite but chatty — udah = sudah, gitu = begitu, ke = kepada. bilang = say.
      - speaker: Petugas
        text: Selamat, Pak! Sekarang foto dulu. Lihat ke kamera, ya.
        ar_eg: مبروك يا باك! دلوقتي نتصوّر الأول. بصّ للكاميرا.
        ar: مبارك يا سيدي! والآن الصورة أوّلًا. انظر إلى الكاميرا.
        en: Congratulations, sir! Now, the photo first. Look at the camera, please.
      - speaker: Narrator
        text: Klik! Di foto paspornya, Pak Budi tersenyum lebar sekali.
        ar_eg: تِك! في صورة الباسبور، باك بودي مبتسم من الودن للودن.
        ar: تِك! في صورة جواز السفر يبتسم باك بودي ابتسامة عريضة جدًّا.
        en: Click! In his passport photo, Pak Budi is grinning from ear to ear.
      - speaker: Petugas
        text: Paspornya akan selesai dalam beberapa hari kerja. Visa Mesirnya nanti diurus sendiri, ya, Pak.
        ar_eg: الباسبور هيخلص في كام يوم شغل. وفيزا مصر تطلّعوها انتو بعدين.
        ar: سيكون الجواز جاهزًا خلال بضعة أيّام عمل. أمّا تأشيرة مصر فتستخرجانها بنفسيكما لاحقًا.
        en: The passport will be ready in a few working days. The Egyptian visa you'll sort out yourselves later, sir.
      - speaker: Sari
        text: Tenang, Pak. Nanti visanya aku bantu urus. Bapak sama Ibu tinggal berangkat aja!
        ar_eg: متقلقش يا بابا. الفيزا أنا هساعدكم فيها. انتو بس اركبوا الطيارة!
        ar: لا تقلق يا أبي. سأساعدكما في التأشيرة لاحقًا. ما عليكما إلا السفر!
        en: Don't worry, Dad. I'll help you sort out the visa. All you two have to do is leave!
        note:
          ar_eg: urus = يخلّص (ورق)، وtinggal … aja = «مش ناقص غير…». وساري بتقول aku لأهلها.
          ar: urus = ينجز (الأوراق)، وtinggal … aja = «لم يبقَ إلا…». وساري تقول aku لوالديها.
          en: urus = sort out (paperwork); tinggal … aja = "all that's left is…". Sari says aku to her parents.
  - setting:
      ar_eg: الوارونج بالليل بعد ما قفل. بايو فاتح اللابتوب على موقع حجز تذاكر، والقاهرة على الفيديو.
      ar: الوارونغ ليلًا بعد الإغلاق. يفتح بايو الحاسوب على موقع حجز تذاكر، والقاهرة على الاتصال المرئي.
      en: The warung at night, after closing. Bayu has a ticket-booking site open on the laptop, and Cairo is on video.
    lines:
      - speaker: Bayu
        text: Rencananya Bapak sama Ibu berangkat awal Agustus, kan? Dari Surabaya ke Jakarta, terus ke Kairo.
        ar_eg: المخطّط إن بابا وماما يسافروا أوّل أغسطس، صح؟ من سورابايا لجاكرتا، وبعدين القاهرة.
        ar: من المقرّر أن يسافر أبي وأمي في أوائل أغسطس، أليس كذلك؟ من سورابايا إلى جاكرتا، ثم إلى القاهرة.
        en: So the plan is for you to leave at the start of August, right? Surabaya to Jakarta, then on to Cairo.
      - speaker: Sari
        text: Iya! Jadi Bapak sama Ibu bisa ikut upacara 17 Agustus di KBRI Kairo juga.
        ar_eg: آه! كده تقدروا كمان تحضروا احتفال ١٧ أغسطس في السفارة الإندونيسية في القاهرة.
        ar: نعم! وهكذا يمكنكما أيضًا حضور مراسم ١٧ أغسطس في السفارة الإندونيسية بالقاهرة.
        en: Yes! That way you can also join the 17 August ceremony at the Indonesian embassy in Cairo.
        note:
          ar_eg: ١٧ أغسطس ١٩٤٥ هو يوم استقلال إندونيسيا. وKBRI اختصار «سفارة جمهورية إندونيسيا»، والإندونيسيين برّه بيحتفلوا هناك برفع العلم ومسابقات.
          ar: ١٧ أغسطس ١٩٤٥ يوم استقلال إندونيسيا. وKBRI اختصار «سفارة جمهورية إندونيسيا»، ويحتفل فيها الإندونيسيون في الخارج برفع العلم والمسابقات.
          en: 17 August 1945 is Indonesia's Independence Day. KBRI stands for the Embassy of the Republic of Indonesia; Indonesians abroad celebrate there with a flag ceremony and games.
      - speaker: Bayu
        text: Lho, Pak, katanya Lebaran di Kairo?
        ar_eg: بس يا بابا، مش انت قلت العيد في القاهرة؟
        ar: لكن يا أبي، ألم تقل إن العيد سيكون في القاهرة؟
        en: But Dad, didn't you say Lebaran in Cairo?
      - speaker: Pak Budi
        text: Lebaran masih lama, Le. Wisuda Mbak Sari lebih dulu! Ini mudik terbalik. Orang tua yang mudik ke anaknya.
        ar_eg: العيد لسه بدري يا ابني. تخرّج أختك الأول! ودي رحلة رجوع بالمقلوب - الأهل هما اللي بيرجعوا لعيالهم.
        ar: العيد ما زال بعيدًا يا بنيّ. تخرّج أختك أوّلًا! هذه عودة معكوسة، فالوالدان هما من يعودان إلى ابنتهما.
        en: Lebaran's a long way off, son. Your sister's graduation comes first! It's mudik in reverse — the parents travelling home to their child.
        note:
          ar_eg: الـ mudik (الرجوع للبلد في العيد) من أكبر هجرات الناس في العالم كل سنة. وباك بودي بيهزّر - المرة دي الأهل هما اللي مسافرين.
          ar: الـ mudik (العودة إلى البلدة في العيد) من أكبر هجرات البشر السنوية في العالم. وباك بودي يمزح، فالوالدان هذه المرة هما المسافران.
          en: mudik (going home for Lebaran) is one of the world's biggest annual migrations. Pak Budi is joking — this time it's the parents doing the travelling.
      - speaker: Bayu
        text: Terus aku gimana? Aku mau ikut!
        ar_eg: طب وأنا؟ أنا عايز آجي!
        ar: وأنا؟ أريد أن أذهب معكم!
        en: And what about me? I want to come!
        note:
          ar_eg: terus = lalu (طب / وبعدين)، وgimana = bagaimana (إزاي / إيه).
          ar: terus = lalu (ثمّ)، وgimana = bagaimana (كيف).
          en: terus = lalu (then), gimana = bagaimana (how / what about).
      - speaker: Bu Rahayu
        text: Bulan Agustus kamu sekolah, Le. Nanti kamu yang jaga warung sama Mas Joko.
        ar_eg: في أغسطس عندك مدرسة يا ابني. وانت اللي هتمسك الوارونج مع ماس جوكو.
        ar: في أغسطس لديك مدرسة يا بنيّ. وستكون أنت من يرعى الوارونغ مع ماس جوكو.
        en: In August you've got school, son. You'll be the one looking after the warung, with Mas Joko.
        note:
          ar_eg: jaga = menjaga (يمسك / يحرس)، وsama = dengan (مع). وفي الكلام nanti لوحدها بتكفي للمستقبل من غير akan.
          ar: jaga = menjaga (يرعى / يحرس)، وsama = dengan (مع). وفي الكلام تكفي nanti للمستقبل دون akan.
          en: jaga = menjaga (look after), sama = dengan (with). In speech, nanti alone is enough for the future — no akan needed.
      - speaker: Mas Joko
        text: Tenang, Bu. Saya janji nggak bakal makan semua pisang goreng.
        ar_eg: متقلقيش يا بو. أوعدك مش هاكل كل الموز المقلي.
        ar: لا تقلقي يا بو. أعدكِ ألّا آكل كل الموز المقلي.
        en: Don't worry, Bu. I promise I won't eat all the fried bananas.
        note:
          ar_eg: bakal = akan (هـ) في الكلام، وjanji = berjanji (يوعد).
          ar: bakal = akan (سـ) في الكلام، وjanji = berjanji (يَعِد).
          en: bakal = akan (will) in speech; janji = berjanji (promise).
      - speaker: Pak Budi
        text: Tapi Bu... harga tiketnya. Mahal banget.
        ar_eg: بس يا رهايو... سعر التذاكر. غالي أوي.
        ar: لكن يا راهايو... ثمن التذاكر. غالٍ جدًّا.
        en: But dear... the price of the tickets. It's so expensive.
      - speaker: Bu Rahayu
        text: Dari tahun lalu, waktu Bapak bilang "tiketnya mahal", Ibu udah nabung tiap minggu. Diam-diam.
        ar_eg: من السنة اللي فاتت، من ساعة ما قلت «التذكرة غالية»، وأنا بحوّش كل أسبوع. من غير ما حدّ يعرف.
        ar: منذ العام الماضي، حين قلتَ «التذكرة غالية»، وأنا أدّخر كل أسبوع. سرًّا.
        en: Ever since last year, when you said "the tickets are expensive", I've been saving every week. Secretly.
        note:
          ar_eg: nabung = menabung (يحوّش)، وtiap = setiap، وdari = sejak (من ساعة) في الكلام. وdiam-diam = من غير ما حدّ يعرف، وbilang = قال.
          ar: nabung = menabung (يدّخر)، وtiap = setiap، وdari = sejak (منذ) في الكلام. وdiam-diam = سرًّا، وbilang = قال.
          en: nabung = menabung (save money), tiap = setiap, dari = sejak (since) in speech. diam-diam = secretly; bilang = said.
      - speaker: Hagga Fatma
        text: Masyaallah, Bu Rahayu! Kamarnya udah saya siapin. Masih kosong, nungguin kalian!
        ar_eg: ما شاء الله يا بو راهايو! الأوضة جهّزتها خلاص. لسه فاضية ومستنياكم!
        ar: ما شاء الله يا بو راهايو! لقد جهّزت الغرفة. ما زالت شاغرة وتنتظركم!
        en: Masha'Allah, Bu Rahayu! I've got the room ready. It's still free, waiting for you!
        note:
          ar_eg: siapin = siapkan (يجهّز)، وnungguin = menunggu (مستنّي) - ‎-in تاني.
          ar: siapin = siapkan (يجهّز)، وnungguin = menunggu (ينتظر) - مع ‎-in العامّية.
          en: siapin = siapkan (get ready), nungguin = menunggu (wait for) — the street -in again.
      - speaker: Bayu
        text: Klik... Tiketnya udah dipesan!
        ar_eg: تِك... التذاكر اتحجزت!
        ar: نقرة... حُجزت التذاكر!
        en: Click... The tickets are booked!
        note:
          ar_eg: udah dipesan = sudah dipesan (اتحجزت)، من memesan (يحجز).
          ar: udah dipesan = sudah dipesan (حُجزت)، من memesan (يحجز).
          en: udah dipesan = sudah dipesan (booked), from memesan (to book).
      - speaker: Narrator
        text: Pak Budi belum pernah naik pesawat. Tapi bulan Agustus nanti, dia akan terbang ke Kairo.
        ar_eg: باك بودي عمره ما ركب طيارة. بس في أغسطس الجاي، هيطير للقاهرة.
        ar: لم يركب باك بودي طائرة قطّ. لكنه في أغسطس القادم سيطير إلى القاهرة.
        en: Pak Budi has never been on a plane. But this coming August, he'll fly to Cairo.
new_words:
  - word: rencananya
    ar_eg: المخطّط إن…
    ar: من المقرّر أن…
    en: the plan is…, it's planned that…
  - word: akan
    ar_eg: هـ (للمستقبل)
    ar: سـ / سوف
    en: will (future)
  - word: paspor
    pos: noun
    ar_eg: باسبور
    ar: جواز سفر
    en: passport
  - word: memesan
    pos: verb
    ar_eg: يحجز / يطلب
    ar: يحجز / يطلب
    en: to book, to order
  - word: menabung
    pos: verb
    ar_eg: يحوّش فلوس
    ar: يدّخر
    en: to save (money)
  - word: menghadiri
    pos: verb
    arabic: حاضر
    ar_eg: يحضر
    ar: يحضر
    en: to attend
questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: حفلة تخرّج ساري إمتى؟
      ar: متى حفل تخرّج ساري؟
      en: When is Sari's graduation?
    options: ["pada hari Lebaran", "pada tanggal 17 Agustus", "pada awal Agustus", "pada akhir bulan Agustus"]
    answer: 3
  - id: q02
    type: fill_blank
    sentence: Kami ___ menghadiri wisuda anak kami di Universitas Al-Azhar.
    meaning:
      ar_eg: هنحضر حفلة تخرّج بنتنا في جامعة الأزهر.
      ar: سنحضر حفل تخرّج ابنتنا في جامعة الأزهر.
      en: We're going to attend our daughter's graduation at Al-Azhar University.
    answers: [akan]
    options: ["sudah", "akan", "pernah"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه بايو مش هيسافر مع أهله؟
      ar: لماذا لن يسافر بايو مع والديه؟
      en: Why isn't Bayu travelling with his parents?
    options: ["Karena dia sekolah dan akan menjaga warung.", "Karena dia takut naik pesawat.", "Karena dia tidak punya paspor."]
    answer: 0
  - id: q04
    type: listen
    text: Dari tahun lalu, Ibu udah nabung tiap minggu. Diam-diam.
    question:
      ar_eg: بو راهايو كانت بتعمل إيه من السنة اللي فاتت؟
      ar: ماذا كانت بو راهايو تفعل منذ العام الماضي؟
      en: What has Bu Rahayu been doing since last year?
    options: ["Dia belajar bahasa Arab.", "Dia menabung uang untuk tiket.", "Dia membuat paspor."]
    answer: 1
    meaning:
      ar_eg: من السنة اللي فاتت وأنا بحوّش كل أسبوع. من غير ما حدّ يعرف.
      ar: منذ العام الماضي وأنا أدّخر كل أسبوع. سرًّا.
      en: Ever since last year, I've been saving every week. Secretly.
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: التذاكر اتحجزت!
      ar: حُجزت التذاكر!
      en: The tickets have been booked!
    answers: ["Tiketnya udah dipesan!", "Tiketnya udah dipesan", "Tiketnya sudah dipesan!", "Tiketnya sudah dipesan", "Tiket sudah dipesan!", "Tiket sudah dipesan", "Tiketnya telah dipesan!", "Tiketnya sudah dibeli!", "Tiket-tiketnya sudah dipesan!", "Tiketnya sudah dibooking!", "Kami sudah memesan tiketnya!"]
next:
  ar_eg: بايو لازم يكتب موضوع تعبير عن الشغلانة اللي نفسه فيها - طبّاخ ولا صحفي؟ وفي القاهرة، كريم بيستقبل أول مجموعة إندونيسية في شغله الجديد كمرشد.
  ar: على بايو أن يكتب موضوعًا عن المهنة التي يحلم بها - طاهٍ أم صحفي؟ وفي القاهرة يستقبل كريم أوّل مجموعة إندونيسية في عمله الجديد مرشدًا.
  en: Bayu has to write an essay about his dream job — chef or journalist? And in Cairo, Karim meets the first Indonesian group of his new job as a guide.
