title:
  target: Mohon Maaf Lahir dan Batin
  ar_eg: سامحونا ظاهرًا وباطنًا
  ar: نلتمس العفو ظاهرًا وباطنًا
  en: Forgive Me, Body and Soul
summary:
  ar_eg: الدكتورة بتطمّن على پاك بودي وبتشرح له الدوا. وصباح العيد العيلة كلها مع بعض، والقاهرة على الفيديو... وپاك بودي عنده إعلان.
  ar: تطمئن الطبيبة على باك بودي وتشرح له الدواء. وفي صباح العيد تجتمع العائلة كلّها، والقاهرة على الاتصال المرئي... ولدى باك بودي إعلان.
  en: The doctor checks on Pak Budi and explains his medicine. On Lebaran morning the whole family is together, Cairo is on video... and Pak Budi has an announcement.
cast: [Dokter Wulan, Pak Budi, Sari, Bu Rahayu, Bayu, Karim, Nadia, Hagga Fatma]
scenes:
  - setting:
      ar_eg: عيادة صغيرة في ماديون، قبل العيد بيومين. ساري معاها أبوها.
      ar: عيادة صغيرة في ماديون قبل العيد بيومين. ساري ترافق أباها.
      en: A small clinic in Madiun, two days before Lebaran. Sari has come with her dad.
    lines:
      - speaker: Narrator
        text: Klinik di Madiun. Dua hari sebelum Lebaran.
        ar_eg: عيادة في ماديون. قبل العيد بيومين.
        ar: عيادة في ماديون. قبل العيد بيومين.
        en: A clinic in Madiun. Two days before Lebaran.
      - speaker: Dokter Wulan
        text: Selamat pagi, Pak Budi. Bagaimana? Masih pusing?
        ar_eg: صباح الخير يا پاك بودي. إزيّك؟ لسه عندك دوخة؟
        ar: صباح الخير يا باك بودي. كيف حالك؟ أما زلت تشعر بالدوار؟
        en: Good morning, Pak Budi. How are you? Still dizzy?
      - speaker: Pak Budi
        text: Tidak, Bu Dokter. Sekarang saya merasa lebih sehat. Kadang-kadang agak lemas.
        ar_eg: لأ يا دكتورة. دلوقتي حاسس إني أحسن. ساعات بس بحسّ بشوية هبوط.
        ar: لا يا دكتورة. أشعر الآن بصحّة أفضل، وأحيانًا أشعر ببعض الوهن.
        en: No, Doctor. I feel healthier now. Sometimes a bit weak.
        note:
          ar_eg: الإندونيسيين بيقولوا للدكتورة «Bu Dokter» وللدكتور «Pak Dokter» - لقب الاحترام قبل المهنة.
          ar: يخاطب الإندونيسيون الطبيبة بـ «Bu Dokter» والطبيب بـ «Pak Dokter»، أي لقب الاحترام قبل المهنة.
          en: Indonesians call a doctor "Bu Dokter" (woman) or "Pak Dokter" (man) — the respect title comes first.
      - speaker: Sari
        text: Bu Dokter, Bapak sering kurang tidur.
        ar_eg: يا دكتورة، بابا كتير مش بينام كفاية.
        ar: يا دكتورة، أبي كثيرًا ما لا ينام بما يكفي.
        en: Doctor, Dad often doesn't get enough sleep.
      - speaker: Dokter Wulan
        text: Pak, tidur yang cukup, ya. Dan ini obatnya. Tablet ini diminum dua kali sehari, sesudah makan.
        ar_eg: يا پاك، نام كويس، ماشي؟ ودي الأدوية. الأقراص دي تتاخد مرتين في اليوم، بعد الأكل.
        ar: يا باك، نَم بما يكفي. وهذا هو الدواء. تؤخذ هذه الأقراص مرّتين يوميًّا بعد الأكل.
        en: Pak, get enough sleep, okay? And here's your medicine. Take this tablet twice a day, after meals.
        note:
          ar_eg: على علب الدوا هتلاقي «diminum 2 kali sehari» يعني «يُشرب/يُؤخذ مرتين في اليوم». في الإندونيسي الأقراص كمان «بتتشرب»، مش «بتتاخد».
          ar: على علب الدواء تجد «diminum 2 kali sehari» أي «يُؤخذ مرّتين يوميًّا». وفي الإندونيسية تُشرب الأقراص أيضًا (diminum) لا «تؤخذ».
          en: On medicine boxes you'll read "diminum 2 kali sehari" — "taken twice a day". In Indonesian you "drink" (minum) tablets too.
      - speaker: Sari
        text: Sesudah makan? Tapi Bapak puasa, Bu Dokter.
        ar_eg: بعد الأكل؟ بس بابا صايم يا دكتورة.
        ar: بعد الأكل؟ لكن أبي صائم يا دكتورة.
        en: After meals? But Dad's fasting, Doctor.
      - speaker: Dokter Wulan
        text: Jadi, diminum sesudah buka puasa dan sesudah sahur.
        ar_eg: يبقى تتاخد بعد الفطار وبعد السحور.
        ar: إذن تؤخذ بعد الإفطار وبعد السحور.
        en: So take it after iftar and after sahur.
      - speaker: Pak Budi
        text: Bu Dokter, saya boleh naik pesawat?
        ar_eg: يا دكتورة، ينفع أركب طيارة؟
        ar: يا دكتورة، هل يمكنني ركوب الطائرة؟
        en: Doctor, am I allowed to fly?
      - speaker: Dokter Wulan
        text: Kalau Bapak sehat, boleh! Semoga cepat sembuh, Pak.
        ar_eg: لو صحتك كويسة، ينفع! ألف سلامة يا پاك.
        ar: إن كنت بصحّة جيّدة فلا بأس! نتمنّى لك الشفاء العاجل يا باك.
        en: If you're healthy, yes! Get well soon, Pak.
      - speaker: Pak Budi
        text: Amin. Insyaallah.
        ar_eg: آمين. إن شاء الله.
        ar: آمين. إن شاء الله.
        en: Amen. God willing.
  - setting:
      ar_eg: صباح العيد بعد صلاة العيد، في أوضة الضيوف. الموبايل على مكالمة فيديو مع القاهرة.
      ar: صباح العيد بعد صلاة العيد، في غرفة الضيوف. الهاتف في اتصال مرئي مع القاهرة.
      en: Lebaran morning, after the Eid prayer, in the front room. The phone is on a video call with Cairo.
    lines:
      - speaker: Narrator
        text: Hari Lebaran. Sesudah salat Id, keluarga Pak Budi berkumpul di ruang tamu.
        ar_eg: يوم العيد. بعد صلاة العيد، عيلة پاك بودي متجمّعة في أوضة الضيوف.
        ar: يوم العيد. بعد صلاة العيد، تجتمع عائلة باك بودي في غرفة الضيوف.
        en: Lebaran day. After the Eid prayer, Pak Budi's family gathers in the front room.
      - speaker: Sari
        text: Pak, Bu, mohon maaf lahir dan batin.
        ar_eg: بابا، ماما، سامحوني على أي حاجة، ظاهرة وباطنة.
        ar: أبي، أمي، أرجو أن تعفوا عنّي ظاهرًا وباطنًا.
        en: Dad, Mum, please forgive me, body and soul.
        note:
          ar_eg: في العيد الولاد بيقعدوا على ركبهم قدّام أهلهم ويبوسوا إيديهم ويطلبوا السماح - في جاوة اسمها sungkem. «lahir dan batin» من العربي «ظاهر وباطن».
          ar: في العيد يجثو الأبناء أمام آبائهم ويقبّلون أيديهم طالبين العفو، ويسمّى ذلك في جاوة sungkem. و«lahir dan batin» من العربية «ظاهر وباطن».
          en: At Lebaran, children kneel before their parents, kiss their hands and ask forgiveness — in Java this is sungkem. "lahir dan batin" comes from Arabic ظاهر وباطن (outward and inward).
      - speaker: Pak Budi
        text: Sama-sama, Nduk. Bapak juga minta maaf.
        ar_eg: وانتي كمان يا بنتي. وأنا كمان بطلب السماح.
        ar: وأنتِ كذلك يا ابنتي. وأنا أيضًا أطلب العفو.
        en: Same to you, sweetheart. I ask your forgiveness too.
      - speaker: Bayu
        text: Mohon maaf lahir dan batin, Pak, Bu! Ada amplop untuk saya?
        ar_eg: سامحوني يا بابا ويا ماما! فيه عيدية ليّا؟
        ar: أرجو العفو يا أبي ويا أمي! هل هناك عيديّة لي؟
        en: Forgive me, Dad, Mum! Is there an envelope for me?
        note:
          ar_eg: زي العيدية عندنا بالظبط - الكبار بيدّوا العيال فلوس في ظرف (amplop) يوم العيد.
          ar: تمامًا كالعيديّة عندنا، يعطي الكبار الصغار مالًا في ظرف (amplop) يوم العيد.
          en: Just like Egyptian eidiya — adults give children money in an envelope (amplop) on Eid.
      - speaker: Karim
        text: Selamat Idulfitri, Pak Budi, Bu Rahayu! Mohon maaf lahir dan batin.
        ar_eg: عيد فطر سعيد يا پاك بودي ويا بو راهايو! سامحونا.
        ar: عيد فطر سعيد يا باك بودي ويا بو راهايو! نرجو العفو.
        en: Happy Eid al-Fitr, Pak Budi, Bu Rahayu! Please forgive me, body and soul.
      - speaker: Nadia
        text: Selamat Lebaran dari Kairo! Kullu 'am wa antum bikhair!
        ar_eg: عيد سعيد من القاهرة! كل سنة وانتو طيبين!
        ar: عيد سعيد من القاهرة! كلّ عام وأنتم بخير!
        en: Happy Lebaran from Cairo! Many happy returns!
      - speaker: Hagga Fatma
        text: Pak Budi, semoga sehat selalu! Kamar di rumah saya masih kosong, ya!
        ar_eg: يا پاك بودي، ربنا يديم عليك الصحة! والأوضة اللي عندي لسه فاضية على فكرة!
        ar: يا باك بودي، أدام الله عليك الصحّة! والغرفة في بيتي ما زالت شاغرة!
        en: Pak Budi, wishing you good health always! The room at my house is still free, you know!
      - speaker: Pak Budi
        text: Ramadan ini berat. Tapi Lebaran ini paling indah.
        ar_eg: رمضان ده كان صعب. بس العيد ده أحلى عيد.
        ar: كان رمضان هذا ثقيلًا، لكن هذا العيد هو الأجمل.
        en: This Ramadan was hard. But this Lebaran is the most beautiful.
      - speaker: Pak Budi
        text: Dan tahun depan... insyaallah, Lebaran di Kairo!
        ar_eg: والسنة الجاية... إن شاء الله، العيد في القاهرة!
        ar: وفي العام القادم... إن شاء الله، العيد في القاهرة!
        en: And next year... God willing, Lebaran in Cairo!
      - speaker: Narrator
        text: Pak Budi belum pernah ke Mesir. Tapi sekarang dia sehat lagi.
        ar_eg: پاك بودي عمره ما راح مصر. بس دلوقتي صحته رجعت.
        ar: لم يزر باك بودي مصر قطّ. لكنه الآن استعاد صحّته.
        en: Pak Budi has never been to Egypt. But now he's healthy again.
