questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: پاك بودي لازم ياخد الأقراص كام مرة؟
      ar: كم مرّة يجب أن يأخذ باك بودي الأقراص؟
      en: How often does Pak Budi take the tablets?
    options: ["satu kali sehari", "tiga kali sehari", "dua kali sehari"]
    answer: 2
  - id: q02
    type: multiple_choice
    question_meaning:
      ar_eg: في رمضان، ياخد الدوا إمتى؟
      ar: متى يأخذ الدواء في رمضان؟
      en: During Ramadan, when should he take the medicine?
    options: ["sebelum salat Id", "sesudah buka puasa dan sesudah sahur", "jam dua belas siang", "sebelum tidur saja"]
    answer: 1
  - id: q03
    type: fill_blank
    sentence: Semoga cepat ___, Pak.
    meaning:
      ar_eg: ألف سلامة يا پاك (ربنا يشفيك بسرعة).
      ar: نتمنّى لك الشفاء العاجل يا باك.
      en: Get well soon, Pak.
    answers: [sembuh]
    options: ["sembuh", "pusing", "lemas"]
  - id: q04
    type: multiple_choice
    question_meaning:
      ar_eg: ساري قالت إيه لأهلها صباح العيد؟
      ar: ماذا قالت ساري لوالديها صباح العيد؟
      en: What does Sari say to her parents on Lebaran morning?
    options: ["Selamat ulang tahun!", "Selamat sahur!", "Sampai jumpa besok!", "Mohon maaf lahir dan batin."]
    answer: 3
  - id: q05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ألف سلامة! (ربنا يشفيك بسرعة)
      ar: نتمنّى لك الشفاء العاجل!
      en: Get well soon!
    answers: ["Semoga cepat sembuh!", "Semoga cepat sembuh", "Semoga lekas sembuh!", "Semoga lekas sembuh", "Mudah-mudahan cepat sembuh!", "Mudah-mudahan cepat sembuh", "Cepat sembuh, ya!", "Semoga cepat sembuh, ya!"]
next:
  ar_eg: بعد العيد ساري لازم ترجع القاهرة... بس المرة دي فيه حدّ تاني في البيت حضّر شنطته هو كمان.
  ar: بعد العيد يجب أن تعود ساري إلى القاهرة... لكن هذه المرة جهّز شخص آخر في البيت حقيبته هو أيضًا.
  en: After Lebaran, Sari has to fly back to Cairo... but this time, someone else in the house has packed a suitcase too.
