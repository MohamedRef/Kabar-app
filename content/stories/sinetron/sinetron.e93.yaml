title:
  target: Ndherek langkung
  ar_eg: عن إذنكم، هعدّي
  ar: عن إذنكم، سأمرّ
  en: Excuse me, may I pass
summary:
  ar_eg: في قصر الميّة تامان ساري، المرشد پاك واهيو بيورّي كريم إزاي الجاويين بيتكلّموا بجسمهم - يشاوروا بالإبهام، يدّوا الحاجة باليمين، ويوطّوا وهم بيعدّوا قدّام الكبار. وفي بيت مباه پوتري، كريم بيعمل كل ده... تقريبًا.
  ar: في قصر الماء تامان ساري، يُري المرشد باك واهيو كريمًا كيف يتكلّم الجاويون بأجسادهم - يشيرون بالإبهام، ويناولون باليمنى، وينحنون حين يمرّون أمام الكبار. وفي بيت مباه بوتري يفعل كريم كلّ ذلك... تقريبًا.
  en: At the Taman Sari water palace, the guide Pak Wahyu shows Karim how Javanese people speak with their bodies - point with the thumb, hand things over with the right hand, stoop when passing seated elders. At Mbah Putri's house, Karim does it all... almost.
cast: [Karim, Pak Wahyu, Mas Dimas, Mbah Putri]
scenes:
  - setting:
      ar_eg: تامان ساري، قصر الميّة القديم بتاع السلاطين، الصبح. أحواض ميّة زرقا وحيطان بيضا قديمة. پاك واهيو، مرشد في الخمسينات، بيقود كريم وديماس.
      ar: تامان ساري، قصر الماء القديم للسلاطين، صباحًا. أحواض ماء زرقاء وجدران بيضاء عتيقة. يقود باك واهيو، المرشد الخمسينيّ، كريمًا وديماس.
      en: Taman Sari, the sultans' old water palace, in the morning. Blue pools and weathered white walls. Pak Wahyu, a guide in his fifties, leads Karim and Dimas.
    lines:
      - speaker: Pak Wahyu
        text: Menika blumbang ingkang dipunagem putri-putri Kraton rumiyin.
        ar_eg: دي الأحواض اللي كانت أميرات القصر بتستعملها زمان.
        ar: هذه الأحواض التي كانت تستعملها أميرات القصر قديمًا.
        en: These are the pools the palace princesses used long ago.
        note:
          ar_eg: "تامان ساري اتبنت في القرن التمنتاشر للسلطان الأول في يوجياكارتا - جنينة ميّة واستراحة للعيلة المالكة. كلمات: blumbang = حوض، بركة."
          ar: "بُنيت تامان ساري في القرن الثامن عشر لأوّل سلطان في يوغياكارتا - حديقة ماء واستراحة للعائلة المالكة. مفردات: blumbang = حوض، بركة."
          en: "Taman Sari was built in the 18th century for Yogyakarta's first sultan - a water garden and retreat for the royal family. Words: blumbang = pool, pond."
      - speaker: Karim
        text: Nuwun sewu, Pak. Lajeng menika menapa?
        ar_eg: لا مؤاخذة يا پاك. وده بقى إيه؟
        ar: عذرًا يا باك. وما هذا إذن؟
        en: Excuse me, Pak. And what is this, then?
        note:
          ar_eg: "كلمات: nuwun = nuwun sewu = لو سمحت؛ kula nuwun = ممكن أدخل؟."
          ar: "مفردات: nuwun = nuwun sewu = عفوًا؛ kula nuwun = هل لي بالدخول؟."
          en: "Words: nuwun = nuwun sewu = excuse me; kula nuwun = may I come in?"
      - speaker: Narrator
        text: Karim nuding nganggo driji panuding. Pak Wahyu mesem.
        ar_eg: كريم شاور بالسبّابة. پاك واهيو ابتسم.
        ar: أشار كريم بالسبّابة. فابتسم باك واهيو.
        en: Karim points with his index finger. Pak Wahyu smiles.
        note:
          ar_eg: "كلمات: driji = صباع."
          ar: "مفردات: driji = إصبع."
          en: "Words: driji = finger."
      - speaker: Pak Wahyu
        text: Mas, ing tanah Jawa, nuding ngagem jempol, mekaten. Lan menawi maringaken barang, ngagem asta tengen.
        ar_eg: يا ابني، في جاوة بنشاور بالإبهام، كده. ولما تدّي حاجة لحدّ، بالإيد اليمين.
        ar: يا بنيّ، في جاوة نشير بالإبهام، هكذا. وحين تناول شيئًا، فباليد اليمنى.
        en: Son, in Java we point with the thumb, like this. And when you hand something over, use the right hand.
        note:
          ar_eg: "الإيد الشمال بتعتبر مش نضيفة، فما تدّيش ولا تاخد بيها حاجة. والإيد الشمال ممكن تسند الإيد اليمين تحت الكوع، علامة احترام زيادة. كلمات: ngagem = يلبس / يستخدم (krama inggil؛ ngoko nganggo، krama ngangge)؛ mekaten = كده (كراما)؛ tanah = أرض، تراب."
          ar: "تُعدّ اليد اليسرى غير لائقة، فلا تناول بها ولا تأخذ. ويمكن لليسرى أن تسند اليمنى تحت المرفق علامةَ احترام زائد. مفردات: ngagem = يلبس / يستعمل (krama inggil؛ ngoko nganggo، وkrama ngangge)؛ mekaten = هكذا (كراما)؛ tanah = أرض، تربة."
          en: "The left hand is considered unclean, so don't give or take with it. The left hand can support the right below the elbow as extra respect. Words: ngagem = wear, use (krama inggil; ngoko nganggo, krama ngangge) = memakai; mekaten = thus, like this (krama); tanah = land, soil, ground."
      - speaker: Mas Dimas
        text: Lan menawi mlampah wonten ngajengipun tiyang sepuh ingkang lenggah, kedah ndhingkluk sekedhik lan matur "ndherek langkung".
        ar_eg: ولما تعدّي قدّام ناس كبار قاعدين، لازم توطّي شويّة وتقول «ndherek langkung».
        ar: وحين تمرّ أمام كبار جالسين، يجب أن تنحني قليلًا وتقول «ndherek langkung».
        en: And when you walk past elders who are seated, you stoop a little and say "ndherek langkung".
        note:
          ar_eg: ndherek langkung = «عن إذنكم، هعدّي». بتوطّي ضهرك شويّة وإيدك اليمين قدّامك لتحت، كأنك بتصغّر نفسك.
          ar: ndherek langkung = «عن إذنكم، سأمرّ». تنحني قليلًا ويدك اليمنى ممدودة إلى الأسفل أمامك، كأنّك تصغّر نفسك.
          en: ndherek langkung = "excuse me, may I pass". You bend slightly, right hand lowered in front of you, as if making yourself small.
  - setting:
      ar_eg: بيت مباه پوتري، العصر. مباه وجيرانها الستّات الكبار قاعدين على حصيرة. كريم لازم يعدّي من قدّامهم عشان يوصل لمباه.
      ar: بيت مباه بوتري، عصرًا. تجلس مباه وجاراتها المسنّات على حصيرة. على كريم أن يمرّ أمامهنّ ليصل إلى مباه.
      en: Mbah Putri's house in the afternoon. Mbah and her elderly neighbours sit on a mat. Karim has to pass in front of them to reach Mbah.
    lines:
      - speaker: Karim
        text: Nuwun sewu... ndherek langkung... ndherek langkung.
        ar_eg: لا مؤاخذة... عن إذنكم، هعدّي... عن إذنكم.
        ar: عذرًا... عن إذنكم، سأمرّ... عن إذنكم.
        en: Excuse me... may I pass... may I pass.
      - speaker: Mbah Putri
        text: Mangga, mangga, Nak. Wah, sampun pinter tata krama.
        ar_eg: اتفضّل، اتفضّل يا ابني. يا سلام، بقى شاطر في الأدب.
        ar: تفضّل، تفضّل يا بنيّ. رائع، صار بارعًا في الآداب.
        en: Go ahead, go ahead, dear. Well, he's learned his manners.
        note:
          ar_eg: "كلمات: tata = ترتيب، نظام."
          ar: "مفردات: tata = نظام، ترتيب."
          en: "Words: tata = order, arrangement."
      - speaker: Karim
        text: Mbah, menika gudeg saking Wijilan. Kagem panjenengan.
        ar_eg: يا حاجّة، ده جوديج من ويجيلان. عشان حضرتك.
        ar: يا جدّة، هذا غوديغ من ويجيلان. من أجلكِ.
        en: Mbah, this is gudeg from Wijilan. For you.
      - speaker: Narrator
        text: Karim maringake nganggo tangan tengen, tangan kiwa nyangga sikute.
        ar_eg: كريم بيدّيه بالإيد اليمين، والشمال ساندة الكوع.
        ar: يناوله كريم باليد اليمنى، واليسرى تسند المرفق.
        en: Karim hands it over with his right hand, his left supporting the elbow.
        note:
          ar_eg: "كلمات: tangan = إيد."
          ar: "مفردات: tangan = يد."
          en: "Words: tangan = hand, arm."
      - speaker: Mbah Putri
        text: Ealah, Nak... sampun repot-repot. Matur nuwun sanget.
        ar_eg: يا خبر يا ابني... ماكانش ليه لزوم تتعب نفسك. متشكّرة جدًّا.
        ar: يا إلهي يا بنيّ... ما كان عليك أن تتعب نفسك. شكرًا جزيلًا.
        en: Oh, dear... you shouldn't have gone to the trouble. Thank you so much.
        note:
          ar_eg: sampun repot-repot = «ماكانش ليه لزوم تتعب نفسك»، بتتقال لما حدّ يجيب هدية. والردّ المؤدّب - Mboten repot, Mbah (مافيش تعب).
          ar: sampun repot-repot = «ما كان عليك أن تتعب نفسك»، تقال حين يُحضر أحدهم هدية. والردّ المهذّب - Mboten repot, Mbah (لا تعب).
          en: sampun repot-repot = "you shouldn't have troubled yourself", said when someone brings a gift. The polite reply - Mboten repot, Mbah (no trouble at all).
      - speaker: Karim
        text: Mboten repot, Mbah.
        ar_eg: مافيش تعب يا حاجّة.
        ar: لا تعب يا جدّة.
        en: No trouble at all, Mbah.
      - speaker: Mas Dimas
        text: Mas, sampeyan saiki luwih Jawa tinimbang aku!
        ar_eg: يا ماس، انت دلوقتي جاوي أكتر منّي!
        ar: يا ماس، صرت الآن أكثر جاويّةً منّي!
        en: Mas, you're more Javanese than me now!
