questions:
  - id: q01
    type: multiple_choice
    question_meaning:
      ar_eg: في جاوة، بتشاور بإيه؟
      ar: في جاوة، بماذا تشير؟
      en: In Java, what do you point with?
    options: ["driji panuding", "jempol", "tangan kiwa"]
    answer: 1
  - id: q02
    type: fill_blank
    sentence: Nuwun sewu... ndherek ___.
    meaning:
      ar_eg: لا مؤاخذة... عن إذنكم، هعدّي.
      ar: عذرًا... عن إذنكم، سأمرّ.
      en: Excuse me... may I pass.
    answers: [langkung]
    options: ["langkung", "lenggah", "repot"]
  - id: q03
    type: multiple_choice
    question_meaning:
      ar_eg: لما حدّ يقولك «sampun repot-repot»، تردّ بإيه؟
      ar: حين يقول لك أحدهم «sampun repot-repot»، بماذا تردّ؟
      en: When someone says "sampun repot-repot", what do you reply?
    options: ["Mboten repot.", "Sugeng sare.", "Kula nuwun."]
    answer: 0
  - id: q04
    type: translate
    direction: from_target
    source_text: Menawi maringaken barang, ngagem asta tengen.
    answers_meaning:
      ar_eg: ["لما تدّي حاجة، بالإيد اليمين.", "لما تناول حاجة استعمل إيدك اليمين."]
      ar: ["حين تناول شيئًا، فباليد اليمنى."]
      en: ["When you hand something over, use the right hand.", "Use your right hand to give things."]
next:
  ar_eg: پاك وبو هارسونو بيتكلّموا مع بعض بطريقة غريبة - جاوي عادي، بس فيه كلمات تشريف في النصّ. ده اسمه إيه؟ وليه ديماس بيكلّم أخوه الكبير كده كمان؟
  ar: يتحادث باك وبو هارسونو بطريقة غريبة - جاوية عادية، لكن تتخلّلها كلمات تشريف. ما اسم هذا؟ ولماذا يكلّم ديماس أخاه الأكبر هكذا أيضًا؟
  en: Pak and Bu Harsono talk to each other in an odd way - plain Javanese, but with honorific words in the middle. What's that called? And why does Dimas talk to his older brother like that too?
review:
  status: draft
  verified: false
  notes: Pak Wahyu is the Taman Sari guide from j4.u04. Taman Sari dates from the reign of Hamengkubuwono I (1750s-1760s). Gudeg Wijilan is Yogya's well-known gudeg street. Check "maringaken" vs "maringi".
