# Aksara Jawa calligraphy practice set (PLAN §18), in teaching order: the 20 letters
# (jv.aksara.nglegena), vowel signs on ka (jv.aksara.sandhangan-swara), final signs on ka
# (jv.aksara.panyigeg), then words from those grammar notes for free writing.
# scripts/aksara/strokes.py traces each `text` from Noto Sans Javanese into content/aksara/strokes.json.
# kind: nglegena | sandhangan | panyigeg | word. `sign` names the mark a syllable practises.
# order (optional): corrections to the drafted strokes, indices from 0; 2r = stroke 2 reversed; 0+1 = joined.
