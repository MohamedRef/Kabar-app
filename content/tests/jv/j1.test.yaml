    instructions:
      ar_eg: رسايل واتساب من صحابك في سورابايا، مكتوبة بسبيلنج الشات. فكّها وجاوب.
      ar: رسائل واتساب من أصدقائك في سورابايا مكتوبة بتهجئة الدردشة. فكّها وأجب.
      en: WhatsApp messages from your Surabaya friends in chat spelling. Decode them and answer.
    items:
      - id: t07
        unit: j1.u04
        type: multiple_choice
        question: Sek tak lapor pusat
        question_meaning:
          ar_eg: سألت البياع في المحل لو لسه فيه تمر عجوة، فبعتلك كده. يقصد إيه؟ (اختار الجملة الإندونيسي)
          ar: سألتَ البائع في المتجر إن كان تمر العجوة لا يزال متوفرًا، فأرسل لك هذا. ماذا يقصد؟ (اختر الجملة الإندونيسية)
          en: You asked the shop assistant whether the Ajwa dates are still in stock, and he sends this. What does he mean? (Pick the Indonesian.)
        options: ["Saya sudah lapor ke pusat.", "Maaf, kantor pusat tutup.", "Sebentar, saya lapor ke pusat dulu."]
        answer: 2
        words: [sek, tak, lapor, pusat]
      - id: t08
        unit: j1.u03
        type: multiple_choice
        question: arp dicul piro?
        question_meaning:
          ar_eg: Cak Heru بيبيع موبايله، وواحد عايز يشتري بعت كده. أنهي هي الصيغة الكاملة؟
          ar: يبيع Cak Heru هاتفه، وأرسل مشترٍ هذه الرسالة. ما الصيغة الكاملة؟
          en: Cak Heru is selling his phone and a buyer sends this. Which is the full form?
        options: ["Arep diterke pira?", "Arep diculke pira?", "Arep dituku pira?"]
        answer: 1
        explain:
          ar_eg: arp = arep، dicul = diculke (هيتباع / هتسيبه بكام)، piro = pira. يعني "هتبيعه بكام؟".
          ar: arp = arep، وdicul = diculke (يُباع / يُتخلّى عنه)، وpiro = pira؛ أي "بكم ستبيعه؟".
          en: arp = arep, dicul = diculke (let go, sold), piro = pira, so "How much will you sell it for?"
        words: [arep, diculke, pira]
      - id: t09
        unit: j1.u03
        type: multiple_choice
        question: ng prabowo?
        question_meaning:
          ar_eg: في الشات ده، ng اختصار لإيه؟
          ar: في هذه الدردشة، ما الذي تختصره ng؟
          en: In this chat, what does ng stand for?
        options: [ngendi, ngarep, nang]
        answer: 2
        words: [nang]
      - id: t10
        unit: j1.u03
        type: multiple_choice
        question: |
          Mbak Rara: rek, ws tekan durung?
          Cak Heru: ws, aku lagi ng Tunjungan
          Mohamed: durung, aku isih ng sepur. sek ya
          Mbak Rara: rapopo. aku arp mangan sate karo Cak Heru
        question_meaning:
          ar_eg: محمد فين دلوقتي؟
          ar: أين محمد الآن؟
          en: Where is Mohamed right now?
        options: [nang Tunjungan, nang sepur, nang omah]
        answer: 1
        words: [isih, sepur]
      - id: t11
        unit: j1.u03
        type: multiple_choice
        question: |
          Mbak Rara: rek, ws tekan durung?
          Cak Heru: ws, aku lagi ng Tunjungan
          Mohamed: durung, aku isih ng sepur. sek ya
          Mbak Rara: rapopo. aku arp mangan sate karo Cak Heru
        question_meaning:
          ar_eg: Mbak Rara ناوية تعمل إيه؟
          ar: ماذا تنوي Mbak Rara أن تفعل؟
          en: What is Mbak Rara going to do?
        options: ["Mangan sate karo Cak Heru.", "Turu.", "Tuku kurma."]
        answer: 0
        words: [arep, karo]
      - id: t12
        unit: j1.u03
        type: multiple_choice
        question: rek, aku gk ngerti opo2
        question_meaning:
          ar_eg: أنهي جملة إندونيسي بتقول نفس المعنى؟
          ar: أيّ جملة إندونيسية تؤدي المعنى نفسه؟
          en: Which Indonesian sentence says the same thing?
        options:
          - Teman-teman, saya tidak mengerti apa-apa.
          - Teman-teman, saya tidak mau apa-apa.
          - Teman-teman, saya belum makan apa-apa.
        answer: 0
        words: [gak, ngerti, apa-apa]
      - id: t13
        unit: j1.u05
        type: multiple_choice
        question: Koen kate nang endi?
        question_meaning:
          ar_eg: دي جملة بكلام Arek بتاع سورابايا. أنهي جملة نغوكو عادية بنفس المعنى؟
          ar: هذه جملة بلهجة Arek في سورابايا. أيّ جملة نغوكو معيارية تحمل المعنى نفسه؟
          en: This is Surabaya Arek speech. Which standard ngoko sentence means the same?
        options: ["Kowe saka ngendi?", "Kowe lagi ngapa?", "Kowe arep nang ngendi?"]
        answer: 2
        explain:
          ar_eg: koen = kowe، kate = arep، endi = ngendi.
          ar: koen = kowe، وkate = arep، وendi = ngendi.
          en: koen = kowe, kate = arep, endi = ngendi.
        words: [koen, kate, arep]
