      ar: تكلّم بارتياح. المهم أن يفهمك صديقك الجاوي.
      en: Speak at ease. What matters is that your Javanese friend understands you.
    items:
      - id: t33
        unit: j1.u02
        type: speaking
        text: Jenengku Mohamed. Aku wong Mesir, saka Kairo. Kowe saka ngendi?
        meaning:
          ar_eg: اسمي محمد. أنا مصري، من القاهرة. وإنت منين؟
          ar: اسمي محمد. أنا مصري من القاهرة. وأنت من أين؟
          en: My name is Mohamed. I'm Egyptian, from Cairo. Where are you from?
        words: [jeneng, wong, saka]
      - id: t34
        unit: j1.u02
        type: speaking_task
        points: 4
        prompt:
          ar_eg: 'إنت قاعد على warung kopi في سورابايا وجنبك شاب اسمه Yudi. اتكلم حوالي دقيقة: سلّم عليه، عرّفه بنفسك، اسأله ٣ أسئلة (اسمه، منين، بيته فين)، واطلب قهوتين من Cak صاحب القهوة واسأل بكام، واشكره.'
          ar: 'أنت في warung kopi في سورابايا وبجانبك شاب اسمه Yudi. تحدّث نحو دقيقة: سلّم عليه وعرّف بنفسك، واسأله ثلاثة أسئلة (اسمه، ومن أين هو، وأين بيته)، ثم اطلب قهوتين من صاحب المقهى (Cak) واسأل عن السعر، واشكره.'
          en: 'You''re at a warung kopi in Surabaya next to a young man called Yudi. Talk for about a minute: greet him, introduce yourself, ask three questions (his name, where he''s from, where he lives), order two coffees from the Cak who runs the stall and ask the price, then say thanks.'
        rubric:
          - Greets and introduces himself in ngoko (sugeng …, jenengku …, aku wong Mesir …).
          - Asks at least three questions with sapa / ngendi / pira in the right order.
          - Orders with a number and asks the price (kopi loro, regane pira?), using mas / cak naturally.
          - Speaks clearly enough for a Javanese listener to follow; pauses and Arek or standard forms are both fine.
        sample: |
          Sugeng sonten, Mas. Jenengku Mohamed. Aku wong Mesir, saka Kairo.
          Jenengmu sapa? Kowe saka ngendi? Omahmu ngendi?
          Cak, kopi loro, ya. Regane pira?
          Suwun, Cak!
        words: [jeneng, sapa, ngendi, pira]
