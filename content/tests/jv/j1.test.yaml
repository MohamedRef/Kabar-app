        type: multiple_choice
        question_meaning:
          ar_eg: إزاي تقول "Bukunya sudah kubaca" (الكتاب أنا قريته) بالجاوي؟
          ar: كيف تقول "Bukunya sudah kubaca" (قرأتُ الكتاب) بالجاوية؟
          en: How do you say "Bukunya sudah kubaca" (I've read the book) in Javanese?
        options: ["Bukune wis diwaca aku.", "Bukune wis tak waca.", "Bukune wis kok waca."]
        answer: 1
        explain:
          ar_eg: 'tak- = أنا (ku-)، kok- = إنت (kau-). مع tak الفعل بيبقى من غير N-: waca مش maca.'
          ar: 'tak- = أنا (ku-)، وkok- = أنت (kau-). ومع tak يأتي الفعل بلا N-: waca لا maca.'
          en: tak- = by me (ku-), kok- = by you (kau-). After tak the verb has no N-, so waca, not maca.
        words: [tak, waca]
