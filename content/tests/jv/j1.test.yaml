          en: 'Cak Heru writes in the group chat: ''rek, ws mangan? ayo mangan sate!'' Reply in ngoko in 4–6 short lines (chat spelling is fine): say whether you''ve eaten, where you are and what you''re doing now, ask where and when, and thank him and say take care.'
        rubric:
          - Answers the question with wis / durung and says where he is (nang / saka …) and what he is doing (lagi …).
          - Asks at least one question with ngendi / kapan / piye.
          - Uses ngoko throughout (aku / kowe or Arek koen, ora / gak) with no Indonesian words mixed in where J1 Javanese exists.
          - Closes warmly (suwun, ati-ati); chat spelling and abbreviations are fine if a Javanese friend would read them easily.
        sample: |
          Durung, Cak! Aku isih nang sepur, durung tekan.
          Aku lagi maca buku. Sek ya.
          Ayo! Nang ngendi? Kapan?
          Suwun, rek. Ati-ati, ya!
        words: [durung, isih, ngendi, kapan]
  - id: speaking
