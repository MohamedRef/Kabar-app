      - id: t32
        unit: j1.u03
        type: writing_task
        points: 4
        prompt:
          ar_eg: 'Cak Heru كتب في جروب الشات: ''rek, ws mangan? ayo mangan sate!'' رد بالنغوكو في ٤–٦ سطور قصيرة (سبيلنج الشات مقبول): قول أكلت ولا لسه، إنت فين وبتعمل إيه دلوقتي، اسأل فين وإمتى، واشكره وقوله خلّي بالك من نفسك.'
