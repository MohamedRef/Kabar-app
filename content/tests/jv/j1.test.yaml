schema: kabar.test/v1
id: j1.test
language: jv
kind: level
title:
  ar_eg: اختبار مستوى J1 — سورابايا
  ar: اختبار مستوى J1 — سورابايا
  en: J1 level test — Surabaya
intro:
  ar_eg: |
    ركبت القطر من Pasar Turi لحد Pasar Atom! هنا هتسمع سلامات وأسئلة بالنغوكو، وتفك رسايل شات زي "Sek tak lapor pusat" و"arp dicul piro"، وتتعامل مع الأرقام والأسعار، وتفرّق بين كلام Arek بتاع سورابايا والنغوكو العادي.
    خد وقتك. الكتابة بالسبيلنج العادي أو سبيلنج الشات، وبالعلامات على الحروف أو من غيرها، كله مقبول.
    ولو جاي من «اركب القطر السريع» عشان تعدّي J1، أهلًا بيك — نفس الأسئلة.
  ar: |
    ركبتَ القطار من Pasar Turi إلى Pasar Atom! ستستمع هنا إلى تحيات وأسئلة بالنغوكو، وتفكّ رسائل دردشة مثل "Sek tak lapor pusat" و"arp dicul piro"، وتتعامل مع الأرقام والأسعار، وتميّز كلام Arek في سورابايا من النغوكو المعيارية.
    خذ وقتك. تُقبل الكتابة بالتهجئة المعيارية أو بتهجئة الدردشة، بعلامات الحروف أو بدونها.
    وإن جئت من «اركب القطار السريع» لتتجاوز J1، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    You've ridden the line from Pasar Turi to Pasar Atom! Here you'll hear ngoko greetings and questions, decode chat messages like "Sek tak lapor pusat" and "arp dicul piro", handle numbers and prices, and tell Surabaya Arek speech from standard ngoko.
    Take your time. Standard or chat spelling, with or without accents, is all accepted.
    If you came through "Take the express" to skip J1, welcome: these are the same questions.
minutes: 25
pass_mark: 0.75
scoring: Score = points earned / points available (closed items 1 point unless set; translate items are graded against reference answers first, standard or chat spelling, with or without accents, then AI grade_answer; writing_task and speaking_task are graded by AI against their rubric, each criterion an equal share of the item's points). Pass at >= 0.75. Passing marks J1 complete and opens J2; the same rule applies when the test is taken as the "Take a flight" skip-ahead over J1. Below the mark, show the per-skill results and suggest the units behind the missed items, with no penalty and an open retry. Javanese items stay unverified until the learner approves them.
