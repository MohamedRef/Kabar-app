schema: kabar.test/v1
id: j4.test
language: jv
kind: level
title:
  ar_eg: اختبار مستوى J4 — يوجياكارتا (الكراما إنجيل والأندهاب)
  ar: اختبار مستوى J4 — يوجياكارتا (الكراما إنغيل والأندهاب)
  en: J4 level test — Yogyakarta (krama inggil and andhap)
intro:
  ar_eg: |
    وصلت Yogya، مدينة السلطان! هنا هتكرّم الكبير بالـ krama inggil (dhahar، tindak، asma، dalem)، وتتواضع إنت بالـ krama andhap (matur، sowan، nyuwun، ngaturaken)، وتعدّي زيارة كاملة بآدابها، وتختار بين ngoko alus وkrama alus، وتعرف مين بيكلم مين في الوايانغ.
    خد وقتك. القاعدة الدهبية واحدة: الكلام العالي هدية للتاني، مش ليك. السبيلنج العادي أو بتاع الشات (kulo، monggo، nggih)، وبعلامات أو من غيرها — كله مقبول.
    ولو جاي من "Take a flight" عشان تعدّي J4، أهلًا بيك — نفس الأسئلة.
  ar: |
    وصلتَ إلى Yogya، مدينة السلطان! ستكرّم الكبير هنا بالـ krama inggil (dhahar، tindak، asma، dalem)، وتتواضع أنت بالـ krama andhap (matur، sowan، nyuwun، ngaturaken)، وتجتاز زيارة كاملة بآدابها، وتختار بين ngoko alus وkrama alus، وتعرف من يكلّم من في الوايانغ.
    خذ وقتك؛ فالقاعدة الذهبية واحدة: الكلام الرفيع تكريم للآخر لا لنفسك. تُقبل التهجئة المعيارية أو تهجئة الدردشة (kulo، monggo، nggih)، بالعلامات أو بدونها.
    وإن جئت من "Take a flight" لتتجاوز J4، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    You've reached Yogya, the Sultan's city! Here you'll honour elders with krama inggil (dhahar, tindak, asma, dalem), lower yourself with krama andhap (matur, sowan, nyuwun, ngaturaken), get through a whole visit with its etiquette, choose between ngoko alus and krama alus, and tell who is talking to whom in wayang.
    Take your time. The golden rule is always the same: the raised words are a gift for the other person, never for you. Standard or chat spelling (kulo, monggo, nggih), with or without accents, is all accepted.
    If you came through "Take a flight" to skip J4, welcome: these are the same questions.
minutes: 35
pass_mark: 0.75
scoring: Score = points earned / points available (closed items 1 point unless set; translate items are graded against reference answers first, standard or chat spelling, with or without accents, then AI grade_answer; writing_task and speaking_task are graded by AI against their rubric, each criterion an equal share of the item's points). Pass at >= 0.75. Passing marks J4 complete and opens J5; the same rule applies when the test is taken as the "Take a flight" skip-ahead over J4. Below the mark, show the per-skill results and suggest the units behind the missed items, with no penalty and an open retry. Javanese items stay unverified until the learner approves them.
sections:
  - id: listening
    skill: listening
    title:
      ar_eg: الاستماع
      ar: الاستماع
      en: Listening
    instructions:
      ar_eg: اسمع، وعيد براحتك، واختار اللي سمعته بالظبط أو اكتبه. خلي بالك مين اللي بيتكرّم في الجملة.
      ar: استمع وأعِد كما تشاء، ثم اختر ما سمعته بالضبط أو اكتبه، منتبهًا لمن يُكرَّم في الجملة.
      en: Listen, replay as you like, then pick exactly what you heard or write it. Notice who is being honoured in each sentence.
    items:
      - id: t01
        type: listen
        text: Simbah saweg sare, Bapak dereng kondur.
        options:
          - Simbah saweg siram, Bapak dereng kondur.
          - Simbah saweg sare, Bapak sampun kondur.
          - Simbah saweg sare, Bapak dereng kondur.
        answer: 2
        words: [sare, kondur]
      - id: t02
        type: listen
        text: Nyuwun pirsa, Pak, Taman Sari wonten pundi?
        options:
          - Nyuwun pirsa, Pak, Taman Sari wonten pundi?
          - Nyuwun pamit, Pak, kula wangsul rumiyin.
          - Nyuwun sewu, Pak, Kraton wonten pundi?
        answer: 0
        words: [nyuwun pirsa]
      - id: t03
        type: listen
        text: Kula ngaturi Bapak rawuh wonten syukuran kula.
        options:
          - Kula ngaturaken Bapak rawuh wonten syukuran kula.
          - Kula ngaturi Bapak rawuh wonten syukuran kula.
          - Kula badhe sowan wonten syukuranipun Bapak.
        answer: 1
        words: [ngaturi, rawuh]
      - id: t04
        type: listen
        text: Mbak, panjenengan arep tindak menyang ngendi?
        question:
          ar_eg: Dimas بيكلم أخته الكبيرة. ده أنهي مستوى؟
          ar: يكلّم Dimas أخته الكبرى. أيّ مستوى هذا؟
          en: Dimas is talking to his older sister. Which level is this?
        options: [ngoko lugu, krama alus, ngoko alus]
        answer: 2
        meaning:
          ar_eg: يا أبلة، حضرتك رايحة فين؟
          ar: يا أختي، إلى أين تذهبين؟
          en: Sis, where are you going?
        words: [ngoko alus, tindak]
      - id: t05
        type: listen
        text: Kula nuwun! — Mangga, mangga pinarak.
        options:
          - Kula nuwun! — Mangga, mangga pinarak.
          - Matur nuwun! — Mangga, mangga lenggah.
          - Kula nuwun! — Sugeng tindak, ngatos-atos.
        answer: 0
        words: [kula nuwun, pinarak]
      - id: t06
        type: dictation
        text: Kula nyuwun pamit rumiyin, Bu.
        meaning:
          ar_eg: عن إذنك يا هانم، أنا ماشي.
          ar: أستأذنكِ في الانصراف يا سيدتي.
          en: Please excuse me, ma'am, I'll be going.
        words: [nyuwun pamit, rumiyin]
  - id: reading
    skill: reading
    title:
      ar_eg: القراية
      ar: القراءة
      en: Reading
    instructions:
      ar_eg: اقرا الزيارة ومشهد الوايانغ، وجاوب من اللي مكتوب.
      ar: اقرأ الزيارة ومشهد الوايانغ، وأجب مما ورد فيهما.
      en: Read the visit and the wayang scene, and answer from what they say.
    items:
      - id: t07
        type: multiple_choice
        question: |
          Mohamed: Kula nuwun!
          Bu Ningsih: Mangga! Oh, Mas Mohamed. Mangga pinarak.
          Bu Ningsih: Pripun kabaripun, Mas?
          Mohamed: Pangestunipun, sae, Bu. Bapak wonten?
          Bu Ningsih: Bapak saweg tindak dhateng Kraton. Simbah saweg gerah, mustakanipun sakit.
          Mohamed: Menika jeruk kagem Simbah, Bu.
          Bu Ningsih: Matur nuwun sanget, Mas. Kula damelaken teh rumiyin.
          Mohamed: Sampun repot-repot, Bu.
        question_meaning:
          ar_eg: Bapak (راجل البيت) فين دلوقتي؟
          ar: أين Bapak (ربّ البيت) الآن؟
          en: Where is Bapak (the man of the house) right now?
        options: ["Sedang tidur di kamar.", "Sedang pergi ke Kraton.", "Sedang sakit di rumah."]
        answer: 1
        words: [tindak, saweg]
      - id: t08
        type: multiple_choice
        question: |
          Mohamed: Kula nuwun!
          Bu Ningsih: Mangga! Oh, Mas Mohamed. Mangga pinarak.
          Bu Ningsih: Pripun kabaripun, Mas?
          Mohamed: Pangestunipun, sae, Bu. Bapak wonten?
          Bu Ningsih: Bapak saweg tindak dhateng Kraton. Simbah saweg gerah, mustakanipun sakit.
          Mohamed: Menika jeruk kagem Simbah, Bu.
          Bu Ningsih: Matur nuwun sanget, Mas. Kula damelaken teh rumiyin.
          Mohamed: Sampun repot-repot, Bu.
        question_meaning:
          ar_eg: الجدّة مالها؟
          ar: ما بال الجدّة؟
          en: What's wrong with Grandma?
        options: ["Tangannya sakit.", "Dia sedang mandi.", "Dia sakit kepala."]
        answer: 2
        explain:
          ar_eg: gerah = عيانة (للكبير، مش «حر» زي الإندونيسي)، وmustakanipun = راسها (krama inggil).
          ar: gerah = مريضة (للكبير، لا «الحرّ» كما في الإندونيسية)، وmustakanipun = رأسها (krama inggil).
          en: gerah = unwell (for an elder, not "stuffy" as in Indonesian), and mustakanipun = her head (krama inggil).
        words: [gerah, mustaka]
      - id: t09
        type: multiple_choice
        question: Sampun repot-repot, Bu.
        question_meaning:
          ar_eg: محمد قال كده لما Bu Ningsih قالت هتعمله شاي. يقصد إيه؟ (اختار الجملة الإندونيسي)
          ar: قال محمد هذا حين عرضت Bu Ningsih أن تعدّ له الشاي. ماذا يقصد؟ (اختر الجملة الإندونيسية)
          en: Mohamed says this when Bu Ningsih offers to make him tea. What does he mean? (Pick the Indonesian.)
        options: ["Jangan repot-repot, Bu.", "Sudah cukup, Bu.", "Saya sudah minum, Bu."]
        answer: 0
        explain:
          ar_eg: sampun في أول طلب معناها «ما…ش» (زي aja)، مش «خلاص».
          ar: sampun في أول الطلب تعني «لا تفعل» (مثل aja)، لا «قد».
          en: sampun at the start of a request means "don't" (like aja), not "already".
        words: [sampun repot-repot]
      - id: t10
        type: multiple_choice
        question: |
          Rama: Hanoman, kowe menyanga Alengka. Sinta ana ing kana.
          Hanoman: Sendika dhawuh, Gusti. Kula nyuwun pamit rumiyin.
          …
          Hanoman: Gusti, kula badhe matur. Dewi Sinta wonten ing Alengka.
          Rama: Iya. Apik, Hanoman.
        question_meaning:
          ar_eg: Rama بيكلم Hanoman بأنهي مستوى؟
          ar: بأيّ مستوى يكلّم Rama Hanoman؟
          en: Which level does Rama use with Hanoman?
        options: [krama alus, krama lugu, ngoko]
        answer: 2
        explain:
          ar_eg: الملك بيكلم خدّامه بالنغوكو (kowe، menyanga، ana). الخدّام هو اللي بيرد بالكراما.
          ar: يكلّم الملكُ خادمه بالنغوكو (kowe، menyanga، ana)، والخادم هو الذي يجيب بالكراما.
          en: A king speaks to his servant in ngoko (kowe, menyanga, ana). It's the servant who answers in krama.
        words: [ratu, abdi]
      - id: t11
        type: multiple_choice
        question: |
          Rama: Hanoman, kowe menyanga Alengka. Sinta ana ing kana.
          Hanoman: Sendika dhawuh, Gusti. Kula nyuwun pamit rumiyin.
          …
          Hanoman: Gusti, kula badhe matur. Dewi Sinta wonten ing Alengka.
          Rama: Iya. Apik, Hanoman.
        question_meaning:
          ar_eg: Hanoman بيقول «kula badhe matur» مش «kula badhe ngendika». ليه؟
          ar: يقول Hanoman «kula badhe matur» لا «kula badhe ngendika». لماذا؟
          en: Hanoman says "kula badhe matur", not "kula badhe ngendika". Why?
        options:
          - Karena Hanoman abdi, dan dia bicara kepada rajanya.
          - Karena Rama lebih muda dari Hanoman.
          - Karena Hanoman sedang bercanda.
        answer: 0
        explain:
          ar_eg: matur = krama andhap، الخدّام بيوطّي نفسه وهو بيكلم الملك. ngendika للملك هو (krama inggil)، عمرها ما تتقال عن نفسك.
          ar: matur من الـ krama andhap، يتواضع بها الخادم حين يكلّم الملك. أما ngendika فللملك (krama inggil) ولا تُقال عن النفس.
          en: matur is krama andhap, the servant lowering himself as he speaks to the king. ngendika is for the king (krama inggil), never for yourself.
        words: [matur, ngendika]
      - id: t12
        type: multiple_choice
        question: Sendika dhawuh, Gusti.
        question_meaning:
          ar_eg: Hanoman رد على أمر الملك بالجملة دي. معناها إيه؟
          ar: أجاب Hanoman أمرَ الملك بهذه الجملة. ما معناها؟
          en: Hanoman answers the king's order with this. What does it mean?
        options: ["Siap, laksanakan, Tuan.", "Selamat jalan, Tuan.", "Permisi, numpang lewat."]
        answer: 0
        words: [sendika dhawuh, gusti]
      - id: t13
        type: multiple_choice
        question: |
          Mas Dimas: Mohamed, bengi iki ana wayang kulit ing pendhapa. Kowe arep nonton?
          Mohamed: Arep! Dhalange saka ngendi?
          Mas Dimas: Saka Bantul. Ana gamelan lan sindhen uga.
          Mohamed: Ana punakawane?
          Mas Dimas: Ana. Punakawan guyon nganggo ngoko, nanging karo Raden Arjuna nganggo krama.
        question_meaning:
          ar_eg: الـ punakawan بيكلموا Raden Arjuna إزاي؟
          ar: كيف يكلّم الـ punakawan Raden Arjuna؟
          en: How do the punakawan speak to Raden Arjuna?
        options: ["Dengan ngoko, sambil bercanda.", "Dengan krama.", "Dengan bahasa Indonesia."]
        answer: 1
        explain:
          ar_eg: بينهم وبين بعض نغوكو وهزار (guyon)، لكن مع سيدهم الفارس كراما. المستوى جزء من الحكاية.
          ar: بينهم نغوكو ومزاح (guyon)، أما مع سيدهم الفارس فالكراما؛ فالمستوى جزء من الحكاية.
          en: Among themselves it's ngoko and jokes (guyon), but with their knight it's krama. The level is part of the drama.
        words: [punakawan, guyon]
  - id: vocabulary
    skill: vocabulary
    title:
      ar_eg: الكلمات
      ar: المفردات
      en: Vocabulary
    items:
      - id: t14
        type: match_pairs
        pairs:
          - text: ngunjuk
            ar_eg: يشرب (krama inggil، للكبير)
            ar: يشرب (krama inggil، للمعظَّم)
            en: drink (krama inggil, for the elder)
          - text: sare
            ar_eg: ينام (krama inggil)
            ar: ينام (krama inggil)
            en: sleep (krama inggil)
          - text: kondur
            ar_eg: يروّح (krama inggil)
            ar: يعود إلى البيت (krama inggil)
            en: go home (krama inggil)
          - text: lenggah
            ar_eg: يقعد (krama inggil)
            ar: يجلس (krama inggil)
            en: sit (krama inggil)
          - text: ngendika
            ar_eg: يقول (krama inggil)
            ar: يقول (krama inggil)
            en: say (krama inggil)
        words: [ngunjuk, sare, kondur, lenggah, ngendika]
      - id: t15
        type: match_pairs
        pairs:
          - text: asma
            ar_eg: الاسم (بتاع الكبير؛ = nami)
            ar: الاسم (للمعظَّم؛ = nami)
            en: name (the elder's; = nami)
          - text: yuswa
            ar_eg: السن، العمر (بتاع الكبير؛ = umur)
            ar: العمر (للمعظَّم؛ = umur)
            en: age (the elder's; = umur)
          - text: dalem
            ar_eg: البيت (بتاع الكبير؛ = griya)
            ar: البيت (للمعظَّم؛ = griya)
            en: home (the elder's; = griya)
          - text: garwa
            ar_eg: الزوج أو الزوجة (بتاع الكبير؛ = semah)
            ar: الزوج أو الزوجة (للمعظَّم؛ = semah)
            en: spouse (the elder's; = semah)
          - text: asta
            ar_eg: الإيد (بتاعة الكبير؛ = tangan)
            ar: اليد (للمعظَّم؛ = tangan)
            en: hand (the elder's; = tangan)
        words: [asma, yuswa, dalem, garwa, asta]
      - id: t16
        type: match_pairs
        pairs:
          - text: matur
            ar_eg: أقول لحضرتك (krama andhap)
            ar: أقول لكم (krama andhap)
            en: say, tell (up to an elder; krama andhap)
          - text: sowan
            ar_eg: أزور حضرتك (krama andhap)
            ar: أزوركم (krama andhap)
            en: call on, visit an elder (krama andhap)
          - text: nyuwun
            ar_eg: أطلب (بتواضع)
            ar: أطلب (بتواضع)
            en: ask for (humbly)
          - text: ngaturaken
            ar_eg: أقدّم لحضرتك (هدية)
            ar: أقدّم لكم (هدية)
            en: offer, present (to an elder)
          - text: ndherek
            ar_eg: آجي مع حضرتك
            ar: أرافقكم
            en: go along with (an elder)
        words: [matur, sowan, nyuwun, ngaturaken, ndherek]
      - id: t17
        type: match_pairs
        pairs:
          - text: dhalang
            ar_eg: اللي بيحرّك العرايس ويتكلم بصوتهم كلهم
            ar: محرّك الدمى الذي يؤدّي أصوات الشخصيات كلها
            en: puppet master who voices every character
          - text: sindhen
            ar_eg: المغنية مع الغاميلان
            ar: المغنّية مع الغاميلان
            en: female singer with the gamelan
          - text: gong
            ar_eg: الجونج الكبير اللي بيقفل الجملة الموسيقية
            ar: الصنج الكبير الذي يختم الجملة الموسيقية
            en: great gong that closes each musical phrase
          - text: kendhang
            ar_eg: الطبلة اللي بتقود الإيقاع
            ar: الطبل الذي يقود الإيقاع
            en: drum that leads the tempo
          - text: punakawan
            ar_eg: الخدّامين المهرّجين في الوايانغ
            ar: الخدم المهرّجون في الوايانغ
            en: the clown-servants of wayang
        words: [dhalang, sindhen, gong, kendhang, punakawan]
      - id: t18
        type: fill_blank
        sentence: Mangga ___, Pak.
        meaning:
          ar_eg: اتفضل ادخل واقعد معانا يا أستاذ. (للضيف الكبير)
          ar: تفضّل بالدخول والجلوس يا سيدي. (للضيف المعظَّم)
          en: Please come in and sit with us, sir. (to an honoured guest)
        options: [mampir, pinarak, sowan]
        answers: [pinarak]
        explain:
          ar_eg: pinarak هي krama inggil لـ mampir. وsowan للي بيزور (إنت)، مش للي بتستقبله.
          ar: pinarak هي krama inggil لـ mampir، وsowan للزائر نفسه (أنت) لا للضيف المستقبَل.
          en: pinarak is the krama inggil of mampir. sowan is for the visitor (you), not for the guest you welcome.
        words: [pinarak]
      - id: t19
        type: multiple_choice
        question: Simbah saweg gerah.
        question_meaning:
          ar_eg: الجملة دي معناها إيه؟ (اختار الجملة الإندونيسي)
          ar: ما معنى هذه الجملة؟ (اختر الجملة الإندونيسية)
          en: What does this sentence mean? (Pick the Indonesian.)
        options: ["Nenek sedang kepanasan.", "Nenek sedang sakit.", "Nenek sedang tidur."]
        answer: 1
        explain:
          ar_eg: خلي بالك! gerah بالإندونيسي يعني «حر وكتمة»، لكن بالجاوي krama inggil لـ «عيان».
          ar: انتبه! gerah في الإندونيسية تعني «الحرّ الخانق»، أما في الجاوية فهي krama inggil لـ «مريض».
          en: Careful! Indonesian gerah means "hot and stuffy", but in Javanese it's the krama inggil for "ill".
        words: [gerah]
  - id: grammar
    skill: grammar
    title:
      ar_eg: القواعد ومستوى الكلام والآداب
      ar: القواعد ومستوى الكلام والآداب
      en: Grammar, speech level and etiquette
    items:
      - id: t20
        type: multiple_choice
        question: Mas Mohamed kersa ngunjuk teh?
        question_meaning:
          ar_eg: Pak Harsono بيسألك كده، وإنت عايز. ترد بإيه؟
          ar: يسألك Pak Harsono هذا، وأنت تريد. بمَ تجيب؟
          en: Pak Harsono asks you this, and you'd like some. What do you answer?
        options: ["Inggih, kersa, Pak.", "Inggih, purun, Pak.", "Iya, gelem, Pak."]
        answer: 1
        explain:
          ar_eg: kersa تكريم ليك منه، إنت ترد بتواضع بـ purun. وgelem نغوكو.
          ar: kersa تكريم لك منه، وأنت تجيب متواضعًا بـ purun، وgelem نغوكو.
          en: kersa is his honour to you; you answer humbly with purun. gelem is ngoko.
        words: [purun, kersa]
      - id: t21
        type: multiple_choice
        question_meaning:
          ar_eg: Bu Harsono بتسألك رايح فين. إنت رايح Malioboro. أنهي جملة صح؟
          ar: تسألك Bu Harsono إلى أين تذهب، وأنت ذاهب إلى Malioboro. أيّ جملة صحيحة؟
          en: Bu Harsono asks where you're going. You're off to Malioboro. Which sentence is right?
        options:
          - Kula badhe tindak dhateng Malioboro.
          - Aku arep lunga menyang Malioboro.
          - Kula badhe kesah dhateng Malioboro.
        answer: 2
        explain:
          ar_eg: عن نفسك kesah (كراما عادية). tindak krama inggil للكبير بس، وaku arep lunga نغوكو.
          ar: عن نفسك تقول kesah (كراما عادية)، أما tindak فـ krama inggil للمعظَّم وحده، وaku arep lunga نغوكو.
