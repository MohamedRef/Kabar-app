      - id: t36
        type: writing_task
        points: 4
        prompt:
          ar_eg: |
            هتبعت رسالة لـ Pak Slamet، سوّاق الأندونغ الكبير اللي عرفته في Malioboro. حوّل الرسالة دي من النغوكو لكراما alus: كرّمه هو وحاجاته بالـ krama inggil، واتواضع إنت بالـ krama andhap، وزوّد في أولها تحية وفي آخرها شكر:
            "Pak Slamet, jenengku Mohamed. Setu sore aku arep dolan menyang omahmu. Aku arep menehi oleh-oleh saka Mesir kanggo bojomu. Kowe ana ing omah?"
          ar: |
            سترسل رسالة إلى Pak Slamet، سائق الأندونغ المسنّ الذي عرفته في Malioboro. حوّل هذه الرسالة من النغوكو إلى كراما alus: كرّمه هو وما يخصّه بالـ krama inggil، وتواضع أنت بالـ krama andhap، وأضف تحية في أولها وشكرًا في آخرها:
            "Pak Slamet, jenengku Mohamed. Setu sore aku arep dolan menyang omahmu. Aku arep menehi oleh-oleh saka Mesir kanggo bojomu. Kowe ana ing omah?"
          en: |
            You're messaging Pak Slamet, the elderly andong driver you met on Malioboro. Turn this ngoko message into krama alus: raise him and his things with krama inggil, lower yourself with krama andhap, and add a greeting at the start and thanks at the end:
            "Pak Slamet, jenengku Mohamed. Setu sore aku arep dolan menyang omahmu. Aku arep menehi oleh-oleh saka Mesir kanggo bojomu. Kowe ana ing omah?"
        rubric:
          - Raises Pak Slamet and his things with krama inggil (omahmu → dalemipun Bapak, bojomu → garwanipun, kanggo → kagem; ana ing omah → wonten dalem) and addresses him as Bapak / panjenengan.
          - Lowers his own actions with krama andhap (dolan menyang → sowan dhateng, menehi → ngaturaken) and never uses krama inggil about himself (nami kula, not asma kula).
          - Uses a full krama frame (kula, badhe, saking, Setu sonten, wonten) with no ngoko left in the message.
          - Opens and closes politely (sugeng enjing / nyuwun sewu …, matur nuwun sanget).
        sample: |
          Sugeng enjing, Pak Slamet. Nami kula Mohamed. Setu sonten kula badhe sowan dhateng dalemipun Bapak.
          Kula badhe ngaturaken oleh-oleh saking Mesir kagem garwanipun. Bapak wonten dalem?
          Matur nuwun sanget, Pak.
        words: [sowan, dalem, ngaturaken, kagem, garwa]
  - id: speaking
    skill: speaking
    title:
      ar_eg: الكلام
      ar: المحادثة
      en: Speaking
    instructions:
      ar_eg: اتكلم براحتك وبالراحة. كرّم اللي قدّامك، واتواضع إنت.
      ar: تكلّم بهدوء وارتياح؛ كرّم من أمامك وتواضع أنت.
      en: Speak calmly and at ease. Honour the person in front of you, and stay humble yourself.
    items:
      - id: t37
        type: speaking
        text: Sugeng rawuh, Pak. Mangga lenggah. Panjenengan kersa ngunjuk teh?
        meaning:
          ar_eg: أهلًا وسهلًا يا أستاذ. اتفضل اقعد. حضرتك تحب تشرب شاي؟
          ar: مرحبًا بك يا سيدي. تفضّل بالجلوس. هل تودّ شرب الشاي؟
          en: Welcome, sir. Please have a seat. Would you like some tea?
        words: [sugeng rawuh, lenggah, kersa, ngunjuk]
      - id: t38
        type: speaking_task
        points: 4
        prompt:
          ar_eg: 'جهاز "Unggah-Ungguh Simulator": إنت زاير Bu Ningsih في Kampung Taman. اتكلم حوالي دقيقة ونص وعدّي الخمس مواقف: (١) نادي على الباب، (٢) ردّ لما تسألك ''Pripun kabaripun?''، (٣) هي جايبة أكل: قول لها ما تتعبش نفسها، وبعد الأكل قول إنك شبعت، (٤) عدّي قدّام جوزها القاعد، (٥) استأذن وامشي.'
          ar: 'محاكي "Unggah-Ungguh Simulator": أنت في زيارة Bu Ningsih في Kampung Taman. تحدّث نحو دقيقة ونصف واجتز المواقف الخمسة: (١) نادِ عند الباب، (٢) أجب حين تسألك ''Pripun kabaripun?''، (٣) جاءت بالطعام: اطلب منها ألّا تتعب نفسها، وبعد الأكل قل إنك اكتفيت، (٤) مُرّ أمام زوجها الجالس، (٥) استأذن وانصرف.'
          en: 'Unggah-Ungguh Simulator: you''re visiting Bu Ningsih in Kampung Taman. Talk for about a minute and a half and get through the five situations: (1) call out at the door, (2) answer when she asks ''Pripun kabaripun?'', (3) she brings food: ask her not to go to any trouble, and after eating say you''ve had plenty, (4) pass in front of her seated husband, (5) take your leave.'
        rubric:
          - Uses the right set phrase for each of the five situations (Kula nuwun · Pangestunipun, sae · Sampun repot-repot / Sampun cekap, matur nuwun · Nuwun sewu, ndherek langkung · Kula nyuwun pamit rumiyin).
          - Speaks krama throughout, with krama inggil for the hosts (e.g. panjenengan, Bapak, dhahar, ngunjuk) and plain krama or krama andhap for himself (nedha, nginum, nyuwun, matur), never "kula dhahar".
          - Shows the matching gestures or mentions them where they belong (stooping and the lowered right hand when passing, the right hand for taking the glass).
          - Speaks slowly and clearly enough for an elder to follow; small slips are fine.
        sample: |
          Kula nuwun! … Matur nuwun, Bu. Pangestunipun, sae.
          Sampun repot-repot, Bu. … Sampun cekap, matur nuwun sanget.
          Nuwun sewu, Pak, ndherek langkung.
          Bu, kula nyuwun pamit rumiyin. Matur nuwun sanget.
        words: [kula nuwun, pangestunipun, sampun cekap, ndherek langkung, nyuwun pamit]
