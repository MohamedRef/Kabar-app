schema: kabar.test/v1
id: j5.test
language: jv
kind: level
title:
  ar_eg: اختبار مستوى J5 — ماديون، مدينة المقاتلين (قراية نصوص جاوي حقيقية)
  ar: اختبار مستوى J5 — ماديون، مدينة المقاتلين (قراءة نصوص جاوية حقيقية)
  en: J5 level test — Madiun, the Kutha Pendekar (reading real Javanese)
intro:
  ar_eg: |
    خلّصت J5: ماديون، ومعاها رحلات Kudus وDemak! هنا هتقرا مقالة على طريقة ويكيبيديا، وخبر بالمبني للمجهول، وقصة قصيرة (cerkak)، وبوست متلخبط جاوي وإندونيسي وإنجليزي، وهترجّع سبيلنج الشات للسبيلنج القياسي، وتشرح أغنية.
    خد وقتك. مش مطلوب تفهم كل كلمة؛ دوّر على الهيكل (iku، kang، dening، banjur، pungkasane) والمعنى هيبان. السبيلنج العادي مطلوب بس في الأسئلة اللي بتسأل عنه؛ غير كده بعلامات أو من غيرها — كله مقبول.
    ولو جاي من "Take a flight" عشان تعدّي J5، أهلًا بيك — نفس الأسئلة.
  ar: |
    أنهيتَ J5: ماديون، ومعها رحلتا Kudus وDemak! ستقرأ هنا مقالة على طريقة ويكيبيديا، وخبرًا بالمبني للمجهول، وقصة قصيرة (cerkak)، ومنشورًا يمزج الجاوية بالإندونيسية والإنجليزية، وتعيد تهجئة الدردشة إلى التهجئة المعيارية، وتشرح أغنية.
    خذ وقتك؛ لا يلزمك فهم كل كلمة، فابحث عن الهيكل (iku، kang، dening، banjur، pungkasane) يتّضح المعنى. التهجئة المعيارية مطلوبة فقط في الأسئلة التي تسأل عنها، وفيما عدا ذلك يُقبل الكلام بالعلامات أو بدونها.
    وإن جئت من "Take a flight" لتتجاوز J5، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    You've finished J5: Madiun, with its day trips to Kudus and Demak! Here you'll read an encyclopedia-style article, a news item in the passive, a short story (cerkak) and a post mixing Javanese, Indonesian and English; you'll turn chat spelling back into standard spelling, and explain a song.
    Take your time. You don't need every word: find the skeleton (iku, kang, dening, banjur, pungkasane) and the meaning appears. Standard spelling only matters in the items that ask about it; elsewhere, with or without accents, all is accepted.
    If you came through "Take a flight" to skip J5, welcome: these are the same questions.
minutes: 40
pass_mark: 0.7
scoring: Score = points earned / points available (closed items 1 point unless set; translate items are graded against reference answers first, with or without accents, then AI grade_answer; the spelling-normalisation item requires standard spelling; writing_task and speaking_task are graded by AI against their rubric, each criterion an equal share of the item's points). Pass at >= 0.7 (the curriculum's J5 mark). Passing marks J5 complete and opens J6; the same rule applies when the test is taken as the "Take a flight" skip-ahead over J5. Below the mark, show the per-skill results and suggest the units behind the missed items, with no penalty and an open retry. Javanese items stay unverified until the learner approves them.
sections:
  - id: listening
    skill: listening
    title:
      ar_eg: الاستماع
      ar: الاستماع
      en: Listening
    instructions:
      ar_eg: اسمع، وعيد براحتك، واختار اللي سمعته أو جاوب على السؤال أو اكتبه.
      ar: استمع وأعِد كما تشاء، ثم اختر ما سمعته أو أجب عن السؤال أو اكتبه.
      en: Listen, replay as you like, then pick what you heard, answer the question, or write it.
    items:
      - id: t01
        unit: j5.u01
        type: listen
        text: Jalan Pahlawan iku papan kang misuwur ing Madiun.
        options:
          - Jalan Pahlawan iku papan kang lawas ing Madiun.
          - Jalan Pahlawan iku papan kang misuwur ing Madiun.
          - Jalan Pahlawan iku papan sing misuwur neng Madiun.
        answer: 1
        words: [kang, misuwur]
      - id: t02
        unit: j5.u02
        type: listen
        text: Dalan ing Manguharjo kebanjiran wingi sore.
        question:
          ar_eg: الشارع غرق إمتى؟
          ar: متى غمر الماءُ الشارع؟
          en: When was the road flooded?
        options: [esuk iki, sesuk esuk, wingi sore]
        answer: 2
        meaning:
          ar_eg: الشارع في Manguharjo غرق مية امبارح العصر.
          ar: غمرت المياهُ الشارعَ في Manguharjo عصر أمس.
          en: The road in Manguharjo was flooded yesterday afternoon.
        words: [kebanjiran]
      - id: t03
        unit: j5.u03
        type: listen
        text: Hawane adhem banget.
        options: ["Hawane adhem banget.", "Hawane adem banget."]
        answer: 0
        meaning:
          ar_eg: الجو برد قوي.
          ar: الجو بارد جدًا.
          en: The weather is really cold.
        words: [adhem, hawa]
      - id: t04
        unit: j5.u04
        type: listen
        text: Sabar ya, aku lagi OTW.
        question:
          ar_eg: صاحبك يقصد إيه؟
          ar: ماذا يقصد صديقك؟
          en: What does your friend mean?
        options: ["Maaf, aku tidak bisa datang.", "Tunggu ya, aku sedang di jalan.", "Aku sudah sampai."]
        answer: 1
        meaning:
          ar_eg: استنى شوية، أنا في الطريق.
          ar: انتظر قليلًا، أنا في الطريق.
          en: Hang on, I'm on my way.
        words: [sabar, OTW]
      - id: t05
        unit: j5.u05
        type: listen
        text: Ing sawijining dina, kucinge Sari ilang. Sari golek ing kebon, nuli ing pasar. Pungkasane, kucinge mulih dhewe.
        question:
          ar_eg: الحكاية خلصت إزاي؟
          ar: كيف انتهت الحكاية؟
          en: How does the story end?
        options:
          - Sari menemukan kucingnya di pasar.
          - Kucingnya hilang lagi.
          - Kucingnya pulang sendiri.
        answer: 2
        meaning:
          ar_eg: في يوم من الأيام، قطة Sari ضاعت. Sari دوّرت في الجنينة، وبعدين في السوق. وفي الآخر القطة رجعت البيت لوحدها.
          ar: في يوم من الأيام ضاعت قطة Sari، فبحثت عنها في الحديقة ثم في السوق، وفي النهاية عادت القطة إلى البيت وحدها.
          en: One day, Sari's cat went missing. Sari searched in the garden, then at the market. In the end, the cat came home by itself.
        words: [ing sawijining dina, nuli, pungkasane]
      - id: t06
        unit: j5.u02
        type: dictation
        text: Stasiun Madiun dibangun ing jaman Walanda.
        meaning:
          ar_eg: محطة ماديون اتبنت أيام الهولنديين.
          ar: بُنيت محطة ماديون في العهد الهولندي.
          en: Madiun Station was built in the Dutch era.
        words: [dibangun, jaman]
  - id: reading
    skill: reading
    title:
      ar_eg: القراية
      ar: القراءة
      en: Reading
    instructions:
      ar_eg: اقرا المقالة والخبر والقصة والبوست، وجاوب من اللي مكتوب. دوّر على الهيكل الأول.
      ar: اقرأ المقالة والخبر والقصة والمنشور، وأجب مما ورد فيها. ابحث عن الهيكل أولًا.
      en: Read the article, the news item, the story and the post, and answer from what they say. Find the skeleton first.
    items:
      - id: t07
        unit: j5.u01
        type: multiple_choice
        question: |
          BENTENG PENDEM
          Benteng Pendem iku sawijining benteng lawas ing Ngawi, ora adoh saka kutha Madiun. Ing benteng iki ana gedhong lawas kanggo prajurit. Benteng Pendem dibangun dening Walanda ing jaman Walanda. Saiki Benteng Pendem dadi papan wisata, lan kalebu papan kang misuwur ing Jawa Timur.
        question_meaning:
          ar_eg: Benteng Pendem إيه؟
          ar: ما Benteng Pendem؟
          en: What is Benteng Pendem?
        options: ["Sebuah stasiun kereta di Kudus.", "Sebuah benteng tua di dekat Madiun.", "Sebuah pasar di alun-alun."]
        answer: 1
        words: [sawijining, gedhong, lawas]
      - id: t08
        unit: j5.u02
        type: multiple_choice
        question: |
          BENTENG PENDEM
          Benteng Pendem iku sawijining benteng lawas ing Ngawi, ora adoh saka kutha Madiun. Ing benteng iki ana gedhong lawas kanggo prajurit. Benteng Pendem dibangun dening Walanda ing jaman Walanda. Saiki Benteng Pendem dadi papan wisata, lan kalebu papan kang misuwur ing Jawa Timur.
        question_meaning:
          ar_eg: مين اللي بنى Benteng Pendem؟
          ar: مَن بنى Benteng Pendem؟
          en: Who built Benteng Pendem?
        options: ["Warga Madiun.", "Sultan Demak.", "Orang Belanda."]
        answer: 2
        explain:
          ar_eg: dibangun dening … = اتبنى على إيد … (dening = oleh)، والفاعل الحقيقي بييجي بعد dening.
          ar: dibangun dening … = بُني على يد …، فـ dening = oleh، والفاعل الحقيقي يأتي بعدها.
          en: dibangun dening … = was built by …; dening = oleh, and the real doer comes after it.
        words: [dibangun, dening]
      - id: t09
        unit: j5.u01
        type: multiple_choice
        question: |
          BENTENG PENDEM
          Benteng Pendem iku sawijining benteng lawas ing Ngawi, ora adoh saka kutha Madiun. Ing benteng iki ana gedhong lawas kanggo prajurit. Benteng Pendem dibangun dening Walanda ing jaman Walanda. Saiki Benteng Pendem dadi papan wisata, lan kalebu papan kang misuwur ing Jawa Timur.
        question_meaning:
          ar_eg: Benteng Pendem بقى إيه دلوقتي؟
          ar: ماذا صار Benteng Pendem اليوم؟
          en: What is Benteng Pendem today?
        options: ["Tempat wisata yang terkenal.", "Stasiun kereta api.", "Kantor lurah."]
        answer: 0
        words: [dadi, kalebu]
      - id: t10
        unit: j5.u02
        type: multiple_choice
        question: |
          WARTA CEKAK
          Pak Slamet kapilih dadi lurah anyar dening warga desa. Wingi sore, dalan ing desa kasebut kebanjiran. Esuk iki, dalan kasebut wis diresiki dening warga lan lurah anyar.
        question_meaning:
          ar_eg: مين اللي اختار Pak Slamet؟
          ar: مَن اختار Pak Slamet؟
          en: Who chose Pak Slamet?
        options: ["Pak Harjo.", "Warga desa.", "Perusahaan kereta api."]
        answer: 1
        explain:
          ar_eg: kapilih = dipilih (مبني للمجهول رسمي)، وdening warga desa = على إيد أهل القرية.
          ar: kapilih = dipilih (مبني للمجهول رسمي)، وdening warga desa = من قِبَل أهل القرية.
          en: kapilih = dipilih (the formal passive), and dening warga desa = by the villagers.
        words: [kapilih, dening]
      - id: t11
        unit: j5.u02
        type: multiple_choice
        question: |
          WARTA CEKAK
          Pak Slamet kapilih dadi lurah anyar dening warga desa. Wingi sore, dalan ing desa kasebut kebanjiran. Esuk iki, dalan kasebut wis diresiki dening warga lan lurah anyar.
        question_meaning:
          ar_eg: إيه اللي حصل امبارح العصر، وإيه اللي حصل النهارده الصبح؟
          ar: ماذا حدث عصر أمس، وماذا حدث صباح اليوم؟
          en: What happened yesterday afternoon, and what happened this morning?
        options:
          - Jalannya dibangun kemarin, dan dibersihkan pagi ini.
          - Jalannya kebanjiran kemarin sore, dan dibersihkan warga dan lurah pagi ini.
          - Lurahnya dipilih pagi ini, dan jalannya kebanjiran sore nanti.
        answer: 1
        words: [kebanjiran, diresiki, kasebut]
      - id: t12
        unit: j5.u05
        type: multiple_choice
        question: |
          Ing sawijining dina, Bima lan simbahe lunga menyang pasar. Sadurunge lunga, simbah kandha, "Aja lali payung, ya." Nanging Bima lali. Bareng tekan pasar, dumadakan udan deres. Bima lan simbahe teles kabeh. Pungkasane, simbah tuku payung anyar ing pasar. Wiwit iku, Bima ora tau lali payung.
        question_meaning:
          ar_eg: الجدّ قال لـ Bima إيه قبل ما يمشوا؟
          ar: ماذا قال الجدّ لـ Bima قبل أن يخرجا؟
          en: What did Grandpa tell Bima before they left?
        options: ["Ayo makan jenang.", "Jangan pergi ke pasar.", "Jangan lupa payung."]
        answer: 2
        words: [sadurunge, aja lali]
      - id: t13
        unit: j5.u05
        type: multiple_choice
        question: |
          Ing sawijining dina, Bima lan simbahe lunga menyang pasar. Sadurunge lunga, simbah kandha, "Aja lali payung, ya." Nanging Bima lali. Bareng tekan pasar, dumadakan udan deres. Bima lan simbahe teles kabeh. Pungkasane, simbah tuku payung anyar ing pasar. Wiwit iku, Bima ora tau lali payung.
        question_meaning:
          ar_eg: إيه اللي حصل أول ما وصلوا السوق؟
          ar: ماذا حدث فور وصولهما إلى السوق؟
          en: What happened as soon as they reached the market?
        options: ["Tiba-tiba hujan deras.", "Bima hilang.", "Simbah membeli jenang."]
        answer: 0
        explain:
          ar_eg: bareng في أول الجملة في الحكاية = «أول ما»، وdumadakan = فجأة.
          ar: bareng في أول الجملة القصصية = «ما إن»، وdumadakan = فجأة.
          en: bareng opening a clause in a story = "as soon as", and dumadakan = suddenly.
        words: [bareng, tekan, dumadakan]
      - id: t14
        unit: j5.u05
        type: multiple_choice
        question: |
          Ing sawijining dina, Bima lan simbahe lunga menyang pasar. Sadurunge lunga, simbah kandha, "Aja lali payung, ya." Nanging Bima lali. Bareng tekan pasar, dumadakan udan deres. Bima lan simbahe teles kabeh. Pungkasane, simbah tuku payung anyar ing pasar. Wiwit iku, Bima ora tau lali payung.
        question_meaning:
          ar_eg: Bima اتغيّر إزاي من ساعتها؟
          ar: كيف تغيّر Bima منذ ذلك الحين؟
          en: How has Bima changed since then?
        options:
          - Bima tidak mau ke pasar lagi.
          - Bima tidak pernah lupa payung lagi.
          - Bima selalu membeli payung baru.
        answer: 1
        explain:
          ar_eg: wiwit iku = من ساعتها، وora tau = عمره ما.
          ar: wiwit iku = منذ ذلك الحين، وora tau = لم يحدث قط.
          en: wiwit iku = from then on, and ora tau = never.
        words: [wiwit iku, pungkasane]
      - id: t15
        unit: j5.u04
        type: multiple_choice
        question: Guys, videone udh tak upload neng grup, ojo lali like yo!
        question_meaning:
          ar_eg: الكاتب عمل إيه؟
          ar: ماذا فعل الكاتب؟
          en: What has the writer done?
        options:
          - Dia lupa mengunggah videonya.
          - Dia minta video dari grup.
          - Dia sudah mengunggah videonya ke grup.
        answer: 2
        words: [udh, tak, neng]
      - id: t16
        unit: j5.u04
        type: multiple_choice
        question: Guys, videone udh tak upload neng grup, ojo lali like yo!
        question_meaning:
          ar_eg: أنهي مجموعة كلها كلمات من الهيكل الجاوي؟
          ar: أيّ مجموعة كلها من كلمات الهيكل الجاوي؟
          en: Which group is all Javanese frame words?
        options: ["guys, upload, like", "udh, grup", "tak, neng, ojo, yo"]
        answer: 2
        explain:
          ar_eg: tak وneng وojo (= aja) وyo (= ya) جاوي. guys وupload وlike إنجليزي، وudh (sudah) إندونيسي.
          ar: tak وneng وojo (= aja) وyo (= ya) جاوية، وguys وupload وlike إنجليزية، وudh (sudah) إندونيسية.
          en: tak, neng, ojo (= aja) and yo (= ya) are Javanese; guys, upload and like are English; udh (sudah) is Indonesian.
        words: [campur kode]
