      - id: t37
        unit: j5.u05
        type: writing_task
        points: 4
        prompt:
          ar_eg: |
            Mas Rizal فاته يقرا القصة بتاعة Bima والشمسية (في قسم القراية). احكيهاله تاني بالنغوكو اللي بنتكلمها، في ٣–٥ جمل قصيرة: Bima راح فين ومع مين، إيه اللي حصل، وخلصت إزاي.
          ar: |
            لم يقرأ Mas Rizal قصة Bima والمظلّة (في قسم القراءة). أعِد سردها له بالنغوكو المحكية في ٣–٥ جمل قصيرة: إلى أين ذهب Bima ومع من، وماذا حدث، وكيف انتهت.
          en: |
            Mas Rizal missed the story about Bima and the umbrella (in the Reading section). Retell it to him in spoken ngoko, in 3–5 short sentences: where Bima went and with whom, what happened, and how it ended.
        rubric:
          - Retells the main events in the right order (going to the market with grandpa, forgetting the umbrella, the sudden rain, the new umbrella / never forgetting again).
          - Uses story connectors correctly (sawise / sadurunge, bareng or dumadakan, terus / banjur, pungkasane or wiwit iku).
          - Turns book style into everyday ngoko (ing → neng, lan → karo, nuli → terus) with short, clear sentences.
          - Javanese is understandable and mostly correct; no krama or Indonesian mixed in where ngoko is expected (small slips are fine).
        sample: |
          Bima karo simbahe lunga neng pasar. Sadurunge lunga, simbah kandha aja lali payung, nanging Bima lali.
          Bareng tekan pasar, dumadakan udan deres, terus Bima karo simbahe teles kabeh.
          Pungkasane simbah tuku payung anyar. Wiwit iku Bima ora tau lali payung.
        words: [critakna maneh, bareng, pungkasane]
  - id: speaking
    skill: speaking
    title:
      ar_eg: الكلام
      ar: المحادثة
      en: Speaking
    instructions:
      ar_eg: اتكلم براحتك وبالراحة. لما تحكي لصاحبك، رجّع لغة الكتب للغة الكلام.
      ar: تكلّم بهدوء وارتياح، وحين تحكي لصديقك أعِد لغة الكتب إلى لغة الكلام.
      en: Speak calmly and at ease. When you tell a friend, turn book language back into speech.
    items:
      - id: t38
        unit: j5.u06
        type: speaking
        text: Ngelmu iku kalakone kanthi laku.
        meaning:
          ar_eg: العلم بيتحقق بالعمل.
          ar: العلم يُنال بالعمل.
          en: Knowledge is attained through practice.
        words: [ngelmu, kanthi, laku]
      - id: t39
        unit: j5.u06
        type: speaking_task
        points: 4
        prompt:
          ar_eg: 'Mas Rizal قاعد معاك في وارونج في Demak. اتكلم حوالي دقيقة ونص بالنغوكو: (١) احكيله خبر الفيضان (نهر ماديون فاض امبارح العصر والشارع في Manguharjo غرق، والنهارده الصبح الناس نضّفوه)، (٢) واشرحله بيت Pocung «Ngelmu iku kalakone kanthi laku»: حكايته (critane)، ومعناه (tegese)، والدرس اللي فيه (piwulange).'
          ar: 'يجلس معك Mas Rizal في وارونج في Demak. تحدّث نحو دقيقة ونصف بالنغوكو: (١) احكِ له خبر الفيضان (فاض نهر ماديون عصر أمس فغمر الماء الشارع في Manguharjo، ونظّفه الأهالي صباح اليوم)، (٢) واشرح له بيت Pocung «Ngelmu iku kalakone kanthi laku»: قصته (critane) ومعناه (tegese) وعبرته (piwulange).'
          en: 'Mas Rizal is sitting with you at a warung in Demak. Talk for about a minute and a half in ngoko: (1) tell him the flood news (the Madiun river overflowed yesterday afternoon and flooded the road in Manguharjo; residents cleaned it this morning), (2) explain the Pocung line "Ngelmu iku kalakone kanthi laku": what it''s about (critane), what it means (tegese) and its lesson (piwulange).'
        rubric:
          - Retells the news clearly in spoken ngoko (neng / sing instead of ing / kang), with when it happened and who cleaned the road (diresiki dening warga, or a natural spoken equivalent).
          - Explains the Pocung line with critane / tegese / piwulange and gets its meaning right (knowledge has to be practised, not only read), and may link ngelmu to Arabic «علم».
          - Uses ngoko with a friend throughout, with sensible connectors (wingi sore, esuk iki, terus, merga).
          - Speaks clearly at a natural pace; small slips are fine.
        sample: |
          Mas, wingi sore Kali Madiun luber, dalan neng Manguharjo kebanjiran. Esuk iki wis diresiki dening warga, saiki aman.
          Terus, tembang Pocung iki saka Serat Wulangreh. Tegese, ngelmu iku ora cukup diwaca, kudu dilakoni.
          Piwulange, ngelmu kudu dilakoni. Ngelmu iku saka basa Arab, «علم».
        words: [critane, tegese, piwulange, luber]
