        type: multiple_choice
        question: |
          Saben dina Sari tangi jam setengah lima, terus salat Subuh. Jam enem Sari ngresiki omah, lan jam pitu sarapan karo Ibu. Awan Sari masak. Sore Sari nyirami kembang. Bengi Sari maca buku, terus turu jam sepuluh.
        question_meaning:
          ar_eg: Sari بتعمل إيه العصر (sore)؟
          ar: ماذا تفعل Sari بعد الظهر (sore)؟
          en: What does Sari do in the afternoon (sore)?
        options: ["Masak.", "Maca buku.", "Nyirami kembang."]
        answer: 2
        words: [sore, nyirami]
      - id: t12
        type: multiple_choice
        question: |
          Saben dina Sari tangi jam setengah lima, terus salat Subuh. Jam enem Sari ngresiki omah, lan jam pitu sarapan karo Ibu. Awan Sari masak. Sore Sari nyirami kembang. Bengi Sari maca buku, terus turu jam sepuluh.
        question_meaning:
          ar_eg: Sari بتصحى الساعة كام؟
          ar: متى تستيقظ Sari؟
          en: What time does Sari wake up?
        options: [jam lima, jam setengah lima, jam enem]
        answer: 1
        explain:
          ar_eg: setengah lima = نص الطريق لخمسة، يعني ٤:٣٠ — زي الإندونيسي.
          ar: setengah lima = منتصف الطريق إلى الخامسة، أي ٤:٣٠، كما في الإندونيسية.
          en: setengah lima = halfway to five, i.e. 4:30, just as in Indonesian.
        words: [tangi, setengah]
