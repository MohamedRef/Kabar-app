          ar: أرسل Dimas هذه الرسالة. أيّ جملة هي نفسها بالتهجئة المعيارية؟
          en: Dimas sends this message. Which option is the same sentence in standard spelling?
        options:
          - Wingi Jemuwah jam papat sore, isa?
          - Sesuk Jemuwah jam papat esuk, isa?
          - Sesuk Jemuwah jam papat sore, isa?
        answer: 2
        words: [sesuk, isa]
