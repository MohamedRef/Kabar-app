schema: kabar.test/v1
id: j2.test
language: jv
kind: level
title:
  ar_eg: اختبار مستوى J2 — ماديون
  ar: اختبار مستوى J2 — ماديون
  en: J2 level test — Madiun
intro:
  ar_eg: |
    كمّلت الخط من Madiun لحد Ngawi! هنا هتتكلم عن العيلة والأكل، وتتعامل مع أرقام لحد الملايين، والساعة وأيام الـ pasaran، وتدّي أوامر بالنغوكو بأدب.
    خد وقتك. السبيلنج العادي أو بتاع الشات، وبعلامات على الـ e أو من غيرها — كله مقبول.
    ولو جاي من «اركب القطر السريع» عشان تعدّي J2، أهلًا بيك — نفس الأسئلة.
  ar: |
    أكملتَ الخط من Madiun إلى Ngawi! ستتحدث هنا عن العائلة والطعام، وتتعامل مع الأرقام حتى الملايين، والساعة وأيام الـ pasaran، وتُصدر أوامر بالنغوكو بلطف.
    خذ وقتك. تُقبل التهجئة المعيارية أو تهجئة الدردشة، بعلامات على الـ e أو بدونها.
    وإن جئت من «اركب القطار السريع» لتتجاوز J2، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    You've ridden the line from Madiun to Ngawi! Here you'll talk about family and food, handle numbers up to millions, tell the time and the pasaran days, and give friendly ngoko commands.
    Take your time. Standard or chat spelling, with or without accents on the e, is all accepted.
    If you came through "Take the express" to skip J2, welcome: these are the same questions.
minutes: 30
pass_mark: 0.75
scoring: Score = points earned / points available (closed items 1 point unless set; translate items are graded against reference answers first, standard or chat spelling, with or without accents, then AI grade_answer; writing_task and speaking_task are graded by AI against their rubric, each criterion an equal share of the item's points). Pass at >= 0.75. Passing marks J2 complete and opens J3; the same rule applies when the test is taken as the "Take a flight" skip-ahead over J2. Below the mark, show the per-skill results and suggest the units behind the missed items, with no penalty and an open retry. Javanese items stay unverified until the learner approves them.
