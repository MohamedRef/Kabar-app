        question_meaning:
          ar_eg: أنهي صيغة صح لـ "سعره / السعر"؟
          ar: ما الصيغة الصحيحة لـ "سعره / السعر"؟
          en: Which is the right form for "its price / the price"?
        options: [regae, regane, reganya]
        answer: 1
        explain:
          ar_eg: بعد حرف متحرك (rega) بنحط -ne؛ بعد ساكن (omah) بنحط -e.
          ar: بعد الحرف الصائت (rega) نضيف -ne، وبعد الصامت (omah) نضيف -e.
          en: After a vowel (rega) add -ne; after a consonant (omah) add -e.
