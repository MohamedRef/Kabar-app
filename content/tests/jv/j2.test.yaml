        answer: 1
        explain:
          ar_eg: اتفقوا على selawe ewu (٢٥٫٠٠٠) للكيلو × ٣ = pitung puluh lima ewu (٧٥٫٠٠٠).
          ar: اتفقا على selawe ewu (٢٥٫٠٠٠) للكيلو × ٣ = pitung puluh lima ewu (٧٥٫٠٠٠).
          en: They agree on selawe ewu (25,000) a kilo × 3 = pitung puluh lima ewu (75,000).
        words: [selawe, pitung puluh]
      - id: t10
        type: multiple_choice
