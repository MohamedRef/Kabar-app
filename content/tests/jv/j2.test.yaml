        points: 4
        prompt:
          ar_eg: 'اكتب ٦–٨ جمل بالنغوكو: عرّف بعيلتك (مين فيها وعايشين فين)، واحكي يومك العادي بالساعات (صحيت إمتى، أكلت إيه، عملت إيه الصبح والعصر وبالليل).'
          ar: 'اكتب ٦–٨ جمل بالنغوكو: عرّف بعائلتك (مَن فيها وأين يعيشون)، وصِف يومك المعتاد مع الأوقات (متى تستيقظ، وماذا تأكل، وماذا تفعل صباحًا وبعد الظهر وليلًا).'
          en: 'Write 6–8 sentences in ngoko: introduce your family (who they are and where they live) and describe your usual day with times (when you wake up, what you eat, what you do in the morning, afternoon and evening).'
        rubric:
          - Names family members with the right kinship words and possessives (bapakku, masku, mbakyuku, adhine …).
          - Gives a clear routine with times (jam lima, jam setengah wolu …) and time words (esuk, awan, sore, bengi, saben dina).
          - Uses J2 verb forms correctly (N- verbs like nulis / ngombe / nyirami, -i verbs) and links sentences with lan / terus / nanging.
          - Stays in ngoko with no Indonesian words where J1–J2 Javanese exists; 6–8 sentences.
        sample: |
          Bapak lan ibuku manggon neng Kairo. Aku duwe mbakyu siji lan adhi loro.
          Aku ora duwe mas, nanging pakdheku nyambut gawe neng Aswan.
          Saben dina aku tangi jam lima, terus salat Subuh.
          Jam pitu aku sarapan lan ngombe teh anget.
          Jam wolu aku mangkat kuliah. Awan aku mulih lan masak.
          Sore aku sinau basa Jawa. Bengi aku maca buku, terus turu jam sepuluh.
        words: [kulawarga, saben dina]
  - id: speaking
    skill: speaking
    title:
      ar_eg: الكلام
      ar: المحادثة
      en: Speaking
    instructions:
      ar_eg: اتكلم براحتك. المهم إن صاحبك من Madiun يفهمك.
      ar: تكلّم بارتياح. المهم أن يفهمك صديقك من Madiun.
      en: Speak at ease. What matters is that your friend from Madiun understands you.
    items:
      - id: t34
        type: speaking
        text: Sesuk Jemuwah jam papat sore, isa?
        meaning:
          ar_eg: بكرة الجمعة الساعة أربعة العصر، ينفع؟
          ar: غدًا الجمعة في الرابعة عصرًا، هل يناسبك؟
          en: Tomorrow, Friday, at 4 p.m. — can you?
        words: [sesuk, sore, isa]
      - id: t35
        type: speaking_task
        points: 4
        prompt:
          ar_eg: 'Dimas عايزك تيجي معاه تتفرج على Reog. اتكلم حوالي دقيقة ونص: اسأل الحفلة إمتى (يوم، pasaran، ساعة)، قول إمتى مش فاضي وليه، واقترح ميعاد ومكان تتقابلوا فيه، وبعدين احكي باختصار عملت إيه في آخر ويك إند.'
          ar: 'يدعوك Dimas لمشاهدة Reog. تحدّث نحو دقيقة ونصف: اسأل متى العرض (اليوم، والـ pasaran، والساعة)، وقل متى لا تستطيع ولماذا، واقترح موعدًا ومكانًا للقاء، ثم احكِ باختصار ما فعلته في عطلة نهاية الأسبوع الماضية.'
          en: 'Dimas invites you to watch Reog. Talk for about a minute and a half: ask when it is (day, pasaran, time), say when you can''t make it and why, suggest a time and a meeting place, then briefly tell what you did last weekend.'
        rubric:
          - Asks and answers about time with the right forms (jam pira, setengah …, kurang / luwih seprapat, sore / bengi) and days with pasaran.
          - Turns down or accepts politely with a reason (aku ora isa, merga …) and proposes a plan (ketemu neng ngarep …).
          - Tells a short weekend story with reduplication and linking words (dolan-dolan, mlaku-mlaku, terus, nanging).
          - Speaks in ngoko a Madiun listener follows easily; pauses are fine.
        sample: |
          Reoge kapan, Dimas? Setu Pon, jam wolu bengi? Jemuwah aku ora isa, merga aku Jumatan lan sinau.
          Setu isa! Ketemu jam setengah wolu neng ngarep alun-alun, ya.
          Minggu wingi aku dolan-dolan neng Ngawi karo kancaku. Esuk mlaku-mlaku neng Benteng Pendem, terus ngombe es dawet. Apik tenan, nanging puanas!
        words: [ketemu, dolan-dolan]
