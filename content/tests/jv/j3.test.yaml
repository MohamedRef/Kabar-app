      - id: t33
        type: writing_task
        points: 4
        prompt:
          ar_eg: |
            هتبعت رسالة لـ Pak Harjo، تاجر الباتيك الكبير في السن. حوّل الرسالة دي من النغوكو للكراما، وزوّد في أولها تحية وفي آخرها شكر:
            "Aku Mohamed, saka Mesir. Aku isih sinau basa Jawa. Aku arep nang pasar karo Mas Dimas. Aku arep tuku batik kanggo ibuku. Regané pira?"
          ar: |
            سترسل رسالة إلى Pak Harjo، تاجر الباتيك المسنّ. حوّل هذه الرسالة من النغوكو إلى الكراما، وأضف تحية في أولها وشكرًا في آخرها:
            "Aku Mohamed, saka Mesir. Aku isih sinau basa Jawa. Aku arep nang pasar karo Mas Dimas. Aku arep tuku batik kanggo ibuku. Regané pira?"
          en: |
            You're messaging Pak Harjo, the elderly batik merchant. Turn this ngoko message into krama, and add a greeting at the start and thanks at the end:
            "Aku Mohamed, saka Mesir. Aku isih sinau basa Jawa. Aku arep nang pasar karo Mas Dimas. Aku arep tuku batik kanggo ibuku. Regané pira?"
        rubric:
          - Swaps the pronouns and possessives correctly (aku → kula, ibuku → ibu kula) and never uses krama inggil about himself.
          - Swaps the function words (saka → saking, isih → taksih, arep → badhé, nang → dhateng, karo → kaliyan, kanggo → kangge).
          - Swaps the content words and questions (pasar → peken, tuku → tumbas, basa Jawa → basa Jawi, regané pira → reginipun pinten).
          - Opens and closes politely (sugeng enjing / nyuwun sewu …, matur nuwun) with no ngoko left in the message.
        sample: |
          Sugeng enjing, Pak Harjo. Kula Mohamed, saking Mesir. Kula taksih sinau basa Jawi.
          Kula badhé dhateng peken kaliyan Mas Dimas. Kula badhé tumbas batik kangge ibu kula. Reginipun pinten?
          Matur nuwun sanget, Pak.
        words: [kula, saking, taksih, badhé, kaliyan, kangge]
  - id: speaking
    skill: speaking
    title:
      ar_eg: الكلام
      ar: المحادثة
      en: Speaking
    instructions:
      ar_eg: اتكلم براحتك وبالراحة. أهم حاجة تختار المستوى الصح لكل شخص.
      ar: تكلّم بهدوء وارتياح؛ الأهم أن تختار المستوى المناسب لكل شخص.
      en: Speak calmly and at ease. Above all, pick the right level for each person.
    items:
      - id: t34
        type: speaking
        text: Nyuwun sewu, Mbah. Pasar Triwindu ing pundi, nggih?
        meaning:
          ar_eg: لا مؤاخذة يا حاجّة. Pasar Triwindu فين لو سمحتي؟
          ar: عذرًا يا جدّتي. أين Pasar Triwindu من فضلك؟
          en: Excuse me, Grandma. Where is Pasar Triwindu, please?
        words: [nyuwun sewu, ing pundi, nggih]
      - id: t35
        type: speaking_task
        points: 4
        prompt:
          ar_eg: 'Dimas خدك لبيت جدّته (Mbah Putri). اتكلم حوالي دقيقة ونص: سلّم عليها وعرّفها بنفسك بالكراما، ردّ لما تسألك ''Mas Mohamed sampun nedha?'' (إنت لسه ما كلتش)، اسألها هي كمان أكلت ولا لأ، وبعدين قول لـ Dimas بالنغوكو ''يلا نروّح''.'
          ar: 'اصطحبك Dimas إلى بيت جدّته (Mbah Putri). تحدّث نحو دقيقة ونصف: حيِّها وعرّف بنفسك بالكراما، وأجب حين تسألك ''Mas Mohamed sampun nedha?'' (لم تأكل بعد)، واسألها هي أيضًا إن كانت قد أكلت، ثم قل لـ Dimas بالنغوكو ''هيّا نعود إلى البيت''.'
          en: 'Dimas takes you to his grandmother''s house (Mbah Putri). Talk for about a minute and a half: greet her and introduce yourself in krama, answer when she asks ''Mas Mohamed sampun nedha?'' (you haven''t eaten yet), ask whether she has eaten, then tell Dimas in ngoko ''let''s go home''.'
        rubric:
          - Uses krama with the grandmother (sugeng …, nami kula …, kula saking …, dèrèng, matur nuwun) and krama inggil for her (panjenengan, dhahar).
          - Never uses krama inggil about himself (kula … nedha, not dhahar) and answers "Dalem?" or "Inggih" naturally when addressed.
          - Switches to ngoko with Dimas (ayo mulih, Mas), showing he chooses the level by the listener.
          - Speaks slowly and clearly enough for an elder to follow; small slips are fine.
        sample: |
          Sugeng sonten, Mbah. Nami kula Mohamed, kula saking Mesir. Kula taksih sinau basa Jawi.
          Dèrèng, Mbah, kula dèrèng nedha. Matur nuwun. Panjenengan sampun dhahar?
          Mas Dimas, ayo mulih!
        words: [nami kula, panjenengan, dhahar, nedha]
