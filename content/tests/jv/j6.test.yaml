      - id: t02
        unit: j6.u02
        type: listen
        text: gedhe
        question:
          ar_eg: سمعت كلمة معناها «كبير» (gê-dhé). بتتكتب إزاي؟
          ar: سمعت كلمة معناها «كبير» (gê-dhé). كيف تُكتب؟
          en: You heard the word for "big" (gê-dhé). How is it written?
        options: ["ꦒꦺꦝꦺ", "ꦒꦼꦝꦼ", "ꦒꦼꦝꦺ"]
        answer: 2
        meaning:
          ar_eg: كبير
          ar: كبير
          en: big
        words: [pepet, taling]
      - id: t03
        unit: j6.u03
        type: listen
        text: omah
        question:
          ar_eg: سمعت كلمة معناها «بيت». بتتكتب إزاي؟
          ar: سمعت كلمة معناها «بيت». كيف تُكتب؟
          en: You heard the word for "house". How is it written?
        options: ["ꦲꦺꦴꦩꦃ", "ꦲꦺꦴꦩ", "ꦲꦺꦴꦩꦁ"]
        answer: 0
        meaning:
          ar_eg: بيت
          ar: بيت
          en: house
        words: [wignyan, taling tarung]
      - id: t04
        unit: j6.u05
        type: listen
