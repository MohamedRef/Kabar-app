        question:
          ar_eg: سمعت كلمة معناها «سكر». بتتكتب إزاي بالبيجون؟
          ar: سمعت كلمة معناها «سكّر». كيف تُكتب بالبيجون؟
          en: You heard the word for "sugar". How is it written in Pegon?
        options: ["كولا", "ڮولا", "غولا"]
        answer: 1
        meaning:
          ar_eg: سكر
          ar: سكّر
          en: sugar
        words: [pegon]
      - id: t07
        unit: j6.u04
        type: dictation
        text: Kancaku mlaku menyang pasar.
        meaning:
          ar_eg: صاحبي ماشي على رجليه للسوق.
          ar: صديقي يمشي إلى السوق.
          en: My friend is walking to the market.
        words: [kanca, mlaku]
  - id: reading
    skill: reading
    title:
      ar_eg: القراية
      ar: القراءة
      en: Reading
    instructions:
      ar_eg: اقرا اللي مكتوب بالحروف الجاوية أو بالبيجون. اختار القراية الصح، أو اكتبها بالحروف اللاتيني (بمسافات أو من غيرها).
      ar: اقرأ المكتوب بالحروف الجاوية أو بالبيجون، ثم اختر القراءة الصحيحة أو اكتبها بالحروف اللاتينية (بمسافات أو بدونها).
      en: Read what is written in aksara Jawa or Pegon. Pick the right reading, or type it in Latin letters (with or without spaces).
    items:
      - id: t08
        unit: j6.u02
        type: fill_blank
        sentence: "ꦱꦥꦠꦼꦏ = ___"
        meaning:
          ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: مين جاي؟)"
          ar: "اكتب القراءة بالحروف اللاتينية. (معناها: من القادم؟)"
          en: Type the reading in Latin letters. (It means "who's coming?")
        answers: [sapa teka, Sapa teka, sapateka, "Sapa teka?", "sapa teka?", Sapateka]
        explain:
          ar_eg: sa · pa · tê (pepet فوق ꦠ) · ka. ومفيش علامة استفهام في الحروف الجاوية.
          ar: sa · pa · tê (pepet فوق ꦠ) · ka، ولا علامة استفهام في الحروف الجاوية.
          en: sa · pa · tê (pepet above ꦠ) · ka. Aksara Jawa has no question mark.
        words: [pepet]
      - id: t09
        unit: j6.u03
        type: fill_blank
        sentence: "ꦲꦏꦸꦱꦼꦤꦼꦁꦱꦠꦺ = ___"
        meaning:
          ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: أنا بحب الساتيه)"
          ar: "اكتب القراءة بالحروف اللاتينية. (معناها: أحبّ الساتيه)"
          en: Type the reading in Latin letters. (It means "I like satay.")
        answers: [aku seneng sate, Aku seneng sate, "Aku seneng sate.", akusenengsate, Akusenengsate]
        explain:
          ar_eg: الـ ng اللي في آخر seneng مكتوبة cecak فوق ꦤ، وte في sate بـ taling قبل الحرف.
          ar: ng في آخر seneng مكتوبة cecak فوق ꦤ، وte في sate بـ taling قبل الحرف.
          en: The final ng of seneng is a cecak over ꦤ, and the te of sate has taling written before the letter.
        words: [cecak, taling]
      - id: t10
        unit: j6.u03
        type: multiple_choice
        question: "ꦥꦱꦂꦒꦼꦝꦺ"
        question_meaning:
          ar_eg: اقرا اليافطة.
          ar: اقرأ اللافتة.
          en: Read the sign.
        options: [pasang gedhe, pasa gedhe, pasar gedhe]
        answer: 2
        explain:
          ar_eg: العلامة اللي فوق ꦱ هي layar = r في آخر المقطع. وبعد layar مفيش pasangan.
          ar: العلامة فوق ꦱ هي layar = r في آخر المقطع، ولا pasangan بعد layar.
          en: The mark above ꦱ is layar = a closing r. No pasangan follows a layar.
        words: [layar]
      - id: t11
        unit: j6.u04
        type: multiple_choice
        question: "ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀"
        question_meaning:
          ar_eg: اقرا الجملة.
          ar: اقرأ الجملة.
          en: Read the sentence.
        options: ["Kowe wis mangan?", "Kowe wis turu?", "Kowe durung mangan?"]
        answer: 0
        words: [taling tarung, pasangan]
      - id: t12
        unit: j6.u04
        type: multiple_choice
        question: "ꦧꦥꦏ꧀ꦩꦔꦤ꧀ꦱꦼꦒ꧉"
        question_meaning:
          ar_eg: اقرا الجملة.
          ar: اقرأ الجملة.
          en: Read the sentence.
        options: ["Bapaka mangana sega.", "Bapak mangan sega.", "Bapak durung mangan."]
        answer: 1
        explain:
          ar_eg: الـ k بتاعة bapak والـ n بتاعة mangan من غير حركة وبعدهم حرف ساكن، فالحرف اللي بعدهم مكتوب pasangan. و꧉ في الآخر = نقطة (pada lungsi).
          ar: k في bapak وn في mangan بلا حركة ويليهما حرف ساكن، فيُكتب الحرف التالي pasangan، و꧉ في الآخر نقطة (pada lungsi).
          en: The k of bapak and the n of mangan have no vowel and a consonant follows, so the next letter is a pasangan; ꧉ at the end is a full stop (pada lungsi).
        words: [pasangan, pada lungsi]
      - id: t13
        unit: j6.u05
        type: fill_blank
        sentence: "ꦗ꦳ꦏꦠ꧀ = ___"
        meaning:
          ar_eg: "اكتب القراية بالحروف اللاتينية. (كلمة عربية: زكاة)"
          ar: "اكتب القراءة بالحروف اللاتينية. (كلمة عربية: زكاة)"
          en: Type the reading in Latin letters. (An Arabic word, زكاة.)
        answers: [zakat, Zakat]
        explain:
          ar_eg: ꦗ + تلات نقط (cecak telu) = za، زي ز. ده من الـ aksara rekan.
          ar: ꦗ + ثلاث نقاط (cecak telu) = za، أي ز؛ وهو من الـ aksara rekan.
          en: ꦗ + three dots (cecak telu) = za, Arabic ز. That's an aksara rekan.
        words: [aksara rekan]
      - id: t14
        unit: j6.u05
        type: multiple_choice
        question: "꧇꧔꧐꧙꧇"
        question_meaning:
          ar_eg: الرقم ده على يافطة سلالم Imogiri. كام؟
          ar: هذا الرقم على لافتة درجات Imogiri. كم هو؟
          en: This number is on the sign by the Imogiri steps. What is it?
        options: ["409", "490", "49"]
        answer: 0
        words: [angka, pada pangkat]
      - id: t15
        unit: j6.u06
        type: multiple_choice
        question: "ڤاسار"
        question_meaning:
          ar_eg: اقرا الكلمة دي بالبيجون.
          ar: اقرأ هذه الكلمة المكتوبة بالبيجون.
          en: Read this Pegon word.
        options: [fasar, pasar, basar]
        answer: 1
        explain:
          ar_eg: "ڤ في البيجون = p، مش f ولا v. والحركات بتتكتب حروف: ا = a."
          ar: "ڤ في البيجون = p، لا f ولا v، والحركات تُكتب حروفًا: ا = a."
          en: "In Pegon ڤ = p, not f or v. And vowels are written as letters: ا = a."
        words: [pegon]
      - id: t16
        unit: j6.u06
        type: fill_blank
        sentence: "چارا جاوا = ___"
        meaning:
          ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: الطريقة الجاوي)"
          ar: "اكتب القراءة بالحروف اللاتينية. (معناها: الطريقة الجاوية)"
          en: Type the reading in Latin letters. (It means "the Javanese way".)
        answers: [cara Jawa, cara jawa, Cara Jawa, carajawa, Cara jawa]
        explain:
          ar_eg: چ = c (زي ch)، وج = j، وكل a مكتوبة ا.
          ar: چ = c (كـ ch)، وج = j، وكل a مكتوبة ا.
          en: چ = c (ch), ج = j, and every a is written ا.
        words: [pegon]
      - id: t17
        unit: j6.u06
        type: multiple_choice
        question: Utawi sakabehe puji iku kagungane Allah.
        question_meaning:
          ar_eg: في المعنى المعلّق (makna gandul) تحت «الحمد لله»، أنهي كلمة بتعلّم على المبتدأ؟
          ar: في المعنى المعلَّق (makna gandul) تحت «الحمد لله»، أيّ كلمة تدلّ على المبتدأ؟
          en: In the makna gandul gloss under «الحمد لله», which word marks the mubtada?
        options: [iku, utawi, kagungane]
        answer: 1
        explain:
          ar_eg: utawi علامة المبتدأ (مختصرها م)، وiku علامة الخبر (مختصرها خ).
          ar: utawi علامة المبتدأ (رمزها م)، وiku علامة الخبر (رمزها خ).
          en: utawi marks the mubtada (abbreviated م), and iku marks the khabar (abbreviated خ).
        words: [makna gandul, utawi]
      - id: t18
        unit: j6.u01
        type: multiple_choice
        question: Hana caraka, data sawala, padha jayanya, maga bathanga.
        question_meaning:
          ar_eg: آخر سطر في قصيدة الحروف «maga bathanga» بيحكي إيه؟
          ar: ماذا يحكي السطر الأخير «maga bathanga» من قصيدة الحروف؟
          en: What does the poem's last line, "maga bathanga", tell?
        options: ["Ada dua utusan.", "Mereka bertengkar.", "Keduanya mati."]
        answer: 2
        explain:
          ar_eg: خدّامين Aji Saka الاتنين كانوا مخلصين، فاتخانقوا لحد ما ماتوا هما الاتنين، فعمل الحروف دي على ذكراهم.
          ar: كان خادما Aji Saka مخلصَين، فتقاتلا حتى هلكا معًا، فوضع هذه الحروف تخليدًا لذكراهما.
          en: Aji Saka's two loyal servants fought until both died, and he made the letters in their memory.
        words: [hanacaraka]
  - id: vocabulary
    skill: vocabulary
    title:
      ar_eg: أسامي العلامات والحروف
      ar: أسماء العلامات والحروف
      en: Names of the marks and letters
    items:
      - id: t19
        unit: j6.u02
        type: match_pairs
        pairs:
          - text: wulu
            ar_eg: علامة i (دايرة فوق الحرف)
            ar: علامة i (دائرة فوق الحرف)
            en: the i mark (a circle above the letter)
          - text: suku
            ar_eg: علامة u (خطّاف تحت الحرف)
            ar: علامة u (خطّاف تحت الحرف)
            en: the u mark (a hook below the letter)
          - text: taling
            ar_eg: علامة é / è (قبل الحرف)
            ar: علامة é / è (قبل الحرف)
            en: the é / è mark (before the letter)
          - text: pepet
            ar_eg: علامة ê الخفيفة (فوق الحرف)
            ar: علامة ê الخفيفة (فوق الحرف)
            en: the light ê mark (above the letter)
          - text: taling tarung
            ar_eg: علامة o (قبل الحرف وبعده)
            ar: علامة o (قبل الحرف وبعده)
            en: the o mark (before and after the letter)
        words: [wulu, suku, taling, pepet, taling tarung]
      - id: t20
        unit: j6.u03
        type: match_pairs
        pairs:
          - text: cecak
            ar_eg: ng في آخر المقطع
            ar: ng في آخر المقطع
            en: closing ng
          - text: layar
            ar_eg: r في آخر المقطع
            ar: r في آخر المقطع
            en: closing r
          - text: wignyan
            ar_eg: h في آخر المقطع
            ar: h في آخر المقطع
            en: closing h
          - text: pangkon
            ar_eg: بتشيل الـ a من الحرف (زي السكون)
            ar: تحذف a من الحرف (كالسكون)
            en: removes a letter's a (like sukun)
        words: [cecak, layar, wignyan, pangkon]
      - id: t21
        unit: j6.u05
        type: match_pairs
        pairs:
          - text: pasangan
            ar_eg: الشكل التاني للحرف تحت حرف من غير حركة
            ar: الشكل الثاني للحرف تحت حرف بلا حركة
            en: a letter's second form under a vowel-less letter
          - text: cakra
            ar_eg: r جوّه المقطع (kra، pra)
            ar: r داخل المقطع (kra، pra)
            en: an r inside the syllable (kra, pra)
          - text: aksara murda
            ar_eg: حروف التبجيل للأسامي والألقاب
            ar: حروف التبجيل للأسماء والألقاب
            en: honorific capitals for names and titles
          - text: aksara rekan
            ar_eg: حرف + تلات نقط لصوت عربي (خ ذ ف ز غ)
            ar: حرف + ثلاث نقاط لصوت عربي (خ ذ ف ز غ)
            en: letter + three dots for an Arabic sound (kh, dz, f, z, gh)
          - text: pada pangkat
            ar_eg: العلامة اللي حوالين الرقم
            ar: العلامة المحيطة بالرقم
            en: the mark around a number
        words: [pasangan, cakra, aksara murda, aksara rekan, pada pangkat]
      - id: t22
        unit: j6.u06
        type: multiple_choice
        question_meaning:
          ar_eg: أنهي حرف بيجون معناه ng (زي ngaji)؟
          ar: أيّ حرف في البيجون يدلّ على ng (كما في ngaji)؟
          en: Which Pegon letter is ng (as in ngaji)?
        options: ["ڠ", "غ", "ع"]
        answer: 0
        explain:
          ar_eg: ڠ = ع بتلات نقط. غ صوتها gh، وع عين.
          ar: ڠ = ع بثلاث نقاط، أما غ فصوتها gh، وع عين.
          en: ڠ is ع with three dots. غ is gh, and ع is ʿayn.
        words: [pegon]
