schema: kabar.test/v1
id: j6.test
language: jv
kind: level
title:
  ar_eg: اختبار مستوى J6 — كوتاغيدي (الحروف الجاوية والبيجون)
  ar: اختبار مستوى J6 — كوتاغيدي (الحروف الجاوية والبيجون)
  en: J6 level test — Kotagede (aksara Jawa and Pegon)
intro:
  ar_eg: |
    آخر محطة في الرحلة! هنا هتقرا الحروف الجاوية (aksara Jawa): العشرين حرف، والحركات (sandhangan)، والسواكن اللي في الآخر، والـ pasangan، والحروف الكبيرة (murda) وحروف الأصوات العربي (rekan) والأرقام — وكمان البيجون، الجاوي بالحرف العربي.
    كل الأسئلة بتتجاوب من الكيبورد العادي: يا تختار، يا تكتب القراية بالحروف اللاتيني. خد وقتك وفكّك الكلمة حرف حرف زي ما اتعلمت. في القراية اللاتيني، e عادية من غير علامات مقبولة (kene = kéné).
    ولو جاي من "Take a flight" عشان تعدّي J6، أهلًا بيك — نفس الأسئلة.
  ar: |
    المحطة الأخيرة في الرحلة! ستقرأ هنا الحروف الجاوية (aksara Jawa): الحروف العشرين، والحركات (sandhangan)، والسواكن الأخيرة، والـ pasangan، والحروف التبجيلية (murda) وحروف الأصوات العربية (rekan) والأرقام، ثم البيجون: الجاوية بالحرف العربي.
    تُجاب الأسئلة كلها من لوحة مفاتيح عادية: إمّا أن تختار، وإمّا أن تكتب القراءة بالحروف اللاتينية. خذ وقتك وفكّك الكلمة حرفًا حرفًا كما تعلّمت. وفي القراءة اللاتينية تُقبل e العادية بلا علامات (kene = kéné).
    وإن جئت من "Take a flight" لتتجاوز J6، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    The last stop of the journey! Here you'll read aksara Jawa: the twenty letters, the vowel marks (sandhangan), the closing consonants, pasangan, the honorific capitals (murda), the letters for Arabic sounds (rekan) and the numerals, and then Pegon, Javanese in Arabic letters.
    Every item can be answered from a normal keyboard: either pick an option or type the reading in Latin letters. Take your time and take each word apart letter by letter, as you learned. In Latin readings a plain e without accents is accepted (kene = kéné).
    If you came through "Take a flight" to skip J6, welcome: these are the same questions.
minutes: 40
pass_mark: 0.7
scoring: Score = points earned / points available (closed items 1 point unless set; Latin readings and translate items are graded against reference answers first, with or without spaces between words and with or without accents, then AI grade_answer; writing_task and speaking_task are graded by AI against their rubric, each criterion an equal share of the item's points). Pass at >= 0.7 (the curriculum's J6 mark). Passing marks J6 and the whole Javanese journey complete; the same rule applies when the test is taken as the "Take a flight" skip-ahead over J6. Below the mark, show the per-skill results and suggest the units behind the missed items, with no penalty and an open retry. Javanese items, including every aksara Jawa and Pegon string, stay unverified until the learner approves them.
sections:
  - id: listening
    skill: listening
    title:
      ar_eg: الاستماع
      ar: الاستماع
      en: Listening
    instructions:
      ar_eg: اسمع الكلمة، وعيد براحتك، واختار هي بتتكتب إزاي.
      ar: استمع إلى الكلمة وأعِد كما تشاء، ثم اختر كيف تُكتب.
      en: Listen to the word, replay as you like, then pick how it is written.
    items:
      - id: t01
        unit: j6.u04
        type: listen
        text: kanca
        question:
          ar_eg: سمعت كلمة معناها «صاحب». بتتكتب إزاي؟
          ar: سمعت كلمة معناها «صديق». كيف تُكتب؟
          en: You heard the word for "friend". How is it written?
        options: ["ꦏꦤꦕ", "ꦏꦚ꧀ꦕ", "ꦏꦕ"]
        answer: 1
        meaning:
          ar_eg: صاحب
          ar: صديق
          en: friend
