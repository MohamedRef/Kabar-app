          ar_eg: سمعت كلمة «سلطان». أنهي واحدة مكتوبة صح؟
          ar: سمعت كلمة «سلطان». أيّها مكتوبة صحيحًا؟
          en: You heard the word "Sultan". Which one is spelled right?
        options: ["ꦯꦸꦠꦤ꧀", "ꦯꦸꦭꦠꦤ꧀", "ꦯꦸꦭ꧀ꦠꦤ꧀"]
        answer: 2
        meaning:
          ar_eg: سلطان (بـ sa murda، للتبجيل)
          ar: سلطان (بـ sa murda للتبجيل)
          en: Sultan (with sa murda, for honour)
        words: [aksara murda, pasangan]
      - id: t05
        unit: j6.u05
        type: listen
        text: taun rong ewu rong puluh enem
        question:
          ar_eg: أنهي سنة سمعتها؟
          ar: أيّ سنة سمعت؟
          en: Which year did you hear?
        options: ["꧇꧒꧐꧒꧖꧇", "꧇꧒꧐꧖꧒꧇", "꧇꧒꧒꧐꧖꧇"]
        answer: 0
        meaning:
          ar_eg: سنة ٢٠٢٦
          ar: سنة ٢٠٢٦
          en: the year 2026
        words: [angka, pada pangkat]
      - id: t06
