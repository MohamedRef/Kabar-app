        unit: j6.u02
        type: multiple_choice
        question_meaning:
          ar_eg: إزاي تكتب sore (العصر)؟
          ar: كيف تكتب sore (العصر)؟
          en: How do you write sore (afternoon)?
        options: ["ꦱꦫꦺ", "ꦱꦺꦴꦫ", "ꦱꦺꦴꦫꦺ"]
        answer: 2
        explain:
          ar_eg: so = taling tarung (قبل الحرف وبعده)، وre = taling بس (قبل الحرف).
          ar: so = taling tarung (قبل الحرف وبعده)، وre = taling وحدها (قبل الحرف).
          en: so = taling tarung (before and after the letter), re = taling alone (before the letter).
        words: [taling tarung, taling]
      - id: t24
        unit: j6.u01
        type: multiple_choice
        question_meaning:
          ar_eg: أنهي واحدة lara (عيان)، اللي بتتنطق «loro»؟
          ar: أيّها lara (مريض)، التي تُنطق «loro»؟
          en: Which one is lara (sick), the word said "loro"?
        options: ["ꦭꦫ", "ꦭꦺꦴꦫꦺꦴ", "ꦭꦺꦴꦫ"]
        answer: 0
        explain:
          ar_eg: lara من غير أي علامة (زي الإملاء اللاتيني)، مع إنها بتتنطق loro. loro (اتنين) هي اللي ليها taling tarung.
          ar: تُكتب lara بلا علامات (كالتهجئة اللاتينية) وإن نُطقت loro، أما loro (اثنان) فلها taling tarung.
          en: lara has no marks (like its Latin spelling) even though it's said loro. loro (two) is the one with taling tarung.
        words: [lara, loro]
      - id: t25
        unit: j6.u02
        type: multiple_choice
        question_meaning:
          ar_eg: إزاي تكتب rega (السعر)؟
          ar: كيف تكتب rega (السعر)؟
          en: How do you write rega (price)?
        options: ["ꦫꦼꦒ", "ꦉꦒ", "ꦫꦺꦒ"]
        answer: 1
        explain:
          ar_eg: rê ليها حرف لوحدها (pa cerek ꦉ)، مش ꦫ + pepet.
          ar: لـ rê حرف خاص (pa cerek ꦉ)، لا ꦫ + pepet.
          en: rê has its own letter (pa cerek ꦉ), not ꦫ + pepet.
        words: [pa cerek]
      - id: t26
        unit: j6.u03
        type: multiple_choice
        question: "ꦧꦥꦏ"
        question_meaning:
          ar_eg: من غير pangkon في الآخر، دي بتتقري إزاي؟
          ar: بلا pangkon في آخرها، كيف تُقرأ؟
          en: Without a pangkon at the end, how does this read?
        options: [bapak, bapa, bapaka]
        answer: 2
        explain:
          ar_eg: "كل حرف فيه a لوحده؛ الـ pangkon (زي السكون) هي اللي بتشيلها: ꦧꦥꦏ꧀ = bapak."
          ar: "كل حرف يحمل a في ذاته، والـ pangkon (كالسكون) هي التي تحذفها: ꦧꦥꦏ꧀ = bapak."
          en: "Every letter carries its own a; pangkon (like sukun) removes it: ꦧꦥꦏ꧀ = bapak."
        words: [pangkon]
      - id: t27
        unit: j6.u04
        type: multiple_choice
        question_meaning:
          ar_eg: في نص الجملة، حرف ساكن من غير حركة وبعده على طول حرف ساكن تاني. بيتكتب إزاي؟
          ar: في وسط الجملة، حرف ساكن بلا حركة يليه مباشرة حرف ساكن آخر. كيف يُكتب؟
          en: In the middle of a sentence, a vowel-less consonant is followed straight away by another consonant. How is it written?
        options:
          - Dengan pangkon.
          - Huruf berikutnya ditulis sebagai pasangan.
          - Dengan wignyan.
        answer: 1
        explain:
          ar_eg: الـ pangkon بس عند الوقفة (قبل ꧈ أو ꧉ أو في آخر السطر). في النص، الحرف اللي بعده بيتكتب pasangan.
          ar: الـ pangkon عند الوقف فقط (قبل ꧈ أو ꧉ أو في آخر السطر)، وفي الوسط يُكتب الحرف التالي pasangan.
          en: Pangkon is only for a pause (before ꧈, ꧉ or at a line end). Mid-sentence, the next letter is written as a pasangan.
        words: [pasangan, pangkon]
      - id: t28
        unit: j6.u05
        type: multiple_choice
        question_meaning:
          ar_eg: أنهي كلمة ممكن تتكتب بحرف murda؟
          ar: أيّ كلمة يجوز أن تُكتب بحرف murda؟
          en: Which word may be written with a murda letter?
        options: [sega, pasar, Sultan]
        answer: 2
        explain:
          ar_eg: "الـ murda للتبجيل: أسامي وألقاب ناس محترمين وأماكن مقدّسة أو ملكية، مش بداية كل جملة."
          ar: "الـ murda للتبجيل: أسماء المعظَّمين وألقابهم والأماكن المقدّسة أو الملكية، لا بداية كل جملة."
          en: "Murda are for honour: names and titles of respected people, sacred or royal places, not every sentence start."
        words: [aksara murda]
      - id: t29
        unit: j6.u05
        type: multiple_choice
        question_meaning:
          ar_eg: kabar (من «خبر») بقت كلمة جاوي خالص. بتتكتب عادةً إزاي؟
          ar: صارت kabar (من «خبر») كلمة جاوية تمامًا. كيف تُكتب عادةً؟
          en: kabar (from «خبر») is now fully Javanese. How is it usually written?
        options: ["ꦏ꦳ꦧꦂ", "ꦏꦧꦂ"]
        answer: 1
        explain:
          ar_eg: الكلمات العربي القديمة اللي بقت جاوي بتتكتب بحروف عادية (kabar، pikir). الـ rekan للكلمات اللي لسه محتفظة بالصوت العربي (dzikir، zakat).
          ar: الدخيل العربي القديم الذي صار جاويًا يُكتب بحروف عادية (kabar، pikir)، والـ rekan للكلمات التي ما زالت تحفظ الصوت العربي (dzikir، zakat).
          en: Old Arabic loans that became fully Javanese use plain letters (kabar, pikir). Rekan is for words that keep the Arabic sound (dzikir, zakat).
        words: [aksara rekan]
      - id: t30
        unit: j6.u06
        type: multiple_choice
        question_meaning:
          ar_eg: أنهي حرف بيجون معناه dh (زي dhadha)؟
          ar: أيّ حرف في البيجون يدلّ على dh (كما في dhadha)؟
          en: Which Pegon letter is dh (as in dhadha)?
        options: ["ذ", "ض", "ڎ"]
        answer: 2
        explain:
          ar_eg: ڎ = د بتلات نقط. الـ dh الجاوي «تقيلة» زي الدال، مش ذ ولا ض.
          ar: ڎ = د بثلاث نقاط؛ فالـ dh الجاوية «ثقيلة» كالدال، لا ذ ولا ض.
          en: ڎ is د with three dots. Javanese dh is a "heavy" d, not ذ or ض.
        words: [pegon]
      - id: t31
        unit: j6.u06
        type: multiple_choice
        question_meaning:
          ar_eg: إزاي تكتب iki (ده) بالبيجون؟
          ar: كيف تكتب iki (هذا) بالبيجون؟
          en: How do you write iki (this) in Pegon?
        options: ["ايكي", "اكي", "ايكو"]
        answer: 0
        explain:
          ar_eg: "في البيجون الحركات حروف: الكلمة بتبدأ بألف، وi = ي. ايكو دي iku."
          ar: "الحركات في البيجون حروف: تبدأ الكلمة بألف، وi = ي، أما ايكو فهي iku."
          en: "In Pegon vowels are letters: the word starts with alif, and i = ي. ايكو is iku."
        words: [pegon]
      - id: t32
        unit: j6.u02
        type: build_sentence
        source:
          ar_eg: ابني «sapa teka» (مين جاي؟) مقطع مقطع.
          ar: ركّب «sapa teka» (من القادم؟) مقطعًا مقطعًا.
          en: Build "sapa teka" (who's coming?), syllable by syllable.
        answer: "ꦱ ꦥ ꦠꦼ ꦏ"
        distractors: ["ꦠꦺ", "ꦏꦶ"]
        words: [pepet, taling]
  - id: writing
    skill: writing
    title:
      ar_eg: الكتابة
      ar: الكتابة
      en: Writing
    instructions:
      ar_eg: اكتب القراية بالحروف اللاتينية، واشرح الكتابة بكلامك (بالعربي أو الإنجليزي أو الإندونيسي).
      ar: اكتب القراءة بالحروف اللاتينية، واشرح الكتابة بكلماتك (بالعربية أو الإنجليزية أو الإندونيسية).
      en: Write readings in Latin letters, and explain the spelling in your own words (Arabic, English or Indonesian).
    items:
      - id: t33
        unit: j6.u04
        type: translate
        direction: to_target
        source_meaning:
          ar_eg: "اكتب بالحروف اللاتينية: ꦏꦚ꧀ꦕꦏꦸꦱꦼꦤꦼꦁꦮꦪꦁ꧉"
          ar: "اكتب بالحروف اللاتينية: ꦏꦚ꧀ꦕꦏꦸꦱꦼꦤꦼꦁꦮꦪꦁ꧉"
          en: "Write in Latin letters: ꦏꦚ꧀ꦕꦏꦸꦱꦼꦤꦼꦁꦮꦪꦁ꧉"
        answers:
          - Kancaku seneng wayang.
          - Kancaku seneng wayang
          - kancaku seneng wayang
          - kancaku seneng wayang.
          - kancakusenengwayang
        explain:
          ar_eg: ꦚ꧀ꦕ = n + pasangan ca (نْ قبل c بتتكتب nya)، وcecak مرتين للـ ng.
          ar: ꦚ꧀ꦕ = n + pasangan ca (فالنون قبل c تُكتب nya)، وcecak مرتين لـ ng.
          en: ꦚ꧀ꦕ = n + pasangan ca (an n before c is written nya), and two cecak for ng.
        words: [pasangan, cecak]
      - id: t34
        unit: j6.u06
        type: translate
        direction: to_target
        source_meaning:
          ar_eg: "اكتب بالحروف اللاتينية (بيجون): ساڤا ماچا كتاب"
          ar: "اكتب بالحروف اللاتينية (بيجون): ساڤا ماچا كتاب"
          en: "Write in Latin letters (Pegon): ساڤا ماچا كتاب"
        answers:
          - Sapa maca kitab?
          - Sapa maca kitab
          - sapa maca kitab
          - sapa maca kitab?
          - sapamacakitab
        explain:
          ar_eg: ڤ = p وچ = c. وkitab محتفظة بإملائها العربي كتاب.
          ar: ڤ = p، وچ = c، وتحتفظ kitab بإملائها العربي كتاب.
          en: ڤ = p and چ = c. kitab keeps its Arabic spelling كتاب.
        words: [pegon, kitab]
      - id: t35
        unit: j6.u04
        type: writing_task
        points: 4
        prompt:
          ar_eg: |
            Dimas بعتلك: "Med, piye carane nulis «Kowe wis mangan?» nganggo aksara Jawa?" اشرحله خطوة خطوة إزاي تكتب الجملة دي بالحروف الجاوية: كل مقطع بأنهي حرف وأنهي علامة، وإيه اللي بيحصل للـ s في wis، وإزاي تقفل آخر الجملة. اكتب الشرح بالعربي أو الإنجليزي أو الإندونيسي، والأسامي (taling، wulu…) بالحروف اللاتيني.
          ar: |
            كتب لك Dimas: "Med, piye carane nulis «Kowe wis mangan?» nganggo aksara Jawa?" اشرح له خطوة خطوة كيف تُكتب هذه الجملة بالحروف الجاوية: بأيّ حرف وأيّ علامة يُكتب كل مقطع، وماذا يحدث لـ s في wis، وكيف تُختم الجملة. اكتب الشرح بالعربية أو الإنجليزية أو الإندونيسية، وأسماء العلامات (taling، wulu…) بالحروف اللاتينية.
          en: |
            Dimas writes: "Med, piye carane nulis «Kowe wis mangan?» nganggo aksara Jawa?" Explain step by step how to write this sentence in aksara Jawa: which letter and which mark for each syllable, what happens to the s of wis, and how to close the sentence. Write in Arabic, English or Indonesian, with the names of the marks (taling, wulu …) in Latin letters.
        rubric:
          - Gets the vowels right (ko with taling tarung on ꦏ, we with taling on ꦮ, wi with wulu on ꦮ, and ma / nga with no mark).
          - Explains that the s of wis has no vowel and is followed straight away by m, so the m is written as a pasangan (not pangkon, not a space).
          - Closes mangan correctly (n with pangkon at the end, optionally followed by pada lungsi ꧉) and notes there is no question mark in aksara Jawa.
          - Clear, ordered explanation that names the letters and marks correctly (small slips are fine).
        sample: |
          ko = ꦏ + taling tarung (ꦏꦺꦴ). we = ꦮ + taling (ꦮꦺ). wi = ꦮ + wulu (ꦮꦶ).
          The s of wis has no vowel and m comes straight after it, so I write ꦱ and put ma as a pasangan under it (ꦱ꧀ꦩ).
          Then nga (ꦔ), and the final n is ꦤ with pangkon (ꦤ꧀), because the sentence ends there; I can add pada lungsi ꧉.
          Aksara Jawa has no question mark: ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀
        words: [taling tarung, wulu, pasangan, pangkon]
  - id: speaking
    skill: speaking
    title:
      ar_eg: الكلام
      ar: المحادثة
      en: Speaking
    instructions:
      ar_eg: اقرا بصوت عالي واتكلم براحتك وبالراحة.
      ar: اقرأ بصوت مسموع وتكلّم بهدوء وارتياح.
      en: Read aloud and speak calmly and at ease.
    items:
      - id: t36
        unit: j6.u01
        type: speaking
        text: Hana caraka, data sawala, padha jayanya, maga bathanga.
        meaning:
          ar_eg: كان فيه رسولين، اتخانقوا، كانوا قد بعض في القوة، والاتنين ماتوا.
          ar: كان هناك رسولان، فتنازعا، وتكافآ قوة، فهلكا معًا.
          en: There were two messengers; they quarrelled; they were equally strong; and both died.
        words: [hanacaraka]
      - id: t37
        unit: j6.u06
        type: speaking_task
        points: 4
        prompt:
          ar_eg: 'إنت وDimas ماشيين في Kotagede. اتكلم حوالي دقيقة بالنغوكو: (١) اقرا بصوت عالي التلات حاجات دول اللي شايفهم: اليافطة ꦥꦱꦂꦊꦒꦶ، والرقم ꧇꧔꧐꧙꧇ على سلالم Imogiri، وكلمة البيجون ڠاجي، (٢) احكي لـ Dimas باختصار حكاية Aji Saka اللي ورا ترتيب الحروف.'
          ar: 'تتجوّل مع Dimas في Kotagede. تحدّث نحو دقيقة بالنغوكو: (١) اقرأ بصوت مسموع هذه الأشياء الثلاثة التي تراها: اللافتة ꦥꦱꦂꦊꦒꦶ، والرقم ꧇꧔꧐꧙꧇ على درجات Imogiri، وكلمة البيجون ڠاجي، (٢) واحكِ لـ Dimas باختصار حكاية Aji Saka وراء ترتيب الحروف.'
          en: 'You and Dimas are walking around Kotagede. Talk for about a minute in ngoko: (1) read aloud the three things you see: the sign ꦥꦱꦂꦊꦒꦶ, the number ꧇꧔꧐꧙꧇ on the Imogiri steps, and the Pegon word ڠاجي; (2) tell Dimas briefly the story of Aji Saka behind the letter order.'
        rubric:
          - Reads the three items correctly (Pasar Legi, patang atus sanga / four hundred and nine, ngaji).
          - Tells the Aji Saka story in the right order (two loyal servants, the keris, the fight, both died, the letters made in their memory) and links it to the four lines of the poem.
          - Speaks ngoko with a friend, with simple connectors (terus, banjur, pungkasane).
          - Clear pronunciation, including heavy dh / th in padha and bathanga; small slips are fine.
        sample: |
          Iki tulisane Pasar Legi. Iki angka patang atus sanga. Lan iki Pegon, ngaji.
          Mas, crita Aji Saka ngene: Aji Saka duwe abdi loro. Sembada njaga keris, Dora dikon njupuk keris iku.
          Abdi loro padha setya, terus padha perang nganti mati kabeh. Pungkasane Aji Saka nggawe aksara iki: hana caraka, data sawala, padha jayanya, maga bathanga.
        words: [hanacaraka, angka, pegon]
