schema: kabar.test/v1
id: placement
language: id
kind: placement
title:
  ar_eg: نبدأ منين؟ — اختبار تحديد المستوى
  ar: من أين نبدأ؟ — اختبار تحديد المستوى
  en: Where do we start? — placement test
intro:
  ar_eg: |
    حوالي ١٠ دقايق بس عشان نعرف نبدأ رحلتك منين. الأسئلة بتبدأ سهلة أوي وبتصعب شوية شوية.
    لو حاجة مش عارفها، عادي خالص — ده معناه إننا لقينا نقطة البداية الصح. وتقدر دايمًا تعدّي لقدّام بـ "Take a flight".
  ar: |
    نحو عشر دقائق فقط لنعرف من أين تبدأ رحلتك. تبدأ الأسئلة سهلة جدًّا ثم تصعب تدريجيًّا.
    إن لم تعرف شيئًا فلا بأس أبدًا؛ هذا يعني أننا وجدنا نقطة البداية الصحيحة. ويمكنك دائمًا التقدّم عبر "Take a flight".
  en: |
    About 10 minutes, just to find where your journey should start. Questions begin very easy and get harder bit by bit.
    If you don't know something, that's completely fine: it means we've found the right starting point. You can always skip ahead later with "Take a flight".
minutes: 10
scoring: >-
  Sections run in order bipa1, bipa2, bipa3, bipa4 (easiest first). Score each
  section as points earned / points available. Stop at the first section that
  scores below 0.7 and start the learner at that section's level (its first
  unit); later sections are not shown. If all four sections score >= 0.7, start
  at BIPA 5. Item `skill` tags feed the first skill-radar reading. The learner may
  always choose a lower start or skip ahead with "Take a flight".
