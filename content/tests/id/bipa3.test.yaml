      - id: t04
        type: listen
        text: Kalau terjadi gempa, jangan panik, dan segera keluar dari gedung.
        options:
          - Kalau terjadi gempa, jangan panik, dan tetap di dalam gedung.
          - Kalau terjadi banjir, jangan panik, dan segera keluar dari gedung.
          - Kalau terjadi gempa, jangan panik, dan segera keluar dari gedung.
        answer: 2
        words: [kalau, gempa, segera]
      - id: t05
        type: listen
        text: Mohon maaf lahir dan batin, ya. Semoga kita semua sehat dan diberi berkah.
        options:
          - Mohon maaf lahir dan batin, ya. Semoga kita semua sukses dan diberi berkah.
          - Mohon maaf lahir dan batin, ya. Semoga kita semua sehat dan diberi berkah.
          - Selamat Idulfitri, ya. Semoga kita semua sehat dan diberi berkah.
        answer: 1
