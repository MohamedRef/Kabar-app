      - id: t37
        type: writing_task
        points: 5
        prompt:
          ar_eg: "اكتب رسالة شكوى مؤدبة (١٢٠–١٨٠ كلمة) لمدير فندق في Kuta Mandalika. قول إنت مين وكنت قاعد إمتى، اشرح مشكلتين بالتفصيل وإيه اللي عملته، واطلب حل واضح، واقفل الرسالة بأدب."
          ar: "اكتب رسالة شكوى مهذبة (١٢٠–١٨٠ كلمة) إلى مدير فندق في Kuta Mandalika: عرّف بنفسك ومدة إقامتك، واشرح مشكلتين بالتفصيل وما فعلته حيالهما، واطلب حلًّا واضحًا، واختم الرسالة بأدب."
          en: Write a polite complaint letter (120–180 words) to the manager of a hotel in Kuta Mandalika. Say who you are and when you stayed, explain two problems in detail and what you already did, ask for a clear solution, and close politely.
        rubric:
          - "Uses the formal letter frame: Kepada Yth. …, Dengan hormat, an opening (mohon maaf sebelumnya), Atas perhatian …, terima kasih, Hormat saya."
          - States two specific problems with when and how they happened, and what was already tried.
          - Makes a clear, polite request (mohon agar …, saya berharap …) without rudeness or threats.
          - Uses BIPA 3 grammar accurately (passive di- and pronoun passive, se-, sehingga / supaya, transitive verbs with objects); 120–180 words.
        sample: |
          Kepada Yth. Manajer Hotel Pantai Kuta
          di Kuta Mandalika

          Dengan hormat,
          Saya Mohamed, tamu di kamar 108 dari tanggal 3 sampai 6 Juni. Mohon maaf sebelumnya, saya ingin menyampaikan dua keluhan.
          Pertama, air panas di kamar mandi tidak menyala selama dua hari sehingga saya harus mandi dengan air dingin. Saya sudah melaporkannya ke resepsionis pada hari pertama, tetapi masalah itu belum diperbaiki.
          Kedua, kamar saya tidak sebersih foto di situs web hotel. Seprainya tidak diganti dan sampah di kamar tidak dibuang selama dua hari.
          Saya memesan kamar ini karena ulasan hotel ini sangat baik. Oleh sebab itu, saya mohon agar pihak hotel memberikan potongan harga untuk dua malam tersebut. Saya juga berharap masalah ini tidak terjadi lagi kepada tamu lain.
          Atas perhatian Bapak/Ibu, saya ucapkan terima kasih.

          Hormat saya,
          Mohamed
        words: [dengan hormat, keluhan, mohon]
  - id: speaking
    skill: speaking
    title:
      ar_eg: الكلام
      ar: المحادثة
      en: Speaking
    instructions:
      ar_eg: اتكلم براحتك. المهم إن اللي بيسمعك يفهم رأيك وأسبابك، مش إنك تكون مثالي.
      ar: تكلّم بارتياح. المهم أن يفهم السامع رأيك وأسبابه، لا أن تكون مثاليًّا.
      en: Speak at ease. What matters is that a listener follows your view and your reasons, not perfection.
    items:
      - id: t38
        type: speaking
        text: Menurut saya, larangan kantong plastik sangat penting, karena laut kita penuh sampah.
        meaning:
          ar_eg: في رأيي، منع الأكياس البلاستيك مهم جدًا، عشان بحرنا مليان زبالة.
          ar: في رأيي، حظر الأكياس البلاستيكية مهم جدًا، لأن بحرنا مليء بالنفايات.
          en: In my opinion, the plastic-bag ban is very important, because our sea is full of rubbish.
        words: [menurut saya, larangan, karena]
      - id: t39
        type: speaking_task
        points: 5
        prompt:
          ar_eg: "Ni Luh بتسألك: 'المفروض لومبوك تمنع الأكياس البلاستيك زي جزر Gili؟' اتكلم حوالي ٢–٣ دقايق: قول رأيك بسببين على الأقل، رد على رأي مخالف بأدب، وبعدين قول إنت شخصيًا ناوي تعمل إيه عشان البحر يفضل نضيف."
          ar: "تسألك Ni Luh: 'هل ينبغي أن تحظر لومبوك الأكياس البلاستيكية كما فعلت جزر Gili؟' تحدّث نحو دقيقتين أو ثلاث: اذكر رأيك مع سببين على الأقل، وردّ بأدب على رأي مخالف، ثم قل ما تنوي فعله أنت شخصيًّا ليبقى البحر نظيفًا."
          en: "Ni Luh asks: 'Should Lombok ban plastic bags like the Gili islands do?' Talk for about 2–3 minutes: give your opinion with at least two reasons, answer an opposing view politely, then say what you yourself plan to do to keep the sea clean."
        rubric:
          - States a clear opinion (menurut saya, saya setuju / kurang setuju) supported by at least two reasons.
          - Acknowledges and answers an opposing view politely (memang …, tetapi …; saya mengerti, namun …).
          - Describes personal plans with akan / nanti / rencananya and links ideas with supaya, sehingga, bukan hanya … tetapi juga.
          - Speaks in connected, mostly accurate sentences a patient listener can follow; pauses are fine.
        sample: |
          Menurut saya, Lombok sebaiknya melarang kantong plastik, seperti di Gili. Pertama, banyak sampah plastik masuk ke laut sehingga penyu dan ikan mati. Kedua, terumbu karang rusak, padahal turis datang ke Lombok untuk melihat laut yang indah.
          Memang ada orang yang berkata bahwa pedagang kecil masih membutuhkan plastik. Saya mengerti, tetapi pedagang bisa memakai tas kain atau daun pisang, seperti dulu.
          Larangan ini bukan hanya baik untuk alam, tetapi juga untuk pariwisata.
          Rencananya, saya akan selalu membawa tas kain dan botol minum sendiri. Bulan depan saya juga akan ikut membersihkan pantai Senggigi bersama teman-teman.
        words: [menurut saya, sebaiknya, rencananya]
