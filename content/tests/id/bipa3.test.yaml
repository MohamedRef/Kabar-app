          ar_eg: kepada قبل الناس (لـ / إلى)؛ tentang = عن؛ oleh = بواسطة.
          ar: kepada تأتي قبل الأشخاص (إلى)، وtentang = عن، وoleh = بواسطة.
          en: kepada goes before people (to); tentang = about; oleh = by.
