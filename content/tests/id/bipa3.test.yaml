  - id: reading
    skill: reading
    title:
      ar_eg: القراية
      ar: القراءة
      en: Reading
    instructions:
      ar_eg: اقرا الحكاية، ورسالة الشكوى، والنص اللي بيشرح، وجاوب من اللي مكتوب فيهم.
      ar: اقرأ الحكاية ورسالة الشكوى والنص التفسيري، وأجب مما ورد فيها.
      en: Read the legend, the complaint letter and the explanatory text, and answer from what they say.
    items:
      - id: t08
        type: multiple_choice
        question: |
          PUTRI MANDALIKA
          Pada zaman dahulu, di pantai selatan Lombok hiduplah seorang putri yang cantik dan baik hati bernama Putri Mandalika. Banyak pangeran ingin menikahinya. Akan tetapi, Putri Mandalika tidak mau memilih salah satu dari mereka karena ia tidak ingin terjadi perang di antara kerajaan-kerajaan itu.
          Akhirnya, ia mengundang semua pangeran ke pantai. Dari atas sebuah batu, ia berkata bahwa ia akan menjadi milik semua orang. Lalu ia melompat ke laut dan menghilang.
          Tidak lama kemudian, muncullah ribuan cacing laut berwarna-warni. Masyarakat percaya bahwa cacing itu, yang disebut nyale, adalah jelmaan sang putri. Sampai sekarang, setiap tahun orang Sasak datang berbondong-bondong ke pantai untuk menangkap nyale.
        question_meaning:
          ar_eg: ليه Putri Mandalika ما اختارتش أمير منهم؟
          ar: لماذا لم تختر Putri Mandalika أحد الأمراء؟
          en: Why didn't Putri Mandalika choose one of the princes?
        options: ["Karena ayahnya melarangnya.", "Karena ia tidak ingin ada perang.", "Karena semua pangeran jahat."]
        answer: 1
        words: [memilih, perang, kerajaan]
      - id: t09
        type: multiple_choice
        question: |
          PUTRI MANDALIKA
          Pada zaman dahulu, di pantai selatan Lombok hiduplah seorang putri yang cantik dan baik hati bernama Putri Mandalika. Banyak pangeran ingin menikahinya. Akan tetapi, Putri Mandalika tidak mau memilih salah satu dari mereka karena ia tidak ingin terjadi perang di antara kerajaan-kerajaan itu.
          Akhirnya, ia mengundang semua pangeran ke pantai. Dari atas sebuah batu, ia berkata bahwa ia akan menjadi milik semua orang. Lalu ia melompat ke laut dan menghilang.
          Tidak lama kemudian, muncullah ribuan cacing laut berwarna-warni. Masyarakat percaya bahwa cacing itu, yang disebut nyale, adalah jelmaan sang putri. Sampai sekarang, setiap tahun orang Sasak datang berbondong-bondong ke pantai untuk menangkap nyale.
        question_meaning:
          ar_eg: إيه اللي ظهر في البحر بعد ما الأميرة اختفت؟
          ar: ماذا ظهر في البحر بعد اختفاء الأميرة؟
          en: What appeared in the sea after the princess disappeared?
        options: ["seekor penyu besar", "sebuah kapal", "ribuan cacing laut"]
        answer: 2
        words: [muncul, cacing laut, nyale]
      - id: t10
        type: multiple_choice
        question: |
          Banyak pangeran ingin menikahinya.
        question_meaning:
          ar_eg: في الجملة دي من الحكاية، الـ -nya في menikahinya راجعة على مين؟
          ar: في هذه الجملة من الحكاية، على من يعود الضمير -nya في menikahinya؟
          en: In this sentence from the legend, who does -nya in menikahinya refer to?
        options: ["Putri Mandalika", "para pangeran", "orang Sasak"]
        answer: 0
        explain:
          ar_eg: الأمراء عايزين يتجوزوها هي، Putri Mandalika؛ -nya هنا مفعول بيه.
          ar: الأمراء يريدون الزواج منها هي، Putri Mandalika؛ فـ -nya هنا ضمير مفعول.
          en: The princes want to marry her, Putri Mandalika; -nya is the object here.
        words: [-nya, menikahi]
      - id: t11
        type: multiple_choice
        question: |
          Kepada Yth. Manajer Hotel Pantai Kuta
          di Kuta Mandalika

          Dengan hormat,
          Saya Mohamed, tamu di kamar 204 dari tanggal 12 sampai 15 Mei. Mohon maaf sebelumnya, saya ingin menyampaikan keluhan.
          Pertama, pendingin ruangan di kamar saya rusak sejak malam pertama sehingga saya tidak bisa tidur. Saya sudah melaporkannya ke resepsionis dua kali, tetapi sampai sekarang belum diperbaiki. Kedua, sarapan yang dijanjikan di situs web hotel tidak disediakan pada hari Minggu.
          Karena itu, saya mohon agar pendingin ruangan segera diperbaiki atau saya dipindahkan ke kamar lain. Saya juga berharap mendapat pengembalian uang untuk sarapan hari Minggu.
          Atas perhatian Bapak/Ibu, saya ucapkan terima kasih.

          Hormat saya,
          Mohamed
        question_meaning:
          ar_eg: إيه المشكلة الأولى اللي محمد بيشتكي منها؟
          ar: ما المشكلة الأولى التي يشكو منها محمد؟
          en: What is the first problem Mohamed complains about?
        options: ["Kamarnya terlalu kecil.", "Pendingin ruangannya rusak.", "Resepsionisnya tidak ramah."]
        answer: 1
        words: [keluhan, pendingin ruangan, rusak]
      - id: t12
        type: multiple_choice
        question: |
          Kepada Yth. Manajer Hotel Pantai Kuta
          di Kuta Mandalika

          Dengan hormat,
          Saya Mohamed, tamu di kamar 204 dari tanggal 12 sampai 15 Mei. Mohon maaf sebelumnya, saya ingin menyampaikan keluhan.
          Pertama, pendingin ruangan di kamar saya rusak sejak malam pertama sehingga saya tidak bisa tidur. Saya sudah melaporkannya ke resepsionis dua kali, tetapi sampai sekarang belum diperbaiki. Kedua, sarapan yang dijanjikan di situs web hotel tidak disediakan pada hari Minggu.
          Karena itu, saya mohon agar pendingin ruangan segera diperbaiki atau saya dipindahkan ke kamar lain. Saya juga berharap mendapat pengembalian uang untuk sarapan hari Minggu.
          Atas perhatian Bapak/Ibu, saya ucapkan terima kasih.

          Hormat saya,
          Mohamed
        question_meaning:
          ar_eg: محمد طالب إيه من الفندق؟
          ar: ماذا يطلب محمد من الفندق؟
          en: What does Mohamed ask the hotel to do?
        options:
          - Memberinya dua malam gratis.
          - Memecat resepsionis.
          - Memperbaiki pendingin ruangan atau memindahkannya ke kamar lain.
        answer: 2
        words: [mohon, diperbaiki, dipindahkan]
      - id: t13
        type: multiple_choice
        question: |
          Mohon maaf sebelumnya, saya ingin menyampaikan keluhan.
        question_meaning:
          ar_eg: محمد كاتب الجملة دي في أول الشكوى ليه؟
          ar: لماذا كتب محمد هذه الجملة في بداية الشكوى؟
          en: Why does Mohamed open his complaint with this sentence?
        options:
          - Untuk membuat keluhannya terdengar sopan dan lembut.
          - Karena ia merusak pendingin ruangan.
          - Karena ia terlambat membayar hotel.
        answer: 0
        explain:
          ar_eg: الشكوى في إندونيسيا بتبدأ بأدب وبطريقة غير مباشرة؛ "mohon maaf sebelumnya" يعني "آسف مقدمًا" عشان تليّن الكلام، مش اعتراف بغلطة.
          ar: تبدأ الشكوى في إندونيسيا بأدب وبصورة غير مباشرة؛ فعبارة "mohon maaf sebelumnya" (أعتذر مسبقًا) تليّن الكلام، وليست اعترافًا بخطأ.
          en: Indonesian complaints open politely and indirectly; "mohon maaf sebelumnya" (sorry in advance) softens the start; it doesn't admit any fault.
        words: [sebelumnya, menyampaikan]
      - id: t14
        type: multiple_choice
        question: |
          GEMPA BUMI
          Gempa bumi merupakan getaran di permukaan bumi yang disebabkan oleh pergerakan lempeng. Indonesia sering mengalami gempa karena terletak di Cincin Api Pasifik.
          Jika terjadi gempa saat Anda berada di dalam rumah, berlindunglah di bawah meja yang kuat supaya kepala Anda terlindung. Jangan berdiri di dekat jendela. Setelah getaran berhenti, segera keluar dan berkumpul di tempat terbuka. Jangan menggunakan lift.
        question_meaning:
          ar_eg: لو الزلزال حصل وإنت في البيت، تستخبى فين؟
          ar: إذا وقع الزلزال وأنت في البيت، أين تحتمي؟
          en: If an earthquake hits while you're at home, where do you shelter?
        options: ["di dekat jendela", "di dalam lift", "di bawah meja yang kuat"]
        answer: 2
        words: [berlindung, meja, getaran]
      - id: t15
        type: multiple_choice
        question: |
          GEMPA BUMI
          Gempa bumi merupakan getaran di permukaan bumi yang disebabkan oleh pergerakan lempeng. Indonesia sering mengalami gempa karena terletak di Cincin Api Pasifik.
          Jika terjadi gempa saat Anda berada di dalam rumah, berlindunglah di bawah meja yang kuat supaya kepala Anda terlindung. Jangan berdiri di dekat jendela. Setelah getaran berhenti, segera keluar dan berkumpul di tempat terbuka. Jangan menggunakan lift.
        question_meaning:
          ar_eg: حسب النص، ليه إندونيسيا بيحصل فيها زلازل كتير؟
          ar: بحسب النص، لماذا تكثر الزلازل في إندونيسيا؟
          en: According to the text, why does Indonesia have so many earthquakes?
        options:
          - karena sering turun hujan deras
          - karena terletak di Cincin Api Pasifik
          - karena banyak gedung tinggi
        answer: 1
        words: [merupakan, disebabkan, terletak]
