schema: kabar.test/v1
id: bipa3.test
language: id
kind: level
title:
  ar_eg: اختبار مستوى BIPA 3 — لومبوك
  ar: اختبار مستوى BIPA 3 — لومبوك
  en: BIPA 3 level test — Lombok
intro:
  ar_eg: |
    لفّيت لومبوك من Mataram لحد Labuhan Lombok! هنا هتسمع نشرة أخبار من الراديو وكلام الناس العادي، وتقرا حكاية Putri Mandalika ورسالة شكوى لفندق ونص بيشرح الزلازل، وتكتب شكوى مؤدبة، وتقول رأيك بأسبابه.
    خد وقتك؛ مفيش حاجة هنا تكسفك، وكل إجابة بتورّينا نركّز على إيه بعد كده.
    ولو جاي من "Take a flight" عشان تعدّي BIPA 3، أهلًا بيك — نفس الأسئلة.
  ar: |
    جُبتَ لومبوك من Mataram إلى Labuhan Lombok! ستستمع هنا إلى نشرة أخبار إذاعية وحوارات يومية، وتقرأ حكاية Putri Mandalika ورسالة شكوى إلى فندق ونصًّا يشرح الزلازل، وتكتب شكوى مهذبة، وتعبّر عن رأيك مع أسبابه.
    خذ وقتك؛ لا شيء هنا يُحرجك، وكل إجابة تُرينا ما نركّز عليه لاحقًا.
    وإن جئت من "Take a flight" لتتجاوز BIPA 3، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    You've travelled Lombok from Mataram to Labuhan Lombok! Here you'll hear radio news and everyday talk, read the legend of Putri Mandalika, a complaint to a hotel and a text explaining earthquakes, write a polite complaint, and give your opinion with reasons.
    Take your time; nothing here is embarrassing, and every answer shows us what to focus on next.
    If you came through "Take a flight" to skip BIPA 3, welcome: these are the same questions.
minutes: 40
pass_mark: 0.7
scoring: >-
  Score = points earned / points available (closed items 1 point unless set;
  translate items are graded against reference answers first, then AI grade_answer;
  writing_task and speaking_task are graded by AI against their rubric, each
  criterion an equal share of the item's points). Pass at >= 0.7. Passing marks
  BIPA 3 complete and opens BIPA 4; the same rule applies when the test is taken
  as the "Take a flight" skip-ahead over BIPA 3. Below the mark, show the per-skill
  results and suggest the units behind the missed items, with no penalty and an
  open retry.
sections:
  - id: listening
    skill: listening
    title:
      ar_eg: الاستماع
      ar: الاستماع
      en: Listening
    instructions:
      ar_eg: نشرة أخبار من راديو Mataram وكلام ناس في الشارع. اسمع، وعيد براحتك، واختار اللي سمعته بالظبط — ركّز على المعلومة المهمة — أو اكتبه.
      ar: نشرة أخبار من إذاعة Mataram وأحاديث يومية. استمع وأعِد كما تشاء، ثم اختر ما سمعته بالضبط — ركّز على المعلومة الأساسية — أو اكتبه.
      en: News from a Mataram radio station and everyday talk. Listen, replay as you like, then pick exactly what you heard (watch the key fact) or write it.
    items:
      - id: t01
        type: listen
        text: Hujan deras semalam menyebabkan banjir di tiga desa, tetapi tidak ada korban jiwa.
        options:
          - Angin kencang semalam menyebabkan banjir di tiga desa, tetapi tidak ada korban jiwa.
          - Hujan deras semalam menyebabkan banjir di tiga kota, tetapi tidak ada korban jiwa.
          - Hujan deras semalam menyebabkan banjir di tiga desa, tetapi tidak ada korban jiwa.
        answer: 2
        words: [hujan deras, banjir, korban]
      - id: t02
