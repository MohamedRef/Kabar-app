      - id: t06
        type: dictation
        text: Saya sedang membaca buku tentang Putri Mandalika.
        meaning:
          ar_eg: أنا بقرا كتاب عن Putri Mandalika.
          ar: أقرأ كتابًا عن Putri Mandalika.
