          - Temuan ini mendukung hipotesis, tetapi membutuhkan penelitian lanjutan.
          - Temuan ini menguatkan hipotesis, tetapi memerlukan penelitian lanjutan.
          - Temuan ini mendukung hipotesis. Akan tetapi, temuan tersebut memerlukan penelitian lanjutan.
          - Temuan ini mendukung hipotesis. Akan tetapi, masih diperlukan penelitian lanjutan.
