schema: kabar.test/v1
id: bipa7.test
language: id
kind: level
title:
  ar_eg: اختبار مستوى BIPA 7 — بابوا
  ar: اختبار مستوى BIPA 7 — بابوا
  en: BIPA 7 level test — Papua
intro:
  ar_eg: |
    وصلت لآخر الرحلة، من Sorong لحد Wamena! هنا هتسمع نشرة وندوة علمية سريعة، وتقرا خبر ومقال رأي وملخّص بحث وتطلّع المعنى اللي بين السطور، وتكتب نص علمي، وتتكلّم كلام طويل وترد على أسئلة.
    ده آخر وأصعب مستوى، فخد وقتك. عادي جدًا إنك تعيد المقطع أو تقرا الفقرة تاني — كل إجابة بتورّينا نركّز على إيه.
    ولو جاي من «اركب الطيارة» عشان تعدّي BIPA 7، أهلًا بيك — نفس الأسئلة.
  ar: |
    بلغتَ نهاية الرحلة من Sorong إلى Wamena! ستستمع هنا إلى نشرة وندوة علمية سريعة، وتقرأ خبرًا ومقال رأي وملخّص بحث وتستخرج المعنى الكامن بين السطور، وتكتب نصًّا علميًّا، وتتحدّث حديثًا مطوّلًا وتجيب عن الأسئلة.
    هذا آخر المستويات وأصعبها، فخذ وقتك. من الطبيعي أن تعيد المقطع أو تقرأ الفقرة ثانيةً؛ فكل إجابة تُرينا ما نركّز عليه.
    وإن جئت من «سافر بالطائرة» لتتجاوز BIPA 7، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    You've reached the end of the journey, from Sorong to Wamena! Here you'll hear a news bulletin and a fast academic seminar, read a news report, an op-ed and a research abstract and draw out what they imply, write a scholarly text, and speak at length and take questions.
    This is the last and hardest level, so take your time. It's completely normal to replay a clip or reread a paragraph; every answer shows us what to focus on.
    If you came through "Take a flight" to skip BIPA 7, welcome: these are the same questions.
minutes: 60
pass_mark: 0.7
scoring: >-
  Score = points earned / points available (closed items 1 point unless set;
  translate items are graded against reference answers first, then AI grade_answer;
  writing_task and speaking_task are graded by AI against their rubric, each
  criterion an equal share of the item's points). Pass at >= 0.7. Passing marks
  BIPA 7 complete; the same rule applies when the test is taken as the "Take a
  flight" skip-ahead over BIPA 7. Below the mark, show the per-skill results and
  suggest the units behind the missed items, with no penalty and an open retry.
sections:
  - id: listening
    skill: listening
    title:
      ar_eg: الاستماع
      ar: الاستماع
      en: Listening
    instructions:
      ar_eg: أجزاء من نشرة أخبار، وشرح علمي، وندوة أكاديمية سريعة، وكلام بلهجة بابوا. الكلام هنا بسرعته الطبيعية؛ اسمع وعيد براحتك، وركّز على الأرقام والأسماء وأدوات الربط.
      ar: مقاطع من نشرة أخبار وشرح علمي وندوة أكاديمية سريعة وحديث بلهجة بابوا. الكلام هنا بسرعته الطبيعية؛ استمع وأعِد كما تشاء، وركّز على الأرقام والأسماء وأدوات الربط.
      en: Parts of a news bulletin, a science explanation, a fast academic seminar and some Papuan Malay. Speech is at natural speed here; listen, replay as you like, and focus on numbers, names and connectors.
