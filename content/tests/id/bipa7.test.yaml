      - id: t13
        unit: bipa7.u10
        type: multiple_choice
        question: |
          ABSTRAK (contoh ditulis untuk tes ini)
          Penelitian ini mengkaji hubungan antara ketinggian lahan dan hasil panen ubi jalar di Lembah Baliem. Data kuantitatif dikumpulkan melalui kuesioner kepada 120 petani di tiga distrik, sedangkan data kualitatif diperoleh dari wawancara mendalam dengan sepuluh partisipan. Temuan menunjukkan bahwa hasil panen cenderung lebih tinggi di lahan yang lebih tinggi. Namun, jumlah sampel yang terbatas menjadi keterbatasan utama penelitian ini.
        question_meaning:
          ar_eg: البحث ده استعمل أنهي منهج؟
          ar: أيّ منهج استعمل هذا البحث؟
          en: Which method did this study use?
        options:
          - كيفي بس.
          - كمّي وكيفي مع بعض.
          - كمّي بس.
        answer: 1
        words: [metode penelitian, kuantitatif, kualitatif]
