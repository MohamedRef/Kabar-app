          ar: في الأسلوب العلمي يُستحسن استبدال «أظنّ البيانات كثيرة جدًّا» بـ«جُمعت البيانات من 120 مشاركًا».
          en: In academic register, "I reckon there's loads of data" is better replaced with "Data was collected from 120 participants."
