          ar_eg: الخبر بيبتدي بـ«Dilaporkan bahwa…» و«Pelaku diduga…». الكلمتين دول بيعملوا إيه؟
          ar: يبدأ الخبر بـ«Dilaporkan bahwa…» و«Pelaku diduga…». ما وظيفة الكلمتين؟
