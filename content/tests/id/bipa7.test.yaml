      - id: t11
        unit: bipa7.u07
        type: multiple_choice
        question: |
          JANGAN BIARKAN KURSI ITU KOSONG (artikel opini, ditulis untuk tes ini)
          Setiap lima tahun, kita diberi satu paku dan satu surat suara. Kelihatannya sepele, bukan? Namun, dari lubang kecil itulah lahir anggota DPR yang akan mengesahkan undang-undang tentang tanah, hutan, dan laut kita.
          Ada yang bilang golput adalah bentuk protes. Menurut hemat saya, kursi yang kita tinggalkan kosong tidak pernah benar-benar kosong. Kursi itu akan diisi oleh orang lain, dengan suara orang lain.
        question_meaning:
          ar_eg: الكاتب عايز يقنع القرّاء بإيه؟
          ar: بمَ يريد الكاتب أن يقنع القرّاء؟
          en: What is the writer trying to persuade readers of?
        options:
          - إن المقاطعة احتجاج ناجح.
          - إن البرلمان مش مهمّ.
          - إنهم يروحوا يصوّتوا ومايقاطعوش.
        answer: 2
        words: [golput, artikel opini, menurut hemat saya]
