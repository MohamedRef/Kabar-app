      - id: t35
        unit: bipa7.u10
        type: writing_task
        points: 8
        prompt:
          ar_eg: "اكتب نص علمي قصير، ٢٥٠–٣٥٠ كلمة، عن 'Ancaman pemutihan karang terhadap ekosistem Raja Ampat'. ابدأ بملخّص (abstrak) من ٢–٣ جمل، وبعدين اشرح السبب والنتيجة بترتيب (penyebab → tahapan → dampak)، واستعمل مرجع واحد على الأقل بإعادة صياغة (ممكن تخترعه وتقول إنه مثال)، واذكر حدود معلوماتك، واقفل بتوصية."
          ar: "اكتب نصًّا علميًّا قصيرًا من ٢٥٠ إلى ٣٥٠ كلمة حول 'Ancaman pemutihan karang terhadap ekosistem Raja Ampat'. ابدأ بملخّص (abstrak) من جملتين أو ثلاث، ثم اشرح السبب والنتيجة بترتيب (penyebab ← tahapan ← dampak)، واستعمل مرجعًا واحدًا على الأقل بإعادة صياغة (يجوز أن تؤلّفه على أن تذكر أنه مثال)، واذكر حدود معلوماتك، واختم بتوصية."
          en: "Write a short scholarly text, 250–350 words, on 'Ancaman pemutihan karang terhadap ekosistem Raja Ampat'. Open with a 2–3 sentence abstract, then explain cause and effect in order (penyebab → tahapan → dampak), paraphrase at least one source (you may invent one if you say it's an example), state the limits of what you know, and close with a recommendation."
        rubric:
          - Follows a scholarly structure (abstract, explanation in logical stages, limitations, recommendation) with clear paragraphing.
          - Explains cause and effect accurately and in order, using intersentential connectors (oleh sebab itu, akan tetapi, sementara itu, bahkan) and cohesive reference (tersebut, hal ini).
          - Paraphrases at least one source with a reporting verb and citation, labels any invented source, and hedges claims (cenderung, diperkirakan).
          - Uses academic register accurately throughout (precise terms, passives, nominalisation, no slang); 250–350 words.
        sample: |
          Abstrak. Tulisan ini menjelaskan bagaimana kenaikan suhu laut menyebabkan pemutihan karang dan apa dampaknya bagi ekosistem Raja Ampat. Uraian disusun berdasarkan tahapan proses dan diakhiri dengan rekomendasi.
          Raja Ampat terletak di kawasan Segitiga Terumbu Karang, salah satu pusat keanekaragaman hayati laut dunia. Karang di kawasan tersebut hidup bersama alga kecil yang memberi warna dan nutrisi. Hubungan ini sangat peka terhadap suhu air.
          Penyebab utama pemutihan adalah pemanasan global. Ketika suhu laut meningkat tajam selama beberapa minggu, karang melepaskan alga tersebut. Akibatnya, karang kehilangan warna dan sumber makanannya. Jika suhu segera turun, karang dapat pulih. Akan tetapi, jika panas berlangsung lama, karang cenderung mati.
          Dampaknya tidak berhenti pada karang. Ikan kehilangan tempat berlindung, sehingga hasil tangkapan nelayan dapat menurun. Bahkan, pariwisata selam yang menjadi sumber penghasilan warga juga ikut terancam. Rumbiak (2021, contoh rujukan untuk tes ini) menyatakan bahwa kawasan konservasi yang dikelola bersama masyarakat adat pulih lebih cepat daripada kawasan yang tidak dilindungi.
          Perlu dicatat bahwa tulisan ini tidak didasarkan pada pengukuran langsung, sehingga besarnya kerusakan di setiap pulau belum dapat dipastikan.
          Oleh sebab itu, direkomendasikan tiga langkah, yaitu memperluas kawasan konservasi, membatasi jumlah penyelam di lokasi yang rentan, dan melibatkan nelayan dalam pemantauan suhu laut.
        words: [abstrak, pemutihan, keanekaragaman hayati]
  - id: speaking
    skill: speaking
    title:
      ar_eg: الكلام
      ar: المحادثة
      en: Speaking
    instructions:
      ar_eg: هنا هتعمل عرض طويل وبعدين ترد على سؤال صعب من الجمهور. اتكلم بشكل طبيعي؛ المهم الكلام يبقى مترتّب ومترابط، وإنك تعترف بحدود معلوماتك بأمانة.
      ar: ستقدّم هنا عرضًا مطوّلًا ثم تجيب عن سؤال صعب من الحضور. تكلّم بشكل طبيعي؛ المهم أن يكون الكلام مرتّبًا مترابطًا، وأن تعترف بحدود معرفتك بأمانة.
      en: Here you'll give an extended talk, then answer a hard question from the audience. Speak naturally; what matters is a well-ordered, connected talk and owning the limits of what you know.
    items:
      - id: t36
        unit: bipa7.u10
        type: speaking
        text: Yang saya hormati Bapak moderator dan hadirin sekalian, izinkan saya memaparkan temuan penelitian kami.
        meaning:
          ar_eg: السيد مدير الجلسة المحترم والحضور الكرام، اسمحولي أعرض نتايج بحثنا.
          ar: السيد مدير الجلسة المحترم، والحضور الكرام، اسمحوا لي أن أعرض نتائج بحثنا.
          en: Honourable moderator and distinguished audience, allow me to present our research findings.
        words: [yang saya hormati, moderator, memaparkan, temuan]
      - id: t37
        unit: bipa7.u09
        type: speaking_task
        points: 6
        prompt:
          ar_eg: "اعمل عرض حوالي ٥ دقايق بعنوان 'Bhinneka Tunggal Ika di era media sosial'. افتح بتحية رسمية وخطّة العرض، اشرح معنى الشعار وأصله، وبعدين إزاي الأخبار الكدب وخطاب الكراهية بيهدّدوه، وهات مثال (ممكن تخترعه وتقول إنه مثال)، واقفل بخلاصة وتوصية. استعمل تعبير اصطلاحي واحد على الأقل بشكل طبيعي."
          ar: "قدّم عرضًا مدّته نحو خمس دقائق بعنوان 'Bhinneka Tunggal Ika di era media sosial'. افتتح بتحية رسمية وخطّة العرض، واشرح معنى الشعار وأصله، ثم كيف تهدّده الأخبار الكاذبة وخطاب الكراهية، وقدّم مثالًا (يجوز أن تؤلّفه على أن تذكر أنه مثال)، واختم بخلاصة وتوصية. واستعمل تعبيرًا اصطلاحيًّا واحدًا على الأقل استعمالًا طبيعيًّا."
          en: "Give a talk of about 5 minutes titled 'Bhinneka Tunggal Ika di era media sosial'. Open with a formal greeting and outline, explain the motto's meaning and origin, then how hoaxes and hate speech threaten it, give an example (invented is fine if you say so), and close with a summary and a recommendation. Use at least one idiom naturally."
        rubric:
          - Sustains a well-structured extended talk (formal opening, outline, body in stages, summary, recommendation) with clear signposting.
          - Explains the motto accurately (Old Javanese, unity in diversity, on the national emblem) and links it convincingly to hoaxes and hate speech.
          - Connects ideas with cohesive devices (tersebut, sinonim and repetisi, akan tetapi, oleh sebab itu) and uses at least one idiom naturally.
          - Speaks fluently at length in formal register, with clear pronunciation; self-corrections are fine.
        sample: |
          Yang saya hormati Bapak moderator dan hadirin sekalian. Presentasi saya terdiri atas tiga bagian, yaitu makna Bhinneka Tunggal Ika, ancaman di media sosial, dan saran untuk kita semua.
          Pertama, semboyan Bhinneka Tunggal Ika berasal dari bahasa Jawa Kuno dan berarti "berbeda-beda tetapi tetap satu". Semboyan tersebut tertulis pada lambang negara, Garuda Pancasila. Indonesia memiliki lebih dari seribu tiga ratus suku bangsa, dan kerukunan di antara mereka adalah kekayaan yang luar biasa.
          Kedua, media sosial membawa tantangan baru. Hoaks dan ujaran kebencian menyebar lebih cepat daripada kebenaran. Sebagai contoh, dan ini contoh rekaan saja, sebuah tangkapan layar palsu tentang satu suku bisa dibagikan ke ratusan grup dalam satu malam. Akibatnya, prasangka tumbuh, padahal faktanya tidak pernah diverifikasi.
          Akan tetapi, kita tidak boleh angkat tangan. Literasi digital adalah jawabannya. Sebelum menyebarkan sesuatu, kita perlu cek fakta, mencari sumber resmi, dan mendengar kedua belah pihak.
          Sebagai kesimpulan, Bhinneka Tunggal Ika bukan hanya semboyan di dinding sekolah, melainkan sikap yang harus dijaga setiap kali kita mengetik dan membagikan sesuatu. Saran saya, sekolah perlu mengajarkan literasi digital sejak dini. Terima kasih.
        words: [Bhinneka Tunggal Ika, ujaran kebencian, literasi digital]
      - id: t38
        unit: bipa7.u10
        type: speaking_task
        points: 4
        prompt:
          ar_eg: "بعد العرض، حد من الجمهور بيسألك: 'Bukankah media sosial justru menyatukan orang Indonesia? Data Anda dari mana?' جاوب حوالي دقيقتين: اشكره، اطلب توضيح لو محتاج، اعترف بالنقطة الصح في سؤاله، واذكر حدود معلوماتك بأمانة، ورجّع للفكرة الأساسية."
          ar: "بعد العرض يسألك أحد الحضور: 'Bukankah media sosial justru menyatukan orang Indonesia? Data Anda dari mana?' أجب نحو دقيقتين: اشكره، واطلب توضيحًا إن لزم، واعترف بما في سؤاله من صواب، واذكر حدود معلوماتك بأمانة، ثم عُد إلى فكرتك الرئيسة."
          en: "After your talk, someone asks: 'Bukankah media sosial justru menyatukan orang Indonesia? Data Anda dari mana?' Answer for about two minutes: thank them, ask for clarification if needed, concede what's right in their point, state the limits of your data honestly, and bring it back to your main idea."
        rubric:
          - Opens politely (terima kasih atas pertanyaannya) and, where useful, asks for klarifikasi.
          - Concedes the valid part of the challenge fairly instead of dismissing it.
          - States the limits of the evidence honestly (keterbatasan, contoh rekaan, belum ada data) without inventing statistics.
          - Returns clearly to the main argument, speaking fluently and calmly in formal register.
        sample: |
          Terima kasih atas pertanyaannya, Pak. Pertanyaan yang sangat relevan.
          Bapak benar bahwa media sosial juga menyatukan orang. Misalnya, keluarga di Wamena dan di Jakarta bisa berbicara setiap hari, dan banyak gerakan sosial lahir dari media sosial.
          Mengenai data, saya harus jujur bahwa contoh tadi adalah contoh rekaan. Presentasi saya tidak didasarkan pada penelitian sendiri, dan itu memang keterbatasan presentasi ini.
          Meskipun demikian, inti argumen saya tetap sama. Media sosial adalah alat. Alat itu bisa menyatukan, tetapi juga bisa memecah belah. Oleh sebab itu, literasi digital tetap penting supaya manfaatnya lebih besar daripada dampak negatifnya.
        words: [relevan, keterbatasan, meskipun demikian]
