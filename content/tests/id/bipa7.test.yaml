  - id: reading
    skill: reading
    title:
      ar_eg: القراية
      ar: القراءة
      en: Reading
    instructions:
      ar_eg: اقرا الخبر، ومقال الرأي، وملخّص البحث. الأسئلة هنا كتير منها عن المعنى الضمني، يعني الكاتب بيلمّح لإيه أو منحاز لمين، مش بس عن المكتوب.
      ar: اقرأ الخبر ومقال الرأي وملخّص البحث. كثير من الأسئلة هنا عن المعنى الضمني، أي ما يلمّح إليه الكاتب أو من ينحاز إليه، لا عن المكتوب وحده.
      en: Read the news report, the op-ed and the research abstract. Many questions here are about implied meaning, what the writer hints at or whose side they lean towards, not just what is written.
    items:
      - id: t08
        unit: bipa7.u06
        type: multiple_choice
        question: |
          WARGA PANIK, NELAYAN MERUGI (berita ditulis untuk tes ini)
          MANOKWARI — Sebuah pesan berantai tentang "ikan beracun" di Teluk Doreri membuat harga ikan anjlok sejak Senin. Pesan tersebut menyebut "seorang dokter" sebagai sumbernya, tanpa nama dan tanpa tautan.
          Dinas Kesehatan setempat membantah kabar itu. Menurut hasil uji laboratorium dinas, sampel ikan dari teluk aman dikonsumsi. Meskipun demikian, sebagian pembeli masih ragu. "Saya tunggu seminggu lagi saja," ujar seorang ibu di pasar.
          Sementara itu, para nelayan mengaku kehilangan separuh penghasilan mereka dalam tiga hari.
        question_meaning:
          ar_eg: الكاتب بيلمّح لإيه لما بيقول إن الرسالة ذكرت «دكتور» من غير اسم ولا رابط؟
          ar: إلامَ يلمّح الكاتب حين يذكر أنّ الرسالة نسبت الخبر إلى «طبيب» بلا اسم ولا رابط؟
          en: What is the writer implying by noting the message cites "a doctor" with no name or link?
        options:
          - إن الدكتور ده مشهور جدًّا.
          - إن مصدر الرسالة مش موثوق.
          - إن الرسالة جاية من وزارة الصحة.
        answer: 1
        words: [hoaks, kredibel, sumber resmi]
