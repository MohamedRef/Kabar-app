          ar_eg: كل مواطن عليه إنه يحترم القانون.
          ar: على كلّ مواطن أن يلتزم بالقانون.
          en: Every citizen must obey the law.
        answers:
          - Setiap warga negara wajib mematuhi hukum.
          - Setiap warga negara wajib mematuhi hukum
