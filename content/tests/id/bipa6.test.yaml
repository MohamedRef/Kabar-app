      - id: t30
        unit: bipa6.u10
        type: fill_blank
        sentence: Dalam artikelnya, Siregar (2019) ___ bahwa jeruk Berastagi rusak akibat abu vulkanik.
        meaning:
          ar_eg: في مقالته، سيريجار (2019) أكّد إن برتقان بيراستاجي باظ بسبب الرماد البركاني.
          ar: أكّد سيريغار (2019) في مقاله أنّ برتقال بيراستاغي تضرّر بسبب الرماد البركاني.
          en: In his article, Siregar (2019) stresses that Berastagi's oranges were damaged by volcanic ash.
        options: ["menegaskan", "menyindir", "menawarkan"]
        answers: [menegaskan]
        explain:
          ar_eg: في الكتابة الأكاديمية بننقل كلام المراجع بأفعال زي menyatakan وmengungkapkan وmenegaskan. (المرجع هنا متألّف للاختبار.)
          ar: في الكتابة الأكاديمية تُنقل أقوال المراجع بأفعال مثل menyatakan وmengungkapkan وmenegaskan. (المرجع هنا مؤلَّف للاختبار.)
          en: Academic writing reports sources with verbs like menyatakan, mengungkapkan, menegaskan. (The source here is invented for the test.)
        words: [menegaskan, abu vulkanik]
      - id: t31
        unit: bipa6.u03
        type: multiple_choice
        question_meaning:
          ar_eg: «Air beriak tanda tak dalam» معناها إيه؟
          ar: ما معنى «Air beriak tanda tak dalam»؟
          en: What does "Air beriak tanda tak dalam" mean?
        options:
          - المية الهادية عميقة.
