schema: kabar.test/v1
id: bipa6.test
language: id
kind: level
title:
  ar_eg: اختبار مستوى BIPA 6 — سومطرة
  ar: اختبار مستوى BIPA 6 — سومطرة
  en: BIPA 6 level test — Sumatra
intro:
  ar_eg: |
    لفّيت سومطرة كلها، من Medan لحد Berastagi! هنا هتسمع قصة وبانتون وكلام ساخر، وتقرا قصة قصيرة معناها مستخبّي، ونص ساخر، ومادة من لايحة، وتلخّص اللايحة، وتكتب فقرة أكاديمية، وتشرح بالكلام فهمك لقصة.
    خد وقتك. في المستوى ده كتير من المعنى بيبقى بين السطور، فاقرا براحة — كل إجابة بتورّينا نركّز على إيه.
    ولو جاي من «اركب الطيارة» عشان تعدّي BIPA 6، أهلًا بيك — نفس الأسئلة.
  ar: |
    جُبتَ سومطرة كلها من Medan إلى Berastagi! ستستمع هنا إلى قصة وبانتون وكلام ساخر، وتقرأ قصة قصيرة معناها مضمر، ونصًّا ساخرًا، ومادة من لائحة، وتلخّص اللائحة، وتكتب فقرة أكاديمية، وتشرح شفهيًّا فهمك لقصة.
    خذ وقتك. في هذا المستوى يكمن كثير من المعنى بين السطور، فاقرأ على مهل؛ فكل إجابة تُرينا ما نركّز عليه.
    وإن جئت من «سافر بالطائرة» لتتجاوز BIPA 6، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    You've crossed Sumatra from Medan to Berastagi! Here you'll hear a story, a pantun and some sarcasm, read a short story whose meaning is implied, a satirical piece and an article from a regulation, summarise the regulation, write an academic paragraph, and explain aloud how you read a story.
    Take your time. At this level much of the meaning sits between the lines, so read slowly; every answer shows us what to focus on.
    If you came through "Take a flight" to skip BIPA 6, welcome: these are the same questions.
minutes: 55
pass_mark: 0.7
scoring: >-
  Score = points earned / points available (closed items 1 point unless set;
  translate items are graded against reference answers first, then AI grade_answer;
  writing_task and speaking_task are graded by AI against their rubric, each
  criterion an equal share of the item's points). Pass at >= 0.7. Passing marks
  BIPA 6 complete and opens BIPA 7; the same rule applies when the test is taken
  as the "Take a flight" skip-ahead over BIPA 6. Below the mark, show the per-skill
  results and suggest the units behind the missed items, with no penalty and an
  open retry.
sections:
  - id: listening
    skill: listening
    title:
      ar_eg: الاستماع
      ar: الاستماع
      en: Listening
    instructions:
      ar_eg: أجزاء من قصة، وبانتون، ونشرة عن التاريخ، وخطبة، وتعليق ساخر. اسمع وعيد براحتك. خد بالك إن كلمة واحدة ممكن تقلب المعنى أو تحوّله من جد لسخرية.
      ar: مقاطع من قصة وبانتون ونشرة تاريخية وخطبة وتعليق ساخر. استمع وأعِد كما تشاء، وانتبه إلى أنّ كلمة واحدة قد تقلب المعنى أو تحوّله من الجدّ إلى السخرية.
      en: Parts of a story, a pantun, a history bulletin, a speech and a sarcastic comment. Listen, replay as you like, and notice that one word can flip the meaning, or turn it from serious to sarcastic.
    items:
