      - id: t35
        unit: bipa6.u07
        type: writing_task
        points: 4
        prompt:
          ar_eg: "رجع للايحة الزبالة في جزء القراية، ولخّصها في ٦٠–٩٠ كلمة لجيرانك في جروب الحيّ، بإندونيسي رسمي بس سهل: قول مين عليه إيه، وإمتى، وإيه الغرامة، ومن إمتى بتسري."
          ar: "ارجع إلى لائحة النفايات في قسم القراءة، ولخّصها في ٦٠ إلى ٩٠ كلمة لجيرانك في مجموعة الحيّ، بإندونيسية رسمية سهلة: من عليه ماذا، ومتى، وما الغرامة، ومنذ متى تسري."
          en: "Go back to the waste regulation in the reading section and summarise it in 60–90 words for your neighbours' group chat, in formal but plain Indonesian: who must do what, when, what the fine is, and from when it applies."
        rubric:
          - Covers every obligation in the regulation (sorting, Saturday hand-over, leaving it with the RT head, the fine, the start date) without adding rules that aren't there.
          - Rewrites the legal language in plain words (wajib → harus, dalam hal → kalau) rather than copying whole articles.
          - Is organised and brief, 60–90 words, with a short opening and closing suitable for neighbours.
          - Uses formal but friendly Indonesian with accurate grammar and spelling.
        sample: |
          Bapak dan Ibu tetangga, berikut ringkasan peraturan desa tentang sampah.
          Mulai 1 Januari, setiap rumah harus memisahkan sampah organik dan anorganik. Sampah anorganik dibawa ke bank sampah desa setiap hari Sabtu. Kalau tidak bisa datang, sampah boleh dititipkan kepada ketua RT. Siapa pun yang membuang sampah ke sungai akan didenda Rp50.000.
          Mari kita jaga sungai kita bersama. Terima kasih.
        words: [peraturan, ketentuan, denda, berlaku]
      - id: t36
        unit: bipa6.u10
        type: writing_task
        points: 6
        prompt:
          ar_eg: "اكتب فقرة أكاديمية واحدة، ١٢٠–١٧٠ كلمة، عن 'Dampak letusan gunung berapi terhadap pertanian di sekitarnya'. ابدأ بجملة رئيسية (kalimat utama)، وهات جمل شرح، واستعمل مرجع واحد على الأقل بإعادة صياغة (ممكن تخترع المرجع زي «Nasution, 2020» بشرط تقول إنه مثال)، واقفل بجملة خلاصة."
          ar: "اكتب فقرة أكاديمية واحدة من ١٢٠ إلى ١٧٠ كلمة حول 'Dampak letusan gunung berapi terhadap pertanian di sekitarnya'. ابدأ بجملة رئيسة (kalimat utama)، وأورد جملًا شارحة، واستعمل مرجعًا واحدًا على الأقل بإعادة صياغة (يجوز أن تؤلّف المرجع مثل «Nasution, 2020» على أن تذكر أنه مثال)، واختم بجملة خلاصة."
          en: "Write one academic paragraph, 120–170 words, on 'Dampak letusan gunung berapi terhadap pertanian di sekitarnya'. Open with a topic sentence (kalimat utama), add supporting sentences, use at least one source by paraphrase (you may invent one such as 'Nasution, 2020' as long as you say it's an example), and close with a concluding sentence."
        rubric:
          - Has a clear kalimat utama, supporting sentences (kalimat penjelas) that each serve it, and a concluding sentence.
          - Paraphrases at least one source with a reporting verb (menyatakan, mengungkapkan, menegaskan) and an in-text citation, and labels any invented source.
          - Links sentences with academic connectors (di samping itu, lebih lanjut, dengan kata lain, singkatnya).
          - Uses academic register accurately (nominalisation, no slang, no first-person opinion without support); 120–170 words.
        sample: |
          Letusan gunung berapi membawa dampak ganda bagi pertanian di sekitarnya. Dalam jangka pendek, abu vulkanik menutupi daun dan merusak tanaman sayur serta jeruk, sehingga petani kehilangan hasil panen. Sebagai contoh, setelah letusan Gunung Sinabung, banyak kebun di Tanah Karo gagal panen selama berbulan-bulan. Di samping itu, debu yang tebal juga menyulitkan pengangkutan hasil bumi ke pasar. Namun, dalam jangka panjang, abu tersebut justru menyuburkan tanah. Nasution (2020, contoh rujukan untuk tes ini) menyatakan bahwa kandungan mineral dalam abu vulkanik dapat meningkatkan kesuburan lahan setelah beberapa tahun. Dengan kata lain, kerugian hari ini dapat menjadi keuntungan di masa depan. Singkatnya, letusan gunung berapi merugikan petani dalam waktu dekat, tetapi juga menjadi salah satu alasan mengapa lahan di sekitar gunung terkenal subur.
        words: [kalimat utama, kalimat penjelas, singkatnya]
  - id: speaking
    skill: speaking
    title:
      ar_eg: الكلام
      ar: المحادثة
      en: Speaking
    instructions:
      ar_eg: هنا هتقول بانتون وتشرح بالكلام فهمك لقصة. اتكلم بشكل طبيعي؛ المهم إنك تدعم فهمك بإشارات من النص، مش إن كل كلمة تبقى مثالية.
      ar: ستلقي هنا بانتونًا وتشرح شفهيًّا فهمك لقصة. تكلّم بشكل طبيعي؛ المهم أن تدعم تفسيرك بإشارات من النصّ، لا أن تكون كل كلمة مثالية.
      en: Here you'll recite a pantun and explain aloud how you read a story. Speak naturally; what matters is backing your reading with clues from the text, not every word being perfect.
    items:
      - id: t37
        unit: bipa6.u02
        type: speaking
        text: Kalau ada sumur di ladang, boleh kita menumpang mandi. Kalau ada umur yang panjang, boleh kita berjumpa lagi.
        meaning:
          ar_eg: لو فيه بير في الغيط، ممكن نستحمّى. ولو ربنا ادّانا عمر، نتقابل تاني.
          ar: إن كان في الحقل بئر، جاز لنا أن نغتسل. وإن طال العمر، جاز لنا أن نلتقي ثانيةً.
          en: If there's a well in the field, we may stop to bathe. If we are granted long life, we may meet again.
        words: [pantun, sampiran, isi]
      - id: t38
        unit: bipa6.u01
        type: speaking_task
        points: 6
        prompt:
          ar_eg: "اتكلم حوالي ٣ دقايق عن القصة القصيرة «Koper Biru» من جزء القراية: إيه المعنى المستخبّي في الآخر؟ إيه الإشارات اللي في النص بتدعم كلامك (التنضيف، الأكل، البصّ من الشباك، الرجل)؟ وإيه العبرة (amanat) في رأيك؟"
          ar: "تحدّث نحو ثلاث دقائق عن القصة القصيرة «Koper Biru» في قسم القراءة: ما المعنى المضمر في نهايتها؟ وما الإشارات في النصّ التي تدعم تفسيرك (التنظيف، الطعام، النظر من النافذة، القدم)؟ وما المغزى (amanat) في رأيك؟"
          en: "Talk for about 3 minutes about the short story «Koper Biru» from the reading section: what is implied at the end? Which clues in the text support your reading (the cleaning, the meal, looking out of the window, the sore leg)? And what do you think its amanat (message) is?"
        rubric:
          - Gives a clear interpretation of the implied meaning rather than retelling the plot.
          - Supports it with at least two specific clues from the text (isyarat, tersirat, digambarkan).
          - Uses literary vocabulary accurately (tokoh, watak, simbol, tema, amanat, akhir terbuka).
          - Speaks fluently and in an organised way, with a short conclusion about the message.
        sample: |
          Menurut saya, cerpen "Koper Biru" bercerita tentang kesedihan seorang ibu yang tidak bisa diucapkan. Amak tidak pernah berkata bahwa ia sedih, tetapi semua isyarat dalam cerita menunjukkan hal itu.
          Pertama, Amak membersihkan koper setiap pagi, padahal tidak ada debu. Itu tanda bahwa ia tidak bisa berhenti memikirkan kepergian anaknya. Kedua, ia memasak gulai kesukaan Rizal, sebuah cara untuk menunjukkan kasih sayang tanpa kata-kata. Ketiga, ia berbicara sambil menatap jendela, bukan wajah anaknya. Tampaknya ia takut menangis.
          Yang paling kuat adalah akhir cerita. Amak bilang kakinya sakit, tetapi tetangga melihatnya berdiri lama di depan rumah. Jadi, alasan itu hanya cara untuk menghindari perpisahan di terminal.
          Koper biru menjadi simbol perantauan. Amanat yang saya tangkap adalah bahwa cinta orang tua sering tersirat, tidak tersurat, dan kita perlu belajar membacanya.
        words: [tersirat, isyarat, simbol, amanat]
