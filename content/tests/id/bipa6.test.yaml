        meaning:
          ar_eg: المرحوم الحاج إبراهيم انتقل لرحمة الله الصبح ده.
          ar: انتقل المرحوم الحاج إبراهيم إلى رحمة الله هذا الصباح.
          en: The late Haji Ibrahim passed away this morning.
        options: ["Almarhum", "Almarhumah", "Korban"]
