          PERATURAN DESA TENTANG SAMPAH (contoh ditulis untuk tes ini)
          Pasal 3
          (1) Setiap warga wajib memilah sampah organik dan anorganik di rumah masing-masing.
          (2) Sampah anorganik diserahkan kepada bank sampah desa setiap hari Sabtu.
          (3) Dalam hal warga tidak dapat hadir, sampah dapat dititipkan kepada ketua RT.
          Pasal 4
