          ar_eg: almarhum للراجل المسلم، وalmarhumah للست، وmendiang كلمة عامّة بتتقال كتير لغير المسلمين.
          ar: almarhum للرجل المسلم، وalmarhumah للمرأة، وmendiang لفظ عامّ يُستعمل غالبًا لغير المسلمين.
          en: almarhum is for a Muslim man, almarhumah for a woman, and mendiang is the general term, often used for non-Muslims.
