  - id: reading
    skill: reading
    title:
      ar_eg: القراية
      ar: القراءة
      en: Reading
    instructions:
      ar_eg: اقرا القصة القصيرة، والنص الساخر، ومادة اللايحة. في القصة والنص الساخر، المعنى الحقيقي مش دايمًا مكتوب صريح؛ دوّر على الإشارات.
      ar: اقرأ القصة القصيرة والنصّ الساخر ومادة اللائحة. في القصة والنصّ الساخر لا يُكتب المعنى الحقيقي صراحةً دائمًا، فابحث عن الإشارات.
      en: Read the short story, the satirical piece and the regulation article. In the story and the satire, the real meaning isn't always written outright; look for the clues.
    items:
      - id: t08
        unit: bipa6.u01
        type: multiple_choice
        question: |
          KOPER BIRU (cerpen ditulis untuk tes ini)
          Koper biru itu sudah tiga hari berdiri di sudut kamar. Setiap pagi Amak membersihkannya, padahal tidak ada debu. Malam terakhir, Amak memasak gulai kesukaan Rizal, lalu duduk lama di dapur walaupun piring-piring sudah bersih.
          "Di Jakarta nanti, jangan lupa salat," katanya sambil menatap jendela, bukan wajah anaknya.
          Pagi-pagi Rizal berangkat. Amak tidak ikut ke terminal. Ia bilang kakinya sakit. Tetangga melihatnya berdiri di depan rumah sampai bus hilang di tikungan.
        question_meaning:
          ar_eg: الأمّ («Amak») حاسّة بإيه، حتى لو ماقالتهوش؟
          ar: بمَ تشعر الأمّ («Amak») وإن لم تقله؟
          en: What does Amak feel, even though she never says it?
        options:
          - فرحانة إن ابنها مسافر أخيرًا.
          - زعلانة ومش قادرة تودّعه.
          - زهقانة من التنضيف.
        answer: 1
        words: [tersirat, merantau, watak]
