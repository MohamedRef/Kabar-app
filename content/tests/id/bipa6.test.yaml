          ar: في حال لم يُحضر المشارك بطاقة الهوية، يحقّ للجنة رفض تسجيله.
          en: Where a participant does not bring an ID card, the committee is entitled to refuse their registration.
        options: ["Dalam hal", "Walaupun", "Bahkan"]
        answers: [Dalam hal]
        explain:
          ar_eg: dalam hal في لغة القوانين = «في حالة».
          ar: dalam hal في لغة القوانين = «في حال».
          en: In legal register, dalam hal means "where / in the event that".
        words: [dalam hal, berhak]
      - id: t28
        unit: bipa6.u08
        type: fill_blank
        sentence: ___ bunga raksasa itu sangat bergantung pada serangga.
        meaning:
          ar_eg: تلقيح الوردة العملاقة دي معتمد جدًّا على الحشرات.
          ar: يعتمد تلقيح تلك الزهرة العملاقة كثيرًا على الحشرات.
          en: The pollination of that giant flower depends heavily on insects.
        options: ["Penyerbukan", "Menyerbuk", "Diserbuki"]
        answers: [Penyerbukan]
        explain:
          ar_eg: 'الكتابة العلمية بتحب الاسم بدل الفعل (nominalisasi): menyerbuki → penyerbukan.'
          ar: تفضّل الكتابة العلمية الاسم على الفعل (nominalisasi)، menyerbuki ← penyerbukan.
          en: Scientific writing prefers the noun to the verb (nominalisasi), menyerbuki → penyerbukan.
        words: [penyerbukan, serangga, raksasa]
      - id: t29
        unit: bipa6.u09
        type: multiple_choice
        question_meaning:
          ar_eg: عايز ترفض عرض سعر بأدب في التفاوض. تقول إيه؟
