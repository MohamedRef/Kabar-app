          ar_eg: البيريباهاسا «bagai aur dengan tebing» = زي الغاب والجرف، كل واحد بيسند التاني.
          ar: المثل «bagai aur dengan tebing» = كالخيزران والجرف، يسند كلٌّ منهما الآخر.
          en: The proverb "bagai aur dengan tebing", like bamboo and bank, means each props up the other.
