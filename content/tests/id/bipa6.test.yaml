      - id: t11
        unit: bipa6.u06
        type: multiple_choice
        question: |
          SELAMAT, JALAN KAMI JUARA! (tulisan satire, ditulis untuk tes ini)
          Warga Desa Sukamaju patut berbangga. Jalan desa kami kini resmi menjadi tempat wisata. Setiap musim hujan, lubang-lubangnya berubah menjadi kolam ikan gratis. Anak-anak tidak perlu lagi pergi ke kolam renang kota.
          Kami juga berterima kasih kepada pejabat yang lima tahun lalu berjanji memperbaiki jalan ini. Berkat kesabaran beliau, kami belajar arti kata "segera" yang sesungguhnya.
        question_meaning:
          ar_eg: الكاتب في الحقيقة عايز يقول إيه؟
          ar: ماذا يريد الكاتب أن يقول في الحقيقة؟
          en: What is the writer really saying?
        options:
          - إن الطريق بقى مكان سياحي جميل.
          - إن الطريق مكسّر والمسؤول ماوفّاش بوعده.
          - إن الأطفال بيحبّوا يعوموا في البلد.
        answer: 1
