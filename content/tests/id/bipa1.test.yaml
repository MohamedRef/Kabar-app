      - id: t33
        unit: bipa1.u06
        type: writing_task
        points: 4
        prompt:
          ar_eg: اكتب رسالة قصيرة (٤–٦ جمل) لصاحبك Raka. قوله إنت فين دلوقتي وبتعمل إيه، واعزمه تتقابلوا بكرة (فين والساعة كام).
