schema: kabar.test/v1
id: bipa1.test
language: id
kind: level
title:
  ar_eg: اختبار مستوى BIPA 1 — جاكرتا
  ar: اختبار مستوى BIPA 1 — جاكرتا
  en: BIPA 1 level test — Jakarta
intro:
  ar_eg: |
    خلّصت جاكرتا كلها! الاختبار ده بيلفّ على العشر وحدات: هتسمع، تقرا، تكتب رسالة قصيرة، وتعرّف بنفسك.
    خد وقتك، مفيش عدّاد بيضغط عليك. لو حاجة وقفتك، عادي خالص — هنعرف بس نراجع إيه.
    ولو جاي من «اركب الطيارة» عشان تعدّي BIPA 1 على طول، أهلًا بيك — نفس الأسئلة بالظبط.
  ar: |
    أتممتَ جاكرتا كلها! يغطي هذا الاختبار الوحدات العشر: ستستمع وتقرأ وتكتب رسالة قصيرة وتعرّف بنفسك.
    خذ وقتك، فلا عدّاد يضغط عليك. وإن استوقفك شيء فلا بأس؛ سنعرف فقط ما يحتاج إلى مراجعة.
    وإن جئت من «سافر بالطائرة» لتتجاوز BIPA 1 مباشرة، فأهلًا بك؛ الأسئلة نفسها تمامًا.
  en: |
    You've made it through all of Jakarta! This test walks through all ten units: you'll listen, read, write a short message and introduce yourself.
    Take your time; there's no clock pushing you. If something trips you up, that's fine: it just shows us what to review.
    If you came here through "Take a flight" to skip BIPA 1, welcome: these are exactly the same questions.
minutes: 30
pass_mark: 0.75
scoring: >-
  Score = points earned / points available (closed items 1 point unless set;
  translate items are graded against reference answers first, then AI grade_answer;
  writing_task and speaking_task are graded by AI against their rubric, each
  criterion an equal share of the item's points). Pass at >= 0.75. Passing marks
  BIPA 1 complete and opens BIPA 2; the same rule applies when the test is taken
  as the "Take a flight" skip-ahead over BIPA 1. Below the mark, show the per-skill
  results and suggest the units behind the missed items, with no penalty and an
  open retry.
