          en: Write a short message (4–6 sentences) to your friend Raka. Tell him where you are now and what you're doing, and invite him to meet tomorrow (where and at what time).
        rubric:
          - Greets Raka and signs off (e.g. "Hai Raka! … Salam, Mohamed").
          - Says where he is and what he is doing now (di …, sedang + verb).
          - Proposes a place and a time to meet tomorrow (besok, jam …, di depan / di …).
          - Short, clear BIPA 1 sentences with mostly correct word order and spelling; 4–6 sentences.
        sample: |
          Hai Raka! Sekarang saya di perpustakaan dekat Monas. Saya sedang membaca buku sejarah Jakarta.
          Besok saya mau ke Kota Tua. Kamu mau ikut? Kita bertemu di depan stasiun jam sembilan pagi, ya.
          Salam, Mohamed
        words: [sedang, besok, bertemu]
