      - id: t13
        type: multiple_choice
        question: |
          HASIL SURVEI: BAHASA GAUL DI SEKOLAH (survei ditulis untuk tes ini)
          Dalam survei terhadap 300 siswa SMA di Pontianak, mayoritas responden (62 persen) mengaku memakai bahasa gaul setiap hari. Sepertiga responden menganggap bahasa gaul tidak mengganggu kemampuan berbahasa baku. Namun, separuh guru yang ditanya berpendapat sebaliknya.
          Barangkali perbedaan ini muncul karena siswa dan guru menilai situasi yang berbeda. Siswa cenderung memikirkan obrolan dengan teman, sedangkan guru memikirkan tulisan di kelas. Pada umumnya, kedua kelompok sepakat bahwa bahasa baku tetap wajib dalam ujian.
        question_meaning:
          ar_eg: إيه اللي الطلبة والمدرّسين متّفقين عليه؟
          ar: علامَ يتّفق الطلّاب والمعلّمون؟
          en: What do students and teachers agree on?
        options:
          - إن اللغة العامية لازم تتمنع.
          - إن اللغة العامية بتضرّ دايمًا.
          - إن اللغة الفصحى لسه لازمة في الامتحانات.
        answer: 2
        words: [sepakat, bahasa baku, pada umumnya]
