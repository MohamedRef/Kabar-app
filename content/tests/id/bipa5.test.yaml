schema: kabar.test/v1
id: bipa5.test
language: id
kind: level
title:
  ar_eg: اختبار مستوى BIPA 5 — كاليمانتان
  ar: اختبار مستوى BIPA 5 — كاليمانتان
  en: BIPA 5 level test — Kalimantan
intro:
  ar_eg: |
    لفّيت كاليمانتان كلها، من Balikpapan لحد Singkawang! هنا هتسمع مقابلة شغل ونشرة وعرض تقديمي، وتقرا نصوص طويلة عن العاصمة الجديدة والغابات واستطلاع رأي، وتكتب مقال بوجهة نظرك، وتعمل عرض قصير وتجاوب في مقابلة.
    خد وقتك. النصوص هنا أطول، وعادي جدًا إنك ترجع تقرا الفقرة مرتين — كل إجابة بتورّينا نركّز على إيه.
    ولو جاي من «اركب الطيارة» عشان تعدّي BIPA 5، أهلًا بيك — نفس الأسئلة.
  ar: |
    جُبتَ كاليمانتان كلها من Balikpapan إلى Singkawang! ستستمع هنا إلى مقابلة عمل ونشرة وعرض تقديمي، وتقرأ نصوصًا طويلة عن العاصمة الجديدة والغابات واستطلاع رأي، وتكتب مقالًا يعرض وجهة نظرك، وتقدّم عرضًا قصيرًا وتجيب في مقابلة.
    خذ وقتك. النصوص هنا أطول، ومن الطبيعي أن تعيد قراءة الفقرة مرتين؛ فكل إجابة تُرينا ما نركّز عليه.
    وإن جئت من «سافر بالطائرة» لتتجاوز BIPA 5، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    You've crossed Kalimantan from Balikpapan to Singkawang! Here you'll hear a job interview, a news item and a presentation, read long texts on the new capital, the forests and an opinion poll, write a viewpoint essay, give a short presentation and answer interview questions.
    Take your time. The texts are longer here, and it's completely normal to read a paragraph twice; every answer shows us what to focus on.
    If you came through "Take a flight" to skip BIPA 5, welcome: these are the same questions.
minutes: 50
pass_mark: 0.7
scoring: >-
  Score = points earned / points available (closed items 1 point unless set;
  translate items are graded against reference answers first, then AI grade_answer;
  writing_task and speaking_task are graded by AI against their rubric, each
  criterion an equal share of the item's points). Pass at >= 0.7. Passing marks
  BIPA 5 complete and opens BIPA 6; the same rule applies when the test is taken
  as the "Take a flight" skip-ahead over BIPA 5. Below the mark, show the per-skill
  results and suggest the units behind the missed items, with no penalty and an
  open retry.
sections:
  - id: listening
    skill: listening
    title:
      ar_eg: الاستماع
      ar: الاستماع
      en: Listening
    instructions:
      ar_eg: أجزاء من مقابلة شغل، ونشرة عن الغابات، وعرض تقديمي، وكلام عادي بين صحاب. اسمع وعيد براحتك، وخد بالك من الكلمات اللي بتغيّر درجة اليقين أو الرسمية.
      ar: مقاطع من مقابلة عمل ونشرة عن الغابات وعرض تقديمي وحديث عاديّ بين أصدقاء. استمع وأعِد كما تشاء، وانتبه إلى الكلمات التي تغيّر درجة اليقين أو الرسمية.
      en: Parts of a job interview, a forest news item, a presentation and casual talk between friends. Listen, replay as you like, and watch for words that change how certain or how formal a sentence is.
    items:
      - id: t01
        type: listen
        text: Sehubungan dengan lowongan di perusahaan Bapak, saya bersedia mulai bekerja bulan depan.
        options:
          - Sehubungan dengan lowongan di perusahaan Bapak, saya bersedia mulai bekerja minggu depan.
          - Sehubungan dengan lowongan di perusahaan Bapak, saya bersedia mulai bekerja bulan depan.
          - Sehubungan dengan lowongan di perusahaan Bapak, saya belum bisa mulai bekerja bulan depan.
        answer: 1
        words: [sehubungan dengan, lowongan, bersedia]
      - id: t02
        type: listen
        text: Akibat kemarau panjang, ribuan hektare lahan gambut terbakar di Kalimantan Tengah.
        options:
          - Akibat kemarau panjang, ribuan hektare lahan gambut terbakar di Kalimantan Tengah.
          - Akibat kemarau panjang, ratusan hektare lahan gambut terbakar di Kalimantan Tengah.
          - Akibat hujan panjang, ribuan hektare lahan gambut kebanjiran di Kalimantan Tengah.
        answer: 0
        words: [kemarau, gambut, terbakar]
      - id: t03
        type: listen
        text: Tampaknya sebagian besar responden cenderung mendukung pemindahan ibu kota.
        options:
          - Sudah pasti semua responden mendukung pemindahan ibu kota.
          - Tampaknya sebagian besar responden cenderung menolak pemindahan ibu kota.
          - Tampaknya sebagian besar responden cenderung mendukung pemindahan ibu kota.
        answer: 2
        words: [tampaknya, cenderung, responden]
      - id: t04
        type: listen
        text: Pertama-tama, izinkan saya menyajikan hasil penelitian kami tentang pasar terapung.
        options:
          - Pertama-tama, izinkan saya menyajikan hasil penelitian kami tentang pasar terapung.
          - Sebagai penutup, izinkan saya menyajikan hasil penelitian kami tentang pasar terapung.
          - Pertama-tama, izinkan saya menyajikan hasil penelitian kami tentang perahu tradisional.
        answer: 0
        words: [pertama-tama, menyajikan, terapung]
      - id: t05
        type: listen
        text: Eh, kamu kepo banget, sih! Santai aja, nanti aku cerita.
        options:
          - Eh, kamu kepo banget, sih! Santai aja, besok aku cerita.
          - Eh, kamu sibuk banget, sih! Santai aja, nanti aku cerita.
          - Eh, kamu kepo banget, sih! Santai aja, nanti aku cerita.
        answer: 2
        words: [kepo, santai, bahasa gaul]
      - id: t06
        type: dictation
        text: Hutan adat harus dilestarikan oleh masyarakat adat dan pemerintah.
        meaning:
          ar_eg: الغابة العرفية لازم أهلها الأصليين والحكومة يحافظوا عليها.
          ar: يجب أن يحافظ المجتمع الأصلي والحكومة على الغابة العرفية.
          en: Customary forest must be preserved by the indigenous community and the government.
        words: [hutan adat, masyarakat adat, melestarikan]
      - id: t07
        type: dictation
        text: Pertunjukan tari itu sangat memukau penonton.
        meaning:
          ar_eg: عرض الرقص ده بهر الجمهور جدًا.
          ar: أبهر عرض الرقص ذلك الجمهور كثيرًا.
          en: That dance performance truly dazzled the audience.
        words: [pertunjukan, memukau, penonton]
  - id: reading
    skill: reading
    title:
      ar_eg: القراية
      ar: القراءة
      en: Reading
    instructions:
      ar_eg: اقرا المقال عن العاصمة الجديدة، والتقرير عن الغابة، ونتايج الاستطلاع. النصوص طويلة، فاقرا الأول للفكرة العامة وبعدين ارجع للتفاصيل. جاوب من اللي مكتوب، مش من رأيك.
      ar: اقرأ المقال عن العاصمة الجديدة والتقرير عن الغابة ونتائج الاستطلاع. النصوص طويلة، فاقرأ أوّلًا للفكرة العامة ثم عُد إلى التفاصيل، وأجب مما ورد فيها لا من رأيك.
      en: Read the article on the new capital, the forest report and the poll results. The texts are long, so read once for the gist, then go back for details. Answer from what they say, not from your own view.
    items:
      - id: t08
        type: multiple_choice
        question: |
          IBU KOTA BARU: HARAPAN DAN KEKHAWATIRAN (artikel ditulis untuk tes ini)
          Pemerintah memutuskan untuk memindahkan ibu kota dari Jakarta ke Kalimantan Timur. Alasan utamanya, Jakarta sudah terlalu padat, dan sebagian wilayahnya terancam tenggelam karena permukaan tanah terus turun. Selain itu, pemindahan ibu kota diharapkan dapat meratakan pembangunan di luar Pulau Jawa.
          Meskipun begitu, kebijakan ini tidak lepas dari kritik. Para kritikus khawatir bahwa biayanya terlalu besar bagi anggaran negara. Di sisi lain, para pegiat lingkungan berpendapat bahwa pembangunan kota baru dapat mengancam hutan dan satwa di sekitarnya. Masyarakat adat setempat juga meminta agar tanah mereka tidak diambil tanpa persetujuan.
          Dengan demikian, keberhasilan ibu kota baru tidak hanya diukur dari gedung-gedungnya, tetapi juga dari cara pemerintah mendengarkan semua pihak.
        question_meaning:
          ar_eg: على حسب المقال، إيه سببين لنقل العاصمة؟
          ar: ما السببان اللذان يذكرهما المقال لنقل العاصمة؟
          en: According to the article, what are two reasons for moving the capital?
        options:
          - Jakarta terlalu padat dan sebagian wilayahnya terancam tenggelam.
          - Biayanya murah dan hutan di Kalimantan sudah habis.
          - Masyarakat adat meminta ibu kota pindah ke tanah mereka.
        answer: 0
        words: [padat, tenggelam, pemindahan]
