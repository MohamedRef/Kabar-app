          en: Banjar cooking reflects the meeting of Malay, Javanese and Arab cultures.
        options: ["mencerminkan", "mencegah", "menukar"]
        answers: [mencerminkan]
        words: [mencerminkan]
  - id: grammar
    skill: grammar
    title:
      ar_eg: القواعد
      ar: القواعد
      en: Grammar
    items:
      - id: t22
        type: fill_blank
        sentence: Dengan ___, bersama surat ini saya ingin bertanya tentang syarat lowongan tersebut.
        meaning:
          ar_eg: مع خالص الاحترام، بالجواب ده حابب أسأل عن شروط الوظيفة دي.
          ar: مع فائق الاحترام، أودّ بهذه الرسالة أن أسأل عن شروط تلك الوظيفة.
          en: Respectfully, with this letter I would like to ask about the requirements for that vacancy.
        options: ["hormat", "santai", "gaul"]
        answers: [hormat]
        explain:
          ar_eg: «Dengan hormat» هي الفاتحة الرسمية للجوابات، و«santai» و«gaul» مالهمش مكان في جواب رسمي.
          ar: «Dengan hormat» افتتاحية الرسائل الرسمية، ولا مكان لـ«santai» و«gaul» في رسالة رسمية.
          en: '"Dengan hormat" is the standard opening of a formal letter; "santai" and "gaul" have no place in one.'
        words: [hormat]
      - id: t23
        type: fill_blank
        sentence: ___ biayanya besar, pemerintah tetap memindahkan ibu kota.
        meaning:
          ar_eg: رغم إن التكلفة كبيرة، الحكومة برضه نقلت العاصمة.
          ar: رغم ارتفاع التكلفة، مضت الحكومة في نقل العاصمة.
          en: Although the cost is high, the government is still moving the capital.
        options: ["Meskipun", "Karena", "Supaya"]
        answers: [Meskipun]
        explain:
          ar_eg: meskipun بتربط حاجتين عكس بعض (تنازل)، والجملة التانية فيها tetap.
          ar: meskipun أداة تنازل تربط أمرين متعارضين، وتأتي tetap غالبًا في الجملة الثانية.
          en: meskipun links two clashing facts (concession), often paired with tetap.
        words: [meskipun]
      - id: t24
        type: fill_blank
        sentence: ___ dompet digital di Samarinda meningkat pesat.
        meaning:
          ar_eg: استعمال المحافظ الرقمية في ساماريندا زاد بسرعة.
          ar: ازداد استخدام المحافظ الرقمية في ساماريندا بسرعة.
          en: The use of digital wallets in Samarinda has grown fast.
        options: ["Penggunaan", "Menggunakan", "Digunakan"]
        answers: [Penggunaan]
        explain:
          ar_eg: peN-…-an بتعمل اسم من الفعل (guna → penggunaan = الاستعمال)، وهو ده الفاعل هنا.
          ar: peN-…-an تشتقّ اسمًا من الفعل (guna ← penggunaan = الاستخدام)، وهو المبتدأ هنا.
          en: peN-…-an turns the verb into a noun (guna → penggunaan, use), which is the subject here.
        words: [penggunaan, pesat]
      - id: t25
        type: fill_blank
        sentence: Kepala sekolah ___ bahwa pendaftaran ditutup hari Jumat.
        meaning:
          ar_eg: الناظر قال إن التسجيل هيقفل يوم الجمعة.
          ar: قال المدير إنّ التسجيل يُغلق يوم الجمعة.
          en: The principal said that registration closes on Friday.
        options: ["mengatakan", "bertanya", "meminta"]
        answers: [mengatakan]
        explain:
          ar_eg: 'في الكلام المنقول: mengatakan bahwa = قال إن؛ bertanya apakah = سأل هل؛ meminta agar = طلب إن.'
          ar: 'في الكلام المنقول: mengatakan bahwa = قال إنّ، وbertanya apakah = سأل هل، وmeminta agar = طلب أن.'
          en: "In reported speech: mengatakan bahwa = said that; bertanya apakah = asked whether; meminta agar = asked to."
        words: [mengatakan, pendaftaran]
      - id: t26
        type: multiple_choice
        question_meaning:
          ar_eg: «Bu Guru berkata, "Kumpulkan tugasmu besok."» أنهي نقل صح للجملة؟
          ar: «Bu Guru berkata, "Kumpulkan tugasmu besok."» أيّ نقل صحيح؟
          en: '«Bu Guru berkata, "Kumpulkan tugasmu besok."» Which reported version is correct?'
        options:
          - Bu Guru bertanya apakah kami mengumpulkan tugas besok.
          - Bu Guru meminta agar kami mengumpulkan tugas keesokan harinya.
          - Bu Guru mengatakan bahwa ia mengumpulkan tugas besok.
        answer: 1
        words: [meminta]
      - id: t27
        type: fill_blank
        sentence: Rumah-rumah di tepi sungai itu ___ setelah hujan tiga hari.
        meaning:
          ar_eg: البيوت اللي على النهر غرقت بعد مطر تلات أيام.
          ar: غمر الفيضان البيوت على ضفة النهر بعد مطر ثلاثة أيام.
          en: The riverside houses were flooded after three days of rain.
        options: ["kebanjiran", "membanjiri", "dibanjirkan"]
        answers: [kebanjiran]
        explain:
          ar_eg: 'ke-…-an هنا معناها حاجة وحشة حصلت لحد من غير ما يقصد: kebanjiran = غرق، kehilangan = فقد.'
          ar: 'ke-…-an هنا تعني أمرًا سيّئًا أصاب الفاعل دون إرادته: kebanjiran = غمره الفيضان، kehilangan = فقد.'
          en: 'ke-…-an here means something bad happened to the subject: kebanjiran = got flooded, kehilangan = lost.'
        words: [kebanjiran]
      - id: t28
        type: fill_blank
        sentence: Lahan gambut itu ___ karena kemarau yang sangat panjang.
        meaning:
          ar_eg: أرض الخثّ دي اتحرقت بسبب الجفاف الطويل جدًا.
          ar: احترقت أرض الخثّ تلك بسبب الجفاف الطويل جدًّا.
          en: That peatland caught fire because of the very long dry season.
        options: ["terbakar", "membakar", "pembakaran"]
        answers: [terbakar]
        explain:
          ar_eg: 'ter- هنا لحاجة حصلت من غير فاعل مقصود: terbakar = اتحرق.'
          ar: 'ter- هنا لفعل وقع دون فاعل قاصد: terbakar = احترق.'
          en: 'ter- here marks something that happened with no deliberate agent: terbakar = caught fire.'
        words: [terbakar]
      - id: t29
        type: fill_blank
        sentence: Festival ini bertujuan ___ budaya Dayak kepada wisatawan.
        meaning:
          ar_eg: المهرجان ده هدفه يعرّف السيّاح بثقافة الداياك.
          ar: يهدف هذا المهرجان إلى تعريف السيّاح بثقافة الداياك.
          en: This festival aims to introduce Dayak culture to tourists.
        options: ["memperkenalkan", "berkenalan", "perkenalan"]
        answers: [memperkenalkan]
        explain:
          ar_eg: 'memper- بتعمل فعل متعدّي معناه «يخلّي الحاجة …»: kenal → memperkenalkan = يعرّف (حد بحاجة).'
          ar: 'memper- تصوغ فعلًا متعدّيًا بمعنى «يجعل …»: kenal ← memperkenalkan = يُعرّف.'
          en: 'memper- makes a transitive verb, "make something …": kenal → memperkenalkan, to introduce.'
        words: [memperkenalkan]
      - id: t30
        type: fill_blank
        sentence: Banjarmasin dikenal sebagai pusat ___ sejak zaman kerajaan.
        meaning:
          ar_eg: بنجرماسين معروفة إنها مركز تجارة من أيام الممالك.
          ar: تُعرف بنجرماسين بأنها مركز للتجارة منذ عهد الممالك.
          en: Banjarmasin has been known as a trading centre since the time of the kingdoms.
        options: ["perdagangan", "pedagang", "berdagang"]
        answers: [perdagangan]
        explain:
          ar_eg: 'per-…-an بتعمل اسم للنشاط أو المجال: dagang → perdagangan = التجارة.'
          ar: 'per-…-an تصوغ اسمًا للنشاط أو المجال: dagang ← perdagangan = التجارة.'
          en: 'per-…-an names the activity or field: dagang → perdagangan, trade.'
        words: [perdagangan]
      - id: t31
        type: multiple_choice
        question_meaning:
          ar_eg: أنهي جملة فيها تحفّظ (hedging) مناسب لتقرير استطلاع؟
          ar: أيّ جملة فيها تحوّط مناسب لتقرير استطلاع؟
          en: Which sentence hedges appropriately for a poll report?
        options:
          - Semua warga Martapura pasti setuju.
          - Tidak ada yang menolak, titik.
          - Tampaknya sebagian besar warga cenderung setuju.
        answer: 2
        words: [tampaknya, cenderung]
      - id: t32
        type: fill_blank
        sentence: Klaim itu ___ kalau tidak ada bukti dari sumber yang jelas.
        meaning:
          ar_eg: الادّعاء ده مش دقيق قوي لو مافيش دليل من مصدر واضح.
          ar: هذا الادّعاء غير دقيق إن لم يكن له دليل من مصدر واضح.
          en: That claim is not quite right if there's no evidence from a clear source.
        options: ["kurang tepat", "sangat tepat", "tepat sekali"]
        answers: [kurang tepat]
        explain:
          ar_eg: kurang tepat طريقة مهذّبة تقول بيها «غلط» من غير ما تجرح.
          ar: kurang tepat طريقة مهذّبة لقول «خطأ» دون جرح.
          en: kurang tepat is a polite way to say "wrong" without bluntness.
        words: [kurang tepat, klaim, bukti]
      - id: t33
        type: build_sentence
        source:
          ar_eg: بشكل عام، العرض كان مؤثّر، بس للأسف كان طويل شوية.
          ar: إجمالًا كان العرض مؤثّرًا، لكنّه للأسف طويل قليلًا.
          en: Overall, the show was moving, but unfortunately a little long.
        answer: Secara keseluruhan, pertunjukan itu berkesan, tetapi sayangnya agak panjang.
        distractors: [memukau, apalagi]
        words: [secara keseluruhan, berkesan, sayangnya]
  - id: writing
    skill: writing
    title:
      ar_eg: الكتابة
      ar: الكتابة
      en: Writing
    items:
      - id: t34
        type: translate
        direction: to_target
        source_meaning:
          ar_eg: رغم إن السوق العايم قديم، لسه الناس بتروحه كل صبح.
          ar: رغم قِدم السوق العائم، ما زال الناس يقصدونه كلّ صباح.
          en: Although the floating market is old, people still go there every morning.
        answers:
          - Meskipun pasar terapung itu sudah tua, orang-orang masih datang ke sana setiap pagi.
          - Meskipun pasar terapung itu sudah tua, orang-orang masih datang ke sana setiap pagi
          - Meskipun pasar terapung sudah tua, orang masih datang ke sana setiap pagi.
          - Meskipun pasar terapung sudah tua, orang masih datang ke sana setiap pagi
          - Walaupun pasar terapung itu sudah tua, orang-orang masih datang ke sana setiap pagi.
          - Walaupun pasar terapung sudah tua, orang masih datang ke sana setiap pagi.
          - Meskipun pasar terapung itu sudah lama, orang-orang masih datang ke sana setiap pagi.
          - Meskipun pasar terapung itu tua, orang-orang masih pergi ke sana setiap pagi.
          - Meskipun pasar terapung sudah tua, orang masih pergi ke sana setiap pagi.
          - Walaupun pasar terapung sudah tua, orang masih pergi ke sana setiap pagi.
          - Meskipun sudah tua, pasar terapung itu masih didatangi orang setiap pagi.
          - Orang-orang masih datang ke pasar terapung setiap pagi meskipun pasar itu sudah tua.
        words: [meskipun, terapung]
      - id: t35
        type: writing_task
        points: 6
        prompt:
          ar_eg: "اكتب مقال وجهة نظر، ٢٠٠–٢٨٠ كلمة، عن السؤال ده: 'المفروض زراعة نخيل الزيت تتوقّف جنب الغابات في كاليمانتان؟' اعرض وجهتين نظر على الأقل (مثلًا الفلاح والباحث أو أهل البلد الأصليين)، وبعدين قول رأيك بحذر (tampaknya، cenderung)، وهات دليل، واقفل بحل عملي."
          ar: "اكتب مقالًا يعرض وجهة نظر، من ٢٠٠ إلى ٢٨٠ كلمة، حول السؤال: 'هل ينبغي إيقاف زراعة نخيل الزيت قرب الغابات في كاليمانتان؟' اعرض وجهتي نظر على الأقل (كالمزارع والباحث أو المجتمع الأصلي)، ثم أبدِ رأيك بتحوّط (tampaknya، cenderung)، وقدّم دليلًا، واختم بحلّ عملي."
          en: "Write a viewpoint essay, 200–280 words, on the question: 'Should oil-palm planting stop near Kalimantan's forests?' Present at least two points of view (for example a farmer, a researcher or the indigenous community), then give your own view with hedging (tampaknya, cenderung), back it with evidence, and close with a practical solution."
        rubric:
          - Presents at least two distinct points of view fairly (dari sudut pandang …, di sisi lain …) before giving the writer's own.
          - States a hedged but clear position (tampaknya, cenderung, barangkali, menurut hemat saya) and supports it with evidence or an example.
          - Organises the essay with an introduction, body paragraphs linked by connectors (selain itu, meskipun begitu, dengan demikian) and a conclusion with a solution.
          - Uses BIPA 5 grammar and formal register accurately (peN-…-an and per-…-an nouns, ter- / ke-…-an passives, concessive clauses); 200–280 words.
        sample: |
          Hutan Kalimantan adalah paru-paru dunia, tetapi juga sumber penghasilan bagi jutaan orang. Oleh karena itu, pertanyaan tentang perluasan kebun sawit tidak bisa dijawab dengan "ya" atau "tidak" saja.
          Dari sudut pandang petani, sawit memberi penghasilan yang stabil. Banyak keluarga di desa dapat menyekolahkan anak mereka berkat kebun sawit. Bagi mereka, larangan total berarti kehilangan pekerjaan.
          Di sisi lain, para peneliti mencatat bahwa pembukaan lahan di dekat hutan membuat satwa seperti orang utan kehilangan tempat tinggal. Selain itu, lahan gambut yang dikeringkan untuk kebun mudah terbakar pada musim kemarau, sehingga asapnya mengganggu kesehatan warga.
          Masyarakat adat juga memiliki pendapat sendiri. Mereka sudah menjaga hutan adat selama ratusan tahun, dan mereka meminta agar tanah mereka tidak diambil tanpa persetujuan.
          Menurut hemat saya, tampaknya perluasan kebun sawit di dekat taman nasional sebaiknya dihentikan, meskipun kebun yang sudah ada tidak perlu ditutup. Pengalaman di Tanjung Puting menunjukkan bahwa hutan yang rusak sulit dipulihkan.
          Dengan demikian, solusi yang paling adil adalah memperbaiki produktivitas kebun yang sudah ada, memberi pelatihan kepada petani, dan melibatkan masyarakat adat dalam menjaga hutan. Dengan cara itu, penghasilan petani tetap terjaga, dan hutan Kalimantan tidak punah.
        words: [sudut pandang, di sisi lain, tampaknya]
  - id: speaking
    skill: speaking
    title:
      ar_eg: الكلام
      ar: المحادثة
      en: Speaking
    instructions:
      ar_eg: هنا هتجاوب في مقابلة شغل وتعمل عرض قصير. اتكلم بشكل طبيعي؛ المهم الكلام يبقى مترتّب والأسلوب يناسب الموقف، مش إن كل كلمة تبقى مثالية.
      ar: ستجيب هنا في مقابلة عمل وتقدّم عرضًا قصيرًا. تكلّم بشكل طبيعي؛ المهم أن يكون الكلام مرتّبًا والأسلوب ملائمًا للموقف، لا أن تكون كل كلمة مثالية.
      en: Here you'll answer in a job interview and give a short presentation. Speak naturally; what matters is a well-ordered answer in the right register, not every word being perfect.
    items:
      - id: t36
        type: speaking
        text: Hadirin yang saya hormati, pertama-tama izinkan saya menyajikan hasil kunjungan kami ke Singkawang.
        meaning:
          ar_eg: الحضور الكرام، في الأول اسمحولي أعرض نتايج زيارتنا لسينجكاوانج.
          ar: أيها الحضور الكرام، اسمحوا لي أوّلًا أن أعرض نتائج زيارتنا إلى سينغكاوانغ.
          en: Distinguished audience, first of all let me present the results of our visit to Singkawang.
        words: [hadirin, pertama-tama, menyajikan, kunjungan]
      - id: t37
        type: speaking_task
        points: 4
        prompt:
          ar_eg: "إنت في مقابلة شغل في شركة سياحة في بالكبابان. المدير بيسألك: 'Apa kelebihan dan kekurangan Anda, dan mengapa Anda berminat bekerja di sini?' جاوب حوالي دقيقتين بأسلوب رسمي: اذكر ميزة بمثال، وعيب وإزاي بتشتغل عليه، وسبب اهتمامك بالشغل."
          ar: "أنت في مقابلة عمل لدى شركة سياحة في باليكبابان، ويسألك المدير: 'Apa kelebihan dan kekurangan Anda, dan mengapa Anda berminat bekerja di sini?' أجب نحو دقيقتين بأسلوب رسمي: اذكر ميزة بمثال، وعيبًا وكيف تعالجه، وسبب رغبتك في العمل."
          en: "You're in a job interview at a travel company in Balikpapan. The manager asks: 'Apa kelebihan dan kekurangan Anda, dan mengapa Anda berminat bekerja di sini?' Answer for about two minutes in formal register: name a strength with an example, a weakness and how you work on it, and why you want the job."
        rubric:
          - Keeps a formal interview register throughout (saya, Bapak/Ibu, no slang).
          - Names a strength with a concrete example from experience (pengalaman, keahlian).
          - Names a real weakness and how it is being improved, without turning it into a disguised boast.
          - Gives a clear, specific reason for wanting the job (berminat, karena …), spoken fluently enough to follow.
        sample: |
          Terima kasih atas pertanyaannya, Pak. Kelebihan saya adalah kemampuan berkomunikasi dengan orang dari berbagai negara. Misalnya, ketika saya bekerja di sebuah hotel di Kairo, saya sering membantu tamu dari Malaysia dan Indonesia, sehingga bahasa Indonesia saya makin lancar.
          Adapun kekurangan saya, saya kadang terlalu lama memeriksa pekerjaan sendiri. Sekarang saya belajar membuat daftar prioritas supaya pekerjaan selesai tepat waktu.
          Saya berminat bekerja di perusahaan Bapak karena perusahaan ini memperkenalkan wisata hutan dan sungai Kalimantan kepada wisatawan dari Timur Tengah. Saya yakin pengalaman dan bahasa Arab saya dapat membantu.
        words: [kelebihan, kekurangan, berminat]
      - id: t38
        type: speaking_task
        points: 6
        prompt:
          ar_eg: "اعمل عرض تقديمي حوالي ٣ دقايق بعنوان 'Pasar terapung: tradisi yang harus dilestarikan?' ابدأ بتحية الحضور وخطّة العرض، اعرض معلومة أو رقمين (ممكن تخترعهم وتقول إنها أمثلة)، واذكر رأي مختلف، واقفل بخلاصة وسؤال للجمهور."
          ar: "قدّم عرضًا مدّته نحو ثلاث دقائق بعنوان 'Pasar terapung: tradisi yang harus dilestarikan?' ابدأ بتحية الحضور وخطّة العرض، واعرض معلومة أو رقمين (يجوز أن تؤلّفهما وتقول إنهما مثالان)، واذكر رأيًا مخالفًا، واختم بخلاصة وسؤال للجمهور."
          en: "Give a presentation of about 3 minutes titled 'Pasar terapung: tradisi yang harus dilestarikan?' Open by greeting the audience and outlining the talk, present a fact or two figures (you may invent them and say they're examples), mention a different view, and close with a summary and a question for the audience."
        rubric:
          - Uses presentation structure and signposts (hadirin yang saya hormati, pertama-tama, selanjutnya, sebagai penutup).
          - Presents information or figures clearly (jumlah, meningkat, menurun, rata-rata) and labels any invented numbers as examples.
          - Acknowledges a different view and responds to it (di sisi lain, meskipun begitu).
          - Speaks fluently and audibly in formal register, ending with a summary and an audience question.
        sample: |
          Hadirin yang saya hormati, selamat pagi. Pertama-tama, terima kasih atas kesempatan ini. Presentasi saya terdiri atas tiga bagian, yaitu sejarah pasar terapung, keadaannya sekarang, dan saran untuk masa depan.
          Pasar terapung di Banjarmasin sudah ada sejak zaman kerajaan. Pedagang menjual sayur, buah, dan kue dari atas perahu. Sebagai contoh saja, misalkan dahulu ada seratus perahu setiap pagi, sekarang mungkin hanya separuhnya. Jumlah pedagang cenderung menurun karena anak muda lebih suka bekerja di kota.
          Di sisi lain, ada yang berpendapat bahwa pasar terapung tidak perlu dipertahankan, karena pasar modern lebih bersih dan praktis. Meskipun begitu, menurut saya pasar terapung bukan sekadar tempat berbelanja, melainkan identitas masyarakat Banjar.
          Sebagai penutup, saya menyarankan agar pemerintah membantu pedagang lewat promosi wisata dan pelatihan. Terima kasih. Pertanyaan saya untuk Bapak dan Ibu, kapan terakhir kali Anda berbelanja di atas perahu?
        words: [hadirin, sebagai penutup, terapung]
