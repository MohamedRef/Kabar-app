      - id: t11
        type: multiple_choice
        question: |
          LAPORAN DARI TANJUNG PUTING (laporan ditulis untuk tes ini)
          Taman Nasional Tanjung Puting dikenal sebagai rumah bagi orang utan. Sayangnya, hutan di sekitarnya terus berkurang. Sebagian lahan dibuka untuk perkebunan sawit, dan sebagian lagi terbakar pada musim kemarau. Akibatnya, orang utan kehilangan tempat tinggal, dan beberapa di antaranya ditemukan masuk ke kebun warga.
          Dari sudut pandang petani, sawit adalah sumber penghasilan yang penting. Namun, para peneliti menyarankan agar perluasan kebun dihentikan di dekat taman nasional. Mereka juga mengajak masyarakat adat untuk menjaga hutan, karena merekalah yang paling mengenal wilayah itu.
        question_meaning:
          ar_eg: ليه بعض إنسان الغاب دخلوا جناين الأهالي؟
          ar: لماذا دخل بعض إنسان الغاب إلى بساتين الأهالي؟
          en: Why have some orangutans wandered into residents' gardens?
        options:
          - لأنهم فقدوا بيتهم بسبب قطع الغابة والحرايق.
          - لأن الأهالي بيأكّلوهم.
          - لأن المنتزه الوطني اتقفل.
        answer: 0
        words: [kehilangan, terbakar, perkebunan]
