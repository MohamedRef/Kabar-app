      ar: تكلّم بارتياح. المهم أن يفهمك السامع، لا أن تكون مثاليًّا.
      en: Speak at ease. What matters is that a listener understands you, not perfection.
    items:
      - id: t34
        type: speaking
        text: Kamar saya kecil, tetapi bersih dan nyaman.
        meaning:
          ar_eg: أوضتي صغيرة، بس نضيفة ومريحة.
          ar: غرفتي صغيرة، لكنها نظيفة ومريحة.
          en: My room is small, but clean and comfortable.
        words: [kamar, bersih, nyaman]
      - id: t35
        type: speaking_task
        points: 4
        prompt:
          ar_eg: "اتكلم حوالي ٢–٣ دقايق عن البيت والحتة اللي عايش فيها: فيها إيه، إيه اللي جنبك، وإيه اللي بتحبه أو مضايقك. وقول إنت حاسس بإيه وإنت عايش هناك."
          ar: "تحدّث نحو دقيقتين أو ثلاث عن بيتك والحيّ الذي تسكن فيه: ماذا يوجد فيه، وما القريب منك، وما الذي تحبه أو يزعجك، وكيف تشعر وأنت تعيش هناك."
          en: Talk for about 2–3 minutes about your home and neighbourhood — what's in it, what's near you, what you like or dislike — and how you feel living there.
        rubric:
          - Describes rooms and nearby places with location words (di sebelah, di depan, dekat, di antara).
          - Expresses feelings and opinions with reasons (senang, nyaman, sedih … karena …).
          - Uses BIPA 2 structures (compound nouns, classifiers, comparison, tolong / silakan where natural).
          - Speaks in connected sentences a patient listener follows; pauses are fine.
        sample: |
          Saya tinggal di sebuah kos kecil di Sanur. Di kos saya ada satu kamar tidur, satu kamar mandi, dan dapur kecil.
          Di sebelah kos ada warung Bu Sari, dan di depannya ada masjid. Pantai juga dekat, hanya lima menit jalan kaki.
          Saya suka lingkungan ini karena tetangga saya ramah dan udaranya segar. Tetapi kadang-kadang jalannya ramai sekali dan berisik.
          Kamar saya lebih kecil daripada kamar saya di Kairo, tetapi saya merasa senang dan nyaman di sini.
        words: [lingkungan, tinggal, senang]
