      - id: t33
        type: writing_task
        points: 4
        prompt:
          ar_eg: احكي عن إجازة قضّيتها (٦–٨ جمل). رحت فين ومع مين، ركبت إيه، عملت إيه بالترتيب، وكنت حاسس بإيه.
          ar: "اكتب عن عطلة قضيتها (٦–٨ جمل): إلى أين ذهبت ومع من، وبماذا تنقّلت، وماذا فعلت بالترتيب، وبماذا شعرت."
          en: Write about a holiday you had (6–8 sentences). Where you went and with whom, how you travelled, what you did in order, and how you felt.
        rubric:
          - Tells events in a clear order with sequence words (pertama, lalu, kemudian, akhirnya, ketika).
          - Says where, when, with whom and by what transport.
          - Describes feelings and scenery with fitting adjectives (senang, capek, indah, ramai …).
          - Uses BIPA 2 grammar with mostly correct forms (ber- / meN- verbs, comparison, sudah / pernah, time words); 6–8 sentences.
        sample: |
          Bulan lalu saya berlibur ke Lovina bersama dua teman. Pertama, kami naik bus dari Denpasar, lalu kami naik ojek ke hotel.
          Pagi-pagi sekali kami naik perahu untuk melihat lumba-lumba. Lautnya tenang dan langitnya indah sekali.
          Siangnya kami makan ikan bakar di warung dekat pantai. Ikannya lebih enak daripada ikan di Jakarta!
          Akhirnya, sore hari kami berenang. Saya capek, tetapi saya senang sekali.
        words: [berlibur, pertama, lalu, akhirnya]
