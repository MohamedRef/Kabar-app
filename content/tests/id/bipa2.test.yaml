schema: kabar.test/v1
id: bipa2.test
language: id
kind: level
title:
  ar_eg: اختبار مستوى BIPA 2 — بالي
  ar: اختبار مستوى BIPA 2 — بالي
  en: BIPA 2 level test — Bali
intro:
  ar_eg: |
    لفّيت بالي كلها، من Ubud لحد Amed! هنا هتسمع إعلانات وحوارات في السوق والمواصلات، وتقرا وصفة وورقة دوا، وتحكي عن إجازة، وتتكلم عن المكان اللي عايش فيه وإحساسك فيه.
    خد وقتك، ومفيش حاجة اسمها غلطة تكسفك هنا — كل إجابة بتورّينا نركّز على إيه.
    ولو جاي من «اركب الطيارة» عشان تعدّي BIPA 2، أهلًا بيك — نفس الأسئلة.
  ar: |
    جُبتَ بالي كلها من Ubud إلى Amed! ستستمع هنا إلى إعلانات وحوارات في السوق والمواصلات، وتقرأ وصفة طعام ونشرة دواء، وتكتب عن عطلة، وتتحدث عن المكان الذي تعيش فيه ومشاعرك فيه.
    خذ وقتك؛ لا خطأ هنا يُحرجك، فكل إجابة تُرينا ما نركّز عليه.
    وإن جئت من «سافر بالطائرة» لتتجاوز BIPA 2، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    You've travelled all of Bali, from Ubud to Amed! Here you'll hear announcements and market and transport talk, read a recipe and a medicine label, write about a holiday, and talk about where you live and how you feel there.
    Take your time; no mistake here is embarrassing, and every answer shows us what to focus on.
    If you came through "Take a flight" to skip BIPA 2, welcome: these are the same questions.
minutes: 35
pass_mark: 0.75
scoring: >-
  Score = points earned / points available (closed items 1 point unless set;
  translate items are graded against reference answers first, then AI grade_answer;
  writing_task and speaking_task are graded by AI against their rubric, each
  criterion an equal share of the item's points). Pass at >= 0.75. Passing marks
  BIPA 2 complete and opens BIPA 3; the same rule applies when the test is taken
  as the "Take a flight" skip-ahead over BIPA 2. Below the mark, show the per-skill
  results and suggest the units behind the missed items, with no penalty and an
  open retry.
