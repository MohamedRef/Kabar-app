          ar_eg: كارتيني مش مصباح بجد؛ الجملة بتشبّهها بالنور من غير "زي" (seperti) — دي استعارة.
          ar: ليست كارتيني مصباحًا حقيقيًّا؛ فالجملة تشبّهها بالنور دون أداة تشبيه (seperti)، وهذه استعارة.
          en: Kartini isn't literally a lamp; the sentence compares her to light without "like" (seperti), which makes it a metaphor.
