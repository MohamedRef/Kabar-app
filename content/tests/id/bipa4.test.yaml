          ar: peN-…-an تصوغ اسمًا للعملية (pemeriksaan = الفحص)، وpeN- وحدها للفاعل (pemeriksa = الفاحص).
          en: peN-…-an names the process (pemeriksaan = examination); peN- alone names the person (pemeriksa = examiner).
