          - Pariwisata memang meningkatkan pendapatan warga; oleh karena itu, alam pasti tetap terjaga.
          - Pariwisata memang meningkatkan pendapatan warga; namun, tanpa pengelolaan yang baik, alam bisa rusak.
        answer: 2
