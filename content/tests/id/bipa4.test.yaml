        explain:
          ar_eg: الصوت مش هيشق السما بجد — دي مبالغة. الجملة الأولى تشبيه (seperti)، والتالتة وصف عادي.
          ar: لا يشقّ الصوت السماء حقًّا؛ فهذه مبالغة. أما الأولى فتشبيه (seperti)، والثالثة وصف مباشر.
          en: A sound can't really split the sky; that's hyperbole. The first is a simile (seperti); the third is plain description.
