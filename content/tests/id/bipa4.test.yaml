schema: kabar.test/v1
id: bipa4.test
language: id
kind: level
title:
  ar_eg: اختبار مستوى BIPA 4 — سولاويسي
  ar: اختبار مستوى BIPA 4 — سولاويسي
  en: BIPA 4 level test — Sulawesi
intro:
  ar_eg: |
    لفّيت سولاويسي كلها، من Makassar لحد Tomohon! هنا هتسمع أجزاء من محاضرات ونشرات فيها حجج، وتقرا خبر أونلاين ورسالة قارئ لجريدة وحكاية شعبية، وتكتب مقال رأي، وتقول رأيك في قضية من غير تحضير.
    خد وقتك. المستوى ده أصعب، وعادي جدًا إنك تقف عند كلمة أو اتنين — كل إجابة بتورّينا نركّز على إيه.
    ولو جاي من «اركب الطيارة» عشان تعدّي BIPA 4، أهلًا بيك — نفس الأسئلة.
  ar: |
    جُبتَ سولاويسي كلها من Makassar إلى Tomohon! ستستمع هنا إلى مقاطع من محاضرات ونشرات فيها حجج، وتقرأ خبرًا إلكترونيًّا ورسالة قارئ إلى صحيفة وحكاية شعبية، وتكتب مقالًا عرضيًّا، وتعبّر عن رأيك في قضية دون تحضير.
    خذ وقتك. هذا المستوى أصعب، ومن الطبيعي أن تتوقف عند كلمة أو كلمتين؛ فكل إجابة تُرينا ما نركّز عليه.
    وإن جئت من «سافر بالطائرة» لتتجاوز BIPA 4، فأهلًا بك؛ الأسئلة نفسها.
  en: |
    You've crossed Sulawesi from Makassar to Tomohon! Here you'll hear parts of talks and news with an argument in them, read an online news story, a letter to the editor and a folk tale, write an exposition, and give your view on an issue on the spot.
    Take your time. This level is harder, and it's completely normal to pause on a word or two; every answer shows us what to focus on.
    If you came through "Take a flight" to skip BIPA 4, welcome: these are the same questions.
minutes: 45
pass_mark: 0.7
scoring: >-
  Score = points earned / points available (closed items 1 point unless set;
  translate items are graded against reference answers first, then AI grade_answer;
  writing_task and speaking_task are graded by AI against their rubric, each
  criterion an equal share of the item's points). Pass at >= 0.7. Passing marks
  BIPA 4 complete and opens BIPA 5; the same rule applies when the test is taken
  as the "Take a flight" skip-ahead over BIPA 4. Below the mark, show the per-skill
  results and suggest the units behind the missed items, with no penalty and an
  open retry.
sections:
  - id: listening
    skill: listening
    title:
      ar_eg: الاستماع
      ar: الاستماع
      en: Listening
    instructions:
      ar_eg: أجزاء من محاضرة عن الصحة، وندوة عن السياحة، ونشرة أخبار، وافتتاح خطبة. اسمع، وعيد براحتك، وركّز على الحجة نفسها — الفرق بين الاختيارات ساعات كلمة واحدة بتقلب المعنى.
      ar: مقاطع من محاضرة صحية وندوة عن السياحة ونشرة أخبار وافتتاحية خطاب. استمع وأعِد كما تشاء، وركّز على الحجة نفسها؛ فقد تقلب كلمة واحدة المعنى بين الخيارات.
      en: Parts of a health lecture, a tourism panel, a news bulletin and a speech opening. Listen, replay as you like, and follow the argument itself; sometimes one word between the options flips the meaning.
