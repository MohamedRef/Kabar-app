  - id: reading
    skill: reading
    title:
      ar_eg: القراية
      ar: القراءة
      en: Reading
    instructions:
      ar_eg: اقرا الخبر الأونلاين، ورسالة القارئ، والحكاية، وجاوب من اللي مكتوب — مش من رأيك.
      ar: اقرأ الخبر الإلكتروني ورسالة القارئ والحكاية، وأجب مما ورد فيها لا من رأيك.
      en: Read the online news story, the reader's letter and the tale, and answer from what they say, not from your own view.
    items:
      - id: t08
        type: multiple_choice
        question: |
          MAKASSAR, KABAR.ID — Pemerintah Kota Makassar resmi melarang penggunaan kantong plastik sekali pakai di pusat perbelanjaan mulai 1 Juli. Menurut dinas lingkungan hidup setempat, ratusan ton sampah plastik dihasilkan kota itu setiap hari, dan sebagian besar berakhir di laut. Oleh karena itu, toko-toko diwajibkan menyediakan tas belanja yang dapat dipakai ulang.
          Kebijakan ini mendapat tanggapan beragam. Sebagian warga mendukungnya karena pantai menjadi lebih bersih. Namun, beberapa pedagang kecil mengeluh bahwa harga tas pengganti terlalu mahal bagi mereka. Pemerintah berjanji akan membagikan tas kain gratis kepada pedagang di pasar tradisional.
        question_meaning:
          ar_eg: الخبر ده أساسًا عن إيه؟
          ar: عمّ يتحدث هذا الخبر أساسًا؟
          en: What is this news story mainly about?
        options:
          - Makassar membangun pasar tradisional baru.
          - Makassar melarang kantong plastik sekali pakai di pusat perbelanjaan.
          - Pedagang kecil menolak semua aturan pemerintah.
        answer: 1
        words: [melarang, kebijakan, sekali pakai]
      - id: t09
        type: multiple_choice
        question: |
          MAKASSAR, KABAR.ID — Pemerintah Kota Makassar resmi melarang penggunaan kantong plastik sekali pakai di pusat perbelanjaan mulai 1 Juli. Menurut dinas lingkungan hidup setempat, ratusan ton sampah plastik dihasilkan kota itu setiap hari, dan sebagian besar berakhir di laut. Oleh karena itu, toko-toko diwajibkan menyediakan tas belanja yang dapat dipakai ulang.
          Kebijakan ini mendapat tanggapan beragam. Sebagian warga mendukungnya karena pantai menjadi lebih bersih. Namun, beberapa pedagang kecil mengeluh bahwa harga tas pengganti terlalu mahal bagi mereka. Pemerintah berjanji akan membagikan tas kain gratis kepada pedagang di pasar tradisional.
        question_meaning:
          ar_eg: ليه بعض التجار الصغيرين بيشتكوا؟
          ar: لماذا يشتكي بعض صغار التجار؟
          en: Why are some small traders complaining?
        options:
          - Pembeli tidak mau datang lagi.
          - Pantai menjadi kotor.
          - Harga tas pengganti terlalu mahal bagi mereka.
        answer: 2
        words: [mengeluh, pengganti]
      - id: t10
        type: multiple_choice
        question: |
          MAKASSAR, KABAR.ID — Pemerintah Kota Makassar resmi melarang penggunaan kantong plastik sekali pakai di pusat perbelanjaan mulai 1 Juli. Menurut dinas lingkungan hidup setempat, ratusan ton sampah plastik dihasilkan kota itu setiap hari, dan sebagian besar berakhir di laut. Oleh karena itu, toko-toko diwajibkan menyediakan tas belanja yang dapat dipakai ulang.
          Kebijakan ini mendapat tanggapan beragam. Sebagian warga mendukungnya karena pantai menjadi lebih bersih. Namun, beberapa pedagang kecil mengeluh bahwa harga tas pengganti terlalu mahal bagi mereka. Pemerintah berjanji akan membagikan tas kain gratis kepada pedagang di pasar tradisional.
        question_meaning:
          ar_eg: الحكومة وعدت بإيه؟
          ar: بماذا وعدت الحكومة؟
          en: What has the government promised?
        options:
          - membagikan tas kain gratis kepada pedagang pasar tradisional
          - menurunkan harga kantong plastik
          - menutup pusat perbelanjaan pada bulan Juli
        answer: 0
        words: [berjanji, membagikan]
      - id: t11
        type: multiple_choice
        question: |
          Redaksi Yth.,
          Saya warga Maros yang setiap hari melewati jalan poros Maros–Bantimurung. Sudah enam bulan jalan itu rusak parah. Lubang-lubangnya besar dan dalam sehingga sudah beberapa kali terjadi kecelakaan sepeda motor. Ketika hujan, lubang-lubang itu tertutup air dan tidak terlihat.
          Kami sudah bolak-balik melapor ke kantor kelurahan, tetapi sampai sekarang belum ada tindakan. Saya memahami bahwa anggaran daerah terbatas. Akan tetapi, keselamatan warga seharusnya menjadi prioritas.
          Melalui surat ini, saya mohon agar dinas pekerjaan umum segera memperbaiki jalan tersebut sebelum musim hujan tiba.
          Andi, warga Maros
        question_meaning:
          ar_eg: الكاتب كاتب الرسالة دي ليه أساسًا؟
          ar: ما الغرض الأساسي من هذه الرسالة؟
          en: What is the writer's main purpose?
        options:
          - memuji kerja pemerintah daerah
          - mengajak warga berwisata ke Bantimurung
          - meminta agar jalan itu segera diperbaiki
        answer: 2
        words: [surat pembaca, memperbaiki]
      - id: t12
        type: multiple_choice
        question: |
          Redaksi Yth.,
          Saya warga Maros yang setiap hari melewati jalan poros Maros–Bantimurung. Sudah enam bulan jalan itu rusak parah. Lubang-lubangnya besar dan dalam sehingga sudah beberapa kali terjadi kecelakaan sepeda motor. Ketika hujan, lubang-lubang itu tertutup air dan tidak terlihat.
          Kami sudah bolak-balik melapor ke kantor kelurahan, tetapi sampai sekarang belum ada tindakan. Saya memahami bahwa anggaran daerah terbatas. Akan tetapi, keselamatan warga seharusnya menjadi prioritas.
          Melalui surat ini, saya mohon agar dinas pekerjaan umum segera memperbaiki jalan tersebut sebelum musim hujan tiba.
          Andi, warga Maros
        question_meaning:
          ar_eg: حسب الرسالة، ليه الطريق أخطر وقت المطر؟
          ar: بحسب الرسالة، لماذا يكون الطريق أخطر عند المطر؟
          en: According to the letter, why is the road more dangerous when it rains?
        options:
          - Banyak pohon tumbang ke jalan.
          - Lubang-lubangnya tertutup air dan tidak terlihat.
          - Jalannya ditutup oleh polisi.
        answer: 1
        words: [tertutup, terlihat]
      - id: t13
        type: multiple_choice
        question: |
          Saya memahami bahwa anggaran daerah terbatas. Akan tetapi, keselamatan warga seharusnya menjadi prioritas.
        question_meaning:
          ar_eg: الكاتب بيعمل إيه في الجملتين دول من الرسالة؟
          ar: ماذا يفعل الكاتب في هاتين الجملتين من الرسالة؟
          en: What is the writer doing in these two sentences from the letter?
        options:
          - Ia mengakui alasan pihak lain, lalu tetap mempertahankan pendapatnya.
          - Ia mengubah pendapatnya karena anggaran terbatas.
          - Ia menyalahkan warga yang mengendarai sepeda motor.
        answer: 0
        explain:
          ar_eg: "ده أسلوب \"تنازل وبعدين رد\": بيعترف إن الميزانية محدودة، وبـ \"Akan tetapi\" بيرجع يأكد رأيه."
          ar: "هذا أسلوب \"التسليم ثم الاستدراك\": يعترف بمحدودية الميزانية، ثم يعود بـ \"Akan tetapi\" ليؤكد رأيه."
          en: "This is concede-then-counter: he grants that the budget is limited, then with Akan tetapi he restates his view."
        words: [memahami, akan tetapi, prioritas]
      - id: t14
        type: multiple_choice
        question: |
          JUHA DAN KELEDAINYA (dongeng dari Mesir)
          Pada suatu pagi yang panas, Juha dan anak laki-lakinya pergi ke pasar bersama seekor keledai tua milik mereka. Mula-mula Juha menunggang keledai itu, sedangkan anaknya berjalan kaki. Orang-orang di jalan berkata, "Ayah yang tidak punya hati! Anaknya yang masih kecil dibiarkan berjalan."
          Juha pun turun dan menyuruh anaknya naik. Tidak lama kemudian, orang lain berkata, "Anak yang tidak sopan! Ayahnya yang sudah tua dibiarkan berjalan."
          Akhirnya, mereka berdua berjalan kaki di samping keledai itu. Orang-orang tertawa, "Lihat dua orang bodoh itu! Punya keledai, tetapi tidak dinaiki."
          Juha tersenyum dan berkata kepada anaknya, "Nak, apa pun yang kita lakukan, selalu ada orang yang berkomentar."
        question_meaning:
          ar_eg: إيه العبرة (amanat) من الحكاية دي؟
          ar: ما العبرة (amanat) من هذه الحكاية؟
          en: What is the moral (amanat) of this tale?
        options:
          - Orang tua harus selalu berjalan kaki.
          - Kita tidak mungkin menyenangkan semua orang.
          - Keledai tua tidak boleh dinaiki.
        answer: 1
        words: [amanat, menyenangkan]
      - id: t15
        type: multiple_choice
        question: |
          JUHA DAN KELEDAINYA (dongeng dari Mesir)
          Pada suatu pagi yang panas, Juha dan anak laki-lakinya pergi ke pasar bersama seekor keledai tua milik mereka. Mula-mula Juha menunggang keledai itu, sedangkan anaknya berjalan kaki. Orang-orang di jalan berkata, "Ayah yang tidak punya hati! Anaknya yang masih kecil dibiarkan berjalan."
          Juha pun turun dan menyuruh anaknya naik. Tidak lama kemudian, orang lain berkata, "Anak yang tidak sopan! Ayahnya yang sudah tua dibiarkan berjalan."
          Akhirnya, mereka berdua berjalan kaki di samping keledai itu. Orang-orang tertawa, "Lihat dua orang bodoh itu! Punya keledai, tetapi tidak dinaiki."
          Juha tersenyum dan berkata kepada anaknya, "Nak, apa pun yang kita lakukan, selalu ada orang yang berkomentar."
        question_meaning:
          ar_eg: إيه الخلفية (latar) بتاعة الحكاية — المكان والوقت؟
          ar: ما الخلفية (latar) في الحكاية، أي المكان والزمان؟
          en: What is the setting (latar) of the tale, place and time?
        options:
          - di rumah Juha pada malam hari
          - di pasar ikan pada sore hari
          - di jalan menuju pasar pada suatu pagi yang panas
        answer: 2
        words: [latar, unsur intrinsik]
