          - Yang terhormat Bapak Gubernur Sulawesi Utara, para tamu undangan, dan hadirin yang berbahagia.
          - Yang terhormat Bapak Wali Kota Tomohon, para guru, dan anak-anak yang berbahagia.
          - Yang terhormat Bapak Wali Kota Tomohon, para tamu undangan, dan hadirin yang berbahagia.
        answer: 2
        words: [yang terhormat, hadirin]
