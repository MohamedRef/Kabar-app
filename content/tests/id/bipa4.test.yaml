        text: Banyak wisatawan terpesona oleh keindahan Tana Toraja.
        meaning:
          ar_eg: سياح كتير بيتسحروا بجمال تانا توراجا.
          ar: كثير من السياح يُفتنون بجمال تانا توراجا.
