      - id: t04
        type: listen
        text: Larangan kantong plastik bukan sekadar aturan, melainkan langkah untuk menyelamatkan laut kita.
        options:
          - Larangan kantong plastik hanyalah aturan, bukan langkah untuk menyelamatkan laut kita.
          - Larangan kantong plastik bukan sekadar aturan, melainkan langkah untuk menyelamatkan laut kita.
