      - id: t35
        type: writing_task
        points: 6
        prompt:
          ar_eg: "اكتب مقال عرض رأي (eksposisi)، ١٨٠–٢٥٠ كلمة، عن السؤال ده: 'هل السياحة في Tana Toraja نافعة لأهلها أكتر ما هي ضارة؟' ابدأ برأيك (tesis)، وهات حجتين على الأقل بأمثلة، واعرض رأي مخالف وردّ عليه، واقفل بخلاصة واقتراح."
          ar: "اكتب مقالًا عرضيًّا (eksposisi) من ١٨٠ إلى ٢٥٠ كلمة حول السؤال: 'هل تنفع السياحة في Tana Toraja أهلها أكثر مما تضرّهم؟' ابدأ برأيك (tesis)، وقدّم حجتين على الأقل بأمثلة، واعرض رأيًا مخالفًا وردّ عليه، واختم بخلاصة واقتراح."
          en: "Write an exposition (eksposisi), 180–250 words, on the question: 'Does tourism in Tana Toraja help local people more than it harms them?' Open with your thesis, give at least two arguments with examples, present and answer an opposing view, and close with a conclusion and a recommendation."
        rubric:
          - "Follows the exposition structure: tesis → argumen (at least two, with examples) → penegasan ulang / conclusion."
          - Presents an opposing view fairly and answers it (memang …, namun …; meskipun …).
          - Links ideas with cause–effect and contrast connectors (akibatnya, oleh karena itu, sehingga, namun, bukan hanya … melainkan juga).
          - Uses BIPA 4 grammar and register accurately (meN-…-kan / meN-…-i, peN-…-an and ke-…-an nouns, natural collocations); 180–250 words in formal Indonesian.
        sample: |
          Menurut saya, pariwisata di Tana Toraja lebih banyak membawa manfaat daripada kerugian, asalkan dikelola dengan baik.
          Pertama, pariwisata meningkatkan pendapatan warga. Pemandu wisata, pemilik penginapan, dan perajin tenun mendapat penghasilan tambahan. Akibatnya, banyak anak muda tidak perlu merantau ke kota besar untuk mencari pekerjaan.
          Kedua, kunjungan wisatawan mendorong pelestarian budaya. Rumah tongkonan dirawat dengan lebih baik, dan generasi muda kembali belajar mengukir kayu karena karya mereka dihargai.
          Memang ada pendapat bahwa wisatawan dapat mengganggu upacara adat yang sakral, misalnya Rambu Solo'. Kekhawatiran ini wajar. Namun, masalah tersebut dapat diatasi dengan aturan yang jelas: wisatawan wajib didampingi pemandu lokal, berpakaian sopan, dan meminta izin sebelum memotret.
          Oleh karena itu, saya berpendapat bahwa pariwisata sebaiknya tidak dibatasi, melainkan diatur. Pemerintah daerah dan tokoh adat perlu bekerja sama membuat panduan bagi wisatawan, sehingga pariwisata bukan hanya menguntungkan secara ekonomi, melainkan juga menjaga kehormatan budaya Toraja.
        words: [eksposisi, menurut saya, oleh karena itu]
  - id: speaking
    skill: speaking
    title:
      ar_eg: الكلام
      ar: المحادثة
      en: Speaking
    instructions:
      ar_eg: اتكلم بشكل طبيعي ومن غير تحضير طويل. المهم إن رأيك يكون واضح ومترتّب، مش إن كل كلمة تبقى مثالية.
      ar: تكلّم بشكل طبيعي ودون تحضير طويل. المهم أن يكون رأيك واضحًا ومرتّبًا، لا أن تكون كل كلمة مثالية.
      en: Speak naturally, without long preparation. What matters is a clear, well-ordered view, not every word being perfect.
    items:
      - id: t36
        type: speaking
        text: Yang terhormat Bapak Wali Kota Tomohon, para tamu undangan, dan hadirin yang berbahagia.
        meaning:
          ar_eg: سيادة عمدة Tomohon المحترم، والضيوف الكرام، والحضور السعداء.
          ar: سيادة عمدة Tomohon المحترم، والضيوف الكرام، وأيها الحضور الكريم.
          en: Honourable Mayor of Tomohon, invited guests, and dear audience.
        words: [yang terhormat, hadirin]
      - id: t37
        type: speaking_task
        points: 6
        prompt:
          ar_eg: "صاحبك بيسألك فجأة: 'رأيك إيه، المفروض الأماكن السياحية زي Bunaken تحدد عدد الزوار في اليوم؟' اتكلم حوالي ٣ دقايق من غير تحضير: قول رأيك بوضوح، وهات أسباب وأمثلة، واعترف بالجانب التاني، واقترح حل عملي."
          ar: "يسألك صديقك فجأة: 'ما رأيك؟ هل ينبغي أن تحدّ الأماكن السياحية مثل Bunaken من عدد الزوار يوميًّا؟' تحدّث نحو ثلاث دقائق دون تحضير: اعرض رأيك بوضوح، وقدّم أسبابًا وأمثلة، واعترف بالجانب الآخر، واقترح حلًّا عمليًّا."
          en: "A friend asks you out of the blue: 'What do you think: should tourist spots like Bunaken limit daily visitor numbers?' Talk for about 3 minutes without preparing: state your view clearly, give reasons and examples, acknowledge the other side, and suggest a practical solution."
        rubric:
          - States a clear position early and keeps to it, with reasons and at least one concrete example.
          - Weighs the other side (dampak positif / negatif, memang …, namun …) instead of listing only one side.
          - Uses cause–effect connectors and natural collocations (mengurangi dampak, meningkatkan pendapatan, menjaga kelestarian).
          - Speaks fluently enough for a listener to follow without strain; pronunciation clear; self-corrections are fine.
        sample: |
          Menurut saya, Bunaken memang perlu membatasi jumlah pengunjung, tetapi tidak dengan cara menutup pintu bagi wisatawan.
          Alasannya, terumbu karang itu sangat rapuh. Kalau setiap hari ratusan penyelam datang, apalagi yang belum berpengalaman, karang bisa patah dan rusak. Akibatnya, dalam beberapa tahun keindahan Bunaken bisa hilang, dan wisatawan tidak akan datang lagi.
          Memang, pembatasan bisa mengurangi pendapatan warga, terutama pemilik perahu dan penginapan. Namun, menurut saya, dampak jangka panjangnya justru positif, karena alam yang terjaga akan terus menarik wisatawan.
          Jadi, saran saya, pengelola taman laut bisa memakai sistem kuota harian dan pemesanan daring. Biaya masuk juga bisa dinaikkan sedikit, lalu uangnya dipakai untuk menjaga kelestarian karang dan melatih pemandu lokal.
        words: [membatasi, dampak, menurut saya]
