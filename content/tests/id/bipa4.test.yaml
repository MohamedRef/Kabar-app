      - id: t01
        type: listen
        text: Menurut penelitian terbaru, berjalan kaki tiga puluh menit sehari dapat menurunkan risiko penyakit jantung.
        options:
          - Menurut penelitian terbaru, berjalan kaki lima belas menit sehari dapat menurunkan risiko penyakit jantung.
          - Menurut penelitian terbaru, berjalan kaki tiga puluh menit sehari dapat menurunkan risiko penyakit jantung.
          - Menurut penelitian terbaru, berjalan kaki tiga puluh menit sehari dapat meningkatkan risiko penyakit jantung.
        answer: 1
        words: [penelitian, menurunkan, risiko]
