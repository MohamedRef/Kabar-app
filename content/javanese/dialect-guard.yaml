# The Javanese track teaches the Javanese of Yogyakarta and Madiun only
# (Mataraman: standard Solo–Jogja ngoko and krama, plus Madiun's ngoko).
# Mohamed, 2026-10-27. `kabar-tools dialect` reports these Surabaya (Arek)
# and Semarang forms as whole words in Javanese lessons, Sinetron and
# Radio, with the Mataraman form to use instead. Chat spellings (piro, opo)
# are fine and are not listed.
forms:
  rek: "mas, mbak, cah, dhik"
  cak: "mas"
  koen: kowe
  awakmu: kowe
  gak: ora
  onok: ana
  kate: arep
  yok opo: piye
  lapo: ngapa
  "opo'o": "ngapa, kenapa"
  ambek: karo
  sampek: nganti
  mek: mung
  ndek: "neng, ing"
  engkok: mengko
  maeng: mau
  cangkruk: nongkrong
  lek: yen
  eroh: "ngerti, weruh"
  nemen: "banget, tenan"
  sepurane: "ngapura, nyuwun sewu"
  garai: "marakake, gawe"
  kakean: kakehan
  arek: "bocah, cah"
  teko: saka
  sek: "sik, dhisik"
  nang: "neng, menyang, ing"
  ik: "lho, to"
  ndes: "mas, cah"
  Suroboyo: "(set the scene in Jogja or Madiun)"
# Files or lesson ids that may keep a listed form, each with the reason.
allow:
