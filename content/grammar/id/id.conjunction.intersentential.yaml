schema: kabar.grammar/v1
id: id.conjunction.intersentential
language: id
level: bipa7
title:
  target: Konjungsi antarkalimat (Namun, Oleh karena itu, Sebaliknya, Bahkan …)
  en: Sentence-linking conjunctions
  ar_eg: أدوات الربط بين الجمل
  ar: أدوات الربط بين الجمل
summary:
  ar_eg: "فيه أدوات بتربط جوه الجملة (tetapi، sehingga، karena) وأدوات بتبدأ جملة جديدة وتربطها باللي قبلها (Namun، Oleh karena itu، Sebaliknya). التانية بتيجي أول الجملة وبعدها فاصلة. ماتخلطش بينهم."
  ar: "تفرّق الإندونيسية بين أدوات الربط داخل الجملة (tetapi، sehingga، karena) وأدوات الربط بين الجمل (Namun، Oleh karena itu، Sebaliknya) التي تتصدر الجملة وتليها فاصلة."
  en: "Indonesian separates intra-sentence conjunctions (tetapi, sehingga, karena) from sentence-linking ones (Namun, Oleh karena itu, Sebaliknya), which open a new sentence and take a comma. Don't mix them up."
pattern:
  - "Sentence 1. + Connector, + Sentence 2."
  - "Contrast: Namun, / Akan tetapi, / Sebaliknya,"
  - "Concession: Meskipun demikian, / Walaupun begitu, / Biarpun begitu,"
  - "Addition / intensifying: Selain itu, / Tambahan pula, / Lagi pula, / Bahkan, / Malahan,"
  - "Consequence: Oleh karena itu, / Oleh sebab itu, / Dengan demikian, / Akibatnya, / Jadi,"
  - "Time: Kemudian, / Setelah itu, / Sebelum itu, / Selanjutnya,"
  - "Exception / restatement: Kecuali itu, / Dengan kata lain, / Sesungguhnya,"
  - "Intra-sentence only (never sentence-initial in formal writing): tetapi, sehingga, dan"
explanation:
  ar_eg: |
    الكتاب المرجعي TBBBI بيقسّم أدوات الربط لنوعين، والفرق ده هو اللي بيخلّي فقرة اقتصادية تبان «مكتوبة صح»:
    1. أدوات جوه الجملة (intrakalimat): dan، tetapi، atau، karena، sehingga، agar … بتربط جملتين في جملة واحدة.
       Inflasi turun, tetapi harga beras naik.
    2. أدوات بين الجمل (antarkalimat): بتبدأ جملة جديدة، وبعدها فاصلة (قاعدة PUEBI):
       - التضاد: Namun، Akan tetapi، Sebaliknya (بالعكس).
       - التنازل: Meskipun demikian، Walaupun begitu.
       - الإضافة والتصعيد: Selain itu، Tambahan pula، Lagi pula، Bahkan (بل)، Malahan (بالعكس كمان / بل إن، أخف).
       - النتيجة: Oleh karena itu، Oleh sebab itu، Dengan demikian، Akibatnya، Jadi.
       - الزمن: Kemudian، Setelah itu، Selanjutnya.
       - التوضيح: Dengan kata lain، Sesungguhnya.
    القواعد الذهبية للكتابة الرسمية:
    - ماتبدأش جملة بـ Tetapi أو Sehingga أو Dan.
    - حط فاصلة بعد الأداة: Oleh karena itu, …
    - «Namun demikian» شائعة جدًا، بس كتير من المحررين ومرجعيات اللغة شايفينها تكرار: Namun لوحدها أو Meskipun demikian أحسن.
    - Sebaliknya = العكس تمامًا، مش مجرد «لكن».
  ar: |
    يقسم المرجع النحوي TBBBI أدوات الربط قسمين:
    1. داخل الجملة: dan، tetapi، atau، karena، sehingga، agar.
    2. بين الجمل، تتصدر الجملة الجديدة وتليها فاصلة: للاستدراك Namun وAkan tetapi وSebaliknya (على العكس)، وللتنازل Meskipun demikian، وللإضافة Selain itu وTambahan pula وBahkan (بل)، وللنتيجة Oleh karena itu وDengan demikian وAkibatnya وJadi، وللزمن Kemudian وSetelah itu، وللتوضيح Dengan kata lain.
    وفي الكتابة الرسمية: لا يُبتدأ بـ Tetapi ولا Sehingga ولا Dan، وتوضع فاصلة بعد الأداة، ويرى كثير من المحررين أن «Namun demikian» حشو، والأفصح Namun وحدها أو Meskipun demikian. وSebaliknya تعني العكس التام لا مجرد الاستدراك.
  en: |
    The reference grammar (TBBBI) splits conjunctions into two kinds, and getting this right is what makes an economics paragraph read as properly written:
    1. Intra-sentence (intrakalimat): dan, tetapi, atau, karena, sehingga, agar … join two clauses into one sentence.
       Inflasi turun, tetapi harga beras naik.
    2. Inter-sentence (antarkalimat): open a new sentence and take a comma (PUEBI):
       - Contrast: Namun, Akan tetapi, Sebaliknya (on the contrary).
       - Concession: Meskipun demikian, Walaupun begitu.
       - Addition and escalation: Selain itu, Tambahan pula, Lagi pula, Bahkan (in fact, even), Malahan (instead / what's more; lighter).
       - Consequence: Oleh karena itu, Oleh sebab itu, Dengan demikian, Akibatnya, Jadi.
       - Time: Kemudian, Setelah itu, Selanjutnya.
       - Restatement: Dengan kata lain, Sesungguhnya.
    Golden rules for formal writing:
    - Don't start a sentence with Tetapi, Sehingga or Dan.
    - Put a comma after the connector: Oleh karena itu, …
    - "Namun demikian" is very common, but many editors and language authorities consider it redundant: prefer Namun alone or Meskipun demikian.
    - Sebaliknya means the exact opposite, not just "but".
examples:
  - text: Inflasi tahun ini relatif terkendali. Namun, harga beras masih menekan daya beli masyarakat.
    en: Inflation this year is relatively under control. However, rice prices are still squeezing people's purchasing power.
    ar_eg: التضخم السنة دي متحكَّم فيه نسبيًا. لكن أسعار الرز لسه ضاغطة على قدرة الناس الشرائية.
    ar: التضخم هذا العام تحت السيطرة نسبيًّا، غير أن أسعار الأرز ما زالت تضغط على القدرة الشرائية.
    register: formal
  - text: UMKM menyerap sebagian besar tenaga kerja. Oleh karena itu, akses kredit bagi mereka sangat menentukan.
    breakdown: UMKM (micro, small and medium enterprises) · menyerap tenaga kerja (absorb labour) · Oleh karena itu + comma
    en: Small businesses absorb most of the workforce. Therefore, their access to credit is decisive.
    ar_eg: المشروعات الصغيرة والمتوسطة بتشغّل أغلب العمالة. عشان كده، حصولهم على قروض مسألة حاسمة.
    ar: تستوعب المشروعات الصغيرة والمتوسطة معظم القوى العاملة، ولذلك فإن حصولها على الائتمان أمر حاسم.
    register: formal
  - text: Menurut laporan itu, ekspor nikel meningkat tajam. Sebaliknya, ekspor batu bara melemah.
    en: According to the report, nickel exports rose sharply. Conversely, coal exports weakened.
    ar_eg: على حسب التقرير، صادرات النيكل زادت جامد. وبالعكس، صادرات الفحم ضعفت.
    ar: وفقًا للتقرير، ارتفعت صادرات النيكل ارتفاعًا حادًّا، وعلى العكس تراجعت صادرات الفحم.
    register: formal
  - text: Harga cabai naik dua kali lipat. Bahkan, di beberapa pasar di Jayapura harganya naik tiga kali lipat.
    en: Chilli prices doubled. In fact, in some Jayapura markets they tripled.
    ar_eg: سعر الشطة اتضاعف. بل في كام سوق في جايابورا السعر بقى تلات أضعاف.
    ar: تضاعف سعر الفلفل الحار، بل بلغ ثلاثة أضعاف في بعض أسواق جايابورا.
  - text: Pemerintah menurunkan suku bunga. Dengan demikian, pinjaman usaha diharapkan menjadi lebih murah.
    en: The government lowered interest rates. Thus, business loans are expected to become cheaper.
    ar_eg: الحكومة خفّضت سعر الفايدة. وبالتالي، القروض للمشروعات متوقع تبقى أرخص.
    ar: خفّضت الحكومة أسعار الفائدة، وبالتالي يُتوقع أن تصبح قروض الأعمال أرخص.
    register: formal
mistakes:
  - wrong: Ekspor menurun. Sehingga, banyak pabrik mengurangi karyawan.
    right: Ekspor menurun. Akibatnya, banyak pabrik mengurangi karyawan. / Ekspor menurun sehingga banyak pabrik mengurangi karyawan.
    why:
      ar_eg: sehingga جوه الجملة بس. في أول جملة جديدة استخدم Akibatnya أو Oleh karena itu.
      ar: sehingga أداة داخل الجملة، وفي صدر الجملة يُقال Akibatnya أو Oleh karena itu.
      en: sehingga only works inside a sentence; to open one, use Akibatnya or Oleh karena itu.
  - wrong: Oleh karena itu pemerintah menaikkan anggaran.
    right: Oleh karena itu, pemerintah menaikkan anggaran.
    why:
      ar_eg: PUEBI - فاصلة بعد أداة الربط بين الجمل.
      ar: تُوضع فاصلة بعد أداة الربط بين الجمل وفق PUEBI.
      en: PUEBI requires a comma after a sentence-linking connector.
  - wrong: Namun demikian, pertumbuhan ekonomi tetap positif.
    right: Namun, pertumbuhan ekonomi tetap positif. / Meskipun demikian, pertumbuhan ekonomi tetap positif.
    why:
      ar_eg: Namun معناها أصلًا «ومع ذلك»، فـ demikian بعدها تكرار. شائعة، بس المحررين الدقيقين بيشيلوها.
      ar: Namun تتضمن معنى «ومع ذلك»، فإضافة demikian حشو في نظر كثير من المحررين.
      en: Namun already means "nevertheless", so adding demikian is redundant in careful editing (though common).
arabic_bridge:
  ar_eg: "في العربي برضه فيه فرق بين «لكنّ» جوه الجملة و«غير أنّ / ومع ذلك» اللي بتبدأ فكرة: Namun ≈ «غير أنّ / إلا أنّ»، Oleh karena itu = «لذلك»، Dengan demikian = «وبالتالي»، Sebaliknya = «على العكس»، Bahkan = «بل». والفرق: الإندونيسي بيحط فاصلة ونقطة واضحة بين الجملتين، والعربي بيحب يوصلهم بالواو."
  ar: "Namun تقارب «غير أنّ»، وOleh karena itu «لذلك»، وDengan demikian «وبالتالي»، وSebaliknya «على العكس»، وBahkan «بل». غير أن الإندونيسية تفصل الجملتين بنقطة وتضع فاصلة بعد الأداة، والعربية تميل إلى الوصل بالواو."
  en: "Namun ≈ غير أنّ, Oleh karena itu = لذلك, Dengan demikian = وبالتالي, Sebaliknya = على العكس, Bahkan = بل. The difference: Indonesian ends the first sentence with a full stop and puts a comma after the connector, where Arabic tends to chain sentences with و."
