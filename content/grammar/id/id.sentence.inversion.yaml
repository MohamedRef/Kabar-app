schema: kabar.grammar/v1
id: id.sentence.inversion
language: id
level: bipa6
title:
  target: Kalimat inversi (Berdirilah sebuah kerajaan …, Adapun …)
  en: Inverted and marked sentences
  ar_eg: الجملة المقلوبة (الفعل قبل الفاعل) والتقديم للتأكيد
  ar: الجملة المقلوبة والتقديم والتأخير
summary:
  ar_eg: "الترتيب العادي فاعل + فعل. في السرد التاريخي والأدب بيقدّموا الفعل أو الصفة (غالبًا بـ -lah): Berdirilah sebuah kerajaan = قامت مملكة. وAdapun X, … بتقدّم موضوع جديد زي «أمّا X فـ…»."
  ar: "الأصل تقديم الفاعل، لكن السرد التاريخي والأدبي يقدّم الفعل أو الصفة غالبًا مع -lah (Berdirilah sebuah kerajaan)، وتُقدَّم الموضوعات بـ Adapun كـ«أمّا … فـ»."
  en: "Normal order is subject + predicate. Historical and literary prose fronts the verb or adjective, often with -lah (Berdirilah sebuah kerajaan = There arose a kingdom); Adapun X, … introduces a new topic, like Arabic «أمّا… فـ»."
pattern:
  - "Verb + -lah + (time/place) + indefinite subject: Datanglah seorang pedagang …"
  - "Adjective/adverb + subject (emphasis): Sangat luas wilayah kerajaan itu."
  - "Telah / Sudah + verb + subject: Telah lama hilang kejayaannya."
  - "Adapun + topic, + comment (often with -nya): Adapun prasasti itu, isinya …"
  - "Cleft: Yang + verb … + adalah + X  (focus on X)"
  - "Narrative openers: Alkisah, … / Konon, … / Maka …"
explanation:
  ar_eg: |
    عرفت إن الجملة الإندونيسية العادية: فاعل + خبر (Sriwijaya berdiri pada abad ke-7). في النثر التاريخي (زي نصوص سريويجايا) والأدب بيقلبوا الترتيب للتأثير:
    1. فعل + -lah قبل الفاعل، غالبًا الفاعل نكرة (sebuah، seorang): Berdirilah sebuah kerajaan besar di tepi Sungai Musi = وقامت مملكة كبيرة على ضفة نهر موسي. الـ -lah بتدي إيقاع حكي.
    2. صفة أو ظرف في الأول للتأكيد: Sangat ramai pelabuhan itu pada masa jayanya = ما أشد زحام الميناء ده في عزّه!
    3. Telah / sudah + فعل + فاعل: Telah lama hilang kejayaan kerajaan itu = من زمان راح مجد المملكة دي.
    4. Adapun + موضوع، + تعليق = «أمّا … فـ…»: بتنقل للموضوع الجديد. وغالبًا التعليق فيه -nya يرجع على الموضوع: Adapun Prasasti Kedukan Bukit, isinya menceritakan perjalanan Dapunta Hyang.
    5. جملة التركيز بـ yang: Yang menguasai Selat Malaka saat itu adalah Sriwijaya = اللي كان مسيطر على مضيق ملقا ساعتها هي سريويجايا (مش غيرها).
    وفي الحكايات: Alkisah، Konon، Maka في أول الجمل.
    مهارة القراية: لما تلاقي الفعل الأول، دوّر على الفاعل بعده، ماتفتكرش إن الاسم اللي بعد حرف الجر هو الفاعل.
  ar: |
    الأصل في الإندونيسية تقديم المسند إليه، لكن النثر التاريخي والأدبي يقلب الترتيب للتأثير:
    1. فعل + -lah ثم الفاعل وهو غالبًا نكرة: Berdirilah sebuah kerajaan besar di tepi Sungai Musi (فقامت مملكة عظيمة على ضفة نهر موسي).
    2. تقديم الصفة أو الظرف للتوكيد: Sangat ramai pelabuhan itu pada masa jayanya.
    3. Telah + فعل + فاعل: Telah lama hilang kejayaan kerajaan itu.
    4. Adapun + موضوع + تعليق كـ«أمّا … فـ»، ويعود على الموضوع ضمير -nya غالبًا.
    5. جملة الحصر بـ yang … adalah: Yang menguasai Selat Malaka saat itu adalah Sriwijaya.
    وتُفتتح الحكايات بـ Alkisah وKonon وMaka. وعند القراءة يُبحث عن الفاعل بعد الفعل المقدَّم.
  en: |
    Normal Indonesian order is subject + predicate (Sriwijaya berdiri pada abad ke-7). Historical prose (like texts on Sriwijaya) and literature invert it for effect:
    1. Verb + -lah before the subject, usually an indefinite one (sebuah, seorang): Berdirilah sebuah kerajaan besar di tepi Sungai Musi = There arose a great kingdom on the banks of the Musi. The -lah gives a storytelling rhythm.
    2. Adjective or adverb first for emphasis: Sangat ramai pelabuhan itu pada masa jayanya = How busy that port was in its heyday!
    3. Telah / sudah + verb + subject: Telah lama hilang kejayaan kerajaan itu = Long gone is that kingdom's glory.
    4. Adapun + topic, + comment = "As for …": shifts to a new topic; the comment often has -nya pointing back: Adapun Prasasti Kedukan Bukit, isinya menceritakan perjalanan Dapunta Hyang.
    5. Cleft with yang: Yang menguasai Selat Malaka saat itu adalah Sriwijaya = The one that controlled the Strait of Malacca then was Sriwijaya.
    Folk and historical narratives open with Alkisah, Konon, Maka.
    Reading tip: when a verb comes first, look for the subject after it — don't take a noun inside a prepositional phrase as the subject.
examples:
  - text: Pada abad ketujuh, berdirilah sebuah kerajaan maritim di tepi Sungai Musi.
    breakdown: berdiri + -lah (fronted verb) · sebuah kerajaan maritim (subject, after the verb)
    en: In the seventh century, there arose a maritime kingdom on the banks of the Musi River.
    ar_eg: في القرن السابع، قامت مملكة بحرية على ضفة نهر موسي.
    ar: في القرن السابع قامت مملكة بحرية على ضفة نهر موسي.
    register: formal
  - text: Ramai sekali pelabuhan Palembang pada masa jayanya.
    en: How busy Palembang's port was in its heyday!
    ar_eg: ياما كان ميناء باليمبانج زحمة أيام عزّه!
    ar: ما أشدّ ازدحام ميناء باليمبانج في عصره الذهبي!
    register: formal
  - text: Datanglah para pedagang dari Gujarat, Persia, dan Tiongkok.
    en: Then came traders from Gujarat, Persia and China.
    ar_eg: وجم التجار من جوجارات وفارس والصين.
    ar: وجاء التجار من كجرات وفارس والصين.
    register: formal
  - text: Adapun Prasasti Kedukan Bukit, isinya menceritakan perjalanan Dapunta Hyang.
    breakdown: adapun (as for) + topic · isi + -nya (its content, pointing back to the inscription)
    en: As for the Kedukan Bukit inscription, it tells of the journey of Dapunta Hyang.
    ar_eg: أمّا نقش كيدوكان بوكيت، فمحتواه بيحكي عن رحلة دابونتا هيانج.
    ar: أمّا نقش كيدوكان بوكيت فيحكي رحلة دابونتا هيانج.
    register: formal
  - text: Yang menguasai Selat Malaka saat itu adalah Sriwijaya.
    en: It was Sriwijaya that controlled the Strait of Malacca at the time.
    ar_eg: اللي كانت مسيطرة على مضيق ملقا وقتها هي سريويجايا.
    ar: إن التي كانت تسيطر على مضيق ملقا آنذاك هي سريويجايا.
mistakes:
  - wrong: Sebuah kerajaan berdirilah di tepi Sungai Musi.
    right: Berdirilah sebuah kerajaan di tepi Sungai Musi. / Sebuah kerajaan berdiri di tepi Sungai Musi.
    why:
      ar_eg: الـ -lah بتلزق في الكلمة المتقدمة. لو الفاعل الأول، شيل -lah؛ لو عايز -lah، قدّم الفعل.
      ar: تلحق -lah الكلمة المقدَّمة، فإن تقدّم الفاعل حُذفت.
      en: -lah attaches to the fronted word; with the subject first, drop -lah, or front the verb.
  - wrong: "Reading «Dari Tiongkok datang para biksu» as 'China came …'"
    right: "Subject = para biksu: 'From China came the monks.'"
    why:
      ar_eg: "dari Tiongkok شبه جملة (من الصين)، والفاعل الحقيقي جه بعد الفعل: para biksu."
      ar: dari Tiongkok شبه جملة، والفاعل هو para biksu المؤخَّر بعد الفعل.
      en: dari Tiongkok is a prepositional phrase; the real subject, para biksu, follows the verb.
  - wrong: Adapun Sriwijaya.
    right: Adapun Sriwijaya, kerajaan itu menguasai jalur perdagangan selat.
    why:
      ar_eg: Adapun بتقدّم موضوع ولازم بعده تعليق، زي «أمّا … فـ…» من غير الفاء ماتكملش.
      ar: Adapun تقدّم الموضوع ولا بد من تعليق بعده، كما لا تتم «أمّا» دون جوابها.
      en: Adapun only sets up a topic; a comment must follow, just as «أمّا» needs its «فـ» clause.
arabic_bridge:
  ar_eg: "هنا العربي هيساعدك قوي: الجملة الفعلية عندنا أصلها فعل قبل الفاعل! «وجاء من أقصى المدينة رجل يسعى» (يس 20) — والترجمة الإندونيسية الرسمية بتقلب برضه: «Dan datanglah dari ujung kota, seorang laki-laki dengan bergegas». وAdapun … شغّالة زي «أمّا … فـ…» في الحكي التاريخي، والنكرة اللي بعد الفعل (sebuah، seorang) زي «رجلٌ»."
  ar: "الجملة الفعلية العربية تقدّم الفعل أصلًا، ومنه «وجاء من أقصى المدينة رجل يسعى» (يس: 20)، وتترجمها الترجمة الإندونيسية الرسمية بالقلب: «Dan datanglah dari ujung kota, seorang laki-laki dengan bergegas». وAdapun تعمل عمل «أمّا … فـ» في النثر التاريخي."
  en: "Arabic verbal sentences put the verb first by default — «وجاء من أقصى المدينة رجل يسعى» (Yā Sīn 36:20), which the official Indonesian translation renders with inversion: \"Dan datanglah dari ujung kota, seorang laki-laki dengan bergegas\". Adapun … works like «أمّا… فـ…»."
