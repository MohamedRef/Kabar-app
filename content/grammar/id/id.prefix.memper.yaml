schema: kabar.grammar/v1
id: id.prefix.memper
language: id
level: bipa5
title:
  target: memper-, memper-…-kan, memper-…-i
  en: The prefix memper- (make more …, and its confixes)
  ar_eg: البادئة memper- (يخلّي الحاجة أكتر…) وأخواتها
  ar: السابقة memper- ومركّباتها
summary:
  ar_eg: "memper- + صفة = يخلّي الحاجة «أكتر»: memperluas = يوسّع أكتر. memper-…-kan وmemper-…-i بيعملوا أفعال ثابتة لازم تتحفظ: mempertunjukkan (يعرض)، memperbaiki (يصلّح). المجهول: diper-."
  ar: "memper- مع الصفة تفيد التكثير والزيادة (memperluas = زاد في توسيعه)، ومع -kan و-i تصوغ أفعالًا ثابتة كـ mempertunjukkan وmemperbaiki، ومجهولها diper-."
  en: "memper- + adjective = make more X (memperluas = widen further); memper-…-kan and memper-…-i form fixed verbs to learn as words (mempertunjukkan = perform/stage, memperbaiki = repair). Passive: diper-."
pattern:
  - "memper- + adjective → make (even) more X: luas → memperluas, kuat → memperkuat"
  - "memper- + root + -kan: tunjuk → mempertunjukkan, kenal → memperkenalkan, tanya → mempertanyakan"
  - "memper- + root + -i: baik → memperbaiki, ajar → mempelajari (per- → pel-)"
  - "passive: diper-… (diperbaiki, dipertunjukkan, dipelajari)"
explanation:
  ar_eg: |
    عرفت meN- وmeN-…-kan. memper- هي «الأخت الأقوى» وبتظهر كتير في النقد والمقالات.
    1. memper- + صفة = يخلّي الحاجة أكتر من كده (درجة زيادة):
       luas → memperluas (يوسّع)، panjang → memperpanjang (يمدّد، زي تجديد الفيزا)، kuat → memperkuat (يقوّي)، jelas → memperjelas (يوضّح أكتر)، halus → memperhalus (ينعّم / يصقل)، cepat → mempercepat (يسرّع).
       قارن: membesarkan anak = يربّي عيل، لكن memperbesar foto = يكبّر صورة.
    2. memper-…-kan: أفعال ثابتة، احفظها كوحدة:
       mempertunjukkan (يعرض عرض فني)، memperkenalkan (يعرّف بـ)، mempertanyakan (يشكّك في / يطرح تساؤل)، mempertimbangkan (يفكّر في / يوازن)، memperjuangkan (يناضل عشان)، memperhatikan (ياخد باله)، mempersiapkan (يجهّز).
    3. memper-…-i: memperbaiki (يصلّح)، mempelajari (يدرس بعمق — per- بتبقى pel- قبل ajar)، memperingati (يحيي ذكرى).
    المجهول سهل: شيل mem- وحط di-: diperbaiki، dipertunjukkan، dipelajari.
    خلي بالك: فيه كلمات per جزء من جذرها: peroleh → memperoleh (يحصل على)، percaya → mempercayai. ومفيش «memper-» في mempunyai (ده mem- + punya + -i).
  ar: |
    memper- أقوى من meN- وتكثر في النقد والمقالات:
    1. memper- + صفة لزيادة الصفة: memperluas (وسّع أكثر)، memperpanjang (مدّد)، memperkuat (قوّى)، memperjelas، memperhalus، mempercepat. ويُفرَّق بين membesarkan anak (ربّى) وmemperbesar foto (كبّر).
    2. memper-…-kan أفعال تُحفظ كما هي: mempertunjukkan (عرض عرضًا فنيًّا)، memperkenalkan (عرّف بـ)، mempertanyakan (شكّك في)، mempertimbangkan (نظر في الأمر ووازن)، memperjuangkan (ناضل من أجل)، memperhatikan (انتبه)، mempersiapkan (أعدّ).
    3. memper-…-i: memperbaiki (أصلح)، mempelajari (درس بعمق، وتصير per- هنا pel-)، memperingati (أحيا ذكرى).
    والمجهول diper-. ولا تخلط بجذور تبدأ بـ per أصلًا: memperoleh (من peroleh)، mempercayai، ولا بـ mempunyai.
  en: |
    You know meN- and meN-…-kan; memper- is the stronger sibling, common in reviews and essays.
    1. memper- + adjective = make (even) more X:
       luas → memperluas (widen), panjang → memperpanjang (extend, e.g. a visa), kuat → memperkuat (strengthen), jelas → memperjelas (clarify further), halus → memperhalus (refine), cepat → mempercepat (speed up).
       Compare: membesarkan anak = raise a child, but memperbesar foto = enlarge a photo.
    2. memper-…-kan: fixed verbs, learn them as units:
       mempertunjukkan (stage, perform), memperkenalkan (introduce), mempertanyakan (question, call into question), mempertimbangkan (consider, weigh), memperjuangkan (fight for), memperhatikan (pay attention to), mempersiapkan (prepare).
    3. memper-…-i: memperbaiki (repair, improve), mempelajari (study in depth — per- becomes pel- before ajar), memperingati (commemorate).
    The passive is easy: swap mem- for di-: diperbaiki, dipertunjukkan, dipelajari.
    Careful: in some words per is part of the root: peroleh → memperoleh (obtain), percaya → mempercayai. And mempunyai is mem- + punya + -i, not memper-.
examples:
  - text: Tari enggang dipertunjukkan pada pembukaan festival budaya Dayak.
    breakdown: di- + per- + tunjuk + -kan → dipertunjukkan (was performed) · tari enggang (hornbill dance)
    en: The hornbill dance was performed at the opening of the Dayak cultural festival.
    ar_eg: رقصة طائر أبو قرن اتعرضت في افتتاح مهرجان ثقافة الداياك.
    ar: قُدّمت رقصة طائر أبي قرن في افتتاح مهرجان ثقافة الداياك.
    register: formal
  - text: Panitia memperluas panggung agar penonton di belakang dapat melihat lebih jelas.
    en: The organisers enlarged the stage so the audience at the back could see more clearly.
    ar_eg: المنظمين وسّعوا المسرح عشان الجمهور اللي ورا يشوف أحسن.
    ar: وسّع المنظمون المسرح كي يرى الجمهور في الخلف بوضوح أكبر.
  - text: Kritikus itu mempertanyakan keaslian koreografinya.
    en: The critic questioned the authenticity of the choreography.
    ar_eg: الناقد شكّك في أصالة تصميم الرقصة.
    ar: شكّك الناقد في أصالة تصميم الرقصات.
    register: formal
  - text: Penari muda itu masih perlu memperhalus gerakan tangannya.
    en: The young dancer still needs to refine her hand movements.
    ar_eg: الراقصة الصغيرة لسه محتاجة تنعّم حركة إيديها.
    ar: ما زالت الراقصة الشابة بحاجة إلى صقل حركات يديها.
  - text: Sanggar itu memperkenalkan tari tradisional Dayak kepada generasi muda.
    en: The arts studio introduces traditional Dayak dance to the younger generation.
    ar_eg: الاستوديو الفني ده بيعرّف الجيل الجديد على رقص الداياك التقليدي.
    ar: يعرّف المرسم الفني الجيلَ الشاب بالرقص التقليدي للداياك.
  - text: Kita perlu mempertimbangkan pendapat para tetua adat sebelum mengubah gerakannya.
    en: We need to consider the views of the customary elders before changing the movements.
    ar_eg: لازم ناخد رأي كبار القبيلة في الاعتبار قبل ما نغيّر الحركات.
    ar: علينا أن نأخذ رأي شيوخ العرف بعين الاعتبار قبل تغيير الحركات.
mistakes:
  - wrong: Teknisi sedang memperbaikkan lampu panggung.
    right: Teknisi sedang memperbaiki lampu panggung.
    why:
      ar_eg: "الفعل ده ثابت بـ -i: memperbaiki. *memperbaikkan مش موجودة."
      ar: الفعل الصحيح memperbaiki بلاحقة -i، ولا وجود لـ *memperbaikkan.
      en: The verb is fixed as memperbaiki (-i); *memperbaikkan doesn't exist.
  - wrong: Lampu panggung sedang dimemperbaiki.
    right: Lampu panggung sedang diperbaiki.
    why:
      ar_eg: في المجهول di- بتاخد مكان mem-، مش بتتحط قبلها.
      ar: في المجهول تحل di- محل mem- ولا تُضاف قبلها.
      en: In the passive, di- replaces mem-; it isn't added in front of it.
  - wrong: Mahasiswa itu memperajari tari Dayak.
    right: Mahasiswa itu mempelajari tari Dayak.
    why:
      ar_eg: "قبل ajar الـ per- بتبقى pel-: mempelajari، pelajaran."
      ar: "تصير per- قبل ajar إلى pel-: mempelajari وpelajaran."
      en: "Before ajar, per- becomes pel-: mempelajari, pelajaran."
arabic_bridge:
  ar_eg: "memper- + صفة شبه وزن «فعّل» للتكثير والتعدية: kuat → memperkuat = «قوّى»، luas → memperluas = «وسّع»، jelas → memperjelas = «وضّح». ولو عايز تقول «زاد في…» ده بالظبط إحساس memper-."
  ar: "تقرب memper- مع الصفة من وزن «فعّل» الدال على التكثير والتعدية: memperkuat = قوّى، memperluas = وسّع، memperjelas = وضّح."
  en: "memper- + adjective works like Arabic form II (فعّل) for intensifying/causing: memperkuat = قوّى, memperluas = وسّع, memperjelas = وضّح."
tags: [affix, verb, morphology, causative]
prerequisites: [id.prefix.men.basic, id.confix.men-kan, id.confix.men-i]
see_also: [id.confix.per-an, id.confix.men-kan.causative, id.passive.di]
