schema: kabar.grammar/v1
id: id.particle.lah-kah-pun
language: id
level: bipa3
title:
  target: -lah, -kah, pun (apakah, inilah, siapa pun)
  en: The focus particles -lah, -kah and pun
  ar_eg: الأدوات -lah و -kah و pun
  ar: أدوات التوكيد والاستفهام -lah و-kah وpun
summary:
  ar_eg: "-lah بتأكد أو بتليّن الأمر، -kah بتعمل سؤال (apakah = هل)، و pun = كمان / حتى."
  ar: "-lah للتوكيد وتلطيف الأمر، و-kah للاستفهام (apakah = هل)، وpun بمعنى أيضًا / حتى."
  en: "-lah emphasises or softens a command, -kah marks a question (apakah = is it that…?), pun = also / even."
pattern:
  - verb + -lah (polite / emphatic command) · ini / itu / dia + -lah (it is … that)
  - Apakah + statement? · question word + -kah? · bukankah …? (isn't it…?)
  - noun / pronoun + pun (also, even) · question word + pun (any-, -ever)
  - "fixed words written as one: walaupun, meskipun, ataupun, maupun, adapun, bagaimanapun"
explanation:
  ar_eg: |
    التلاتة دول «بهارات» الكلام الرسمي، بتلاقيهم كتير في الكتابة والخطب:
    - -lah بتلزق في الكلمة:
      • مع الفعل = أمر مؤدب أو مؤكد: Duduklah = اتفضل اقعد، Buanglah sampah pada tempatnya = ارمي الزبالة في مكانها.
      • مع ini / itu / الاسم = «هو ده اللي…»: Inilah Pantai Senggigi = آدي شاطئ سنجيجي!، Dialah yang menang = هو اللي كسب.
    - -kah بتلزق في الكلمة اللي بنسأل عنها:
      • Apakah = هل: Apakah kamu sudah makan? (في الكلام العادي بيقولوا Kamu sudah makan? من غير apakah).
      • Siapakah dia? / Benarkah? = هو ده بجد؟
      • Bukankah = مش …؟ (لما متوقع إن الإجابة «أيوه»): Bukankah plastik berbahaya?
    - pun = كمان / حتى، وبتتكتب منفصلة: Saya pun setuju = وأنا كمان موافق. Sedikit pun tidak = ولا حتة.
      مع أدوات السؤال = أي: apa pun = أي حاجة، siapa pun = أي حد، di mana pun = في أي حتة.
      بس فيه كلمات ثابتة بتتكتب لازقة: walaupun / meskipun (مع إن)، ataupun، maupun، adapun، bagaimanapun.
  ar: |
    هذه الأدوات من سمات الأسلوب الرسمي والمكتوب:
    - -lah تتصل بالكلمة:
      • بالفعل للأمر المؤدب أو المؤكد: Duduklah (تفضل بالجلوس)، Buanglah sampah pada tempatnya.
      • بالضمير أو اسم الإشارة للحصر والتوكيد: Inilah Pantai Senggigi (هذا هو شاطئ سنجيجي)، Dialah yang menang.
    - -kah تتصل بموضع السؤال:
      • Apakah = هل، وتُحذف كثيرًا في الكلام.
      • Siapakah dia? وBenarkah? (أحقًا؟).
      • Bukankah = أليس …؟ للسؤال التقريري.
    - pun بمعنى أيضًا / حتى وتُكتب منفصلة: Saya pun setuju، Sedikit pun tidak.
      ومع أدوات الاستفهام تفيد العموم: apa pun (أيّ شيء)، siapa pun (أيّ أحد).
      وتُكتب متصلة في أدوات ربط ثابتة: walaupun، meskipun، ataupun، maupun، adapun، bagaimanapun.
  en: |
    These three season formal and written Indonesian:
    - -lah attaches to the word:
      • on a verb = polite or emphatic command: Duduklah (please sit), Buanglah sampah pada tempatnya (put rubbish in its place).
      • on ini / itu / a pronoun = "it is … that": Inilah Pantai Senggigi (here is Senggigi Beach!), Dialah yang menang (he's the one who won).
    - -kah attaches to what is being asked:
      • Apakah = yes/no question marker (often dropped in speech).
      • Siapakah dia? · Benarkah? (Really?)
      • Bukankah = isn't it…? (expects "yes").
    - pun = also / even, written separately: Saya pun setuju (I agree too). Sedikit pun tidak (not even a little).
      With question words = any-/-ever: apa pun, siapa pun, di mana pun.
      Fixed conjunctions are written as one word: walaupun, meskipun, ataupun, maupun, adapun, bagaimanapun.
examples:
  - text: Apakah kamu sudah membaca berita tentang penyu di Gili?
    breakdown: apa + -kah (question marker) · kamu · sudah membaca · berita tentang penyu
    en: Have you read the news about the turtles on the Gilis?
    ar_eg: هل قريت الخبر بتاع السلاحف في جيلي؟
    ar: هل قرأت الخبر عن السلاحف في جزر جيلي؟
  - text: Buanglah sampah pada tempatnya.
    breakdown: buang (throw away) + -lah · sampah · pada tempat + -nya
    en: Please put rubbish in the bin.
    ar_eg: ارمي الزبالة في مكانها.
    ar: ضع النفايات في مكانها.
    register: formal
  - text: Bukankah plastik berbahaya bagi laut?
    en: Isn't plastic dangerous for the sea?
    ar_eg: مش البلاستيك خطر على البحر؟
    ar: أليس البلاستيك خطرًا على البحر؟
  - text: Inilah Pantai Senggigi yang terkenal itu.
    en: This is the famous Senggigi Beach.
    ar_eg: آدي شاطئ سنجيجي المشهور.
    ar: هذا هو شاطئ سنجيجي الشهير.
  - text: Siapa pun boleh ikut membersihkan pantai.
    en: Anyone may join the beach clean-up.
    ar_eg: أي حد ممكن يشارك في تنضيف الشط.
    ar: يجوز لأي أحد المشاركة في تنظيف الشاطئ.
  - text: Dimas pun datang walaupun hujan.
    en: Even Dimas came, although it was raining.
    ar_eg: حتى ديماس جه مع إن الدنيا كانت بتمطر.
    ar: حتى ديماس حضر مع أن المطر كان يهطل.
mistakes:
  - wrong: apapun, siapapun
    right: apa pun, siapa pun
    why:
      ar_eg: pun بتتكتب منفصلة بعد أدوات السؤال؛ اللازقة بس في الكلمات الثابتة زي walaupun و meskipun.
      ar: تُكتب pun منفصلة بعد أدوات الاستفهام، ولا تتصل إلا في أدوات الربط الثابتة.
      en: pun is written separately after question words; only fixed conjunctions like walaupun join it.
  - wrong: Duduk lah, Apa kah
    right: Duduklah, Apakah
    why:
      ar_eg: -lah و -kah بيلزقوا في الكلمة من غير مسافة.
      ar: تتصل -lah و-kah بالكلمة دون فاصل.
      en: -lah and -kah attach directly to the word.
  - wrong: walau pun
    right: walaupun
    why:
      ar_eg: walaupun / meskipun كلمة واحدة.
      ar: walaupun وmeskipun كلمة واحدة.
      en: walaupun / meskipun are single words.
arabic_bridge:
  ar_eg: "apakah بالظبط زي «هل» في الفصحى: بتحطها في أول الجملة وخلاص، ومش لازمة في العامية — زي ما احنا في المصري بنقول «انت أكلت؟» من غير هل. و bukankah = «أليس…؟». و inilah ≈ «ها هو ذا»."
  ar: "apakah تقابل «هل» تمامًا، وbukankah تقابل «أليس» في السؤال التقريري، وinilah تقارب «ها هو ذا»."
  en: apakah works exactly like Arabic هل (and is dropped in casual speech just as Egyptians drop هل); bukankah = أليس.
tags: [particle, question, formal-writing, spelling]
prerequisites: [id.question.apa]
see_also: [id.clitic.nya, id.discussion.expressions, id.imperative.basic]
cues:
  - match: "pun"
    note:
      ar_eg: "pun = حتى / كمان، وبتدّي تأكيد (siapa pun = أي حد)."
      ar: "pun = حتى / أيضًا للتوكيد."
      en: "pun = even / also, for emphasis (siapa pun = anyone)."
  - match: "inilah|itulah|marilah"
    note:
      ar_eg: "-lah بتأكّد الكلمة: inilah = أهو ده بالذات."
      ar: "-lah للتوكيد: inilah = هذا بعينه."
      en: "-lah stresses the word: inilah = this is it."
  - match: "{-kah}"
    note:
      ar_eg: "-kah في آخر كلمة السؤال = سؤال رسمي: bukankah = مش ...؟"
      ar: "-kah تجعل السؤال رسميًا: bukankah = أليس ...؟"
      en: "-kah marks a formal question: bukankah = isn't it…?"
  - match: "{-lah}"
    note:
      ar_eg: "-lah في آخر الفعل = أمر ألطف أو تأكيد: buanglah = ارمي."
      ar: "-lah في آخر الفعل = أمر ألطف أو توكيد."
      en: "-lah on a verb = a softer command or emphasis."
