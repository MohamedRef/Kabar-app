cues:
  - match: "meskipun|walaupun|biarpun|kendatipun|meski|walau|sekalipun"
    note:
      ar_eg: "meskipun / walaupun = رغم إن."
      ar: "meskipun / walaupun = رغم أن."
      en: "meskipun / walaupun = although."
  - match: "padahal"
    note:
      ar_eg: "padahal = مع إن (عكس المتوقع)."
      ar: "padahal = مع أن (خلاف المتوقع)."
      en: "padahal = even though (contrary to expectation)."
