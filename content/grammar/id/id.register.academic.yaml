schema: kabar.grammar/v1
id: id.register.academic
language: id
level: bipa7
title:
  target: Ragam ilmiah (penelitian ini bertujuan …, data dikumpulkan …, dapat disimpulkan bahwa …)
  en: Academic register
  ar_eg: لغة الكتابة العلمية والأكاديمية
  ar: لغة الكتابة العلمية
summary:
  ar_eg: "الكتابة العلمية الإندونيسية: محايدة (مش «أنا» كتير؛ penulis أو المبني للمجهول)، مليانة مصادر وأسماء، متحفظة (cenderung، dapat dikatakan)، بالمراجع (Menurut X (tahun)) ومن غير عامية. وفيه أخطاء «مشهورة» لازم تتجنبها: «di mana» كاسم موصول، و«daripada» للإضافة."
  ar: "تتسم الكتابة العلمية الإندونيسية بالحياد (penulis أو المبني للمجهول بدل saya)، وكثرة المصادر والأسماء، والتحوّط، والتوثيق (Menurut X (السنة))، وتجنب العامية وأخطاء شائعة كاستعمال di mana موصولًا وdaripada للإضافة."
  en: "Indonesian academic writing is impersonal (penulis or passives rather than saya), nominal, hedged (cenderung, dapat dikatakan), cited (Menurut X (year)) and free of slang — and it avoids notorious errors such as relative di mana and possessive daripada."
pattern:
  - "Aim: Penelitian / Artikel ini bertujuan + verb (menganalisis, mendeskripsikan, mengkaji) …"
  - "Method (passive): Data dikumpulkan melalui … dan dianalisis secara …"
  - "Citation: Menurut X (tahun), … · X (tahun) menyatakan bahwa … · … (X, tahun). · X dkk. (tahun)"
  - "Findings: Hasil analisis menunjukkan bahwa … · Temuan ini sejalan dengan / berbeda dengan …"
  - "Conclusion: Berdasarkan pembahasan di atas, dapat disimpulkan bahwa …"
  - "Self-reference: penulis / peneliti, or passive — not aku / gue"
explanation:
  ar_eg: |
    الوحدة الأخيرة: تكتب مقال علمي (أو علمي مبسّط) وتفهم ندوة سريعة. مواصفات الـ ragam ilmiah:
    1. الحياد: قلّل saya. استخدم penulis (الكاتب) أو peneliti، أو الأحسن المبني للمجهول: Data dikumpulkan melalui wawancara.
    2. الأسماء والمصادر: Pengumpulan data dilakukan … (رجع لمدخل nominalization).
    3. التحفّظ: cenderung، relatif، dapat dikatakan، diduga — مش «pasti 100%».
    4. التوثيق: Menurut X (2019), … / X (2019) menyatakan bahwa … / … (X, 2019). ولأكتر من مؤلفين: dkk. (dan kawan-kawan = وآخرون).
    5. الهيكل بالعبارات الجاهزة: Penelitian ini bertujuan … (الهدف)، Data dikumpulkan … (المنهج)، Hasil analisis menunjukkan bahwa … (النتايج)، Temuan ini sejalan dengan … (مقارنة)، Berdasarkan pembahasan di atas, dapat disimpulkan bahwa … (الخلاصة).
    6. من غير عامية، من غير علامات تعجب، من غير مشاعر.
    أخطاء مشهورة بيصححها أي مشرف إندونيسي:
    - «di mana» كاسم موصول (ترجمة من where / which): ... kota di mana saya tinggal → kota tempat saya tinggal / kota yang saya tinggali.
    - «daripada» للإضافة (من أسلوب خطابي قديم): pentingnya daripada pendidikan → pentingnya pendidikan.
    - الجمع المكرر: banyak buku-buku / para peneliti-peneliti → banyak buku / para peneliti.
    - merupakan بس قبل اسم، مش قبل صفة: Hal ini merupakan penting ✗ → Hal ini penting.
  ar: |
    خصائص الأسلوب العلمي (ragam ilmiah):
    1. الحياد: يقل استعمال saya، ويُستعمل penulis أو peneliti، أو المبني للمجهول: Data dikumpulkan melalui wawancara.
    2. الاسمية: Pengumpulan data dilakukan …
    3. التحوّط: cenderung، relatif، dapat dikatakan.
    4. التوثيق: Menurut X (2019)، X (2019) menyatakan bahwa …، (X, 2019)، وdkk. بمعنى «وآخرون».
    5. العبارات الجاهزة للهيكل: الهدف (Penelitian ini bertujuan …)، المنهج (Data dikumpulkan …)، النتائج (Hasil analisis menunjukkan bahwa …)، المقارنة (sejalan dengan)، الخلاصة (dapat disimpulkan bahwa …).
    6. خلوّه من العامية والتعجب والانفعال.
    ومن الأخطاء الشائعة: استعمال di mana اسمًا موصولًا (والصواب tempat أو yang)، وdaripada للإضافة، وتكرار علامة الجمع (banyak buku-buku)، واستعمال merupakan قبل الصفة.
  en: |
    The final unit: write a (popular-)scientific article and follow a fast seminar. Features of ragam ilmiah:
    1. Impersonal: use less saya; use penulis (the author) or peneliti, or better, the passive: Data dikumpulkan melalui wawancara.
    2. Nominal: Pengumpulan data dilakukan … (see the nominalisation entry).
    3. Hedged: cenderung, relatif, dapat dikatakan, diduga — not "pasti 100%".
    4. Cited: Menurut X (2019), … / X (2019) menyatakan bahwa … / … (X, 2019). For several authors: dkk. (dan kawan-kawan = et al.).
    5. Structured with set phrases: aim (Penelitian ini bertujuan …), method (Data dikumpulkan …), results (Hasil analisis menunjukkan bahwa …), comparison (Temuan ini sejalan dengan …), conclusion (Berdasarkan pembahasan di atas, dapat disimpulkan bahwa …).
    6. No slang, exclamation marks or emotion.
    Notorious errors any Indonesian supervisor will correct:
    - di mana as a relative pronoun (a calque of where / which): kota di mana saya tinggal → kota tempat saya tinggal / kota yang saya tinggali.
    - possessive daripada (an old speech-making habit): pentingnya daripada pendidikan → pentingnya pendidikan.
    - double plurals: banyak buku-buku / para peneliti-peneliti → banyak buku / para peneliti.
    - merupakan only before a noun, never an adjective: Hal ini merupakan penting ✗ → Hal ini penting.
examples:
  - text: Penelitian ini bertujuan mendeskripsikan perubahan pola permukiman masyarakat Dani di Lembah Baliem.
    en: This study aims to describe changes in the settlement patterns of the Dani community in the Baliem Valley.
    ar_eg: البحث ده هدفه يوصف التغيّر في أنماط سكن مجتمع الداني في وادي باليم.
    ar: يهدف هذا البحث إلى وصف التغيرات في أنماط الاستيطان لدى مجتمع الداني في وادي باليم.
    register: formal
  - text: Data dikumpulkan melalui wawancara mendalam dan observasi partisipatif selama enam bulan.
    en: Data were collected through in-depth interviews and participant observation over six months.
    ar_eg: البيانات اتجمعت عن طريق مقابلات متعمقة وملاحظة بالمشاركة على مدار ست شهور.
    ar: جُمعت البيانات عبر مقابلات معمّقة وملاحظة بالمشاركة على مدى ستة أشهر.
    register: formal
  - text: Hasil analisis menunjukkan bahwa generasi muda cenderung meninggalkan honai tradisional.
    breakdown: hasil analisis menunjukkan bahwa (results show that) · cenderung (tend to — hedge) · honai (traditional Dani round house)
    en: The analysis shows that the younger generation tends to leave the traditional honai.
    ar_eg: نتايج التحليل بتوضّح إن الجيل الجديد بيميل يسيب بيوت الهوناي التقليدية.
    ar: تُظهر نتائج التحليل أن الجيل الشاب يميل إلى ترك بيوت الهوناي التقليدية.
    register: formal
  - text: Temuan ini sejalan dengan penelitian sebelumnya di wilayah pegunungan Papua.
    en: This finding is consistent with earlier research in the Papuan highlands.
    ar_eg: النتيجة دي ماشية مع أبحاث سابقة في مرتفعات بابوا.
    ar: تتسق هذه النتيجة مع أبحاث سابقة في مرتفعات بابوا.
    register: formal
  - text: Berdasarkan pembahasan di atas, dapat disimpulkan bahwa modernisasi tidak sepenuhnya menghapus nilai adat.
    en: Based on the discussion above, it can be concluded that modernisation has not entirely erased customary values.
    ar_eg: بناءً على اللي اتناقش فوق، نقدر نستنتج إن التحديث ماشالش قيم العادات خالص.
    ar: بناءً على ما سبق، يمكن الاستنتاج أن التحديث لم يمحُ القيم العرفية تمامًا.
    register: formal
mistakes:
  - wrong: Lembah Baliem adalah daerah di mana masyarakat Dani tinggal.
    right: Lembah Baliem adalah daerah tempat masyarakat Dani tinggal. / … daerah yang didiami masyarakat Dani.
    why:
      ar_eg: di mana أداة استفهام (فين؟)، واستخدامها كاسم موصول ترجمة من الإنجليزي. استخدم tempat أو yang.
      ar: di mana أداة استفهام، واستعمالها موصولًا ترجمة عن الإنجليزية، والصواب tempat أو yang.
      en: di mana is a question word; using it as a relative pronoun calques English. Use tempat or yang.
  - wrong: Pentingnya daripada pendidikan adat tidak boleh diabaikan.
    right: Pentingnya pendidikan adat tidak boleh diabaikan.
    why:
      ar_eg: daripada للمقارنة بس («أكتر من»)، مش للإضافة. الإضافة في الإندونيسي من غير حرف.
      ar: daripada للمقارنة فقط، والإضافة لا تحتاج حرفًا.
      en: daripada is only for comparison ("than"); possession needs no word at all.
  - wrong: Banyak penelitian-penelitian membahas hal ini.
    right: Banyak penelitian membahas hal ini.
    why:
      ar_eg: banyak بتدل على الجمع، فالتكرار تاني زيادة.
      ar: banyak تفيد الجمع، فتكرار الاسم حشو.
      en: banyak already marks plural, so reduplication is redundant.
  - wrong: Pendidikan adat merupakan penting bagi generasi muda.
    right: Pendidikan adat penting bagi generasi muda. / Pendidikan adat merupakan hal yang penting …
    why:
      ar_eg: merupakan = «يُعدّ / يمثّل» وبعدها لازم اسم، مش صفة.
      ar: merupakan بمعنى «يُعدّ» ولا يليها إلا اسم.
      en: merupakan ("constitutes") must be followed by a noun, not an adjective.
arabic_bridge:
  ar_eg: "اللغة الأكاديمية الإندونيسية مليانة عربي: ilmiah ← علمية، ilmu ← علم، makalah ← مقالة (بس معناها «ورقة بحثية»)، kaidah ← قاعدة، mukadimah ← مقدمة، hakikat ← حقيقة، abad ← أبد (بمعنى «قرن»!). وأسلوب «يهدف هذا البحث إلى… / تُظهر النتائج أن…» نفس قوالب الرسائل العلمية بالعربي."
  ar: "تزخر اللغة الأكاديمية الإندونيسية بالألفاظ العربية: ilmiah ← علمية، ilmu ← علم، makalah ← مقالة (بمعنى الورقة البحثية)، kaidah ← قاعدة، mukadimah ← مقدمة، hakikat ← حقيقة. وقوالبها تقابل قوالب الرسائل العلمية العربية: يهدف هذا البحث إلى، تُظهر النتائج أن."
  en: "Academic Indonesian is rich in Arabic: ilmiah ← علمية, ilmu ← علم, makalah ← مقالة (meaning 'academic paper'), kaidah ← قاعدة, mukadimah ← مقدمة, hakikat ← حقيقة. Its set phrases mirror Arabic thesis language: يهدف هذا البحث إلى = Penelitian ini bertujuan …, تُظهر النتائج أن = Hasil analisis menunjukkan bahwa …"
