schema: kabar.grammar/v1
id: id.confix.men-kan
language: id
level: bipa4
title:
  target: meN-…-kan (membelikan, menceritakan, mengirimkan, menyelamatkan)
  en: "The confix meN-…-kan: causative, benefactive and more"
  ar_eg: "meN-…-kan: يخلّي، يعمل لحد، وأكتر"
  ar: "meN-…-kan: السببية والإفادة وغيرهما"
summary:
  ar_eg: "-kan ليها ٣ أدوار: يخلّي (membersihkan)، يعمل حاجة لحد (membelikan ibu baju = اشترى لمامته هدوم)، ويخلي الحاجة المتحركة أو الموضوع هو المفعول (menceritakan pengalaman = حكى التجربة)."
  ar: "لـ-kan ثلاث وظائف: السببية (membersihkan)، والإفادة أي الفعل لأجل شخص (membelikan ibu baju)، وجعلِ الشيءِ المنقول أو الموضوعِ مفعولًا به (menceritakan pengalaman)."
  en: "-kan has three jobs: causative (membersihkan), benefactive — doing something for someone (membelikan ibu baju = buy Mum clothes), and making the thing moved or the topic the object (menceritakan pengalaman = tell about an experience)."
pattern:
  - "causative: meN- + adjective / intransitive + -kan (membersihkan, menurunkan)"
  - "benefactive: meN- + verb + -kan + beneficiary + thing (membelikan adik buku)"
  - "= meN- + verb + thing + untuk + beneficiary (membeli buku untuk adik)"
  - "thing as object: mengirimkan surat (kepada …), meletakkan, menyampaikan"
  - "topic as object: ber-verb + tentang X → meN-…-kan X (bercerita tentang → menceritakan)"
  - "-kan vs -i: menanamkan padi (the thing) / menanami sawah (the place)"
explanation:
  ar_eg: |
    في المستوى التالت عرفت -kan السببية: bersih → membersihkan. دلوقتي الصورة الكاملة:
    1) السببية (يخلّي): membersihkan، menurunkan، menyelamatkan (ينقذ — من selamat).
    2) الإفادة = تعمل الحاجة «لحد»: membeli → membelikan، membuat → membuatkan، memasak → memasakkan، membuka → membukakan، mengambil → mengambilkan.
       الترتيب: الفعل + الشخص اللي استفاد + الحاجة: Mas Ardi membelikan saya kopi Toraja = مَس أردي اشترالي قهوة توراجا.
       أو من غير -kan مع untuk: Mas Ardi membeli kopi untuk saya.
    3) الحاجة اللي بتتحرك بقت المفعول: mengirimkan surat kepada Ibu (بعت جواب لماما)، meletakkan tas di meja (حط الشنطة)، menyampaikan salam (وصّل السلام).
    4) الموضوع بقى المفعول (بدل tentang): bercerita tentang sejarah → menceritakan sejarah (حكى التاريخ)، berbicara tentang masalah → membicarakan masalah (ناقش المشكلة)، mendengar → mendengarkan musik (سمع باهتمام).
       بعد الأفعال دي ما تحطش tentang تاني!
    -kan ولا -i؟ -kan = المفعول هو «الحاجة» اللي بتتحرك: menanamkan padi؛ -i = المفعول هو «المكان أو الشخص»: menanami sawah، mengirimi Ibu surat.
  ar: |
    عرفتَ -kan السببية (membersihkan)، وهذه صورتها الكاملة:
    1) السببية: membersihkan، menurunkan، menyelamatkan (أنقذ).
    2) الإفادة (الفعل لأجل غيرك): membelikan، membuatkan، memasakkan، membukakan، mengambilkan، والترتيب: الفعل + المستفيد + الشيء: Mas Ardi membelikan saya kopi Toraja، أو بلا -kan مع untuk: membeli kopi untuk saya.
    3) الشيء المنقول مفعولًا: mengirimkan surat kepada Ibu، meletakkan tas، menyampaikan salam.
    4) الموضوع مفعولًا بدل tentang: bercerita tentang → menceritakan، berbicara tentang → membicarakan، mendengarkan (استمع). ولا تُذكر tentang بعدها.
    والفرق مع -i: -kan يجعل الشيء المنقول مفعولًا (menanamkan padi)، و-i يجعل المكان أو الشخص مفعولًا (menanami sawah، mengirimi Ibu surat).
  en: |
    At BIPA 3 you met causative -kan (membersihkan). Here's the full picture:
    1) Causative: membersihkan, menurunkan, menyelamatkan (rescue, from selamat).
    2) Benefactive — doing it for someone: membelikan, membuatkan, memasakkan, membukakan (open for), mengambilkan (fetch for). Order: verb + beneficiary + thing: Mas Ardi membelikan saya kopi Toraja (Mas Ardi bought me some Toraja coffee). Or without -kan: membeli kopi untuk saya.
    3) The thing moved becomes the object: mengirimkan surat kepada Ibu (send a letter to Mum), meletakkan tas di meja (put the bag on the table), menyampaikan salam (pass on greetings).
    4) The topic becomes the object, replacing tentang: bercerita tentang sejarah → menceritakan sejarah (tell the history), berbicara tentang masalah → membicarakan masalah (discuss the problem), mendengarkan musik (listen to music). No tentang after these!
    -kan or -i? -kan = the object is the thing that moves (menanamkan padi); -i = the object is the place or person reached (menanami sawah, mengirimi Ibu surat).
examples:
  - text: Mas Ardi membelikan saya kopi Toraja.
    breakdown: meN- + beli + -kan (buy for) · saya (beneficiary) · kopi Toraja (thing)
    en: Mas Ardi bought me some Toraja coffee.
    ar_eg: مَس أردي اشترالي قهوة توراجا.
    ar: اشترى لي ماس أردي قهوة توراجا.
  - text: Pemandu itu menceritakan sejarah rumah tongkonan.
    breakdown: meN- + cerita + -kan (tell about) · sejarah (topic as object)
    en: The guide told us the history of the tongkonan houses.
    ar_eg: المرشد حكى تاريخ بيوت التونجكونان.
    ar: روى المرشد تاريخ بيوت التونغكونان.
  - text: Kami membicarakan rencana kunjungan ke Rantepao.
    en: We discussed the plan to visit Rantepao.
    ar_eg: اتكلمنا في خطة الزيارة لرانتيباو.
    ar: ناقشنا خطة زيارة رانتيباو.
  - text: Tolong sampaikan salam saya kepada keluarga Anda.
    breakdown: sampai + -kan (convey) — imperative without meN-
    en: Please give my regards to your family.
    ar_eg: من فضلك سلّملي على عيلتك.
    ar: أرجو أن تبلّغ تحياتي لأسرتك.
    register: formal
  - text: Ibu memasakkan kami pa'piong.
    breakdown: meN- + masak + -kan (cook for) · kami (beneficiary) · pa'piong (Toraja dish cooked in bamboo)
    en: Mum cooked pa'piong for us.
    ar_eg: ماما طبختلنا بابيونج (أكلة توراجية بتتطبخ في البامبو).
    ar: طبخت لنا الأم طبق البابيونغ.
  - text: Petani menanamkan padi di sawah. / Petani menanami sawah dengan padi.
    en: The farmer plants rice in the paddy. / The farmer plants the paddy with rice.
    ar_eg: الفلاح بيزرع الرز في الغيط. / الفلاح بيزرع الغيط رز.
    ar: يزرع الفلاح الأرز في الحقل. / يزرع الفلاح الحقلَ أرزًا.
mistakes:
  - wrong: Kami membicarakan tentang masalah itu.
    right: Kami membicarakan masalah itu. / Kami berbicara tentang masalah itu.
    why:
      ar_eg: -kan خلت الموضوع مفعول مباشر؛ tentang بقت زيادة.
      ar: جعلت -kan الموضوعَ مفعولًا فلا حاجة لـtentang.
      en: -kan already makes the topic the object; tentang is redundant.
  - wrong: Saya membelikan buku adik saya.
    right: Saya membelikan adik saya buku. / Saya membeli buku untuk adik saya.
    why:
      ar_eg: "مع -kan الإفادة: الشخص الأول وبعدين الحاجة."
      ar: في -kan الإفادية يأتي المستفيد أولًا ثم الشيء.
      en: With benefactive -kan the beneficiary comes first, then the thing.
  - wrong: Saya mengirimkan Ibu surat.
    right: Saya mengirimkan surat kepada Ibu. / Saya mengirimi Ibu surat.
    why:
      ar_eg: mengirimkan مفعولها الحاجة (الجواب)؛ لو عايز الشخص يبقى المفعول استعمل mengirimi.
      ar: مفعول mengirimkan الشيء المرسَل، ولجعل الشخص مفعولًا تُستعمل mengirimi.
      en: mengirimkan takes the thing sent; to make the person the object use mengirimi.
arabic_bridge:
  ar_eg: "-kan الإفادية هي «لـ» اللي بنلزقها في الفعل في المصري: «اشتريتلك» = membelikanmu، «طبختلنا» = memasakkan kami. والسببية زي «فعّل / أفعل»: أنقذ (من سَلِم) = menyelamatkan — و selamat نفسها من «سلامة»!"
  ar: "تقابل -kan الإفادية لام الجر المتصلة بالفعل: «اشتريتُ لك» = membelikanmu، والسببية تقابل «أفعل / فعّل»: menyelamatkan (أنقذ) من selamat المأخوذة من «سلامة»."
  en: Benefactive -kan is like Egyptian «اشتريتلك» (verb + لـ + person); causative -kan matches أفعل / فعّل — menyelamatkan comes from selamat ← سلامة.
tags: [affix, verb, causative, benefactive, morphology]
