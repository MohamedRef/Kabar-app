schema: kabar.grammar/v1
id: id.reduplication.ber-an
language: id
level: bipa3
title:
  target: berlari-larian, bermaaf-maafan, berbondong-bondong, berhari-hari
  en: Reduplication with ber- (and ber-…-an)
  ar_eg: التكرار مع ber- (و ber-…-an)
  ar: التكرار مع السابقة ber- (وber-…-an)
summary:
  ar_eg: "ber- + كلمة مكررة (+ -an) = حركة كتير وفوضوية أو متبادلة: berlari-larian = بيجروا هنا وهناك، bermaaf-maafan = يسامحوا بعض. ومع الوقت: berhari-hari = أيام وأيام."
  ar: "ber- مع التكرار (وقد تلحقه -an) يفيد الحركة المتكررة المتفرقة أو التبادل: berlari-larian، bermaaf-maafan؛ ومع وحدات الزمن يفيد الكثرة: berhari-hari."
  en: "ber- + doubled root (+ -an) = lots of scattered or mutual action: berlari-larian (run about), bermaaf-maafan (forgive each other); with time units = for … on end: berhari-hari."
pattern:
  - ber- + root-root + -an = many doers, here and there / each other (berlari-larian, berkejar-kejaran)
  - ber- + root-root + -an = reciprocal (bersalam-salaman, bermaaf-maafan)
  - ber- + root-root = repeated / aimless action (berjalan-jalan, bermain-main)
  - ber- + time unit doubled = for … on end (berjam-jam, berhari-hari, bertahun-tahun)
  - ber- + root-root = in large numbers (berbondong-bondong)
explanation:
  ar_eg: |
    في الحواديت هتلاقي الشكل ده كتير لأنه بيرسم صورة حية:
    1) ber- + تكرار + -an = ناس كتير بيعملوا الحاجة هنا وهناك أو مع بعض:
       berlari-larian = بيجروا في كل حتة، berkejar-kejaran = بيجروا ورا بعض.
    2) تبادل (زي «تفاعَل»): bersalam-salaman = بيسلّموا على بعض، bermaaf-maafan = بيسامحوا بعض (في العيد!)، berpandang-pandangan = بيبصوا لبعض.
    3) ber- + تكرار من غير -an = بيعمل كتير أو من غير هدف: berjalan-jalan = يتمشى، bermain-main = يلعب / يهزّر.
    4) مع الوقت = مدة طويلة: berjam-jam = ساعات وساعات، berhari-hari = أيام، bertahun-tahun = سنين.
    5) berbondong-bondong = جايين أفواج.
    خلي بالك: الجذر هو اللي بيتكرر، و -an في الآخر: bersalam-salaman (مش bersalaman-salaman).
    و saling = «بعض» لوحدها كفاية: saling memaafkan أو bermaaf-maafan — مش saling bermaaf-maafan.
  ar: |
    يكثر هذا البناء في الحكايات لأنه يرسم صورة حية:
    1) ber- + المكرر + -an: كثرة الفاعلين وتفرّق الحركة: berlari-larian (يتراكضون هنا وهناك)، berkejar-kejaran (يطارد بعضهم بعضًا).
    2) التبادل (كصيغة تفاعَل): bersalam-salaman (تصافحوا)، bermaaf-maafan (تسامحوا)، berpandang-pandangan (تبادلوا النظر).
    3) ber- + المكرر بلا -an: تكرار الفعل أو عدم قصده: berjalan-jalan، bermain-main.
    4) مع وحدات الزمن: طول المدة: berjam-jam، berhari-hari، bertahun-tahun.
    5) berbondong-bondong: جماعات وأفواجًا.
    والمكرر هو الجذر و-an في الآخر: bersalam-salaman. ولا تُجمع saling مع صيغة التبادل.
  en: |
    Folk tales use these a lot because they paint a lively picture:
    1) ber- + doubled root + -an = many people doing it all over / with each other: berlari-larian (run about), berkejar-kejaran (chase each other).
    2) Reciprocal: bersalam-salaman (shake hands with each other), bermaaf-maafan (forgive each other — at Lebaran!), berpandang-pandangan (look at each other).
    3) ber- + doubled root, no -an = repeated or aimless action: berjalan-jalan (stroll), bermain-main (play around / fool about).
    4) With time units = for … on end: berjam-jam (for hours), berhari-hari (for days), bertahun-tahun (for years).
    5) berbondong-bondong = in droves.
    The root is what doubles, and -an goes at the very end: bersalam-salaman. saling (each other) alone does the same job — saling memaafkan or bermaaf-maafan, not both together.
examples:
  - text: Anak-anak berlari-larian di pantai.
    breakdown: ber- + lari-lari + -an (run about)
    en: The children are running about on the beach.
    ar_eg: العيال بيجروا هنا وهناك على الشط.
    ar: يتراكض الأطفال على الشاطئ.
  - text: Warga datang berbondong-bondong ke pantai untuk mencari nyale.
    breakdown: ber- + bondong-bondong (in droves)
    en: Villagers come to the beach in droves to catch nyale worms.
    ar_eg: الناس بييجوا الشط أفواج عشان يصطادوا ديدان النيالي.
    ar: يأتي الأهالي أفواجًا إلى الشاطئ لصيد ديدان النيالي.
  - text: Putri Mandalika berpikir berhari-hari, tetapi tidak bisa memilih.
    en: Princess Mandalika thought for days on end but couldn't choose.
    ar_eg: الأميرة مانداليكا فضلت تفكر أيام وأيام، بس ما قدرتش تختار.
    ar: فكّرت الأميرة مانداليكا أيامًا طويلة، لكنها لم تستطع الاختيار.
  - text: Pada hari Lebaran, kami bermaaf-maafan.
    breakdown: ber- + maaf-maaf + -an (forgive each other)
    en: On Lebaran day we ask each other's forgiveness.
    ar_eg: يوم العيد بنسامح بعض.
    ar: في يوم العيد يتسامح بعضنا مع بعض.
  - text: Para pangeran sudah menunggu berjam-jam di istana.
    en: The princes had been waiting for hours at the palace.
    ar_eg: الأمرا كانوا مستنيين ساعات في القصر.
    ar: كان الأمراء ينتظرون ساعاتٍ في القصر.
  - text: Anak-anak bermain di taman.
    en: The children are playing in the park. (plain ber- verb — compare bermain-main, "fooling around")
    ar_eg: العيال بيلعبوا في الجنينة.
    ar: يلعب الأطفال في الحديقة.
mistakes:
  - wrong: bersalaman-salaman
    right: bersalam-salaman
    why:
      ar_eg: الجذر (salam) هو اللي بيتكرر، و -an بتيجي مرة واحدة في الآخر.
      ar: يُكرَّر الجذر وتأتي -an مرة واحدة في الآخر.
      en: Double the root; -an comes once, at the end.
  - wrong: Kami saling bermaaf-maafan.
    right: Kami bermaaf-maafan. / Kami saling memaafkan.
    why:
      ar_eg: saling ومعنى التبادل في التكرار نفس الحاجة؛ استعمل واحد بس.
      ar: saling وصيغة التبادل بمعنى واحد فلا يُجمع بينهما.
      en: saling and the reciprocal form mean the same; use one.
  - wrong: Saya tinggal di Lombok bertahun.
    right: Saya tinggal di Lombok bertahun-tahun.
    why:
      ar_eg: «سنين طويلة» = bertahun-tahun بالتكرار؛ bertahun لوحدها مش بتستعمل كده.
      ar: "معنى «سنوات طويلة» يحتاج التكرار: bertahun-tahun."
      en: '"For years" needs the doubled form: bertahun-tahun.'
arabic_bridge:
  ar_eg: "معنى التبادل هنا هو وزن «تفاعَل» عندنا: bersalam-salaman = تصافحوا، bermaaf-maafan = تسامحوا، berkejar-kejaran = تطاردوا. ولو قلت «سنين وسنين» أو «ساعات وساعات» يبقى ده bertahun-tahun و berjam-jam — احنا كمان بنكرر!"
  ar: "يقابل التبادلُ هنا صيغة «تفاعَل»: تصافحوا (bersalam-salaman)، تسامحوا (bermaaf-maafan)، تطاردوا (berkejar-kejaran)، ويقابل berhari-hari قولنا «أيامًا وأيامًا»."
  en: The reciprocal meaning matches Arabic Form VI تفاعَل (تصافحوا = bersalam-salaman, تسامحوا = bermaaf-maafan); berhari-hari is like saying «أيام وأيام».
