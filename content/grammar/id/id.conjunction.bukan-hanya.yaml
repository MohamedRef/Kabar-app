    note:
      ar_eg: "bukan hanya ... tetapi juga = مش بس ... لكن كمان."
      ar: "ليس فقط ... بل أيضًا."
      en: "bukan hanya … tetapi juga = not only … but also."
  - match: "baik … maupun"
    note:
      ar_eg: "baik ... maupun = سواء ... أو / الاتنين."
      ar: "baik ... maupun = سواءٌ ... أو."
      en: "baik … maupun = both … and."
  - match: "bukan … melainkan"
    note:
      ar_eg: "bukan ... melainkan = مش ... وإنما."
      ar: "bukan ... melainkan = ليس ... وإنما."
      en: "bukan … melainkan = not … but rather."
