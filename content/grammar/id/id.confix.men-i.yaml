schema: kabar.grammar/v1
id: id.confix.men-i
language: id
level: bipa3
title:
  target: meN-…-i (mendatangi, menyukai, menghadiri, menanami)
  en: The confix meN-…-i
  ar_eg: الإضافة meN-…-i
  ar: اللاصقة المزدوجة meN-…-i
summary:
  ar_eg: "-i بتخلي المكان أو الشخص اللي كان بعد حرف جر يبقى مفعول مباشر: datang ke rumah → mendatangi rumah. وساعات بتدي معنى التكرار."
  ar: "تجعل -i المكانَ أو الشخصَ الذي يلي حرفَ الجر مفعولًا به مباشرًا: datang ke rumah → mendatangi rumah، وقد تفيد التكرار."
  en: "-i turns the place or person after a preposition into a direct object (datang ke rumah → mendatangi rumah); sometimes it adds repetition."
pattern:
  - verb + preposition + place / person → meN- + root + -i + object (datang ke → mendatangi)
  - meN- + feeling + -i + object (suka → menyukai, cinta → mencintai)
  - meN- + root + -i + place + dengan + thing (menanami ladang dengan padi)
  - meN- + action + -i = do it repeatedly (memukuli, menembaki)
  - passive di-…-i (dikunjungi, dihadiri)
explanation:
  ar_eg: |
    -i فكرتها الأساسية «المكان أو الشخص اللي الفعل بيوصله»:
    1) بتشيل حرف الجر: datang ke rumah saya → mendatangi rumah saya (جه بيتي → قصد بيتي)، hadir di acara → menghadiri acara (حضر الحفلة)، duduk di kursi → menduduki kursi (قعد على / احتل الكرسي)، temu → menemui guru (راح قابل المدرس).
    2) مع المشاعر: suka → menyukai (يحب)، cinta → mencintai (يحب جدًا)، takut → menakuti (يخاف من / يخوّف)، hormat → menghormati (يحترم).
    3) «يحط حاجة على مكان»: menanami ladang dengan padi = زرع الغيط رز (المفعول هو الغيط!)، menulisi kertas = كتب على الورقة.
    4) تكرار: memukuli = ضرب كتير ورا بعض.
    -i في مقابل -kan: menanamkan padi = زرع الرز (المفعول هو الحاجة اللي بتتحرك)، menanami sawah = زرع الحقل (المفعول هو المكان).
    وبعد -i مفيش حرف جر خالص: menghadiri acara، مش menghadiri ke acara.
    في المستوى الرابع هتشوفها كتير في النصوص الرسمية: memperingati Hari Kartini، mengikuti upacara.
  ar: |
    الفكرة الأساسية لـ-i أن المفعول هو المكان أو الشخص الذي يصل إليه الفعل:
    1) حذف حرف الجر: datang ke rumah → mendatangi rumah (قصد البيت)، hadir di acara → menghadiri acara (حضر الحفل)، duduk di kursi → menduduki kursi (جلس على / احتلّ)، menemui guru (قابل المعلم).
    2) أفعال الشعور: menyukai (أحبّ)، mencintai (عشق)، menakuti (خشي، أو أخاف غيره)، menghormati (احترم).
    3) وضع شيء على مكان: menanami ladang dengan padi (زرع الحقل أرزًا)، menulisi kertas (كتب على الورقة).
    4) التكرار: memukuli (ضربه مرارًا).
    والمقابلة مع -kan: menanamkan padi مفعوله الشيء المزروع، وmenanami sawah مفعوله المكان.
    ولا يلي -i حرفُ جر: menghadiri acara لا menghadiri ke acara.
    ويكثر في النصوص الرسمية: memperingati Hari Kartini، mengikuti upacara.
  en: |
    The core idea of -i: the object is the place or person the action reaches.
    1) It absorbs the preposition: datang ke rumah → mendatangi rumah (come to / visit the house), hadir di acara → menghadiri acara (attend the event), duduk di kursi → menduduki kursi (sit on / occupy), menemui guru (go and meet the teacher).
    2) Feelings: menyukai (like), mencintai (love), menakuti (fear, or frighten), menghormati (respect).
    3) Put something onto a place: menanami ladang dengan padi (plant the field with rice), menulisi kertas (write on the paper).
    4) Repetition: memukuli (hit over and over).
    -i vs -kan: menanamkan padi (plant rice — object = the thing moved); menanami sawah (plant the paddy — object = the place).
    No preposition after an -i verb: menghadiri acara, never menghadiri ke acara.
    At BIPA 4 you'll meet it in formal texts: memperingati Hari Kartini (commemorate), mengikuti upacara (take part in the ceremony).
examples:
  - text: Banyak turis mendatangi Gili Trawangan setiap tahun.
    breakdown: meN- + datang + -i (come to) · Gili Trawangan (object)
    en: Many tourists come to Gili Trawangan every year.
    ar_eg: سياح كتير بييجوا جيلي تراوانجان كل سنة.
    ar: يقصد كثير من السياح جزيرة جيلي تراوانغان كل عام.
  - text: Saya sangat menyukai film itu.
    breakdown: meN- + suka + -i (like) · film itu
    en: I really like that film.
    ar_eg: أنا بحب الفيلم ده جدًا.
    ar: أحب ذلك الفيلم كثيرًا.
  - text: Kami menghadiri pemutaran film di pantai.
    breakdown: meN- + hadir + -i (attend) · pemutaran film (screening)
    en: We attended a film screening on the beach.
    ar_eg: حضرنا عرض فيلم على الشط.
    ar: حضرنا عرض فيلم على الشاطئ.
  - text: Tokoh utama film itu menemui ayahnya di Lombok.
    en: The film's main character goes to meet his father in Lombok.
    ar_eg: البطل في الفيلم بيروح يقابل أبوه في لومبوك.
    ar: يذهب بطل الفيلم للقاء أبيه في لومبوك.
  - text: Bu Sari menanami halaman rumahnya dengan bunga.
    en: Bu Sari planted her front yard with flowers.
    ar_eg: طنط ساري زرعت جنينة بيتها ورد.
    ar: زرعت السيدة ساري فناء بيتها بالزهور.
  - text: Setiap 21 April, kita memperingati Hari Kartini.
    en: Every 21 April we commemorate Kartini Day.
    ar_eg: كل ٢١ أبريل بنحتفل بذكرى يوم كارتيني.
    ar: نحيي ذكرى يوم كارتيني في الحادي والعشرين من أبريل كل عام.
    register: formal
mistakes:
  - wrong: Kami menghadiri ke acara itu.
    right: Kami menghadiri acara itu.
    why:
      ar_eg: -i خلاص «أكلت» حرف الجر؛ المفعول بييجي على طول.
      ar: تغني -i عن حرف الجر، فيأتي المفعول مباشرة.
      en: -i already replaces the preposition; the object follows directly.
  - wrong: Turis mendatangkan Gili setiap tahun.
    right: Turis mendatangi Gili setiap tahun.
    why:
      ar_eg: mendatangkan = يجيب حاجة / حد (يستورد)، mendatangi = يروح لمكان.
      ar: mendatangkan بمعنى جلب، وmendatangi بمعنى قصد المكان.
      en: mendatangkan = bring in / import; mendatangi = come to a place.
  - wrong: Saya menyukakan film itu.
    right: Saya menyukai film itu.
    why:
      ar_eg: «يحب» من suka بتاخد -i مش -kan.
      ar: الفعل من suka يأخذ -i لا -kan.
      en: The verb from suka takes -i, not -kan.
arabic_bridge:
  ar_eg: "اتنين من أشهر أفعال -i جذرهم عربي: hadir (حاضر) → menghadiri = يحضر (حضرنا الحفلة — من غير حرف جر، زي العربي بالظبط!)، و akhir (آخر) → mengakhiri = يُنهي. وفكرة -i شبه «التعدية» في العربي: جاء إلى البيت → قصد البيت."
  ar: "من أفعال -i الشائعة ما أصله عربي: hadir (حاضر) → menghadiri (حضر الحفل، متعديًا بنفسه كما في العربية)، وakhir (آخر) → mengakhiri (أنهى). ووظيفة -i تشبه تعدية الفعل بنفسه بدل حرف الجر."
  en: Two common -i verbs have Arabic roots — hadir (حاضر) → menghadiri "attend" (transitive, just like Arabic حضر الحفل), and akhir (آخر) → mengakhiri "end".
