cues:
  - match: "katanya"
    note:
      ar_eg: "katanya = بيقولوا / على حد قوله."
      ar: "katanya = يُقال / على حد قوله."
      en: "katanya = they say / reportedly."
  - match: "bahwa"
    note:
      ar_eg: "bahwa = إن (بعد قال، عرف...)."
      ar: "bahwa = أنّ."
      en: "bahwa = that (after say, know…)."
