schema: kabar.grammar/v1
id: id.hedging
language: id
level: bipa5
title:
  target: tampaknya, barangkali, cenderung, kurang …
  en: Hedging and softening claims
  ar_eg: تلطيف الكلام والتحفّظ (يبدو إن، يمكن، نوعًا ما)
  ar: التحوّط وتلطيف الأحكام
summary:
  ar_eg: "الإندونيسي مابيحبش الكلام القاطع والمواجهة. بتلطّف بـ tampaknya (يبدو إن)، barangkali / mungkin (يمكن)، cenderung (يميل إنه)، agak (شوية)، وkurang بدل «لا»: kurang setuju = مش موافق قوي (يعني مش موافق)."
  ar: "تتجنب الإندونيسية القطع والمواجهة، فتلطّف بـ tampaknya وbarangkali وcenderung وagak، وتستعمل kurang بدل النفي الصريح: kurang setuju أي لست موافقًا."
  en: "Indonesian avoids flat claims and confrontation. Soften with tampaknya (it seems), barangkali / mungkin (perhaps), cenderung (tends to), agak (somewhat), and kurang instead of a blunt 'not': kurang setuju = I don't quite agree (= I disagree)."
pattern:
  - "Tampaknya / Kelihatannya / Sepertinya, + claim"
  - "barangkali / mungkin / bisa jadi / boleh jadi + claim"
  - "X cenderung + verb/adjective   (tends to)"
  - "kurang + adjective/verb = polite negation: kurang tepat, kurang setuju"
  - "pada umumnya / sebagian besar / relatif / dapat dikatakan …"
  - "refusal: Mohon maaf, sepertinya … belum bisa … / Akan kami pertimbangkan dulu."
explanation:
  ar_eg: |
    في مقالات الرأي والتفاوض الإندونيسي، الكلام المباشر قوي بيبان قلة أدب. فبيلطّفوا على كذا مستوى:
    1. الثقة في المعلومة:
       - tampaknya / kelihatannya / agaknya (رسمي) = يبدو إن؛ sepertinya أخف وأكتر في الكلام.
       - barangkali / mungkin / bisa jadi = يمكن / وارد.
       - cenderung = يميل إنه: Data itu cenderung menunjukkan penurunan.
    2. الكمية والتعميم: pada umumnya (عمومًا)، sebagian besar (أغلب)، relatif (نسبيًا)، sekitar / kurang lebih (حوالي)، dapat dikatakan (ممكن نقول).
    3. الرفض والاعتراض المؤدب:
       - kurang = «مش أوي» بس معناها الحقيقي «لا»: Pendapat itu kurang tepat = الرأي ده مش دقيق (يعني غلط). Saya kurang setuju = مش موافق.
       - agak = شوية: Harganya agak tinggi = السعر عالي شوية (يعني عالي).
       - belum bisa = «لسه مش هينفع» = لا مهذبة.
       - «Akan kami pertimbangkan dulu» = هندرس الموضوع (وغالبًا = لا).
    4. افتتاحيات تحمي الوجه: Mohon maaf sebelumnya, … / Menurut hemat saya, … (في رأيي المتواضع) / Kalau boleh saya berpendapat, …
    القاعدة: كل ما الموقف رسمي أو فيه خلاف، زوّد التلطيف؛ بس مش لدرجة إن كلامك يضيع: tampaknya mungkin barangkali في جملة واحدة كتير.
  ar: |
    يُعدّ القطع المباشر في مقالات الرأي والتفاوض الإندونيسي فظاظة، فيُلطَّف الكلام على مستويات:
    1. درجة اليقين: tampaknya / kelihatannya / agaknya (يبدو أن)، وsepertinya أخف، وbarangkali / mungkin / bisa jadi (ربما)، وcenderung (يميل إلى).
    2. الكم والتعميم: pada umumnya، sebagian besar، relatif، kurang lebih، dapat dikatakan.
    3. الاعتراض والرفض المهذب: kurang + صفة يعني النفي في الحقيقة (kurang tepat = غير دقيق، kurang setuju = لا أوافق)، وagak (قليلًا)، وbelum bisa (لا يمكن الآن = رفض مهذب)، و«Akan kami pertimbangkan dulu» (سندرس الأمر، وكثيرًا ما تعني الرفض).
    4. عبارات حفظ ماء الوجه: Mohon maaf sebelumnya، Menurut hemat saya (في تقديري المتواضع).
    ويُزاد التلطيف بقدر رسمية المقام وحدّة الخلاف، دون إفراط يُضيّع المعنى.
  en: |
    In Indonesian op-eds and negotiation, very direct statements read as rude, so speakers soften on several levels:
    1. Certainty:
       - tampaknya / kelihatannya / agaknya (formal) = it seems; sepertinya is lighter and more spoken.
       - barangkali / mungkin / bisa jadi = perhaps, it may be.
       - cenderung = tends to: Data itu cenderung menunjukkan penurunan.
    2. Quantity and generality: pada umumnya (generally), sebagian besar (most), relatif (relatively), sekitar / kurang lebih (about), dapat dikatakan (one could say).
    3. Polite disagreement and refusal:
       - kurang = "not quite", but it really means "not": Pendapat itu kurang tepat = That view isn't accurate (= it's wrong). Saya kurang setuju = I don't agree.
       - agak = somewhat: Harganya agak tinggi = The price is a bit high (= too high).
       - belum bisa = "can't yet" = a polite no.
       - "Akan kami pertimbangkan dulu" = we'll consider it (often = no).
    4. Face-saving openers: Mohon maaf sebelumnya, … / Menurut hemat saya, … (in my humble view) / Kalau boleh saya berpendapat, …
    Rule of thumb: the more formal or contentious the setting, the more you hedge — but not so much the point disappears: tampaknya mungkin barangkali in one sentence is too much.
examples:
  - text: Tampaknya, survei itu belum mewakili suara warga di luar Pulau Jawa.
    en: It seems the survey doesn't yet represent the views of people outside Java.
    ar_eg: يبدو إن الاستطلاع ده لسه مش ممثّل لرأي الناس برا جزيرة جاوة.
    ar: يبدو أن الاستطلاع لا يمثّل بعدُ آراء السكان خارج جزيرة جاوة.
    register: formal
  - text: Menurut hemat saya, kebijakan ini barangkali perlu dikaji ulang.
    en: In my humble view, this policy may need to be reviewed.
    ar_eg: في رأيي المتواضع، السياسة دي يمكن محتاجة تتراجع تاني.
    ar: في تقديري المتواضع، ربما تحتاج هذه السياسة إلى مراجعة.
    register: formal
  - text: Mohon maaf, saya kurang sependapat dengan penulis artikel ini.
    en: I'm sorry, but I don't quite share the author's view.
    ar_eg: معلش، أنا مش متفق قوي مع كاتب المقال ده.
    ar: عذرًا، لا أتفق تمامًا مع كاتب هذا المقال.
    register: formal
  - text: Harga yang Bapak tawarkan sepertinya masih agak tinggi untuk kami.
    en: The price you're offering seems a little high for us still, sir.
    ar_eg: السعر اللي حضرتك عارضه شكله لسه عالي شوية علينا.
    ar: يبدو أن السعر الذي تعرضونه ما زال مرتفعًا بعض الشيء بالنسبة إلينا.
    register: formal
  - text: Data tersebut cenderung menunjukkan penurunan kepercayaan publik terhadap media.
    en: The data tend to show a decline in public trust in the media.
    ar_eg: البيانات دي بتميل إنها توضّح تراجع ثقة الناس في الإعلام.
    ar: تميل تلك البيانات إلى إظهار تراجع ثقة الجمهور بوسائل الإعلام.
    register: formal
  - text: Untuk saat ini kami belum bisa menerima tawaran tersebut.
    en: For now we're not able to accept that offer.
    ar_eg: "في الوقت الحالي لسه مش هنقدر نقبل العرض ده. (يعني: لا، بأدب)"
    ar: لا يمكننا في الوقت الراهن قبول ذلك العرض.
    register: formal
mistakes:
  - wrong: Pendapat Anda salah.
    right: Mohon maaf, pendapat Anda kurang tepat.
    why:
      ar_eg: الجملة صح نحويًا، بس في نقاش رسمي بتبان هجوم. kurang tepat بتقول نفس المعنى بأدب.
      ar: الجملة سليمة نحويًّا لكنها جارحة في النقاش الرسمي، وkurang tepat تؤدي المعنى بلطف.
      en: Grammatical, but in a formal debate it sounds like an attack; kurang tepat says the same thing politely.
  - wrong: Saya kurang setuju. (understood as "I partly agree")
    right: Saya kurang setuju. (= "I disagree", politely)
    why:
      ar_eg: kurang هنا مش «موافق شوية»، دي «لا» مهذبة. افهمها كرفض.
      ar: kurang هنا نفي مهذب لا موافقة جزئية.
      en: kurang here isn't partial agreement — it's a polite no. Read it as disagreement.
  - wrong: Tampaknya mungkin barangkali harga akan naik.
    right: Tampaknya harga akan naik. / Harga barangkali akan naik.
    why:
      ar_eg: أداة تلطيف واحدة كفاية؛ التلاتة مع بعض بيخلّوا الكلام ملوش معنى.
      ar: تكفي أداة تحوّط واحدة، وتكديسها يُضعف المعنى.
      en: One hedge is enough; stacking three makes the claim meaningless.
arabic_bridge:
  ar_eg: "عندنا نفس الفن: tampaknya = «يبدو إن / شكله كده»، barangkali = «يمكن / وارد»، agak = «شوية / نوعًا ما»، Menurut hemat saya = «في رأيي المتواضع». وbelum bisa شبه «ربنا يسهّل» لما المصري يقصد لا من غير ما يقولها."
  ar: "tampaknya = يبدو أن، barangkali = ربما، agak = نوعًا ما، Menurut hemat saya = في تقديري المتواضع. وتشبه belum bisa في وظيفتها قول المصري «ربنا يسهّل» حين يريد الرفض دون تصريح."
  en: "tampaknya ≈ يبدو أن, barangkali ≈ ربما, agak ≈ نوعًا ما, Menurut hemat saya ≈ في رأيي المتواضع. belum bisa works like Egyptian «ربنا يسهّل» — a no that never says no."
