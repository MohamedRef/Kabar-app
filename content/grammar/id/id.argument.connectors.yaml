schema: kabar.grammar/v1
id: id.argument.connectors
language: id
level: bipa5
title:
  target: Selain itu, di sisi lain, dengan demikian
  en: Connectors for building an argument
  ar_eg: أدوات بناء الحجة (علاوة على ذلك، من ناحية تانية، وبالتالي)
  ar: أدوات بناء الحجّة
summary:
  ar_eg: "عشان تعمل مقال أو عرض منطقي: ضيف (Selain itu)، قارن (Di satu sisi … di sisi lain)، اديك مثال (Misalnya)، واستنتج (Dengan demikian / Oleh karena itu). كلهم في أول الجملة وبعدهم فاصلة."
  ar: "تُبنى الحجّة بأدوات للإضافة (Selain itu) والموازنة (Di satu sisi … di sisi lain) والتمثيل (Misalnya) والاستنتاج (Dengan demikian / Oleh karena itu)، وتليها فاصلة في صدر الجملة."
  en: "Build an argument with connectors that add (Selain itu), weigh (Di satu sisi … di sisi lain), illustrate (Misalnya) and conclude (Dengan demikian / Oleh karena itu); at the start of a sentence they take a comma."
pattern:
  - "Order: Pertama, … Kedua, … Terakhir, …"
  - "Add: Selain itu, / Di samping itu, / Lagi pula, / Bahkan, …"
  - "Weigh: Di satu sisi, … Di sisi lain, … / Sebaliknya, …"
  - "Illustrate: Misalnya, / Sebagai contoh, / Dengan kata lain, …"
  - "Conclude: Oleh karena itu, / Dengan demikian, / Jadi, / Singkatnya, / Kesimpulannya, …"
  - "selain + noun/verb (inside a sentence): Selain mahal, proyek ini …"
explanation:
  ar_eg: |
    المقال الجدلي أو العرض (زي نقاش نقل العاصمة) محتاج «إشارات مرور» عشان القارئ يعرف إنت رايح فين:
    - الترتيب: Pertama، Kedua، Ketiga، Terakhir.
    - الإضافة: Selain itu (علاوة على ذلك)، Di samping itu (رسمية)، Lagi pula (وكمان، أخف)، Bahkan (بل / حتى، لنقطة أقوى).
    - الموازنة: Di satu sisi … Di sisi lain … (من ناحية … ومن ناحية تانية)، Sebaliknya (بالعكس).
    - المثال والتوضيح: Misalnya / Sebagai contoh، Dengan kata lain (بمعنى تاني).
    - الاستنتاج: Oleh karena itu (عشان كده)، Dengan demikian (وبالتالي، رسمية جدًا)، Jadi (يعني، أبسط)، Singkatnya / Kesimpulannya.
    قواعد صغيرة بس مهمة:
    - في أول الجملة، حط فاصلة بعد الأداة: Selain itu, …
    - selain itu بتربط جملتين؛ selain لوحدها بتيجي قبل اسم أو صفة جوه نفس الجملة: Selain mahal, proyek ini juga berisiko.
    - ماتبدأش الجملة بـ Tetapi أو Sehingga في الكتابة الرسمية؛ قول Akan tetapi / Namun، أو Akibatnya.
    - في العرض الشفهي (بريزنتيشن) نفس الأدوات بتنظم الكلام: «Pertama, saya akan membahas …; selanjutnya …; sebagai penutup …».
  ar: |
    يحتاج المقال الجدلي أو العرض إلى علامات توجّه القارئ:
    - الترتيب: Pertama، Kedua، Terakhir.
    - الإضافة: Selain itu، Di samping itu، Lagi pula، Bahkan (بل) للحجة الأقوى.
    - الموازنة: Di satu sisi … Di sisi lain …، وSebaliknya (على العكس).
    - التمثيل والتوضيح: Misalnya، Sebagai contoh، Dengan kata lain.
    - الاستنتاج: Oleh karena itu، Dengan demikian، Jadi، Singkatnya، Kesimpulannya.
    وتُوضع فاصلة بعد الأداة في صدر الجملة. وselain itu تربط جملتين، أما selain فتسبق اسمًا أو صفة داخل الجملة. ولا يُبتدأ بـ Tetapi أو Sehingga في الكتابة الرسمية، بل بـ Akan tetapi / Namun أو Akibatnya.
  en: |
    An argumentative essay or talk (say, on moving the capital) needs signposts so the reader knows where you're going:
    - Order: Pertama, Kedua, Ketiga, Terakhir.
    - Add: Selain itu (in addition), Di samping itu (formal), Lagi pula (besides, lighter), Bahkan (in fact / even — for a stronger point).
    - Weigh: Di satu sisi … Di sisi lain … (on the one hand … on the other), Sebaliknya (conversely).
    - Illustrate: Misalnya / Sebagai contoh, Dengan kata lain (in other words).
    - Conclude: Oleh karena itu (therefore), Dengan demikian (thus, very formal), Jadi (so), Singkatnya / Kesimpulannya.
    Small but important rules:
    - At the start of a sentence, put a comma after the connector: Selain itu, …
    - selain itu links sentences; bare selain goes before a noun or adjective inside one sentence: Selain mahal, proyek ini juga berisiko.
    - Don't open a formal sentence with Tetapi or Sehingga; use Akan tetapi / Namun, or Akibatnya.
    - In a spoken presentation the same connectors structure the talk: "Pertama, saya akan membahas …; selanjutnya …; sebagai penutup …".
examples:
  - text: Pemindahan ibu kota diharapkan mengurangi beban Jakarta. Selain itu, pembangunan akan lebih merata di luar Jawa.
    en: Moving the capital is expected to ease the burden on Jakarta. In addition, development will be spread more evenly outside Java.
    ar_eg: نقل العاصمة متوقع يخفف الضغط عن جاكرتا. وكمان التنمية هتتوزع أحسن برا جاوة.
    ar: يُتوقَّع أن يخفف نقل العاصمة العبء عن جاكرتا. وعلاوة على ذلك ستتوزع التنمية بعدل أكبر خارج جاوة.
    register: formal
  - text: Di satu sisi, IKN membuka lapangan kerja baru. Di sisi lain, hutan di sekitarnya terancam.
    en: On the one hand, IKN creates new jobs. On the other, the surrounding forest is under threat.
    ar_eg: من ناحية، العاصمة الجديدة بتفتح فرص شغل. ومن ناحية تانية، الغابة اللي حواليها في خطر.
    ar: من ناحية، توفّر العاصمة الجديدة فرص عمل، ومن ناحية أخرى تتعرض الغابات المحيطة بها للخطر.
    register: formal
  - text: Biayanya sangat besar. Bahkan, sebagian dana harus berasal dari investor swasta.
    en: The cost is huge. In fact, part of the funding has to come from private investors.
    ar_eg: التكلفة ضخمة جدًا. بل كمان جزء من الفلوس لازم ييجي من مستثمرين من القطاع الخاص.
    ar: التكلفة هائلة، بل إن جزءًا من التمويل يجب أن يأتي من مستثمرين من القطاع الخاص.
  - text: Data penduduk Jakarta terus bertambah. Dengan demikian, pemindahan sebagian fungsi pemerintahan dapat dipahami.
    en: Jakarta's population keeps growing. Thus, moving some government functions is understandable.
    ar_eg: عدد سكان جاكرتا بيزيد على طول. وبالتالي، نقل جزء من وظايف الحكومة مفهوم.
    ar: يتزايد سكان جاكرتا باستمرار، وبالتالي فإن نقل بعض وظائف الحكومة أمر مفهوم.
    register: formal
  - text: Selain mahal, rencana itu juga dikritik karena kurang melibatkan masyarakat adat.
    breakdown: selain + adjective (inside the sentence) · juga · dikritik · karena · kurang melibatkan (doesn't involve enough)
    en: Besides being expensive, the plan is also criticised for not involving Indigenous communities enough.
    ar_eg: غير إنها غالية، الخطة كمان بتتنقد عشان مش مشركة المجتمعات الأصلية كفاية.
    ar: فضلًا عن كلفتها العالية، تُنتقد الخطة لقلة إشراكها المجتمعات الأصلية.
mistakes:
  - wrong: Proyek ini mahal. Selain, proyek ini merusak hutan.
    right: Proyek ini mahal. Selain itu, proyek ini merusak hutan.
    why:
      ar_eg: في أول الجملة الجديدة لازم Selain itu (علاوة على «ذلك»). selain لوحدها محتاجة اسم أو صفة بعدها.
      ar: في صدر الجملة يُقال Selain itu، أما selain وحدها فتحتاج اسمًا أو صفة بعدها.
      en: To open a new sentence you need Selain itu; bare selain needs a noun or adjective after it.
  - wrong: Banyak warga setuju. Tetapi, ahli lingkungan menolak.
    right: Banyak warga setuju. Akan tetapi, ahli lingkungan menolak. / Namun, ahli lingkungan menolak.
    why:
      ar_eg: tetapi أداة جوه الجملة. في أول جملة جديدة في الكتابة الرسمية استخدم Akan tetapi أو Namun.
      ar: tetapi أداة داخل الجملة، وفي صدر الجملة الرسمية يُستعمل Akan tetapi أو Namun.
      en: tetapi joins clauses within a sentence; to open a formal sentence use Akan tetapi or Namun.
  - wrong: Oleh karena itu pemerintah harus berhati-hati.
    right: Oleh karena itu, pemerintah harus berhati-hati.
    why:
      ar_eg: قاعدة EYD - بعد أدوات الربط بين الجمل في أول الجملة بتحط فاصلة.
      ar: توجب قواعد EYD وضع فاصلة بعد أداة الربط بين الجمل في صدر الجملة.
      en: EYD puts a comma after a sentence-linking connector at the start of a sentence.
arabic_bridge:
  ar_eg: "الأدوات دي ليها مقابل عربي واضح: Selain itu = علاوة على ذلك، Di satu sisi … di sisi lain = من ناحية … ومن ناحية أخرى، Bahkan = بل، Oleh karena itu = لذلك، Dengan demikian = وبالتالي، Dengan kata lain = بعبارة أخرى. لو بتعرف تكتب مقال بالفصحى، إنت عارف الهيكل؛ بس غيّر الكلمات."
  ar: "Selain itu = علاوة على ذلك، Di satu sisi … di sisi lain = من ناحية … ومن ناحية أخرى، Bahkan = بل، Oleh karena itu = لذلك، Dengan demikian = وبالتالي، Dengan kata lain = بعبارة أخرى."
  en: "These map neatly onto Arabic essay connectors: Selain itu = علاوة على ذلك, Di satu sisi … di sisi lain = من ناحية … ومن ناحية أخرى, Bahkan = بل, Oleh karena itu = لذلك, Dengan demikian = وبالتالي."
