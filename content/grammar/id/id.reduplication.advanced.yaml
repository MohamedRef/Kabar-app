schema: kabar.grammar/v1
id: id.reduplication.advanced
language: id
level: bipa4
title:
  target: pepohonan, warna-warni, tolong-menolong, kemerah-merahan, sebaik-baiknya
  en: Advanced reduplication — partial, rhyming and affixed
  ar_eg: تكرار متقدم — جزئي، مسجوع، وبالإضافات
  ar: التكرار المتقدم — الجزئي والمتغير الصوت والمقترن باللواحق
summary:
  ar_eg: "التكرار في المستوى ده: جزئي (pepohonan = شجر كتير)، بتغيير صوت (warna-warni = ملوّن)، مع إضافات (tolong-menolong = يساعدوا بعض، sebaik-baiknya = على أحسن وجه)."
  ar: "صور متقدمة للتكرار: الجزئي (pepohonan)، والمتغير الصوت (warna-warni)، والمقترن باللواحق (tolong-menolong، sebaik-baiknya)."
  en: "Advanced doubling: partial (pepohonan = trees of all kinds), with sound change (warna-warni = colourful), and with affixes (tolong-menolong = help one another, sebaik-baiknya = as well as possible)."
pattern:
  - "partial (first syllable + e): pohon → pepohonan, daun → dedaunan, rumput → rerumputan, luhur → leluhur"
  - "sound change: warna-warni, sayur-mayur, lauk-pauk, bolak-balik, gerak-gerik, ramah-tamah, mondar-mandir"
  - "root + meN-root = mutual (tolong-menolong, surat-menyurat, bantu-membantu)"
  - "ke-…-an on doubled colour / noun = -ish, -like (kemerah-merahan, kebarat-baratan)"
  - "se-…-…-nya = as … as possible (sebaik-baiknya, secepat-cepatnya)"
  - "obligatory doubling: kupu-kupu, laba-laba, ubur-ubur (never single)"
explanation:
  ar_eg: |
    في المستوى التاني عرفت التكرار للجمع ولـ jalan-jalan و sayur-mayur. هنا الأنواع الأرسم:
    1) تكرار جزئي (أول مقطع + e)، أدبي شوية ومعناه «كتير ومتنوع»: pohon → pepohonan (أشجار)، daun → dedaunan (أوراق شجر)، rumput → rerumputan (حشايش)، luhur → leluhur (الأجداد).
    2) بتغيير صوت، معناه تنوع أو حركة رايحة جاية: warna-warni (ألوان كتير / ملوّن)، gerak-gerik (تصرفات وحركات)، ramah-tamah (لطف وكرم)، mondar-mandir (رايح جاي)، bolak-balik (ذهاب وعودة).
    3) جذر + meN-جذر = متبادل: tolong-menolong (يساعدوا بعض)، surat-menyurat (مراسلات)، bantu-membantu.
    4) ke- + تكرار + -an = «شبه / مايل لـ»: kemerah-merahan (مايل للأحمر)، kebarat-baratan (متأثر بالغرب)، kekanak-kanakan (تصرفات عيال).
    5) se- + تكرار + -nya = «على قد ما تقدر»: sebaik-baiknya (على أحسن وجه)، secepat-cepatnya (بأسرع ما يمكن)، setinggi-tingginya.
    6) كلمات لازم تتكرر وإلا متبقاش كلمة: kupu-kupu (فراشة)، laba-laba (عنكبوت)، ubur-ubur (قنديل البحر) — دول مش جمع!
    وخلي بالك: بعد كلمة كمية (banyak، semua، tiga) ما تكررش: banyak buku، مش banyak buku-buku.
  ar: |
    بعد التكرار للجمع وللتنويع البسيط، هذه الصور الأرقى:
    1) التكرار الجزئي (المقطع الأول + e) للكثرة والتنوع، وهو أدبي: pepohonan، dedaunan، rerumputan، leluhur (الأسلاف).
    2) التكرار مع تغيّر الصوت للتنوع أو التردد: warna-warni، gerak-gerik، ramah-tamah، mondar-mandir، bolak-balik.
    3) الجذر + meN- الجذر للتبادل: tolong-menolong (التعاون)، surat-menyurat (المراسلة).
    4) ke- + المكرر + -an للمشابهة: kemerah-merahan (ضارب إلى الحمرة)، kebarat-baratan (متغرّب)، kekanak-kanakan (صبياني).
    5) se- + المكرر + -nya للغاية القصوى: sebaik-baiknya، secepat-cepatnya.
    6) ألفاظ لا تكون إلا مكررة: kupu-kupu، laba-laba، ubur-ubur، وليست جمعًا.
    ولا يُكرَّر الاسم بعد ألفاظ الكم: banyak buku لا banyak buku-buku.
  en: |
    At BIPA 2 you met plural doubling, jalan-jalan and sayur-mayur. Now the more literary types:
    1) Partial (first syllable + e) = many and varied, a bit literary: pohon → pepohonan (trees), daun → dedaunan (foliage), rumput → rerumputan (grasses), luhur → leluhur (ancestors).
    2) Sound change = variety or back-and-forth: warna-warni (multicoloured), gerak-gerik (movements, behaviour), ramah-tamah (hospitality), mondar-mandir (pace up and down), bolak-balik (back and forth).
    3) root + meN-root = mutual action: tolong-menolong (help one another), surat-menyurat (correspondence), bantu-membantu.
    4) ke- + doubled + -an = -ish / -like: kemerah-merahan (reddish), kebarat-baratan (westernised), kekanak-kanakan (childish).
    5) se- + doubled + -nya = as … as possible: sebaik-baiknya (as well as possible), secepat-cepatnya.
    6) Words that only exist doubled: kupu-kupu (butterfly), laba-laba (spider), ubur-ubur (jellyfish) — not plurals!
    Remember: no doubling after a quantity word — banyak buku, not banyak buku-buku.
examples:
  - text: Truk pasir bolak-balik di jalan desa kami setiap hari.
    en: Sand trucks go back and forth on our village road every day.
    ar_eg: عربيات الرمل رايحة جاية في طريق قريتنا كل يوم.
    ar: تذهب شاحنات الرمل وتجيء في طريق قريتنا كل يوم.
  - text: Warga Maros masih hidup tolong-menolong.
    breakdown: tolong + meN-tolong = help one another
    en: People in Maros still live helping one another.
    ar_eg: أهل ماروس لسه عايشين بيساعدوا بعض.
    ar: ما زال أهل ماروس يعيشون في تعاون متبادل.
  - text: Di sekitar gua, pepohonan tumbuh lebat.
    breakdown: pe- + pohon + -an (trees of all kinds)
    en: Around the cave, trees grow thickly.
    ar_eg: حوالين الكهف، الشجر نابت كتير وكثيف.
    ar: تنمو الأشجار كثيفةً حول الكهف.
    register: formal
  - text: Kupu-kupu warna-warni terbang di Taman Nasional Bantimurung.
    en: Colourful butterflies fly in Bantimurung National Park.
    ar_eg: فراشات ملونة بتطير في محمية بانتيمورونج.
    ar: تطير الفراشات الملوّنة في حديقة بانتيمورونغ الوطنية.
  - text: Kami mohon jalan ini diperbaiki sebaik-baiknya.
    breakdown: se- + baik-baik + -nya (as well as possible)
    en: We ask that this road be repaired as well as possible.
    ar_eg: بنطلب إن الطريق ده يتصلح على أحسن وجه.
    ar: نرجو إصلاح هذا الطريق على أحسن وجه.
    register: formal
  - text: Langit sore itu kemerah-merahan.
    en: The evening sky was reddish.
    ar_eg: السما العصرية دي كانت مايلة للأحمر.
    ar: كانت سماء ذلك المساء ضاربة إلى الحمرة.
mistakes:
  - wrong: Ada banyak truk-truk di jalan.
    right: Ada banyak truk di jalan.
    why:
      ar_eg: banyak بتقول الجمع خلاص؛ ما تكررش.
      ar: تدل banyak على الكثرة فلا حاجة للتكرار.
      en: banyak already marks plural; don't double.
  - wrong: Ada kupu di taman.
    right: Ada kupu-kupu di taman.
    why:
      ar_eg: kupu-kupu كلمة واحدة متكررة دايمًا، حتى لو فراشة واحدة.
      ar: kupu-kupu لفظ لا يأتي إلا مكررًا، ولو للمفرد.
      en: kupu-kupu is always doubled, even for one butterfly.
  - wrong: Kerjakan sebaik-baik mungkin.
    right: Kerjakan sebaik-baiknya. / Kerjakan sebaik mungkin.
    why:
      ar_eg: يا se-…-nya بالتكرار، يا se- + mungkin من غير تكرار؛ ما تخلطش.
      ar: إما se-…-nya مع التكرار وإما se- … mungkin بلا تكرار.
      en: Either se-…-…-nya with doubling, or se- … mungkin without; don't mix.
arabic_bridge:
  ar_eg: "العربي عنده حاجة اسمها «الإتباع»: كلمتين بنفس الوزن والسجع زي «حَسَنٌ بَسَنٌ» و«هَرْجٌ ومَرْج» — ده بالظبط warna-warni و sayur-mayur. و tolong-menolong معناها «تعاوَن» (وزن تفاعَل)."
  ar: "يقابل التكرارَ المتغيرَ الصوت ما يُسمّى في العربية «الإتباع» (حَسَنٌ بَسَنٌ، هَرْجٌ ومَرْج)، ويقابل tolong-menolong صيغة «تعاوَن»."
  en: Rhyming doubles resemble Arabic itbāʿ (حسن بسن، هرج ومرج); tolong-menolong ≈ Form VI تعاون.
