schema: kabar.grammar/v1
id: id.collocation
language: id
level: bipa4
title:
  target: Kolokasi (mengambil keputusan, hujan deras, menarik wisatawan)
  en: Collocations — words that go together
  ar_eg: المتلازمات — كلمات بتيجي مع بعض
  ar: المتلازمات اللفظية
summary:
  ar_eg: "كل لغة ليها «أصحاب» للكلمات: بالإندونيسي mengambil keputusan (ياخد قرار) و hujan deras (مطر غزير) — مش hujan berat. احفظهم كقطع جاهزة."
  ar: "لكل لغة تلازمات ثابتة: mengambil keputusan (اتخذ قرارًا) وhujan deras (مطر غزير) لا hujan berat؛ فتُحفظ قطعًا جاهزة."
  en: "Every language has fixed word partners: mengambil keputusan (make a decision), hujan deras (heavy rain) — not hujan berat. Learn them as chunks."
pattern:
  - verb + noun (mengambil keputusan, menarik perhatian, mengajukan pertanyaan)
  - noun + adjective (hujan deras / lebat, angin kencang, kopi kental)
  - "economy and tourism: meningkatkan pendapatan, membuka lapangan kerja, memberikan dampak, melestarikan budaya"
  - "berdampak positif / negatif · menghadapi tantangan · memecahkan masalah"
explanation:
  ar_eg: |
    المتلازمات مش قواعد، دي «عادة» اللغة: الكلمتين دول بيمشوا مع بعض والترجمة الحرفية بتطلع غريبة.
    أفعال + أسماء مهمة للمقال:
    - mengambil keputusan = ياخد قرار (حرفيًا «ياخد» زي العربي!)
    - menarik perhatian / wisatawan = يجذب الانتباه / السياح (menarik = يشد).
    - mengajukan pertanyaan / usul = يطرح سؤال / اقتراح.
    - memberi contoh = يدي مثال (مش «يضرب»!).
    - memecahkan masalah = يحل مشكلة (حرفيًا «يكسر» المشكلة).
    - meningkatkan pendapatan = يزوّد الدخل، membuka lapangan kerja = يفتح فرص شغل.
    - memberikan dampak / berdampak positif = يعمل أثر إيجابي، menghadapi tantangan = يواجه تحديات.
    - menjaga kebersihan = يحافظ على النضافة، melestarikan budaya = يحافظ على الثقافة.
    اسم + صفة:
    - hujan deras / lebat = مطر غزير (مش berat = تقيل)، angin kencang = ريح شديدة، kopi kental = قهوة تقيلة، sakit parah = عيان جامد، macet total = زحمة خانقة.
    النصيحة: لما تتعلم اسم، اتعلم الفعل اللي بيمشي معاه.
  ar: |
    المتلازمات عادة لغوية لا قاعدة، والترجمة الحرفية تُنتج تعبيرًا غريبًا.
    فعل + اسم: mengambil keputusan (اتخذ قرارًا)، menarik perhatian / wisatawan (جذب الانتباه / السياح)، mengajukan pertanyaan (طرح سؤالًا)، memberi contoh (ضرب مثلًا)، memecahkan masalah (حلّ مشكلة)، meningkatkan pendapatan (زاد الدخل)، membuka lapangan kerja (أتاح فرص العمل)، berdampak positif (ذو أثر إيجابي)، menghadapi tantangan (واجه التحديات)، melestarikan budaya (صان الثقافة).
    اسم + صفة: hujan deras / lebat (مطر غزير)، angin kencang (ريح شديدة)، kopi kental (قهوة ثقيلة)، sakit parah (مرض شديد)، macet total (ازدحام خانق).
    والنصيحة أن تحفظ الاسم مع فعله المصاحب.
  en: |
    Collocations aren't rules but habits: these words travel together, and literal translation sounds odd.
    Verb + noun: mengambil keputusan (make — literally "take" — a decision), menarik perhatian / wisatawan (attract attention / tourists), mengajukan pertanyaan (ask / raise a question), memberi contoh (give an example), memecahkan masalah (solve — literally "break" — a problem), meningkatkan pendapatan (increase income), membuka lapangan kerja (create jobs), berdampak positif (have a positive impact), menghadapi tantangan (face challenges), menjaga kebersihan (keep things clean), melestarikan budaya (preserve culture).
    Noun + adjective: hujan deras / lebat (heavy rain — not berat), angin kencang (strong wind), kopi kental (strong coffee), sakit parah (seriously ill), macet total (gridlock).
    Tip: whenever you learn a noun, learn its verb partner too.
examples:
  - text: Festival budaya menarik banyak wisatawan ke Palu.
    breakdown: menarik (attract) + wisatawan (tourists)
    en: The cultural festival attracts many tourists to Palu.
    ar_eg: المهرجان الثقافي بيجذب سياح كتير لبالو.
    ar: يجذب المهرجان الثقافي كثيرًا من السياح إلى بالو.
  - text: Pariwisata dapat meningkatkan pendapatan warga dan membuka lapangan kerja.
    en: Tourism can raise local incomes and create jobs.
    ar_eg: السياحة ممكن تزوّد دخل الناس وتفتح فرص شغل.
    ar: يمكن للسياحة أن تزيد دخل السكان وتتيح فرص العمل.
    register: formal
  - text: Pemerintah daerah harus mengambil keputusan yang tepat.
    en: The local government must make the right decision.
    ar_eg: الحكومة المحلية لازم تاخد القرار الصح.
    ar: يجب على الحكومة المحلية أن تتخذ القرار الصائب.
    register: formal
  - text: Kemarin hujan deras dan angin kencang di Teluk Palu.
    en: Yesterday there was heavy rain and strong wind over Palu Bay.
    ar_eg: امبارح كان فيه مطر غزير وريح شديدة على خليج بالو.
    ar: هطلت أمس أمطار غزيرة وهبّت رياح شديدة على خليج بالو.
  - text: Boleh saya mengajukan pertanyaan?
    en: May I ask a question?
    ar_eg: ممكن أسأل سؤال؟
    ar: هل لي أن أطرح سؤالًا؟
    register: formal
  - text: Kita harus melestarikan budaya lokal dan menjaga kebersihan pantai.
    en: We must preserve local culture and keep the beaches clean.
    ar_eg: لازم نحافظ على الثقافة المحلية ونضافة الشطوط.
    ar: علينا صون الثقافة المحلية والحفاظ على نظافة الشواطئ.
mistakes:
  - wrong: Kemarin ada hujan berat.
    right: Kemarin hujan deras. / Kemarin hujan lebat.
    why:
      ar_eg: «مطر تقيل» ترجمة حرفية من الإنجليزي؛ الإندونيسي بيقول deras أو lebat.
      ar: «hujan berat» ترجمة حرفية؛ والصواب deras أو lebat.
      en: '"hujan berat" is a calque of "heavy rain"; Indonesian says deras or lebat.'
  - wrong: Guru memukul contoh.
    right: Guru memberi contoh.
    why:
      ar_eg: «ضرب مثلًا» في العربي، بس في الإندونيسي «يدي مثال» = memberi contoh؛ memukul = يضرب بإيده بس.
      ar: «ضرب مثلًا» عربية؛ والإندونيسية تقول memberi contoh، وmemukul للضرب الحقيقي.
      en: Arabic "strikes an example" (ضرب مثلًا), but Indonesian "gives" one — memberi contoh; memukul is only physical hitting.
  - wrong: Mohon membayar perhatian.
    right: Mohon perhatian. / Mohon perhatikan.
    why:
      ar_eg: «pay attention» مش بتتترجم حرفي؛ قول perhatian أو memperhatikan.
      ar: لا تُترجم «pay attention» حرفيًا؛ يُقال perhatian أو memperhatikan.
      en: '"Pay attention" isn''t literal in Indonesian — use perhatian / memperhatikan.'
arabic_bridge:
  ar_eg: "ساعات العربي بيساعدك: mengambil keputusan = «اتخذ / أخد قرار» بنفس الفعل، و hujan deras زي «مطر غزير» (مش تقيل). بس ساعات بيوقعك: «ضرب مثلًا» = memberi contoh (يدي)، و«حلّ المشكلة» = memecahkan masalah (يكسر)."
  ar: "يعينك العربي أحيانًا: mengambil keputusan = اتخذ قرارًا، وhujan deras = مطر غزير. ويخدعك أحيانًا: «ضرب مثلًا» = memberi contoh، و«حلّ المشكلة» = memecahkan masalah."
  en: Arabic sometimes helps (اتخذ قرارًا = mengambil keputusan; مطر غزير = hujan deras) and sometimes misleads (ضرب مثلًا = memberi contoh, not memukul).
