schema: kabar.grammar/v1
id: id.figurative.metaphor
language: id
level: bipa4
title:
  target: Metafora (buah hati, jantung kota, pahlawan tanpa tanda jasa)
  en: Metaphor
  ar_eg: الاستعارة
  ar: الاستعارة
summary:
  ar_eg: "الاستعارة = تشبيه من غير «زي»: Guru adalah pahlawan tanpa tanda jasa = المدرس بطل من غير وسام. وفيه استعارات بقت كلمات عادية: jantung kota = قلب المدينة."
  ar: "الاستعارة تشبيه بلا أداة: Guru adalah pahlawan tanpa tanda jasa، ومنها ما صار تعبيرًا شائعًا: jantung kota (قلب المدينة)."
  en: "A metaphor is a comparison without \"like\": Guru adalah pahlawan tanpa tanda jasa (teachers are heroes without medals). Many have become everyday phrases: jantung kota (the heart of the city)."
pattern:
  - A + adalah + B (A is B — no seperti)
  - noun + noun metaphor compounds (buah hati, jantung kota, kaki gunung, kutu buku)
  - metaphorical verbs / images (Habis gelap terbitlah terang)
explanation:
  ar_eg: |
    التشبيه بيقول «زي» (seperti)، الاستعارة بتشيل «زي» وبتقول «هو هو»:
    - Guru seperti pahlawan (تشبيه) → Guru adalah pahlawan tanpa tanda jasa (استعارة) = المدرس بطل من غير وسام — جملة مشهورة جدًا في إندونيسيا.
    استعارات بقت كلام يومي (اسم + اسم):
    - buah hati = حرفيًا «تمرة الكبد» = الحبيب / الابن.
    - jantung kota = قلب المدينة (وسطها).
    - kaki gunung = سفح الجبل (حرفيًا «رجل الجبل»)، kepala sekolah = ناظر المدرسة.
    - tangan kanan = الدراع اليمين (المساعد اللي بيعتمد عليه).
    - kutu buku = «قملة الكتب» = دودة كتب.
    - anak emas = الابن المفضل (المدلل)، meja hijau = المحكمة.
    وفي الكتابة الرسمية والاحتفالات الوطنية: كتاب كارتيني «Habis Gelap Terbitlah Terang» = «بعد الضلمة بيطلع النور» — الضلمة = الجهل والنور = التعليم.
    خلي بالك: hati في الإندونيسي هو مكان المشاعر (زي «القلب» عندنا)، مع إن معناه التشريحي «الكبد». و jantung = القلب العضلة.
  ar: |
    التشبيه يذكر الأداة (seperti)، والاستعارة تحذفها: Guru adalah pahlawan tanpa tanda jasa (المعلم بطل بلا وسام) عبارة شهيرة في إندونيسيا.
    ومن الاستعارات الشائعة: buah hati (فلذة الكبد / الحبيب)، jantung kota (قلب المدينة)، kaki gunung (سفح الجبل)، tangan kanan (الساعد الأيمن)، kutu buku (دودة الكتب)، anak emas (الابن المدلل)، meja hijau (المحكمة).
    ومن الأدب الوطني عنوان كتاب كارتيني: Habis Gelap Terbitlah Terang (بعد الظلام يشرق النور).
    ويُلاحظ أن hati (الكبد تشريحيًا) موضع العاطفة، وjantung هو القلب العضو.
  en: |
    A simile says "like" (seperti); a metaphor drops it and says "is":
    - Guru seperti pahlawan (simile) → Guru adalah pahlawan tanpa tanda jasa (metaphor): teachers are heroes without medals — a famous Indonesian saying.
    Everyday metaphor compounds:
    - buah hati = "fruit of the heart" = darling, one's child.
    - jantung kota = the heart of the city.
    - kaki gunung = the foot of the mountain; kepala sekolah = head teacher.
    - tangan kanan = right-hand man.
    - kutu buku = "book louse" = bookworm.
    - anak emas = golden child (favourite); meja hijau = "green table" = the court.
    National writing: Kartini's book title Habis Gelap Terbitlah Terang (After darkness comes light) — darkness = ignorance, light = education.
    Note: hati (anatomically the liver) is the seat of feelings; jantung is the physical heart.
examples:
  - text: Guru adalah pahlawan tanpa tanda jasa.
    breakdown: guru · adalah · pahlawan (hero) · tanpa (without) · tanda jasa (medal of merit)
    en: Teachers are heroes without medals.
    ar_eg: المدرس بطل من غير وسام.
    ar: المعلم بطل بلا وسام.
  - text: Habis gelap terbitlah terang.
    en: After darkness, light rises. (Kartini's book title)
    ar_eg: بعد الضلمة بيطلع النور.
    ar: بعد الظلام يشرق النور.
    register: formal
  - text: Anak adalah buah hati orang tua.
    en: Children are their parents' darlings.
    ar_eg: العيال فلذة كبد أهلهم.
    ar: الأبناء فلذات أكباد آبائهم.
  - text: Lapangan upacara itu terletak di jantung Kota Palopo.
    en: The ceremony ground is in the heart of Palopo.
    ar_eg: ساحة الاحتفال في قلب مدينة بالوبو.
    ar: تقع ساحة الاحتفال في قلب مدينة بالوبو.
  - text: Pak Budi adalah tangan kanan kepala sekolah.
    en: Pak Budi is the head teacher's right-hand man.
    ar_eg: الأستاذ بودي دراع الناظر اليمين.
    ar: الأستاذ بودي هو الساعد الأيمن لمدير المدرسة.
  - text: Rina memang kutu buku.
    en: Rina really is a bookworm.
    ar_eg: رينا فعلًا دودة كتب.
    ar: رينا حقًا دودة كتب.
    register: informal
mistakes:
  - wrong: kaki dari gunung
    right: kaki gunung
    why:
      ar_eg: الاستعارات دي مركبات ثابتة (اسم + اسم) من غير dari.
      ar: هذه مركبات ثابتة بلا dari.
      en: These are fixed noun + noun compounds — no dari.
  - wrong: Guru adalah seperti pahlawan.
    right: Guru adalah pahlawan. / Guru seperti pahlawan.
    why:
      ar_eg: "اختار: استعارة (adalah) أو تشبيه (seperti)، مش الاتنين."
      ar: اختر الاستعارة (adalah) أو التشبيه (seperti)، لا كليهما.
      en: Choose metaphor (adalah) or simile (seperti), not both.
  - wrong: Dia buah jantung saya.
    right: Dia buah hati saya.
    why:
      ar_eg: التعبير ثابت بـ hati، مع إن jantung هو القلب العضلة.
      ar: التعبير الثابت بـhati لا jantung.
      en: The fixed phrase uses hati, even though jantung is the anatomical heart.
arabic_bridge:
  ar_eg: "buah hati حرفيًا «تمرة الكبد»، و hati أصلًا «الكبد» — زي ما العرب بيقولوا «فلذة كبدي» و«أولادنا أكبادنا تمشي على الأرض»! نفس الصورة بالظبط. و jantung kota = «قلب المدينة»، و tangan kanan = «دراعه اليمين»."
  ar: "buah hati حرفيًا «ثمرة الكبد»، وhati هو الكبد، كما تقول العرب «فلذة كبدي» و«أولادنا أكبادنا تمشي على الأرض». وjantung kota = قلب المدينة، وtangan kanan = الساعد الأيمن."
  en: buah hati is literally "fruit of the liver" — just like Arabic فلذة كبدي and «أولادنا أكبادنا تمشي على الأرض». jantung kota = قلب المدينة; tangan kanan = الساعد الأيمن.
