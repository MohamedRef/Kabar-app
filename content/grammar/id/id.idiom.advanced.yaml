schema: kabar.grammar/v1
id: id.idiom.advanced
language: id
level: bipa7
title:
  target: Ungkapan idiomatis lanjutan (bahu-membahu, naik daun, gulung tikar, jalan tengah …)
  en: Advanced idiomatic expressions
  ar_eg: تعبيرات اصطلاحية متقدمة
  ar: التعبيرات الاصطلاحية المتقدمة
summary:
  ar_eg: "بعد kambing hitam وbuah tangan، دي تعبيرات بيستخدمها الصحفيين والمتكلمين الطبيعيين: bahu-membahu (إيد واحدة)، tenggang rasa (مراعاة)، naik daun (يشتهر)، gulung tikar (يفلس)، jalan tengah (حل وسط). كلماتها ثابتة، والفعل بس اللي ممكن ياخد بادئة."
  ar: "بعد التعابير الأساسية، هذه تعابير يستعملها الصحفيون وأهل اللغة: bahu-membahu وtenggang rasa وnaik daun وgulung tikar وjalan tengah، وألفاظها ثابتة لا يتغير منها إلا ما يقبل السوابق."
  en: "After kambing hitam and buah tangan, these are idioms journalists and fluent speakers use: bahu-membahu (shoulder to shoulder), tenggang rasa (mutual consideration), naik daun (rise to fame), gulung tikar (go out of business), jalan tengah (middle way). The wording is fixed."
pattern:
  - "Cooperation / tolerance: bahu-membahu, gotong royong, tenggang rasa, duduk sama rendah berdiri sama tinggi, jalan tengah"
  - "Success / failure: naik daun, gulung tikar, angkat tangan, makan asam garam"
  - "Character: kepala batu (stubborn), besar kepala (arrogant), panjang tangan (light-fingered), buah bibir (talk of the town)"
  - "Roles: ujung tombak (spearhead), tulang punggung (backbone / breadwinner), tangan besi (iron fist)"
  - "Idiom + affix only on the verb part: sudah banyak makan asam garam, mencari jalan tengah"
explanation:
  ar_eg: |
    الوحدة عن التسامح في التنوع (Bhinneka Tunggal Ika). التعبيرات دي بتخلّي تقريرك يبان «إندونيسي أصلي»:
    التعاون والتسامح:
    - bahu-membahu = كتف في كتف / إيد واحدة.
    - gotong royong = التعاون الجماعي (قيمة وطنية).
    - tenggang rasa = مراعاة شعور الآخر والتسامح.
    - duduk sama rendah, berdiri sama tinggi = المساواة (حرفيًا: نقعد بنفس الوطاة ونقف بنفس الطول).
    - jalan tengah = حل وسط.
    النجاح والفشل:
    - naik daun = يشتهر / يطلع (حرفيًا: يطلع على الورق).
    - gulung tikar = يقفل ويفلس (حرفيًا: يلف الحصيرة).
    - angkat tangan = يستسلم / مايقدرش (أو يتبرّا من مسؤولية).
    - makan asam garam = عنده خبرة (حرفيًا: كل الحامض والملح): sudah banyak makan asam garam kehidupan.
    الشخصيات:
    - kepala batu = دماغه ناشفة، besar kepala = شايف نفسه، panjang tangan = إيده طويلة (حرامي)، buah bibir = على كل لسان.
    الأدوار: ujung tombak (رأس الحربة)، tulang punggung (العمود الفقري / اللي شايل البيت)، tangan besi (بيد من حديد).
    القواعد:
    - الكلمات ثابتة: kepala batu مش batu kepala، وbesar kepala غير kepala besar (اللي معناها حرفي).
    - مش كل تعبير إنجليزي ليه مقابل حرفي: «break the ice» = mencairkan suasana (يدوّب الجو)، مش memecah es.
  ar: |
    تتناول الوحدة التسامح في التنوّع (Bhinneka Tunggal Ika)، وهذه تعابير تمنح التقرير أصالة:
    - التعاون والتسامح: bahu-membahu (كتفًا بكتف)، gotong royong (التعاون الجماعي)، tenggang rasa (مراعاة الآخر)، duduk sama rendah, berdiri sama tinggi (المساواة)، jalan tengah (الحل الوسط).
    - النجاح والإخفاق: naik daun (ذاع صيته)، gulung tikar (أفلس، حرفيًّا: طوى الحصير)، angkat tangan (عجز أو تنصّل)، makan asam garam (خبَر الحياة).
    - الطباع: kepala batu (عنيد)، besar kepala (متكبر)، panjang tangan (سارق)، buah bibir (حديث الناس).
    - الأدوار: ujung tombak (رأس الحربة)، tulang punggung (العمود الفقري / العائل)، tangan besi (القبضة الحديدية).
    وألفاظها ثابتة: kepala batu لا batu kepala، وbesar kepala تختلف عن kepala besar. ولا تُترجم التعابير الأجنبية حرفيًّا: break the ice = mencairkan suasana.
  en: |
    This unit is about tolerance in diversity (Bhinneka Tunggal Ika). These idioms make a report sound genuinely Indonesian:
    Cooperation and tolerance:
    - bahu-membahu = shoulder to shoulder.
    - gotong royong = communal self-help (a national value).
    - tenggang rasa = consideration for others, tolerance.
    - duduk sama rendah, berdiri sama tinggi = equality (lit. sit equally low, stand equally tall).
    - jalan tengah = a middle way, compromise.
    Success and failure:
    - naik daun = rise to fame (lit. climb onto the leaf).
    - gulung tikar = go out of business (lit. roll up the mat).
    - angkat tangan = give up / wash one's hands of something.
    - makan asam garam = be experienced (lit. eat sour and salt): sudah banyak makan asam garam kehidupan.
    Character:
    - kepala batu = stubborn, besar kepala = conceited, panjang tangan = light-fingered (a thief), buah bibir = the talk of the town.
    Roles: ujung tombak (spearhead), tulang punggung (backbone / breadwinner), tangan besi (iron fist).
    Rules:
    - Fixed wording: kepala batu, never batu kepala; besar kepala (conceited) ≠ kepala besar (a literal big head).
    - English idioms rarely translate literally: "break the ice" = mencairkan suasana (melt the atmosphere), not memecah es.
examples:
  - text: Warga Sentani dari berbagai suku dan agama bahu-membahu menyiapkan festival danau.
    en: Sentani residents of many ethnic groups and faiths worked shoulder to shoulder to prepare the lake festival.
    ar_eg: أهالي سنتاني من كل القبايل والأديان اشتغلوا إيد واحدة عشان يجهّزوا مهرجان البحيرة.
    ar: تكاتف سكان سنتاني من مختلف القبائل والأديان كتفًا بكتف لإعداد مهرجان البحيرة.
    register: formal
  - text: Dalam masyarakat majemuk, kita harus duduk sama rendah, berdiri sama tinggi.
    en: In a plural society, we must treat each other as equals.
    ar_eg: في مجتمع متنوع، لازم نبقى كلنا زي بعض، محدش أعلى من حد.
    ar: في مجتمع متعدد، علينا أن نكون سواسية.
    register: formal
  - text: Tenggang rasa menjadi tulang punggung kerukunan di kota ini.
    en: Mutual consideration is the backbone of harmony in this city.
    ar_eg: مراعاة الناس لبعض هي العمود الفقري للتعايش في المدينة دي.
    ar: مراعاة الآخر هي العمود الفقري للوئام في هذه المدينة.
    register: formal
  - text: Usaha noken itu hampir gulung tikar, tetapi kini produknya justru naik daun.
    breakdown: noken (Papuan woven bag) · gulung tikar (go out of business) · justru (on the contrary) · naik daun (become popular)
    en: That noken business nearly went under, but now its products have taken off.
    ar_eg: مشروع شنط النوكن كان قرب يقفل، بس دلوقتي منتجاته بالعكس بقت مشهورة.
    ar: كاد مشروع حقائب النوكن يُفلس، لكن منتجاته باتت اليوم رائجة.
  - text: Para tokoh adat sepakat mencari jalan tengah agar perbedaan pendapat tidak memecah warga.
    en: The customary leaders agreed to seek a middle way so that differences of opinion wouldn't divide the community.
    ar_eg: كبار العادات اتفقوا يدوّروا على حل وسط عشان الخلاف مايقسمش الناس.
    ar: اتفق زعماء العرف على البحث عن حل وسط كي لا يفرّق الخلاف بين الأهالي.
    register: formal
  - text: Pak Yohanes sudah banyak makan asam garam dalam mendamaikan warga.
    en: Pak Yohanes has plenty of experience in reconciling residents.
    ar_eg: الأستاذ يوهانس واكل الدنيا أكل في الصلح بين الناس — خبرته كبيرة.
    ar: للسيد يوهانس خبرة طويلة في الإصلاح بين الأهالي.
mistakes:
  - wrong: Mari kita memecah es dulu sebelum rapat.
    right: Mari kita mencairkan suasana dulu sebelum rapat.
    why:
      ar_eg: «break the ice» بالإندونيسي mencairkan suasana (ندوّب الجو). memecah es ترجمة حرفية مالهاش معنى.
      ar: مقابل break the ice هو mencairkan suasana، والترجمة الحرفية لا معنى لها.
      en: '"Break the ice" is mencairkan suasana; memecah es is a meaningless calque.'
  - wrong: Dia memang batu kepala.
    right: Dia memang kepala batu.
    why:
      ar_eg: "ترتيب الكلمات في التعبير ثابت: kepala batu = دماغه ناشفة."
      ar: "ترتيب ألفاظ التعبير ثابت: kepala batu."
      en: "Idiom word order is fixed: kepala batu."
  - wrong: Penyanyi itu sedang menaiki daun.
    right: Penyanyi itu sedang naik daun.
    why:
      ar_eg: naik daun تعبير ثابت؛ لو حوّلتها menaiki daun بقت حرفي (بيطلع على ورقة شجر!).
      ar: naik daun تعبير ثابت، وتحويله إلى menaiki daun يردّه إلى المعنى الحرفي.
      en: naik daun is fixed; menaiki daun turns it literal (climbing onto a leaf!).
arabic_bridge:
  ar_eg: "تعبيرات كتير ليها أخ مصري: panjang tangan = «إيده طويلة» بالظبط! kepala batu = «دماغه ناشفة»، tangan besi = «بيد من حديد»، buah bibir = «على كل لسان»، bahu-membahu = «إيد واحدة»، angkat tangan = «رفع الراية البيضا». وmakan asam garam شبه «واكل الدنيا / شاف كتير»."
  ar: "لكثير منها نظير عربي: panjang tangan ≈ «يده طويلة»، tangan besi = «بيد من حديد»، buah bibir ≈ «على كل لسان»، bahu-membahu ≈ «كتفًا بكتف»، angkat tangan ≈ «رفع الراية البيضاء»."
  en: "Many have Egyptian twins: panjang tangan = «إيده طويلة» (light-fingered) exactly, kepala batu ≈ «دماغه ناشفة», tangan besi = «بيد من حديد», buah bibir ≈ «على كل لسان», bahu-membahu ≈ «إيد واحدة»."
