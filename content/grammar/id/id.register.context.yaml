schema: kabar.grammar/v1
id: id.register.context
language: id
level: bipa7
title:
  target: Bahasa sesuai konteks dan ragam daerah (sa, ko, gue, lu, Alkisah …)
  en: Language for the situation, and regional varieties
  ar_eg: اللغة حسب الموقف، واللهجات الإقليمية
  ar: ملاءمة اللغة للسياق، والتنوّعات الإقليمية
summary:
  ar_eg: "نفس الإندونيسي بيتغير حسب المكان والموقف: بابوا (sa، ko، dong = هم، tra = مش)، جاكرتا (gue، lu، -in)، ميدان (kau، kali = أوي)، ولغة الحكي (Alkisah، Konon، hiduplah). إنت مش لازم تتكلمهم كلهم، بس لازم تفهمهم وتعرف إمتى تستخدم إيه."
  ar: "تتغير الإندونيسية بحسب المكان والمقام: ملايو بابوا (sa، ko، dong بمعنى هم، tra بمعنى لا)، وعامية جاكرتا (gue، lu، -in)، وميدان (kau، kali بمعنى جدًّا)، ولغة الحكي (Alkisah، Konon)؛ والمطلوب فهمها ومعرفة مواضعها."
  en: "The same Indonesian shifts with place and situation: Papuan Malay (sa, ko, dong = they, tra = not), Jakarta (gue, lu, -in), Medan (kau, kali = very), and storytelling style (Alkisah, Konon, hiduplah). You needn't speak them all, but you should understand them and know what fits where."
pattern:
  - "Papuan Malay: sa = saya, ko = kamu, dia = dia, kitong = kita, dong = mereka, tra / trada = tidak / tidak ada, su = sudah, pi = pergi, (dia) pu = punya"
  - "Jakarta: gue = saya, lu = kamu, -in = -kan / -i, nggak, kenapa, sih, dong (particle)"
  - "Medan / Batak-influenced: kau = kamu, kali = sangat (mahal kali), bah!"
  - "Javanese-influenced: kok, to / tho, mas / mbak, monggo"
  - "Narrative: Alkisah, … / Pada zaman dahulu kala, … / Konon, … / hiduplah seorang …"
explanation:
  ar_eg: |
    في BIPA 7 لازم تفهم إندونيسيين من كل حتة وتختار لغتك حسب الموقف.
    1. ملايو بابوا (اللي هتسمعه في سورونج وجايابورا):
       - sa (أنا)، ko (إنت)، kitong (إحنا)، kam (إنتوا)، dong (هم — مش الأداة بتاعة جاكرتا!).
       - tra / trada = tidak / tidak ada، su = sudah، pi = pergi، mo = mau.
       - الملكية بـ pu: sa pu rumah = بيتي (من punya).
       Ko mau pi mana? = إنت رايح فين؟ / Dong tra datang = هم ماجوش.
    2. جاكرتا: gue / lu، -in بدل -kan و-i (bacain، beliin)، nggak، kenapa، ونبرة sih / dong / deh.
    3. ميدان والباتاك: kau بدل kamu (عادي مش قلة ذوق هناك)، kali = أوي: Mahal kali! ، وbah للدهشة.
    4. المتأثر بالجاوي: kok (ليه / الله؟)، to / tho (مش كده؟)، mas / mbak للنداء.
    5. لغة الحكاية (cerita rakyat): Alkisah، Pada zaman dahulu kala، Konon، والفعل المقلوب: «hiduplah seorang nelayan tua» (عاش صياد عجوز).
    القاعدة الذهبية: افهم كل حاجة، بس اتكلم بالشكل المحايد (saya / kamu / Anda) إلا لو إنت فعلًا جزء من المجموعة. لو حد غريب قال «gue» في ميدان أو «sa» في جاكرتا، هيبان غريب أو بيقلّد.
    والسياق مش بس جغرافيا: خطاب، حكاية للأطفال، شات مع صاحب، كل واحد ليه لغة.
  ar: |
    يُطلب هنا فهم الإندونيسيين على اختلاف أقاليمهم واختيار اللغة الملائمة للمقام:
    1. ملايو بابوا: sa (أنا)، ko (أنت)، kitong (نحن)، kam (أنتم)، dong (هم)؛ tra / trada (لا / لا يوجد)، su (قد)، pi (ذهب)؛ والملكية بـ pu: sa pu rumah (بيتي).
    2. عامية جاكرتا: gue / lu، واللاحقة -in بدل -kan و-i، وnggak، والأدوات sih وdong وdeh.
    3. ميدان والباتاك: kau بدل kamu دون غلظة، وkali بمعنى جدًّا: Mahal kali!
    4. المتأثر بالجاوية: kok، to / tho، mas / mbak.
    5. لغة الحكاية الشعبية: Alkisah، Pada zaman dahulu kala، Konon، مع تقديم الفعل: hiduplah seorang nelayan tua.
    والقاعدة: افهم الجميع، وتكلم بالمحايد إلا إن كنت من أهل الجماعة؛ فاستعارة لهجة غيرك قد تبدو تقليدًا مصطنعًا. والسياق يشمل كذلك نوع الخطاب: خطبة، أو حكاية للأطفال، أو محادثة ودية.
  en: |
    BIPA 7 expects you to understand Indonesians from anywhere and to choose your own language for the situation.
    1. Papuan Malay (heard in Sorong, Jayapura):
       - sa (I), ko (you), kitong (we), kam (you all), dong (they — not Jakarta's particle!).
       - tra / trada = tidak / tidak ada, su = sudah, pi = pergi, mo = mau.
       - possession with pu: sa pu rumah = my house (from punya).
       Ko mau pi mana? = Where are you going? / Dong tra datang = They didn't come.
    2. Jakarta: gue / lu, -in for -kan and -i (bacain, beliin), nggak, kenapa, and the tone of sih / dong / deh.
    3. Medan and Batak areas: kau for kamu (normal there, not rude), kali = very: Mahal kali!, and bah! for surprise.
    4. Javanese-influenced: kok (why / how come), to / tho (right?), mas / mbak as address terms.
    5. Folk-tale style (cerita rakyat): Alkisah, Pada zaman dahulu kala, Konon, plus inverted verbs: "hiduplah seorang nelayan tua" (there lived an old fisherman).
    Golden rule: understand everything, but speak the neutral form (saya / kamu / Anda) unless you really belong to the group. An outsider saying gue in Medan or sa in Jakarta sounds odd or like mimicry.
    Context isn't only geography: a speech, a children's story and a chat with a friend each have their own language.
examples:
  - text: Ko mau pi mana? Sa su makan tadi.
    breakdown: ko = kamu · pi = pergi · sa = saya · su = sudah
    en: Where are you going? I already ate earlier. (Papuan Malay)
    ar_eg: إنت رايح فين؟ أنا كلت من شوية. (ملايو بابوا)
    ar: إلى أين أنت ذاهب؟ لقد أكلت قبل قليل. (ملايو بابوا)
    register: informal
  - text: Dong tra datang ke pesta kemarin.
    breakdown: dong = mereka (they) · tra = tidak
    en: They didn't come to the party yesterday. (Papuan Malay)
    ar_eg: هم ماجوش الحفلة امبارح. (ملايو بابوا)
    ar: لم يأتوا إلى الحفلة أمس. (ملايو بابوا)
    register: informal
  - text: Gue nggak ngerti lu ngomong apa, sih.
    en: I don't get what you're saying. (Jakarta)
    ar_eg: أنا مش فاهم إنت بتقول إيه أصلًا. (جاكرتا)
    ar: لا أفهم ما تقوله. (عامية جاكرتا)
    register: informal
  - text: Mahal kali harganya, bah!
    en: That price is way too expensive! (Medan)
    ar_eg: ده غالي أوي يا عم! (ميدان)
    ar: ما أغلى هذا السعر! (ميدان)
    register: informal
  - text: Alkisah, di sebuah pulau kecil di Teluk Cenderawasih, hiduplah seorang nelayan tua bersama cucunya.
    en: Once upon a time, on a small island in Cenderawasih Bay, there lived an old fisherman with his grandchild.
    ar_eg: كان يا ما كان، في جزيرة صغيرة في خليج تشندراواسيه، كان عايش صياد عجوز مع حفيده.
    ar: يُحكى أنه في جزيرة صغيرة بخليج تشندراواسيه عاش صياد عجوز مع حفيده.
    register: formal
mistakes:
  - wrong: "«Dong tra datang.» → 'They came, didn't they!' (reading dong as the Jakarta particle)"
    right: "«Dong tra datang.» → 'They didn't come.' (Papuan: dong = mereka, tra = tidak)"
    why:
      ar_eg: في بابوا dong ضمير «هم»، مش الأداة اللي في جاكرتا. وtra = مش.
      ar: dong في ملايو بابوا ضمير «هم» لا أداة التوكيد الجاكرتية، وtra بمعنى لا.
      en: In Papuan Malay dong is the pronoun "they", not the Jakarta particle; tra means "not".
  - wrong: Talking to a Papuan host with "Sa mau pi pasar, ko ikut kah?" after one day there.
    right: Use neutral Indonesian ("Saya mau ke pasar, kamu mau ikut?") until locals invite the local style.
    why:
      ar_eg: لما غريب يقلّد اللهجة بسرعة، ممكن تبان تريقة. افهمها، واستخدمها لما تبقى قريب من الناس.
      ar: محاكاة الغريب للهجة المحلية سريعًا قد تُفهم سخرية، فالأولى الفهم ثم الاستعمال عند الألفة.
      en: An outsider imitating the local variety too soon can come across as mockery; understand first, use it once you're close.
  - wrong: Pada zaman dahulu kala, gue punya temen nelayan.
    right: Pada zaman dahulu kala, hiduplah seorang nelayan.
    why:
      ar_eg: افتتاحية الحكاية رسمية وأدبية، وgue عامية جاكرتا؛ الخلط بيكسر الجو.
      ar: افتتاحية الحكاية أدبية، وgue عامية لا تناسبها.
      en: A fairy-tale opening is literary; slangy gue breaks the spell.
arabic_bridge:
  ar_eg: "ده نفس اللي إحنا عايشينه: المصري والشامي والخليجي والمغربي كلهم عربي، وكل واحد ليه ضماير وكلمات (زي «إحنا / نحنا / حنا»). وفي إندونيسيا نفس الفكرة. وافتتاحية الحكاية Alkisah ← «القصة» (يعني «يُحكى أن»)، وhikayat ← حكاية."
  ar: "تشبه هذه الحالُ تنوّع اللهجات العربية بين مصرية وشامية وخليجية ومغاربية مع وحدة الفصحى. وافتتاحية Alkisah مأخوذة من «القصة» بمعنى «يُحكى أن»، وhikayat من «حكاية»."
  en: "It's like the Arabic dialect map — Egyptian, Levantine, Gulf, Maghrebi — each with its own pronouns (إحنا / نحنا / حنا) under one standard. And the story opener Alkisah comes from Arabic القصة («once upon a time»), hikayat from حكاية."
