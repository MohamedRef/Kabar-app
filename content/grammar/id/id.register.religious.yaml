schema: kabar.grammar/v1
id: id.register.religious
language: id
level: bipa6
title:
  target: Ragam keagamaan (salat, almarhum, -Nya, salam lintas agama)
  en: Religious register
  ar_eg: لغة الكلام عن الدين في الإندونيسي
  ar: اللغة الدينية في الإندونيسية
summary:
  ar_eg: "الإندونيسي مليان كلمات إسلامية من العربي، بس معناها ونطقها وإملاءها اتغير شوية (salat، wudu، ustaz). فيه قواعد إملاء (-Nya بحرف كبير لله)، وتعبيرات للموت والأعياد، وطريقة محترمة تتكلم بيها عن الأديان التانية."
  ar: "تزخر الإندونيسية بالألفاظ الإسلامية العربية مع تغيّر في نطقها وإملائها ودلالتها أحيانًا، ولها قواعد إملائية (-Nya بحرف كبير لله) وعبارات للوفاة والأعياد وأدب في الحديث عن الأديان الأخرى."
  en: "Indonesian is full of Arabic-derived Islamic words, adapted in sound, spelling and sometimes meaning (salat, wudu, ustaz). There are spelling rules (-Nya capitalised for God), set phrases for death and holidays, and respectful ways to talk about other faiths."
pattern:
  - "Standard spelling: salat, wudu, ustaz, musala, Idulfitri, Iduladha, Ramadan"
  - "Pronouns for God capitalised: -Nya, Engkau, Dia — rahmat-Nya"
  - "Death: meninggal dunia / wafat / berpulang ke rahmatullah · almarhum (m) / almarhumah (f) · mendiang (non-Muslim)"
  - "umat + religion: umat Islam, umat Kristiani, umat Hindu, umat Buddha"
  - "Inclusive opening: Assalamualaikum warahmatullahi wabarakatuh, salam sejahtera bagi kita semua, Om Swastiastu, Namo Buddhaya, salam kebajikan."
explanation:
  ar_eg: |
    هنا هتحس إنك في بيتك، بس خلي بالك من الفروق.
    1. الإملاء الرسمي (KBBI): salat (مش sholat)، wudu، ustaz، musala (مصلى)، Idulfitri وIduladha كلمة واحدة، Ramadan. في الشارع واللافتات هتلاقي sholat وmushola، بس دي مش رسمية.
    2. الضماير اللي بترجع على الله بتتكتب بحرف كبير: rahmat-Nya، kepada-Nya، Engkau. (قاعدة EYD)
    3. الموت:
       - meninggal dunia (محايد ومحترم)، wafat (للمسلمين وللكبار)، berpulang ke rahmatullah (رسمي جدًا).
       - almarhum (للراجل) / almarhumah (للست) قبل اسم المسلم المتوفي، وmendiang لغير المسلمين.
       - التعزية: «Innalillahi wa inna ilaihi rajiun. Semoga almarhum husnulkhatimah dan keluarga diberi ketabahan.»
    4. مصطلحات معناها اتحرك شوية:
       - doa = دعاء بس، مش الصلاة. الصلاة = salat. وsembahyang (أصلها ملايو / سنسكريتي) كلمة عامة بيستخدمها المسلم وغيره.
       - pahala = ثواب (مش عربية)، dosa = ذنب (سنسكريتي)، puasa = صيام (سنسكريتي).
    5. إندونيسيا فيها ست أديان رسمية: بيقولوا umat Islam، umat Kristiani، umat Hindu، umat Buddha. وفي الخطب الرسمية فيه تحية بتجمع الكل:
       «Assalamualaikum warahmatullahi wabarakatuh, salam sejahtera bagi kita semua, Om Swastiastu, Namo Buddhaya, salam kebajikan.»
    6. التهنئة: Selamat Hari Raya Idulfitri, mohon maaf lahir dan batin؛ وللمسيحيين Selamat Natal؛ وللهندوس Selamat Hari Raya Nyepi.
  ar: |
    1. الإملاء المعياري: salat، wudu، ustaz، musala، Idulfitri وIduladha كلمة واحدة، Ramadan؛ أما sholat وmushola فشائعتان في غير الكتابة الرسمية.
    2. تُكتب الضمائر العائدة إلى الله بحرف كبير: rahmat-Nya، kepada-Nya، Engkau.
    3. الوفاة: meninggal dunia (محايدة)، wafat، berpulang ke rahmatullah (رسمية)؛ وalmarhum / almarhumah قبل اسم المسلم المتوفى، وmendiang لغير المسلم. والتعزية: Innalillahi wa inna ilaihi rajiun …
    4. ألفاظ تغيّرت دلالتها أو ليست عربية: doa دعاء لا صلاة، وsembahyang لفظ عام، وpahala (ثواب) وdosa (ذنب) وpuasa (صوم) غير عربية الأصل.
    5. تعترف إندونيسيا بستة أديان، ويُقال umat Islam وumat Kristiani وumat Hindu وumat Buddha، وتُفتتح الخطب الرسمية بتحية جامعة لأتباع الأديان.
    6. التهاني: Selamat Hari Raya Idulfitri, mohon maaf lahir dan batin؛ Selamat Natal؛ Selamat Hari Raya Nyepi.
  en: |
    You'll feel at home here — but mind the differences.
    1. Standard (KBBI) spelling: salat (not sholat), wudu, ustaz, musala, Idulfitri and Iduladha as one word, Ramadan. Street signs say sholat and mushola, but those aren't standard.
    2. Pronouns referring to God are capitalised: rahmat-Nya, kepada-Nya, Engkau (EYD rule).
    3. Death:
       - meninggal dunia (neutral, respectful), wafat (for Muslims and eminent figures), berpulang ke rahmatullah (very formal).
       - almarhum (m) / almarhumah (f) before a deceased Muslim's name; mendiang for non-Muslims.
       - Condolences: "Innalillahi wa inna ilaihi rajiun. Semoga almarhum husnulkhatimah dan keluarga diberi ketabahan."
    4. Words whose meaning shifted, or that aren't Arabic:
       - doa = supplication only, not ritual prayer (that's salat). sembahyang (Malay/Sanskrit) is a general word used across faiths.
       - pahala (reward for good deeds), dosa (sin), puasa (fasting) come from Sanskrit, not Arabic.
    5. Indonesia officially recognises six religions: umat Islam, umat Kristiani, umat Hindu, umat Buddha … Formal speeches open with a greeting for everyone:
       "Assalamualaikum warahmatullahi wabarakatuh, salam sejahtera bagi kita semua, Om Swastiastu, Namo Buddhaya, salam kebajikan."
    6. Greetings: Selamat Hari Raya Idulfitri, mohon maaf lahir dan batin; Selamat Natal (Christmas); Selamat Hari Raya Nyepi (Balinese Hindu).
examples:
  - text: Masjid Raya Baiturrahman tetap berdiri ketika tsunami melanda Banda Aceh pada tahun 2004.
    en: Baiturrahman Grand Mosque remained standing when the tsunami struck Banda Aceh in 2004.
    ar_eg: مسجد بيت الرحمن الكبير فضل واقف لما التسونامي ضرب باندا آتشيه سنة 2004.
    ar: ظلّ مسجد بيت الرحمن الكبير قائمًا حين ضرب التسونامي باندا آتشيه عام 2004.
    register: formal
  - text: Innalillahi wa inna ilaihi rajiun. Semoga almarhum diterima di sisi-Nya dan keluarga diberi ketabahan.
    breakdown: almarhum (the late, Muslim man) · di sisi-Nya (by His side — capital N for God) · ketabahan (fortitude)
    en: To God we belong and to Him we return. May the deceased be received by His side and may the family be given strength.
    ar_eg: إنا لله وإنا إليه راجعون. ربنا يتقبله عنده ويصبّر أهله.
    ar: إنا لله وإنا إليه راجعون. نسأل الله أن يتقبّله عنده وأن يُلهم أهله الصبر.
    register: formal
  - text: Setelah salat Jumat, warga berkumpul di musala untuk bermusyawarah.
    en: After Friday prayers, residents gathered at the prayer hall to deliberate.
    ar_eg: بعد صلاة الجمعة، الأهالي اتجمعوا في المصلى عشان يتشاوروا.
    ar: بعد صلاة الجمعة اجتمع الأهالي في المصلى للتشاور.
  - text: Umat Islam dan umat Kristiani di kampung itu saling membantu membangun kembali rumah ibadah mereka.
    en: The Muslims and Christians of that village helped each other rebuild their houses of worship.
    ar_eg: المسلمين والمسيحيين في القرية دي ساعدوا بعض يبنوا دور عبادتهم من جديد.
    ar: تعاون المسلمون والمسيحيون في تلك القرية على إعادة بناء دور عبادتهم.
    register: formal
  - text: Selamat Hari Raya Idulfitri, mohon maaf lahir dan batin.
    en: Happy Eid al-Fitr; please forgive my wrongs, outward and inward.
    ar_eg: عيد فطر سعيد، وسامحني على أي غلط ظاهر أو باطن.
    ar: عيد فطر مبارك، وأرجو المسامحة ظاهرًا وباطنًا.
mistakes:
  - wrong: Saya mau doa zuhur dulu.
    right: Saya mau salat zuhur dulu.
    why:
      ar_eg: doa = دعاء، مش صلاة. صلاة الظهر = salat zuhur. (ممكن كمان sembahyang في الكلام.)
      ar: doa دعاء لا صلاة، والصواب salat zuhur.
      en: doa is supplication, not ritual prayer; the noon prayer is salat zuhur.
  - wrong: Semoga Allah melimpahkan rahmatnya.
    right: Semoga Allah melimpahkan rahmat-Nya.
    why:
      ar_eg: "الضمير اللي راجع على الله بحرف كبير وبشرطة: -Nya."
      ar: "يُكتب الضمير العائد إلى الله بحرف كبير مع شَرطة: -Nya."
      en: "A pronoun referring to God is capitalised and hyphenated: -Nya."
  - wrong: Almarhum Pendeta Yohanes sangat dihormati jemaatnya.
    right: Mendiang Pendeta Yohanes sangat dihormati jemaatnya.
    why:
      ar_eg: almarhum كلمة عربية إسلامية (المرحوم). لغير المسلم بيقولوا mendiang.
      ar: almarhum للمسلم، وللمتوفى غير المسلم يُقال mendiang.
      en: almarhum is the Islamic term; for a non-Muslim, Indonesians say mendiang.
arabic_bridge:
  ar_eg: "الكلمات عربية بس اتأقلمت: صلاة ← salat، وضوء ← wudu، أستاذ ← ustaz، مصلى ← musala، المرحوم ← almarhum، عيد الفطر ← Idulfitri، مشاورة ← musyawarah (= تشاور جماعي)، رحمة ← rahmat. والفخ: ض ← d (wudu، Ramadan)، وأستاذ بقى ustaz (مدرس دين بس). وفي الكتابة الإندونيسية الكلمات العربية بتتكتب بالحروف اللاتينية حسب قواعد ثابتة."
  ar: "معظم المصطلحات عربية مكيَّفة: صلاة ← salat، وضوء ← wudu، أستاذ ← ustaz (معلّم الدين)، مصلّى ← musala، المرحوم ← almarhum، عيد الفطر ← Idulfitri، مشاورة ← musyawarah، رحمة ← rahmat. وتُقلب الضاد دالًا (wudu، Ramadan)."
  en: "Most terms are adapted Arabic: صلاة → salat, وضوء → wudu, أستاذ → ustaz (now 'religious teacher'), مصلّى → musala, المرحوم → almarhum, عيد الفطر → Idulfitri, مشاورة → musyawarah (deliberation), رحمة → rahmat. ض usually becomes d (wudu, Ramadan)."
