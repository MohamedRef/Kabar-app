schema: kabar.grammar/v1
id: id.nominalization
language: id
level: bipa5
title:
  target: Nominalisasi (membangun → pembangunan, mudah → kemudahan)
  en: Nominalisation for formal style
  ar_eg: تحويل الفعل والصفة لاسم (المصدر) في الأسلوب الرسمي
  ar: التحويل إلى الاسم (المصدر) في الأسلوب الرسمي
summary:
  ar_eg: "الكتابة الرسمية بتحب الأسماء: «الحكومة بنت طريق» تبقى «بناء الطريق». meN- → peN-…-an، ber- → per-…-an، الصفة → ke-…-an، وكمان صفة + -nya: tingginya harga."
  ar: "تؤثر الكتابة الرسمية الأسماء على الأفعال: meN- → peN-…-an، وber- → per-…-an، والصفة → ke-…-an، والصفة + -nya: tingginya harga."
  en: "Formal writing prefers nouns: meN- verbs → peN-…-an, ber- verbs → per-…-an, adjectives → ke-…-an, and adjective + -nya (tingginya harga = the high price)."
pattern:
  - "meN- verb → peN-…-an (process): membangun → pembangunan, menggunakan → penggunaan"
  - "ber- verb → per-…-an / pe-…-an: berubah → perubahan, bekerja → pekerjaan"
  - "adjective / state → ke-…-an: mudah → kemudahan, aman → keamanan"
  - "adjective + -nya + noun: tingginya biaya, lambatnya internet"
  - "upaya / proses / hal + verb: upaya melindungi data"
explanation:
  ar_eg: |
    في المقالات والتقارير (زي مقال عن الاقتصاد الرقمي) الإندونيسي بيحوّل الأحداث لأسماء، زي ما العربي بيستخدم المصدر:
    Pemerintah membangun jaringan internet. → Pembangunan jaringan internet oleh pemerintah …
    القوالب الأساسية (إنت عرفتها في BIPA 4، دلوقتي بتستخدمها في الأسلوب):
    - meN- → peN-…-an (العملية): membangun → pembangunan، menggunakan → penggunaan، melindungi → pelindungan (ده المصطلح الرسمي في قانون حماية البيانات 2022، بس perlindungan منتشرة جدًا في الكلام).
    - ber- → per-…-an: berubah → perubahan، bertemu → pertemuan؛ وbekerja → pekerjaan، belajar → pelajaran.
    - الصفة → ke-…-an (الفكرة المجردة): mudah → kemudahan، aman → keamanan، bergantung → ketergantungan.
    - صفة + -nya قبل الاسم: tingginya harga = ارتفاع الأسعار، lambatnya koneksi = بطء الاتصال. دي حلوة جدًا في العناوين والمقدمات.
    خد بالك من أزواج المعنى:
    - perubahan (تغيّر، من berubah) ≠ pengubahan (تغيير حد لحاجة، من mengubah).
    - kebersihan (النضافة كحالة) ≠ pembersihan (عملية التنضيف).
    - pengguna (المستخدم) ≠ penggunaan (الاستخدام).
    وماتحطش dari بين الاسمين: pembangunan jalan، مش pembangunan dari jalan.
    ومتبالغش: جملة كلها أسماء بتبقى تقيلة؛ في الكلام العادي رجّع الفعل.
  ar: |
    تحوّل الكتابة الرسمية الأحداث إلى أسماء كما يفعل المصدر في العربية:
    Pemerintah membangun jaringan internet → Pembangunan jaringan internet oleh pemerintah …
    - meN- → peN-…-an للعملية: membangun → pembangunan، menggunakan → penggunaan، وmelindungi → pelindungan، وهي الصيغة الرسمية في قانون حماية البيانات لسنة 2022، وإن شاعت perlindungan.
    - ber- → per-…-an: berubah → perubahan، bertemu → pertemuan، وbekerja → pekerjaan.
    - الصفة → ke-…-an للمعنى المجرد: mudah → kemudahan، aman → keamanan.
    - الصفة + -nya قبل الاسم: tingginya harga (ارتفاع الأسعار).
    ويُفرَّق بين perubahan (التغيّر) وpengubahan (التغيير)، وkebersihan (النظافة) وpembersihan (التنظيف)، وpengguna (المستخدِم) وpenggunaan (الاستخدام). ولا تُقحم dari بين المضاف والمضاف إليه.
  en: |
    Feature articles and reports (e.g. on the digital economy) turn events into nouns, much like the Arabic maṣdar:
    Pemerintah membangun jaringan internet → Pembangunan jaringan internet oleh pemerintah …
    The templates (met in BIPA 4, now used for style):
    - meN- → peN-…-an (process): membangun → pembangunan, menggunakan → penggunaan; melindungi → pelindungan (the official term in the 2022 personal-data law; perlindungan is still very common).
    - ber- → per-…-an: berubah → perubahan, bertemu → pertemuan; bekerja → pekerjaan, belajar → pelajaran.
    - adjective → ke-…-an (abstract idea): mudah → kemudahan, aman → keamanan, bergantung → ketergantungan.
    - adjective + -nya before a noun: tingginya harga = the high price(s), lambatnya koneksi = the slow connection. Great in headlines and opening sentences.
    Watch meaning pairs:
    - perubahan (a change, from berubah) vs pengubahan (the act of changing something, from mengubah).
    - kebersihan (cleanliness) vs pembersihan (cleaning).
    - pengguna (user) vs penggunaan (use).
    No dari between the nouns: pembangunan jalan, not pembangunan dari jalan.
    Don't overdo it: a sentence of nothing but nouns is heavy; in speech, bring the verbs back.
examples:
  - text: Penggunaan dompet digital meningkat pesat dalam lima tahun terakhir.
    breakdown: peN- + guna + -an → penggunaan (use) · dompet digital (e-wallet) · meningkat pesat (rise sharply)
    en: The use of e-wallets has risen sharply over the last five years.
    ar_eg: استخدام المحافظ الإلكترونية زاد بسرعة في الخمس سنين اللي فاتوا.
    ar: ارتفع استخدام المحافظ الرقمية ارتفاعًا سريعًا في السنوات الخمس الأخيرة.
    register: formal
  - text: Kemudahan bertransaksi menjadi alasan utama masyarakat beralih ke aplikasi.
    en: The ease of making transactions is the main reason people are switching to apps.
    ar_eg: سهولة الدفع هي السبب الأساسي إن الناس بتتحول للتطبيقات.
    ar: سهولة إجراء المعاملات هي السبب الرئيس لتحوّل الناس إلى التطبيقات.
    register: formal
  - text: Pelindungan data pribadi masih menjadi tantangan besar.
    breakdown: peN- + lindung + -an → pelindungan (protection; the term used in UU Pelindungan Data Pribadi) · data pribadi · tantangan
    en: Protecting personal data is still a major challenge.
    ar_eg: حماية البيانات الشخصية لسه تحدي كبير.
    ar: لا تزال حماية البيانات الشخصية تحديًا كبيرًا.
    register: formal
  - text: Tingginya ketergantungan pada ojek daring mengubah wajah transportasi di Samarinda.
    breakdown: "tinggi + -nya (the high …) · ke-…-an: ketergantungan (dependence) · ojek daring (ride-hailing motorbike)"
    en: The heavy dependence on app-based motorbike taxis is changing the face of transport in Samarinda.
    ar_eg: الاعتماد الكبير على موتوسيكلات الأجرة بالتطبيقات بيغيّر شكل المواصلات في ساماريندا.
    ar: يغيّر الاعتمادُ الكبير على دراجات الأجرة عبر التطبيقات وجهَ النقل في ساماريندا.
    register: formal
  - text: Pemerintah mengembangkan ekonomi digital. → Pengembangan ekonomi digital oleh pemerintah berjalan lambat.
    en: The government is developing the digital economy. → The government's development of the digital economy is moving slowly.
    ar_eg: الحكومة بتطوّر الاقتصاد الرقمي ← تطوير الحكومة للاقتصاد الرقمي ماشي ببطء.
    ar: تطوّر الحكومة الاقتصاد الرقمي ← يسير تطويرُ الحكومة للاقتصاد الرقمي ببطء.
mistakes:
  - wrong: Pembangunan dari jaringan internet di desa masih lambat.
    right: Pembangunan jaringan internet di desa masih lambat.
    why:
      ar_eg: "الإضافة في الإندونيسي من غير حرف: الاسم بعده الاسم. dari هنا ترجمة حرفية من «of»."
      ar: تُبنى الإضافة بتتابع الاسمين بلا حرف، وdari هنا ترجمة حرفية لـ of.
      en: Possession is just noun + noun; dari here is a calque of English "of".
  - wrong: Pengubahan iklim mengancam pesisir Kalimantan.
    right: Perubahan iklim mengancam pesisir Kalimantan.
    why:
      ar_eg: التغيّر اللي بيحصل لوحده = perubahan (من berubah). pengubahan يعني حد بيغيّر حاجة عن قصد.
      ar: perubahan تغيّرٌ يحدث من تلقاء نفسه (من berubah)، أما pengubahan فتغيير متعمَّد (من mengubah).
      en: A change that happens is perubahan (from berubah); pengubahan is someone deliberately changing something.
  - wrong: Kebersihan sungai Mahakam dilakukan setiap bulan.
    right: Pembersihan sungai Mahakam dilakukan setiap bulan.
    why:
      ar_eg: kebersihan = النضافة (حالة)، والحالة ماتتعملش. العملية اللي «بتتعمل» = pembersihan.
      ar: kebersihan حالة (النظافة) لا تُفعَل، أما العملية فهي pembersihan (التنظيف).
      en: kebersihan is a state (cleanliness) and can't be "carried out"; the process is pembersihan.
arabic_bridge:
  ar_eg: "ده المصدر العربي بالظبط: «بنى» ← «بناء»، «استخدم» ← «استخدام»، «سهل» ← «سهولة». وtingginya harga ماشية زي «ارتفاعُ الأسعار». وحتى الفرق بين «تغيُّر» و«تغيير» هو نفس الفرق بين perubahan وpengubahan!"
  ar: "هذا هو المصدر العربي: بنى ← بناء (pembangunan)، استخدم ← استخدام (penggunaan)، سهل ← سهولة (kemudahan). والفرق بين perubahan وpengubahan هو الفرق بين «تغيُّر» و«تغيير»."
  en: "This is the Arabic maṣdar at work: بنى → بناء (pembangunan), استخدم → استخدام (penggunaan), سهل → سهولة (kemudahan). perubahan vs pengubahan is exactly تغيُّر vs تغيير."
tags: [morphology, affix, noun, formal-writing, style]
prerequisites: [id.confix.peng-an, id.confix.ke-an, id.clitic.nya]
see_also: [id.confix.per-an, id.register.academic, id.register.formal-informal, id.suffix.an.result]
