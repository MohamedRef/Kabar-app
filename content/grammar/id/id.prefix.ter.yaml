schema: kabar.grammar/v1
id: id.prefix.ter
language: id
level: bipa4
title:
  target: ter- (terbesar, tertidur, tertutup, terletak, tak terlihat)
  en: "The prefix ter-: most, accidental, resulting state, can be"
  ar_eg: "البادئة ter-: الأكتر، من غير قصد، حالة، ينفع"
  ar: "السابقة ter-: التفضيل، وعدم القصد، والحالة الناتجة، والإمكان"
summary:
  ar_eg: "ter- ليها ٤ معاني: الأكتر (terbesar)، حصل من غير قصد (tertidur = غلبه النوم)، حالة نتيجة (tertutup = مقفول)، وينفع / يتعمل (tidak terlihat = مش باين)."
  ar: "لـter- أربعة معانٍ: التفضيل (terbesar)، والفعل غير المقصود (tertidur)، والحالة الناتجة (tertutup)، والإمكان مع النفي غالبًا (tidak terlihat)."
  en: "ter- has four meanings: the most (terbesar), accidental (tertidur = dozed off), resulting state (tertutup = closed), and can be (tidak terlihat = can't be seen)."
pattern:
  - ter- + adjective = the most (terbesar, terbaik)
  - ter- + verb root = happened without intention (tertidur, terjatuh, tertinggal, terbawa)
  - ter- + verb root = resulting state, no doer in view (tertutup, terbuka, tertulis, terletak, terbuat dari)
  - (tidak / tak) + ter- + verb root = (can't) be done (tidak terlihat, tak terhitung)
  - "lexicalised: terkenal, tertarik, terlambat, tersenyum, tertawa"
explanation:
  ar_eg: |
    في المستوى التاني عرفت ter- بمعنى «الأكتر»: terbesar = الأكبر. هنا تلات معاني جديدة:
    1) من غير قصد / فجأة: tertidur = غلبه النوم، terjatuh = وقع، tertinggal = اتنسى / فاته، terbawa = اتشال بالغلط، terinjak = اتداس.
       قارن: Saya tidur jam 10 (قصد) — Saya tertidur di bus (غصب عني).
    2) حالة (النتيجة، مش العملية): Pintu itu ditutup = الباب اتقفل (حد قفله) — Pintu itu tertutup = الباب مقفول (ده وضعه).
       tertulis = مكتوب، terletak = موجود / واقع (مكان)، terbuat dari = معمول من.
    3) ينفع / يقدر يتعمل، وغالبًا مع النفي: tidak terlihat = مش باين، tak terhitung = ما يتعدش، tidak terbaca = مش مقروء.
    كلمات ثابتة كتير: terkenal (مشهور)، tertarik (مهتم)، terlambat (متأخر)، tersenyum (ابتسم)، tertawa (ضحك)، terpaksa (مضطر).
    إزاي تعرف المعنى؟ من السياق: صفة → «الأكتر»؛ حاجة حصلت فجأة → «من غير قصد»؛ وصف لوضع → «حالة».
    ملحوظة: terlalu (أوي / زيادة عن اللزوم) مش ter-، دي كلمة لوحدها.
  ar: |
    عرفتَ ter- للتفضيل (terbesar). وهنا ثلاثة معانٍ أخرى:
    1) الفعل غير المقصود أو المفاجئ: tertidur (غلبه النوم)، terjatuh (سقط)، tertinggal (نُسي / فاته)، terbawa (حُمل خطأً).
       قارن: Saya tidur jam 10 (عن قصد) وSaya tertidur di bus (بلا قصد).
    2) الحالة الناتجة لا الحدث: Pintu itu ditutup (أُغلق، والفاعل مقصود) — Pintu itu tertutup (مغلق). ومنها tertulis (مكتوب)، terletak (يقع)، terbuat dari (مصنوع من).
    3) الإمكان، وغالبًا مع النفي: tidak terlihat (لا يُرى)، tak terhitung (لا يُحصى).
    وكلمات معجمية: terkenal، tertarik، terlambat، tersenyum، tertawa، terpaksa.
    وليست terlalu (جدًا / أكثر من اللازم) من هذا الباب.
  en: |
    At BIPA 2 you met ter- = "the most" (terbesar). Three new meanings:
    1) Accidental / sudden: tertidur (dozed off), terjatuh (fell), tertinggal (got left behind / missed), terbawa (taken by mistake), terinjak (got stepped on). Compare Saya tidur jam 10 (on purpose) with Saya tertidur di bus (couldn't help it).
    2) Resulting state, not the action: Pintu itu ditutup (the door was closed — someone did it) vs Pintu itu tertutup (the door is closed). Also tertulis (written), terletak (located), terbuat dari (made of).
    3) Ability, usually negated: tidak terlihat (can't be seen), tak terhitung (countless), tidak terbaca (illegible).
    Many fixed words: terkenal (famous), tertarik (interested), terlambat (late), tersenyum (smile), tertawa (laugh), terpaksa (forced to).
    Tell them apart by context: adjective → "most"; something that just happened → accidental; describing how things are → state.
    Note: terlalu (too) is a separate word, not ter- + lalu.
examples:
  - text: Makassar terkenal dengan Pantai Losari.
    en: Makassar is famous for Losari Beach.
    ar_eg: ماكاسار مشهورة بشاطئ لوساري.
    ar: تشتهر ماكاسار بشاطئ لوساري.
  - text: Benteng Rotterdam terletak di pusat Kota Makassar.
    breakdown: ter- + letak (place) = is located
    en: Fort Rotterdam is located in the centre of Makassar.
    ar_eg: قلعة روتردام موجودة في وسط مدينة ماكاسار.
    ar: تقع قلعة روتردام في وسط مدينة ماكاسار.
  - text: Karena terlalu lelah, dokter itu tertidur di kursinya.
    breakdown: ter- + tidur = fell asleep without meaning to
    en: Too tired, the doctor dozed off in his chair.
    ar_eg: من كتر التعب، الدكتور نام على الكرسي من غير ما ياخد باله.
    ar: غلب النومُ الطبيبَ على كرسيه من شدة التعب.
  - text: Laptop saya tertinggal di kantor.
    en: I left my laptop at the office (by accident).
    ar_eg: اللابتوب بتاعي اتنسى في المكتب.
    ar: نسيتُ حاسوبي المحمول في المكتب.
  - text: Kapal pinisi terbuat dari kayu.
    breakdown: ter- + buat (make) + dari = is made of
    en: Pinisi ships are made of wood.
    ar_eg: مراكب البينيسي معمولة من الخشب.
    ar: تُصنع سفن البينيسي من الخشب.
  - text: Dari sini, pulau itu tidak terlihat.
    en: From here, that island can't be seen.
    ar_eg: من هنا الجزيرة دي مش باينة.
    ar: لا تُرى تلك الجزيرة من هنا.
mistakes:
  - wrong: Setiap malam saya tertidur jam sepuluh.
    right: Setiap malam saya tidur jam sepuluh.
    why:
      ar_eg: tertidur = نمت من غير قصد؛ للروتين المقصود قول tidur.
      ar: tertidur للنوم غير المقصود، أما العادة المقصودة فـtidur.
      en: tertidur means dozing off unintentionally; a planned routine is tidur.
  - wrong: Kapal ini terbuat oleh kayu.
    right: Kapal ini terbuat dari kayu.
    why:
      ar_eg: «معمول من» = terbuat dari، مش oleh (oleh = بواسطة شخص).
      ar: «مصنوع من» = terbuat dari، وoleh للفاعل.
      en: '"Made of" is terbuat dari; oleh marks a doer.'
  - wrong: paling terbesar
    right: terbesar / paling besar
    why:
      ar_eg: ter- = paling؛ ما تجمعهمش.
      ar: ter- وpaling بمعنى واحد فلا يُجمعان.
      en: ter- and paling mean the same; don't stack them.
arabic_bridge:
  ar_eg: "العربي الفصيح ما بيفرقش في الفعل بين «قاصد» و«مش قاصد»، بس المصري عنده «اتـ»: «الباب اتقفل»، «الشنطة اتنسيت» — قريبة جدًا من tertutup و tertinggal. وكمان صيغة «لا يُرى / لا يُحصى» = tidak terlihat / tak terhitung."
  ar: "لا تميّز العربية في صيغة الفعل بين المقصود وغيره، لكن صيغة «انفعل» (انكسر، انغلق) تقترب من ter- في الحالة الناتجة، و«لا يُرى / لا يُحصى» تقابل tidak terlihat / tak terhitung."
  en: Egyptian «اتـ» (الباب اتقفل، الشنطة اتنسيت) is close to ter- for states and accidents; MSA «لا يُرى / لا يُحصى» = tidak terlihat / tak terhitung.
