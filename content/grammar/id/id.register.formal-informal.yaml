cues:
  - match: "gue|gua|gw|lu|lo|elo|elu"
    note:
      ar_eg: "gue = أنا، lu = إنت: عامية جاكرتا، مع الصحاب بس."
      ar: "gue = أنا، lu = أنت: عامية جاكرتا."
      en: "gue = I, lu = you: Jakarta slang, friends only."
