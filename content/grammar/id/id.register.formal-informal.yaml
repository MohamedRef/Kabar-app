schema: kabar.grammar/v1
id: id.register.formal-informal
language: id
level: bipa5
title:
  target: Ragam baku dan ragam tidak baku
  en: Formal vs informal register
  ar_eg: الإندونيسي الرسمي والإندونيسي العامي
  ar: اللغة المعيارية واللغة غير المعيارية
summary:
  ar_eg: "الإندونيسي فيه «فصحى» (bahasa baku) للشغل والكتابة الرسمية و«عامية» للصحاب. الفرق في الضماير، والنفي، والبادئات، والأدوات الصغيرة زي sih وdong."
  ar: "للإندونيسية مستوى معياري (bahasa baku) للعمل والكتابة الرسمية، ومستوى غير معياري للحديث اليومي، ويظهر الفرق في الضمائر والنفي والسوابق والأدوات."
  en: Indonesian has a standard register (bahasa baku) for work and formal writing and a casual one for friends; they differ in pronouns, negation, affixes and particles.
pattern:
  - "saya / Anda / Bapak / Ibu  ↔  aku / kamu / gue / lu"
  - "tidak, sudah, saja, sekali, mengapa  ↔  nggak / gak, udah, aja, banget, kenapa"
  - "meN- verb + -kan / -i  ↔  bare or nasal verb + -in (mengirimkan ↔ ngirimin)"
  - "Dengan hormat, … Hormat saya,  (formal letter frame)"
explanation:
  ar_eg: |
    في المستوى ده بقيت بتفهم الاتنين، والمهارة دلوقتي إنك تختار عن قصد.
    الرسمي (baku) بيستخدم في: الإيميلات والجوابات الرسمية، المقابلات، الأخبار، الكلام مع المدير أو حد أكبر منك.
    - الضماير: saya، Anda (بحرف كبير دايمًا)، والأحسن Bapak / Ibu مع الرؤسا: «Apakah Bapak sudah menerima berkas saya?»
    - النفي والأدوات: tidak، sudah، saja، sekali، mengapa / apa sebabnya.
    - الفعل كامل بالبادئة واللاحقة: mengirimkan، membacakan.
    - السؤال الرسمي بيبدأ بـ Apakah.
    العامي (tidak baku)، خصوصًا لهجة جاكرتا:
    - aku / kamu، أو gue / lu بين الصحاب في جاكرتا.
    - nggak / gak، udah، aja، banget، kenapa.
    - البادئة بتقع أو بتبقى أنفية: nulis، ngirim؛ و-kan / -i بتبقى -in: ngirimin، bacain.
    - أدوات بتدي إحساس: sih، dong، kok، deh، nih.
    الغلطة الكبيرة مش إنك تستخدم العامي؛ الغلطة إنك تخلط: جملة رسمية فيها gue، أو إيميل للمدير فيه nggak.
    كمان الكلمات الدخيلة ليها شكل رسمي: salat (مش sholat)، izin (مش ijin)، Jumat (مش Jum'at)، ustaz (مش ustad).
  ar: |
    يُتوقَّع في هذا المستوى أن يختار المتعلم المستوى اللغوي عن وعي.
    المعياري (baku): للرسائل الرسمية والمقابلات والأخبار ومخاطبة الرؤساء والأكبر سنًّا.
    - الضمائر: saya، وAnda بحرف كبير، ويُفضَّل Bapak / Ibu مع الرؤساء.
    - الألفاظ: tidak، sudah، saja، sekali، mengapa.
    - الفعل تامّ السوابق واللواحق: mengirimkan، membacakan، والاستفهام بـ Apakah.
    غير المعياري (ولا سيما عامية جاكرتا):
    - aku / kamu، وgue / lu بين الأصدقاء.
    - nggak، udah، aja، banget، kenapa.
    - تسقط السابقة أو تُختصر (nulis، ngirim)، وتحل -in محل -kan / -i (ngirimin).
    - أدوات تعبيرية: sih، dong، kok، deh.
    والخطأ الحقيقي هو الخلط بين المستويين في نص واحد.
    وللكلمات الدخيلة صورة معيارية: salat، izin، Jumat، ustaz.
  en: |
    At this level you understand both; the skill now is choosing on purpose.
    Formal (baku) is for emails and letters, interviews, news, and talking to a boss or an elder.
    - Pronouns: saya, Anda (always capitalised), and preferably Bapak / Ibu for superiors.
    - Words: tidak, sudah, saja, sekali, mengapa; formal questions open with Apakah.
    - Full verbs with affixes: mengirimkan, membacakan.
    Informal, especially Jakarta-style:
    - aku / kamu, or gue / lu among Jakarta friends.
    - nggak / gak, udah, aja, banget, kenapa.
    - Prefixes drop or turn nasal (nulis, ngirim); -kan / -i become -in (ngirimin, bacain).
    - Mood particles: sih, dong, kok, deh, nih.
    The real mistake isn't using casual Indonesian; it's mixing: gue inside a formal sentence, or nggak in an email to your manager.
    Loanwords also have standard spellings: salat (not sholat), izin (not ijin), Jumat (not Jum'at), ustaz (not ustad).
examples:
  - text: Dengan hormat, bersama surat ini saya bermaksud melamar posisi insinyur di perusahaan yang Bapak pimpin.
    en: Dear Sir, with this letter I wish to apply for the engineer position in the company you lead.
    ar_eg: تحية طيبة، بالجواب ده حابب أقدّم على وظيفة مهندس في الشركة اللي حضرتك بتديرها.
    ar: تحية طيبة وبعد، أتقدم بهذه الرسالة لشغل وظيفة مهندس في الشركة التي تديرونها.
    register: formal
  - text: Gue udah kirim CV-nya kok, tapi belum dibales.
    breakdown: gue (I, Jakarta) · udah = sudah · kok (but really) · dibales = dibalas
    en: I did send the CV, but nobody's replied yet.
    ar_eg: أنا بعت الـ CV والله، بس لسه محدش رد.
    ar: لقد أرسلتُ السيرة الذاتية فعلًا، لكن لم يُرَدّ عليها بعد.
    register: informal
  - text: Mohon maaf atas keterlambatan balasan ini.
    en: I apologise for this late reply.
    ar_eg: آسف على التأخير في الرد.
    ar: أعتذر عن تأخري في الرد.
    register: formal
  - text: Sori ya, baru bales sekarang.
    en: Sorry, only replying now.
    ar_eg: معلش، مردّتش غير دلوقتي.
    ar: عذرًا، لم أرد إلا الآن.
    register: chat
  - text: Apakah Bapak sudah sempat membaca berkas yang saya kirimkan kemarin?
    en: Have you had a chance to read the documents I sent yesterday, sir?
    ar_eg: حضرتك لحقت تقرا الورق اللي بعته امبارح؟
    ar: هل تسنّى لكم قراءة الملف الذي أرسلته أمس؟
    register: formal
  - text: Udah sempet baca file yang kukirim kemarin belum?
    en: Have you had time to read the file I sent yesterday?
    ar_eg: لحقت تقرا الملف اللي بعتهولك امبارح ولا لسه؟
    ar: هل قرأت الملف الذي أرسلته أمس أم ليس بعد؟
    register: informal
mistakes:
  - wrong: Dengan hormat, gue mau melamar posisi insinyur.
    right: Dengan hormat, saya bermaksud melamar posisi insinyur.
    why:
      ar_eg: افتتاحية رسمية جدًا وبعدها gue العامية؛ الخلط ده بيبان غريب جدًا. خليك رسمي للآخر.
      ar: الجمع بين افتتاحية رسمية وضمير عامي يُعدّ خلطًا ظاهرًا بين المستويين.
      en: A formal letter opening followed by slangy gue is a jarring register clash; stay formal throughout.
  - wrong: Kamu sudah baca laporan saya, Pak?
    right: Bapak sudah membaca laporan saya?
    why:
      ar_eg: kamu مع المدير أو حد أكبر بتبان قلة ذوق. استخدم Bapak / Ibu نفسها كضمير.
      ar: لا يُخاطَب الرئيس بـ kamu، بل يُستعمل Bapak / Ibu في موضع الضمير.
      en: kamu to a superior sounds disrespectful; Bapak / Ibu itself works as the pronoun.
  - wrong: Saya minta ijin tidak masuk hari Jum'at.
    right: Saya mohon izin tidak masuk hari Jumat.
    why:
      ar_eg: "في الكتابة الرسمية بنستخدم الإملاء المعياري حسب KBBI: izin وJumat. وmohon أرسمي من minta."
      ar: الإملاء المعياري في KBBI هو izin وJumat، وmohon أليق من minta في المقام الرسمي.
      en: Standard KBBI spelling is izin and Jumat; mohon is more formal than minta.
arabic_bridge:
  ar_eg: "ده نفس موضوع الفصحى والعامية عندنا بالظبط: محدش بيكتب جواب رسمي بـ«إزيك يا معلم»، ومحدش بيهزر مع صاحبه بـ«تحية طيبة وبعد». وزي ما «ايه ده» عامية و«ما هذا» فصحى، udah عامية وsudah رسمية. والكلمات العربية نفسها ليها إملاء رسمي: salat ← صلاة، izin ← إذن، Jumat ← جمعة."
  ar: "تشبه الثنائية هنا ثنائية الفصحى والعامية في العربية: لكل مقام مقال. وللألفاظ العربية الدخيلة صيغة معيارية: salat ← صلاة، izin ← إذن، Jumat ← جمعة."
  en: "This is the same diglossia as Arabic fuṣḥā vs ʿāmmiyya: each setting has its register. Even Arabic loans have a standard spelling: salat ← صلاة, izin ← إذن, Jumat ← جمعة."
