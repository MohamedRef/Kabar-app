schema: kabar.grammar/v1
id: id.confix.ber-an
language: id
level: bipa2
title:
  target: ber-…-an (bersalaman, berdatangan) · ber-…-kan (berdasarkan)
  en: "ber-…-an and ber-…-kan"
  ar_eg: ber-…-an و ber-…-kan
  ar: المزدوجتان ber-…-an و ber-…-kan
summary:
  ar_eg: ber-…-an = بيعملوا مع بعض / كتير (bersalaman = بيسلموا على بعض)، وber-…-kan = «قائم على / مكوّن من» (berdasarkan = بناءً على).
  ar: ber-…-an للمشاركة أو الكثرة، وber-…-kan بمعنى «جاعلًا كذا كذا» كـ berdasarkan = بناءً على.
  en: ber-…-an = doing it together / in numbers (bersalaman = shake hands); ber-…-kan = having X as (berdasarkan = based on).
pattern:
  - ber- + root + -an (reciprocal / many doers / scattered)
  - ber- + noun + -kan (having … as …)
explanation:
  ar_eg: |
    ber-…-an (فكرة «تفاعَل» في العربي):
    - مع بعض: bersalaman = يسلّموا على بعض، berpelukan = يحضنوا بعض، berkenalan = يتعارفوا.
    - كتير ورا بعض: berdatangan = جايين ورا بعض، berlarian = بيجروا هنا وهناك.
    - بُعد: berjauhan = بعاد عن بعض، berdekatan = قريبين من بعض.
    ber-…-kan أقل بكتير، أشهرها:
    - berdasarkan = بناءً على: Berdasarkan resep nenek = حسب وصفة جدتي.
    - beratapkan langit = سقفه السما (مالوش سقف).
  ar: |
    ber-…-an (قريبة من وزن «تفاعَل»):
    - المشاركة: bersalaman = تصافحوا، berpelukan = تعانقوا، berkenalan = تعارفوا.
    - الكثرة والتتابع: berdatangan = توافدوا، berlarian = تراكضوا.
    - المسافة: berjauhan = متباعدون، berdekatan = متقاربون.
    وber-…-kan أقل شيوعًا، وأشهرها berdasarkan = بناءً على، وberatapkan langit = سقفه السماء.
  en: |
    ber-…-an (think of Arabic تفاعَل):
    - Reciprocal: bersalaman = shake hands with each other, berpelukan = hug, berkenalan = get acquainted.
    - Many, one after another: berdatangan = arrive in numbers, berlarian = run about.
    - Distance: berjauhan = far apart, berdekatan = close together.
    ber-…-kan is rarer; learn berdasarkan = based on, and the poetic beratapkan langit = with the sky as a roof.
examples:
  - text: Setelah sholat Id, semua orang bersalaman.
    en: After Eid prayers everyone shakes hands.
    ar_eg: بعد صلاة العيد كل الناس بتسلم على بعض.
    ar: بعد صلاة العيد يتصافح الجميع.
  - text: Tamu-tamu mulai berdatangan.
    en: The guests started arriving one after another.
    ar_eg: الضيوف بدأوا ييجوا ورا بعض.
    ar: بدأ الضيوف يتوافدون.
  - text: Nasi goreng ini dibuat berdasarkan resep nenek saya.
    en: This fried rice is made from my grandmother's recipe.
    ar_eg: الرز المقلي ده معمول على وصفة جدتي.
    ar: صُنع هذا الأرز المقلي وفق وصفة جدتي.
  - text: Kami berkenalan di Bali.
    en: We got to know each other in Bali.
    ar_eg: اتعرفنا على بعض في بالي.
    ar: تعارفنا في بالي.
mistakes:
  - wrong: berdasar pada (in formal writing meaning "based on")
    right: berdasarkan
    why:
      ar_eg: الصيغة الثابتة «بناءً على» هي berdasarkan.
      ar: الصيغة المعتمدة berdasarkan.
      en: The fixed formal phrase is berdasarkan.
arabic_bridge:
  ar_eg: "bersalaman فيها «سلام» العربي + ber-…-an بمعنى «تفاعَل»: «تسالموا»! وberdasarkan فيها «dasar» = أساس."
  ar: في bersalaman لفظ «سلام» مع معنى «تفاعَل»، فهي قريبة من «تسالموا».
  en: "bersalaman = Arabic «سلام» + a تفاعَل-like reciprocal: literally \"exchange salāms\"."
tags: [affix, confix, morphology, arabic-loan]
see_also: [id.prefix.ber.basic, id.prefix.ber.meanings]
