schema: kabar.grammar/v1
id: id.news.expressions
language: id
level: bipa7
title:
  target: Ungkapan berita (meraih, dilaporkan, ujarnya, hingga berita ini diturunkan)
  en: News language
  ar_eg: لغة الأخبار
  ar: لغة الخبر الصحفي
summary:
  ar_eg: "الخبر الإندونيسي ليه شكل ثابت: الهرم المقلوب (الأهم الأول، 5W+1H)، عناوين من غير بادئات (Raih، Sabet)، الاقتباس وبعده «ujarnya»، التاريخ «Senin (12/8)»، وتعبيرات زي dilaporkan، diduga، hingga berita ini diturunkan."
  ar: "للخبر الإندونيسي قالب ثابت: الهرم المقلوب، وعناوين بأفعال مجردة من السوابق، والاقتباس متبوعًا بـ ujarnya، وصيغة التاريخ Senin (12/8)، وعبارات مثل dilaporkan وdiduga وhingga berita ini diturunkan."
  en: "Indonesian news has a fixed shape: inverted pyramid (5W+1H up top), headlines with bare verbs (Raih, Sabet), quote-then-ujarnya, dates like Senin (12/8), and set phrases such as dilaporkan, diduga, hingga berita ini diturunkan."
pattern:
  - "Lead: siapa + melakukan apa + di mana + kapan (+ mengapa / bagaimana)"
  - "Headline: Capitalised Words, bare verb: Pelajar Sorong Raih Emas Olimpiade Sains"
  - "\"Quote,\" ujar / kata / tutur / jelas + X (+ kepada wartawan), + Day (dd/m)."
  - "dilaporkan / dikabarkan / diduga / disebut-sebut + verb"
  - "Menurut keterangan / Berdasarkan data + source, …"
  - "Hingga berita ini diturunkan, … belum …"
  - "Achievement: meraih / menyabet / menyandang + gelar / medali; mengharumkan nama bangsa"
explanation:
  ar_eg: |
    في BIPA 7 المطلوب تكتب خبر وتقوله بطلاقة. ده «قالب» الخبر الإندونيسي:
    1. الهرم المقلوب: أول جملة (lead) فيها apa، siapa، di mana، kapan، وبعدها mengapa وbagaimana (اسمها 5W+1H). التفاصيل بعدين.
    2. العنوان: كل كلمة بحرف كبير، والفعل من غير meN-، ومن غير «ini / itu / yang» على قد ما يقدر:
       «Pelajar Sorong Raih Emas Olimpiade Sains» (بدل meraih). وأفعال صحفية قوية: Sabet (يخطف = يكسب)، Gelar (يقيم)، Tuai (يحصد).
    3. الاقتباس: الكلام بين علامات تنصيص، وبعده الفعل + الضمير: «…,» ujarnya / katanya / tuturnya / jelasnya / imbuhnya (أضاف). ومعاه «kepada wartawan» واليوم + (يوم/شهر): Senin (12/8).
    4. الحذر في الاتهام: diduga (يُشتبه)، terduga pelaku (المشتبه فيه)، disebut-sebut (يُقال)، dilaporkan / dikabarkan (أفادت التقارير). مايتقالش «pelaku» قبل الحكم.
    5. المصادر: Menurut keterangan polisi، Berdasarkan data BPS، dikutip dari / dilansir dari (نقلًا عن).
    6. الخاتمة الشهيرة: «Hingga berita ini diturunkan, pihak … belum memberikan keterangan resmi.» = لحد نشر الخبر ده، … مااداش تصريح رسمي.
    7. أخبار الإنجاز (موضوع الوحدة): meraih / menyabet medali emas، menyandang gelar (يحمل لقب)، mengharumkan nama bangsa (يرفع اسم البلد)، di kancah internasional (على الساحة الدولية).
  ar: |
    يُطلب في هذا المستوى كتابة الخبر وإلقاؤه بطلاقة، وقالبه:
    1. الهرم المقلوب: تتضمن الجملة الأولى ماذا ومن وأين ومتى، ثم لماذا وكيف (5W+1H).
    2. العنوان: كل كلمة بحرف كبير، والفعل مجرد من meN-: «Pelajar Sorong Raih Emas Olimpiade Sains»، ومن أفعال الصحافة Sabet وGelar وTuai.
    3. الاقتباس: النص بين علامتي تنصيص ثم ujarnya / katanya / tuturnya / imbuhnya، مع kepada wartawan واليوم (اليوم/الشهر): Senin (12/8).
    4. التحفّظ في الاتهام: diduga، terduga pelaku، disebut-sebut، dilaporkan / dikabarkan.
    5. المصادر: Menurut keterangan، Berdasarkan data، dikutip dari / dilansir dari.
    6. الخاتمة المعتادة: Hingga berita ini diturunkan, … belum memberikan keterangan resmi.
    7. أخبار الإنجاز: meraih / menyabet medali، menyandang gelar، mengharumkan nama bangsa، di kancah internasional.
  en: |
    BIPA 7 asks you to write and deliver news fluently. Here's the Indonesian news template:
    1. Inverted pyramid: the lead sentence gives apa, siapa, di mana, kapan, then mengapa and bagaimana (5W+1H). Details follow.
    2. Headlines: every word capitalised, verbs without meN-, few function words: "Pelajar Sorong Raih Emas Olimpiade Sains" (not meraih). Punchy press verbs: Sabet (snatch = win), Gelar (hold an event), Tuai (reap).
    3. Quotes: quote first, then verb + pronoun: "…," ujarnya / katanya / tuturnya / jelasnya / imbuhnya (he added), often with kepada wartawan and the day + (day/month): Senin (12/8).
    4. Caution with accusations: diduga (allegedly), terduga pelaku (suspect), disebut-sebut (rumoured), dilaporkan / dikabarkan (reportedly). Don't call anyone pelaku (perpetrator) before a verdict.
    5. Sources: Menurut keterangan polisi, Berdasarkan data BPS, dikutip dari / dilansir dari (as quoted from).
    6. The classic closing: "Hingga berita ini diturunkan, pihak … belum memberikan keterangan resmi." = At the time of publication, … had not issued an official statement.
    7. Achievement stories (this unit): meraih / menyabet medali emas, menyandang gelar (hold a title), mengharumkan nama bangsa (bring honour to the nation), di kancah internasional (on the international stage).
examples:
  - text: Pelajar Sorong Raih Emas di Olimpiade Sains Nasional
    breakdown: headline — capitalised words · Raih = bare form of meraih
    en: Sorong Student Wins Gold at National Science Olympiad
    ar_eg: طالب من سورونج يفوز بالذهبية في الأولمبياد العلمي الوطني (عنوان)
    ar: طالب من سورونغ يحرز الذهبية في الأولمبياد العلمي الوطني (عنوان)
    register: formal
  - text: Seorang siswa SMA asal Sorong meraih medali emas dalam Olimpiade Sains Nasional di Jakarta, Sabtu (10/8).
    breakdown: lead — siapa (siswa SMA asal Sorong) · apa (meraih medali emas) · di mana (Jakarta) · kapan (Sabtu (10/8))
    en: A high-school student from Sorong won a gold medal at the National Science Olympiad in Jakarta on Saturday (10 August).
    ar_eg: طالب ثانوي من سورونج كسب ميدالية ذهبية في الأولمبياد العلمي الوطني في جاكرتا يوم السبت (10 أغسطس).
    ar: أحرز طالب في المرحلة الثانوية من سورونغ ميدالية ذهبية في الأولمبياد العلمي الوطني بجاكرتا يوم السبت (10 أغسطس).
    register: formal
  - text: "\"Medali ini saya persembahkan untuk anak-anak Papua,\" ujarnya kepada wartawan."
    en: "\"I dedicate this medal to the children of Papua,\" he told reporters."
    ar_eg: "«الميدالية دي بهديها لأطفال بابوا»، قالها للصحفيين."
    ar: "«أُهدي هذه الميدالية إلى أطفال بابوا»، قال للصحفيين."
    register: formal
  - text: Prestasi itu dinilai mengharumkan nama Indonesia di kancah internasional.
    en: The achievement is considered to have brought honour to Indonesia on the international stage.
    ar_eg: الإنجاز ده بيعتبروه رفع اسم إندونيسيا على الساحة الدولية.
    ar: يُعدّ هذا الإنجاز رفعًا لاسم إندونيسيا على الساحة الدولية.
    register: formal
  - text: Hingga berita ini diturunkan, pihak panitia belum memberikan keterangan resmi.
    en: At the time of publication, the organisers had not issued an official statement.
    ar_eg: لحد نشر الخبر ده، اللجنة المنظمة مااديتش أي تصريح رسمي.
    ar: حتى نشر هذا الخبر، لم تُدلِ اللجنة المنظِّمة بأي تصريح رسمي.
    register: formal
  - text: Seorang pria yang diduga mencuri perlengkapan lomba diamankan petugas keamanan.
    en: A man suspected of stealing competition equipment was detained by security staff.
    ar_eg: راجل مشتبه إنه سرق أدوات المسابقة اتقبض عليه من الأمن.
    ar: احتجز أفراد الأمن رجلًا يُشتبه في سرقته معدات المسابقة.
    register: formal
mistakes:
  - wrong: Ujarnya, "Saya sangat bangga."
    right: "\"Saya sangat bangga,\" ujarnya."
    why:
      ar_eg: ujarnya / katanya بتيجي بعد الاقتباس، والفاصلة جوه علامة التنصيص.
      ar: تأتي ujarnya بعد الاقتباس، والفاصلة داخل علامتي التنصيص.
      en: ujarnya / katanya follows the quote, with the comma inside the quotation marks.
  - wrong: Pelaku pencurian itu ditangkap kemarin.
    right: Terduga pelaku pencurian itu ditangkap kemarin.
    why:
      ar_eg: قبل الحكم، الصحافة بتقول terduga (مشتبه فيه)، احترامًا لمبدأ البراءة.
      ar: قبل صدور الحكم يُقال terduga pelaku احترامًا لقرينة البراءة.
      en: Before a verdict, the press says terduga pelaku (suspect), respecting the presumption of innocence.
  - wrong: Pelajar Sorong Meraih Emas di Olimpiade Sains
    right: Pelajar Sorong Raih Emas di Olimpiade Sains
    why:
      ar_eg: العناوين الإندونيسية بتشيل meN- عشان تبقى قصيرة وقوية.
      ar: تُحذف meN- في العناوين للإيجاز والقوة.
      en: Indonesian headlines drop meN- to stay short and punchy.
arabic_bridge:
  ar_eg: "الخبر الإندونيسي شبه الخبر العربي في الجرايد: «أفادت التقارير» = dilaporkan، «يُشتبه في» = diduga، «نقلًا عن» = dikutip dari، «حتى كتابة هذه السطور» = hingga berita ini diturunkan. والكلمة نفسها berita / kabar: kabar ← خبر."
  ar: "تتقاطع عبارات الخبر مع نظائرها العربية: أفادت التقارير = dilaporkan، يُشتبه في = diduga، نقلًا عن = dikutip dari، حتى كتابة هذه السطور = hingga berita ini diturunkan. وkabar مأخوذة من «خبر»."
  en: "News phrasing parallels Arabic press language: أفادت التقارير = dilaporkan, يُشتبه في = diduga, نقلًا عن = dikutip dari, حتى كتابة هذه السطور = hingga berita ini diturunkan. And kabar itself ← خبر."
tags: [register, news, discourse, writing]
prerequisites: [id.reported-speech, id.nominalization, id.passive.di]
see_also: [id.register.audience, id.presentation.expressions, id.hedging]
cues:
  - match: "ujarnya|ujar|tuturnya"
    note:
      ar_eg: "ujarnya = قال (لغة الأخبار)."
      ar: "ujarnya = قال (أسلوب الأخبار)."
      en: "ujarnya = he/she said (news style)."
  - match: "dilaporkan"
    note:
      ar_eg: "dilaporkan = أفادت التقارير."
      ar: "dilaporkan = أُفيد."
      en: "dilaporkan = it was reported."
