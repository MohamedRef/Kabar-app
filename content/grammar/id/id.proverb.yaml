schema: kabar.grammar/v1
id: id.proverb
language: id
level: bipa6
title:
  target: Peribahasa (pepatah, perumpamaan, ungkapan)
  en: Proverbs
  ar_eg: الأمثال الشعبية الإندونيسية
  ar: الأمثال الإندونيسية
summary:
  ar_eg: "peribahasa = مثل. ليها تلات أشكال: pepatah (حكمة مباشرة)، perumpamaan (فيها bagai / seperti)، وungkapan (تعبير مجازي). كلماتها ثابتة، ولغتها قديمة شوية (tak، bagai)، وبتتقدّم بـ «Seperti kata pepatah, …»."
  ar: "peribahasa هي الأمثال، ومنها pepatah (حكمة مباشرة) وperumpamaan (بأداة تشبيه) وungkapan (تعبير مجازي)، وألفاظها ثابتة ذات طابع قديم، وتُقدَّم بعبارة Seperti kata pepatah."
  en: "peribahasa = proverbs: pepatah (a direct saying), perumpamaan (with bagai / seperti) and ungkapan (figurative expressions). Wording is fixed and slightly archaic (tak, bagai); introduce them with \"Seperti kata pepatah, …\"."
pattern:
  - "Seperti kata pepatah / peribahasa, … · Kata orang tua-tua, … · Bak kata pepatah, …"
  - "Perumpamaan: (seperti / bagai / bak / laksana) + image"
  - "Parallel halves: Lain lubuk lain ikannya, lain padang lain belalangnya"
  - "Archaic negation: tak = tidak"
explanation:
  ar_eg: |
    في المجتمع المينانجكاباو (اللي الوحدة دي فيه) الأمثال جزء من الكلام اليومي ومن خطب العادات. الكبير بيستخدم المثل عشان ينصح من غير ما يجرح — نفس دور المثل عندنا.
    الشكل:
    - pepatah: "حكمة: Tak ada gading yang tak retak = مفيش عاج من غير شرخ (محدش كامل)."
    - perumpamaan: "فيها أداة تشبيه: Bagai katak dalam tempurung = زي الضفدعة جوه قشرة جوز الهند (أفقه ضيق)."
    - ungkapan: تعبير مجازي قصير (هتشوفه أكتر في idiom).
    خصائص اللغة:
    - كلمات قديمة أو مختصرة: tak بدل tidak، bagai / bak بدل seperti.
    - توازي بين نصين: Bersatu kita teguh, bercerai kita runtuh. (الاتحاد قوة)
    - كلمات ثابتة؛ ماتغيرهاش ولا تترجمها بكلماتك.
    إزاي تدخّلها في الكلام: «Seperti kata pepatah, di mana bumi dipijak, di situ langit dijunjung.» أو «Kata orang tua-tua, …».
    مثل لازم تحفظه وإنت عايش في إندونيسيا: Di mana bumi dipijak, di situ langit dijunjung = في الأرض اللي بتدوس عليها، احترم السما اللي فوقها (احترم عادات البلد اللي إنت فيه).
  ar: |
    للأمثال مكانة كبيرة في المجتمع المينانجكاباوي، يُنصح بها دون تجريح.
    - pepatah: "حكمة مباشرة: Tak ada gading yang tak retak (لا عاج بلا شرخ، أي لا كمال لبشر)."
    - perumpamaan: "بأداة تشبيه: Bagai katak dalam tempurung (كالضفدع في قشرة جوز الهند، أي ضيّق الأفق)."
    - ungkapan: تعبير مجازي قصير.
    ومن سمات لغتها: الألفاظ القديمة (tak، bagai، bak)، والتوازي (Bersatu kita teguh, bercerai kita runtuh)، وثبات الألفاظ.
    وتُقدَّم بقول: Seperti kata pepatah, … أو Kata orang tua-tua, …
    ومن أهمها للمقيم: Di mana bumi dipijak, di situ langit dijunjung، أي احترم عادات البلد الذي تنزل فيه.
  en: |
    In Minangkabau society (this unit's setting), proverbs are part of everyday talk and of customary speeches; elders use them to advise without wounding — the same job proverbs do in Egypt.
    Kinds:
    - pepatah: "a saying: Tak ada gading yang tak retak = There's no ivory without a crack (nobody's perfect)."
    - perumpamaan: "with a comparison word: Bagai katak dalam tempurung = Like a frog under a coconut shell (narrow-minded)."
    - ungkapan: short figurative expressions (more in the idiom entries).
    Language features:
    - archaic or clipped words: tak for tidak, bagai / bak for seperti.
    - parallel halves: Bersatu kita teguh, bercerai kita runtuh (united we stand, divided we fall).
    - fixed wording — don't paraphrase it.
    To use one: "Seperti kata pepatah, di mana bumi dipijak, di situ langit dijunjung." or "Kata orang tua-tua, …".
    A must for anyone living in Indonesia: Di mana bumi dipijak, di situ langit dijunjung = Where you tread the earth, there you uphold the sky (respect local customs; "when in Rome").
examples:
  - text: Di mana bumi dipijak, di situ langit dijunjung.
    breakdown: di mana … di situ (wherever … there) · bumi dipijak (the earth is trodden) · langit dijunjung (the sky is upheld)
    en: Where you tread the earth, there you uphold the sky. (Respect the customs of the place you live in.)
    ar_eg: «يا غريب كن أديب» — احترم عادات البلد اللي إنت فيه.
    ar: حيثما وطئت أرضًا فاحترم سماءها، أي التزم أعراف البلد الذي تحلّ فيه.
  - text: Nasi sudah menjadi bubur.
    en: The rice has already turned to porridge. (What's done is done.)
    ar_eg: الرز اتهرى وبقى عصيدة — اللي حصل حصل، «سبق السيف العذل».
    ar: صار الأرز عصيدة، أي فات الأوان؛ «سبق السيف العذل».
  - text: Air beriak tanda tak dalam.
    en: Rippling water shows it isn't deep. (Those who talk loudest often know least.)
    ar_eg: المية اللي بتعمل موج مش عميقة — اللي صوته عالي غالبًا فاضي.
    ar: الماء المتموّج دليل على ضحالته، أي إن كثير الكلام قليل العلم.
  - text: Bagai pinang dibelah dua.
    en: Like an areca nut split in two. (Two people who look exactly alike — or a perfect couple.)
    ar_eg: «زي الفولة واتقسمت نصين» بالظبط!
    ar: كأنهما فولة انشقت نصفين، أي متطابقان شبهًا.
  - text: Lain lubuk lain ikannya, lain padang lain belalangnya.
    en: A different pool, different fish; a different field, different grasshoppers. (Every place has its own customs.)
    ar_eg: كل بلد وليها عاداتها، «كل بلد وليها زي».
    ar: لكل أرض أعرافها، ولكل قوم عاداتهم.
  - text: Seperti kata pepatah, tak ada gading yang tak retak. Kita semua pernah salah.
    en: As the saying goes, there's no ivory without a crack. We've all made mistakes.
    ar_eg: زي ما بيقولوا، الكمال لله. كلنا غلطنا قبل كده.
    ar: "كما يقول المثل: الكمال لله. كلنا أخطأنا من قبل."
mistakes:
  - wrong: Seperti katak yang tinggal di dalam tempurung kelapa.
    right: Bagai katak dalam tempurung. / Seperti katak di bawah tempurung.
    why:
      ar_eg: كلمات المثل ثابتة؛ لو قلته بكلامك هيبان إنك مش حافظه. فيه صيغتين معروفتين بس (dalam / di bawah tempurung)، استعمل واحدة منهم زي ما هي.
      ar: "ألفاظ المثل ثابتة فلا يُعاد صوغه، وله صيغتان معروفتان: Bagai katak dalam tempurung وSeperti katak di bawah tempurung."
      en: Proverb wording is fixed — don't paraphrase it. Two forms are well known (dalam tempurung / di bawah tempurung); use one as it stands.
  - wrong: "Using Air beriak tanda tak dalam to praise a lively speaker."
    right: Use it to criticise someone who talks big but knows little.
    why:
      ar_eg: المثل ده نقد مش مدح؛ معناه «فاضي وصوته عالي».
      ar: المثل ذمّ لا مدح، ومعناه أن كثير الكلام قليل العلم.
      en: It's a criticism, not praise — it means someone is loud and shallow.
  - wrong: Nasi sudah jadi bubur, jadi ayo kita perbaiki dari awal!
    right: Nasi sudah menjadi bubur; yang bisa kita lakukan sekarang adalah memperbaikinya ke depan.
    why:
      ar_eg: المثل معناه إن اللي فات مايتصلّحش، فماينفعش تقول بعده «نصلّحه من الأول». ممكن تقول نبص لقدام.
      ar: معنى المثل أن ما فات لا يُستدرك، فلا يُتبع بالدعوة إلى إصلاحه من أوله.
      en: The proverb says the past can't be undone, so don't follow it with "let's fix it from the start"; look forward instead.
arabic_bridge:
  ar_eg: "الأمثال دي ليها توأم عندنا: Di mana bumi dipijak = «يا غريب كن أديب»، Nasi sudah menjadi bubur = «سبق السيف العذل»، Tak ada gading yang tak retak = «الكمال لله»، Bagai pinang dibelah dua = «زي الفولة واتقسمت نصين». وفي المينانجكاباو: «Adat basandi syarak, syarak basandi Kitabullah» = العادة مبنية على الشرع، والشرع مبني على كتاب الله — adat ← عادة، syarak ← شرع."
  ar: "لها نظائر عربية: Di mana bumi dipijak ≈ «يا غريب كن أديبًا»، Nasi sudah menjadi bubur ≈ «سبق السيف العذل»، Tak ada gading yang tak retak ≈ «الكمال لله». ومن أمثال المينانجكاباو: Adat basandi syarak, syarak basandi Kitabullah، وفيها adat ← عادة وsyarak ← شرع وKitabullah ← كتاب الله."
  en: "Many have Arabic twins: Di mana bumi dipijak ≈ «يا غريب كن أديب», Nasi sudah menjadi bubur ≈ «سبق السيف العذل», Tak ada gading yang tak retak ≈ «الكمال لله», Bagai pinang dibelah dua ≈ Egyptian «زي الفولة واتقسمت نصين». The Minang motto Adat basandi syarak, syarak basandi Kitabullah uses adat ← عادة, syarak ← شرع, Kitabullah ← كتاب الله."
