schema: kabar.grammar/v1
id: id.irony
language: id
level: bipa6
title:
  target: Ironi, sinisme, sarkasme, plesetan
  en: Irony, sarcasm and wordplay
  ar_eg: التريقة والسخرية واللعب بالكلام
  ar: التهكّم والسخرية والتلاعب اللفظي
summary:
  ar_eg: "ironi = تقول عكس اللي تقصده بلطف (Rajin sekali kamu! لواحد متأخر). sinisme = سخرية فيها شك واحتقار. sarkasme = تريقة جارحة ومباشرة. وplesetan = لعب بالكلمات (تحريف كلمة أو اختصار). الإشارة: مدح مبالغ فيه في موقف وحش."
  ar: "ironi قول الضد بلطف، وsinisme سخرية فيها تشكّك وازدراء، وsarkasme تهكّم جارح، وplesetan تحريف الألفاظ للدعابة؛ وعلامتها مدح مبالغ فيه في موقف سيئ."
  en: "ironi = saying the opposite, mildly (\"Rajin sekali kamu!\" to a latecomer); sinisme = mocking doubt or contempt; sarkasme = cutting, open mockery; plesetan = wordplay (twisting words or acronyms). The signal is over-the-top praise in a bad situation."
pattern:
  - "Praise word + sekali / banget + bad fact: Rajin sekali, baru datang jam sebelas."
  - "Thanks for something bad: Terima kasih, lho, sudah menghabiskan kuenya."
  - "Mock-quote with katanya: Katanya negara hukum, tapi …"
  - "Parallel contrast (satire): Hukum tajam ke bawah, tumpul ke atas."
  - "Plesetan: twisted word / acronym, e.g. mantul (mantap betul)"
explanation:
  ar_eg: |
    الوحدة دي عند بحيرة توبا، والباتاك مشهورين بالهزار الصريح، والكوميديا الإندونيسية (stand-up والميمز) عايشة على التريقة.
    الأنواع حسب شدّتها:
    1. ironi (أخف): تقول العكس وإنت بتبتسم: «Rajin sekali kamu, baru datang jam sebelas» = ما شاء الله على نشاطك، جاي الساعة حداشر.
    2. sinisme: فيها شك واحتقار للدوافع: «Ah, pejabat itu peduli rakyat kalau mau pemilu saja.» = المسؤول ده بيحب الشعب بس أيام الانتخابات.
    3. sarkasme (الأقسى): تريقة جارحة ممكن تبقى إهانة: «Otakmu ditaruh di mana?» = مخك فين؟
    إزاي تكتشف السخرية:
    - مدح كبير + موقف وحش: «Mulus sekali jalannya, ya» عن طريق مليان حفر.
    - kok، lho، deh، dong بنبرة معينة، وكلمة «katanya» (= «على حد قولهم») عشان تشكّك.
    - علامات تنصيص حوالين كلمة في الكتابة: «Jalan "mulus" itu …».
    - في السوشيال ميديا: ايموجي 🙂 أو «wkwk» بعد جملة جادة.
    الساتير (satire) بيعتمد كتير على التوازي والتناقض: «Hukum tajam ke bawah, tumpul ke atas» = القانون حاد على الصغيرين وتلم على الكبار — دي جملة مشهورة جدًا.
    الـ plesetan: تحريف كلمة أو اختصار للضحك: mantul = mantap betul (جامد جدًا)؛ والإندونيسيين بيعشقوا يحوّلوا الاختصارات لنكت.
  ar: |
    تقع الوحدة عند بحيرة توبا، والباتاك مشهورون بدعابتهم الصريحة، والكوميديا الإندونيسية تقوم على التهكم.
    1. ironi (أخفها): قول الضد مع ابتسامة: «Rajin sekali kamu, baru datang jam sebelas».
    2. sinisme: سخرية فيها تشكيك في النوايا: «Pejabat itu peduli rakyat kalau mau pemilu saja».
    3. sarkasme (أقساها): تهكم جارح قد يبلغ الإهانة.
    وعلاماتها: المدح المبالغ في موقف سيئ، وأدوات مثل kok وlho بنبرة خاصة، وkatanya للتشكيك، وعلامات التنصيص حول الكلمة، والرموز التعبيرية.
    ويقوم الهجاء (satire) على التقابل: «Hukum tajam ke bawah, tumpul ke atas» (القانون حادّ على الضعفاء كليل عن الأقوياء).
    والـ plesetan تحريف الألفاظ أو الاختصارات للدعابة، مثل mantul من mantap betul.
  en: |
    This unit is at Lake Toba; Batak humour is famously blunt, and Indonesian stand-up and memes thrive on irony.
    From mild to harsh:
    1. ironi: saying the opposite with a smile: "Rajin sekali kamu, baru datang jam sebelas" = So hard-working — turning up at eleven.
    2. sinisme: mocking doubt about motives: "Ah, pejabat itu peduli rakyat kalau mau pemilu saja." = That official cares about the people only when an election's coming.
    3. sarkasme: cutting mockery that can become an insult: "Otakmu ditaruh di mana?" = Where did you leave your brain?
    How to spot it:
    - big praise + bad situation: "Mulus sekali jalannya, ya" about a road full of potholes.
    - kok, lho, deh, dong in a certain tone, and katanya ("so they claim") to cast doubt.
    - scare quotes in writing: Jalan "mulus" itu …
    - online: 🙂 or "wkwk" after a serious-sounding line.
    Satire leans on parallel contrast: "Hukum tajam ke bawah, tumpul ke atas" = The law is sharp downwards and blunt upwards — a very well-known line.
    plesetan: twisting a word or acronym for laughs: mantul = mantap betul (awesome); Indonesians love turning acronyms into jokes.
examples:
  - text: Wah, rajin sekali kamu, baru datang jam sebelas.
    breakdown: ironi — rajin sekali (very diligent) + baru datang jam sebelas (only arrived at eleven)
    en: Wow, aren't you hard-working — only turning up at eleven.
    ar_eg: ما شاء الله على النشاط، جاي الساعة حداشر!
    ar: ما أنشطك! لم تحضر إلا في الحادية عشرة.
    register: informal
  - text: Mulus sekali jalannya, ya. Ban saya sampai pecah dua kali.
    en: What a smooth road! My tyre only burst twice.
    ar_eg: الطريق ناعم قوي! الكاوتش فرقع مرتين بس.
    ar: ما أنعم هذا الطريق! انفجر إطاري مرتين فقط.
    register: informal
  - text: Hukum di negeri ini tajam ke bawah, tumpul ke atas.
    breakdown: antithesis + satire — tajam (sharp) ↔ tumpul (blunt), ke bawah (downwards) ↔ ke atas (upwards)
    en: In this country the law is sharp towards those below and blunt towards those above.
    ar_eg: القانون في البلد دي سكينة على الغلابة، وتلمة على الكبار.
    ar: القانون في هذا البلد حادٌّ على الضعفاء، كليلٌ عن الأقوياء.
    register: formal
  - text: Katanya kota ramah pejalan kaki, tapi trotoarnya jadi tempat parkir motor.
    en: It's supposedly a pedestrian-friendly city, yet the pavements are motorbike parking.
    ar_eg: بيقولوا عليها مدينة صديقة للمشاة، والرصيف بقى جراج موتوسيكلات!
    ar: يزعمون أنها مدينة صديقة للمشاة، بينما صارت أرصفتها مواقف للدراجات النارية.
  - text: Terima kasih, lho, sudah menghabiskan kue ulang tahunku.
    en: Thanks so much for finishing off my birthday cake.
    ar_eg: متشكرين أوي إنك خلّصت تورتة عيد ميلادي.
    ar: شكرًا جزيلًا لأنك أنهيت كعكة عيد ميلادي.
    register: informal
mistakes:
  - wrong: "«Pintar sekali, kunci mobilnya ditinggal di dalam.» → praise"
    right: "«Pintar sekali, kunci mobilnya ditinggal di dalam.» → irony (= what a silly thing to do)"
    why:
      ar_eg: المدح الكبير على تصرف غلط = تريقة. «يا ذكي، سايب المفتاح جوه العربية!»
      ar: المدح المبالغ على فعل خاطئ تهكّم لا ثناء.
      en: Lavish praise for a blunder is irony, not a compliment.
  - wrong: Using sarkasme with a boss or a stranger to be funny.
    right: Keep irony light and save it for close friends.
    why:
      ar_eg: الهزار الجارح مع حد مش قريب منك أو أكبر منك بيتفهم إهانة؛ الإندونيسيين بيحافظوا على «الوش» جدًا.
      ar: التهكم الجارح مع غير المقرّبين أو الأكبر مقامًا يُعدّ إهانة، فثقافة حفظ ماء الوجه قوية.
      en: Cutting sarcasm with someone who isn't close, or who outranks you, reads as an insult; face-saving matters a lot.
  - wrong: "«Mantul» → a word from KBBI to use in an essay"
    right: "«Mantul» → slang plesetan (mantap betul); casual and online only"
    why:
      ar_eg: الـ plesetan عامية وهزار، مكانها الشات والميمز، مش الكتابة الرسمية.
      ar: الـ plesetan عامية مكانها المحادثة ومواقع التواصل لا الكتابة الرسمية.
      en: Plesetan is slang for chat and memes, not for formal writing.
arabic_bridge:
  ar_eg: "إحنا المصريين أساتذة في ده! «يا سلام!» و«ده إنت عبقري» بنبرة معينة = ironi بالظبط. والـ plesetan هي «القلش» و«الإفيه». وفي البلاغة العربية فيه «التهكّم» (المدح اللي جوّاه ذمّ) و«التورية». بس خد بالك: الإندونيسي أهدى في المواجهة، فالتريقة القاسية اللي ممكن تعدّي في القاهرة ممكن تجرح هناك."
  ar: "عرفت البلاغة العربية «التهكّم» وهو إخراج الذم في صورة المدح، و«التورية»، ويقابل الـ plesetan ما يُعرف بالتلاعب اللفظي. غير أن الإندونيسيين أشد حرصًا على تجنب المواجهة، فما يُحتمل من تهكم في سياق عربي قد يجرح هناك."
  en: "Egyptians are masters of this — «يا سلام!» or «ده إنت عبقري» in the right tone is pure ironi, and plesetan is «القلش» / «الإفيه». Classical Arabic rhetoric calls irony تهكّم (blame dressed as praise). But Indonesians avoid confrontation more, so sarcasm that's fine in Cairo can hurt there."
