schema: kabar.grammar/v1
id: id.implicature
language: id
level: bipa6
title:
  target: Makna tersirat
  en: Implied meaning (reading between the lines)
  ar_eg: المعنى الضمني (اللي بين السطور)
  ar: المعنى الضمني
summary:
  ar_eg: "الإندونيسي كتير بيقول حاجة وهو يقصد حاجة تانية: «Panas, ya» ممكن تبقى «افتح الشباك». في الكلام والأدب لازم تقرا السياق والأدوات الصغيرة (kok، juga، ya، lumayan) واللي ماتقالش."
  ar: "كثيرًا ما يُقال في الإندونيسية شيء ويُقصد غيره، فـ«Panas, ya» قد تعني «افتح النافذة»؛ ويُستدل على المعنى الضمني بالسياق والأدوات الصغيرة وما سُكت عنه."
  en: "Indonesians often say one thing and mean another — \"Panas, ya\" can mean \"please open the window\". Read the context, the small particles (kok, juga, ya, lumayan) and what is left unsaid."
pattern:
  - "Observation instead of request: Panas, ya … (= please turn on the fan)"
  - "Time remark instead of 'let's go': Sudah malam, nih …"
  - "Soft no: Nanti dulu / Lihat nanti / Belum bisa / Insyaallah, ya …"
  - "Evaluation with juga / lumayan: Mahal juga, ya (= too expensive)"
  - "kok + statement = surprise or mild reproach: Kok baru datang?"
  - "Narrative: action or silence that shows a feeling the text never names"
explanation:
  ar_eg: |
    الهدف في BIPA 6 إنك تفهم «makna tersirat» = المعنى المستخبي، في الكلام اليومي وفي القصة القصيرة.
    في الكلام:
    - الطلب في شكل ملاحظة: «Panas, ya, di sini» (الجو حر هنا، صح؟) = شغّل المروحة / افتح الشباك.
    - إشارة للوقت: «Wah, sudah jam sepuluh, ya» = أنا عايز أمشي.
    - الرفض المستخبي: «Nanti dulu, ya» / «Lihat nanti» / «Belum bisa» / «Nanti saya kabari» = غالبًا لا.
    - ya و«iya» مش دايمًا «موافق»؛ ساعات معناها «سامعك».
    - الأدوات بتشيل نية: «Mahal juga, ya» = غالي بزيادة (juga هنا = «بصراحة / طلع»). «Lumayan» = مش وحش (مدح خفيف وممكن يكون فاتر). «Kok baru datang?» = ليه لسه جاي؟ (لوم خفيف).
    - «Terserah» بنبرة معينة = أنا مضايق، اعمل اللي إنت عايزه.
    في الأدب (cerpen):
    الكاتب الإندونيسي كتير مابيقولش «كانت حزينة»؛ بيوريك فعل: «Ibu hanya diam, lalu kembali mengaduk teh yang sudah lama dingin.» الشاي البارد والسكوت = حزن وشرود. دوّر على: التكرار، السكوت، التفاصيل اللي مالهاش لازمة ظاهريًا، والنهاية المفتوحة.
    إزاي تسأل نفسك: «ليه قال كده هنا؟ إيه اللي كان ممكن يقوله ومقالوش؟»
  ar: |
    يطلب المستوى السادس فهم المعنى الضمني (makna tersirat) في الحديث اليومي والقصة القصيرة.
    في الحديث:
    - الطلب في صورة ملاحظة: «Panas, ya, di sini» أي شغّل المروحة.
    - الإشارة إلى الوقت: «Sudah jam sepuluh, ya» أي أريد الانصراف.
    - الرفض المضمر: Nanti dulu، Lihat nanti، Belum bisa، Nanti saya kabari.
    - ya لا تعني دائمًا الموافقة بل قد تعني «أسمعك».
    - الأدوات: «Mahal juga, ya» = غالٍ أكثر من اللازم، وlumayan مدح فاتر، و«Kok baru datang?» عتاب.
    في الأدب: يُظهر الكاتب الشعور بالفعل لا بالتسمية: «Ibu hanya diam, lalu kembali mengaduk teh yang sudah lama dingin.» فالصمت والشاي البارد يدلان على الحزن والشرود. ويُنظر في التكرار والصمت والتفاصيل الزائدة ظاهرًا والنهايات المفتوحة.
  en: |
    BIPA 6 asks you to understand makna tersirat — implied meaning — in conversation and in short stories.
    In conversation:
    - Requests disguised as observations: "Panas, ya, di sini" (It's hot in here, isn't it?) = turn on the fan / open the window.
    - Time remarks: "Wah, sudah jam sepuluh, ya" = I'd like to leave.
    - Hidden refusals: "Nanti dulu, ya" / "Lihat nanti" / "Belum bisa" / "Nanti saya kabari" = usually no.
    - ya / iya isn't always agreement; often it just means "I hear you".
    - Particles carry intent: "Mahal juga, ya" = that's (surprisingly) too expensive; "Lumayan" = not bad (faint, maybe lukewarm praise); "Kok baru datang?" = why are you only arriving now? (mild reproach).
    - "Terserah" in a certain tone = I'm annoyed, do what you want.
    In literature (cerpen):
    Indonesian writers often won't say "she was sad"; they show an action: "Ibu hanya diam, lalu kembali mengaduk teh yang sudah lama dingin." Silence and long-cold tea = grief, distraction. Look for repetition, silence, seemingly irrelevant details and open endings.
    Ask yourself: "Why say this here? What could have been said and wasn't?"
examples:
  - text: Panas, ya, di sini.
    en: "It's hot in here, isn't it? (implied: could you turn on the fan / open the window?)"
    ar_eg: "الجو حر هنا، مش كده؟ (يعني: ممكن تشغّل المروحة؟)"
    ar: "الجو حار هنا، أليس كذلك؟ (أي: هلّا شغّلت المروحة؟)"
    register: neutral
  - text: Wah, sudah jam sepuluh, ya. Besok saya harus berangkat pagi.
    en: "Oh, it's ten o'clock already. I have to leave early tomorrow. (implied: I'd like to go home now)"
    ar_eg: "ياه، الساعة بقت عشرة. أنا لازم أخرج بدري بكرة. (يعني: عايز أروّح)"
    ar: "آه، صارت الساعة العاشرة. عليّ أن أخرج باكرًا غدًا. (أي: أودّ الانصراف)"
  - text: Idenya bagus, nanti kita bicarakan lagi, ya.
    en: "It's a good idea; let's talk about it again later. (often implied: not now — probably not at all)"
    ar_eg: "الفكرة حلوة، نبقى نتكلم فيها بعدين. (وغالبًا: لأ)"
    ar: "الفكرة جيدة، سنتحدث عنها لاحقًا. (وكثيرًا ما تعني الرفض)"
  - text: Mahal juga, ya, harganya.
    breakdown: "mahal (expensive) · juga (here: 'turns out, rather') · ya (seeking agreement)"
    en: "That's pretty expensive, isn't it? (implied: too expensive for me)"
    ar_eg: "غالي برضه السعر ده، مش كده؟ (يعني: غالي عليّا)"
    ar: "السعر مرتفع حقًّا، أليس كذلك؟ (أي: أغلى مما أريد)"
    register: informal
  - text: Ibu hanya diam, lalu kembali mengaduk teh yang sudah lama dingin.
    en: Mother said nothing, then went back to stirring tea that had long gone cold.
    ar_eg: ماما سكتت خالص، وبعدين رجعت تقلّب شاي كان برد من بدري. (حزن وشرود من غير ما يتقال)
    ar: لزمت الأم الصمت، ثم عادت تحرّك شايًا برد منذ زمن. (حزن وشرود دون تصريح)
    register: formal
mistakes:
  - wrong: "A: Kapan-kapan mampir ke rumah, ya! — B: Besok jam berapa?"
    right: "A: Kapan-kapan mampir ke rumah, ya! — B: Iya, terima kasih, kapan-kapan."
    why:
      ar_eg: «Kapan-kapan mampir» مجاملة زي «ابقى عدّي علينا»، مش عزومة بميعاد. ردّ بمجاملة زيها.
      ar: «Kapan-kapan mampir» مجاملة لا دعوة محددة، ويُردّ عليها بمثلها.
      en: '"Kapan-kapan mampir" is a courtesy like "drop by sometime", not a real invitation with a time; answer in kind.'
  - wrong: "«Nanti saya kabari, ya.» → understood as a firm yes"
    right: "«Nanti saya kabari, ya.» → maybe, often a soft no"
    why:
      ar_eg: «هبقى أبلّغك» في سياق تفاوض أو طلب غالبًا معناها مش دلوقتي، وممكن مش خالص. استنى تأكيد صريح.
      ar: «سأخبرك لاحقًا» في التفاوض كثيرًا ما تعني التأجيل أو الرفض، فلا يُعتمد عليها دون تأكيد صريح.
      en: '"I''ll let you know" in a negotiation often means not now, or not at all; wait for an explicit yes.'
  - wrong: "«Iya, iya.» → understood as agreement"
    right: "«Iya, iya.» → 'I hear you' (maybe impatient)"
    why:
      ar_eg: iya المكررة كتير معناها «ماشي، سامعك» أو حتى زهق، مش موافقة على الكلام.
      ar: تكرار iya يدل غالبًا على الاستماع أو الضجر لا على الموافقة.
      en: Repeated iya often means "OK, I hear you" or even impatience — not agreement.
arabic_bridge:
  ar_eg: "إنت مصري، فإنت محترف في ده أصلًا! «ربنا يسهّل» = لأ، «ابقى عدّي علينا» = مجاملة، «الجو حر قوي» = شغّل التكييف. الإندونيسي نفس الثقافة: الكلام المباشر قلة ذوق، والمعنى في السياق. بس الإشارات مختلفة، فاتعلم «الشفرة» بتاعتهم: nanti، belum، juga، kok."
  ar: "للعربية تراث في هذا؛ فالبلاغيون فرّقوا بين المعنى ومعنى المعنى (عبد القاهر الجرجاني)، والكناية والتعريض من صميمه. والثقافة المصرية كالإندونيسية تؤثر التلميح على التصريح، غير أن الإشارات تختلف."
  en: "Egyptians already live this: «ربنا يسهّل» = no, «ابقى عدّي علينا» = courtesy, «الجو حر قوي» = turn on the AC. Arabic rhetoric even names it — al-Jurjānī's 'meaning of the meaning' (معنى المعنى) and taʿrīḍ (hinting). Indonesian shares the indirectness; only the signals differ."
