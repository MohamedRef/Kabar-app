schema: kabar.grammar/v1
id: id.figurative.simile-hyperbole
language: id
level: bipa4
title:
  target: seperti, bagaikan, laksana, bak — dan hiperbola
  en: Simile and hyperbole
  ar_eg: التشبيه والمبالغة
  ar: التشبيه والمبالغة
summary:
  ar_eg: "التشبيه بـ seperti / bagai / bagaikan / laksana / bak = زي / كأن، والمبالغة = كلام أكبر من الحقيقة عشان التأثير (harganya selangit = سعره في السما)."
  ar: "التشبيه بأدوات seperti / bagai / bagaikan / laksana / bak، والمبالغة تكبير الوصف للتأثير (harganya selangit)."
  en: "Similes use seperti / bagai / bagaikan / laksana / bak (like, as); hyperbole exaggerates for effect (harganya selangit = sky-high price)."
pattern:
  - A + seperti / bagai / bagaikan / laksana / bak + B (A is like B)
  - seolah-olah / seakan-akan + clause (as if)
  - "fixed similes: seperti pinang dibelah dua, bagai air di daun talas"
  - "hyperbole: se- + huge thing (selangit, segunung), numbers (seribu kali), extreme verbs (hancur berkeping-keping)"
explanation:
  ar_eg: |
    التشبيه (perumpamaan / simile): بتقارن حاجتين بأداة:
    - seperti = زي (الأشهر والعادي).
    - bagai / bagaikan / laksana / bak = كـ / كأنّه — أدبي، في الشعر والأغاني والوصف.
    - seolah-olah / seakan-akan + جملة = كأنّ: Ia diam seolah-olah tidak mendengar = سكت كأنه ما سمعش.
    تشبيهات ثابتة مشهورة (ما تغيرش كلماتها):
    - seperti pinang dibelah dua = زي الفولة اللي اتقسمت نصين (شبه بعض بالظبط).
    - bagai air di daun talas = زي المية على ورقة القلقاس (مش ثابت، متقلب).
    - seperti katak dalam tempurung = زي الضفدعة اللي تحت قشرة جوز الهند (عقله ضيق، ما شافش الدنيا).
    - seperti kacang lupa kulitnya = زي الفول اللي نسي قشره (ناكر للجميل، نسي أصله).
    المبالغة (hiperbola): بتكبّر الكلام للتأثير:
    - harganya selangit = سعره في السما، keringat sebesar biji jagung = عرق قد حب الدرة، sudah seribu kali saya bilang = قلتلك ألف مرة، hatinya hancur berkeping-keping = قلبه اتكسر حتت.
    في الوصف الأدبي استعملهم، بس في التقرير الرسمي خليك دقيق.
  ar: |
    التشبيه (perumpamaan): مقارنة بأداة:
    - seperti: مثل، وهي الأشيع.
    - bagai / bagaikan / laksana / bak: كـ، وهي أدبية.
    - seolah-olah / seakan-akan + جملة: كأنّ.
    ومن التشبيهات الثابتة: seperti pinang dibelah dua (متطابقان)، bagai air di daun talas (متقلب)، seperti katak dalam tempurung (ضيق الأفق)، seperti kacang lupa kulitnya (ناكر للأصل والجميل).
    والمبالغة (hiperbola): harganya selangit (ثمنه يناطح السماء)، keringat sebesar biji jagung، seribu kali، hancur berkeping-keping.
    وتُستعمل في الوصف الأدبي لا في التقارير الرسمية.
  en: |
    Simile (perumpamaan) compares two things with a marker:
    - seperti = like (the everyday one).
    - bagai / bagaikan / laksana / bak = like, as — literary: poems, songs, vivid description.
    - seolah-olah / seakan-akan + clause = as if: Ia diam seolah-olah tidak mendengar.
    Fixed similes (don't change the words):
    - seperti pinang dibelah dua = like a split areca nut (identical).
    - bagai air di daun talas = like water on a taro leaf (fickle, unsteady).
    - seperti katak dalam tempurung = like a frog under a coconut shell (narrow-minded).
    - seperti kacang lupa kulitnya = like a peanut forgetting its shell (ungrateful, forgetting one's roots).
    Hyperbole (hiperbola) exaggerates for effect: harganya selangit (sky-high price), keringat sebesar biji jagung (sweat drops as big as corn kernels), sudah seribu kali saya bilang (I've told you a thousand times), hatinya hancur berkeping-keping (heart smashed to pieces).
    Use them in vivid description; keep formal reports literal.
examples:
  - text: Atap rumah tongkonan melengkung seperti perahu.
    breakdown: A (atap) · melengkung (curves) · seperti (like) · B (perahu)
    en: The roof of a tongkonan house curves like a boat.
    ar_eg: سقف بيت التونجكونان معووج زي المركب.
    ar: ينحني سقف بيت التونغكونان كالقارب.
  - text: Kedua saudara kembar itu seperti pinang dibelah dua.
    en: Those twins are like two peas in a pod.
    ar_eg: التوأم دول زي الفولة اللي اتقسمت نصين.
    ar: هذان التوأمان متشابهان كأنهما شقّا ثمرة واحدة.
  - text: Wajahnya bersinar bagaikan bulan purnama.
    en: Her face shone like the full moon.
    ar_eg: وشها منوّر زي البدر.
    ar: أشرق وجهها كالبدر.
    register: formal
  - text: Desa di lembah itu terlihat bagai lukisan.
    en: The village in the valley looks like a painting.
    ar_eg: القرية اللي في الوادي باينة زي اللوحة.
    ar: تبدو القرية في الوادي كأنها لوحة.
  - text: Harga tiket masuk museum itu selangit!
    en: The museum's entry ticket costs a fortune!
    ar_eg: تذكرة دخول المتحف ده سعرها في السما!
    ar: ثمن تذكرة دخول ذلك المتحف باهظ جدًا!
    register: informal
  - text: Setelah mendaki, keringatnya sebesar biji jagung.
    en: After the climb, he was sweating buckets (drops as big as corn kernels).
    ar_eg: بعد الطلوع، العرق كان نازل منه قد حب الدرة.
    ar: بعد التسلق تصبّب عرقه بقطرات كحبّ الذرة.
mistakes:
  - wrong: Rumahnya seperti bagaikan istana.
    right: Rumahnya seperti istana. / Rumahnya bagaikan istana.
    why:
      ar_eg: أداة تشبيه واحدة بس.
      ar: تكفي أداة تشبيه واحدة.
      en: One simile marker is enough.
  - wrong: Mereka seperti pisang dibelah dua.
    right: Mereka seperti pinang dibelah dua.
    why:
      ar_eg: "التشبيهات الثابتة ما تتغيرش كلماتها: pinang (فوفل) مش pisang (موز)."
      ar: "لا تُغيَّر ألفاظ التشبيه الثابت: pinang لا pisang."
      en: Fixed similes keep their exact words — pinang (areca nut), not pisang (banana).
  - wrong: Menurut laporan resmi, harga tiket selangit.
    right: Menurut laporan resmi, harga tiket naik 50 persen.
    why:
      ar_eg: المبالغة للأدب والكلام؛ في التقرير الرسمي قول الحقيقة بالظبط.
      ar: المبالغة للأدب والحديث، والتقرير الرسمي يلتزم الدقة.
      en: Hyperbole suits stories and talk; formal reports stay literal.
arabic_bridge:
  ar_eg: "البلاغة العربية عندها نفس الأبواب: «التشبيه» بأداة (كـ، مثل، كأنّ) = seperti / bagaikan / seolah-olah، و«المبالغة». وتشبيه «وجهها كالبدر» = Wajahnya bagaikan bulan purnama — نفس الصورة بالظبط! و seperti pinang dibelah dua زي قولنا «زي الفولة اللي اتقسمت نصين»."
  ar: "في البلاغة العربية بابا التشبيه والمبالغة؛ وأدوات التشبيه (الكاف، مثل، كأنّ) تقابل seperti / bagaikan / seolah-olah، و«وجهها كالبدر» = Wajahnya bagaikan bulan purnama."
  en: Arabic rhetoric has the same categories — tashbīh with كـ / مثل / كأنّ (= seperti / bagaikan / seolah-olah) and mubālagha; «وجهها كالبدر» is exactly Wajahnya bagaikan bulan purnama.
