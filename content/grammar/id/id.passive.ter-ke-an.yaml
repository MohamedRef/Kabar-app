schema: kabar.grammar/v1
id: id.passive.ter-ke-an
language: id
level: bipa5
title:
  target: di- vs ter- vs ke-…-an (dibakar, terbakar, kebakaran)
  en: Passives of state, accident and adversity
  ar_eg: المبني للمجهول بتاع الحالة والصدفة والمصيبة (di- / ter- / ke-…-an)
  ar: صيغ المجهول للحالة والمصادفة والضرر
summary:
  ar_eg: "di- = حد عمل كده بقصد (dibakar = اتحرق بفعل فاعل). ter- = حصل من غير قصد أو بقى حالة (terbakar = اتحرق / محروق). ke-…-an = حاجة وحشة حصلت للفاعل (kebanjiran = غرقوا في الفيضان)."
  ar: "di- لفعل مقصود له فاعل، وter- للحالة أو الحدوث بلا قصد، وke-…-an لما يصيب الفاعل من ضرر."
  en: "di- = done deliberately by someone (dibakar = was burned); ter- = happened without intent, or a resulting state (terbakar = burned / caught fire); ke-…-an = something bad happened to the subject (kebanjiran = got flooded)."
pattern:
  - "X + di- + verb (+ oleh agent)   → deliberate act"
  - "X + ter- + root   → state, accident, or (with tidak) 'can't be done'"
  - "Sufferer + ke-…-an + root (+ thing)   → adversity"
  - "tidak + ter- + root   → impossible: tidak terbaca, tidak terhitung"
explanation:
  ar_eg: |
    في موضوع الغابات والحرايق، الفرق بين الصيغ التلاتة هو الفرق بين «حد ولّع فيها» و«ولعت» و«الناس اتنكبوا بالحريقة»:
    1. di- (عرفتها في BIPA 3): فيه فاعل وقصد. Hutan itu sengaja dibakar untuk membuka lahan = الغابة اتحرقت عمدًا عشان يفتحوا أرض.
    2. ter- (عرفتها في BIPA 4) هنا بمعاني:
       - حدث من غير قصد: terbakar (ولعت)، terjatuh (وقع)، tertidur (نام من غير ما ياخد باله)، terbawa (اتاخد بالغلط).
       - حالة نتيجة: pintunya tertutup = الباب مقفول (مش مهم مين قفله).
       - مع tidak = مايتعملش / مستحيل: tidak terbaca (مايتقريش)، tidak terhitung (مايتعدّش).
    3. ke-…-an للمصيبة: الفاعل هو «الضحية»: kebanjiran (غرق في الفيضان)، kehujanan (اتبهدل من المطر)، kecurian (اتسرق منه حاجة)، kehilangan (ضاع منه)، ketinggalan (فاته)، kedinginan (برد عليه).
       Desa itu kebanjiran = القرية غرقت من الفيضان. Saya kecurian dompet = اتسرقت مني المحفظة.
    خلّي بالك: في ke-…-an الفاعل هو اللي اتضرر، مش الحاجة: Saya kecurian (أنا اتسرق مني)، لكن Dompet saya dicuri (المحفظة اتسرقت).
    وفي الأخبار: «Ribuan hektare hutan terbakar» محايدة، و«dibakar» اتهام إن فيه حد عملها؛ اختيار الصيغة موقف.
  ar: |
    ثلاث صيغ تفرّق بين الفعل المقصود والحادث والضرر:
    1. di-: فعل مقصود له فاعل: Hutan itu sengaja dibakar (أُحرقت الغابة عمدًا).
    2. ter-: (أ) حدوث بلا قصد: terbakar (احترق)، terjatuh، tertidur. (ب) حالة ناتجة: pintunya tertutup (الباب مغلق). (ج) مع tidak للاستحالة: tidak terbaca (لا يُقرأ).
    3. ke-…-an للضرر، والفاعل فيها هو المتضرر: kebanjiran (أصابه الفيضان)، kehujanan (أصابه المطر)، kecurian (سُرق منه شيء)، kehilangan، ketinggalan.
    فيُقال Saya kecurian dompet (سُرقت مني المحفظة)، وDompet saya dicuri (سُرقت محفظتي).
    واختيار الصيغة في الأخبار موقف: terbakar محايدة، وdibakar تتضمن اتهامًا بفاعل.
  en: |
    With forests and fires, the three forms separate "someone burned it", "it caught fire" and "people were hit by fire":
    1. di- (BIPA 3): an agent acting on purpose. Hutan itu sengaja dibakar untuk membuka lahan = The forest was deliberately burned to clear land.
    2. ter- (BIPA 4), here in three senses:
       - accidental / unintended: terbakar (caught fire), terjatuh (fell), tertidur (dozed off), terbawa (got carried off by mistake).
       - resulting state: pintunya tertutup = the door is shut (who shut it doesn't matter).
       - with tidak = can't be done: tidak terbaca (illegible), tidak terhitung (countless).
    3. ke-…-an for adversity — the subject is the victim: kebanjiran (flooded), kehujanan (caught in the rain), kecurian (robbed of something), kehilangan (lost), ketinggalan (left behind / missed), kedinginan (cold).
       Desa itu kebanjiran = The village got flooded. Saya kecurian dompet = I had my wallet stolen.
    Note: with ke-…-an the subject is the sufferer, not the thing: Saya kecurian, but Dompet saya dicuri.
    In the news, "Ribuan hektare hutan terbakar" is neutral, while "dibakar" implies someone did it — the choice is a stance.
examples:
  - text: Ribuan hektare hutan gambut terbakar setiap musim kemarau.
    breakdown: ter- + bakar → terbakar (catches fire; no agent named) · hutan gambut (peat forest) · musim kemarau (dry season)
    en: Thousands of hectares of peat forest burn every dry season.
    ar_eg: آلاف الهكتارات من غابات الخث بتولّع كل موسم جفاف.
    ar: تحترق آلاف الهكتارات من غابات الخثّ في كل موسم جفاف.
    register: formal
  - text: Menurut penyelidikan, lahan itu sengaja dibakar untuk perkebunan sawit.
    en: According to the investigation, the land was deliberately burned for an oil-palm plantation.
    ar_eg: على حسب التحقيق، الأرض دي اتحرقت عمدًا عشان مزرعة نخيل زيت.
    ar: وفقًا للتحقيق، أُحرقت الأرض عمدًا لإقامة مزرعة لنخيل الزيت.
    register: formal
  - text: Desa-desa di tepi Sungai Kahayan kebanjiran setelah hujan deras tiga hari.
    en: The villages along the Kahayan River were flooded after three days of heavy rain.
    ar_eg: القرى اللي على نهر كاهايان غرقت في الفيضان بعد مطر جامد تلات أيام.
    ar: غمرت الفيضانات القرى الواقعة على ضفاف نهر كاهايان بعد ثلاثة أيام من الأمطار الغزيرة.
  - text: Kami kehujanan dalam perjalanan ke Camp Leakey.
    en: We got caught in the rain on the way to Camp Leakey.
    ar_eg: المطر نزل علينا واحنا رايحين كامب ليكي.
    ar: أصابنا المطر في طريقنا إلى معسكر ليكي.
  - text: Seekor orangutan terjebak di tengah kebun sawit yang baru dibuka.
    en: An orangutan was trapped in the middle of a newly cleared oil-palm plantation.
    ar_eg: إنسان غاب (أورانجوتان) اتحبس في نص مزرعة نخيل زيت لسه مفتوحة جديد.
    ar: علق إنسان غاب في وسط مزرعة نخيل زيت حديثة الإنشاء.
  - text: Kerugiannya tidak terhitung.
    en: The losses are incalculable.
    ar_eg: الخساير ماتتعدّش.
    ar: الخسائر لا تُحصى.
mistakes:
  - wrong: Hutan itu terbakar oleh petani dengan sengaja.
    right: Hutan itu sengaja dibakar oleh petani.
    why:
      ar_eg: ter- معناها من غير قصد، فمتتجمعش مع dengan sengaja (عمدًا) وفاعل. للقصد استخدم di-.
      ar: ter- لما يقع بلا قصد، فلا تجتمع مع «عمدًا» وفاعل مقصود؛ وللقصد تُستعمل di-.
      en: ter- means unintended, so it clashes with dengan sengaja and an agent; use di- for deliberate acts.
  - wrong: Dompet saya kecurian di pasar.
    right: Saya kecurian dompet di pasar. / Dompet saya dicuri di pasar.
    why:
      ar_eg: في ke-…-an الفاعل هو اللي اتضرر (أنا)، مش الحاجة اللي اتسرقت.
      ar: فاعل ke-…-an هو المتضرر لا الشيء المسروق.
      en: The subject of ke-…-an is the person who suffers, not the stolen item.
  - wrong: Kami terhujan di jalan.
    right: Kami kehujanan di jalan.
    why:
      ar_eg: "فيه أفعال ثابتة بـ ke-…-an بس للمصيبة: kehujanan، kebanjiran، kedinginan. *terhujan مش موجودة."
      ar: "بعض الأفعال لا تأتي للضرر إلا على ke-…-an: kehujanan، kebanjiran، ولا وجود لـ *terhujan."
      en: Some adversity verbs exist only as ke-…-an (kehujanan, kebanjiran); *terhujan isn't a word.
arabic_bridge:
  ar_eg: "العربي عنده نفس التفرقة بأوزان: «أُحرِقت» (فيه فاعل) = dibakar، و«احترقت» (انفعال من غير فاعل) = terbakar، و«انكسر» زي terpecah. وke-…-an شبه «أصابه…»: kehujanan = «أصابه المطر»، kebanjiran = «غمره الفيضان». وفي المصري: «اتسرق مني» = kecurian."
  ar: "تقابل di- صيغة «أُفعِل» المبنية للمجهول (أُحرقت)، وter- صيغة المطاوعة «افتعل / انفعل» (احترقت، انكسر)، وke-…-an تركيب «أصابه كذا» (kehujanan = أصابه المطر)."
  en: "Arabic splits these by verb pattern too: أُحرِقت (agent implied) = dibakar, احترقت / انكسر (happened by itself) = terbakar, and «أصابه…» ≈ ke-…-an (kehujanan = أصابه المطر)."
