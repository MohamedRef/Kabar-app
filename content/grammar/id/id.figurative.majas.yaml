schema: kabar.grammar/v1
id: id.figurative.majas
language: id
level: bipa6
title:
  target: Majas (personifikasi, litotes, eufemisme, metonimia, sinekdoke, paradoks …)
  en: Figures of speech (majas)
  ar_eg: المجاز وأنواعه (التشخيص، التهوين، التلطيف، الكناية، المجاز المرسل…)
  ar: المجاز وصور البيان
summary:
  ar_eg: "في BIPA 4 عرفت التشبيه والمبالغة والاستعارة. هنا باقي «العيلة»: personifikasi (الجماد بيتصرف كإنسان)، litotes (تصغير النفس تواضعًا)، eufemisme (تلطيف)، metonimia وsinekdoke (الجزء أو الاسم بدل الكل)، paradoks وantitesis (التناقض والطباق)."
  ar: "بعد التشبيه والمبالغة والاستعارة، يتناول هذا الدرس التشخيص والتهوين (litotes) والتلطيف والكناية والمجاز المرسل والمفارقة والطباق."
  en: "BIPA 4 covered simile, hyperbole and metaphor. Here is the rest of the family: personification, litotes (modest understatement), euphemism, metonymy and synecdoche, paradox and antithesis."
pattern:
  - "Personifikasi: inanimate + human verb — angin berbisik, ombak memanggil"
  - "Litotes: belittle your own things — gubuk kami (our hut = our house)"
  - "Eufemisme: soft word for a harsh fact — berpulang, tunawisma, diamankan"
  - "Metonimia: name/brand/author for the thing — membaca Chairil Anwar"
  - "Sinekdoke: part for whole (batang hidungnya) / whole for part (Indonesia menang)"
  - "Paradoks / antitesis: kesepian di tengah keramaian · tua muda, kaya miskin"
explanation:
  ar_eg: |
    الكلمة نفسها «majas» جاية من «مجاز»، فإنت في بيتك!
    في BIPA 4 أخدت: simile (bagaikan، seperti)، hiperbola، metafora. دلوقتي:
    1. Personifikasi (التشخيص): الجماد بيتصرف كإنسان: Angin malam berbisik di sela daun kelapa = ريح الليل بتوشوش بين ورق النخل.
    2. Litotes (التواضع بالتصغير): تصغّر حاجتك تأدبًا: «Mampirlah ke gubuk kami» = اتفضل في «عشّتنا» (وهي بيت كويس جدًا). عكس المبالغة.
    3. Eufemisme (التلطيف): كلمة ناعمة لحقيقة قاسية: meninggal → berpulang / wafat؛ gelandangan → tunawisma؛ dipecat → dirumahkan؛ وفي الأخبار «diamankan polisi» = اتقبض عليه. افهمها صح!
    4. Metonimia (الكناية بالاسم): تذكر اسم مرتبط بدل الحاجة: Dia membaca Chairil Anwar = بيقرا شعر خيريل أنور.
    5. Sinekdoke: pars pro toto (الجزء بدل الكل): «Batang hidungnya tidak kelihatan» = مش باين خالص (حرفيًا: عضمة مناخيره مش باينة). totum pro parte (الكل بدل الجزء): «Indonesia meraih emas» = الفريق الإندونيسي.
    6. Paradoks (مفارقة): Ia merasa kesepian di tengah keramaian kota. Antitesis (طباق): Tua muda, kaya miskin, semua datang.
    كمان فيه majas التوكيد زي repetisi / anafora (تكرار أول الجملة في الخطب) — هتشوفها في الشعر والخطب السياسية.
    في BIPA 7 هترجع للموضوع ده وإنت بتحكي حواديت، والهدف وقتها إنك تستخدمها مش بس تعرفها.
  ar: |
    كلمة majas نفسها من «مجاز». بعد التشبيه والمبالغة والاستعارة:
    1. Personifikasi (التشخيص): Angin malam berbisik … (تهمس ريح الليل).
    2. Litotes: تصغير المتكلم ما يخصه تأدبًا: Mampirlah ke gubuk kami (تفضّل إلى كوخنا).
    3. Eufemisme (التلطيف): berpulang / wafat بدل meninggal، tunawisma بدل gelandangan، dirumahkan بدل dipecat، وdiamankan polisi أي اعتُقل.
    4. Metonimia (الكناية بالاسم المرتبط): membaca Chairil Anwar أي شعره.
    5. Sinekdoke (المجاز المرسل): ذكر الجزء وإرادة الكل (batang hidungnya) أو العكس (Indonesia meraih emas).
    6. Paradoks (المفارقة) وAntitesis (الطباق): kesepian di tengah keramaian؛ tua muda, kaya miskin.
    وهناك صور التوكيد كالتكرار (repetisi / anafora) في الخطب والشعر. ويُعاد الموضوع في المستوى السابع للتوظيف في السرد.
  en: |
    The word majas itself comes from Arabic مجاز — you're on home ground.
    BIPA 4 gave you simile (bagaikan, seperti), hyperbole and metaphor. Now:
    1. Personifikasi: objects acting human: Angin malam berbisik di sela daun kelapa = The night wind whispers among the coconut fronds.
    2. Litotes: playing down what's yours out of courtesy: "Mampirlah ke gubuk kami" = Do drop by our "hut" (a perfectly good house). The opposite of hyperbole.
    3. Eufemisme: a soft word for a harsh fact: meninggal → berpulang / wafat; gelandangan → tunawisma (homeless); dipecat → dirumahkan (laid off); in the news "diamankan polisi" = arrested. Read it right!
    4. Metonimia: naming something associated: Dia membaca Chairil Anwar = He reads Chairil Anwar's poetry.
    5. Sinekdoke: pars pro toto — "Batang hidungnya tidak kelihatan" (not even the bridge of his nose is visible = he's nowhere to be seen); totum pro parte — "Indonesia meraih emas" (the Indonesian team won gold).
    6. Paradoks: Ia merasa kesepian di tengah keramaian kota. Antitesis: Tua muda, kaya miskin, semua datang.
    There are also emphasis figures like repetisi / anafora (repeating sentence openings in speeches) — common in poetry and political rhetoric.
    BIPA 7 comes back to this for storytelling, where the goal is to use these figures, not just recognise them.
examples:
  - text: Angin malam berbisik di sela daun kelapa.
    breakdown: personifikasi — angin (wind) + berbisik (whisper, a human act)
    en: The night wind whispers among the coconut fronds.
    ar_eg: ريح الليل بتوشوش بين ورق جوز الهند.
    ar: تهمس ريح الليل بين سعف جوز الهند.
    register: formal
  - text: Silakan mampir ke gubuk kami kalau Bapak ke Pekanbaru.
    breakdown: litotes — gubuk (hut) for 'our home'
    en: Do drop by our humble hut if you're in Pekanbaru, sir.
    ar_eg: اتفضل شرّفنا في عشّتنا لو حضرتك جيت بيكانبارو.
    ar: تفضّل بزيارة كوخنا المتواضع إن جئت إلى بيكانبارو.
    register: formal
  - text: Dua orang terduga pelaku sudah diamankan polisi.
    breakdown: eufemisme — diamankan (lit. 'made safe') = arrested
    en: Two suspects have been taken into custody by the police.
    ar_eg: اتنين مشتبه فيهم «اتأمّنوا» عند الشرطة — يعني اتقبض عليهم.
    ar: «أُمِّن» اثنان من المشتبه بهم لدى الشرطة، أي اعتُقلا.
    register: formal
  - text: Sudah seminggu batang hidungnya tidak kelihatan.
    breakdown: sinekdoke (pars pro toto) — batang hidung (bridge of the nose) for the whole person
    en: He hasn't shown his face for a week.
    ar_eg: بقاله أسبوع مش باين خالص، ولا حتى طرف مناخيره.
    ar: لم يظهر له أثر منذ أسبوع.
  - text: Ia merasa kesepian di tengah keramaian kota Medan.
    breakdown: paradoks — kesepian (loneliness) vs keramaian (crowds)
    en: She feels lonely in the middle of bustling Medan.
    ar_eg: حاسة بالوحدة وسط زحمة مدينة ميدان.
    ar: تشعر بالوحدة وسط صخب مدينة ميدان.
  - text: Aku ini binatang jalang dari kumpulannya terbuang.
    breakdown: metafora — Chairil Anwar, «Aku» (1943) · binatang jalang (wild beast) · terbuang (cast out)
    en: I am a wild beast, cast out from its herd. (Chairil Anwar, "Aku", 1943)
    ar_eg: أنا وحش بري، مطرود من قطيعه. (خيريل أنور، قصيدة «أنا»، 1943)
    ar: أنا وحشٌ بريّ نبذه قطيعه. (خيريل أنور، «أنا»، 1943)
    register: formal
mistakes:
  - wrong: "Wajahnya seperti bulan → metafora"
    right: "Wajahnya seperti bulan → simile (perumpamaan); Dia bulan di kampung itu → metafora"
    why:
      ar_eg: لو فيه أداة تشبيه (seperti، bagai، laksana) يبقى simile = تشبيه. من غير أداة = metafora = استعارة.
      ar: وجود أداة التشبيه (seperti، bagai، laksana) يجعله تشبيهًا، وحذفها يجعله استعارة.
      en: With a comparison word (seperti, bagai, laksana) it's a simile; without one it's a metaphor.
  - wrong: "«Diamankan polisi» → the police protected him."
    right: "«Diamankan polisi» → he was arrested."
    why:
      ar_eg: ده تلطيف رسمي مشهور في الأخبار؛ الحرفي «اتأمّن» لكن المعنى «اتقبض عليه».
      ar: تلطيف إخباري شائع ظاهره «أُمِّن» وحقيقته «اعتُقل».
      en: A standard news euphemism — literally "secured", really "arrested".
  - wrong: "«Mampir ke gubuk kami» → hiperbola"
    right: "«Mampir ke gubuk kami» → litotes"
    why:
      ar_eg: المبالغة بتكبّر، الـ litotes بتصغّر بتواضع. «عشّتنا» تصغير مش تكبير.
      ar: المبالغة تضخيم، والـ litotes تصغير تواضعًا.
      en: Hyperbole inflates; litotes modestly shrinks.
arabic_bridge:
  ar_eg: "majas ← «مجاز» حرفيًا. وعلم البيان عندنا بيقابلها: simile = تشبيه، metafora = استعارة، metonimia ≈ كناية، sinekdoke = مجاز مرسل علاقته الجزئية أو الكلية، antitesis = طباق. وlitotes شبه «بيتنا المتواضع» و«عشّتنا» في المصري. لو فاكر بلاغة الثانوي، نص الشغل خلص."
  ar: "majas مأخوذة من «مجاز». ويقابل علم البيان العربي هذه الأنواع: simile = التشبيه، metafora = الاستعارة، metonimia تقارب الكناية، sinekdoke = المجاز المرسل بعلاقة الجزئية أو الكلية، antitesis = الطباق."
  en: "majas ← Arabic مجاز. Arabic ʿilm al-bayān maps onto it: simile = تشبيه, metaphor = استعارة, metonymy ≈ كناية, synecdoche = مجاز مرسل (part/whole relation), antithesis = طباق."
