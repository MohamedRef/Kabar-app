schema: kabar.grammar/v1
id: id.register.audience
language: id
level: bipa7
title:
  target: Bahasa sesuai pembaca (Anda, kita, Saudara, teman-teman)
  en: Tuning language to the audience
  ar_eg: إزاي تظبط كلامك على حسب الجمهور
  ar: مواءمة اللغة للجمهور
summary:
  ar_eg: "نفس الخبر بيتكتب بشكل مختلف للمسؤولين، وللقارئ العادي، وللأطفال، وللسوشيال ميديا. اللي بيتغير: الضمير (Anda / kita / kalian / teman-teman)، طول الجملة، المصطلحات، والأسلوب (سؤال بلاغي في مقال الرأي)."
  ar: "يُكتب الخبر الواحد بأشكال مختلفة للمسؤولين والقارئ العام والأطفال ومواقع التواصل، ويتغير الضمير وطول الجملة والمصطلحات والأسلوب."
  en: "The same news is written differently for officials, general readers, children and social media. What changes: the pronoun (Anda / kita / kalian / teman-teman), sentence length, jargon, and devices like rhetorical questions in an op-ed."
pattern:
  - "Officials / formal: Bapak/Ibu, Saudara, full terms (rancangan undang-undang), passive, nominalisation"
  - "General readers: Anda or inclusive kita, short sentences, explain jargon (RUU, yaitu rancangan undang-undang)"
  - "Children: kalian / adik-adik, very short sentences, concrete words"
  - "Social media: teman-teman / gaes, casual particles (nih, lho), emoji"
  - "Op-ed devices: Bukankah …? · Mari kita … · Sudah saatnya …"
explanation:
  ar_eg: |
    الوحدة دي عن مؤسسات الدولة (DPR = البرلمان، TNI = الجيش). نفس المعلومة: «البرلمان وافق على قانون جديد»، اكتبها لأربع جماهير:
    1. لمسؤولين / تقرير رسمي: DPR mengesahkan rancangan undang-undang tersebut dalam rapat paripurna. (مصطلحات كاملة، أسماء مصادر، مبني للمجهول كتير)
    2. لقارئ عادي في جورنال: DPR akhirnya menyetujui aturan baru itu. Artinya, … (أبسط، وبتشرح: RUU, yaitu rancangan undang-undang)
    3. لأطفال: Para wakil rakyat di DPR sudah setuju dengan aturan baru. (جمل قصيرة، كلمات ملموسة؛ ونداء: adik-adik / kalian)
    4. للسوشيال: Teman-teman, RUU-nya udah disahkan, nih! (عامي، teman-teman أو gaes، إيموجي)
    الضماير:
    - Anda: محترم ومحايد للقارئ العام — ودايمًا بحرف A كبير.
    - kita: بتشمل القارئ معاك (إحنا كلنا) — سلاح قوي في مقال الرأي.
    - Saudara / Saudari: رسمي (خطابات، مناظرات).
    - kalian: لمجموعة أصغر منك أو قريبة.
    مقال الرأي (artikel opini) بيستخدم:
    - السؤال البلاغي: «Bukankah pemilu seharusnya menjadi pesta rakyat?» (أليس…؟)
    - الدعوة: «Mari kita …» / «Sudah saatnya …» (آن الأوان).
    - كلمات تقييم واضحة بس من غير هجوم شخصي.
  ar: |
    تتناول الوحدة مؤسسات الدولة (DPR = البرلمان، TNI = الجيش). والمعلومة الواحدة تُصاغ بحسب الجمهور:
    1. للمسؤولين: DPR mengesahkan rancangan undang-undang tersebut dalam rapat paripurna (مصطلحات كاملة ومصادر ومجهول).
    2. للقارئ العام: DPR akhirnya menyetujui aturan baru itu، مع شرح المصطلحات (RUU, yaitu rancangan undang-undang).
    3. للأطفال: جمل قصيرة وألفاظ محسوسة، ونداء adik-adik / kalian.
    4. لمواقع التواصل: لغة دارجة وteman-teman أو gaes.
    والضمائر: Anda محايد محترم بحرف كبير دائمًا، وkita تُشرك القارئ، وSaudara رسمية، وkalian لمن هم أصغر أو أقرب.
    ومن أدوات مقال الرأي: السؤال البلاغي (Bukankah …؟)، والدعوة (Mari kita …، Sudah saatnya …)، والتقييم الواضح بلا تجريح شخصي.
  en: |
    This unit is about state institutions (DPR = parliament, TNI = armed forces). Take one fact — "parliament passed a new law" — and write it for four audiences:
    1. Officials / formal report: DPR mengesahkan rancangan undang-undang tersebut dalam rapat paripurna. (full terms, nominalisation, passives)
    2. General newspaper readers: DPR akhirnya menyetujui aturan baru itu. Artinya, … (simpler, and explain terms: RUU, yaitu rancangan undang-undang)
    3. Children: Para wakil rakyat di DPR sudah setuju dengan aturan baru. (short sentences, concrete words; address adik-adik / kalian)
    4. Social media: Teman-teman, RUU-nya udah disahkan, nih! (casual, teman-teman or gaes, emoji)
    Pronouns:
    - Anda: respectful, neutral for general readers — always with a capital A.
    - kita: includes the reader with you (all of us) — powerful in op-eds.
    - Saudara / Saudari: formal (speeches, debates).
    - kalian: a group younger than you or close to you.
    Op-ed devices:
    - Rhetorical questions: "Bukankah pemilu seharusnya menjadi pesta rakyat?" (Shouldn't elections be …?)
    - Calls to action: "Mari kita …" / "Sudah saatnya …" (It's time …).
    - Clear evaluative words, but no personal attacks.
examples:
  - text: DPR mengesahkan rancangan undang-undang tersebut dalam rapat paripurna.
    en: The House of Representatives passed the bill in a plenary session.
    ar_eg: مجلس النواب وافق على مشروع القانون ده في جلسة عامة. (لغة رسمية)
    ar: أقرّ مجلس النواب مشروع القانون المذكور في جلسة عامة.
    register: formal
  - text: DPR akhirnya menyetujui aturan baru itu. Artinya, mulai tahun depan aturan tersebut wajib dijalankan.
    en: Parliament has finally approved the new rule. In other words, from next year it must be followed.
    ar_eg: البرلمان أخيرًا وافق على القانون الجديد. يعني من السنة الجاية لازم يتطبّق. (للقارئ العادي)
    ar: وافق البرلمان أخيرًا على القانون الجديد، أي إنه سيصبح ملزمًا اعتبارًا من العام المقبل.
    register: neutral
  - text: Adik-adik, para wakil rakyat di DPR sudah setuju dengan aturan baru. Aturan ini dibuat supaya sekolah lebih aman.
    en: Kids, our representatives in parliament have agreed on a new rule. It was made so that schools are safer.
    ar_eg: يا ولاد، النواب في البرلمان وافقوا على قانون جديد. القانون ده معمول عشان المدارس تبقى أأمن. (للأطفال)
    ar: يا أطفال، وافق نواب الشعب في البرلمان على قانون جديد وُضع لتكون المدارس أكثر أمانًا.
    register: neutral
  - text: Teman-teman, RUU-nya udah disahkan, nih! Yuk, baca isinya dulu sebelum komentar.
    en: Guys, the bill's been passed! Let's read what it says before commenting.
    ar_eg: يا جماعة، القانون اتوافق عليه! تعالوا نقرا مضمونه الأول قبل ما نعلّق. (سوشيال ميديا)
    ar: يا أصدقاء، أُقرّ القانون! لنقرأ مضمونه قبل التعليق.
    register: chat
  - text: Bukankah pemilu seharusnya menjadi pesta rakyat, bukan pesta segelintir elite?
    en: Shouldn't elections be a festival of the people, not a party for a handful of elites?
    ar_eg: مش المفروض الانتخابات تبقى عيد للشعب، مش حفلة لشوية من النخبة؟ (مقال رأي)
    ar: أليس من المفترض أن تكون الانتخابات عرسًا للشعب لا حفلًا لقلة من النخبة؟
    register: formal
mistakes:
  - wrong: Kalau kamu membaca artikel ini, kamu pasti setuju.
    right: Jika Anda membaca artikel ini, Anda mungkin akan sependapat. / Kita semua tentu sepakat bahwa …
    why:
      ar_eg: kamu في مقال لقارئ عام بتبان قريبة زيادة أو قليلة الاحترام. استخدم Anda أو kita.
      ar: kamu في مقال موجّه للعامة تبدو مفرطة في الألفة، والأليق Anda أو kita.
      en: kamu in an article for the general public sounds overfamiliar; use Anda or inclusive kita.
  - wrong: Apakah anda setuju?
    right: Apakah Anda setuju?
    why:
      ar_eg: Anda دايمًا بحرف كبير، حتى في نص الجملة (قاعدة PUEBI).
      ar: تُكتب Anda بحرف كبير دائمًا ولو في وسط الجملة.
      en: Anda is always capitalised, even mid-sentence (PUEBI).
  - wrong: Writing "RUU KUHP disahkan dalam rapat paripurna" for a children's magazine.
    right: "Explain terms and shorten: \"Aturan baru tentang hukum sudah disetujui oleh para wakil rakyat.\""
    why:
      ar_eg: المصطلحات والاختصارات من غير شرح بتضيّع القارئ العادي والطفل. اشرح أو استخدم كلمة أبسط.
      ar: الاختصارات والمصطلحات دون شرح تُضيع القارئ غير المتخصص.
      en: Unexplained acronyms and jargon lose lay readers and children; explain or simplify.
arabic_bridge:
  ar_eg: "ده زي الفرق بين نشرة الأخبار في التلفزيون، وعمود رأي في الجرنال، وبرنامج أطفال، وبوست على فيسبوك عندنا. وkita الشاملة زي «إحنا كمصريين…» في المقالات. والسؤال البلاغي Bukankah …? = «أليس…؟». وrakyat (الشعب) ← «رعية»، وwakil rakyat (النائب) — wakil ← «وكيل»."
  ar: "يشبه هذا الفرق بين نشرة الأخبار وعمود الرأي وبرامج الأطفال ومنشورات التواصل في العربية. والسؤال البلاغي Bukankah …? يقابل «أليس…؟». وrakyat ← رعية، وwakil ← وكيل."
  en: "It's the difference between a TV bulletin, an op-ed column, a kids' show and a Facebook post in Arabic media. Bukankah …? = «أليس…؟». rakyat (the people) ← رعية, wakil (representative) ← وكيل."
