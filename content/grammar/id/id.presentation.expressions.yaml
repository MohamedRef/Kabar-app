schema: kabar.grammar/v1
id: id.presentation.expressions
language: id
level: bipa7
title:
  target: Bahasa presentasi (Pada kesempatan ini …, Demikian …)
  en: Formal presentation language
  ar_eg: لغة العروض التقديمية الرسمية
  ar: لغة العرض التقديمي الرسمي
summary:
  ar_eg: "العرض الرسمي الإندونيسي ليه افتتاحية (تحية + حمد + «Pada kesempatan ini, saya akan memaparkan …»)، وإشارات انتقال (Selanjutnya, mari kita beralih ke …)، ووصف للبيانات (meningkat tajam)، وختام ثابت (Demikian … Atas perhatian Bapak dan Ibu, saya ucapkan terima kasih)."
  ar: "للعرض الرسمي افتتاحية (تحية وحمد وإعلان الموضوع)، وعبارات انتقال، ووصف للبيانات، وخاتمة ثابتة تبدأ بـ Demikian وتنتهي بالشكر."
  en: "A formal Indonesian presentation has an opening (greetings, thanks to God, \"Pada kesempatan ini, saya akan memaparkan …\"), signposts (Selanjutnya, mari kita beralih ke …), data language (meningkat tajam), and a fixed close (Demikian … Atas perhatian Bapak dan Ibu, saya ucapkan terima kasih)."
pattern:
  - "Opening: Yang saya hormati …, hadirin yang berbahagia."
  - "Pertama-tama, marilah kita panjatkan puji syukur ke hadirat Tuhan Yang Maha Esa …"
  - "Pada kesempatan ini, saya akan memaparkan / menyampaikan …"
  - "Presentasi ini terbagi menjadi tiga bagian: …"
  - "Signpost: Selanjutnya, … / Mari kita beralih ke … / Seperti yang terlihat pada grafik ini, …"
  - "Emphasis: Perlu digarisbawahi bahwa … / Yang menarik, …"
  - "Data: meningkat tajam, menurun drastis, relatif stabil, mencapai puncaknya pada …"
  - "Close: Demikian yang dapat saya sampaikan. … Atas perhatian Bapak dan Ibu, saya ucapkan terima kasih."
  - "Q&A: Saya persilakan jika ada pertanyaan. · Terima kasih atas pertanyaannya."
explanation:
  ar_eg: |
    العرض في إندونيسيا (في الجامعة، الشغل، المؤتمرات) ليه «طقوس» ثابتة، ولو مشيت عليها هتبان محترف:
    1. الافتتاح:
       - التحية: Assalamualaikum … / Selamat pagi, dan salam sejahtera bagi kita semua.
       - التحية للحضور حسب المقام: Yang saya hormati Bapak Rektor, … hadirin yang berbahagia.
       - في المناسبات الرسمية جدًا: Pertama-tama, marilah kita panjatkan puji syukur ke hadirat Tuhan Yang Maha Esa … (الحمد لله في البداية).
       - الموضوع: Pada kesempatan ini, saya akan memaparkan … (هعرض)، والخطة: Presentasi ini terbagi menjadi tiga bagian.
    2. الانتقال: Selanjutnya (بعد كده)، Mari kita beralih ke … (خلينا ننتقل لـ)، Kembali ke … (نرجع لـ).
    3. الشرايح والبيانات: Seperti yang terlihat pada grafik / salindia ini (زي ما واضح في الرسم / الشريحة). salindia = الكلمة الرسمية لـ «slide».
       وصف الأرقام: meningkat tajam (زاد بحدة)، menurun drastis (نزل بشدة)، relatif stabil، mencapai puncaknya pada tahun … (وصل لقمته).
    4. التأكيد: Perlu digarisbawahi bahwa … (لازم نأكد إن…)، Yang menarik, … (اللطيف إن…).
    5. الختام: Sebagai penutup, … / Demikian yang dapat saya sampaikan. Mohon maaf apabila ada kekurangan. Atas perhatian Bapak dan Ibu, saya ucapkan terima kasih.
    6. الأسئلة: Saya persilakan jika ada pertanyaan. — وابدأ ردك بـ: Terima kasih atas pertanyaannya.
    الاعتذار في الآخر (Mohon maaf apabila ada kekurangan) مش ضعف؛ ده أدب متوقع.
  ar: |
    للعرض الرسمي في إندونيسيا شعائر ثابتة:
    1. الافتتاح: التحية، ثم تحية الحضور بحسب مقاماتهم (Yang saya hormati …, hadirin yang berbahagia)، وفي المقامات الرسمية الحمد: marilah kita panjatkan puji syukur ke hadirat Tuhan Yang Maha Esa، ثم إعلان الموضوع: Pada kesempatan ini, saya akan memaparkan …، وخطة العرض.
    2. الانتقال: Selanjutnya، Mari kita beralih ke …
    3. الشرائح والبيانات: Seperti yang terlihat pada grafik / salindia ini (وsalindia المقابل الرسمي لـ slide)، وmeningkat tajam، menurun drastis، relatif stabil، mencapai puncaknya.
    4. التوكيد: Perlu digarisbawahi bahwa …
    5. الختام: Demikian yang dapat saya sampaikan. Mohon maaf apabila ada kekurangan. Atas perhatian Bapak dan Ibu, saya ucapkan terima kasih.
    6. الأسئلة: Saya persilakan jika ada pertanyaan، ويبدأ الجواب بـ Terima kasih atas pertanyaannya.
    والاعتذار في الختام أدب متوقَّع لا ضعف.
  en: |
    Presentations in Indonesia (university, work, conferences) follow set rituals; follow them and you sound professional:
    1. Opening:
       - Greeting: Assalamualaikum … / Selamat pagi, dan salam sejahtera bagi kita semua.
       - Address the audience by rank: Yang saya hormati Bapak Rektor, … hadirin yang berbahagia.
       - Very formal events add thanks to God: Pertama-tama, marilah kita panjatkan puji syukur ke hadirat Tuhan Yang Maha Esa …
       - Topic: Pada kesempatan ini, saya akan memaparkan … (I will present …); roadmap: Presentasi ini terbagi menjadi tiga bagian.
    2. Transitions: Selanjutnya (next), Mari kita beralih ke … (let's move on to), Kembali ke … (back to).
    3. Slides and data: Seperti yang terlihat pada grafik / salindia ini (as this chart / slide shows). salindia is the official word for "slide".
       Describing numbers: meningkat tajam (rose sharply), menurun drastis (fell dramatically), relatif stabil, mencapai puncaknya pada tahun … (peaked in …).
    4. Emphasis: Perlu digarisbawahi bahwa … (it should be underlined that …), Yang menarik, … (interestingly, …).
    5. Closing: Sebagai penutup, … / Demikian yang dapat saya sampaikan. Mohon maaf apabila ada kekurangan. Atas perhatian Bapak dan Ibu, saya ucapkan terima kasih.
    6. Q&A: Saya persilakan jika ada pertanyaan. — Start answers with: Terima kasih atas pertanyaannya.
    The closing apology (Mohon maaf apabila ada kekurangan) isn't weakness; it's expected courtesy.
examples:
  - text: Pada kesempatan ini, saya akan memaparkan mengapa Raja Ampat memiliki keanekaragaman hayati laut tertinggi di dunia.
    en: On this occasion, I will explain why Raja Ampat has the highest marine biodiversity in the world.
    ar_eg: في الفرصة دي، هعرض ليه راجا أمبات فيها أعلى تنوّع حيوي بحري في العالم.
    ar: أعرض في هذه المناسبة أسباب امتلاك راجا أمبات أعلى تنوع حيوي بحري في العالم.
    register: formal
  - text: Seperti yang terlihat pada peta ini, Raja Ampat terletak di jantung Segitiga Terumbu Karang.
    en: As you can see on this map, Raja Ampat lies at the heart of the Coral Triangle.
    ar_eg: زي ما واضح في الخريطة دي، راجا أمبات في قلب مثلث الشعاب المرجانية.
    ar: كما يظهر في هذه الخريطة، تقع راجا أمبات في قلب مثلث الشعاب المرجانية.
    register: formal
  - text: Perlu digarisbawahi bahwa kenaikan suhu laut dapat memicu pemutihan karang.
    en: It should be underlined that rising sea temperatures can trigger coral bleaching.
    ar_eg: لازم نأكد إن ارتفاع حرارة البحر ممكن يسبب ابيضاض المرجان.
    ar: تجدر الإشارة إلى أن ارتفاع حرارة البحر قد يسبب ابيضاض المرجان.
    register: formal
  - text: Selanjutnya, mari kita beralih ke dampak pariwisata terhadap terumbu karang.
    en: Next, let's turn to the impact of tourism on the coral reefs.
    ar_eg: بعد كده، خلينا ننتقل لتأثير السياحة على الشعاب المرجانية.
    ar: ننتقل بعد ذلك إلى أثر السياحة في الشعاب المرجانية.
    register: formal
  - text: Demikian yang dapat saya sampaikan. Atas perhatian Bapak dan Ibu, saya ucapkan terima kasih.
    en: That is all I have to present. Thank you, ladies and gentlemen, for your attention.
    ar_eg: ده كل اللي عندي. متشكر لحضراتكم على حسن الاستماع.
    ar: هذا ما لديّ. أشكركم على حسن انتباهكم.
    register: formal
  - text: Terima kasih atas pertanyaannya. Pertanyaan itu sangat relevan dengan bagian kedua presentasi saya.
    en: Thank you for the question. It's very relevant to the second part of my presentation.
    ar_eg: شكرًا على السؤال. السؤال ده ليه علاقة قوية بالجزء التاني من العرض.
    ar: شكرًا على السؤال، فهو وثيق الصلة بالجزء الثاني من عرضي.
    register: formal
mistakes:
  - wrong: Oke, next slide, ya.
    right: Selanjutnya, mari kita lihat salindia berikutnya.
    why:
      ar_eg: الإنجليزي والـ «ya» في عرض رسمي بيخلّوه يبان كاجوال. استخدم عبارة انتقال إندونيسية.
      ar: الخلط بالإنجليزية وأداة ya يُضعف رسمية العرض، والأليق عبارة انتقال إندونيسية.
      en: English plus "ya" makes a formal talk sound casual; use an Indonesian transition.
  - wrong: Saya mau presentasi tentang terumbu karang.
    right: Pada kesempatan ini, saya akan mempresentasikan / memaparkan topik terumbu karang.
    why:
      ar_eg: presentasi اسم مش فعل، وmau عامية. الفعل الرسمي mempresentasikan أو memaparkan، وakan بدل mau.
      ar: presentasi اسم لا فعل، وmau عامية؛ والصواب memaparkan أو mempresentasikan مع akan.
      en: presentasi is a noun, and mau is casual; use akan + memaparkan / mempresentasikan.
  - wrong: Ending with "Sudah, itu saja." and walking off.
    right: Demikian yang dapat saya sampaikan. Atas perhatian Bapak dan Ibu, saya ucapkan terima kasih.
    why:
      ar_eg: الختام الإندونيسي متوقع ومحترم؛ من غيره العرض بيبان مقطوع أو قليل الذوق.
      ar: للخاتمة صيغة متوقعة، وتركها يجعل العرض مبتورًا.
      en: The formula close is expected; without it the talk feels cut off or rude.
arabic_bridge:
  ar_eg: "الافتتاحية شبه افتتاحية الخطبة عندنا: «الحمد لله… أما بعد». puji syukur = حمد وشكر (syukur ← شكر)، hadirat ← حضرة، hadirin ← الحاضرين، وDemikian … terima kasih زي «وفي الختام، أشكركم على حسن الاستماع». وكمان Assalamualaikum في الأول وwassalamualaikum في الآخر في المحافل الإسلامية."
  ar: "تشبه الافتتاحية مقدمات الخطب العربية من حمد ثم «أما بعد»، وفيها ألفاظ عربية: syukur ← شكر، hadirat ← حضرة، hadirin ← الحاضرين. والخاتمة تقابل «وفي الختام أشكركم على حسن الاستماع»."
  en: "The opening mirrors an Arabic khuṭba (praise of God, then «أما بعد»), with Arabic loans: syukur ← شكر, hadirat ← حضرة, hadirin ← الحاضرين. The close matches «وفي الختام، أشكركم على حسن الاستماع»."
