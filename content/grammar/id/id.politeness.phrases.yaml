      en: "mohon maaf = I'm sorry (formal)."
  - match: "maaf"
    note:
      ar_eg: "maaf = آسف / معلش."
      ar: "maaf = آسف / عفوًا."
      en: "maaf = sorry / excuse me."
  - match: "terima kasih"
    note:
      ar_eg: "terima kasih = شكرًا."
      ar: "terima kasih = شكرًا."
      en: "terima kasih = thank you."
  - match: "sama-sama"
    note:
      ar_eg: "sama-sama = العفو."
      ar: "sama-sama = عفوًا."
      en: "sama-sama = you're welcome."
