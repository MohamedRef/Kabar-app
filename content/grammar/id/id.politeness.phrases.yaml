schema: kabar.grammar/v1
id: id.politeness.phrases
language: id
level: bipa1
title:
  target: permisi, maaf, terima kasih, sama-sama, boleh?
  en: Everyday polite phrases
  ar_eg: كلمات الأدب اليومية
  ar: عبارات التأدب اليومية
summary:
  ar_eg: permisi = لو سمحت/عن إذنك، maaf = آسف، terima kasih = شكرًا، sama-sama = العفو، Boleh …? = ممكن…؟
  ar: permisi = عن إذنك، maaf = عذرًا، terima kasih = شكرًا، sama-sama = عفوًا، Boleh …? = هل يمكن…؟
  en: permisi (excuse me), maaf (sorry), terima kasih (thank you), sama-sama (you're welcome), Boleh …? (may I …?)
pattern:
  - Permisi, … (getting attention / passing by / leaving)
  - Maaf, … (apology / softening)
  - Terima kasih (banyak) → Sama-sama / Kembali
  - Boleh + verb? → Boleh / Silakan / Jangan
explanation:
  ar_eg: |
    - permisi: لما تنادي حد («لو سمحت»)، أو تعدي من قدامه («عن إذنك»)، أو تستأذن تمشي.
    - maaf: آسف، وكمان بتتقال قبل سؤال محرج زي «معلش…»: Maaf, boleh tanya? = معلش، ممكن أسأل؟
    - terima kasih (banyak) = شكرًا (جزيلًا). الرد: sama-sama أو kembali = العفو.
    - Boleh …? = ممكن …؟: Boleh saya duduk di sini? = ممكن أقعد هنا؟ الرد: Boleh! / Silakan = اتفضل.
    - mohon = أرجو (رسمية): Mohon tunggu sebentar = برجاء الانتظار شوية.
    نصيحة: الإندونيسيين بيقدروا الهدوء والأدب جدًا؛ كلمة permisi بتفتح أي باب.
  ar: |
    - permisi: لاستئذان أو لفت الانتباه أو المرور أمام أحد أو الانصراف.
    - maaf: عذرًا، وتُقدَّم قبل السؤال المحرج: Maaf, boleh tanya؟ = عذرًا، أيمكنني أن أسأل؟
    - terima kasih (banyak) = شكرًا (جزيلًا)، وجوابها sama-sama أو kembali = عفوًا.
    - Boleh …؟ = هل يجوز / يمكن …؟، وجوابها Boleh! أو Silakan = تفضل.
    - mohon = أرجو، وهي رسمية: Mohon tunggu sebentar.
    والهدوء والتأدب قيمة عالية في الثقافة الإندونيسية.
  en: |
    - permisi: excuse me — to get attention, to pass in front of someone, or to take your leave.
    - maaf: sorry; also a softener before an awkward question: Maaf, boleh tanya? = Sorry, may I ask?
    - terima kasih (banyak) = thank you (very much); reply sama-sama or kembali = you're welcome.
    - Boleh …? = May I …?: Boleh saya duduk di sini? — Boleh! / Silakan = Go ahead.
    - mohon = please (formal): Mohon tunggu sebentar = Please wait a moment.
    Calm courtesy matters a lot; permisi opens almost any door.
examples:
  - text: Permisi, Pak, saya mau lewat.
    en: Excuse me, sir, I'd like to get past.
    ar_eg: عن إذنك يا أستاذ، عايز أعدّي.
    ar: عن إذنك يا سيدي، أريد المرور.
  - text: Maaf, saya terlambat.
    en: Sorry, I'm late.
    ar_eg: آسف إني اتأخرت.
    ar: عذرًا على التأخير.
  - text: Terima kasih banyak! — Sama-sama.
    en: Thanks a lot! — You're welcome.
    ar_eg: شكرًا جدًا! — العفو.
    ar: شكرًا جزيلًا! — عفوًا.
  - text: Boleh saya foto di sini? — Silakan.
    en: May I take photos here? — Go ahead.
    ar_eg: ممكن أصوّر هنا؟ — اتفضل.
    ar: هل يمكنني التصوير هنا؟ — تفضل.
mistakes:
  - wrong: Maaf! (to get a waiter's attention)
    right: Permisi! / Mas! / Mbak!
    why:
      ar_eg: لنداء حد استخدم permisi أو اللقب؛ maaf للاعتذار.
      ar: للنداء permisi أو اللقب، وmaaf للاعتذار.
      en: Use permisi or the title to call someone; maaf is for apologising.
arabic_bridge:
  ar_eg: maaf جاية من العربي (معافاة/عفو)، وmohon قريبة من «برجاء»، وsilakan هي «اتفضل».
  ar: maaf من العربية (العفو)، وsilakan تقابل «تفضّل».
  en: maaf comes from Arabic (عفو / معاف); silakan is «اتفضل».
tags: [politeness, phrases, arabic-loan]
see_also: [id.request.tolong-silakan, id.address.terms]
