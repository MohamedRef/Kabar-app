schema: kabar.grammar/v1
id: id.confix.per-an
language: id
level: bipa5
title:
  target: per-…-an (perdagangan, perkebunan, pertemuan)
  en: The confix per-…-an
  ar_eg: الصيغة per-…-an (التجارة، المزارع، اللقاء)
  ar: الصيغة المركّبة per-…-an
summary:
  ar_eg: "per-…-an بتعمل أسماء من أفعال ber- أو memper-: مجال (perdagangan = التجارة)، مكان أو مجموعة (perkebunan = مزارع، perumahan = مجمّع سكني)، أو الحدث نفسه (pertemuan = لقاء، perbaikan = تصليح)."
  ar: "تصوغ per-…-an أسماء من أفعال ber- أو memper-، تدل على المجال (perdagangan) أو المكان والمجموع (perkebunan) أو الحدث ونتيجته (pertemuan، perbaikan)."
  en: "per-…-an makes nouns from ber- or memper- verbs: a field (perdagangan = trade), a place or set (perkebunan = plantations, perumahan = housing estate), or the event itself (pertemuan = meeting, perbaikan = repair)."
pattern:
  - "ber- verb → per-…-an: berdagang → perdagangan, bertemu → pertemuan, berbeda → perbedaan"
  - "memper- verb → per-…-an: memperbaiki → perbaikan, mempertunjukkan → pertunjukan"
  - "noun → per-…-an (area / domain): kebun → perkebunan, kota → perkotaan, rumah → perumahan"
  - "variants: bekerja → pekerjaan, belajar → pelajaran, bermain → permainan"
explanation:
  ar_eg: |
    في BIPA 4 عرفت peN-…-an (العملية من meN-). per-…-an «أختها» المرتبطة بـ ber- وmemper-. ليها أربع معاني أساسية:
    1. المجال أو النشاط: perdagangan (التجارة)، pertanian (الزراعة)، perikanan (الصيد / الثروة السمكية)، perbankan (البنوك كقطاع).
    2. المكان أو المجموعة: perkebunan (مزارع كبيرة / عزب)، perumahan (مجمع سكني)، perkampungan (تجمّع قرى)، perkotaan (الحضر)، pedesaan (الريف).
    3. الحدث أو نتيجته من فعل ber-: pertemuan (لقاء ← bertemu)، perjalanan (رحلة ← berjalan)، perubahan (تغيّر ← berubah)، perbedaan (اختلاف ← berbeda)، pertanyaan (سؤال ← bertanya)، permainan (لعبة ← bermain).
    4. من memper-: perbaikan (تصليح ← memperbaiki)، pertunjukan (عرض ← mempertunjukkan).
    أشكال لازم تحفظها: bekerja → pekerjaan (مش *perkerjaan!)، belajar → pelajaran.
    وقارن بـ peN-…-an علشان تفرق المعنى:
    - pertemuan (لقاء) ≠ penemuan (اكتشاف ← menemukan).
    - perdagangan (التجارة) ≠ pedagang (التاجر) ≠ dagangan (البضاعة).
  ar: |
    عرفنا peN-…-an للعملية من meN-، أما per-…-an فترتبط بـ ber- وmemper-، ولها أربعة معانٍ:
    1. المجال: perdagangan (التجارة)، pertanian (الزراعة)، perikanan (الثروة السمكية)، perbankan (القطاع المصرفي).
    2. المكان أو المجموع: perkebunan (المزارع الكبرى)، perumahan (المجمع السكني)، perkotaan (الحضر)، pedesaan (الريف).
    3. الحدث من فعل ber-: pertemuan (لقاء)، perjalanan (رحلة)، perubahan (تغيّر)، perbedaan (اختلاف)، pertanyaan (سؤال).
    4. من memper-: perbaikan (إصلاح)، pertunjukan (عرض).
    ويُحفظ: bekerja → pekerjaan، belajar → pelajaran. ويُفرَّق بين pertemuan (لقاء) وpenemuan (اكتشاف)، وبين perdagangan (التجارة) وpedagang (التاجر).
  en: |
    BIPA 4 gave you peN-…-an (the process of a meN- verb). per-…-an is its sibling tied to ber- and memper- verbs, with four main meanings:
    1. Field or activity: perdagangan (trade), pertanian (agriculture), perikanan (fisheries), perbankan (banking).
    2. Place or collection: perkebunan (plantations / estates), perumahan (housing estate), perkampungan (settlement), perkotaan (urban areas), pedesaan (rural areas).
    3. The event or its result, from ber- verbs: pertemuan (meeting ← bertemu), perjalanan (journey ← berjalan), perubahan (change ← berubah), perbedaan (difference ← berbeda), pertanyaan (question ← bertanya), permainan (game ← bermain).
    4. From memper- verbs: perbaikan (repair ← memperbaiki), pertunjukan (performance ← mempertunjukkan).
    Forms to memorise: bekerja → pekerjaan (not *perkerjaan!), belajar → pelajaran.
    Contrast with peN-…-an to keep meanings apart:
    - pertemuan (meeting) vs penemuan (discovery ← menemukan).
    - perdagangan (trade) vs pedagang (trader) vs dagangan (goods for sale).
examples:
  - text: Pasar terapung Lok Baintan sudah lama menjadi pusat perdagangan hasil kebun.
    breakdown: per- + dagang + -an → perdagangan (trade) · pasar terapung (floating market) · hasil kebun (farm produce)
    en: The Lok Baintan floating market has long been a centre for trading farm produce.
    ar_eg: سوق لوك باينتان العايم بقاله زمان مركز لتجارة محاصيل الجناين.
    ar: ظلّ سوق لوك باينتان العائم منذ زمن طويل مركزًا لتجارة المحاصيل الزراعية.
  - text: Perkebunan karet dan sawit mengubah wajah Kalimantan Selatan.
    en: Rubber and oil-palm plantations have changed the face of South Kalimantan.
    ar_eg: مزارع المطاط ونخيل الزيت غيّرت شكل جنوب كاليمانتان.
    ar: غيّرت مزارع المطاط ونخيل الزيت وجه جنوب كاليمانتان.
    register: formal
  - text: Soto Banjar adalah hasil pertemuan budaya Arab, Tionghoa, dan Melayu.
    en: Soto Banjar is the product of a meeting of Arab, Chinese and Malay cultures.
    ar_eg: شوربة سوتو بنجار نتيجة التقاء الثقافة العربية والصينية والملايو.
    ar: سوتو بنجار ثمرة التقاء الثقافات العربية والصينية والملايوية.
  - text: Perbedaan soto Banjar dan soto Betawi terletak pada kuahnya.
    en: The difference between soto Banjar and soto Betawi lies in the broth.
    ar_eg: الفرق بين سوتو بنجار وسوتو بيتاوي في الشوربة نفسها.
    ar: يكمن الفرق بين سوتو بنجار وسوتو بيتاوي في المرق.
  - text: Perjalanan ke pasar terapung dimulai sebelum subuh.
    en: The trip to the floating market starts before dawn.
    ar_eg: الرحلة للسوق العايم بتبدأ قبل الفجر.
    ar: تبدأ الرحلة إلى السوق العائم قبل الفجر.
mistakes:
  - wrong: Dia mencari perkerjaan di Banjarmasin.
    right: Dia mencari pekerjaan di Banjarmasin.
    why:
      ar_eg: bekerja → pekerjaan بحرف r واحد بس. ده من أشهر الأخطاء حتى عند الإندونيسيين.
      ar: الصواب pekerjaan من bekerja، وهو خطأ شائع حتى عند أهل اللغة.
      en: bekerja → pekerjaan, with no extra r — a common slip even among native speakers.
  - wrong: Penemuan para pedagang diadakan setiap Jumat.
    right: Pertemuan para pedagang diadakan setiap Jumat.
    why:
      ar_eg: penemuan = اكتشاف (من menemukan). اللقاء = pertemuan (من bertemu).
      ar: penemuan اكتشاف من menemukan، واللقاء pertemuan من bertemu.
      en: penemuan is a discovery (menemukan); a meeting is pertemuan (bertemu).
  - wrong: Pedagangan di sungai sudah ada sejak abad ke-16.
    right: Perdagangan di sungai sudah ada sejak abad ke-16.
    why:
      ar_eg: pedagang = التاجر (الشخص)، والتجارة كمجال = perdagangan.
      ar: pedagang هو التاجر، أما التجارة فـ perdagangan.
      en: pedagang is the trader; trade as an activity is perdagangan.
arabic_bridge:
  ar_eg: "per-…-an بتعمل اللي بيعمله المصدر واسم المكان في العربي: perdagangan = «تجارة»، perkebunan = زي «مزرعة» (وزن مَفْعَلة للمكان)، pertemuan = «لقاء / مُلتقى». ولما تشوف كلمة طويلة بالشكل ده، شيل per- و-an ودوّر على الجذر زي ما بتعمل مع الأوزان."
  ar: "تؤدي per-…-an وظيفة المصدر واسم المكان في العربية: perdagangan = تجارة، perkebunan تقارب «مزرعة» على وزن مَفْعَلة، pertemuan = لقاء أو ملتقى. وبنزع per- و-an نصل إلى الجذر كما نفعل مع الأوزان."
  en: "per-…-an does the work of the Arabic maṣdar and place nouns: perdagangan ≈ تجارة, perkebunan ≈ مزرعة (the مَفْعَلة place pattern), pertemuan ≈ لقاء / ملتقى. Strip per- and -an to find the root, just as you strip an Arabic pattern."
tags: [affix, noun, morphology, confix]
prerequisites: [id.confix.peng-an, id.prefix.ber.meanings, id.prefix.memper]
see_also: [id.nominalization, id.confix.ke-an, id.confix.ber-an]
