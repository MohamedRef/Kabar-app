schema: kabar.grammar/v1
id: id.prefix.ber.meanings
language: id
level: bipa2
title:
  target: bersepeda, berbaju, bersuara, bersedih, berdua
  en: The many meanings of ber-
  ar_eg: معاني ber- الكتير
  ar: معاني السابقة ber-
summary:
  ar_eg: ber- + اسم = عنده / لابس / راكب / بيطلع، وber- + رقم = مع بعض (berdua = إحنا الاتنين)، وber- + إحساس = حالة.
  ar: ber- مع الاسم تفيد الملك أو اللبس أو الركوب أو الإصدار، ومع العدد الاجتماع، ومع الشعور الحال.
  en: ber- + noun = have / wear / ride / produce; ber- + number = as a group of; ber- + feeling = be in that state.
pattern:
  - ber- + vehicle = ride (bersepeda, bermobil)
  - ber- + clothing / thing = wear / have (berbaju, berkacamata, beristri)
  - ber- + product = produce (bertelur, bersuara, berbuah)
  - ber- + feeling = be in a state (bersedih, bergembira)
  - ber- + number = as a group (berdua, bertiga)
explanation:
  ar_eg: |
    في BIPA 1 شفنا ber- بمعنى «بيعمل نشاط». هنا ber- مع الأسماء:
    - يركب: sepeda (عجلة) → bersepeda = بيركب عجلة. bermobil = بعربية.
    - يلبس / عنده: baju → berbaju merah = لابس أحمر. kacamata → berkacamata = لابس نضارة. istri → beristri = متجوز (عنده مرات). anak → beranak = عنده عيال / بيولد.
    - يطلّع / ينتج: telur → bertelur = بيبيض. suara → bersuara = بيطلع صوت. buah → berbuah = بيطرح.
    - حالة: sedih → bersedih = زعلان. gembira → bergembira = فرحان.
    - مجموعة: berdua = (إحنا) الاتنين مع بعض، bertiga = التلاتة.
    - رياضة: berenang (يعوم)، berlari (يجري)، berselancar (يركب أمواج).
    القاعدة الذهبية: ber- + اسم = «صاحب الحاجة دي / معاه الحاجة دي».
  ar: |
    عرفنا ber- بمعنى مزاولة النشاط، وهنا معانيها مع الأسماء:
    - الركوب: bersepeda = يركب دراجة، bermobil = بالسيارة.
    - اللبس والملك: berbaju merah = يلبس الأحمر، berkacamata = يلبس نظارة، beristri = متزوج.
    - الإصدار والإنتاج: bertelur = تبيض، bersuara = يُصدر صوتًا، berbuah = يُثمر.
    - الحال: bersedih = حزين، bergembira = فرح.
    - الاجتماع: berdua = اثنين معًا، bertiga = ثلاثتهم.
    والقاعدة: ber- + اسم = «ذو كذا».
  en: |
    BIPA 1 showed ber- as "doing an activity". With nouns it means:
    - Ride: sepeda → bersepeda (cycle), bermobil (go by car).
    - Wear / have: berbaju merah (wearing red), berkacamata (wearing glasses), beristri (married — has a wife), beranak (have children / give birth).
    - Produce: bertelur (lay eggs), bersuara (make a sound), berbuah (bear fruit).
    - Be in a state: bersedih (be sad), bergembira (be happy).
    - As a group: berdua (the two of us / together), bertiga (as three).
    Golden rule: ber- + noun ≈ "having / with that thing" — like Arabic «ذو».
examples:
  - text: Setiap pagi saya bersepeda di pantai.
    en: Every morning I cycle on the beach.
    ar_eg: كل يوم الصبح بركب العجلة على البحر.
    ar: كل صباح أركب الدراجة على الشاطئ.
  - text: Orang yang berkacamata itu pelatih kami.
    en: The person wearing glasses is our coach.
    ar_eg: اللي لابس نضارة ده المدرب بتاعنا.
    ar: صاحب النظارة ذاك مدربنا.
  - text: Kami berdua suka berselancar.
    en: The two of us love surfing.
    ar_eg: إحنا الاتنين بنحب ركوب الأمواج.
    ar: كلانا يحب ركوب الأمواج.
  - text: Jangan bersedih, besok kita main lagi.
    en: Don't be sad, we'll play again tomorrow.
    ar_eg: ماتزعلش، بكرة نلعب تاني.
    ar: لا تحزن، سنلعب غدًا مرة أخرى.
mistakes:
  - wrong: Saya naik bersepeda.
    right: Saya bersepeda. / Saya naik sepeda.
    why:
      ar_eg: bersepeda فيها «يركب» خلاص؛ يا تقول bersepeda يا naik sepeda.
      ar: bersepeda تتضمن معنى الركوب.
      en: bersepeda already means "ride a bike".
arabic_bridge:
  ar_eg: "ber- + اسم قريبة من «ذو / صاحب»: berkacamata = «أبو نضارة» بالمصري!"
  ar: ber- + الاسم تقارب «ذو» العربية.
  en: ber- + noun ≈ Arabic «ذو» — Egyptian would say «أبو نضارة» for berkacamata.
tags: [affix, verb, morphology]
see_also: [id.prefix.ber.basic, id.confix.ber-an]
