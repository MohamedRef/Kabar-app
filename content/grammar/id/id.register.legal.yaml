schema: kabar.grammar/v1
id: id.register.legal
language: id
level: bipa6
title:
  target: Bahasa peraturan (Pasal, ayat, sebagaimana dimaksud, dalam hal …)
  en: Legal and regulatory language
  ar_eg: لغة القوانين واللوائح
  ar: لغة القوانين والأنظمة
summary:
  ar_eg: "القوانين الإندونيسية ليها قوالب ثابتة: Pasal (مادة)، ayat (فقرة)، wajib (يجب)، dapat (يجوز)، dilarang (يُحظر)، Dalam hal … (في حالة …)، sebagaimana dimaksud … (المشار إليه في …). المهارة إنك تفكّها وتلخّصها بكلام بسيط."
  ar: "للنصوص القانونية الإندونيسية قوالب ثابتة: Pasal (مادة) وayat (فقرة) وwajib وdapat وdilarang وDalam hal وsebagaimana dimaksud، والمهارة تفكيكها وتلخيصها بلغة بسيطة."
  en: "Indonesian legal texts run on fixed formulas: Pasal (article), ayat (paragraph), wajib (must), dapat (may), dilarang (is prohibited), Dalam hal … (in the event that …), sebagaimana dimaksud … (as referred to in …). The skill is to unpack them and summarise plainly."
pattern:
  - "Pasal 5 ayat (1) huruf a   (Article 5 paragraph (1) point a)"
  - "Setiap orang / Setiap warga negara + berhak / wajib / dilarang + verb"
  - "X dapat + verb   (= may; discretion, not obligation)"
  - "Dalam hal + condition, + consequence"
  - "… sebagaimana dimaksud dalam Pasal X / pada ayat (1)"
  - "Yang dimaksud dengan X adalah …   (definition)"
  - "Preamble: Menimbang: … Mengingat: … MEMUTUSKAN: Menetapkan: …"
  - "Closing: Peraturan ini mulai berlaku pada tanggal diundangkan."
explanation:
  ar_eg: |
    القوانين في إندونيسيا طبقات: UU (قانون)، PP (لائحة حكومية)، Permen (قرار وزاري) — زي Permendikbud 27/2017 اللي عليه منهج BIPA نفسه.
    هيكل اللائحة:
    - Menimbang (حيث إن / بالنظر إلى): الأسباب.
    - Mengingat (بناءً على): القوانين اللي بتعتمد عليها.
    - MEMUTUSKAN / Menetapkan (قرر): وبعدها المواد.
    القوالب اللي لازم تعرفها:
    - Pasal = مادة، ayat = فقرة (رقمها بين قوسين: ayat (1))، huruf = بند.
    - wajib = يجب (إلزام)، berhak = له الحق، dilarang = يُحظر، dapat = يجوز (مش «يقدر» ولا «لازم»!). ده أهم فرق.
    - Dalam hal … = في حالة …: Dalam hal peserta tidak hadir, …
    - sebagaimana dimaksud dalam Pasal 3 = المنصوص عليه في المادة 3. بيخلّي الجملة طويلة جدًا، فتجاهلها في القراية الأولى.
    - dan/atau = الاتنين أو واحد منهم.
    - Yang dimaksud dengan … adalah … = يُقصد بـ … (في التعريفات).
    - الجمل كتير مبنية للمجهول ومليانة أسماء مصادر: Pemberian izin dilakukan oleh Menteri.
    الخاتمة الثابتة: «Peraturan … ini mulai berlaku pada tanggal diundangkan.» = تُعمل بهذه اللائحة من تاريخ نشرها.
    إزاي تلخّص: لاقي الفاعل الحقيقي، والفعل الأساسي (wajib / dapat / dilarang)، والشرط (Dalam hal)، وشيل الإحالات. وبعدين قول: «Artinya, …» (يعني…).
  ar: |
    تتدرج القوانين الإندونيسية: UU (قانون)، PP (لائحة حكومية)، Permen (قرار وزاري) كقرار وزير التعليم 27/2017 الذي يقوم عليه منهج BIPA.
    تبدأ اللائحة بـ Menimbang (حيث إن)، ثم Mengingat (بناءً على)، ثم MEMUTUSKAN / Menetapkan (قرّر)، فالمواد.
    الألفاظ الأساسية: Pasal (مادة)، ayat (فقرة ورقمها بين قوسين)، huruf (بند)؛ wajib (يجب)، berhak (يحق)، dilarang (يُحظر)، dapat (يجوز، ولا تعني الإلزام)؛ Dalam hal (في حالة)؛ sebagaimana dimaksud dalam (المنصوص عليه في)؛ dan/atau (كلاهما أو أحدهما)؛ Yang dimaksud dengan … adalah (يُقصد بـ).
    ويكثر فيها المبني للمجهول والمصادر. وتُختم بـ: Peraturan ini mulai berlaku pada tanggal diundangkan.
    وللتلخيص: يُستخرج الفاعل والحكم (wajib / dapat / dilarang) والشرط، وتُحذف الإحالات، ثم يُقال: Artinya, …
  en: |
    Indonesian law is layered: UU (acts), PP (government regulations), Permen (ministerial regulations) — such as Permendikbud 27/2017, which underlies BIPA itself.
    A regulation's frame:
    - Menimbang (whereas / considering): the reasons.
    - Mengingat (having regard to): the laws it rests on.
    - MEMUTUSKAN / Menetapkan (decides / establishes): then the articles.
    Formulas to know:
    - Pasal = article, ayat = paragraph (numbered in brackets: ayat (1)), huruf = point.
    - wajib = must (obligation), berhak = is entitled to, dilarang = is prohibited, dapat = may (discretion — neither "can" nor "must"!). This is the key distinction.
    - Dalam hal … = in the event that …: Dalam hal peserta tidak hadir, …
    - sebagaimana dimaksud dalam Pasal 3 = as referred to in Article 3. It makes sentences very long; skip it on a first read.
    - dan/atau = both or either.
    - Yang dimaksud dengan … adalah … = "… means …" (definitions).
    - Lots of passives and nominalisations: Pemberian izin dilakukan oleh Menteri.
    The fixed closing: "Peraturan … ini mulai berlaku pada tanggal diundangkan." = This regulation comes into force on the date of its promulgation.
    To summarise: find the real actor, the core modal (wajib / dapat / dilarang) and the condition (Dalam hal), drop the cross-references, then say "Artinya, …" (In plain terms, …).
examples:
  - text: Setiap warga negara berhak mendapat pendidikan.
    breakdown: UUD 1945 Pasal 31 ayat (1) · setiap (every) · berhak (has the right to)
    en: Every citizen has the right to education. (Constitution, Article 31(1))
    ar_eg: لكل مواطن الحق في التعليم. (الدستور، المادة 31 فقرة 1)
    ar: لكل مواطن الحق في التعليم. (الدستور، المادة 31، الفقرة 1)
    register: formal
  - text: Dalam hal peserta tidak memenuhi persyaratan sebagaimana dimaksud pada ayat (1), permohonannya dinyatakan gugur.
    breakdown: dalam hal (in the event that) · sebagaimana dimaksud pada ayat (1) (as referred to in paragraph (1)) · dinyatakan gugur (is declared void)
    en: In the event that an applicant does not meet the requirements referred to in paragraph (1), the application is declared void.
    ar_eg: في حالة إن المتقدم ماستوفاش الشروط المذكورة في الفقرة (1)، طلبه بيتلغي.
    ar: في حال عدم استيفاء المتقدم الشروطَ المنصوص عليها في الفقرة (1)، يُعدّ طلبه ساقطًا.
    register: formal
  - text: Lembaga penyelenggara dapat menunjuk pengajar dari luar negeri.
    breakdown: dapat = may (allowed, not required)
    en: The organising institution may appoint teachers from abroad.
    ar_eg: المؤسسة المنظمة «يجوز» لها تعيّن مدرسين من برّه — يعني مسموح، مش لازم.
    ar: يجوز للمؤسسة المنظِّمة تعيين معلمين من الخارج.
    register: formal
  - text: Peraturan Menteri ini mulai berlaku pada tanggal diundangkan.
    en: This Ministerial Regulation comes into force on the date of its promulgation.
    ar_eg: القرار الوزاري ده بيتنفّذ من يوم نشره رسميًا.
    ar: يُعمل بهذا القرار الوزاري من تاريخ نشره.
    register: formal
  - text: Artinya, kalau syaratnya tidak lengkap, pendaftaranmu otomatis batal.
    en: In plain terms, if your documents are incomplete, your registration is automatically cancelled.
    ar_eg: يعني من الآخر، لو ورقك ناقص، التسجيل بتاعك بيتلغي أوتوماتيك.
    ar: أي إنه إذا نقصت الوثائق أُلغي تسجيلك تلقائيًّا.
    register: informal
mistakes:
  - wrong: "«Lembaga dapat menunjuk pengajar asing.» → the institution must appoint foreign teachers."
    right: "«Lembaga dapat menunjuk pengajar asing.» → the institution may (is allowed to) appoint them."
    why:
      ar_eg: dapat في القانون = يجوز (اختياري). الإلزام = wajib، والمنع = dilarang.
      ar: dapat في النص القانوني للجواز، والإلزام wajib، والمنع dilarang.
      en: In legal text dapat means "may" (optional); obligation is wajib, prohibition is dilarang.
  - wrong: sesuai Pasal 3 ayat 1
    right: sebagaimana dimaksud dalam Pasal 3 ayat (1)
    why:
      ar_eg: رقم الفقرة بيتكتب بين قوسين، والصيغة الرسمية للإحالة sebagaimana dimaksud dalam.
      ar: يُكتب رقم الفقرة بين قوسين، وصيغة الإحالة الرسمية sebagaimana dimaksud dalam.
      en: Paragraph numbers go in brackets, and the formal cross-reference is sebagaimana dimaksud dalam.
  - wrong: "«dan/atau» → only both together"
    right: "«dan/atau» → both, or either one"
    why:
      ar_eg: "«pidana penjara dan/atau denda» = سجن أو غرامة أو الاتنين."
      ar: "«pidana penjara dan/atau denda» تعني السجن أو الغرامة أو كليهما."
      en: "\"pidana penjara dan/atau denda\" = prison, a fine, or both."
arabic_bridge:
  ar_eg: "لغة القانون الإندونيسي مليانة عربي: hukum ← حكم، hakim ← حاكم (بس معناها «قاضي»!)، mahkamah ← محكمة، pasal ← فصل (بس معناها «مادة»)، adil ← عادل، wajib ← واجب، berhak ← حق، sah ← صحّ، batal ← باطل، syarat ← شرط، dakwaan ← دعوى، majelis ← مجلس، rakyat ← رعية (= الشعب). وأفعالها زي «يجوز / يجب / يُحظر» في القوانين المصرية بالظبط."
  ar: "تكثر في اللغة القانونية الإندونيسية الألفاظ العربية: hukum ← حكم، hakim ← حاكم (بمعنى القاضي)، mahkamah ← محكمة، pasal ← فصل (بمعنى المادة)، adil ← عادل، wajib ← واجب، hak ← حق، sah ← صحّ، batal ← باطل، syarat ← شرط، dakwaan ← دعوى، majelis ← مجلس، rakyat ← رعية."
  en: "Legal Indonesian is full of Arabic: hukum ← حكم, hakim ← حاكم (but it means 'judge'), mahkamah ← محكمة, pasal ← فصل (but it means 'article'), adil ← عادل, wajib ← واجب, hak ← حق, sah ← صحّ, batal ← باطل, syarat ← شرط, dakwaan ← دعوى, majelis ← مجلس, rakyat ← رعية."
tags: [register, legal, formal-writing, reading]
prerequisites: [id.nominalization, id.sentence.complex, id.passive.di]
see_also: [id.register.academic, id.register.audience, id.notice.harap-dilarang]
cues:
  - match: "pasal|ayat"
    note:
      ar_eg: "pasal = مادة، ayat = فقرة (لغة القوانين)."
      ar: "pasal = مادة، ayat = فقرة."
      en: "pasal = article, ayat = clause (legal)."
  - match: "sebagaimana dimaksud"
    note:
      ar_eg: "sebagaimana dimaksud = المشار إليه (قانوني)."
      ar: "sebagaimana dimaksud = المشار إليه."
      en: "sebagaimana dimaksud = as referred to in."
