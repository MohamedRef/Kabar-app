schema: kabar.grammar/v1
id: id.cohesion.lexical
language: id
level: bipa7
title:
  target: Kohesi leksikal (repetisi, sinonimi, antonimi, hiponimi, kolokasi)
  en: Lexical cohesion
  ar_eg: الترابط بالمفردات (التكرار، المرادفات، الأضداد، الكلمات المتلازمة)
  ar: الاتساق المعجمي
summary:
  ar_eg: "النص بيتماسك كمان بالكلمات نفسها: تكرار مقصود، مرادفات (hoaks / berita bohong / kabar palsu)، أضداد، كلمة عامة وكلمات تحتها (platform ← TikTok، Instagram)، وكلمات متلازمة (menyebarkan hoaks، hujan deras)."
  ar: "يتماسك النص أيضًا بالمفردات: التكرار المقصود، والترادف (hoaks / berita bohong)، والتضاد، والعموم والخصوص (platform ← TikTok)، والتلازم اللفظي (menyebarkan hoaks، hujan deras)."
  en: "Texts also hold together through vocabulary: deliberate repetition, synonyms (hoaks / berita bohong / kabar palsu), antonyms, general-specific pairs (platform ← TikTok, Instagram) and collocations (menyebarkan hoaks, hujan deras)."
pattern:
  - "Repetisi: key term repeated for emphasis (literasi digital … literasi digital …)"
  - "Sinonimi: hoaks → berita bohong → kabar palsu · warganet → pengguna internet"
  - "Antonimi: fakta ↔ hoaks, manfaat ↔ dampak buruk"
  - "Hiponimi: platform media sosial ⊃ TikTok, Instagram, WhatsApp → ketiga platform itu"
  - "Kolokasi: menyebarkan hoaks, mengunggah foto, menjadi viral, hujan deras, angin kencang"
explanation:
  ar_eg: |
    في مقال عن السوشيال ميديا، لو كررت «hoaks» عشر مرات النص هيبقى ممل؛ ولو كل مرة استخدمت كلمة ملهاش علاقة القارئ هيتوه. الحل: شبكة كلمات مترابطة.
    1. التكرار المقصود (repetisi): للمصطلح الأساسي أو للتأكيد في الخطب: «Literasi digital bukan pilihan. Literasi digital adalah kebutuhan.»
    2. المرادفات (sinonimi): hoaks → berita bohong → kabar palsu؛ warganet (نتزن) → pengguna internet؛ media sosial → medsos (عامية).
    3. الأضداد (antonimi): fakta ↔ hoaks، manfaat ↔ dampak buruk (الفايدة ↔ الضرر). بيعملوا مقارنة واضحة.
    4. العام والخاص (hiponimi): تذكر الأمثلة وبعدين ترجع لهم بالكلمة العامة: TikTok, Instagram, dan WhatsApp … ketiga platform itu (التلات منصات دي).
    5. التلازم اللفظي (kolokasi): كلمات «بتمشي مع بعض»: menyebarkan hoaks (ينشر إشاعة)، mengunggah foto (يرفع صورة)، menjadi viral، hujan deras (مطر غزير)، angin kencang (ريح شديدة)، mengambil keputusan (ياخد قرار).
    الكولوكيشن هو أصعب حاجة على المتعلم المتقدم، لأن الترجمة الحرفية من الإنجليزي أو العربي بتطلع كلام مفهوم بس «مش إندونيسي».
  ar: |
    يتماسك النص أيضًا بشبكة من المفردات المترابطة:
    1. التكرار المقصود للمصطلح المحوري أو للتوكيد: «Literasi digital bukan pilihan. Literasi digital adalah kebutuhan.»
    2. الترادف: hoaks → berita bohong → kabar palsu؛ warganet → pengguna internet.
    3. التضاد: fakta ↔ hoaks، manfaat ↔ dampak buruk.
    4. العموم والخصوص: تُذكر الأمثلة ثم يُحال إليها باللفظ العام: ketiga platform itu.
    5. التلازم اللفظي: menyebarkan hoaks، mengunggah foto، menjadi viral، hujan deras، angin kencang، mengambil keputusan.
    والتلازم أصعب ما يواجهه المتعلم المتقدم، إذ تُنتج الترجمة الحرفية كلامًا مفهومًا غير مألوف.
  en: |
    In an essay on social media, repeating "hoaks" ten times is dull; switching to unrelated words loses the reader. The answer is a web of related words.
    1. Deliberate repetition: for the key term, or for rhetorical emphasis: "Literasi digital bukan pilihan. Literasi digital adalah kebutuhan."
    2. Synonyms: hoaks → berita bohong → kabar palsu; warganet (netizens) → pengguna internet; media sosial → medsos (casual).
    3. Antonyms: fakta ↔ hoaks, manfaat ↔ dampak buruk (benefit ↔ harm) — they make contrasts crisp.
    4. Hyponymy: name examples, then refer back with the general term: TikTok, Instagram, dan WhatsApp … ketiga platform itu (those three platforms).
    5. Collocation: words that "go together": menyebarkan hoaks (spread a hoax), mengunggah foto (upload a photo), menjadi viral, hujan deras (heavy rain), angin kencang (strong wind), mengambil keputusan (make a decision).
    Collocation is the hardest part for advanced learners: literal translations from English or Arabic come out understandable but "not Indonesian".
examples:
  - text: Hoaks menyebar lebih cepat daripada klarifikasi. Berita bohong itu sering dibagikan sebelum dibaca sampai habis.
    breakdown: sinonimi — hoaks → berita bohong itu
    en: Hoaxes spread faster than corrections. Such false stories are often shared before being read to the end.
    ar_eg: الإشاعة بتنتشر أسرع من التوضيح. والخبر الكدب ده غالبًا بيتشير قبل ما حد يقراه للآخر.
    ar: تنتشر الإشاعة أسرع من التصحيح، وكثيرًا ما يُشارَك الخبر الكاذب قبل قراءته كاملًا.
    register: formal
  - text: TikTok, Instagram, dan WhatsApp digunakan oleh jutaan orang Indonesia. Ketiga platform itu juga menjadi jalur utama penyebaran informasi.
    breakdown: hiponimi — TikTok, Instagram, WhatsApp → ketiga platform itu
    en: TikTok, Instagram and WhatsApp are used by millions of Indonesians. Those three platforms are also the main channels through which information spreads.
    ar_eg: تيك توك وإنستجرام وواتساب بيستخدمهم ملايين الإندونيسيين. والتلات منصات دول هما كمان الطريق الأساسي لانتشار المعلومات.
    ar: يستخدم ملايين الإندونيسيين تيك توك وإنستغرام وواتساب، وهذه المنصات الثلاث هي أيضًا القنوات الرئيسة لانتشار المعلومات.
    register: formal
  - text: Literasi digital bukan pilihan. Literasi digital adalah kebutuhan.
    breakdown: repetisi (rhetorical) + antonimi — pilihan (option) ↔ kebutuhan (necessity)
    en: Digital literacy isn't optional. Digital literacy is a necessity.
    ar_eg: الثقافة الرقمية مش اختيار. الثقافة الرقمية ضرورة.
    ar: ليست الثقافة الرقمية خيارًا، بل الثقافة الرقمية ضرورة.
    register: formal
  - text: Media sosial membawa manfaat, tetapi dampak buruknya juga tidak bisa diabaikan.
    breakdown: antonimi — manfaat ↔ dampak buruk
    en: Social media brings benefits, but its harmful effects can't be ignored either.
    ar_eg: السوشيال ميديا ليها فوايد، بس أضرارها برضه ماينفعش نتجاهلها.
    ar: لوسائل التواصل الاجتماعي فوائد، لكن أضرارها لا يمكن تجاهلها أيضًا.
  - text: Video banjir di Jakarta langsung menjadi viral setelah diunggah seorang warganet.
    breakdown: kolokasi — menjadi viral, diunggah (uploaded), warganet (netizen)
    en: The video of the flood in Jakarta went viral as soon as a netizen uploaded it.
    ar_eg: فيديو الفيضان في جاكرتا ضرب تريند على طول بعد ما واحد من رواد النت رفعه.
    ar: انتشر مقطع الفيضان في جاكرتا انتشارًا واسعًا فور أن رفعه أحد مستخدمي الإنترنت.
mistakes:
  - wrong: Kemarin ada hujan keras dan angin kuat.
    right: Kemarin ada hujan deras dan angin kencang.
    why:
      ar_eg: الإندونيسي بيقول hujan deras وangin kencang. keras وkuat مفهومين بس مش «متلازمين» هنا (ترجمة من heavy / strong).
      ar: التلازم الصحيح hujan deras وangin kencang، وkeras وkuat ترجمة حرفية.
      en: Indonesian says hujan deras and angin kencang; keras and kuat are literal calques of heavy / strong.
  - wrong: Banyak orang membuat hoaks di media sosial dan banyak orang membuat hoaks itu menyebar dan hoaks …
    right: Banyak orang menyebarkan hoaks di media sosial. Kabar palsu itu cepat menjadi viral.
    why:
      ar_eg: التكرار الكتير من غير هدف بيخلّي النص ضعيف. نوّع بالمرادفات والكلمات المتلازمة.
      ar: التكرار غير المقصود يُضعف النص، والتنويع بالمرادفات والمتلازمات أجود.
      en: Aimless repetition weakens the text; vary with synonyms and natural collocations.
  - wrong: Saya akan membuat foto ke Instagram.
    right: Saya akan mengunggah foto ke Instagram.
    why:
      ar_eg: membuat foto = تصوّر / تعمل صورة. رفع الصورة على النت = mengunggah.
      ar: membuat foto بمعنى التقاط الصورة، أما رفعها فـ mengunggah.
      en: membuat foto means to take a photo; posting it online is mengunggah.
arabic_bridge:
  ar_eg: "التلازم اللفظي موجود عندنا: بنقول «مطر غزير» مش «مطر تقيل»، و«ياخد قرار». ولو ترجمت حرفي من العربي هتقع في نفس الفخ: «اتخذ قرارًا» = mengambil keputusan (بالصدفة نفس الصورة!)، بس «مطر غزير» = hujan deras مش hujan banyak. والترادف في الإندونيسي حلّه زي العربي: «إشاعة / خبر كاذب / أكذوبة» = hoaks / berita bohong / kabar palsu."
  ar: "التلازم اللفظي معروف في العربية (مطرٌ غزير، اتخذ قرارًا)، وبعضه يتطابق مع الإندونيسية (mengambil keputusan) وبعضه يختلف، فلا يُترجم حرفيًّا. ويقابل الترادفُ هنا «إشاعة / خبر كاذب / أكذوبة»."
  en: "Arabic has the same phenomenon (مطر غزير, اتخذ قرارًا). Some collocations line up with Indonesian (mengambil keputusan ≈ اتخذ قرارًا), others don't, so never translate word for word."
