schema: kabar.grammar/v1
id: id.interjection.particles
language: id
level: bipa2
title:
  target: wah, aduh, lho, kok, dong, sih, deh, kan, ya
  en: Interjections and spoken particles
  ar_eg: كلمات التعجب وحروف الكلام (ياه، آه، طب، بقى)
  ar: ألفاظ التعجب وأدوات الكلام
summary:
  ar_eg: "الكلمات الصغيرة دي بتدي إحساس للجملة: wah = ياه!، aduh = آه / يا نهار!، lho = إيه ده! (تنبيه أو مفاجأة)، kok = إزاي يعني / ليه كده، dong = بقى، sih = يعني / أصل، deh = خلاص / ماشي، kan = مش كده؟، ya = أيوه / ماشي؟"
  ar: "ألفاظ صغيرة تمنح الجملة لونًا عاطفيًا: wah للإعجاب، aduh للألم والضيق، lho للتنبيه والمفاجأة، kok للاستغراب، dong للإلحاح، sih للتلطيف أو التعليل، deh للموافقة، kan = أليس كذلك؟، ya = نعم / حسنًا؟"
  en: Small words that colour a sentence — wah (wow), aduh (ouch / oh no), lho (hey, you know), kok (how come), dong (come on), sih (well / after all), deh (OK then), kan (right?), ya (yeah / OK?).
pattern:
  - interjection at the start (Wah, … / Aduh, …)
  - particle after the word it colours (Ayo dong! · Kenapa sih?), but kok, and often kan, open the clause (Kok mahal? · Kan sudah saya bilang)
explanation:
  ar_eg: |
    دي اللي هتخلي كلامك طبيعي ومش «كتاب»:
    - wah = ياه / واو: Wah, indah sekali! = ياه، جميل أوي!
    - aduh = آه / يا خبر: Aduh, sakit! = آه بيوجع! Aduh, lupa! = يا خبر، نسيت!
    - lho / loh = تنبيه أو مفاجأة: Lho, kamu di sini? = إيه ده إنت هنا؟
    - kok = إزاي / ليه كده (استغراب): Kok mahal sekali? = إزاي غالي كده؟
    - dong = بقى (إلحاح لطيف): Ayo dong! = يلا بقى!
    - sih = يعني (تلطيف السؤال أو التبرير): Kenapa sih? = ليه بس؟ Enak sih, tapi mahal = حلو يعني بس غالي.
    - deh = خلاص / ماشي: Ya udah deh = خلاص ماشي.
    - kan = مش كده؟ / ما إنت عارف: Kan sudah saya bilang = ما أنا قلتلك.
    - ya = ماشي؟ / أيوه (في آخر الطلب بيلطفه): Tunggu sebentar, ya = استنى شوية، ماشي؟
    كلها عامية؛ ماتستخدمهاش في الإيميل الرسمي.
  ar: |
    هذه الألفاظ تجعل كلامك طبيعيًا لا «كلام كتب»:
    - wah للإعجاب والدهشة: Wah, indah sekali! = يا للروعة، ما أجمله!
    - aduh للألم أو الضيق: Aduh, sakit! = آه، إنه يؤلم! Aduh, lupa! = يا إلهي، نسيت!
    - lho / loh للتنبيه والمفاجأة: Lho, kamu di sini? = ما هذا، أأنت هنا؟
    - kok للاستغراب (كيف ذلك؟): Kok mahal sekali? = كيف يكون غاليًا إلى هذا الحد؟
    - dong للإلحاح اللطيف: Ayo dong! = هيّا إذن!
    - sih لتلطيف السؤال أو التعليل: Kenapa sih? = لماذا يا ترى؟ Enak sih, tapi mahal = لذيذ حقًّا، لكنه غالٍ.
    - deh للموافقة: Ya udah deh = حسنًا إذن.
    - kan = أليس كذلك؟ / كما تعلم: Kan sudah saya bilang = ألم أقل لك؟
    - ya في آخر الطلب لتلطيفه: Tunggu sebentar, ya = انتظر قليلًا، حسنًا؟
    وكلها عامية لا تُستعمل في المراسلات الرسمية.
  en: |
    These make you sound human, not textbook:
    - wah = wow: Wah, indah sekali!
    - aduh = ouch / oh no: Aduh, sakit! · Aduh, lupa!
    - lho / loh = hey, surprise: Lho, kamu di sini?
    - kok = how come: Kok mahal sekali?
    - dong = come on (gentle insistence): Ayo dong!
    - sih = softener / "well": Kenapa sih? · Enak sih, tapi mahal.
    - deh = OK then: Ya udah deh.
    - kan = right? / you know: Kan sudah saya bilang.
    - ya = OK? (softens requests): Tunggu sebentar, ya.
    All informal — keep them out of formal emails.
examples:
  - text: Wah, pantainya indah banget!
    en: Wow, the beach is so beautiful!
    ar_eg: ياه، البحر جميل أوي!
    ar: يا للروعة، الشاطئ جميل جدًا!
    register: informal
  - text: Aduh, dompet saya ketinggalan!
    en: Oh no, I left my wallet behind!
    ar_eg: يا نهار، المحفظة نسيتها!
    ar: يا للمصيبة، نسيت محفظتي!
    register: informal
  - text: Kok kamu nggak bilang?
    en: How come you didn't tell me?
    ar_eg: إزاي ماقلتليش؟
    ar: كيف لم تخبرني؟
    register: informal
  - text: Ikut dong!
    en: Come on, let me come too!
    ar_eg: خدوني معاكم بقى!
    ar: هيّا، خذوني معكم!
    register: informal
mistakes:
  - wrong: Dengan hormat, kirim dokumennya dong.
    right: Dengan hormat, mohon kirimkan dokumennya.
    why:
      ar_eg: dong عامية؛ في الرسمي استخدم mohon.
      ar: dong عامية، والرسمي mohon.
      en: dong is casual; formal writing uses mohon.
arabic_bridge:
  ar_eg: kok ≈ «إزاي يعني؟»، dong ≈ «بقى»، kan ≈ «مش كده؟»، aduh ≈ «آه / يا خبر». المصري عنده نفس الحروف دي بالظبط!
  ar: "لكل منها نظير في العامية المصرية: kok ≈ «إزاي يعني؟»، dong ≈ «بقى»، kan ≈ «مش كده؟» (أليس كذلك؟)، aduh ≈ «آه / يا خبر»."
  en: Egyptian has exact matches — dong ≈ «بقى», kan ≈ «مش كده؟», kok ≈ «إزاي يعني؟», aduh ≈ «آه / يا خبر».
tags: [particles, informal, spoken]
see_also: [id.chat.abbreviations]
cues:
  - match: "wah|aduh|lho|loh|kok|dong|sih|deh|kan|nih|tuh|yuk"
    note:
      ar_eg: "أداة كلام بتلوّن الجملة: wah ياه، aduh آه/يا خبر، lho إيه ده، kok إزاي كده، dong بقى، sih يعني، deh خلاص، kan مش كده؟"
      ar: "أداة تخاطب تلوّن الجملة: wah للإعجاب، aduh للألم، lho للمفاجأة، kok للاستغراب، dong للإلحاح، sih للتلطيف، deh للموافقة، kan = أليس كذلك؟"
      en: "Talk particle: wah wow, aduh ouch, lho hey (surprise), kok how come, dong come on, sih well, deh okay then, kan right?"
