schema: kabar.grammar/v1
id: jv.aksara.nglegena
language: jv
level: j6
title:
  target: ꦲꦤꦕꦫꦏ · aksara nglegena (ha na ca ra ka)
  en: Aksara Jawa — the 20 base letters (hanacaraka)
  ar_eg: الأبجدية الجاوية — الحروف العشرين الأساسية (هانا تشارا كا)
  ar: الأبجدية الجاوية — الحروف العشرون الأساسية (هانا تشارا كا)
summary:
  ar_eg: "الأبجدية الجاوية 20 حرف أساسي، وكل حرف «مقطع» فيه a جاهزة: ꦏ = ka، ꦱ = sa. يعني كأن كل حرف عليه فتحة من نفسه. والترتيب قصيدة: ha na ca ra ka، da ta sa wa la، pa dha ja ya nya، ma ga ba tha nga."
  ar: "للأبجدية الجاوية عشرون حرفًا أساسيًا، كل منها مقطع بصائت a مضمَّن: ꦏ = ka، وꦱ = sa، فكأن على كل حرف فتحة. وترتيبها قصيدة: ha na ca ra ka، da ta sa wa la، pa dha ja ya nya، ma ga ba tha nga."
  en: "Aksara Jawa has 20 base letters, and each is a syllable with a built-in a: ꦏ = ka, ꦱ = sa — as if every letter carried its own fatha. The order is a poem: ha na ca ra ka, da ta sa wa la, pa dha ja ya nya, ma ga ba tha nga."
pattern:
  - "ꦲ ha · ꦤ na · ꦕ ca · ꦫ ra · ꦏ ka"
  - "ꦢ da · ꦠ ta · ꦱ sa · ꦮ wa · ꦭ la"
  - "ꦥ pa · ꦝ dha · ꦗ ja · ꦪ ya · ꦚ nya"
  - "ꦩ ma · ꦒ ga · ꦧ ba · ꦛ tha · ꦔ nga"
  - "each letter = consonant + a; the a is said o where Latin spelling is said o: ꦭꦫ lara [loro]"
  - "a word starting with a vowel is written with ꦲ: ꦲꦥ apa · ꦲꦏꦸ aku"
  - "written left to right, words run together without spaces; ꧈ pada lingsa ≈ comma, ꧉ pada lungsi ≈ full stop"
explanation:
  ar_eg: |
    أهلًا بيك في آخر محطة: كوتاغيدي، عاصمة ماتارام القديمة. هنا هنتعلم الخط الجاوي (aksara Jawa، أو hanacaraka).
    أول حاجة لازم تفهمها: ده مش أبجدية زي الإنجليزي، ولا زي العربي بالظبط. كل حرف = حرف ساكن + a. يعني ꦏ مش «ك»، دي «كَ» (ka). كأن كل حرف عربي عليه فتحة دايمًا من غير ما تكتبها.
    الحروف العشرين (aksara nglegena = الحروف «العريانة» من غير علامات):
    ꦲ ha · ꦤ na · ꦕ ca · ꦫ ra · ꦏ ka
    ꦢ da · ꦠ ta · ꦱ sa · ꦮ wa · ꦭ la
    ꦥ pa · ꦝ dha · ꦗ ja · ꦪ ya · ꦚ nya
    ꦩ ma · ꦒ ga · ꦧ ba · ꦛ tha · ꦔ nga
    الترتيب ده قصيدة عن خادمين مخلصين للملك الأسطوري Aji Saka:
    Hana caraka = كان فيه رسولين · Data sawala = اتخانقوا · Padha jayanya = كانوا قد بعض في القوة · Maga bathanga = والاتنين ماتوا.
    حاجات مهمة:
    - كلمات زي «الـ a اللي بتتنطق o» (اتعلمناها في الإملا) نفس القاعدة هنا: ꦭꦫ = lara وبتتنطق «لورو».
    - الكلمة اللي بتبدأ بحرف متحرك بتتكتب بـ ꦲ: ꦲꦥ = apa، ꦲꦏꦸ = aku. زي الألف عندنا اللي بتشيل الهمزة.
    - في الخط التقليدي مفيش مسافات بين الكلمات. وفيه علامة ꧈ (زي الفاصلة) و꧉ (زي النقطة).
    - لاحظ الزوجين: ꦢ da / ꦝ dha، وꦠ ta / ꦛ tha — نفس الفرق اللي في الإملا (د سنّية / د تقيلة).
    دلوقتي بس الحروف بـ a. الدرس الجاي هنغيّر الحركة (i، u، e، o).
  ar: |
    في محطتنا الأخيرة كوتاغيدي نتعلم الخط الجاوي (aksara Jawa أو hanacaraka).
    وهو ليس أبجدية صوتية خالصة: كل حرف ساكن مع a مضمَّنة، فـ ꦏ = «كَ» (ka)، كأن الفتحة لازمة لكل حرف.
    والحروف العشرون (aksara nglegena = الحروف المجرّدة):
    ꦲ ha · ꦤ na · ꦕ ca · ꦫ ra · ꦏ ka
    ꦢ da · ꦠ ta · ꦱ sa · ꦮ wa · ꦭ la
    ꦥ pa · ꦝ dha · ꦗ ja · ꦪ ya · ꦚ nya
    ꦩ ma · ꦒ ga · ꦧ ba · ꦛ tha · ꦔ nga
    وترتيبها قصيدة عن خادمَي الملك الأسطوري Aji Saka: Hana caraka (كان رسولان)، Data sawala (فتنازعا)، Padha jayanya (وتكافآ قوة)، Maga bathanga (فهلكا معًا).
    - تُنطق a كما في الإملاء اللاتيني: ꦭꦫ = lara وتُنطق قريبًا من «لورو».
    - الكلمة المبدوءة بصائت تُكتب بـ ꦲ: ꦲꦥ = apa، كالألف حاملة الهمزة.
    - لا مسافات بين الكلمات في الكتابة التقليدية، و꧈ علامة كالفاصلة، و꧉ كالنقطة.
    - لاحظ الزوجين ꦢ da / ꦝ dha وꦠ ta / ꦛ tha.
  en: |
    Welcome to the last stop: Kotagede, the old Mataram capital. Here you learn aksara Jawa (also called hanacaraka).
    First idea: it isn't an alphabet like English, nor exactly like Arabic. Each letter = consonant + a. So ꦏ isn't "k", it's "ka" — as if every Arabic letter carried an unwritten fatha.
    The 20 letters (aksara nglegena = "bare" letters, without marks):
    ꦲ ha · ꦤ na · ꦕ ca · ꦫ ra · ꦏ ka
    ꦢ da · ꦠ ta · ꦱ sa · ꦮ wa · ꦭ la
    ꦥ pa · ꦝ dha · ꦗ ja · ꦪ ya · ꦚ nya
    ꦩ ma · ꦒ ga · ꦧ ba · ꦛ tha · ꦔ nga
    The order is a poem about the legendary king Aji Saka's two loyal servants:
    Hana caraka = there were two messengers · Data sawala = they quarrelled · Padha jayanya = they were equally strong · Maga bathanga = and both died.
    Key points:
    - The a sounds o in the same places as in Latin spelling: ꦭꦫ = lara, said "loro".
    - A word starting with a vowel is written with ꦲ: ꦲꦥ = apa, ꦲꦏꦸ = aku. Like Arabic alif carrying a hamza.
    - Traditional writing has no spaces between words. ꧈ works like a comma and ꧉ like a full stop.
    - Notice the pairs ꦢ da / ꦝ dha and ꦠ ta / ꦛ tha — the same dental / retroflex contrast from the spelling unit.
    For now every letter has a. Next unit changes the vowel (i, u, e, o).
examples:
  - text: ꦱꦥ (sapa)
    breakdown: ꦱ sa + ꦥ pa
    en: who? (ngoko)
    ar_eg: مين؟
    ar: من؟
  - text: ꦲꦥ (apa)
    breakdown: ꦲ ha (carries the initial vowel a) + ꦥ pa
    en: what?
    ar_eg: إيه؟
    ar: ماذا؟
  - text: ꦩꦠ (mata)
    breakdown: ꦩ ma + ꦠ ta
    en: eye
    ar_eg: عين
    ar: عين
  - text: ꦭꦫ (lara)
    breakdown: ꦭ la + ꦫ ra · said "loro"
    en: sick
    ar_eg: عيان
    ar: مريض
  - text: ꦝꦝ (dhadha)
    breakdown: ꦝ dha + ꦝ dha (retroflex, not ꦢ da)
    en: chest
    ar_eg: صدر
    ar: صدر
  - text: ꦗꦒ (jaga)
    breakdown: ꦗ ja + ꦒ ga
    en: guard, keep watch
    ar_eg: يحرس
    ar: يحرس
mistakes:
  - wrong: Reading ꦏ as a bare "k".
    right: ꦏ = ka; the vowel a is built in.
    why:
      ar_eg: كل حرف جاوي فيه a من نفسه. عشان تشيلها محتاج علامة (pangkon) هنتعلمها بعدين.
      ar: في كل حرف a مضمَّنة، وحذفها يحتاج علامة pangkon التي سنتعلمها.
      en: Every letter has a built-in a; removing it needs a mark (pangkon), coming later.
  - wrong: Writing ꦢꦢ for dhadha.
    right: ꦝꦝ (dha dha).
    why:
      ar_eg: ꦢ = da السنّية، وꦝ = dha التقيلة. حرفين مختلفين.
      ar: ꦢ دال أسنانية، وꦝ دال ارتدادية؛ حرفان مختلفان.
      en: ꦢ is dental da, ꦝ is retroflex dha — different letters.
  - wrong: Writing "apa" as just ꦥ.
    right: ꦲꦥ — the opening vowel needs ꦲ.
    why:
      ar_eg: الحرف المتحرك في أول الكلمة محتاج «كرسي» هو ꦲ، زي ألف الهمزة.
      ar: يحتاج الصائت في أول الكلمة إلى ꦲ كما تحتاج الهمزة إلى ألف.
      en: A word-initial vowel needs ꦲ as its carrier, like alif carrying hamza.
arabic_bridge:
  ar_eg: "تخيّل كل حرف عربي عليه فتحة دايمًا: ب = بَ، ك = كَ. ده الخط الجاوي. ولما تحب تغيّر الحركة بتحط علامة — زي الكسرة والضمة بالظبط (الدرس الجاي). وꦲ في أول الكلمة بتشيل الحركة زي الألف اللي بتشيل الهمزة."
  ar: "تخيّل أن كل حرف عربي مفتوح دائمًا: بَ، كَ؛ هذا هو الخط الجاوي، وتغيير الحركة يكون بعلامات كالكسرة والضمة، وꦲ في أول الكلمة تحمل الصائت كما تحمل الألف الهمزة."
  en: "Imagine every Arabic letter always carrying a fatha: بَ, كَ. That's aksara Jawa. To change the vowel you add a mark, like kasra and damma (next unit). Word-initial ꦲ carries the vowel the way alif carries hamza."
