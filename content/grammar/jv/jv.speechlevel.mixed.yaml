schema: kabar.grammar/v1
id: jv.speechlevel.mixed
language: jv
level: j4
title:
  target: ngoko lugu · ngoko alus · krama lugu · krama alus
  en: Mixed levels — ngoko alus (polite ngoko) and krama alus (full krama)
  ar_eg: المستويات المخلوطة — النغوكو المهذّبة والكراما الكاملة
  ar: المستويات الممزوجة — النغوكو المهذّبة والكراما الكاملة
summary:
  ar_eg: "الجاوي في الحقيقة أربع درجات: ngoko lugu (صحاب)، ngoko alus = هيكل نغوكو + كلمات krama inggil للشخص (لأخوك الكبير أو زميل أكبر قريب منك)، krama lugu = كراما من غير تبجيل، وkrama alus = كراما + krama inggil (للكبار والمناسبات)."
  ar: "للجاوية أربع درجات: ngoko lugu للأصدقاء، وngoko alus = نغوكو مع ألفاظ krama inggil للمخاطَب القريب الأكبر، وkrama lugu = كراما بلا تبجيل، وkrama alus = كراما مع krama inggil للكبار والمناسبات."
  en: "Real Javanese has four steps: ngoko lugu (friends), ngoko alus = a ngoko frame plus krama inggil words for the person (an older sibling, a close senior colleague), krama lugu = krama without honorifics, and krama alus = krama plus krama inggil (elders, formal occasions)."
pattern:
  - "ngoko lugu: Kowe arep lunga menyang ngendi?"
  - "ngoko alus: Panjenengan arep tindak menyang ngendi? (ngoko words + krama inggil for the person)"
  - "krama lugu: Sampeyan badhe kesah dhateng pundi? (krama words, no honorifics)"
  - "krama alus: Panjenengan badhe tindak dhateng pundi? (krama words + krama inggil)"
  - "ngoko alus recipe: keep wis, arep, ora, ngendi … but swap kowe → panjenengan / Mas / Mbak / Bapak and the person's verbs and nouns → krama inggil"
  - "your own actions stay plain: Aku wis mangan, Mas sampun dhahar? → Aku wis mangan. Mas wis dhahar?"
explanation:
  ar_eg: |
    في J3 اتعلمنا ngoko وkrama كأنهم صندوقين منفصلين. في الحقيقة الناس بيخلطوهم، والخلطة دي ليها قواعد. التقسيم المدرسي الحديث أربع درجات:
    1. ngoko lugu (نغوكو سادة): كله نغوكو. للصحاب والأصغر. «Kowe arep lunga menyang ngendi?»
    2. ngoko alus (نغوكو مهذبة): الكلمات الصغيرة نغوكو (wis، arep، ora، ngendi)، بس أي حاجة تخص الشخص اللي بتحترمه تبقى krama inggil: الضمير panjenengan أو اللقب (Mas، Mbak، Bapak)، وأفعاله (tindak، dhahar، sare)، وحاجاته (dalem، asma). «Panjenengan arep tindak menyang ngendi?»
       دي للناس اللي قريبين منك بس أكبر: أخوك الكبير، مراتك أو جوزك في بيوت كتير، زميل أكبر صاحبك. يعني «قريب بس محترم».
    3. krama lugu (كراما سادة): كل الكلمات كراما بس من غير تبجيل. «Sampeyan badhe kesah dhateng pundi?» — مؤدبة بس عادية: للبياع، لحد في سنك مش عارفه.
    4. krama alus (كراما كاملة): كراما + krama inggil. «Panjenengan badhe tindak dhateng pundi?» — للكبار، المدرسين، المناسبات الرسمية.
    إزاي تبني ngoko alus؟ خد الجملة النغوكو، وغيّر بس الحاجات اللي بتشاور على الشخص المحترم. وحاجتك إنت تفضل عادية: «Aku wis mangan. Mas wis dhahar?»
    ده شبه إنك تكلم أخوك الكبير بالمصري العادي بس تقوله «حضرتك» من وقت للتاني — الإطار قريب والاحترام موجود.
    ولو مش متأكد: krama alus مع الكبار عمرها ما هتغلط.
  ar: |
    الناس يمزجون ngoko وkrama وفق قواعد، والتقسيم المدرسي الحديث أربع درجات:
    1. ngoko lugu: نغوكو خالصة للأصدقاء والأصغر: «Kowe arep lunga menyang ngendi?»
    2. ngoko alus: ألفاظ الربط نغوكو (wis، arep، ora، ngendi) وما يخص المعظَّم krama inggil: الضمير panjenengan أو اللقب، وأفعاله (tindak، dhahar)، وأشياؤه (dalem، asma): «Panjenengan arep tindak menyang ngendi?» وهي لمن هو قريب وأكبر: الأخ الأكبر، والزوج في كثير من البيوت، والزميل الأقدم الصديق.
    3. krama lugu: كراما بلا تبجيل: «Sampeyan badhe kesah dhateng pundi?» للبائع والنظير الغريب.
    4. krama alus: كراما مع krama inggil: «Panjenengan badhe tindak dhateng pundi?» للكبار والمناسبات.
    ولبناء ngoko alus: خذ جملة النغوكو وبدّل ما يخص المعظَّم وحده، وأبقِ أفعالك عادية: «Aku wis mangan. Mas wis dhahar?»
    وعند الشك فـ krama alus مع الكبار لا تخطئ.
  en: |
    J3 treated ngoko and krama as two separate boxes. In real life people mix them, and the mix has rules. The modern school classification has four steps:
    1. ngoko lugu (plain ngoko): all ngoko. Friends, younger people. "Kowe arep lunga menyang ngendi?"
    2. ngoko alus (polite ngoko): the little words stay ngoko (wis, arep, ora, ngendi), but anything about the person you honour becomes krama inggil: the pronoun panjenengan or a title (Mas, Mbak, Bapak), their actions (tindak, dhahar, sare) and their things (dalem, asma). "Panjenengan arep tindak menyang ngendi?"
       It's for people who are close but senior: an older sibling, a spouse in many homes, a senior colleague who is a friend. "Close but respected".
    3. krama lugu (plain krama): all krama words, no honorifics. "Sampeyan badhe kesah dhateng pundi?" Polite but everyday: a seller, a stranger your age.
    4. krama alus (refined krama): krama plus krama inggil. "Panjenengan badhe tindak dhateng pundi?" Elders, teachers, formal occasions.
    To build ngoko alus: take the ngoko sentence and swap only what points at the respected person. Your own actions stay plain: "Aku wis mangan. Mas wis dhahar?"
    It's like talking to your older brother in everyday Egyptian Arabic but slipping in «حضرتك» — a familiar frame with respect inside.
    Unsure? Krama alus with elders is never wrong.
examples:
  - text: Kowe arep lunga menyang ngendi?
    breakdown: kowe · arep = mau · lunga = pergi · menyang = ke · ngendi = mana (ngoko lugu)
    en: Where are you going? (to a friend)
    ar_eg: رايح فين؟ (لصاحبك)
    ar: إلى أين تذهب؟ (للصديق)
    register: informal
  - text: Panjenengan arep tindak menyang ngendi?
    breakdown: panjenengan (krama inggil) · arep · tindak = pergi (krama inggil) · menyang · ngendi (ngoko alus)
    en: Where are you going? (to an older brother or close senior)
    ar_eg: حضرتك رايح فين؟ (لأخوك الكبير أو حد أكبر قريب منك)
    ar: إلى أين تذهب؟ (للأخ الأكبر أو القريب الأكبر)
    register: neutral
  - text: Sampeyan badhe kesah dhateng pundi?
    breakdown: sampeyan · badhe · kesah = pergi (krama) · dhateng = ke · pundi = mana (krama lugu)
    en: Where are you going? (polite, everyday)
    ar_eg: حضرتك رايح على فين؟ (أدب عادي)
    ar: إلى أين تذهب؟ (بأدب عادي)
    register: formal
  - text: Panjenengan badhe tindak dhateng pundi?
    breakdown: panjenengan · badhe · tindak (krama inggil) · dhateng · pundi (krama alus)
    en: Where are you going, sir / ma'am? (to an elder)
    ar_eg: سيادتك رايح فين؟ (لحد كبير)
    ar: إلى أين تتوجّهون؟ (للكبير)
    register: formal
  - text: Mas, sampeyan wis dhahar?
    breakdown: Mas · sampeyan · wis = sudah (ngoko) · dhahar = makan (krama inggil)
    en: Have you eaten, bro? (to an older friend, ngoko alus)
    ar_eg: أكلت يا أبو الشباب؟ (لصاحبك الأكبر، بأدب خفيف)
    ar: هل أكلتَ يا أخي؟ (للصديق الأكبر)
    register: neutral
  - text: Aku wis mangan. Mbak wis dhahar durung?
    breakdown: aku wis mangan (plain, about yourself) · Mbak · wis dhahar durung = sudah makan belum (krama inggil for her)
    en: I've eaten. Have you eaten yet? (to an older sister)
    ar_eg: أنا أكلت. وإنتي أكلتي ولا لسه؟ (لأختك الكبيرة)
    ar: أنا أكلتُ، وأنتِ هل أكلتِ؟ (للأخت الكبرى)
    register: neutral
mistakes:
  - wrong: Mas wis dhahar? — Iya, aku wis dhahar.
    right: Mas wis dhahar? — Iya, aku wis mangan.
    why:
      ar_eg: حتى في ngoko alus، krama inggil للتاني بس. عن نفسك mangan.
      ar: حتى في ngoko alus تبقى krama inggil للآخر، وعن نفسك mangan.
      en: Even in ngoko alus, krama inggil is for the other person; about yourself it's mangan.
  - wrong: Panjenengan arep lunga menyang ngendi?
    right: Panjenengan arep tindak menyang ngendi?
    why:
      ar_eg: لو رفعت الضمير لـ panjenengan، لازم فعله كمان يترفع (tindak). panjenengan مع lunga بيبان ناقص.
      ar: إذا رفعت الضمير وجب رفع فعله أيضًا (tindak).
      en: If you raise the pronoun to panjenengan, raise their verb too (tindak).
  - wrong: Kowe sampun dhahar?
    right: Kowe wis mangan? / Panjenengan sampun dhahar?
    why:
      ar_eg: "kowe نغوكو سادة؛ مايتجمعش مع sampun وdhahar. اختار: يا كله نغوكو، يا كراما كاملة."
      ar: kowe نغوكو خالصة فلا تجتمع مع sampun وdhahar.
      en: kowe is plain ngoko and clashes with sampun and dhahar; pick one consistent level.
arabic_bridge:
  ar_eg: "ngoko alus زي إنك تقول لأخوك الكبير «إنت فين يا حضرة؟» — كلام بيتي بس فيه احترام. وkrama alus زي ما تكلم مدير بفصحى مهذبة. الفرق إن الجاوي عنده قواعد واضحة لكل خلطة."
  ar: "ngoko alus كأن تخاطب أخاك الأكبر بالعامية مع «حضرتك»، وkrama alus كخطاب المدير بفصحى مهذبة؛ وللجاوية قواعد واضحة لكل مزيج."
  en: "ngoko alus is like chatting to your older brother in everyday Arabic but with «حضرتك»; krama alus is like addressing a director in polished Arabic. Javanese simply has clear rules for each blend."
tags: [speech-level, ngoko-alus, krama-alus, politeness, j4]
prerequisites: [jv.speechlevel.overview, jv.krama-inggil.verbs, jv.krama-inggil.nouns]
see_also: [jv.krama-andhap, jv.pronoun.krama, jv.pronoun.ngoko, jv.address.terms]
review:
  status: draft
  verified: false
  notes: >-
    Draft by Claude; awaits review by a Javanese speaker. Please check the four-way labels (ngoko lugu / ngoko alus / krama lugu / krama alus),
    whether "Panjenengan arep tindak menyang ngendi?" and "Mas, sampeyan wis dhahar?" sound natural as ngoko alus (the second is the
    curriculum's lesson title), and the claim about who typically receives ngoko alus. The madya level (samang, dika, niki, pun) is
    deliberately not taught here.
