cues:
  - match: "menapa|napa|sinten|pundi|pinten|pripun"
    note:
      ar_eg: "سؤال بالكراما: menapa إيه، sinten مين، pundi فين، pinten كام، pripun إزاي."
      ar: "سؤال بالكراما: menapa ماذا، sinten مَن، pundi أين، pinten كم، pripun كيف."
      en: "Krama question: menapa what, sinten who, pundi where, pinten how much, pripun how."
