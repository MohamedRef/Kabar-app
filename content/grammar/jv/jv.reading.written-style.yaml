review:
  status: draft
  verified: false
  notes: >-
    Draft by Claude; awaits review by a Javanese speaker. Please check iku as a defining copula, kalebu, sawijining, minangka,
    kanthi, -ira as archaic possessive, the gloss of "sumilir" and the translation of the "Lir-ilir" opening line, and
    "kaanggit" (ka- passive). "Basa Jawa kalebu basa kang akeh penuture" is a Claude-made sentence; check it reads naturally.
