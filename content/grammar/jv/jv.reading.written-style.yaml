schema: kabar.grammar/v1
id: jv.reading.written-style
language: jv
level: j5
title:
  target: ing · saka · dening · iku · kang · yaiku · minangka · kanthi (basa tulis)
  en: Written Javanese — the connectors of articles and old songs
  ar_eg: الجاوي المكتوب — كلمات الربط بتاعة المقالات والأغاني القديمة
  ar: الجاوية المكتوبة — أدوات الربط في المقالات والأغاني القديمة
summary:
  ar_eg: "ويكيبيديا والجرايد بيكتبوا نغوكو، بس نغوكو «رسمي» بكلمات ربط غير الكلام: ing بدل neng، kang بدل sing، dening = بواسطة، iku = هو (بيعرّف)، yaiku = يعني / ألا وهو، minangka = بصفته، kanthi = بـ. وفي الأغاني القديمة كلمات زي wus = wis."
  ar: "تكتب ويكيبيديا والصحف بنغوكو رسمية ذات أدوات ربط غير محكية: ing بدل neng، وkang بدل sing، وdening = من قِبَل، وiku للتعريف، وyaiku = أي، وminangka = بوصفه، وkanthi = بـ. وفي الشعر القديم ألفاظ مثل wus = wis."
  en: "Wikipedia and newspapers write ngoko, but a formal ngoko with connectors you rarely hear in chat: ing for neng, kang for sing, dening = by, iku = is (defining), yaiku = namely, minangka = as, kanthi = with / by means of. Old songs add forms like wus = wis."
pattern:
  - "definition: X iku Y (X adalah Y) · X yaiku Y (X yaitu Y)"
  - "place: ing (= di, neng, nang) · ana ing (terletak di) · saka (= dari)"
  - "relative: kang (= sing, yang) · krama / formal ingkang"
  - "agent of a passive: dening (= oleh)"
  - "manner and role: kanthi (= dengan, secara) · minangka (= sebagai) · kalebu (= termasuk)"
  - "a / one of: sawijining (= salah satu, sebuah) · kanggo (= untuk)"
  - "spoken ↔ written: neng / nang → ing · sing → kang · karo → lan, kaliyan (krama) · terus → banjur"
  - "old / poetic: wus (= wis) · kang · ing · -ira (his / her, archaic)"
explanation:
  ar_eg: |
    لما تفتح مقالة على ويكيبيديا الجاوية هتلاقيها نغوكو — مش كراما — بس نغوكو «لابس بدلة». نفس اللي بيحصل بين المصري والفصحى، بس على نطاق أصغر: كلمات الربط هي اللي بتتغير.
    - iku: في الكلام = «ده / دي»، في الكتابة كمان بتعرّف: «Semarang iku ibukutha Provinsi Jawa Tengah» = سيمارانج هي عاصمة جاوة الوسطى. (زي adalah الإندونيسي.)
    - yaiku = ألا وهو / يعني (yaitu): بيشرح أو بيعدّد.
    - ing = في (بدل neng / nang اللي في الكلام). ana ing = موجود في.
    - kang = اللي (بدل sing). وفي الكراما المكتوبة ingkang.
    - dening = بواسطة / من قِبَل (oleh) — بتيجي بعد المبني للمجهول: «dibangun dening …».
    - kanthi = بـ / بطريقة (dengan): «kanthi becik» = بشكل كويس.
    - minangka = بصفته / كـ (sebagai). kalebu = من ضمن (termasuk). sawijining = واحد من / إحدى (salah satu).
    وفي الأغاني والشعر القديم (زي «Lir-ilir» اللي بيتنسب لسونان كاليجاغا) هتلاقي كلمات قديمة: wus = wis، و-ira = بتاعه. متخافش منها: هي قليلة وبتتكرر.
    نصيحة: لما تقرا، دوّر الأول على iku / yaiku (تعريف)، وdening (مين عمل)، وkang (وصف). دول الهيكل العظمي للجملة المكتوبة.
  ar: |
    تُكتب ويكيبيديا الجاوية بالنغوكو لا بالكراما، لكنها نغوكو رسمية تتغير فيها أدوات الربط، كما تختلف الفصحى عن العامية في أدواتها:
    - iku: للإشارة، وفي الكتابة للتعريف كـ adalah: «Semarang iku ibukutha Provinsi Jawa Tengah».
    - yaiku = أي / ألا وهو (yaitu).
    - ing = في (بدل neng / nang المحكية)، وana ing = يقع في.
    - kang = الذي (بدل sing)، وفي الكراما المكتوبة ingkang.
    - dening = من قِبَل (oleh) بعد المبني للمجهول.
    - kanthi = بـ / على نحو (dengan)، وminangka = بوصفه (sebagai)، وkalebu = من ضمن، وsawijining = أحد.
    وفي الشعر القديم كأغنية «Lir-ilir» المنسوبة إلى سونان كاليجاغا ألفاظ عتيقة: wus = wis، و-ira = ـه.
    ونصيحة القراءة: ابحث أولًا عن iku / yaiku (التعريف) وdening (الفاعل) وkang (الصفة).
  en: |
    Open an article on Javanese Wikipedia and you'll find ngoko — not krama — but ngoko "in a suit". It's like Egyptian vs MSA on a small scale: mostly the connectors change.
    - iku: "that" in speech; in writing it also defines: "Semarang iku ibukutha Provinsi Jawa Tengah" = Semarang is the capital of Central Java (like Indonesian adalah).
    - yaiku = namely (yaitu): explains or lists.
    - ing = in / at (instead of spoken neng / nang). ana ing = located in.
    - kang = which / who (instead of sing). Written krama: ingkang.
    - dening = by (oleh), after a passive: "dibangun dening …".
    - kanthi = with, in a … way (dengan): "kanthi becik" = well.
    - minangka = as (sebagai). kalebu = including / counted among (termasuk). sawijining = one of, a certain (salah satu).
    Songs and old verse (like "Lir-ilir", attributed to Sunan Kalijaga) add archaic words: wus = wis, -ira = his / her. Don't worry: there are few of them and they repeat.
    Reading tip: find iku / yaiku (definition), dening (who did it) and kang (description) first. They're the skeleton of a written sentence.
examples:
  - text: Semarang iku ibukutha Provinsi Jawa Tengah.
    breakdown: Semarang · iku = adalah · ibukutha = ibu kota · Provinsi Jawa Tengah
    en: Semarang is the capital of Central Java Province.
    ar_eg: سيمارانج هي عاصمة محافظة جاوة الوسطى.
    ar: سيمارانج هي عاصمة إقليم جاوة الوسطى.
    register: formal
  - text: Kutha iki ana ing pesisir lor pulo Jawa.
    breakdown: kutha = kota · iki = ini · ana ing = terletak di · pesisir = pantai · lor = utara · pulo Jawa
    en: This city lies on the north coast of Java.
    ar_eg: المدينة دي على الساحل الشمالي لجزيرة جاوة.
    ar: تقع هذه المدينة على الساحل الشمالي لجزيرة جاوة.
    register: formal
  - text: Basa Jawa kalebu basa kang akeh penuture.
    breakdown: basa Jawa · kalebu = termasuk · basa · kang = yang · akeh = banyak · penutur + -e = penuturnya
    en: Javanese is among the languages with many speakers.
    ar_eg: الجاوي من اللغات اللي ليها متكلمين كتير.
    ar: الجاوية من اللغات الكثيرة المتكلمين.
    register: formal
  - text: Tembang iki kaanggit dening Sunan Kalijaga, miturut crita.
    breakdown: tembang = lagu · iki · kaanggit = dikarang (formal passive) · dening = oleh · miturut crita = menurut cerita
    en: According to tradition, this song was composed by Sunan Kalijaga.
    ar_eg: بيقولوا إن الأغنية دي ألّفها سونان كاليجاغا.
    ar: تقول الرواية إن هذه الأغنية من تأليف سونان كاليجاغا.
    register: formal
  - text: Lir-ilir, lir-ilir, tandure wus sumilir.
    breakdown: lir-ilir (bangunlah — poetic call) · tandur + -e = tanamannya · wus = wis (sudah, archaic) · sumilir (bergoyang ditiup angin / mulai tumbuh)
    en: Wake up, wake up — the young plants are already stirring. (opening of the song "Lir-ilir")
    ar_eg: اصحى، اصحى، الزرع ابتدا يتمايل. (أول أغنية «Lir-ilir»)
    ar: انهض، انهض، فقد أخذ الزرع يتمايل. (مطلع أغنية «Lir-ilir»)
    register: formal
mistakes:
  - wrong: Reading "iku" in "Semarang iku ibukutha …" as "that Semarang".
    right: Here iku links subject and definition — "Semarang is the capital …".
    why:
      ar_eg: في الكتابة iku بعد الاسم وقبل التعريف معناها «هو / هي» (adalah)، مش «اللي هناك».
      ar: iku في الكتابة بين المبتدأ والتعريف بمعنى «هو» (adalah).
      en: In writing, iku between a subject and its definition works like adalah.
  - wrong: Writing an article with neng and sing ("Kutha iki neng pesisir …").
    right: Kutha iki ana ing pesisir … · … kang akeh penuture.
    why:
      ar_eg: neng وsing كلام يومي. في المقالة اكتب ing وkang.
      ar: neng وsing محكيتان، والمقالة تستعمل ing وkang.
      en: neng and sing are spoken; articles use ing and kang.
  - wrong: Thinking written Wikipedia Javanese is krama because it sounds formal.
    right: It's formal ngoko — iku, kang, ing, dening — not krama (menika, ingkang, wonten).
    why:
      ar_eg: الرسمية هنا في الأسلوب مش في المستوى. الضمير والكلمات الأساسية نغوكو.
      ar: الرسمية في الأسلوب لا في مستوى الكلام، فالمفردات الأساسية نغوكو.
      en: The formality is in style, not speech level; the core words are ngoko.
arabic_bridge:
  ar_eg: "زي الفرق بين «ده» في الكلام و«هو / هي» في المقالة: iku في الكتابة بتلعب دور «هي» في «القاهرة هي عاصمة مصر». وdening = «من قِبَل»، وkang = «الذي»."
  ar: "iku في الكتابة كضمير الفصل في «القاهرة هي عاصمة مصر»، وdening = «من قِبَل»، وkang = «الذي»."
  en: "Written iku works like the «هي» in «القاهرة هي عاصمة مصر»; dening ≈ «من قِبَل»; kang ≈ «الذي»."
tags: [reading, written-style, connector, wikipedia, song, j5]
