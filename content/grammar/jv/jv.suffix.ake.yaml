schema: kabar.grammar/v1
id: jv.suffix.ake
language: jv
level: j1
title:
  target: -ake / -kake (colloquial -ke) · diculke, tukokke, jupukke, terke
  en: "The suffix -ake / -ke (Indonesian -kan)"
  ar_eg: "اللاحقة -ake / -ke (زي -kan في الإندونيسي)"
  ar: "اللاحقة -ake / -ke (مقابل -kan الإندونيسية)"
summary:
  ar_eg: "-ake (وفي الكلام -ke) هي -kan الإندونيسية: بتعمل الحاجة «لحد» (tukokke = belikan، هشتريهالك) أو «تخلّي حاجة تحصل» (diculke = dilepaskan، اتساب / اتباع)."
  ar: "-ake (وفي الكلام -ke) تقابل -kan الإندونيسية: للفعل لأجل شخص (tukokke = belikan) أو للتعدية والتسبيب (diculke = dilepaskan)."
  en: "-ake (spoken -ke) is Indonesian -kan: doing something for someone (tukokke = belikan) or making something happen (diculke = dilepaskan, let go / sold off)."
pattern:
  - "base ending in a consonant + -ake: jupuk → jupukake (ambilkan)"
  - "base ending in a vowel + -kake: gawe → gawekake (buatkan) · tuku → tukokake (belikan)"
  - "colloquial / chat: -ke · jupukke, gawekke, tukokke, culke, terke"
  - "di- / tak- + base + -ake / -ke: diculke (dilepaskan) · tak tukokke (kubelikan)"
  - "commands use -na (Arek -no): tukokna / tukokno — see J2"
explanation:
  ar_eg: |
    إنت عارف -kan من الإندونيسي (belikan، ambilkan، lepaskan). الجاوي عنده -ake، وفي الكلام والشات بتتختصر لـ -ke:
    1. «لحد تاني» (benefactive): jupuk = ياخد → jupukake / jupukke = يجيب لحد (ambilkan). tuku = يشتري → tukokake / tukokke = يشتري لحد (belikan). Tak tukokke kopi = هشتريلك قهوة.
    2. «يخلّي الحاجة تحصل» (causative): ucul = يتفك / يفلت → diuculke، وفي الكلام diculke = يتساب (dilepaskan). وفي سوق الحاجات المستعملة «diculke» = يتباع (زي «dilepas» في الإندونيسي).
       فرسالة «arp dicul piro» = arep diculke pira = ناوي «تسيبه» (تبيعه) بكام؟
    3. ater → terke (يوصّل حد): Tak terke = هوصّلك.
    الشكل: لو الكلمة آخرها ساكن: -ake (jupukake). لو آخرها حرف متحرك: -kake (gawekake)، وtuku بتبقى tukokake. وفي الكلام كله بيبقى -ke.
    ومع di- وtak- الفعل بيرجع لأصله: diculke، ditukokke، tak jupukke.
    وفي سورابايا هتسمع الأمر بـ -no: Tukokno! = اشتري لي! (هنتعلم الأمر في J2).
  ar: |
    تعرف -kan من الإندونيسية (belikan، ambilkan، lepaskan)، ونظيرها الجاوي -ake، ويُختصر في الكلام والدردشة إلى -ke:
    1. الفعل لأجل غيرك: jupuk = يأخذ → jupukake / jupukke = يُحضر لغيره (ambilkan)، tuku = يشتري → tukokake / tukokke = يشتري لغيره (belikan).
    2. التعدية والتسبيب: ucul = ينفلت → diuculke، وفي الكلام diculke = يُطلق / يُترك (dilepaskan)، وفي سوق المستعمل بمعنى «يُباع».
       فـ «arp dicul piro» = arep diculke pira = بكم ستبيعه؟
    3. ater → terke = يوصل أحدًا: Tak terke = سأوصلك.
    والصيغة: بعد الساكن -ake (jupukake)، وبعد الصائت -kake (gawekake)، وtuku → tukokake، وفي الكلام -ke في الجميع.
    ومع di- وtak- يعود الفعل إلى جذره: diculke، tak jupukke. وصيغة الأمر في سورابايا بـ -no (Tukokno!) وتُدرس في J2.
  en: |
    You know -kan from Indonesian (belikan, ambilkan, lepaskan). Javanese has -ake, shortened to -ke in speech and chats:
    1. Doing it for someone (benefactive): jupuk = take → jupukake / jupukke = fetch for someone (ambilkan). tuku = buy → tukokake / tukokke = buy for someone (belikan). Tak tukokke kopi = I'll buy you a coffee.
    2. Making it happen (causative): ucul = come loose → diuculke, spoken diculke = released, let go (dilepaskan). In second-hand trading diculke means "sold off" (like Indonesian "dilepas").
       So "arp dicul piro" = arep diculke pira = How much are you letting it go for?
    3. ater → terke (take someone somewhere): Tak terke = I'll take you.
    Shape: after a consonant -ake (jupukake); after a vowel -kake (gawekake), with tuku → tukokake. In speech it's all -ke.
    With di- and tak- the verb stays in its base: diculke, ditukokke, tak jupukke.
    Surabaya commands use -no: Tukokno! = Buy it (for me)! (Commands come in J2.)
examples:
  - text: arp dicul piro
    breakdown: arp = arep (mau) · dicul = di + ucul + -ke (dilepaskan / dijual) · piro = pira (berapa)
    en: How much will you sell it for? (chat)
    ar_eg: ناوي تبيعه بكام؟
    ar: بكم ستبيعه؟
    register: chat
  - text: HP-ne arep diculke pira, Mas?
    breakdown: HP + -ne = HP-nya · arep = mau · di + ucul + -ke = dilepaskan · pira = berapa
    en: How much will you sell the phone for?
    ar_eg: ناوي تبيع الموبايل بكام يا أستاذ؟
    ar: بكم ستبيع الهاتف يا أخي؟
    register: informal
  - text: Tak tukokke kopi, ya.
    breakdown: tak = ku- · tuku + -ke = belikan · kopi · ya
    en: I'll buy you a coffee, OK?
    ar_eg: هجيبلك قهوة، ماشي؟
    ar: سأشتري لك قهوة، حسنًا؟
    register: informal
  - text: Sek, tak jupukke.
    breakdown: sek = tunggu · tak = ku- · jupuk + -ke = ambilkan
    en: Hold on, I'll get it for you.
    ar_eg: استنى، هجيبهولك.
    ar: انتظر، سأحضره لك.
    register: informal
  - text: Ayo, tak terke mulih.
    breakdown: ayo · tak = ku- · terke = antarkan · mulih = pulang
    en: Come on, I'll take you home.
    ar_eg: يلا، هوصّلك البيت.
    ar: هيا، سأوصلك إلى البيت.
    register: informal
mistakes:
  - wrong: arp dicul piro = "How much was it stolen for?"
    right: arp dicul piro = "How much will you let it go (sell it) for?"
    why:
      ar_eg: diculke من ucul (يتفك / يتساب). في البيع والشرا معناها «يتباع»، زي dilepas في الإندونيسي.
      ar: diculke من ucul (انفلت)، ومعناها في البيع «يُترك للمشتري» أي يُباع.
      en: diculke comes from ucul (come loose); in trading it means "let go", i.e. sell, like Indonesian dilepas.
  - wrong: Tak tukuke kopi.
    right: Tak tukokke kopi. / Tak tukokake kopi.
    why:
      ar_eg: tuku + -ake = tukokake (بتدخل k وu بتبقى o)، وفي الكلام tukokke.
      ar: tuku مع -ake تصير tukokake، وفي الكلام tukokke.
      en: tuku + -ake becomes tukokake (spoken tukokke), not tukuke.
arabic_bridge:
  ar_eg: "-ake شبه وزن «فعّل / أفعل» في العربي: «نزل» → «نزّل»، «دخل» → «دخّل». بيخلي حد يعمل الحاجة أو يعملها لحد."
  ar: "تشبه -ake صيغتي «فعّل» و«أفعل» في التعدية: نزل → نزّل، دخل → أدخل."
  en: "-ake works like Arabic Form II / IV (نزل → نزّل): it makes a verb causative or 'for someone'."
tags: [suffix, verb, causative, benefactive, chat, j1]
prerequisites: [jv.proclitic.tak-kok-di]
see_also: [jv.suffix.i, jv.imperative.ngoko, jv.krama.affixes, jv.chat.normalize]
