schema: kabar.grammar/v1
id: jv.question.words
language: jv
level: j1
title:
  target: apa, sapa, ngendi, kapan, piye, pira, ngapa
  en: Question words (ngoko)
  ar_eg: أدوات السؤال في النغوكو
  ar: أدوات الاستفهام في النغوكو
summary:
  ar_eg: "apa = إيه، sapa = مين، ngendi = فين، kapan = إمتى، piye = إزاي، pira = كام/بكام، ngapa = ليه. وغالبًا بتيجي في آخر الجملة، زي المصري بالظبط."
  ar: "apa = ماذا، sapa = من، ngendi = أين، kapan = متى، piye = كيف، pira = كم، ngapa = لماذا، وكثيرًا ما تأتي آخر الجملة."
  en: "apa = what, sapa = who, ngendi = where, kapan = when, piye = how, pira = how much / many, ngapa = why. They often come at the end, as in Egyptian Arabic."
pattern:
  - "apa (apa) · sapa (siapa) · ngendi / endi (mana) · kapan (kapan)"
  - "piye (bagaimana) · pira (berapa) · ngapa (kenapa / ngapain)"
  - "neng ngendi (ke mana / di mana) · saka ngendi (dari mana) · sing endi (yang mana)"
  - "spoken / chat: opo, sopo, ndi, piro (= apa, sapa, endi, pira)"
  - "topic + question word: Jenengmu sapa? · Regane pira?"
explanation:
  ar_eg: |
    الأدوات دي أول حاجة لازم تعرفها، وكل واحدة ليها مقابل إندونيسي:
    - apa = apa (إيه). نفس الكلمة! بس بتتنطق «opo»، وفي الشات بتتكتب opo.
    - sapa = siapa (مين). في الشات sopo.
    - ngendi / endi = mana (فين). neng ngendi = على فين / فين، saka ngendi = منين، sing endi = أنهي واحد.
    - kapan = kapan (إمتى). زي الإندونيسي.
    - piye = bagaimana (إزاي). Piye kabare? = إزيك؟
    - pira = berapa (كام / بكام). في الشات piro. Regane pira? = بكام؟
    - ngapa = kenapa / ngapain (ليه / بتعمل إيه).
    ليه «a» بتبقى «o»؟ الجاوي بينطق الـ a في آخر الكلمة (لو المقطع مفتوح) زي o، فالكتابة الرسمية apa والنطق والشات opo.
    في سورابايا هتسمع yok opo بدل piye وlapo بدل ngapa؛ افهمهم، بس في يوجيا وماديون قول piye وngapa.
    الترتيب: الجاوي بيحب يحط أداة السؤال في الآخر: Omahmu ngendi? = بيتك فين؟ زي المصري «بيتك فين؟» مش زي الفصحى «أين بيتك؟».
  ar: |
    أدوات الاستفهام ومقابلها الإندونيسي:
    - apa = apa (ماذا)، وتُنطق «opo» وتُكتب كذلك في الدردشة.
    - sapa = siapa (من)، وفي الدردشة sopo.
    - ngendi / endi = mana (أين)، وneng ngendi = إلى أين / أين، وsaka ngendi = من أين، وsing endi = أيّها.
    - kapan = kapan (متى).
    - piye = bagaimana (كيف): Piye kabare? = كيف حالك؟
    - pira = berapa (كم / بكم)، وفي الدردشة piro.
    - ngapa = kenapa (لماذا) أو ngapain (ماذا تفعل).
    وتُنطق a في آخر الكلمة إذا كان المقطع مفتوحًا قريبة من o، فالكتابة القياسية apa والنطق والدردشة opo.
    وفي سورابايا يقال yok opo بمعنى piye وlapo بمعنى ngapa، فاعرفهما سماعًا.
    والغالب أن تأتي الأداة في آخر الجملة: Omahmu ngendi? = بيتك فين؟ كما في العامية المصرية.
  en: |
    The first words to learn, each with its Indonesian twin:
    - apa = apa (what). Same word, but said "opo" and often written opo in chats.
    - sapa = siapa (who); chat sopo.
    - ngendi / endi = mana (where). neng ngendi = where to / where at, saka ngendi = where from, sing endi = which one.
    - kapan = kapan (when) — identical.
    - piye = bagaimana (how). Piye kabare? = How are you?
    - pira = berapa (how much / many); chat piro. Regane pira? = How much is it?
    - ngapa = kenapa / ngapain (why / what are you doing).
    Why "o"? Javanese pronounces a final open-syllable a like o, so the standard spelling is apa but people say and type opo.
    In Surabaya you'll hear yok opo for piye and lapo for ngapa; understand them, but in Jogja and Madiun say piye and ngapa.
    Order: the question word likes the end of the sentence: Omahmu ngendi? = Your house is where? — just like Egyptian «بيتك فين؟».
examples:
  - text: Jenengmu sapa?
    breakdown: jeneng = nama · -mu = -mu · sapa = siapa
    en: What's your name? (literally "your name who?")
    ar_eg: اسمك إيه؟
    ar: ما اسمك؟
    register: informal
  - text: Kowe saka ngendi?
    breakdown: kowe = kamu · saka = dari · ngendi = mana
    en: Where are you from?
    ar_eg: إنت منين؟
    ar: من أين أنت؟
    register: informal
  - text: Piye kabare?
    breakdown: piye = bagaimana · kabar + -e = kabarnya
    en: How are you?
    ar_eg: إزيك؟ / أخبارك إيه؟
    ar: كيف حالك؟
    register: informal
  - text: Regane pira?
    breakdown: rega = harga · -ne = -nya · pira = berapa
    en: How much is it?
    ar_eg: بكام؟
    ar: بكم ثمنه؟
    register: informal
  - text: Piye kabare, cah?
    breakdown: piye = bagaimana · kabare = kabarnya · cah = guys
    en: How's it going, guys?
    ar_eg: أخباركم إيه يا جدعان؟
    ar: كيف حالكم يا جماعة؟
    register: informal
  - text: Kowe ngapa?
    breakdown: kowe = kamu · ngapa = kenapa / ngapain
    en: What's up with you? / What are you doing?
    ar_eg: مالك؟ / بتعمل إيه؟
    ar: ما بك؟ / ماذا تفعل؟
    register: informal
mistakes:
  - wrong: Kowe saka endi apa?
    right: Kowe saka ngendi?
    why:
      ar_eg: ngendi لوحدها معناها «فين»، مش محتاجة apa. «saka ngendi» = منين.
      ar: ngendi تكفي للسؤال عن المكان، وsaka ngendi = من أين.
      en: ngendi already means "where"; saka ngendi = where from.
  - wrong: Pira jenengmu?
    right: Jenengmu sapa?
    why:
      ar_eg: pira للأرقام والأسعار بس. الاسم بنسأل عنه بـ sapa (حرفيًا «اسمك مين؟») زي الإندونيسي «Namamu siapa?».
      ar: pira للعدد والثمن، والسؤال عن الاسم بـ sapa كما في الإندونيسية Namamu siapa.
      en: pira is for numbers and prices; names take sapa, as in Indonesian "Namamu siapa?".
arabic_bridge:
  ar_eg: "الجاوي بيحط أداة السؤال في الآخر زي المصري: Omahmu ngendi? = بيتك فين؟، Regane pira? = ده بكام؟. وkabar في Piye kabare? جاية من «خبر»."
  ar: "تأتي أداة الاستفهام في آخر الجملة كما في العامية: «بيتك فين؟»، و«kabar» من العربية «خبر»."
  en: "Javanese puts the question word last, like Egyptian «بيتك فين؟». And kabar (Piye kabare?) is Arabic خبر."
tags: [question, ngoko, j1]
prerequisites: [id.question.apa, id.question.siapa, id.question.mana]
see_also: [jv.sentence.basic, jv.krama.questions, jv.chat.normalize]
cues:
  - match: "apa|opo"
    note:
      ar_eg: "apa = إيه؟ / هل."
      ar: "apa = ماذا؟ / هل."
      en: "apa = what? / is it…?"
  - match: "sapa|sopo"
    note:
      ar_eg: "sapa = مين؟"
      ar: "sapa = مَن؟"
      en: "sapa = who?"
  - match: "ngendi|endi"
    note:
      ar_eg: "ngendi = فين؟"
      ar: "ngendi = أين؟"
      en: "ngendi = where?"
  - match: "kapan"
    note:
      ar_eg: "kapan = إمتى؟"
      ar: "kapan = متى؟"
      en: "kapan = when?"
  - match: "piye|pripun"
    note:
      ar_eg: "piye = إزاي؟ / إيه رأيك؟"
      ar: "piye = كيف؟"
      en: "piye = how? / what do you think?"
  - match: "pira|piro"
    note:
      ar_eg: "pira = كام؟"
      ar: "pira = كم؟"
      en: "pira = how many / how much?"
  - match: "ngapa|ngopo|kenapa"
    note:
      ar_eg: "ngapa = ليه؟ / بتعمل إيه؟"
      ar: "ngapa = لماذا؟"
      en: "ngapa = why? / doing what?"
