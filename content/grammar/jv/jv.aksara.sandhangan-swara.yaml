schema: kabar.grammar/v1
id: jv.aksara.sandhangan-swara
language: jv
level: j6
title:
  target: ꦶ wulu · ꦸ suku · ꦺ taling · ꦼ pepet · ꦺ…ꦴ taling tarung (sandhangan swara)
  en: Vowel marks — turning ka into ki, ku, ke, kê and ko
  ar_eg: علامات الحركات — إزاي ka تبقى ki وku وke وkê وko
  ar: علامات الحركات — تحويل ka إلى ki وku وke وkê وko
summary:
  ar_eg: "عشان تغيّر الـ a الجاهزة، بتحط علامة زي التشكيل العربي: wulu ꦶ فوق = i، suku ꦸ تحت = u، taling ꦺ قبل الحرف = é / è، pepet ꦼ فوق = ê، وtaling tarung (ꦺ قبل + ꦴ بعد) = o. مثال: ꦏ ka → ꦏꦶ ki، ꦏꦸ ku، ꦏꦺ ke، ꦏꦼ kê، ꦏꦺꦴ ko."
  ar: "لتغيير الصائت المضمَّن تُضاف علامات كالتشكيل: wulu ꦶ فوق = i، وsuku ꦸ تحت = u، وtaling ꦺ قبل الحرف = é / è، وpepet ꦼ فوق = ê، وtaling tarung (ꦺ قبل وꦴ بعد) = o: ꦏ → ꦏꦶ، ꦏꦸ، ꦏꦺ، ꦏꦼ، ꦏꦺꦴ."
  en: "To change the built-in a, add a mark, like Arabic harakat: wulu ꦶ above = i, suku ꦸ below = u, taling ꦺ before the letter = é / è, pepet ꦼ above = ê, and taling tarung (ꦺ before + ꦴ after) = o. So ꦏ ka → ꦏꦶ ki, ꦏꦸ ku, ꦏꦺ ke, ꦏꦼ kê, ꦏꦺꦴ ko."
pattern:
  - "a (no mark): ꦏ ka"
  - "i — wulu, a small circle above: ꦏꦶ ki"
  - "u — suku, a hook below: ꦏꦸ ku"
  - "é / è — taling, written BEFORE the letter: ꦏꦺ ke"
  - "ê (pepet, schwa) — pepet, above: ꦏꦼ kê"
  - "o — taling tarung, taling before + tarung after: ꦏꦺꦴ ko"
  - "typing: always the letter first, then the mark (the font moves taling to the left)"
  - "special letters: rê is ꦉ (pa cêrêk), lê is ꦊ (nga lêlêt) — not ꦫ / ꦭ + pepet"
explanation:
  ar_eg: |
    في الدرس اللي فات كل حرف كان فيه a. دلوقتي هنغيّر الحركة بعلامات اسمها sandhangan swara (علامات الحركات). الفكرة نفسها بتاعة التشكيل العربي، بس فيه مفاجآت:
    - wulu ꦶ: دايرة صغيرة فوق الحرف = i. ꦱꦶꦗꦶ = siji (واحد).
    - suku ꦸ: خطّاف تحت الحرف = u. ꦧꦸꦏꦸ = buku (كتاب).
    - taling ꦺ: بتتكتب قبل الحرف (على شماله) = é أو è. ꦒꦼꦝꦺ = gedhe (كبير): آخر حرف ꦝ وقبله taling.
    - pepet ꦼ: فوق الحرف = ê (الحركة الخفيفة ə). ꦠꦼꦭꦸ = telu (تلاتة)، ꦱꦼꦒ = sega (رز).
    - taling tarung: taling قبل الحرف + tarung ꦴ بعده، الاتنين مع بعض = o. ꦏꦺꦴꦮꦺ = kowe (إنت).
    المفاجأة للعربي: عندنا الكسرة (i) تحت والضمة (u) فوق. في الجاوي بالعكس: i فوق (wulu) وu تحت (suku)! خلي بالك.
    وعلى الكمبيوتر / التابلت: بتكتب الحرف الأول وبعدين العلامة، حتى لو العلامة بتظهر قبله (زي taling). الخط بيحطها مكانها لوحده.
    حاجة صغيرة: لو عايز تكتب rê (زي في كلمات فيها «رِ» خفيفة) أو lê، الجاوي عنده حرفين مخصوصين: ꦉ (pa cêrêk) = rê، وꦊ (nga lêlêt) = lê. مش ꦫ أو ꦭ + pepet.
    وتذكّر: é وè بيتكتبوا نفس العلامة (taling)؛ الفرق في النطق بس.
  ar: |
    تُغيَّر a المضمَّنة بعلامات تسمى sandhangan swara، وفكرتها فكرة التشكيل:
    - wulu ꦶ: دائرة صغيرة فوق الحرف = i: ꦱꦶꦗꦶ = siji.
    - suku ꦸ: خطّاف تحته = u: ꦧꦸꦏꦸ = buku.
    - taling ꦺ: تُكتب قبل الحرف = é / è: ꦒꦼꦝꦺ = gedhe.
    - pepet ꦼ: فوقه = ê (صائت مختلس): ꦠꦼꦭꦸ = telu، ꦱꦼꦒ = sega.
    - taling tarung: taling قبل الحرف وtarung ꦴ بعده = o: ꦏꦺꦴꦮꦺ = kowe.
    والمفارقة للعربي: الكسرة تحت والضمة فوق، أما هنا فـ i فوق وu تحت.
    وعند الطباعة يُكتب الحرف أولًا ثم العلامة ولو ظهرت قبله.
    ولـ rê ولـ lê حرفان خاصان: ꦉ (pa cêrêk) وꦊ (nga lêlêt)، لا ꦫ أو ꦭ مع pepet.
  en: |
    Last unit every letter had a. Now we change the vowel with marks called sandhangan swara (vowel marks). Same idea as Arabic harakat, with surprises:
    - wulu ꦶ: a small circle above = i. ꦱꦶꦗꦶ = siji (one).
    - suku ꦸ: a hook below = u. ꦧꦸꦏꦸ = buku (book).
    - taling ꦺ: written BEFORE the letter (to its left) = é or è. ꦒꦼꦝꦺ = gedhe (big): the last letter is ꦝ, with taling in front of it.
    - pepet ꦼ: above = ê (the light schwa ə). ꦠꦼꦭꦸ = telu (three), ꦱꦼꦒ = sega (rice).
    - taling tarung: taling before + tarung ꦴ after, together = o. ꦏꦺꦴꦮꦺ = kowe (you).
    The surprise for an Arabic reader: kasra (i) goes below and damma (u) above. Javanese is the other way round: i above (wulu), u below (suku)!
    On a keyboard or tablet: type the letter first, then the mark, even when the mark appears before it (taling). The font places it.
    One detail: rê and lê have their own letters: ꦉ (pa cêrêk) = rê and ꦊ (nga lêlêt) = lê — not ꦫ / ꦭ + pepet.
    Remember: é and è share one mark (taling); only the pronunciation differs.
examples:
  - text: ꦱꦶꦗꦶ (siji)
    breakdown: ꦱ sa + ꦶ wulu → si · ꦗ ja + ꦶ wulu → ji
    en: one
    ar_eg: واحد
    ar: واحد
  - text: ꦧꦸꦏꦸ (buku)
    breakdown: ꦧ ba + ꦸ suku → bu · ꦏ ka + ꦸ suku → ku
    en: book
    ar_eg: كتاب
    ar: كتاب
  - text: ꦠꦼꦭꦸ (telu)
    breakdown: ꦠ ta + ꦼ pepet → tê · ꦭ la + ꦸ suku → lu
    en: three
    ar_eg: تلاتة
    ar: ثلاثة
  - text: ꦒꦼꦝꦺ (gedhe)
    breakdown: ꦒ ga + ꦼ pepet → gê · ꦝ dha + ꦺ taling → dhe
    en: big
    ar_eg: كبير
    ar: كبير
  - text: ꦏꦺꦴꦮꦺ (kowe)
    breakdown: ꦏ ka + ꦺ…ꦴ taling tarung → ko · ꦮ wa + ꦺ taling → we
    en: you (ngoko)
    ar_eg: إنت
    ar: أنت
  - text: ꦱꦺꦴꦫꦺ (sore)
    breakdown: ꦱ sa + taling tarung → so · ꦫ ra + taling → re
    en: afternoon
    ar_eg: العصر / بعد الضهر
    ar: العصر
mistakes:
  - wrong: Putting wulu under the letter for i (like kasra).
    right: ꦶ wulu goes above; ꦸ suku (u) goes below.
    why:
      ar_eg: "بالعكس من العربي: i فوق وu تحت."
      ar: "على عكس العربية: i فوق وu تحت."
      en: The opposite of Arabic — i above, u below.
  - wrong: Writing o with tarung ꦴ alone (ꦏꦴ for ko).
    right: ꦏꦺꦴ — o needs both parts, taling before and tarung after.
    why:
      ar_eg: tarung لوحدها مش o. لازم taling قبل الحرف كمان.
      ar: tarung وحدها ليست o، بل لا بد من taling قبل الحرف.
      en: tarung alone isn't o; it needs taling in front as well.
  - wrong: Writing rê as ꦫꦼ (ra + pepet).
    right: ꦉ (pa cêrêk).
    why:
      ar_eg: rê ليها حرف مخصوص. وبرضه lê = ꦊ مش ꦭꦼ.
      ar: لـ rê حرف خاص ꦉ، ولـ lê الحرف ꦊ.
      en: rê has its own letter, ꦉ; likewise lê is ꦊ.
arabic_bridge:
  ar_eg: "زي التشكيل بالظبط: الحرف «مفتوح» من نفسه، وwulu = كسرة، وsuku = ضمة، وpepet = حركة مختلسة. بس انتبه: الكسرة عندنا تحت، والـ wulu فوق؛ والضمة عندنا فوق، والـ suku تحت. والـ a الجاهزة هي الفتحة اللي مش محتاجة تتكتب."
  ar: "كالتشكيل تمامًا: الحرف مفتوح أصلًا، وwulu بمنزلة الكسرة، وsuku بمنزلة الضمة، وpepet صائت مختلس؛ غير أن الكسرة عندنا تحت وwulu فوق، والضمة فوق وsuku تحت."
  en: "Exactly like harakat: the letter is 'fatha' by default, wulu = kasra, suku = damma, pepet = a reduced vowel. But mind the positions: Arabic kasra is below and wulu above; damma is above and suku below."
