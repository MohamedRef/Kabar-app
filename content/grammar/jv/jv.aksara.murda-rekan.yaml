schema: kabar.grammar/v1
id: jv.aksara.murda-rekan
language: jv
level: j6
title:
  target: aksara murda · aksara rekan (ꦏ꦳ ꦢ꦳ ꦥ꦳ ꦗ꦳ ꦒ꦳) · angka Jawa ꧑꧒꧓
  en: Honorific capitals, Arabic-sound letters and Javanese numerals
  ar_eg: الحروف «الكبيرة» للتكريم، وحروف الأصوات العربية، والأرقام الجاوية
  ar: الحروف المعظَّمة وحروف الأصوات العربية والأرقام الجاوية
summary:
  ar_eg: "aksara murda = أشكال «كبيرة» لتمن حروف بتتكتب في أسماء الناس والأماكن المحترمة (ꦓꦸꦱ꧀ꦠꦶ Gusti). aksara rekan = حرف جاوي + تلات نقط (꦳) عشان أصوات عربية: ꦏ꦳ خ، ꦢ꦳ ذ، ꦥ꦳ ف، ꦗ꦳ ز، ꦒ꦳ غ. والأرقام ꧐–꧙ بتتكتب بين علامتين ꧇…꧇."
  ar: "aksara murda صور معظَّمة لثمانية حروف تُكتب في أسماء الأعلام المحترمة (ꦓꦸꦱ꧀ꦠꦶ Gusti)، وaksara rekan حرف جاوي مع ثلاث نقاط (꦳) للأصوات العربية: ꦏ꦳ خ، ꦢ꦳ ذ، ꦥ꦳ ف، ꦗ꦳ ز، ꦒ꦳ غ. والأرقام ꧐–꧙ تُكتب بين علامتي ꧇…꧇."
  en: "Aksara murda are 'capital' forms of eight letters, used in names of respected people and places (ꦓꦸꦱ꧀ꦠꦶ Gusti). Aksara rekan are a Javanese letter plus three dots (꦳) for Arabic sounds: ꦏ꦳ kh, ꦢ꦳ dz, ꦥ꦳ f, ꦗ꦳ z, ꦒ꦳ gh. Numerals ꧐–꧙ are written between two ꧇ marks."
pattern:
  - "murda (8): ꦟ na · ꦑ ka · ꦡ ta · ꦯ sa · ꦦ pa · ꦘ nya · ꦓ ga · ꦨ ba"
  - "use murda for honour — names and titles of respected people, sacred or royal places — not for every sentence start"
  - "rekan = letter + cecak telu ꦳ (three dots): ꦏ꦳ kha (خ) · ꦢ꦳ dza (ذ) · ꦥ꦳ fa (ف) · ꦗ꦳ za (ز) · ꦒ꦳ gha (غ)"
  - "rekan take vowel marks like any letter: ꦢ꦳ꦶꦏꦶꦂ dzikir · ꦏ꦳ꦸꦱꦸꦱ꧀ khusus"
  - "old, fully Javanised loans use plain letters: pikir (فكر) → ꦥꦶꦏꦶꦂ"
  - "numerals: ꧐ 0 · ꧑ 1 · ꧒ 2 · ꧓ 3 · ꧔ 4 · ꧕ 5 · ꧖ 6 · ꧗ 7 · ꧘ 8 · ꧙ 9"
  - "a number is enclosed by pada pangkat ꧇: ꧇꧒꧐꧒꧖꧇ = 2026"
explanation:
  ar_eg: |
    الوحدة دي فيها تلات حاجات صغيرة:
    1. aksara murda (الحروف «الكبيرة»):
       تمن حروف ليهم شكل تاني «فخم»: ꦟ na، ꦑ ka، ꦡ ta، ꦯ sa، ꦦ pa، ꦘ nya، ꦓ ga، ꦨ ba.
       مش زي الـ capital letters الإنجليزي اللي في أول كل جملة. دي للتكريم: أسماء وألقاب الناس المحترمة، الأماكن المقدسة أو الملكية. يعني الخط نفسه فيه «unggah-ungguh».
       مثال: ꦓꦸꦱ꧀ꦠꦶ = Gusti (لقب للأمير / وكمان لله في الدعاء): ꦓ ga murda بدل ꦒ.
       عادةً بيتكتب حرف murda واحد بس في الكلمة، في أول مقطع ليه شكل murda.
    2. aksara rekan (حروف الأصوات العربية) — دي «الجسر العربي» بتاعك:
       الجاوي معندوش أصوات خ ذ ف ز غ، فبياخد أقرب حرف ويحط عليه تلات نقط (cecak telu ꦳):
       ꦏ ka + ꦳ = ꦏ꦳ kha (خ) · ꦢ da + ꦳ = ꦢ꦳ dza (ذ) · ꦥ pa + ꦳ = ꦥ꦳ fa (ف) · ꦗ ja + ꦳ = ꦗ꦳ za (ز) · ꦒ ga + ꦳ = ꦒ꦳ gha (غ).
       نفس فكرة الفارسي اللي زوّد نقط على ب عشان يعمل پ! وهتشوفها تاني في البيجون (ڤ، ڠ …).
       بس الكلمات العربية القديمة اللي «اتجوّدت» خلاص بتتكتب بحروف عادية: pikir (من فِكر) = ꦥꦶꦏꦶꦂ.
    3. الأرقام (angka Jawa): ꧐ ꧑ ꧒ ꧓ ꧔ ꧕ ꧖ ꧗ ꧘ ꧙ (0–9).
       بيتكتبوا بين علامتين ꧇ (pada pangkat) عشان مايتلخبطوش مع الحروف (كام رقم شكله شبه حرف): ꧇꧒꧐꧒꧖꧇ = 2026.
  ar: |
    1. aksara murda: لثمانية حروف صور معظَّمة: ꦟ na، ꦑ ka، ꦡ ta، ꦯ sa، ꦦ pa، ꦘ nya، ꦓ ga، ꦨ ba.
       وليست كالحروف الكبيرة اللاتينية في أول كل جملة، بل للتعظيم: أسماء الأعلام المحترمين وألقابهم والأماكن المقدسة والملكية: ꦓꦸꦱ꧀ꦠꦶ = Gusti. ويُكتب غالبًا حرف murda واحد في الكلمة.
    2. aksara rekan: للأصوات العربية التي لا توجد في الجاوية، يُضاف إلى أقرب حرف ثلاث نقاط (cecak telu ꦳): ꦏ꦳ خ، ꦢ꦳ ذ، ꦥ꦳ ف، ꦗ꦳ ز، ꦒ꦳ غ، كما زادت الفارسية النقاط على الباء فصارت پ.
       أما الدخيل القديم المتجوّد فيُكتب بحروف عادية: pikir = ꦥꦶꦏꦶꦂ.
    3. الأرقام: ꧐ ꧑ ꧒ ꧓ ꧔ ꧕ ꧖ ꧗ ꧘ ꧙، وتُحاط بعلامة pada pangkat ꧇ لئلا تلتبس بالحروف: ꧇꧒꧐꧒꧖꧇ = 2026.
  en: |
    Three small topics:
    1. Aksara murda ("capital" letters):
       Eight letters have a grand alternative form: ꦟ na, ꦑ ka, ꦡ ta, ꦯ sa, ꦦ pa, ꦘ nya, ꦓ ga, ꦨ ba.
       They aren't like English capitals at every sentence start. They're for honour: names and titles of respected people, sacred or royal places. The script itself has unggah-ungguh.
       Example: ꦓꦸꦱ꧀ꦠꦶ = Gusti (a title for nobility, also for God in prayer): ꦓ ga murda instead of ꦒ.
       Usually only one murda letter per word, on the first syllable that has a murda form.
    2. Aksara rekan (Arabic-sound letters) — your Arabic Bridge:
       Javanese has no خ ذ ف ز غ, so it takes the nearest letter and adds three dots (cecak telu ꦳):
       ꦏ ka + ꦳ = ꦏ꦳ kha (خ) · ꦢ da + ꦳ = ꦢ꦳ dza (ذ) · ꦥ pa + ꦳ = ꦥ꦳ fa (ف) · ꦗ ja + ꦳ = ꦗ꦳ za (ز) · ꦒ ga + ꦳ = ꦒ꦳ gha (غ).
       Same trick as Persian adding dots to ب to make پ — and you'll see it again in Pegon (ڤ, ڠ …).
       Old loans that became fully Javanese use plain letters: pikir (from فِكر) = ꦥꦶꦏꦶꦂ.
    3. Numerals (angka Jawa): ꧐ ꧑ ꧒ ꧓ ꧔ ꧕ ꧖ ꧗ ꧘ ꧙ (0–9).
       A number is written between two ꧇ (pada pangkat) marks so it isn't confused with letters (some digits look like letters): ꧇꧒꧐꧒꧖꧇ = 2026.
examples:
  - text: ꦓꦸꦱ꧀ꦠꦶ (Gusti)
    breakdown: ꦓ ga murda + suku → Gu · ꦱ sa + pasangan ꦠ ta + wulu → s-ti
    en: Gusti (an honorific title; also "Lord" in prayer)
    ar_eg: «Gusti» — لقب تكريم، وفي الدعاء معناه «الرب»
    ar: «Gusti» لقب تعظيم، ويعني «الرب» في الدعاء
  - text: ꦥ꦳ꦗꦂ (fajar)
    breakdown: ꦥ꦳ fa (pa + ꦳) · ꦗ ja + ꦂ layar → jar
    en: dawn (from Arabic فجر)
    ar_eg: الفجر
    ar: الفجر
  - text: ꦗ꦳ꦏꦠ꧀ (zakat)
    breakdown: ꦗ꦳ za (ja + ꦳) · ꦏ ka · ꦠ ta + ꧀ pangkon
    en: zakat, obligatory alms (from Arabic زكاة)
    ar_eg: الزكاة
    ar: الزكاة
  - text: ꦢ꦳ꦶꦏꦶꦂ (dzikir)
    breakdown: ꦢ꦳ dza + wulu → dzi · ꦏ ka + wulu + layar → kir
    en: dhikr, remembrance of God (from Arabic ذكر)
    ar_eg: الذكر
    ar: الذِّكر
  - text: ꦏ꦳ꦸꦱꦸꦱ꧀ (khusus)
    breakdown: ꦏ꦳ kha + suku → khu · ꦱ sa + suku → su · ꦱ sa + ꧀ pangkon → s
    en: special (from Arabic خصوص)
    ar_eg: خاص / مخصوص
    ar: خاص
  - text: ꧇꧒꧐꧒꧖꧇ (2026)
    breakdown: ꧇ pada pangkat · ꧒ 2 · ꧐ 0 · ꧒ 2 · ꧖ 6 · ꧇ pada pangkat
    en: the year 2026
    ar_eg: سنة 2026
    ar: عام 2026
mistakes:
  - wrong: Using murda letters at the start of every sentence, like English capitals.
    right: Use murda only for honoured names, titles and places.
    why:
      ar_eg: murda للتكريم مش للترقيم. أول الجملة بيتكتب عادي.
      ar: murda للتعظيم لا لبداية الجمل.
      en: murda is about honour, not punctuation; sentence starts use ordinary letters.
  - wrong: Writing fajar as ꦥꦗꦂ (plain pa) in a careful religious text.
    right: ꦥ꦳ꦗꦂ — fa with three dots.
    why:
      ar_eg: من غير النقط هتتقري pajar. التلات نقط هي اللي بتعمل الـ ف.
      ar: بلا النقاط تُقرأ pajar، والنقاط الثلاث تصنع الفاء.
      en: Without the dots it reads pajar; the three dots make the f.
  - wrong: Writing numbers without the ꧇ marks.
    right: ꧇꧒꧐꧒꧖꧇
    why:
      ar_eg: كام رقم جاوي شبه حروف، فالعلامتين بيقولولك «ده رقم».
      ar: بعض الأرقام تشبه الحروف، والعلامتان تدلان على أنها أرقام.
      en: Some digits look like letters; the ꧇ marks say "this is a number".
arabic_bridge:
  ar_eg: "aksara rekan هي حكايتك: الجاويين لما قابلوا العربي محتاجين ف وز وخ وذ وغ، فزوّدوا تلات نقط على أقرب حرف — بالظبط زي ما الفارسي عمل پ وچ وگ. وكمان: fajar وzakat وdzikir كلها كلمات إنت عارفها."
  ar: "aksara rekan حكاية عربية: احتاج الجاويون إلى ف وز وخ وذ وغ فزادوا ثلاث نقاط على أقرب حرف، كما صنعت الفارسية پ وچ وگ؛ وأمثلتها fajar وzakat وdzikir كلمات تعرفها."
  en: "Aksara rekan is your story: meeting Arabic, Javanese needed ف ز خ ذ غ, so it added three dots to the nearest letter — just as Persian made پ چ گ. And the examples (fajar, zakat, dzikir) are words you already know."
