schema: kabar.grammar/v1
id: jv.narrative.connectors
language: jv
level: j5
title:
  target: banjur · nuli · terus · sawise · sadurunge · nalika · bareng · dumadakan · pungkasane
  en: Story connectors — following the sequence of a cerkak
  ar_eg: أدوات الحكي — إزاي تتابع ترتيب الأحداث في قصة
  ar: أدوات السرد — تتبّع تسلسل الأحداث في القصة
summary:
  ar_eg: "القصة الجاوية (cerkak) ماشية على كلمات ربط: banjur / nuli = وبعدين، sawise = بعد ما، sadurunge = قبل ما، nalika = لما (في الماضي)، bareng = أول ما، dumadakan = فجأة، pungkasane = وفي الآخر. اعرفهم وهتعرف ترتيب الأحداث."
  ar: "تُبنى القصة الجاوية القصيرة (cerkak) على أدوات: banjur / nuli = ثم، sawise = بعد أن، sadurunge = قبل أن، nalika = حين، bareng = ما إن، dumadakan = فجأة، pungkasane = وأخيرًا."
  en: "A Javanese short story (cerkak) runs on connectors: banjur / nuli = then, sawise = after, sadurunge = before, nalika = when (past), bareng = as soon as, dumadakan = suddenly, pungkasane = finally. Know them and you'll follow the order of events."
pattern:
  - "opening: Ing sawijining dina, … (one day …) · Biyen ana … (once there was …)"
  - "then: banjur (written / storytelling) · nuli (literary) · terus (spoken)"
  - "after / before: sawise (sesudah) + clause · sadurunge (sebelum) + clause · krama: sasampunipun · saderengipun"
  - "when (past): nalika (ketika) · nalika iku (saat itu) · as soon as: bareng (begitu)"
  - "suddenly: dumadakan (tiba-tiba) · meanwhile / while: karo (sambil)"
  - "contrast / cause: nanging (tetapi) · sanadyan (walaupun) · amarga (karena) · mula (makanya)"
  - "ending: pungkasane (akhirnya) · wiwit iku (sejak itu)"
explanation:
  ar_eg: |
    في J2 اتعلمنا terus وbanjur وnanging. القصة المكتوبة بتزوّد شوية أدوات، ولو عرفتهم هتعرف تمشي ورا الأحداث حتى لو فيه كلمات مش فاهمها.
    - البداية: «Ing sawijining dina» = في يوم من الأيام. «Biyen ana …» = كان يا ما كان، كان فيه …
    - وبعدين: terus في الكلام، banjur في الحكي والكتابة، nuli أدبية أكتر. التلاتة نفس المعنى: «ثم / وبعدين».
    - sawise = بعد ما، sadurunge = قبل ما. بييجي بعدهم جملة: «Sawise mangan, dheweke banjur turu» = بعد ما أكل، نام. (في الكراما: sasampunipun وsaderengipun.)
    - nalika = لما / عندما (في الماضي): «Nalika isih cilik, …» = لما كان صغير. nalika iku = وقتها.
    - bareng = أول ما / بمجرد ما: «Bareng tekan omah, …» = أول ما وصل البيت.
    - dumadakan = فجأة: لحظة التحول في القصة.
    - sanadyan = مع إن، amarga = عشان، mula = عشان كده.
    - النهاية: pungkasane = وفي الآخر. wiwit iku = ومن ساعتها.
    نصيحة قراءة: قبل ما تقرا القصة بالتفصيل، علّم على أدوات الربط بس. هتلاقي «هيكل» الحكاية قدامك: البداية، الأحداث، المفاجأة، النهاية.
    والكلمات دي هتسمعها كمان في أغاني campursari اللي بتحكي حكاية.
  ar: |
    عرفنا في J2 terus وbanjur وnanging، والقصة المكتوبة تضيف أدوات أخرى:
    - الافتتاح: «Ing sawijining dina» = في يوم من الأيام، و«Biyen ana …» = كان يا ما كان.
    - ثم: terus في الكلام، وbanjur في السرد، وnuli أدبية.
    - sawise = بعد أن، وsadurunge = قبل أن، تليهما جملة؛ وفي الكراما sasampunipun وsaderengipun.
    - nalika = حين (في الماضي)، وnalika iku = آنذاك، وbareng = ما إن: «Bareng tekan omah, …».
    - dumadakan = فجأة، لحظة التحول.
    - sanadyan = مع أن، وamarga = لأن، وmula = لذلك.
    - الخاتمة: pungkasane = وأخيرًا، وwiwit iku = ومنذ ذلك الحين.
    ونصيحة القراءة: ظلّل أدوات الربط أولًا يظهر لك هيكل القصة.
  en: |
    J2 gave you terus, banjur and nanging. Written stories add a few more, and once you know them you can follow the events even through unknown words.
    - Opening: "Ing sawijining dina" = one day. "Biyen ana …" = once upon a time there was …
    - Then: terus in speech, banjur in storytelling and writing, nuli more literary. All three mean "then".
    - sawise = after, sadurunge = before, followed by a clause: "Sawise mangan, dheweke banjur turu" = after eating, he went to sleep. (Krama: sasampunipun, saderengipun.)
    - nalika = when (past): "Nalika isih cilik, …" = when he was little. nalika iku = at that time.
    - bareng = as soon as: "Bareng tekan omah, …" = as soon as he got home.
    - dumadakan = suddenly: the story's turning point.
    - sanadyan = although, amarga = because, mula = so, that's why.
    - Ending: pungkasane = finally. wiwit iku = from then on.
    Reading tip: before reading closely, mark only the connectors. The story's skeleton appears: opening, events, twist, ending.
    You'll hear the same words in campursari songs that tell a story.
examples:
  - text: Ing sawijining dina, Dimas lunga menyang pasar.
    breakdown: ing sawijining dina = pada suatu hari · Dimas · lunga = pergi · menyang = ke · pasar
    en: One day, Dimas went to the market.
    ar_eg: في يوم من الأيام، ديماس راح السوق.
    ar: في يوم من الأيام ذهب ديماس إلى السوق.
    register: neutral
  - text: Sawise mangan, dheweke banjur turu.
    breakdown: sawise = sesudah · mangan = makan · dheweke = dia · banjur = lalu · turu = tidur
    en: After eating, he went to sleep.
    ar_eg: بعد ما أكل، نام.
    ar: بعد أن أكل نام.
    register: neutral
  - text: Nalika isih cilik, Rina manggon ing Madiun.
    breakdown: nalika = ketika · isih = masih · cilik = kecil · Rina · manggon = tinggal · ing = di · Madiun
    en: When she was little, Rina lived in Madiun.
    ar_eg: لما رينا كانت صغيرة، كانت ساكنة في ماديون.
    ar: حين كانت رينا صغيرة كانت تسكن ماديون.
    register: neutral
  - text: Bareng tekan omah, dumadakan udan deres.
    breakdown: bareng = begitu · tekan = sampai · omah = rumah · dumadakan = tiba-tiba · udan = hujan · deres = deras
    en: As soon as he got home, it suddenly poured with rain.
    ar_eg: أول ما وصل البيت، فجأة الدنيا مطّرت جامد.
    ar: ما إن وصل إلى البيت حتى انهمر المطر فجأة.
    register: neutral
  - text: Pungkasane, kabeh padha bungah.
    breakdown: pungkasane = akhirnya · kabeh = semua · padha = (plural marker) · bungah = gembira
    en: In the end, everyone was happy.
    ar_eg: وفي الآخر، الكل فرح.
    ar: وفي النهاية فرح الجميع.
    register: neutral
mistakes:
  - wrong: Reading nalika as "if".
    right: nalika = when (a time in the past); "if" is yen / menawa.
    why:
      ar_eg: nalika «لما» عن حاجة حصلت. «لو» = yen.
      ar: nalika «حين» لما وقع، وأما «إن / لو» فـ yen.
      en: nalika marks a time something happened; "if" is yen.
  - wrong: Sawise dheweke mangan, banjur dheweke banjur turu.
    right: Sawise mangan, dheweke banjur turu.
    why:
      ar_eg: banjur مرة واحدة كفاية. والفاعل مش لازم يتكرر بعد sawise.
      ar: تكفي banjur مرة واحدة، ولا داعي لتكرار الفاعل.
      en: One banjur is enough, and the subject needn't repeat after sawise.
  - wrong: Treating bareng only as "together".
    right: At the start of a clause, bareng often means "as soon as / when" (Bareng tekan omah …).
    why:
      ar_eg: bareng معناها «مع بعض»، بس في أول الجملة في الحكي معناها «أول ما».
      ar: bareng = معًا، لكنها في صدر الجملة السردية بمعنى «ما إن».
      en: bareng means "together", but opening a clause in a story it means "as soon as".
arabic_bridge:
  ar_eg: "«Ing sawijining dina» = «في يوم من الأيام»، و«Biyen ana …» = «كان يا ما كان»، وbanjur / nuli = «ثم» و«فـ» في الحواديت، وpungkasane = «وفي النهاية». نفس هيكل الحدوتة المصري."
  ar: "«Ing sawijining dina» = «في يوم من الأيام»، و«Biyen ana» = «كان يا ما كان»، وbanjur / nuli = «ثم»، وpungkasane = «وفي النهاية»."
  en: "«Ing sawijining dina» = «في يوم من الأيام», «Biyen ana …» = «كان يا ما كان», banjur / nuli = «ثم», pungkasane = «وفي النهاية» — the same skeleton as an Egyptian folk tale."
