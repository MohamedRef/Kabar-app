see_also: [jv.reading.written-style, jv.passive.written, id.conjunction.sequence, id.conjunction.time]
cues:
  - match: "nuli|sawise|sadurunge|nalika|bareng|dumadakan"
    note:
      ar_eg: "رابط حكي: sawise بعد، sadurunge قبل، nalika لمّا، dumadakan فجأة."
      ar: "رابط سرد: sawise بعد، sadurunge قبل، nalika عندما، dumadakan فجأة."
      en: "Story connector: sawise after, sadurunge before, nalika when, dumadakan suddenly."
