schema: kabar.grammar/v1
id: jv.particle.basic
language: jv
level: j1
title:
  target: ta / to, ae / wae, lho, kok, ya, sek, mbok
  en: Little words that colour a sentence (particles)
  ar_eg: الكلمات الصغيرة اللي بتدي للجملة طعم
  ar: الأدوات التي تلوّن الجملة
summary:
  ar_eg: "ta (سورابايا) / to = «ولا إيه؟»، ae / wae = «بس»، lho = «على فكرة!»، kok = «ليه كده؟!»، ya = «ماشي؟»، sek = «الأول / استنى»، mbok = «ما تـ…». من غيرهم الجاوي بيبان ناشف."
  ar: "ta / to للاستيثاق، وae / wae بمعنى «فقط»، وlho للتنبيه، وkok للتعجب، وya للتلطيف، وsek بمعنى «أولًا / انتظر»، وmbok للحث اللطيف."
  en: "ta (Surabaya) / to = 'right?', ae / wae = 'just', lho = 'you know!', kok = 'how come?!', ya = 'OK?', sek = 'first / hold on', mbok = 'why don't you…'. Without them Javanese sounds stiff."
pattern:
  - "sentence + ta? (Arek) / to? (Mataraman) = …, right? (Indonesian kan? / to?)"
  - "X + ae (Arek) / wae (standard) = just X (saja)"
  - "sentence + lho = …, you know! (lho, also Indonesian)"
  - "Kok + sentence? = How come …? (kok, also Indonesian)"
  - "sentence + ya / yo = soft request or agreement (ya)"
  - "verb + sek / dhisik = … first (dulu) · Sek! = Hold on!"
  - "mbok + verb = why don't you … (Mataraman, gentle push)"
explanation:
  ar_eg: |
    الأدوات دي هي «البهارات». أغلبها بتيجي في آخر الجملة، وبعضها بتعرفه من الإندونيسي العامي:
    - ta (سورابايا) / to (سولو ويوجيا) = «ولا إيه؟ / مش كده؟» (kan?): Koen wis mangan ta? = إنت كلت، مش كده؟
    - ae (سورابايا) / wae (العادية) = «بس» (saja): Aku teh ae = أنا هاخد شاي بس. Ngene wae = كده وخلاص.
    - lho = «على فكرة / خد بالك!»: Iki enak lho = ده حلو على فكرة! وفي الأول = «إيه ده!»: Lho, kowe nang kene? = إيه ده، إنت هنا؟
    - kok = «ليه كده؟! / إزاي؟» بدهشة: Kok larang? = غالي كده ليه؟! وفي الآخر بتطمّن: Ora apa-apa kok = مفيش حاجة والله.
    - ya / yo = بتليّن الطلب: Sesuk ya! = بكرة، ماشي؟ الأمر من غير ya بيبان ناشف.
    - sek (sik / dhisik) = «الأول» بعد الفعل: Mangan sek = كُل الأول. ولوحدها: Sek! = استنى! (زي «Sek tak lapor pusat»).
    - mbok (سولو / يوجيا) = «ما تـ…» بلطف: Mbok mangan sek = ما تاكل الأول!
    نصيحة: ta وae علامات سورابايا، to وwae علامات وسط جاوة.
  ar: |
    هذه الأدوات كالتوابل، يأتي أكثرها آخر الجملة، وبعضها معروف من الإندونيسية العامية:
    - ta (سورابايا) / to (سولو ويوجيا) = أليس كذلك؟ (kan?): Koen wis mangan ta?
    - ae (سورابايا) / wae (القياسية) = فقط (saja): Aku teh ae = شايًا فقط.
    - lho = للتنبيه: Iki enak lho = إنه لذيذ حقًا! وفي أول الجملة للدهشة: Lho, kowe nang kene?
    - kok = للتعجب والسؤال: Kok larang? = لماذا هو غالٍ هكذا؟ وفي آخر الجملة للطمأنة: Ora apa-apa kok.
    - ya / yo = لتلطيف الطلب: Sesuk ya! = غدًا، اتفقنا؟
    - sek (sik / dhisik) = أولًا بعد الفعل: Mangan sek = كُل أولًا، ووحدها: Sek! = انتظر!
    - mbok (سولو / يوجيا) = حثّ لطيف: Mbok mangan sek = لِمَ لا تأكل أولًا؟
    وta وae من علامات سورابايا، وto وwae من علامات وسط جاوة.
  en: |
    These are the spices. Most sit at the end, and some you know from casual Indonesian:
    - ta (Surabaya) / to (Solo, Yogya) = "…, right?" (kan?): Koen wis mangan ta? = You've eaten, right?
    - ae (Surabaya) / wae (standard) = "just" (saja): Aku teh ae = Just tea for me. Ngene wae = Just like this.
    - lho = "you know! / look!": Iki enak lho = This is really good, you know! At the start it's surprise: Lho, kowe nang kene? = Oh! You're here?
    - kok = "how come?!": Kok larang? = Why so expensive?! At the end it reassures: Ora apa-apa kok = It's fine, really.
    - ya / yo = softens a request: Sesuk ya! = Tomorrow, OK? A bare command sounds harsh.
    - sek (sik / dhisik) = "first" after a verb: Mangan sek = Eat first. Alone: Sek! = Hold on! (as in "Sek tak lapor pusat").
    - mbok (Solo, Yogya) = gentle "why don't you": Mbok mangan sek = Why don't you eat first?
    Tip: ta and ae signal Surabaya; to and wae signal Central Java.
examples:
  - text: Koen wis mangan ta, rek?
    breakdown: koen = kamu (Arek) · wis = sudah · mangan = makan · ta = kan? · rek = guys
    en: You've eaten, right, mate? (Surabaya Arek)
    ar_eg: كلت، مش كده يا صاحبي؟
    ar: أكلتَ، أليس كذلك يا صاح؟
    register: informal
  - text: Aku teh ae.
    breakdown: aku · teh · ae = saja (Arek)
    en: Just tea for me. (Surabaya)
    ar_eg: أنا شاي بس.
    ar: شايًا فقط من فضلك.
    register: informal
  - text: Kok larang, Cak?
    breakdown: kok = kok (how come) · larang = mahal · Cak = Mas (Arek)
    en: How come it's so expensive, brother?
    ar_eg: غالي كده ليه يا معلم؟
    ar: لماذا هو غالٍ هكذا يا أخي؟
    register: informal
  - text: Iki enak lho!
    breakdown: iki = ini · enak = enak · lho = lho
    en: This is really good, you know!
    ar_eg: ده حلو أوي على فكرة!
    ar: هذا لذيذ حقًا!
    register: informal
  - text: Aku mulih sek, ya.
    breakdown: aku · mulih = pulang · sek = dulu · ya
    en: I'm heading home now, OK?
    ar_eg: أنا هروّح بقى، ماشي؟
    ar: سأعود إلى البيت الآن، حسنًا؟
    register: informal
  - text: Mbok mangan sek.
    breakdown: mbok = coba / kenapa tidak · mangan = makan · sek = dulu
    en: Why don't you eat first? (Central Java)
    ar_eg: ما تاكل الأول!
    ar: لِمَ لا تأكل أولًا؟
    register: informal
mistakes:
  - wrong: Kok larang? = "It's expensive, right?"
    right: Kok larang? = "How come it's so expensive?!"
    why:
      ar_eg: kok في الأول = دهشة / اعتراض، مش سؤال «مش كده؟». «مش كده؟» هي ta / to في الآخر.
      ar: kok في أول الجملة للتعجب والاعتراض، أما الاستيثاق فبـ ta / to في آخرها.
      en: Initial kok expresses surprise or protest; "…, right?" is ta / to at the end.
  - wrong: Teka sesuk! (bare, to a friend)
    right: Teka sesuk, ya.
    why:
      ar_eg: الأمر الجاوي من غير ya بيبان ناشف. ya بتخليه «تعالى بكرة، ماشي؟».
      ar: الأمر المجرد يبدو جافًا، وya تلطّفه.
      en: A bare command sounds harsh; ya softens it.
arabic_bridge:
  ar_eg: "زي المصري بالظبط: ta ≈ «ولا إيه؟»، lho ≈ «على فكرة»، kok ≈ «إيه ده؟! ليه؟»، ya ≈ «ماشي؟ / والنبي»، mbok ≈ «ما تاكل!»."
  ar: "تقابل هذه الأدوات ما في العامية من «ولا إيه» و«على فكرة» و«ما تيجي»، وهي تحمل النبرة لا المعنى المعجمي."
  en: "They mirror Egyptian «ولا إيه؟», «على فكرة», «ما تيجي!»: tone, not dictionary meaning."
tags: [particle, chat, tone, arek, j1]
prerequisites: [jv.sentence.basic]
see_also: [jv.dialect.arek, jv.imperative.ngoko, jv.proclitic.tak-kok-di]
cues:
  - match: "sek|sik|dhisik|disik"
    note:
      ar_eg: "sek = استنى لحظة / الأول (dulu)."
      ar: "sek = لحظة / أولًا (dulu)."
      en: "sek = hold on / first (dulu)."
  - match: "ta|to|tah"
    note:
      ar_eg: "ta / to في آخر الجملة = مش كده؟ (kan?)."
      ar: "ta / to = أليس كذلك؟ (kan?)."
      en: "ta / to at the end = right? (kan?)."
  - match: "ae|wae"
    note:
      ar_eg: "ae / wae = بس / وخلاص (saja)."
      ar: "ae / wae = فقط (saja)."
      en: "ae / wae = just (saja)."
  - match: "lho|kok|mbok"
    note:
      ar_eg: "أداة كلام: lho = على فكرة!، kok = إزاي كده؟، mbok = ما تـ... (اقتراح)."
      ar: "أداة تخاطب: lho للتنبيه، kok للاستغراب، mbok للاقتراح."
      en: "Particle: lho you know!, kok how come?, mbok why don't you."
review:
