schema: kabar.grammar/v1
id: jv.particle.basic
language: jv
level: j1
title:
  target: to / ta, wae, lho, kok, ya, sik, mbok, je
  en: Little words that colour a sentence (particles)
  ar_eg: الكلمات الصغيرة اللي بتدي للجملة طعم
  ar: الأدوات التي تلوّن الجملة
summary:
  ar_eg: "to / ta = «ولا إيه؟»، wae = «بس»، lho = «على فكرة!»، kok = «ليه كده؟!»، ya = «ماشي؟»، sik = «الأول / استنى»، mbok = «ما تـ…»، je = «والله / أصلًا» (يوجيا). من غيرهم الجاوي بيبان ناشف."
  ar: "to / ta للاستيثاق، وwae بمعنى «فقط»، وlho للتنبيه، وkok للتعجب، وya للتلطيف، وsik بمعنى «أولًا / انتظر»، وmbok للحث اللطيف، وje للتوكيد في يوجياكرتا."
  en: "to / ta = 'right?', wae = 'just', lho = 'you know!', kok = 'how come?!', ya = 'OK?', sik = 'first / hold on', mbok = 'why don't you…', je = 'really, you see' (Jogja). Without them Javanese sounds stiff."
pattern:
  - "sentence + to? / ta? = …, right? (Indonesian kan?)"
  - "X + wae = just X (saja)"
  - "sentence + lho = …, you know! (lho, also Indonesian)"
  - "Kok + sentence? = How come …? (kok, also Indonesian)"
  - "sentence + ya / yo = soft request or agreement (ya)"
  - "verb + sik / dhisik = … first (dulu) · Sik! = Hold on!"
  - "mbok + verb = why don't you … (gentle push)"
  - "sentence + je = …, really / you see (Jogja street speech)"
explanation:
  ar_eg: |
    الأدوات دي هي «البهارات». أغلبها بتيجي في آخر الجملة، وبعضها بتعرفه من الإندونيسي العامي:
    - to / ta = «ولا إيه؟ / مش كده؟» (kan?): Kowe wis mangan to? = إنت كلت، مش كده؟
    - wae = «بس» (saja): Aku teh wae = أنا هاخد شاي بس. Ngene wae = كده وخلاص.
    - lho = «على فكرة / خد بالك!»: Iki enak lho = ده حلو على فكرة! وفي الأول = «إيه ده!»: Lho, kowe neng kene? = إيه ده، إنت هنا؟
    - kok = «ليه كده؟! / إزاي؟» بدهشة: Kok larang? = غالي كده ليه؟! وفي الآخر بتطمّن: Ora apa-apa kok = مفيش حاجة والله.
    - ya / yo = بتليّن الطلب: Sesuk ya! = بكرة، ماشي؟ الأمر من غير ya بيبان ناشف.
    - sik (dhisik) = «الأول» بعد الفعل: Mangan sik = كُل الأول. ولوحدها: Sik! = استنى! (زي «Sik, tak lapor»).
    - mbok = «ما تـ…» بلطف: Mbok mangan sik = ما تاكل الأول!
    - je (يوجيا) = «والله / أصلًا» في آخر الجملة: Aku ra ngerti je = أنا مش فاهم والله.
    في سورابايا هتسمع ae بدل wae وsek بدل sik؛ افهمهم لما تسمعهم، بس اتكلم زي يوجيا وماديون.
  ar: |
    هذه الأدوات كالتوابل، يأتي أكثرها آخر الجملة، وبعضها معروف من الإندونيسية العامية:
    - to / ta = أليس كذلك؟ (kan?): Kowe wis mangan to?
    - wae = فقط (saja): Aku teh wae = شايًا فقط.
    - lho = للتنبيه: Iki enak lho = إنه لذيذ حقًا! وفي أول الجملة للدهشة: Lho, kowe neng kene?
    - kok = للتعجب والسؤال: Kok larang? = لماذا هو غالٍ هكذا؟ وفي آخر الجملة للطمأنة: Ora apa-apa kok.
    - ya / yo = لتلطيف الطلب: Sesuk ya! = غدًا، اتفقنا؟
    - sik (dhisik) = أولًا بعد الفعل: Mangan sik = كُل أولًا، ووحدها: Sik! = انتظر!
    - mbok = حثّ لطيف: Mbok mangan sik = لِمَ لا تأكل أولًا؟
    - je (يوجياكرتا) = للتوكيد في آخر الجملة: Aku ra ngerti je = لا أفهم حقًّا.
    وفي سورابايا يقال ae وsek، فاعرفهما سماعًا وتكلّم بلهجة يوجياكرتا وماديون.
  en: |
    These are the spices. Most sit at the end, and some you know from casual Indonesian:
    - to / ta = "…, right?" (kan?): Kowe wis mangan to? = You've eaten, right?
    - wae = "just" (saja): Aku teh wae = Just tea for me. Ngene wae = Just like this.
    - lho = "you know! / look!": Iki enak lho = This is really good, you know! At the start it's surprise: Lho, kowe neng kene? = Oh! You're here?
    - kok = "how come?!": Kok larang? = Why so expensive?! At the end it reassures: Ora apa-apa kok = It's fine, really.
    - ya / yo = softens a request: Sesuk ya! = Tomorrow, OK? A bare command sounds harsh.
    - sik (dhisik) = "first" after a verb: Mangan sik = Eat first. Alone: Sik! = Hold on! (as in "Sik, tak lapor").
    - mbok = gentle "why don't you": Mbok mangan sik = Why don't you eat first?
    - je (Jogja) = "really, you see" at the end: Aku ra ngerti je = I really don't get it.
    In Surabaya you'll hear ae for wae and sek for sik: understand them, but speak like Jogja and Madiun.
examples:
  - text: Kowe wis mangan to, Mas?
    breakdown: kowe = kamu · wis = sudah · mangan = makan · to = kan? · Mas
    en: You've eaten, right, Mas?
    ar_eg: كلت، مش كده يا ماس؟
    ar: أكلتَ، أليس كذلك يا ماس؟
    register: informal
  - text: Aku teh wae.
    breakdown: aku · teh · wae = saja
    en: Just tea for me.
    ar_eg: أنا شاي بس.
    ar: شايًا فقط من فضلك.
    register: informal
  - text: Kok larang, Mas?
    breakdown: kok = kok (how come) · larang = mahal · Mas
    en: How come it's so expensive, Mas?
    ar_eg: غالي كده ليه يا ماس؟
    ar: لماذا هو غالٍ هكذا يا أخي؟
    register: informal
  - text: Iki enak lho!
    breakdown: iki = ini · enak = enak · lho = lho
    en: This is really good, you know!
    ar_eg: ده حلو أوي على فكرة!
    ar: هذا لذيذ حقًا!
    register: informal
  - text: Aku mulih sik, ya.
    breakdown: aku · mulih = pulang · sik = dulu · ya
    en: I'm heading home now, OK?
    ar_eg: أنا هروّح بقى، ماشي؟
    ar: سأعود إلى البيت الآن، حسنًا؟
    register: informal
  - text: Mbok mangan sik.
    breakdown: mbok = coba / kenapa tidak · mangan = makan · sik = dulu
    en: Why don't you eat first?
    ar_eg: ما تاكل الأول!
    ar: لِمَ لا تأكل أولًا؟
    register: informal
  - text: Aku ra ngerti je.
    breakdown: aku · ra = ora = tidak · ngerti = mengerti · je = (Jogja) really
    en: I really don't get it. (Jogja)
    ar_eg: أنا مش فاهم والله.
    ar: لا أفهم حقًّا.
    register: informal
mistakes:
  - wrong: Kok larang? = "It's expensive, right?"
    right: Kok larang? = "How come it's so expensive?!"
    why:
      ar_eg: kok في الأول = دهشة / اعتراض، مش سؤال «مش كده؟». «مش كده؟» هي ta / to في الآخر.
      ar: kok في أول الجملة للتعجب والاعتراض، أما الاستيثاق فبـ ta / to في آخرها.
      en: Initial kok expresses surprise or protest; "…, right?" is ta / to at the end.
  - wrong: Teka sesuk! (bare, to a friend)
    right: Teka sesuk, ya.
    why:
      ar_eg: الأمر الجاوي من غير ya بيبان ناشف. ya بتخليه «تعالى بكرة، ماشي؟».
      ar: الأمر المجرد يبدو جافًا، وya تلطّفه.
      en: A bare command sounds harsh; ya softens it.
arabic_bridge:
  ar_eg: "زي المصري بالظبط: ta ≈ «ولا إيه؟»، lho ≈ «على فكرة»، kok ≈ «إيه ده؟! ليه؟»، ya ≈ «ماشي؟ / والنبي»، mbok ≈ «ما تاكل!»."
  ar: "تقابل هذه الأدوات ما في العامية من «ولا إيه» و«على فكرة» و«ما تيجي»، وهي تحمل النبرة لا المعنى المعجمي."
  en: "They mirror Egyptian «ولا إيه؟», «على فكرة», «ما تيجي!»: tone, not dictionary meaning."
tags: [particle, chat, tone, j1]
prerequisites: [jv.sentence.basic]
see_also: [jv.imperative.ngoko, jv.proclitic.tak-kok-di]
cues:
  - match: "sek|sik|dhisik|disik"
    note:
      ar_eg: "sik / dhisik = استنى لحظة / الأول (dulu). sek هي نطق سورابايا."
      ar: "sik / dhisik = لحظة / أولًا (dulu)، وsek نطق سورابايا."
      en: "sik / dhisik = hold on / first (dulu); sek is the Surabaya form."
  - match: "ta|to|tah"
    note:
      ar_eg: "ta / to في آخر الجملة = مش كده؟ (kan?)."
      ar: "ta / to = أليس كذلك؟ (kan?)."
      en: "ta / to at the end = right? (kan?)."
  - match: "ae|wae"
    note:
      ar_eg: "wae = بس / وخلاص (saja). ae هي نطق سورابايا."
      ar: "wae = فقط (saja)، وae نطق سورابايا."
      en: "wae = just (saja); ae is the Surabaya form."
  - match: "lho|kok|mbok|je"
    note:
      ar_eg: "أداة كلام: lho = على فكرة!، kok = إزاي كده؟، mbok = ما تـ... (اقتراح)، je = والله (يوجيا)."
      ar: "أداة تخاطب: lho للتنبيه، kok للاستغراب، mbok للاقتراح، je للتوكيد (يوجياكرتا)."
      en: "Particle: lho you know!, kok how come?, mbok why don't you, je really (Jogja)."
