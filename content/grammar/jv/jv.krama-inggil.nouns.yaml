schema: kabar.grammar/v1
id: jv.krama-inggil.nouns
language: jv
level: j4
title:
  target: asma · yuswa · dalem · asta · garwa · putra (tembung aran krama inggil)
  en: Honorific nouns — the respected person's name, age, home, body and family
  ar_eg: أسماء التبجيل — اسم الشخص المحترم وسنّه وبيته وجسمه وعيلته
  ar: أسماء التبجيل — اسم المعظَّم وعمره وبيته وجسده وأهله
summary:
  ar_eg: "مش الأفعال بس: حاجات الشخص المحترم ليها أسماء مرفوعة. اسمه asma، سنّه yuswa، بيته dalem، إيده asta، مراته / جوزها garwa، عياله putra. وحاجاتك إنت بأسمائها العادية: nami kula، griya kula."
  ar: "للمعظَّم أسماء رفيعة لأشيائه: اسمه asma، وعمره yuswa، وبيته dalem، ويده asta، وزوجه garwa، وولده putra. وأشياؤك بأسمائها العادية: nami kula، وgriya kula."
  en: "Not only verbs: a respected person's things have raised names. His name is asma, age yuswa, home dalem, hand asta, spouse garwa, children putra. Your own things keep plain names: nami kula, griya kula."
pattern:
  - "honorific noun + -ipun / -nipun (+ panjenengan / name): asmanipun · yuswanipun · dalemipun Bapak"
  - "name jeneng → nami → asma · age umur → yuswa · house omah → griya → dalem · person wong → tiyang → priyantun"
  - "family: anak → putra / putri · bojo → semah → garwa · bapak → rama · adhi → rayi · kakang, mas → raka · simbah → eyang"
  - "body: sirah → mustaka · rambut → rikma · mata → paningal, soca · irung → grana · tangan → asta · sikil → (suku) → ampeyan · awak → (badan) → salira"
  - "things: klambi → (rasukan) → ageman · panganan → (tedhan) → dhaharan · for: kanggo → kangge → kagem"
  - "your own: plain noun + kula — Nami kula … · Sirah kula sakit (never asma kula, mustaka kula)"
explanation:
  ar_eg: |
    في الوحدة اللي فاتت شفنا أفعال التبجيل. هنا نفس الفكرة بس للأسماء: كل حاجة «بتاعة» الشخص المحترم ليها اسم مرفوع.
    - الاسم: jeneng → nami → asma. «Asmanipun sinten?» = اسم حضرتك إيه؟
    - السن: umur → yuswa. «Yuswanipun Simbah pinten?» = جدّك عنده كام سنة؟
    - البيت: omah → griya → dalem. «Dalemipun pundi?» = حضرتك ساكن فين؟ (حرفيًا: بيت حضرتك فين؟)
    - العيلة: عياله putra / putri، مراته أو جوزها garwa، أبوه rama، أخوه الصغير rayi.
    - الجسم: إيده asta، راسه mustaka، شعره rikma، عينه paningal أو soca، رجله ampeyan، جسمه salira.
    - الأكل: dhaharan · اللبس: ageman · و«عشان / لـ»: kagem — «Menika kagem Bapak» = ده عشان حضرتك.
    وغالبًا بتلزق فيها -ipun / -nipun (زي -nya الإندونيسي): asmanipun، dalemipun، astanipun.
    القاعدة نفسها: حاجتك إنت بالكلمة العادية. «Nami kula Mohamed» مش «Asma kula». ولو راسك بتوجعك: «Sirah kula sakit»، مش «mustaka kula» — ده كأنك بتقول «رأسي الشريف».
    ملحوظة لطيفة: dalem ليها تلات معاني: بيت الشخص المحترم، و«أنا» المتواضعة، والرد «أفندم؟». السياق بيفرق.
  ar: |
    كما للأفعال صيغ تبجيل، فلأشياء المعظَّم أسماء رفيعة:
    - الاسم: jeneng → nami → asma: «Asmanipun sinten?» = ما اسمكم الكريم؟
    - العمر: umur → yuswa: «Yuswanipun Simbah pinten?»
    - البيت: omah → griya → dalem: «Dalemipun pundi?» = أين تسكنون؟
    - الأهل: putra / putri (الولد / البنت)، garwa (الزوج / الزوجة)، rama (الأب)، rayi (الأخ الأصغر).
    - الجسد: asta (اليد)، mustaka (الرأس)، rikma (الشعر)، paningal / soca (العين)، ampeyan (الرِّجل)، salira (البدن).
    - الطعام dhaharan، واللباس ageman، و«لأجل» kagem: «Menika kagem Bapak».
    ويلحقها غالبًا -ipun / -nipun (كـ -nya الإندونيسية): asmanipun، dalemipun.
    وأشياؤك أنت بالألفاظ العادية: «Nami kula …» لا «asma kula»، و«Sirah kula sakit» لا «mustaka kula».
    ولكلمة dalem ثلاثة معانٍ: بيت المعظَّم، و«أنا» المتواضعة، وجواب النداء «أفندم؟».
  en: |
    The last unit raised verbs; this one raises nouns. Anything belonging to the respected person gets a raised name.
    - name: jeneng → nami → asma. "Asmanipun sinten?" = What is your name?
    - age: umur → yuswa. "Yuswanipun Simbah pinten?" = How old is Grandpa?
    - home: omah → griya → dalem. "Dalemipun pundi?" = Where do you live? (lit. where is your home?)
    - family: their children putra / putri, spouse garwa, father rama, younger sibling rayi.
    - body: hand asta, head mustaka, hair rikma, eye paningal or soca, foot ampeyan, body salira.
    - food dhaharan, clothes ageman, and "for": kagem — "Menika kagem Bapak" = this is for you, sir.
    They usually take -ipun / -nipun (like Indonesian -nya): asmanipun, dalemipun, astanipun.
    Same rule as with verbs: your own things keep the plain word. "Nami kula Mohamed", not "asma kula". If your head hurts: "Sirah kula sakit", never "mustaka kula" — that's like saying «رأسي الشريف».
    Fun fact: dalem has three jobs — the elder's house, humble "I", and the reply "yes?" when called. Context decides.
examples:
  - text: Nyuwun sewu, asmanipun sinten?
    breakdown: nyuwun sewu = permisi · asma + -nipun = namanya (honorific) · sinten = siapa
    en: Excuse me, what is your name? (to an elder)
    ar_eg: لا مؤاخذة، اسم حضرتك إيه؟
    ar: عفوًا، ما اسمكم الكريم؟
    register: formal
  - text: Yuswanipun Simbah pinten?
    breakdown: yuswa + -nipun = umurnya (honorific) · Simbah · pinten = berapa
    en: How old is Grandma / Grandpa?
    ar_eg: تيتة عندها كام سنة؟
    ar: كم عمر الجدة؟
    register: formal
  - text: Dalemipun Bapak tebih saking ngriki?
    breakdown: dalem + -ipun = rumahnya (honorific) · Bapak · tebih = jauh · saking ngriki = dari sini
    en: Is your house far from here, sir?
    ar_eg: بيت حضرتك بعيد عن هنا؟
    ar: هل بيتكم بعيد عن هنا؟
    register: formal
  - text: Bapak kagungan putra pinten?
    breakdown: kagungan = punya (krama inggil) · putra = anak (krama inggil) · pinten = berapa
    en: How many children do you have, sir?
    ar_eg: حضرتك عندك كام ولد؟
    ar: كم ولدًا لديكم؟
    register: formal
  - text: Astanipun Simbah sakit.
    breakdown: asta + -nipun = tangannya (honorific) · Simbah · sakit
    en: Grandma's hand hurts.
    ar_eg: إيد تيتة بتوجعها.
    ar: يد الجدة تؤلمها.
    register: formal
  - text: Menika kagem Ibu.
    breakdown: menika = ini · kagem = untuk (krama inggil) · Ibu
    en: This is for you, ma'am.
    ar_eg: ده عشان حضرتك يا ماما / يا هانم.
    ar: هذا لكِ يا سيدتي.
    register: formal
mistakes:
  - wrong: Asma kula Mohamed.
    right: Nami kula Mohamed.
    why:
      ar_eg: asma تكريم لاسم التاني. اسمك إنت nami.
      ar: asma لاسم المعظَّم، واسمك أنت nami.
      en: asma honours someone else's name; yours is nami.
  - wrong: Mustaka kula sakit.
    right: Sirah kula sakit.
    why:
      ar_eg: أسماء الجسم المرفوعة للشخص المحترم بس. راسك إنت sirah حتى وانت بتتكلم كراما.
      ar: أسماء الجسد الرفيعة للمعظَّم وحده، ورأسك sirah ولو تكلمت بالكراما.
      en: Raised body words are for the respected person only; your own head is sirah even in krama.
  - wrong: Griyanipun Simbah wonten pundi?
    right: Dalemipun Simbah wonten pundi?
    why:
      ar_eg: griya كراما عادية، تنفع لبيتك. بيت الجد المحترم dalem.
      ar: griya كراما عادية تصلح لبيتك، أما بيت الجد فـ dalem.
      en: griya is plain krama (fine for your house); a grandparent's home is dalem.
  - wrong: Anakipun Bapak pinten?
    right: Putranipun Bapak pinten?
    why:
      ar_eg: "عيال الشخص المحترم putra. عيالك إنت: anak kula."
      ar: أولاد المعظَّم putra، وأولادك anak kula.
      en: A respected person's children are putra; yours are anak kula.
arabic_bridge:
  ar_eg: "بتفكّرك بـ«اسمك الكريم» و«حرمك المصون» و«نجل سيادتك» — ألفاظ تكريم بنستخدمها للتاني بس. بس عندنا دي عبارات للمناسبات، وعند الجاويين دي الكلام العادي مع أي حد كبير."
  ar: "تشبه «اسمكم الكريم» و«حرمكم المصون» و«نجلكم»، ألفاظ تُقال للآخر لا للنفس؛ غير أنها عندنا للمناسبات، وعند الجاويين هي الكلام اليومي مع الكبار."
  en: "Think «اسمك الكريم», «حرمك المصون», «نجل سيادتك»: honorifics for others only. In Arabic they're ceremonial; in Javanese they're everyday speech with any elder."
