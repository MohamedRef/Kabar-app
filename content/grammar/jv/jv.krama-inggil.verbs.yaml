schema: kabar.grammar/v1
id: jv.krama-inggil.verbs
language: jv
level: j4
title:
  target: dhahar · tindak · sare · rawuh · kondur · ngendika (tembung kriya krama inggil)
  en: Honorific verbs (krama inggil) — for the other person's actions only
  ar_eg: أفعال التبجيل (krama inggil) — لأفعال الشخص المحترم بس
  ar: أفعال التبجيل (krama inggil) — لأفعال المُعظَّم وحده
summary:
  ar_eg: "krama inggil مش ضمير، ده فعل كامل بيتغير عشان يكرّم اللي بيعمله: Bapak dhahar (بيتفضل ياكل) بدل mangan، Ibu tindak بدل lunga، Simbah sare بدل turu. وعمرها ما تتقال عن نفسك."
  ar: "krama inggil ألفاظ أفعال كاملة تتبدل لتعظيم الفاعل: Bapak dhahar بدل mangan، وIbu tindak بدل lunga، وSimbah sare بدل turu. ولا تُستعمل للمتكلم أبدًا."
  en: "Krama inggil is a set of whole replacement verbs that honour the person doing the action: Bapak dhahar (not mangan), Ibu tindak (not lunga), Simbah sare (not turu). Never use them about yourself."
pattern:
  - "respected person + krama inggil verb: Bapak dhahar · Ibu tindak · Simbah sare"
  - "you / yourself + plain krama verb: kula nedha · kula kesah · kula tilem"
  - "eat mangan → nedha → dhahar · drink ngombe → nginum → ngunjuk"
  - "sleep turu → tilem → sare · bathe adus → (adus) → siram · wake up tangi → wungu"
  - "go lunga → kesah → tindak · go home mulih → wangsul → kondur · come teka → dhateng → rawuh"
  - "sit lungguh → linggih → lenggah · stand ngadeg → jumeneng · stop by mampir → pinarak"
  - "say kandha → sanjang → ngendika / dhawuh · ask takon → taken → ndangu · see ndeleng → ningali → mirsani · know ngerti → mangertos → pirsa"
  - "buy / take tuku, njupuk → tumbas, mendhet → mundhut · give menehi → maringi · want gelem → purun → kersa · have duwe → gadhah → kagungan"
  - "invitation: Mangga lenggah / pinarak / dhahar · Mangga diunjuk · farewell: Sugeng tindak · welcome: Sugeng rawuh"
explanation:
  ar_eg: |
    في J3 اتعلمنا إن الكراما بتغيّر الكلمات. دلوقتي الطبقة اللي فوقها: krama inggil.
    الفكرة: فيه أفعال ليها نسخة «مرفوعة» بتستخدمها بس لما الفاعل حد بتحترمه (أبوك، جدة صاحبك، مدرسك، ضيف كبير).
    عندنا في المصري بنقول «اتفضل» أو «حضرتك تشرب إيه؟» بدل «تشرب إيه؟» — بنكرّم بإضافة كلمة. الجاوي بيعمل حاجة أقوى: الفعل نفسه بيتبدّل بكلمة تانية خالص:
    - ياكل: mangan (نغوكو) → nedha (كراما) → dhahar (krama inggil)
    - ينام: turu → tilem → sare
    - يروح: lunga → kesah → tindak
    - يرجع البيت: mulih → wangsul → kondur
    - ييجي / يوصل: teka → dhateng → rawuh («Sugeng rawuh» = أهلًا وسهلًا)
    - يقعد: lungguh → linggih → lenggah («Mangga lenggah» = اتفضل اقعد)
    - يقول: kandha → sanjang → ngendika (ويأمر / يوجّه: dhawuh)
    - يسأل: takon → taken → ndangu · يشوف: ndeleng → ningali → mirsani · يعرف: ngerti → mangertos → pirsa
    - يشتري / ياخد: tuku / njupuk → tumbas / mendhet → mundhut · يدّي: menehi → maringi
    - يحب / يرضى: gelem → purun → kersa · يملك: duwe → gadhah → kagungan
    - يستحمى: adus → siram (ومفيش كراما عادية: لنفسك قول adus حتى وانت مؤدب)
    القاعدة الذهبية: الكلمات دي «هدية» للتاني. عن نفسك استخدم الكراما العادية: «Kula sampun nedha»، «Kula badhe kesah». لو قلت «kula dhahar» كأنك بتقول «أنا تفضّلت بالأكل» — دي أشهر غلطة للأجانب.
    ومش لازم تكون بتكلّم الشخص ده: لو بتحكي عنه برضه بتكرّمه: «Bapak saweg sare» = بابا نايم (بأدب).
    وخلي بالك: tindak بتغطي «يروح» و«يمشي» و«يسافر»، فهتسمعها كتير.
  ar: |
    عرفنا في J3 أن الكراما تبدّل المفردات، وهذه طبقة أعلى: krama inggil.
    لبعض الأفعال صيغة رفيعة تُستعمل فقط إذا كان الفاعل شخصًا موقَّرًا (الأب، الجدة، المعلم، الضيف الكبير).
    ففي العربية نوقّر بإضافة لفظ («تفضّل»، «حضرتك»)، أما الجاوية فتستبدل الفعل كله:
    - يأكل: mangan → nedha → dhahar
    - ينام: turu → tilem → sare
    - يذهب: lunga → kesah → tindak
    - يعود إلى البيت: mulih → wangsul → kondur
    - يأتي / يصل: teka → dhateng → rawuh («Sugeng rawuh» = أهلًا وسهلًا)
    - يجلس: lungguh → linggih → lenggah («Mangga lenggah» = تفضّل بالجلوس)
    - يقول: kandha → sanjang → ngendika، ويأمر: dhawuh
    - يسأل: ndangu، ويرى: mirsani، ويعلم: pirsa، ويشتري / يأخذ: mundhut، ويعطي: maringi، ويريد: kersa، ويملك: kagungan
    - يستحم: siram، ولا كراما عادية له، فيقول المتكلم adus عن نفسه.
    والقاعدة الذهبية: هذه الألفاظ تكريم للآخر؛ أما عن نفسك فاستعمل الكراما العادية: «Kula sampun nedha». وقول «kula dhahar» خطأ الأجانب الأشهر.
    ويُكرَّم الموقَّر حتى لو كان غائبًا: «Bapak saweg sare» = أبي نائم.
  en: |
    J3 showed that krama swaps words. This is the layer above it: krama inggil.
    Some verbs have a "raised" version that you use only when the doer is someone you honour (your father, a friend's grandmother, a teacher, an older guest).
    Egyptian Arabic honours by adding a word («اتفضل», «حضرتك تشرب إيه؟»). Javanese goes further: the verb itself is replaced:
    - eat: mangan (ngoko) → nedha (krama) → dhahar (krama inggil)
    - sleep: turu → tilem → sare
    - go: lunga → kesah → tindak
    - go home / return: mulih → wangsul → kondur
    - come / arrive: teka → dhateng → rawuh ("Sugeng rawuh" = welcome)
    - sit: lungguh → linggih → lenggah ("Mangga lenggah" = please sit)
    - say: kandha → sanjang → ngendika (instruct: dhawuh)
    - ask: takon → taken → ndangu · see: ndeleng → ningali → mirsani · know: ngerti → mangertos → pirsa
    - buy / take: tuku / njupuk → tumbas / mendhet → mundhut · give: menehi → maringi
    - want: gelem → purun → kersa · have: duwe → gadhah → kagungan
    - bathe: adus → siram (no separate krama: about yourself say adus even when being polite)
    Golden rule: these words are a gift to the other person. About yourself use plain krama: "Kula sampun nedha", "Kula badhe kesah". "Kula dhahar" sounds like "I graciously dined" — the classic foreigner's slip.
    You honour the person even when you only talk about them: "Bapak saweg sare" = Father is sleeping.
    Note that tindak covers go, walk and travel, so you'll hear it everywhere.
examples:
  - text: Panjenengan sampun dhahar, Pak?
    breakdown: panjenengan · sampun = sudah · dhahar = makan (krama inggil) · Pak
    en: Have you eaten, sir?
    ar_eg: حضرتك أكلت يا أستاذ؟
    ar: هل تفضّلتَ بالأكل يا سيدي؟
    register: formal
  - text: Inggih, Pak, kula sampun nedha.
    breakdown: inggih = ya · kula · sampun · nedha = makan (krama, for yourself)
    en: Yes, sir, I've eaten.
    ar_eg: أيوه يا أستاذ، أنا أكلت.
    ar: نعم يا سيدي، قد أكلتُ.
    register: formal
  - text: Bapak saweg sare.
    breakdown: Bapak · saweg = sedang · sare = tidur (krama inggil)
    en: Father is sleeping.
    ar_eg: بابا نايم (بأدب).
    ar: أبي نائم.
    register: formal
  - text: Sugeng rawuh, Bu. Mangga lenggah.
    breakdown: sugeng = selamat · rawuh = datang (krama inggil) · mangga = silakan · lenggah = duduk (krama inggil)
    en: Welcome, ma'am. Please have a seat.
    ar_eg: أهلًا وسهلًا يا هانم، اتفضلي اقعدي.
    ar: أهلًا وسهلًا يا سيدتي، تفضّلي بالجلوس.
    register: formal
  - text: Bapak sampun kondur?
    breakdown: Bapak · sampun = sudah · kondur = pulang (krama inggil)
    en: Has Father come home yet? / Are you back home, sir?
    ar_eg: بابا رجع البيت؟
    ar: هل عاد الوالد إلى البيت؟
    register: formal
  - text: Panjenengan kersa ngunjuk teh?
    breakdown: panjenengan · kersa = mau (krama inggil) · ngunjuk = minum (krama inggil) · teh
    en: Would you like to drink some tea?
    ar_eg: حضرتك تحب تشرب شاي؟
    ar: هل تودّون شرب الشاي؟
    register: formal
mistakes:
  - wrong: Kula sampun dhahar.
    right: Kula sampun nedha.
    why:
      ar_eg: dhahar تكريم للتاني. عن نفسك nedha. «kula dhahar» كأنك بتعظّم نفسك.
      ar: dhahar للتعظيم، فلا تُقال عن النفس؛ والصواب nedha.
      en: dhahar honours the other person; about yourself use nedha.
  - wrong: Kula badhe tindak dhateng peken.
    right: Kula badhe kesah dhateng peken.
    why:
      ar_eg: tindak للشخص المحترم بس. إنت kesah.
      ar: tindak للمعظَّم، والمتكلم يقول kesah.
      en: tindak is for the respected person; you kesah.
  - wrong: Bapak saweg turu.
    right: Bapak saweg sare.
    why:
      ar_eg: saweg كراما، بس turu نغوكو، والأب بيستاهل sare. خلط المستويات كده بيطلع ناشز.
      ar: الجملة كراما وturu من النغوكو، والأب يستحق sare.
      en: The sentence is krama but turu is ngoko, and a father gets sare.
  - wrong: Mangga, Pak, mangan rumiyin.
    right: Mangga, Pak, dhahar rumiyin.
    why:
      ar_eg: لما تعزم على حد كبير، الفعل لازم يكون krama inggil (dhahar).
      ar: عند دعوة الكبير يكون الفعل krama inggil (dhahar).
      en: When you invite an elder, the verb should be krama inggil (dhahar).
arabic_bridge:
  ar_eg: "زي «اتفضّل» و«حضرتك» بالظبط في الروح: تكريم للتاني بس، وعمرك ما تقول «أنا اتفضّلت». الفرق إن الجاوي مش بيضيف كلمة، ده بيبدّل الفعل نفسه — زي ما الفصحى عندها «تفضّل بالجلوس» بدل «اقعد»."
  ar: "روحها كروح «تفضّل» و«حضرتك»: تكريم للآخر لا للنفس. لكن الجاوية تستبدل الفعل نفسه، كما نقول «تفضّل بالجلوس» بدل «اجلس»."
  en: "Same spirit as «اتفضّل» / «حضرتك»: honour for the other, never for yourself. But Javanese swaps the verb itself, like MSA «تفضّل بالجلوس» replacing «اقعد»."
