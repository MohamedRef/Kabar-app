schema: kabar.grammar/v1
id: jv.aspect.wis-durung-lagi-arep
language: jv
level: j1
title:
  target: wis, durung, lagi, arep (isih)
  en: "Time words: already, not yet, in the middle of, going to"
  ar_eg: "كلمات الزمن: خلاص، لسه، بـ، هـ"
  ar: "ألفاظ الزمن: قد، لمّا، الآن، سوف"
summary:
  ar_eg: "زي الإندونيسي بالظبط، الفعل مابيتغيرش: wis = sudah، durung = belum، lagi = sedang، arep = akan / mau، isih = masih. في سورابايا: wes وkate."
  ar: "كما في الإندونيسية لا يتصرف الفعل: wis = sudah، durung = belum، lagi = sedang، arep = akan / mau، isih = masih. وفي سورابايا: wes وkate."
  en: "Exactly as in Indonesian, the verb never changes: wis = sudah, durung = belum, lagi = sedang, arep = akan / mau, isih = masih. Surabaya says wes and kate."
pattern:
  - "subject + wis / durung / lagi / arep / isih + verb"
  - "wis (sudah) · Arek / chat: wes, ws"
  - "durung (belum) · lagi (sedang) · isih (masih)"
  - "arep (akan, mau) · chat arp · Arek: kate"
  - "Wis …? → Wis. / Durung."
explanation:
  ar_eg: |
    إنت عارف الفكرة من الإندونيسي، هنا بس الكلمات جديدة:
    - wis = sudah (خلاص / بالفعل): Aku wis mangan = Saya sudah makan = كلت خلاص. في سورابايا والشات: wes.
    - durung = belum (لسه ماحصلش): Aku durung mangan = لسه ماكلتش. وهو الرد المؤدب على «Wis …?» بدل ora.
    - lagi = sedang (بيعمل دلوقتي): Aku lagi maca buku = بقرا كتاب دلوقتي. ونفس الكلمة lagi موجودة في الإندونيسي العامي!
    - arep = akan / mau (هـ / ناوي): Aku arep nang pasar = هروح السوق. في الشات arp، وفي سورابايا kate: Kate nang endi? = رايح فين؟
    - isih = masih (لسه مستمر): Dheweke isih turu = لسه نايم.
    بونص: «wis» لوحدها كمان معناها «خلاص / كفاية / يلا باي»: Wis ya! = خلاص بقى، سلام!
  ar: |
    الفكرة معروفة من الإندونيسية، والجديد هو الألفاظ:
    - wis = sudah (قد / تمّ): Aku wis mangan = قد أكلت. وفي سورابايا والدردشة wes.
    - durung = belum (لمّا / ليس بعد): Aku durung mangan = لم آكل بعد، وهو الجواب المهذب عن «Wis …?».
    - lagi = sedang (يفعل الآن): Aku lagi maca buku = أقرأ كتابًا الآن، وlagi موجودة في الإندونيسية العامية أيضًا.
    - arep = akan / mau (سوف / ينوي): Aku arep nang pasar = سأذهب إلى السوق، وفي الدردشة arp، وفي سورابايا kate.
    - isih = masih (ما زال): Dheweke isih turu = ما زال نائمًا.
    وتأتي wis وحدها بمعنى «كفى / انتهى / إلى اللقاء»: Wis ya!
  en: |
    You know the idea from Indonesian; only the words are new:
    - wis = sudah (already): Aku wis mangan = Saya sudah makan. Surabaya and chats: wes.
    - durung = belum (not yet): Aku durung mangan = I haven't eaten yet. It's the polite answer to "Wis …?" instead of ora.
    - lagi = sedang (in the middle of): Aku lagi maca buku = I'm reading a book. Indonesian slang uses lagi the same way!
    - arep = akan / mau (going to): Aku arep nang pasar = I'm going to the market. Chat arp; Surabaya kate: Kate nang endi? = Where are you off to?
    - isih = masih (still): Dheweke isih turu = He's still asleep.
    Bonus: wis on its own also means "that's it / enough / bye": Wis ya! = OK, that's it, bye!
examples:
  - text: Kowe wis mangan? — Durung.
    breakdown: kowe = kamu · wis = sudah · mangan = makan · durung = belum
    en: Have you eaten? — Not yet.
    ar_eg: كلت؟ — لسه.
    ar: هل أكلت؟ — ليس بعد.
    register: informal
  - text: Aku lagi maca buku.
    breakdown: aku = saya · lagi = sedang · maca = membaca · buku = buku
    en: I'm reading a book.
    ar_eg: أنا بقرا كتاب دلوقتي.
    ar: أنا أقرأ كتابًا الآن.
    register: informal
  - text: Aku arep nang pasar.
    breakdown: aku · arep = mau / akan · nang = ke · pasar
    en: I'm going to the market.
    ar_eg: أنا رايح السوق.
    ar: سأذهب إلى السوق.
    register: informal
  - text: Kate nang endi, rek?
    breakdown: kate = mau (Arek) · nang = ke · endi = mana · rek = guys
    en: Where are you off to, mate? (Surabaya Arek)
    ar_eg: رايح فين يا صاحبي؟
    ar: إلى أين أنت ذاهب يا صاح؟
    register: informal
  - text: Dheweke isih turu.
    breakdown: dheweke = dia · isih = masih · turu = tidur
    en: He / She is still asleep.
    ar_eg: لسه نايم / نايمة.
    ar: ما زال نائمًا.
    register: informal
mistakes:
  - wrong: Wis mangan? — Ora.
    right: Durung.
    why:
      ar_eg: "زي belum في الإندونيسي: «لسه» أطبع وأدق من «لأ»."
      ar: كما في belum الإندونيسية، «ليس بعد» أدق وألطف من «لا».
      en: As with belum, "not yet" is the natural, polite answer — not a flat "no".
  - wrong: Aku mangan wis.
    right: Aku wis mangan.
    why:
      ar_eg: الكلمات دي بتيجي قبل الفعل، زي sudah في الإندونيسي.
      ar: تأتي هذه الألفاظ قبل الفعل كما تأتي sudah في الإندونيسية.
      en: These words go before the verb, like Indonesian sudah.
arabic_bridge:
  ar_eg: "wis ≈ «خلاص»، durung ≈ «لسه»، lagi ≈ «بـ» في «بياكل»، arep ≈ «هـ» في «هاكل». أدوات قبل الفعل بالظبط زي المصري."
  ar: "wis ≈ «قد»، durung ≈ «لمّا»، arep ≈ «سوف»: أدوات منفصلة تسبق الفعل الذي لا يتغير."
  en: "wis ≈ «خلاص», durung ≈ «لسه», lagi ≈ Egyptian «بـ», arep ≈ «هـ»: particles before an unchanging verb."
tags: [aspect, time, verb, ngoko, arek, j1]
prerequisites: [id.aspect.markers]
see_also: [jv.marker.vs-indonesian, jv.krama.function-words, jv.negation.ora-dudu]
cues:
  - match: "wis|uwis|wes"
    note:
      ar_eg: "wis = خلاص حصل (sudah)."
      ar: "wis = قد حدث (sudah)."
      en: "wis = already (sudah)."
  - match: "durung"
    note:
      ar_eg: "durung = لسه ما حصلش (belum)."
      ar: "durung = لم يحدث بعد (belum)."
      en: "durung = not yet (belum)."
  - match: "lagi"
    note:
      ar_eg: "lagi + فعل = بيعمل دلوقتي (sedang)."
      ar: "lagi + فعل = يفعل الآن (sedang)."
      en: "lagi + verb = is doing now (sedang)."
  - match: "arep|arp|ape"
    note:
      ar_eg: "arep + فعل = هـ / ناوي (akan / mau)."
      ar: "arep + فعل = سـ / ينوي (akan / mau)."
      en: "arep + verb = going to / want to (akan / mau)."
  - match: "isih|isik"
    note:
      ar_eg: "isih = لسه (masih)."
      ar: "isih = ما زال (masih)."
      en: "isih = still (masih)."
review:
  status: draft
  verified: false
  notes: Draft by Claude; awaits review by a Javanese speaker (Arek kate and wes especially).
