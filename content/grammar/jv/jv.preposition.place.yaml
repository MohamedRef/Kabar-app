schema: kabar.grammar/v1
id: jv.preposition.place
language: jv
level: j1
title:
  target: neng, menyang, ing, saka · kene, kono, kana
  en: "To, at, from — and here, there"
  ar_eg: "لـ، في، من — وهنا وهناك"
  ar: "حروف المكان: إلى، في، من — وهنا وهناك"
summary:
  ar_eg: "neng بتغطي ke وdi مع بعض: neng pasar = للسوق أو في السوق. saka = dari (من). kene / kono / kana = sini / situ / sana."
  ar: "neng تقابل ke وdi معًا، وsaka = dari، وkene / kono / kana = sini / situ / sana."
  en: "neng covers both ke and di: neng pasar = to or at the market. saka = dari. kene / kono / kana = sini / situ / sana."
pattern:
  - "neng + place = ke / di (direction or location; context decides) · chat: ng"
  - "menyang + place = ke (more careful speech) · ing + place = di (formal, written)"
  - "saka + place = dari"
  - "neng kene / kono / kana = di sini / situ / sana"
  - "neng + ngarep / mburi / jejere / ndhuwur / ngisor / njero + noun-e (depan / belakang / sebelah / atas / bawah / dalam)"
  - "directions: ngiwa (ke kiri) · nengen (ke kanan) · lurus (lurus)"
explanation:
  ar_eg: |
    في الإندونيسي فيه ke (لـ) وdi (في). الجاوي العادي بيستخدم كلمة واحدة للاتنين:
    - neng: Aku arep neng pasar = رايح السوق (ke)، Aku neng pasar = أنا في السوق (di). السياق هو اللي بيفرّق. (في سورابايا بيقولوا nang.)
      في الشات بتتكتب ng: «ng prabowo?» = neng Prabowo? = لبرابوو؟
    - menyang = ke في كلام أكثر عناية، وing = di في الكتابة والكلام الرسمي (ing Ngayogyakarta = في يوجياكرتا).
    - saka = dari (من). Aku saka Mesir = أنا من مصر.
    - kene = sini (هنا)، kono = situ (هناك قريب)، kana = sana (هناك بعيد): neng kene = هنا.
    - أماكن حوالين حاجة: ngarep (قدام)، mburi (ورا)، jejere (جنب)، ndhuwur (فوق)، ngisor (تحت)، njero (جوه): neng ngarep stasiun = قدام المحطة.
    - اتجاهات: ngiwa = شمال، nengen = يمين، lurus = على طول.
  ar: |
    في الإندونيسية ke (إلى) وdi (في)، أما النغوكو فيستعمل لفظًا واحدًا لهما:
    - neng: Aku arep neng pasar = سأذهب إلى السوق، وAku neng pasar = أنا في السوق، والسياق يفرّق. وفي الدردشة ng، وفي سورابايا nang.
    - menyang = ke في الكلام المتأني، وing = di في الكتابة والمقام الرسمي.
    - saka = dari (من).
    - kene = sini (هنا)، kono = situ (هناك القريب)، kana = sana (هناك البعيد).
    - ظروف المكان: ngarep (أمام)، mburi (خلف)، jejere (بجانب)، ndhuwur (فوق)، ngisor (تحت)، njero (داخل).
    - الاتجاهات: ngiwa = يسارًا، nengen = يمينًا، lurus = إلى الأمام مباشرة.
  en: |
    Indonesian has ke (to) and di (at). Everyday Javanese uses one word for both:
    - neng: Aku arep neng pasar = I'm going to the market (ke); Aku neng pasar = I'm at the market (di). Context decides. (Surabaya says nang.)
      Chats write ng: "ng prabowo?" = neng Prabowo? = To Prabowo?
    - menyang = ke in more careful speech; ing = di in writing and formal speech (ing Ngayogyakarta = in Yogyakarta).
    - saka = dari (from). Aku saka Mesir = I'm from Egypt.
    - kene = sini (here), kono = situ (there, near you), kana = sana (over there): neng kene = here.
    - Around things: ngarep (in front), mburi (behind), jejere (next to), ndhuwur (above), ngisor (below), njero (inside): neng ngarep stasiun = in front of the station.
    - Directions: ngiwa = (turn) left, nengen = (turn) right, lurus = straight on.
examples:
  - text: ng prabowo?
    breakdown: ng = neng (ke) · Prabowo = a name
    en: To Prabowo? (chat)
    ar_eg: لبرابوو؟
    ar: إلى برابوو؟
    register: chat
  - text: Aku arep neng Malioboro.
    breakdown: aku · arep = mau · neng = ke · Malioboro
    en: I'm going to Malioboro.
    ar_eg: أنا رايح ماليوبورو.
    ar: سأذهب إلى ماليوبورو.
    register: informal
  - text: Sari neng omah.
    breakdown: Sari · neng = di · omah = rumah
    en: Sari is at home.
    ar_eg: ساري في البيت.
    ar: ساري في البيت.
    register: informal
  - text: Kowe saka ngendi?
    breakdown: kowe = kamu · saka = dari · ngendi = mana
    en: Where are you from?
    ar_eg: إنت منين؟
    ar: من أين أنت؟
    register: informal
  - text: Lurus wae, terus ngiwa. Warunge neng jejere masjid.
    breakdown: lurus · wae = saja · terus = lalu · ngiwa = belok kiri · warung + -e · neng = di · jejere = sebelah · masjid
    en: Go straight, then left. The stall is next to the mosque.
    ar_eg: على طول، وبعدين شمال. المحل جنب الجامع.
    ar: امشِ مباشرة ثم انعطف يسارًا، والكشك بجانب المسجد.
    register: informal
mistakes:
  - wrong: Aku mulih neng saka pasar.
    right: Aku mulih saka pasar.
    why:
      ar_eg: neng (لـ) وsaka (من) عكس بعض، ماينفعوش مع بعض. اختار واحدة.
      ar: neng (إلى) وsaka (من) متقابلتان فلا تجتمعان.
      en: neng (to) and saka (from) are opposites; pick one. Aku mulih saka pasar = I'm coming home from the market.
  - wrong: Aku neng kono = "I'm over there, far away."
    right: Aku neng kana (far) · Aku neng kono (there, near you)
    why:
      ar_eg: kono = هناك قريب منك (زي situ)، kana = بعيد عننا الاتنين (زي sana).
      ar: kono للبعيد عن المتكلم القريب من المخاطب (situ)، وkana للبعيد عنهما (sana).
      en: kono is "there, near you" (situ); kana is "far from both of us" (sana).
arabic_bridge:
  ar_eg: "neng بتشتغل زي المصري «في» و«لـ» مع بعض في كلام سريع (رايح السوق / في السوق: نفس الكلمة). وsaka = «من»."
  ar: "تقابل neng معنيي «إلى» و«في» بحسب السياق، وsaka = «من»."
  en: "neng does the work of both «إلى» and «في»; saka = «من»."
tags: [preposition, place, directions, j1]
prerequisites: [id.preposition.di-ke-dari, id.demonstrative.sini-situ-sana]
see_also: [jv.demonstrative, jv.chat.normalize]
cues:
  - match: "nang|neng|menyang|nyang|ing"
    note:
      ar_eg: "neng = في أو لـ (di / ke). nang هي نطق سورابايا."
      ar: "neng = في أو إلى (di / ke)، وnang نطق سورابايا."
      en: "neng = at / to (di / ke); nang is the Surabaya form."
  - match: "saka|teko"
    note:
      ar_eg: "saka = من (dari). teko هي نفس الكلمة بلهجة سورابايا."
      ar: "saka = من (dari)، وteko بمعناها في لهجة سورابايا."
      en: "saka = from (dari); teko is the Surabaya form."
  - match: "kene|kono|kana"
    note:
      ar_eg: "kene = هنا، kono = هناك، kana = هناك بعيد."
      ar: "kene = هنا، kono = هناك، kana = هنالك."
      en: "kene = here, kono = there, kana = over there."
review:
  status: draft
  verified: false
  notes: Draft by Claude; awaits review by a Javanese speaker. Rewritten for Jogja + Madiun speech (2026-10-27); neng is taught, nang is only the Surabaya form to recognise.
