cues:
  - match: "kula"
    note:
      ar_eg: "kula = أنا، كراما مهذبة."
      ar: "kula = أنا، بالكراما."
      en: "kula = I, krama."
  - match: "sampeyan"
    note:
      ar_eg: "sampeyan = حضرتك، كراما عادية."
      ar: "sampeyan = أنت، بالكراما."
      en: "sampeyan = you, plain krama."
  - match: "panjenengan"
    note:
      ar_eg: "panjenengan = حضرتك، أعلى احترام (كراما إنجيل)."
      ar: "panjenengan = حضرتك، بالكراما إنغيل."
      en: "panjenengan = you, most respectful (krama inggil)."
  - match: "piyambakipun|panjenenganipun"
    note:
      ar_eg: "هو / هي بالكراما."
      ar: "هو / هي بالكراما."
      en: "he / she, krama."
