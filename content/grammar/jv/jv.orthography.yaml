schema: kabar.grammar/v1
id: jv.orthography
language: jv
level: j5
title:
  target: pira / piro · dh / d · th / t · e / é / è (ejaan basa Jawa)
  en: Standard spelling vs how it sounds — a / o, dh / d, th / t, and the three e's
  ar_eg: الإملا الرسمي ضد النطق — a / o وdh / d وth / t وأنواع الـ e التلاتة
  ar: الإملاء القياسي والنطق — a / o وdh / d وth / t وأصوات e الثلاثة
summary:
  ar_eg: "الجاوي المكتوب صح مش دايمًا زي ما بيتنطق: pira بتتنطق «پيرو»، sega «سِغو». الشات بيكتب piro وsego، بس الإملا الرسمي a. وdh وth أصوات «تقيلة» (اللسان بيرجع لورا) غير d وt: wedi = خايف، wedhi = رملة."
  ar: "لا يطابق الإملاء الجاوي القياسي النطق دائمًا: تُكتب pira وتُنطق قريبًا من «پيرو»، وsega «سِغو»، والدردشة تكتب piro وsego. وdh وth صوتان ارتداديان يختلفان عن d وt: wedi = خائف، وwedhi = رمل."
  en: "Standard Javanese spelling doesn't always match the sound: pira is said like 'piro', sega like 'sego'. Chats write piro and sego; standard spelling writes a. And dh, th are retroflex sounds (tongue curled back), different from d, t: wedi = afraid, wedhi = sand."
pattern:
  - "a in a final open syllable sounds like o: pira [piro] · sega [səgo] · apa [opo] · lara [loro]"
  - "if the last two syllables both have a, both sound o: lara, apa, kana · chat writes loro, opo, kono"
  - "real o stays o in standard spelling: loro (two) ≠ lara (sick) · kono (there) ≠ kana (over there)"
  - "dental d / t (tongue on the teeth, like Arabic د / ت) vs retroflex dh / th (tongue tip curled back)"
  - "minimal pairs: wedi (afraid) / wedhi (sand) · pati (death) / pathi (starch)"
  - "e has three sounds, all written e: é (sare, gedhe) · è (sewu, ndherek) · ê / pepet (sega, telu) — dictionaries add the marks"
  - "chat ↔ standard: opo → apa · sego → sega · ojo → aja · nggih → inggih · monggo → mangga · dewe → dhewe"
explanation:
  ar_eg: |
    في J1 شفنا الشات بيكتب piro وopo. الوحدة دي بتوريك ليه، وإزاي ترجّع الكلمة لإملاها الرسمي.
    1. الـ a اللي بتتنطق o:
       في آخر الكلمة لو المقطع مفتوح، الـ a بتتنطق قريب من o (زي o في «يا لهوي» تقريبًا، صوت بين a وo): pira = «پيرو»، sega = «سِغو». ولو المقطعين الأخيرين الاتنين فيهم a، الاتنين بيتنطقوا o: apa = «أوپو»، lara = «لورو».
       الإملا الرسمي بيكتب a؛ الشات بيكتب o. فلما تلاقي opo / piro / sego / ojo، رجّعها apa / pira / sega / aja.
       بس خد بالك: فيه كلمات الـ o فيها أصلية وبتتكتب o رسمي: loro = اتنين، غير lara = عيان. kono = هناك (قريب)، غير kana = هناك (بعيد). عشان كده ماينفعش تقلب كل o لـ a بشكل أعمى.
    2. d / dh و t / th:
       d وt الجاوية «سنّية»: اللسان على الأسنان، زي د وت عندنا بالظبط.
       dh وth «ارتدادية»: طرف اللسان بيترفع ويرجع لورا لسقف الحلق. صوت تقيل، بس مش زي ض وط العربي (مفيش تفخيم في الحلق).
       وخلي بالك: th الجاوية مش ث، وdh مش ذ! dh = d تقيلة، th = t تقيلة.
       أزواج بتفرق المعنى: wedi (خايف) / wedhi (رملة)، pati (موت) / pathi (نشا).
       الشات غالبًا بيكتب dh وth من غير h: dewe بدل dhewe. القاموس هو المرجع.
    3. الـ e التلاتة: الإملا العادي بيكتبهم كلهم e:
       - é (زي «بيت» بالمصري): sare، gedhe
       - è (مفتوحة، زي e في «يس» بالإنجليزي): sewu، ndherek
       - ê / pepet (زي الحركة الخفيفة في «بِنت» السريعة، تقريبًا ə): sega، telu، lemu
       القواميس والمنهج بيكتبوا é وè عشان تعرف النطق (saré، sèwu)، بس في الكتابة العادية مش بتتكتب.
  ar: |
    1. a المنطوقة o: في المقطع الأخير المفتوح تُنطق a قريبة من o: pira «پيرو»، وsega «سِغو»، وإذا اشتمل المقطعان الأخيران على a نُطقتا o: apa «أوپو»، lara «لورو». والإملاء القياسي يكتب a، والدردشة o؛ فـ opo / piro / sego / ojo تُردّ إلى apa / pira / sega / aja.
       لكن بعض الكلمات أصلها o فتُكتب o: loro = اثنان غير lara = مريض، وkono = هناك (قريب) غير kana = هناك (بعيد).
    2. d وt أسنانيتان كالدال والتاء، وdh وth ارتداديتان يُرفع فيهما طرف اللسان إلى الخلف دون تفخيم الضاد والطاء. وليست th ثاءً ولا dh ذالًا.
       أزواج فارقة: wedi (خائف) / wedhi (رمل)، pati (موت) / pathi (نشا). والدردشة كثيرًا ما تحذف h: dewe بدل dhewe.
    3. للحرف e ثلاثة أصوات تُكتب كلها e: é المغلقة (sare، gedhe)، وè المفتوحة (sewu)، والمهموسة ê (sega، telu). وتضع المعاجم العلامات للتمييز.
  en: |
    In J1 chats wrote piro and opo. This unit explains why, and how to restore standard spelling.
    1. a that sounds like o:
       In a final open syllable, a is said close to o: pira ≈ "piro", sega ≈ "sego". If the last two syllables both have a, both sound o: apa ≈ "opo", lara ≈ "loro".
       Standard spelling writes a; chats write o. So when you see opo / piro / sego / ojo, restore apa / pira / sega / aja.
       Careful: some words have a real o, written o in standard spelling too: loro = two, not lara = sick; kono = there (near you), not kana = over there. So don't blindly flip every o.
    2. d / dh and t / th:
       Javanese d and t are dental: tongue on the teeth, exactly like Arabic د and ت.
       dh and th are retroflex: the tongue tip curls back toward the roof of the mouth. They sound "heavy", but they are not Arabic ض / ط (no throat emphasis).
       And th is not ث, dh is not ذ! dh = heavy d, th = heavy t.
       Pairs that change meaning: wedi (afraid) / wedhi (sand), pati (death) / pathi (starch).
       Chats often drop the h: dewe for dhewe. The dictionary is your reference.
    3. Three e's, all written e in ordinary spelling:
       - é (like Egyptian «بيت»): sare, gedhe
       - è (open, like English "yes"): sewu, ndherek
       - ê / pepet (a short schwa, ə): sega, telu, lemu
       Dictionaries and the curriculum mark é and è to show pronunciation (saré, sèwu), but everyday writing doesn't.
examples:
  - text: Regane pira?
    breakdown: rega + -ne = harganya · pira = berapa (said "piro")
    en: How much is it? (chat would write "regane piro?")
    ar_eg: بكام؟ (في الشات «regane piro?»)
    ar: بكم ثمنه؟ (وفي الدردشة «regane piro?»)
    register: neutral
  - text: Aku ora wedi.
    breakdown: aku · ora = tidak · wedi = takut (dental d)
    en: I'm not afraid.
    ar_eg: أنا مش خايف.
    ar: لستُ خائفًا.
    register: informal
  - text: Bocah-bocah dolanan wedhi.
    breakdown: bocah-bocah = anak-anak · dolanan = bermain · wedhi = pasir (retroflex dh)
    en: The children are playing with sand.
    ar_eg: العيال بيلعبوا بالرملة.
    ar: الأطفال يلعبون بالرمل.
    register: informal
  - text: Adhiku lara, ora bisa teka.
    breakdown: adhi + -ku = adikku · lara = sakit (said "loro") · ora bisa teka = tidak bisa datang
    en: My little brother is sick and can't come.
    ar_eg: أخويا الصغير عيان ومش هيقدر ييجي.
    ar: أخي الصغير مريض ولا يستطيع الحضور.
    register: informal
  - text: Anakku loro.
    breakdown: anak + -ku · loro = dua (a real o)
    en: I have two children.
    ar_eg: عندي ولدين.
    ar: لديّ ولدان.
    register: informal
  - text: "chat: ojo lali, sego ne wes mateng → standard: Aja lali, segane wis mateng."
    breakdown: ojo = aja (jangan) · lali = lupa · sego ne = segane (nasinya) · wes = wis (sudah) · mateng = matang
    en: Don't forget, the rice is cooked.
    ar_eg: ماتنساش، الرز استوى.
    ar: لا تنسَ، الأرز قد نضج.
    register: chat
mistakes:
  - wrong: Anakku lara. (meaning "I have two children")
    right: Anakku loro.
    why:
      ar_eg: lara = عيان، وloro = اتنين. في النطق قريبين، بس في الكتابة مختلفين.
      ar: lara = مريض، وloro = اثنان؛ يتقاربان نطقًا ويختلفان كتابة.
      en: lara = sick, loro = two; they sound close but are spelled differently.
  - wrong: Pronouncing wedhi like Arabic «وذي» (with ذ).
    right: dh is a retroflex d (tongue tip curled back), not ذ.
    why:
      ar_eg: الـ h بعد d مش بتعمل ذ زي الإنجليزي. هي بتقول «d تقيلة».
      ar: الهاء بعد d لا تجعلها ذالًا، بل تدل على دال ارتدادية.
      en: The h after d doesn't make ذ; it marks a retroflex d.
  - wrong: Normalising every chat o to a (kono → kana).
    right: Check the dictionary — kono and kana are different words.
    why:
      ar_eg: مش كل o في الشات أصلها a. kono (هناك جنبك) غير kana (هناك بعيد).
      ar: ليس كل o في الدردشة أصلها a؛ فـ kono غير kana.
      en: Not every chat o is an a; kono (there, near you) and kana (over there) are different words.
arabic_bridge:
  ar_eg: "d وt الجاوية = د وت بتوعنا. بس dh وth مش ذ وث! هما «d وt تقيلة» واللسان راجع لورا — قريبين في الإحساس من ض وط بس من غير تفخيم الحلق. والبيجون نفسها بتكتبهم ڎ وڟ (د وط بتلات نقط) — دليل إن الجاويين نفسهم سمعوهم «تقال»."
  ar: "d وt الجاويتان كالدال والتاء، أما dh وth فليستا ذالًا وثاءً، بل دالًا وتاءً ارتداديتين أقرب في الإحساس إلى الضاد والطاء بلا تفخيم؛ ولذلك تكتبهما البيجون ڎ وڟ."
  en: "Javanese d and t = Arabic د and ت. But dh and th are not ذ and ث! They are heavy, retroflex d / t — closer in feel to ض / ط without the throat emphasis. Pegon even writes them ڎ and ڟ (د and ط with three dots)."
tags: [spelling, pronunciation, chat, minimal-pair, j5]
prerequisites: [jv.chat.normalize]
see_also: [jv.codemix, jv.reading.written-style, jv.pegon.basics, jv.aksara.sandhangan-swara]
review:
  status: draft
  verified: false
  notes: >-
    Draft by Claude; awaits review by a Javanese speaker. Please check the minimal pairs wedi / wedhi and pati / pathi,
    lara / loro and kana / kono, the a → o rule as stated (final open syllable; both of the last two syllables),
    the é / è / ê examples (sare, gedhe, sewu, ndherek, sega, telu, lemu), and the Arabic comparisons of dh / th.
    The curriculum's example pair "dhadha / dada" was not used: dada is not a confirmed separate Javanese word.
