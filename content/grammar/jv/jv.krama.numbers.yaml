  verified: false
  notes: Draft by Claude; awaits review by a Javanese speaker. Krama teens (11–19), 21–29 apart from selangkung, and krama for 'million' were left out as unconfirmed; please check kalih dasa / sekawan dasa, kemawon, saged and angsal.
