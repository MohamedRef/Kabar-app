cues:
  - match: "pakdhe|budhe|paklik|bulik|simbah|mbah|simbok|mbakyu"
    class: noun
    note:
      ar_eg: "قرابة: pakdhe عم كبير، budhe عمة كبيرة، paklik / bulik العم والخالة الصغيرين، simbah جد أو جدة."
      ar: "قرابة: pakdhe العم الأكبر، budhe العمة الكبرى، paklik / bulik الأصغر، simbah الجد."
      en: "Family: pakdhe / budhe older uncle / aunt, paklik / bulik younger ones, simbah grandparent."
