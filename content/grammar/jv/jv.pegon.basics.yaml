see_also: [jv.aksara.nglegena]
review:
  status: draft
  verified: false
  notes: >-
    Draft by Claude; awaits review by a Javanese speaker who reads Pegon. Only letters Claude is confident of are included.
    Please check: ga as ڮ (U+06AE) vs ݢ (U+0762) and nya as ۑ (U+06D1) vs ڽ (U+06BD) — the curriculum lists ڮ and ڽ; this
    entry gives ڮ and ۑ as the usual Java forms and ݢ / ڽ as Malay Jawi forms, which needs confirming; vowel spelling (é with ي,
    o with و, word-initial alif) since conventions vary between pesantren; the example spellings اكو ڠاجي، ساڤا، چارا جاوا، ڎاڎا،
    ڤاڟي، ڮولا، ۑاتا، ايكي، اورا; the makna gandul gloss "utawi sakabehe puji iku kagungane Allah" and the م / خ abbreviations;
    and the claim that Arabic loanwords keep their Arabic spelling.
