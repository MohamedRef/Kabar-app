schema: kabar.grammar/v1
id: jv.negation.ora-dudu
language: jv
level: j1
title:
  target: ora / ra (tidak) · dudu (bukan)
  en: "Saying no: ora, ra and dudu"
  ar_eg: "النفي: ora وra وdudu"
  ar: "النفي: ora وra وdudu"
summary:
  ar_eg: "زي tidak وbukan بالظبط: ora (وفي الشارع ra) قبل الفعل والصفة، وdudu قبل الاسم. Aku ora ngerti = مش فاهم. Iki dudu kopiku = دي مش قهوتي."
  ar: "كما في tidak وbukan: ora (وفي الكلام الدارج ra) قبل الفعل والصفة، وdudu قبل الاسم."
  en: "Exactly like tidak and bukan: ora (on the street: ra) before verbs and adjectives, dudu before nouns. Aku ora ngerti = I don't understand. Iki dudu kopiku = This isn't my coffee."
pattern:
  - "ora + verb / adjective (= tidak) · spoken and chat: ra (Aku ra ngerti)"
  - "dudu + noun / pronoun (= bukan)"
  - "ora ana, spoken ra ana (= tidak ada) · ora apa-apa, chat rapopo (= tidak apa-apa)"
explanation:
  ar_eg: |
    إنت عارف من الإندونيسي إن فيه نفيين: tidak للفعل والصفة، وbukan للاسم. الجاوي نفس الحكاية:
    - ora = tidak: Aku ora ngerti = Saya tidak mengerti = مش فاهم. Ora larang = مش غالي.
    - في الشارع في يوجيا وماديون ora بتتقصّر لـ ra: Aku ra ngerti = مش فاهم. Ra popo = ولا يهمك. اكتبها ora، وقولها ra مع الصحاب.
    - dudu = bukan: Iki dudu kopiku = Ini bukan kopiku = دي مش قهوتي. Dudu aku! = مش أنا!
    - ora ana = tidak ada (مفيش)، وبتتقال ra ana.
    - ora apa-apa = tidak apa-apa (مفيش مشكلة / ولا يهمك). في الشات rapopo أو gpp.
    وفاكر durung (لسه) من درس wis / durung — دي نفي برضه بس معناها «لسه».
  ar: |
    للإندونيسية نفيان: tidak للفعل والصفة، وbukan للاسم، والجاوية كذلك:
    - ora = tidak: Aku ora ngerti = لا أفهم، Ora larang = ليس غاليًا. 
    - وفي الكلام الدارج في يوجياكرتا وماديون تُختصر ora إلى ra: Aku ra ngerti، Ra popo.
    - dudu = bukan: Iki dudu kopiku = هذه ليست قهوتي، Dudu aku = لستُ أنا.
    - ora ana = tidak ada (لا يوجد)، وتُنطق ra ana.
    - ora apa-apa = لا بأس، وفي الدردشة rapopo.
    وdurung (لم ... بعد) نفي أيضًا لكن بمعنى «ليس بعد».
  en: |
    Indonesian has two negators: tidak for verbs and adjectives, bukan for nouns. Javanese does the same:
    - ora = tidak: Aku ora ngerti = Saya tidak mengerti = I don't understand. Ora larang = Not expensive.
    - On the street in Jogja and Madiun ora shrinks to ra: Aku ra ngerti = I don't get it. Ra popo = No worries. Write ora; say ra with friends. (Surabaya says gak instead; recognise it, don't copy it.)
    - dudu = bukan: Iki dudu kopiku = Ini bukan kopiku = This isn't my coffee. Dudu aku! = Not me!
    - ora ana = tidak ada (there isn't); spoken ra ana.
    - ora apa-apa = tidak apa-apa (no problem). Chat: rapopo or gpp.
    And remember durung (not yet) from the wis / durung lesson.
examples:
  - text: Aku ora ngerti.
    breakdown: aku · ora = tidak · ngerti = mengerti
    en: I don't understand. (standard ngoko)
    ar_eg: أنا مش فاهم.
    ar: لا أفهم.
    register: informal
  - text: Aku ra ngerti, cah.
    breakdown: aku · ra = ora = tidak · ngerti = mengerti · cah = guys
    en: I don't get it, guys. (street ngoko)
    ar_eg: أنا مش فاهم يا جماعة.
    ar: لا أفهم يا جماعة.
    register: informal
  - text: Iki dudu kopiku.
    breakdown: iki = ini · dudu = bukan · kopi + -ku
    en: This isn't my coffee.
    ar_eg: دي مش قهوتي.
    ar: هذه ليست قهوتي.
    register: informal
  - text: Regane ora larang.
    breakdown: rega + -ne = harganya · ora = tidak · larang = mahal
    en: The price isn't expensive.
    ar_eg: السعر مش غالي.
    ar: السعر ليس غاليًا.
    register: informal
  - text: Rapopo, Mas.
    breakdown: rapopo = ora apa-apa (tidak apa-apa) · Mas
    en: It's fine, no problem. (chat / casual)
    ar_eg: ولا يهمك يا أستاذ.
    ar: لا بأس يا أخي.
    register: chat
mistakes:
  - wrong: Aku dudu ngerti.
    right: Aku ora ngerti.
    why:
      ar_eg: ngerti فعل، والفعل بيتنفي بـ ora (زي tidak)، مش dudu.
      ar: ngerti فعل فيُنفى بـ ora لا بـ dudu.
      en: ngerti is a verb, so it takes ora (like tidak), not dudu.
  - wrong: Iki ora kopiku.
    right: Iki dudu kopiku.
    why:
      ar_eg: kopi اسم، والاسم بيتنفي بـ dudu (زي bukan).
      ar: kopi اسم فيُنفى بـ dudu كما في bukan.
      en: kopi is a noun, so it takes dudu (like bukan).
arabic_bridge:
  ar_eg: "في المصري «مش» بتنفي كل حاجة («مش فاهم»، «مش أنا»)، وده اللي بيلخبطنا. الجاوي بيفرّق زي الفصحى شوية: ora ≈ «لا» قبل الفعل، dudu ≈ «ليس» قبل الاسم."
  ar: "تنفي «مش» المصرية كل شيء، أما الجاوية ففيها ora للفعل والصفة (≈ لا) وdudu للاسم (≈ ليس)."
  en: "Egyptian «مش» negates everything, which is why Arabic speakers mix these up. Javanese splits: ora for verbs (≈ لا), dudu for nouns (≈ ليس)."
tags: [negation, ngoko, j1]
prerequisites: [id.negation.tidak-bukan, jv.sentence.basic]
see_also: [jv.aspect.wis-durung-lagi-arep, jv.imperative.ngoko, jv.krama.function-words]
cues:
  - match: "ora|ra|gak"
    note:
      ar_eg: "ora / ra = مش / ما (tidak). gak هي نفس الكلمة بلهجة سورابايا."
      ar: "ora / ra = لا / ليس (tidak)، وgak بمعناها في لهجة سورابايا."
      en: "ora / ra = not (tidak); gak is the Surabaya form."
  - match: "dudu"
    note:
      ar_eg: "dudu = مش، لنفي الاسم (bukan)."
      ar: "dudu = ليس، لنفي الاسم (bukan)."
      en: "dudu = not, for nouns (bukan)."
