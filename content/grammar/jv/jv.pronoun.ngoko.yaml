cues:
  - match: "aku"
    note:
      ar_eg: "aku = أنا."
      ar: "aku = أنا."
      en: "aku = I."
  - match: "kowe|koe|koen|awakmu"
    note:
      ar_eg: "kowe = إنت (نجوكو، مع القريبين). koen / awakmu = نفس المعنى بلهجة سورابايا."
      ar: "kowe = أنت (نغوكو)، وkoen / awakmu بمعناها في لهجة سورابايا."
      en: "kowe = you (ngoko); koen / awakmu are the Surabaya forms."
  - match: "dheweke|deweke"
    note:
      ar_eg: "dheweke = هو / هي."
      ar: "dheweke = هو / هي."
      en: "dheweke = he / she."
