schema: kabar.grammar/v1
id: jv.pronoun.ngoko
language: jv
level: j1
title:
  target: aku, kowe, dheweke, awake dhewe
  en: Ngoko pronouns (I, you, he/she, we)
  ar_eg: الضماير في النغوكو (الجاوي العادي بين الصحاب)
  ar: الضمائر في مستوى النغوكو
summary:
  ar_eg: "aku = أنا، kowe = إنت (Indonesian kamu)، dheweke = هو/هي (dia). ولحد أكبر منك sampeyan. ومفيش مذكر ومؤنث، زي الإندونيسي بالظبط."
  ar: "aku = أنا، وkowe = أنت (kamu)، وdheweke = هو/هي (dia)، وللأكبر سنًّا sampeyan. ولا تمييز بين المذكر والمؤنث."
  en: "aku = I, kowe = you (Indonesian kamu), dheweke = he/she (dia); sampeyan for someone older. No gender, just like Indonesian."
pattern:
  - "I: aku (same word as Indonesian aku)"
  - "you: kowe (friends, younger people) · sampeyan (polite everyday: older people, strangers, sellers)"
  - "he / she: dheweke (standard; chat deweke)"
  - "we: awake dhewe (also heard as dhewe, awak dhewe)"
  - "you all: kowe kabeh · they: dheweke kabeh, wong-wong kuwi"
  - "my / your: noun + -ku / -mu (jenengku, omahmu), as in Indonesian"
explanation:
  ar_eg: |
    النغوكو (ngoko) هو الجاوي «العادي»: بتكلم بيه صحابك، ناس في سنك، أو حد أصغر منك. وده اللي بنبدأ بيه في J1.
    - aku = أنا. نفس الكلمة اللي في الإندونيسي، بس هنا هي الطبيعية مع أي حد قريب. saya كلمة إندونيسية، ماتدخلهاش في جملة نغوكو.
    - kowe = إنت / إنتِ (زي kamu). القاموس بيحط علامة على الـ e، وإحنا بنكتبها kowe زي الناس.
    - sampeyan = «حضرتك» اليومية: لحد أكبر منك أو مش عارفه، زي البيّاع في السوق. هنفهمها أكتر في J3.
    - dheweke = هو / هي (زي dia).
    - awake dhewe = إحنا (أقرب لـ kita). النغوكو مابيفرّقش بوضوح بين kami وkita زي الإندونيسي، السياق هو اللي بيوضح.
    - الجمع: kowe kabeh = إنتوا (kalian)، dheweke kabeh = هم (mereka). kabeh = semua.
    - بتاعي / بتاعك: -ku و-mu زي الإندونيسي بالظبط: jenengku = اسمي، omahmu = بيتك.
    مهم: kowe للصحاب بس. مع حد كبير في السن قول sampeyan أو Pak / Bu. (في سورابايا هتسمع koen وawakmu بمعنى kowe.)
  ar: |
    النغوكو (ngoko) هو المستوى العادي من الجاوية، يُستعمل مع الأصدقاء والأقران ومن هو أصغر سنًا، وبه نبدأ في J1.
    - aku = أنا، وهي الكلمة نفسها في الإندونيسية، لكنها هنا الضمير الطبيعي مع القريب. أما saya فإندونيسية ولا تدخل جملة نغوكو.
    - kowe = أنتَ / أنتِ (kamu)، وتضع المعاجم علامة على الـ e.
    - sampeyan = «أنت» المهذبة اليومية للأكبر سنًّا أو الغريب أو البائع (يُفصَّل في J3).
    - dheweke = هو / هي (dia).
    - awake dhewe = نحن (أقرب إلى kita)، ولا يفرق النغوكو بوضوح بين kami وkita، والسياق يحدد.
    - الجمع: kowe kabeh = أنتم (kalian)، dheweke kabeh = هم (mereka)، وkabeh = semua.
    - الملكية: -ku و-mu كما في الإندونيسية: jenengku = اسمي، omahmu = بيتك.
    تنبيه: kowe للأقران فقط، ومع الأكبر سنًا يقال sampeyan أو Pak / Bu. (وفي سورابايا يقال koen وawakmu بمعنى kowe.)
  en: |
    Ngoko is plain, everyday Javanese: for friends, people your age and younger people. J1 is all ngoko.
    - aku = I. Same word as Indonesian aku, and here it's the normal "I" with anyone close. Don't drop Indonesian saya into a ngoko sentence.
    - kowe = you (= kamu). Dictionaries put an accent on the e; Kabar writes kowe, like everyday writing.
    - sampeyan = the everyday polite "you", for older people, strangers and sellers (more in J3).
    - dheweke = he / she (= dia).
    - awake dhewe = we (closest to kita). Ngoko doesn't split kami / kita the way Indonesian does; context decides.
    - Plurals: kowe kabeh = you all (kalian), dheweke kabeh = they (mereka); kabeh = semua.
    - my / your: -ku and -mu, exactly as in Indonesian: jenengku = my name, omahmu = your house.
    Keep kowe for friends. To an older person say sampeyan or Pak / Bu. (In Surabaya you'll hear koen and awakmu for kowe.)
examples:
  - text: Aku Mohamed, saka Mesir.
    breakdown: aku = saya / aku · saka = dari · Mesir
    en: I'm Mohamed, from Egypt.
    ar_eg: أنا محمد، من مصر.
    ar: أنا محمد، من مصر.
    register: informal
  - text: Kowe wis mangan?
    breakdown: kowe = kamu · wis = sudah · mangan = makan
    en: Have you eaten? (standard ngoko)
    ar_eg: كلت؟
    ar: هل أكلت؟
    register: informal
  - text: Kowe wis mangan to, cah?
    breakdown: kowe = kamu · wis = sudah · mangan = makan · to = kan? / ya? · cah = guys, mate
    en: You've eaten, right, mate?
    ar_eg: كلت ولا إيه يا صاحبي؟
    ar: هل أكلت يا صاحبي؟
    register: informal
  - text: Sampeyan saka ngendi, Mas?
    breakdown: sampeyan = Anda / Mas · saka = dari · ngendi = mana
    en: Where are you from? (polite everyday "you")
    ar_eg: حضرتك منين يا أستاذ؟
    ar: من أين حضرتك؟
    register: informal
  - text: Dheweke kancaku.
    breakdown: dheweke = dia · kanca = teman · -ku = -ku
    en: He / She is my friend.
    ar_eg: هو / هي صاحبي.
    ar: هو صديقي / هي صديقتي.
    register: informal
mistakes:
  - wrong: Saya ora ngerti.
    right: Aku ora ngerti.
    why:
      ar_eg: saya إندونيسي، وora جاوي. في جملة نغوكو بنقول aku.
      ar: saya إندونيسية وora جاوية، والجملة النغوكو تقتضي aku.
      en: saya is Indonesian and ora is Javanese; a ngoko sentence takes aku.
  - wrong: Kowe arep neng ngendi? (to an older stranger)
    right: Sampeyan arep menyang ngendi, Pak?
    why:
      ar_eg: kowe مع حد كبير وغريب قليلة ذوق، زي ما تقول لراجل كبير «إنت» من غير «حضرتك».
      ar: مخاطبة الكبير الغريب بـ kowe قلة تأدب، والأليق sampeyan مع Pak.
      en: kowe to an older stranger is rude; use sampeyan plus Pak / Bu.
arabic_bridge:
  ar_eg: "زي العربي، الجاوي عنده «إنت» للصحاب (kowe) و«حضرتك» للكبار (sampeyan)، بس من غير مذكر ومؤنث. وكلمة kabar في «Piye kabare?» هي «خبر» العربية."
  ar: "كما في العربية، للجاوية «أنت» للأقران (kowe) و«حضرتك» للكبار (sampeyan)، لكن بلا تذكير ولا تأنيث."
  en: "Like Egyptian إنت vs حضرتك, Javanese has kowe for friends and sampeyan for elders — but with no gender at all."
