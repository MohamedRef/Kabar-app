schema: kabar.grammar/v1
id: jv.passive.written
language: jv
level: j5
title:
  target: di- … dening · dipun- · ka- · -in- (tinulis, sinebut)
  en: Written passives — di- … dening and the formal ka- / -in- forms
  ar_eg: المبني للمجهول المكتوب — di- … dening وصيغ ka- و-in- الرسمية
  ar: المبني للمجهول في الكتابة — di- … dening وصيغتا ka- و-in-
summary:
  ar_eg: "الأخبار بتحب المجهول: di- + فعل + dening + الفاعل = «اتعمل بواسطة …» (زي di- … oleh الإندونيسي). وفي الكراما dipun-. وفي الكتابة الرسمية والقديمة فيه ka- (kapilih = اتختار) و-in- جوه الكلمة (tinulis = مكتوب، sinebut = بيتسمّى)."
  ar: "تكثر الأخبار من المجهول: di- + الفعل + dening + الفاعل (كـ di- … oleh الإندونيسية)، وفي الكراما dipun-، وفي الرسمي والقديم ka- (kapilih = اختير) واللاحقة الداخلية -in- (tinulis = مكتوب، sinebut = يُسمّى)."
  en: "News loves the passive: di- + verb + dening + agent = 'was done by …' (like Indonesian di- … oleh). Krama uses dipun-. Formal and older writing adds ka- (kapilih = was chosen) and the infix -in- (tinulis = written, sinebut = called)."
pattern:
  - "object + di- + base (+ -ake / -i) + (dening + agent): Dalan iku didandani dening warga."
  - "krama: object + dipun- + base + (dening + agent): Seratipun sampun dipunwaos."
  - "formal ka-: kapilih (dipilih) · kaanggit (dikarang) · kasebut (disebut)"
  - "infix -in- after the first consonant: tulis → tinulis · sebut → sinebut · tata → tinata"
  - "agent is I / you: use tak- / kok- (dak- in writing), not dening aku: Buku iki dakwaca."
  - "dening is often dropped when the agent is obvious: Candhi iki dibangun ing abad kaping 9."
explanation:
  ar_eg: |
    اتعلمنا di- في J1 (diwaca = اتقرا). في الكتابة هتقابله في كل سطر تقريبًا، ومعاه dening اللي بتقول «بواسطة مين».
    1. di- + فعل + dening: «Dalan iku didandani dening warga» = الطريق اتصلّح على إيد الأهالي. زي الإندونيسي بالظبط: diperbaiki oleh warga. dening = oleh.
       ولو الفعل فيه -ake أو -i بيفضلوا: didandani، dikabarake.
    2. في الكراما: dipun- بدل di-، و-aken بدل -ake: «Seratipun sampun dipunwaos» = الجواب اتقرا خلاص.
    3. ka- (رسمي): kapilih = اتختار / اتنتخب، kaanggit = اتألّف، kasebut = المذكور. هتلاقيها في الأخبار والكتب: «kapilih dadi lurah» = اتنتخب عمدة.
    4. -in- جوه الكلمة (أدبي / قديم): بتدخل بعد أول حرف: tulis → tinulis (مكتوب)، sebut → sinebut (بيتسمّى)، tata → tinata (متنظّم). هتشوفها في الشعر وأسماء الكتب.
    مهم: لو الفاعل «أنا» أو «إنت»، الجاوي مش بيقول «dening aku». بيستخدم tak- / kok- (في الكتابة الرسمية dak-): «Buku iki dakwaca» = الكتاب ده أنا قريته.
    والعربي؟ عندنا المبني للمجهول بيتغير جوه الكلمة: كَتَبَ ← كُتِبَ، ومكتوب. -in- الجاوية شبهها شوية في الفكرة: تغيير جوه الكلمة نفسها مش بادئة.
  ar: |
    عرفنا di- في J1، وفي الكتابة يكثر مع dening الدالة على الفاعل:
    1. di- + الفعل + dening: «Dalan iku didandani dening warga» = أصلح الأهالي الطريق (كـ diperbaiki oleh warga)، وتبقى اللواحق -ake و-i.
    2. وفي الكراما dipun- و-aken: «Seratipun sampun dipunwaos».
    3. ka- الرسمية: kapilih = اختير، kaanggit = أُلِّف، kasebut = المذكور: «kapilih dadi lurah».
    4. -in- الداخلة بعد الحرف الأول (أدبية): tinulis = مكتوب، sinebut = يُسمّى، tinata = منظَّم.
    وإذا كان الفاعل المتكلم أو المخاطب فلا يقال «dening aku» بل tak- / kok- (وفي الكتابة dak-): «Buku iki dakwaca».
    وتشبه -in- في فكرتها بناء المجهول العربي بتغيير داخل الكلمة: كَتَب ← كُتِب.
  en: |
    You met di- in J1 (diwaca = is read). In writing it's on nearly every line, joined by dening ("by") for the agent.
    1. di- + verb + dening: "Dalan iku didandani dening warga" = the road was repaired by the residents. Exactly Indonesian diperbaiki oleh warga; dening = oleh.
       Suffixes -ake and -i stay: didandani, dikabarake.
    2. Krama: dipun- for di-, -aken for -ake: "Seratipun sampun dipunwaos" = the letter has been read.
    3. ka- (formal): kapilih = was chosen / elected, kaanggit = was composed, kasebut = the aforementioned. Common in news and books: "kapilih dadi lurah" = was elected village head.
    4. Infix -in- (literary / old): goes in after the first consonant: tulis → tinulis (written), sebut → sinebut (called), tata → tinata (arranged). You'll see it in poetry and book titles.
    Important: if the agent is "I" or "you", Javanese doesn't say "dening aku". It uses tak- / kok- (formal writing: dak-): "Buku iki dakwaca" = I read this book.
    Arabic link: Arabic makes passives inside the word (كَتَبَ → كُتِبَ). The Javanese -in- infix is a small cousin of that idea: a change inside the word, not a prefix.
examples:
  - text: Dalan iku didandani dening warga.
    breakdown: dalan = jalan · iku · di- + dandan + -i = diperbaiki · dening = oleh · warga
    en: The road was repaired by the residents.
    ar_eg: الطريق اتصلّح على إيد الأهالي.
    ar: أصلح الأهالي الطريق.
    register: formal
  - text: Layang iki ditulis dening Pak Budi.
    breakdown: layang = surat · iki · di- + tulis · dening · Pak Budi
    en: This letter was written by Pak Budi.
    ar_eg: الجواب ده كتبه الأستاذ بودي.
    ar: كتب هذه الرسالةَ السيدُ بودي.
    register: formal
  - text: Pak Harjo kapilih dadi lurah.
    breakdown: Pak Harjo · ka- + pilih = dipilih · dadi = menjadi · lurah = kepala desa
    en: Pak Harjo was elected village head.
    ar_eg: الأستاذ هارجو اتنتخب عمدة.
    ar: انتُخب السيد هارجو عمدةً.
    register: formal
  - text: Kutha iki sinebut Kutha Lumpia.
    breakdown: kutha = kota · iki · s-in-ebut = disebut · Kutha Lumpia
    en: This city is called the City of Lumpia. (a nickname of Semarang)
    ar_eg: المدينة دي بيسموها «مدينة اللومبيا».
    ar: تُسمّى هذه المدينة «مدينة اللومبيا».
    register: formal
  - text: Seratipun sampun dipunwaos.
    breakdown: serat + -ipun = suratnya (krama) · sampun = sudah · dipun- + waos = dibaca (krama)
    en: The letter has been read. (krama)
    ar_eg: الجواب اتقرا خلاص. (كراما)
    ar: قُرئت الرسالة. (كراما)
    register: formal
  - text: Buku iki dakwaca wingi.
    breakdown: buku iki · dak- + waca = saya baca (written spelling of tak-) · wingi = kemarin
    en: I read this book yesterday.
    ar_eg: الكتاب ده قريته امبارح.
    ar: قرأتُ هذا الكتاب أمس.
    register: formal
mistakes:
  - wrong: Buku iki diwaca dening aku.
    right: Buku iki dakwaca. / Buku iki takwaca.
    why:
      ar_eg: مع «أنا» الجاوي بيستخدم dak- / tak-، مش dening aku.
      ar: مع المتكلم تُستعمل dak- / tak- لا dening aku.
      en: With "I" as agent, Javanese uses dak- / tak-, not dening aku.
  - wrong: Reading "tinulis" as a verb root tinul + -is.
    right: tinulis = t-in-ulis = ditulis.
    why:
      ar_eg: -in- بتستخبى بعد أول حرف. شيلها ترجع للأصل tulis.
      ar: -in- تختبئ بعد الحرف الأول، وبحذفها يعود الجذر tulis.
      en: -in- hides after the first consonant; remove it to find tulis.
  - wrong: Seratipun sampun diwaos dening Bapak (mixing krama words with di-).
    right: Seratipun sampun dipunwaos dening Bapak.
    why:
      ar_eg: في الكتابة الكراما الرسمية البادئة dipun-. (في الكلام بتسمع di- كتير، بس في الكتابة dipun- أنضف.)
      ar: الكراما المكتوبة الرسمية تستعمل dipun-، وإن شاعت di- في الكلام.
      en: Formal written krama uses dipun-; spoken krama often keeps di-, but writing prefers dipun-.
arabic_bridge:
  ar_eg: "dening = «من قِبَل» أو «على يد»، بالظبط زي ما الجرايد عندنا بتقول «تم إصلاح الطريق من قِبَل الأهالي». و-in- اللي بتدخل جوه الكلمة (tinulis) فكرتها قريبة من «كُتِب» و«مكتوب»: التغيير جوه الكلمة."
  ar: "dening = «من قِبَل» كما في لغة الصحف: «تم إصلاح الطريق من قِبَل الأهالي»؛ و-in- الداخلية (tinulis) قريبة في فكرتها من «كُتِب»."
  en: "dening ≈ «من قِبَل» / «على يد», just like Arabic newspaper style. The -in- infix (tinulis) echoes Arabic's internal passive (كُتِب)."
tags: [passive, written-style, news, affix, j5]
prerequisites: [jv.proclitic.tak-kok-di, jv.krama.affixes, jv.reading.written-style]
see_also: [jv.suffix.ake, jv.suffix.i, id.passive.di, id.voice.active-passive]
cues:
  - match: "{di-} … dening"
    note:
      ar_eg: "di- + فعل ... dening = اتعمل بواسطة (مكتوب)."
      ar: "di- + فعل ... dening = فُعل بواسطة."
      en: "di- verb … dening = done by (written)."
review:
  status: draft
  verified: false
  notes: >-
    Draft by Claude; awaits review by a Javanese speaker. Please check kapilih, kaanggit, kasebut (ka- passive), tinata,
    sinebut, didandani, "Kutha Lumpia" as a nickname for Semarang, dak- as the written spelling of tak-, and whether "Seratipun sampun diwaos" is really common in speech.
    The table (speech-levels.jsonl) gives dipun- as the krama of di-; that is followed here.
