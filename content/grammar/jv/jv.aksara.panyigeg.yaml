schema: kabar.grammar/v1
id: jv.aksara.panyigeg
language: jv
level: j6
title:
  target: ꦁ cecak · ꦂ layar · ꦃ wignyan · ꧀ pangkon (sandhangan panyigeg)
  en: Closing a syllable — final ng, r, h and the vowel-killer pangkon
  ar_eg: قفل المقطع — ng وr وh في الآخر، والـ pangkon اللي بتموّت الحركة
  ar: إغلاق المقطع — ng وr وh الأخيرة، وpangkon مُسكِّنة الحرف
summary:
  ar_eg: "عشان تكتب حرف ساكن في آخر المقطع: ng = cecak ꦁ، r = layar ꦂ، h = wignyan ꦃ، وأي حرف تاني تحط عليه pangkon ꧀ (زي السكون) عشان يموت الـ a: ꦮꦪꦁ wayang، ꦥꦱꦂ pasar، ꦲꦺꦴꦩꦃ omah، ꦩꦔꦤ꧀ mangan."
  ar: "تُكتب الساكنة آخر المقطع بعلامات: ng بـ cecak ꦁ، وr بـ layar ꦂ، وh بـ wignyan ꦃ، وسائر الحروف بـ pangkon ꧀ (كالسكون): ꦮꦪꦁ wayang، ꦥꦱꦂ pasar، ꦲꦺꦴꦩꦃ omah، ꦩꦔꦤ꧀ mangan."
  en: "To write a consonant at the end of a syllable: ng = cecak ꦁ, r = layar ꦂ, h = wignyan ꦃ, and any other consonant takes pangkon ꧀ (like sukun) to kill its a: ꦮꦪꦁ wayang, ꦥꦱꦂ pasar, ꦲꦺꦴꦩꦃ omah, ꦩꦔꦤ꧀ mangan."
pattern:
  - "final ng: syllable + ꦁ cecak (above) — ꦮꦪꦁ wayang"
  - "final r: syllable + ꦂ layar (above) — ꦥꦱꦂ pasar"
  - "final h: syllable + ꦃ wignyan (after) — ꦲꦺꦴꦩꦃ omah"
  - "any other final consonant: letter + ꧀ pangkon — ꦩꦔꦤ꧀ mangan · ꦧꦥꦏ꧀ bapak"
  - "cecak / layar / wignyan also work in the middle of a word: ꦭꦸꦁꦒꦸꦃ lungguh"
  - "pangkon is used at the end of a word before a pause (comma, full stop); in the middle of a sentence the next consonant uses pasangan instead"
explanation:
  ar_eg: |
    لحد دلوقتي كل مقطع بيخلص بحركة (ka، ki، ko). بس كلمات كتير بتخلص بحرف ساكن: wayang، pasar، omah، mangan. هنا بييجي دور sandhangan panyigeg (علامات القفل).
    تلات حروف ليها علامة مخصوصة، عشان كتيرة جدًا في آخر المقاطع:
    - cecak ꦁ (فوق) = ng في الآخر: ꦮꦪꦁ = wayang، ꦱꦼꦤꦼꦁ = seneng (مبسوط).
    - layar ꦂ (فوق) = r في الآخر: ꦥꦱꦂ = pasar (سوق)، ꦩꦠꦸꦂ = matur.
    - wignyan ꦃ (بعد الحرف) = h في الآخر: ꦲꦺꦴꦩꦃ = omah (بيت)، ꦧꦺꦴꦕꦃ = bocah (عيل).
    وأي حرف ساكن تاني (n، k، t، m …): تكتب الحرف عادي وتحط عليه pangkon ꧀، وده بيشيل الـ a — بالظبط زي السكون عندنا: ꦩꦔꦤ꧀ = mangan (ياكل)، ꦧꦥꦏ꧀ = bapak.
    العلامات التلاتة الأولى بتشتغل كمان في نص الكلمة: ꦭꦸꦁꦒꦸꦃ = lungguh (يقعد): lu + cecak (ng) + gu + wignyan (h).
    بس pangkon ليها قاعدة: بتستخدمها في آخر الكلمة لما الكلام يقف (قبل فاصلة أو نقطة أو في آخر السطر). لو بعدها كلمة على طول بتبدأ بحرف ساكن، الجاوي بيستخدم «pasangan» (الدرس الجاي) بدل pangkon.
  ar: |
    كثير من الكلمات تنتهي بساكن: wayang، pasar، omah، mangan، فتُستعمل علامات الإغلاق (sandhangan panyigeg):
    - cecak ꦁ (فوق) = ng: ꦮꦪꦁ wayang، ꦱꦼꦤꦼꦁ seneng.
    - layar ꦂ (فوق) = r: ꦥꦱꦂ pasar، ꦩꦠꦸꦂ matur.
    - wignyan ꦃ (بعد الحرف) = h: ꦲꦺꦴꦩꦃ omah، ꦧꦺꦴꦕꦃ bocah.
    - وسائر السواكن تُكتب بالحرف مع pangkon ꧀ التي تحذف a كالسكون: ꦩꦔꦤ꧀ mangan، ꦧꦥꦏ꧀ bapak.
    وتعمل العلامات الثلاث الأولى وسط الكلمة أيضًا: ꦭꦸꦁꦒꦸꦃ lungguh.
    أما pangkon فتُستعمل في آخر الكلمة عند الوقف، فإن تلتها كلمة مبدوءة بساكن استُعملت pasangan بدلها.
  en: |
    So far every syllable ended in a vowel (ka, ki, ko). But many words end in a consonant: wayang, pasar, omah, mangan. Enter sandhangan panyigeg (closing marks).
    Three consonants have their own mark because they're so common at syllable ends:
    - cecak ꦁ (above) = final ng: ꦮꦪꦁ = wayang, ꦱꦼꦤꦼꦁ = seneng (happy).
    - layar ꦂ (above) = final r: ꦥꦱꦂ = pasar (market), ꦩꦠꦸꦂ = matur.
    - wignyan ꦃ (after the letter) = final h: ꦲꦺꦴꦩꦃ = omah (house), ꦧꦺꦴꦕꦃ = bocah (child).
    Any other final consonant (n, k, t, m …): write the letter and add pangkon ꧀, which removes the a — exactly like Arabic sukun: ꦩꦔꦤ꧀ = mangan (eat), ꦧꦥꦏ꧀ = bapak.
    The first three also work mid-word: ꦭꦸꦁꦒꦸꦃ = lungguh (sit): lu + cecak (ng) + gu + wignyan (h).
    Pangkon has a rule: use it at the end of a word where speech pauses (before a comma, full stop or line end). If a consonant-initial word follows directly, Javanese uses a "pasangan" (next unit) instead.
examples:
  - text: ꦮꦪꦁ (wayang)
    breakdown: ꦮ wa · ꦪ ya + ꦁ cecak → yang
    en: shadow puppet
    ar_eg: عروسة خيال الظل (وايانغ)
    ar: دمية خيال الظل
  - text: ꦥꦱꦂ (pasar)
    breakdown: ꦥ pa · ꦱ sa + ꦂ layar → sar
    en: market
    ar_eg: سوق
    ar: سوق
  - text: ꦲꦺꦴꦩꦃ (omah)
    breakdown: ꦲ ha + taling tarung → o · ꦩ ma + ꦃ wignyan → mah
    en: house (ngoko)
    ar_eg: بيت
    ar: بيت
  - text: ꦩꦔꦤ꧀ (mangan)
    breakdown: ꦩ ma · ꦔ nga · ꦤ na + ꧀ pangkon → n
    en: eat (ngoko)
    ar_eg: ياكل
    ar: يأكل
  - text: ꦭꦸꦁꦒꦸꦃ (lungguh)
    breakdown: ꦭ la + suku + ꦁ cecak → lung · ꦒ ga + suku + ꦃ wignyan → guh
    en: sit (ngoko)
    ar_eg: يقعد
    ar: يجلس
  - text: ꦧꦥꦏ꧀ (bapak)
    breakdown: ꦧ ba · ꦥ pa · ꦏ ka + ꧀ pangkon → k
    en: father / sir
    ar_eg: أب / أستاذ
    ar: أب / سيد
mistakes:
  - wrong: ꦮꦪꦔ꧀ for wayang (nga + pangkon).
    right: ꦮꦪꦁ — final ng is cecak.
    why:
      ar_eg: ng في الآخر ليها علامة مخصوصة (cecak)، مش ꦔ + pangkon.
      ar: لـ ng الأخيرة علامة خاصة هي cecak.
      en: Final ng has its own mark, cecak, not nga + pangkon.
  - wrong: ꦥꦱꦫ꧀ for pasar.
    right: ꦥꦱꦂ — final r is layar.
    why:
      ar_eg: r الساكنة بتتكتب layar فوق الحرف اللي قبلها.
      ar: r الساكنة تُكتب layar فوق الحرف السابق.
      en: A closing r is written as layar over the previous letter.
  - wrong: ꦩꦔꦤ (mangan without pangkon).
    right: ꦩꦔꦤ꧀
    why:
      ar_eg: من غير pangkon هتتقري «مانغانا». لازم «السكون».
      ar: بدون pangkon تُقرأ «mangana»، فلا بد من المُسكِّن.
      en: Without pangkon it reads "mangana"; you need the vowel killer.
arabic_bridge:
  ar_eg: "pangkon ꧀ = السكون بالظبط: بتشيل الحركة من الحرف. وcecak وlayar وwignyan زي اختصارات جاهزة لأكتر تلات سواكن بتقفل المقاطع (ng وr وh) — شبه ما التنوين بيوفّر عليك تكتب نون."
  ar: "pangkon ꧀ هي السكون بعينه، وcecak وlayar وwignyan اختصارات جاهزة لأكثر السواكن ورودًا في أواخر المقاطع (ng وr وh)، كما يغني التنوين عن كتابة النون."
  en: "pangkon ꧀ is exactly sukun: it strips the vowel. Cecak, layar and wignyan are ready-made shortcuts for the three most common closing consonants (ng, r, h) — a bit like tanwin saving you from writing a nun."
