schema: kabar.grammar/v1
id: jv.time.expressions
language: jv
level: j1
title:
  target: jam pira? · setengah, luwih, kurang · Senen … Minggu · Legi, Pahing, Pon, Wage, Kliwon · wingi, saiki, sesuk
  en: Telling the time, days and pasaran
  ar_eg: الساعة والأيام وأيام السوق الجاوية
  ar: الوقت والأيام وأيام السوق الجاوية
summary:
  ar_eg: "Jam pira? = الساعة كام؟ الساعة زي الإندونيسي (setengah wolu = سبعة ونص). الأيام أغلبها من العربي (Senen، Rebo، Kemis، Jemuwah، Setu)، وفيه كمان أسبوع جاوي من 5 أيام."
  ar: "Jam pira? = كم الساعة؟ والوقت كالإندونيسية (setengah wolu = السابعة والنصف)، وأكثر أسماء الأيام عربية الأصل، وللجاويين أسبوع سوق من خمسة أيام."
  en: "Jam pira? = What time is it? Clock time works like Indonesian (setengah wolu = 7:30). Most day names come from Arabic (Senen, Rebo, Kemis, Jemuwah, Setu), and there's also a 5-day Javanese market week."
pattern:
  - "Jam pira? — Jam + number (+ esuk / awan / sore / bengi)"
  - "setengah + next hour = half past: setengah wolu = 7:30 (like setengah delapan)"
  - "hour + luwih + minutes = past: jam papat luwih seprapat (4:15) · hour + kurang + minutes = to: jam lima kurang seprapat (4:45)"
  - "days: Senen, Selasa, Rebo, Kemis, Jemuwah, Setu, Minggu (Ahad)"
  - "pasaran: Legi, Pahing, Pon, Wage, Kliwon (e.g. Jemuwah Kliwon)"
  - "wingi (kemarin) · saiki (sekarang) · sesuk (besok) · mau (tadi!) · mengko (nanti) · dina iki (hari ini)"
explanation:
  ar_eg: |
    الساعة:
    - Jam pira? = الساعة كام؟ والرد: Jam telu = الساعة تلاتة.
    - النص زي الإندونيسي بالظبط: setengah + الساعة الجاية: setengah wolu = سبعة ونص («نص تمانية»).
    - وبعد: luwih (lebih / lewat): jam papat luwih seprapat = أربعة وربع. jam pitu luwih sepuluh menit = سبعة وعشرة.
    - إلا: kurang: jam lima kurang seprapat = خمسة إلا ربع.
    - وقت اليوم: esuk (الصبح)، awan (الضهر)، sore (العصر / بعد الضهر)، bengi (بالليل): jam wolu bengi = تمانية بالليل.
    الأيام — هتفرح، أغلبها عربي: Senen (الاتنين)، Selasa (التلات)، Rebo (الأربع)، Kemis (الخميس)، Jemuwah (الجمعة)، Setu (السبت)، وMinggu أو Ahad (الحد).
    أيام السوق (pasaran): الجاويين عندهم أسبوع تاني من 5 أيام: Legi، Pahing، Pon، Wage، Kliwon. والاتنين بيمشوا مع بعض، فيبقى اليوم مثلًا «Jemuwah Kliwon» (جمعة كليوون)، ودي ليلة مشهورة عندهم. والأسواق في القرى لسه بتفتح حسب الـ pasaran.
    كلمات الزمن: wingi (امبارح)، saiki (دلوقتي)، sesuk (بكرة)، mengko (بعدين)، dina iki (النهارده).
    وخلي بالك: mau بالجاوي = «من شوية» (tadi)، مش «عايز» زي الإندونيسي! mau esuk = الصبح اللي فات (tadi pagi).
  ar: |
    الوقت:
    - Jam pira? = كم الساعة؟ والجواب: Jam telu = الثالثة.
    - النصف كالإندونيسية: setengah + الساعة التالية: setengah wolu = السابعة والنصف.
    - «و» بـ luwih: jam papat luwih seprapat = الرابعة والربع. و«إلا» بـ kurang: jam lima kurang seprapat = الخامسة إلا ربعًا.
    - أوقات اليوم: esuk (الصباح)، awan (الظهيرة)، sore (العصر)، bengi (الليل).
    الأيام وأكثرها عربي: Senen (الاثنين)، Selasa (الثلاثاء)، Rebo (الأربعاء)، Kemis (الخميس)، Jemuwah (الجمعة)، Setu (السبت)، Minggu أو Ahad (الأحد).
    وللجاويين أسبوع سوق (pasaran) من خمسة أيام: Legi، Pahing، Pon، Wage، Kliwon، يقترن بالأسبوع العادي، فيقال «Jemuwah Kliwon».
    ألفاظ الزمن: wingi (أمس)، saiki (الآن)، sesuk (غدًا)، mengko (لاحقًا)، dina iki (اليوم).
    وتنبه: mau الجاوية = «قبل قليل» (tadi) لا «يريد» كما في الإندونيسية.
  en: |
    The clock:
    - Jam pira? = What time is it? Answer: Jam telu = Three o'clock.
    - Half works exactly like Indonesian: setengah + the NEXT hour: setengah wolu = 7:30 ("half eight").
    - Past: luwih (lebih / lewat): jam papat luwih seprapat = 4:15; jam pitu luwih sepuluh menit = 7:10.
    - To: kurang: jam lima kurang seprapat = 4:45.
    - Parts of the day: esuk (morning), awan (midday), sore (afternoon), bengi (night): jam wolu bengi = 8 pm.
    Days — good news, most are Arabic: Senen (Monday, الاثنين), Selasa (الثلاثاء), Rebo (الأربعاء), Kemis (الخميس), Jemuwah (الجمعة), Setu (السبت), and Minggu or Ahad (Sunday).
    Pasaran: Javanese also keeps a 5-day market week: Legi, Pahing, Pon, Wage, Kliwon. It runs alongside the 7-day week, so a day is e.g. "Jemuwah Kliwon" — a famous combination. Village markets still open by pasaran.
    Time words: wingi (yesterday), saiki (now), sesuk (tomorrow), mengko (later), dina iki (today).
    Careful: Javanese mau = "earlier, just now" (tadi), not "want" as in Indonesian! mau esuk = earlier this morning.
examples:
  - text: Saiki jam pira? — Jam setengah wolu.
    breakdown: saiki = sekarang · jam · pira = berapa · setengah = setengah · wolu = delapan
    en: What time is it now? — Half past seven.
    ar_eg: الساعة كام دلوقتي؟ — سبعة ونص.
    ar: كم الساعة الآن؟ — السابعة والنصف.
    register: informal
  - text: Sesuk Rebo aku nang Ponorogo.
    breakdown: sesuk = besok · Rebo = Rabu · aku · nang = ke · Ponorogo
    en: Tomorrow, Wednesday, I'm going to Ponorogo.
    ar_eg: بكرة الأربع أنا رايح بونوروجو.
    ar: غدًا الأربعاء أذهب إلى بونوروغو.
    register: informal
  - text: Ketemu jam papat luwih seprapat, ya.
    breakdown: ketemu = ketemu · jam papat = jam empat · luwih = lewat · seprapat = seperempat · ya
    en: Let's meet at a quarter past four, OK?
    ar_eg: نتقابل الساعة أربعة وربع، ماشي؟
    ar: نلتقي في الرابعة والربع، اتفقنا؟
    register: informal
  - text: Pasare buka saben Pon.
    breakdown: pasar + -e = pasarnya · buka · saben = setiap · Pon (pasaran day)
    en: The market opens every Pon day.
    ar_eg: السوق بيفتح كل يوم «بون».
    ar: يُفتح السوق في كل يوم «بون».
    register: informal
  - text: Mau esuk aku wis mangan.
    breakdown: mau = tadi · esuk = pagi · aku · wis = sudah · mangan = makan
    en: I already ate this morning.
    ar_eg: أنا كلت الصبح خلاص.
    ar: أكلتُ صباح اليوم.
    register: informal
mistakes:
  - wrong: Aku mau mangan. (meaning "I want to eat")
    right: Aku arep mangan. / Aku pengin mangan.
    why:
      ar_eg: mau الجاوي = «من شوية». «Aku mau mangan» معناها «أنا كلت من شوية»! «عايز» = arep أو pengin.
      ar: mau الجاوية تعني «قبل قليل»، والإرادة arep أو pengin.
      en: Javanese mau means "a while ago", so this says "I ate earlier". "Want" is arep or pengin.
  - wrong: setengah pitu = 7:30
    right: setengah wolu = 7:30
    why:
      ar_eg: "setengah بتتحسب للساعة الجاية زي الإندونيسي: «نص تمانية» = سبعة ونص."
      ar: يُضاف setengah إلى الساعة التالية كالإندونيسية.
      en: setengah counts toward the next hour, as in Indonesian.
arabic_bridge:
  ar_eg: "الأيام عربي: Senen ← الاتنين، Selasa ← التلات، Rebo ← الأربع، Kemis ← الخميس، Jemuwah ← الجمعة، Setu ← السبت، Ahad ← الحد. ودخلت مع الإسلام من قرون."
  ar: "أسماء الأيام عربية: Senen من الاثنين، وSelasa من الثلاثاء، وRebo من الأربعاء، وKemis من الخميس، وJemuwah من الجمعة، وSetu من السبت، وAhad من الأحد."
  en: "Day names are Arabic: Senen ← الاثنين, Selasa ← الثلاثاء, Rebo ← الأربعاء, Kemis ← الخميس, Jemuwah ← الجمعة, Setu ← السبت, Ahad ← الأحد."
