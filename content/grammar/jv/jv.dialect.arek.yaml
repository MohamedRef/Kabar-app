schema: kabar.grammar/v1
id: jv.dialect.arek
language: jv
level: j1
title:
  target: koen, awakmu, gak, onok, kate, yok opo, lapo, rek, cak, ning, ae, ta
  en: "Surabaya speech you'll hear (recognise it, speak Jogja)"
  ar_eg: "لهجة سورابايا اللي هتسمعها (افهمها، واتكلم زي يوجيا)"
  ar: "لهجة سورابايا التي ستسمعها (افهمها وتكلّم بلهجة يوجياكرتا)"
summary:
  ar_eg: "Arek هي جاوي سورابايا: مباشرة، سريعة، ومن غير كلفة. الكلمات اللي هتسمعها: koen (إنت)، gak (لأ)، onok (فيه)، kate (هـ)، yok opo (إزاي)، lapo (ليه)، وrek في كل حتة. ومقابل كل واحدة الكلمة اللي Kabar بيعلّمهالك من يوجيا وماديون. افهمهم لما تسمعهم، بس ماتقولهمش."
  ar: "Arek هي جاوية سورابايا: مباشرة وسريعة وبلا تكلّف. أشهر ألفاظها koen وgak وonok وkate وyok opo وlapo وrek، ولكل منها مقابل في جاوية يوجياكرتا وماديون التي يعلّمها Kabar؛ فافهمها سماعًا ولا تستعملها."
  en: "Arek is Surabaya's Javanese: direct, fast, egalitarian. Key words: koen (you), gak (no), onok (there is), kate (going to), yok opo (how), lapo (why), and rek everywhere. Each has a Jogja / Madiun twin, which is what Kabar teaches: understand these when you hear them, but don't use them."
pattern:
  - "koen / awakmu ↔ kowe (kamu) · awak dhewe ↔ awake dhewe (kita)"
  - "gak ↔ ora (tidak) · onok ↔ ana (ada) · gak onok ↔ ora ana (tidak ada)"
  - "kate ↔ arep (mau / akan) · wes ↔ wis (sudah)"
  - "yok opo ↔ piye (bagaimana) · lapo ↔ ngapa (kenapa / ngapain)"
  - "nang ↔ neng (ke / di) · teko ↔ saka (dari)"
  - "ae ↔ wae (saja) · ta ↔ to (kan?) · rek, cak, ning (address)"
explanation:
  ar_eg: |
    سورابايا بتتكلم جاوي شرق جاوة اللي اسمه «Arek» (من arek = ولد / واحد من البلد: Arek Suroboyo = ولاد سورابايا).
    وده جدول المقابل بتاع يوجيا وماديون (ماتارامان) اللي إنت بتتعلمه وبتتكلمه:
    - koen (في الشات kon) أو awakmu = kowe (إنت). awak dhewe = awake dhewe (إحنا).
    - gak (gk، ga) = ora (لأ / مش). onok = ana (فيه). gak onok = ora ana (مفيش).
    - kate = arep (هـ / ناوي). wes = wis (خلاص).
    - yok opo (yaopo) = piye (إزاي). lapo = ngapa (ليه / بتعمل إيه).
    - nang = neng (لـ / في). teko = saka (من): Teko endi? = منين؟
    - ae = wae (بس). ta = to (مش كده؟). وrek، cak، ning للنداء.
    الكلام ده لسامع من وسط جاوة بيبان «ناشف» شوية، بس بين الصحاب في سورابايا هو الدفا نفسه. اعرفه وافهمه، ومع ناس متعرفهمش ابدأ بالنغوكو العادي أو sampeyan.
    في سورابايا فيه كمان شتايم مشهورة بتتقال بين الصحاب. Kabar مش هيعلّمهالك، بس الـ Reader هيشرحهالك لو ظهرت في شات.
  ar: |
    تتكلم سورابايا جاوية شرق جاوة المسماة «Arek» (من arek = الولد، وArek Suroboyo = أبناء سورابايا). ومقابلها في جاوية ماتارامان (يوجياكرتا وماديون) التي تتعلّمها وتتكلّم بها:
    - koen (kon) أو awakmu = kowe، وawak dhewe = awake dhewe.
    - gak = ora، وonok = ana، وgak onok = ora ana.
    - kate = arep، وwes = wis.
    - yok opo (yaopo) = piye، وlapo = ngapa.
    - nang = neng، وteko = saka: Teko endi? = من أين؟
    - ae = wae، وta = to، وrek وcak وning للنداء.
    يبدو هذا الكلام جافًا لأهل الوسط، لكنه بين أصدقاء سورابايا ودود. افهمه، وابدأ مع الغرباء بالنغوكو القياسي أو sampeyan.
  en: |
    Surabaya speaks East Javanese "Arek" (from arek, kid / local guy: Arek Suroboyo = Surabaya folks).
    Here's each Arek word with its Mataraman (Jogja / Madiun) twin, the one you learn and speak:
    - koen (chat: kon) or awakmu = kowe (you). awak dhewe = awake dhewe (we).
    - gak (gk, ga) = ora (not). onok = ana (there is). gak onok = ora ana (there isn't).
    - kate = arep (going to). wes = wis (already).
    - yok opo (yaopo) = piye (how). lapo = ngapa (why / what are you doing).
    - nang = neng (to / at). teko = saka (from): Teko endi? = Where from?
    - ae = wae (just), ta = to (right?), plus rek, cak, ning for calling people.
    To Central Javanese ears this sounds blunt; among Surabaya friends it is warmth itself. Know it and understand it, but start with standard ngoko or sampeyan with strangers.
    Surabaya also has famous swear words used between friends. Kabar won't teach them, but the Reader explains them if they show up in a chat.
examples:
  - text: Koen wis mangan ta, rek?
    breakdown: koen = kowe (kamu) · wis = sudah · mangan = makan · ta = to (kan?) · rek = guys
    en: You've eaten, right, mate? (Arek) — standard ngoko — Kowe wis mangan to?
    ar_eg: كلت ولا إيه يا صاحبي؟
    ar: هل أكلتَ يا صاح؟
    register: informal
  - text: Kate nang endi, Cak?
    breakdown: kate = arep (mau) · nang = neng (ke) · endi = mana · Cak = Mas
    en: Where are you off to, brother? (Arek) — standard — Arep neng ngendi, Mas?
    ar_eg: رايح فين يا معلم؟
    ar: إلى أين يا أخي؟
    register: informal
  - text: Yok opo kabare?
    breakdown: yok opo = piye (bagaimana) · kabar + -e = kabarnya
    en: How are you? (Arek) — standard — Piye kabare?
    ar_eg: أخبارك إيه؟
    ar: كيف حالك؟
    register: informal
  - text: Lapo koen gak teko?
    breakdown: lapo = ngapa (kenapa) · koen = kamu · gak = ora (tidak) · teko = teka (datang)
    en: Why didn't you come? (Arek) — standard — Ngapa kowe ora teka?
    ar_eg: ماجيتش ليه؟
    ar: لماذا لم تأتِ؟
    register: informal
  - text: Gak onok, rek.
    breakdown: gak = ora · onok = ana (ada) · rek = guys
    en: There isn't any, guys. (Arek) — standard — Ora ana.
    ar_eg: مفيش يا جماعة.
    ar: لا يوجد يا جماعة.
    register: informal
mistakes:
  - wrong: Koen wis mangan, Pak? (to an older stranger)
    right: Sampeyan wis mangan, Pak?
    why:
      ar_eg: koen للصحاب بس. مع حد كبير حتى في سورابايا بيقولوا sampeyan.
      ar: koen للأقران فقط، ومع الكبير يقال sampeyan حتى في سورابايا.
      en: koen is for friends only; even in Surabaya an older person gets sampeyan.
  - wrong: teko = "come" in "Aku teko Mesir"
    right: teko = "from" here (standard saka)
    why:
      ar_eg: في سورابايا teko بتيجي بمعنى «من» كمان، مش «جه» بس. Aku teko Mesir = أنا من مصر.
      ar: تأتي teko في سورابايا بمعنى «من» أيضًا، فـ Aku teko Mesir = أنا من مصر.
      en: "In Surabaya teko also means \"from\": Aku teko Mesir = I'm from Egypt."
arabic_bridge:
  ar_eg: "زي الفرق بين لهجة إسكندرية أو الصعيد ولهجة القاهرة: نفس اللغة، كلمات مختلفة شوية، وكل لهجة ليها «علامات» (زي «يا جدعان» ≈ rek)."
  ar: "كالفرق بين لهجات العربية في البلد الواحد: لغة واحدة بألفاظ وعلامات مختلفة."
  en: "Like Alexandrian or Saidi versus Cairene Arabic: one language, different signature words."
