cues:
  - match: "koen|awakmu"
    note:
      ar_eg: "koen = إنت بلهجة سورابايا (kowe)."
      ar: "koen = أنت بلهجة سورابايا."
      en: "koen = you, Surabaya style (kowe)."
  - match: "onok"
    note:
      ar_eg: "onok = فيه، لهجة سورابايا (ana)."
      ar: "onok = يوجد، بلهجة سورابايا."
      en: "onok = there is, Surabaya style (ana)."
  - match: "gak"
    note:
      ar_eg: "gak = مش، لهجة سورابايا (ora)."
      ar: "gak = لا، بلهجة سورابايا."
      en: "gak = not, Surabaya style (ora)."
  - match: "kate"
    note:
      ar_eg: "kate = هـ / ناوي، لهجة سورابايا (arep)."
      ar: "kate = سـ، بلهجة سورابايا."
      en: "kate = going to, Surabaya style (arep)."
  - match: "yok|yo opo"
    note:
      ar_eg: "yok opo = إزاي؟ لهجة سورابايا (piye)."
      ar: "yok opo = كيف؟ بلهجة سورابايا."
      en: "yok opo = how?, Surabaya style (piye)."
  - match: "lapo"
    note:
      ar_eg: "lapo = ليه / بتعمل إيه؟ لهجة سورابايا."
      ar: "lapo = لماذا؟ بلهجة سورابايا."
      en: "lapo = why / doing what?, Surabaya style."
