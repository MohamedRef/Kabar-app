schema: kabar.grammar/v1
id: jv.codemix
language: jv
level: j5
title:
  target: campur kode — Jawa + Indonesia + English
  en: Code-mixing — reading posts that blend Javanese, Indonesian and English
  ar_eg: خلط اللغات — إزاي تقرا بوستات فيها جاوي وإندونيسي وإنجليزي مع بعض
  ar: الخلط اللغوي — قراءة منشورات تمزج الجاوية والإندونيسية والإنجليزية
summary:
  ar_eg: "أغلب الجاوي على النت مخلوط: كلمة جاوي، كلمة إندونيسي، كلمة إنجليزي. السر إن الهيكل (البادئات والنهايات والأدوات) غالبًا جاوي، والكلمة الجديدة بتدخل جواه: dishare، tak-follow، HP-ne. علّم كل كلمة: جاوي؟ إندونيسي؟ إنجليزي؟"
  ar: "معظم الجاوية على الإنترنت ممزوجة بالإندونيسية والإنجليزية، والسر أن الهيكل (السوابق واللواحق والأدوات) جاوي تدخله الكلمة الأجنبية: dishare، وtak-follow، وHP-ne. صنّف كل كلمة: جاوية أم إندونيسية أم إنجليزية."
  en: "Most Javanese online is mixed: a Javanese word, an Indonesian word, an English word. The key is that the frame (affixes, particles, little words) is usually Javanese and the borrowed word slots into it: dishare, tak-follow, HP-ne. Tag each word: Javanese, Indonesian or English?"
pattern:
  - "Javanese affix + foreign root: di- + share → dishare · tak + follow → tak follow · -ne / -e: HP-ne, laptop-e"
  - "Javanese particles around Indonesian / English: Sabar ya, lagi OTW · Wis tak share neng grup"
  - "Indonesian chat shorthand inside Javanese: udh (sudah), blm (belum), jg (juga), bgt (banget)"
  - "English words and acronyms: OTW, sorry, guys, like, comment, healing, mood"
  - "how to read: 1) find the Javanese frame words (wis, tak, ora, -ne, ya, ae) 2) tag the rest by language 3) normalise chat spelling"
  - "register: code-mixing is informal; never mix English into krama to an elder"
explanation:
  ar_eg: |
    لو فتحت تيك توك أو إنستجرام من جاوة، نادرًا ما هتلاقي جاوي «سادة». هتلاقي حاجة زي:
    «Wis tak share neng grup, guys. Sing durung follow, gas!»
    ده عادي جدًا — زي ما إحنا بنقول «ابعتلي اللينك على الجروب» و«عملتله شير».
    إزاي تفكّها؟
    1. دوّر على «الهيكل» الجاوي: wis (خلاص)، tak (أنا هـ)، neng (في)، sing (اللي)، durung (لسه)، ya، ae، -ne. دول بيقولولك إن الجملة جاوي في الأساس.
    2. علّم باقي الكلمات: share / guys / follow = إنجليزي، gas = سلانج إندونيسي (يلا / انطلق).
    3. رجّع إملا الشات لأصله (اتعلمناه في J1 وفي وحدة الإملا).
    الجاوي «بيبلع» الكلمات الغريبة ويحطلها نهاياته: di- + share = dishare (اتعمله شير)، tak follow = هتابعه، HP-ne = موبايله. زي ما إحنا بنقول «شيّرته» و«لايكته» بتصريف عربي على كلمة إنجليزي.
    وفيه كمان إندونيسي مختصر: udh = sudah، blm = belum، bgt = banget.
    ملحوظة أدب: الخلط ده لغة صحاب وسوشيال ميديا. مع حد كبير بالكراما ماتدخّلش إنجليزي.
    وكمان: Reader في Kabar بيلوّن كل كلمة حسب لغتها، فاستخدمه.
  ar: |
    قلّما تجد جاوية خالصة على تيك توك أو إنستغرام؛ بل منشورات مثل:
    «Wis tak share neng grup, guys. Sing durung follow, gas!»
    ولفكّها:
    1. ابحث عن الهيكل الجاوي: wis، وtak، وneng، وsing، وdurung، وya، وae، و-ne.
    2. صنّف البقية: share / guys / follow إنجليزية، وgas عامية إندونيسية (هيا).
    3. ردّ إملاء الدردشة إلى أصله.
    وتُلبس الجاوية الكلمة الأجنبية لواحقها: dishare، وtak follow، وHP-ne = هاتفه، كما نقول في العامية «شيّرته» و«لايكته».
    وتدخلها أيضًا اختصارات إندونيسية: udh = sudah، وblm = belum، وbgt = banget.
    والخلط لغة الأصدقاء ووسائل التواصل، فلا يُدخَل الإنجليزي في الكراما مع الكبار.
  en: |
    Open TikTok or Instagram from Java and you'll rarely see "pure" Javanese. You'll see things like:
    "Wis tak share neng grup, guys. Sing durung follow, gas!"
    That's completely normal — just like Egyptians say «ابعتلي اللينك على الجروب» or «عملتله شير».
    How to decode it:
    1. Find the Javanese frame: wis (already), tak (I'll), neng (in), sing (who / which), durung (not yet), ya, ae, -ne. They tell you the sentence is Javanese at its core.
    2. Tag the rest: share / guys / follow = English, gas = Indonesian slang (let's go).
    3. Normalise chat spelling (J1 and the spelling unit).
    Javanese swallows foreign words and gives them its own affixes: di- + share = dishare (got shared), tak follow = I'll follow, HP-ne = his phone. Just like Egyptian «شيّرته», «لايكته» — Arabic grammar on an English word.
    Indonesian shorthand slips in too: udh = sudah, blm = belum, bgt = banget.
    Manners note: mixing is friends-and-social-media language. Don't drop English into krama with an elder.
    Kabar's Reader colours each word by language — use it.
examples:
  - text: Wis tak share neng grup, guys.
    breakdown: wis (jv, sudah) · tak (jv, saya) · share (en) · neng (jv, di / ke) · grup (id) · guys (en)
    en: I've shared it in the group, guys.
    ar_eg: شيّرته على الجروب يا جماعة.
    ar: شاركتُه في المجموعة يا جماعة.
    register: chat
  - text: HP-ne lowbat, mengko tak kabari.
    breakdown: HP (id, ponsel) + -ne (jv, -nya) · lowbat (en-based slang, baterai lemah) · mengko (jv, nanti) · tak kabari (jv, saya kabari)
    en: My phone's battery is low — I'll let you know later.
    ar_eg: شحن الموبايل قرب يخلص، هبقى أبلغك بعدين.
    ar: بطارية الهاتف ضعيفة، سأخبرك لاحقًا.
    register: chat
  - text: Sabar ya, aku lagi OTW.
    breakdown: sabar (id / jv) · ya (particle) · aku (jv / id) · lagi (jv / id, sedang) · OTW (en, on the way)
    en: Hang on, I'm on my way.
    ar_eg: استنى شوية، أنا في الطريق.
    ar: اصبر قليلًا، أنا في الطريق.
    register: chat
  - text: Videone apik bgt, ojo lali like lan subscribe.
    breakdown: video (id / en) + -ne (jv) · apik (jv, bagus) · bgt = banget (jv / id) · ojo = aja (jv, jangan) · lali (jv, lupa) · like (en) · lan (jv, dan) · subscribe (en)
    en: The video is really good — don't forget to like and subscribe.
    ar_eg: الفيديو حلو أوي، ماتنساش لايك وسبسكرايب.
    ar: الفيديو رائع جدًا، لا تنسَ الإعجاب والاشتراك.
    register: chat
  - text: Durung sempet, sorry banget.
    breakdown: durung (jv, belum) · sempet = sempat (id-shaped) · sorry (en) · banget (jv / id, sekali)
    en: Haven't had the chance yet, really sorry.
    ar_eg: لسه ملحقتش، سوري جدًا.
    ar: لم تسنح لي الفرصة بعد، آسف جدًا.
    register: chat
mistakes:
  - wrong: Looking up "dishare" or "HP-ne" as single words in a Javanese dictionary.
    right: Split them — di- + share, HP + -ne — and look up the root in the right language.
    why:
      ar_eg: البادئة أو النهاية جاوي، والجذر إنجليزي أو إندونيسي. افصلهم الأول.
      ar: السابقة أو اللاحقة جاوية والجذر أجنبي، فافصلهما أولًا.
      en: The affix is Javanese, the root is English or Indonesian; split them first.
  - wrong: Nuwun sewu, Pak, kula OTW, sorry telat.
    right: Nuwun sewu, Pak, kula taksih wonten margi. Nyuwun pangapunten, kula telat.
    why:
      ar_eg: الكراما مع حد كبير مايتخلطش بإنجليزي شات. الخلط ده للصحاب.
      ar: لا يُمزج الإنجليزي الدارج بالكراما مع الكبار.
      en: Don't mix chat English into krama with an elder; mixing is for friends.
  - wrong: Assuming a post is Indonesian because most content words are Indonesian.
    right: Check the frame — wis, tak, ora, -ne, neng mean it's Javanese at heart.
    why:
      ar_eg: الكلمات الكتير ممكن تكون إندونيسي، بس الهيكل هو اللي بيحدد اللغة.
      ar: قد تكثر الألفاظ الإندونيسية، لكن الهيكل هو الذي يحدد اللغة.
      en: Content words may be Indonesian, but the grammatical frame decides the language.
arabic_bridge:
  ar_eg: "إحنا أبطال في ده: «شيّرت البوست»، «عملتله بلوك»، «هبعتلك لوكيشن». تصريف عربي على كلمة إنجليزي — بالظبط زي dishare وtak follow وHP-ne. نفس العقلية."
  ar: "نفعله في عاميتنا: «شيّرت المنشور» و«عملتله بلوك»، تصريف عربي على جذر إنجليزي، تمامًا كـ dishare وHP-ne."
  en: "Egyptians do this all the time: «شيّرت البوست», «عملتله بلوك», «هبعتلك لوكيشن» — Arabic grammar on English roots, just like dishare, tak follow and HP-ne."
tags: [code-mixing, social-media, chat, register, j5]
prerequisites: [jv.chat.normalize, jv.proclitic.tak-kok-di, jv.possessive.e-ne]
see_also: [jv.orthography, jv.dialect.arek, jv.particle.basic]
review:
  status: draft
  verified: false
  notes: >-
    Draft by Claude; awaits review by a Javanese speaker. All example posts are Claude-made, not real posts; please check they
    read like natural social-media Javanese (especially "gas", "lowbat", "sempet", "Videone apik bgt") and the krama fix
    "kula taksih wonten margi" (= I'm still on the road).
