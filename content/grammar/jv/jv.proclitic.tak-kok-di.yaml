schema: kabar.grammar/v1
id: jv.proclitic.tak-kok-di
language: jv
level: j1
title:
  target: tak- (by me / I'll) · kok- (by you) · di- (by someone)
  en: "tak-, kok- and di- on verbs"
  ar_eg: "tak- وkok- وdi- قبل الفعل"
  ar: "السوابق tak- وkok- وdi- في الأفعال"
summary:
  ar_eg: "tak + فعل = أنا (هعمل / عملت) الحاجة دي: tak tuku = kubeli. kok + فعل = إنت عملتها (kaubeli). di- زي الإندونيسي بالظبط: dituku = dibeli. وtak كمان معناها «خليني / هـ»: Sek tak lapor = استنى هبلّغ."
  ar: "tak + فعل = أفعله أنا (kubeli)، وkok + فعل = تفعله أنت (kaubeli)، وdi- للمبني للمجهول كالإندونيسية (dituku = dibeli). وتفيد tak العزم أيضًا: Sek tak lapor = انتظر، سأبلغ."
  en: "tak + verb = I do / I'll do it (Indonesian kubeli). kok + verb = you do it (kaubeli). di- is Indonesian di-: dituku = dibeli. tak also means 'let me / I'll': Sek tak lapor = hold on, I'll report."
pattern:
  - "object + tak + base verb: Bukune wis tak waca. (= Bukunya sudah kubaca.)"
  - "tak + verb = offer or intention: Tak terke. (= Kuantar, ya.)"
  - "object + kok + base verb: Layange wis kok waca? (= Suratnya sudah kaubaca?)"
  - "object + di + base verb: Bukune diwaca Sari. (= Bukunya dibaca Sari.)"
  - "spelling: dictionaries join them (takwaca, kokwaca, diwaca); chats often write tak / kok apart"
explanation:
  ar_eg: |
    الإندونيسي عنده ku- وkau- وdi- (kubeli، kaubeli، dibeli). الجاوي عنده نفس الفكرة بالظبط:
    - tak- = «أنا» ملزوقة في الفعل: Bukune wis tak waca = الكتاب قريته خلاص (Bukunya sudah kubaca).
      والفعل بيرجع لأصله من غير الـ N: maca (يقرا) → tak waca، ngombe → tak ombe. (الـ N هتتشرح في J2.)
    - وأهم استخدام في الشات: tak = «خليني / هعمل دلوقتي». Sek tak lapor pusat = استنى، هبلّغ الإدارة. Tak terke = هوصّلك. Tak tukokke = هشتريهولك.
    - kok- = «إنت»: Layange wis kok waca? = الجواب قريته؟ (kaubaca). في الكلام اليومي بتتسمع أقل؛ الناس كتير بتقول «Kowe wis maca layange?».
    - di- = المبني للمجهول زي الإندونيسي بالظبط: dituku = اتشرى (dibeli)، dipangan = اتاكل (dimakan)، diwaca Sari = ساري قرته.
    خلي بالك: kok كمان «أداة» تانية معناها «إزاي كده! / ليه؟» (Kok larang? = إيه ده غالي كده ليه؟). دي هتلاقيها في درس الـ particles.
    الكتابة: القاموس بيلزقهم (takwaca، diwaca)، والشات غالبًا بيكتب tak منفصلة.
  ar: |
    للإندونيسية ku- وkau- وdi- (kubeli، kaubeli، dibeli)، وللجاوية نظيرها:
    - tak- = فاعل المتكلم ملتصقًا بالفعل: Bukune wis tak waca = قد قرأتُ الكتاب (Bukunya sudah kubaca).
      ويعود الفعل إلى جذره بلا النون: maca → tak waca، ngombe → tak ombe (والنون تُشرح في J2).
    - وأشهر استعمالها في الدردشة العزم والعرض: Sek tak lapor pusat = انتظر، سأبلغ المركز؛ Tak terke = سأوصلك.
    - kok- = فاعل المخاطب: Layange wis kok waca? = هل قرأتَ الرسالة؟ (kaubaca)، وهو أقل شيوعًا في الكلام اليومي.
    - di- = المبني للمجهول كالإندونيسية: dituku = dibeli، dipangan = dimakan، diwaca Sari = قرأته ساري.
    وللكلمة kok معنى آخر أداةً للتعجب والسؤال (Kok larang? = لماذا هو غالٍ هكذا؟) يأتي في درس الأدوات.
    وتُكتب في المعاجم موصولة (takwaca، diwaca)، وفي الدردشة كثيرًا ما تُفصل tak.
  en: |
    Indonesian has ku-, kau- and di- (kubeli, kaubeli, dibeli). Javanese has the same idea:
    - tak- = "by me", stuck to the verb: Bukune wis tak waca = I've read the book (Bukunya sudah kubaca).
      The verb goes back to its base, without the nasal: maca (read) → tak waca, ngombe → tak ombe. (The nasal prefix is J2.)
    - In chats tak is above all "let me / I'll (right now)": Sek tak lapor pusat = Hold on, I'll report to HQ. Tak terke = I'll take you there. Tak tukokke = I'll buy it for you.
    - kok- = "by you": Layange wis kok waca? = Have you read the letter? (kaubaca). It's less frequent in everyday speech; people often say "Kowe wis maca layange?".
    - di- = passive, exactly like Indonesian: dituku = dibeli, dipangan = dimakan, diwaca Sari = read by Sari.
    Watch out: kok is also a particle of surprise / "how come?" (Kok larang? = How come it's so expensive?) — see the particles lesson.
    Spelling: dictionaries join them (takwaca, diwaca); chats often write tak as a separate word.
examples:
  - text: Sek tak lapor pusat.
    breakdown: sek = tunggu / dulu · tak = saya (akan) · lapor = lapor · pusat = pusat
    en: Hold on, I'll report to HQ.
    ar_eg: استنى، هبلّغ الإدارة.
    ar: انتظر، سأبلغ المركز.
    register: chat
  - text: Bukune wis tak waca.
    breakdown: buku + -ne = bukunya · wis = sudah · tak + waca = kubaca
    en: I've (already) read the book.
    ar_eg: الكتاب قريته خلاص.
    ar: قد قرأتُ الكتاب.
    register: informal
  - text: Ayo, tak terke nang stasiun.
    breakdown: ayo · tak + terke = kuantar · nang = ke · stasiun
    en: Come on, I'll take you to the station.
    ar_eg: يلا، هوصّلك المحطة.
    ar: هيا، سأوصلك إلى المحطة.
    register: informal
  - text: HP-ne arep dituku sapa?
    breakdown: HP + -ne = HP-nya · arep = mau / akan · di + tuku = dibeli · sapa = siapa
    en: Who's going to buy the phone? (literally "the phone will be bought by whom?")
    ar_eg: الموبايل مين هيشتريه؟
    ar: من سيشتري الهاتف؟
    register: informal
  - text: Layange wis kok waca?
    breakdown: layang = surat · -e = -nya · wis = sudah · kok + waca = kaubaca
    en: Have you read the letter?
    ar_eg: الجواب قريته؟
    ar: هل قرأتَ الرسالة؟
    register: informal
mistakes:
  - wrong: Bukune wis tak maca.
    right: Bukune wis tak waca.
    why:
      ar_eg: "بعد tak وdi الفعل بيرجع لأصله من غير الـ N: waca مش maca، زي الإندونيسي kubaca مش kumembaca."
      ar: بعد tak وdi يعود الفعل إلى جذره بلا النون، كما تقول الإندونيسية kubaca لا kumembaca.
      en: After tak / di the verb returns to its base (waca, not maca), as Indonesian says kubaca, not kumembaca.
  - wrong: Sek tak lapor = "Wait, don't report."
    right: Sek tak lapor = "Wait, I'll report."
    why:
      ar_eg: tak هنا مش «tidak» (لأ). tak الجاوي = «أنا هـ». النفي بالجاوي ora / gak.
      ar: tak هنا ليست اختصار tidak، بل ضمير المتكلم، والنفي الجاوي ora / gak.
      en: tak here is not Indonesian "tak" (= tidak); it's "I". Javanese negation is ora / gak.
arabic_bridge:
  ar_eg: "tak tuku شبه «أشتري» في العربي: «أنا» داخلة في الفعل نفسه كحرف قدامه، زي الألف في «أشتري» والنون في «نشتري»."
  ar: "تشبه tak حرف المضارعة في «أشتري»: يدل على المتكلم وهو جزء من الفعل."
  en: "tak works like Arabic «أ» in «أشتري»: the person is marked on the verb itself."
tags: [verb, passive, proclitic, chat, j1]
prerequisites: [jv.pronoun.ngoko]
see_also: [jv.particle.basic, jv.suffix.ake, jv.prefix.nasal, jv.krama.affixes]
review:
  status: draft
  verified: false
  notes: Draft by Claude; awaits review by a Javanese speaker. The curriculum lists "kok- / mbok" for the second person; mbok as a 2nd-person proclitic was left out as unconfirmed (mbok appears only as a persuasive particle in jv.particle.basic).
