schema: kabar.grammar/v1
id: jv.krama.function-words
language: jv
level: j3
title:
  target: sampun, dereng, badhe, mboten, wonten, saking, dhateng, inggih, taksih, kaliyan
  en: Core krama function words
  ar_eg: الكلمات الأساسية في الكراما
  ar: ألفاظ الكراما الوظيفية الأساسية
summary:
  ar_eg: "الكلمات الصغيرة اللي في كل جملة ليها نسخة كراما: wis → sampun، durung → dereng، arep → badhe، ora → mboten، ana → wonten، saka → saking، nang → dhateng، iya → inggih. بدّلهم وجملتك تبقى مؤدبة."
  ar: "للألفاظ الوظيفية نظائر في الكراما: wis → sampun، durung → dereng، arep → badhe، ora → mboten، ana → wonten، saka → saking، nang → dhateng، iya → inggih."
  en: "The small words in every sentence have krama versions: wis → sampun, durung → dereng, arep → badhe, ora → mboten, ana → wonten, saka → saking, nang → dhateng, iya → inggih. Swap them and your sentence turns polite."
pattern:
  - "wis → sampun (sudah) · durung → dereng (belum) · arep → badhe (akan / mau) · isih → taksih (masih)"
  - "ora → mboten (tidak) · ana → wonten (ada) · iya → inggih (ya)"
  - "saka → saking (dari) · nang / menyang → dhateng (ke), spoken teng · karo → kaliyan (dengan / dan) · uga → ugi (juga)"
  - "iki → menika, spoken niki (ini)"
  - "chat: sampun → mpun / pun · dictionaries add accents to dereng"
explanation:
  ar_eg: |
    أسهل طريق للكراما: ابدأ بالكلمات الصغيرة اللي بتتكرر في كل جملة. كل كلمة نغوكو ليها نسخة كراما (وجنبها الإندونيسي):
    - wis → sampun (sudah)، durung → dereng (belum، القاموس بيحط عليها علامات)، arep → badhe (akan / mau)، isih → taksih (masih).
    - ora → mboten (tidak)، ana → wonten (ada)، iya → inggih (ya).
    - saka → saking (dari)، nang → dhateng (ke)، وفي الكلام بيقولوا teng. karo → kaliyan (dengan)، uga → ugi (juga).
    - iki → menika (ini)، وفي الكلام niki: Niki pinten? = ده بكام؟
    مثال SPEC: Kowe wis mangan? → Sampeyan sampun nedha? — شوف إن wis بقت sampun، وkowe بقت sampeyan، وmangan بقت nedha.
    وفي الشات: sampun بتتكتب mpun أو pun كتير.
    نصيحة: inggih لوحدها كلمة سحرية. لما حد كبير يكلمك وإنت مش فاهم كل حاجة، «Inggih» (أيوه) بأدب بتنقذك.
  ar: |
    أيسر مدخل إلى الكراما الألفاظ الصغيرة المتكررة، ولكل منها نظير:
    - wis → sampun (sudah)، durung → dereng (belum، وتضع المعاجم عليها علامات)، arep → badhe، isih → taksih.
    - ora → mboten، ana → wonten، iya → inggih.
    - saka → saking، nang → dhateng (وفي الكلام teng)، karo → kaliyan، uga → ugi.
    - iki → menika، وفي الكلام niki: Niki pinten? = بكم هذا؟
    مثال: Kowe wis mangan? → Sampeyan sampun nedha?، فتغيرت wis وkowe وmangan جميعًا.
    وفي الدردشة تُكتب sampun كثيرًا mpun أو pun.
  en: |
    The easiest way into krama: start with the small words that appear in every sentence. Each ngoko word has a krama twin (Indonesian alongside):
    - wis → sampun (sudah), durung → dereng (belum; dictionaries add accents), arep → badhe (akan / mau), isih → taksih (masih).
    - ora → mboten (tidak), ana → wonten (ada), iya → inggih (ya).
    - saka → saking (dari), nang → dhateng (ke) — spoken teng. karo → kaliyan (dengan), uga → ugi (juga).
    - iki → menika (ini), spoken niki: Niki pinten? = How much is this?
    SPEC example: Kowe wis mangan? → Sampeyan sampun nedha? — wis became sampun, kowe became sampeyan, mangan became nedha.
    In chats sampun is often typed mpun or pun.
    Tip: inggih is a magic word. When an elder speaks to you and you don't catch everything, a polite "Inggih" (yes) carries you through.
examples:
  - text: Sampeyan sampun nedha? — Dereng.
    breakdown: sampeyan = Anda · sampun = sudah · nedha = makan · dereng = belum
    en: Have you eaten? — Not yet.
    ar_eg: حضرتك كلت؟ — لسه.
    ar: هل أكلتَ؟ — ليس بعد.
    register: formal
  - text: Kula badhe dhateng peken.
    breakdown: kula = saya · badhe = akan · dhateng = ke · peken = pasar
    en: I'm going to the market.
    ar_eg: أنا رايح السوق.
    ar: سأذهب إلى السوق.
    register: formal
  - text: Bapak wonten? — Mboten wonten.
    breakdown: bapak · wonten = ada · mboten = tidak
    en: Is your father in? — No, he isn't.
    ar_eg: بابا موجود؟ — لأ، مش موجود.
    ar: هل الوالد موجود؟ — لا، ليس موجودًا.
    register: formal
  - text: Kula saking Kairo.
    breakdown: kula = saya · saking = dari · Kairo
    en: I'm from Cairo.
    ar_eg: أنا من القاهرة.
    ar: أنا من القاهرة.
    register: formal
  - text: Inggih, kula taksih sinau.
    breakdown: inggih = ya · kula = saya · taksih = masih · sinau = belajar
    en: Yes, I'm still learning.
    ar_eg: أيوه، أنا لسه بتعلم.
    ar: نعم، ما زلتُ أتعلم.
    register: formal
mistakes:
  - wrong: Sampeyan wis nedha?
    right: Sampeyan sampun nedha?
    why:
      ar_eg: "wis نغوكو. في جملة كراما كل الكلمات الصغيرة لازم تبقى كراما: sampun."
      ar: wis من النغوكو، وفي جملة الكراما تُستعمل sampun.
      en: wis is ngoko; in a krama sentence the function words switch too — sampun.
  - wrong: Kula ora ngertos.
    right: Kula mboten ngertos.
    why:
      ar_eg: ora نغوكو. النفي في الكراما mboten.
      ar: ora من النغوكو، والنفي في الكراما mboten.
      en: ora is ngoko; krama negation is mboten.
arabic_bridge:
  ar_eg: "زي الفرق بين العامية والفصحى: «مش» ← «ليس»، «لسه» ← «لم بعد»، «هـ» ← «سوف». نفس الجملة، كلمات أرقى."
  ar: "كالانتقال من العامية إلى الفصحى: «مش» → «ليس»، و«هـ» → «سوف»: الجملة نفسها بألفاظ أرفع."
  en: "Like moving from Egyptian to Fusha: «مش» → «ليس», «هـ» → «سوف» — same sentence, higher words."
