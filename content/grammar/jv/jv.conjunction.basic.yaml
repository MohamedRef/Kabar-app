      en: "lan / karo = and / with."
  - match: "nanging"
    note:
      ar_eg: "nanging = بس / لكن."
      ar: "nanging = لكن."
      en: "nanging = but."
  - match: "terus|trus|banjur"
    note:
      ar_eg: "terus / banjur = وبعدين."
      ar: "terus / banjur = ثم."
      en: "terus / banjur = then."
  - match: "merga|mergane|amarga"
    note:
      ar_eg: "merga = عشان / لأن."
      ar: "merga = لأن."
      en: "merga = because."
