      ar_eg: "matur nuwun = شكرًا (كراما)."
      ar: "matur nuwun = شكرًا."
      en: "matur nuwun = thank you."
  - match: "nuwun sewu"
    note:
      ar_eg: "nuwun sewu = لا مؤاخذة / عن إذنك."
      ar: "nuwun sewu = عذرًا."
      en: "nuwun sewu = excuse me."
  - match: "kula nuwun"
    note:
      ar_eg: "kula nuwun = حد هنا؟ (وإنت داخل بيت)."
      ar: "kula nuwun = يا أهل البيت."
      en: "kula nuwun = hello, anyone home?"
  - match: "mangga|monggo"
    note:
      ar_eg: "mangga = اتفضل."
      ar: "mangga = تفضّل."
      en: "mangga = please, go ahead."
review:
  status: draft
  verified: false
  notes: >-
    Draft by Claude; awaits review by a Javanese speaker. Phrases follow content/javanese/speech-levels.jsonl.
    Please check "Kula nuwun! — Mangga, mlebet!", "Pangestunipun, sae", "Sampun cekap, matur nuwun", Ngatos-atos as a farewell,
    and the gesture descriptions (thumb pointing, lowered right hand when passing). Standard spelling is used (nuwun sewu, ndherek,
    mangga); the curriculum writes nuwun sewu, ndherek and monggo.
