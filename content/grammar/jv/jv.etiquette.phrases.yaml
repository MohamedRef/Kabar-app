schema: kabar.grammar/v1
id: jv.etiquette.phrases
language: jv
level: j4
title:
  target: kula nuwun · mangga · nuwun sewu · ndherek langkung · matur nuwun sanget (unggah-ungguh)
  en: Courtesy phrases and the gestures that go with them
  ar_eg: عبارات الأدب والحركات اللي بتمشي معاها
  ar: عبارات الأدب والإيماءات المصاحبة لها
summary:
  ar_eg: "شوية عبارات ثابتة بتفتحلك كل الأبواب: Kula nuwun على الباب والرد Mangga، Nuwun sewu = لا مؤاخذة، Ndherek langkung وإنت معدّي قدام ناس قاعدين، Matur nuwun sanget = متشكر جدًا، Sami-sami = العفو. ومعاهم: الإيد اليمين، الإشارة بالصباع الكبير، وتوطّي شوية."
  ar: "عبارات ثابتة تفتح الأبواب: Kula nuwun عند الباب وجوابها Mangga، وNuwun sewu = عفوًا، وNdherek langkung عند المرور أمام الجالسين، وMatur nuwun sanget = شكرًا جزيلًا، وSami-sami = العفو. ويصاحبها: اليد اليمنى، والإشارة بالإبهام، والانحناء اليسير."
  en: "A handful of set phrases open every door: Kula nuwun at the door, answered Mangga; Nuwun sewu = excuse me; Ndherek langkung when passing seated people; Matur nuwun sanget = thank you very much; Sami-sami = you're welcome. With them: right hand, point with the thumb, stoop a little."
pattern:
  - "at someone's door: Kula nuwun! → reply: Mangga! (often written monggo)"
  - "before asking or interrupting: Nuwun sewu, … (permisi / maaf)"
  - "passing in front of seated elders: stoop, lower the right hand, Nuwun sewu, ndherek langkung"
  - "offering / inviting: Mangga + verb (Mangga lenggah · Mangga pinarak · Mangga dhahar)"
  - "thanks: Matur nuwun (sanget / kathah) → Sami-sami · deep thanks: Matur sembah nuwun"
  - "sorry: Nyuwun pangapunten / Ngapunten · leaving: Kula nyuwun pamit rumiyin → Sugeng tindak / Ngatos-atos"
  - "host offering food: Sampun repot-repot (please don't go to any trouble) · Sampun cekap, matur nuwun"
  - "How are you? Pripun kabaripun? → Pangestunipun, sae (thanks to your blessing, fine)"
explanation:
  ar_eg: |
    الأدب الجاوي كلام + حركة. العبارات دي هتستخدمها في كل زيارة:
    - Kula nuwun! = اللي بتقوله على الباب بدل ما تخبط أو تنادي (زي «يا أهل البيت!»). صاحب البيت بيرد: Mangga! = اتفضل.
    - Mangga (بتتكتب في الشات monggo) = اتفضل. Mangga lenggah = اتفضل اقعد. Mangga pinarak = اتفضل ادخل / عدّي علينا. وخد بالك: mangga هنا مش المانجا! المانجا بالجاوي pelem.
    - Nuwun sewu = لا مؤاخذة / بعد إذنك، قبل ما تسأل أو تقاطع حد.
    - Ndherek langkung = بعد إذنك أعدّي. لما تعدي قدام ناس كبار قاعدين: توطّي جسمك شوية، وتمد إيدك اليمين لتحت قدامك، وتقولها.
    - Matur nuwun = شكرًا. Matur nuwun sanget = شكرًا جدًا. والرد: Sami-sami = العفو.
    - Nyuwun pangapunten (أو Ngapunten) = آسف / سامحني.
    - وإنت ماشي: Kula nyuwun pamit rumiyin = أستأذن. والمضيف يقول: Sugeng tindak = توصل بالسلامة، أو Ngatos-atos = خلّي بالك من نفسك.
    - المضيف لو جاب أكل: Sampun repot-repot = ماتتعبش نفسك. وبعد الأكل: Sampun cekap, matur nuwun = كفاية كده، متشكر.
    - لو حد سألك Pripun kabaripun? رد حلو جدًا: Pangestunipun, sae = بدعواتك، كويس.
    الحركات:
    - الإيد اليمين دايمًا: تدّي وتاخد وتسلّم بيها. الشمال لأ.
    - تشاور بالصباع الكبير (الإبهام) واليد مقفولة، مش بالسبابة.
    - توطّي شوية وإنت معدّي قدام حد قاعد.
    ده شبه آدابنا جدًا: إحنا كمان بنقول «بسم الله» و«بعد إذنك» وبنستخدم اليمين.
  ar: |
    الأدب الجاوي قول وفعل، وهذه عبارات كل زيارة:
    - Kula nuwun!: تقال عند الباب بدل الطرق أو النداء، وجوابها Mangga! = تفضّل.
    - Mangga (وتُكتب في الدردشة monggo) = تفضّل: Mangga lenggah = تفضّل بالجلوس، Mangga pinarak = تفضّل بالدخول. وليست «المانجو»؛ فالمانجو بالجاوية pelem.
    - Nuwun sewu = عفوًا / بعد إذنك، قبل السؤال أو المقاطعة.
    - Ndherek langkung = بعد إذنكم أمرّ، مع انحناء يسير ومدّ اليد اليمنى إلى أسفل أمام الجالسين.
    - Matur nuwun (sanget) = شكرًا (جزيلًا)، وجوابها Sami-sami = العفو.
    - Nyuwun pangapunten / Ngapunten = آسف.
    - عند الانصراف: Kula nyuwun pamit rumiyin، ويجيب المضيف: Sugeng tindak أو Ngatos-atos.
    - إذا قدّم المضيف طعامًا: Sampun repot-repot = لا تتكلّف، وبعده: Sampun cekap, matur nuwun.
    - وجواب «Pripun kabaripun?» الجميل: Pangestunipun, sae = بدعائكم، بخير.
    والإيماءات: اليد اليمنى للعطاء والأخذ والسلام، والإشارة بالإبهام لا بالسبابة، والانحناء عند المرور أمام الجالسين.
  en: |
    Javanese courtesy is words plus gestures. You'll use these on every visit:
    - Kula nuwun! = what you call at the door instead of knocking. The host answers Mangga! = come in / go ahead.
    - Mangga (often spelled monggo in chats) = please, go ahead. Mangga lenggah = please sit. Mangga pinarak = please come in / stop by. Not the fruit: mango is pelem.
    - Nuwun sewu = excuse me, before asking or interrupting.
    - Ndherek langkung = excuse me, may I pass. When walking past seated elders: stoop a little, lower your right hand in front of you and say it.
    - Matur nuwun = thank you; Matur nuwun sanget = thank you very much. The answer: Sami-sami = you're welcome.
    - Nyuwun pangapunten (or Ngapunten) = I'm sorry.
    - Leaving: Kula nyuwun pamit rumiyin = please excuse me, I'll be going. The host: Sugeng tindak (safe journey) or Ngatos-atos (take care).
    - When the host brings food: Sampun repot-repot = please don't go to any trouble. After eating: Sampun cekap, matur nuwun = that's plenty, thank you.
    - Asked "Pripun kabaripun?", a lovely reply is "Pangestunipun, sae" = thanks to your blessing, fine.
    Gestures:
    - Always the right hand: give, take and shake with it. Never the left.
    - Point with your thumb (hand closed), not your index finger.
    - Stoop slightly when passing someone who is sitting.
    It's close to Egyptian manners: we also say «بعد إذنك», use the right hand and avoid pointing at people.
examples:
  - text: Kula nuwun! — Mangga, mlebet!
    breakdown: kula nuwun = permisi (at the door) · mangga = silakan · mlebet = masuk
    en: Hello, anyone home? — Come in, please!
    ar_eg: يا أهل البيت! — اتفضل ادخل!
    ar: هل من أحد؟ — تفضّل بالدخول!
    register: formal
  - text: Nuwun sewu, ndherek langkung.
    breakdown: nuwun sewu = permisi · ndherek langkung = numpang lewat (krama andhap)
    en: Excuse me, may I pass?
    ar_eg: لا مؤاخذة، بعد إذنكم أعدّي.
    ar: عفوًا، بعد إذنكم أمرّ.
    register: formal
  - text: Matur nuwun sanget, Bu. — Sami-sami.
    breakdown: matur nuwun = terima kasih · sanget = sekali · sami-sami = sama-sama
    en: Thank you very much, ma'am. — You're welcome.
    ar_eg: متشكر جدًا يا هانم. — العفو.
    ar: شكرًا جزيلًا يا سيدتي. — العفو.
    register: formal
  - text: Sampun repot-repot, Bu.
    breakdown: sampun = jangan (at the start of a request) · repot-repot = repot
    en: Please don't go to any trouble, ma'am.
    ar_eg: ماتتعبيش نفسك يا هانم.
    ar: لا تتكلّفي يا سيدتي.
    register: formal
  - text: Pripun kabaripun? — Pangestunipun, sae.
    breakdown: pripun = bagaimana · kabar + -ipun · pangestu + -nipun = berkat doa Anda · sae = baik
    en: How are you? — Fine, thanks to your blessing.
    ar_eg: إزي حضرتك؟ — بدعواتك، كويس.
    ar: كيف حالكم؟ — بخير بدعائكم.
    register: formal
  - text: Kula nyuwun pamit rumiyin. — Inggih, sugeng tindak.
    breakdown: nyuwun pamit = minta diri · rumiyin = dulu · inggih = ya · sugeng tindak = selamat jalan
    en: Please excuse me, I'll be going. — Of course, safe journey.
    ar_eg: أستأذن أنا بقى. — اتفضل، توصل بالسلامة.
    ar: أستأذنكم في الانصراف. — تفضّل، في أمان الله.
    register: formal
mistakes:
  - wrong: Mangga = mango, so Mangga lenggah means "mango, sit"?
    right: Mangga lenggah = please sit. Mango is pelem.
    why:
      ar_eg: mangga بالجاوي = اتفضل. المانجا pelem. (الإندونيسي mangga = مانجا، فخد بالك.)
      ar: mangga بالجاوية = تفضّل، والمانجو pelem، بخلاف الإندونيسية.
      en: In Javanese mangga means please / go ahead; the fruit is pelem (unlike Indonesian mangga).
  - wrong: Pointing at a house with your index finger and saying "Menika griyanipun?"
    right: Point with your right thumb, hand closed, and say "Menika griyanipun?"
    why:
      ar_eg: الإشارة بالسبابة قليلة ذوق عندهم. الإبهام هو المؤدب.
      ar: الإشارة بالسبابة غير مهذبة عندهم، والإبهام هو المهذب.
      en: Pointing with the index finger is rude; the thumb is polite.
  - wrong: Walking upright past seated elders without a word.
    right: Stoop a little, lower your right hand and say "Nuwun sewu, ndherek langkung."
    why:
      ar_eg: المرور كده قدام الكبار من غير استئذان بيبان قلة احترام.
      ar: المرور أمام الكبار دون استئذان يُعدّ قلة احترام.
      en: Walking past elders without asking leave reads as disrespect.
arabic_bridge:
  ar_eg: "nuwun sewu ≈ «لا مؤاخذة / بعد إذنك»، mangga ≈ «اتفضل»، kula nuwun ≈ «يا أهل الدار» أو «السلام عليكم» على الباب، Pangestunipun, sae ≈ «بدعواتك، الحمد لله». والإيد اليمين؟ نفس أدبنا بالظبط."
  ar: "nuwun sewu ≈ «عفوًا / بعد إذنك»، وmangga ≈ «تفضّل»، وkula nuwun ≈ «يا أهل الدار»، وPangestunipun, sae ≈ «بدعائكم، الحمد لله»، وتقديم اليمنى أدب مشترك."
  en: "nuwun sewu ≈ «لا مؤاخذة / بعد إذنك», mangga ≈ «اتفضل», kula nuwun ≈ calling «يا أهل الدار» at the door, Pangestunipun, sae ≈ «بدعواتك، الحمد لله». And the right-hand rule is the same as at home."
