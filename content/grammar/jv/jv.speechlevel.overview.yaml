schema: kabar.grammar/v1
id: jv.speechlevel.overview
language: jv
level: j3
title:
  target: ngoko · krama · krama inggil · krama andhap (unggah-ungguh)
  en: Speech levels — when and with whom
  ar_eg: مستويات الكلام — إمتى ومع مين
  ar: مستويات الكلام — متى ومع من
summary:
  ar_eg: "الجاوي عنده مستويات: ngoko للصحاب (≈ إنت)، krama للناس اللي بتحترمها (≈ حضرتك)، krama inggil كلمات خاصة لأفعال الشخص المحترم (≈ سيادتك)، وkrama andhap كلمات بتواضع بيها نفسك. ومش الضمير بس اللي بيتغير — الكلمات كلها بتتغير."
  ar: "للجاوية مستويات: ngoko للأقران (≈ أنت)، وkrama للتوقير (≈ حضرتك)، وkrama inggil ألفاظ خاصة لأفعال المُعظَّم (≈ سيادتك)، وkrama andhap ألفاظ يتواضع بها المتكلم. ولا يتغير الضمير وحده بل المفردات كلها."
  en: "Javanese has levels: ngoko for friends (≈ إنت), krama for people you respect (≈ حضرتك), krama inggil — special words for a respected person's actions (≈ سيادتك), and krama andhap — humble words for your own. Not just pronouns: whole vocabularies change."
pattern:
  - "ngoko — friends, younger people: Kowe wis mangan?"
  - "krama — strangers, sellers, older people: Sampeyan sampun nedha?"
  - "krama inggil — words that raise the OTHER person: Panjenengan sampun dhahar?"
  - "krama andhap — words that lower YOURSELF toward them: sowan (visit), matur (tell), nyuwun (ask for)"
  - "never use krama inggil for yourself: Kula sampun nedha (not dhahar)"
  - "unsure? polite Indonesian is a safe neutral fallback"
explanation:
  ar_eg: |
    ده أهم درس في الجاوي كله. الجاويين بيسموه unggah-ungguh (آداب الكلام).
    - ngoko (اللي اتعلمناه في J1–J2): مع الصحاب، الأصغر منك، العيلة القريبة. ≈ «إنت».
    - krama: مع حد مش عارفه، بياع في السوق، حد أكبر منك. ≈ «حضرتك».
    - krama inggil: كلمات «مرفوعة» بتستخدمها بس لأفعال وحاجات الشخص اللي بتحترمه (مدرس، جد، حد كبير): dhahar (ياكل) بدل mangan، tindak (يروح) بدل lunga. ≈ «سيادتك» / «تفضّل».
    - krama andhap: العكس — كلمات «بتنزّل» نفسك قدامه: sowan = أزورك (بتواضع)، matur = أقولك، nyuwun = أطلب منك.
    الفرق عن العربي: إحنا بنغيّر الضمير بس (إنت ← حضرتك) والجملة زي ما هي. الجاوي بيغيّر نص الكلمات:
    Kowe wis mangan? ← Sampeyan sampun nedha? ← Panjenengan sampun dhahar?
    القاعدة الذهبية: عمرك ما تستخدم krama inggil لنفسك. «Kula sampun dhahar» (أنا تفضلت بالأكل) غلط ومضحك؛ قول «Kula sampun nedha».
    مين مع مين؟ صاحبك: ngoko. البياع: krama. جدة صاحبك أو مدرسك: krama + krama inggil. وفي البيوت: الأهل بيكلموا العيال ngoko، والعيال بيردوا krama.
    ولو مش متأكد: الإندونيسي المؤدب (saya / Bapak / Ibu) مقبول ومحايد مع أي حد، وكتير من الجاويين نفسهم بيعملوا كده.
  ar: |
    هذا أهم درس في الجاوية، ويسمى unggah-ungguh (آداب الكلام):
    - ngoko (ما تعلمناه في J1–J2): مع الأصدقاء ومن هو أصغر والأهل المقربين.
    - krama: مع الغريب والبائع والأكبر سنًا.
    - krama inggil: ألفاظ رفيعة لأفعال المُعظَّم وأشيائه: dhahar (يأكل) بدل mangan، وtindak (يذهب) بدل lunga.
    - krama andhap: ألفاظ يتواضع بها المتكلم أمامه: sowan (أزور)، matur (أقول)، nyuwun (أطلب).
    والفرق عن العربية أننا نغير الضمير وحده، أما الجاوية فتغير نصف المفردات:
    Kowe wis mangan? ← Sampeyan sampun nedha? ← Panjenengan sampun dhahar?
    والقاعدة الذهبية: لا تستعمل krama inggil لنفسك أبدًا؛ فلا يقال «Kula sampun dhahar» بل «Kula sampun nedha».
    ومع الصديق ngoko، ومع البائع krama، ومع جدة الصديق أو المعلم krama مع krama inggil. ويخاطب الآباء الأبناء بالنغوكو ويجيبهم الأبناء بالكراما.
    وعند الشك فالإندونيسية المهذبة مقبولة محايدة مع الجميع.
  en: |
    This is the most important lesson in Javanese. Javanese call it unggah-ungguh (speech etiquette).
    - ngoko (J1–J2): friends, younger people, close family. ≈ «إنت».
    - krama: strangers, market sellers, older people. ≈ «حضرتك».
    - krama inggil: "raised" words used only for the respected person's actions and things (teacher, grandparent, elder): dhahar (eat) for mangan, tindak (go) for lunga. ≈ «سيادتك».
    - krama andhap: the reverse — humble words for yourself toward them: sowan = visit (humbly), matur = tell, nyuwun = ask for.
    The difference from Arabic: we only swap the pronoun (إنت → حضرتك). Javanese swaps half the words:
    Kowe wis mangan? → Sampeyan sampun nedha? → Panjenengan sampun dhahar?
    Golden rule: never use krama inggil about yourself. "Kula sampun dhahar" (I have deigned to dine) is wrong and comic; say "Kula sampun nedha".
    Who gets what? A friend: ngoko. A seller: krama. Your friend's grandmother or your teacher: krama + krama inggil. At home, parents speak ngoko to children and children answer in krama.
    Unsure? Polite Indonesian (saya / Bapak / Ibu) is a safe, neutral choice with anyone — plenty of Javanese do exactly that.
examples:
  - text: Kowe wis mangan?
    breakdown: kowe = kamu · wis = sudah · mangan = makan (all ngoko)
    en: Have you eaten? (ngoko — to a friend)
    ar_eg: كلت؟ (لصاحبك)
    ar: هل أكلت؟ (للصديق)
    register: informal
  - text: Sampeyan sampun nedha?
    breakdown: sampeyan = Anda · sampun = sudah · nedha = makan (krama)
    en: Have you eaten? (krama — to a seller or an older stranger)
    ar_eg: حضرتك كلت؟ (لبياع أو حد كبير مش عارفه)
    ar: هل أكلتَ؟ (للبائع أو الكبير الغريب)
    register: formal
  - text: Panjenengan sampun dhahar?
    breakdown: panjenengan = Bapak / Ibu · sampun = sudah · dhahar = makan (krama inggil)
    en: Have you eaten? (krama inggil — to a grandparent or teacher)
    ar_eg: سيادتك اتفضلت أكلت؟ (لجدة صاحبك أو مدرسك)
    ar: هل تفضلتم بالأكل؟ (للجد أو المعلم)
    register: formal
  - text: Inggih, kula sampun nedha.
    breakdown: inggih = ya · kula = saya · sampun = sudah · nedha = makan (krama, not krama inggil)
    en: Yes, I've eaten. (answering politely about yourself)
    ar_eg: أيوه، أنا كلت. (بالكراما العادية لنفسك)
    ar: نعم، قد أكلتُ.
    register: formal
  - text: Panjenengan badhe tindak pundi?
    breakdown: panjenengan · badhe = mau · tindak = pergi (krama inggil) · pundi = mana
    en: Where are you going? (to an elder)
    ar_eg: حضرتك رايح على فين؟
    ar: إلى أين تتوجهون؟
    register: formal
mistakes:
  - wrong: Kula sampun dhahar.
    right: Kula sampun nedha.
    why:
      ar_eg: dhahar كلمة تعظيم للتاني بس. لو قلتها عن نفسك كأنك بتقول «أنا تفضّلت سيادتي بالأكل».
      ar: dhahar للتعظيم فلا تُقال عن النفس، كمن يقول «تفضّلتُ أنا بالأكل».
      en: dhahar honours the other person; using it about yourself is like saying "I graciously dined".
  - wrong: Mbah, kowe wis mangan? (to a friend's grandmother)
    right: Mbah, panjenengan sampun dhahar?
    why:
      ar_eg: مع جدة صاحبك ngoko قليلة أدب جدًا. لازم krama + krama inggil.
      ar: مخاطبة الجدة بالنغوكو قلة أدب، والواجب krama مع krama inggil.
      en: Ngoko to a friend's grandmother is rude; she gets krama plus krama inggil.
  - wrong: Krama = just switch kowe to panjenengan.
    right: Krama changes many words (wis → sampun, mangan → nedha / dhahar).
    why:
      ar_eg: مش زي «إنت / حضرتك» عندنا. الكلمات نفسها بتتغير.
      ar: لا يكفي تغيير الضمير، فالمفردات نفسها تتغير.
      en: Unlike إنت / حضرتك, changing the pronoun isn't enough; the words change too.
arabic_bridge:
  ar_eg: "ngoko ≈ «إنت»، krama ≈ «حضرتك»، krama inggil ≈ «سيادتك / معاليك» — بس خد بالك: عندنا الضمير بس اللي بيتغير، وعندهم كلمات زي «ياكل» و«يروح» و«بيت» ليها تلات نسخ."
  ar: "ngoko ≈ أنت، وkrama ≈ حضرتك، وkrama inggil ≈ سيادتك؛ غير أن الجاوية تبدّل المفردات نفسها لا الضمير وحده."
  en: "ngoko ≈ إنت, krama ≈ حضرتك, krama inggil ≈ سيادتك — except Javanese swaps whole words (eat, go, house), not just the pronoun."
