schema: kabar.grammar/v1
id: jv.krama-andhap
language: jv
level: j4
title:
  target: matur · sowan · nyuwun · nyuwun pirsa · ngaturi · ngaturaken · caos · ndherek (krama andhap)
  en: Humble verbs (krama andhap) — lowering yourself toward someone you honour
  ar_eg: أفعال التواضع (krama andhap) — إنك «تنزّل» نفسك قدام حد بتحترمه
  ar: أفعال التواضع (krama andhap) — يتواضع بها المتكلم أمام المعظَّم
summary:
  ar_eg: "krama inggil بترفع التاني؛ krama andhap بتنزّل إنت نفسك قدامه. لما الكبير يتكلم ngendika، وإنت لما تكلمه matur. هو rawuh عندك، وإنت sowan عنده. هو maringi، وإنت ngaturaken."
  ar: "krama inggil ترفع الآخر، وkrama andhap تخفض المتكلم أمامه: يتكلم الكبير ngendika وتكلّمه أنت matur، ويأتيك rawuh وتزوره sowan، ويعطيك maringi وتهديه ngaturaken."
  en: "Krama inggil raises the other person; krama andhap lowers you toward them. The elder ngendika (speaks); you matur (say humbly) to them. They rawuh (come) to you; you sowan (call on) them. They maringi (give); you ngaturaken (offer up)."
pattern:
  - "kula + andhap verb + (dhateng) respected person: Kula badhe matur dhateng Bapak"
  - "say / tell: they ngendika, dhawuh ↔ you matur · answer: you matur"
  - "visit: they rawuh ↔ you sowan (Kula badhe sowan Simbah)"
  - "ask a question: they ndangu ↔ you nyuwun pirsa · ask for: they mundhut ↔ you nyuwun"
  - "give: they maringi, paring ↔ you ngaturaken, caos · invite / inform: you ngaturi"
  - "go along with: you ndherek (Kula ndherek, Pak) · take someone along / accompany: ndherekaken"
  - "receive from them: nyadhong · take leave: nyuwun pamit · deep thanks: matur sembah nuwun"
  - "humble 'I': dalem · palace servants: abdi dalem"
explanation:
  ar_eg: |
    krama andhap هي النص التاني من الأدب الجاوي. krama inggil = بترفع اللي قدامك. krama andhap = بتنزّل نفسك وإنت بتعمل حاجة «ناحيته».
    يعني الكلمات دي بتستخدمها لما إنت (أو حد زيك) بيعمل حاجة لشخص محترم:
    - matur = أقول / أبلّغ (لحد كبير). الكبير نفسه ngendika أو dhawuh. «Kula badhe matur, Pak» = عايز أقول لحضرتك حاجة.
    - sowan = أزور حد كبير (جدي، مدرسي، أهل صاحبي). الكبير لما ييجي rawuh. «Kula badhe sowan Simbah» = هزور جدّي.
    - nyuwun = أطلب. nyuwun pirsa = أسأل (حرفيًا: أطلب أعرف). «Nyuwun pirsa, Pak …» أحسن بداية لأي سؤال لحد كبير.
    - ngaturaken / caos = أقدّم / أهدي. الكبير بيدّيك maringi. «Kula ngaturaken oleh-oleh menika» = اتفضل الهدية دي.
    - ngaturi = أعزم بتواضع، وكمان أبلّغ بأدب. «Kula ngaturi Bapak rawuh» = يشرّفني حضورك.
    - ndherek = أمشي مع / أنضم لحد محترم. «Kula ndherek, Pak» = أنا جاي مع حضرتك. و«ndherek langkung» = بعد إذنك أعدّي.
    - nyuwun pamit = أستأذن أمشي. matur sembah nuwun = شكر عميق جدًا.
    الفكرة: الجملة الواحدة ممكن يبقى فيها الاتنين: إنت بتنزل وهو بيعلى: «Kula badhe sowan dhateng dalemipun Bapak» = sowan (أنا بتواضع) + dalem (بيته المكرّم).
    مع صاحبك أو حد أصغر مش محتاجهم؛ دول للكبار بس.
    وفي الوايانغ وقصر السلطان هتسمع الخدم (abdi dalem) بيقولوا matur للملك طول الوقت — المستويات جزء من الدراما.
  ar: |
    krama andhap هي الشق الثاني من الأدب الجاوي: krama inggil ترفع المخاطَب، وkrama andhap تخفض المتكلم في فعله المتوجه إليه.
    - matur: أقول / أبلّغ للكبير، والكبير ngendika أو dhawuh.
    - sowan: أزور الكبير، والكبير إذا جاء rawuh.
    - nyuwun: أطلب، وnyuwun pirsa: أسأل (أطلب أن أعلم)، وهي أفضل مفتتح لسؤال الكبير.
    - ngaturaken / caos: أقدّم وأُهدي، والكبير يعطي maringi.
    - ngaturi: أدعو بتواضع، وتأتي بمعنى أُبلغ بأدب.
    - ndherek: أرافق المعظَّم، و«ndherek langkung» = بعد إذنكم أمرّ.
    - nyuwun pamit: أستأذن في الانصراف، وmatur sembah nuwun: شكر بالغ.
    وقد يجتمع الصنفان في جملة: «Kula badhe sowan dhateng dalemipun Bapak» = sowan لتواضعي وdalem لتعظيم بيته.
    ولا حاجة إليها مع الأقران والأصغر. وفي الوايانغ وبلاط السلطان يقول الخدم (abdi dalem) matur للملك.
  en: |
    Krama andhap is the other half of Javanese courtesy. Krama inggil raises the person in front of you; krama andhap lowers you when your action is directed at them.
    So you use these words when you (or someone like you) do something toward a respected person:
    - matur = say / report (to an elder). The elder ngendika or dhawuh. "Kula badhe matur, Pak" = I'd like to tell you something, sir.
    - sowan = call on an elder (a grandparent, a teacher, a friend's parents). When the elder comes, they rawuh. "Kula badhe sowan Simbah" = I'm going to visit Grandpa.
    - nyuwun = ask for. nyuwun pirsa = ask a question (lit. request to know). "Nyuwun pirsa, Pak…" is the golden opener for any question to an elder.
    - ngaturaken / caos = offer, present. The elder maringi (gives). "Kula ngaturaken oleh-oleh menika" = please accept this gift.
    - ngaturi = invite humbly, also inform politely. "Kula ngaturi Bapak rawuh" = I'd be honoured if you came, sir.
    - ndherek = go along with a respected person. "Kula ndherek, Pak" = I'll come with you, sir. "Ndherek langkung" = excuse me, may I pass.
    - nyuwun pamit = ask leave to go. matur sembah nuwun = deep, formal thanks.
    One sentence can hold both directions: "Kula badhe sowan dhateng dalemipun Bapak" — sowan lowers you, dalem raises his home.
    With friends or younger people you don't need them; they're for elders.
    In wayang and at the Sultan's palace you'll hear servants (abdi dalem) matur to the king constantly — the levels are part of the drama.
examples:
  - text: Kula badhe matur, Pak.
    breakdown: kula · badhe = mau · matur = bilang (krama andhap) · Pak
    en: I'd like to tell you something, sir.
    ar_eg: عايز أقول لحضرتك حاجة يا أستاذ.
    ar: أودّ أن أقول لكم شيئًا يا سيدي.
    register: formal
  - text: Bapak ngendika menapa?
    breakdown: Bapak · ngendika = berkata (krama inggil) · menapa = apa
    en: What did you say, sir? / What did Father say?
    ar_eg: حضرتك قلت إيه؟
    ar: ماذا قلتم يا سيدي؟
    register: formal
  - text: Kula badhe sowan dhateng dalemipun Bapak.
    breakdown: sowan = berkunjung (krama andhap) · dhateng = ke · dalem + -ipun = rumah (krama inggil) · Bapak
    en: I'd like to call on you at your home, sir.
    ar_eg: حابب أزور حضرتك في بيتك.
    ar: أودّ أن أزوركم في بيتكم.
    register: formal
  - text: Nyuwun pirsa, griyanipun Pak Harjo pundi?
    breakdown: nyuwun pirsa = mau tanya (krama andhap) · griya + -nipun = rumahnya · Pak Harjo · pundi = mana
    en: Excuse me, may I ask where Pak Harjo's house is?
    ar_eg: بعد إذنك، بيت الأستاذ هارجو فين؟
    ar: لو سمحت، أين بيت السيد هارجو؟
    register: formal
  - text: Kula ngaturaken oleh-oleh menika.
    breakdown: ngaturaken = mempersembahkan (krama andhap) · oleh-oleh = buah tangan · menika = ini
    en: Please accept this little gift from me.
    ar_eg: اتفضل الهدية البسيطة دي مني.
    ar: تفضّلوا بقبول هذه الهدية مني.
    register: formal
  - text: Kula nyuwun pamit rumiyin, Bu.
    breakdown: nyuwun pamit = minta izin pulang (krama andhap) · rumiyin = dulu · Bu
    en: Please excuse me, I must be going, ma'am.
    ar_eg: بعد إذنك يا هانم، هستأذن أنا.
    ar: أستأذنكِ في الانصراف يا سيدتي.
    register: formal
mistakes:
  - wrong: Kula badhe ngendika, Pak.
    right: Kula badhe matur, Pak.
    why:
      ar_eg: ngendika للكبير لما هو يتكلم. إنت لما تكلمه matur.
      ar: ngendika لكلام المعظَّم، وكلامك أنت إليه matur.
      en: ngendika is the elder speaking; you speaking to them is matur.
  - wrong: Mangga sowan dhateng griya kula, Pak.
    right: Mangga rawuh dhateng griya kula, Pak.
    why:
      ar_eg: sowan يعني «أزور بتواضع» — مينفعش تطلبها من الكبير. هو rawuh (يشرّف).
      ar: sowan زيارة المتواضع، فلا تُطلب من الكبير؛ والكبير rawuh.
      en: sowan is humble visiting — you can't ask the elder to do it. The elder rawuh.
  - wrong: Simbah ngaturaken arta dhateng kula.
    right: Simbah maringi kula arta.
    why:
      ar_eg: ngaturaken للي بيقدّم «لفوق». لما الكبير يدّيك يبقى maringi.
      ar: ngaturaken لمن يقدّم إلى الأعلى، وعطاء الكبير maringi.
      en: ngaturaken is giving upward; the elder giving to you is maringi.
  - wrong: Aku arep sowan kowe, ya. (to a friend)
    right: Aku arep dolan nang omahmu, ya.
    why:
      ar_eg: sowan للكبار بس. مع صاحبك تبقى غريبة ومضحكة.
      ar: sowan للكبار، ومع الصديق تبدو غريبة.
      en: sowan is for elders; with a friend it sounds odd.
arabic_bridge:
  ar_eg: "زي ما بنقول «أتشرّف بزيارتك» و«اسمحلي أعرض على حضرتك» و«خادمك» — بنصغّر نفسنا عشان نكبّر التاني. matur ≈ «أعرض على سيادتك»، sowan ≈ «أتشرّف بزيارتك»، ngaturaken ≈ «أقدّم لحضرتك». وabdi dalem ≈ «خدّام القصر»."
  ar: "تشبه «أتشرّف بزيارتكم» و«أعرض على سيادتكم» و«خادمكم»: نتواضع لنرفع الآخر. matur ≈ أعرض، وsowan ≈ أتشرّف بزيارتكم، وngaturaken ≈ أقدّم لكم."
  en: "Like «أتشرّف بزيارتك», «أعرض على حضرتك», «خادمك»: shrinking yourself to raise the other. matur ≈ «أعرض على سيادتك», sowan ≈ «أتشرّف بزيارتك», ngaturaken ≈ «أقدّم لحضرتك»."
