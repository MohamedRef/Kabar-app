  notes: >-
    Draft by Claude; awaits review by a Javanese speaker. Forms follow content/javanese/speech-levels.jsonl.
    Please check caos vs ngaturaken, ngaturi as both "invite" and "inform", nyadhong, ndherekaken, matur sembah nuwun,
    and whether "Aku arep dolan nang omahmu" is the natural ngoko fix. The curriculum lists "caos" among the unit's words;
    the table has it as krama andhap of "give" (medium confidence).
