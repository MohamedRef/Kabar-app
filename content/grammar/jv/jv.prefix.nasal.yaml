schema: kabar.grammar/v1
id: jv.prefix.nasal
language: jv
level: j2
title:
  target: N- (nulis, maca, nggawe, ngombe, mangan, nyapu)
  en: "The nasal prefix N- (active verbs)"
  ar_eg: "البادئة الأنفية N- (الفعل المعلوم)"
  ar: "السابقة الأنفية N- (الفعل المبني للمعلوم)"
summary:
  ar_eg: "N- هي meN- الإندونيسية من غير «me»: tulis → nulis (menulis)، waca → maca (membaca)، gawe → nggawe (membuat). أول حرف بيتحول لصوت أنفي، ومع di- / tak- الفعل بيرجع لأصله."
  ar: "N- تقابل meN- الإندونيسية بلا «me»: tulis → nulis، waca → maca، gawe → nggawe، ويتحول أول الجذر إلى صوت أنفي، ومع di- / tak- يعود الجذر."
  en: "N- is Indonesian meN- without the 'me': tulis → nulis (menulis), waca → maca (membaca), gawe → nggawe (membuat). The first sound turns nasal; with di- / tak- the base comes back."
pattern:
  - "p, w → m: pangan → mangan, pikir → mikir, waca → maca"
  - "t → n: tulis → nulis · s, c → ny: sapu → nyapu, cekel → nyekel"
  - "k → ng: kirim → ngirim · vowel → ng: ombe → ngombe, ajar → ngajar"
  - "b → mb: bukak → mbukak · d → nd: delok → ndelok · j → nj: jupuk → njupuk · g → ngg: gawe → nggawe"
  - "l, r → ng(e): rokok → ngrokok · one syllable → nge-: cet → ngecet"
  - "no N-: tuku, turu, lunga, teka, adus · passive / tak-: base form (ditulis, tak waca)"
explanation:
  ar_eg: |
    فاكر meN- في الإندونيسي (menulis، membaca، menyapu)؟ الجاوي بيعمل نفس الحكاية بس من غير «me» — بيفضل الصوت الأنفي لوحده:
    - p وw → m: pangan → mangan (ياكل)، pikir → mikir (يفكر)، waca → maca (يقرا).
    - t → n: tulis → nulis (يكتب).
    - s وc → ny: sapu → nyapu (يكنس)، cekel → nyekel (يمسك).
    - k → ng: kirim → ngirim (يبعت). والكلمة اللي بتبدأ بحرف متحرك بتاخد ng: ombe → ngombe (يشرب)، ajar → ngajar (يدرّس).
    - b وd وj وg مابيقعوش، الصوت الأنفي بيتحط قدامهم: bukak → mbukak (يفتح)، delok → ndelok (يبص، شرق جاوة)، jupuk → njupuk (ياخد)، gawe → nggawe (يعمل).
    - l وr: rokok → ngrokok (يدخن). كلمة من مقطع واحد: nge- (cet → ngecet، يدهن).
    أفعال يومية كتير مابتاخدش N- خالص: tuku (يشتري)، turu (ينام)، lunga (يمشي / يروح)، teka (ييجي)، adus (يستحمى).
    والمهم: مع di- وtak- الفعل بيرجع لأصله: maca → diwaca / tak waca، mangan → dipangan، nulis → ditulis. زي الإندونيسي membaca → dibaca.
    وده بيفيدك وإنت بتقرا: لو شفت ny- جرّب s أو c، n- جرّب t، m- جرّب p أو w، ng- جرّب k أو حرف متحرك.
  ar: |
    تذكر meN- الإندونيسية (menulis، membaca، menyapu)؟ تفعل الجاوية الشيء نفسه بلا «me»، فيبقى الصوت الأنفي وحده:
    - p وw → m: pangan → mangan (يأكل)، pikir → mikir (يفكر)، waca → maca (يقرأ).
    - t → n: tulis → nulis (يكتب).
    - s وc → ny: sapu → nyapu (يكنس)، cekel → nyekel (يمسك).
    - k → ng: kirim → ngirim (يرسل)، والجذر المبدوء بصائت يأخذ ng: ombe → ngombe (يشرب)، ajar → ngajar (يعلّم).
    - b وd وj وg لا تسقط بل يسبقها الأنفي: bukak → mbukak (يفتح)، delok → ndelok (ينظر، في شرق جاوة)، jupuk → njupuk (يأخذ)، gawe → nggawe (يصنع).
    - l وr: rokok → ngrokok (يدخّن)، والجذر أحادي المقطع يأخذ nge-: cet → ngecet (يطلي).
    وكثير من الأفعال اليومية بلا N-: tuku وturu وlunga وteka وadus.
    ومع di- وtak- يعود الجذر: maca → diwaca / tak waca، mangan → dipangan، كما في الإندونيسية membaca → dibaca.
    وللقراءة: ny- → s أو c، n- → t، m- → p أو w، ng- → k أو صائت.
  en: |
    Remember Indonesian meN- (menulis, membaca, menyapu)? Javanese does the same without the "me" — just the nasal is left:
    - p, w → m: pangan → mangan (eat), pikir → mikir (think), waca → maca (read).
    - t → n: tulis → nulis (write).
    - s, c → ny: sapu → nyapu (sweep), cekel → nyekel (hold).
    - k → ng: kirim → ngirim (send). Vowel-initial bases take ng: ombe → ngombe (drink), ajar → ngajar (teach).
    - b, d, j, g stay and get a nasal in front: bukak → mbukak (open), delok → ndelok (look, East Java), jupuk → njupuk (take), gawe → nggawe (make).
    - l, r: rokok → ngrokok (smoke). One-syllable bases take nge-: cet → ngecet (paint).
    Many everyday verbs take no N- at all: tuku (buy), turu (sleep), lunga (go), teka (come), adus (bathe).
    Key point: with di- and tak- the base comes back: maca → diwaca / tak waca, mangan → dipangan, nulis → ditulis — like Indonesian membaca → dibaca.
    Reading trick: ny- → try s or c; n- → t; m- → p or w; ng- → k or a vowel.
examples:
  - text: Sari lagi nulis layang.
    breakdown: Sari · lagi = sedang · N- + tulis → nulis = menulis · layang = surat
    en: Sari is writing a letter.
    ar_eg: ساري بتكتب جواب.
    ar: ساري تكتب رسالة.
    register: informal
  - text: Bapak ngombe kopi nang warung.
    breakdown: bapak · N- + ombe → ngombe = minum · kopi · nang = di · warung
    en: Dad is drinking coffee at the warung.
    ar_eg: بابا بيشرب قهوة في المحل.
    ar: أبي يشرب القهوة في المقهى.
    register: informal
  - text: Ibu nggawe sambel pecel.
    breakdown: ibu · N- + gawe → nggawe = membuat · sambel pecel = sambal pecel
    en: Mum is making pecel sauce.
    ar_eg: ماما بتعمل صوص البيتشل.
    ar: أمي تصنع صلصة البيتشل.
    register: informal
  - text: Aku seneng maca buku.
    breakdown: aku · seneng = suka · N- + waca → maca = membaca · buku
    en: I like reading books.
    ar_eg: أنا بحب القراية.
    ar: أحب قراءة الكتب.
    register: informal
  - text: Bukune wis diwaca.
    breakdown: buku + -ne · wis = sudah · di- + waca = dibaca
    en: The book has been read.
    ar_eg: الكتاب اتقرا خلاص.
    ar: قُرئ الكتاب.
    register: informal
  - text: Aku lagi mikir.
    breakdown: aku · lagi = sedang · N- + pikir → mikir = berpikir
    en: I'm thinking.
    ar_eg: أنا بفكر.
    ar: أنا أفكر.
    register: informal
mistakes:
  - wrong: Bukune wis dimaca.
    right: Bukune wis diwaca.
    why:
      ar_eg: di- بتاخد الأصل (waca)، مش الفعل اللي فيه N- (maca). زي الإندونيسي dibaca مش dimembaca.
      ar: di- تدخل على الجذر waca لا على maca.
      en: di- attaches to the base (waca), not the N- form (maca) — like dibaca, not dimembaca.
  - wrong: Aku nuku roti.
    right: Aku tuku roti.
    why:
      ar_eg: tuku من الأفعال اللي مابتاخدش N-. «يشتري» = tuku على طول.
      ar: tuku لا تأخذ N-.
      en: tuku is one of the verbs that never takes N-.
arabic_bridge:
  ar_eg: "mikir جاية من pikir، ودي من العربي «فكر». وفكرة «الحرف الأول بيتغير والجذر ثابت» قريبة من الأوزان العربية: الجذر واحد والشكل بيتغير حسب الوظيفة."
  ar: "mikir من pikir، وأصلها العربي «فكر». ويشبه ثبات الجذر مع تغير صدره فكرة الأوزان في العربية."
  en: "mikir comes from pikir ← Arabic فكر. A fixed base with a changing front echoes Arabic root-and-pattern thinking."
tags: [prefix, verb, morphology, j2]
