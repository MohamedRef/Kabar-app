schema: kabar.grammar/v1
id: jv.address.terms
language: jv
level: j1
title:
  target: mas, mbak, dhik, cah, dhe, le, nduk, Pak, Bu
  en: Calling people (address terms)
  ar_eg: إزاي تنادي الناس (ألقاب النداء)
  ar: ألفاظ النداء والمخاطبة
summary:
  ar_eg: "الجاويين بينادوا الناس بألقاب العيلة: mas للشاب، mbak للبنت، dhik للأصغر منك، وcah للشلة كلها. والألقاب دي بتيجي مكان «إنت» كمان."
  ar: "ينادي الجاويون الناس بألقاب القرابة: mas للشاب وmbak للفتاة وdhik للأصغر سنًّا وcah للجماعة. وتحل هذه الألقاب محل ضمير المخاطب أيضًا."
  en: "Javanese calls people by family titles: mas for a young man, mbak for a young woman, dhik for someone younger, and cah for the whole gang. These titles also replace 'you'."
pattern:
  - "mas (young man, older brother) · mbak (young woman, older sister): also used in Indonesian"
  - "dhik (someone younger than you; from adhik, younger sibling)"
  - "cah (guys, mate; from bocah = kid): Ayo, cah!"
  - "Pak / Bu (older man / woman) · dhe (short for pakdhe / budhe: uncle, auntie)"
  - "le (to a boy, from thole) · nduk (to a girl)"
  - "sentence + , + title: Piye kabare, Mas?"
explanation:
  ar_eg: |
    في جاوة نادرًا ما بتنادي حد باسمه بس. بتحط لقب عيلة، حتى لو مش قريبك:
    - mas = يا أستاذ / يا كابتن لشاب، وmbak = يا آنسة لبنت أو ست صغيرة. ودول بتسمعهم في الإندونيسي كمان (Mas Ardi).
    - dhik (من adhik = أخ أصغر) = للي أصغر منك، زي طالب أو بيّاع شاب: Pira, Dhik? = بكام يا ابني؟
    - cah (من bocah = عيل) = «يا جماعة / يا صاحبي» بين الصحاب في يوجيا وماديون: Ayo, cah! = يلا يا جماعة!
    - Pak / Bu = للكبار، زي «يا حاج / يا حاجة» أو «يا أستاذ / يا مدام».
    - dhe = اختصار pakdhe (عمو) أو budhe (طنط): «piye dhe» في شات = «إيه رأيك يا عمو؟».
    - le (من thole) لولد صغير، وnduk لبنت صغيرة: زي «يا حبيبي / يا بنتي» من الكبار.
    واللقب بيشتغل كضمير كمان: «Mas wis mangan?» = «حضرتك أكلت؟» (حرفيًا: الأستاذ أكل؟)، زي الإندونيسي «Bapak mau kopi?».
    في سورابايا هتسمع cak وning وrek؛ افهمهم بس متقولهمش في يوجيا.
  ar: |
    قلّما يُنادى أحد في جاوة باسمه مجردًا، بل يُسبق بلقب قرابة وإن لم يكن قريبًا:
    - mas للشاب، وmbak للفتاة أو المرأة الشابة، وهما مستعملان في الإندونيسية أيضًا.
    - dhik (من adhik = الأخ الأصغر) لمن هو أصغر منك.
    - cah (من bocah = الولد) = «يا جماعة / يا صاح» بين الأصحاب في يوجياكرتا وماديون.
    - Pak / Bu للكبار.
    - dhe اختصار pakdhe (العم) أو budhe (العمة).
    - le (من thole) للصبي، وnduk للبنت، يقولها الكبار.
    ويقوم اللقب مقام الضمير: «Mas wis mangan?» = هل أكلتَ؟ (حرفيًا: هل أكل الأخ؟)، كما في الإندونيسية «Bapak mau kopi?».
    وفي سورابايا يقال cak وning وrek، فاعرفها سماعًا.
  en: |
    In Java you rarely call someone by their bare name. You add a family title, even to strangers:
    - mas for a young man, mbak for a young woman: also standard in Indonesian (Mas Ardi).
    - dhik (from adhik, younger sibling) for someone younger than you, like a student or a young seller: Pira, Dhik?
    - cah (from bocah, kid) = "guys / mate" among friends in Jogja and Madiun: Ayo, cah! = Come on, guys!
    - Pak / Bu for older men and women.
    - dhe = short for pakdhe (uncle) / budhe (auntie): "piye dhe" in a chat = "what do you think, uncle?".
    - le (from thole) to a boy, nduk to a girl: what older people call kids.
    The title doubles as "you": "Mas wis mangan?" = Have you eaten? (literally "Has Mas eaten?"), like Indonesian "Bapak mau kopi?".
    In Surabaya you'll hear cak, ning and rek: understand them, but don't use them in Jogja.
examples:
  - text: Piye kabare, Mas?
    breakdown: piye = bagaimana · kabar + -e = kabarnya · Mas
    en: How are you? (to a young man)
    ar_eg: إزيك يا أستاذ؟
    ar: كيف حالك يا أخي؟
    register: informal
  - text: Ayo mangan, cah!
    breakdown: ayo = ayo · mangan = makan · cah = guys (from bocah)
    en: Let's eat, guys!
    ar_eg: يلا ناكل يا جماعة!
    ar: هيا نأكل يا جماعة!
    register: informal
  - text: Dhik, iki pira?
    breakdown: dhik = Dik (to someone younger) · iki = ini · pira = berapa
    en: How much is this? (to a young seller)
    ar_eg: يا ابني، ده بكام؟
    ar: يا بنيّ، بكم هذا؟
    register: informal
  - text: piye dhe
    breakdown: piye = bagaimana · dhe = Pakdhe / Budhe
    en: So, what do you think, uncle? (chat)
    ar_eg: إيه رأيك يا عمو؟
    ar: ما رأيك يا عم؟
    register: chat
  - text: Mbak wis tau neng Malioboro?
    breakdown: mbak = Mbak (= kamu) · wis tau = sudah pernah · neng = ke · Malioboro
    en: Have you (miss) ever been to Malioboro?
    ar_eg: حضرتك رحتي ماليوبورو قبل كده؟
    ar: هل زرتِ ماليوبورو من قبل؟
    register: informal
mistakes:
  - wrong: Cah, sampeyan arep tuku apa? (a seller to one older customer)
    right: Pak, sampeyan arep tuku apa?
    why:
      ar_eg: cah للشلة والصحاب في سنك، مش لراجل كبير. للكبير قول Pak.
      ar: cah للأقران والجماعة، لا للرجل الكبير، فيقال له Pak.
      en: cah is for friends your age, not an older man; use Pak.
  - wrong: Mas Rina
    right: Mbak Rina
    why:
      ar_eg: mas للراجل وmbak للبنت. اللقب لازم يناسب الشخص.
      ar: mas للذكر وmbak للأنثى.
      en: mas is for men, mbak for women.
arabic_bridge:
  ar_eg: "بالظبط زي المصري: «يا أسطى»، «يا حاج»، «يا أبلة»، «يا عمو» — بننادي الغريب بلقب عيلة. وmas ≈ «يا كابتن»، Pak ≈ «يا حاج»، dhe ≈ «يا عمو»، cah ≈ «يا جدعان»."
  ar: "كما يُنادى الغريب في العامية العربية بـ«يا عم» و«يا حاج» و«يا أخي»، يناديه الجاويون بألقاب القرابة."
  en: "Exactly like Egyptian «يا حاج», «يا عمو», «يا جدعان»: strangers get family titles. Pak ≈ «يا حاج», dhe ≈ «يا عمو», cah ≈ «يا جدعان»."
