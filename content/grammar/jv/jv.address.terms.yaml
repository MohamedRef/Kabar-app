cues:
  - match: "mas|mbak|dhik|cah|cak|ning|rek|dhe|le|nduk"
    note:
      ar_eg: "لقب نداء: mas / mbak للي قدّك، dhik للأصغر، cah للشلة، dhe (Pakdhe / Budhe)، le / nduk للصغيرين. cak / ning / rek بتوع سورابايا."
      ar: "لقب نداء: mas / mbak للأقران، dhik للأصغر، cah للجماعة، dhe للعم أو العمة، le / nduk للصغار، وcak / ning / rek من سورابايا."
      en: "Address term: mas / mbak peers, dhik someone younger, cah the gang, dhe (Pakdhe / Budhe), le / nduk to children; cak / ning / rek are Surabaya forms."
