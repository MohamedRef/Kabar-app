schema: kabar.grammar/v1
id: jv.reduplication
language: jv
level: j2
title:
  target: mlaku-mlaku, dolan-dolan, bocah-bocah · bola-bali · lelungan
  en: Doubling words (reduplication)
  ar_eg: تكرار الكلمة
  ar: التكرار (المضاعفة)
summary:
  ar_eg: "زي الإندونيسي: تكرار الكلمة بيدي جمع (bocah-bocah = anak-anak) أو «على راحتك / من غير هدف» (mlaku-mlaku = jalan-jalan). والجاوي عنده كمان تكرار بتغيير الحرف المتحرك (bola-bali = رايح جاي)."
  ar: "كالإندونيسية، يفيد التكرار الجمع (bocah-bocah = anak-anak) أو التسلية بلا غاية (mlaku-mlaku = jalan-jalan)، وللجاوية تكرار مع تغيير الصائت (bola-bali = ذهابًا وإيابًا)."
  en: "As in Indonesian, doubling makes plurals (bocah-bocah = anak-anak) or 'leisurely, aimlessly' (mlaku-mlaku = jalan-jalan). Javanese also doubles with a vowel change (bola-bali = back and forth)."
pattern:
  - "full doubling — plural / variety: bocah-bocah (anak-anak), omah-omah (rumah-rumah)"
  - "full doubling — relaxed, for fun: mlaku-mlaku (jalan-jalan), dolan-dolan, mangan-mangan (makan-makan)"
  - "vowel-change doubling — back and forth, again and again: bola-bali (bolak-balik), mloya-mlayu, clingak-clinguk"
  - "first-syllable doubling (nouns): lelungan (trip), tetuku (shopping)"
  - "doubling is optional when plural is clear: bocah telu (tiga anak), not bocah-bocah telu"
explanation:
  ar_eg: |
    التكرار في الجاوي ليه أشكال:
    1. تكرار كامل للجمع أو التنوع، زي الإندونيسي: bocah-bocah = anak-anak (عيال)، omah-omah = بيوت.
       وزي الإندونيسي، لو فيه رقم أو كلمة زي akeh (كتير) مش محتاج تكرار: bocah telu = تلات عيال.
    2. تكرار كامل بمعنى «على رواقة / للفسحة»: mlaku-mlaku = نتمشى (jalan-jalan)، dolan-dolan = نخرج نتفسح، mangan-mangan = عزومة أكل (makan-makan).
       dolan لوحدها كلمة مهمة جدًا: «يخرج / يزور / يلعب». Dolan nang omahku! = تعالى زورني!
    3. تكرار مع تغيير الحرف المتحرك = «رايح جاي / كل شوية»: bola-bali = رايح جاي، تاني وتالت (bolak-balik)، mloya-mlayu = يجري هنا وهنا، clingak-clinguk = يبص يمين وشمال (زي التايه).
    4. تكرار أول مقطع (في أسماء): lelungan = سفرية (من lunga)، tetuku = تسوّق (من tuku).
    والإندونيسي أخد من الجاوي كلمات من النوع ده، زي gonta-ganti (يغيّر كل شوية).
  ar: |
    للتكرار في الجاوية صور:
    1. تكرار تام للجمع أو التنوع كالإندونيسية: bocah-bocah = أولاد، omah-omah = بيوت، ولا حاجة إليه مع العدد: bocah telu = ثلاثة أولاد.
    2. تكرار تام بمعنى التسلية والتمهل: mlaku-mlaku = التنزه، dolan-dolan = الخروج للنزهة، mangan-mangan = وليمة أكل.
       وdolan وحدها كثيرة الاستعمال: يخرج / يزور / يلعب.
    3. تكرار مع تغيير الصائت للتردد والتكرار: bola-bali = ذهابًا وإيابًا، mloya-mlayu = يجري هنا وهناك، clingak-clinguk = يتلفت حائرًا.
    4. تكرار المقطع الأول في الأسماء: lelungan = رحلة (من lunga)، tetuku = تسوّق (من tuku).
  en: |
    Javanese doubling comes in several shapes:
    1. Full doubling for plural or variety, as in Indonesian: bocah-bocah = anak-anak (kids), omah-omah = houses.
       As in Indonesian, skip it when a number or akeh (many) already shows plural: bocah telu = three kids.
    2. Full doubling for "relaxed, for fun": mlaku-mlaku = stroll (jalan-jalan), dolan-dolan = hang out, mangan-mangan = a casual feast (makan-makan).
       dolan alone is a key verb: go out / visit / play. Dolan nang omahku! = Come visit me!
    3. Doubling with a vowel change = back and forth, again and again: bola-bali = to and fro, repeatedly (bolak-balik), mloya-mlayu = run around, clingak-clinguk = look around confused.
    4. First-syllable doubling (nouns): lelungan = a trip (from lunga), tetuku = shopping (from tuku).
    Indonesian borrowed this kind of word from Javanese, e.g. gonta-ganti (keep changing).
examples:
  - text: Bocah-bocah dolanan nang taman.
    breakdown: bocah-bocah = anak-anak · dolanan = bermain · nang = di · taman
    en: The children are playing in the park.
    ar_eg: العيال بيلعبوا في الجنينة.
    ar: الأطفال يلعبون في الحديقة.
    register: informal
  - text: Ayo mlaku-mlaku nang Benteng Pendem.
    breakdown: ayo · mlaku-mlaku = jalan-jalan · nang = ke · Benteng Pendem
    en: Let's take a stroll to Benteng Pendem.
    ar_eg: يلا نتمشى عند قلعة بنتنج بندم.
    ar: هيا نتنزه إلى قلعة بنتنغ بندم.
    register: informal
  - text: Ayo dolan-dolan malem Minggu.
    breakdown: ayo · dolan-dolan = jalan-jalan · malem Minggu = malam Minggu (Saturday night)
    en: Let's hang out on Saturday night.
    ar_eg: يلا نخرج نتفسح ليلة الحد.
    ar: هيا نخرج للنزهة مساء السبت.
    register: informal
  - text: Aku bola-bali nang stasiun.
    breakdown: aku · bola-bali = bolak-balik · nang = ke · stasiun
    en: I kept going back and forth to the station.
    ar_eg: فضلت رايح جاي على المحطة.
    ar: ظللت أذهب إلى المحطة وأعود مرارًا.
    register: informal
  - text: Dheweke clingak-clinguk kaya wong bingung.
    breakdown: dheweke = dia · clingak-clinguk = tengok kanan-kiri · kaya = seperti · wong = orang · bingung
    en: He was looking around like someone lost.
    ar_eg: كان بيبص يمين وشمال زي التايه.
    ar: كان يتلفت يمينًا وشمالًا كالحائر.
    register: informal
mistakes:
  - wrong: bocah-bocah telu
    right: bocah telu
    why:
      ar_eg: الرقم بيوضح الجمع، فمش محتاج تكرار، زي الإندونيسي tiga anak مش tiga anak-anak.
      ar: العدد يدل على الجمع فلا يُكرَّر الاسم.
      en: The number already shows plural, as in Indonesian tiga anak.
  - wrong: mlaku = jalan-jalan (strolling for fun)
    right: mlaku = walk · mlaku-mlaku = stroll for fun
    why:
      ar_eg: mlaku لوحدها «يمشي» عادي. التكرار هو اللي بيدي معنى الفسحة.
      ar: mlaku للمشي المجرد، والتكرار يضيف معنى التنزه.
      en: mlaku alone is just "walk"; doubling adds the "for fun" sense.
arabic_bridge:
  ar_eg: "bola-bali = «رايح جاي» بالظبط، وmloya-mlayu زي «جري جري». والمصري بيكرر كمان: «شوية شوية»، «حتة حتة»."
  ar: "تشبه bola-bali قولنا «ذهابًا وإيابًا»، والعامية تعرف التكرار مثل «شوية شوية»."
  en: "bola-bali is Egyptian «رايح جاي»; Egyptian doubles too: «شوية شوية»."
