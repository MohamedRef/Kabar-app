title:
  target: Jelaskan seperti kepada anak kecil
  ar_eg: اشرحها كأنك بتكلم طفل
  ar: اشرحها كأنك تخاطب طفلًا
  en: Explain it like I'm a child
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Siniar sains dari Bengkulu
    lines:
      - speaker: Kak Tiara
        text: "Selamat pagi dari Bengkulu! Hari ini Kabar Radio menjadi siniar sains. Aku Tiara."
        ar_eg: "صباح الخير من بنجكولو! النهارده كبار راديو بقى بودكاست علوم. أنا تيارا."
        ar: "صباح الخير من بنغكولو! كبار راديو اليوم بودكاست علمي. أنا تيارا."
        en: "Good morning from Bengkulu! Today Kabar Radio is a science podcast. I'm Tiara."
        note:
          ar_eg: "كلمات: sains = علوم."
          ar: "مفردات: sains = العلوم."
          en: "Words: sains = science."
      - {speaker: Kak Reza, text: "Aku Reza. Di hutan Bengkulu tumbuh bunga raksasa, Rafflesia arnoldii.", ar_eg: "أنا رضا. في غابات بنجكولو بتطلع وردة عملاقة، رافليسيا أرنولدي.", ar: "أنا رضا. في غابات بنغكولو تنمو زهرة عملاقة: رافليزيا أرنولدي.", en: "I'm Reza. In Bengkulu's forests grows a giant flower, Rafflesia arnoldii."}
      - speaker: Kak Tiara
        text: "Bunga tunggal terbesar di dunia! Tapi baunya kayak daging busuk. Ih!"
        ar_eg: "أكبر وردة منفردة في الدنيا! بس ريحتها زي اللحمة البايظة."
        ar: "أكبر زهرة مفردة في العالم! لكن رائحتها كاللحم المتعفن."
        en: "The world's largest single flower! But it smells like rotting meat."
        note:
          ar_eg: "كلمات: baunya = ريحته."
          ar: "مفردات: baunya = رائحته."
          en: "Words: baunya = its smell."
      - speaker: Kak Reza
        text: "Hari ini kita belajar baca sains populer, terus jelasin ide ribet dengan sederhana."
        ar_eg: "النهارده هنتعلم نقرا علوم مبسطة ونشرح أفكار صعبة ببساطة."
        ar: "اليوم نتعلم قراءة العلوم المبسطة وشرح الأفكار المعقدة ببساطة."
        en: "Today we learn to read popular science and explain complex ideas simply."
        note:
          ar_eg: "ribet = معقد/متعب (rumit في الكلام). كلمات: baca = يقرا، اقرا."
          ar: "ribet = معقد (rumit في الكلام). مفردات: baca = يقرأ."
          en: "ribet = complicated, a hassle (spoken rumit). Words: baca = to read, read."
      - {speaker: Kak Tiara, text: "Mohamed, dulu di sekolah kamu paling suka pelajaran sains apa?", ar_eg: "يا محمد، أكتر مادة علوم كنت بتحبها في المدرسة إيه؟", ar: "يا محمد، أي مادة علمية أحببتها أكثر في المدرسة؟", en: "Mohamed, which science subject did you like most at school?"}
  - kind: dialogue
    title: Dua penjelasan
    lines:
      - speaker: Kak Tiara
        text: "Reza bacain kalimat ilmiah. Aku jelasin ke anak umur tujuh tahun."
        ar_eg: "رضا هيقرا جملة علمية. وأنا هشرحها لطفل عنده سبع سنين."
        ar: "يقرأ رضا جملة علمية، وأشرحها أنا لطفل في السابعة."
        en: "Reza reads a scientific sentence. I explain it to a seven-year-old."
        note:
          ar_eg: "قارن الجملة الطويلة المليانة أسماء بالجملة القصيرة البسيطة. كلمات: ilmiah = علمي؛ bacain = membacakan: يقرا بصوت عالي لحد."
          ar: "قارن الجملة الطويلة المزدحمة بالأسماء بالجملة القصيرة البسيطة. مفردات: ilmiah = علميّ؛ bacain = membacakan: يقرأ على الآخرين بصوت عالٍ."
          en: "Compare the long, noun-heavy sentence with the short, simple one. Words: ilmiah = scientific, academic; bacain = membacakan: to read aloud."
      - speaker: Kak Reza
        text: "Rafflesia merupakan tumbuhan parasit yang tidak memiliki daun, batang, maupun akar sejati."
        ar_eg: "«الرافليسيا نبات طفيلي ما عندوش ورق ولا ساق ولا جذور حقيقية»."
        ar: "«الرافليزيا نبات طفيلي لا أوراق له ولا ساق ولا جذور حقيقية»."
        en: "Rafflesia is a parasitic plant with no true leaves, stem or roots."
        note:
          ar_eg: "كلمات: merupakan = يعتبر، هو؛ memiliki = عنده، يملك؛ batang = جذع، ساق؛ daun = ورقة شجر."
          ar: "مفردات: merupakan = يُعَدّ، يمثّل؛ memiliki = يملك، لديه؛ batang = جذع، ساق؛ daun = ورقة نبات."
          en: "Words: merupakan = to be, to constitute; memiliki = to have, to own; batang = trunk, stem; daun = leaf."
      - {speaker: Kak Tiara, text: "Buat anak: Bunga ini nggak bisa makan sendiri. Dia numpang makan dari tanaman lain.", ar_eg: "للطفل: «الوردة دي ما تقدرش تاكل لوحدها. بتاكل من نبات تاني على حسابه».", ar: "للطفل: «هذه الزهرة لا تستطيع أن تأكل وحدها، فتأكل من نبتة أخرى».", en: "For a child: This flower can't feed itself. It eats from another plant."}
      - speaker: Kak Reza
        text: "Bau busuknya berfungsi untuk menarik lalat yang membantu proses penyerbukan."
        ar_eg: "«ريحتها البايظة وظيفتها تجذب الدبان اللي بيساعد في عملية التلقيح»."
        ar: "«تعمل رائحتها النتنة على جذب الذباب الذي يساعد في عملية التلقيح»."
        en: "Its foul smell serves to attract flies that help with pollination."
        note:
          ar_eg: "كلمات: bau = ريحة."
          ar: "مفردات: bau = رائحة."
          en: "Words: bau = smell."
      - {speaker: Kak Tiara, text: "Buat anak: Baunya jelek biar lalat datang. Lalatnya bawa serbuk ke bunga lain.", ar_eg: "للطفل: «ريحتها وحشة عشان الدبان ييجي. والدبان بيشيل اللقاح لوردة تانية».", ar: "للطفل: «رائحتها كريهة لكي يأتي الذباب، فينقل الذباب اللقاح إلى زهرة أخرى».", en: "For a child: It smells bad so flies come. The flies carry pollen to another flower.", note: {ar_eg: "لما بتكلم طفل بتستعمل الكلام اليومي: biar = supaya، bawa = membawa.", ar: "مع الأطفال تستعمل الكلام اليومي: biar = supaya، bawa = membawa.", en: "Talking to a kid, you use everyday speech: biar = supaya, bawa = membawa."}}
      - speaker: Kak Reza
        text: "Bagus! Sekarang gempa. Indonesia terletak di pertemuan beberapa lempeng tektonik."
        ar_eg: "حلو! دلوقتي الزلازل. «إندونيسيا واقعة عند ملتقى كذا لوح تكتوني»."
        ar: "أحسنت! والآن الزلازل: «تقع إندونيسيا عند ملتقى عدة صفائح تكتونية»."
        en: "Great! Now earthquakes. Indonesia lies where several tectonic plates meet."
        note:
          ar_eg: "كلمات: lempeng = لوح."
          ar: "مفردات: lempeng = صفيحة."
          en: "Words: lempeng = plate."
      - speaker: Kak Tiara
        text: "Buat anak: Bumi itu kayak telur retak. Potongan kulitnya gerak pelan-pelan, kadang tabrakan."
        ar_eg: "للطفل: «الأرض زي بيضة مشروخة. حتت القشرة بتتحرك بالراحة، وساعات بتخبط في بعض»."
        ar: "للطفل: «الأرض كبيضة مشروخة، تتحرك قطع قشرتها ببطء وتتصادم أحيانًا»."
        en: "For a child: The Earth is like a cracked egg. Bits of its shell move slowly, and sometimes bump."
        note:
          ar_eg: "كلمات: telur = بيضة؛ gerak = حركة؛ kadang = ساعات، أحيانًا."
          ar: "مفردات: telur = بيضة؛ gerak = حركة؛ kadang = أحيانًا."
          en: "Words: telur = egg; gerak = movement, motion; kadang = sometimes."
      - speaker: Kak Reza
        text: "Perumpamaannya bagus! Kalimat padat cocok buat ilmuwan, kalimat sederhana cocok buat semua orang."
        ar_eg: "تشبيه حلو. الجملة المضغوطة حلوة للعلماء، والجملة البسيطة حلوة للكل."
        ar: "تشبيه جميل. الجملة المكثفة تناسب العلماء، والبسيطة تناسب الجميع."
        en: "Nice comparison. Dense sentences suit scientists; simple ones suit everyone."
        note:
          ar_eg: "كلمات: cocok = مناسب، لايق."
          ar: "مفردات: cocok = مناسب، ملائم."
          en: "Words: cocok = suitable, a good fit."
      - {speaker: Kak Tiara, text: "Di pantai Bengkulu, relawan juga ngelepas tukik, bayi penyu, ke laut. Itu sains yang bisa kita lihat langsung.", ar_eg: "وعلى شط بنجكولو، المتطوعين كمان بيطلقوا صغار السلاحف في البحر. دي علوم نقدر نشوفها بعينينا.", ar: "وعلى شاطئ بنغكولو يطلق المتطوعون صغار السلاحف إلى البحر. هذا علم نراه بأعيننا.", en: "On Bengkulu's beaches, volunteers also release hatchlings, baby turtles, into the sea. That's science we can see."}
  - kind: word_spotlight
    title: Istilah ilmiah
    lines:
      - speaker: Kak Tiara
        text: "Merupakan, memiliki, berfungsi untuk, terletak di: kata kerja khas tulisan ilmiah."
        ar_eg: "merupakan (يُعتبر)، memiliki (يمتلك)، berfungsi untuk (وظيفته)، terletak di (يقع في): أفعال الكتابة العلمية."
        ar: "merupakan (يُعدّ)، memiliki (يمتلك)، berfungsi untuk (يعمل على)، terletak di (يقع في): أفعال الكتابة العلمية."
        en: "Merupakan, memiliki, berfungsi untuk, terletak di: typical verbs of scientific writing."
        note:
          ar_eg: "في الكلام العادي: adalah، punya، buat، ada di. كلمات: khas = مميز لـ، مشهور بيه المكان."
          ar: "ومقابلها اليومي: adalah، punya، buat، ada di. مفردات: khas = مميِّز، خاصّ بـ."
          en: "Everyday equivalents: adalah, punya, buat, ada di. Words: khas = typical, characteristic."
      - speaker: Kak Reza
        text: "Parasit, penyerbukan, lempeng, gempa bumi, gunung api, penyu, tukik."
        ar_eg: "طفيلي، تلقيح، لوح تكتوني، زلزال، بركان، سلحفاة بحرية، صغير السلحفاة."
        ar: "طفيلي، تلقيح، صفيحة، زلزال، بركان، سلحفاة بحرية، فرخ السلحفاة."
        en: "Parasite, pollination, plate, earthquake, volcano, sea turtle, hatchling."
        note:
          ar_eg: "كلمات: api = نار؛ gunung api = بركان."
          ar: "مفردات: api = نار؛ gunung api = بركان."
          en: "Words: api = fire; gunung api = volcano."
      - speaker: Kak Tiara
        text: "Hati-hati: bunga bangkai biasanya nama untuk bunga lain, Amorphophallus. Rafflesia disebut padma raksasa."
        ar_eg: "خلي بالك: bunga bangkai (وردة الجيفة) غالبًا اسم لوردة تانية، الأمورفوفالوس. والرافليسيا اسمها padma raksasa."
        ar: "تنبّه: «زهرة الجيفة» يُطلق غالبًا على زهرة أخرى هي الأمورفوفالوس، أما الرافليزيا فتسمى padma raksasa."
        en: "Careful: bunga bangkai usually names another flower, Amorphophallus. Rafflesia is called padma raksasa."
        note:
          ar_eg: "كلمات: bangkai = جيفة، جثة حيوان؛ disebut = بيتقال له، اسمه."
          ar: "مفردات: bangkai = جيفة؛ disebut = يُسمّى."
          en: "Words: bangkai = carcass, dead body; disebut = to be called."
      - speaker: Kak Reza
        text: "Metode ilmiah: pertanyaan, hipotesis, percobaan, data, kesimpulan."
        ar_eg: "المنهج العلمي: سؤال، فرضية، تجربة، بيانات، نتيجة."
        ar: "المنهج العلمي: سؤال، فرضية، تجربة، بيانات، استنتاج."
        en: "Scientific method: question, hypothesis, experiment, data, conclusion."
        note:
          ar_eg: "كلمات: data = بيانات؛ hipotesis = فرضية."
          ar: "مفردات: data = بيانات؛ hipotesis = فرضية."
          en: "Words: data = data; hipotesis = hypothesis."
      - speaker: Kak Tiara
        text: "Siniar artinya podcast. Kata baru, buatan Indonesia! Tapi jujur, orang-orang lebih sering bilang podcast aja."
        ar_eg: "Siniar يعني بودكاست. كلمة جديدة صنع إندونيسيا! بس بصراحة الناس أغلبهم بيقولوا podcast وخلاص."
        ar: "Siniar تعني بودكاست. كلمة جديدة من صنع إندونيسيا! لكن بصراحة يقول معظم الناس podcast فقط."
        en: "Siniar means podcast. A new, made-in-Indonesia word! But honestly, most people just say podcast."
        note:
          ar_eg: "كلمات: bilang = يقول؛ buatan = صُنع، معمول في."
          ar: "مفردات: bilang = يقول؛ buatan = صُنع."
          en: "Words: bilang = to say; buatan = made."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Rafflesia merupakan tumbuhan parasit."
        ar_eg: "الرافليسيا نبات طفيلي."
        ar: "الرافليزيا نبات طفيلي."
        en: "Rafflesia is a parasitic plant."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Rafflesia merupakan tumbuhan parasit.", ar_eg: "الرافليسيا نبات طفيلي.", ar: "الرافليزيا نبات طفيلي.", en: "Rafflesia is a parasitic plant."}
      - {speaker: Kak Tiara, text: "Baunya berfungsi untuk menarik lalat.", ar_eg: "ريحتها وظيفتها تجذب الدبان.", ar: "تعمل رائحتها على جذب الذباب.", en: "Its smell serves to attract flies."}
      - {speaker: Kak Reza, text: "Baunya berfungsi untuk menarik lalat.", ar_eg: "ريحتها وظيفتها تجذب الدبان.", ar: "تعمل رائحتها على جذب الذباب.", en: "Its smell serves to attract flies."}
      - {speaker: Kak Tiara, text: "Indonesia terletak di pertemuan lempeng.", ar_eg: "إندونيسيا واقعة عند ملتقى الألواح.", ar: "تقع إندونيسيا عند ملتقى الصفائح.", en: "Indonesia lies where plates meet."}
      - {speaker: Kak Reza, text: "Indonesia terletak di pertemuan lempeng.", ar_eg: "إندونيسيا واقعة عند ملتقى الألواح.", ar: "تقع إندونيسيا عند ملتقى الصفائح.", en: "Indonesia lies where plates meet."}
      - {speaker: Kak Tiara, text: "Bumi seperti telur yang retak.", ar_eg: "الأرض زي بيضة مشروخة.", ar: "الأرض كبيضة مشروخة.", en: "The Earth is like a cracked egg."}
      - {speaker: Kak Reza, text: "Bumi seperti telur yang retak.", ar_eg: "الأرض زي بيضة مشروخة.", ar: "الأرض كبيضة مشروخة.", en: "The Earth is like a cracked egg."}
  - kind: outro
    title: Guru sains Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, jelasin ke anak kecil: kenapa dulu Sungai Nil banjir tiap tahun?"
        ar_eg: "يا محمد، اشرح لطفل صغير: ليه النيل كان بيفيض كل سنة زمان؟"
        ar: "يا محمد، اشرح لطفل: لماذا كان النيل يفيض كل عام قديمًا؟"
        en: "Mohamed, explain to a small child: why did the Nile flood every year in the old days?"
        note:
          ar_eg: "دورك! جمل قصيرة وتشبيه واحد."
          ar: "دورك! جمل قصيرة وتشبيه واحد."
          en: "Your turn! Short sentences and one comparison."
      - speaker: Kak Reza
        text: "Petunjuk: hujan di Etiopia, airnya turun ke sungai, kayak ember yang kepenuhan."
        ar_eg: "تلميح: المطر في إثيوبيا، والميه تنزل في النهر، زي جردل مليان زيادة."
        ar: "تلميح: المطر في إثيوبيا، والماء ينحدر إلى النهر، كدلو امتلأ أكثر من اللازم."
        en: "Hint: rain in Ethiopia, water flows into the river, like a bucket that's too full."
        note:
          ar_eg: "كلمات: ember = جردل، سطل."
          ar: "مفردات: ember = دلو."
          en: "Words: ember = bucket, pail."
      - {speaker: Kak Tiara, text: "Besok, tulis penjelasan ilmiah satu paragraf, terus versi buat anak.", ar_eg: "بكرة، اكتب شرح علمي في فقرة، وبعدين نسخة للأطفال.", ar: "غدًا، اكتب شرحًا علميًا في فقرة، ثم نسخة للأطفال.", en: "Tomorrow, write a one-paragraph scientific explanation, then a children's version."}
      - {speaker: Kak Reza, text: "Makasih udah dengerin siniar kita, Mohamed!", ar_eg: "شكرًا إنك سمعت البودكاست بتاعنا يا محمد!", ar: "شكرًا لاستماعك إلى بودكاستنا يا محمد!", en: "Thanks for listening to our podcast, Mohamed!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [siniar, parasit, penyerbukan, tukik, penyu, ilmuwan, lempeng tektonik, metode ilmiah, percobaan, perumpamaan, proses, raksasa, berfungsi]
review:
  status: draft
  verified: false
  notes: |
    Spot-check: Rafflesia arnoldii as largest single flower, parasite on Tetrastigma,
    carrion-fly pollination; "padma raksasa" vs "bunga bangkai" (Amorphophallus
    titanum), note the curriculum lesson is titled "Bunga bangkai" and may need a gloss;
    turtle hatchling releases on Bengkulu beaches; siniar as KBBI word for podcast.
