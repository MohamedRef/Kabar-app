schema: kabar.radio/v1
id: radio.bipa2.u04
language: id
level: bipa2
unit: bipa2.u04
title:
  target: Boleh kurang, Bu?
  ar_eg: ممكن تنزلي شوية؟
  ar: هل يمكن تخفيض السعر؟
  en: Can you go lower?
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Pasar Seni Sukawati
    lines:
      - speaker: Kak Tiara
        text: Halo, selamat pagi! Selamat datang di Kabar Radio! Aku Tiara.
        ar_eg: أهلًا، صباح الخير! أهلًا بيك في كبار راديو! أنا تيارا.
        ar: مرحبًا، صباح الخير! أهلًا بك في كبار راديو! أنا تيارا.
        en: Hello, good morning! Welcome to Kabar Radio! I'm Tiara.
      - speaker: Kak Reza
        text: Aku Reza. Pagi, Tiara! Yuk, ke pasar!
        ar_eg: وأنا رضا. صباح الخير يا تيارا! يلا بينا على السوق!
        ar: وأنا رضا. صباح الخير يا تيارا! هيا بنا إلى السوق!
        en: And I'm Reza. Morning, Tiara! Let's hit the market!
      - speaker: Kak Tiara
        text: Ayo! Hari ini kita di Pasar Seni Sukawati, di Bali.
        ar_eg: يلا! النهارده إحنا في سوق الفنون في سوكاواتي، في بالي.
        ar: هيا! اليوم نحن في سوق الفنون في سوكاواتي، في بالي.
        en: Let's go! Today we're at Sukawati Art Market, in Bali.
        note:
          ar_eg: سوق سوكاواتي مشهور بالقماش والتماثيل الخشب واللوحات، وكل حاجة فيه بالفصال.
          ar: سوق سوكاواتي مشهور بالأقمشة والتماثيل الخشبية واللوحات، وكل شيء فيه بالمساومة.
          en: Sukawati market is famous for cloth, wooden carvings and paintings - and everything there is bargained for.
      - speaker: Kak Reza
        text: Ada kain, patung, lukisan. Banyak banget!
        ar_eg: هنا فيه قماش، وفيه تماثيل، وفيه لوحات. كتير أوي!
        ar: هنا أقمشة وتماثيل ولوحات. كثيرة جدًا!
        en: Here there's cloth, carvings, paintings. So much!
      - speaker: Kak Tiara
        text: Tapi jangan lupa nawar, ya. Jangan langsung bayar!
        ar_eg: بس يا رضا، متنساش تفاصل. متدفعش على طول!
        ar: لكن يا رضا، لا تنسَ المساومة. لا تدفع مباشرة!
        en: But Reza, don't forget to bargain. Don't pay straight away!
        note:
          ar_eg: الفصال متوقع في الأسواق الشعبية، بابتسامة. ابدأ بنص السعر واتقابلوا في النص. السوبرماركت أسعاره ثابتة. nawar = menawar.
          ar: المساومة متوقعة في الأسواق الشعبية بابتسامة. ابدأ بنصف السعر والتقيا في الوسط. أسعار المتاجر الكبرى ثابتة. nawar = menawar.
          en: Bargaining is expected in traditional markets, with a smile. Start at half and meet in the middle. Supermarkets have fixed prices. nawar = menawar.
      - speaker: Kak Reza
        text: Sebuah, seekor, selembar. Ayo, mari, jangan. Sama mahalnya.
        ar_eg: واحدة، واحد (حيوان)، فرخ. يلا، تعالوا، متعملش. غاليين زي بعض.
        ar: واحدة، واحد (لحيوان)، ورقة. هيا، لِنَـ، لا تفعل. بالغلاء نفسه.
        en: One thing, one animal, one sheet. Come on, let us, don't. Just as expensive.
        note:
          ar_eg: موضوع النهارده - كلمات العد (sebuah وseekor)، والدعوة بـ ayo وmari، والنهي بـ jangan، والفصال.
          ar: موضوع اليوم - كلمات العدّ (sebuah وseekor)، والدعوة بـ ayo وmari، والنهي بـ jangan، والمساومة.
          en: Today's topic - counting words (sebuah, seekor), inviting with ayo and mari, "don't" with jangan, and bargaining.
      - speaker: Kak Tiara
        text: Halo, Mohamed! Selamat datang di Sukawati! Jago nawar, nggak?
        ar_eg: أهلًا يا محمد! أهلًا بيك في سوكاواتي! إنت شاطر في الفصال؟
        ar: مرحبًا يا محمد! أهلًا بك في سوكاواتي! هل أنت ماهر في المساومة؟
        en: Hi, Mohamed! Welcome to Sukawati! Any good at bargaining?
        note:
          ar_eg: jago = شاطر أوي في حاجة.
          ar: jago = بارع في شيء.
          en: jago = really good at something.
  - kind: dialogue
    title: Tawar-menawar
    lines:
      - speaker: Kak Reza
        text: Tenang aja. Aku jago nawar! Kamu jadi Bu Nyoman, ya.
        ar_eg: متقلقيش. أنا شاطر في الفصال! إنتي هتبقي مدام نيومان.
        ar: لا تقلقي. أنا ماهر في المساومة! ستكونين السيدة نيومان.
        en: Relax. I'm a pro at bargaining! You be Bu Nyoman.
        note:
          ar_eg: 'تمثيلية: تيارا بتبيع قماش ورضا زبون بيفاصل. Tenang aja = متقلقش = jangan khawatir.'
          ar: 'مشهد تمثيلي: تيارا تبيع القماش ورضا زبون يساوم. Tenang aja = لا تقلق = jangan khawatir.'
          en: A role-play - Tiara sells cloth, Reza haggles. Tenang aja = relax = jangan khawatir.
      - speaker: Kak Tiara
        text: Mari, Pak, lihat-lihat dulu! Kainnya bagus-bagus, lho.
        ar_eg: اتفضل يا أستاذ، اتفرج! القماش كله حلو.
        ar: تفضّل يا سيدي، تفرّج! الأقمشة كلها جميلة.
        en: Come in, sir, have a look around! The fabrics are all lovely.
      - speaker: Kak Reza
        text: Bu, bagusan mana, yang merah atau yang biru?
        ar_eg: يا مدام، أنهي أحلى، القماش الأحمر ولا الأزرق؟
        ar: يا سيدتي، أيّهما أجمل، القماش الأحمر أم الأزرق؟
        en: Which is nicer, the red or the blue?
        note:
          ar_eg: bagusan = lebih bagus في الكلام. «X-an mana?» = أنهي أكتر؟
          ar: bagusan = lebih bagus في الكلام اليومي. «X-an mana?» = أيهما أكثر؟
          en: bagusan = lebih bagus. 'X-an mana?' = which is more X?
      - speaker: Kak Tiara
        text: Sama aja, Pak. Yang merah sama bagusnya dengan yang biru.
        ar_eg: زي بعض يا أستاذ. القماش الأحمر حلو زي الأزرق بالظبط.
        ar: سيّان يا سيدي. القماش الأحمر جميل مثل الأزرق تمامًا.
        en: It's all the same, sir. The red cloth is just as nice as the blue cloth.
      - speaker: Kak Reza
        text: Kain ini berapa, Bu?
        ar_eg: القماش ده بكام يا مدام؟
        ar: كم سعر هذا القماش يا سيدتي؟
        en: How much is this cloth?
      - speaker: Kak Tiara
        text: Dua ratus ribu, Pak. Dua-duanya sama mahalnya.
        ar_eg: ميتين ألف يا أستاذ. الاتنين بنفس السعر.
        ar: مئتا ألف يا سيدي. الاثنان بالسعر نفسه.
        en: Two hundred thousand, sir. Both are the same price.
      - speaker: Kak Reza
        text: Wah, mahal banget. Seratus, boleh?
        ar_eg: يا خبر، غالي أوي. مية ألف، ينفع؟
        ar: يا للغلاء. مئة ألف، هل يجوز؟
        en: Oh, too expensive. A hundred thousand, OK?
      - speaker: Kak Tiara
        text: Aduh, jangan seratus, Pak. Saya rugi! Seratus delapan puluh.
        ar_eg: يا لهوي، مش مية يا أستاذ. أنا كده هخسر! مية وتمانين.
        ar: آه، ليس مئة يا سيدي. سأخسر! مئة وثمانون.
        en: Oh no, not a hundred, sir. I'd make a loss! A hundred and eighty.
      - speaker: Kak Reza
        text: Di sebelah, kain yang sama cuma seratus dua puluh, lho.
        ar_eg: في المحل اللي جنبك، نفس القماش بمية وعشرين ألف.
        ar: في المتجر المجاور، القماش نفسه بمئة وعشرين ألفًا.
        en: Next door, the same cloth is only a hundred and twenty, you know.
        note:
          ar_eg: cuma = hanya = «بس».
          ar: cuma = hanya = «فقط».
          en: cuma = hanya = 'only'.
      - speaker: Kak Tiara
        text: Seratus lima puluh. Itu harga pas.
        ar_eg: مية وخمسين. ده آخر سعر.
        ar: مئة وخمسون. هذا السعر النهائي.
        en: A hundred and fifty. That's my final price.
      - speaker: Kak Reza
        text: Seratus tiga puluh, saya ambil dua lembar. Boleh kurang, ya?
        ar_eg: مية وتلاتين ألف، وهاخد اتنين. ممكن تنزلي؟
        ar: مئة وثلاثون ألفًا، وسآخذ قطعتين. هل يمكن التخفيض؟
        en: A hundred and thirty thousand, and I'll take two pieces. Can you go lower?
      - speaker: Kak Tiara
        text: Ya udah, deh, boleh. Jangan lupa datang lagi, ya!
        ar_eg: خلاص، ماشي. متنساش تيجي تاني!
        ar: حسنًا، موافقة. لا تنسَ أن تعود مرة أخرى!
        en: OK then, fine. Don't forget to come again!
        note:
          ar_eg: Ya udah, deh = ya sudah = «خلاص ماشي».
          ar: Ya udah, deh = ya sudah = «حسنًا إذن».
          en: Ya udah, deh = ya sudah = 'oh, all right'.
      - speaker: Kak Reza
        text: Makasih, Bu. Pasti!
        ar_eg: شكرًا يا مدام. أكيد!
        ar: شكرًا يا سيدتي. بالتأكيد!
        en: Thank you. Definitely!
      - speaker: Kak Tiara
        text: Reza, keren! Sekarang beli buah sama sayur. Kamu mau apa?
        ar_eg: جامد يا رضا! دلوقتي نشتري فاكهة وخضار. عايز إيه؟
        ar: رائع يا رضا! الآن نشتري الفاكهة والخضار. ماذا تريد؟
        en: Reza, nice one! Now let's buy fruit and veg. What do you want?
        note:
          ar_eg: تيارا رجعت تيارا، وبيكملوا التسوق سوا.
          ar: عادت تيارا إلى نفسها، ويكملان التسوق معًا.
          en: Tiara is herself again, and they carry on shopping together.
      - speaker: Kak Reza
        text: Aku mau sekilo jeruk, dua ikat sayur, sama sebotol air.
        ar_eg: عايز كيلو برتقان، وربطتين خضار، وإزازة مية.
        ar: أريد كيلو برتقال، وحزمتين من الخضار، وزجاجة ماء.
        en: I want a kilo of oranges, two bunches of vegetables and a bottle of water.
      - speaker: Kak Tiara
        text: Kelapa mau, nggak? Sebiji sepuluh ribu.
        ar_eg: وعايز جوز هند كمان؟ الواحدة بعشرة آلاف.
        ar: وهل تريد جوز الهند أيضًا؟ الواحدة بعشرة آلاف.
        en: Do you want coconuts too? Ten thousand each.
      - speaker: Kak Reza
        text: Boleh, dua biji. Dan sebuah patung kayu untuk ibu saya.
        ar_eg: ماشي، اتنين. وتمثال خشب لأمي.
        ar: حسنًا، اثنتان. وتمثال خشبي لأمي.
        en: OK, two. And a wooden carving for my mother.
      - speaker: Kak Tiara
        text: Eh, lihat! Ada kucing di bawah meja. Lucu banget!
        ar_eg: بص! فيه قطة تحت الترابيزة. عسولة أوي!
        ar: انظر! هناك قطة تحت الطاولة. لطيفة جدًا!
        en: Look! There's a cat under the table. So cute!
      - speaker: Kak Reza
        text: Jangan dipegang! Kucingnya galak.
        ar_eg: متلمسيهاش! القطة دي شرسة.
        ar: لا تلمسيها! تلك القطة شرسة.
        en: Don't touch it! The cat's fierce.
      - speaker: Kak Tiara
        text: Oke, oke! Yuk, pulang. Semuanya habis berapa?
        ar_eg: ماشي، ماشي! يلا نروّح. الحساب كله كام؟
        ar: حسنًا، حسنًا! هيا نعود. كم المجموع؟
        en: OK, OK! Let's go home. How much did it all come to?
      - speaker: Kak Reza
        text: Empat ratus ribu. Tapi aku nawar, jadi nggak mahal, dong!
        ar_eg: كله بأربعمية ألف. بس أنا فاصلت، فمش غالي!
        ar: المجموع أربعمئة ألف. لكني ساومتُ، لذلك ليس غاليًا!
        en: Four hundred thousand. But I bargained, so it wasn't expensive!
  - kind: word_spotlight
    title: Sebuah, ayo, jangan
    lines:
      - speaker: Kak Tiara
        text: Orang. Di kelas ada dua puluh orang mahasiswa.
        ar_eg: شخص. في الفصل فيه عشرين طالب.
        ar: شخص. في الصف عشرون طالبًا.
        en: People. There are twenty students in the class.
        note:
          ar_eg: كلمات العد بتيجي بين الرقم والاسم - dua orang، seekor kucing. والـ se- معناها «واحد».
          ar: تأتي كلمات العدّ بين العدد والاسم - dua orang، seekor kucing. وse- تعني «واحد».
          en: Counting words go between the number and the noun - dua orang, seekor kucing. se- means "one".
      - speaker: Kak Reza
        text: Ekor. Pak Irwan punya seekor kucing. Berapa ekor?
        ar_eg: ديل (للحيوانات). أستاذ إروان عنده قطة. كام واحدة؟
        ar: ذيل (للحيوانات). لدى الأستاذ إروان قطة. كم واحدة؟
        en: Tail, for animals. Pak Irwan has a cat. How many?
      - speaker: Kak Tiara
        text: Buah. Saya beli sebuah patung kayu. Lembar. Ni Luh minta selembar kain batik.
        ar_eg: حبة (للحاجات). اشتريت تمثال خشب. فرخ (للورق والقماش). ني لوه طلبت حتة قماش باتيك.
        ar: حبة (للأشياء). اشتريتُ تمثالًا خشبيًا. ورقة (للورق والقماش). طلبت ني لوه قطعة قماش باتيك.
        en: For things. I bought a wooden carving. For sheets. Ni Luh asks for a piece of batik cloth.
      - speaker: Kak Reza
        text: Ikat, botol, kilo. Saya beli dua ikat sayur dan sekilo jeruk. Minta segelas teh manis, Mbak.
        ar_eg: ربطة، إزازة، كيلو. اشتريت ربطتين خضار وكيلو برتقان. كوباية شاي بسكر لو سمحتي.
        ar: حزمة، زجاجة، كيلو. اشتريتُ حزمتين من الخضار وكيلو برتقال. كوب شاي محلّى من فضلك.
        en: Bunch, bottle, kilo. I bought two bunches of vegetables and a kilo of oranges. A glass of sweet tea, please.
      - speaker: Kak Tiara
        text: Kertas, kertas. Selembar kertas.
        ar_eg: ورق، ورق. فرخ ورق.
        ar: ورق، ورق. ورقة.
        en: Paper, paper. A sheet of paper.
        note:
          ar_eg: الجسر العربي - kertas من «قرطاس»، وkhawatir من «خاطر».
          ar: الجسر العربي - kertas من «قرطاس»، وkhawatir من «خاطر».
          en: Arabic Bridge - kertas comes from «قرطاس», and khawatir from «خاطر».
      - speaker: Kak Reza
        text: Ayo, yuk, mari. Ayo, kita ke pasar! Ngopi, yuk! Mari kita mulai.
        ar_eg: يلا، يلا بينا، تعالوا. يلا على السوق! نشرب قهوة؟ يلا نبدأ.
        ar: هيا، هيا بنا، لِنَبدأ. هيا إلى السوق! لنشرب القهوة! لنبدأ.
        en: Come on, let's, let us. Come on, to the market! Coffee, anyone? Let us begin.
        note:
          ar_eg: ayo عادية، yuk ناعمة وبين الصحاب، mari رسمية ومؤدبة.
          ar: ayo عادية، وyuk ناعمة عامية، وmari رسمية مهذبة.
          en: ayo is everyday, yuk soft and casual, mari formal and polite.
      - speaker: Kak Tiara
        text: Jangan. Jangan lupa bawa payung. Jangan khawatir, saya bisa sendiri.
        ar_eg: متعملش. متنساش تاخد شمسية. متقلقش، أنا أقدر لوحدي.
        ar: لا تفعل. لا تنسَ المظلة. لا تقلق، أستطيع وحدي.
        en: Don't. Don't forget your umbrella. Don't worry, I can do it myself.
        note:
          ar_eg: jangan للنهي (متعملش)، وtidak للنفي (مش). Jangan pergi! يعني «متمشيش!».
          ar: jangan للنهي، وtidak للنفي. Jangan pergi! أي «لا تذهب!».
          en: jangan forbids (don't!), tidak just negates (not). Jangan pergi! means "Don't go!".
      - speaker: Kak Reza
        text: Jangan mahal-mahal, Bu! Boleh kurang? Harga pas.
        ar_eg: متغليش يا مدام! ممكن تنزلي؟ آخر سعر.
        ar: لا تغالي يا سيدتي! هل يمكن التخفيض؟ السعر النهائي.
        en: Don't make it so expensive! Can you go lower? Final price.
      - speaker: Kak Tiara
        text: Kurangin dikit, dong! Ya udah, deh.
        ar_eg: نزّل شوية بقى! خلاص ماشي.
        ar: خفّض قليلًا من فضلك! حسنًا إذن.
        en: Knock a bit off, go on! Oh, all right.
        note:
          ar_eg: kurangin = kurangi (-in بدل -i في الكلام)، وdikit = sedikit. أشهر جملة في السوق.
          ar: kurangin = kurangi (‎-in بدل ‎-i في الكلام)، وdikit = sedikit. من أشهر عبارات السوق.
          en: kurangin = kurangi (spoken -in for -i), dikit = sedikit. The classic market line.
      - speaker: Kak Tiara
        text: Setinggi, semahal. Adik saya setinggi saya. Patung ini semahal patung itu.
        ar_eg: طول، غلو. أخويا الصغير طولي. التمثال ده غالي زي التمثال ده.
        ar: بطول، بغلاء. أخي الصغير بطولي. هذا التمثال بغلاء ذلك التمثال.
        en: As tall as, as expensive as. My younger brother is as tall as me. This carving is as expensive as that one.
      - speaker: Kak Reza
        text: Sama dengan. Warnanya sama dengan baju saya. Tidak semahal. Harga di sini tidak semahal di Kuta.
        ar_eg: زي. لونه زي قميصي. مش غالي زي. الأسعار هنا مش غالية زي كوتا.
        ar: مثل. لونه مثل قميصي. ليس بغلاء. الأسعار هنا ليست بغلاء كوتا.
        en: The same as. The colour is the same as my shirt. Not as expensive. Prices here aren't as high as in Kuta.
  - kind: recap
    title: Ya sudah, boleh!
    lines:
      - speaker: Kak Tiara
        text: Ayo, kita ke pasar!
        ar_eg: يلا بينا على السوق!
        ar: هيا بنا إلى السوق!
        en: Come on, let's go to the market!
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
          ar: ببطء. ردّد كل جملة بعدنا.
          en: Slowly. Repeat each sentence after us.
      - speaker: Kak Reza
        text: Ayo, kita ke pasar!
        ar_eg: يلا بينا على السوق!
        ar: هيا بنا إلى السوق!
        en: Come on, let's go to the market!
      - speaker: Kak Tiara
        text: Jangan lupa menawar. Jangan langsung bayar!
        ar_eg: متنساش تفاصل. متدفعش على طول!
        ar: لا تنسَ المساومة. لا تدفع مباشرة!
        en: Don't forget to bargain. Don't pay straight away!
      - speaker: Kak Reza
        text: Jangan lupa menawar. Jangan langsung bayar!
        ar_eg: متنساش تفاصل. متدفعش على طول!
        ar: لا تنسَ المساومة. لا تدفع مباشرة!
        en: Don't forget to bargain. Don't pay straight away!
      - speaker: Kak Tiara
        text: Kain ini berapa, Bu?
        ar_eg: القماش ده بكام يا مدام؟
        ar: كم سعر هذا القماش يا سيدتي؟
        en: How much is this cloth?
      - speaker: Kak Reza
        text: Kain ini berapa, Bu?
        ar_eg: القماش ده بكام يا مدام؟
        ar: كم سعر هذا القماش يا سيدتي؟
        en: How much is this cloth?
      - speaker: Kak Tiara
        text: Terlalu mahal. Boleh kurang?
        ar_eg: غالي أوي. ممكن تنزلي؟
        ar: غالٍ جدًا. هل يمكن التخفيض؟
        en: Too expensive. Can you go lower?
