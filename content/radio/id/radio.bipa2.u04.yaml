  - kind: outro
    title: Jangan lupa datang lagi!
    lines:
      - speaker: Mbak Gadis
        text: Mohamed, kain ini dua ratus ribu. Kamu mau bayar berapa?
        ar_eg: يا محمد، القماش ده بميتين ألف. هتدفع كام؟
        ar: يا محمد، هذا القماش بمئتي ألف. كم ستدفع؟
        en: Mohamed, this cloth is two hundred thousand. How much will you pay?
        note:
          ar_eg: دورك! فاصل بصوت عالي بجملة أو اتنين.
          ar: دورك! ساوم بصوت مسموع بجملة أو جملتين.
          en: Your turn! Haggle out loud in a sentence or two.
      - speaker: Mas Ardi
        text: Wah, terlalu mahal, Bu! Jangan mahal-mahal. Seratus ribu, boleh?
        ar_eg: يا خبر، غالي أوي يا مدام! متغليش. مية ألف، ينفع؟
        ar: يا للغلاء يا سيدتي! لا تغالي. مئة ألف، هل يجوز؟
        en: Oh, too expensive! Don't make it so pricey. A hundred thousand, OK?
      - speaker: Mbak Gadis
        text: Aduh, saya rugi! Tapi ya sudah, boleh. Orang Mesir pintar menawar!
        ar_eg: يا لهوي، أنا كده خسرانة! بس خلاص، ماشي. المصريين شاطرين في الفصال!
        ar: آه، سأخسر! لكن حسنًا، موافقة. المصريون ماهرون في المساومة!
        en: Oh no, I'm losing money! But OK then, fine. Egyptians are good at bargaining!
      - speaker: Mas Ardi
        text: Besok, coba lihat dapur kamu. Ada apa di sana? Sebuah, sebotol, seikat.
        ar_eg: بكرة بص في مطبخك. فيه إيه هناك؟ واحدة، إزازة، ربطة.
        ar: غدًا انظر في مطبخك. ماذا يوجد هناك؟ حبة، زجاجة، حزمة.
        en: Tomorrow, look in your kitchen. What's there? One thing, a bottle, a bunch.
        note:
          ar_eg: تحدي بكرة الصغير - قول تلات حاجات في مطبخك بكلمة العد الصح - sebotol air، sekilo gula.
          ar: تحدّي الغد الصغير - اذكر ثلاثة أشياء في مطبخك بكلمة العدّ الصحيحة - sebotol air، sekilo gula.
          en: Tomorrow's tiny challenge - name three things in your kitchen with the right counting word - sebotol air, sekilo gula.
      - speaker: Mbak Gadis
        text: Terima kasih, Mas Ardi. Jangan lupa patung untuk ibumu!
        ar_eg: شكرًا يا أردي. متنساش التمثال بتاع مامتك!
        ar: شكرًا يا أردي. لا تنسَ التمثال لأمك!
        en: Thank you, Ardi. Don't forget the carving for your mother!
      - speaker: Mas Ardi
        text: Pasti! Terima kasih, Mohamed. Mari!
        ar_eg: أكيد! شكرًا يا محمد. سلام!
        ar: بالتأكيد! شكرًا يا محمد. إلى اللقاء!
        en: Definitely! Thank you, Mohamed. Bye now!
        note:
          ar_eg: Mari! لوحدها تحية وداع مؤدبة، زي «أستأذن».
          ar: Mari! وحدها تحية وداع مهذبة، مثل «أستأذن».
          en: On its own, "Mari!" is a polite way to say goodbye.
      - speaker: Mbak Gadis
        text: Sampai jumpa besok di Kabar Radio, Mohamed!
        ar_eg: أشوفك بكرة في كبار راديو يا محمد!
        ar: إلى اللقاء غدًا في كبار راديو يا محمد!
        en: See you tomorrow on Kabar Radio, Mohamed!
