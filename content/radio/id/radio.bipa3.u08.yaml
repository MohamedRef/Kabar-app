schema: kabar.radio/v1
id: radio.bipa3.u08
language: id
level: bipa3
unit: bipa3.u08
title:
  target: Kalau terjadi gempa
  ar_eg: لو حصل زلزال
  ar: إذا وقع زلزال
  en: If an earthquake happens
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Tetebatu
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Tetebatu! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من تيتيباتو! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من تيتيباتو! هذا كبار راديو. أنا تيارا.", en: "Good morning from Tetebatu! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Di sini sawahnya hijau dan ada air terjun di hutan.", ar_eg: "أنا رضا. الغيطان هنا خضرا وفيه شلال في الغابة.", ar: "أنا رضا. حقول الأرز هنا خضراء، وفي الغابة شلال.", en: "I'm Reza. The rice fields here are green and there's a waterfall in the forest."}
      - speaker: Kak Tiara
        text: "Indonesia berada di Cincin Api. Karena itu, gempa bumi dan gunung meletus sering terjadi."
        ar_eg: "إندونيسيا على «حزام النار». عشان كده الزلازل والبراكين بتحصل كتير."
        ar: "تقع إندونيسيا على «حلقة النار»، لذلك تكثر فيها الزلازل وثوران البراكين."
        en: "Indonesia sits on the Ring of Fire. That's why earthquakes and eruptions happen often."
      - speaker: Kak Reza
        text: "Pada tahun 2018, Lombok mengalami beberapa gempa besar. Sejak itu, warga membangun rumah yang lebih kuat."
        ar_eg: "سنة 2018 لومبوك حصل فيها كذا زلزال كبير. ومن ساعتها الناس بتبني بيوت أقوى."
        ar: "في عام 2018 شهدت لومبوك عدة زلازل كبيرة، ومنذ ذلك الحين يبني السكان بيوتًا أمتن."
        en: "In 2018 Lombok had several big earthquakes. Since then people have built stronger houses."
      - {speaker: Kak Tiara, text: "Mohamed, apakah di Mesir pernah ada gempa?", ar_eg: "يا محمد، حصل زلزال في مصر قبل كده؟", ar: "يا محمد، هل وقع زلزال في مصر من قبل؟", en: "Mohamed, has Egypt ever had an earthquake?"}
  - kind: dialogue
    title: Latihan siaga gempa
    lines:
      - speaker: Kak Reza
        text: "Hari ini ada latihan gempa di sekolah desa. Kak Tiara jadi gurunya."
        ar_eg: "النهارده فيه تدريب على الزلازل في مدرسة القرية. تيارا هتبقى المدرّسة."
        ar: "اليوم تدريب على الزلازل في مدرسة القرية، وتيارا هي المعلمة."
        en: "Today there's an earthquake drill at the village school. Tiara is the teacher."
        note:
          ar_eg: "مشهد تمثيلي: تيارا مدرّسة، ورضا تلميذ."
          ar: "مشهد تمثيلي: تيارا معلمة، ورضا تلميذ."
          en: "A role-play: Tiara is the teacher, Reza a pupil."
      - {speaker: Kak Tiara, text: "Anak-anak, dengarkan. Kalau terjadi gempa, jangan panik.", ar_eg: "يا ولاد، اسمعوا. لو حصل زلزال، متتخضوش.", ar: "يا أطفال، استمعوا. إذا وقع زلزال فلا تذعروا.", en: "Children, listen. If an earthquake happens, don't panic."}
      - {speaker: Kak Reza, text: "Bu Guru, kita harus lari ke luar?", ar_eg: "يا أبلة، لازم نجري برة؟", ar: "يا معلمتي، هل يجب أن نركض إلى الخارج؟", en: "Miss, do we have to run outside?"}
      - {speaker: Kak Tiara, text: "Tidak langsung. Pertama, berlindung di bawah meja supaya kepala tidak terkena benda jatuh.", ar_eg: "مش على طول. الأول، استخبوا تحت الترابيزة عشان راسكم متتخبطش من حاجة واقعة.", ar: "ليس فورًا. أولًا، احتموا تحت الطاولة كي لا تصيب رؤوسكم الأشياء الساقطة.", en: "Not straight away. First, take cover under a desk so falling things don't hit your head."}
      - {speaker: Kak Reza, text: "Lalu?", ar_eg: "وبعدين؟", ar: "ثم؟", en: "Then?"}
      - {speaker: Kak Tiara, text: "Selanjutnya, pegang kaki meja. Setelah guncangan berhenti, keluar pelan-pelan ke lapangan.", ar_eg: "بعد كده، امسكوا رجل الترابيزة. ولما الهزة توقف، اطلعوا بالراحة على الملعب.", ar: "بعد ذلك، أمسكوا بأرجل الطاولة. وحين يتوقف الاهتزاز اخرجوا بهدوء إلى الساحة.", en: "Next, hold the desk leg. When the shaking stops, go out slowly to the field."}
      - {speaker: Kak Reza, text: "Kenapa ke lapangan, Bu?", ar_eg: "ليه على الملعب يا أبلة؟", ar: "لماذا إلى الساحة يا معلمتي؟", en: "Why the field, Miss?"}
      - {speaker: Kak Tiara, text: "Karena di lapangan tidak ada bangunan, sehingga kita aman dari tembok yang roboh.", ar_eg: "عشان مفيش مباني في الملعب، فبنبقى في أمان من الحيطان اللي بتقع.", ar: "لأنه لا مبانيَ في الساحة، فنكون في مأمن من الجدران المنهارة.", en: "Because there are no buildings on the field, so we're safe from falling walls."}
      - {speaker: Kak Reza, text: "Kalau kita di pantai?", ar_eg: "ولو إحنا على البحر؟", ar: "وإن كنا على الشاطئ؟", en: "What if we're at the beach?"}
      - speaker: Kak Tiara
        text: "Kalau gempanya kuat dan air laut tiba-tiba surut, segera lari ke tempat tinggi. Bisa ada tsunami."
        ar_eg: "لو الزلزال قوي والبحر فجأة انسحب لورا، اجري على طول لمكان عالي. ممكن يبقى فيه تسونامي."
        ar: "إن كان الزلزال قويًا وانحسر البحر فجأة، فاركضوا فورًا إلى مكان مرتفع، فقد يأتي تسونامي."
        en: "If the quake is strong and the sea suddenly pulls back, run to high ground at once. A tsunami may come."
        note:
          ar_eg: "kalau = لو (شرط)، supaya = عشان (هدف)، sehingga = فـ (نتيجة)."
          ar: "kalau = إذا (شرط)، وsupaya = كي (غاية)، وsehingga = بحيث / فـ (نتيجة)."
          en: "Kalau = if (condition), supaya = so that (purpose), sehingga = so (result)."
      - {speaker: Kak Reza, text: "Bukan hanya gempa, melainkan juga banjir, kan, Bu?", ar_eg: "مش بس الزلزال، كمان الفيضان، صح يا أبلة؟", ar: "ليس الزلزال فحسب، بل الفيضان أيضًا، أليس كذلك؟", en: "Not just earthquakes, but floods too, right, Miss?"}
      - {speaker: Kak Tiara, text: "Betul. Akhirnya, ingat: siapkan tas darurat berisi air, senter, obat, dan dokumen.", ar_eg: "مظبوط. وفي الآخر، افتكروا: جهزوا شنطة طوارئ فيها مية وكشاف ودوا وورق مهم.", ar: "صحيح. وأخيرًا تذكّروا: جهّزوا حقيبة طوارئ فيها ماء ومصباح ودواء ووثائق.", en: "Right. Finally, remember: prepare an emergency bag with water, a torch, medicine and documents."}
  - kind: word_spotlight
    title: Supaya dan sehingga
    lines:
      - {speaker: Kak Reza, text: "Supaya untuk tujuan. Berlindung di bawah meja supaya aman.", ar_eg: "supaya للهدف. استخبى تحت الترابيزة عشان تبقى في أمان.", ar: "supaya للغاية. احتمِ تحت الطاولة كي تكون آمنًا.", en: "Supaya is for purpose. Take cover under a desk so you'll be safe."}
      - {speaker: Kak Tiara, text: "Sehingga untuk akibat. Hujan deras sekali sehingga sungai meluap.", ar_eg: "sehingga للنتيجة. المطر كان جامد أوي فالنهر فاض.", ar: "sehingga للنتيجة. هطل المطر بغزارة حتى فاض النهر.", en: "Sehingga is for a result. It rained so hard that the river overflowed."}
      - {speaker: Kak Reza, text: "Kalau, jika, apabila. Apabila terjadi gempa, tetap tenang.", ar_eg: "لو، إذا، إذا (رسمي). إذا حصل زلزال، خليك هادي.", ar: "إذا، إن، متى. إذا وقع زلزال فالزم الهدوء.", en: "If, if, when (formal). If an earthquake occurs, stay calm."}
      - speaker: Kak Tiara
        text: "Pertama, selanjutnya, akhirnya. Bukan hanya..., melainkan juga..."
        ar_eg: "الأول، بعد كده، وفي الآخر. مش بس...، لكن كمان..."
        ar: "أولًا، ثم، أخيرًا. ليس فقط...، بل أيضًا..."
        en: "First, next, finally. Not only..., but also..."
        note:
          ar_eg: "melainkan بييجي بعد bukan بس: Ini bukan banjir, melainkan tsunami."
          ar: "melainkan لا تأتي إلا بعد bukan: Ini bukan banjir, melainkan tsunami."
          en: "Melainkan only follows bukan: Ini bukan banjir, melainkan tsunami."
      - {speaker: Kak Reza, text: "Gempa bumi, gunung meletus, banjir, tanah longsor, tsunami.", ar_eg: "زلزال، بركان، فيضان، انهيار أرضي، تسونامي.", ar: "زلزال، ثوران بركان، فيضان، انهيار أرضي، تسونامي.", en: "Earthquake, eruption, flood, landslide, tsunami."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Kalau terjadi gempa, jangan panik."
        ar_eg: "لو حصل زلزال، متتخضش."
        ar: "إذا وقع زلزال فلا تذعر."
        en: "If an earthquake happens, don't panic."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Kalau terjadi gempa, jangan panik.", ar_eg: "لو حصل زلزال، متتخضش.", ar: "إذا وقع زلزال فلا تذعر.", en: "If an earthquake happens, don't panic."}
      - {speaker: Kak Tiara, text: "Berlindung di bawah meja supaya aman.", ar_eg: "استخبى تحت الترابيزة عشان تبقى في أمان.", ar: "احتمِ تحت الطاولة كي تكون آمنًا.", en: "Take cover under a desk so you're safe."}
      - {speaker: Kak Reza, text: "Berlindung di bawah meja supaya aman.", ar_eg: "استخبى تحت الترابيزة عشان تبقى في أمان.", ar: "احتمِ تحت الطاولة كي تكون آمنًا.", en: "Take cover under a desk so you're safe."}
      - {speaker: Kak Tiara, text: "Hujan deras sekali sehingga sungai meluap.", ar_eg: "المطر كان جامد أوي فالنهر فاض.", ar: "هطل المطر بغزارة حتى فاض النهر.", en: "It rained so hard that the river overflowed."}
      - {speaker: Kak Reza, text: "Hujan deras sekali sehingga sungai meluap.", ar_eg: "المطر كان جامد أوي فالنهر فاض.", ar: "هطل المطر بغزارة حتى فاض النهر.", en: "It rained so hard that the river overflowed."}
      - {speaker: Kak Tiara, text: "Segera lari ke tempat tinggi.", ar_eg: "اجري على طول لمكان عالي.", ar: "اركض فورًا إلى مكان مرتفع.", en: "Run to high ground at once."}
      - {speaker: Kak Reza, text: "Segera lari ke tempat tinggi.", ar_eg: "اجري على طول لمكان عالي.", ar: "اركض فورًا إلى مكان مرتفع.", en: "Run to high ground at once."}
  - kind: outro
    title: Tas darurat Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, apa isi tas daruratmu? Jelaskan dengan 'supaya'."
        ar_eg: "يا محمد، إيه اللي في شنطة الطوارئ بتاعتك؟ اشرح بـsupaya."
        ar: "يا محمد، ماذا في حقيبة طوارئك؟ اشرح باستعمال supaya."
        en: "Mohamed, what's in your emergency bag? Explain with 'supaya'."
        note:
          ar_eg: "دورك! تلات حاجات وسبب كل واحدة."
          ar: "دورك! ثلاثة أشياء وسبب كل منها."
          en: "Your turn! Three things and the reason for each."
      - {speaker: Kak Reza, text: "Contohnya: Saya membawa senter supaya bisa melihat di malam hari, dan air supaya tidak haus.", ar_eg: "مثلًا: بجيب كشاف عشان أشوف بالليل، ومية عشان مأعطشش.", ar: "مثلًا: أحمل مصباحًا كي أرى ليلًا، وماءً كي لا أعطش.", en: "For example: I bring a torch so I can see at night, and water so I don't get thirsty."}
      - {speaker: Kak Tiara, text: "Besok, cari tahu: di mana tempat aman di dekat rumahmu?", ar_eg: "بكرة، دوّر: فين المكان الآمن القريب من بيتك؟", ar: "غدًا، ابحث: أين المكان الآمن القريب من بيتك؟", en: "Tomorrow, find out: where's the safe place near your home?"}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Tetap aman, ya!", ar_eg: "شكرًا يا محمد. خليك في أمان!", ar: "شكرًا يا محمد. ابقَ آمنًا!", en: "Thank you, Mohamed. Stay safe!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [gempa bumi, gunung meletus, banjir, tsunami, kalau, apabila, supaya, sehingga, selanjutnya, akhirnya, melainkan, berlindung, darurat]
