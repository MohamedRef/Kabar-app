schema: kabar.radio/v1
id: radio.bipa1.u03
language: id
level: bipa1
unit: bipa1.u03
title:
  target: Ini keluarga saya
  ar_eg: دي عيلتي
  ar: هذه عائلتي
  en: This is my family
hosts:
  - name: Mbak Gadis
    voice: id-ID-GadisNeural
  - name: Mas Ardi
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Sore di Cikini
    lines:
      - speaker: Mbak Gadis
        text: Selamat sore! Selamat datang di Kabar Radio! Saya Gadis.
        ar_eg: مساء الخير! أهلًا بيك في كبار راديو! أنا جاديس.
        ar: مساء الخير! أهلًا بك في كبار راديو! أنا غاديس.
        en: Good afternoon! Welcome to Kabar Radio! I'm Gadis.
      - speaker: Mas Ardi
        text: Dan saya Ardi. Selamat sore, Mbak Gadis! Apa kabar?
        ar_eg: وأنا أردي. مساء الخير يا جاديس! إزيك؟
        ar: وأنا أردي. مساء الخير يا غاديس! كيف حالك؟
        en: And I'm Ardi. Good afternoon, Gadis! How are you?
      - speaker: Mbak Gadis
        text: Baik, terima kasih. Mas Ardi, kita di mana?
        ar_eg: كويسة، شكرًا. يا أردي، إحنا فين؟
        ar: بخير، شكرًا. يا أردي، أين نحن؟
        en: Fine, thank you. Ardi, where are we?
      - speaker: Mas Ardi
        text: Kita di Cikini, di Taman Ismail Marzuki.
        ar_eg: إحنا في تشيكيني، في حديقة إسماعيل مرزوقي.
        ar: نحن في تشيكيني، في حديقة إسماعيل مرزوقي.
        en: We're in Cikini, at Taman Ismail Marzuki.
        note:
          ar_eg: تامان إسماعيل مرزوقي مركز فنون وثقافة في تشيكيني، والعيلات بتحب تتفسح فيه.
          ar: تامان إسماعيل مرزوقي مركز للفنون والثقافة في تشيكيني، تقصده العائلات للتنزّه.
          en: Taman Ismail Marzuki is an arts centre in Cikini where families love to spend time.
      - speaker: Mbak Gadis
        text: Banyak orang di taman ini. Banyak keluarga.
        ar_eg: فيه ناس كتير في الجنينة دي. عيلات كتير.
        ar: في هذه الحديقة ناس كثيرون. عائلات كثيرة.
        en: There are lots of people in this park. Lots of families.
      - speaker: Mas Ardi
        text: Ya. Anak-anak bermain di taman.
        ar_eg: أيوه. العيال بيلعبوا في الجنينة.
        ar: نعم. الأطفال يلعبون في الحديقة.
        en: Yes. The children are playing in the park.
      - speaker: Mbak Gadis
        text: Keluarga. Ayah, ibu, kakak, adik.
        ar_eg: العيلة. الأب، الأم، الأخ الكبير، الأخ الصغير.
        ar: العائلة. الأب، الأم، الأخ الأكبر، الأخ الأصغر.
        en: Family. Father, mother, older sibling, younger sibling.
        note:
          ar_eg: موضوع النهارده العيلة، ولما نشاور بـ ini وitu، ولما نقول «بتاعي» و«بتاعك».
          ar: موضوع اليوم العائلة، والإشارة بـ ini وitu، والملكية مثل «لي» و«لك».
          en: Today's topic is family, pointing with ini and itu, and saying whose something is.
      - speaker: Mas Ardi
        text: Ini dan itu. Rumah saya, rumahmu, rumahnya.
        ar_eg: ده وده. بيتي، بيتك، بيته.
        ar: هذا وذاك. بيتي، بيتك، بيته.
        en: This and that. My house, your house, his house.
      - speaker: Mbak Gadis
        text: Hai, Mohamed! Selamat datang di Cikini!
        ar_eg: أهلًا يا محمد! أهلًا بيك في تشيكيني!
        ar: مرحبًا يا محمد! أهلًا بك في تشيكيني!
        en: Hi, Mohamed! Welcome to Cikini!
  - kind: dialogue
    title: Foto keluarga Gadis
    lines:
      - speaker: Mas Ardi
        text: Mbak Gadis, itu foto apa?
        ar_eg: يا جاديس، دي صورة إيه؟
        ar: يا غاديس، ما هذه الصورة؟
        en: Gadis, what photo is that?
      - speaker: Mbak Gadis
        text: Ini foto keluarga saya.
        ar_eg: دي صورة عيلتي.
        ar: هذه صورة عائلتي.
        en: This is a photo of my family.
      - speaker: Mas Ardi
        text: Yang tinggi itu siapa?
        ar_eg: الطويل ده مين؟
        ar: من ذلك الطويل؟
        en: Who's the tall one?
      - speaker: Mbak Gadis
        text: Itu ayah saya. Dan ini ibu saya.
        ar_eg: ده أبويا. ودي أمي.
        ar: ذاك أبي. وهذه أمي.
        en: That's my father. And this is my mother.
      - speaker: Mas Ardi
        text: Dan yang kecil ini? Ini siapa?
        ar_eg: والصغيرة دي؟ دي مين؟
        ar: وهذه الصغيرة؟ من هذه؟
        en: And this little one? Who is this?
      - speaker: Mbak Gadis
        text: Ini adik perempuan saya. Namanya Putri. Dia mahasiswa.
        ar_eg: دي أختي الصغيرة. اسمها بوتري. هي طالبة.
        ar: هذه أختي الصغرى. اسمها بوتري. هي طالبة.
        en: This is my younger sister. Her name is Putri. She's a student.
        note:
          ar_eg: adik perempuan = أخت أصغر. kakak وadik بيتقسموا بالسن مش بالنوع.
          ar: adik perempuan = أخت صغرى. kakak وadik يحددهما العمر لا الجنس.
          en: adik perempuan = younger sister. kakak and adik go by age, not gender.
      - speaker: Mas Ardi
        text: Dan orang itu? Laki-laki itu?
        ar_eg: والراجل ده؟
        ar: وذلك الشخص؟ ذلك الرجل؟
        en: And that person? That man?
      - speaker: Mbak Gadis
        text: Itu kakak laki-laki saya, Mas Bima. Dia dokter.
        ar_eg: ده أخويا الكبير، بيما. هو دكتور.
        ar: ذاك أخي الأكبر، بيما. هو طبيب.
        en: That's my older brother, Bima. He's a doctor.
      - speaker: Mas Ardi
        text: Kakakmu sudah menikah?
        ar_eg: أخوكي متجوز؟
        ar: هل أخوكِ متزوج؟
        en: Is your brother married?
      - speaker: Mbak Gadis
        text: Sudah. Istrinya guru. Dia punya dua anak.
        ar_eg: أيوه. مراته مدرّسة. وعنده عيلين.
        ar: نعم. زوجته معلّمة. ولديه طفلان.
        en: Yes. His wife is a teacher. He has two children.
      - speaker: Mas Ardi
        text: Anak-anaknya lucu! Yang mana anak-anaknya?
        ar_eg: عياله لذاذ! مين فيهم عياله؟
        ar: أطفاله ظرفاء! أيّهم أطفاله؟
        en: His kids are cute! Which ones are his kids?
      - speaker: Mbak Gadis
        text: Ini dan ini. Anak laki-laki dan anak perempuan.
        ar_eg: ده وده. ولد وبنت.
        ar: هذا وهذه. ولد وبنت.
        en: This one and this one. A boy and a girl.
      - speaker: Mas Ardi
        text: Dan adikmu? Adikmu sudah menikah?
        ar_eg: وأختك الصغيرة؟ متجوزة؟
        ar: وأختكِ الصغرى؟ هل هي متزوجة؟
        en: And your younger sister? Is she married?
      - speaker: Mbak Gadis
        text: Belum. Adik saya belum menikah. Dan kamu, Mas Ardi? Kamu sudah menikah?
        ar_eg: لسه. أختي لسه متجوزتش. وإنت يا أردي؟ متجوز؟
        ar: ليس بعد. أختي لم تتزوج بعد. وأنت يا أردي؟ هل أنت متزوج؟
        en: Not yet. My sister isn't married yet. And you, Ardi? Are you married?
        note:
          ar_eg: «متجوز؟» سؤال عادي جدًا في إندونيسيا، مش تدخّل. الرد المؤدب لو لأ - Belum (لسه).
          ar: «هل أنت متزوج؟» سؤال ودّي عادي في إندونيسيا. والجواب المهذّب بالنفي - Belum (ليس بعد).
          en: Asking "are you married?" is normal friendliness in Indonesia. The polite "no" is Belum, "not yet".
      - speaker: Mas Ardi
        text: Sudah. Ini foto keluargaku. Ini istriku, namanya Laras.
        ar_eg: أيوه. دي صورة عيلتي. دي مراتي، اسمها لاراس.
        ar: نعم. هذه صورة عائلتي. هذه زوجتي، اسمها لاراس.
        en: Yes. This is a photo of my family. This is my wife; her name is Laras.
      - speaker: Mbak Gadis
        text: Anak-anakmu yang mana?
        ar_eg: وعيالك مين فيهم؟
        ar: وأيّهم أطفالك؟
        en: Which ones are your children?
      - speaker: Mas Ardi
        text: Ini anak-anak kami. Kami punya dua anak kecil.
        ar_eg: دول عيالنا. عندنا عيلين صغيرين.
        ar: هؤلاء أطفالنا. لدينا طفلان صغيران.
        en: These are our children. We have two little kids.
      - speaker: Mbak Gadis
        text: Lucu! Rumahmu di mana, Mas?
        ar_eg: لذاذ! بيتك فين يا أردي؟
        ar: ظرفاء! أين بيتك يا أردي؟
        en: Cute! Where's your house, Ardi?
      - speaker: Mas Ardi
        text: Rumah kami di Cikini. Rumahnya kecil, tapi baru.
        ar_eg: بيتنا في تشيكيني. البيت صغير، بس جديد.
        ar: بيتنا في تشيكيني. البيت صغير لكنه جديد.
        en: Our house is in Cikini. It's small, but new.
      - speaker: Mbak Gadis
        text: Mas, tas ini punya siapa?
        ar_eg: يا أردي، الشنطة دي بتاعة مين؟
        ar: يا أردي، لمن هذه الحقيبة؟
        en: Ardi, whose bag is this?
      - speaker: Mas Ardi
        text: Itu punya saya. Terima kasih, Mbak Gadis!
        ar_eg: دي بتاعتي. شكرًا يا جاديس!
        ar: إنها لي. شكرًا يا غاديس!
        en: That's mine. Thank you, Gadis!
  - kind: word_spotlight
    title: Keluarga, kakak, adik
    lines:
      - speaker: Mbak Gadis
        text: Keluarga. Keluarga.
        ar_eg: عيلة. عيلة.
        ar: عائلة. عائلة.
        en: Family. Family.
      - speaker: Mas Ardi
        text: Ini keluarga saya. Keluarga saya besar.
        ar_eg: دي عيلتي. عيلتي كبيرة.
        ar: هذه عائلتي. عائلتي كبيرة.
        en: This is my family. My family is big.
      - speaker: Mbak Gadis
        text: Kakak. Adik. Kakak. Adik.
        ar_eg: الأكبر. الأصغر. الأكبر. الأصغر.
        ar: الأكبر. الأصغر. الأكبر. الأصغر.
        en: Older sibling. Younger sibling. Older sibling. Younger sibling.
      - speaker: Mas Ardi
        text: Kakak saya dokter. Adik saya mahasiswa.
        ar_eg: أخويا الكبير دكتور. أخويا الصغير طالب.
        ar: أخي الأكبر طبيب. أخي الأصغر طالب.
        en: My older sibling is a doctor. My younger sibling is a student.
        note:
          ar_eg: عشان تحدد النوع زوّد laki-laki أو perempuan - kakak perempuan = أخت كبيرة.
          ar: لتحديد الجنس أضف laki-laki أو perempuan - kakak perempuan = أخت كبرى.
          en: To say the gender add laki-laki or perempuan - kakak perempuan = older sister.
      - speaker: Mbak Gadis
        text: Ini. Itu. Ini buku saya. Itu buku Rina.
        ar_eg: ده. ده (البعيد). ده كتابي. وده كتاب رينا.
        ar: هذا. ذاك. هذا كتابي. وذاك كتاب رينا.
        en: This. That. This is my book. That's Rina's book.
      - speaker: Mas Ardi
        text: Orang itu kakak saya. Ibu ini guru saya.
        ar_eg: الشخص ده أخويا الكبير. الست دي مدرّستي.
        ar: ذلك الشخص أخي الأكبر. هذه السيدة معلّمتي.
        en: That person is my older sibling. This lady is my teacher.
        note:
          ar_eg: ini وitu بييجوا بعد الاسم - orang itu = الشخص ده.
          ar: ini وitu تأتيان بعد الاسم - orang itu = ذلك الشخص.
          en: ini and itu come after the noun - orang itu = that person.
      - speaker: Mbak Gadis
        text: Punya. Punya siapa? Punya saya.
        ar_eg: بتاع. بتاع مين؟ بتاعي.
        ar: مِلك. لمن؟ لي.
        en: Belonging to. Whose? Mine.
      - speaker: Mas Ardi
        text: Tas ini punya siapa? Punya Rina. Saya punya dua adik.
        ar_eg: الشنطة دي بتاعة مين؟ بتاعة رينا. أنا عندي اتنين إخوات أصغر.
        ar: لمن هذه الحقيبة؟ لرينا. لديّ أخوان أصغر مني.
        en: Whose bag is this? Rina's. I have two younger siblings.
        note:
          ar_eg: punya معناها «بتاع» ومعناها كمان «عنده».
          ar: punya تعني «مِلك» وتعني أيضًا «يملك / لديه».
          en: punya means "belonging to" and also "to have".
      - speaker: Mbak Gadis
        text: Keluargaku. Keluargamu. Keluarganya.
        ar_eg: عيلتي. عيلتك. عيلته.
        ar: عائلتي. عائلتك. عائلته.
        en: My family. Your family. His or her family.
        note:
          ar_eg: -ku و-mu و-nya بيلزقوا في آخر الكلمة، زي «ـي» و«ـك» و«ـه» في العربي بالظبط.
          ar: -ku و-mu و-nya تلتصق بآخر الكلمة، تمامًا مثل «ـي» و«ـك» و«ـه» في العربية.
          en: -ku, -mu and -nya stick to the end of the word, just like Arabic ـي, ـك and ـه.
      - speaker: Mas Ardi
        text: Rumahku di Cikini. Rumahmu di mana? Rumahnya di Menteng.
        ar_eg: بيتي في تشيكيني. بيتك فين؟ بيته في منتنج.
        ar: بيتي في تشيكيني. أين بيتك؟ بيته في منتنغ.
        en: My house is in Cikini. Where's your house? His house is in Menteng.
      - speaker: Mbak Gadis
        text: Ini kakakku. Itu adiknya. Dimas dan adiknya.
        ar_eg: ده أخويا الكبير. وده أخوه الصغير. ديماس وأخوه الصغير.
        ar: هذا أخي الأكبر. وذاك أخوه الأصغر. ديماس وأخوه الأصغر.
        en: This is my older brother. That's his younger brother. Dimas and his little brother.
      - speaker: Mbak Gadis
        text: Anak. Anak-anak. Anak-anak bermain di taman.
        ar_eg: طفل. أطفال. العيال بيلعبوا في الجنينة.
        ar: طفل. أطفال. الأطفال يلعبون في الحديقة.
        en: Child. Children. The children are playing in the park.
        note:
          ar_eg: تكرار الكلمة بيعمل جمع - anak-anak = عيال كتير.
          ar: تكرار الكلمة يدلّ على الجمع - anak-anak = أطفال.
          en: Repeating a noun makes a plural - anak-anak = children.
      - speaker: Mas Ardi
        text: Anak-anak bermain di taman. Anak-anak itu lucu.
        ar_eg: العيال بيلعبوا في الجنينة. العيال دول لذاذ.
        ar: الأطفال يلعبون في الحديقة. أولئك الأطفال ظرفاء.
        en: The children are playing in the park. Those children are cute.
  - kind: recap
    title: Kakakmu yang mana?
    lines:
      - speaker: Mbak Gadis
        text: Ini keluarga saya.
        ar_eg: دي عيلتي.
        ar: هذه عائلتي.
        en: This is my family.
        note:
          ar_eg: بالراحة. كرر ورانا.
          ar: ببطء. ردّد بعدنا.
          en: Slowly. Repeat after us.
      - speaker: Mas Ardi
        text: Ini keluarga saya.
        ar_eg: دي عيلتي.
        ar: هذه عائلتي.
        en: This is my family.
      - speaker: Mbak Gadis
        text: Ini ayah saya, dan ini ibu saya.
        ar_eg: ده أبويا، ودي أمي.
        ar: هذا أبي، وهذه أمي.
        en: This is my father, and this is my mother.
      - speaker: Mas Ardi
        text: Ini ayah saya, dan ini ibu saya.
        ar_eg: ده أبويا، ودي أمي.
        ar: هذا أبي، وهذه أمي.
        en: This is my father, and this is my mother.
      - speaker: Mbak Gadis
        text: Ini foto keluarga saya di Kairo. Saya punya dua adik.
        ar_eg: دي صورة عيلتي في القاهرة. أنا عندي اتنين إخوات أصغر مني.
        ar: هذه صورة عائلتي في القاهرة. لديّ أخوان أصغر مني.
        en: This is a photo of my family in Cairo. I have two younger siblings.
      - speaker: Mas Ardi
        text: Ini foto keluarga saya di Kairo. Saya punya dua adik.
        ar_eg: دي صورة عيلتي في القاهرة. أنا عندي اتنين إخوات أصغر مني.
        ar: هذه صورة عائلتي في القاهرة. لديّ أخوان أصغر مني.
        en: This is a photo of my family in Cairo. I have two younger siblings.
      - speaker: Mbak Gadis
        text: Orang itu kakak saya. Orang itu kakak saya.
        ar_eg: الشخص ده أخويا الكبير. الشخص ده أخويا الكبير.
        ar: ذلك الشخص أخي الأكبر. ذلك الشخص أخي الأكبر.
        en: That person is my older sibling. That person is my older sibling.
      - speaker: Mbak Gadis
        text: Kakakmu yang mana?
        ar_eg: أخوك الكبير مين فيهم؟
        ar: أيّهم أخوك الأكبر؟
        en: Which one is your older sibling?
      - speaker: Mas Ardi
        text: Kakak saya yang tinggi itu.
        ar_eg: أخويا الكبير هو الطويل ده.
        ar: أخي الأكبر هو ذلك الطويل.
        en: My older sibling is the tall one.
      - speaker: Mbak Gadis
        text: Kakak saya sudah menikah. Adik saya belum menikah.
        ar_eg: أخويا الكبير متجوز. أخويا الصغير لسه متجوزش.
        ar: أخي الأكبر متزوج. أخي الأصغر لم يتزوج بعد.
        en: My older sibling is married. My younger sibling isn't married yet.
      - speaker: Mas Ardi
        text: Kakak saya sudah menikah. Adik saya belum menikah.
        ar_eg: أخويا الكبير متجوز. أخويا الصغير لسه متجوزش.
        ar: أخي الأكبر متزوج. أخي الأصغر لم يتزوج بعد.
        en: My older sibling is married. My younger sibling isn't married yet.
      - speaker: Mbak Gadis
