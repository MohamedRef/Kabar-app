schema: kabar.radio/v1
id: radio.bipa1.u03
language: id
level: bipa1
unit: bipa1.u03
title:
  target: Ini keluarga saya
  ar_eg: دي عيلتي
  ar: هذه عائلتي
  en: This is my family
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Sore di Cikini
    lines:
      - speaker: Kak Tiara
        text: Selamat sore! Selamat datang di Kabar Radio! Aku Tiara.
        ar_eg: مساء الخير! أهلًا بيك في كبار راديو! أنا تيارا.
        ar: مساء الخير! أهلًا بك في كبار راديو! أنا تيارا.
        en: Good afternoon! Welcome to Kabar Radio! I'm Tiara.
      - speaker: Kak Reza
        text: Aku Reza. Sore, Tiara! Gimana kabarnya?
        ar_eg: وأنا رضا. مساء الخير يا تيارا! إزيك؟
        ar: وأنا رضا. مساء الخير يا تيارا! كيف حالك؟
        en: And I'm Reza. Afternoon, Tiara! How's it going?
      - speaker: Kak Tiara
        text: Baik, makasih. Kita di mana nih, Reza?
        ar_eg: كويسة، شكرًا. يا رضا، إحنا فين؟
        ar: بخير، شكرًا. يا رضا، أين نحن؟
        en: Good, thanks. So where are we, Reza?
      - speaker: Kak Reza
        text: Kita di Cikini, di Taman Ismail Marzuki.
        ar_eg: إحنا في تشيكيني، في حديقة إسماعيل مرزوقي.
        ar: نحن في تشيكيني، في حديقة إسماعيل مرزوقي.
        en: We're in Cikini, at Taman Ismail Marzuki.
        note:
          ar_eg: تامان إسماعيل مرزوقي مركز فنون وثقافة في تشيكيني، والعيلات بتحب تتفسح فيه.
          ar: تامان إسماعيل مرزوقي مركز للفنون والثقافة في تشيكيني، تقصده العائلات للتنزّه.
          en: Taman Ismail Marzuki is an arts centre in Cikini where families love to spend time.
      - speaker: Kak Tiara
        text: Rame banget, ya! Banyak keluarga.
        ar_eg: زحمة أوي، صح! عائلات كتير.
        ar: مزدحم جدًا! عائلات كثيرة.
        en: So busy, right! Lots of families.
        note:
          ar_eg: rame = ramai (زحمة/فيها ناس). banget = أوي، بعد الكلمة.
          ar: rame = ramai (مزدحم). banget = جدًا، وتأتي بعد الكلمة.
          en: rame = ramai (busy, lively). banget = very, after the word.
      - speaker: Kak Reza
        text: Iya. Anak-anak main di taman.
        ar_eg: أيوه. العيال بيلعبوا في الجنينة.
        ar: نعم. الأطفال يلعبون في الحديقة.
        en: Yeah. The kids are playing in the park.
        note:
          ar_eg: 'في الكلام بيشيلوا ber- كتير: main = bermain.'
          ar: 'في الكلام تُحذف ber- كثيرًا: main = bermain.'
          en: 'Speech often drops ber-: main = bermain.'
      - speaker: Kak Tiara
        text: Keluarga. Ayah, ibu, kakak, adik.
        ar_eg: العيلة. الأب، الأم، الأخ الكبير، الأخ الصغير.
        ar: العائلة. الأب، الأم، الأخ الأكبر، الأخ الأصغر.
        en: Family. Father, mother, older sibling, younger sibling.
        note:
          ar_eg: موضوع النهارده العيلة، ولما نشاور بـ ini وitu، ولما نقول «بتاعي» و«بتاعك».
          ar: موضوع اليوم العائلة، والإشارة بـ ini وitu، والملكية مثل «لي» و«لك».
          en: Today's topic is family, pointing with ini and itu, and saying whose something is.
      - speaker: Kak Reza
        text: Ini dan itu. Rumah saya, rumahmu, rumahnya.
        ar_eg: ده وده. بيتي، بيتك، بيته.
        ar: هذا وذاك. بيتي، بيتك، بيته.
        en: This and that. My house, your house, his house.
      - speaker: Kak Tiara
        text: Hai, Mohamed! Selamat datang di Cikini!
        ar_eg: أهلًا يا محمد! أهلًا بيك في تشيكيني!
        ar: مرحبًا يا محمد! أهلًا بك في تشيكيني!
        en: Hi, Mohamed! Welcome to Cikini!
  - kind: dialogue
    title: Foto keluarga Tiara
    lines:
      - speaker: Kak Reza
        text: Tiara, itu foto apa?
        ar_eg: يا تيارا، دي صورة إيه؟
        ar: يا تيارا، ما هذه الصورة؟
        en: Tiara, what photo is that?
      - speaker: Kak Tiara
        text: Ini foto keluargaku.
        ar_eg: دي صورة عيلتي.
        ar: هذه صورة عائلتي.
        en: This is a photo of my family.
      - speaker: Kak Reza
        text: Yang tinggi itu siapa?
        ar_eg: الطويل ده مين؟
        ar: من ذلك الطويل؟
        en: Who's the tall one?
      - speaker: Kak Tiara
        text: Itu ayahku. Ini ibuku.
        ar_eg: ده أبويا. ودي أمي.
        ar: ذاك أبي. وهذه أمي.
        en: That's my father. And this is my mother.
      - speaker: Kak Reza
        text: Dan yang kecil ini? Ini siapa?
        ar_eg: والصغيرة دي؟ دي مين؟
        ar: وهذه الصغيرة؟ من هذه؟
        en: And this little one? Who is this?
      - speaker: Kak Tiara
        text: Ini adik perempuanku. Namanya Putri. Dia mahasiswa.
        ar_eg: دي أختي الصغيرة. اسمها بوتري. هي طالبة.
        ar: هذه أختي الصغرى. اسمها بوتري. هي طالبة.
        en: This is my younger sister. Her name is Putri. She's a student.
        note:
          ar_eg: adik perempuan = أخت أصغر. kakak وadik بيتقسموا بالسن مش بالنوع.
          ar: adik perempuan = أخت صغرى. kakak وadik يحددهما العمر لا الجنس.
          en: adik perempuan = younger sister. kakak and adik go by age, not gender.
      - speaker: Kak Reza
        text: Dan orang itu? Laki-laki itu?
        ar_eg: والراجل ده؟
        ar: وذلك الشخص؟ ذلك الرجل؟
        en: And that person? That man?
      - speaker: Kak Tiara
        text: Itu kakak laki-lakiku, Mas Bima. Dia dokter.
        ar_eg: ده أخويا الكبير، بيما. هو دكتور.
        ar: ذاك أخي الأكبر، بيما. هو طبيب.
        en: That's my older brother, Bima. He's a doctor.
      - speaker: Kak Reza
        text: Kakakmu udah nikah?
        ar_eg: أخوكي متجوز؟
        ar: هل أخوكِ متزوج؟
        en: Is your brother married?
        note:
          ar_eg: udah = sudah، وnikah = menikah. ده الكلام اللي هتسمعه في الشارع.
          ar: udah = sudah، وnikah = menikah في الكلام اليومي.
          en: 'udah = sudah, nikah = menikah: the everyday forms.'
      - speaker: Kak Tiara
        text: Udah. Istrinya guru. Anaknya dua.
        ar_eg: آه. مراته مدرسة. عندهم عيلين.
        ar: نعم. زوجته معلمة. لديهما طفلان.
        en: Yes. His wife's a teacher. They have two kids.
      - speaker: Kak Reza
        text: Anak-anaknya lucu! Yang mana anak-anaknya?
        ar_eg: عياله لذاذ! مين فيهم عياله؟
        ar: أطفاله ظرفاء! أيّهم أطفاله؟
        en: His kids are cute! Which ones are his kids?
      - speaker: Kak Tiara
        text: Ini dan ini. Anak laki-laki dan anak perempuan.
        ar_eg: ده وده. ولد وبنت.
        ar: هذا وهذه. ولد وبنت.
        en: This one and this one. A boy and a girl.
      - speaker: Kak Reza
        text: Kalau adikmu? Udah nikah?
        ar_eg: وأختك؟ اتجوزت؟
        ar: وأختك؟ هل تزوجت؟
        en: And your sister? Married?
      - speaker: Kak Tiara
        text: Belum. Kalau kamu, Reza? Udah nikah?
        ar_eg: لسه. وإنت يا رضا؟ متجوز؟
        ar: ليس بعد. وأنت يا رضا؟ هل تزوجت؟
        en: Not yet. What about you, Reza? Married?
        note:
          ar_eg: «متجوز؟» سؤال عادي جدًا في إندونيسيا، مش تدخّل. الرد المؤدب لو لأ - Belum (لسه).
          ar: «هل أنت متزوج؟» سؤال ودّي عادي في إندونيسيا. والجواب المهذّب بالنفي - Belum (ليس بعد).
          en: Asking "are you married?" is normal friendliness in Indonesia. The polite "no" is Belum, "not yet".
      - speaker: Kak Reza
        text: Udah dong. Ini foto keluargaku. Ini istriku, Laras.
        ar_eg: طبعًا. دي صورة عيلتي. ودي مراتي، لاراس.
        ar: طبعًا. هذه صورة عائلتي. وهذه زوجتي لاراس.
        en: Of course. This is my family photo. This is my wife, Laras.
        note:
          ar_eg: dong بتقول «طبعًا/أكيد». هتتعلمها كويس بعدين.
          ar: dong تعني «طبعًا/بالتأكيد». ستتعلمها لاحقًا.
          en: dong = 'of course'. You'll learn it properly later.
      - speaker: Kak Tiara
        text: Anak-anakmu yang mana?
        ar_eg: وعيالك مين فيهم؟
        ar: وأيّهم أطفالك؟
        en: Which ones are your children?
      - speaker: Kak Reza
        text: Ini anak-anak kami. Kami punya dua anak kecil.
        ar_eg: دول عيالنا. عندنا عيلين صغيرين.
        ar: هؤلاء أطفالنا. لدينا طفلان صغيران.
        en: These are our children. We have two little kids.
      - speaker: Kak Tiara
        text: Lucu banget! Rumahmu di mana?
        ar_eg: لذاذ! بيتك فين يا رضا؟
        ar: ظرفاء! أين بيتك يا رضا؟
        en: So cute! Where's your house?
      - speaker: Kak Reza
        text: Rumah kami di Cikini. Rumahnya kecil, tapi baru.
        ar_eg: بيتنا في تشيكيني. البيت صغير، بس جديد.
        ar: بيتنا في تشيكيني. البيت صغير لكنه جديد.
        en: Our house is in Cikini. It's small, but new.
      - speaker: Kak Tiara
        text: Eh, tas ini punya siapa?
        ar_eg: يا رضا، الشنطة دي بتاعة مين؟
        ar: يا رضا، لمن هذه الحقيبة؟
        en: Hey, whose bag is this?
      - speaker: Kak Reza
        text: Punyaku! Makasih, Tiara!
        ar_eg: بتاعتي! ميرسي يا تيارا!
        ar: إنها لي! شكرًا يا تيارا!
        en: It's mine! Thanks, Tiara!
  - kind: word_spotlight
    title: Keluarga, kakak, adik
    lines:
      - speaker: Kak Tiara
        text: Keluarga. Keluarga.
        ar_eg: عيلة. عيلة.
        ar: عائلة. عائلة.
        en: Family. Family.
      - speaker: Kak Reza
        text: Ini keluarga saya. Keluarga saya besar.
        ar_eg: دي عيلتي. عيلتي كبيرة.
        ar: هذه عائلتي. عائلتي كبيرة.
        en: This is my family. My family is big.
      - speaker: Kak Tiara
        text: Kakak. Adik. Kakak. Adik.
        ar_eg: الأكبر. الأصغر. الأكبر. الأصغر.
        ar: الأكبر. الأصغر. الأكبر. الأصغر.
        en: Older sibling. Younger sibling. Older sibling. Younger sibling.
      - speaker: Kak Reza
        text: Kakak saya dokter. Adik saya mahasiswa.
        ar_eg: أخويا الكبير دكتور. أخويا الصغير طالب.
        ar: أخي الأكبر طبيب. أخي الأصغر طالب.
        en: My older sibling is a doctor. My younger sibling is a student.
        note:
          ar_eg: عشان تحدد النوع زوّد laki-laki أو perempuan - kakak perempuan = أخت كبيرة.
          ar: لتحديد الجنس أضف laki-laki أو perempuan - kakak perempuan = أخت كبرى.
          en: To say the gender add laki-laki or perempuan - kakak perempuan = older sister.
      - speaker: Kak Tiara
        text: Ini. Itu. Ini buku saya. Itu buku Rina.
        ar_eg: ده. ده (البعيد). ده كتابي. وده كتاب رينا.
        ar: هذا. ذاك. هذا كتابي. وذاك كتاب رينا.
        en: This. That. This is my book. That's Rina's book.
      - speaker: Kak Reza
        text: Orang itu kakak saya. Ibu ini guru saya.
        ar_eg: الشخص ده أخويا الكبير. الست دي مدرّستي.
        ar: ذلك الشخص أخي الأكبر. هذه السيدة معلّمتي.
        en: That person is my older sibling. This lady is my teacher.
        note:
          ar_eg: ini وitu بييجوا بعد الاسم - orang itu = الشخص ده.
          ar: ini وitu تأتيان بعد الاسم - orang itu = ذلك الشخص.
          en: ini and itu come after the noun - orang itu = that person.
      - speaker: Kak Tiara
        text: Punya. Punya siapa? Punya saya.
        ar_eg: بتاع. بتاع مين؟ بتاعي.
        ar: مِلك. لمن؟ لي.
        en: Belonging to. Whose? Mine.
      - speaker: Kak Tiara
        text: Punya siapa? Punyaku! Punyaku = punya saya.
        ar_eg: بتاعة مين؟ بتاعتي! Punyaku = punya saya.
        ar: لمن هذه؟ لي! Punyaku = punya saya.
        en: Whose? Mine! Punyaku = punya saya.
      - speaker: Kak Reza
        text: Tas ini punya siapa? Punya Rina. Saya punya dua adik.
        ar_eg: الشنطة دي بتاعة مين؟ بتاعة رينا. أنا عندي اتنين إخوات أصغر.
        ar: لمن هذه الحقيبة؟ لرينا. لديّ أخوان أصغر مني.
        en: Whose bag is this? Rina's. I have two younger siblings.
        note:
          ar_eg: punya معناها «بتاع» ومعناها كمان «عنده».
          ar: punya تعني «مِلك» وتعني أيضًا «يملك / لديه».
          en: punya means "belonging to" and also "to have".
      - speaker: Kak Tiara
        text: Keluargaku. Keluargamu. Keluarganya.
        ar_eg: عيلتي. عيلتك. عيلته.
        ar: عائلتي. عائلتك. عائلته.
        en: My family. Your family. His or her family.
        note:
          ar_eg: -ku و-mu و-nya بيلزقوا في آخر الكلمة، زي «ـي» و«ـك» و«ـه» في العربي بالظبط.
          ar: -ku و-mu و-nya تلتصق بآخر الكلمة، تمامًا مثل «ـي» و«ـك» و«ـه» في العربية.
          en: -ku, -mu and -nya stick to the end of the word, just like Arabic ـي, ـك and ـه.
      - speaker: Kak Reza
        text: Rumahku di Cikini. Rumahmu di mana? Rumahnya di Menteng.
        ar_eg: بيتي في تشيكيني. بيتك فين؟ بيته في منتنج.
        ar: بيتي في تشيكيني. أين بيتك؟ بيته في منتنغ.
        en: My house is in Cikini. Where's your house? His house is in Menteng.
      - speaker: Kak Tiara
        text: Ini kakakku. Itu adiknya. Dimas dan adiknya.
        ar_eg: ده أخويا الكبير. وده أخوه الصغير. ديماس وأخوه الصغير.
        ar: هذا أخي الأكبر. وذاك أخوه الأصغر. ديماس وأخوه الأصغر.
        en: This is my older brother. That's his younger brother. Dimas and his little brother.
      - speaker: Kak Tiara
        text: Anak. Anak-anak. Anak-anak bermain di taman.
        ar_eg: طفل. أطفال. العيال بيلعبوا في الجنينة.
        ar: طفل. أطفال. الأطفال يلعبون في الحديقة.
        en: Child. Children. The children are playing in the park.
        note:
          ar_eg: تكرار الكلمة بيعمل جمع - anak-anak = عيال كتير.
          ar: تكرار الكلمة يدلّ على الجمع - anak-anak = أطفال.
          en: Repeating a noun makes a plural - anak-anak = children.
      - speaker: Kak Reza
        text: Anak-anak bermain di taman. Anak-anak itu lucu.
        ar_eg: العيال بيلعبوا في الجنينة. العيال دول لذاذ.
        ar: الأطفال يلعبون في الحديقة. أولئك الأطفال ظرفاء.
        en: The children are playing in the park. Those children are cute.
      - speaker: Kak Tiara
        text: Sudah, udah. Menikah, nikah. Kakakmu udah nikah?
        ar_eg: Sudah وudah. Menikah وnikah. أخوك اتجوز؟
        ar: Sudah وudah. Menikah وnikah. هل تزوج أخوك؟
        en: Sudah, udah. Menikah, nikah. Is your brother married?
        note:
          ar_eg: 'في الكتاب: sudah menikah. في الشارع: udah nikah. الاتنين نفس المعنى.'
          ar: 'في الكتاب: sudah menikah. في الشارع: udah nikah. والمعنى واحد.'
          en: 'Textbook: sudah menikah. Street: udah nikah. Same meaning.'
  - kind: recap
    title: Kakakmu yang mana?
    lines:
      - speaker: Kak Tiara
        text: Ini keluarga saya.
        ar_eg: دي عيلتي.
        ar: هذه عائلتي.
        en: This is my family.
        note:
          ar_eg: بالراحة. كرر ورانا.
          ar: ببطء. ردّد بعدنا.
          en: Slowly. Repeat after us.
      - speaker: Kak Reza
        text: Ini keluarga saya.
        ar_eg: دي عيلتي.
        ar: هذه عائلتي.
        en: This is my family.
      - speaker: Kak Tiara
        text: Ini ayah saya, dan ini ibu saya.
        ar_eg: ده أبويا، ودي أمي.
        ar: هذا أبي، وهذه أمي.
        en: This is my father, and this is my mother.
      - speaker: Kak Reza
        text: Ini ayah saya, dan ini ibu saya.
        ar_eg: ده أبويا، ودي أمي.
        ar: هذا أبي، وهذه أمي.
        en: This is my father, and this is my mother.
      - speaker: Kak Tiara
        text: Ini foto keluarga saya di Kairo. Saya punya dua adik.
        ar_eg: دي صورة عيلتي في القاهرة. أنا عندي اتنين إخوات أصغر مني.
        ar: هذه صورة عائلتي في القاهرة. لديّ أخوان أصغر مني.
        en: This is a photo of my family in Cairo. I have two younger siblings.
      - speaker: Kak Reza
        text: Ini foto keluarga saya di Kairo. Saya punya dua adik.
        ar_eg: دي صورة عيلتي في القاهرة. أنا عندي اتنين إخوات أصغر مني.
        ar: هذه صورة عائلتي في القاهرة. لديّ أخوان أصغر مني.
        en: This is a photo of my family in Cairo. I have two younger siblings.
      - speaker: Kak Tiara
        text: Orang itu kakak saya. Orang itu kakak saya.
        ar_eg: الشخص ده أخويا الكبير. الشخص ده أخويا الكبير.
        ar: ذلك الشخص أخي الأكبر. ذلك الشخص أخي الأكبر.
        en: That person is my older sibling. That person is my older sibling.
      - speaker: Kak Tiara
        text: Kakakmu yang mana?
        ar_eg: أخوك الكبير مين فيهم؟
        ar: أيّهم أخوك الأكبر؟
        en: Which one is your older sibling?
      - speaker: Kak Reza
        text: Kakak saya yang tinggi itu.
        ar_eg: أخويا الكبير هو الطويل ده.
        ar: أخي الأكبر هو ذلك الطويل.
        en: My older sibling is the tall one.
      - speaker: Kak Tiara
        text: Kakak saya sudah menikah. Adik saya belum menikah.
        ar_eg: أخويا الكبير متجوز. أخويا الصغير لسه متجوزش.
        ar: أخي الأكبر متزوج. أخي الأصغر لم يتزوج بعد.
        en: My older sibling is married. My younger sibling isn't married yet.
      - speaker: Kak Reza
        text: Kakak saya sudah menikah. Adik saya belum menikah.
        ar_eg: أخويا الكبير متجوز. أخويا الصغير لسه متجوزش.
        ar: أخي الأكبر متزوج. أخي الأصغر لم يتزوج بعد.
        en: My older sibling is married. My younger sibling isn't married yet.
      - speaker: Kak Tiara
        text: Kakakku udah nikah. Adikku belum.
        ar_eg: أخويا اتجوز. أختي لسه.
        ar: أخي تزوج. أختي ليس بعد.
        en: My brother's married. My sister isn't yet.
      - speaker: Kak Tiara
        text: Rumahmu di mana?
        ar_eg: بيتك فين؟
        ar: أين بيتك؟
        en: Where's your house?
      - speaker: Kak Reza
        text: Rumah saya di Cikini. Rumahnya kecil, tapi baru.
        ar_eg: بيتي في تشيكيني. صغير، بس جديد.
        ar: بيتي في تشيكيني. إنه صغير لكنه جديد.
        en: My house is in Cikini. It's small, but new.
      - speaker: Kak Tiara
        text: Tas ini punya siapa?
        ar_eg: الشنطة دي بتاعة مين؟
        ar: لمن هذه الحقيبة؟
        en: Whose bag is this?
      - speaker: Kak Reza
        text: Punya saya.
        ar_eg: بتاعتي.
        ar: لي.
        en: Mine.
      - speaker: Kak Tiara
        text: Anak-anak bermain di taman.
        ar_eg: العيال بيلعبوا في الجنينة.
        ar: الأطفال يلعبون في الحديقة.
        en: The children are playing in the park.
      - speaker: Kak Reza
        text: Anak-anak bermain di taman.
        ar_eg: العيال بيلعبوا في الجنينة.
        ar: الأطفال يلعبون في الحديقة.
        en: The children are playing in the park.
  - kind: outro
    title: Sampai jumpa!
    lines:
      - speaker: Kak Tiara
        text: Mohamed, kakakmu sudah menikah?
        ar_eg: يا محمد، أخوك الكبير متجوز؟
        ar: يا محمد، هل أخوك الأكبر متزوج؟
        en: Mohamed, is your older brother married?
        note:
          ar_eg: دورك! جاوب بصوت عالي، وبعدين اسمع رضا.
          ar: دورك! أجب بصوت مسموع، ثم استمع إلى رضا.
          en: Your turn! Answer out loud, then listen to Reza.
      - speaker: Kak Reza
        text: Udah. Kakakku Ahmed. Dia dokter. Anaknya tiga.
        ar_eg: أيوه. أخويا أحمد. هو دكتور. عنده تلات عيال.
        ar: نعم. أخي أحمد. هو طبيب. لديه ثلاثة أطفال.
        en: Yes. My brother is Ahmed. He's a doctor. He has three kids.
      - speaker: Kak Tiara
        text: Tiga anak! Anak-anaknya lucu, ya?
        ar_eg: تلات عيال! أكيد لذاذ، صح؟
        ar: ثلاثة أطفال! أطفاله ظرفاء، أليس كذلك؟
        en: Three kids! His kids are cute, right?
      - speaker: Kak Tiara
        text: Kalau adikmu, Mohamed? Udah nikah?
        ar_eg: وأختك الصغيرة يا محمد؟ متجوزة؟
        ar: وأختك الصغرى يا محمد؟ هل هي متزوجة؟
        en: And your sister, Mohamed? Married?
      - speaker: Kak Reza
        text: Belum. Adik perempuan saya belum menikah. Dia mahasiswa.
        ar_eg: لسه. أختي الصغيرة لسه متجوزتش. هي طالبة.
        ar: ليس بعد. أختي الصغرى لم تتزوج بعد. هي طالبة.
        en: Not yet. My younger sister isn't married yet. She's a student.
      - speaker: Kak Tiara
        text: Keluargamu di mana? Di Kairo?
        ar_eg: عيلتك فين؟ في القاهرة؟
        ar: أين عائلتك؟ في القاهرة؟
        en: Where's your family? In Cairo?
      - speaker: Kak Reza
        text: Ya, keluarga saya di Kairo. Rumah kami besar. Ini foto keluarga saya di Kairo.
        ar_eg: أيوه، عيلتي في القاهرة. بيتنا كبير. دي صورة عيلتي في القاهرة.
        ar: نعم، عائلتي في القاهرة. بيتنا كبير. هذه صورة عائلتي في القاهرة.
        en: Yes, my family is in Cairo. Our house is big. This is a photo of my family in Cairo.
      - speaker: Kak Tiara
        text: Keluargamu gede, ya!
        ar_eg: عيلتك كبيرة، صح!
        ar: عائلتك كبيرة، أليس كذلك!
        en: Your family's big, huh!
        note:
          ar_eg: gede = besar في الكلام.
          ar: gede = besar في الكلام اليومي.
          en: gede is spoken besar.
      - speaker: Kak Reza
        text: Mohamed, besok foto keluargamu, ya. Ini ayah saya. Ini ibu saya. Ini kakak saya.
        ar_eg: "يا محمد، بكرة صورة عيلتك: ده أبويا. دي أمي. ده أخويا الكبير."
        ar: "يا محمد، غدًا صورة عائلتك: هذا أبي. هذه أمي. هذا أخي الأكبر."
        en: "Mohamed, tomorrow: your family photo. This is my father. This is my mother. This is my older brother."
        note:
          ar_eg: تحدي بكرة الصغير - افتح صورة لعيلتك واوصف تلات أشخاص بـ Ini … saya.
          ar: تحدّي الغد الصغير - افتح صورة لعائلتك وصِف ثلاثة أشخاص بعبارة Ini … saya.
          en: Tomorrow's tiny challenge - open a family photo and describe three people with "Ini … saya".
      - speaker: Kak Tiara
        text: Makasih, Mohamed. Sampai besok!
        ar_eg: شكرًا يا محمد. أشوفك بكرة!
        ar: شكرًا يا محمد. إلى اللقاء غدًا!
        en: Thanks, Mohamed. See you tomorrow!
      - speaker: Kak Reza
        text: Selamat sore, sampai jumpa di Kabar Radio!
        ar_eg: مساء الخير، أشوفكم في كبار راديو!
        ar: مساء الخير، وإلى اللقاء في كبار راديو!
        en: Good afternoon, see you on Kabar Radio!
