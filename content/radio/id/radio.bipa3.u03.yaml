schema: kabar.radio/v1
id: radio.bipa3.u03
language: id
level: bipa3
unit: bipa3.u03
title:
  target: Bioskop di bawah bintang
  ar_eg: سينما تحت النجوم
  ar: سينما تحت النجوم
  en: Cinema under the stars
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Malam di Gili Trawangan
    lines:
      - {speaker: Kak Tiara, text: "Selamat malam dari Gili Trawangan! Ini Kabar Radio. Saya Tiara.", ar_eg: "مساء الخير من جيلي تراوانجان! ده كبار راديو. أنا تيارا.", ar: "مساء الخير من غيلي تراوانغان! هذا كبار راديو. أنا تيارا.", en: "Good evening from Gili Trawangan! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Malam ini kami menonton film di pantai, di bawah bintang-bintang.", ar_eg: "أنا رضا. الليلة دي بنتفرج على فيلم على الشط، تحت النجوم.", ar: "أنا رضا. الليلة نشاهد فيلمًا على الشاطئ، تحت النجوم.", en: "I'm Reza. Tonight we're watching a film on the beach, under the stars."}
      - speaker: Kak Tiara
        text: "Film Indonesia sedang populer sekali. Film horor dan film keluarga selalu ramai di bioskop."
        ar_eg: "الأفلام الإندونيسي ماشية جامد دلوقتي. أفلام الرعب والأفلام العائلية دايمًا السينمات مليانة بيها."
        ar: "الأفلام الإندونيسية رائجة جدًا الآن. أفلام الرعب والأفلام العائلية تملأ دور السينما دائمًا."
        en: "Indonesian films are very popular right now. Horror and family films always pack the cinemas."
        note:
          ar_eg: "وsinetron هو المسلسل التلفزيوني، عادة يومية عند الإندونيسيين زي مسلسلات رمضان عندنا."
          ar: "أما sinetron فهو المسلسل التلفزيوني، وهو عادة يومية لدى الإندونيسيين."
          en: "Sinetron means a TV soap; watching them is a national habit."
      - {speaker: Kak Reza, text: "Hari ini kita belajar menulis sinopsis dan memberi ulasan film.", ar_eg: "النهارده هنتعلم نكتب ملخص فيلم ونكتب رأينا فيه.", ar: "اليوم نتعلم كتابة ملخص فيلم ومراجعته.", en: "Today we learn to write a synopsis and review a film."}
      - {speaker: Kak Tiara, text: "Mohamed, film apa yang terakhir kamu tonton?", ar_eg: "يا محمد، آخر فيلم اتفرجت عليه إيه؟", ar: "يا محمد، ما آخر فيلم شاهدته؟", en: "Mohamed, what's the last film you watched?"}
  - kind: dialogue
    title: Ulasan film
    lines:
      - {speaker: Kak Reza, text: "Kak Tiara, kamu menyukai film horor?", ar_eg: "يا تيارا، بتحبي أفلام الرعب؟", ar: "يا تيارا، هل تحبين أفلام الرعب؟", en: "Tiara, do you like horror films?"}
      - {speaker: Kak Tiara, text: "Tidak! Saya selalu menutupi mata saya. Saya lebih menyukai film keluarga.", ar_eg: "لأ! أنا دايمًا بغطي عينيا. بحب الأفلام العائلية أكتر.", ar: "لا! أغطي عينيّ دائمًا. أفضّل الأفلام العائلية.", en: "No! I always cover my eyes. I prefer family films."}
      - {speaker: Kak Reza, text: "Film malam ini film keluarga. Ceritanya tentang apa?", ar_eg: "فيلم الليلة عائلي. القصة عن إيه؟", ar: "فيلم الليلة عائلي. عمّ تدور القصة؟", en: "Tonight's film is a family film. What's the story about?"}
      - speaker: Kak Tiara
        text: "Tokoh utamanya seorang ayah, nelayan di Lombok. Anaknya ingin kuliah di Jakarta."
        ar_eg: "البطل أب، صياد في لومبوك. وابنه عايز يدرس في الجامعة في جاكرتا."
        ar: "البطل أب يعمل صيادًا في لومبوك، وابنه يريد الدراسة الجامعية في جاكرتا."
        en: "The main character is a father, a fisherman on Lombok. His son wants to study in Jakarta."
        note:
          ar_eg: "tokoh = شخصية، tokoh utama = البطل، alur = الحبكة، latar = المكان والزمان."
          ar: "tokoh = شخصية، tokoh utama = البطل، alur = الحبكة، latar = الزمان والمكان."
          en: "Tokoh = character, tokoh utama = protagonist, alur = plot, latar = setting."
      - {speaker: Kak Reza, text: "Tapi ayahnya tidak punya uang, kan?", ar_eg: "بس أبوه معهوش فلوس، صح؟", ar: "لكن أباه لا يملك المال، أليس كذلك؟", en: "But his father has no money, right?"}
      - {speaker: Kak Tiara, text: "Betul. Jadi ayahnya bekerja siang dan malam. Dia mendatangi semua tetangga untuk meminjam uang.", ar_eg: "مظبوط. فأبوه بيشتغل ليل ونهار. وبيروح لكل الجيران عشان يستلف فلوس.", ar: "صحيح. فيعمل أبوه ليلًا ونهارًا، ويقصد كل الجيران ليقترض المال.", en: "Right. So the father works day and night. He goes to every neighbour to borrow money."}
      - {speaker: Kak Reza, text: "Lalu bagaimana akhirnya? Jangan bilang! Saya belum selesai menonton.", ar_eg: "وبعدين النهاية إيه؟ لأ متقوليش! أنا لسه مخلصتش.", ar: "ثم كيف تنتهي؟ لا تخبريني! لم أُنهِ المشاهدة بعد.", en: "So how does it end? Don't tell me! I haven't finished watching."}
      - {speaker: Kak Tiara, text: "Ha ha, baik. Tidak ada bocoran. Bagaimana pendapatmu sampai sekarang?", ar_eg: "هههه، ماشي. من غير حرق. رأيك لحد دلوقتي إيه؟", ar: "هاها، حسنًا. بلا كشف للأحداث. ما رأيك حتى الآن؟", en: "Ha ha, fine. No spoilers. What do you think so far?"}
      - {speaker: Kak Reza, text: "Pemainnya bagus sekali. Pemandangan Lombok juga indah. Tapi alurnya agak lambat.", ar_eg: "الممثلين حلوين أوي. ومناظر لومبوك جميلة. بس الأحداث بطيئة شوية.", ar: "الممثلون رائعون، ومناظر لومبوك جميلة، لكن الحبكة بطيئة قليلًا.", en: "The acting is great. Lombok's scenery is beautiful too. But the plot is a bit slow."}
      - {speaker: Kak Tiara, text: "Berapa bintang untuk film ini?", ar_eg: "تديله كام نجمة؟", ar: "كم نجمة تعطي هذا الفيلم؟", en: "How many stars for this film?"}
      - {speaker: Kak Reza, text: "Empat bintang. Saya merekomendasikan film ini untuk keluarga.", ar_eg: "أربع نجوم. أنصح بالفيلم ده للعيلة.", ar: "أربع نجوم. أوصي بهذا الفيلم للعائلات.", en: "Four stars. I recommend this film for families."}
      - {speaker: Kak Tiara, text: "Besok kita menghadiri festival film kecil di Mataram. Kamu ikut?", ar_eg: "بكرة هنحضر مهرجان أفلام صغير في ماتارام. جاي؟", ar: "غدًا نحضر مهرجانًا صغيرًا للأفلام في ماتارام. هل تأتي؟", en: "Tomorrow we're attending a small film festival in Mataram. Coming?"}
      - {speaker: Kak Reza, text: "Tentu! Tapi jangan film horor, ya.", ar_eg: "أكيد! بس بلاش أفلام رعب.", ar: "بالتأكيد! لكن ليس فيلم رعب.", en: "Of course! But no horror films."}
  - kind: word_spotlight
    title: Mendatangi, menyukai
    lines:
      - speaker: Kak Tiara
        text: "Datang ke, mendatangi. Dia datang ke rumah tetangga. Dia mendatangi tetangga."
        ar_eg: "ييجي لـ، يقصد. هو جه لبيت الجار. هو قصد الجار."
        ar: "يأتي إلى، يقصد. جاء إلى بيت الجار. قصد الجار."
        en: "Come to, visit. He came to the neighbour's house. He visited the neighbour."
        note:
          ar_eg: "meN-…-i بتخلي الفعل ياخد مفعول مباشر من غير حرف جر: datang ke ← mendatangi."
          ar: "meN-…-i تجعل الفعل متعديًا بلا حرف جر: datang ke ← mendatangi."
          en: "MeN-…-i lets a verb take a direct object without a preposition: datang ke → mendatangi."
      - {speaker: Kak Reza, text: "Hadir di, menghadiri. Kami menghadiri festival film.", ar_eg: "يحضر في، يحضر. إحنا بنحضر مهرجان الأفلام.", ar: "يحضر في، يحضر. نحضر مهرجان الأفلام.", en: "Be present at, attend. We're attending the film festival."}
      - {speaker: Kak Tiara, text: "Suka, menyukai. Banyak orang menyukai film horor.", ar_eg: "يحب، يحب (رسمي). ناس كتير بتحب أفلام الرعب.", ar: "يحب، يحب (أسلوب رسمي). كثيرون يحبون أفلام الرعب.", en: "Like, be fond of. Many people like horror films."}
      - {speaker: Kak Reza, text: "Tutup, menutupi. Dia menutupi matanya dengan tangan.", ar_eg: "يقفل، يغطي. هي غطت عينيها بإيديها.", ar: "يغلق، يغطي. غطّت عينيها بيديها.", en: "Close, cover. She covered her eyes with her hands."}
      - {speaker: Kak Tiara, text: "Tokoh, alur, latar, sinopsis, ulasan. Sinopsis itu ringkasan cerita tanpa akhir.", ar_eg: "شخصية، حبكة، خلفية، ملخص، مراجعة. الملخص هو الحكاية باختصار من غير النهاية.", ar: "شخصية، حبكة، خلفية، ملخص، مراجعة. الملخص هو القصة باختصار بلا نهايتها.", en: "Character, plot, setting, synopsis, review. A synopsis is the story in short without the ending."}
      - {speaker: Kak Reza, text: "Horor, drama, komedi, aksi, animasi. Komedi membuat kita tertawa.", ar_eg: "رعب، دراما، كوميدي، أكشن، كرتون. الكوميدي بيضحكنا.", ar: "رعب، دراما، كوميديا، حركة، رسوم متحركة. الكوميديا تضحكنا.", en: "Horror, drama, comedy, action, animation. Comedy makes us laugh."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Tokoh utamanya seorang nelayan."
        ar_eg: "البطل صياد."
        ar: "البطل صياد."
        en: "The main character is a fisherman."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Tokoh utamanya seorang nelayan.", ar_eg: "البطل صياد.", ar: "البطل صياد.", en: "The main character is a fisherman."}
      - {speaker: Kak Tiara, text: "Saya lebih menyukai film keluarga.", ar_eg: "بحب الأفلام العائلية أكتر.", ar: "أفضّل الأفلام العائلية.", en: "I prefer family films."}
      - {speaker: Kak Reza, text: "Saya lebih menyukai film keluarga.", ar_eg: "بحب الأفلام العائلية أكتر.", ar: "أفضّل الأفلام العائلية.", en: "I prefer family films."}
      - {speaker: Kak Tiara, text: "Alurnya agak lambat, tapi pemainnya bagus.", ar_eg: "الأحداث بطيئة شوية، بس الممثلين حلوين.", ar: "الحبكة بطيئة قليلًا، لكن الممثلين جيدون.", en: "The plot's a bit slow, but the acting's good."}
      - {speaker: Kak Reza, text: "Alurnya agak lambat, tapi pemainnya bagus.", ar_eg: "الأحداث بطيئة شوية، بس الممثلين حلوين.", ar: "الحبكة بطيئة قليلًا، لكن الممثلين جيدون.", en: "The plot's a bit slow, but the acting's good."}
      - {speaker: Kak Tiara, text: "Saya merekomendasikan film ini.", ar_eg: "أنصح بالفيلم ده.", ar: "أوصي بهذا الفيلم.", en: "I recommend this film."}
      - {speaker: Kak Reza, text: "Saya merekomendasikan film ini.", ar_eg: "أنصح بالفيلم ده.", ar: "أوصي بهذا الفيلم.", en: "I recommend this film."}
  - kind: outro
    title: Film favorit Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan film favoritmu. Siapa tokoh utamanya? Tentang apa? Berapa bintang?"
        ar_eg: "يا محمد، احكيلنا عن فيلمك المفضل. مين البطل؟ عن إيه؟ كام نجمة؟"
        ar: "يا محمد، حدّثنا عن فيلمك المفضل. من البطل؟ عمّ يدور؟ كم نجمة؟"
        en: "Mohamed, tell us about your favourite film. Who's the main character? What's it about? How many stars?"
        note:
          ar_eg: "دورك! من غير ما تحرق النهاية."
          ar: "دورك! دون أن تكشف النهاية."
          en: "Your turn! No spoilers."
      - {speaker: Kak Reza, text: "Contohnya: Film favorit saya film Mesir lama. Tokoh utamanya seorang guru. Lima bintang!", ar_eg: "مثلًا: فيلمي المفضل فيلم مصري قديم. البطل مدرس. خمس نجوم!", ar: "مثلًا: فيلمي المفضل فيلم مصري قديم، بطله معلم. خمس نجوم!", en: "For example: My favourite film is an old Egyptian film. The main character is a teacher. Five stars!"}
      - {speaker: Kak Tiara, text: "Besok, tulis sinopsis film itu dalam lima kalimat.", ar_eg: "بكرة، اكتب ملخص الفيلم ده في خمس جمل.", ar: "غدًا، اكتب ملخص ذلك الفيلم في خمس جمل.", en: "Tomorrow, write a synopsis of that film in five sentences."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Selamat menonton!", ar_eg: "شكرًا يا محمد. فرجة ممتعة!", ar: "شكرًا يا محمد. مشاهدة ممتعة!", en: "Thank you, Mohamed. Enjoy the show!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [film, bioskop, tokoh, alur, latar, sinopsis, ulasan, mendatangi, menghadiri, menyukai, menutupi, merekomendasikan, sinetron]
