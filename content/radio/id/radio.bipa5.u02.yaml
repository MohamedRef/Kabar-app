schema: kabar.radio/v1
id: radio.bipa5.u02
language: id
level: bipa5
unit: bipa5.u02
title:
  target: Ibu kota pindah ke hutan?
  ar_eg: العاصمة هتتنقل للغابة؟
  ar: هل تنتقل العاصمة إلى الغابة؟
  en: Is the capital moving to the forest?
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Menuju Nusantara
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi! Ini Kabar Radio, dari Penajam Paser Utara. Aku Tiara.", ar_eg: "صباح الخير! ده كبار راديو، من بيناجام باسير أوتارا. أنا تيارا.", ar: "صباح الخير! هذا كبار راديو من بيناجام باسر أوتارا. أنا تيارا.", en: "Good morning! This is Kabar Radio, from North Penajam Paser. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Deket sini lagi dibangun ibu kota baru Indonesia, namanya Nusantara.", ar_eg: "أنا رضا. قريب من هنا بيتبني عاصمة إندونيسيا الجديدة، اسمها نوسانتارا.", ar: "أنا رضا. بالقرب من هنا تُبنى عاصمة إندونيسيا الجديدة، واسمها نوسانتارا.", en: "I'm Reza. Near here, Indonesia's new capital, Nusantara, is being built."}
      - {speaker: Kak Tiara, text: "Topik ini lagi rame banget. Ada yang setuju, ada yang nggak.", ar_eg: "الموضوع ده الناس كلها بتتكلم فيه. فيه اللي موافق وفيه اللي لأ.", ar: "هذا الموضوع محل نقاش واسع؛ بعضهم يؤيد وبعضهم يعارض.", en: "This topic is hotly discussed. Some agree, some don't."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar debat yang sopan, pakai meskipun, walaupun, sama selain itu."
        ar_eg: "النهارده هنتعلم نتناقش بأدب، باستعمال meskipun وwalaupun وselain itu."
        ar: "اليوم نتعلم النقاش بأدب باستخدام meskipun وwalaupun وselain itu."
        en: "Today we learn to debate politely, using meskipun, walaupun and selain itu."
      - {speaker: Kak Tiara, text: "Mohamed, Mesir juga membangun ibu kota baru, kan?", ar_eg: "يا محمد، مصر كمان بتبني عاصمة جديدة، صح؟", ar: "يا محمد، مصر أيضًا تبني عاصمة جديدة، أليس كذلك؟", en: "Mohamed, Egypt is building a new capital too, right?"}
  - kind: dialogue
    title: Debat di warung kopi
    lines:
      - speaker: Kak Tiara
        text: "Kita debat, yuk. Aku setuju pindah ibu kota. Reza ragu."
        ar_eg: "يلا نعمل مناظرة. أنا موافقة على نقل العاصمة. ورضا مش متأكد."
        ar: "لنجرِ مناظرة: أنا أؤيد نقل العاصمة، ورضا متردد."
        en: "Let's debate. I support moving the capital. Reza has doubts."
        note:
          ar_eg: "المناظرة دي تمثيلية في قهوة، فالكلام نص نص: حجج رسمية بنبرة ودودة. لاحظ إزاي كل واحد بيعترف بنقطة قبل ما يرد."
          ar: "هذه المناظرة مشهد في مقهى، فالكلام بين بين: حجج رسمية بنبرة ودودة. لاحظ كيف يقرّ كل منهما بنقطة قبل الرد."
          en: "This café debate mixes registers: formal arguments, friendly tone. Notice how each concedes a point before replying."
      - {speaker: Kak Tiara, text: "Jakarta sudah terlalu padat. Selain itu, sebagian kota sering kebanjiran.", ar_eg: "جاكرتا بقت زحمة أوي. غير كده، أجزاء من المدينة بتغرق كتير.", ar: "جاكرتا مكتظة جدًا. فضلًا عن ذلك، تغرق أجزاء منها كثيرًا.", en: "Jakarta is too crowded. Besides that, parts of the city often flood."}
      - {speaker: Kak Reza, text: "Emang bener. Tapi tetep aja, biaya bikin kota baru gede banget.", ar_eg: "ده صحيح فعلًا. ومع كده، تكلفة بنا مدينة جديدة كبيرة جدًا.", ar: "هذا صحيح. ومع ذلك، فإن تكلفة بناء مدينة جديدة باهظة.", en: "That's true. Even so, the cost of building a new city is huge.", note: {ar_eg: "في الكلام: tapi tetep aja = meskipun begitu.", ar: "في الكلام: tapi tetep aja = meskipun begitu.", en: "In speech: tapi tetep aja = meskipun begitu."}}
      - {speaker: Kak Tiara, text: "Walaupun mahal, pembangunan bisa lebih merata. Selama ini, banyak hal terpusat di Jawa.", ar_eg: "حتى لو غالية، التنمية ممكن تتوزع أحسن. لحد دلوقتي، حاجات كتير متركزة في جاوة.", ar: "ورغم غلائها، قد تصبح التنمية أكثر توازنًا؛ فكثير من الأمور متمركز في جاوة.", en: "Although it's expensive, development could be more even. Until now, much has been centred on Java."}
      - {speaker: Kak Reza, text: "Masuk akal. Tapi, hutan sama masyarakat adat di sini gimana?", ar_eg: "ده كلام معقول. بس طب والغابة والسكان الأصليين هنا؟", ar: "هذا منطقي. لكن ماذا عن الغابات والمجتمعات الأصلية هنا؟", en: "That makes sense. However, what about the forest and the indigenous communities here?"}
      - {speaker: Kak Tiara, text: "Pemerintah berjanji membangun kota hijau. Dengan demikian, hutan diharapkan tetap terjaga.", ar_eg: "الحكومة وعدت تبني مدينة خضرا. وبكده، المفروض الغابة تفضل محمية.", ar: "وعدت الحكومة ببناء مدينة خضراء، وبذلك يُرجى أن تبقى الغابة محمية.", en: "The government promised a green city. That way, the forest is expected to stay protected."}
      - {speaker: Kak Reza, text: "Janji itu bagus, tetapi warga ingin bukti. Mereka juga ingin didengar.", ar_eg: "الوعد حلو، بس الناس عايزة دليل. وكمان عايزين حد يسمعهم.", ar: "الوعد جميل، لكن الأهالي يريدون دليلًا، ويريدون أن يُسمع صوتهم.", en: "The promise is nice, but residents want proof. They also want to be heard."}
      - {speaker: Kak Tiara, text: "Setuju. Jadi kita sepakat, ya: rencana ini ada manfaatnya, ada dampaknya juga.", ar_eg: "موافقة. يبقى اتفقنا: الخطة دي ليها فوايد وليها آثار كمان.", ar: "أوافق. إذن اتفقنا: للخطة فوائد ولها آثار أيضًا.", en: "Agreed. So we agree: this plan has benefits and also impacts."}
      - {speaker: Kak Reza, text: "Debat yang bagus bukan soal menang. Yang penting kita saling dengerin.", ar_eg: "المناظرة الحلوة مش موضوع مين يكسب. المهم إننا نسمع بعض.", ar: "المناظرة الجيدة ليست مسألة فوز؛ المهم أن يصغي بعضنا إلى بعض.", en: "A good debate isn't about winning. What matters is that we listen to each other."}
  - kind: word_spotlight
    title: Meskipun dan walaupun
    lines:
      - speaker: Kak Tiara
        text: "Meskipun dan walaupun artinya sama: although. Meskipun hujan, saya tetap datang."
        ar_eg: "meskipun وwalaupun معناهم واحد: «رغم إن». رغم إن الدنيا بتمطر، برضه جيت."
        ar: "meskipun وwalaupun بمعنى واحد: «مع أن». مع أن المطر نازل، جئت."
        en: "Meskipun and walaupun mean the same: although. Although it rained, I still came."
        note:
          ar_eg: "بعدهم غالبًا tetap: يعني «برضه»."
          ar: "يأتي بعدهما غالبًا tetap: أي «مع ذلك»."
          en: "They're often followed by tetap: 'still'."
      - {speaker: Kak Reza, text: "Meskipun begitu dan akan tetapi dipakai untuk membantah dengan sopan.", ar_eg: "meskipun begitu وakan tetapi بيستعملوهم عشان تعترض بأدب.", ar: "تُستخدم meskipun begitu وakan tetapi للاعتراض بلطف.", en: "Meskipun begitu and akan tetapi are used to disagree politely."}
      - {speaker: Kak Tiara, text: "Selain itu menambah alasan. Dengan demikian menarik kesimpulan.", ar_eg: "selain itu بتزوّد سبب. وdengan demikian بتطلع نتيجة.", ar: "selain itu تضيف سببًا، وdengan demikian تستخلص نتيجة.", en: "Selain itu adds a reason. Dengan demikian draws a conclusion."}
      - {speaker: Kak Reza, text: "Ibu kota, tata kota, pemerataan, dampak, manfaat, masyarakat adat.", ar_eg: "العاصمة، تخطيط المدن، توزيع التنمية بالعدل، الأثر، الفايدة، السكان الأصليين.", ar: "العاصمة، تخطيط المدن، عدالة التوزيع، الأثر، الفائدة، المجتمعات الأصلية.", en: "Capital city, urban planning, even distribution, impact, benefit, indigenous communities."}
      - {speaker: Kak Tiara, text: "Untuk mengakui: memang benar, itu masuk akal, saya paham maksud Anda.", ar_eg: "عشان تعترف بنقطة: ده صحيح فعلًا، ده كلام معقول، فاهم قصدك.", ar: "للإقرار: هذا صحيح، هذا منطقي، أفهم ما تقصده.", en: "To concede: that's true, that makes sense, I see what you mean."}
      - speaker: Kak Reza
        text: "Versi santai: Emang bener, sih. Masuk akal. Aku ngerti maksudmu, tapi..."
        ar_eg: "النسخة العادية: عندك حق فعلًا. منطقي. فاهم قصدك، بس..."
        ar: "النسخة اليومية: معك حق فعلًا. منطقي. أفهم قصدك، لكن..."
        en: "Casual version: True, that. Makes sense. I get what you mean, but..."
        note:
          ar_eg: "emang = memang، ngerti = mengerti. نفس الأدب، بس بين الصحاب."
          ar: "emang = memang، ngerti = mengerti. الأدب نفسه لكن بين الأصدقاء."
          en: "emang = memang, ngerti = mengerti: the same courtesy, among friends."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Meskipun mahal, rencana ini punya manfaat."
        ar_eg: "رغم إنها غالية، الخطة دي ليها فوايد."
        ar: "مع أنها مكلفة، فللخطة فوائد."
        en: "Although it's expensive, this plan has benefits."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Meskipun mahal, rencana ini punya manfaat.", ar_eg: "رغم إنها غالية، الخطة دي ليها فوايد.", ar: "مع أنها مكلفة، فللخطة فوائد.", en: "Although it's expensive, this plan has benefits."}
      - {speaker: Kak Tiara, text: "Memang benar. Akan tetapi, warga ingin didengar.", ar_eg: "ده صحيح. بس الناس عايزة حد يسمعهم.", ar: "هذا صحيح، لكن الأهالي يريدون أن يُسمعوا.", en: "That's true. However, residents want to be heard."}
      - {speaker: Kak Reza, text: "Memang benar. Akan tetapi, warga ingin didengar.", ar_eg: "ده صحيح. بس الناس عايزة حد يسمعهم.", ar: "هذا صحيح، لكن الأهالي يريدون أن يُسمعوا.", en: "That's true. However, residents want to be heard."}
      - {speaker: Kak Tiara, text: "Selain itu, Jakarta sering kebanjiran.", ar_eg: "غير كده، جاكرتا بتغرق كتير.", ar: "فضلًا عن ذلك، تغرق جاكرتا كثيرًا.", en: "Besides that, Jakarta often floods."}
      - {speaker: Kak Reza, text: "Selain itu, Jakarta sering kebanjiran.", ar_eg: "غير كده، جاكرتا بتغرق كتير.", ar: "فضلًا عن ذلك، تغرق جاكرتا كثيرًا.", en: "Besides that, Jakarta often floods."}
      - {speaker: Kak Tiara, text: "Dengan demikian, kita perlu rencana yang adil.", ar_eg: "وبكده، محتاجين خطة عادلة.", ar: "وبذلك نحتاج إلى خطة عادلة.", en: "Therefore, we need a fair plan."}
      - {speaker: Kak Reza, text: "Dengan demikian, kita perlu rencana yang adil.", ar_eg: "وبكده، محتاجين خطة عادلة.", ar: "وبذلك نحتاج إلى خطة عادلة.", en: "Therefore, we need a fair plan."}
  - kind: outro
    title: Pendapat Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, bagaimana pendapatmu tentang ibu kota baru Mesir? Pakai meskipun dan selain itu."
        ar_eg: "يا محمد، إيه رأيك في العاصمة الإدارية الجديدة في مصر؟ استعمل meskipun وselain itu."
        ar: "يا محمد، ما رأيك في العاصمة الإدارية الجديدة في مصر؟ استخدم meskipun وselain itu."
        en: "Mohamed, what do you think of Egypt's new capital? Use meskipun and selain itu."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Meskipun jauh dari pusat Kairo, kota baru itu modern. Selain itu, jalannya lebar.", ar_eg: "مثلًا: رغم إنها بعيدة عن وسط القاهرة، المدينة الجديدة حديثة. غير كده، شوارعها واسعة.", ar: "مثلًا: مع أنها بعيدة عن وسط القاهرة، فالمدينة الجديدة حديثة، فضلًا عن اتساع شوارعها.", en: "For example: Although it's far from central Cairo, the new city is modern. Besides that, its roads are wide."}
      - {speaker: Kak Tiara, text: "Besok, tulis satu paragraf: manfaat dan dampak pindah ibu kota.", ar_eg: "بكرة، اكتب فقرة: فوايد وآثار نقل العاصمة.", ar: "غدًا، اكتب فقرة عن فوائد نقل العاصمة وآثاره.", en: "Tomorrow, write one paragraph: benefits and impacts of moving a capital."}
      - {speaker: Kak Reza, text: "Makasih udah ikut debat bareng kita, Mohamed!", ar_eg: "شكرًا إنك اتناقشت معانا يا محمد!", ar: "شكرًا لمشاركتنا النقاش يا محمد!", en: "Thanks for debating with us, Mohamed!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [ibu kota, walaupun, selain itu, dengan demikian, dampak, manfaat, pemerataan, alasan, biaya, meskipun begitu, padat, tetap]
review:
  status: draft
  verified: false
  notes: |
    Spot-check: IKN Nusantara is in Penajam Paser Utara (and Kutai Kartanegara), East
    Kalimantan; Jakarta flooding; Egypt's New Administrative Capital. Debate is balanced
    on purpose and takes no political side; recheck the status of the move before review.
