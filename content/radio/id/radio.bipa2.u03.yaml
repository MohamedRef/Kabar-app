  - kind: outro
    title: Pengumuman Mohamed
    lines:
      - speaker: Kak Tiara
        text: Mohamed, sekarang kamu. Coba buat pengumuman!
        ar_eg: يا محمد، دلوقتي دورك. اعمل إعلان!
        ar: يا محمد، الآن دورك. اصنع إعلانًا!
        en: Mohamed, now it's you. Try making an announcement!
        note:
          ar_eg: دورك! اقرا إعلان قصير بصوت عالي، زي صوت المطار.
          ar: دورك! اقرأ إعلانًا قصيرًا بصوت مسموع، مثل صوت المطار.
          en: Your turn! Read a short announcement out loud, like the airport voice.
      - speaker: Kak Reza
        text: Mohon perhatian. Bus kita terlambat dua puluh menit. Harap tunggu di sini. Dilarang merokok di dalam.
        ar_eg: انتباه من فضلكم. الأتوبيس بتاعنا متأخر عشرين دقيقة. يُرجى الانتظار هنا. ممنوع التدخين جوه.
        ar: نرجو الانتباه. حافلتنا متأخرة عشرين دقيقة. يُرجى الانتظار هنا. ممنوع التدخين في الداخل.
        en: Attention, please. Our bus is twenty minutes late. Please wait here. No smoking inside.
      - speaker: Kak Tiara
        text: Bagus banget, Mohamed! Semua orang ngerti.
        ar_eg: برافو عليك يا محمد! كل الناس فهمت.
        ar: أحسنت جدًا يا محمد! الجميع فهم.
        en: Great, Mohamed! Everyone gets it.
      - speaker: Kak Reza
        text: Besok, coba lihat tulisan di jalan. Ada harap? Ada dilarang?
        ar_eg: بكرة بص على اللافتات في الشارع. فيه harap؟ فيه dilarang؟
        ar: غدًا انظر إلى اللافتات في الشارع. هل فيها harap؟ أو dilarang؟
        en: Tomorrow, look at the signs in the street. Any harap? Any dilarang?
        note:
          ar_eg: تحدي بكرة الصغير - لاحظ تلات لافتات حواليك وقولها بالإندونيسي - Dilarang… Harap…
          ar: تحدّي الغد الصغير - لاحظ ثلاث لافتات حولك وقلها بالإندونيسية - Dilarang… Harap…
          en: Tomorrow's tiny challenge - spot three signs around you and say them in Indonesian - "Dilarang…", "Harap…".
      - speaker: Kak Tiara
        text: Makasih, Reza. Makasih juga buat oleh-olehnya!
        ar_eg: شكرًا يا رضا. وشكرًا كمان على الهدايا!
        ar: شكرًا يا رضا. وشكرًا أيضًا على الهدايا!
        en: Thanks, Reza. And thanks for the souvenirs!
      - speaker: Kak Reza
        text: Sama-sama! Makasih, Mohamed. Hati-hati di jalan!
        ar_eg: العفو! شكرًا يا محمد. خلي بالك من نفسك في الطريق!
        ar: عفوًا! شكرًا يا محمد. انتبه في الطريق!
        en: You're welcome! Thank you, Mohamed. Take care on the road!
      - speaker: Kak Tiara
        text: Sampai besok di Kabar Radio, Mohamed!
        ar_eg: أشوفك بكرة في كبار راديو يا محمد!
        ar: إلى اللقاء غدًا في كبار راديو يا محمد!
        en: See you tomorrow on Kabar Radio, Mohamed!
