        text: Mohon maaf atas keterlambatan ini.
        ar_eg: نعتذر عن التأخير ده.
        ar: نعتذر عن هذا التأخير.
        en: We apologise for this delay.
      - speaker: Kak Tiara
        text: Harap segera menuju pintu lima.
        ar_eg: يُرجى التوجه فورًا لبوابة خمسة.
        ar: يُرجى التوجه فورًا إلى البوابة خمسة.
        en: Please go to gate five immediately.
      - speaker: Kak Reza
        text: Harap segera menuju pintu lima.
        ar_eg: يُرجى التوجه فورًا لبوابة خمسة.
        ar: يُرجى التوجه فورًا إلى البوابة خمسة.
        en: Please go to gate five immediately.
      - speaker: Kak Tiara
        text: Pesawat ini sering terlambat. Biasanya tepat waktu.
        ar_eg: الطيارة دي بتتأخر كتير. عادةً في ميعادها.
        ar: هذه الطائرة تتأخر كثيرًا. عادةً في موعدها.
        en: This plane is often late. Usually it's on time.
      - speaker: Kak Reza
        text: Pesawat ini sering terlambat. Biasanya tepat waktu.
        ar_eg: الطيارة دي بتتأخر كتير. عادةً في ميعادها.
        ar: هذه الطائرة تتأخر كثيرًا. عادةً في موعدها.
        en: This plane is often late. Usually it's on time.
      - speaker: Kak Tiara
        text: Dilarang merokok. Harap antre.
        ar_eg: ممنوع التدخين. يُرجى الوقوف في الطابور.
        ar: ممنوع التدخين. يُرجى الاصطفاف.
        en: No smoking. Please queue.
      - speaker: Kak Reza
        text: Dilarang merokok. Harap antre.
        ar_eg: ممنوع التدخين. يُرجى الوقوف في الطابور.
        ar: ممنوع التدخين. يُرجى الاصطفاف.
        en: No smoking. Please queue.
      - speaker: Kak Tiara
        text: Awas, lantainya licin!
        ar_eg: حاسب، الأرض بتزحلق!
        ar: احذر، الأرض زلقة!
        en: Watch out, the floor is slippery!
      - speaker: Kak Reza
        text: Awas, lantainya licin!
