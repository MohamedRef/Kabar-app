schema: kabar.radio/v1
id: radio.bipa2.u03
language: id
level: bipa2
unit: bipa2.u03
title:
  target: Mohon perhatian!
  ar_eg: انتباه من فضلكم!
  ar: نرجو الانتباه!
  en: Attention, please!
hosts:
  - name: Mbak Gadis
    voice: id-ID-GadisNeural
  - name: Mas Ardi
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Halo dari bandara
    lines:
      - speaker: Mbak Gadis
        text: Halo, selamat siang! Selamat datang di Kabar Radio! Saya Gadis.
        ar_eg: أهلًا، نهارك سعيد! أهلًا بيك في كبار راديو! أنا جاديس.
        ar: مرحبًا، طاب يومك! أهلًا بك في كبار راديو! أنا غاديس.
        en: Hello, good afternoon! Welcome to Kabar Radio! I'm Gadis.
      - speaker: Mas Ardi
        text: Dan saya Ardi. Selamat siang, Mbak Gadis! Hari ini kita di Bandara Ngurah Rai.
        ar_eg: وأنا أردي. نهارك سعيد يا جاديس! النهارده إحنا في مطار نجوراه راي.
        ar: وأنا أردي. طاب يومك يا غاديس! اليوم نحن في مطار نغوراه راي.
        en: And I'm Ardi. Good afternoon, Gadis! Today we're at Ngurah Rai Airport.
        note:
          ar_eg: مطار نجوراه راي هو مطار بالي، جنب دنباسار.
          ar: مطار نغوراه راي هو مطار بالي، قرب دنباسار.
          en: Ngurah Rai is Bali's airport, near Denpasar.
      - speaker: Mbak Gadis
        text: Di bandara ada banyak orang. Banyak penumpang, banyak koper, banyak oleh-oleh!
        ar_eg: في المطار ناس كتير. ركاب كتير، وشنط كتير، وهدايا كتير!
        ar: في المطار ناس كثيرون. ركاب كثيرون، وحقائب كثيرة، وهدايا كثيرة!
        en: There are lots of people at the airport. Lots of passengers, lots of suitcases, lots of souvenirs!
      - speaker: Mas Ardi
        text: Dan banyak pengumuman. Mbak mendengar? Para penumpang yang terhormat…
        ar_eg: وإعلانات كتير. سامعة؟ السادة الركاب الكرام…
        ar: وإعلانات كثيرة. هل تسمعين؟ السادة الركاب الكرام…
        en: And lots of announcements. Hear that? Dear passengers…
        note:
          ar_eg: الإعلانات بتبقى بالإندونيسي الرسمي، وأشهر بداية - Para penumpang yang terhormat.
          ar: تكون الإعلانات بالإندونيسية الرسمية، وأشهر افتتاحية - Para penumpang yang terhormat.
          en: Announcements are in formal Indonesian; the classic opener is "Para penumpang yang terhormat".
      - speaker: Mbak Gadis
        text: Beberapa, banyak, semua. Harap, mohon, dilarang. Sering terlambat, selalu tepat waktu.
        ar_eg: كام، كتير، كل. يُرجى، نرجو، ممنوع. بيتأخر كتير، دايمًا في الميعاد.
        ar: بعض، كثير، كل. يُرجى، نرجو، ممنوع. يتأخر كثيرًا، دائمًا في الموعد.
        en: Several, many, all. Please, kindly, forbidden. Often late, always on time.
        note:
          ar_eg: موضوع النهارده - الكميات، ولافتات Harap وDilarang، وفهم إعلانات المطار.
          ar: موضوع اليوم - الكميات، ولافتات Harap وDilarang، وفهم إعلانات المطار.
          en: Today's topic - amounts, Harap and Dilarang signs, and understanding airport announcements.
      - speaker: Mas Ardi
        text: Halo, Mohamed! Selamat datang di Bali! Bagaimana perjalananmu?
        ar_eg: أهلًا يا محمد! أهلًا بيك في بالي! الرحلة كانت عاملة إيه؟
        ar: مرحبًا يا محمد! أهلًا بك في بالي! كيف كانت رحلتك؟
        en: Hello, Mohamed! Welcome to Bali! How was your trip?
  - kind: dialogue
    title: Pesawat kita terlambat
    lines:
      - speaker: Mbak Gadis
        text: Mas Ardi, kita main pengumuman, ya. Saya jadi suara bandara.
        ar_eg: يا أردي، يلا نمثل الإعلانات. أنا هبقى صوت المطار.
        ar: يا أردي، لنمثّل الإعلانات. سأكون صوت المطار.
        en: Ardi, let's play announcements. I'll be the airport voice.
        note:
          ar_eg: مشهد تمثيلي - جاديس بتقرا الإعلانات، وأردي مسافر رايح جاكرتا.
          ar: مشهد تمثيلي - غاديس تقرأ الإعلانات، وأردي مسافر إلى جاكرتا.
          en: A role-play - Gadis reads the announcements, Ardi is a passenger flying to Jakarta.
      - speaker: Mbak Gadis
        text: Mohon perhatian. Penerbangan tujuan Jakarta terlambat tiga puluh menit. Mohon maaf atas keterlambatan ini.
        ar_eg: انتباه من فضلكم. الرحلة المتجهة لجاكرتا متأخرة نص ساعة. نعتذر عن التأخير.
        ar: نرجو الانتباه. الرحلة المتجهة إلى جاكرتا متأخرة ثلاثين دقيقة. نعتذر عن هذا التأخير.
        en: Attention, please. The flight to Jakarta is delayed by thirty minutes. We apologise for the delay.
      - speaker: Mas Ardi
        text: Wah, terlambat lagi! Pesawat ini sering terlambat, ya?
        ar_eg: يا خبر، اتأخرت تاني! الطيارة دي بتتأخر كتير، صح؟
        ar: يا للأسف، تأخرت مجددًا! هذه الطائرة تتأخر كثيرًا، أليس كذلك؟
        en: Oh no, late again! This plane is often late, isn't it?
      - speaker: Mbak Gadis
        text: Kadang-kadang. Biasanya tepat waktu. Pesawat ke Singapura jarang terlambat.
        ar_eg: أحيانًا. عادةً بتيجي في ميعادها. والطيارة اللي رايحة سنغافورة نادرًا لما بتتأخر.
        ar: أحيانًا. عادةً تكون في موعدها. والطائرة إلى سنغافورة نادرًا ما تتأخر.
        en: Sometimes. Usually it's on time. The plane to Singapore is rarely late.
      - speaker: Mas Ardi
        text: Tidak apa-apa. Kita minum kopi dulu. Saya selalu minum kopi di bandara.
        ar_eg: ولا يهمك. نشرب قهوة الأول. أنا دايمًا بشرب قهوة في المطار.
        ar: لا بأس. لنشرب القهوة أولًا. أشرب القهوة دائمًا في المطار.
        en: No problem. Let's have a coffee first. I always have coffee at the airport.
      - speaker: Mas Ardi
        text: Mbak, jadwal penerbangan di mana?
        ar_eg: جدول الرحلات فين؟
        ar: أين جدول الرحلات؟
        en: Where's the flight timetable?
      - speaker: Mbak Gadis
        text: Di sana, di samping pintu masuk. Lihat, beberapa pesawat terlambat. Tapi semua pesawat ke Singapura tepat waktu!
        ar_eg: هناك، جنب البوابة. بص، كام طيارة متأخرين. بس كل طيارات سنغافورة في ميعادها!
        ar: هناك، بجانب المدخل. انظر، بعض الطائرات متأخرة. لكن كل الطائرات إلى سنغافورة في موعدها!
        en: Over there, next to the entrance. Look, several planes are late. But all the planes to Singapore are on time!
      - speaker: Mbak Gadis
        text: Mas, lihat. Di sana ada tulisan. Dilarang merokok.
        ar_eg: بص يا أردي، فيه لافتة هناك. ممنوع التدخين.
        ar: انظر يا أردي، هناك لافتة. ممنوع التدخين.
        en: Look, Ardi, there's a sign over there. No smoking.
      - speaker: Mas Ardi
        text: Apa arti dilarang merokok?
        ar_eg: يعني إيه dilarang merokok؟
        ar: ما معنى dilarang merokok؟
        en: What does "dilarang merokok" mean?
      - speaker: Mbak Gadis
        text: Artinya kita tidak boleh merokok di sini.
        ar_eg: يعني ممنوع ندخن هنا.
        ar: معناها أنه لا يجوز لنا التدخين هنا.
        en: It means we're not allowed to smoke here.
      - speaker: Mas Ardi
        text: Dan itu? Harap antre.
        ar_eg: وده؟ يُرجى الوقوف في الطابور.
        ar: وتلك؟ يُرجى الاصطفاف.
        en: And that one? Please queue.
      - speaker: Mbak Gadis
        text: Kita harus antre. Lihat, banyak orang di sana!
        ar_eg: لازم نقف في الطابور. بص، فيه ناس كتير هناك!
        ar: يجب أن نصطف. انظر، هناك ناس كثيرون!
        en: We have to queue. Look, lots of people over there!
      - speaker: Mbak Gadis
        text: Mohon perhatian. Para penumpang tujuan Jakarta, pintu keberangkatan pindah ke pintu lima. Harap segera menuju pintu lima.
        ar_eg: انتباه من فضلكم. السادة ركاب رحلة جاكرتا، البوابة اتغيرت لبوابة خمسة. يُرجى التوجه فورًا لبوابة خمسة.
        ar: نرجو الانتباه. السادة ركاب رحلة جاكرتا، تغيرت البوابة إلى البوابة خمسة. يُرجى التوجه فورًا إلى البوابة خمسة.
        en: Attention, please. Passengers to Jakarta, the gate has changed to gate five. Please go to gate five immediately.
      - speaker: Mas Ardi
        text: Mbak, itu pesawat saya! Pintunya pindah? Pintu lima di mana?
        ar_eg: دي طيارتي! البوابة اتغيرت؟ بوابة خمسة فين؟
        ar: هذه طائرتي! تغيرت البوابة؟ أين البوابة خمسة؟
        en: That's my plane! The gate has changed? Where's gate five?
      - speaker: Mbak Gadis
        text: Lurus saja, lalu belok kiri. Hati-hati, lantainya licin!
        ar_eg: على طول، وبعدين حوّد شمال. خلي بالك، الأرض بتزحلق!
        ar: إلى الأمام، ثم انعطف يسارًا. انتبه، الأرض زلقة!
        en: Just go straight, then turn left. Careful, the floor is slippery!
      - speaker: Mas Ardi
        text: Terima kasih! Wah, semua penumpang sudah antre.
        ar_eg: شكرًا! يا خبر، كل الركاب واقفين في الطابور.
        ar: شكرًا! يا إلهي، كل الركاب اصطفوا بالفعل.
        en: Thanks! Wow, all the passengers are already queuing.
      - speaker: Mbak Gadis
        text: Para penumpang tujuan Jakarta, harap segera naik ke pesawat.
        ar_eg: السادة ركاب رحلة جاكرتا، يُرجى الصعود للطيارة فورًا.
        ar: السادة ركاب رحلة جاكرتا، يُرجى الصعود إلى الطائرة فورًا.
        en: Passengers to Jakarta, please board the plane immediately.
      - speaker: Mas Ardi
        text: Untung pesawatnya tidak terlambat lagi!
        ar_eg: الحمد لله الطيارة متأخرتش تاني!
        ar: لحسن الحظ لم تتأخر الطائرة مرة أخرى!
        en: Luckily the plane isn't late again!
      - speaker: Mbak Gadis
        text: Mas Ardi, berapa koper Mas?
        ar_eg: معاك كام شنطة يا أردي؟
        ar: كم حقيبة معك يا أردي؟
        en: How many suitcases do you have, Ardi?
        note:
          ar_eg: خلص التمثيل. أردي رجع من السفر، وجاديس بتسأله.
          ar: انتهى التمثيل. عاد أردي من السفر، وغاديس تسأله.
          en: The role-play is over. Ardi is back from his trip, and Gadis asks him about it.
      - speaker: Mas Ardi
        text: Dua saja. Semua oleh-oleh dari Bali ada di sini. Beberapa untuk Mbak!
        ar_eg: اتنين بس. كل الهدايا من بالي هنا. وشوية منهم ليكي!
        ar: اثنتان فقط. كل الهدايا من بالي هنا. وبعضها لكِ!
        en: Just two. All the souvenirs from Bali are here. Some are for you!
      - speaker: Mbak Gadis
        text: Wah, terima kasih banyak, Mas!
        ar_eg: الله، متشكرة أوي يا أردي!
        ar: رائع، شكرًا جزيلًا يا أردي!
        en: Oh, thank you so much, Ardi!
  - kind: word_spotlight
    title: Beberapa, harap, dilarang
    lines:
      - speaker: Mas Ardi
        text: Beberapa. Beberapa pesawat berangkat pagi ini. Banyak. Di bandara ada banyak orang.
        ar_eg: كام. كام طيارة بتطلع الصبح ده. كتير. في المطار فيه ناس كتير.
        ar: بعض. بعض الطائرات تقلع هذا الصباح. كثير. في المطار ناس كثيرون.
        en: Several. Several planes leave this morning. Many. There are many people at the airport.
      - speaker: Mbak Gadis
        text: Sedikit. Saya minta gula sedikit saja.
        ar_eg: شوية. عايزة سكر شوية بس.
        ar: قليل. أريد قليلًا من السكر فقط.
        en: A little. Just a little sugar, please.
      - speaker: Mas Ardi
        text: Semua, setiap. Semua orang suka nasi goreng. Setiap hari ada pesawat ke Jakarta.
        ar_eg: كل، كل واحد. كل الناس بتحب الناسي جورينج. كل يوم فيه طيارة لجاكرتا.
        ar: كل، كل واحد. كل الناس يحبون الناسي غورينغ. كل يوم توجد طائرة إلى جاكرتا.
        en: All, every. Everyone likes fried rice. Every day there's a plane to Jakarta.
        note:
          ar_eg: الاسم بعد beberapa وbanyak وsemua بيفضل مفرد - banyak orang، مش banyak orang-orang.
          ar: يبقى الاسم بعد beberapa وbanyak وsemua مفردًا - banyak orang، لا banyak orang-orang.
          en: After beberapa, banyak and semua the noun stays singular - banyak orang, not banyak orang-orang.
      - speaker: Mbak Gadis
        text: Para. Para penumpang yang terhormat, selamat datang di Bali.
        ar_eg: السادة. السادة الركاب الكرام، أهلًا بيكم في بالي.
        ar: السادة. السادة الركاب الكرام، مرحبًا بكم في بالي.
        en: Para. Dear passengers, welcome to Bali.
        note:
          ar_eg: para بتيجي قبل جمع الناس بس - para penumpang (الركاب)، para guru (المدرسين).
          ar: para تسبق جماعة الأشخاص فقط - para penumpang (الركاب)، para guru (المعلمون).
          en: para marks a group of people - para penumpang (passengers), para guru (teachers).
      - speaker: Mas Ardi
        text: Harap, mohon. Harap tenang. Harap lepas alas kaki. Mohon perhatian.
        ar_eg: يُرجى، نرجو. يُرجى الهدوء. يُرجى خلع الأحذية. انتباه من فضلكم.
        ar: يُرجى، نرجو. يُرجى الهدوء. يُرجى خلع الأحذية. نرجو الانتباه.
        en: Please, kindly. Please be quiet. Please remove your footwear. Attention, please.
      - speaker: Mbak Gadis
        text: Dilarang. Dilarang merokok. Dilarang masuk. Dilarang parkir di sini.
        ar_eg: ممنوع. ممنوع التدخين. ممنوع الدخول. ممنوع الركن هنا.
        ar: ممنوع. ممنوع التدخين. ممنوع الدخول. ممنوع الوقوف هنا.
        en: Forbidden. No smoking. No entry. No parking here.
      - speaker: Mas Ardi
        text: Awas, hati-hati. Awas, lantai licin! Hati-hati di jalan!
        ar_eg: حاسب، خلي بالك. حاسب، الأرض بتزحلق! خلي بالك في الطريق!
        ar: احذر، انتبه. احذر، الأرض زلقة! انتبه في الطريق!
        en: Watch out, careful. Watch out, slippery floor! Take care on the road!
      - speaker: Mbak Gadis
        text: Jadwal, jadwal. Jadwal penerbangan. Jadwal kereta.
        ar_eg: جدول، جدول. جدول الرحلات. جدول القطارات.
        ar: جدول، جدول. جدول الرحلات. جدول القطارات.
        en: Timetable, timetable. Flight timetable. Train timetable.
        note:
          ar_eg: الجسر العربي - jadwal من «جدول». هتلاقيها على كل شاشة في المطار.
          ar: الجسر العربي - jadwal من «جدول». ستجدها على كل شاشة في المطار.
          en: Arabic Bridge - jadwal comes from «جدول». You'll see it on every airport screen.
      - speaker: Mas Ardi
        text: Terlambat, tepat waktu. Kereta ini sering terlambat. Kereta itu selalu tepat waktu.
        ar_eg: متأخر، في الميعاد. القطر ده بيتأخر كتير. القطر ده دايمًا في ميعاده.
        ar: متأخر، في الموعد. هذا القطار يتأخر كثيرًا. ذلك القطار دائمًا في موعده.
        en: Late, on time. This train is often late. That train is always on time.
      - speaker: Mbak Gadis
        text: Mohon maaf atas keterlambatan ini.
        ar_eg: نعتذر عن التأخير ده.
        ar: نعتذر عن هذا التأخير.
        en: We apologise for this delay.
  - kind: recap
    title: Harap segera…
    lines:
      - speaker: Mbak Gadis
        text: Mohon perhatian. Penerbangan tujuan Jakarta terlambat.
        ar_eg: انتباه من فضلكم. الرحلة المتجهة لجاكرتا متأخرة.
        ar: نرجو الانتباه. الرحلة المتجهة إلى جاكرتا متأخرة.
        en: Attention, please. The flight to Jakarta is delayed.
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
          ar: ببطء. ردّد كل جملة بعدنا.
          en: Slowly. Repeat each sentence after us.
      - speaker: Mas Ardi
        text: Mohon perhatian. Penerbangan tujuan Jakarta terlambat.
        ar_eg: انتباه من فضلكم. الرحلة المتجهة لجاكرتا متأخرة.
        ar: نرجو الانتباه. الرحلة المتجهة إلى جاكرتا متأخرة.
        en: Attention, please. The flight to Jakarta is delayed.
      - speaker: Mbak Gadis
        text: Mohon maaf atas keterlambatan ini.
        ar_eg: نعتذر عن التأخير ده.
        ar: نعتذر عن هذا التأخير.
        en: We apologise for this delay.
