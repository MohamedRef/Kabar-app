schema: kabar.radio/v1
id: radio.bipa3.u04
language: id
level: bipa3
unit: bipa3.u04
title:
  target: Tips sehat dari Sembalun
  ar_eg: نصايح صحية من سيمبالون
  ar: نصائح صحية من سيمبالون
  en: Healthy tips from Sembalun
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Lembah Sembalun
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi! Ini Kabar Radio dari Lembah Sembalun, di kaki Gunung Rinjani. Aku Tiara.", ar_eg: "صباح الخير! ده كبار راديو من وادي سيمبالون، تحت جبل رينجاني. أنا تيارا.", ar: "صباح الخير! هذا كبار راديو من وادي سيمبالون، عند سفح جبل رينجاني. أنا تيارا.", en: "Good morning! This is Kabar Radio from the Sembalun valley, at the foot of Mount Rinjani. I'm Tiara."}
      - speaker: Kak Reza
        text: "Aku Reza. Di sini dingin banget, dan di mana-mana ada kebun sayur sama stroberi."
        ar_eg: "أنا رضا. الجو هنا بارد، وفي كل حتة فيه غيطان خضار وفراولة."
        ar: "أنا رضا. الجو هنا بارد، وفي كل مكان حقول خضار وفراولة."
        en: "I'm Reza. The air here is cold, and there are vegetable and strawberry fields everywhere."
        note:
          ar_eg: "كلمات: stroberi = فراولة."
          ar: "مفردات: stroberi = فراولة."
          en: "Words: stroberi = strawberry."
      - speaker: Kak Tiara
        text: "Sayur dari Sembalun dikirim ke seluruh Pulau Lombok."
        ar_eg: "الخضار من سيمبالون بيتبعت لكل جزيرة لومبوك."
        ar: "تُرسل خضار سيمبالون إلى جزيرة لومبوك كلها."
        en: "Vegetables from Sembalun are sent all over Lombok."
      - speaker: Kak Reza
        text: "Hari ini acaranya Tips Sehat. Kita belajar kasih definisi sama jelasin proses."
        ar_eg: "النهارده برنامجنا «نصايح صحية». هنتعلم نعرّف حاجة ونشرح خطوات."
        ar: "برنامجنا اليوم «نصائح صحية». نتعلم تقديم التعريفات وشرح العمليات."
        en: "Today's show is Healthy Tips. We learn to give definitions and explain processes."
        note:
          ar_eg: "كلمات: acaranya = الحفلة، البرنامج."
          ar: "مفردات: acaranya = الفعالية، البرنامج."
          en: "Words: acaranya = the event, the show."
      - {speaker: Kak Tiara, text: "Mohamed, makananmu sehari-hari sehat, nggak?", ar_eg: "يا محمد، أكلك كل يوم صحي؟", ar: "يا محمد، هل طعامك اليومي صحي؟", en: "Mohamed, is your everyday food healthy?"}
  - kind: dialogue
    title: Wawancara dengan petani
    lines:
      - speaker: Kak Reza
        text: "Tiara, hari ini aku wawancara petani. Kamu jadi petaninya, ya."
        ar_eg: "يا تيارا، النهارده هعمل حوار مع فلاح. إنتي هتبقي الفلاحة."
        ar: "يا تيارا، اليوم أحاور مزارعًا. ستكونين المزارعة."
        en: "Tiara, today I'm interviewing a farmer. You be the farmer."
        note:
          ar_eg: "تمثيلية: تيارا فلاحة في سمبالون. في المقابلة رضا بيتكلم بأدب مع الست: Bu وsaya."
          ar: "مشهد تمثيلي: تيارا مزارعة في سمبالون. وفي المقابلة يتكلم رضا بأدب: Bu وsaya."
          en: "A role-play: Tiara is a farmer in Sembalun. In the interview Reza is polite: Bu, saya."
      - speaker: Kak Reza
        text: "Selamat pagi, Bu. Ibu menanam apa di kebun ini?"
        ar_eg: "صباح الخير يا حاجة. بتزرعي إيه في الغيط ده؟"
        ar: "صباح الخير يا سيدتي. ماذا تزرعين في هذا الحقل؟"
        en: "Good morning. What do you grow in this field?"
        note:
          ar_eg: "كلمات: menanam = يزرع."
          ar: "مفردات: menanam = يغرس، يزرع."
          en: "Words: menanam = to plant."
      - {speaker: Kak Tiara, text: "Saya menanam kentang, wortel, kubis, dan stroberi.", ar_eg: "بزرع بطاطس وجزر وكرنب وفراولة.", ar: "أزرع البطاطس والجزر والملفوف والفراولة.", en: "I grow potatoes, carrots, cabbages and strawberries."}
      - speaker: Kak Reza
        text: "Apa itu pupuk organik, Bu?"
        ar_eg: "يعني إيه سماد عضوي يا حاجة؟"
        ar: "ما السماد العضوي يا سيدتي؟"
        en: "What is organic fertiliser?"
        note:
          ar_eg: "كلمات: pupuk = سماد؛ organik = عضوي."
          ar: "مفردات: pupuk = سماد؛ organik = عضوي."
          en: "Words: pupuk = fertiliser; organik = organic."
      - speaker: Kak Tiara
        text: "Pupuk organik adalah pupuk dari bahan alami, yaitu kotoran sapi dan daun kering."
        ar_eg: "السماد العضوي هو سماد من حاجات طبيعية، يعني روث البقر والورق الناشف."
        ar: "السماد العضوي هو سماد من مواد طبيعية، أي روث الأبقار والأوراق الجافة."
        en: "Organic fertiliser is fertiliser from natural materials, namely cow dung and dry leaves."
        note:
          ar_eg: "X adalah Y = «X هو Y» للتعريف. وyaitu = «يعني / أي» عشان تفصّل. كلمات: alami = طبيعي؛ daun = ورقة شجر."
          ar: "X adalah Y = «X هو Y» للتعريف، وyaitu = «أي» للتفصيل. مفردات: alami = طبيعي؛ daun = ورقة نبات."
          en: "X adalah Y = 'X is Y' for definitions; yaitu = 'namely' to spell out details. Words: alami = natural; daun = leaf."
      - {speaker: Kak Reza, text: "Mengapa Ibu tidak memakai pupuk kimia?", ar_eg: "ليه مبتستخدميش سماد كيماوي؟", ar: "لماذا لا تستعملين السماد الكيميائي؟", en: "Why don't you use chemical fertiliser?"}
      - speaker: Kak Tiara
        text: "Pupuk organik menyehatkan tanah. Tanah yang sehat menghasilkan sayur yang sehat."
        ar_eg: "السماد العضوي بيخلي الأرض صحية. والأرض الصحية بتطلّع خضار صحي."
        ar: "السماد العضوي يجعل التربة صحية، والتربة الصحية تنتج خضارًا صحيًا."
        en: "Organic fertiliser makes the soil healthy. Healthy soil produces healthy vegetables."
        note:
          ar_eg: "كلمات: tanah = أرض، تراب."
          ar: "مفردات: tanah = أرض، تربة."
          en: "Words: tanah = ground, soil."
      - {speaker: Kak Reza, text: "Bagaimana prosesnya dari kebun sampai ke pasar?", ar_eg: "إيه الخطوات من الغيط لحد السوق؟", ar: "كيف تسير العملية من الحقل إلى السوق؟", en: "What's the process from field to market?"}
      - {speaker: Kak Tiara, text: "Pertama, kami panen pagi-pagi. Terus sayurnya dibersihin, dikeringin.", ar_eg: "الأول، بنحصد الخضار بدري الصبح. وبعدين بننضفه وبننشفه.", ar: "أولًا، نحصد الخضار في الصباح الباكر. ثم ننظفها ونجففها.", en: "First, we harvest early in the morning. Then the vegetables get cleaned and dried.", note: {ar_eg: "الفلاحة بتتكلم عادي: dibersihin = dibersihkan، dikeringin = dikeringkan.", ar: "تتكلم المزارعة بالعامية: dibersihin = dibersihkan، dikeringin = dikeringkan.", en: "The farmer talks casually: dibersihin = dibersihkan, dikeringin = dikeringkan."}}
      - {speaker: Kak Tiara, text: "Habis itu, dimasukin ke keranjang, terus dinaikin ke truk.", ar_eg: "بعد كده، بنحطه في سبت وبنطلّعه على العربية النقل.", ar: "بعد ذلك نضعها في السلال ونرفعها إلى الشاحنة.", en: "After that, they go into baskets and up onto the truck."}
      - {speaker: Kak Reza, text: "Stroberinya kelihatan manis banget. Boleh saya coba?", ar_eg: "الفراولة مسكّرة أوي. ممكن أدوق؟", ar: "الفراولة حلوة جدًا. هل يمكنني أن أتذوق؟", en: "The strawberries look so sweet. May I try one?"}
      - speaker: Kak Tiara
        text: "Silakan. Stroberi bukan cuma enak, tapi juga sehat. Vitamin C-nya banyak."
        ar_eg: "اتفضل. الفراولة مش بس حلوة، دي كمان صحية. فيها فيتامين سي كتير."
        ar: "تفضل. الفراولة ليست لذيذة فحسب، بل مفيدة للصحة أيضًا، ففيها فيتامين ج بكثرة."
        en: "Go ahead. Strawberries aren't just tasty, they're healthy too. Lots of vitamin C."
        note:
          ar_eg: "كلمات: cuma = بس."
          ar: "مفردات: cuma = فقط."
          en: "Words: cuma = only, just."
      - {speaker: Kak Reza, text: "Wah, manis banget! Makasih, Bu!", ar_eg: "الله، ده ممتع أوي. شكرًا يا حاجة!", ar: "رائع، هذا ممتع جدًا. شكرًا يا سيدتي!", en: "Wow, so sweet! Thanks!"}
  - kind: word_spotlight
    title: Menyehatkan, membersihkan
    lines:
      - speaker: Kak Tiara
        text: "Adalah dan merupakan. Sembalun merupakan daerah pertanian yang penting di Lombok Timur."
        ar_eg: "adalah وmerupakan. سيمبالون تُعتبر منطقة زراعية مهمة في شرق لومبوك."
        ar: "adalah وmerupakan. تُعدّ سيمبالون منطقة زراعية مهمة في شرق لومبوك."
        en: "Adalah and merupakan. Sembalun is an important farming area in East Lombok."
        note:
          ar_eg: "merupakan أرسمي شوية من adalah، وبتلاقيها في الكتب والأخبار. كلمات: daerah = منطقة."
          ar: "merupakan أكثر رسمية من adalah، وتكثر في الكتب والأخبار. مفردات: daerah = منطقة، إقليم."
          en: "Merupakan is a bit more formal than adalah; you'll see it in books and news. Words: daerah = area, region."
      - speaker: Kak Reza
        text: "Sehat, menyehatkan. Sayur menyehatkan badan."
        ar_eg: "صحي، يخلي صحي. الخضار بيقوّي الجسم."
        ar: "صحي، يجعل صحيًا. الخضار تقوّي الجسم."
        en: "Healthy, make healthy. Vegetables make the body healthy."
        note:
          ar_eg: "كلمات: badan = جسم."
          ar: "مفردات: badan = جسم، بدن."
          en: "Words: badan = body."
      - speaker: Kak Tiara
        text: "Bersih, membersihkan. Kering, mengeringkan. Naik, menaikkan."
        ar_eg: "نضيف، ينضّف. ناشف، ينشّف. يطلع، يطلّع."
        ar: "نظيف، ينظّف. جاف، يجفّف. يصعد، يرفع."
        en: "Clean, to clean. Dry, to dry. Go up, to raise."
        note:
          ar_eg: "كلمات: bersih = نضيف."
          ar: "مفردات: bersih = نظيف."
          en: "Words: bersih = clean."
      - speaker: Kak Reza
        text: "Senang, menyenangkan. Masuk, memasukkan. -kan berarti membuat sesuatu menjadi begitu."
        ar_eg: "مبسوط، يبسط. يدخل، يدخّل. -kan معناها «يخلي الحاجة كده»."
        ar: "سعيد، يُسعد. يدخل، يُدخل. -kan تعني «يجعل الشيء كذلك»."
        en: "Happy, pleasing. Enter, put in. -kan means 'make something so'."
        note:
          ar_eg: "زي وزن «فعّل» في العربي: نضيف ← نضّف، ناشف ← نشّف. كلمات: berarti = معناه، يعني."
          ar: "مثل وزن «فعّل» في العربية: نظيف ← نظّف، جاف ← جفّف. مفردات: berarti = يعني، معناه."
          en: "Like the Arabic form «فعّل»: clean → to clean, dry → to dry. Words: berarti = to mean."
      - speaker: Kak Tiara
        text: "Kalau ngobrol: bersihin, keringin, masukin. -kan jadi -in."
        ar_eg: "في الكلام: bersihin وkeringin وmasukin. ‎-kan بتبقى ‎-in."
        ar: "في الكلام: bersihin وkeringin وmasukin. تصبح ‎-kan ‎-in."
        en: "When chatting: bersihin, keringin, masukin. -kan becomes -in."
        note:
          ar_eg: "membersihkan ← bersihin. الكتب والأخبار بـ-kan، والشارع بـ-in."
          ar: "membersihkan ← bersihin. الكتب والأخبار بـ‎-kan، والشارع بـ‎-in."
          en: "membersihkan → bersihin. Books and news use -kan; the street uses -in."
      - speaker: Kak Tiara
        text: "Yaitu dan bukan hanya... tetapi juga. Bukan hanya enak, tetapi juga sehat."
        ar_eg: "yaitu و«مش بس... لكن كمان». مش بس حلو، لكن كمان صحي."
        ar: "yaitu و«ليس فقط... بل أيضًا». ليس لذيذًا فقط، بل صحي أيضًا."
        en: "Yaitu and not only... but also. Not only tasty, but also healthy."
        note:
          ar_eg: "كلمات: hanya = بس."
          ar: "مفردات: hanya = فقط."
          en: "Words: hanya = only."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Pupuk organik adalah pupuk dari bahan alami."
        ar_eg: "السماد العضوي هو سماد من حاجات طبيعية."
        ar: "السماد العضوي هو سماد من مواد طبيعية."
        en: "Organic fertiliser is fertiliser from natural materials."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Pupuk organik adalah pupuk dari bahan alami.", ar_eg: "السماد العضوي هو سماد من حاجات طبيعية.", ar: "السماد العضوي هو سماد من مواد طبيعية.", en: "Organic fertiliser is fertiliser from natural materials."}
      - {speaker: Kak Tiara, text: "Sayur menyehatkan badan.", ar_eg: "الخضار بيقوّي الجسم.", ar: "الخضار تقوّي الجسم.", en: "Vegetables make the body healthy."}
      - {speaker: Kak Reza, text: "Sayur menyehatkan badan.", ar_eg: "الخضار بيقوّي الجسم.", ar: "الخضار تقوّي الجسم.", en: "Vegetables make the body healthy."}
      - {speaker: Kak Tiara, text: "Kami membersihkan dan mengeringkan sayur.", ar_eg: "بننضف الخضار وبننشفه.", ar: "ننظف الخضار ونجففها.", en: "We clean and dry the vegetables."}
      - {speaker: Kak Reza, text: "Kami membersihkan dan mengeringkan sayur.", ar_eg: "بننضف الخضار وبننشفه.", ar: "ننظف الخضار ونجففها.", en: "We clean and dry the vegetables."}
      - {speaker: Kak Tiara, text: "Stroberi bukan hanya enak, tetapi juga sehat.", ar_eg: "الفراولة مش بس حلوة، لكن كمان صحية.", ar: "الفراولة ليست لذيذة فقط، بل صحية أيضًا.", en: "Strawberries are not only tasty but also healthy."}
      - {speaker: Kak Reza, text: "Stroberi bukan hanya enak, tetapi juga sehat.", ar_eg: "الفراولة مش بس حلوة، لكن كمان صحية.", ar: "الفراولة ليست لذيذة فقط، بل صحية أيضًا.", en: "Strawberries are not only tasty but also healthy."}
  - kind: outro
    title: Tips sehat Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, apa makanan sehat dari Mesir? Jelaskan dengan 'adalah' dan 'menyehatkan'."
        ar_eg: "يا محمد، إيه أكلة مصرية صحية؟ اشرحها بـadalah وmenyehatkan."
        ar: "يا محمد، ما طعام مصري صحي؟ اشرحه بـadalah وmenyehatkan."
        en: "Mohamed, what's a healthy Egyptian food? Explain it with 'adalah' and 'menyehatkan'."
        note:
          ar_eg: "دورك! جملة تعريف وجملة فايدة."
          ar: "دورك! جملة تعريف وجملة فائدة."
          en: "Your turn! One definition and one benefit."
      - {speaker: Kak Reza, text: "Contohnya: Ful adalah makanan dari kacang fava. Ful menyehatkan karena ada banyak protein.", ar_eg: "مثلًا: الفول أكلة من الفول المدمس. الفول صحي عشان فيه بروتين كتير.", ar: "مثلًا: الفول طعام من حبوب الفول. وهو مفيد للصحة لأن فيه بروتينًا كثيرًا.", en: "For example: Ful is a dish made of fava beans. Ful is healthy because it has lots of protein."}
      - {speaker: Kak Tiara, text: "Besok, tulis tiga tips sehat buat temanmu.", ar_eg: "بكرة، اكتب تلات نصايح صحية لصاحبك.", ar: "غدًا، اكتب ثلاث نصائح صحية لصديقك.", en: "Tomorrow, write three healthy tips for a friend."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Makan sayur, ya!", ar_eg: "شكرًا يا محمد. كُل خضار!", ar: "شكرًا يا محمد. كُل الخضار!", en: "Thank you, Mohamed. Eat your vegetables!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [adalah, yaitu, menyehatkan, membersihkan, menaikkan, petani, kebun]
