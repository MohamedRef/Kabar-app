schema: kabar.radio/v1
id: radio.bipa6.u01
language: id
level: bipa6
unit: bipa6.u01
title:
  target: Yang tidak dikatakan
  ar_eg: اللي ما اتقالش
  ar: ما لم يُقَل
  en: What isn't said
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Horas dari Medan
    lines:
      - {speaker: Kak Tiara, text: "Horas! Selamat pagi dari Medan, Sumatra Utara. Ini Kabar Radio. Saya Tiara.", ar_eg: "هوراس! صباح الخير من ميدان، شمال سومطرة. ده كبار راديو. أنا تيارا.", ar: "هوراس! صباح الخير من ميدان، شمال سومطرة. هذا كبار راديو. أنا تيارا.", en: "Horas! Good morning from Medan, North Sumatra. This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Horas adalah salam orang Batak. Di Medan ada Batak, Melayu, Tionghoa, India, dan Jawa.", ar_eg: "أنا رضا. هوراس تحية الباتاك. في ميدان فيه باتاك وملايو وصينيين وهنود وجاويين.", ar: "أنا رضا. «هوراس» تحية الباتاك. وفي ميدان باتاك وملايو وصينيون وهنود وجاويون.", en: "I'm Reza. Horas is the Batak greeting. Medan has Batak, Malay, Chinese, Indian and Javanese people."}
      - {speaker: Kak Tiara, text: "Kami baru minum kopi dengan Bang Togar. Dia membawa koran Minggu, ada cerpen di dalamnya.", ar_eg: "لسه شاربين قهوة مع بانج توجار. جاب جرنال الحد، وفيه قصة قصيرة.", ar: "شربنا القهوة للتو مع بانغ توغار، وأحضر صحيفة الأحد وفيها قصة قصيرة.", en: "We've just had coffee with Bang Togar. He brought the Sunday paper, with a short story in it."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar membaca makna tersirat: arti yang tidak ditulis langsung."
        ar_eg: "النهارده هنتعلم نقرا المعنى الضمني: المعنى اللي مش مكتوب على طول."
        ar: "اليوم نتعلم قراءة المعنى الضمني: ما لا يُكتب صراحة."
        en: "Today we learn to read implied meaning: what isn't written outright."
      - {speaker: Kak Tiara, text: "Mohamed, siapa penulis cerita pendek favoritmu?", ar_eg: "يا محمد، مين كاتب القصص القصيرة المفضل عندك؟", ar: "يا محمد، من كاتب القصة القصيرة المفضل لديك؟", en: "Mohamed, who's your favourite short-story writer?"}
  - kind: dialogue
    title: Cerpen di koran Minggu
    lines:
      - speaker: Kak Tiara
        text: "Saya bacakan potongan cerpen. Kak Reza dan saya lalu membahasnya."
        ar_eg: "هقرالكم حتة من قصة قصيرة. وبعدين أنا ورضا هنتكلم عنها."
        ar: "سأقرأ مقطعًا من قصة قصيرة، ثم نناقشه أنا ورضا."
        en: "I'll read an extract of a short story. Then Reza and I discuss it."
        note:
          ar_eg: "القصة متألفة للحلقة. اسأل نفسك: الشخصية حاسة بإيه، من غير ما تقول؟"
          ar: "القصة مؤلفة لهذه الحلقة. اسأل نفسك: بماذا تشعر الشخصية دون أن تقول؟"
          en: "The story was written for this episode. Ask yourself: what does the character feel, without saying it?"
      - {speaker: Kak Tiara, text: "Setiap sore, Opung menyiapkan dua cangkir kopi. Satu untuknya, satu lagi untuk kursi kosong di sebelahnya.", ar_eg: "كل عصر، أوبونج (الجدة) بتحضّر فنجانين قهوة. واحد ليها، والتاني للكرسي الفاضي اللي جنبها.", ar: "كل عصر تعدّ أوبونغ (الجدة) فنجانين من القهوة: واحدًا لها، وآخر للكرسي الفارغ بجانبها.", en: "Every afternoon, Opung made two cups of coffee. One for herself, the other for the empty chair beside her."}
      - {speaker: Kak Tiara, text: "Cucunya bertanya, untuk siapa kopi itu? Opung hanya tersenyum dan berkata, nanti dingin kalau tidak diminum.", ar_eg: "حفيدها سأل: القهوة دي لمين؟ أوبونج ابتسمت بس وقالت: هتبرد لو ما حدش شربها.", ar: "سألها حفيدها: لمن هذه القهوة؟ فابتسمت وقالت: ستبرد إن لم تُشرب.", en: "Her grandchild asked who the coffee was for. Opung just smiled and said, it'll get cold if no one drinks it."}
      - {speaker: Kak Reza, text: "Wah. Penulis tidak bilang suaminya sudah meninggal, tapi kita tahu.", ar_eg: "ياه. الكاتب ما قالش إن جوزها مات، بس إحنا فاهمين.", ar: "يا للعجب! لم يقل الكاتب إن زوجها توفي، لكننا عرفنا.", en: "Wow. The writer doesn't say her husband has died, but we know."}
      - {speaker: Kak Tiara, text: "Itu makna tersirat. Kursi kosong adalah simbol kehilangan.", ar_eg: "ده المعنى الضمني. الكرسي الفاضي رمز للفقد.", ar: "هذا هو المعنى الضمني؛ الكرسي الفارغ رمز الفقد.", en: "That's implied meaning. The empty chair is a symbol of loss."}
      - {speaker: Kak Reza, text: "Dan kalimat nanti dingin kalau tidak diminum? Menurut saya, itu tentang cinta yang tidak mau berakhir.", ar_eg: "وجملة «هتبرد لو ما حدش شربها»؟ في رأيي، دي عن حب مش عايز يخلص.", ar: "وعبارة «ستبرد إن لم تُشرب»؟ أراها عن حب يأبى أن ينتهي.", en: "And 'it'll get cold if no one drinks it'? I think it's about love that won't end."}
      - {speaker: Kak Tiara, text: "Tokohnya Opung, latarnya teras rumah di Medan, sore hari.", ar_eg: "الشخصية أوبونج، والمكان بلكونة بيت في ميدان، وقت العصر.", ar: "الشخصية أوبونغ، والمكان شرفة بيت في ميدان، عصرًا.", en: "The character is Opung; the setting, a house's veranda in Medan, in the afternoon."}
      - {speaker: Kak Reza, text: "Pencerita orang ketiga. Dia melihat dari luar, seperti kamera.", ar_eg: "الراوي بضمير الغايب. بيبص من بره، زي الكاميرا.", ar: "الراوي بضمير الغائب، يرى من الخارج كالكاميرا.", en: "A third-person narrator. They watch from outside, like a camera."}
      - {speaker: Kak Tiara, text: "Bang Togar bilang, cerpen yang bagus seperti kopi Sidikalang: pahit dulu, lalu hangat lama.", ar_eg: "بانج توجار قال إن القصة الحلوة زي قهوة سيديكالانج: مُرّة الأول، وبعدين دفاها بيطوّل.", ar: "قال بانغ توغار إن القصة الجيدة كقهوة سيديكالانغ: مُرّة أولًا ثم يدوم دفؤها.", en: "Bang Togar says a good short story is like Sidikalang coffee: bitter first, then warm for a long time."}
  - kind: word_spotlight
    title: Makna tersirat
    lines:
      - speaker: Kak Tiara
        text: "Tersurat artinya tertulis jelas. Tersirat artinya tersembunyi di balik kata."
        ar_eg: "tersurat يعني مكتوب بوضوح. tersirat يعني مستخبي ورا الكلام."
        ar: "tersurat: المكتوب صراحة. tersirat: المختبئ خلف الكلمات."
        en: "Tersurat means written plainly. Tersirat means hidden behind the words."
        note:
          ar_eg: "زي «المنطوق» و«المفهوم» في العربي."
          ar: "كالمنطوق والمفهوم في العربية."
          en: "Like Arabic «المنطوق» and «المفهوم»."
      - {speaker: Kak Reza, text: "Tokoh, latar, alur, sudut pandang, amanat, simbol.", ar_eg: "الشخصية، المكان والزمان، الحبكة، وجهة النظر، المغزى، الرمز.", ar: "الشخصية، الإطار، الحبكة، زاوية السرد، المغزى، الرمز.", en: "Character, setting, plot, point of view, moral, symbol."}
      - {speaker: Kak Tiara, text: "Pencerita orang pertama memakai aku. Pencerita orang ketiga memakai dia atau nama tokoh.", ar_eg: "الراوي بضمير المتكلم بيقول aku. والراوي بضمير الغايب بيقول dia أو اسم الشخصية.", ar: "راوي المتكلم يستخدم aku، وراوي الغائب يستخدم dia أو اسم الشخصية.", en: "A first-person narrator uses aku. A third-person narrator uses dia or the character's name."}
      - {speaker: Kak Reza, text: "Opung artinya kakek atau nenek dalam bahasa Batak.", ar_eg: "Opung معناها جد أو جدة بلغة الباتاك.", ar: "Opung تعني الجد أو الجدة بلغة الباتاك.", en: "Opung means grandfather or grandmother in Batak."}
      - {speaker: Kak Tiara, text: "Untuk berdiskusi: Menurut saya, tokoh ini…; Hal ini menunjukkan bahwa…", ar_eg: "عشان تتناقش: في رأيي، الشخصية دي…؛ ده بيورّي إن…", ar: "للنقاش: في رأيي، هذه الشخصية…؛ وهذا يدل على أن…", en: "For discussion: In my view, this character…; This shows that…"}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Kursi kosong adalah simbol kehilangan."
        ar_eg: "الكرسي الفاضي رمز للفقد."
        ar: "الكرسي الفارغ رمز الفقد."
        en: "The empty chair is a symbol of loss."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Kursi kosong adalah simbol kehilangan.", ar_eg: "الكرسي الفاضي رمز للفقد.", ar: "الكرسي الفارغ رمز الفقد.", en: "The empty chair is a symbol of loss."}
      - {speaker: Kak Tiara, text: "Penulis tidak mengatakannya secara langsung.", ar_eg: "الكاتب ما قالهاش على طول.", ar: "لم يقلها الكاتب مباشرة.", en: "The writer doesn't say it directly."}
      - {speaker: Kak Reza, text: "Penulis tidak mengatakannya secara langsung.", ar_eg: "الكاتب ما قالهاش على طول.", ar: "لم يقلها الكاتب مباشرة.", en: "The writer doesn't say it directly."}
      - {speaker: Kak Tiara, text: "Hal ini menunjukkan bahwa dia masih rindu.", ar_eg: "ده بيورّي إنها لسه مشتاقة.", ar: "هذا يدل على أنها ما زالت مشتاقة.", en: "This shows that she still longs for him."}
      - {speaker: Kak Reza, text: "Hal ini menunjukkan bahwa dia masih rindu.", ar_eg: "ده بيورّي إنها لسه مشتاقة.", ar: "هذا يدل على أنها ما زالت مشتاقة.", en: "This shows that she still longs for him."}
      - {speaker: Kak Tiara, text: "Latarnya teras rumah di sore hari.", ar_eg: "المكان بلكونة البيت وقت العصر.", ar: "الإطار شرفة البيت عصرًا.", en: "The setting is the veranda in the afternoon."}
      - {speaker: Kak Reza, text: "Latarnya teras rumah di sore hari.", ar_eg: "المكان بلكونة البيت وقت العصر.", ar: "الإطار شرفة البيت عصرًا.", en: "The setting is the veranda in the afternoon."}
  - kind: outro
    title: Cerpen mini Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, tulis tiga kalimat cerita. Tunjukkan perasaan tokoh tanpa menyebut perasaannya."
        ar_eg: "يا محمد، اكتب قصة في تلات جمل. ورّي إحساس الشخصية من غير ما تقول اسم الإحساس."
        ar: "يا محمد، اكتب قصة من ثلاث جمل، وأظهر شعور الشخصية دون أن تسمّيه."
        en: "Mohamed, write a three-sentence story. Show the character's feeling without naming it."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Dia membaca pesan itu tiga kali. Lalu dia mematikan ponselnya dan memandang hujan.", ar_eg: "مثلًا: قرا الرسالة تلات مرات. وبعدين قفل موبايله وفضل يبص على المطرة.", ar: "مثلًا: قرأ الرسالة ثلاث مرات، ثم أطفأ هاتفه وراح يتأمل المطر.", en: "For example: He read the message three times. Then he switched off his phone and stared at the rain."}
      - {speaker: Kak Tiara, text: "Besok, baca satu cerpen pendek dan cari satu simbol.", ar_eg: "بكرة، اقرا قصة قصيرة ودوّر فيها على رمز واحد.", ar: "غدًا، اقرأ قصة قصيرة وابحث عن رمز فيها.", en: "Tomorrow, read one short story and find one symbol."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Horas!", ar_eg: "شكرًا يا محمد. هوراس!", ar: "شكرًا يا محمد. هوراس!", en: "Thank you, Mohamed. Horas!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [cerpen, makna tersirat, tersurat, tokoh, latar, alur, pencerita, simbol, amanat, Opung, horas, koran Minggu]
review:
  status: draft
  verified: false
  notes: |
    The Opung story is original, written for this episode. Bang Togar is the registered
    BIPA 6 Medan character (cast.yaml). Spot-check: horas as Batak greeting, Opung =
    grandparent in Batak Toba, Sidikalang coffee from North Sumatra.
