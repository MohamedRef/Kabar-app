schema: kabar.radio/v1
id: radio.bipa2.u09
language: id
level: bipa2
unit: bipa2.u09
title:
  target: Wah, Lovina indah bgt!
  ar_eg: الله، لوفينا تجنن!
  ar: يا للروعة، لوفينا جميلة جدًا!
  en: Wow, Lovina is sooo pretty!
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Matahari terbit di Lovina
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi! Ini Kabar Radio dari Lovina, di Bali utara. Saya Tiara.", ar_eg: "صباح الخير! ده كبار راديو من لوفينا، في شمال بالي. أنا تيارا.", ar: "صباح الخير! هذا كبار راديو من لوفينا، في شمال بالي. أنا تيارا.", en: "Good morning! This is Kabar Radio from Lovina, in north Bali. I'm Tiara."}
      - {speaker: Kak Reza, text: "Dan saya Reza. Wah, Kak! Lihat matahari terbitnya. Indah sekali!", ar_eg: "وأنا رضا. الله يا تيارا! بصي على الشروق. جميل أوي!", ar: "وأنا رضا. يا للروعة يا تيارا! انظري إلى شروق الشمس. جميل جدًا!", en: "And I'm Reza. Wow, Tiara! Look at the sunrise. So beautiful!"}
      - {speaker: Kak Tiara, text: "Pagi ini kami naik perahu kecil untuk melihat lumba-lumba.", ar_eg: "الصبح ده ركبنا مركب صغير عشان نشوف الدلافين.", ar: "هذا الصباح ركبنا قاربًا صغيرًا لنرى الدلافين.", en: "This morning we took a small boat to see the dolphins."}
      - {speaker: Kak Reza, text: "Hari ini kita belajar cerita liburan, wah, aduh, lho, dan bahasa chat.", ar_eg: "النهارده هنتعلم حكاوي الأجازة، وwah وaduh وlho، ولغة الشات.", ar: "اليوم نتعلم قصص العطلات، وwah وaduh وlho، ولغة المحادثات.", en: "Today we learn holiday stories, wah, aduh, lho, and chat language."}
      - {speaker: Kak Tiara, text: "Halo, Mohamed! Liburan terakhirmu ke mana?", ar_eg: "أهلًا يا محمد! آخر أجازة رحت فين؟", ar: "مرحبًا يا محمد! إلى أين ذهبت في عطلتك الأخيرة؟", en: "Hello, Mohamed! Where did you go on your last holiday?"}
  - kind: dialogue
    title: Di atas perahu
    lines:
      - {speaker: Kak Reza, text: "Jam setengah enam pagi kami sudah di pantai. Aduh, saya masih mengantuk!", ar_eg: "الساعة خمسة ونص الصبح كنا على الشط. آه، كنت لسه نعسان!", ar: "في الخامسة والنصف صباحًا كنا على الشاطئ. آه، كنت ما زلت نعسانًا!", en: "At half past five we were already on the beach. Ugh, I was still sleepy!"}
      - {speaker: Kak Tiara, text: "Tapi langitnya merah muda dan oranye. Menyenangkan sekali!", ar_eg: "بس السما كانت بمبي وبرتقاني. كان ممتع أوي!", ar: "لكن السماء كانت وردية وبرتقالية. كان ممتعًا جدًا!", en: "But the sky was pink and orange. It was so lovely!"}
      - {speaker: Kak Reza, text: "Kami naik perahu bersama sepuluh perahu lain.", ar_eg: "ركبنا المركب مع عشر مراكب تانية.", ar: "ركبنا القارب مع عشرة قوارب أخرى.", en: "We went out with ten other boats."}
      - {speaker: Kak Tiara, text: "Kami menunggu, menunggu... Lho, di mana lumba-lumbanya?", ar_eg: "استنينا واستنينا... إيه ده، فين الدلافين؟", ar: "انتظرنا وانتظرنا... ماذا؟ أين الدلافين؟", en: "We waited and waited... Huh, where are the dolphins?"}
      - speaker: Kak Reza
        text: "Lalu tiba-tiba, wah! Ada lima lumba-lumba melompat di depan kami!"
        ar_eg: "وفجأة، الله! خمس دلافين نطّوا قدامنا!"
        ar: "ثم فجأة، يا للروعة! خمسة دلافين قفزت أمامنا!"
        en: "Then suddenly, wow! Five dolphins jumped right in front of us!"
        note:
          ar_eg: "wah للانبهار، aduh للوجع أو الضيق، وlho للمفاجأة («إيه ده؟»)."
          ar: "wah للإعجاب، وaduh للألم أو الضيق، وlho للمفاجأة («ماذا؟»)."
          en: "Wah is for wonder, aduh for pain or annoyance, lho for surprise ('huh?')."
      - {speaker: Kak Tiara, text: "Airnya tenang dan biru. Pemandangannya luar biasa.", ar_eg: "المية كانت هادية وزرقا. المنظر خرافي.", ar: "كان الماء هادئًا وأزرق. المنظر رائع.", en: "The water was calm and blue. The view was amazing."}
      - {speaker: Kak Reza, text: "Aduh, tapi saya lupa membawa topi. Kepala saya panas!", ar_eg: "آه، بس أنا نسيت الطاقية. راسي سخنت!", ar: "آه، لكنني نسيت القبعة. رأسي حار!", en: "Ugh, but I forgot my hat. My head is hot!"}
      - {speaker: Kak Tiara, text: "Sesudah itu, saya kirim foto ke grup WhatsApp keluarga.", ar_eg: "بعد كده، بعت صورة لجروب الواتساب بتاع العيلة.", ar: "بعد ذلك، أرسلت صورة إلى مجموعة واتساب العائلة.", en: "After that, I sent a photo to the family WhatsApp group."}
      - speaker: Kak Reza
        text: "Adik saya membalas: 'Wkwk, kakak udh bangun jam 5? Gk percaya!'"
        ar_eg: "أختي ردت: «ههههه، إنتي صحيتي الساعة خمسة؟ مش مصدقة!»"
        ar: "ردّت أختي: «هههه، استيقظتِ في الخامسة؟ لا أصدق!»"
        en: "My sister replied: 'Lol, you were up at 5? No way!'"
        note:
          ar_eg: "wkwk = ضحك (زي هههه)، udh = sudah، gk = gak/nggak (لأ)."
          ar: "wkwk = ضحك (مثل هههه)، udh = sudah، gk = gak/nggak (لا)."
          en: "Wkwk = laughter (like 'lol'), udh = sudah, gk = gak/nggak (no/not)."
      - {speaker: Kak Tiara, text: "Ibu saya menulis: 'Cantik bgt yg di foto! Hati-hati ya.'", ar_eg: "ماما كتبت: «اللي في الصورة حلوة أوي! خلي بالك من نفسك.»", ar: "كتبت أمي: «التي في الصورة جميلة جدًا! انتبهي لنفسك.»", en: "My mum wrote: 'The one in the photo is sooo pretty! Take care.'"}
      - {speaker: Kak Reza, text: "Bgt itu banget, yg itu yang. Mudah, kan?", ar_eg: "bgt يعني banget، وyg يعني yang. سهلة، مش كده؟", ar: "bgt تعني banget، وyg تعني yang. سهلة، أليس كذلك؟", en: "Bgt is banget, yg is yang. Easy, right?"}
      - {speaker: Kak Tiara, text: "Liburan ini menyenangkan sekali. Saya ingin kembali tahun depan.", ar_eg: "الأجازة دي كانت ممتعة أوي. نفسي أرجع السنة الجاية.", ar: "كانت هذه العطلة ممتعة جدًا. أريد أن أعود العام القادم.", en: "This holiday was so much fun. I want to come back next year."}
  - kind: word_spotlight
    title: Indah dan menyenangkan
    lines:
      - {speaker: Kak Tiara, text: "Indah, cantik, luar biasa. Pantainya indah, pemandangannya luar biasa.", ar_eg: "جميل، حلو، خرافي. الشط جميل، والمنظر خرافي.", ar: "جميل، فاتن، رائع. الشاطئ جميل، والمنظر رائع.", en: "Beautiful, pretty, amazing. The beach is beautiful, the view amazing."}
      - {speaker: Kak Reza, text: "Menyenangkan, membosankan, melelahkan. Perjalanannya melelahkan, tapi menyenangkan.", ar_eg: "ممتع، ممل، متعب. الرحلة كانت متعبة، بس ممتعة.", ar: "ممتع، ممل، متعب. كانت الرحلة متعبة، لكنها ممتعة.", en: "Fun, boring, tiring. The trip was tiring, but fun."}
      - {speaker: Kak Tiara, text: "Wah! Aduh! Lho? Wah, bagus! Aduh, panas! Lho, kok sepi?", ar_eg: "الله! آه! إيه ده؟ الله، حلو! آه، حر! إيه ده، فاضية ليه؟", ar: "يا للروعة! آه! ماذا؟ رائع! آه، حار! ماذا؟ لماذا هو خالٍ؟", en: "Wow! Ouch! Huh? Wow, great! Ugh, hot! Huh, why's it so empty?"}
      - speaker: Kak Reza
        text: "Yg, gk, udh, bgt, wkwk. Bahasa chat ada di mana-mana!"
        ar_eg: "yg، gk، udh، bgt، wkwk. لغة الشات في كل حتة!"
        ar: "yg، gk، udh، bgt، wkwk. لغة المحادثات في كل مكان!"
        en: "Yg, gk, udh, bgt, wkwk. Chat language is everywhere!"
        note:
          ar_eg: "القارئ في كبار بيفك الاختصارات دي. بس في الكتابة الرسمية اكتب الكلمة كاملة."
          ar: "قارئ كبار يفك هذه الاختصارات، لكن في الكتابة الرسمية اكتب الكلمة كاملة."
          en: "Kabar's Reader decodes these, but in formal writing spell the word out."
      - {speaker: Kak Tiara, text: "Mengantuk, senang, kecewa, kaget. Saya kaget ketika lumba-lumba melompat.", ar_eg: "نعسان، مبسوط، زعلان (خيبة أمل)، متفاجئ. اتخضيت لما الدلافين نطّت.", ar: "نعسان، سعيد، خائب الأمل، مندهش. اندهشت حين قفزت الدلافين.", en: "Sleepy, happy, disappointed, startled. I was startled when the dolphins jumped."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Wah, indah sekali!"
        ar_eg: "الله، جميل أوي!"
        ar: "يا للروعة، جميل جدًا!"
        en: "Wow, so beautiful!"
        note:
          ar_eg: "كرر ورانا، وحط إحساس في الصوت!"
          ar: "ردّد بعدنا، وضع إحساسًا في صوتك!"
          en: "Repeat after us, with feeling!"
      - {speaker: Kak Reza, text: "Wah, indah sekali!", ar_eg: "الله، جميل أوي!", ar: "يا للروعة، جميل جدًا!", en: "Wow, so beautiful!"}
      - {speaker: Kak Tiara, text: "Aduh, saya lupa membawa topi.", ar_eg: "آه، نسيت أجيب الطاقية.", ar: "آه، نسيت أن أحضر القبعة.", en: "Ugh, I forgot to bring my hat."}
      - {speaker: Kak Reza, text: "Aduh, saya lupa membawa topi.", ar_eg: "آه، نسيت أجيب الطاقية.", ar: "آه، نسيت أن أحضر القبعة.", en: "Ugh, I forgot to bring my hat."}
      - {speaker: Kak Tiara, text: "Lho, di mana lumba-lumbanya?", ar_eg: "إيه ده، فين الدلافين؟", ar: "ماذا؟ أين الدلافين؟", en: "Huh, where are the dolphins?"}
      - {speaker: Kak Reza, text: "Lho, di mana lumba-lumbanya?", ar_eg: "إيه ده، فين الدلافين؟", ar: "ماذا؟ أين الدلافين؟", en: "Huh, where are the dolphins?"}
      - {speaker: Kak Tiara, text: "Perjalanannya melelahkan, tapi menyenangkan.", ar_eg: "الرحلة كانت متعبة، بس ممتعة.", ar: "كانت الرحلة متعبة، لكنها ممتعة.", en: "The trip was tiring, but fun."}
      - {speaker: Kak Reza, text: "Perjalanannya melelahkan, tapi menyenangkan.", ar_eg: "الرحلة كانت متعبة، بس ممتعة.", ar: "كانت الرحلة متعبة، لكنها ممتعة.", en: "The trip was tiring, but fun."}
  - kind: outro
    title: Liburan Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan liburanmu. Pakai wah, aduh, atau lho!"
        ar_eg: "يا محمد، احكيلنا عن أجازتك. استخدم wah أو aduh أو lho!"
        ar: "يا محمد، حدّثنا عن عطلتك. استعمل wah أو aduh أو lho!"
        en: "Mohamed, tell us about your holiday. Use wah, aduh or lho!"
        note:
          ar_eg: "دورك! جاوب بصوت عالي بتلات جمل."
          ar: "دورك! أجب بصوت مسموع بثلاث جمل."
          en: "Your turn! Answer out loud in three sentences."
      - {speaker: Kak Reza, text: "Contohnya: Saya pergi ke Alexandria. Wah, lautnya biru! Aduh, tapi pantainya ramai sekali.", ar_eg: "مثلًا: رحت إسكندرية. الله، البحر أزرق! آه، بس الشط كان زحمة أوي.", ar: "مثلًا: ذهبت إلى الإسكندرية. يا للروعة، البحر أزرق! آه، لكن الشاطئ كان مزدحمًا جدًا.", en: "For example: I went to Alexandria. Wow, the sea was blue! Ugh, but the beach was so crowded."}
      - {speaker: Kak Tiara, text: "Besok, coba tulis pesan WhatsApp tentang liburanmu dengan gaya chat.", ar_eg: "بكرة، اكتب رسالة واتساب عن أجازتك بأسلوب الشات.", ar: "غدًا، اكتب رسالة واتساب عن عطلتك بأسلوب المحادثة.", en: "Tomorrow, write a WhatsApp message about your holiday in chat style."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Sampai jumpa, wkwk!", ar_eg: "شكرًا يا محمد. سلام، هههه!", ar: "شكرًا يا محمد. إلى اللقاء، هههه!", en: "Thank you, Mohamed. Bye, lol!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [wah, aduh, lho, indah, menyenangkan, melelahkan, yg, gk, udh, bgt, wkwk, kan]
