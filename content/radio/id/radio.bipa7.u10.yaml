schema: kabar.radio/v1
id: radio.bipa7.u10
language: id
level: bipa7
unit: bipa7.u10
title:
  target: Seminar terakhir di Lembah Baliem
  ar_eg: آخر سيمينار في وادي باليم
  ar: الندوة الأخيرة في وادي باليم
  en: The last seminar in the Baliem Valley
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 8
segments:
  - kind: intro
    title: Wamena
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Wamena, di Lembah Baliem! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من وامينا، في وادي باليم! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من وامينا في وادي باليم! هذا كبار راديو. أنا تيارا.", en: "Good morning from Wamena, in the Baliem Valley! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Lembah ini baru dikenal dunia luar tahun 1938. Sekarang ada festival yang mempertemukan suku Dani, Lani, sama Yali.", ar_eg: "أنا رضا. الوادي ده العالم الخارجي ما عرفهوش غير سنة 1938. ودلوقتي فيه مهرجان بيجمع قبايل الداني واللاني واليالي.", ar: "أنا رضا. لم يعرف العالمُ الخارجي هذا الوادي إلا عام 1938، واليوم يجمع مهرجانه قبائل الداني واللاني واليالي.", en: "I'm Reza. The outside world only learned of this valley in 1938. Now a festival brings the Dani, Lani and Yali together."}
      - {speaker: Kak Tiara, text: "Ini episode terakhir perjalanan kita, Mohamed. Dari Jakarta sampai Papua! Nggak kerasa, ya?", ar_eg: "دي آخر حلقة في رحلتنا يا محمد. من جاكرتا لحد بابوا!", ar: "هذه آخر حلقة في رحلتنا يا محمد، من جاكرتا حتى بابوا!", en: "This is the last episode of our journey, Mohamed. From Jakarta all the way to Papua!", note: {ar_eg: "Nggak kerasa = الوقت عدى من غير ما نحس.", ar: "Nggak kerasa = مر الوقت دون أن نشعر.", en: "Nggak kerasa = time flew, we barely felt it."}}
      - speaker: Kak Reza
        text: "Hari ini kita belajar ragam ilmiah: seminar, metode penelitian, sama tanya jawab yang cepet."
        ar_eg: "النهارده هنتعلم الأسلوب العلمي: السيمينار، ومنهج البحث، والأسئلة والأجوبة السريعة."
        ar: "اليوم نتعلم الأسلوب العلمي: الندوة، ومنهج البحث، والأسئلة والأجوبة السريعة."
        en: "Today we learn scholarly register: seminars, research methods, and fast Q&A."
      - {speaker: Kak Tiara, text: "Mohamed, siap buat ujian terakhir? Santai aja, kamu udah siap banget.", ar_eg: "يا محمد، جاهز للامتحان الأخير؟ ما تقلقش، إنت جاهز جدًا.", ar: "يا محمد، أمستعد للاختبار الأخير؟ اطمئن، أنت مستعد تمامًا.", en: "Mohamed, ready for the final test? Relax, you're very ready."}
  - kind: dialogue
    title: Presentasi di seminar
    lines:
      - speaker: Kak Tiara
        text: "Reza presentasi penelitian kecil di seminar. Aku nanya kayak peserta. Di seminar semuanya resmi, dan ngomongnya agak cepet, ya!"
        ar_eg: "رضا هيعرض بحث صغير في ندوة، وأنا هسأل زي واحدة من الحضور. في الندوة كله رسمي، والكلام سريع شوية!"
        ar: "يعرض رضا بحثًا صغيرًا في ندوة، وأنا أسأل كأحد الحضور. في الندوة كل شيء رسمي، والكلام سريع قليلًا!"
        en: "Reza presents a small study at a seminar. I ask questions like an attendee. At a seminar it's all formal, and it's a bit fast!"
        note:
          ar_eg: "البحث متخيّل. ركّز على الهيكل: الهدف، المنهج، النتايج، الحدود."
          ar: "البحث متخيَّل. ركّز على البنية: الهدف، المنهج، النتائج، الحدود."
          en: "The study is imaginary. Focus on the structure: aim, method, findings, limits."
      - {speaker: Kak Reza, text: "Penelitian ini bertujuan untuk mengetahui bagaimana siswa di Wamena memakai bahasa daerah dan bahasa Indonesia sehari-hari.", ar_eg: "«البحث ده هدفه نعرف إزاي الطلبة في وامينا بيستعملوا اللغة المحلية والإندونيسي كل يوم».", ar: "«يهدف هذا البحث إلى معرفة كيفية استخدام طلاب وامينا للغة المحلية والإندونيسية يوميًا».", en: "This study aims to find out how students in Wamena use their regional language and Indonesian daily."}
      - {speaker: Kak Reza, text: "Metode yang digunakan adalah wawancara dan kuesioner. Responden berjumlah enam puluh siswa.", ar_eg: "«المنهج المستخدم هو المقابلات والاستبيان. وعدد المشاركين ستين طالب».", ar: "«المنهج المتبع هو المقابلة والاستبيان، وبلغ عدد المستجيبين ستين طالبًا».", en: "The method used was interviews and a questionnaire. There were sixty student respondents."}
      - {speaker: Kak Reza, text: "Sebelum wawancara, kami meminta izin orang tua dan sekolah. Nama responden juga dirahasiakan.", ar_eg: "«قبل المقابلات، خدنا إذن الأهالي والمدرسة. وأسامي المشاركين كمان سرّية».", ar: "«استأذنّا الأهالي والمدرسة قبل المقابلات، وأُبقيت أسماء المستجيبين سرية».", en: "Before the interviews, we asked parents' and the school's permission. Respondents' names were also kept confidential."}
      - {speaker: Kak Reza, text: "Berdasarkan tabel ini, sebagian besar siswa memakai bahasa daerah di rumah, tetapi bahasa Indonesia di sekolah.", ar_eg: "«بناءً على الجدول ده، أغلب الطلبة بيستعملوا اللغة المحلية في البيت، والإندونيسي في المدرسة».", ar: "«بناءً على هذا الجدول، يستخدم معظم الطلاب اللغة المحلية في البيت والإندونيسية في المدرسة».", en: "Based on this table, most students use their regional language at home, but Indonesian at school."}
      - {speaker: Kak Reza, text: "Penelitian ini memiliki keterbatasan, yaitu jumlah responden yang kecil. Oleh karena itu, penelitian lanjutan diperlukan.", ar_eg: "«البحث ده ليه حدود، وهي إن عدد المشاركين قليل. وعشان كده، محتاجين بحث تاني بعده».", ar: "«لهذا البحث حدود، أبرزها صغر العينة، ولذلك تلزم أبحاث لاحقة».", en: "This study has limitations, namely the small number of respondents. Therefore, further research is needed."}
      - {speaker: Kak Tiara, text: "Terima kasih, Bapak. Saya ingin bertanya: mengapa memilih kuesioner, bukan observasi?", ar_eg: "شكرًا يا دكتور. عايزة أسأل: ليه اخترت الاستبيان مش الملاحظة؟", ar: "شكرًا يا سيدي. سؤالي: لماذا اخترت الاستبيان لا الملاحظة؟", en: "Thank you, sir. I'd like to ask: why choose a questionnaire, not observation?"}
      - {speaker: Kak Reza, text: "Pertanyaan yang sangat baik. Kuesioner lebih cepat, tetapi Ibu benar, observasi bisa melengkapi data kami.", ar_eg: "سؤال ممتاز. الاستبيان أسرع، بس حضرتك عندك حق، الملاحظة ممكن تكمّل البيانات بتاعتنا.", ar: "سؤال ممتاز. الاستبيان أسرع، لكنك محقة، فالملاحظة قد تكمل بياناتنا.", en: "An excellent question. A questionnaire is faster, but you're right, observation could complement our data."}
      - {speaker: Kak Tiara, text: "Keren! Ngakuin keterbatasan itu tanda peneliti yang jujur.", ar_eg: "حلو! إنك تعترف بحدود بحثك ده علامة الباحث الأمين.", ar: "أحسنت! الاعتراف بالحدود علامة الباحث الأمين.", en: "Great! Admitting limitations is the mark of an honest researcher."}
  - kind: word_spotlight
    title: Ragam ilmiah
    lines:
      - speaker: Kak Tiara
        text: "Penelitian ini bertujuan untuk… Metode yang digunakan adalah… Berdasarkan data…"
        ar_eg: "«البحث ده هدفه…»، «المنهج المستخدم هو…»، «بناءً على البيانات…»."
        ar: "«يهدف هذا البحث إلى…»، «المنهج المتبع هو…»، «بناءً على البيانات…»."
        en: "This study aims to… The method used is… Based on the data…"
        note:
          ar_eg: "الأسلوب العلمي بيحب المبني للمجهول: digunakan، diperlukan، dirahasiakan."
          ar: "يميل الأسلوب العلمي إلى المبني للمجهول: digunakan، diperlukan، dirahasiakan."
          en: "Scholarly register favours the passive: digunakan, diperlukan, dirahasiakan."
      - {speaker: Kak Reza, text: "Responden, kuesioner, observasi, sampel, temuan, keterbatasan, penelitian lanjutan.", ar_eg: "مشاركين، استبيان، ملاحظة، عيّنة، نتايج، حدود، بحث لاحق.", ar: "مستجيبون، استبيان، ملاحظة، عيّنة، نتائج، حدود، بحث لاحق.", en: "Respondents, questionnaire, observation, sample, findings, limitations, further research."}
      - {speaker: Kak Tiara, text: "Etika penelitian: izin, persetujuan, kerahasiaan.", ar_eg: "أخلاقيات البحث: إذن، موافقة، سرّية.", ar: "أخلاقيات البحث: إذن، موافقة، سرية.", en: "Research ethics: permission, consent, confidentiality."}
      - {speaker: Kak Reza, text: "Sidang skripsi, penguji, pembimbing, poster ilmiah, artikel ilmiah populer.", ar_eg: "مناقشة رسالة التخرج، الممتحن، المشرف، بوستر علمي، مقال علمي مبسط.", ar: "مناقشة البحث، الممتحِن، المشرف، ملصق علمي، مقال علمي مبسّط.", en: "Thesis defence, examiner, supervisor, scientific poster, popular science article."}
      - {speaker: Kak Tiara, text: "Menjawab dengan sopan: Pertanyaan yang sangat baik. Terima kasih atas masukannya.", ar_eg: "الرد بأدب: «سؤال ممتاز». «شكرًا على ملاحظتك».", ar: "الرد بلباقة: «سؤال ممتاز». «شكرًا على ملاحظتك».", en: "Answering politely: An excellent question. Thank you for your input."}
      - speaker: Kak Reza
        text: "Habis sidang, teman-teman teriak: Selamat, ya! Akhirnya lulus juga! Traktir, dong!"
        ar_eg: "بعد المناقشة الصحاب بيزعقوا: مبروك! أخيرًا خلصت! عزمنا بقى!"
        ar: "بعد المناقشة يصيح الأصدقاء: مبروك! نجحت أخيرًا! ادعُنا على حسابك!"
        en: "After the defence, friends shout: Congrats! You finally passed! Your treat!"
        note:
          ar_eg: "traktir = تعزم الناس على حسابك، ودي عادة بعد أي نجاح."
          ar: "traktir = أن تدعو الآخرين على حسابك، وهي عادة بعد أي نجاح."
          en: "traktir = treat others on your dime: a must after any success."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Penelitian ini bertujuan untuk mengetahui pemakaian bahasa."
        ar_eg: "البحث ده هدفه نعرف استعمال اللغة."
        ar: "يهدف هذا البحث إلى معرفة استعمال اللغة."
        en: "This study aims to find out how language is used."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Penelitian ini bertujuan untuk mengetahui pemakaian bahasa.", ar_eg: "البحث ده هدفه نعرف استعمال اللغة.", ar: "يهدف هذا البحث إلى معرفة استعمال اللغة.", en: "This study aims to find out how language is used."}
      - {speaker: Kak Tiara, text: "Metode yang digunakan adalah wawancara.", ar_eg: "المنهج المستخدم هو المقابلات.", ar: "المنهج المتبع هو المقابلة.", en: "The method used was interviews."}
      - {speaker: Kak Reza, text: "Metode yang digunakan adalah wawancara.", ar_eg: "المنهج المستخدم هو المقابلات.", ar: "المنهج المتبع هو المقابلة.", en: "The method used was interviews."}
      - {speaker: Kak Tiara, text: "Penelitian ini memiliki keterbatasan.", ar_eg: "البحث ده ليه حدود.", ar: "لهذا البحث حدود.", en: "This study has limitations."}
      - {speaker: Kak Reza, text: "Penelitian ini memiliki keterbatasan.", ar_eg: "البحث ده ليه حدود.", ar: "لهذا البحث حدود.", en: "This study has limitations."}
      - {speaker: Kak Tiara, text: "Terima kasih atas masukannya.", ar_eg: "شكرًا على ملاحظتك.", ar: "شكرًا على ملاحظتك.", en: "Thank you for your input."}
      - {speaker: Kak Reza, text: "Terima kasih atas masukannya.", ar_eg: "شكرًا على ملاحظتك.", ar: "شكرًا على ملاحظتك.", en: "Thank you for your input."}
  - kind: outro
    title: Sampai jumpa, Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, tantangan terakhir: jelaskan penelitian kecil tentang dirimu. Tujuan, metode, temuan, dan keterbatasan."
        ar_eg: "يا محمد، آخر تحدي: اشرح بحث صغير عن نفسك. الهدف، والمنهج، والنتايج، والحدود."
        ar: "يا محمد، التحدي الأخير: اشرح بحثًا صغيرًا عن نفسك: الهدف والمنهج والنتائج والحدود."
        en: "Mohamed, final challenge: present a small study about yourself. Aim, method, findings and limitations."
        note:
          ar_eg: "دورك! قولها بصوت عالي وبثقة. إنت عملتها!"
          ar: "دورك! قلها بصوت مسموع وبثقة. لقد نجحت!"
          en: "Your turn! Say it out loud, with confidence. You made it!"
      - {speaker: Kak Reza, text: "Contohnya: Penelitian ini bertujuan untuk mengetahui apakah belajar tujuh menit sehari cukup. Berdasarkan pengalaman saya, jawabannya: ya!", ar_eg: "مثلًا: «البحث ده هدفه نعرف هل سبع دقايق مذاكرة في اليوم كفاية. وبناءً على تجربتي، الإجابة: أيوه!»", ar: "مثلًا: «يهدف هذا البحث إلى معرفة هل تكفي سبع دقائق يوميًا للتعلم. وبناءً على تجربتي، الجواب: نعم!»", en: "For example: This study aims to find out whether seven minutes a day is enough. Based on my experience, the answer is: yes!"}
      - {speaker: Kak Tiara, text: "Dari Jakarta sampai Wamena, kamu udah belajar dengan sabar dan tekun. Kita bangga banget sama kamu.", ar_eg: "من جاكرتا لحد وامينا، اتعلمت بصبر واجتهاد. إحنا فخورين بيك جدًا.", ar: "من جاكرتا إلى وامينا تعلّمت بصبر ومثابرة، ونحن فخوران بك جدًا.", en: "From Jakarta to Wamena, you've learned patiently and steadily. We're so proud."}
      - {speaker: Kak Reza, text: "Makasih, Papua! Makasih, Indonesia! Dan makasih, Mohamed, sahabat kita dari Kairo.", ar_eg: "شكرًا يا بابوا! شكرًا يا إندونيسيا! وشكرًا يا محمد، صاحبنا من القاهرة.", ar: "شكرًا يا بابوا! شكرًا يا إندونيسيا! وشكرًا يا محمد، صديقنا من القاهرة.", en: "Thank you, Papua! Thank you, Indonesia! And thank you, Mohamed, our friend from Cairo."}
      - {speaker: Kak Tiara, text: "Sampai ketemu lagi di Kabar Radio!", ar_eg: "نشوفك تاني في كبار راديو!", ar: "إلى اللقاء مجددًا في كبار راديو!", en: "See you again on Kabar Radio!"}
words: [ragam ilmiah, penelitian, responden, kuesioner, temuan, keterbatasan, etika penelitian, sidang skripsi, berdasarkan, artikel ilmiah populer, kerahasiaan, metode penelitian]
review:
  status: draft
  verified: false
  notes: |
    Series finale. The Wamena study is imaginary (flagged in the note). Spot-check:
    1938 Archbold expedition sighting of the Baliem Valley; Baliem Valley Festival with
    Dani, Lani and Yali. "Tujuh menit" nods to the ≤7-minute lesson cap.
