        ar: يا محمد، ماذا تريد أن تأكل غدًا؟ وماذا تريد أن تشرب؟
        en: Mohamed, what do you want to eat tomorrow? What do you want to drink?
        note:
          ar_eg: تحدي بكرة الصغير - قول أكلتك ومشروبك المفضلين - Makanan favorit saya… Minuman favorit saya…
          ar: تحدّي الغد الصغير - اذكر طعامك ومشروبك المفضلين - Makanan favorit saya… Minuman favorit saya…
          en: Tomorrow's tiny challenge - name your favourite food and drink - "Makanan favorit saya… Minuman favorit saya…"
