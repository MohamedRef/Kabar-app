        ar_eg: تشرب إيه؟
        ar: ماذا تريد أن تشرب؟
        en: What would you like to drink?
      - speaker: Kak Reza
        text: Teh manis. Saya tidak suka kopi.
        ar_eg: شاي بسكر. مبحبش القهوة.
        ar: شاي محلّى. لا أحب القهوة.
        en: Sweet tea. I don't like coffee.
