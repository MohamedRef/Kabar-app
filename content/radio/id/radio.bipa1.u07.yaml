    lines:
      - speaker: Kak Tiara
        text: Mohamed, hobimu apa? Kamu suka apa?
        ar_eg: يا محمد، هوايتك إيه؟ بتحب إيه؟
        ar: يا محمد، ما هوايتك؟ ماذا تحب؟
        en: Mohamed, what's your hobby? What do you like?
        note:
          ar_eg: دورك! جاوب بصوت عالي بجملة أو اتنين.
          ar: دورك! أجب بصوت مسموع بجملة أو جملتين.
          en: Your turn! Answer out loud in a sentence or two.
      - speaker: Kak Reza
        text: Hobi saya membaca dan bermain sepak bola. Saya suka makanan Indonesia, tapi saya tidak bisa menari!
        ar_eg: هوايتي القراية ولعب الكورة. بحب الأكل الإندونيسي، بس مبعرفش أرقص!
        ar: هوايتي القراءة ولعب كرة القدم. أحب الطعام الإندونيسي، لكني لا أستطيع الرقص!
        en: My hobbies are reading and playing football. I like Indonesian food, but I can't dance!
      - speaker: Kak Tiara
        text: Tidak apa-apa! Bagus sekali, Mohamed!
        ar_eg: ولا يهمك! برافو عليك يا محمد!
        ar: لا بأس! أحسنت جدًا يا محمد!
        en: No problem! Very good, Mohamed!
      - speaker: Kak Reza
        text: Mohamed, besok kamu mau makan apa? Mau minum apa?
