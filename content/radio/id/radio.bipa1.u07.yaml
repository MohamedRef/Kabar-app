        text: Teh manis. Saya tidak suka kopi.
        ar_eg: شاي بسكر. مبحبش القهوة.
        ar: شاي محلّى. لا أحب القهوة.
        en: Sweet tea. I don't like coffee.
      - speaker: Kak Reza
        text: Saya suka makanan Indonesia. Enak sekali!
        ar_eg: بحب الأكل الإندونيسي. حلو أوي!
        ar: أحب الطعام الإندونيسي. لذيذ جدًا!
        en: I like Indonesian food. Very tasty!
      - speaker: Kak Tiara
        text: Saya suka makanan Indonesia. Enak sekali!
        ar_eg: بحب الأكل الإندونيسي. حلو أوي!
        ar: أحب الطعام الإندونيسي. لذيذ جدًا!
        en: I like Indonesian food. Very tasty!
