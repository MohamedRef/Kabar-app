schema: kabar.radio/v1
id: radio.bipa1.u07
language: id
level: bipa1
unit: bipa1.u07
title:
  target: Nongkrong di Kemang
  ar_eg: قعدة في كيمانج
  ar: جلسة في كيمانغ
  en: Hanging out in Kemang
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Sore di kafe
    lines:
      - speaker: Kak Tiara
        text: Halo, selamat sore! Selamat datang di Kabar Radio! Aku Tiara.
        ar_eg: أهلًا، مساء الخير! أهلًا بيك في كبار راديو! أنا تيارا.
        ar: مرحبًا، مساء الخير! أهلًا بك في كبار راديو! أنا تيارا.
        en: Hello, good afternoon! Welcome to Kabar Radio! I'm Tiara.
      - speaker: Kak Reza
        text: Aku Reza. Sore, Tiara! Hari ini kita di mana, nih?
        ar_eg: وأنا رضا. مساء الخير يا تيارا! إحنا فين النهارده؟
        ar: وأنا رضا. مساء الخير يا تيارا! أين نحن اليوم؟
        en: And I'm Reza. Afternoon, Tiara! So where are we today?
      - speaker: Kak Tiara
        text: Di Kemang, di kafe. Kemang rame banget sore ini!
        ar_eg: إحنا في كيمانج، في كافيه. كيمانج زحمة أوي العصر ده!
        ar: نحن في كيمانغ، في مقهى. كيمانغ مزدحم جدًا هذا المساء!
        en: In Kemang, at a café. Kemang is packed this afternoon!
        note:
          ar_eg: كيمانج حتة في جنوب جاكرتا مليانة كافيهات. الـ nongkrong (القعدة مع الصحاب) هواية في حد ذاتها.
          ar: كيمانغ حيّ في جنوب جاكرتا مليء بالمقاهي. والـ nongkrong (الجلوس مع الأصدقاء) هواية بذاتها.
          en: Kemang is a South Jakarta district full of cafés. Nongkrong - hanging out with friends - is a hobby in itself.
      - speaker: Kak Reza
        text: Iya. Banyak yang nongkrong di sini. Ngopi, dengerin musik.
        ar_eg: آه. ناس كتير بتقعد هنا. بيشربوا قهوة ويسمعوا مزيكا.
        ar: نعم. كثيرون يجلسون هنا. يشربون القهوة ويستمعون إلى الموسيقى.
        en: Yeah. Lots of people hang out here. Having coffee, listening to music.
        note:
          ar_eg: ngopi = نشرب قهوة (من kopi). dengerin = mendengarkan بتاعة الشارع.
          ar: ngopi = شرب القهوة (من kopi). dengerin = mendengarkan في الكلام اليومي.
          en: ngopi = have coffee (from kopi). dengerin = street mendengarkan.
      - speaker: Kak Tiara
        text: Kamu suka nongkrong, Reza?
        ar_eg: إنت بتحب القعدة دي يا رضا؟
        ar: هل تحب الجلوس مع الأصدقاء يا رضا؟
        en: Do you like hanging out, Reza?
      - speaker: Kak Reza
        text: Suka banget! Tapi kopi di Kemang mahal banget, lho.
        ar_eg: بحبها أوي! بس القهوة في كيمانج غالية جدًا.
        ar: أحبه كثيرًا! لكن القهوة في كيمانغ غالية جدًا.
        en: Love it! But coffee in Kemang is so expensive, you know.
      - speaker: Kak Tiara
        text: Suka, mau, ingin, bisa, harus. Makanan dan minuman. Enak sekali, sangat enak, enak banget!
        ar_eg: يحب، عايز، نفسه، يقدر، لازم. أكل وشرب. حلو أوي، حلو جدًا، حلو موت!
        ar: يحب، يريد، يتمنى، يستطيع، يجب. طعام وشراب. لذيذ جدًا، لذيذ للغاية، لذيذ جدًا جدًا!
        en: Like, want, would like, can, must. Food and drink. Very tasty, very tasty, so tasty!
        note:
          ar_eg: موضوع النهارده - الهوايات، وأفعال زي suka وmau وbisa وharus، والـ -an، وإزاي تقوّي الصفة.
          ar: موضوع اليوم - الهوايات، والأفعال المساعدة suka وmau وbisa وharus، واللاحقة -an، وتقوية الصفات.
          en: Today's topic - hobbies, the helper verbs suka, mau, bisa and harus, the -an suffix, and making adjectives stronger.
      - speaker: Kak Reza
        text: Halo, Mohamed! Selamat datang di Kemang! Hobimu apa?
        ar_eg: أهلًا يا محمد! أهلًا بيك في كيمانج! هوايتك إيه؟
        ar: مرحبًا يا محمد! أهلًا بك في كيمانغ! ما هوايتك؟
        en: Hello, Mohamed! Welcome to Kemang! What's your hobby?
  - kind: dialogue
    title: Hobi kami
    lines:
      - speaker: Kak Reza
        text: Tiara, hobimu apa?
        ar_eg: يا تيارا، هوايتك إيه؟
        ar: يا تيارا، ما هوايتك؟
        en: Tiara, what's your hobby?
      - speaker: Kak Tiara
        text: Aku suka baca sama nari. Aku sering nari Bali.
        ar_eg: بحب القراية والرقص. برقص رقص بالي كتير.
        ar: أحب القراءة والرقص. كثيرًا ما أرقص الرقص البالي.
        en: I like reading and dancing. I often do Balinese dance.
        note:
          ar_eg: baca = membaca، nari = menari. وsama = dan («و»).
          ar: baca = membaca، nari = menari، وsama = dan («و»).
          en: baca = membaca, nari = menari, sama = dan ('and').
      - speaker: Kak Reza
        text: Wah, keren! Tari Bali bagus banget. Aku nggak bisa nari.
        ar_eg: الله، جامد! رقص بالي جميل أوي. أنا مبعرفش أرقص.
        ar: رائع! الرقص البالي جميل جدًا. لا أستطيع الرقص.
        en: Wow, cool! Balinese dance is so beautiful. I can't dance.
      - speaker: Kak Tiara
        text: Nggak apa-apa! Mau belajar?
        ar_eg: ولا يهمك! عايز تتعلم؟
        ar: لا بأس! هل تريد أن تتعلم؟
        en: That's OK! Want to learn?
        note:
          ar_eg: Nggak apa-apa = مفيش مشكلة. أكتر جملة هتسمعها في إندونيسيا.
          ar: Nggak apa-apa = لا مشكلة. من أكثر العبارات شيوعًا في إندونيسيا.
          en: Nggak apa-apa = no problem. You'll hear it everywhere.
      - speaker: Kak Reza
        text: Mau, tapi hari ini aku capek banget! Sibuk banget di kantor.
        ar_eg: عايز، بس أنا تعبان أوي النهارده! كنت مشغول جدًا في الشغل.
        ar: أريد، لكني متعب جدًا اليوم! كنت مشغولًا للغاية في المكتب.
        en: I do, but I'm so tired today! Super busy at the office.
      - speaker: Kak Tiara
        text: Hobimu apa?
        ar_eg: وإنت هوايتك إيه؟
        ar: وما هوايتك أنت؟
        en: What's your hobby?
      - speaker: Kak Reza
        text: Aku suka main bulu tangkis sama sepak bola. Tiap Sabtu aku main bulu tangkis.
        ar_eg: بحب ألعب ريشة وكورة. كل يوم سبت بلعب ريشة.
        ar: أحب لعب الريشة الطائرة وكرة القدم. كل يوم سبت ألعب الريشة.
        en: I like playing badminton and football. Every Saturday I play badminton.
        note:
          ar_eg: الريشة والكورة أكبر رياضتين في إندونيسيا. main هي bermain بس بين الأصحاب.
          ar: الريشة الطائرة وكرة القدم أشهر رياضتين في إندونيسيا. وmain صيغة عامية من bermain.
          en: Badminton and football are Indonesia's big sports. main is the casual bermain.
      - speaker: Kak Tiara
        text: Bulu tangkis? Aku pengin belajar! Tapi belum bisa main.
        ar_eg: ريشة؟ نفسي أتعلم! بس لسه مبعرفش ألعب.
        ar: الريشة؟ أودّ أن أتعلم! لكني لا أعرف اللعب بعد.
        en: Badminton? I'd love to learn! But I can't play yet.
        note:
          ar_eg: 'pengin = ingin في الكلام: «نفسي».'
          ar: 'pengin = ingin في الكلام اليومي: «أتمنى».'
          en: "pengin is spoken ingin: 'I'd love to'."
      - speaker: Kak Reza
        text: Nggak apa-apa. Sabtu kita main, ya! Kamu harus coba.
        ar_eg: ولا يهمك. يوم السبت نلعب سوا! لازم تجربي.
        ar: لا بأس. يوم السبت نلعب معًا! يجب أن تجرّبي.
        en: No problem. We'll play on Saturday! You've got to try.
      - speaker: Kak Tiara
        text: Boleh! Sekarang pesan minum dulu. Aku jadi pelayan, ya.
        ar_eg: ماشي! يلا نطلب حاجة نشربها. أنا هبقى الجرسونة.
        ar: موافقة! الآن لنطلب مشروبًا. سأكون أنا النادلة.
        en: Sure! Now let's order drinks. I'll be the waitress.
        note:
          ar_eg: مشهد تمثيلي - تيارا الجرسونة، ورضا الزبون.
          ar: مشهد تمثيلي - تيارا النادلة، ورضا الزبون.
          en: A role-play - Tiara is the waitress, Reza the customer.
      - speaker: Kak Tiara
        text: Sore, Mas! Mau minum apa?
        ar_eg: مساء الخير يا أستاذ! تشرب إيه؟
        ar: مساء الخير! ماذا تريد أن تشرب؟
        en: Afternoon! What would you like to drink?
      - speaker: Kak Reza
        text: Es teh manis aja, Mbak. Saya nggak suka kopi. Ada makanan Mesir?
        ar_eg: شاي مثلج بالسكر بس. مبحبش القهوة. فيه أكل مصري؟
        ar: شاي مثلج محلّى فقط. لا أحب القهوة. هل يوجد طعام مصري؟
        en: Just an iced sweet tea, please. I don't like coffee. Is there Egyptian food?
        note:
          ar_eg: 'الزبون بيستعمل saya مع الجرسون عشان مش صحاب، بس الكلام نفسه خفيف: aja، nggak.'
          ar: 'الزبون يستعمل saya مع النادل لأنهما ليسا صديقين، لكن الكلام نفسه يومي: aja، nggak.'
          en: "The customer uses saya with a waiter he doesn't know, but the rest is casual: aja, nggak."
      - speaker: Kak Tiara
        text: Wah, maaf, nggak ada. Adanya makanan Indonesia, nasi goreng sama sate.
        ar_eg: آسفة، مفيش. فيه أكل إندونيسي، ناسي جورينج وساتيه.
        ar: عذرًا، لا يوجد. يوجد طعام إندونيسي، ناسي غورينغ وساتيه.
        en: Oh, sorry, there isn't. We've got Indonesian food, fried rice and satay.
      - speaker: Kak Reza
        text: Nasi goreng satu, ya. Saya suka banget makanan Indonesia!
        ar_eg: واحد ناسي جورينج لو سمحتي. أنا بحب الأكل الإندونيسي!
        ar: طبق ناسي غورينغ واحد من فضلك. أحب الطعام الإندونيسي!
        en: One fried rice, please. I really like Indonesian food!
      - speaker: Kak Tiara
        text: Oke. Pedes nggak?
        ar_eg: ماشي. حراق ولا لأ؟
        ar: حسنًا. حار أم لا؟
        en: OK. Spicy or not?
        note:
          ar_eg: pedes = pedas. «... nggak?» في الآخر = «ولا لأ؟».
          ar: pedes = pedas. و«... nggak?» في الآخر = «أم لا؟».
          en: pedes = pedas. '... nggak?' at the end = 'or not?'.
      - speaker: Kak Reza
        text: Nggak usah pedes, Mbak. Makasih.
        ar_eg: من غير شطة. ميرسي.
        ar: من دون حرّ. شكرًا.
        en: No spice, thanks.
      - speaker: Kak Tiara
        text: Gimana, Reza, makanannya?
        ar_eg: الأكل عامل إيه يا رضا؟
        ar: كيف الطعام يا رضا؟
        en: So, Reza, how's the food?
        note:
          ar_eg: خلص التمثيل - دلوقتي بيدوقوا الأكل بجد.
          ar: انتهى التمثيل - الآن يتذوقان الطعام حقًا.
          en: The role-play is over - now they're really tasting the food.
      - speaker: Kak Reza
        text: Enak sekali! Enak banget! Tapi mahal.
        ar_eg: حلو أوي! حلو موت! بس غالي.
        ar: لذيذ جدًا! لذيذ للغاية! لكنه غالٍ.
        en: Very tasty! So good! But expensive.
      - speaker: Kak Tiara
        text: Iya, kafe di Kemang emang mahal. Tapi tempatnya asyik, musiknya juga enak.
        ar_eg: أيوه، الكافيهات في كيمانج غالية. بس المكان حلو، والمزيكا كمان حلوة.
        ar: نعم، المقاهي في كيمانغ غالية. لكن المكان جميل، والموسيقى جميلة أيضًا.
        en: Yeah, Kemang cafés really are pricey. But the place is cool, and the music's good too.
        note:
          ar_eg: emang = memang = «فعلًا/أصلًا».
          ar: emang = memang = «فعلًا».
          en: emang = memang = 'really, indeed'.
      - speaker: Kak Reza
        text: Bener. Makanan favoritmu apa?
        ar_eg: صح. أكلتك المفضلة إيه؟
        ar: صحيح. ما طعامك المفضل؟
        en: True. What's your favourite food?
        note:
          ar_eg: bener = benar = «صح».
          ar: bener = benar = «صحيح».
          en: bener = benar = 'right, true'.
      - speaker: Kak Tiara
        text: Makanan favoritku sate. Minumannya es teh manis.
        ar_eg: أكلتي المفضلة الساتيه. ومشروبي المفضل الشاي بسكر.
        ar: طعامي المفضل الساتيه. ومشروبي المفضل الشاي المحلّى.
        en: 'My favourite food is satay. Drink: iced sweet tea.'
      - speaker: Kak Reza
        text: Wah, aku juga suka es teh! Habis ini pulang?
        ar_eg: الله، أنا كمان بحب الشاي بسكر! بعد كده نروّح؟
        ar: رائع، أنا أيضًا أحب الشاي المحلّى! بعد هذا، هل نعود إلى البيت؟
        en: Oh, I like iced tea too! Going home after this?
      - speaker: Kak Tiara
        text: Belum dong! Kita masih nongkrong. Aku mau es teh lagi!
        ar_eg: لسه يا رضا! إحنا لسه قاعدين هنا. نفسي أشرب شاي تاني!
        ar: ليس بعد يا رضا! ما زلنا جالسين هنا. أودّ أن أشرب شايًا آخر!
        en: No way! We're still hanging out. I want another iced tea!
  - kind: word_spotlight
    title: Suka, bisa, sekali
    lines:
      - speaker: Kak Reza
        text: Suka. Saya suka minum teh manis. Dimas suka bermain bulu tangkis.
        ar_eg: يحب. أنا بحب أشرب شاي بسكر. ديماس بيحب يلعب ريشة.
        ar: يحب. أحب شرب الشاي المحلّى. ديماس يحب لعب الريشة.
        en: Like. I like drinking sweet tea. Dimas likes playing badminton.
        note:
          ar_eg: الفعل اللي بعد suka وmau وbisa بيفضل زي ما هو، من غير أي تغيير.
          ar: يبقى الفعل بعد suka وmau وbisa كما هو، بلا أي تغيير.
          en: The verb after suka, mau and bisa stays exactly as it is.
      - speaker: Kak Tiara
        text: Mau, ingin. Saya mau pulang. Saya ingin melihat tari Bali.
        ar_eg: عايز، نفسه. أنا عايزة أروّح. نفسي أشوف رقص بالي.
        ar: يريد، يتمنى. أريد أن أعود إلى البيت. أودّ أن أرى الرقص البالي.
        en: Want, would like. I want to go home. I'd love to see Balinese dance.
      - speaker: Kak Reza
        text: Bisa. Saya bisa berenang. Maaf, saya tidak bisa datang besok.
        ar_eg: يقدر. أنا بعرف أعوم. آسف، مش هقدر آجي بكرة.
        ar: يستطيع. أستطيع السباحة. عذرًا، لا أستطيع المجيء غدًا.
        en: Can. I can swim. Sorry, I can't come tomorrow.
      - speaker: Kak Tiara
        text: Harus, perlu, tidak usah. Kamu harus coba rendang! Tidak usah pedas.
        ar_eg: لازم، محتاج، مش لازم. لازم تجرب الرندانج! مش لازم حراق.
        ar: يجب، يحتاج، لا داعي. يجب أن تجرّب الرندانغ! لا داعي للحار.
        en: Must, need, no need. You must try rendang! No need for spicy.
      - speaker: Kak Reza
        text: Ingin, pengin. Tidak usah, nggak usah. Aku pengin coba rendang. Nggak usah pedes!
        ar_eg: Ingin وpengin. Tidak usah وnggak usah. نفسي أجرب رندانج. من غير شطة!
        ar: Ingin وpengin. Tidak usah وnggak usah. أريد أن أجرب الرندانغ. من دون حر!
        en: Ingin, pengin. Tidak usah, nggak usah. I'd love to try rendang. No spice!
        note:
          ar_eg: 'في الشارع: pengin = ingin، nggak = tidak، pedes = pedas.'
          ar: 'في الكلام اليومي: pengin = ingin، nggak = tidak، pedes = pedas.'
          en: 'Street forms: pengin = ingin, nggak = tidak, pedes = pedas.'
      - speaker: Kak Reza
        text: Boleh dan tidak boleh. Di masjid tidak boleh pakai sepatu.
        ar_eg: مسموح ومش مسموح. في الجامع ممنوع تلبس جزمة.
        ar: يجوز ولا يجوز. لا يجوز لبس الحذاء في المسجد.
        en: Allowed and not allowed. You can't wear shoes in the mosque.
      - speaker: Kak Tiara
        text: Makan, makanan. Minum, minuman. Main, mainan. Pakai, pakaian.
        ar_eg: ياكل، أكل. يشرب، مشروب. يلعب، لعبة. يلبس، هدوم.
        ar: يأكل، طعام. يشرب، مشروب. يلعب، لعبة. يلبس، ملابس.
        en: Eat, food. Drink, a drink. Play, a toy. Wear, clothes.
        note:
          ar_eg: اللاحقة -an بتعمل اسم من الفعل - الحاجة اللي بتتاكل أو بتتشرب أو بتتلعب بيها.
          ar: تصوغ اللاحقة -an اسمًا من الفعل - الشيء الذي يُؤكل أو يُشرب أو يُلعب به.
          en: The suffix -an makes a noun from a verb - the thing you eat, drink or play with.
      - speaker: Kak Reza
        text: Makanan Indonesia enak. Anak saya suka mainan mobil. Tulisanmu bagus.
        ar_eg: الأكل الإندونيسي حلو. ابني بيحب العربيات اللعب. خطك حلو.
        ar: الطعام الإندونيسي لذيذ. ابني يحب السيارات اللعبة. خطك جميل.
        en: Indonesian food is tasty. My child likes toy cars. Your handwriting is nice.
      - speaker: Kak Tiara
        text: Enak sekali. Sangat enak. Enak banget!
        ar_eg: حلو أوي. حلو جدًا. حلو موت!
        ar: لذيذ جدًا. لذيذ للغاية. لذيذ جدًا جدًا!
        en: Very tasty. Very tasty. So tasty!
        note:
          ar_eg: sekali بعد الصفة، وsangat قبلها (أرسمي شوية)، وbanget بعدها بين الصحاب بس.
          ar: sekali بعد الصفة، وsangat قبلها (أكثر رسمية)، وbanget بعدها في العامية فقط.
          en: sekali goes after the adjective, sangat before it (a bit more formal), banget after it, casual only.
      - speaker: Kak Reza
        text: Pemandangannya indah sekali. Bali sangat terkenal. Kopinya enak banget!
        ar_eg: المنظر جميل أوي. بالي مشهورة جدًا. القهوة حلوة موت!
        ar: المنظر جميل جدًا. بالي مشهورة للغاية. القهوة لذيذة جدًا!
        en: The view is very beautiful. Bali is very famous. The coffee is so good!
      - speaker: Kak Tiara
        text: Salam kenal! Salam kenal, Mohamed!
        ar_eg: فرصة سعيدة! فرصة سعيدة يا محمد!
        ar: تشرفنا! تشرفنا يا محمد!
        en: Nice to meet you! Nice to meet you, Mohamed!
        note:
          ar_eg: الجسر العربي - salam من «سلام». salam kenal يعني «فرصة سعيدة» لما تتعرف على حد جديد.
          ar: الجسر العربي - salam من «سلام». وsalam kenal تعني «تشرفنا» عند التعارف.
          en: Arabic Bridge - salam comes from «سلام». salam kenal means "nice to meet you".
  - kind: recap
    title: Enak banget!
    lines:
      - speaker: Kak Tiara
        text: Hobi saya membaca dan menari.
        ar_eg: هوايتي القراية والرقص.
        ar: هوايتي القراءة والرقص.
        en: My hobbies are reading and dancing.
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
