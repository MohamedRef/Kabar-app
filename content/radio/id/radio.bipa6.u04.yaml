id: radio.bipa6.u04
language: id
level: bipa6
unit: bipa6.u04
title:
  target: Sriwijaya, kerajaan di atas air
  ar_eg: سريويجايا، مملكة فوق الميه
  ar: سريويجايا، مملكة على الماء
  en: Srivijaya, a kingdom on the water
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Jembatan Ampera
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Palembang! Di depan kami, Jembatan Ampera dan Sungai Musi. Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من باليمبانج! قدامنا كوبري أمبيرا ونهر موسي. ده كبار راديو. أنا تيارا.", ar: "صباح الخير من باليمبانغ! أمامنا جسر أمبيرا ونهر موسي. هذا كبار راديو. أنا تيارا.", en: "Good morning from Palembang! In front of us, the Ampera Bridge and the Musi River. This is Kabar Radio. I'm Tiara."}
      - speaker: Kak Reza
        text: "Aku Reza. Lebih dari seribu tahun lalu, kota ini pusatnya Kerajaan Sriwijaya."
        ar_eg: "أنا رضا. من أكتر من ألف سنة، المدينة دي كانت مركز مملكة سريويجايا."
        ar: "أنا رضا. قبل أكثر من ألف عام كانت هذه المدينة مركز مملكة سريويجايا."
        en: "I'm Reza. More than a thousand years ago, this city was the centre of the Srivijaya kingdom."
        note:
          ar_eg: "كلمات: sriwijaya = سريويجايا."
          ar: "مفردات: sriwijaya = سريويجايا، مملكة قديمة."
          en: "Words: sriwijaya = Srivijaya, an ancient Sumatran kingdom."
      - {speaker: Kak Tiara, text: "Sriwijaya menguasai jalur laut dan perdagangan di selat-selat sekitar Sumatra.", ar_eg: "سريويجايا كانت مسيطرة على طرق البحر والتجارة في المضايق اللي حوالين سومطرة.", ar: "سيطرت سريويجايا على طرق البحر والتجارة في المضائق حول سومطرة.", en: "Srivijaya controlled the sea lanes and trade in the straits around Sumatra."}
      - speaker: Kak Reza
        text: "Hari ini kita baca prosa sejarah, terus belajar kalimat inversi."
        ar_eg: "النهارده هنقرا نثر تاريخي ونتعلم الجملة المقلوبة."
        ar: "اليوم نقرأ نثرًا تاريخيًا ونتعلم الجملة المقلوبة الترتيب."
        en: "Today we read historical prose and learn inverted sentences."
      - {speaker: Kak Tiara, text: "Mohamed, Mesir juga punya sejarah sungai yang panjang, kan?", ar_eg: "يا محمد، مصر كمان ليها تاريخ طويل مع النهر، صح؟", ar: "يا محمد، لمصر أيضًا تاريخ نهري طويل، أليس كذلك؟", en: "Mohamed, Egypt has a long river history too, right?"}
  - kind: dialogue
    title: Di museum
    lines:
      - speaker: Kak Tiara
        text: "Reza jadi pemandu museum. Aku pengunjung yang banyak nanya. Pemandunya ngomong resmi, kayak di museum beneran."
        ar_eg: "رضا هيبقى مرشد في المتحف، وأنا زايرة بسأل كتير. المرشد بيتكلم رسمي زي في المتحف بجد."
        ar: "يؤدي رضا دور مرشد متحف، وأنا زائرة كثيرة الأسئلة. يتكلم المرشد بلغة رسمية كما في متحف حقيقي."
        en: "Reza plays a museum guide. I'm a visitor with lots of questions. The guide speaks formally, like in a real museum."
        note:
          ar_eg: "خلي بالك من الجمل اللي الفعل فيها بييجي الأول: Datanglah para pedagang."
          ar: "انتبه إلى الجمل التي يتقدم فيها الفعل: Datanglah para pedagang."
          en: "Listen for sentences where the verb comes first: Datanglah para pedagang."
      - speaker: Kak Reza
        text: "Selamat datang. Di ruangan ini tersimpan salinan prasasti dari masa Sriwijaya."
        ar_eg: "أهلًا بيكم. في الأوضة دي محفوظة نسخ من نقوش من عصر سريويجايا."
        ar: "مرحبًا بكم. في هذه القاعة تُحفظ نسخ من نقوش عهد سريويجايا."
        en: "Welcome. In this room are kept copies of inscriptions from the Srivijaya era."
        note:
          ar_eg: "كلمات: tersimpan = متخزن، محفوظ."
          ar: "مفردات: tersimpan = محفوظ، مُخزَّن."
          en: "Words: tersimpan = stored, saved."
      - {speaker: Kak Tiara, text: "Prasasti itu ditulis dalam bahasa apa?", ar_eg: "النقوش دي مكتوبة بلغة إيه؟", ar: "بأي لغة كُتبت تلك النقوش؟", en: "What language were those inscriptions written in?"}
      - {speaker: Kak Reza, text: "Dalam bahasa Melayu Kuno, dengan aksara Pallawa. Prasasti Kedukan Bukit termasuk tulisan Melayu tertua yang diketahui.", ar_eg: "بالملايو القديمة، بحروف بالافا. ونقش كيدوكان بوكيت من أقدم الكتابات الملايو المعروفة.", ar: "بالملايوية القديمة وبخط بالافا، ونقش كيدوكان بوكيت من أقدم النصوص الملايوية المعروفة.", en: "In Old Malay, in Pallava script. The Kedukan Bukit inscription is among the oldest known Malay writing."}
      - {speaker: Kak Tiara, text: "Keren banget. Sriwijaya bisa kaya gimana caranya?", ar_eg: "حاجة تحفة. وإزاي سريويجايا بقت غنية؟", ar: "مذهل. وكيف اغتنت سريويجايا؟", en: "Amazing. How did Srivijaya become rich?", note: {ar_eg: "keren = جامد/تحفة. السؤال بالكلام: … gimana caranya? = bagaimana.", ar: "keren = رائع. في الكلام: … gimana caranya? بدل bagaimana.", en: "keren = cool, amazing. Spoken question: … gimana caranya? for bagaimana."}}
      - {speaker: Kak Reza, text: "Datanglah para pedagang dari India, Tiongkok, dan Arab. Singgahlah kapal-kapal mereka di pelabuhan ini.", ar_eg: "جم التجار من الهند والصين والعرب. ومراكبهم كانت بترسى في المينا ده.", ar: "فجاء التجار من الهند والصين وبلاد العرب، ورست سفنهم في هذا الميناء.", en: "There came traders from India, China and Arabia. Their ships stopped at this port."}
      - {speaker: Kak Tiara, text: "Jadi, kayanya dari dagang rempah sama barang lain, ya.", ar_eg: "يعني الغنى جه من تجارة البهارات وحاجات تانية.", ar: "إذن جاءت الثروة من تجارة التوابل وغيرها.", en: "So the wealth came from the spice trade and other goods."}
      - {speaker: Kak Reza, text: "Benar. Seorang biksu dari Tiongkok, I-Tsing, pernah belajar di sini sebelum ke India.", ar_eg: "صح. راهب صيني اسمه إي-تسينج درس هنا قبل ما يروح الهند.", ar: "صحيح. وقد درس هنا راهب صيني يُدعى إي-تسينغ قبل رحلته إلى الهند.", en: "Right. A Chinese monk, I-Tsing, studied here before going to India."}
      - speaker: Kak Tiara
        text: "Terus berabad-abad kemudian, Laksamana Cheng Ho juga datang, kan?"
        ar_eg: "وبعد قرون كتير، جه الأدميرال تشينج هو كمان، صح؟"
        ar: "وبعد قرون جاء الأميرال تشنغ خه أيضًا، أليس كذلك؟"
        en: "Centuries later came Admiral Cheng Ho too, right?"
        note:
          ar_eg: "كلمات: berabad-abad = لقرون، من قرون."
          ar: "مفردات: berabad-abad = لقرون."
          en: "Words: berabad-abad = for centuries."
      - speaker: Kak Reza
        text: "Ya, pada abad ke-15. Laut tidak memisahkan bangsa-bangsa; laut menyatukan mereka."
        ar_eg: "أيوه، في القرن الخمستاشر. البحر ما بيفرّقش بين الشعوب؛ البحر بيجمّعهم."
        ar: "نعم، في القرن الخامس عشر. البحر لا يفرّق الشعوب بل يجمعها."
        en: "Yes, in the 15th century. The sea doesn't divide nations; it unites them."
        note:
          ar_eg: "كلمات: memisahkan = يفصل، يفرّق."
          ar: "مفردات: memisahkan = يفصل، يفرّق."
          en: "Words: memisahkan = to separate, split up."
  - kind: word_spotlight
    title: Inversi
    lines:
      - speaker: Kak Tiara
        text: "Kalimat biasa: Para pedagang datang. Kalimat inversi: Datanglah para pedagang."
        ar_eg: "الجملة العادية: التجار جم. الجملة المقلوبة: جم التجار."
        ar: "الجملة العادية: التجار جاؤوا. الجملة المقلوبة: جاء التجار."
        en: "Normal: The traders came. Inverted: There came the traders."
        note:
          ar_eg: "زي العربي بالظبط: «جاء التجارُ» الفعل الأول. -lah بتأكد عليه."
          ar: "كالجملة الفعلية في العربية: «جاء التجار». و-lah تؤكد الفعل."
          en: "Just like the Arabic verbal sentence. The -lah stresses the verb."
      - {speaker: Kak Reza, text: "Inversi sering dipakai dalam cerita sejarah dan dongeng: Hiduplah seorang raja.", ar_eg: "القلب ده بيتستعمل كتير في الحكايات التاريخية والحواديت: «كان يا ما كان، عاش ملك».", ar: "يكثر القلب في الحكايات التاريخية والخرافات: «عاش ملكٌ…»", en: "Inversion is common in history and fairy tales: There lived a king."}
      - {speaker: Kak Tiara, text: "Kalimat bermarkah: Kapal itulah yang membawa rempah. Kata -lah memberi tekanan.", ar_eg: "جملة فيها تأكيد: «المركب ده بالذات هو اللي جاب البهارات». -lah بتعمل تأكيد.", ar: "جملة مؤكَّدة: «تلك السفينة هي التي حملت التوابل»، و-lah تفيد التوكيد.", en: "A marked sentence: It was that ship that carried the spices. The -lah adds emphasis."}
      - {speaker: Kak Reza, text: "Kerajaan, raja, prasasti, aksara, pelabuhan, jalur rempah, laksamana.", ar_eg: "مملكة، ملك، نقش، أبجدية، مينا، طريق البهارات، أدميرال.", ar: "مملكة، ملك، نقش، خط، ميناء، طريق التوابل، أميرال.", en: "Kingdom, king, inscription, script, port, spice route, admiral."}
      - {speaker: Kak Tiara, text: "Abad, masa, zaman dahulu, berabad-abad kemudian.", ar_eg: "قرن، عصر، زمان أوي، بعد قرون كتير.", ar: "قرن، عهد، الزمن الغابر، بعد قرون.", en: "Century, era, olden times, centuries later."}
      - speaker: Kak Tiara
        text: "Inversi itu buat cerita sama sejarah. Ngobrol biasa: Dulu banyak pedagang datang ke sini, lho."
        ar_eg: "القلب ده للحكايات والتاريخ. في الكلام العادي: زمان كان تجار كتير بييجوا هنا."
        ar: "القلب للحكايات والتاريخ. في الكلام العادي: قديمًا كان تجار كثيرون يأتون إلى هنا."
        en: "Inversion is for stories and history. In normal chat: Lots of traders used to come here, you know."
        note:
          ar_eg: "zaman dahulu ← dulu في الكلام."
          ar: "zaman dahulu ← dulu في الكلام."
          en: "zaman dahulu → dulu in speech."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Datanglah para pedagang dari jauh."
        ar_eg: "جم التجار من بعيد."
        ar: "جاء التجار من بعيد."
        en: "There came traders from afar."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Datanglah para pedagang dari jauh.", ar_eg: "جم التجار من بعيد.", ar: "جاء التجار من بعيد.", en: "There came traders from afar."}
      - {speaker: Kak Tiara, text: "Di ruangan ini tersimpan prasasti kuno.", ar_eg: "في الأوضة دي محفوظ نقش قديم.", ar: "في هذه القاعة يُحفظ نقش قديم.", en: "In this room is kept an ancient inscription."}
      - {speaker: Kak Reza, text: "Di ruangan ini tersimpan prasasti kuno.", ar_eg: "في الأوضة دي محفوظ نقش قديم.", ar: "في هذه القاعة يُحفظ نقش قديم.", en: "In this room is kept an ancient inscription."}
      - {speaker: Kak Tiara, text: "Kapal itulah yang membawa rempah.", ar_eg: "المركب ده بالذات هو اللي جاب البهارات.", ar: "تلك السفينة هي التي حملت التوابل.", en: "It was that ship that carried the spices."}
      - {speaker: Kak Reza, text: "Kapal itulah yang membawa rempah.", ar_eg: "المركب ده بالذات هو اللي جاب البهارات.", ar: "تلك السفينة هي التي حملت التوابل.", en: "It was that ship that carried the spices."}
      - {speaker: Kak Tiara, text: "Laut tidak memisahkan; laut menyatukan.", ar_eg: "البحر ما بيفرّقش؛ البحر بيجمّع.", ar: "البحر لا يفرّق بل يجمع.", en: "The sea doesn't divide; it unites."}
      - {speaker: Kak Reza, text: "Laut tidak memisahkan; laut menyatukan.", ar_eg: "البحر ما بيفرّقش؛ البحر بيجمّع.", ar: "البحر لا يفرّق بل يجمع.", en: "The sea doesn't divide; it unites."}
  - kind: outro
    title: Pemandu Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, sekarang kamu jadi pemandu museum di Kairo. Mulailah dengan kalimat inversi."
        ar_eg: "يا محمد، اعمل نفسك مرشد في متحف في القاهرة. ابدأ بجملة مقلوبة."
        ar: "يا محمد، كن مرشدًا في متحف بالقاهرة، وابدأ بجملة مقلوبة."
        en: "Mohamed, be a museum guide in Cairo. Start with an inverted sentence."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Di ruangan ini tersimpan patung-patung firaun. Datanglah para wisatawan dari seluruh dunia untuk melihatnya.", ar_eg: "مثلًا: في الأوضة دي محفوظة تماثيل الفراعنة. وبييجي السياح من كل الدنيا يتفرجوا عليها.", ar: "مثلًا: في هذه القاعة تُحفظ تماثيل الفراعنة، ويأتي السياح من أنحاء العالم لرؤيتها.", en: "For example: In this room are kept statues of pharaohs. Tourists come from all over the world to see them."}
      - {speaker: Kak Tiara, text: "Besok, tulis ringkasan sejarah satu kota yang kamu suka, ya.", ar_eg: "بكرة، اكتب ملخص تاريخ مدينة بتحبها.", ar: "غدًا، اكتب ملخصًا لتاريخ مدينة تحبها.", en: "Tomorrow, write a short history of a city you like."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Salam dari Sungai Musi!", ar_eg: "شكرًا يا محمد. سلام من نهر موسي!", ar: "شكرًا يا محمد. تحية من نهر موسي!", en: "Thank you, Mohamed. Greetings from the Musi River!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [kerajaan, prasasti, aksara, pelabuhan, laksamana, datang, abad, pemandu, biksu, menguasai, pusat, selat]
review:
  status: draft
  verified: false
  notes: |
    Spot-check: Kedukan Bukit inscription (682 CE, Old Malay, Pallava script, Palembang);
    I-Tsing's stay in Srivijaya (7th c.) before/after India; Cheng Ho in Palembang
    (15th c.). The museum and guide are generic, not a specific institution.
