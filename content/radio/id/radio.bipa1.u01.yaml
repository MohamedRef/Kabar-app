    lines:
      - speaker: Mbak Gadis
        text: Mohamed, selamat sore! Apa kabar?
        ar_eg: محمد، مساء الخير! إزيك؟
        ar: يا محمد، مساء الخير! كيف حالك؟
        en: Mohamed, good afternoon! How are you?
        note:
          ar_eg: دورك! جاوب بصوت عالي قبل ما أردي يجاوب.
          ar: دورك! أجب بصوت مسموع قبل أن يجيب أردي.
          en: Your turn! Answer out loud before Ardi does.
      - speaker: Mas Ardi
        text: Kabar baik, terima kasih. Dan Anda?
        ar_eg: كويس، شكرًا. وحضرتك؟
        ar: بخير، شكرًا. وأنتِ؟
        en: I'm well, thank you. And you?
      - speaker: Mbak Gadis
        text: Baik juga, terima kasih. Mohamed, salam kenal!
        ar_eg: كويسة كمان، شكرًا. محمد، اتشرفت بيك!
        ar: بخير أيضًا، شكرًا. يا محمد، تشرّفت بك!
        en: Fine too, thank you. Mohamed, nice to meet you!
      - speaker: Mas Ardi
        text: Salam kenal, saya Mohamed.
        ar_eg: (أردي بيجاوب مكانك) اتشرفت بيكي، أنا محمد.
        ar: (يجيب أردي عنك) تشرّفت بكِ، أنا محمد.
        en: (Ardi answers for you) Nice to meet you, I'm Mohamed.
      - speaker: Mbak Gadis
        text: Terima kasih, Mohamed! Baik, baik!
        ar_eg: شكرًا يا محمد! كويس، كويس!
        ar: شكرًا يا محمد! أحسنت، أحسنت!
        en: Thank you, Mohamed! Good, good!
      - speaker: Mas Ardi
        text: Besok pagi, Mohamed. Selamat pagi! Apa kabar?
        ar_eg: "بكرة الصبح يا محمد: «صباح الخير! إزيك؟»"
        ar: "غدًا صباحًا يا محمد: «صباح الخير! كيف حالك؟»"
        en: "Tomorrow morning, Mohamed: \"Good morning! How are you?\""
        note:
          ar_eg: "تحدي بكرة الصغير: أول ما تصحى قول «Selamat pagi! Apa kabar?» لحد من البيت، ولو رد عليك جاوبه بـ «Baik, terima kasih»."
          ar: "تحدّي الغد الصغير: قل «Selamat pagi! Apa kabar?» لأول شخص تراه صباحًا، وإن ردّ فأجبه «Baik, terima kasih»."
          en: "Tomorrow's tiny challenge: say \"Selamat pagi! Apa kabar?\" to the first person you see, and if they answer, reply \"Baik, terima kasih\"."
      - speaker: Mbak Gadis
        text: Ya! Selamat pagi! Apa kabar? Baik, terima kasih.
        ar_eg: أيوه! صباح الخير! إزيك؟ كويس، شكرًا.
        ar: نعم! صباح الخير! كيف حالك؟ بخير، شكرًا.
        en: Yes! Good morning! How are you? Fine, thank you.
      - speaker: Mas Ardi
        text: Selamat malam, Mohamed. Selamat malam, Gadis.
        ar_eg: تصبح على خير يا محمد. تصبحي على خير يا جاديس.
        ar: طابت ليلتك يا محمد. طابت ليلتكِ يا غاديس.
        en: Good night, Mohamed. Good night, Gadis.
      - speaker: Mbak Gadis
        text: Selamat malam! Sampai jumpa besok di Kabar Radio!
        ar_eg: تصبحوا على خير! أشوفكم بكرة في كبار راديو!
        ar: طابت ليلتكم! إلى اللقاء غدًا في كبار راديو!
        en: Good night! See you tomorrow on Kabar Radio!
