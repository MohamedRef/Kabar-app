schema: kabar.radio/v1
id: radio.bipa1.u01
language: id
level: bipa1
unit: bipa1.u01
title:
  target: Apa kabar, Kota Tua?
  ar_eg: إزيك يا كوتا توا؟
  ar: كيف حالك يا كوتا توا؟
  en: How are you, Kota Tua?
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Selamat pagi!
    lines:
      - speaker: Kak Tiara
        text: Selamat pagi! Selamat datang di Kabar Radio!
        ar_eg: صباح الخير! أهلًا بيك في كبار راديو!
        ar: صباح الخير! أهلًا بك في كبار راديو!
        en: Good morning! Welcome to Kabar Radio!
      - speaker: Kak Tiara
        text: Aku Tiara.
        ar_eg: أنا تيارا.
        ar: أنا تيارا.
        en: I'm Tiara.
      - speaker: Kak Reza
        text: Aku Reza. Pagi, Tiara!
        ar_eg: وأنا رضا. صباح الخير يا تيارا!
        ar: وأنا رضا. صباح الخير يا تيارا!
        en: And I'm Reza. Morning, Tiara!
      - speaker: Kak Tiara
        text: Pagi, Reza! Gimana kabarnya?
        ar_eg: صباح النور يا رضا! إزيك؟
        ar: صباح النور يا رضا! كيف حالك؟
        en: Morning, Reza! How's it going?
        note:
          ar_eg: بين الصحاب بيقولوا Gimana kabarnya? وgimana هي bagaimana بالكلام العادي. Apa kabar? صح برضه في كل مكان.
          ar: بين الأصدقاء يقولون Gimana kabarnya?، وgimana هي bagaimana في الكلام اليومي. وApa kabar? صحيحة في كل مكان.
          en: Friends say Gimana kabarnya? - gimana is spoken bagaimana. Apa kabar? works everywhere too.
      - speaker: Kak Reza
        text: Baik, makasih. Kamu gimana?
        ar_eg: كويس، شكرًا. وإنتي عاملة إيه؟
        ar: بخير، شكرًا. وأنتِ كيف حالك؟
        en: Good, thanks. How about you?
        note:
          ar_eg: makasih = terima kasih بس أخف، زي «ميرسي». وKamu gimana? = وإنت؟
          ar: makasih = terima kasih بصيغة الكلام السريع. وKamu gimana? = وأنت؟
          en: makasih is everyday terima kasih. Kamu gimana? = and you?
      - speaker: Kak Tiara
        text: Baik juga, makasih.
        ar_eg: كويسة أنا كمان، شكرًا.
        ar: بخير أيضًا، شكرًا.
        en: Fine too, thanks.
      - speaker: Kak Reza
        text: Kita di Jakarta. Kita di Kota Tua.
        ar_eg: إحنا في جاكرتا. إحنا في كوتا توا.
        ar: نحن في جاكرتا. نحن في كوتا توا.
        en: We're in Jakarta. We're in Kota Tua.
        note:
          ar_eg: كوتا توا هي البلد القديمة في جاكرتا، أول محطة في رحلتك.
          ar: كوتا توا هي المدينة القديمة في جاكرتا، أول محطة في رحلتك.
          en: Kota Tua is Jakarta's old town, the first stop on your journey.
      - speaker: Kak Tiara
        text: Ya, kita di Kota Tua, di Taman Fatahillah.
        ar_eg: أيوه، إحنا في كوتا توا، في ميدان فتح الله.
        ar: نعم، نحن في كوتا توا، في ساحة فتح الله.
        en: Yes, we're in Kota Tua, at Fatahillah Square.
      - speaker: Kak Reza
        text: Selamat pagi, selamat siang, selamat sore, selamat malam.
        ar_eg: صباح الخير، نهارك سعيد، مساء الخير، ليلة سعيدة.
        ar: صباح الخير، طاب نهارك، مساء الخير، طابت ليلتك.
        en: Good morning, good day, good afternoon, good evening.
        note:
          ar_eg: النهارده بنتكلم عن التحيات حسب وقت اليوم.
          ar: موضوعنا اليوم التحيات بحسب وقت اليوم.
          en: Today's topic is greetings by time of day.
      - speaker: Kak Tiara
        text: Apa kabar? Baik, terima kasih.
        ar_eg: إزيك؟ كويس، شكرًا.
        ar: كيف حالك؟ بخير، شكرًا.
        en: How are you? Fine, thank you.
      - speaker: Kak Reza
        text: Saya dan aku. Kamu dan Anda.
        ar_eg: «أنا» الرسمية و«أنا» العادية. «إنت» العادية و«حضرتك».
        ar: «أنا» المهذبة و«أنا» العامية، و«أنت» العامية و«حضرتك».
        en: Polite and casual "I". Casual "you" and formal "you".
      - speaker: Kak Reza
        text: 'Sama teman: aku, kamu. Sama Bapak, Ibu: saya, Anda.'
        ar_eg: 'مع صحابك: aku وkamu. مع الأكبر منك والناس الرسمية: saya وAnda.'
        ar: 'مع الأصدقاء: aku وkamu. مع الأكبر سنًا والرسميين: saya وAnda.'
        en: 'With friends: aku, kamu. With older people and officials: saya, Anda.'
        note:
          ar_eg: في الشارع sama معناها «مع». الصحاب بيتكلموا بـaku وkamu، وده اللي هتسمعه أكتر حاجة.
          ar: في الكلام sama تعني «مع». الأصدقاء يستعملون aku وkamu، وهذا أكثر ما ستسمعه.
          en: In speech sama means 'with'. Friends use aku and kamu, and that's what you'll hear most.
      - speaker: Kak Tiara
        text: Dia, kami, kita.
        ar_eg: هو أو هي، إحنا (من غيرك)، إحنا (وإنت معانا).
        ar: هو أو هي، نحن (دونك)، نحن (ومعنا أنت).
        en: He or she, we (not you), we (including you).
      - speaker: Kak Tiara
        text: Hai, Mohamed! Selamat datang di Kota Tua!
        ar_eg: أهلًا يا محمد! أهلًا بيك في كوتا توا!
        ar: مرحبًا يا محمد! أهلًا بك في كوتا توا!
        en: Hi, Mohamed! Welcome to Kota Tua!
      - speaker: Kak Reza
        text: Selamat datang, Mohamed! Selamat datang di Jakarta!
        ar_eg: أهلًا بيك يا محمد! أهلًا بيك في جاكرتا!
        ar: أهلًا بك يا محمد! أهلًا بك في جاكرتا!
        en: Welcome, Mohamed! Welcome to Jakarta!
  - kind: dialogue
    title: Bertemu di Taman Fatahillah
    lines:
      - speaker: Kak Reza
        text: Permisi. Maaf, Anda Tiara?
        ar_eg: لو سمحتي. آسف، حضرتك تيارا؟
        ar: عفوًا. المعذرة، هل أنتِ تيارا؟
        en: Excuse me. Sorry, are you Tiara?
        note:
          ar_eg: "الاتنين بيمثلوا مشهد: أول مقابلة بينهم في ميدان فتح الله. Anda رسمية لأنهم لسه ميعرفوش بعض."
          ar: "يمثّل المذيعان مشهدًا: أول لقاء بينهما في ساحة فتح الله. Anda رسمية لأنهما لم يتعارفا بعد."
          en: The hosts act out a scene, their first meeting at Fatahillah Square. Anda is formal because they're strangers.
      - speaker: Kak Tiara
        text: Ya, saya Tiara. Selamat pagi!
        ar_eg: أيوه، أنا تيارا. صباح الخير!
        ar: نعم، أنا تيارا. صباح الخير!
        en: Yes, I'm Tiara. Good morning!
      - speaker: Kak Reza
        text: Selamat pagi. Saya Reza. Salam kenal.
        ar_eg: صباح الخير. أنا رضا. اتشرفت بمعرفتك.
        ar: صباح الخير. أنا رضا. تشرّفت بمعرفتك.
        en: Good morning. I'm Reza. Nice to meet you.
      - speaker: Kak Tiara
        text: Salam kenal, Reza. Apa kabar?
        ar_eg: وأنا اتشرفت يا رضا. إزيك؟
        ar: تشرّفت بك يا رضا. كيف حالك؟
        en: Nice to meet you, Reza. How are you?
      - speaker: Kak Reza
        text: Kabar baik, terima kasih. Dan Anda?
        ar_eg: كويس، شكرًا. وحضرتك؟
        ar: بخير، شكرًا. وأنتِ؟
        en: I'm well, thank you. And you?
      - speaker: Kak Tiara
        text: Baik juga, terima kasih. Kamu di Jakarta?
        ar_eg: كويسة كمان، شكرًا. إنت في جاكرتا؟
        ar: بخير أيضًا، شكرًا. هل أنت في جاكرتا؟
        en: Fine too, thanks. Are you in Jakarta?
        note:
          ar_eg: تيارا غيّرت من Anda لـ kamu، يعني «خلّينا نتكلم عادي».
          ar: انتقلت تيارا من Anda إلى kamu، أي «لنتحدث ببساطة».
          en: Tiara switches from Anda to kamu, as if to say "let's be casual".
      - speaker: Kak Reza
        text: Ya, aku di Jakarta. Kamu juga?
        ar_eg: أيوه، أنا في جاكرتا. وإنتي كمان؟
        ar: نعم، أنا في جاكرتا. وأنتِ أيضًا؟
        en: Yes, I'm in Jakarta. You too?
      - speaker: Kak Tiara
        text: Ya, aku juga. Hai, Reza! Kita di Kota Tua!
        ar_eg: أيوه، أنا كمان. أهلًا يا رضا! إحنا في كوتا توا!
        ar: نعم، وأنا أيضًا. مرحبًا يا رضا! نحن في كوتا توا!
        en: Yes, me too. Hi, Reza! We're in Kota Tua!
      - speaker: Kak Reza
        text: Selamat datang di Kota Tua, Tiara!
        ar_eg: أهلًا بيكي في كوتا توا يا تيارا!
        ar: أهلًا بكِ في كوتا توا يا تيارا!
        en: Welcome to Kota Tua, Tiara!
      - speaker: Kak Tiara
        text: Terima kasih, Reza.
        ar_eg: شكرًا يا رضا.
        ar: شكرًا يا رضا.
        en: Thank you, Reza.
      - speaker: Kak Reza
        text: Sama-sama.
        ar_eg: العفو.
        ar: عفوًا.
        en: You're welcome.
      - speaker: Kak Tiara
        text: Selamat sore, Reza! Apa kabar?
        ar_eg: مساء الخير يا رضا! إزيك؟
        ar: مساء الخير يا رضا! كيف حالك؟
        en: Good afternoon, Reza! How are you?
        note:
          ar_eg: نفس اليوم، بس دلوقتي العصر، فبقت selamat sore.
          ar: اليوم نفسه، لكن الوقت الآن عصر، فصارت selamat sore.
          en: Same day, now it's late afternoon, so it's selamat sore.
      - speaker: Kak Reza
        text: Sore, Tiara! Aku kurang baik.
        ar_eg: مساء النور يا تيارا! أنا مش كويس أوي.
        ar: مساء النور يا تيارا! لستُ بخير تمامًا.
        en: Afternoon, Tiara! I'm not so good.
      - speaker: Kak Tiara
        text: Kurang baik? Kamu sehat?
        ar_eg: مش كويس أوي؟ إنت كويس صحيًا؟
        ar: لستَ بخير تمامًا؟ هل أنت بصحة جيدة؟
        en: Not so good? Are you well?
      - speaker: Kak Reza
        text: Ya, aku sehat. Terima kasih, Tiara.
        ar_eg: أيوه، صحتي كويسة. شكرًا يا تيارا.
        ar: نعم، أنا بصحة جيدة. شكرًا يا تيارا.
        en: Yes, I'm healthy. Thank you, Tiara.
      - speaker: Kak Tiara
        text: Sama-sama, Reza.
        ar_eg: العفو يا رضا.
        ar: عفوًا يا رضا.
        en: You're welcome, Reza.
      - speaker: Kak Reza
        text: Selamat malam, Tiara. Sampai jumpa besok!
        ar_eg: تصبحي على خير يا تيارا. أشوفك بكرة!
        ar: طابت ليلتك يا تيارا. إلى اللقاء غدًا!
        en: Good night, Tiara. See you tomorrow!
      - speaker: Kak Tiara
        text: Selamat jalan, Reza! Sampai jumpa besok!
        ar_eg: مع السلامة يا رضا! أشوفك بكرة!
        ar: في أمان الله يا رضا! إلى اللقاء غدًا!
        en: Go safely, Reza! See you tomorrow!
        note:
          ar_eg: تيارا قاعدة ورضا ماشي، فهي بتقول selamat jalan.
          ar: تيارا باقية ورضا راحل، لذلك تقول selamat jalan.
          en: Tiara is staying and Reza is leaving, so she says selamat jalan.
      - speaker: Kak Reza
        text: Selamat tinggal, Tiara!
        ar_eg: خليكي بالسلامة يا تيارا!
        ar: ابقَي بسلام يا تيارا!
        en: Stay well, Tiara!
      - speaker: Kak Tiara
        text: Asalamualaikum, Reza! Selamat pagi!
        ar_eg: السلام عليكم يا رضا! صباح الخير!
        ar: السلام عليكم يا رضا! صباح الخير!
        en: Peace be upon you, Reza! Good morning!
        note:
          ar_eg: تاني يوم الصبح. التحية الإسلامية منتشرة جدًا في إندونيسيا.
          ar: في صباح اليوم التالي. التحية الإسلامية شائعة جدًا في إندونيسيا.
          en: The next morning. The Muslim greeting is very common in Indonesia.
      - speaker: Kak Reza
        text: Waalaikumsalam, Tiara! Apa kabar?
        ar_eg: وعليكم السلام يا تيارا! إزيك؟
        ar: وعليكم السلام يا تيارا! كيف حالك؟
        en: And peace be upon you, Tiara! How are you?
      - speaker: Kak Tiara
        text: Baik-baik aja. Kamu?
        ar_eg: كله تمام. وإنت؟
        ar: كل شيء بخير. وأنت؟
        en: I'm fine. You?
        note:
          ar_eg: aja = saja، بس في الكلام. Baik-baik aja = تمام، مفيش حاجة.
          ar: aja = saja في الكلام اليومي. Baik-baik aja = كل شيء بخير.
          en: aja is spoken saja. Baik-baik aja = all good.
      - speaker: Kak Reza
        text: Baik! Aku sehat. Makasih, Tiara.
        ar_eg: كويس! أنا صحتي كويسة. شكرًا يا تيارا.
        ar: بخير! أنا بصحة جيدة. شكرًا يا تيارا.
        en: Good! I'm healthy. Thanks, Tiara.
      - speaker: Kak Tiara
        text: Reza, itu Rina, ya?
        ar_eg: يا رضا، دي رينا، صح؟
        ar: يا رضا، تلك رينا، أليس كذلك؟
        en: Reza, that's Rina, right?
      - speaker: Kak Reza
        text: Ya, dia Rina. Hai, Rina! Selamat pagi!
        ar_eg: أيوه، دي رينا. أهلًا يا رينا! صباح الخير!
        ar: نعم، هذه رينا. مرحبًا يا رينا! صباح الخير!
        en: Yes, that's Rina. Hi, Rina! Good morning!
      - speaker: Kak Tiara
        text: Hai, Rina! Aku Tiara. Salam kenal!
        ar_eg: أهلًا يا رينا! أنا تيارا. اتشرفت بيكي!
        ar: مرحبًا يا رينا! أنا تيارا. تشرّفت بكِ!
        en: Hi, Rina! I'm Tiara. Nice to meet you!
      - speaker: Kak Reza
        text: Kami di Kota Tua, Rina. Kita di Kota Tua!
        ar_eg: إحنا (أنا وتيارا) في كوتا توا يا رينا. إحنا كلنا في كوتا توا!
        ar: نحن (أنا وتيارا) في كوتا توا يا رينا. نحن جميعًا في كوتا توا!
        en: We (Tiara and I) are in Kota Tua, Rina. We're all in Kota Tua!
        note:
          ar_eg: kami = إحنا من غير اللي بتكلمه. kita = إحنا وإنت معانا.
          ar: kami = نحن دون المخاطَب. kita = نحن ومعنا المخاطَب.
          en: kami = we without the listener; kita = we including the listener.
  - kind: word_spotlight
    title: Selamat, kabar, salam
    lines:
      - speaker: Kak Tiara
        text: Selamat. Selamat.
        ar_eg: سلامة. سلامة.
        ar: سلامة. سلامة.
        en: Selamat. Selamat.
        note:
          ar_eg: "الجسر العربي: selamat جاية من «سلامة»."
          ar: "الجسر العربي: selamat من العربية «سلامة»."
          en: "Arabic Bridge: selamat comes from Arabic «سلامة» (safety)."
      - speaker: Kak Reza
        text: Selamat pagi. Selamat siang. Selamat sore. Selamat malam.
        ar_eg: صباح الخير. نهارك سعيد. مساء الخير. ليلة سعيدة.
        ar: صباح الخير. طاب نهارك. مساء الخير. طابت ليلتك.
        en: Good morning. Good day. Good afternoon. Good evening.
      - speaker: Kak Tiara
        text: Selamat datang di Jakarta!
        ar_eg: أهلًا بيك في جاكرتا!
        ar: أهلًا بك في جاكرتا!
        en: Welcome to Jakarta!
      - speaker: Kak Reza
        text: Kabar. Kabar.
        ar_eg: خبر. خبر.
        ar: خبر. خبر.
        en: Kabar. Kabar.
        note:
          ar_eg: "الجسر العربي: kabar جاية من «خبر». Apa kabar? حرفيًا «إيه الأخبار؟»."
          ar: "الجسر العربي: kabar من «خبر». Apa kabar? حرفيًا «ما الخبر؟»."
          en: "Arabic Bridge: kabar comes from «خبر» (news). Apa kabar? is literally \"what news?\"."
      - speaker: Kak Tiara
        text: Apa kabar? Kabar baik. Kabar baik, terima kasih.
        ar_eg: إيه الأخبار؟ أخبار كويسة. كويس، شكرًا.
        ar: ما الأخبار؟ أخبار طيبة. بخير، شكرًا.
        en: How are you? Good news. I'm well, thank you.
      - speaker: Kak Reza
        text: Kabar baik. Baik-baik saja. Kurang baik.
        ar_eg: كويس. كله تمام. مش كويس أوي.
        ar: بخير. كل شيء على ما يرام. لست بخير تمامًا.
        en: I'm well. All fine. Not so good.
      - speaker: Kak Tiara
        text: Apa kabar, Bu? Baik-baik saja, terima kasih.
        ar_eg: إزيك يا مدام؟ كله تمام، شكرًا.
        ar: كيف حالكِ يا سيدتي؟ كل شيء بخير، شكرًا.
        en: How are you, ma'am? All fine, thank you.
      - speaker: Kak Reza
        text: 'Sama teman: Gimana kabarnya? Baik-baik aja, makasih!'
        ar_eg: 'مع صاحبك: عامل إيه؟ تمام، ميرسي!'
        ar: 'مع صديقك: كيف الحال؟ كل شيء بخير، شكرًا!'
        en: "With a friend: How's it going? All good, thanks!"
        note:
          ar_eg: 'نفس الكلام بس على خفيف: gimana = bagaimana، aja = saja، makasih = terima kasih. مع الكبار قول Apa kabar وterima kasih.'
          ar: 'الكلام نفسه بصيغة يومية: gimana = bagaimana، aja = saja، makasih = terima kasih. ومع الكبار قل Apa kabar وterima kasih.'
          en: 'Same words, casual: gimana = bagaimana, aja = saja, makasih = terima kasih. With elders say Apa kabar and terima kasih.'
      - speaker: Kak Reza
        text: Salam kenal. Salam kenal.
        ar_eg: اتشرفنا. اتشرفنا.
        ar: تشرّفنا. تشرّفنا.
        en: Nice to meet you. Nice to meet you.
        note:
          ar_eg: "الجسر العربي: salam جاية من «سلام»."
          ar: "الجسر العربي: salam من «سلام»."
          en: "Arabic Bridge: salam comes from «سلام» (peace)."
      - speaker: Kak Tiara
        text: Salam kenal, saya Tiara.
        ar_eg: اتشرفت بمعرفتك، أنا تيارا.
        ar: تشرّفت بمعرفتك، أنا تيارا.
        en: Nice to meet you, I'm Tiara.
      - speaker: Kak Reza
        text: Salam kenal, saya Reza.
        ar_eg: اتشرفت بمعرفتك، أنا رضا.
        ar: تشرّفت بمعرفتك، أنا رضا.
        en: Nice to meet you, I'm Reza.
      - speaker: Kak Tiara
        text: Maaf. Maaf.
        ar_eg: آسف. آسف.
        ar: عفوًا. عفوًا.
        en: Sorry. Sorry.
        note:
          ar_eg: "الجسر العربي: maaf جاية من أصل «معافاة»، من جذر ع ف و زي «عفوًا»."
          ar: "الجسر العربي: maaf من «معافاة»، من الجذر ع ف و كما في «عفوًا»."
          en: "Arabic Bridge: maaf comes from «معافاة», root ع ف و, as in «عفوًا»."
      - speaker: Kak Reza
        text: Maaf, Pak! Maaf, Bu! Permisi, Bu. Maaf, Anda Ibu Yanti?
        ar_eg: آسف يا أستاذ! آسف يا مدام! لو سمحتي يا مدام. آسف، حضرتك مدام يانتي؟
        ar: عفوًا يا سيدي! عفوًا يا سيدتي! من فضلك يا سيدتي. المعذرة، هل أنتِ السيدة يانتي؟
