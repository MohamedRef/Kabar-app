schema: kabar.radio/v1
id: radio.bipa3.u09
language: id
level: bipa3
unit: bipa3.u09
title:
  target: Putri Mandalika
  ar_eg: الأميرة مانداليكا
  ar: الأميرة مانداليكا
  en: Princess Mandalika
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pantai Merah Muda
    lines:
      - {speaker: Kak Tiara, text: "Selamat sore dari Pantai Pink, di ujung timur Lombok! Ini Kabar Radio. Saya Tiara.", ar_eg: "مساء الخير من الشط البمبي، في آخر شرق لومبوك! ده كبار راديو. أنا تيارا.", ar: "مساء الخير من الشاطئ الوردي، في أقصى شرق لومبوك! هذا كبار راديو. أنا تيارا.", en: "Good afternoon from Pink Beach, at Lombok's eastern tip! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Pasirnya benar-benar merah muda, karena ada serpihan karang merah.", ar_eg: "أنا رضا. الرملة بمبي بجد، عشان فيها حتت مرجان أحمر.", ar: "أنا رضا. الرمل وردي حقًا، لأن فيه فُتات مرجان أحمر.", en: "I'm Reza. The sand really is pink, because of bits of red coral."}
      - {speaker: Kak Tiara, text: "Hari ini kita mendongeng. Ceritanya dari Lombok, tentang Putri Mandalika.", ar_eg: "النهارده هنحكي حدوتة. الحدوتة من لومبوك، عن الأميرة مانداليكا.", ar: "اليوم نروي حكاية من لومبوك، عن الأميرة مانداليكا.", en: "Today we tell a folk tale. It's from Lombok, about Princess Mandalika."}
      - {speaker: Kak Reza, text: "Kita juga belajar kata seperti berlari-larian dan berhari-hari.", ar_eg: "وكمان هنتعلم كلمات زي berlari-larian وberhari-hari.", ar: "ونتعلم أيضًا كلمات مثل berlari-larian وberhari-hari.", en: "We'll also learn words like berlari-larian and berhari-hari."}
      - {speaker: Kak Tiara, text: "Mohamed, dongeng apa yang kamu dengar waktu kecil?", ar_eg: "يا محمد، سمعت أنهي حدوتة وإنت صغير؟", ar: "يا محمد، أي حكاية سمعتها في طفولتك؟", en: "Mohamed, what folk tale did you hear as a child?"}
  - kind: dialogue
    title: Pada zaman dahulu
    lines:
      - {speaker: Kak Reza, text: "Pada zaman dahulu, di Lombok selatan, hiduplah seorang putri yang cantik dan baik hati. Namanya Putri Mandalika.", ar_eg: "كان يا ما كان، في جنوب لومبوك، كانت فيه أميرة جميلة وطيبة. اسمها الأميرة مانداليكا.", ar: "في قديم الزمان، في جنوب لومبوك، عاشت أميرة جميلة طيبة القلب اسمها مانداليكا.", en: "Long ago, in south Lombok, there lived a beautiful, kind-hearted princess named Mandalika."}
      - {speaker: Kak Tiara, text: "Banyak pangeran dari kerajaan lain ingin menikahinya.", ar_eg: "أمراء كتير من ممالك تانية كانوا عايزين يتجوزوها.", ar: "أراد أمراء كثيرون من ممالك أخرى أن يتزوجوها.", en: "Many princes from other kingdoms wanted to marry her."}
      - {speaker: Kak Reza, text: "Para pangeran berdatangan dan bertengkar. Mereka bahkan siap berperang.", ar_eg: "الأمراء جم ورا بعض واتخانقوا. وكانوا كمان مستعدين يحاربوا.", ar: "توافد الأمراء وتشاجروا، بل كانوا مستعدين للحرب.", en: "The princes came one after another and quarrelled. They were even ready for war."}
      - {speaker: Kak Tiara, text: "Putri Mandalika bersedih. Berhari-hari dia berpikir. Kalau dia memilih satu pangeran, rakyatnya akan menderita karena perang.", ar_eg: "الأميرة زعلت. فضلت تفكر أيام. لو اختارت أمير واحد، شعبها هيتعب من الحرب.", ar: "حزنت الأميرة، وظلت تفكر أيامًا. إن اختارت أميرًا واحدًا فسيعاني شعبها من الحرب.", en: "The princess grew sad. For days she thought. If she chose one prince, her people would suffer from war."}
      - {speaker: Kak Reza, text: "Akhirnya, dia mengundang semua pangeran ke pantai pada pagi hari.", ar_eg: "وفي الآخر، عزمت كل الأمراء على الشط الصبح.", ar: "وأخيرًا دعت جميع الأمراء إلى الشاطئ في الصباح.", en: "At last, she invited all the princes to the beach one morning."}
      - {speaker: Kak Tiara, text: "Dia berdiri di atas batu dan berkata: Aku tidak memilih siapa pun. Aku milik semua orang.", ar_eg: "وقفت على صخرة وقالت: أنا مش هختار حد. أنا ملك كل الناس.", ar: "وقفت على صخرة وقالت: لن أختار أحدًا، فأنا للجميع.", en: "She stood on a rock and said: I choose no one. I belong to everyone."}
      - {speaker: Kak Reza, text: "Lalu dia melompat ke laut. Semua orang mencarinya, tetapi dia tidak ditemukan.", ar_eg: "وبعدين نطت في البحر. كل الناس دوّرت عليها، بس ملقوهاش.", ar: "ثم قفزت إلى البحر. بحث عنها الجميع لكنهم لم يجدوها.", en: "Then she leapt into the sea. Everyone searched, but she was never found."}
      - speaker: Kak Tiara
        text: "Tidak lama kemudian, muncul banyak cacing laut berwarna-warni. Orang percaya, itulah Putri Mandalika."
        ar_eg: "بعد شوية، طلعت ديدان بحر كتير ملونة. والناس بتصدق إن دي الأميرة مانداليكا."
        ar: "وبعد قليل ظهرت ديدان بحرية كثيرة ملوّنة، ويعتقد الناس أنها الأميرة مانداليكا."
        en: "Soon after, many colourful sea worms appeared. People believe they are Princess Mandalika."
        note:
          ar_eg: "الديدان دي اسمها nyale. وكل سنة الناس بيطلعوا يصطادوها في احتفال Bau Nyale."
          ar: "تُسمّى هذه الديدان nyale، ويخرج الناس كل عام لصيدها في احتفال Bau Nyale."
          en: "The worms are called nyale; every year people catch them at the Bau Nyale festival."
      - {speaker: Kak Reza, text: "Sampai sekarang, setiap tahun orang berlari-larian di pantai untuk menangkap nyale.", ar_eg: "لحد النهارده، كل سنة الناس بيجروا هنا وهناك على الشط عشان يمسكوا الـnyale.", ar: "وحتى اليوم يركض الناس كل عام هنا وهناك على الشاطئ ليصطادوا الـnyale.", en: "To this day, every year people run about on the beach to catch nyale."}
      - {speaker: Kak Tiara, text: "Apa amanat cerita ini, Kak Reza?", ar_eg: "إيه العبرة من الحكاية دي يا رضا؟", ar: "ما مغزى هذه الحكاية يا رضا؟", en: "What's the moral of this story, Reza?"}
      - {speaker: Kak Reza, text: "Menurut saya, pemimpin yang baik memikirkan rakyatnya, bukan dirinya sendiri.", ar_eg: "في رأيي، القائد الكويس بيفكر في شعبه، مش في نفسه.", ar: "في رأيي، القائد الصالح يفكر في شعبه لا في نفسه.", en: "In my view, a good leader thinks of the people, not of herself."}
  - kind: word_spotlight
    title: Berlari-larian, berhari-hari
    lines:
      - speaker: Kak Tiara
        text: "Berlari-larian. Anak-anak berlari-larian di pantai. Banyak orang, ke sana kemari."
        ar_eg: "يجروا هنا وهناك. العيال بيجروا هنا وهناك على الشط. ناس كتير، رايحين جايين."
        ar: "يركضون هنا وهناك. يركض الأطفال على الشاطئ ذهابًا وإيابًا."
        en: "Running about. The children run about on the beach. Lots of people, this way and that."
        note:
          ar_eg: "ber- + تكرار + -an = حركة كتير في اتجاهات مختلفة أو ناس كتير مع بعض."
          ar: "ber- + تكرار + -an = حركة كثيرة في اتجاهات مختلفة أو جماعة معًا."
          en: "Ber- + doubled root + -an = lots of movement in all directions, or many people together."
      - {speaker: Kak Reza, text: "Berhari-hari, berbulan-bulan, bertahun-tahun. Dia berpikir berhari-hari.", ar_eg: "أيام وأيام، شهور، سنين. فضلت تفكر أيام.", ar: "أيامًا، شهورًا، سنوات. ظلت تفكر أيامًا.", en: "For days, for months, for years. She thought for days."}
      - {speaker: Kak Tiara, text: "Pada zaman dahulu, hiduplah seorang... Ini awal dongeng Indonesia.", ar_eg: "كان يا ما كان، كان فيه... ده أول الحواديت الإندونيسي.", ar: "في قديم الزمان، عاش... هكذا تبدأ الحكايات الإندونيسية.", en: "Long ago, there lived a... That's how Indonesian tales begin."}
      - {speaker: Kak Reza, text: "Tokoh, amanat, kerajaan, pangeran, putri, rakyat.", ar_eg: "شخصية، عبرة، مملكة، أمير، أميرة، شعب.", ar: "شخصية، مغزى، مملكة، أمير، أميرة، شعب.", en: "Character, moral, kingdom, prince, princess, the people."}
      - {speaker: Kak Tiara, text: "Kancil dan buaya, Juha dari Mesir. Dongeng hewan dan dongeng lucu juga ada.", ar_eg: "الغزال والتمساح، وجحا من مصر. فيه كمان حواديت حيوانات وحواديت تضحّك.", ar: "الغزال القزم والتمساح، وجحا من مصر. هناك أيضًا حكايات حيوانات وحكايات مضحكة.", en: "Kancil and the crocodile, Juha from Egypt. There are animal tales and funny tales too."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Pada zaman dahulu, hiduplah seorang putri."
        ar_eg: "كان يا ما كان، كانت فيه أميرة."
        ar: "في قديم الزمان، عاشت أميرة."
        en: "Long ago, there lived a princess."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Pada zaman dahulu, hiduplah seorang putri.", ar_eg: "كان يا ما كان، كانت فيه أميرة.", ar: "في قديم الزمان، عاشت أميرة.", en: "Long ago, there lived a princess."}
      - {speaker: Kak Tiara, text: "Para pangeran berdatangan dan bertengkar.", ar_eg: "الأمراء جم ورا بعض واتخانقوا.", ar: "توافد الأمراء وتشاجروا.", en: "The princes came one after another and quarrelled."}
      - {speaker: Kak Reza, text: "Para pangeran berdatangan dan bertengkar.", ar_eg: "الأمراء جم ورا بعض واتخانقوا.", ar: "توافد الأمراء وتشاجروا.", en: "The princes came one after another and quarrelled."}
      - {speaker: Kak Tiara, text: "Dia berpikir berhari-hari.", ar_eg: "فضلت تفكر أيام.", ar: "ظلت تفكر أيامًا.", en: "She thought for days."}
      - {speaker: Kak Reza, text: "Dia berpikir berhari-hari.", ar_eg: "فضلت تفكر أيام.", ar: "ظلت تفكر أيامًا.", en: "She thought for days."}
      - {speaker: Kak Tiara, text: "Orang-orang berlari-larian di pantai.", ar_eg: "الناس بيجروا هنا وهناك على الشط.", ar: "يركض الناس هنا وهناك على الشاطئ.", en: "People run about on the beach."}
      - {speaker: Kak Reza, text: "Orang-orang berlari-larian di pantai.", ar_eg: "الناس بيجروا هنا وهناك على الشط.", ar: "يركض الناس هنا وهناك على الشاطئ.", en: "People run about on the beach."}
  - kind: outro
    title: Dongeng Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan dongeng dari Mesir. Mulai dengan 'Pada zaman dahulu'."
        ar_eg: "يا محمد، احكيلنا حدوتة من مصر. ابدأ بـ«كان يا ما كان»."
        ar: "يا محمد، احكِ لنا حكاية من مصر. ابدأ بـ«في قديم الزمان»."
        en: "Mohamed, tell us a tale from Egypt. Start with 'Pada zaman dahulu'."
        note:
          ar_eg: "دورك! تلات جمل وعبرة."
          ar: "دورك! ثلاث جمل ومغزى."
          en: "Your turn! Three sentences and a moral."
      - {speaker: Kak Reza, text: "Contohnya: Pada zaman dahulu, hiduplah Juha dan keledainya. Orang-orang selalu mengkritiknya. Amanatnya: kita tidak bisa menyenangkan semua orang.", ar_eg: "مثلًا: كان يا ما كان، جحا وحماره. الناس كانت دايمًا بتنتقده. والعبرة: مش هتقدر ترضي كل الناس.", ar: "مثلًا: في قديم الزمان عاش جحا وحماره، وكان الناس ينتقدونه دائمًا. والمغزى: لا يمكن إرضاء الجميع.", en: "For example: Long ago lived Juha and his donkey. People always criticised him. The moral: we can't please everyone."}
      - {speaker: Kak Tiara, text: "Besok, ceritakan dongeng itu kepada temanmu dalam bahasa Indonesia.", ar_eg: "بكرة، احكي الحدوتة دي لصاحبك بالإندونيسي.", ar: "غدًا، احكِ تلك الحكاية لصديقك بالإندونيسية.", en: "Tomorrow, tell that tale to a friend in Indonesian."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Tidur yang nyenyak!", ar_eg: "شكرًا يا محمد. نوم الهنا!", ar: "شكرًا يا محمد. نومًا هانئًا!", en: "Thank you, Mohamed. Sleep well!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [pangeran, rakyat, amanat, berlari-larian, berhari-hari, berdatangan, nyale, bertahun-tahun, buaya, hiduplah, kancil, zaman]
