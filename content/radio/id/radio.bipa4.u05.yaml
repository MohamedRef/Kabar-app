schema: kabar.radio/v1
id: radio.bipa4.u05
language: id
level: bipa4
unit: bipa4.u05
title:
  target: Lomba tujuh belasan
  ar_eg: مسابقات ١٧ أغسطس
  ar: مسابقات السابع عشر من أغسطس
  en: The 17 August games
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Merah putih di Palopo
    lines:
      - {speaker: Kak Tiara, text: "Merdeka! Selamat pagi dari Palopo! Ini Kabar Radio. Aku Tiara.", ar_eg: "مرديكا (حرية)! صباح الخير من بالوبو! ده كبار راديو. أنا تيارا.", ar: "مرديكا (الحرية)! صباح الخير من بالوبو! هذا كبار راديو. أنا تيارا.", en: "Merdeka! Good morning from Palopo! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Hari ini tujuh belasan, Hari Kemerdekaan!", ar_eg: "أنا رضا. النهارده ١٧ أغسطس، عيد استقلال إندونيسيا.", ar: "أنا رضا. اليوم السابع عشر من أغسطس، يوم استقلال إندونيسيا.", en: "I'm Reza. Today is 17 August, Indonesia's Independence Day.", note: {ar_eg: "tujuh belasan = احتفالات ١٧ أغسطس، كده الناس بتسميها.", ar: "tujuh belasan = احتفالات ١٧ أغسطس، وهكذا يسمّيها الناس.", en: "tujuh belasan = the 17 August festivities, as everyone calls them."}}
      - speaker: Kak Tiara
        text: "Di tiap jalan ada bendera merah putih. Rumah-rumah dihiasin lampu sama umbul-umbul."
        ar_eg: "في كل شارع فيه علم أحمر وأبيض. والبيوت متزيّنة بأنوار ورايات."
        ar: "في كل شارع العلم الأحمر والأبيض، والبيوت مزيّنة بالأضواء والرايات."
        en: "Every street has the red-and-white flag. Houses are decorated with lights and banners."
        note:
          ar_eg: "إندونيسيا أعلنت استقلالها يوم ١٧ أغسطس ١٩٤٥. وعلمها أحمر فوق أبيض."
          ar: "أعلنت إندونيسيا استقلالها في 17 أغسطس 1945، وعلمها أحمر فوق أبيض."
          en: "Indonesia proclaimed independence on 17 August 1945. Its flag is red over white."
      - {speaker: Kak Reza, text: "Hari ini kita belajar cerita perayaan, kata kerja meN-...-i, sama metafora.", ar_eg: "النهارده هنتعلم نوصف احتفال، وأفعال meN-...-i، والاستعارة.", ar: "اليوم نتعلم وصف الاحتفالات، وأفعال meN-...-i، والاستعارة.", en: "Today we learn to describe a celebration, meN-...-i verbs and metaphors."}
      - {speaker: Kak Tiara, text: "Mohamed, orang Mesir ngerayain hari nasional gimana?", ar_eg: "يا محمد، المصريين بيحتفلوا بالأعياد القومية إزاي؟", ar: "يا محمد، كيف يحيي المصريون أعيادهم الوطنية؟", en: "Mohamed, how do Egyptians mark their national days?"}
  - kind: dialogue
    title: Di lapangan kampung
    lines:
      - {speaker: Kak Reza, text: "Tadi pagi semua warga ikut upacara bendera di lapangan.", ar_eg: "الصبح كل الأهالي حضروا تحية العلم في الملعب.", ar: "صباح اليوم شارك جميع السكان في مراسم رفع العلم في الساحة.", en: "This morning everyone attended the flag ceremony on the field."}
      - {speaker: Kak Tiara, text: "Habis itu, lombanya mulai! Ada balap karung, makan kerupuk, sama panjat pinang.", ar_eg: "بعد كده المسابقات بدأت! فيه سباق الشوال، وأكل الكروبوك، وتسلق عمود الزيت.", ar: "بعدها بدأت المسابقات: سباق الأكياس، وأكل الكروبوك، وتسلق العمود المدهون.", en: "After that, the games began! Sack races, cracker-eating and greased-pole climbing."}
      - speaker: Kak Reza
        text: "Aku ikut lomba makan kerupuk. Kerupuknya digantung pakai tali, tangan kita diiket di belakang."
        ar_eg: "أنا دخلت مسابقة أكل الكروبوك. الكروبوك متعلق بخيط، وإيدينا متربطة ورا."
        ar: "شاركت في مسابقة أكل الكروبوك. كان الكروبوك معلقًا بخيط، وأيدينا مربوطة خلف ظهورنا."
        en: "I entered the cracker-eating race. The crackers hang on a string, and our hands are tied behind us."
        note:
          ar_eg: "kerupuk رقايق مقرمشة، زي الشيبسي الكبير."
          ar: "kerupuk رقائق مقرمشة كبيرة."
          en: "Kerupuk are big crunchy crackers."
      - {speaker: Kak Tiara, text: "Menang, nggak?", ar_eg: "كسبت؟", ar: "هل فزت؟", en: "Did you win?"}
      - {speaker: Kak Reza, text: "Nggak! Aku kalah sama anak kecil. Dia kilat!", ar_eg: "لأ! عيل صغير غلبني. ده برق!", ar: "لا! هزمني طفل صغير. إنه برق!", en: "Nope! I lost to a little kid. He's lightning!"}
      - {speaker: Kak Tiara, text: "Ha ha. Yang paling rame panjat pinang. Batangnya diolesin oli biar licin.", ar_eg: "هههه. أكتر حاجة زحمة كانت تسلق العمود. العمود متدهن زيت عشان يبقى زلق.", ar: "هاها. أكثرها حماسة تسلّق العمود، فهو مدهون بالزيت ليصبح زلقًا.", en: "Ha ha. The liveliest was the pole climb. The pole is smeared with oil to make it slippery."}
      - {speaker: Kak Reza, text: "Di atas ada hadiah: sepeda, TV, beras. Lima orang kerja sama buat manjat.", ar_eg: "فوقه فيه جوايز: عجلة وتلفزيون ورز. خمس أشخاص بيتعاونوا عشان يطلعوه.", ar: "في أعلاه جوائز: دراجة وتلفاز وأرز. يتعاون خمسة أشخاص لتسلقه.", en: "At the top are prizes: a bike, a TV and rice. Five people work together to climb it."}
      - {speaker: Kak Tiara, text: "Itu simbol gotong royong. Kita menang kalau bareng-bareng.", ar_eg: "ده رمز التعاون. بنكسب لما نبقى مع بعض.", ar: "إنه رمز التعاون؛ ننتصر حين نكون معًا.", en: "That's a symbol of gotong royong. We win when we're together."}
      - {speaker: Kak Reza, text: "Nanti malam ada tirakatan. Warga kumpul, doa bareng, inget para pahlawan.", ar_eg: "الليلة فيه سهرة تيراكاتان. الأهالي بيتجمعوا ويدعوا ويفتكروا الأبطال.", ar: "الليلة سهرة التيراكاتان: يجتمع السكان ويدعون ويستذكرون الأبطال.", en: "Tonight there's a tirakatan evening. Residents gather, pray and remember the heroes."}
      - {speaker: Kak Tiara, text: "Reza, hari besar lain yang kamu suka apa?", ar_eg: "يا رضا، إيه عيد قومي تاني بتحبه؟", ar: "يا رضا، أي مناسبة وطنية أخرى تحبها؟", en: "Reza, what other national day do you like?"}
      - {speaker: Kak Reza, text: "Hari Kartini, 21 April. Kartini adalah pelita bagi perempuan Indonesia.", ar_eg: "يوم كارتيني، ٢١ أبريل. كارتيني كانت نور للستات الإندونيسيات.", ar: "يوم كارتيني، 21 أبريل. كانت كارتيني سراجًا للمرأة الإندونيسية.", en: "Kartini Day, 21 April. Kartini was a lamp for Indonesian women."}
      - {speaker: Kak Tiara, text: "Pelita! Itu metafora yang indah. Dia menerangi jalan pendidikan untuk perempuan.", ar_eg: "نور! دي استعارة حلوة. هي نوّرت طريق التعليم للستات.", ar: "سراج! استعارة جميلة؛ لقد أنارت طريق التعليم للنساء.", en: "A lamp! That's a beautiful metaphor. She lit the path of education for women."}
  - kind: word_spotlight
    title: Memperingati, menerangi
    lines:
      - {speaker: Kak Tiara, text: "Ingat, memperingati. Kita memperingati Hari Kemerdekaan setiap tahun.", ar_eg: "يفتكر، يحيي ذكرى. بنحتفل بعيد الاستقلال كل سنة.", ar: "يتذكر، يُحيي ذكرى. نحيي ذكرى الاستقلال كل عام.", en: "Remember, commemorate. We commemorate Independence Day every year."}
      - speaker: Kak Reza
        text: "Terang, menerangi. Olesi, ikuti, panjati. Lampu menerangi jalan."
        ar_eg: "منوّر، ينوّر. يدهن، يحضر، يتسلق. النور بينوّر الشارع."
        ar: "مضيء، يُنير. يدهن، يشارك، يتسلق. المصباح ينير الطريق."
        en: "Bright, light up. Smear, take part in, climb. The lamp lights up the road."
        note:
          ar_eg: "meN-...-i بتخلي الفعل يقع على مكان أو حاجة: terang ← menerangi (ينوّر حاجة)، panjat ← memanjati (يتسلق حاجة)."
          ar: "meN-...-i توقع الفعل على مكان أو شيء: terang ← menerangi، وpanjat ← memanjati."
          en: "MeN-...-i aims the action at a place or thing: terang → menerangi, panjat → memanjati."
      - {speaker: Kak Tiara, text: "Mengikuti upacara, mengalahkan lawan, menghiasi rumah.", ar_eg: "يحضر الاحتفال، يغلب المنافس، يزيّن البيت.", ar: "يشارك في المراسم، يهزم الخصم، يزيّن البيت.", en: "Attend the ceremony, beat an opponent, decorate the house."}
      - speaker: Kak Reza
        text: "Metafora: dia kilat, Kartini pelita, Jakarta hutan beton."
        ar_eg: "استعارة: هو برق، كارتيني نور، جاكرتا غابة خرسانة."
        ar: "استعارة: هو برق، كارتيني سراج، جاكرتا غابة من الخرسانة."
        en: "Metaphor: he's lightning, Kartini a lamp, Jakarta a concrete jungle."
        note:
          ar_eg: "الاستعارة من غير «زي»: Dia kilat (هو برق). والتشبيه بيبقى فيه seperti: Dia seperti kilat."
          ar: "الاستعارة بلا أداة: Dia kilat، والتشبيه بأداة: Dia seperti kilat."
          en: "A metaphor has no 'like': Dia kilat. A simile has seperti: Dia seperti kilat."
      - speaker: Kak Tiara
        text: "Di jalan orang juga bilang: Dia kilat banget! Rumahnya kapal pecah!"
        ar_eg: "في الشارع الناس بتقول برضه: ده برق! بيته مركب مكسورة!"
        ar: "في الشارع يقولون أيضًا: إنه برق! بيته سفينة محطمة!"
        en: "On the street people say: He's like lightning! His house is a shipwreck!"
        note:
          ar_eg: "Rumahnya kapal pecah = بيته مكركب خالص. استعارة بيقولوها كل يوم."
          ar: "Rumahnya kapal pecah = بيته فوضى تامة. استعارة تُقال كل يوم."
          en: "Rumahnya kapal pecah = his place is a total mess - an everyday metaphor."
      - {speaker: Kak Tiara, text: "Upacara bendera, lomba, panjat pinang, balap karung, tirakatan.", ar_eg: "تحية العلم، مسابقة، تسلق العمود، سباق الشوال، سهرة الذكرى.", ar: "مراسم العلم، مسابقة، تسلق العمود، سباق الأكياس، سهرة الذكرى.", en: "Flag ceremony, contest, pole climb, sack race, vigil."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Kita memperingati Hari Kemerdekaan setiap tahun."
        ar_eg: "بنحتفل بعيد الاستقلال كل سنة."
        ar: "نحيي ذكرى الاستقلال كل عام."
        en: "We commemorate Independence Day every year."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Kita memperingati Hari Kemerdekaan setiap tahun.", ar_eg: "بنحتفل بعيد الاستقلال كل سنة.", ar: "نحيي ذكرى الاستقلال كل عام.", en: "We commemorate Independence Day every year."}
      - {speaker: Kak Tiara, text: "Rumah-rumah dihiasi bendera merah putih.", ar_eg: "البيوت متزيّنة بالعلم الأحمر والأبيض.", ar: "البيوت مزيّنة بالعلم الأحمر والأبيض.", en: "The houses are decorated with red-and-white flags."}
      - {speaker: Kak Reza, text: "Rumah-rumah dihiasi bendera merah putih.", ar_eg: "البيوت متزيّنة بالعلم الأحمر والأبيض.", ar: "البيوت مزيّنة بالعلم الأحمر والأبيض.", en: "The houses are decorated with red-and-white flags."}
      - {speaker: Kak Tiara, text: "Seorang anak kecil mengalahkan saya.", ar_eg: "عيل صغير غلبني.", ar: "هزمني طفل صغير.", en: "A little kid beat me."}
      - {speaker: Kak Reza, text: "Seorang anak kecil mengalahkan saya.", ar_eg: "عيل صغير غلبني.", ar: "هزمني طفل صغير.", en: "A little kid beat me."}
      - {speaker: Kak Tiara, text: "Kartini adalah pelita bagi perempuan Indonesia.", ar_eg: "كارتيني نور للستات الإندونيسيات.", ar: "كارتيني سراج للمرأة الإندونيسية.", en: "Kartini is a lamp for Indonesian women."}
      - {speaker: Kak Reza, text: "Kartini adalah pelita bagi perempuan Indonesia.", ar_eg: "كارتيني نور للستات الإندونيسيات.", ar: "كارتيني سراج للمرأة الإندونيسية.", en: "Kartini is a lamp for Indonesian women."}
  - kind: outro
    title: Hari besar Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, gambarkan perayaan hari nasional di Mesir. Pakai satu kata kerja meN-...-i dan satu metafora."
        ar_eg: "يا محمد، اوصف الاحتفال بعيد قومي في مصر. استخدم فعل meN-...-i واستعارة."
        ar: "يا محمد، صِف الاحتفال بيوم وطني في مصر، بفعل على meN-...-i واستعارة."
        en: "Mohamed, describe a national celebration in Egypt. Use one meN-...-i verb and one metaphor."
        note:
          ar_eg: "دورك! تلات جمل."
          ar: "دورك! ثلاث جمل."
          en: "Your turn! Three sentences."
      - {speaker: Kak Reza, text: "Contohnya: Pada 6 Oktober, kami memperingati kemenangan tahun 1973. Lampu-lampu menerangi Sungai Nil. Malam itu, Kairo lautan cahaya.", ar_eg: "مثلًا: يوم ٦ أكتوبر بنحتفل بنصر ٧٣. الأنوار بتنوّر النيل. والليلة دي القاهرة بحر نور.", ar: "مثلًا: في السادس من أكتوبر نحيي ذكرى نصر 1973، والأضواء تنير النيل، وتصير القاهرة تلك الليلة بحرًا من النور.", en: "For example: On 6 October we commemorate the 1973 victory. Lights illuminate the Nile. That night, Cairo is a sea of light."}
      - {speaker: Kak Tiara, text: "Bagus banget! Besok, tulis undangan buat lomba di kampungmu.", ar_eg: "جميل أوي! بكرة، اكتب دعوة لمسابقة في حتتك.", ar: "جميل جدًا! غدًا اكتب دعوة لمسابقة في حيّك.", en: "Beautiful! Tomorrow, write an invitation to a contest in your neighbourhood."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Merdeka!", ar_eg: "شكرًا يا محمد. مرديكا!", ar: "شكرًا يا محمد. مرديكا!", en: "Thank you, Mohamed. Merdeka!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [kemerdekaan, memperingati, upacara bendera, panjat pinang, balap karung, Merah Putih]
