schema: kabar.radio/v1
id: radio.bipa4.u03
language: id
level: bipa4
unit: bipa4.u03
title:
  target: Atap seperti perahu
  ar_eg: سقف زي المركب
  ar: سقف كالقارب
  en: A roof like a boat
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Kabut di Rantepao
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Rantepao, Tana Toraja! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من رانتيباو، في تانا توراجا! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من رانتيباو، في تانا توراجا! هذا كبار راديو. أنا تيارا.", en: "Good morning from Rantepao, Tana Toraja! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Pagi ini kabutnya tebal sekali, seperti kapas putih di atas sawah.", ar_eg: "أنا رضا. الشبورة الصبح ده تقيلة أوي، زي القطن الأبيض فوق الغيطان.", ar: "أنا رضا. الضباب كثيف جدًا هذا الصباح، كالقطن الأبيض فوق حقول الأرز.", en: "I'm Reza. The mist is so thick this morning, like white cotton over the rice fields."}
      - speaker: Kak Tiara
        text: "Hari ini kita mengunjungi tempat bersejarah. Rumah adat Toraja disebut tongkonan."
        ar_eg: "النهارده هنزور مكان تاريخي. البيت التقليدي في توراجا اسمه تونجكونان."
        ar: "اليوم نزور مكانًا تاريخيًا. يُسمّى البيت التقليدي في توراجا تونغكونان."
        en: "Today we visit a historic place. The Toraja traditional house is called a tongkonan."
      - {speaker: Kak Reza, text: "Kita juga belajar majas, yaitu perumpamaan dan hiperbola, dan kata kerja seperti membelikan.", ar_eg: "وكمان هنتعلم التشبيه والمبالغة، وأفعال زي membelikan.", ar: "ونتعلم أيضًا الصور البلاغية، أي التشبيه والمبالغة، وأفعالًا مثل membelikan.", en: "We'll also learn figures of speech, simile and hyperbole, and verbs like membelikan."}
      - {speaker: Kak Tiara, text: "Mohamed, tempat bersejarah apa di Mesir yang paling kamu sukai?", ar_eg: "يا محمد، أكتر مكان تاريخي بتحبه في مصر إيه؟", ar: "يا محمد، أي مكان تاريخي في مصر تحبه أكثر؟", en: "Mohamed, which historic place in Egypt do you like best?"}
  - kind: dialogue
    title: Pemandu di Ke'te' Kesu'
    lines:
      - speaker: Kak Reza
        text: "Saya jadi pemandu di desa Ke'te' Kesu', ya. Kak Tiara turisnya."
        ar_eg: "أنا هبقى المرشد في قرية كيتي كيسو. وتيارا السايحة."
        ar: "سأكون المرشد في قرية كيتي كيسو، وتيارا السائحة."
        en: "I'll be the guide in Ke'te' Kesu' village. Tiara is the tourist."
        note:
          ar_eg: "مشهد تمثيلي. Ke'te' Kesu' قرية توراجا قديمة مشهورة ببيوت التونجكونان."
          ar: "مشهد تمثيلي. Ke'te' Kesu' قرية تورجية قديمة تشتهر ببيوت التونغكونان."
          en: "A role-play. Ke'te' Kesu' is an old Toraja village known for its tongkonan."
      - {speaker: Kak Reza, text: "Selamat datang. Lihat atap tongkonan ini. Bentuknya melengkung seperti perahu.", ar_eg: "أهلًا بيكي. بصي على سقف التونجكونان ده. شكله مقوّس زي المركب.", ar: "أهلًا بك. انظري إلى سقف هذا التونغكونان، إنه مقوّس كالقارب.", en: "Welcome. Look at this tongkonan's roof. It curves like a boat."}
      - {speaker: Kak Tiara, text: "Kenapa seperti perahu?", ar_eg: "ليه زي المركب؟", ar: "لماذا كالقارب؟", en: "Why like a boat?"}
      - {speaker: Kak Reza, text: "Menurut cerita, nenek moyang orang Toraja datang dengan perahu dari utara.", ar_eg: "بيقولوا إن أجداد التوراجا جم بالمراكب من الشمال.", ar: "تقول الرواية إن أجداد التوراجا جاؤوا بالقوارب من الشمال.", en: "The story goes that the Toraja ancestors came by boat from the north."}
      - {speaker: Kak Tiara, text: "Tanduk kerbau di depan rumah itu banyak sekali!", ar_eg: "قرون الجاموس اللي قدام البيت ده كتير أوي!", ar: "قرون الجاموس أمام ذلك البيت كثيرة جدًا!", en: "There are so many buffalo horns on the front of that house!"}
      - {speaker: Kak Reza, text: "Tanduk itu dari upacara pemakaman, Rambu Solo'. Makin banyak tanduk, makin tinggi status keluarga.", ar_eg: "القرون دي من طقوس الجنازة، رامبو سولو. كل ما القرون تكتر، كل ما مكانة العيلة تعلى.", ar: "هذه القرون من مراسم الجنازة، رامبو سولو. كلما زادت القرون علت مكانة العائلة.", en: "Those horns are from funeral ceremonies, Rambu Solo'. The more horns, the higher the family's status."}
      - speaker: Kak Tiara
        text: "Saya dengar, harga kerbau belang di sini selangit."
        ar_eg: "سمعت إن سعر الجاموس المنقّط هنا في السما."
        ar: "سمعت أن سعر الجاموس المرقّط هنا يناطح السماء."
        en: "I've heard that a spotted buffalo here costs the earth."
        note:
          ar_eg: "selangit = «قد السما»: مبالغة (hiperbola) زي «سعره نار» عندنا."
          ar: "selangit = «بحجم السماء»: مبالغة، كقولنا «سعره نار»."
          en: "Selangit = 'sky-high': a hyperbole, like Egyptian «سعره نار»."
      - {speaker: Kak Reza, text: "Betul. Harganya bisa sama dengan harga mobil! Upacaranya juga bisa berhari-hari.", ar_eg: "مظبوط. سعره ممكن يبقى قد سعر عربية! والطقوس كمان ممكن تاخد أيام.", ar: "صحيح. قد يعادل سعره سعر سيارة! وقد تمتد المراسم أيامًا.", en: "True. It can cost as much as a car! The ceremony can last for days too."}
      - {speaker: Kak Tiara, text: "Bisakah Bapak menceritakan sejarah desa ini?", ar_eg: "ممكن تحكيلنا تاريخ القرية دي؟", ar: "هل يمكنك أن تحكي لنا تاريخ هذه القرية؟", en: "Could you tell us the history of this village?"}
      - {speaker: Kak Reza, text: "Desa ini sudah ada ratusan tahun. Sekarang tongkonan ini dirawat oleh keluarga yang sama.", ar_eg: "القرية دي موجودة من مئات السنين. ودلوقتي نفس العيلة بتراعي التونجكونان.", ar: "هذه القرية قائمة منذ مئات السنين، وما زالت العائلة نفسها ترعى هذا التونغكونان.", en: "The village is centuries old. Today this tongkonan is cared for by the same family."}
      - {speaker: Kak Tiara, text: "Saya mau membelikan ibu saya kain tenun Toraja. Di mana saya bisa membelinya?", ar_eg: "عايزة أشتري لماما قماش منسوج من توراجا. أشتريه منين؟", ar: "أريد أن أشتري لأمي قماشًا منسوجًا من توراجا. أين أشتريه؟", en: "I'd like to buy my mother some Toraja woven cloth. Where can I buy it?"}
      - {speaker: Kak Reza, text: "Di ujung desa ada pengrajin. Mereka bisa membuatkan Ibu kain dengan motif khusus.", ar_eg: "في آخر القرية فيه صنايعية. يقدروا يعملولك قماش بنقشة مخصوص.", ar: "في طرف القرية حرفيون يمكنهم أن يصنعوا لك قماشًا بنقش خاص.", en: "At the end of the village there are craftspeople. They can make you cloth with a special pattern."}
  - kind: word_spotlight
    title: Membelikan, seperti perahu
    lines:
      - speaker: Kak Tiara
        text: "Membeli, membelikan. Saya membelikan ibu saya kain. Saya membeli kain untuk ibu saya."
        ar_eg: "يشتري، يشتري لحد. اشتريت لماما قماش. اشتريت قماش عشان ماما."
        ar: "يشتري، يشتري لأحد. اشتريت لأمي قماشًا. اشتريت قماشًا من أجل أمي."
        en: "Buy, buy for someone. I bought my mother cloth. I bought cloth for my mother."
        note:
          ar_eg: "meN-...-kan هنا معناها «يعمل الحاجة عشان حد»: membuatkan = يعمل لحد."
          ar: "meN-...-kan هنا تعني «يفعل الشيء لأجل أحد»: membuatkan = يصنع لأحد."
          en: "Here meN-...-kan means 'do it for someone': membuatkan = make for someone."
      - {speaker: Kak Reza, text: "Membuatkan, mengambilkan, menceritakan. Tolong ambilkan saya air.", ar_eg: "يعمل لـ، يجيب لـ، يحكي. لو سمحت هاتلي مية.", ar: "يصنع لـ، يجلب لـ، يحكي. أحضر لي ماءً من فضلك.", en: "Make for, fetch for, tell. Please fetch me some water."}
      - {speaker: Kak Tiara, text: "Perumpamaan: seperti, bagaikan, laksana. Kabutnya seperti kapas.", ar_eg: "التشبيه: زي، كأنه، مثل. الشبورة زي القطن.", ar: "التشبيه: مثل، كأنّ، كـ. الضباب كالقطن.", en: "Simile: like, as if, as. The mist is like cotton."}
      - {speaker: Kak Reza, text: "Hiperbola: harganya selangit, menangis darah, seribu kali. Saya sudah seribu kali ke sini!", ar_eg: "المبالغة: سعره في السما، يعيط دم، ألف مرة. أنا جيت هنا ألف مرة!", ar: "المبالغة: سعره يناطح السماء، يبكي دمًا، ألف مرة. جئت إلى هنا ألف مرة!", en: "Hyperbole: sky-high price, weep blood, a thousand times. I've been here a thousand times!"}
      - {speaker: Kak Tiara, text: "Bersejarah, warisan budaya, rumah adat, upacara, pemakaman.", ar_eg: "تاريخي، تراث ثقافي، بيت تقليدي، طقوس، دفن.", ar: "تاريخي، تراث ثقافي، بيت تقليدي، مراسم، جنازة.", en: "Historic, cultural heritage, traditional house, ceremony, funeral."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Atapnya melengkung seperti perahu."
        ar_eg: "السقف مقوّس زي المركب."
        ar: "السقف مقوّس كالقارب."
        en: "The roof curves like a boat."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Atapnya melengkung seperti perahu.", ar_eg: "السقف مقوّس زي المركب.", ar: "السقف مقوّس كالقارب.", en: "The roof curves like a boat."}
      - {speaker: Kak Tiara, text: "Harga kerbau belang selangit.", ar_eg: "سعر الجاموس المنقّط في السما.", ar: "سعر الجاموس المرقّط يناطح السماء.", en: "A spotted buffalo costs the earth."}
      - {speaker: Kak Reza, text: "Harga kerbau belang selangit.", ar_eg: "سعر الجاموس المنقّط في السما.", ar: "سعر الجاموس المرقّط يناطح السماء.", en: "A spotted buffalo costs the earth."}
      - {speaker: Kak Tiara, text: "Bisakah Bapak menceritakan sejarah desa ini?", ar_eg: "ممكن تحكيلنا تاريخ القرية دي؟", ar: "هل يمكنك أن تحكي تاريخ هذه القرية؟", en: "Could you tell us the history of this village?"}
      - {speaker: Kak Reza, text: "Bisakah Bapak menceritakan sejarah desa ini?", ar_eg: "ممكن تحكيلنا تاريخ القرية دي؟", ar: "هل يمكنك أن تحكي تاريخ هذه القرية؟", en: "Could you tell us the history of this village?"}
      - {speaker: Kak Tiara, text: "Saya mau membelikan ibu saya kain tenun.", ar_eg: "عايز أشتري لماما قماش منسوج.", ar: "أريد أن أشتري لأمي قماشًا منسوجًا.", en: "I want to buy my mother some woven cloth."}
      - {speaker: Kak Reza, text: "Saya mau membelikan ibu saya kain tenun.", ar_eg: "عايز أشتري لماما قماش منسوج.", ar: "أريد أن أشتري لأمي قماشًا منسوجًا.", en: "I want to buy my mother some woven cloth."}
  - kind: outro
    title: Tempat bersejarah Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, gambarkan tempat bersejarah di Mesir. Pakai satu perumpamaan dan satu hiperbola."
        ar_eg: "يا محمد، اوصف مكان تاريخي في مصر. استخدم تشبيه ومبالغة."
        ar: "يا محمد، صِف مكانًا تاريخيًا في مصر، بتشبيه ومبالغة."
        en: "Mohamed, describe a historic place in Egypt. Use one simile and one hyperbole."
        note:
          ar_eg: "دورك! تلات جمل."
          ar: "دورك! ثلاث جمل."
          en: "Your turn! Three sentences."
      - {speaker: Kak Reza, text: "Contohnya: Piramida Giza berdiri seperti gunung emas di padang pasir. Umurnya ribuan tahun. Turisnya sejuta orang setiap hari!", ar_eg: "مثلًا: أهرامات الجيزة واقفة زي جبال دهب في الصحرا. عمرها آلاف السنين. والسياح مليون كل يوم!", ar: "مثلًا: تقف أهرامات الجيزة كجبال من ذهب في الصحراء. عمرها آلاف السنين، وسياحها مليون كل يوم!", en: "For example: The Giza pyramids stand like golden mountains in the desert. They're thousands of years old. A million tourists every day!"}
      - {speaker: Kak Tiara, text: "Ha ha, sejuta itu hiperbola, ya! Besok, tulis brosur pendek tentang tempat itu.", ar_eg: "هههه، المليون دي مبالغة طبعًا! بكرة، اكتب بروشور صغير عن المكان ده.", ar: "هاها، المليون مبالغة طبعًا! غدًا اكتب نشرة قصيرة عن ذلك المكان.", en: "Ha ha, a million is a hyperbole, of course! Tomorrow, write a short brochure about that place."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Sampai jumpa!", ar_eg: "شكرًا يا محمد. سلام!", ar: "شكرًا يا محمد. إلى اللقاء!", en: "Thank you, Mohamed. Bye!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [tongkonan, bersejarah, rumah adat, upacara, Rambu Solo', membelikan, membuatkan, menceritakan, seperti, bagaikan, selangit, perumpamaan, hiperbola]
