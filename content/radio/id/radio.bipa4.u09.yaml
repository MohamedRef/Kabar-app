schema: kabar.radio/v1
id: radio.bipa4.u09
language: id
level: bipa4
unit: bipa4.u09
title:
  target: Laut Bunaken, siapa yang menjaga?
  ar_eg: بحر بوناكن، مين اللي بيحميه؟
  ar: بحر بوناكن، من يحميه؟
  en: Bunaken's sea, who protects it?
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Di atas perahu kaca
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Taman Laut Bunaken! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من محمية بوناكن البحرية! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من متنزه بوناكن البحري! هذا كبار راديو. أنا تيارا.", en: "Good morning from Bunaken Marine Park! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Kami naik perahu berlantai kaca. Di bawah kami ada terumbu karang dan ikan berwarna-warni.", ar_eg: "أنا رضا. راكبين مركب أرضيته إزاز. تحتينا شعاب مرجانية وسمك ملوّن.", ar: "أنا رضا. نركب قاربًا أرضيته زجاجية، وتحتنا شعاب مرجانية وأسماك ملوّنة.", en: "I'm Reza. We're on a glass-bottomed boat. Below us are coral reefs and colourful fish."}
      - speaker: Kak Tiara
        text: "Taman laut ini dibiayai sebagian oleh tiket masuk dari penyelam."
        ar_eg: "المحمية دي جزء من تمويلها جاي من تذاكر الغطاسين."
        ar: "يُموَّل هذا المتنزه البحري جزئيًا من رسوم دخول الغواصين."
        en: "This marine park is funded partly by divers' entry fees."
      - {speaker: Kak Reza, text: "Hari ini kita membahas kebijakan lingkungan dan belajar memberi pendapat yang seimbang.", ar_eg: "النهارده هنناقش السياسات البيئية ونتعلم ندي رأي متوازن.", ar: "اليوم نناقش السياسات البيئية ونتعلم إبداء رأي متوازن.", en: "Today we discuss environmental policy and learn to give a balanced opinion."}
      - {speaker: Kak Tiara, text: "Mohamed, apakah di kotamu kantong plastik dilarang?", ar_eg: "يا محمد، الأكياس البلاستيك ممنوعة في مدينتك؟", ar: "يا محمد، هل الأكياس البلاستيكية ممنوعة في مدينتك؟", en: "Mohamed, are plastic bags banned in your city?"}
  - kind: dialogue
    title: Menimbang untung-rugi
    lines:
      - {speaker: Kak Reza, text: "Beberapa kota di Indonesia sudah melarang kantong plastik di supermarket. Di Manado, banyak orang juga membicarakannya.", ar_eg: "كذا مدينة في إندونيسيا منعت الأكياس البلاستيك في السوبرماركت. وفي مانادو ناس كتير بتتكلم عن ده.", ar: "منعت عدة مدن إندونيسية الأكياس البلاستيكية في المتاجر الكبرى، ويتحدث عن ذلك كثيرون في مانادو.", en: "Several Indonesian cities have banned plastic bags in supermarkets. In Manado, lots of people are talking about it too."}
      - {speaker: Kak Tiara, text: "Menurut saya, larangan itu perlu. Plastik dari darat terbawa sungai sampai ke laut Bunaken.", ar_eg: "في رأيي المنع ده ضروري. البلاستيك من البر بيوصل بالنهر لحد بحر بوناكن.", ar: "في رأيي، المنع ضروري، فبلاستيك اليابسة تحمله الأنهار حتى بحر بوناكن.", en: "In my view, the ban is necessary. Plastic from land is carried by rivers all the way to Bunaken's sea."}
      - {speaker: Kak Reza, text: "Saya setuju dengan tujuannya. Namun, kita juga harus menimbang dampaknya bagi pedagang kecil.", ar_eg: "موافق على الهدف. بس لازم كمان نوزن تأثيره على التجار الصغيرين.", ar: "أوافق على الهدف، لكن علينا أن نزن أثره على صغار التجار.", en: "I agree with the aim. However, we must also weigh its impact on small traders."}
      - {speaker: Kak Tiara, text: "Maksudnya bagaimana?", ar_eg: "قصدك إيه؟", ar: "ماذا تقصد؟", en: "What do you mean?"}
      - {speaker: Kak Reza, text: "Pedagang di pasar tradisional belum punya pengganti yang murah. Kalau dilarang tiba-tiba, mereka bisa rugi.", ar_eg: "تجار الأسواق الشعبية لسه معندهمش بديل رخيص. لو اتمنع فجأة، ممكن يخسروا.", ar: "تجار الأسواق الشعبية لا يملكون بديلًا رخيصًا بعد، وإن مُنع فجأة فقد يخسرون.", en: "Traditional market traders don't have a cheap alternative yet. If it's banned suddenly, they could lose out."}
      - {speaker: Kak Tiara, text: "Itu masuk akal. Jadi, larangannya bertahap. Pertama di supermarket, lalu di pasar.", ar_eg: "ده منطقي. يبقى المنع يكون على مراحل. الأول في السوبرماركت، وبعدين في السوق.", ar: "هذا معقول. إذن يكون المنع تدريجيًا: أولًا في المتاجر الكبرى ثم في الأسواق.", en: "That makes sense. So the ban should be gradual. First supermarkets, then markets."}
      - {speaker: Kak Reza, text: "Dan pemerintah bisa membantu pedagang mendapat tas kertas atau tas kain dengan harga murah.", ar_eg: "والحكومة ممكن تساعد التجار ياخدوا شنط ورق أو قماش بسعر رخيص.", ar: "ويمكن للحكومة مساعدة التجار في الحصول على أكياس ورقية أو قماشية بسعر زهيد.", en: "And the government could help traders get paper or cloth bags cheaply."}
      - {speaker: Kak Tiara, text: "Bagaimana dengan suhu laut? Saya membaca laporan bahwa karang memutih ketika air terlalu panas.", ar_eg: "وإيه الأخبار في حرارة البحر؟ قريت تقرير إن المرجان بيبيضّ لما المية تسخن أوي.", ar: "وماذا عن حرارة البحر؟ قرأت تقريرًا يفيد بأن المرجان يبيضّ حين تسخن المياه كثيرًا.", en: "What about sea temperature? I read a report that coral bleaches when the water gets too warm."}
      - {speaker: Kak Reza, text: "Betul. Itu masalah global. Satu kota tidak bisa menyelesaikannya sendiri, tetapi setiap langkah kecil tetap berarti.", ar_eg: "مظبوط. دي مشكلة عالمية. مدينة واحدة متقدرش تحلها لوحدها، بس كل خطوة صغيرة ليها معنى.", ar: "صحيح. إنها مشكلة عالمية لا تحلّها مدينة وحدها، لكن كل خطوة صغيرة لها قيمتها.", en: "Right. That's a global problem. One city can't solve it alone, but every small step still counts."}
      - {speaker: Kak Tiara, text: "Jadi kesimpulannya: larangan plastik bermanfaat, asalkan dilaksanakan dengan adil.", ar_eg: "يبقى الخلاصة: منع البلاستيك مفيد، بشرط يتنفذ بعدل.", ar: "فالخلاصة: منع البلاستيك مفيد، شريطة أن يُطبّق بعدل.", en: "So the conclusion: a plastic ban is beneficial, provided it's carried out fairly."}
      - {speaker: Kak Reza, text: "Setuju. Wah, lihat! Ada penyu di bawah perahu!", ar_eg: "موافق. الله، بص! فيه سلحفاة تحت المركب!", ar: "موافق. انظري! سلحفاة تحت القارب!", en: "Agreed. Oh, look! There's a turtle under the boat!"}
  - kind: word_spotlight
    title: Namun, asalkan, menimbang
    lines:
      - {speaker: Kak Tiara, text: "Namun, akan tetapi. Saya setuju. Namun, ada masalahnya.", ar_eg: "بس، إلا إن. أنا موافقة. بس فيه مشكلة.", ar: "غير أنّ، لكنّ. أوافق، غير أن هناك مشكلة.", en: "However, but. I agree. However, there's a problem."}
      - speaker: Kak Reza
        text: "Asalkan, dengan syarat. Saya setuju, asalkan adil."
        ar_eg: "بشرط، على شرط. أنا موافق، بشرط يبقى عادل."
        ar: "شريطة، بشرط. أوافق شريطة أن يكون عادلًا."
        en: "Provided, on condition. I agree, provided it's fair."
        note:
          ar_eg: "الرأي المتوازن: موافقة + namun + مشكلة + asalkan + حل."
          ar: "الرأي المتوازن: موافقة + namun + مشكلة + asalkan + حل."
          en: "A balanced view: agree + namun + problem + asalkan + solution."
      - {speaker: Kak Tiara, text: "Menimbang untung-rugi, menimbang dampak. Kita harus menimbang semua pihak.", ar_eg: "يوزن المكسب والخسارة، يوزن التأثير. لازم نوزن كل الأطراف.", ar: "يزن الربح والخسارة، يزن الأثر. علينا أن نزن مصالح جميع الأطراف.", en: "Weigh pros and cons, weigh the impact. We must weigh every side."}
      - {speaker: Kak Reza, text: "Larangan, kebijakan, bertahap, pengganti, dilaksanakan.", ar_eg: "منع، سياسة، على مراحل، بديل، يتنفذ.", ar: "حظر، سياسة، تدريجي، بديل، يُطبَّق.", en: "Ban, policy, gradual, substitute, implemented."}
      - {speaker: Kak Tiara, text: "Terumbu karang, pemutihan karang, suhu laut, taman laut, penyelam.", ar_eg: "شعاب مرجانية، ابيضاض المرجان، حرارة البحر، محمية بحرية، غطاسين.", ar: "شعاب مرجانية، ابيضاض المرجان، حرارة البحر، متنزه بحري، غواصون.", en: "Coral reef, coral bleaching, sea temperature, marine park, divers."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Saya setuju dengan tujuannya. Namun, ada masalahnya."
        ar_eg: "موافقة على الهدف. بس فيه مشكلة."
        ar: "أوافق على الهدف، غير أن هناك مشكلة."
        en: "I agree with the aim. However, there's a problem."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Saya setuju dengan tujuannya. Namun, ada masalahnya.", ar_eg: "موافق على الهدف. بس فيه مشكلة.", ar: "أوافق على الهدف، غير أن هناك مشكلة.", en: "I agree with the aim. However, there's a problem."}
      - {speaker: Kak Tiara, text: "Kita harus menimbang dampaknya.", ar_eg: "لازم نوزن تأثيره.", ar: "علينا أن نزن أثره.", en: "We must weigh its impact."}
      - {speaker: Kak Reza, text: "Kita harus menimbang dampaknya.", ar_eg: "لازم نوزن تأثيره.", ar: "علينا أن نزن أثره.", en: "We must weigh its impact."}
      - {speaker: Kak Tiara, text: "Larangannya sebaiknya bertahap.", ar_eg: "الأحسن المنع يبقى على مراحل.", ar: "الأفضل أن يكون المنع تدريجيًا.", en: "The ban had better be gradual."}
      - {speaker: Kak Reza, text: "Larangannya sebaiknya bertahap.", ar_eg: "الأحسن المنع يبقى على مراحل.", ar: "الأفضل أن يكون المنع تدريجيًا.", en: "The ban had better be gradual."}
      - {speaker: Kak Tiara, text: "Larangan ini bermanfaat, asalkan adil.", ar_eg: "المنع ده مفيد، بشرط يبقى عادل.", ar: "هذا المنع مفيد، شريطة أن يكون عادلًا.", en: "This ban is beneficial, provided it's fair."}
      - {speaker: Kak Reza, text: "Larangan ini bermanfaat, asalkan adil.", ar_eg: "المنع ده مفيد، بشرط يبقى عادل.", ar: "هذا المنع مفيد، شريطة أن يكون عادلًا.", en: "This ban is beneficial, provided it's fair."}
  - kind: outro
    title: Opini Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, berikan opini yang seimbang tentang satu kebijakan lingkungan. Pakai 'namun' dan 'asalkan'."
        ar_eg: "يا محمد، قول رأي متوازن عن سياسة بيئية. استخدم namun وasalkan."
        ar: "يا محمد، أبدِ رأيًا متوازنًا في سياسة بيئية، مستعملًا namun وasalkan."
        en: "Mohamed, give a balanced opinion on one environmental policy. Use 'namun' and 'asalkan'."
        note:
          ar_eg: "دورك! تلات جمل."
          ar: "دورك! ثلاث جمل."
          en: "Your turn! Three sentences."
      - {speaker: Kak Reza, text: "Contohnya: Saya setuju dengan pajak untuk botol plastik. Namun, harga air bisa naik. Pajak itu baik, asalkan air minum di tempat umum gratis.", ar_eg: "مثلًا: أنا موافق على ضريبة على الإزايز البلاستيك. بس سعر المية ممكن يزيد. الضريبة كويسة، بشرط مية الشرب في الأماكن العامة تبقى ببلاش.", ar: "مثلًا: أوافق على ضريبة الزجاجات البلاستيكية، غير أن سعر الماء قد يرتفع. الضريبة جيدة شريطة أن تكون مياه الشرب في الأماكن العامة مجانية.", en: "For example: I agree with a tax on plastic bottles. However, water prices could rise. The tax is good, provided drinking water in public places is free."}
      - {speaker: Kak Tiara, text: "Besok, tulis eksposisi tentang kebijakan itu dalam satu paragraf.", ar_eg: "بكرة، اكتب نص شرح عن السياسة دي في فقرة واحدة.", ar: "غدًا، اكتب نصًا تفسيريًا عن تلك السياسة في فقرة واحدة.", en: "Tomorrow, write an exposition about that policy in one paragraph."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Jaga laut kita!", ar_eg: "شكرًا يا محمد. حافظ على بحرنا!", ar: "شكرًا يا محمد. احموا بحارنا!", en: "Thank you, Mohamed. Look after our seas!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [kebijakan, larangan, untung-rugi, terumbu karang, taman laut, penyelam, suhu]
