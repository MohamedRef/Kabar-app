schema: kabar.radio/v1
id: radio.bipa5.u10
language: id
level: bipa5
unit: bipa5.u10
title:
  target: Lima menit di depan kelas
  ar_eg: خمس دقايق قدام الفصل
  ar: خمس دقائق أمام الجمهور
  en: Five minutes at the front
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Lampion Singkawang
    lines:
      - {speaker: Kak Tiara, text: "Selamat malam dari Singkawang! Ini Kabar Radio. Aku Tiara.", ar_eg: "مساء الخير من سينجكاوانج! ده كبار راديو. أنا تيارا.", ar: "مساء الخير من سينغكاوانغ! هذا كبار راديو. أنا تيارا.", en: "Good evening from Singkawang! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Kota ini penuh lampion merah. Orang Tionghoa, Dayak, sama Melayu hidup bareng di sini.", ar_eg: "أنا رضا. المدينة دي مليانة فوانيس حمرا. الصينيين والداياك والملايو عايشين جنب بعض هنا.", ar: "أنا رضا. المدينة مليئة بالفوانيس الحمراء، ويعيش فيها الصينيون والداياك والملايو جنبًا إلى جنب.", en: "I'm Reza. This city is full of red lanterns. Chinese, Dayak and Malay people live side by side here."}
      - {speaker: Kak Tiara, text: "Ini episode terakhir kita di Kalimantan. Jadi, Mohamed mau presentasi!", ar_eg: "دي آخر حلقة لينا في كاليمانتان. عشان كده، محمد هيعمل عرض تقديمي!", ar: "هذه آخر حلقاتنا في كاليمانتان، ولذلك سيقدّم محمد عرضًا!", en: "This is our last episode in Kalimantan. So Mohamed will give a presentation!"}
      - speaker: Kak Reza
        text: "Hari ini kita belajar struktur presentasi sama cara jelasin data."
        ar_eg: "النهارده هنتعلم ترتيب العرض التقديمي وإزاي نوصف البيانات."
        ar: "اليوم نتعلم بنية العرض التقديمي وكيفية وصف البيانات."
        en: "Today we learn presentation structure and how to describe data."
      - {speaker: Kak Tiara, text: "Mohamed, suka presentasi, nggak?", ar_eg: "يا محمد، بتحب تعمل عروض تقديمية؟", ar: "يا محمد، هل تحب تقديم العروض؟", en: "Mohamed, do you like presenting?"}
  - kind: dialogue
    title: Presentasi Kak Reza
    lines:
      - speaker: Kak Tiara
        text: "Reza kasih contoh presentasi soal perjalanan kita di Kalimantan. Dengerin strukturnya."
        ar_eg: "رضا هيدينا مثال عرض عن رحلتنا في كاليمانتان. اسمع الترتيب."
        ar: "يقدم رضا مثالًا لعرض عن رحلتنا في كاليمانتان. انتبه إلى البنية."
        en: "Reza gives a sample presentation about our Kalimantan trip. Listen to the structure."
        note:
          ar_eg: "العرض نفسه رسمي: hadirin وsaya. والهزار بعده عادي."
          ar: "العرض نفسه رسمي: hadirin وsaya، والمزاح بعده بالعامية."
          en: "The presentation itself is formal: hadirin, saya. The banter afterwards isn't."
      - {speaker: Kak Reza, text: "Selamat malam, hadirin. Terima kasih atas kesempatan ini.", ar_eg: "مساء الخير يا حضرات. شكرًا على الفرصة دي.", ar: "مساء الخير أيها الحضور، وشكرًا على هذه الفرصة.", en: "Good evening, everyone. Thank you for this opportunity."}
      - {speaker: Kak Reza, text: "Presentasi saya terdiri dari tiga bagian: rute, temuan, dan kesimpulan.", ar_eg: "العرض بتاعي فيه تلات أجزاء: الطريق، اللي لقيناه، والخلاصة.", ar: "يتكون عرضي من ثلاثة أجزاء: المسار، والنتائج، والخلاصة.", en: "My presentation has three parts: the route, the findings, and the conclusion."}
      - {speaker: Kak Reza, text: "Pertama, rute. Kami mengunjungi sepuluh kota, dari Balikpapan sampai Singkawang.", ar_eg: "أولًا، الطريق. زرنا عشر مدن، من باليكبابان لحد سينجكاوانج.", ar: "أولًا، المسار: زرنا عشر مدن من باليكبابان حتى سينغكاوانغ.", en: "First, the route. We visited ten towns, from Balikpapan to Singkawang."}
      - {speaker: Kak Reza, text: "Silakan lihat grafik ini. Sumbu tegak menunjukkan jumlah kata baru yang Mohamed pelajari.", ar_eg: "اتفضلوا بصّوا على الرسم ده. المحور الرأسي بيورّي عدد الكلمات الجديدة اللي محمد اتعلمها.", ar: "انظروا إلى هذا الرسم البياني؛ يُظهر المحور الرأسي عدد الكلمات الجديدة التي تعلمها محمد.", en: "Please look at this chart. The vertical axis shows how many new words Mohamed learned."}
      - {speaker: Kak Reza, text: "Jumlahnya naik tajam di minggu ketiga, lalu stabil. Puncaknya di Banjarmasin, karena banyak kata makanan!", ar_eg: "العدد طلع جامد في الأسبوع التالت، وبعدين ثبت. وأعلى نقطة كانت في بانجارماسين، عشان كلمات الأكل كتير!", ar: "ارتفع العدد بحدة في الأسبوع الثالث ثم استقر، وبلغ ذروته في بنجرماسين بسبب كثرة كلمات الطعام!", en: "The number rose sharply in week three, then levelled off. It peaked in Banjarmasin, thanks to all the food words!"}
      - {speaker: Kak Reza, text: "Kedua, temuan. Kalimantan bukan hanya hutan, tetapi juga kota, seni, dan teknologi.", ar_eg: "تانيًا، اللي لقيناه. كاليمانتان مش غابات بس، دي كمان مدن وفن وتكنولوجيا.", ar: "ثانيًا، النتائج: كاليمانتان ليست غابات فحسب، بل مدن وفنون وتقنية أيضًا.", en: "Second, findings. Kalimantan isn't just forest, it's also cities, art and technology."}
      - {speaker: Kak Reza, text: "Sebagai kesimpulan, perjalanan ini mengajarkan bahwa keberagaman adalah kekuatan.", ar_eg: "وفي الخلاصة، الرحلة دي علمتنا إن التنوع قوة.", ar: "وختامًا، علّمتنا هذه الرحلة أن التنوع قوة.", en: "In conclusion, this trip taught us that diversity is strength."}
      - {speaker: Kak Reza, text: "Sekian dari saya. Apakah ada pertanyaan?", ar_eg: "ده كل اللي عندي. فيه أسئلة؟", ar: "هذا كل ما لديّ. هل من أسئلة؟", en: "That's all from me. Are there any questions?"}
      - {speaker: Kak Tiara, text: "Ada! Kok Pontianak nggak ada di grafik? Haha, becanda. Rapi banget presentasinya!", ar_eg: "أيوه! ليه بونتياناك مش في الرسم؟ هاها، بهزر. عرض متظبط!", ar: "نعم! لماذا لا تظهر بونتياناك في الرسم؟ أمزح. عرض منظّم!", en: "Yes! Why isn't Pontianak on the chart? Haha, joking. A tidy presentation!", note: {ar_eg: "becanda = bercanda في الكلام.", ar: "becanda = bercanda في الكلام اليومي.", en: "becanda = spoken bercanda."}}
  - kind: word_spotlight
    title: Bahasa presentasi
    lines:
      - speaker: Kak Tiara
        text: "Pembuka: Terima kasih atas kesempatan ini. Presentasi saya terdiri dari…"
        ar_eg: "الافتتاح: شكرًا على الفرصة دي. العرض بتاعي فيه…"
        ar: "الافتتاح: شكرًا على هذه الفرصة. يتكون عرضي من…"
        en: "Opening: Thank you for this opportunity. My presentation consists of…"
        note:
          ar_eg: "الجمل دي ثابتة؛ احفظها زي ما هي."
          ar: "هذه عبارات جاهزة؛ احفظها كما هي."
          en: "These are set phrases; learn them as chunks."
      - {speaker: Kak Reza, text: "Peralihan: Pertama…, kedua…, selanjutnya…, sebagai kesimpulan…", ar_eg: "الانتقال: أولًا…، تانيًا…، بعد كده…، وفي الخلاصة…", ar: "الانتقال: أولًا…، ثانيًا…، بعد ذلك…، وختامًا…", en: "Transitions: First…, second…, next…, in conclusion…"}
      - {speaker: Kak Tiara, text: "Data: naik tajam, turun sedikit, stabil, mencapai puncak, sumbu tegak, sumbu datar.", ar_eg: "البيانات: طلع جامد، نزل شوية، ثابت، وصل للقمة، المحور الرأسي، المحور الأفقي.", ar: "البيانات: ارتفع بحدة، انخفض قليلًا، استقر، بلغ الذروة، المحور الرأسي، المحور الأفقي.", en: "Data: rose sharply, fell slightly, levelled off, peaked, vertical axis, horizontal axis."}
      - {speaker: Kak Reza, text: "Penutup: Sekian dari saya. Apakah ada pertanyaan?", ar_eg: "الختام: ده كل اللي عندي. فيه أسئلة؟", ar: "الختام: هذا كل ما لديّ. هل من أسئلة؟", en: "Closing: That's all from me. Any questions?"}
      - {speaker: Kak Tiara, text: "Habis presentasi, sama teman: Gimana tadi? Lancar, kan? Deg-degan banget aku!", ar_eg: "بعد العرض، مع صاحبك: إيه رأيك؟ ماشي كويس، صح؟ كنت متوتر أوي!", ar: "بعد العرض، مع صديقك: ما رأيك؟ سار جيدًا، صحيح؟ كنت متوترًا جدًا!", en: "After the talk, to a friend: How was it? Smooth, right? I was so nervous!"}
      - {speaker: Kak Tiara, text: "Cap Go Meh, lampion, keberagaman, toleransi, berdampingan.", ar_eg: "تشاب جو مي (آخر يوم في رأس السنة الصينية)، فوانيس، تنوع، تسامح، جنب بعض.", ar: "تشاب غو مي (ختام رأس السنة الصينية)، فوانيس، تنوع، تسامح، جنبًا إلى جنب.", en: "Cap Go Meh, lanterns, diversity, tolerance, side by side."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Presentasi saya terdiri dari tiga bagian."
        ar_eg: "العرض بتاعي فيه تلات أجزاء."
        ar: "يتكون عرضي من ثلاثة أجزاء."
        en: "My presentation has three parts."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Presentasi saya terdiri dari tiga bagian.", ar_eg: "العرض بتاعي فيه تلات أجزاء.", ar: "يتكون عرضي من ثلاثة أجزاء.", en: "My presentation has three parts."}
      - {speaker: Kak Tiara, text: "Jumlahnya naik tajam, lalu stabil.", ar_eg: "العدد طلع جامد، وبعدين ثبت.", ar: "ارتفع العدد بحدة ثم استقر.", en: "The number rose sharply, then levelled off."}
      - {speaker: Kak Reza, text: "Jumlahnya naik tajam, lalu stabil.", ar_eg: "العدد طلع جامد، وبعدين ثبت.", ar: "ارتفع العدد بحدة ثم استقر.", en: "The number rose sharply, then levelled off."}
      - {speaker: Kak Tiara, text: "Sebagai kesimpulan, keberagaman adalah kekuatan.", ar_eg: "وفي الخلاصة، التنوع قوة.", ar: "وختامًا، التنوع قوة.", en: "In conclusion, diversity is strength."}
      - {speaker: Kak Reza, text: "Sebagai kesimpulan, keberagaman adalah kekuatan.", ar_eg: "وفي الخلاصة، التنوع قوة.", ar: "وختامًا، التنوع قوة.", en: "In conclusion, diversity is strength."}
      - {speaker: Kak Tiara, text: "Sekian dari saya. Apakah ada pertanyaan?", ar_eg: "ده كل اللي عندي. فيه أسئلة؟", ar: "هذا كل ما لديّ. هل من أسئلة؟", en: "That's all from me. Any questions?"}
      - {speaker: Kak Reza, text: "Sekian dari saya. Apakah ada pertanyaan?", ar_eg: "ده كل اللي عندي. فيه أسئلة؟", ar: "هذا كل ما لديّ. هل من أسئلة؟", en: "That's all from me. Any questions?"}
  - kind: outro
    title: Presentasi Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, sekarang giliranmu. Presentasi satu menit: tiga hal yang kamu pelajari di Kalimantan."
        ar_eg: "يا محمد، دلوقتي دورك. عرض دقيقة: تلات حاجات اتعلمتها في كاليمانتان."
        ar: "يا محمد، حان دورك: عرض لدقيقة واحدة عن ثلاثة أشياء تعلمتها في كاليمانتان."
        en: "Mohamed, now it's your turn. A one-minute presentation: three things you learned in Kalimantan."
        note:
          ar_eg: "دورك! قولها بصوت عالي وبثقة."
          ar: "دورك! قلها بصوت مسموع وبثقة."
          en: "Your turn! Say it out loud, with confidence."
      - {speaker: Kak Reza, text: "Ingat strukturnya: pembuka, tiga poin, kesimpulan, pertanyaan.", ar_eg: "افتكر الترتيب: افتتاح، تلات نقط، خلاصة، أسئلة.", ar: "تذكّر البنية: افتتاح، ثلاث نقاط، خلاصة، أسئلة.", en: "Remember the structure: opening, three points, conclusion, questions."}
      - {speaker: Kak Tiara, text: "Besok, tulis laporan perjalanan satu halaman soal Kalimantan.", ar_eg: "بكرة، اكتب تقرير رحلة صفحة واحدة عن كاليمانتان.", ar: "غدًا، اكتب تقرير رحلة من صفحة واحدة عن كاليمانتان.", en: "Tomorrow, write a one-page travel report about Kalimantan."}
      - {speaker: Kak Reza, text: "Makasih, Kalimantan! Makasih, Mohamed! Sampai ketemu di Sumatra.", ar_eg: "شكرًا يا كاليمانتان! شكرًا يا محمد! نتقابل في سومطرة.", ar: "شكرًا يا كاليمانتان! شكرًا يا محمد! نلتقي في سومطرة.", en: "Thank you, Kalimantan! Thank you, Mohamed! See you in Sumatra."}
      - {speaker: Kak Tiara, text: "Sampai ketemu di Kabar Radio!", ar_eg: "أشوفكم في كبار راديو!", ar: "إلى اللقاء في كبار راديو!", en: "See you on Kabar Radio!"}
words: [presentasi, pertama, selanjutnya, grafik, keberagaman, lampion, jumlah, laporan, pertanyaan, toleransi]
review:
  status: draft
  verified: false
  notes: |
    Spot-check: Singkawang's Chinese-Dayak-Malay mix and Cap Go Meh parade. The chart
    and word counts in Reza's talk are invented for the role-play.
