title:
  target: Ekonomi dari warung ke dunia
  ar_eg: الاقتصاد من الكشك للعالم
  ar: الاقتصاد من الدكان إلى العالم
  en: The economy, from stall to world
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Pasar di Jayapura
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Jayapura, di Teluk Humboldt! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من جايابورا، على خليج هومبولت! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من جايابورا على خليج هومبولت! هذا كبار راديو. أنا تيارا.", en: "Good morning from Jayapura, on Humboldt Bay! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Tadi saya membeli pinang dan sagu di pasar, lalu membayar dengan memindai kode QR.", ar_eg: "أنا رضا. اشتريت من شوية جوز التنبول وساجو من السوق، ودفعت بإني عملت سكان لكود QR.", ar: "أنا رضا. اشتريت قبل قليل جوز الأريكا والساغو من السوق، ودفعت بمسح رمز QR.", en: "I'm Reza. I just bought betel nut and sago at the market, then paid by scanning a QR code."}
      - {speaker: Kak Tiara, text: "Itulah QRIS, standar kode QR nasional. Bahkan pedagang kecil memakainya.", ar_eg: "ده QRIS، كود QR الموحد على مستوى الدولة. وحتى البياعين الصغيرين بيستعملوه.", ar: "هذا QRIS، المعيار الوطني لرموز QR، ويستخدمه حتى صغار التجار.", en: "That's QRIS, the national QR standard. Even small traders use it."}
      - speaker: Kak Reza
        text: "Hari ini kita menjelaskan tren ekonomi dan belajar konjungsi antarkalimat agar paragraf padu."
        ar_eg: "النهارده هنشرح اتجاهات الاقتصاد ونتعلم أدوات الربط بين الجمل عشان الفقرة تبقى مترابطة."
        ar: "اليوم نشرح الاتجاهات الاقتصادية ونتعلم أدوات الربط بين الجمل لتتماسك الفقرة."
        en: "Today we explain economic trends and learn sentence connectors for a coherent paragraph."
      - {speaker: Kak Tiara, text: "Mohamed, di Kairo kamu bayar pakai uang tunai atau ponsel?", ar_eg: "يا محمد، في القاهرة بتدفع كاش ولا بالموبايل؟", ar: "يا محمد، في القاهرة تدفع نقدًا أم بالهاتف؟", en: "Mohamed, in Cairo do you pay cash or by phone?"}
  - kind: dialogue
    title: Wawancara pengusaha
    lines:
      - speaker: Kak Tiara
        text: "Kak Reza memerankan Mama Rosa, pengusaha UMKM rumput laut. Saya mewawancarainya."
        ar_eg: "رضا هيمثّل دور ماما روزا، صاحبة مشروع صغير للطحالب البحرية. وأنا هعمل معاها مقابلة."
        ar: "يؤدي رضا دور «ماما روزا»، صاحبة مشروع صغير للأعشاب البحرية، وأنا أحاورها."
        en: "Reza plays Mama Rosa, who runs a small seaweed business. I interview her."
        note:
          ar_eg: "شخصية تمثيلية. Mama في بابوا لقب احترام للست الكبيرة."
          ar: "شخصية تمثيلية. Mama في بابوا لقب احترام للمرأة الكبيرة."
          en: "A role-play figure. In Papua, Mama is a respectful title for an older woman."
      - {speaker: Kak Tiara, text: "Mama, bagaimana usaha rumput laut Mama dimulai?", ar_eg: "يا ماما، مشروع الطحالب بتاعك بدأ إزاي؟", ar: "يا ماما، كيف بدأ مشروع الأعشاب البحرية؟", en: "Mama, how did your seaweed business start?"}
      - {speaker: Kak Reza, text: "Awalnya saya hanya menjual di pasar. Selain itu, saya juga membuat keripik dari rumput laut.", ar_eg: "في الأول كنت ببيع في السوق بس. وغير كده، كنت بعمل كمان شيبسي من الطحالب.", ar: "في البداية كنت أبيع في السوق فقط، وكنت أصنع أيضًا رقائق من الأعشاب البحرية.", en: "At first I only sold at the market. Besides that, I also made seaweed crisps."}
      - {speaker: Kak Reza, text: "Kemudian, saya bergabung dengan koperasi. Oleh karena itu, saya bisa mendapat pinjaman modal.", ar_eg: "بعدين، دخلت جمعية تعاونية. وعشان كده، قدرت آخد قرض رأس مال.", ar: "ثم انضممت إلى تعاونية، ولذلك حصلت على قرض لرأس المال.", en: "Then I joined a cooperative. Because of that, I could get a start-up loan."}
      - {speaker: Kak Tiara, text: "Apakah penjualannya meningkat?", ar_eg: "المبيعات زادت؟", ar: "هل ازدادت المبيعات؟", en: "Did sales go up?"}
      - {speaker: Kak Reza, text: "Ya. Akan tetapi, harga bahan bakar naik tahun lalu. Akibatnya, biaya pengiriman juga naik.", ar_eg: "أيوه. بس أسعار الوقود زادت السنة اللي فاتت. والنتيجة، تكلفة الشحن كمان زادت.", ar: "نعم. غير أن أسعار الوقود ارتفعت العام الماضي، فارتفعت تكلفة الشحن أيضًا.", en: "Yes. However, fuel prices rose last year. As a result, shipping costs rose too."}
      - {speaker: Kak Tiara, text: "Itu inflasi yang dirasakan langsung oleh pengusaha kecil.", ar_eg: "ده التضخم اللي أصحاب المشاريع الصغيرة بيحسوه على طول.", ar: "هذا هو التضخم الذي يلمسه صغار المنتجين مباشرة.", en: "That's inflation felt directly by small businesses."}
      - {speaker: Kak Reza, text: "Betul. Meskipun demikian, sekarang pembeli bisa membayar dengan QRIS. Dengan begitu, transaksi lebih cepat.", ar_eg: "صح. ومع كده، دلوقتي المشترين يقدروا يدفعوا بـQRIS. وبكده، المعاملات بقت أسرع.", ar: "صحيح. ومع ذلك صار المشترون يدفعون عبر QRIS، فأصبحت المعاملات أسرع.", en: "Right. Even so, buyers can now pay with QRIS. That way, transactions are faster."}
      - {speaker: Kak Tiara, text: "Apa rencana Mama berikutnya?", ar_eg: "إيه خطتك الجاية يا ماما؟", ar: "ما خطتك التالية يا ماما؟", en: "What's your next plan, Mama?"}
      - {speaker: Kak Reza, text: "Saya ingin menjual keripik ke Jakarta. Pada akhirnya, saya ingin mempekerjakan lebih banyak mama di kampung.", ar_eg: "عايزة أبيع الشيبسي في جاكرتا. وفي الآخر، عايزة أشغّل ستات أكتر من القرية.", ar: "أريد بيع الرقائق في جاكرتا، وأريد في النهاية توظيف مزيد من نساء القرية.", en: "I want to sell the crisps in Jakarta. In the end, I want to employ more mamas from the village."}
  - kind: word_spotlight
    title: Konjungsi antarkalimat
    lines:
      - speaker: Kak Tiara
        text: "Konjungsi antarkalimat ada di awal kalimat: Selain itu. Oleh karena itu. Akan tetapi. Akibatnya."
        ar_eg: "أدوات الربط بين الجمل بتيجي في أول الجملة: غير كده. عشان كده. بس. والنتيجة."
        ar: "أدوات الربط بين الجمل تأتي في صدرها: فضلًا عن ذلك. لذلك. غير أن. نتيجةً لذلك."
        en: "Sentence connectors open the sentence: Besides that. Therefore. However. As a result."
        note:
          ar_eg: "بعدها فاصلة دايمًا."
          ar: "تليها فاصلة دائمًا."
          en: "Always followed by a comma."
      - {speaker: Kak Reza, text: "Meskipun demikian, dengan begitu, pada akhirnya, sebaliknya.", ar_eg: "ومع كده، وبكده، وفي الآخر، وبالعكس.", ar: "ومع ذلك، وبذلك، وفي النهاية، وعلى العكس.", en: "Even so, that way, in the end, conversely."}
      - {speaker: Kak Tiara, text: "UMKM: usaha mikro, kecil, dan menengah. Sebagian besar pekerja Indonesia bekerja di UMKM.", ar_eg: "UMKM: المشروعات متناهية الصغر والصغيرة والمتوسطة. أغلب العمال في إندونيسيا شغالين فيها.", ar: "UMKM: المشروعات متناهية الصغر والصغيرة والمتوسطة، ويعمل فيها معظم العمال في إندونيسيا.", en: "UMKM: micro, small and medium enterprises. Most Indonesian workers work in them."}
      - {speaker: Kak Reza, text: "Inflasi, modal, pinjaman, koperasi, penjualan, pertumbuhan ekonomi.", ar_eg: "تضخم، رأس مال، قرض، جمعية تعاونية، مبيعات، نمو اقتصادي.", ar: "تضخم، رأس مال، قرض، تعاونية، مبيعات، نمو اقتصادي.", en: "Inflation, capital, loan, cooperative, sales, economic growth."}
      - {speaker: Kak Tiara, text: "Naik, turun, meningkat, menurun, tetap: kata untuk tren.", ar_eg: "زاد، قل، ارتفع، انخفض، ثابت: كلمات للاتجاهات.", ar: "ارتفع، انخفض، ازداد، تراجع، ثبت: كلمات الاتجاهات.", en: "Rise, fall, increase, decrease, stay flat: trend words."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Harga bahan bakar naik. Akibatnya, biaya pengiriman naik."
        ar_eg: "أسعار الوقود زادت. والنتيجة، تكلفة الشحن زادت."
        ar: "ارتفعت أسعار الوقود، فارتفعت تكلفة الشحن."
        en: "Fuel prices rose. As a result, shipping costs rose."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Harga bahan bakar naik. Akibatnya, biaya pengiriman naik.", ar_eg: "أسعار الوقود زادت. والنتيجة، تكلفة الشحن زادت.", ar: "ارتفعت أسعار الوقود، فارتفعت تكلفة الشحن.", en: "Fuel prices rose. As a result, shipping costs rose."}
      - {speaker: Kak Tiara, text: "Saya bergabung dengan koperasi. Oleh karena itu, saya mendapat modal.", ar_eg: "دخلت جمعية تعاونية. وعشان كده، خدت رأس مال.", ar: "انضممت إلى تعاونية، ولذلك حصلت على رأس مال.", en: "I joined a cooperative. Therefore, I got capital."}
      - {speaker: Kak Reza, text: "Saya bergabung dengan koperasi. Oleh karena itu, saya mendapat modal.", ar_eg: "دخلت جمعية تعاونية. وعشان كده، خدت رأس مال.", ar: "انضممت إلى تعاونية، ولذلك حصلت على رأس مال.", en: "I joined a cooperative. Therefore, I got capital."}
      - {speaker: Kak Tiara, text: "Meskipun demikian, penjualan tetap meningkat.", ar_eg: "ومع كده، المبيعات برضه زادت.", ar: "ومع ذلك، استمرت المبيعات في الازدياد.", en: "Even so, sales kept rising."}
      - {speaker: Kak Reza, text: "Meskipun demikian, penjualan tetap meningkat.", ar_eg: "ومع كده، المبيعات برضه زادت.", ar: "ومع ذلك، استمرت المبيعات في الازدياد.", en: "Even so, sales kept rising."}
      - {speaker: Kak Tiara, text: "Pembeli bisa membayar dengan QRIS.", ar_eg: "المشترين يقدروا يدفعوا بـQRIS.", ar: "يستطيع المشترون الدفع عبر QRIS.", en: "Buyers can pay with QRIS."}
      - {speaker: Kak Reza, text: "Pembeli bisa membayar dengan QRIS.", ar_eg: "المشترين يقدروا يدفعوا بـQRIS.", ar: "يستطيع المشترون الدفع عبر QRIS.", en: "Buyers can pay with QRIS."}
  - kind: outro
    title: Anggaran usaha Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, bayangkan kamu membuka kedai koshari di Jakarta. Jelaskan rencanamu dengan tiga konjungsi antarkalimat."
        ar_eg: "يا محمد، تخيّل إنك فتحت محل كشري في جاكرتا. اشرح خطتك بتلات أدوات ربط بين الجمل."
        ar: "يا محمد، تخيّل أنك افتتحت محل كشري في جاكرتا. اشرح خطتك بثلاث أدوات ربط."
        en: "Mohamed, imagine opening a koshari shop in Jakarta. Explain your plan with three sentence connectors."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Bahan koshari murah. Oleh karena itu, harganya terjangkau. Akan tetapi, orang Jakarta belum mengenalnya. Akibatnya, saya perlu promosi.", ar_eg: "مثلًا: «مكونات الكشري رخيصة. عشان كده، سعره في المتناول. بس أهل جاكرتا لسه ما يعرفوهوش. والنتيجة، محتاج أعمل دعاية».", ar: "مثلًا: «مكونات الكشري رخيصة، لذلك سعره في المتناول. غير أن أهل جاكرتا لا يعرفونه بعد، ولذا أحتاج إلى الترويج».", en: "For example: Koshari ingredients are cheap. Therefore, the price is affordable. However, Jakartans don't know it yet. As a result, I need promotion."}
      - {speaker: Kak Tiara, text: "Besok, buat anggaran sederhana untuk usaha kecilmu.", ar_eg: "بكرة، اعمل ميزانية بسيطة لمشروعك الصغير.", ar: "غدًا، ضع ميزانية بسيطة لمشروعك الصغير.", en: "Tomorrow, make a simple budget for your small business."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Semoga laris manis!", ar_eg: "شكرًا يا محمد. ربنا يرزقك ويكتر زباينك!", ar: "شكرًا يا محمد. نتمنى لك تجارة رابحة!", en: "Thank you, Mohamed. May business boom!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [ekonomi, UMKM, koperasi, modal, pinjaman, inflasi, penjualan, rumput laut, QRIS, oleh karena itu, akibatnya, meskipun demikian]
review:
  status: draft
  verified: false
  notes: |
    Mama Rosa is a one-off role-play figure, not in the registry; check the name doesn't clash.
    Spot-check: Jayapura on Humboldt (Yos Sudarso) Bay; QRIS as Bank Indonesia's
    national QR standard; "most workers in UMKM" claim matches the unit's culture note.
