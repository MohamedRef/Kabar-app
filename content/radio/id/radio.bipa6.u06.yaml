schema: kabar.radio/v1
id: radio.bipa6.u06
language: id
level: bipa6
unit: bipa6.u06
title:
  target: Lucunya di mana?
  ar_eg: فين الضحك؟
  ar: أين النكتة؟
  en: Where's the joke?
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Danau Toba
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Danau Toba! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من بحيرة توبا! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من بحيرة توبا! هذا كبار راديو. أنا تيارا.", en: "Good morning from Lake Toba! This is Kabar Radio. I'm Tiara."}
      - speaker: Kak Reza
        text: "Aku Reza. Danau ini terbentuk dari letusan gunung api purba. Di tengahnya ada Pulau Samosir."
        ar_eg: "أنا رضا. البحيرة دي اتكونت من ثوران بركان قديم أوي. وفي نصها جزيرة ساموسير."
        ar: "أنا رضا. تكوّنت هذه البحيرة من ثوران بركان قديم، وفي وسطها جزيرة ساموسير."
        en: "I'm Reza. This lake formed from an ancient volcanic eruption. In the middle is Samosir Island."
        note:
          ar_eg: "كلمات: api = نار؛ gunung api = بركان؛ letusan = ثوران."
          ar: "مفردات: api = نار؛ gunung api = بركان؛ letusan = ثوران."
          en: "Words: api = fire; gunung api = volcano; letusan = eruption."
      - {speaker: Kak Tiara, text: "Bang Togar ikut kita. Katanya, orang Batak terkenal suka bercanda blak-blakan.", ar_eg: "بانج توجار جه معانا. بيقول إن الباتاك مشهورين بالهزار الدغري.", ar: "رافقنا بانغ توغار، ويقول إن الباتاك معروفون بالمزاح الصريح.", en: "Bang Togar came along. He says Batak people are known for blunt humour."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar ironi, sarkasme, sama plesetan: humor yang mainin kata."
        ar_eg: "النهارده هنتعلم السخرية، والتريقة، والقلش: الهزار اللي بيلعب بالكلام."
        ar: "اليوم نتعلم المفارقة والتهكم والتلاعب بالألفاظ."
        en: "Today we learn irony, sarcasm and plesetan: humour that plays with words."
      - speaker: Kak Tiara
        text: "Mohamed, orang Mesir juga terkenal lucu, kan? Siap ketawa?"
        ar_eg: "يا محمد، المصريين كمان مشهورين بخفة الدم، صح؟ جاهز تضحك؟"
        ar: "يا محمد، المصريون معروفون بخفة الظل، أليس كذلك؟ مستعد للضحك؟"
        en: "Mohamed, Egyptians are famous for being funny too, right? Ready to laugh?"
        note:
          ar_eg: "كلمات: ketawa = يضحك."
          ar: "مفردات: ketawa = يضحك."
          en: "Words: ketawa = to laugh."
  - kind: dialogue
    title: Ironi di tepi danau
    lines:
      - speaker: Kak Tiara
        text: "Dengerin obrolan ini. Kapan Reza serius, kapan dia ironis?"
        ar_eg: "اسمع الكلام ده. رضا بيتكلم جد امتى، وبيتريق امتى؟"
        ar: "استمع إلى هذا الحوار: متى يجدّ رضا ومتى يتهكّم؟"
        en: "Listen to this. When is Reza serious, and when is he being ironic?"
        note:
          ar_eg: "السخرية = تقول عكس اللي تقصده. الصوت والموقف بيكشفوها. كلمات: obrolan = دردشة، كلام."
          ar: "التهكم أن تقول عكس ما تقصد، ويكشفه الصوت والموقف. مفردات: obrolan = حديث، دردشة."
          en: "Irony = saying the opposite of what you mean. Tone and context give it away. Words: obrolan = chat, conversation."
      - {speaker: Kak Tiara, text: "Kak, kita udah nungguin feri dua jam, lho.", ar_eg: "يا رضا، بقالنا ساعتين مستنيين العبّارة.", ar: "يا رضا، ننتظر العبّارة منذ ساعتين.", en: "We've been waiting for the ferry for two hours."}
      - {speaker: Kak Reza, text: "Wah, cepet banget, ya. Aku hampir nggak sempat ngabisin tiga gelas kopi.", ar_eg: "ياه، سريعة أوي. ده أنا يادوب لحقت أخلّص تلات كوبايات قهوة.", ar: "يا لها من سرعة! بالكاد لحقت أن أنهي ثلاثة أكواب من القهوة.", en: "Wow, so fast. I barely had time to finish three cups of coffee.", note: {ar_eg: "cepet banget = cepat sekali في الكلام. النبرة هي اللي بتقولك إنه بيتريق.", ar: "cepet banget = cepat sekali في الكلام، والنبرة تكشف السخرية.", en: "cepet banget = spoken cepat sekali. The tone tells you it's ironic."}}
      - speaker: Kak Tiara
        text: "Itu ironi! Dia bilang cepet, padahal maksudnya lama banget."
        ar_eg: "دي سخرية! بيقول سريعة، وهو قصده بطيئة جدًا."
        ar: "هذا تهكّم! يقول سريعة وهو يقصد بطيئة جدًا."
        en: "That's irony! He says fast, but he means very slow."
        note:
          ar_eg: "كلمات: bilang = يقول؛ maksudnya = يعني، قصدي."
          ar: "مفردات: bilang = يقول؛ maksudnya = أي، بمعنى."
          en: "Words: bilang = to say; maksudnya = I mean, that is."
      - speaker: Kak Reza
        text: "Bang Togar tadi bilang: Kalau kau lapar, jangan tanya ke orang Batak. Kami jawab: makanlah!"
        ar_eg: "بانج توجار قال من شوية: «لو جعان، ما تسألش باتاك. هنقولك: كُل!»"
        ar: "قال بانغ توغار قبل قليل: «إن جعت فلا تسأل باتاكيًّا، سنقول لك: كُلْ!»"
        en: "Bang Togar said earlier: If you're hungry, don't ask a Batak. We'll just say: eat!"
        note:
          ar_eg: "كلمات: jawab = يرد، يجاوب؛ kau = إنت، إنتي."
          ar: "مفردات: jawab = يجيب؛ kau = أنتَ، أنتِ."
          en: "Words: jawab = to answer, reply; kau = you."
      - {speaker: Kak Tiara, text: "Haha. Humor Batak emang langsung. Sekarang plesetan. Kenapa ikan nggak pernah sekolah?", ar_eg: "هاها. هزار الباتاك دغري فعلًا. دلوقتي قلشة. ليه السمك عمره ما راح المدرسة؟", ar: "هاها. مزاح الباتاك مباشر فعلًا. والآن تلاعب بالألفاظ: لماذا لا يذهب السمك إلى المدرسة؟", en: "Haha. Batak humour really is direct. Now a pun. Why do fish never go to school?"}
      - {speaker: Kak Reza, text: "Kenapa?", ar_eg: "ليه؟", ar: "لماذا؟", en: "Why?"}
      - speaker: Kak Tiara
        text: "Soalnya udah jago renang, nggak perlu jago ngitung. Eh, maksudku, takut kena jaring!"
        ar_eg: "عشان شاطرين في العوم، مش محتاجين حساب. لأ قصدي، خايفين من الشبكة!"
        ar: "لأنهم بارعون في السباحة ولا حاجة لهم بالحساب. لا، أقصد: يخافون الشبكة!"
        en: "Because they can swim, they don't need maths. No wait, I mean, they're scared of the net!"
        note:
          ar_eg: "كلمات: jaring = شبكة؛ jago = شاطر، جامد في؛ eh = بقولك إيه؛ kena = اتصاب بـ، اتلبس في؛ maksudku = قصدي."
          ar: "مفردات: jaring = شبكة؛ jago = ماهر؛ eh = اسمع؛ kena = أصابه، تعرّض لـ؛ maksudku = أقصد، مقصدي."
          en: "Words: jaring = net; jago = good at, skilled; eh = hey; kena = to be hit by, get; maksudku = I mean, what I mean."
      - speaker: Kak Reza
        text: "Aduh, jaring sama jaringan internet? Itu plesetan yang… sangat kreatif."
        ar_eg: "يا ساتر، شبكة الصيد وشبكة الإنترنت؟ دي قلشة… مبدعة جدًا."
        ar: "يا إلهي، شبكة الصيد وشبكة الإنترنت؟ إنه تلاعب… مبدع جدًا."
        en: "Oh dear, fishing net and internet network? That's a pun that's… very creative."
        note:
          ar_eg: "كلمات: kreatif = مبدع، كرييتف؛ jaringan = شبكة."
          ar: "مفردات: kreatif = مبدع؛ jaringan = شبكة."
          en: "Words: kreatif = creative; jaringan = network."
      - speaker: Kak Tiara
        text: "Nah, sangat kreatif tadi juga ironi. Mohamed, kamu denger nadanya?"
        ar_eg: "أهو، «مبدعة جدًا» دي كمان سخرية. يا محمد، سامع النبرة؟"
        ar: "ها هي: «مبدع جدًا» تهكّم أيضًا. يا محمد، هل سمعت النبرة؟"
        en: "See, 'very creative' was irony too. Mohamed, did you hear the tone?"
        note:
          ar_eg: "كلمات: nah = أهو، بص بقى."
          ar: "مفردات: nah = ها، إذن."
          en: "Words: nah = there you go, now."
  - kind: word_spotlight
    title: Ironi dan plesetan
    lines:
      - speaker: Kak Tiara
        text: "Ironi: mengatakan kebalikan dari maksud. Sarkasme: ironi yang tajam dan menyindir."
        ar_eg: "ironi: تقول عكس قصدك. sarkasme: سخرية حادة فيها تلقيح."
        ar: "ironi: قول عكس المقصود. sarkasme: تهكم لاذع فيه تعريض."
        en: "Irony: saying the opposite. Sarcasm: sharp, cutting irony."
        note:
          ar_eg: "menyindir يعني «يلقّح» أو «يرمي كلام». كلمات: maksud = قصد، يعني إيه."
          ar: "menyindir أي يعرّض أو يلمّح باللوم. مفردات: maksud = مقصد، معنى."
          en: "Menyindir means to make a dig at someone. Words: maksud = meaning, intention."
      - {speaker: Kak Reza, text: "Plesetan: bermain dengan bunyi kata yang mirip, seperti jaring dan jaringan.", ar_eg: "plesetan: اللعب بكلمات صوتها قريب، زي jaring وjaringan.", ar: "plesetan: اللعب بكلمات متقاربة الصوت، مثل jaring وjaringan.", en: "Plesetan: playing with similar-sounding words, like jaring and jaringan."}
      - {speaker: Kak Tiara, text: "Lawak, pelawak, lelucon, lucu, garing.", ar_eg: "هزار، كوميديان، نكتة، مضحك، بايخة.", ar: "فكاهة، فكاهي، نكتة، مضحك، باردة.", en: "Comedy, comedian, joke, funny, flat."}
      - {speaker: Kak Reza, text: "Garing artinya renyah, tapi untuk lelucon artinya tidak lucu.", ar_eg: "garing يعني مقرمش، بس لما تقولها على نكتة يعني بايخة.", ar: "garing تعني مقرمش، لكنها في النكتة تعني باردة.", en: "Garing means crispy, but for a joke it means not funny."}
      - speaker: Kak Tiara
        text: "Kalau temen ngelawak garing, bilang aja: Garing banget, sih! Atau: Krik krik…"
        ar_eg: "لو صاحبك قال نكتة بايخة قوله: بايخة أوي! أو: كريك كريك… (صوت الصراصير)."
        ar: "إن قال صديقك نكتة باردة فقل: باردة جدًا! أو: كريك كريك… (صوت الصراصير)."
        en: "If a friend's joke falls flat, just say: So lame! Or: Krik krik… (crickets)."
        note:
          ar_eg: "krik krik = صوت الصراصير، يعني محدش ضحك. ngelawak = melawak."
          ar: "krik krik = صوت الصراصير، أي لم يضحك أحد. ngelawak = melawak."
          en: "krik krik = crickets: nobody laughed. ngelawak = melawak."
      - {speaker: Kak Tiara, text: "Stand-up, meme, kartun editorial, satire politik, batas humor.", ar_eg: "ستاند أب، ميمز، كاريكاتير، سخرية سياسية، حدود الهزار.", ar: "ستاند أب، ميمات، كاريكاتير صحفي، سخرية سياسية، حدود الفكاهة.", en: "Stand-up, memes, editorial cartoons, political satire, the limits of humour."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Wah, cepet banget, ya."
        ar_eg: "ياه، سريعة أوي."
        ar: "يا لها من سرعة!"
        en: "Wow, so fast."
        note:
          ar_eg: "كرر ورانا بنبرة ساخرة!"
          ar: "ردّد بعدنا بنبرة تهكمية!"
          en: "Repeat after us, with an ironic tone!"
      - {speaker: Kak Reza, text: "Wah, cepet banget, ya.", ar_eg: "ياه، سريعة أوي.", ar: "يا لها من سرعة!", en: "Wow, so fast."}
      - {speaker: Kak Tiara, text: "Leluconnya garing.", ar_eg: "النكتة بايخة.", ar: "النكتة باردة.", en: "The joke fell flat."}
      - {speaker: Kak Reza, text: "Leluconnya garing.", ar_eg: "النكتة بايخة.", ar: "النكتة باردة.", en: "The joke fell flat."}
      - {speaker: Kak Tiara, text: "Dia bilang cepet, padahal maksudnya lama.", ar_eg: "بيقول سريعة، وهو قصده بطيئة.", ar: "يقول سريعة وهو يقصد بطيئة.", en: "He says fast, but he means slow."}
      - {speaker: Kak Reza, text: "Dia bilang cepet, padahal maksudnya lama.", ar_eg: "بيقول سريعة، وهو قصده بطيئة.", ar: "يقول سريعة وهو يقصد بطيئة.", en: "He says fast, but he means slow."}
      - {speaker: Kak Tiara, text: "Itu plesetan yang sangat kreatif.", ar_eg: "دي قلشة مبدعة جدًا.", ar: "إنه تلاعب لفظي مبدع جدًا.", en: "That's a very creative pun."}
      - {speaker: Kak Reza, text: "Itu plesetan yang sangat kreatif.", ar_eg: "دي قلشة مبدعة جدًا.", ar: "إنه تلاعب لفظي مبدع جدًا.", en: "That's a very creative pun."}
  - kind: outro
    title: Lelucon Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritain satu lelucon Mesir pakai bahasa Indonesia. Kalau garing, nggak apa-apa!"
        ar_eg: "يا محمد، احكي نكتة مصرية بالإندونيسي. لو طلعت بايخة، مش مشكلة!"
        ar: "يا محمد، احكِ نكتة مصرية بالإندونيسية. وإن كانت باردة فلا بأس!"
        en: "Mohamed, tell an Egyptian joke in Indonesian. If it falls flat, that's fine!"
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - speaker: Kak Reza
        text: "Atau pakai ironi: Wah, jalanan Kairo pagi ini lancar banget!"
        ar_eg: "أو استعمل السخرية: «ياه، مرور القاهرة الصبح ده سالك خالص!»"
        ar: "أو استخدم التهكم: «يا سلام، ما أسلس مرور القاهرة هذا الصباح!»"
        en: "Or use irony: Wow, Cairo traffic is so smooth this morning!"
        note:
          ar_eg: "كلمات: jalanan = الشوارع، الطريق."
          ar: "مفردات: jalanan = الشوارع، الطرقات."
          en: "Words: jalanan = the streets, the road."
      - {speaker: Kak Tiara, text: "Besok, cari satu meme Indonesia, terus jelasin lucunya di mana.", ar_eg: "بكرة، دوّر على ميم إندونيسي واشرح الضحك فيه فين.", ar: "غدًا، ابحث عن ميم إندونيسي واشرح موضع الطرافة فيه.", en: "Tomorrow, find an Indonesian meme and explain where the joke is."}
      - speaker: Kak Reza
        text: "Makasih, Mohamed. Episode ini serius banget, kan? Haha!"
        ar_eg: "شكرًا يا محمد. الحلقة دي كانت جد أوي، صح؟ هاها!"
        ar: "شكرًا يا محمد. كانت حلقة جادة جدًا، أليس كذلك؟ هاها!"
        en: "Thank you, Mohamed. A very serious episode, right? Haha!"
        note:
          ar_eg: "كلمات: episode = حلقة."
          ar: "مفردات: episode = حلقة."
          en: "Words: episode = episode."
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [ironi, sarkasme, plesetan, menyindir, lelucon, pelawak, satire, batas, bercanda, blak-blakan, kartun editorial, tajam]
review:
  status: draft
  verified: false
  notes: |
    Bang Togar (registered BIPA 6 character) is quoted, not a speaker. The fish pun is
    deliberately weak (Reza's "very creative" is irony). Check the Batak joke reads
    affectionate, not stereotyping. Spot-check: Toba caldera, Samosir.
