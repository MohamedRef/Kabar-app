schema: kabar.radio/v1
id: radio.bipa3.u05
language: id
level: bipa3
unit: bipa3.u05
title:
  target: Seminggu di Senaru
  ar_eg: أسبوع في سينارو
  ar: أسبوع في سينارو
  en: A week in Senaru
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pintu masuk Rinjani
    lines:
      - {speaker: Kak Tiara, text: "Selamat sore dari Senaru! Ini Kabar Radio. Aku Tiara.", ar_eg: "مساء الخير من سينارو! ده كبار راديو. أنا تيارا.", ar: "مساء الخير من سينارو! هذا كبار راديو. أنا تيارا.", en: "Good afternoon from Senaru! This is Kabar Radio. I'm Tiara."}
      - speaker: Kak Reza
        text: "Aku Reza. Senaru itu pintu masuk buat naik Gunung Rinjani."
        ar_eg: "أنا رضا. سينارو هي البوابة اللي بيطلعوا منها جبل رينجاني."
        ar: "أنا رضا. سينارو هي مدخل تسلّق جبل رينجاني."
        en: "I'm Reza. Senaru is the starting point for climbing Mount Rinjani."
        note:
          ar_eg: "أهل القرى الساساك هنا بيشتغلوا مرشدين وشيّالين للي طالعين الجبل."
          ar: "يعمل كثير من الساساك هنا مرشدين وحمّالين لمتسلقي الجبل."
          en: "Many Sasak villagers here work as guides and porters for climbers."
      - {speaker: Kak Tiara, text: "Minggu ini kita ketemu Pak Satria, porter. Dia cerita soal minggunya.", ar_eg: "الأسبوع ده قابلنا باك ساتريا، شيّال. حكالنا أسبوعه كان عامل إزاي.", ar: "هذا الأسبوع قابلنا باك ساتريا، وهو حمّال. حدّثنا عن أسبوعه.", en: "This week we met Pak Satria, a porter. He told us about his week."}
      - {speaker: Kak Reza, text: "Hari ini kita belajar cerita kegiatan seminggu, pakai kata kerja sama objeknya.", ar_eg: "النهارده هنتعلم نحكي اللي عملناه في أسبوع بالأفعال ومفعولها.", ar: "اليوم نتعلم سرد أنشطة الأسبوع بالأفعال ومفاعيلها.", en: "Today we learn to recount a week with verbs and their objects."}
      - {speaker: Kak Tiara, text: "Mohamed, minggu lalu ngapain aja?", ar_eg: "يا محمد، عملت إيه الأسبوع اللي فات؟", ar: "يا محمد، ماذا فعلت الأسبوع الماضي؟", en: "Mohamed, what did you do last week?"}
  - kind: dialogue
    title: Minggu Pak Satria
    lines:
      - speaker: Kak Reza
        text: "Aku jadi Pak Satria, ya. Tiara yang nanya."
        ar_eg: "أنا هبقى باك ساتريا. وتيارا هي اللي بتسأل."
        ar: "سأكون باك ساتريا، وتيارا هي من تسأل."
        en: "I'll be Pak Satria. Tiara asks the questions."
        note:
          ar_eg: "مشهد تمثيلي: رضا بيمثل دور شيّال من سينارو."
          ar: "مشهد تمثيلي: رضا يؤدي دور حمّال من سينارو."
          en: "A role-play: Reza plays a porter from Senaru."
      - {speaker: Kak Tiara, text: "Pak Satria, gimana minggu ini, Pak?", ar_eg: "يا باك ساتريا، أسبوعك كان عامل إزاي؟", ar: "يا باك ساتريا، كيف كان أسبوعك؟", en: "Pak Satria, how was your week?", note: {ar_eg: "مع راجل أكبر: Pak/Bapak. بس gimana عادي حتى مع الكبار.", ar: "مع رجل أكبر سنًا: Pak/Bapak. لكن gimana مقبولة حتى مع الكبار.", en: "With an older man: Pak/Bapak. But gimana is fine even with elders."}}
      - {speaker: Kak Reza, text: "Wah, sibuk banget! Senin saya nganter empat turis dari Belanda ke danau Segara Anak.", ar_eg: "مشغول أوي! يوم الاتنين وصلت أربع سياح من هولندا لبحيرة سيجارا أناك.", ar: "مشغول جدًا! يوم الإثنين رافقت أربعة سياح من هولندا إلى بحيرة سيغارا أناك.", en: "Very busy! On Monday I took four tourists from the Netherlands to Lake Segara Anak.", note: {ar_eg: "nganter = mengantar في الكلام.", ar: "nganter = mengantar في الكلام اليومي.", en: "nganter = spoken mengantar."}}
      - {speaker: Kak Tiara, text: "Bapak bawa apa aja?", ar_eg: "كنت شايل إيه؟", ar: "ماذا كنت تحمل؟", en: "What did you carry?"}
      - {speaker: Kak Reza, text: "Tenda, air, makanan. Beratnya tiga puluh kilo!", ar_eg: "شلت الخيمة والمية والأكل. وزنهم تلاتين كيلو.", ar: "حملت الخيمة والماء والطعام. وزنها ثلاثون كيلوغرامًا.", en: "I carried the tent, water and food. Thirty kilos."}
      - {speaker: Kak Tiara, text: "Wah, berat banget! Terus di danau ngapain, Pak?", ar_eg: "الله، تقيل أوي! وعند البحيرة عملت إيه؟", ar: "يا له من ثِقل! وماذا فعلت عند البحيرة؟", en: "Wow, that's heavy! And what did you do at the lake?"}
      - {speaker: Kak Reza, text: "Saya masak nasi sama sayur. Turisnya foto-foto danau.", ar_eg: "طبخت رز وخضار. والسياح صوّروا البحيرة.", ar: "طبخت الأرز والخضار، والتقط السياح صورًا للبحيرة.", en: "I cooked rice and vegetables. The tourists photographed the lake."}
      - {speaker: Kak Tiara, text: "Hari Kamis Bapak pulang?", ar_eg: "رجعت يوم الخميس؟", ar: "هل عدت يوم الخميس؟", en: "Did you come home on Thursday?"}
      - {speaker: Kak Reza, text: "Iya. Jumat saya bantu istri. Nyapu halaman, jemur baju.", ar_eg: "أيوه. يوم الجمعة ساعدت مراتي. كنست الحوش ونشرت الغسيل.", ar: "نعم. يوم الجمعة ساعدت زوجتي: كنست الفناء ونشرت الملابس.", en: "Yes. On Friday I helped my wife. I swept the yard and hung out the washing.", note: {ar_eg: "nyapu = menyapu، jemur = menjemur في الكلام.", ar: "nyapu = menyapu، jemur = menjemur في الكلام اليومي.", en: "nyapu = menyapu, jemur = menjemur in speech."}}
      - {speaker: Kak Tiara, text: "Dan hari Sabtu?", ar_eg: "ويوم السبت؟", ar: "ويوم السبت؟", en: "And on Saturday?"}
      - {speaker: Kak Reza, text: "Benerin atap rumah. Terus sorenya saya kasih anak saya hadiah, sepatu gunung.", ar_eg: "صلّحت سقف البيت. وبعدين العصر اديت ابني هدية، جزمة جبلية.", ar: "أصلحت سقف البيت. ثم في المساء أهديت ابني حذاءً جبليًا.", en: "I repaired the roof. Then in the afternoon I gave my son a present, a pair of hiking boots.", note: {ar_eg: "benerin = memperbaiki، kasih = memberi.", ar: "benerin = memperbaiki، kasih = memberi.", en: "benerin = memperbaiki, kasih = memberi."}}
      - {speaker: Kak Tiara, text: "Anaknya mau jadi porter juga, Pak?", ar_eg: "ابنك كمان عايز يبقى شيّال؟", ar: "هل يريد ابنك أن يصبح حمّالًا أيضًا؟", en: "Does your son want to be a porter too?"}
      - {speaker: Kak Reza, text: "Nggak. Dia mau jadi pemandu. Sekarang lagi belajar bahasa Inggris sama bahasa Arab!", ar_eg: "لأ. عايز يبقى مرشد. بيتعلم إنجليزي وعربي!", ar: "لا. يريد أن يصبح مرشدًا، ويتعلم الإنجليزية والعربية!", en: "No. He wants to be a guide. He's learning English and Arabic!"}
  - kind: word_spotlight
    title: Menyapu, menjemur, memberi
    lines:
      - speaker: Kak Tiara
        text: "Kata kerja transitif perlu objek. Saya membawa... apa? Saya membawa tenda."
        ar_eg: "الفعل المتعدي محتاج مفعول. أنا شلت... إيه؟ شلت الخيمة."
        ar: "الفعل المتعدي يحتاج مفعولًا. أنا حملت... ماذا؟ حملت الخيمة."
        en: "A transitive verb needs an object. I carried... what? I carried the tent."
        note:
          ar_eg: "أفعال meN- اللي بتاخد مفعول: membawa، memasak، menyapu. المفعول بييجي بعد الفعل على طول."
          ar: "أفعال meN- المتعدية: membawa، memasak، menyapu، ويأتي المفعول بعد الفعل مباشرة."
          en: "Transitive meN- verbs: membawa, memasak, menyapu. The object comes right after the verb."
      - {speaker: Kak Reza, text: "Menyapu lantai, menyapu halaman. Menjemur pakaian, menjemur padi.", ar_eg: "يكنس الأرض، يكنس الحوش. ينشر الغسيل، ينشر الرز في الشمس.", ar: "يكنس الأرض، يكنس الفناء. ينشر الملابس، ينشر الأرز في الشمس.", en: "Sweep the floor, sweep the yard. Hang out the washing, dry rice in the sun."}
      - {speaker: Kak Tiara, text: "Memotret danau, memperbaiki atap, mencuci piring.", ar_eg: "يصوّر البحيرة، يصلّح السقف، يغسل المواعين.", ar: "يصوّر البحيرة، يصلح السقف، يغسل الأطباق.", en: "Photograph the lake, repair the roof, wash the dishes."}
      - speaker: Kak Reza
        text: "Memberi saya peta. Memberi anak hadiah. Dua objek!"
        ar_eg: "اداني خريطة. ادى ابنه هدية. مفعولين!"
        ar: "أعطاني خريطة. أعطى ابنه هدية. مفعولان!"
        en: "Gave me a map. Gave his son a present. Two objects!"
        note:
          ar_eg: "زي «أعطى» في العربي: memberi + الشخص + الحاجة. أو memberikan + الحاجة + kepada + الشخص."
          ar: "مثل «أعطى» في العربية: memberi + الشخص + الشيء، أو memberikan + الشيء + kepada + الشخص."
          en: "Like Arabic «أعطى»: memberi + person + thing, or memberikan + thing + kepada + person."
      - speaker: Kak Tiara
        text: "Kalau ngobrol: kasih, benerin, nyapu, jemur. Saya kasih anak saya hadiah."
        ar_eg: "في الكلام: kasih وbenerin وnyapu وjemur. أنا اديت ابني هدية."
        ar: "في الكلام: kasih وbenerin وnyapu وjemur. أعطيت ابني هدية."
        en: "In conversation: kasih, benerin, nyapu, jemur. I gave my son a present."
        note:
          ar_eg: "memberi ← kasih، memperbaiki ← benerin، menyapu ← nyapu. نفس المعنى بالظبط."
          ar: "memberi ← kasih، memperbaiki ← benerin، menyapu ← nyapu. والمعنى واحد تمامًا."
          en: "memberi → kasih, memperbaiki → benerin, menyapu → nyapu. Same meaning."
      - {speaker: Kak Tiara, text: "Minggu lalu, hari Senin, kemudian, pada akhir pekan.", ar_eg: "الأسبوع اللي فات، يوم الاتنين، بعدين، في آخر الأسبوع.", ar: "الأسبوع الماضي، يوم الإثنين، بعد ذلك، في عطلة نهاية الأسبوع.", en: "Last week, on Monday, then, at the weekend."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Hari Senin saya mengantar turis ke danau."
        ar_eg: "يوم الاتنين وصلت سياح للبحيرة."
        ar: "يوم الإثنين رافقت سياحًا إلى البحيرة."
        en: "On Monday I took tourists to the lake."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Hari Senin saya mengantar turis ke danau.", ar_eg: "يوم الاتنين وصلت سياح للبحيرة.", ar: "يوم الإثنين رافقت سياحًا إلى البحيرة.", en: "On Monday I took tourists to the lake."}
      - {speaker: Kak Tiara, text: "Saya menyapu halaman dan menjemur pakaian.", ar_eg: "كنست الحوش ونشرت الغسيل.", ar: "كنست الفناء ونشرت الملابس.", en: "I swept the yard and hung out the washing."}
      - {speaker: Kak Reza, text: "Saya menyapu halaman dan menjemur pakaian.", ar_eg: "كنست الحوش ونشرت الغسيل.", ar: "كنست الفناء ونشرت الملابس.", en: "I swept the yard and hung out the washing."}
      - {speaker: Kak Tiara, text: "Dia memberi anaknya sebuah hadiah.", ar_eg: "ادى ابنه هدية.", ar: "أعطى ابنه هدية.", en: "He gave his son a present."}
      - {speaker: Kak Reza, text: "Dia memberi anaknya sebuah hadiah.", ar_eg: "ادى ابنه هدية.", ar: "أعطى ابنه هدية.", en: "He gave his son a present."}
      - {speaker: Kak Tiara, text: "Pada akhir pekan saya memperbaiki atap.", ar_eg: "في آخر الأسبوع صلّحت السقف.", ar: "في عطلة نهاية الأسبوع أصلحت السقف.", en: "At the weekend I repaired the roof."}
      - {speaker: Kak Reza, text: "Pada akhir pekan saya memperbaiki atap.", ar_eg: "في آخر الأسبوع صلّحت السقف.", ar: "في عطلة نهاية الأسبوع أصلحت السقف.", en: "At the weekend I repaired the roof."}
  - kind: outro
    title: Jurnal Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan minggu lalumu. Pakai tiga kata kerja dengan objek."
        ar_eg: "يا محمد، احكي أسبوعك اللي فات. استخدم تلات أفعال بمفعولها."
        ar: "يا محمد، احكِ أسبوعك الماضي. استعمل ثلاثة أفعال بمفاعيلها."
        en: "Mohamed, tell us about last week. Use three verbs with objects."
        note:
          ar_eg: "دورك! زي يوميات صغيرة."
          ar: "دورك! كأنها يوميات قصيرة."
          en: "Your turn! Like a little diary."
      - {speaker: Kak Reza, text: "Contohnya: Hari Senin saya menulis laporan. Hari Rabu saya mengunjungi nenek. Hari Jumat saya membeli buku baru.", ar_eg: "مثلًا: يوم الاتنين كتبت تقرير. يوم الأربع زرت جدتي. يوم الجمعة اشتريت كتاب جديد.", ar: "مثلًا: يوم الإثنين كتبت تقريرًا. يوم الأربعاء زرت جدتي. يوم الجمعة اشتريت كتابًا جديدًا.", en: "For example: On Monday I wrote a report. On Wednesday I visited my grandmother. On Friday I bought a new book."}
      - {speaker: Kak Tiara, text: "Besok, mulai jurnal mingguan, ya. Satu kalimat tiap hari.", ar_eg: "من بكرة، ابدأ يوميات أسبوعية. اكتب جملة كل يوم.", ar: "من الغد، ابدأ يوميات أسبوعية، واكتب جملة كل يوم.", en: "Tomorrow, start a weekly journal. Write one sentence every day."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Semangat!", ar_eg: "شكرًا يا محمد. شد حيلك!", ar: "شكرًا يا محمد. بالتوفيق!", en: "Thank you, Mohamed. Keep it up!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [mengantar, memasak, menyapu, menjemur, memotret, memberi, porter, minggu lalu, akhir pekan, gunung, jurnal, tenda, membawa]
