title:
  target: Sarapan di pasar terapung
  ar_eg: فطار في السوق العايم
  ar: فطور في السوق العائم
  en: Breakfast at the floating market
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Subuh di Banjarmasin
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Banjarmasin, kota seribu sungai! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من بانجارماسين، مدينة الألف نهر! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من بنجرماسين، مدينة الألف نهر! هذا كبار راديو. أنا تيارا.", en: "Good morning from Banjarmasin, the city of a thousand rivers! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Matahari belum terbit, tapi pasar terapung sudah ramai.", ar_eg: "أنا رضا. الشمس لسه ما طلعتش، بس السوق العايم زحمة من بدري.", ar: "أنا رضا. لم تشرق الشمس بعد، لكن السوق العائم مزدحم.", en: "I'm Reza. The sun isn't up yet, but the floating market is already busy."}
      - {speaker: Kak Tiara, text: "Para pedagang berjualan dari perahu kecil yang disebut jukung.", ar_eg: "التجار بيبيعوا من مراكب صغيرة اسمها جوكونج.", ar: "يبيع التجار من قوارب صغيرة تسمى جوكونغ.", en: "Traders sell from small boats called jukung."}
      - speaker: Kak Reza
        text: "Hari ini kita bicara tentang makanan dan identitas, dengan kata benda per-an dan ke-an."
        ar_eg: "النهارده هنتكلم عن الأكل والهوية، بأسماء per-an وke-an."
        ar: "اليوم نتحدث عن الطعام والهوية، بأسماء per-an وke-an."
        en: "Today we talk about food and identity, with per-an and ke-an nouns."
      - {speaker: Kak Tiara, text: "Mohamed, makanan apa yang membuatmu merasa di rumah?", ar_eg: "يا محمد، إيه الأكلة اللي بتحسسك إنك في البيت؟", ar: "يا محمد، أي طعام يشعرك بأنك في بيتك؟", en: "Mohamed, what food makes you feel at home?"}
  - kind: dialogue
    title: Semangkuk soto Banjar
    lines:
      - speaker: Kak Tiara
        text: "Kami membeli soto Banjar dari perahu. Dengarkan Kak Reza mencicipinya."
        ar_eg: "اشترينا سوتو بانجار من مركب. اسمع رضا وهو بيدوقها."
        ar: "اشترينا سوتو بنجر من قارب. استمع إلى رضا وهو يتذوقه."
        en: "We bought soto Banjar from a boat. Listen to Reza taste it."
        note:
          ar_eg: "soto يعني شوربة. خلي بالك من الكلمات اللي بتوصف الطعم."
          ar: "soto نوع من الحساء. انتبه إلى كلمات وصف الطعم."
          en: "Soto is a soup. Listen for words that describe flavour."
      - {speaker: Kak Reza, text: "Hmm, kuahnya bening tapi harum. Ada kayu manis, cengkih, dan pala.", ar_eg: "همم، الشوربة صافية بس ريحتها حلوة. فيها قرفة وقرنفل وجوزة الطيب.", ar: "الحساء صافٍ لكنه عطِر، فيه قرفة وقرنفل وجوزة الطيب.", en: "Mmm, the broth is clear but fragrant. There's cinnamon, clove and nutmeg."}
      - {speaker: Kak Tiara, text: "Rempah-rempah itu menunjukkan sejarah perdagangan di pelabuhan ini.", ar_eg: "البهارات دي بتورّي تاريخ التجارة في المينا ده.", ar: "تدل هذه التوابل على تاريخ التجارة في هذا الميناء.", en: "Those spices show the history of trade in this port."}
      - {speaker: Kak Reza, text: "Ada pengaruh Arab, Tionghoa, dan Melayu dalam satu mangkuk. Luar biasa.", ar_eg: "فيه تأثير عربي وصيني وملايو في طبق واحد. حاجة تحفة.", ar: "في وعاء واحد تأثير عربي وصيني وملايوي. مدهش.", en: "Arab, Chinese and Malay influences in one bowl. Amazing."}
      - {speaker: Kak Tiara, text: "Ibu penjualnya bilang resep ini dari neneknya.", ar_eg: "الست البياعة قالت إن الوصفة دي من جدتها.", ar: "قالت البائعة إن الوصفة من جدتها.", en: "The seller said this recipe is from her grandmother."}
      - {speaker: Kak Reza, text: "Itulah identitas. Makanan menyimpan kenangan keluarga.", ar_eg: "هي دي الهوية. الأكل بيشيل ذكريات العيلة.", ar: "هذه هي الهوية؛ الطعام يحفظ ذكريات العائلة.", en: "That's identity. Food holds family memories."}
      - {speaker: Kak Tiara, text: "Mohamed pasti setuju. Molokhia buatan ibu tidak bisa diganti.", ar_eg: "محمد أكيد موافق. ملوخية ماما ما ليهاش بديل.", ar: "لا بد أن محمدًا يوافق؛ فملوخية الأم لا بديل لها.", en: "Mohamed surely agrees. Mum's molokhia can't be replaced."}
      - {speaker: Kak Reza, text: "Apakah soto ini halal? Penjualnya bilang tentu, semua bahannya halal.", ar_eg: "السوتو دي حلال؟ البياعة قالت أكيد، كل المكونات حلال.", ar: "هل هذا السوتو حلال؟ قالت البائعة: بالطبع، كل مكوناته حلال.", en: "Is this soto halal? The seller said of course, all the ingredients are halal."}
      - {speaker: Kak Tiara, text: "Kesimpulannya, cita rasa soto Banjar adalah cerita perjalanan banyak bangsa.", ar_eg: "الخلاصة، طعم سوتو بانجار حكاية سفر شعوب كتير.", ar: "الخلاصة: نكهة سوتو بنجر حكاية رحلات شعوب كثيرة.", en: "In short, the flavour of soto Banjar is the story of many peoples' journeys."}
  - kind: word_spotlight
    title: Per-an dan ke-an
    lines:
      - speaker: Kak Tiara
        text: "Per-an membuat kata benda tempat atau kegiatan: dagang menjadi perdagangan, kebun menjadi perkebunan."
        ar_eg: "per-an بتعمل اسم مكان أو نشاط: تجارة ← التجارة، جنينة ← المزارع."
        ar: "per-an تصوغ اسم مكان أو نشاط: dagang ← perdagangan (التجارة)، kebun ← perkebunan (المزارع)."
        en: "Per-an makes nouns of place or activity: trade → commerce, garden → plantations."
        note:
          ar_eg: "perkebunan مش جنينة صغيرة: دي مزارع كبيرة."
          ar: "perkebunan ليست حديقة صغيرة بل مزارع واسعة."
          en: "Perkebunan isn't a small garden: it's large-scale plantations."
      - {speaker: Kak Reza, text: "Ke-an membuat kata abstrak: kenang menjadi kenangan, bangsa menjadi kebangsaan.", ar_eg: "ke-an بتعمل كلمة مجردة: يفتكر ← ذكرى، شعب ← قومية.", ar: "ke-an تصوغ المجرد: kenang ← kenangan (ذكرى)، bangsa ← kebangsaan (القومية).", en: "Ke-an makes abstract words: remember → memory, nation → nationhood."}
      - {speaker: Kak Tiara, text: "Cita rasa, rempah, kuah, harum, gurih, pedas.", ar_eg: "الطعم، البهارات، الشوربة، ريحة حلوة، مُسبّك (أومامي)، حراق.", ar: "النكهة، التوابل، المرق، عطِر، غنيّ الطعم، حار.", en: "Flavour, spices, broth, fragrant, savoury, spicy."}
      - {speaker: Kak Reza, text: "Pasar terapung, jukung, pedagang, pembeli, tawar-menawar.", ar_eg: "السوق العايم، مركب جوكونج، التاجر، المشتري، الفصال.", ar: "السوق العائم، قارب جوكونغ، التاجر، المشتري، المساومة.", en: "Floating market, jukung boat, trader, buyer, haggling."}
      - {speaker: Kak Tiara, text: "Identitas, tradisi, warisan, resep keluarga.", ar_eg: "هوية، تقاليد، ميراث، وصفة العيلة.", ar: "هوية، تقاليد، تراث، وصفة العائلة.", en: "Identity, tradition, heritage, family recipe."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Kuahnya bening tapi harum."
        ar_eg: "الشوربة صافية بس ريحتها حلوة."
        ar: "المرق صافٍ لكنه عطِر."
        en: "The broth is clear but fragrant."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Kuahnya bening tapi harum.", ar_eg: "الشوربة صافية بس ريحتها حلوة.", ar: "المرق صافٍ لكنه عطِر.", en: "The broth is clear but fragrant."}
      - {speaker: Kak Tiara, text: "Makanan menyimpan kenangan keluarga.", ar_eg: "الأكل بيشيل ذكريات العيلة.", ar: "الطعام يحفظ ذكريات العائلة.", en: "Food holds family memories."}
      - {speaker: Kak Reza, text: "Makanan menyimpan kenangan keluarga.", ar_eg: "الأكل بيشيل ذكريات العيلة.", ar: "الطعام يحفظ ذكريات العائلة.", en: "Food holds family memories."}
      - {speaker: Kak Tiara, text: "Rempah menunjukkan sejarah perdagangan.", ar_eg: "البهارات بتورّي تاريخ التجارة.", ar: "التوابل تدل على تاريخ التجارة.", en: "Spices show the history of trade."}
      - {speaker: Kak Reza, text: "Rempah menunjukkan sejarah perdagangan.", ar_eg: "البهارات بتورّي تاريخ التجارة.", ar: "التوابل تدل على تاريخ التجارة.", en: "Spices show the history of trade."}
      - {speaker: Kak Tiara, text: "Resep ini warisan dari nenek.", ar_eg: "الوصفة دي ورث من الجدة.", ar: "هذه الوصفة إرث من الجدة.", en: "This recipe is a heritage from grandma."}
      - {speaker: Kak Reza, text: "Resep ini warisan dari nenek.", ar_eg: "الوصفة دي ورث من الجدة.", ar: "هذه الوصفة إرث من الجدة.", en: "This recipe is a heritage from grandma."}
  - kind: outro
    title: Resep keluarga Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan resep keluargamu. Apa bahannya, dan kenangan apa yang ada di dalamnya?"
        ar_eg: "يا محمد، احكيلنا عن وصفة عيلتكم. مكوناتها إيه، وفيها ذكريات إيه؟"
        ar: "يا محمد، حدّثنا عن وصفة عائلتك: ما مكوناتها، وأي ذكريات تحملها؟"
        en: "Mohamed, tell us about your family recipe. What's in it, and what memories does it hold?"
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Fattah buatan ibu saya terdiri dari nasi, roti, dan daging. Setiap Idul Adha kami makan bersama.", ar_eg: "مثلًا: فتة ماما فيها رز وعيش ولحمة. كل عيد أضحى بناكلها سوا.", ar: "مثلًا: فتة أمي من الأرز والخبز واللحم، نأكلها معًا كل عيد أضحى.", en: "For example: My mum's fatta has rice, bread and meat. Every Eid al-Adha we eat it together."}
      - {speaker: Kak Tiara, text: "Besok, tulis resep itu dalam bahasa Indonesia.", ar_eg: "بكرة، اكتب الوصفة دي بالإندونيسي.", ar: "غدًا، اكتب تلك الوصفة بالإندونيسية.", en: "Tomorrow, write that recipe in Indonesian."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Selamat makan!", ar_eg: "شكرًا يا محمد. بالهنا والشفا!", ar: "شكرًا يا محمد. بالهناء والشفاء!", en: "Thank you, Mohamed. Enjoy your meal!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [rempah, cita rasa, perdagangan, perkebunan, identitas, warisan, resep, bersama, kayu manis, pengaruh, terapung, tradisi]
