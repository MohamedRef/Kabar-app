schema: kabar.radio/v1
id: radio.bipa5.u05
language: id
level: bipa5
unit: bipa5.u05
title:
  target: Suara dari hutan Kalimantan
  ar_eg: صوت من غابات كاليمانتان
  ar: صوت من غابات كاليمانتان
  en: A voice from Kalimantan's forests
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Di atas perahu klotok
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Tanjung Puting! Kami siaran dari atas perahu klotok. Aku Tiara.", ar_eg: "صباح الخير من تانجونج بوتينج! بنذيع من فوق مركب كلوتوك. أنا تيارا.", ar: "صباح الخير من تانجونغ بوتينغ! نبث من على قارب كلوتوك. أنا تيارا.", en: "Good morning from Tanjung Puting! We're broadcasting from a klotok boat. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Ssst… di pohon itu ada orangutan. Lagi makan buah.", ar_eg: "أنا رضا. هسسس… على الشجرة دي فيه أورانجوتان. بياكل فاكهة.", ar: "أنا رضا. صه… على تلك الشجرة إنسان غاب يأكل الفاكهة.", en: "I'm Reza. Shh… there's an orangutan in that tree. It's eating fruit."}
      - {speaker: Kak Tiara, text: "Orangutan itu artinya orang hutan. Dari bahasa Melayu, lho.", ar_eg: "orangutan معناها «إنسان الغابة». الكلمة دي من لغة الملايو.", ar: "orangutan تعني «إنسان الغابة»، والكلمة من لغة الملايو.", en: "Orangutan means 'person of the forest'. The word comes from Malay."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar ter- sama ke-an buat keadaan: terbakar, kebanjiran, kehilangan."
        ar_eg: "النهارده هنتعلم ter- وke-an للحالة: اتحرق، غرق، فقد."
        ar: "اليوم نتعلم ter- وke-an للدلالة على الحال: احترق، غمره الفيضان، فقد."
        en: "Today we learn ter- and ke-an for states: burnt, flooded, lost."
      - {speaker: Kak Tiara, text: "Mohamed, pernah lihat hutan hujan, nggak?", ar_eg: "يا محمد، شفت غابة استوائية قبل كده؟", ar: "يا محمد، هل رأيت غابة مطيرة من قبل؟", en: "Mohamed, have you ever seen a rainforest?"}
  - kind: dialogue
    title: Dua sudut pandang
    lines:
      - speaker: Kak Tiara
        text: "Kita dengar dua sudut pandang. Saya jadi petani sawit. Kak Reza jadi penjaga hutan adat."
        ar_eg: "هنسمع وجهتين نظر. أنا هبقى فلاحة نخل زيت. ورضا هيبقى حارس غابة القبيلة."
        ar: "سنستمع إلى وجهتي نظر: أنا مزارعة نخيل زيت، ورضا حارس غابة عرفية."
        en: "Let's hear two points of view. I'll be an oil-palm farmer. Reza will guard a customary forest."
        note:
          ar_eg: "تمثيل. الموضوع حساس، فالاتنين بيتكلموا باحترام."
          ar: "هذا تمثيل؛ الموضوع حساس، فيتحدث الطرفان باحترام."
          en: "A role-play. The topic is sensitive, so both speak respectfully."
      - {speaker: Kak Tiara, text: "Kebun sawit memberi saya penghasilan. Anak saya bisa sekolah karena sawit.", ar_eg: "مزرعة النخل بتجيبلي دخل. ابني بيروح المدرسة بفضل النخل.", ar: "مزرعة النخيل مصدر دخلي، وبفضلها يذهب ابني إلى المدرسة.", en: "The palm plantation gives me income. My child can go to school because of palm oil."}
      - {speaker: Kak Reza, text: "Saya paham, Bu. Tetapi waktu hutan dibuka, desa kami kehilangan sumber air.", ar_eg: "فاهمك يا ست. بس لما الغابة اتقطعت، قريتنا خسرت مصدر الميه.", ar: "أفهمك يا سيدتي، لكن حين فُتحت الغابة فقدت قريتنا مصدر مائها.", en: "I understand, ma'am. But when the forest was cleared, our village lost its water source."}
      - {speaker: Kak Tiara, text: "Sedih, ya. Kebun saya juga pernah kebanjiran tahun lalu.", ar_eg: "ده يزعّل. ومزرعتي كمان غرقت السنة اللي فاتت.", ar: "هذا محزن. ومزرعتي أيضًا غمرها الفيضان العام الماضي.", en: "That's sad. My plantation was flooded last year too."}
      - {speaker: Kak Reza, text: "Di musim kemarau, lahan gambut bisa terbakar. Asapnya membuat anak-anak sakit.", ar_eg: "في موسم الجفاف، أرض الخث ممكن تتحرق. والدخان بيعيّي العيال.", ar: "في موسم الجفاف قد تحترق أراضي الخث، ودخانها يمرض الأطفال.", en: "In the dry season, peatland can catch fire. The smoke makes children sick."}
      - {speaker: Kak Tiara, text: "Jadi, jalan tengahnya gimana?", ar_eg: "يبقى إيه الحل الوسط؟", ar: "إذن ما الحل الوسط؟", en: "So what's the middle way?"}
      - {speaker: Kak Reza, text: "Hutan adat tetap dijaga, dan kebun yang sudah ada dikelola dengan lebih baik.", ar_eg: "غابة القبيلة تفضل محمية، والمزارع الموجودة تتدار بشكل أحسن.", ar: "أن تبقى الغابة العرفية محمية، وتُدار المزارع القائمة على نحو أفضل.", en: "Keep the customary forest protected, and manage existing plantations better."}
      - {speaker: Kak Tiara, text: "Kalau begitu, petani dan masyarakat Dayak bisa sama-sama hidup.", ar_eg: "لو كده، الفلاحين والداياك يقدروا يعيشوا مع بعض.", ar: "عندها يستطيع المزارعون ومجتمع الداياك العيش معًا.", en: "That way, farmers and Dayak communities can both live."}
      - {speaker: Kak Reza, text: "Dan orangutan juga tidak kehilangan rumahnya.", ar_eg: "والأورانجوتان كمان ما يخسرش بيته.", ar: "ولا يفقد إنسان الغاب موطنه أيضًا.", en: "And the orangutans don't lose their home either."}
  - kind: word_spotlight
    title: Ter- dan ke-an
    lines:
      - speaker: Kak Tiara
        text: "Ter- sering berarti tidak sengaja atau keadaan: terbakar, terjatuh, tertidur."
        ar_eg: "ter- غالبًا معناها حاجة حصلت من غير قصد أو حالة: اتحرق، وقع، نام من غير ما ياخد باله."
        ar: "ter- تدل غالبًا على ما وقع دون قصد أو على حال: احترق، سقط، غلبه النوم."
        en: "Ter- often means accidental, or a state: burnt, fell, dozed off."
        note:
          ar_eg: "dibakar = حد حرقه بقصد. terbakar = اتحرق وخلاص."
          ar: "dibakar: أحرقه أحدهم قصدًا. terbakar: احترق فحسب."
          en: "Dibakar = someone burnt it on purpose. Terbakar = it got burnt."
      - {speaker: Kak Reza, text: "Ke-an untuk hal buruk yang menimpa kita: kebanjiran, kehujanan, kehilangan, kecurian.", ar_eg: "ke-an لحاجة وحشة حصلتلنا: الميه غرّقتنا، المطرة نزلت علينا، خسرنا، اتسرقنا.", ar: "ke-an لما يصيبنا من سوء: غمرنا الفيضان، أصابنا المطر، فقدنا، سُرقنا.", en: "Ke-an for bad things that happen to us: flooded, caught in the rain, lost, robbed."}
      - {speaker: Kak Tiara, text: "Saya kehujanan tadi pagi. Rumahnya kecurian.", ar_eg: "المطرة نزلت عليا الصبح. بيتهم اتسرق.", ar: "أصابني المطر صباحًا. سُرق بيتهم.", en: "I got caught in the rain this morning. Their house was burgled."}
      - speaker: Kak Reza
        text: "Di jalan: Aduh, kehujanan! HP-ku ketinggalan! Dompetku kecopetan!"
        ar_eg: "في الشارع: يوه، المطر بهدلني! نسيت موبايلي! محفظتي اتسرقت!"
        ar: "في الشارع: أوه، أمطرت علي! نسيت هاتفي! سُرقت محفظتي!"
        en: "On the street: Ugh, got rained on! Left my phone behind! My wallet got pickpocketed!"
        note:
          ar_eg: "ke-an دي من أكتر الحاجات اللي هتسمعها في الكلام: kehujanan، ketinggalan، kecopetan."
          ar: "صيغ ke-an هذه من أكثر ما ستسمعه في الكلام: kehujanan، ketinggalan، kecopetan."
          en: "These ke-an forms are everywhere in speech: kehujanan, ketinggalan, kecopetan."
      - {speaker: Kak Reza, text: "Hutan adat, lahan gambut, kabut asap, sawit, penggundulan hutan.", ar_eg: "غابة القبيلة، أرض الخث، ضباب الدخان، نخل الزيت، تجريف الغابات.", ar: "الغابة العرفية، أراضي الخث، ضباب الدخان، نخيل الزيت، إزالة الغابات.", en: "Customary forest, peatland, haze, oil palm, deforestation."}
      - {speaker: Kak Tiara, text: "Sudut pandang, jalan tengah, saya paham, tetapi…", ar_eg: "وجهة نظر، حل وسط، فاهمك، بس…", ar: "وجهة نظر، حل وسط، أفهمك، لكن…", en: "Point of view, middle way, I understand, but…"}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Lahan gambut bisa terbakar."
        ar_eg: "أرض الخث ممكن تتحرق."
        ar: "قد تحترق أراضي الخث."
        en: "Peatland can catch fire."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Lahan gambut bisa terbakar.", ar_eg: "أرض الخث ممكن تتحرق.", ar: "قد تحترق أراضي الخث.", en: "Peatland can catch fire."}
      - {speaker: Kak Tiara, text: "Desa kami kehilangan sumber air.", ar_eg: "قريتنا خسرت مصدر الميه.", ar: "فقدت قريتنا مصدر مائها.", en: "Our village lost its water source."}
      - {speaker: Kak Reza, text: "Desa kami kehilangan sumber air.", ar_eg: "قريتنا خسرت مصدر الميه.", ar: "فقدت قريتنا مصدر مائها.", en: "Our village lost its water source."}
      - {speaker: Kak Tiara, text: "Kebun saya kebanjiran tahun lalu.", ar_eg: "مزرعتي غرقت السنة اللي فاتت.", ar: "غمر الفيضان مزرعتي العام الماضي.", en: "My plantation was flooded last year."}
      - {speaker: Kak Reza, text: "Kebun saya kebanjiran tahun lalu.", ar_eg: "مزرعتي غرقت السنة اللي فاتت.", ar: "غمر الفيضان مزرعتي العام الماضي.", en: "My plantation was flooded last year."}
      - {speaker: Kak Tiara, text: "Saya paham, tetapi hutan harus dijaga.", ar_eg: "فاهمك، بس الغابة لازم تتحمي.", ar: "أفهمك، لكن يجب حماية الغابة.", en: "I understand, but the forest must be protected."}
      - {speaker: Kak Reza, text: "Saya paham, tetapi hutan harus dijaga.", ar_eg: "فاهمك، بس الغابة لازم تتحمي.", ar: "أفهمك، لكن يجب حماية الغابة.", en: "I understand, but the forest must be protected."}
  - kind: outro
    title: Laporan lapangan
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan sesuatu yang buruk yang pernah menimpamu. Pakai ke-an: kehujanan, kecurian, atau ketinggalan."
        ar_eg: "يا محمد، احكي حاجة وحشة حصلتلك. استعمل ke-an: المطرة نزلت عليك، اتسرقت، أو فاتك حاجة."
        ar: "يا محمد، احكِ أمرًا سيئًا أصابك، مستخدمًا ke-an: kehujanan أو kecurian أو ketinggalan."
        en: "Mohamed, tell us about something bad that happened to you. Use ke-an: kehujanan, kecurian or ketinggalan."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Minggu lalu saya ketinggalan kereta, jadi saya terlambat kerja.", ar_eg: "مثلًا: الأسبوع اللي فات القطر فاتني، فاتأخرت على الشغل.", ar: "مثلًا: فاتني القطار الأسبوع الماضي فتأخرت عن العمل.", en: "For example: Last week I missed the train, so I was late for work."}
      - {speaker: Kak Tiara, text: "Besok, tulis laporan lapangan pendek pakai dua sudut pandang.", ar_eg: "بكرة، اكتب تقرير ميداني قصير فيه وجهتين نظر.", ar: "غدًا، اكتب تقريرًا ميدانيًا قصيرًا بوجهتي نظر.", en: "Tomorrow, write a short field report with two points of view."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Salam dari orangutan!", ar_eg: "شكرًا يا محمد. سلام من الأورانجوتان!", ar: "شكرًا يا محمد. تحية من إنسان الغاب!", en: "Thank you, Mohamed. Greetings from the orangutans!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [hutan adat, kabut asap, sawit, terbakar, kebanjiran, kehilangan, kehujanan, sudut pandang, gambut, kemarau, penghasilan]
review:
  status: draft
  verified: false
  notes: |
    Spot-check: klotok boats and orangutans at Tanjung Puting (Central Kalimantan);
    "orang hutan" etymology from Malay. Role-play is deliberately balanced; no statistics.
