      - {speaker: Kak Reza, text: "Berapa sewanya sebulan?", ar_eg: "الإيجار كام في الشهر؟", ar: "كم الإيجار في الشهر؟", en: "How much is the rent a month?"}
      - {speaker: Kak Tiara, text: "Tolong bukakan pintunya.", ar_eg: "لو سمحت افتحلي الباب.", ar: "من فضلك افتح لي الباب.", en: "Please open the door for me."}
      - {speaker: Kak Reza, text: "Tolong bukakan pintunya.", ar_eg: "لو سمحت افتحلي الباب.", ar: "من فضلك افتح لي الباب.", en: "Please open the door for me."}
      - {speaker: Kak Tiara, text: "Di depan ada warung. Di belakang ada masjid.", ar_eg: "قدام فيه دكان أكل. وورا فيه جامع.", ar: "في الأمام مطعم صغير، وفي الخلف مسجد.", en: "There's a warung in front. There's a mosque behind."}
      - {speaker: Kak Reza, text: "Di depan ada warung. Di belakang ada masjid.", ar_eg: "قدام فيه دكان أكل. وورا فيه جامع.", ar: "في الأمام مطعم صغير، وفي الخلف مسجد.", en: "There's a warung in front. There's a mosque behind."}
  - kind: outro
    title: Rumah Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan rumahmu. Ada berapa kamar tidur? Di dekat rumahmu ada apa?"
        ar_eg: "يا محمد، احكيلنا عن بيتك. فيه كام أوضة نوم؟ وفيه إيه جنب بيتك؟"
        ar: "يا محمد، حدّثنا عن بيتك. كم غرفة نوم فيه؟ وماذا يوجد قرب بيتك؟"
        en: "Mohamed, tell us about your home. How many bedrooms are there? What's near your home?"
        note:
          ar_eg: "دورك! جاوب بصوت عالي بجملتين أو تلاتة."
          ar: "دورك! أجب بصوت مسموع بجملتين أو ثلاث."
          en: "Your turn! Answer out loud in two or three sentences."
      - {speaker: Kak Reza, text: "Contohnya: Rumah saya di Kairo. Ada tiga kamar tidur. Di sebelah rumah ada toko roti.", ar_eg: "مثلًا: بيتي في القاهرة. فيه تلات أوض نوم. جنب البيت فيه فرن عيش.", ar: "مثلًا: بيتي في القاهرة. فيه ثلاث غرف نوم. بجانب البيت مخبز.", en: "For example: My home is in Cairo. There are three bedrooms. Next to the house there's a bakery."}
      - {speaker: Kak Tiara, text: "Bagus sekali! Besok, coba gambar denah rumahmu dan beri nama setiap ruangan.", ar_eg: "حلو أوي! بكرة ارسم خريطة بيتك واكتب اسم كل أوضة.", ar: "ممتاز! غدًا ارسم مخطط بيتك واكتب اسم كل غرفة.", en: "Very good! Tomorrow, draw a plan of your home and name every room."}
      - {speaker: Kak Reza, text: "Terima kasih, Kak Tiara. Sekarang saya mau pindah ke kos baru!", ar_eg: "شكرًا يا تيارا. دلوقتي أنا رايح أنقل الكوس الجديد!", ar: "شكرًا يا تيارا. الآن سأنتقل إلى الكوس الجديد!", en: "Thank you, Tiara. Now I'm off to move into my new kos!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio, Mohamed!", ar_eg: "أشوفك بكرة في كبار راديو يا محمد!", ar: "إلى اللقاء غدًا في كبار راديو يا محمد!", en: "See you tomorrow on Kabar Radio, Mohamed!"}
