schema: kabar.radio/v1
id: radio.bipa2.u06
language: id
level: bipa2
unit: bipa2.u06
title:
  target: Kamar kosong di Sanur
  ar_eg: أوضة فاضية في سانور
  ar: غرفة شاغرة في سانور
  en: A room free in Sanur
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Sanur
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi! Selamat datang di Kabar Radio! Saya Tiara.", ar_eg: "صباح الخير! أهلًا بيك في كبار راديو! أنا تيارا.", ar: "صباح الخير! أهلًا بك في كبار راديو! أنا تيارا.", en: "Good morning! Welcome to Kabar Radio! I'm Tiara."}
      - {speaker: Kak Reza, text: "Dan saya Reza. Hari ini kita di Sanur, di pantai timur Bali.", ar_eg: "وأنا رضا. النهارده إحنا في سانور، على الشط الشرقي لبالي.", ar: "وأنا رضا. اليوم نحن في سانور، على الشاطئ الشرقي لبالي.", en: "And I'm Reza. Today we're in Sanur, on Bali's east coast."}
      - {speaker: Kak Tiara, text: "Kak Reza sedang mencari kamar, ya?", ar_eg: "إنت بتدور على أوضة يا رضا، صح؟", ar: "أنت تبحث عن غرفة يا رضا، أليس كذلك؟", en: "You're looking for a room, aren't you, Reza?"}
      - speaker: Kak Reza
        text: "Betul. Saya mau pindah ke Sanur. Saya mencari kos yang dekat pantai."
        ar_eg: "مظبوط. عايز أنقل سانور. بدور على أوضة إيجار (كوس) قريبة من البحر."
        ar: "صحيح. أريد الانتقال إلى سانور. أبحث عن غرفة للإيجار (كوس) قريبة من الشاطئ."
        en: "Right. I want to move to Sanur. I'm looking for a kos near the beach."
        note:
          ar_eg: "kos أوضة بتأجرها في بيت، وغالبًا الحمام والمطبخ مشتركين. طلبة وموظفين كتير بيسكنوا كده."
          ar: "kos غرفة تُستأجر في بيت، وغالبًا يكون الحمام والمطبخ مشتركين. يسكنها كثير من الطلبة والموظفين."
          en: "A kos is a rented room in a house, often with a shared bathroom and kitchen. Many students and workers live this way."
      - {speaker: Kak Tiara, text: "Hari ini kita belajar kamar mandi, kamar tidur, tolong, dan silakan.", ar_eg: "النهارده هنتعلم الحمام، وأوضة النوم، وtolong، وsilakan.", ar: "اليوم نتعلم الحمام، وغرفة النوم، وtolong، وsilakan.", en: "Today we learn bathroom, bedroom, tolong and silakan."}
      - {speaker: Kak Reza, text: "Halo, Mohamed! Kamu tinggal di rumah atau di apartemen?", ar_eg: "أهلًا يا محمد! إنت ساكن في بيت ولا في شقة؟", ar: "مرحبًا يا محمد! هل تسكن في بيت أم في شقة؟", en: "Hello, Mohamed! Do you live in a house or a flat?"}
  - kind: dialogue
    title: Mencari kos
    lines:
      - speaker: Kak Tiara
        text: "Ayo, Kak Reza. Saya jadi ibu kos, ya."
        ar_eg: "يلا يا رضا. أنا هبقى صاحبة البيت."
        ar: "هيا يا رضا. سأكون صاحبة البيت."
        en: "Come on, Reza. I'll be the landlady."
        note:
          ar_eg: "مشهد تمثيلي: تيارا صاحبة الكوس، ورضا بيدور على أوضة."
          ar: "مشهد تمثيلي: تيارا صاحبة الكوس، ورضا يبحث عن غرفة."
          en: "A role-play: Tiara owns the kos, Reza is looking for a room."
      - {speaker: Kak Reza, text: "Permisi, Bu. Apakah ada kamar kosong?", ar_eg: "لو سمحتي يا مدام. فيه أوضة فاضية؟", ar: "عفوًا يا سيدتي. هل توجد غرفة شاغرة؟", en: "Excuse me. Is there a room free?"}
      - {speaker: Kak Tiara, text: "Ada, Pak. Silakan masuk. Kamarnya di lantai dua.", ar_eg: "فيه يا أستاذ. اتفضل ادخل. الأوضة في الدور التاني.", ar: "نعم يا سيدي. تفضل بالدخول. الغرفة في الطابق الثاني.", en: "Yes, sir. Please come in. The room is on the first floor."}
      - {speaker: Kak Reza, text: "Kamar tidurnya besar? Ada lemari dan meja?", ar_eg: "أوضة النوم كبيرة؟ فيها دولاب وترابيزة؟", ar: "هل غرفة النوم كبيرة؟ هل فيها خزانة وطاولة؟", en: "Is the bedroom big? Is there a wardrobe and a desk?"}
      - {speaker: Kak Tiara, text: "Cukup besar. Ada tempat tidur, lemari, meja, dan kursi.", ar_eg: "كبيرة كفاية. فيها سرير ودولاب وترابيزة وكرسي.", ar: "كبيرة بما يكفي. فيها سرير وخزانة وطاولة وكرسي.", en: "Big enough. There's a bed, a wardrobe, a desk and a chair."}
      - {speaker: Kak Reza, text: "Kamar mandinya di dalam atau di luar?", ar_eg: "الحمام جوه الأوضة ولا برة؟", ar: "هل الحمام داخل الغرفة أم خارجها؟", en: "Is the bathroom inside or outside?"}
      - {speaker: Kak Tiara, text: "Di dalam, Pak. Dapurnya di bawah, di sebelah ruang tamu.", ar_eg: "جوه يا أستاذ. المطبخ تحت، جنب أوضة الضيوف.", ar: "في الداخل يا سيدي. المطبخ في الأسفل، بجانب غرفة الضيوف.", en: "Inside, sir. The kitchen is downstairs, next to the living room."}
      - {speaker: Kak Reza, text: "Bagus. Di dekat sini ada apa, Bu?", ar_eg: "حلو. فيه إيه قريب من هنا يا مدام؟", ar: "جيد. ماذا يوجد بالقرب من هنا يا سيدتي؟", en: "Good. What's near here?"}
      - {speaker: Kak Tiara, text: "Di depan ada warung. Di belakang ada masjid. Rumah sakit tidak jauh.", ar_eg: "قدام فيه دكان أكل. وورا فيه جامع. والمستشفى مش بعيدة.", ar: "في الأمام مطعم صغير، وفي الخلف مسجد، والمستشفى ليس بعيدًا.", en: "There's a warung in front. There's a mosque behind. The hospital isn't far."}
      - {speaker: Kak Reza, text: "Masjidnya dekat? Wah, saya senang sekali.", ar_eg: "الجامع قريب؟ الله، أنا مبسوط أوي.", ar: "المسجد قريب؟ رائع، أنا سعيد جدًا.", en: "The mosque is close? Oh, I'm very glad."}
      - {speaker: Kak Reza, text: "Berapa sewanya sebulan, Bu?", ar_eg: "الإيجار كام في الشهر يا مدام؟", ar: "كم الإيجار في الشهر يا سيدتي؟", en: "How much is the rent a month?"}
      - {speaker: Kak Tiara, text: "Satu setengah juta sebulan. Listrik dan air sudah termasuk.", ar_eg: "مليون ونص في الشهر. الكهربا والمية داخلين.", ar: "مليون ونصف في الشهر، والكهرباء والماء مشمولان.", en: "One and a half million a month. Electricity and water included."}
      - {speaker: Kak Reza, text: "Boleh saya lihat kamarnya dulu?", ar_eg: "ممكن أشوف الأوضة الأول؟", ar: "هل يمكنني رؤية الغرفة أولًا؟", en: "May I see the room first?"}
      - {speaker: Kak Tiara, text: "Tentu. Silakan naik. Tolong lepas sepatu, ya.", ar_eg: "طبعًا. اتفضل اطلع. لو سمحت اقلع الجزمة.", ar: "طبعًا. تفضل بالصعود. من فضلك اخلع حذاءك.", en: "Of course. Please go up. Please take off your shoes."}
      - speaker: Kak Reza
        text: "Baik, Bu. Tolong bukakan pintunya."
        ar_eg: "حاضر يا مدام. لو سمحتي افتحيلي الباب."
        ar: "حسنًا يا سيدتي. من فضلك افتحي لي الباب."
        en: "All right. Please open the door for me."
        note:
          ar_eg: "tolong لما تطلب حد يعملك حاجة، وsilakan لما تعزم على حد يعمل حاجة لنفسه."
          ar: "tolong حين تطلب من أحد أن يفعل لك شيئًا، وsilakan حين تدعو أحدًا ليفعل شيئًا لنفسه."
          en: "Tolong asks someone to do something for you; silakan invites someone to do something themselves."
      - {speaker: Kak Tiara, text: "Kak Reza suka kamarnya?", ar_eg: "عجبتك الأوضة يا رضا؟", ar: "هل أعجبتك الغرفة يا رضا؟", en: "Do you like the room, Reza?"}
      - {speaker: Kak Reza, text: "Suka sekali! Dari jendela, saya bisa melihat pantai.", ar_eg: "عجبتني أوي! من الشباك أقدر أشوف البحر.", ar: "أعجبتني كثيرًا! من النافذة أستطيع رؤية الشاطئ.", en: "I love it! From the window I can see the beach."}
  - kind: word_spotlight
    title: Kamar mandi, rumah sakit
    lines:
      - {speaker: Kak Tiara, text: "Kamar mandi, kamar tidur, ruang tamu. Kamar plus mandi: kamar mandi.", ar_eg: "حمام، أوضة نوم، أوضة ضيوف. كامار (أوضة) + ماندي (يستحمى): حمام.", ar: "حمام، غرفة نوم، غرفة ضيوف. kamar (غرفة) + mandi (استحمام): حمام.", en: "Bathroom, bedroom, living room. Room plus bathe: bathroom."}
      - {speaker: Kak Reza, text: "Rumah sakit. Rumah plus sakit. Bukan rumah yang sakit, ya!", ar_eg: "مستشفى. بيت + عيّان. مش البيت اللي عيّان!", ar: "مستشفى. بيت + مريض. وليس البيت هو المريض!", en: "Hospital. House plus sick. Not a house that is ill!"}
      - {speaker: Kak Tiara, text: "Tolong buka jendelanya. Tolong bantu saya.", ar_eg: "لو سمحت افتح الشباك. لو سمحت ساعدني.", ar: "من فضلك افتح النافذة. من فضلك ساعدني.", en: "Please open the window. Please help me."}
      - {speaker: Kak Reza, text: "Silakan duduk. Silakan masuk. Silakan minum.", ar_eg: "اتفضل اقعد. اتفضل ادخل. اتفضل اشرب.", ar: "تفضل اجلس. تفضل ادخل. تفضل اشرب.", en: "Please sit down. Please come in. Please have a drink."}
      - {speaker: Kak Tiara, text: "Minta air, ya. Saya minta kunci kamar.", ar_eg: "ممكن مية؟ عايزة مفتاح الأوضة.", ar: "أريد ماءً من فضلك. أطلب مفتاح الغرفة.", en: "Some water, please. I'd like the room key."}
      - speaker: Kak Reza
        text: "Di depan, di belakang, di sebelah, di atas, di bawah."
        ar_eg: "قدام، ورا، جنب، فوق، تحت."
        ar: "أمام، خلف، بجانب، فوق، تحت."
        en: "In front, behind, next to, above, below."
        note:
          ar_eg: "كلمة المكان بعد di: di depan rumah = قدام البيت. زي العربي بالظبط: المكان الأول وبعده الحاجة."
          ar: "كلمة المكان بعد di: di depan rumah = أمام البيت، كما في العربية: الظرف ثم المضاف إليه."
          en: "The place word comes after di: di depan rumah = in front of the house, just like Arabic «قدام البيت»."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Apakah ada kamar kosong?"
        ar_eg: "فيه أوضة فاضية؟"
        ar: "هل توجد غرفة شاغرة؟"
        en: "Is there a room free?"
        note:
          ar_eg: "بالراحة. كرر ورانا كل جملة."
          ar: "ببطء. ردّد كل جملة بعدنا."
          en: "Slowly. Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Apakah ada kamar kosong?", ar_eg: "فيه أوضة فاضية؟", ar: "هل توجد غرفة شاغرة؟", en: "Is there a room free?"}
