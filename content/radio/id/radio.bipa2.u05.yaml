language: id
level: bipa2
unit: bipa2.u05
title:
  target: Lezat dan halal
  ar_eg: لذيذ وحلال
  ar: لذيذ وحلال
  en: Delicious and halal
hosts:
  - name: Mbak Gadis
    voice: id-ID-GadisNeural
  - name: Mas Ardi
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Siang di Gianyar
    lines:
      - speaker: Mbak Gadis
        text: Halo, selamat siang! Selamat datang di Kabar Radio! Saya Gadis.
        ar_eg: أهلًا، نهارك سعيد! أهلًا بيك في كبار راديو! أنا جاديس.
        ar: مرحبًا، طاب يومك! أهلًا بك في كبار راديو! أنا غاديس.
        en: Hello, good afternoon! Welcome to Kabar Radio! I'm Gadis.
      - speaker: Mas Ardi
        text: Dan saya Ardi. Selamat siang, Mbak Gadis! Saya lapar sekali!
        ar_eg: وأنا أردي. نهارك سعيد يا جاديس! أنا جعان أوي!
        ar: وأنا أردي. طاب يومك يا غاديس! أنا جائع جدًا!
        en: And I'm Ardi. Good afternoon, Gadis! I'm really hungry!
      - speaker: Mbak Gadis
        text: Bagus, Mas! Hari ini kita di Gianyar, di Bali. Di sini makanannya lezat sekali.
        ar_eg: حلو! النهارده إحنا في جيانيار، في بالي. الأكل هنا لذيذ أوي.
        ar: جيد! اليوم نحن في جيانيار، في بالي. الطعام هنا لذيذ جدًا.
        en: Great! Today we're in Gianyar, in Bali. The food here is delicious.
        note:
          ar_eg: جيانيار مدينة في بالي مشهورة بسوق الأكل بالليل.
          ar: جيانيار مدينة في بالي مشهورة بسوق الطعام الليلي.
          en: Gianyar is a Balinese town famous for its night food market.
      - speaker: Mas Ardi
        text: Tapi Mbak, di Bali banyak makanan babi. Kita harus cari makanan halal.
        ar_eg: بس يا جاديس، في بالي أكل خنزير كتير. لازم ندور على أكل حلال.
        ar: لكن يا غاديس، في بالي أطعمة كثيرة من لحم الخنزير. يجب أن نبحث عن طعام حلال.
        en: But Gadis, in Bali there's a lot of pork. We have to look for halal food.
        note:
          ar_eg: أغلب أهل بالي هندوس، فأكل الخنزير منتشر هناك. دوّر على لافتة halal أو warung Muslim. في باقي إندونيسيا الحلال هو الأساس.
          ar: أغلب أهل بالي هندوس، فأطباق الخنزير شائعة. ابحث عن لافتة halal أو warung Muslim. وفي بقية إندونيسيا الحلال هو الأصل.
          en: Bali is majority Hindu, so pork dishes are common - look for "halal" signs or a "warung Muslim". Elsewhere in Indonesia halal is the default.
      - speaker: Mbak Gadis
        text: Jangan khawatir. Di sana ada warung Muslim. Semua makanannya halal.
        ar_eg: متقلقش. هناك فيه مطعم مسلمين. كل الأكل فيه حلال.
        ar: لا تقلق. هناك مطعم للمسلمين. كل طعامه حلال.
        en: Don't worry. There's a Muslim warung over there. All the food is halal.
      - speaker: Mas Ardi
        text: Pedas, manis, asin, asam. Potong, goreng, aduk. Bersalaman, berdatangan.
        ar_eg: حراق، مسكّر، مالح، حامض. قطّع، اقلي، قلّب. يسلّموا على بعض، ييجوا ورا بعض.
        ar: حار، حلو، مالح، حامض. قطّع، اقلِ، حرّك. يتصافحون، يتوافدون.
        en: Spicy, sweet, salty, sour. Cut, fry, stir. Shaking hands, arriving in numbers.
        note:
          ar_eg: موضوع النهارده - الطعوم، وطلب الأكل، وأوامر الطبخ، وأفعال ber-…-an.
          ar: موضوع اليوم - المذاقات، وطلب الطعام، وأوامر الطبخ، وأفعال ber-…-an.
          en: Today's topic - tastes, ordering food, cooking instructions, and ber-…-an verbs.
      - speaker: Mbak Gadis
        text: Halo, Mohamed! Selamat datang di Gianyar! Kamu suka makanan pedas?
        ar_eg: أهلًا يا محمد! أهلًا بيك في جيانيار! بتحب الأكل الحراق؟
        ar: مرحبًا يا محمد! أهلًا بك في جيانيار! هل تحب الطعام الحار؟
        en: Hello, Mohamed! Welcome to Gianyar! Do you like spicy food?
  - kind: dialogue
    title: Di warung Muslim
    lines:
      - speaker: Mbak Gadis
        text: Mas Ardi, ayo kita pesan. Saya jadi Bu Siti, ya.
        ar_eg: يا أردي، يلا نطلب. أنا هبقى مدام سيتي.
        ar: يا أردي، هيا نطلب. سأكون السيدة سيتي.
        en: Ardi, let's order. I'll be Bu Siti.
        note:
          ar_eg: مشهد تمثيلي - جاديس صاحبة المطعم، وأردي زبون.
          ar: مشهد تمثيلي - غاديس صاحبة المطعم، وأردي زبون.
          en: A role-play - Gadis runs the warung, Ardi is a customer.
      - speaker: Mbak Gadis
        text: Mau pesan apa, Pak?
        ar_eg: تحب تطلب إيه يا أستاذ؟
        ar: ماذا تريد أن تطلب يا سيدي؟
        en: What would you like to order, sir?
      - speaker: Mas Ardi
        text: Bu, makanan di sini halal?
        ar_eg: يا مدام، الأكل هنا حلال؟
        ar: يا سيدتي، هل الطعام هنا حلال؟
        en: Is the food here halal?
      - speaker: Mbak Gadis
        text: Halal, Pak. Ini warung Muslim. Ada ayam dan ikan.
        ar_eg: حلال يا أستاذ. ده مطعم مسلمين. فيه فراخ وسمك.
        ar: حلال يا سيدي. هذا مطعم للمسلمين. يوجد دجاج وسمك.
        en: Halal, sir. This is a Muslim warung. There's chicken and fish.
      - speaker: Mas Ardi
        text: Saya mau pesan sate lilit ikan satu. Sambalnya pedas?
        ar_eg: عايز واحد ساتيه ليليت سمك. الصلصة حراقة؟
        ar: أريد طبق ساتيه ليليت سمك واحدًا. هل الصلصة حارة؟
        en: I'd like one fish sate lilit. Is the chilli sauce spicy?
      - speaker: Mbak Gadis
        text: Pedas sekali, tetapi lezat!
        ar_eg: حراقة أوي، بس لذيذة!
        ar: حارة جدًا، لكنها لذيذة!
        en: Very spicy, but delicious!
      - speaker: Mas Ardi
        text: Sedikit saja, Bu. Jangan terlalu pedas, ya. Dan es teh manis satu.
        ar_eg: شوية بس يا مدام. متخليهاش حراقة أوي. وواحد شاي ساقع بسكر.
        ar: قليلًا فقط يا سيدتي. لا تجعليه حارًا جدًا. وكوب شاي مثلج محلّى.
        en: Just a little. Not too spicy, please. And one iced sweet tea.
      - speaker: Mbak Gadis
        text: Baik, Pak. Silakan duduk.
        ar_eg: حاضر يا أستاذ. اتفضل اقعد.
        ar: حسنًا يا سيدي. تفضّل بالجلوس.
        en: Certainly, sir. Please sit down.
      - speaker: Mbak Gadis
        text: Pak, bagaimana sate lilitnya?
        ar_eg: الساتيه ليليت عامل إيه يا أستاذ؟
        ar: كيف الساتيه ليليت يا سيدي؟
        en: Sir, how's the sate lilit?
      - speaker: Mas Ardi
        text: Lezat sekali! Ikannya gurih, sambalnya pedas, tehnya manis.
        ar_eg: لذيذ أوي! السمك طعمه غني، والصلصة حراقة، والشاي مسكّر.
        ar: لذيذ جدًا! السمك غني الطعم، والصلصة حارة، والشاي حلو.
        en: Delicious! The fish is savoury, the sauce is spicy, the tea is sweet.
      - speaker: Mas Ardi
        text: Bu, semuanya berapa?
        ar_eg: الحساب كام يا مدام؟
        ar: كم المجموع يا سيدتي؟
        en: How much is it altogether?
      - speaker: Mbak Gadis
        text: Semuanya tiga puluh lima ribu, Pak.
        ar_eg: كله خمسة وتلاتين ألف يا أستاذ.
        ar: المجموع خمسة وثلاثون ألفًا يا سيدي.
        en: Thirty-five thousand altogether, sir.
      - speaker: Mas Ardi
        text: Murah dan lezat! Terima kasih, Bu. Saya pasti datang lagi.
        ar_eg: رخيص ولذيذ! شكرًا يا مدام. أكيد هاجي تاني.
        ar: رخيص ولذيذ! شكرًا يا سيدتي. سأعود بالتأكيد.
        en: Cheap and delicious! Thank you. I'll definitely come again.
      - speaker: Mbak Gadis
        text: Mas Ardi bisa memasak?
        ar_eg: إنت بتعرف تطبخ يا أردي؟
        ar: هل تعرف الطبخ يا أردي؟
        en: Can you cook, Ardi?
        note:
          ar_eg: خلص التمثيل - جاديس رجعت جاديس.
          ar: انتهى التمثيل - عادت غاديس إلى نفسها.
          en: The role-play is over - Gadis is herself again.
      - speaker: Mas Ardi
        text: Bisa! Saya bisa memasak nasi goreng berdasarkan resep ibu saya.
        ar_eg: أيوه! بعرف أعمل ناسي جورينج على حسب وصفة أمي.
        ar: نعم! أستطيع طبخ الناسي غورينغ بحسب وصفة أمي.
        en: Yes! I can cook fried rice from my mother's recipe.
      - speaker: Mbak Gadis
        text: Bagaimana cara membuatnya?
        ar_eg: بتعملها إزاي؟
        ar: كيف تُعدّها؟
        en: How do you make it?
      - speaker: Mas Ardi
        text: Mudah! Pertama, cuci dan potong bawang merah, bawang putih, dan cabai.
        ar_eg: سهلة! الأول اغسل وقطّع البصل الأحمر والتوم والشطة.
        ar: سهلة! أولًا اغسل وقطّع الكرّاث الأحمر والثوم والفلفل الحار.
        en: Easy! First, wash and cut the shallots, garlic and chillies.
      - speaker: Mbak Gadis
        text: Cabainya berapa?
        ar_eg: كام شطة؟
        ar: كم فلفلة حارة؟
        en: How many chillies?
      - speaker: Mas Ardi
        text: Tiga saja. Jangan terlalu pedas! Lalu panaskan minyak di wajan.
        ar_eg: تلاتة بس. متخليهاش حراقة أوي! وبعدين سخّن الزيت في الطاسة.
        ar: ثلاث فقط. لا تجعلها حارة جدًا! ثم سخّن الزيت في المقلاة.
        en: Just three. Not too spicy! Then heat the oil in the wok.
      - speaker: Mbak Gadis
        text: Lalu goreng bawang dan cabainya?
        ar_eg: وبعدين أقلي البصل والشطة؟
        ar: ثم أقلي البصل والفلفل؟
        en: Then fry the shallots and chillies?
      - speaker: Mas Ardi
        text: Ya, goreng sampai harum. Lalu masukkan telur dan aduk.
        ar_eg: أيوه، اقليهم لحد ما الريحة تطلع. وبعدين حط البيض وقلّب.
        ar: نعم، اقليها حتى تفوح رائحتها. ثم أضف البيض وحرّك.
        en: Yes, fry until fragrant. Then add the egg and stir.
      - speaker: Mas Ardi
        text: Sesudah telur, masukkan nasi dan kecap manis, lalu aduk rata.
        ar_eg: بعد البيض، حط الرز والصويا المسكّرة، وقلّب كويس.
        ar: بعد البيض أضف الأرز وصلصة الصويا الحلوة، ثم حرّك جيدًا.
        en: After the egg, add the rice and sweet soy sauce, then stir well.
      - speaker: Mbak Gadis
        text: Garamnya?
        ar_eg: والملح؟
        ar: والملح؟
        en: And the salt?
      - speaker: Mas Ardi
        text: Tambahkan sedikit garam, lalu cicipi. Selesai!
        ar_eg: زوّد شوية ملح، وبعدين دوق. خلصنا!
        ar: أضف قليلًا من الملح، ثم تذوّق. انتهينا!
        en: Add a little salt, then taste. Done!
      - speaker: Mbak Gadis
        text: Lihat, Mas! Orang-orang mulai berdatangan ke pasar malam. Mereka bersalaman.
        ar_eg: بص! الناس بدأت تيجي على سوق الليل. وبيسلموا على بعض.
        ar: انظر! بدأ الناس يتوافدون إلى السوق الليلي. وهم يتصافحون.
        en: Look! People are starting to arrive at the night market. They're shaking hands.
      - speaker: Mas Ardi
        text: Ramai sekali! Anak-anak berlarian di taman.
        ar_eg: زحمة أوي! والعيال بيجروا هنا وهناك في الجنينة.
        ar: مزدحم جدًا! والأطفال يركضون هنا وهناك في الحديقة.
        en: So lively! The children are running about in the park.
  - kind: word_spotlight
    title: Lezat, potong, bersalaman
    lines:
      - speaker: Mbak Gadis
        text: Pedas, manis, asin, asam, pahit, gurih. Kopinya pahit, tetapi tehnya manis.
        ar_eg: حراق، مسكّر، مالح، حامض، مر، طعمه غني. القهوة مرة، بس الشاي مسكّر.
        ar: حار، حلو، مالح، حامض، مر، غني الطعم. القهوة مرة، لكن الشاي حلو.
        en: Spicy, sweet, salty, sour, bitter, savoury. The coffee is bitter, but the tea is sweet.
      - speaker: Mas Ardi
        text: Lezat. Lezat. Sate lilit ini lezat sekali.
        ar_eg: لذيذ. لذيذ. الساتيه ليليت ده لذيذ أوي.
        ar: لذيذ. لذيذ. هذا الساتيه ليليت لذيذ جدًا.
        en: Delicious. Delicious. This sate lilit is delicious.
        note:
          ar_eg: الجسر العربي - lezat من «لذّة»، وhalal من «حلال»، وharam من «حرام».
          ar: الجسر العربي - lezat من «لذّة»، وhalal من «حلال»، وharam من «حرام».
          en: Arabic Bridge - lezat comes from «لذّة», halal from «حلال», and haram from «حرام».
      - speaker: Mbak Gadis
        text: Halal, haram. Ini warung Muslim. Semua makanannya halal. Babi haram untuk orang Muslim.
        ar_eg: حلال، حرام. ده مطعم مسلمين. كل الأكل فيه حلال. الخنزير حرام على المسلمين.
        ar: حلال، حرام. هذا مطعم للمسلمين. كل طعامه حلال. الخنزير حرام على المسلمين.
        en: Halal, haram. This is a Muslim warung. All its food is halal. Pork is haram for Muslims.
      - speaker: Mas Ardi
        text: Saya mau pesan nasi campur satu, tidak pakai sambal. Bu, ini halal?
        ar_eg: عايز واحد ناسي تشامبور، من غير صلصة حراقة. يا مدام، ده حلال؟
        ar: أريد طبق ناسي تشامبور واحدًا، بلا صلصة حارة. يا سيدتي، هل هذا حلال؟
        en: I'd like one nasi campur, without chilli sauce. Is this halal?
        note:
          ar_eg: pakai في الطلبات معناها «بـ»، وtidak pakai معناها «من غير».
          ar: pakai في الطلبات تعني «مع»، وtidak pakai تعني «بدون».
          en: In orders, pakai means "with", and tidak pakai means "without".
      - speaker: Mbak Gadis
        text: Potong, goreng, aduk, cuci, rebus, cicipi. Potong bawang merah, lalu goreng sampai harum.
        ar_eg: قطّع، اقلي، قلّب، اغسل، اسلق، دوق. قطّع البصل الأحمر، وبعدين اقليه لحد ما الريحة تطلع.
        ar: قطّع، اقلِ، حرّك، اغسل، اسلق، تذوّق. قطّع الكرّاث الأحمر، ثم اقلِه حتى تفوح رائحته.
        en: Cut, fry, stir, wash, boil, taste. Cut the shallots, then fry until fragrant.
        note:
          ar_eg: الأمر في الإندونيسي سهل - شيل meN- من الفعل - memotong تبقى potong!
          ar: الأمر في الإندونيسية سهل - احذف meN- من الفعل - memotong تصير potong!
          en: Indonesian commands are easy - drop the meN- - memotong becomes potong!
      - speaker: Mas Ardi
        text: Masukkan, tambahkan, panaskan. Masukkan nasi dan aduk rata. Tambahkan sedikit garam.
        ar_eg: حط، زوّد، سخّن. حط الرز وقلّب كويس. زوّد شوية ملح.
        ar: أضف، زِد، سخّن. أضف الأرز وحرّك جيدًا. أضف قليلًا من الملح.
        en: Put in, add, heat. Put in the rice and stir well. Add a little salt.
      - speaker: Mbak Gadis
        text: Bersalaman. Setelah salat Id, semua orang bersalaman.
        ar_eg: يسلّموا على بعض. بعد صلاة العيد كل الناس بتسلّم على بعض.
        ar: يتصافحون. بعد صلاة العيد يتصافح الجميع.
        en: Shake hands. After the Eid prayer, everyone shakes hands.
        note:
          ar_eg: الجسر العربي - bersalaman من «سلام». ber-…-an بتدي معنى «مع بعض» أو «ناس كتير».
          ar: الجسر العربي - bersalaman من «سلام». وتفيد ber-…-an المشاركة أو الكثرة.
          en: Arabic Bridge - bersalaman comes from «سلام». ber-…-an often means "each other" or "lots of people at once".
      - speaker: Mas Ardi
        text: Berkenalan, berpelukan. Kami berkenalan di Bali.
        ar_eg: يتعرفوا على بعض، يحضنوا بعض. إحنا اتعرفنا على بعض في بالي.
        ar: يتعارفون، يتعانقون. تعارفنا في بالي.
        en: Get acquainted, hug each other. We got to know each other in Bali.
      - speaker: Mbak Gadis
        text: Berdatangan, berlarian. Tamu-tamu mulai berdatangan. Anak-anak berlarian di taman.
        ar_eg: ييجوا ورا بعض، يجروا هنا وهناك. الضيوف بدأوا ييجوا. العيال بيجروا في الجنينة.
        ar: يتوافدون، يركضون هنا وهناك. بدأ الضيوف يتوافدون. الأطفال يركضون في الحديقة.
        en: Arrive in numbers, run about. The guests are starting to arrive. The children run about in the park.
      - speaker: Mas Ardi
        text: Berdasarkan. Saya memasak nasi goreng ini berdasarkan resep nenek saya.
        ar_eg: على حسب. أنا طابخ الناسي جورينج ده على حسب وصفة جدتي.
        ar: بناءً على. طبختُ هذا الناسي غورينغ بناءً على وصفة جدتي.
        en: Based on. I cooked this fried rice from my grandmother's recipe.
  - kind: recap
    title: Aduk rata!
    lines:
      - speaker: Mbak Gadis
        text: Mau pesan apa?
        ar_eg: تحب تطلب إيه؟
        ar: ماذا تريد أن تطلب؟
        en: What would you like to order?
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
          ar: ببطء. ردّد كل جملة بعدنا.
          en: Slowly. Repeat each sentence after us.
      - speaker: Mas Ardi
        text: Bu, makanan di sini halal?
        ar_eg: يا مدام، الأكل هنا حلال؟
        ar: يا سيدتي، هل الطعام هنا حلال؟
        en: Is the food here halal?
      - speaker: Mbak Gadis
        text: Bu, makanan di sini halal?
        ar_eg: يا مدام، الأكل هنا حلال؟
        ar: يا سيدتي، هل الطعام هنا حلال؟
        en: Is the food here halal?
      - speaker: Mas Ardi
        text: Saya mau pesan nasi goreng satu. Jangan terlalu pedas, ya.
        ar_eg: عايز واحد ناسي جورينج. متخليهاش حراقة أوي.
        ar: أريد طبق ناسي غورينغ واحدًا. لا تجعليه حارًا جدًا.
        en: I'd like one fried rice. Not too spicy, please.
      - speaker: Mbak Gadis
        text: Saya mau pesan nasi goreng satu. Jangan terlalu pedas, ya.
        ar_eg: عايزة واحد ناسي جورينج. متخليهاش حراقة أوي.
        ar: أريد طبق ناسي غورينغ واحدًا. لا تجعليه حارًا جدًا.
        en: I'd like one fried rice. Not too spicy, please.
      - speaker: Mas Ardi
        text: Pedas sekali, tetapi lezat!
        ar_eg: حراق أوي، بس لذيذ!
        ar: حار جدًا، لكنه لذيذ!
        en: Very spicy, but delicious!
      - speaker: Mbak Gadis
        text: Pedas sekali, tetapi lezat!
        ar_eg: حراق أوي، بس لذيذ!
        ar: حار جدًا، لكنه لذيذ!
        en: Very spicy, but delicious!
      - speaker: Mas Ardi
        text: Cuci dan potong bawang. Panaskan minyak di wajan.
