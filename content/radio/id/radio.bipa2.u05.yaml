  - kind: outro
    title: Resep Mohamed
    lines:
      - speaker: Mbak Gadis
        text: Mohamed, makanan favoritmu apa? Pedas? Manis? Gurih?
        ar_eg: يا محمد، أكلتك المفضلة إيه؟ حراقة؟ مسكّرة؟ طعمها غني؟
        ar: يا محمد، ما طعامك المفضل؟ حار؟ حلو؟ غني الطعم؟
        en: Mohamed, what's your favourite food? Spicy? Sweet? Savoury?
        note:
          ar_eg: دورك! جاوب بصوت عالي بجملة أو اتنين.
          ar: دورك! أجب بصوت مسموع بجملة أو جملتين.
          en: Your turn! Answer out loud in a sentence or two.
      - speaker: Mas Ardi
        text: Makanan favorit saya koshari dari Mesir. Koshari gurih dan sedikit asam. Lezat sekali!
        ar_eg: أكلتي المفضلة الكشري المصري. طعمه غني وحامض شوية. لذيذ أوي!
        ar: طعامي المفضل الكشري المصري. طعمه غني وحامض قليلًا. لذيذ جدًا!
        en: My favourite food is koshari from Egypt. It's savoury and a little sour. Delicious!
      - speaker: Mbak Gadis
        text: Wah, saya belum pernah mencoba koshari! Bagus sekali, Mohamed.
        ar_eg: الله، أنا عمري ما جربت الكشري! برافو عليك يا محمد.
        ar: رائع، لم أجرّب الكشري قط! أحسنت جدًا يا محمد.
        en: Oh, I've never tried koshari! Very good, Mohamed.
      - speaker: Mas Ardi
        text: Besok, coba buat resep. Pertama, lalu, setelah itu. Potong, goreng, aduk!
        ar_eg: بكرة اكتب وصفة. الأول، وبعدين، وبعد كده. قطّع، اقلي، قلّب!
        ar: غدًا اكتب وصفة. أولًا، ثم، بعد ذلك. قطّع، اقلِ، حرّك!
        en: Tomorrow, make a recipe. First, then, after that. Cut, fry, stir!
        note:
          ar_eg: تحدي بكرة الصغير - اكتب وصفة أكلة بتحبها في ست خطوات بصيغة الأمر.
          ar: تحدّي الغد الصغير - اكتب وصفة طبق تحبه في ست خطوات بصيغة الأمر.
          en: Tomorrow's tiny challenge - write a recipe for a dish you love in six steps, using commands.
      - speaker: Mbak Gadis
        text: Terima kasih, Mas Ardi. Nasi gorengmu harum sekali!
        ar_eg: شكرًا يا أردي. الناسي جورينج بتاعك ريحته تجنن!
        ar: شكرًا يا أردي. الناسي غورينغ خاصتك رائحته زكية جدًا!
        en: Thank you, Ardi. Your fried rice smells wonderful!
      - speaker: Mas Ardi
        text: Terima kasih, Mohamed. Selamat makan!
        ar_eg: شكرًا يا محمد. بالهنا والشفا!
        ar: شكرًا يا محمد. بالهناء والشفاء!
        en: Thank you, Mohamed. Enjoy your meal!
      - speaker: Mbak Gadis
        text: Sampai jumpa besok di Kabar Radio, Mohamed!
        ar_eg: أشوفك بكرة في كبار راديو يا محمد!
        ar: إلى اللقاء غدًا في كبار راديو يا محمد!
        en: See you tomorrow on Kabar Radio, Mohamed!
