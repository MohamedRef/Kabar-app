schema: kabar.radio/v1
id: radio.bipa2.u10
language: id
level: bipa2
unit: bipa2.u10
title:
  target: Semoga cepat sembuh!
  ar_eg: ألف سلامة!
  ar: أتمنى لك الشفاء العاجل!
  en: Get well soon!
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Amed
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Amed, di Bali timur! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من أميد، في شرق بالي! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من أميد، في شرق بالي! هذا كبار راديو. أنا تيارا.", en: "Good morning from Amed, in east Bali! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku... uhuk, uhuk... Reza. Sori, aku lagi nggak enak badan.", ar_eg: "وأنا... كح كح... رضا. معلش، أنا تعبان شوية النهارده.", ar: "وأنا... كح كح... رضا. عذرًا، لست على ما يرام اليوم.", en: "And I'm... cough, cough... Reza. Sorry, I'm feeling a bit rough.", note: {ar_eg: "nggak enak badan = «تعبان شوية». أشهر طريقة تقول بيها إنك عيان.", ar: "nggak enak badan = «متوعك قليلًا». أشهر طريقة لقول إنك مريض.", en: "nggak enak badan = 'feeling under the weather' - the usual way to say you're ill."}}
      - {speaker: Kak Tiara, text: "Aduh, kasihan! Kemarin kamu berenang lama banget, terus kehujanan.", ar_eg: "يا حرام! امبارح عمت كتير أوي، وبعدين المطر نزل عليك.", ar: "يا للمسكين! أمس سبحت طويلًا، ثم أصابك المطر.", en: "Oh, poor you! Yesterday you swam for ages, then got caught in the rain."}
      - speaker: Kak Reza
        text: "Iya. Kata ibu kos, aku masuk angin."
        ar_eg: "أيوه. صاحبة البيت بتقول إني «خدت برد»."
        ar: "نعم. تقول صاحبة البيت إنني «دخلتني ريح»."
        en: "Yes. My landlady says I've 'caught the wind'."
        note:
          ar_eg: "masuk angin (حرفيًا «الهوا دخل») هو البرد والتعب في كلام الناس. وعلاجه البيتي جامو أو كيروكان (حك الضهر بعملة)."
          ar: "masuk angin (حرفيًا «دخلت الريح») هو الزكام والتعب في كلام الناس، وعلاجه الشعبي الجامو أو الكيروكان (حكّ الظهر بقطعة نقود)."
          en: "Masuk angin ('the wind got in') is the everyday word for a chill; home remedies are jamu or kerokan (coin-scraping the back)."
      - {speaker: Kak Tiara, text: "Halo, Mohamed! Hari ini kita belajar bilang sakit, ke apotek, sama ke dokter.", ar_eg: "أهلًا يا محمد! النهارده هنتعلم نقول إحنا تعبانين، ونروح الصيدلية والدكتور.", ar: "مرحبًا يا محمد! اليوم نتعلم كيف نقول إننا مرضى، ونذهب إلى الصيدلية والطبيب.", en: "Hello, Mohamed! Today we learn to say we're ill, and go to the pharmacy and the doctor."}
  - kind: dialogue
    title: Di apotek
    lines:
      - speaker: Kak Tiara
        text: "Yuk, ke apotek. Aku jadi apotekernya, ya."
        ar_eg: "يلا نروح الصيدلية. أنا هبقى الصيدلانية."
        ar: "هيا نذهب إلى الصيدلية. سأكون الصيدلانية."
        en: "Come on, let's go to the pharmacy. I'll be the pharmacist."
        note:
          ar_eg: "مشهد تمثيلي: تيارا صيدلانية، ورضا العيّان."
          ar: "مشهد تمثيلي: تيارا صيدلانية، ورضا المريض."
          en: "A role-play: Tiara is the pharmacist, Reza the patient."
      - {speaker: Kak Tiara, text: "Selamat pagi, Pak. Ada yang bisa saya bantu?", ar_eg: "صباح الخير يا أستاذ. أقدر أساعدك في إيه؟", ar: "صباح الخير يا سيدي. هل أستطيع مساعدتك؟", en: "Good morning, sir. Can I help you?"}
      - {speaker: Kak Reza, text: "Pagi, Bu. Saya batuk, pilek. Kepala juga pusing.", ar_eg: "صباح الخير يا دكتورة. عندي كحة وزكام. وراسي كمان بتلف.", ar: "صباح الخير. عندي سعال وزكام، ورأسي يدور أيضًا.", en: "Good morning. I have a cough and a cold. I'm dizzy too."}
      - {speaker: Kak Tiara, text: "Udah berapa hari? Demam, nggak?", ar_eg: "بقالك كام يوم؟ عندك سخونية؟", ar: "منذ كم يوم؟ هل عندك حمّى؟", en: "How many days now? Any fever?", note: {ar_eg: "حتى الصيدلي بيتكلم كده عادي: udah، «..., nggak?».", ar: "حتى الصيدلي يتكلم هكذا عادةً: udah و«..., nggak?».", en: "Even the pharmacist talks like this: udah, '..., nggak?'."}}
      - {speaker: Kak Reza, text: "Baru sehari. Nggak demam, tapi tenggorokan sakit.", ar_eg: "يوم واحد بس. مفيش سخونية، بس زوري واجعني.", ar: "يوم واحد فقط. لا حمّى، لكن حلقي يؤلمني.", en: "Just one day. No fever, but my throat hurts."}
      - {speaker: Kak Tiara, text: "Ini obat batuk sirup. Diminum tiga kali sehari, satu sendok.", ar_eg: "ده شراب كحة. يتشرب تلات مرات في اليوم، معلقة واحدة.", ar: "هذا دواء سعال شراب. يُشرب ثلاث مرات يوميًا، ملعقة واحدة.", en: "Here's cough syrup. Take it three times a day, one spoon."}
      - {speaker: Kak Reza, text: "Sebelum atau sesudah makan?", ar_eg: "قبل الأكل ولا بعده؟", ar: "قبل الطعام أم بعده؟", en: "Before or after meals?"}
      - speaker: Kak Tiara
        text: "Sesudah makan. Ini tablet buat pusing. Diminum kalau perlu aja."
        ar_eg: "بعد الأكل. ودي أقراص للدوخة. تتاخد وقت اللزوم بس."
        ar: "بعد الطعام. وهذه أقراص للدوار، تؤخذ عند الحاجة فقط."
        en: "After meals. And these tablets are for the dizziness. Only take them if needed."
        note:
          ar_eg: "على علب الدوا: diminum = يتشرب، 3 x 1 = تلات مرات في اليوم حباية، sesudah makan = بعد الأكل. كلمات: kalau = لو."
          ar: "على علب الدواء: diminum = يُشرب، 3 x 1 = ثلاث مرات يوميًا حبة واحدة، sesudah makan = بعد الطعام. مفردات: kalau = إذا."
          en: "On medicine labels: diminum = to be taken, 3 x 1 = three times a day, one each, sesudah makan = after meals. Words: kalau = if, when."
      - {speaker: Kak Reza, text: "Jadi berapa, Bu?", ar_eg: "الحساب كام يا دكتورة؟", ar: "كم المجموع؟", en: "How much is it altogether?"}
      - {speaker: Kak Tiara, text: "Empat puluh lima ribu. Banyakin minum air putih, istirahat, ya.", ar_eg: "خمسة وأربعين ألف. اشرب مية كتير وارتاح.", ar: "خمسة وأربعون ألفًا. اشرب ماءً كثيرًا واسترح.", en: "Forty-five thousand. Drink lots of water and rest.", note: {ar_eg: "banyakin = كتّر (من banyak + -in).", ar: "banyakin = أكثِر (من banyak + ‎-in).", en: "banyakin = have more of (banyak + -in)."}}
      - {speaker: Kak Reza, text: "Kalau besok masih sakit?", ar_eg: "ولو بكرة لسه تعبان؟", ar: "وإن بقيت مريضًا غدًا؟", en: "What if I'm still ill tomorrow?"}
      - {speaker: Kak Tiara, text: "Kalau tiga hari belum sembuh, ke dokter, ya.", ar_eg: "لو بعد تلات أيام مخفتش، لازم تروح للدكتور.", ar: "إن لم تُشفَ بعد ثلاثة أيام، يجب أن تذهب إلى الطبيب.", en: "If you're not better in three days, you must see a doctor."}
      - {speaker: Kak Reza, text: "Makasih banyak, Bu.", ar_eg: "شكرًا جزيلًا يا دكتورة.", ar: "شكرًا جزيلًا.", en: "Thank you very much."}
      - {speaker: Kak Tiara, text: "Sama-sama. Semoga cepat sembuh, Pak!", ar_eg: "العفو. ألف سلامة يا أستاذ!", ar: "عفوًا. أتمنى لك الشفاء العاجل!", en: "You're welcome. Get well soon!"}
  - kind: word_spotlight
    title: Sakit perut, pusing, semoga
    lines:
      - {speaker: Kak Reza, text: "Sakit kepala, sakit perut, sakit gigi, sakit tenggorokan.", ar_eg: "صداع، مغص، وجع سنان، وجع زور.", ar: "صداع، ألم بطن، ألم أسنان، ألم حلق.", en: "Headache, stomach ache, toothache, sore throat."}
      - {speaker: Kak Tiara, text: "Pusing, demam, batuk, pilek, mual. Saya mual sesudah naik perahu.", ar_eg: "دوخة، سخونية، كحة، زكام، غمم نفس. أنا اتغم نفسي بعد ما ركبت المركب.", ar: "دوار، حمّى، سعال، زكام، غثيان. أصابني الغثيان بعد ركوب القارب.", en: "Dizzy, fever, cough, runny nose, nausea. I felt sick after the boat ride."}
      - speaker: Kak Reza
        text: "Apotek, obat, resep, dokter. Dokter memberi saya resep."
        ar_eg: "صيدلية، دوا، روشتة، دكتور. الدكتور اداني روشتة."
        ar: "صيدلية، دواء، وصفة طبية، طبيب. أعطاني الطبيب وصفة."
        en: "Pharmacy, medicine, prescription, doctor. The doctor gave me a prescription."
        note:
          ar_eg: "كلمات: resep = روشتة."
          ar: "مفردات: resep = وصفة طبية."
          en: "Words: resep = prescription."
      - speaker: Kak Tiara
        text: "Semoga cepat sembuh! Lekas sembuh, ya!"
        ar_eg: "ألف سلامة! تقوم بالسلامة!"
        ar: "أتمنى لك الشفاء العاجل! شفاك الله سريعًا!"
        en: "Get well soon! Feel better soon!"
        note:
          ar_eg: "semoga = يا رب / إن شاء الله يحصل. semoga sukses = ربنا يوفقك."
          ar: "semoga = عسى / نرجو أن. semoga sukses = أتمنى لك النجاح."
          en: "Semoga = may it be / I hope. Semoga sukses = good luck."
      - speaker: Kak Reza
        text: "Nggak enak badan. Aku lagi nggak enak badan. GWS, ya!"
        ar_eg: "مش مظبوط. أنا تعبان شوية. سلامتك!"
        ar: "لستُ على ما يرام. أنا متوعك. سلامتك!"
        en: "Under the weather. I'm feeling rough. Get well soon!"
        note:
          ar_eg: "GWS = get well soon، الناس بتكتبها في الشات كده بالإنجليزي."
          ar: "GWS = get well soon، ويكتبها الناس في المحادثات بالإنجليزية."
          en: "GWS = get well soon - people type it in English in chat."
      - {speaker: Kak Reza, text: "Jamu, kerokan, masuk angin. Nenek saya selalu minum jamu.", ar_eg: "جامو، كيروكان، خدت برد. جدتي دايمًا بتشرب جامو.", ar: "جامو، كيروكان، زكام. جدتي تشرب الجامو دائمًا.", en: "Jamu, kerokan, a chill. My grandmother always drinks jamu."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Saya batuk dan pilek."
        ar_eg: "عندي كحة وزكام."
        ar: "عندي سعال وزكام."
        en: "I have a cough and a cold."
        note:
          ar_eg: "بالراحة. كرر ورانا كل جملة."
          ar: "ببطء. ردّد كل جملة بعدنا."
          en: "Slowly. Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Saya batuk dan pilek.", ar_eg: "عندي كحة وزكام.", ar: "عندي سعال وزكام.", en: "I have a cough and a cold."}
      - {speaker: Kak Tiara, text: "Tenggorokan saya sakit.", ar_eg: "زوري واجعني.", ar: "حلقي يؤلمني.", en: "My throat hurts."}
      - {speaker: Kak Reza, text: "Tenggorokan saya sakit.", ar_eg: "زوري واجعني.", ar: "حلقي يؤلمني.", en: "My throat hurts."}
      - {speaker: Kak Tiara, text: "Diminum tiga kali sehari, sesudah makan.", ar_eg: "يتشرب تلات مرات في اليوم، بعد الأكل.", ar: "يُشرب ثلاث مرات يوميًا، بعد الطعام.", en: "Take three times a day, after meals."}
      - {speaker: Kak Reza, text: "Diminum tiga kali sehari, sesudah makan.", ar_eg: "يتشرب تلات مرات في اليوم، بعد الأكل.", ar: "يُشرب ثلاث مرات يوميًا، بعد الطعام.", en: "Take three times a day, after meals."}
      - {speaker: Kak Tiara, text: "Semoga cepat sembuh!", ar_eg: "ألف سلامة!", ar: "أتمنى لك الشفاء العاجل!", en: "Get well soon!"}
      - {speaker: Kak Reza, text: "Semoga cepat sembuh!", ar_eg: "ألف سلامة!", ar: "أتمنى لك الشفاء العاجل!", en: "Get well soon!"}
  - kind: outro
    title: Mohamed sehat?
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, kalau kamu masuk angin, kamu minum apa? Obat atau minuman tradisional?"
        ar_eg: "يا محمد، لما بتاخد برد بتشرب إيه؟ دوا ولا مشروب بلدي؟"
        ar: "يا محمد، إذا أصابك الزكام، ماذا تشرب؟ دواء أم مشروبًا تقليديًا؟"
        en: "Mohamed, when you catch a chill, what do you drink? Medicine or a traditional drink?"
        note:
          ar_eg: "دورك! جاوب بصوت عالي بجملتين."
          ar: "دورك! أجب بصوت مسموع بجملتين."
          en: "Your turn! Answer out loud in two sentences."
      - {speaker: Kak Reza, text: "Contohnya: Kalau saya pilek, saya minum teh dengan lemon dan madu. Ibu saya juga membuat sup ayam.", ar_eg: "مثلًا: لما باخد برد، بشرب شاي بلمون وعسل. وماما بتعمل شوربة فراخ.", ar: "مثلًا: إذا أصابني الزكام أشرب الشاي بالليمون والعسل. وأمي تعدّ حساء الدجاج.", en: "For example: When I have a cold, I drink tea with lemon and honey. My mum makes chicken soup too."}
      - {speaker: Kak Tiara, text: "Besok, coba baca label obat di rumahmu. Berapa kali sehari?", ar_eg: "بكرة، اقرا ورقة دوا في بيتك. كام مرة في اليوم؟", ar: "غدًا، اقرأ ملصق دواء في بيتك. كم مرة في اليوم؟", en: "Tomorrow, read a medicine label at home. How many times a day?"}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Jaga kesehatan, ya!", ar_eg: "شكرًا يا محمد. خلي بالك من صحتك!", ar: "شكرًا يا محمد. حافظ على صحتك!", en: "Thank you, Mohamed. Look after yourself!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa di Kabar Radio, dan semoga Kak Reza cepat sembuh!", ar_eg: "أشوفكم في كبار راديو، وألف سلامة على رضا!", ar: "إلى اللقاء في كبار راديو، ونتمنى لرضا الشفاء العاجل!", en: "See you on Kabar Radio, and get well soon, Reza!"}
words: [pusing, demam, batuk, pilek, tenggorokan, apotek, obat, diminum, masuk angin, jamu, gigi, mual, sakit]
