schema: kabar.radio/v1
id: radio.bipa5.u04
language: id
level: bipa5
unit: bipa5.u04
title:
  target: "Katanya, Kairo itu kota ilmu"
  ar_eg: بيقولوا إن القاهرة مدينة العلم
  ar: يقال إن القاهرة مدينة العلم
  en: They say Cairo is a city of learning
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Pagi di Tenggarong
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Tenggarong! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من تنجارونج! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من تنغارونغ! هذا كبار راديو. أنا تيارا.", en: "Good morning from Tenggarong! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Kemarin kami bertemu seorang guru pesantren yang pernah kuliah di Kairo.", ar_eg: "أنا رضا. امبارح قابلنا مدرّس في معهد ديني كان بيدرس في القاهرة.", ar: "أنا رضا. التقينا أمس مدرّسًا في معهد ديني درس في القاهرة.", en: "I'm Reza. Yesterday we met a pesantren teacher who studied in Cairo."}
      - {speaker: Kak Tiara, text: "Mohamed, ini topik untukmu! Banyak santri Indonesia bermimpi belajar di Al-Azhar.", ar_eg: "يا محمد، الموضوع ده بتاعك! طلبة معاهد إندونيسيين كتير بيحلموا يدرسوا في الأزهر.", ar: "يا محمد، هذا موضوعك! كثير من طلبة المعاهد الإندونيسيين يحلمون بالدراسة في الأزهر.", en: "Mohamed, this topic is for you! Many Indonesian santri dream of studying at Al-Azhar."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar melaporkan kata orang lain: katanya, menurut dia, dia bilang bahwa."
        ar_eg: "النهارده هنتعلم ننقل كلام غيرنا: بيقولوا، على حسب كلامه، قال إن."
        ar: "اليوم نتعلم نقل كلام الآخرين: يقال، وفقًا له، قال إنّ."
        en: "Today we learn to report what others said: katanya, menurut dia, dia bilang bahwa."
      - {speaker: Kak Tiara, text: "Mohamed, kamu tinggal dekat Al-Azhar?", ar_eg: "يا محمد، إنت ساكن قريب من الأزهر؟", ar: "يا محمد، هل تسكن قرب الأزهر؟", en: "Mohamed, do you live near Al-Azhar?"}
  - kind: dialogue
    title: Cerita Ustaz Fajar
    lines:
      - speaker: Kak Tiara
        text: "Kak Reza akan menceritakan ulang wawancara dengan Ustaz Fajar."
        ar_eg: "رضا هيحكي تاني المقابلة اللي عملناها مع الأستاذ فجر."
        ar: "سيعيد رضا رواية مقابلتنا مع الأستاذ فجر."
        en: "Reza will retell our interview with Ustaz Fajar."
        note:
          ar_eg: "Ustaz يعني «أستاذ/شيخ» في الدين. خلي بالك من katanya وbahwa."
          ar: "Ustaz بمعنى «الأستاذ/الشيخ» في العلوم الدينية. انتبه إلى katanya وbahwa."
          en: "Ustaz is a religious teacher. Listen for katanya and bahwa."
      - {speaker: Kak Reza, text: "Ustaz Fajar bilang bahwa dia belajar di pesantren sejak umur dua belas tahun.", ar_eg: "الأستاذ فجر قال إنه درس في المعهد من وهو عنده اتناشر سنة.", ar: "قال الأستاذ فجر إنه درس في المعهد منذ سن الثانية عشرة.", en: "Ustaz Fajar said that he studied at a pesantren from the age of twelve."}
      - {speaker: Kak Reza, text: "Katanya, di pesantren dia belajar bahasa Arab setiap hari, dari subuh sampai malam.", ar_eg: "بيقول إنه في المعهد كان بيتعلم عربي كل يوم، من الفجر لحد بالليل.", ar: "يقول إنه كان يتعلم العربية في المعهد يوميًا من الفجر حتى الليل.", en: "He says that at the pesantren he studied Arabic every day, from dawn until night."}
      - {speaker: Kak Tiara, text: "Lalu bagaimana dia bisa ke Kairo?", ar_eg: "وبعدين إزاي قدر يروح القاهرة؟", ar: "ثم كيف وصل إلى القاهرة؟", en: "Then how did he get to Cairo?"}
      - {speaker: Kak Reza, text: "Menurut dia, dia mendapat beasiswa setelah lulus ujian bahasa Arab.", ar_eg: "على حسب كلامه، خد منحة بعد ما نجح في امتحان اللغة العربية.", ar: "بحسب قوله، حصل على منحة بعد اجتيازه امتحان اللغة العربية.", en: "According to him, he got a scholarship after passing an Arabic exam."}
      - {speaker: Kak Tiara, text: "Apa yang paling dia ingat dari Kairo?", ar_eg: "إيه أكتر حاجة فاكرها من القاهرة؟", ar: "ما أكثر ما يتذكره من القاهرة؟", en: "What does he remember most about Cairo?"}
      - {speaker: Kak Reza, text: "Dia bilang dia rindu koshari dan suara azan dari banyak masjid sekaligus.", ar_eg: "قال إنه وحشه الكشري وصوت الأدان من جوامع كتير في نفس الوقت.", ar: "قال إنه يشتاق إلى الكشري وإلى صوت الأذان من مساجد كثيرة في آن واحد.", en: "He said he misses koshari and the sound of the call to prayer from many mosques at once."}
      - {speaker: Kak Reza, text: "Katanya juga, orang Mesir suka bercanda, tetapi dosennya sangat tegas.", ar_eg: "وبيقول كمان إن المصريين بيحبوا الهزار، بس الدكاترة كانوا شديدين جدًا.", ar: "ويقول أيضًا إن المصريين يحبون المزاح، لكن أساتذته كانوا صارمين جدًا.", en: "He also says Egyptians love joking, but his lecturers were very strict."}
      - {speaker: Kak Tiara, text: "Haha! Mohamed, benar begitu?", ar_eg: "هاها! يا محمد، الكلام ده صح؟", ar: "هاها! يا محمد، هل هذا صحيح؟", en: "Haha! Mohamed, is that true?"}
      - {speaker: Kak Reza, text: "Terakhir, dia bertanya apakah kami pernah ke Kairo. Saya jawab belum, tapi ingin sekali.", ar_eg: "وفي الآخر سألنا لو روحنا القاهرة قبل كده. قلتله لسه، بس نفسي أوي.", ar: "وفي الختام سألنا إن كنا زرنا القاهرة، فأجبت: ليس بعد، لكنني أتوق إلى ذلك.", en: "Finally, he asked whether we'd been to Cairo. I said not yet, but I'd love to."}
  - kind: word_spotlight
    title: Katanya
    lines:
      - speaker: Kak Tiara
        text: "Katanya artinya dia bilang, atau orang bilang. Katanya besok hujan."
        ar_eg: "katanya يعني «بيقول» أو «بيقولوا». بيقولوا بكرة هتمطر."
        ar: "katanya بمعنى «يقول» أو «يقال». يقال إن الغد ماطر."
        en: "Katanya means he says, or people say. They say it'll rain tomorrow."
        note:
          ar_eg: "في الكلام الرسمي قول bahwa بعد bilang أو mengatakan: زي «إنّ»."
          ar: "في الأسلوب الرسمي تأتي bahwa بعد bilang أو mengatakan، مثل «إنّ»."
          en: "In formal speech, use bahwa after bilang or mengatakan, like Arabic «إنّ»."
      - {speaker: Kak Reza, text: "Dia mengatakan bahwa…, menurut dia…, dia bertanya apakah…", ar_eg: "قال إن…، على حسب رأيه…، سأل إذا كان…", ar: "قال إنّ…، بحسب رأيه…، سأل هل…", en: "He said that…, according to him…, he asked whether…"}
      - {speaker: Kak Tiara, text: "Pesantren, santri, ustaz, kitab kuning, beasiswa, alumni.", ar_eg: "معهد ديني داخلي، طالب المعهد، أستاذ، الكتب التراثية، منحة، خريجين.", ar: "معهد ديني داخلي، طالب المعهد، أستاذ، الكتب التراثية، منحة، خريجون.", en: "Pesantren, santri, ustaz, classical texts, scholarship, alumni."}
      - {speaker: Kak Reza, text: "Kitab kuning artinya kitab berbahasa Arab klasik. Dulu kertasnya berwarna kuning.", ar_eg: "kitab kuning (الكتاب الأصفر) يعني كتب التراث العربي. زمان ورقها كان أصفر.", ar: "kitab kuning (الكتاب الأصفر) كتب التراث العربي، وكان ورقها قديمًا أصفر.", en: "Kitab kuning means classical Arabic texts. Their paper used to be yellow."}
      - {speaker: Kak Tiara, text: "Sekolah negeri, sekolah swasta, kampus, kuliah, lulus, gelar.", ar_eg: "مدرسة حكومية، مدرسة خاصة، جامعة، دراسة جامعية، يتخرج، شهادة.", ar: "مدرسة حكومية، مدرسة خاصة، حرم جامعي، دراسة جامعية، يتخرج، درجة علمية.", en: "State school, private school, campus, university study, graduate, degree."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Dia bilang bahwa dia belajar di pesantren."
        ar_eg: "قال إنه درس في معهد ديني."
        ar: "قال إنه درس في معهد ديني."
        en: "He said that he studied at a pesantren."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Dia bilang bahwa dia belajar di pesantren.", ar_eg: "قال إنه درس في معهد ديني.", ar: "قال إنه درس في معهد ديني.", en: "He said that he studied at a pesantren."}
      - {speaker: Kak Tiara, text: "Katanya, dosennya sangat tegas.", ar_eg: "بيقول إن الدكاترة كانوا شديدين جدًا.", ar: "يقول إن أساتذته كانوا صارمين جدًا.", en: "He says his lecturers were very strict."}
      - {speaker: Kak Reza, text: "Katanya, dosennya sangat tegas.", ar_eg: "بيقول إن الدكاترة كانوا شديدين جدًا.", ar: "يقول إن أساتذته كانوا صارمين جدًا.", en: "He says his lecturers were very strict."}
      - {speaker: Kak Tiara, text: "Menurut dia, beasiswa itu mengubah hidupnya.", ar_eg: "على حسب كلامه، المنحة دي غيّرت حياته.", ar: "بحسب قوله، غيّرت تلك المنحة حياته.", en: "According to him, that scholarship changed his life."}
      - {speaker: Kak Reza, text: "Menurut dia, beasiswa itu mengubah hidupnya.", ar_eg: "على حسب كلامه، المنحة دي غيّرت حياته.", ar: "بحسب قوله، غيّرت تلك المنحة حياته.", en: "According to him, that scholarship changed his life."}
      - {speaker: Kak Tiara, text: "Dia bertanya apakah kami pernah ke Kairo.", ar_eg: "سألنا لو روحنا القاهرة قبل كده.", ar: "سألنا هل زرنا القاهرة من قبل.", en: "He asked whether we had been to Cairo."}
      - {speaker: Kak Reza, text: "Dia bertanya apakah kami pernah ke Kairo.", ar_eg: "سألنا لو روحنا القاهرة قبل كده.", ar: "سألنا هل زرنا القاهرة من قبل.", en: "He asked whether we had been to Cairo."}
  - kind: outro
    title: Laporan Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan apa kata gurumu dulu tentang sekolah. Mulai dengan: Guru saya bilang bahwa…"
        ar_eg: "يا محمد، احكي مدرسك كان بيقول إيه عن المدرسة. ابدأ بـ: مدرسي قال إن…"
        ar: "يا محمد، احكِ ما قاله معلمك عن الدراسة. ابدأ بـ: قال معلمي إنّ…"
        en: "Mohamed, tell us what your old teacher said about school. Start with: My teacher said that…"
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Guru saya bilang bahwa membaca setiap hari lebih penting daripada menghafal.", ar_eg: "مثلًا: مدرسي قال إن القراية كل يوم أهم من الحفظ.", ar: "مثلًا: قال معلمي إن القراءة اليومية أهم من الحفظ.", en: "For example: My teacher said that reading every day matters more than memorising."}
      - {speaker: Kak Tiara, text: "Besok, bandingkan sekolah di Mesir dan di Indonesia dalam satu paragraf.", ar_eg: "بكرة، قارن بين المدارس في مصر وإندونيسيا في فقرة واحدة.", ar: "غدًا، قارن في فقرة بين المدارس في مصر وإندونيسيا.", en: "Tomorrow, compare schools in Egypt and Indonesia in one paragraph."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Salam untuk Kairo!", ar_eg: "شكرًا يا محمد. سلّملنا على القاهرة!", ar: "شكرًا يا محمد. سلامنا إلى القاهرة!", en: "Thank you, Mohamed. Say hi to Cairo for us!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [katanya, bahwa, menurut dia, pesantren, santri, ustaz, kitab kuning, beasiswa, alumni, lulus, kuliah, sekolah negeri]
review:
  status: draft
  verified: false
  notes: |
    Ustaz Fajar is a one-off role-play figure (not in the cast registry). Spot-check:
    Indonesian students at Al-Azhar commonly come from pesantren; kitab kuning naming.
