schema: kabar.radio/v1
id: radio.bipa1.u02
language: id
level: bipa1
unit: bipa1.u02
title:
  target: Siapa nama Anda?
  ar_eg: اسم حضرتك إيه؟
  ar: ما اسمك؟
  en: What's your name?
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Hai dari Menteng
    lines:
      - speaker: Kak Tiara
        text: Selamat pagi! Selamat datang di Kabar Radio!
        ar_eg: صباح الخير! أهلًا بيك في كبار راديو!
        ar: صباح الخير! أهلًا بك في كبار راديو!
        en: Good morning! Welcome to Kabar Radio!
      - speaker: Kak Reza
        text: Selamat pagi, Kak Tiara! Apa kabar?
        ar_eg: صباح الخير يا تيارا! إزيك؟
        ar: صباح الخير يا تيارا! كيف حالك؟
        en: Good morning, Tiara! How are you?
        note:
          ar_eg: النهارده بيقولوا Mbak وMas قبل الاسم. ده موضوع الحلقة.
          ar: يستخدمان اليوم Mbak وMas قبل الاسم، وهذا من موضوع الحلقة.
          en: Today they use Mbak and Mas before names; that's part of the episode's topic.
      - speaker: Kak Tiara
        text: Baik, terima kasih, Kak Reza. Dan Mas?
        ar_eg: كويسة، شكرًا يا رضا. وإنت؟
        ar: بخير، شكرًا يا رضا. وأنت؟
        en: Fine, thank you, Reza. And you?
      - speaker: Kak Reza
        text: Baik juga. Mbak, kita di mana?
        ar_eg: كويس كمان. إحنا فين يا تيارا؟
        ar: بخير أيضًا. أين نحن يا تيارا؟
        en: Fine too. Where are we, Tiara?
      - speaker: Kak Tiara
        text: Kita di Menteng, di Jakarta.
        ar_eg: إحنا في منتنج، في جاكرتا.
        ar: نحن في منتنغ، في جاكرتا.
        en: We're in Menteng, in Jakarta.
        note:
          ar_eg: منتنج حي هادي وأخضر في وسط جاكرتا، وفيه بيت إعلان الاستقلال.
          ar: منتنغ حيّ هادئ أخضر في وسط جاكرتا، وفيه بيت إعلان الاستقلال.
          en: Menteng is a calm, green district in central Jakarta, home of the Proclamation house.
      - speaker: Kak Reza
        text: Kak Tiara, Mbak dari mana?
        ar_eg: يا تيارا، إنتي منين؟
        ar: يا تيارا، من أين أنتِ؟
        en: Tiara, where are you from?
      - speaker: Kak Tiara
        text: Nama saya Tiara. Saya orang Indonesia, dari Jakarta. Saya tinggal di Menteng.
        ar_eg: اسمي تيارا. أنا إندونيسية، من جاكرتا. ساكنة في منتنج.
        ar: اسمي تيارا. أنا إندونيسية، من جاكرتا. أسكن في منتنغ.
        en: My name is Tiara. I'm Indonesian, from Jakarta. I live in Menteng.
      - speaker: Kak Reza
        text: Nama saya Reza. Saya orang Indonesia juga. Saya dari Bandung, tapi saya tinggal di Jakarta.
        ar_eg: اسمي رضا. أنا إندونيسي كمان. أنا من باندونج، بس ساكن في جاكرتا.
        ar: اسمي رضا. أنا إندونيسي أيضًا. أنا من باندونغ، لكني أسكن في جاكرتا.
        en: My name is Reza. I'm Indonesian too. I'm from Bandung, but I live in Jakarta.
      - speaker: Kak Tiara
        text: Saya guru. Kak Reza karyawan.
        ar_eg: أنا مدرّسة. ورضا موظف.
        ar: أنا معلّمة. ورضا موظّف.
        en: I'm a teacher. Reza is an office worker.
      - speaker: Kak Reza
        text: Ya, saya karyawan. Saya bisa bahasa Indonesia dan bahasa Inggris.
        ar_eg: أيوه، أنا موظف. بتكلم إندونيسي وإنجليزي.
        ar: نعم، أنا موظّف. أتكلم الإندونيسية والإنجليزية.
        en: Yes, I'm an office worker. I speak Indonesian and English.
      - speaker: Kak Tiara
        text: Siapa nama Anda? Anda dari mana? Anda tinggal di mana?
        ar_eg: اسم حضرتك إيه؟ حضرتك منين؟ ساكن فين؟
        ar: ما اسمك؟ من أين أنت؟ أين تسكن؟
        en: What's your name? Where are you from? Where do you live?
        note:
          ar_eg: دي أسئلة الحلقة النهارده.
          ar: هذه أسئلة حلقة اليوم.
          en: These are today's questions.
      - speaker: Kak Reza
        text: Dan Bapak, Ibu, Mas, Mbak.
        ar_eg: وكمان Bapak وIbu وMas وMbak.
        ar: وأيضًا Bapak وIbu وMas وMbak.
        en: And Bapak, Ibu, Mas, Mbak.
      - speaker: Kak Tiara
        text: Hai, Mohamed! Selamat datang di Menteng!
        ar_eg: أهلًا يا محمد! أهلًا بيك في منتنج!
        ar: مرحبًا يا محمد! أهلًا بك في منتنغ!
        en: Hello, Mohamed! Welcome to Menteng!
  - kind: dialogue
    title: Di kursus bahasa
    lines:
      - speaker: Kak Tiara
        text: Selamat pagi, Pak. Mau daftar kursus?
        ar_eg: صباح الخير يا أستاذ. عايز تسجل في كورس؟
        ar: صباح الخير يا سيدي. هل تريد التسجيل في دورة؟
        en: Good morning, sir. Would you like to sign up for a course?
        note:
          ar_eg: مشهد تمثيلي في مدرسة لغة في منتنج. تيارا الموظفة، ورضا بيمثل طالب مصري اسمه أحمد.
          ar: مشهد تمثيلي في مدرسة لغات في منتنغ. تيارا الموظفة، ورضا يؤدي دور طالب مصري اسمه أحمد.
          en: A role-play at a language school in Menteng. Tiara is the receptionist; Reza plays Ahmad, a student from Egypt.
      - speaker: Kak Reza
        text: Pagi, Mbak. Ya, saya mau daftar kursus bahasa Indonesia.
        ar_eg: صباح النور. أيوه، عايز أسجل في كورس إندونيسي.
        ar: صباح النور. نعم، أريد التسجيل في دورة اللغة الإندونيسية.
        en: Morning. Yes, I want to sign up for an Indonesian course.
      - speaker: Kak Tiara
        text: Baik. Formulir pendaftaran, Pak. Siapa nama Bapak?
        ar_eg: تمام. فورم التسجيل يا أستاذ. اسم حضرتك إيه؟
        ar: حسنًا. استمارة التسجيل يا سيدي. ما اسمك؟
        en: OK. The registration form, sir. What's your name?
      - speaker: Kak Reza
        text: Nama saya Ahmad.
        ar_eg: اسمي أحمد.
        ar: اسمي أحمد.
        en: My name is Ahmad.
      - speaker: Kak Tiara
        text: Pak Ahmad dari mana?
        ar_eg: حضرتك منين يا أستاذ أحمد؟
        ar: من أين أنت يا أستاذ أحمد؟
        en: Where are you from, Mr Ahmad?
        note:
          ar_eg: الإندونيسيين بيكلموك باسمك أو بـ Bapak بدل «إنت»، ده أدب.
          ar: يخاطبك الإندونيسيون باسمك أو بكلمة Bapak بدل «أنت» تأدبًا.
          en: Indonesians address you by name or as Bapak instead of "you"; it's polite.
      - speaker: Kak Reza
        text: Saya dari Mesir, dari Kairo. Saya orang Mesir.
        ar_eg: أنا من مصر، من القاهرة. أنا مصري.
        ar: أنا من مصر، من القاهرة. أنا مصري.
        en: I'm from Egypt, from Cairo. I'm Egyptian.
      - speaker: Kak Tiara
        text: Orang Mesir! Bapak bisa bahasa Arab?
        ar_eg: مصري! حضرتك بتتكلم عربي؟
        ar: مصري! هل تتكلم العربية؟
        en: Egyptian! Do you speak Arabic?
      - speaker: Kak Reza
        text: Ya, saya bisa bahasa Arab. Saya juga bisa bahasa Inggris.
        ar_eg: أيوه، بتكلم عربي. وبتكلم إنجليزي كمان.
        ar: نعم، أتكلم العربية. وأتكلم الإنجليزية أيضًا.
        en: Yes, I speak Arabic. I also speak English.
      - speaker: Kak Tiara
        text: Bapak bisa bahasa Indonesia?
        ar_eg: وبتتكلم إندونيسي؟
        ar: وهل تتكلم الإندونيسية؟
        en: Do you speak Indonesian?
      - speaker: Kak Reza
        text: Sedikit, Mbak. Saya bisa bahasa Indonesia sedikit.
        ar_eg: شوية. بتكلم إندونيسي شوية.
        ar: قليلًا. أتكلم الإندونيسية قليلًا.
        en: A little. I speak a little Indonesian.
      - speaker: Kak Tiara
        text: Pekerjaan Bapak apa?
        ar_eg: شغلانة حضرتك إيه؟
        ar: ما عملك؟
        en: What's your job?
      - speaker: Kak Reza
        text: Saya dokter. Tapi di Jakarta saya mahasiswa.
        ar_eg: أنا دكتور. بس في جاكرتا أنا طالب.
        ar: أنا طبيب. لكنني في جاكرتا طالب.
        en: I'm a doctor. But in Jakarta I'm a student.
      - speaker: Kak Tiara
        text: Bapak tinggal di mana? Alamat Bapak di mana?
        ar_eg: حضرتك ساكن فين؟ عنوانك فين؟
        ar: أين تسكن؟ ما عنوانك؟
        en: Where do you live? What's your address?
      - speaker: Kak Reza
        text: Saya tinggal di Menteng, Mbak.
        ar_eg: أنا ساكن في منتنج.
        ar: أسكن في منتنغ.
        en: I live in Menteng.
      - speaker: Kak Tiara
        text: Di Menteng! Saya juga tinggal di Menteng.
        ar_eg: في منتنج! أنا كمان ساكنة في منتنج.
        ar: في منتنغ! وأنا أيضًا أسكن في منتنغ.
        en: In Menteng! I live in Menteng too.
      - speaker: Kak Reza
        text: Maaf, Mbak. Nama Mbak siapa?
        ar_eg: لو سمحتي، اسمك إيه؟
        ar: عفوًا يا آنسة، ما اسمكِ؟
        en: Sorry, what's your name?
      - speaker: Kak Tiara
        text: Nama saya Tiara. Saya guru bahasa Indonesia.
        ar_eg: اسمي تيارا. أنا مدرسة إندونيسي.
        ar: اسمي تيارا. أنا معلّمة لغة إندونيسية.
        en: My name is Tiara. I'm an Indonesian teacher.
      - speaker: Kak Reza
        text: Kak Tiara guru? Salam kenal, Bu Guru!
        ar_eg: إنتي المدرّسة؟ اتشرفت يا أستاذة!
        ar: أنتِ المعلّمة؟ تشرّفت بكِ يا أستاذة!
        en: You're the teacher? Nice to meet you, teacher!
        note:
          ar_eg: الطلبة بيقولوا للمدرّسة «Bu Guru» من باب الاحترام.
          ar: يقول الطلاب للمعلّمة «Bu Guru» احترامًا.
          en: Students call a female teacher "Bu Guru" out of respect.
      - speaker: Kak Tiara
        text: Salam kenal, Pak Ahmad. Bapak mau kopi? Teh?
        ar_eg: اتشرفت يا أستاذ أحمد. تحب قهوة؟ شاي؟
        ar: تشرّفت بك يا أستاذ أحمد. أتريد قهوة؟ أم شايًا؟
        en: Nice to meet you, Mr Ahmad. Would you like coffee? Tea?
      - speaker: Kak Reza
        text: Teh, Mbak. Terima kasih.
        ar_eg: شاي لو سمحتي. شكرًا.
        ar: شايًا من فضلك. شكرًا.
        en: Tea, please. Thank you.
      - speaker: Kak Tiara
        text: Sama-sama. Selamat datang di kursus, Pak Ahmad!
        ar_eg: العفو. أهلًا بيك في الكورس يا أستاذ أحمد!
        ar: عفوًا. أهلًا بك في الدورة يا أستاذ أحمد!
        en: You're welcome. Welcome to the course, Mr Ahmad!
  - kind: word_spotlight
    title: Nama, orang, bahasa
    lines:
      - speaker: Kak Tiara
        text: Nama. Nama.
        ar_eg: اسم. اسم.
        ar: اسم. اسم.
        en: Name. Name.
      - speaker: Kak Reza
        text: Nama saya Reza. Siapa nama Anda?
        ar_eg: اسمي رضا. اسم حضرتك إيه؟
        ar: اسمي رضا. ما اسمك؟
        en: My name is Reza. What's your name?
      - speaker: Kak Tiara
        text: Nama saya Tiara. Nama kamu siapa?
        ar_eg: اسمي تيارا. اسمك إيه؟
        ar: اسمي تيارا. ما اسمك؟
        en: My name is Tiara. What's your name?
        note:
          ar_eg: Siapa nama Anda؟ رسمية، وNama kamu siapa؟ عادية بين الأصحاب.
          ar: Siapa nama Anda؟ رسمية، وNama kamu siapa؟ للأصدقاء.
          en: Siapa nama Anda? is formal; Nama kamu siapa? is casual.
      - speaker: Kak Reza
        text: Orang. Orang Mesir. Orang Indonesia.
        ar_eg: شخص. مصري. إندونيسي.
        ar: شخص. مصري. إندونيسي.
        en: Person. Egyptian. Indonesian.
        note:
          ar_eg: الجسر العربي - Mesir جاية من «مصر». وorang قبل البلد يعمل الجنسية.
          ar: الجسر العربي - Mesir من «مصر». وorang قبل البلد يدلّ على الجنسية.
          en: Arabic Bridge - Mesir comes from «مصر». orang before a country makes a nationality.
      - speaker: Kak Tiara
        text: Mohamed orang Mesir. Rina orang Indonesia. Ni Luh orang Bali.
        ar_eg: محمد مصري. رينا إندونيسية. ني لوه من بالي.
        ar: محمد مصري. رينا إندونيسية. ني لوه من بالي.
        en: Mohamed is Egyptian. Rina is Indonesian. Ni Luh is Balinese.
      - speaker: Kak Reza
        text: Bahasa. Bahasa Arab. Bahasa Inggris. Bahasa Indonesia.
        ar_eg: لغة. عربي. إنجليزي. إندونيسي.
        ar: لغة. العربية. الإنجليزية. الإندونيسية.
        en: Language. Arabic. English. Indonesian.
        note:
          ar_eg: الجسر العربي - Arab جاية من «عرب». bahasa بتيجي قبل اسم اللغة.
          ar: الجسر العربي - Arab من «عرب». وكلمة bahasa تسبق اسم اللغة.
          en: Arabic Bridge - Arab comes from «عرب». bahasa comes before the language name.
      - speaker: Kak Tiara
        text: Saya bisa bahasa Arab sedikit. Mohamed bisa bahasa Arab!
        ar_eg: أنا بتكلم عربي شوية. محمد بيتكلم عربي!
        ar: أتكلم العربية قليلًا. محمد يتكلم العربية!
        en: I speak a little Arabic. Mohamed speaks Arabic!
      - speaker: Kak Reza
        text: Dari mana? Dari mana? Anda dari mana?
        ar_eg: منين؟ منين؟ حضرتك منين؟
        ar: من أين؟ من أين؟ من أين أنت؟
        en: From where? From where? Where are you from?
      - speaker: Kak Tiara
        text: Saya dari Mesir. Saya dari Kairo.
        ar_eg: أنا من مصر. أنا من القاهرة.
        ar: أنا من مصر. أنا من القاهرة.
        en: I'm from Egypt. I'm from Cairo.
      - speaker: Kak Reza
        text: Di mana? Kamu tinggal di mana? Di Menteng.
        ar_eg: فين؟ إنت ساكن فين؟ في منتنج.
        ar: أين؟ أين تسكن؟ في منتنغ.
        en: Where? Where do you live? In Menteng.
      - speaker: Kak Tiara
        text: Alamat. Alamat. Alamat Bapak di mana?
        ar_eg: عنوان. عنوان. عنوان حضرتك فين؟
        ar: عنوان. عنوان. ما عنوانك يا سيدي؟
        en: Address. Address. What's your address, sir?
        note:
          ar_eg: الجسر العربي - alamat جاية من «علامة». المعنى اتغير لـ «عنوان».
          ar: الجسر العربي - alamat من «علامة»، وتحوّل معناها إلى «عنوان».
          en: Arabic Bridge - alamat comes from «علامة» (sign, mark); in Indonesian it means address.
      - speaker: Kak Reza
        text: Pak, Bu, Mas, Mbak.
        ar_eg: يا أستاذ، يا مدام، يا أخ، يا آنسة.
        ar: يا سيدي، يا سيدتي، يا أخي، يا أختي.
        en: Sir, ma'am, Mas, Mbak.
      - speaker: Kak Tiara
        text: Mas, minta kopi, ya. Mbak, minta teh, ya.
        ar_eg: لو سمحت يا أخ، قهوة. لو سمحتي يا آنسة، شاي.
        ar: من فضلك يا أخي، قهوة. من فضلكِ يا أختي، شاي.
        en: Mas, a coffee, please. Mbak, a tea, please.
      - speaker: Kak Reza
        text: Bapak mau apa? Ibu mau kopi?
        ar_eg: حضرتك عايز إيه؟ حضرتك عايزة قهوة؟
        ar: ماذا تريد يا سيدي؟ أتريدين قهوة يا سيدتي؟
        en: What would you like, sir? Would you like coffee, ma'am?
      - speaker: Kak Tiara
        text: Selamat pagi, Pak Irwan! Selamat sore, Bu Yanti! Hai, Kak Reza!
        ar_eg: صباح الخير يا أستاذ إروان! مساء الخير يا مدام يانتي! أهلًا يا رضا!
        ar: صباح الخير يا أستاذ إروان! مساء الخير يا سيدة يانتي! مرحبًا يا رضا!
        en: Good morning, Mr Irwan! Good afternoon, Mrs Yanti! Hello, Reza!
        note:
          ar_eg: Pak وBu للأكبر سنًا أو المحترمين، Mas وMbak للشباب.
          ar: Pak وBu للأكبر سنًّا أو المقام، وMas وMbak للشباب.
          en: Pak and Bu for older or senior people; Mas and Mbak for younger adults.
  - kind: recap
    title: Saya orang Mesir
    lines:
      - speaker: Kak Tiara
        text: Siapa nama Anda?
        ar_eg: اسم حضرتك إيه؟
        ar: ما اسمك؟
        en: What's your name?
        note:
          ar_eg: بالراحة دلوقتي. كرر ورانا كل جملة.
          ar: الآن ببطء. ردّد كل جملة بعدنا.
          en: Slowly now. Repeat each sentence after us.
      - speaker: Kak Reza
        text: Nama saya Mohamed.
        ar_eg: اسمي محمد.
        ar: اسمي محمد.
        en: My name is Mohamed.
      - speaker: Kak Tiara
        text: Anda dari mana?
        ar_eg: حضرتك منين؟
        ar: من أين أنت؟
        en: Where are you from?
      - speaker: Kak Reza
        text: Saya dari Mesir. Saya orang Mesir.
        ar_eg: أنا من مصر. أنا مصري.
        ar: أنا من مصر. أنا مصري.
        en: I'm from Egypt. I'm Egyptian.
      - speaker: Kak Tiara
        text: Anda tinggal di mana?
        ar_eg: حضرتك ساكن فين؟
        ar: أين تسكن؟
        en: Where do you live?
      - speaker: Kak Reza
        text: Saya tinggal di Menteng.
        ar_eg: أنا ساكن في منتنج.
        ar: أسكن في منتنغ.
        en: I live in Menteng.
      - speaker: Kak Tiara
        text: Anda bisa bahasa Indonesia?
        ar_eg: بتتكلم إندونيسي؟
        ar: هل تتكلم الإندونيسية؟
        en: Do you speak Indonesian?
      - speaker: Kak Reza
        text: Ya, sedikit. Saya bisa bahasa Arab dan bahasa Inggris.
        ar_eg: أيوه، شوية. بتكلم عربي وإنجليزي.
        ar: نعم، قليلًا. أتكلم العربية والإنجليزية.
        en: Yes, a little. I speak Arabic and English.
      - speaker: Kak Tiara
        text: Pekerjaan Anda apa?
        ar_eg: شغلتك إيه؟
        ar: ما عملك؟
        en: What's your job?
      - speaker: Kak Reza
        text: Saya mahasiswa.
        ar_eg: أنا طالب.
        ar: أنا طالب.
        en: I'm a student.
      - speaker: Kak Tiara
        text: Nama saya Mohamed. Saya orang Mesir. Saya tinggal di Menteng. Saya mahasiswa. Saya bisa bahasa Indonesia sedikit.
        ar_eg: اسمي محمد. أنا مصري. ساكن في منتنج. أنا طالب. بتكلم إندونيسي شوية.
        ar: اسمي محمد. أنا مصري. أسكن في منتنغ. أنا طالب. أتكلم الإندونيسية قليلًا.
        en: My name is Mohamed. I'm Egyptian. I live in Menteng. I'm a student. I speak a little Indonesian.
      - speaker: Kak Reza
        text: Nama saya Mohamed. Saya orang Mesir. Saya tinggal di Menteng. Saya mahasiswa. Saya bisa bahasa Indonesia sedikit.
        ar_eg: اسمي محمد. أنا مصري. ساكن في منتنج. أنا طالب. بتكلم إندونيسي شوية.
        ar: اسمي محمد. أنا مصري. أسكن في منتنغ. أنا طالب. أتكلم الإندونيسية قليلًا.
        en: My name is Mohamed. I'm Egyptian. I live in Menteng. I'm a student. I speak a little Indonesian.
  - kind: outro
    title: Sampai jumpa besok!
    lines:
      - speaker: Kak Tiara
        text: Mohamed, siapa nama Anda?
        ar_eg: محمد، اسمك إيه؟
        ar: يا محمد، ما اسمك؟
        en: Mohamed, what's your name?
        note:
          ar_eg: دورك! جاوب بصوت عالي.
          ar: دورك! أجب بصوت مسموع.
          en: Your turn! Answer out loud.
      - speaker: Kak Reza
        text: Mohamed dari mana? Mohamed tinggal di mana?
        ar_eg: محمد منين؟ ومحمد ساكن فين؟
        ar: من أين محمد؟ وأين يسكن محمد؟
        en: Where is Mohamed from? Where does Mohamed live?
      - speaker: Kak Tiara
        text: Nama saya Mohamed. Saya dari Mesir. Saya tinggal di Menteng. Baik! Terima kasih, Mohamed.
        ar_eg: اسمي محمد. أنا من مصر. ساكن في منتنج. برافو! شكرًا يا محمد.
        ar: اسمي محمد. أنا من مصر. أسكن في منتنغ. أحسنت! شكرًا يا محمد.
        en: My name is Mohamed. I'm from Egypt. I live in Menteng. Good! Thank you, Mohamed.
      - speaker: Kak Reza
        text: Besok, Mohamed. Nama saya Mohamed. Saya orang Mesir. Saya tinggal di Menteng. Saya mahasiswa. Saya bisa bahasa Arab.
        ar_eg: بكرة يا محمد. اسمي محمد. أنا مصري. ساكن في منتنج. أنا طالب. بتكلم عربي.
        ar: غدًا يا محمد. اسمي محمد. أنا مصري. أسكن في منتنغ. أنا طالب. أتكلم العربية.
        en: Tomorrow, Mohamed. My name is Mohamed. I'm Egyptian. I live in Menteng. I'm a student. I speak Arabic.
        note:
          ar_eg: تحدي بكرة الصغير - عرّف نفسك بخمس جمل قدام المراية أو لحد في البيت.
          ar: تحدّي الغد الصغير - عرّف بنفسك في خمس جمل أمام المرآة أو لأحد في البيت.
          en: Tomorrow's tiny challenge - introduce yourself in five sentences, to the mirror or to someone at home.
      - speaker: Kak Tiara
        text: Terima kasih, Kak Reza. Sampai jumpa besok, Mohamed!
        ar_eg: شكرًا يا رضا. أشوفك بكرة يا محمد!
        ar: شكرًا يا رضا. إلى اللقاء غدًا يا محمد!
        en: Thank you, Reza. See you tomorrow, Mohamed!
      - speaker: Kak Reza
        text: Sampai jumpa di Kabar Radio! Selamat pagi!
        ar_eg: أشوفكم في كبار راديو! صباح الخير!
        ar: إلى اللقاء في كبار راديو! صباح الخير!
        en: See you on Kabar Radio! Have a good morning!
