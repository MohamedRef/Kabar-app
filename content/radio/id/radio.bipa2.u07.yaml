schema: kabar.radio/v1
id: radio.bipa2.u07
language: id
level: bipa2
unit: bipa2.u07
title:
  target: Berselancar di Kuta
  ar_eg: ركوب الموج في كوتا
  ar: ركوب الأمواج في كوتا
  en: Surfing in Kuta
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di pantai Kuta
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari pantai Kuta! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من شط كوتا! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من شاطئ كوتا! هذا كبار راديو. أنا تيارا.", en: "Good morning from Kuta beach! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Pagi ini banyak yang olahraga di pantai.", ar_eg: "وأنا رضا. الصبح ده ناس كتير بيلعبوا رياضة على الشط.", ar: "وأنا رضا. هذا الصباح كثير من الناس يمارسون الرياضة على الشاطئ.", en: "And I'm Reza. This morning lots of people are exercising on the beach.", note: {ar_eg: "في الكلام بيشيلوا ber- كتير: olahraga = berolahraga.", ar: "في الكلام تُحذف ber- كثيرًا: olahraga = berolahraga.", en: "Speech often drops ber-: olahraga = berolahraga."}}
      - {speaker: Kak Tiara, text: "Ada yang berlari, ada yang bersepeda, ada yang berselancar.", ar_eg: "فيه اللي بيجري، واللي راكب عجلة، واللي بيركب الموج.", ar: "هناك من يركض، ومن يركب الدراجة، ومن يركب الأمواج.", en: "Some are running, some are cycling, some are surfing."}
      - speaker: Kak Reza
        text: "Hari ini aku mau belajar selancar. Pertama kali, nih!"
        ar_eg: "النهارده عايز أتعلم ركوب الموج. أول مرة!"
        ar: "اليوم أريد أن أتعلم ركوب الأمواج. أول مرة!"
        en: "Today I want to learn to surf. My first time!"
        note:
          ar_eg: "ber- بتعمل فعل من اسم: sepeda (عجلة) ← bersepeda (يركب عجلة)، selancar ← berselancar."
          ar: "ber- تصنع فعلًا من اسم: sepeda (دراجة) ← bersepeda (يركب دراجة)، وselancar ← berselancar."
          en: "Ber- makes a verb from a noun: sepeda (bike) → bersepeda (to cycle), selancar → berselancar (to surf)."
      - {speaker: Kak Tiara, text: "Halo, Mohamed! Kamu sukanya olahraga apa?", ar_eg: "أهلًا يا محمد! بتحب أنهي رياضة؟", ar: "مرحبًا يا محمد! أي رياضة تحب؟", en: "Hello, Mohamed! Which sport do you like?"}
  - kind: dialogue
    title: Pelatih pantai
    lines:
      - speaker: Kak Tiara
        text: "Reza, aku jadi pelatihnya, ya. Aku udah selancar lima tahun."
        ar_eg: "يا رضا، أنا هبقى المدربة. أنا بركب الموج بقالي خمس سنين."
        ar: "يا رضا، سأكون المدربة. أركب الأمواج منذ خمس سنوات."
        en: "Reza, I'll be the coach. I've been surfing for five years."
        note:
          ar_eg: "مشهد تمثيلي: تيارا مدربة ركوب موج، ورضا تلميذ."
          ar: "مشهد تمثيلي: تيارا مدربة ركوب أمواج، ورضا متعلم."
          en: "A role-play: Tiara is a surf coach, Reza a student."
      - {speaker: Kak Reza, text: "Lima tahun? Dari kapan, Kak?", ar_eg: "خمس سنين؟ من إمتى؟", ar: "خمس سنوات؟ منذ متى؟", en: "Five years? Since when?", note: {ar_eg: "dari kapan = sejak kapan في الكلام.", ar: "dari kapan = sejak kapan في الكلام اليومي.", en: "dari kapan = sejak kapan in speech."}}
      - {speaker: Kak Tiara, text: "Dari kuliah. Sekarang, berdiri sini. Lihat papannya.", ar_eg: "من وأنا في الجامعة. يلا، اقف هنا. بص على اللوح.", ar: "منذ أيام الجامعة. والآن، قف هنا. انظر إلى اللوح.", en: "Since university. Now, stand here. Look at the board."}
      - {speaker: Kak Reza, text: "Papannya panjang banget! Terus aku harus gimana?", ar_eg: "اللوح طويل أوي! أعمل إيه؟", ar: "اللوح طويل جدًا! ماذا أفعل؟", en: "The board is so long! What do I do?"}
      - {speaker: Kak Tiara, text: "Pertama, tiduran di atas papan. Terus dayung pakai dua tangan.", ar_eg: "الأول، نام على اللوح. وبعدين جدّف بإيديك الاتنين.", ar: "أولًا، استلقِ على اللوح. ثم جدّف بكلتا يديك.", en: "First, lie on the board. Then paddle with both hands.", note: {ar_eg: "tiduran = يتمدد (أبسط من berbaring).", ar: "tiduran = يستلقي (أبسط من berbaring).", en: "tiduran = lie down (the everyday berbaring)."}}
      - {speaker: Kak Reza, text: "Tiduran, terus dayung. Oke!", ar_eg: "أنام، وبعدين أجدّف. ماشي!", ar: "أستلقي، ثم أجدّف. حسنًا!", en: "Lie down, then paddle. Okay!"}
      - {speaker: Kak Tiara, text: "Kalau ombak datang, angkat badan dan lompat. Berdiri!", ar_eg: "لما الموجة تيجي، ارفع جسمك ونط. اقف!", ar: "إذا جاءت الموجة، ارفع جسمك واقفز. قف!", en: "When the wave comes, push up and jump. Stand up!"}
      - {speaker: Kak Reza, text: "Aduh! Saya jatuh!", ar_eg: "آه! وقعت!", ar: "آه! سقطت!", en: "Ouch! I fell!"}
      - {speaker: Kak Tiara, text: "Nggak apa-apa. Semua orang jatuh, kok. Tekuk lutut, tangan ke depan.", ar_eg: "ولا يهمك. كل الناس بتقع. اثني ركبك، وإيديك لقدام.", ar: "لا بأس. الجميع يسقطون. اثنِ ركبتيك، ويداك إلى الأمام.", en: "No problem. Everyone falls. Bend your knees, hands forward."}
      - {speaker: Kak Reza, text: "Sekali lagi. Tiduran, dayung, berdiri... Aku berdiri!", ar_eg: "مرة كمان. أنام، أجدّف، أقف... أنا واقف!", ar: "مرة أخرى. أستلقي، أجدّف، أقف... أنا واقف!", en: "Once more. Lie down, paddle, stand... I'm standing!"}
      - {speaker: Kak Tiara, text: "Keren! Udah berapa lama di atas papan?", ar_eg: "جامد! بقالك قد إيه على اللوح؟", ar: "رائع! منذ كم وأنت على اللوح؟", en: "Great! How long have you been on the board?"}
      - {speaker: Kak Reza, text: "Lima detik! Ha ha. Tapi seneng banget!", ar_eg: "خمس ثواني! هههه. بس أنا مبسوط أوي.", ar: "خمس ثوانٍ! هاها. لكنني سعيد جدًا.", en: "Five seconds! Ha ha. But I'm really happy."}
      - {speaker: Kak Tiara, text: "Reza, di Jakarta kamu main bulu tangkis, kan?", ar_eg: "يا رضا، إنت بتلعب ريشة في جاكرتا، صح؟", ar: "يا رضا، أنت تلعب الريشة الطائرة في جاكرتا، أليس كذلك؟", en: "Reza, you play badminton in Jakarta, don't you?"}
      - speaker: Kak Reza
        text: "Iya, tiap Sabtu. Main berdua sama adikku dari tahun lalu."
        ar_eg: "أيوه، كل سبت. بلعب أنا وأخويا الصغير مع بعض من السنة اللي فاتت."
        ar: "نعم، كل سبت. ألعب مع أخي الأصغر نحن الاثنين منذ العام الماضي."
        en: "Yes, every Saturday. I've played with my little brother, just the two of us, since last year."
        note:
          ar_eg: "bulu tangkis (ريشة طايرة) فخر إندونيسيا في الأوليمبياد. وberdua يعني «إحنا الاتنين»."
          ar: "الريشة الطائرة (bulu tangkis) فخر إندونيسيا الأولمبي. وberdua تعني «نحن الاثنين»."
          en: "Badminton (bulu tangkis) is Indonesia's Olympic pride. Berdua means 'the two of us'."
  - kind: word_spotlight
    title: Bersepeda, berdua, bersedih
    lines:
      - {speaker: Kak Tiara, text: "Bersepeda, berselancar, berenang. Saya berenang setiap pagi.", ar_eg: "يركب عجلة، يركب الموج، يعوم. أنا بعوم كل يوم الصبح.", ar: "يركب الدراجة، يركب الأمواج، يسبح. أسبح كل صباح.", en: "Cycle, surf, swim. I swim every morning."}
      - {speaker: Kak Reza, text: "Berkacamata, bertopi. Pelatih itu bertopi merah.", ar_eg: "لابس نضارة، لابس طاقية. المدرب ده لابس طاقية حمرا.", ar: "يرتدي نظارة، يرتدي قبعة. ذلك المدرب يرتدي قبعة حمراء.", en: "Wearing glasses, wearing a hat. That coach wears a red hat."}
      - {speaker: Kak Tiara, text: "Berdua, bertiga. Kami berlari bertiga di pantai.", ar_eg: "إحنا الاتنين، إحنا التلاتة. جرينا إحنا التلاتة على الشط.", ar: "نحن الاثنين، نحن الثلاثة. ركضنا نحن الثلاثة على الشاطئ.", en: "The two of us, the three of us. We ran on the beach, the three of us."}
      - {speaker: Kak Reza, text: "Bersedih, bergembira. Jangan bersedih kalau kamu jatuh!", ar_eg: "يزعل، يفرح. متزعلش لو وقعت!", ar: "يحزن، يفرح. لا تحزن إن سقطت!", en: "Be sad, be glad. Don't be sad if you fall!"}
      - speaker: Kak Tiara
        text: "Sudah berapa lama? Sejak kapan? Saya belajar bahasa Indonesia sejak bulan Januari."
        ar_eg: "بقالك قد إيه؟ من إمتى؟ أنا بتعلم إندونيسي من شهر يناير."
        ar: "منذ كم؟ منذ متى؟ أتعلم الإندونيسية منذ شهر يناير."
        en: "How long? Since when? I've been learning Indonesian since January."
        note:
          ar_eg: "sejak = من (وقت معيّن)، وselama = لمدة. selama dua jam = لمدة ساعتين."
          ar: "sejak = منذ (نقطة زمنية)، وselama = طوال مدة. selama dua jam = لمدة ساعتين."
          en: "Sejak = since (a point in time); selama = for (a length of time). Selama dua jam = for two hours."
      - speaker: Kak Reza
        text: "Udah berapa lama? Dari kapan? Aku belajar bahasa Indonesia dari Januari."
        ar_eg: "بقالك قد إيه؟ من إمتى؟ بتعلم إندونيسي من يناير."
        ar: "منذ متى؟ منذ متى بالضبط؟ أتعلم الإندونيسية منذ يناير."
        en: "How long? Since when? I've been learning Indonesian since January."
        note:
          ar_eg: "في الكلام: udah = sudah، dari kapan = sejak kapan."
          ar: "في الكلام اليومي: udah = sudah، dari kapan = sejak kapan."
          en: "Spoken: udah = sudah, dari kapan = sejak kapan."
      - {speaker: Kak Reza, text: "Angkat tangan! Tekuk lutut! Lompat! Berdiri!", ar_eg: "ارفع إيدك! اثني ركبك! نط! اقف!", ar: "ارفع يدك! اثنِ ركبتك! اقفز! قف!", en: "Raise your hands! Bend your knees! Jump! Stand up!"}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Pertama, berbaring di atas papan."
        ar_eg: "الأول، نام على اللوح."
        ar: "أولًا، استلقِ على اللوح."
        en: "First, lie on the board."
        note:
          ar_eg: "بالراحة. كرر ورانا كل جملة."
          ar: "ببطء. ردّد كل جملة بعدنا."
          en: "Slowly. Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Pertama, berbaring di atas papan.", ar_eg: "الأول، نام على اللوح.", ar: "أولًا، استلقِ على اللوح.", en: "First, lie on the board."}
      - {speaker: Kak Tiara, text: "Lalu dayung dengan kedua tangan.", ar_eg: "وبعدين جدّف بإيديك الاتنين.", ar: "ثم جدّف بكلتا يديك.", en: "Then paddle with both hands."}
      - {speaker: Kak Reza, text: "Lalu dayung dengan kedua tangan.", ar_eg: "وبعدين جدّف بإيديك الاتنين.", ar: "ثم جدّف بكلتا يديك.", en: "Then paddle with both hands."}
      - {speaker: Kak Tiara, text: "Sudah berapa lama kamu bermain bulu tangkis?", ar_eg: "بقالك قد إيه بتلعب ريشة؟", ar: "منذ كم تلعب الريشة الطائرة؟", en: "How long have you played badminton?"}
      - {speaker: Kak Reza, text: "Sudah berapa lama kamu bermain bulu tangkis?", ar_eg: "بقالك قد إيه بتلعب ريشة؟", ar: "منذ كم تلعب الريشة الطائرة؟", en: "How long have you played badminton?"}
      - {speaker: Kak Tiara, text: "Saya bersepeda sejak kecil.", ar_eg: "أنا بركب عجلة من وأنا صغيرة.", ar: "أركب الدراجة منذ الصغر.", en: "I've cycled since I was little."}
      - {speaker: Kak Reza, text: "Saya bersepeda sejak kecil.", ar_eg: "أنا بركب عجلة من وأنا صغير.", ar: "أركب الدراجة منذ الصغر.", en: "I've cycled since I was little."}
      - {speaker: Kak Tiara, text: "Jangan bersedih kalau kamu jatuh.", ar_eg: "متزعلش لو وقعت.", ar: "لا تحزن إن سقطت.", en: "Don't be sad if you fall."}
      - {speaker: Kak Reza, text: "Jangan bersedih kalau kamu jatuh.", ar_eg: "متزعلش لو وقعت.", ar: "لا تحزن إن سقطت.", en: "Don't be sad if you fall."}
  - kind: outro
    title: Olahraga Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, olahraga kesukaanmu apa? Sudah berapa lama kamu melakukannya?"
        ar_eg: "يا محمد، رياضتك المفضلة إيه؟ وبقالك قد إيه بتلعبها؟"
        ar: "يا محمد، ما رياضتك المفضلة؟ ومنذ كم تمارسها؟"
        en: "Mohamed, what's your favourite sport? How long have you done it?"
        note:
          ar_eg: "دورك! جاوب بصوت عالي بجملتين."
          ar: "دورك! أجب بصوت مسموع بجملتين."
          en: "Your turn! Answer out loud in two sentences."
      - {speaker: Kak Reza, text: "Contohnya: Saya suka sepak bola. Saya bermain sepak bola sejak umur sepuluh tahun.", ar_eg: "مثلًا: أنا بحب الكورة. بلعب كورة من وأنا عندي عشر سنين.", ar: "مثلًا: أحب كرة القدم. ألعبها منذ أن كان عمري عشر سنوات.", en: "For example: I like football. I've played football since I was ten."}
      - {speaker: Kak Tiara, text: "Besok, coba jelaskan olahragamu langkah demi langkah: pertama, lalu, akhirnya.", ar_eg: "بكرة، اشرح رياضتك خطوة بخطوة: الأول، وبعدين، وفي الآخر.", ar: "غدًا، اشرح رياضتك خطوة بخطوة: أولًا، ثم، أخيرًا.", en: "Tomorrow, explain your sport step by step: first, then, finally."}
      - {speaker: Kak Reza, text: "Makasih, Kak Pelatih! Besok aku mau berdiri sepuluh detik!", ar_eg: "شكرًا يا كابتن! بكرة عايز أقف عشر ثواني.", ar: "شكرًا أيتها المدربة! غدًا أريد أن أقف عشر ثوانٍ.", en: "Thanks, Coach! Tomorrow I want to stand for ten seconds."}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio, Mohamed!", ar_eg: "أشوفك بكرة في كبار راديو يا محمد!", ar: "إلى اللقاء غدًا في كبار راديو يا محمد!", en: "See you tomorrow on Kabar Radio, Mohamed!"}
words: [bersepeda, berselancar, berenang, berdua, bersedih, berkacamata, sejak, selama, berapa lama, berdiri, lompat, bulu tangkis]
