id: radio.bipa1.u04
language: id
level: bipa1
unit: bipa1.u04
title:
  target: Berapa harganya?
  ar_eg: بكام ده؟
  ar: كم السعر؟
  en: How much is it?
hosts:
  - name: Mbak Gadis
    voice: id-ID-GadisNeural
  - name: Mas Ardi
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Tanah Abang
    lines:
      - speaker: Mbak Gadis
        text: Halo, selamat pagi! Selamat datang di Kabar Radio! Saya Gadis.
        ar_eg: أهلًا، صباح الخير! أهلًا بيك في كبار راديو! أنا جاديس.
        ar: مرحبًا، صباح الخير! أهلًا بك في كبار راديو! أنا غاديس.
        en: Hello, good morning! Welcome to Kabar Radio! I'm Gadis.
      - speaker: Mas Ardi
        text: Dan saya Ardi. Pagi, Mbak Gadis! Sekarang jam berapa?
        ar_eg: وأنا أردي. صباح الخير يا جاديس! الساعة كام دلوقتي؟
        ar: وأنا أردي. صباح الخير يا غاديس! كم الساعة الآن؟
        en: And I'm Ardi. Morning, Gadis! What time is it now?
      - speaker: Mbak Gadis
        text: Sekarang jam tujuh pagi. Hari ini hari Jumat.
        ar_eg: الساعة سبعة الصبح. النهارده الجمعة.
        ar: الساعة الآن السابعة صباحًا. اليوم الجمعة.
        en: It's seven in the morning. Today is Friday.
      - speaker: Mas Ardi
        text: Hari Jumat! Kita di Tanah Abang.
        ar_eg: الجمعة! إحنا في تانا أبانج.
        ar: الجمعة! نحن في تانا أبانغ.
        en: Friday! We're in Tanah Abang.
        note:
          ar_eg: تانا أبانج سوق قماش وهدوم ضخم في جاكرتا، من أكبر الأسواق في جنوب شرق آسيا.
          ar: تانا أبانغ سوق ضخمة للأقمشة والملابس في جاكرتا، من أكبر أسواق جنوب شرق آسيا.
          en: Tanah Abang is Jakarta's huge textile and clothing market, one of the biggest in Southeast Asia.
      - speaker: Mbak Gadis
        text: Ya. Di Tanah Abang banyak toko. Banyak baju, banyak kain batik.
        ar_eg: أيوه. في تانا أبانج محلات كتير. هدوم كتير، وقماش باتيك كتير.
        ar: نعم. في تانا أبانغ محلات كثيرة. ملابس كثيرة، وأقمشة باتيك كثيرة.
        en: Yes. Tanah Abang has lots of shops. Lots of clothes, lots of batik cloth.
      - speaker: Mas Ardi
        text: Satu, dua, tiga. Jam berapa? Berapa harganya?
        ar_eg: واحد، اتنين، تلاتة. الساعة كام؟ بكام؟
        ar: واحد، اثنان، ثلاثة. كم الساعة؟ كم السعر؟
        en: One, two, three. What time is it? How much is it?
        note:
          ar_eg: موضوع النهارده الأرقام، والأسعار، والساعة، والأيام والتواريخ.
          ar: موضوع اليوم الأعداد والأسعار والساعة والأيام والتواريخ.
          en: Today's topic is numbers, prices, the time, days and dates.
      - speaker: Mbak Gadis
        text: Dan hari, tanggal, bulan. Kapan ulang tahunmu?
        ar_eg: وكمان الأيام والتواريخ والشهور. عيد ميلادك إمتى؟
        ar: والأيام والتواريخ والشهور. متى عيد ميلادك؟
        en: And days, dates, months. When's your birthday?
      - speaker: Mas Ardi
        text: Halo, Mohamed! Selamat datang di Tanah Abang!
        ar_eg: أهلًا يا محمد! أهلًا بيك في تانا أبانج!
        ar: مرحبًا يا محمد! أهلًا بك في تانا أبانغ!
        en: Hello, Mohamed! Welcome to Tanah Abang!
  - kind: dialogue
    title: Hadiah untuk Rina
    lines:
      - speaker: Mas Ardi
        text: Permisi, Mbak. Toko ini buka jam berapa?
        ar_eg: لو سمحتي. المحل ده بيفتح الساعة كام؟
        ar: عفوًا يا آنسة. متى يفتح هذا المحل؟
        en: Excuse me. What time does this shop open?
        note:
          ar_eg: مشهد تمثيلي - جاديس بياعة باتيك، وأردي عايز يشتري هدية عيد ميلاد لرينا.
          ar: مشهد تمثيلي - غاديس بائعة باتيك، وأردي يريد شراء هدية عيد ميلاد لرينا.
          en: A role-play - Gadis sells batik, and Ardi wants a birthday present for Rina.
      - speaker: Mbak Gadis
        text: Jam delapan, Mas. Tutup jam lima sore.
        ar_eg: الساعة تمانية. وبيقفل الساعة خمسة العصر.
        ar: الساعة الثامنة. ويغلق الساعة الخامسة مساءً.
        en: At eight. It closes at five in the afternoon.
      - speaker: Mas Ardi
        text: Sekarang jam berapa, Mbak?
        ar_eg: الساعة كام دلوقتي؟
        ar: كم الساعة الآن؟
        en: What time is it now?
      - speaker: Mbak Gadis
        text: Jam delapan lewat seperempat. Toko kami sudah buka, Mas!
        ar_eg: تمانية وربع. المحل فتح خلاص!
        ar: الثامنة والربع. محلّنا مفتوح الآن!
        en: A quarter past eight. Our shop is already open!
      - speaker: Mas Ardi
        text: Terima kasih. Saya mau beli hadiah untuk teman saya.
        ar_eg: شكرًا. أنا عايز أشتري هدية لصاحبتي.
        ar: شكرًا. أريد شراء هدية لصديقتي.
        en: Thank you. I want to buy a present for my friend.
      - speaker: Mbak Gadis
        text: Hadiah ulang tahun? Kapan ulang tahunnya?
        ar_eg: هدية عيد ميلاد؟ عيد ميلادها إمتى؟
        ar: هدية عيد ميلاد؟ متى عيد ميلادها؟
        en: A birthday present? When's her birthday?
      - speaker: Mas Ardi
        text: Hari Sabtu, tanggal dua puluh lima Oktober.
        ar_eg: يوم السبت، خمسة وعشرين أكتوبر.
        ar: يوم السبت، الخامس والعشرين من أكتوبر.
        en: On Saturday, the twenty-fifth of October.
      - speaker: Mbak Gadis
        text: Umurnya berapa, Mas?
        ar_eg: عندها كام سنة؟
        ar: كم عمرها؟
        en: How old is she?
      - speaker: Mas Ardi
        text: Umurnya dua puluh tiga tahun.
        ar_eg: عندها تلاتة وعشرين سنة.
        ar: عمرها ثلاثة وعشرون عامًا.
        en: She's twenty-three.
      - speaker: Mbak Gadis
        text: Ini kain batik, Mas. Kain ini murah.
        ar_eg: ده قماش باتيك. القماش ده رخيص.
        ar: هذا قماش باتيك. هذا القماش رخيص.
        en: Here's some batik cloth. This cloth is cheap.
      - speaker: Mas Ardi
        text: Berapa harganya, Mbak?
        ar_eg: بكام ده؟
        ar: كم سعره؟
        en: How much is it?
      - speaker: Mbak Gadis
        text: Seratus lima puluh ribu rupiah.
        ar_eg: مية وخمسين ألف روبية.
        ar: مئة وخمسون ألف روبية.
        en: One hundred and fifty thousand rupiah.
      - speaker: Mas Ardi
        text: Seratus lima puluh ribu? Mahal, Mbak!
        ar_eg: مية وخمسين ألف؟ غالي كده!
        ar: مئة وخمسون ألفًا؟ هذا غالٍ!
        en: A hundred and fifty thousand? That's expensive!
      - speaker: Mbak Gadis
        text: Seratus dua puluh ribu, ya?
        ar_eg: مية وعشرين ألف، ماشي؟
        ar: مئة وعشرون ألفًا، اتفقنا؟
        en: A hundred and twenty thousand, OK?
      - speaker: Mas Ardi
        text: Seratus ribu, Mbak?
        ar_eg: مية ألف؟
        ar: مئة ألف؟
        en: A hundred thousand?
        note:
          ar_eg: الفصال عادي في سوق تانا أبانج، بس بابتسامة وأدب.
          ar: المساومة أمر عادي في سوق تانا أبانغ، لكن بابتسامة وأدب.
          en: Bargaining is normal at Tanah Abang, done with a smile and politely.
      - speaker: Mbak Gadis
        text: Baik, Mas. Seratus ribu.
        ar_eg: ماشي. مية ألف.
        ar: حسنًا. مئة ألف.
        en: OK. A hundred thousand.
      - speaker: Mas Ardi
        text: Terima kasih, Mbak. Saya beli satu.
        ar_eg: شكرًا. هاخد واحدة.
        ar: شكرًا. سأشتري واحدة.
        en: Thank you. I'll buy one.
      - speaker: Mas Ardi
        text: Dan baju batik ini? Berapa harganya?
        ar_eg: وقميص الباتيك ده؟ بكام؟
        ar: وهذا القميص الباتيك؟ بكم؟
        en: And this batik shirt? How much is it?
      - speaker: Mbak Gadis
        text: Baju ini lima puluh ribu. Dua baju, sembilan puluh ribu.
        ar_eg: القميص ده بخمسين ألف. اتنين بتسعين ألف.
        ar: هذا القميص بخمسين ألفًا. والقميصان بتسعين ألفًا.
        en: This shirt is fifty thousand. Two shirts, ninety thousand.
      - speaker: Mas Ardi
        text: Sembilan puluh ribu untuk dua baju? Murah! Saya beli dua.
        ar_eg: تسعين ألف لاتنين؟ رخيص! هاخد اتنين.
        ar: تسعون ألفًا لقميصين؟ رخيص! سأشتري اثنين.
        en: Ninety thousand for two shirts? Cheap! I'll take two.
      - speaker: Mbak Gadis
        text: Kain seratus ribu, baju sembilan puluh ribu. Seratus sembilan puluh ribu rupiah, Mas.
        ar_eg: القماش بمية ألف، والقمصان بتسعين ألف. مية وتسعين ألف روبية.
        ar: القماش بمئة ألف، والقميصان بتسعين ألفًا. المجموع مئة وتسعون ألف روبية.
        en: The cloth is a hundred thousand, the shirts ninety thousand. One hundred and ninety thousand rupiah.
      - speaker: Mas Ardi
        text: Baik, Mbak. Seratus sembilan puluh ribu.
        ar_eg: تمام. مية وتسعين ألف.
        ar: حسنًا. مئة وتسعون ألفًا.
        en: OK. One hundred and ninety thousand.
      - speaker: Mbak Gadis
        text: Nomor HP Mas berapa? Untuk toko kami.
        ar_eg: رقم موبايلك كام؟ عشان المحل.
        ar: ما رقم هاتفك؟ لأجل المحل.
        en: What's your mobile number? For our shop.
      - speaker: Mas Ardi
        text: Nol delapan satu dua, tiga empat lima, enam tujuh delapan.
        ar_eg: صفر تمانية واحد اتنين، تلاتة أربعة خمسة، ستة سبعة تمانية.
        ar: صفر ثمانية واحد اثنان، ثلاثة أربعة خمسة، ستة سبعة ثمانية.
        en: Zero eight one two, three four five, six seven eight.
        note:
          ar_eg: أرقام التليفون بتتقال رقم رقم. ده رقم وهمي للتمرين.
          ar: تُقرأ أرقام الهاتف رقمًا رقمًا. هذا رقم وهمي للتدريب.
          en: Phone numbers are read digit by digit. This one is made up for practice.
      - speaker: Mbak Gadis
        text: Terima kasih, Mas. Toko kami buka hari Senin sampai hari Sabtu. Hari Minggu tutup.
        ar_eg: شكرًا. محلنا فاتح من الاتنين للسبت. يوم الحد قافل.
        ar: شكرًا. محلّنا مفتوح من الاثنين إلى السبت. ويوم الأحد مغلق.
        en: Thank you. Our shop is open Monday to Saturday. On Sunday it's closed.
      - speaker: Mas Ardi
        text: Baik. Sampai jumpa hari Senin, Mbak!
        ar_eg: تمام. أشوفك يوم الاتنين!
        ar: حسنًا. إلى اللقاء يوم الاثنين!
        en: OK. See you on Monday!
  - kind: word_spotlight
    title: Berapa, jam, hari
    lines:
      - speaker: Mbak Gadis
        text: Berapa. Berapa. Berapa harganya?
        ar_eg: كام. كام. بكام؟
        ar: كم. كم. كم السعر؟
        en: How much. How much. How much is it?
      - speaker: Mas Ardi
        text: Baju ini berapa? Lima puluh ribu. Murah!
        ar_eg: القميص ده بكام؟ خمسين ألف. رخيص!
        ar: بكم هذا القميص؟ خمسون ألفًا. رخيص!
        en: How much is this shirt? Fifty thousand. Cheap!
        note:
          ar_eg: في الكلام الإندونيسيين بيقولوا «ribu» (ألف) ويختصروا كلمة rupiah كتير.
          ar: في الكلام اليومي يقول الإندونيسيون «ribu» (ألف) وكثيرًا ما يحذفون rupiah.
          en: In speech, Indonesians say "ribu" (thousand) and often drop the word rupiah.
      - speaker: Mbak Gadis
        text: Jam. Jam berapa? Jam tujuh pagi. Jam setengah delapan.
        ar_eg: ساعة. الساعة كام؟ سبعة الصبح. سبعة ونص.
        ar: ساعة. كم الساعة؟ السابعة صباحًا. السابعة والنصف.
        en: Hour. What time is it? Seven in the morning. Half past seven.
        note:
          ar_eg: خلي بالك - setengah delapan يعني «نص قبل تمانية» يعني سبعة ونص، مش تمانية ونص!
          ar: انتبه - setengah delapan تعني «نصف نحو الثامنة» أي السابعة والنصف، لا الثامنة والنصف!
          en: Careful - setengah delapan means "half to eight", so 7:30, not 8:30!
      - speaker: Mas Ardi
        text: Setengah delapan. Jam tujuh lewat tiga puluh.
        ar_eg: سبعة ونص. سبعة وتلاتين دقيقة.
        ar: السابعة والنصف. السابعة وثلاثون دقيقة.
        en: Half past seven. Seven thirty.
      - speaker: Mbak Gadis
        text: Waktu. Waktu. Jam tujuh pagi, waktu Jakarta.
        ar_eg: وقت. وقت. سبعة الصبح بتوقيت جاكرتا.
        ar: وقت. وقت. السابعة صباحًا بتوقيت جاكرتا.
        en: Time. Time. Seven in the morning, Jakarta time.
        note:
          ar_eg: الجسر العربي - waktu جاية من «وقت»، وumur جاية من «عُمر».
          ar: الجسر العربي - waktu من «وقت»، وumur من «عُمر».
          en: Arabic Bridge - waktu comes from «وقت», and umur from «عُمر» (age).
      - speaker: Mas Ardi
        text: Hari. Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu.
        ar_eg: يوم. الاتنين، التلات، الأربع، الخميس، الجمعة، السبت، الحد.
        ar: يوم. الاثنين، الثلاثاء، الأربعاء، الخميس، الجمعة، السبت، الأحد.
        en: Day. Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.
        note:
          ar_eg: الجسر العربي - ستة أيام جاية من العربي - Senin الاتنين، Selasa التلات، Rabu الأربع، Kamis الخميس، Jumat الجمعة، Sabtu السبت. أما Minggu فجاية من البرتغالي.
          ar: الجسر العربي - ستة أيام من العربية - Senin الاثنين، Selasa الثلاثاء، Rabu الأربعاء، Kamis الخميس، Jumat الجمعة، Sabtu السبت. أما Minggu فمن البرتغالية.
          en: Arabic Bridge - six day names come from Arabic (Senin, Selasa, Rabu, Kamis, Jumat, Sabtu). Minggu comes from Portuguese.
      - speaker: Mbak Gadis
        text: Hari ini hari apa? Hari ini hari Jumat.
        ar_eg: النهارده إيه؟ النهارده الجمعة.
        ar: ما اليوم؟ اليوم الجمعة.
        en: What day is it today? Today is Friday.
      - speaker: Mas Ardi
        text: Hadiah. Hadiah. Ini hadiah untuk kamu.
        ar_eg: هدية. هدية. دي هدية ليك.
        ar: هدية. هدية. هذه هدية لك.
        en: Present. Present. This is a present for you.
        note:
          ar_eg: الجسر العربي - hadiah جاية من «هدية».
          ar: الجسر العربي - hadiah من «هدية».
          en: Arabic Bridge - hadiah comes from «هدية» (gift).
      - speaker: Mbak Gadis
        text: Ulang tahun. Selamat ulang tahun, Rina!
        ar_eg: عيد ميلاد. كل سنة وإنتي طيبة يا رينا!
        ar: عيد ميلاد. عيد ميلاد سعيد يا رينا!
        en: Birthday. Happy birthday, Rina!
      - speaker: Mas Ardi
        text: Ulang tahun saya tanggal dua belas Maret.
        ar_eg: عيد ميلادي اتناشر مارس.
        ar: عيد ميلادي في الثاني عشر من مارس.
        en: My birthday is the twelfth of March.
  - kind: recap
    title: Satu, dua, tiga
    lines:
      - speaker: Mbak Gadis
        text: Satu, dua, tiga, empat, lima.
        ar_eg: واحد، اتنين، تلاتة، أربعة، خمسة.
        ar: واحد، اثنان، ثلاثة، أربعة، خمسة.
        en: One, two, three, four, five.
        note:
          ar_eg: بالراحة. عِد معانا وكرر الجمل.
          ar: ببطء. عُدّ معنا وردّد الجمل.
          en: Slowly. Count with us and repeat the sentences.
      - speaker: Mas Ardi
        text: Enam, tujuh, delapan, sembilan, sepuluh.
        ar_eg: ستة، سبعة، تمانية، تسعة، عشرة.
        ar: ستة، سبعة، ثمانية، تسعة، عشرة.
        en: Six, seven, eight, nine, ten.
      - speaker: Mbak Gadis
        text: Sebelas, dua belas. Dua puluh. Seratus. Seribu.
        ar_eg: حداشر، اتناشر. عشرين. مية. ألف.
        ar: أحد عشر، اثنا عشر. عشرون. مئة. ألف.
        en: Eleven, twelve. Twenty. A hundred. A thousand.
      - speaker: Mas Ardi
        text: Sekarang jam berapa?
        ar_eg: الساعة كام دلوقتي؟
        ar: كم الساعة الآن؟
        en: What time is it now?
      - speaker: Mbak Gadis
        text: Jam delapan kurang seperempat.
        ar_eg: تمانية إلا ربع.
        ar: الثامنة إلا ربعًا.
        en: A quarter to eight.
      - speaker: Mas Ardi
        text: Jam delapan kurang seperempat.
        ar_eg: تمانية إلا ربع.
        ar: الثامنة إلا ربعًا.
        en: A quarter to eight.
      - speaker: Mbak Gadis
        text: Toko itu buka jam berapa?
        ar_eg: المحل ده بيفتح الساعة كام؟
        ar: متى يفتح ذلك المحل؟
        en: What time does that shop open?
      - speaker: Mas Ardi
        text: Jam delapan pagi. Tutup jam lima sore.
        ar_eg: تمانية الصبح. وبيقفل خمسة العصر.
        ar: الثامنة صباحًا. ويغلق الخامسة مساءً.
        en: At eight in the morning. It closes at five in the afternoon.
      - speaker: Mbak Gadis
        text: Berapa harganya?
        ar_eg: بكام؟
        ar: كم السعر؟
        en: How much is it?
      - speaker: Mas Ardi
        text: Seratus ribu rupiah.
        ar_eg: مية ألف روبية.
        ar: مئة ألف روبية.
        en: One hundred thousand rupiah.
      - speaker: Mbak Gadis
        text: Mahal! Murah!
        ar_eg: غالي! رخيص!
        ar: غالٍ! رخيص!
        en: Expensive! Cheap!
      - speaker: Mas Ardi
        text: Mahal! Murah!
        ar_eg: غالي! رخيص!
        ar: غالٍ! رخيص!
        en: Expensive! Cheap!
      - speaker: Mbak Gadis
        text: Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu.
        ar_eg: الاتنين، التلات، الأربع، الخميس، الجمعة، السبت، الحد.
        ar: الاثنين، الثلاثاء، الأربعاء، الخميس، الجمعة، السبت، الأحد.
        en: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.
      - speaker: Mas Ardi
        text: Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu.
        ar_eg: الاتنين، التلات، الأربع، الخميس، الجمعة، السبت، الحد.
        ar: الاثنين، الثلاثاء، الأربعاء، الخميس، الجمعة، السبت، الأحد.
        en: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.
      - speaker: Mbak Gadis
        text: Hari ini hari apa?
        ar_eg: النهارده إيه؟
        ar: ما اليوم؟
        en: What day is it today?
      - speaker: Mas Ardi
        text: Hari ini hari Jumat.
        ar_eg: النهارده الجمعة.
        ar: اليوم الجمعة.
        en: Today is Friday.
      - speaker: Mbak Gadis
        text: Kapan ulang tahunmu?
        ar_eg: عيد ميلادك إمتى؟
        ar: متى عيد ميلادك؟
        en: When's your birthday?
      - speaker: Mas Ardi
        text: Tanggal dua puluh lima Oktober.
        ar_eg: خمسة وعشرين أكتوبر.
        ar: الخامس والعشرون من أكتوبر.
        en: The twenty-fifth of October.
      - speaker: Mbak Gadis
        text: Selamat ulang tahun!
        ar_eg: كل سنة وإنت طيب!
        ar: عيد ميلاد سعيد!
        en: Happy birthday!
      - speaker: Mas Ardi
        text: Selamat ulang tahun! Ini hadiah untuk kamu.
        ar_eg: كل سنة وإنتي طيبة! دي هدية ليكي.
        ar: عيد ميلاد سعيد! هذه هدية لكِ.
        en: Happy birthday! This is a present for you.
  - kind: outro
    title: Sampai jumpa!
    lines:
      - speaker: Mbak Gadis
        text: Mohamed, kapan ulang tahunmu?
        ar_eg: يا محمد، عيد ميلادك إمتى؟
        ar: يا محمد، متى عيد ميلادك؟
        en: Mohamed, when's your birthday?
        note:
          ar_eg: دورك! جاوب بصوت عالي بالتاريخ بتاعك.
          ar: دورك! أجب بصوت مسموع بتاريخك.
          en: Your turn! Answer out loud with your own date.
      - speaker: Mas Ardi
        text: Ulang tahun saya tanggal dua belas Maret.
        ar_eg: عيد ميلادي اتناشر مارس.
        ar: عيد ميلادي في الثاني عشر من مارس.
        en: My birthday is the twelfth of March.
      - speaker: Mbak Gadis
        text: Dan umurmu berapa, Mohamed?
        ar_eg: وعندك كام سنة يا محمد؟
        ar: وكم عمرك يا محمد؟
        en: And how old are you, Mohamed?
      - speaker: Mas Ardi
        text: Umur saya dua puluh lima tahun. Baik!
        ar_eg: (مثال) عندي خمسة وعشرين سنة. برافو!
        ar: (مثال) عمري خمسة وعشرون عامًا. أحسنت!
        en: (For example) I'm twenty-five years old. Good!
      - speaker: Mbak Gadis
        text: Besok, jam berapa? Jam tujuh pagi! Jam dua belas siang! Jam lima sore!
        ar_eg: بكرة، الساعة كام؟ سبعة الصبح! اتناشر الضهر! خمسة العصر!
        ar: غدًا، كم الساعة؟ السابعة صباحًا! الثانية عشرة ظهرًا! الخامسة مساءً!
        en: Tomorrow, what time is it? Seven in the morning! Twelve noon! Five in the afternoon!
        note:
          ar_eg: تحدي بكرة الصغير - كل ما تبص في الساعة، قول الوقت بالإندونيسي بصوت واطي.
          ar: تحدّي الغد الصغير - كلما نظرت إلى الساعة، قل الوقت بالإندونيسية بصوت خافت.
          en: Tomorrow's tiny challenge - every time you look at a clock, say the time in Indonesian under your breath.
      - speaker: Mas Ardi
        text: Terima kasih, Mohamed. Sampai jumpa besok di Kabar Radio!
        ar_eg: شكرًا يا محمد. أشوفك بكرة في كبار راديو!
        ar: شكرًا يا محمد. إلى اللقاء غدًا في كبار راديو!
        en: Thank you, Mohamed. See you tomorrow on Kabar Radio!
      - speaker: Mbak Gadis
        text: Sampai jumpa hari Sabtu di pesta Rina!
        ar_eg: أشوفكم يوم السبت في حفلة رينا!
        ar: إلى اللقاء يوم السبت في حفلة رينا!
        en: See you on Saturday at Rina's party!
