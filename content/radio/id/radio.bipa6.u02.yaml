schema: kabar.radio/v1
id: radio.bipa6.u02
language: id
level: bipa6
unit: bipa6.u02
title:
  target: Berbalas pantun di Pekanbaru
  ar_eg: مبارزة بانتون في بيكانبارو
  ar: مساجلة البانتون في بيكانبارو
  en: Trading pantun in Pekanbaru
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Tanah Melayu
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Pekanbaru, Riau, tanah Melayu! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من بيكانبارو، رياو، أرض الملايو! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من بيكانبارو في رياو، أرض الملايو! هذا كبار راديو. أنا تيارا.", en: "Good morning from Pekanbaru, Riau, the Malay heartland! This is Kabar Radio. I'm Tiara."}
      - speaker: Kak Reza
        text: "Aku Reza. Di sini, pidato sama acara nikahan sering dibuka pakai pantun."
        ar_eg: "أنا رضا. هنا، الخطب والأفراح غالبًا بتبدأ ببانتون."
        ar: "أنا رضا. هنا كثيرًا ما تُفتتح الخطب والأعراس بالبانتون."
        en: "I'm Reza. Here, speeches and weddings are often opened with pantun."
        note:
          ar_eg: "nikahan = حفلة الجواز (pernikahan في الكلام). كلمات: acara = مناسبة، حفلة؛ dibuka = اتفتح، بيفتح."
          ar: "nikahan = حفل الزفاف (pernikahan في الكلام). مفردات: acara = مناسبة، فعالية؛ dibuka = يُفتَح."
          en: "nikahan = a wedding do (spoken pernikahan). Words: acara = event, occasion; dibuka = to be opened, to open."
      - speaker: Kak Tiara
        text: "Pantun itu puisi empat baris. Tradisinya juga diakui UNESCO, lho."
        ar_eg: "البانتون شعر من أربع سطور. والتقليد ده كمان معترف بيه في اليونسكو."
        ar: "البانتون شعر من أربعة أسطر، وتقليده مُدرج لدى اليونسكو."
        en: "A pantun is a four-line poem. The pantun tradition is also recognised by UNESCO."
        note:
          ar_eg: "كلمات: diakui = معترف بيه."
          ar: "مفردات: diakui = يُعتَرف به."
          en: "Words: diakui = to be recognized, acknowledged."
      - speaker: Kak Reza
        text: "Hari ini kita belajar sampiran sama isi, rima a-b-a-b, terus dikit puisi modern."
        ar_eg: "النهارده هنتعلم المقدمة والمضمون، والقافية أ-ب-أ-ب، وشوية شعر حديث."
        ar: "اليوم نتعلم التمهيد والمضمون، والقافية أ-ب-أ-ب، وشيئًا من الشعر الحديث."
        en: "Today we learn sampiran and isi, the a-b-a-b rhyme, and a little modern poetry."
      - {speaker: Kak Tiara, text: "Mohamed, di Mesir ada tradisi berbalas puisi, nggak?", ar_eg: "يا محمد، في مصر فيه تقليد إن الناس ترد على بعض بالشعر؟", ar: "يا محمد، هل في مصر تقليد للمساجلة الشعرية؟", en: "Mohamed, is there a tradition of trading verses in Egypt?"}
  - kind: dialogue
    title: Berbalas pantun
    lines:
      - speaker: Kak Tiara
        text: "Reza sama aku mau berbalas pantun. Dengerin rimanya, ya."
        ar_eg: "أنا ورضا هنرد على بعض ببانتون. اسمع القافية."
        ar: "سنتساجل أنا ورضا بالبانتون. استمع إلى القافية."
        en: "Reza and I will trade pantun. Listen to the rhyme."
        note:
          ar_eg: "أول سطرين (sampiran) صورة من الطبيعة، وآخر سطرين (isi) هما المعنى."
          ar: "السطران الأولان (sampiran) صورة من الطبيعة، والأخيران (isi) هما المعنى."
          en: "The first two lines (sampiran) are a nature image; the last two (isi) carry the meaning."
      - speaker: Kak Tiara
        text: "Kalau ada sumur di ladang, bolehlah kita menumpang mandi."
        ar_eg: "لو فيه بير في الغيط، نستأذن ونستحمى."
        ar: "إن كان في الحقل بئر، فلنستأذن ونغتسل."
        en: "If there's a well in the field, may we stop and bathe."
        note:
          ar_eg: "كلمات: menumpang = يركب مع حد، ياخد توصيلة."
          ar: "مفردات: menumpang = يركب مع غيره."
          en: "Words: menumpang = to ride with someone, to hitch a ride."
      - speaker: Kak Tiara
        text: "Kalau ada umur panjang, bolehlah kita berjumpa lagi."
        ar_eg: "لو ربنا كتبلنا عمر، نتقابل تاني."
        ar: "وإن طال بنا العمر، فلنلتقِ من جديد."
        en: "If we are granted long life, may we meet again."
        note:
          ar_eg: "كلمات: berjumpa = يقابل، يشوف."
          ar: "مفردات: berjumpa = يلتقي."
          en: "Words: berjumpa = to meet."
      - {speaker: Kak Reza, text: "Bagus! Ladang dan panjang, mandi dan lagi. Rimanya a-b-a-b.", ar_eg: "حلو! ladang وpanjang، وmandi وlagi. القافية أ-ب-أ-ب.", ar: "رائع! ladang مع panjang، وmandi مع lagi؛ القافية أ-ب-أ-ب.", en: "Nice! Ladang and panjang, mandi and lagi. The rhyme is a-b-a-b."}
      - speaker: Kak Reza
        text: "Sekarang giliranku. Berakit-rakit ke hulu, berenang-renang ke tepian."
        ar_eg: "دلوقتي دوري. نجدّف بالطوف للمنبع، ونعوم للشط."
        ar: "والآن دوري: نجدّف بالطوف إلى المنبع، ونسبح إلى الضفة."
        en: "Now me. Rafting upstream, swimming to the shore."
        note:
          ar_eg: "كلمات: berenang-renang = يعوم براحته."
          ar: "مفردات: berenang-renang = يسبح متمهلًا."
          en: "Words: berenang-renang = swimming along."
      - speaker: Kak Reza
        text: "Bersakit-sakit dahulu, bersenang-senang kemudian."
        ar_eg: "نتعب الأول، ونرتاح بعدين."
        ar: "نتعب أولًا، ثم ننعم بعد ذلك."
        en: "Suffer first, enjoy later."
        note:
          ar_eg: "كلمات: bersenang-senang = ينبسط، يتفسّح؛ dahulu = زمان، قبل كده."
          ar: "مفردات: bersenang-senang = يستمتع، يلهو؛ dahulu = سابقًا، قديمًا."
          en: "Words: bersenang-senang = to have fun, to enjoy oneself; dahulu = formerly, in the past."
      - {speaker: Kak Tiara, text: "Itu pantun nasihat. Pas banget buat Mohamed yang rajin belajar!", ar_eg: "ده بانتون نصيحة. مناسب لمحمد اللي بيذاكر بجد!", ar: "هذا بانتون نصيحة، يناسب محمدًا المجتهد!", en: "That's an advice pantun. Perfect for hard-working Mohamed!"}
      - {speaker: Kak Reza, text: "Sekarang puisi modern. Chairil Anwar menulis: Aku ini binatang jalang, dari kumpulannya terbuang.", ar_eg: "دلوقتي شعر حديث. خيريل أنوار كتب: «أنا حيوان شارد، من قطيعه مطرود».", ar: "والآن الشعر الحديث. كتب خيرل أنوار: «أنا وحش شارد، من قطيعه منبوذ».", en: "Now modern poetry. Chairil Anwar wrote: I am a wild beast, cast out from my herd."}
      - {speaker: Kak Tiara, text: "Puisinya bebas, nggak ada sampiran. Isinya keras, berani.", ar_eg: "الشعر ده حر، ما فيهوش مقدمة. معناه جامد وجريء.", ar: "هذا شعر حر بلا تمهيد، ومضمونه قوي جريء.", en: "That poem is free verse, no sampiran. Its content is hard and bold."}
      - speaker: Kak Reza
        text: "Binatang jalang itu majas. Penyairnya kan nggak beneran binatang, ya?"
        ar_eg: "«حيوان شارد» ده مجاز. الشاعر مش حيوان بجد، صح؟"
        ar: "«وحش شارد» مجاز؛ فالشاعر ليس حيوانًا حقًا، أليس كذلك؟"
        en: "Wild beast is a figure of speech. The poet isn't really an animal, right?"
        note:
          ar_eg: "كلمات: beneran = بجد، بجدّ والله."
          ar: "مفردات: beneran = حقًّا، فعلًا."
          en: "Words: beneran = really, for real."
  - kind: word_spotlight
    title: Sampiran dan isi
    lines:
      - speaker: Kak Tiara
        text: "Sampiran: dua baris pertama, sebagai pembuka. Isi: dua baris terakhir, maksud yang sebenarnya."
        ar_eg: "sampiran: أول سطرين، تمهيد. isi: آخر سطرين، المقصود الحقيقي."
        ar: "sampiran: السطران الأولان تمهيدًا. isi: السطران الأخيران، وهما المقصود."
        en: "Sampiran: the first two lines, an opener. Isi: the last two, the real message."
        note:
          ar_eg: "الصعب إن الصوت يتربط، مش المعنى."
          ar: "الصعوبة أن الرابط صوتي لا معنوي."
          en: "The trick is that the link is in sound, not meaning."
      - {speaker: Kak Reza, text: "Rima, baris, bait, penyair, deklamasi.", ar_eg: "قافية، سطر، مقطع، شاعر، إلقاء.", ar: "قافية، سطر، مقطع، شاعر، إلقاء.", en: "Rhyme, line, stanza, poet, recitation."}
      - {speaker: Kak Tiara, text: "Majas: perumpamaan memakai seperti, metafora tanpa seperti, personifikasi.", ar_eg: "المجاز: التشبيه بـseperti (زي)، والاستعارة من غير seperti، والتشخيص.", ar: "المجاز: التشبيه بأداة seperti، والاستعارة بدونها، والتشخيص.", en: "Figures: simile with seperti, metaphor without it, personification."}
      - speaker: Kak Reza
        text: "Syair dan gurindam juga puisi lama Melayu. Gurindam Dua Belas ditulis di Riau."
        ar_eg: "السيعر والجوريندام كمان شعر ملايو قديم. «جوريندام الاتناشر» اتكتب في رياو."
        ar: "والشعر والغوريندام من الشعر الملايوي القديم، وكُتب «غوريندام الاثني عشر» في رياو."
        en: "Syair and gurindam are old Malay poetry too. Gurindam Dua Belas was written in Riau."
        note:
          ar_eg: "كلمات: ditulis = اتكتب."
          ar: "مفردات: ditulis = كُتب."
          en: "Words: ditulis = to be written."
      - {speaker: Kak Tiara, text: "Syair dari kata Arab, syi'r. Mohamed pasti tahu!", ar_eg: "كلمة syair من العربي «شِعر». محمد أكيد عارف!", ar: "syair من العربية «شِعر»، ومحمد يعرف ذلك يقينًا!", en: "Syair comes from Arabic shi'r. Mohamed knows that!"}
      - speaker: Kak Reza
        text: "Pantun itu bahasa resmi lama. Tapi anak muda juga suka pantun lucu: Jalan-jalan ke kota Medan, jangan lupa beli durian!"
        ar_eg: "البانتون لغة قديمة رسمية، بس الشباب بيحبوا البانتون الهزار كمان: لو رحت ميدان، ما تنساش تشتري دوريان!"
        ar: "البانتون لغة قديمة رسمية، لكن الشباب يحبون البانتون المضحك أيضًا: إن ذهبت إلى ميدان فلا تنس شراء الدوريان!"
        en: "Pantun is old, formal language. But young people love silly pantun too: Off on a trip to Medan town, don't forget to buy durian!"
        note:
          ar_eg: "الشباب بيبدأوا البانتون الهزار بـ Jalan-jalan ke… في الشات والكومنتات."
          ar: "يبدأ الشباب البانتون المضحك بـ Jalan-jalan ke… في المحادثات والتعليقات."
          en: "Young people open joke pantun with Jalan-jalan ke… in chats and comments."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Kalau ada sumur di ladang, bolehlah kita menumpang mandi."
        ar_eg: "لو فيه بير في الغيط، نستأذن ونستحمى."
        ar: "إن كان في الحقل بئر، فلنستأذن ونغتسل."
        en: "If there's a well in the field, may we stop and bathe."
        note:
          ar_eg: "كرر ورانا كل سطر."
          ar: "ردّد كل سطر بعدنا."
          en: "Repeat each line after us."
      - {speaker: Kak Reza, text: "Kalau ada sumur di ladang, bolehlah kita menumpang mandi.", ar_eg: "لو فيه بير في الغيط، نستأذن ونستحمى.", ar: "إن كان في الحقل بئر، فلنستأذن ونغتسل.", en: "If there's a well in the field, may we stop and bathe."}
