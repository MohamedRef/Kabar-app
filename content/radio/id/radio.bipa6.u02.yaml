      - {speaker: Kak Reza, text: "Berakit-rakit ke hulu, berenang-renang ke tepian.", ar_eg: "نجدّف بالطوف للمنبع، ونعوم للشط.", ar: "نجدّف بالطوف إلى المنبع، ونسبح إلى الضفة.", en: "Rafting upstream, swimming to the shore."}
