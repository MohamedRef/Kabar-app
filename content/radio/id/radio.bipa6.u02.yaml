  - kind: outro
    title: Pantun Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, buat pantunmu sendiri. Sampiran tentang Sungai Nil, isi tentang belajar."
        ar_eg: "يا محمد، اعمل بانتون بتاعك. المقدمة عن النيل، والمضمون عن المذاكرة."
        ar: "يا محمد، اصنع بانتونك: التمهيد عن النيل، والمضمون عن التعلم."
        en: "Mohamed, make your own pantun. Sampiran about the Nile, isi about learning."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya gini: Perahu kecil di Sungai Nil, angin bertiup dari utara. Belajar sedikit tapi tak pernah berhenti, lama-lama pandai berbicara.", ar_eg: "مثلًا: «مركب صغير في النيل، والريح جاية من الشمال. نتعلم شوية بس ما نبطّلش، ومع الوقت نبقى شطار في الكلام».", ar: "مثلًا: «قارب صغير في النيل، والريح تهب من الشمال. نتعلم قليلًا دون انقطاع، فنبرع في الكلام مع الأيام».", en: "For example: A small boat on the Nile, the wind blows from the north. Learn a little but never stop, and in time you'll speak well."}
      - {speaker: Kak Tiara, text: "Rimanya belum sempurna, tapi semangatnya sempurna banget! Besok, tulis dua pantun lagi, ya.", ar_eg: "القافية مش مظبوطة أوي، بس الحماس مظبوط! بكرة، اكتب بانتونين كمان.", ar: "القافية ليست كاملة، لكن الحماسة كاملة! غدًا اكتب بانتونين آخرين.", en: "The rhyme isn't perfect, but the spirit is! Tomorrow, write two more pantun."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Bolehlah kita berjumpa lagi!", ar_eg: "شكرًا يا محمد. ونتقابل تاني إن شاء الله!", ar: "شكرًا يا محمد. ولنلتقِ من جديد!", en: "Thank you, Mohamed. May we meet again!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [pantun, sampiran, isi, rima, baris, bait, majas, penyair, syair, gurindam, berbalas, deklamasi]
review:
  status: draft
  verified: false
  notes: |
    Traditional pantun ("Kalau ada sumur di ladang", "Berakit-rakit ke hulu") are folk,
    public domain. Chairil Anwar "Aku" (1943) opening lines quoted briefly; spot-check
    wording. Spot-check: UNESCO listing of pantun (2020), Gurindam Dua Belas (Raja Ali
    Haji, Riau). The Nile pantun's rhyme is intentionally imperfect, as Tiara says.
