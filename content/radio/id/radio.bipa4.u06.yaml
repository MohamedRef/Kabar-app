schema: kabar.radio/v1
id: radio.bipa4.u06
language: id
level: bipa4
unit: bipa4.u06
title:
  target: Wisatawan datang, untung atau rugi?
  ar_eg: "السياح جايين: مكسب ولا خسارة؟"
  ar: "قدوم السياح: ربح أم خسارة؟"
  en: Tourists are coming, gain or loss?
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Teluk Palu
    lines:
      - {speaker: Kak Tiara, text: "Selamat sore dari Teluk Palu, Sulawesi Tengah! Ini Kabar Radio. Aku Tiara.", ar_eg: "مساء الخير من خليج بالو، في وسط سولاويسي! ده كبار راديو. أنا تيارا.", ar: "مساء الخير من خليج بالو، في وسط سولاويسي! هذا كبار راديو. أنا تيارا.", en: "Good afternoon from Palu Bay, Central Sulawesi! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Tadi hujan deres, anginnya kenceng, tapi sekarang udah cerah lagi.", ar_eg: "أنا رضا. من شوية كان فيه مطر غزير وريح شديدة، بس دلوقتي السما صافية تاني.", ar: "أنا رضا. قبل قليل هطل مطر غزير وهبّت رياح شديدة، والآن صفت السماء من جديد.", en: "I'm Reza. Earlier there was heavy rain and strong wind, but now the sky's clear again.", note: {ar_eg: "deres = deras، kenceng = kencang في الكلام.", ar: "deres = deras، kenceng = kencang في الكلام اليومي.", en: "deres = deras, kenceng = kencang in speech."}}
      - speaker: Kak Tiara
        text: "Minggu ini ada festival budaya Kaili. Banyak turis datang buat nonton tari sama musik."
        ar_eg: "الأسبوع ده فيه مهرجان ثقافة الكايلي. سياح كتير جايين يتفرجوا على الرقص والمزيكا."
        ar: "هذا الأسبوع مهرجان ثقافة الكايلي، ويأتي سياح كثيرون لمشاهدة الرقص والموسيقى."
        en: "This week there's a Kaili cultural festival. Many tourists come to watch the dances and music."
        note:
          ar_eg: "الكايلي هم أكبر شعب أصلي في منطقة بالو. وفي وادي بادا القريب فيه تماثيل حجر قديمة جدًا محدش يعرف مين عملها."
          ar: "الكايلي أكبر الشعوب الأصلية حول بالو. وفي وادي بادا تماثيل حجرية غامضة أقدم من التاريخ المكتوب."
          en: "The Kaili are the main native people around Palu. In the nearby Bada valley stand mysterious stone statues older than written history."
      - {speaker: Kak Reza, text: "Hari ini kita bahas dampak pariwisata, terus belajar kolokasi, pasangan kata yang pas.", ar_eg: "النهارده هنناقش تأثير السياحة، وهنتعلم المتلازمات، يعني الكلمات اللي بتيجي مع بعض طبيعي.", ar: "اليوم نناقش أثر السياحة ونتعلم المتلازمات اللفظية، أي الكلمات التي تتصاحب طبيعيًا.", en: "Today we discuss tourism's impact and learn collocations, natural word pairs."}
      - {speaker: Kak Tiara, text: "Mohamed, pariwisata bagus buat Mesir, nggak?", ar_eg: "يا محمد، السياحة كويسة لمصر؟", ar: "يا محمد، هل السياحة مفيدة لمصر؟", en: "Mohamed, is tourism good for Egypt?"}
  - kind: dialogue
    title: Dampak pariwisata
    lines:
      - {speaker: Kak Reza, text: "Aku ketemu pemilik homestay di sini. Katanya, sejak festivalnya rame, pendapatannya naik dua kali lipat.", ar_eg: "قابلت صاحب بيت ضيافة هنا. بيقول من ساعة ما المهرجان بقى زحمة، دخله زاد الضعف.", ar: "قابلت صاحب نُزل هنا، قال إن دخله تضاعف منذ ازدحم المهرجان.", en: "I met a homestay owner here. He says since the festival got busy, his income has doubled."}
      - {speaker: Kak Tiara, text: "Itu dampak positif. Pariwisata membuka lapangan kerja: pemandu, sopir, penjual suvenir.", ar_eg: "ده تأثير إيجابي. السياحة بتفتح فرص شغل: مرشدين، سواقين، بياعين هدايا.", ar: "هذا أثر إيجابي. السياحة توفر فرص عمل: مرشدين وسائقين وبائعي تذكارات.", en: "That's a positive impact. Tourism creates jobs: guides, drivers, souvenir sellers."}
      - {speaker: Kak Reza, text: "Terus, anak muda jadi bangga sama budayanya. Mereka belajar nari lagi.", ar_eg: "وكمان الشباب بقوا فخورين بثقافتهم. ورجعوا يتعلموا الرقص.", ar: "إضافة إلى ذلك صار الشباب يفخرون بثقافتهم، وعادوا يتعلمون الرقص.", en: "Also, young people have become proud of their culture. They're learning to dance again."}
      - {speaker: Kak Tiara, text: "Tapi ada sisi negatifnya juga. Harga tanah sama makanan naik tajam.", ar_eg: "بس فيه تأثير سلبي كمان. أسعار الأرض والأكل زادت جامد.", ar: "لكن هناك آثار سلبية أيضًا؛ فقد ارتفعت أسعار الأراضي والطعام ارتفاعًا حادًا.", en: "But there are negative impacts too. Land and food prices have risen sharply."}
      - {speaker: Kak Reza, text: "Bener. Sampahnya juga nambah. Terus kadang upacara adat cuma jadi tontonan.", ar_eg: "مظبوط. والزبالة كمان زادت. وساعات الطقوس التقليدية بتتحول لفرجة وبس.", ar: "صحيح. وازدادت القمامة، وأحيانًا تتحول الطقوس التقليدية إلى مجرد عرض.", en: "Right. Rubbish has increased too. And sometimes customary rituals become mere shows."}
      - {speaker: Kak Tiara, text: "Jadi, pariwisata berkelanjutan itu kayak gimana?", ar_eg: "طيب، إزاي تبقى السياحة مستدامة؟", ar: "إذن، كيف تكون السياحة مستدامة؟", en: "So, what does sustainable tourism look like?"}
      - {speaker: Kak Reza, text: "Menurutku, warga lokal harus ikut ambil keputusan, terus dapat untungnya juga.", ar_eg: "في رأيي، أهل المكان لازم يشاركوا في القرار وياخدوا نصيبهم من المكسب.", ar: "في رأيي، يجب أن يشارك السكان المحليون في اتخاذ القرار وأن ينالوا نصيبًا من الأرباح.", en: "In my view, local people must share in decisions and in the profits."}
      - {speaker: Kak Tiara, text: "Turisnya juga harus hormat sama adat. Misalnya, izin dulu sebelum foto.", ar_eg: "والسياح لازم يحترموا العادات. مثلًا، يستأذنوا قبل ما يصوّروا.", ar: "وعلى السياح احترام العادات، مثل الاستئذان قبل التصوير.", en: "And tourists must respect customs. For example, ask before taking photos."}
      - {speaker: Kak Reza, text: "Setuju. Dampaknya gede, jadi rencananya harus mateng.", ar_eg: "موافق. التأثير كبير، فالتخطيط لازم يبقى مدروس كويس.", ar: "أوافق. الأثر كبير، فيجب أن يكون التخطيط محكمًا.", en: "I agree. The impact is big, so the planning must be thorough."}
      - {speaker: Kak Tiara, text: "Eh, lihat! Penarinya mulai naik panggung. Kostumnya warna-warni banget!", ar_eg: "بص يا رضا! الراقصين بدأوا يطلعوا المسرح. هدومهم ملونة.", ar: "انظر يا رضا! بدأ الراقصون يصعدون المسرح بأزياء ملوّنة.", en: "Look! The dancers are coming on stage. Their costumes are so colourful."}
      - {speaker: Kak Reza, text: "Tepuk tangan meriah dari penonton! Suasananya luar biasa.", ar_eg: "تصفيق حار من الجمهور! الجو خرافي.", ar: "تصفيق حار من الجمهور! الأجواء رائعة.", en: "Warm applause from the audience! What an atmosphere."}
  - kind: word_spotlight
    title: Hujan deras, angin kencang
    lines:
      - speaker: Kak Tiara
        text: "Hujan deras, bukan hujan keras. Angin kencang, bukan angin cepat."
        ar_eg: "hujan deras (مطر غزير)، مش hujan keras. angin kencang (ريح شديدة)، مش angin cepat."
        ar: "hujan deras (مطر غزير)، لا hujan keras. وangin kencang (ريح شديدة)، لا angin cepat."
        en: "Hujan deras (heavy rain), not hujan keras. Angin kencang (strong wind), not angin cepat."
        note:
          ar_eg: "المتلازمات زي «مطر غزير» و«حر شديد» في العربي: الكلمتين بييجوا مع بعض كده ومينفعش تبدّل."
          ar: "المتلازمات كقولنا «مطر غزير» و«حرّ شديد»: كلمتان تتصاحبان ولا تُستبدلان."
          en: "Collocations are like Arabic «مطر غزير»: the words just go together and can't be swapped."
      - speaker: Kak Reza
        text: "Kalau ngobrol: hujan deres, angin kenceng. Pasangannya sama, bunyinya lebih santai."
        ar_eg: "في الكلام: hujan deres وangin kenceng. نفس الأزواج، بس النطق أخف."
        ar: "في الكلام: hujan deres وangin kenceng. الأزواج نفسها، لكن النطق أخف."
        en: "In conversation: hujan deres, angin kenceng. Same pairs, more relaxed sound."
      - {speaker: Kak Reza, text: "Naik tajam, turun drastis. Harga naik tajam.", ar_eg: "زاد جامد، نزل بشدة. الأسعار زادت جامد.", ar: "ارتفع بحدة، انخفض بشدة. ارتفعت الأسعار بحدة.", en: "Rise sharply, fall drastically. Prices rose sharply."}
      - {speaker: Kak Tiara, text: "Tepuk tangan meriah, sambutan hangat, perhatian penuh.", ar_eg: "تصفيق حار، استقبال دافي، انتباه كامل.", ar: "تصفيق حار، استقبال دافئ، انتباه تام.", en: "Warm applause, a warm welcome, full attention."}
      - {speaker: Kak Reza, text: "Mengambil keputusan, membuka lapangan kerja, menarik wisatawan.", ar_eg: "ياخد قرار، يفتح فرص شغل، يجذب سياح.", ar: "يتخذ قرارًا، يوفر فرص عمل، يجذب السياح.", en: "Make a decision, create jobs, attract tourists."}
      - {speaker: Kak Tiara, text: "Dampak positif, dampak negatif, pariwisata berkelanjutan, warga lokal.", ar_eg: "تأثير إيجابي، تأثير سلبي، سياحة مستدامة، أهل المكان.", ar: "أثر إيجابي، أثر سلبي، سياحة مستدامة، سكان محليون.", en: "Positive impact, negative impact, sustainable tourism, local people."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Pariwisata membuka lapangan kerja."
        ar_eg: "السياحة بتفتح فرص شغل."
        ar: "السياحة توفر فرص عمل."
        en: "Tourism creates jobs."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Pariwisata membuka lapangan kerja.", ar_eg: "السياحة بتفتح فرص شغل.", ar: "السياحة توفر فرص عمل.", en: "Tourism creates jobs."}
      - {speaker: Kak Tiara, text: "Harga tanah naik tajam.", ar_eg: "سعر الأرض زاد جامد.", ar: "ارتفعت أسعار الأراضي بحدة.", en: "Land prices rose sharply."}
      - {speaker: Kak Reza, text: "Harga tanah naik tajam.", ar_eg: "سعر الأرض زاد جامد.", ar: "ارتفعت أسعار الأراضي بحدة.", en: "Land prices rose sharply."}
      - {speaker: Kak Tiara, text: "Warga lokal harus ikut mengambil keputusan.", ar_eg: "أهل المكان لازم يشاركوا في القرار.", ar: "يجب أن يشارك السكان المحليون في اتخاذ القرار.", en: "Local people must share in decisions."}
      - {speaker: Kak Reza, text: "Warga lokal harus ikut mengambil keputusan.", ar_eg: "أهل المكان لازم يشاركوا في القرار.", ar: "يجب أن يشارك السكان المحليون في اتخاذ القرار.", en: "Local people must share in decisions."}
      - {speaker: Kak Tiara, text: "Tadi hujan deras dan angin kencang.", ar_eg: "من شوية كان فيه مطر غزير وريح شديدة.", ar: "قبل قليل هطل مطر غزير وهبّت رياح شديدة.", en: "Earlier there was heavy rain and strong wind."}
      - {speaker: Kak Reza, text: "Tadi hujan deras dan angin kencang.", ar_eg: "من شوية كان فيه مطر غزير وريح شديدة.", ar: "قبل قليل هطل مطر غزير وهبّت رياح شديدة.", en: "Earlier there was heavy rain and strong wind."}
  - kind: outro
    title: Pendapat Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, sebutkan satu dampak positif dan satu dampak negatif pariwisata di kotamu."
        ar_eg: "يا محمد، قول تأثير إيجابي وتأثير سلبي للسياحة في مدينتك."
        ar: "يا محمد، اذكر أثرًا إيجابيًا وأثرًا سلبيًا للسياحة في مدينتك."
        en: "Mohamed, name one positive and one negative impact of tourism in your city."
        note:
          ar_eg: "دورك! استخدم متلازمة واحدة على الأقل."
          ar: "دورك! استعمل متلازمة لفظية واحدة على الأقل."
          en: "Your turn! Use at least one collocation."
      - {speaker: Kak Reza, text: "Contohnya: Di Luxor, pariwisata membuka lapangan kerja. Tetapi pada musim ramai, harga hotel naik tajam.", ar_eg: "مثلًا: في الأقصر، السياحة بتفتح فرص شغل. بس في الموسم، أسعار الفنادق بتزيد جامد.", ar: "مثلًا: في الأقصر توفر السياحة فرص عمل، لكن أسعار الفنادق ترتفع بحدة في الموسم.", en: "For example: In Luxor, tourism creates jobs. But in high season, hotel prices rise sharply."}
      - {speaker: Kak Tiara, text: "Besok, tulis teks eksposisi pendek: Pariwisata, untung atau rugi?", ar_eg: "بكرة، اكتب نص شرح قصير: السياحة، مكسب ولا خسارة؟", ar: "غدًا، اكتب نصًا تفسيريًا قصيرًا: السياحة، ربح أم خسارة؟", en: "Tomorrow, write a short exposition: Tourism, gain or loss?"}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Dah!", ar_eg: "شكرًا يا محمد. سلام!", ar: "شكرًا يا محمد. إلى اللقاء!", en: "Thank you, Mohamed. Bye!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [wisatawan, dampak, berkelanjutan, lapangan kerja, kencang]
