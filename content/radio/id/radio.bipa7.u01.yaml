schema: kabar.radio/v1
id: radio.bipa7.u01
language: id
level: bipa7
unit: bipa7.u01
title:
  target: Kabar dari Sorong
  ar_eg: أخبار من سورونج
  ar: أنباء من سورونغ
  en: News from Sorong
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Selamat datang di Papua
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Sorong, Papua Barat Daya! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من سورونج، جنوب غرب بابوا! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من سورونغ، جنوب غرب بابوا! هذا كبار راديو. أنا تيارا.", en: "Good morning from Sorong, Southwest Papua! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Ini pulau terakhir perjalanan kita. Hari ini kita siaran dari studio radio lokal.", ar_eg: "أنا رضا. دي آخر جزيرة في رحلتنا. النهارده بنذيع من استوديو راديو محلي.", ar: "أنا رضا. هذه آخر جزيرة في رحلتنا، ونبث اليوم من استوديو إذاعة محلية.", en: "I'm Reza. This is the last island of our journey. Today we're broadcasting from a local radio studio."}
      - {speaker: Kak Tiara, text: "Kaka Yohana, wartawan di sini, minjemin studionya. Makasih banyak, Kaka!", ar_eg: "كاكا يوهانا، الصحفية هنا، سلفتنا الاستوديو بتاعها. شكرًا يا كاكا!", ar: "أعارتنا كاكا يوهانا، الصحفية هنا، استوديوها. شكرًا يا كاكا!", en: "Kaka Yohana, a reporter here, lent us her studio. Thank you, Kaka!"}
      - speaker: Kak Reza
        text: "Hari ini kita belajar bahasa berita: judul, teras berita, sama unsur 5W 1H."
        ar_eg: "النهارده هنتعلم لغة الأخبار: العنوان، ومقدمة الخبر، والأسئلة الستة: مين، إيه، فين، امتى، ليه، إزاي."
        ar: "اليوم نتعلم لغة الأخبار: العنوان، والمقدمة، والأسئلة الستة: من، ماذا، أين، متى، لماذا، كيف."
        en: "Today we learn news language: headlines, the lead, and the 5W 1H."
        note:
          ar_eg: "كلمات: berita = أخبار، خبر؛ teras = مقدمة الخبر (teras berita)."
          ar: "مفردات: berita = خبر، أخبار؛ teras = مقدمة الخبر (teras berita)."
          en: "Words: berita = news; teras = the lead of a news story (teras berita)."
      - speaker: Kak Tiara
        text: "Mohamed, tadi pagi kamu baca berita apa?"
        ar_eg: "يا محمد، قريت إيه في الأخبار الصبح ده؟"
        ar: "يا محمد، أي خبر قرأت هذا الصباح؟"
        en: "Mohamed, what news did you read this morning?"
        note:
          ar_eg: "كلمات: baca = يقرا، اقرا."
          ar: "مفردات: baca = يقرأ."
          en: "Words: baca = to read, read."
  - kind: dialogue
    title: Siaran berita
    lines:
      - speaker: Kak Tiara
        text: "Reza mau bacain berita kayak penyiar beneran. Berita itu selalu resmi, ya. Dengerin susunannya."
        ar_eg: "رضا هيقرا خبر زي المذيع بجد. الأخبار دايمًا رسمي. اسمع ترتيبه."
        ar: "سيقرأ رضا خبرًا كمذيع حقيقي. الأخبار رسمية دائمًا. استمع إلى ترتيبه."
        en: "Reza will read the news like a real newsreader. News is always formal. Listen to its structure."
        note:
          ar_eg: "الخبر متألف للحلقة. الأهم الأول، وبعدين التفاصيل. كلمات: penyiar = مذيع؛ beneran = بجد، بجدّ والله."
          ar: "الخبر مؤلف للحلقة: الأهم أولًا ثم التفاصيل. مفردات: penyiar = مُذيع؛ beneran = حقًّا، فعلًا."
          en: "The news item is invented for the episode. Most important first, then details. Words: penyiar = broadcaster, announcer; beneran = really, for real."
      - speaker: Kak Reza
        text: "Pemirsa, eh, para pendengar. Pemuda Sorong meraih juara pertama lomba aplikasi tingkat nasional."
        ar_eg: "حضرات المشاهدين، قصدي المستمعين. شباب من سورونج خدوا المركز الأول في مسابقة أبلكيشنز على مستوى الدولة."
        ar: "أعزاءنا المشاهدين، عفوًا، المستمعين: فاز شباب من سورونغ بالمركز الأول في مسابقة وطنية للتطبيقات."
        en: "Viewers, er, listeners. Young people from Sorong have won first place in a national app competition."
        note:
          ar_eg: "كلمات: pemuda = شاب، شباب؛ eh = بقولك إيه."
          ar: "مفردات: pemuda = شاب، الشباب؛ eh = اسمع."
          en: "Words: pemuda = young man, youth; eh = hey."
      - {speaker: Kak Reza, text: "Tiga siswa SMA membuat aplikasi untuk mengajarkan bahasa daerah Papua kepada anak-anak.", ar_eg: "تلات طلبة ثانوي عملوا أبلكيشن يعلّم العيال لغات بابوا المحلية.", ar: "صمم ثلاثة طلاب ثانويين تطبيقًا لتعليم الأطفال لغات بابوا المحلية.", en: "Three high-school students made an app that teaches Papuan regional languages to children."}
      - speaker: Kak Reza
        text: "Lomba itu diadakan di Jakarta pada hari Sabtu lalu dan diikuti oleh ratusan peserta."
        ar_eg: "المسابقة اتعملت في جاكرتا السبت اللي فات، واشترك فيها مئات."
        ar: "أقيمت المسابقة في جاكرتا يوم السبت الماضي بمشاركة المئات."
        en: "The contest was held in Jakarta last Saturday, with hundreds of entrants."
        note:
          ar_eg: "كلمات: diikuti = شارك فيه، اتبعه؛ jakarta = جاكرتا، عاصمة إندونيسيا."
          ar: "مفردات: diikuti = شارك فيه، تبعه؛ jakarta = جاكرتا، عاصمة إندونيسيا."
          en: "Words: diikuti = taken part in; followed; jakarta = Jakarta, the capital of Indonesia."
      - {speaker: Kak Reza, text: "Menurut salah satu pembuatnya, mereka ingin bahasa ibu tetap hidup di zaman digital.", ar_eg: "على حسب واحد من اللي عملوه، هما عايزين لغة الأم تفضل عايشة في زمن الديجيتال.", ar: "وبحسب أحد المطورين، يريدون أن تبقى لغة الأم حية في العصر الرقمي.", en: "According to one of its makers, they want mother tongues to stay alive in the digital age."}
      - {speaker: Kak Tiara, text: "Mantap! Siapa: tiga siswa. Apa: juara lomba aplikasi. Di mana: Jakarta. Kapan: Sabtu lalu.", ar_eg: "حلو! مين: تلات طلبة. إيه: كسبوا مسابقة أبلكيشنز. فين: جاكرتا. امتى: السبت اللي فات.", ar: "رائع! من: ثلاثة طلاب. ماذا: فازوا بمسابقة تطبيقات. أين: جاكرتا. متى: السبت الماضي.", en: "Great! Who: three students. What: won an app contest. Where: Jakarta. When: last Saturday."}
      - {speaker: Kak Reza, text: "Mengapa: agar bahasa ibu tetap hidup. Bagaimana: lewat aplikasi untuk anak-anak.", ar_eg: "ليه: عشان لغة الأم تفضل عايشة. إزاي: عن طريق أبلكيشن للعيال.", ar: "لماذا: لتبقى لغة الأم حية. كيف: بتطبيق للأطفال.", en: "Why: to keep mother tongues alive. How: through an app for children."}
      - speaker: Kak Tiara
        text: "Jadi inget Sumpah Pemuda tahun 1928. Pemuda berjanji: berbahasa satu, bahasa Indonesia."
        ar_eg: "ده بيفكرنا بقسم الشباب سنة 1928. الشباب وعدوا: لغة واحدة، الإندونيسي."
        ar: "يذكّرنا هذا بقسم الشباب عام 1928، حين تعهد الشباب بلغة واحدة: الإندونيسية."
        en: "That reminds us of the Youth Pledge of 1928. Young people pledged: one language, Indonesian."
        note:
          ar_eg: "كلمات: berbahasa = يتكلم لغة؛ inget = ingat: فاكر."
          ar: "مفردات: berbahasa = يتكلّم لغةً؛ inget = ingat: يتذكر."
          en: "Words: berbahasa = to speak; inget = ingat: remember."
      - speaker: Kak Reza
        text: "Terus sekarang, anak muda Papua jaga bahasa daerah juga. Dua-duanya penting, kan?"
        ar_eg: "ودلوقتي، شباب بابوا بيحافظوا على اللغات المحلية كمان. الاتنين مهمين."
        ar: "واليوم يحافظ شباب بابوا على اللغات المحلية أيضًا. وكلاهما مهم."
        en: "And now, young Papuans protect regional languages too. Both matter."
        note:
          ar_eg: "كلمات: jaga = خلي بالك من، احرس."
          ar: "مفردات: jaga = احرس، اعتنِ بـ."
          en: "Words: jaga = look after, guard."
  - kind: word_spotlight
    title: Bahasa berita
    lines:
      - speaker: Kak Tiara
        text: "Judul berita pendek dan tanpa imbuhan: Pemuda Sorong Juarai Lomba Aplikasi."
        ar_eg: "عنوان الخبر قصير ومن غير بادئات كتير: «شباب سورونج يفوزون بمسابقة التطبيقات»."
        ar: "عنوان الخبر قصير ويحذف السوابق: «شباب سورونغ يفوزون بمسابقة التطبيقات»."
        en: "Headlines are short and drop affixes: Sorong Youths Win App Contest."
        note:
          ar_eg: "في العناوين بيشيلوا me- كتير: Juarai بدل Menjuarai."
          ar: "تُحذف me- غالبًا في العناوين: Juarai بدل Menjuarai."
          en: "Headlines often drop me-: Juarai instead of Menjuarai."
      - speaker: Kak Reza
        text: "Teras berita: paragraf pertama yang memuat informasi terpenting."
        ar_eg: "مقدمة الخبر: أول فقرة وفيها أهم معلومة."
        ar: "مقدمة الخبر: الفقرة الأولى وفيها أهم المعلومات."
        en: "The lead: the first paragraph with the key information."
        note:
          ar_eg: "كلمات: informasi = معلومات."
          ar: "مفردات: informasi = معلومات."
          en: "Words: informasi = information."
      - speaker: Kak Tiara
        text: "Ungkapan berita: menurut sumber, dilaporkan bahwa, sementara itu, hingga berita ini diturunkan."
        ar_eg: "تعبيرات الأخبار: على حسب المصدر، أفادت التقارير إن، وفي الوقت نفسه، لحد كتابة الخبر ده."
        ar: "عبارات إخبارية: وفقًا للمصدر، أفادت التقارير بأن، في الأثناء، حتى نشر هذا الخبر."
        en: "News phrases: according to sources, it was reported that, meanwhile, at the time of publication."
        note:
          ar_eg: "كلمات: diturunkan = اتنشر (الخبر)؛ hingga = لحد."
          ar: "مفردات: diturunkan = نُشر (الخبر)؛ hingga = حتى، إلى."
          en: "Words: diturunkan = published (news); hingga = until, up to."
      - {speaker: Kak Reza, text: "Wartawan, penyiar, narasumber, liputan, siaran langsung.", ar_eg: "صحفي، مذيع، مصدر، تغطية، بث مباشر.", ar: "صحفي، مذيع، مصدر، تغطية، بث مباشر.", en: "Reporter, newsreader, source, coverage, live broadcast."}
      - speaker: Kak Tiara
        text: "Noken: tas rajutan khas Papua. Noken diakui sebagai warisan budaya oleh UNESCO."
        ar_eg: "نوكين: شنطة متشغولة بالإيد من بابوا. واليونسكو معترفة بيها كتراث ثقافي."
        ar: "نوكين: حقيبة منسوجة يدويًا من بابوا، أدرجتها اليونسكو تراثًا ثقافيًا."
        en: "Noken: a Papuan knotted bag. Noken is recognised by UNESCO as cultural heritage."
        note:
          ar_eg: "كلمات: budaya = ثقافة؛ diakui = معترف بيه."
          ar: "مفردات: budaya = ثقافة؛ diakui = يُعتَرف به."
          en: "Words: budaya = culture; diakui = to be recognized, acknowledged."
      - speaker: Kak Tiara
        text: "Habis siaran, wartawan ngobrol santai: Eh, udah denger beritanya? Anak-anak Sorong menang lomba, lho!"
        ar_eg: "بعد النشرة الصحفيين بيدردشوا عادي: إيه، سمعت الخبر؟ عيال سورونج كسبوا المسابقة!"
        ar: "بعد النشرة يتحدث الصحفيون ببساطة: هل سمعت الخبر؟ فاز شباب سورونغ بالمسابقة!"
        en: "Off air, reporters chat casually: Hey, heard the news? The Sorong kids won the contest!"
        note:
          ar_eg: "meraih juara في الخبر ← menang في الكلام. كلمات: beritanya = الخبر، أخباره؛ habis = خلص؛ habis itu = بعد كده."
          ar: "meraih juara في الخبر ← menang في الكلام. مفردات: beritanya = الخبر، أخباره؛ habis = انتهى؛ habis itu = بعد ذلك."
          en: "meraih juara on air → menang in chat. Words: beritanya = the news; habis = finished; habis itu = after that."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Pemuda Sorong meraih juara pertama."
        ar_eg: "شباب سورونج خدوا المركز الأول."
        ar: "فاز شباب سورونغ بالمركز الأول."
        en: "Sorong youths won first place."
        note:
          ar_eg: "كرر ورانا كل جملة بصوت مذيع."
          ar: "ردّد كل جملة بعدنا بصوت المذيع."
          en: "Repeat each sentence after us, newsreader style."
      - {speaker: Kak Reza, text: "Pemuda Sorong meraih juara pertama.", ar_eg: "شباب سورونج خدوا المركز الأول.", ar: "فاز شباب سورونغ بالمركز الأول.", en: "Sorong youths won first place."}
      - {speaker: Kak Tiara, text: "Lomba itu diadakan di Jakarta pada hari Sabtu lalu.", ar_eg: "المسابقة اتعملت في جاكرتا السبت اللي فات.", ar: "أقيمت المسابقة في جاكرتا يوم السبت الماضي.", en: "The contest was held in Jakarta last Saturday."}
      - {speaker: Kak Reza, text: "Lomba itu diadakan di Jakarta pada hari Sabtu lalu.", ar_eg: "المسابقة اتعملت في جاكرتا السبت اللي فات.", ar: "أقيمت المسابقة في جاكرتا يوم السبت الماضي.", en: "The contest was held in Jakarta last Saturday."}
      - {speaker: Kak Tiara, text: "Menurut narasumber, bahasa ibu harus tetap hidup.", ar_eg: "على حسب المصدر، لغة الأم لازم تفضل عايشة.", ar: "وفقًا للمصدر، يجب أن تبقى لغة الأم حية.", en: "According to the source, mother tongues must stay alive."}
      - {speaker: Kak Reza, text: "Menurut narasumber, bahasa ibu harus tetap hidup.", ar_eg: "على حسب المصدر، لغة الأم لازم تفضل عايشة.", ar: "وفقًا للمصدر، يجب أن تبقى لغة الأم حية.", en: "According to the source, mother tongues must stay alive."}
      - speaker: Kak Tiara
        text: "Demikian berita hari ini."
        ar_eg: "دي كانت أخبار النهارده."
        ar: "كانت هذه أخبار اليوم."
        en: "That was today's news."
        note:
          ar_eg: "كلمات: demikian = كده، بالشكل ده."
          ar: "مفردات: demikian = هكذا، كذلك."
          en: "Words: demikian = thus, so."
      - {speaker: Kak Reza, text: "Demikian berita hari ini.", ar_eg: "دي كانت أخبار النهارده.", ar: "كانت هذه أخبار اليوم.", en: "That was today's news."}
  - kind: outro
    title: Berita Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, bacakan berita tentang prestasimu sendiri. Pakai 5W 1H!"
        ar_eg: "يا محمد، اقرا خبر عن إنجاز ليك إنت. استعمل الأسئلة الستة!"
        ar: "يا محمد، اقرأ خبرًا عن إنجاز لك، مستخدمًا الأسئلة الستة!"
        en: "Mohamed, read a news item about your own achievement. Use the 5W 1H!"
        note:
          ar_eg: "دورك! قولها بصوت مذيع."
          ar: "دورك! قلها بصوت المذيع."
          en: "Your turn! Say it like a newsreader."
      - {speaker: Kak Reza, text: "Contohnya: Seorang warga Kairo, Mohamed, menyelesaikan enam level bahasa Indonesia dalam satu tahun. Menurutnya, rahasianya adalah belajar setiap hari.", ar_eg: "مثلًا: «مواطن من القاهرة، محمد، خلّص ست مستويات إندونيسي في سنة. وعلى حسب كلامه، السر إنه بيذاكر كل يوم».", ar: "مثلًا: «أنهى محمد، من سكان القاهرة، ستة مستويات من الإندونيسية في عام واحد، ويقول إن السر هو الدراسة اليومية».", en: "For example: A Cairo resident, Mohamed, completed six levels of Indonesian in one year. He says the secret is studying every day."}
      - {speaker: Kak Tiara, text: "Besok, tulis satu berita pendek, lengkap sama judul dan teras beritanya.", ar_eg: "بكرة، اكتب خبر قصير بعنوان ومقدمة.", ar: "غدًا، اكتب خبرًا قصيرًا بعنوان ومقدمة.", en: "Tomorrow, write a short news item with a headline and a lead."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Makasih, Kaka Yohana!", ar_eg: "شكرًا يا محمد. شكرًا يا كاكا يوهانا!", ar: "شكرًا يا محمد. شكرًا يا كاكا يوهانا!", en: "Thank you, Mohamed. Thank you, Kaka Yohana!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [judul, wartawan, narasumber, liputan, noken, bahasa ibu, dilaporkan, judul berita, lomba, membacakan, meraih, pendengar]
review:
  status: draft
  verified: false
  notes: |
    The app-contest story is invented. Kaka Yohana (registered BIPA 7 Sorong reporter)
    is thanked, not a speaker. Reza's "Pemirsa, eh, para pendengar" slip is intentional
    (pemirsa = TV viewers). Spot-check: Sorong now in Papua Barat Daya province (2022);
    Sumpah Pemuda 28 Oct 1928; noken on UNESCO list (2012).
