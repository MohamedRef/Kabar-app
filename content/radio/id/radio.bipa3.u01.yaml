schema: kabar.radio/v1
id: radio.bipa3.u01
language: id
level: bipa3
unit: bipa3.u01
title:
  target: Mohon maaf lahir dan batin
  ar_eg: سامحونا ظاهرًا وباطنًا
  ar: نلتمس العفو ظاهرًا وباطنًا
  en: Forgive me, body and soul
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Selamat datang di Lombok
    lines:
      - {speaker: Kak Tiara, text: "Assalamualaikum, selamat pagi! Ini Kabar Radio, sekarang dari Mataram, Lombok. Aku Tiara.", ar_eg: "السلام عليكم، صباح الخير! ده كبار راديو، المرة دي من ماتارام في لومبوك. أنا تيارا.", ar: "السلام عليكم، صباح الخير! هذا كبار راديو، الآن من ماتارام في لومبوك. أنا تيارا.", en: "Assalamualaikum, good morning! This is Kabar Radio, now from Mataram, Lombok. I'm Tiara."}
      - speaker: Kak Reza
        text: "Waalaikumsalam! Aku Reza. Lombok itu Pulau Seribu Masjid, lho. Dari hotel aja aku bisa denger tiga azan!"
        ar_eg: "وعليكم السلام! أنا رضا. لومبوك اسمها «جزيرة الألف جامع». من الأوتيل بس سمعت تلات أدانات."
        ar: "وعليكم السلام! أنا رضا. تُسمّى لومبوك «جزيرة الألف مسجد». من الفندق وحده سمعت ثلاثة أذانات."
        en: "Waalaikumsalam! I'm Reza. Lombok's the Island of a Thousand Mosques, you know. From the hotel alone I could hear three calls to prayer!"
      - {speaker: Kak Tiara, text: "Terus minggu ini Lebaran! Semua orang pakai baju baru, terus silaturahmi ke rumah keluarga.", ar_eg: "والأسبوع ده العيد! كل الناس لابسة هدوم جديدة وبتزور العيلة.", ar: "وهذا الأسبوع عيد الفطر! الجميع يلبسون ثيابًا جديدة ويزورون الأقارب.", en: "And this week it's Lebaran! Everyone puts on new clothes and goes visiting family.", note: {ar_eg: "silaturahmi (من «صلة الرحم») = زيارة الأهل في العيد.", ar: "silaturahmi (من «صلة الرحم») = زيارة الأقارب في العيد.", en: "silaturahmi (from Arabic «صلة الرحم») = visiting relatives at Eid."}}
      - {speaker: Kak Reza, text: "Hari ini kita belajar ucapan selamat, harapan, sama doa. Terus kepada, untuk, bagi, sama tentang.", ar_eg: "النهارده هنتعلم التهاني والأمنيات والدعوات، وكمان kepada وuntuk وbagi وtentang.", ar: "اليوم نتعلم التهاني والأمنيات والأدعية، وكذلك kepada وuntuk وbagi وtentang.", en: "Today we learn congratulations, wishes and prayers, plus kepada, untuk, bagi and tentang."}
      - {speaker: Kak Tiara, text: "Mohamed, di Mesir, kalau Lebaran kamu bilang apa?", ar_eg: "يا محمد، في مصر بتقولوا إيه في العيد؟", ar: "يا محمد، ماذا تقولون في مصر يوم العيد؟", en: "Mohamed, what do you say in Egypt on Eid?"}
  - kind: dialogue
    title: Berkunjung ke rumah keluarga Sasak
    lines:
      - speaker: Kak Tiara
        text: "Reza, kita ke rumah keluarga Sasak, yuk. Aku jadi tuan rumahnya, ya."
        ar_eg: "يا رضا، إحنا رايحين نزور عيلة ساساك. أنا هبقى صاحبة البيت."
        ar: "يا رضا، نزور بيت عائلة من الساساك. سأكون ربة البيت."
        en: "Reza, we're visiting a Sasak family. I'll be the host."
        note:
          ar_eg: "تمثيلية. الساساك هما أهل لومبوك الأصليين. مع ست كبيرة رضا بيتكلم بأدب: Bu وsaya."
          ar: "مشهد تمثيلي. الساساك هم سكان لومبوك الأصليون. ومع سيدة كبيرة يتكلم رضا بأدب: Bu وsaya."
          en: "A role-play. The Sasak are Lombok's own people. With an older lady Reza is polite: Bu, saya."
      - {speaker: Kak Reza, text: "Assalamualaikum, Bu. Selamat Hari Raya Idulfitri. Mohon maaf lahir dan batin.", ar_eg: "السلام عليكم يا حاجة. عيد فطر سعيد. سامحيني ظاهرًا وباطنًا.", ar: "السلام عليكم يا سيدتي. عيد فطر سعيد. أرجو العفو ظاهرًا وباطنًا.", en: "Assalamualaikum. Happy Eid al-Fitr. Please forgive me, body and soul."}
      - speaker: Kak Tiara
        text: "Waalaikumsalam. Sama-sama, Nak. Saya juga mohon maaf. Silakan masuk, ada ketupat dan opor ayam."
        ar_eg: "وعليكم السلام. وإنت كمان يا ابني. وأنا كمان بطلب السماح. اتفضل ادخل، فيه كيتوبات وأوبور فراخ."
        ar: "وعليكم السلام. وأنت أيضًا يا بني. وأنا كذلك ألتمس العفو. تفضل بالدخول، عندنا كيتوبات وأوبور دجاج."
        en: "Waalaikumsalam. Likewise, son. I ask your forgiveness too. Come in, there's ketupat and chicken opor."
        note:
          ar_eg: "في العيد كل واحد بيطلب السماح من التاني، حتى لو مفيش زعل. ketupat رز مطبوخ في ورق جوز الهند."
          ar: "في العيد يطلب كلٌّ العفو من الآخر ولو لم يكن بينهما خلاف. وketupat أرز مطبوخ في سعف جوز الهند."
          en: "At Eid everyone asks forgiveness, even without a quarrel. Ketupat is rice cooked in woven palm leaves."
      - {speaker: Kak Reza, text: "Terima kasih, Bu. Ini ada sedikit kue untuk keluarga Ibu.", ar_eg: "شكرًا يا حاجة. دي شوية كحك لعيلتك.", ar: "شكرًا يا سيدتي. هذه بعض الحلوى لعائلتك.", en: "Thank you. Here are a few cakes for your family."}
      - {speaker: Kak Tiara, text: "Wah, terima kasih. Anak perempuan saya baru menikah bulan lalu.", ar_eg: "الله، شكرًا. بنتي لسه متجوزة الشهر اللي فات.", ar: "شكرًا لك. ابنتي تزوجت الشهر الماضي.", en: "Oh, thank you. My daughter got married last month."}
      - {speaker: Kak Reza, text: "Selamat menempuh hidup baru! Semoga menjadi keluarga yang sakinah, mawadah, warahmah.", ar_eg: "مبروك الحياة الجديدة! ربنا يجعلها أسرة فيها سكينة ومودة ورحمة.", ar: "مبارك الحياة الجديدة! نرجو أن تكون أسرة يسودها السكن والمودة والرحمة.", en: "Congratulations on the new life! May it be a family of peace, love and mercy."}
      - {speaker: Kak Tiara, text: "Amin. Tapi tahun ini kami juga sedih. Suami saya meninggal tiga bulan lalu.", ar_eg: "آمين. بس السنة دي إحنا زعلانين كمان. جوزي اتوفى من تلات شهور.", ar: "آمين. لكننا حزينون هذا العام أيضًا. توفي زوجي منذ ثلاثة أشهر.", en: "Amen. But this year we're sad too. My husband passed away three months ago."}
      - {speaker: Kak Reza, text: "Innalillahi wa inna ilaihi rajiun. Saya turut berduka cita, Bu.", ar_eg: "إنا لله وإنا إليه راجعون. البقية في حياتك يا حاجة.", ar: "إنا لله وإنا إليه راجعون. أحسن الله عزاءك.", en: "Inna lillahi wa inna ilaihi raji'un. My condolences."}
      - {speaker: Kak Tiara, text: "Terima kasih, Nak. Doakan beliau, ya.", ar_eg: "شكرًا يا ابني. ادعيله.", ar: "شكرًا يا بني. ادعُ له.", en: "Thank you, son. Pray for him."}
      - {speaker: Kak Reza, text: "Tentu, Bu. Semoga beliau mendapat tempat terbaik di sisi Allah.", ar_eg: "أكيد يا حاجة. ربنا يرحمه ويجعل مثواه الجنة.", ar: "بالتأكيد. نرجو أن يكون له أفضل مكان عند الله.", en: "Of course. May he have the best place with God."}
      - {speaker: Kak Tiara, text: "Keren, Reza! Sama orang tua, kita pakai Ibu sama beliau. Sama teman, cukup kamu sama dia.", ar_eg: "جامد يا رضا! مع الكبار بنقول Ibu وbeliau. ومع الصحاب kamu وdia وخلاص.", ar: "أحسنت يا رضا! مع الكبار نستعمل Ibu وbeliau، ومع الأصدقاء يكفي kamu وdia.", en: "Nice one, Reza! With elders we use Ibu and beliau. With friends, just kamu and dia."}
  - kind: word_spotlight
    title: Kepada, untuk, bagi, tentang
    lines:
      - {speaker: Kak Reza, text: "Selamat ulang tahun, selamat menempuh hidup baru, selamat atas kelahiran putra Anda.", ar_eg: "عيد ميلاد سعيد، مبروك الحياة الجديدة، مبروك المولود.", ar: "عيد ميلاد سعيد، مبارك الحياة الجديدة، مبارك المولود.", en: "Happy birthday, congratulations on the wedding, congratulations on your son's birth."}
      - {speaker: Kak Tiara, text: "Semoga sukses. Semoga cepat sembuh. Semoga Allah membalas kebaikanmu.", ar_eg: "ربنا يوفقك. ألف سلامة. ربنا يجازيك خير.", ar: "أتمنى لك النجاح. شفاك الله. جزاك الله خيرًا.", en: "Good luck. Get well soon. May God repay your kindness."}
      - speaker: Kak Reza
        text: "Kepada untuk orang. Saya mengirim kartu kepada nenek saya."
        ar_eg: "kepada للناس. بعت كارت لجدتي."
        ar: "kepada للأشخاص. أرسلت بطاقة إلى جدتي."
        en: "Kepada is for people. I sent a card to my grandmother."
        note:
          ar_eg: "kepada = «إلى» قدام شخص، وke = «إلى» قدام مكان. ke rumah، بس kepada Ibu."
          ar: "kepada = «إلى» قبل الأشخاص، وke = «إلى» قبل الأماكن: ke rumah، لكن kepada Ibu."
          en: "Kepada = 'to' before a person; ke = 'to' before a place: ke rumah, but kepada Ibu."
      - {speaker: Kak Tiara, text: "Untuk dan bagi. Kue ini untuk keluarga Ibu. Lebaran sangat penting bagi orang Lombok.", ar_eg: "untuk وbagi. الكحك ده لعيلتك. العيد مهم أوي بالنسبة لأهل لومبوك.", ar: "untuk وbagi. هذه الحلوى لعائلتك. العيد مهم جدًا بالنسبة لأهل لومبوك.", en: "Untuk and bagi. These cakes are for your family. Lebaran matters a lot to Lombok people."}
      - {speaker: Kak Reza, text: "Tentang. Kami berbicara tentang tradisi Lebaran.", ar_eg: "عن. اتكلمنا عن عادات العيد.", ar: "عن. تحدثنا عن تقاليد العيد.", en: "About. We talked about Lebaran traditions."}
      - speaker: Kak Tiara
        text: "Turut berduka cita. Turut bahagia. Saya turut bahagia atas pernikahanmu."
        ar_eg: "البقية في حياتك. فرحانين معاك. أنا فرحانة معاك بجوازك."
        ar: "أشاركك العزاء. أشاركك الفرح. أشاركك فرحة زواجك."
        en: "Sharing your grief. Sharing your joy. I share your joy at your wedding."
        note:
          ar_eg: "turut يعني «أشارك»: turut berduka cita للعزا، وturut bahagia للفرح."
          ar: "turut تعني «أشارك»: turut berduka cita للعزاء، وturut bahagia للفرح."
          en: "Turut means 'to share in': turut berduka cita for a death, turut bahagia for good news."
      - speaker: Kak Reza
        text: "Sama teman di chat: Selamat, ya! Ikut seneng! Met Lebaran, maaf lahir batin, ya!"
        ar_eg: "مع صحابك في الشات: مبروك! فرحتلك! كل سنة وإنت طيب، سامحني!"
        ar: "مع الأصدقاء في المحادثة: مبارك! سعيد لأجلك! عيد سعيد وسامحني!"
        en: "With friends in chat: Congrats! So happy for you! Happy Lebaran, forgive me!"
        note:
          ar_eg: "ikut seneng = turut bahagia. Met = selamat في الشات. ومع الكبار خليك على الصيغة الرسمية."
          ar: "ikut seneng = turut bahagia، وMet = selamat في المحادثات. ومع الكبار التزم بالصيغة الرسمية."
          en: "ikut seneng = turut bahagia; Met = selamat in chat. With elders, keep the formal wording."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Selamat Hari Raya Idulfitri. Mohon maaf lahir dan batin."
        ar_eg: "عيد فطر سعيد. سامحونا ظاهرًا وباطنًا."
        ar: "عيد فطر سعيد. نلتمس العفو ظاهرًا وباطنًا."
        en: "Happy Eid al-Fitr. Forgive me, body and soul."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Selamat Hari Raya Idulfitri. Mohon maaf lahir dan batin.", ar_eg: "عيد فطر سعيد. سامحونا ظاهرًا وباطنًا.", ar: "عيد فطر سعيد. نلتمس العفو ظاهرًا وباطنًا.", en: "Happy Eid al-Fitr. Forgive me, body and soul."}
      - {speaker: Kak Tiara, text: "Selamat menempuh hidup baru!", ar_eg: "مبروك الحياة الجديدة!", ar: "مبارك الحياة الجديدة!", en: "Congratulations on your new life together!"}
      - {speaker: Kak Reza, text: "Selamat menempuh hidup baru!", ar_eg: "مبروك الحياة الجديدة!", ar: "مبارك الحياة الجديدة!", en: "Congratulations on your new life together!"}
      - {speaker: Kak Tiara, text: "Saya turut berduka cita.", ar_eg: "البقية في حياتك.", ar: "أحسن الله عزاءك.", en: "My condolences."}
      - {speaker: Kak Reza, text: "Saya turut berduka cita.", ar_eg: "البقية في حياتك.", ar: "أحسن الله عزاءك.", en: "My condolences."}
      - {speaker: Kak Tiara, text: "Kue ini untuk keluarga Ibu.", ar_eg: "الكحك ده لعيلتك.", ar: "هذه الحلوى لعائلتك.", en: "These cakes are for your family."}
      - {speaker: Kak Reza, text: "Kue ini untuk keluarga Ibu.", ar_eg: "الكحك ده لعيلتك.", ar: "هذه الحلوى لعائلتك.", en: "These cakes are for your family."}
  - kind: outro
    title: Ucapan dari Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, temanmu baru punya bayi. Apa ucapanmu kepadanya?"
        ar_eg: "يا محمد، صاحبك لسه جايله بيبي. هتقوله إيه؟"
        ar: "يا محمد، رُزق صديقك بمولود. ماذا تقول له؟"
        en: "Mohamed, your friend has just had a baby. What do you say to him?"
        note:
          ar_eg: "دورك! قول تهنئة ودعوة."
          ar: "دورك! قل تهنئة ودعاء."
          en: "Your turn! Say a congratulation and a wish."
      - {speaker: Kak Reza, text: "Contohnya: Selamat atas kelahiran putramu! Semoga menjadi anak yang saleh dan sehat selalu.", ar_eg: "مثلًا: مبروك المولود! ربنا يجعله من الصالحين ويديله الصحة دايمًا.", ar: "مثلًا: مبارك المولود! نرجو أن يكون صالحًا وفي صحة دائمًا.", en: "For example: Congratulations on your son's birth! May he grow up good and always healthy."}
      - {speaker: Kak Tiara, text: "Besok, tulis kartu Lebaran buat orang yang kamu sayang, ya.", ar_eg: "بكرة، اكتب كارت عيد لحد بتحبه.", ar: "غدًا، اكتب بطاقة عيد لشخص تحبه.", en: "Tomorrow, write a Lebaran card to someone you love."}
      - {speaker: Kak Reza, text: "Dari kami berdua: mohon maaf lahir dan batin, Mohamed!", ar_eg: "مننا إحنا الاتنين: سامحنا ظاهرًا وباطنًا يا محمد!", ar: "منا نحن الاثنين: نلتمس العفو ظاهرًا وباطنًا يا محمد!", en: "From both of us: forgive us, body and soul, Mohamed!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [selamat, semoga, turut berduka cita, kepada, untuk, bagi, tentang, ketupat, bahagia, Idulfitri, kelahiran, lahir dan batin]
