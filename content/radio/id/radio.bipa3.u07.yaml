title:
  target: Pahlawan dari Lombok
  ar_eg: بطل من لومبوك
  ar: بطل من لومبوك
  en: A hero from Lombok
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Desa Sade
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Desa Sade! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من قرية سادي! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من قرية سادي! هذا كبار راديو. أنا تيارا.", en: "Good morning from Sade village! This is Kabar Radio. I'm Tiara."}
      - speaker: Kak Reza
        text: "Aku Reza. Sade itu desa tradisional Sasak. Lantai rumahnya dipel pakai kotoran kerbau, lho!"
        ar_eg: "أنا رضا. سادي قرية ساساك تقليدية. أرضية البيوت بتتمسح بروث الجاموس!"
        ar: "أنا رضا. سادي قرية تقليدية للساساك، وتُمسح أرضيات بيوتها بروث الجاموس!"
        en: "I'm Reza. Sade's a traditional Sasak village. The house floors are polished with buffalo dung, believe it or not!"
        note:
          ar_eg: "أهل القرية بيقولوا إن الروث بيخلي الأرض ناشفة ويبعد الناموس."
          ar: "يقول أهل القرية إن الروث يبقي الأرض جافة ويطرد البعوض."
          en: "Villagers say it keeps the floor dry and keeps mosquitoes away."
      - {speaker: Kak Tiara, text: "Hari ini kita cerita soal pahlawan nasional dari Lombok.", ar_eg: "النهارده هنحكي عن بطل قومي من لومبوك.", ar: "اليوم نتحدث عن بطل وطني من لومبوك.", en: "Today we talk about a national hero from Lombok."}
      - {speaker: Kak Reza, text: "Terus kita belajar kalimat aktif sama pasif: membangun dan dibangun.", ar_eg: "وكمان هنتعلم المبني للمعلوم والمجهول: بنى واتبنى.", ar: "ونتعلم أيضًا المبني للمعلوم والمجهول: بنى وبُني.", en: "We'll also learn active and passive: build and was built."}
      - {speaker: Kak Tiara, text: "Mohamed, pahlawan favoritmu dari Mesir siapa?", ar_eg: "يا محمد، مين بطلك المفضل من مصر؟", ar: "يا محمد، من بطلك المفضل من مصر؟", en: "Mohamed, who's your favourite Egyptian hero?"}
  - kind: dialogue
    title: Biografi seorang ulama
    lines:
      - {speaker: Kak Reza, text: "Namanya Tuan Guru Kyai Haji Muhammad Zainuddin Abdul Madjid.", ar_eg: "اسمه الشيخ محمد زين الدين عبد المجيد.", ar: "اسمه توان غورو كياهي الحاج محمد زين الدين عبد المجيد.", en: "His name is Tuan Guru Kyai Haji Muhammad Zainuddin Abdul Madjid."}
      - speaker: Kak Tiara
        text: "Panjang banget namanya! Orang Lombok manggil beliau Maulana Syekh."
        ar_eg: "اسمه طويل! أهل لومبوك بيقولوله «مولانا الشيخ»."
        ar: "اسمه طويل! يدعوه أهل لومبوك «مولانا الشيخ»."
        en: "What a long name! People on Lombok call him Maulana Syekh."
        note:
          ar_eg: "Tuan Guru لقب العالم الديني في لومبوك زي «الشيخ». وحتى في الكلام العادي بنقول beliau للعلماء والكبار."
          ar: "Tuan Guru لقب العالم الديني في لومبوك مثل «الشيخ». وحتى في الكلام اليومي نقول beliau للعلماء والكبار."
          en: "Tuan Guru is Lombok's title for a scholar, like «الشيخ». Even in casual talk, scholars and elders get beliau."
      - {speaker: Kak Reza, text: "Beliau lahir di Lombok Timur. Waktu muda, beliau belajar di Mekah selama bertahun-tahun.", ar_eg: "اتولد في شرق لومبوك. وهو صغير، اتعلم في مكة سنين.", ar: "وُلد في شرق لومبوك، ودرس في مكة سنوات طويلة في شبابه.", en: "He was born in East Lombok. As a young man he studied in Mecca for years."}
      - {speaker: Kak Tiara, text: "Habis pulang, beliau ngapain?", ar_eg: "بعد ما رجع، عمل إيه؟", ar: "بعد عودته، ماذا فعل؟", en: "After he came home, what did he do?"}
      - {speaker: Kak Reza, text: "Beliau mendirikan madrasah. Pada masa itu, banyak anak tidak bisa sekolah.", ar_eg: "أسس مدارس دينية. في الوقت ده، عيال كتير مكانوش بيعرفوا يروحوا المدرسة.", ar: "أسس مدارس دينية. في ذلك الوقت لم يكن كثير من الأطفال يستطيعون الدراسة.", en: "He founded madrasahs. At that time, many children couldn't go to school."}
      - {speaker: Kak Tiara, text: "Jadi, madrasah itu didirikan oleh beliau untuk anak laki-laki dan perempuan?", ar_eg: "يعني المدارس دي اتأسست على إيده للولاد والبنات؟", ar: "أي أن تلك المدارس أُسست على يده للبنين والبنات؟", en: "So those madrasahs were founded by him for boys and girls?"}
      - speaker: Kak Reza
        text: "Betul. Sekolah untuk perempuan juga didirikan. Itu hal yang baru di Lombok pada waktu itu."
        ar_eg: "مظبوط. واتأسست كمان مدرسة للبنات. ودي كانت حاجة جديدة في لومبوك ساعتها."
        ar: "صحيح. وأُسست مدرسة للبنات أيضًا، وكان ذلك أمرًا جديدًا في لومبوك آنذاك."
        en: "Right. A school for girls was founded too. That was new on Lombok at the time."
      - {speaker: Kak Tiara, text: "Beliau wafat kapan?", ar_eg: "اتوفى إمتى؟", ar: "متى توفي؟", en: "When did he pass away?"}
      - {speaker: Kak Reza, text: "Beliau wafat pada tahun 1997. Tahun 2017, beliau diangkat menjadi pahlawan nasional.", ar_eg: "اتوفى سنة 1997. وفي 2017 اتعيّن بطل قومي.", ar: "توفي عام 1997، وفي عام 2017 أُعلن بطلًا وطنيًا.", en: "He passed away in 1997. In 2017 he was named a national hero."}
      - {speaker: Kak Tiara, text: "Sekarang sekolahnya ada di mana-mana di Indonesia.", ar_eg: "دلوقتي مدارسه موجودة في مناطق كتير في إندونيسيا.", ar: "واليوم توجد مدارسه في مناطق كثيرة من إندونيسيا.", en: "Today his schools exist in many parts of Indonesia."}
      - {speaker: Kak Reza, text: "Buku soal beliau aku baca minggu lalu. Ceritanya seru banget.", ar_eg: "الكتاب اللي عنه أنا قريته الأسبوع اللي فات. حكايته جميلة أوي.", ar: "قرأتُ كتابًا عنه الأسبوع الماضي، وقصته شيقة جدًا.", en: "I read a book about him last week. His story is fascinating."}
  - kind: word_spotlight
    title: Dibuat, oleh siapa?
    lines:
      - speaker: Kak Tiara
        text: "Aktif: Beliau mendirikan madrasah. Pasif: Madrasah didirikan oleh beliau."
        ar_eg: "معلوم: هو أسس المدرسة. مجهول: المدرسة اتأسست على إيده."
        ar: "معلوم: أسس المدرسة. مجهول: أُسست المدرسة على يده."
        en: "Active: He founded the madrasah. Passive: The madrasah was founded by him."
        note:
          ar_eg: "شيل meN- وحط di-: mendirikan ← didirikan. والفاعل بييجي بعد oleh."
          ar: "احذف meN- وضع di-: mendirikan ← didirikan، ويأتي الفاعل بعد oleh."
          en: "Drop meN-, add di-: mendirikan → didirikan. The doer comes after oleh."
      - {speaker: Kak Reza, text: "Dibuat, dikunjungi, ditulis. Desa Sade dikunjungi banyak turis.", ar_eg: "اتعمل، اتزار، اتكتب. قرية سادي بيزورها سياح كتير.", ar: "صُنع، زِير، كُتب. يزور قرية سادي سياح كثيرون.", en: "Made, visited, written. Sade village is visited by many tourists."}
      - speaker: Kak Tiara
        text: "Buku itu saya baca. Kalau pelakunya saya atau kamu, nggak pakai di-."
        ar_eg: "الكتاب ده أنا قريته. لو الفاعل «أنا» أو «إنت»، مش بنستخدم di-."
        ar: "ذلك الكتاب قرأتُه أنا. إن كان الفاعل «أنا» أو «أنت» فلا نستعمل di-."
        en: "That book I read. When the doer is I or you, no di-."
        note:
          ar_eg: "المفعول + saya/kamu + الفعل من غير meN-: Surat itu saya tulis = الجواب ده أنا كتبته."
          ar: "المفعول + saya/kamu + الفعل دون meN-: Surat itu saya tulis = تلك الرسالة كتبتُها."
          en: "Object + saya/kamu + bare verb: Surat itu saya tulis = I wrote that letter."
      - {speaker: Kak Reza, text: "Lahir, belajar, mendirikan, wafat. Kata-kata ini ada di setiap biografi.", ar_eg: "اتولد، اتعلم، أسس، اتوفى. الكلمات دي في كل سيرة ذاتية.", ar: "وُلد، تعلّم، أسس، توفي. هذه الكلمات في كل سيرة.", en: "Born, studied, founded, passed away. These words are in every biography."}
      - {speaker: Kak Tiara, text: "Meninggal untuk semua orang. Wafat lebih hormat, untuk tokoh dan ulama.", ar_eg: "meninggal لأي حد. وwafat فيها احترام أكتر، للشخصيات الكبيرة والعلما.", ar: "meninggal لكل الناس، وwafat أكثر احترامًا للأعلام والعلماء.", en: "Meninggal is for anyone. Wafat is more respectful, for leaders and scholars."}
      - speaker: Kak Reza
        text: "Sama teman, pasif juga jalan: Bukunya udah aku baca. Rumahnya dibangun bapakku."
        ar_eg: "مع صحابك، المبني للمجهول ماشي برضه: الكتاب قريته خلاص. البيت بناه أبويا."
        ar: "مع الأصدقاء يُستعمل المبني للمجهول أيضًا: الكتاب قرأته. البيت بناه أبي."
        en: "With friends, the passive works too: I've read the book. The house was built by my dad."
        note:
          ar_eg: "الإندونيسيين بيحبوا المبني للمجهول حتى في الكلام، بس من غير oleh غالبًا: dibangun bapakku."
          ar: "يحب الإندونيسيون المبني للمجهول حتى في الكلام، لكن غالبًا من دون oleh: dibangun bapakku."
          en: "Indonesians love the passive even in chat, usually without oleh: dibangun bapakku."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Beliau lahir di Lombok Timur."
        ar_eg: "هو اتولد في شرق لومبوك."
        ar: "وُلد في شرق لومبوك."
        en: "He was born in East Lombok."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Beliau lahir di Lombok Timur.", ar_eg: "هو اتولد في شرق لومبوك.", ar: "وُلد في شرق لومبوك.", en: "He was born in East Lombok."}
      - {speaker: Kak Tiara, text: "Madrasah itu didirikan oleh beliau.", ar_eg: "المدرسة دي اتأسست على إيده.", ar: "أُسست تلك المدرسة على يده.", en: "That madrasah was founded by him."}
      - {speaker: Kak Reza, text: "Madrasah itu didirikan oleh beliau.", ar_eg: "المدرسة دي اتأسست على إيده.", ar: "أُسست تلك المدرسة على يده.", en: "That madrasah was founded by him."}
      - {speaker: Kak Tiara, text: "Desa Sade dikunjungi banyak turis.", ar_eg: "قرية سادي بيزورها سياح كتير.", ar: "يزور قرية سادي سياح كثيرون.", en: "Sade village is visited by many tourists."}
      - {speaker: Kak Reza, text: "Desa Sade dikunjungi banyak turis.", ar_eg: "قرية سادي بيزورها سياح كتير.", ar: "يزور قرية سادي سياح كثيرون.", en: "Sade village is visited by many tourists."}
      - {speaker: Kak Tiara, text: "Buku itu saya baca minggu lalu.", ar_eg: "الكتاب ده أنا قريته الأسبوع اللي فات.", ar: "ذلك الكتاب قرأته الأسبوع الماضي.", en: "I read that book last week."}
      - {speaker: Kak Reza, text: "Buku itu saya baca minggu lalu.", ar_eg: "الكتاب ده أنا قريته الأسبوع اللي فات.", ar: "ذلك الكتاب قرأته الأسبوع الماضي.", en: "I read that book last week."}
  - kind: outro
    title: Pahlawan Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan pahlawan dari Mesir. Kapan dia lahir? Apa yang dia lakukan? Pakai satu kalimat pasif."
        ar_eg: "يا محمد، احكيلنا عن بطل من مصر. اتولد إمتى؟ عمل إيه؟ استخدم جملة واحدة مبنية للمجهول."
        ar: "يا محمد، حدّثنا عن بطل من مصر. متى وُلد؟ ماذا فعل؟ استعمل جملة واحدة مبنية للمجهول."
        en: "Mohamed, tell us about a hero from Egypt. When was he born? What did he do? Use one passive sentence."
        note:
          ar_eg: "دورك! سيرة صغيرة في تلات جمل."
          ar: "دورك! سيرة قصيرة في ثلاث جمل."
          en: "Your turn! A mini biography in three sentences."
      - {speaker: Kak Reza, text: "Contohnya: Rifa'a al-Tahtawi lahir tahun 1801. Beliau belajar di Paris. Sekolah bahasa di Kairo didirikan oleh beliau.", ar_eg: "مثلًا: رفاعة الطهطاوي اتولد سنة 1801. اتعلم في باريس. ومدرسة الألسن في القاهرة اتأسست على إيده.", ar: "مثلًا: وُلد رفاعة الطهطاوي عام 1801، ودرس في باريس، وأُسست مدرسة الألسن في القاهرة على يده.", en: "For example: Rifa'a al-Tahtawi was born in 1801. He studied in Paris. The School of Languages in Cairo was founded by him."}
      - {speaker: Kak Tiara, text: "Besok, tulis biografi pendek tokoh itu, lima kalimat aja.", ar_eg: "بكرة، اكتب سيرة قصيرة للشخصية دي في خمس جمل.", ar: "غدًا، اكتب سيرة قصيرة لتلك الشخصية في خمس جمل.", en: "Tomorrow, write a short biography of that figure in five sentences."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Dah!", ar_eg: "شكرًا يا محمد. سلام!", ar: "شكرًا يا محمد. إلى اللقاء!", en: "Thank you, Mohamed. Bye!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [pahlawan, lahir, mendirikan, wafat, ulama, madrasah, beliau, desa, membangun, tuan guru]
review:
  status: draft
  verified: false
  notes: |
    Facts to spot-check: TGKH Muhammad Zainuddin Abdul Madjid born in East Lombok, studied in Mecca,
    founded madrasahs including one for girls, died 1997, named a national hero in 2017; Rifa'a
    al-Tahtawi born 1801, founded the School of Languages (Madrasat al-Alsun) in Cairo.
