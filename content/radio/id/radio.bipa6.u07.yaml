schema: kabar.radio/v1
id: radio.bipa6.u07
language: id
level: bipa6
unit: bipa6.u07
title:
  target: Aturan dengan kata sederhana
  ar_eg: القانون بكلام بسيط
  ar: القوانين بكلمات بسيطة
  en: Rules in plain words
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Pagi di Jambi
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Jambi, di tepi Sungai Batanghari! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من جامبي، على شط نهر باتانجهاري! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من جامبي على ضفة نهر باتانغهاري! هذا كبار راديو. أنا تيارا.", en: "Good morning from Jambi, on the Batanghari River! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Hari ini topiknya agak berat, nih: bahasa hukum sama peraturan.", ar_eg: "أنا رضا. موضوع النهارده تقيل شوية: لغة القانون واللوايح.", ar: "أنا رضا. موضوعنا اليوم ثقيل بعض الشيء: لغة القانون والأنظمة.", en: "I'm Reza. Today's topic is a bit heavy: the language of law and regulations."}
      - speaker: Kak Tiara
        text: "Tenang aja. Tugas kita ngubah bahasa hukum jadi bahasa sehari-hari."
        ar_eg: "ما تقلقش. شغلانتنا إننا نحوّل لغة القانون لكلام عادي."
        ar: "لا تقلق؛ مهمتنا تحويل لغة القانون إلى لغة يومية."
        en: "Don't worry. Our job is to turn legal language into everyday language."
        note:
          ar_eg: "كلمات: sehari-hari = يومي."
          ar: "مفردات: sehari-hari = يومي."
          en: "Words: sehari-hari = daily, everyday."
      - speaker: Kak Reza
        text: "Kita belajar susunan undang-undang, hak sama kewajiban, terus cara baca syarat dan ketentuan."
        ar_eg: "هنتعلم ترتيب القوانين، والحقوق والواجبات، وإزاي نقرا الشروط والأحكام."
        ar: "نتعلم هرمية التشريعات، والحقوق والواجبات، وكيفية قراءة الشروط والأحكام."
        en: "We learn the layers of law, rights and obligations, and how to read terms and conditions."
        note:
          ar_eg: "كلمات: baca = يقرا، اقرا؛ undang-undang = قانون."
          ar: "مفردات: baca = يقرأ؛ undang-undang = قانون."
          en: "Words: baca = to read, read; undang-undang = law, statute."
      - speaker: Kak Tiara
        text: "Mohamed, kamu pernah baca syarat dan ketentuan sampai habis, nggak? Jujur aja!"
        ar_eg: "يا محمد، قريت الشروط والأحكام لآخرها قبل كده؟"
        ar: "يا محمد، هل قرأت الشروط والأحكام كاملة يومًا؟"
        en: "Mohamed, have you ever read terms and conditions to the end?"
        note:
          ar_eg: "كلمات: habis = خلص؛ habis itu = بعد كده."
          ar: "مفردات: habis = انتهى؛ habis itu = بعد ذلك."
          en: "Words: habis = finished; habis itu = after that."
  - kind: dialogue
    title: Membaca peraturan
    lines:
      - speaker: Kak Tiara
        text: "Reza bacain bahasa hukumnya. Aku terjemahin ke bahasa sehari-hari."
        ar_eg: "رضا هيقرا بلغة القانون. وأنا هترجمها لكلام بسيط."
        ar: "يقرأ رضا بلغة القانون، وأنا أترجمها إلى لغة بسيطة."
        en: "Reza reads the legal language. I translate it into plain words."
        note:
          ar_eg: "النص القانوني هنا متألف للتمرين، مش نص قانون حقيقي. كلمات: bacain = membacakan: يقرا بصوت عالي لحد."
          ar: "النص القانوني هنا مؤلف للتمرين، وليس نصًا حقيقيًا. مفردات: bacain = membacakan: يقرأ على الآخرين بصوت عالٍ."
          en: "The legal text here is invented for practice, not a real law. Words: bacain = membacakan: to read aloud."
      - speaker: Kak Reza
        text: "Pasal 1: Setiap konsumen berhak memperoleh informasi yang benar, jelas, dan jujur mengenai barang."
        ar_eg: "المادة 1: «كل مستهلك من حقه ياخد معلومات صحيحة وواضحة وصادقة عن السلعة»."
        ar: "المادة 1: «لكل مستهلك الحق في الحصول على معلومات صحيحة وواضحة وصادقة عن السلعة»."
        en: "Article 1: Every consumer has the right to correct, clear and honest information about goods."
        note:
          ar_eg: "كلمات: barang = حاجة، حاجات؛ informasi = معلومات؛ memperoleh = ياخد، يحصّل على."
          ar: "مفردات: barang = أغراض، بضائع؛ informasi = معلومات؛ memperoleh = يحصل على، ينال."
          en: "Words: barang = thing, goods; informasi = information; memperoleh = to obtain, gain."
      - speaker: Kak Tiara
        text: "Artinya: penjual harus jujur soal barangnya."
        ar_eg: "يعني: البياع لازم يكون صادق في كلامه عن السلعة."
        ar: "أي: على البائع أن يصدق في وصف سلعته."
        en: "Meaning: sellers must be honest about their goods."
        note:
          ar_eg: "كلمات: barangnya = حاجته، الحاجة دي."
          ar: "مفردات: barangnya = أغراضه، البضاعة."
          en: "Words: barangnya = his."
      - speaker: Kak Reza
        text: "Pasal 2: Pelaku usaha wajib memberikan ganti rugi apabila barang yang diterima tidak sesuai dengan perjanjian."
        ar_eg: "المادة 2: «صاحب النشاط ملزم يدفع تعويض لو السلعة اللي وصلت مش مطابقة للاتفاق»."
        ar: "المادة 2: «يلتزم صاحب النشاط بالتعويض إذا لم تطابق السلعة المستلمة الاتفاق»."
        en: "Article 2: Businesses must compensate if the goods received don't match the agreement."
        note:
          ar_eg: "كلمات: pelaku = اللي بيعمل الحاجة؛ pelaku usaha = صاحب البيزنس؛ usaha = بيزنس، مشروع؛ مجهود؛ apabila = لو، لما؛ diterima = اتقبل؛ ganti = يغيّر، يبدّل."
          ar: "مفردات: pelaku = الفاعل؛ pelaku usaha = صاحب النشاط التجاري؛ usaha = عمل تجاري، مشروع؛ جهد؛ apabila = إذا؛ diterima = قُبِل؛ ganti = يغيّر، يستبدل."
          en: "Words: pelaku = doer; pelaku usaha = business owner; usaha = business; effort; apabila = if, when; diterima = to be accepted; ganti = to change, to replace."
      - {speaker: Kak Tiara, text: "Artinya: kalau barangnya salah, kamu boleh minta duit balik atau barang baru.", ar_eg: "يعني: لو الحاجة طلعت غلط، من حقك تطلب فلوسك أو حاجة جديدة.", ar: "أي: إن كانت السلعة خاطئة، يحق لك استرداد المال أو طلب بديل.", en: "Meaning: if the item is wrong, you can ask for your money back or a new one.", note: {ar_eg: "duit = فلوس (uang في الكلام)، balik = يرجع (kembali).", ar: "duit = نقود (uang في الكلام)، balik = يعود (kembali).", en: "duit = cash, money (spoken uang); balik = back (kembali)."}}
      - speaker: Kak Reza
        text: "Pasal 3: Ketentuan sebagaimana dimaksud pada Pasal 2 tidak berlaku bagi kerusakan akibat kelalaian konsumen."
        ar_eg: "المادة 3: «الحكم المذكور في المادة 2 ما بيتطبقش على التلف اللي بسبب إهمال المستهلك»."
        ar: "المادة 3: «لا يسري الحكم المشار إليه في المادة 2 على التلف الناجم عن إهمال المستهلك»."
        en: "Article 3: The provision referred to in Article 2 does not apply to damage caused by consumer negligence."
        note:
          ar_eg: "كلمات: dimaksud = المقصود، اللي يقصده؛ sebagaimana = زي ما، كما."
          ar: "مفردات: dimaksud = المقصود؛ sebagaimana = كما."
          en: "Words: dimaksud = meant, intended; sebagaimana = as, just as."
      - {speaker: Kak Tiara, text: "Artinya: kalau kamu sendiri yang ngerusakin, penjual nggak wajib ganti.", ar_eg: "يعني: لو إنت اللي بوّظتها، البياع مش ملزم يعوّضك.", ar: "أي: إن أتلفتها أنت، فلا يلزم البائع بالتعويض.", en: "Meaning: if you broke it yourself, the seller doesn't have to replace it."}
      - {speaker: Kak Reza, text: "Mantap! Sebagaimana dimaksud pada itu frasa favorit bahasa hukum.", ar_eg: "برافو! «المذكور في» دي العبارة المفضلة في لغة القانون.", ar: "أحسنت! «المشار إليه في» هي العبارة الأثيرة في لغة القانون.", en: "Great! 'As referred to in' is legal language's favourite phrase."}
      - speaker: Kak Tiara
        text: "Di Indonesia, ada undang-undang, terus peraturan pemerintah, terus peraturan menteri. BIPA aja diatur peraturan menteri, lho."
        ar_eg: "في إندونيسيا، فيه القانون، وبعده لايحة الحكومة، وبعدها قرار الوزير. حتى برنامج BIPA اتنظّم بقرار وزاري."
        ar: "في إندونيسيا: القانون، ثم اللائحة الحكومية، ثم القرار الوزاري. حتى برنامج BIPA منظم بقرار وزاري."
        en: "In Indonesia there are acts, then government regulations, then ministerial regulations. Even BIPA is set out in a ministerial regulation."
        note:
          ar_eg: "كلمات: diatur = اتنظّم، اترتّب."
          ar: "مفردات: diatur = نُظِّم، رُتِّب."
          en: "Words: diatur = arranged, organized."
  - kind: word_spotlight
    title: Bahasa hukum
    lines:
      - speaker: Kak Tiara
        text: "Berhak artinya punya hak. Wajib artinya harus. Dilarang artinya tidak boleh."
        ar_eg: "berhak يعني ليه حق. wajib يعني لازم. dilarang يعني ممنوع."
        ar: "berhak: له الحق. wajib: يجب. dilarang: يُمنع."
        en: "Berhak means has the right. Wajib means must. Dilarang means forbidden."
        note:
          ar_eg: "كلمات زي hak وwajib وhukum وpasal كلها من العربي: حق، واجب، حُكم، فصل."
          ar: "hak وwajib وhukum وpasal كلها من العربية: حق، واجب، حكم، فصل."
          en: "Hak, wajib, hukum and pasal all come from Arabic."
      - {speaker: Kak Reza, text: "Apabila sama kayak kalau, tapi lebih resmi. Ngobrol? Pakai kalau aja. Sebagaimana dimaksud: as referred to.", ar_eg: "Apabila زي kalau بس أرسم. في الكلام؟ قول kalau وبس. Sebagaimana dimaksud: as referred to.", ar: "Apabila مثل kalau لكنها أرسم. في الكلام؟ استعمل kalau فقط. Sebagaimana dimaksud: as referred to.", en: "Apabila is like kalau but more formal. Chatting? Just use kalau. Sebagaimana dimaksud: as referred to."}
      - {speaker: Kak Tiara, text: "Undang-undang, pasal, ayat, peraturan, ketentuan, sanksi.", ar_eg: "قانون، مادة، فقرة، لايحة، حُكم، عقوبة.", ar: "قانون، مادة، فقرة، لائحة، حكم، جزاء.", en: "Act, article, clause, regulation, provision, sanction."}
      - {speaker: Kak Reza, text: "Hak dan kewajiban, konsumen, pelaku usaha, ganti rugi, surat kuasa.", ar_eg: "حقوق وواجبات، مستهلك، صاحب نشاط، تعويض، توكيل.", ar: "حقوق وواجبات، مستهلك، صاحب نشاط تجاري، تعويض، وكالة.", en: "Rights and obligations, consumer, business, compensation, power of attorney."}
      - {speaker: Kak Tiara, text: "Syarat dan ketentuan berlaku: terms and conditions apply.", ar_eg: "«تطبق الشروط والأحكام».", ar: "«تطبَّق الشروط والأحكام».", en: "Terms and conditions apply."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Setiap konsumen berhak memperoleh informasi yang jujur."
        ar_eg: "كل مستهلك من حقه ياخد معلومات صادقة."
        ar: "لكل مستهلك الحق في الحصول على معلومات صادقة."
        en: "Every consumer has the right to honest information."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Setiap konsumen berhak memperoleh informasi yang jujur.", ar_eg: "كل مستهلك من حقه ياخد معلومات صادقة.", ar: "لكل مستهلك الحق في الحصول على معلومات صادقة.", en: "Every consumer has the right to honest information."}
      - {speaker: Kak Tiara, text: "Pelaku usaha wajib memberikan ganti rugi.", ar_eg: "صاحب النشاط ملزم يدفع تعويض.", ar: "يلتزم صاحب النشاط بالتعويض.", en: "Businesses must pay compensation."}
      - {speaker: Kak Reza, text: "Pelaku usaha wajib memberikan ganti rugi.", ar_eg: "صاحب النشاط ملزم يدفع تعويض.", ar: "يلتزم صاحب النشاط بالتعويض.", en: "Businesses must pay compensation."}
      - {speaker: Kak Tiara, text: "Sebagaimana dimaksud pada Pasal 2.", ar_eg: "المذكور في المادة 2.", ar: "المشار إليه في المادة 2.", en: "As referred to in Article 2."}
      - {speaker: Kak Reza, text: "Sebagaimana dimaksud pada Pasal 2.", ar_eg: "المذكور في المادة 2.", ar: "المشار إليه في المادة 2.", en: "As referred to in Article 2."}
      - {speaker: Kak Tiara, text: "Syarat dan ketentuan berlaku.", ar_eg: "تطبق الشروط والأحكام.", ar: "تطبَّق الشروط والأحكام.", en: "Terms and conditions apply."}
      - {speaker: Kak Reza, text: "Syarat dan ketentuan berlaku.", ar_eg: "تطبق الشروط والأحكام.", ar: "تطبَّق الشروط والأحكام.", en: "Terms and conditions apply."}
  - kind: outro
    title: Penerjemah hukum
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ubah kalimat ini ke bahasa sederhana: Pengunjung dilarang membawa makanan dari luar, kecuali apabila diizinkan oleh petugas."
        ar_eg: "يا محمد، حوّل الجملة دي لكلام بسيط: «يُمنع الزوار من إدخال أكل من بره، إلا لو الموظف سمح»."
        ar: "يا محمد، بسّط هذه الجملة: «يُمنع الزوار من إدخال طعام من الخارج إلا بإذن الموظف»."
        en: "Mohamed, put this in plain words: Visitors are forbidden to bring outside food, unless permitted by staff."
        note:
          ar_eg: "دورك! قولها بصوت عالي. كلمات: kecuali = إلا، ما عدا؛ sederhana = بسيط؛ diizinkan = مسموح، اتسمح له."
          ar: "دورك! قلها بصوت مسموع. مفردات: kecuali = إلا، باستثناء؛ sederhana = بسيط؛ diizinkan = مسموح، أُذِن له."
          en: "Your turn! Say it out loud. Words: kecuali = except; sederhana = simple; diizinkan = allowed, permitted."
      - speaker: Kak Reza
        text: "Jawabannya: Jangan bawa makanan sendiri, kecuali petugasnya bilang boleh. Gampang, kan?"
        ar_eg: "الإجابة: «ما تجيبش أكل معاك، إلا لو الموظف قال ماشي»."
        ar: "الإجابة: «لا تُحضر طعامك إلا إذا سمح الموظف»."
        en: "Answer: Don't bring your own food, unless staff say it's OK."
        note:
          ar_eg: "كلمات: bilang = يقول؛ gampang = سهل."
          ar: "مفردات: bilang = يقول؛ gampang = سهل."
          en: "Words: bilang = to say; gampang = easy."
      - {speaker: Kak Tiara, text: "Besok, baca syarat dan ketentuan satu aplikasi, terus ringkas jadi tiga kalimat sederhana.", ar_eg: "بكرة، اقرا الشروط والأحكام بتاعة أبلكيشن، ولخّصها في تلات جمل بسيطة.", ar: "غدًا، اقرأ شروط وأحكام تطبيق ما ولخّصها في ثلاث جمل بسيطة.", en: "Tomorrow, read an app's terms and conditions and summarise them in three simple sentences."}
      - speaker: Kak Reza
        text: "Makasih, Mohamed. Sidang ditutup! Haha."
        ar_eg: "شكرًا يا محمد. رُفعت الجلسة! هاها."
        ar: "شكرًا يا محمد. رُفعت الجلسة! هاها."
        en: "Thank you, Mohamed. Court adjourned! Haha."
        note:
          ar_eg: "كلمات: ditutup = اتقفل، بيتقفل."
          ar: "مفردات: ditutup = يُغلَق."
          en: "Words: ditutup = to be closed."
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [pasal, peraturan, ketentuan, berhak, wajib, dilarang, ganti rugi, konsumen, ayat, berlaku, hak, kewajiban]
review:
  status: draft
  verified: false
  notes: |
    Articles 1–3 are invented, modelled loosely on consumer-protection style (UU 8/1999).
    Spot-check: hierarchy UU > PP > Permen; BIPA standards set in Permendikbud 27/2017.
