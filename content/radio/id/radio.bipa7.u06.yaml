schema: kabar.radio/v1
id: radio.bipa7.u06
language: id
level: bipa7
unit: bipa7.u06
title:
  target: Cek dulu sebelum sebar
  ar_eg: اتأكد قبل ما تنشر
  ar: تحقّق قبل أن تنشر
  en: Check before you share
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Sinyal di Misool
    lines:
      - {speaker: Kak Tiara, text: "Selamat sore dari Misool! Ini Kabar Radio. Saya Tiara.", ar_eg: "مساء الخير من ميسول! ده كبار راديو. أنا تيارا.", ar: "مساء الخير من ميسول! هذا كبار راديو. أنا تيارا.", en: "Good afternoon from Misool! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Sinyal di sini lemah, tapi pesan berantai tetap sampai ke ponsel saya!", ar_eg: "أنا رضا. الشبكة هنا ضعيفة، بس رسايل «انشر تؤجر» برضه وصلت لموبايلي!", ar: "أنا رضا. الإشارة هنا ضعيفة، لكن الرسائل المتسلسلة وصلت إلى هاتفي مع ذلك!", en: "I'm Reza. The signal here is weak, but chain messages still reach my phone!"}
      - {speaker: Kak Tiara, text: "Kaka Yohana dari radio Sorong bergabung lewat telepon. Dia sering memeriksa hoaks untuk beritanya.", ar_eg: "كاكا يوهانا من راديو سورونج معانا على التليفون. هي دايمًا بتتأكد من الإشاعات قبل أخبارها.", ar: "تنضم إلينا هاتفيًا كاكا يوهانا من إذاعة سورونغ، وهي كثيرًا ما تتحقق من الأخبار الكاذبة لنشرتها.", en: "Kaka Yohana from Sorong radio joins us by phone. She often checks hoaxes for her news."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar tentang media sosial, hoaks, cek fakta, dan kohesi leksikal."
        ar_eg: "النهارده هنتعلم عن السوشيال ميديا، والإشاعات، والتحقق من الحقايق، والترابط بالمفردات."
        ar: "اليوم نتعلم عن وسائل التواصل، والأخبار الكاذبة، وتدقيق الحقائق، والترابط المعجمي."
        en: "Today we learn about social media, hoaxes, fact-checking, and lexical cohesion."
      - {speaker: Kak Tiara, text: "Mohamed, pernahkah kamu menerima berita palsu di grup keluarga?", ar_eg: "يا محمد، جالك خبر مضروب على جروب العيلة قبل كده؟", ar: "يا محمد، هل وصلك خبر كاذب في مجموعة العائلة؟", en: "Mohamed, have you ever got fake news in the family group chat?"}
  - kind: dialogue
    title: Pesan berantai
    lines:
      - speaker: Kak Tiara
        text: "Kak Reza membaca pesan berantai. Saya memeriksanya langkah demi langkah, seperti yang diajarkan Kaka Yohana."
        ar_eg: "رضا هيقرا رسالة متسلسلة. وأنا هتأكد منها خطوة بخطوة، زي ما كاكا يوهانا علمتنا."
        ar: "يقرأ رضا رسالة متسلسلة، وأتحقق منها خطوة خطوة كما علّمتنا كاكا يوهانا."
        en: "Reza reads a chain message. I check it step by step, the way Kaka Yohana taught us."
        note:
          ar_eg: "الرسالة متألفة، بس شبه رسايل كتير بنشوفها."
          ar: "الرسالة مؤلفة، لكنها تشبه رسائل كثيرة نراها."
          en: "The message is invented, but like many we see."
      - {speaker: Kak Reza, text: "Penting! Sebarkan! Minum air es setelah makan bisa menyebabkan penyakit berbahaya. Kata dokter terkenal!", ar_eg: "«مهم! انشر! شرب ميه ساقعة بعد الأكل بيعمل أمراض خطيرة. على لسان دكتور مشهور!»", ar: "«مهم! انشر! شرب الماء المثلج بعد الأكل يسبب أمراضًا خطيرة. قالها طبيب مشهور!»", en: "Important! Share! Drinking iced water after meals can cause dangerous diseases. Says a famous doctor!"}
      - {speaker: Kak Tiara, text: "Langkah pertama: siapa dokternya? Namanya tidak ada. Itu tanda bahaya.", ar_eg: "أول خطوة: مين الدكتور ده؟ ما فيش اسم. دي علامة خطر.", ar: "الخطوة الأولى: من الطبيب؟ لا اسم له. هذه علامة إنذار.", en: "Step one: who's the doctor? No name. That's a red flag."}
      - {speaker: Kak Reza, text: "Langkah kedua: kata Penting! Sebarkan! membuat kita panik dan ingin cepat membagikan.", ar_eg: "تاني خطوة: كلمة «مهم! انشر!» بتخلينا نتخض ونستعجل نشير.", ar: "الخطوة الثانية: عبارة «مهم! انشر!» تثير الذعر وتدفعنا إلى المشاركة بسرعة.", en: "Step two: 'Important! Share!' makes us panic and want to share fast."}
      - {speaker: Kak Tiara, text: "Langkah ketiga: cek di situs cek fakta atau sumber kesehatan resmi.", ar_eg: "تالت خطوة: دوّر في مواقع التحقق من الأخبار أو مصادر الصحة الرسمية.", ar: "الخطوة الثالثة: تحقّق في مواقع تدقيق الحقائق أو المصادر الصحية الرسمية.", en: "Step three: check a fact-checking site or an official health source."}
      - {speaker: Kak Reza, text: "Saya cek. Hasilnya: klaim tersebut tidak benar. Kabar itu adalah hoaks.", ar_eg: "اتأكدت. النتيجة: الكلام ده مش صحيح. الخبر ده إشاعة.", ar: "تحققت. النتيجة: الادعاء غير صحيح، والخبر كاذب.", en: "I checked. Result: the claim is false. The news is a hoax."}
      - {speaker: Kak Tiara, text: "Perhatikan: pesan, kabar, klaim, informasi. Kita memakai kata berbeda untuk hal yang sama.", ar_eg: "خلي بالك: رسالة، خبر، ادعاء، معلومة. استعملنا كلمات مختلفة لنفس الحاجة.", ar: "لاحظ: رسالة، خبر، ادعاء، معلومة؛ كلمات مختلفة للشيء ذاته.", en: "Notice: message, news, claim, information. We used different words for the same thing."}
      - {speaker: Kak Reza, text: "Itu kohesi leksikal. Tulisan tidak membosankan, tapi tetap jelas.", ar_eg: "ده الترابط بالمفردات. الكتابة ما بتبقاش مملة، وبرضه واضحة.", ar: "هذا هو الترابط المعجمي: النص غير ممل وواضح في آن.", en: "That's lexical cohesion. The writing isn't boring, yet stays clear."}
      - {speaker: Kak Tiara, text: "Kaka Yohana bilang: Saring sebelum sharing. Jejak digital tidak bisa dihapus.", ar_eg: "كاكا يوهانا بتقول: «فلتر قبل ما تشير». والأثر الرقمي ما بيتمسحش.", ar: "تقول كاكا يوهانا: «صفِّ قبل أن تشارك». والبصمة الرقمية لا تُمحى.", en: "Kaka Yohana says: Filter before you share. Your digital footprint can't be erased."}
  - kind: word_spotlight
    title: Literasi digital
    lines:
      - speaker: Kak Tiara
        text: "Hoaks adalah kata resmi di KBBI. Artinya berita bohong."
        ar_eg: "hoaks كلمة رسمية في القاموس KBBI. معناها خبر كدب."
        ar: "hoaks كلمة معتمدة في معجم KBBI، ومعناها الخبر الكاذب."
        en: "Hoaks is an official KBBI word. It means a false report."
        note:
          ar_eg: "اتكتبت بالإملا الإندونيسي: hoax ← hoaks."
          ar: "كُتبت بالإملاء الإندونيسي: hoax ← hoaks."
          en: "Respelled the Indonesian way: hoax → hoaks."
      - {speaker: Kak Reza, text: "Cek fakta, sumber terpercaya, pesan berantai, judul umpan klik.", ar_eg: "تحقق من الحقايق، مصدر موثوق، رسالة متسلسلة، عنوان طُعم للضغط.", ar: "تدقيق الحقائق، مصدر موثوق، رسالة متسلسلة، عنوان مضلِّل لجذب النقرات.", en: "Fact-check, reliable source, chain message, clickbait headline."}
      - {speaker: Kak Tiara, text: "Pemengaruh: influencer. Warganet: netizen. Utas: thread.", ar_eg: "pemengaruh: إنفلونسر. warganet: مستخدمين النت. utas: ثريد.", ar: "pemengaruh: مؤثر. warganet: مستخدمو الإنترنت. utas: سلسلة منشورات.", en: "Pemengaruh: influencer. Warganet: netizen. Utas: thread."}
      - {speaker: Kak Reza, text: "Kohesi leksikal: sinonim, pengulangan, dan kata umum-khusus, seperti ponsel dan perangkat.", ar_eg: "الترابط بالمفردات: مرادفات، تكرار، وكلمة عامة وكلمة خاصة، زي الموبايل والجهاز.", ar: "الترابط المعجمي: الترادف، والتكرار، والعام والخاص، مثل الهاتف والجهاز.", en: "Lexical cohesion: synonyms, repetition, and general-specific pairs, like phone and device."}
      - {speaker: Kak Tiara, text: "Berita berimbang: memberi suara kepada dua pihak.", ar_eg: "الخبر المتوازن: بيدي فرصة للطرفين يتكلموا.", ar: "الخبر المتوازن: يمنح الطرفين صوتًا.", en: "Balanced reporting: giving both sides a voice."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Saring sebelum sharing."
        ar_eg: "فلتر قبل ما تشير."
        ar: "صفِّ قبل أن تشارك."
        en: "Filter before you share."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Saring sebelum sharing.", ar_eg: "فلتر قبل ما تشير.", ar: "صفِّ قبل أن تشارك.", en: "Filter before you share."}
      - {speaker: Kak Tiara, text: "Klaim tersebut tidak benar.", ar_eg: "الادعاء ده مش صحيح.", ar: "ذلك الادعاء غير صحيح.", en: "That claim is false."}
      - {speaker: Kak Reza, text: "Klaim tersebut tidak benar.", ar_eg: "الادعاء ده مش صحيح.", ar: "ذلك الادعاء غير صحيح.", en: "That claim is false."}
      - {speaker: Kak Tiara, text: "Cek dulu di sumber terpercaya.", ar_eg: "اتأكد الأول من مصدر موثوق.", ar: "تحقق أولًا من مصدر موثوق.", en: "Check a reliable source first."}
      - {speaker: Kak Reza, text: "Cek dulu di sumber terpercaya.", ar_eg: "اتأكد الأول من مصدر موثوق.", ar: "تحقق أولًا من مصدر موثوق.", en: "Check a reliable source first."}
      - {speaker: Kak Tiara, text: "Jejak digital tidak bisa dihapus.", ar_eg: "الأثر الرقمي ما بيتمسحش.", ar: "البصمة الرقمية لا تُمحى.", en: "A digital footprint can't be erased."}
      - {speaker: Kak Reza, text: "Jejak digital tidak bisa dihapus.", ar_eg: "الأثر الرقمي ما بيتمسحش.", ar: "البصمة الرقمية لا تُمحى.", en: "A digital footprint can't be erased."}
  - kind: outro
    title: Utas Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, tulis utas tiga bagian: tiga cara mengenali hoaks. Pakai sinonim agar tidak membosankan."
        ar_eg: "يا محمد، اكتب ثريد من تلات أجزاء: تلات طرق تعرف بيها الإشاعة. استعمل مرادفات عشان ما يبقاش ممل."
        ar: "يا محمد، اكتب سلسلة من ثلاثة منشورات: ثلاث طرق لكشف الأخبار الكاذبة، مستخدمًا المترادفات."
        en: "Mohamed, write a three-part thread: three ways to spot a hoax. Use synonyms so it's not boring."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Satu, lihat sumbernya. Dua, waspadai kata-kata yang membuat panik. Tiga, periksa informasi itu di situs resmi.", ar_eg: "مثلًا: «واحد، بص على المصدر. اتنين، خد بالك من الكلام اللي بيخضّك. تلاتة، اتأكد من المعلومة في موقع رسمي».", ar: "مثلًا: «أولًا انظر إلى المصدر. ثانيًا احذر الكلمات المثيرة للذعر. ثالثًا تحقق من المعلومة في موقع رسمي».", en: "For example: One, look at the source. Two, beware of panic words. Three, check that information on an official site."}
      - {speaker: Kak Tiara, text: "Besok, periksa satu pesan berantai yang kamu terima minggu ini.", ar_eg: "بكرة، اتأكد من رسالة متسلسلة جاتلك الأسبوع ده.", ar: "غدًا، افحص رسالة متسلسلة وصلتك هذا الأسبوع.", en: "Tomorrow, check one chain message you got this week."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Terima kasih, Kaka Yohana!", ar_eg: "شكرًا يا محمد. شكرًا يا كاكا يوهانا!", ar: "شكرًا يا محمد. شكرًا يا كاكا يوهانا!", en: "Thank you, Mohamed. Thank you, Kaka Yohana!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [media sosial, hoaks, cek fakta, sumber terpercaya, pesan berantai, jejak digital, pemengaruh, warganet, utas, kohesi leksikal, berita berimbang, klaim]
review:
  status: draft
  verified: false
  notes: |
    The iced-water chain message is a well-known invented-type hoax; no real doctor or
    site named. Kaka Yohana is quoted (registered BIPA 7 reporter), not a speaker.
    Spot-check: hoaks, pemengaruh, warganet, utas in KBBI; "Saring sebelum sharing"
    slogan.
