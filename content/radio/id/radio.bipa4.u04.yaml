schema: kabar.radio/v1
id: radio.bipa4.u04
language: id
level: bipa4
unit: bipa4.u04
title:
  target: Siaran berita pagi
  ar_eg: نشرة أخبار الصبح
  ar: نشرة أخبار الصباح
  en: The morning news
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Kota kelahiran Habibie
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Parepare! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من باريباري! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من باريباري! هذا كبار راديو. أنا تيارا.", en: "Good morning from Parepare! This is Kabar Radio. I'm Tiara."}
      - speaker: Kak Reza
        text: "Saya Reza. Parepare adalah kota kelahiran Presiden B.J. Habibie."
        ar_eg: "أنا رضا. باريباري هي المدينة اللي اتولد فيها الرئيس حبيبي."
        ar: "أنا رضا. باريباري مسقط رأس الرئيس ب. ج. حبيبي."
        en: "I'm Reza. Parepare is the birthplace of President B.J. Habibie."
        note:
          ar_eg: "حبيبي كان مهندس طيارات، وبقى رئيس سنة 1998 وفتح الباب لحرية الصحافة."
          ar: "كان حبيبي مهندس طائرات، وصار رئيسًا عام 1998 وفتح الباب لحرية الصحافة."
          en: "Habibie was an aircraft engineer who became president in 1998 and opened up the press."
      - {speaker: Kak Tiara, text: "Karena itu, hari ini kita bicara tentang media dan berita.", ar_eg: "عشان كده، النهارده هنتكلم عن الإعلام والأخبار.", ar: "لذلك نتحدث اليوم عن الإعلام والأخبار.", en: "That's why today we talk about media and news."}
      - {speaker: Kak Reza, text: "Kita belajar meringkas berita dan memakai kata akibatnya, oleh karena itu, berkat, dan gara-gara.", ar_eg: "هنتعلم نلخص خبر ونستخدم akibatnya وoleh karena itu وberkat وgara-gara.", ar: "نتعلم تلخيص الخبر واستعمال akibatnya وoleh karena itu وberkat وgara-gara.", en: "We learn to summarise news and use akibatnya, oleh karena itu, berkat and gara-gara."}
      - {speaker: Kak Tiara, text: "Mohamed, dari mana kamu biasanya membaca berita? Koran, televisi, atau internet?", ar_eg: "يا محمد، بتقرا الأخبار منين عادة؟ جرنال، تلفزيون، ولا إنترنت؟", ar: "يا محمد، من أين تقرأ الأخبار عادة؟ الصحف، التلفاز، أم الإنترنت؟", en: "Mohamed, where do you usually get your news? Paper, TV or online?"}
  - kind: dialogue
    title: Berita banjir
    lines:
      - {speaker: Kak Reza, text: "Sekarang kita bacakan berita pagi ini. Kak Tiara jadi pembaca berita.", ar_eg: "دلوقتي هنقرا خبر الصبح ده. تيارا هتبقى المذيعة.", ar: "والآن نقرأ خبر هذا الصباح. تيارا هي مذيعة الأخبار.", en: "Now let's read this morning's news. Tiara is the newsreader."}
      - {speaker: Kak Tiara, text: "Para pendengar, hujan deras turun selama dua hari di Sulawesi Selatan. Akibatnya, beberapa sungai meluap.", ar_eg: "حضرات المستمعين، مطر غزير نزل يومين في جنوب سولاويسي. والنتيجة إن كذا نهر فاض.", ar: "مستمعينا الكرام، هطلت أمطار غزيرة يومين في جنوب سولاويسي، فطفحت عدة أنهار.", en: "Listeners, heavy rain fell for two days in South Sulawesi. As a result, several rivers overflowed."}
      - {speaker: Kak Tiara, text: "Ratusan rumah terendam banjir, dan sekolah-sekolah ditutup sementara.", ar_eg: "مئات البيوت غرقت في الفيضان، والمدارس اتقفلت مؤقتًا.", ar: "غمرت المياه مئات البيوت، وأُغلقت المدارس مؤقتًا.", en: "Hundreds of homes were flooded, and schools were closed temporarily."}
      - {speaker: Kak Tiara, text: "Berkat kerja cepat tim penyelamat, semua warga berhasil dievakuasi.", ar_eg: "بفضل شغل فريق الإنقاذ السريع، كل الأهالي اتنقلوا لمكان آمن.", ar: "بفضل سرعة فريق الإنقاذ، أُجلي جميع السكان بنجاح.", en: "Thanks to the rescue team's quick work, all residents were evacuated."}
      - {speaker: Kak Reza, text: "Apa penyebab banjir, menurut pemerintah?", ar_eg: "إيه سبب الفيضان على حسب الحكومة؟", ar: "ما سبب الفيضان بحسب الحكومة؟", en: "What caused the flood, according to the government?"}
      - {speaker: Kak Tiara, text: "Selain hujan, banjir terjadi gara-gara sampah menyumbat saluran air. Oleh karena itu, warga diminta tidak membuang sampah ke sungai.", ar_eg: "غير المطر، الفيضان حصل بسبب الزبالة اللي سدّت المجاري. عشان كده بيطلبوا من الأهالي ميرموش زبالة في النهر.", ar: "إلى جانب المطر، وقع الفيضان بسبب القمامة التي سدّت المجاري، ولذلك طُلب من السكان ألا يرموا القمامة في النهر.", en: "Besides the rain, the flood happened because rubbish blocked the drains. So residents are asked not to throw rubbish in the river."}
      - {speaker: Kak Reza, text: "Terima kasih. Kak Tiara, coba ringkas berita itu dalam satu kalimat.", ar_eg: "شكرًا. يا تيارا، لخّصي الخبر ده في جملة واحدة.", ar: "شكرًا. يا تيارا، لخّصي الخبر في جملة واحدة.", en: "Thank you. Tiara, try summarising that in one sentence."}
      - {speaker: Kak Tiara, text: "Hujan deras dan sampah menyebabkan banjir di Sulawesi Selatan, tetapi semua warga selamat.", ar_eg: "المطر الغزير والزبالة عملوا فيضان في جنوب سولاويسي، بس كل الأهالي سليمين.", ar: "تسبّب المطر الغزير والقمامة في فيضان بجنوب سولاويسي، لكن جميع السكان سالمون.", en: "Heavy rain and rubbish caused floods in South Sulawesi, but all residents are safe."}
      - {speaker: Kak Reza, text: "Bagus! Ringkasan yang baik menjawab apa, di mana, kapan, siapa, mengapa, dan bagaimana.", ar_eg: "حلو! الملخص الكويس بيجاوب على إيه، فين، إمتى، مين، ليه، وإزاي.", ar: "أحسنت! الملخص الجيد يجيب عن: ماذا، أين، متى، من، لماذا، وكيف.", en: "Good! A good summary answers what, where, when, who, why and how."}
      - {speaker: Kak Tiara, text: "Sekarang pro dan kontra. Ada usul: sekolah daring setiap musim hujan. Bagaimana pendapatmu?", ar_eg: "دلوقتي المميزات والعيوب. فيه اقتراح: الدراسة أونلاين كل موسم مطر. رأيك إيه؟", ar: "والآن الإيجابيات والسلبيات. هناك اقتراح: الدراسة عن بُعد في كل موسم أمطار. ما رأيك؟", en: "Now pros and cons. There's a proposal: online school every rainy season. What do you think?"}
      - {speaker: Kak Reza, text: "Kelebihannya, anak-anak aman di rumah. Kekurangannya, tidak semua keluarga punya internet.", ar_eg: "الميزة إن العيال في أمان في البيت. والعيب إن مش كل العيلات عندها إنترنت.", ar: "ميزته أن الأطفال آمنون في البيت، وعيبه أن ليست كل الأسر لديها إنترنت.", en: "The advantage: children are safe at home. The drawback: not every family has internet."}
      - {speaker: Kak Tiara, text: "Jadi, perlu dipikirkan baik-baik.", ar_eg: "يعني محتاجة تفكير كويس.", ar: "إذن، يحتاج الأمر إلى تفكير جيد.", en: "So it needs careful thought."}
  - kind: word_spotlight
    title: Akibatnya, berkat, gara-gara
    lines:
      - {speaker: Kak Reza, text: "Akibatnya. Hujan turun dua hari. Akibatnya, sungai meluap.", ar_eg: "والنتيجة. المطر نزل يومين. والنتيجة إن النهر فاض.", ar: "ونتيجة لذلك. أمطرت يومين، فطفح النهر.", en: "As a result. It rained for two days. As a result, the river overflowed."}
      - {speaker: Kak Tiara, text: "Oleh karena itu. Sampah menyumbat saluran. Oleh karena itu, jangan buang sampah sembarangan.", ar_eg: "عشان كده. الزبالة سدت المجاري. عشان كده متِرميش زبالة في أي حتة.", ar: "لذلك. سدّت القمامة المجاري، لذلك لا ترمِ القمامة عشوائيًا.", en: "Therefore. Rubbish blocked the drains. Therefore, don't litter."}
      - speaker: Kak Reza
        text: "Berkat untuk sebab yang baik. Gara-gara untuk sebab yang buruk."
        ar_eg: "berkat لسبب كويس (بفضل). وgara-gara لسبب وحش (بسبب / بذنب)."
        ar: "berkat لسبب حسن (بفضل)، وgara-gara لسبب سيئ (بسبب / من جرّاء)."
        en: "Berkat is for a good cause. Gara-gara is for a bad cause."
        note:
          ar_eg: "Berkat bantuanmu, saya lulus = بفضل مساعدتك نجحت. Gara-gara macet, saya terlambat = بسبب الزحمة اتأخرت."
          ar: "Berkat bantuanmu, saya lulus = بفضل مساعدتك نجحت. Gara-gara macet, saya terlambat = تأخرت من جرّاء الزحام."
          en: "Berkat bantuanmu, saya lulus = thanks to your help I passed. Gara-gara macet, saya terlambat = I was late because of the traffic."
      - {speaker: Kak Tiara, text: "Kelebihan dan kekurangan. Pro dan kontra. Di satu sisi..., di sisi lain...", ar_eg: "مميزات وعيوب. مع وضد. من ناحية...، ومن ناحية تانية...", ar: "إيجابيات وسلبيات. مع وضد. من جهة...، ومن جهة أخرى...", en: "Advantages and drawbacks. Pros and cons. On the one hand..., on the other..."}
      - {speaker: Kak Reza, text: "Pemirsa, berita daring, wartawan, narasumber, judul berita.", ar_eg: "المشاهدين، أخبار أونلاين، صحفي، مصدر، عنوان الخبر.", ar: "المشاهدون، الأخبار الإلكترونية، صحفي، مصدر، عنوان الخبر.", en: "Viewers, online news, reporter, source, headline."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Hujan deras turun. Akibatnya, sungai meluap."
        ar_eg: "مطر غزير نزل. والنتيجة إن النهر فاض."
        ar: "هطل مطر غزير، فطفح النهر."
        en: "Heavy rain fell. As a result, the river overflowed."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Hujan deras turun. Akibatnya, sungai meluap.", ar_eg: "مطر غزير نزل. والنتيجة إن النهر فاض.", ar: "هطل مطر غزير، فطفح النهر.", en: "Heavy rain fell. As a result, the river overflowed."}
      - {speaker: Kak Tiara, text: "Berkat tim penyelamat, semua warga selamat.", ar_eg: "بفضل فريق الإنقاذ، كل الأهالي سليمين.", ar: "بفضل فريق الإنقاذ، نجا جميع السكان.", en: "Thanks to the rescue team, all residents are safe."}
      - {speaker: Kak Reza, text: "Berkat tim penyelamat, semua warga selamat.", ar_eg: "بفضل فريق الإنقاذ، كل الأهالي سليمين.", ar: "بفضل فريق الإنقاذ، نجا جميع السكان.", en: "Thanks to the rescue team, all residents are safe."}
      - {speaker: Kak Tiara, text: "Gara-gara sampah, saluran air tersumbat.", ar_eg: "بسبب الزبالة، المجاري اتسدت.", ar: "من جرّاء القمامة انسدّت المجاري.", en: "Because of rubbish, the drains got blocked."}
      - {speaker: Kak Reza, text: "Gara-gara sampah, saluran air tersumbat.", ar_eg: "بسبب الزبالة، المجاري اتسدت.", ar: "من جرّاء القمامة انسدّت المجاري.", en: "Because of rubbish, the drains got blocked."}
      - {speaker: Kak Tiara, text: "Kelebihannya aman, kekurangannya mahal.", ar_eg: "ميزته إنه آمن، وعيبه إنه غالي.", ar: "ميزته الأمان، وعيبه الغلاء.", en: "Its advantage is safety, its drawback is cost."}
      - {speaker: Kak Reza, text: "Kelebihannya aman, kekurangannya mahal.", ar_eg: "ميزته إنه آمن، وعيبه إنه غالي.", ar: "ميزته الأمان، وعيبه الغلاء.", en: "Its advantage is safety, its drawback is cost."}
  - kind: outro
    title: Berita dari Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ringkas satu berita yang kamu baca minggu ini dalam dua kalimat."
        ar_eg: "يا محمد، لخّص خبر قريته الأسبوع ده في جملتين."
        ar: "يا محمد، لخّص خبرًا قرأته هذا الأسبوع في جملتين."
        en: "Mohamed, summarise one news item you read this week in two sentences."
        note:
          ar_eg: "دورك! جاوب على إيه، فين، وليه."
          ar: "دورك! أجب عن: ماذا، أين، ولماذا."
          en: "Your turn! Answer what, where and why."
      - {speaker: Kak Reza, text: "Contohnya: Metro baru dibuka di Kairo minggu ini. Berkat metro itu, perjalanan ke kantor lebih cepat.", ar_eg: "مثلًا: خط مترو جديد اتفتح في القاهرة الأسبوع ده. بفضله المشوار للشغل بقى أسرع.", ar: "مثلًا: افتُتح خط مترو جديد في القاهرة هذا الأسبوع، وبفضله صار الطريق إلى العمل أسرع.", en: "For example: A new metro line opened in Cairo this week. Thanks to it, getting to work is faster."}
      - {speaker: Kak Tiara, text: "Besok, baca satu berita daring berbahasa Indonesia dan tulis ringkasannya.", ar_eg: "بكرة، اقرا خبر أونلاين بالإندونيسي واكتب ملخصه.", ar: "غدًا، اقرأ خبرًا إلكترونيًا بالإندونيسية واكتب ملخصه.", en: "Tomorrow, read one online news item in Indonesian and write a summary."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Sekian berita hari ini!", ar_eg: "شكرًا يا محمد. ده كل أخبار النهارده!", ar: "شكرًا يا محمد. هذه كانت أخبار اليوم!", en: "Thank you, Mohamed. That's all the news for today!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [ringkasan, akibatnya, oleh karena itu, berkat, gara-gara, kelebihan, kekurangan, banjir, daring, judul, menyebabkan, narasumber]
