title:
  target: Si Kancil dan buaya
  ar_eg: الغزال الصغير والتماسيح
  ar: الغزال القزم والتماسيح
  en: Mouse-deer and the crocodiles
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Malam di Arborek
    lines:
      - {speaker: Kak Tiara, text: "Selamat malam dari Pulau Arborek! Ini Kabar Radio. Saya Tiara.", ar_eg: "مساء الخير من جزيرة أربوريك! ده كبار راديو. أنا تيارا.", ar: "مساء الخير من جزيرة أربوريك! هذا كبار راديو. أنا تيارا.", en: "Good evening from Arborek Island! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Kami duduk di dermaga kayu. Anak-anak desa minta didongengkan.", ar_eg: "أنا رضا. قاعدين على رصيف خشب. وعيال القرية عايزين حدوتة.", ar: "أنا رضا. نجلس على رصيف خشبي، وأطفال القرية يطلبون حكاية.", en: "I'm Reza. We're sitting on a wooden jetty. The village kids want a story."}
      - {speaker: Kak Tiara, text: "Di Papua ada lebih dari dua ratus lima puluh bahasa, dan banyak cerita asal-usul.", ar_eg: "في بابوا فيه أكتر من ميتين وخمسين لغة، وحكايات أصل كتير.", ar: "في بابوا أكثر من مئتين وخمسين لغة، وحكايات نشأة كثيرة.", en: "Papua has more than two hundred and fifty languages, and many origin stories."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar majas, makna tersirat, dan cara mendongeng."
        ar_eg: "النهارده هنتعلم المجاز، والمعنى الضمني، وإزاي نحكي حدوتة."
        ar: "اليوم نتعلم المجاز، والمعنى الضمني، وفن الحكي."
        en: "Today we learn figures of speech, implied meaning, and how to tell a story."
      - {speaker: Kak Tiara, text: "Mohamed, siapa yang mendongeng untukmu waktu kecil?", ar_eg: "يا محمد، مين كان بيحكيلك حواديت وإنت صغير؟", ar: "يا محمد، من كان يحكي لك الحكايات في صغرك؟", en: "Mohamed, who told you stories when you were little?"}
  - kind: dialogue
    title: Dongeng di dermaga
    lines:
      - speaker: Kak Tiara
        text: "Kak Reza mendongeng fabel Melayu yang terkenal. Saya menjadi anak yang banyak bertanya."
        ar_eg: "رضا هيحكي حدوتة ملايو مشهورة على لسان الحيوانات. وأنا هبقى عيلة بتسأل كتير."
        ar: "يحكي رضا خرافة ملايوية شهيرة، وأؤدي أنا دور طفلة كثيرة الأسئلة."
        en: "Reza tells a famous Malay fable. I play a child with lots of questions."
        note:
          ar_eg: "الكانتشيل حيوان صغير زي الغزال، وفي الحواديت هو الشاطر اللي بيغلب الأقوى منه."
          ar: "الكانتشيل حيوان صغير يشبه الغزال، وهو في الحكايات الذكي الذي يغلب الأقوى."
          en: "The kancil is a tiny deer; in fables it's the clever one who outwits the strong."
      - {speaker: Kak Reza, text: "Pada suatu hari, hiduplah seekor kancil yang cerdik. Dia ingin menyeberang sungai untuk makan buah.", ar_eg: "كان يا ما كان، كان فيه كانتشيل شاطر. كان عايز يعدي النهر عشان ياكل فاكهة.", ar: "في يوم من الأيام عاش كانتشيل ذكي، أراد عبور النهر ليأكل الفاكهة.", en: "Once upon a time there lived a clever mouse-deer. He wanted to cross the river to eat fruit."}
      - {speaker: Kak Tiara, text: "Tapi di sungai ada buaya, kan?", ar_eg: "بس في النهر فيه تماسيح، صح؟", ar: "لكن في النهر تماسيح، أليس كذلك؟", en: "But there are crocodiles in the river, right?"}
      - {speaker: Kak Reza, text: "Benar. Buaya-buaya itu lapar sekali. Kancil berpikir sejenak, lalu tersenyum.", ar_eg: "صح. والتماسيح دي كانت جعانة أوي. الكانتشيل فكر شوية، وبعدين ابتسم.", ar: "صحيح. وكانت التماسيح جائعة جدًا. فكّر الكانتشيل لحظة ثم ابتسم.", en: "Right. The crocodiles were very hungry. Mouse-deer thought for a moment, then smiled."}
      - {speaker: Kak Reza, text: "Wahai buaya, Raja Hutan ingin tahu berapa jumlah kalian. Berbarislah, aku akan menghitung!", ar_eg: "يا تماسيح، ملك الغابة عايز يعرف عددكم كام. اقفوا في صف، وأنا هعدّكم!", ar: "أيتها التماسيح، يريد ملك الغابة أن يعرف عددكم. اصطفّوا وسأعدّكم!", en: "O crocodiles, the King of the Forest wants to know how many you are. Line up, I'll count you!"}
      - {speaker: Kak Reza, text: "Buaya-buaya berbaris dari tepi ke tepi. Kancil melompat di punggung mereka: satu, dua, tiga…", ar_eg: "التماسيح وقفت في صف من الشط للشط. والكانتشيل نط على ضهورهم: واحد، اتنين، تلاتة…", ar: "اصطفت التماسيح من ضفة إلى ضفة، فقفز الكانتشيل على ظهورها: واحد، اثنان، ثلاثة…", en: "The crocodiles lined up from bank to bank. Mouse-deer hopped on their backs: one, two, three…"}
      - {speaker: Kak Reza, text: "Sampai di seberang, dia berteriak: Terima kasih atas jembatannya!", ar_eg: "ولما وصل الناحية التانية، زعق: شكرًا على الكوبري!", ar: "ولما بلغ الضفة الأخرى صاح: شكرًا على الجسر!", en: "On the other side, he shouted: Thanks for the bridge!"}
      - {speaker: Kak Tiara, text: "Haha! Tapi Kak, apakah kancil berbohong itu baik?", ar_eg: "هاها! بس يا رضا، هو كدب الكانتشيل ده حاجة كويسة؟", ar: "هاها! لكن، هل كذب الكانتشيل أمر حسن؟", en: "Haha! But is it good that mouse-deer lied?"}
      - {speaker: Kak Reza, text: "Pertanyaan bagus. Pesan tersiratnya: akal bisa mengalahkan kekuatan. Tapi di cerita lain, kancil juga kena batunya.", ar_eg: "سؤال حلو. المغزى الضمني: العقل ممكن يغلب القوة. بس في حواديت تانية، الكانتشيل كمان بياخد جزاته.", ar: "سؤال وجيه. المغزى الضمني: العقل يغلب القوة. لكنه في حكايات أخرى ينال جزاءه أيضًا.", en: "Good question. The implied message: brains can beat strength. But in other stories, mouse-deer gets his comeuppance too."}
      - {speaker: Kak Tiara, text: "Kena batunya: majas yang artinya mendapat balasan atas perbuatannya.", ar_eg: "kena batunya (حرفيًا «جاله الحجر بتاعه»): مجاز معناه خد جزا عمله.", ar: "kena batunya (حرفيًا «أصابه حجره»): مجاز بمعنى نال جزاء فعله.", en: "Kena batunya ('hit by his stone'): an idiom for getting what you deserve."}
  - kind: word_spotlight
    title: Majas dan dongeng
    lines:
      - speaker: Kak Tiara
        text: "Pembuka dongeng: Pada suatu hari…, Alkisah…, Hiduplah seorang…"
        ar_eg: "افتتاح الحدوتة: «في يوم من الأيام…»، «يُحكى إن…»، «كان فيه واحد…»."
        ar: "افتتاحيات الحكاية: «في يوم من الأيام…»، «يُحكى أن…»، «عاش…»."
        en: "Story openers: One day…, The tale goes…, There lived a…"
        note:
          ar_eg: "Alkisah من العربي «القصة»."
          ar: "Alkisah من العربية «القصة»."
          en: "Alkisah comes from Arabic «القصة»."
      - {speaker: Kak Reza, text: "Fabel: cerita hewan. Mitos: cerita asal-usul. Hikayat: cerita lama Melayu.", ar_eg: "fabel: حدوتة حيوانات. mitos: أسطورة عن أصل حاجة. hikayat: حكاية ملايو قديمة.", ar: "fabel: حكاية حيوان. mitos: أسطورة نشأة. hikayat: حكاية ملايوية قديمة.", en: "Fable: an animal tale. Myth: an origin story. Hikayat: an old Malay tale."}
      - {speaker: Kak Tiara, text: "Hikayat juga dari bahasa Arab, hikāya!", ar_eg: "hikayat كمان من العربي «حكاية»!", ar: "وhikayat أيضًا من العربية «حكاية»!", en: "Hikayat is also from Arabic, hikāya!"}
      - {speaker: Kak Reza, text: "Majas: kena batunya, panjang tangan, lidah tak bertulang.", ar_eg: "مجازات: خد جزاته، إيده طويلة، لسانه مالوش عضم.", ar: "مجازات: نال جزاءه، يده طويلة، لسانه بلا عظم.", en: "Idioms: get one's comeuppance, light-fingered, a boneless tongue."}
      - {speaker: Kak Tiara, text: "Lidah tak bertulang artinya mudah berjanji tapi tidak menepati. Mirip bahasa Arab, kan?", ar_eg: "«لسانه مالوش عضم» يعني بيوعد بسهولة وما بينفذش. زي عندنا بالظبط، صح؟", ar: "«لسانه بلا عظم»: يعد بسهولة ولا يفي. يشبه تعبيرنا العربي، أليس كذلك؟", en: "A boneless tongue means promising easily but not keeping it. Like Arabic, right?"}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Pada suatu hari, hiduplah seekor kancil yang cerdik."
        ar_eg: "كان يا ما كان، كان فيه كانتشيل شاطر."
        ar: "في يوم من الأيام عاش كانتشيل ذكي."
        en: "Once upon a time there lived a clever mouse-deer."
        note:
          ar_eg: "كرر ورانا بصوت الحكّاء."
          ar: "ردّد بعدنا بصوت الحكواتي."
          en: "Repeat after us, storyteller style."
      - {speaker: Kak Reza, text: "Pada suatu hari, hiduplah seekor kancil yang cerdik.", ar_eg: "كان يا ما كان، كان فيه كانتشيل شاطر.", ar: "في يوم من الأيام عاش كانتشيل ذكي.", en: "Once upon a time there lived a clever mouse-deer."}
      - {speaker: Kak Tiara, text: "Akal bisa mengalahkan kekuatan.", ar_eg: "العقل ممكن يغلب القوة.", ar: "العقل يغلب القوة.", en: "Brains can beat strength."}
      - {speaker: Kak Reza, text: "Akal bisa mengalahkan kekuatan.", ar_eg: "العقل ممكن يغلب القوة.", ar: "العقل يغلب القوة.", en: "Brains can beat strength."}
      - {speaker: Kak Tiara, text: "Akhirnya, kancil kena batunya.", ar_eg: "وفي الآخر، الكانتشيل خد جزاته.", ar: "وفي النهاية نال الكانتشيل جزاءه.", en: "In the end, mouse-deer got his comeuppance."}
      - {speaker: Kak Reza, text: "Akhirnya, kancil kena batunya.", ar_eg: "وفي الآخر، الكانتشيل خد جزاته.", ar: "وفي النهاية نال الكانتشيل جزاءه.", en: "In the end, mouse-deer got his comeuppance."}
      - {speaker: Kak Tiara, text: "Pesan tersiratnya sangat dalam.", ar_eg: "المغزى الضمني عميق جدًا.", ar: "المغزى الضمني عميق جدًا.", en: "The implied message is very deep."}
      - {speaker: Kak Reza, text: "Pesan tersiratnya sangat dalam.", ar_eg: "المغزى الضمني عميق جدًا.", ar: "المغزى الضمني عميق جدًا.", en: "The implied message is very deep."}
  - kind: outro
    title: Dongeng Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan satu dongeng Mesir untuk anak-anak Arborek. Mulai dengan: Pada suatu hari…"
        ar_eg: "يا محمد، احكي حدوتة مصرية لعيال أربوريك. ابدأ بـ: كان يا ما كان…"
        ar: "يا محمد، احكِ حكاية مصرية لأطفال أربوريك. ابدأ بـ: في يوم من الأيام…"
        en: "Mohamed, tell an Egyptian tale for the Arborek children. Start with: One day…"
        note:
          ar_eg: "دورك! احكيها بصوت عالي."
          ar: "دورك! احكها بصوت مسموع."
          en: "Your turn! Tell it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Pada suatu hari, Juha naik keledai ke pasar bersama anaknya…", ar_eg: "مثلًا: «في يوم من الأيام، جحا ركب الحمار ورايح السوق مع ابنه…»", ar: "مثلًا: «في يوم من الأيام ركب جحا حماره إلى السوق مع ابنه…»", en: "For example: One day, Juha rode his donkey to market with his son…"}
      - {speaker: Kak Tiara, text: "Besok, tulis dongeng pendek dengan satu pesan tersirat.", ar_eg: "بكرة، اكتب حدوتة قصيرة فيها مغزى ضمني واحد.", ar: "غدًا، اكتب حكاية قصيرة بمغزى ضمني واحد.", en: "Tomorrow, write a short tale with one implied message."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Selamat tidur, anak-anak!", ar_eg: "شكرًا يا محمد. تصبحوا على خير يا ولاد!", ar: "شكرًا يا محمد. نومًا هنيئًا يا أطفال!", en: "Thank you, Mohamed. Good night, children!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [dongeng, fabel, mitos, hikayat, kancil, buaya, alkisah, majas, kena batunya, lidah tak bertulang, pesan tersirat, mendongeng]
review:
  status: draft
  verified: false
  notes: |
    "Kancil dan Buaya" is a traditional Malay-Indonesian folk tale (public domain).
    Spot-check: Papua's 250+ languages; Arborek as a Raja Ampat village island;
    idiom meanings (kena batunya, lidah tak bertulang).
