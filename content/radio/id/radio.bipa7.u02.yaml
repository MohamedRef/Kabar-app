schema: kabar.radio/v1
id: radio.bipa7.u02
language: id
level: bipa7
unit: bipa7.u02
title:
  target: Di bawah laut Raja Ampat
  ar_eg: تحت بحر راجا أمبات
  ar: تحت مياه راجا أمبات
  en: Under the sea of Raja Ampat
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Pagi di Waisai
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Waisai, Raja Ampat! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من وايساي، راجا أمبات! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من وايساي، راجا أمبات! هذا كبار راديو. أنا تيارا.", en: "Good morning from Waisai, Raja Ampat! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Rambut saya masih basah. Tadi pagi saya snorkeling di atas terumbu karang.", ar_eg: "أنا رضا. شعري لسه مبلول. الصبح عملت سنوركلينج فوق الشعاب المرجانية.", ar: "أنا رضا. شعري ما زال مبتلًا؛ فقد غطست هذا الصباح فوق الشعاب المرجانية.", en: "I'm Reza. My hair is still wet. This morning I went snorkelling over the coral reef."}
      - {speaker: Kak Tiara, text: "Raja Ampat termasuk tempat dengan keanekaragaman hayati laut tertinggi yang pernah dicatat.", ar_eg: "راجا أمبات من الأماكن اللي فيها أعلى تنوع حيوي بحري اتسجل.", ar: "تُعد راجا أمبات من أعلى المناطق تنوعًا حيويًا بحريًا مما سُجّل.", en: "Raja Ampat is among the places with the highest marine biodiversity ever recorded."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar teks eksplanasi dan bahasa presentasi ilmiah."
        ar_eg: "النهارده هنتعلم النص التفسيري ولغة العرض العلمي."
        ar: "اليوم نتعلم النص التفسيري ولغة العرض العلمي."
        en: "Today we learn the explanation text and the language of scientific presentations."
      - {speaker: Kak Tiara, text: "Mohamed, kamu pernah menyelam di Laut Merah?", ar_eg: "يا محمد، غطست في البحر الأحمر قبل كده؟", ar: "يا محمد، هل غطست في البحر الأحمر من قبل؟", en: "Mohamed, have you ever dived in the Red Sea?"}
  - kind: dialogue
    title: Mengapa karang memutih?
    lines:
      - speaker: Kak Tiara
        text: "Kak Reza memberi presentasi singkat. Dengar urutan sebab dan akibat."
        ar_eg: "رضا هيعمل عرض قصير. اسمع ترتيب السبب والنتيجة."
        ar: "يقدم رضا عرضًا قصيرًا. انتبه إلى تسلسل السبب والنتيجة."
        en: "Reza gives a short presentation. Listen to the chain of cause and effect."
        note:
          ar_eg: "النص التفسيري: الظاهرة، وبعدين إزاي بتحصل، وبعدين النتيجة."
          ar: "النص التفسيري: الظاهرة، ثم كيف تحدث، ثم نتيجتها."
          en: "An explanation text: the phenomenon, how it happens, then the result."
      - {speaker: Kak Reza, text: "Hadirin, izinkan saya menjelaskan fenomena pemutihan karang.", ar_eg: "حضرات الحضور، اسمحولي أشرح ظاهرة ابيضاض المرجان.", ar: "أيها الحضور، اسمحوا لي أن أشرح ظاهرة ابيضاض المرجان.", en: "Ladies and gentlemen, allow me to explain coral bleaching."}
      - {speaker: Kak Reza, text: "Karang hidup bersama alga kecil. Alga inilah yang memberi warna dan makanan.", ar_eg: "المرجان عايش مع طحالب صغيرة. والطحالب دي هي اللي بتديله اللون والأكل.", ar: "يعيش المرجان مع طحالب دقيقة، وهي التي تمنحه اللون والغذاء.", en: "Coral lives with tiny algae. These algae give it colour and food."}
      - {speaker: Kak Reza, text: "Ketika suhu air laut naik, karang mengeluarkan alga tersebut.", ar_eg: "لما حرارة ميه البحر بتعلى، المرجان بيطرد الطحالب دي.", ar: "حين ترتفع حرارة مياه البحر، يطرد المرجان تلك الطحالب.", en: "When sea temperatures rise, the coral expels those algae."}
      - {speaker: Kak Reza, text: "Akibatnya, karang menjadi putih. Jika berlangsung lama, karang bisa mati.", ar_eg: "والنتيجة، المرجان بيبقى أبيض. ولو طوّلت، المرجان ممكن يموت.", ar: "فيبيضّ المرجان نتيجة لذلك، وإن طال الأمر قد يموت.", en: "As a result, the coral turns white. If it lasts long, the coral can die."}
      - {speaker: Kak Tiara, text: "Pertanyaan: apa yang dilakukan masyarakat di sini?", ar_eg: "سؤال: الناس هنا بيعملوا إيه؟", ar: "سؤال: ماذا يفعل الأهالي هنا؟", en: "Question: what do people here do?"}
      - {speaker: Kak Reza, text: "Pertanyaan yang bagus. Ada tradisi sasi laut: wilayah tertentu ditutup sementara agar ikan dan karang pulih.", ar_eg: "سؤال حلو. فيه تقليد اسمه «ساسي البحر»: مناطق معينة بتتقفل فترة عشان السمك والمرجان يرجعوا.", ar: "سؤال وجيه. هناك تقليد «ساسي البحر»: تُغلق مناطق معينة مؤقتًا ليتعافى السمك والمرجان.", en: "Good question. There's a tradition called sasi laut: certain areas are closed for a while so fish and coral recover."}
      - {speaker: Kak Reza, text: "Selain itu, hutan bakau di pantai melindungi anak ikan dan menahan ombak.", ar_eg: "غير كده، غابات المانجروف على الشط بتحمي صغار السمك وبتصد الموج.", ar: "فضلًا عن ذلك، تحمي غابات المنغروف الساحلية صغار الأسماك وتصدّ الأمواج.", en: "Besides that, coastal mangroves shelter young fish and hold back waves."}
      - {speaker: Kak Reza, text: "Demikian presentasi saya. Terima kasih atas perhatiannya.", ar_eg: "ده كان العرض بتاعي. شكرًا على حسن الاستماع.", ar: "كان هذا عرضي. شكرًا على حسن الإصغاء.", en: "That concludes my presentation. Thank you for your attention."}
      - {speaker: Kak Tiara, text: "Jelas dan runtut! Kearifan lokal dan sains bekerja bersama.", ar_eg: "واضح ومترتب! الحكمة الشعبية والعلم شغالين مع بعض.", ar: "واضح ومتسلسل! الحكمة المحلية والعلم يعملان معًا.", en: "Clear and well-ordered! Local wisdom and science working together."}
  - kind: word_spotlight
    title: Teks eksplanasi
    lines:
      - speaker: Kak Tiara
        text: "Kata sebab-akibat: ketika, karena, akibatnya, oleh karena itu, sehingga, jika."
        ar_eg: "كلمات السبب والنتيجة: لما، عشان، والنتيجة، عشان كده، لدرجة إن، لو."
        ar: "أدوات السبب والنتيجة: حين، لأن، نتيجةً لذلك، لذلك، بحيث، إذا."
        en: "Cause-effect words: when, because, as a result, therefore, so that, if."
        note:
          ar_eg: "النص التفسيري بيستعمل المضارع ومن غير «أنا» كتير."
          ar: "يستخدم النص التفسيري المضارع ويقلّ فيه ضمير المتكلم."
          en: "Explanation texts use the present and rarely say 'I'."
      - {speaker: Kak Reza, text: "Terumbu karang, alga, pemutihan karang, suhu, keanekaragaman hayati.", ar_eg: "شعاب مرجانية، طحالب، ابيضاض المرجان، حرارة، تنوع حيوي.", ar: "شعاب مرجانية، طحالب، ابيضاض المرجان، حرارة، تنوع حيوي.", en: "Coral reef, algae, coral bleaching, temperature, biodiversity."}
      - {speaker: Kak Tiara, text: "Hutan bakau, sasi, segitiga terumbu karang, kawasan konservasi.", ar_eg: "غابات المانجروف، ساسي، مثلث المرجان، محمية طبيعية.", ar: "غابات المنغروف، ساسي، مثلث المرجان، منطقة محمية.", en: "Mangrove forest, sasi, Coral Triangle, conservation area."}
      - {speaker: Kak Reza, text: "Membuka presentasi: Izinkan saya menjelaskan… Menutup: Demikian presentasi saya.", ar_eg: "افتتاح العرض: «اسمحولي أشرح…». الختام: «ده كان العرض بتاعي».", ar: "افتتاح العرض: «اسمحوا لي أن أشرح…». الختام: «كان هذا عرضي».", en: "Opening: Allow me to explain… Closing: That concludes my presentation."}
      - {speaker: Kak Tiara, text: "Menjawab pertanyaan: Pertanyaan yang bagus. Terima kasih atas pertanyaannya.", ar_eg: "الرد على الأسئلة: «سؤال حلو». «شكرًا على سؤالك».", ar: "الرد على الأسئلة: «سؤال وجيه». «شكرًا على سؤالك».", en: "Answering questions: Good question. Thank you for your question."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Ketika suhu naik, karang mengeluarkan alga."
        ar_eg: "لما الحرارة بتعلى، المرجان بيطرد الطحالب."
        ar: "حين ترتفع الحرارة، يطرد المرجان الطحالب."
        en: "When the temperature rises, coral expels its algae."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Ketika suhu naik, karang mengeluarkan alga.", ar_eg: "لما الحرارة بتعلى، المرجان بيطرد الطحالب.", ar: "حين ترتفع الحرارة، يطرد المرجان الطحالب.", en: "When the temperature rises, coral expels its algae."}
      - {speaker: Kak Tiara, text: "Akibatnya, karang menjadi putih.", ar_eg: "والنتيجة، المرجان بيبقى أبيض.", ar: "ونتيجة لذلك يبيضّ المرجان.", en: "As a result, the coral turns white."}
      - {speaker: Kak Reza, text: "Akibatnya, karang menjadi putih.", ar_eg: "والنتيجة، المرجان بيبقى أبيض.", ar: "ونتيجة لذلك يبيضّ المرجان.", en: "As a result, the coral turns white."}
      - {speaker: Kak Tiara, text: "Izinkan saya menjelaskan fenomena ini.", ar_eg: "اسمحولي أشرح الظاهرة دي.", ar: "اسمحوا لي أن أشرح هذه الظاهرة.", en: "Allow me to explain this phenomenon."}
      - {speaker: Kak Reza, text: "Izinkan saya menjelaskan fenomena ini.", ar_eg: "اسمحولي أشرح الظاهرة دي.", ar: "اسمحوا لي أن أشرح هذه الظاهرة.", en: "Allow me to explain this phenomenon."}
      - {speaker: Kak Tiara, text: "Demikian presentasi saya. Terima kasih.", ar_eg: "ده كان العرض بتاعي. شكرًا.", ar: "كان هذا عرضي. شكرًا.", en: "That concludes my presentation. Thank you."}
      - {speaker: Kak Reza, text: "Demikian presentasi saya. Terima kasih.", ar_eg: "ده كان العرض بتاعي. شكرًا.", ar: "كان هذا عرضي. شكرًا.", en: "That concludes my presentation. Thank you."}
  - kind: outro
    title: Presentasi Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, jelaskan satu fenomena alam di Mesir. Misalnya, angin khamsin."
        ar_eg: "يا محمد، اشرح ظاهرة طبيعية في مصر. مثلًا، رياح الخماسين."
        ar: "يا محمد، اشرح ظاهرة طبيعية في مصر، كرياح الخماسين مثلًا."
        en: "Mohamed, explain a natural phenomenon in Egypt. For example, the khamsin wind."
        note:
          ar_eg: "دورك! استعمل ketika وakibatnya."
          ar: "دورك! استخدم ketika وakibatnya."
          en: "Your turn! Use ketika and akibatnya."
      - {speaker: Kak Reza, text: "Contohnya: Ketika musim semi tiba, angin panas bertiup dari gurun. Akibatnya, langit Kairo menjadi kuning berdebu.", ar_eg: "مثلًا: «لما الربيع بييجي، ريح سخنة بتهب من الصحرا. والنتيجة، سما القاهرة بتبقى صفرا ومتربة».", ar: "مثلًا: «حين يحل الربيع تهب رياح حارة من الصحراء، فتصير سماء القاهرة صفراء مغبرّة».", en: "For example: When spring comes, hot wind blows from the desert. As a result, Cairo's sky turns dusty yellow."}
      - {speaker: Kak Tiara, text: "Besok, tulis teks eksplanasi pendek dengan tiga bagian.", ar_eg: "بكرة، اكتب نص تفسيري قصير من تلات أجزاء.", ar: "غدًا، اكتب نصًا تفسيريًا قصيرًا من ثلاثة أجزاء.", en: "Tomorrow, write a short three-part explanation text."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Salam dari ikan-ikan Raja Ampat!", ar_eg: "شكرًا يا محمد. سلام من سمك راجا أمبات!", ar: "شكرًا يا محمد. تحية من أسماك راجا أمبات!", en: "Thank you, Mohamed. Greetings from Raja Ampat's fish!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [terumbu karang, pemutihan karang, alga, suhu, keanekaragaman hayati, hutan bakau, sasi, teks eksplanasi, fenomena, akibatnya, ketika, izinkan saya]
review:
  status: draft
  verified: false
  notes: |
    Spot-check: Raja Ampat biodiversity ("among the highest recorded"); coral bleaching
    mechanism (zooxanthellae expelled under heat stress); sasi laut practice in Raja
    Ampat; Waisai as regency capital; khamsin in Egyptian spring.
