schema: kabar.radio/v1
id: radio.bipa4.u10
language: id
level: bipa4
unit: bipa4.u10
title:
  target: Yang terhormat, para pendengar
  ar_eg: حضرات المستمعين المحترمين
  ar: السادة المستمعون المحترمون
  en: Honoured listeners
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Kota bunga Tomohon
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Tomohon, kota bunga! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من توموهون، مدينة الورد! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من توموهون، مدينة الزهور! هذا كبار راديو. أنا تيارا.", en: "Good morning from Tomohon, the city of flowers! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Minggu ini ada festival bunga. Jalan-jalan dipenuhi kendaraan hias dari bunga segar.", ar_eg: "أنا رضا. الأسبوع ده فيه مهرجان ورد. الشوارع مليانة عربيات متزيّنة بورد طبيعي.", ar: "أنا رضا. هذا الأسبوع مهرجان الزهور، والشوارع مليئة بعربات مزيّنة بالزهور الطبيعية.", en: "I'm Reza. This week there's a flower festival. The streets are full of floats made of fresh flowers."}
      - {speaker: Kak Tiara, text: "Ini juga episode terakhir kami di Sulawesi. Hati kami berat!", ar_eg: "ودي كمان آخر حلقة لينا في سولاويسي. قلبنا تقيل!", ar: "وهذه آخر حلقاتنا في سولاويسي. قلوبنا مثقلة!", en: "It's also our last episode in Sulawesi. Our hearts are heavy!"}
      - speaker: Kak Reza
        text: "Hari ini kita belajar pidato singkat, riwayat hidup tokoh, dan ungkapan seperti buah tangan."
        ar_eg: "النهارده هنتعلم الخطبة القصيرة، وسيرة شخصية، وتعبيرات زي buah tangan."
        ar: "اليوم نتعلم الخطبة القصيرة، وسيرة شخصية، وتعابير مثل buah tangan."
        en: "Today we learn a short speech, a figure's life story, and idioms like buah tangan."
      - {speaker: Kak Tiara, text: "Mohamed, pernahkah kamu berpidato di depan banyak orang?", ar_eg: "يا محمد، اتكلمت قدام ناس كتير قبل كده؟", ar: "يا محمد، هل ألقيت خطبة أمام جمهور من قبل؟", en: "Mohamed, have you ever given a speech in front of a crowd?"}
  - kind: dialogue
    title: Sambutan festival bunga
    lines:
      - speaker: Kak Tiara
        text: "Kak Reza diminta memberi sambutan di festival. Ayo, latihan dulu!"
        ar_eg: "طلبوا من رضا يقول كلمة في المهرجان. يلا نتمرن الأول!"
        ar: "طُلب من رضا إلقاء كلمة في المهرجان. هيا نتدرب أولًا!"
        en: "Reza has been asked to give a welcome speech at the festival. Let's practise first!"
        note:
          ar_eg: "الخطب الإندونيسي بتبدأ بتحية كل الحاضرين حسب مكانتهم قبل الكلام نفسه."
          ar: "تبدأ الخطب الإندونيسية بتحية الحاضرين جميعًا بحسب مقاماتهم قبل المضمون."
          en: "Indonesian speeches open by greeting everyone present, by rank, before the content."
      - {speaker: Kak Reza, text: "Yang terhormat Bapak Wali Kota Tomohon, yang saya hormati para tokoh masyarakat, dan hadirin yang berbahagia.", ar_eg: "السيد عمدة توموهون المحترم، وحضرات وجهاء المجتمع، والحضور الكرام.", ar: "السيد عمدة توموهون المحترم، ووجهاء المجتمع الأفاضل، والحضور الكرام.", en: "The honourable Mayor of Tomohon, respected community leaders, and dear guests."}
      - {speaker: Kak Reza, text: "Pertama-tama, marilah kita panjatkan puji syukur kepada Tuhan Yang Maha Esa.", ar_eg: "أولًا، نحمد الله ونشكره.", ar: "بادئ ذي بدء، لنرفع آيات الحمد والشكر لله الواحد الأحد.", en: "First of all, let us give thanks to God Almighty."}
      - {speaker: Kak Reza, text: "Saya datang dari jauh, tetapi warga Tomohon menyambut saya seperti keluarga sendiri.", ar_eg: "أنا جاي من بعيد، بس أهل توموهون استقبلوني كأني من العيلة.", ar: "جئت من بعيد، لكن أهل توموهون استقبلوني كأنني واحد من أهلهم.", en: "I've come from afar, but the people of Tomohon welcomed me like family."}
      - {speaker: Kak Reza, text: "Festival ini bukan hanya pesta bunga, tetapi juga bukti kerja keras para petani bunga.", ar_eg: "المهرجان ده مش بس حفلة ورد، ده كمان دليل على تعب فلاحين الورد.", ar: "هذا المهرجان ليس احتفالًا بالزهور فحسب، بل شاهد على كدّ مزارعيها أيضًا.", en: "This festival isn't just a celebration of flowers, but proof of the flower farmers' hard work."}
      - {speaker: Kak Reza, text: "Akhir kata, terima kasih atas perhatiannya. Wassalamualaikum warahmatullahi wabarakatuh.", ar_eg: "وفي الختام، شكرًا على حسن استماعكم. والسلام عليكم ورحمة الله وبركاته.", ar: "وختامًا، شكرًا على حسن الإصغاء. والسلام عليكم ورحمة الله وبركاته.", en: "In closing, thank you for your attention. Wassalamualaikum warahmatullahi wabarakatuh."}
      - {speaker: Kak Tiara, text: "Bagus! Tapi Tomohon mayoritas Kristen. Mungkin tambahkan salam untuk semua: Salam sejahtera bagi kita semua.", ar_eg: "حلو! بس أغلب أهل توموهون مسيحيين. ممكن تزوّد تحية للكل: السلام والخير لينا كلنا.", ar: "أحسنت! لكن غالبية أهل توموهون مسيحيون، فربما تضيف تحية للجميع: السلام والخير لنا جميعًا.", en: "Good! But Tomohon is mostly Christian. Maybe add a greeting for everyone: Peace be upon us all."}
      - {speaker: Kak Reza, text: "Betul juga. Terima kasih, Kak. Sekarang, siapa tokoh nasional dari Sulawesi Utara?", ar_eg: "عندك حق. شكرًا يا تيارا. دلوقتي، مين الشخصية القومية من شمال سولاويسي؟", ar: "معك حق. شكرًا. والآن، من الشخصية الوطنية من شمال سولاويسي؟", en: "Good point. Thanks. Now, who's a national figure from North Sulawesi?"}
      - {speaker: Kak Tiara, text: "Sam Ratulangi. Beliau lahir di Tondano pada tahun 1890 dan menjadi gubernur pertama Sulawesi.", ar_eg: "سام راتولانجي. اتولد في توندانو سنة 1890 وبقى أول محافظ لسولاويسي.", ar: "سام راتولانغي. وُلد في توندانو عام 1890 وصار أول حاكم لسولاويسي.", en: "Sam Ratulangi. He was born in Tondano in 1890 and became Sulawesi's first governor."}
      - {speaker: Kak Reza, text: "Semboyannya terkenal: Si tou timou tumou tou. Artinya, manusia hidup untuk memanusiakan orang lain.", ar_eg: "شعاره مشهور: Si tou timou tumou tou. يعني الإنسان عايش عشان يخلي غيره إنسان.", ar: "شعاره مشهور: Si tou timou tumou tou، ومعناه أن الإنسان يحيا ليعين غيره على أن يحيا إنسانًا.", en: "His motto is famous: Si tou timou tumou tou. It means people live to help others live as humans."}
      - {speaker: Kak Tiara, text: "Beliau orang yang rendah hati, tetapi keras kepala dalam membela rakyat.", ar_eg: "كان متواضع، بس دماغه ناشفة في الدفاع عن الشعب.", ar: "كان متواضعًا، لكنه عنيد في الدفاع عن الشعب.", en: "He was humble, but stubborn in defending the people."}
      - {speaker: Kak Reza, text: "Namanya menjadi buah bibir. Bandara di Manado diberi nama Sam Ratulangi.", ar_eg: "اسمه بقى على كل لسان. ومطار مانادو اتسمّى على اسمه.", ar: "صار اسمه على كل لسان، وسُمّي مطار مانادو باسمه.", en: "His name is on everyone's lips. Manado's airport is named after him."}
  - kind: word_spotlight
    title: Buah tangan, keras kepala
    lines:
      - speaker: Kak Tiara
        text: "Buah tangan berarti oleh-oleh. Saya membawa buah tangan dari Tomohon."
        ar_eg: "buah tangan (حرفيًا «تمرة الإيد») يعني هدية من السفر. جايبة هدايا من توموهون."
        ar: "buah tangan (حرفيًا «ثمرة اليد») تعني هدية السفر. أحضرت هدايا من توموهون."
        en: "Buah tangan ('fruit of the hand') means a travel gift. I'm bringing gifts from Tomohon."
        note:
          ar_eg: "التعبير معناه مش بيطلع من الكلمات: زي «إيده طويلة» عندنا."
          ar: "معنى التعبير الاصطلاحي لا يُفهم من ألفاظه، كقولنا «يده طويلة»."
          en: "An idiom's meaning isn't in its words, like Egyptian «إيده طويلة»."
      - {speaker: Kak Reza, text: "Buah bibir: orang yang banyak dibicarakan. Buah hati: anak tersayang.", ar_eg: "buah bibir: حد الناس كلها بتتكلم عنه. buah hati: الضنا الغالي.", ar: "buah bibir: من يكثر الحديث عنه. buah hati: فلذة الكبد.", en: "Buah bibir: the talk of the town. Buah hati: a beloved child."}
      - {speaker: Kak Tiara, text: "Rendah hati, keras kepala, besar kepala, panjang tangan.", ar_eg: "متواضع، دماغه ناشفة، شايف نفسه، إيده طويلة (حرامي).", ar: "متواضع، عنيد، مغرور، يده طويلة (سارق).", en: "Humble, stubborn, big-headed, light-fingered."}
      - speaker: Kak Reza
        text: "Yang terhormat, yang saya hormati, hadirin yang berbahagia, akhir kata."
        ar_eg: "السيد المحترم، اللي بحترمهم، الحضور الكرام، وفي الختام."
        ar: "المحترم، الذين أُجلّهم، الحضور الكرام، وختامًا."
        en: "The honourable, whom I respect, dear guests, in closing."
        note:
          ar_eg: "yang terhormat لأعلى واحد في المكان، وyang saya hormati للباقيين."
          ar: "yang terhormat لأرفع الحاضرين مقامًا، وyang saya hormati للبقية."
          en: "Yang terhormat for the highest-ranked person, yang saya hormati for the rest."
      - {speaker: Kak Tiara, text: "Riwayat hidup: lahir, bersekolah, berjuang, wafat, dikenang.", ar_eg: "سيرة: اتولد، اتعلم، ناضل، اتوفى، الناس بتفتكره.", ar: "سيرة: وُلد، تعلّم، ناضل، توفي، يُذكر.", en: "Life story: born, schooled, struggled, died, remembered."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Yang terhormat Bapak Wali Kota, dan hadirin yang berbahagia."
        ar_eg: "السيد العمدة المحترم، والحضور الكرام."
        ar: "السيد العمدة المحترم، والحضور الكرام."
        en: "The honourable Mayor, and dear guests."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Yang terhormat Bapak Wali Kota, dan hadirin yang berbahagia.", ar_eg: "السيد العمدة المحترم، والحضور الكرام.", ar: "السيد العمدة المحترم، والحضور الكرام.", en: "The honourable Mayor, and dear guests."}
      - {speaker: Kak Tiara, text: "Akhir kata, terima kasih atas perhatiannya.", ar_eg: "وفي الختام، شكرًا على حسن استماعكم.", ar: "وختامًا، شكرًا على حسن الإصغاء.", en: "In closing, thank you for your attention."}
      - {speaker: Kak Reza, text: "Akhir kata, terima kasih atas perhatiannya.", ar_eg: "وفي الختام، شكرًا على حسن استماعكم.", ar: "وختامًا، شكرًا على حسن الإصغاء.", en: "In closing, thank you for your attention."}
      - {speaker: Kak Tiara, text: "Beliau rendah hati, tetapi keras kepala.", ar_eg: "كان متواضع، بس دماغه ناشفة.", ar: "كان متواضعًا لكنه عنيد.", en: "He was humble, but stubborn."}
      - {speaker: Kak Reza, text: "Beliau rendah hati, tetapi keras kepala.", ar_eg: "كان متواضع، بس دماغه ناشفة.", ar: "كان متواضعًا لكنه عنيد.", en: "He was humble, but stubborn."}
      - {speaker: Kak Tiara, text: "Saya membawa buah tangan dari Tomohon.", ar_eg: "جايب هدايا من توموهون.", ar: "أحضرت هدايا من توموهون.", en: "I'm bringing gifts from Tomohon."}
      - {speaker: Kak Reza, text: "Saya membawa buah tangan dari Tomohon.", ar_eg: "جايب هدايا من توموهون.", ar: "أحضرت هدايا من توموهون.", en: "I'm bringing gifts from Tomohon."}
  - kind: outro
    title: Pidato Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, buat pembukaan pidato untuk acara di kantormu. Salam, puji syukur, lalu satu kalimat isi."
        ar_eg: "يا محمد، اعمل افتتاحية خطبة لحفلة في شغلك. تحية، وحمد، وبعدين جملة من المضمون."
        ar: "يا محمد، اكتب افتتاحية كلمة لحفل في عملك: تحية، وحمد، ثم جملة من المضمون."
        en: "Mohamed, write the opening of a speech for an event at work. Greetings, thanks to God, then one sentence of content."
        note:
          ar_eg: "دورك! قولها بصوت عالي وبثقة."
          ar: "دورك! قلها بصوت مسموع وبثقة."
          en: "Your turn! Say it out loud, with confidence."
      - {speaker: Kak Reza, text: "Contohnya: Yang terhormat Bapak Direktur, rekan-rekan yang saya hormati. Puji syukur kita panjatkan kepada Allah. Hari ini kita merayakan sepuluh tahun perusahaan kita.", ar_eg: "مثلًا: السيد المدير المحترم، والزملا الأعزاء. الحمد لله. النهارده بنحتفل بعشر سنين على شركتنا.", ar: "مثلًا: السيد المدير المحترم، والزملاء الأفاضل. الحمد لله. نحتفل اليوم بمرور عشر سنوات على شركتنا.", en: "For example: The honourable Director, respected colleagues. Praise be to God. Today we celebrate our company's tenth year."}
      - {speaker: Kak Tiara, text: "Besok, tulis riwayat hidup singkat tokoh yang kamu kagumi.", ar_eg: "بكرة، اكتب سيرة قصيرة لشخصية بتعجبك.", ar: "غدًا، اكتب سيرة موجزة لشخصية تعجبك.", en: "Tomorrow, write a short life story of someone you admire."}
      - {speaker: Kak Reza, text: "Terima kasih, Sulawesi! Terima kasih, Mohamed! Sampai jumpa di Kalimantan.", ar_eg: "شكرًا يا سولاويسي! شكرًا يا محمد! نتقابل في كاليمانتان.", ar: "شكرًا يا سولاويسي! شكرًا يا محمد! نلتقي في كاليمانتان.", en: "Thank you, Sulawesi! Thank you, Mohamed! See you in Kalimantan."}
      - {speaker: Kak Tiara, text: "Sampai jumpa di Kabar Radio!", ar_eg: "أشوفكم في كبار راديو!", ar: "إلى اللقاء في كبار راديو!", en: "See you on Kabar Radio!"}
words: [sambutan, yang terhormat, hadirin, akhir kata, riwayat hidup, buah tangan, buah bibir, rendah hati, keras kepala, gubernur, puji syukur, terhormat]
review:
