title:
  target: Pemeriksaan di puskesmas
  ar_eg: كشف في الوحدة الصحية
  ar: فحص في المركز الصحي
  en: A check-up at the puskesmas
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Pagi di Gorontalo
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Gorontalo! Ini Kabar Radio, acara Tips Sehat. Saya Tiara.", ar_eg: "صباح الخير من جورونتالو! ده كبار راديو، برنامج «نصايح صحية». أنا تيارا.", ar: "صباح الخير من غورونتالو! هذا كبار راديو، برنامج «نصائح صحية». أنا تيارا.", en: "Good morning from Gorontalo! This is Kabar Radio, Healthy Tips. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Hari ini kami di puskesmas, klinik kesehatan masyarakat.", ar_eg: "أنا رضا. النهارده إحنا في البوسكيسماس، الوحدة الصحية بتاعة الحي.", ar: "أنا رضا. اليوم نحن في البوسكيسماس، المركز الصحي المجتمعي.", en: "I'm Reza. Today we're at the puskesmas, the community health centre."}
      - speaker: Kak Tiara
        text: "Hampir setiap kecamatan di Indonesia punya puskesmas. Banyak warga berobat dengan BPJS."
        ar_eg: "تقريبًا كل حي في إندونيسيا فيه بوسكيسماس. وناس كتير بيتعالجوا بالـBPJS."
        ar: "في كل ناحية تقريبًا في إندونيسيا بوسكيسماس، ويتعالج كثيرون عبر BPJS."
        en: "Nearly every district in Indonesia has a puskesmas. Many people get treated with BPJS."
        note:
          ar_eg: "BPJS هو التأمين الصحي القومي، وبيغطي أغلب السكان."
          ar: "BPJS هو التأمين الصحي الوطني، ويغطي معظم السكان."
          en: "BPJS is the national health insurance; it covers most of the population."
      - {speaker: Kak Reza, text: "Kita belajar kata benda peN-...-an, seperti pemeriksaan dan pencegahan.", ar_eg: "هنتعلم أسماء peN-...-an، زي pemeriksaan وpencegahan.", ar: "نتعلم أسماء peN-...-an، مثل pemeriksaan وpencegahan.", en: "We learn peN-...-an nouns, like pemeriksaan and pencegahan."}
      - {speaker: Kak Tiara, text: "Mohamed, kapan terakhir kamu memeriksakan kesehatan?", ar_eg: "يا محمد، آخر مرة كشفت إمتى؟", ar: "يا محمد، متى أجريت آخر فحص صحي؟", en: "Mohamed, when did you last have a check-up?"}
  - kind: dialogue
    title: Ceramah kesehatan
    lines:
      - speaker: Kak Tiara
        text: "Saya jadi dokter puskesmas, ya. Kak Reza warganya."
        ar_eg: "أنا هبقى دكتورة البوسكيسماس. ورضا واحد من الأهالي."
        ar: "سأكون طبيبة البوسكيسماس، ورضا أحد السكان."
        en: "I'll be the puskesmas doctor. Reza is a resident."
        note:
          ar_eg: "مشهد تمثيلي: محاضرة صحية صغيرة."
          ar: "مشهد تمثيلي: محاضرة صحية قصيرة."
          en: "A role-play: a short health talk."
      - {speaker: Kak Tiara, text: "Bapak-bapak dan ibu-ibu, hari ini kita bicara tentang demam berdarah.", ar_eg: "يا حضرات، النهارده هنتكلم عن حمى الضنك.", ar: "أيها السادة والسيدات، نتحدث اليوم عن حمى الضنك.", en: "Ladies and gentlemen, today we talk about dengue fever."}
      - {speaker: Kak Reza, text: "Dokter, apa penyebab demam berdarah?", ar_eg: "يا دكتورة، إيه سبب حمى الضنك؟", ar: "يا دكتورة، ما سبب حمى الضنك؟", en: "Doctor, what causes dengue?"}
      - {speaker: Kak Tiara, text: "Penyakit ini disebarkan oleh nyamuk. Nyamuk itu bertelur di air yang bersih dan diam.", ar_eg: "المرض ده بينقله الناموس. والناموس ده بيبيض في المية النضيفة الراكدة.", ar: "ينقل البعوض هذا المرض، ويبيض في الماء النظيف الراكد.", en: "It's spread by mosquitoes. They lay eggs in clean, still water."}
      - {speaker: Kak Reza, text: "Bagaimana pencegahannya?", ar_eg: "إزاي نوقيه؟", ar: "كيف نقي منه؟", en: "How do we prevent it?"}
      - {speaker: Kak Tiara, text: "Pencegahannya dengan tiga M: menguras bak mandi, menutup tempat air, dan mendaur ulang barang bekas.", ar_eg: "الوقاية بتلات M: نفضّي حوض الحمام، نغطي أماكن المية، ونعيد تدوير الحاجات القديمة.", ar: "الوقاية بالميمات الثلاث: إفراغ حوض الحمام، وتغطية أوعية الماء، وإعادة تدوير الأشياء المستعملة.", en: "Prevention is the three Ms: drain the bath tub, cover water containers, and recycle old things."}
      - {speaker: Kak Reza, text: "Apa gejalanya, Dok?", ar_eg: "إيه أعراضه يا دكتورة؟", ar: "ما أعراضه يا دكتورة؟", en: "What are the symptoms, Doctor?"}
      - {speaker: Kak Tiara, text: "Demam tinggi, sakit kepala, nyeri otot, dan kadang bintik merah di kulit. Kalau ada gejala itu, segera ke puskesmas.", ar_eg: "سخونية عالية، وصداع، ووجع عضلات، وساعات نقط حمرا على الجلد. لو فيه الأعراض دي، روح البوسكيسماس على طول.", ar: "حمّى شديدة، وصداع، وألم عضلي، وأحيانًا بقع حمراء على الجلد. إن ظهرت فاذهب فورًا إلى البوسكيسماس.", en: "High fever, headache, muscle pain, sometimes red spots on the skin. If you have them, come to the puskesmas at once."}
      - {speaker: Kak Reza, text: "Apakah pemeriksaannya mahal?", ar_eg: "الكشف غالي؟", ar: "هل الفحص مكلف؟", en: "Is the examination expensive?"}
      - {speaker: Kak Tiara, text: "Dengan BPJS, pemeriksaan dan pengobatan di puskesmas gratis.", ar_eg: "بالـBPJS، الكشف والعلاج في البوسكيسماس ببلاش.", ar: "مع BPJS يكون الفحص والعلاج في البوسكيسماس مجانيًا.", en: "With BPJS, examination and treatment at the puskesmas are free."}
      - {speaker: Kak Reza, text: "Wah, bagus. Selain itu, apa tips sehat Dokter?", ar_eg: "الله، حلو. وغير كده، إيه نصايحك الصحية يا دكتورة؟", ar: "رائع. وما نصائحك الصحية الأخرى يا دكتورة؟", en: "Great. Any other healthy tips, Doctor?"}
      - {speaker: Kak Tiara, text: "Olahraga tiga puluh menit setiap hari, kurangi gula, dan tidur cukup. Pencegahan lebih baik daripada pengobatan.", ar_eg: "رياضة نص ساعة كل يوم، قلل السكر، ونام كفاية. الوقاية خير من العلاج.", ar: "رياضة ثلاثين دقيقة يوميًا، وقلّل السكر، ونَم كفايتك. الوقاية خير من العلاج.", en: "Exercise thirty minutes a day, cut down sugar, sleep enough. Prevention is better than cure."}
      - {speaker: Kak Reza, text: "Terima kasih, Dokter. Penjelasannya jelas sekali.", ar_eg: "شكرًا يا دكتورة. الشرح واضح أوي.", ar: "شكرًا يا دكتورة. الشرح واضح جدًا.", en: "Thank you, Doctor. A very clear explanation."}
  - kind: word_spotlight
    title: Pemeriksaan, pencegahan
    lines:
      - speaker: Kak Tiara
        text: "Periksa, pemeriksaan. Cegah, pencegahan. Obat, pengobatan."
        ar_eg: "يكشف، الكشف. يمنع، الوقاية. دوا، العلاج."
        ar: "يفحص، الفحص. يمنع، الوقاية. دواء، المعالجة."
        en: "Examine, examination. Prevent, prevention. Medicine, treatment."
        note:
          ar_eg: "peN-...-an بتعمل اسم للعملية نفسها، زي «المصدر» في العربي: فحص ← الفحص."
          ar: "peN-...-an تصنع اسمًا للعملية، كالمصدر في العربية: يفحص ← الفحص."
          en: "PeN-...-an names the process, like the Arabic masdar: examine → examination."
      - {speaker: Kak Reza, text: "Layan, pelayanan. Jelas, penjelasan. Sebar, penyebaran.", ar_eg: "يخدم، الخدمة. واضح، الشرح. ينشر، الانتشار.", ar: "يخدم، الخدمة. واضح، الإيضاح. ينشر، الانتشار.", en: "Serve, service. Clear, explanation. Spread, the spreading."}
      - {speaker: Kak Tiara, text: "Pelayanan puskesmas cepat. Penyebaran penyakit bisa dicegah.", ar_eg: "خدمة البوسكيسماس سريعة. وانتشار المرض ممكن نمنعه.", ar: "خدمة البوسكيسماس سريعة، ويمكن منع انتشار المرض.", en: "The puskesmas service is fast. The spread of disease can be prevented."}
      - {speaker: Kak Reza, text: "Gejala, penyebab, demam berdarah, nyeri otot, tekanan darah.", ar_eg: "أعراض، سبب، حمى الضنك، وجع عضلات، ضغط الدم.", ar: "أعراض، سبب، حمى الضنك، ألم عضلي، ضغط الدم.", en: "Symptoms, cause, dengue fever, muscle pain, blood pressure."}
      - {speaker: Kak Tiara, text: "Pencegahan lebih baik daripada pengobatan. Peribahasa ini ada di banyak bahasa.", ar_eg: "الوقاية خير من العلاج. المثل ده موجود في لغات كتير.", ar: "الوقاية خير من العلاج. هذا المثل موجود في لغات كثيرة.", en: "Prevention is better than cure. This saying exists in many languages."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Penyakit ini disebarkan oleh nyamuk."
        ar_eg: "المرض ده بينقله الناموس."
        ar: "ينقل البعوض هذا المرض."
        en: "This disease is spread by mosquitoes."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Penyakit ini disebarkan oleh nyamuk.", ar_eg: "المرض ده بينقله الناموس.", ar: "ينقل البعوض هذا المرض.", en: "This disease is spread by mosquitoes."}
      - {speaker: Kak Tiara, text: "Bagaimana pencegahannya?", ar_eg: "إزاي نوقيه؟", ar: "كيف الوقاية منه؟", en: "How is it prevented?"}
      - {speaker: Kak Reza, text: "Bagaimana pencegahannya?", ar_eg: "إزاي نوقيه؟", ar: "كيف الوقاية منه؟", en: "How is it prevented?"}
      - {speaker: Kak Tiara, text: "Pemeriksaan di puskesmas gratis.", ar_eg: "الكشف في البوسكيسماس ببلاش.", ar: "الفحص في البوسكيسماس مجاني.", en: "Examinations at the puskesmas are free."}
      - {speaker: Kak Reza, text: "Pemeriksaan di puskesmas gratis.", ar_eg: "الكشف في البوسكيسماس ببلاش.", ar: "الفحص في البوسكيسماس مجاني.", en: "Examinations at the puskesmas are free."}
      - {speaker: Kak Tiara, text: "Pencegahan lebih baik daripada pengobatan.", ar_eg: "الوقاية خير من العلاج.", ar: "الوقاية خير من العلاج.", en: "Prevention is better than cure."}
      - {speaker: Kak Reza, text: "Pencegahan lebih baik daripada pengobatan.", ar_eg: "الوقاية خير من العلاج.", ar: "الوقاية خير من العلاج.", en: "Prevention is better than cure."}
  - kind: outro
    title: Tips sehat Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, berikan satu tips untuk mencegah penyakit di musim panas Mesir. Pakai satu kata peN-...-an."
        ar_eg: "يا محمد، اديلنا نصيحة واحدة عشان نتجنب الأمراض في صيف مصر. استخدم كلمة peN-...-an."
        ar: "يا محمد، قدّم نصيحة للوقاية من الأمراض في صيف مصر، باستعمال كلمة peN-...-an."
        en: "Mohamed, give one tip to prevent illness in Egypt's summer. Use one peN-...-an word."
        note:
          ar_eg: "دورك! جملتين."
          ar: "دورك! جملتان."
          en: "Your turn! Two sentences."
      - {speaker: Kak Reza, text: "Contohnya: Minum air putih dua liter setiap hari. Pencegahan dehidrasi sangat penting saat cuaca panas.", ar_eg: "مثلًا: اشرب لترين مية كل يوم. الوقاية من الجفاف مهمة جدًا في الحر.", ar: "مثلًا: اشرب لترين من الماء يوميًا، فالوقاية من الجفاف مهمة جدًا في الحر.", en: "For example: Drink two litres of water a day. Preventing dehydration matters a lot in hot weather."}
      - {speaker: Kak Tiara, text: "Besok, buat brosur kecil: tiga tips sehat untuk keluargamu.", ar_eg: "بكرة، اعمل بروشور صغير: تلات نصايح صحية لعيلتك.", ar: "غدًا، اصنع نشرة صغيرة: ثلاث نصائح صحية لعائلتك.", en: "Tomorrow, make a little leaflet: three health tips for your family."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Sehat selalu!", ar_eg: "شكرًا يا محمد. دايمًا بصحة!", ar: "شكرًا يا محمد. دمت بصحة!", en: "Thank you, Mohamed. Stay healthy!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [puskesmas, BPJS, pemeriksaan, pencegahan, pengobatan, pelayanan, penjelasan, penyebaran, gejala, penyebab, demam berdarah, nyamuk]
