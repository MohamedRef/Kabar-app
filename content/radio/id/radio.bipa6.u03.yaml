title:
  target: Adat bersendi syarak
  ar_eg: العُرف قايم على الشرع
  ar: العرف قائم على الشرع
  en: Custom founded on sharia
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Jam Gadang
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Bukittinggi, Sumatra Barat! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من بوكيتينجي، غرب سومطرة! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من بوكيتينغي، غرب سومطرة! هذا كبار راديو. أنا تيارا.", en: "Good morning from Bukittinggi, West Sumatra! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Kami duduk di dekat Jam Gadang, menara jam di tengah kota.", ar_eg: "أنا رضا. قاعدين جنب جام جادانج، برج الساعة اللي في نص المدينة.", ar: "أنا رضا. نجلس قرب جام غادانغ، برج الساعة في وسط المدينة.", en: "I'm Reza. We're sitting near Jam Gadang, the clock tower in the town centre."}
      - {speaker: Kak Tiara, text: "Ini tanah Minangkabau. Di sini, rumah dan tanah diwariskan melalui garis ibu.", ar_eg: "دي أرض المينانجكاباو. هنا، البيوت والأراضي بتتورث عن طريق الأم.", ar: "هذه أرض المينانغكاباو، وهنا تُورَّث البيوت والأراضي عبر خط الأم.", en: "This is Minangkabau land. Here, houses and land are inherited through the mother's line."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar tentang sistem matrilineal dan peribahasa."
        ar_eg: "النهارده هنتعلم عن النظام الأمومي والأمثال."
        ar: "اليوم نتعلم عن النظام الأمومي والأمثال الشعبية."
        en: "Today we learn about the matrilineal system and proverbs."
      - {speaker: Kak Tiara, text: "Mohamed, di keluargamu, siapa yang mengambil keputusan penting?", ar_eg: "يا محمد، في عيلتك، مين اللي بياخد القرارات المهمة؟", ar: "يا محمد، من يتخذ القرارات المهمة في عائلتك؟", en: "Mohamed, in your family, who makes the important decisions?"}
  - kind: dialogue
    title: Wawancara dengan Datuk
    lines:
      - speaker: Kak Tiara
        text: "Kak Reza memerankan seorang datuk, pemimpin adat. Saya bertanya."
        ar_eg: "رضا هيمثّل دور «داتوك»، زعيم عُرفي. وأنا هسأل."
        ar: "يؤدي رضا دور «داتوك»، أي زعيم عرفي، وأنا أسأل."
        en: "Reza plays a datuk, a customary leader. I ask the questions."
        note:
          ar_eg: "شخصية تمثيلية. الكلام عن النظام في العموم؛ العيلات بتختلف."
          ar: "شخصية تمثيلية، والحديث عن النظام عمومًا؛ والعائلات تتفاوت."
          en: "A role-play figure. This is the system in general; families vary."
      - {speaker: Kak Tiara, text: "Datuk, apa arti matrilineal bagi orang Minang?", ar_eg: "يا داتوك، النظام الأمومي معناه إيه عند المينانج؟", ar: "يا داتوك، ماذا يعني النظام الأمومي للمينانغ؟", en: "Datuk, what does matrilineal mean for the Minang?"}
      - {speaker: Kak Reza, text: "Suku diturunkan dari ibu. Rumah gadang dan sawah pusaka dijaga oleh kaum perempuan.", ar_eg: "القبيلة بتتنقل من الأم. والبيت الكبير والأرض الموروثة الستات هما اللي بيحافظوا عليهم.", ar: "تنتقل العشيرة عبر الأم، وتحفظ النساء البيت الكبير والحقول الموروثة.", en: "The clan passes through the mother. The rumah gadang and ancestral rice fields are kept by the women."}
      - {speaker: Kak Tiara, text: "Lalu, apa peran laki-laki?", ar_eg: "طب، دور الراجل إيه؟", ar: "وما دور الرجل؟", en: "Then what's the men's role?"}
      - {speaker: Kak Reza, text: "Mamak, yaitu saudara laki-laki ibu, membimbing kemenakannya. Banyak laki-laki juga merantau.", ar_eg: "«الماماك»، يعني الخال، بيربّي ولاد أخته ويوجّههم. ورجالة كتير كمان بيسافروا يدوّروا على رزقهم.", ar: "«الماماك» أي الخال يرشد أبناء أخته، وكثير من الرجال يهاجرون طلبًا للرزق.", en: "The mamak, the mother's brother, guides his sister's children. Many men also go off to work away from home."}
      - {speaker: Kak Tiara, text: "Tetapi orang Minang juga sangat taat beragama, bukan?", ar_eg: "بس المينانج كمان متدينين جدًا، مش كده؟", ar: "لكن المينانغ متدينون جدًا أيضًا، أليس كذلك؟", en: "But the Minang are also very devout, aren't they?"}
      - {speaker: Kak Reza, text: "Betul. Kami punya pepatah: Adat basandi syarak, syarak basandi Kitabullah.", ar_eg: "مظبوط. عندنا مثل: «العُرف قايم على الشرع، والشرع قايم على كتاب الله».", ar: "صحيح. لدينا مثل: «العرف قائم على الشرع، والشرع قائم على كتاب الله».", en: "Right. We have a saying: Custom rests on sharia, sharia rests on the Book of God."}
      - {speaker: Kak Tiara, text: "Jadi adat dan agama berjalan bersama.", ar_eg: "يعني العُرف والدين ماشيين مع بعض.", ar: "إذن يسير العرف والدين معًا.", en: "So custom and religion go together."}
      - {speaker: Kak Reza, text: "Ya. Kami juga suka bicara dengan peribahasa. Di mana bumi dipijak, di situ langit dijunjung.", ar_eg: "أيوه. وإحنا كمان بنحب نتكلم بالأمثال. «في أي أرض تدوس عليها، تشيل سماها فوق راسك».", ar: "نعم. ونحب الكلام بالأمثال: «حيثما وطئت أرضًا، فارفع سماءها».", en: "Yes. We also love speaking in proverbs. Wherever you tread the earth, uphold that sky."}
      - {speaker: Kak Tiara, text: "Artinya, hormati adat di tempat kita tinggal. Pas sekali untuk kita para perantau!", ar_eg: "يعني احترم عادات المكان اللي عايش فيه. مناسب جدًا لينا إحنا المغتربين!", ar: "ومعناه: احترم أعراف المكان الذي تسكنه. ما أنسبه لنا نحن المغتربين!", en: "Meaning: respect local custom where you live. Perfect for us travellers!"}
  - kind: word_spotlight
    title: Peribahasa
    lines:
      - speaker: Kak Tiara
        text: "Peribahasa adalah kalimat kiasan yang berisi nasihat."
        ar_eg: "peribahasa جملة فيها كناية وجواها نصيحة: يعني مثل شعبي."
        ar: "peribahasa عبارة مجازية تحمل نصيحة، أي مثل شعبي."
        en: "A peribahasa is a figurative saying with advice."
        note:
          ar_eg: "زي «اللي ما يعرفش يقول عدس» عندنا."
          ar: "مثل أمثالنا الشعبية."
          en: "Like Egyptian folk proverbs."
      - {speaker: Kak Reza, text: "Air beriak tanda tak dalam: orang yang banyak bicara biasanya kurang ilmu.", ar_eg: "«الميه اللي بتعمل موج مش غويطة»: اللي بيتكلم كتير غالبًا علمه قليل.", ar: "«الماء المتموّج ليس عميقًا»: كثير الكلام قليل العلم غالبًا.", en: "Rippling water isn't deep: people who talk a lot usually know little."}
      - {speaker: Kak Tiara, text: "Sedikit demi sedikit, lama-lama menjadi bukit.", ar_eg: "«شوية بشوية، مع الوقت يبقوا جبل».", ar: "«قليلًا فقليلًا، يصير تلًّا مع الأيام».", en: "Little by little, in time it becomes a hill."}
      - {speaker: Kak Reza, text: "Suku, kaum, mamak, kemenakan, pusaka, merantau, penghulu, datuk.", ar_eg: "قبيلة، عشيرة، خال، ابن الأخت، ورث، يغترب، زعيم العشيرة، داتوك.", ar: "عشيرة، قوم، خال، ابن الأخت، إرث، الهجرة طلبًا للرزق، زعيم العشيرة، داتوك.", en: "Clan, kin group, maternal uncle, nephew or niece, heirloom, migrate for work, clan head, datuk."}
      - {speaker: Kak Tiara, text: "Rumah gadang: rumah besar dengan atap bergonjong, seperti tanduk kerbau.", ar_eg: "رومه جادانج: بيت كبير سقفه مدبب لفوق زي قرون الجاموسة.", ar: "رومه غادانغ: بيت كبير سقفه مدبب الأطراف كقرون الجاموس.", en: "Rumah gadang: a big house with upswept roof peaks, like buffalo horns."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Adat basandi syarak, syarak basandi Kitabullah."
        ar_eg: "العُرف قايم على الشرع، والشرع قايم على كتاب الله."
        ar: "العرف قائم على الشرع، والشرع قائم على كتاب الله."
        en: "Custom rests on sharia, sharia rests on the Book of God."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Adat basandi syarak, syarak basandi Kitabullah.", ar_eg: "العُرف قايم على الشرع، والشرع قايم على كتاب الله.", ar: "العرف قائم على الشرع، والشرع قائم على كتاب الله.", en: "Custom rests on sharia, sharia rests on the Book of God."}
      - {speaker: Kak Tiara, text: "Di mana bumi dipijak, di situ langit dijunjung.", ar_eg: "في أي أرض تدوس عليها، تشيل سماها فوق راسك.", ar: "حيثما وطئت أرضًا، فارفع سماءها.", en: "Wherever you tread the earth, uphold that sky."}
      - {speaker: Kak Reza, text: "Di mana bumi dipijak, di situ langit dijunjung.", ar_eg: "في أي أرض تدوس عليها، تشيل سماها فوق راسك.", ar: "حيثما وطئت أرضًا، فارفع سماءها.", en: "Wherever you tread the earth, uphold that sky."}
      - {speaker: Kak Tiara, text: "Sedikit demi sedikit, lama-lama menjadi bukit.", ar_eg: "شوية بشوية، مع الوقت يبقوا جبل.", ar: "قليلًا فقليلًا، يصير تلًّا مع الأيام.", en: "Little by little, in time it becomes a hill."}
      - {speaker: Kak Reza, text: "Sedikit demi sedikit, lama-lama menjadi bukit.", ar_eg: "شوية بشوية، مع الوقت يبقوا جبل.", ar: "قليلًا فقليلًا، يصير تلًّا مع الأيام.", en: "Little by little, in time it becomes a hill."}
      - {speaker: Kak Tiara, text: "Rumah gadang dijaga oleh kaum perempuan.", ar_eg: "البيت الكبير الستات هما اللي بيحافظوا عليه.", ar: "تحفظ النساء البيت الكبير.", en: "The rumah gadang is kept by the women."}
      - {speaker: Kak Reza, text: "Rumah gadang dijaga oleh kaum perempuan.", ar_eg: "البيت الكبير الستات هما اللي بيحافظوا عليه.", ar: "تحفظ النساء البيت الكبير.", en: "The rumah gadang is kept by the women."}
  - kind: outro
    title: Peribahasa Mesir
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, terjemahkan satu peribahasa Mesir ke bahasa Indonesia, lalu jelaskan artinya."
        ar_eg: "يا محمد، ترجم مثل مصري للإندونيسي، واشرح معناه."
        ar: "يا محمد، ترجم مثلًا مصريًا إلى الإندونيسية واشرح معناه."
        en: "Mohamed, translate an Egyptian proverb into Indonesian, then explain it."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Ikat kudamu di tempat yang dikatakan pemiliknya. Artinya, ikuti aturan tuan rumah.", ar_eg: "مثلًا: «اربط الحمار مطرح ما يقولك صاحبه». يعني امشي على قواعد صاحب البيت.", ar: "مثلًا: «اربط الحمار حيث يريد صاحبه»، ومعناه: اتبع قواعد صاحب الدار.", en: "For example: Tie your donkey where its owner says. Meaning, follow the host's rules."}
      - {speaker: Kak Tiara, text: "Wah, mirip dengan di mana bumi dipijak! Besok, cari dua peribahasa Indonesia lagi.", ar_eg: "واو، شبه «في أي أرض تدوس عليها»! بكرة، دوّر على مثلين إندونيسيين كمان.", ar: "يشبه «حيثما وطئت أرضًا»! غدًا، ابحث عن مثلين إندونيسيين آخرين.", en: "Wow, like 'wherever you tread the earth'! Tomorrow, find two more Indonesian proverbs."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Sedikit demi sedikit, kamu jadi bukit!", ar_eg: "شكرًا يا محمد. شوية بشوية، هتبقى جبل!", ar: "شكرًا يا محمد. قليلًا فقليلًا ستصير تلًّا!", en: "Thank you, Mohamed. Little by little, you're becoming a hill!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [adat, syarak, peribahasa, rumah gadang, mamak, kemenakan, suku, merantau, datuk, pusaka, kaum, penghulu]
review:
  status: draft
  verified: false
  notes: |
    The datuk is an unnamed role-play figure. Spot-check: "Adat basandi syarak, syarak
    basandi Kitabullah" wording (Minang form); matrilineal inheritance of harta pusaka;
    mamak's role; Jam Gadang. Egyptian proverb is «اربط الحمار مطرح ما يقولك صاحبه».
