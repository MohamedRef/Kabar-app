schema: kabar.radio/v1
id: radio.bipa5.u03
language: id
level: bipa5
unit: bipa5.u03
title:
  target: Hidup di dalam aplikasi
  ar_eg: عايشين جوه الأبلكيشن
  ar: حياتنا داخل التطبيقات
  en: Living inside an app
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Samarinda dan ponsel
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Samarinda, di tepi Sungai Mahakam! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من ساماريندا، على شط نهر ماهاكام! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من ساماريندا على ضفة نهر ماهاكام! هذا كبار راديو. أنا تيارا.", en: "Good morning from Samarinda, on the Mahakam River! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Pagi ini saya pesan ojek, bayar kopi, dan beli sepatu, semuanya lewat ponsel.", ar_eg: "أنا رضا. الصبح ده طلبت موتوسيكل، ودفعت القهوة، واشتريت جزمة، كله من الموبايل.", ar: "أنا رضا. هذا الصباح طلبت دراجة أجرة ودفعت ثمن القهوة واشتريت حذاءً، كل ذلك عبر الهاتف.", en: "I'm Reza. This morning I ordered a motorbike taxi, paid for coffee and bought shoes, all on my phone."}
      - {speaker: Kak Tiara, text: "Itulah ekonomi digital. Di Indonesia, banyak hal dilakukan lewat aplikasi.", ar_eg: "هو ده الاقتصاد الرقمي. في إندونيسيا، حاجات كتير بتتعمل بالأبلكيشنز.", ar: "هذا هو الاقتصاد الرقمي؛ ففي إندونيسيا تُنجز أمور كثيرة عبر التطبيقات.", en: "That's the digital economy. In Indonesia, lots of things are done through apps."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar nominalisasi: mengubah kata kerja menjadi kata benda untuk tulisan resmi."
        ar_eg: "النهارده هنتعلم إزاي نحوّل الفعل لاسم (المصدر) عشان الكتابة الرسمية."
        ar: "اليوم نتعلم الاشتقاق الاسمي: تحويل الفعل إلى اسم للكتابة الرسمية."
        en: "Today we learn nominalisation: turning verbs into nouns for formal writing."
      - {speaker: Kak Tiara, text: "Mohamed, aplikasi apa yang paling sering kamu pakai?", ar_eg: "يا محمد، إيه الأبلكيشن اللي بتستعمله أكتر حاجة؟", ar: "يا محمد، ما التطبيق الذي تستخدمه أكثر من غيره؟", en: "Mohamed, which app do you use most often?"}
  - kind: dialogue
    title: Data dan privasi
    lines:
      - speaker: Kak Tiara
        text: "Kak Reza mau belanja daring. Tapi tunggu, aplikasi itu minta banyak izin."
        ar_eg: "رضا عايز يشتري أونلاين. بس استنى، الأبلكيشن ده بيطلب صلاحيات كتير."
        ar: "يريد رضا التسوق عبر الإنترنت، لكن انتظر، التطبيق يطلب أذونات كثيرة."
        en: "Reza wants to shop online. But wait, that app asks for lots of permissions."
        note:
          ar_eg: "اسمع الأفعال وبعدين الأسماء اللي اتعملت منها: membeli ← pembelian."
          ar: "استمع إلى الأفعال ثم إلى الأسماء المشتقة منها: membeli ← pembelian."
          en: "Listen for the verbs, then the nouns made from them: membeli → pembelian."
      - {speaker: Kak Reza, text: "Aplikasi belanja ini mau membaca kontak saya. Untuk apa, ya?", ar_eg: "أبلكيشن الشرا ده عايز يقرا الكونتاكتس بتوعي. ليه يعني؟", ar: "تطبيق التسوق هذا يريد قراءة جهات اتصالي. لماذا يا ترى؟", en: "This shopping app wants to read my contacts. What for?"}
      - {speaker: Kak Tiara, text: "Itu pertanyaan bagus. Perlindungan data pribadi itu penting.", ar_eg: "سؤال حلو. حماية البيانات الشخصية حاجة مهمة.", ar: "سؤال وجيه. حماية البيانات الشخصية أمر مهم.", en: "Good question. Protecting personal data is important."}
      - {speaker: Kak Reza, text: "Saya baca: Penggunaan data hanya untuk pengiriman barang. Hmm, tapi kontak?", ar_eg: "بقرا: «استخدام البيانات للتوصيل بس». همم، بس الكونتاكتس؟", ar: "أقرأ: «استخدام البيانات لتوصيل الطلبات فقط». لكن جهات الاتصال؟", en: "I'm reading: Data use is only for delivery. Hmm, but contacts?"}
      - {speaker: Kak Tiara, text: "Tolak saja izin itu. Pembelian tetap bisa, kok.", ar_eg: "ارفض الصلاحية دي وخلاص. الشرا هيشتغل عادي.", ar: "ارفض هذا الإذن ببساطة؛ ستتم عملية الشراء على أي حال.", en: "Just refuse that permission. The purchase still works."}
      - {speaker: Kak Reza, text: "Oke, sudah. Pembayaran pakai dompet digital. Pengirimannya besok.", ar_eg: "تمام، خلصت. الدفع بالمحفظة الإلكترونية. والتوصيل بكرة.", ar: "حسنًا، تم. الدفع بالمحفظة الرقمية، والتوصيل غدًا.", en: "OK, done. Payment by e-wallet. Delivery is tomorrow."}
      - {speaker: Kak Tiara, text: "Sekarang soal kecerdasan buatan. Apakah mesin akan menggantikan penerjemah?", ar_eg: "دلوقتي موضوع الذكاء الاصطناعي. هل الماكينة هتاخد مكان المترجم؟", ar: "والآن عن الذكاء الاصطناعي: هل ستحل الآلة محل المترجم؟", en: "Now, artificial intelligence. Will machines replace translators?"}
      - {speaker: Kak Reza, text: "Menurut saya, mesin membantu, tetapi pemahaman budaya tetap tugas manusia.", ar_eg: "في رأيي، الماكينة بتساعد، بس فهم الثقافة يفضل شغل الإنسان.", ar: "في رأيي، تساعد الآلة، لكن فهم الثقافة يبقى مهمة الإنسان.", en: "In my view, machines help, but understanding culture is still a human job."}
      - {speaker: Kak Tiara, text: "Dalam bahasa resmi: Pemanfaatan kecerdasan buatan memerlukan pengawasan manusia.", ar_eg: "بالرسمي: «الاستفادة من الذكاء الاصطناعي محتاجة إشراف بشري».", ar: "بالأسلوب الرسمي: «يتطلب توظيف الذكاء الاصطناعي إشرافًا بشريًا».", en: "In formal language: The use of artificial intelligence requires human oversight."}
      - {speaker: Kak Reza, text: "Wah, kalimatnya penuh kata benda. Itu gaya artikel dan laporan.", ar_eg: "واو، الجملة مليانة أسماء. ده أسلوب المقالات والتقارير.", ar: "الجملة مليئة بالأسماء! هذا أسلوب المقالات والتقارير.", en: "Wow, that sentence is full of nouns. That's the style of articles and reports."}
  - kind: word_spotlight
    title: Pe-an dan ke-an
    lines:
      - speaker: Kak Tiara
        text: "Membeli menjadi pembelian. Mengirim menjadi pengiriman. Membayar menjadi pembayaran."
        ar_eg: "membeli (يشتري) بتبقى pembelian (الشرا). mengirim بتبقى pengiriman. membayar بتبقى pembayaran."
        ar: "membeli (يشتري) تصير pembelian (الشراء)، وmengirim تصير pengiriman، وmembayar تصير pembayaran."
        en: "Membeli becomes pembelian. Mengirim becomes pengiriman. Membayar becomes pembayaran."
        note:
          ar_eg: "زي المصدر في العربي: اشترى ← شراء، أرسل ← إرسال."
          ar: "كالمصدر في العربية: اشترى ← شراء، أرسل ← إرسال."
          en: "Like the Arabic masdar: اشترى → شراء, أرسل → إرسال."
      - {speaker: Kak Reza, text: "Memakai menjadi pemakaian. Menggunakan menjadi penggunaan. Melindungi menjadi perlindungan.", ar_eg: "memakai ← pemakaian، menggunakan ← penggunaan، melindungi ← perlindungan (حماية).", ar: "memakai ← pemakaian، menggunakan ← penggunaan، melindungi ← perlindungan (حماية).", en: "Memakai → pemakaian. Menggunakan → penggunaan. Melindungi → perlindungan."}
      - {speaker: Kak Tiara, text: "Ke-an juga membuat kata benda: mudah menjadi kemudahan, aman menjadi keamanan.", ar_eg: "ke-an كمان بتعمل أسماء: mudah (سهل) ← kemudahan (سهولة)، aman ← keamanan (أمان).", ar: "وke-an تصوغ أسماء أيضًا: mudah ← kemudahan (سهولة)، aman ← keamanan (أمن).", en: "Ke-an makes nouns too: mudah → kemudahan, aman → keamanan."}
      - {speaker: Kak Reza, text: "Ekonomi digital, dompet digital, belanja daring, privasi, izin akses.", ar_eg: "اقتصاد رقمي، محفظة إلكترونية، شرا أونلاين، خصوصية، صلاحية وصول.", ar: "اقتصاد رقمي، محفظة رقمية، تسوق إلكتروني، خصوصية، إذن وصول.", en: "Digital economy, e-wallet, online shopping, privacy, access permission."}
      - {speaker: Kak Tiara, text: "Daring artinya dalam jaringan, online. Luring artinya luar jaringan, offline.", ar_eg: "daring يعني «على الشبكة»: أونلاين. وluring يعني «بره الشبكة»: أوفلاين.", ar: "daring اختصار «داخل الشبكة» أي متصل، وluring «خارج الشبكة» أي غير متصل.", en: "Daring means 'in the network', online. Luring means 'outside the network', offline."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Perlindungan data pribadi itu penting."
        ar_eg: "حماية البيانات الشخصية مهمة."
        ar: "حماية البيانات الشخصية مهمة."
        en: "Protecting personal data is important."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Perlindungan data pribadi itu penting.", ar_eg: "حماية البيانات الشخصية مهمة.", ar: "حماية البيانات الشخصية مهمة.", en: "Protecting personal data is important."}
      - {speaker: Kak Tiara, text: "Pembayaran pakai dompet digital.", ar_eg: "الدفع بالمحفظة الإلكترونية.", ar: "الدفع بالمحفظة الرقمية.", en: "Payment by e-wallet."}
      - {speaker: Kak Reza, text: "Pembayaran pakai dompet digital.", ar_eg: "الدفع بالمحفظة الإلكترونية.", ar: "الدفع بالمحفظة الرقمية.", en: "Payment by e-wallet."}
      - {speaker: Kak Tiara, text: "Penggunaan data hanya untuk pengiriman.", ar_eg: "استخدام البيانات للتوصيل بس.", ar: "استخدام البيانات للتوصيل فقط.", en: "Data use is only for delivery."}
      - {speaker: Kak Reza, text: "Penggunaan data hanya untuk pengiriman.", ar_eg: "استخدام البيانات للتوصيل بس.", ar: "استخدام البيانات للتوصيل فقط.", en: "Data use is only for delivery."}
      - {speaker: Kak Tiara, text: "Mesin membantu, tetapi manusia tetap penting.", ar_eg: "الماكينة بتساعد، بس الإنسان يفضل مهم.", ar: "الآلة تساعد، لكن الإنسان يبقى مهمًا.", en: "Machines help, but humans still matter."}
      - {speaker: Kak Reza, text: "Mesin membantu, tetapi manusia tetap penting.", ar_eg: "الماكينة بتساعد، بس الإنسان يفضل مهم.", ar: "الآلة تساعد، لكن الإنسان يبقى مهمًا.", en: "Machines help, but humans still matter."}
  - kind: outro
    title: Tantangan nominalisasi
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ubah kalimat ini menjadi gaya resmi: Orang membeli banyak barang lewat aplikasi."
        ar_eg: "يا محمد، حوّل الجملة دي لأسلوب رسمي: الناس بتشتري حاجات كتير من الأبلكيشنز."
        ar: "يا محمد، حوّل هذه الجملة إلى أسلوب رسمي: يشتري الناس أشياء كثيرة عبر التطبيقات."
        en: "Mohamed, make this sentence formal: People buy lots of things through apps."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Jawabannya: Pembelian barang melalui aplikasi semakin meningkat.", ar_eg: "الإجابة: «شرا الحاجات عن طريق الأبلكيشنز بيزيد».", ar: "الإجابة: «يتزايد شراء السلع عبر التطبيقات».", en: "Answer: The purchase of goods through apps keeps rising."}
      - {speaker: Kak Tiara, text: "Besok, baca satu artikel teknologi dan tulis ringkasannya dalam tiga kalimat.", ar_eg: "بكرة، اقرا مقالة عن التكنولوجيا واكتب ملخصها في تلات جمل.", ar: "غدًا، اقرأ مقالة تقنية ولخّصها في ثلاث جمل.", en: "Tomorrow, read one tech article and summarise it in three sentences."}
      - {speaker: Kak Reza, text: "Terima kasih atas pendengarannya, eh, perhatiannya, Mohamed!", ar_eg: "شكرًا على حسن… استماعك يا محمد!", ar: "شكرًا على حسن إصغائك يا محمد!", en: "Thanks for your listening, er, your attention, Mohamed!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [aplikasi, dompet digital, penggunaan, kecerdasan buatan, kemudahan, keamanan, menggantikan]
review:
  status: draft
  verified: false
  notes: |
    Samarinda is on the Mahakam River. No market-size claims made. Reza's joke
    "pendengarannya" (hearing) self-corrected to "perhatiannya" is intentional.
