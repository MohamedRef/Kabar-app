schema: kabar.radio/v1
id: radio.bipa7.u05
language: id
level: bipa7
unit: bipa7.u05
title:
  target: Mesir dan Indonesia, sahabat lama
  ar_eg: مصر وإندونيسيا، صحاب من زمان
  ar: مصر وإندونيسيا، صداقة قديمة
  en: Egypt and Indonesia, old friends
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Di Wayag
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Wayag, Raja Ampat! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من واياج، راجا أمبات! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من واياغ، راجا أمبات! هذا كبار راديو. أنا تيارا.", en: "Good morning from Wayag, Raja Ampat! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Pulau-pulau ini sudah ada jutaan tahun. Hari ini kita bicara tentang sejarah manusia yang lebih pendek, tapi penting.", ar_eg: "أنا رضا. الجزر دي موجودة من ملايين السنين. النهارده هنتكلم عن تاريخ بشري أقصر، بس مهم.", ar: "أنا رضا. هذه الجزر قائمة منذ ملايين السنين، واليوم نتحدث عن تاريخ بشري أقصر لكنه مهم.", en: "I'm Reza. These islands have been here for millions of years. Today we talk about a shorter, but important, human history."}
      - {speaker: Kak Tiara, text: "Ada episode spesial untuk Mohamed: hubungan Mesir dan Indonesia.", ar_eg: "فيه حلقة مخصوص لمحمد: العلاقة بين مصر وإندونيسيا.", ar: "حلقة خاصة لمحمد: العلاقات بين مصر وإندونيسيا.", en: "A special episode for Mohamed: Egypt and Indonesia's relationship."}
      - speaker: Kak Reza
        text: "Kita belajar menceritakan sejarah dengan kohesi: kata seperti kemudian, setelah itu, hal ini, dan peristiwa tersebut."
        ar_eg: "هنتعلم نحكي التاريخ بترابط: كلمات زي بعدين، بعد كده، الأمر ده، والحدث المذكور."
        ar: "نتعلم سرد التاريخ بترابط: كلمات مثل ثم، بعد ذلك، هذا الأمر، والحدث المذكور."
        en: "We learn to tell history cohesively: words like kemudian, setelah itu, hal ini, and peristiwa tersebut."
      - {speaker: Kak Tiara, text: "Mohamed, apakah kamu tahu cerita ini?", ar_eg: "يا محمد، إنت عارف الحكاية دي؟", ar: "يا محمد، هل تعرف هذه الحكاية؟", en: "Mohamed, do you know this story?"}
  - kind: dialogue
    title: Linimasa
    lines:
      - speaker: Kak Tiara
        text: "Kami membuat linimasa bersama. Dengar bagaimana kalimat-kalimat saling terhubung."
        ar_eg: "هنعمل خط زمني مع بعض. اسمع الجمل بتتربط ببعض إزاي."
        ar: "نبني خطًا زمنيًا معًا. استمع إلى كيفية ترابط الجمل."
        en: "We build a timeline together. Listen to how the sentences link up."
        note:
          ar_eg: "خلي بالك من tersebut وhal ini: بيرجعوا لحاجة اتقالت قبل كده."
          ar: "انتبه إلى tersebut وhal ini: تحيلان إلى ما سبق ذكره."
          en: "Notice tersebut and hal ini: they point back to something already said."
      - {speaker: Kak Reza, text: "Selama lebih dari tiga abad, kepulauan ini dikuasai oleh kekuatan kolonial, dimulai dengan VOC dari Belanda.", ar_eg: "لأكتر من تلات قرون، الجزر دي كانت تحت سيطرة الاستعمار، وبدأت بشركة الهند الشرقية الهولندية.", ar: "على مدى أكثر من ثلاثة قرون خضع هذا الأرخبيل لقوى استعمارية، بدءًا بشركة الهند الشرقية الهولندية.", en: "For more than three centuries, these islands were under colonial powers, beginning with the Dutch VOC."}
      - {speaker: Kak Tiara, text: "Kemudian, pada tanggal 17 Agustus 1945, Soekarno dan Hatta membacakan Proklamasi Kemerdekaan.", ar_eg: "وبعدين، يوم 17 أغسطس 1945، سوكارنو وحتّا قروا إعلان الاستقلال.", ar: "ثم في 17 أغسطس 1945 تلا سوكارنو وحتا إعلان الاستقلال.", en: "Then, on 17 August 1945, Soekarno and Hatta read the Proclamation of Independence."}
      - {speaker: Kak Reza, text: "Namun, kemerdekaan tersebut belum diakui oleh banyak negara. Hal ini membuat perjuangan diplomasi sangat penting.", ar_eg: "بس الاستقلال ده لسه ما كانش معترف بيه من دول كتير. والأمر ده خلّى النضال الدبلوماسي مهم جدًا.", ar: "غير أن ذلك الاستقلال لم تعترف به دول كثيرة بعد، وهذا ما جعل النضال الدبلوماسي بالغ الأهمية.", en: "However, that independence was not yet recognised by many countries. This made the diplomatic struggle vital."}
      - {speaker: Kak Tiara, text: "Pada tahun 1946, Mesir menjadi salah satu negara pertama yang mengakui Indonesia. Banyak sumber menyebut Mesir yang pertama.", ar_eg: "سنة 1946، مصر كانت من أول الدول اللي اعترفت بإندونيسيا. ومصادر كتير بتقول إن مصر هي الأولى.", ar: "عام 1946 كانت مصر من أوائل الدول التي اعترفت بإندونيسيا، وتذكر مصادر كثيرة أنها الأولى.", en: "In 1946, Egypt became one of the first countries to recognise Indonesia. Many sources say Egypt was the first."}
      - {speaker: Kak Reza, text: "Setelah itu, Haji Agus Salim memimpin delegasi ke Kairo dan perjanjian persahabatan ditandatangani pada tahun 1947.", ar_eg: "بعد كده، الحاج أغوس سالم قاد وفد للقاهرة، واتمضت معاهدة صداقة سنة 1947.", ar: "بعد ذلك قاد الحاج أغوس سالم وفدًا إلى القاهرة، ووُقّعت معاهدة صداقة عام 1947.", en: "After that, Haji Agus Salim led a delegation to Cairo, and a friendship treaty was signed in 1947."}
      - {speaker: Kak Tiara, text: "Peristiwa tersebut menjadi awal persahabatan panjang.", ar_eg: "الحدث ده كان بداية صداقة طويلة.", ar: "وكان ذلك الحدث بداية صداقة طويلة.", en: "That event was the start of a long friendship."}
      - {speaker: Kak Reza, text: "Pada tahun 1955, Konferensi Asia-Afrika diadakan di Bandung. Gamal Abdel Nasser hadir di sana.", ar_eg: "سنة 1955، مؤتمر آسيا وأفريقيا اتعمل في باندونج. وجمال عبد الناصر حضر هناك.", ar: "عام 1955 عُقد مؤتمر آسيا وأفريقيا في باندونغ، وحضره جمال عبد الناصر.", en: "In 1955, the Asian-African Conference was held in Bandung. Gamal Abdel Nasser attended."}
      - {speaker: Kak Tiara, text: "Lalu, pada tahun 1998, Indonesia memasuki masa Reformasi dan menjadi lebih demokratis.", ar_eg: "وبعدين، سنة 1998، إندونيسيا دخلت عصر الإصلاح وبقت ديمقراطية أكتر.", ar: "ثم في عام 1998 دخلت إندونيسيا عهد الإصلاح وصارت أكثر ديمقراطية.", en: "Then, in 1998, Indonesia entered the Reformasi era and became more democratic."}
      - {speaker: Kak Reza, text: "Linimasa yang rapi! Setiap kalimat terhubung dengan kalimat sebelumnya.", ar_eg: "خط زمني مترتب! كل جملة مربوطة باللي قبلها.", ar: "خط زمني منظّم! كل جملة موصولة بما قبلها.", en: "A neat timeline! Each sentence links to the one before."}
  - kind: word_spotlight
    title: Kohesi gramatikal
    lines:
      - speaker: Kak Tiara
        text: "Rujukan: tersebut, hal ini, peristiwa itu, beliau. Kata-kata ini menunjuk kembali."
        ar_eg: "الإحالة: المذكور، الأمر ده، الحدث ده، هو (للتعظيم). الكلمات دي بترجع لورا."
        ar: "الإحالة: المذكور، هذا الأمر، ذلك الحدث، هو (للتوقير). كلمات تحيل إلى ما سبق."
        en: "Reference: tersebut, hal ini, peristiwa itu, beliau. These words point back."
        note:
          ar_eg: "beliau بدل dia للناس الكبار والمحترمين."
          ar: "beliau بدل dia للشخصيات الموقّرة."
          en: "Beliau replaces dia for respected people."
      - {speaker: Kak Reza, text: "Urutan waktu: mula-mula, kemudian, setelah itu, akhirnya, sejak saat itu.", ar_eg: "ترتيب الوقت: في الأول، بعدين، بعد كده، وفي الآخر، ومن ساعتها.", ar: "التسلسل الزمني: في البداية، ثم، بعد ذلك، وأخيرًا، ومنذ ذلك الحين.", en: "Time order: at first, then, after that, finally, since then."}
      - {speaker: Kak Tiara, text: "Penjajahan, kemerdekaan, proklamasi, pengakuan, diplomasi, delegasi.", ar_eg: "استعمار، استقلال، إعلان، اعتراف، دبلوماسية، وفد.", ar: "استعمار، استقلال، إعلان، اعتراف، دبلوماسية، وفد.", en: "Colonisation, independence, proclamation, recognition, diplomacy, delegation."}
      - {speaker: Kak Reza, text: "Pahlawan, perjuangan, Reformasi, Konferensi Asia-Afrika.", ar_eg: "بطل قومي، نضال، الإصلاح، مؤتمر آسيا وأفريقيا.", ar: "بطل، نضال، الإصلاح، مؤتمر آسيا وأفريقيا.", en: "Hero, struggle, Reformasi, Asian-African Conference."}
      - {speaker: Kak Tiara, text: "Pahlawan perempuan juga banyak: Kartini, Cut Nyak Dhien, dan Martha Christina Tiahahu.", ar_eg: "وفيه بطلات ستات كتير: كارتيني، وتشوت نياك ضين، ومارتا كريستينا تياهاهو.", ar: "والبطلات كثيرات: كارتيني، وتشوت نياك ضين، ومارثا كريستينا تياهاهو.", en: "There are many women heroes too: Kartini, Cut Nyak Dhien, and Martha Christina Tiahahu."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Kemerdekaan tersebut belum diakui oleh banyak negara."
        ar_eg: "الاستقلال ده لسه ما كانش معترف بيه من دول كتير."
        ar: "لم تعترف دول كثيرة بذلك الاستقلال بعد."
        en: "That independence was not yet recognised by many countries."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Kemerdekaan tersebut belum diakui oleh banyak negara.", ar_eg: "الاستقلال ده لسه ما كانش معترف بيه من دول كتير.", ar: "لم تعترف دول كثيرة بذلك الاستقلال بعد.", en: "That independence was not yet recognised by many countries."}
      - {speaker: Kak Tiara, text: "Hal ini membuat diplomasi sangat penting.", ar_eg: "الأمر ده خلّى الدبلوماسية مهمة جدًا.", ar: "وهذا ما جعل الدبلوماسية بالغة الأهمية.", en: "This made diplomacy vital."}
      - {speaker: Kak Reza, text: "Hal ini membuat diplomasi sangat penting.", ar_eg: "الأمر ده خلّى الدبلوماسية مهمة جدًا.", ar: "وهذا ما جعل الدبلوماسية بالغة الأهمية.", en: "This made diplomacy vital."}
      - {speaker: Kak Tiara, text: "Mesir termasuk negara pertama yang mengakui Indonesia.", ar_eg: "مصر من أول الدول اللي اعترفت بإندونيسيا.", ar: "مصر من أوائل الدول التي اعترفت بإندونيسيا.", en: "Egypt was among the first countries to recognise Indonesia."}
      - {speaker: Kak Reza, text: "Mesir termasuk negara pertama yang mengakui Indonesia.", ar_eg: "مصر من أول الدول اللي اعترفت بإندونيسيا.", ar: "مصر من أوائل الدول التي اعترفت بإندونيسيا.", en: "Egypt was among the first countries to recognise Indonesia."}
      - {speaker: Kak Tiara, text: "Sejak saat itu, kedua negara bersahabat.", ar_eg: "ومن ساعتها، البلدين صحاب.", ar: "ومنذ ذلك الحين والبلدان صديقان.", en: "Since then, the two countries have been friends."}
      - {speaker: Kak Reza, text: "Sejak saat itu, kedua negara bersahabat.", ar_eg: "ومن ساعتها، البلدين صحاب.", ar: "ومنذ ذلك الحين والبلدان صديقان.", en: "Since then, the two countries have been friends."}
  - kind: outro
    title: Sejarah Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan satu peristiwa sejarah Mesir dalam empat kalimat yang saling terhubung."
        ar_eg: "يا محمد، احكي حدث من تاريخ مصر في أربع جمل مربوطة ببعض."
        ar: "يا محمد، احكِ حدثًا من تاريخ مصر في أربع جمل مترابطة."
        en: "Mohamed, tell one event from Egyptian history in four linked sentences."
        note:
          ar_eg: "دورك! استعمل kemudian وhal ini وtersebut."
          ar: "دورك! استخدم kemudian وhal ini وtersebut."
          en: "Your turn! Use kemudian, hal ini and tersebut."
      - {speaker: Kak Reza, text: "Contohnya: Pada tahun 1956, Mesir menasionalisasi Terusan Suez. Keputusan tersebut memicu krisis. Kemudian…", ar_eg: "مثلًا: «سنة 1956، مصر أممت قناة السويس. والقرار ده عمل أزمة. وبعدين…»", ar: "مثلًا: «عام 1956 أممت مصر قناة السويس، فأشعل ذلك القرار أزمة. ثم…»", en: "For example: In 1956, Egypt nationalised the Suez Canal. That decision sparked a crisis. Then…"}
      - {speaker: Kak Tiara, text: "Besok, buat linimasa lima peristiwa dalam hidupmu.", ar_eg: "بكرة، اعمل خط زمني لخمس أحداث في حياتك.", ar: "غدًا، اصنع خطًا زمنيًا لخمسة أحداث من حياتك.", en: "Tomorrow, make a timeline of five events in your life."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Salam persahabatan untuk Mesir!", ar_eg: "شكرًا يا محمد. سلام وصداقة لمصر!", ar: "شكرًا يا محمد. تحية صداقة إلى مصر!", en: "Thank you, Mohamed. Friendly greetings to Egypt!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [sejarah, linimasa, kemerdekaan, proklamasi, pengakuan, delegasi, tersebut, kemudian, Reformasi, pahlawan, beliau, kohesi]
review:
  status: draft
  verified: false
  notes: |
    Spot-check before approval: Egypt's 1946 recognition (often dated 22 March 1946;
    phrased as "among the first / many sources say the first"); Agus Salim mission and
    the 1947 Egypt–Indonesia friendship treaty (10 June 1947); Nasser at Bandung 1955;
    Martha Christina Tiahahu (Maluku). Unit culture note says "first" outright.
