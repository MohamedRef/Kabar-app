schema: kabar.radio/v1
id: radio.bipa1.u09
language: id
level: bipa1
unit: bipa1.u09
title:
  target: Lurus, lalu belok kiri
  ar_eg: على طول، وبعدين حوّد شمال
  ar: إلى الأمام، ثم انعطف يسارًا
  en: Straight on, then turn left
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Monas
    lines:
      - speaker: Kak Tiara
        text: Halo, selamat pagi! Selamat datang di Kabar Radio! Aku Tiara.
        ar_eg: أهلًا، صباح الخير! أهلًا بيك في كبار راديو! أنا تيارا.
        ar: مرحبًا، صباح الخير! أهلًا بك في كبار راديو! أنا تيارا.
        en: Hello, good morning! Welcome to Kabar Radio! I'm Tiara.
      - speaker: Kak Reza
        text: Aku Reza. Pagi, Tiara! Kamu di mana sekarang?
        ar_eg: وأنا رضا. صباح الخير يا تيارا! إنتي فين دلوقتي؟
        ar: وأنا رضا. صباح الخير يا تيارا! أين أنتِ الآن؟
        en: And I'm Reza. Morning, Tiara! Where are you now?
      - speaker: Kak Tiara
        text: Aku di Monas, di depan pintu masuk. Kamu di mana?
        ar_eg: أنا في موناس، قدام البوابة. وإنت فين يا رضا؟
        ar: أنا في موناس، أمام المدخل. وأين أنت يا رضا؟
        en: I'm at Monas, in front of the entrance. Where are you, Reza?
        note:
          ar_eg: موناس هو النصب التذكاري الوطني في قلب جاكرتا، وجنبه جامع الاستقلال.
          ar: موناس هو النصب الوطني في قلب جاكرتا، وبجواره مسجد الاستقلال.
          en: Monas is the National Monument in the heart of Jakarta, next to Istiqlal Mosque.
      - speaker: Kak Reza
        text: Aku masih di halte, deket stasiun. Ke sana jauh nggak?
        ar_eg: أنا لسه في محطة الأتوبيس، جنب محطة القطر. المشوار لعندك بعيد ولا قريب؟
        ar: ما زلت في موقف الحافلات قرب المحطة. هل الطريق إليكِ بعيد أم قريب؟
        en: I'm still at the bus stop, near the station. Is it far?
        note:
          ar_eg: deket = dekat. «jauh nggak?» = «بعيد ولا لأ؟».
          ar: deket = dekat. «jauh nggak?» = «بعيد أم لا؟».
          en: deket = dekat. 'jauh nggak?' = 'far or not?'.
      - speaker: Kak Tiara
        text: Deket, kok. Lurus aja, terus belok kiri di lampu merah.
        ar_eg: قريب. امشي على طول، وبعدين حوّد شمال عند الإشارة.
        ar: قريب. امشِ إلى الأمام، ثم انعطف يسارًا عند الإشارة.
        en: It's close. Just go straight, then turn left at the traffic light.
      - speaker: Kak Reza
        text: Oke. Tapi panas banget, jadi aku beli air dulu, ya.
        ar_eg: تمام. بس الجو حر أوي، فهشتري مية الأول.
        ar: حسنًا. لكن الجو حار جدًا، لذلك سأشتري ماءً أولًا.
        en: OK. But it's so hot, so I'll grab some water first.
        note:
          ar_eg: الناس في جاكرتا بيوصفوا الطريق بالعلامات - «بعد الجامع حوّد شمال» - وغالبًا هيمشوا معاك نص السكة.
          ar: يصف أهل جاكرتا الطريق بالمعالم - «بعد المسجد انعطف يسارًا» - وكثيرًا ما يرافقونك نصف الطريق.
          en: Jakartans give directions by landmarks - "after the mosque, turn left" - and will often walk you halfway.
      - speaker: Kak Tiara
        text: Di, ke, dari. Di atas, di bawah, di depan, di belakang. Lurus, belok kanan, belok kiri.
        ar_eg: في، لـ، من. فوق، تحت، قدام، ورا. على طول، حوّد يمين، حوّد شمال.
        ar: في، إلى، من. فوق، تحت، أمام، خلف. إلى الأمام، انعطف يمينًا، انعطف يسارًا.
        en: At, to, from. On, under, in front of, behind. Straight, turn right, turn left.
        note:
          ar_eg: موضوع النهارده - di وke وdari، ومكان الحاجة فين، ووصف الطريق بـ lalu وtapi وjadi.
          ar: موضوع اليوم - di وke وdari، وأماكن الأشياء، ووصف الطريق بـ lalu وtapi وjadi.
          en: Today's topic - di, ke and dari, where things are, and giving directions with lalu, tapi and jadi.
      - speaker: Kak Reza
        text: Halo, Mohamed! Selamat datang di Monas! Kamu di mana sekarang?
        ar_eg: أهلًا يا محمد! أهلًا بيك في موناس! إنت فين دلوقتي؟
        ar: مرحبًا يا محمد! أهلًا بك في موناس! أين أنت الآن؟
        en: Hello, Mohamed! Welcome to Monas! Where are you now?
  - kind: dialogue
    title: Tiketnya di mana?
    lines:
      - speaker: Kak Reza
        text: Tiara! Halo! Aku udah sampai di Monas.
        ar_eg: تيارا! أهلًا! أنا وصلت موناس.
        ar: تيارا! مرحبًا! لقد وصلتُ إلى موناس.
        en: Tiara! Hi! I'm at Monas now.
      - speaker: Kak Tiara
        text: Sip! Tadi dari mana?
        ar_eg: حلو! كنت جاي منين؟
        ar: جيد! من أين جئت قبل قليل؟
        en: Great! Where were you coming from?
        note:
          ar_eg: sip = «تمام!».
          ar: sip = «ممتاز!».
          en: sip = 'great, sorted!'.
      - speaker: Kak Reza
        text: Dari Stasiun Gambir. Aku naik kereta dari Bandung.
        ar_eg: أنا جاي من محطة جامبير. ركبت القطر من باندونج.
        ar: جئتُ من محطة غامبير. ركبتُ القطار من باندونغ.
        en: From Gambir Station. I took the train from Bandung.
      - speaker: Kak Tiara
        text: Oke. Eh, tiket Monas mana? Aku nggak punya tiket.
        ar_eg: تمام. التذاكر بتاعة موناس فين؟ أنا معنديش تذكرة.
        ar: حسنًا. أين تذاكر موناس؟ ليس معي تذكرة.
        en: OK. Hey, where are the Monas tickets? I don't have one.
      - speaker: Kak Reza
        text: Tiketnya di tasku.
        ar_eg: التذاكر جوه شنطتي.
        ar: التذاكر داخل حقيبتي.
        en: The tickets are in my bag.
      - speaker: Kak Tiara
        text: Ada, nggak?
        ar_eg: لقيتها؟
        ar: هل وجدتها؟
        en: Are they there?
      - speaker: Kak Reza
        text: Nggak ada! Di tas nggak ada. Di bawah kursi juga nggak ada.
        ar_eg: مفيش! جوه الشنطة مفيش. وتحت الكرسي كمان مفيش.
        ar: لا توجد! ليست داخل الحقيبة. وليست تحت الكرسي أيضًا.
        en: They're not there! Not in the bag. Not under the chair either.
      - speaker: Kak Tiara
        text: Waduh! Coba lihat di dalam buku.
        ar_eg: يا نهار! بص جوه الكتاب كده.
        ar: يا إلهي! انظر داخل الكتاب.
        en: Oh no! Try looking inside the book.
        note:
          ar_eg: waduh = «يا خبر!».
          ar: waduh = «يا للمصيبة!».
          en: waduh = 'oh no!'.
      - speaker: Kak Reza
        text: Nah, ini dia tiketnya! Di buku bahasa Arabku.
        ar_eg: آه، أهي التذاكر! جوه كتاب العربي بتاعي.
        ar: آه، ها هي التذاكر! داخل كتاب العربية خاصتي.
        en: Ah, here they are! In my Arabic book.
      - speaker: Kak Tiara
        text: Sip! Sekarang ke loket. Loketnya di samping pintu masuk.
        ar_eg: الحمد لله، حلو! يلا نروح الشباك. الشباك جنب البوابة.
        ar: جيد! الآن لنذهب إلى الشبّاك. الشبّاك بجانب المدخل.
        en: Great! Now let's go to the counter. The counter is next to the entrance.
      - speaker: Kak Reza
        text: Habis Monas, aku mau ke Masjid Istiqlal. Jauh nggak?
        ar_eg: بعد موناس، عايز أروح جامع الاستقلال. بعيد ولا قريب؟
        ar: بعد موناس أريد أن أذهب إلى مسجد الاستقلال. أهو بعيد أم قريب؟
        en: After Monas, I want to go to Istiqlal Mosque. Is it far?
      - speaker: Kak Tiara
        text: Deket banget. Istiqlal sebelahan sama Monas.
        ar_eg: قريب أوي. الاستقلال جنب موناس على طول.
        ar: قريب جدًا. مسجد الاستقلال بجوار موناس مباشرة.
        en: Really close. Istiqlal is right next to Monas.
      - speaker: Kak Reza
        text: Naik bus atau jalan kaki?
        ar_eg: أركب أتوبيس ولا أمشي؟
        ar: أركب الحافلة أم أمشي؟
        en: By bus or on foot?
      - speaker: Kak Tiara
        text: Jalan kaki aja. Dari pintu masuk, lurus aja.
        ar_eg: امشي أحسن. من البوابة امشي على طول لقدام.
        ar: سيرًا على الأقدام. من المدخل امشِ إلى الأمام مباشرة.
        en: Just walk. From the entrance, go straight.
      - speaker: Kak Reza
        text: Jalan lurus, lalu?
        ar_eg: على طول، وبعدين؟
        ar: إلى الأمام، ثم؟
        en: Straight on, then?
      - speaker: Kak Tiara
        text: Terus belok kanan di perempatan. Lurus lagi. Masjidnya di sebelah kiri.
        ar_eg: وبعدين حوّد يمين عند التقاطع. وبعد كده امشي على طول تاني. الجامع على الشمال.
        ar: ثم انعطف يمينًا عند التقاطع. بعدها امشِ إلى الأمام مرة أخرى. المسجد على اليسار.
        en: Then turn right at the crossroads. Straight again. The mosque's on the left.
      - speaker: Kak Reza
        text: Belok kanan di perempatan, terus lurus. Masjidnya di kiri. Bener?
        ar_eg: أحوّد يمين عند التقاطع، وبعدين على طول. الجامع على الشمال. صح؟
        ar: أنعطف يمينًا عند التقاطع، ثم إلى الأمام. المسجد على اليسار. صحيح؟
        en: Right at the crossroads, then straight. Mosque on the left. Right?
      - speaker: Kak Tiara
        text: Bener banget! Deket, tapi panas. Jadi bawa air, ya!
        ar_eg: صح جدًا! قريب، بس حر. فخد معاك مية!
        ar: صحيح تمامًا! قريب، لكنه حار. لذلك خذ معك ماءً!
        en: Exactly! It's close, but hot. So bring water!
      - speaker: Kak Reza
        text: Udah, dong. Airnya di tas, di samping buku. Makasih!
        ar_eg: خدت خلاص. المية في الشنطة، جنب الكتاب. شكرًا!
        ar: أخذتُه. الماء في الحقيبة بجانب الكتاب. شكرًا!
        en: Already got it. The water's in the bag, next to the book. Thanks!
      - speaker: Kak Tiara
        text: Sama-sama. Pelan-pelan aja, ya!
        ar_eg: العفو. على مهلك!
        ar: عفوًا. على مهلك!
        en: You're welcome. Take it easy!
  - kind: word_spotlight
    title: Di, ke, dari
    lines:
      - speaker: Kak Tiara
        text: Di. Anak-anak bermain di taman. Kak Reza di Monas.
        ar_eg: في. العيال بيلعبوا في الجنينة. رضا في موناس.
        ar: في. الأطفال يلعبون في الحديقة. رضا في موناس.
        en: At. The children play in the park. Reza is at Monas.
        note:
          ar_eg: di للمكان اللي إنت فيه، ke للمكان اللي رايحه، dari للمكان اللي جاي منه.
          ar: di لمكان الوجود، وke لمكان الوجهة، وdari لمكان المصدر.
          en: di is where you are, ke where you're going, dari where you're coming from.
      - speaker: Kak Reza
        text: Ke. Besok saya ke Bandung. Rina pulang ke rumah.
        ar_eg: لـ. بكرة رايح باندونج. رينا مروّحة البيت.
        ar: إلى. غدًا أذهب إلى باندونغ. رينا تعود إلى البيت.
        en: To. Tomorrow I'm going to Bandung. Rina goes home.
      - speaker: Kak Tiara
        text: Dari. Kereta dari Bogor sudah datang. Kamu dari mana?
        ar_eg: من. القطر اللي من بوجور وصل. إنت جاي منين؟
        ar: من. وصل القطار القادم من بوغور. من أين أتيت؟
        en: From. The train from Bogor has arrived. Where are you coming from?
      - speaker: Kak Reza
        text: Kamu mau ke mana? Ke masjid. Masjid, masjid. Masjid Istiqlal dekat Monas.
        ar_eg: رايح فين؟ الجامع. جامع، جامع. جامع الاستقلال جنب موناس.
        ar: إلى أين تذهب؟ إلى المسجد. مسجد، مسجد. مسجد الاستقلال قرب موناس.
        en: Where are you going? To the mosque. Mosque, mosque. Istiqlal Mosque is near Monas.
        note:
          ar_eg: الجسر العربي - masjid من «مسجد»، وkursi من «كرسي».
          ar: الجسر العربي - masjid من «مسجد»، وkursi من «كرسي».
          en: Arabic Bridge - masjid comes from «مسجد», and kursi from «كرسي».
      - speaker: Kak Tiara
        text: Kursi, kursi. Di atas, di bawah. Bukunya di atas meja. Kucingnya di bawah kursi.
        ar_eg: كرسي، كرسي. فوق، تحت. الكتاب على الترابيزة. القطة تحت الكرسي.
        ar: كرسي، كرسي. فوق، تحت. الكتاب على الطاولة. القطة تحت الكرسي.
        en: Chair, chair. On, under. The book is on the table. The cat is under the chair.
      - speaker: Kak Reza
        text: Di depan, di belakang, di samping. Tasnya di samping kursi.
        ar_eg: قدام، ورا، جنب. الشنطة جنب الكرسي.
        ar: أمام، خلف، بجانب. الحقيبة بجانب الكرسي.
        en: In front of, behind, next to. The bag is next to the chair.
      - speaker: Kak Tiara
        text: Di dalam, di luar, di antara. Kamar saya di antara dapur dan kamar mandi.
        ar_eg: جوه، بره، بين. أوضتي بين المطبخ والحمام.
        ar: داخل، خارج، بين. غرفتي بين المطبخ والحمام.
        en: Inside, outside, between. My room is between the kitchen and the bathroom.
      - speaker: Kak Reza
        text: Sebelah kanan, sebelah kiri. Kamar mandinya di sebelah kanan.
        ar_eg: على اليمين، على الشمال. الحمام على اليمين.
        ar: على اليمين، على اليسار. الحمام على اليمين.
        en: On the right, on the left. The bathroom is on the right.
      - speaker: Kak Tiara
        text: Jalan lurus. Belok kiri. Belok kanan. Lalu, kemudian.
        ar_eg: امشي على طول. حوّد شمال. حوّد يمين. وبعدين، وبعد كده.
        ar: امشِ إلى الأمام. انعطف يسارًا. انعطف يمينًا. ثم، بعد ذلك.
        en: Go straight. Turn left. Turn right. Then, afterwards.
      - speaker: Kak Reza
        text: Jalan lurus, lalu belok kiri di masjid. Belok kanan di perempatan, kemudian jalan lurus.
        ar_eg: امشي على طول، وبعدين حوّد شمال عند الجامع. حوّد يمين عند التقاطع، وبعد كده على طول.
        ar: امشِ إلى الأمام، ثم انعطف يسارًا عند المسجد. انعطف يمينًا عند التقاطع، ثم إلى الأمام.
        en: Go straight, then turn left at the mosque. Turn right at the crossroads, then go straight.
      - speaker: Kak Tiara
        text: 'Di jalan orang bilang: Lurus aja, terus belok kiri. Deket, kok!'
        ar_eg: 'في الشارع الناس بتقول: على طول، وبعدين شمال. قريب أهو!'
        ar: 'في الشارع يقول الناس: إلى الأمام مباشرة، ثم يسارًا. إنه قريب!'
        en: "On the street people say: Just go straight, then left. It's close!"
        note:
          ar_eg: terus = lalu، aja = saja، deket = dekat. لما تسأل حد في الشارع، هتسمع الكلام ده.
          ar: terus = lalu، aja = saja، deket = dekat. هذا ما ستسمعه حين تسأل أحدًا في الشارع.
          en: terus = lalu, aja = saja, deket = dekat. That's what you'll hear when you ask the way.
      - speaker: Kak Tiara
        text: Dan, atau, tapi, jadi. Mau kopi atau teh? Saya lapar, jadi saya makan dulu.
        ar_eg: و، ولا، بس، فـ. تشرب قهوة ولا شاي؟ أنا جعانة، فهاكل الأول.
        ar: و، أو، لكن، لذلك. أتريد قهوة أم شايًا؟ أنا جائعة، لذلك سآكل أولًا.
        en: And, or, but, so. Coffee or tea? I'm hungry, so I'll eat first.
        note:
          ar_eg: jadi هنا معناها «فـ» أو «عشان كده».
          ar: jadi هنا بمعنى «لذلك».
          en: Here jadi means "so" or "that's why".
  - kind: recap
    title: Jauh atau dekat?
    lines:
      - speaker: Kak Tiara
        text: Permisi, Pak. Saya mau ke Monas. Jauh atau dekat?
        ar_eg: لو سمحت يا عم. أنا عايز أروح موناس. بعيد ولا قريب؟
        ar: عفوًا يا سيدي. أريد الذهاب إلى موناس. أهو بعيد أم قريب؟
        en: Excuse me, sir. I want to go to Monas. Is it far or near?
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
          ar: ببطء. ردّد كل جملة بعدنا.
          en: Slowly. Repeat each sentence after us.
      - speaker: Kak Reza
        text: Permisi, Pak. Saya mau ke Monas. Jauh atau dekat?
        ar_eg: لو سمحت يا عم. أنا عايز أروح موناس. بعيد ولا قريب؟
        ar: عفوًا يا سيدي. أريد الذهاب إلى موناس. أهو بعيد أم قريب؟
        en: Excuse me, sir. I want to go to Monas. Is it far or near?
      - speaker: Kak Tiara
        text: Dekat. Jalan lurus, lalu belok kiri di lampu merah.
        ar_eg: قريب. امشي على طول، وبعدين حوّد شمال عند الإشارة.
        ar: قريب. امشِ إلى الأمام، ثم انعطف يسارًا عند الإشارة.
        en: Near. Go straight, then turn left at the traffic light.
      - speaker: Kak Reza
        text: Dekat. Jalan lurus, lalu belok kiri di lampu merah.
        ar_eg: قريب. امشي على طول، وبعدين حوّد شمال عند الإشارة.
        ar: قريب. امشِ إلى الأمام، ثم انعطف يسارًا عند الإشارة.
        en: Near. Go straight, then turn left at the traffic light.
      - speaker: Kak Tiara
        text: Masjidnya di sebelah kanan.
        ar_eg: الجامع على اليمين.
        ar: المسجد على اليمين.
        en: The mosque is on the right.
      - speaker: Kak Reza
        text: Masjidnya di sebelah kanan.
        ar_eg: الجامع على اليمين.
        ar: المسجد على اليمين.
        en: The mosque is on the right.
      - speaker: Kak Tiara
        text: Loket tiketnya di mana? Di samping pintu masuk.
        ar_eg: شباك التذاكر فين؟ جنب البوابة.
        ar: أين شبّاك التذاكر؟ بجانب المدخل.
        en: Where's the ticket counter? Next to the entrance.
      - speaker: Kak Reza
        text: Loket tiketnya di mana? Di samping pintu masuk.
        ar_eg: شباك التذاكر فين؟ جنب البوابة.
        ar: أين شبّاك التذاكر؟ بجانب المدخل.
        en: Where's the ticket counter? Next to the entrance.
      - speaker: Kak Tiara
        text: Tiketnya di mana? Di dalam tas.
        ar_eg: التذكرة فين؟ جوه الشنطة.
        ar: أين التذكرة؟ داخل الحقيبة.
        en: Where's the ticket? In the bag.
      - speaker: Kak Reza
        text: Tiketnya di mana? Di dalam tas.
        ar_eg: التذكرة فين؟ جوه الشنطة.
        ar: أين التذكرة؟ داخل الحقيبة.
        en: Where's the ticket? In the bag.
      - speaker: Kak Tiara
        text: Kamu dari mana? Dari Stasiun Gambir.
        ar_eg: إنت جاي منين؟ من محطة جامبير.
        ar: من أين أتيت؟ من محطة غامبير.
        en: Where have you come from? From Gambir Station.
      - speaker: Kak Reza
        text: Kamu mau ke mana? Ke Masjid Istiqlal.
        ar_eg: رايح فين؟ جامع الاستقلال.
        ar: إلى أين تذهب؟ إلى مسجد الاستقلال.
        en: Where are you going? To Istiqlal Mosque.
      - speaker: Kak Tiara
        text: Naik bus atau jalan kaki? Jalan kaki aja.
        ar_eg: أتوبيس ولا مشي؟ مشي أحسن.
        ar: بالحافلة أم سيرًا؟ سيرًا فقط.
        en: By bus or on foot? Just walk.
      - speaker: Kak Reza
        text: Naik bus atau jalan kaki? Jalan kaki aja.
        ar_eg: أتوبيس ولا مشي؟ مشي أحسن.
        ar: بالحافلة أم سيرًا؟ سيرًا فقط.
        en: By bus or on foot? Just walk.
      - speaker: Kak Tiara
        text: Dekat, tapi panas. Jadi bawa air, ya!
        ar_eg: قريب، بس حر. فخد معاك مية!
        ar: قريب، لكنه حار. لذلك خذ معك ماءً!
        en: It's near, but hot. So bring water!
      - speaker: Kak Reza
        text: Dekat, tapi panas. Jadi bawa air, ya!
        ar_eg: قريب، بس حر. فخد معاك مية!
        ar: قريب، لكنه حار. لذلك خذ معك ماءً!
        en: It's near, but hot. So bring water!
      - speaker: Kak Tiara
        text: Terima kasih banyak, Pak! Sama-sama. Selamat jalan!
        ar_eg: متشكر جدًا يا عم! العفو. مع السلامة!
        ar: شكرًا جزيلًا يا سيدي! عفوًا. رحلة سعيدة!
        en: Thank you very much, sir! You're welcome. Have a good trip!
  - kind: outro
    title: Selamat jalan!
    lines:
      - speaker: Kak Tiara
        text: Mohamed, kamu lagi di mana? Di kamar? Di dapur?
        ar_eg: يا محمد، إنت فين دلوقتي؟ في الأوضة؟ في المطبخ؟
        ar: يا محمد، أين أنت الآن؟ في الغرفة؟ في المطبخ؟
        en: Mohamed, where are you now? In your room? In the kitchen?
        note:
          ar_eg: دورك! جاوب بصوت عالي بجملة أو اتنين.
          ar: دورك! أجب بصوت مسموع بجملة أو جملتين.
          en: Your turn! Answer out loud in a sentence or two.
      - speaker: Kak Reza
        text: Aku di kamar. Duduk di kursi. Bukuku di atas meja.
        ar_eg: أنا في الأوضة. قاعد على الكرسي. كتابي على الترابيزة.
        ar: أنا في الغرفة. أجلس على الكرسي. كتابي على الطاولة.
        en: I'm in my room. Sitting on the chair. My book is on the table.
      - speaker: Kak Tiara
        text: Bagus banget, Mohamed!
        ar_eg: برافو عليك يا محمد!
        ar: أحسنت جدًا يا محمد!
        en: Great, Mohamed!
      - speaker: Kak Reza
        text: Mohamed, dari rumahmu ke masjid jauh nggak? Lurus, terus?
        ar_eg: يا محمد، من بيتك للجامع بعيد ولا قريب؟ على طول، وبعدين؟
        ar: يا محمد، من بيتك إلى المسجد، أهو بعيد أم قريب؟ إلى الأمام، ثم؟
        en: Mohamed, from your home to the mosque, is it far or near? Straight on, then?
        note:
          ar_eg: تحدي بكرة الصغير - وصف بالإندونيسي الطريق من بيتك لأقرب جامع أو محل، بـ lurus وbelok وlalu.
          ar: تحدّي الغد الصغير - صِف بالإندونيسية الطريق من بيتك إلى أقرب مسجد أو متجر، مستعملًا lurus وbelok وlalu.
          en: Tomorrow's tiny challenge - describe in Indonesian the way from your home to the nearest mosque or shop, with lurus, belok and lalu.
      - speaker: Kak Tiara
        text: Makasih, Reza. Sekarang kita ke Istiqlal, yuk!
        ar_eg: شكرًا يا رضا. يلا دلوقتي على جامع الاستقلال!
        ar: شكرًا يا رضا. الآن لنذهب إلى مسجد الاستقلال!
        en: Thanks, Reza. Now let's go to Istiqlal!
      - speaker: Kak Reza
        text: Ayo! Lurus, terus belok kanan. Makasih, Mohamed!
        ar_eg: يلا! على طول، وبعدين يمين. شكرًا يا محمد!
        ar: هيا! إلى الأمام، ثم يمينًا. شكرًا يا محمد!
        en: Let's go! Straight on, then right. Thanks, Mohamed!
      - speaker: Kak Tiara
        text: Sampai besok di Kabar Radio, Mohamed! Hati-hati di jalan!
        ar_eg: أشوفك بكرة في كبار راديو يا محمد! خلي بالك من نفسك في الطريق!
        ar: إلى الغد في كبار راديو يا محمد! انتبه لنفسك في الطريق!
        en: See you tomorrow on Kabar Radio, Mohamed! Take care on the road!
        note:
          ar_eg: Hati-hati di jalan! = «خلي بالك من نفسك» لما حد ماشي. هتسمعها كتير.
          ar: Hati-hati di jalan! = «انتبه لنفسك» لمن يغادر. ستسمعها كثيرًا.
          en: Hati-hati di jalan! = 'take care' to someone leaving. Very common.
words: [ke, dari, lurus, belok, kiri, kanan, lalu, jadi, jauh, dekat, masjid, kursi]
