        text: Kamu dari mana? Dari Stasiun Gambir.
        ar_eg: إنت جاي منين؟ من محطة جامبير.
        ar: من أين أتيت؟ من محطة غامبير.
        en: Where have you come from? From Gambir Station.
      - speaker: Mas Ardi
        text: Kamu mau ke mana? Ke Masjid Istiqlal.
        ar_eg: رايح فين؟ جامع الاستقلال.
        ar: إلى أين تذهب؟ إلى مسجد الاستقلال.
        en: Where are you going? To Istiqlal Mosque.
      - speaker: Mbak Gadis
        text: Naik bus atau jalan kaki? Jalan kaki saja.
        ar_eg: أتوبيس ولا مشي؟ مشي أحسن.
        ar: بالحافلة أم سيرًا؟ سيرًا فقط.
        en: By bus or on foot? Just walk.
      - speaker: Mas Ardi
        text: Naik bus atau jalan kaki? Jalan kaki saja.
        ar_eg: أتوبيس ولا مشي؟ مشي أحسن.
        ar: بالحافلة أم سيرًا؟ سيرًا فقط.
        en: By bus or on foot? Just walk.
