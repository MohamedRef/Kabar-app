        text: Dekat, tapi panas. Jadi bawa air, ya!
        ar_eg: قريب، بس حر. فخد معاك مية!
        ar: قريب، لكنه حار. لذلك خذ معك ماءً!
        en: It's near, but hot. So bring water!
      - speaker: Mbak Gadis
        text: Terima kasih banyak, Pak! Sama-sama. Selamat jalan!
        ar_eg: متشكر جدًا يا عم! العفو. مع السلامة!
        ar: شكرًا جزيلًا يا سيدي! عفوًا. رحلة سعيدة!
        en: Thank you very much, sir! You're welcome. Have a good trip!
  - kind: outro
    title: Selamat jalan!
    lines:
      - speaker: Mbak Gadis
        text: Mohamed, kamu di mana sekarang? Di dalam kamar? Di dapur?
        ar_eg: يا محمد، إنت فين دلوقتي؟ في الأوضة؟ في المطبخ؟
        ar: يا محمد، أين أنت الآن؟ في الغرفة؟ في المطبخ؟
        en: Mohamed, where are you now? In your room? In the kitchen?
        note:
          ar_eg: دورك! جاوب بصوت عالي بجملة أو اتنين.
          ar: دورك! أجب بصوت مسموع بجملة أو جملتين.
          en: Your turn! Answer out loud in a sentence or two.
      - speaker: Mas Ardi
        text: Saya di dalam kamar. Saya duduk di kursi. Buku saya di atas meja.
        ar_eg: أنا في الأوضة. قاعد على الكرسي. كتابي على الترابيزة.
        ar: أنا في الغرفة. أجلس على الكرسي. كتابي على الطاولة.
        en: I'm in my room. I'm sitting on the chair. My book is on the table.
      - speaker: Mbak Gadis
        text: Bagus sekali, Mohamed!
        ar_eg: برافو عليك يا محمد!
        ar: أحسنت جدًا يا محمد!
        en: Very good, Mohamed!
      - speaker: Mas Ardi
        text: Mohamed, dari rumah kamu ke masjid, jauh atau dekat? Jalan lurus, lalu?
        ar_eg: يا محمد، من بيتك للجامع بعيد ولا قريب؟ على طول، وبعدين؟
        ar: يا محمد، من بيتك إلى المسجد، أهو بعيد أم قريب؟ إلى الأمام، ثم؟
        en: Mohamed, from your home to the mosque, is it far or near? Straight on, then?
        note:
          ar_eg: تحدي بكرة الصغير - وصف بالإندونيسي الطريق من بيتك لأقرب جامع أو محل، بـ lurus وbelok وlalu.
          ar: تحدّي الغد الصغير - صِف بالإندونيسية الطريق من بيتك إلى أقرب مسجد أو متجر، مستعملًا lurus وbelok وlalu.
          en: Tomorrow's tiny challenge - describe in Indonesian the way from your home to the nearest mosque or shop, with lurus, belok and lalu.
      - speaker: Mbak Gadis
        text: Terima kasih, Mas Ardi. Sekarang kita ke Masjid Istiqlal, ya!
        ar_eg: شكرًا يا أردي. يلا دلوقتي على جامع الاستقلال!
        ar: شكرًا يا أردي. الآن لنذهب إلى مسجد الاستقلال!
        en: Thank you, Ardi. Now let's go to Istiqlal Mosque!
      - speaker: Mas Ardi
        text: Ayo! Jalan lurus, lalu belok kanan. Terima kasih, Mohamed!
        ar_eg: يلا! على طول، وبعدين يمين. شكرًا يا محمد!
        ar: هيا! إلى الأمام، ثم يمينًا. شكرًا يا محمد!
        en: Let's go! Straight on, then right. Thank you, Mohamed!
      - speaker: Mbak Gadis
        text: Sampai jumpa besok di Kabar Radio, Mohamed! Selamat jalan!
        ar_eg: أشوفك بكرة في كبار راديو يا محمد! مع السلامة!
        ar: إلى اللقاء غدًا في كبار راديو يا محمد! رحلة سعيدة!
        en: See you tomorrow on Kabar Radio, Mohamed! Safe travels!
