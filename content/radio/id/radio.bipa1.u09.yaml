schema: kabar.radio/v1
id: radio.bipa1.u09
language: id
level: bipa1
unit: bipa1.u09
title:
  target: Lurus, lalu belok kiri
  ar_eg: على طول، وبعدين حوّد شمال
  ar: إلى الأمام، ثم انعطف يسارًا
  en: Straight on, then turn left
hosts:
  - name: Mbak Gadis
    voice: id-ID-GadisNeural
  - name: Mas Ardi
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Monas
    lines:
      - speaker: Mbak Gadis
        text: Halo, selamat pagi! Selamat datang di Kabar Radio! Saya Gadis.
        ar_eg: أهلًا، صباح الخير! أهلًا بيك في كبار راديو! أنا جاديس.
        ar: مرحبًا، صباح الخير! أهلًا بك في كبار راديو! أنا غاديس.
        en: Hello, good morning! Welcome to Kabar Radio! I'm Gadis.
      - speaker: Mas Ardi
        text: Dan saya Ardi. Selamat pagi, Mbak Gadis! Mbak di mana sekarang?
        ar_eg: وأنا أردي. صباح الخير يا جاديس! إنتي فين دلوقتي؟
        ar: وأنا أردي. صباح الخير يا غاديس! أين أنتِ الآن؟
        en: And I'm Ardi. Good morning, Gadis! Where are you now?
      - speaker: Mbak Gadis
        text: Saya di Monas, di depan pintu masuk. Mas Ardi di mana?
        ar_eg: أنا في موناس، قدام البوابة. وإنت فين يا أردي؟
        ar: أنا في موناس، أمام المدخل. وأين أنت يا أردي؟
        en: I'm at Monas, in front of the entrance. Where are you, Ardi?
        note:
          ar_eg: موناس هو النصب التذكاري الوطني في قلب جاكرتا، وجنبه جامع الاستقلال.
          ar: موناس هو النصب الوطني في قلب جاكرتا، وبجواره مسجد الاستقلال.
          en: Monas is the National Monument in the heart of Jakarta, next to Istiqlal Mosque.
      - speaker: Mas Ardi
        text: Saya masih di halte, dekat stasiun. Ke sana jauh atau dekat?
        ar_eg: أنا لسه في محطة الأتوبيس، جنب محطة القطر. المشوار لعندك بعيد ولا قريب؟
        ar: ما زلت في موقف الحافلات قرب المحطة. هل الطريق إليكِ بعيد أم قريب؟
        en: I'm still at the bus stop, near the station. Is it far or near to get there?
      - speaker: Mbak Gadis
        text: Dekat, Mas. Jalan lurus, lalu belok kiri di lampu merah.
        ar_eg: قريب. امشي على طول، وبعدين حوّد شمال عند الإشارة.
        ar: قريب. امشِ إلى الأمام، ثم انعطف يسارًا عند الإشارة.
        en: Near. Go straight, then turn left at the traffic light.
      - speaker: Mas Ardi
        text: Oke. Tapi panas sekali, jadi saya beli air dulu.
        ar_eg: تمام. بس الجو حر أوي، فهشتري مية الأول.
        ar: حسنًا. لكن الجو حار جدًا، لذلك سأشتري ماءً أولًا.
        en: OK. But it's very hot, so I'll buy some water first.
        note:
          ar_eg: الناس في جاكرتا بيوصفوا الطريق بالعلامات - «بعد الجامع حوّد شمال» - وغالبًا هيمشوا معاك نص السكة.
          ar: يصف أهل جاكرتا الطريق بالمعالم - «بعد المسجد انعطف يسارًا» - وكثيرًا ما يرافقونك نصف الطريق.
          en: Jakartans give directions by landmarks - "after the mosque, turn left" - and will often walk you halfway.
      - speaker: Mbak Gadis
        text: Di, ke, dari. Di atas, di bawah, di depan, di belakang. Lurus, belok kanan, belok kiri.
        ar_eg: في، لـ، من. فوق، تحت، قدام، ورا. على طول، حوّد يمين، حوّد شمال.
        ar: في، إلى، من. فوق، تحت، أمام، خلف. إلى الأمام، انعطف يمينًا، انعطف يسارًا.
        en: At, to, from. On, under, in front of, behind. Straight, turn right, turn left.
        note:
          ar_eg: موضوع النهارده - di وke وdari، ومكان الحاجة فين، ووصف الطريق بـ lalu وtapi وjadi.
          ar: موضوع اليوم - di وke وdari، وأماكن الأشياء، ووصف الطريق بـ lalu وtapi وjadi.
          en: Today's topic - di, ke and dari, where things are, and giving directions with lalu, tapi and jadi.
      - speaker: Mas Ardi
        text: Halo, Mohamed! Selamat datang di Monas! Kamu di mana sekarang?
        ar_eg: أهلًا يا محمد! أهلًا بيك في موناس! إنت فين دلوقتي؟
        ar: مرحبًا يا محمد! أهلًا بك في موناس! أين أنت الآن؟
        en: Hello, Mohamed! Welcome to Monas! Where are you now?
  - kind: dialogue
    title: Tiketnya di mana?
    lines:
      - speaker: Mas Ardi
        text: Mbak Gadis! Halo! Saya sudah sampai di Monas.
        ar_eg: جاديس! أهلًا! أنا وصلت موناس.
        ar: غاديس! مرحبًا! لقد وصلتُ إلى موناس.
        en: Gadis! Hello! I've arrived at Monas.
      - speaker: Mbak Gadis
        text: Bagus, Mas! Mas dari mana tadi?
        ar_eg: حلو! كنت جاي منين؟
        ar: جيد! من أين جئت قبل قليل؟
        en: Great! Where did you come from just now?
      - speaker: Mas Ardi
        text: Saya dari Stasiun Gambir. Saya naik kereta dari Bogor.
        ar_eg: أنا جاي من محطة جامبير. ركبت القطر من بوجور.
        ar: جئتُ من محطة غامبير. ركبتُ القطار من بوغور.
        en: I came from Gambir Station. I took the train from Bogor.
      - speaker: Mbak Gadis
        text: Oke. Mas, tiket Monas di mana? Saya tidak punya tiket.
        ar_eg: تمام. التذاكر بتاعة موناس فين؟ أنا معنديش تذكرة.
        ar: حسنًا. أين تذاكر موناس؟ ليس معي تذكرة.
        en: OK. Where are the Monas tickets? I don't have a ticket.
      - speaker: Mas Ardi
        text: Tiketnya di dalam tas saya.
        ar_eg: التذاكر جوه شنطتي.
        ar: التذاكر داخل حقيبتي.
        en: The tickets are in my bag.
      - speaker: Mbak Gadis
        text: Ada, Mas?
        ar_eg: لقيتها؟
        ar: هل وجدتها؟
        en: Are they there?
      - speaker: Mas Ardi
        text: Tidak ada! Di dalam tas tidak ada. Di bawah kursi juga tidak ada.
        ar_eg: مفيش! جوه الشنطة مفيش. وتحت الكرسي كمان مفيش.
        ar: لا توجد! ليست داخل الحقيبة. وليست تحت الكرسي أيضًا.
        en: They're not there! Not in the bag. Not under the chair either.
      - speaker: Mbak Gadis
        text: Wah! Coba lihat di dalam buku, Mas.
        ar_eg: يا نهار! بص جوه الكتاب كده.
        ar: يا إلهي! انظر داخل الكتاب.
        en: Oh no! Try looking inside the book.
      - speaker: Mas Ardi
        text: Ah, ini dia tiketnya! Di dalam buku bahasa Arab saya.
        ar_eg: آه، أهي التذاكر! جوه كتاب العربي بتاعي.
        ar: آه، ها هي التذاكر! داخل كتاب العربية خاصتي.
        en: Ah, here are the tickets! Inside my Arabic book.
      - speaker: Mbak Gadis
        text: Wah, bagus! Sekarang kita ke loket. Loketnya di samping pintu masuk.
        ar_eg: الحمد لله، حلو! يلا نروح الشباك. الشباك جنب البوابة.
        ar: جيد! الآن لنذهب إلى الشبّاك. الشبّاك بجانب المدخل.
        en: Great! Now let's go to the counter. The counter is next to the entrance.
      - speaker: Mas Ardi
        text: Mbak, sesudah Monas, saya mau ke Masjid Istiqlal. Jauh atau dekat?
        ar_eg: بعد موناس، عايز أروح جامع الاستقلال. بعيد ولا قريب؟
        ar: بعد موناس أريد أن أذهب إلى مسجد الاستقلال. أهو بعيد أم قريب؟
        en: After Monas, I want to go to Istiqlal Mosque. Is it far or near?
      - speaker: Mbak Gadis
        text: Dekat, Mas. Masjid Istiqlal dekat Monas.
        ar_eg: قريب. جامع الاستقلال جنب موناس.
        ar: قريب. مسجد الاستقلال قرب موناس.
        en: Near. Istiqlal Mosque is near Monas.
      - speaker: Mas Ardi
        text: Naik bus atau jalan kaki?
        ar_eg: أركب أتوبيس ولا أمشي؟
        ar: أركب الحافلة أم أمشي؟
        en: By bus or on foot?
      - speaker: Mbak Gadis
        text: Jalan kaki saja. Dari pintu masuk, jalan lurus ke depan.
        ar_eg: امشي أحسن. من البوابة امشي على طول لقدام.
        ar: سيرًا على الأقدام. من المدخل امشِ إلى الأمام مباشرة.
        en: Just walk. From the entrance, go straight ahead.
      - speaker: Mas Ardi
        text: Jalan lurus, lalu?
        ar_eg: على طول، وبعدين؟
        ar: إلى الأمام، ثم؟
        en: Straight on, then?
      - speaker: Mbak Gadis
        text: Lalu belok kanan di perempatan. Kemudian jalan lurus lagi. Masjidnya di sebelah kiri.
        ar_eg: وبعدين حوّد يمين عند التقاطع. وبعد كده امشي على طول تاني. الجامع على الشمال.
        ar: ثم انعطف يمينًا عند التقاطع. بعدها امشِ إلى الأمام مرة أخرى. المسجد على اليسار.
        en: Then turn right at the crossroads. Then go straight again. The mosque is on the left.
      - speaker: Mas Ardi
        text: Belok kanan di perempatan, lalu jalan lurus. Masjidnya di sebelah kiri. Betul?
        ar_eg: أحوّد يمين عند التقاطع، وبعدين على طول. الجامع على الشمال. صح؟
        ar: أنعطف يمينًا عند التقاطع، ثم إلى الأمام. المسجد على اليسار. صحيح؟
        en: Turn right at the crossroads, then straight on. The mosque is on the left. Right?
      - speaker: Mbak Gadis
        text: Betul sekali! Dekat, tapi panas. Jadi bawa air, ya!
        ar_eg: صح جدًا! قريب، بس حر. فخد معاك مية!
        ar: صحيح تمامًا! قريب، لكنه حار. لذلك خذ معك ماءً!
        en: Exactly right! It's near, but hot. So bring water!
      - speaker: Mas Ardi
        text: Sudah, Mbak. Air saya di dalam tas, di samping buku. Terima kasih!
        ar_eg: خدت خلاص. المية في الشنطة، جنب الكتاب. شكرًا!
        ar: أخذتُه. الماء في الحقيبة بجانب الكتاب. شكرًا!
        en: Already done. My water is in the bag, next to the book. Thank you!
      - speaker: Mbak Gadis
        text: Sama-sama, Mas. Pelan-pelan saja, ya!
        ar_eg: العفو. على مهلك!
        ar: عفوًا. على مهلك!
        en: You're welcome. Take it easy!
  - kind: word_spotlight
    title: Di, ke, dari
    lines:
      - speaker: Mbak Gadis
        text: Di. Anak-anak bermain di taman. Mas Ardi di Monas.
        ar_eg: في. العيال بيلعبوا في الجنينة. أردي في موناس.
        ar: في. الأطفال يلعبون في الحديقة. أردي في موناس.
        en: At. The children play in the park. Ardi is at Monas.
        note:
          ar_eg: di للمكان اللي إنت فيه، ke للمكان اللي رايحه، dari للمكان اللي جاي منه.
          ar: di لمكان الوجود، وke لمكان الوجهة، وdari لمكان المصدر.
          en: di is where you are, ke where you're going, dari where you're coming from.
      - speaker: Mas Ardi
        text: Ke. Besok saya ke Bandung. Rina pulang ke rumah.
        ar_eg: لـ. بكرة رايح باندونج. رينا مروّحة البيت.
        ar: إلى. غدًا أذهب إلى باندونغ. رينا تعود إلى البيت.
        en: To. Tomorrow I'm going to Bandung. Rina goes home.
      - speaker: Mbak Gadis
        text: Dari. Kereta dari Bogor sudah datang. Kamu dari mana?
        ar_eg: من. القطر اللي من بوجور وصل. إنت جاي منين؟
        ar: من. وصل القطار القادم من بوغور. من أين أتيت؟
        en: From. The train from Bogor has arrived. Where are you coming from?
      - speaker: Mas Ardi
        text: Kamu mau ke mana? Ke masjid. Masjid, masjid. Masjid Istiqlal dekat Monas.
        ar_eg: رايح فين؟ الجامع. جامع، جامع. جامع الاستقلال جنب موناس.
        ar: إلى أين تذهب؟ إلى المسجد. مسجد، مسجد. مسجد الاستقلال قرب موناس.
        en: Where are you going? To the mosque. Mosque, mosque. Istiqlal Mosque is near Monas.
        note:
          ar_eg: الجسر العربي - masjid من «مسجد»، وkursi من «كرسي».
          ar: الجسر العربي - masjid من «مسجد»، وkursi من «كرسي».
          en: Arabic Bridge - masjid comes from «مسجد», and kursi from «كرسي».
      - speaker: Mbak Gadis
        text: Kursi, kursi. Di atas, di bawah. Bukunya di atas meja. Kucingnya di bawah kursi.
        ar_eg: كرسي، كرسي. فوق، تحت. الكتاب على الترابيزة. القطة تحت الكرسي.
        ar: كرسي، كرسي. فوق، تحت. الكتاب على الطاولة. القطة تحت الكرسي.
        en: Chair, chair. On, under. The book is on the table. The cat is under the chair.
      - speaker: Mas Ardi
        text: Di depan, di belakang, di samping. Tasnya di samping kursi.
        ar_eg: قدام، ورا، جنب. الشنطة جنب الكرسي.
        ar: أمام، خلف، بجانب. الحقيبة بجانب الكرسي.
        en: In front of, behind, next to. The bag is next to the chair.
      - speaker: Mbak Gadis
        text: Di dalam, di luar, di antara. Kamar saya di antara dapur dan kamar mandi.
        ar_eg: جوه، بره، بين. أوضتي بين المطبخ والحمام.
        ar: داخل، خارج، بين. غرفتي بين المطبخ والحمام.
        en: Inside, outside, between. My room is between the kitchen and the bathroom.
      - speaker: Mas Ardi
        text: Sebelah kanan, sebelah kiri. Kamar mandinya di sebelah kanan.
        ar_eg: على اليمين، على الشمال. الحمام على اليمين.
        ar: على اليمين، على اليسار. الحمام على اليمين.
        en: On the right, on the left. The bathroom is on the right.
      - speaker: Mbak Gadis
        text: Jalan lurus. Belok kiri. Belok kanan. Lalu, kemudian.
        ar_eg: امشي على طول. حوّد شمال. حوّد يمين. وبعدين، وبعد كده.
        ar: امشِ إلى الأمام. انعطف يسارًا. انعطف يمينًا. ثم، بعد ذلك.
        en: Go straight. Turn left. Turn right. Then, afterwards.
      - speaker: Mas Ardi
        text: Jalan lurus, lalu belok kiri di masjid. Belok kanan di perempatan, kemudian jalan lurus.
        ar_eg: امشي على طول، وبعدين حوّد شمال عند الجامع. حوّد يمين عند التقاطع، وبعد كده على طول.
        ar: امشِ إلى الأمام، ثم انعطف يسارًا عند المسجد. انعطف يمينًا عند التقاطع، ثم إلى الأمام.
        en: Go straight, then turn left at the mosque. Turn right at the crossroads, then go straight.
      - speaker: Mbak Gadis
        text: Dan, atau, tapi, jadi. Mau kopi atau teh? Saya lapar, jadi saya makan dulu.
        ar_eg: و، ولا، بس، فـ. تشرب قهوة ولا شاي؟ أنا جعانة، فهاكل الأول.
        ar: و، أو، لكن، لذلك. أتريد قهوة أم شايًا؟ أنا جائعة، لذلك سآكل أولًا.
        en: And, or, but, so. Coffee or tea? I'm hungry, so I'll eat first.
        note:
          ar_eg: jadi هنا معناها «فـ» أو «عشان كده».
          ar: jadi هنا بمعنى «لذلك».
          en: Here jadi means "so" or "that's why".
  - kind: recap
    title: Jauh atau dekat?
    lines:
      - speaker: Mbak Gadis
        text: Permisi, Pak. Saya mau ke Monas. Jauh atau dekat?
        ar_eg: لو سمحت يا عم. أنا عايز أروح موناس. بعيد ولا قريب؟
        ar: عفوًا يا سيدي. أريد الذهاب إلى موناس. أهو بعيد أم قريب؟
        en: Excuse me, sir. I want to go to Monas. Is it far or near?
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
          ar: ببطء. ردّد كل جملة بعدنا.
          en: Slowly. Repeat each sentence after us.
      - speaker: Mas Ardi
        text: Permisi, Pak. Saya mau ke Monas. Jauh atau dekat?
        ar_eg: لو سمحت يا عم. أنا عايز أروح موناس. بعيد ولا قريب؟
        ar: عفوًا يا سيدي. أريد الذهاب إلى موناس. أهو بعيد أم قريب؟
        en: Excuse me, sir. I want to go to Monas. Is it far or near?
