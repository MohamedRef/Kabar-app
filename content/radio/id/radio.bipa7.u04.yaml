schema: kabar.radio/v1
id: radio.bipa7.u04
language: id
level: bipa7
unit: bipa7.u04
title:
  target: Sa, ko, gue, lu
  ar_eg: أنا وإنت بكل اللهجات
  ar: «أنا» و«أنت» بكل اللهجات
  en: Me and you, in every dialect
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Puncak Piaynemo
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari puncak Piaynemo! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من قمة بياينيمو! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من قمة بياينيمو! هذا كبار راديو. أنا تيارا.", en: "Good morning from the top of Piaynemo! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Napas saya habis setelah naik tangga, tapi pemandangannya luar biasa: pulau-pulau karst di laut biru.", ar_eg: "أنا رضا. نفسي اتقطع بعد ما طلعت السلم، بس المنظر تحفة: جزر صخرية في بحر أزرق.", ar: "أنا رضا. انقطعت أنفاسي بعد صعود الدرج، لكن المنظر مذهل: جزر كارستية في بحر أزرق.", en: "I'm Reza. I'm out of breath after the stairs, but the view is amazing: karst islands in a blue sea."}
      - {speaker: Kak Tiara, text: "Kaka Yohana ikut naik. Dia mengajari kami logat Papua.", ar_eg: "كاكا يوهانا طلعت معانا. وبتعلمنا لهجة بابوا.", ar: "صعدت معنا كاكا يوهانا، وهي تعلّمنا لهجة بابوا.", en: "Kaka Yohana came up too. She's teaching us the Papuan accent."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar ragam dialek: Melayu Papua, Jakarta, Manado, Ambon, dan logat Jawa."
        ar_eg: "النهارده هنتعلم أنواع اللهجات: ملايو بابوا، وجاكرتا، ومانادو، وأمبون، ولكنة جاوة."
        ar: "اليوم نتعلم تنوّع اللهجات: ملايوية بابوا، وجاكرتا، ومانادو، وأمبون، واللكنة الجاوية."
        en: "Today we learn dialect variety: Papuan Malay, Jakarta, Manado, Ambon, and the Javanese accent."
      - {speaker: Kak Tiara, text: "Mohamed, orang Mesir di Alexandria dan Aswan bicara sama, tidak?", ar_eg: "يا محمد، المصريين في إسكندرية وأسوان بيتكلموا زي بعض ولا لأ؟", ar: "يا محمد، هل يتكلم أهل الإسكندرية وأسوان بالطريقة نفسها؟", en: "Mohamed, do Egyptians in Alexandria and Aswan speak the same?"}
  - kind: dialogue
    title: Tebak logat
    lines:
      - speaker: Kak Tiara
        text: "Kita main tebak logat. Kak Reza menirukan, saya menebak dari mana."
        ar_eg: "يلا نلعب «خمّن اللهجة». رضا هيقلّد، وأنا هخمّن من فين."
        ar: "لنلعب «خمّن اللهجة»: يقلّد رضا وأخمّن أنا من أين."
        en: "Let's play guess-the-accent. Reza imitates, I guess where it's from."
        note:
          ar_eg: "تقليد بحب واحترام. كل اللهجات دي إندونيسي صح."
          ar: "تقليد بمحبة واحترام؛ وكل هذه اللهجات إندونيسية سليمة."
          en: "Imitation with affection and respect. All these varieties are real Indonesian."
      - {speaker: Kak Reza, text: "Sa su makan tadi. Ko mau ikut ka tidak?", ar_eg: "«أنا كلت خلاص من شوية. إنت عايز تيجي ولا لأ؟»", ar: "«أكلتُ قبل قليل. أتريد أن تأتي أم لا؟»", en: "I've already eaten. Do you want to come or not?"}
      - {speaker: Kak Tiara, text: "Itu Melayu Papua! Sa untuk saya, ko untuk kamu, su untuk sudah. Kaka Yohana mengangguk!", ar_eg: "دي ملايو بابوا! sa يعني saya (أنا)، وko يعني kamu (إنت)، وsu يعني sudah (خلاص). وكاكا يوهانا بتهز راسها!", ar: "هذه ملايوية بابوا! sa بدل saya، وko بدل kamu، وsu بدل sudah. وكاكا يوهانا تومئ موافقة!", en: "That's Papuan Malay! Sa for saya, ko for kamu, su for sudah. Kaka Yohana is nodding!"}
      - {speaker: Kak Reza, text: "Gue udah makan tadi. Lu mau ikut nggak?", ar_eg: "«أنا كلت خلاص. إنت جاي ولا لأ؟»", ar: "«أكلتُ قبل قليل. هل ستأتي أم لا؟»", en: "I've already eaten. You coming or not?"}
      - {speaker: Kak Tiara, text: "Gampang, itu Jakarta. Gue dan lu.", ar_eg: "سهلة، دي جاكرتا. gue وlu.", ar: "سهلة، هذه جاكرتا: gue وlu.", en: "Easy, that's Jakarta. Gue and lu."}
      - {speaker: Kak Reza, text: "Kita so makang tadi. Ngana mo iko?", ar_eg: "«أنا كلت خلاص. إنت هتيجي؟»", ar: "«أكلتُ قبل قليل. أستأتي؟»", en: "I've already eaten. Will you come?"}
      - {speaker: Kak Tiara, text: "Manado! Hati-hati, di Manado kita artinya saya, bukan kami. Ngana artinya kamu.", ar_eg: "مانادو! خلي بالك، في مانادو kita معناها «أنا»، مش «إحنا». وngana يعني «إنت».", ar: "مانادو! انتبه: kita في مانادو تعني «أنا» لا «نحن»، وngana تعني «أنت».", en: "Manado! Careful: in Manado, kita means I, not we. Ngana means you."}
      - {speaker: Kak Reza, text: "Beta su makan. Ale mau iko ka seng?", ar_eg: "«أنا كلت خلاص. إنت عايز تيجي ولا لأ؟»", ar: "«أكلتُ. أتريد أن تأتي أم لا؟»", en: "I've eaten. Do you want to come or not?"}
      - {speaker: Kak Tiara, text: "Ambon! Beta dan ale. Seng artinya tidak. Terakhir, satu lagi!", ar_eg: "أمبون! beta وale. وseng يعني «لأ». آخر واحدة!", ar: "أمبون! beta وale، وseng تعني «لا». وواحدة أخيرة!", en: "Ambon! Beta and ale. Seng means no. One more!"}
      - {speaker: Kak Reza, text: "Lho, kok sudah makan to? Aku belum!", ar_eg: "«إيه ده، إنت كلت خلاص؟ أنا لسه!»", ar: "«ماذا، أكلتَ بالفعل؟ أنا لم آكل بعد!»", en: "What, you've eaten already? I haven't!"}
      - {speaker: Kak Tiara, text: "Itu logat Jawa: lho, kok, to. Semua logat ini memperkaya bahasa Indonesia.", ar_eg: "دي لكنة جاوة: lho وkok وto. كل اللهجات دي بتغني الإندونيسي.", ar: "هذه اللكنة الجاوية: lho وkok وto. وكل هذه اللهجات تُثري الإندونيسية.", en: "That's the Javanese accent: lho, kok, to. All these accents enrich Indonesian."}
  - kind: word_spotlight
    title: Peta dialek
    lines:
      - speaker: Kak Tiara
        text: "Melayu Papua: sa, ko, dia pu rumah, tra atau tara untuk tidak."
        ar_eg: "ملايو بابوا: sa (أنا)، ko (إنت)، dia pu rumah (بيته)، tra أو tara يعني «لأ/مش»."
        ar: "ملايوية بابوا: sa، ko، dia pu rumah (بيته)، tra أو tara بمعنى «لا»."
        en: "Papuan Malay: sa, ko, dia pu rumah for his house, tra or tara for not."
        note:
          ar_eg: "افهمها كويس، بس في الشغل والكتابة استعمل الفصحى."
          ar: "افهمها جيدًا، لكن استخدم الفصحى في العمل والكتابة."
          en: "Understand them well, but use standard Indonesian at work and in writing."
      - {speaker: Kak Reza, text: "Logat, dialek, ragam, partikel, bahasa baku.", ar_eg: "لكنة، لهجة، نوع لغوي، أداة كلام، لغة فصحى.", ar: "لكنة، لهجة، تنوع لغوي، أداة، لغة معيارية.", en: "Accent, dialect, variety, particle, standard language."}
      - {speaker: Kak Tiara, text: "Pace dan mace: bapak dan ibu dalam Melayu Papua. Kaka: kakak.", ar_eg: "pace وmace: الأب والأم في ملايو بابوا. وkaka يعني الأخ أو الأخت الكبيرة.", ar: "pace وmace: الأب والأم في ملايوية بابوا، وkaka: الأخ أو الأخت الأكبر.", en: "Pace and mace: father and mother in Papuan Malay. Kaka: older sibling."}
      - {speaker: Kak Reza, text: "Laporan informatif: memaparkan fakta dengan jelas, tanpa pendapat pribadi.", ar_eg: "التقرير المعلوماتي: يعرض الحقايق بوضوح، من غير رأي شخصي.", ar: "التقرير المعلوماتي: يعرض الحقائق بوضوح دون رأي شخصي.", en: "An informative report: sets out facts clearly, without personal opinion."}
      - {speaker: Kak Tiara, text: "Di Indonesia juga ada bahasa isyarat, Bisindo, untuk teman Tuli.", ar_eg: "وفي إندونيسيا كمان فيه لغة إشارة، اسمها بيسيندو، لأصحابنا الصم.", ar: "وفي إندونيسيا أيضًا لغة إشارة، «بيسيندو»، للأصدقاء الصم.", en: "Indonesia also has a sign language, Bisindo, for Deaf friends."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Sa su makan. Ko mau ikut ka tidak?"
        ar_eg: "أنا كلت خلاص. إنت عايز تيجي ولا لأ؟"
        ar: "أكلتُ. أتريد أن تأتي أم لا؟"
        en: "I've eaten. Want to come or not?"
        note:
          ar_eg: "كرر ورانا كل جملة بلهجتها."
          ar: "ردّد كل جملة بعدنا بلهجتها."
          en: "Repeat each sentence after us, in its accent."
      - {speaker: Kak Reza, text: "Sa su makan. Ko mau ikut ka tidak?", ar_eg: "أنا كلت خلاص. إنت عايز تيجي ولا لأ؟", ar: "أكلتُ. أتريد أن تأتي أم لا؟", en: "I've eaten. Want to come or not?"}
      - {speaker: Kak Tiara, text: "Saya sudah makan. Kamu mau ikut atau tidak?", ar_eg: "أنا كلت خلاص. إنت عايز تيجي ولا لأ؟ (فصحى)", ar: "أكلتُ. أتريد أن تأتي أم لا؟ (بالفصحى)", en: "I've eaten. Do you want to come or not? (standard)"}
      - {speaker: Kak Reza, text: "Saya sudah makan. Kamu mau ikut atau tidak?", ar_eg: "أنا كلت خلاص. إنت عايز تيجي ولا لأ؟ (فصحى)", ar: "أكلتُ. أتريد أن تأتي أم لا؟ (بالفصحى)", en: "I've eaten. Do you want to come or not? (standard)"}
      - {speaker: Kak Tiara, text: "Di Manado, kita artinya saya.", ar_eg: "في مانادو، kita معناها «أنا».", ar: "في مانادو، kita تعني «أنا».", en: "In Manado, kita means I."}
      - {speaker: Kak Reza, text: "Di Manado, kita artinya saya.", ar_eg: "في مانادو، kita معناها «أنا».", ar: "في مانادو، kita تعني «أنا».", en: "In Manado, kita means I."}
      - {speaker: Kak Tiara, text: "Semua logat memperkaya bahasa Indonesia.", ar_eg: "كل اللهجات بتغني الإندونيسي.", ar: "كل اللهجات تُثري الإندونيسية.", en: "Every accent enriches Indonesian."}
      - {speaker: Kak Reza, text: "Semua logat memperkaya bahasa Indonesia.", ar_eg: "كل اللهجات بتغني الإندونيسي.", ar: "كل اللهجات تُثري الإندونيسية.", en: "Every accent enriches Indonesian."}
  - kind: outro
    title: Dari mana dia?
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ubah kalimat ini ke Melayu Papua: Saya tidak punya uang, tapi saya sudah kenyang."
        ar_eg: "يا محمد، حوّل الجملة دي لملايو بابوا: «معاييش فلوس، بس أنا شبعت خلاص»."
        ar: "يا محمد، حوّل هذه الجملة إلى ملايوية بابوا: «ليس معي مال، لكنني شبعت»."
        en: "Mohamed, turn this into Papuan Malay: I have no money, but I'm already full."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Jawabannya: Sa tra punya uang, tapi sa su kenyang.", ar_eg: "الإجابة: «Sa tra punya uang, tapi sa su kenyang».", ar: "الإجابة: «Sa tra punya uang, tapi sa su kenyang».", en: "Answer: Sa tra punya uang, tapi sa su kenyang."}
      - {speaker: Kak Tiara, text: "Besok, tulis laporan informatif pendek tentang dialek Mesir.", ar_eg: "بكرة، اكتب تقرير معلوماتي قصير عن اللهجات المصرية.", ar: "غدًا، اكتب تقريرًا معلوماتيًا قصيرًا عن اللهجات المصرية.", en: "Tomorrow, write a short informative report on Egyptian dialects."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Terima kasih, Kaka Yohana. Sampai ketemu lagi, e!", ar_eg: "شكرًا يا محمد. شكرًا يا كاكا يوهانا. نشوفكم تاني، ها!", ar: "شكرًا يا محمد. شكرًا يا كاكا يوهانا. إلى لقاء آخر!", en: "Thank you, Mohamed. Thank you, Kaka Yohana. See you again, eh!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [logat, dialek, ragam, sa, ko, su, tra, ngana, beta, Bisindo, ale, bahasa isyarat]
review:
  status: draft
  verified: false
  notes: |
    Dialect lines are hosts' imitations; have a speaker of each variety check them:
    Papuan Malay (sa/ko/su/tra/pu, "ka tidak"), Manado (kita = I, ngana, so, mo, iko,
    makang), Ambon (beta, ale, seng, su, iko), Javanese-influenced (lho, kok, to).
    Kaka Yohana is the registered BIPA 7 Papuan Malay guide.
