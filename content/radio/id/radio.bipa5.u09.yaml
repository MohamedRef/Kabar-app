schema: kabar.radio/v1
id: radio.bipa5.u09
language: id
level: bipa5
unit: bipa5.u09
title:
  target: Kata-kata yang datang dari jauh
  ar_eg: كلمات جاية من بعيد
  ar: كلمات جاءت من بعيد
  en: Words that came from far away
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Di garis khatulistiwa
    lines:
      - {speaker: Kak Tiara, text: "Selamat siang dari Pontianak, kota di garis khatulistiwa! Ini Kabar Radio. Saya Tiara.", ar_eg: "مساء الخير من بونتياناك، المدينة اللي على خط الاستوا! ده كبار راديو. أنا تيارا.", ar: "طاب يومكم من بونتياناك، المدينة الواقعة على خط الاستواء! هذا كبار راديو. أنا تيارا.", en: "Good afternoon from Pontianak, the city on the equator! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Di sini, satu kaki di utara, satu kaki di selatan!", ar_eg: "أنا رضا. هنا، رجل في الشمال ورجل في الجنوب!", ar: "أنا رضا. هنا قدم في الشمال وقدم في الجنوب!", en: "I'm Reza. Here, one foot is in the north and one in the south!"}
      - {speaker: Kak Tiara, text: "Bahasa Indonesia juga berdiri di antara banyak dunia. Dari Arab, Sanskerta, Belanda, Portugis, Tionghoa, dan Inggris.", ar_eg: "والإندونيسي كمان واقف بين عوالم كتير: من العربي والسنسكريتي والهولندي والبرتغالي والصيني والإنجليزي.", ar: "والإندونيسية أيضًا تقف بين عوالم كثيرة: العربية والسنسكريتية والهولندية والبرتغالية والصينية والإنجليزية.", en: "Indonesian also stands between many worlds: Arabic, Sanskrit, Dutch, Portuguese, Chinese and English."}
      - speaker: Kak Reza
        text: "Hari ini kita bicara tentang kata serapan, bahasa baku, dan bahasa gaul."
        ar_eg: "النهارده هنتكلم عن الكلمات المستعارة، واللغة الفصحى، ولغة الشارع."
        ar: "اليوم نتحدث عن الكلمات الدخيلة، واللغة المعيارية، والعامية الشبابية."
        en: "Today we talk about loanwords, standard language and slang."
      - {speaker: Kak Tiara, text: "Mohamed, kamu pasti sudah menemukan banyak kata Arab, kan?", ar_eg: "يا محمد، أكيد لقيت كلمات عربي كتير، صح؟", ar: "يا محمد، لا بد أنك وجدت كلمات عربية كثيرة، أليس كذلك؟", en: "Mohamed, you must have found lots of Arabic words, right?"}
  - kind: dialogue
    title: Permainan tebak asal kata
    lines:
      - speaker: Kak Tiara
        text: "Kita main tebak-tebakan. Saya sebut kata, Kak Reza tebak asalnya."
        ar_eg: "يلا نلعب فوازير. أنا أقول كلمة، ورضا يخمّن أصلها."
        ar: "لنلعب لعبة تخمين: أقول كلمة ويخمّن رضا أصلها."
        en: "Let's play a guessing game. I say a word, Reza guesses where it's from."
        note:
          ar_eg: "حاول تخمّن قبل رضا!"
          ar: "حاول التخمين قبل رضا!"
          en: "Try to guess before Reza does!"
      - {speaker: Kak Tiara, text: "Kata pertama: kursi.", ar_eg: "أول كلمة: kursi.", ar: "الكلمة الأولى: kursi.", en: "First word: kursi."}
      - {speaker: Kak Reza, text: "Gampang! Dari bahasa Arab, kursi. Artinya sama.", ar_eg: "سهلة! من العربي، كرسي. نفس المعنى.", ar: "سهلة! من العربية «كرسي»، والمعنى نفسه.", en: "Easy! From Arabic, kursi. Same meaning."}
      - {speaker: Kak Tiara, text: "Kedua: sepatu.", ar_eg: "التانية: sepatu.", ar: "الثانية: sepatu.", en: "Second: sepatu."}
      - {speaker: Kak Reza, text: "Hmm, dari bahasa Portugis, sapato. Artinya sepatu.", ar_eg: "همم، من البرتغالي sapato. يعني جزمة.", ar: "من البرتغالية sapato، أي حذاء.", en: "Hmm, from Portuguese sapato. It means shoe."}
      - {speaker: Kak Tiara, text: "Ketiga: kantor.", ar_eg: "التالتة: kantor.", ar: "الثالثة: kantor.", en: "Third: kantor."}
      - {speaker: Kak Reza, text: "Dari bahasa Belanda, kantoor. Keempat, jangan sulit-sulit, ya!", ar_eg: "من الهولندي kantoor. والرابعة ما تبقاش صعبة بقى!", ar: "من الهولندية kantoor. والرابعة لا تجعليها صعبة!", en: "From Dutch, kantoor. Don't make the fourth one hard!"}
      - {speaker: Kak Tiara, text: "Keempat: bahasa.", ar_eg: "الرابعة: bahasa.", ar: "الرابعة: bahasa.", en: "Fourth: bahasa."}
      - {speaker: Kak Reza, text: "Ini dari Sanskerta, bhāṣā. Ternyata kata bahasa sendiri adalah kata serapan!", ar_eg: "دي من السنسكريتي bhāṣā. طلعت كلمة «لغة» نفسها مستعارة!", ar: "هذه من السنسكريتية bhāṣā. فكلمة «لغة» نفسها دخيلة!", en: "This is from Sanskrit, bhāṣā. So the word for language is itself a loanword!"}
      - {speaker: Kak Tiara, text: "Terakhir, bahasa gaul: anak muda bilang gue dan lo. Itu dari dialek Betawi, dan asalnya dari Hokkien.", ar_eg: "وآخر حاجة، لغة الشباب: بيقولوا gue وlo. دي من لهجة بيتاوي، وأصلها من الهوكين الصيني.", ar: "وأخيرًا العامية: يقول الشباب gue وlo، وهما من لهجة بيتاوي وأصلهما من الهوكيين الصينية.", en: "Finally, slang: young people say gue and lo. That's from the Betawi dialect, originally from Hokkien."}
      - {speaker: Kak Reza, text: "Tapi di surat resmi, tetap saya dan Anda. Itu bahasa baku.", ar_eg: "بس في الجوابات الرسمية، برضه saya وAnda. دي اللغة الفصحى.", ar: "لكن في الرسائل الرسمية تبقى saya وAnda؛ تلك هي اللغة المعيارية.", en: "But in formal letters it's still saya and Anda. That's standard language."}
  - kind: word_spotlight
    title: Jembatan Arab
    lines:
      - speaker: Kak Tiara
        text: "Kata dari Arab: kitab, waktu, ilmu, adil, musyawarah, selamat."
        ar_eg: "كلمات من العربي: كتاب، وقت، علم، عادل، مشاورة، سلامة."
        ar: "من العربية: كتاب، وقت، علم، عادل، مشاورة، سلامة."
        en: "Words from Arabic: book, time, knowledge, just, deliberation, safe."
        note:
          ar_eg: "خلي بالك: المعنى ساعات بيتغير. selamat بقت تحية: «سلامات»."
          ar: "تنبّه: قد يتغير المعنى؛ فـselamat صارت تحية."
          en: "Careful: meanings can shift. Selamat became a greeting."
      - {speaker: Kak Reza, text: "Kadang maknanya bergeser. Kalimat artinya sentence, bukan hanya word.", ar_eg: "ساعات المعنى بيتنقل. kalimat معناها «جملة» مش «كلمة» بس.", ar: "قد ينزاح المعنى؛ فـkalimat تعني «جملة» لا «كلمة» فحسب.", en: "Sometimes the meaning shifts. Kalimat means sentence, not just word."}
      - {speaker: Kak Tiara, text: "Kata serapan, bahasa baku, bahasa gaul, bahasa daerah, campur kode.", ar_eg: "كلمة مستعارة، لغة فصحى، لغة شارع، لغة إقليمية، خلط اللغات.", ar: "كلمة دخيلة، لغة معيارية، عامية، لغة محلية، مزج لغوي.", en: "Loanword, standard language, slang, regional language, code-mixing."}
      - {speaker: Kak Reza, text: "Campur kode: Meeting-nya jam berapa, sih? Banyak orang kota bicara begini.", ar_eg: "خلط اللغات: «الميتينج الساعة كام بقى؟» ناس كتير في المدن بتتكلم كده.", ar: "المزج اللغوي: «الميتينغ الساعة كم؟» يتكلم كثير من أهل المدن هكذا.", en: "Code-mixing: What time's the meeting, then? Many city people talk like this."}
      - {speaker: Kak Tiara, text: "Salah kaprah: kesalahan yang sudah biasa. Misalnya, banyak orang menulis praktek, bukan praktik.", ar_eg: "salah kaprah: غلطة بقت عادية. مثلًا، ناس كتير بتكتب praktek بدل praktik.", ar: "salah kaprah: خطأ شائع. مثلًا، يكتب كثيرون praktek بدل praktik.", en: "Salah kaprah: a common mistake. For example, many write praktek, not praktik."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Kata kursi berasal dari bahasa Arab."
        ar_eg: "كلمة kursi أصلها عربي."
        ar: "كلمة kursi أصلها عربي."
        en: "The word kursi comes from Arabic."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Kata kursi berasal dari bahasa Arab.", ar_eg: "كلمة kursi أصلها عربي.", ar: "كلمة kursi أصلها عربي.", en: "The word kursi comes from Arabic."}
      - {speaker: Kak Tiara, text: "Sepatu adalah kata serapan dari Portugis.", ar_eg: "sepatu كلمة مستعارة من البرتغالي.", ar: "sepatu كلمة دخيلة من البرتغالية.", en: "Sepatu is a loanword from Portuguese."}
      - {speaker: Kak Reza, text: "Sepatu adalah kata serapan dari Portugis.", ar_eg: "sepatu كلمة مستعارة من البرتغالي.", ar: "sepatu كلمة دخيلة من البرتغالية.", en: "Sepatu is a loanword from Portuguese."}
      - {speaker: Kak Tiara, text: "Di surat resmi, pakailah bahasa baku.", ar_eg: "في الجوابات الرسمية، استعمل الفصحى.", ar: "في الرسائل الرسمية استخدم اللغة المعيارية.", en: "In formal letters, use standard language."}
      - {speaker: Kak Reza, text: "Di surat resmi, pakailah bahasa baku.", ar_eg: "في الجوابات الرسمية، استعمل الفصحى.", ar: "في الرسائل الرسمية استخدم اللغة المعيارية.", en: "In formal letters, use standard language."}
      - {speaker: Kak Tiara, text: "Bahasa Indonesia tumbuh dari bahasa Melayu.", ar_eg: "الإندونيسي طلع من لغة الملايو.", ar: "نشأت الإندونيسية من لغة الملايو.", en: "Indonesian grew from Malay."}
      - {speaker: Kak Reza, text: "Bahasa Indonesia tumbuh dari bahasa Melayu.", ar_eg: "الإندونيسي طلع من لغة الملايو.", ar: "نشأت الإندونيسية من لغة الملايو.", en: "Indonesian grew from Malay."}
  - kind: outro
    title: Kamus Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, sebutkan tiga kata Indonesia dari bahasa Arab yang maknanya bergeser."
        ar_eg: "يا محمد، قول تلات كلمات إندونيسي من العربي معناهم اتغير."
        ar: "يا محمد، اذكر ثلاث كلمات إندونيسية من العربية تغيّر معناها."
        en: "Mohamed, name three Indonesian words from Arabic whose meaning shifted."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Petunjuk: kalimat, selamat, dan musyawarah. Apa bedanya dengan bahasa Arab?", ar_eg: "تلميح: kalimat وselamat وmusyawarah. إيه الفرق بينهم وبين العربي؟", ar: "تلميح: kalimat وselamat وmusyawarah. ما الفرق بينها وبين العربية؟", en: "Hint: kalimat, selamat and musyawarah. How do they differ from Arabic?"}
      - {speaker: Kak Tiara, text: "Besok, kumpulkan sepuluh kata serapan yang kamu temukan minggu ini.", ar_eg: "بكرة، جمّع عشر كلمات مستعارة لقيتها الأسبوع ده.", ar: "غدًا، اجمع عشر كلمات دخيلة وجدتها هذا الأسبوع.", en: "Tomorrow, collect ten loanwords you found this week."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Kamu jembatan antara dua bahasa!", ar_eg: "شكرًا يا محمد. إنت كوبري بين لغتين!", ar: "شكرًا يا محمد. أنت جسر بين لغتين!", en: "Thank you, Mohamed. You're a bridge between two languages!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [kata serapan, bahasa baku, bahasa gaul, bahasa daerah, campur kode, salah kaprah, kursi, sepatu, kantor, bahasa Melayu, berasal dari, kesalahan]
review:
  status: draft
  verified: false
  notes: |
    Spot-check etymologies: kursi (Ar.), sepatu (Port. sapato), kantor (Du. kantoor),
    bahasa (Skt. bhāṣā), gue/lo (Betawi via Hokkien), praktik as baku form (KBBI).
    Pontianak's equator monument (Tugu Khatulistiwa).
