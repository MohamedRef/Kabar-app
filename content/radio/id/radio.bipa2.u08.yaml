schema: kabar.radio/v1
id: radio.bipa2.u08
language: id
level: bipa2
unit: bipa2.u08
title:
  target: Naik ojek ke Bedugul
  ar_eg: بالموتوسيكل لبيدوجول
  ar: بالدراجة النارية إلى بيدوغول
  en: By ojek to Bedugul
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Udara sejuk di Bedugul
    lines:
      - {speaker: Kak Tiara, text: "Halo, selamat siang! Ini Kabar Radio. Aku Tiara.", ar_eg: "أهلًا، نهارك سعيد! ده كبار راديو. أنا تيارا.", ar: "مرحبًا، طاب يومك! هذا كبار راديو. أنا تيارا.", en: "Hello, good afternoon! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Brr! Hari ini kita di Bedugul, di gunung. Dingin banget!", ar_eg: "وأنا رضا. برر! النهارده إحنا في بيدوجول، في الجبل. الجو منعش أوي.", ar: "وأنا رضا. برر! اليوم نحن في بيدوغول، في الجبل. الهواء منعش جدًا.", en: "And I'm Reza. Brr! Today we're in Bedugul, in the mountains. So cold!"}
      - speaker: Kak Tiara
        text: "Di sini ada danau dan pura yang indah, Pura Ulun Danu Beratan."
        ar_eg: "هنا فيه بحيرة ومعبد جميل، معبد أولون دانو براتان."
        ar: "هنا بحيرة ومعبد جميل، معبد أولون دانو براتان."
        en: "Here there's a lake and a beautiful temple, Pura Ulun Danu Beratan."
        note:
          ar_eg: "pura يعني معبد هندوسي بالي. المعبد ده على شط بحيرة براتان."
          ar: "pura تعني معبدًا هندوسيًا باليًا. وهذا المعبد على ضفة بحيرة براتان."
          en: "Pura means a Balinese Hindu temple. This one stands on the shore of Lake Beratan."
      - {speaker: Kak Reza, text: "Tadi pagi kita naik ojek dari Denpasar. Jauh, tapi seru!", ar_eg: "الصبح ركبنا موتوسيكل أجرة من دنباسار. بعيد، بس كان جامد!", ar: "صباح اليوم ركبنا دراجة أجرة من دنباسار. بعيد، لكنه ممتع!", en: "This morning we came by ojek from Denpasar. Far, but fun!"}
      - {speaker: Kak Tiara, text: "Halo, Mohamed! Kamu ke kantor naik apa? Bus, mobil, atau jalan kaki?", ar_eg: "أهلًا يا محمد! بتروح الشغل بإيه؟ أتوبيس، عربية، ولا مشي؟", ar: "مرحبًا يا محمد! بماذا تذهب إلى العمل؟ حافلة، سيارة، أم مشيًا؟", en: "Hello, Mohamed! How do you get to work? Bus, car or on foot?"}
  - kind: dialogue
    title: Pesan ojek
    lines:
      - speaker: Kak Reza
        text: "Tiara, ceritain perjalanan kita tadi pagi. Pelan-pelan, ya."
        ar_eg: "يا تيارا، احكي رحلتنا الصبح. بالراحة."
        ar: "يا تيارا، احكي رحلتنا هذا الصباح. على مهل."
        en: "Tiara, tell them about our trip this morning. Slowly."
        note:
          ar_eg: "ceritain = ceritakan في الكلام."
          ar: "ceritain = ceritakan في الكلام اليومي."
          en: "ceritain = spoken ceritakan."
      - {speaker: Kak Tiara, text: "Oke. Pertama, kita pesan ojek di aplikasi.", ar_eg: "ماشي. الأول، طلبنا موتوسيكل أجرة من الأبلكيشن.", ar: "حسنًا. أولًا، طلبنا دراجة أجرة من التطبيق.", en: "OK. First, we booked an ojek on the app."}
      - speaker: Kak Reza
        text: "Lalu sopirnya mengirim pesan: 'Sy sdh di depan hotel ya kak.'"
        ar_eg: "وبعدين السواق بعت رسالة: «أنا قدام الأوتيل يا فندم.»"
        ar: "ثم أرسل السائق رسالة: «أنا أمام الفندق يا أستاذ.»"
        en: "Then the driver sent a message: 'I'm in front of the hotel.'"
        note:
          ar_eg: "في الشات بيختصروا: sy = saya، sdh = sudah. وkak كلمة مؤدبة لأي حد قدّك."
          ar: "في المحادثات يختصرون: sy = saya، وsdh = sudah. وkak لفظ مهذب لمن في سنك."
          en: "In chat people shorten words: sy = saya, sdh = sudah. Kak is a polite word for someone your age."
      - {speaker: Kak Tiara, text: "Kita pakai helm, terus berangkat.", ar_eg: "لبسنا الخوذة، وبعدين اتحركنا.", ar: "لبسنا الخوذة، ثم انطلقنا.", en: "We put on helmets, then we set off."}
      - {speaker: Kak Reza, text: "Ketika kami di jalan, hujan turun!", ar_eg: "وإحنا في الطريق، المطر نزل!", ar: "حين كنا في الطريق، نزل المطر!", en: "When we were on the road, it started to rain!"}
      - {speaker: Kak Tiara, text: "Sopirnya berhenti di warung. Kita ngopi sambil nunggu.", ar_eg: "السواق وقف عند دكان. شربنا قهوة وإحنا مستنيين.", ar: "توقف السائق عند مطعم صغير. شربنا القهوة ونحن ننتظر.", en: "The driver stopped at a warung. We drank coffee while we waited.", note: {ar_eg: "ngopi = نشرب قهوة، nunggu = menunggu.", ar: "ngopi = شرب القهوة، nunggu = menunggu.", en: "ngopi = have coffee, nunggu = menunggu."}}
      - {speaker: Kak Reza, text: "Sambil ngopi, sopirnya cerita soal keluarganya.", ar_eg: "وهو بيشرب القهوة، السواق حكى عن عيلته.", ar: "وهو يشرب القهوة، حدّثنا السائق عن عائلته.", en: "While drinking coffee, the driver told us about his family.", note: {ar_eg: "soal = tentang في الكلام.", ar: "soal = tentang في الكلام اليومي.", en: "soal = tentang in speech."}}
      - {speaker: Kak Tiara, text: "Habis hujan berhenti, kita jalan lagi. Jalannya naik turun.", ar_eg: "بعد ما المطر وقف، مشينا تاني. الطريق طالع نازل.", ar: "بعد أن توقف المطر، انطلقنا من جديد. الطريق صاعد هابط.", en: "After the rain stopped, we went on. The road went up and down."}
      - speaker: Kak Reza
        text: "Aku bilang: 'Pak, pelan-pelan aja, ya!'"
        ar_eg: "قلتله: «يا أسطى، على مهلك!»"
        ar: "قلت: «يا سيدي، على مهلك!»"
        en: "I said: 'Slowly, please, sir!'"
        note:
          ar_eg: "كلمات: aja = بس، وخلاص."
          ar: "مفردات: aja = فقط."
          en: "Words: aja = just, only."
      - {speaker: Kak Tiara, text: "Akhirnya, kita sampai di Bedugul jam sebelas.", ar_eg: "وفي الآخر، وصلنا بيدوجول الساعة حداشر.", ar: "وأخيرًا، وصلنا إلى بيدوغول في الساعة الحادية عشرة.", en: "Finally, we arrived in Bedugul at eleven."}
      - {speaker: Kak Reza, text: "Bayarnya di aplikasi. Terus kita kasih bintang lima, dong!", ar_eg: "دفعنا من الأبلكيشن. وبعدين اديناله خمس نجوم.", ar: "دفعنا عبر التطبيق، ثم أعطيناه خمس نجوم.", en: "We paid in the app. Then we gave five stars."}
      - {speaker: Kak Tiara, text: "Sekarang jalan-jalan di pinggir danau, yuk!", ar_eg: "دلوقتي هنتمشى على شط البحيرة. يلا!", ar: "الآن نتنزه على ضفة البحيرة. هيا!", en: "Now we're strolling by the lake. Come on!"}
  - kind: word_spotlight
    title: Pertama, lalu, akhirnya
    lines:
      - {speaker: Kak Tiara, text: "Pertama, lalu, setelah itu, akhirnya. Pertama kami pesan ojek, akhirnya kami sampai.", ar_eg: "الأول، وبعدين، بعد كده، وفي الآخر. الأول طلبنا موتوسيكل، وفي الآخر وصلنا.", ar: "أولًا، ثم، بعد ذلك، وأخيرًا. أولًا طلبنا دراجة، وأخيرًا وصلنا.", en: "First, then, after that, finally. First we ordered an ojek, finally we arrived."}
      - {speaker: Kak Reza, text: "Ketika. Ketika saya di jalan, hujan turun.", ar_eg: "لما. لما كنت في الطريق، المطر نزل.", ar: "حين. حين كنت في الطريق، نزل المطر.", en: "When. When I was on the road, it rained."}
      - speaker: Kak Tiara
        text: "Sambil. Saya minum kopi sambil menunggu."
        ar_eg: "وهو بيعمل. أنا بشرب قهوة وأنا مستنية."
        ar: "في أثناء. أشرب القهوة وأنا أنتظر."
        en: "While. I drink coffee while waiting."
        note:
          ar_eg: "sambil لما نفس الشخص بيعمل حاجتين في نفس الوقت."
          ar: "sambil حين يفعل الشخص نفسه شيئين في وقت واحد."
          en: "Sambil is for one person doing two things at once."
      - speaker: Kak Reza
        text: "Di jalan: Ngopi sambil nunggu, yuk!"
        ar_eg: "في الشارع: يلا نشرب قهوة وإحنا مستنيين!"
        ar: "في الشارع: هيا نشرب القهوة ونحن ننتظر!"
        en: "On the street: Let's grab a coffee while we wait!"
      - speaker: Kak Reza
        text: "Jalan-jalan, pelan-pelan, naik turun. Jalan-jalan bukan banyak jalan, ya!"
        ar_eg: "يتفسّح، على مهله، طالع نازل. jalan-jalan مش «طرق كتير»!"
        ar: "يتنزه، على مهل، صاعد هابط. jalan-jalan ليست «طرقًا كثيرة»!"
        en: "Stroll, slowly, up and down. Jalan-jalan doesn't mean many roads!"
        note:
          ar_eg: "التكرار مش دايمًا جمع: jalan-jalan = يتفسح، pelan-pelan = على مهلك."
          ar: "التكرار ليس دائمًا للجمع: jalan-jalan = يتنزه، وpelan-pelan = على مهل."
          en: "Doubling isn't always plural: jalan-jalan = to stroll, pelan-pelan = slowly."
      - {speaker: Kak Tiara, text: "Ojek, angkot, bus, tiket. Angkot itu mobil kecil untuk banyak orang.", ar_eg: "موتوسيكل أجرة، ميكروباص، أتوبيس، تذكرة. الـangkot عربية صغيرة لناس كتير.", ar: "دراجة أجرة، حافلة صغيرة، حافلة، تذكرة. الـangkot سيارة صغيرة لركاب كثيرين.", en: "Ojek, angkot, bus, ticket. An angkot is a small van for many passengers."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Reza
        text: "Pertama, kami memesan ojek."
        ar_eg: "الأول، طلبنا موتوسيكل أجرة."
        ar: "أولًا، طلبنا دراجة أجرة."
        en: "First, we ordered an ojek."
        note:
          ar_eg: "بالراحة. كرر ورانا كل جملة."
          ar: "ببطء. ردّد كل جملة بعدنا."
          en: "Slowly. Repeat each sentence after us."
      - {speaker: Kak Tiara, text: "Pertama, kami memesan ojek.", ar_eg: "الأول، طلبنا موتوسيكل أجرة.", ar: "أولًا، طلبنا دراجة أجرة.", en: "First, we ordered an ojek."}
      - {speaker: Kak Reza, text: "Ketika kami di jalan, hujan turun.", ar_eg: "وإحنا في الطريق، المطر نزل.", ar: "حين كنا في الطريق، نزل المطر.", en: "When we were on the road, it rained."}
      - {speaker: Kak Tiara, text: "Ketika kami di jalan, hujan turun.", ar_eg: "وإحنا في الطريق، المطر نزل.", ar: "حين كنا في الطريق، نزل المطر.", en: "When we were on the road, it rained."}
      - {speaker: Kak Reza, text: "Kami minum kopi sambil menunggu.", ar_eg: "شربنا قهوة وإحنا مستنيين.", ar: "شربنا القهوة ونحن ننتظر.", en: "We drank coffee while we waited."}
      - {speaker: Kak Tiara, text: "Kami minum kopi sambil menunggu.", ar_eg: "شربنا قهوة وإحنا مستنيين.", ar: "شربنا القهوة ونحن ننتظر.", en: "We drank coffee while we waited."}
      - {speaker: Kak Reza, text: "Pak, pelan-pelan aja, ya!", ar_eg: "يا أسطى، على مهلك!", ar: "يا سيدي، على مهلك!", en: "Slowly, please, sir!"}
      - {speaker: Kak Tiara, text: "Pak, pelan-pelan aja, ya!", ar_eg: "يا أسطى، على مهلك!", ar: "يا سيدي، على مهلك!", en: "Slowly, please, sir!"}
      - {speaker: Kak Reza, text: "Akhirnya, kami sampai di Bedugul.", ar_eg: "وفي الآخر، وصلنا بيدوجول.", ar: "وأخيرًا، وصلنا إلى بيدوغول.", en: "Finally, we arrived in Bedugul."}
      - {speaker: Kak Tiara, text: "Akhirnya, kami sampai di Bedugul.", ar_eg: "وفي الآخر، وصلنا بيدوجول.", ar: "وأخيرًا، وصلنا إلى بيدوغول.", en: "Finally, we arrived in Bedugul."}
  - kind: outro
    title: Perjalanan Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ceritakan perjalananmu ke kantor pagi ini. Pertama, lalu, akhirnya."
        ar_eg: "يا محمد، احكي مشوارك للشغل الصبح ده. الأول، وبعدين، وفي الآخر."
        ar: "يا محمد، احكِ رحلتك إلى العمل هذا الصباح. أولًا، ثم، أخيرًا."
        en: "Mohamed, tell us your trip to work this morning. First, then, finally."
        note:
          ar_eg: "دورك! جاوب بصوت عالي بتلات جمل."
          ar: "دورك! أجب بصوت مسموع بثلاث جمل."
          en: "Your turn! Answer out loud in three sentences."
      - {speaker: Kak Reza, text: "Contohnya: Pertama, saya naik metro. Lalu saya jalan kaki sambil mendengarkan Kabar Radio. Akhirnya saya sampai di kantor.", ar_eg: "مثلًا: الأول ركبت المترو. وبعدين مشيت وأنا بسمع كبار راديو. وفي الآخر وصلت الشغل.", ar: "مثلًا: أولًا ركبت المترو. ثم مشيت وأنا أستمع إلى كبار راديو. وأخيرًا وصلت إلى العمل.", en: "For example: First, I took the metro. Then I walked while listening to Kabar Radio. Finally I got to work."}
      - {speaker: Kak Tiara, text: "Bagus banget! Besok, coba tulis pesan buat sopir ojek pakai gaya chat.", ar_eg: "حلو أوي! بكرة اكتب رسالة لسواق الموتوسيكل بأسلوب الشات.", ar: "ممتاز! غدًا اكتب رسالة لسائق الدراجة بأسلوب المحادثة.", en: "Very good! Tomorrow, write a message to an ojek driver in chat style."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Hati-hati di jalan, ya!", ar_eg: "شكرًا يا محمد. خلي بالك من نفسك في الطريق!", ar: "شكرًا يا محمد. انتبه في الطريق!", en: "Thank you, Mohamed. Take care on the road!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [ojek, angkot, aplikasi, pertama, lalu, akhirnya, ketika, sambil, jalan-jalan, pelan-pelan, sampai]
