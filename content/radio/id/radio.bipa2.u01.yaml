id: radio.bipa2.u01
language: id
level: bipa2
unit: bipa2.u01
title:
  target: Gamelan di Ubud
  ar_eg: الجاميلان في أوبود
  ar: الغاميلان في أوبود
  en: Gamelan in Ubud
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Malam di Ubud
    lines:
      - speaker: Kak Tiara
        text: Halo, selamat malam! Selamat datang di Kabar Radio! Saya Tiara.
        ar_eg: أهلًا، مساء الخير! أهلًا بيك في كبار راديو! أنا تيارا.
        ar: مرحبًا، مساء الخير! أهلًا بك في كبار راديو! أنا تيارا.
        en: Hello, good evening! Welcome to Kabar Radio! I'm Tiara.
      - speaker: Kak Reza
        text: Dan saya Reza. Selamat malam, Kak Tiara! Malam ini kita tidak di Jakarta.
        ar_eg: وأنا رضا. مساء الخير يا تيارا! الليلة دي إحنا مش في جاكرتا.
        ar: وأنا رضا. مساء الخير يا تيارا! الليلة لسنا في جاكرتا.
        en: And I'm Reza. Good evening, Tiara! Tonight we're not in Jakarta.
      - speaker: Kak Tiara
        text: Betul! Malam ini kita di Bali, di Ubud. Selamat datang di Bali!
        ar_eg: صح! الليلة إحنا في بالي، في أوبود. أهلًا بيكم في بالي!
        ar: صحيح! الليلة نحن في بالي، في أوبود. أهلًا بكم في بالي!
        en: Right! Tonight we're in Bali, in Ubud. Welcome to Bali!
        note:
          ar_eg: بداية مستوى BIPA 2 - الرحلة نقلت بالي. أوبود مدينة فنون في قلب الجزيرة.
          ar: بداية المستوى BIPA 2 - انتقلت الرحلة إلى بالي. أوبود مدينة الفنون في قلب الجزيرة.
          en: The start of BIPA 2 - the journey moves to Bali. Ubud is the island's arts town, in the hills.
      - speaker: Kak Reza
        text: Mbak, Mbak mendengar? Itu suara gamelan. Indah sekali!
        ar_eg: سامعة؟ ده صوت الجاميلان. جميل أوي!
        ar: هل تسمعين؟ هذا صوت الغاميلان. جميل جدًا!
        en: Can you hear it? That's the sound of gamelan. Very beautiful!
      - speaker: Kak Tiara
        text: Ya. Di Ubud ada gamelan setiap malam. Gamelan Bali terkenal di dunia.
        ar_eg: أيوه. في أوبود فيه جاميلان كل ليلة. جاميلان بالي مشهور في الدنيا كلها.
        ar: نعم. في أوبود غاميلان كل ليلة. غاميلان بالي مشهور في العالم.
        en: Yes. In Ubud there's gamelan every night. Balinese gamelan is famous around the world.
        note:
          ar_eg: الجاميلان فرقة من آلات نحاس وجونجات. في بالي سريع وبيلمع، وفي جاوة بطيء وهادي.
          ar: الغاميلان فرقة من آلات نحاسية وصنوج. في بالي سريع لامع، وفي جاوة بطيء تأمّلي.
          en: Gamelan is an ensemble of bronze metallophones and gongs - fast and shimmering in Bali, slow and meditative in Java.
      - speaker: Kak Reza
        text: Lebih besar, lebih kecil. Paling indah, terbaik. Agak, cukup, terlalu.
        ar_eg: أكبر، أصغر. الأجمل، الأحسن. شوية، كفاية، زيادة عن اللزوم.
        ar: أكبر، أصغر. الأجمل، الأفضل. قليلًا، إلى حدٍّ ما، أكثر من اللازم.
        en: Bigger, smaller. The most beautiful, the best. A bit, quite, too.
        note:
          ar_eg: موضوع النهارده - المقارنة بـ lebih وpaling وter-، وكلمات الدرجة agak وcukup وterlalu.
          ar: موضوع اليوم - المقارنة بـ lebih وpaling وter-، وكلمات الدرجة agak وcukup وterlalu.
          en: Today's topic - comparing with lebih, paling and ter-, and the degree words agak, cukup and terlalu.
      - speaker: Kak Tiara
        text: Halo, Mohamed! Selamat datang di Ubud! Kamu suka musik?
        ar_eg: أهلًا يا محمد! أهلًا بيك في أوبود! بتحب المزيكا؟
        ar: مرحبًا يا محمد! أهلًا بك في أوبود! هل تحب الموسيقى؟
        en: Hello, Mohamed! Welcome to Ubud! Do you like music?
  - kind: dialogue
    title: Di toko alat musik
    lines:
      - speaker: Kak Reza
        text: Kak Tiara, ini alat musik apa?
        ar_eg: يا تيارا، دي آلة موسيقية إيه؟
        ar: يا تيارا، ما هذه الآلة الموسيقية؟
        en: Tiara, what instrument is this?
      - speaker: Kak Tiara
        text: Itu gendang. Suaranya lebih keras daripada suling.
        ar_eg: دي طبلة. صوتها أعلى من الناي.
        ar: هذه طبلة. صوتها أعلى من صوت الناي.
        en: That's a drum. Its sound is louder than the flute.
      - speaker: Kak Reza
        text: Dan itu? Yang besar sekali?
        ar_eg: وده؟ اللي كبير أوي ده؟
        ar: وذاك؟ الكبير جدًا؟
        en: And that? The really big one?
      - speaker: Kak Tiara
        text: Itu gong. Gong adalah alat musik paling besar dalam gamelan. Suaranya paling keras.
        ar_eg: ده الجونج. الجونج أكبر آلة في الجاميلان. وصوته أعلى صوت.
        ar: هذا الصنج الكبير. الغونغ أكبر آلة في الغاميلان. وصوته الأعلى.
        en: That's a gong. The gong is the biggest instrument in the gamelan. Its sound is the loudest.
      - speaker: Kak Reza
        text: Mana yang lebih berat, gendang atau suling?
        ar_eg: أنهي أتقل، الطبلة ولا الناي؟
        ar: أيّهما أثقل، الطبلة أم الناي؟
        en: Which is heavier, the drum or the flute?
      - speaker: Kak Tiara
        text: Gendang. Suling lebih kecil dan lebih ringan.
        ar_eg: الطبلة. الناي أصغر وأخف.
        ar: الطبلة. الناي أصغر وأخف.
        en: The drum. The flute is smaller and lighter.
      - speaker: Kak Reza
        text: Kalau begitu, lebih baik saya belajar suling dulu.
        ar_eg: يبقى أحسن أتعلم الناي الأول.
        ar: إذن، من الأفضل أن أتعلم الناي أولًا.
        en: In that case, I'd better learn the flute first.
      - speaker: Kak Tiara
        text: Bagus! Suling juga lebih murah. Sekarang kita beli suling di toko, ya.
        ar_eg: حلو! الناي كمان أرخص. يلا نشتري ناي من المحل.
        ar: جيد! والناي أرخص أيضًا. لنشترِ نايًا من المتجر.
        en: Great! The flute is cheaper too. Let's buy a flute at the shop.
        note:
          ar_eg: مشهد تمثيلي - تيارا بياعة في محل آلات موسيقية، ورضا زبون.
          ar: مشهد تمثيلي - تيارا بائعة في متجر آلات موسيقية، ورضا زبون.
          en: A role-play - Tiara works in a music shop, Reza is a customer.
      - speaker: Kak Tiara
        text: Selamat malam! Mau cari apa, Pak?
        ar_eg: مساء الخير! بتدور على إيه يا أستاذ؟
        ar: مساء الخير! عمّ تبحث يا سيدي؟
        en: Good evening! What are you looking for, sir?
      - speaker: Kak Reza
        text: Saya mau beli suling. Mana yang paling bagus?
        ar_eg: عايز أشتري ناي. أنهي واحد الأحسن؟
        ar: أريد شراء ناي. أيّها الأفضل؟
        en: I want to buy a flute. Which one is the best?
      - speaker: Kak Tiara
        text: Yang ini terbaik, Pak. Bambunya kuat dan suaranya indah.
        ar_eg: ده الأحسن يا أستاذ. البامبو بتاعه قوي وصوته جميل.
        ar: هذا الأفضل يا سيدي. خيزرانه قوي وصوته جميل.
        en: This one is the best, sir. The bamboo is strong and the sound is beautiful.
      - speaker: Kak Reza
        text: Berapa harganya?
        ar_eg: بكام؟
        ar: كم سعره؟
        en: How much is it?
      - speaker: Kak Tiara
        text: Tiga ratus ribu, Pak.
        ar_eg: تلتمية ألف يا أستاذ.
        ar: ثلاثمئة ألف يا سيدي.
        en: Three hundred thousand, sir.
      - speaker: Kak Reza
        text: Wah, terlalu mahal untuk saya. Ada yang lebih murah?
        ar_eg: يا خبر، ده غالي أوي عليّا. فيه أرخص؟
        ar: يا للهول، هذا غالٍ جدًا بالنسبة لي. هل يوجد أرخص؟
        en: Oh, that's too expensive for me. Is there a cheaper one?
      - speaker: Kak Tiara
        text: Ada. Yang ini seratus lima puluh ribu. Agak kecil, tapi suaranya lumayan.
        ar_eg: فيه. ده بمية وخمسين ألف. صغير شوية، بس صوته مش بطال.
        ar: يوجد. هذا بمئة وخمسين ألفًا. صغير قليلًا، لكن صوته لا بأس به.
        en: Yes. This one is a hundred and fifty thousand. A bit small, but the sound isn't bad.
      - speaker: Kak Reza
        text: Boleh saya coba? Hmm, suaranya cukup bagus. Dan yang kecil lebih ringan.
        ar_eg: ممكن أجرب؟ امم، صوته حلو كفاية. والصغير أخف.
        ar: هل لي أن أجرّب؟ همم، صوته جيد إلى حدٍّ ما. والصغير أخف.
        en: May I try? Hmm, the sound is quite good. And the small one is lighter.
      - speaker: Kak Tiara
        text: Betul, Pak. Suling kecil lebih baik untuk belajar.
        ar_eg: صح يا أستاذ. الناي الصغير أحسن للتعليم.
        ar: صحيح يا سيدي. الناي الصغير أفضل للتعلّم.
        en: Right, sir. A small flute is better for learning.
      - speaker: Kak Reza
        text: Saya beli yang ini saja.
        ar_eg: هاخد ده.
        ar: سآخذ هذا.
        en: I'll just take this one.
      - speaker: Kak Tiara
        text: Pilihan yang bagus! Terima kasih, Pak.
        ar_eg: اختيار حلو! شكرًا يا أستاذ.
        ar: اختيار جيد! شكرًا يا سيدي.
        en: Good choice! Thank you, sir.
      - speaker: Kak Reza
        text: Mbak, bagaimana suara suling saya?
        ar_eg: صوت الناي بتاعي عامل إزاي؟
        ar: كيف صوت نايي؟
        en: Tiara, how does my flute sound?
        note:
          ar_eg: خلص التمثيل - رضا بيجرب الناي بتاعه الجديد.
          ar: انتهى التمثيل - رضا يجرّب نايه الجديد.
          en: The role-play is over - Reza tries his new flute.
      - speaker: Kak Tiara
        text: Lumayan! Tapi agak pelan.
        ar_eg: مش بطال! بس واطي شوية.
        ar: لا بأس! لكنه خافت قليلًا.
        en: Not bad! But a bit quiet.
      - speaker: Kak Reza
        text: Kalau sekarang?
        ar_eg: وكده؟
        ar: والآن؟
        en: And now?
      - speaker: Kak Tiara
        text: Wah, sekarang terlalu keras, Mas!
        ar_eg: يا خبر، دلوقتي عالي أوي يا رضا!
        ar: الآن عالٍ أكثر من اللازم يا رضا!
        en: Whoa, now it's too loud, Reza!
      - speaker: Kak Reza
        text: Maaf, Mbak! Saya masih belajar. Suara suling saya kurang bagus!
        ar_eg: آسف! أنا لسه بتعلم. صوت الناي بتاعي لسه مش حلو كفاية!
        ar: عذرًا! ما زلت أتعلّم. صوت نايي ليس جيدًا بما يكفي بعد!
        en: Sorry! I'm still learning. My flute doesn't sound good enough yet!
      - speaker: Kak Tiara
        text: Tidak apa-apa, Mas. Besok kita belajar suling dengan Ni Luh. Dia suka menari, tapi dia juga bisa main suling.
        ar_eg: ولا يهمك. بكرة نتعلم الناي مع ني لوه. هي بتحب الرقص، بس كمان بتعرف تعزف ناي.
        ar: لا بأس. غدًا نتعلّم الناي مع ني لوه. إنها تحب الرقص، لكنها تعزف الناي أيضًا.
        en: That's OK. Tomorrow we'll learn the flute with Ni Luh. She loves dancing, but she can play the flute too.
  - kind: word_spotlight
    title: Lebih, paling, terlalu
    lines:
      - speaker: Kak Tiara
        text: Lebih. Gong lebih besar daripada gendang. Suling lebih murah daripada gitar.
        ar_eg: أكتر. الجونج أكبر من الطبلة. الناي أرخص من الجيتار.
        ar: أكثر. الغونغ أكبر من الطبلة. الناي أرخص من الغيتار.
        en: More. The gong is bigger than the drum. The flute is cheaper than the guitar.
        note:
          ar_eg: lebih قبل الصفة زي «أفعل» في العربي، وdaripada (أو dari) زي «من».
          ar: lebih قبل الصفة تقابل «أفعل» العربية، وdaripada (أو dari) تقابل «من».
          en: lebih before an adjective makes the "-er" form, and daripada (or dari) means "than".
      - speaker: Kak Reza
        text: Kurang. Kopinya kurang manis. Gitar ini kurang bagus.
        ar_eg: أقل، مش كفاية. القهوة مش مسكّرة كفاية. الجيتار ده مش حلو كفاية.
        ar: أقل، غير كافٍ. القهوة ليست حلوة بما يكفي. هذا الغيتار ليس جيدًا بما يكفي.
        en: Less, not enough. The coffee isn't sweet enough. This guitar isn't good enough.
      - speaker: Kak Tiara
        text: Mana yang lebih murah, ini atau itu? Lebih baik kita naik taksi.
        ar_eg: أنهي أرخص، ده ولا ده؟ أحسن نركب تاكسي.
        ar: أيّهما أرخص، هذا أم ذاك؟ من الأفضل أن نركب سيارة أجرة.
        en: Which is cheaper, this or that? We'd better take a taxi.
      - speaker: Kak Reza
        text: Paling. Mana yang paling enak? Pura ini paling indah di Ubud.
        ar_eg: الأكتر. أنهي الأحلى؟ المعبد ده الأجمل في أوبود.
        ar: الأكثر. أيّها الألذّ؟ هذا المعبد الأجمل في أوبود.
        en: Most. Which is the tastiest? This temple is the most beautiful in Ubud.
      - speaker: Kak Tiara
        text: Terbaik, termurah, terbesar. Ini restoran terbaik di Ubud.
        ar_eg: الأحسن، الأرخص، الأكبر. ده أحسن مطعم في أوبود.
        ar: الأفضل، الأرخص، الأكبر. هذا أفضل مطعم في أوبود.
        en: The best, the cheapest, the biggest. This is the best restaurant in Ubud.
        note:
          ar_eg: ter- زي paling بالظبط - terbaik = paling baik. بس خلي بالك، terlambat مش «الأبطأ»!
          ar: ter- مثل paling تمامًا - terbaik = paling baik. لكن انتبه، terlambat لا تعني «الأبطأ»!
          en: ter- works like paling - terbaik = paling baik. But careful, terlambat doesn't mean "slowest"!
      - speaker: Kak Reza
        text: Dunia. Dunia. Gamelan Bali terkenal di dunia.
        ar_eg: الدنيا. الدنيا. جاميلان بالي مشهور في الدنيا.
        ar: العالم. العالم. غاميلان بالي مشهور في العالم.
        en: World. World. Balinese gamelan is famous around the world.
        note:
          ar_eg: الجسر العربي - dunia من «دنيا»، وalat من «آلة»، وkuat من «قوي».
          ar: الجسر العربي - dunia من «دنيا»، وalat من «آلة»، وkuat من «قوي».
          en: Arabic Bridge - dunia comes from «دنيا», alat from «آلة», and kuat from «قوي».
      - speaker: Kak Tiara
        text: Alat musik. Kuat. Bambunya kuat.
        ar_eg: آلة موسيقية. قوي. البامبو قوي.
        ar: آلة موسيقية. قوي. الخيزران قوي.
        en: Musical instrument. Strong. The bamboo is strong.
      - speaker: Kak Reza
        text: Agak, cukup, terlalu. Rumah Ni Luh agak jauh. Gamelan ini cukup mahal, tapi bagus.
        ar_eg: شوية، كفاية، زيادة. بيت ني لوه بعيد شوية. الجاميلان ده غالي نوعًا، بس حلو.
        ar: قليلًا، إلى حدٍّ ما، أكثر من اللازم. بيت ني لوه بعيد قليلًا. هذا الغاميلان غالٍ إلى حدٍّ ما، لكنه جيد.
        en: A bit, quite, too. Ni Luh's house is a bit far. This gamelan is quite expensive, but good.
      - speaker: Kak Tiara
        text: Terlalu. Suaranya terlalu keras. Terlalu mahal untuk saya.
        ar_eg: زيادة عن اللزوم. الصوت عالي زيادة. غالي أوي عليّا.
        ar: أكثر من اللازم. الصوت عالٍ أكثر من اللازم. غالٍ جدًا بالنسبة لي.
        en: Too. The sound is too loud. Too expensive for me.
        note:
          ar_eg: terlalu فيها شكوى (زيادة عن اللزوم)، وsekali فيها مدح (أوي).
          ar: terlalu فيها شكوى (أكثر من اللازم)، وsekali فيها مدح (جدًا).
          en: terlalu is a complaint (too much), sekali is praise (very).
      - speaker: Kak Reza
        text: Lumayan. Bagaimana suaranya? Lumayan!
        ar_eg: مش بطال. الصوت عامل إزاي؟ مش بطال!
        ar: لا بأس به. كيف الصوت؟ لا بأس به!
        en: Not bad. How does it sound? Not bad!
  - kind: recap
    title: Paling keras!
    lines:
      - speaker: Kak Tiara
        text: Suara gendang lebih keras daripada suara suling.
        ar_eg: صوت الطبلة أعلى من صوت الناي.
        ar: صوت الطبلة أعلى من صوت الناي.
        en: The drum's sound is louder than the flute's.
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
          ar: ببطء. ردّد كل جملة بعدنا.
          en: Slowly. Repeat each sentence after us.
      - speaker: Kak Reza
        text: Suara gendang lebih keras daripada suara suling.
        ar_eg: صوت الطبلة أعلى من صوت الناي.
        ar: صوت الطبلة أعلى من صوت الناي.
        en: The drum's sound is louder than the flute's.
      - speaker: Kak Tiara
        text: Suling lebih kecil dan lebih ringan.
        ar_eg: الناي أصغر وأخف.
        ar: الناي أصغر وأخف.
        en: The flute is smaller and lighter.
      - speaker: Kak Reza
        text: Suling lebih kecil dan lebih ringan.
        ar_eg: الناي أصغر وأخف.
        ar: الناي أصغر وأخف.
        en: The flute is smaller and lighter.
      - speaker: Kak Tiara
        text: Gong adalah alat musik paling besar dalam gamelan.
        ar_eg: الجونج أكبر آلة في الجاميلان.
        ar: الغونغ أكبر آلة موسيقية في الغاميلان.
        en: The gong is the biggest instrument in the gamelan.
      - speaker: Kak Reza
        text: Gong adalah alat musik paling besar dalam gamelan.
        ar_eg: الجونج أكبر آلة في الجاميلان.
        ar: الغونغ أكبر آلة موسيقية في الغاميلان.
        en: The gong is the biggest instrument in the gamelan.
      - speaker: Kak Tiara
        text: Mana yang paling bagus? Yang ini terbaik.
        ar_eg: أنهي الأحسن؟ ده الأحسن.
        ar: أيّها الأفضل؟ هذا الأفضل.
        en: Which is the best? This one is the best.
      - speaker: Kak Reza
        text: Mana yang paling bagus? Yang ini terbaik.
        ar_eg: أنهي الأحسن؟ ده الأحسن.
        ar: أيّها الأفضل؟ هذا الأفضل.
        en: Which is the best? This one is the best.
      - speaker: Kak Tiara
        text: Terlalu mahal untuk saya. Ada yang lebih murah?
        ar_eg: غالي أوي عليّا. فيه أرخص؟
        ar: غالٍ جدًا بالنسبة لي. هل يوجد أرخص؟
        en: Too expensive for me. Is there a cheaper one?
      - speaker: Kak Reza
        text: Terlalu mahal untuk saya. Ada yang lebih murah?
        ar_eg: غالي أوي عليّا. فيه أرخص؟
        ar: غالٍ جدًا بالنسبة لي. هل يوجد أرخص؟
        en: Too expensive for me. Is there a cheaper one?
      - speaker: Kak Tiara
        text: Agak kecil, tapi suaranya lumayan.
        ar_eg: صغير شوية، بس صوته مش بطال.
        ar: صغير قليلًا، لكن صوته لا بأس به.
        en: A bit small, but the sound isn't bad.
      - speaker: Kak Reza
        text: Agak kecil, tapi suaranya lumayan.
        ar_eg: صغير شوية، بس صوته مش بطال.
