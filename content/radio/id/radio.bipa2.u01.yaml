    lines:
      - speaker: Kak Tiara
        text: Mohamed, mana yang lebih kamu suka, musik Mesir atau gamelan Bali?
        ar_eg: يا محمد، بتحب إيه أكتر، المزيكا المصري ولا جاميلان بالي؟
        ar: يا محمد، أيّهما تحب أكثر، الموسيقى المصرية أم غاميلان بالي؟
        en: Mohamed, which do you like more, Egyptian music or Balinese gamelan?
        note:
          ar_eg: دورك! جاوب بصوت عالي بجملة أو اتنين.
          ar: دورك! أجب بصوت مسموع بجملة أو جملتين.
          en: Your turn! Answer out loud in a sentence or two.
      - speaker: Kak Reza
        text: Saya lebih suka musik Mesir. Tapi gamelan Bali juga indah sekali. Gamelan lebih cepat!
        ar_eg: بحب المزيكا المصري أكتر. بس جاميلان بالي كمان جميل أوي. الجاميلان أسرع!
        ar: أحب الموسيقى المصرية أكثر. لكن غاميلان بالي جميل جدًا أيضًا. الغاميلان أسرع!
        en: I prefer Egyptian music. But Balinese gamelan is very beautiful too. Gamelan is faster!
      - speaker: Kak Tiara
        text: Bagus sekali, Mohamed! Musik Mesir juga terkenal di dunia.
        ar_eg: برافو عليك يا محمد! والمزيكا المصري كمان مشهورة في الدنيا.
        ar: أحسنت جدًا يا محمد! والموسيقى المصرية مشهورة في العالم أيضًا.
        en: Very good, Mohamed! Egyptian music is famous around the world too.
      - speaker: Kak Reza
        text: Besok, coba lihat meja dan kursi di rumah. Mana yang lebih besar? Mana yang paling mahal di rumah?
        ar_eg: بكرة بص على الترابيزة والكرسي في البيت. أنهي أكبر؟ وأنهي أغلى حاجة في البيت؟
        ar: غدًا انظر إلى الطاولة والكرسي في البيت. أيّهما أكبر؟ وما الأغلى في البيت؟
        en: Tomorrow, look at the table and chair at home. Which is bigger? What's the most expensive thing at home?
        note:
          ar_eg: تحدي بكرة الصغير - قارن حاجتين في البيت بـ lebih … daripada، وقول أحسن حاجة بـ paling.
          ar: تحدّي الغد الصغير - قارن بين شيئين في البيت بـ lebih … daripada، واذكر الأفضل بـ paling.
          en: Tomorrow's tiny challenge - compare two things at home with "lebih … daripada", and name the best with paling.
      - speaker: Kak Tiara
        text: Terima kasih, Kak Reza. Suling Mas lumayan, tapi terlalu keras!
