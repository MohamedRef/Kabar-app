schema: kabar.radio/v1
id: radio.bipa5.u01
language: id
level: bipa5
unit: bipa5.u01
title:
  target: Selamat datang di dunia kerja
  ar_eg: أهلًا بيك في دنيا الشغل
  ar: مرحبًا بك في عالم العمل
  en: Welcome to the world of work
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Pagi di Balikpapan
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Balikpapan, Kalimantan Timur! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من باليكبابان، شرق كاليمانتان! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من باليكبابان، شرق كاليمانتان! هذا كبار راديو. أنا تيارا.", en: "Good morning from Balikpapan, East Kalimantan! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Kita udah sampai di pulau baru, terus Mohamed juga dapat kerjaan baru, lho!", ar_eg: "أنا رضا. وصلنا جزيرة جديدة، ومحمد كمان عنده شغل جديد!", ar: "أنا رضا. وصلنا إلى جزيرة جديدة، ولمحمد أيضًا عمل جديد!", en: "I'm Reza. We've reached a new island, and Mohamed has a new job too!"}
      - {speaker: Kak Tiara, text: "Iya. Mohamed ngelamar jadi penerjemah di perusahaan di kota ini.", ar_eg: "مظبوط. محمد قدّم على شغلانة مترجم في شركة في المدينة دي.", ar: "صحيح. تقدّم محمد لوظيفة مترجم في شركة بهذه المدينة.", en: "Right. Mohamed has applied to be a translator at a company in this city."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar bahasa wawancara kerja, ragam resmi sama santai, terus budaya kantor."
        ar_eg: "النهارده هنتعلم لغة مقابلة الشغل، والكلام الرسمي واللي مش رسمي، وثقافة المكتب."
        ar: "اليوم نتعلم لغة مقابلة العمل، والأسلوب الرسمي وغير الرسمي، وثقافة المكتب."
        en: "Today we learn job-interview language, formal and informal register, and office culture."
        note:
          ar_eg: "كلمات: ragam = نوع من اللغة؛ resmi = رسمي؛ santai = رايق؛ budaya = ثقافة."
          ar: "مفردات: ragam = ضرب من اللغة؛ resmi = رسمي؛ santai = مسترخٍ؛ budaya = ثقافة."
          en: "Words: ragam = variety, register; resmi = official, formal; santai = relaxed, casual; budaya = culture."
      - {speaker: Kak Tiara, text: "Mohamed, kamu suka deg-degan nggak sebelum wawancara?", ar_eg: "يا محمد، بتتوتر قبل الإنترفيو؟", ar: "يا محمد، هل تتوتر قبل المقابلة؟", en: "Mohamed, do you get nervous before an interview?", note: {ar_eg: "deg-degan = قلبك بيدق من التوتر.", ar: "deg-degan = خفقان القلب من التوتر.", en: "deg-degan = heart pounding with nerves."}}
  - kind: dialogue
    title: Wawancara dengan Bu Lestari
    lines:
      - speaker: Kak Tiara
        text: "Kita dengarkan latihan wawancara. Saya jadi Bu Lestari, kepala bagian personalia. Kak Reza jadi pelamar."
        ar_eg: "يلا نسمع تمرين مقابلة. أنا هبقى بو ليستاري، رئيسة شؤون الموظفين. ورضا هيبقى المتقدّم."
        ar: "لنستمع إلى تمرين مقابلة. أنا بو ليستاري، رئيسة قسم شؤون الموظفين، ورضا هو المتقدّم."
        en: "Let's hear a practice interview. I'll be Bu Lestari, head of HR. Reza is the applicant."
        note:
          ar_eg: "في الشغل بيقولوا Bapak وIbu للمديرين، ومش بيندهوا بالاسم بس أبدًا. كلمات: pelamar = متقدم؛ bagian = جزء."
          ar: "في العمل يُخاطَب الرؤساء بـBapak وIbu، ولا يُنادون بأسمائهم مجردة. مفردات: pelamar = متقدّم؛ bagian = جزء."
          en: "At work, superiors are Bapak and Ibu, never just a first name. Words: pelamar = applicant; bagian = part."
      - speaker: Kak Tiara
        text: "Selamat pagi, silakan duduk. Silakan perkenalkan diri Anda."
        ar_eg: "صباح الخير، اتفضل اقعد. اتفضل عرّفنا بنفسك."
        ar: "صباح الخير، تفضل بالجلوس. عرّفنا بنفسك من فضلك."
        en: "Good morning, please sit down. Please introduce yourself."
        note:
          ar_eg: "كلمات: perkenalkan = أعرّفك بـ، اسمحلي أقدّم."
          ar: "مفردات: perkenalkan = أقدّم، أعرّف."
          en: "Words: perkenalkan = let me introduce."
      - {speaker: Kak Reza, text: "Terima kasih, Bu. Nama saya Reza. Saya lulusan sastra Inggris dan sudah tiga tahun bekerja sebagai penerjemah.", ar_eg: "شكرًا يا فندم. اسمي رضا. أنا خريج أدب إنجليزي وبقالي تلات سنين شغال مترجم.", ar: "شكرًا يا سيدتي. اسمي رضا. تخرجت في الأدب الإنجليزي وأعمل مترجمًا منذ ثلاث سنوات.", en: "Thank you, ma'am. My name is Reza. I graduated in English literature and have worked as a translator for three years."}
      - speaker: Kak Tiara
        text: "Mengapa Anda tertarik bekerja di perusahaan kami?"
        ar_eg: "ليه حابب تشتغل في شركتنا؟"
        ar: "لماذا ترغب في العمل في شركتنا؟"
        en: "Why are you interested in working at our company?"
        note:
          ar_eg: "كلمات: tertarik = مهتم، منجذب."
          ar: "مفردات: tertarik = مهتم، منجذب."
          en: "Words: tertarik = interested, attracted."
      - speaker: Kak Reza
        text: "Karena perusahaan Ibu bekerja sama dengan banyak mitra asing, sehingga keahlian saya bisa bermanfaat."
        ar_eg: "عشان شركة حضرتك بتتعامل مع شركا أجانب كتير، فخبرتي ممكن تفيد."
        ar: "لأن شركتكم تتعاون مع شركاء أجانب كثيرين، فتكون خبرتي مفيدة."
        en: "Because your company works with many foreign partners, so my skills could be useful."
        note:
          ar_eg: "كلمات: sehingga = فبالتالي؛ asing = أجنبي؛ bermanfaat = مفيد."
          ar: "مفردات: sehingga = بحيث؛ asing = أجنبي؛ bermanfaat = مفيد، نافع."
          en: "Words: sehingga = so that, resulting in; asing = foreign; bermanfaat = useful, beneficial."
      - {speaker: Kak Tiara, text: "Apa kelebihan dan kekurangan Anda?", ar_eg: "إيه نقط قوتك ونقط ضعفك؟", ar: "ما نقاط قوتك وضعفك؟", en: "What are your strengths and weaknesses?"}
      - {speaker: Kak Reza, text: "Kelebihan saya teliti. Kekurangan saya, kadang terlalu lama memeriksa ulang, tetapi saya sedang belajar mengatur waktu.", ar_eg: "ميزتي إني دقيق. وعيبي إني ساعات بطوّل في المراجعة، بس بتعلم أنظم وقتي.", ar: "ميزتي الدقة، وعيبي أنني أطيل المراجعة أحيانًا، لكنني أتعلم تنظيم وقتي.", en: "My strength is that I'm careful. My weakness: I sometimes take too long re-checking, but I'm learning to manage my time."}
      - {speaker: Kak Tiara, text: "Baik. Kapan Anda bisa mulai bekerja?", ar_eg: "تمام. تقدر تبدأ امتى؟", ar: "حسنًا. متى يمكنك البدء؟", en: "Good. When can you start?"}
      - {speaker: Kak Reza, text: "Saya bisa mulai awal bulan depan, Bu.", ar_eg: "أقدر أبدأ أول الشهر الجاي يا فندم.", ar: "يمكنني البدء مطلع الشهر القادم يا سيدتي.", en: "I can start at the beginning of next month, ma'am."}
      - speaker: Kak Tiara
        text: "Nah, beres! Sekarang dengerin bedanya. Di warung, Reza bilang: Aku udah kerja tiga tahun, lho."
        ar_eg: "خلاص، خلصنا! دلوقتي اسمع الفرق. في القهوة، رضا بيقول: أنا بقالي تلات سنين بشتغل، على فكرة."
        ar: "انتهينا! والآن اسمع الفرق. في المقهى يقول رضا: أنا بقالي ثلاث سنوات أشتغل، تعرف."
        en: "Done! Now hear the difference. At a food stall, Reza says: I've been working three years, you know."
        note:
          ar_eg: "كلمات: bedanya = الفرق؛ beres = خلصان، تمام؛ bilang = يقول."
          ar: "مفردات: bedanya = الفرق؛ beres = منتهٍ، مرتّب؛ bilang = يقول."
          en: "Words: bedanya = the difference; beres = done, sorted; bilang = to say."
      - {speaker: Kak Reza, text: "Tapi di wawancara: Saya sudah bekerja selama tiga tahun. Saya, bukan aku. Sudah, bukan udah.", ar_eg: "بس في الإنترفيو: Saya sudah bekerja selama tiga tahun. يعني saya مش aku، وsudah مش udah.", ar: "لكن في المقابلة: Saya sudah bekerja selama tiga tahun؛ أي saya لا aku، وsudah لا udah.", en: "But in the interview: Saya sudah bekerja selama tiga tahun. Saya, not aku. Sudah, not udah."}
  - kind: word_spotlight
    title: Ragam resmi
    lines:
      - speaker: Kak Tiara
        text: "Ragam resmi memakai Anda, saya, tidak, sudah, dan kalimat lengkap."
        ar_eg: "الأسلوب الرسمي بيستعمل Anda وsaya وtidak وsudah، وجمل كاملة."
        ar: "يستخدم الأسلوب الرسمي Anda وsaya وtidak وsudah وجملًا تامة."
        en: "Formal register uses Anda, saya, tidak, sudah, and full sentences."
        note:
          ar_eg: "زي الفرق عندنا بين «حضرتك» و«إنت»."
          ar: "كالفرق بين «حضرتك» و«أنت»."
          en: "Like the Egyptian difference between «حضرتك» and «إنت»."
      - {speaker: Kak Reza, text: "Ragam santai memakai aku, kamu, nggak, udah, dan banyak partikel seperti sih, deh, lho.", ar_eg: "الأسلوب العادي بيستعمل aku وkamu وnggak وudah، وكلمات صغيرة كتير زي sih وdeh وlho.", ar: "يستخدم الأسلوب الدارج aku وkamu وnggak وudah وأدوات كثيرة مثل sih وdeh وlho.", en: "Casual register uses aku, kamu, nggak, udah, and lots of particles like sih, deh, lho."}
      - {speaker: Kak Tiara, text: "Lowongan kerja, pelamar, surat lamaran, riwayat hidup, wawancara.", ar_eg: "وظيفة فاضية، متقدّم، جواب تقديم، سي في، مقابلة.", ar: "وظيفة شاغرة، متقدّم، خطاب تقديم، سيرة ذاتية، مقابلة.", en: "Job vacancy, applicant, application letter, CV, interview."}
      - {speaker: Kak Reza, text: "Atasan, bawahan, rekan kerja, gaji, tunjangan.", ar_eg: "المدير، المرؤوس، زميل الشغل، المرتب، البدلات.", ar: "الرئيس، المرؤوس، زميل العمل، الراتب، البدلات.", en: "Superior, subordinate, colleague, salary, allowance."}
      - speaker: Kak Tiara
        text: "Di kantor, sama teman: bos, temen kantor, gajian. Besok gajian, yuk makan-makan!"
        ar_eg: "في الشغل مع صحابك: bos وtemen kantor وgajian. بكرة القبض، يلا نتغدى برا!"
        ar: "في العمل مع الأصدقاء: bos وtemen kantor وgajian. غدًا يوم الراتب، هيا نأكل في الخارج!"
        en: "At work among friends: bos, temen kantor, gajian. Payday tomorrow, let's eat out!"
        note:
          ar_eg: "atasan ← bos، rekan kerja ← temen kantor، gajian = يوم القبض."
          ar: "atasan ← bos، rekan kerja ← temen kantor، gajian = يوم الراتب."
          en: "atasan → bos, rekan kerja → temen kantor, gajian = payday."
      - speaker: Kak Tiara
        text: "Kalimat majemuk bertingkat: Saya melamar karena saya ingin berkembang, sehingga saya siap bekerja keras."
        ar_eg: "جملة مركّبة: بقدّم عشان عايز أتطور، عشان كده مستعد أشتغل جامد."
        ar: "جملة مركّبة: أتقدّم لأنني أريد أن أتطور، لذلك أنا مستعد للعمل الجاد."
        en: "A complex sentence: I'm applying because I want to grow, so I'm ready to work hard."
        note:
          ar_eg: "كلمات: berkembang = يتطوّر، يكبر."
          ar: "مفردات: berkembang = يتطوّر، ينمو."
          en: "Words: berkembang = to develop, grow."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Silakan perkenalkan diri Anda."
        ar_eg: "اتفضل عرّفنا بنفسك."
        ar: "عرّفنا بنفسك من فضلك."
        en: "Please introduce yourself."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Silakan perkenalkan diri Anda.", ar_eg: "اتفضل عرّفنا بنفسك.", ar: "عرّفنا بنفسك من فضلك.", en: "Please introduce yourself."}
      - {speaker: Kak Tiara, text: "Saya sudah bekerja selama tiga tahun.", ar_eg: "بقالي تلات سنين بشتغل.", ar: "أعمل منذ ثلاث سنوات.", en: "I have worked for three years."}
      - {speaker: Kak Reza, text: "Saya sudah bekerja selama tiga tahun.", ar_eg: "بقالي تلات سنين بشتغل.", ar: "أعمل منذ ثلاث سنوات.", en: "I have worked for three years."}
      - {speaker: Kak Tiara, text: "Mengapa Anda tertarik bekerja di sini?", ar_eg: "ليه حابب تشتغل هنا؟", ar: "لماذا ترغب في العمل هنا؟", en: "Why are you interested in working here?"}
      - {speaker: Kak Reza, text: "Mengapa Anda tertarik bekerja di sini?", ar_eg: "ليه حابب تشتغل هنا؟", ar: "لماذا ترغب في العمل هنا؟", en: "Why are you interested in working here?"}
      - {speaker: Kak Tiara, text: "Saya bisa mulai awal bulan depan.", ar_eg: "أقدر أبدأ أول الشهر الجاي.", ar: "يمكنني البدء مطلع الشهر القادم.", en: "I can start at the beginning of next month."}
      - {speaker: Kak Reza, text: "Saya bisa mulai awal bulan depan.", ar_eg: "أقدر أبدأ أول الشهر الجاي.", ar: "يمكنني البدء مطلع الشهر القادم.", en: "I can start at the beginning of next month."}
  - kind: outro
    title: Giliran Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, jawab pertanyaan ini dengan ragam resmi: Mengapa kami harus memilih Anda?"
        ar_eg: "يا محمد، جاوب على السؤال ده بالأسلوب الرسمي: ليه نختارك إنت؟"
        ar: "يا محمد، أجب بالأسلوب الرسمي: لماذا يجب أن نختارك؟"
        en: "Mohamed, answer this in formal register: Why should we choose you?"
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Karena saya menguasai tiga bahasa dan saya terbiasa bekerja dengan tenggat waktu.", ar_eg: "مثلًا: عشان بتكلم تلات لغات ومتعود أشتغل بمواعيد تسليم.", ar: "مثلًا: لأنني أتقن ثلاث لغات واعتدت العمل وفق مواعيد تسليم.", en: "For example: Because I speak three languages and I'm used to working to deadlines."}
      - {speaker: Kak Tiara, text: "Besok, tulis CV singkatmu pakai bahasa Indonesia, ya.", ar_eg: "بكرة، اكتب سي في قصيرة ليك بالإندونيسي.", ar: "غدًا، اكتب سيرتك الذاتية مختصرة بالإندونيسية.", en: "Tomorrow, write a short CV in Indonesian."}
      - {speaker: Kak Reza, text: "Makasih udah dengerin, Mohamed. Semoga sukses!", ar_eg: "شكرًا إنك سمعتنا يا محمد. ربنا يوفقك!", ar: "شكرًا على الاستماع يا محمد. بالتوفيق!", en: "Thanks for listening, Mohamed. Good luck!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [wawancara, lowongan, riwayat hidup, atasan, rekan kerja, gaji, kelebihan, kekurangan, bawahan, melamar, tunjangan]
