title:
  target: Berbeda-beda tetapi tetap satu
  ar_eg: مختلفين بس واحد
  ar: متنوعون لكننا واحد
  en: Different, yet one
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Danau Sentani
    lines:
      - {speaker: Kak Tiara, text: "Selamat sore dari Danau Sentani! Ini Kabar Radio. Aku Tiara.", ar_eg: "مساء الخير من بحيرة سينتاني! ده كبار راديو. أنا تيارا.", ar: "مساء الخير من بحيرة سينتاني! هذا كبار راديو. أنا تيارا.", en: "Good afternoon from Lake Sentani! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Di danau ini ada pulau-pulau kecil sama kampung di atas air. Kaka Yohana yang ngajak kita ke sini.", ar_eg: "أنا رضا. في البحيرة دي جزر صغيرة وقرى فوق الميه. كاكا يوهانا جابتنا هنا.", ar: "أنا رضا. في هذه البحيرة جزر صغيرة وقرى فوق الماء، ودعتنا إليها كاكا يوهانا.", en: "I'm Reza. This lake has small islands and villages on the water. Kaka Yohana brought us here."}
      - {speaker: Kak Tiara, text: "Semboyan Indonesia adalah Bhinneka Tunggal Ika: berbeda-beda tetapi tetap satu.", ar_eg: "شعار إندونيسيا هو «بينيكا تونجال إيكا»: مختلفين بس برضه واحد.", ar: "شعار إندونيسيا «بينيكا تونغال إيكا»: متنوعون لكننا واحد.", en: "Indonesia's motto is Bhinneka Tunggal Ika: different, yet one."}
      - speaker: Kak Reza
        text: "Hari ini kita ngomongin toleransi, pakai ungkapan idiomatis yang alami."
        ar_eg: "النهارده هنتكلم عن التسامح، بتعبيرات اصطلاحية طبيعية."
        ar: "اليوم نتحدث عن التسامح بتعابير اصطلاحية طبيعية."
        en: "Today we talk about tolerance, using natural idiomatic expressions."
      - {speaker: Kak Tiara, text: "Mohamed, di Mesir, tetangga yang beda agama saling menghormati gimana?", ar_eg: "يا محمد، في مصر، الجيران اللي من أديان مختلفة بيحترموا بعض إزاي؟", ar: "يا محمد، في مصر كيف يحترم الجيران من أديان مختلفة بعضهم بعضًا؟", en: "Mohamed, in Egypt, how do neighbours of different faiths respect each other?"}
  - kind: dialogue
    title: Laporan keberagaman
    lines:
      - speaker: Kak Tiara
        text: "Kita bikin laporan pendek soal keberagaman. Dengerin ungkapan-ungkapannya, ya."
        ar_eg: "بنعمل تقرير قصير عن التنوع. اسمع التعبيرات."
        ar: "نعدّ تقريرًا قصيرًا عن التنوع. انتبه إلى التعابير."
        en: "We're making a short report on diversity. Listen for the expressions."
        note:
          ar_eg: "التعبيرات الاصطلاحية بتخلي كلامك يبان طبيعي، بس استعملها في مكانها."
          ar: "التعابير الاصطلاحية تجعل كلامك طبيعيًا، لكن ضعها في موضعها."
          en: "Idioms make you sound natural, but use them in the right place."
      - {speaker: Kak Reza, text: "Bhinneka Tunggal Ika berasal dari kitab Sutasoma, ditulis dalam bahasa Jawa Kuno oleh Mpu Tantular.", ar_eg: "«بينيكا تونجال إيكا» جاية من كتاب سوتاسوما، اللي كتبه مبو تانتولار بالجاوي القديم.", ar: "«بينيكا تونغال إيكا» مأخوذة من كتاب «سوتاسوما» الذي كتبه مبو تانتولار بالجاوية القديمة.", en: "Bhinneka Tunggal Ika comes from the Sutasoma, written in Old Javanese by Mpu Tantular."}
      - {speaker: Kak Tiara, text: "Dasar negara adalah Pancasila, lima sila. Sila pertama: Ketuhanan Yang Maha Esa.", ar_eg: "أساس الدولة هو «بانتشاسيلا»، خمس مبادئ. أول مبدأ: الإيمان بالإله الواحد.", ar: "أساس الدولة «بانتشاسيلا»: خمسة مبادئ، أولها الإيمان بالإله الواحد الأحد.", en: "The state's foundation is Pancasila, five principles. The first: Belief in the One Almighty God."}
      - {speaker: Kak Reza, text: "Di Maluku ada tradisi pela gandong. Dua desa, sering berbeda agama, berjanji menjadi saudara.", ar_eg: "في مالوكو فيه تقليد اسمه «بيلا جاندونج». قريتين، غالبًا من دينين مختلفين، بيتعاهدوا يبقوا إخوات.", ar: "في مالوكو تقليد «بيلا غاندونغ»: قريتان، غالبًا من دينين مختلفين، تتعاهدان على الأخوّة.", en: "In Maluku there's the pela gandong tradition. Two villages, often of different faiths, pledge to be siblings."}
      - {speaker: Kak Reza, text: "Kalau satu desa membangun masjid, desa saudaranya ikut membantu. Begitu juga saat membangun gereja.", ar_eg: "لو قرية بتبني جامع، القرية الأخت بتساعد. ونفس الكلام لما بيبنوا كنيسة.", ar: "إذا بنت قرية مسجدًا ساعدتها أختها، وكذلك عند بناء كنيسة.", en: "When one village builds a mosque, its sibling village helps. The same when building a church."}
      - {speaker: Kak Tiara, text: "Kaka Yohana bercerita, di jalannya di Sorong, warga Kristen mengunjungi tetangga Muslim saat Lebaran. Saat Natal, tetangga Muslim datang membawa kue.", ar_eg: "كاكا يوهانا حكت إن في شارعها في سورونج، المسيحيين بيزوروا جيرانهم المسلمين في العيد. وفي الكريسماس، الجيران المسلمين بييجوا ومعاهم كحك.", ar: "حكت كاكا يوهانا أن المسيحيين في شارعها بسورونغ يزورون جيرانهم المسلمين في العيد، وفي عيد الميلاد يأتي الجيران المسلمون بالحلوى.", en: "Kaka Yohana told us that on her street in Sorong, Christians visit their Muslim neighbours at Lebaran. At Christmas, the Muslim neighbours come with cakes."}
      - {speaker: Kak Reza, text: "Itu namanya ringan tangan: suka nolong. Terus mereka nggak pernah besar kepala.", ar_eg: "ده اسمه «إيده خفيفة»: بيحب يساعد. وعمرهم ما اتغروا.", ar: "هذا يسمى «خفيف اليد»: محب للمساعدة. ولم يتكبروا قط.", en: "That's ringan tangan, 'light-handed': quick to help. And they never get big-headed."}
      - {speaker: Kak Tiara, text: "Ya, nggak selalu gampang. Kadang ada konflik. Tapi banyak orang kerja keras biar tetap bersatu.", ar_eg: "أكيد مش دايمًا سهل. ساعات بيحصل خلاف. بس ناس كتير بتتعب عشان يفضلوا متحدين.", ar: "بالطبع ليس الأمر سهلًا دائمًا، وقد تقع خلافات، لكن كثيرين يعملون بجد ليبقوا متحدين.", en: "Of course it's not always easy. Sometimes there's conflict. But many people work hard to stay united."}
      - {speaker: Kak Reza, text: "Ibarat jari tangan: panjangnya berbeda, tetapi bersama-sama bisa menggenggam.", ar_eg: "زي صوابع الإيد: طولهم مختلف، بس مع بعض يقدروا يقفلوا القبضة.", ar: "كأصابع اليد: تختلف أطوالها، لكنها معًا تقبض.", en: "Like the fingers of a hand: different lengths, but together they can grip."}
  - kind: word_spotlight
    title: Ungkapan idiomatis
    lines:
      - speaker: Kak Tiara
        text: "Ringan tangan: suka menolong. Hati-hati: dalam konteks lain, ringan tangan juga bisa berarti suka memukul."
        ar_eg: "ringan tangan: بيحب يساعد. خلي بالك: في سياق تاني ممكن تعني «إيده سابقاه» يعني بيضرب بسهولة."
        ar: "ringan tangan: محب للمساعدة. تنبّه: في سياق آخر قد تعني سريع الضرب."
        en: "Ringan tangan: helpful. Careful: in another context it can mean quick to hit."
        note:
          ar_eg: "السياق هو اللي بيحدد المعنى."
          ar: "السياق هو الذي يحدد المعنى."
          en: "Context decides the meaning."
      - {speaker: Kak Reza, text: "Berat sama dipikul, ringan sama dijinjing: susah dan senang ditanggung bersama.", ar_eg: "«التقيل نشيله سوا، والخفيف نشيله سوا»: الحلو والمر مع بعض.", ar: "«الثقيل نحمله معًا والخفيف نحمله معًا»: السراء والضراء معًا.", en: "Heavy things carried together, light things carried together: hard and good times shared."}
      - {speaker: Kak Tiara, text: "Bagai aur dengan tebing: saling membantu dan saling melindungi.", ar_eg: "«زي الخيزران والجرف»: بيساعدوا ويحموا بعض.", ar: "«كالخيزران والجرف»: يعين أحدهما الآخر ويحميه.", en: "Like bamboo and the cliff: helping and protecting each other."}
      - {speaker: Kak Reza, text: "Toleransi, keberagaman, kerukunan, antarumat beragama, gotong royong.", ar_eg: "تسامح، تنوع، وئام، بين أتباع الأديان، تعاون جماعي.", ar: "تسامح، تنوع، وئام، بين أتباع الأديان، تعاضد جماعي.", en: "Tolerance, diversity, harmony, interfaith, mutual cooperation."}
      - {speaker: Kak Tiara, text: "Pancasila, sila, semboyan, persatuan, Bhinneka Tunggal Ika.", ar_eg: "بانتشاسيلا، مبدأ، شعار، وحدة، بينيكا تونجال إيكا.", ar: "بانتشاسيلا، مبدأ، شعار، وحدة، بينيكا تونغال إيكا.", en: "Pancasila, principle, motto, unity, Bhinneka Tunggal Ika."}
      - speaker: Kak Reza
        text: "Waktu Lebaran, tetangga bilang: Mohon maaf lahir batin, ya! Waktu Natal: Selamat Natal, Kaka!"
        ar_eg: "في العيد الجيران بيقولوا: سامحونا ظاهرًا وباطنًا! وفي الكريسماس: كريسماس سعيد يا كاكا!"
        ar: "في العيد يقول الجيران: نرجو المسامحة ظاهرًا وباطنًا! وفي عيد الميلاد: عيد ميلاد سعيد يا كاكا!"
        en: "At Lebaran, neighbours say: Forgive me, inside and out! At Christmas: Merry Christmas, Kaka!"
        note:
          ar_eg: "Mohon maaf lahir batin = تهنئة العيد المشهورة في إندونيسيا."
          ar: "Mohon maaf lahir batin = تهنئة العيد المشهورة في إندونيسيا."
          en: "Mohon maaf lahir batin is the classic Lebaran greeting."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Berbeda-beda tetapi tetap satu."
        ar_eg: "مختلفين بس برضه واحد."
        ar: "متنوعون لكننا واحد."
        en: "Different, yet one."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Berbeda-beda tetapi tetap satu.", ar_eg: "مختلفين بس برضه واحد.", ar: "متنوعون لكننا واحد.", en: "Different, yet one."}
      - {speaker: Kak Tiara, text: "Berat sama dipikul, ringan sama dijinjing.", ar_eg: "التقيل نشيله سوا، والخفيف نشيله سوا.", ar: "الثقيل نحمله معًا والخفيف نحمله معًا.", en: "Heavy things carried together, light things carried together."}
      - {speaker: Kak Reza, text: "Berat sama dipikul, ringan sama dijinjing.", ar_eg: "التقيل نشيله سوا، والخفيف نشيله سوا.", ar: "الثقيل نحمله معًا والخفيف نحمله معًا.", en: "Heavy things carried together, light things carried together."}
      - {speaker: Kak Tiara, text: "Tetangganya ringan tangan.", ar_eg: "جيرانها بيحبوا يساعدوا.", ar: "جيرانها محبون للمساعدة.", en: "Her neighbours are helpful."}
      - {speaker: Kak Reza, text: "Tetangganya ringan tangan.", ar_eg: "جيرانها بيحبوا يساعدوا.", ar: "جيرانها محبون للمساعدة.", en: "Her neighbours are helpful."}
      - {speaker: Kak Tiara, text: "Ibarat jari tangan, bersama kita kuat.", ar_eg: "زي صوابع الإيد، مع بعض إحنا أقويا.", ar: "كأصابع اليد، معًا نحن أقوياء.", en: "Like the fingers of a hand, together we're strong."}
      - {speaker: Kak Reza, text: "Ibarat jari tangan, bersama kita kuat.", ar_eg: "زي صوابع الإيد، مع بعض إحنا أقويا.", ar: "كأصابع اليد، معًا نحن أقوياء.", en: "Like the fingers of a hand, together we're strong."}
  - kind: outro
    title: Pidato persatuan
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, bikin pidato satu menit soal persatuan di Mesir. Pidato itu resmi, ya. Pakai satu ungkapan idiomatis."
        ar_eg: "محمد، اعمل خطبة دقيقة عن الوحدة في مصر. الخطبة رسمية. استعمل تعبير اصطلاحي واحد."
        ar: "محمد، ألقِ خطبة مدتها دقيقة عن الوحدة في مصر. الخطبة رسمية. استعمل تعبيرًا اصطلاحيًا واحدًا."
        en: "Mohamed, give a one-minute speech on unity in Egypt. A speech is formal. Use one idiom."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Di kampung saya, tetangga Muslim dan Kristen saling mengunjungi saat hari raya. Berat sama dipikul, ringan sama dijinjing.", ar_eg: "مثلًا: «في منطقتي، الجيران المسلمين والمسيحيين بيزوروا بعض في الأعياد. التقيل نشيله سوا، والخفيف نشيله سوا».", ar: "مثلًا: «في حيّنا يتزاور الجيران المسلمون والمسيحيون في الأعياد؛ الثقيل نحمله معًا والخفيف نحمله معًا».", en: "For example: In my neighbourhood, Muslim and Christian neighbours visit each other on holidays. Heavy things carried together, light things carried together."}
      - {speaker: Kak Tiara, text: "Besok, tulis laporan keberagaman soal lingkunganmu.", ar_eg: "بكرة، اكتب تقرير عن التنوع في منطقتك.", ar: "غدًا، اكتب تقريرًا عن التنوع في حيّك.", en: "Tomorrow, write a diversity report about your neighbourhood."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Makasih, Kaka Yohana!", ar_eg: "شكرًا يا محمد. شكرًا يا كاكا يوهانا!", ar: "شكرًا يا محمد. شكرًا يا كاكا يوهانا!", en: "Thank you, Mohamed. Thank you, Kaka Yohana!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [toleransi, keberagaman, kerukunan, Bhinneka Tunggal Ika, Pancasila, sila, pela gandong, gotong royong, besar kepala, dasar negara, ketuhanan, semboyan]
review:
  status: draft
  verified: false
  notes: |
    Kaka Yohana's street story echoes her persona file (mosque and church side by side
    in Sorong); her own religion is left unstated. Spot-check: Sutasoma by Mpu Tantular; Pancasila first
    sila wording; pela gandong mosque/church help; idiom meanings.
