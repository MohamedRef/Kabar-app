        ar: أريد الأحمر، لا الأبيض.
        en: I want the red one, not the white one.
      - speaker: Mas Ardi
        text: Lampion yang kecil murah. Yang besar mahal.
        ar_eg: الفانوس الصغير رخيص. والكبير غالي.
        ar: الفانوس الصغير رخيص. والكبير غالٍ.
        en: The small lantern is cheap. The big one is expensive.
      - speaker: Mbak Gadis
        text: Lampion yang kecil murah. Yang besar mahal.
        ar_eg: الفانوس الصغير رخيص. والكبير غالي.
        ar: الفانوس الصغير رخيص. والكبير غالٍ.
        en: The small lantern is cheap. The big one is expensive.
  - kind: outro
    title: Teman barumu yang mana?
    lines:
      - speaker: Mbak Gadis
        text: Mohamed, teman kamu orangnya bagaimana? Dia tinggi? Dia pendek?
        ar_eg: يا محمد، صاحبك شخصيته عاملة إزاي؟ طويل؟ قصير؟
        ar: يا محمد، كيف شخصية صديقك؟ أهو طويل؟ قصير؟
        en: Mohamed, what's your friend like? Tall? Short?
        note:
          ar_eg: دورك! جاوب بصوت عالي بجملة أو اتنين.
          ar: دورك! أجب بصوت مسموع بجملة أو جملتين.
          en: Your turn! Answer out loud in a sentence or two.
      - speaker: Mas Ardi
        text: Teman saya tinggi. Dia ramah dan pintar, tapi dia tidak sabar. Dia bukan guru, dia dokter.
        ar_eg: صاحبي طويل. ودود وذكي، بس مش صبور. هو مش مدرس، هو دكتور.
        ar: صديقي طويل. ودود وذكي، لكنه ليس صبورًا. ليس معلمًا، بل طبيب.
        en: My friend is tall. He's friendly and clever, but he isn't patient. He isn't a teacher, he's a doctor.
      - speaker: Mbak Gadis
        text: Bagus sekali, Mohamed! Tidak dan bukan, betul semua!
        ar_eg: برافو عليك يا محمد! tidak وbukan، كله صح!
        ar: أحسنت جدًا يا محمد! tidak وbukan، كلها صحيحة!
        en: Very good, Mohamed! Tidak and bukan, all correct!
      - speaker: Mas Ardi
        text: Besok, coba tebak. Siapa dia? Orangnya bagaimana?
        ar_eg: بكرة، جرّب لعبة التخمين. مين ده؟ شخصيته إيه؟
        ar: غدًا، جرّب لعبة التخمين. من هو؟ كيف شخصيته؟
        en: Tomorrow, play the guessing game. Who is it? What are they like?
        note:
          ar_eg: تحدي بكرة الصغير - وصف حد بتعرفه في تلات جمل، وخلّي حد يخمّن هو مين.
          ar: تحدّي الغد الصغير - صِف شخصًا تعرفه في ثلاث جمل، ودع أحدًا يخمّن من هو.
          en: Tomorrow's tiny challenge - describe someone you know in three sentences and let someone guess who it is.
      - speaker: Mbak Gadis
        text: Terima kasih, Mas Ardi. Mas ramah dan lucu, tapi agak malas!
        ar_eg: شكرًا يا أردي. إنت ودود ودمك خفيف، بس كسلان شوية!
        ar: شكرًا يا أردي. أنت ودود ومرح، لكنك كسول قليلًا!
        en: Thank you, Ardi. You're friendly and funny, but a bit lazy!
      - speaker: Mas Ardi
        text: Dan Mbak Gadis pintar dan sabar! Terima kasih, Mohamed.
        ar_eg: وإنتي ذكية وصبورة! شكرًا يا محمد.
        ar: وأنتِ ذكية وصبورة! شكرًا يا محمد.
        en: And you're clever and patient, Gadis! Thank you, Mohamed.
      - speaker: Mbak Gadis
        text: Sampai jumpa besok di Kabar Radio, Mohamed! Selamat malam!
        ar_eg: أشوفك بكرة في كبار راديو يا محمد! تصبح على خير!
        ar: إلى اللقاء غدًا في كبار راديو يا محمد! تصبح على خير!
        en: See you tomorrow on Kabar Radio, Mohamed! Good night!
