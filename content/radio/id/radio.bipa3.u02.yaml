schema: kabar.radio/v1
id: radio.bipa3.u02
language: id
level: bipa3
unit: bipa3.u02
title:
  target: Pantai tanpa plastik
  ar_eg: شط من غير بلاستيك
  ar: شاطئ بلا بلاستيك
  en: A beach without plastic
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Senggigi
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Pantai Senggigi! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من شط سينجيجي! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من شاطئ سينغيغي! هذا كبار راديو. أنا تيارا.", en: "Good morning from Senggigi Beach! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Pagi ini kita ikut bersih-bersih pantai bareng warga.", ar_eg: "أنا رضا. الصبح ده شاركنا الأهالي في تنضيف الشط.", ar: "أنا رضا. هذا الصباح شاركنا الأهالي في تنظيف الشاطئ.", en: "I'm Reza. This morning we joined local people in a beach clean-up."}
      - {speaker: Kak Tiara, text: "Sejam aja, kita dapat dua puluh kantong sampah. Kebanyakan plastik!", ar_eg: "في ساعة واحدة، لمّينا عشرين شنطة زبالة. أغلبها بلاستيك.", ar: "في ساعة واحدة جمعنا عشرين كيس قمامة، أغلبها بلاستيك.", en: "In just an hour we filled twenty bags of rubbish. Mostly plastic!"}
      - speaker: Kak Reza
        text: "Di Gili, tuh, di depan, nggak ada mobil sama motor. Orang naik sepeda atau cidomo."
        ar_eg: "في جيلي، اللي قدامنا هناك، مفيش عربيات ولا موتوسيكلات. الناس بتركب عجل أو تشيدومو."
        ar: "في جزر غيلي، هناك أمامنا، لا سيارات ولا دراجات نارية. يركب الناس الدراجات أو الشيدومو."
        en: "On the Gili islands, over there, there are no cars or motorbikes. People ride bikes or a cidomo."
        note:
          ar_eg: "cidomo عربية حنطور صغيرة بحصان، وسيلة المواصلات في جزر جيلي."
          ar: "cidomo عربة صغيرة يجرّها حصان، وهي وسيلة التنقل في جزر غيلي."
          en: "A cidomo is a small horse cart, the Gili islands' transport."
      - {speaker: Kak Tiara, text: "Mohamed, di kotamu sampah plastiknya banyak, nggak?", ar_eg: "يا محمد، فيه زبالة بلاستيك كتير في مدينتك؟", ar: "يا محمد، هل في مدينتك كثير من قمامة البلاستيك؟", en: "Mohamed, is there much plastic rubbish in your city?", note: {ar_eg: "في الكلام السؤال بييجي من غير apakah، و«..., nggak?» في الآخر.", ar: "في الكلام يأتي السؤال من دون apakah، مع «..., nggak?» في الآخر.", en: "In speech a question drops apakah and ends in '..., nggak?'."}}
  - kind: dialogue
    title: Diskusi sampah plastik
    lines:
      - {speaker: Kak Reza, text: "Menurutku, masalahnya botol plastik. Semua orang beli air botolan.", ar_eg: "في رأيي، المشكلة هي الزجاجات البلاستيك. كل الناس بتشتري مية في إزايز.", ar: "في رأيي، المشكلة هي الزجاجات البلاستيكية. الجميع يشترون الماء في زجاجات.", en: "If you ask me, the problem's plastic bottles. Everyone buys bottled water.", note: {ar_eg: "menurutku = menurut saya بين الصحاب.", ar: "menurutku = menurut saya بين الأصدقاء.", en: "menurutku = menurut saya among friends."}}
      - {speaker: Kak Tiara, text: "Setuju, tapi kantong plastik juga masalah gede. Murah, jadi orang buang gitu aja.", ar_eg: "موافقة، بس الأكياس البلاستيك كمان مشكلة كبيرة. سعرها رخيص، فالناس بترميها كده عادي.", ar: "أوافق، لكن الأكياس البلاستيكية مشكلة كبيرة أيضًا. سعرها رخيص، فيرميها الناس ببساطة.", en: "Agreed, but plastic bags are a big problem too. They're cheap, so people just chuck them.", note: {ar_eg: "gitu aja = begitu saja = «كده وخلاص».", ar: "gitu aja = begitu saja = «هكذا ببساطة».", en: "gitu aja = begitu saja = 'just like that'."}}
      - speaker: Kak Reza
        text: "Terus, kantong plastik harus dilarang, gitu?"
        ar_eg: "طيب، يعني لازم نمنع الأكياس البلاستيك؟"
        ar: "إذن، هل يجب أن نمنع الأكياس البلاستيكية؟"
        en: "So, should plastic bags be banned, then?"
        note:
          ar_eg: "Apakah في أول السؤال بتعمله رسمي، زي «هل». في الكلام الناس بتقول «..., gitu?»."
          ar: "Apakah في أول السؤال تجعله رسميًا مثل «هل». وفي الكلام يقول الناس «..., gitu?»."
          en: "Apakah makes a formal yes/no question, like «هل». In speech people say '..., gitu?'."
      - {speaker: Kak Tiara, text: "Nggak harus dilarang, sih. Bawa aja tas kain sendiri. Itu udah ngebantu banget.", ar_eg: "مش لازم نمنع. هات شنطة قماش بتاعتك. ده لوحده بيساعد.", ar: "ليس بالضرورة أن نمنع. احمل حقيبة قماش خاصة بك، فذلك يساعد.", en: "Doesn't have to be a ban. Just bring your own cloth bag. That helps a lot already.", note: {ar_eg: "sih هنا بتخفف الرأي. ngebantu = membantu في الكلام.", ar: "sih هنا تلطّف الرأي. ngebantu = membantu في الكلام اليومي.", en: "sih softens the opinion. ngebantu = spoken membantu."}}
      - {speaker: Kak Reza, text: "Tapi siapa aja bisa lupa bawa tas. Aku juga sering lupa!", ar_eg: "بس أي حد ممكن ينسى الشنطة. حتى أنا بنسى كتير!", ar: "لكن أي شخص قد ينسى الحقيبة. وأنا أيضًا أنسى كثيرًا!", en: "But anyone can forget a bag. I often forget too!"}
      - {speaker: Kak Tiara, text: "Ha ha. Biarpun lupa, kamu bisa nolak kantong plastik di toko.", ar_eg: "هههه. حتى لو نسيت، تقدر ترفض الكيس البلاستيك في المحل.", ar: "هاها. حتى إن نسيت، يمكنك أن ترفض الكيس البلاستيكي في المتجر.", en: "Ha ha. Even if you forget, you can refuse a plastic bag in the shop.", note: {ar_eg: "biarpun = walaupun في الكلام. nolak = menolak.", ar: "biarpun = walaupun في الكلام اليومي. nolak = menolak.", en: "biarpun = walaupun in speech; nolak = menolak."}}
      - {speaker: Kak Reza, text: "Bener juga. Katanya, plastik ngerusak terumbu karang di sini.", ar_eg: "عندك حق. بيقولوا إن البلاستيك بيبوّظ الشعاب المرجانية هنا.", ar: "معك حق. يقال إن البلاستيك يدمّر الشعاب المرجانية هنا.", en: "That's true. They say plastic damages the coral reefs here."}
      - {speaker: Kak Tiara, text: "Iya. Penyu juga makan plastik, soalnya bentuknya kayak ubur-ubur.", ar_eg: "أيوه. والسلاحف كمان بتاكل البلاستيك عشان شكله زي قنديل البحر.", ar: "نعم. والسلاحف أيضًا تأكل البلاستيك لأن شكله يشبه قنديل البحر.", en: "Yes. Turtles eat plastic too because it looks like jellyfish.", note: {ar_eg: "kayak = seperti في الكلام.", ar: "kayak = seperti في الكلام اليومي.", en: "kayak = seperti in speech."}}
      - {speaker: Kak Reza, text: "Kasihan banget. Di Gili ada warga yang jagain telur penyu.", ar_eg: "يا حرام. في جيلي فيه مجموعة من الأهالي بتحرس بيض السلاحف.", ar: "يا للأسف. في غيلي مجموعة من الأهالي تحرس بيض السلاحف.", en: "So sad. On the Gilis there's a community group that protects turtle eggs.", note: {ar_eg: "jagain = menjaga (-in في الكلام).", ar: "jagain = menjaga (‎-in في الكلام).", en: "jagain = menjaga (spoken -in)."}}
      - {speaker: Kak Tiara, text: "Jadi, kesimpulannya apa, nih?", ar_eg: "طيب، نستنتج إيه؟", ar: "إذن، ما خلاصتنا؟", en: "So, what's our conclusion?"}
      - {speaker: Kak Reza, text: "Kurangin plastik, bawa botol sendiri, buang sampah di tempatnya!", ar_eg: "قللوا البلاستيك، هاتوا إزازة بتاعتكم، وارموا الزبالة في مكانها!", ar: "قلّلوا البلاستيك، واحملوا زجاجاتكم، وارموا القمامة في مكانها!", en: "Cut down on plastic, bring your own bottle, bin your rubbish!", note: {ar_eg: "في الكلام: kurangin بدل kurangilah. -lah للكتابة واللافتات.", ar: "في الكلام: kurangin بدل kurangilah، و‎-lah للكتابة واللافتات.", en: "In speech: kurangin, not kurangilah. -lah is for writing and signs."}}
  - kind: word_spotlight
    title: -lah, -kah, -pun, -nya
    lines:
      - speaker: Kak Tiara
        text: "Bawalah. Buanglah. Duduklah. -lah membuat perintah lebih halus."
        ar_eg: "هات. ارمي. اقعد. -lah بتخلي الأمر ألطف."
        ar: "احمل. ارمِ. اجلس. -lah تجعل الأمر ألطف."
        en: "Do bring. Do throw. Do sit. -lah makes a command softer."
        note:
          ar_eg: "-lah كمان بتأكد: Dialah orangnya = هو ده الشخص بالظبط."
          ar: "-lah تفيد التوكيد أيضًا: Dialah orangnya = هو الشخص بعينه."
          en: "-lah also stresses: Dialah orangnya = he's the very one."
      - {speaker: Kak Reza, text: "Apakah? Siapakah? Di manakah? -kah membuat pertanyaan lebih resmi.", ar_eg: "هل؟ مين يا ترى؟ فين يا ترى؟ -kah بتخلي السؤال رسمي أكتر.", ar: "هل؟ من يا ترى؟ أين يا ترى؟ -kah تجعل السؤال أكثر رسمية.", en: "Whether? Who? Where? -kah makes a question more formal."}
      - {speaker: Kak Tiara, text: "Siapa pun, apa pun, di mana pun. Siapa pun boleh ikut bersih-bersih.", ar_eg: "أي حد، أي حاجة، في أي حتة. أي حد ممكن يشارك في التنضيف.", ar: "أيًّا كان، أي شيء، في أي مكان. يمكن لأي شخص المشاركة في التنظيف.", en: "Anyone, anything, anywhere. Anyone can join the clean-up."}
      - {speaker: Kak Reza, text: "Saya pun. Walaupun. Saya pun setuju, walaupun saya sering lupa.", ar_eg: "وأنا كمان. حتى لو. أنا كمان موافق، حتى لو ببقى ناسي كتير.", ar: "وأنا أيضًا. ولو أن. وأنا أيضًا أوافق، ولو أنني أنسى كثيرًا.", en: "Me too. Although. I agree too, although I often forget."}
      - speaker: Kak Tiara
        text: "Sama teman: Aku juga setuju, biarpun sering lupa. Siapa aja boleh ikut!"
        ar_eg: "مع صحابك: أنا كمان موافقة، مع إني بنسى كتير. أي حد ييجي!"
        ar: "مع الأصدقاء: أنا موافقة أيضًا رغم أني أنسى كثيرًا. يمكن لأي أحد أن ينضم!"
        en: "With friends: I agree too, even though I often forget. Anyone can join!"
        note:
          ar_eg: "pun وwalaupun وsiapa pun للكتابة. في الكلام: juga، biarpun، siapa aja."
          ar: "pun وwalaupun وsiapa pun للكتابة، وفي الكلام: juga، biarpun، siapa aja."
          en: "pun, walaupun, siapa pun are for writing; in speech: juga, biarpun, siapa aja."
      - speaker: Kak Tiara
        text: "Harganya, katanya, bentuknya. -nya ada di mana-mana!"
        ar_eg: "سعرها، بيقولوا، شكلها. -nya في كل حتة!"
        ar: "سعرها، يقال، شكلها. -nya في كل مكان!"
        en: "Its price, apparently, its shape. -nya is everywhere!"
        note:
          ar_eg: "-nya بتبقى «بتاعه/ها»، أو «الـ» المعروفة، وkatanya = «بيقولوا»."
          ar: "-nya تكون ضمير الغائب «ـه/ـها»، أو أداة تعريف، وkatanya = «يُقال»."
          en: "-nya can be 'his/her/its', or work like 'the', and katanya = 'they say'."
      - {speaker: Kak Reza, text: "Menurut saya, saya setuju, saya tidak setuju. Menurut saya, plastik harus dikurangi.", ar_eg: "في رأيي، موافق، مش موافق. في رأيي، لازم نقلل البلاستيك.", ar: "في رأيي، أوافق، لا أوافق. في رأيي، يجب تقليل البلاستيك.", en: "In my opinion, I agree, I disagree. In my opinion, plastic must be reduced."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Menurut saya, masalahnya adalah botol plastik."
        ar_eg: "في رأيي، المشكلة هي الزجاجات البلاستيك."
        ar: "في رأيي، المشكلة هي الزجاجات البلاستيكية."
        en: "In my opinion, the problem is plastic bottles."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Menurut saya, masalahnya adalah botol plastik.", ar_eg: "في رأيي، المشكلة هي الزجاجات البلاستيك.", ar: "في رأيي، المشكلة هي الزجاجات البلاستيكية.", en: "In my opinion, the problem is plastic bottles."}
      - {speaker: Kak Tiara, text: "Apakah kita harus melarang kantong plastik?", ar_eg: "هل لازم نمنع الأكياس البلاستيك؟", ar: "هل يجب أن نمنع الأكياس البلاستيكية؟", en: "Should we ban plastic bags?"}
      - {speaker: Kak Reza, text: "Apakah kita harus melarang kantong plastik?", ar_eg: "هل لازم نمنع الأكياس البلاستيك؟", ar: "هل يجب أن نمنع الأكياس البلاستيكية؟", en: "Should we ban plastic bags?"}
      - {speaker: Kak Tiara, text: "Siapa pun bisa membantu.", ar_eg: "أي حد يقدر يساعد.", ar: "يستطيع أي شخص أن يساعد.", en: "Anyone can help."}
      - {speaker: Kak Reza, text: "Siapa pun bisa membantu.", ar_eg: "أي حد يقدر يساعد.", ar: "يستطيع أي شخص أن يساعد.", en: "Anyone can help."}
      - {speaker: Kak Tiara, text: "Bawalah tas kain sendiri.", ar_eg: "هات شنطة قماش بتاعتك.", ar: "احمل حقيبة القماش الخاصة بك.", en: "Bring your own cloth bag."}
      - {speaker: Kak Reza, text: "Bawalah tas kain sendiri.", ar_eg: "هات شنطة قماش بتاعتك.", ar: "احمل حقيبة القماش الخاصة بك.", en: "Bring your own cloth bag."}
  - kind: outro
    title: Pendapat Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, apa pendapatmu? Apakah kantong plastik harus dilarang? Mulailah dengan 'Menurut saya'."
        ar_eg: "يا محمد، رأيك إيه؟ لازم نمنع الأكياس البلاستيك؟ ابدأ بـ«في رأيي»."
        ar: "يا محمد، ما رأيك؟ هل يجب منع الأكياس البلاستيكية؟ ابدأ بـ«في رأيي»."
        en: "Mohamed, what do you think? Should plastic bags be banned? Start with 'In my opinion'."
        note:
          ar_eg: "دورك! قول رأيك وسبب واحد."
          ar: "دورك! قل رأيك وسببًا واحدًا."
          en: "Your turn! Give your view and one reason."
      - {speaker: Kak Reza, text: "Contohnya: Menurut saya, kantong plastik tidak harus dilarang, tetapi harganya harus mahal. Dengan begitu, orang membawa tas sendiri.", ar_eg: "مثلًا: في رأيي، مش لازم نمنع الأكياس، بس لازم سعرها يبقى غالي. كده الناس هتجيب شنطها.", ar: "مثلًا: في رأيي، لا داعي لمنع الأكياس، لكن يجب أن يكون سعرها مرتفعًا. وبذلك يحمل الناس حقائبهم.", en: "For example: In my opinion, plastic bags needn't be banned, but they should be expensive. That way people bring their own bags."}
      - {speaker: Kak Tiara, text: "Besok, cobalah satu hari tanpa plastik. Apakah kamu bisa?", ar_eg: "بكرة، جرّب يوم كامل من غير بلاستيك. تقدر؟", ar: "غدًا، جرّب يومًا كاملًا بلا بلاستيك. هل تستطيع؟", en: "Tomorrow, try one day without plastic. Can you do it?"}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Jaga bumi kita, ya!", ar_eg: "شكرًا يا محمد. حافظوا على أرضنا!", ar: "شكرًا يا محمد. احفظوا أرضنا!", en: "Thank you, Mohamed. Look after our planet!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [sampah, terumbu karang, penyu, melarang, setuju, apakah, bawa, siapa pun, walaupun, katanya, -nya, apa pun, plastik]
