schema: kabar.radio/v1
id: radio.bipa3.u02
language: id
level: bipa3
unit: bipa3.u02
title:
  target: Pantai tanpa plastik
  ar_eg: شط من غير بلاستيك
  ar: شاطئ بلا بلاستيك
  en: A beach without plastic
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Senggigi
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Pantai Senggigi! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من شط سينجيجي! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من شاطئ سينغيغي! هذا كبار راديو. أنا تيارا.", en: "Good morning from Senggigi Beach! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Pagi ini kami ikut bersih-bersih pantai bersama warga.", ar_eg: "أنا رضا. الصبح ده شاركنا الأهالي في تنضيف الشط.", ar: "أنا رضا. هذا الصباح شاركنا الأهالي في تنظيف الشاطئ.", en: "I'm Reza. This morning we joined local people in a beach clean-up."}
      - {speaker: Kak Tiara, text: "Dalam satu jam, kami mengumpulkan dua puluh kantong sampah. Sebagian besar plastik.", ar_eg: "في ساعة واحدة، لمّينا عشرين شنطة زبالة. أغلبها بلاستيك.", ar: "في ساعة واحدة جمعنا عشرين كيس قمامة، أغلبها بلاستيك.", en: "In one hour we collected twenty bags of rubbish. Most of it plastic."}
      - speaker: Kak Reza
        text: "Di Gili, di depan sana, tidak ada mobil dan motor. Orang naik sepeda atau cidomo."
        ar_eg: "في جيلي، اللي قدامنا هناك، مفيش عربيات ولا موتوسيكلات. الناس بتركب عجل أو تشيدومو."
        ar: "في جزر غيلي، هناك أمامنا، لا سيارات ولا دراجات نارية. يركب الناس الدراجات أو الشيدومو."
        en: "On the Gili islands, over there, there are no cars or motorbikes. People ride bikes or a cidomo."
        note:
          ar_eg: "cidomo عربية حنطور صغيرة بحصان، وسيلة المواصلات في جزر جيلي."
          ar: "cidomo عربة صغيرة يجرّها حصان، وهي وسيلة التنقل في جزر غيلي."
          en: "A cidomo is a small horse cart, the Gili islands' transport."
      - {speaker: Kak Tiara, text: "Mohamed, apakah di kotamu ada banyak sampah plastik?", ar_eg: "يا محمد، فيه زبالة بلاستيك كتير في مدينتك؟", ar: "يا محمد، هل في مدينتك كثير من قمامة البلاستيك؟", en: "Mohamed, is there a lot of plastic rubbish in your city?"}
  - kind: dialogue
    title: Diskusi sampah plastik
    lines:
      - {speaker: Kak Reza, text: "Menurut saya, masalahnya adalah botol plastik. Semua orang membeli air dalam botol.", ar_eg: "في رأيي، المشكلة هي الزجاجات البلاستيك. كل الناس بتشتري مية في إزايز.", ar: "في رأيي، المشكلة هي الزجاجات البلاستيكية. الجميع يشترون الماء في زجاجات.", en: "In my opinion, the problem is plastic bottles. Everyone buys water in bottles."}
      - {speaker: Kak Tiara, text: "Saya setuju, tetapi kantong plastik juga masalah besar. Harganya murah, jadi orang membuangnya begitu saja.", ar_eg: "موافقة، بس الأكياس البلاستيك كمان مشكلة كبيرة. سعرها رخيص، فالناس بترميها كده عادي.", ar: "أوافق، لكن الأكياس البلاستيكية مشكلة كبيرة أيضًا. سعرها رخيص، فيرميها الناس ببساطة.", en: "I agree, but plastic bags are a big problem too. They're cheap, so people just throw them away."}
      - speaker: Kak Reza
        text: "Lalu, apakah kita harus melarang kantong plastik?"
        ar_eg: "طيب، يعني لازم نمنع الأكياس البلاستيك؟"
        ar: "إذن، هل يجب أن نمنع الأكياس البلاستيكية؟"
        en: "So, should we ban plastic bags?"
        note:
          ar_eg: "apakah في أول الجملة بتعمل سؤال أيوه/لأ مؤدب، زي «هل»."
          ar: "apakah في أول الجملة تصنع سؤالًا بنعم أو لا، مثل «هل»."
          en: "Apakah at the start makes a polite yes/no question, like Arabic «هل»."
      - {speaker: Kak Tiara, text: "Tidak harus melarang. Bawalah tas kain sendiri. Itu sudah membantu.", ar_eg: "مش لازم نمنع. هات شنطة قماش بتاعتك. ده لوحده بيساعد.", ar: "ليس بالضرورة أن نمنع. احمل حقيبة قماش خاصة بك، فذلك يساعد.", en: "We don't have to ban them. Bring your own cloth bag. That already helps."}
      - {speaker: Kak Reza, text: "Tapi siapa pun bisa lupa membawa tas. Saya pun sering lupa!", ar_eg: "بس أي حد ممكن ينسى الشنطة. حتى أنا بنسى كتير!", ar: "لكن أي شخص قد ينسى الحقيبة. وأنا أيضًا أنسى كثيرًا!", en: "But anyone can forget a bag. Even I forget often!"}
      - {speaker: Kak Tiara, text: "Ha ha. Walaupun kamu lupa, kamu bisa menolak kantong plastik di toko.", ar_eg: "هههه. حتى لو نسيت، تقدر ترفض الكيس البلاستيك في المحل.", ar: "هاها. حتى إن نسيت، يمكنك أن ترفض الكيس البلاستيكي في المتجر.", en: "Ha ha. Even if you forget, you can refuse a plastic bag in the shop."}
      - {speaker: Kak Reza, text: "Betul juga. Katanya, plastik merusak terumbu karang di sini.", ar_eg: "عندك حق. بيقولوا إن البلاستيك بيبوّظ الشعاب المرجانية هنا.", ar: "معك حق. يقال إن البلاستيك يدمّر الشعاب المرجانية هنا.", en: "That's true. They say plastic damages the coral reefs here."}
      - {speaker: Kak Tiara, text: "Ya. Penyu juga memakan plastik karena bentuknya seperti ubur-ubur.", ar_eg: "أيوه. والسلاحف كمان بتاكل البلاستيك عشان شكله زي قنديل البحر.", ar: "نعم. والسلاحف أيضًا تأكل البلاستيك لأن شكله يشبه قنديل البحر.", en: "Yes. Turtles eat plastic too because it looks like jellyfish."}
      - {speaker: Kak Reza, text: "Kasihan sekali. Di Gili ada kelompok warga yang menjaga telur penyu.", ar_eg: "يا حرام. في جيلي فيه مجموعة من الأهالي بتحرس بيض السلاحف.", ar: "يا للأسف. في غيلي مجموعة من الأهالي تحرس بيض السلاحف.", en: "So sad. On the Gilis there's a community group that protects turtle eggs."}
      - {speaker: Kak Tiara, text: "Jadi, apa kesimpulan kita?", ar_eg: "طيب، نستنتج إيه؟", ar: "إذن، ما خلاصتنا؟", en: "So, what's our conclusion?"}
      - {speaker: Kak Reza, text: "Kurangilah plastik, bawalah botol sendiri, dan buanglah sampah di tempatnya!", ar_eg: "قللوا البلاستيك، هاتوا إزازة بتاعتكم، وارموا الزبالة في مكانها!", ar: "قلّلوا البلاستيك، واحملوا زجاجاتكم، وارموا القمامة في مكانها!", en: "Use less plastic, bring your own bottle, and put rubbish in the bin!"}
  - kind: word_spotlight
    title: -lah, -kah, -pun, -nya
    lines:
      - speaker: Kak Tiara
        text: "Bawalah. Buanglah. Duduklah. -lah membuat perintah lebih halus."
        ar_eg: "هات. ارمي. اقعد. -lah بتخلي الأمر ألطف."
        ar: "احمل. ارمِ. اجلس. -lah تجعل الأمر ألطف."
        en: "Do bring. Do throw. Do sit. -lah makes a command softer."
        note:
          ar_eg: "-lah كمان بتأكد: Dialah orangnya = هو ده الشخص بالظبط."
          ar: "-lah تفيد التوكيد أيضًا: Dialah orangnya = هو الشخص بعينه."
          en: "-lah also stresses: Dialah orangnya = he's the very one."
      - {speaker: Kak Reza, text: "Apakah? Siapakah? Di manakah? -kah membuat pertanyaan lebih resmi.", ar_eg: "هل؟ مين يا ترى؟ فين يا ترى؟ -kah بتخلي السؤال رسمي أكتر.", ar: "هل؟ من يا ترى؟ أين يا ترى؟ -kah تجعل السؤال أكثر رسمية.", en: "Whether? Who? Where? -kah makes a question more formal."}
      - {speaker: Kak Tiara, text: "Siapa pun, apa pun, di mana pun. Siapa pun boleh ikut bersih-bersih.", ar_eg: "أي حد، أي حاجة، في أي حتة. أي حد ممكن يشارك في التنضيف.", ar: "أيًّا كان، أي شيء، في أي مكان. يمكن لأي شخص المشاركة في التنظيف.", en: "Anyone, anything, anywhere. Anyone can join the clean-up."}
      - {speaker: Kak Reza, text: "Saya pun. Walaupun. Saya pun setuju, walaupun saya sering lupa.", ar_eg: "وأنا كمان. حتى لو. أنا كمان موافق، حتى لو ببقى ناسي كتير.", ar: "وأنا أيضًا. ولو أن. وأنا أيضًا أوافق، ولو أنني أنسى كثيرًا.", en: "Me too. Although. I agree too, although I often forget."}
      - speaker: Kak Tiara
        text: "Harganya, katanya, bentuknya. -nya ada di mana-mana!"
        ar_eg: "سعرها، بيقولوا، شكلها. -nya في كل حتة!"
        ar: "سعرها، يقال، شكلها. -nya في كل مكان!"
        en: "Its price, apparently, its shape. -nya is everywhere!"
        note:
          ar_eg: "-nya بتبقى «بتاعه/ها»، أو «الـ» المعروفة، وkatanya = «بيقولوا»."
          ar: "-nya تكون ضمير الغائب «ـه/ـها»، أو أداة تعريف، وkatanya = «يُقال»."
          en: "-nya can be 'his/her/its', or work like 'the', and katanya = 'they say'."
      - {speaker: Kak Reza, text: "Menurut saya, saya setuju, saya tidak setuju. Menurut saya, plastik harus dikurangi.", ar_eg: "في رأيي، موافق، مش موافق. في رأيي، لازم نقلل البلاستيك.", ar: "في رأيي، أوافق، لا أوافق. في رأيي، يجب تقليل البلاستيك.", en: "In my opinion, I agree, I disagree. In my opinion, plastic must be reduced."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Menurut saya, masalahnya adalah botol plastik."
        ar_eg: "في رأيي، المشكلة هي الزجاجات البلاستيك."
        ar: "في رأيي، المشكلة هي الزجاجات البلاستيكية."
        en: "In my opinion, the problem is plastic bottles."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Menurut saya, masalahnya adalah botol plastik.", ar_eg: "في رأيي، المشكلة هي الزجاجات البلاستيك.", ar: "في رأيي، المشكلة هي الزجاجات البلاستيكية.", en: "In my opinion, the problem is plastic bottles."}
      - {speaker: Kak Tiara, text: "Apakah kita harus melarang kantong plastik?", ar_eg: "هل لازم نمنع الأكياس البلاستيك؟", ar: "هل يجب أن نمنع الأكياس البلاستيكية؟", en: "Should we ban plastic bags?"}
      - {speaker: Kak Reza, text: "Apakah kita harus melarang kantong plastik?", ar_eg: "هل لازم نمنع الأكياس البلاستيك؟", ar: "هل يجب أن نمنع الأكياس البلاستيكية؟", en: "Should we ban plastic bags?"}
      - {speaker: Kak Tiara, text: "Siapa pun bisa membantu.", ar_eg: "أي حد يقدر يساعد.", ar: "يستطيع أي شخص أن يساعد.", en: "Anyone can help."}
      - {speaker: Kak Reza, text: "Siapa pun bisa membantu.", ar_eg: "أي حد يقدر يساعد.", ar: "يستطيع أي شخص أن يساعد.", en: "Anyone can help."}
      - {speaker: Kak Tiara, text: "Bawalah tas kain sendiri.", ar_eg: "هات شنطة قماش بتاعتك.", ar: "احمل حقيبة القماش الخاصة بك.", en: "Bring your own cloth bag."}
      - {speaker: Kak Reza, text: "Bawalah tas kain sendiri.", ar_eg: "هات شنطة قماش بتاعتك.", ar: "احمل حقيبة القماش الخاصة بك.", en: "Bring your own cloth bag."}
  - kind: outro
    title: Pendapat Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, apa pendapatmu? Apakah kantong plastik harus dilarang? Mulailah dengan 'Menurut saya'."
        ar_eg: "يا محمد، رأيك إيه؟ لازم نمنع الأكياس البلاستيك؟ ابدأ بـ«في رأيي»."
        ar: "يا محمد، ما رأيك؟ هل يجب منع الأكياس البلاستيكية؟ ابدأ بـ«في رأيي»."
        en: "Mohamed, what do you think? Should plastic bags be banned? Start with 'In my opinion'."
        note:
          ar_eg: "دورك! قول رأيك وسبب واحد."
          ar: "دورك! قل رأيك وسببًا واحدًا."
          en: "Your turn! Give your view and one reason."
      - {speaker: Kak Reza, text: "Contohnya: Menurut saya, kantong plastik tidak harus dilarang, tetapi harganya harus mahal. Dengan begitu, orang membawa tas sendiri.", ar_eg: "مثلًا: في رأيي، مش لازم نمنع الأكياس، بس لازم سعرها يبقى غالي. كده الناس هتجيب شنطها.", ar: "مثلًا: في رأيي، لا داعي لمنع الأكياس، لكن يجب أن يكون سعرها مرتفعًا. وبذلك يحمل الناس حقائبهم.", en: "For example: In my opinion, plastic bags needn't be banned, but they should be expensive. That way people bring their own bags."}
      - {speaker: Kak Tiara, text: "Besok, cobalah satu hari tanpa plastik. Apakah kamu bisa?", ar_eg: "بكرة، جرّب يوم كامل من غير بلاستيك. تقدر؟", ar: "غدًا، جرّب يومًا كاملًا بلا بلاستيك. هل تستطيع؟", en: "Tomorrow, try one day without plastic. Can you do it?"}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Jagalah bumi kita!", ar_eg: "شكرًا يا محمد. حافظوا على أرضنا!", ar: "شكرًا يا محمد. احفظوا أرضنا!", en: "Thank you, Mohamed. Look after our planet!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
