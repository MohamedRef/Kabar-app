title:
  target: Menurut para ahli
  ar_eg: على حسب رأي الخبرا
  ar: وفقًا للخبراء
  en: According to the experts
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Udara sejuk Berastagi
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Berastagi, di kaki Gunung Sinabung! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من بيراستاجي، عند سفح جبل سينابونج! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من بيراستاغي عند سفح جبل سينابونغ! هذا كبار راديو. أنا تيارا.", en: "Good morning from Berastagi, at the foot of Mount Sinabung! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Udaranya sejuk, cocok untuk menulis. Ini episode terakhir kami di Sumatra.", ar_eg: "أنا رضا. الجو هنا منعش، مناسب للكتابة. ودي آخر حلقة لينا في سومطرة.", ar: "أنا رضا. الهواء منعش ومناسب للكتابة، وهذه آخر حلقاتنا في سومطرة.", en: "I'm Reza. The air is cool, good for writing. This is our last episode in Sumatra."}
      - {speaker: Kak Tiara, text: "Hari ini kita masuk ke dunia kampus: tulisan akademik.", ar_eg: "النهارده هندخل عالم الجامعة: الكتابة الأكاديمية.", ar: "اليوم ندخل عالم الجامعة: الكتابة الأكاديمية.", en: "Today we enter the world of campus: academic writing."}
      - speaker: Kak Reza
        text: "Kita belajar parafrasa, mengutip sumber, dan menulis paragraf akademik."
        ar_eg: "هنتعلم إعادة الصياغة، والاستشهاد بالمصادر، وكتابة فقرة أكاديمية."
        ar: "نتعلم إعادة الصياغة، والاقتباس من المصادر، وكتابة فقرة أكاديمية."
        en: "We learn paraphrasing, citing sources, and writing an academic paragraph."
      - {speaker: Kak Tiara, text: "Mohamed, pernahkah kamu menulis makalah di universitas?", ar_eg: "يا محمد، كتبت بحث في الجامعة قبل كده؟", ar: "يا محمد، هل كتبت بحثًا في الجامعة من قبل؟", en: "Mohamed, have you ever written a paper at university?"}
  - kind: dialogue
    title: Menyunting paragraf
    lines:
      - speaker: Kak Tiara
        text: "Kak Reza menulis paragraf tentang belajar bahasa. Saya menyuntingnya seperti dosen."
        ar_eg: "رضا كتب فقرة عن تعلّم اللغات. وأنا هراجعها زي الدكتورة."
        ar: "كتب رضا فقرة عن تعلم اللغات، وسأراجعها كما تفعل الأستاذة الجامعية."
        en: "Reza wrote a paragraph about language learning. I edit it like a lecturer."
        note:
          ar_eg: "المصدر اللي بيستشهدوا بيه هنا متخيّل للتمرين."
          ar: "المصدر المستشهد به هنا متخيَّل للتمرين."
          en: "The source cited here is imaginary, for practice."
      - {speaker: Kak Reza, text: "Versi pertama: Belajar bahasa itu gampang banget kalau tiap hari. Semua orang tahu itu.", ar_eg: "النسخة الأولى: «تعلم اللغة سهل خالص لو كل يوم. كل الناس عارفة كده».", ar: "النسخة الأولى: «تعلم اللغة سهل جدًا إن كان يوميًا. الكل يعرف ذلك».", en: "First draft: Learning a language is super easy if you do it every day. Everyone knows that."}
      - {speaker: Kak Tiara, text: "Hmm. Gampang banget itu ragam santai. Semua orang tahu tidak punya sumber.", ar_eg: "همم. gampang banget دي عامية. و«كل الناس عارفة» ما لهاش مصدر.", ar: "gampang banget أسلوب دارج، و«الكل يعرف» بلا مصدر.", en: "Hmm. Gampang banget is casual. Everyone knows has no source."}
      - {speaker: Kak Reza, text: "Versi kedua: Pembelajaran bahasa yang dilakukan secara rutin cenderung lebih efektif.", ar_eg: "النسخة التانية: «تعلم اللغة اللي بيتعمل بانتظام بيميل إنه يكون أكتر فاعلية».", ar: "النسخة الثانية: «يميل تعلم اللغة المنتظم إلى أن يكون أكثر فاعلية».", en: "Second draft: Language learning done regularly tends to be more effective."}
      - {speaker: Kak Tiara, text: "Lebih baik! Cenderung itu kata yang hati-hati. Sekarang tambahkan sumber.", ar_eg: "أحسن! «بيميل» دي كلمة حذرة. دلوقتي زوّد مصدر.", ar: "أفضل! «يميل» كلمة متحفظة. أضف الآن مصدرًا.", en: "Better! Cenderung is a careful word. Now add a source."}
      - {speaker: Kak Reza, text: "Menurut Hasibuan dalam bukunya tentang pemerolehan bahasa, latihan singkat setiap hari lebih bermanfaat daripada latihan panjang seminggu sekali.", ar_eg: "«على حسب هاسيبوان في كتابه عن اكتساب اللغة، التمرين القصير كل يوم أنفع من التمرين الطويل مرة في الأسبوع».", ar: "«يرى هاسيبوان في كتابه عن اكتساب اللغة أن التمرين القصير اليومي أنفع من الطويل الأسبوعي».", en: "According to Hasibuan in his book on language acquisition, short daily practice is more useful than long weekly practice."}
      - {speaker: Kak Tiara, text: "Bagus. Itu parafrasa, bukan kutipan langsung. Kalau kutipan langsung, pakai tanda petik.", ar_eg: "حلو. دي إعادة صياغة، مش نقل حرفي. لو نقل حرفي، حط علامات تنصيص.", ar: "جيد. هذه إعادة صياغة لا اقتباس حرفي؛ وللاقتباس الحرفي استخدم علامتي التنصيص.", en: "Good. That's a paraphrase, not a direct quote. For a direct quote, use quotation marks."}
      - {speaker: Kak Reza, text: "Dan tulis tahun serta halamannya, ya?", ar_eg: "وأكتب السنة ورقم الصفحة كمان، صح؟", ar: "وأكتب السنة ورقم الصفحة أيضًا، أليس كذلك؟", en: "And write the year and page, right?"}
      - {speaker: Kak Tiara, text: "Betul. Terakhir, akhiri dengan kalimat penutup: Dengan demikian, konsistensi lebih penting daripada durasi.", ar_eg: "صح. وفي الآخر، اختم بجملة: «وبكده، الاستمرارية أهم من المدة».", ar: "صحيح. واختم بجملة: «وعليه، فالمواظبة أهم من المدة».", en: "Right. Finally, end with a closing sentence: Therefore, consistency matters more than duration."}
  - kind: word_spotlight
    title: Bahasa akademik
    lines:
      - speaker: Kak Tiara
        text: "Mengutip sumber: Menurut…, … menyatakan bahwa…, Seperti dikemukakan oleh…"
        ar_eg: "الاستشهاد: «على حسب…»، «… بيقرر إن…»، «زي ما قال…»."
        ar: "الاستشهاد: «وفقًا لـ…»، «يقرر… أن…»، «كما أشار…»."
        en: "Citing: According to…, … states that…, As put forward by…"
        note:
          ar_eg: "البحث الأكاديمي بيمشي على قواعد الإملا الرسمية (EYD) وقاموس KBBI."
          ar: "تلتزم الكتابة الأكاديمية بقواعد الإملاء الرسمية (EYD) ومعجم KBBI."
          en: "Academic writing follows the official spelling rules (EYD) and the KBBI dictionary."
      - {speaker: Kak Reza, text: "Kata hati-hati: cenderung, umumnya, sebagian besar, dapat diasumsikan.", ar_eg: "كلمات حذرة: يميل إلى، عمومًا، الأغلبية، ممكن نفترض.", ar: "كلمات متحفظة: يميل إلى، عمومًا، معظم، يمكن الافتراض.", en: "Careful words: tends to, generally, the majority, it can be assumed."}
      - {speaker: Kak Tiara, text: "Parafrasa, kutipan langsung, daftar pustaka, sumber terpercaya, plagiarisme.", ar_eg: "إعادة صياغة، نقل حرفي، قايمة المراجع، مصدر موثوق، سرقة علمية.", ar: "إعادة صياغة، اقتباس حرفي، قائمة المراجع، مصدر موثوق، انتحال.", en: "Paraphrase, direct quote, bibliography, reliable source, plagiarism."}
      - {speaker: Kak Reza, text: "Kerangka esai: pendahuluan, isi, penutup. Kalimat utama, kalimat penjelas.", ar_eg: "هيكل المقال: مقدمة، مضمون، خاتمة. جملة أساسية، وجمل شارحة.", ar: "هيكل المقال: مقدمة، عرض، خاتمة. جملة رئيسة، وجمل موضّحة.", en: "Essay outline: introduction, body, conclusion. Topic sentence, supporting sentences."}
      - {speaker: Kak Tiara, text: "Menyunting, umpan balik, revisi, versi akhir.", ar_eg: "مراجعة، تعليقات، تعديل، النسخة النهائية.", ar: "تحرير، ملاحظات، مراجعة، النسخة النهائية.", en: "Editing, feedback, revision, final version."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Pembelajaran yang rutin cenderung lebih efektif."
        ar_eg: "التعلّم المنتظم بيميل إنه يكون أكتر فاعلية."
        ar: "يميل التعلم المنتظم إلى أن يكون أكثر فاعلية."
        en: "Regular learning tends to be more effective."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Pembelajaran yang rutin cenderung lebih efektif.", ar_eg: "التعلّم المنتظم بيميل إنه يكون أكتر فاعلية.", ar: "يميل التعلم المنتظم إلى أن يكون أكثر فاعلية.", en: "Regular learning tends to be more effective."}
      - {speaker: Kak Tiara, text: "Menurut Hasibuan, latihan harian lebih bermanfaat.", ar_eg: "على حسب هاسيبوان، التمرين اليومي أنفع.", ar: "يرى هاسيبوان أن التمرين اليومي أنفع.", en: "According to Hasibuan, daily practice is more useful."}
      - {speaker: Kak Reza, text: "Menurut Hasibuan, latihan harian lebih bermanfaat.", ar_eg: "على حسب هاسيبوان، التمرين اليومي أنفع.", ar: "يرى هاسيبوان أن التمرين اليومي أنفع.", en: "According to Hasibuan, daily practice is more useful."}
      - {speaker: Kak Tiara, text: "Dengan demikian, konsistensi lebih penting daripada durasi.", ar_eg: "وبكده، الاستمرارية أهم من المدة.", ar: "وعليه، فالمواظبة أهم من المدة.", en: "Therefore, consistency matters more than duration."}
      - {speaker: Kak Reza, text: "Dengan demikian, konsistensi lebih penting daripada durasi.", ar_eg: "وبكده، الاستمرارية أهم من المدة.", ar: "وعليه، فالمواظبة أهم من المدة.", en: "Therefore, consistency matters more than duration."}
      - {speaker: Kak Tiara, text: "Untuk kutipan langsung, pakai tanda petik.", ar_eg: "للنقل الحرفي، استعمل علامات التنصيص.", ar: "للاقتباس الحرفي استخدم علامتي التنصيص.", en: "For a direct quote, use quotation marks."}
      - {speaker: Kak Reza, text: "Untuk kutipan langsung, pakai tanda petik.", ar_eg: "للنقل الحرفي، استعمل علامات التنصيص.", ar: "للاقتباس الحرفي استخدم علامتي التنصيص.", en: "For a direct quote, use quotation marks."}
  - kind: outro
    title: Paragraf Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ubah kalimat ini menjadi gaya akademik: Orang Mesir suka banget minum teh."
        ar_eg: "يا محمد، حوّل الجملة دي لأسلوب أكاديمي: «المصريين بيحبوا الشاي موت»."
        ar: "يا محمد، حوّل هذه الجملة إلى أسلوب أكاديمي: «المصريون يعشقون الشاي»."
        en: "Mohamed, make this academic: Egyptians super love drinking tea."
        note:
          ar_eg: "دورك! استعمل كلمة حذرة."
          ar: "دورك! استخدم كلمة متحفظة."
          en: "Your turn! Use a careful word."
      - {speaker: Kak Reza, text: "Contohnya: Sebagian besar masyarakat Mesir cenderung mengonsumsi teh setiap hari.", ar_eg: "مثلًا: «أغلب المصريين بيميلوا إنهم يشربوا شاي كل يوم».", ar: "مثلًا: «يميل معظم المصريين إلى تناول الشاي يوميًا».", en: "For example: Most Egyptians tend to drink tea every day."}
      - {speaker: Kak Tiara, text: "Besok, tulis satu paragraf akademik dengan satu sumber.", ar_eg: "بكرة، اكتب فقرة أكاديمية فيها مصدر واحد.", ar: "غدًا، اكتب فقرة أكاديمية بمصدر واحد.", en: "Tomorrow, write one academic paragraph with one source."}
      - {speaker: Kak Reza, text: "Terima kasih, Sumatra! Terima kasih, Mohamed! Sampai jumpa di Papua.", ar_eg: "شكرًا يا سومطرة! شكرًا يا محمد! نتقابل في بابوا.", ar: "شكرًا يا سومطرة! شكرًا يا محمد! نلتقي في بابوا.", en: "Thank you, Sumatra! Thank you, Mohamed! See you in Papua."}
      - {speaker: Kak Tiara, text: "Sampai jumpa di Kabar Radio!", ar_eg: "أشوفكم في كبار راديو!", ar: "إلى اللقاء في كبار راديو!", en: "See you on Kabar Radio!"}
words: [tulisan akademik, parafrasa, kutipan langsung, mengutip, sumber, daftar pustaka, cenderung, sebagian besar, menyunting, kerangka esai, plagiarisme, dengan demikian]
review:
  status: draft
  verified: false
  notes: |
    "Hasibuan" and his book are imaginary, flagged in the dialogue note. Check that
    Hasibuan doesn't clash with a registry name. Spot-check: Berastagi near Sinabung;
    EYD/KBBI as academic standards (PUEBI was replaced by EYD V in 2022).
