schema: kabar.radio/v1
id: radio.bipa3.u10
language: id
level: bipa3
unit: bipa3.u10
title:
  target: Rencananya, kami mudik
  ar_eg: ناويين نرجع البلد
  ar: ننوي العودة إلى الديار
  en: The plan is, we're going home
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pelabuhan Labuhan Lombok
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Pelabuhan Labuhan Lombok! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من ميناء لابوهان لومبوك! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من ميناء لابوهان لومبوك! هذا كبار راديو. أنا تيارا.", en: "Good morning from Labuhan Lombok harbour! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Ini episode terakhir kita di Lombok. Nanti siang kita naik feri ke Sumbawa.", ar_eg: "أنا رضا. دي آخر حلقة لينا في لومبوك. الضهر هنركب العبّارة لسومباوا.", ar: "أنا رضا. هذه آخر حلقاتنا في لومبوك. ظهرًا سنركب العبّارة إلى سومباوا.", en: "I'm Reza. This is our last episode on Lombok. At noon we'll take the ferry to Sumbawa."}
      - speaker: Kak Tiara
        text: "Pelabuhannya rame banget, soalnya minggu depan Lebaran. Semua orang mudik!"
        ar_eg: "الميناء زحمة أوي، عشان العيد الأسبوع الجاي. كل الناس راجعة بلدها."
        ar: "الميناء مزدحم جدًا، لأن العيد الأسبوع القادم والجميع عائدون إلى ديارهم."
        en: "The harbour is packed, because Lebaran is next week. Everyone's going home."
        note:
          ar_eg: "mudik = الرجوع للبلد في العيد. ملايين بيسافروا في نفس الأيام، من أكبر الهجرات السنوية في العالم."
          ar: "mudik = العودة إلى البلدة في العيد، ويسافر فيه الملايين في الأيام نفسها، وهو من أكبر الهجرات السنوية في العالم."
          en: "Mudik = going home for Lebaran; millions travel in the same days, one of the world's biggest annual migrations."
      - {speaker: Kak Reza, text: "Hari ini kita belajar bikin rencana pakai akan, nanti, sama rencananya.", ar_eg: "النهارده هنتعلم نخطط بـakan وnanti وrencananya.", ar: "اليوم نتعلم وضع الخطط بـakan وnanti وrencananya.", en: "Today we learn to make plans with akan, nanti and rencananya."}
      - {speaker: Kak Tiara, text: "Mohamed, liburan nanti rencananya ke mana?", ar_eg: "يا محمد، إيه خطتك للأجازة الجاية؟", ar: "يا محمد، ما خطتك للعطلة القادمة؟", en: "Mohamed, what are your plans for your next holiday?"}
  - kind: dialogue
    title: Pesan tiket feri
    lines:
      - speaker: Kak Tiara
        text: "Reza, kamu belum beli tiket, kan? Aku jadi petugas loket."
        ar_eg: "يا رضا، إنت لسه مشتريتش التذكرة، صح؟ أنا هبقى موظفة الشباك."
        ar: "يا رضا، لم تشترِ التذكرة بعد، أليس كذلك؟ سأكون موظفة الشباك."
        en: "Reza, you haven't bought a ticket yet, have you? I'll be the ticket clerk."
        note:
          ar_eg: "تمثيلية عند الشباك. مع الموظفة: Bu وsaya."
          ar: "مشهد تمثيلي عند شباك التذاكر. ومع الموظفة: Bu وsaya."
          en: "A role-play at the ticket counter. With the clerk: Bu, saya."
      - {speaker: Kak Reza, text: "Selamat pagi, Bu. Saya mau membeli tiket feri ke Poto Tano untuk siang ini.", ar_eg: "صباح الخير يا مدام. عايز أشتري تذكرة عبّارة لبوتو تانو النهارده الضهر.", ar: "صباح الخير. أريد شراء تذكرة عبّارة إلى بوتو تانو لظهر اليوم.", en: "Good morning. I'd like a ferry ticket to Poto Tano for this afternoon."}
      - {speaker: Kak Tiara, text: "Maaf, Pak, feri jam dua belas sudah penuh. Ada feri jam tiga.", ar_eg: "آسفة يا أستاذ، عبّارة الساعة اتناشر اتملت. فيه عبّارة الساعة تلاتة.", ar: "عذرًا يا سيدي، عبّارة الثانية عشرة ممتلئة. هناك عبّارة في الثالثة.", en: "Sorry, sir, the twelve o'clock ferry is full. There's one at three."}
      - {speaker: Kak Reza, text: "Jam tiga tidak apa-apa. Berapa lama perjalanannya?", ar_eg: "الساعة تلاتة ماشي. الرحلة قد إيه؟", ar: "الثالثة لا بأس. كم تستغرق الرحلة؟", en: "Three is fine. How long is the crossing?"}
      - {speaker: Kak Tiara, text: "Sekitar dua jam. Bapak akan tiba di Sumbawa jam lima sore.", ar_eg: "حوالي ساعتين. هتوصل سومباوا الساعة خمسة العصر.", ar: "نحو ساعتين، وستصل إلى سومباوا في الخامسة مساءً.", en: "About two hours. You'll arrive in Sumbawa at five."}
      - {speaker: Kak Reza, text: "Satu orang dewasa, tanpa kendaraan.", ar_eg: "واحد كبير، من غير عربية.", ar: "راكب بالغ واحد، دون مركبة.", en: "One adult, no vehicle."}
      - {speaker: Kak Tiara, text: "Baik. Tolong datang setengah jam sebelumnya, ya. Nanti antrean panjang.", ar_eg: "تمام. لو سمحت تعالى قبلها بنص ساعة. هيبقى فيه طابور طويل.", ar: "حسنًا. تعالَ قبل الموعد بنصف ساعة من فضلك، فسيكون الطابور طويلًا.", en: "All right. Please come half an hour early. The queue will be long."}
      - {speaker: Kak Reza, text: "Makasih, Bu. Selamat Lebaran, ya.", ar_eg: "شكرًا يا مدام. وكل سنة وإنتي طيبة.", ar: "شكرًا. وعيدًا سعيدًا مقدّمًا.", en: "Thank you. Happy Lebaran when it comes."}
      - {speaker: Kak Tiara, text: "Reza, Lebaran nanti mau ke mana?", ar_eg: "يا رضا، إيه خطتك للعيد؟", ar: "يا رضا، ما خطتك للعيد؟", en: "Reza, what are your plans for Lebaran?"}
      - {speaker: Kak Reza, text: "Rencananya, aku mudik ke Bandung. Salat Id bareng keluarga.", ar_eg: "ناوي أرجع باندونج. هصلي العيد مع العيلة.", ar: "أنوي العودة إلى باندونغ، وسأصلي العيد مع العائلة.", en: "The plan is to go home to Bandung. I'll pray Eid prayers with my family.", note: {ar_eg: "في الكلام akan بتقع كتير: الوقت بيبان من rencananya وnanti.", ar: "في الكلام تسقط akan كثيرًا، والزمن يظهر من rencananya وnanti.", en: "In speech akan often drops; rencananya and nanti already show the future."}}
      - {speaker: Kak Tiara, text: "Aku belum tahu. Mungkin ke Jogja, deh.", ar_eg: "أنا لسه مش عارفة. يمكن أروح يوجياكارتا.", ar: "لا أعرف بعد. ربما أذهب لاحقًا إلى يوجياكارتا.", en: "I don't know yet. Jogja, maybe.", note: {ar_eg: "Jogja = Yogyakarta في الكلام.", ar: "Jogja = Yogyakarta في الكلام اليومي.", en: "Jogja is what everyone calls Yogyakarta."}}
      - {speaker: Kak Reza, text: "Habis Lebaran, Kabar Radio pindah ke Sulawesi!", ar_eg: "بعد العيد، كبار راديو هينقل سولاويسي!", ar: "بعد العيد سينتقل كبار راديو إلى سولاويسي!", en: "After Lebaran, Kabar Radio moves to Sulawesi!"}
  - kind: word_spotlight
    title: Akan, nanti, rencananya
    lines:
      - speaker: Kak Tiara
        text: "Akan untuk masa depan. Saya akan naik feri."
        ar_eg: "akan للمستقبل. أنا هركب العبّارة."
        ar: "akan للمستقبل. سأركب العبّارة."
        en: "Akan is for the future. I will take the ferry."
        note:
          ar_eg: "الفعل الإندونيسي مبيتغيرش مع الزمن. akan زي «هـ» أو «سـ»."
          ar: "الفعل الإندونيسي لا يتغير بالزمن، وakan مثل «سـ / سوف»."
          en: "Indonesian verbs don't change for tense; akan works like 'will'."
      - {speaker: Kak Reza, text: "Nanti. Nanti siang, nanti malam. Nanti saya telepon, ya.", ar_eg: "بعدين. الضهر، بالليل. هكلمك بعدين.", ar: "لاحقًا. ظهر اليوم، الليلة. سأتصل بك لاحقًا.", en: "Later. This noon, tonight. I'll call you later."}
      - {speaker: Kak Tiara, text: "Rencananya. Rencananya kami berangkat jam tiga.", ar_eg: "الخطة إن. الخطة إننا نمشي الساعة تلاتة.", ar: "حسب الخطة. حسب الخطة ننطلق في الثالثة.", en: "The plan is. The plan is we leave at three."}
      - {speaker: Kak Reza, text: "Kalau ngobrol, akan sering hilang: Nanti aku telepon. Besok kita berangkat.", ar_eg: "في الكلام akan بتختفي كتير: هكلمك بعدين. بكرة هنسافر.", ar: "في الكلام تختفي akan كثيرًا: سأتصل بك لاحقًا. غدًا نسافر.", en: "In conversation akan often vanishes: I'll call you later. We leave tomorrow."}
      - {speaker: Kak Reza, text: "Mudik, arus mudik, arus balik. Arus balik itu perjalanan kembali ke kota.", ar_eg: "الرجوع للبلد، زحمة الرجوع، زحمة العودة. arus balik هي رحلة الرجوع للمدينة.", ar: "العودة إلى البلدة، موجة العودة، موجة الرجوع. arus balik رحلة الرجوع إلى المدينة.", en: "Going home, the homeward rush, the return rush. Arus balik is the trip back to the city."}
      - {speaker: Kak Tiara, text: "Idulfitri, Iduladha, Tahun Baru Islam, Hari Kemerdekaan, Natal, Nyepi.", ar_eg: "عيد الفطر، عيد الأضحى، رأس السنة الهجرية، عيد الاستقلال، الكريسماس، نيبي.", ar: "عيد الفطر، عيد الأضحى، رأس السنة الهجرية، يوم الاستقلال، عيد الميلاد، نيبي.", en: "Eid al-Fitr, Eid al-Adha, Islamic New Year, Independence Day, Christmas, Nyepi."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Saya mau membeli tiket feri untuk siang ini."
        ar_eg: "عايز أشتري تذكرة عبّارة للنهارده الضهر."
        ar: "أريد شراء تذكرة عبّارة لظهر اليوم."
        en: "I'd like a ferry ticket for this afternoon."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Saya mau membeli tiket feri untuk siang ini.", ar_eg: "عايز أشتري تذكرة عبّارة للنهارده الضهر.", ar: "أريد شراء تذكرة عبّارة لظهر اليوم.", en: "I'd like a ferry ticket for this afternoon."}
      - {speaker: Kak Tiara, text: "Berapa lama perjalanannya?", ar_eg: "الرحلة قد إيه؟", ar: "كم تستغرق الرحلة؟", en: "How long is the journey?"}
      - {speaker: Kak Reza, text: "Berapa lama perjalanannya?", ar_eg: "الرحلة قد إيه؟", ar: "كم تستغرق الرحلة؟", en: "How long is the journey?"}
      - {speaker: Kak Tiara, text: "Rencananya, saya akan mudik.", ar_eg: "ناوي أرجع البلد.", ar: "أنوي العودة إلى بلدتي.", en: "The plan is, I'll go home."}
      - {speaker: Kak Reza, text: "Rencananya, saya akan mudik.", ar_eg: "ناوي أرجع البلد.", ar: "أنوي العودة إلى بلدتي.", en: "The plan is, I'll go home."}
      - {speaker: Kak Tiara, text: "Nanti malam aku telepon, ya.", ar_eg: "هكلمك بالليل.", ar: "سأتصل بك الليلة.", en: "I'll call you tonight."}
      - {speaker: Kak Reza, text: "Nanti malam aku telepon, ya.", ar_eg: "هكلمك بالليل.", ar: "سأتصل بك الليلة.", en: "I'll call you tonight."}
  - kind: outro
    title: Rencana Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, apa rencanamu untuk Idulfitri? Pakai 'rencananya' dan 'akan'."
        ar_eg: "يا محمد، إيه خطتك لعيد الفطر؟ استخدم rencananya وakan."
        ar: "يا محمد، ما خطتك لعيد الفطر؟ استعمل rencananya وakan."
        en: "Mohamed, what are your plans for Eid al-Fitr? Use 'rencananya' and 'akan'."
        note:
          ar_eg: "دورك! جملتين عن خطتك."
          ar: "دورك! جملتان عن خطتك."
          en: "Your turn! Two sentences about your plans."
      - {speaker: Kak Reza, text: "Contohnya: Rencananya, saya akan salat Id di masjid dekat rumah. Lalu saya akan mengunjungi kakek dan nenek.", ar_eg: "مثلًا: ناوي أصلي العيد في الجامع اللي جنب البيت. وبعدين هزور جدي وجدتي.", ar: "مثلًا: أنوي صلاة العيد في المسجد القريب من البيت، ثم سأزور جدي وجدتي.", en: "For example: The plan is I'll pray Eid prayers at the mosque near home. Then I'll visit my grandparents."}
      - {speaker: Kak Tiara, text: "Besok, tulis rencana liburanmu: ke mana, naik apa, berapa lama.", ar_eg: "بكرة، اكتب خطة أجازتك: رايح فين، بإيه، وقد إيه.", ar: "غدًا، اكتب خطة عطلتك: إلى أين، وبماذا، وكم المدة.", en: "Tomorrow, write your holiday plan: where, how, and for how long."}
      - {speaker: Kak Reza, text: "Makasih, Lombok! Makasih, Mohamed! Sampai ketemu di Sulawesi.", ar_eg: "شكرًا يا لومبوك! شكرًا يا محمد! نتقابل في سولاويسي.", ar: "شكرًا يا لومبوك! شكرًا يا محمد! نلتقي في سولاويسي.", en: "Thank you, Lombok! Thank you, Mohamed! See you in Sulawesi.", note: {ar_eg: "Sampai ketemu = sampai jumpa في الكلام.", ar: "Sampai ketemu = sampai jumpa في الكلام اليومي.", en: "Sampai ketemu = everyday sampai jumpa."}}
      - {speaker: Kak Tiara, text: "Sampai ketemu di Kabar Radio!", ar_eg: "أشوفكم في كبار راديو!", ar: "إلى اللقاء في كبار راديو!", en: "See you on Kabar Radio!"}
words: [akan, nanti, rencana, mudik, tiket, feri, pelabuhan, loket, berangkat, Idulfitri, Iduladha, minggu depan]
