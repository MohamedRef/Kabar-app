schema: kabar.radio/v1
id: radio.bipa5.u08
language: id
level: bipa5
unit: bipa5.u08
title:
  target: Tampaknya, semua orang punya pendapat
  ar_eg: شكله كده كل الناس ليها رأي
  ar: يبدو أن لكل امرئ رأيًا
  en: It seems everyone has an opinion
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Pagi di Martapura
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Martapura, kota intan! Ini Kabar Radio. Saya Tiara.", ar_eg: "صباح الخير من مارتابورا، مدينة الألماظ! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من مارتابورا، مدينة الماس! هذا كبار راديو. أنا تيارا.", en: "Good morning from Martapura, the diamond town! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Hari ini kita tidak membeli intan. Kita membaca opini di koran.", ar_eg: "أنا رضا. النهارده مش هنشتري ألماظ. هنقرا مقالات رأي في الجرنال.", ar: "أنا رضا. لن نشتري الماس اليوم، بل سنقرأ مقالات الرأي في الصحيفة.", en: "I'm Reza. Today we won't buy diamonds. We'll read opinion pieces in the paper."}
      - {speaker: Kak Tiara, text: "Penulis opini di Indonesia sering memakai bahasa yang lembut dan hati-hati.", ar_eg: "كتّاب الرأي في إندونيسيا غالبًا بيستعملوا لغة ناعمة وحذرة.", ar: "يميل كتّاب الرأي في إندونيسيا إلى لغة لطيفة متحفظة.", en: "Opinion writers in Indonesia often use soft, careful language."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar melunakkan pendapat: tampaknya, barangkali, sepertinya."
        ar_eg: "النهارده هنتعلم نليّن رأينا: شكله، يمكن، على ما يبدو."
        ar: "اليوم نتعلم تلطيف الرأي: يبدو، ربما، على ما يظهر."
        en: "Today we learn to soften opinions: tampaknya, barangkali, sepertinya."
      - {speaker: Kak Tiara, text: "Mohamed, di Mesir, orang bicara langsung atau berputar-putar?", ar_eg: "يا محمد، في مصر الناس بتتكلم دغري ولا بتلف وتدور؟", ar: "يا محمد، في مصر هل يتكلم الناس مباشرة أم يدورون حول الموضوع؟", en: "Mohamed, in Egypt, do people speak directly or go round the houses?"}
  - kind: dialogue
    title: Dua cara bicara
    lines:
      - speaker: Kak Tiara
        text: "Kita baca kolom opini tentang kemacetan. Dengar bedanya kalimat langsung dan kalimat yang dilunakkan."
        ar_eg: "هنقرا عمود رأي عن الزحمة. اسمع الفرق بين الجملة الدغري والجملة الملينة."
        ar: "سنقرأ عمود رأي عن الازدحام. استمع إلى الفرق بين الجملة الصريحة والملطّفة."
        en: "Let's read an op-ed about traffic. Hear the difference between blunt and softened sentences."
        note:
          ar_eg: "الكلام الدغري أوي ممكن يتفهم إنه قلة ذوق في إندونيسيا."
          ar: "قد يُعدّ الكلام شديد الصراحة فظاظةً في إندونيسيا."
          en: "Very blunt speech can come across as rude in Indonesia."
      - {speaker: Kak Reza, text: "Kalimat langsung: Pemerintah kota gagal mengatasi kemacetan.", ar_eg: "الجملة الدغري: «حكومة المدينة فشلت في حل الزحمة».", ar: "الصريحة: «فشلت حكومة المدينة في معالجة الازدحام».", en: "Blunt: The city government has failed to tackle traffic."}
      - {speaker: Kak Tiara, text: "Kalimat lembut: Tampaknya upaya mengatasi kemacetan belum membuahkan hasil.", ar_eg: "الجملة الناعمة: «شكله كده الجهود لحل الزحمة لسه ما جابتش نتيجة».", ar: "الملطّفة: «يبدو أن جهود معالجة الازدحام لم تؤتِ ثمارها بعد».", en: "Soft: It seems efforts to tackle traffic haven't borne fruit yet."}
      - {speaker: Kak Reza, text: "Nah, artinya hampir sama, tetapi rasanya berbeda.", ar_eg: "أهو، المعنى تقريبًا واحد، بس الإحساس مختلف.", ar: "المعنى متقارب، لكن الوقع مختلف.", en: "See, the meaning is almost the same, but it feels different."}
      - {speaker: Kak Tiara, text: "Penulis juga mengutip survei: sebagian besar responden tidak puas.", ar_eg: "الكاتب كمان بيستشهد باستطلاع: أغلب اللي اتسألوا مش راضيين.", ar: "ويستشهد الكاتب باستطلاع: معظم المستطلَعين غير راضين.", en: "The writer also quotes a survey: most respondents are dissatisfied."}
      - {speaker: Kak Reza, text: "Tapi berapa orang yang ditanya? Siapa yang membuat survei? Kita harus kritis.", ar_eg: "بس سألوا كام واحد؟ ومين عمل الاستطلاع؟ لازم نبقى ناقدين.", ar: "لكن كم عدد من سُئلوا؟ ومن أجرى الاستطلاع؟ علينا أن نكون ناقدين.", en: "But how many people were asked? Who ran the survey? We must be critical."}
      - {speaker: Kak Tiara, text: "Betul. Barangkali surveinya kecil. Sepertinya penulis juga punya kepentingan.", ar_eg: "صح. يمكن الاستطلاع كان صغير. وعلى ما يبدو الكاتب ليه مصلحة كمان.", ar: "صحيح. ربما كان الاستطلاع صغيرًا، ويبدو أن للكاتب مصلحة أيضًا.", en: "True. Maybe the survey was small. It seems the writer has an interest too."}
      - {speaker: Kak Reza, text: "Kalau mau menanggapi, mulai dengan: Saya menghargai pendapat penulis, namun…", ar_eg: "لو عايز ترد، ابدأ بـ: «أنا مقدّر رأي الكاتب، إنما…»", ar: "إن أردت الرد فابدأ بـ: «أقدّر رأي الكاتب، غير أن…»", en: "If you want to respond, start with: I appreciate the writer's view, however…"}
      - {speaker: Kak Tiara, text: "Sopan, tetapi tetap jelas. Itu seni berdebat ala Indonesia.", ar_eg: "بأدب، بس برضه واضح. ده فن النقاش على الطريقة الإندونيسية.", ar: "مهذّب وواضح في آن. ذلك فن النقاش على الطريقة الإندونيسية.", en: "Polite, but still clear. That's the Indonesian art of debate."}
  - kind: word_spotlight
    title: Tampaknya, barangkali
    lines:
      - speaker: Kak Tiara
        text: "Tampaknya dan sepertinya artinya it seems. Barangkali dan mungkin artinya maybe."
        ar_eg: "tampaknya وsepertinya يعني «شكله/على ما يبدو». barangkali وmungkin يعني «يمكن»."
        ar: "tampaknya وsepertinya بمعنى «يبدو»، وbarangkali وmungkin بمعنى «ربما»."
        en: "Tampaknya and sepertinya mean it seems. Barangkali and mungkin mean maybe."
        note:
          ar_eg: "barangkali أرسم شوية من mungkin."
          ar: "barangkali أكثر رسمية قليلًا من mungkin."
          en: "Barangkali is a bit more formal than mungkin."
      - {speaker: Kak Reza, text: "Belum tentu, kurang tepat, perlu dipertimbangkan lagi.", ar_eg: "مش أكيد، مش مظبوط أوي، محتاج نفكر فيه تاني.", ar: "ليس بالضرورة، غير دقيق تمامًا، يحتاج إلى إعادة نظر.", en: "Not necessarily, not quite right, needs more thought."}
      - {speaker: Kak Tiara, text: "Survei, jajak pendapat, responden, data, sumber.", ar_eg: "استطلاع، استفتاء رأي، المشاركين، بيانات، مصدر.", ar: "مسح، استطلاع رأي، مستجيبون، بيانات، مصدر.", en: "Survey, opinion poll, respondents, data, source."}
      - {speaker: Kak Reza, text: "Saya menghargai pendapat Anda, namun saya melihatnya dari sisi lain.", ar_eg: "أنا مقدّر رأي حضرتك، إنما أنا شايفها من ناحية تانية.", ar: "أقدّر رأيك، غير أنني أراه من زاوية أخرى.", en: "I appreciate your view, however I see it from another side."}
      - {speaker: Kak Tiara, text: "Kolom opini, tajuk rencana, penulis, pembaca, tanggapan.", ar_eg: "عمود رأي، افتتاحية، الكاتب، القارئ، رد.", ar: "عمود رأي، افتتاحية، الكاتب، القارئ، تعقيب.", en: "Opinion column, editorial, writer, reader, response."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Tampaknya upaya itu belum berhasil."
        ar_eg: "شكله كده المحاولة دي لسه ما نجحتش."
        ar: "يبدو أن تلك الجهود لم تنجح بعد."
        en: "It seems that effort hasn't worked yet."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Tampaknya upaya itu belum berhasil.", ar_eg: "شكله كده المحاولة دي لسه ما نجحتش.", ar: "يبدو أن تلك الجهود لم تنجح بعد.", en: "It seems that effort hasn't worked yet."}
      - {speaker: Kak Tiara, text: "Barangkali surveinya terlalu kecil.", ar_eg: "يمكن الاستطلاع كان صغير أوي.", ar: "ربما كان الاستطلاع صغيرًا جدًا.", en: "Maybe the survey was too small."}
      - {speaker: Kak Reza, text: "Barangkali surveinya terlalu kecil.", ar_eg: "يمكن الاستطلاع كان صغير أوي.", ar: "ربما كان الاستطلاع صغيرًا جدًا.", en: "Maybe the survey was too small."}
      - {speaker: Kak Tiara, text: "Saya menghargai pendapat Anda, namun…", ar_eg: "أنا مقدّر رأي حضرتك، إنما…", ar: "أقدّر رأيك، غير أن…", en: "I appreciate your view, however…"}
      - {speaker: Kak Reza, text: "Saya menghargai pendapat Anda, namun…", ar_eg: "أنا مقدّر رأي حضرتك، إنما…", ar: "أقدّر رأيك، غير أن…", en: "I appreciate your view, however…"}
      - {speaker: Kak Tiara, text: "Hal itu perlu dipertimbangkan lagi.", ar_eg: "الحكاية دي محتاجة نفكر فيها تاني.", ar: "هذا الأمر يحتاج إلى إعادة نظر.", en: "That needs more thought."}
      - {speaker: Kak Reza, text: "Hal itu perlu dipertimbangkan lagi.", ar_eg: "الحكاية دي محتاجة نفكر فيها تاني.", ar: "هذا الأمر يحتاج إلى إعادة نظر.", en: "That needs more thought."}
  - kind: outro
    title: Lunakkan, Mohamed!
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, lunakkan kalimat ini: Rapat kantor kita terlalu panjang dan tidak berguna."
        ar_eg: "يا محمد، ليّن الجملة دي: «اجتماعات شغلنا طويلة أوي ومالهاش لازمة»."
        ar: "يا محمد، لطّف هذه الجملة: «اجتماعات عملنا طويلة جدًا وعديمة الفائدة»."
        en: "Mohamed, soften this sentence: Our office meetings are too long and useless."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Sepertinya rapat kita bisa lebih singkat, barangkali dengan agenda yang lebih jelas.", ar_eg: "مثلًا: «على ما يبدو اجتماعاتنا ممكن تبقى أقصر، يمكن بجدول أوضح».", ar: "مثلًا: «يبدو أن اجتماعاتنا يمكن أن تكون أقصر، ربما بجدول أعمال أوضح».", en: "For example: It seems our meetings could be shorter, perhaps with a clearer agenda."}
      - {speaker: Kak Tiara, text: "Besok, baca satu opini dan tulis tanggapan yang sopan.", ar_eg: "بكرة، اقرا مقالة رأي واكتب رد مؤدب.", ar: "غدًا، اقرأ مقالة رأي واكتب تعقيبًا مهذبًا.", en: "Tomorrow, read one op-ed and write a polite response."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Tampaknya kamu sudah pintar!", ar_eg: "شكرًا يا محمد. شكلك كده بقيت شاطر!", ar: "شكرًا يا محمد. يبدو أنك صرت بارعًا!", en: "Thank you, Mohamed. It seems you're getting good!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [tampaknya, barangkali, jajak pendapat, responden, tanggapan, kritis, hasil, kolom, kurang tepat, sebagian]
review:
  status: draft
  verified: false
  notes: |
    Spot-check: Martapura known for diamond trade. The op-ed and survey are fictional.
