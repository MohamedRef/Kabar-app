title:
  target: Smong, kata yang menyelamatkan
  ar_eg: سمونج، الكلمة اللي نجّت الناس
  ar: سمونغ، الكلمة التي أنقذت الأرواح
  en: Smong, the word that saved lives
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Serambi Mekkah
    lines:
      - {speaker: Kak Tiara, text: "Assalamualaikum dari Banda Aceh, Serambi Mekkah. Ini Kabar Radio. Aku Tiara.", ar_eg: "السلام عليكم من باندا آتشيه، شُرفة مكة. ده كبار راديو. أنا تيارا.", ar: "السلام عليكم من باندا آتشيه، شرفة مكة. هذا كبار راديو. أنا تيارا.", en: "Assalamualaikum from Banda Aceh, the Veranda of Mecca. This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Waalaikumsalam. Aku Reza. Aceh disebut gitu karena Islam udah berakar di sini dari lama.", ar_eg: "وعليكم السلام. أنا رضا. آتشيه بيتسموها كده عشان الإسلام اتجذّر هنا من زمان.", ar: "وعليكم السلام. أنا رضا. سُميت آتشيه كذلك لأن الإسلام ترسّخ فيها منذ زمن بعيد.", en: "Waalaikumsalam. I'm Reza. Aceh is called that because Islam took root here long ago."}
      - {speaker: Kak Tiara, text: "Hari ini kita juga mengenang tsunami tahun 2004, dan bagaimana Aceh bangkit kembali.", ar_eg: "النهارده كمان هنفتكر تسونامي سنة 2004، وإزاي آتشيه قامت تاني.", ar: "ونستذكر اليوم أيضًا تسونامي عام 2004، وكيف نهضت آتشيه من جديد.", en: "Today we also remember the 2004 tsunami, and how Aceh rose again."}
      - speaker: Kak Reza
        text: "Kita belajar istilah keagamaan dalam bahasa Indonesia, sama cara ngomong hati-hati soal topik sensitif."
        ar_eg: "هنتعلم المصطلحات الدينية بالإندونيسي، وإزاي نتكلم بحذر في المواضيع الحساسة."
        ar: "نتعلم المصطلحات الدينية بالإندونيسية، وكيف نتحدث بحذر في الموضوعات الحساسة."
        en: "We learn religious terms in Indonesian, and how to speak carefully about sensitive topics."
      - {speaker: Kak Tiara, text: "Mohamed, banyak kata hari ini bakal kedengeran akrab buat kamu.", ar_eg: "يا محمد، كلمات كتير النهارده هتلاقيها مألوفة عندك.", ar: "يا محمد، ستبدو لك كلمات كثيرة اليوم مألوفة.", en: "Mohamed, many words today will sound familiar to you."}
  - kind: dialogue
    title: Di Museum Tsunami
    lines:
      - speaker: Kak Tiara
        text: "Kita lagi di Museum Tsunami Aceh. Suasananya tenang. Kita ngomong pelan-pelan."
        ar_eg: "إحنا في متحف تسونامي آتشيه. الجو هادي. بنتكلم بالراحة."
        ar: "نحن في متحف تسونامي آتشيه. الأجواء هادئة، ونتحدث بصوت خافت."
        en: "We're at the Aceh Tsunami Museum. It's quiet. We speak softly."
        note:
          ar_eg: "موضوع حزين. خلي بالك من الكلمات اللي بتعبّر عن التعاطف."
          ar: "موضوع حزين. انتبه إلى عبارات المواساة."
          en: "A sad topic. Listen for words of sympathy."
      - {speaker: Kak Reza, text: "Di dinding ini tertulis nama-nama korban. Semoga mereka mendapat tempat terbaik di sisi-Nya.", ar_eg: "على الحيطة دي مكتوبة أسامي الضحايا. ربنا يرحمهم ويجعل مثواهم الجنة.", ar: "على هذا الجدار أسماء الضحايا. رحمهم الله وأحسن مثواهم.", en: "The victims' names are written on this wall. May they rest in the best place beside Him."}
      - {speaker: Kak Tiara, text: "Aamiin. Tapi ada juga cerita harapan. Pernah denger soal smong?", ar_eg: "آمين. بس فيه كمان حكاية أمل. سمعت عن سمونج قبل كده؟", ar: "آمين. لكن ثمة حكاية أمل أيضًا. هل سمعت بـ«سمونغ»؟", en: "Amen. But there's also a story of hope. Have you heard of smong?"}
      - {speaker: Kak Reza, text: "Smong itu kata dari Pulau Simeulue. Artinya gelombang besar dari laut.", ar_eg: "سمونج كلمة من جزيرة سيميولوي. معناها الموجة الكبيرة اللي جاية من البحر.", ar: "سمونغ كلمة من جزيرة سيميولوي، ومعناها الموج العظيم القادم من البحر.", en: "Smong is a word from Simeulue Island. It means a great wave from the sea."}
      - {speaker: Kak Tiara, text: "Nenek moyang mereka mewariskan syair: kalau gempa kuat dan air laut surut, larilah ke bukit.", ar_eg: "أجدادهم سابولهم أغنية: لو الزلزال جامد والبحر انسحب، اجروا على التل.", ar: "ورثوا عن أجدادهم أنشودة: إذا اشتد الزلزال وانحسر البحر، فاهربوا إلى التلال.", en: "Their ancestors handed down a chant: if the quake is strong and the sea pulls back, run to the hills."}
      - {speaker: Kak Reza, text: "Gara-gara cerita itu, banyak warga Simeulue selamat tahun 2004.", ar_eg: "بفضل الحكاية دي، ناس كتير من أهل سيميولوي نجيوا سنة 2004.", ar: "وبفضل تلك الحكاية نجا كثير من أهل سيميولوي عام 2004.", en: "Thanks to that story, many people on Simeulue survived in 2004.", note: {ar_eg: "في الكلام gara-gara = بسبب (berkat/karena)، حتى لو الحاجة كويسة.", ar: "في الكلام gara-gara = بسبب (berkat/karena)، ولو كان الأمر حسنًا.", en: "In speech gara-gara = because of (berkat/karena), even for good things."}}
      - {speaker: Kak Tiara, text: "Kearifan lokal bisa menyelamatkan nyawa. Sekarang sekolah-sekolah juga melatih siap siaga bencana.", ar_eg: "الحكمة الشعبية ممكن تنجّي أرواح. ودلوقتي المدارس كمان بتدرّب على الاستعداد للكوارث.", ar: "الحكمة المحلية قد تنقذ الأرواح، والمدارس اليوم تدرّب أيضًا على الاستعداد للكوارث.", en: "Local wisdom can save lives. Now schools also train for disaster preparedness."}
      - {speaker: Kak Reza, text: "Setelah tsunami, bantuan datang dari banyak negara dan banyak agama. Aceh bangkit bersama.", ar_eg: "بعد التسونامي، المساعدات جت من دول كتير وأديان كتير. وآتشيه قامت بالكل مع بعض.", ar: "بعد التسونامي جاءت المساعدات من بلدان وأديان كثيرة، ونهضت آتشيه بتكاتف الجميع.", en: "After the tsunami, help came from many countries and many faiths. Aceh rose together."}
      - {speaker: Kak Tiara, text: "Nanti malam ada pertunjukan Tari Saman. Penarinya duduk berbaris, terus gerak bareng-bareng.", ar_eg: "الليلة فيه عرض رقصة سامان. الراقصين بيقعدوا في صف ويتحركوا كلهم في نفس اللحظة.", ar: "الليلة عرض لرقصة سامان؛ يجلس الراقصون في صف ويتحركون بتناغم تام.", en: "Tonight there's a Saman dance show. The dancers sit in a row and move in unison."}
      - {speaker: Kak Reza, text: "Seperti masyarakat Aceh: kuat karena bersatu.", ar_eg: "زي أهل آتشيه بالظبط: أقويا عشان متحدين.", ar: "كأهل آتشيه: أقوياء لأنهم متحدون.", en: "Like the people of Aceh: strong because they're united."}
  - kind: word_spotlight
    title: Istilah keagamaan
    lines:
      - speaker: Kak Tiara
        text: "Kata dari Arab yang biasa: ibadah, syariat, zakat, wakaf, musala, pesantren, ulama."
        ar_eg: "كلمات عربي عادية: عبادة، شريعة، زكاة، وقف، مُصلّى، معهد ديني، علماء."
        ar: "كلمات عربية شائعة: عبادة، شريعة، زكاة، وقف، مصلّى، معهد ديني، علماء."
        en: "Common Arabic words: worship, sharia, zakat, endowment, prayer room, pesantren, scholars."
        note:
          ar_eg: "خلي بالك: ulama في الإندونيسي ممكن تبقى مفرد: «عالِم واحد»."
          ar: "تنبّه: ulama في الإندونيسية قد تأتي مفردًا بمعنى «عالِم»."
          en: "Careful: ulama in Indonesian can be singular: 'a scholar'."
      - {speaker: Kak Reza, text: "Untuk berduka: Turut berduka cita. Semoga diberi ketabahan.", ar_eg: "عشان تعزّي: «البقاء لله». «ربنا يصبّركم».", ar: "للتعزية: «أحسن الله عزاءكم». «ألهمكم الله الصبر».", en: "To offer condolences: My deepest sympathy. May you be given strength."}
      - {speaker: Kak Tiara, text: "Bencana, gempa bumi, tsunami, korban, pengungsi, bantuan, pemulihan.", ar_eg: "كارثة، زلزال، تسونامي، ضحية، نازح، مساعدة، تعافي.", ar: "كارثة، زلزال، تسونامي، ضحية، نازح، معونة، تعافٍ.", en: "Disaster, earthquake, tsunami, victim, evacuee, aid, recovery."}
      - {speaker: Kak Reza, text: "Kearifan lokal, siap siaga, jalur evakuasi, titik kumpul.", ar_eg: "حكمة شعبية، استعداد، طريق الإخلاء، نقطة التجمع.", ar: "حكمة محلية، جاهزية، مسار الإخلاء، نقطة التجمّع.", en: "Local wisdom, preparedness, evacuation route, assembly point."}
      - {speaker: Kak Tiara, text: "Dialog antariman: saling menghormati, saling membantu.", ar_eg: "حوار بين الأديان: احترام متبادل، ومساعدة متبادلة.", ar: "الحوار بين الأديان: احترام متبادل وعون متبادل.", en: "Interfaith dialogue: mutual respect, mutual help."}
      - speaker: Kak Reza
        text: "Sama teman yang lagi berduka, cukup pelan aja: Aku ikut sedih, ya. Kalau butuh apa-apa, bilang aja."
        ar_eg: "مع صاحبك اللي عنده عزا، كفاية كلام هادي: أنا زعلان معاك. لو احتجت أي حاجة قولّي."
        ar: "مع صديق في حداد يكفي كلام هادئ: أنا حزين معك. إن احتجت شيئًا فأخبرني."
        en: "With a grieving friend, keep it gentle: I'm so sorry. If you need anything, just say."
        note:
          ar_eg: "Turut berduka cita للرسمي والرسايل. بين الصحاب: aku ikut sedih."
          ar: "Turut berduka cita للمواقف الرسمية والرسائل، وبين الأصدقاء: aku ikut sedih."
          en: "Turut berduka cita is formal and for messages; among friends: aku ikut sedih."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Turut berduka cita. Semoga diberi ketabahan."
        ar_eg: "البقاء لله. ربنا يصبّركم."
        ar: "أحسن الله عزاءكم، وألهمكم الصبر."
        en: "My deepest sympathy. May you be given strength."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Turut berduka cita. Semoga diberi ketabahan.", ar_eg: "البقاء لله. ربنا يصبّركم.", ar: "أحسن الله عزاءكم، وألهمكم الصبر.", en: "My deepest sympathy. May you be given strength."}
      - {speaker: Kak Tiara, text: "Kalau air laut surut, larilah ke bukit.", ar_eg: "لو البحر انسحب، اجري على التل.", ar: "إذا انحسر البحر، فاهرب إلى التل.", en: "If the sea pulls back, run to the hills."}
      - {speaker: Kak Reza, text: "Kalau air laut surut, larilah ke bukit.", ar_eg: "لو البحر انسحب، اجري على التل.", ar: "إذا انحسر البحر، فاهرب إلى التل.", en: "If the sea pulls back, run to the hills."}
      - {speaker: Kak Tiara, text: "Kearifan lokal bisa menyelamatkan nyawa.", ar_eg: "الحكمة الشعبية ممكن تنجّي أرواح.", ar: "الحكمة المحلية قد تنقذ الأرواح.", en: "Local wisdom can save lives."}
      - {speaker: Kak Reza, text: "Kearifan lokal bisa menyelamatkan nyawa.", ar_eg: "الحكمة الشعبية ممكن تنجّي أرواح.", ar: "الحكمة المحلية قد تنقذ الأرواح.", en: "Local wisdom can save lives."}
      - {speaker: Kak Tiara, text: "Aceh bangkit bersama.", ar_eg: "آتشيه قامت بالكل مع بعض.", ar: "نهضت آتشيه بتكاتف الجميع.", en: "Aceh rose together."}
      - {speaker: Kak Reza, text: "Aceh bangkit bersama.", ar_eg: "آتشيه قامت بالكل مع بعض.", ar: "نهضت آتشيه بتكاتف الجميع.", en: "Aceh rose together."}
  - kind: outro
    title: Kata sambutan
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, bayangin kamu kasih sambutan singkat di acara peringatan. Sambutan itu resmi, ya. Mulai dengan salam dan doa."
        ar_eg: "محمد، تخيل إنك بتلقي كلمة قصيرة في حفل تأبين. الكلمة دي رسمية. ابدأ بالسلام والدعاء."
        ar: "محمد، تخيل أنك تلقي كلمة قصيرة في حفل تأبين. الكلمة رسمية. ابدأ بالسلام والدعاء."
        en: "Mohamed, imagine giving a short speech at a memorial. A speech is formal. Start with a greeting and a prayer."
        note:
          ar_eg: "دورك! قولها بهدوء وبصوت واضح."
          ar: "دورك! قلها بهدوء ووضوح."
          en: "Your turn! Say it calmly and clearly."
      - {speaker: Kak Reza, text: "Contohnya: Hadirin yang saya hormati, mari kita doakan para korban. Dari duka, kita belajar untuk saling menjaga.", ar_eg: "مثلًا: «الحضور الكرام، تعالوا ندعي للضحايا. ومن الحزن، بنتعلم نحافظ على بعض».", ar: "مثلًا: «أيها الحضور الكرام، لندعُ للضحايا. ومن الحزن نتعلم أن يحفظ بعضنا بعضًا».", en: "For example: Respected guests, let us pray for the victims. From grief, we learn to look after each other."}
      - {speaker: Kak Tiara, text: "Besok, tulis lima istilah keagamaan sama artinya dalam bahasa Indonesia.", ar_eg: "بكرة، اكتب خمس مصطلحات دينية ومعناهم بالإندونيسي.", ar: "غدًا، اكتب خمسة مصطلحات دينية ومعانيها بالإندونيسية.", en: "Tomorrow, write five religious terms and their meanings in Indonesian."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Wassalamualaikum.", ar_eg: "شكرًا يا محمد. والسلام عليكم.", ar: "شكرًا يا محمد. والسلام عليكم.", en: "Thank you, Mohamed. Wassalamualaikum."}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [smong, kearifan lokal, bencana, korban, turut berduka cita, bangkit, bantuan, bukit, gelombang, harapan, ibadah, jalur evakuasi]
review:
  status: draft
  verified: false
  notes: |
    Sensitive episode: kept respectful, no casualty figures. Spot-check: smong oral
    tradition on Simeulue and low death toll there in 2004; Museum Tsunami Aceh's name
    wall; Saman performed seated in rows. Content is learning text only.
