language: id
level: bipa2
unit: bipa2.u02
title:
  target: Apa pekerjaan Anda?
  ar_eg: بتشتغل إيه؟
  ar: ما عملك؟
  en: What do you do?
hosts:
  - name: Mbak Gadis
    voice: id-ID-GadisNeural
  - name: Mas Ardi
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Pasar Badung
    lines:
      - speaker: Mbak Gadis
        text: Halo, selamat pagi! Selamat datang di Kabar Radio! Saya Gadis.
        ar_eg: أهلًا، صباح الخير! أهلًا بيك في كبار راديو! أنا جاديس.
        ar: مرحبًا، صباح الخير! أهلًا بك في كبار راديو! أنا غاديس.
        en: Hello, good morning! Welcome to Kabar Radio! I'm Gadis.
      - speaker: Mas Ardi
        text: Dan saya Ardi. Selamat pagi, Mbak Gadis! Pagi ini kita di Denpasar, di Pasar Badung.
        ar_eg: وأنا أردي. صباح الخير يا جاديس! الصبح ده إحنا في دنباسار، في سوق بادونج.
        ar: وأنا أردي. صباح الخير يا غاديس! هذا الصباح نحن في دنباسار، في سوق بادونغ.
        en: And I'm Ardi. Good morning, Gadis! This morning we're in Denpasar, at Badung Market.
        note:
          ar_eg: دنباسار عاصمة بالي، وسوق بادونج أكبر سوق تقليدي فيها.
          ar: دنباسار عاصمة بالي، وسوق بادونغ أكبر أسواقها التقليدية.
          en: Denpasar is Bali's capital, and Badung Market is its biggest traditional market.
      - speaker: Mbak Gadis
        text: Ramai sekali, Mas! Ada pedagang, ada petani, ada turis, ada pengunjung dari Mesir juga.
        ar_eg: زحمة أوي! فيه تجار، وفيه فلاحين، وفيه سياح، وفيه زوار من مصر كمان.
        ar: مزدحم جدًا! هناك تجار وفلاحون وسياح، وزوار من مصر أيضًا.
        en: It's so busy! There are traders, farmers, tourists, and visitors from Egypt too.
      - speaker: Mas Ardi
        text: Ya. Banyak orang Bali bekerja untuk turis. Mereka juga sibuk di desa dan di pura.
        ar_eg: أيوه. ناس كتير في بالي بيشتغلوا مع السياح. وكمان مشغولين في القرية وفي المعبد.
        ar: نعم. كثير من أهل بالي يعملون مع السياح. وهم مشغولون أيضًا في القرية وفي المعبد.
        en: Yes. Many Balinese work with tourists. They're also busy in their village and at the temple.
        note:
          ar_eg: البنجار هو مجلس القرية في بالي. ناس كتير عندهم شغلانة في السياحة ودور تاني في البنجار وطقوس المعبد.
          ar: البنجار مجلس القرية في بالي. وكثيرون يعملون في السياحة ولهم دور آخر في البنجار وطقوس المعبد.
          en: A banjar is a Balinese village council. Many people work in tourism and keep a second role in the banjar and temple ceremonies.
      - speaker: Mbak Gadis
        text: Penulis, pelukis, pedagang, pemandu wisata. Mengapa? Karena.
        ar_eg: كاتب، رسام، تاجر، مرشد سياحي. ليه؟ عشان.
        ar: كاتب، رسام، تاجر، مرشد سياحي. لماذا؟ لأن.
        en: Writer, painter, trader, tour guide. Why? Because.
        note:
          ar_eg: موضوع النهارده - أسماء المهن بـ peN-، والسؤال بـ mengapa وkenapa، والرد بـ karena.
          ar: موضوع اليوم - أسماء المهن بـ peN-، والسؤال بـ mengapa وkenapa، والجواب بـ karena.
          en: Today's topic - job names with peN-, asking why with mengapa and kenapa, and answering with karena.
      - speaker: Mas Ardi
        text: Halo, Mohamed! Selamat datang di Denpasar! Apa pekerjaan Anda?
        ar_eg: أهلًا يا محمد! أهلًا بيك في دنباسار! بتشتغل إيه؟
        ar: مرحبًا يا محمد! أهلًا بك في دنباسار! ما عملك؟
        en: Hello, Mohamed! Welcome to Denpasar! What do you do?
  - kind: dialogue
    title: Wawancara di pasar
    lines:
      - speaker: Mas Ardi
        text: Mbak Gadis, kita wawancara orang di pasar, ya. Mbak jadi pelukis.
        ar_eg: يا جاديس، يلا نعمل لقاء مع حد في السوق. إنتي هتبقي رسامة.
        ar: يا غاديس، لنُجرِ مقابلة مع أحد في السوق. ستكونين رسامة.
        en: Gadis, let's interview someone at the market. You'll be a painter.
        note:
          ar_eg: مشهد تمثيلي - أردي بيعمل لقاء، وجاديس رسامة بتبيع لوحاتها في السوق.
          ar: مشهد تمثيلي - أردي يجري مقابلة، وغاديس رسامة تبيع لوحاتها في السوق.
          en: A role-play - Ardi is interviewing, Gadis plays a painter who sells her paintings at the market.
      - speaker: Mas Ardi
        text: Selamat pagi, Ibu. Boleh saya wawancara Ibu? Siapa nama Ibu?
        ar_eg: صباح الخير يا مدام. ممكن أعمل معاكي لقاء؟ اسم حضرتك إيه؟
        ar: صباح الخير يا سيدتي. هل لي أن أجري معكِ مقابلة؟ ما اسمك؟
        en: Good morning, ma'am. May I interview you? What's your name?
      - speaker: Mbak Gadis
        text: Selamat pagi. Nama saya Wayan. Saya pelukis.
        ar_eg: صباح النور. اسمي وايان. أنا رسامة.
        ar: صباح النور. اسمي وايان. أنا رسامة.
        en: Good morning. My name is Wayan. I'm a painter.
      - speaker: Mas Ardi
        text: Wah, pelukis! Saya suka lukisan Bali. Mengapa Ibu memilih pekerjaan ini?
        ar_eg: الله، رسامة! أنا بحب لوحات بالي. ليه اخترتي الشغلانة دي؟
        ar: رائع، رسامة! أحب اللوحات البالية. لماذا اخترتِ هذا العمل؟
        en: Wow, a painter! I love Balinese paintings. Why did you choose this job?
      - speaker: Mbak Gadis
        text: Karena ayah saya juga pelukis. Saya belajar dari dia.
        ar_eg: عشان أبويا كمان رسام. اتعلمت منه.
        ar: لأن أبي رسام أيضًا. تعلّمتُ منه.
        en: Because my father is a painter too. I learned from him.
      - speaker: Mas Ardi
        text: Ibu bekerja setiap hari?
        ar_eg: بتشتغلي كل يوم؟
        ar: هل تعملين كل يوم؟
        en: Do you work every day?
      - speaker: Mbak Gadis
        text: Ya. Pagi saya melukis, sore saya menjual lukisan di pasar ini.
        ar_eg: أيوه. الصبح برسم، والعصر ببيع اللوحات في السوق ده.
        ar: نعم. صباحًا أرسم، ومساءً أبيع اللوحات في هذا السوق.
        en: Yes. In the morning I paint, in the afternoon I sell paintings at this market.
      - speaker: Mas Ardi
        text: Wah, Ibu pelukis dan penjual! Siapa yang membeli lukisan Ibu?
        ar_eg: يا سلام، إنتي رسامة وبياعة! مين بيشتري لوحاتك؟
        ar: رائع، أنتِ رسامة وبائعة! من يشتري لوحاتك؟
        en: Wow, you're a painter and a seller! Who buys your paintings?
      - speaker: Mbak Gadis
        text: Biasanya turis. Banyak pengunjung dari Timur Tengah, dari Mesir juga.
        ar_eg: عادةً السياح. زوار كتير من الشرق الأوسط، ومن مصر كمان.
        ar: عادةً السياح. زوار كثيرون من الشرق الأوسط، ومن مصر أيضًا.
        en: Usually tourists. Lots of visitors from the Middle East, from Egypt too.
      - speaker: Mas Ardi
        text: Ibu saya pedagang di pasar ini juga. Ibu Wayan kenal dia?
        ar_eg: أمي كمان تاجرة في السوق ده. تعرفيها؟
        ar: أمي أيضًا تاجرة في هذا السوق. هل تعرفينها؟
        en: My mother is a trader at this market too. Do you know her?
      - speaker: Mbak Gadis
        text: Mungkin! Di sini semua pedagang kenal semua pedagang.
        ar_eg: ممكن! هنا كل التجار عارفين بعض.
        ar: ربما! هنا كل التجار يعرفون بعضهم.
        en: Maybe! Here all the traders know each other.
      - speaker: Mas Ardi
        text: Terima kasih, Ibu Wayan. Lukisan Ibu indah sekali.
        ar_eg: شكرًا يا مدام وايان. لوحاتك جميلة أوي.
        ar: شكرًا يا سيدة وايان. لوحاتك جميلة جدًا.
        en: Thank you, Ibu Wayan. Your paintings are beautiful.
      - speaker: Mbak Gadis
        text: Mas Ardi, sekarang saya wawancara Mas. Mas Ardi kenapa capek?
        ar_eg: يا أردي، دلوقتي أنا اللي هعمل معاك لقاء. إنت تعبان ليه؟
        ar: يا أردي، الآن أنا من يُجري المقابلة معك. لماذا أنت متعب؟
        en: Ardi, now I'll interview you. Why are you tired?
        note:
          ar_eg: خلص التمثيل - رجعوا يتكلموا عن نفسهم.
          ar: انتهى التمثيل - يعودان إلى الحديث عن نفسيهما.
          en: The role-play is over - they're back to talking about themselves.
      - speaker: Mas Ardi
        text: Soalnya kemarin saya lembur di kantor. Saya pulang jam sepuluh malam.
        ar_eg: أصل إمبارح كنت شغال ساعات زيادة في المكتب. روّحت الساعة عشرة بالليل.
        ar: لأنني أمس عملتُ ساعات إضافية في المكتب. عدتُ إلى البيت في العاشرة ليلًا.
        en: "'Cause yesterday I worked overtime at the office. I went home at ten at night."
        note:
          ar_eg: soalnya هي karena بس بين الصحاب، زي «أصل…».
          ar: soalnya صيغة عامية من karena، مثل «أصلًا لأن…».
          en: soalnya is the casual karena, like "'cause…".
      - speaker: Mbak Gadis
        text: Wah, Mas lelah sekali! Mas masuk kerja jam berapa?
        ar_eg: يا خبر، إنت تعبان أوي! بتبدأ شغل الساعة كام؟
        ar: يا إلهي، أنت متعب جدًا! متى تبدأ عملك؟
        en: Oh, you're so tired! What time do you start work?
      - speaker: Mas Ardi
        text: Jam delapan pagi. Pertama saya membaca email, lalu rapat dengan rekan kerja.
        ar_eg: الساعة تمانية الصبح. الأول بقرا الإيميلات، وبعدين اجتماع مع زمايلي.
        ar: الثامنة صباحًا. أولًا أقرأ البريد الإلكتروني، ثم اجتماع مع الزملاء.
        en: Eight in the morning. First I read emails, then a meeting with colleagues.
      - speaker: Mas Ardi
        text: Setelah rapat, saya istirahat makan siang. Sore saya mengirim banyak pesan.
        ar_eg: بعد الاجتماع باخد بريك للغدا. والعصر ببعت رسايل كتير.
        ar: بعد الاجتماع أستريح لتناول الغداء. وعصرًا أرسل رسائل كثيرة.
        en: After the meeting, I take a lunch break. In the afternoon I send lots of messages.
      - speaker: Mbak Gadis
        text: Mengapa Mas memilih pekerjaan ini?
        ar_eg: ليه اخترت الشغلانة دي؟
        ar: لماذا اخترت هذا العمل؟
        en: Why did you choose this job?
      - speaker: Mas Ardi
        text: Karena saya suka bertemu orang baru. Dan karena saya suka radio!
        ar_eg: عشان بحب أقابل ناس جديدة. وعشان بحب الراديو!
        ar: لأنني أحب لقاء أناس جدد. ولأنني أحب الراديو!
        en: Because I like meeting new people. And because I love radio!
      - speaker: Mas Ardi
        text: Dan Mbak? Mbak pulang kerja jam berapa?
        ar_eg: وإنتي؟ بتروّحي من الشغل الساعة كام؟
        ar: وأنتِ؟ متى تعودين من العمل؟
        en: And you? What time do you go home from work?
      - speaker: Mbak Gadis
        text: Biasanya jam empat. Tapi kadang-kadang saya lembur juga, jadi saya lelah sekali.
        ar_eg: عادةً الساعة أربعة. بس أحيانًا بشتغل ساعات زيادة أنا كمان، فبكون تعبانة أوي.
        ar: عادةً في الرابعة. لكن أحيانًا أعمل ساعات إضافية أنا أيضًا، فأكون متعبة جدًا.
        en: Usually at four. But sometimes I work overtime too, so I'm very tired.
      - speaker: Mas Ardi
        text: Mengapa Mbak suka pekerjaan ini?
        ar_eg: وإنتي بتحبي الشغلانة دي ليه؟
        ar: ولماذا تحبين هذا العمل؟
        en: Why do you like this job?
      - speaker: Mbak Gadis
        text: Karena saya bisa berbicara dengan banyak orang setiap hari. Dan karena Mohamed mendengar kita!
        ar_eg: عشان بقدر أتكلم مع ناس كتير كل يوم. وعشان محمد بيسمعنا!
        ar: لأنني أستطيع التحدث مع كثير من الناس كل يوم. ولأن محمدًا يستمع إلينا!
        en: Because I can talk with lots of people every day. And because Mohamed listens to us!
  - kind: word_spotlight
    title: Pelukis, mengapa, karena
    lines:
      - speaker: Mbak Gadis
        text: Menulis, penulis. Membaca, pembaca. Melukis, pelukis. Menari, penari.
        ar_eg: يكتب، كاتب. يقرا، قارئ. يرسم، رسام. يرقص، راقص.
        ar: يكتب، كاتب. يقرأ، قارئ. يرسم، رسام. يرقص، راقص.
        en: Write, writer. Read, reader. Paint, painter. Dance, dancer.
        note:
          ar_eg: peN- زي وزن «فاعل» في العربي - الشخص اللي بيعمل الفعل. نفس قواعد الـ N بتاعة meN-.
          ar: peN- مثل وزن «فاعل» - من يقوم بالفعل. وتتبع النون قواعد meN- نفسها.
          en: peN- is like the Arabic «فاعل» pattern - the person who does the action. The N follows the same rules as meN-.
      - speaker: Mas Ardi
        text: Penyanyi, penjual, pengunjung. Penari itu cantik sekali.
        ar_eg: مغني، بياع، زائر. الرقاصة دي حلوة أوي.
        ar: مغنٍّ، بائع، زائر. تلك الراقصة جميلة جدًا.
        en: Singer, seller, visitor. That dancer is very beautiful.
      - speaker: Mbak Gadis
        text: Pedagang, petani. Ibu Wayan pedagang di Pasar Badung. Ayah saya petani.
        ar_eg: تاجر، فلاح. مدام وايان تاجرة في سوق بادونج. أبويا فلاح.
        ar: تاجر، مزارع. السيدة وايان تاجرة في سوق بادونغ. أبي مزارع.
        en: Trader, farmer. Ibu Wayan is a trader at Badung Market. My father is a farmer.
        note:
          ar_eg: الأفعال اللي بـ ber- بتاخد pe- بس - berdagang تبقى pedagang، وbertani تبقى petani.
          ar: أفعال ber- تأخذ pe- فقط - berdagang تصير pedagang، وbertani تصير petani.
          en: ber- verbs take plain pe- - berdagang gives pedagang, bertani gives petani.
      - speaker: Mas Ardi
        text: Penerjemah. Penerjemah. Di Kairo saya penerjemah.
        ar_eg: مترجم. مترجم. في القاهرة أنا مترجم.
        ar: مترجم. مترجم. في القاهرة أعمل مترجمًا.
        en: Translator. Translator. In Cairo I'm a translator.
        note:
          ar_eg: الجسر العربي - penerjemah جاية من «ترجمة» مع peN-.
          ar: الجسر العربي - penerjemah من «ترجمة» مع peN-.
          en: Arabic Bridge - penerjemah comes from «ترجمة» plus peN-.
      - speaker: Mbak Gadis
        text: Mengapa, kenapa. Mengapa Anda memilih pekerjaan ini? Kenapa kamu terlambat?
        ar_eg: ليه (رسمي)، ليه (عادي). ليه حضرتك اخترت الشغلانة دي؟ إنت اتأخرت ليه؟
        ar: لماذا (رسمي)، لماذا (يومي). لماذا اخترت هذا العمل؟ لماذا تأخرت؟
        en: Why, formal and everyday. Why did you choose this job? Why are you late?
        note:
          ar_eg: mengapa للرسمي والمكتوب، وkenapa للكلام اليومي.
          ar: mengapa للرسمي والمكتوب، وkenapa للحديث اليومي.
          en: mengapa is formal and written, kenapa is everyday speech.
      - speaker: Mas Ardi
        text: Karena, sebab. Saya belajar bahasa Indonesia karena saya suka Bali.
        ar_eg: عشان، لأن. بتعلم إندونيسي عشان بحب بالي.
        ar: لأن، بسبب. أتعلّم الإندونيسية لأنني أحب بالي.
        en: Because. I'm learning Indonesian because I love Bali.
        note:
          ar_eg: الجسر العربي - sebab من «سبب»، ومعناها «عشان» أو «سبب».
          ar: الجسر العربي - sebab من «سبب»، وتعني «لأن» أو «سبب».
          en: Arabic Bridge - sebab comes from «سبب», and means "because" or "reason".
      - speaker: Mbak Gadis
        text: Karena hujan, kami di rumah saja. Nggak bisa, soalnya sibuk.
        ar_eg: عشان بتمطر، قعدنا في البيت. مش هقدر، أصلي مشغول.
        ar: بسبب المطر بقينا في البيت. لا أستطيع، لأنني مشغول.
        en: Because of the rain, we stayed home. Can't, 'cause I'm busy.
      - speaker: Mas Ardi
        text: Kamu kenapa? Sakit? Capek?
        ar_eg: مالك؟ عيان؟ تعبان؟
        ar: ما بك؟ مريض؟ متعب؟
        en: What's wrong with you? Sick? Tired?
        note:
          ar_eg: Kamu kenapa? معناها «مالك؟» مش «ليه إنت؟».
          ar: Kamu kenapa? تعني «ما بك؟» لا «لماذا أنت؟».
          en: Kamu kenapa? means "what's wrong with you?", not "why you?".
      - speaker: Mbak Gadis
        text: Masuk kerja, rapat, istirahat, lembur, pulang kerja.
        ar_eg: يبدأ الشغل، اجتماع، بريك، شغل زيادة، يروّح من الشغل.
        ar: بدء العمل، اجتماع، استراحة، عمل إضافي، العودة من العمل.
        en: Start work, meeting, break, overtime, go home from work.
  - kind: recap
    title: Karena saya suka Bali
    lines:
      - speaker: Mbak Gadis
        text: Apa pekerjaan Anda?
        ar_eg: بتشتغل إيه؟
        ar: ما عملك؟
        en: What do you do?
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
          ar: ببطء. ردّد كل جملة بعدنا.
          en: Slowly. Repeat each sentence after us.
      - speaker: Mas Ardi
        text: Saya pelukis. Ibu saya pedagang.
        ar_eg: أنا رسام. وأمي تاجرة.
        ar: أنا رسام. وأمي تاجرة.
        en: I'm a painter. My mother is a trader.
