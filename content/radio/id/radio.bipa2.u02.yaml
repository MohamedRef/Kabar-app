        ar_eg: الصبح برسم، والعصر ببيع اللوحات.
        ar: صباحًا أرسم، ومساءً أبيع اللوحات.
        en: In the morning I paint, in the afternoon I sell paintings.
      - speaker: Mas Ardi
        text: Pagi saya melukis, sore saya menjual lukisan.
        ar_eg: الصبح برسم، والعصر ببيع اللوحات.
        ar: صباحًا أرسم، ومساءً أبيع اللوحات.
        en: In the morning I paint, in the afternoon I sell paintings.
      - speaker: Mbak Gadis
        text: Kenapa kamu capek?
        ar_eg: إنت تعبان ليه؟
        ar: لماذا أنت متعب؟
        en: Why are you tired?
      - speaker: Mas Ardi
        text: Soalnya saya lembur.
        ar_eg: أصلي اشتغلت ساعات زيادة.
