        en: Why did you choose this job?
      - speaker: Mbak Gadis
        text: Karena ayah saya juga pelukis.
        ar_eg: عشان أبويا كمان رسام.
        ar: لأن أبي رسام أيضًا.
        en: Because my father is a painter too.
      - speaker: Mas Ardi
        text: Karena ayah saya juga pelukis.
        ar_eg: عشان أبويا كمان رسام.
