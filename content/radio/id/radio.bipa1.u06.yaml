schema: kabar.radio/v1
id: radio.bipa1.u06
language: id
level: bipa1
unit: bipa1.u06
title:
  target: Satu hari di Blok M
  ar_eg: يوم في بلوك إم
  ar: يوم في بلوك إم
  en: A day in Blok M
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Pagi di Blok M
    lines:
      - speaker: Kak Tiara
        text: Halo, selamat pagi! Selamat datang di Kabar Radio! Saya Tiara.
        ar_eg: أهلًا، صباح الخير! أهلًا بيك في كبار راديو! أنا تيارا.
        ar: مرحبًا، صباح الخير! أهلًا بك في كبار راديو! أنا تيارا.
        en: Hello, good morning! Welcome to Kabar Radio! I'm Tiara.
      - speaker: Kak Reza
        text: Dan saya Reza. Selamat pagi, Kak Tiara! Mbak sudah makan?
        ar_eg: وأنا رضا. صباح الخير يا تيارا! أكلتي؟
        ar: وأنا رضا. صباح الخير يا تيارا! هل أكلتِ؟
        en: And I'm Reza. Good morning, Tiara! Have you eaten?
        note:
          ar_eg: «Sudah makan?» تحية زي «عامل إيه؟»، مش سؤال حقيقي عن الأكل.
          ar: «Sudah makan?» تحيةٌ مثل «كيف حالك؟»، لا سؤالٌ حقيقي عن الطعام.
          en: "'Sudah makan?' is a greeting, like 'how are you?', not a real question about food."
      - speaker: Kak Tiara
        text: Sudah, Mas! Tadi pagi saya sarapan nasi uduk di Blok M. Enak sekali!
        ar_eg: أيوه يا رضا! الصبح فطرت ناسي أودوك في بلوك إم. حلو أوي!
        ar: نعم يا رضا! هذا الصباح فطرتُ ناسي أودوك في بلوك إم. لذيذ جدًا!
        en: Yes, Reza! Earlier this morning I had nasi uduk for breakfast in Blok M. Very tasty!
      - speaker: Kak Reza
        text: Wah, enak! Saya belum sarapan, Mbak. Saya baru bangun!
        ar_eg: الله، حلو! أنا لسه ما فطرتش. أنا لسه صاحي!
        ar: رائع! لم أفطر بعد. استيقظتُ للتوّ!
        en: Oh, nice! I haven't had breakfast yet. I've only just woken up!
      - speaker: Kak Tiara
        text: Kak Reza selalu bangun terlambat, ya?
        ar_eg: إنت دايمًا بتصحى متأخر يا رضا، صح؟
        ar: أنت تستيقظ متأخرًا دائمًا يا رضا، أليس كذلك؟
        en: You always wake up late, don't you, Reza?
      - speaker: Kak Reza
        text: Tidak selalu, Mbak! Kadang-kadang saja. Biasanya saya bangun jam enam.
        ar_eg: مش دايمًا! أحيانًا بس. عادةً بصحى الساعة ستة.
        ar: ليس دائمًا! أحيانًا فقط. عادةً أستيقظ الساعة السادسة.
        en: Not always! Just sometimes. Usually I wake up at six.
      - speaker: Kak Tiara
        text: Hari ini kita di Blok M, di Jakarta. Di sini ada banyak orang dan banyak sate.
        ar_eg: النهارده إحنا في بلوك إم في جاكرتا. هنا فيه ناس كتير وساتيه كتير.
        ar: اليوم نحن في بلوك إم في جاكرتا. هنا ناس كثيرون وساتيه كثير.
        en: Today we're in Blok M, in Jakarta. There are lots of people and lots of satay here.
        note:
          ar_eg: بلوك إم حتة في جنوب جاكرتا مشهورة بأكشاك الأكل والمحلات.
          ar: بلوك إم حيٌّ في جنوب جاكرتا مشهور بأكشاك الطعام والمتاجر.
          en: Blok M is a South Jakarta district famous for its food stalls and shops.
      - speaker: Kak Reza
        text: Ya. Orang Jakarta sering bangun jam lima. Mereka sarapan, lalu pergi ke kantor.
        ar_eg: أيوه. ناس جاكرتا كتير بيصحوا الساعة خمسة. بيفطروا، وبعدين يروحوا الشغل.
        ar: نعم. كثيرًا ما يستيقظ أهل جاكرتا الساعة الخامسة. يفطرون، ثم يذهبون إلى المكتب.
        en: Yes. Jakartans often wake up at five. They have breakfast, then go to the office.
        note:
          ar_eg: ناس كتير في جاكرتا بيبدأوا يومهم الساعة خمسة الصبح عشان يسبقوا الزحمة.
          ar: يبدأ كثير من سكان جاكرتا يومهم الساعة الخامسة صباحًا ليسبقوا الزحام.
          en: Many Jakartans start the day at five a.m. to beat the traffic.
      - speaker: Kak Tiara
        text: Membaca, menulis, memasak. Sudah, belum, sedang, akan. Selalu, sering, jarang.
        ar_eg: يقرا، يكتب، يطبخ. خلاص، لسه، بيعمل دلوقتي، هيعمل. دايمًا، كتير، نادرًا.
        ar: يقرأ، يكتب، يطبخ. قد فعل، لم يفعل بعد، يفعل الآن، سيفعل. دائمًا، كثيرًا، نادرًا.
        en: Read, write, cook. Already, not yet, in the middle of, will. Always, often, rarely.
        note:
          ar_eg: موضوع النهارده - أفعال meN-، وكلمات الوقت sudah وbelum وsedang وakan، وقد إيه بتعمل الحاجة.
          ar: موضوع اليوم - أفعال meN-، وكلمات الزمن sudah وbelum وsedang وakan، وتكرار الأفعال.
          en: Today's topic - meN- verbs, the time markers sudah, belum, sedang and akan, and how often you do things.
      - speaker: Kak Reza
        text: Halo, Mohamed! Selamat datang di Blok M! Kamu sudah sarapan?
        ar_eg: أهلًا يا محمد! أهلًا بيك في بلوك إم! فطرت؟
        ar: مرحبًا يا محمد! أهلًا بك في بلوك إم! هل فطرت؟
        en: Hello, Mohamed! Welcome to Blok M! Have you had breakfast?
  - kind: dialogue
    title: Hari Kak Tiara
    lines:
      - speaker: Kak Reza
        text: Kak Tiara, biasanya Mbak bangun jam berapa?
        ar_eg: يا تيارا، عادةً بتصحي الساعة كام؟
        ar: يا تيارا، في العادة متى تستيقظين؟
        en: Tiara, what time do you usually wake up?
        note:
          ar_eg: رضا بيسأل تيارا عن يومها، زي لقاء صغير في البرنامج.
          ar: يسأل رضا تيارا عن يومها، كأنه لقاء قصير في البرنامج.
          en: Reza asks Tiara about her day, like a little on-air interview.
      - speaker: Kak Tiara
        text: Saya selalu bangun jam lima, Mas. Lalu saya salat subuh.
        ar_eg: أنا دايمًا بصحى الساعة خمسة. وبعدين بصلي الصبح.
        ar: أستيقظ دائمًا الساعة الخامسة. ثم أصلي الصبح.
        en: I always wake up at five. Then I pray the dawn prayer.
      - speaker: Kak Reza
        text: Wah, rajin sekali! Sesudah itu?
        ar_eg: الله، شاطرة أوي! وبعد كده؟
        ar: ما شاء الله، مجتهدة جدًا! وبعد ذلك؟
        en: Wow, very diligent! After that?
      - speaker: Kak Tiara
        text: Sesudah salat, saya mandi. Lalu saya memasak nasi dan menggoreng ikan.
        ar_eg: بعد الصلاة باخد دش. وبعدين بطبخ رز وبقلي سمك.
        ar: بعد الصلاة أستحم. ثم أطبخ الأرز وأقلي السمك.
        en: After praying, I shower. Then I cook rice and fry fish.
      - speaker: Kak Reza
        text: Mbak memasak setiap pagi?
        ar_eg: بتطبخي كل يوم الصبح؟
        ar: هل تطبخين كل صباح؟
        en: Do you cook every morning?
      - speaker: Kak Tiara
        text: Ya, setiap pagi. Biasanya saya sarapan di rumah. Saya jarang sarapan di Blok M.
        ar_eg: أيوه، كل يوم الصبح. عادةً بفطر في البيت. ونادرًا لما بفطر في بلوك إم.
        ar: نعم، كل صباح. عادةً أفطر في البيت. ونادرًا ما أفطر في بلوك إم.
        en: Yes, every morning. Usually I have breakfast at home. I rarely have breakfast in Blok M.
      - speaker: Kak Reza
        text: Tapi hari ini Mbak sarapan di sini!
        ar_eg: بس النهارده فطرتي هنا!
        ar: لكنكِ اليوم فطرتِ هنا!
        en: But today you had breakfast here!
      - speaker: Kak Tiara
        text: Ya, hari ini hari Minggu! Jam berapa Mas pergi ke kantor?
        ar_eg: أيوه، النهارده الحد! إنت بتروح الشغل الساعة كام؟
        ar: نعم، اليوم الأحد! في أي ساعة تذهب إلى المكتب؟
        en: Yes, today's Sunday! What time do you go to the office?
      - speaker: Kak Reza
        text: Jam tujuh. Saya bekerja sampai jam lima sore. Di kantor saya membaca dan menulis.
        ar_eg: الساعة سبعة. بشتغل لحد الساعة خمسة العصر. في المكتب بقرا وبكتب.
        ar: الساعة السابعة. أعمل حتى الخامسة مساءً. في المكتب أقرأ وأكتب.
        en: At seven. I work until five in the afternoon. At the office I read and write.
      - speaker: Kak Reza
        text: Saya membaca surat, lalu saya mengirim pesan. Banyak sekali pesan!
        ar_eg: بقرا جوابات، وبعدين ببعت رسايل. رسايل كتير أوي!
        ar: أقرأ الرسائل، ثم أرسل الرسائل القصيرة. رسائل كثيرة جدًا!
        en: I read letters, then I send messages. So many messages!
      - speaker: Kak Tiara
        text: Sesudah bekerja, Mas ke mana? Mas sering makan di Blok M?
        ar_eg: بعد الشغل بتروح فين؟ بتاكل في بلوك إم كتير؟
        ar: بعد العمل إلى أين تذهب؟ هل تأكل في بلوك إم كثيرًا؟
        en: After work, where do you go? Do you often eat in Blok M?
      - speaker: Kak Reza
        text: Sering, Mbak. Sate di sana enak sekali!
        ar_eg: كتير. الساتيه هناك حلو أوي!
        ar: كثيرًا. الساتيه هناك لذيذ جدًا!
        en: Often. The satay over there is really tasty!
      - speaker: Kak Tiara
        text: Malam hari Mas menonton TV?
        ar_eg: بالليل بتتفرج على التلفزيون؟
        ar: هل تشاهد التلفاز في الليل؟
        en: Do you watch TV in the evening?
      - speaker: Kak Reza
        text: Jarang. Biasanya saya membaca buku sebelum tidur. Sekarang saya sedang membaca buku bahasa Arab!
        ar_eg: نادرًا. عادةً بقرا كتاب قبل ما أنام. ودلوقتي بقرا كتاب عربي!
        ar: نادرًا. عادةً أقرأ كتابًا قبل النوم. والآن أقرأ كتابًا بالعربية!
        en: Rarely. Usually I read a book before bed. Right now I'm reading an Arabic book!
      - speaker: Kak Tiara
        text: Bagus sekali, Mas! Kak Reza sudah menikah, ya? Istri Mas memasak setiap pagi?
        ar_eg: برافو عليك! إنت متجوز، صح؟ مراتك بتطبخ كل يوم الصبح؟
        ar: أحسنت! أنت متزوج، أليس كذلك؟ هل تطبخ زوجتك كل صباح؟
        en: Very good! You're married, right? Does your wife cook every morning?
      - speaker: Kak Reza
        text: Kadang-kadang istri saya memasak, kadang-kadang saya. Saya bisa menggoreng ikan!
        ar_eg: أحيانًا مراتي بتطبخ، وأحيانًا أنا. أنا بعرف أقلي سمك!
        ar: أحيانًا تطبخ زوجتي، وأحيانًا أنا. أستطيع أن أقلي السمك!
        en: Sometimes my wife cooks, sometimes I do. I can fry fish!
      - speaker: Kak Tiara
        text: Sekarang Mas jadi Dimas, dan saya jadi Mohamed.
        ar_eg: دلوقتي إنت ديماس، وأنا محمد.
        ar: الآن أنت ديماس، وأنا محمد.
        en: Now you're Dimas, and I'm Mohamed.
        note:
          ar_eg: مشهد تمثيلي قصير - ديماس بيكلم محمد في التليفون بالليل.
          ar: مشهد تمثيلي قصير - ديماس يتصل بمحمد مساءً.
          en: A short role-play - Dimas phones Mohamed in the evening.
      - speaker: Kak Reza
        text: Halo, Mohamed! Kamu sudah makan?
        ar_eg: ألو يا محمد! أكلت؟
        ar: مرحبًا يا محمد! هل أكلت؟
        en: Hi, Mohamed! Have you eaten?
      - speaker: Kak Tiara
        text: Belum, Dimas. Saya masih di kantor.
        ar_eg: لسه يا ديماس. أنا لسه في الشغل.
        ar: ليس بعد يا ديماس. ما زلت في المكتب.
        en: Not yet, Dimas. I'm still at the office.
      - speaker: Kak Reza
        text: Aku lagi di Blok M. Aku mau makan sate. Kamu lapar?
        ar_eg: أنا دلوقتي في بلوك إم. عايز آكل ساتيه. إنت جعان؟
        ar: أنا الآن في بلوك إم. أريد أن آكل الساتيه. هل أنت جائع؟
        en: I'm in Blok M right now. I want to eat satay. Are you hungry?
        note:
          ar_eg: lagi هي sedang بس بين الأصحاب، وaku بدل saya.
          ar: lagi صيغة عامية من sedang بين الأصدقاء، وaku بدل saya.
          en: lagi is the casual sedang, and aku the casual saya, between friends.
      - speaker: Kak Tiara
        text: Lapar sekali! Saya akan datang jam tujuh.
        ar_eg: جعان أوي! هاجي الساعة سبعة.
        ar: جائع جدًا! سآتي الساعة السابعة.
        en: Very hungry! I'll come at seven.
      - speaker: Kak Reza
        text: Oke! Aku di sini, di depan masjid. Sampai jumpa!
        ar_eg: تمام! أنا هنا، قدام الجامع. أشوفك!
        ar: حسنًا! أنا هنا أمام المسجد. إلى اللقاء!
        en: OK! I'm here, in front of the mosque. See you!
  - kind: word_spotlight
    title: Membaca, sudah, selalu
    lines:
      - speaker: Kak Tiara
        text: Membaca. Saya membaca buku. Menulis. Rina menulis surat.
        ar_eg: يقرا. أنا بقرا كتاب. يكتب. رينا بتكتب جواب.
        ar: يقرأ. أقرأ كتابًا. يكتب. رينا تكتب رسالة.
        en: To read. I read a book. To write. Rina writes a letter.
        note:
          ar_eg: meN- بتعمل فعل ليه مفعول - baca تبقى membaca، وtulis تبقى menulis (الـ t بتقع).
          ar: تصوغ meN- فعلًا متعديًا - baca تصير membaca، وtulis تصير menulis (تسقط t).
          en: meN- makes a verb that takes an object - baca becomes membaca, tulis becomes menulis (the t drops).
      - speaker: Kak Reza
        text: Memasak. Bu Yanti memasak nasi. Menyapu. Bu Yanti menyapu lantai.
        ar_eg: يطبخ. مدام يانتي بتطبخ رز. يكنس. مدام يانتي بتكنس الأرض.
        ar: يطبخ. السيدة يانتي تطبخ الأرز. يكنس. السيدة يانتي تكنس الأرض.
        en: To cook. Bu Yanti cooks rice. To sweep. Bu Yanti sweeps the floor.
      - speaker: Kak Tiara
        text: Mengajar. Pak Irwan mengajar bahasa Indonesia. Mengirim. Saya mengirim pesan.
        ar_eg: يعلّم. أستاذ إروان بيدرّس إندونيسي. يبعت. أنا ببعت رسالة.
        ar: يعلّم. الأستاذ إروان يدرّس الإندونيسية. يرسل. أرسل رسالة.
        en: To teach. Pak Irwan teaches Indonesian. To send. I send a message.
      - speaker: Kak Reza
        text: Sudah makan? Sudah. Belum. Kamu sudah menikah? Belum.
        ar_eg: أكلت؟ أيوه. لسه. إنت متجوز؟ لسه.
        ar: هل أكلت؟ نعم. ليس بعد. هل أنت متزوج؟ ليس بعد.
        en: Have you eaten? Yes. Not yet. Are you married? Not yet.
        note:
          ar_eg: الإندونيسيين بيقولوا belum (لسه) مش tidak، عشان فيه أمل. والجسر العربي - menikah جاية من «نكاح».
          ar: يقول الإندونيسيون belum (ليس بعد) لا tidak، تفاؤلًا. والجسر العربي - menikah من «نكاح».
          en: Indonesians answer belum (not yet) rather than tidak - it's hopeful. Arabic Bridge - menikah comes from «نكاح».
      - speaker: Kak Tiara
        text: Sedang, lagi. Saya sedang membaca buku. Aku lagi makan.
        ar_eg: بيعمل دلوقتي. أنا بقرا كتاب دلوقتي. أنا باكل دلوقتي.
        ar: يفعل الآن. أنا أقرأ كتابًا الآن. أنا آكل الآن.
        en: In the middle of. I'm reading a book. I'm eating right now.
      - speaker: Kak Reza
        text: Akan. Saya akan pergi besok. Masih. Dia masih di kantor. Baru. Saya baru bangun.
        ar_eg: هـ (مستقبل). هسافر بكرة. لسه. هو لسه في المكتب. لسه حالًا. أنا لسه صاحي.
        ar: سـ. سأذهب غدًا. ما زال. ما زال في المكتب. للتوّ. استيقظتُ للتوّ.
        en: Will. I'll go tomorrow. Still. He's still at the office. Just. I've just woken up.
        note:
          ar_eg: الفعل نفسه مبيتغيرش أبدًا - الكلمة الصغيرة دي هي اللي بتقول الوقت.
          ar: الفعل لا يتغير أبدًا - هذه الكلمة الصغيرة هي التي تحدد الزمن.
          en: The verb never changes - this little word is what tells you the time.
      - speaker: Kak Tiara
        text: Selalu, biasanya, sering, kadang-kadang, jarang, tidak pernah.
        ar_eg: دايمًا، عادةً، كتير، أحيانًا، نادرًا، أبدًا.
        ar: دائمًا، عادةً، كثيرًا، أحيانًا، نادرًا، أبدًا.
        en: Always, usually, often, sometimes, rarely, never.
      - speaker: Kak Reza
        text: Saya selalu sarapan jam enam. Dia jarang makan pedas. Saya tidak pernah menonton TV pagi hari.
        ar_eg: أنا دايمًا بفطر الساعة ستة. هو نادرًا لما بياكل حراق. أنا عمري ما بتفرج على التلفزيون الصبح.
        ar: أفطر دائمًا الساعة السادسة. نادرًا ما يأكل الطعام الحار. لا أشاهد التلفاز صباحًا أبدًا.
        en: I always have breakfast at six. He rarely eats spicy food. I never watch TV in the morning.
      - speaker: Kak Tiara
        text: Salat. Subuh. Saya salat lima kali sehari. Saya bangun, lalu salat subuh.
        ar_eg: صلاة. صبح. أنا بصلي خمس مرات في اليوم. بصحى، وبعدين أصلي الصبح.
        ar: صلاة. صبح. أصلي خمس مرات في اليوم. أستيقظ، ثم أصلي الصبح.
        en: Prayer. Dawn. I pray five times a day. I wake up, then pray the dawn prayer.
        note:
          ar_eg: الجسر العربي - salat من «صلاة»، وsubuh من «صبح». هتسمعهم كل يوم.
          ar: الجسر العربي - salat من «صلاة»، وsubuh من «صبح». ستسمعهما كل يوم.
          en: Arabic Bridge - salat comes from «صلاة», subuh from «صبح». You'll hear them every day.
      - speaker: Kak Reza
        text: Sebelum, sesudah, lalu. Sebelum tidur, saya membaca buku. Sesudah mandi, saya sarapan.
        ar_eg: قبل، بعد، وبعدين. قبل ما أنام بقرا كتاب. بعد الدش بفطر.
        ar: قبل، بعد، ثم. قبل النوم أقرأ كتابًا. بعد الاستحمام أفطر.
        en: Before, after, then. Before bed, I read a book. After showering, I have breakfast.
      - speaker: Kak Tiara
        text: Di sini, di situ, di sana. Tasnya di situ. Masjidnya di sana.
        ar_eg: هنا، عندك، هناك. الشنطة عندك. الجامع هناك.
        ar: هنا، هناك قربك، هناك بعيدًا. الحقيبة عندك. المسجد هناك.
        en: Here, there, over there. The bag is there by you. The mosque is over there.
        note:
          ar_eg: sini جنبي، situ جنبك، sana بعيد عننا الاتنين.
          ar: sini قربي، وsitu قربك، وsana بعيد عنا كلينا.
          en: sini is near me, situ near you, sana far from both of us.
  - kind: recap
    title: Saya sedang membaca buku
    lines:
      - speaker: Kak Tiara
        text: Saya bangun jam lima, lalu salat subuh.
        ar_eg: بصحى الساعة خمسة، وبعدين أصلي الصبح.
        ar: أستيقظ الساعة الخامسة، ثم أصلي الصبح.
        en: I wake up at five, then pray the dawn prayer.
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
