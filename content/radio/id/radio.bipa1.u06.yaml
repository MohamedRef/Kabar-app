  - kind: outro
    title: Hari Mohamed
    lines:
      - speaker: Kak Tiara
        text: Mohamed, biasanya kamu bangun jam berapa? Sesudah itu, kamu ke mana?
        ar_eg: يا محمد، عادةً بتصحى الساعة كام؟ وبعد كده بتروح فين؟
        ar: يا محمد، متى تستيقظ عادةً؟ وبعد ذلك إلى أين تذهب؟
        en: Mohamed, what time do you usually wake up? After that, where do you go?
        note:
          ar_eg: دورك! جاوب بصوت عالي بجملة أو اتنين.
          ar: دورك! أجب بصوت مسموع بجملة أو جملتين.
          en: Your turn! Answer out loud in a sentence or two.
      - speaker: Kak Reza
        text: Saya bangun jam lima. Lalu saya salat subuh dan sarapan. Sesudah itu, saya belajar bahasa Indonesia.
        ar_eg: بصحى الساعة خمسة. وبعدين أصلي الصبح وأفطر. بعد كده بتعلم إندونيسي.
        ar: أستيقظ الساعة الخامسة. ثم أصلي الصبح وأفطر. بعد ذلك أتعلم الإندونيسية.
        en: I wake up at five. Then I pray the dawn prayer and have breakfast. After that, I study Indonesian.
      - speaker: Kak Tiara
        text: Bagus sekali, Mohamed! Kamu rajin!
        ar_eg: برافو عليك يا محمد! إنت شاطر!
        ar: أحسنت جدًا يا محمد! أنت مجتهد!
        en: Very good, Mohamed! You're diligent!
      - speaker: Kak Reza
        text: Mohamed, sekarang kamu sedang apa? Kamu sudah makan?
        ar_eg: يا محمد، إنت بتعمل إيه دلوقتي؟ أكلت؟
        ar: يا محمد، ماذا تفعل الآن؟ هل أكلت؟
        en: Mohamed, what are you doing now? Have you eaten?
      - speaker: Kak Tiara
        text: Besok pagi, berbicara bahasa Indonesia, ya! Saya bangun, lalu, sesudah itu, sebelum tidur.
        ar_eg: بكرة الصبح اتكلم إندونيسي! بصحى، وبعدين، وبعد كده، وقبل ما أنام.
        ar: غدًا صباحًا تكلّم الإندونيسية! أستيقظ، ثم، بعد ذلك، قبل النوم.
        en: Tomorrow morning, speak Indonesian! I wake up, then, after that, before bed.
        note:
          ar_eg: تحدي بكرة الصغير - احكي يومك في ست جمل بـ lalu وsesudah itu وsebelum.
          ar: تحدّي الغد الصغير - احكِ يومك في ست جمل باستخدام lalu وsesudah itu وsebelum.
          en: Tomorrow's tiny challenge - tell your day in six sentences with lalu, sesudah itu and sebelum.
      - speaker: Kak Reza
        text: Terima kasih, Kak Tiara. Sekarang saya lapar! Saya akan makan nasi uduk di sini.
        ar_eg: شكرًا يا تيارا. دلوقتي أنا جعان! هاكل ناسي أودوك هنا.
        ar: شكرًا يا تيارا. الآن أنا جائع! سآكل ناسي أودوك هنا.
        en: Thank you, Tiara. Now I'm hungry! I'll eat nasi uduk here.
      - speaker: Kak Tiara
        text: Selamat makan, Mas! Terima kasih, Mohamed.
        ar_eg: بالهنا يا رضا! شكرًا يا محمد.
        ar: بالهناء يا رضا! شكرًا يا محمد.
        en: Enjoy your meal, Reza! Thank you, Mohamed.
      - speaker: Kak Reza
        text: Sampai jumpa besok di Kabar Radio, Mohamed!
        ar_eg: أشوفك بكرة في كبار راديو يا محمد!
        ar: إلى اللقاء غدًا في كبار راديو يا محمد!
        en: See you tomorrow on Kabar Radio, Mohamed!
