schema: kabar.radio/v1
id: radio.bipa1.u10
language: id
level: bipa1
unit: bipa1.u10
title:
  target: Pernah naik kapal?
  ar_eg: عمرك ركبت مركب؟
  ar: هل ركبت قاربًا من قبل؟
  en: Ever been on a boat?
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Kemarin di laut
    lines:
      - speaker: Kak Tiara
        text: Halo, selamat pagi! Selamat datang di Kabar Radio! Aku Tiara.
        ar_eg: أهلًا، صباح الخير! أهلًا بيك في كبار راديو! أنا تيارا.
        ar: مرحبًا، صباح الخير! أهلًا بك في كبار راديو! أنا تيارا.
        en: Hello, good morning! Welcome to Kabar Radio! I'm Tiara.
      - speaker: Kak Reza
        text: Aku Reza. Pagi, Tiara! Kemarin ke mana aja?
        ar_eg: وأنا رضا. صباح الخير يا تيارا! إمبارح رحتي فين؟
        ar: وأنا رضا. صباح الخير يا تيارا! إلى أين ذهبتِ أمس؟
        en: And I'm Reza. Morning, Tiara! Where'd you get to yesterday?
        note:
          ar_eg: Ke mana aja? = «كنت فين كده؟» سؤال ودود.
          ar: Ke mana aja? = «أين كنت؟» سؤال ودود.
          en: Ke mana aja? = 'where've you been?', a friendly question.
      - speaker: Kak Tiara
        text: Kemarin aku ke Kepulauan Seribu. Naik kapal dari Marina Ancol.
        ar_eg: إمبارح رحت جزر سريبو. ركبت مركب من مارينا أنشول.
        ar: أمس ذهبتُ إلى جزر سريبو. ركبتُ قاربًا من مارينا أنشول.
        en: Yesterday I went to the Thousand Islands. By boat from Marina Ancol.
        note:
          ar_eg: Kepulauan Seribu يعني «الألف جزيرة» - جزر صغيرة في البحر قصاد جاكرتا، بتروحها بالمركب.
          ar: Kepulauan Seribu تعني «الألف جزيرة» - جزر صغيرة في البحر قبالة جاكرتا، يُوصل إليها بالقارب.
          en: Kepulauan Seribu means "the Thousand Islands" - small islands in the sea off Jakarta, reached by boat.
      - speaker: Kak Reza
        text: Wah, seru! Udah pernah ke sana?
        ar_eg: الله، تجنن! كنتي رحتي هناك قبل كده؟
        ar: رائع! هل زرتِ ذلك المكان من قبل؟
        en: Ooh, fun! Been there before?
      - speaker: Kak Tiara
        text: Belum pernah. Pertama kali! Sekarang capek, tapi seneng banget.
        ar_eg: لأ، عمري ما رحت. دي أول مرة! دلوقتي أنا تعبانة، بس مبسوطة.
        ar: لم يسبق لي. هذه أول مرة! الآن أنا متعبة، لكني سعيدة.
        en: Never. First time! Now I'm tired, but so happy.
        note:
          ar_eg: seneng = senang في الكلام.
          ar: seneng = senang في الكلام اليومي.
          en: seneng is spoken senang.
      - speaker: Kak Reza
        text: Kemarin, tadi, minggu lalu, tahun lalu. Pernah dan belum pernah.
        ar_eg: إمبارح، من شوية، الأسبوع اللي فات، السنة اللي فاتت. حصل قبل كده، ولسه محصلش.
        ar: أمس، قبل قليل، الأسبوع الماضي، العام الماضي. سبق، ولم يسبق بعد.
        en: Yesterday, earlier today, last week, last year. Have ever, and never yet.
        note:
          ar_eg: موضوع النهارده - الكلام عن اللي فات بكلمات الوقت، وpernah (عمرك…؟)، وترتيب الجملة S-P-O-K.
          ar: موضوع اليوم - الحديث عن الماضي بكلمات الزمن، وpernah (هل سبق…؟)، وترتيب الجملة S-P-O-K.
          en: Today's topic - talking about the past with time words, pernah ("have you ever"), and S-P-O-K sentence order.
      - speaker: Kak Tiara
        text: Kemarin saya makan. Sekarang saya makan. Besok saya makan. Kita pakai kemarin, tadi, minggu lalu.
        ar_eg: إمبارح أكلت. دلوقتي باكل. بكرة هاكل. بنستخدم إمبارح، ومن شوية، والأسبوع اللي فات.
        ar: أمس أكلتُ. الآن آكل. غدًا سآكل. نستعمل أمس، وقبل قليل، والأسبوع الماضي.
        en: Yesterday I ate. Now I eat. Tomorrow I'll eat. We use yesterday, earlier, last week.
        note:
          ar_eg: الإندونيسي مفيهوش ماضي - الفعل makan هو هو، وكلمة الوقت هي اللي بتفرق.
          ar: لا زمن ماضيًا في الإندونيسية - الفعل makan لا يتغير، وكلمة الزمن هي الفارق.
          en: Indonesian has no past tense - makan stays the same; the time word makes the difference.
      - speaker: Kak Reza
        text: Halo, Mohamed! Selamat datang di Kepulauan Seribu! Kamu pernah naik kapal?
        ar_eg: أهلًا يا محمد! أهلًا بيك في جزر سريبو! عمرك ركبت مركب؟
        ar: مرحبًا يا محمد! أهلًا بك في جزر سريبو! هل ركبت قاربًا من قبل؟
        en: Hello, Mohamed! Welcome to the Thousand Islands! Have you ever been on a boat?
  - kind: dialogue
    title: Cerita di kapal
    lines:
      - speaker: Kak Reza
        text: Ayo cerita, Tiara! Kemarin bangun jam berapa?
        ar_eg: يا تيارا، احكي! إمبارح الصبح صحيتي الساعة كام؟
        ar: يا تيارا، احكي لنا! متى استيقظتِ صباح أمس؟
        en: Come on, tell us, Tiara! What time did you get up yesterday?
      - speaker: Kak Tiara
        text: Jam lima. Terus salat subuh, sarapan.
        ar_eg: إمبارح الصبح صحيت الساعة خمسة. وبعدين صليت الصبح وفطرت.
        ar: صباح أمس استيقظتُ الساعة الخامسة. ثم صليتُ الصبح وفطرتُ.
        en: At five. Then dawn prayer, breakfast.
      - speaker: Kak Tiara
        text: Jam tujuh aku beli tiket di pelabuhan. Terus naik kapal.
        ar_eg: الساعة سبعة اشتريت تذكرة في الميناء. وبعدين ركبت المركب.
        ar: في السابعة اشتريتُ تذكرة في الميناء. ثم ركبتُ القارب.
        en: At seven I bought a ticket at the harbour. Then I got on the boat.
      - speaker: Kak Reza
        text: Udah pernah naik kapal sebelumnya?
        ar_eg: كنتي ركبتي مركب قبل كده؟
        ar: هل سبق لكِ أن ركبتِ قاربًا؟
        en: Had you ever been on a boat before?
      - speaker: Kak Tiara
        text: Belum pernah! Pertama kali. Lautnya bagus banget.
        ar_eg: لأ، عمري. دي أول مرة! البحر جميل أوي.
        ar: لم يسبق لي. هذه أول مرة! البحر جميل جدًا.
        en: Never! First time. The sea was gorgeous.
      - speaker: Kak Reza
        text: Habis sampai di pulau, makan apa?
        ar_eg: بعد ما وصلتي الجزيرة، أكلتي إيه؟
        ar: بعد أن وصلتِ إلى الجزيرة، ماذا أكلتِ؟
        en: Once you got to the island, what did you eat?
      - speaker: Kak Tiara
        text: Kami makan ikan bakar. Enak banget!
        ar_eg: بعد ما وصلنا الجزيرة، أكلنا سمك مشوي. حلو أوي!
        ar: بعد أن وصلنا إلى الجزيرة، أكلنا سمكًا مشويًا. لذيذ جدًا!
        en: We had grilled fish. So good!
      - speaker: Kak Tiara
        text: Habis itu, berenang di laut. Ikannya banyak banget!
        ar_eg: بعد كده عُمنا في البحر. السمك كان كتير أوي!
        ar: بعد ذلك سبحنا في البحر. كان السمك كثيرًا جدًا!
        en: After that, we swam in the sea. Loads of fish!
      - speaker: Kak Reza
        text: Foto-foto, nggak?
        ar_eg: صورتي؟
        ar: هل التقطتِ صورًا؟
        en: Did you take photos?
        note:
          ar_eg: foto-foto = يصور كتير، أكتر من memotret في الكلام.
          ar: foto-foto = التقاط الصور، وهي أشيع من memotret في الكلام.
          en: foto-foto = taking photos; more common than memotret in speech.
      - speaker: Kak Tiara
        text: Iya dong! Aku foto laut sama pulaunya. Bagus-bagus, lho.
        ar_eg: أيوه! على الشط صوّرت البحر والجزيرة. الصور حلوة أوي.
        ar: نعم! على الشاطئ صوّرتُ البحر والجزيرة. الصور جميلة جدًا.
        en: Of course! I photographed the sea and the island. They're really nice.
      - speaker: Kak Reza
        text: Pulang ke Jakarta jam berapa?
        ar_eg: رجعتي جاكرتا الساعة كام؟
        ar: متى عدتِ إلى جاكرتا؟
        en: What time did you get back to Jakarta?
      - speaker: Kak Tiara
        text: Jam empat naik kapal lagi. Sampai Marina Ancol jam enam.
        ar_eg: الساعة أربعة العصر ركبنا المركب تاني. ووصلنا مارينا أنشول الساعة ستة.
        ar: في الرابعة عصرًا ركبنا القارب مجددًا. ووصلنا إلى مارينا أنشول في السادسة.
        en: At four we got on the boat again. Back at Marina Ancol at six.
      - speaker: Kak Reza
        text: Seru banget! Pernah nyoba snorkeling?
        ar_eg: الله، تجنن! عمرك جربتي السنوركلينج؟
        ar: رائع جدًا! هل جرّبتِ الغطس السطحي من قبل؟
        en: So fun! Ever tried snorkelling?
        note:
          ar_eg: nyoba = mencoba في الكلام.
          ar: nyoba = mencoba في الكلام اليومي.
          en: nyoba is spoken mencoba.
      - speaker: Kak Tiara
        text: Pernah, kemarin! Kamu pernah?
        ar_eg: أيوه، إمبارح! وإنت يا رضا عمرك عملت سنوركلينج؟
        ar: نعم، أمس! وأنت يا رضا، هل جرّبته؟
        en: Yes, yesterday! Have you?
      - speaker: Kak Reza
        text: Pernah, dong. Tahun lalu aku snorkeling di Laut Merah, di Mesir.
        ar_eg: أيوه. السنة اللي فاتت عملت سنوركلينج في البحر الأحمر، في مصر.
        ar: نعم. في العام الماضي غطستُ في البحر الأحمر، في مصر.
        en: Sure have. Last year I snorkelled in the Red Sea, in Egypt.
      - speaker: Kak Tiara
        text: Di Mesir? Wah! Aku belum pernah ke Mesir. Pengin banget ke sana!
        ar_eg: في مصر؟ الله! أنا عمري ما رحت مصر. نفسي أروح هناك!
        ar: في مصر؟ رائع! لم أزر مصر قط. أريد أن أذهب إلى هناك!
        en: In Egypt? Wow! I've never been to Egypt. I'd love to go!
      - speaker: Kak Reza
        text: Ikannya cantik banget. Mohamed pernah ke Laut Merah, kan?
        ar_eg: السمك هناك حلو أوي. ومحمد راح البحر الأحمر قبل كده، صح؟
        ar: السمك جميل جدًا هناك. ومحمد زار البحر الأحمر من قبل، أليس كذلك؟
        en: The fish are gorgeous. Mohamed's been to the Red Sea, right?
      - speaker: Kak Tiara
        text: Sekarang main kalimat, yuk. Aku bikin kalimat, kamu jadi guru.
        ar_eg: يلا نلعب لعبة الجمل. أنا أعمل جملة، وإنت المدرس.
        ar: لنلعب لعبة الجمل. أنا أكوّن جملة، وأنت المعلم.
        en: Now let's play a sentence game. I'll make a sentence, you're the teacher.
        note:
          ar_eg: تيارا هتغلط في ترتيب الكلام بقصد، ورضا هيصححلها. bikin = membuat.
          ar: ستخطئ تيارا في ترتيب الكلمات عمدًا، وسيصحح رضا. bikin = membuat.
          en: Tiara will make a word-order mistake on purpose, and Reza will fix it. bikin = membuat.
      - speaker: Kak Reza
        text: Oke! Coba bikin kalimat tentang kemarin.
        ar_eg: تمام! اعملي جملة عن إمبارح.
        ar: حسنًا! كوّني جملة عن أمس.
        en: OK! Make a sentence about yesterday.
      - speaker: Kak Tiara
        text: Kemarin saya tiket membeli di pelabuhan.
        ar_eg: إمبارح أنا تذكرة اشتريت في الميناء.
        ar: أمس أنا تذكرةً اشتريت في الميناء.
        en: Yesterday I ticket bought at the harbour.
      - speaker: Kak Reza
        text: Hampir betul! Objek setelah predikat.
        ar_eg: قربتي! المفعول بييجي بعد الفعل.
        ar: قاربتِ! المفعول يأتي بعد الفعل.
        en: Almost right! The object comes after the predicate.
      - speaker: Kak Tiara
        text: Kemarin saya membeli tiket di pelabuhan.
        ar_eg: إمبارح اشتريت تذكرة في الميناء.
        ar: أمس اشتريتُ تذكرة في الميناء.
        en: Yesterday I bought a ticket at the harbour.
      - speaker: Kak Reza
        text: Bener banget! Kalimatmu bagus.
        ar_eg: صح جدًا! جملتك حلوة.
        ar: صحيح تمامًا! جملتكِ جيدة.
        en: Exactly! Your sentence is good.
  - kind: word_spotlight
    title: Kemarin, pernah, kalimat
    lines:
      - speaker: Kak Tiara
        text: Kemarin. Kemarin dulu. Tadi. Tadi pagi saya makan nasi goreng.
        ar_eg: إمبارح. أول إمبارح. من شوية. الصبح أكلت ناسي جورينج.
        ar: أمس. أول أمس. قبل قليل. هذا الصباح أكلتُ ناسي غورينغ.
        en: Yesterday. The day before yesterday. Earlier. This morning I ate fried rice.
        note:
          ar_eg: الفعل مبيتغيرش - makan هي «باكل» وهي «أكلت». كلمة الوقت هي اللي بتقول.
          ar: الفعل لا يتغير - makan تعني «آكل» و«أكلتُ». كلمة الزمن هي التي تحدد.
          en: The verb never changes - makan is both "eat" and "ate". The time word tells you.
      - speaker: Kak Reza
        text: Minggu lalu, bulan lalu, tahun lalu. Tahun lalu saya di Kairo. Sekarang saya di Jakarta.
        ar_eg: الأسبوع اللي فات، الشهر اللي فات، السنة اللي فاتت. السنة اللي فاتت كنت في القاهرة. دلوقتي أنا في جاكرتا.
        ar: الأسبوع الماضي، الشهر الماضي، العام الماضي. في العام الماضي كنتُ في القاهرة. الآن أنا في جاكرتا.
        en: Last week, last month, last year. Last year I was in Cairo. Now I'm in Jakarta.
      - speaker: Kak Tiara
        text: Setelah, sebelum. Setelah salat Jumat, kami makan siang.
        ar_eg: بعد، قبل. بعد صلاة الجمعة اتغدينا.
        ar: بعد، قبل. بعد صلاة الجمعة تناولنا الغداء.
        en: After, before. After Friday prayers, we had lunch.
      - speaker: Kak Reza
        text: Pernah. Kamu pernah ke Mesir? Saya pernah belajar di Al-Azhar.
        ar_eg: عمرك. عمرك رحت مصر؟ أنا درست في الأزهر قبل كده.
        ar: سبق. هل سبق أن زرت مصر؟ سبق أن درستُ في الأزهر.
        en: Ever. Have you ever been to Egypt? I once studied at Al-Azhar.
        note:
          ar_eg: pernah زي «عمرك…؟» أو «قبل كده». الرد - Pernah (أيوه) أو Belum pernah (لسه لأ).
          ar: pernah مثل «هل سبق…؟». الجواب - Pernah (نعم) أو Belum pernah (لم يسبق بعد).
          en: pernah is "have you ever…?". Answer Pernah (yes) or Belum pernah (not yet).
      - speaker: Kak Tiara
        text: Belum pernah. Saya belum pernah naik kapal. Tidak pernah. Dia tidak pernah makan pedas.
        ar_eg: لسه محصلش. عمري ما ركبت مركب لسه. أبدًا. هو عمره ما بياكل حراق.
        ar: لم يسبق بعد. لم أركب قاربًا بعد. أبدًا. هو لا يأكل الحار أبدًا.
        en: Never yet. I've never been on a boat yet. Never. He never eats spicy food.
        note:
          ar_eg: belum pernah فيها أمل (لسه)، وtidak pernah معناها «أبدًا».
          ar: belum pernah فيها أمل (لم يحدث بعد)، وtidak pernah تعني «أبدًا».
          en: belum pernah is hopeful (not yet), tidak pernah means "never ever".
      - speaker: Kak Reza
        text: Udah pernah? Belum pernah! Nggak pernah. Dia nggak pernah makan pedes.
        ar_eg: جربت قبل كده؟ لسه! عمره ما... هو عمره ما أكل حراق.
        ar: هل جربت من قبل؟ ليس بعد! أبدًا. هو لا يأكل الحار أبدًا.
        en: Ever? Not yet! Never. He never eats spicy food.
        note:
          ar_eg: 'في الكلام: udah pernah = sudah pernah، nggak pernah = tidak pernah.'
          ar: 'في الكلام اليومي: udah pernah = sudah pernah، nggak pernah = tidak pernah.'
          en: 'Spoken: udah pernah = sudah pernah, nggak pernah = tidak pernah.'
      - speaker: Kak Reza
        text: Pertama kali. Ini pertama kali saya ke Kepulauan Seribu.
        ar_eg: أول مرة. دي أول مرة أروح جزر سريبو.
        ar: أول مرة. هذه أول مرة أزور فيها جزر سريبو.
        en: The first time. This is my first time in the Thousand Islands.
      - speaker: Kak Tiara
        text: Kalimat. Kalimat. Kalimatmu bagus.
        ar_eg: جملة. جملة. جملتك حلوة.
        ar: جملة. جملة. جملتك جيدة.
        en: Sentence. Sentence. Your sentence is good.
        note:
          ar_eg: الجسر العربي - kalimat من «كلمة»، بس معناها في الإندونيسي «جملة» مش «كلمة».
          ar: الجسر العربي - kalimat من «كلمة»، لكنها تعني بالإندونيسية «جملة» لا «كلمة».
          en: Arabic Bridge - kalimat comes from «كلمة», but in Indonesian it means "sentence", not "word".
      - speaker: Kak Reza
        text: Subjek, predikat, objek, keterangan. Saya membeli tiket di pelabuhan.
        ar_eg: فاعل، فعل، مفعول، ظرف. أنا اشتريت تذكرة في الميناء.
        ar: فاعل، مسند، مفعول، ظرف. اشتريتُ تذكرة في الميناء.
        en: Subject, predicate, object, adverbial. I bought a ticket at the harbour.
      - speaker: Kak Tiara
        text: Ibu memasak nasi di dapur setiap pagi.
        ar_eg: ماما بتطبخ رز في المطبخ كل يوم الصبح.
        ar: أمي تطبخ الأرز في المطبخ كل صباح.
        en: Mother cooks rice in the kitchen every morning.
      - speaker: Kak Reza
        text: Kemarin kami naik kapal ke Kepulauan Seribu. Di pantai, Rina memotret laut.
        ar_eg: إمبارح ركبنا مركب لجزر سريبو. على الشط، رينا صوّرت البحر.
        ar: أمس ركبنا القارب إلى جزر سريبو. على الشاطئ صوّرت رينا البحر.
        en: Yesterday we took a boat to the Thousand Islands. On the beach, Rina photographed the sea.
        note:
          ar_eg: الظرف (الوقت أو المكان) ينفع ييجي في الأول، بس المفعول دايمًا بعد الفعل.
          ar: يجوز تقديم الظرف (الزمان أو المكان)، أما المفعول فيأتي دائمًا بعد الفعل.
          en: The adverbial (time or place) can move to the front, but the object always follows the verb.
  - kind: recap
    title: Capek, tapi senang
    lines:
      - speaker: Kak Tiara
        text: Kemarin saya ke Kepulauan Seribu.
        ar_eg: إمبارح رحت جزر سريبو.
        ar: أمس ذهبتُ إلى جزر سريبو.
        en: Yesterday I went to the Thousand Islands.
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
          ar: ببطء. ردّد كل جملة بعدنا.
          en: Slowly. Repeat each sentence after us.
      - speaker: Kak Reza
        text: Kemarin saya ke Kepulauan Seribu.
        ar_eg: إمبارح رحت جزر سريبو.
        ar: أمس ذهبتُ إلى جزر سريبو.
        en: Yesterday I went to the Thousand Islands.
      - speaker: Kak Tiara
        text: Saya naik kapal dari Marina Ancol.
        ar_eg: ركبت مركب من مارينا أنشول.
        ar: ركبتُ قاربًا من مارينا أنشول.
        en: I took a boat from Marina Ancol.
      - speaker: Kak Reza
        text: Saya naik kapal dari Marina Ancol.
        ar_eg: ركبت مركب من مارينا أنشول.
