        ar: بعد أن وصلنا إلى الجزيرة، أكلنا سمكًا مشويًا.
        en: After arriving on the island, we ate grilled fish.
      - speaker: Mas Ardi
        text: Setelah sampai di pulau, kami makan ikan bakar.
        ar_eg: بعد ما وصلنا الجزيرة، أكلنا سمك مشوي.
        ar: بعد أن وصلنا إلى الجزيرة، أكلنا سمكًا مشويًا.
        en: After arriving on the island, we ate grilled fish.
