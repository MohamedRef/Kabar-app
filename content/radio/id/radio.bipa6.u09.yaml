schema: kabar.radio/v1
id: radio.bipa6.u09
language: id
level: bipa6
unit: bipa6.u09
title:
  target: Menolak tanpa berkata tidak
  ar_eg: ترفض من غير ما تقول لأ
  ar: الرفض دون قول «لا»
  en: Saying no without saying no
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Rendang dan bisnis
    lines:
      - {speaker: Kak Tiara, text: "Selamat siang dari Padang! Ini Kabar Radio. Saya Tiara.", ar_eg: "مساء الخير من بادانج! ده كبار راديو. أنا تيارا.", ar: "طاب يومكم من بادانغ! هذا كبار راديو. أنا تيارا.", en: "Good afternoon from Padang! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Kami baru makan rendang di rumah makan Padang. Rumah makan seperti ini ada di seluruh Indonesia.", ar_eg: "أنا رضا. لسه واكلين رندانج في مطعم بادانج. المطاعم دي موجودة في إندونيسيا كلها.", ar: "أنا رضا. أكلنا للتو الرندانغ في مطعم بادانغ، ومثل هذه المطاعم منتشرة في أنحاء إندونيسيا.", en: "I'm Reza. We've just eaten rendang at a Padang restaurant. Restaurants like this are all over Indonesia."}
      - {speaker: Kak Tiara, text: "Orang Minang terkenal sebagai pedagang. Mereka pandai bernegosiasi, dengan cara yang halus.", ar_eg: "المينانج مشهورين إنهم تجار. وشاطرين في التفاوض، بطريقة ناعمة.", ar: "يشتهر المينانغ بالتجارة، ويبرعون في التفاوض بأسلوب لطيف.", en: "The Minang are famous traders. They're skilled negotiators, in a gentle way."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar negosiasi tidak langsung, menolak dengan halus, dan surat bisnis."
        ar_eg: "النهارده هنتعلم التفاوض غير المباشر، والرفض بلطف، والمراسلات التجارية."
        ar: "اليوم نتعلم التفاوض غير المباشر، والرفض بلطف، والمراسلات التجارية."
        en: "Today we learn indirect negotiation, polite refusal, and business letters."
      - {speaker: Kak Tiara, text: "Mohamed, orang Mesir jago menawar di pasar, kan?", ar_eg: "يا محمد، المصريين جامدين في الفصال في السوق، صح؟", ar: "يا محمد، المصريون بارعون في المساومة بالسوق، أليس كذلك؟", en: "Mohamed, Egyptians are great at haggling in the market, right?"}
  - kind: dialogue
    title: Rapat dengan investor
    lines:
      - speaker: Kak Tiara
        text: "Saya pemilik rumah makan yang ingin membuka cabang. Kak Reza calon investor."
        ar_eg: "أنا صاحبة مطعم عايزة أفتح فرع. ورضا مستثمر محتمل."
        ar: "أنا صاحبة مطعم تريد افتتاح فرع، ورضا مستثمر محتمل."
        en: "I own a restaurant and want to open a branch. Reza is a possible investor."
        note:
          ar_eg: "خلي بالك: ولا مرة حد قال «لأ» صريحة."
          ar: "لاحظ: لم يقل أحد «لا» صراحة قط."
          en: "Notice: no one ever says a flat 'no'."
      - {speaker: Kak Reza, text: "Rendangnya luar biasa, Bu. Saya tertarik bekerja sama.", ar_eg: "الرندانج تحفة يا مدام. أنا مهتم إننا نشتغل مع بعض.", ar: "الرندانغ رائع يا سيدتي، وأنا مهتم بالتعاون.", en: "The rendang is wonderful, ma'am. I'm interested in working together."}
      - {speaker: Kak Tiara, text: "Terima kasih, Pak. Kami menawarkan kerja sama waralaba dengan bagi hasil tiga puluh persen.", ar_eg: "شكرًا يا فندم. بنعرض شراكة امتياز تجاري بنسبة أرباح تلاتين في المية.", ar: "شكرًا يا سيدي. نعرض شراكة امتياز تجاري بتقاسم أرباح بنسبة ثلاثين بالمئة.", en: "Thank you, sir. We're offering a franchise partnership with a thirty percent profit share."}
      - {speaker: Kak Reza, text: "Hmm, tawaran yang menarik. Akan saya pertimbangkan dulu, ya.", ar_eg: "همم، عرض مثير للاهتمام. هفكر فيه الأول.", ar: "عرض مثير للاهتمام. سأدرسه أولًا.", en: "Hmm, an interesting offer. Let me think it over first."}
      - {speaker: Kak Tiara, text: "Itu artinya dia belum setuju. Sekarang saya bertanya dengan halus: Apakah ada yang bisa kami sesuaikan?", ar_eg: "ده معناه إنه لسه مش موافق. دلوقتي هسأل بلطف: «فيه حاجة نقدر نظبطها؟»", ar: "هذا يعني أنه لم يوافق بعد. والآن أسأل بلطف: «هل هناك ما يمكننا تعديله؟»", en: "That means he doesn't agree yet. Now I ask gently: Is there anything we could adjust?"}
      - {speaker: Kak Reza, text: "Mungkin bagi hasilnya bisa dibicarakan lagi. Dua puluh persen barangkali lebih cocok untuk tahun pertama.", ar_eg: "يمكن نسبة الأرباح نتكلم فيها تاني. عشرين في المية يمكن أنسب للسنة الأولى.", ar: "ربما نعيد بحث نسبة الأرباح؛ عشرون بالمئة قد تكون أنسب للسنة الأولى.", en: "Perhaps the profit share could be discussed again. Twenty percent might suit the first year better."}
      - {speaker: Kak Tiara, text: "Kami paham. Bagaimana kalau dua puluh lima persen, dengan promosi bersama saat Ramadan?", ar_eg: "فاهمين. إيه رأيك خمسة وعشرين في المية، مع دعاية مشتركة في رمضان؟", ar: "نتفهم ذلك. ما رأيك بخمسة وعشرين بالمئة مع حملة ترويج مشتركة في رمضان؟", en: "We understand. How about twenty-five percent, with joint promotion during Ramadan?"}
      - {speaker: Kak Reza, text: "Itu terdengar adil. Mohon dikirimkan draf kontraknya, nanti kami pelajari.", ar_eg: "ده شكله عادل. ياريت تبعتولنا مسودة العقد، وهندرسها.", ar: "يبدو هذا عادلًا. نرجو إرسال مسودة العقد لندرسها.", en: "That sounds fair. Please send the draft contract and we'll study it."}
      - {speaker: Kak Tiara, text: "Baik, Pak. Hubungan baik lebih penting daripada keuntungan cepat.", ar_eg: "حاضر يا فندم. العلاقة الكويسة أهم من المكسب السريع.", ar: "حسنًا يا سيدي. العلاقة الطيبة أهم من الربح السريع.", en: "Certainly, sir. A good relationship matters more than quick profit."}
      - {speaker: Kak Reza, text: "Setuju. Kalau begitu, mari kita makan rendang lagi untuk merayakan!", ar_eg: "موافق. يبقى يلا ناكل رندانج تاني نحتفل!", ar: "موافق. إذن لنأكل الرندانغ مجددًا احتفالًا!", en: "Agreed. Then let's have more rendang to celebrate!"}
  - kind: word_spotlight
    title: Menolak dengan halus
    lines:
      - speaker: Kak Tiara
        text: "Akan saya pertimbangkan: belum ya, mungkin tidak. Nanti saya kabari: jangan ditunggu terlalu lama."
        ar_eg: "«هفكر فيها»: لسه مش موافق، ويمكن لأ. «هبقى أبلغك»: ما تستناش كتير."
        ar: "«سأدرس الأمر»: ليس بعد، وربما لا. «سأبلغك لاحقًا»: لا تنتظر طويلًا."
        en: "I'll consider it: not yet, maybe no. I'll let you know: don't hold your breath."
        note:
          ar_eg: "زي «إن شاء الله» لما المصري يقصد بيها «غالبًا لأ» هههه."
          ar: "تشبه «إن شاء الله» حين يُقصد بها الاعتذار المهذب."
          en: "Like an Egyptian «إن شاء الله» that really means 'probably not'."
      - {speaker: Kak Reza, text: "Sayang sekali, saat ini kami belum bisa. Mungkin lain kali.", ar_eg: "للأسف، حاليًا لسه مش هنقدر. يمكن مرة تانية.", ar: "للأسف، لا نستطيع في الوقت الحالي. ربما في مرة أخرى.", en: "Unfortunately, we can't for now. Maybe another time."}
      - {speaker: Kak Tiara, text: "Tawaran, bagi hasil, waralaba, kontrak, draf, keuntungan, kerugian.", ar_eg: "عرض، تقسيم الأرباح، امتياز تجاري، عقد، مسودة، مكسب، خسارة.", ar: "عرض، تقاسم الأرباح، امتياز تجاري، عقد، مسودة، ربح، خسارة.", en: "Offer, profit share, franchise, contract, draft, profit, loss."}
      - {speaker: Kak Reza, text: "Surat bisnis: Dengan hormat, bersama surat ini kami sampaikan penawaran…", ar_eg: "الجوابات التجارية: «تحية طيبة وبعد، نتشرف بأن نقدم لكم مع هذا الخطاب عرضنا…»", ar: "المراسلات التجارية: «تحية طيبة وبعد، نرفق بهذه الرسالة عرضنا…»", en: "Business letter: Dear Sir or Madam, with this letter we submit our offer…"}
      - {speaker: Kak Tiara, text: "Penutup: Atas perhatian dan kerja samanya, kami ucapkan terima kasih.", ar_eg: "الختام: «شاكرين حسن اهتمامكم وتعاونكم».", ar: "الختام: «نشكركم على حسن اهتمامكم وتعاونكم».", en: "Closing: Thank you for your attention and cooperation."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Tawaran yang menarik. Akan saya pertimbangkan dulu."
        ar_eg: "عرض مثير للاهتمام. هفكر فيه الأول."
        ar: "عرض مثير للاهتمام. سأدرسه أولًا."
        en: "An interesting offer. Let me consider it first."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Tawaran yang menarik. Akan saya pertimbangkan dulu.", ar_eg: "عرض مثير للاهتمام. هفكر فيه الأول.", ar: "عرض مثير للاهتمام. سأدرسه أولًا.", en: "An interesting offer. Let me consider it first."}
      - {speaker: Kak Tiara, text: "Apakah ada yang bisa kami sesuaikan?", ar_eg: "فيه حاجة نقدر نظبطها؟", ar: "هل هناك ما يمكننا تعديله؟", en: "Is there anything we could adjust?"}
      - {speaker: Kak Reza, text: "Apakah ada yang bisa kami sesuaikan?", ar_eg: "فيه حاجة نقدر نظبطها؟", ar: "هل هناك ما يمكننا تعديله؟", en: "Is there anything we could adjust?"}
      - {speaker: Kak Tiara, text: "Sayang sekali, saat ini kami belum bisa.", ar_eg: "للأسف، حاليًا لسه مش هنقدر.", ar: "للأسف، لا نستطيع حاليًا.", en: "Unfortunately, we can't for now."}
      - {speaker: Kak Reza, text: "Sayang sekali, saat ini kami belum bisa.", ar_eg: "للأسف، حاليًا لسه مش هنقدر.", ar: "للأسف، لا نستطيع حاليًا.", en: "Unfortunately, we can't for now."}
      - {speaker: Kak Tiara, text: "Mohon dikirimkan draf kontraknya.", ar_eg: "ياريت تبعتوا مسودة العقد.", ar: "نرجو إرسال مسودة العقد.", en: "Please send the draft contract."}
      - {speaker: Kak Reza, text: "Mohon dikirimkan draf kontraknya.", ar_eg: "ياريت تبعتوا مسودة العقد.", ar: "نرجو إرسال مسودة العقد.", en: "Please send the draft contract."}
  - kind: outro
    title: Negosiasi Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, atasanmu meminta kamu lembur setiap Sabtu. Tolak dengan halus dan tawarkan jalan tengah."
        ar_eg: "يا محمد، مديرك طلب منك تشتغل وقت إضافي كل سبت. ارفض بلطف واعرض حل وسط."
        ar: "يا محمد، طلب رئيسك أن تعمل ساعات إضافية كل سبت. ارفض بلطف واقترح حلًا وسطًا."
        en: "Mohamed, your boss asks you to work overtime every Saturday. Decline politely and offer a middle way."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Terima kasih atas kepercayaannya, Pak. Sayang sekali, setiap Sabtu saya belum bisa. Bagaimana kalau dua kali sebulan?", ar_eg: "مثلًا: «شكرًا على ثقة حضرتك. للأسف كل سبت مش هقدر. إيه رأيك مرتين في الشهر؟»", ar: "مثلًا: «شكرًا على ثقتك يا سيدي. للأسف لا أستطيع كل سبت. ما رأيك بمرتين في الشهر؟»", en: "For example: Thank you for your trust, sir. Unfortunately I can't every Saturday. How about twice a month?"}
      - {speaker: Kak Tiara, text: "Besok, tulis surat bisnis singkat untuk membalas sebuah penawaran.", ar_eg: "بكرة، اكتب جواب تجاري قصير ترد بيه على عرض.", ar: "غدًا، اكتب رسالة تجارية قصيرة ردًا على عرض.", en: "Tomorrow, write a short business letter replying to an offer."}
      - {speaker: Kak Reza, text: "Atas perhatian dan kerja samanya, kami ucapkan terima kasih, Mohamed!", ar_eg: "شاكرين حسن اهتمامك وتعاونك يا محمد!", ar: "نشكرك على حسن اهتمامك وتعاونك يا محمد!", en: "Thank you for your attention and cooperation, Mohamed!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [tawaran, waralaba, dengan hormat, belum bisa, cabang, halus, investor, menawarkan, penawaran, promosi]
review:
  status: draft
  verified: false
  notes: |
    Role-play; the restaurant and figures are invented. No real brands named.
