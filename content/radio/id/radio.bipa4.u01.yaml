title:
  target: Pembuat pinisi
  ar_eg: صانع البينيسي
  ar: صانع سفن البينيسي
  en: The pinisi builder
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Halo, Makassar!
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Makassar, Sulawesi Selatan! Kabar Radio sudah pindah pulau. Saya Tiara.", ar_eg: "صباح الخير من ماكاسار، في جنوب سولاويسي! كبار راديو نقل جزيرة جديدة. أنا تيارا.", ar: "صباح الخير من مكاسر، في جنوب سولاويسي! انتقل كبار راديو إلى جزيرة جديدة. أنا تيارا.", en: "Good morning from Makassar, South Sulawesi! Kabar Radio has moved islands. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Aduh, tadi pagi saya tertidur di bandara dan hampir ketinggalan pesawat!", ar_eg: "أنا رضا. آه، الصبح غفلت في المطار وكانت الطيارة هتفوتني!", ar: "أنا رضا. آه، غلبني النوم صباحًا في المطار وكادت الطائرة تفوتني!", en: "I'm Reza. Ugh, this morning I nodded off at the airport and nearly missed my flight!"}
      - speaker: Kak Tiara
        text: "Ha ha. Hari ini kita bicara tentang profesi. Orang Bugis dan Makassar terkenal sebagai pelaut dan pembuat kapal."
        ar_eg: "هههه. النهارده هنتكلم عن المهن. البوجيس وأهل ماكاسار مشهورين إنهم بحّارة وصنّاع مراكب."
        ar: "هاها. اليوم نتحدث عن المهن. يشتهر البوغيس وأهل مكاسر بأنهم بحّارة وصنّاع سفن."
        en: "Ha ha. Today we talk about professions. The Bugis and Makassarese are famous as sailors and shipbuilders."
        note:
          ar_eg: "البينيسي مراكب خشب كبيرة بشراعين، لسه بتتعمل في بولوكومبا، وهي في قايمة تراث اليونسكو."
          ar: "البينيسي سفن خشبية كبيرة بصاريين، ما زالت تُصنع في بولوكومبا، ومدرجة في قائمة تراث اليونسكو."
          en: "The pinisi is a great two-masted wooden schooner, still built in Bulukumba and on UNESCO's heritage list."
      - {speaker: Kak Reza, text: "Kita juga belajar awalan ter- dan ke-...-an, seperti tertidur dan kehujanan.", ar_eg: "وكمان هنتعلم ter- وke-...-an، زي tertidur وkehujanan.", ar: "ونتعلم أيضًا السابقة ter- والصيغة ke-...-an، مثل tertidur وkehujanan.", en: "We'll also learn ter- and ke-...-an, like tertidur and kehujanan."}
      - {speaker: Kak Tiara, text: "Mohamed, apa pekerjaanmu, dan apa keahlian yang paling penting untuk pekerjaan itu?", ar_eg: "يا محمد، شغلتك إيه، وإيه أهم مهارة للشغلانة دي؟", ar: "يا محمد، ما عملك، وما أهم مهارة له؟", en: "Mohamed, what's your job, and what skill matters most for it?"}
  - kind: dialogue
    title: Wawancara di galangan kapal
    lines:
      - speaker: Kak Reza
        text: "Kak Tiara, kamu jadi Daeng, pembuat pinisi dari Bulukumba. Saya wartawannya."
        ar_eg: "يا تيارا، إنتي هتبقي «داينج»، صانعة بينيسي من بولوكومبا. وأنا الصحفي."
        ar: "يا تيارا، ستكونين «داينغ»، صانعة بينيسي من بولوكومبا، وأنا الصحفي."
        en: "Tiara, you be a Daeng, a pinisi builder from Bulukumba. I'm the reporter."
        note:
          ar_eg: "Daeng لقب احترام في ماكاسار، زي «أخ كبير / أخت كبيرة»."
          ar: "Daeng لقب احترام في مكاسر، بمعنى «الأخ الأكبر / الأخت الكبرى»."
          en: "Daeng is a Makassarese term of respect, like 'elder brother/sister'."
      - {speaker: Kak Reza, text: "Daeng, sudah berapa lama Daeng membuat kapal?", ar_eg: "يا داينج، بقالك قد إيه بتعمل مراكب؟", ar: "يا داينغ، منذ متى تصنع السفن؟", en: "Daeng, how long have you been building boats?"}
      - {speaker: Kak Tiara, text: "Sejak umur lima belas tahun. Keahlian ini diturunkan dari kakek saya.", ar_eg: "من وأنا عندي خمستاشر سنة. المهارة دي ورثتها عن جدي.", ar: "منذ الخامسة عشرة. ورثت هذه الحرفة عن جدي.", en: "Since I was fifteen. This skill was handed down from my grandfather."}
      - {speaker: Kak Reza, text: "Pinisi terbuat dari apa?", ar_eg: "البينيسي معمولة من إيه؟", ar: "مِمَّ تُصنع البينيسي؟", en: "What is a pinisi made of?"}
      - {speaker: Kak Tiara, text: "Pinisi terbuat dari kayu besi dan kayu jati. Kami tidak memakai gambar atau rencana tertulis.", ar_eg: "البينيسي معمولة من خشب حديدي وخشب تيك. ومبنستخدمش رسم ولا خطة مكتوبة.", ar: "تُصنع البينيسي من خشب الحديد وخشب الساج، ولا نستعمل رسومًا أو مخططات مكتوبة.", en: "A pinisi is made of ironwood and teak. We don't use drawings or written plans."}
      - {speaker: Kak Reza, text: "Tanpa gambar? Bagaimana caranya?", ar_eg: "من غير رسم؟ إزاي يعني؟", ar: "بلا رسوم؟ كيف ذلك؟", en: "No drawings? How?"}
      - {speaker: Kak Tiara, text: "Semuanya ada di kepala para tukang ahli. Yang diperlukan adalah ketelitian dan kesabaran.", ar_eg: "كله في دماغ الصنايعية الكبار. والمطلوب الدقة والصبر.", ar: "كل شيء في رؤوس الحرفيين المهرة. والمطلوب الدقة والصبر.", en: "It's all in the master builders' heads. What you need is precision and patience."}
      - {speaker: Kak Reza, text: "Berapa lama satu kapal dibuat?", ar_eg: "المركب الواحدة بتاخد قد إيه عشان تتعمل؟", ar: "كم يستغرق صنع سفينة واحدة؟", en: "How long does one boat take?"}
      - {speaker: Kak Tiara, text: "Kapal besar bisa satu sampai dua tahun. Kalau musim hujan, kami sering kehujanan dan pekerjaan terlambat.", ar_eg: "المركب الكبيرة ممكن تاخد من سنة لسنتين. وفي موسم المطر، المطر بينزل علينا كتير والشغل بيتأخر.", ar: "السفينة الكبيرة قد تستغرق سنة إلى سنتين. وفي موسم الأمطار كثيرًا ما يصيبنا المطر فيتأخر العمل.", en: "A big boat can take one to two years. In the rainy season we often get rained on and work falls behind."}
      - {speaker: Kak Reza, text: "Apa tantangan terbesar profesi ini sekarang?", ar_eg: "إيه أكبر تحدي للمهنة دي دلوقتي؟", ar: "ما أكبر تحدٍّ لهذه المهنة اليوم؟", en: "What's the biggest challenge for this profession now?"}
      - {speaker: Kak Tiara, text: "Kayu semakin mahal, dan anak muda lebih suka bekerja di kota. Kami kekurangan tukang.", ar_eg: "الخشب بيغلى، والشباب بيحبوا يشتغلوا في المدينة أكتر. إحنا ناقصنا صنايعية.", ar: "الخشب يغلو، والشباب يفضّلون العمل في المدينة، فنحن نعاني نقصًا في الحرفيين.", en: "Wood keeps getting dearer, and young people prefer city jobs. We're short of craftsmen."}
      - {speaker: Kak Reza, text: "Apa pesan Daeng untuk anak muda?", ar_eg: "إيه رسالتك للشباب يا داينج؟", ar: "ما رسالتك للشباب يا داينغ؟", en: "What's your message to young people, Daeng?"}
      - {speaker: Kak Tiara, text: "Pinisi adalah kebanggaan kita. Belajarlah, supaya keahlian ini tidak hilang.", ar_eg: "البينيسي فخرنا. اتعلموا، عشان المهارة دي متضيعش.", ar: "البينيسي مصدر فخرنا. تعلّموا كي لا تضيع هذه الحرفة.", en: "The pinisi is our pride. Learn, so this skill isn't lost."}
  - kind: word_spotlight
    title: Tertidur, kehujanan
    lines:
      - speaker: Kak Tiara
        text: "Ter- berarti tidak sengaja. Tertidur, tertinggal, terjatuh. Paspor saya tertinggal di hotel!"
        ar_eg: "ter- يعني من غير قصد. غفل، اتنسى، وقع. الباسبور بتاعي اتنسى في الأوتيل!"
        ar: "ter- تعني بلا قصد. غفا، نُسي، سقط. نسيت جواز سفري في الفندق!"
        en: "Ter- means by accident. Doze off, get left behind, fall. My passport got left at the hotel!"
      - {speaker: Kak Reza, text: "Ter- juga keadaan. Terletak, terbuat dari, terkenal. Makassar terletak di Sulawesi Selatan.", ar_eg: "ter- كمان للحالة. يقع، معمول من، مشهور. ماكاسار تقع في جنوب سولاويسي.", ar: "ter- للحال أيضًا. يقع، مصنوع من، مشهور. تقع مكاسر في جنوب سولاويسي.", en: "Ter- also shows a state. Located, made of, famous. Makassar is located in South Sulawesi."}
      - speaker: Kak Tiara
        text: "Ke-...-an untuk sesuatu yang tidak enak terjadi kepada kita. Kehujanan, kesiangan, kemalaman."
        ar_eg: "ke-...-an لحاجة وحشة حصلتلنا. المطر نزل عليه، صحي متأخر، الليل دخل عليه."
        ar: "ke-...-an لأمر غير مرغوب أصابنا. أصابه المطر، تأخر في الاستيقاظ، أدركه الليل."
        en: "Ke-...-an is for something unpleasant that happens to us. Get rained on, oversleep, be caught by nightfall."
        note:
          ar_eg: "kehujanan = المطر نزل عليّ، kesiangan = صحيت متأخر، kemalaman = الليل ليّل عليّ في الطريق."
          ar: "kehujanan = أصابني المطر، kesiangan = استيقظت متأخرًا، kemalaman = أدركني الليل."
          en: "Kehujanan = caught in the rain, kesiangan = overslept, kemalaman = caught out after dark."
      - {speaker: Kak Reza, text: "Ke-...-an juga membuat kata benda. Ahli, keahlian. Sabar, kesabaran. Teliti, ketelitian.", ar_eg: "ke-...-an كمان بتعمل اسم. خبير، خبرة. صبور، صبر. دقيق، دقة.", ar: "ke-...-an تصنع الأسماء أيضًا. خبير، خبرة. صبور، صبر. دقيق، دقة.", en: "Ke-...-an also makes nouns. Expert, expertise. Patient, patience. Careful, precision."}
      - {speaker: Kak Tiara, text: "Profesi, keahlian, pengalaman, gaji, karier.", ar_eg: "مهنة، مهارة، خبرة، مرتب، مسيرة مهنية.", ar: "مهنة، مهارة، خبرة، راتب، مسيرة مهنية.", en: "Profession, skill, experience, salary, career."}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Pinisi terbuat dari kayu besi dan kayu jati."
        ar_eg: "البينيسي معمولة من خشب حديدي وخشب تيك."
        ar: "تُصنع البينيسي من خشب الحديد وخشب الساج."
        en: "A pinisi is made of ironwood and teak."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Pinisi terbuat dari kayu besi dan kayu jati.", ar_eg: "البينيسي معمولة من خشب حديدي وخشب تيك.", ar: "تُصنع البينيسي من خشب الحديد وخشب الساج.", en: "A pinisi is made of ironwood and teak."}
      - {speaker: Kak Tiara, text: "Saya tertidur di bandara.", ar_eg: "غفلت في المطار.", ar: "غلبني النوم في المطار.", en: "I nodded off at the airport."}
      - {speaker: Kak Reza, text: "Saya tertidur di bandara.", ar_eg: "غفلت في المطار.", ar: "غلبني النوم في المطار.", en: "I nodded off at the airport."}
      - {speaker: Kak Tiara, text: "Kami sering kehujanan.", ar_eg: "المطر بينزل علينا كتير.", ar: "كثيرًا ما يصيبنا المطر.", en: "We often get rained on."}
      - {speaker: Kak Reza, text: "Kami sering kehujanan.", ar_eg: "المطر بينزل علينا كتير.", ar: "كثيرًا ما يصيبنا المطر.", en: "We often get rained on."}
      - {speaker: Kak Tiara, text: "Yang diperlukan adalah kesabaran.", ar_eg: "المطلوب هو الصبر.", ar: "المطلوب هو الصبر.", en: "What's needed is patience."}
      - {speaker: Kak Reza, text: "Yang diperlukan adalah kesabaran.", ar_eg: "المطلوب هو الصبر.", ar: "المطلوب هو الصبر.", en: "What's needed is patience."}
  - kind: outro
    title: Profesi Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, jelaskan profesimu. Keahlian apa yang diperlukan? Apa tantangannya?"
        ar_eg: "يا محمد، اشرح مهنتك. محتاجة مهارة إيه؟ وإيه تحدياتها؟"
        ar: "يا محمد، اشرح مهنتك. ما المهارة التي تحتاجها؟ وما تحدياتها؟"
        en: "Mohamed, describe your profession. What skill does it need? What's the challenge?"
        note:
          ar_eg: "دورك! استخدم كلمة فيها ke-...-an."
          ar: "دورك! استعمل كلمة على وزن ke-...-an."
          en: "Your turn! Use one ke-...-an word."
      - {speaker: Kak Reza, text: "Contohnya: Saya seorang insinyur. Yang diperlukan adalah ketelitian. Tantangannya, kadang-kadang saya kemalaman di kantor.", ar_eg: "مثلًا: أنا مهندس. المطلوب الدقة. والتحدي إني ساعات الليل بيليّل عليا في المكتب.", ar: "مثلًا: أنا مهندس. المطلوب الدقة. والتحدي أن الليل يدركني أحيانًا في المكتب.", en: "For example: I'm an engineer. What's needed is precision. The challenge: sometimes I'm still at the office after dark."}
      - {speaker: Kak Tiara, text: "Besok, tulis teks eksposisi pendek tentang profesi impianmu.", ar_eg: "بكرة، اكتب نص شرح قصير عن شغلانة أحلامك.", ar: "غدًا، اكتب نصًا تفسيريًا قصيرًا عن مهنة أحلامك.", en: "Tomorrow, write a short exposition about your dream job."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Jangan kesiangan besok, ya!", ar_eg: "شكرًا يا محمد. متصحاش متأخر بكرة!", ar: "شكرًا يا محمد. لا تتأخر في الاستيقاظ غدًا!", en: "Thank you, Mohamed. Don't oversleep tomorrow!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "أشوفكم بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [keahlian, kesabaran, tertidur, tertinggal, terletak, terbuat dari, kehujanan, kesiangan, pelaut, ahli, sengaja]
