schema: kabar.radio/v1
id: radio.bipa1.u05
language: id
level: bipa1
unit: bipa1.u05
title:
  target: Liburan di Ancol
  ar_eg: أجازة في أنشول
  ar: عطلة في أنشول
  en: A holiday in Ancol
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 5
segments:
  - kind: intro
    title: Halo dari Ancol
    lines:
      - speaker: Kak Tiara
        text: Halo, selamat pagi! Selamat datang di Kabar Radio! Aku Tiara.
        ar_eg: أهلًا، صباح الخير! أهلًا بيك في كبار راديو! أنا تيارا.
        ar: مرحبًا، صباح الخير! أهلًا بك في كبار راديو! أنا تيارا.
        en: Hello, good morning! Welcome to Kabar Radio! I'm Tiara.
      - speaker: Kak Reza
        text: Aku Reza. Pagi, Tiara! Hari ini Minggu!
        ar_eg: وأنا رضا. صباح الخير يا تيارا! النهارده الحد!
        ar: وأنا رضا. صباح الخير يا تيارا! اليوم الأحد!
        en: And I'm Reza. Morning, Tiara! It's Sunday!
      - speaker: Kak Tiara
        text: Ya! Hari Minggu kita jalan-jalan. Kita berlibur di Ancol.
        ar_eg: أيوه! يوم الحد بنتفسح. إحنا في أجازة في أنشول.
        ar: نعم! يوم الأحد نتنزّه. نحن في عطلة في أنشول.
        en: Yes! On Sunday we go out. We're on holiday in Ancol.
        note:
          ar_eg: أنشول منطقة على البحر في شمال جاكرتا، فيها شط وملاهي وجناين. خروجة الحد مع العيلة عادة قومية.
          ar: أنشول منطقة ساحلية في شمال جاكرتا فيها شاطئ وملاهٍ وحدائق. ونزهة الأحد مع العائلة عادة وطنية.
          en: Ancol is Jakarta's northern seafront, with a beach, parks and rides. A Sunday outing with family is a national pastime.
      - speaker: Kak Reza
        text: Cuacanya gimana?
        ar_eg: الجو عامل إيه؟
        ar: كيف الطقس؟
        en: How's the weather?
        note:
          ar_eg: gimana = bagaimana في الكلام، وبتيجي في آخر السؤال كتير.
          ar: gimana = bagaimana في الكلام، وكثيرًا ما تأتي في آخر السؤال.
          en: gimana is spoken bagaimana, often at the end of the question.
      - speaker: Kak Tiara
        text: Cerah, panas banget. Nggak ada hujan.
        ar_eg: صافي، وحر أوي. مفيش مطر.
        ar: صافٍ وحار جدًا. لا مطر.
        en: Clear and really hot. No rain.
        note:
          ar_eg: nggak ada = tidak ada = «مفيش».
          ar: nggak ada = tidak ada = «لا يوجد».
          en: nggak ada = tidak ada = 'there isn't'.
      - speaker: Kak Reza
        text: Wah, asyik! Di Ancol ada pantai, ada taman, ada kolam renang.
        ar_eg: الله، حلو! في أنشول فيه شط، وفيه جنينة، وفيه حمام سباحة.
        ar: رائع! في أنشول شاطئ وحديقة ومسبح.
        en: Great! In Ancol there's a beach, a park and a swimming pool.
      - speaker: Kak Reza
        text: Hari Minggu Ancol rame banget. Banyak keluarga.
        ar_eg: يوم الحد أنكول بتبقى زحمة أوي. عائلات كتير.
        ar: يوم الأحد تزدحم أنكول جدًا. عائلات كثيرة.
        en: On Sundays Ancol is packed. Lots of families.
      - speaker: Kak Tiara
        text: Iya. Anak-anak main, orang tuanya jalan-jalan di pantai.
        ar_eg: أيوه. العيال بيلعبوا، والأهالي بيتمشوا على الشط.
        ar: نعم. الأطفال يلعبون، والآباء يمشون على الشاطئ.
        en: Yeah. The kids play, the parents stroll on the beach.
      - speaker: Kak Tiara
        text: Berlibur, berenang, bermain. Ada dan tidak ada. Bagaimana? Boleh?
        ar_eg: يتفسح، يعوم، يلعب. فيه ومفيش. إزاي؟ ينفع؟
        ar: يقضي العطلة، يسبح، يلعب. يوجد ولا يوجد. كيف؟ هل يجوز؟
        en: Holidaying, swimming, playing. There is and there isn't. How? May I?
        note:
          ar_eg: موضوع النهارده - أفعال ber-، وada (فيه)، وbagaimana (إزاي)، والاستئذان بأدب.
          ar: موضوع اليوم - أفعال ber-، وada (يوجد)، وbagaimana (كيف)، والاستئذان بأدب.
          en: Today's topic - ber- verbs, ada (there is), bagaimana (how), and asking permission politely.
      - speaker: Kak Reza
        text: Halo, Mohamed! Selamat datang di Ancol! Selamat berlibur!
        ar_eg: أهلًا يا محمد! أهلًا بيك في أنشول! أجازة سعيدة!
        ar: مرحبًا يا محمد! أهلًا بك في أنشول! عطلة سعيدة!
        en: Hello, Mohamed! Welcome to Ancol! Enjoy your holiday!
  - kind: dialogue
    title: Di loket Ancol
    lines:
      - speaker: Kak Reza
        text: Permisi, Mbak. Berapa harga tiket masuk?
        ar_eg: لو سمحتي. تذكرة الدخول بكام؟
        ar: عفوًا يا آنسة. كم سعر تذكرة الدخول؟
        en: Excuse me. How much is an entrance ticket?
        note:
          ar_eg: مشهد تمثيلي - تيارا موظفة الشباك، ورضا زائر جاي يتفسح.
          ar: مشهد تمثيلي - تيارا موظفة الشبّاك، ورضا زائر جاء للتنزّه.
          en: A role-play - Tiara works at the ticket window, Reza is a visitor.
      - speaker: Kak Tiara
        text: Tiga puluh lima ribu rupiah, Pak.
        ar_eg: خمسة وتلاتين ألف روبية يا أستاذ.
        ar: خمسة وثلاثون ألف روبية يا سيدي.
        en: Thirty-five thousand rupiah, sir.
      - speaker: Kak Reza
        text: Dua tiket, Mbak. Saya dan istri saya.
        ar_eg: تذكرتين لو سمحتي. أنا ومراتي.
        ar: تذكرتان من فضلك. لي ولزوجتي.
        en: Two tickets, please. For me and my wife.
      - speaker: Kak Tiara
        text: Jadi tujuh puluh ribu, Pak.
        ar_eg: يبقى سبعين ألف يا أستاذ.
        ar: المجموع سبعون ألفًا يا سيدي.
        en: That makes seventy thousand, sir.
      - speaker: Kak Reza
        text: Ini uangnya. Mbak, di Ancol ada kolam renang?
        ar_eg: اتفضلي الفلوس. فيه حمام سباحة في أنشول؟
        ar: تفضّلي المال. هل في أنشول مسبح؟
        en: Here's the money. Is there a swimming pool in Ancol?
      - speaker: Kak Tiara
        text: Ada, Pak. Kolam renang buka jam delapan.
        ar_eg: أيوه فيه. حمام السباحة بيفتح الساعة تمانية.
        ar: نعم، يوجد. المسبح يفتح الساعة الثامنة.
        en: Yes, there is. The pool opens at eight.
      - speaker: Kak Reza
        text: Ada masjid juga?
        ar_eg: وفيه جامع كمان؟
        ar: وهل يوجد مسجد أيضًا؟
        en: Is there a mosque too?
      - speaker: Kak Tiara
        text: Ada, Pak. Ada masjid, dan ada toilet juga.
        ar_eg: أيوه فيه. فيه جامع، وفيه حمامات كمان.
        ar: نعم، يوجد. يوجد مسجد، وتوجد دورات مياه أيضًا.
        en: Yes. There's a mosque, and there are toilets too.
      - speaker: Kak Reza
        text: Ada restoran Mesir?
        ar_eg: فيه مطعم مصري؟
        ar: هل يوجد مطعم مصري؟
        en: Is there an Egyptian restaurant?
      - speaker: Kak Tiara
        text: Wah, maaf, Pak. Tidak ada! Tapi ada banyak restoran Indonesia.
        ar_eg: يا خبر، آسفة يا أستاذ. مفيش! بس فيه مطاعم إندونيسي كتير.
        ar: عذرًا يا سيدي. لا يوجد! لكن توجد مطاعم إندونيسية كثيرة.
        en: Oh, sorry, sir. There isn't one! But there are lots of Indonesian restaurants.
      - speaker: Kak Reza
        text: Boleh saya foto di pantai?
        ar_eg: ينفع أصوّر على الشط؟
        ar: هل يُسمح لي بالتصوير على الشاطئ؟
        en: May I take photos on the beach?
      - speaker: Kak Tiara
        text: Boleh, Pak. Silakan.
        ar_eg: ينفع يا أستاذ. اتفضل.
        ar: يُسمح يا سيدي. تفضّل.
        en: Yes, you may. Go ahead.
      - speaker: Kak Reza
        text: Terima kasih banyak, Mbak.
        ar_eg: متشكر جدًا.
        ar: شكرًا جزيلًا.
        en: Thank you very much.
      - speaker: Kak Tiara
        text: Sama-sama, Pak. Selamat berlibur!
        ar_eg: العفو يا أستاذ. أجازة سعيدة!
        ar: عفوًا يا سيدي. عطلة سعيدة!
        en: You're welcome, sir. Enjoy your holiday!
      - speaker: Kak Reza
        text: Tiara! Halo! Liburannya gimana?
        ar_eg: تيارا! أهلًا! الأجازة كانت عاملة إيه؟
        ar: تيارا! مرحبًا! كيف كانت عطلتكِ؟
        en: Tiara! Hi! How was the holiday?
        note:
          ar_eg: يوم الاتنين الصبح. خلص التمثيل، ورضا وتيارا رجعوا الاستوديو.
          ar: صباح الاثنين. انتهى التمثيل، وعاد رضا وتيارا إلى الاستوديو.
          en: Monday morning. The role-play is over; Reza and Tiara are back in the studio.
      - speaker: Kak Tiara
        text: Seru banget! Aku berenang di pantai. Anak-anak main di taman.
        ar_eg: كانت تجنن! عُمت في البحر. والعيال لعبوا في الجنينة.
        ar: كانت ممتعة! سبحتُ في البحر. ولعب الأطفال في الحديقة.
        en: So fun! I swam at the beach. The kids played in the park.
        note:
          ar_eg: مفيش أزمنة في الإندونيسي - نفس الفعل berenang للماضي والحاضر، والسياق بيوضح.
          ar: لا أزمنة في الإندونيسية - الفعل berenang نفسه للماضي والحاضر، والسياق يوضّح.
          en: Indonesian has no tenses - the same berenang works for past and present; context tells you.
      - speaker: Kak Reza
        text: Cuacanya gimana?
        ar_eg: والجو كان عامل إيه؟
        ar: وكيف كان الطقس؟
        en: How was the weather?
      - speaker: Kak Tiara
        text: Cerah, nggak ada hujan. Kamu gimana, Reza?
        ar_eg: صافي، مفيش مطر. وإنت عامل إيه يا رضا؟
        ar: صافٍ، لا مطر. وأنت يا رضا؟
        en: Clear, no rain. How about you, Reza?
      - speaker: Kak Reza
        text: Aku kerja hari Minggu. Tapi aku belajar bahasa Arab juga, lho!
        ar_eg: أنا اشتغلت يوم الحد. بس كمان ذاكرت عربي، على فكرة!
        ar: عملتُ يوم الأحد. لكني درست العربية أيضًا، بالمناسبة!
        en: I worked on Sunday. But I studied Arabic too, you know!
        note:
          ar_eg: kerja = bekerja في الكلام. وlho = «على فكرة!» لما تقول حاجة تفاجئ.
          ar: kerja = bekerja في الكلام اليومي. وlho = «بالمناسبة!» حين تقول شيئًا مفاجئًا.
          en: kerja is spoken bekerja. lho = 'you know!' for a little surprise.
      - speaker: Kak Tiara
        text: Gimana kalau Minggu depan kita ke Ancol bareng?
        ar_eg: إيه رأيك الحد الجاي نروح أنكول سوا؟
        ar: ما رأيك أن نذهب إلى أنكول معًا الأحد القادم؟
        en: How about we go to Ancol together next Sunday?
        note:
          ar_eg: Gimana kalau...? = إيه رأيك لو...؟ وbareng = مع بعض.
          ar: Gimana kalau...؟ = ما رأيك لو...؟ وbareng = معًا.
          en: Gimana kalau...? = how about...? bareng = together.
      - speaker: Kak Reza
        text: Boleh! Asyik! Makasih, Tiara.
        ar_eg: ماشي! حلو! شكرًا يا تيارا.
        ar: موافق! رائع! شكرًا يا تيارا.
        en: Sure! Great! Thanks, Tiara.
  - kind: word_spotlight
    title: Berlibur, ada, bagaimana
    lines:
      - speaker: Kak Tiara
        text: Berlibur. Berenang. Bermain.
        ar_eg: يتفسح في أجازة. يعوم. يلعب.
        ar: يقضي عطلة. يسبح. يلعب.
        en: To holiday. To swim. To play.
        note:
          ar_eg: البادئة ber- بتعمل فعل نشاط - libur (أجازة) تبقى berlibur (يعمل أجازة).
          ar: البادئة ber- تصنع فعل نشاط - libur (إجازة) تصير berlibur (يقضي إجازة).
          en: The prefix ber- makes an activity verb - libur (day off) becomes berlibur (to go on holiday).
      - speaker: Kak Reza
        text: Kami berlibur di Ancol. Rina berenang di pantai.
        ar_eg: إحنا في أجازة في أنشول. رينا بتعوم في البحر.
        ar: نقضي عطلتنا في أنشول. رينا تسبح في البحر.
        en: We're on holiday in Ancol. Rina is swimming at the beach.
      - speaker: Kak Tiara
        text: Bekerja. Belajar. Saya bekerja di Jakarta. Kami belajar bahasa Indonesia.
        ar_eg: يشتغل. يتعلم. أنا بشتغل في جاكرتا. إحنا بنتعلم إندونيسي.
        ar: يعمل. يتعلّم. أعمل في جاكرتا. نتعلّم الإندونيسية.
        en: To work. To study. I work in Jakarta. We're learning Indonesian.
      - speaker: Kak Tiara
        text: Berjalan. Berbicara. Kami berjalan di pantai. Mohamed berbicara bahasa Indonesia.
        ar_eg: يمشي. يتكلم. إحنا بنتمشى على الشط. محمد بيتكلم إندونيسي.
        ar: يمشي. يتكلّم. نمشي على الشاطئ. محمد يتكلّم الإندونيسية.
        en: To walk. To speak. We walk on the beach. Mohamed speaks Indonesian.
      - speaker: Kak Reza
        text: Ada. Ada. Ada pantai? Ada. Ada restoran Mesir? Tidak ada.
        ar_eg: فيه. فيه. فيه شط؟ فيه. فيه مطعم مصري؟ مفيش.
        ar: يوجد. يوجد. أيوجد شاطئ؟ نعم. أيوجد مطعم مصري؟ لا يوجد.
        en: There is. There is. Is there a beach? Yes. Is there an Egyptian restaurant? No.
        note:
          ar_eg: ada زي «فيه» بالظبط، والنفي tidak ada زي «مفيش».
          ar: ada مثل «يوجد» تمامًا، ونفيها tidak ada أي «لا يوجد».
          en: ada works just like Egyptian «فيه», and tidak ada like «مفيش».
      - speaker: Kak Tiara
        text: Tidak ada, nggak ada. Ada restoran Mesir? Nggak ada.
        ar_eg: Tidak ada وnggak ada. فيه مطعم مصري؟ مفيش.
        ar: Tidak ada وnggak ada. هل يوجد مطعم مصري؟ لا يوجد.
        en: Tidak ada, nggak ada. Is there an Egyptian restaurant? Nope.
        note:
          ar_eg: في الشارع tidak بتبقى nggak. الاتنين نفس المعنى.
          ar: في الكلام اليومي تصبح tidak كلمة nggak، والمعنى واحد.
          en: On the street tidak becomes nggak. Same meaning.
      - speaker: Kak Tiara
        text: Masjid. Masjid. Di Ancol ada masjid.
        ar_eg: جامع. جامع. في أنشول فيه جامع.
        ar: مسجد. مسجد. في أنشول مسجد.
        en: Mosque. Mosque. There's a mosque in Ancol.
        note:
          ar_eg: الجسر العربي - masjid جاية من «مسجد»، وmusim (فصل) من «موسم».
          ar: الجسر العربي - masjid من «مسجد»، وmusim (الفصل) من «موسم».
          en: Arabic Bridge - masjid comes from «مسجد», and musim (season) from «موسم».
      - speaker: Kak Tiara
        text: Ada apa, Kak Reza? Ada apa?
        ar_eg: فيه إيه يا رضا؟ فيه إيه؟
        ar: ما الأمر يا رضا؟ ما الأمر؟
        en: What's up, Reza? What's wrong?
      - speaker: Kak Reza
        text: Maaf, saya terlambat!
        ar_eg: آسف، اتأخرت!
        ar: آسف، تأخرتُ!
        en: Sorry, I'm late!
      - speaker: Kak Reza
        text: Musim. Musim hujan. Musim panas.
        ar_eg: موسم. موسم المطر. الصيف.
        ar: موسم. موسم المطر. الصيف.
        en: Season. Rainy season. Summer.
      - speaker: Kak Tiara
        text: Bagaimana. Bagaimana. Bagaimana liburanmu? Seru!
        ar_eg: إزاي. إزاي. أجازتك كانت عاملة إيه؟ تجنن!
        ar: كيف. كيف. كيف كانت عطلتك؟ ممتعة!
        en: How. How. How was your holiday? Fun!
      - speaker: Kak Reza
        text: Gimana? Gimana, seru? Gimana kalau kita ke pantai besok?
        ar_eg: إيه الأخبار؟ كانت حلوة؟ إيه رأيك نروح الشط بكرة؟
        ar: كيف؟ هل كانت ممتعة؟ ما رأيك أن نذهب إلى الشاطئ غدًا؟
        en: How was it? Fun? How about we go to the beach tomorrow?
        note:
          ar_eg: gimana هي bagaimana بتاعة الشارع، مع الصحاب وفي الشات. هتسمعها أكتر بكتير من bagaimana.
          ar: gimana هي الصيغة اليومية لـbagaimana، مع الأصدقاء وفي المحادثة. ستسمعها أكثر بكثير.
          en: gimana is street bagaimana, for friends and chat - you'll hear it far more often.
      - speaker: Kak Tiara
        text: Boleh. Silakan. Boleh saya duduk? Silakan.
        ar_eg: ينفع. اتفضل. ينفع أقعد؟ اتفضل.
        ar: يجوز. تفضّل. هل لي أن أجلس؟ تفضّل.
        en: May. Please, go ahead. May I sit down? Please do.
      - speaker: Kak Reza
        text: Permisi, Pak. Boleh saya foto? Silakan, silakan.
        ar_eg: لو سمحت يا أستاذ. ينفع أصوّر؟ اتفضل، اتفضل.
        ar: عفوًا يا سيدي. هل لي أن ألتقط صورة؟ تفضّل، تفضّل.
        en: Excuse me, sir. May I take a photo? Go ahead, go ahead.
        note:
          ar_eg: permisi بتفتح أي طلب من حد غريب، زي «لو سمحت».
          ar: permisi تفتتح أي طلب من شخص غريب، مثل «لو سمحت».
          en: permisi opens almost any request to a stranger, like "excuse me".
  - kind: recap
    title: Seru!
    lines:
      - speaker: Kak Tiara
        text: Hari Minggu kami berlibur ke Ancol.
        ar_eg: يوم الحد رحنا أجازة في أنشول.
        ar: يوم الأحد قضينا عطلة في أنشول.
        en: On Sunday we went on holiday to Ancol.
        note:
          ar_eg: بالراحة. كرر ورانا كل جملة.
          ar: ببطء. ردّد كل جملة بعدنا.
          en: Slowly. Repeat each sentence after us.
      - speaker: Kak Reza
        text: Hari Minggu kami berlibur ke Ancol.
        ar_eg: يوم الحد رحنا أجازة في أنشول.
        ar: يوم الأحد قضينا عطلة في أنشول.
        en: On Sunday we went on holiday to Ancol.
      - speaker: Kak Tiara
        text: Anak-anak bermain di taman.
        ar_eg: العيال بيلعبوا في الجنينة.
        ar: الأطفال يلعبون في الحديقة.
        en: The children play in the park.
      - speaker: Kak Reza
        text: Anak-anak bermain di taman.
        ar_eg: العيال بيلعبوا في الجنينة.
        ar: الأطفال يلعبون في الحديقة.
        en: The children play in the park.
      - speaker: Kak Tiara
        text: Di Ancol ada pantai. Di Ancol ada masjid.
        ar_eg: في أنشول فيه شط. في أنشول فيه جامع.
        ar: في أنشول شاطئ. في أنشول مسجد.
        en: There's a beach in Ancol. There's a mosque in Ancol.
      - speaker: Kak Reza
        text: Ada restoran Mesir? Maaf, tidak ada.
        ar_eg: فيه مطعم مصري؟ آسف، مفيش.
        ar: هل يوجد مطعم مصري؟ عذرًا، لا يوجد.
        en: Is there an Egyptian restaurant? Sorry, there isn't.
      - speaker: Kak Tiara
        text: Saya bekerja di Jakarta. Kami belajar bahasa Indonesia.
        ar_eg: أنا بشتغل في جاكرتا. إحنا بنتعلم إندونيسي.
        ar: أعمل في جاكرتا. نتعلّم الإندونيسية.
        en: I work in Jakarta. We're learning Indonesian.
