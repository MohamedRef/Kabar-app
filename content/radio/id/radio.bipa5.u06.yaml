schema: kabar.radio/v1
id: radio.bipa5.u06
language: id
level: bipa5
unit: bipa5.u06
title:
  target: Tarian burung enggang
  ar_eg: رقصة طير أبو قرن
  ar: رقصة طائر أبو قرن
  en: The hornbill dance
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Malam di Palangka Raya
    lines:
      - {speaker: Kak Tiara, text: "Selamat malam dari Palangka Raya! Ini Kabar Radio. Saya Tiara.", ar_eg: "مساء الخير من بالانجكا رايا! ده كبار راديو. أنا تيارا.", ar: "مساء الخير من بالانغكا رايا! هذا كبار راديو. أنا تيارا.", en: "Good evening from Palangka Raya! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Saya Reza. Kami baru keluar dari pertunjukan tari di sebuah sanggar seni.", ar_eg: "أنا رضا. لسه خارجين من عرض رقص في مركز فنون.", ar: "أنا رضا. خرجنا للتو من عرض رقص في مركز فني.", en: "I'm Reza. We've just come out of a dance show at an arts studio."}
      - {speaker: Kak Tiara, text: "Penarinya meniru burung enggang. Bagi orang Dayak, burung ini sangat dihormati.", ar_eg: "الراقصين كانوا بيقلدوا طير أبو قرن. عند الداياك، الطير ده ليه احترام كبير.", ar: "قلّد الراقصون طائر أبو قرن، وهو طائر يُجلّه الداياك كثيرًا.", en: "The dancers imitated the hornbill. For the Dayak, this bird is deeply respected."}
      - speaker: Kak Reza
        text: "Hari ini kita belajar menulis ulasan, dan kata kerja per- dan memper-."
        ar_eg: "النهارده هنتعلم نكتب نقد لعرض، والأفعال اللي بـper- وmemper-."
        ar: "اليوم نتعلم كتابة المراجعة النقدية، والأفعال بـper- وmemper-."
        en: "Today we learn to write a review, and per- and memper- verbs."
      - {speaker: Kak Tiara, text: "Mohamed, kapan terakhir kamu menonton pertunjukan?", ar_eg: "يا محمد، آخر مرة اتفرجت على عرض كانت امتى؟", ar: "يا محمد، متى شاهدت عرضًا آخر مرة؟", en: "Mohamed, when did you last see a performance?"}
  - kind: dialogue
    title: Ngobrol setelah pertunjukan
    lines:
      - speaker: Kak Tiara
        text: "Kita mengulas pertunjukan tadi. Dengar cara kami memuji dan mengkritik."
        ar_eg: "هنعمل نقد للعرض اللي شفناه. اسمع إزاي بنمدح وبننتقد."
        ar: "سنراجع العرض الذي شاهدناه. استمع إلى طريقتنا في المدح والنقد."
        en: "Let's review the show. Listen to how we praise and critique."
        note:
          ar_eg: "النقد في إندونيسيا بيبدأ بالمدح وبعدين اقتراح بلطف."
          ar: "يبدأ النقد في إندونيسيا بالثناء ثم الاقتراح بلطف."
          en: "Indonesian critique starts with praise, then a gentle suggestion."
      - {speaker: Kak Reza, text: "Menurut saya, gerakan tangannya luar biasa. Seperti sayap enggang yang terbuka.", ar_eg: "في رأيي، حركة الإيدين كانت تحفة. زي جناحات أبو قرن وهي مفتوحة.", ar: "في رأيي، كانت حركات اليدين رائعة، كجناحي أبي قرن المنبسطين.", en: "In my view, the hand movements were amazing. Like a hornbill's open wings."}
      - {speaker: Kak Tiara, text: "Setuju. Bulu enggang di kepala penari juga indah sekali.", ar_eg: "موافقة. والريش اللي على راس الراقصة كان جميل جدًا.", ar: "أوافق. وكان الريش على رأس الراقصة جميلًا جدًا.", en: "Agreed. The hornbill feathers on the dancer's head were beautiful too."}
      - {speaker: Kak Reza, text: "Musiknya dari sape, alat musik petik Dayak. Bunyinya lembut dan berulang.", ar_eg: "المزيكا كانت من السابي، آلة وترية بتاعة الداياك. صوتها ناعم وبيتكرر.", ar: "كانت الموسيقى من السابي، وهي آلة وترية للداياك، صوتها رقيق ومتكرر.", en: "The music was from the sape, a Dayak plucked instrument. Its sound is soft and repetitive."}
      - {speaker: Kak Tiara, text: "Apa ada kekurangannya?", ar_eg: "فيه حاجة ناقصة؟", ar: "هل من مآخذ؟", en: "Were there any weaknesses?"}
      - {speaker: Kak Reza, text: "Sedikit. Lampunya terlalu gelap. Sebaiknya sanggar memperbaiki tata cahaya.", ar_eg: "حاجة بسيطة. الإضاءة كانت ضلمة أوي. ياريت المركز يصلّح الإضاءة.", ar: "قليلة: الإضاءة معتمة جدًا، والأفضل أن يحسّن المركز الإضاءة.", en: "A little. The lighting was too dark. The studio should improve the lighting."}
      - {speaker: Kak Tiara, text: "Dan mungkin mereka bisa memperpanjang bagian akhir. Saya belum puas!", ar_eg: "ويمكن كمان يطوّلوا الجزء الأخير. أنا لسه ما شبعتش!", ar: "وربما يطيلون الجزء الأخير، فلم أكتفِ بعد!", en: "And maybe they could lengthen the ending. I wasn't satisfied yet!"}
      - {speaker: Kak Reza, text: "Ha! Itu pujian juga. Tadi pelatihnya bilang mereka akan mempertunjukkan tari ini di Jakarta.", ar_eg: "ها! ده مدح برضه. المدرّب قال إنهم هيعرضوا الرقصة دي في جاكرتا.", ar: "ها! هذا مديح أيضًا. قال المدرب إنهم سيعرضون هذه الرقصة في جاكرتا.", en: "Ha! That's praise too. The trainer said they'll perform this dance in Jakarta."}
      - {speaker: Kak Tiara, text: "Kesimpulannya: pertunjukan yang memukau, dengan sedikit catatan teknis.", ar_eg: "الخلاصة: عرض يخطف العين، مع ملاحظات فنية بسيطة.", ar: "الخلاصة: عرض أخّاذ مع ملاحظات تقنية قليلة.", en: "In short: a stunning show, with a few technical notes."}
  - kind: word_spotlight
    title: Per- dan memper-
    lines:
      - speaker: Kak Tiara
        text: "Memper- artinya membuat lebih: panjang menjadi memperpanjang, besar menjadi memperbesar."
        ar_eg: "memper- معناها «يخلّيه أكتر»: طويل ← يطوّل، كبير ← يكبّر."
        ar: "memper- تعني «يجعله أكثر»: طويل ← يطيل، كبير ← يكبّر."
        en: "Memper- means 'make more': long → lengthen, big → enlarge."
        note:
          ar_eg: "شبه وزن «فعّل» في العربي: كبّر، طوّل، حسّن."
          ar: "يشبه وزن «فعّل» في العربية: كبّر، طوّل، حسّن."
          en: "Like the Arabic form «فعّل»: كبّر، طوّل، حسّن."
      - {speaker: Kak Reza, text: "Memperbaiki: membuat jadi baik. Memperkenalkan: membuat orang kenal.", ar_eg: "memperbaiki: يصلّح. memperkenalkan: يعرّف الناس بحاجة.", ar: "memperbaiki: يصلح. memperkenalkan: يعرّف.", en: "Memperbaiki: to fix. Memperkenalkan: to introduce."}
      - {speaker: Kak Tiara, text: "Mempertunjukkan: menampilkan di depan penonton.", ar_eg: "mempertunjukkan: يعرض قدام الجمهور.", ar: "mempertunjukkan: يعرض أمام الجمهور.", en: "Mempertunjukkan: to perform before an audience."}
      - {speaker: Kak Reza, text: "Penari, penonton, panggung, sanggar, gerakan, kostum, tata cahaya.", ar_eg: "راقص، متفرج، مسرح، مركز فنون، حركة، لبس العرض، الإضاءة.", ar: "راقص، متفرج، خشبة المسرح، مركز فني، حركة، أزياء، إضاءة.", en: "Dancer, audience, stage, studio, movement, costume, lighting."}
      - {speaker: Kak Tiara, text: "Untuk ulasan: memukau, mengesankan, kurang rapi, sebaiknya…", ar_eg: "للنقد: يخطف العين، مؤثر، مش متظبط قوي، الأحسن إن…", ar: "للمراجعة: أخّاذ، مؤثر، غير متقن، الأفضل أن…", en: "For a review: stunning, impressive, a bit untidy, it would be better to…"}
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Gerakan tangannya luar biasa."
        ar_eg: "حركة الإيدين كانت تحفة."
        ar: "كانت حركات اليدين رائعة."
        en: "The hand movements were amazing."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Gerakan tangannya luar biasa.", ar_eg: "حركة الإيدين كانت تحفة.", ar: "كانت حركات اليدين رائعة.", en: "The hand movements were amazing."}
      - {speaker: Kak Tiara, text: "Sebaiknya mereka memperbaiki tata cahaya.", ar_eg: "الأحسن يصلّحوا الإضاءة.", ar: "الأفضل أن يحسّنوا الإضاءة.", en: "They should improve the lighting."}
      - {speaker: Kak Reza, text: "Sebaiknya mereka memperbaiki tata cahaya.", ar_eg: "الأحسن يصلّحوا الإضاءة.", ar: "الأفضل أن يحسّنوا الإضاءة.", en: "They should improve the lighting."}
      - {speaker: Kak Tiara, text: "Mereka akan mempertunjukkan tari ini di Jakarta.", ar_eg: "هيعرضوا الرقصة دي في جاكرتا.", ar: "سيعرضون هذه الرقصة في جاكرتا.", en: "They will perform this dance in Jakarta."}
      - {speaker: Kak Reza, text: "Mereka akan mempertunjukkan tari ini di Jakarta.", ar_eg: "هيعرضوا الرقصة دي في جاكرتا.", ar: "سيعرضون هذه الرقصة في جاكرتا.", en: "They will perform this dance in Jakarta."}
      - {speaker: Kak Tiara, text: "Pertunjukan yang memukau.", ar_eg: "عرض يخطف العين.", ar: "عرض أخّاذ.", en: "A stunning show."}
      - {speaker: Kak Reza, text: "Pertunjukan yang memukau.", ar_eg: "عرض يخطف العين.", ar: "عرض أخّاذ.", en: "A stunning show."}
  - kind: outro
    title: Ulasan Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ulas satu film atau konser yang kamu tonton. Satu pujian, satu saran."
        ar_eg: "يا محمد، اعمل نقد لفيلم أو حفلة شفتها. مدح واحد واقتراح واحد."
        ar: "يا محمد، راجع فيلمًا أو حفلًا شاهدته: مديح واحد واقتراح واحد."
        en: "Mohamed, review a film or concert you saw. One compliment, one suggestion."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Lagunya mengesankan, tetapi sebaiknya mereka memperpendek pidato di tengah konser.", ar_eg: "مثلًا: الأغاني كانت مؤثرة، بس الأحسن يقصّروا الكلام اللي في نص الحفلة.", ar: "مثلًا: كانت الأغاني مؤثرة، لكن الأفضل أن يختصروا الكلمة في منتصف الحفل.", en: "For example: The songs were impressive, but they should shorten the speech mid-concert."}
      - {speaker: Kak Tiara, text: "Besok, tulis ulasan lima kalimat.", ar_eg: "بكرة، اكتب نقد في خمس جمل.", ar: "غدًا، اكتب مراجعة من خمس جمل.", en: "Tomorrow, write a five-sentence review."}
      - {speaker: Kak Reza, text: "Terima kasih, Mohamed. Selamat malam!", ar_eg: "شكرًا يا محمد. تصبح على خير!", ar: "شكرًا يا محمد. طابت ليلتك!", en: "Thank you, Mohamed. Good night!"}
      - {speaker: Kak Tiara, text: "Sampai jumpa besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [sanggar, penari, penonton, ulasan, memperbaiki, mempertunjukkan, memperkenalkan, memukau, alat musik, bagian, bulu, gerakan]
review:
  status: draft
  verified: false
  notes: |
    Spot-check: hornbill (enggang) dance and feathers in Dayak dance; sape as a Dayak
    plucked lute. The show and trainer are fictional.
