schema: kabar.radio/v1
id: radio.bipa5.u06
language: id
level: bipa5
unit: bipa5.u06
title:
  target: Tarian burung enggang
  ar_eg: رقصة طير أبو قرن
  ar: رقصة طائر أبو قرن
  en: The hornbill dance
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 6
segments:
  - kind: intro
    title: Malam di Palangka Raya
    lines:
      - {speaker: Kak Tiara, text: "Selamat malam dari Palangka Raya! Ini Kabar Radio. Aku Tiara.", ar_eg: "مساء الخير من بالانجكا رايا! ده كبار راديو. أنا تيارا.", ar: "مساء الخير من بالانغكا رايا! هذا كبار راديو. أنا تيارا.", en: "Good evening from Palangka Raya! This is Kabar Radio. I'm Tiara."}
      - {speaker: Kak Reza, text: "Aku Reza. Kita baru keluar dari pertunjukan tari di sanggar seni.", ar_eg: "أنا رضا. لسه خارجين من عرض رقص في مركز فنون.", ar: "أنا رضا. خرجنا للتو من عرض رقص في مركز فني.", en: "I'm Reza. We've just come out of a dance show at an arts studio."}
      - speaker: Kak Tiara
        text: "Penarinya meniru burung enggang. Bagi orang Dayak, burung ini sangat dihormati."
        ar_eg: "الراقصين كانوا بيقلدوا طير أبو قرن. عند الداياك، الطير ده ليه احترام كبير."
        ar: "قلّد الراقصون طائر أبو قرن، وهو طائر يُجلّه الداياك كثيرًا."
        en: "The dancers imitated the hornbill. For the Dayak, this bird is deeply respected."
        note:
          ar_eg: "كلمات: dihormati = محترم، الناس بتحترمه."
          ar: "مفردات: dihormati = يُحترَم."
          en: "Words: dihormati = to be respected."
      - speaker: Kak Reza
        text: "Hari ini kita belajar nulis ulasan, terus kata kerja per- sama memper-."
        ar_eg: "النهارده هنتعلم نكتب نقد لعرض، والأفعال اللي بـper- وmemper-."
        ar: "اليوم نتعلم كتابة المراجعة النقدية، والأفعال بـper- وmemper-."
        en: "Today we learn to write a review, and per- and memper- verbs."
        note:
          ar_eg: "كلمات: per = لكل، في الـ."
          ar: "مفردات: per = لكلّ، في."
          en: "Words: per = per, each."
      - speaker: Kak Tiara
        text: "Mohamed, terakhir nonton pertunjukan kapan?"
        ar_eg: "يا محمد، آخر مرة اتفرجت على عرض كانت امتى؟"
        ar: "يا محمد، متى شاهدت عرضًا آخر مرة؟"
        en: "Mohamed, when did you last see a performance?"
        note:
          ar_eg: "كلمات: nonton = يتفرج على."
          ar: "مفردات: nonton = يشاهد."
          en: "Words: nonton = to watch."
  - kind: dialogue
    title: Ngobrol setelah pertunjukan
    lines:
      - speaker: Kak Tiara
        text: "Kita bahas pertunjukan tadi, yuk. Dengerin cara kita muji sama ngritik."
        ar_eg: "هنعمل نقد للعرض اللي شفناه. اسمع إزاي بنمدح وبننتقد."
        ar: "سنراجع العرض الذي شاهدناه. استمع إلى طريقتنا في المدح والنقد."
        en: "Let's review the show. Listen to how we praise and critique."
        note:
          ar_eg: "النقد في إندونيسيا بيبدأ بالمدح وبعدين اقتراح بلطف. كلمات: bahas = ناقش، اتكلم في."
          ar: "يبدأ النقد في إندونيسيا بالثناء ثم الاقتراح بلطف. مفردات: bahas = ناقِشْ."
          en: "Indonesian critique starts with praise, then a gentle suggestion. Words: bahas = discuss."
      - speaker: Kak Reza
        text: "Menurutku, gerakan tangannya keren banget. Kayak sayap enggang yang kebuka."
        ar_eg: "في رأيي، حركة الإيدين كانت تحفة. زي جناحات أبو قرن وهي مفتوحة."
        ar: "في رأيي، كانت حركات اليدين رائعة، كجناحي أبي قرن المنبسطين."
        en: "In my view, the hand movements were amazing. Like a hornbill's open wings."
        note:
          ar_eg: "كلمات: sayap = جناح."
          ar: "مفردات: sayap = جناح."
          en: "Words: sayap = wing."
      - {speaker: Kak Tiara, text: "Setuju. Bulu enggang di kepala penarinya juga cantik banget.", ar_eg: "موافقة. والريش اللي على راس الراقصة كان جميل جدًا.", ar: "أوافق. وكان الريش على رأس الراقصة جميلًا جدًا.", en: "Agreed. The hornbill feathers on the dancer's head were beautiful too."}
      - speaker: Kak Reza
        text: "Musiknya dari sape, alat musik petik Dayak. Bunyinya lembut dan berulang."
        ar_eg: "المزيكا كانت من السابي، آلة وترية بتاعة الداياك. صوتها ناعم وبيتكرر."
        ar: "كانت الموسيقى من السابي، وهي آلة وترية للداياك، صوتها رقيق ومتكرر."
        en: "The music was from the sape, a Dayak plucked instrument. Its sound is soft and repetitive."
        note:
          ar_eg: "كلمات: berulang = يتكرر؛ bunyinya = bunyi + -nya: صوت."
          ar: "مفردات: berulang = يتكرر؛ bunyinya = bunyi + -nya: صوت."
          en: "Words: berulang = to repeat, recur; bunyinya = bunyi + -nya: sound."
      - {speaker: Kak Tiara, text: "Ada kurangnya, nggak?", ar_eg: "فيه حاجة ناقصة؟", ar: "هل من مآخذ؟", en: "Were there any weaknesses?"}
      - speaker: Kak Reza
        text: "Dikit. Lampunya kegelapan. Mending sanggarnya benerin tata cahaya."
        ar_eg: "حاجة بسيطة. الإضاءة كانت ضلمة أوي. ياريت المركز يصلّح الإضاءة."
        ar: "قليلة: الإضاءة معتمة جدًا، والأفضل أن يحسّن المركز الإضاءة."
        en: "A little. The lighting was too dark. The studio should improve the lighting."
        note:
          ar_eg: "kegelapan = غامق زيادة. mending = sebaiknya، benerin = memperbaiki. كلمات: cahaya = نور، ضوء؛ tata = ترتيب، نظام."
          ar: "kegelapan = مظلم أكثر من اللازم. mending = sebaiknya، benerin = memperbaiki. مفردات: cahaya = ضوء، نور؛ tata = نظام، ترتيب."
          en: "kegelapan = too dark. mending = sebaiknya, benerin = memperbaiki. Words: cahaya = light; tata = order, arrangement."
      - speaker: Kak Tiara
        text: "Terus mungkin bagian akhirnya bisa dipanjangin. Aku belum puas!"
        ar_eg: "ويمكن كمان يطوّلوا الجزء الأخير. أنا لسه ما شبعتش!"
        ar: "وربما يطيلون الجزء الأخير، فلم أكتفِ بعد!"
        en: "And maybe they could lengthen the ending. I wasn't satisfied yet!"
        note:
          ar_eg: "كلمات: puas = مبسوط، راضي."
          ar: "مفردات: puas = راضٍ، مقتنع."
          en: "Words: puas = satisfied, content."
      - speaker: Kak Reza
        text: "Ha! Itu pujian juga, dong. Tadi pelatihnya bilang mereka mau tampil di Jakarta."
        ar_eg: "ها! ده مدح برضه. المدرّب قال إنهم هيعرضوا الرقصة دي في جاكرتا."
        ar: "ها! هذا مديح أيضًا. قال المدرب إنهم سيعرضون هذه الرقصة في جاكرتا."
        en: "Ha! That's praise too. The trainer said they'll perform this dance in Jakarta."
        note:
          ar_eg: "كلمات: bilang = يقول."
          ar: "مفردات: bilang = يقول."
          en: "Words: bilang = to say."
      - speaker: Kak Tiara
        text: "Kesimpulannya: pertunjukan yang memukau, dengan sedikit catatan teknis."
        ar_eg: "الخلاصة: عرض يخطف العين، مع ملاحظات فنية بسيطة."
        ar: "الخلاصة: عرض أخّاذ مع ملاحظات تقنية قليلة."
        en: "In short: a stunning show, with a few technical notes."
        note:
          ar_eg: "كلمات: catatan = ملاحظات، نوتس."
          ar: "مفردات: catatan = ملاحظة، مذكرة."
          en: "Words: catatan = note, notes."
  - kind: word_spotlight
    title: Per- dan memper-
    lines:
      - speaker: Kak Tiara
        text: "Memper- artinya membuat lebih: panjang menjadi memperpanjang, besar menjadi memperbesar."
        ar_eg: "memper- معناها «يخلّيه أكتر»: طويل ← يطوّل، كبير ← يكبّر."
        ar: "memper- تعني «يجعله أكثر»: طويل ← يطيل، كبير ← يكبّر."
        en: "Memper- means 'make more': long → lengthen, big → enlarge."
        note:
          ar_eg: "شبه وزن «فعّل» في العربي: كبّر، طوّل، حسّن. كلمات: memperpanjang = يمدّ، يجدّد."
          ar: "يشبه وزن «فعّل» في العربية: كبّر، طوّل، حسّن. مفردات: memperpanjang = يمدّد، يجدّد."
          en: "Like the Arabic form «فعّل»: كبّر، طوّل، حسّن. Words: memperpanjang = to extend, renew."
      - {speaker: Kak Reza, text: "Memperbaiki: membuat jadi baik. Memperkenalkan: membuat orang kenal.", ar_eg: "memperbaiki: يصلّح. memperkenalkan: يعرّف الناس بحاجة.", ar: "memperbaiki: يصلح. memperkenalkan: يعرّف.", en: "Memperbaiki: to fix. Memperkenalkan: to introduce."}
      - speaker: Kak Tiara
        text: "Mempertunjukkan: menampilkan di depan penonton."
        ar_eg: "mempertunjukkan: يعرض قدام الجمهور."
        ar: "mempertunjukkan: يعرض أمام الجمهور."
        en: "Mempertunjukkan: to perform before an audience."
        note:
          ar_eg: "كلمات: menampilkan = يعرض، يقدّم."
          ar: "مفردات: menampilkan = يعرض، يقدّم."
          en: "Words: menampilkan = to show, to present."
      - speaker: Kak Reza
        text: "Kalau ngobrol: benerin, panjangin, gedein. Tolong gedein suaranya!"
        ar_eg: "في الكلام: benerin وpanjangin وgedein. علّي الصوت لو سمحت!"
        ar: "في الكلام: benerin وpanjangin وgedein. ارفع الصوت من فضلك!"
        en: "When chatting: benerin, panjangin, gedein. Turn it up, please!"
        note:
          ar_eg: "memper- للكتابة. في الكلام: صفة + -in. memperbesar ← gedein."
          ar: "memper- للكتابة، وفي الكلام: صفة + ‎-in. memperbesar ← gedein."
          en: "memper- is for writing; speech uses adjective + -in: memperbesar → gedein."
      - {speaker: Kak Reza, text: "Penari, penonton, panggung, sanggar, gerakan, kostum, tata cahaya.", ar_eg: "راقص، متفرج، مسرح، مركز فنون، حركة، لبس العرض، الإضاءة.", ar: "راقص، متفرج، خشبة المسرح، مركز فني، حركة، أزياء، إضاءة.", en: "Dancer, audience, stage, studio, movement, costume, lighting."}
      - speaker: Kak Tiara
        text: "Untuk ulasan: memukau, mengesankan, kurang rapi, sebaiknya…"
        ar_eg: "للنقد: يخطف العين، مؤثر، مش متظبط قوي، الأحسن إن…"
        ar: "للمراجعة: أخّاذ، مؤثر، غير متقن، الأفضل أن…"
        en: "For a review: stunning, impressive, a bit untidy, it would be better to…"
        note:
          ar_eg: "كلمات: mengesankan = يسيب أثر."
          ar: "مفردات: mengesankan = مُبهر."
          en: "Words: mengesankan = impressive, memorable."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Gerakan tangannya luar biasa."
        ar_eg: "حركة الإيدين كانت تحفة."
        ar: "كانت حركات اليدين رائعة."
        en: "The hand movements were amazing."
        note:
          ar_eg: "كرر ورانا كل جملة. كلمات: biasa = عادي."
          ar: "ردّد كل جملة بعدنا. مفردات: biasa = عادي."
          en: "Repeat each sentence after us. Words: biasa = normal, usual."
      - {speaker: Kak Reza, text: "Gerakan tangannya luar biasa.", ar_eg: "حركة الإيدين كانت تحفة.", ar: "كانت حركات اليدين رائعة.", en: "The hand movements were amazing."}
      - {speaker: Kak Tiara, text: "Sebaiknya mereka memperbaiki tata cahaya.", ar_eg: "الأحسن يصلّحوا الإضاءة.", ar: "الأفضل أن يحسّنوا الإضاءة.", en: "They should improve the lighting."}
      - {speaker: Kak Reza, text: "Sebaiknya mereka memperbaiki tata cahaya.", ar_eg: "الأحسن يصلّحوا الإضاءة.", ar: "الأفضل أن يحسّنوا الإضاءة.", en: "They should improve the lighting."}
      - {speaker: Kak Tiara, text: "Mereka akan mempertunjukkan tari ini di Jakarta.", ar_eg: "هيعرضوا الرقصة دي في جاكرتا.", ar: "سيعرضون هذه الرقصة في جاكرتا.", en: "They will perform this dance in Jakarta."}
      - {speaker: Kak Reza, text: "Mereka akan mempertunjukkan tari ini di Jakarta.", ar_eg: "هيعرضوا الرقصة دي في جاكرتا.", ar: "سيعرضون هذه الرقصة في جاكرتا.", en: "They will perform this dance in Jakarta."}
      - {speaker: Kak Tiara, text: "Pertunjukan yang memukau.", ar_eg: "عرض يخطف العين.", ar: "عرض أخّاذ.", en: "A stunning show."}
      - {speaker: Kak Reza, text: "Pertunjukan yang memukau.", ar_eg: "عرض يخطف العين.", ar: "عرض أخّاذ.", en: "A stunning show."}
  - kind: outro
    title: Ulasan Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, ulas satu film atau konser yang kamu tonton. Satu pujian, satu saran."
        ar_eg: "يا محمد، اعمل نقد لفيلم أو حفلة شفتها. مدح واحد واقتراح واحد."
        ar: "يا محمد، راجع فيلمًا أو حفلًا شاهدته: مديح واحد واقتراح واحد."
        en: "Mohamed, review a film or concert you saw. One compliment, one suggestion."
        note:
          ar_eg: "دورك! قولها بصوت عالي. كلمات: konser = حفلة، كونسير؛ saran = اقتراح."
          ar: "دورك! قلها بصوت مسموع. مفردات: konser = حفل موسيقي؛ saran = توصية."
          en: "Your turn! Say it out loud. Words: konser = concert; saran = suggestion, recommendation."
      - {speaker: Kak Reza, text: "Contohnya: Lagunya mengesankan, tetapi sebaiknya mereka memperpendek pidato di tengah konser.", ar_eg: "مثلًا: الأغاني كانت مؤثرة، بس الأحسن يقصّروا الكلام اللي في نص الحفلة.", ar: "مثلًا: كانت الأغاني مؤثرة، لكن الأفضل أن يختصروا الكلمة في منتصف الحفل.", en: "For example: The songs were impressive, but they should shorten the speech mid-concert."}
      - {speaker: Kak Tiara, text: "Besok, tulis ulasan lima kalimat.", ar_eg: "بكرة، اكتب نقد في خمس جمل.", ar: "غدًا، اكتب مراجعة من خمس جمل.", en: "Tomorrow, write a five-sentence review."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Selamat malam!", ar_eg: "شكرًا يا محمد. تصبح على خير!", ar: "شكرًا يا محمد. طابت ليلتك!", en: "Thank you, Mohamed. Good night!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [sanggar, penari, penonton, ulasan, memperbaiki, mempertunjukkan, memperkenalkan, memukau, alat musik, bagian, bulu, gerakan]
review:
  status: draft
  verified: false
  notes: |
    Spot-check: hornbill (enggang) dance and feathers in Dayak dance; sape as a Dayak
    plucked lute. The show and trainer are fictional.
