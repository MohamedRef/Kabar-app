schema: kabar.radio/v1
id: radio.bipa7.u07
language: id
level: bipa7
unit: bipa7.u07
title:
  target: Menulis untuk pembaca yang tepat
  ar_eg: تكتب للقارئ المناسب
  ar: الكتابة للقارئ المناسب
  en: Writing for the right reader
hosts:
  - name: Kak Tiara
    voice: id-ID-GadisNeural
  - name: Kak Reza
    voice: id-ID-ArdiNeural
minutes: 7
segments:
  - kind: intro
    title: Kota Injil Manokwari
    lines:
      - {speaker: Kak Tiara, text: "Selamat pagi dari Manokwari, ibu kota Papua Barat! Ini Kabar Radio. Aku Tiara.", ar_eg: "صباح الخير من مانوكواري، عاصمة غرب بابوا! ده كبار راديو. أنا تيارا.", ar: "صباح الخير من مانوكواري، عاصمة بابوا الغربية! هذا كبار راديو. أنا تيارا.", en: "Good morning from Manokwari, capital of West Papua! This is Kabar Radio. I'm Tiara."}
      - speaker: Kak Reza
        text: "Aku Reza. Hari ini kita ngomongin lembaga negara sama berita politik, pakai bahasa yang netral."
        ar_eg: "أنا رضا. النهارده هنتكلم عن مؤسسات الدولة وأخبار السياسة، بلغة محايدة."
        ar: "أنا رضا. نتحدث اليوم عن مؤسسات الدولة والأخبار السياسية بلغة محايدة."
        en: "I'm Reza. Today we talk about state institutions and political news, in neutral language."
        note:
          ar_eg: "كلمات: berita = أخبار، خبر."
          ar: "مفردات: berita = خبر، أخبار."
          en: "Words: berita = news."
      - {speaker: Kak Tiara, text: "Kata Kaka Yohana, wartawan harus tahu pembacanya siapa.", ar_eg: "كاكا يوهانا بتقول إن الصحفي لازم يعرف مين اللي هيقراله.", ar: "تقول كاكا يوهانا إن على الصحفي أن يعرف قرّاءه.", en: "Kaka Yohana says a journalist must know their readers."}
      - speaker: Kak Reza
        text: "Kita belajar nama lembaga, bahasa berita TV, sama nulis artikel opini yang pas buat pembacanya."
        ar_eg: "هنتعلم أسامي المؤسسات، ولغة أخبار التلفزيون، وكتابة مقال رأي مناسب للقارئ."
        ar: "نتعلم أسماء المؤسسات، ولغة النشرات التلفزيونية، وكتابة مقال رأي يناسب القارئ."
        en: "We learn institution names, TV news language, and writing an opinion piece for its readers."
      - {speaker: Kak Tiara, text: "Mohamed, kamu lebih suka berita TV atau koran?", ar_eg: "يا محمد، بتحب أخبار التلفزيون أكتر ولا الجرايد؟", ar: "يا محمد، أتفضّل أخبار التلفاز أم الصحف؟", en: "Mohamed, do you prefer TV news or newspapers?"}
  - kind: dialogue
    title: Satu topik, tiga pembaca
    lines:
      - speaker: Kak Tiara
        text: "Topiknya sama: musyawarah perencanaan pembangunan di desa. Tapi pembacanya beda-beda."
        ar_eg: "الموضوع واحد: اجتماع تخطيط التنمية في القرية. بس القرّاء مختلفين."
        ar: "الموضوع واحد: اجتماع تخطيط التنمية في القرية، لكن القرّاء مختلفون."
        en: "Same topic: the village development-planning meeting. But different readers."
        note:
          ar_eg: "الخبر متألف. اسمع إزاي الأسلوب بيتغير مع كل قارئ. كلمات: perencanaan = تخطيط."
          ar: "الخبر مؤلف. استمع إلى تغيّر الأسلوب بحسب القارئ. مفردات: perencanaan = تخطيط."
          en: "The news is invented. Hear how the style shifts for each reader. Words: perencanaan = planning."
      - speaker: Kak Reza
        text: "Untuk berita TV: Pemerintah daerah menggelar musrenbang di tingkat desa untuk menentukan prioritas pembangunan tahun depan."
        ar_eg: "لأخبار التلفزيون: «الحكومة المحلية عقدت اجتماع تخطيط تنمية على مستوى القرية لتحديد أولويات السنة الجاية»."
        ar: "للنشرة التلفزيونية: «عقدت الحكومة المحلية اجتماع تخطيط التنمية على مستوى القرية لتحديد أولويات العام المقبل»."
        en: "For TV news: The regional government held a development-planning meeting at village level to set next year's priorities."
        note:
          ar_eg: "كلمات: menggelar = يقيم، ينظّم."
          ar: "مفردات: menggelar = يقيم، ينظّم."
          en: "Words: menggelar = to hold, to stage."
      - {speaker: Kak Tiara, text: "Buat anak SMA: Warga desa ngumpul terus milih: jalan baru dulu, atau sekolah baru dulu?", ar_eg: "لطلبة الثانوي: «أهل القرية اتجمعوا وبيختاروا: طريق جديد الأول، ولا مدرسة جديدة الأول؟»", ar: "لطلاب الثانوية: «اجتمع أهل القرية ليختاروا: طريق جديد أولًا أم مدرسة جديدة؟»", en: "For high-schoolers: Villagers got together to choose: a new road first, or a new school first?", note: {ar_eg: "للشباب الكلام بيبقى عادي: ngumpul = berkumpul، milih = memilih.", ar: "للشباب يصير الكلام يوميًا: ngumpul = berkumpul، milih = memilih.", en: "For teens it turns casual: ngumpul = berkumpul, milih = memilih."}}
      - speaker: Kak Reza
        text: "Untuk artikel opini di koran: Musrenbang adalah ruang demokrasi yang sering dilupakan. Namun, suara perempuan dan pemuda tampaknya belum banyak terdengar."
        ar_eg: "لمقال رأي في الجرنال: «اجتماع التخطيط ده مساحة ديمقراطية ناس كتير بتنساها. بس شكله صوت الستات والشباب لسه مش مسموع كفاية»."
        ar: "لمقال رأي: «اجتماع التخطيط فضاء ديمقراطي كثيرًا ما يُنسى، غير أن صوت النساء والشباب يبدو أنه لم يُسمع بعد بما يكفي»."
        en: "For an op-ed: The planning meeting is a forgotten space for democracy. However, women's and young people's voices seem not yet to be heard much."
        note:
          ar_eg: "كلمات: pemuda = شاب، شباب."
          ar: "مفردات: pemuda = شاب، الشباب."
          en: "Words: pemuda = young man, youth."
      - {speaker: Kak Tiara, text: "Nah, artikel opini itu ada pendapatnya, tapi tetap sopan dan pakai data.", ar_eg: "أهو، مقال الرأي فيه رأي، بس برضه مؤدب وبيستعمل بيانات.", ar: "مقال الرأي يحمل رأيًا، لكنه مهذّب ويستند إلى البيانات.", en: "See, an op-ed has a view, but stays polite and uses data."}
      - speaker: Kak Reza
        text: "Sekarang lembaga negara. Indonesia adalah republik dengan sistem presidensial. Presiden dipilih langsung oleh rakyat."
        ar_eg: "دلوقتي مؤسسات الدولة. إندونيسيا جمهورية بنظام رئاسي. والرئيس الشعب بينتخبه مباشرة."
        ar: "والآن مؤسسات الدولة: إندونيسيا جمهورية رئاسية، ويُنتخب الرئيس مباشرة من الشعب."
        en: "Now state institutions. Indonesia is a presidential republic. The president is elected directly by the people."
        note:
          ar_eg: "كلمات: dipilih = اتختار، اتنتخب."
          ar: "مفردات: dipilih = اُختير."
          en: "Words: dipilih = to be chosen, elected."
      - {speaker: Kak Tiara, text: "DPR adalah Dewan Perwakilan Rakyat, yaitu parlemen. TNI adalah Tentara Nasional Indonesia.", ar_eg: "DPR يعني مجلس نواب الشعب، البرلمان. وTNI يعني الجيش الوطني الإندونيسي.", ar: "DPR: مجلس نواب الشعب أي البرلمان، وTNI: الجيش الوطني الإندونيسي.", en: "DPR is the People's Representative Council, the parliament. TNI is the Indonesian National Armed Forces."}
      - {speaker: Kak Reza, text: "Pemilu diadakan lima tahun sekali. Selain itu, ada otonomi daerah, jadi provinsi dan kabupaten punya wewenang sendiri.", ar_eg: "الانتخابات بتتعمل كل خمس سنين. وغير كده، فيه حكم محلي، يعني المحافظات والمراكز ليها صلاحيات بتاعتها.", ar: "تُجرى الانتخابات كل خمس سنوات، وهناك حكم ذاتي محلي يمنح المحافظات والأقضية صلاحياتها.", en: "Elections are held every five years. Also, there's regional autonomy, so provinces and regencies have their own powers."}
      - {speaker: Kak Tiara, text: "Kami tidak memihak siapa pun. Tugas kami menjelaskan, bukan memilihkan.", ar_eg: "إحنا مش منحازين لحد. شغلانتنا نشرح، مش نختار بدالك.", ar: "لا ننحاز لأحد؛ مهمتنا الشرح لا الاختيار نيابةً عنك.", en: "We don't take sides. Our job is to explain, not to choose for you."}
  - kind: word_spotlight
    title: Lembaga dan berita
    lines:
      - speaker: Kak Tiara
        text: "Presiden, DPR, menteri, gubernur, bupati, wali kota, kepala desa."
        ar_eg: "رئيس، البرلمان، وزير، محافظ، رئيس مركز، عمدة مدينة، عمدة قرية."
        ar: "رئيس، البرلمان، وزير، حاكم، رئيس قضاء، رئيس بلدية، رئيس قرية."
        en: "President, parliament, minister, governor, regent, mayor, village head."
        note:
          ar_eg: "bupati للمراكز الريفية (kabupaten)، وwali kota للمدن."
          ar: "bupati لرئيس القضاء الريفي (kabupaten)، وwali kota للمدن."
          en: "Bupati heads a rural regency (kabupaten); wali kota heads a city."
      - {speaker: Kak Reza, text: "Berita TV: menggelar, menyampaikan, menegaskan, sementara itu, dari lokasi.", ar_eg: "لغة أخبار التلفزيون: عقد، صرّح، أكد، في الوقت نفسه، من موقع الحدث.", ar: "لغة النشرات: عقد، صرّح، أكد، في الأثناء، من موقع الحدث.", en: "TV news verbs: held, conveyed, stressed, meanwhile, reporting from the scene."}
      - {speaker: Kak Tiara, text: "Pemilu, kampanye, calon, debat kandidat, kebebasan pers.", ar_eg: "انتخابات، حملة انتخابية، مرشح، مناظرة المرشحين، حرية الصحافة.", ar: "انتخابات، حملة، مرشح، مناظرة المرشحين، حرية الصحافة.", en: "Election, campaign, candidate, candidates' debate, press freedom."}
      - {speaker: Kak Reza, text: "Musrenbang: musyawarah perencanaan pembangunan. Musyawarah juga dari bahasa Arab!", ar_eg: "musrenbang: «مشاورة تخطيط التنمية». وكلمة musyawarah كمان من العربي «مشاورة»!", ar: "musrenbang: «مشاورة تخطيط التنمية»، وmusyawarah من العربية «مشاورة»!", en: "Musrenbang: development-planning deliberation. Musyawarah is from Arabic too!"}
      - speaker: Kak Tiara
        text: "Surat pembaca: Dengan hormat, melalui surat ini saya ingin menyampaikan…"
        ar_eg: "رسالة القرّاء: «تحية طيبة، من خلال الرسالة دي حابب أوصّل…»"
        ar: "رسالة القرّاء: «تحية طيبة، أودّ من خلال هذه الرسالة أن أعبّر عن…»"
        en: "Letter to the editor: Dear Editor, through this letter I would like to express…"
        note:
          ar_eg: "كلمات: melalui = عن طريق، من خلال."
          ar: "مفردات: melalui = عبر، من خلال."
          en: "Words: melalui = through, via."
      - speaker: Kak Tiara
        text: "Kalau ngobrol politik sama temen? Santai aja, tapi tetap sopan: Menurutku sih gitu. Kamu gimana?"
        ar_eg: "ولو بتتكلم سياسة مع صاحبك؟ براحتك بس بأدب: أنا شايف كده. وانت إيه رأيك؟"
        ar: "وإن تحدثت في السياسة مع صديق؟ بارتياح لكن بأدب: هذا رأيي. وما رأيك أنت؟"
        en: "Talking politics with a friend? Keep it relaxed but polite: That's how I see it, anyway. What about you?"
        note:
          ar_eg: "sih بتلطّف الرأي. وسؤال Kamu gimana? بيفتح الكلام بدل الخناق."
          ar: "sih تلطف الرأي، وسؤال Kamu gimana? يفتح الحوار بدل الجدال."
          en: "sih softens an opinion; Kamu gimana? opens a conversation instead of a fight."
  - kind: recap
    title: Ulangi, ya!
    lines:
      - speaker: Kak Tiara
        text: "Presiden dipilih langsung oleh rakyat."
        ar_eg: "الرئيس الشعب بينتخبه مباشرة."
        ar: "يُنتخب الرئيس مباشرة من الشعب."
        en: "The president is elected directly by the people."
        note:
          ar_eg: "كرر ورانا كل جملة."
          ar: "ردّد كل جملة بعدنا."
          en: "Repeat each sentence after us."
      - {speaker: Kak Reza, text: "Presiden dipilih langsung oleh rakyat.", ar_eg: "الرئيس الشعب بينتخبه مباشرة.", ar: "يُنتخب الرئيس مباشرة من الشعب.", en: "The president is elected directly by the people."}
      - {speaker: Kak Tiara, text: "Pemerintah daerah menggelar musrenbang.", ar_eg: "الحكومة المحلية عقدت اجتماع تخطيط.", ar: "عقدت الحكومة المحلية اجتماع التخطيط.", en: "The regional government held a planning meeting."}
      - {speaker: Kak Reza, text: "Pemerintah daerah menggelar musrenbang.", ar_eg: "الحكومة المحلية عقدت اجتماع تخطيط.", ar: "عقدت الحكومة المحلية اجتماع التخطيط.", en: "The regional government held a planning meeting."}
      - {speaker: Kak Tiara, text: "Suara pemuda tampaknya belum banyak terdengar.", ar_eg: "شكله صوت الشباب لسه مش مسموع كفاية.", ar: "يبدو أن صوت الشباب لم يُسمع بعد بما يكفي.", en: "Young people's voices seem not yet to be heard much."}
      - {speaker: Kak Reza, text: "Suara pemuda tampaknya belum banyak terdengar.", ar_eg: "شكله صوت الشباب لسه مش مسموع كفاية.", ar: "يبدو أن صوت الشباب لم يُسمع بعد بما يكفي.", en: "Young people's voices seem not yet to be heard much."}
      - {speaker: Kak Tiara, text: "Tugas kami menjelaskan, bukan memilihkan.", ar_eg: "شغلانتنا نشرح، مش نختار بدالك.", ar: "مهمتنا الشرح لا الاختيار نيابةً عنك.", en: "Our job is to explain, not to choose for you."}
      - {speaker: Kak Reza, text: "Tugas kami menjelaskan, bukan memilihkan.", ar_eg: "شغلانتنا نشرح، مش نختار بدالك.", ar: "مهمتنا الشرح لا الاختيار نيابةً عنك.", en: "Our job is to explain, not to choose for you."}
  - kind: outro
    title: Surat pembaca Mohamed
    lines:
      - speaker: Kak Tiara
        text: "Mohamed, tulis pembuka surat pembaca tentang trotoar di lingkunganmu. Sopan, jelas, dan ada usulan."
        ar_eg: "يا محمد، اكتب بداية رسالة للجرنال عن الرصيف في منطقتك. بأدب ووضوح، وفيها اقتراح."
        ar: "يا محمد، اكتب مطلع رسالة قارئ عن الأرصفة في حيّك: مهذبة وواضحة وفيها اقتراح."
        en: "Mohamed, write the opening of a letter to the editor about the pavements in your area. Polite, clear, with a suggestion."
        note:
          ar_eg: "دورك! قولها بصوت عالي."
          ar: "دورك! قلها بصوت مسموع."
          en: "Your turn! Say it out loud."
      - {speaker: Kak Reza, text: "Contohnya: Dengan hormat, melalui surat ini saya ingin menyampaikan bahwa trotoar di jalan kami sering dipakai parkir. Barangkali petugas dapat memasang rambu.", ar_eg: "مثلًا: «تحية طيبة، حابب أوصّل إن الرصيف في شارعنا بيتركن عليه كتير. يمكن المسؤولين يحطوا لافتات».", ar: "مثلًا: «تحية طيبة، أودّ أن أشير إلى أن رصيف شارعنا يُستخدم كثيرًا للوقوف. لعل الجهات المختصة تضع لافتات».", en: "For example: Dear Editor, through this letter I'd like to note that the pavement on our street is often used for parking. Perhaps officials could put up signs."}
      - {speaker: Kak Tiara, text: "Besok, tulis artikel opini pendek buat pembaca muda.", ar_eg: "بكرة، اكتب مقال رأي قصير لقرّاء شباب.", ar: "غدًا، اكتب مقال رأي قصيرًا لقرّاء شباب.", en: "Tomorrow, write a short opinion piece for young readers."}
      - {speaker: Kak Reza, text: "Makasih, Mohamed. Makasih juga, Kaka Yohana, buat tipsnya!", ar_eg: "شكرًا يا محمد. شكرًا يا كاكا يوهانا على النصايح!", ar: "شكرًا يا محمد. وشكرًا يا كاكا يوهانا على النصائح!", en: "Thank you, Mohamed. Thank you, Kaka Yohana, for the tips!"}
      - {speaker: Kak Tiara, text: "Sampai besok di Kabar Radio!", ar_eg: "نتقابل بكرة في كبار راديو!", ar: "إلى اللقاء غدًا في كبار راديو!", en: "See you tomorrow on Kabar Radio!"}
words: [lembaga negara, DPR, TNI, pemilu, otonomi daerah, musrenbang, artikel opini, surat pembaca, kebebasan pers, kabupaten, kandidat, prioritas, presiden, bupati]
review:
  status: draft
  verified: false
  notes: |
    Deliberately politically neutral; no parties, people or current events named.
    Spot-check: Manokwari as capital of Papua Barat; direct presidential elections
    since 2004; five-year election cycle; musrenbang levels.
