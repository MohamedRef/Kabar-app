title:
  target: Nang Pasar
  ar_eg: في السوق
  ar: في السوق
  en: At the market
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pasar Nganjuk
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saka pasar Nganjuk! Mambu brambang ing endi-endi. Aku Sekar.
    ar_eg: صباح الخير من سوق نجانجوك! ريحة البصل في كل حتّة. أنا سيكار.
    ar: صباح الخير من سوق نغانجوك! رائحة البصل في كلّ مكان. أنا سيكار.
    en: Good morning from the Nganjuk market! The smell of shallots everywhere. I'm Sekar.
    note:
      ar_eg: brambang = البصل الأحمر الصغيّر (shallot). نجانجوك من أكبر مزارعه في إندونيسيا.
      ar: brambang = البصل الأحمر الصغير (الكرّاث الأندلسي). ونغانجوك من أكبر مزارعه في إندونيسيا.
      en: Brambang = shallots. Nganjuk is one of Indonesia's big shallot regions.
  - speaker: Mas Galih
    text: Aku Galih. Mripatku nganti nangis, hehe. Dina iki kita sinau angka gedhe.
    ar_eg: أنا جاليه. عينيّا بتدمّع، هههه. النهارده هنتعلّم الأرقام الكبيرة.
    ar: أنا غاليه. عيناي تدمعان، هههه. اليوم نتعلّم الأعداد الكبيرة.
    en: I'm Galih. My eyes are watering, hehe. Today we learn big numbers.
  - speaker: Mbak Sekar
    text: Angka Jawa duwe wujud khusus. Selikur, selawe, seket, sewidak. Penting banget kanggo rega!
    ar_eg: الأرقام الجاوي ليها أشكال خاصّة. واحد وعشرين، خمسة وعشرين، خمسين، ستّين. مهمّة أوي للأسعار!
    ar: للأعداد الجاوية صيغ خاصّة. واحد وعشرون، خمسة وعشرون، خمسون، ستّون. مهمّة جدًّا للأسعار!
    en: Javanese numbers have special forms. Selikur, selawe, seket, sewidak. Very important for prices!
  - speaker: Mas Galih
    text: Lan Bu Karti, bakul brambang, wis nulis notane. Kita kudu ngerti angkane!
    ar_eg: وبو كارتي، بيّاعة البصل، كتبت الفاتورة. لازم نفهم الأرقام!
    ar: وبو كارتي، بائعة البصل، كتبت الفاتورة. علينا أن نفهم الأرقام!
    en: And Bu Karti, the shallot seller, has written her bill. We need to understand the numbers!
- kind: dialogue
  title: Tuku brambang
  lines:
  - speaker: Mas Galih
    text: Sekar, aku bakul, kowe sing tuku, ya.
    ar_eg: يا سيكار، أنا البيّاع وانتي الزبونة.
    ar: يا سيكار، أنا البائع وأنتِ الزبونة.
    en: Sekar, I'm the seller, you're the buyer.
  - speaker: Mbak Sekar
    text: Mas, brambange sekilo pira?
    ar_eg: يا ماس، كيلو البصل بكام؟
    ar: يا ماس، بكم كيلو البصل؟
    en: Mas, how much is a kilo of shallots?
  - speaker: Mas Galih
    text: Sekilo selawe ewu, Mbak. Brambang Nganjuk, paling apik!
    ar_eg: الكيلو بخمسة وعشرين ألف يا مباك. بصل نجانجوك، أحسن حاجة!
    ar: الكيلو بخمسة وعشرين ألفًا يا مباك. بصل نغانجوك، الأفضل!
    en: Twenty-five thousand a kilo, Mbak. Nganjuk shallots, the best!
  - speaker: Mbak Sekar
    text: Selawe? Waduh. Yen tuku rong kilo, seket ewu. Ora isa kurang?
    ar_eg: خمسة وعشرين؟ يا خبر. لو أخدت كيلوين، يبقوا خمسين ألف. مينفعش أقلّ؟
    ar: خمسة وعشرون؟ يا للهول. إن اشتريت كيلوغرامين فخمسون ألفًا. ألا يمكن أقلّ؟
    en: Twenty-five? Ouch. Two kilos would be fifty thousand. Can't it be less?
  - speaker: Mas Galih
    text: Kanggo Mbak, rong kilo patang puluh lima ewu wae.
    ar_eg: عشانك يا مباك، الكيلوين بخمسة وأربعين ألف بس.
    ar: لأجلكِ يا مباك، الكيلوغرامان بخمسة وأربعين ألفًا فقط.
    en: For you, Mbak, two kilos for just forty-five thousand.
  - speaker: Mbak Sekar
    text: Patang puluh wae, ya? Aku langganan, lho.
    ar_eg: أربعين بس، ماشي؟ أنا زبونة دايمة على فكرة.
    ar: أربعون فقط، حسنًا؟ أنا زبونة دائمة.
    en: Just forty, okay? I'm a regular, you know.
    note:
      ar_eg: langganan = زبون دايم. كلمة سحرية في الفِصال!
      ar: langganan = زبون دائم. كلمة سحرية في المساومة!
      en: Langganan = regular customer. A magic word when haggling!
  - speaker: Mas Galih
    text: Hmm... ya wis, patang puluh ewu. Nanging tuku lombok sithik, ya!
    ar_eg: هممم... خلاص، أربعين ألف. بس خدي شويّة شطّة كمان!
    ar: هممم... حسنًا، أربعون ألفًا. لكن خذي قليلًا من الفلفل الحارّ أيضًا!
    en: Hmm... fine, forty thousand. But buy a few chillies too!
  - speaker: Mbak Sekar
    text: Lomboke pira?
    ar_eg: الشطّة بكام؟
    ar: بكم الفلفل؟
    en: How much are the chillies?
  - speaker: Mas Galih
    text: Sewelas ewu sak ons. Mbak njupuk rong ons, dadi rolas... eh, salah! Rong puluh loro!
    ar_eg: حداشر ألف للميّة جرام. لو أخدتي ميتين جرام يبقى اتناشر... لأ، غلط! اتنين وعشرين!
    ar: أحد عشر ألفًا لكلّ مئة غرام. إن أخذتِ مئتي غرام فاثنا عشر... لا، خطأ! اثنان وعشرون!
    en: Eleven thousand per hundred grams. Two hundred grams makes twelve... oops, wrong! Twenty-two!
  - speaker: Mbak Sekar
    text: Hahaha! Mas Galih kudu sinau angka maneh!
    ar_eg: ههههه! ماس جاليه لازم يذاكر الأرقام تاني!
    ar: ههههه! على ماس غاليه أن يراجع الأرقام!
    en: Hahaha! Mas Galih needs to study numbers again!
- kind: word_spotlight
  title: Selikur, selawe, seket
  lines:
  - speaker: Mbak Sekar
    text: Sewelas, rolas, telulas. Iki sewelas nganti sangalas.
    ar_eg: حداشر، اتناشر، تلاتاشر. دي من حداشر لتسعتاشر.
    ar: أحد عشر، اثنا عشر، ثلاثة عشر. هذه من أحد عشر إلى تسعة عشر.
    en: Eleven, twelve, thirteen. These are eleven to nineteen.
  - speaker: Mas Galih
    text: Rong puluh, banjur selikur, rong puluh loro, nganti rong puluh papat. Banjur selawe!
    ar_eg: عشرين، وبعدين واحد وعشرين، اتنين وعشرين، لحدّ أربعة وعشرين. وبعدين خمسة وعشرين!
    ar: عشرون، ثمّ واحد وعشرون، اثنان وعشرون، حتى أربعة وعشرين. ثمّ خمسة وعشرون!
    en: Twenty, then selikur, twenty-two, up to twenty-four. Then selawe!
    note:
      ar_eg: selikur (21) لحدّ sangalikur (29) ليهم شكل خاصّ، إلّا 25 = selawe. وبعدين 50 = seket و60 = sewidak.
      ar: للأعداد من selikur (21) إلى sangalikur (29) صيغة خاصّة، و25 = selawe. ثمّ 50 = seket و60 = sewidak.
      en: Selikur (21) to sangalikur (29) have a special form, with 25 = selawe. Then 50 = seket and 60 = sewidak.
  - speaker: Mbak Sekar
    text: Telung puluh, patang puluh, seket, sewidak, pitung puluh. Satus!
    ar_eg: تلاتين، أربعين، خمسين، ستّين، سبعين. ميّة!
    ar: ثلاثون، أربعون، خمسون، ستّون، سبعون. مئة!
    en: Thirty, forty, fifty, sixty, seventy. A hundred!
  - speaker: Mas Galih
    text: Lan ewu, yuta. Seket ewu, satus ewu, sak yuta. Ing pasar, wong ngomong "ewu" terus.
    ar_eg: والألف والمليون. خمسين ألف، ميّة ألف، مليون. في السوق، الناس بتقول «ewu» على طول.
    ar: والألف والمليون. خمسون ألفًا، مئة ألف، مليون. وفي السوق يقول الناس «ewu» دائمًا.
    en: And thousands, millions. Fifty thousand, a hundred thousand, a million. In markets people say "ewu" all the time.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Sekilo pira?
    ar_eg: الكيلو بكام؟
    ar: بكم الكيلو؟
    en: How much a kilo?
  - speaker: Mas Galih
    text: Sekilo pira?
    ar_eg: الكيلو بكام؟
    ar: بكم الكيلو؟
    en: How much a kilo?
  - speaker: Mbak Sekar
    text: Selawe ewu.
    ar_eg: خمسة وعشرين ألف.
    ar: خمسة وعشرون ألفًا.
    en: Twenty-five thousand.
  - speaker: Mas Galih
    text: Selawe ewu.
    ar_eg: خمسة وعشرين ألف.
    ar: خمسة وعشرون ألفًا.
    en: Twenty-five thousand.
  - speaker: Mbak Sekar
    text: Seket ewu ora isa kurang?
    ar_eg: خمسين ألف، مينفعش أقلّ؟
    ar: خمسون ألفًا، ألا يمكن أقلّ؟
    en: Fifty thousand, can't it be less?
  - speaker: Mas Galih
    text: Seket ewu ora isa kurang?
    ar_eg: خمسين ألف، مينفعش أقلّ؟
    ar: خمسون ألفًا، ألا يمكن أقلّ؟
    en: Fifty thousand, can't it be less?
  - speaker: Mbak Sekar
    text: Aku langganan, lho.
    ar_eg: أنا زبون دايم على فكرة.
    ar: أنا زبون دائم.
    en: I'm a regular, you know.
  - speaker: Mas Galih
    text: Aku langganan, lho.
    ar_eg: أنا زبون دايم على فكرة.
    ar: أنا زبون دائم.
    en: I'm a regular, you know.
  - speaker: Mbak Sekar
    text: Sewelas, rolas, telulas.
    ar_eg: حداشر، اتناشر، تلاتاشر.
    ar: أحد عشر، اثنا عشر، ثلاثة عشر.
    en: Eleven, twelve, thirteen.
  - speaker: Mas Galih
    text: Sewelas, rolas, telulas.
    ar_eg: حداشر، اتناشر، تلاتاشر.
    ar: أحد عشر، اثنا عشر، ثلاثة عشر.
    en: Eleven, twelve, thirteen.
  - speaker: Mbak Sekar
    text: Seket ewu, sewidak ewu, satus ewu.
    ar_eg: خمسين ألف، ستّين ألف، ميّة ألف.
    ar: خمسون ألفًا، ستّون ألفًا، مئة ألف.
    en: Fifty thousand, sixty thousand, a hundred thousand.
  - speaker: Mas Galih
    text: Seket ewu, sewidak ewu, satus ewu.
    ar_eg: خمسين ألف، ستّين ألف، ميّة ألف.
    ar: خمسون ألفًا، ستّون ألفًا، مئة ألف.
    en: Fifty thousand, sixty thousand, a hundred thousand.
- kind: outro
  title: Notane Mas Mohamed
  lines:
  - speaker: Mas Galih
    text: Mas Mohamed, saiki wacanen rega iki banter. Selikur ewu, selawe ewu, seket ewu, sewidak ewu!
    ar_eg: يا ماس محمد، دلوقتي اقرا الأسعار دي بصوت عالي. واحد وعشرين ألف، خمسة وعشرين ألف، خمسين ألف، ستّين ألف!
    ar: يا ماس محمد، اقرأ هذه الأسعار بصوت عالٍ. واحد وعشرون ألفًا، خمسة وعشرون، خمسون، ستّون ألفًا!
    en: Mas Mohamed, now read these prices aloud. Twenty-one, twenty-five, fifty, sixty thousand!
    note:
      ar_eg: دورك! وبعدين فاصل على حاجة بـselawe ewu لحدّ ما توصل rong puluh ewu.
      ar: دورك! ثمّ ساوِم على شيء بـselawe ewu حتى تصل إلى rong puluh ewu.
      en: Your turn! Then haggle something at selawe ewu down to rong puluh ewu.
  - speaker: Mbak Sekar
    text: PR-mu, wacanen notane Bu Karti ing pelajaran, lan etung kabeh regane.
    ar_eg: واجبك، اقرا فاتورة بو كارتي في الدرس، واجمع كل الأسعار.
    ar: 'واجبك: اقرأ فاتورة بو كارتي في الدرس واجمع الأسعار كلّها.'
    en: 'Your homework: read Bu Karti''s bill in the lesson and add up all the prices.'
  - speaker: Mas Galih
    text: Lan jajal Pasar! Jawa maneh, saiki nganggo angka gedhe.
    ar_eg: وجرّب لعبة Pasar! بالجاوي تاني، المرّة دي بالأرقام الكبيرة.
    ar: وجرّب لعبة Pasar! بالجاوية مرّة أخرى، هذه المرّة بالأعداد الكبيرة.
    en: And try Pasar! in Javanese again, now with big numbers.
  - speaker: Mbak Sekar
    text: Sesuk kita nang Ponorogo, ndeleng reog. Nganti ketemu!
    ar_eg: بكرة رايحين بونوروجو، نتفرّج على الريوج. نتقابل!
    ar: غدًا نذهب إلى بونوروغو لنشاهد الريوغ. إلى اللقاء!
    en: Tomorrow we go to Ponorogo to see reog. See you!
