review:
  status: draft
  verified: false
  notes: 'Standard spelling vs chat/spoken spelling (final a said like o), and dh/d, th/t minimal pairs. Mbak Ayu (lessons j5.u03) mentioned only. Minimal-pair claims (dhadha chest / dada not a word on its own in Javanese?) kept to safe pairs: lara/loro.'
