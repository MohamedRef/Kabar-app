title:
  target: Ejaan
  ar_eg: الإملاء
  ar: الإملاء
  en: Spelling
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Alun-alun Madiun
  lines:
  - speaker: Mbak Sekar
    text: Sugeng sonten saka alun-alun Madiun! Ana Masjid Agung, wit-witan gedhe, lan wong-wong mangan lan dolan. Kula Sekar.
    ar_eg: مساء الخير من ميدان ماديون! فيه الجامع الكبير، وشجر كبير، والناس بتاكل وبتتفسّح. أنا سيكار.
    ar: مساء الخير من ساحة ماديون! هنا المسجد الجامع وأشجار كبيرة، والناس يأكلون ويتنزّهون. أنا سيكار.
    en: Good evening from Madiun's town square! There's the Great Mosque, big trees, and people eating and hanging out. I'm Sekar.
  - speaker: Mas Danang
    text: Aku Danang. Dina iki tema sing aneh. Tulisane "a", nanging diwaca "o"!
    ar_eg: أنا دانانج. النهارده موضوع غريب. مكتوب «a»، بس بيتقري «o»!
    ar: 'أنا دانانغ. موضوع اليوم غريب: يُكتب «a» ويُقرأ «o»!'
    en: I'm Danang. A strange topic today. It's written "a", but read "o"!
    note:
      ar_eg: "كلمات: diwaca = يتقرا."
      ar: "مفردات: diwaca = يُقرأ."
      en: "Words: diwaca = to be read."
  - speaker: Mbak Sekar
    text: Iya. Ing basa Jawa baku, "pira" ditulis karo "a". Nanging wong ngomong "piro".
    ar_eg: أيوه. في الجاوي الرسمي، «pira» بتتكتب بـ«a». بس الناس بتقول «piro».
    ar: نعم. في الجاوية القياسية تُكتب «pira» بـ«a»، لكنّ الناس يقولون «piro».
    en: Yes. In standard Javanese, "pira" is written with "a". But people say "piro".
    note:
      ar_eg: "ده زي ما بنكتب في العربي «على» بالألف المقصورة وبنقولها «عَلا». الكتابة الرسمية حاجة، والنطق حاجة. كلمات: piro = كام، بكام؛ ditulis = مكتوب، اتكتب."
      ar: "كما نكتب «على» بالألف المقصورة. الكتابة القياسية شيء والنطق شيء. مفردات: piro = كم؛ ditulis = كُتِب."
      en: "Like Arabic writing ى but saying \"a\". The standard spelling is one thing, the sound another. Words: piro = how much, how many; ditulis = to be written."
  - speaker: Mas Danang
    text: Lan ing chat, wong nulis kaya ngomong. "Piro", "opo", "sego". Mula bingung!
    ar_eg: وفي الشات، الناس بتكتب زي ما بتتكلّم. «piro»، «opo»، «sego». عشان كده اللخبطة!
    ar: وفي الدردشة يكتب الناس كما يتكلّمون. «piro» و«opo» و«sego». لهذا الارتباك!
    en: And in chats people write as they speak. "Piro", "opo", "sego". Hence the confusion!
    note:
      ar_eg: "كلمات: chat = شات، رسالة؛ sego = رز (مطبوخ)، أكلة."
      ar: "مفردات: chat = دردشة، رسالة؛ sego = أرز مطبوخ، وجبة."
      en: "Words: chat = chat, message; sego = cooked rice, meal."
- kind: dialogue
  title: Chat saka Mbak Ayu
  lines:
  - speaker: Mbak Sekar
    text: Danang, aku nampa chat saka Mbak Ayu. Tak wacakne. "Mas, sego kucing piro?"
    ar_eg: يا دانانج، جاتلي رسالة من مباك أيو. هقراها. «يا ماس، رز القطط بكام؟»
    ar: 'يا دانانغ، وصلتني رسالة من مباك أيو. سأقرؤها: «يا ماس، بكم أرز القطّ؟»'
    en: Danang, I got a chat from Mbak Ayu. I'll read it. "Mas, sego kucing piro?"
  - speaker: Mas Danang
    text: Sego kucing! Iku sega cilik karo lawuh sithik, regane murah. Ora kanggo kucing, hehe.
    ar_eg: رز القطط! ده رز صغيّر بشويّة أكل جنبه، ورخيص. مش للقطط، هههه.
    ar: أرز القطّ! صرّة أرز صغيرة مع قليل من الطعام، ورخيصة. ليست للقطط، هههه.
    en: Sego kucing! It's a small portion of rice with a little side, cheap. Not for cats, hehe.
    note:
      ar_eg: sego kucing (بالرسمي sega kucing) = لفّة رز صغيّرة قدّ أكلة قطّة، بتتباع في عربيات الأكل بالليل (angkringan).
      ar: sego kucing (رسميًّا sega kucing) = صرّة أرز صغيرة بحجم وجبة قطّ، تُباع في عربات الطعام الليلية (angkringan).
      en: Sego kucing (standard sega kucing) = a cat-sized rice parcel, sold at night food carts (angkringan).
  - speaker: Mbak Sekar
    text: Ing ejaan baku, ditulis "sega kucing pira".
    ar_eg: بالإملاء الرسمي، بتتكتب «sega kucing pira».
    ar: وبالإملاء القياسيّ تُكتب «sega kucing pira».
    en: In standard spelling, it's written "sega kucing pira".
  - speaker: Mas Danang
    text: Nanging yen aku nulis "sega" ing chat, kancaku ngguyu. Kaya buku pelajaran!
    ar_eg: بس لو كتبت «sega» في الشات، صحابي هيضحكوا. زي كتاب المدرسة!
    ar: لكن إن كتبت «sega» في الدردشة ضحك أصدقائي. كأنّه كتاب مدرسيّ!
    en: But if I write "sega" in a chat, my friends laugh. Like a textbook!
  - speaker: Mbak Sekar
    text: Hahaha. Mula Mas Mohamed kudu ngerti loro-lorone. Maca "a", krungu "o".
    ar_eg: ههههه. عشان كده ماس محمد لازم يعرف الاتنين. يقرا «a»، يسمع «o».
    ar: 'ههههه. لهذا على ماس محمد أن يعرف الاثنين: يقرأ «a» ويسمع «o».'
    en: Hahaha. So Mas Mohamed needs to know both. Read "a", hear "o".
  - speaker: Mas Danang
    text: Lan ana jebakan. "Lara" iku sakit, nanging "loro" iku angka loro!
    ar_eg: وفيه فخّ. «lara» يعني عيّان، بس «loro» يعني رقم اتنين!
    ar: 'وثمّة فخّ: «lara» تعني مريض، أمّا «loro» فالرقم اثنان!'
    en: And there's a trap. "Lara" means sick, but "loro" is the number two!
    note:
      ar_eg: "كلمات: sakit = عيان (بأدب)."
      ar: "مفردات: sakit = مريض."
      en: "Words: sakit = sick, ill (polite)."
  - speaker: Mbak Sekar
    text: Bener. "Aku lara" diwaca "aku loro", nanging tegese "aku sakit", dudu "aku loro"!
    ar_eg: صحّ. «aku lara» بتتقري «aku loro» بس معناها «أنا عيّان»، مش «أنا اتنين»!
    ar: صحيح. «aku lara» تُقرأ «aku loro» ومعناها «أنا مريض» لا «أنا اثنان»!
    en: Right. "Aku lara" is said "aku loro", but means "I'm sick", not "I'm two"!
    note:
      ar_eg: lara (مكتوبة بـa) = عيّان، وبتتنطق تقريبًا loro. loro (مكتوبة بـo) = اتنين. الكتابة الرسمية بتفرّق بينهم.
      ar: lara (تُكتب بـa) = مريض وتُنطق قرابة loro، وloro (تُكتب بـo) = اثنان. والإملاء القياسيّ يفرّق بينهما.
      en: Lara (spelled with a) = sick, pronounced close to loro. Loro (spelled with o) = two. Standard spelling keeps them apart.
  - speaker: Mas Danang
    text: Wah, untung ana ejaan baku!
    ar_eg: الحمد لله إن فيه إملاء رسمي!
    ar: لحسن الحظّ يوجد إملاء قياسيّ!
    en: Thank goodness for standard spelling!
- kind: word_spotlight
  title: Dh lan d, th lan t
  lines:
  - speaker: Mbak Sekar
    text: 'Basa Jawa duwe swara loro kanggo "d": d lan dh. Lan loro kanggo "t": t lan th.'
    ar_eg: 'الجاوي فيه صوتين لـ«d»: d وdh. وصوتين لـ«t»: t وth.'
    ar: 'للجاوية صوتان للـ«d»: d وdh، وصوتان للـ«t»: t وth.'
    en: 'Javanese has two sounds for "d": d and dh. And two for "t": t and th.'
    note:
      ar_eg: "كلمات: swara = صوت (sandhangan swara = علامات الحركات)."
      ar: "مفردات: swara = صوت (sandhangan swara = علامات الحركات)."
      en: "Words: swara = sound, voice (sandhangan swara = vowel marks)."
  - speaker: Mas Danang
    text: Dh lan th, ilate mundur sithik, kaya swara dhad lan tha ing basa Arab, nanging luwih entheng.
    ar_eg: dh وth اللسان بيرجع لورا شويّة، زي «ض» و«ط» في العربي بس أخفّ.
    ar: في dh وth يرتدّ اللسان قليلًا، كـ«ض» و«ط» لكن أخفّ.
    en: For dh and th, the tongue curls back a little, a bit like Arabic heavy d and t, but lighter.
    note:
      ar_eg: الـdh والـth في الجاوي بيتقالوا بطرف اللسان راجع لسقف الحلق. قريبين من «ض» و«ط» المصرية، بس من غير تفخيم جامد.
      ar: يُنطق dh وth الجاويّان وطرف اللسان مرتدّ نحو سقف الحلق، قريبًا من «ض» و«ط» بلا تفخيم شديد.
      en: Javanese dh and th are said with the tongue tip curled back - close to Egyptian ض and ط, without heavy emphasis.
  - speaker: Mbak Sekar
    text: Dhadha iku awak ing ngarep. Wedhi iku pasir. Kathah iku akeh.
    ar_eg: dhadha يعني الصدر. wedhi يعني رمل. kathah يعني كتير.
    ar: dhadha الصدر، وwedhi الرمل، وkathah كثير.
    en: Dhadha is your chest. Wedhi is sand. Kathah means many.
  - speaker: Mas Danang
    text: Jajal game Minimal Pairs ing pelajaran. Kupingmu bakal latihan!
    ar_eg: جرّب لعبة «Minimal Pairs» في الدرس. ودنك هتتمرّن!
    ar: جرّب لعبة «Minimal Pairs» في الدرس. ستتدرّب أذنك!
    en: Try the Minimal Pairs game in the lesson. Your ears will get a workout!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Sega kucing pira?
    ar_eg: رز القطط بكام؟
    ar: بكم أرز القطّ؟
    en: How much is sega kucing?
  - speaker: Mas Danang
    text: Sega kucing pira?
    ar_eg: رز القطط بكام؟
    ar: بكم أرز القطّ؟
    en: How much is sega kucing?
  - speaker: Mbak Sekar
    text: Aku lara.
    ar_eg: أنا عيّان.
    ar: أنا مريض.
    en: I'm sick.
  - speaker: Mas Danang
    text: Aku lara.
    ar_eg: أنا عيّان.
    ar: أنا مريض.
    en: I'm sick.
  - speaker: Mbak Sekar
    text: Aku duwe adhi loro.
    ar_eg: عندي اتنين إخوات صغيّرين.
    ar: لديّ أخوان أصغر.
    en: I have two younger siblings.
  - speaker: Mas Danang
    text: Aku duwe adhi loro.
    ar_eg: عندي اتنين إخوات صغيّرين.
    ar: لديّ أخوان أصغر.
    en: I have two younger siblings.
  - speaker: Mbak Sekar
    text: Wedhine putih.
    ar_eg: الرمل أبيض.
    ar: الرمل أبيض.
    en: The sand is white.
  - speaker: Mas Danang
    text: Wedhine putih.
    ar_eg: الرمل أبيض.
    ar: الرمل أبيض.
    en: The sand is white.
  - speaker: Mbak Sekar
    text: Tulisane "a", diwaca "o".
    ar_eg: مكتوب «a» وبيتقري «o».
    ar: يُكتب «a» ويُقرأ «o».
    en: Written "a", read "o".
  - speaker: Mas Danang
    text: Tulisane "a", diwaca "o".
    ar_eg: مكتوب «a» وبيتقري «o».
    ar: يُكتب «a» ويُقرأ «o».
    en: Written "a", read "o".
- kind: outro
  title: Tulisane Mas Mohamed
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, iki chat. "Kowe arep mangan opo? Sego opo mie?" Tulisen maneh nganggo ejaan baku.
    ar_eg: يا ماس محمد، دي رسالة. «هتاكل إيه؟ رز ولّا مكرونة؟» اكتبها تاني بالإملاء الرسمي.
    ar: 'يا ماس محمد، هذه رسالة: «ماذا ستأكل؟ أرزًّا أم نودلز؟» أعد كتابتها بالإملاء القياسيّ.'
    en: Mas Mohamed, here's a chat. "Kowe arep mangan opo? Sego opo mie?" Rewrite it in standard spelling.
    note:
      ar_eg: 'دورك! الإجابة: Kowe arep mangan apa? Sega apa mie?'
      ar: 'دورك! الجواب: Kowe arep mangan apa? Sega apa mie?'
      en: 'Your turn! Answer: Kowe arep mangan apa? Sega apa mie?'
  - speaker: Mbak Sekar
    text: 'Wangsulane: Kowe arep mangan apa? Sega apa mie?'
    ar_eg: 'الإجابة: «Kowe arep mangan apa? Sega apa mie?»'
    ar: 'الجواب: «Kowe arep mangan apa? Sega apa mie?»'
    en: 'The answer: Kowe arep mangan apa? Sega apa mie?'
  - speaker: Mas Danang
    text: PR-mu, rungokna Mbak Ayu ing pelajaran, lan tulisen apa sing dikandhakake nganggo ejaan baku.
    ar_eg: واجبك، اسمع مباك أيو في الدرس، واكتب اللي قالته بالإملاء الرسمي.
    ar: 'واجبك: استمع إلى مباك أيو في الدرس واكتب ما قالته بالإملاء القياسيّ.'
    en: 'Your homework: listen to Mbak Ayu in the lesson and write what she says in standard spelling.'
  - speaker: Mbak Sekar
    text: Sesuk kita dolan adoh, neng museum sepur Ambarawa, maca medsos. Nganti pinanggih malih!
    ar_eg: بكرة رحلة بعيدة لمتحف القطورات في أمباراوا، نقرا السوشيال ميديا. إلى اللقاء!
    ar: غدًا رحلة بعيدة إلى متحف القطارات في أمباراوا لنقرأ وسائل التواصل. إلى اللقاء!
    en: Tomorrow's a long day trip to the Ambarawa railway museum, reading social media. See you!
