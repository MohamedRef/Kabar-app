title:
  target: Cerkak
  ar_eg: القصّة القصيّرة
  ar: القصّة القصيرة
  en: Short stories
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Menara Kudus
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saking Kudus! Ing ngarep kula ana menara abang saka bata, kaya candhi. Kula Sekar.
    ar_eg: صباح الخير من قدس! قدّامي منارة حمرا من الطوب، زي المعبد. أنا سيكار.
    ar: صباح الخير من قدس! أمامي مئذنة حمراء من الطوب كالمعبد. أنا سيكار.
    en: Good morning from Kudus! In front of me is a red brick minaret, like a temple. I'm Sekar.
    note:
      ar_eg: منارة قدس جنب جامع، وشكلها زي المعابد الهندوسية-الجاوية القديمة. صورة لإزّاي الإسلام دخل جاوة بهدوء ومن غير ما يمسح اللي قبله.
      ar: مئذنة قدس بجوار مسجد، وشكلها كالمعابد الهندوسية-الجاوية القديمة، صورة لدخول الإسلام جاوة برفق دون محو ما قبله.
      en: The Kudus minaret stands by a mosque in the form of an old Hindu-Javanese temple - a picture of how Islam came to Java gently, without erasing what came before.
  - speaker: Mas Galih
    text: Aku Galih. Kudus iku kutha Sunan Kudus. Lan dina iki kita maca cerkak, crita cekak!
    ar_eg: أنا جاليه. قدس مدينة سونان قدس. والنهارده هنقرا «cerkak»، قصّة قصيّرة!
    ar: أنا غاليه. قدس مدينة سونان قدس. واليوم نقرأ «cerkak»، قصّة قصيرة!
    en: I'm Galih. Kudus is Sunan Kudus's town. And today we read a cerkak, a short story!
  - speaker: Mbak Sekar
    text: Ing crita, ana tembung-tembung sing nyambung kedadeyan. Banjur, nuli, sawise, nalika.
    ar_eg: في الحكاية، فيه كلمات بتربط الأحداث. وبعدين، بعدها، بعد ما، لمّا.
    ar: 'في القصّة كلمات تربط الأحداث: ثمّ، بعدئذ، بعد أن، حين.'
    en: In a story, some words link the events. Banjur, nuli, sawise, nalika.
  - speaker: Mas Galih
    text: Ayo, aku critakake cerkak cilik. Sampeyan rungokna tembung-tembung kuwi, ya.
    ar_eg: يلّا، هحكيلكم قصّة صغيّرة. اسمعوا الكلمات دي.
    ar: هيّا، سأقصّ عليكم قصّة صغيرة. استمعوا إلى تلك الكلمات.
    en: Come on, I'll tell a little cerkak. Listen for those words.
- kind: dialogue
  title: Sepur telat
  lines:
  - speaker: Mas Galih
    text: Ing sawijining dina, ana bocah jenenge Bayu. Dheweke arep menyang Kudus numpak sepur.
    ar_eg: في يوم من الأيّام، كان فيه ولد اسمه بايو. كان عايز يروح قدس بالقطر.
    ar: في يوم من الأيّام، كان هناك صبيّ اسمه بايو، أراد الذهاب إلى قدس بالقطار.
    en: One day, there was a boy called Bayu. He wanted to go to Kudus by train.
    note:
      ar_eg: «ing sawijining dina» = «في يوم من الأيّام» - بداية كلاسيكية لأيّ قصّة جاوي.
      ar: «ing sawijining dina» = «في يوم من الأيّام» - بداية كلاسيكية لأيّ قصّة جاوية.
      en: '"Ing sawijining dina" = "one day" - the classic opening for any Javanese story.'
  - speaker: Mbak Sekar
    text: Banjur?
    ar_eg: وبعدين؟
    ar: ثمّ؟
    en: And then?
  - speaker: Mas Galih
    text: Sadurunge mangkat, dheweke sarapan karo ibune. Banjur dheweke mlayu menyang stasiun.
    ar_eg: قبل ما يمشي، فطر مع أمّه. وبعدين جري على المحطّة.
    ar: قبل أن ينطلق أفطر مع أمّه، ثمّ ركض إلى المحطّة.
    en: Before leaving, he had breakfast with his mum. Then he ran to the station.
  - speaker: Mbak Sekar
    text: Nalika tekan stasiun, apa sing kedadeyan?
    ar_eg: لمّا وصل المحطّة، حصل إيه؟
    ar: حين وصل إلى المحطّة، ماذا حدث؟
    en: When he reached the station, what happened?
  - speaker: Mas Galih
    text: Nalika tekan stasiun, sepure durung teka. Sejam, rong jam... sepure telat!
    ar_eg: لمّا وصل المحطّة، القطر ماكانش جه. ساعة، ساعتين... القطر متأخّر!
    ar: حين وصل لم يكن القطار قد أتى. ساعة، ساعتان... القطار متأخّر!
    en: When he got to the station, the train hadn't come. One hour, two hours... the train was late!
  - speaker: Mbak Sekar
    text: Waduh. Nuli Bayu ngapa?
    ar_eg: يا خبر. وبعدها بايو عمل إيه؟
    ar: يا للأسف. وبعدئذ ماذا فعل بايو؟
    en: Oh no. And then what did Bayu do?
  - speaker: Mas Galih
    text: Nuli dheweke lungguh lan maca buku. Dumadakan, ana simbah lungguh ing sandhinge.
    ar_eg: بعدها قعد يقرا كتاب. وفجأة، جدّ قعد جنبه.
    ar: بعدئذ جلس يقرأ كتابًا. وفجأة جلس جدّ بجانبه.
    en: Then he sat and read a book. Suddenly, an old man sat down next to him.
    note:
      ar_eg: 'dumadakan = فجأة. أهمّ كلمة في أيّ قصّة: من هنا الحكاية بتتقلب!'
      ar: 'dumadakan = فجأة. أهمّ كلمة في أيّ قصّة: من هنا تنقلب الحكاية!'
      en: 'Dumadakan = suddenly. The key word in any story: here the plot turns!'
  - speaker: Mbak Sekar
    text: Simbah kuwi sapa?
    ar_eg: الجدّ ده كان مين؟
    ar: من كان ذلك الجدّ؟
    en: Who was that old man?
  - speaker: Mas Galih
    text: Simbah kuwi crita babagan menara Kudus, babagan Sunan Kudus, babagan kutha lawas. Bayu seneng banget.
    ar_eg: الجدّ ده حكاله عن منارة قدس، وعن سونان قدس، وعن المدينة القديمة. وبايو انبسط أوي.
    ar: حكى له الجدّ عن مئذنة قدس وعن سونان قدس وعن المدينة القديمة، فسُرّ بايو كثيرًا.
    en: The old man told him about the Kudus minaret, about Sunan Kudus, about the old town. Bayu loved it.
  - speaker: Mbak Sekar
    text: Lan pungkasane?
    ar_eg: وفي الآخر؟
    ar: وفي النهاية؟
    en: And in the end?
  - speaker: Mas Galih
    text: Pungkasane, sawise telung jam, sepure teka. Nanging Bayu malah sedhih, merga critane simbah durung rampung!
    ar_eg: في الآخر، بعد تلات ساعات، القطر جه. بس بايو بالعكس زعل، عشان حكاية الجدّ ماخلصتش!
    ar: وأخيرًا، بعد ثلاث ساعات أتى القطار. لكنّ بايو حزن بدلًا من ذلك، لأنّ حكاية الجدّ لم تنتهِ!
    en: In the end, after three hours, the train came. But Bayu was actually sad, because grandpa's story wasn't finished!
  - speaker: Mbak Sekar
    text: Hahaha, apik! Crita sing apik iku luwih penting tinimbang sepur.
    ar_eg: ههههه، حلوة! الحكاية الحلوة أهمّ من القطر.
    ar: ههههه، جميلة! الحكاية الجميلة أهمّ من القطار.
    en: Hahaha, lovely! A good story matters more than a train.
- kind: word_spotlight
  title: Banjur, nuli, sawise
  lines:
  - speaker: Mbak Sekar
    text: 'Banjur lan nuli: "lalu", "kemudian". Banjur luwih akeh ing omongan, nuli luwih akeh ing tulisan.'
    ar_eg: 'banjur وnuli: «وبعدين». banjur أكتر في الكلام، nuli أكتر في الكتابة.'
    ar: 'banjur وnuli: «ثمّ». banjur أكثر في الكلام، وnuli أكثر في الكتابة.'
    en: 'Banjur and nuli: "then". Banjur is more spoken, nuli more written.'
  - speaker: Mas Galih
    text: 'Sadurunge: "sebelum". Sawise: "setelah". Nalika: "ketika".'
    ar_eg: 'sadurunge: «قبل». sawise: «بعد». nalika: «لمّا».'
    ar: 'sadurunge: «قبل». sawise: «بعد». nalika: «حين».'
    en: 'Sadurunge: "before". Sawise: "after". Nalika: "when".'
  - speaker: Mbak Sekar
    text: 'Dumadakan: "tiba-tiba". Pungkasane: "akhirnya". Lan ing sawijining dina kanggo miwiti.'
    ar_eg: 'dumadakan: «فجأة». pungkasane: «في الآخر». وing sawijining dina عشان تبدأ.'
    ar: 'dumadakan: «فجأة». pungkasane: «أخيرًا». وing sawijining dina للبدء.'
    en: 'Dumadakan: "suddenly". Pungkasane: "finally". And ing sawijining dina to begin.'
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Ing sawijining dina, ana bocah.
    ar_eg: في يوم من الأيّام، كان فيه ولد.
    ar: في يوم من الأيّام كان هناك صبيّ.
    en: One day, there was a boy.
  - speaker: Mas Galih
    text: Ing sawijining dina, ana bocah.
    ar_eg: في يوم من الأيّام، كان فيه ولد.
    ar: في يوم من الأيّام كان هناك صبيّ.
    en: One day, there was a boy.
  - speaker: Mbak Sekar
    text: Sadurunge mangkat, dheweke sarapan.
    ar_eg: قبل ما يمشي، فطر.
    ar: قبل أن ينطلق أفطر.
    en: Before leaving, he had breakfast.
  - speaker: Mas Galih
    text: Sadurunge mangkat, dheweke sarapan.
    ar_eg: قبل ما يمشي، فطر.
    ar: قبل أن ينطلق أفطر.
    en: Before leaving, he had breakfast.
  - speaker: Mbak Sekar
    text: Nalika tekan stasiun, sepure telat.
    ar_eg: لمّا وصل المحطّة، القطر كان متأخّر.
    ar: حين وصل إلى المحطّة كان القطار متأخّرًا.
    en: When he got to the station, the train was late.
  - speaker: Mas Galih
    text: Nalika tekan stasiun, sepure telat.
    ar_eg: لمّا وصل المحطّة، القطر كان متأخّر.
    ar: حين وصل إلى المحطّة كان القطار متأخّرًا.
    en: When he got to the station, the train was late.
  - speaker: Mbak Sekar
    text: Dumadakan, ana simbah teka.
    ar_eg: فجأة، جدّ جه.
    ar: فجأة أتى جدّ.
    en: Suddenly, an old man came.
  - speaker: Mas Galih
    text: Dumadakan, ana simbah teka.
    ar_eg: فجأة، جدّ جه.
    ar: فجأة أتى جدّ.
    en: Suddenly, an old man came.
  - speaker: Mbak Sekar
    text: Pungkasane, sepure teka.
    ar_eg: في الآخر، القطر جه.
    ar: أخيرًا أتى القطار.
    en: In the end, the train came.
  - speaker: Mas Galih
    text: Pungkasane, sepure teka.
    ar_eg: في الآخر، القطر جه.
    ar: أخيرًا أتى القطار.
    en: In the end, the train came.
- kind: outro
  title: Crita Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, critakna dina sing aneh ing urip sampeyan. Wiwiti nganggo "ing sawijining dina".
    ar_eg: يا ماس محمد، احكي عن يوم غريب في حياتك. ابدأ بـ«ing sawijining dina».
    ar: يا ماس محمد، احكِ عن يوم غريب في حياتك، وابدأ بـ«ing sawijining dina».
    en: Mas Mohamed, tell us about a strange day in your life. Start with "ing sawijining dina".
    note:
      ar_eg: دورك! استخدم banjur وnalika وdumadakan وpungkasane.
      ar: دورك! استعمل banjur وnalika وdumadakan وpungkasane.
      en: Your turn! Use banjur, nalika, dumadakan and pungkasane.
  - speaker: Mas Galih
    text: 'Contone: Ing sawijining dina, aku numpak metro ing Kairo. Dumadakan, listrike mati!'
    ar_eg: 'مثلًا: في يوم من الأيّام، ركبت المترو في القاهرة. وفجأة، النور قطع!'
    ar: 'مثلًا: في يوم من الأيّام ركبت المترو في القاهرة. وفجأة انقطعت الكهرباء!'
    en: 'For example: One day, I took the metro in Cairo. Suddenly, the power went out!'
  - speaker: Mbak Sekar
    text: PR-mu, wacanen crita "Kancil lan timun" ing pelajaran, lan critakna maneh nganggo tembungmu dhewe.
    ar_eg: واجبك، اقرا حكاية «الغزال الصغيّر والخيار» في الدرس، واحكيها تاني بكلامك.
    ar: 'واجبك: اقرأ حكاية «الغزال الصغير والخيار» في الدرس وأعد روايتها بكلماتك.'
    en: 'Your homework: read "Kancil and the cucumbers" in the lesson and retell it in your own words.'
  - speaker: Mas Galih
    text: Sesuk kita dhateng Demak, ngrungokake tembang. Nganti pinanggih malih!
    ar_eg: بكرة رايحين ديماك، نسمع أغاني. إلى اللقاء!
    ar: غدًا نذهب إلى ديماك لنستمع إلى الأغاني. إلى اللقاء!
    en: Tomorrow we go to Demak to listen to songs. Until next time!
