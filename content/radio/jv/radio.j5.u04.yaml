language: jv
level: j5
unit: j5.u04
title:
  target: Medsos
  ar_eg: السوشيال ميديا
  ar: وسائل التواصل
  en: Social media
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Museum Kereta Api Ambarawa
  lines:
  - speaker: Mas Danang
    text: Halo guys, eh, sugeng enjing! Kabar Radio saiki ing museum sepur Ambarawa. Aku Danang.
    ar_eg: هاي يا جماعة، قصدي صباح الخير! كبار راديو دلوقتي في متحف القطورات في أمباراوا. أنا دانانج.
    ar: مرحبًا يا شباب، أعني صباح الخير! كبار راديو الآن في متحف القطارات في أمباراوا. أنا دانانغ.
    en: Hi guys, er, good morning! Kabar Radio is at the Ambarawa railway museum now. I'm Danang.
    note:
      ar_eg: دانانج ابتدى بالإنجليزي من غير ما ياخد باله - ده بالظبط موضوع النهارده!
      ar: بدأ دانانغ بالإنجليزية دون أن ينتبه - وهذا موضوع اليوم بالضبط!
      en: Danang started in English without noticing - that's exactly today's topic!
  - speaker: Mbak Sekar
    text: "Aku Sekar. Dina iki: campur kode. Basa Jawa, Indonesia, lan Inggris ing ukara siji."
    ar_eg: "أنا سيكار. النهارده: خلط اللغات. جاوي وإندونيسي وإنجليزي في جملة واحدة."
    ar: "أنا سيكار. اليوم: خلط اللغات. جاوية وإندونيسية وإنجليزية في جملة واحدة."
    en: "I'm Sekar. Today: code-mixing. Javanese, Indonesian and English in one sentence."
    note:
      ar_eg: "كلمات: jawa = جاوة؛ جاوي؛ kode = كود؛ campur kode = خلط اللغات."
      ar: "مفردات: jawa = جاوة؛ جاوي؛ kode = رمز؛ campur kode = خلط اللغات."
      en: "Words: jawa = Java; Javanese; kode = code; campur kode = code-mixing."
  - speaker: Mas Danang
    text: "Ing medsos, akeh basa Jawa kaya ngene."
    ar_eg: "على السوشيال ميديا، جاوي كتير بيبقى كده."
    ar: "على وسائل التواصل، كثير من الجاوية هكذا."
    en: "On social media, lots of Javanese is like this."
    note:
      ar_eg: "medsos = media sosial، يعني السوشيال ميديا."
      ar: "medsos = media sosial، أي وسائل التواصل الاجتماعي."
      en: "medsos = media sosial, social media."
  - speaker: Mbak Sekar
    text: "Ing museum iki ana sepur lawas. Akeh wong foto-foto. Ayo maca komentare!"
    ar_eg: "في المتحف ده فيه قطورات قديمة. ناس كتير بتتصوّر. يلّا نقرا التعليقات!"
    ar: "في هذا المتحف قطارات قديمة، ويتصوّر كثيرون. هيّا نقرأ التعليقات!"
    en: "This museum has old trains. Lots of people take photos. Let's read the comments!"
    note:
      ar_eg: "foto-foto = يتصوّروا كتير للتسلية. التكرار بيدّي معنى «كذا مرّة وعلى راحتهم»."
      ar: "foto-foto = يلتقطون الصور للتسلية. التكرار يفيد التكرار والعفوية."
      en: "foto-foto = taking photos for fun. Doubling the word makes it casual and repeated."
- kind: dialogue
  title: Komentar TikTok
  lines:
  - speaker: Mas Danang
    text: 'Iki video TikTok saka museum. Komentar pisanan: "Keren pol, gaes! Pengen mrono!"'
    ar_eg: 'ده فيديو تيك توك من المتحف. أوّل تعليق: «جامد موت يا جماعة! نفسي أروح هناك!»'
    ar: 'هذا فيديو تيك توك من المتحف. أوّل تعليق: «رائع للغاية يا شباب! أريد الذهاب إلى هناك!»'
    en: 'Here''s a TikTok video from the museum. First comment: "Super cool, guys! Wanna go there!"'
    note:
      ar_eg: "كلمات: komentar = تعليق، كومنت؛ mrono = لهناك؛ pengen = عايز، نفسه في؛ gaes = guys بالشات؛ pisanan = أول، أول مرة."
      ar: "مفردات: komentar = تعليق؛ mrono = إلى هناك؛ pengen = يريد، يرغب؛ gaes = guys في الدردشة؛ pisanan = أول، المرة الأولى."
      en: "Words: komentar = comment; mrono = (to) there; pengen = to want, to feel like; gaes = guys (chat spelling); pisanan = first, the first time."
  - speaker: Mbak Sekar
    text: Ayo dipisah. "Keren" Indonesia. "Pol" Jawa. "Gaes" iku "guys" Inggris, ditulis cara Indonesia.
    ar_eg: يلّا نفصّلها. «keren» إندونيسي. «pol» جاوي. «gaes» هي «guys» الإنجليزي مكتوبة بطريقة إندونيسية.
    ar: لنفصّلها. «keren» إندونيسية، و«pol» جاوية، و«gaes» هي «guys» الإنجليزية مكتوبة على الطريقة الإندونيسية.
    en: Let's split it. "Keren" Indonesian. "Pol" Javanese. "Gaes" is English "guys", spelled the Indonesian way.
    note:
      ar_eg: "كلمات: ditulis = مكتوب، اتكتب."
      ar: "مفردات: ditulis = كُتِب."
      en: "Words: ditulis = to be written."
  - speaker: Mas Danang
    text: '"Pengen" iku Jawa lan Indonesia gaul. "Mrono" iku Jawa, tegese "menyang kana".'
    ar_eg: «pengen» جاوي وإندونيسي عامّي. «mrono» جاوي، معناها «لهناك».
    ar: «pengen» جاوية وإندونيسية عامّية، و«mrono» جاوية تعني «إلى هناك».
    en: '"Pengen" is Javanese and slangy Indonesian. "Mrono" is Javanese, meaning "to there".'
  - speaker: Mbak Sekar
    text: 'Komentar kapindho: "Sepure masih jalan ta? Aku mau naik!"'
    ar_eg: 'التعليق التاني: «القطر لسّه شغّال؟ أنا عايز أركب!»'
    ar: 'التعليق الثاني: «هل ما زال القطار يعمل؟ أريد أن أركب!»'
    en: 'Second comment: "Does the train still run? I want a ride!"'
    note:
      ar_eg: "كلمات: kapindho = التاني."
      ar: "مفردات: kapindho = الثاني."
      en: "Words: kapindho = second."
  - speaker: Mas Danang
    text: '"Sepure" Jawa, "masih jalan" Indonesia, "ta" Jawa, "mau naik" Indonesia. Campur kabeh!'
    ar_eg: «sepure» جاوي، «masih jalan» إندونيسي، «ta» جاوي، «mau naik» إندونيسي. كلّه متلخبط!
    ar: «sepure» جاوية، و«masih jalan» إندونيسية، و«ta» جاوية، و«mau naik» إندونيسية. خليط كامل!
    en: '"Sepure" Javanese, "masih jalan" Indonesian, "ta" Javanese, "mau naik" Indonesian. All mixed!'
  - speaker: Mbak Sekar
    text: "Lan wangsulane: \"Isih, Kak! Sepure mlaku saben akhir minggu.\""
    ar_eg: "والردّ: «أيوه لسّه! القطر بيمشي كل ويك إند.»"
    ar: "والردّ: «نعم ما زال! القطار يسير كلّ نهاية أسبوع.»"
    en: "And the reply: \"It does, Kak! The train runs every weekend.\""
    note:
      ar_eg: متحف أمباراوا فيه قطر بخار سياحي، وكمان قطر بسنّة (rack railway) بيطلع الجبل. المواعيد بتتغيّر، فاتأكّد قبل ما تروح.
      ar: في متحف أمباراوا قطار بخاريّ سياحيّ وقطار مسنّن يصعد الجبل، والمواعيد تتغيّر فتأكّد قبل الذهاب.
      en: Ambarawa runs a tourist steam train and a rack railway up the hill; schedules change, so check before going.
  - speaker: Mas Danang
    text: 'Komentar katelu, saka Mas Yudha: "Wkwkwk, HP-ne Mas Danang kok burem fotone?"'
    ar_eg: 'التعليق التالت، من ماس يودا: «ههههه، الموبايل بتاع ماس دانانج صوره مغبّشة كده ليه؟»'
    ar: 'التعليق الثالث من ماس يودا: «ههههه، لماذا صور هاتف ماس دانانغ ضبابية؟»'
    en: 'Third comment, from Mas Yudha: "LOL, how come Mas Danang''s phone photos are so blurry?"'
    note:
      ar_eg: "كلمات: hp-ne = موبايله (HP + -ne)؛ burem = مغبّش، مش واضح؛ katelu = التالت."
      ar: "مفردات: hp-ne = هاتفه (HP + -ne)؛ burem = ضبابي، غير واضح؛ katelu = الثالث."
      en: "Words: hp-ne = his phone (HP + -ne); burem = blurry; katelu = third."
  - speaker: Mbak Sekar
    text: Hahaha! "Wkwkwk" iku ngguyu ing chat. "HP-ne", HP Indonesia plus "-ne" Jawa.
    ar_eg: ههههه! «wkwkwk» يعني ضحك في الشات. «HP-ne»، كلمة HP الإندونيسي زائد «-ne» الجاوي.
    ar: 'ههههه! «wkwkwk» ضحك في الدردشة. و«HP-ne»: HP الإندونيسية زائد «-ne» الجاوية.'
    en: Hahaha! "Wkwkwk" is laughing in chats. "HP-ne", Indonesian HP plus Javanese "-ne".
    note:
      ar_eg: "كلمات: chat = شات، رسالة؛ ne = بتاعه، الـ (لاحقة مكتوبة منفصلة)."
      ar: "مفردات: chat = دردشة، رسالة؛ ne = ـه، الـ (لاحقة مفصولة)."
      en: "Words: chat = chat, message; ne = his/her/its, the (suffix -ne written apart)."
  - speaker: Mas Danang
    text: Waduh, Yudha! Fotone ora burem, kameraku sing lawas, kaya sepure!
    ar_eg: يا خبر يا يودا! الصور مش مغبّشة، الكاميرا بتاعتي هي اللي قديمة، زي القطر!
    ar: يا يودا! الصور ليست ضبابية، كاميرتي هي القديمة، مثل القطار!
    en: Oh come on, Yudha! The photos aren't blurry, my camera's just old, like the train!
- kind: word_spotlight
  title: Campur kode
  lines:
  - speaker: Mbak Sekar
    text: "Campur kode: telung basa ing ukara siji. Iki biasa, dudu salah."
    ar_eg: "خلط اللغات: تلات لغات في جملة واحدة. ده عادي، مش غلط."
    ar: "خلط اللغات: ثلاث لغات في جملة واحدة. هذا عاديّ لا خطأ."
    en: "Code-mixing: three languages in one sentence. Normal, not a mistake."
    note:
      ar_eg: "كلمات: biasa = عادي."
      ar: "مفردات: biasa = عادي، معتاد."
      en: "Words: biasa = usual, ordinary, normal."
  - speaker: Mas Danang
    text: "Tembung Inggris uga nganggo di-."
    ar_eg: "الكلمات الإنجليزي كمان بتاخد di-."
    ar: "الكلمات الإنجليزية أيضًا تأخذ di-."
    en: "English words take di- too."
    note:
      ar_eg: "زي dishare (اتشيّر) وdilike - بالظبط زي ما بنقول بالمصري «اتشيّر» و«عمل لايك»!"
      ar: "مثل dishare (شورِك) وdilike - تمامًا كما نقول بالمصرية «اتشيّر» و«عمل لايك»!"
      en: "Like dishare (got shared) and dilike - exactly like Egyptians say \"etshayyar\" and \"3amal like\"!"
  - speaker: Mbak Sekar
    text: "Lan Reader ing Kabar bisa ngerti basa saben tembung!"
    ar_eg: "والقارئ في كبار يقدر يعرف لغة كل كلمة!"
    ar: "وقارئ «كبار» يستطيع معرفة لغة كلّ كلمة!"
    en: "And Kabar's Reader can tell each word's language!"
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Keren pol!
    ar_eg: جامد موت!
    ar: رائع للغاية!
    en: Super cool!
  - speaker: Mas Danang
    text: Keren pol!
    ar_eg: جامد موت!
    ar: رائع للغاية!
    en: Super cool!
  - speaker: Mbak Sekar
    text: Pengen mrono!
    ar_eg: نفسي أروح هناك!
    ar: أريد الذهاب إلى هناك!
    en: Wanna go there!
  - speaker: Mas Danang
    text: Pengen mrono!
    ar_eg: نفسي أروح هناك!
    ar: أريد الذهاب إلى هناك!
    en: Wanna go there!
  - speaker: Mbak Sekar
    text: Postinganmu dishare atusan wong.
    ar_eg: البوست بتاعك اتشيّر من مئات.
    ar: شارك منشورك المئات.
    en: Your post was shared by hundreds.
  - speaker: Mas Danang
    text: Postinganmu dishare atusan wong.
    ar_eg: البوست بتاعك اتشيّر من مئات.
    ar: شارك منشورك المئات.
    en: Your post was shared by hundreds.
  - speaker: Mbak Sekar
    text: HP-ne lawas.
    ar_eg: الموبايل قديم.
    ar: الهاتف قديم.
    en: The phone is old.
  - speaker: Mas Danang
    text: HP-ne lawas.
    ar_eg: الموبايل قديم.
    ar: الهاتف قديم.
    en: The phone is old.
  - speaker: Mbak Sekar
    text: Isih, saben akhir minggu.
    ar_eg: لسّه، كل ويك إند.
    ar: ما زال، كلّ نهاية أسبوع.
    en: Still, every weekend.
  - speaker: Mas Danang
    text: Isih, saben akhir minggu.
    ar_eg: لسّه، كل ويك إند.
    ar: ما زال، كلّ نهاية أسبوع.
    en: Still, every weekend.
  - speaker: Mbak Sekar
    text: 'Siji maneh, pesen saka grup kanca: "OTW, sabar ya. HP-ku lowbat."'
    ar_eg: 'كمان رسالة من جروب الصحاب: «في السكّة، اصبروا. موبايلي فاصل شحن.»'
    ar: 'ورسالة أخرى من مجموعة الأصدقاء: «في الطريق، اصبروا. هاتفي فرغت بطاريته.»'
    en: 'One more, a message from a friends'' group: "OTW, be patient. My phone''s on low battery."'
  - speaker: Mas Danang
    text: 'Lan wangsulane: "Gpp, kabari ing grup yen wis teka." Keren, cekak banget!'
    ar_eg: 'والردّ: «ولا يهمّك، قول في الجروب لمّا توصل.» جامد، قصيّرة أوي!'
    ar: 'والردّ: «لا بأس، أخبرنا في المجموعة حين تصل.» رائع، قصير جدًّا!'
    en: 'And the reply: "No worries, let the group know when you arrive." Cool, so short!'
    note:
      ar_eg: "OTW = on the way. lowbat = البطارية قرّبت تخلص. gpp = ga papa (زي ra papa)، ولا يهمّك. kabari = بلّغني. كلمات: cekak = قصير / مختصر؛ teka = ييجي."
      ar: "OTW = في الطريق. lowbat = بطارية منخفضة. gpp = ga papa (مثل ra papa) أي لا بأس. kabari = أخبِرني. مفردات: cekak = قصير / مختصر؛ teka = يأتي."
      en: "OTW = on the way. Lowbat = low battery. Gpp = ga papa (like ra papa), no worries. Kabari = let me know. Words: cekak = short, brief = singkat, pendek; teka = come = datang."
- kind: outro
  title: Caption Mas Mohamed
  lines:
  - speaker: Mas Danang
    text: "Mas Mohamed, saiki sampeyan: tulisen ukara nganggo campur kode. Jawa, Indonesia, lan Inggris!"
    ar_eg: "يا ماس محمد، دورك دلوقتي: اكتب جملة فيها خلط لغات. جاوي وإندونيسي وإنجليزي!"
    ar: "يا ماس محمد، الآن دورك: اكتب جملة بخلط اللغات. جاوية وإندونيسية وإنجليزية!"
    en: "Mas Mohamed, now you: write a code-mixed sentence. Javanese, Indonesian and English!"
    note:
      ar_eg: "دورك! وبعدين علّم كل كلمة: جاوي، إندونيسي، ولّا إنجليزي. وجرّب «Screenshot Decoder» في الدرس."
      ar: "دورك! ثمّ علّم كلّ كلمة: جاوية أم إندونيسية أم إنجليزية. وجرّب «Screenshot Decoder» في الدرس."
      en: "Your turn! Then tag every word: Javanese, Indonesian or English. And try the Screenshot Decoder in the lesson."
  - speaker: Mbak Sekar
    text: "Contone: Dolan neng piramida, panase pol, but keren!"
    ar_eg: "مثلًا: فسحة عند الأهرامات، الحرّ على الآخر، but keren!"
    ar: "مثلًا: نزهة عند الأهرامات، الحرّ شديد، but keren!"
    en: "For example: Visiting the pyramids, scorching hot, but cool!"
    note:
      ar_eg: "كلمات: but = بس (إنجليزي)؛ keren = تحفة، جامد (إندونيسي شباب)."
      ar: "مفردات: but = لكن (إنجليزية)؛ keren = رائع (إندونيسية الشباب)."
      en: "Words: but = English but; keren = cool (young Indonesian)."
  - speaker: Mas Danang
    text: "PR-mu, rungokna pesen saka Mas Yudha ing pelajaran."
    ar_eg: "واجبك، اسمع رسالة ماس يودا في الدرس."
    ar: "واجبك: استمع إلى رسالة ماس يودا في الدرس."
    en: "Your homework: listen to Mas Yudha's message in the lesson."
  - speaker: Mbak Sekar
    text: Sesuk kita dhateng Kudus, maca cerkak. Nganti pinanggih malih!
    ar_eg: بكرة رايحين قدس، نقرا قصّة قصيّرة. إلى اللقاء!
    ar: غدًا نذهب إلى قدس لنقرأ قصّة قصيرة. إلى اللقاء!
    en: Tomorrow we go to Kudus to read a short story. Until next time!
    note:
      ar_eg: "كلمات: cerkak = قصة قصيرة (crita cekak)."
      ar: "مفردات: cerkak = قصة قصيرة (crita cekak)."
      en: "Words: cerkak = short story (crita cekak) = cerpen."
