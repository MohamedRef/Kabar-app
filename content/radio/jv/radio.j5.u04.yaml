title:
  target: Medsos
  ar_eg: السوشيال ميديا
  ar: وسائل التواصل
  en: Social media
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Museum Kereta Api Ambarawa
  lines:
  - speaker: Mas Danang
    text: Halo guys, eh, sugeng enjing! Kabar Radio saiki ing museum sepur Ambarawa. Aku Danang.
    ar_eg: هاي يا جماعة، قصدي صباح الخير! كبار راديو دلوقتي في متحف القطورات في أمباراوا. أنا دانانج.
    ar: مرحبًا يا شباب، أعني صباح الخير! كبار راديو الآن في متحف القطارات في أمباراوا. أنا دانانغ.
    en: Hi guys, er, good morning! Kabar Radio is at the Ambarawa railway museum now. I'm Danang.
    note:
      ar_eg: دانانج ابتدى بالإنجليزي من غير ما ياخد باله - ده بالظبط موضوع النهارده!
      ar: بدأ دانانغ بالإنجليزية دون أن ينتبه - وهذا موضوع اليوم بالضبط!
      en: Danang started in English without noticing - that's exactly today's topic!
  - speaker: Mbak Sekar
    text: 'Aku Sekar. Danang wis miwiti tema dina iki: campur kode. Basa Jawa, Indonesia, lan Inggris ing ukara siji.'
    ar_eg: 'أنا سيكار. دانانج بدأ موضوع النهارده خلاص: خلط اللغات. جاوي وإندونيسي وإنجليزي في جملة واحدة.'
    ar: 'أنا سيكار. بدأ دانانغ موضوع اليوم: خلط اللغات. جاوية وإندونيسية وإنجليزية في جملة واحدة.'
    en: 'I''m Sekar. Danang has started today''s topic: code-mixing. Javanese, Indonesian and English in one sentence.'
  - speaker: Mas Danang
    text: Ing medsos, meh kabeh basa Jawa kaya ngene. Mula kita kudu bisa misahake saben tembung.
    ar_eg: على السوشيال ميديا، تقريبًا كل الجاوي كده. عشان كده لازم نعرف نفصل كل كلمة.
    ar: على وسائل التواصل، معظم الجاوية هكذا تقريبًا، فعلينا أن نميّز كلّ كلمة.
    en: On social media, almost all Javanese is like this. So we need to tell every word apart.
  - speaker: Mbak Sekar
    text: Museum iki nduwe sepur uap lawas. Akeh wong foto-foto lan posting. Ayo maca komentare!
    ar_eg: المتحف ده فيه قطورات بخار قديمة. ناس كتير بتتصوّر وتنزّل بوستات. يلّا نقرا التعليقات!
    ar: في المتحف قطارات بخارية قديمة، يتصوّر كثيرون وينشرون. هيّا نقرأ التعليقات!
    en: The museum has old steam trains. Lots of people take photos and post. Let's read the comments!
- kind: dialogue
  title: Komentar TikTok
  lines:
  - speaker: Mas Danang
    text: 'Iki video TikTok saka museum. Komentar pisanan: "Keren pol, gaes! Pengen mrono!"'
    ar_eg: 'ده فيديو تيك توك من المتحف. أوّل تعليق: «جامد موت يا جماعة! نفسي أروح هناك!»'
    ar: 'هذا فيديو تيك توك من المتحف. أوّل تعليق: «رائع للغاية يا شباب! أريد الذهاب إلى هناك!»'
    en: 'Here''s a TikTok video from the museum. First comment: "Super cool, guys! Wanna go there!"'
  - speaker: Mbak Sekar
    text: Ayo dipisah. "Keren" Indonesia. "Pol" Jawa. "Gaes" iku "guys" Inggris, ditulis cara Indonesia.
    ar_eg: يلّا نفصّلها. «keren» إندونيسي. «pol» جاوي. «gaes» هي «guys» الإنجليزي مكتوبة بطريقة إندونيسية.
    ar: لنفصّلها. «keren» إندونيسية، و«pol» جاوية، و«gaes» هي «guys» الإنجليزية مكتوبة على الطريقة الإندونيسية.
    en: Let's split it. "Keren" Indonesian. "Pol" Javanese. "Gaes" is English "guys", spelled the Indonesian way.
  - speaker: Mas Danang
    text: '"Pengen" iku Jawa lan Indonesia gaul. "Mrono" iku Jawa, tegese "menyang kana".'
    ar_eg: «pengen» جاوي وإندونيسي عامّي. «mrono» جاوي، معناها «لهناك».
    ar: «pengen» جاوية وإندونيسية عامّية، و«mrono» جاوية تعني «إلى هناك».
    en: '"Pengen" is Javanese and slangy Indonesian. "Mrono" is Javanese, meaning "to there".'
  - speaker: Mbak Sekar
    text: 'Komentar kapindho: "Sepure masih jalan ta? Aku mau naik!"'
    ar_eg: 'التعليق التاني: «القطر لسّه شغّال؟ أنا عايز أركب!»'
    ar: 'التعليق الثاني: «هل ما زال القطار يعمل؟ أريد أن أركب!»'
    en: 'Second comment: "Does the train still run? I want a ride!"'
  - speaker: Mas Danang
    text: '"Sepure" Jawa, "masih jalan" Indonesia, "ta" Jawa, "mau naik" Indonesia. Campur kabeh!'
    ar_eg: «sepure» جاوي، «masih jalan» إندونيسي، «ta» جاوي، «mau naik» إندونيسي. كلّه متلخبط!
    ar: «sepure» جاوية، و«masih jalan» إندونيسية، و«ta» جاوية، و«mau naik» إندونيسية. خليط كامل!
    en: '"Sepure" Javanese, "masih jalan" Indonesian, "ta" Javanese, "mau naik" Indonesian. All mixed!'
  - speaker: Mbak Sekar
    text: 'Lan wangsulane admin: "Isih, Kak! Sepur wisata mlaku saben akhir minggu."'
    ar_eg: 'وردّ الأدمن: «أيوه لسّه! قطر سياحي بيمشي كل ويك إند.»'
    ar: 'وردّ المشرف: «نعم ما زال! قطار سياحيّ يسير كلّ نهاية أسبوع.»'
    en: 'And the admin''s reply: "It does, Kak! A tourist train runs every weekend."'
    note:
      ar_eg: متحف أمباراوا فيه قطر بخار سياحي، وكمان قطر بسنّة (rack railway) بيطلع الجبل. المواعيد بتتغيّر، فاتأكّد قبل ما تروح.
      ar: في متحف أمباراوا قطار بخاريّ سياحيّ وقطار مسنّن يصعد الجبل، والمواعيد تتغيّر فتأكّد قبل الذهاب.
      en: Ambarawa runs a tourist steam train and a rack railway up the hill; schedules change, so check before going.
  - speaker: Mas Danang
    text: 'Komentar katelu, saka Mas Yudha: "Wkwkwk, HP-ne Mas Danang kok burem fotone?"'
    ar_eg: 'التعليق التالت، من ماس يودا: «ههههه، الموبايل بتاع ماس دانانج صوره مغبّشة كده ليه؟»'
    ar: 'التعليق الثالث من ماس يودا: «ههههه، لماذا صور هاتف ماس دانانغ ضبابية؟»'
    en: 'Third comment, from Mas Yudha: "LOL, how come Mas Danang''s phone photos are so blurry?"'
  - speaker: Mbak Sekar
    text: Hahaha! "Wkwkwk" iku ngguyu ing chat. "HP-ne", HP Indonesia plus "-ne" Jawa.
    ar_eg: ههههه! «wkwkwk» يعني ضحك في الشات. «HP-ne»، كلمة HP الإندونيسي زائد «-ne» الجاوي.
    ar: 'ههههه! «wkwkwk» ضحك في الدردشة. و«HP-ne»: HP الإندونيسية زائد «-ne» الجاوية.'
    en: Hahaha! "Wkwkwk" is laughing in chats. "HP-ne", Indonesian HP plus Javanese "-ne".
  - speaker: Mas Danang
    text: Waduh, Yudha! Fotone ora burem, kameraku sing lawas, kaya sepure!
    ar_eg: يا خبر يا يودا! الصور مش مغبّشة، الكاميرا بتاعتي هي اللي قديمة، زي القطر!
    ar: يا يودا! الصور ليست ضبابية، كاميرتي هي القديمة، مثل القطار!
    en: Oh come on, Yudha! The photos aren't blurry, my camera's just old, like the train!
- kind: word_spotlight
  title: Campur kode
  lines:
  - speaker: Mbak Sekar
    text: 'Campur kode: nyampur basa ing ukara siji. Iki biasa, dudu salah.'
    ar_eg: 'خلط اللغات: إنك تخلط لغات في جملة واحدة. ده عادي، مش غلط.'
    ar: 'خلط اللغات: مزج اللغات في جملة واحدة. هذا عاديّ لا خطأ.'
    en: 'Code-mixing: mixing languages in one sentence. Normal, not a mistake.'
  - speaker: Mas Danang
    text: Dishare, dilike, dikomen. Kriya Inggris, ater-ater Jawa lan Indonesia di-.
    ar_eg: dishare، dilike، dikomen. فعل إنجليزي، وسابقة di- جاوي وإندونيسي.
    ar: 'dishare وdilike وdikomen: فعل إنجليزيّ وسابقة di- جاوية وإندونيسية.'
    en: Dishare, dilike, dikomen. English verbs, Javanese and Indonesian prefix di-.
    note:
      ar_eg: زي ما بنقول بالمصري «اتشيّر» و«عمل لايك» - نفس الفكرة بالظبط!
      ar: كما نقول بالمصرية «اتشيّر» و«عمل لايك» - الفكرة نفسها تمامًا!
      en: Like Egyptians say "etshayyar" and "3amal like" - exactly the same idea!
  - speaker: Mbak Sekar
    text: Postingan, caption, komentar, viral. Lan Reader ing Kabar bisa nandhai basa saben tembung!
    ar_eg: بوست، كابشن، تعليق، اتنشر. والقارئ في كبار بيقدر يعلّم لغة كل كلمة!
    ar: منشور، تعليق مصاحب، تعليق، انتشر. وقارئ «كبار» يستطيع وسم لغة كلّ كلمة!
    en: Post, caption, comment, viral. And Kabar's Reader can tag each word's language!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Keren pol!
    ar_eg: جامد موت!
    ar: رائع للغاية!
    en: Super cool!
  - speaker: Mas Danang
    text: Keren pol!
    ar_eg: جامد موت!
    ar: رائع للغاية!
    en: Super cool!
  - speaker: Mbak Sekar
    text: Pengen mrono!
    ar_eg: نفسي أروح هناك!
    ar: أريد الذهاب إلى هناك!
    en: Wanna go there!
  - speaker: Mas Danang
    text: Pengen mrono!
    ar_eg: نفسي أروح هناك!
    ar: أريد الذهاب إلى هناك!
    en: Wanna go there!
  - speaker: Mbak Sekar
    text: Postinganmu dishare atusan wong.
    ar_eg: البوست بتاعك اتشيّر من مئات.
    ar: شارك منشورك المئات.
    en: Your post was shared by hundreds.
  - speaker: Mas Danang
    text: Postinganmu dishare atusan wong.
    ar_eg: البوست بتاعك اتشيّر من مئات.
    ar: شارك منشورك المئات.
    en: Your post was shared by hundreds.
  - speaker: Mbak Sekar
    text: HP-ne lawas.
    ar_eg: الموبايل قديم.
    ar: الهاتف قديم.
    en: The phone is old.
  - speaker: Mas Danang
    text: HP-ne lawas.
    ar_eg: الموبايل قديم.
    ar: الهاتف قديم.
    en: The phone is old.
  - speaker: Mbak Sekar
    text: Isih, saben akhir minggu.
    ar_eg: لسّه، كل ويك إند.
    ar: ما زال، كلّ نهاية أسبوع.
    en: Still, every weekend.
  - speaker: Mas Danang
    text: Isih, saben akhir minggu.
    ar_eg: لسّه، كل ويك إند.
    ar: ما زال، كلّ نهاية أسبوع.
    en: Still, every weekend.
  - speaker: Mbak Sekar
    text: 'Siji maneh, pesen saka grup kanca: "OTW, sabar ya. HP-ku lowbat."'
    ar_eg: 'كمان رسالة من جروب الصحاب: «في السكّة، اصبروا. موبايلي فاصل شحن.»'
    ar: 'ورسالة أخرى من مجموعة الأصدقاء: «في الطريق، اصبروا. هاتفي فرغت بطاريته.»'
    en: 'One more, a message from a friends'' group: "OTW, be patient. My phone''s on low battery."'
  - speaker: Mas Danang
    text: 'Lan wangsulane: "Gpp, kabari ing grup yen wis teka." Keren, cekak banget!'
    ar_eg: 'والردّ: «ولا يهمّك، قول في الجروب لمّا توصل.» جامد، قصيّرة أوي!'
    ar: 'والردّ: «لا بأس، أخبرنا في المجموعة حين تصل.» رائع، قصير جدًّا!'
    en: 'And the reply: "No worries, let the group know when you arrive." Cool, so short!'
    note:
      ar_eg: OTW = on the way. lowbat = البطارية قرّبت تخلص. gpp = ga papa (زي ra papa)، ولا يهمّك. kabari = بلّغني.
      ar: OTW = في الطريق. lowbat = بطارية منخفضة. gpp = ga papa (مثل ra papa) أي لا بأس. kabari = أخبِرني.
      en: OTW = on the way. Lowbat = low battery. Gpp = ga papa (like ra papa), no worries. Kabari = let me know.
- kind: outro
  title: Caption Mas Mohamed
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, tulisen caption Instagram babagan foto sampeyan, nganggo campur kode. Jawa, Indonesia, lan Inggris!
    ar_eg: يا ماس محمد، اكتب كابشن إنستجرام لصورة ليك، بخلط اللغات. جاوي وإندونيسي وإنجليزي!
    ar: 'يا ماس محمد، اكتب تعليقًا على إنستغرام لصورتك بخلط اللغات: جاوية وإندونيسية وإنجليزية!'
    en: Mas Mohamed, write an Instagram caption for your photo, code-mixed. Javanese, Indonesian and English!
    note:
      ar_eg: 'دورك! وبعدين علّم كل كلمة: جاوي، إندونيسي، ولّا إنجليزي. وجرّب «Screenshot Decoder» في الدرس.'
      ar: 'دورك! ثمّ علّم كلّ كلمة: جاوية أم إندونيسية أم إنجليزية. وجرّب «Screenshot Decoder» في الدرس.'
      en: 'Your turn! Then tag every word: Javanese, Indonesian or English. And try the Screenshot Decoder in the lesson.'
  - speaker: Mbak Sekar
    text: 'Contone: Dolan neng piramida, panase pol, but worth it!'
    ar_eg: 'مثلًا: فسحة عند الأهرامات، الحرّ على الآخر، but worth it!'
    ar: 'مثلًا: نزهة عند الأهرامات، الحرّ شديد، but worth it!'
    en: 'For example: Visiting the pyramids, scorching hot, but worth it!'
  - speaker: Mas Danang
    text: PR-mu, rungokna voice note saka Mas Yudha ing pelajaran, lan tandhai basa saben tembung.
    ar_eg: واجبك، اسمع فويس نوت ماس يودا في الدرس، وعلّم لغة كل كلمة.
    ar: 'واجبك: استمع إلى رسالة ماس يودا الصوتية في الدرس وعلّم لغة كلّ كلمة.'
    en: 'Your homework: listen to Mas Yudha''s voice note in the lesson and tag each word''s language.'
  - speaker: Mbak Sekar
    text: Sesuk kita dhateng Kudus, maca cerkak. Nganti pinanggih malih!
    ar_eg: بكرة رايحين قدس، نقرا قصّة قصيّرة. إلى اللقاء!
    ar: غدًا نذهب إلى قدس لنقرأ قصّة قصيرة. إلى اللقاء!
    en: Tomorrow we go to Kudus to read a short story. Until next time!
