segments:
- kind: intro
  title: Masjid Agung Demak
  lines:
  - speaker: Mbak Sekar
    text: Sugeng sonten saking Masjid Agung Demak, salah sijine masjid paling tuwa ing Jawa. Kula Sekar.
    ar_eg: مساء الخير من جامع ديماك الكبير، من أقدم الجوامع في جاوة. أنا سيكار.
    ar: مساء الخير من مسجد ديماك الكبير، من أقدم مساجد جاوة. أنا سيكار.
    en: Good evening from the Demak Great Mosque, one of the oldest mosques in Java. I'm Sekar.
    note:
      ar_eg: جامع ديماك اتبنى أيّام أوّل سلطنة إسلامية في جاوة، وبتحكي الحكايات إن الأولياء التسعة (Wali Sanga) اشتركوا في بنائه.
      ar: بُني مسجد ديماك أيّام أوّل سلطنة إسلامية في جاوة، وتروي الحكايات أنّ الأولياء التسعة شاركوا في بنائه.
      en: The Demak mosque dates from Java's first Islamic sultanate; tradition says the Wali Sanga helped build it.
  - speaker: Mas Danang
    text: Aku Danang. Dina iki dolan adoh sing pungkasan, neng pesisir lor. Lan temane... musik!
    ar_eg: أنا دانانج. النهارده آخر رحلة بعيدة، على الساحل الشمالي. والموضوع... موسيقى!
    ar: أنا دانانغ. اليوم آخر رحلة بعيدة، على الساحل الشمالي، والموضوع... الموسيقى!
    en: I'm Danang. Today is our last day trip, to the north coast. And the theme is... music!
  - speaker: Mbak Sekar
    text: Para wali nggunakake tembang kanggo mulang Islam. Tembang sing paling misuwur yaiku Lir-ilir, saka Sunan Kalijaga.
    ar_eg: الأولياء استخدموا الأغاني عشان يعلّموا الإسلام. وأشهر أغنية «Lir-ilir»، بتاعة سونان كاليجاجا.
    ar: استعمل الأولياء الأغاني لتعليم الإسلام، وأشهرها «Lir-ilir» المنسوبة إلى سونان كاليجاغا.
    en: The wali used songs to teach Islam. The most famous is Lir-ilir, from Sunan Kalijaga.
  - speaker: Mas Danang
    text: Lan saiki bocah-bocah isih nyanyi Lir-ilir ing sekolah! Wis atusan taun.
    ar_eg: ولحدّ دلوقتي العيال لسّه بيغنّوا «Lir-ilir» في المدرسة! بقالها مئات السنين.
    ar: وما زال الأطفال يغنّون «Lir-ilir» في المدرسة حتى اليوم، منذ مئات السنين!
    en: And kids still sing Lir-ilir at school today! For hundreds of years.
    note:
      ar_eg: "كلمات: nyanyi = يغني."
      ar: "مفردات: nyanyi = يغنّي."
      en: "Words: nyanyi = to sing."
- kind: dialogue
  title: Tegese tembang
  lines:
  - speaker: Mas Danang
    text: Sekar, aku seneng campursari. Nanging aku ora tau ngerti tegese tembange, hehe.
    ar_eg: يا سيكار، أنا بحبّ الكامبورساري. بس عمري ما فهمت معنى الأغاني، هههه.
    ar: يا سيكار، أحبّ الكامبورساري لكنّي لم أفهم معاني أغانيه قطّ، هههه.
    en: Sekar, I love campursari. But I never understood the lyrics, hehe.
    note:
      ar_eg: campursari = موسيقى شعبية بتخلط الجاملان مع آلات حديثة زي الكيبورد. أغانيها غالبًا عن الحبّ والشوق.
      ar: campursari = موسيقى شعبية تمزج الغاملان بآلات حديثة كالأورغ، وأغانيها غالبًا عن الحبّ والحنين.
      en: Campursari = popular music mixing gamelan with modern instruments like keyboard. Songs are mostly about love and longing.
  - speaker: Mbak Sekar
    text: Gampang. Tembung-tembunge biasane padha. Ati, tresna, kangen, lunga, bali, udan.
    ar_eg: سهلة. الكلمات غالبًا هي هي. القلب، الحبّ، الشوق، السفر، الرجوع، المطر.
    ar: 'سهل. الكلمات غالبًا هي نفسها: القلب، الحبّ، الحنين، الرحيل، العودة، المطر.'
    en: Easy. The words are usually the same. Heart, love, longing, leaving, returning, rain.
  - speaker: Mas Danang
    text: Udan? Kok udan?
    ar_eg: مطر؟ ليه مطر؟
    ar: المطر؟ لماذا المطر؟
    en: Rain? Why rain?
  - speaker: Mbak Sekar
    text: Merga ing tembang Jawa, udan iku asring tandha sedhih utawa kangen. Kaya "udan ing ati".
    ar_eg: عشان في الأغاني الجاوي، المطر غالبًا علامة حزن أو شوق. زي «مطر في القلب».
    ar: لأنّ المطر في الأغاني الجاوية غالبًا علامة حزن أو حنين، مثل «مطر في القلب».
    en: Because in Javanese songs, rain often means sadness or longing. Like "rain in the heart".
  - speaker: Mas Danang
    text: Wah, puitis. Lan "kangen"?
    ar_eg: يا سلام، شاعري. و«kangen»؟
    ar: ما أشعره. و«kangen»؟
    en: Wow, poetic. And "kangen"?
  - speaker: Mbak Sekar
    text: Kangen iku "rindu". Aku kangen kowe. Aku kangen omah.
    ar_eg: kangen يعني «وحشني». وحشتني. وحشني البيت.
    ar: kangen تعني «الحنين». أشتاق إليك. أشتاق إلى البيت.
    en: Kangen is "rindu", missing someone. I miss you. I miss home.
  - speaker: Mas Danang
    text: Lan Lir-ilir? Tegese apa?
    ar_eg: و«Lir-ilir»؟ معناها إيه؟
    ar: و«Lir-ilir»؟ ما معناها؟
    en: And Lir-ilir? What does it mean?
  - speaker: Mbak Sekar
    text: Lir-ilir iku ngajak wong tangi, kaya tanduran sing wiwit tuwuh ijo. Tegese ngajak uripe dadi luwih apik.
    ar_eg: «Lir-ilir» بتنادي الناس يصحوا، زي الزرع اللي ابتدى يطلع أخضر. معناها دعوة إن الحياة تبقى أحسن.
    ar: «Lir-ilir» تدعو الناس إلى اليقظة، كالزرع الذي بدأ يخضرّ. أي دعوة لتصير الحياة أفضل.
    en: Lir-ilir calls people to wake up, like plants starting to grow green. It invites you to make your life better.
    note:
      ar_eg: «Lir-ilir» بتستخدم صور من الريف (زرع أخضر، عيال بتطلع على شجرة) عشان تتكلّم عن الإيمان والعمل الصالح - بطريقة الأولياء.
      ar: تستعمل «Lir-ilir» صور الريف (زرع أخضر، أطفال يتسلّقون شجرة) للحديث عن الإيمان والعمل الصالح - على طريقة الأولياء.
      en: Lir-ilir uses village images (green shoots, children climbing a tree) to talk about faith and good deeds - the wali's way.
  - speaker: Mas Danang
    text: Apik banget. Dadi tembang iku kaya pengajian sing bisa dinyanyekake.
    ar_eg: حلو أوي. يعني الأغنية زي درس دين بيتغنّى.
    ar: جميل جدًّا. فالأغنية كدرس دينيّ يُغنّى.
    en: Beautiful. So a song is like a religious lesson you can sing.
  - speaker: Mbak Sekar
    text: Leres. Lan macapat, puisi Jawa lawas, uga ditembangake kanthi aturan khusus.
    ar_eg: صحّ. والماكاپات، الشعر الجاوي القديم، كمان بيتغنّى بقواعد مخصوصة.
    ar: صحيح. والماكابات، الشعر الجاويّ القديم، يُغنّى أيضًا بقواعد خاصّة.
    en: Right. And macapat, old Javanese poetry, is also sung with special rules.
    note:
      ar_eg: "كلمات: aturan = قانون، قاعدة."
      ar: "مفردات: aturan = قاعدة، نظام."
      en: "Words: aturan = rule, regulation."
- kind: word_spotlight
  title: Tembung tembang
  lines:
  - speaker: Mas Danang
    text: Ati iku 'hati'. Tresna iku 'cinta'. Kangen iku 'rindu'.
    ar_eg: 'ati: قلب. tresna: حبّ. kangen: شوق.'
    ar: 'ati: قلب، وtresna: حبّ، وkangen: حنين.'
    en: 'Ati: heart. Tresna: love. Kangen: longing.'
    note:
      ar_eg: "كلمات: cinta = حب."
      ar: "مفردات: cinta = حبّ."
      en: "Words: cinta = love."
  - speaker: Mbak Sekar
    text: 'Macapat duwe aturan: cacahing larik, cacahing wanda, lan swara pungkasan saben larik.'
    ar_eg: 'الماكاپات ليها قواعد: عدد السطور، وعدد المقاطع، والصوت في آخر كل سطر.'
    ar: 'للماكابات قواعد: عدد الأسطر وعدد المقاطع والصوت في آخر كلّ سطر.'
    en: 'Macapat has rules: the number of lines, the syllables, and the final vowel of each line.'
    note:
      ar_eg: زي بحور الشعر العربي! كل نوع ماكاپات (زي Pocung وMaskumambang) ليه وزن ثابت.
      ar: مثل بحور الشعر العربيّ! لكلّ نوع ماكابات (مثل Pocung وMaskumambang) وزن ثابت.
      en: Like Arabic metres! Each macapat form (such as Pocung or Maskumambang) has a fixed pattern.
  - speaker: Mas Danang
    text: Lan "Gundul-gundul pacul" lan "Sluku-sluku bathok", tembang dolanan bocah. Ana ing pelajaran!
    ar_eg: و«Gundul-gundul pacul» و«Sluku-sluku bathok»، أغاني لعب العيال. موجودين في الدرس!
    ar: و«Gundul-gundul pacul» و«Sluku-sluku bathok»، أغاني ألعاب الأطفال. في الدرس!
    en: And "Gundul-gundul pacul" and "Sluku-sluku bathok", children's play songs. They're in the lessons!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Aku kangen omah.
    ar_eg: وحشني البيت.
    ar: أشتاق إلى البيت.
    en: I miss home.
  - speaker: Mas Danang
    text: Aku kangen omah.
    ar_eg: وحشني البيت.
    ar: أشتاق إلى البيت.
    en: I miss home.
  - speaker: Mbak Sekar
    text: Tresnaku ora bakal ilang.
    ar_eg: حبّي مش هيروح.
    ar: لن يزول حبّي.
    en: My love won't fade.
  - speaker: Mas Danang
    text: Tresnaku ora bakal ilang.
    ar_eg: حبّي مش هيروح.
    ar: لن يزول حبّي.
    en: My love won't fade.
  - speaker: Mbak Sekar
    text: Udan ing ati.
    ar_eg: مطر في القلب.
    ar: مطر في القلب.
    en: Rain in the heart.
  - speaker: Mas Danang
    text: Udan ing ati.
    ar_eg: مطر في القلب.
    ar: مطر في القلب.
    en: Rain in the heart.
  - speaker: Mbak Sekar
    text: Tembang iki saka Sunan Kalijaga.
    ar_eg: الأغنية دي من سونان كاليجاجا.
    ar: هذه الأغنية من سونان كاليجاغا.
    en: This song is from Sunan Kalijaga.
  - speaker: Mas Danang
    text: Tembang iki saka Sunan Kalijaga.
    ar_eg: الأغنية دي من سونان كاليجاجا.
    ar: هذه الأغنية من سونان كاليجاغا.
    en: This song is from Sunan Kalijaga.
  - speaker: Mbak Sekar
    text: Bocah-bocah isih nyanyi Lir-ilir.
    ar_eg: العيال لسّه بيغنّوا «Lir-ilir».
    ar: ما زال الأطفال يغنّون «Lir-ilir».
    en: Children still sing Lir-ilir.
  - speaker: Mas Danang
    text: Bocah-bocah isih nyanyi Lir-ilir.
    ar_eg: العيال لسّه بيغنّوا «Lir-ilir».
    ar: ما زال الأطفال يغنّون «Lir-ilir».
    en: Children still sing Lir-ilir.
- kind: outro
  title: Tembange Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, ngertia lagu Mesir sing sampeyan senengi. Critakna tegese nganggo basa Jawa. Nganggo ati, tresna, utawa kangen.
    ar_eg: يا ماس محمد، فكّر في أغنية مصرية بتحبّها. احكي معناها بالجاوي. استخدم ati أو tresna أو kangen.
    ar: يا ماس محمد، فكّر في أغنية مصرية تحبّها، واشرح معناها بالجاوية مستعملًا ati أو tresna أو kangen.
    en: Mas Mohamed, think of an Egyptian song you love. Describe its meaning in Javanese. Use ati, tresna or kangen.
    note:
      ar_eg: دورك! جملتين. مثلًا عن أغنية لأمّ كلثوم أو أغنية عن الوطن.
      ar: دورك! جملتان. مثلًا عن أغنية لأمّ كلثوم أو أغنية وطنية.
      en: Your turn! Two sentences. For example about an Umm Kulthum song or a song about home.
  - speaker: Mas Danang
    text: 'Contone: Tembang iki babagan wong sing kangen Mesir. Atine sedhih, nanging tresnane gedhe.'
    ar_eg: 'مثلًا: الأغنية دي عن واحد وحشته مصر. قلبه حزين، بس حبّه كبير.'
    ar: 'مثلًا: هذه الأغنية عن رجل يحنّ إلى مصر. قلبه حزين لكنّ حبّه كبير.'
    en: 'For example: This song is about someone who misses Egypt. His heart is sad, but his love is big.'
  - speaker: Mbak Sekar
    text: PR-mu, rungokna Lir-ilir ing pelajaran, lan golekana tembung sing sampeyan ngerti.
    ar_eg: واجبك، اسمع «Lir-ilir» في الدرس، ودوّر على الكلمات اللي بتعرفها.
    ar: 'واجبك: استمع إلى «Lir-ilir» في الدرس وابحث عن الكلمات التي تعرفها.'
    en: 'Your homework: listen to Lir-ilir in the lesson and find the words you know.'
  - speaker: Mas Danang
    text: Matur nuwun, Demak! Pamit, Madiun! Sesuk kita bali menyang Jogja, neng Kotagede, sinau aksara Jawa! Nganti pinanggih malih!
    ar_eg: شكرًا يا ديماك! مع السلامة يا ماديون! بكرة راجعين جوجا، لكوتاجيدي، نتعلّم الحروف الجاوي! إلى اللقاء!
    ar: شكرًا يا ديماك! وداعًا يا ماديون! غدًا نعود إلى جوغجا، إلى كوتاغيدي، لنتعلّم الحروف الجاوية! إلى اللقاء!
    en: Thank you, Demak! Goodbye, Madiun! Tomorrow we head back to Jogja, to Kotagede, to learn the Javanese script! Until next time!
    note:
      ar_eg: "كلمات: aksara = حرف، أبجدية."
      ar: "مفردات: aksara = حرف، أبجدية."
      en: "Words: aksara = letter, script."
