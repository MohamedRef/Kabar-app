review:
  status: draft
  verified: false
  notes: Song vocabulary and Lir-ilir (attributed to Sunan Kalijaga, as tradition holds) at the Demak Great Mosque. Lyrics are not quoted beyond the title line "Lir-ilir, lir-ilir" to stay clear of reproducing long texts; meaning is paraphrased.
