segments:
- kind: intro
  title: Madiun
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saka Madiun! Kabar Radio wis pindhah saka Jogja. Aku Sekar.
    ar_eg: صباح الخير من ماديون! كبار راديو نقل من يوجيا. أنا سيكار.
    ar: صباح الخير من ماديون! انتقل كبار راديو من يوغيا. أنا سيكار.
    en: Good morning from Madiun! Kabar Radio has moved from Yogyakarta. I'm Sekar.
    note:
      ar_eg: "كلمات: pindhah = ينقل (من مكان لمكان)."
      ar: "مفردات: pindhah = ينتقل."
      en: "Words: pindhah = move (house, school)."
  - speaker: Mas Danang
    text: Aku Danang. Madiun iki kuthaku! Saiki aku sing dadi tuan rumah, hehe.
    ar_eg: أنا دانانج. ماديون دي بلدي! دلوقتي أنا اللي صاحب البيت، هههه.
    ar: أنا دانانغ. ماديون مدينتي! الآن أنا المضيف، هههه.
    en: I'm Danang. Madiun is my town! Now I'm the one hosting, hehe.
    note:
      ar_eg: "ماديون في غرب جاوة الشرقية، والجاوي بتاعها «Mataraman» - زي جاوي يوجيا بالظبط تقريبًا. كلمات: dadi = يبقى / يطلع."
      ar: "تقع ماديون غرب جاوة الشرقية، وجاويّتها «Mataraman» تكاد تطابق جاوية يوغيا. مفردات: dadi = يصير / يساوي."
      en: "Madiun is in western East Java; its Javanese is Mataraman, almost the same as Yogya speech. Words: dadi = to become, come to (jadi)."
  - speaker: Mbak Sekar
    text: Kita lagi lungguh ing ngarep warunge Pak Budi. Anake, Sari, saiki sinau ing Kairo!
    ar_eg: إحنا قاعدين قدّام مطعم پاك بودي. بنته ساري بتدرس دلوقتي في القاهرة!
    ar: نجلس أمام مطعم باك بودي. وابنته ساري تدرس الآن في القاهرة!
    en: We're sitting outside Pak Budi's warung. His daughter Sari is studying in Cairo now!
  - speaker: Mas Danang
    text: Dina iki kita sinau jeneng kulawarga, lan carane ngomong "duweke sapa".
    ar_eg: النهارده هنتعلّم أسامي العيلة، وإزّاي نقول «بتاع مين».
    ar: اليوم نتعلّم أسماء أفراد العائلة، وكيف نقول «ملك من».
    en: Today we learn family words, and how to say whose something is.
    note:
      ar_eg: "كلمات: carane = الطريقة، إزاي؛ dina = يوم، نهار."
      ar: "مفردات: carane = الطريقة، كيفية؛ dina = يوم."
      en: "Words: carane = the way (to), how; dina = day."
- kind: dialogue
  title: Foto kulawarga
  lines:
  - speaker: Mas Danang
    text: Sekar, iki foto kulawargamu? Sapa iki?
    ar_eg: يا سيكار، دي صورة عيلتك؟ مين ده؟
    ar: يا سيكار، أهذه صورة عائلتك؟ من هذا؟
    en: Sekar, is this your family photo? Who's this?
  - speaker: Mbak Sekar
    text: Iku bapakku. Sing ngadeg ing sandhinge iku ibuku.
    ar_eg: ده أبويا. واللي واقفة جنبه دي أمّي.
    ar: هذا أبي. والواقفة بجانبه أمّي.
    en: That's my dad. The one standing next to him is my mum.
  - speaker: Mas Danang
    text: Lan bocah lanang cilik iki?
    ar_eg: والولد الصغيّر ده؟
    ar: وهذا الولد الصغير؟
    en: And this little boy?
    note:
      ar_eg: "كلمات: cilik = صغير؛ lanang = ذكر؛ anak lanang = ابن."
      ar: "مفردات: cilik = صغير؛ lanang = ذكر؛ anak lanang = ابن."
      en: "Words: cilik = small, little = kecil; lanang = male; anak lanang = son = laki-laki."
  - speaker: Mbak Sekar
    text: Iku adhiku, Bagas. Saiki wis SMA. Lan sing nganggo kacamata iku mbakyuku.
    ar_eg: ده أخويا الصغيّر، باجاس. دلوقتي في ثانوي. واللي لابسة نضّارة دي أختي الكبيرة.
    ar: هذا أخي الأصغر باغاس، وهو الآن في الثانوية. والتي تلبس النظّارة أختي الكبرى.
    en: That's my little brother, Bagas. He's in high school now. And the one in glasses is my big sister.
    note:
      ar_eg: "adhi = أخ أو أخت أصغر (من غير فرق). mas = أخ كبير، mbakyu = أخت كبيرة. الجاوي بيهتمّ مين أكبر أكتر من ولد ولّا بنت. كلمات: nganggo = بـ / بيستخدم."
      ar: "adhi = أخ أو أخت أصغر دون تمييز. mas = أخ أكبر، mbakyu = أخت كبرى. تهتمّ الجاوية بمن الأكبر أكثر من الجنس. مفردات: nganggo = بـ / يستعمل."
      en: "adhi = younger sibling (either sex). mas = older brother, mbakyu = older sister. Javanese cares more about who is older than about gender. Words: nganggo = with, using (pakai)."
  - speaker: Mas Danang
    text: Wong tuwa loro ing mburi iki sapa?
    ar_eg: والاتنين الكبار اللي ورا دول مين؟
    ar: ومن هذان المسنّان في الخلف؟
    en: Who are the two older people at the back?
  - speaker: Mbak Sekar
    text: Iku simbahku. Simbah kakung lan simbah putri. Omahe ing desa, cedhak sawah.
    ar_eg: دول جدّي وجدّتي. simbah kakung وsimbah putri. بيتهم في القرية، جنب الغيط.
    ar: هذان جدّي وجدّتي، simbah kakung وsimbah putri. بيتهما في القرية قرب حقول الأرز.
    en: Those are my grandparents. Grandpa and grandma. Their house is in the village, near the rice fields.
    note:
      ar_eg: "كلمات: desa = قرية، بلد؛ kakung = جدّ (mbah kakung)؛ putri = بنت؛ أميرة."
      ar: "مفردات: desa = قرية؛ kakung = جدّ (mbah kakung)؛ putri = ابنة؛ أميرة."
      en: "Words: desa = village; kakung = grandfather (mbah kakung); putri = daughter; princess; female."
  - speaker: Mas Danang
    text: Omahe! Pinter. Lan iki sapa, sing ngguyu banter?
    ar_eg: «omahe»! شاطرة. ومين ده اللي بيضحك بصوت عالي؟
    ar: «omahe»! أحسنتِ. ومن هذا الذي يضحك بصوت عالٍ؟
    en: Omahe! Clever. And who's this, laughing loudly?
    note:
      ar_eg: "كلمات: banter = سريع؛ صوت عالي؛ ngguyu = يضحك."
      ar: "مفردات: banter = سريع؛ صوت عالٍ؛ ngguyu = يضحك."
      en: "Words: banter = fast; loud; ngguyu = laugh."
  - speaker: Mbak Sekar
    text: Iku pakdhe, kangmase bapakku. Lan bojone, budhe, sing masak sega.
    ar_eg: ده عمّي الكبير، أخو أبويا الكبير. ومراته، اللي بتطبخ الرز.
    ar: هذا pakdhe، أخو أبي الأكبر. وزوجته budhe التي تطبخ الأرز.
    en: That's my pakdhe, my dad's older brother. And his wife, budhe, cooking the rice.
    note:
      ar_eg: "pakdhe / budhe = عمّ أو خال أكبر من بابا أو ماما (ومراته / جوزها). paklik / bulik = الأصغر. كلمات: masak = يطبخ."
      ar: "pakdhe / budhe = العمّ أو الخال الأكبر من الوالدين (وزوجه). paklik / bulik = الأصغر. مفردات: masak = يطبخ."
      en: "pakdhe / budhe = uncle / aunt older than your parent (and their spouse). paklik / bulik = younger. Words: masak = to cook."
  - speaker: Mas Danang
    text: Kulawargamu gedhe banget! Kaya kulawargane Pak Budi.
    ar_eg: عيلتك كبيرة أوي! زي عيلة پاك بودي.
    ar: عائلتك كبيرة جدًّا! مثل عائلة باك بودي.
    en: Your family is huge! Like Pak Budi's family.
    note:
      ar_eg: "كلمات: kaya = زي، كأنّ."
      ar: "مفردات: kaya = مثل."
      en: "Words: kaya = like, as = seperti."
  - speaker: Mbak Sekar
    text: Iya. Ing Jawa, kulawarga iku kabeh, nganti sedulur adoh.
    ar_eg: أيوه. في جاوة، العيلة يعني الكل، لحدّ القرايب البعاد.
    ar: نعم. في جاوة العائلة تعني الجميع، حتى الأقارب البعيدين.
    en: Yes. In Java, family means everyone, down to distant relatives.
    note:
      ar_eg: "كلمات: kabeh = كله / الكل (= semua)."
      ar: "مفردات: kabeh = الكل / جميع (= semua)."
      en: "Words: kabeh = all, everything (= semua)."
- kind: word_spotlight
  title: Omahe, bukune
  lines:
  - speaker: Mas Danang
    text: Ing basa Indonesia rumahnya. Ing basa Jawa omahe. Akhire -e.
    ar_eg: بالإندونيسي rumahnya. بالجاوي omahe. الآخر -e.
    ar: في الإندونيسية rumahnya، وفي الجاوية omahe. النهاية -e.
    en: In Indonesian rumahnya. In Javanese omahe. The ending is -e.
    note:
      ar_eg: "كلمات: e = اللاحقة -e."
      ar: "مفردات: e = اللاحقة -e."
      en: "Words: e = the suffix -e."
  - speaker: Mbak Sekar
    text: Yen tembunge pungkas aksara swara, dadi -ne. Bukune, sepedhane, klambine.
    ar_eg: لو الكلمة آخرها حرف متحرّك، تبقى -ne. bukune، sepedhane، klambine.
    ar: وإن انتهت الكلمة بصائت صارت -ne. bukune وsepedhane وklambine.
    en: If the word ends in a vowel, it's -ne. Bukune, sepedhane, klambine.
    note:
      ar_eg: "-e / -ne = بتاعه / بتاعها، وكمان «الـ» المعرّفة: omahe Pak Budi = بيت پاك بودي. كلمات: aksara = حرف، أبجدية."
      ar: "-e / -ne = ـه / ـها، وتعمل كأداة تعريف أيضًا: omahe Pak Budi = بيت باك بودي. مفردات: aksara = حرف، أبجدية."
      en: "-e / -ne = his / her, and also works like \"the\": omahe Pak Budi = Pak Budi's house. Words: aksara = letter, script."
  - speaker: Mas Danang
    text: Omahe Pak Budi, warunge Pak Budi, anake Pak Budi. Gampang!
    ar_eg: بيت پاك بودي، مطعم پاك بودي، بنت پاك بودي. سهلة!
    ar: بيت باك بودي، مطعم باك بودي، ابنة باك بودي. سهل!
    en: Pak Budi's house, Pak Budi's warung, Pak Budi's daughter. Easy!
  - speaker: Mbak Sekar
    text: Bapak lan ibu, utawa simbok ing desa. Mas, mbakyu, adhi. Pakdhe, budhe, paklik, bulik, simbah.
    ar_eg: bapak وibu، أو simbok في القرية. mas، mbakyu، adhi. pakdhe، budhe، paklik، bulik، simbah.
    ar: bapak وibu، أو simbok في القرية. mas وmbakyu وadhi. pakdhe وbudhe وpaklik وbulik وsimbah.
    en: Bapak and ibu, or simbok in the village. Mas, mbakyu, adhi. Pakdhe, budhe, paklik, bulik, simbah.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Iku bapakku lan ibuku.
    ar_eg: دول أبويا وأمّي.
    ar: هذان أبي وأمّي.
    en: That's my dad and my mum.
  - speaker: Mas Danang
    text: Iku bapakku lan ibuku.
    ar_eg: دول أبويا وأمّي.
    ar: هذان أبي وأمّي.
    en: That's my dad and my mum.
  - speaker: Mbak Sekar
    text: Adhiku isih sekolah.
    ar_eg: أخويا الصغيّر لسّه في المدرسة.
    ar: أخي الأصغر ما زال في المدرسة.
    en: My younger sibling is still at school.
    note:
      ar_eg: "كلمات: sekolah = مدرسة؛ يدرس."
      ar: "مفردات: sekolah = مدرسة."
      en: "Words: sekolah = school; to go to school = sekolah."
  - speaker: Mas Danang
    text: Adhiku isih sekolah.
    ar_eg: أخويا الصغيّر لسّه في المدرسة.
    ar: أخي الأصغر ما زال في المدرسة.
    en: My younger sibling is still at school.
  - speaker: Mbak Sekar
    text: Omahe simbah ing desa.
    ar_eg: بيت جدّي في القرية.
    ar: بيت جدّي في القرية.
    en: Grandpa's house is in the village.
  - speaker: Mas Danang
    text: Omahe simbah ing desa.
    ar_eg: بيت جدّي في القرية.
    ar: بيت جدّي في القرية.
    en: Grandpa's house is in the village.
  - speaker: Mbak Sekar
    text: Iki warunge Pak Budi.
    ar_eg: ده مطعم پاك بودي.
    ar: هذا مطعم باك بودي.
    en: This is Pak Budi's warung.
  - speaker: Mas Danang
    text: Iki warunge Pak Budi.
    ar_eg: ده مطعم پاك بودي.
    ar: هذا مطعم باك بودي.
    en: This is Pak Budi's warung.
  - speaker: Mbak Sekar
    text: Pakdhe iku kangmase bapakku.
    ar_eg: عمّي الكبير ده أخو أبويا الكبير.
    ar: عمّي الأكبر هو أخو أبي الأكبر.
    en: Pakdhe is my dad's older brother.
  - speaker: Mas Danang
    text: Pakdhe iku kangmase bapakku.
    ar_eg: عمّي الكبير ده أخو أبويا الكبير.
    ar: عمّي الأكبر هو أخو أبي الأكبر.
    en: Pakdhe is my dad's older brother.
- kind: outro
  title: Kulawargane Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki critakna kulawargamu. Bapakmu, ibumu, lan sedulurmu.
    ar_eg: يا ماس محمد، دلوقتي احكيلنا عن عيلتك. أبوك وأمّك وإخواتك.
    ar: يا ماس محمد، حدّثنا الآن عن عائلتك. أبوك وأمّك وإخوتك.
    en: Mas Mohamed, now tell us about your family. Your dad, your mum, your siblings.
    note:
      ar_eg: "دورك! تلات جمل على الأقل، وواحدة فيها -e أو -ne. كلمات: critakna = احكيها (أمر)."
      ar: "دورك! ثلاث جمل على الأقلّ، إحداها فيها -e أو -ne. مفردات: critakna = احكِها (أمر)."
      en: "Your turn! At least three sentences, one with -e or -ne. Words: critakna = tell it (imperative) = ceritakan."
  - speaker: Mas Danang
    text: 'Contone: Bapakku guru. Aku duwe mbakyu siji. Omahe simbahku ing Kairo.'
    ar_eg: 'مثلًا: أبويا مدرّس. عندي أخت كبيرة واحدة. بيت جدّي في القاهرة.'
    ar: 'مثلًا: أبي معلّم. لي أخت كبرى واحدة. بيت جدّي في القاهرة.'
    en: 'For example: My dad is a teacher. I have one big sister. My grandpa''s house is in Cairo.'
  - speaker: Mbak Sekar
    text: PR-mu, gawe wit kulawarga, lan tulisen jenenge saben wong nganggo basa Jawa.
    ar_eg: واجبك، ارسم شجرة العيلة، واكتب كل واحد بالجاوي.
    ar: 'واجبك: ارسم شجرة العائلة واكتب صلة كلّ فرد بالجاوية.'
    en: 'Your homework: draw a family tree and label everyone in Javanese.'
    note:
      ar_eg: "كلمات: gawe = يعمل / يحضّر (= buat)."
      ar: "مفردات: gawe = يصنع / يُعِدّ (= buat)."
      en: "Words: gawe = to make (= buat)."
  - speaker: Mas Danang
    text: Sesuk kita menyang Caruban, mangan pecel! Nganti ketemu!
    ar_eg: بكرة رايحين كاروبان، ناكل بيتشيل! نتقابل!
    ar: غدًا نذهب إلى كاروبان لنأكل البيتشيل! إلى اللقاء!
    en: Tomorrow we go to Caruban to eat pecel! See you!
    note:
      ar_eg: "كلمات: pecel = بيتشل (خضار مسلوقة بصوص فول سوداني)."
      ar: "مفردات: pecel = بيتشل، خضار بصلصة الفول السوداني."
      en: "Words: pecel = pecel (boiled vegetables with peanut sauce)."
