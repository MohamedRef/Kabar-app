title:
  target: Wayah lan Dina
  ar_eg: الوقت والأيّام
  ar: الوقت والأيّام
  en: Time and days
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Ponorogo
  lines:
  - speaker: Mas Danang
    text: Sugeng sonten saka Ponorogo! Krungu ta? Kendhang lan slompret reog wis muni! Aku Danang.
    ar_eg: مساء الخير من بونوروجو! سامعين؟ طبول ومزمار الريوج ابتدت! أنا دانانج.
    ar: مساء الخير من بونوروغو! أتسمعون؟ بدأت طبول الريوغ ومزاميره! أنا دانانغ.
    en: Good afternoon from Ponorogo! Hear that? The reog drums and trumpet have started! I'm Danang.
  - speaker: Mbak Sekar
    text: Aku Sekar. Reog iku tari karo topeng macan lan wulu merak sing gedhe banget. Abote puluhan kilo!
    ar_eg: أنا سيكار. الريوج رقصة بقناع نمر وريش طاووس ضخم أوي. تقله عشرات الكيلوهات!
    ar: أنا سيكار. الريوغ رقصة بقناع نمر وريش طاووس ضخم جدًّا، وزنه عشرات الكيلوغرامات!
    en: I'm Sekar. Reog is a dance with a tiger mask and huge peacock feathers. It weighs dozens of kilos!
    note:
      ar_eg: الراقص بيشيل القناع الضخم بسنانه! الريوج فخر بونوروجو.
      ar: يحمل الراقص القناع الضخم بأسنانه! والريوغ فخر بونوروغو.
      en: The dancer carries the huge mask with his teeth! Reog is Ponorogo's pride.
  - speaker: Mas Danang
    text: Dina iki kita sinau jam, dina, lan dina pasaran Jawa.
    ar_eg: النهارده هنتعلّم الساعة، والأيّام، وأيّام السوق الجاوي.
    ar: اليوم نتعلّم الساعة والأيّام وأيّام السوق الجاوية.
    en: Today we learn the time, the days, and the Javanese market days.
- kind: dialogue
  title: Janjian ndeleng reog
  lines:
  - speaker: Mbak Sekar
    text: Danang, sesuk ana pentas reog maneh. Jam pira?
    ar_eg: يا دانانج، بكرة فيه عرض ريوج تاني. الساعة كام؟
    ar: يا دانانغ، غدًا عرض ريوغ آخر. في أيّ ساعة؟
    en: Danang, there's another reog show tomorrow. What time?
  - speaker: Mas Danang
    text: Jam pitu bengi, ing alun-alun.
    ar_eg: الساعة سبعة بالليل، في الميدان.
    ar: في السابعة مساءً، في الساحة.
    en: Seven in the evening, at the town square.
  - speaker: Mbak Sekar
    text: Sesuk iku dina apa?
    ar_eg: بكرة يبقى يوم إيه؟
    ar: غدًا أيّ يوم؟
    en: What day is tomorrow?
  - speaker: Mas Danang
    text: Sesuk Setu. Setu Pon, miturut tanggalan Jawa.
    ar_eg: بكرة السبت. سبت «Pon» حسب النتيجة الجاوي.
    ar: غدًا السبت. سبت «Pon» بحسب التقويم الجاوي.
    en: Tomorrow is Saturday. Saturday Pon, by the Javanese calendar.
    note:
      ar_eg: 'الجاوي عنده أسبوع تاني من خمس أيّام: Legi، Pahing، Pon، Wage، Kliwon. كل يوم ليه اسمين - زي «Setu Pon».'
      ar: 'للجاوية أسبوع ثانٍ من خمسة أيّام: Legi وPahing وPon وWage وKliwon، فلكلّ يوم اسمان - مثل «Setu Pon».'
      en: 'Javanese has a second, five-day week: Legi, Pahing, Pon, Wage, Kliwon. Every day has two names - like "Setu Pon".'
  - speaker: Mbak Sekar
    text: Pon? Kok ana dina loro?
    ar_eg: Pon؟ ليه فيه يومين؟
    ar: Pon؟ لماذا يومان؟
    en: Pon? How come there are two days?
  - speaker: Mas Danang
    text: Iya. Biyen pasar ing desa-desa buka miturut dina pasaran. Pasar Legi, Pasar Pon.
    ar_eg: أيوه. زمان الأسواق في القرى كانت بتفتح حسب يوم السوق. سوق Legi، سوق Pon.
    ar: نعم. قديمًا كانت أسواق القرى تفتح بحسب يوم السوق. سوق Legi، سوق Pon.
    en: Yes. In the old days village markets opened by market day. Pasar Legi, Pasar Pon.
  - speaker: Mbak Sekar
    text: Oh, mula ana Pasar Legi ing Solo! Lan "Jumat Kliwon" iku apa?
    ar_eg: آه، عشان كده فيه سوق Legi في سولو! و«الجمعة Kliwon» دي إيه؟
    ar: آه، لهذا يوجد سوق Legi في سولو! وما «الجمعة Kliwon»؟
    en: Oh, that's why there's a Pasar Legi in Solo! And what's "Jumat Kliwon"?
  - speaker: Mas Danang
    text: Jemuah Kliwon iku dina sing misuwur. Akeh crita lan tradhisi, wong tuwa-tuwa nganggep dina keramat.
    ar_eg: الجمعة Kliwon يوم مشهور. حواليه حكايات وعادات كتير، والكبار بيعتبروه يوم ليه هيبة.
    ar: الجمعة Kliwon يوم مشهور، تحيط به حكايات وعادات كثيرة، ويعدّه الكبار يومًا ذا هيبة.
    en: Friday Kliwon is a famous day. Lots of stories and traditions; older people treat it as a special day.
  - speaker: Mbak Sekar
    text: Menarik. Dadi sesuk Setu Pon, jam pitu bengi. Aku teka jam setengah pitu, ya.
    ar_eg: مثير. يبقى بكرة سبت Pon، الساعة سبعة بالليل. أنا هاجي الساعة ستّة ونصّ.
    ar: مثير. إذن غدًا سبت Pon في السابعة مساءً. سآتي في السادسة والنصف.
    en: Interesting. So tomorrow, Saturday Pon, seven pm. I'll come at half past six.
    note:
      ar_eg: setengah pitu = ستّة ونصّ (حرفيًّا «نصّ سبعة»)، زي الإندونيسي setengah tujuh.
      ar: setengah pitu = السادسة والنصف (حرفيًّا «نصف السابعة»)، مثل الإندونيسية setengah tujuh.
      en: Setengah pitu = half past six (literally "half seven"), like Indonesian setengah tujuh.
  - speaker: Mas Danang
    text: Oke. Aja telat, lho! Reog ra ngenteni sapa-sapa.
    ar_eg: تمام. ماتتأخّريش! الريوج مش بيستنّى حدّ.
    ar: حسنًا. لا تتأخّري! الريوغ لا ينتظر أحدًا.
    en: Okay. Don't be late! Reog waits for no one.
- kind: word_spotlight
  title: Senen nganti Minggu
  lines:
  - speaker: Mbak Sekar
    text: Senen, Selasa, Rebo, Kemis, Jemuah, Setu, Minggu.
    ar_eg: الاتنين، التلات، الأربع، الخميس، الجمعة، السبت، الحدّ.
    ar: الاثنين، الثلاثاء، الأربعاء، الخميس، الجمعة، السبت، الأحد.
    en: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.
    note:
      ar_eg: 'كتير منهم جاي من العربي: Senen من الاتنين، Selasa من الثلاثاء، Rebo من الأربعاء، Kemis من الخميس، Jemuah من الجمعة.'
      ar: 'كثير منها من العربية: Senen من الاثنين، وSelasa من الثلاثاء، وRebo من الأربعاء، وKemis من الخميس، وJemuah من الجمعة.'
      en: 'Many come from Arabic: Senen from al-ithnayn, Selasa from ath-thulatha, Rebo from al-arbi''a, Kemis from al-khamis, Jemuah from al-jum''a.'
  - speaker: Mas Danang
    text: Legi, Pahing, Pon, Wage, Kliwon. Limang dina pasaran.
    ar_eg: Legi، Pahing، Pon، Wage، Kliwon. خمس أيّام سوق.
    ar: Legi وPahing وPon وWage وKliwon. خمسة أيّام سوق.
    en: Legi, Pahing, Pon, Wage, Kliwon. Five market days.
  - speaker: Mbak Sekar
    text: Jam pira? Jam siji, jam loro, jam setengah telu. Esuk, awan, sore, bengi.
    ar_eg: الساعة كام؟ واحدة، اتنين، اتنين ونصّ. الصبح، الضهر، العصر، بالليل.
    ar: كم الساعة؟ الواحدة، الثانية، الثانية والنصف. صباحًا، ظهرًا، عصرًا، ليلًا.
    en: What time? One o'clock, two, half past two. Morning, midday, afternoon, night.
  - speaker: Mas Danang
    text: Lan wingi, saiki, sesuk. Wingi Jemuah, saiki Setu, sesuk Minggu.
    ar_eg: وامبارح، دلوقتي، بكرة. امبارح الجمعة، النهارده السبت، بكرة الحدّ.
    ar: وأمس والآن وغدًا. أمس الجمعة، اليوم السبت، غدًا الأحد.
    en: And yesterday, now, tomorrow. Yesterday Friday, today Saturday, tomorrow Sunday.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Saiki jam pira?
    ar_eg: الساعة كام دلوقتي؟
    ar: كم الساعة الآن؟
    en: What time is it now?
  - speaker: Mas Danang
    text: Saiki jam pira?
    ar_eg: الساعة كام دلوقتي؟
    ar: كم الساعة الآن؟
    en: What time is it now?
  - speaker: Mbak Sekar
    text: Jam setengah pitu.
    ar_eg: ستّة ونصّ.
    ar: السادسة والنصف.
    en: Half past six.
  - speaker: Mas Danang
    text: Jam setengah pitu.
    ar_eg: ستّة ونصّ.
    ar: السادسة والنصف.
    en: Half past six.
  - speaker: Mbak Sekar
    text: Sesuk dina apa?
    ar_eg: بكرة يوم إيه؟
    ar: غدًا أيّ يوم؟
    en: What day is tomorrow?
  - speaker: Mas Danang
    text: Sesuk dina apa?
    ar_eg: بكرة يوم إيه؟
    ar: غدًا أيّ يوم؟
    en: What day is tomorrow?
  - speaker: Mbak Sekar
    text: Sesuk Setu Pon.
    ar_eg: بكرة سبت Pon.
    ar: غدًا سبت Pon.
    en: Tomorrow is Saturday Pon.
  - speaker: Mas Danang
    text: Sesuk Setu Pon.
    ar_eg: بكرة سبت Pon.
    ar: غدًا سبت Pon.
    en: Tomorrow is Saturday Pon.
  - speaker: Mbak Sekar
    text: Wingi Jemuah, sesuk Minggu.
    ar_eg: امبارح الجمعة، بكرة الحدّ.
    ar: أمس الجمعة، وغدًا الأحد.
    en: Yesterday was Friday, tomorrow is Sunday.
  - speaker: Mas Danang
    text: Wingi Jemuah, sesuk Minggu.
    ar_eg: امبارح الجمعة، بكرة الحدّ.
    ar: أمس الجمعة، وغدًا الأحد.
    en: Yesterday was Friday, tomorrow is Sunday.
  - speaker: Mbak Sekar
    text: Aja telat, ya!
    ar_eg: ماتتأخّرش!
    ar: لا تتأخّر!
    en: Don't be late!
  - speaker: Mas Danang
    text: Aja telat, ya!
    ar_eg: ماتتأخّرش!
    ar: لا تتأخّر!
    en: Don't be late!
  - speaker: Mbak Sekar
    text: Lan Senen Legi, Selasa Pahing, Rebo Pon... saben dina ana jenenge loro.
    ar_eg: والاتنين Legi، والتلات Pahing، والأربع Pon... كل يوم ليه اسمين.
    ar: والاثنين Legi، والثلاثاء Pahing، والأربعاء Pon... لكلّ يوم اسمان.
    en: And Monday Legi, Tuesday Pahing, Wednesday Pon... every day has two names.
- kind: outro
  title: Janjiane Mas Mohamed
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, gawe janjian karo kancamu. Dina apa, jam pira, lan ing ngendi.
    ar_eg: يا ماس محمد، اعمل ميعاد مع صاحبك. يوم إيه، الساعة كام، وفين.
    ar: يا ماس محمد، حدّد موعدًا مع صديقك. أيّ يوم، وفي أيّ ساعة، وأين.
    en: Mas Mohamed, make a date with your friend. What day, what time, and where.
    note:
      ar_eg: دورك! وجرّب تعرف النهارده أنهي يوم pasaran - في تطبيقات النتيجة الجاوي.
      ar: دورك! وجرّب أن تعرف يوم pasaran اليوم - في تطبيقات التقويم الجاوي.
      en: Your turn! And try to find out today's pasaran day - Javanese calendar apps show it.
  - speaker: Mbak Sekar
    text: 'Contone: Ayo ketemu dina Jemuah, jam papat sore, ing ngarep masjid.'
    ar_eg: 'مثلًا: يلّا نتقابل يوم الجمعة، الساعة أربعة العصر، قدّام الجامع.'
    ar: 'مثلًا: لنلتقِ يوم الجمعة في الرابعة عصرًا أمام المسجد.'
    en: 'For example: Let''s meet on Friday, four pm, in front of the mosque.'
  - speaker: Mas Danang
    text: PR-mu, tulisen jadwalmu seminggu nganggo basa Jawa. Senen nganti Minggu!
    ar_eg: واجبك، اكتب جدولك للأسبوع بالجاوي. من الاتنين للحدّ!
    ar: 'واجبك: اكتب جدولك الأسبوعيّ بالجاوية. من الاثنين إلى الأحد!'
    en: 'Your homework: write your week''s schedule in Javanese. Monday to Sunday!'
  - speaker: Mbak Sekar
    text: Sesuk kita menyang Magetan, telaga Sarangan. Nganti ketemu!
    ar_eg: بكرة رايحين ماجيتان، بحيرة سارانجان. نتقابل!
    ar: غدًا نذهب إلى ماغيتان، بحيرة سارانغان. إلى اللقاء!
    en: Tomorrow we go to Magetan, Lake Sarangan. See you!
