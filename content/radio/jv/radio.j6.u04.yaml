segments:
- kind: intro
  title: Gang ing Jagalan
  lines:
  - speaker: Mas Danang
    text: Sugeng sonten saking Jagalan, cah! Aku Danang. Gang-gang ing kene cilik banget, motor wae angel liwat.
    ar_eg: مساء الخير من جاجالان يا جماعة! أنا دانانج. الحواري هنا ضيّقة أوي، حتّى الموتوسيكل بالعافية يعدّي.
    ar: مساء الخير من جاغالان! أنا دانانغ. الأزقّة هنا ضيّقة جدًّا، حتّى الدرّاجة النارية تمرّ بصعوبة.
    en: Good evening from Jagalan, folks! I'm Danang. The lanes here are so narrow, even a motorbike struggles to pass.
  - speaker: Mbak Sekar
    text: Kula Sekar. Menika Jalan Rukunan. Rukun tegese urip bebarengan kanthi tentrem.
    ar_eg: أنا سيكار. ده شارع روكونان. rukun معناها نعيش مع بعض في سلام.
    ar: أنا سيكار. هذا شارع روكونان. rukun تعني العيش معًا في وئام.
    en: I'm Sekar. This is Jalan Rukunan. Rukun means living together in peace.
    note:
      ar_eg: أهل جاجالان اتّفقوا من زمان يفتحوا ممرّ بين بيوتهم للكلّ، وسمّوه Rukunan.
      ar: اتّفق أهل جاغالان قديمًا على فتح ممرّ بين بيوتهم للجميع وسمّوه Rukunan.
      en: Jagalan's residents long ago agreed to open a lane between their houses for all, and named it Rukunan.
  - speaker: Mas Danang
    text: 'Dina iki pelajaran sing paling angel: pasangan. Aja wedi, tak bantu!'
    ar_eg: 'النهارده أصعب درس: الـ pasangan. ماتخافش، أنا هساعدك!'
    ar: 'اليوم أصعب درس: pasangan. لا تخف، سأساعدك!'
    en: 'Today, the hardest lesson: pasangan. Don''t worry, I''ll help!'
- kind: dialogue
  title: Ing omahe tukang perak
  lines:
  - speaker: Mbak Sekar
    text: Danang, delengen papan iki. Tulisane "tukang perak".
    ar_eg: يا دانانج، بصّ على اليافطة دي. مكتوب عليها «tukang perak».
    ar: يا دانانغ، انظر إلى هذه اللافتة. مكتوب «tukang perak».
    en: Danang, look at this sign. It says "tukang perak".
  - speaker: Mas Danang
    text: Tu, ka, ng... lho, ana aksara cilik ing ngisor. Iku apa?
    ar_eg: tu ka ng... إيه ده، فيه حرف صغيّر تحت. ده إيه؟
    ar: tu ka ng... ما هذا؟ حرف صغير تحت. ما هو؟
    en: Tu, ka, ng... hey, there's a small letter underneath. What's that?
  - speaker: Mbak Sekar
    text: Iku pasangan. Yen ana konsonan loro bebarengan, aksara kapindho ditulis ing ngisor.
    ar_eg: دي pasangan. لو فيه حرفين ساكنين ورا بعض، الحرف التاني بيتكتب تحت.
    ar: هذه pasangan. إذا اجتمع ساكنان كُتب الثاني تحت الأوّل.
    en: That's pasangan. When two consonants meet, the second letter is written underneath.
    note:
      ar_eg: بدل ما تحطّ pangkon في نصّ الكلمة، الحرف اللي بعده بينزل تحت بشكل تاني. ꦥꦼꦫꦏ꧀ = perak.
      ar: بدل pangkon في وسط الكلمة، ينزل الحرف التالي تحته بشكل آخر. ꦥꦼꦫꦏ꧀ = perak.
      en: Instead of a pangkon mid-word, the next letter drops below in a second form. ꦥꦼꦫꦏ꧀ = perak.
  - speaker: Mas Danang
    text: Dadi saben aksara duwe rupa loro?
    ar_eg: يعني كلّ حرف ليه شكلين؟
    ar: يعني لكلّ حرف شكلان؟
    en: So every letter has two shapes?
  - speaker: Mbak Sekar
    text: Leres. Rupa biasa lan rupa pasangan. Kaya lanang lan wadon, kudu bebarengan.
    ar_eg: صحّ. شكل عادي وشكل pasangan. زي الراجل والست، لازم مع بعض.
    ar: صحيح، شكل عاديّ وشكل pasangan، كالرجل والمرأة لا بدّ أن يكونا معًا.
    en: Right. A normal shape and a pasangan shape. Like man and woman, they go together.
  - speaker: Mas Danang
    text: Mbak Sekar, aku keselen. Ayo menyang angkringan, ngombe wedang jahe.
    ar_eg: يا مباك سيكار، أنا تعبت. يلّا على الأنكرينجان، نشرب جنزبيل.
    ar: يا مباك سيكار، تعبت. هيّا إلى الأنغكرينغان نشرب شراب الزنجبيل.
    en: Mbak Sekar, I'm tired. Let's go to the angkringan for ginger tea.
    note:
      ar_eg: angkringan = عربية أكل صغيّرة على الرصيف، بتبيع أكل رخيص ومشروبات سخنة بالليل.
      ar: angkringan عربة طعام صغيرة على الرصيف تبيع طعامًا رخيصًا ومشروبات ساخنة ليلًا.
      en: An angkringan is a small street cart selling cheap food and hot drinks at night.
  - speaker: Mbak Sekar
    text: Apik. Papan ing angkringan uga nganggo pasangan. Delengen "sego kucing".
    ar_eg: حلو. يافطة الأنكرينجان برضه فيها pasangan. بصّ على «sego kucing».
    ar: جميل. لافتة الأنغكرينغان فيها pasangan أيضًا. انظر إلى «sego kucing».
    en: Good. The angkringan sign uses pasangan too. Look at "sego kucing".
  - speaker: Mas Danang
    text: Sego kucing, tanpa kucing, cah! Mung sega cilik karo sambel.
    ar_eg: «رزّ القطّة»، من غير قطط يا جماعة! بس رزّ صغيّر بالشطّة.
    ar: «أرز القطّة» بلا قطط! مجرّد أرز قليل مع الشطّة.
    en: Cat rice, without the cat, folks! Just a little rice with chilli.
    note:
      ar_eg: sego kucing = «رزّ القطّة»، اسمه كده عشان الكمّية صغيّرة قدّ أكل القطّة. tanpa = من غير.
      ar: sego kucing «أرز القطّة» لصغر الحصّة. tanpa = بدون.
      en: Sego kucing, "cat rice", is named for its tiny portion. Tanpa means without.
- kind: word_spotlight
  title: Pasangan
  lines:
  - speaker: Mbak Sekar
    text: Pasangan iku rupa kapindho saben aksara. Ditulis ing ngisor utawa ing sandhinge aksara sadurunge.
    ar_eg: الـ pasangan هي الشكل التاني لكلّ حرف. بيتكتب تحت أو جنب الحرف اللي قبله.
    ar: pasangan هي الشكل الثاني لكلّ حرف، يُكتب تحت الحرف السابق أو بجانبه.
    en: Pasangan is each letter's second shape. Written under or beside the letter before it.
  - speaker: Mas Danang
    text: Ha, sa, lan pa pasangane ing sandhinge, ora ing ngisor. Kuwi sing angel!
    ar_eg: الـ ha والـ sa والـ pa الـ pasangan بتاعهم جنب الحرف، مش تحت. دي الصعبة!
    ar: pasangan لـ ha وsa وpa تُكتب بجانب الحرف لا تحته، وهذا الصعب!
    en: Ha, sa and pa have their pasangan beside, not underneath. That's the tricky bit!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Tukang perak.
    ar_eg: صايغ فضّة.
    ar: صائغ فضّة.
    en: Silversmith.
  - speaker: Mas Danang
    text: Tukang perak.
    ar_eg: صايغ فضّة.
    ar: صائغ فضّة.
    en: Silversmith.
  - speaker: Mbak Sekar
    text: Lanang lan wadon.
    ar_eg: راجل وست.
    ar: رجل وامرأة.
    en: Man and woman.
  - speaker: Mas Danang
    text: Lanang lan wadon.
    ar_eg: راجل وست.
    ar: رجل وامرأة.
    en: Man and woman.
  - speaker: Mbak Sekar
    text: Sego kucing, tanpa kucing.
    ar_eg: رزّ القطّة، من غير قطّة.
    ar: أرز القطّة بلا قطّة.
    en: Cat rice, without a cat.
  - speaker: Mas Danang
    text: Sego kucing, tanpa kucing.
    ar_eg: رزّ القطّة، من غير قطّة.
    ar: أرز القطّة بلا قطّة.
    en: Cat rice, without a cat.
  - speaker: Mbak Sekar
    text: Urip rukun.
    ar_eg: نعيش في سلام.
    ar: نعيش في وئام.
    en: Living in harmony.
  - speaker: Mas Danang
    text: Urip rukun.
    ar_eg: نعيش في سلام.
    ar: نعيش في وئام.
    en: Living in harmony.
  - speaker: Mbak Sekar
    text: Danang, ayo maca papan arah ing gang iki. Tulisane "Gang Rukunan".
    ar_eg: يا دانانج، يلّا نقرا يافطة الاتّجاهات في الحارة دي. مكتوب عليها Gang Rukunan.
    ar: 'يا دانانغ، لنقرأ لافتة الاتّجاه في هذا الزقاق: Gang Rukunan.'
    en: Danang, let's read the direction sign in this lane. It says "Gang Rukunan".
  - speaker: Mas Danang
    text: Ga, nga cilik nganggo cecak... lan ru, ku, na, lan pasangan na. Bener, Mbak?
    ar_eg: ga، والـ ng بالـ cecak... وru ku na، والـ pasangan بتاع na. صحّ يا مباك؟
    ar: ga ثمّ ng بـ cecak... ثمّ ru ku na مع pasangan لـ na. صحيح يا مباك؟
    en: Ga, the ng with cecak... and ru, ku, na, and the pasangan of na. Right, Mbak?
  - speaker: Mbak Sekar
    text: Meh bener. Ing pungkasan tembung, ora nganggo pasangan. Nganggo pangkon wae.
    ar_eg: قرّبت. في آخر الكلمة مفيش pasangan. بالـ pangkon بس.
    ar: قريب من الصواب. في آخر الكلمة لا pasangan، بل pangkon فقط.
    en: Nearly right. At the end of a word there's no pasangan. Just pangkon.
  - speaker: Mas Danang
    text: Oh, dadi pasangan mung ing tengah tembung, yen ana aksara sabanjure.
    ar_eg: آه، يعني الـ pasangan بس في نصّ الكلمة، لو فيه حرف بعده.
    ar: آه، إذن pasangan في وسط الكلمة فقط، إذا تلاه حرف.
    en: Oh, so pasangan only goes mid-word, when another letter follows.
  - speaker: Mbak Sekar
    text: Leres. Lan ing antarane tembung loro uga, kaya "tukang perak". Ing pungkasan ukara, pangkon.
    ar_eg: صحّ. وبين كلمتين برضه، زي tukang perak. وفي آخر الجملة، pangkon.
    ar: صحيح، وبين كلمتين أيضًا مثل tukang perak. وفي آخر الجملة pangkon.
    en: Right. And between two words too, like "tukang perak". At the end of a sentence, pangkon.
    note:
      ar_eg: الجاوي بيتكتب من غير مسافات بين الكلمات، فالـ pasangan بتربط آخر كلمة بأوّل اللي بعدها.
      ar: تُكتب الجاوية بلا مسافات بين الكلمات، فتربط pasangan آخر الكلمة بأوّل التالية.
      en: Javanese script has no spaces between words, so pasangan links one word's end to the next word's start.
- kind: outro
  title: Kenalan karo Bimo
  lines:
  - speaker: Mbak Sekar
    text: Ing pelajaran, sampeyan bakal kenalan karo Mas Bimo, tukang perak ing Kotagedhe.
    ar_eg: في الدرس، هتتعرّف على ماس بيمو، صايغ الفضّة في كوتاجيدي.
    ar: في الدرس ستتعرّف على ماس بيمو، صائغ الفضّة في كوتاغيدي.
    en: In the lesson, you'll meet Mas Bimo, a silversmith in Kotagede.
  - speaker: Mas Danang
    text: PR-mu, wacanen pengumuman kerja bakti ing pelajaran, lan golekana pasangan.
    ar_eg: واجبك، اقرا إعلان الشغل الجماعي في الدرس، ودوّر على الـ pasangan.
    ar: 'واجبك: اقرأ إعلان العمل التطوّعيّ في الدرس وابحث عن pasangan.'
    en: 'Your homework: read the community work notice in the lesson and find the pasangan.'
    note:
      ar_eg: kerja bakti = يوم شغل جماعي، أهل الحتّة بينضّفوا الشارع مع بعض.
      ar: kerja bakti يوم عمل جماعيّ ينظّف فيه السكّان حيّهم معًا.
      en: Kerja bakti is a community work day when neighbours clean the street together.
  - speaker: Mbak Sekar
    text: Sesuk kita dhateng Imogiri, munggah undhak-undhakan. Nganti pinanggih malih!
    ar_eg: بكرة رايحين إيموجيري، نطلع السلالم. إلى اللقاء!
    ar: غدًا نذهب إلى إيموغيري ونصعد الدرجات. إلى اللقاء!
    en: Tomorrow we go to Imogiri and climb the steps. Until next time!
