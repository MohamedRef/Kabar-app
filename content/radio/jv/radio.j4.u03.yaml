title:
  target: Krama andhap
  ar_eg: أفعال التواضع
  ar: أفعال التواضع
  en: Humble forms
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Kraton Yogyakarta
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saking Kraton Ngayogyakarta. Kula Sekar. Ing ngriki, swantenipun kedah alon.
    ar_eg: صباح الخير من قصر يوجياكارتا. أنا سيكار. هنا لازم نوطّي صوتنا.
    ar: صباح الخير من قصر يوغياكارتا. أنا سيكار. هنا يجب أن نخفض أصواتنا.
    en: Good morning from the Kraton of Yogyakarta. I'm Sekar. Here we must speak softly.
  - speaker: Mas Galih
    text: Kula Galih. Kula ningali abdi dalem ngagem surjan lan blangkon. Sae sanget.
    ar_eg: أنا جاليه. شايف خدّام القصر لابسين «surjan» و«blangkon». حلوين أوي.
    ar: أنا غاليه. أرى خدم القصر بالسورجان والبلانكون. رائعون جدًّا.
    en: I'm Galih. I see the palace servants in surjan and blangkon. Very fine.
    note:
      ar_eg: الكراتون = قصر السلطان، ولسّه السلطان عايش فيه. abdi dalem = خدّام القصر، وكتير منهم بيخدموا تطوّع.
      ar: الكراتون = قصر السلطان، وما زال السلطان يقيم فيه. وabdi dalem = خدم القصر، يخدم كثير منهم تطوّعًا.
      en: The Kraton is the Sultan's palace, still his home. Abdi dalem are palace servants, many serving almost as volunteers.
  - speaker: Mbak Sekar
    text: Dina menika kita sinau krama andhap. Tembung kangge ngasoraken dhiri, nalika matur dhateng tiyang luhur.
    ar_eg: النهارده هنتعلّم الكراما أنداپ. كلمات بتواضع بيها نفسك لمّا تكلّم حدّ أعلى منك.
    ar: 'اليوم نتعلّم الكراما أنداب: كلمات تتواضع بها حين تكلّم من هو أعلى منك.'
    en: Today we learn krama andhap. Words that lower yourself when you speak up to someone higher.
  - speaker: Mas Galih
    text: Krama inggil ngangkat wong liya. Krama andhap ngasorake awake dhewe. Loro-lorone kanggo ngajeni.
    ar_eg: الكراما إنجيل بترفع التاني. الكراما أنداپ بتواضع نفسك. الاتنين للاحترام.
    ar: الكراما إنغيل ترفع الآخر، والكراما أنداب تخفض نفسك. وكلاهما للاحترام.
    en: Krama inggil raises the other person. Krama andhap lowers yourself. Both show respect.
- kind: dialogue
  title: Matur dhateng abdi dalem
  lines:
  - speaker: Mas Galih
    text: Sekar, sampeyan abdi dalem ingkang sepuh. Kula tamu ingkang badhe nyuwun pirsa.
    ar_eg: يا سيكار، انتي خدّامة القصر الكبيرة. وأنا الضيف اللي عايز يسأل.
    ar: يا سيكار، أنتِ خادمة القصر المسنّة وأنا الضيف الذي يريد أن يسأل.
    en: Sekar, you're the elderly palace servant. I'm the visitor who wants to ask something.
  - speaker: Mas Galih
    text: Nyuwun sewu, Bu. Kula badhe matur sekedhik.
    ar_eg: لا مؤاخذة يا ست. عايز أقول لحضرتك حاجة صغيّرة.
    ar: عذرًا يا سيّدتي. أودّ أن أقول لك شيئًا قليلًا.
    en: Excuse me, Bu. I'd like to say something briefly.
    note:
      ar_eg: matur = يقول (لحدّ أعلى) - كراما أنداپ. ngendika = يقول (عن الكبير) - كراما إنجيل.
      ar: matur = يقول (لمن هو أعلى) - كراما أنداب، وngendika = يقول (عن الكبير) - كراما إنغيل.
      en: Matur = say (up to someone) - krama andhap. Ngendika = say (of an elder) - krama inggil.
  - speaker: Mbak Sekar
    text: Monggo, Mas. Badhe matur menapa?
    ar_eg: اتفضّل يا ماس. عايز تقول إيه؟
    ar: تفضّل يا ماس. ماذا تريد أن تقول؟
    en: Go ahead, Mas. What would you like to say?
  - speaker: Mas Galih
    text: Kula saking Mesir. Kula nyuwun pirsa, menapa kula saged sowan dhateng museum Kraton?
    ar_eg: أنا من مصر. أنا بستأذن أسأل، ينفع أزور متحف القصر؟
    ar: 'أنا من مصر. أستأذن بالسؤال: هل يمكنني زيارة متحف القصر؟'
    en: I'm from Egypt. May I ask, can I visit the Kraton museum?
  - speaker: Mbak Sekar
    text: Saged, Mas. Museumipun bikak ngantos jam kalih.
    ar_eg: ينفع يا ماس. المتحف فاتح لحدّ الساعة اتنين.
    ar: يمكن يا ماس. المتحف مفتوح حتى الساعة الثانية.
    en: You can, Mas. The museum is open until two o'clock.
  - speaker: Mas Galih
    text: Matur nuwun. Kula ugi ngaturaken salam saking kanca kula, Pak Harsono.
    ar_eg: متشكّر. وكمان بوصّل لحضرتك سلام صاحبي، پاك هارسونو.
    ar: شكرًا. وأبلّغك أيضًا سلام صديقي باك هارسونو.
    en: Thank you. I also bring you greetings from my friend, Pak Harsono.
  - speaker: Mbak Sekar
    text: Oh, Pak Harsono! Salam wangsul, Mas.
    ar_eg: آه، پاك هارسونو! سلّملي عليه يا ماس.
    ar: آه، باك هارسونو! بلّغه سلامي يا ماس.
    en: Oh, Pak Harsono! Greetings back to him, Mas.
  - speaker: Mas Galih
    text: Lan menawi pareng, kula badhe ngaturi Ibu foto sesarengan.
    ar_eg: ولو تسمحي، عايز أدعو حضرتك نتصوّر مع بعض.
    ar: وإن سمحتِ أودّ أن أدعوكِ لصورة معًا.
    en: And if I may, I'd like to invite you for a photo together.
  - speaker: Mbak Sekar
    text: Hahaha, monggo, Mas. Nanging sakedhap, kula caos sekar rumiyin.
    ar_eg: ههههه، اتفضّل يا ماس. بس استنّى شويّة، أقدّم الورد الأوّل.
    ar: ههههه، تفضّل يا ماس. لكن لحظة، أقدّم الزهور أوّلًا.
    en: Hahaha, please, Mas. But a moment, I'll offer the flowers first.
    note:
      ar_eg: caos = يقدّم (لحدّ أعلى، أو في طقس). sekar هنا = الورد بالكراما.
      ar: caos = يقدّم (لمن هو أعلى، أو في طقس). وsekar هنا = الزهور بالكراما.
      en: Caos = offer (upward, or in a ritual). Sekar here = flowers, in krama.
  - speaker: Mas Galih
    text: Lho, Sekar, jenengmu tegese kembang!
    ar_eg: إيه ده يا سيكار، اسمك معناه ورد!
    ar: عجبًا يا سيكار، اسمك يعني الزهر!
    en: Hey, Sekar, your name means flower!
  - speaker: Mbak Sekar
    text: Hehe, leres. Sekar iku krama saka kembang.
    ar_eg: هههه، صحّ. sekar هي الكراما من kembang.
    ar: هههه، صحيح. sekar هي كراما kembang.
    en: Hehe, right. Sekar is the krama for kembang.
- kind: word_spotlight
  title: Matur, sowan, nyuwun
  lines:
  - speaker: Mbak Sekar
    text: 'Matur: ngomong marang wong luhur. Kula badhe matur.'
    ar_eg: 'matur: تقول لحدّ أعلى منك. عايز أقول لحضرتك.'
    ar: 'matur: تقول لمن هو أعلى. أودّ أن أقول.'
    en: 'Matur: speak up to someone. Kula badhe matur.'
  - speaker: Mas Galih
    text: 'Sowan: teka marang wong luhur. Kula sowan Simbah. Kula sowan dhateng Kraton.'
    ar_eg: 'sowan: تزور حدّ أعلى منك. أزور جدّتي. أزور القصر.'
    ar: 'sowan: تزور من هو أعلى. أزور الجدّة. أزور القصر.'
    en: 'Sowan: visit someone higher. I visit grandma. I visit the Kraton.'
  - speaker: Mbak Sekar
    text: 'Nyuwun: njaluk kanthi andhap asor. Nyuwun pirsa, nyuwun pangapunten, nyuwun tulung.'
    ar_eg: 'nyuwun: تطلب بتواضع. أستأذن أسأل، أطلب السماح، أطلب المساعدة.'
    ar: 'nyuwun: تطلب بتواضع. أستأذن بالسؤال، أطلب العفو، أطلب العون.'
    en: 'Nyuwun: ask humbly. May I ask, please forgive me, please help.'
    note:
      ar_eg: nyuwun زي «من فضلك أطلب» - nyuwun pangapunten = لا مؤاخذة / سامحني، أهمّ كلمة في أيّ غلطة.
      ar: nyuwun مثل «أرجو» - وnyuwun pangapunten = أرجو العفو، أهمّ كلمة عند أيّ خطأ.
      en: Nyuwun is like "I humbly request" - nyuwun pangapunten = please forgive me, the key phrase after any mistake.
  - speaker: Mas Galih
    text: 'Ngaturi: ngajak utawa menehi marang wong luhur. Ngaturaken: ngaturake barang utawa salam.'
    ar_eg: 'ngaturi: تعزم أو تدّي حدّ أعلى. ngaturaken: تقدّم حاجة أو سلام.'
    ar: 'ngaturi: تدعو من هو أعلى أو تعطيه. ngaturaken: تقدّم شيئًا أو سلامًا.'
    en: 'Ngaturi: invite or give to someone higher. Ngaturaken: offer a thing or greetings.'
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Kula badhe matur sekedhik.
    ar_eg: عايز أقول حاجة صغيّرة.
    ar: أودّ أن أقول شيئًا قليلًا.
    en: I'd like to say something briefly.
  - speaker: Mas Galih
    text: Kula badhe matur sekedhik.
    ar_eg: عايز أقول حاجة صغيّرة.
    ar: أودّ أن أقول شيئًا قليلًا.
    en: I'd like to say something briefly.
  - speaker: Mbak Sekar
    text: Kula nyuwun pirsa.
    ar_eg: ممكن أسأل؟
    ar: أستأذن بالسؤال.
    en: May I ask?
  - speaker: Mas Galih
    text: Kula nyuwun pirsa.
    ar_eg: ممكن أسأل؟
    ar: أستأذن بالسؤال.
    en: May I ask?
  - speaker: Mbak Sekar
    text: Kula badhe sowan Simbah.
    ar_eg: عايز أزور جدّتي.
    ar: أودّ أن أزور الجدّة.
    en: I'd like to visit grandma.
  - speaker: Mas Galih
    text: Kula badhe sowan Simbah.
    ar_eg: عايز أزور جدّتي.
    ar: أودّ أن أزور الجدّة.
    en: I'd like to visit grandma.
  - speaker: Mbak Sekar
    text: Kula ngaturaken salam.
    ar_eg: بوصّل السلام.
    ar: أبلّغ السلام.
    en: I bring greetings.
  - speaker: Mas Galih
    text: Kula ngaturaken salam.
    ar_eg: بوصّل السلام.
    ar: أبلّغ السلام.
    en: I bring greetings.
  - speaker: Mbak Sekar
    text: Nyuwun pangapunten.
    ar_eg: لا مؤاخذة / سامحني.
    ar: أرجو العفو.
    en: Please forgive me.
  - speaker: Mas Galih
    text: Nyuwun pangapunten.
    ar_eg: لا مؤاخذة / سامحني.
    ar: أرجو العفو.
    en: Please forgive me.
- kind: outro
  title: Matur dhateng Pak Sastro
  lines:
  - speaker: Mas Galih
    text: Mas Mohamed, bayangna sampeyan ketemu Pak Sastro, abdi dalem. Matura, nyuwun pirsa, lan ngaturaken salam.
    ar_eg: يا ماس محمد، تخيّل إنك قابلت پاك ساسترو، خدّام القصر. كلّمه، واسأله، وبلّغه سلام.
    ar: يا ماس محمد، تخيّل أنّك قابلت باك ساسترو خادم القصر. كلّمه واسأله وبلّغه السلام.
    en: Mas Mohamed, imagine meeting Pak Sastro, the palace servant. Speak up, ask, and pass on greetings.
    note:
      ar_eg: دورك! استخدم matur وnyuwun pirsa وngaturaken.
      ar: دورك! استعمل matur وnyuwun pirsa وngaturaken.
      en: Your turn! Use matur, nyuwun pirsa and ngaturaken.
  - speaker: Mbak Sekar
    text: 'Contone: Nyuwun sewu, Pak. Kula badhe matur. Kula ngaturaken salam saking Kairo.'
    ar_eg: 'مثلًا: لا مؤاخذة يا أستاذ. عايز أقول لحضرتك. بوصّلك سلام من القاهرة.'
    ar: 'مثلًا: عذرًا يا سيّدي. أودّ أن أقول: أبلّغك سلامًا من القاهرة.'
    en: 'For example: Excuse me, Pak. I''d like to say something. I bring greetings from Cairo.'
  - speaker: Mas Galih
    text: PR-mu, tulisen pesen kagem Pak Sastro ing pelajaran, nganggo krama andhap.
    ar_eg: واجبك، اكتب رسالة لپاك ساسترو في الدرس، بالكراما أنداپ.
    ar: 'واجبك: اكتب رسالة إلى باك ساسترو في الدرس بالكراما أنداب.'
    en: 'Your homework: write a message to Pak Sastro in the lesson, using krama andhap.'
  - speaker: Mbak Sekar
    text: Sesuk kita dhateng Taman Sari. Nganti pinanggih malih!
    ar_eg: بكرة رايحين تامان ساري. إلى اللقاء!
    ar: غدًا نذهب إلى تامان ساري. إلى اللقاء!
    en: Tomorrow we go to Taman Sari. Until next time!
