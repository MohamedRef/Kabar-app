title:
  target: Saben Dina
  ar_eg: كل يوم
  ar: كلّ يوم
  en: Every day
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Telaga Sarangan
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saka telaga Sarangan, Magetan! Hawane adhem, ana pedhut ing gunung. Aku Sekar.
    ar_eg: صباح الخير من بحيرة سارانجان في ماجيتان! الجوّ بارد وفيه شبّورة على الجبل. أنا سيكار.
    ar: صباح الخير من بحيرة سارانغان في ماغيتان! الجوّ بارد والضباب على الجبل. أنا سيكار.
    en: Good morning from Lake Sarangan, Magetan! It's cold, with mist on the mountain.
    note:
      ar_eg: "بحيرة سارانجان على سفح جبل لاوو، بيروحها الناس عشان الجوّ البارد وركوب الحصان والمراكب. كلمات: adhem = ساقع / بارد."
      ar: "تقع بحيرة سارانغان على سفح جبل لاوو، يقصدها الناس للجوّ البارد وركوب الخيل والقوارب. مفردات: adhem = بارد."
      en: "Lake Sarangan lies on the slope of Mount Lawu; people go for the cool air, horse rides and boats. Words: adhem = cold, cool = dingin, adem."
  - speaker: Mas Danang
    text: Aku Danang. Aku tangi jam papat esuk kanggo siaran iki! Isih ngantuk.
    ar_eg: أنا دانانج. صحيت الساعة أربعة الفجر عشان البرنامج ده! لسّه نعسان.
    ar: أنا دانانغ. استيقظت في الرابعة فجرًا لهذا البثّ! ما زلت نعسانًا.
    en: I'm Danang. I got up at four in the morning for this show! Still sleepy.
    note:
      ar_eg: "كلمات: kanggo = لـ، عشان (نغوكو)؛ siaran = بث، إذاعة."
      ar: "مفردات: kanggo = لِـ، من أجل (نغوكو)؛ siaran = بثّ، برنامج."
      en: "Words: kanggo = for (ngoko) = untuk; siaran = broadcast, programme."
  - speaker: Mbak Sekar
    text: "Dina iki: tangi, adus, mangkat. Lan ngongkon wong kanthi alus."
    ar_eg: "النهارده: نصحى، نستحمّى، نخرج. وإزّاي نطلب من حدّ حاجة بلطف."
    ar: "اليوم: نستيقظ ونستحمّ ونخرج. وكيف نطلب من أحدهم شيئًا بلطف."
    en: "Today: get up, wash, head out. And how to ask someone nicely."
    note:
      ar_eg: "كلمات: alus = رقيق، ناعم؛ kanthi = بـ / عن طريق (في الكتابة)."
      ar: "مفردات: alus = رقيق، ليّن، مهذّب؛ kanthi = بـ / عن طريق (في الكتابة)."
      en: "Words: alus = gentle, refined; kanthi = by means of, with (written) = dengan."
- kind: dialogue
  title: Dina-dinane Danang
  lines:
  - speaker: Mbak Sekar
    text: Danang, critakna dinamu. Saben esuk, kowe ngapa wae?
    ar_eg: يا دانانج، احكيلنا يومك. كل صبح بتعمل إيه؟
    ar: يا دانانغ، حدّثنا عن يومك. ماذا تفعل كلّ صباح؟
    en: Danang, tell us about your day. What do you do every morning?
    note:
      ar_eg: "كلمات: critakna = احكيها (أمر)."
      ar: "مفردات: critakna = احكِها (أمر)."
      en: "Words: critakna = tell it (imperative) = ceritakan."
  - speaker: Mas Danang
    text: Aku tangi jam lima, banjur adus, banjur salat.
    ar_eg: بصحى الساعة خمسة، وبعدين أستحمّى، وبعدين أصلّي.
    ar: أستيقظ في الخامسة، ثمّ أستحمّ، ثمّ أصلّي.
    en: I get up at five, then shower, then pray.
    note:
      ar_eg: "كلمات: banjur = وبعدين (في الحكي)."
      ar: "مفردات: banjur = ثم (في السرد)."
      en: "Words: banjur = then (lalu), in storytelling."
  - speaker: Mbak Sekar
    text: Sarapan apa?
    ar_eg: بتفطر إيه؟
    ar: ماذا تفطر؟
    en: What do you have for breakfast?
  - speaker: Mas Danang
    text: Biasane sega pecel lan kopi. Jam pitu aku mangkat nyambut gawe numpak motor.
    ar_eg: عادةً رز بيتشيل وقهوة. الساعة سبعة بنزل الشغل بالموتوسيكل.
    ar: عادةً أرز بيتشيل وقهوة. وفي السابعة أذهب إلى العمل بالدرّاجة النارية.
    en: Usually nasi pecel and coffee. At seven I leave for work by motorbike.
    note:
      ar_eg: "كلمات: numpak = يركب (مواصلة)؛ pecel = بيتشل (خضار مسلوقة بصوص فول سوداني)."
      ar: "مفردات: numpak = يركب (وسيلة نقل)؛ pecel = بيتشل، خضار بصلصة الفول السوداني."
      en: "Words: numpak = ride, take (transport) = naik; pecel = pecel (boiled vegetables with peanut sauce)."
  - speaker: Mbak Sekar
    text: Lan sore?
    ar_eg: والعصر؟
    ar: والعصر؟
    en: And afternoon?
  - speaker: Mas Danang
    text: Aku mulih jam lima. Ibuku mesthi ngomong, "Le, mangana sik! Aja langsung turu!"
    ar_eg: 'بروّح الساعة خمسة. أمّي دايمًا تقول: «يا ابني، كُل الأوّل! ماتنامش على طول!»'
    ar: 'أعود في الخامسة. وأمّي تقول دائمًا: «يا بنيّ، كُلْ أوّلًا! لا تنم فورًا!»'
    en: I get home at five. My mum always says, "Son, eat first! Don't go straight to sleep!"
    note:
      ar_eg: "Le = اختصار thole، نداء للولد الصغيّر، زي «يا حبيبي» من الأمّ. mangana = كُل (أمر). كلمات: langsung = على طول، علطول؛ mesthi = أكيد / لازم."
      ar: "Le = اختصار thole، نداء للصبيّ كما تنادي الأمّ «يا حبيبي». وmangana = كُلْ (أمر). مفردات: langsung = مباشرةً، فورًا؛ mesthi = بالتأكيد / لا بدّ."
      en: "Le = short for thole, how a mum calls her boy. Mangana = eat (command). Words: langsung = straight away, directly; mesthi = surely, definitely = pasti."
  - speaker: Mbak Sekar
    text: Ibumu apik banget. Lan kowe mbantu ing omah?
    ar_eg: مامتك طيّبة أوي. وانت بتساعد في البيت؟
    ar: أمّك طيّبة جدًّا. وهل تساعد في البيت؟
    en: Your mum is so sweet. And do you help at home?
  - speaker: Mas Danang
    text: Kadhang-kadhang. Ibu ngomong, "Le, tukokna gula ing warung, ya." Utawa, "Kembange disirami, ta."
    ar_eg: 'ساعات. ماما تقول: «يا ابني، اشتريلي سكّر من الدكّان.» أو: «ما تسقي الورد.»'
    ar: 'أحيانًا. تقول أمّي: «يا بنيّ، اشترِ لي سكّرًا من الدكّان.» أو: «اسقِ الزهور.»'
    en: Sometimes. Mum says, "Son, buy me some sugar at the shop." Or, "Water the flowers, will you."
    note:
      ar_eg: "كلمات: gula = سكر؛ disirami = اتسقى، اتروى."
      ar: "مفردات: gula = سكر؛ disirami = سُقي."
      en: "Words: gula = sugar; disirami = watered."
  - speaker: Mbak Sekar
    text: Krungu ta, Mas Mohamed? Ana "ya" lan "ta" ing pungkasan. Prentah tanpa iku krungune kasar.
    ar_eg: سمعت يا ماس محمد؟ فيه «ya» و«ta» في الآخر. الأمر من غيرهم بيبان خشن.
    ar: أسمعت يا ماس محمد؟ في الآخر «ya» و«ta». والأمر بدونهما يبدو خشنًا.
    en: Hear that, Mas Mohamed? There's "ya" and "ta" at the end. A command without them sounds harsh.
    note:
      ar_eg: "كلمات: kasar = خشن، قليل الذوق."
      ar: "مفردات: kasar = فظّ، خشن."
      en: "Words: kasar = rough, rude, coarse."
  - speaker: Mas Danang
    text: "Bener. \"Tukokna gula!\" kaya nesu. \"Tukokna gula, ya\" kaya ibu."
    ar_eg: "صحّ. «اشتري سكّر!» كأنها زعلانة. «اشتريلي سكّر، ماشي؟» كأنها أمّ."
    ar: "صحيح. «اشترِ سكّرًا!» كأنّها غاضبة. و«اشترِ لي سكّرًا، حسنًا؟» كأنّها أمّ."
    en: "Right. \"Buy sugar!\" sounds angry. \"Buy some sugar, ya\" sounds like mum."
    note:
      ar_eg: "كلمات: kaya = زي، كأنّ؛ nesu = زعلان ومتعصّب."
      ar: "مفردات: kaya = مثل؛ nesu = غاضب."
      en: "Words: kaya = like, as = seperti; nesu = angry, cross."
- kind: word_spotlight
  title: Mangana, panganen, tukokna
  lines:
  - speaker: Mbak Sekar
    text: '-a: mangana, turua, adusa. Kanggo kegiatan sing kudu ditindakake.'
    ar_eg: '-a: كُل، نام، استحمّى. للحاجة اللي لازم تتعمل.'
    ar: '-a: كُلْ، نَمْ، استحمّ. للفعل الواجب فعله.'
    en: '-a: mangana, turua, adusa. For something that should get done.'
    note:
      ar_eg: "كلمات: kudu = لازم."
      ar: "مفردات: kudu = يجب."
      en: "Words: kudu = must = harus."
  - speaker: Mas Danang
    text: '-en: panganen, wacanen, ombenen. Kanggo barange. Panganen pecele!'
    ar_eg: '-en: كُله، اقراه، اشربه. للحاجة نفسها. كُل البيتشيل!'
    ar: '-en: كُلْه، اقرأه، اشربه. للشيء نفسه. كُلِ البيتشيل!'
    en: '-en: panganen, wacanen, ombenen. For the thing itself. Eat the pecel!'
    note:
      ar_eg: "-a = اعمل الفعل (من غير مفعول). -en = اعمل الفعل في الحاجة دي (المفعول واضح). -na / -ke = اعمله لحدّ أو حاجة: tukokna = اشتريه (لحدّ). كلمات: pecele = البيتشل (pecel + -e)."
      ar: "-a = افعل (بلا مفعول). -en = افعل بهذا الشيء (المفعول معلوم). -na / -ke = افعله لأجل أحد: tukokna = اشترِه (لأحدهم). مفردات: pecele = البيتشل (pecel + -e)."
      en: "-a = do it (no object). -en = do it to this thing. -na / -ke = do it for someone: tukokna = buy it (for someone). Words: pecele = the pecel (pecel + -e)."
  - speaker: Mbak Sekar
    text: '-na: tukokna, gawekna, jupukna. Kanggo wong liya.'
    ar_eg: '-na: اشتريله، اعمله، هاته. عشان حدّ تاني.'
    ar: '-na: اشترِ له، اصنع له، أحضر له. لأجل غيرك.'
    en: '-na: tukokna, gawekna, jupukna. For someone else.'
    note:
      ar_eg: "كلمات: liya = تاني، غير."
      ar: "مفردات: liya = آخر، غير."
      en: "Words: liya = other, different."
  - speaker: Mas Danang
    text: 'Lan -i: nyirami, nekani, nyapu ora. Nyirami kembang, nekani kanca.'
    ar_eg: 'و-i: يسقي، يزور. nyirami الورد، nekani صاحب.'
    ar: 'و-i: يسقي، يزور. nyirami الزهور، nekani صديقًا.'
    en: 'And -i: nyirami, nekani. Water the flowers, visit a friend.'
  - speaker: Mbak Sekar
    text: Tangi, adus, sarapan, mangkat, mulih, turu. Saben dina!
    ar_eg: يصحى، يستحمّى، يفطر، ينزل، يروّح، ينام. كل يوم!
    ar: يستيقظ، يستحمّ، يفطر، يخرج، يعود، ينام. كلّ يوم!
    en: Get up, shower, breakfast, leave, come home, sleep. Every day!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Aku tangi jam lima.
    ar_eg: بصحى الساعة خمسة.
    ar: أستيقظ في الخامسة.
    en: I get up at five.
  - speaker: Mas Danang
    text: Aku tangi jam lima.
    ar_eg: بصحى الساعة خمسة.
    ar: أستيقظ في الخامسة.
    en: I get up at five.
  - speaker: Mbak Sekar
    text: Mangana sik, ya.
    ar_eg: كُل الأوّل، ماشي.
    ar: كُلْ أوّلًا، حسنًا.
    en: Eat first, okay.
  - speaker: Mas Danang
    text: Mangana sik, ya.
    ar_eg: كُل الأوّل، ماشي.
    ar: كُلْ أوّلًا، حسنًا.
    en: Eat first, okay.
  - speaker: Mbak Sekar
    text: Tukokna gula, ya.
    ar_eg: اشتريلي سكّر، ماشي.
    ar: اشترِ لي سكّرًا، حسنًا.
    en: Buy me some sugar, okay.
  - speaker: Mas Danang
    text: Tukokna gula, ya.
    ar_eg: اشتريلي سكّر، ماشي.
    ar: اشترِ لي سكّرًا، حسنًا.
    en: Buy me some sugar, okay.
  - speaker: Mbak Sekar
    text: Kembange disirami, ta.
    ar_eg: ما تسقي الورد.
    ar: اسقِ الزهور.
    en: Water the flowers, will you.
  - speaker: Mas Danang
    text: Kembange disirami, ta.
    ar_eg: ما تسقي الورد.
    ar: اسقِ الزهور.
    en: Water the flowers, will you.
  - speaker: Mbak Sekar
    text: Aku mulih jam lima sore.
    ar_eg: بروّح الساعة خمسة العصر.
    ar: أعود في الخامسة عصرًا.
    en: I come home at five pm.
  - speaker: Mas Danang
    text: Aku mulih jam lima sore.
    ar_eg: بروّح الساعة خمسة العصر.
    ar: أعود في الخامسة عصرًا.
    en: I come home at five pm.
  - speaker: Mbak Sekar
    text: Wacanen bukune, ya.
    ar_eg: اقرا الكتاب، ماشي.
    ar: اقرأ الكتاب، حسنًا.
    en: Read the book, okay.
  - speaker: Mas Danang
    text: Wacanen bukune, ya.
    ar_eg: اقرا الكتاب، ماشي.
    ar: اقرأ الكتاب، حسنًا.
    en: Read the book, okay.
- kind: outro
  title: Dinane Mas Mohamed
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, critakna dinamu wiwit tangi nganti turu. Nganggo "banjur", ya.
    ar_eg: يا ماس محمد، احكيلنا يومك من ساعة ما تصحى لحدّ ما تنام. استخدم «banjur».
    ar: يا ماس محمد، حدّثنا عن يومك من الاستيقاظ إلى النوم. استعمل «banjur».
    en: Mas Mohamed, tell us your day from waking up to sleeping. Use "banjur".
    note:
      ar_eg: دورك! banjur = وبعدين. وجرّب أمر واحد لطيف بـ«ya» في الآخر.
      ar: دورك! banjur = ثمّ. وجرّب أمرًا لطيفًا واحدًا تختمه بـ«ya».
      en: Your turn! Banjur = then. And try one gentle command ending with "ya".
  - speaker: Mbak Sekar
    text: 'Contone: Aku tangi jam enem, banjur salat, banjur sarapan ful.'
    ar_eg: 'مثلًا: بصحى الساعة ستّة، وبعدين أصلّي، وبعدين أفطر فول.'
    ar: 'مثلًا: أستيقظ في السادسة، ثمّ أصلّي، ثمّ أفطر فولًا.'
    en: 'For example: I get up at six, then pray, then have ful for breakfast.'
  - speaker: Mas Danang
    text: PR-mu, wacanen layang saka ibu ing pelajaran, lan golekana prentah papat.
    ar_eg: واجبك، اقرا جواب الأمّ في الدرس، ودوّر على أربع أوامر.
    ar: 'واجبك: اقرأ رسالة الأمّ في الدرس وابحث عن أربعة أوامر.'
    en: 'Your homework: read the letter from mum in the lesson and find four commands.'
  - speaker: Mbak Sekar
    text: Sesuk kita menyang Ngawi, dolan-dolan ing benteng lawas. Nganti ketemu!
    ar_eg: بكرة رايحين نجاوي، نتفسّح في القلعة القديمة. نتقابل!
    ar: غدًا نذهب إلى نغاوي لنتنزّه في القلعة القديمة. إلى اللقاء!
    en: Tomorrow we go to Ngawi to wander the old fort. See you!
    note:
      ar_eg: "كلمات: benteng = حصن، سور؛ lawas = قديم (للحاجات)."
      ar: "مفردات: benteng = حصن، سور؛ lawas = قديم (للأشياء)."
      en: "Words: benteng = fort, fort wall; lawas = old (of things) = lama."
