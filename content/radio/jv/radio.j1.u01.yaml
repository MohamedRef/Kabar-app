id: radio.j1.u01
language: jv
level: j1
unit: j1.u01
title:
  target: Piye kabare, rek?
  ar_eg: أخبارك إيه يا جدع؟
  ar: كيف حالك يا صاحبي؟
  en: How are you, mate?
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pasar Turi
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saka Pasar Turi, Suroboyo! Iki Kabar Radio basa Jawa. Aku Sekar.
    ar_eg: صباح الخير من سوق توري في سورابايا! ده كبار راديو بالجاوي. أنا سيكار.
    ar: صباح الخير من سوق توري في سورابايا! هذا كبار راديو بالجاوية. أنا سيكار.
    en: Good morning from Pasar Turi, Surabaya! This is Kabar Radio in Javanese. I'm Sekar.
    note:
      ar_eg: سيكار من يوجيا، ودانانج من ماديون. الاتنين بيتكلّموا جاوي «ماتارامان»، الجاوي اللي هتتعلّمه.
      ar: سيكار من يوغيا، ودانانغ من ماديون، وكلاهما يتكلّم جاوية «ماتارامان»، وهي التي ستتعلّمها.
      en: Sekar is from Yogyakarta and Danang from Madiun. Both speak Mataraman Javanese, the Javanese you'll learn.
  - speaker: Mas Danang
    text: Aku Danang, wong Madiun asli. Piye kabare, Mas?
    ar_eg: أنا دانانج، ابن ماديون أصلي. أخبارك إيه يا ماس؟
    ar: أنا دانانغ، ابن ماديون الأصيل. كيف حالك يا ماس؟
    en: I'm Danang, Madiun born and bred. How are you, Mas?
  - speaker: Mbak Sekar
    text: Mas Mohamed, sugeng rawuh ing Jawa Timur. Dina iki kita sinau nyapa kanca.
    ar_eg: يا ماس محمد، أهلًا بيك في جاوة الشرقية. النهارده هنتعلّم نسلّم على الصحاب.
    ar: يا ماس محمد، مرحبًا بك في جاوة الشرقية. اليوم نتعلّم تحيّة الأصدقاء.
    en: Mas Mohamed, welcome to East Java. Today we learn to greet friends.
  - speaker: Mas Danang
    text: Pasar Turi rame banget esuk iki. Akeh wong adol klambi lan kain.
    ar_eg: سوق توري زحمة أوي الصبح ده. ناس كتير بتبيع هدوم وقماش.
    ar: سوق توري مزدحم جدًّا هذا الصباح. كثيرون يبيعون الملابس والأقمشة.
    en: Pasar Turi is really busy this morning. Lots of people selling clothes and cloth.
- kind: dialogue
  title: Ketemu kanca ing bis
  lines:
  - speaker: Mbak Sekar
    text: Danang, ayo dolanan. Aku dadi bocah anyar, kowe dadi kanca ing Suroboyo Bus.
    ar_eg: يا دانانج، يلّا نمثّل. أنا أبقى واحدة جديدة، وانت صاحبي في أتوبيس سورابايا.
    ar: يا دانانغ، هيّا نمثّل. أنا وافدة جديدة، وأنت صديق في حافلة سورابايا.
    en: Danang, let's role-play. I'm the new kid, you're a friend on the Suroboyo Bus.
    note:
      ar_eg: Suroboyo Bus أتوبيس المدينة الأحمر. لمّا اشتغل كان ممكن تدفع بزجاجات بلاستيك فاضية!
      ar: حافلة Suroboyo Bus الحمراء هي حافلة المدينة، وعند إطلاقها كان يمكن الدفع بقوارير بلاستيكية فارغة!
      en: The red Suroboyo Bus is the city bus; at launch you could pay with empty plastic bottles!
  - speaker: Mas Danang
    text: Lho, Mbak! Piye kabare? Suwe ora ketemu!
    ar_eg: إيه ده يا مباك! أخبارك إيه؟ من زمان ما شفناكيش!
    ar: يا مباك! كيف حالك؟ منذ زمن لم نلتقِ!
    en: Hey, Mbak! How are you? Long time no see!
  - speaker: Mbak Sekar
    text: Apik, Cak. Suwun. Kowe piye?
    ar_eg: كويسة يا تشاك. تسلم. وانت عامل إيه؟
    ar: بخير يا تشاك. شكرًا. وأنت كيف حالك؟
    en: Good, Cak. Thanks. How about you?
  - speaker: Mas Danang
    text: Apik, rek. Aku arep nang Tunjungan. Kowe arep nang endi?
    ar_eg: تمام يا جدعان. أنا رايح تونجونجان. وانتي رايحة فين؟
    ar: بخير. أنا ذاهب إلى تونجونغان. وأنتِ إلى أين؟
    en: Good. I'm off to Tunjungan. Where are you heading?
  - speaker: Mbak Sekar
    text: Aku arep nang Pasar Turi, tuku kain kanggo ibuku.
    ar_eg: أنا رايحة سوق توري، أشتري قماش لأمّي.
    ar: أنا ذاهبة إلى سوق توري لأشتري قماشًا لأمّي.
    en: I'm going to Pasar Turi to buy cloth for my mum.
  - speaker: Mas Danang
    text: Wah, apik. Salam kanggo ibumu, ya!
    ar_eg: حلو. سلّميلي على مامتك!
    ar: جميل. سلّمي على أمّك!
    en: Nice. Say hi to your mum!
  - speaker: Mbak Sekar
    text: Iya, Cak. Matur nuwun. Ati-ati, ya!
    ar_eg: حاضر يا تشاك. متشكّرة. خلّي بالك من نفسك!
    ar: حسنًا يا تشاك. شكرًا. اعتنِ بنفسك!
    en: Sure, Cak. Thank you. Take care!
  - speaker: Mas Danang
    text: Mas Mohamed, krungu ta? Karo kanca, cukup "aku" lan "kowe".
    ar_eg: يا ماس محمد، سمعت؟ مع الصحاب، كفاية «aku» و«kowe».
    ar: يا ماس محمد، أسمعت؟ مع الأصدقاء يكفي «aku» و«kowe».
    en: Mas Mohamed, did you hear? With friends, "aku" and "kowe" are enough.
    note:
      ar_eg: aku = أنا، kowe = انت (للصحاب واللي أصغر منك). مع الكبار هتتعلّم كلمات تانية بعدين.
      ar: aku = أنا، وkowe = أنت (للأصدقاء ومن هم أصغر). ومع الكبار ستتعلّم كلمات أخرى لاحقًا.
      en: aku = I, kowe = you (friends and younger people). With elders you'll learn other words later.
- kind: word_spotlight
  title: Mas, mbak, cak, rek
  lines:
  - speaker: Mbak Sekar
    text: Mas kanggo wong lanang sing luwih tuwa sithik. Mbak kanggo wong wadon.
    ar_eg: «ماس» للراجل اللي أكبر منك شويّة. «مباك» للست.
    ar: «ماس» للرجل الأكبر قليلًا. «مباك» للمرأة.
    en: Mas is for a man a bit older than you. Mbak is for a woman.
  - speaker: Mas Danang
    text: Cak iku cara Suroboyo kanggo "mas". Cak Heru, Cak Mat.
    ar_eg: «تشاك» دي طريقة سورابايا بدل «ماس». تشاك هيرو، تشاك مات.
    ar: «تشاك» طريقة سورابايا بدل «ماس». تشاك هيرو، تشاك مات.
    en: Cak is Surabaya's way of saying mas. Cak Heru, Cak Mat.
  - speaker: Mas Danang
    text: Lan rek, saka tembung arek, bocah. Ayo, rek! Piye, rek?
    ar_eg: و«rek» جاية من «arek» يعني عيّل. يلّا يا جدعان! إيه يا جدع؟
    ar: و«rek» من «arek» أي ولد. هيّا يا رفاق! ما الأمر يا صاحبي؟
    en: And rek comes from arek, kid. Come on, guys! What's up, mate?
    note:
      ar_eg: «rek» بتيجي في آخر نصّ الجمل في سورابايا، زي «يا جدع» عندنا. ودّية مش قلّة أدب.
      ar: تأتي «rek» في آخر نصف الجمل في سورابايا، مثل «يا صاحبي». وهي ودّية لا وقحة.
      en: Rek ends half the sentences in Surabaya, like "mate". It's friendly, not rude.
  - speaker: Mbak Sekar
    text: Lan wangsulane "Piye kabare?" gampang. Apik, apik-apik wae, utawa lumayan.
    ar_eg: والردّ على «أخبارك إيه؟» سهل. كويس، كويس الحمد لله، أو ماشي الحال.
    ar: والجواب عن «كيف حالك؟» سهل. بخير، بخير تمامًا، أو لا بأس.
    en: And the answer to "Piye kabare?" is easy. Good, all good, or not bad.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Piye kabare?
    ar_eg: أخبارك إيه؟
    ar: كيف حالك؟
    en: How are you?
  - speaker: Mas Danang
    text: Piye kabare?
    ar_eg: أخبارك إيه؟
    ar: كيف حالك؟
    en: How are you?
  - speaker: Mbak Sekar
    text: Apik, suwun. Kowe piye?
    ar_eg: كويس، متشكّر. وانت؟
    ar: بخير، شكرًا. وأنت؟
    en: Good, thanks. And you?
  - speaker: Mas Danang
    text: Apik, suwun. Kowe piye?
    ar_eg: كويس، متشكّر. وانت؟
    ar: بخير، شكرًا. وأنت؟
    en: Good, thanks. And you?
  - speaker: Mbak Sekar
    text: Suwe ora ketemu!
    ar_eg: من زمان ما اتقابلناش!
    ar: منذ زمن لم نلتقِ!
    en: Long time no see!
  - speaker: Mas Danang
    text: Suwe ora ketemu!
    ar_eg: من زمان ما اتقابلناش!
    ar: منذ زمن لم نلتقِ!
    en: Long time no see!
  - speaker: Mbak Sekar
    text: Ati-ati, ya!
    ar_eg: خلّي بالك من نفسك!
    ar: اعتنِ بنفسك!
    en: Take care!
  - speaker: Mas Danang
    text: Ati-ati, ya!
    ar_eg: خلّي بالك من نفسك!
    ar: اعتنِ بنفسك!
    en: Take care!
  - speaker: Mbak Sekar
    text: Sugeng enjing, Mbak!
    ar_eg: صباح الخير يا مباك!
    ar: صباح الخير يا مباك!
    en: Good morning, Mbak!
  - speaker: Mas Danang
    text: Sugeng enjing, Mbak!
    ar_eg: صباح الخير يا مباك!
    ar: صباح الخير يا مباك!
    en: Good morning, Mbak!
  - speaker: Mbak Sekar
    text: Matur nuwun, Cak.
    ar_eg: متشكّر يا تشاك.
    ar: شكرًا يا تشاك.
    en: Thank you, Cak.
  - speaker: Mas Danang
    text: Matur nuwun, Cak.
    ar_eg: متشكّر يا تشاك.
    ar: شكرًا يا تشاك.
    en: Thank you, Cak.
  - speaker: Mas Danang
    text: Lan eling, "suwun" iku cekakan saka "matur nuwun". Karo kanca, suwun cukup. Karo wong tuwa, matur nuwun.
    ar_eg: وافتكر، «suwun» اختصار «matur nuwun». مع الصحاب suwun كفاية، ومع الكبار matur nuwun.
    ar: وتذكّر أنّ «suwun» اختصار «matur nuwun». مع الأصدقاء تكفي suwun، ومع الكبار matur nuwun.
    en: And remember, "suwun" is short for "matur nuwun". With friends suwun is enough; with elders, matur nuwun.
- kind: outro
  title: Gilirane Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki gilirane sampeyan. Sapa kanca ing radio iki, nganggo "Piye kabare, rek?"
    ar_eg: يا ماس محمد، دلوقتي دورك. سلّم على صحابك في الراديو بـ«Piye kabare, rek?»
    ar: يا ماس محمد، الآن دورك. حيِّ أصدقاءك في الراديو بـ«Piye kabare, rek?»
    en: Mas Mohamed, now it's your turn. Greet your friends on the radio with "Piye kabare, rek?"
    note:
      ar_eg: دورك! قول الجملة بصوت عالي، وبعدها ردّ على نفسك بـ«Apik, suwun».
      ar: دورك! قل الجملة بصوت عالٍ، ثمّ أجب نفسك بـ«Apik, suwun».
      en: Your turn! Say it out loud, then answer yourself with "Apik, suwun".
  - speaker: Mas Danang
    text: PR-mu, sesuk sapa wong telu nganggo basa Jawa. Mas, mbak, utawa cak!
    ar_eg: واجبك، بكرة سلّم على تلات أشخاص بالجاوي. ماس أو مباك أو تشاك!
    ar: 'واجبك: غدًا حيِّ ثلاثة أشخاص بالجاوية. ماس أو مباك أو تشاك!'
    en: 'Your homework: tomorrow, greet three people in Javanese. Mas, mbak or cak!'
  - speaker: Mbak Sekar
    text: Matur nuwun wis ngrungokake Kabar Radio. Nganti ketemu maneh!
    ar_eg: متشكّرين إنك سمعت كبار راديو. نتقابل تاني!
    ar: شكرًا لاستماعك إلى كبار راديو. إلى اللقاء!
    en: Thank you for listening to Kabar Radio. See you again!
  - speaker: Mbak Sekar
    text: Mas Mohamed, sampeyan wis apik banget dina iki. Sesuk kita kenalan karo wong anyar.
    ar_eg: يا ماس محمد، انت كنت حلو أوي النهارده. بكرة هنتعرّف على ناس جديدة.
    ar: يا ماس محمد، كنت رائعًا اليوم. غدًا نتعرّف إلى أناس جدد.
    en: Mas Mohamed, you did really well today. Tomorrow we meet new people.
  - speaker: Mas Danang
    text: Suwun, rek! Sesuk kita nang stasiun Gubeng!
    ar_eg: تسلموا يا جدعان! بكرة رايحين محطّة جوبينج!
    ar: شكرًا يا رفاق! غدًا نذهب إلى محطّة غوبينغ!
    en: Cheers, everyone! Tomorrow we're off to Gubeng station!
