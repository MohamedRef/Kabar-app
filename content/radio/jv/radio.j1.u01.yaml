title:
  target: Piye kabare, Mas?
  ar_eg: أخبارك إيه يا ماس؟
  ar: كيف حالك يا ماس؟
  en: How are you, Mas?
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Malioboro
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saka Malioboro, Jogja! Iki Kabar Radio basa Jawa. Aku Sekar, wong Jogja asli.
    ar_eg: صباح الخير من ماليوبورو في جوجا! ده كبار راديو بالجاوي. أنا سيكار، بنت جوجا أصلي.
    ar: صباح الخير من ماليوبورو في جوغجا! هذا كبار راديو بالجاوية. أنا سيكار، ابنة جوغجا الأصيلة.
    en: Good morning from Malioboro, Jogja! This is Kabar Radio in Javanese. I'm Sekar, Jogja born and bred.
    note:
      ar_eg: "سيكار من جوجا، ودانانج من ماديون. الاتنين بيتكلّموا جاوي «ماتارامان»، جاوي الشارع اللي هتتعلّمه. كلمات: wong = شخص، واحد (= orang)؛ iki = ده / دي (= ini)؛ saka = من (= dari)؛ basa = لغة (= bahasa)؛ asli = أصلي؛ malioboro = ماليوبورو، أشهر شارع في يوجياكرتا."
      ar: "سيكار من جوغجا، ودانانغ من ماديون، وكلاهما يتكلّم جاوية «ماتارامان»، جاوية الشارع التي ستتعلّمها. مفردات: wong = شخص (= orang)؛ iki = هذا / هذه (= ini)؛ saka = من (= dari)؛ basa = لغة (= bahasa)؛ asli = أصيل، أصلي؛ malioboro = ماليوبورو، شارع شهير في يوغياكارتا."
      en: "Sekar is from Jogja and Danang from Madiun. Both speak Mataraman Javanese, the street Javanese you'll learn. Words: wong = person (= orang); iki = this (= ini); saka = from (= dari); basa = language (= bahasa); asli = original, born and bred; malioboro = Malioboro, the famous street in Yogyakarta."
  - speaker: Mas Danang
    text: Aku Danang, saka Madiun. Piye kabare, Mas?
    ar_eg: أنا دانانج، من ماديون. أخبارك إيه يا ماس؟
    ar: أنا دانانغ، من ماديون. كيف حالك يا ماس؟
    en: I'm Danang, from Madiun. How are you, Mas?
  - speaker: Mbak Sekar
    text: Mas Mohamed, sugeng rawuh ing Jogja. Dina iki kita sinau nyapa kanca, kaya wong ing dalan.
    ar_eg: يا ماس محمد، أهلًا بيك في جوجا. النهارده هنتعلّم نسلّم على الصحاب، زي الناس في الشارع.
    ar: يا ماس محمد، مرحبًا بك في جوغجا. اليوم نتعلّم تحيّة الأصدقاء كما يفعل الناس في الشارع.
    en: Mas Mohamed, welcome to Jogja. Today we learn to greet friends, the way people do on the street.
    note:
      ar_eg: "كلمات: ing = في (= di)، رسمي ومكتوب؛ dalan = طريق / شارع (= jalan)؛ dina = يوم، نهار؛ kaya = زي، كأنّ."
      ar: "مفردات: ing = في (= di)، رسمي ومكتوب؛ dalan = طريق (= jalan)؛ dina = يوم؛ kaya = مثل."
      en: "Words: ing = in, at (= di), formal / written; dalan = road, way (= jalan); dina = day; kaya = like, as = seperti."
  - speaker: Mas Danang
    text: Malioboro wis rame esuk iki. Ana andong, becak, lan bakul jajan neng pinggir dalan.
    ar_eg: ماليوبورو زحمة من الصبح. فيه حناطير وبيچاك وبيّاعين أكل على جنب الشارع.
    ar: ماليوبورو مزدحم منذ الصباح. عربات خيل وعربات بيتشاك وباعة طعام على جانب الطريق.
    en: Malioboro's already busy this morning. Horse carts, becaks and snack sellers along the road.
    note:
      ar_eg: "كلمات: neng = لـ / في (= ke / di)؛ في الشات ng؛ wis = خلاص، قبل كده (حصل)؛ ana = فيه / موجود (= ada)؛ bakul = بيّاع (= pedagang)؛ becak = بيتشاك (عجلة بتلات عجلات بسوّاق)؛ jajan = سناكس، حاجة حلوة."
      ar: "مفردات: neng = إلى / في (= ke / di)؛ وفي الدردشة ng؛ wis = قد، بالفعل؛ ana = يوجد (= ada)؛ bakul = بائع (= pedagang)؛ becak = ريكشا بثلاث عجلات؛ jajan = وجبة خفيفة، حلوى."
      en: "Words: neng = to, at (= ke / di); chat ng; wis = already; ana = there is, to exist (= ada); bakul = seller, vendor (= pedagang); becak = becak, pedicab; jajan = snack, treat."
- kind: dialogue
  title: Ketemu kanca neng angkringan
  lines:
  - speaker: Mbak Sekar
    text: Danang, ayo dolanan. Aku bocah anyar, kowe kancaku neng angkringane Mas Heru.
    ar_eg: يا دانانج، يلّا نمثّل. أنا واحدة جديدة، وانت صاحبي في أنجكرينجان ماس هيرو.
    ar: يا دانانغ، هيّا نمثّل. أنا وافدة جديدة، وأنت صديقي عند عربة ماس هيرو.
    en: Danang, let's role-play. I'm new in town, you're my friend at Mas Heru's angkringan.
    note:
      ar_eg: "angkringan = عربية أكل في الشارع: أكل رخيص وشاي سخن وقعدة على دكك خشب. أشهر قعدة في جوجا. كلمات: anyar = جديد؛ bocah = عيل، واد؛ dolanan = يلعب."
      ar: "angkringan = عربة طعام في الشارع: أكل رخيص وشاي ساخن وجلسة على مقاعد خشبية. أشهر جلسة في جوغجا. مفردات: anyar = جديد؛ bocah = ولد، فتى؛ dolanan = يلعب."
      en: "An angkringan is a street cart with cheap food, hot tea and wooden benches. Jogja's favourite hangout. Words: anyar = new = baru; bocah = kid, lad (= anak); dolanan = to play (bermain)."
  - speaker: Mas Danang
    text: Lho, Mbak! Piye kabare? Suwe ra ketemu!
    ar_eg: إيه ده يا مباك! أخبارك إيه؟ من زمان ما اتقابلناش!
    ar: يا مباك! كيف حالك؟ منذ زمن لم نلتقِ!
    en: Hey, Mbak! How are you? Long time no see!
    note:
      ar_eg: "ra = ora (مش) مختصرة، وكده بيقولوها في الشارع. كلمات: suwe = وقت طويل، يتأخّر؛ lho = على فكرة! / إيه ده!"
      ar: "ra = ora (لا) مختصرة، وهكذا تُقال في الشارع. مفردات: suwe = طويل (زمنًا)؛ lho = للتنبيه أو الدهشة."
      en: "Ra = ora (not), shortened, the way it's said on the street. Words: suwe = long (time) = lama; lho = you know! / oh!"
  - speaker: Mbak Sekar
    text: Apik, Mas. Suwun. Kowe piye?
    ar_eg: كويسة يا ماس. تسلم. وانت عامل إيه؟
    ar: بخير يا ماس. شكرًا. وأنت كيف حالك؟
    en: Good, Mas. Thanks. How about you?
  - speaker: Mas Danang
    text: Apik wae. Aku lagi ngenteni wedang jahe. Kowe arep neng endi?
    ar_eg: تمام. أنا مستنّي الشاي بالجنزبيل. انتي رايحة فين؟
    ar: بخير. أنتظر مشروب الزنجبيل. وأنتِ إلى أين؟
    en: All good. I'm waiting for my ginger drink. Where are you off to?
    note:
      ar_eg: "كلمات: arep = هـ / ناوي (= akan / mau؛ شات arp)؛ wae = بس (= saja)؛ endi = فين، أنهي (= ngendi في الكلام السريع)؛ jahe = جنزبيل؛ ngenteni = يستنى (حد)."
      ar: "مفردات: arep = سوف / ينوي (= akan / mau؛ دردشة arp)؛ wae = فقط (= saja)؛ endi = أين، أيّ (= ngendi في الكلام السريع)؛ jahe = زنجبيل؛ ngenteni = ينتظر (أحدًا)."
      en: "Words: arep = going to, want to (= akan / mau; chat arp); wae = just (= saja); endi = where, which (= ngendi in quick speech); jahe = ginger; ngenteni = to wait for (menunggu)."
  - speaker: Mbak Sekar
    text: Aku arep neng Pasar Beringharjo, tuku kain kanggo ibuku.
    ar_eg: أنا رايحة سوق بيرينجهارجو، أشتري قماش لأمّي.
    ar: أنا ذاهبة إلى سوق بيرينغهارجو لأشتري قماشًا لأمّي.
    en: I'm going to Pasar Beringharjo to buy cloth for my mum.
    note:
      ar_eg: "كلمات: kanggo = لـ، عشان (نغوكو)؛ tuku = يشتري (= beli)."
      ar: "مفردات: kanggo = لِـ، من أجل (نغوكو)؛ tuku = يشتري (= beli)."
      en: "Words: kanggo = for (ngoko) = untuk; tuku = to buy (= beli)."
  - speaker: Mas Danang
    text: Wah, apik. Salam kanggo ibumu, ya!
    ar_eg: حلو. سلّميلي على مامتك!
    ar: جميل. سلّمي على أمّك!
    en: Nice. Say hi to your mum!
  - speaker: Mbak Sekar
    text: Iya, Mas. Matur nuwun. Ati-ati, ya!
    ar_eg: حاضر يا ماس. متشكّرة. خلّي بالك من نفسك!
    ar: حسنًا يا ماس. شكرًا. اعتنِ بنفسك!
    en: Sure, Mas. Thank you. Take care!
  - speaker: Mas Danang
    text: Mas Mohamed, krungu to? Karo kanca, cukup "aku" lan "kowe".
    ar_eg: يا ماس محمد، سمعت؟ مع الصحاب، كفاية «aku» و«kowe».
    ar: يا ماس محمد، أسمعت؟ مع الأصدقاء يكفي «aku» و«kowe».
    en: Mas Mohamed, did you hear? With friends, "aku" and "kowe" are enough.
    note:
      ar_eg: "aku = أنا، kowe = انت (للصحاب واللي أصغر منك). مع الكبار هتتعلّم كلمات تانية بعدين. كلمات: karo = مع (= dengan / sama)؛ cukup = كفاية؛ krungu = يسمع."
      ar: "aku = أنا، وkowe = أنت (للأصدقاء ومن هم أصغر). ومع الكبار ستتعلّم كلمات أخرى لاحقًا. مفردات: karo = مع (= dengan / sama)؛ cukup = كافٍ؛ krungu = يسمع."
      en: "aku = I, kowe = you (friends and younger people). With elders you'll learn other words later. Words: karo = with (= dengan / sama); cukup = enough; krungu = hear."
- kind: word_spotlight
  title: Mas, mbak, dhik, cah
  lines:
  - speaker: Mbak Sekar
    text: Mas kanggo wong lanang sing luwih tuwa sithik. Mbak kanggo wong wadon.
    ar_eg: «ماس» للراجل اللي أكبر منك شويّة. «مباك» للست.
    ar: «ماس» للرجل الأكبر قليلًا. «مباك» للمرأة.
    en: Mas is for a man a bit older than you. Mbak is for a woman.
    note:
      ar_eg: "كلمات: lanang = ذكر؛ anak lanang = ابن؛ luwih = أكتر (lebih)؛ sing = اللي (= yang)؛ tuwa = كبير في السن؛ wadon = أنثى؛ anak wadon = بنت (ابنة)."
      ar: "مفردات: lanang = ذكر؛ anak lanang = ابن؛ luwih = أكثر (lebih)؛ sing = الذي (= yang)؛ tuwa = مسنّ، عجوز؛ wadon = أنثى؛ anak wadon = ابنة."
      en: "Words: lanang = male; anak lanang = son = laki-laki; luwih = more (lebih); sing = that, which, the one (= yang); tuwa = old (of people); wadon = female; anak wadon = daughter = perempuan."
  - speaker: Mas Danang
    text: Dhik kanggo sing luwih enom, lanang utawa wadon. Dhik, arep tuku apa?
    ar_eg: «dhik» للي أصغر منك، ولد أو بنت. يا dhik، عايز تشتري إيه؟
    ar: «dhik» لمن هو أصغر منك، ذكرًا أو أنثى. يا dhik، ماذا تريد أن تشتري؟
    en: Dhik is for someone younger, male or female. Dhik, what would you like to buy?
    note:
      ar_eg: "كلمات: utawa = أو؛ enom = شاب، صغير."
      ar: "مفردات: utawa = أو؛ enom = شابّ، صغير السن."
      en: "Words: utawa = or (atau); enom = young."
  - speaker: Mas Danang
    text: Lan cah, saka tembung bocah. Ayo, cah! Piye, cah?
    ar_eg: و«cah» جاية من «bocah» يعني عيّل. يلّا يا جماعة! إيه يا شباب؟
    ar: و«cah» من «bocah» أي ولد. هيّا يا جماعة! ما الأمر يا شباب؟
    en: And cah comes from bocah, kid. Come on, guys! What's up, guys?
    note:
      ar_eg: «cah» بيقولها الشباب لبعض في جوجا، زي «يا جماعة» أو «يا شباب» عندنا. ودّية، بس مش للكبار.
      ar: يقولها الشباب بعضهم لبعض في جوغجا، مثل «يا جماعة» أو «يا شباب». ودّية، لكن لا تُقال للكبار.
      en: Cah is what young people call each other in Jogja, like "guys". Friendly, but not for elders.
  - speaker: Mbak Sekar
    text: Lan wangsulane "Piye kabare?" gampang. Apik, apik-apik wae, utawa lumayan.
    ar_eg: والردّ على «أخبارك إيه؟» سهل. كويس، كويس الحمد لله، أو ماشي الحال.
    ar: والجواب عن «كيف حالك؟» سهل. بخير، بخير تمامًا، أو لا بأس.
    en: And the answer to "Piye kabare?" is easy. Good, all good, or not bad.
    note:
      ar_eg: "كلمات: gampang = سهل."
      ar: "مفردات: gampang = سهل."
      en: "Words: gampang = easy."
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Piye kabare?
    ar_eg: أخبارك إيه؟
    ar: كيف حالك؟
    en: How are you?
  - speaker: Mas Danang
    text: Piye kabare?
    ar_eg: أخبارك إيه؟
    ar: كيف حالك؟
    en: How are you?
  - speaker: Mbak Sekar
    text: Apik, suwun. Kowe piye?
    ar_eg: كويس، متشكّر. وانت؟
    ar: بخير، شكرًا. وأنت؟
    en: Good, thanks. And you?
  - speaker: Mas Danang
    text: Apik, suwun. Kowe piye?
    ar_eg: كويس، متشكّر. وانت؟
    ar: بخير، شكرًا. وأنت؟
    en: Good, thanks. And you?
  - speaker: Mbak Sekar
    text: Suwe ra ketemu!
    ar_eg: من زمان ما اتقابلناش!
    ar: منذ زمن لم نلتقِ!
    en: Long time no see!
  - speaker: Mas Danang
    text: Suwe ra ketemu!
    ar_eg: من زمان ما اتقابلناش!
    ar: منذ زمن لم نلتقِ!
    en: Long time no see!
  - speaker: Mbak Sekar
    text: Ati-ati, ya!
    ar_eg: خلّي بالك من نفسك!
    ar: اعتنِ بنفسك!
    en: Take care!
  - speaker: Mas Danang
    text: Ati-ati, ya!
    ar_eg: خلّي بالك من نفسك!
    ar: اعتنِ بنفسك!
    en: Take care!
  - speaker: Mbak Sekar
    text: Sugeng enjing, Mbak!
    ar_eg: صباح الخير يا مباك!
    ar: صباح الخير يا مباك!
    en: Good morning, Mbak!
  - speaker: Mas Danang
    text: Sugeng enjing, Mbak!
    ar_eg: صباح الخير يا مباك!
    ar: صباح الخير يا مباك!
    en: Good morning, Mbak!
  - speaker: Mbak Sekar
    text: Matur nuwun, Mas.
    ar_eg: متشكّر يا ماس.
    ar: شكرًا يا ماس.
    en: Thank you, Mas.
  - speaker: Mas Danang
    text: Matur nuwun, Mas.
    ar_eg: متشكّر يا ماس.
    ar: شكرًا يا ماس.
    en: Thank you, Mas.
  - speaker: Mas Danang
    text: Lan eling, "suwun" iku cekakan saka "matur nuwun". Karo kanca, suwun cukup. Karo wong tuwa, matur nuwun.
    ar_eg: وافتكر، «suwun» اختصار «matur nuwun». مع الصحاب suwun كفاية، ومع الكبار matur nuwun.
    ar: وتذكّر أنّ «suwun» اختصار «matur nuwun». مع الأصدقاء تكفي suwun، ومع الكبار matur nuwun.
    en: And remember, "suwun" is short for "matur nuwun". With friends suwun is enough; with elders, matur nuwun.
    note:
      ar_eg: "كلمات: eling = يفتكر؛ iku = ده، دي، دول (البعيد)."
      ar: "مفردات: eling = يتذكّر؛ iku = ذلك، تلك."
      en: "Words: eling = to remember; iku = that, those."
- kind: outro
  title: Gilirane Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki gilirane sampeyan. Sapa kanca ing radio iki, nganggo "Piye kabare, cah?"
    ar_eg: يا ماس محمد، دلوقتي دورك. سلّم على صحابك في الراديو بـ«Piye kabare, cah?»
    ar: يا ماس محمد، الآن دورك. حيِّ أصدقاءك في الراديو بـ«Piye kabare, cah?»
    en: Mas Mohamed, now it's your turn. Greet your friends on the radio with "Piye kabare, cah?"
    note:
      ar_eg: "دورك! قول الجملة بصوت عالي، وبعدها ردّ على نفسك بـ«Apik, suwun». كلمات: nganggo = بـ / بيستخدم؛ sapa = مين (= siapa؛ في الشات sopo)."
      ar: "دورك! قل الجملة بصوت عالٍ، ثمّ أجب نفسك بـ«Apik, suwun». مفردات: nganggo = بـ / يستعمل؛ sapa = مَن (= siapa؛ وفي الدردشة sopo)."
      en: "Your turn! Say it out loud, then answer yourself with \"Apik, suwun\". Words: nganggo = with, using (pakai); sapa = who (= siapa; chat sopo)."
  - speaker: Mas Danang
    text: PR-mu, sesuk sapa wong telu nganggo basa Jawa. Mas, mbak, utawa dhik!
    ar_eg: واجبك، بكرة سلّم على تلات أشخاص بالجاوي. ماس أو مباك أو dhik!
    ar: 'واجبك: غدًا حيِّ ثلاثة أشخاص بالجاوية. ماس أو مباك أو dhik!'
    en: 'Your homework: tomorrow, greet three people in Javanese. Mas, mbak or dhik!'
    note:
      ar_eg: "كلمات: sesuk = بكرة."
      ar: "مفردات: sesuk = غدًا."
      en: "Words: sesuk = tomorrow (besok)."
  - speaker: Mbak Sekar
    text: Matur nuwun wis ngrungokake Kabar Radio. Nganti ketemu maneh!
    ar_eg: متشكّرين إنك سمعت كبار راديو. نتقابل تاني!
    ar: شكرًا لاستماعك إلى كبار راديو. إلى اللقاء!
    en: Thank you for listening to Kabar Radio. See you again!
    note:
      ar_eg: "كلمات: maneh = تاني / كمان مرة؛ nganti = لحد (= sampai)؛ ngrungokake = يسمع، يستمع."
      ar: "مفردات: maneh = مرة أخرى؛ nganti = حتى (= sampai)؛ ngrungokake = يستمع."
      en: "Words: maneh = again = lagi; nganti = until (= sampai); ngrungokake = listen to (ngoko)."
  - speaker: Mbak Sekar
    text: Mas Mohamed, sampeyan wis apik banget dina iki. Sesuk kita kenalan karo wong anyar.
    ar_eg: يا ماس محمد، انت كنت حلو أوي النهارده. بكرة هنتعرّف على ناس جديدة.
    ar: يا ماس محمد، كنت رائعًا اليوم. غدًا نتعرّف إلى أناس جدد.
    en: Mas Mohamed, you did really well today. Tomorrow we meet new people.
    note:
      ar_eg: "كلمات: kenalan = يتعرّف على حد (= berkenalan)."
      ar: "مفردات: kenalan = يتعارف (= berkenalan)."
      en: "Words: kenalan = to get acquainted (= berkenalan)."
  - speaker: Mas Danang
    text: Suwun, cah! Sesuk kita neng warung kopi cedhak Tugu!
    ar_eg: تسلموا يا جماعة! بكرة هنكون في قهوة جنب التوجو!
    ar: شكرًا يا جماعة! غدًا نكون في مقهى قرب التوغو!
    en: Cheers, guys! Tomorrow we're at a coffee stall near the Tugu!
    note:
      ar_eg: "كلمات: cedhak = قريب."
      ar: "مفردات: cedhak = قريب."
      en: "Words: cedhak = near, close."
