title:
  target: Piye kabare, Mas?
  ar_eg: أخبارك إيه يا ماس؟
  ar: كيف حالك يا ماس؟
  en: How are you, Mas?
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Malioboro
  lines:
  - speaker: Mbak Sekar
    text: "Sugeng enjing saka Malioboro, Jogja! Iki Kabar Radio. Aku Sekar."
    ar_eg: "صباح الخير من ماليوبورو في جوجا! ده كبار راديو. أنا سيكار."
    ar: "صباح الخير من ماليوبورو في جوغجا! هذا كبار راديو. أنا سيكار."
    en: "Good morning from Malioboro, Jogja! This is Kabar Radio. I'm Sekar."
    note:
      ar_eg: "سيكار من جوجا، ودانانج من ماديون. الاتنين بيتكلّموا جاوي «ماتارامان»، جاوي الشارع اللي هتتعلّمه. كلمات: iki = ده / دي (= ini)؛ saka = من (= dari)؛ malioboro = ماليوبورو، أشهر شارع في يوجياكرتا."
      ar: "سيكار من جوغجا، ودانانغ من ماديون، وكلاهما يتكلّم جاوية «ماتارامان»، جاوية الشارع التي ستتعلّمها. مفردات: iki = هذا / هذه (= ini)؛ saka = من (= dari)؛ malioboro = ماليوبورو، شارع شهير في يوغياكارتا."
      en: "Sekar is from Jogja and Danang from Madiun. Both speak Mataraman Javanese, the street Javanese you'll learn. Words: iki = this (= ini); saka = from (= dari); malioboro = Malioboro, the famous street in Yogyakarta."
  - speaker: Mas Danang
    text: Aku Danang, saka Madiun. Piye kabare, Mas?
    ar_eg: أنا دانانج، من ماديون. أخبارك إيه يا ماس؟
    ar: أنا دانانغ، من ماديون. كيف حالك يا ماس؟
    en: I'm Danang, from Madiun. How are you, Mas?
  - speaker: Mbak Sekar
    text: "Mas Mohamed, sugeng enjing! Saiki ayo ketemu kanca ing dalan."
    ar_eg: "يا ماس محمد، صباح الخير! يلّا دلوقتي نقابل الصحاب في الشارع."
    ar: "يا ماس محمد، صباح الخير! هيّا الآن نلتقي الأصدقاء في الشارع."
    en: "Mas Mohamed, good morning! Now let's meet friends on the street."
    note:
      ar_eg: "كلمات: ing = في (= di)، رسمي ومكتوب؛ dalan = طريق / شارع (= jalan)."
      ar: "مفردات: ing = في (= di)، رسمي ومكتوب؛ dalan = طريق (= jalan)."
      en: "Words: ing = in, at (= di), formal / written; dalan = road, way (= jalan)."
  - speaker: Mas Danang
    text: "Esuk iki Malioboro rame. Ana becak ing dalan."
    ar_eg: "ماليوبورو زحمة الصبح ده. فيه بيتشاك في الشارع."
    ar: "ماليوبورو مزدحم هذا الصباح. هناك عربات بيتشاك في الطريق."
    en: "Malioboro's busy this morning. There are becaks on the road."
    note:
      ar_eg: "كلمات: ana = فيه / موجود (= ada)؛ becak = بيتشاك (عجلة بتلات عجلات بسوّاق)."
      ar: "مفردات: ana = يوجد (= ada)؛ becak = ريكشا بثلاث عجلات."
      en: "Words: ana = there is, to exist (= ada); becak = becak, pedicab."
- kind: dialogue
  title: Ketemu kanca neng angkringan
  lines:
  - speaker: Mbak Sekar
    text: "Danang, ayo! Aku kancamu neng angkringane Mas Heru."
    ar_eg: "يلّا يا دانانج! أنا صاحبتك في أنجكرينجان ماس هيرو."
    ar: "هيّا يا دانانغ! أنا صديقتك عند عربة ماس هيرو."
    en: "Come on, Danang! I'm your friend at Mas Heru's angkringan."
    note:
      ar_eg: "angkringan = عربية أكل في الشارع: أكل رخيص وشاي سخن وقعدة على دكك خشب. أشهر قعدة في جوجا."
      ar: "angkringan = عربة طعام في الشارع: أكل رخيص وشاي ساخن وجلسة على مقاعد خشبية. أشهر جلسة في جوغجا."
      en: "An angkringan is a street cart with cheap food, hot tea and wooden benches. Jogja's favourite hangout."
  - speaker: Mas Danang
    text: Lho, Mbak! Piye kabare? Suwe ra ketemu!
    ar_eg: إيه ده يا مباك! أخبارك إيه؟ من زمان ما اتقابلناش!
    ar: يا مباك! كيف حالك؟ منذ زمن لم نلتقِ!
    en: Hey, Mbak! How are you? Long time no see!
    note:
      ar_eg: "ra = ora (مش) مختصرة، وكده بيقولوها في الشارع. كلمات: suwe = وقت طويل، يتأخّر؛ lho = على فكرة! / إيه ده!"
      ar: "ra = ora (لا) مختصرة، وهكذا تُقال في الشارع. مفردات: suwe = طويل (زمنًا)؛ lho = للتنبيه أو الدهشة."
      en: "Ra = ora (not), shortened, the way it's said on the street. Words: suwe = long (time) = lama; lho = you know! / oh!"
  - speaker: Mbak Sekar
    text: Apik, Mas. Suwun. Kowe piye?
    ar_eg: كويسة يا ماس. تسلم. وانت عامل إيه؟
    ar: بخير يا ماس. شكرًا. وأنت كيف حالك؟
    en: Good, Mas. Thanks. How about you?
  - speaker: Mas Danang
    text: "Apik. Aku lagi ngenteni kopi joss. Kowe?"
    ar_eg: "تمام. أنا مستنّي الكوبي جوس. وانتي؟"
    ar: "بخير. أنتظر الكوبي جوس. وأنتِ؟"
    en: "Good. I'm waiting for my kopi joss. You?"
    note:
      ar_eg: "kopi joss = قهوة جوجا اللي بيحطّوا فيها حتّة فحم مولّعة. كلمات: ngenteni = يستنى (حد)."
      ar: "kopi joss = قهوة جوغجا التي توضع فيها جمرة فحم مشتعلة. مفردات: ngenteni = ينتظر (أحدًا)."
      en: "Kopi joss is Jogja coffee with a glowing piece of charcoal dropped in. Words: ngenteni = to wait for (menunggu)."
  - speaker: Mbak Sekar
    text: "Aku arep neng Pasar Beringharjo, Mas."
    ar_eg: "أنا رايحة سوق بيرينجهارجو يا ماس."
    ar: "أنا ذاهبة إلى سوق بيرينغهارجو يا ماس."
    en: "I'm off to Pasar Beringharjo, Mas."
  - speaker: Mas Danang
    text: Wah, apik. Salam kanggo ibumu, ya!
    ar_eg: حلو. سلّميلي على مامتك!
    ar: جميل. سلّمي على أمّك!
    en: Nice. Say hi to your mum!
  - speaker: Mbak Sekar
    text: Iya, Mas. Matur nuwun. Ati-ati, ya!
    ar_eg: حاضر يا ماس. متشكّرة. خلّي بالك من نفسك!
    ar: حسنًا يا ماس. شكرًا. اعتنِ بنفسك!
    en: Sure, Mas. Thank you. Take care!
  - speaker: Mbak Sekar
    text: "Danang, saiki kowe Pakdhe, ya."
    ar_eg: "يا دانانج، دلوقتي انت «باكدهي»، ماشي؟"
    ar: "يا دانانغ، أنت الآن «باكدهي»، حسنًا؟"
    en: "Danang, now you're Pakdhe, okay."
  - speaker: Mas Danang
    text: "Iya. Sugeng enjing, Nduk!"
    ar_eg: "ماشي. صباح الخير يا بنتي!"
    ar: "حسنًا. صباح الخير يا بنيّتي!"
    en: "Okay. Good morning, Nduk!"
  - speaker: Mbak Sekar
    text: "Sugeng enjing, Pakdhe! Piye kabare?"
    ar_eg: "صباح الخير يا عمّو! أخبارك إيه؟"
    ar: "صباح الخير يا عمّ! كيف حالك؟"
    en: "Good morning, Pakdhe! How are you?"
  - speaker: Mas Danang
    text: "Apik, Nduk. Nanging aku luwe."
    ar_eg: "كويس يا بنتي. بس أنا جعان."
    ar: "بخير يا بنيّتي. لكنّي جائع."
    en: "Good, Nduk. But I'm hungry."
  - speaker: Mbak Sekar
    text: "Ayo mangan dhisik, Pakdhe! Iki kopi joss."
    ar_eg: "يلّا كُل الأول يا عمّو! ودي كوبي جوس."
    ar: "هيّا كُل أوّلًا يا عمّ! وهذه كوبي جوس."
    en: "Let's eat first, Pakdhe! Here's a kopi joss."
  - speaker: Mas Danang
    text: "Wah, matur nuwun, Nduk!"
    ar_eg: "الله، متشكّر يا بنتي!"
    ar: "شكرًا جزيلًا يا بنيّتي!"
    en: "Oh, thank you, Nduk!"
  - speaker: Mbak Sekar
    text: "Sami-sami, Pakdhe. Ati-ati, nggih!"
    ar_eg: "العفو يا عمّو. خلّي بالك من نفسك!"
    ar: "عفوًا يا عمّ. اعتنِ بنفسك!"
    en: "You're welcome, Pakdhe. Take care!"
  - speaker: Mas Danang
    text: "Mas Mohamed! Karo kanca: \"aku\" lan \"kowe\"."
    ar_eg: "يا ماس محمد! مع الصحاب: «aku» و«kowe»."
    ar: "يا ماس محمد! مع الأصدقاء: «aku» و«kowe»."
    en: "Mas Mohamed! With friends: \"aku\" and \"kowe\"."
    note:
      ar_eg: "aku = أنا، kowe = انت (للصحاب واللي أصغر منك). مع الكبار هتتعلّم كلمات تانية بعدين. كلمات: karo = مع (= dengan / sama)."
      ar: "aku = أنا، وkowe = أنت (للأصدقاء ومن هم أصغر). ومع الكبار ستتعلّم كلمات أخرى لاحقًا. مفردات: karo = مع (= dengan / sama)."
      en: "aku = I, kowe = you (friends and younger people). With elders you'll learn other words later. Words: karo = with (= dengan / sama)."
- kind: word_spotlight
  title: Mas, mbak, dhik, cah
  lines:
  - speaker: Mbak Sekar
    text: "\"Mas\", \"Mbak\": luwih tuwa sithik."
    ar_eg: "«Mas» و«Mbak»: أكبر منك شويّة."
    ar: "«Mas» و«Mbak»: أكبر منك قليلًا."
    en: "\"Mas\", \"Mbak\": a bit older than you."
    note:
      ar_eg: "Mas للراجل الشاب اللي أكبر منك شويّة، وMbak للبنت. كلمات: luwih = أكتر (lebih)؛ tuwa = كبير في السن؛ sithik = شويّة."
      ar: "Mas للشابّ الأكبر منك قليلًا، وMbak للشابّة. مفردات: luwih = أكثر (lebih)؛ tuwa = مسنّ؛ sithik = قليلًا."
      en: "Mas is for a young man a bit older than you, Mbak for a young woman. Words: luwih = more (lebih); tuwa = old (of people); sithik = a little."
  - speaker: Mas Danang
    text: "\"Dhik\": luwih enom."
    ar_eg: "«Dhik»: أصغر منك."
    ar: "«Dhik»: أصغر منك."
    en: "\"Dhik\": younger than you."
    note:
      ar_eg: "Dhik للأصغر منك، ولد أو بنت. كلمات: enom = شاب، صغير."
      ar: "Dhik لمن هو أصغر منك، فتى أو فتاة. مفردات: enom = شابّ، صغير السن."
      en: "Dhik is for someone younger, boy or girl. Words: enom = young."
  - speaker: Mas Danang
    text: "Lan \"cah\": Ayo, cah! Piye, cah?"
    ar_eg: "و«cah»: يلّا يا جماعة! إيه الأخبار يا جماعة؟"
    ar: "و«cah»: هيّا يا شباب! كيف الحال يا شباب؟"
    en: "And \"cah\": Come on, guys! How's it going, guys?"
    note:
      ar_eg: «cah» بيقولها الشباب لبعض في جوجا، زي «يا جماعة» أو «يا شباب» عندنا. ودّية، بس مش للكبار.
      ar: يقولها الشباب بعضهم لبعض في جوغجا، مثل «يا جماعة» أو «يا شباب». ودّية، لكن لا تُقال للكبار.
      en: Cah is what young people call each other in Jogja, like "guys". Friendly, but not for elders.
  - speaker: Mbak Sekar
    text: "\"Piye kabare?\" \"Apik!\" utawa \"Lumayan.\""
    ar_eg: "«أخبارك إيه؟» «كويس!» أو «ماشي الحال.»"
    ar: "«كيف حالك؟» «بخير!» أو «لا بأس.»"
    en: "\"How are you?\" \"Good!\" or \"Not bad.\""
    note:
      ar_eg: "كلمات: utawa = أو."
      ar: "مفردات: utawa = أو."
      en: "Words: utawa = or (atau)."
