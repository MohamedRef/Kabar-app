  - speaker: Mas Danang
    text: "Sami-sami, Pakdhe."
    ar_eg: "العفو يا عمّو."
    ar: "عفوًا يا عمّ."
    en: "You're welcome, Pakdhe."
  - speaker: Mbak Sekar
    text: "Aku ngantuk, nanging sehat."
    ar_eg: "أنا نعسان، بس كويس."
    ar: "أنا نعسان، لكنّي بخير."
    en: "I'm sleepy, but I'm well."
  - speaker: Mas Danang
    text: "Aku ngantuk, nanging sehat."
    ar_eg: "أنا نعسان، بس كويس."
    ar: "أنا نعسان، لكنّي بخير."
    en: "I'm sleepy, but I'm well."
  - speaker: Mbak Sekar
    text: "Ayo ketemu maneh sesuk!"
    ar_eg: "يلّا نتقابل تاني بكرة!"
    ar: "هيّا نلتقي مجدّدًا غدًا!"
    en: "Let's meet again tomorrow!"
  - speaker: Mas Danang
    text: "Ayo ketemu maneh sesuk!"
    ar_eg: "يلّا نتقابل تاني بكرة!"
    ar: "هيّا نلتقي مجدّدًا غدًا!"
    en: "Let's meet again tomorrow!"
  - speaker: Mbak Sekar
    text: Sugeng enjing, Mbak!
    ar_eg: صباح الخير يا مباك!
    ar: صباح الخير يا مباك!
    en: Good morning, Mbak!
  - speaker: Mas Danang
    text: Sugeng enjing, Mbak!
    ar_eg: صباح الخير يا مباك!
    ar: صباح الخير يا مباك!
    en: Good morning, Mbak!
  - speaker: Mbak Sekar
    text: Matur nuwun, Mas.
    ar_eg: متشكّر يا ماس.
    ar: شكرًا يا ماس.
    en: Thank you, Mas.
  - speaker: Mas Danang
    text: Matur nuwun, Mas.
    ar_eg: متشكّر يا ماس.
    ar: شكرًا يا ماس.
    en: Thank you, Mas.
  - speaker: Mas Danang
    text: "\"Suwun\" kanggo kanca. \"Matur nuwun\" kanggo Pakdhe lan Budhe."
    ar_eg: "«Suwun» للصحاب. و«Matur nuwun» للكبار زي عمّو وطنط."
    ar: "«Suwun» للأصدقاء. و«Matur nuwun» للكبار كالعمّ والخالة."
    en: "\"Suwun\" for friends. \"Matur nuwun\" for Pakdhe and Budhe."
    note:
      ar_eg: "suwun هي matur nuwun مختصرة. كلمات: kanggo = لـ، عشان (نغوكو)."
      ar: "suwun اختصار لـmatur nuwun. مفردات: kanggo = لِـ، من أجل (نغوكو)."
      en: "Suwun is matur nuwun, shortened. Words: kanggo = for (ngoko) = untuk."
- kind: outro
  title: Gilirane Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: "Mas Mohamed, saiki sampeyan: \"Piye kabare, cah?\""
    ar_eg: "يا ماس محمد، دورك دلوقتي: «إيه الأخبار يا جماعة؟»"
    ar: "يا ماس محمد، الآن دورك: «كيف الحال يا شباب؟»"
    en: "Mas Mohamed, now you: \"How's it going, guys?\""
    note:
      ar_eg: "دورك! قول الجملة بصوت عالي، وبعدها ردّ على نفسك بـ«Apik, suwun». كلمات: nganggo = بـ / بيستخدم؛ sapa = مين (= siapa؛ في الشات sopo)."
      ar: "دورك! قل الجملة بصوت عالٍ، ثمّ أجب نفسك بـ«Apik, suwun». مفردات: nganggo = بـ / يستعمل؛ sapa = مَن (= siapa؛ وفي الدردشة sopo)."
      en: "Your turn! Say it out loud, then answer yourself with \"Apik, suwun\". Words: nganggo = with, using (pakai); sapa = who (= siapa; chat sopo)."
  - speaker: Mas Danang
    text: "PR-mu: sesuk, sapa kanca telu. Mas, Mbak, Dhik!"
    ar_eg: "واجبك: بكرة، سلّم على تلات صحاب. Mas وMbak وDhik!"
    ar: "واجبك: غدًا، حيِّ ثلاثة أصدقاء. Mas وMbak وDhik!"
    en: "Homework: tomorrow, greet three friends. Mas, Mbak, Dhik!"
    note:
      ar_eg: "كلمات: sesuk = بكرة؛ sapa = يسلّم على (ونفس الكلمة = مين)؛ telu = تلاتة."
      ar: "مفردات: sesuk = غدًا؛ sapa = يحيّي (وهي أيضًا = مَن)؛ telu = ثلاثة."
      en: "Words: sesuk = tomorrow (besok); sapa = greet (also = who); telu = three."
  - speaker: Mbak Sekar
    text: "Matur nuwun, kanca. Nganti ketemu maneh!"
    ar_eg: "متشكّرين يا صحاب. نشوفكم تاني!"
    ar: "شكرًا يا أصدقاء. إلى اللقاء!"
    en: "Thank you, friends. See you again!"
    note:
      ar_eg: "كلمات: maneh = تاني / كمان مرة؛ nganti = لحد (= sampai)."
      ar: "مفردات: maneh = مرة أخرى؛ nganti = حتى (= sampai)."
      en: "Words: maneh = again = lagi; nganti = until (= sampai)."
  - speaker: Mbak Sekar
    text: "Mas Mohamed, apik banget! Sesuk ayo kenal kanca anyar."
    ar_eg: "يا ماس محمد، حلو أوي! بكرة يلّا نتعرّف على صحاب جداد."
    ar: "يا ماس محمد، رائع جدًّا! غدًا هيّا نتعرّف إلى أصدقاء جدد."
    en: "Mas Mohamed, really good! Tomorrow let's meet new friends."
    note:
      ar_eg: "كلمات: anyar = جديد."
      ar: "مفردات: anyar = جديد."
      en: "Words: anyar = new = baru."
  - speaker: Mas Danang
    text: "Suwun, cah! Sesuk neng warung kopi cedhak Tugu!"
    ar_eg: "تسلموا يا جماعة! بكرة في قهوة جنب التوجو!"
    ar: "شكرًا يا شباب! غدًا في مقهى قرب التوغو!"
    en: "Thanks, guys! Tomorrow, a coffee stall near the Tugu!"
    note:
