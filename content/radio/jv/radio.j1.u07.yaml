title:
  target: Pira?
  ar_eg: بكام؟
  ar: بكم؟
  en: How much?
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pasar Klithikan
  lines:
  - speaker: Mas Danang
    text: Cah, Kabar Radio saiki neng Pasar Klithikan! HP, kamera, piranti, sepatu lawas, kabeh ana. Aku Danang.
    ar_eg: يا جماعة، كبار راديو دلوقتي في باسار كليتيكان! موبايلات وكاميرات وعِدد وجزم قديمة، كل حاجة موجودة. أنا دانانج.
    ar: يا جماعة، كبار راديو الآن في سوق كليتيكان! هواتف وكاميرات وأدوات وأحذية مستعملة، كلّ شيء موجود. أنا دانانغ.
    en: Guys, Kabar Radio is at Pasar Klithikan now! Phones, cameras, tools, old shoes, it's all here. I'm Danang.
    note:
      ar_eg: 'باسار كليتيكان في پاكونچين، غرب جوجا: سوق الحاجات المستعملة. كل حاجة ليها سعرين: اللي البيّاع بيقوله، واللي بتوصله بالفِصال.'
      ar: 'سوق كليتيكان في باكونتشين غرب جوغجا: سوق المستعمل. لكلّ شيء سعران: ما يقوله البائع، وما تصل إليه بالمساومة.'
      en: 'Pasar Klithikan in Pakuncen, west Jogja, is the second-hand market. Everything has two prices: the one the seller says, and the one you haggle down to.'
  - speaker: Mbak Sekar
    text: Aku Sekar. Dina iki dina pungkasan neng Jogja. Kita sinau angka lan tawa-tawaran.
    ar_eg: أنا سيكار. النهارده آخر يوم في جوجا. هنتعلّم الأرقام والفِصال.
    ar: أنا سيكار. اليوم آخر يوم في جوغجا. نتعلّم الأرقام والمساومة.
    en: I'm Sekar. Today's our last day in Jogja. We learn numbers and haggling.
  - speaker: Mas Danang
    text: Basa pasar iku basa Jawa sing paling migunani. Sithik wae, wis entuk eseman lan rega murah!
    ar_eg: لغة السوق دي أنفع جاوي. شويّة كلمات وتاخد ابتسامة وسعر أرخص!
    ar: لغة السوق أنفع جاوية. كلمات قليلة تكسبك ابتسامة وسعرًا أرخص!
    en: Market talk is the most useful Javanese. Just a little gets you a smile and a cheaper price!
- kind: dialogue
  title: Tuku HP lawas
  lines:
  - speaker: Mbak Sekar
    text: Danang, kowe bakul HP, aku sing tuku. Aku arep nawa!
    ar_eg: يا دانانج، انت بيّاع الموبايلات وأنا الزبونة. أنا هفاصل!
    ar: يا دانانغ، أنت بائع الهواتف وأنا الزبونة. سأساوم!
    en: Danang, you sell phones, I'm the buyer. I'm going to haggle!
  - speaker: Mas Danang
    text: Monggo, Mbak, dipilih! HP apik-apik, isih mulus.
    ar_eg: اتفضّلي يا مباك، اختاري! موبايلات حلوة، لسّه زي الفل.
    ar: تفضّلي يا مباك، اختاري! هواتف جميلة، ما زالت كالجديدة.
    en: Come on, Mbak, take your pick! Nice phones, still like new.
  - speaker: Mbak Sekar
    text: HP sing ireng iki arep diculke pira, Mas?
    ar_eg: الموبايل الإسود ده هتبيعه بكام يا ماس؟
    ar: بكم ستبيع هذا الهاتف الأسود يا ماس؟
    en: How much are you selling this black phone for, Mas?
    note:
      ar_eg: 'diculke من ucul (يسيب). في سوق المستعمل معناها «يتباع»: arep diculke pira? = ناوي تبيعه بكام؟ وفي الشات: «arp dicul piro?»'
      ar: 'diculke من ucul (يترك). وفي سوق المستعمل تعني «يُباع»: arep diculke pira? = بكم ستبيعه؟ وفي الدردشة: «arp dicul piro?»'
      en: 'Diculke comes from ucul (let go). At a second-hand market it means "sold": arep diculke pira? = how much are you selling it for? In chat: "arp dicul piro?"'
  - speaker: Mas Danang
    text: Sing iki sejuta setengah, Mbak.
    ar_eg: ده بمليون ونص يا مباك.
    ar: هذا بمليون ونصف يا مباك.
    en: This one's one and a half million, Mbak.
  - speaker: Mbak Sekar
    text: Waduh, larang banget! Sejuta, piye? Oleh kurang, ta?
    ar_eg: يا خبر، غالي أوي! بمليون، إيه رأيك؟ ينفع تنزّل، مش كده؟
    ar: يا للهول، غالٍ جدًّا! مليون، ما رأيك؟ يمكن أن تخفّض، أليس كذلك؟
    en: Ouch, that's really pricey! A million, how about it? You can go lower, right?
  - speaker: Mas Danang
    text: Ra isa, Mbak. Sejuta telung atus, wis.
    ar_eg: مينفعش يا مباك. مليون وتلتميّة، خلاص.
    ar: لا يمكن يا مباك. مليون وثلاثمئة، وانتهى.
    en: Can't do it, Mbak. A million three hundred, final.
  - speaker: Mbak Sekar
    text: Layare rada lecet, lho. Sejuta rong atus?
    ar_eg: الشاشة مخدوشة شويّة على فكرة. مليون وميتين؟
    ar: الشاشة مخدوشة قليلًا. مليون ومئتان؟
    en: The screen's a bit scratched, you know. A million two hundred?
  - speaker: Mas Danang
    text: Hmm... ya wis, sejuta rong atus. Nanging charger-e ora ana, ya.
    ar_eg: همم... خلاص، مليون وميتين. بس من غير شاحن، ماشي.
    ar: حسنًا... مليون ومئتان. لكن بلا شاحن.
    en: Hmm... all right, a million two hundred. But no charger, okay.
  - speaker: Mbak Sekar
    text: Ra papa. Deal! Suwun, Mas.
    ar_eg: مش مشكلة. اتّفقنا! متشكّرة يا ماس.
    ar: لا بأس. اتّفقنا! شكرًا يا ماس.
    en: No problem. Deal! Thanks, Mas.
  - speaker: Mas Danang
    text: Suwun, Mbak. Laris, laris!
    ar_eg: تسلمي يا مباك. ربنا يكرم!
    ar: شكرًا يا مباك. بيع مبارك!
    en: Thanks, Mbak. Good sales, good sales!
    note:
      ar_eg: «laris» = البيع ماشي. البيّاعين بيقولوها بعد أول بيعة زي «استفتاح».
      ar: «laris» = البيع رائج. يقولها الباعة بعد أوّل بيعة كأنّها «استفتاح».
      en: '"Laris" = selling well. Sellers say it after the first sale of the day, like a blessing.'
- kind: word_spotlight
  title: Siji nganti sejuta
  lines:
  - speaker: Mas Danang
    text: Siji, loro, telu, papat, lima, enem, pitu, wolu, sanga, sepuluh.
    ar_eg: واحد، اتنين، تلاتة، أربعة، خمسة، ستّة، سبعة، تمانية، تسعة، عشرة.
    ar: واحد، اثنان، ثلاثة، أربعة، خمسة، ستّة، سبعة، ثمانية، تسعة، عشرة.
    en: One, two, three, four, five, six, seven, eight, nine, ten.
  - speaker: Mbak Sekar
    text: Satus, rong atus, telung atus. Sewu, rong ewu, limang ewu.
    ar_eg: ميّة، ميتين، تلتميّة. ألف، ألفين، خمس آلاف.
    ar: مئة، مئتان، ثلاثمئة. ألف، ألفان، خمسة آلاف.
    en: A hundred, two hundred, three hundred. A thousand, two thousand, five thousand.
    note:
      ar_eg: 'شوف التغيير: loro يبقى rong، telu يبقى telung، lima يبقى limang قبل atus وewu.'
      ar: 'لاحظ التغيير: loro تصير rong، وtelu تصير telung، وlima تصير limang قبل atus وewu.'
      en: 'Note the change: loro becomes rong, telu becomes telung, lima becomes limang before atus and ewu.'
  - speaker: Mas Danang
    text: Lan sejuta. Sejuta setengah tegese sejuta limang atus ewu.
    ar_eg: وsejuta يعني مليون. sejuta setengah يعني مليون ونص، مليون وخمسميّة ألف.
    ar: وsejuta مليون. وsejuta setengah مليون ونصف، أي مليون وخمسمئة ألف.
    en: And sejuta, a million. Sejuta setengah means one and a half million, a million five hundred thousand.
  - speaker: Mbak Sekar
    text: Larang, murah. Tuku, adol, nawa. Lan sing paling penting, eseman!
    ar_eg: غالي، رخيص. يشتري، يبيع، يفاصل. والأهم، الابتسامة!
    ar: 'غالٍ، رخيص. يشتري، يبيع، يساوم. والأهمّ: الابتسامة!'
    en: Pricey, cheap. Buy, sell, haggle. And most important, a smile!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Arep diculke pira?
    ar_eg: هتبيعه بكام؟
    ar: بكم ستبيعه؟
    en: How much are you selling it for?
  - speaker: Mas Danang
    text: Arep diculke pira?
    ar_eg: هتبيعه بكام؟
    ar: بكم ستبيعه؟
    en: How much are you selling it for?
  - speaker: Mbak Sekar
    text: Waduh, larang banget!
    ar_eg: يا خبر، غالي أوي!
    ar: يا للهول، غالٍ جدًّا!
    en: Ouch, that's really pricey!
  - speaker: Mas Danang
    text: Waduh, larang banget!
    ar_eg: يا خبر، غالي أوي!
    ar: يا للهول، غالٍ جدًّا!
    en: Ouch, that's really pricey!
  - speaker: Mbak Sekar
    text: Oleh kurang, ta?
    ar_eg: ينفع تنزّل، مش كده؟
    ar: يمكن أن تخفّض، أليس كذلك؟
    en: You can go lower, right?
  - speaker: Mas Danang
    text: Oleh kurang, ta?
    ar_eg: ينفع تنزّل، مش كده؟
    ar: يمكن أن تخفّض، أليس كذلك؟
    en: You can go lower, right?
  - speaker: Mbak Sekar
    text: Ya wis, sejuta rong atus.
    ar_eg: خلاص، مليون وميتين.
    ar: حسنًا، مليون ومئتان.
    en: All right, a million two hundred.
  - speaker: Mas Danang
    text: Ya wis, sejuta rong atus.
    ar_eg: خلاص، مليون وميتين.
    ar: حسنًا، مليون ومئتان.
    en: All right, a million two hundred.
  - speaker: Mbak Sekar
    text: Wis, deal!
    ar_eg: خلاص، اتّفقنا!
    ar: حسنًا، اتّفقنا!
    en: Okay, deal!
  - speaker: Mas Danang
    text: Wis, deal!
    ar_eg: خلاص، اتّفقنا!
    ar: حسنًا، اتّفقنا!
    en: Okay, deal!
  - speaker: Mbak Sekar
    text: Lan aja lali, neng pasar tradisional nawa iku biasa. Neng mall, rega wis pas, ora usah nawa.
    ar_eg: وماتنساش، في السوق الشعبي الفِصال عادي. في المول السعر ثابت، مفيش فِصال.
    ar: ولا تنسَ أنّ المساومة عاديّة في السوق الشعبي. أمّا في المول فالسعر ثابت ولا داعي للمساومة.
    en: And don't forget, haggling is normal at a traditional market. At the mall the price is fixed, no need to haggle.
  - speaker: Mas Danang
    text: Lan yen bakule ngomong "pas", tegese regane wis pas, ora isa mudhun maneh.
    ar_eg: ولو البيّاع قال «pas»، يعني السعر ده آخر كلام، مش هينزل.
    ar: وإن قال البائع «pas» فالسعر نهائيّ ولن ينزل.
    en: And if the seller says "pas", the price is final, it won't go down any more.
- kind: outro
  title: Pasar! Jawa
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, saiki gilirane sampeyan nawa. HP regane sejuta setengah. Tawanen!
    ar_eg: يا ماس محمد، دلوقتي دورك تفاصل. الموبايل بمليون ونص. فاصل!
    ar: يا ماس محمد، دورك الآن للمساومة. الهاتف بمليون ونصف. ساوِم!
    en: Mas Mohamed, now it's your turn to haggle. The phone is one and a half million. Haggle!
    note:
      ar_eg: دورك! قول السعر اللي عايزه بالجاوي، واستخدم larang ومعاها ابتسامة. وجرّب لعبة «Pasar!» بالجاوي في الدرس.
      ar: دورك! قل السعر الذي تريده بالجاوية، واستعمل larang مع ابتسامة. وجرّب لعبة «Pasar!» بالجاوية في الدرس.
      en: Your turn! Say the price you want in Javanese, use larang, with a smile. And try the Javanese "Pasar!" game in the lesson.
  - speaker: Mbak Sekar
    text: 'Contone: Waduh, larang. Sejuta wae, ya, Mas? Oleh kurang, ta?'
    ar_eg: 'مثلًا: يا خبر، غالي. مليون بس، ماشي يا ماس؟ ينفع تنزّل؟'
    ar: 'مثلًا: يا للهول، غالٍ. مليون فقط، حسنًا يا ماس؟ يمكن أن تخفّض؟'
    en: 'For example: Ouch, pricey. Just a million, okay, Mas? You can go lower, right?'
  - speaker: Mas Danang
    text: Suwun, Jogja! Suwun, cah! Sesuk kita menyang Madiun, kuthaku, neng warunge Pak Budi.
    ar_eg: شكرًا يا جوجا! تسلموا يا جماعة! بكرة رايحين ماديون، بلدي، لمطعم پاك بودي.
    ar: شكرًا يا جوغجا! شكرًا يا جماعة! غدًا نذهب إلى ماديون، مدينتي، إلى مطعم باك بودي.
    en: Thanks, Jogja! Thanks, guys! Tomorrow we go to Madiun, my town, to Pak Budi's warung.
  - speaker: Mbak Sekar
    text: Nganti ketemu neng Madiun! Aja lali, siji nganti sepuluh!
    ar_eg: نتقابل في ماديون! ماتنساش، من واحد لعشرة!
    ar: 'إلى اللقاء في ماديون! لا تنسَ: من واحد إلى عشرة!'
    en: See you in Madiun! Don't forget, one to ten!
