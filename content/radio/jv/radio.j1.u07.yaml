schema: kabar.radio/v1
id: radio.j1.u07
language: jv
level: j1
unit: j1.u07
title:
  target: Pira?
  ar_eg: بكام؟
  ar: بكم؟
  en: How much?
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pasar Atom
  lines:
  - speaker: Mas Danang
    text: Rek, Kabar Radio ning Pasar Atom! Kain, emas, jajan, kabeh ana. Aku Danang.
    ar_eg: يا جدعان، كبار راديو في باسار أتوم! قماش ودهب وحلويات، كل حاجة موجودة. أنا دانانج.
    ar: يا رفاق، كبار راديو في باسار أتوم! أقمشة وذهب وحلويات، كلّ شيء موجود. أنا دانانغ.
    en: Mates, Kabar Radio is at Pasar Atom! Cloth, gold, snacks, everything's here. I'm Danang.
  - speaker: Mbak Sekar
    text: Aku Sekar. Dina iki dina pungkasan ing Suroboyo. Kita sinau angka lan tawa-tawaran.
    ar_eg: أنا سيكار. النهارده آخر يوم في سورابايا. هنتعلّم الأرقام والفِصال.
    ar: أنا سيكار. اليوم آخر يوم في سورابايا. نتعلّم الأرقام والمساومة.
    en: I'm Sekar. Today is our last day in Surabaya. We learn numbers and haggling.
  - speaker: Mas Danang
    text: Basa pasar iku basa Jawa sing paling migunani. Sithik wae, wis entuk eseman lan rega murah!
    ar_eg: لغة السوق دي أنفع جاوي. شويّة كلمات وتاخد ابتسامة وسعر أرخص!
    ar: لغة السوق أنفع جاوية. كلمات قليلة تكسبك ابتسامة وسعرًا أرخص!
    en: Market Javanese is the most useful Javanese. A little gets you a smile and a lower price!
- kind: dialogue
  title: Tuku tas
  lines:
  - speaker: Mbak Sekar
    text: Danang, kowe bakul tas, aku sing tuku. Aku arep nawa!
    ar_eg: يا دانانج، انت بيّاع الشنط وأنا الزبونة. أنا هفاصل!
    ar: يا دانانغ، أنت بائع الحقائب وأنا الزبونة. سأساوم!
    en: Danang, you sell bags, I'm buying. I'm going to haggle!
  - speaker: Mas Danang
    text: Monggo, Mbak, dipilih! Tas apik-apik, murah-murah.
    ar_eg: اتفضّلي يا مباك، اختاري! شنط حلوة ورخيصة.
    ar: تفضّلي يا مباك، اختاري! حقائب جميلة ورخيصة.
    en: Come on, Mbak, take your pick! Nice bags, cheap bags.
  - speaker: Mbak Sekar
    text: Tas sing abang iki pira, Cak?
    ar_eg: الشنطة الحمرا دي بكام يا تشاك؟
    ar: بكم هذه الحقيبة الحمراء يا تشاك؟
    en: How much is this red bag, Cak?
  - speaker: Mas Danang
    text: Sing iki satus seket ewu, Mbak.
    ar_eg: دي بميّة وخمسين ألف يا مباك.
    ar: هذه بمئة وخمسين ألفًا يا مباك.
    en: This one's a hundred and fifty thousand, Mbak.
  - speaker: Mbak Sekar
    text: Waduh, larang banget! Satus ewu, piye?
    ar_eg: يا خبر، غالية أوي! بميّة ألف، إيه رأيك؟
    ar: يا للهول، غالية جدًّا! مئة ألف، ما رأيك؟
    en: Ouch, that's really pricey! A hundred thousand, how about it?
  - speaker: Mas Danang
    text: Gak isa, Mbak. Satus telung puluh, wis.
    ar_eg: مينفعش يا مباك. ميّة وتلاتين خلاص.
    ar: لا يمكن يا مباك. مئة وثلاثون، وانتهى.
    en: Can't do it, Mbak. A hundred and thirty, final.
  - speaker: Mbak Sekar
    text: Arep diculke pira, Cak? Aku tuku loro, lho.
    ar_eg: هتنزّلها لكام يا تشاك؟ أنا هاخد اتنين على فكرة.
    ar: إلى كم ستنزل يا تشاك؟ سآخذ اثنتين.
    en: How low will you go, Cak? I'm buying two, you know.
    note:
      ar_eg: diculke = يتساب / ينزل (من culke، يسيب). «arp dicul piro?» في الشات = هتنزّله لكام؟
      ar: diculke = يُترك / يُخفَّض (من culke). و«arp dicul piro?» في الدردشة = إلى كم ستخفّضه؟
      en: diculke = let go, lowered (from culke, release). "arp dicul piro?" in chats = how low will you let it go?
  - speaker: Mas Danang
    text: Loro? Ya wis, rong atus ewu kanggo loro.
    ar_eg: اتنين؟ خلاص، ميتين ألف للاتنين.
    ar: اثنتان؟ حسنًا، مئتا ألف للاثنتين.
    en: Two? All right, two hundred thousand for both.
  - speaker: Mbak Sekar
    text: Rong atus ewu... oke, deal! Suwun, Cak.
    ar_eg: ميتين ألف... تمام، اتّفقنا! متشكّرة يا تشاك.
    ar: مئتا ألف... حسنًا، اتّفقنا! شكرًا يا تشاك.
    en: Two hundred thousand... okay, deal! Thanks, Cak.
  - speaker: Mas Danang
    text: Suwun, Mbak. Laris, laris!
    ar_eg: تسلمي يا مباك. ربنا يكرم!
    ar: شكرًا يا مباك. بيع مبارك!
    en: Thanks, Mbak. Good sales, good sales!
    note:
      ar_eg: «laris» = البيع ماشي. البيّاعين بيقولوها بعد أول بيعة زي «استفتاح».
      ar: «laris» = البيع رائج. يقولها الباعة بعد أوّل بيعة كأنّها «استفتاح».
      en: '"Laris" = selling well. Sellers say it after a sale, like an Egyptian "estiftah".'
- kind: word_spotlight
  title: Siji nganti sejuta
  lines:
  - speaker: Mas Danang
    text: Siji, loro, telu, papat, lima, enem, pitu, wolu, sanga, sepuluh.
    ar_eg: واحد، اتنين، تلاتة، أربعة، خمسة، ستّة، سبعة، تمانية، تسعة، عشرة.
    ar: واحد، اثنان، ثلاثة، أربعة، خمسة، ستّة، سبعة، ثمانية، تسعة، عشرة.
    en: One, two, three, four, five, six, seven, eight, nine, ten.
  - speaker: Mbak Sekar
    text: Satus, rong atus, telung atus. Sewu, rong ewu, limang ewu.
    ar_eg: ميّة، ميتين، تلتميّة. ألف، ألفين، خمس آلاف.
    ar: مئة، مئتان، ثلاثمئة. ألف، ألفان، خمسة آلاف.
    en: A hundred, two hundred, three hundred. A thousand, two thousand, five thousand.
    note:
      ar_eg: 'شوف التغيير: loro يبقى rong، telu يبقى telung، lima يبقى limang قبل atus وewu.'
      ar: 'لاحظ التغيير: loro تصير rong، وtelu تصير telung، وlima تصير limang قبل atus وewu.'
      en: 'Note the change: loro becomes rong, telu telung, lima limang before atus and ewu.'
  - speaker: Mas Danang
    text: Lan sejuta. Ing pasar, rega asring ewon. Seket ewu, satus ewu.
    ar_eg: وsejuta يعني مليون. في السوق، الأسعار غالبًا بالآلاف. خمسين ألف، ميّة ألف.
    ar: وsejuta مليون. وفي السوق الأسعار غالبًا بالآلاف. خمسون ألفًا، مئة ألف.
    en: And sejuta, a million. In the market prices are usually thousands. Fifty thousand, a hundred thousand.
  - speaker: Mbak Sekar
    text: Larang, murah. Tuku, adol. Lan sing paling penting, eseman!
    ar_eg: غالي، رخيص. يشتري، يبيع. والأهم، الابتسامة!
    ar: 'غالٍ، رخيص. يشتري، يبيع. والأهمّ: الابتسامة!'
    en: Pricey, cheap. Buy, sell. And most important, a smile!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Iki pira?
    ar_eg: ده بكام؟
    ar: بكم هذا؟
    en: How much is this?
  - speaker: Mas Danang
    text: Iki pira?
    ar_eg: ده بكام؟
    ar: بكم هذا؟
    en: How much is this?
  - speaker: Mbak Sekar
    text: Waduh, larang banget!
    ar_eg: يا خبر، غالي أوي!
    ar: يا للهول، غالٍ جدًّا!
    en: Ouch, that's really pricey!
  - speaker: Mas Danang
    text: Waduh, larang banget!
    ar_eg: يا خبر، غالي أوي!
    ar: يا للهول، غالٍ جدًّا!
    en: Ouch, that's really pricey!
  - speaker: Mbak Sekar
    text: Arep diculke pira?
    ar_eg: هتنزّله لكام؟
    ar: إلى كم ستخفّضه؟
    en: How low will you go?
  - speaker: Mas Danang
    text: Arep diculke pira?
    ar_eg: هتنزّله لكام؟
    ar: إلى كم ستخفّضه؟
    en: How low will you go?
  - speaker: Mbak Sekar
    text: Aku tuku loro.
    ar_eg: هاخد اتنين.
    ar: سآخذ اثنين.
    en: I'll take two.
  - speaker: Mas Danang
    text: Aku tuku loro.
    ar_eg: هاخد اتنين.
    ar: سآخذ اثنين.
    en: I'll take two.
  - speaker: Mbak Sekar
    text: Satus ewu wae, ya?
    ar_eg: ميّة ألف بس، ماشي؟
    ar: مئة ألف فقط، حسنًا؟
    en: Just a hundred thousand, okay?
  - speaker: Mas Danang
    text: Satus ewu wae, ya?
    ar_eg: ميّة ألف بس، ماشي؟
    ar: مئة ألف فقط، حسنًا؟
    en: Just a hundred thousand, okay?
  - speaker: Mbak Sekar
    text: Wis, deal!
    ar_eg: خلاص، اتّفقنا!
    ar: حسنًا، اتّفقنا!
    en: Okay, deal!
  - speaker: Mas Danang
    text: Wis, deal!
    ar_eg: خلاص، اتّفقنا!
    ar: حسنًا، اتّفقنا!
    en: Okay, deal!
  - speaker: Mbak Sekar
    text: Lan aja lali, ing pasar tradisional nawa iku biasa. Ing mall, rega wis pas, ora usah nawa.
    ar_eg: وماتنساش، في السوق الشعبي الفِصال عادي. في المول السعر ثابت، مفيش فِصال.
    ar: ولا تنسَ أنّ المساومة عاديّة في السوق الشعبيّ. أمّا في المول فالسعر ثابت.
    en: And remember, haggling is normal in traditional markets. In a mall the price is fixed, no haggling.
  - speaker: Mas Danang
    text: Lan yen bakule ngomong "pas", tegese regane wis pas, ora isa mudhun maneh.
    ar_eg: ولو البيّاع قال «pas»، يعني السعر ده آخر كلام، مش هينزل.
    ar: وإن قال البائع «pas» فالسعر نهائيّ ولن ينزل.
    en: And if the seller says "pas", the price is final, it won't go lower.
- kind: outro
  title: Pasar! Jawa
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, saiki gilirane sampeyan nawa. Tas regane satus seket ewu. Tawanen!
    ar_eg: يا ماس محمد، دلوقتي دورك تفاصل. الشنطة بميّة وخمسين ألف. فاصل!
    ar: يا ماس محمد، دورك الآن للمساومة. الحقيبة بمئة وخمسين ألفًا. ساوِم!
    en: Mas Mohamed, now it's your turn to haggle. The bag is a hundred and fifty thousand. Haggle!
    note:
      ar_eg: دورك! قول السعر اللي عايزه بالجاوي، واستخدم larang ومعاها ابتسامة. وجرّب لعبة «Pasar!» بالجاوي في الدرس.
      ar: دورك! قل السعر الذي تريده بالجاوية، واستعمل larang مع ابتسامة. وجرّب لعبة «Pasar!» بالجاوية في الدرس.
      en: Your turn! Name your price in Javanese, use larang, and smile. Then try the Javanese round of the Pasar! game.
  - speaker: Mbak Sekar
    text: 'Contone: Waduh, larang. Satus ewu wae, ya, Cak?'
    ar_eg: 'مثلًا: يا خبر، غالية. ميّة ألف بس، ماشي يا تشاك؟'
    ar: 'مثلًا: يا للهول، غالية. مئة ألف فقط، حسنًا يا تشاك؟'
    en: 'For example: Ouch, pricey. Just a hundred thousand, okay, Cak?'
  - speaker: Mas Danang
    text: Suwun, Suroboyo! Suwun, rek! Sesuk kita pindhah nang Madiun, nang warunge Pak Budi.
    ar_eg: شكرًا يا سورابايا! تسلموا يا جدعان! بكرة هننقل ماديون، لمطعم پاك بودي.
    ar: شكرًا يا سورابايا! شكرًا يا رفاق! غدًا ننتقل إلى ماديون، إلى مطعم باك بودي.
    en: Thanks, Surabaya! Cheers, mates! Tomorrow we move to Madiun, to Pak Budi's warung.
  - speaker: Mbak Sekar
    text: Nganti ketemu ing Madiun! Aja lali, siji nganti sepuluh!
    ar_eg: نتقابل في ماديون! ماتنساش، من واحد لعشرة!
    ar: 'إلى اللقاء في ماديون! لا تنسَ: من واحد إلى عشرة!'
    en: See you in Madiun! Don't forget, one to ten!
