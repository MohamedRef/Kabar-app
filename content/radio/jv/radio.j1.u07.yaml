review:
  status: draft
  verified: false
  notes: 'Numbers, prices and haggling at Pasar Klithikan in Pakuncen, Jogja''s second-hand market (phones, cameras, tools). In this market "diculke" means "sold": "arep diculke pira?" (chat "arp dicul piro?") = how much are you selling it for? Last Jogja episode before Madiun.'
