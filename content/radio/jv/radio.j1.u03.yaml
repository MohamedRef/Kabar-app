title:
  target: Chat Jawa
  ar_eg: شات بالجاوي
  ar: الدردشة بالجاوية
  en: Chat Javanese
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Alun-alun Kidul
  lines:
  - speaker: Mbak Sekar
    text: Sugeng dalu saka Alun-alun Kidul! Akeh mobil-mobilan lampu kelap-kelip. Aku Sekar.
    ar_eg: مساء الخير من ألون ألون كيدول! عربيّات بدّال كتير بنور بيرعش. أنا سيكار.
    ar: مساء الخير من ألون ألون كيدول! عربات بدّالات كثيرة بأضواء متلألئة. أنا سيكار.
    en: Good evening from Alun-alun Kidul! Lots of pedal cars with twinkling lights. I'm Sekar.
    note:
      ar_eg: ألون ألون كيدول (Alkid) = الميدان الجنوبي ورا الكراتون. فيه شجرتين بانيان، والناس بيجرّبوا يعدّوا بينهم وعينيهم متغمّية - اسمها «masangin».
      ar: ألون ألون كيدول (Alkid) = الساحة الجنوبية خلف الكراتون. فيها شجرتا بانيان، ويحاول الناس المرور بينهما معصوبي الأعين - وتسمّى «masangin».
      en: Alun-alun Kidul (Alkid) is the south square behind the Kraton. It has two banyan trees, and people try to walk between them blindfolded - that's "masangin".
  - speaker: Mas Danang
    text: Aku Danang. HP-ku muni terus. Kancaku chat nganggo basa Jawa cekak.
    ar_eg: أنا دانانج. موبايلي مبيبطّلش يرنّ. صحابي بيكتبوا شات بجاوي مختصر.
    ar: أنا دانانغ. هاتفي لا يتوقّف عن الرنين. أصدقائي يراسلونني بجاوية مختصرة.
    en: I'm Danang. My phone keeps buzzing. My friends chat in shortened Javanese.
  - speaker: Mbak Sekar
    text: Dina iki kita sinau maca chat. Lan tembung wis, durung, lagi, arep.
    ar_eg: النهارده هنتعلّم نقرا الشات. وكلمات wis وdurung وlagi وarep.
    ar: اليوم نتعلّم قراءة الدردشة، وكلمات wis وdurung وlagi وarep.
    en: Today we learn to read chats. And the words wis, durung, lagi, arep.
    note:
      ar_eg: wis = خلاص (sudah)، durung = لسّه (belum)، lagi = بـ (دلوقتي، sedang)، arep = هـ (ناوي، mau / akan).
      ar: wis = قد (sudah)، durung = لم بعد (belum)، lagi = يفعل الآن (sedang)، arep = سوف (mau / akan).
      en: wis = already (sudah), durung = not yet (belum), lagi = in the middle of (sedang), arep = going to (mau / akan).
- kind: dialogue
  title: Chat saka Mas Heru
  lines:
  - speaker: Mas Danang
    text: Iki chat saka Mas Heru. Tak wacakne, ya. "Cah, ws mangan? Aq arp ng Alkid."
    ar_eg: دي رسالة من ماس هيرو. هقراها. «يا جماعة، كلتوا؟ أنا رايح ألكيد.»
    ar: هذه رسالة من ماس هيرو. سأقرؤها. «يا جماعة، هل أكلتم؟ أنا ذاهب إلى ألكيد.»
    en: Here's a chat from Mas Heru. Let me read it. "Guys, eaten yet? I'm heading to Alkid."
  - speaker: Mbak Sekar
    text: Wah, angel. "Ws" iku wis, "aq" iku aku. Lan "arp"?
    ar_eg: يا ساتر، صعبة. «ws» يعني wis، و«aq» يعني aku. و«arp»؟
    ar: صعبة. «ws» هي wis، و«aq» هي aku. و«arp»؟
    en: Tough. "Ws" is wis, "aq" is aku. And "arp"?
  - speaker: Mas Danang
    text: '"Arp" iku arep. Lan "ng" iku neng. Aku arep neng Alkid.'
    ar_eg: «arp» يعني arep. و«ng» يعني neng. أنا رايح ألكيد.
    ar: «arp» هي arep، و«ng» هي neng. أنا ذاهب إلى ألكيد.
    en: '"Arp" is arep. And "ng" is neng. I''m going to Alkid.'
    note:
      ar_eg: 'في الشات بيشيلوا الحروف المتحرّكة: arep تبقى arp، وneng تبقى ng. وneng = لـ / في، وبيقولوها كتير في جوجا.'
      ar: 'في الدردشة تُحذف الحروف المتحرّكة: arep تصير arp، وneng تصير ng. وneng = إلى / في، وتُقال كثيرًا في جوغجا.'
      en: 'In chats the vowels drop: arep becomes arp, neng becomes ng. Neng = to / at, and Jogja says it all the time.'
  - speaker: Mbak Sekar
    text: Banjur kowe mbales apa?
    ar_eg: وبعدين انت رديت بإيه؟
    ar: ثمّ بماذا رددت؟
    en: And what did you reply?
  - speaker: Mas Danang
    text: '"Durung, Mas. Aq lg kerja. Sik ya."'
    ar_eg: «لسّه يا ماس. أنا بشتغل. استنّى شويّة.»
    ar: «ليس بعد يا ماس. أنا أعمل الآن. انتظر قليلًا.»
    en: '"Not yet, Mas. I''m working. Hang on."'
  - speaker: Mbak Sekar
    text: '"Lg" iku lagi, "sik" iku sedhela, utawa dhisik. Saiki aku ngerti!'
    ar_eg: «lg» يعني lagi، و«sik» يعني لحظة، أو الأول. دلوقتي فهمت!
    ar: «lg» هي lagi، و«sik» تعني لحظة أو أوّلًا. الآن فهمت!
    en: '"Lg" is lagi, "sik" means a moment, or first. Now I get it!'
  - speaker: Mas Danang
    text: 'Banjur Mas Heru nulis: "Ra popo, aq tunggu ng ngisor wit ringin."'
    ar_eg: 'وبعدين ماس هيرو كتب: «مفيش مشكلة، أنا مستنّيك تحت شجرة البانيان.»'
    ar: 'ثمّ كتب ماس هيرو: «لا بأس، سأنتظرك تحت شجرة البانيان.»'
    en: 'Then Mas Heru wrote: "No worries, I''ll wait under the banyan tree."'
  - speaker: Mbak Sekar
    text: '"Ra popo" iku ora apa-apa. Neng Jogja, wong ngomong "ra" luwih akeh tinimbang "ora".'
    ar_eg: «ra popo» يعني ora apa-apa، مفيش حاجة. في جوجا الناس بتقول «ra» أكتر من «ora».
    ar: «ra popo» تعني ora apa-apa، لا بأس. وفي جوغجا يقول الناس «ra» أكثر من «ora».
    en: '"Ra popo" is ora apa-apa, no problem. In Jogja people say "ra" more than "ora".'
- kind: word_spotlight
  title: Jawa apa Indonesia?
  lines:
  - speaker: Mbak Sekar
    text: Tembung cilik iki nuduhake basa Jawa. Ora, wis, durung, arep, karo, sing.
    ar_eg: الكلمات الصغيّرة دي بتقولّك إنه جاوي. ora، wis، durung، arep، karo، sing.
    ar: هذه الكلمات الصغيرة تدلّ على الجاوية. ora وwis وdurung وarep وkaro وsing.
    en: These little words mark Javanese. Ora, wis, durung, arep, karo, sing.
  - speaker: Mas Danang
    text: 'Indonesia: tidak, sudah, belum. Jawa: ora, wis, durung.'
    ar_eg: 'إندونيسي: tidak، sudah، belum. جاوي: ora، wis، durung.'
    ar: 'الإندونيسية: tidak وsudah وbelum. والجاوية: ora وwis وdurung.'
    en: 'Indonesian: tidak, sudah, belum. Javanese: ora, wis, durung.'
  - speaker: Mbak Sekar
    text: Lan "karo" iku dengan utawa sama. Aku karo kowe.
    ar_eg: و«karo» يعني dengan أو sama، مع. أنا وانت.
    ar: و«karo» تعني dengan أو sama، أي مع. أنا معك.
    en: And karo is dengan or sama, with. Me with you.
  - speaker: Mas Danang
    text: '"Sing" iku yang. Sing abang, sing gedhe, sing enak.'
    ar_eg: «sing» يعني yang، اللي. اللي أحمر، اللي كبير، اللي حلو.
    ar: «sing» تعني yang، أي الذي. الأحمر، الكبير، اللذيذ.
    en: Sing is yang, the one that. The red one, the big one, the tasty one.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Aku wis mangan.
    ar_eg: أنا كلت خلاص.
    ar: لقد أكلت.
    en: I've eaten already.
  - speaker: Mas Danang
    text: Aku wis mangan.
    ar_eg: أنا كلت خلاص.
    ar: لقد أكلت.
    en: I've eaten already.
  - speaker: Mbak Sekar
    text: Aku durung mangan.
    ar_eg: أنا لسّه ماكلتش.
    ar: لم آكل بعد.
    en: I haven't eaten yet.
  - speaker: Mas Danang
    text: Aku durung mangan.
    ar_eg: أنا لسّه ماكلتش.
    ar: لم آكل بعد.
    en: I haven't eaten yet.
  - speaker: Mbak Sekar
    text: Aku lagi nyambut gawe.
    ar_eg: أنا بشتغل دلوقتي.
    ar: أنا أعمل الآن.
    en: I'm working right now.
  - speaker: Mas Danang
    text: Aku lagi nyambut gawe.
    ar_eg: أنا بشتغل دلوقتي.
    ar: أنا أعمل الآن.
    en: I'm working right now.
  - speaker: Mbak Sekar
    text: Aku arep neng Alkid.
    ar_eg: أنا رايح ألكيد.
    ar: سأذهب إلى ألكيد.
    en: I'm going to Alkid.
  - speaker: Mas Danang
    text: Aku arep neng Alkid.
    ar_eg: أنا رايح ألكيد.
    ar: سأذهب إلى ألكيد.
    en: I'm going to Alkid.
  - speaker: Mbak Sekar
    text: Sik ya, aku isih neng dalan.
    ar_eg: استنّى، أنا لسّه في الطريق.
    ar: انتظر، ما زلت في الطريق.
    en: Hang on, I'm still on the way.
  - speaker: Mas Danang
    text: Sik ya, aku isih neng dalan.
    ar_eg: استنّى، أنا لسّه في الطريق.
    ar: انتظر، ما زلت في الطريق.
    en: Hang on, I'm still on the way.
  - speaker: Mbak Sekar
    text: Ra popo, aku tunggu.
    ar_eg: مفيش مشكلة، أنا مستنّي.
    ar: لا بأس، سأنتظر.
    en: No worries, I'll wait.
  - speaker: Mas Danang
    text: Ra popo, aku tunggu.
    ar_eg: مفيش مشكلة، أنا مستنّي.
    ar: لا بأس، سأنتظر.
    en: No worries, I'll wait.
  - speaker: Mas Danang
    text: Lan "otw" padha karo basa Inggris, on the way. Neng chat Jawa, Inggris uga melu, hehe.
    ar_eg: و«otw» زي الإنجليزي on the way. في الشات الجاوي الإنجليزي داخل كمان، هههه.
    ar: و«otw» مثل الإنجليزية on the way. ففي الدردشة الجاوية تدخل الإنجليزية أيضًا، هههه.
    en: And "otw" is English, on the way. English joins Javanese chats too, hehe.
- kind: outro
  title: Chat kanggo Danang
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, kirimen chat Jawa kanggo aku. Nganggo wis utawa durung, lan arep.
    ar_eg: يا ماس محمد، ابعتلي شات بالجاوي. استخدم wis أو durung، وarep.
    ar: يا ماس محمد، أرسل لي رسالة بالجاوية. استعمل wis أو durung، وarep.
    en: Mas Mohamed, send me a Javanese chat. Use wis or durung, and arep.
    note:
      ar_eg: دورك! اكتب رسالة صغيّرة زي الشباب، وجرّب تختصر - arp، ng، sik.
      ar: دورك! اكتب رسالة قصيرة كالشباب، وجرّب الاختصار - arp وng وsik.
      en: Your turn! Write a short message like the young ones do, and try shortening - arp, ng, sik.
  - speaker: Mbak Sekar
    text: 'Contone: Aku durung mangan. Sesuk aku arep neng Jakal.'
    ar_eg: 'مثلًا: أنا لسّه ماكلتش. بكرة هروح جاكال.'
    ar: 'مثلًا: لم آكل بعد. غدًا سأذهب إلى جاكال.'
    en: 'For example: I haven''t eaten yet. Tomorrow I''m going to Jakal.'
  - speaker: Mas Danang
    text: PR-mu, golek status WA telu nganggo basa Jawa, banjur tandhai tembung Jawane.
    ar_eg: واجبك، دوّر على تلات ستيتوس واتساب بالجاوي، وعلّم على الكلمات الجاوي.
    ar: 'واجبك: ابحث عن ثلاث حالات واتساب بالجاوية وعلّم كلماتها الجاوية.'
    en: 'Your homework: find three WhatsApp statuses in Javanese and mark the Javanese words.'
  - speaker: Mbak Sekar
    text: Sesuk kita neng Jalan Kaliurang, utawa Jakal, cedhak kampus. Nganti ketemu!
    ar_eg: بكرة رايحين شارع كاليورانج، أو «جاكال»، جنب الجامعة. نتقابل!
    ar: غدًا نذهب إلى شارع كاليورانغ، أو «جاكال»، قرب الجامعة. إلى اللقاء!
    en: Tomorrow we go to Jalan Kaliurang, or Jakal, near the campus. See you!
