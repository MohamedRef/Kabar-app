schema: kabar.radio/v1
id: radio.j1.u03
language: jv
level: j1
unit: j1.u03
title:
  target: Chat Jawa
  ar_eg: شات بالجاوي
  ar: الدردشة بالجاوية
  en: Chat Javanese
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Jalan Tunjungan
  lines:
  - speaker: Mbak Sekar
    text: Sugeng dalu saka dalan Tunjungan! Lampune padhang, wong-wong padha foto-foto. Aku Sekar.
    ar_eg: مساء الخير من شارع تونجونجان! النور منوّر والناس كلّها بتتصوّر. أنا سيكار.
    ar: مساء الخير من شارع تونجونغان! الأضواء ساطعة والناس يلتقطون الصور. أنا سيكار.
    en: Good evening from Jalan Tunjungan! The lights are bright and everyone's taking photos. I'm Sekar.
  - speaker: Mas Galih
    text: Aku Galih. HP-ku muni terus. Kancaku chat nganggo basa Jawa cekak.
    ar_eg: أنا جاليه. موبايلي مبيبطّلش يرنّ. صحابي بيكتبوا شات بجاوي مختصر.
    ar: أنا غاليه. هاتفي لا يتوقّف عن الرنين. أصدقائي يراسلونني بجاوية مختصرة.
    en: I'm Galih. My phone keeps buzzing. My friends chat in shortened Javanese.
  - speaker: Mbak Sekar
    text: Dina iki kita sinau maca chat. Lan tembung wis, durung, lagi, arep.
    ar_eg: النهارده هنتعلّم نقرا الشات. وكلمات wis وdurung وlagi وarep.
    ar: اليوم نتعلّم قراءة الدردشة، وكلمات wis وdurung وlagi وarep.
    en: Today we learn to read chats. And the words wis, durung, lagi, arep.
    note:
      ar_eg: wis = خلاص (sudah)، durung = لسّه (belum)، lagi = بـ (دلوقتي، sedang)، arep = هـ (ناوي، mau / akan).
      ar: wis = قد (sudah)، durung = لم بعد (belum)، lagi = يفعل الآن (sedang)، arep = سوف (mau / akan).
      en: wis = already (sudah), durung = not yet (belum), lagi = in the middle of (sedang), arep = going to (mau / akan).
- kind: dialogue
  title: Chat saka Cak Heru
  lines:
  - speaker: Mas Galih
    text: Iki chat saka kancaku. Tak wacakne, ya. "Rek, km wis mangan? Aq arp ng Tunjungan."
    ar_eg: دي رسالة من صاحبي. هقراها. «يا جدع، كلت؟ أنا رايح تونجونجان.»
    ar: هذه رسالة من صديقي. سأقرؤها. «يا صاحبي، هل أكلت؟ أنا ذاهب إلى تونجونغان.»
    en: Here's a chat from my friend. Let me read it. "Mate, have you eaten? I'm going to Tunjungan."
  - speaker: Mbak Sekar
    text: Wah, angel. "Km" iku kamu, "aq" iku aku. Lan "arp"?
    ar_eg: يا ساتر، صعبة. «km» يعني kamu، و«aq» يعني aku. و«arp»؟
    ar: صعبة. «km» هي kamu، و«aq» هي aku. و«arp»؟
    en: Tough. "Km" is kamu, "aq" is aku. And "arp"?
  - speaker: Mas Galih
    text: '"Arp" iku arep. Lan "ng" iku nang. Aq arep nang Tunjungan.'
    ar_eg: «arp» يعني arep. و«ng» يعني nang. أنا رايح تونجونجان.
    ar: «arp» هي arep، و«ng» هي nang. أنا ذاهب إلى تونجونغان.
    en: '"Arp" is arep. And "ng" is nang. I''m going to Tunjungan.'
    note:
      ar_eg: شوف إزّاي kamu وaku إندونيسي، وarep وnang جاوي - في نفس الجملة. ده العادي في الشات.
      ar: لاحظ أنّ kamu وaku إندونيسيتان، وarep وnang جاويّتان - في الجملة نفسها. هذا المعتاد في الدردشة.
      en: Notice kamu and aku are Indonesian, arep and nang Javanese - in one sentence. That's normal in chats.
  - speaker: Mbak Sekar
    text: Banjur kowe mbales apa?
    ar_eg: وبعدين انت رديت بإيه؟
    ar: ثمّ بماذا رددت؟
    en: And what did you reply?
  - speaker: Mas Galih
    text: '"Durung, rek. Aq lg kerja. Sek ya."'
    ar_eg: «لسّه يا جدع. أنا بشتغل. استنّى شويّة.»
    ar: «ليس بعد يا صاحبي. أنا أعمل الآن. انتظر قليلًا.»
    en: '"Not yet, mate. I''m working. Hold on."'
  - speaker: Mbak Sekar
    text: '"Lg" iku lagi, "sek" iku sedhela. Saiki aku ngerti!'
    ar_eg: «lg» يعني lagi، و«sek» يعني لحظة. دلوقتي فهمت!
    ar: «lg» هي lagi، و«sek» تعني لحظة. الآن فهمت!
    en: '"Lg" is lagi, "sek" means a moment. Now I get it!'
  - speaker: Mas Galih
    text: 'Banjur dheweke nulis: "Gk popo, aq tunggu ng ngarep mall."'
    ar_eg: 'وبعدين هو كتب: «مفيش مشكلة، أنا مستنّيك قدّام المول.»'
    ar: 'ثمّ كتب: «لا بأس، سأنتظرك أمام المول.»'
    en: 'Then he wrote: "No worries, I''ll wait in front of the mall."'
  - speaker: Mbak Sekar
    text: '"Gk popo" iku ora apa-apa. Ing Suroboyo, "gak" luwih akeh tinimbang "ora".'
    ar_eg: «gk popo» يعني ora apa-apa، مفيش حاجة. في سورابايا «gak» أكتر من «ora».
    ar: «gk popo» تعني ora apa-apa، لا بأس. وفي سورابايا «gak» أكثر من «ora».
    en: '"Gk popo" is ora apa-apa, no problem. In Surabaya "gak" is more common than "ora".'
- kind: word_spotlight
  title: Jawa apa Indonesia?
  lines:
  - speaker: Mbak Sekar
    text: Tembung cilik iki nuduhake basa Jawa. Ora, wis, durung, arep, karo, sing.
    ar_eg: الكلمات الصغيّرة دي بتقولّك إنه جاوي. ora، wis، durung، arep، karo، sing.
    ar: هذه الكلمات الصغيرة تدلّ على الجاوية. ora وwis وdurung وarep وkaro وsing.
    en: These little words mark Javanese. Ora, wis, durung, arep, karo, sing.
  - speaker: Mas Galih
    text: 'Indonesia: tidak, sudah, belum. Jawa: ora, wis, durung.'
    ar_eg: 'إندونيسي: tidak، sudah، belum. جاوي: ora، wis، durung.'
    ar: 'الإندونيسية: tidak وsudah وbelum. والجاوية: ora وwis وdurung.'
    en: 'Indonesian: tidak, sudah, belum. Javanese: ora, wis, durung.'
  - speaker: Mbak Sekar
    text: Lan "karo" iku dengan utawa sama. Aku karo kowe.
    ar_eg: و«karo» يعني dengan أو sama، مع. أنا وانت.
    ar: و«karo» تعني dengan أو sama، أي مع. أنا معك.
    en: And karo is dengan or sama, with. Me with you.
  - speaker: Mas Galih
    text: '"Sing" iku yang. Sing abang, sing gedhe, sing enak.'
    ar_eg: «sing» يعني yang، اللي. اللي أحمر، اللي كبير، اللي حلو.
    ar: «sing» تعني yang، أي الذي. الأحمر، الكبير، اللذيذ.
    en: Sing is yang, the one that. The red one, the big one, the tasty one.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Aku wis mangan.
    ar_eg: أنا كلت خلاص.
    ar: لقد أكلت.
    en: I've eaten already.
  - speaker: Mas Galih
    text: Aku wis mangan.
    ar_eg: أنا كلت خلاص.
    ar: لقد أكلت.
    en: I've eaten already.
  - speaker: Mbak Sekar
    text: Aku durung mangan.
    ar_eg: أنا لسّه ماكلتش.
    ar: لم آكل بعد.
    en: I haven't eaten yet.
  - speaker: Mas Galih
    text: Aku durung mangan.
    ar_eg: أنا لسّه ماكلتش.
    ar: لم آكل بعد.
    en: I haven't eaten yet.
  - speaker: Mbak Sekar
    text: Aku lagi nyambut gawe.
    ar_eg: أنا بشتغل دلوقتي.
    ar: أنا أعمل الآن.
    en: I'm working right now.
  - speaker: Mas Galih
    text: Aku lagi nyambut gawe.
    ar_eg: أنا بشتغل دلوقتي.
    ar: أنا أعمل الآن.
    en: I'm working right now.
  - speaker: Mbak Sekar
    text: Aku arep nang Tunjungan.
    ar_eg: أنا رايح تونجونجان.
    ar: سأذهب إلى تونجونغان.
    en: I'm going to Tunjungan.
  - speaker: Mas Galih
    text: Aku arep nang Tunjungan.
    ar_eg: أنا رايح تونجونجان.
    ar: سأذهب إلى تونجونغان.
    en: I'm going to Tunjungan.
  - speaker: Mbak Sekar
    text: Sek ya, aku isih ing dalan.
    ar_eg: استنّى، أنا لسّه في الطريق.
    ar: انتظر، ما زلت في الطريق.
    en: Hold on, I'm still on the way.
  - speaker: Mas Galih
    text: Sek ya, aku isih ing dalan.
    ar_eg: استنّى، أنا لسّه في الطريق.
    ar: انتظر، ما زلت في الطريق.
    en: Hold on, I'm still on the way.
  - speaker: Mbak Sekar
    text: Gak popo, aku tunggu.
    ar_eg: مفيش مشكلة، أنا مستنّي.
    ar: لا بأس، سأنتظر.
    en: No worries, I'll wait.
  - speaker: Mas Galih
    text: Gak popo, aku tunggu.
    ar_eg: مفيش مشكلة، أنا مستنّي.
    ar: لا بأس، سأنتظر.
    en: No worries, I'll wait.
  - speaker: Mas Galih
    text: Lan "otw" padha karo basa Inggris, on the way. Ing chat Jawa, Inggris uga melu, hehe.
    ar_eg: و«otw» زي الإنجليزي on the way. في الشات الجاوي الإنجليزي داخل كمان، هههه.
    ar: و«otw» مثل الإنجليزية on the way. ففي الدردشة الجاوية تدخل الإنجليزية أيضًا، هههه.
    en: And "otw" is English, on the way. English joins Javanese chats too, hehe.
- kind: outro
  title: Chat kanggo Galih
  lines:
  - speaker: Mas Galih
    text: Mas Mohamed, kirimen chat Jawa kanggo aku. Nganggo wis utawa durung, lan arep.
    ar_eg: يا ماس محمد، ابعتلي شات بالجاوي. استخدم wis أو durung، وarep.
    ar: يا ماس محمد، أرسل لي رسالة بالجاوية. استعمل wis أو durung، وarep.
    en: Mas Mohamed, send me a Javanese chat. Use wis or durung, and arep.
    note:
      ar_eg: دورك! اكتب رسالة صغيّرة زي الشباب، وجرّب تختصر - arp، ng، sek.
      ar: دورك! اكتب رسالة قصيرة كالشباب، وجرّب الاختصار - arp وng وsek.
      en: Your turn! Write a short message like the young ones do, and try shortening - arp, ng, sek.
  - speaker: Mbak Sekar
    text: 'Contone: Aku durung mangan. Sesuk aku arep nang Ampel.'
    ar_eg: 'مثلًا: أنا لسّه ماكلتش. بكرة هروح أمبيل.'
    ar: 'مثلًا: لم آكل بعد. غدًا سأذهب إلى أمبيل.'
    en: 'For example: I haven''t eaten yet. Tomorrow I''m going to Ampel.'
  - speaker: Mas Galih
    text: PR-mu, golek status WA telu nganggo basa Jawa, banjur tandhai tembung Jawane.
    ar_eg: واجبك، دوّر على تلات ستيتوس واتساب بالجاوي، وعلّم على الكلمات الجاوي.
    ar: 'واجبك: ابحث عن ثلاث حالات واتساب بالجاوية وعلّم كلماتها الجاوية.'
    en: 'Your homework: find three WhatsApp statuses in Javanese and mark the Javanese words.'
  - speaker: Mbak Sekar
    text: Sesuk kita nang Ampel, kampung Arab ing Suroboyo. Nganti ketemu!
    ar_eg: بكرة رايحين أمبيل، حيّ العرب في سورابايا. نتقابل!
    ar: غدًا نذهب إلى أمبيل، حيّ العرب في سورابايا. إلى اللقاء!
    en: Tomorrow we go to Ampel, Surabaya's Arab quarter. See you!
