schema: kabar.radio/v1
id: radio.j1.u03
language: jv
level: j1
unit: j1.u03
title:
  target: Chat Jawa
  ar_eg: شات بالجاوي
  ar: الدردشة بالجاوية
  en: Chat Javanese
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Alun-alun Kidul
  lines:
  - speaker: Mbak Sekar
    text: "Sugeng dalu saka Alun-alun Kidul! Aku Sekar."
    ar_eg: "مساء الخير من ألون ألون كيدول! أنا سيكار."
    ar: "مساء الخير من ألون ألون كيدول! أنا سيكار."
    en: "Good evening from Alun-alun Kidul! I'm Sekar."
    note:
      ar_eg: "ألون ألون كيدول (Alkid) = الميدان الجنوبي ورا الكراتون. فيه شجرتين بانيان، والناس بيجرّبوا يعدّوا بينهم وعينيهم متغمّية - اسمها «masangin»."
      ar: "ألون ألون كيدول (Alkid) = الساحة الجنوبية خلف الكراتون. فيها شجرتا بانيان، ويحاول الناس المرور بينهما معصوبي الأعين - وتسمّى «masangin»."
      en: "Alun-alun Kidul (Alkid) is the south square behind the Kraton. It has two banyan trees, and people try to walk between them blindfolded - that's \"masangin\"."
  - speaker: Mas Danang
    text: "Aku Danang. Kancaku chat nganggo basa Jawa."
    ar_eg: "أنا دانانج. صحابي بيكتبولي شات بالجاوي."
    ar: "أنا دانانغ. أصدقائي يراسلونني بالجاوية."
    en: "I'm Danang. My friends chat in Javanese."
    note:
      ar_eg: "كلمات: chat = شات، رسالة؛ nganggo = بـ / بيستخدم؛ jawa = جاوة؛ جاوي."
      ar: "مفردات: chat = دردشة، رسالة؛ nganggo = بـ / يستعمل؛ jawa = جاوة؛ جاوي."
      en: "Words: chat = chat, message; nganggo = with, using (pakai); jawa = Java; Javanese."
  - speaker: Mbak Sekar
    text: Dina iki kita sinau maca chat. Lan tembung wis, durung, lagi, arep.
    ar_eg: النهارده هنتعلّم نقرا الشات. وكلمات wis وdurung وlagi وarep.
    ar: اليوم نتعلّم قراءة الدردشة، وكلمات wis وdurung وlagi وarep.
    en: Today we learn to read chats. And the words wis, durung, lagi, arep.
    note:
      ar_eg: "wis = خلاص (sudah)، durung = لسّه (belum)، lagi = بـ (دلوقتي، sedang)، arep = هـ (ناوي، mau / akan). كلمات: iki = ده / دي (= ini)؛ dina = يوم، نهار."
      ar: "wis = قد (sudah)، durung = لم بعد (belum)، lagi = يفعل الآن (sedang)، arep = سوف (mau / akan). مفردات: iki = هذا / هذه (= ini)؛ dina = يوم."
      en: "wis = already (sudah), durung = not yet (belum), lagi = in the middle of (sedang), arep = going to (mau / akan). Words: iki = this (= ini); dina = day."
- kind: dialogue
  title: Chat saka Mas Heru
  lines:
  - speaker: Mas Danang
    text: Iki chat saka Mas Heru. Tak wacakne, ya. "Cah, ws mangan? Aq arp ng Alkid."
    ar_eg: دي رسالة من ماس هيرو. هقراها. «يا جماعة، كلتوا؟ أنا رايح ألكيد.»
    ar: هذه رسالة من ماس هيرو. سأقرؤها. «يا جماعة، هل أكلتم؟ أنا ذاهب إلى ألكيد.»
    en: Here's a chat from Mas Heru. Let me read it. "Guys, eaten yet? I'm heading to Alkid."
    note:
      ar_eg: "كلمات: aq = aku في الشات؛ arp = arep في الشات."
      ar: "مفردات: aq = aku في الدردشة؛ arp = arep في الدردشة."
      en: "Words: aq = chat spelling of aku (I); arp = chat spelling of arep (going to)."
  - speaker: Mbak Sekar
    text: Wah, angel. "Ws" iku wis, "aq" iku aku. Lan "arp"?
    ar_eg: يا ساتر، صعبة. «ws» يعني wis، و«aq» يعني aku. و«arp»؟
    ar: صعبة. «ws» هي wis، و«aq» هي aku. و«arp»؟
    en: Tough. "Ws" is wis, "aq" is aku. And "arp"?
    note:
      ar_eg: "كلمات: iku = ده، دي، دول (البعيد)؛ angel = صعب."
      ar: "مفردات: iku = ذلك، تلك؛ angel = صعب."
      en: "Words: iku = that, those; angel = hard, difficult."
  - speaker: Mas Danang
    text: '"Arp" iku arep. Lan "ng" iku neng. Aku arep neng Alkid.'
    ar_eg: «arp» يعني arep. و«ng» يعني neng. أنا رايح ألكيد.
    ar: «arp» هي arep، و«ng» هي neng. أنا ذاهب إلى ألكيد.
    en: '"Arp" is arep. And "ng" is neng. I''m going to Alkid.'
    note:
      ar_eg: 'في الشات بيشيلوا الحروف المتحرّكة: arep تبقى arp، وneng تبقى ng. وneng = لـ / في، وبيقولوها كتير في جوجا.'
      ar: 'في الدردشة تُحذف الحروف المتحرّكة: arep تصير arp، وneng تصير ng. وneng = إلى / في، وتُقال كثيرًا في جوغجا.'
      en: 'In chats the vowels drop: arep becomes arp, neng becomes ng. Neng = to / at, and Jogja says it all the time.'
  - speaker: Mbak Sekar
    text: Banjur kowe mbales apa?
    ar_eg: وبعدين انت رديت بإيه؟
    ar: ثمّ بماذا رددت؟
    en: And what did you reply?
    note:
      ar_eg: "كلمات: banjur = وبعدين (في الحكي)."
      ar: "مفردات: banjur = ثم (في السرد)."
      en: "Words: banjur = then (lalu), in storytelling."
  - speaker: Mas Danang
    text: '"Durung, Mas. Aq lg kerja. Sik ya."'
    ar_eg: «لسّه يا ماس. أنا بشتغل. استنّى شويّة.»
    ar: «ليس بعد يا ماس. أنا أعمل الآن. انتظر قليلًا.»
    en: '"Not yet, Mas. I''m working. Hang on."'
  - speaker: Mbak Sekar
    text: '"Lg" iku lagi, "sik" iku sedhela, utawa dhisik. Saiki aku ngerti!'
    ar_eg: «lg» يعني lagi، و«sik» يعني لحظة، أو الأول. دلوقتي فهمت!
    ar: «lg» هي lagi، و«sik» تعني لحظة أو أوّلًا. الآن فهمت!
    en: '"Lg" is lagi, "sik" means a moment, or first. Now I get it!'
    note:
      ar_eg: "كلمات: utawa = أو؛ saiki = دلوقتي (sekarang)؛ sedhela = لحظة."
      ar: "مفردات: utawa = أو؛ saiki = الآن (sekarang)؛ sedhela = لحظة."
      en: "Words: utawa = or (atau); saiki = now (sekarang); sedhela = a moment."
  - speaker: Mas Danang
    text: "Banjur Mas Heru nulis: \"Ra popo, aq tunggu ng Alkid.\""
    ar_eg: "وبعدين ماس هيرو كتب: «مفيش مشكلة، أنا مستنّيك في ألكيد.»"
    ar: "ثمّ كتب ماس هيرو: «لا بأس، سأنتظرك في ألكيد.»"
    en: "Then Mas Heru wrote: \"No worries, I'll wait at Alkid.\""
    note:
      ar_eg: "كلمات: popo = ra popo = مفيش مشكلة؛ tunggu = يستنى (= tunggu)؛ nulis = يكتب."
      ar: "مفردات: popo = ra popo = لا بأس؛ tunggu = ينتظر (= tunggu)؛ nulis = يكتب."
      en: "Words: popo = ra popo = no problem (ora apa-apa); tunggu = to wait (= tunggu); nulis = to write."
  - speaker: Mbak Sekar
    text: '"Ra popo" iku ora apa-apa. Neng Jogja, wong ngomong "ra" luwih akeh tinimbang "ora".'
    ar_eg: «ra popo» يعني ora apa-apa، مفيش حاجة. في جوجا الناس بتقول «ra» أكتر من «ora».
    ar: «ra popo» تعني ora apa-apa، لا بأس. وفي جوغجا يقول الناس «ra» أكثر من «ora».
    en: '"Ra popo" is ora apa-apa, no problem. In Jogja people say "ra" more than "ora".'
    note:
      ar_eg: "كلمات: luwih = أكتر (lebih)؛ ngomong = يتكلم / يقول (= bicara / bilang)؛ tinimbang = من (في المقارنة)."
      ar: "مفردات: luwih = أكثر (lebih)؛ ngomong = يتكلم / يقول (= bicara / bilang)؛ tinimbang = من (في المقارنة)."
      en: "Words: luwih = more (lebih); ngomong = to speak, say (= bicara / bilang); tinimbang = than."
- kind: word_spotlight
  title: Jawa apa Indonesia?
  lines:
  - speaker: Mbak Sekar
    text: Tembung cilik iki nuduhake basa Jawa. Ora, wis, durung, arep, karo, sing.
    ar_eg: الكلمات الصغيّرة دي بتقولّك إنه جاوي. ora، wis، durung، arep، karo، sing.
    ar: هذه الكلمات الصغيرة تدلّ على الجاوية. ora وwis وdurung وarep وkaro وsing.
    en: These little words mark Javanese. Ora, wis, durung, arep, karo, sing.
    note:
      ar_eg: "كلمات: cilik = صغير."
      ar: "مفردات: cilik = صغير."
      en: "Words: cilik = small, little = kecil."
  - speaker: Mas Danang
    text: 'Indonesia: tidak, sudah, belum. Jawa: ora, wis, durung.'
    ar_eg: 'إندونيسي: tidak، sudah، belum. جاوي: ora، wis، durung.'
    ar: 'الإندونيسية: tidak وsudah وbelum. والجاوية: ora وwis وdurung.'
    en: 'Indonesian: tidak, sudah, belum. Javanese: ora, wis, durung.'
  - speaker: Mbak Sekar
    text: Lan "karo" iku dengan utawa sama. Aku karo kowe.
    ar_eg: و«karo» يعني dengan أو sama، مع. أنا وانت.
    ar: و«karo» تعني dengan أو sama، أي مع. أنا معك.
    en: And karo is dengan or sama, with. Me with you.
    note:
      ar_eg: "كلمات: dengan = مع، بـ؛ sama = sama = مع (إندونيسي)."
      ar: "مفردات: dengan = مع، بـ؛ sama = sama = مع (إندونيسية)."
      en: "Words: dengan = with, by (means of); sama = sama = with (Indonesian)."
  - speaker: Mas Danang
    text: '"Sing" iku yang. Sing abang, sing gedhe, sing enak.'
    ar_eg: «sing» يعني yang، اللي. اللي أحمر، اللي كبير، اللي حلو.
    ar: «sing» تعني yang، أي الذي. الأحمر، الكبير، اللذيذ.
    en: Sing is yang, the one that. The red one, the big one, the tasty one.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Aku wis mangan.
    ar_eg: أنا كلت خلاص.
    ar: لقد أكلت.
    en: I've eaten already.
  - speaker: Mas Danang
    text: Aku wis mangan.
    ar_eg: أنا كلت خلاص.
    ar: لقد أكلت.
    en: I've eaten already.
  - speaker: Mbak Sekar
    text: Aku durung mangan.
    ar_eg: أنا لسّه ماكلتش.
    ar: لم آكل بعد.
    en: I haven't eaten yet.
  - speaker: Mas Danang
    text: Aku durung mangan.
    ar_eg: أنا لسّه ماكلتش.
    ar: لم آكل بعد.
    en: I haven't eaten yet.
  - speaker: Mbak Sekar
    text: Aku lagi nyambut gawe.
    ar_eg: أنا بشتغل دلوقتي.
    ar: أنا أعمل الآن.
    en: I'm working right now.
    note:
      ar_eg: "كلمات: gawe = يعمل / يحضّر (= buat)؛ nyambut = nyambut gawe = يشتغل."
      ar: "مفردات: gawe = يصنع / يُعِدّ (= buat)؛ nyambut = nyambut gawe = يعمل."
      en: "Words: gawe = to make (= buat); nyambut = nyambut gawe = to work."
  - speaker: Mas Danang
    text: Aku lagi nyambut gawe.
    ar_eg: أنا بشتغل دلوقتي.
    ar: أنا أعمل الآن.
    en: I'm working right now.
  - speaker: Mbak Sekar
    text: Aku arep neng Alkid.
    ar_eg: أنا رايح ألكيد.
    ar: سأذهب إلى ألكيد.
    en: I'm going to Alkid.
  - speaker: Mas Danang
    text: Aku arep neng Alkid.
    ar_eg: أنا رايح ألكيد.
    ar: سأذهب إلى ألكيد.
    en: I'm going to Alkid.
  - speaker: Mbak Sekar
    text: Sik ya, aku isih neng dalan.
    ar_eg: استنّى، أنا لسّه في الطريق.
    ar: انتظر، ما زلت في الطريق.
    en: Hang on, I'm still on the way.
    note:
      ar_eg: "كلمات: dalan = طريق / شارع (= jalan)."
      ar: "مفردات: dalan = طريق (= jalan)."
      en: "Words: dalan = road, way (= jalan)."
  - speaker: Mas Danang
    text: Sik ya, aku isih neng dalan.
    ar_eg: استنّى، أنا لسّه في الطريق.
    ar: انتظر، ما زلت في الطريق.
    en: Hang on, I'm still on the way.
  - speaker: Mbak Sekar
    text: Ra popo, aku tunggu.
    ar_eg: مفيش مشكلة، أنا مستنّي.
    ar: لا بأس، سأنتظر.
    en: No worries, I'll wait.
  - speaker: Mas Danang
    text: Ra popo, aku tunggu.
    ar_eg: مفيش مشكلة، أنا مستنّي.
    ar: لا بأس، سأنتظر.
    en: No worries, I'll wait.
  - speaker: Mbak Sekar
    text: "Wis mangan, durung?"
    ar_eg: "كلت ولّا لسّه؟"
    ar: "هل أكلت أم ليس بعد؟"
    en: "Eaten yet, or not?"
  - speaker: Mas Danang
    text: "Wis mangan, durung?"
    ar_eg: "كلت ولّا لسّه؟"
    ar: "هل أكلت أم ليس بعد؟"
    en: "Eaten yet, or not?"
  - speaker: Mas Danang
    text: "Lan \"otw\" iku basa Inggris, hehe."
    ar_eg: "و«otw» ده إنجليزي (on the way)، هههه."
    ar: "و«otw» إنجليزية (on the way)، هههه."
    en: "And \"otw\" is English (on the way), hehe."
    note:
      ar_eg: "كلمات: otw = في الطريق (من الإنجليزي on the way)."
      ar: "مفردات: otw = في الطريق (من الإنجليزية on the way)."
      en: "Words: otw = on the way (English shorthand)."
- kind: outro
  title: Chat kanggo Danang
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, kirimen chat Jawa kanggo aku. Nganggo wis utawa durung, lan arep.
    ar_eg: يا ماس محمد، ابعتلي شات بالجاوي. استخدم wis أو durung، وarep.
    ar: يا ماس محمد، أرسل لي رسالة بالجاوية. استعمل wis أو durung، وarep.
    en: Mas Mohamed, send me a Javanese chat. Use wis or durung, and arep.
    note:
      ar_eg: "دورك! اكتب رسالة صغيّرة زي الشباب، وجرّب تختصر - arp، ng، sik. كلمات: kanggo = لـ، عشان (نغوكو)."
      ar: "دورك! اكتب رسالة قصيرة كالشباب، وجرّب الاختصار - arp وng وsik. مفردات: kanggo = لِـ، من أجل (نغوكو)."
      en: "Your turn! Write a short message like the young ones do, and try shortening - arp, ng, sik. Words: kanggo = for (ngoko) = untuk."
  - speaker: Mbak Sekar
    text: 'Contone: Aku durung mangan. Sesuk aku arep neng Jakal.'
    ar_eg: 'مثلًا: أنا لسّه ماكلتش. بكرة هروح جاكال.'
    ar: 'مثلًا: لم آكل بعد. غدًا سأذهب إلى جاكال.'
    en: 'For example: I haven''t eaten yet. Tomorrow I''m going to Jakal.'
    note:
      ar_eg: "كلمات: sesuk = بكرة."
      ar: "مفردات: sesuk = غدًا."
      en: "Words: sesuk = tomorrow (besok)."
  - speaker: Mas Danang
    text: PR-mu, golek status WA telu nganggo basa Jawa, banjur tandhai tembung Jawane.
    ar_eg: واجبك، دوّر على تلات ستيتوس واتساب بالجاوي، وعلّم على الكلمات الجاوي.
    ar: 'واجبك: ابحث عن ثلاث حالات واتساب بالجاوية وعلّم كلماتها الجاوية.'
    en: 'Your homework: find three WhatsApp statuses in Javanese and mark the Javanese words.'
    note:
      ar_eg: "كلمات: status = حالة، ستيتس (على السوشيال)؛ telu = تلاتة (tiga)؛ قبل ewu: telung."
      ar: "مفردات: status = حالة، منشور حالة؛ telu = ثلاثة (tiga)؛ قبل ewu: telung."
      en: "Words: status = status; status update; telu = three (tiga); before ewu: telung."
  - speaker: Mbak Sekar
    text: Sesuk kita neng Jalan Kaliurang, utawa Jakal, cedhak kampus. Nganti ketemu!
    ar_eg: بكرة رايحين شارع كاليورانج، أو «جاكال»، جنب الجامعة. نتقابل!
    ar: غدًا نذهب إلى شارع كاليورانغ، أو «جاكال»، قرب الجامعة. إلى اللقاء!
    en: Tomorrow we go to Jalan Kaliurang, or Jakal, near the campus. See you!
    note:
      ar_eg: "كلمات: cedhak = قريب؛ nganti = لحد (= sampai)."
      ar: "مفردات: cedhak = قريب؛ nganti = حتى (= sampai)."
      en: "Words: cedhak = near, close; nganti = until (= sampai)."
words:
- durung
- lagi
- arep
- isih
- ra
- sik
- neng
- ora apa-apa
- ngerti
- karo
- sing
- abang
review:
  status: draft
  verified: false
  notes: 'Chat spelling and marker words at Alun-alun Kidul (Alkid) at night: lit-up pedal cars and the masangin game (walking blindfolded between the two banyan trees) - kept general. Abbreviations (arp, ng, ws, gk, otw) are common but vary by writer; left as examples, not rules.'
