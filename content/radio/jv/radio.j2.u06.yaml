title:
  target: Dolan-dolan
  ar_eg: فسحة
  ar: نزهة
  en: Going out
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Benteng Pendem Ngawi
  lines:
  - speaker: Mas Danang
    text: Kanca-kanca! Kabar Radio saiki ana ing Benteng Pendem, Ngawi. Aku Danang.
    ar_eg: يا صحاب! كبار راديو دلوقتي في قلعة بيندِم في نجاوي. أنا دانانج.
    ar: يا أصدقاء! كبار راديو الآن في قلعة بيندِم في نغاوي. أنا دانانغ.
    en: Friends! Kabar Radio is at Benteng Pendem in Ngawi now. I'm Danang.
    note:
      ar_eg: نجاوي جنب ماديون، وأهلها بيتكلّموا نفس الجاوي. kanca-kanca = يا صحاب.
      ar: نغاوي جارة ماديون ويتكلّم أهلها الجاوية نفسها. kanca-kanca = يا أصدقاء.
      en: Ngawi is Madiun's neighbour and speaks the same Javanese. Kanca-kanca = friends.
  - speaker: Mbak Sekar
    text: Aku Sekar. Benteng iki digawe Walanda biyen, cedhak kali Bengawan Solo. Saiki dadi papan dolan.
    ar_eg: أنا سيكار. القلعة دي عملها الهولنديين زمان، جنب نهر بينجاوان سولو. ودلوقتي بقت مكان فسحة.
    ar: أنا سيكار. بنى الهولنديّون هذه القلعة قديمًا قرب نهر بنغاوان سولو، وصارت الآن مكانًا للنزهة.
    en: I'm Sekar. The Dutch built this fort long ago, near the Bengawan Solo river. Now it's a place to go out.
    note:
      ar_eg: اسمها «القلعة المدفونة» لأنها مبنيّة أوطى من الأرض اللي حواليها وحواليها ساتر ترابي.
      ar: تسمّى «القلعة المدفونة» لأنّها أخفض من الأرض حولها ويحيط بها ساتر ترابيّ.
      en: It's called the "buried fort" because it sits lower than the land around it, behind earth walls.
  - speaker: Mas Danang
    text: Dina iki kita sinau tembung dobel kaya mlaku-mlaku, lan tembung kanggo nyambung crita.
    ar_eg: النهارده هنتعلّم الكلمات المكرّرة زي mlaku-mlaku، والكلمات اللي بتربط الكلام.
    ar: اليوم نتعلّم الكلمات المكرّرة مثل mlaku-mlaku، وكلمات ربط الكلام.
    en: Today we learn doubled words like mlaku-mlaku, and words that link a story.
- kind: dialogue
  title: Liburan akhir minggu
  lines:
  - speaker: Mbak Sekar
    text: Danang, akhir minggu wingi kowe ngapa?
    ar_eg: يا دانانج، الويك إند اللي فات عملت إيه؟
    ar: يا دانانغ، ماذا فعلت نهاية الأسبوع الماضي؟
    en: Danang, what did you do last weekend?
  - speaker: Mas Danang
    text: Aku dolan neng kene karo adhiku. Mlaku-mlaku ngubengi benteng.
    ar_eg: جيت هنا أتفسّح مع أخويا الصغيّر. اتمشّينا حوالين القلعة.
    ar: جئت هنا للنزهة مع أخي الأصغر. تمشّينا حول القلعة.
    en: I came here with my little brother. We strolled around the fort.
  - speaker: Mbak Sekar
    text: Piye? Apik?
    ar_eg: وإيه؟ حلوة؟
    ar: وكيف كانت؟ جميلة؟
    en: How was it? Nice?
  - speaker: Mas Danang
    text: Apik banget! Temboke gedhe lan lawas, nanging saiki wis resik. Terus kita foto-foto.
    ar_eg: حلوة أوي! الحيطان كبيرة وقديمة، بس دلوقتي نضيفة. وبعدين اتصوّرنا.
    ar: جميلة جدًّا! الجدران كبيرة وقديمة، لكنّها نظيفة الآن. ثمّ التقطنا الصور.
    en: Really nice! The walls are big and old, but clean now. Then we took photos.
  - speaker: Mbak Sekar
    text: Terus?
    ar_eg: وبعدين؟
    ar: ثمّ؟
    en: And then?
  - speaker: Mas Danang
    text: Terus kita mangan tahu tepo ing pinggir dalan. Enak pol!
    ar_eg: وبعدين كلنا «tahu tepo» على جنب الطريق. حلو موت!
    ar: ثمّ أكلنا «tahu tepo» على جانب الطريق. لذيذ جدًّا!
    en: Then we had tahu tepo at a roadside stall. Super tasty!
    note:
      ar_eg: tahu tepo = توفو ورزّ مضغوط بصلصة فول سوداني وصويا حلوة - أكلة نجاوي المشهورة. pol = «موت / على الآخر».
      ar: tahu tepo = توفو وأرزّ مضغوط بصلصة الفول السوداني والصويا الحلوة - طبق نغاوي الشهير. وpol = «إلى أقصى حدّ».
      en: Tahu tepo = tofu and pressed rice in peanut and sweet soy sauce - Ngawi's famous dish. Pol = "to the max".
  - speaker: Mbak Sekar
    text: Kowe seneng tenan, ya. Adhimu uga seneng?
    ar_eg: انت مبسوط بجدّ. وأخوك كمان انبسط؟
    ar: أنت مسرور حقًّا. وهل سُرّ أخوك أيضًا؟
    en: You really enjoyed it. Did your brother too?
  - speaker: Mas Danang
    text: Seneng, nanging kesel merga mlaku adoh. Mulih-mulih langsung turu!
    ar_eg: انبسط، بس تعب عشان مشينا كتير. أوّل ما روّحنا نام على طول!
    ar: سُرّ، لكنّه تعب لأنّنا مشينا كثيرًا. ما إن عدنا حتى نام!
    en: He did, but he was tired because we walked far. The moment we got home he fell asleep!
  - speaker: Mbak Sekar
    text: Hahaha. Akhir minggu wingi aku mung ing omah, maca buku lan masak.
    ar_eg: ههههه. أنا الويك إند اللي فات كنت في البيت بس، بقرا كتاب وبطبخ.
    ar: ههههه. أنا قضيت نهاية الأسبوع الماضي في البيت فقط، أقرأ وأطبخ.
    en: Hahaha. Last weekend I just stayed home, reading and cooking.
  - speaker: Mas Danang
    text: Ora apa-apa. Istirahat iku uga penting, merga minggu iki kita pindhah menyang Jogja!
    ar_eg: مفيش مشكلة. الراحة مهمّة برضه، عشان الأسبوع ده هننقل يوجيا!
    ar: لا بأس. الراحة مهمّة أيضًا، لأنّنا ننتقل إلى يوغيا هذا الأسبوع!
    en: That's fine. Rest matters too, because this week we move to Yogya!
- kind: word_spotlight
  title: Mlaku-mlaku, apik banget
  lines:
  - speaker: Mbak Sekar
    text: 'Tembung dobel: mlaku-mlaku, dolan-dolan, foto-foto. Tegese santai, ora ana tujuan.'
    ar_eg: 'الكلمات المكرّرة: يتمشّى، يتفسّح، يتصوّر. معناها براحتك، من غير هدف معيّن.'
    ar: 'الكلمات المكرّرة: يتمشّى، يتنزّه، يتصوّر. تعني الاسترخاء بلا هدف محدّد.'
    en: 'Doubled words: mlaku-mlaku, dolan-dolan, foto-foto. They mean relaxed, no particular goal.'
    note:
      ar_eg: mlaku = يمشي، mlaku-mlaku = يتمشّى. زي الإندونيسي jalan-jalan.
      ar: mlaku = يمشي، وmlaku-mlaku = يتمشّى. مثل الإندونيسية jalan-jalan.
      en: Mlaku = walk; mlaku-mlaku = stroll. Like Indonesian jalan-jalan.
  - speaker: Mas Danang
    text: Apik banget, apik tenan, apik pol. Kabeh tegese "apik sanget". Pol iku sing paling banter!
    ar_eg: حلو أوي، حلو بجدّ، حلو موت. كلّهم معناهم «حلو جدًّا». pol أقواهم!
    ar: جميل جدًّا، جميل حقًّا، جميل للغاية. كلّها تعني «جميل جدًّا»، وpol أقواها!
    en: Apik banget, apik tenan, apik pol. All mean "very good". Pol is the strongest!
  - speaker: Mbak Sekar
    text: 'Nyambung crita: lan, karo, nanging, terus, merga.'
    ar_eg: 'ربط الحكاية: و، مع، بس، وبعدين، عشان.'
    ar: 'ربط القصّة: و، مع، لكن، ثمّ، لأنّ.'
    en: 'Linking a story: and, with, but, then, because.'
  - speaker: Mas Danang
    text: Aku seneng, nanging kesel, merga mlaku adoh. Terus aku turu!
    ar_eg: كنت مبسوط، بس تعبان، عشان مشيت كتير. وبعدين نمت!
    ar: كنت مسرورًا لكنّي متعب لأنّي مشيت كثيرًا. ثمّ نمت!
    en: I was happy but tired, because I walked far. Then I slept!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Aku dolan karo adhiku.
    ar_eg: اتفسّحت مع أخويا.
    ar: تنزّهت مع أخي.
    en: I went out with my younger brother.
  - speaker: Mas Danang
    text: Aku dolan karo adhiku.
    ar_eg: اتفسّحت مع أخويا.
    ar: تنزّهت مع أخي.
    en: I went out with my younger brother.
  - speaker: Mbak Sekar
    text: Apik pol!
    ar_eg: حلوة موت!
    ar: رائعة للغاية!
    en: Super nice!
  - speaker: Mas Danang
    text: Apik pol!
    ar_eg: حلوة موت!
    ar: رائعة للغاية!
    en: Super nice!
  - speaker: Mbak Sekar
    text: Aku seneng, nanging kesel.
    ar_eg: كنت مبسوط، بس تعبان.
    ar: كنت مسرورًا لكنّي متعب.
    en: I was happy, but tired.
  - speaker: Mas Danang
    text: Aku seneng, nanging kesel.
    ar_eg: كنت مبسوط، بس تعبان.
    ar: كنت مسرورًا لكنّي متعب.
    en: I was happy, but tired.
  - speaker: Mbak Sekar
    text: Terus kita mangan tahu tepo.
    ar_eg: وبعدين كلنا تاهو تيبو.
    ar: ثمّ أكلنا تاهو تيبو.
    en: Then we ate tahu tepo.
  - speaker: Mas Danang
    text: Terus kita mangan tahu tepo.
    ar_eg: وبعدين كلنا تاهو تيبو.
    ar: ثمّ أكلنا تاهو تيبو.
    en: Then we ate tahu tepo.
  - speaker: Mbak Sekar
    text: Aku mlaku-mlaku ing benteng.
    ar_eg: اتمشّيت في القلعة.
    ar: تمشّيت في القلعة.
    en: I strolled around the fort.
  - speaker: Mas Danang
    text: Aku mlaku-mlaku ing benteng.
    ar_eg: اتمشّيت في القلعة.
    ar: تمشّيت في القلعة.
    en: I strolled around the fort.
  - speaker: Mbak Sekar
    text: Kesel merga mlaku adoh.
    ar_eg: تعبان عشان مشيت كتير.
    ar: متعب لأنّي مشيت كثيرًا.
    en: Tired because I walked far.
