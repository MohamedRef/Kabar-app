    text: Kesel merga mlaku adoh.
    ar_eg: تعبان عشان مشيت كتير.
    ar: متعب لأنّي مشيت كثيرًا.
    en: Tired because I walked far.
- kind: outro
  title: Dolanane Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, critakna liburanmu sing paling apik. Nganggo terus, nanging, lan merga.
    ar_eg: يا ماس محمد، احكيلنا عن أحلى أجازة ليك. استخدم terus وnanging وmerga.
    ar: يا ماس محمد، حدّثنا عن أجمل عطلة لك. استعمل terus وnanging وmerga.
    en: Mas Mohamed, tell us about your best holiday. Use terus, nanging and merga.
    note:
      ar_eg: دورك! خمس جمل، وفيهم كلمة مكرّرة واحدة على الأقل وbanget أو pol.
      ar: دورك! خمس جمل، فيها كلمة مكرّرة واحدة على الأقلّ وbanget أو pol.
      en: Your turn! Five sentences, with at least one doubled word and banget or pol.
  - speaker: Mas Danang
    text: 'Contone: Aku dolan menyang Iskandariyah karo kulawargaku. Segarane apik pol, nanging panas banget.'
    ar_eg: 'مثلًا: اتفسّحت في إسكندرية مع عيلتي. البحر كان حلو موت، بس الجوّ كان حرّ أوي.'
    ar: 'مثلًا: تنزّهت في الإسكندرية مع عائلتي. كان البحر رائعًا، لكنّ الجوّ حارّ جدًّا.'
    en: 'For example: I went to Alexandria with my family. The sea was gorgeous, but it was very hot.'
  - speaker: Mbak Sekar
    text: PR-mu, wacanen status Dimas ing pelajaran lan golekana tembung dobele.
    ar_eg: واجبك، اقرا ستيتوس ديماس في الدرس، ودوّر على الكلمات المكرّرة.
    ar: 'واجبك: اقرأ حالة ديماس في الدرس وابحث عن الكلمات المكرّرة.'
    en: 'Your homework: read Dimas''s status in the lesson and find the doubled words.'
  - speaker: Mas Danang
    text: Suwun, Madiun lan Ngawi! Sesuk kita menyang Jogja, kuthane basa alus. Danang kudu sinau krama, hehe. Nganti ketemu!
    ar_eg: شكرًا يا ماديون ونجاوي! بكرة رايحين يوجيا، بلد الكلام الراقي. دانانج لازم يتعلّم كراما، هههه. نتقابل!
    ar: شكرًا يا ماديون ونغاوي! غدًا نذهب إلى يوغيا، مدينة الكلام الرفيع. على دانانغ أن يتعلّم الكراما، هههه. إلى اللقاء!
    en: Thanks, Madiun and Ngawi! Tomorrow we're off to Yogya, city of refined speech. Danang has to learn krama, hehe. See you!
