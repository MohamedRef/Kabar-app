schema: kabar.radio/v1
id: radio.j6.u03
language: jv
level: j6
unit: j6.u03
title:
  target: Sandhangan panyigeg
  ar_eg: علامات السكون
  ar: علامات السكون
  en: Final consonants
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Makam Raja Mataram
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saking makam raja Mataram ing Kotagedhe. Kula Sekar. Dina menika kula nganggo busana Jawa, jarik lan kebaya.
    ar_eg: صباح الخير من مقابر ملوك ماتارام في كوتاجيدي. أنا سيكار. النهارده أنا لابسة لبس جاوي، جاريك وكيبايا.
    ar: 'صباح الخير من مقابر ملوك ماتارام في كوتاغيدي. أنا سيكار. ألبس اليوم الزيّ الجاويّ: جاريك وكيبايا.'
    en: Good morning from the royal graves of Mataram in Kotagede. I'm Sekar. Today I'm wearing Javanese dress, jarik and kebaya.
  - speaker: Mas Danang
    text: Aku Danang. Aku nganggo surjan lan blangkon. Panas, cah, nanging iki aturane.
    ar_eg: أنا دانانج. أنا لابس سورجان وبلانكون. حرّ يا جماعة، بس دي القواعد.
    ar: أنا دانانغ. ألبس سورجان وبلانكون. الجوّ حارّ لكن هذه هي القواعد.
    en: I'm Danang. I'm wearing a surjan and blangkon. Hot, folks, but these are the rules.
    note:
      ar_eg: "لزيارة المقابر الملكية لازم تلبس اللبس الجاوي التقليدي. ممكن تأجّره عند الباب. كلمات: aturane = القواعد بتاعته، النظام."
      ar: "لزيارة المقابر الملكية يجب لبس الزيّ الجاويّ التقليديّ، ويمكن استئجاره عند الباب. مفردات: aturane = قواعده، نظامه."
      en: "Visitors to the royal graves must wear traditional Javanese dress. It can be rented at the gate. Words: aturane = the rules."
  - speaker: Mbak Sekar
    text: Dina iki kita sinau sandhangan panyigeg. Panyigeg tegese "penutup", kanggo konsonan ing mburi.
    ar_eg: النهارده هنتعلّم علامات السكون. panyigeg معناها «اللي بيقفل»، للحرف الساكن في الآخر.
    ar: نتعلّم اليوم علامات السكون. panyigeg تعني «المُغلِق»، للساكن في آخر المقطع.
    en: Today we learn closing marks. Panyigeg means "closer", for consonants at the end.
- kind: dialogue
  title: Aturan ing makam
  lines:
  - speaker: Mas Danang
    text: Mbak, papan ing gapura iku tulisane apa?
    ar_eg: يا مباك، اليافطة اللي على البوّابة مكتوب عليها إيه؟
    ar: يا مباك، ماذا كُتب على لوحة البوّابة؟
    en: Mbak, what does that sign on the gate say?
  - speaker: Mbak Sekar
    text: Tulisane "makam". Ma, ka, lan ma cilik kanthi pangkon.
    ar_eg: مكتوب «makam». ma وka، وma صغيّرة بالـ pangkon.
    ar: 'مكتوب «makam»: ma ثمّ ka ثمّ m ساكنة بالـ pangkon.'
    en: It says "makam". Ma, ka, and a small ma with pangkon.
    note:
      ar_eg: "pangkon ꧀ = سكون، بيشيل الـ a من الحرف. ꦩꦏꦩ꧀ = makam. كلمات: ma = أسماء حروف جاوية."
      ar: "pangkon ꧀ = سكون يحذف الـ a. ꦩꦏꦩ꧀ = makam. مفردات: ma = أسماء حروف جاوية."
      en: "Pangkon ꧀ kills the vowel, like Arabic sukun. ꦩꦏꦩ꧀ = makam. Words: ma = names of Javanese letters."
  - speaker: Mas Danang
    text: Pangkon iku kaya sukun ing basa Arab!
    ar_eg: الـ pangkon زي السكون في العربي!
    ar: pangkon مثل السكون في العربية!
    en: Pangkon is like sukun in Arabic!
  - speaker: Mbak Sekar
    text: Leres. Nanging kanggo ng, r, lan h ana tandha khusus. Cecak kanggo ng.
    ar_eg: صحّ. بس للـ ng والـ r والـ h فيه علامات مخصوص. cecak للـ ng.
    ar: صحيح، لكن لـ ng وr وh علامات خاصّة. cecak لـ ng.
    en: Right. But for ng, r and h there are special marks. Cecak for ng.
    note:
      ar_eg: "كلمات: tandha = علامة، إشارة."
      ar: "مفردات: tandha = علامة."
      en: "Words: tandha = sign, mark."
  - speaker: Mas Danang
    text: Kaya ing tembung "Kotagedhe"? Ora ana ng.
    ar_eg: زي كلمة Kotagedhe؟ مفيهاش ng.
    ar: مثل Kotagedhe؟ ليس فيها ng.
    en: Like in "Kotagedhe"? There's no ng.
  - speaker: Mbak Sekar
    text: Kaya ing tembung "pasang", utawa "Mataram"... ora, Mataram nganggo pangkon. "Pasar" nganggo layar, kanggo r.
    ar_eg: زي كلمة pasang... أو Mataram... لأ، Mataram بالـ pangkon. وpasar بالـ layar، للـ r.
    ar: مثل pasang... أو Mataram... لا، Mataram بـ pangkon. أمّا pasar فبـ layar لـ r.
    en: Like "pasang", or "Mataram"... no, Mataram uses pangkon. "Pasar" uses layar, for r.
    note:
      ar_eg: cecak ꦁ = ng في الآخر. layar ꦂ = r في الآخر. الاتنين فوق الحرف.
      ar: cecak ꦁ = ng آخرَ المقطع، وlayar ꦂ = r، وكلاهما فوق الحرف.
      en: Cecak ꦁ is final ng, layar ꦂ is final r. Both sit on top.
  - speaker: Mas Danang
    text: Lan wignyan kanggo h. Kaya "Allah" lan "sugeng rawuh"!
    ar_eg: والـ wignyan للـ h. زي Allah وsugeng rawuh!
    ar: وwignyan لـ h، مثل Allah وsugeng rawuh!
    en: And wignyan for h. Like "Allah" and "sugeng rawuh"!
    note:
      ar_eg: "كلمات: allah = ربنا، الله."
      ar: "مفردات: allah = الله."
      en: "Words: allah = God, Allah."
  - speaker: Mbak Sekar
    text: Pinter, Danang. Ing gapura iki uga ana tulisan "sugeng rawuh". Rawuh nganggo wignyan.
    ar_eg: شاطر يا دانانج. على البوّابة دي برضه مكتوب sugeng rawuh. وrawuh بالـ wignyan.
    ar: أحسنت يا دانانغ. على البوّابة أيضًا «sugeng rawuh»، وrawuh بـ wignyan.
    en: Clever, Danang. This gate also says "sugeng rawuh". Rawuh uses wignyan.
    note:
      ar_eg: ꦱꦸꦒꦼꦁꦫꦮꦸꦃ = sugeng rawuh، أهلًا بيك. فيها cecak وwignyan مع بعض.
      ar: ꦱꦸꦒꦼꦁꦫꦮꦸꦃ = sugeng rawuh أي أهلًا بك، وفيها cecak وwignyan.
      en: ꦱꦸꦒꦼꦁꦫꦮꦸꦃ = sugeng rawuh, welcome. It has both cecak and wignyan.
- kind: word_spotlight
  title: Cecak, layar, wignyan, pangkon
  lines:
  - speaker: Mbak Sekar
    text: 'Cecak: ng. Layar: r. Wignyan: h. Telu iki ing dhuwur utawa ing mburi aksara.'
    ar_eg: 'cecak: ng. layar: r. wignyan: h. التلاتة دول فوق الحرف أو وراه.'
    ar: 'cecak: ng، layar: r، wignyan: h. هذه الثلاث فوق الحرف أو بعده.'
    en: 'Cecak: ng. Layar: r. Wignyan: h. These three sit on top of or after the letter.'
    note:
      ar_eg: "كلمات: dhuwur = عالي، طويل."
      ar: "مفردات: dhuwur = عالٍ، طويل."
      en: "Words: dhuwur = high, tall."
  - speaker: Mas Danang
    text: Konsonan liyane nganggo pangkon. Gampang, kaya sukun!
    ar_eg: باقي الحروف الساكنة بالـ pangkon. سهلة، زي السكون!
    ar: وبقيّة السواكن بـ pangkon. سهل كالسكون!
    en: Other consonants use pangkon. Easy, like sukun!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Makam, nganggo pangkon.
    ar_eg: makam، بالـ pangkon.
    ar: makam، بـ pangkon.
    en: Makam, with pangkon.
  - speaker: Mas Danang
    text: Makam, nganggo pangkon.
    ar_eg: makam، بالـ pangkon.
    ar: makam، بـ pangkon.
    en: Makam, with pangkon.
  - speaker: Mbak Sekar
    text: Pasar, nganggo layar.
    ar_eg: pasar، بالـ layar.
    ar: pasar، بـ layar.
    en: Pasar, with layar.
  - speaker: Mas Danang
    text: Pasar, nganggo layar.
    ar_eg: pasar، بالـ layar.
    ar: pasar، بـ layar.
    en: Pasar, with layar.
  - speaker: Mbak Sekar
    text: Sugeng, nganggo cecak.
    ar_eg: sugeng، بالـ cecak.
    ar: sugeng، بـ cecak.
    en: Sugeng, with cecak.
  - speaker: Mas Danang
    text: Sugeng, nganggo cecak.
    ar_eg: sugeng، بالـ cecak.
    ar: sugeng، بـ cecak.
    en: Sugeng, with cecak.
  - speaker: Mbak Sekar
    text: Rawuh, nganggo wignyan.
    ar_eg: rawuh، بالـ wignyan.
    ar: rawuh، بـ wignyan.
    en: Rawuh, with wignyan.
  - speaker: Mas Danang
    text: Rawuh, nganggo wignyan.
    ar_eg: rawuh، بالـ wignyan.
    ar: rawuh، بـ wignyan.
    en: Rawuh, with wignyan.
  - speaker: Mbak Sekar
    text: 'Saiki tembung loro maneh saka papan ing makam: "aji" lan "papan".'
    ar_eg: 'دلوقتي كلمتين كمان من اليافطات اللي في المقابر: aji وpapan.'
    ar: 'والآن كلمتان أخريان من لوحات المقابر: aji وpapan.'
    en: 'Now two more words from the signs at the graves: "aji" and "papan".'
  - speaker: Mas Danang
    text: 'Aji: ha lan ja nganggo wulu. Tegese aji, regane dhuwur.'
    ar_eg: 'aji: ha وja بالـ wulu. معناها قيّم، غالي.'
    ar: 'aji: ha ثمّ ja بـ wulu، وتعني «ثمين، ذو قيمة».'
    en: 'Aji: ha, and ja with wulu. It means valuable, precious.'
    note:
      ar_eg: "كلمات: ha, ja = أسماء حروف جاوية."
      ar: "مفردات: ha, ja = أسماء حروف جاوية."
      en: "Words: ha, ja = names of Javanese letters."
  - speaker: Mbak Sekar
    text: 'Papan: pa, pa, lan na nganggo pangkon. Papan iku tegese papan tulisan, utawa panggonan.'
    ar_eg: 'papan: pa وpa وna بالـ pangkon. papan معناها يافطة، أو مكان.'
    ar: 'papan: pa ثمّ pa ثمّ n بـ pangkon. تعني لوحة أو مكانًا.'
    en: 'Papan: pa, pa, and na with pangkon. Papan means a sign board, or a place.'
  - speaker: Mas Danang
    text: Lan ing pungkasan papan ing makam ana tandha cilik kaya koma. Iku pada lingsa.
    ar_eg: وفي آخر يافطة المقابر فيه علامة صغيّرة زي الفصلة. دي pada lingsa.
    ar: وفي آخر لوحة المقابر علامة صغيرة كالفاصلة، هي pada lingsa.
    en: And at the end of the sign there's a small mark like a comma. That's pada lingsa.
  - speaker: Mbak Sekar
    text: Pada lingsa kaya koma, pada lungsi kaya titik. Tulisan Jawa uga duwe tandha waca.
    ar_eg: pada lingsa زي الفصلة، وpada lungsi زي النقطة. الكتابة الجاوي ليها علامات ترقيم برضه.
    ar: pada lingsa كالفاصلة وpada lungsi كالنقطة، فللكتابة الجاوية علامات ترقيم أيضًا.
    en: Pada lingsa is like a comma, pada lungsi like a full stop. Javanese writing has punctuation too.
- kind: outro
  title: Jeneng lengkap
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, saiki jenengmu wis lengkap! Mo, ha, ma, lan da nganggo pangkon.
    ar_eg: يا ماس محمد، دلوقتي اسمك كمل! mo ha ma، والـ d بالـ pangkon.
    ar: 'يا ماس محمد، اكتمل اسمك الآن: mo ha ma ثمّ d بـ pangkon.'
    en: Mas Mohamed, your name is complete now! Mo, ha, ma, and da with pangkon.
    note:
      ar_eg: "ꦩꦺꦴꦲꦩꦢ꧀ = Mohamad، أقرب كتابة لاسمك بالحروف الجاوي. اكتبه بالقلم في الدفتر! كلمات: da = أسماء حروف جاوية."
      ar: "ꦩꦺꦴꦲꦩꦢ꧀ = Mohamad، أقرب كتابة لاسمك بالحرف الجاوي. اكتبه في الدفتر! مفردات: da = أسماء حروف جاوية."
      en: "ꦩꦺꦴꦲꦩꦢ꧀ = Mohamad, the closest spelling of your name in Javanese script. Write it in your notebook! Words: da = names of Javanese letters."
  - speaker: Mbak Sekar
    text: PR-ne, wacanen layang saka Mas Dimas ing pelajaran. Golekana cecak, layar, lan wignyan.
    ar_eg: الواجب، اقرا الجواب اللي من ماس ديماس في الدرس. دوّر على cecak وlayar وwignyan.
    ar: 'الواجب: اقرأ رسالة ماس ديماس في الدرس وابحث عن cecak وlayar وwignyan.'
    en: 'Homework: read Mas Dimas''s letter in the lesson. Find cecak, layar and wignyan.'
  - speaker: Mbak Sekar
    text: Sesuk kita dhateng Jagalan, sinau pasangan. Nganti pinanggih malih!
    ar_eg: بكرة رايحين جاجالان، نتعلّم الـ pasangan. إلى اللقاء!
    ar: غدًا نذهب إلى جاغالان لنتعلّم الـ pasangan. إلى اللقاء!
    en: Tomorrow we go to Jagalan to learn pasangan. Until next time!
words:
- panyigeg
- cecak
- layar
- wignyan
- pangkon
- makam
- busana
review:
  status: draft
  verified: false
  notes: Closing syllables with cecak (-ng), layar (-r), wignyan (-h) and pangkon, at the royal graves of Mataram, where visitors wear Javanese dress.
