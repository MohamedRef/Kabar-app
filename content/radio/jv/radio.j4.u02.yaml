language: jv
level: j4
unit: j4.u02
title:
  target: Krama inggil (aran)
  ar_eg: أسماء التكريم
  ar: أسماء التبجيل
  en: Honorific nouns
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Malioboro
  lines:
  - speaker: Mas Danang
    text: Sugeng sonten saking Malioboro! Andhong, becak, lan wong mlaku-mlaku ing endi-endi. Kula Danang.
    ar_eg: مساء الخير من ماليوبورو! حناطير وبيشاك وناس بتتمشّى في كل حتّة. أنا دانانج.
    ar: مساء الخير من ماليوبورو! عربات خيل وبيتشاك ومتنزّهون في كلّ مكان. أنا دانانغ.
    en: Good evening from Malioboro! Horse carts, becaks and strollers everywhere. I'm Danang.
    note:
      ar_eg: andhong = حنطور، becak = عجلة بتلات عجلات بيسوقها راجل. ماليوبورو أشهر شارع في يوجيا.
      ar: andhong = عربة خيل، وbecak = درّاجة بثلاث عجلات يقودها رجل. وماليوبورو أشهر شوارع يوغيا.
      en: Andhong = horse cart, becak = pedal rickshaw. Malioboro is Yogya's most famous street.
  - speaker: Mbak Sekar
    text: Kula Sekar. Wingi kita sinau kriya krama inggil. Dina iki aran, tembung barang.
    ar_eg: أنا سيكار. امبارح اتعلّمنا أفعال الكراما إنجيل. النهارده الأسماء.
    ar: أنا سيكار. أمس تعلّمنا أفعال الكراما إنغيل، واليوم الأسماء.
    en: I'm Sekar. Yesterday we learned krama inggil verbs. Today, nouns.
  - speaker: Mas Danang
    text: Jeneng, umur, omah, tangan, sirah. Kanggo wong sepuh, kabeh ana tembung khusus!
    ar_eg: الاسم، والسنّ، والبيت، والإيد، والراس. للكبار، كلّهم ليهم كلمات مخصوصة!
    ar: الاسم والعمر والبيت واليد والرأس. للكبار كلّها لها كلمات خاصّة!
    en: Name, age, house, hand, head. For elders, they all have special words!
  - speaker: Mbak Sekar
    text: Mas Mohamed, iki kaya "hadretak" ing basa Mesir, sing ora mung ing tembung "kowe", nanging ing barang-barange uga.
    ar_eg: يا ماس محمد، دي زي «حضرتك» بس مش في «انت» بس، في حاجاته كمان.
    ar: يا ماس محمد، هذا مثل «حضرتك»، لكن لا في الضمير وحده بل في أشيائه أيضًا.
    en: Mas Mohamed, it's like "hadretak", but not only for "you" - for their things too.
- kind: dialogue
  title: Kenalan karo simbah ing Malioboro
  lines:
  - speaker: Mbak Sekar
    text: Danang, kula simbah ingkang sadean ageman batik. Sampeyan ingkang tumbas.
    ar_eg: يا دانانج، أنا الجدّة اللي بتبيع هدوم باتيك، وانت الزبون.
    ar: يا دانانغ، أنا الجدّة بائعة ملابس الباتيك، وأنت المشتري.
    en: Danang, I'm the grandma selling batik clothes. You're buying.
  - speaker: Mas Danang
    text: Sugeng sonten, Mbah. Nyuwun sewu, asmanipun sinten?
    ar_eg: مساء الخير يا جدّتي. لا مؤاخذة، اسم حضرتك إيه؟
    ar: مساء الخير يا جدّتي. عذرًا، ما اسم حضرتك؟
    en: Good evening, Mbah. Excuse me, what's your name?
  - speaker: Mbak Sekar
    text: Asma kula... eh, nami kula Mbah Darsih, Nak.
    ar_eg: اسمي... قصدي، اسمي مباه دارسيه يا ابني.
    ar: اسمي... أعني، اسمي مباه دارسيه يا بنيّ.
    en: My asma... I mean, my name is Mbah Darsih, my boy.
    note:
      ar_eg: حتى الكبار ساعات بيصلّحوا نفسهم! asma للتاني، nami لنفسك.
      ar: حتى الكبار يصحّحون أنفسهم أحيانًا! asma للآخر، وnami لنفسك.
      en: Even elders correct themselves! Asma for others, nami for yourself.
  - speaker: Mas Danang
    text: Yuswanipun pinten, Mbah? Ngapunten menawi kula lancang.
    ar_eg: سنّ حضرتك كام يا جدّتي؟ لا مؤاخذة لو قلّيت أدبي.
    ar: كم عمر حضرتك يا جدّتي؟ عذرًا إن تجاوزت.
    en: How old are you, Mbah? Forgive me if I'm being forward.
  - speaker: Mbak Sekar
    text: Mboten menapa. Yuswa kula pitung dasa. Kula sadean wonten mriki sampun sekawan dasa taun.
    ar_eg: مفيش حاجة. عندي سبعين سنة. ببيع هنا من أربعين سنة.
    ar: لا بأس. عمري سبعون. أبيع هنا منذ أربعين سنة.
    en: That's fine. I'm seventy. I've sold here for forty years.
  - speaker: Mas Danang
    text: Dalemipun Mbah wonten pundi?
    ar_eg: بيت حضرتك فين يا جدّتي؟
    ar: أين بيت حضرتك يا جدّتي؟
    en: Where is your home, Mbah?
  - speaker: Mbak Sekar
    text: Wonten Bantul, Nak. Saben enjing kula numpak bis.
    ar_eg: في بانتول يا ابني. كل يوم الصبح بركب الأتوبيس.
    ar: في بانتول يا بنيّ. أركب الحافلة كلّ صباح.
    en: In Bantul, my boy. Every morning I take the bus.
  - speaker: Mas Danang
    text: Wah, Mbah sehat sanget. Kula badhe tumbas ageman batik setunggal kangge ibu kula.
    ar_eg: يا سلام، حضرتك بصحّة حلوة. عايز أشتري هدوم باتيك واحدة لأمّي.
    ar: ما شاء الله، صحّتك جيّدة. أريد شراء ثوب باتيك واحد لأمّي.
    en: Wow, you're so healthy, Mbah. I'd like to buy one batik outfit for my mother.
  - speaker: Mbak Sekar
    text: Monggo dipun pilih, Nak. Menika sae, kangge ibu.
    ar_eg: اتفضّل اختار يا ابني. ده حلو للوالدة.
    ar: تفضّل اختر يا بنيّ. هذا جميل للأمّ.
    en: Please choose, my boy. This one's nice, for a mother.
  - speaker: Mas Danang
    text: Matur nuwun, Mbah. Mugi tansah sehat.
    ar_eg: متشكّر يا جدّتي. ربنا يديمك بصحّة.
    ar: شكرًا يا جدّتي. أدام الله صحّتك.
    en: Thank you, Mbah. May you always be healthy.
- kind: word_spotlight
  title: Asma, yuswa, dalem
  lines:
  - speaker: Mbak Sekar
    text: 'Jeneng: nami kanggo awake dhewe, asma kanggo wong sepuh. "Asmanipun sinten?"'
    ar_eg: 'الاسم: nami لنفسك، asma للكبير. «اسم حضرتك إيه؟»'
    ar: 'الاسم: nami لنفسك، وasma للكبير. «ما اسم حضرتك؟»'
    en: 'Name: nami for yourself, asma for an elder. "Asmanipun sinten?"'
  - speaker: Mas Danang
    text: Umur dadi yuswa. Omah dadi dalem. Tangan dadi asta. Sirah dadi mustaka.
    ar_eg: السنّ تبقى yuswa. البيت يبقى dalem. الإيد تبقى asta. الراس يبقى mustaka.
    ar: العمر yuswa، والبيت dalem، واليد asta، والرأس mustaka.
    en: Age becomes yuswa. House becomes dalem. Hand becomes asta. Head becomes mustaka.
    note:
      ar_eg: 'كلمة «dalem» ليها معاني تانية كمان: «حاضر / نعم» لمّا حدّ كبير يناديك.'
      ar: 'لكلمة «dalem» معانٍ أخرى أيضًا: «نعم» حين يناديك كبير.'
      en: '"Dalem" has other uses too: "yes?" when an elder calls you.'
  - speaker: Mbak Sekar
    text: Klambi dadi ageman. Anak dadi putra. Bojo dadi garwa. Omongan dadi rembag.
    ar_eg: الهدوم تبقى ageman. الابن يبقى putra. الزوج يبقى garwa. الكلام يبقى rembag.
    ar: الثوب ageman، والابن putra، والزوج garwa، والحديث rembag.
    en: Clothes become ageman. Child becomes putra. Spouse becomes garwa. Talk becomes rembag.
  - speaker: Mas Danang
    text: 'Aja lali: kabeh iki kanggo wong liya. Omah kula tetep griya, dudu dalem!'
    ar_eg: 'ماتنساش: دي كلّها لغيرك. بيتي أنا يفضل griya، مش dalem!'
    ar: 'لا تنسَ: كلّها للآخرين. بيتي يبقى griya لا dalem!'
    en: 'Don''t forget: all these are for others. My own house stays griya, not dalem!'
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Asmanipun sinten, Mbah?
    ar_eg: اسم حضرتك إيه يا جدّتي؟
    ar: ما اسم حضرتك يا جدّتي؟
    en: What's your name, Mbah?
  - speaker: Mas Danang
    text: Asmanipun sinten, Mbah?
    ar_eg: اسم حضرتك إيه يا جدّتي؟
    ar: ما اسم حضرتك يا جدّتي؟
    en: What's your name, Mbah?
  - speaker: Mbak Sekar
    text: Nami kula Mohamed.
    ar_eg: اسمي محمد.
    ar: اسمي محمد.
    en: My name is Mohamed.
  - speaker: Mas Danang
    text: Nami kula Mohamed.
    ar_eg: اسمي محمد.
    ar: اسمي محمد.
    en: My name is Mohamed.
  - speaker: Mbak Sekar
    text: Yuswanipun pinten?
    ar_eg: سنّ حضرتك كام؟
    ar: كم عمر حضرتك؟
    en: How old are you?
  - speaker: Mas Danang
    text: Yuswanipun pinten?
    ar_eg: سنّ حضرتك كام؟
    ar: كم عمر حضرتك؟
    en: How old are you?
  - speaker: Mbak Sekar
    text: Dalemipun wonten pundi?
    ar_eg: بيت حضرتك فين؟
    ar: أين بيت حضرتك؟
    en: Where is your home?
  - speaker: Mas Danang
    text: Dalemipun wonten pundi?
    ar_eg: بيت حضرتك فين؟
    ar: أين بيت حضرتك؟
    en: Where is your home?
  - speaker: Mbak Sekar
    text: Mugi tansah sehat.
    ar_eg: ربنا يديمك بصحّة.
    ar: أدام الله صحّتك.
    en: May you always be healthy.
  - speaker: Mas Danang
    text: Mugi tansah sehat.
    ar_eg: ربنا يديمك بصحّة.
    ar: أدام الله صحّتك.
    en: May you always be healthy.
- kind: outro
  title: Sowan simbah
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki sampeyan sowan simbah. Takona asma, yuswa, lan dalemipun.
    ar_eg: يا ماس محمد، دلوقتي انت بتزور الجدّة. اسألها عن اسمها وسنّها وبيتها.
    ar: يا ماس محمد، أنت الآن تزور الجدّة. اسألها عن اسمها وعمرها وبيتها.
    en: Mas Mohamed, now you're visiting grandma. Ask her name, age and home.
    note:
      ar_eg: دورك! تلات أسئلة بالكراما إنجيل، وبعدين عرّف نفسك بـnami وgriya.
      ar: دورك! ثلاثة أسئلة بالكراما إنغيل، ثمّ عرّف بنفسك بـnami وgriya.
      en: Your turn! Three questions in krama inggil, then introduce yourself with nami and griya.
  - speaker: Mas Danang
    text: 'Contone: Nami kula Mohamed. Griya kula wonten Kairo. Asmanipun Mbah sinten?'
    ar_eg: 'مثلًا: اسمي محمد. بيتي في القاهرة. اسم حضرتك إيه يا جدّتي؟'
    ar: 'مثلًا: اسمي محمد. بيتي في القاهرة. ما اسمك يا جدّتي؟'
    en: 'For example: My name is Mohamed. My home is in Cairo. What''s your name, Mbah?'
  - speaker: Mbak Sekar
    text: PR-mu, deloken foto kulawarga ing pelajaran, lan critakna nganggo putra, garwa, lan yuswa.
    ar_eg: واجبك، شوف صورة العيلة في الدرس، واحكي عنها بـputra وgarwa وyuswa.
    ar: 'واجبك: انظر صورة العائلة في الدرس وصِفها بـputra وgarwa وyuswa.'
    en: 'Your homework: look at the family photo in the lesson and describe it with putra, garwa and yuswa.'
  - speaker: Mas Danang
    text: Sesuk kita dhateng Kraton. Basa ingkang paling alus! Nganti pinanggih malih!
    ar_eg: بكرة رايحين القصر. أرقى كلام! إلى اللقاء!
    ar: غدًا نذهب إلى القصر، حيث أرقى الكلام! إلى اللقاء!
    en: Tomorrow we go to the Kraton. The most refined speech! Until next time!
