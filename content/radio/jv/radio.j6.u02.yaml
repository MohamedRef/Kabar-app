language: jv
level: j6
unit: j6.u02
title:
  target: Sandhangan swara
  ar_eg: علامات الحركات
  ar: علامات الحركات
  en: Vowel marks
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Masjid Gedhe Mataram
  lines:
  - speaker: Mbak Sekar
    text: Assalamualaikum saking Masjid Gedhe Mataram ing Kotagedhe. Kula Sekar. Masjid menika masjid ingkang paling sepuh ing Mataram.
    ar_eg: السلام عليكم من مسجد جيدي ماتارام في كوتاجيدي. أنا سيكار. المسجد ده أقدم مسجد في ماتارام.
    ar: السلام عليكم من مسجد غيدي ماتارام في كوتاغيدي. أنا سيكار. هذا أقدم مسجد في ماتارام.
    en: Assalamualaikum from the Great Mosque of Mataram in Kotagede. I'm Sekar. This mosque is the oldest in Mataram.
  - speaker: Mas Danang
    text: Waalaikumsalam! Aku Danang. Gapurane kok kaya candhi, Mbak?
    ar_eg: وعليكم السلام! أنا دانانج. البوّابة شكلها زي المعبد ليه يا مباك؟
    ar: وعليكم السلام! أنا دانانغ. لماذا تبدو البوّابة كالمعبد يا مباك؟
    en: Waalaikumsalam! I'm Danang. Why does the gate look like a temple, Mbak?
  - speaker: Mbak Sekar
    text: Amarga gapurane nganggo gaya Hindu-Jawa. Masjid iki dibangun taun sewu limang atus wolung puluh pitu.
    ar_eg: عشان البوّابة على الطراز الهندوسي الجاوي. المسجد ده اتبنى سنة ألف وخمسمية سبعة وتمانين.
    ar: لأنّ البوّابة على الطراز الهندوسيّ الجاويّ. بُني المسجد سنة 1587.
    en: Because the gate is in Hindu-Javanese style. The mosque was built in 1587.
    note:
      ar_eg: بُني بين 1587 و1589. الإسلام في جاوة دخل بهدوء وعاش جنب الفنّ القديم.
      ar: بُني بين 1587 و1589، ودخل الإسلام جاوة بهدوء وتعايش مع الفنّ القديم.
      en: Built 1587–1589. Islam came to Java gently and lived alongside the older art.
  - speaker: Mas Danang
    text: Dina iki kita sinau sandhangan swara. Aksara wis bisa, saiki vokale!
    ar_eg: النهارده هنتعلّم علامات الحركات. الحروف خلاص، دلوقتي الحركات!
    ar: اليوم نتعلّم علامات الحركات. الحروف انتهينا منها، والآن الحركات!
    en: Today we learn vowel marks. Letters done, now the vowels!
- kind: dialogue
  title: Jadwal ngaji
  lines:
  - speaker: Mbak Sekar
    text: Danang, delengen papan ing lawang masjid. Iku jadwal ngaji.
    ar_eg: يا دانانج، بصّ على اليافطة اللي على باب المسجد. دي مواعيد تحفيظ القرآن.
    ar: يا دانانغ، انظر إلى اللوحة على باب المسجد. إنّها مواعيد حلقة القرآن.
    en: Danang, look at the board on the mosque door. That's the Quran class schedule.
    note:
      ar_eg: ngaji = قراءة القرآن ودراسته، زي الكُتّاب عندنا.
      ar: ngaji = قراءة القرآن ودراسته، كالكُتّاب.
      en: Ngaji is reciting and studying the Quran, like a Quran school.
  - speaker: Mas Danang
    text: Aku weruh ka, ana bunder cilik ing dhuwure. Iku apa?
    ar_eg: أنا شايف ka، وفوقها دايرة صغيّرة. دي إيه؟
    ar: أرى ka وفوقها دائرة صغيرة. ما هذه؟
    en: I see ka, with a little circle on top. What's that?
  - speaker: Mbak Sekar
    text: Iku wulu. Wulu ndadekake i. Dadi ka dadi ki.
    ar_eg: دي wulu. الـ wulu بتخلّيها i. يبقى ka تبقى ki.
    ar: هذه wulu، تجعل الحرف بـ i، فتصير ka إلى ki.
    en: That's wulu. Wulu makes i. So ka becomes ki.
    note:
      ar_eg: wulu ꦶ = كسرة. ꦏꦶ = ki.
      ar: wulu ꦶ = كسرة. ꦏꦶ = ki.
      en: Wulu ꦶ is the i mark. ꦏꦶ = ki.
  - speaker: Mas Danang
    text: Lan sing ing ngisor, kaya buntut?
    ar_eg: واللي تحت، اللي زي الديل؟
    ar: والتي تحته كالذيل؟
    en: And the one underneath, like a tail?
  - speaker: Mbak Sekar
    text: Iku suku. Suku ndadekake u. Ka dadi ku.
    ar_eg: دي suku. الـ suku بتخلّيها u. ka تبقى ku.
    ar: هذه suku، تجعل الحرف بـ u، فتصير ka إلى ku.
    en: That's suku. Suku makes u. Ka becomes ku.
  - speaker: Mas Danang
    text: Wulu ing dhuwur, suku ing ngisor. Kaya sirah lan sikil!
    ar_eg: الـ wulu فوق، والـ suku تحت. زي الراس والرجل!
    ar: wulu فوق وsuku تحت، كالرأس والقدم!
    en: Wulu on top, suku below. Like head and feet!
  - speaker: Mbak Sekar
    text: Bener. Taling ing ngarep, dadi e. Pepet ing dhuwur, dadi e cilik, kaya ing tembung "lemu".
    ar_eg: صحّ. الـ taling قدّام، تبقى e. والـ pepet فوق، تبقى e خفيفة، زي في كلمة lemu.
    ar: صحيح. taling أمام الحرف وتعطي e، وpepet فوقه وتعطي e خفيفة، كما في lemu.
    en: Right. Taling goes in front, making e. Pepet goes on top, making a short e, like in "lemu".
    note:
      ar_eg: lemu = تخين / سمين. الـ e اللي في le خفيفة زي الـ e في كلمة «the».
      ar: lemu = سمين. الـ e في le قصيرة مخفّفة.
      en: Lemu means fat. The e in le is the short, schwa e.
  - speaker: Mas Danang
    text: Lan taling tarung?
    ar_eg: والـ taling tarung؟
    ar: وtaling tarung؟
    en: And taling tarung?
  - speaker: Mbak Sekar
    text: Taling ing ngarep, tarung ing mburi. Dadi o. Kaya ing tembung "soto".
    ar_eg: taling قدّام، وtarung ورا. تبقى o. زي في كلمة soto.
    ar: taling أمام الحرف وtarung خلفه، فتصير o، كما في soto.
    en: Taling in front, tarung behind. That makes o. Like in "soto".
    note:
      ar_eg: taling tarung = علامتين بيحضنوا الحرف من الناحيتين. ꦱꦺꦴꦠꦺꦴ = soto.
      ar: taling tarung علامتان تحيطان بالحرف. ꦱꦺꦴꦠꦺꦴ = soto.
      en: Taling tarung hugs the letter from both sides. ꦱꦺꦴꦠꦺꦴ = soto.
- kind: word_spotlight
  title: Sandhangan swara
  lines:
  - speaker: Mbak Sekar
    text: Sandhangan iku tegese "sandhangan", klambi kanggo aksara. Wulu kanggo i, suku kanggo u.
    ar_eg: sandhangan معناها «لبس»، هدوم للحروف. wulu للـ i، وsuku للـ u.
    ar: sandhangan تعني «لباس»، ثياب للحروف. wulu لـ i وsuku لـ u.
    en: Sandhangan means "clothes", clothes for the letters. Wulu for i, suku for u.
  - speaker: Mas Danang
    text: Taling kanggo e, pepet kanggo e cilik, taling tarung kanggo o. Lima wae, cah!
    ar_eg: taling للـ e، وpepet للـ e الخفيفة، وtaling tarung للـ o. خمسة بس يا جماعة!
    ar: taling لـ e وpepet لـ e الخفيفة وtaling tarung لـ o. خمس فقط!
    en: Taling for e, pepet for short e, taling tarung for o. Just five, folks!
    note:
      ar_eg: 'زي التشكيل العربي بالظبط: الحرف نفسه ثابت، والعلامة بتغيّر الصوت. انت عارف الفكرة دي من زمان!'
      ar: 'مثل التشكيل العربيّ تمامًا: الحرف ثابت والعلامة تغيّر الصوت. فكرة تعرفها مسبقًا!'
      en: 'Just like Arabic harakat: the letter stays, the mark changes the sound. You already know this idea!'
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: 'Wulu: ki.'
    ar_eg: الـ wulu تدّي ki.
    ar: الـ wulu تعطي ki.
    en: 'Wulu: ki.'
  - speaker: Mas Danang
    text: 'Wulu: ki.'
    ar_eg: الـ wulu تدّي ki.
    ar: الـ wulu تعطي ki.
    en: 'Wulu: ki.'
  - speaker: Mbak Sekar
    text: 'Suku: ku.'
    ar_eg: الـ suku تدّي ku.
    ar: الـ suku تعطي ku.
    en: 'Suku: ku.'
  - speaker: Mas Danang
    text: 'Suku: ku.'
    ar_eg: الـ suku تدّي ku.
    ar: الـ suku تعطي ku.
    en: 'Suku: ku.'
  - speaker: Mbak Sekar
    text: 'Taling: ke.'
    ar_eg: الـ taling تدّي ke.
    ar: الـ taling تعطي ke.
    en: 'Taling: ke.'
  - speaker: Mas Danang
    text: 'Taling: ke.'
    ar_eg: الـ taling تدّي ke.
    ar: الـ taling تعطي ke.
    en: 'Taling: ke.'
  - speaker: Mbak Sekar
    text: 'Taling tarung: ko.'
    ar_eg: الـ taling tarung تدّي ko.
    ar: الـ taling tarung تعطي ko.
    en: 'Taling tarung: ko.'
  - speaker: Mas Danang
    text: 'Taling tarung: ko.'
    ar_eg: الـ taling tarung تدّي ko.
    ar: الـ taling tarung تعطي ko.
    en: 'Taling tarung: ko.'
  - speaker: Mbak Sekar
    text: 'Saiki ayo maca tembung loro saka jadwal ngaji: "teka" lan "lemu".'
    ar_eg: 'دلوقتي يلّا نقرا كلمتين من مواعيد التحفيظ: teka وlemu.'
    ar: 'لنقرأ الآن كلمتين من جدول الحلقة: teka وlemu.'
    en: 'Now let''s read two words from the ngaji schedule: "teka" and "lemu".'
  - speaker: Mas Danang
    text: 'Teka: ta nganggo pepet, ka biasa. Tegese teka, kaya "datang".'
    ar_eg: 'teka: ta بالـ pepet، وka عادية. معناها جه، زي datang.'
    ar: 'teka: ta بـ pepet وka عادية، وتعني «جاء» مثل datang.'
    en: 'Teka: ta with pepet, plain ka. It means come, like "datang".'
  - speaker: Mbak Sekar
    text: 'Lemu: la nganggo pepet, ma nganggo suku. Tegese lemu, kaya "gemuk".'
    ar_eg: 'lemu: la بالـ pepet، وma بالـ suku. معناها تخين، زي gemuk.'
    ar: 'lemu: la بـ pepet وma بـ suku، وتعني «سمين» مثل gemuk.'
    en: 'Lemu: la with pepet, ma with suku. It means fat, like "gemuk".'
  - speaker: Mas Danang
    text: Kucing ing masjid iki lemu banget, cah! Mesthi akeh sing menehi panganan.
    ar_eg: القطّة اللي في المسجد ده تخينة أوي يا جماعة! أكيد ناس كتير بيأكّلوها.
    ar: قطّ هذا المسجد سمين جدًّا! لا بدّ أنّ كثيرين يطعمونه.
    en: The cat at this mosque is so fat, folks! Lots of people must feed it.
- kind: outro
  title: Siji nganti sanga
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, saiki jenengmu luwih gampang. Mo nganggo taling tarung!
    ar_eg: يا ماس محمد، دلوقتي اسمك بقى أسهل. mo بالـ taling tarung!
    ar: 'يا ماس محمد، صار اسمك أسهل الآن: mo بـ taling tarung!'
    en: Mas Mohamed, your name is easier now. Mo with taling tarung!
    note:
      ar_eg: ꦩꦺꦴ = mo. فاضل الـ d الساكنة في الآخر، الأسبوع الجاي.
      ar: ꦩꦺꦴ = mo، وبقيت الدال الساكنة في الآخر، الأسبوع القادم.
      en: ꦩꦺꦴ = mo. The final d is next week.
  - speaker: Mbak Sekar
    text: PR-ne, wacanen tembung siji nganti sanga ing pelajaran. Siji, loro, telu, nganggo sandhangan.
    ar_eg: الواجب، اقرا الكلمات من واحد لتسعة في الدرس. siji loro telu، بالعلامات.
    ar: 'الواجب: اقرأ الأعداد من واحد إلى تسعة في الدرس، بالعلامات.'
    en: 'Homework: read the words one to nine in the lesson. Siji, loro, telu, with the marks.'
  - speaker: Mbak Sekar
    text: Sesuk kita dhateng makam raja Mataram. Nganggo busana Jawa, nggih! Nganti pinanggih malih!
    ar_eg: بكرة رايحين مقابر ملوك ماتارام. البسوا لبس جاوي، ماشي! إلى اللقاء!
    ar: غدًا نزور مقابر ملوك ماتارام، فالبسوا الزيّ الجاويّ! إلى اللقاء!
    en: Tomorrow we visit the royal graves of Mataram. Wear Javanese dress, okay! Until next time!
