id: radio.j6.u01
language: jv
level: j6
unit: j6.u01
title:
  target: Ha na ca ra ka
  ar_eg: ها نا تشا را كا
  ar: ها نا تشا را كا
  en: Ha na ca ra ka
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pasar Kotagedhe
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saking Pasar Kotagedhe, Yogyakarta! Kula Sekar. Ing kene akeh tukang perak lan papan jeneng nganggo aksara Jawa.
    ar_eg: صباح الخير من سوق كوتاجيدي في يوجياكارتا! أنا سيكار. هنا فيه صنايعية فضّة كتير ويافطات مكتوبة بالحروف الجاوي.
    ar: صباح الخير من سوق كوتاغيدي في يوغياكارتا! أنا سيكار. هنا كثير من صاغة الفضّة ولافتات مكتوبة بالحرف الجاوي.
    en: Good morning from Kotagede Market, Yogyakarta! I'm Sekar. Here there are lots of silversmiths and signs in Javanese script.
  - speaker: Mas Galih
    text: Aku Galih, rek! Aku arek Suroboyo, nanging aku isih isin. Aku durung iso maca aksara Jawa.
    ar_eg: أنا جاليه يا جماعة! أنا ابن سورابايا، بس لسّه مكسوف. لسّه مش عارف أقرا الحروف الجاوي.
    ar: أنا غاليه يا جماعة! أنا من سورابايا لكنّي ما زلت خجلان، فلا أعرف قراءة الحرف الجاوي بعد.
    en: I'm Galih, folks! I'm a Surabaya boy, but I'm still embarrassed. I can't read Javanese script yet.
    note:
      ar_eg: rek = يا جماعة، كلمة أهل سورابايا. iso = bisa بلهجة سورابايا.
      ar: rek = يا جماعة، كلمة أهل سورابايا. iso = bisa بلهجة سورابايا.
      en: Rek is Surabaya's "folks". Iso is Surabaya for bisa, can.
  - speaker: Mbak Sekar
    text: Ora apa-apa. Dina iki kita sinau aksara rong puluh. Diwiwiti saka ha, na, ca, ra, ka.
    ar_eg: ولا يهمّك. النهارده هنتعلّم العشرين حرف. نبدأ بـ ha na ca ra ka.
    ar: لا بأس. اليوم نتعلّم الحروف العشرين، بدءًا بـ ha na ca ra ka.
    en: No problem. Today we learn the twenty letters. Starting with ha, na, ca, ra, ka.
    note:
      ar_eg: ꦲ ꦤ ꦕ ꦫ ꦏ = ha na ca ra ka. كلّ حرف مقطع كامل بحرف a جوّاه.
      ar: ꦲ ꦤ ꦕ ꦫ ꦏ = ha na ca ra ka. كلّ حرف مقطع كامل فيه a.
      en: ꦲ ꦤ ꦕ ꦫ ꦏ = ha na ca ra ka. Each letter is a whole syllable with a built-in a.
- kind: dialogue
  title: Critane Aji Saka
  lines:
  - speaker: Mas Galih
    text: Mbak Sekar, kenapa urutane ha, na, ca, ra, ka? Kok ora a, b, c?
    ar_eg: يا مباك سيكار، ليه الترتيب ha na ca ra ka؟ مش a b c ليه؟
    ar: يا مباك سيكار، لماذا الترتيب ha na ca ra ka وليس a b c؟
    en: Mbak Sekar, why is the order ha, na, ca, ra, ka? Why not a, b, c?
  - speaker: Mbak Sekar
    text: Amarga urutan iki iku critane Aji Saka. Aji Saka duwe abdi loro, Dora lan Sembada.
    ar_eg: عشان الترتيب ده هو حكاية أجي ساكا. أجي ساكا كان عنده خدّامين اتنين، دورا وسيمبادا.
    ar: 'لأنّ هذا الترتيب هو قصّة أجي ساكا، وكان له خادمان: دورا وسيمبادا.'
    en: Because this order is the story of Aji Saka. Aji Saka had two servants, Dora and Sembada.
  - speaker: Mbak Sekar
    text: 'Ha na ca ra ka: ana utusan. Wong loro padha dikongkon.'
    ar_eg: 'ha na ca ra ka: كان فيه رسولين. اتنين اتبعتوا.'
    ar: 'ha na ca ra ka: كان هناك رسولان أُرسلا.'
    en: 'Ha na ca ra ka: there were messengers. Two men were sent.'
  - speaker: Mas Galih
    text: Terus da ta sa wa la?
    ar_eg: وبعدين da ta sa wa la؟
    ar: ثمّ da ta sa wa la؟
    en: And then da ta sa wa la?
  - speaker: Mbak Sekar
    text: 'Da ta sa wa la: padha kerengan. Wong loro iku gelut.'
    ar_eg: 'da ta sa wa la: اتخانقوا. الاتنين اتعاركوا.'
    ar: 'da ta sa wa la: تقاتلا.'
    en: 'Da ta sa wa la: they fought. The two men fought.'
  - speaker: Mbak Sekar
    text: 'Pa dha ja ya nya: padha sektine. Ma ga ba tha nga: kabeh mati.'
    ar_eg: 'pa dha ja ya nya: كانوا قدّ بعض في القوّة. ma ga ba tha nga: الاتنين ماتوا.'
    ar: 'pa dha ja ya nya: تساويا في القوّة. ma ga ba tha nga: مات كلاهما.'
    en: 'Pa dha ja ya nya: equally strong. Ma ga ba tha nga: both died.'
  - speaker: Mas Galih
    text: Waduh, sedhih! Abdi loro sing setya, tapi mati bareng.
    ar_eg: يا خبر، حزينة! خدّامين مخلصين، بس ماتوا مع بعض.
    ar: يا للحزن! خادمان وفيّان ماتا معًا.
    en: Oh no, sad! Two loyal servants, but they died together.
    note:
      ar_eg: 'الحروف العشرين كلّها قصيدة صغيّرة: أربع سطور، خمس حروف في كلّ سطر. أسهل طريقة تحفظها!'
      ar: الحروف العشرون قصيدة قصيرة من أربعة أسطر، في كلّ سطر خمسة حروف. أسهل طريقة للحفظ!
      en: 'The twenty letters form a little poem: four lines of five letters. The easiest way to memorise them!'
  - speaker: Mas Galih
    text: Saiki aku ngerti. Papan iku tulisane... ka, ca, ma, ta. Kacamata!
    ar_eg: دلوقتي فهمت. اليافطة دي مكتوب عليها... ka ca ma ta. كاتشاماتا!
    ar: الآن فهمت. هذه اللافتة مكتوب عليها... ka ca ma ta. نظّارة!
    en: Now I get it. That sign says... ka, ca, ma, ta. Kacamata!
    note:
      ar_eg: ꦏꦕꦩꦠ = kacamata، يعني نضّارة. أوّل كلمة كاملة تقراها!
      ar: ꦏꦕꦩꦠ = kacamata أي نظّارة. أوّل كلمة كاملة تقرؤها!
      en: ꦏꦕꦩꦠ = kacamata, glasses. Your first whole word!
  - speaker: Mbak Sekar
    text: Bener! Toko kacamata. Kowe wis iso maca, Galih.
    ar_eg: صحّ! محلّ نضّارات. انت بقيت بتعرف تقرا يا جاليه.
    ar: صحيح! محلّ نظّارات. صرت تقرأ يا غاليه.
    en: Right! A glasses shop. You can read now, Galih.
- kind: word_spotlight
  title: Aksara nglegena
  lines:
  - speaker: Mbak Sekar
    text: Aksara nglegena iku aksara rong puluh tanpa sandhangan. Saben aksara diwaca nganggo a.
    ar_eg: الأكشارا نجليجينا هي العشرين حرف من غير علامات. كلّ حرف بيتقري بـ a.
    ar: الأكشارا نغليغينا هي الحروف العشرون بلا علامات، وكلّ حرف يُقرأ بـ a.
    en: Aksara nglegena are the twenty letters without marks. Each letter is read with a.
  - speaker: Mas Galih
    text: 'Nanging ati-ati: ing tulisan a, nanging asring diwaca o. Kaya "ana" diwaca "ono"!'
    ar_eg: 'بس خلّي بالك: مكتوبة a، بس كتير بتتقري o. زي ana بتتقري «ono»!'
    ar: 'لكن انتبه: تُكتب a وكثيرًا ما تُقرأ o، مثل ana تُقرأ «ono»!'
    en: 'But careful: it''s written a, but often read o. Like "ana" is read "ono"!'
    note:
      ar_eg: ده نفس الدرس «Ditulis a, diwaca o». الـ a في آخر الكلمة غالبًا بتتنطق o.
      ar: 'هذا درس «Ditulis a, diwaca o»: الـ a في آخر الكلمة تُنطق غالبًا o.'
      en: 'This is the "Ditulis a, diwaca o" lesson: a final a is usually said o.'
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Ha na ca ra ka.
    ar_eg: ها نا تشا را كا.
    ar: ها نا تشا را كا.
    en: Ha na ca ra ka.
  - speaker: Mas Galih
    text: Ha na ca ra ka.
    ar_eg: ها نا تشا را كا.
    ar: ها نا تشا را كا.
    en: Ha na ca ra ka.
  - speaker: Mbak Sekar
    text: Da ta sa wa la.
    ar_eg: دا تا سا وا لا.
    ar: دا تا سا وا لا.
    en: Da ta sa wa la.
  - speaker: Mas Galih
    text: Da ta sa wa la.
    ar_eg: دا تا سا وا لا.
    ar: دا تا سا وا لا.
    en: Da ta sa wa la.
  - speaker: Mbak Sekar
    text: Pa dha ja ya nya.
    ar_eg: با ضا جا يا نيا.
    ar: با ضا جا يا نيا.
    en: Pa dha ja ya nya.
  - speaker: Mas Galih
    text: Pa dha ja ya nya.
    ar_eg: با ضا جا يا نيا.
    ar: با ضا جا يا نيا.
    en: Pa dha ja ya nya.
  - speaker: Mbak Sekar
    text: Ma ga ba tha nga.
    ar_eg: ما جا با طا نجا.
    ar: ما غا با طا نغا.
    en: Ma ga ba tha nga.
  - speaker: Mas Galih
    text: Ma ga ba tha nga.
    ar_eg: ما جا با طا نجا.
    ar: ما غا با طا نغا.
    en: Ma ga ba tha nga.
  - speaker: Mbak Sekar
    text: 'Siji maneh: papan iku tulisane "kacamata", nanging papan sandhinge tulisane "ana".'
    ar_eg: 'كمان واحدة: اليافطة دي مكتوب عليها kacamata، واللي جنبها مكتوب ana.'
    ar: 'وواحدة أخرى: تلك اللافتة مكتوب عليها kacamata، والتي بجانبها ana.'
    en: 'One more: that sign says "kacamata", and the one next to it says "ana".'
  - speaker: Mas Galih
    text: Ana, diwaca "ono". Tegese ana, kaya "ada". Aku saiki iso maca papan ing pasar iki!
    ar_eg: ana، بتتقري «ono». معناها فيه، زي ada. دلوقتي أقدر أقرا يافطات السوق ده!
    ar: ana تُقرأ «ono» وتعني «يوجد» مثل ada. الآن أستطيع قراءة لافتات هذا السوق!
    en: Ana, read "ono". It means there is, like "ada". Now I can read the signs in this market!
- kind: outro
  title: Jenengmu
  lines:
  - speaker: Mas Galih
    text: Mas Mohamed, coba tulisen jenengmu nganggo aksara Jawa. Mo, ha, ma, da. Gampang, rek!
    ar_eg: يا ماس محمد، جرّب تكتب اسمك بالحروف الجاوي. mo ha ma da. سهلة يا جماعة!
    ar: 'يا ماس محمد، جرّب كتابة اسمك بالحرف الجاوي: mo ha ma da. سهل!'
    en: Mas Mohamed, try writing your name in Javanese script. Mo, ha, ma, da. Easy, folks!
    note:
      ar_eg: لسّه ناقصك علامة o وعلامة آخر الحرف، هتتعلّمهم في الوحدتين الجايين. دلوقتي جرّب ꦩꦲꦩꦢ.
      ar: ينقصك بعدُ علامة o وعلامة إسكان الحرف الأخير، وستتعلّمهما في الوحدتين التاليتين. جرّب الآن ꦩꦲꦩꦢ.
      en: You still need the o mark and the final-consonant mark, coming in the next two units. For now try ꦩꦲꦩꦢ.
  - speaker: Mbak Sekar
    text: Sesuk kita dhateng Masjid Gedhe Mataram, sinau sandhangan swara. Nganti pinanggih malih!
    ar_eg: بكرة رايحين مسجد جيدي ماتارام، نتعلّم علامات الحركات. إلى اللقاء!
    ar: غدًا نذهب إلى مسجد غيدي ماتارام لنتعلّم علامات الحركات. إلى اللقاء!
    en: Tomorrow we go to the Great Mosque of Mataram to learn vowel marks. Until next time!
