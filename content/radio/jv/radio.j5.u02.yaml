segments:
- kind: intro
  title: INKA
  lines:
  - speaker: Mas Danang
    text: Sugeng enjing saka cedhak INKA, pabrik sepur ing Madiun! Gerbong-gerbong anyar dibangun neng kene. Aku Danang.
    ar_eg: صباح الخير من جنب إينكا، مصنع القطورات في ماديون! عربيات قطر جديدة بتتبني هنا. أنا دانانج.
    ar: صباح الخير من قرب إينكا، مصنع القطارات في ماديون! تُبنى هنا عربات قطار جديدة. أنا دانانغ.
    en: Good morning from near INKA, the train factory in Madiun! New railway carriages are built here. I'm Danang.
    note:
      ar_eg: INKA (Industri Kereta Api) الشركة اللي بتعمل عربيات القطر في إندونيسيا، ومقرّها في ماديون.
      ar: إينكا (Industri Kereta Api) الشركة التي تصنع عربات القطار في إندونيسيا، ومقرّها ماديون.
      en: INKA (Industri Kereta Api) is Indonesia's railway-carriage maker, based in Madiun.
  - speaker: Mbak Sekar
    text: Kula Sekar. Dina menika kita maca warta, kabar ing koran lan radio.
    ar_eg: أنا سيكار. النهارده هنقرا الأخبار، في الجرايد والراديو.
    ar: أنا سيكار. اليوم نقرأ الأخبار في الصحف والإذاعة.
    en: I'm Sekar. Today we read the news, in papers and on the radio.
  - speaker: Mas Danang
    text: Ing Jawa ana majalah basa Jawa wiwit biyen, kaya Panjebar Semangat, Jaya Baya, lan Djaka Lodang.
    ar_eg: في جاوة فيه مجلّات بالجاوي من زمان، زي «Panjebar Semangat» و«Jaya Baya» و«Djaka Lodang».
    ar: في جاوة مجلّات بالجاوية منذ زمن، مثل «Panjebar Semangat» و«Jaya Baya» و«Djaka Lodang».
    en: Java has had Javanese magazines for decades, like Panjebar Semangat, Jaya Baya and Djaka Lodang.
    note:
      ar_eg: "كلمات: kaya = زي، كأنّ؛ biyen = زمان / قديمًا."
      ar: "مفردات: kaya = مثل؛ biyen = قديمًا / في الماضي."
      en: "Words: kaya = like, as = seperti; biyen = long ago, in the past = dulu."
  - speaker: Mbak Sekar
    text: Lan ing warta, akeh ukara "di-... dening...". Kaya "ditulis oleh" ing basa Indonesia.
    ar_eg: وفي الأخبار، فيه جمل كتير «di-... dening...». زي «ditulis oleh» بالإندونيسي.
    ar: وفي الأخبار جمل كثيرة «di-... dening...»، مثل «ditulis oleh» في الإندونيسية.
    en: And news has lots of "di-... dening..." sentences. Like Indonesian "ditulis oleh".
    note:
      ar_eg: "كلمات: ditulis = مكتوب، اتكتب."
      ar: "مفردات: ditulis = كُتِب."
      en: "Words: ditulis = to be written."
- kind: dialogue
  title: Warta radio
  lines:
  - speaker: Mbak Sekar
    text: Danang, ayo dadi penyiar warta. Aku maca warta, kowe takon.
    ar_eg: يا دانانج، يلّا نبقى مذيعين أخبار. أنا أقرا الخبر، وانت تسأل.
    ar: يا دانانغ، لنكن مذيعَي أخبار. أنا أقرأ الخبر وأنت تسأل.
    en: Danang, let's be newsreaders. I read the news, you ask.
  - speaker: Mbak Sekar
    text: Warta saka Madiun. Pameran foto sepur lawas dibukak dening Walikota ing Stasiun Madiun.
    ar_eg: أخبار من ماديون. معرض صور قطورات قديمة افتتحه العمدة في محطة ماديون.
    ar: أخبار من ماديون. افتتح العمدة معرض صور قطارات قديمة في محطّة ماديون.
    en: News from Madiun. An exhibition of old train photos was opened by the Mayor at Madiun station.
  - speaker: Mas Danang
    text: Dibukak dening sapa?
    ar_eg: اتفتح على إيد مين؟
    ar: افتتحه من؟
    en: Opened by whom?
  - speaker: Mbak Sekar
    text: Dening Walikota Madiun. Pameran iki dianakake nganti pungkasan sasi.
    ar_eg: على إيد عمدة ماديون. والمعرض ده مستمرّ لآخر الشهر.
    ar: على يد عمدة ماديون. ويستمرّ المعرض حتى آخر الشهر.
    en: By the Mayor of Madiun. The exhibition runs until the end of the month.
  - speaker: Mas Danang
    text: Foto apa wae sing dipamerake?
    ar_eg: صور إيه اللي معروضة؟
    ar: ما الصور المعروضة؟
    en: What photos are shown?
  - speaker: Mbak Sekar
    text: Foto-foto sepur jaman Walanda, lan gerbong-gerbong sing dibangun dening INKA.
    ar_eg: صور قطورات من أيّام الهولنديين، وعربيات قطر اتبنت في إينكا.
    ar: صور قطارات من العهد الهولنديّ، وعربات بنتها إينكا.
    en: Photos of Dutch-era trains, and carriages built by INKA.
  - speaker: Mas Danang
    text: Menarik! Warta liyane?
    ar_eg: مثير! فيه أخبار تانية؟
    ar: مثير! أخبار أخرى؟
    en: Interesting! Other news?
  - speaker: Mbak Sekar
    text: Ketua RT anyar kapilih ing kampung cedhak alun-alun. Panjenenganipun kapilih dening warga.
    ar_eg: رئيس حارة جديد اتنتخب في حتّة جنب الميدان. انتخبه السكّان.
    ar: انتُخب رئيس حيّ جديد في حارة قرب الساحة. انتخبه السكّان.
    en: A new neighbourhood head was elected in a kampung near the town square. He was chosen by the residents.
    note:
      ar_eg: "kapilih = اتنتخب (زي dipilih بس أرسم). ka- و-in- (زي tinulis = اتكتب) أشكال رسمية للمبني للمجهول. كلمات: ketua = رئيس (جمعية، فصل)."
      ar: "kapilih = انتُخب (مثل dipilih لكن أرسم). وka- و-in- (مثل tinulis = كُتب) صيغ رسمية للمبنيّ للمجهول. مفردات: ketua = رئيس."
      en: "Kapilih = was elected (like dipilih, more formal). Ka- and -in- (as in tinulis = written) are formal passive forms. Words: ketua = chairperson, head."
  - speaker: Mas Danang
    text: Lan pengumuman kerja bakti?
    ar_eg: وإعلان يوم التنضيف الجماعي؟
    ar: وإعلان يوم العمل الجماعيّ؟
    en: And the community clean-up notice?
  - speaker: Mbak Sekar
    text: 'Iki: "Dina Minggu esuk, warga diajak kerja bakti ngresiki pinggir kali Madiun."'
    ar_eg: 'ده: «يوم الحدّ الصبح، السكّان معزومين على يوم تنضيف لشطّ نهر ماديون.»'
    ar: 'هذا: «صباح الأحد، يُدعى السكّان إلى العمل الجماعيّ لتنظيف ضفّة نهر ماديون.»'
    en: 'Here: "Sunday morning, residents are invited to a clean-up of the Madiun riverbank."'
    note:
      ar_eg: "kerja bakti = يوم شغل جماعي تطوّعي للحيّ - عادة إندونيسية وجاوية قويّة. كلمات: diajak = اتعزم، اتاخد معاه."
      ar: "kerja bakti = يوم عمل جماعيّ تطوّعيّ للحيّ - عادة إندونيسية وجاوية راسخة. مفردات: diajak = دُعي، اصطُحب."
      en: "Kerja bakti = a voluntary community work day - a strong Indonesian and Javanese custom. Words: diajak = to be invited, taken along."
- kind: word_spotlight
  title: Di-... dening...
  lines:
  - speaker: Mas Danang
    text: Di- plus kriya, banjur dening plus sing nindakake. Ditulis dening wartawan.
    ar_eg: di- مع الفعل، وبعدين dening مع اللي عمل. اتكتب على إيد صحفي.
    ar: di- مع الفعل، ثمّ dening مع الفاعل. كتبه صحفيّ.
    en: Di- plus the verb, then dening plus the doer. Written by a journalist.
  - speaker: Mbak Sekar
    text: 'Ka-: kapilih, katon, kapacak. Lan -in-: tinulis, sinebut. Iki resmi banget, kanggo tulisan.'
    ar_eg: 'ka-: kapilih، katon، kapacak. و-in-: tinulis، sinebut. دي رسمية أوي، للكتابة.'
    ar: 'ka-: kapilih وkaton وkapacak. و-in-: tinulis وsinebut. رسمية جدًّا، للكتابة.'
    en: 'Ka-: kapilih, katon, kapacak. And -in-: tinulis, sinebut. Very formal, for writing.'
    note:
      ar_eg: kapacak = اتنشر (في الجرنال)، sinebut = بيتسمّى / اللي اسمه.
      ar: kapacak = نُشر (في الصحيفة)، وsinebut = يُدعى.
      en: Kapacak = published (in a paper), sinebut = called, named.
  - speaker: Mas Danang
    text: Madiun sinebut Kutha Pendekar. Gerbong iki dibangun ing Madiun, lan lawange akeh!
    ar_eg: ماديون بيسمّوها مدينة المقاتلين. عربية القطر دي اتبنت في ماديون، وأبوابها كتير!
    ar: تُسمّى ماديون مدينة المقاتلين. وهذه العربة بُنيت في ماديون، وأبوابها كثيرة!
    en: Madiun is called the City of Fighters. This carriage was built in Madiun, and it has lots of doors!
  - speaker: Mas Danang
    text: Warta, kabar, pengumuman, pameran, sejarah. Tembung-tembung koran.
    ar_eg: خبر، أخبار، إعلان، معرض، تاريخ. كلمات الجرايد.
    ar: خبر، أنباء، إعلان، معرض، تاريخ. كلمات الصحف.
    en: News, reports, notices, exhibitions, history. Newspaper words.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Pameran dibukak dening Walikota.
    ar_eg: المعرض افتتحه العمدة.
    ar: افتتح العمدة المعرض.
    en: The exhibition was opened by the Mayor.
  - speaker: Mas Danang
    text: Pameran dibukak dening Walikota.
    ar_eg: المعرض افتتحه العمدة.
    ar: افتتح العمدة المعرض.
    en: The exhibition was opened by the Mayor.
  - speaker: Mbak Sekar
    text: Gerbong iki dibangun dening INKA.
    ar_eg: عربية القطر دي بنتها إينكا.
    ar: بنت إينكا هذه العربة.
    en: This carriage was built by INKA.
  - speaker: Mas Danang
    text: Gerbong iki dibangun dening INKA.
    ar_eg: عربية القطر دي بنتها إينكا.
    ar: بنت إينكا هذه العربة.
    en: This carriage was built by INKA.
  - speaker: Mbak Sekar
    text: Ketua RT kapilih dening warga.
    ar_eg: رئيس الحارة انتخبه السكّان.
    ar: انتخب السكّان رئيس الحيّ.
    en: The neighbourhood head was elected by the residents.
  - speaker: Mas Danang
    text: Ketua RT kapilih dening warga.
    ar_eg: رئيس الحارة انتخبه السكّان.
    ar: انتخب السكّان رئيس الحيّ.
    en: The neighbourhood head was elected by the residents.
  - speaker: Mbak Sekar
    text: Warga diajak kerja bakti.
    ar_eg: السكّان معزومين على يوم التنضيف.
    ar: يُدعى السكّان إلى العمل الجماعيّ.
    en: Residents are invited to the clean-up.
  - speaker: Mas Danang
    text: Warga diajak kerja bakti.
    ar_eg: السكّان معزومين على يوم التنضيف.
    ar: يُدعى السكّان إلى العمل الجماعيّ.
    en: Residents are invited to the clean-up.
  - speaker: Mbak Sekar
    text: Iki warta saka Madiun.
    ar_eg: دي أخبار من ماديون.
    ar: هذه أخبار من ماديون.
    en: This is news from Madiun.
  - speaker: Mas Danang
    text: Iki warta saka Madiun.
    ar_eg: دي أخبار من ماديون.
    ar: هذه أخبار من ماديون.
    en: This is news from Madiun.
- kind: outro
  title: Warta saking Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki dadi wartawan. Tulisen warta cekak babagan kutha sampeyan, nganggo di-... dening...
    ar_eg: يا ماس محمد، دلوقتي بقيت صحفي. اكتب خبر قصيّر عن مدينتك بـdi-... dening...
    ar: يا ماس محمد، صرت صحفيًّا. اكتب خبرًا قصيرًا عن مدينتك بـdi-... dening...
    en: Mas Mohamed, now you're a journalist. Write a short news item about your city, with di-... dening...
    note:
      ar_eg: "دورك! جملتين على الأقل بالمبني للمجهول. كلمات: babagan = عن؛ cekak = قصير / مختصر."
      ar: "دورك! جملتان على الأقلّ بالمبنيّ للمجهول. مفردات: babagan = عن / حول؛ cekak = قصير / مختصر."
      en: "Your turn! At least two passive sentences. Words: babagan = about = tentang; cekak = short, brief = singkat, pendek."
  - speaker: Mas Danang
    text: 'Contone: Masjid anyar dibukak dening Gubernur Kairo. Masjid iki dibangun dening warga.'
    ar_eg: 'مثلًا: جامع جديد افتتحه محافظ القاهرة. الجامع ده بناه السكّان.'
    ar: 'مثلًا: افتتح محافظ القاهرة مسجدًا جديدًا بناه السكّان.'
    en: 'For example: A new mosque was opened by the Governor of Cairo. The mosque was built by residents.'
  - speaker: Mbak Sekar
    text: PR-mu, rungokna warta radio ing pelajaran, lan tulisen pira ukara sing nganggo dening.
    ar_eg: واجبك، اسمع الخبر الإذاعي في الدرس، واكتب كام جملة فيها dening.
    ar: 'واجبك: استمع إلى نشرة الإذاعة في الدرس واحسب الجمل التي فيها dening.'
    en: 'Your homework: listen to the radio news in the lesson and count the sentences with dening.'
  - speaker: Mas Danang
    text: Sesuk kita neng alun-alun Madiun, sinau ejaan. Nganti pinanggih malih!
    ar_eg: بكرة رايحين ميدان ماديون، نتعلّم الإملاء. إلى اللقاء!
    ar: غدًا نذهب إلى ساحة ماديون لنتعلّم الإملاء. إلى اللقاء!
    en: Tomorrow we're at Madiun's town square, learning spelling. See you!
