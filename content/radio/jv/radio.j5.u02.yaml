segments:
- kind: intro
  title: Lawang Sewu
  lines:
  - speaker: Mas Galih
    text: Sugeng enjing saking Lawang Sewu! Jenenge tegese "lawang sewu". Nanging aku durung tau ngetung, hehe. Aku Galih.
    ar_eg: صباح الخير من لاوانج سيوو! اسمه معناه «ألف باب». بس أنا عمري ما عدّيت، هههه. أنا جاليه.
    ar: صباح الخير من لاوانغ سيوو! اسمه يعني «ألف باب»، لكنّي لم أعدّها قطّ، هههه. أنا غاليه.
    en: Good morning from Lawang Sewu! The name means "a thousand doors". But I've never counted, hehe. I'm Galih.
    note:
      ar_eg: لاوانج سيوو مبنى إدارة سكّة حديد هولندي قديم، اتسمّى كده عشان شبابيكه وأبوابه كتير أوي.
      ar: لاوانغ سيوو مبنى إدارة سكك حديدية هولنديّ قديم، سُمّي كذلك لكثرة أبوابه ونوافذه.
      en: Lawang Sewu is an old Dutch railway office, named for its many doors and windows.
  - speaker: Mbak Sekar
    text: Kula Sekar. Dina menika kita maca warta, kabar ing koran lan radio.
    ar_eg: أنا سيكار. النهارده هنقرا الأخبار، في الجرايد والراديو.
    ar: أنا سيكار. اليوم نقرأ الأخبار في الصحف والإذاعة.
    en: I'm Sekar. Today we read the news, in papers and on the radio.
  - speaker: Mas Galih
    text: Ing Jawa ana majalah basa Jawa wiwit biyen, kaya Panjebar Semangat lan Jaya Baya.
    ar_eg: في جاوة فيه مجلّات بالجاوي من زمان، زي «Panjebar Semangat» و«Jaya Baya».
    ar: في جاوة مجلّات بالجاوية منذ زمن، مثل «Panjebar Semangat» و«Jaya Baya».
    en: Java has had Javanese magazines for decades, like Panjebar Semangat and Jaya Baya.
  - speaker: Mbak Sekar
    text: Lan ing warta, akeh ukara "di-... dening...". Kaya "ditulis oleh" ing basa Indonesia.
    ar_eg: وفي الأخبار، فيه جمل كتير «di-... dening...». زي «ditulis oleh» بالإندونيسي.
    ar: وفي الأخبار جمل كثيرة «di-... dening...»، مثل «ditulis oleh» في الإندونيسية.
    en: And news has lots of "di-... dening..." sentences. Like Indonesian "ditulis oleh".
- kind: dialogue
  title: Warta radio
  lines:
  - speaker: Mbak Sekar
    text: Galih, ayo dadi penyiar warta. Aku maca warta, kowe takon.
    ar_eg: يا جاليه، يلّا نبقى مذيعين أخبار. أنا أقرا الخبر، وانت تسأل.
    ar: يا غاليه، لنكن مذيعَي أخبار. أنا أقرأ الخبر وأنت تسأل.
    en: Galih, let's be newsreaders. I read the news, you ask.
  - speaker: Mbak Sekar
    text: Warta saking Semarang. Pameran foto lawas dibukak dening Walikota ing Lawang Sewu.
    ar_eg: أخبار من سيمارانج. معرض صور قديمة افتتحه العمدة في لاوانج سيوو.
    ar: أخبار من سيمارانغ. افتتح العمدة معرض صور قديمة في لاوانغ سيوو.
    en: News from Semarang. An exhibition of old photos was opened by the Mayor at Lawang Sewu.
  - speaker: Mas Galih
    text: Dibukak dening sapa?
    ar_eg: اتفتح على إيد مين؟
    ar: افتتحه من؟
    en: Opened by whom?
  - speaker: Mbak Sekar
    text: Dening Walikota Semarang. Pameran iki dianakake nganti pungkasan sasi.
    ar_eg: على إيد عمدة سيمارانج. والمعرض ده مستمرّ لآخر الشهر.
    ar: على يد عمدة سيمارانغ، ويستمرّ المعرض حتى آخر الشهر.
    en: By the Mayor of Semarang. The exhibition runs until the end of the month.
  - speaker: Mas Galih
    text: Foto apa wae sing dipamerake?
    ar_eg: صور إيه اللي معروضة؟
    ar: ما الصور المعروضة؟
    en: What photos are shown?
  - speaker: Mbak Sekar
    text: Foto-foto sepur lan stasiun jaman Walanda. Foto-foto iki diklumpukake dening museum.
    ar_eg: صور قطورات ومحطّات من أيّام الهولنديين. الصور دي جمّعها المتحف.
    ar: صور قطارات ومحطّات من العهد الهولنديّ، جمعها المتحف.
    en: Photos of trains and stations from the Dutch era. The photos were collected by the museum.
  - speaker: Mas Galih
    text: Menarik! Warta liyane?
    ar_eg: مثير! فيه أخبار تانية؟
    ar: مثير! أخبار أخرى؟
    en: Interesting! Other news?
  - speaker: Mbak Sekar
    text: Ketua RT anyar kapilih ing kampung Kauman Semarang. Panjenenganipun kapilih dening warga.
    ar_eg: رئيس حارة جديد اتنتخب في حيّ كاومان في سيمارانج. انتخبه السكّان.
    ar: انتُخب رئيس حيّ جديد في كاومان سيمارانغ، انتخبه السكّان.
    en: A new neighbourhood head was elected in Kauman, Semarang. He was elected by the residents.
    note:
      ar_eg: kapilih = اتنتخب (زي dipilih بس أرسم). ka- و-in- (زي tinulis = اتكتب) أشكال رسمية للمبني للمجهول.
      ar: kapilih = انتُخب (مثل dipilih لكن أرسم). وka- و-in- (مثل tinulis = كُتب) صيغ رسمية للمبنيّ للمجهول.
      en: Kapilih = was elected (like dipilih, more formal). Ka- and -in- (as in tinulis = written) are formal passive forms.
  - speaker: Mas Galih
    text: Lan pengumuman kerja bakti?
    ar_eg: وإعلان يوم التنضيف الجماعي؟
    ar: وإعلان يوم العمل الجماعيّ؟
    en: And the community clean-up notice?
  - speaker: Mbak Sekar
    text: 'Iki: "Dina Minggu esuk, warga diajak kerja bakti ngresiki kali."'
    ar_eg: 'ده: «يوم الحدّ الصبح، السكّان معزومين على يوم تنضيف للنهر.»'
    ar: 'هذا: «صباح الأحد، يُدعى السكّان إلى العمل الجماعيّ لتنظيف النهر.»'
    en: 'Here: "Sunday morning, residents are invited to a clean-up of the river."'
    note:
      ar_eg: kerja bakti = يوم شغل جماعي تطوّعي للحيّ - عادة إندونيسية وجاوية قويّة.
      ar: kerja bakti = يوم عمل جماعيّ تطوّعيّ للحيّ - عادة إندونيسية وجاوية راسخة.
      en: Kerja bakti = a voluntary community work day - a strong Indonesian and Javanese custom.
- kind: word_spotlight
  title: Di-... dening...
  lines:
  - speaker: Mas Galih
    text: Di- plus kriya, banjur dening plus sing nindakake. Ditulis dening wartawan.
    ar_eg: di- مع الفعل، وبعدين dening مع اللي عمل. اتكتب على إيد صحفي.
    ar: di- مع الفعل، ثمّ dening مع الفاعل. كتبه صحفيّ.
    en: Di- plus the verb, then dening plus the doer. Written by a journalist.
  - speaker: Mbak Sekar
    text: 'Ka-: kapilih, katon, kapacak. Lan -in-: tinulis, sinebut. Iki resmi banget, kanggo tulisan.'
    ar_eg: 'ka-: kapilih، katon، kapacak. و-in-: tinulis، sinebut. دي رسمية أوي، للكتابة.'
    ar: 'ka-: kapilih وkaton وkapacak. و-in-: tinulis وsinebut. رسمية جدًّا، للكتابة.'
    en: 'Ka-: kapilih, katon, kapacak. And -in-: tinulis, sinebut. Very formal, for writing.'
    note:
      ar_eg: kapacak = اتنشر (في الجرنال)، sinebut = بيتسمّى / اللي اسمه.
      ar: kapacak = نُشر (في الصحيفة)، وsinebut = يُدعى.
      en: Kapacak = published (in a paper), sinebut = called, named.
  - speaker: Mas Galih
    text: Warta, kabar, pengumuman, pameran, sejarah. Tembung-tembung koran.
    ar_eg: خبر، أخبار، إعلان، معرض، تاريخ. كلمات الجرايد.
    ar: خبر، أنباء، إعلان، معرض، تاريخ. كلمات الصحف.
    en: News, report, announcement, exhibition, history. Newspaper words.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Pameran dibukak dening Walikota.
    ar_eg: المعرض افتتحه العمدة.
    ar: افتتح العمدة المعرض.
    en: The exhibition was opened by the Mayor.
  - speaker: Mas Galih
    text: Pameran dibukak dening Walikota.
    ar_eg: المعرض افتتحه العمدة.
    ar: افتتح العمدة المعرض.
    en: The exhibition was opened by the Mayor.
  - speaker: Mbak Sekar
    text: Foto iki diklumpukake dening museum.
    ar_eg: الصور دي جمّعها المتحف.
    ar: جمع المتحف هذه الصور.
    en: These photos were collected by the museum.
  - speaker: Mas Galih
    text: Foto iki diklumpukake dening museum.
    ar_eg: الصور دي جمّعها المتحف.
    ar: جمع المتحف هذه الصور.
    en: These photos were collected by the museum.
  - speaker: Mbak Sekar
    text: Ketua RT kapilih dening warga.
    ar_eg: رئيس الحارة انتخبه السكّان.
    ar: انتخب السكّان رئيس الحيّ.
    en: The neighbourhood head was elected by the residents.
  - speaker: Mas Galih
    text: Ketua RT kapilih dening warga.
    ar_eg: رئيس الحارة انتخبه السكّان.
    ar: انتخب السكّان رئيس الحيّ.
    en: The neighbourhood head was elected by the residents.
  - speaker: Mbak Sekar
    text: Warga diajak kerja bakti.
    ar_eg: السكّان معزومين على يوم التنضيف.
    ar: يُدعى السكّان إلى العمل الجماعيّ.
    en: Residents are invited to the clean-up.
  - speaker: Mas Galih
    text: Warga diajak kerja bakti.
    ar_eg: السكّان معزومين على يوم التنضيف.
    ar: يُدعى السكّان إلى العمل الجماعيّ.
    en: Residents are invited to the clean-up.
  - speaker: Mbak Sekar
    text: Iki warta saking Semarang.
    ar_eg: دي أخبار من سيمارانج.
    ar: هذه أخبار من سيمارانغ.
    en: This is news from Semarang.
  - speaker: Mas Galih
    text: Iki warta saking Semarang.
    ar_eg: دي أخبار من سيمارانج.
    ar: هذه أخبار من سيمارانغ.
    en: This is news from Semarang.
- kind: outro
  title: Warta saking Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki dadi wartawan. Tulisen warta cekak babagan kutha sampeyan, nganggo di-... dening...
    ar_eg: يا ماس محمد، دلوقتي بقيت صحفي. اكتب خبر قصيّر عن مدينتك بـdi-... dening...
    ar: يا ماس محمد، صرت صحفيًّا. اكتب خبرًا قصيرًا عن مدينتك بـdi-... dening...
    en: Mas Mohamed, now you're a journalist. Write a short news item about your city, with di-... dening...
    note:
      ar_eg: دورك! جملتين على الأقل بالمبني للمجهول.
      ar: دورك! جملتان على الأقلّ بالمبنيّ للمجهول.
      en: Your turn! At least two passive sentences.
  - speaker: Mas Galih
    text: 'Contone: Masjid anyar dibukak dening Gubernur Kairo. Masjid iki dibangun dening warga.'
    ar_eg: 'مثلًا: جامع جديد افتتحه محافظ القاهرة. الجامع ده بناه السكّان.'
    ar: 'مثلًا: افتتح محافظ القاهرة مسجدًا جديدًا بناه السكّان.'
    en: 'For example: A new mosque was opened by the Governor of Cairo. The mosque was built by residents.'
  - speaker: Mbak Sekar
    text: PR-mu, rungokna warta radio ing pelajaran, lan tulisen pira ukara sing nganggo dening.
    ar_eg: واجبك، اسمع الخبر الإذاعي في الدرس، واكتب كام جملة فيها dening.
    ar: 'واجبك: استمع إلى نشرة الإذاعة في الدرس واحسب الجمل التي فيها dening.'
    en: 'Your homework: listen to the radio news in the lesson and count the sentences with dening.'
  - speaker: Mas Galih
    text: Sesuk kita dhateng Simpang Lima, sinau ejaan. Nganti pinanggih malih!
    ar_eg: بكرة رايحين سيمپانج ليما، نتعلّم الإملاء. إلى اللقاء!
    ar: غدًا نذهب إلى سيمبانغ ليما لنتعلّم الإملاء. إلى اللقاء!
    en: Tomorrow we go to Simpang Lima to learn spelling. Until next time!
