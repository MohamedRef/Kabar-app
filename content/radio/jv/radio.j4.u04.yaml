title:
  target: Tata krama
  ar_eg: آداب السلوك
  ar: آداب السلوك
  en: Etiquette
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Taman Sari
  lines:
  - speaker: Mas Galih
    text: Sugeng enjing saking Taman Sari, kolam-kolam lawas para putri Kraton. Kula Galih.
    ar_eg: صباح الخير من تامان ساري، حمّامات أميرات القصر القديمة. أنا جاليه.
    ar: صباح الخير من تامان ساري، أحواض أميرات القصر القديمة. أنا غاليه.
    en: Good morning from Taman Sari, the old pools of the palace princesses. I'm Galih.
    note:
      ar_eg: تامان ساري = «الجنينة الحلوة»، قصر ميّة اتبنى في القرن التمنتاشر للسلطان وعيلته.
      ar: تامان ساري = «الحديقة الجميلة»، قصر مائيّ بُني في القرن الثامن عشر للسلطان وأسرته.
      en: Taman Sari = "beautiful garden", an 18th-century water palace for the Sultan's household.
  - speaker: Mbak Sekar
    text: Kula Sekar. Dina menika kita sinau tata krama. Tembung lan solah bawa.
    ar_eg: أنا سيكار. النهارده هنتعلّم آداب السلوك. الكلام والتصرّف.
    ar: 'أنا سيكار. اليوم نتعلّم آداب السلوك: الكلام والتصرّف.'
    en: I'm Sekar. Today we learn etiquette. Words and gestures.
  - speaker: Mas Galih
    text: Ing Jawa, krama ora mung basa. Awak uga melu ngomong!
    ar_eg: في جاوة، الكراما مش كلام بس. الجسم كمان بيتكلّم!
    ar: في جاوة الكراما ليست كلامًا فحسب. الجسد يتكلّم أيضًا!
    en: In Java, krama isn't just words. Your body speaks too!
  - speaker: Mbak Sekar
    text: Nuding nganggo jempol. Menehi nganggo tangan tengen. Lan mbungkuk sithik nalika liwat ngarepe wong sepuh.
    ar_eg: تشاور بالإبهام. تدّي بالإيد اليمين. وتنحني شويّة لمّا تعدّي قدّام حدّ كبير.
    ar: أشِر بالإبهام، وناول باليمنى، وانحنِ قليلًا حين تمرّ أمام الكبار.
    en: Point with the thumb. Give with the right hand. And stoop a little when passing in front of elders.
- kind: dialogue
  title: Sowan ing griya
  lines:
  - speaker: Mbak Sekar
    text: Galih, sampeyan tamu, kula ingkang gadhah griya.
    ar_eg: يا جاليه، انت الضيف، وأنا صاحبة البيت.
    ar: يا غاليه، أنت الضيف وأنا صاحبة البيت.
    en: Galih, you're the guest, I'm the host.
  - speaker: Mas Galih
    text: Kula nuwun!
    ar_eg: السلام عليكم! (فيه حدّ؟)
    ar: هل من أحد؟
    en: Hello, anyone home?
    note:
      ar_eg: kula nuwun = اللي بتقوله على الباب لمّا تزور، زي «يا أهل الدار!».
      ar: kula nuwun = ما تقوله عند الباب حين تزور، مثل «يا أهل الدار!».
      en: Kula nuwun = what you say at the door when visiting, like "anyone home?".
  - speaker: Mbak Sekar
    text: Monggo! Oh, Mas Galih. Monggo mlebet, monggo pinarak.
    ar_eg: اتفضّل! آه، ماس جاليه. اتفضّل ادخل، اتفضّل اقعد.
    ar: تفضّل! آه، ماس غاليه. تفضّل ادخل، تفضّل اجلس.
    en: Come in! Oh, Mas Galih. Please come in, please sit.
  - speaker: Mas Galih
    text: Matur nuwun, Bu. Menika wonten oleh-oleh sekedhik saking Suroboyo.
    ar_eg: متشكّر يا ست. ده هدية صغيّرة من سورابايا.
    ar: شكرًا يا سيّدتي. هذه هديّة صغيرة من سورابايا.
    en: Thank you, Bu. Here's a little gift from Surabaya.
    note:
      ar_eg: جاليه ادّاها الهديّة بإيده اليمين، والإيد الشمال سانداها من تحت كوعه - زي الأدب عندنا بالظبط.
      ar: ناولها غاليه الهديّة بيمناه، ويسراه تسند مرفقه - أدب يشبه أدبنا.
      en: Galih hands the gift with his right hand, left hand supporting the elbow - a polite form much like ours.
  - speaker: Mbak Sekar
    text: Waduh, sampun repot-repot, Mas. Matur nuwun sanget.
    ar_eg: يا خبر، ليه تعبت نفسك يا ماس. متشكّرة أوي.
    ar: يا ماس، لماذا كلّفت نفسك؟ شكرًا جزيلًا.
    en: Oh, you shouldn't have, Mas. Thank you very much.
    note:
      ar_eg: sampun repot-repot = «ماكانش له لزوم تتعب نفسك» - الردّ المؤدّب على أيّ هديّة.
      ar: sampun repot-repot = «لم يكن داعٍ لأن تتعب نفسك» - الردّ المهذّب على أيّ هديّة.
      en: Sampun repot-repot = "you shouldn't have gone to the trouble" - the polite reply to any gift.
  - speaker: Mas Galih
    text: Mboten menapa, Bu. Simbah wonten?
    ar_eg: مفيش حاجة يا ست. جدّتي موجودة؟
    ar: لا شيء يا سيّدتي. هل الجدّة موجودة؟
    en: It's nothing, Bu. Is grandma here?
  - speaker: Mbak Sekar
    text: Wonten, lenggah wonten ngajeng TV.
    ar_eg: موجودة، قاعدة قدّام التليفزيون.
    ar: موجودة، تجلس أمام التلفاز.
    en: She is, sitting in front of the TV.
  - speaker: Mas Galih
    text: Ndherek langkung, Mbah.
    ar_eg: بعد إذنك يا جدّتي.
    ar: بعد إذنك يا جدّتي.
    en: Excuse me as I pass, Mbah.
    note:
      ar_eg: ndherek langkung = «بعد إذنك أعدّي» وانت معدّي قدّام كبير قاعد، وانت موطّي شويّة والإيد اليمين لتحت.
      ar: ndherek langkung = «بعد إذنك أمرّ» حين تمرّ أمام كبير جالس، منحنيًا قليلًا ويدك اليمنى إلى أسفل.
      en: Ndherek langkung = "excuse me as I pass", said walking past a seated elder, stooping, right hand lowered.
  - speaker: Mbak Sekar
    text: Mas Mohamed, krungu? Galih ngomong ndherek langkung lan mbungkuk sithik. Sae sanget!
    ar_eg: يا ماس محمد، سمعت؟ جاليه قال ndherek langkung وانحنى شويّة. ممتاز!
    ar: يا ماس محمد، أسمعت؟ قال غاليه ndherek langkung وانحنى قليلًا. ممتاز!
    en: Mas Mohamed, hear that? Galih said ndherek langkung and stooped a little. Excellent!
  - speaker: Mas Galih
    text: Wis, aku saiki wong Yogya, hehe.
    ar_eg: خلاص، أنا بقيت من يوجيا، هههه.
    ar: انتهى، صرت من أهل يوغيا، هههه.
    en: That's it, I'm a Yogya person now, hehe.
- kind: word_spotlight
  title: Nuwun sewu, monggo, ndherek langkung
  lines:
  - speaker: Mbak Sekar
    text: 'Nuwun sewu: nyuwun idin, kaya "excuse me".'
    ar_eg: 'nuwun sewu: استئذان، زي «لا مؤاخذة».'
    ar: 'nuwun sewu: استئذان، مثل «عذرًا».'
    en: 'Nuwun sewu: asking leave, like "excuse me".'
  - speaker: Mas Galih
    text: 'Monggo: "silakan", kanggo ngajak, menehi, utawa pamit. Monggo pinarak, monggo dhahar.'
    ar_eg: 'monggo: «اتفضّل»، للعزومة أو الإعطاء أو الاستئذان بالمشي. اتفضّل اقعد، اتفضّل كُل.'
    ar: 'monggo: «تفضّل»، للدعوة أو المناولة أو الاستئذان. تفضّل اجلس، تفضّل كُل.'
    en: 'Monggo: "please, go ahead", to invite, offer or take leave. Monggo pinarak, monggo dhahar.'
  - speaker: Mbak Sekar
    text: Kula nuwun ing lawang. Ndherek langkung nalika liwat. Sampun repot-repot nalika nampi oleh-oleh.
    ar_eg: kula nuwun على الباب. ndherek langkung وانت معدّي. sampun repot-repot لمّا تاخد هديّة.
    ar: kula nuwun عند الباب، وndherek langkung عند المرور، وsampun repot-repot عند تلقّي هديّة.
    en: Kula nuwun at the door. Ndherek langkung when passing. Sampun repot-repot when given a gift.
  - speaker: Mas Galih
    text: Lan matur nuwun sanget kanggo matur suwun sing gedhe.
    ar_eg: وmatur nuwun sanget للشكر الكبير.
    ar: وmatur nuwun sanget للشكر الجزيل.
    en: And matur nuwun sanget for a big thank you.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Kula nuwun!
    ar_eg: فيه حدّ؟ (على الباب)
    ar: هل من أحد؟
    en: Anyone home?
  - speaker: Mas Galih
    text: Kula nuwun!
    ar_eg: فيه حدّ؟ (على الباب)
    ar: هل من أحد؟
    en: Anyone home?
  - speaker: Mbak Sekar
    text: Monggo pinarak.
    ar_eg: اتفضّل اقعد.
    ar: تفضّل اجلس.
    en: Please sit.
  - speaker: Mas Galih
    text: Monggo pinarak.
    ar_eg: اتفضّل اقعد.
    ar: تفضّل اجلس.
    en: Please sit.
  - speaker: Mbak Sekar
    text: Sampun repot-repot.
    ar_eg: ماكانش له لزوم تتعب نفسك.
    ar: لم يكن داعٍ للتعب.
    en: You shouldn't have.
  - speaker: Mas Galih
    text: Sampun repot-repot.
    ar_eg: ماكانش له لزوم تتعب نفسك.
    ar: لم يكن داعٍ للتعب.
    en: You shouldn't have.
  - speaker: Mbak Sekar
    text: Ndherek langkung, Mbah.
    ar_eg: بعد إذنك يا جدّتي.
    ar: بعد إذنك يا جدّتي.
    en: Excuse me as I pass, Mbah.
  - speaker: Mas Galih
    text: Ndherek langkung, Mbah.
    ar_eg: بعد إذنك يا جدّتي.
    ar: بعد إذنك يا جدّتي.
    en: Excuse me as I pass, Mbah.
  - speaker: Mbak Sekar
    text: Matur nuwun sanget.
    ar_eg: متشكّر جدًّا.
    ar: شكرًا جزيلًا.
    en: Thank you very much.
  - speaker: Mas Galih
    text: Matur nuwun sanget.
    ar_eg: متشكّر جدًّا.
    ar: شكرًا جزيلًا.
    en: Thank you very much.
  - speaker: Mbak Sekar
    text: Monggo dhahar rumiyin.
    ar_eg: اتفضّل كُل الأوّل.
    ar: تفضّل كُلْ أوّلًا.
    en: Please eat first.
  - speaker: Mas Galih
    text: Monggo dhahar rumiyin.
    ar_eg: اتفضّل كُل الأوّل.
    ar: تفضّل كُلْ أوّلًا.
    en: Please eat first.
  - speaker: Mbak Sekar
    text: Nyuwun sewu, kula badhe pamit.
    ar_eg: لا مؤاخذة، أنا هستأذن أمشي.
    ar: عذرًا، أستأذن بالانصراف.
    en: Excuse me, I'd like to take my leave.
  - speaker: Mas Galih
    text: Nyuwun sewu, kula badhe pamit.
    ar_eg: لا مؤاخذة، أنا هستأذن أمشي.
    ar: عذرًا، أستأذن بالانصراف.
    en: Excuse me, I'd like to take my leave.
  - speaker: Mbak Sekar
    text: Lan nalika pamit, matur "nyuwun pamit" utawa "kula pamit rumiyin". Ampun kesah tanpa pamit!
    ar_eg: ولمّا تمشي، قول «nyuwun pamit» أو «kula pamit rumiyin». ماتمشيش من غير ما تستأذن!
    ar: وعند الانصراف قل «nyuwun pamit» أو «kula pamit rumiyin». لا تذهب دون استئذان!
    en: And when leaving, say "nyuwun pamit" or "kula pamit rumiyin". Never leave without taking leave!
- kind: outro
  title: Unggah-ungguh ing griya
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, bayangna sampeyan sowan griyanipun Bu Ningsih. Wiwit ing lawang nganti lenggah. Nganggo tembung papat.
    ar_eg: يا ماس محمد، تخيّل إنك بتزور بيت بو نينجسيه. من الباب لحدّ ما تقعد. استخدم أربع عبارات.
    ar: يا ماس محمد، تخيّل زيارتك لبيت بو نينغسيه، من الباب حتى الجلوس. استعمل أربع عبارات.
    en: Mas Mohamed, imagine visiting Bu Ningsih's house. From the door until you sit. Use four phrases.
    note:
      ar_eg: دورك! kula nuwun، ndherek langkung، sampun repot-repot، matur nuwun sanget. وجرّب «Unggah-Ungguh Simulator» في الدرس.
      ar: دورك! kula nuwun وndherek langkung وsampun repot-repot وmatur nuwun sanget. وجرّب «Unggah-Ungguh Simulator» في الدرس.
      en: Your turn! Kula nuwun, ndherek langkung, sampun repot-repot, matur nuwun sanget. And try the Unggah-Ungguh Simulator in the lesson.
  - speaker: Mas Galih
    text: 'Aja lali awakmu uga: jempol, tangan tengen, lan mbungkuk sithik.'
    ar_eg: 'ماتنساش جسمك كمان: الإبهام، والإيد اليمين، والانحناء شويّة.'
    ar: 'ولا تنسَ جسدك: الإبهام واليد اليمنى والانحناءة.'
    en: 'Don''t forget your body: thumb, right hand, and a little stoop.'
  - speaker: Mbak Sekar
    text: PR-mu, wacanen tata krama saka Mas Dimas ing pelajaran.
    ar_eg: واجبك، اقرا آداب ماس ديماس في الدرس.
    ar: 'واجبك: اقرأ آداب ماس ديماس في الدرس.'
    en: 'Your homework: read Mas Dimas''s etiquette tips in the lesson.'
  - speaker: Mas Galih
    text: Sesuk kita dhateng Kotabaru, sinau ngoko alus. Nganti pinanggih malih!
    ar_eg: بكرة رايحين كوتابارو، نتعلّم النجوكو المؤدّب. إلى اللقاء!
    ar: غدًا نذهب إلى كوتابارو لنتعلّم النغوكو المهذّبة. إلى اللقاء!
    en: Tomorrow we go to Kotabaru to learn ngoko alus. Until next time!
