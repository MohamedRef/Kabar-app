review:
  status: draft
  verified: false
  notes: Polite pronouns at Pasar Kranggan, Jogja (moved from Solo's Pasar Gede, Javanese focus 2026-10-27). Bu Siti (the market persona) is mentioned only. Sampeyan is everyday polite; panjenengan for elders and people you honour.
