title:
  target: Kula lan panjenengan
  ar_eg: أنا وحضرتك
  ar: أنا وحضرتك
  en: Polite pronouns
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pasar Gede
  lines:
  - speaker: Mas Danang
    text: Sugeng enjing saking Pasar Kranggan, Jogja! Kula Danang. Lho, aku wis bisa krama!
    ar_eg: صباح الخير من باسار كرانجان في جوجا! أنا دانانج. إيه ده، أنا بقيت بعرف كراما!
    ar: صباح الخير من سوق كرانغان في جوكجا! أنا دانانغ. عجبًا، صرت أتكلّم الكراما!
    en: Good morning from Pasar Kranggan, Jogja! I'm Danang. Hey, I can do krama now!
  - speaker: Mbak Sekar
    text: Kula Sekar. Pasar Kranggan iku pasar lawas, cedhak Tugu. Akeh bakul jajan sing sepuh.
    ar_eg: أنا سيكار. باسار كرانجان سوق قديم جنب التوجو. فيه بيّاعين حلويات كبار في السنّ كتير.
    ar: أنا سيكار. سوق كرانغان سوق قديم قرب نصب توغو، وفيه باعة حلويات مسنّون كثيرون.
    en: I'm Sekar. Pasar Kranggan is an old market near the Tugu. Lots of elderly sweets sellers.
    note:
      ar_eg: باسار كرانجان شمال الماليوبورو، والصبح بدري بيتملي بـ«جاجان باسار»، يعني حلويات تقليدية صغيّرة.
      ar: سوق كرانغان شمال شارع ماليوبورو، ويمتلئ في الصباح الباكر بـ«جاجان باسار»، يعني حلويات تقليدية صغيرة.
      en: Pasar Kranggan, north of Malioboro, fills up early in the morning with jajan pasar, small traditional sweets.
  - speaker: Mas Danang
    text: Mula dina iki kita sinau tembung "aku" lan "kowe" ing basa krama.
    ar_eg: عشان كده النهارده هنتعلّم «أنا» و«انت» بالكراما.
    ar: لذلك نتعلّم اليوم «أنا» و«أنت» بالكراما.
    en: So today we learn "I" and "you" in krama.
  - speaker: Mbak Sekar
    text: Mas Mohamed, iki gampang lan migunani banget. Papat tembung wae.
    ar_eg: يا ماس محمد، دي سهلة ومفيدة أوي. أربع كلمات بس.
    ar: يا ماس محمد، هذا سهل ومفيد جدًّا. أربع كلمات فقط.
    en: Mas Mohamed, this is easy and really useful. Just four words.
- kind: dialogue
  title: Tuku jajan ing Pasar Kranggan
  lines:
  - speaker: Mbak Sekar
    text: Danang, sampeyan tamu, kula bakul jajan sing sepuh, nggih.
    ar_eg: يا دانانج، انت الضيف، وأنا بيّاعة الحلويات الكبيرة.
    ar: يا دانانغ، أنت الضيف وأنا بائعة الحلويات المسنّة.
    en: Danang, you're the visitor, I'm the elderly sweets seller.
  - speaker: Mas Danang
    text: Nyuwun sewu, Bu. Menika jajan menapa?
    ar_eg: لا مؤاخذة يا حاجّة. دي حلويات إيه؟
    ar: عذرًا يا سيّدتي. ما هذه الحلويات؟
    en: Excuse me, Bu. What sweets are these?
  - speaker: Mbak Sekar
    text: Menika serabi, Mas. Sampeyan saking pundi?
    ar_eg: دي سيرابي يا ماس. حضرتك منين؟
    ar: هذه سيرابي يا ماس. من أين حضرتك؟
    en: These are serabi, Mas. Where are you from?
    note:
      ar_eg: serabi = فطاير صغيّرة بلبن جوز الهند، بتتباع في أسواق جاوة.
      ar: serabi = فطائر صغيرة بحليب جوز الهند، تُباع في أسواق جاوة.
      en: Serabi = small coconut-milk pancakes, sold in Javanese markets.
  - speaker: Mas Danang
    text: Kula saking Madiun, Bu. Panjenengan sampun dangu sadean wonten mriki?
    ar_eg: أنا من ماديون يا حاجّة. حضرتك بقالك كتير بتبيعي هنا؟
    ar: أنا من ماديون يا سيّدتي. هل تبيعين هنا منذ زمن؟
    en: I'm from Madiun, Bu. Have you been selling here long?
  - speaker: Mbak Sekar
    text: Sampun, Mas. Sampun tigang dasa taun. Kula sadean wiwit enem.
    ar_eg: أيوه يا ماس. بقالي تلاتين سنة. ببيع من وأنا صغيّرة.
    ar: نعم يا ماس. منذ ثلاثين سنة. أبيع منذ صغري.
    en: Yes, Mas. Thirty years now. I've sold since I was young.
  - speaker: Mas Danang
    text: Wah! Lajeng putranipun? Piyambakipun ugi sadean?
    ar_eg: يا سلام! وولادك؟ هم كمان بيبيعوا؟
    ar: رائع! وأولادك؟ هل يبيعون أيضًا؟
    en: Wow! And your children? Do they sell too?
    note:
      ar_eg: piyambakipun = هو / هي بأدب (الكراما من dheweke). putra = الابن بالكراما إنجيل - عشان دول ولاد الست الكبيرة.
      ar: piyambakipun = هو / هي بأدب (كراما dheweke). وputra = الابن بالكراما إنغيل لأنّهم أبناء السيّدة المسنّة.
      en: Piyambakipun = he / she, politely (krama of dheweke). Putra = child in krama inggil - they're the elder's children.
  - speaker: Mbak Sekar
    text: Mboten, Mas. Putra kula nyambut damel wonten Jakarta.
    ar_eg: لأ يا ماس. ابني شغّال في جاكرتا.
    ar: لا يا ماس. ابني يعمل في جاكرتا.
    en: No, Mas. My son works in Jakarta.
  - speaker: Mas Danang
    text: Kula tumbas serabi gangsal, Bu.
    ar_eg: هاخد خمسة سيرابي يا حاجّة.
    ar: سآخذ خمس قطع سيرابي يا سيّدتي.
    en: I'll take five serabi, Bu.
  - speaker: Mbak Sekar
    text: Monggo, Mas. Matur nuwun sanget.
    ar_eg: اتفضّل يا ماس. متشكّرة أوي.
    ar: تفضّل يا ماس. شكرًا جزيلًا.
    en: Here you go, Mas. Thank you very much.
  - speaker: Mas Danang
    text: Sekar, kula leres?
    ar_eg: يا سيكار، أنا صحّ؟
    ar: يا سيكار، هل أصبت؟
    en: Sekar, did I get it right?
  - speaker: Mbak Sekar
    text: Leres sanget! Sampeyan ngomong "panjenengan" marang ibu sepuh. Ibune mesthi seneng.
    ar_eg: صحّ جدًّا! قلت «panjenengan» للست الكبيرة. أكيد انبسطت.
    ar: صحيح تمامًا! قلت «panjenengan» للسيّدة المسنّة، ولا بدّ أنّها سُرّت.
    en: Very right! You said "panjenengan" to the elderly lady. She must be pleased.
- kind: word_spotlight
  title: Kula, sampeyan, panjenengan
  lines:
  - speaker: Mbak Sekar
    text: Aku dadi kula. Kula Sekar. Kula saking Yogya.
    ar_eg: aku تبقى kula. أنا سيكار. أنا من يوجيا.
    ar: aku تصير kula. أنا سيكار. أنا من يوغيا.
    en: Aku becomes kula. I'm Sekar. I'm from Yogya.
  - speaker: Mas Danang
    text: Kowe dadi sampeyan, kanggo wong sing sapantaran utawa sing durung kenal.
    ar_eg: kowe تبقى sampeyan، للي في سنّك أو اللي ماتعرفوش.
    ar: kowe تصير sampeyan لمن في عمرك أو لمن لا تعرفه.
    en: Kowe becomes sampeyan, for people your age or strangers.
  - speaker: Mbak Sekar
    text: Lan panjenengan kanggo wong tuwa, guru, utawa wong sing diajeni.
    ar_eg: وpanjenengan للكبار، والمدرّسين، والناس المحترمين.
    ar: وpanjenengan للكبار والمعلّمين ومن تجلّهم.
    en: And panjenengan for elders, teachers, or people you honour.
    note:
      ar_eg: sampeyan زي «حضرتك» اليومية، وpanjenengan زي «سيادتك». مع الشكّ، panjenengan أأمن مع الكبار.
      ar: sampeyan مثل «حضرتك» اليومية، وpanjenengan مثل «سيادتك». وعند الشكّ panjenengan أسلم مع الكبار.
      en: Sampeyan is like everyday "hadretak", panjenengan like "siyadtak". When in doubt, panjenengan is safer with elders.
  - speaker: Mas Danang
    text: Dheweke dadi piyambakipun. Piyambakipun bakul serabi.
    ar_eg: dheweke تبقى piyambakipun. هي بيّاعة سيرابي.
    ar: dheweke تصير piyambakipun. هي بائعة سيرابي.
    en: Dheweke becomes piyambakipun. She's a serabi seller.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Kula saking Mesir.
    ar_eg: أنا من مصر.
    ar: أنا من مصر.
    en: I'm from Egypt.
  - speaker: Mas Danang
    text: Kula saking Mesir.
    ar_eg: أنا من مصر.
    ar: أنا من مصر.
    en: I'm from Egypt.
  - speaker: Mbak Sekar
    text: Sampeyan saking pundi?
    ar_eg: حضرتك منين؟
    ar: من أين حضرتك؟
    en: Where are you from?
  - speaker: Mas Danang
    text: Sampeyan saking pundi?
    ar_eg: حضرتك منين؟
    ar: من أين حضرتك؟
    en: Where are you from?
  - speaker: Mbak Sekar
    text: Panjenengan sampun dangu wonten mriki?
    ar_eg: سيادتك بقالك كتير هنا؟
    ar: هل حضرتك هنا منذ زمن؟
    en: Have you been here long?
  - speaker: Mas Danang
    text: Panjenengan sampun dangu wonten mriki?
    ar_eg: سيادتك بقالك كتير هنا؟
    ar: هل حضرتك هنا منذ زمن؟
    en: Have you been here long?
  - speaker: Mbak Sekar
    text: Piyambakipun nyambut damel wonten Jakarta.
    ar_eg: هو بيشتغل في جاكرتا.
    ar: هو يعمل في جاكرتا.
    en: He works in Jakarta.
  - speaker: Mas Danang
    text: Piyambakipun nyambut damel wonten Jakarta.
    ar_eg: هو بيشتغل في جاكرتا.
    ar: هو يعمل في جاكرتا.
    en: He works in Jakarta.
  - speaker: Mbak Sekar
    text: Kula tumbas gangsal.
    ar_eg: هاخد خمسة.
    ar: سآخذ خمسة.
    en: I'll buy five.
  - speaker: Mas Danang
    text: Kula tumbas gangsal.
    ar_eg: هاخد خمسة.
    ar: سآخذ خمسة.
    en: I'll buy five.
  - speaker: Mbak Sekar
    text: Nami kula Danang, saking Madiun.
    ar_eg: اسمي دانانج، من ماديون.
    ar: اسمي دانانغ، من ماديون.
    en: My name is Danang, from Madiun.
  - speaker: Mas Danang
    text: Nami kula Danang, saking Madiun.
    ar_eg: اسمي دانانج، من ماديون.
    ar: اسمي دانانغ، من ماديون.
    en: My name is Danang, from Madiun.
  - speaker: Mbak Sekar
    text: Lan "nami" iku krama saka "jeneng". Nami kula Sekar.
    ar_eg: و«nami» هي الكراما من «jeneng». اسمي سيكار.
    ar: و«nami» كراما «jeneng». اسمي سيكار.
    en: And "nami" is the krama of "jeneng". Nami kula Sekar.
- kind: outro
  title: Kenalan kanthi krama
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, kenalna dhirimu marang simbahe kancamu. Nganggo kula lan panjenengan.
    ar_eg: يا ماس محمد، عرّف نفسك لجدّة صاحبك. استخدم kula وpanjenengan.
    ar: يا ماس محمد، عرّف بنفسك لجدّة صديقك. استعمل kula وpanjenengan.
    en: Mas Mohamed, introduce yourself to your friend's grandmother. Use kula and panjenengan.
    note:
      ar_eg: دورك! اسمك، وانت منين، وسؤال واحد ليها بـpanjenengan.
      ar: دورك! اسمك، ومن أين أنت، وسؤال واحد لها بـpanjenengan.
      en: Your turn! Your name, where you're from, and one question for her with panjenengan.
  - speaker: Mbak Sekar
    text: 'Contone: Nyuwun sewu, Mbah. Nami kula Mohamed, saking Kairo. Panjenengan sehat?'
    ar_eg: 'مثلًا: لا مؤاخذة يا جدّتي. اسمي محمد، من القاهرة. حضرتك بخير؟'
    ar: 'مثلًا: عذرًا يا جدّتي. اسمي محمد، من القاهرة. هل أنتِ بخير؟'
    en: 'For example: Excuse me, Mbah. My name is Mohamed, from Cairo. Are you well?'
  - speaker: Mas Danang
    text: PR-mu, wacanen layang saka Mohamed ing pelajaran, banjur ganti "aku" lan "kowe" dadi krama.
    ar_eg: واجبك، اقرا جواب محمد في الدرس، وغيّر «aku» و«kowe» لكراما.
    ar: 'واجبك: اقرأ رسالة محمد في الدرس وحوّل «aku» و«kowe» إلى الكراما.'
    en: 'Your homework: read Mohamed''s letter in the lesson and change "aku" and "kowe" into krama.'
  - speaker: Mbak Sekar
    text: Sesuk kita neng Kauman, kampunge Masjid Gedhe. Nganti pinanggih malih!
    ar_eg: بكرة رايحين كاومان، حارة المسجد الكبير. إلى اللقاء!
    ar: غدًا نذهب إلى كاومان، حيّ المسجد الكبير. إلى اللقاء!
    en: Tomorrow we go to Kauman, the Masjid Gedhe quarter. Until next time!
