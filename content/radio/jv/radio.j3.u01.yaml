- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Stasiun Solo Balapan
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saka stasiun Solo Balapan! Sugeng rawuh ing Solo. Kula Sekar.
    ar_eg: صباح الخير من محطّة سولو بالابان! أهلًا بيكم في سولو. أنا سيكار.
    ar: صباح الخير من محطّة سولو بالابان! مرحبًا بكم في سولو، مدينتي. أنا سيكار.
    en: Good morning from Solo Balapan station! Welcome to Solo, my city. I'm Sekar.
    note:
      ar_eg: سيكار قالت «Kula» بدل «Aku» - دي أوّل كلمة كراما (الكلام المؤدّب).
      ar: قالت سيكار «Kula» بدل «Aku» - وهي أوّل كلمة كراما (الكلام المهذّب).
      en: Sekar said "Kula" instead of "Aku" - the first krama (polite) word.
  - speaker: Mas Danang
    text: Aku Danang... eh, kula Danang! Ing Solo, aku kudu ngati-ati. Basane alus banget!
    ar_eg: أنا دانانج... قصدي، kula دانانج! في سولو لازم آخد بالي. الكلام هنا راقي أوي!
    ar: أنا دانانغ... أقصد kula دانانغ! في سولو عليّ أن أنتبه. الكلام هنا رفيع جدًّا!
    en: I'm Danang... er, kula Danang! In Solo I have to be careful. The speech is so refined!
  - speaker: Mbak Sekar
    text: Mas Mohamed, minggu iki kita sinau unggah-ungguh, tingkat-tingkat basa Jawa.
    ar_eg: يا ماس محمد، الأسبوع ده هنتعلّم «unggah-ungguh»، مستويات الكلام في الجاوي.
    ar: يا ماس محمد، هذا الأسبوع نتعلّم «unggah-ungguh»، مستويات الكلام الجاوي.
    en: Mas Mohamed, this week we learn unggah-ungguh, the levels of Javanese speech.
  - speaker: Mas Danang
    text: Iki sing paling misuwur saka basa Jawa. Lan sing paling nggawe wong anyar wedi, hehe.
    ar_eg: ده أشهر حاجة في الجاوي. وأكتر حاجة بتخوّف الناس الجديدة، هههه.
    ar: هذا أشهر ما في الجاوية، وأكثر ما يخيف المبتدئين، هههه.
    en: This is the most famous thing about Javanese. And what scares newcomers most, hehe.
  - speaker: Mbak Sekar
    text: Aja wedi. Sampeyan wis ngerti iki saka basa Arab Mesir!
    ar_eg: ماتخافش. انت عارف الحكاية دي من العربي المصري!
    ar: لا تخف. أنت تعرف هذا من العاميّة المصرية!
    en: Don't be afraid. You already know this from Egyptian Arabic!
- kind: dialogue
  title: Siji pitakon, telung basa
  lines:
  - speaker: Mas Danang
    text: Sekar, piye carane takon "wis mangan?" karo wong sing beda-beda?
    ar_eg: يا سيكار، إزّاي أسأل «كلت؟» لناس مختلفين؟
    ar: يا سيكار، كيف أسأل «هل أكلت؟» أناسًا مختلفين؟
    en: Sekar, how do I ask "have you eaten?" to different people?
  - speaker: Mbak Sekar
    text: Karo kanca, ngoko. "Kowe wis mangan?"
    ar_eg: مع صاحبك، نجوكو. «انت كلت؟»
    ar: مع صديقك، نغوكو. «هل أكلت؟»
    en: With a friend, ngoko. "Kowe wis mangan?"
  - speaker: Mas Danang
    text: Kaya "enta kalt?" ing basa Mesir. Gampang.
    ar_eg: زي «انت كلت؟» بالمصري. سهلة.
    ar: مثل «انت كلت؟» بالمصرية. سهل.
    en: Like "enta kalt?" in Egyptian. Easy.
  - speaker: Mbak Sekar
    text: Karo bakul utawa wong sing durung kenal, krama. "Sampeyan sampun nedha?"
    ar_eg: مع البيّاع أو حدّ ماتعرفوش، كراما. «حضرتك كلت؟»
    ar: مع البائع أو شخص لا تعرفه، كراما. «هل أكلت حضرتك؟»
    en: With a seller or someone you don't know, krama. "Sampeyan sampun nedha?"
    note:
      ar_eg: sampun = wis، nedha = mangan بالكراما. sampeyan = انت بأدب، زي «حضرتك» العادية.
      ar: sampun = wis، وnedha = mangan بالكراما. وsampeyan = أنت بأدب، مثل «حضرتك» المعتادة.
      en: Sampun = wis, nedha = mangan in krama. Sampeyan = polite you, like everyday "hadretak".
  - speaker: Mas Danang
    text: Lan karo simbahe kanca, utawa guru?
    ar_eg: ومع جدّة صاحبي، أو المدرّس؟
    ar: ومع جدّة صديقي، أو المعلّم؟
    en: And with a friend's grandmother, or a teacher?
  - speaker: Mbak Sekar
    text: Krama inggil. "Panjenengan sampun dhahar?"
    ar_eg: كراما إنجيل. «سيادتك اتغدّيت؟»
    ar: كراما إنغيل. «هل تناولت سيادتك الطعام؟»
    en: Krama inggil. "Panjenengan sampun dhahar?"
    note:
      ar_eg: 'krama inggil = كلمات تكريم للي قدّامك: dhahar = ياكل (للمحترم)، panjenengan = سيادتك. زي «سيادتك» و«تتفضّل».'
      ar: 'krama inggil = كلمات تكريم للمخاطَب: dhahar = يأكل (للمحترم)، وpanjenengan = سيادتك. مثل «سيادتك» و«تتفضّل».'
      en: 'Krama inggil = honorific words for the other person: dhahar = eat (for someone honoured), panjenengan = you (honoured). Like "siyadtak".'
  - speaker: Mas Danang
    text: Wah, kaya "enta kalt?", "hadretak kalt?", lan "siyadtak etfaddalt?" ing basa Mesir.
    ar_eg: يا سلام، زي «انت كلت؟» و«حضرتك كلت؟» و«سيادتك اتفضّلت؟»
    ar: رائع، مثل «انت كلت؟» و«حضرتك كلت؟» و«سيادتك تفضّلت؟»
    en: Wow, like "enta kalt?", "hadretak kalt?" and "siyadtak etfaddalt?"
  - speaker: Mbak Sekar
    text: Persis! Lan siji maneh. Kanggo awake dhewe, aja nganggo krama inggil.
    ar_eg: بالظبط! وحاجة كمان. لنفسك، ماتستخدمش الكراما إنجيل أبدًا.
    ar: تمامًا! وأمر آخر. لا تستعمل الكراما إنغيل لنفسك أبدًا.
    en: Exactly! And one more thing. Never use krama inggil for yourself.
  - speaker: Mas Danang
    text: Dadi aja ngomong "kula sampun dhahar"?
    ar_eg: يعني ماقولش «أنا اتفضّلت»؟
    ar: أي لا أقول «kula sampun dhahar»؟
    en: So don't say "kula sampun dhahar"?
  - speaker: Mbak Sekar
    text: Aja! Iku kaya ngomong "siyadti etghaddet" ing basa Mesir. Ngomonga "kula sampun nedha".
    ar_eg: لأ! دي زي ما تقول «أنا سيادتي اتغدّيت». قول «kula sampun nedha».
    ar: لا! هذا كأن تقول «أنا سيادتي تغدّيت». قل «kula sampun nedha».
    en: No! That's like saying "my excellency has dined". Say "kula sampun nedha".
- kind: word_spotlight
  title: Ngoko, krama, krama inggil
  lines:
  - speaker: Mas Danang
    text: Ngoko kanggo kanca, adhi, lan bocah. Aku, kowe, mangan, wis.
    ar_eg: النجوكو للصحاب، والإخوات الصغيّرين، والعيال. أنا، انت، ياكل، خلاص.
    ar: النغوكو للأصدقاء والإخوة الأصغر والأطفال. أنا، أنت، يأكل، قد.
    en: Ngoko is for friends, younger siblings and kids. Aku, kowe, mangan, wis.
  - speaker: Mbak Sekar
    text: Krama kanggo wong sing durung kenal lan wong tuwa. Kula, sampeyan, nedha, sampun.
    ar_eg: الكراما للناس اللي ماتعرفهاش والكبار. أنا، حضرتك، ياكل، خلاص.
    ar: الكراما لمن لا تعرفهم وللكبار. أنا، حضرتك، يأكل، قد.
    en: Krama is for strangers and older people. Kula, sampeyan, nedha, sampun.
  - speaker: Mas Danang
    text: Krama inggil kanggo wong liya sing diajeni. Panjenengan, dhahar.
    ar_eg: الكراما إنجيل للناس اللي بتحترمهم أوي. سيادتك، يتفضّل ياكل.
    ar: الكراما إنغيل لمن تجلّهم. سيادتك، يتناول الطعام.
    en: Krama inggil is for others you honour. Panjenengan, dhahar.
  - speaker: Mbak Sekar
    text: Lan krama andhap kanggo ngasorake awake dhewe. Contone "matur", ngomong marang wong luhur.
    ar_eg: والكراما أنداپ عشان تواضع نفسك. زي «matur»، تكلّم حدّ أعلى منك.
    ar: 'والكراما أنداب لتتواضع بنفسك، مثل «matur»: تكلّم من هو أعلى منك.'
    en: And krama andhap lowers yourself. Like "matur", to speak to someone above you.
    note:
      ar_eg: 'أربع درجات، بس ماتتخضّش: أهمّ حاجة دلوقتي تعرف تختار. صاحب = نجوكو، غريب = كراما، كبير محترم = كراما إنجيل ليه.'
      ar: 'أربع درجات، لكن لا تفزع: الأهمّ الآن أن تعرف الاختيار. صديق = نغوكو، غريب = كراما، كبير مُجَلّ = كراما إنغيل له.'
      en: 'Four levels, but don''t panic: what matters now is choosing. Friend = ngoko, stranger = krama, honoured elder = krama inggil for them.'
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Kowe wis mangan?
    ar_eg: انت كلت؟
    ar: هل أكلت؟
    en: Have you eaten? (ngoko)
  - speaker: Mas Danang
    text: Kowe wis mangan?
    ar_eg: انت كلت؟
    ar: هل أكلت؟
    en: Have you eaten? (ngoko)
  - speaker: Mbak Sekar
    text: Sampeyan sampun nedha?
    ar_eg: حضرتك كلت؟
    ar: هل أكلت حضرتك؟
    en: Have you eaten? (krama)
  - speaker: Mas Danang
    text: Sampeyan sampun nedha?
    ar_eg: حضرتك كلت؟
    ar: هل أكلت حضرتك؟
    en: Have you eaten? (krama)
  - speaker: Mbak Sekar
    text: Panjenengan sampun dhahar?
    ar_eg: سيادتك اتغدّيت؟
    ar: هل تناولت سيادتك الطعام؟
    en: Have you eaten? (krama inggil)
  - speaker: Mas Danang
    text: Panjenengan sampun dhahar?
    ar_eg: سيادتك اتغدّيت؟
    ar: هل تناولت سيادتك الطعام؟
    en: Have you eaten? (krama inggil)
  - speaker: Mbak Sekar
    text: Kula sampun nedha.
    ar_eg: أنا كلت.
    ar: لقد أكلت.
    en: I have eaten. (krama)
  - speaker: Mas Danang
    text: Kula sampun nedha.
    ar_eg: أنا كلت.
    ar: لقد أكلت.
    en: I have eaten. (krama)
  - speaker: Mbak Sekar
    text: Sugeng rawuh ing Solo.
    ar_eg: أهلًا بيك في سولو.
    ar: مرحبًا بك في سولو.
    en: Welcome to Solo.
  - speaker: Mas Danang
    text: Sugeng rawuh ing Solo.
    ar_eg: أهلًا بيك في سولو.
    ar: مرحبًا بك في سولو.
    en: Welcome to Solo.
- kind: outro
  title: Sapa, basa apa?
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki pilihen basane. Kancamu, bakul ing stasiun, lan bapake kancamu. Takona "wis mangan?"
    ar_eg: يا ماس محمد، دلوقتي اختار المستوى. صاحبك، والبيّاع في المحطّة، وأبو صاحبك. اسأل «كلت؟»
    ar: يا ماس محمد، اختر المستوى الآن. صديقك، وبائع المحطّة، ووالد صديقك. اسأل «هل أكلت؟»
    en: Mas Mohamed, now choose the level. Your friend, the station seller, your friend's father. Ask "have you eaten?"
    note:
      ar_eg: دورك! تلات جمل لتلات أشخاص. وجرّب «Respect Meter» في الدرس.
      ar: دورك! ثلاث جمل لثلاثة أشخاص. وجرّب «Respect Meter» في الدرس.
      en: Your turn! Three sentences for three people. And try the Respect Meter in the lesson.
  - speaker: Mas Danang
    text: Aja wedi salah. Wong Solo seneng banget yen tamu nyoba krama, senajan sithik.
    ar_eg: ماتخافش تغلط. أهل سولو بيفرحوا أوي لو الضيف جرّب الكراما، حتى لو شويّة.
    ar: لا تخف من الخطأ. يفرح أهل سولو كثيرًا حين يجرّب الضيف الكراما ولو قليلًا.
    en: Don't be afraid to get it wrong. Solo people love it when a guest tries krama, even a little.
  - speaker: Mbak Sekar
    text: PR-mu, gawe tabel cilik. Ngoko, krama, krama inggil, kanggo "wis mangan".
    ar_eg: واجبك، اعمل جدول صغيّر. نجوكو، كراما، كراما إنجيل، لـ«كلت».
    ar: 'واجبك: اصنع جدولًا صغيرًا: نغوكو، كراما، كراما إنغيل، لـ«هل أكلت».'
    en: 'Your homework: make a little table. Ngoko, krama, krama inggil, for "have you eaten".'
  - speaker: Mas Danang
    text: Sesuk kita nang Pasar Gede. Nganti pinanggih malih, eh, nganti ketemu!
    ar_eg: بكرة رايحين باسار جيدي. إلى اللقاء... قصدي نتقابل!
    ar: غدًا نذهب إلى باسار غيدي. إلى اللقاء!
    en: Tomorrow we go to Pasar Gede. Until we meet again - er, see you!
    note:
      ar_eg: «nganti pinanggih malih» = «إلى أن نلتقي» بالكراما. دانانج بيتعلّم!
      ar: «nganti pinanggih malih» = «حتى نلتقي» بالكراما. دانانغ يتعلّم!
      en: '"Nganti pinanggih malih" = "until we meet again" in krama. Danang is learning!'
