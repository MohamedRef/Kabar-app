title:
  target: Pasar Klewer
  ar_eg: سوق كليوير
  ar: سوق كليوير
  en: Shopping in krama
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pasar Klewer
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saking Pasar Klewer! Pasar batik ingkang ageng piyambak ing Jawa. Kula Sekar.
    ar_eg: صباح الخير من باسار كليوير! أكبر سوق باتيك في جاوة. أنا سيكار.
    ar: صباح الخير من باسار كليوير! أكبر سوق باتيك في جاوة. أنا سيكار.
    en: Good morning from Pasar Klewer! The biggest batik market in Java. I'm Sekar.
  - speaker: Mas Galih
    text: Kula Galih. Batik ing endi-endi! Abang, biru, coklat, ireng. Mripatku mumet, hehe.
    ar_eg: أنا جاليه. باتيك في كل حتّة! أحمر، أزرق، بنّي، أسود. عينيّا دايخة، هههه.
    ar: أنا غاليه. باتيك في كلّ مكان! أحمر وأزرق وبنّي وأسود. عيناي دائختان، هههه.
    en: I'm Galih. Batik everywhere! Red, blue, brown, black. My eyes are spinning, hehe.
  - speaker: Mbak Sekar
    text: Dina iki kita sinau angka krama, lan nawa kanthi alus marang bakul sepuh.
    ar_eg: النهارده هنتعلّم الأرقام بالكراما، والفِصال بأدب مع البيّاعين الكبار.
    ar: اليوم نتعلّم الأعداد بالكراما والمساومة بلطف مع الباعة المسنّين.
    en: Today we learn krama numbers, and polite bargaining with older sellers.
  - speaker: Mas Galih
    text: Bakul ing kene seneng yen tamu ngomong krama, senajan sithik. Bisa entuk rega luwih mirah!
    ar_eg: البيّاعين هنا بيفرحوا لو الضيف اتكلّم كراما، حتى شويّة. ممكن تاخد سعر أرخص!
    ar: يفرح الباعة هنا إن تكلّم الضيف الكراما ولو قليلًا، وقد تنال سعرًا أرخص!
    en: Sellers here love it when guests speak krama, even a little. You might get a cheaper price!
- kind: dialogue
  title: Tumbas kain batik
  lines:
  - speaker: Mas Galih
    text: Sekar, sampeyan bakul sepuh. Kula ingkang tumbas.
    ar_eg: يا سيكار، انتي البيّاعة الكبيرة. أنا الزبون.
    ar: يا سيكار، أنتِ البائعة المسنّة وأنا المشتري.
    en: Sekar, you're the elderly seller. I'm buying.
  - speaker: Mbak Sekar
    text: Monggo, Mas, dipun pilih. Kain batik sae-sae.
    ar_eg: اتفضّل يا ماس، اختار. قماش باتيك حلو.
    ar: تفضّل يا ماس، اختر. أقمشة باتيك جميلة.
    en: Please, Mas, take your pick. Lovely batik cloth.
  - speaker: Mas Galih
    text: Nyuwun sewu, Bu. Kain ingkang coklat menika reginipun pinten?
    ar_eg: لا مؤاخذة يا ست. القماش البنّي ده سعره كام؟
    ar: عذرًا يا سيّدتي. بكم هذا القماش البنّي؟
    en: Excuse me, Bu. How much is this brown cloth?
  - speaker: Mbak Sekar
    text: Menika batik Solo asli, Mas. Setunggal kain, satus seket ewu.
    ar_eg: ده باتيك سولو أصلي يا ماس. القطعة بميّة وخمسين ألف.
    ar: هذا باتيك سولو أصيل يا ماس. القطعة بمئة وخمسين ألفًا.
    en: This is real Solo batik, Mas. A hundred and fifty thousand a piece.
  - speaker: Mas Galih
    text: Wah, awis sanget, Bu. Menawi kalih, pinten?
    ar_eg: يا ساتر، غالي أوي يا ست. لو اتنين، بكام؟
    ar: آه، غالٍ جدًّا يا سيّدتي. وإن أخذت اثنين فبكم؟
    en: Oh, that's very pricey, Bu. If I take two, how much?
    note:
      ar_eg: 'awis = غالي بالكراما (ngoko: larang). mirah = رخيص (ngoko: murah).'
      ar: 'awis = غالٍ بالكراما (نغوكو: larang)، وmirah = رخيص (نغوكو: murah).'
      en: Awis = expensive in krama (ngoko larang). Mirah = cheap (ngoko murah).
  - speaker: Mbak Sekar
    text: Kalih, kalih atus sedasa ewu mawon, Mas.
    ar_eg: اتنين، بميتين وعشرة آلاف بس يا ماس.
    ar: اثنتان بمئتين وعشرة آلاف فقط يا ماس.
    en: Two, just two hundred and ten thousand, Mas.
  - speaker: Mas Galih
    text: Menawi kalih atus ewu, angsal, Bu? Kangge ibu kalih mbakyu kula.
    ar_eg: لو ميتين ألف، ينفع يا ست؟ عشان أمّي وأختي الكبيرة.
    ar: إن كان مئتي ألف، هل يجوز يا سيّدتي؟ لأمّي وأختي الكبرى.
    en: Would two hundred thousand be all right, Bu? It's for my mother and big sister.
  - speaker: Mbak Sekar
    text: Hmm... nggih sampun, Mas. Kangge ibu sampeyan. Kalih atus ewu.
    ar_eg: هممم... خلاص يا ماس. عشان والدتك. ميتين ألف.
    ar: هممم... حسنًا يا ماس. لأجل والدتك. مئتا ألف.
    en: Hmm... all right, Mas. For your mother. Two hundred thousand.
  - speaker: Mas Galih
    text: Matur nuwun sanget, Bu. Mugi-mugi laris!
    ar_eg: متشكّر أوي يا ست. ربنا يكرمك ويكتّر البيع!
    ar: شكرًا جزيلًا يا سيّدتي. عسى أن يكثر بيعك!
    en: Thank you very much, Bu. May your sales go well!
  - speaker: Mbak Sekar
    text: Amin. Sami-sami, Mas. Mugi ibu sampeyan remen.
    ar_eg: آمين. العفو يا ماس. يا ربّ والدتك تحبّه.
    ar: آمين. عفوًا يا ماس. عسى أن تحبّه والدتك.
    en: Amen. You're welcome, Mas. I hope your mother likes it.
  - speaker: Mbak Sekar
    text: Mas Mohamed, nawa kanthi alus iku kunci. Ora ngomong "larang!", nanging "awis sanget, Bu" karo mesem.
    ar_eg: يا ماس محمد، الفِصال بأدب هو السرّ. متقولش «غالي!»، قول «awis sanget, Bu» وانت مبتسم.
    ar: يا ماس محمد، المساومة بلطف هي المفتاح. لا تقل «غالٍ!» بل «awis sanget, Bu» مع ابتسامة.
    en: Mas Mohamed, polite bargaining is the key. Don't say "larang!", say "awis sanget, Bu" with a smile.
- kind: word_spotlight
  title: Setunggal, kalih, tiga
  lines:
  - speaker: Mas Galih
    text: Siji, loro, telu dadi setunggal, kalih, tiga.
    ar_eg: siji وloro وtelu يبقوا setunggal وkalih وtiga.
    ar: siji وloro وtelu تصير setunggal وkalih وtiga.
    en: Siji, loro, telu become setunggal, kalih, tiga.
  - speaker: Mbak Sekar
    text: Papat dadi sekawan. Lima dadi gangsal. Enem, pitu, wolu, sanga padha. Sepuluh dadi sedasa.
    ar_eg: papat تبقى sekawan. lima تبقى gangsal. ستّة وسبعة وتمانية وتسعة زي ما هم. عشرة تبقى sedasa.
    ar: papat تصير sekawan، وlima تصير gangsal، والستّة إلى التسعة كما هي، وsepuluh تصير sedasa.
    en: Papat becomes sekawan. Lima becomes gangsal. Six to nine stay the same. Sepuluh becomes sedasa.
    note:
      ar_eg: 'الأرقام اللي بتتغيّر: 1، 2، 4، 5، 10. ومنها: kalih dasa = عشرين، sekawan dasa = أربعين، kalih atus = ميتين.'
      ar: 'الأعداد التي تتغيّر: 1 و2 و4 و5 و10. ومنها kalih dasa = عشرون، وsekawan dasa = أربعون، وkalih atus = مئتان.'
      en: 'The ones that change: 1, 2, 4, 5, 10. From them: kalih dasa = twenty, sekawan dasa = forty, kalih atus = two hundred.'
  - speaker: Mas Galih
    text: Rega dadi regi. Tuku dadi tumbas. Larang dadi awis, murah dadi mirah.
    ar_eg: rega تبقى regi. tuku تبقى tumbas. larang تبقى awis، murah تبقى mirah.
    ar: rega تصير regi، وtuku تصير tumbas، وlarang تصير awis، وmurah تصير mirah.
    en: Rega becomes regi. Tuku becomes tumbas. Larang becomes awis, murah becomes mirah.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Reginipun pinten, Bu?
    ar_eg: سعره كام يا ست؟
    ar: بكم سعره يا سيّدتي؟
    en: How much is it, Bu?
  - speaker: Mas Galih
    text: Reginipun pinten, Bu?
    ar_eg: سعره كام يا ست؟
    ar: بكم سعره يا سيّدتي؟
    en: How much is it, Bu?
  - speaker: Mbak Sekar
    text: Awis sanget, Bu.
    ar_eg: غالي أوي يا ست.
    ar: غالٍ جدًّا يا سيّدتي.
    en: It's very pricey, Bu.
  - speaker: Mas Galih
    text: Awis sanget, Bu.
    ar_eg: غالي أوي يا ست.
    ar: غالٍ جدًّا يا سيّدتي.
    en: It's very pricey, Bu.
  - speaker: Mbak Sekar
    text: Menawi kalih, pinten?
    ar_eg: لو اتنين، بكام؟
    ar: وإن كانا اثنين فبكم؟
    en: If two, how much?
  - speaker: Mas Galih
    text: Menawi kalih, pinten?
    ar_eg: لو اتنين، بكام؟
    ar: وإن كانا اثنين فبكم؟
    en: If two, how much?
  - speaker: Mbak Sekar
    text: Kalih atus ewu, angsal?
    ar_eg: ميتين ألف، ينفع؟
    ar: مئتا ألف، هل يجوز؟
    en: Two hundred thousand, okay?
  - speaker: Mas Galih
    text: Kalih atus ewu, angsal?
    ar_eg: ميتين ألف، ينفع؟
    ar: مئتا ألف، هل يجوز؟
    en: Two hundred thousand, okay?
  - speaker: Mbak Sekar
    text: Mugi-mugi laris!
    ar_eg: ربنا يكتّر البيع!
    ar: عسى أن يكثر البيع!
    en: May your sales go well!
  - speaker: Mas Galih
    text: Mugi-mugi laris!
    ar_eg: ربنا يكتّر البيع!
    ar: عسى أن يكثر البيع!
    en: May your sales go well!
  - speaker: Mbak Sekar
    text: Setunggal, kalih, tiga, sekawan, gangsal.
    ar_eg: واحد، اتنين، تلاتة، أربعة، خمسة.
    ar: واحد، اثنان، ثلاثة، أربعة، خمسة.
    en: One, two, three, four, five.
  - speaker: Mas Galih
    text: Setunggal, kalih, tiga, sekawan, gangsal.
    ar_eg: واحد، اتنين، تلاتة، أربعة، خمسة.
    ar: واحد، اثنان، ثلاثة، أربعة، خمسة.
    en: One, two, three, four, five.
- kind: outro
  title: Tumbasane Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki tawanen kain batik nganggo krama. Regane satus wolung dasa ewu.
    ar_eg: يا ماس محمد، دلوقتي فاصل على قماش باتيك بالكراما. سعره ميّة وتمانين ألف.
    ar: يا ماس محمد، ساوِم الآن على قماش باتيك بالكراما. سعره مئة وثمانون ألفًا.
    en: Mas Mohamed, now bargain for batik in krama. It's a hundred and eighty thousand.
    note:
      ar_eg: دورك! استخدم awis وmenawi وangsal، وقول الأرقام بالكراما.
      ar: دورك! استعمل awis وmenawi وangsal، وقل الأعداد بالكراما.
      en: Your turn! Use awis, menawi and angsal, and say the numbers in krama.
  - speaker: Mas Galih
    text: 'Contone: Awis sanget, Bu. Menawi satus gangsal dasa ewu, angsal?'
    ar_eg: 'مثلًا: غالي أوي يا ست. لو بميّة وخمسين ألف، ينفع؟'
    ar: 'مثلًا: غالٍ جدًّا يا سيّدتي. هل يجوز بمئة وخمسين ألفًا؟'
    en: 'For example: It''s very pricey, Bu. Would a hundred and fifty thousand be all right?'
  - speaker: Mbak Sekar
    text: PR-mu, wacanen daftar regi ing pelajaran, lan wacanen angkane nganggo krama.
    ar_eg: واجبك، اقرا قايمة الأسعار في الدرس، واقرا الأرقام بالكراما.
    ar: 'واجبك: اقرأ قائمة الأسعار في الدرس واقرأ أعدادها بالكراما.'
    en: 'Your homework: read the price list in the lesson, reading the numbers in krama.'
  - speaker: Mas Galih
    text: Sesuk kita nang Laweyan, kampung juragan batik. Nganti pinanggih malih!
    ar_eg: بكرة رايحين لاويان، حيّ تجّار الباتيك. إلى اللقاء!
    ar: غدًا نذهب إلى لاوييان، حيّ تجّار الباتيك. إلى اللقاء!
    en: Tomorrow we go to Laweyan, the batik merchants' quarter. Until next time!
