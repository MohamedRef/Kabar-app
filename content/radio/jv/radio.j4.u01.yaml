language: jv
level: j4
unit: j4.u01
title:
  target: Krama inggil (kriya)
  ar_eg: أفعال التكريم
  ar: أفعال التبجيل
  en: Honorific verbs
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Tugu Yogyakarta
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saking Tugu Yogyakarta! Kula Sekar. Sugeng rawuh wonten Ngayogyakarta.
    ar_eg: صباح الخير من نصب توجو في يوجياكارتا! أنا سيكار. أهلًا بيكم في يوجياكارتا.
    ar: صباح الخير من نصب توغو في يوغياكارتا! أنا سيكار. مرحبًا بكم في يوغياكارتا.
    en: Good morning from the Tugu monument, Yogyakarta! I'm Sekar. Welcome to Yogyakarta.
    note:
      ar_eg: Tugu = عمود أبيض في نصّ تقاطع، رمز يوجيا. بيقولوا اللي يبوس... لأ، اللي يلمسه هيرجع يوجيا تاني!
      ar: Tugu = عمود أبيض وسط تقاطع، رمز يوغيا. ويُقال إنّ من يلمسه يعود إلى يوغيا!
      en: The Tugu is a white column in the middle of a crossroads, Yogya's symbol. They say whoever touches it will come back to Yogya!
  - speaker: Mas Danang
    text: Kula Danang. Ing Yogya, krama-ne luwih jero. Saiki kita sinau krama inggil kanggo kriya.
    ar_eg: أنا دانانج. في يوجيا الكراما أعمق. دلوقتي هنتعلّم الكراما إنجيل للأفعال.
    ar: أنا دانانغ. في يوغيا الكراما أعمق. والآن نتعلّم الكراما إنغيل للأفعال.
    en: I'm Danang. In Yogya the krama runs deeper. Now we learn krama inggil for verbs.
  - speaker: Mbak Sekar
    text: Kriya kanggo ngajeni wong liya. Dhahar, tindak, sare, rawuh, kondur, ngendika.
    ar_eg: أفعال عشان تكرّم غيرك. يتفضّل ياكل، يتفضّل يروح، ينام، يشرّف، يرجع، يتفضّل يقول.
    ar: أفعال لتكريم الآخرين. يتناول، يذهب، ينام، يحضر، يعود، يقول.
    en: Verbs to honour others. Dhahar, tindak, sare, rawuh, kondur, ngendika.
  - speaker: Mas Danang
    text: Lan aturan siji sing paling penting. Iki kanggo wong liya, ora kanggo awake dhewe!
    ar_eg: وقاعدة واحدة هي الأهمّ. دي للناس التانية، مش لنفسك!
    ar: 'وقاعدة واحدة هي الأهمّ: هذه للآخرين لا لنفسك!'
    en: And the one most important rule. These are for others, never for yourself!
- kind: dialogue
  title: Tamu ing griyanipun Bu Harsono
  lines:
  - speaker: Mas Danang
    text: Sekar, sampeyan Bu Harsono, kula tamu enom saking Mesir.
    ar_eg: يا سيكار، انتي بو هارسونو، وأنا الضيف الشاب من مصر.
    ar: يا سيكار، أنتِ بو هارسونو وأنا الضيف الشابّ من مصر.
    en: Sekar, you're Bu Harsono, I'm the young guest from Egypt.
  - speaker: Mbak Sekar
    text: Monggo pinarak, Nak. Sampun dhahar?
    ar_eg: اتفضّل اقعد يا ابني. اتغدّيت؟
    ar: تفضّل اجلس يا بنيّ. هل أكلت؟
    en: Please sit, my boy. Have you eaten?
  - speaker: Mas Danang
    text: Sampun, Bu. Kula sampun nedha wonten hotel. Panjenengan sampun dhahar?
    ar_eg: أيوه يا ست. أنا كلت في الفندق. وحضرتك اتغدّيتي؟
    ar: نعم يا سيّدتي. أكلت في الفندق. وهل أكلتِ حضرتك؟
    en: Yes, Bu. I ate at the hotel. Have you eaten?
    note:
      ar_eg: 'شوف: لنفسه قال nedha (كراما عادي)، ولبو هارسونو قال dhahar (كراما إنجيل). ده بالظبط الصحّ.'
      ar: 'لاحظ: قال لنفسه nedha (كراما عادية)، ولبو هارسونو dhahar (كراما إنغيل). هذا هو الصواب تمامًا.'
      en: 'Notice: for himself he said nedha (plain krama), for Bu Harsono dhahar (krama inggil). Exactly right.'
  - speaker: Mbak Sekar
    text: Dereng, Nak. Mangke menawi Bapak sampun kondur.
    ar_eg: لسّه يا ابني. بعدين لمّا الحاج يرجع.
    ar: ليس بعد يا بنيّ. لاحقًا حين يعود الأستاذ.
    en: Not yet, my boy. Later, once Bapak comes home.
  - speaker: Mas Danang
    text: Bapak tindak pundi, Bu?
    ar_eg: الأستاذ راح فين يا ست؟
    ar: إلى أين ذهب الأستاذ يا سيّدتي؟
    en: Where did Bapak go, Bu?
  - speaker: Mbak Sekar
    text: Bapak tindak dhateng masjid. Sakedhap malih rawuh.
    ar_eg: راح الجامع. شويّة وييجي.
    ar: ذهب إلى المسجد. سيعود بعد قليل.
    en: He's gone to the mosque. He'll be here shortly.
  - speaker: Mas Danang
    text: Menawi Bapak sampun rawuh, kula badhe matur bab Kraton.
    ar_eg: لمّا ييجي، عايز أكلّمه عن القصر.
    ar: حين يصل، أودّ أن أكلّمه عن القصر.
    en: When he arrives, I'd like to talk to him about the Kraton.
  - speaker: Mbak Sekar
    text: Sae, Nak. Bapak remen sanget ngendika bab Kraton.
    ar_eg: حلو يا ابني. الأستاذ بيحبّ أوي يتكلّم عن القصر.
    ar: جميل يا بنيّ. يحبّ الأستاذ كثيرًا الحديث عن القصر.
    en: Good, my boy. Bapak loves talking about the Kraton.
  - speaker: Mas Danang
    text: Lan Simbah? Taksih sare?
    ar_eg: وجدّتي؟ لسّه نايمة؟
    ar: والجدّة؟ ما زالت نائمة؟
    en: And grandma? Still asleep?
  - speaker: Mbak Sekar
    text: Sampun wungu, Nak. Simbah sampun siram, sakmenika wonten wingking.
    ar_eg: صحيت يا ابني. استحمّت، ودلوقتي ورا.
    ar: استيقظت يا بنيّ. واستحمّت، وهي الآن في الخلف.
    en: She's up, my boy. She's bathed and is out the back now.
    note:
      ar_eg: wungu = يصحى، siram = يستحمّى، sare = ينام - كلّهم كراما إنجيل للكبار.
      ar: wungu = يستيقظ، وsiram = يستحمّ، وsare = ينام - كلّها كراما إنغيل للكبار.
      en: Wungu = wake up, siram = bathe, sare = sleep - all krama inggil for elders.
  - speaker: Mas Danang
    text: Kula badhe sowan Simbah, Bu.
    ar_eg: أنا عايز أسلّم على جدّتي يا ست.
    ar: أودّ أن أزور الجدّة يا سيّدتي.
    en: I'd like to pay my respects to grandma, Bu.
- kind: word_spotlight
  title: Dhahar, tindak, rawuh
  lines:
  - speaker: Mbak Sekar
    text: 'Mangan: kanggo awake dhewe nedha, kanggo wong liya dhahar.'
    ar_eg: 'ياكل: لنفسك nedha، لغيرك dhahar.'
    ar: 'يأكل: لنفسك nedha، ولغيرك dhahar.'
    en: 'Eat: for yourself nedha, for others dhahar.'
  - speaker: Mas Danang
    text: 'Lunga: kanggo awake dhewe kesah, kanggo wong liya tindak.'
    ar_eg: 'يروح: لنفسك kesah، لغيرك tindak.'
    ar: 'يذهب: لنفسك kesah، ولغيرك tindak.'
    en: 'Go: for yourself kesah, for others tindak.'
  - speaker: Mbak Sekar
    text: Teka dadi rawuh. Mulih dadi kondur. Turu dadi sare. Ngomong dadi ngendika.
    ar_eg: ييجي تبقى rawuh. يروّح تبقى kondur. ينام تبقى sare. يقول تبقى ngendika.
    ar: يأتي تصير rawuh، ويعود kondur، وينام sare، ويقول ngendika.
    en: Come becomes rawuh. Go home becomes kondur. Sleep becomes sare. Say becomes ngendika.
    note:
      ar_eg: 'غلطة الأجانب المشهورة: «kula dhahar» (أنا اتفضّلت أكلت). زي ما تقول عن نفسك «سيادتي».'
      ar: 'خطأ الأجانب الشهير: «kula dhahar»، كأن تقول عن نفسك «سيادتي تفضّلت».'
      en: 'The classic foreigner''s mistake: "kula dhahar", like calling yourself "my excellency".'
  - speaker: Mas Danang
    text: 'Lan ngombe: kanggo wong liya ngunjuk. Panjenengan badhe ngunjuk menapa?'
    ar_eg: 'ويشرب: لغيرك ngunjuk. حضرتك تشرب إيه؟'
    ar: 'ويشرب: لغيرك ngunjuk. ماذا تشرب حضرتك؟'
    en: 'And drink: for others, ngunjuk. What would you like to drink?'
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Panjenengan sampun dhahar?
    ar_eg: حضرتك اتغدّيت؟
    ar: هل تناولت حضرتك الطعام؟
    en: Have you eaten? (to an elder)
  - speaker: Mas Danang
    text: Panjenengan sampun dhahar?
    ar_eg: حضرتك اتغدّيت؟
    ar: هل تناولت حضرتك الطعام؟
    en: Have you eaten? (to an elder)
  - speaker: Mbak Sekar
    text: Kula sampun nedha.
    ar_eg: أنا كلت.
    ar: لقد أكلت.
    en: I've eaten.
  - speaker: Mas Danang
    text: Kula sampun nedha.
    ar_eg: أنا كلت.
    ar: لقد أكلت.
    en: I've eaten.
  - speaker: Mbak Sekar
    text: Bapak tindak dhateng masjid.
    ar_eg: الأستاذ راح الجامع.
    ar: ذهب الأستاذ إلى المسجد.
    en: Bapak has gone to the mosque.
  - speaker: Mas Danang
    text: Bapak tindak dhateng masjid.
    ar_eg: الأستاذ راح الجامع.
    ar: ذهب الأستاذ إلى المسجد.
    en: Bapak has gone to the mosque.
  - speaker: Mbak Sekar
    text: Bapak sakedhap malih rawuh.
    ar_eg: الأستاذ شويّة وييجي.
    ar: سيحضر الأستاذ بعد قليل.
    en: Bapak will be here shortly.
  - speaker: Mas Danang
    text: Bapak sakedhap malih rawuh.
    ar_eg: الأستاذ شويّة وييجي.
    ar: سيحضر الأستاذ بعد قليل.
    en: Bapak will be here shortly.
  - speaker: Mbak Sekar
    text: Simbah taksih sare?
    ar_eg: جدّتي لسّه نايمة؟
    ar: هل ما زالت الجدّة نائمة؟
    en: Is grandma still asleep?
  - speaker: Mas Danang
    text: Simbah taksih sare?
    ar_eg: جدّتي لسّه نايمة؟
    ar: هل ما زالت الجدّة نائمة؟
    en: Is grandma still asleep?
  - speaker: Mbak Sekar
    text: Panjenengan badhe ngunjuk menapa?
    ar_eg: حضرتك تشرب إيه؟
    ar: ماذا تشرب حضرتك؟
    en: What would you like to drink?
  - speaker: Mas Danang
    text: Panjenengan badhe ngunjuk menapa?
    ar_eg: حضرتك تشرب إيه؟
    ar: ماذا تشرب حضرتك؟
    en: What would you like to drink?
  - speaker: Mbak Sekar
    text: 'Lan eling, wangsulane kanggo awake dhewe: Kula badhe ngombe teh, dudu ngunjuk teh.'
    ar_eg: 'وافتكر، الردّ عن نفسك: أنا هشرب شاي بـngombe، مش ngunjuk.'
    ar: 'وتذكّر أنّ الجواب عن نفسك: سأشرب شايًا بـngombe لا ngunjuk.'
    en: 'And remember, answering for yourself: Kula badhe ngombe teh, not ngunjuk teh.'
- kind: outro
  title: Pitakon kanggo wong sepuh
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, takona simbahe kancamu. Sampun dhahar? Badhe tindak pundi? Sampun sare?
    ar_eg: يا ماس محمد، اسأل جدّة صاحبك. اتغدّيتي؟ رايحة فين؟ نمتي؟
    ar: يا ماس محمد، اسأل جدّة صديقك. هل أكلتِ؟ إلى أين تذهبين؟ هل نمتِ؟
    en: Mas Mohamed, ask your friend's grandmother. Eaten? Going where? Slept?
    note:
      ar_eg: 'دورك! وبعدين ردّ عن نفسك من غير كراما إنجيل: Kula sampun nedha.'
      ar: 'دورك! ثمّ أجب عن نفسك بلا كراما إنغيل: Kula sampun nedha.'
      en: 'Your turn! Then answer about yourself without krama inggil: Kula sampun nedha.'
  - speaker: Mbak Sekar
    text: 'Contone: Mbah, panjenengan sampun dhahar? Badhe tindak pundi?'
    ar_eg: 'مثلًا: يا جدّتي، حضرتك اتغدّيتي؟ رايحة فين؟'
    ar: 'مثلًا: يا جدّتي، هل أكلتِ؟ إلى أين تذهبين؟'
    en: 'For example: Mbah, have you eaten? Where are you going?'
  - speaker: Mas Danang
    text: PR-mu, wacanen pesen saking Bu Harsono ing pelajaran, lan tandhai tembung krama inggil.
    ar_eg: واجبك، اقرا رسالة بو هارسونو في الدرس، وعلّم كلمات الكراما إنجيل.
    ar: 'واجبك: اقرأ رسالة بو هارسونو في الدرس وعلّم كلمات الكراما إنغيل.'
    en: 'Your homework: read Bu Harsono''s message in the lesson and mark the krama inggil words.'
  - speaker: Mbak Sekar
    text: Sesuk kita dhateng Malioboro. Nganti pinanggih malih!
    ar_eg: بكرة رايحين ماليوبورو. إلى اللقاء!
    ar: غدًا نذهب إلى ماليوبورو. إلى اللقاء!
    en: Tomorrow we go to Malioboro. Until next time!
