title:
  target: Tembung krama
  ar_eg: كلمات الكراما
  ar: كلمات الكراما
  en: Core krama words
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Kampung Batik Kauman
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saking Kauman! Kampung iki cedhak Masjid Agung Solo. Kula Sekar.
    ar_eg: صباح الخير من كاومان! القرية دي جنب الجامع الكبير في سولو. أنا سيكار.
    ar: صباح الخير من كاومان! هذه القرية قرب المسجد الكبير في سولو. أنا سيكار.
    en: Good morning from Kauman! This quarter is next to Solo's Grand Mosque. I'm Sekar.
    note:
      ar_eg: كاومان كانت حيّ موظّفي الجامع الكبير الدينيين، ودلوقتي مشهورة بالباتيك.
      ar: كانت كاومان حيّ موظّفي المسجد الكبير الدينيّين، وهي الآن مشهورة بالباتيك.
      en: Kauman was the quarter of the Grand Mosque's religious officials, and is now famous for batik.
  - speaker: Mas Galih
    text: Kula Galih. Ing kene, saben omah ana batike. Ambune malam lan pewarna.
    ar_eg: أنا جاليه. هنا كل بيت فيه باتيك. ريحة الشمع والصبغة.
    ar: أنا غاليه. هنا في كلّ بيت باتيك. رائحة الشمع والصبغة.
    en: I'm Galih. Here every house has batik. The smell of wax and dye.
  - speaker: Mbak Sekar
    text: Dina iki kita sinau tembung-tembung krama sing paling penting. Sampun, dereng, badhe, mboten, wonten.
    ar_eg: النهارده هنتعلّم أهمّ كلمات الكراما. sampun، dereng، badhe، mboten، wonten.
    ar: اليوم نتعلّم أهمّ كلمات الكراما. sampun وdereng وbadhe وmboten وwonten.
    en: Today we learn the most important krama words. Sampun, dereng, badhe, mboten, wonten.
  - speaker: Mas Galih
    text: Mas Mohamed, yen ngerti tembung iki, separo krama wis rampung!
    ar_eg: يا ماس محمد، لو عرفت الكلمات دي، نصّ الكراما خلص!
    ar: يا ماس محمد، إن عرفت هذه الكلمات فنصف الكراما منجز!
    en: Mas Mohamed, if you know these words, half of krama is done!
- kind: dialogue
  title: Ing toko batik
  lines:
  - speaker: Mas Galih
    text: Sekar, sampeyan sing gadhah toko batik. Kula tamu.
    ar_eg: يا سيكار، انتي صاحبة محلّ الباتيك. وأنا الزبون.
    ar: يا سيكار، أنتِ صاحبة محلّ الباتيك وأنا الزبون.
    en: Sekar, you own the batik shop. I'm the customer.
  - speaker: Mbak Sekar
    text: Monggo, Mas, pinarak. Badhe pados menapa?
    ar_eg: اتفضّل يا ماس، اقعد. بتدوّر على إيه؟
    ar: تفضّل يا ماس، اجلس. عمّ تبحث؟
    en: Please come in and sit, Mas. What are you looking for?
  - speaker: Mas Galih
    text: Kula badhe tumbas batik kangge ibu kula. Wonten ingkang biru?
    ar_eg: عايز أشتري باتيك لأمّي. فيه أزرق؟
    ar: أريد شراء باتيك لأمّي. هل يوجد أزرق؟
    en: I'd like to buy batik for my mother. Is there a blue one?
  - speaker: Mbak Sekar
    text: Wonten, Mas. Menika biru, motif parang. Sampun nate mirsani motif menika?
    ar_eg: فيه يا ماس. ده أزرق، نقشة «parang». شفت النقشة دي قبل كده؟
    ar: يوجد يا ماس. هذا أزرق بنقش «parang». هل رأيت هذا النقش من قبل؟
    en: There is, Mas. This is blue, the parang pattern. Have you seen this pattern before?
    note:
      ar_eg: parang = نقشة باتيك مايلة زي الموج أو السيف، من أقدم النقشات وأشهرها.
      ar: parang = نقش باتيك مائل كالموج أو السيف، من أقدم النقوش وأشهرها.
      en: Parang = a diagonal batik pattern like waves or blades, one of the oldest and best known.
  - speaker: Mas Galih
    text: Dereng, Bu. Menika batik tulis menapa batik cap?
    ar_eg: لسّه يا ست. ده باتيك مرسوم بالإيد ولّا مطبوع بالختم؟
    ar: ليس بعد يا سيّدتي. هل هذا باتيك مرسوم باليد أم مطبوع بالختم؟
    en: Not yet, Bu. Is this hand-drawn batik or stamped batik?
  - speaker: Mbak Sekar
    text: Menika batik tulis. Damelipun sasi kalih.
    ar_eg: ده باتيك مرسوم. اتعمل في شهرين.
    ar: هذا باتيك مرسوم، صُنع في شهرين.
    en: This is hand-drawn. It took two months to make.
    note:
      ar_eg: batik tulis = مرسوم بالإيد بأداة اسمها canting، وغالي. batik cap = مطبوع بختم نحاس، أرخص وأسرع.
      ar: batik tulis = مرسوم باليد بأداة canting، وغالٍ. وbatik cap = مطبوع بختم نحاسيّ، أرخص وأسرع.
      en: Batik tulis = hand-drawn with a canting tool, pricey. Batik cap = stamped with a copper block, cheaper and faster.
  - speaker: Mas Galih
    text: Wah, sae sanget. Nanging kula mboten gadhah arta kathah.
    ar_eg: يا سلام، حلو أوي. بس أنا معيش فلوس كتير.
    ar: رائع جدًّا. لكن ليس معي مال كثير.
    en: Wow, it's beautiful. But I don't have much money.
  - speaker: Mbak Sekar
    text: Mboten menapa, Mas. Wonten batik cap ingkang mirah.
    ar_eg: مفيش مشكلة يا ماس. فيه باتيك مطبوع رخيص.
    ar: لا بأس يا ماس. يوجد باتيك مطبوع رخيص.
    en: No problem, Mas. There's cheaper stamped batik.
  - speaker: Mas Galih
    text: Sae. Kula badhe tumbas setunggal. Matur nuwun, Bu.
    ar_eg: تمام. هاخد واحد. متشكّر يا ست.
    ar: حسنًا. سآخذ واحدًا. شكرًا يا سيّدتي.
    en: Good. I'll take one. Thank you, Bu.
  - speaker: Mbak Sekar
    text: Sami-sami, Mas. Salam kangge ibu sampeyan.
    ar_eg: العفو يا ماس. سلّم على والدتك.
    ar: عفوًا يا ماس. سلّم على والدتك.
    en: You're welcome, Mas. Regards to your mother.
- kind: word_spotlight
  title: Wis dadi sampun
  lines:
  - speaker: Mbak Sekar
    text: Wis dadi sampun. Durung dadi dereng. Arep dadi badhe.
    ar_eg: wis تبقى sampun. durung تبقى dereng. arep تبقى badhe.
    ar: wis تصير sampun، وdurung تصير dereng، وarep تصير badhe.
    en: Wis becomes sampun. Durung becomes dereng. Arep becomes badhe.
  - speaker: Mas Galih
    text: Ora dadi mboten. Ana dadi wonten. Saka dadi saking. Menyang dadi dhateng.
    ar_eg: ora تبقى mboten. ana تبقى wonten. saka تبقى saking. menyang تبقى dhateng.
    ar: ora تصير mboten، وana تصير wonten، وsaka تصير saking، وmenyang تصير dhateng.
    en: Ora becomes mboten. Ana becomes wonten. Saka becomes saking. Menyang becomes dhateng.
    note:
      ar_eg: دول «كلمات الربط» - لو غيّرتهم بس، جملتك بتبقى كراما مقبولة.
      ar: هذه «كلمات الوظيفة» - إن غيّرتها وحدها صارت جملتك كراما مقبولة.
      en: These are the function words - change just these and your sentence becomes acceptable krama.
  - speaker: Mbak Sekar
    text: Lan iya dadi nggih. Iki dadi menika. "Nggih, menika sae."
    ar_eg: وiya تبقى nggih. iki تبقى menika. «أيوه، ده حلو.»
    ar: وiya تصير nggih، وiki تصير menika. «نعم، هذا جميل.»
    en: And iya becomes nggih. Iki becomes menika. "Nggih, menika sae."
  - speaker: Mas Galih
    text: 'Contone saka Pak Harjo: "Sampeyan sampun nedha?" Lan wangsulane: "Dereng, Pak."'
    ar_eg: 'مثال من پاك هارجو: «حضرتك كلت؟» والردّ: «لسّه يا أستاذ.»'
    ar: 'مثال من باك هارجو: «هل أكلت حضرتك؟» والجواب: «ليس بعد يا أستاذ.»'
    en: 'An example from Pak Harjo: "Sampeyan sampun nedha?" And the answer: "Dereng, Pak."'
