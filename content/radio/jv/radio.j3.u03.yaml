    ar: هل يوجد أزرق؟
    en: Is there a blue one?
  - speaker: Mbak Sekar
    text: Kula dereng nate mirsani.
    ar_eg: أنا لسّه ماشفتش قبل كده.
    ar: لم أره من قبل.
    en: I've never seen it before.
  - speaker: Mas Galih
    text: Kula dereng nate mirsani.
    ar_eg: أنا لسّه ماشفتش قبل كده.
    ar: لم أره من قبل.
    en: I've never seen it before.
  - speaker: Mbak Sekar
