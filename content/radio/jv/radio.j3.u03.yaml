    ar_eg: معيش فلوس كتير.
    ar: ليس معي مال كثير.
    en: I don't have much money.
  - speaker: Mbak Sekar
    text: Nggih, menika sae.
    ar_eg: أيوه، ده حلو.
    ar: نعم، هذا جميل.
    en: Yes, this is nice.
  - speaker: Mas Galih
    text: Nggih, menika sae.
    ar_eg: أيوه، ده حلو.
    ar: نعم، هذا جميل.
    en: Yes, this is nice.
  - speaker: Mbak Sekar
    text: Kula saking Kairo, badhe dhateng Yogya.
    ar_eg: أنا من القاهرة، ورايح يوجيا.
    ar: أنا من القاهرة، ذاهب إلى يوغيا.
    en: I'm from Cairo, going to Yogya.
  - speaker: Mas Galih
    text: Kula saking Kairo, badhe dhateng Yogya.
    ar_eg: أنا من القاهرة، ورايح يوجيا.
    ar: أنا من القاهرة، ذاهب إلى يوغيا.
    en: I'm from Cairo, going to Yogya.
- kind: outro
  title: Ngoko dadi krama
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, ganti ukara iki dadi krama. "Aku wis mangan, nanging durung ngombe."
    ar_eg: يا ماس محمد، حوّل الجملة دي لكراما. «أنا كلت، بس لسّه ماشربتش.»
    ar: يا ماس محمد، حوّل هذه الجملة إلى الكراما. «أكلت لكنّي لم أشرب بعد.»
    en: Mas Mohamed, change this into krama. "Aku wis mangan, nanging durung ngombe."
    note:
      ar_eg: 'دورك! خلّي بالك: ngunjuk (يشرب) كراما إنجيل، يعني مش لنفسك. لنفسك قول ngombe.'
      ar: 'دورك! انتبه: ngunjuk (يشرب) كراما إنغيل، فلا تستعملها لنفسك. لنفسك قل ngombe.'
      en: 'Your turn! Careful: ngunjuk (drink) is krama inggil, so not for yourself. For yourself, say ngombe.'
  - speaker: Mas Galih
    text: 'Wangsulane: Kula sampun nedha, nanging dereng ngombe.'
    ar_eg: 'الإجابة: أنا كلت، بس لسّه ماشربتش.'
    ar: 'الجواب: أكلت لكنّي لم أشرب بعد.'
    en: 'The answer: Kula sampun nedha, nanging dereng ngombe.'
  - speaker: Mbak Sekar
    text: PR-mu, rungokna telpon saka Pak Harjo ing pelajaran, lan tulisen tembung krama sing krungu.
    ar_eg: واجبك، اسمع تليفون پاك هارجو في الدرس، واكتب كلمات الكراما اللي سمعتها.
    ar: 'واجبك: استمع إلى اتّصال باك هارجو في الدرس واكتب كلمات الكراما التي سمعتها.'
    en: 'Your homework: listen to Pak Harjo''s call in the lesson and write down the krama words you hear.'
  - speaker: Mas Galih
    text: Sesuk kita nang Pura Mangkunegaran. Nganti pinanggih malih!
    ar_eg: بكرة رايحين قصر مانجكونيجاران. إلى اللقاء!
    ar: غدًا نذهب إلى قصر مانغكونيغاران. إلى اللقاء!
    en: Tomorrow we go to Pura Mangkunegaran. Until next time!
