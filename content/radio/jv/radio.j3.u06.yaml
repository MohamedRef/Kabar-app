review:
  status: draft
  verified: false
  notes: Krama affixes (dipun-, -ipun, -aken) in Giriloyo (Wukirsari, Imogiri, Bantul), a hand-drawn batik village near the royal tombs; Pak Harjo's workshop from the lessons. The village rebuilt itself as a batik centre after the 2006 earthquake - kept general. Last J3 episode; J4 goes on to the Kraton.
