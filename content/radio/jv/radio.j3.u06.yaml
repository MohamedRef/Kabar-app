    ar_eg: الباتيك ده بيتعمل إزّاي؟
    ar: كيف يُصنع هذا الباتيك؟
    en: How is this batik made?
  - speaker: Mbak Sekar
    text: Malamipun dipunpanasaken.
    ar_eg: الشمع بيتسخّن.
    ar: يُسخَّن الشمع.
    en: The wax is heated.
  - speaker: Mas Danang
    text: Malamipun dipunpanasaken.
    ar_eg: الشمع بيتسخّن.
    ar: يُسخَّن الشمع.
    en: The wax is heated.
  - speaker: Mbak Sekar
    text: Kainipun dipunlebetaken dhateng pewarna.
    ar_eg: القماش بيتغطّس في الصبغة.
    ar: يُغمس القماش في الصبغة.
    en: The cloth is dipped in the dye.
  - speaker: Mas Danang
    text: Kainipun dipunlebetaken dhateng pewarna.
    ar_eg: القماش بيتغطّس في الصبغة.
    ar: يُغمس القماش في الصبغة.
    en: The cloth is dipped in the dye.
  - speaker: Mbak Sekar
    text: Griyanipun ageng sanget.
    ar_eg: البيت كبير أوي.
    ar: البيت كبير جدًّا.
    en: The house is very big.
  - speaker: Mas Danang
    text: Griyanipun ageng sanget.
    ar_eg: البيت كبير أوي.
    ar: البيت كبير جدًّا.
    en: The house is very big.
  - speaker: Mbak Sekar
    text: Saged kula nyobi?
    ar_eg: ممكن أجرّب؟
    ar: هل يمكنني أن أجرّب؟
    en: May I try?
  - speaker: Mas Danang
    text: Saged kula nyobi?
    ar_eg: ممكن أجرّب؟
    ar: هل يمكنني أن أجرّب؟
    en: May I try?
  - speaker: Mbak Sekar
    text: Malamipun benter, ngatos-atos.
    ar_eg: الشمع سخن، حاسب.
    ar: الشمع حارّ، احذر.
    en: The wax is hot, careful.
  - speaker: Mas Danang
    text: Malamipun benter, ngatos-atos.
    ar_eg: الشمع سخن، حاسب.
    ar: الشمع حارّ، احذر.
    en: The wax is hot, careful.
  - speaker: Mas Danang
    text: Lan "ngatos-atos" iku krama saka "ati-ati". Ngatos-atos ing dalan, nggih!
    ar_eg: و«ngatos-atos» كراما «ati-ati». خلّي بالك في الطريق!
    ar: و«ngatos-atos» كراما «ati-ati». انتبه في الطريق!
    en: And "ngatos-atos" is the krama of "ati-ati". Take care on the road!
- kind: outro
  title: Pamit saking Giriloyo
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, gilirane sampeyan. Critakna carane damel teh nganggo dipun- lan -aken.
    ar_eg: يا ماس محمد، دورك. احكي إزّاي الشاي بيتعمل بـdipun- و-aken.
    ar: يا ماس محمد، دورك. صِف كيف يُصنع الشاي بـdipun- و-aken.
    en: Mas Mohamed, your turn. Describe how tea is made using dipun- and -aken.
    note:
      ar_eg: 'دورك! زي: Toyanipun dipunpanasaken. Tehipun dipunlebetaken...'
      ar: 'دورك! مثل: Toyanipun dipunpanasaken. Tehipun dipunlebetaken...'
      en: 'Your turn! Like: Toyanipun dipunpanasaken. Tehipun dipunlebetaken...'
  - speaker: Mas Danang
    text: 'Contone: Toyanipun dipunpanasaken. Lajeng tehipun dipunlebetaken. Lajeng gulanipun dipunparingaken.'
    ar_eg: 'مثلًا: المية بتتسخّن. وبعدين الشاي بيتحطّ. وبعدين السكّر بيتحطّ.'
    ar: 'مثلًا: يُسخَّن الماء. ثمّ يوضع الشاي. ثمّ يُضاف السكّر.'
    en: 'For example: The water is heated. Then the tea goes in. Then the sugar is added.'
  - speaker: Mbak Sekar
    text: PR-mu, rungokna pesen swara saking Giriloyo ing pelajaran, lan tulisen kabeh tembung sing nganggo dipun-.
    ar_eg: واجبك، اسمع الرسالة الصوتية من جيريلويو في الدرس، واكتب كل الكلمات اللي فيها dipun-.
    ar: 'واجبك: استمع إلى الرسالة الصوتية من جيريلويو في الدرس واكتب كلّ الكلمات التي فيها dipun-.'
    en: 'Your homework: listen to the voice message from Giriloyo in the lesson and write every word with dipun-.'
  - speaker: Mas Danang
    text: Matur nuwun, Giriloyo! Sesuk kita mlebet langkung lebet ing Jogja, dhateng Kraton. Nganti pinanggih malih!
    ar_eg: شكرًا يا جيريلويو! بكرة هندخل جوّه جوجا أكتر، للكراتون. إلى اللقاء!
    ar: شكرًا يا جيريلويو! غدًا ندخل أعمق في جوغجا، إلى الكراتون. إلى اللقاء!
    en: Thank you, Giriloyo! Next we go deeper into Jogja, to the Kraton. Until next time!
