segments:
- kind: intro
  title: Desa Giriloyo
  lines:
  - speaker: Mas Danang
    text: Sugeng enjing saking Giriloyo! Sawahe ijo, ambune malam ing ngendi-endi. Kula Danang.
    ar_eg: صباح الخير من جيريلويو! الغيطان خضرا، وريحة الشمع في كل حتّة. أنا دانانج.
    ar: صباح الخير من جيريلويو! الحقول خضراء، ورائحة الشمع في كلّ مكان. أنا دانانغ.
    en: Good morning from Giriloyo! Green rice fields, and the smell of wax everywhere. I'm Danang.
  - speaker: Mbak Sekar
    text: Kula Sekar. Giriloyo iku desa batik tulis. Ibu-ibu nulis batik ing teras, saben dina.
    ar_eg: أنا سيكار. جيريلويو قرية الباتيك المرسوم. الستّات بيرسموا باتيك قدّام البيوت كل يوم.
    ar: أنا سيكار. جيريلويو قرية الباتيك المرسوم، والنساء يرسمن الباتيك في الشرفات كلّ يوم.
    en: I'm Sekar. Giriloyo is a hand-drawn batik village. The women draw batik on their porches every day.
    note:
      ar_eg: جيريلويو قريبة من مقابر الملوك في إيموجيري، وأهلها بيرسموا باتيك من أجيال. بعد زلزال 2006 رجعت القرية تقف على رجليها بالباتيك.
      ar: جيريلويو قريبة من المقابر الملكية في إيموغيري، وأهلها يرسمون الباتيك منذ أجيال. وبعد زلزال 2006 نهضت القرية من جديد بالباتيك.
      en: Giriloyo sits near the royal tombs of Imogiri, and its people have drawn batik for generations. After the 2006 earthquake the village rebuilt itself through batik.
  - speaker: Mas Danang
    text: Dina iki kita sinau sing rada angel. Ater-ater lan panambang krama. Dipun-, -ipun, -aken.
    ar_eg: النهارده هنتعلّم حاجة صعبة شويّة. السوابق واللواحق بالكراما. dipun-، -ipun، -aken.
    ar: 'اليوم نتعلّم شيئًا أصعب قليلًا: سوابق الكراما ولواحقها. dipun- و-ipun و-aken.'
    en: Today something a little harder. Krama prefixes and suffixes. Dipun-, -ipun, -aken.
  - speaker: Mbak Sekar
    text: Nanging aja kuwatir. Iki mung kembaran saka di-, -e, lan -ke sing wis sampeyan kenal.
    ar_eg: بس ماتقلقش. دول مجرّد توأم di- و-e و-ke اللي انت عارفهم.
    ar: لكن لا تقلق. هذه مجرّد توائم di- و-e و-ke التي تعرفها.
    en: But don't worry. These are just the twins of di-, -e and -ke that you already know.
- kind: dialogue
  title: Sinau damel batik
  lines:
  - speaker: Mbak Sekar
    text: Danang, sampeyan murid, kula guru batik ing griya juragan batik.
    ar_eg: يا دانانج، انت التلميذ، وأنا مدرّسة الباتيك في بيت صاحب الورشة.
    ar: يا دانانغ، أنت التلميذ وأنا معلّمة الباتيك في بيت صاحب الورشة.
    en: Danang, you're the student, I'm the batik teacher at the workshop owner's house.
  - speaker: Mas Danang
    text: Nyuwun sewu, Bu. Batik menika dipundamel kados pundi?
    ar_eg: لا مؤاخذة يا ست. الباتيك ده بيتعمل إزّاي؟
    ar: عذرًا يا سيّدتي. كيف يُصنع هذا الباتيك؟
    en: Excuse me, Bu. How is this batik made?
  - speaker: Mbak Sekar
    text: Rumiyin, kainipun dipungambar rumiyin nganggo potlot.
    ar_eg: الأوّل، القماش بيترسم عليه بالقلم الرصاص.
    ar: أوّلًا يُرسم على القماش بقلم الرصاص.
    en: First, the cloth is drawn on with a pencil.
  - speaker: Mas Danang
    text: Lajeng?
    ar_eg: وبعدين؟
    ar: ثمّ؟
    en: And then?
  - speaker: Mbak Sekar
    text: Lajeng malamipun dipunpanasaken, dipunlebetaken dhateng canting, lan dipuntulisaken wonten kain.
    ar_eg: وبعدين الشمع بيتسخّن، ويتحطّ في الـcanting، ويترسم بيه على القماش.
    ar: ثمّ يُسخَّن الشمع ويوضع في الـcanting ويُرسم به على القماش.
    en: Then the wax is heated, put into the canting, and drawn onto the cloth.
    note:
      ar_eg: 'canting = أداة نحاس صغيّرة زي البزبوز بترسم بالشمع السخن. اسمع: dipun-panas-aken = بيتسخّن، dipun-lebet-aken = بيتحطّ جوّه.'
      ar: 'canting = أداة نحاسية صغيرة كالقمع ترسم بالشمع الساخن. واسمع: dipun-panas-aken = يُسخَّن، وdipun-lebet-aken = يُدخَل.'
      en: 'A canting is a small copper spouted tool that draws with hot wax. Listen: dipun-panas-aken = is heated, dipun-lebet-aken = is put in.'
  - speaker: Mas Danang
    text: Wah, angel. Saged kula nyobi?
    ar_eg: يا ساتر، صعبة. ممكن أجرّب؟
    ar: صعب. هل يمكنني أن أجرّب؟
    en: Wow, hard. May I try?
  - speaker: Mbak Sekar
    text: Saged. Mangga canting menika dipunasta. Ngatos-atos, malamipun benter.
    ar_eg: ممكن. اتفضّل امسك الـcanting ده. حاسب، الشمع سخن.
    ar: يمكن. تفضّل أمسك هذا الـcanting. احذر، الشمع حارّ.
    en: You may. Please hold this canting. Careful, the wax is hot.
  - speaker: Mas Danang
    text: Aduh! Malamipun tumetes wonten tangan kula!
    ar_eg: آه! الشمع نقّط على إيدي!
    ar: آه! قطر الشمع على يدي!
    en: Ouch! The wax dripped on my hand!
  - speaker: Mbak Sekar
    text: Hahaha. Mboten menapa. Sedaya murid ngalami menika.
    ar_eg: ههههه. مفيش حاجة. كل التلاميذ بيحصلهم كده.
    ar: ههههه. لا بأس. كلّ التلاميذ يمرّون بهذا.
    en: Hahaha. It's fine. Every student goes through this.
  - speaker: Mas Danang
    text: Lajeng, warnanipun dipunparingaken kapan?
    ar_eg: وبعدين، اللون بيتحطّ إمتى؟
    ar: ومتى يوضع اللون؟
    en: And when is the colour added?
  - speaker: Mbak Sekar
    text: Sasampunipun malamipun garing. Kainipun dipunlebetaken dhateng pewarna.
    ar_eg: بعد ما الشمع ينشف. القماش بيتغطّس في الصبغة.
    ar: بعد أن يجفّ الشمع، يُغمس القماش في الصبغة.
    en: Once the wax is dry. The cloth is dipped into the dye.
- kind: word_spotlight
  title: Dipun-, -ipun, -aken
  lines:
  - speaker: Mbak Sekar
    text: Di- dadi dipun-. Digawe dadi dipundamel. Ditulis dadi dipunserat.
    ar_eg: di- تبقى dipun-. digawe تبقى dipundamel. ditulis تبقى dipunserat.
    ar: di- تصير dipun-. digawe تصير dipundamel، وditulis تصير dipunserat.
    en: Di- becomes dipun-. Digawe becomes dipundamel. Ditulis becomes dipunserat.
  - speaker: Mas Danang
    text: -e dadi -ipun. Omahe dadi griyanipun. Kaine dadi kainipun.
    ar_eg: -e تبقى -ipun. omahe تبقى griyanipun. kaine تبقى kainipun.
    ar: -e تصير -ipun. omahe تصير griyanipun، وkaine تصير kainipun.
    en: -e becomes -ipun. Omahe becomes griyanipun. Kaine becomes kainipun.
  - speaker: Mbak Sekar
    text: -ke dadi -aken. Nggunakake dadi ngginakaken. Panasake dadi panasaken.
    ar_eg: -ke تبقى -aken. nggunakake تبقى ngginakaken. panasake تبقى panasaken.
    ar: -ke تصير -aken. nggunakake تصير ngginakaken، وpanasake تصير panasaken.
    en: -ke becomes -aken. Nggunakake becomes ngginakaken. Panasake becomes panasaken.
    note:
      ar_eg: لو شفت كلمة طويلة فيها dipun- أو -ipun أو -aken، شيلهم الأوّل وهتلاقي الكلمة الأصلية.
      ar: إن رأيت كلمة طويلة فيها dipun- أو -ipun أو -aken فانزعها أوّلًا تجد الأصل.
      en: When you see a long word with dipun-, -ipun or -aken, strip them off first and you'll find the root.
  - speaker: Mas Danang
    text: Dadi papan ing griya juragan, "Griyanipun dipunyasa taun 1920," gampang dipunwaos!
    ar_eg: يعني لوحة بيت التاجر، «البيت اتبنى سنة 1920»، بقت سهلة تتقري!
    ar: إذن لوحة بيت التاجر «بُني البيت عام 1920» صارت سهلة القراءة!
    en: So the sign on the merchant's house, "The house was built in 1920", is easy to read!
