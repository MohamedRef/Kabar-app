- kind: outro
  title: Grup WA kulawarga
  lines:
  - speaker: Mas Galih
    text: Mas Mohamed, tulisen pesen ing grup WA kulawarga kanggo kangmasmu. Nganggo ngoko alus.
    ar_eg: يا ماس محمد، اكتب رسالة في جروب العيلة لأخوك الكبير. بالنجوكو المؤدّب.
    ar: يا ماس محمد، اكتب رسالة في مجموعة العائلة لأخيك الأكبر بالنغوكو المهذّبة.
    en: Mas Mohamed, write a message in the family WhatsApp group to your older brother. In ngoko alus.
    note:
      ar_eg: 'دورك! جملة نجوكو، وفيها فعل كراما إنجيل واحد على الأقل للأخ الكبير: dhahar أو tindak أو kondur.'
      ar: 'دورك! جملة نغوكو فيها فعل كراما إنغيل واحد على الأقلّ للأخ الأكبر: dhahar أو tindak أو kondur.'
      en: 'Your turn! A ngoko sentence with at least one krama inggil verb for your brother: dhahar, tindak or kondur.'
  - speaker: Mbak Sekar
    text: 'Contone: Mas, kapan kondur saka kantor? Aku arep tuku gudheg, Mas arep dhahar apa?'
    ar_eg: 'مثلًا: يا أخويا، هترجع من الشغل إمتى؟ أنا هشتري جودِج، انت عايز تاكل إيه؟'
    ar: 'مثلًا: يا أخي، متى تعود من العمل؟ سأشتري غوديغ، ماذا تريد أن تأكل؟'
    en: 'For example: Mas, when are you coming home from work? I''m buying gudeg, what would you like to eat?'
  - speaker: Mas Galih
    text: 'PR-mu, rungokna telpon saka Mas Rudi ing pelajaran, lan pilihen: ngoko lugu apa ngoko alus?'
    ar_eg: 'واجبك، اسمع تليفون ماس رودي في الدرس، واختار: نجوكو عادي ولّا مؤدّب؟'
    ar: 'واجبك: استمع إلى اتّصال ماس رودي في الدرس واختر: نغوكو عادية أم مهذّبة؟'
    en: 'Your homework: listen to Mas Rudi''s call in the lesson and decide: plain ngoko or ngoko alus?'
  - speaker: Mbak Sekar
    text: Sesuk kita dhateng Prambanan, ningali wayang lan gamelan. Nganti pinanggih malih!
    ar_eg: بكرة رايحين برامبانان، نتفرّج على الوايانج والجاملان. إلى اللقاء!
    ar: غدًا نذهب إلى برامبانان لنشاهد الوايانغ والغاملان. إلى اللقاء!
    en: Tomorrow we go to Prambanan for wayang and gamelan. Until next time!
