language: jv
level: j4
unit: j4.u05
title:
  target: Ngoko alus
  ar_eg: النجوكو المؤدّب
  ar: النغوكو المهذّبة
  en: Polite ngoko
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Kotabaru
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saking Kotabaru, Yogya. Griya-griya lawas jaman Walanda, wit-witan gedhe. Kula Sekar.
    ar_eg: صباح الخير من كوتابارو في يوجيا. بيوت قديمة من أيّام الهولنديين وشجر كبير. أنا سيكار.
    ar: صباح الخير من كوتابارو في يوغيا. بيوت قديمة من العهد الهولنديّ وأشجار كبيرة. أنا سيكار.
    en: Good morning from Kotabaru, Yogya. Old Dutch-era houses, big trees. I'm Sekar.
  - speaker: Mas Galih
    text: Aku Galih. Lho, aku ngomong "aku" maneh! Dina iki oleh, merga kita sinau ngoko alus.
    ar_eg: أنا جاليه. إيه ده، قلت «aku» تاني! النهارده مسموح، عشان هنتعلّم النجوكو المؤدّب.
    ar: أنا غاليه. عجبًا، قلت «aku» مجدّدًا! اليوم مسموح لأنّنا نتعلّم النغوكو المهذّبة.
    en: I'm Galih. Hey, I said "aku" again! Today that's fine, because we're learning ngoko alus.
  - speaker: Mbak Sekar
    text: Ngoko alus iku ngoko, nanging karo tembung krama inggil kanggo wong sing diajeni.
    ar_eg: النجوكو المؤدّب ده نجوكو، بس فيه كلمات كراما إنجيل للي بتحترمه.
    ar: النغوكو المهذّبة نغوكو، لكن مع كلمات كراما إنغيل لمن تجلّه.
    en: Ngoko alus is ngoko, but with krama inggil words for the person you respect.
    note:
      ar_eg: 'زي ما تكلّم أخوك الكبير أو حماك اللي قريب منك: بتقول «انت» بس بتقول «اتفضّل» و«تشرّف».'
      ar: 'مثل حديثك مع أخيك الأكبر أو حميك المقرّب: تقول «أنت» لكن مع «تفضّل» و«شرّفت».'
      en: 'Like talking to your older brother or a close father-in-law: "you", but with "please" and honorific verbs.'
  - speaker: Mas Galih
    text: Kanggo sapa? Kanggo bojo, mas utawa mbakyu, lan kanca kantor sing luwih tuwa.
    ar_eg: لمين؟ للزوج أو الزوجة، والأخ أو الأخت الكبار، وزميل الشغل الأكبر.
    ar: لمن؟ للزوج، وللأخ أو الأخت الكبار، ولزميل العمل الأكبر.
    en: For whom? Spouses, older siblings, and older colleagues you're close to.
- kind: dialogue
  title: Esuk ing griya
  lines:
  - speaker: Mas Galih
    text: Sekar, sampeyan mbakyuku, aku adhimu. Esuk-esuk ing omah.
    ar_eg: يا سيكار، انتي أختي الكبيرة، وأنا أخوكي الصغيّر. الصبح بدري في البيت.
    ar: يا سيكار، أنتِ أختي الكبرى وأنا أخوك الأصغر. صباحًا باكرًا في البيت.
    en: Sekar, you're my big sister, I'm your little brother. Early morning at home.
  - speaker: Mas Galih
    text: Mbak, wis wungu?
    ar_eg: يا أبلة، صحيتي؟
    ar: يا أختي، هل استيقظتِ؟
    en: Mbak, are you up?
    note:
      ar_eg: 'شوف: الجملة نجوكو (wis)، بس الفعل wungu كراما إنجيل بدل tangi - احترام للأخت الكبيرة.'
      ar: 'لاحظ: الجملة نغوكو (wis)، لكنّ الفعل wungu كراما إنغيل بدل tangi - احترامًا للأخت الكبرى.'
      en: 'Notice: the sentence is ngoko (wis), but the verb wungu is krama inggil instead of tangi - respect for the big sister.'
  - speaker: Mbak Sekar
    text: Wis, Dik. Aku wis adus barang. Kowe wis mangan?
    ar_eg: أيوه يا صغيّر. وكمان استحمّيت. وانت كلت؟
    ar: نعم يا صغيري. واستحممت أيضًا. هل أكلت؟
    en: Yes, little one. I've even showered. Have you eaten?
    note:
      ar_eg: الأخت الكبيرة بتكلّم الصغيّر نجوكو عادي (adus، mangan). ده طبيعي - الاحترام بيطلع لفوق بس.
      ar: تكلّم الأخت الكبرى أخاها بالنغوكو العادية (adus وmangan). هذا طبيعيّ - الاحترام يصعد للأعلى فقط.
      en: The big sister talks plain ngoko to the little brother (adus, mangan). Natural - respect goes upward only.
  - speaker: Mas Galih
    text: Durung, Mbak. Mbak arep dhahar apa? Tak tukokne.
    ar_eg: لسّه يا أبلة. انتي عايزة تاكلي إيه؟ أجيبلك.
    ar: ليس بعد يا أختي. ماذا تريدين أن تأكلي؟ سأشتري لك.
    en: Not yet, Mbak. What would you like to eat? I'll get it for you.
  - speaker: Mbak Sekar
    text: Sega gudheg wae. Lho, Mas Rudi wis tindak kantor?
    ar_eg: رز بجودِج بس. إيه ده، ماس رودي راح الشغل؟
    ar: أرزّ بالغوديغ فقط. عجبًا، هل ذهب ماس رودي إلى العمل؟
    en: Just nasi gudeg. Oh, has Mas Rudi gone to the office?
  - speaker: Mas Galih
    text: Wis, Mbak. Mas Rudi ngendika arep kondur jam lima.
    ar_eg: أيوه يا أبلة. ماس رودي قال إنه هيرجع الساعة خمسة.
    ar: نعم يا أختي. قال ماس رودي إنّه سيعود في الخامسة.
    en: Yes, Mbak. Mas Rudi said he'd be home at five.
  - speaker: Mbak Sekar
    text: Ya wis. Aja lali tukokne gudheg kanggo Ibu uga, ya. Ibu durung dhahar.
    ar_eg: خلاص. ماتنساش تجيب جودِج لماما كمان. ماما لسّه ماكلتش.
    ar: حسنًا. لا تنسَ أن تشتري غوديغ لأمّي أيضًا. لم تأكل بعد.
    en: All right. Don't forget to get gudeg for Mum too. She hasn't eaten yet.
  - speaker: Mas Galih
    text: Siap, Mbak. Ibu seneng gudheg kering.
    ar_eg: حاضر يا أبلة. ماما بتحبّ الجودِج الناشف.
    ar: حاضر يا أختي. أمّي تحبّ الغوديغ الجافّ.
    en: Sure, Mbak. Mum likes dry gudeg.
    note:
      ar_eg: 'gudeg = أكلة يوجيا: جاك فروت صغيّر مطبوخ بلبن جوز الهند لحدّ ما يحلى. فيه «kering» ناشف و«basah» بمرقة.'
      ar: 'gudeg = طبق يوغيا: جاك فروت صغير يُطهى بحليب جوز الهند حتى يحلو، منه «kering» جافّ و«basah» بالمرق.'
      en: 'Gudeg = Yogya''s dish: young jackfruit stewed sweet in coconut milk; "kering" is dry, "basah" with sauce.'
  - speaker: Mbak Sekar
    text: Mas Mohamed, delok ta? Kowe, aku, wis, mangan iku ngoko. Nanging dhahar, tindak, ngendika, kondur iku kanggo Mbak, Mas Rudi, lan Ibu.
    ar_eg: يا ماس محمد، شايف؟ kowe وaku وwis وmangan نجوكو. بس dhahar وtindak وngendika وkondur للأبلة وماس رودي والماما.
    ar: يا ماس محمد، أرأيت؟ kowe وaku وwis وmangan نغوكو، لكنّ dhahar وtindak وngendika وkondur للأخت وماس رودي والأمّ.
    en: Mas Mohamed, see? Kowe, aku, wis, mangan are ngoko. But dhahar, tindak, ngendika, kondur are for Mbak, Mas Rudi and Mum.
- kind: word_spotlight
  title: Papat basa
  lines:
  - speaker: Mas Galih
    text: 'Ngoko lugu: Kowe wis mangan? Kanggo kanca.'
    ar_eg: 'النجوكو العادي: «انت كلت؟» للصاحب.'
    ar: 'النغوكو العادية: «هل أكلت؟» للصديق.'
    en: 'Plain ngoko: Kowe wis mangan? For friends.'
  - speaker: Mbak Sekar
    text: 'Ngoko alus: Panjenengan wis dhahar? Utawa Mbak wis dhahar? Kanggo mbakyu utawa bojo.'
    ar_eg: 'النجوكو المؤدّب: «حضرتك اتغدّيت؟» أو «الأبلة اتغدّت؟» للأخت الكبيرة أو الزوج.'
    ar: 'النغوكو المهذّبة: «Panjenengan wis dhahar?» أو «Mbak wis dhahar?» للأخت الكبرى أو الزوج.'
    en: 'Ngoko alus: Panjenengan wis dhahar? Or Mbak wis dhahar? For an older sister or a spouse.'
  - speaker: Mas Galih
    text: 'Krama: Sampeyan sampun nedha? Kanggo wong sing durung kenal.'
    ar_eg: 'الكراما: «حضرتك كلت؟» لحدّ ماتعرفوش.'
    ar: 'الكراما: «Sampeyan sampun nedha?» لمن لا تعرفه.'
    en: 'Krama: Sampeyan sampun nedha? For people you don''t know.'
  - speaker: Mbak Sekar
    text: 'Krama alus: Panjenengan sampun dhahar? Kanggo wong sepuh lan wong sing diajeni banget.'
    ar_eg: 'الكراما الراقي: «سيادتك اتغدّيت؟» للكبار واللي بتحترمهم جدًّا.'
    ar: 'الكراما الرفيعة: «Panjenengan sampun dhahar?» للكبار ومن تجلّهم كثيرًا.'
    en: 'Krama alus: Panjenengan sampun dhahar? For elders and people you deeply respect.'
    note:
      ar_eg: أربع جمل لنفس السؤال. ده قلب الجاوي، وانت دلوقتي بتعرف الأربعة!
      ar: أربع جمل للسؤال نفسه. هذا قلب الجاوية، وأنت تعرف الأربع الآن!
      en: Four sentences for one question. That's the heart of Javanese, and you now know all four!
