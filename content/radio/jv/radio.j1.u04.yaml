id: radio.j1.u04
language: jv
level: j1
unit: j1.u04
title:
  target: Sek, tak lapor
  ar_eg: استنّى، هبلّغ
  ar: انتظر، سأبلّغ
  en: Hold on, I'll report
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Kampung Ampel
  lines:
  - speaker: Mas Galih
    text: Assalamualaikum lan sugeng enjing saka Ampel! Mambu minyak wangi lan kurma ing endi-endi.
    ar_eg: السلام عليكم وصباح الخير من أمبيل! ريحة البرفان والبلح في كل حتّة.
    ar: السلام عليكم وصباح الخير من أمبيل! رائحة العطور والتمر في كلّ مكان.
    en: Assalamualaikum and good morning from Ampel! The smell of perfume and dates everywhere.
  - speaker: Mbak Sekar
    text: Aku Sekar. Mas Mohamed, ing kene sampeyan bakal krasa kaya ing omah. Akeh tulisan Arab!
    ar_eg: أنا سيكار. يا ماس محمد، هنا هتحسّ إنك في بيتك. كتابة عربي كتير!
    ar: أنا سيكار. يا ماس محمد، ستشعر هنا كأنّك في بيتك. كتابة عربية كثيرة!
    en: I'm Sekar. Mas Mohamed, here you'll feel at home. So much Arabic writing!
    note:
      ar_eg: حيّ أمبيل حوالين جامع سونان أمبيل، من القرن الخمستاشر، وهو من الأولياء التسعة (Wali Sanga) اللي نشروا الإسلام في جاوة.
      ar: يحيط حيّ أمبيل بمسجد سونان أمبيل من القرن الخامس عشر، وهو أحد الأولياء التسعة (Wali Sanga) الذين نشروا الإسلام في جاوة.
      en: The Ampel quarter surrounds the Sunan Ampel mosque, from the 15th century; Sunan Ampel was one of the Wali Sanga who spread Islam in Java.
  - speaker: Mas Galih
    text: Dina iki kita sinau tak-, di-, lan tembung cilik sing gawe ukara luwih urip. Ta, ae, lho, kok.
    ar_eg: النهارده هنتعلّم tak- وdi-، والكلمات الصغيّرة اللي بتخلّي الجملة حيّة. ta، ae، lho، kok.
    ar: اليوم نتعلّم tak- وdi-، والكلمات الصغيرة التي تجعل الجملة حيّة. ta وae وlho وkok.
    en: Today we learn tak-, di-, and the little words that bring a sentence to life. Ta, ae, lho, kok.
- kind: dialogue
  title: Tuku kurma
  lines:
  - speaker: Mbak Sekar
    text: Galih, kowe bakul kurma, aku tuku, ya.
    ar_eg: يا جاليه، انت بيّاع البلح، وأنا أشتري.
    ar: يا غاليه، أنت بائع التمر وأنا أشتري.
    en: Galih, you're the date seller, I'm buying.
  - speaker: Mas Galih
    text: Monggo, Mbak! Kurmane enak lho, saka Madinah.
    ar_eg: اتفضّلي يا مباك! البلح حلو على فكرة، من المدينة.
    ar: تفضّلي يا مباك! التمر لذيذ، من المدينة.
    en: Come in, Mbak! These dates are good, you know, from Medina.
  - speaker: Mbak Sekar
    text: Sing iki pira, Cak?
    ar_eg: ده بكام يا تشاك؟
    ar: بكم هذا يا تشاك؟
    en: How much is this one, Cak?
  - speaker: Mas Galih
    text: Sek, tak takon bosku. Aku anyar ae.
    ar_eg: استنّي، أسأل المعلّم بتاعي. أنا لسّه جديد.
    ar: انتظري، سأسأل صاحب المحلّ. أنا جديد فحسب.
    en: Hold on, I'll ask my boss. I'm just new.
    note:
      ar_eg: tak takon = هسأل أنا (tak- = أنا هعمل). ae = بس / وخلاص (Suroboyoan، زي wae).
      ar: tak takon = سأسأل (tak- = سأفعل أنا). وae = فقط (سورابايية، مثل wae).
      en: tak takon = I'll ask (tak- = I'll do it). ae = just (Suroboyoan for wae).
  - speaker: Mbak Sekar
    text: Lho, kok suwe? Aku wis ngenteni!
    ar_eg: إيه ده، بتتأخّر ليه؟ أنا مستنّية!
    ar: ما هذا، لماذا تتأخّر؟ لقد انتظرت!
    en: Hey, why so long? I've been waiting!
  - speaker: Mas Galih
    text: Sepurane, Mbak. Sek, tak lapor pusat!
    ar_eg: آسف يا مباك. استنّي، أبلّغ الإدارة!
    ar: آسف يا مباك. انتظري، سأبلّغ الإدارة!
    en: Sorry, Mbak. Hold on, I'll report to head office!
    note:
      ar_eg: «Sek tak lapor pusat» = «استنّى أبلّغ الإدارة» - بقت إفّيه على النت، بيقولوها لمّا حدّ مش عايز ياخد قرار لوحده.
      ar: «Sek tak lapor pusat» = «انتظر، سأبلّغ الإدارة» - صارت نكتة على الإنترنت حين لا يريد أحد اتّخاذ القرار وحده.
      en: '"Sek tak lapor pusat" = "hold on, I''ll report to head office" - an online joke for when someone won''t decide alone.'
  - speaker: Mbak Sekar
    text: Hahaha! Ya wis, kurmane dibungkus ae, rong kilo.
    ar_eg: ههههه! خلاص، لفّلي البلح، كيلوين.
    ar: ههههه! حسنًا، لُفّ التمر، كيلوغرامين.
    en: Hahaha! Fine, just wrap up the dates, two kilos.
  - speaker: Mas Galih
    text: Siap! Kurmane tak bungkus. Suwun, ya, Mbak!
    ar_eg: تمام! هلفّ البلح. متشكّر يا مباك!
    ar: حاضر! سألفّ التمر. شكرًا يا مباك!
    en: Got it! I'll wrap the dates. Thanks, Mbak!
  - speaker: Mbak Sekar
    text: Mas Mohamed, krungu ta? Tak bungkus, aku sing mbungkus. Dibungkus, kurmane sing dibungkus.
    ar_eg: يا ماس محمد، سمعت؟ «tak bungkus» أنا اللي هلفّ. «dibungkus» البلح هو اللي يتلفّ.
    ar: يا ماس محمد، أسمعت؟ «tak bungkus» أنا من سيلفّ. و«dibungkus» التمر هو الذي يُلفّ.
    en: Mas Mohamed, did you hear? Tak bungkus, I wrap it. Dibungkus, the dates get wrapped.
- kind: word_spotlight
  title: Ta, ae, lho, kok
  lines:
  - speaker: Mas Galih
    text: Ta kanggo takon. Wis mangan ta? Kowe ngerti ta?
    ar_eg: ta للسؤال. كلت ولّا إيه؟ انت فاهم ولّا؟
    ar: ta للسؤال. أأكلت؟ أتفهم؟
    en: Ta is for asking. Eaten, have you? You know, right?
  - speaker: Mbak Sekar
    text: Lho kanggo kaget utawa ngelingake. Lho, kowe kok ning kene?
    ar_eg: lho للمفاجأة أو التنبيه. إيه ده، انت هنا ليه؟
    ar: lho للدهشة أو التنبيه. عجبًا، لماذا أنت هنا؟
    en: Lho is for surprise or a reminder. Hey, how come you're here?
  - speaker: Mas Galih
    text: Kok kanggo "kok bisa?" Kok larang? Kok suwe?
    ar_eg: kok يعني «إزّاي كده؟». غالي ليه؟ اتأخّرت ليه؟
    ar: kok تعني «كيف ذلك؟». لماذا غالٍ؟ لماذا تأخّرت؟
    en: Kok is for "how come?" How come it's pricey? How come so long?
  - speaker: Mbak Sekar
    text: Lan mbok kanggo njaluk alus. Mbok ya ngenteni sedhela.
    ar_eg: وmbok للطلب بلطف. ما تستنّى شويّة كده.
    ar: وmbok للطلب بلطف. ليتك تنتظر قليلًا.
    en: And mbok is for asking softly. Why don't you wait a bit.
    note:
      ar_eg: الكلمات دي مالهاش ترجمة واحدة، زي «ما» و«بقى» و«يا عمّ» عندنا. اسمعها كتير وهتحسّها.
      ar: لا ترجمة واحدة لهذه الكلمات، مثل «ما» و«إذن» في العامّية. استمع إليها كثيرًا وستشعر بها.
      en: These words have no single translation, like Egyptian "ma" or "ba'a". Hear them a lot and you'll feel them.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Sek, tak takon.
    ar_eg: استنّى، أسأل.
    ar: انتظر، سأسأل.
    en: Hold on, I'll ask.
  - speaker: Mas Galih
    text: Sek, tak takon.
    ar_eg: استنّى، أسأل.
    ar: انتظر، سأسأل.
    en: Hold on, I'll ask.
  - speaker: Mbak Sekar
    text: Kurmane tak tuku.
    ar_eg: هشتري البلح.
    ar: سأشتري التمر.
    en: I'll buy the dates.
  - speaker: Mas Galih
    text: Kurmane tak tuku.
    ar_eg: هشتري البلح.
    ar: سأشتري التمر.
    en: I'll buy the dates.
  - speaker: Mbak Sekar
    text: Lho, kok larang?
    ar_eg: إيه ده، غالي ليه كده؟
    ar: عجبًا، لماذا هو غالٍ؟
    en: Hey, how come it's so pricey?
  - speaker: Mas Galih
    text: Lho, kok larang?
    ar_eg: إيه ده، غالي ليه كده؟
    ar: عجبًا، لماذا هو غالٍ؟
    en: Hey, how come it's so pricey?
  - speaker: Mbak Sekar
    text: Kowe wis mangan ta?
    ar_eg: انت كلت ولّا إيه؟
    ar: هل أكلت؟
    en: You've eaten, haven't you?
  - speaker: Mas Galih
    text: Kowe wis mangan ta?
    ar_eg: انت كلت ولّا إيه؟
    ar: هل أكلت؟
    en: You've eaten, haven't you?
  - speaker: Mbak Sekar
    text: Sepurane, aku telat.
    ar_eg: آسف، اتأخّرت.
    ar: آسف، تأخّرت.
    en: Sorry, I'm late.
  - speaker: Mas Galih
    text: Sepurane, aku telat.
    ar_eg: آسف، اتأخّرت.
    ar: آسف، تأخّرت.
    en: Sorry, I'm late.
  - speaker: Mbak Sekar
    text: Mbok ya ngenteni sedhela.
    ar_eg: ما تستنّى شويّة.
    ar: ليتك تنتظر قليلًا.
    en: Why don't you wait a moment.
  - speaker: Mas Galih
    text: Mbok ya ngenteni sedhela.
    ar_eg: ما تستنّى شويّة.
    ar: ليتك تنتظر قليلًا.
    en: Why don't you wait a moment.
  - speaker: Mbak Sekar
    text: Lan di- padha karo basa Indonesia. Dituku, digawa, dipangan. Kurmane dipangan Galih!
    ar_eg: وdi- زي الإندونيسي. dituku، digawa، dipangan. البلح جاليه كله!
    ar: وdi- مثل الإندونيسية. dituku وdigawa وdipangan. التمر أكله غاليه!
    en: And di- is like Indonesian. Dituku, digawa, dipangan. The dates got eaten by Galih!
- kind: outro
  title: Tak lapor Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki gilirane sampeyan. Gawe ukara loro nganggo tak-, contone tak tuku utawa tak takon.
    ar_eg: يا ماس محمد، دلوقتي دورك. اعمل جملتين بـtak-، زي tak tuku أو tak takon.
    ar: يا ماس محمد، دورك الآن. كوّن جملتين بـtak-، مثل tak tuku أو tak takon.
    en: Mas Mohamed, your turn. Make two sentences with tak-, like tak tuku or tak takon.
    note:
      ar_eg: دورك! وزوّد lho أو kok عشان الجملة تبقى جاوي بجدّ.
      ar: دورك! وأضف lho أو kok لتصير الجملة جاويّة حقًّا.
      en: Your turn! And add lho or kok to make it truly Javanese.
  - speaker: Mas Galih
    text: 'Contone: Lho, kurmane enak. Tak tuku rong kilo!'
    ar_eg: 'مثلًا: إيه ده، البلح حلو. هشتري كيلوين!'
    ar: 'مثلًا: عجبًا، التمر لذيذ. سأشتري كيلوغرامين!'
    en: 'For example: Hey, the dates are tasty. I''ll buy two kilos!'
  - speaker: Mbak Sekar
    text: PR-mu, rungokna VN saka Cak Heru ing pelajaran, banjur etung pira "lho" lan "kok".
    ar_eg: واجبك، اسمع الفويس نوت بتاعة تشاك هيرو في الدرس، وعدّ كام «lho» و«kok».
    ar: 'واجبك: استمع إلى رسالة تشاك هيرو الصوتية في الدرس، وعُدّ كم «lho» و«kok».'
    en: 'Your homework: listen to Cak Heru''s voice note in the lesson and count the "lho"s and "kok"s.'
  - speaker: Mas Galih
    text: Sesuk kita nang pantai Kenjeran. Siapna basa Suroboyo sing paling kasar, hehe. Nganti ketemu, rek!
    ar_eg: بكرة رايحين شطّ كينجيران. جهّز أجمد سورابايي، هههه. نتقابل يا جدعان!
    ar: غدًا نذهب إلى شاطئ كينجيران. جهّز أقوى سورابايية، هههه. إلى اللقاء!
    en: Tomorrow we hit Kenjeran beach. Get ready for the bluntest Surabaya talk, hehe. See you, mates!
