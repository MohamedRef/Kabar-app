schema: kabar.radio/v1
id: radio.j1.u04
language: jv
level: j1
unit: j1.u04
title:
  target: Sik, tak lapor
  ar_eg: استنّى، هبلّغ
  ar: انتظر، سأبلّغ
  en: Hold on, I'll report
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Jalan Kaliurang
  lines:
  - speaker: Mas Danang
    text: Assalamualaikum lan sugeng enjing saka Jakal! Dalane dawa banget, akeh mahasiswa lan warung.
    ar_eg: السلام عليكم وصباح الخير من جاكال! الشارع طويل أوي، وفيه طلبة ومحلّات أكل كتير.
    ar: السلام عليكم وصباح الخير من جاكال! الشارع طويل جدًّا، وفيه طلّاب ومطاعم صغيرة كثيرة.
    en: Assalamualaikum and good morning from Jakal! The road is so long, full of students and food stalls.
    note:
      ar_eg: "«جاكال» = Jalan Kaliurang، شارع طويل رايح شمال من جنب جامعة UGM لحدّ جبل ميرابي. كلمات: akeh = كتير؛ dalane = الطريق؛ dawa = طويل (بالكراما panjang)."
      ar: "«جاكال» = Jalan Kaliurang، شارع طويل يتّجه شمالًا من جوار جامعة UGM نحو جبل ميرابي. مفردات: akeh = كثير؛ dalane = الطريق؛ dawa = طويل (بالكراما panjang)."
      en: "\"Jakal\" = Jalan Kaliurang, a long road running north past UGM university towards Mount Merapi. Words: akeh = many, a lot (banyak); dalane = the road, its road; dawa = long (krama panjang) = panjang."
  - speaker: Mbak Sekar
    text: Aku Sekar. Mas Mohamed, neng kene ana toko cilik sing adol minyak wangi lan kurma. Kaya neng omah!
    ar_eg: أنا سيكار. يا ماس محمد، هنا فيه محلّ صغيّر بيبيع برفان زيتي وبلح. زي البيت!
    ar: أنا سيكار. يا ماس محمد، هنا محلّ صغير يبيع العطور الزيتية والتمر. كأنّك في بيتك!
    en: I'm Sekar. Mas Mohamed, there's a little shop here that sells perfume oil and dates. Just like home!
    note:
      ar_eg: "كلمات: cilik = صغير؛ kene = هنا (= sini)؛ kurma = بلح، تمر؛ adol = يبيع؛ kaya = زي، كأنّ."
      ar: "مفردات: cilik = صغير؛ kene = هنا (= sini)؛ kurma = تمر؛ adol = يبيع؛ kaya = مثل."
      en: "Words: cilik = small, little = kecil; kene = here (= sini); kurma = dates (the fruit); adol = sell; kaya = like, as = seperti."
  - speaker: Mas Danang
    text: Dina iki kita sinau tak-, di-, lan tembung cilik sing gawe ukara luwih urip. Ta, wae, lho, kok.
    ar_eg: النهارده هنتعلّم tak- وdi-، والكلمات الصغيّرة اللي بتخلّي الجملة حيّة. ta، wae، lho، kok.
    ar: اليوم نتعلّم tak- وdi-، والكلمات الصغيرة التي تجعل الجملة حيّة. ta وwae وlho وkok.
    en: Today we learn tak-, di-, and the little words that bring a sentence to life. Ta, wae, lho, kok.
    note:
      ar_eg: "كلمات: gawe = يعمل / يحضّر (= buat)؛ iki = ده / دي (= ini)؛ dina = يوم، نهار؛ luwih = أكتر (lebih)."
      ar: "مفردات: gawe = يصنع / يُعِدّ (= buat)؛ iki = هذا / هذه (= ini)؛ dina = يوم؛ luwih = أكثر (lebih)."
      en: "Words: gawe = to make (= buat); iki = this (= ini); dina = day; luwih = more (lebih)."
- kind: dialogue
  title: Tuku kurma
  lines:
  - speaker: Mbak Sekar
    text: Danang, kowe bakul kurma, aku tuku, ya.
    ar_eg: يا دانانج، انت بيّاع البلح، وأنا أشتري.
    ar: يا دانانغ، أنت بائع التمر وأنا أشتري.
    en: Danang, you're the date seller, I'm buying.
  - speaker: Mas Danang
    text: Monggo, Mbak! Kurmane enak lho, saka Madinah.
    ar_eg: اتفضّلي يا مباك! البلح حلو على فكرة، من المدينة.
    ar: تفضّلي يا مباك! التمر لذيذ، من المدينة.
    en: Come in, Mbak! These dates are good, you know, from Medina.
  - speaker: Mbak Sekar
    text: Sing iki pira, Mas?
    ar_eg: ده بكام يا ماس؟
    ar: بكم هذا يا ماس؟
    en: How much is this one, Mas?
  - speaker: Mas Danang
    text: Sik, tak takon bosku. Aku isih anyar wae.
    ar_eg: استنّي، أسأل المعلّم بتاعي. أنا لسّه جديد بس.
    ar: انتظري، سأسأل صاحب المحلّ. أنا جديد فحسب.
    en: Hold on, I'll ask my boss. I'm just new.
    note:
      ar_eg: "tak takon = هسأل أنا (tak- = أنا هعمل). wae = بس / وخلاص. كلمات: anyar = جديد."
      ar: "tak takon = سأسأل (tak- = سأفعل أنا). وwae = فقط. مفردات: anyar = جديد."
      en: "tak takon = I'll ask (tak- = I'll do it). wae = just. Words: anyar = new = baru."
  - speaker: Mbak Sekar
    text: Lho, kok suwe? Aku wis ngenteni!
    ar_eg: إيه ده، بتتأخّر ليه؟ أنا مستنّية!
    ar: ما هذا، لماذا تتأخّر؟ لقد انتظرت!
    en: Hey, why so long? I've been waiting!
    note:
      ar_eg: "كلمات: ngenteni = يستنى (حد)؛ suwe = وقت طويل، يتأخّر."
      ar: "مفردات: ngenteni = ينتظر (أحدًا)؛ suwe = طويل (زمنًا)."
      en: "Words: ngenteni = to wait for (menunggu); suwe = long (time) = lama."
  - speaker: Mas Danang
    text: Nyuwun sewu, Mbak. Sik, tak lapor pusat!
    ar_eg: آسف يا مباك. استنّي، أبلّغ الإدارة!
    ar: آسف يا مباك. انتظري، سأبلّغ الإدارة!
    en: Sorry, Mbak. Hold on, I'll report to head office!
    note:
      ar_eg: "«Sik tak lapor pusat» = «استنّى أبلّغ الإدارة» - بقت إفّيه على النت، بيقولوها لمّا حدّ مش عايز ياخد قرار لوحده. كلمات: nyuwun = يطلب (كراما وتواضع؛ ngoko njaluk)؛ sewu = ألف."
      ar: "«Sik tak lapor pusat» = «انتظر، سأبلّغ الإدارة» - صارت نكتة على الإنترنت حين لا يريد أحد اتّخاذ القرار وحده. مفردات: nyuwun = يطلب (كراما وتواضع؛ ngoko njaluk)؛ sewu = ألف."
      en: "\"Sik tak lapor pusat\" = \"hold on, I'll report to head office\" - an online joke for when someone won't decide alone. Words: nyuwun = ask for, request (krama, humble; ngoko njaluk) = minta; sewu = one thousand."
  - speaker: Mbak Sekar
    text: Hahaha! Ya wis, kurmane dibungkus wae, rong kilo.
    ar_eg: ههههه! خلاص، لفّلي البلح، كيلوين.
    ar: ههههه! حسنًا، لُفّ التمر، كيلوغرامين.
    en: Hahaha! Fine, just wrap up the dates, two kilos.
    note:
      ar_eg: "كلمات: dibungkus = متلفوف (تيك أواي)؛ kilo = كيلو؛ rong = اتنين (قبل وحدة)."
      ar: "مفردات: dibungkus = مغلَّف (سفري)؛ kilo = كيلوغرام؛ rong = اثنان (قبل المعدود)."
      en: "Words: dibungkus = wrapped, to take away; kilo = kilo; rong = two (before a unit)."
  - speaker: Mas Danang
    text: "Siap! Tak bungkus. Suwun, ya, Mbak!"
    ar_eg: "تمام! هلفّه. متشكّر يا مباك!"
    ar: "حاضر! سألفّه. شكرًا يا مباك!"
    en: "Got it! I'll wrap them. Thanks, Mbak!"
  - speaker: Mbak Sekar
    text: "Mas Mohamed, krungu ta? \"Tak bungkus\": aku. \"Dibungkus\": kurmane."
    ar_eg: "يا ماس محمد، سمعت؟ «tak bungkus»: أنا اللي بلفّ. «dibungkus»: البلح هو اللي اتلفّ."
    ar: "يا ماس محمد، أسمعت؟ «tak bungkus»: أنا من يلفّ. «dibungkus»: التمر هو الذي لُفّ."
    en: "Mas Mohamed, did you hear? \"Tak bungkus\": I wrap. \"Dibungkus\": the dates get wrapped."
- kind: word_spotlight
  title: Ta, wae, lho, kok
  lines:
  - speaker: Mas Danang
    text: Ta kanggo takon. Wis mangan ta? Kowe ngerti ta?
    ar_eg: ta للسؤال. كلت ولّا إيه؟ انت فاهم ولّا؟
    ar: ta للسؤال. أأكلت؟ أتفهم؟
    en: Ta is for asking. Eaten, have you? You know, right?
    note:
      ar_eg: "كلمات: kanggo = لـ، عشان (نغوكو)."
      ar: "مفردات: kanggo = لِـ، من أجل (نغوكو)."
      en: "Words: kanggo = for (ngoko) = untuk."
  - speaker: Mbak Sekar
    text: Lho kanggo kaget utawa ngelingake. Lho, kowe kok neng kene?
    ar_eg: lho للمفاجأة أو التنبيه. إيه ده، انت هنا ليه؟
    ar: lho للدهشة أو التنبيه. عجبًا، لماذا أنت هنا؟
    en: Lho is for surprise or a reminder. Hey, how come you're here?
    note:
      ar_eg: "كلمات: utawa = أو."
      ar: "مفردات: utawa = أو."
      en: "Words: utawa = or (atau)."
  - speaker: Mas Danang
    text: Kok kanggo "kok bisa?" Kok larang? Kok suwe?
    ar_eg: kok يعني «إزّاي كده؟». غالي ليه؟ اتأخّرت ليه؟
    ar: kok تعني «كيف ذلك؟». لماذا غالٍ؟ لماذا تأخّرت؟
    en: Kok is for "how come?" How come it's pricey? How come so long?
  - speaker: Mbak Sekar
    text: Lan mbok kanggo njaluk alus. Mbok ya ngenteni sedhela.
    ar_eg: وmbok للطلب بلطف. ما تستنّى شويّة كده.
    ar: وmbok للطلب بلطف. ليتك تنتظر قليلًا.
    en: And mbok is for asking softly. Why don't you wait a bit.
    note:
      ar_eg: "الكلمات دي مالهاش ترجمة واحدة، زي «ما» و«بقى» و«يا عمّ» عندنا. اسمعها كتير وهتحسّها. كلمات: alus = رقيق، ناعم."
      ar: "لا ترجمة واحدة لهذه الكلمات، مثل «ما» و«إذن» في العامّية. استمع إليها كثيرًا وستشعر بها. مفردات: alus = رقيق، ليّن، مهذّب."
      en: "These words have no single translation, like Egyptian \"ma\" or \"ba'a\". Hear them a lot and you'll feel them. Words: alus = gentle, refined."
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Sik, tak takon.
    ar_eg: استنّى، أسأل.
    ar: انتظر، سأسأل.
    en: Hold on, I'll ask.
  - speaker: Mas Danang
    text: Sik, tak takon.
    ar_eg: استنّى، أسأل.
    ar: انتظر، سأسأل.
    en: Hold on, I'll ask.
  - speaker: Mbak Sekar
    text: "Tak tuku, ya."
    ar_eg: "هشتريه، ماشي؟"
    ar: "سأشتريه، حسنًا؟"
    en: "I'll buy it, okay."
  - speaker: Mas Danang
    text: "Tak tuku, ya."
    ar_eg: "هشتريه، ماشي؟"
    ar: "سأشتريه، حسنًا؟"
    en: "I'll buy it, okay."
  - speaker: Mbak Sekar
    text: Kurmane tak tuku.
    ar_eg: هشتري البلح.
    ar: سأشتري التمر.
    en: I'll buy the dates.
  - speaker: Mas Danang
    text: Kurmane tak tuku.
    ar_eg: هشتري البلح.
    ar: سأشتري التمر.
    en: I'll buy the dates.
  - speaker: Mbak Sekar
    text: Lho, kok larang?
    ar_eg: إيه ده، غالي ليه كده؟
    ar: عجبًا، لماذا هو غالٍ؟
    en: Hey, how come it's so pricey?
  - speaker: Mas Danang
    text: Lho, kok larang?
    ar_eg: إيه ده، غالي ليه كده؟
    ar: عجبًا، لماذا هو غالٍ؟
    en: Hey, how come it's so pricey?
  - speaker: Mbak Sekar
    text: Kowe wis mangan ta?
    ar_eg: انت كلت ولّا إيه؟
    ar: هل أكلت؟
    en: You've eaten, haven't you?
  - speaker: Mas Danang
    text: Kowe wis mangan ta?
    ar_eg: انت كلت ولّا إيه؟
    ar: هل أكلت؟
    en: You've eaten, haven't you?
  - speaker: Mbak Sekar
    text: Nyuwun sewu, aku telat.
    ar_eg: آسف، اتأخّرت.
    ar: آسف، تأخّرت.
    en: Sorry, I'm late.
    note:
      ar_eg: "كلمات: telat = متأخر."
      ar: "مفردات: telat = متأخر."
      en: "Words: telat = late = terlambat, telat."
  - speaker: Mas Danang
    text: Nyuwun sewu, aku telat.
    ar_eg: آسف، اتأخّرت.
    ar: آسف، تأخّرت.
    en: Sorry, I'm late.
  - speaker: Mbak Sekar
    text: Mbok ya ngenteni sedhela.
    ar_eg: ما تستنّى شويّة.
    ar: ليتك تنتظر قليلًا.
    en: Why don't you wait a moment.
  - speaker: Mas Danang
    text: Mbok ya ngenteni sedhela.
    ar_eg: ما تستنّى شويّة.
    ar: ليتك تنتظر قليلًا.
    en: Why don't you wait a moment.
  - speaker: Mbak Sekar
    text: "Lan di- padha karo basa Indonesia. Dituku, dipangan. Kurmane dipangan Danang!"
    ar_eg: "وdi- زي الإندونيسي. dituku، dipangan. البلح دانانج كله!"
    ar: "وdi- مثل الإندونيسية. dituku وdipangan. التمر أكله دانانغ!"
    en: "And di- is like Indonesian. Dituku, dipangan. The dates got eaten by Danang!"
    note:
      ar_eg: "كلمات: dipangan = يتاكل، اتاكل؛ dituku = يتشتري؛ padha = زي بعض / نفس (= sama)."
      ar: "مفردات: dipangan = يُؤكَل، أُكِل؛ dituku = يُشترى؛ padha = متساوٍ / نفس (= sama)."
      en: "Words: dipangan = to be eaten, eaten (by); dituku = to be bought; padha = same (= sama)."
- kind: outro
  title: Tak lapor Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki gilirane sampeyan. Gawe ukara loro nganggo tak-, contone tak tuku utawa tak takon.
    ar_eg: يا ماس محمد، دلوقتي دورك. اعمل جملتين بـtak-، زي tak tuku أو tak takon.
    ar: يا ماس محمد، دورك الآن. كوّن جملتين بـtak-، مثل tak tuku أو tak takon.
    en: Mas Mohamed, your turn. Make two sentences with tak-, like tak tuku or tak takon.
    note:
      ar_eg: "دورك! وزوّد lho أو kok عشان الجملة تبقى جاوي بجدّ. كلمات: loro = اتنين (dua)؛ قبل ewu: rong؛ nganggo = بـ / بيستخدم؛ saiki = دلوقتي (sekarang)."
      ar: "دورك! وأضف lho أو kok لتصير الجملة جاويّة حقًّا. مفردات: loro = اثنان (dua)؛ قبل ewu: rong؛ nganggo = بـ / يستعمل؛ saiki = الآن (sekarang)."
      en: "Your turn! And add lho or kok to make it truly Javanese. Words: loro = two (dua); before ewu: rong; nganggo = with, using (pakai); saiki = now (sekarang)."
  - speaker: Mas Danang
    text: "Contone: Lho, enak. Tak tuku!"
    ar_eg: "مثلًا: إيه ده، حلو. هشتري!"
    ar: "مثلًا: عجبًا، لذيذ. سأشتري!"
    en: "For example: Hey, tasty. I'll buy some!"
  - speaker: Mbak Sekar
    text: PR-mu, rungokna VN saka Mas Heru ing pelajaran, banjur etung pira "lho" lan "kok".
    ar_eg: واجبك، اسمع الفويس نوت بتاعة ماس هيرو في الدرس، وعدّ كام «lho» و«kok».
    ar: 'واجبك: استمع إلى رسالة ماس هيرو الصوتية في الدرس، وعُدّ كم «lho» و«kok».'
    en: 'Your homework: listen to Mas Heru''s voice note in the lesson and count the "lho"s and "kok"s.'
    note:
      ar_eg: "كلمات: banjur = وبعدين (في الحكي)؛ ing = في (= di)، رسمي ومكتوب."
      ar: "مفردات: banjur = ثم (في السرد)؛ ing = في (= di)، رسمي ومكتوب."
      en: "Words: banjur = then (lalu), in storytelling; ing = in, at (= di), formal / written."
  - speaker: Mas Danang
    text: "Sesuk kita neng pantai Parangtritis. Ombake gedhe! Nganti ketemu, cah!"
    ar_eg: "بكرة رايحين شطّ پارانجتريتيس. الموج عالي! نتقابل يا جماعة!"
    ar: "غدًا نذهب إلى شاطئ بارانغتريتيس. أمواجه عالية! إلى اللقاء يا جماعة!"
    en: "Tomorrow we hit Parangtritis beach. Big waves! See you, guys!"
    note:
      ar_eg: "كلمات: nganti = لحد (= sampai)."
      ar: "مفردات: nganti = حتى (= sampai)."
      en: "Words: nganti = until (= sampai)."
