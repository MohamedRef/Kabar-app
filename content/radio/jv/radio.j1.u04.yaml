review:
  status: draft
  verified: false
  notes: 'Jalan Kaliurang (Jakal), the long road north past the UGM campus: student food stalls and a small shop selling perfume oil and dates (Pak Hasan in the lessons). "Sik tak lapor pusat" is a meme-style phrase; framed as a joke.'
