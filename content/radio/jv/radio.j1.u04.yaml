language: jv
level: j1
unit: j1.u04
title:
  target: Sik, tak lapor
  ar_eg: استنّى، هبلّغ
  ar: انتظر، سأبلّغ
  en: Hold on, I'll report
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Jalan Kaliurang
  lines:
  - speaker: Mas Danang
    text: Assalamualaikum lan sugeng enjing saka Jakal! Dalane dawa banget, akeh mahasiswa lan warung.
    ar_eg: السلام عليكم وصباح الخير من جاكال! الشارع طويل أوي، وفيه طلبة ومحلّات أكل كتير.
    ar: السلام عليكم وصباح الخير من جاكال! الشارع طويل جدًّا، وفيه طلّاب ومطاعم صغيرة كثيرة.
    en: Assalamualaikum and good morning from Jakal! The road is so long, full of students and food stalls.
    note:
      ar_eg: «جاكال» = Jalan Kaliurang، شارع طويل رايح شمال من جنب جامعة UGM لحدّ جبل ميرابي.
      ar: «جاكال» = Jalan Kaliurang، شارع طويل يتّجه شمالًا من جوار جامعة UGM نحو جبل ميرابي.
      en: '"Jakal" = Jalan Kaliurang, a long road running north past UGM university towards Mount Merapi.'
  - speaker: Mbak Sekar
    text: Aku Sekar. Mas Mohamed, neng kene ana toko cilik sing adol minyak wangi lan kurma. Kaya neng omah!
    ar_eg: أنا سيكار. يا ماس محمد، هنا فيه محلّ صغيّر بيبيع برفان زيتي وبلح. زي البيت!
    ar: أنا سيكار. يا ماس محمد، هنا محلّ صغير يبيع العطور الزيتية والتمر. كأنّك في بيتك!
    en: I'm Sekar. Mas Mohamed, there's a little shop here that sells perfume oil and dates. Just like home!
  - speaker: Mas Danang
    text: Dina iki kita sinau tak-, di-, lan tembung cilik sing gawe ukara luwih urip. Ta, wae, lho, kok.
    ar_eg: النهارده هنتعلّم tak- وdi-، والكلمات الصغيّرة اللي بتخلّي الجملة حيّة. ta، wae، lho، kok.
    ar: اليوم نتعلّم tak- وdi-، والكلمات الصغيرة التي تجعل الجملة حيّة. ta وwae وlho وkok.
    en: Today we learn tak-, di-, and the little words that bring a sentence to life. Ta, wae, lho, kok.
- kind: dialogue
  title: Tuku kurma
  lines:
  - speaker: Mbak Sekar
    text: Danang, kowe bakul kurma, aku tuku, ya.
    ar_eg: يا دانانج، انت بيّاع البلح، وأنا أشتري.
    ar: يا دانانغ، أنت بائع التمر وأنا أشتري.
    en: Danang, you're the date seller, I'm buying.
  - speaker: Mas Danang
    text: Monggo, Mbak! Kurmane enak lho, saka Madinah.
    ar_eg: اتفضّلي يا مباك! البلح حلو على فكرة، من المدينة.
    ar: تفضّلي يا مباك! التمر لذيذ، من المدينة.
    en: Come in, Mbak! These dates are good, you know, from Medina.
  - speaker: Mbak Sekar
    text: Sing iki pira, Mas?
    ar_eg: ده بكام يا ماس؟
    ar: بكم هذا يا ماس؟
    en: How much is this one, Mas?
  - speaker: Mas Danang
    text: Sik, tak takon bosku. Aku isih anyar wae.
    ar_eg: استنّي، أسأل المعلّم بتاعي. أنا لسّه جديد بس.
    ar: انتظري، سأسأل صاحب المحلّ. أنا جديد فحسب.
    en: Hold on, I'll ask my boss. I'm just new.
    note:
      ar_eg: tak takon = هسأل أنا (tak- = أنا هعمل). wae = بس / وخلاص.
      ar: tak takon = سأسأل (tak- = سأفعل أنا). وwae = فقط.
      en: tak takon = I'll ask (tak- = I'll do it). wae = just.
  - speaker: Mbak Sekar
    text: Lho, kok suwe? Aku wis ngenteni!
    ar_eg: إيه ده، بتتأخّر ليه؟ أنا مستنّية!
    ar: ما هذا، لماذا تتأخّر؟ لقد انتظرت!
    en: Hey, why so long? I've been waiting!
  - speaker: Mas Danang
    text: Nyuwun sewu, Mbak. Sik, tak lapor pusat!
    ar_eg: آسف يا مباك. استنّي، أبلّغ الإدارة!
    ar: آسف يا مباك. انتظري، سأبلّغ الإدارة!
    en: Sorry, Mbak. Hold on, I'll report to head office!
    note:
      ar_eg: «Sik tak lapor pusat» = «استنّى أبلّغ الإدارة» - بقت إفّيه على النت، بيقولوها لمّا حدّ مش عايز ياخد قرار لوحده.
      ar: «Sik tak lapor pusat» = «انتظر، سأبلّغ الإدارة» - صارت نكتة على الإنترنت حين لا يريد أحد اتّخاذ القرار وحده.
      en: '"Sik tak lapor pusat" = "hold on, I''ll report to head office" - an online joke for when someone won''t decide alone.'
  - speaker: Mbak Sekar
    text: Hahaha! Ya wis, kurmane dibungkus wae, rong kilo.
    ar_eg: ههههه! خلاص، لفّلي البلح، كيلوين.
    ar: ههههه! حسنًا، لُفّ التمر، كيلوغرامين.
    en: Hahaha! Fine, just wrap up the dates, two kilos.
  - speaker: Mas Danang
    text: Siap! Kurmane tak bungkus. Suwun, ya, Mbak!
    ar_eg: تمام! هلفّ البلح. متشكّر يا مباك!
    ar: حاضر! سألفّ التمر. شكرًا يا مباك!
    en: Got it! I'll wrap the dates. Thanks, Mbak!
  - speaker: Mbak Sekar
    text: Mas Mohamed, krungu ta? Tak bungkus, aku sing mbungkus. Dibungkus, kurmane sing dibungkus.
    ar_eg: يا ماس محمد، سمعت؟ «tak bungkus» أنا اللي هلفّ. «dibungkus» البلح هو اللي يتلفّ.
    ar: يا ماس محمد، أسمعت؟ «tak bungkus» أنا من سيلفّ. و«dibungkus» التمر هو الذي يُلفّ.
    en: Mas Mohamed, did you hear? Tak bungkus, I wrap it. Dibungkus, the dates get wrapped.
- kind: word_spotlight
  title: Ta, wae, lho, kok
  lines:
  - speaker: Mas Danang
    text: Ta kanggo takon. Wis mangan ta? Kowe ngerti ta?
    ar_eg: ta للسؤال. كلت ولّا إيه؟ انت فاهم ولّا؟
    ar: ta للسؤال. أأكلت؟ أتفهم؟
    en: Ta is for asking. Eaten, have you? You know, right?
  - speaker: Mbak Sekar
    text: Lho kanggo kaget utawa ngelingake. Lho, kowe kok neng kene?
    ar_eg: lho للمفاجأة أو التنبيه. إيه ده، انت هنا ليه؟
    ar: lho للدهشة أو التنبيه. عجبًا، لماذا أنت هنا؟
    en: Lho is for surprise or a reminder. Hey, how come you're here?
  - speaker: Mas Danang
    text: Kok kanggo "kok bisa?" Kok larang? Kok suwe?
    ar_eg: kok يعني «إزّاي كده؟». غالي ليه؟ اتأخّرت ليه؟
    ar: kok تعني «كيف ذلك؟». لماذا غالٍ؟ لماذا تأخّرت؟
    en: Kok is for "how come?" How come it's pricey? How come so long?
  - speaker: Mbak Sekar
    text: Lan mbok kanggo njaluk alus. Mbok ya ngenteni sedhela.
    ar_eg: وmbok للطلب بلطف. ما تستنّى شويّة كده.
    ar: وmbok للطلب بلطف. ليتك تنتظر قليلًا.
    en: And mbok is for asking softly. Why don't you wait a bit.
    note:
      ar_eg: الكلمات دي مالهاش ترجمة واحدة، زي «ما» و«بقى» و«يا عمّ» عندنا. اسمعها كتير وهتحسّها.
      ar: لا ترجمة واحدة لهذه الكلمات، مثل «ما» و«إذن» في العامّية. استمع إليها كثيرًا وستشعر بها.
      en: These words have no single translation, like Egyptian "ma" or "ba'a". Hear them a lot and you'll feel them.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Sik, tak takon.
    ar_eg: استنّى، أسأل.
    ar: انتظر، سأسأل.
    en: Hold on, I'll ask.
  - speaker: Mas Danang
    text: Sik, tak takon.
    ar_eg: استنّى، أسأل.
    ar: انتظر، سأسأل.
    en: Hold on, I'll ask.
  - speaker: Mbak Sekar
    text: Kurmane tak tuku.
    ar_eg: هشتري البلح.
    ar: سأشتري التمر.
    en: I'll buy the dates.
  - speaker: Mas Danang
    text: Kurmane tak tuku.
    ar_eg: هشتري البلح.
    ar: سأشتري التمر.
    en: I'll buy the dates.
  - speaker: Mbak Sekar
    text: Lho, kok larang?
    ar_eg: إيه ده، غالي ليه كده؟
    ar: عجبًا، لماذا هو غالٍ؟
    en: Hey, how come it's so pricey?
  - speaker: Mas Danang
    text: Lho, kok larang?
    ar_eg: إيه ده، غالي ليه كده؟
    ar: عجبًا، لماذا هو غالٍ؟
    en: Hey, how come it's so pricey?
  - speaker: Mbak Sekar
    text: Kowe wis mangan ta?
    ar_eg: انت كلت ولّا إيه؟
    ar: هل أكلت؟
    en: You've eaten, haven't you?
  - speaker: Mas Danang
    text: Kowe wis mangan ta?
    ar_eg: انت كلت ولّا إيه؟
    ar: هل أكلت؟
    en: You've eaten, haven't you?
  - speaker: Mbak Sekar
    text: Nyuwun sewu, aku telat.
    ar_eg: آسف، اتأخّرت.
    ar: آسف، تأخّرت.
    en: Sorry, I'm late.
  - speaker: Mas Danang
    text: Nyuwun sewu, aku telat.
    ar_eg: آسف، اتأخّرت.
    ar: آسف، تأخّرت.
    en: Sorry, I'm late.
  - speaker: Mbak Sekar
    text: Mbok ya ngenteni sedhela.
    ar_eg: ما تستنّى شويّة.
    ar: ليتك تنتظر قليلًا.
    en: Why don't you wait a moment.
  - speaker: Mas Danang
    text: Mbok ya ngenteni sedhela.
    ar_eg: ما تستنّى شويّة.
    ar: ليتك تنتظر قليلًا.
    en: Why don't you wait a moment.
  - speaker: Mbak Sekar
    text: Lan di- padha karo basa Indonesia. Dituku, digawa, dipangan. Kurmane dipangan Danang!
    ar_eg: وdi- زي الإندونيسي. dituku، digawa، dipangan. البلح دانانج كله!
    ar: وdi- مثل الإندونيسية. dituku وdigawa وdipangan. التمر أكله دانانغ!
    en: And di- is like Indonesian. Dituku, digawa, dipangan. The dates got eaten by Danang!
- kind: outro
  title: Tak lapor Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki gilirane sampeyan. Gawe ukara loro nganggo tak-, contone tak tuku utawa tak takon.
    ar_eg: يا ماس محمد، دلوقتي دورك. اعمل جملتين بـtak-، زي tak tuku أو tak takon.
    ar: يا ماس محمد، دورك الآن. كوّن جملتين بـtak-، مثل tak tuku أو tak takon.
    en: Mas Mohamed, your turn. Make two sentences with tak-, like tak tuku or tak takon.
    note:
      ar_eg: دورك! وزوّد lho أو kok عشان الجملة تبقى جاوي بجدّ.
      ar: دورك! وأضف lho أو kok لتصير الجملة جاويّة حقًّا.
      en: Your turn! And add lho or kok to make it truly Javanese.
  - speaker: Mas Danang
    text: 'Contone: Lho, kurmane enak. Tak tuku rong kilo!'
    ar_eg: 'مثلًا: إيه ده، البلح حلو. هشتري كيلوين!'
    ar: 'مثلًا: عجبًا، التمر لذيذ. سأشتري كيلوغرامين!'
    en: 'For example: Hey, the dates are tasty. I''ll buy two kilos!'
  - speaker: Mbak Sekar
    text: PR-mu, rungokna VN saka Mas Heru ing pelajaran, banjur etung pira "lho" lan "kok".
    ar_eg: واجبك، اسمع الفويس نوت بتاعة ماس هيرو في الدرس، وعدّ كام «lho» و«kok».
    ar: 'واجبك: استمع إلى رسالة ماس هيرو الصوتية في الدرس، وعُدّ كم «lho» و«kok».'
    en: 'Your homework: listen to Mas Heru''s voice note in the lesson and count the "lho"s and "kok"s.'
  - speaker: Mas Danang
    text: Sesuk kita neng pantai Parangtritis. Pasire ireng, ombake gedhe! Nganti ketemu, cah!
    ar_eg: بكرة رايحين شطّ پارانجتريتيس. الرملة سودا والموج عالي! نتقابل يا جماعة!
    ar: غدًا نذهب إلى شاطئ بارانغتريتيس. رماله سوداء وأمواجه عالية! إلى اللقاء يا جماعة!
    en: Tomorrow we hit Parangtritis beach. Black sand, big waves! See you, guys!
