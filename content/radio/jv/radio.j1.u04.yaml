review:
  status: draft
  verified: false
  notes: 'Ampel quarter: Sunan Ampel mosque (15th century, one of the Wali Sanga); dates, perfume and Arab-Javanese families. "Sek tak lapor pusat" is a meme-style phrase; framed as a joke.'
