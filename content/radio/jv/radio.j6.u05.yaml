title:
  target: Murda, rekan lan angka
  ar_eg: الحروف الكبيرة والعربية والأرقام
  ar: الحروف الكبرى والعربية والأرقام
  en: Murda, rekan and numerals
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Undhak-undhakan Imogiri
  lines:
  - speaker: Mbak Sekar
    text: Assalamualaikum saking Imogiri. Kula Sekar. Ing ngarep kita ana undhak-undhakan, cacahe patang atus sanga.
    ar_eg: السلام عليكم من إيموجيري. أنا سيكار. قدّامنا سلالم، عددها أربعمية وتسعة.
    ar: السلام عليكم من إيموغيري. أنا سيكار. أمامنا درجات عددها أربعمئة وتسع.
    en: Assalamualaikum from Imogiri. I'm Sekar. In front of us are steps, four hundred and nine of them.
  - speaker: Mas Danang
    text: Waalaikumsalam. Aku Danang... lan aku wis kesel sadurunge munggah, hehe.
    ar_eg: وعليكم السلام. أنا دانانج... وأنا تعبت قبل ما أطلع، هههه.
    ar: وعليكم السلام. أنا دانانغ... وتعبت قبل أن أصعد، هههه.
    en: Waalaikumsalam. I'm Danang... and I'm tired before I've even climbed, hehe.
  - speaker: Mbak Sekar
    text: Ing nduwur ana makam Sultan Agung lan raja-raja Mataram sabanjure.
    ar_eg: فوق فيه قبر السلطان أجونج والملوك اللي جم بعده في ماتارام.
    ar: في الأعلى قبر السلطان أغونغ وملوك ماتارام من بعده.
    en: At the top are the tombs of Sultan Agung and the later kings of Mataram.
    note:
      ar_eg: السلطان أجونج أعظم ملوك ماتارام، وهو اللي جمع التقويم الجاوي مع التقويم الهجري.
      ar: السلطان أغونغ أعظم ملوك ماتارام، وهو من دمج التقويم الجاويّ بالتقويم الهجريّ.
      en: Sultan Agung was Mataram's greatest king; he merged the Javanese calendar with the Hijri one.
  - speaker: Mas Danang
    text: 'Dina iki ana telung bab: aksara murda, aksara rekan, lan angka Jawa. Ayo munggah karo sinau!'
    ar_eg: 'النهارده تلات حاجات: الحروف الكبيرة، والحروف العربية، والأرقام الجاوي. يلّا نطلع ونتعلّم!'
    ar: 'اليوم ثلاثة أبواب: الحروف الكبرى والحروف العربية والأرقام الجاوية. هيّا نصعد ونتعلّم!'
    en: 'Today, three topics: honorific capitals, Arabic-sound letters and Javanese numerals. Let''s climb and learn!'
- kind: dialogue
  title: Karo juru kunci
  lines:
  - speaker: Mbak Sekar
    text: Iki Pak Harjo, juru kunci ing Imogiri. Sugeng enjing, Pak.
    ar_eg: ده باك هارجو، حارس المقابر في إيموجيري. صباح الخير يا باك.
    ar: هذا باك هارجو، حارس مقابر إيموغيري. صباح الخير يا باك.
    en: This is Pak Harjo, the tomb keeper at Imogiri. Good morning, Pak.
    note:
      ar_eg: juru kunci = «صاحب المفتاح»، الحارس اللي بيرعى المكان المقدّس. باك هارجو هنا بيلعب دور الحارس في المسلسل كمان.
      ar: juru kunci «صاحب المفتاح»، حارس المكان المقدّس، وهو دور باك هارجو في المسلسل أيضًا.
      en: Juru kunci, "key holder", is the keeper of a sacred site. Pak Harjo plays this role in the Sinetron too.
  - speaker: Mas Danang
    text: Pak, ing papan iku, kenapa aksara Sultan beda, luwih gedhe?
    ar_eg: يا باك، على اليافطة دي، ليه حروف «سلطان» شكلها مختلف، أكبر؟
    ar: يا باك، على تلك اللوحة، لماذا حروف «سلطان» مختلفة وأكبر؟
    en: Pak, on that sign, why are the letters of "Sultan" different, bigger?
  - speaker: Mbak Sekar
    text: Pak Harjo ngendika, iku aksara murda. Kanggo jeneng wong sing diajeni, kaya raja lan Sultan.
    ar_eg: باك هارجو بيقول دي الحروف الكبيرة. للأسامي المحترمة، زي الملوك والسلطان.
    ar: يقول باك هارجو إنّها الحروف الكبرى، لأسماء المبجّلين كالملوك والسلطان.
    en: Pak Harjo says those are honorific capitals. For the names of honoured people, like kings and Sultans.
    note:
      ar_eg: ꦯꦸꦭ꧀ꦠꦤ꧀ = Sultan، بحرف sa murda ꦯ. مش كلّ حرف ليه murda، بس فيه حروف قليلة.
      ar: ꦯꦸꦭ꧀ꦠꦤ꧀ = Sultan بحرف sa murda ꦯ، ولبعض الحروف فقط صيغة murda.
      en: ꦯꦸꦭ꧀ꦠꦤ꧀ = Sultan, with sa murda ꦯ. Only some letters have a murda form.
  - speaker: Mas Danang
    text: Lan ing papan pengumuman pengajian, aku weruh tembung "dzikir". Aksarane aneh.
    ar_eg: وعلى يافطة إعلان الدرس الديني، شفت كلمة dzikir. حروفها غريبة.
    ar: وعلى لوحة إعلان الدرس الدينيّ رأيت كلمة dzikir، وحروفها غريبة.
    en: And on the religious-class notice, I saw the word "dzikir". Its letters are odd.
  - speaker: Mbak Sekar
    text: 'Iku aksara rekan, kanggo swara saka basa Arab: kha, dza, fa, za, gha. Ana titik telu ing dhuwure.'
    ar_eg: 'دي الحروف العربية، لأصوات جاية من العربي: kha dza fa za gha. فوقها تلات نقط.'
    ar: 'هذه حروف rekan لأصوات عربية: kha وdza وfa وza وgha، وفوقها ثلاث نقاط.'
    en: 'Those are rekan letters, for sounds from Arabic: kha, dza, fa, za, gha. They have three dots on top.'
    note:
      ar_eg: 'ꦢ꦳ꦶꦏꦶꦂ = dzikir: حرف da وفوقه علامة النقط ꦳ عشان يبقى ذ. انت أصلًا عارف الأصوات دي كلّها!'
      ar: 'ꦢ꦳ꦶꦏꦶꦂ = dzikir: حرف da وفوقه علامة ꦳ ليصير ذالًا. أنت تعرف هذه الأصوات أصلًا!'
      en: 'ꦢ꦳ꦶꦏꦶꦂ = dzikir: da plus the dots mark ꦳ to make dh as in Arabic dhal. You already know all these sounds!'
  - speaker: Mas Danang
    text: Kaya "zakat" lan "fajar" uga?
    ar_eg: زي zakat وfajar برضه؟
    ar: ومثلها zakat وfajar؟
    en: Like "zakat" and "fajar" too?
  - speaker: Mbak Sekar
    text: Leres. Saiki angka. Tanggal ing papan iku, telung angka, ana tandha pada pangkat ing kiwa tengen.
    ar_eg: صحّ. دلوقتي الأرقام. التاريخ اللي على اليافطة دي، تلات أرقام، وحواليهم علامة pada pangkat يمين وشمال.
    ar: 'صحيح. والآن الأرقام: التاريخ على اللوحة ثلاثة أرقام، وحولها علامة pada pangkat يمينًا ويسارًا.'
    en: Right. Now numbers. The date on that sign, three digits, has the pada pangkat mark on both sides.
    note:
      ar_eg: ꧇꧔꧐꧙꧇ = 409، عدد السلالم! العلامة ꧇ بتحضن الرقم عشان ماتلخبطوش مع الحروف.
      ar: ꧇꧔꧐꧙꧇ = 409 عدد الدرجات! والعلامة ꧇ تحيط بالرقم كي لا يختلط بالحروف.
      en: ꧇꧔꧐꧙꧇ = 409, the number of steps! The ꧇ mark wraps numbers so they aren't confused with letters.
- kind: word_spotlight
  title: Murda, rekan, angka
  lines:
  - speaker: Mbak Sekar
    text: Aksara murda kanggo ngajeni. Aksara rekan kanggo swara Arab. Angka Jawa diapit pada pangkat.
    ar_eg: الحروف الكبيرة للاحترام. الحروف العربية للأصوات العربي. والأرقام الجاوي محوطة بالـ pada pangkat.
    ar: الحروف الكبرى للتبجيل، وrekan للأصوات العربية، والأرقام الجاوية تحيط بها pada pangkat.
    en: Murda letters for respect. Rekan letters for Arabic sounds. Javanese numerals wrapped in pada pangkat.
  - speaker: Mas Danang
    text: 'Juru kunci: sing njaga makam. Undhak-undhakan: tangga. Patang atus sanga, cah!'
    ar_eg: 'juru kunci: حارس المقابر. undhak-undhakan: سلالم. أربعمية وتسعة يا جماعة!'
    ar: 'juru kunci: حارس المقابر. undhak-undhakan: درجات. أربعمئة وتسع!'
    en: 'Juru kunci: the tomb keeper. Undhak-undhakan: steps. Four hundred and nine, folks!'
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Sultan nganggo aksara murda.
    ar_eg: سلطان بالحرف الكبير.
    ar: سلطان بالحرف الأكبر.
    en: Sultan in honorific capitals.
  - speaker: Mas Danang
    text: Sultan nganggo aksara murda.
    ar_eg: سلطان بالحرف الكبير.
    ar: سلطان بالحرف الأكبر.
    en: Sultan in honorific capitals.
  - speaker: Mbak Sekar
    text: Dzikir nganggo aksara rekan.
    ar_eg: ذكر بالحرف العربي.
    ar: ذكر بحرف rekan.
    en: Dzikir with rekan letters.
  - speaker: Mas Danang
    text: Dzikir nganggo aksara rekan.
    ar_eg: ذكر بالحرف العربي.
    ar: ذكر بحرف rekan.
    en: Dzikir with rekan letters.
  - speaker: Mbak Sekar
    text: Patang atus sanga undhak-undhakan.
    ar_eg: أربعمية وتسع سلالم.
    ar: أربعمئة وتسع درجات.
    en: Four hundred and nine steps.
  - speaker: Mas Danang
    text: Patang atus sanga undhak-undhakan.
    ar_eg: أربعمية وتسع سلالم.
    ar: أربعمئة وتسع درجات.
    en: Four hundred and nine steps.
  - speaker: Mbak Sekar
    text: 'Siji maneh saka pengumuman pengajian: "fajar". Fa iku aksara rekan, pa nganggo titik telu.'
    ar_eg: 'كمان واحدة من إعلان الدرس الديني: fajar. الـ fa حرف عربي، pa وفوقها تلات نقط.'
    ar: 'وأخرى من إعلان الدرس: fajar. fa حرف rekan، أي pa فوقها ثلاث نقاط.'
    en: 'One more from the religious-class notice: "fajar". Fa is a rekan letter, pa with three dots.'
  - speaker: Mas Danang
    text: Pengajian sawise salat subuh, nalika fajar. Aku mesthi isih turu, cah!
    ar_eg: الدرس بعد صلاة الصبح، وقت الفجر. أنا أكيد هكون لسّه نايم يا جماعة!
    ar: الدرس بعد صلاة الصبح وقت الفجر. سأكون نائمًا حتمًا!
    en: The class is after dawn prayer, at fajar. I'll definitely still be asleep, folks!
- kind: outro
  title: Kertu pos saka Imogiri
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, Mohamed iku jeneng Arab. Apa ana swara Arab ing jenengmu? Ora, kabeh aksara biasa!
    ar_eg: يا ماس محمد، محمد اسم عربي. فيه صوت عربي مخصوص في اسمك؟ لأ، كلّه حروف عادية!
    ar: يا ماس محمد، محمد اسم عربيّ. هل فيه صوت عربيّ خاصّ؟ لا، كلّه حروف عادية!
    en: Mas Mohamed, Mohamed is an Arabic name. Is there an Arabic-only sound in it? No, all ordinary letters!
    note:
      ar_eg: 'بس اسم «خالد» أو «فاطمة» محتاج حروف rekan: kha وfa.'
      ar: 'أمّا «خالد» أو «فاطمة» فيحتاجان حروف rekan: kha وfa.'
      en: 'But Khalid or Fatimah would need rekan letters: kha and fa.'
  - speaker: Mbak Sekar
    text: PR-ne, wacanen kertu pos saka Imogiri ing pelajaran, lan tulisen tanggal dina iki nganggo angka Jawa.
    ar_eg: الواجب، اقرا الكارت بوستال اللي من إيموجيري في الدرس، واكتب تاريخ النهارده بالأرقام الجاوي.
    ar: 'الواجب: اقرأ البطاقة البريدية من إيموغيري في الدرس، واكتب تاريخ اليوم بالأرقام الجاوية.'
    en: 'Homework: read the postcard from Imogiri in the lesson, and write today''s date in Javanese numerals.'
  - speaker: Mbak Sekar
    text: 'Sesuk episode pungkasan: Plered lan aksara Pegon. Sampeyan wis ngerti hurufe! Nganti pinanggih malih!'
    ar_eg: 'بكرة آخر حلقة: بليريد والحروف الپيجون. وانت عارف الحروف دي أصلًا! إلى اللقاء!'
    ar: 'غدًا الحلقة الأخيرة: بليريد وحروف بيغون، وأنت تعرف حروفها أصلًا! إلى اللقاء!'
    en: 'Tomorrow, the last episode: Plered and Pegon. You already know its letters! Until next time!'
