schema: kabar.radio/v1
id: radio.j1.u02
language: jv
level: j1
unit: j1.u02
title:
  target: Sapa kowe?
  ar_eg: انت مين؟
  ar: من أنت؟
  en: Who are you?
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Stasiun Gubeng
  lines:
  - speaker: Mas Galih
    text: Sugeng enjing, rek! Kabar Radio saiki ana ing ngarep stasiun Gubeng. Aku Galih.
    ar_eg: صباح الخير يا جدعان! كبار راديو دلوقتي قدّام محطّة جوبينج. أنا جاليه.
    ar: صباح الخير يا رفاق! كبار راديو الآن أمام محطّة غوبينغ. أنا غاليه.
    en: Good morning, everyone! Kabar Radio is outside Gubeng station now. I'm Galih.
  - speaker: Mbak Sekar
    text: Aku Sekar. Ing kene akeh wong teka lan lunga. Akeh wong anyar, akeh pitakon!
    ar_eg: أنا سيكار. هنا ناس كتير جايّة ورايحة. ناس جديدة كتير، وأسئلة كتير!
    ar: أنا سيكار. هنا يأتي ويذهب كثيرون. وجوه جديدة كثيرة وأسئلة كثيرة!
    en: I'm Sekar. Lots of people come and go here. Lots of new faces, lots of questions!
  - speaker: Mas Galih
    text: Dina iki kita sinau tembung pitakon. Apa, sapa, ngendi, kapan, piye, pira.
    ar_eg: النهارده هنتعلّم كلمات السؤال. إيه، مين، فين، إمتى، إزّاي، كام.
    ar: اليوم نتعلّم كلمات السؤال. ماذا، من، أين، متى، كيف، كم.
    en: Today we learn question words. What, who, where, when, how, how much.
  - speaker: Mbak Sekar
    text: 'Mas Mohamed, kabar apik: akeh sing padha karo basa Indonesia!'
    ar_eg: 'يا ماس محمد، خبر حلو: كتير منهم زي الإندونيسي!'
    ar: 'يا ماس محمد، خبر سارّ: كثير منها مثل الإندونيسية!'
    en: 'Mas Mohamed, good news: many are like Indonesian!'
    note:
      ar_eg: apa = apa، sapa = siapa، ngendi = di mana، kapan = kapan، piye = bagaimana، pira = berapa. لو بتعرف إندونيسي، نصّ الشغل خلص.
      ar: apa = apa، وsapa = siapa، وngendi = di mana، وkapan = kapan، وpiye = bagaimana، وpira = berapa. إن كنت تعرف الإندونيسية فنصف العمل منجز.
      en: apa = apa, sapa = siapa, ngendi = di mana, kapan = kapan, piye = bagaimana, pira = berapa. If you know Indonesian, half the work is done.
- kind: dialogue
  title: Kenalan ing warung kopi
  lines:
  - speaker: Mbak Sekar
    text: Galih, aku dadi turis, kowe dadi bakul kopi, ya.
    ar_eg: يا جاليه، أنا أبقى سايحة، وانت بيّاع القهوة.
    ar: يا غاليه، أنا سائحة وأنت بائع القهوة.
    en: Galih, I'm a tourist, you're the coffee seller.
  - speaker: Mas Galih
    text: Monggo, Mbak, ngopi sik. Jenengmu sapa?
    ar_eg: اتفضّلي يا مباك، اشربي قهوة الأول. اسمك إيه؟
    ar: تفضّلي يا مباك، اشربي قهوة أوّلًا. ما اسمك؟
    en: Come in, Mbak, have a coffee first. What's your name?
  - speaker: Mbak Sekar
    text: Jenengku Sekar. Sampeyan sapa, Mas?
    ar_eg: اسمي سيكار. وانت مين يا ماس؟
    ar: اسمي سيكار. ومن أنت يا ماس؟
    en: My name's Sekar. And who are you, Mas?
  - speaker: Mas Galih
    text: Aku Galih. Kowe saka ngendi?
    ar_eg: أنا جاليه. انتي منين؟
    ar: أنا غاليه. من أين أنتِ؟
    en: I'm Galih. Where are you from?
  - speaker: Mbak Sekar
    text: Aku saka Solo. Saiki nyambut gawe ing Suroboyo.
    ar_eg: أنا من سولو. دلوقتي بشتغل في سورابايا.
    ar: أنا من سولو، وأعمل الآن في سورابايا.
    en: I'm from Solo. I work in Surabaya now.
  - speaker: Mas Galih
    text: Nyambut gawe apa?
    ar_eg: بتشتغلي إيه؟
    ar: ما عملك؟
    en: What do you do?
  - speaker: Mbak Sekar
    text: Aku guru. Kopi iki pira, Mas?
    ar_eg: أنا مدرّسة. القهوة دي بكام يا ماس؟
    ar: أنا معلّمة. بكم هذه القهوة يا ماس؟
    en: I'm a teacher. How much is this coffee, Mas?
  - speaker: Mas Galih
    text: Limang ewu wae. Kapan kowe bali nang Solo?
    ar_eg: خمسة آلاف بس. هترجعي سولو إمتى؟
    ar: خمسة آلاف فقط. متى تعودين إلى سولو؟
    en: Just five thousand. When are you going back to Solo?
  - speaker: Mbak Sekar
    text: Sesuk esuk, numpak sepur saka Gubeng.
    ar_eg: بكرة الصبح، بالقطر من جوبينج.
    ar: غدًا صباحًا، بالقطار من غوبينغ.
    en: Tomorrow morning, by train from Gubeng.
  - speaker: Mas Galih
    text: Wah, apik. Piye kopine? Enak ta?
    ar_eg: حلو. القهوة إيه رأيك فيها؟ حلوة؟
    ar: جميل. ما رأيك في القهوة؟ لذيذة؟
    en: Nice. How's the coffee? Good?
  - speaker: Mbak Sekar
    text: Enak banget! Suwun, Mas Galih.
    ar_eg: حلوة أوي! متشكّرة يا ماس جاليه.
    ar: لذيذة جدًّا! شكرًا يا ماس غاليه.
    en: Really good! Thanks, Mas Galih.
- kind: word_spotlight
  title: Jenengku, saka, nyambut gawe
  lines:
  - speaker: Mas Galih
    text: Jenengku, jenengmu. Aku lan kowe dadi -ku lan -mu.
    ar_eg: اسمي، اسمك. aku وkowe بيبقوا -ku و-mu.
    ar: اسمي، اسمك. aku وkowe تصيران -ku و-mu.
    en: Jenengku, jenengmu. Aku and kowe become -ku and -mu.
    note:
      ar_eg: -ku = ـي (بتاعي)، -mu = ـك (بتاعك). jenengku = اسمي، omahmu = بيتك.
      ar: -ku = ياء المتكلّم، و-mu = كاف المخاطب. jenengku = اسمي، وomahmu = بيتك.
      en: -ku = my, -mu = your. jenengku = my name, omahmu = your house.
  - speaker: Mbak Sekar
    text: Saka ngendi? Saka Mesir, saka Kairo, saka Solo.
    ar_eg: منين؟ من مصر، من القاهرة، من سولو.
    ar: من أين؟ من مصر، من القاهرة، من سولو.
    en: From where? From Egypt, from Cairo, from Solo.
  - speaker: Mas Galih
    text: Nyambut gawe apa? Aku guru, aku dokter, aku penerjemah.
    ar_eg: بتشتغل إيه؟ أنا مدرّس، أنا دكتور، أنا مترجم.
    ar: ما عملك؟ أنا معلّم، أنا طبيب، أنا مترجم.
    en: What do you do? I'm a teacher, a doctor, a translator.
  - speaker: Mbak Sekar
    text: Lan "ngopi" iku ngombe kopi. Ing Jawa Timur, ngopi iku acara karo kanca!
    ar_eg: و«ngopi» يعني تشرب قهوة. في جاوة الشرقية، القعدة على القهوة دي مناسبة مع الصحاب!
    ar: و«ngopi» أي شرب القهوة. وفي جاوة الشرقية جلسة القهوة مناسبة مع الأصدقاء!
    en: And "ngopi" means having coffee. In East Java, ngopi is a get-together with friends!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Jenengmu sapa?
    ar_eg: اسمك إيه؟
    ar: ما اسمك؟
    en: What's your name?
  - speaker: Mas Galih
    text: Jenengmu sapa?
    ar_eg: اسمك إيه؟
    ar: ما اسمك؟
    en: What's your name?
  - speaker: Mbak Sekar
    text: Kowe saka ngendi?
    ar_eg: انت منين؟
    ar: من أين أنت؟
    en: Where are you from?
  - speaker: Mas Galih
    text: Kowe saka ngendi?
    ar_eg: انت منين؟
    ar: من أين أنت؟
    en: Where are you from?
  - speaker: Mbak Sekar
    text: Aku saka Mesir.
    ar_eg: أنا من مصر.
    ar: أنا من مصر.
    en: I'm from Egypt.
  - speaker: Mas Galih
    text: Aku saka Mesir.
    ar_eg: أنا من مصر.
    ar: أنا من مصر.
    en: I'm from Egypt.
  - speaker: Mbak Sekar
    text: Kopi iki pira?
    ar_eg: القهوة دي بكام؟
    ar: بكم هذه القهوة؟
    en: How much is this coffee?
  - speaker: Mas Galih
    text: Kopi iki pira?
    ar_eg: القهوة دي بكام؟
    ar: بكم هذه القهوة؟
    en: How much is this coffee?
  - speaker: Mbak Sekar
    text: Aku nyambut gawe dadi penerjemah.
    ar_eg: أنا شغّال مترجم.
    ar: أعمل مترجمًا.
    en: I work as a translator.
  - speaker: Mas Galih
    text: Aku nyambut gawe dadi penerjemah.
    ar_eg: أنا شغّال مترجم.
    ar: أعمل مترجمًا.
    en: I work as a translator.
  - speaker: Mbak Sekar
    text: Kapan kowe bali?
    ar_eg: هترجع إمتى؟
    ar: متى تعود؟
    en: When are you going back?
  - speaker: Mas Galih
    text: Kapan kowe bali?
    ar_eg: هترجع إمتى؟
    ar: متى تعود؟
    en: When are you going back?
  - speaker: Mbak Sekar
    text: Lan "ngapa" iku "kenapa" utawa "ngapain". Ngapa kowe ing kene?
    ar_eg: و«ngapa» يعني «ليه» أو «بتعمل إيه». بتعمل إيه هنا؟
    ar: و«ngapa» تعني «لماذا» أو «ماذا تفعل». ماذا تفعل هنا؟
    en: And "ngapa" is "why" or "what are you doing". What are you doing here?
- kind: outro
  title: Kenalan karo Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki kenalna awakmu. Jenengmu, saka ngendi, lan nyambut gawe apa.
    ar_eg: يا ماس محمد، دلوقتي عرّفنا بنفسك. اسمك، انت منين، وبتشتغل إيه.
    ar: يا ماس محمد، عرّفنا بنفسك الآن. اسمك، ومن أين أنت، وما عملك.
    en: Mas Mohamed, now introduce yourself. Your name, where you're from, and what you do.
    note:
      ar_eg: دورك! تلات جمل - Jenengku... Aku saka... Aku...
      ar: دورك! ثلاث جمل - Jenengku... Aku saka... Aku...
      en: Your turn! Three sentences - Jenengku... Aku saka... Aku...
  - speaker: Mas Galih
    text: 'Contone: Jenengku Mohamed. Aku saka Kairo. Aku sinau basa Jawa.'
    ar_eg: 'مثلًا: اسمي محمد. أنا من القاهرة. أنا بتعلّم جاوي.'
    ar: 'مثلًا: اسمي محمد. أنا من القاهرة. أتعلّم الجاوية.'
    en: 'For example: My name is Mohamed. I''m from Cairo. I''m learning Javanese.'
  - speaker: Mbak Sekar
    text: PR-mu, tulisen pitakon lima nganggo apa, sapa, ngendi, kapan, lan pira.
    ar_eg: واجبك، اكتب خمس أسئلة بـapa وsapa وngendi وkapan وpira.
    ar: 'واجبك: اكتب خمسة أسئلة بـapa وsapa وngendi وkapan وpira.'
    en: 'Your homework: write five questions with apa, sapa, ngendi, kapan and pira.'
  - speaker: Mbak Sekar
    text: Aja isin yen salah, Mas. Wong Jawa seneng banget yen tamu nyoba basa Jawa.
    ar_eg: ماتتكسفش لو غلطت يا ماس. الجاويين بيفرحوا أوي لمّا الضيف يجرّب يتكلّم جاوي.
    ar: لا تخجل إن أخطأت يا ماس. يفرح الجاويّون كثيرًا حين يجرّب الضيف الجاوية.
    en: Don't be shy about mistakes, Mas. Javanese people love it when a guest tries Javanese.
  - speaker: Mas Galih
    text: Suwun, rek! Sesuk kita mlaku-mlaku ing dalan Tunjungan. Nganti ketemu!
    ar_eg: تسلموا! بكرة هنتمشّى في شارع تونجونجان. نتقابل!
    ar: شكرًا! غدًا نتمشّى في شارع تونجونغان. إلى اللقاء!
    en: Cheers! Tomorrow we stroll down Jalan Tunjungan. See you!
