review:
  status: draft
  verified: false
  notes: 'Question words and self-introduction in ngoko at a coffee stall near the Tugu monument; Sekar lives near Kotabaru and takes the train from Stasiun Tugu to Madiun. Street forms: sik, ki (= iki), to.'
