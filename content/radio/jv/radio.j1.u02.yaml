schema: kabar.radio/v1
id: radio.j1.u02
language: jv
level: j1
unit: j1.u02
title:
  target: Sapa kowe?
  ar_eg: انت مين؟
  ar: من أنت؟
  en: Who are you?
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Tugu Jogja
  lines:
  - speaker: Mas Danang
    text: Sugeng enjing, cah! Kabar Radio saiki ana neng cedhak Tugu. Aku Danang.
    ar_eg: صباح الخير يا جماعة! كبار راديو دلوقتي جنب التوجو. أنا دانانج.
    ar: صباح الخير يا جماعة! كبار راديو الآن قرب التوغو. أنا دانانغ.
    en: Good morning, guys! Kabar Radio is near the Tugu now. I'm Danang.
    note:
      ar_eg: "كلمات: neng = لـ / في (= ke / di)؛ في الشات ng؛ cedhak = قريب؛ saiki = دلوقتي (sekarang)؛ ana = فيه / موجود (= ada)."
      ar: "مفردات: neng = إلى / في (= ke / di)؛ وفي الدردشة ng؛ cedhak = قريب؛ saiki = الآن (sekarang)؛ ana = يوجد (= ada)."
      en: "Words: neng = to, at (= ke / di); chat ng; cedhak = near, close; saiki = now (sekarang); ana = there is, to exist (= ada)."
  - speaker: Mbak Sekar
    text: Aku Sekar. Tugu iki tengere Jogja. Akeh wong teka, foto-foto, lan takon-takon!
    ar_eg: أنا سيكار. التوجو ده علامة جوجا. ناس كتير بتيجي تتصوّر وتسأل!
    ar: أنا سيكار. التوغو علامة جوغجا. يأتي كثيرون ليلتقطوا الصور ويسألوا!
    en: I'm Sekar. The Tugu is Jogja's landmark. Lots of people come, take photos and ask questions!
    note:
      ar_eg: "التوجو عمود أبيض في تقاطع شمال ماليوبورو، وهو رمز جوجا. كلمات: iki = ده / دي (= ini)؛ akeh = كتير."
      ar: "التوغو نصب أبيض في تقاطع شمال ماليوبورو، وهو رمز جوغجا. مفردات: iki = هذا / هذه (= ini)؛ akeh = كثير."
      en: "The Tugu is a white monument at the crossroads north of Malioboro, the symbol of Jogja. Words: iki = this (= ini); akeh = many, a lot (banyak)."
  - speaker: Mas Danang
    text: Dina iki kita sinau tembung pitakon. Apa, sapa, ngendi, kapan, piye, pira.
    ar_eg: النهارده هنتعلّم كلمات السؤال. إيه، مين، فين، إمتى، إزّاي، كام.
    ar: اليوم نتعلّم كلمات السؤال. ماذا، من، أين، متى، كيف، كم.
    en: Today we learn question words. What, who, where, when, how, how much.
    note:
      ar_eg: "كلمات: dina = يوم، نهار."
      ar: "مفردات: dina = يوم."
      en: "Words: dina = day."
  - speaker: Mbak Sekar
    text: 'Mas Mohamed, kabar apik: akeh sing padha karo basa Indonesia!'
    ar_eg: 'يا ماس محمد، خبر حلو: كتير منهم زي الإندونيسي!'
    ar: 'يا ماس محمد، خبر سارّ: كثير منها مثل الإندونيسية!'
    en: 'Mas Mohamed, good news: many are like Indonesian!'
    note:
      ar_eg: "apa = apa، sapa = siapa، ngendi = di mana، kapan = kapan، piye = bagaimana، pira = berapa. لو بتعرف إندونيسي، نصّ الشغل خلص. كلمات: karo = مع (= dengan / sama)؛ padha = زي بعض / نفس (= sama)."
      ar: "apa = apa، وsapa = siapa، وngendi = di mana، وkapan = kapan، وpiye = bagaimana، وpira = berapa. إن كنت تعرف الإندونيسية فنصف العمل منجز. مفردات: karo = مع (= dengan / sama)؛ padha = متساوٍ / نفس (= sama)."
      en: "apa = apa, sapa = siapa, ngendi = di mana, kapan = kapan, piye = bagaimana, pira = berapa. If you know Indonesian, half the work is done. Words: karo = with (= dengan / sama); padha = same (= sama)."
- kind: dialogue
  title: Kenalan neng warung kopi
  lines:
  - speaker: Mbak Sekar
    text: Danang, aku dadi turis, kowe dadi bakul kopi, ya.
    ar_eg: يا دانانج، أنا أبقى سايحة، وانت بيّاع القهوة.
    ar: يا دانانغ، أنا سائحة وأنت بائع القهوة.
    en: Danang, I'm a tourist, you're the coffee seller.
    note:
      ar_eg: "كلمات: dadi = يبقى / يطلع."
      ar: "مفردات: dadi = يصير / يساوي."
      en: "Words: dadi = to become, come to (jadi)."
  - speaker: Mas Danang
    text: Monggo, Mbak, ngopi sik. Jenengmu sapa?
    ar_eg: اتفضّلي يا مباك، اشربي قهوة الأول. اسمك إيه؟
    ar: تفضّلي يا مباك، اشربي قهوة أوّلًا. ما اسمك؟
    en: Come in, Mbak, have a coffee first. What's your name?
    note:
      ar_eg: sik = الأول / لحظة (من dhisik). «ngopi sik» = اشرب قهوة الأول.
      ar: sik = أوّلًا / لحظة (من dhisik). «ngopi sik» = اشرب قهوة أوّلًا.
      en: Sik = first / a moment (from dhisik). "Ngopi sik" = have a coffee first.
  - speaker: Mbak Sekar
    text: Jenengku Sekar. Sampeyan sapa, Mas?
    ar_eg: اسمي سيكار. وانت مين يا ماس؟
    ar: اسمي سيكار. ومن أنت يا ماس؟
    en: My name's Sekar. And who are you, Mas?
  - speaker: Mas Danang
    text: Aku Danang. Kowe saka ngendi?
    ar_eg: أنا دانانج. انتي منين؟
    ar: أنا دانانغ. من أين أنتِ؟
    en: I'm Danang. Where are you from?
  - speaker: Mbak Sekar
    text: Aku saka Jogja. Omahku cedhak Kotabaru.
    ar_eg: أنا من جوجا. بيتي جنب كوتابارو.
    ar: أنا من جوغجا. بيتي قرب كوتابارو.
    en: I'm from Jogja. My house is near Kotabaru.
  - speaker: Mas Danang
    text: Lho, wong Jogja asli to? Nyambut gawe apa?
    ar_eg: إيه ده، بنت جوجا أصلي يعني؟ بتشتغلي إيه؟
    ar: عجبًا، أنتِ من جوغجا أصلًا؟ ما عملك؟
    en: Oh, a real Jogja local then? What do you do?
    note:
      ar_eg: "كلمات: gawe = يعمل / يحضّر (= buat)؛ nyambut = nyambut gawe = يشتغل؛ lho = على فكرة! / إيه ده!"
      ar: "مفردات: gawe = يصنع / يُعِدّ (= buat)؛ nyambut = nyambut gawe = يعمل؛ lho = للتنبيه أو الدهشة."
      en: "Words: gawe = to make (= buat); nyambut = nyambut gawe = to work; lho = you know! / oh!"
  - speaker: Mbak Sekar
    text: Aku guru. Kopi iki pira, Mas?
    ar_eg: أنا مدرّسة. القهوة دي بكام يا ماس؟
    ar: أنا معلّمة. بكم هذه القهوة يا ماس؟
    en: I'm a teacher. How much is this coffee, Mas?
  - speaker: Mas Danang
    text: Limang ewu wae. Kowe ki kok esuk banget neng kene?
    ar_eg: خمسة آلاف بس. وانتي بقى جاية بدري كده ليه؟
    ar: خمسة آلاف فقط. ولماذا أتيتِ مبكرًا هكذا؟
    en: Just five thousand. And how come you're here so early?
    note:
      ar_eg: "ki = iki (ده / دي)، مختصرة في الكلام السريع. «kowe ki» = «وانت بقى». كلمات: kene = هنا (= sini)؛ ewu = ألف (ribu)؛ sewu = 1000؛ kok = ليه كده؟! (في الأول) / والله (في الآخر)؛ limang = خمسة (قبل الوحدة)."
      ar: "ki = iki (هذا) مختصرة في الكلام السريع. «kowe ki» = «وأنت إذن». مفردات: kene = هنا (= sini)؛ ewu = ألف (ribu)؛ sewu = 1000؛ kok = للتعجب (في الأول) / للطمأنة (في الآخر)؛ limang = خمسة."
      en: "Ki = iki (this), shortened in fast talk. \"Kowe ki\" = \"you, then\". Words: kene = here (= sini); ewu = thousand (ribu); sewu = 1,000; kok = how come?! (first) / really (last); limang = five (before a unit)."
  - speaker: Mbak Sekar
    text: Aku arep numpak sepur saka Stasiun Tugu, neng Madiun.
    ar_eg: أنا هركب القطر من محطّة توجو، لماديون.
    ar: سأركب القطار من محطّة توغو إلى ماديون.
    en: I'm catching a train from Tugu station, to Madiun.
    note:
      ar_eg: "كلمات: arep = هـ / ناوي (= akan / mau؛ شات arp)؛ numpak = يركب (مواصلة)؛ sepur = قطر."
      ar: "مفردات: arep = سوف / ينوي (= akan / mau؛ دردشة arp)؛ numpak = يركب (وسيلة نقل)؛ sepur = قطار."
      en: "Words: arep = going to, want to (= akan / mau; chat arp); numpak = ride, take (transport) = naik; sepur = train = kereta api."
  - speaker: Mas Danang
    text: Wah, Madiun kuthaku! Piye kopine? Enak ta?
    ar_eg: يا سلام، ماديون بلدي! القهوة إيه رأيك فيها؟ حلوة؟
    ar: رائع، ماديون مدينتي! ما رأيك في القهوة؟ لذيذة؟
    en: Wow, Madiun's my town! How's the coffee? Good?
  - speaker: Mbak Sekar
    text: Enak banget! Suwun, Mas Danang.
    ar_eg: حلوة أوي! متشكّرة يا ماس دانانج.
    ar: لذيذة جدًّا! شكرًا يا ماس دانانغ.
    en: Really good! Thanks, Mas Danang.
- kind: word_spotlight
  title: Jenengku, saka, nyambut gawe
  lines:
  - speaker: Mas Danang
    text: Jenengku, jenengmu. Aku lan kowe dadi -ku lan -mu.
    ar_eg: اسمي، اسمك. aku وkowe بيبقوا -ku و-mu.
    ar: اسمي، اسمك. aku وkowe تصيران -ku و-mu.
    en: Jenengku, jenengmu. Aku and kowe become -ku and -mu.
    note:
      ar_eg: -ku = ـي (بتاعي)، -mu = ـك (بتاعك). jenengku = اسمي، omahmu = بيتك.
      ar: -ku = ياء المتكلّم، و-mu = كاف المخاطب. jenengku = اسمي، وomahmu = بيتك.
      en: -ku = my, -mu = your. jenengku = my name, omahmu = your house.
  - speaker: Mbak Sekar
    text: Saka ngendi? Saka Mesir, saka Kairo, saka Jogja.
    ar_eg: منين؟ من مصر، من القاهرة، من جوجا.
    ar: من أين؟ من مصر، من القاهرة، من جوغجا.
    en: From where? From Egypt, from Cairo, from Jogja.
  - speaker: Mas Danang
    text: Nyambut gawe apa? Aku guru, aku dokter, aku penerjemah.
    ar_eg: بتشتغل إيه؟ أنا مدرّس، أنا دكتور، أنا مترجم.
    ar: ما عملك؟ أنا معلّم، أنا طبيب، أنا مترجم.
    en: What do you do? I'm a teacher, a doctor, a translator.
  - speaker: Mbak Sekar
    text: Lan "ngopi" iku ngombe kopi. Neng Jogja, ngopi iku acara karo kanca, neng angkringan utawa warung kopi!
    ar_eg: و«ngopi» يعني تشرب قهوة. في جوجا، القعدة على القهوة دي مناسبة مع الصحاب، في الأنجكرينجان أو القهوة!
    ar: و«ngopi» أي شرب القهوة. وفي جوغجا جلسة القهوة مناسبة مع الأصدقاء، عند عربة الأنغكرينغان أو في المقهى!
    en: And "ngopi" means having coffee. In Jogja, ngopi is a get-together with friends, at an angkringan or a coffee stall!
    note:
      ar_eg: "كلمات: iku = ده، دي، دول (البعيد)؛ utawa = أو؛ acara = مناسبة، فعالية؛ angkringan = عربية أكل شعبي بالليل (في يوجيا وسولو)؛ ngombe = يشرب."
      ar: "مفردات: iku = ذلك، تلك؛ utawa = أو؛ acara = مناسبة، فعالية؛ angkringan = عربة طعام شعبي ليلية (في يوجياكرتا وسولو)؛ ngombe = يشرب."
      en: "Words: iku = that, those; utawa = or (atau); acara = event, occasion; angkringan = night-time street food cart (Yogya, Solo) = angkringan; ngombe = to drink."
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Jenengmu sapa?
    ar_eg: اسمك إيه؟
    ar: ما اسمك؟
    en: What's your name?
  - speaker: Mas Danang
    text: Jenengmu sapa?
    ar_eg: اسمك إيه؟
    ar: ما اسمك؟
    en: What's your name?
  - speaker: Mbak Sekar
    text: Kowe saka ngendi?
    ar_eg: انت منين؟
    ar: من أين أنت؟
    en: Where are you from?
  - speaker: Mas Danang
    text: Kowe saka ngendi?
    ar_eg: انت منين؟
    ar: من أين أنت؟
    en: Where are you from?
  - speaker: Mbak Sekar
    text: Aku saka Mesir.
    ar_eg: أنا من مصر.
    ar: أنا من مصر.
    en: I'm from Egypt.
  - speaker: Mas Danang
    text: Aku saka Mesir.
    ar_eg: أنا من مصر.
    ar: أنا من مصر.
    en: I'm from Egypt.
  - speaker: Mbak Sekar
    text: Kopi iki pira?
    ar_eg: القهوة دي بكام؟
    ar: بكم هذه القهوة؟
    en: How much is this coffee?
  - speaker: Mas Danang
    text: Kopi iki pira?
    ar_eg: القهوة دي بكام؟
    ar: بكم هذه القهوة؟
    en: How much is this coffee?
  - speaker: Mbak Sekar
    text: Aku nyambut gawe dadi penerjemah.
    ar_eg: أنا شغّال مترجم.
    ar: أعمل مترجمًا.
    en: I work as a translator.
  - speaker: Mas Danang
    text: Aku nyambut gawe dadi penerjemah.
    ar_eg: أنا شغّال مترجم.
    ar: أعمل مترجمًا.
    en: I work as a translator.
  - speaker: Mbak Sekar
    text: Kapan kowe bali?
    ar_eg: هترجع إمتى؟
    ar: متى تعود؟
    en: When are you going back?
    note:
      ar_eg: "كلمات: bali = يرجع."
      ar: "مفردات: bali = يرجع، يعود."
      en: "Words: bali = go back, return."
  - speaker: Mas Danang
    text: Kapan kowe bali?
    ar_eg: هترجع إمتى؟
    ar: متى تعود؟
    en: When are you going back?
  - speaker: Mbak Sekar
    text: Lan "ngapa" iku "kenapa" utawa "ngapain". Ngapa kowe neng kene?
    ar_eg: و«ngapa» يعني «ليه» أو «بتعمل إيه». بتعمل إيه هنا؟
    ar: و«ngapa» تعني «لماذا» أو «ماذا تفعل». ماذا تفعل هنا؟
    en: And "ngapa" is "why" or "what are you doing". What are you doing here?
    note:
      ar_eg: "كلمات: kenapa = ليه، ماله."
      ar: "مفردات: kenapa = لماذا، ما به."
      en: "Words: kenapa = why; what's wrong."
- kind: outro
  title: Kenalan karo Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki kenalna dhirimu. Jenengmu, saka ngendi, lan nyambut gawe apa.
    ar_eg: يا ماس محمد، دلوقتي عرّفنا بنفسك. اسمك، انت منين، وبتشتغل إيه.
    ar: يا ماس محمد، عرّفنا بنفسك الآن. اسمك، ومن أين أنت، وما عملك.
    en: Mas Mohamed, now introduce yourself. Your name, where you're from, and what you do.
    note:
      ar_eg: دورك! تلات جمل - Jenengku... Aku saka... Aku...
      ar: دورك! ثلاث جمل - Jenengku... Aku saka... Aku...
      en: Your turn! Three sentences - Jenengku... Aku saka... Aku...
  - speaker: Mas Danang
    text: 'Contone: Jenengku Mohamed. Aku saka Kairo. Aku sinau basa Jawa.'
    ar_eg: 'مثلًا: اسمي محمد. أنا من القاهرة. أنا بتعلّم جاوي.'
    ar: 'مثلًا: اسمي محمد. أنا من القاهرة. أتعلّم الجاوية.'
    en: 'For example: My name is Mohamed. I''m from Cairo. I''m learning Javanese.'
  - speaker: Mbak Sekar
    text: PR-mu, tulisen pitakon lima nganggo apa, sapa, ngendi, kapan, lan pira.
    ar_eg: واجبك، اكتب خمس أسئلة بـapa وsapa وngendi وkapan وpira.
    ar: 'واجبك: اكتب خمسة أسئلة بـapa وsapa وngendi وkapan وpira.'
    en: 'Your homework: write five questions with apa, sapa, ngendi, kapan and pira.'
    note:
      ar_eg: "كلمات: nganggo = بـ / بيستخدم."
      ar: "مفردات: nganggo = بـ / يستعمل."
      en: "Words: nganggo = with, using (pakai)."
  - speaker: Mbak Sekar
    text: Aja isin yen salah, Mas. Wong Jawa seneng banget yen tamu nyoba basa Jawa.
    ar_eg: ماتتكسفش لو غلطت يا ماس. الجاويين بيفرحوا أوي لمّا الضيف يجرّب يتكلّم جاوي.
    ar: لا تخجل إن أخطأت يا ماس. يفرح الجاويّون كثيرًا حين يجرّب الضيف الجاوية.
    en: Don't be shy about mistakes, Mas. Javanese people love it when a guest tries Javanese.
    note:
      ar_eg: "كلمات: yen = لو، لما (= kalau)؛ aja = متـ… (نهي)؛ seneng = يحب / مبسوط."
      ar: "مفردات: yen = إذا (= kalau)؛ aja = لا (الناهية)؛ seneng = يحب / سعيد."
      en: "Words: yen = if, when (= kalau); aja = don't; seneng = to like; happy (suka, senang)."
  - speaker: Mas Danang
    text: Suwun, cah! Sesuk bengi kita dolan neng Alun-alun Kidul. Nganti ketemu!
    ar_eg: تسلموا يا جماعة! بكرة بالليل هنتفسّح في ألون ألون كيدول. نتقابل!
    ar: شكرًا يا جماعة! غدًا ليلًا نتنزّه في ألون ألون كيدول. إلى اللقاء!
    en: Cheers, guys! Tomorrow night we hang out at Alun-alun Kidul. See you!
    note:
      ar_eg: "كلمات: dolan = يخرج يتفسح، يلعب؛ nganti = لحد (= sampai)."
      ar: "مفردات: dolan = يتنزّه، يلعب؛ nganti = حتى (= sampai)."
      en: "Words: dolan = to hang out, visit, play; nganti = until (= sampai)."
