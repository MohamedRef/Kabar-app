review:
  status: draft
  verified: false
  notes: 'Reading encyclopedic written ngoko with formal connectors, at Stasiun Madiun, Danang''s home town. The article lines are paraphrased, not quoted from Wikipedia. Facts used: Madiun is a city in western East Java (capital Surabaya); it is called Kutha Pendekar for its pencak silat schools and is known for pecel and brem; the station dates from the Dutch railway era (19th century).'
