title:
  target: Wikipedia basa Jawa
  ar_eg: ويكيبيديا بالجاوي
  ar: ويكيبيديا الجاوية
  en: Javanese Wikipedia
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Stasiun Madiun
  lines:
  - speaker: Mas Danang
    text: Sugeng enjing saka Stasiun Madiun! Iki kuthaku dhewe. Aku Danang, lan aku seneng banget wis mulih.
    ar_eg: صباح الخير من محطة ماديون! دي مدينتي أنا. أنا دانانج، ومبسوط أوي إنّي رجعت.
    ar: صباح الخير من محطّة ماديون! هذه مدينتي. أنا دانانغ، وسعيد جدًّا بالعودة.
    en: Good morning from Madiun station! This is my own town. I'm Danang, and I'm so happy to be home.
  - speaker: Mbak Sekar
    text: Kula Sekar. Saiki kita ora mung ngomong. Kita sinau maca basa Jawa sing tenan!
    ar_eg: أنا سيكار. دلوقتي مش هنتكلّم بس. هنتعلّم نقرا جاوي حقيقي!
    ar: أنا سيكار. الآن لن نتكلّم فقط، بل نتعلّم قراءة جاوية حقيقية!
    en: I'm Sekar. Now we don't just talk. We learn to read real Javanese!
  - speaker: Mbak Sekar
    text: 'Dina iki: Wikipedia basa Jawa. Isine akeh, gratis, lan ditulis nganggo ngoko resmi.'
    ar_eg: 'النهارده: ويكيبيديا بالجاوي. فيها حاجات كتير، ببلاش، ومكتوبة بنجوكو رسمي.'
    ar: 'اليوم: ويكيبيديا الجاوية. محتواها كثير ومجّاني، ومكتوبة بنغوكو رسمية.'
    en: 'Today: Javanese Wikipedia. Lots of content, free, written in formal ngoko.'
    note:
      ar_eg: ويكيبيديا الجاوي مكتوبة غالبًا بالنجوكو مع كلمات ربط رسمية (iku، yaiku، kang، dening). مصدر حقيقي ومجّاني للتمرين.
      ar: ويكيبيديا الجاوية مكتوبة غالبًا بالنغوكو مع روابط رسمية (iku وyaiku وkang وdening). مصدر حقيقيّ ومجّانيّ للتمرين.
      en: Javanese Wikipedia is mostly ngoko with formal connectors (iku, yaiku, kang, dening). A real, free corpus to practise on.
  - speaker: Mas Danang
    text: Aja wedi. Tembung-tembung cilik iki bakal mbantu sampeyan maca artikel apa wae.
    ar_eg: ماتخافش. الكلمات الصغيّرة دي هتساعدك تقرا أيّ مقالة.
    ar: لا تخف. هذه الكلمات الصغيرة ستساعدك على قراءة أيّ مقال.
    en: Don't worry. These little words will help you read any article.
- kind: dialogue
  title: Maca artikel Madiun
  lines:
  - speaker: Mbak Sekar
    text: Danang, ayo maca bareng artikel babagan kuthamu. Aku maca, kowe nerangake.
    ar_eg: يا دانانج، يلّا نقرا مع بعض مقالة عن مدينتك. أنا أقرا وانت تشرح.
    ar: يا دانانغ، هيّا نقرأ معًا مقالة عن مدينتك. أنا أقرأ وأنت تشرح.
    en: Danang, let's read an article about your town together. I read, you explain.
  - speaker: Mbak Sekar
    text: '"Madiun iku kutha ing sisih kulon provinsi Jawa Timur."'
    ar_eg: «ماديون مدينة في غرب محافظة جاوة الشرقية.»
    ar: «ماديون مدينة في غرب إقليم جاوة الشرقية.»
    en: '"Madiun is a city in the west of East Java province."'
  - speaker: Mas Danang
    text: Gampang. "Iku" kaya "adalah" ing basa Indonesia. Madiun iku kutha.
    ar_eg: سهلة. «iku» زي «adalah» في الإندونيسي. ماديون هي مدينة.
    ar: سهل. «iku» مثل «adalah» في الإندونيسية. ماديون مدينة.
    en: Easy. "Iku" is like "adalah" in Indonesian. Madiun is a city.
  - speaker: Mbak Sekar
    text: '"Ibukutha provinsi Jawa Timur yaiku Surabaya, dudu Madiun."'
    ar_eg: «عاصمة محافظة جاوة الشرقية هي سورابايا، مش ماديون.»
    ar: «عاصمة إقليم جاوة الشرقية هي سورابايا لا ماديون.»
    en: '"The capital of East Java province is Surabaya, not Madiun."'
  - speaker: Mas Danang
    text: '"Yaiku" uga "adalah", nanging luwih resmi. Lan Madiun pancen cilik, nanging ayem, lho!'
    ar_eg: «yaiku» برضه «adalah»، بس رسمية أكتر. وماديون فعلًا صغيّرة، بس هادية على فكرة!
    ar: «yaiku» أيضًا «adalah» لكنّها أرسم. وماديون صغيرة فعلًا، لكنّها هادئة!
    en: '"Yaiku" is also "adalah", but more formal. And Madiun really is small, but peaceful, you know!'
  - speaker: Mbak Sekar
    text: '"Stasiun Madiun kalebu stasiun lawas kang dibangun ing abad kaping sangalas."'
    ar_eg: «محطة ماديون من المحطّات القديمة اللي اتبنت في القرن التسعتاشر.»
    ar: «محطّة ماديون من المحطّات القديمة التي بُنيت في القرن التاسع عشر.»
    en: '"Madiun station is one of the old stations built in the nineteenth century."'
  - speaker: Mas Danang
    text: '"Kalebu" iku "termasuk". "Kang" iku "yang", kaya "sing", nanging kanggo tulisan.'
    ar_eg: «kalebu» يعني «termasuk» من ضمن. «kang» يعني «yang»، زي «sing» بس للكتابة.
    ar: «kalebu» تعني «termasuk» أي من ضمن. و«kang» تعني «yang» مثل «sing» لكن للكتابة.
    en: '"Kalebu" means "termasuk", among. "Kang" means "yang", like "sing", but for writing.'
    note:
      ar_eg: 'sing في الكلام، kang في الكتابة الرسمية. نفس المعنى: «اللي».'
      ar: 'sing في الكلام وkang في الكتابة الرسمية، والمعنى واحد: «الذي».'
      en: 'Sing when talking, kang in formal writing. Same meaning: "which, who".'
  - speaker: Mbak Sekar
    text: '"Sepur ing Jawa dibangun dening wong Walanda."'
    ar_eg: «السكك الحديد في جاوة بناها الهولنديين.»
    ar: «بنى الهولنديّون السكك الحديدية في جاوة.»
    en: '"The railways in Java were built by the Dutch."'
  - speaker: Mas Danang
    text: '"Dening" iku "oleh". Dibangun dening wong Walanda, dibangun oleh orang Belanda.'
    ar_eg: «dening» يعني «oleh» على إيد. اتبنت على إيد الهولنديين.
    ar: «dening» تعني «oleh» أي على يد. بُنيت على يد الهولنديّين.
    en: '"Dening" is "oleh", by. Built by the Dutch.'
  - speaker: Mbak Sekar
    text: '"Madiun misuwur minangka Kutha Pendekar, merga akeh paguron pencak silat."'
    ar_eg: «ماديون مشهورة بإنها مدينة المقاتلين، عشان فيها مدارس پنچاك سيلات كتير.»
    ar: «تشتهر ماديون بأنّها مدينة المقاتلين لكثرة مدارس البنتشاك سيلات فيها.»
    en: '"Madiun is famous as the City of Fighters, because of its many pencak silat schools."'
    note:
      ar_eg: pencak silat = فنّ قتالي إندونيسي تقليدي. ماديون فيها مدارس سيلات كبيرة وقديمة، وعشان كده بيسمّوها Kutha Pendekar.
      ar: البنتشاك سيلات فنّ قتاليّ إندونيسيّ تقليديّ. في ماديون مدارس سيلات كبيرة عريقة، ولذلك تُسمّى Kutha Pendekar.
      en: Pencak silat is Indonesia's traditional martial art. Madiun has big, old silat schools, hence the name Kutha Pendekar.
  - speaker: Mas Danang
    text: '"Minangka" iku "sebagai". Lan Madiun uga kutha pecel lan brem. Brem iku jajan legi saka beras, krasa adhem neng ilat!'
    ar_eg: «minangka» يعني «sebagai» بصفتها. وماديون كمان مدينة الپيچل والبريم. البريم حلويات من الرز، بتحسّها ساقعة على لسانك!
    ar: «minangka» تعني «sebagai». وماديون أيضًا مدينة البيتشل والبريم. والبريم حلوى من الأرز تشعر ببرودتها على لسانك!
    en: '"Minangka" is "sebagai". And Madiun is also the town of pecel and brem. Brem is a sweet made from rice, it feels cool on your tongue!'
    note:
      ar_eg: brem = حلويات من الرز المتخمّر، بيضا وناشفة وبتدوب في البُق وتسيب إحساس ساقع. هديّة ماديون المشهورة.
      ar: البريم حلوى من الأرز المخمّر، بيضاء جافّة تذوب في الفم وتترك إحساسًا باردًا. هديّة ماديون الشهيرة.
      en: 'Brem is a sweet of fermented rice: white, dry, it melts in your mouth with a cool feeling. Madiun''s famous souvenir.'
- kind: word_spotlight
  title: Iku, yaiku, kang, dening
  lines:
  - speaker: Mbak Sekar
    text: 'Iku lan yaiku: "adalah". Kang: "yang". Dening: "oleh".'
    ar_eg: 'iku وyaiku: «هو / هي». kang: «اللي». dening: «على إيد».'
    ar: 'iku وyaiku: «هو / هي». kang: «الذي». dening: «على يد».'
    en: 'Iku and yaiku: "is". Kang: "which". Dening: "by".'
  - speaker: Mas Danang
    text: 'Minangka: "sebagai". Kalebu: "termasuk". Ing: "di". Saka: "dari".'
    ar_eg: 'minangka: «بصفته». kalebu: «من ضمن». ing: «في». saka: «من».'
    ar: 'minangka: «بوصفه». kalebu: «من ضمن». ing: «في». saka: «من».'
    en: 'Minangka: "as". Kalebu: "among". Ing: "in". Saka: "from".'
  - speaker: Mbak Sekar
    text: Lor, kidul, wetan, kulon. Madiun ana ing sisih kulon Jawa Timur. Kudus lan Demak ana ing sisih lor, ing pesisir.
    ar_eg: lor شمال، kidul جنوب، wetan شرق، kulon غرب. ماديون في غرب جاوة الشرقية. وقدس وديماك في الشمال، على الساحل.
    ar: lor شمال، kidul جنوب، wetan شرق، kulon غرب. ماديون في غرب جاوة الشرقية، وقدس وديماك في الشمال على الساحل.
    en: 'Lor, kidul, wetan, kulon: north, south, east, west. Madiun is in the west of East Java. Kudus and Demak are up north, on the coast.'
  - speaker: Mbak Sekar
    text: Yen sampeyan wis ngerti basa Indonesia, Wikipedia Jawa ora angel. Struktur ukarane meh padha.
    ar_eg: لو انت بتعرف إندونيسي، ويكيبيديا الجاوي مش صعبة. تركيب الجملة تقريبًا نفس الحاجة.
    ar: إن كنت تعرف الإندونيسية فويكيبيديا الجاوية ليست صعبة. بنية الجملة متشابهة تقريبًا.
    en: If you know Indonesian, Javanese Wikipedia isn't hard. The sentence structure is nearly the same.
