title:
  target: Wikipedia basa Jawa
  ar_eg: ويكيبيديا بالجاوي
  ar: ويكيبيديا الجاوية
  en: Javanese Wikipedia
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Kota Lama Semarang
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saking Kota Lama, Semarang! Gedhong-gedhong lawas, gereja Blenduk, lan dalan watu. Kula Sekar.
    ar_eg: صباح الخير من المدينة القديمة في سيمارانج! مباني قديمة، وكنيسة بليندوك، وشوارع حجر. أنا سيكار.
    ar: صباح الخير من المدينة القديمة في سيمارانغ! مبانٍ قديمة وكنيسة بليندوك وشوارع حجرية. أنا سيكار.
    en: Good morning from Kota Lama, Semarang! Old buildings, the Blenduk church and stone streets. I'm Sekar.
  - speaker: Mas Galih
    text: Aku Galih. Saiki kita ora mung ngomong. Kita sinau maca basa Jawa sing tenan!
    ar_eg: أنا جاليه. دلوقتي مش هنتكلّم بس. هنتعلّم نقرا جاوي حقيقي!
    ar: أنا غاليه. الآن لن نتكلّم فقط، بل نتعلّم قراءة الجاوية الحقيقية!
    en: I'm Galih. Now we don't just talk. We learn to read real Javanese!
  - speaker: Mbak Sekar
    text: 'Dina iki: Wikipedia basa Jawa. Isine akeh, gratis, lan ditulis nganggo ngoko resmi.'
    ar_eg: 'النهارده: ويكيبيديا بالجاوي. فيها حاجات كتير، ببلاش، ومكتوبة بنجوكو رسمي.'
    ar: 'اليوم: ويكيبيديا الجاوية. محتواها كثير ومجّاني، ومكتوبة بنغوكو رسمية.'
    en: 'Today: Javanese Wikipedia. Lots of content, free, written in formal ngoko.'
    note:
      ar_eg: ويكيبيديا الجاوي مكتوبة غالبًا بالنجوكو مع كلمات ربط رسمية (iku، yaiku، kang، dening). مصدر حقيقي ومجّاني للتمرين.
      ar: ويكيبيديا الجاوية مكتوبة غالبًا بالنغوكو مع روابط رسمية (iku وyaiku وkang وdening). مصدر حقيقيّ ومجّانيّ للتمرين.
      en: Javanese Wikipedia is mostly ngoko with formal connectors (iku, yaiku, kang, dening). A real, free corpus to practise on.
  - speaker: Mas Galih
    text: Aja wedi. Tembung-tembung cilik iki bakal mbantu sampeyan maca artikel apa wae.
    ar_eg: ماتخافش. الكلمات الصغيّرة دي هتساعدك تقرا أيّ مقالة.
    ar: لا تخف. هذه الكلمات الصغيرة ستساعدك على قراءة أيّ مقال.
    en: Don't worry. These little words will help you read any article.
- kind: dialogue
  title: Maca artikel Semarang
  lines:
  - speaker: Mbak Sekar
    text: Galih, ayo maca bareng. Aku maca, kowe nerangake.
    ar_eg: يا جاليه، يلّا نقرا مع بعض. أنا أقرا وانت تشرح.
    ar: يا غاليه، هيّا نقرأ معًا. أنا أقرأ وأنت تشرح.
    en: Galih, let's read together. I read, you explain.
  - speaker: Mbak Sekar
    text: '"Semarang iku kutha ing pesisir lor Jawa."'
    ar_eg: «سيمارانج مدينة على الساحل الشمالي لجاوة.»
    ar: «سيمارانغ مدينة على الساحل الشمالي لجاوة.»
    en: '"Semarang is a city on the north coast of Java."'
  - speaker: Mas Galih
    text: Gampang. "Iku" kaya "adalah" ing basa Indonesia. Semarang iku kutha.
    ar_eg: سهلة. «iku» زي «adalah» في الإندونيسي. سيمارانج هي مدينة.
    ar: سهل. «iku» مثل «adalah» في الإندونيسية. سيمارانغ مدينة.
    en: Easy. "Iku" is like Indonesian "adalah". Semarang is a city.
  - speaker: Mbak Sekar
    text: '"Semarang yaiku ibukutha provinsi Jawa Tengah."'
    ar_eg: «سيمارانج هي عاصمة محافظة جاوة الوسطى.»
    ar: «سيمارانغ هي عاصمة إقليم جاوة الوسطى.»
    en: '"Semarang is the capital of Central Java province."'
  - speaker: Mas Galih
    text: '"Yaiku" uga "adalah", nanging luwih resmi. Asring kanggo nerangake.'
    ar_eg: «yaiku» برضه «adalah»، بس رسمية أكتر. بتيجي غالبًا للتوضيح.
    ar: «yaiku» أيضًا «adalah» لكنّها أرسم، وتأتي غالبًا للتوضيح.
    en: '"Yaiku" is also "adalah", but more formal. Often used to explain.'
  - speaker: Mbak Sekar
    text: '"Kutha iki kalebu kutha kang paling gedhe ing Jawa Tengah."'
    ar_eg: «المدينة دي من أكبر المدن في جاوة الوسطى.»
    ar: «هذه المدينة من أكبر مدن جاوة الوسطى.»
    en: '"This city is among the biggest in Central Java."'
  - speaker: Mas Galih
    text: '"Kalebu" iku "termasuk". "Kang" iku "yang", kaya "sing", nanging kanggo tulisan.'
    ar_eg: «kalebu» يعني «termasuk» من ضمن. «kang» يعني «yang»، زي «sing» بس للكتابة.
    ar: «kalebu» تعني «termasuk» أي من ضمن. و«kang» تعني «yang» مثل «sing» لكن للكتابة.
    en: '"Kalebu" means "termasuk", among. "Kang" means "yang", like "sing", but for writing.'
    note:
      ar_eg: 'sing في الكلام، kang في الكتابة الرسمية. نفس المعنى: «اللي».'
      ar: 'sing في الكلام وkang في الكتابة الرسمية، والمعنى واحد: «الذي».'
      en: 'Sing when talking, kang in formal writing. Same meaning: "which, who".'
  - speaker: Mbak Sekar
    text: '"Kota Lama dibangun dening wong Walanda ing abad kaping wolulas."'
    ar_eg: «المدينة القديمة اتبنت على إيد الهولنديين في القرن التمنتاشر.»
    ar: «بنى الهولنديّون المدينة القديمة في القرن الثامن عشر.»
    en: '"Kota Lama was built by the Dutch in the eighteenth century."'
  - speaker: Mas Galih
    text: '"Dening" iku "oleh". Dibangun dening wong Walanda, dibangun oleh orang Belanda.'
    ar_eg: «dening» يعني «oleh» على إيد. اتبنت على إيد الهولنديين.
    ar: «dening» تعني «oleh» أي على يد. بُنيت على يد الهولنديّين.
    en: '"Dening" is "oleh", by. Built by the Dutch.'
  - speaker: Mbak Sekar
    text: '"Semarang misuwur minangka kutha lumpia."'
    ar_eg: «سيمارانج مشهورة بإنها مدينة اللومبيا.»
    ar: «تشتهر سيمارانغ بأنّها مدينة اللومبيا.»
    en: '"Semarang is famous as the city of lumpia."'
  - speaker: Mas Galih
    text: '"Minangka" iku "sebagai". Lan lumpia iku panganan kaya spring roll, isine rebung.'
    ar_eg: «minangka» يعني «sebagai» بصفتها. واللومبيا أكلة زي السبرينج رول، حشوها براعم البامبو.
    ar: «minangka» تعني «sebagai» بوصفها. واللومبيا طعام كلفائف الربيع، حشوها براعم الخيزران.
    en: '"Minangka" is "sebagai", as. And lumpia is like a spring roll, filled with bamboo shoots.'
    note:
      ar_eg: لومبيا سيمارانج أصلها من مزيج صيني-جاوي، ومن أشهر أكلات المدينة.
      ar: لومبيا سيمارانغ من مزيج صينيّ-جاويّ، ومن أشهر أطعمة المدينة.
      en: Semarang lumpia comes from a Chinese-Javanese mix and is the city's best-known food.
- kind: word_spotlight
  title: Iku, yaiku, kang, dening
  lines:
  - speaker: Mbak Sekar
    text: 'Iku lan yaiku: "adalah". Kang: "yang". Dening: "oleh".'
    ar_eg: 'iku وyaiku: «هو / هي». kang: «اللي». dening: «على إيد».'
    ar: 'iku وyaiku: «هو / هي». kang: «الذي». dening: «على يد».'
    en: 'Iku and yaiku: "is". Kang: "which". Dening: "by".'
  - speaker: Mas Galih
    text: 'Minangka: "sebagai". Kalebu: "termasuk". Ing: "di". Saka: "dari".'
    ar_eg: 'minangka: «بصفته». kalebu: «من ضمن». ing: «في». saka: «من».'
    ar: 'minangka: «بوصفه». kalebu: «من ضمن». ing: «في». saka: «من».'
    en: 'Minangka: "as". Kalebu: "among". Ing: "in". Saka: "from".'
  - speaker: Mbak Sekar
    text: Yen sampeyan wis ngerti basa Indonesia, Wikipedia Jawa ora angel. Struktur ukarane meh padha.
    ar_eg: لو انت بتعرف إندونيسي، ويكيبيديا الجاوي مش صعبة. تركيب الجملة تقريبًا نفس الحاجة.
    ar: إن كنت تعرف الإندونيسية فويكيبيديا الجاوية ليست صعبة. بنية الجملة متشابهة تقريبًا.
    en: If you know Indonesian, Javanese Wikipedia isn't hard. The sentence structure is nearly the same.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Semarang iku kutha ing pesisir lor.
    ar_eg: سيمارانج مدينة على الساحل الشمالي.
    ar: سيمارانغ مدينة على الساحل الشمالي.
    en: Semarang is a city on the north coast.
  - speaker: Mas Galih
    text: Semarang iku kutha ing pesisir lor.
    ar_eg: سيمارانج مدينة على الساحل الشمالي.
    ar: سيمارانغ مدينة على الساحل الشمالي.
    en: Semarang is a city on the north coast.
  - speaker: Mbak Sekar
    text: Semarang yaiku ibukutha Jawa Tengah.
    ar_eg: سيمارانج هي عاصمة جاوة الوسطى.
    ar: سيمارانغ هي عاصمة جاوة الوسطى.
    en: Semarang is the capital of Central Java.
  - speaker: Mas Galih
    text: Semarang yaiku ibukutha Jawa Tengah.
    ar_eg: سيمارانج هي عاصمة جاوة الوسطى.
    ar: سيمارانغ هي عاصمة جاوة الوسطى.
    en: Semarang is the capital of Central Java.
  - speaker: Mbak Sekar
    text: Kutha kang paling gedhe.
    ar_eg: أكبر مدينة.
    ar: أكبر مدينة.
    en: The biggest city.
  - speaker: Mas Galih
    text: Kutha kang paling gedhe.
    ar_eg: أكبر مدينة.
    ar: أكبر مدينة.
    en: The biggest city.
  - speaker: Mbak Sekar
    text: Dibangun dening wong Walanda.
    ar_eg: اتبنت على إيد الهولنديين.
    ar: بناها الهولنديّون.
    en: Built by the Dutch.
