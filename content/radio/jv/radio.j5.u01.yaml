- kind: outro
  title: Kairo ing Wikipedia
  lines:
  - speaker: Mas Galih
    text: Mas Mohamed, saiki tulisen ukara telu babagan Kairo, kaya Wikipedia. Nganggo iku, kang, lan minangka.
    ar_eg: يا ماس محمد، دلوقتي اكتب تلات جمل عن القاهرة، زي ويكيبيديا. استخدم iku وkang وminangka.
    ar: يا ماس محمد، اكتب الآن ثلاث جمل عن القاهرة على طريقة ويكيبيديا. استعمل iku وkang وminangka.
    en: Mas Mohamed, now write three sentences about Cairo, Wikipedia-style. Use iku, kang and minangka.
    note:
      ar_eg: 'دورك! زي: Kairo iku ibukutha Mesir.'
      ar: 'دورك! مثل: Kairo iku ibukutha Mesir.'
      en: 'Your turn! Like: Kairo iku ibukutha Mesir.'
  - speaker: Mbak Sekar
    text: 'Contone: Kairo iku ibukutha Mesir. Kairo kalebu kutha kang paling gedhe ing Afrika.'
    ar_eg: 'مثلًا: القاهرة هي عاصمة مصر. القاهرة من أكبر المدن في إفريقيا.'
    ar: 'مثلًا: القاهرة عاصمة مصر، وهي من أكبر مدن إفريقيا.'
    en: 'For example: Cairo is the capital of Egypt. Cairo is among the biggest cities in Africa.'
  - speaker: Mas Galih
    text: PR-mu, wacanen artikel "Kairo ing Wikipedia" ing pelajaran, lan golekana iku, yaiku, lan kang.
    ar_eg: واجبك، اقرا مقالة «القاهرة في ويكيبيديا» في الدرس، ودوّر على iku وyaiku وkang.
    ar: 'واجبك: اقرأ مقال «القاهرة في ويكيبيديا» في الدرس وابحث عن iku وyaiku وkang.'
    en: 'Your homework: read the "Cairo on Wikipedia" article in the lesson and find iku, yaiku and kang.'
  - speaker: Mbak Sekar
    text: Sesuk kita dhateng Lawang Sewu, maca warta. Nganti pinanggih malih!
    ar_eg: بكرة رايحين لاوانج سيوو، نقرا الأخبار. إلى اللقاء!
    ar: غدًا نذهب إلى لاوانغ سيوو لنقرأ الأخبار. إلى اللقاء!
    en: Tomorrow we go to Lawang Sewu to read the news. Until next time!
