review:
  status: draft
  verified: false
  notes: Krama question words at Pura Pakualaman, Yogyakarta (the Pakualam line dates from 1812-1813); the thumb-pointing gesture. Pak Wiryo (lessons j3.u04) mentioned only. Check whether the palace is open to visitors with a guide and the ticket price - left general.
