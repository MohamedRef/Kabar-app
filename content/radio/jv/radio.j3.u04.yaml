title:
  target: Pitakon krama
  ar_eg: السؤال بأدب
  ar: السؤال بأدب
  en: Asking politely
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pura Pakualaman
  lines:
  - speaker: Mas Danang
    text: Sugeng siang saking Pura Pakualaman, Jogja! Kula Danang. Pendhapane ageng sanget!
    ar_eg: نهارك سعيد من قصر پاكوالامان في جوجا! أنا دانانج. القاعة الكبيرة ضخمة أوي!
    ar: طاب يومكم من قصر باكوالامان في جوغجا! أنا دانانغ. قاعة البندوبو ضخمة جدًّا!
    en: Good day from Pura Pakualaman, Jogja! I'm Danang. The pendhapa is enormous!
    note:
      ar_eg: "pendhapa = قاعة جاوي مفتوحة بسقف على أعمدة. وپاكوالامان قصر أمير تاني جوّه جوجا، غير الكراتون بتاع السلطان. كلمات: ageng = كبير (gedhe ← besar)، كراما."
      ar: "pendhapa = قاعة جاوية مفتوحة بسقف على أعمدة. وباكوالامان قصر أمير آخر داخل جوغجا، غير كراتون السلطان. مفردات: ageng = كبير (gedhe ← besar)، كراما."
      en: "A pendhapa is an open Javanese pavilion on pillars. Pakualaman is a second princely palace inside Jogja, apart from the Sultan's Kraton. Words: ageng = big (ngoko gedhe, Indonesian besar), krama."
  - speaker: Mbak Sekar
    text: Kula Sekar. Ing kene kita sinau takon kanthi alus. Menapa, sinten, pundi, pinten.
    ar_eg: أنا سيكار. هنا هنتعلّم نسأل بأدب. إيه، مين، فين، كام.
    ar: أنا سيكار. هنا نتعلّم السؤال بأدب. ماذا، من، أين، كم.
    en: I'm Sekar. Here we learn to ask politely. What, who, where, how much.
    note:
      ar_eg: "كلمات: kanthi = بـ / عن طريق (في الكتابة)؛ alus = رقيق، ناعم."
      ar: "مفردات: kanthi = بـ / عن طريق (في الكتابة)؛ alus = رقيق، ليّن، مهذّب."
      en: "Words: kanthi = by means of, with (written) = dengan; alus = gentle, refined."
  - speaker: Mas Danang
    text: Lan carane nuding! Ing Jawa, ora nuding nganggo driji, nanging nganggo jempol.
    ar_eg: وإزّاي نشاور! في جاوة، مش بنشاور بالصباع، بنشاور بالإبهام.
    ar: وكيف نشير! في جاوة لا نشير بالسبّابة بل بالإبهام.
    en: And how to point! In Java you don't point with a finger but with your thumb.
    note:
      ar_eg: "الإشارة بالإبهام (والصوابع مقفولة) جزء من الأدب، خصوصًا قدّام الكبار. والبوس الخفيف للأمام كمان. كلمات: nuding = يشاور على؛ driji = صباع؛ jempol = الإبهام، الصباع الكبير؛ carane = الطريقة، إزاي."
      ar: "الإشارة بالإبهام (والأصابع مضمومة) جزء من الأدب، خصوصًا أمام الكبار، مع انحناءة خفيفة. مفردات: nuding = يشير إلى؛ driji = إصبع؛ jempol = الإبهام؛ carane = الطريقة، كيفية."
      en: "Pointing with the thumb (fingers folded) is part of politeness, especially before elders, with a slight bow. Words: nuding = point at; driji = finger; jempol = thumb; carane = the way (to), how."
- kind: dialogue
  title: Takon marang abdi dalem
  lines:
  - speaker: Mbak Sekar
    text: Danang, sampeyan turis, kula pemandu ingkang sepuh.
    ar_eg: يا دانانج، انت السايح، وأنا المرشدة الكبيرة.
    ar: يا دانانغ، أنت السائح وأنا المرشدة المسنّة.
    en: Danang, you're the tourist, I'm the elderly guide.
    note:
      ar_eg: "كلمات: ingkang = اللي (sing ← yang)، كراما."
      ar: "مفردات: ingkang = الذي (sing ← yang)، كراما."
      en: "Words: ingkang = who / which / the one that (ngoko sing, Indonesian yang), krama."
  - speaker: Mas Danang
    text: Nyuwun pirsa, Bu. Menika griya menapa?
    ar_eg: لو سمحتي يا ست، أسأل. ده بيت إيه؟
    ar: أستأذنك بسؤال يا سيّدتي. ما هذا المبنى؟
    en: May I ask, Bu. What building is this?
    note:
      ar_eg: nyuwun pirsa = «ممكن أسأل؟» بأدب جامد (حرفيًّا «أطلب أن أعرف»). أحسن بداية لأي سؤال لحدّ كبير.
      ar: nyuwun pirsa = «أستأذن بسؤال» بأدب بالغ (حرفيًّا «أطلب أن أعلم»). أفضل بداية لأيّ سؤال لكبير.
      en: Nyuwun pirsa = "may I ask" very politely (literally "I request to know"). The best way to open any question to an elder.
  - speaker: Mbak Sekar
    text: Menika pendhapa, Mas. Kangge pentas beksan lan gamelan.
    ar_eg: دي القاعة يا ماس. للرقص والجاملان.
    ar: هذه قاعة البندوبو يا ماس، لعروض الرقص والغاملان.
    en: This is the pendhapa, Mas. For dance and gamelan performances.
    note:
      ar_eg: "كلمات: beksan = رقصة (كراما، كلمة القصر)؛ gamelan = الفرقة الموسيقية الجاوية؛ kangge = عشان / لـ (kanggo ← untuk)، كراما."
      ar: "مفردات: beksan = رقصة (كراما، كلمة القصر)؛ gamelan = الفرقة الموسيقية الجاوية؛ kangge = لِـ (kanggo ← untuk)، كراما."
      en: "Words: beksan = dance (krama, palace word for tari); gamelan = Javanese orchestra = gamelan; kangge = for (ngoko kanggo, Indonesian untuk), krama."
  - speaker: Mas Danang
    text: Sinten ingkang yasa?
    ar_eg: مين اللي بناها؟
    ar: من بناها؟
    en: Who built it?
  - speaker: Mbak Sekar
    text: Para Adipati Pakualam. Sampun langkung kalih atus taun.
    ar_eg: أمراء پاكوالام. من أكتر من ميتين سنة.
    ar: أمراء باكوالام، منذ أكثر من مئتي عام.
    en: The Pakualam princes. Over two hundred years ago.
    note:
      ar_eg: "كلمات: kalih = اتنين (loro ← dua)، كراما."
      ar: "مفردات: kalih = اثنان (loro ← dua)، كراما."
      en: "Words: kalih = two (ngoko loro, Indonesian dua), krama."
  - speaker: Mas Danang
    text: Pinten tiket mlebetipun, Bu?
    ar_eg: تذكرة الدخول بكام يا ست؟
    ar: بكم تذكرة الدخول يا سيّدتي؟
    en: How much is the entry ticket, Bu?
  - speaker: Mbak Sekar
    text: Mangga dipun takenaken wonten loket, Mas. Wonten ing ngriku.
    ar_eg: اسأل عند الشبّاك يا ماس. هناك.
    ar: اسأل عند الشبّاك يا ماس. هناك.
    en: Please ask at the counter, Mas. Over there.
    note:
      ar_eg: "كلمات: dipun = dipun- = di- بالكراما."
      ar: "مفردات: dipun = dipun- = di- في الكراما."
      en: "Words: dipun = dipun- = krama di-."
  - speaker: Mas Danang
    text: Ing pundi, Bu?
    ar_eg: فين يا ست؟
    ar: أين يا سيّدتي؟
    en: Where, Bu?
  - speaker: Mbak Sekar
    text: Ing ngriku, sisih tengen.
    ar_eg: هناك، على اليمين.
    ar: هناك، على اليمين.
    en: There, on the right.
    note:
      ar_eg: سيكار شاورت بالإبهام - في الراديو مش شايفينها، بس ده الأدب!
      ar: أشارت سيكار بإبهامها - لا نراها في الراديو، لكنّه الأدب!
      en: Sekar pointed with her thumb - you can't see it on radio, but that's the etiquette!
  - speaker: Mas Danang
    text: Matur nuwun. Kados pundi menawi badhe foto?
    ar_eg: متشكّر. ولو عايز أتصوّر، أعمل إيه؟
    ar: شكرًا. وكيف أفعل إن أردت التصوير؟
    en: Thank you. And how about taking photos?
  - speaker: Mbak Sekar
    text: Saged, nanging wonten papan ingkang mboten pareng. Mangga dipun tingali papanipun.
    ar_eg: ممكن، بس فيه أماكن ممنوع. بصّ على اللوحات.
    ar: يمكن، لكن ثمّة أماكن ممنوعة. انظر إلى اللافتات.
    en: You can, but some places aren't allowed. Please look at the signs.
- kind: word_spotlight
  title: Menapa, sinten, pundi
  lines:
  - speaker: Mbak Sekar
    text: Apa dadi menapa. Sapa dadi sinten. Ngendi dadi pundi.
    ar_eg: apa تبقى menapa. sapa تبقى sinten. ngendi تبقى pundi.
    ar: apa تصير menapa، وsapa تصير sinten، وngendi تصير pundi.
    en: Apa becomes menapa. Sapa becomes sinten. Ngendi becomes pundi.
  - speaker: Mas Danang
    text: Pira dadi pinten. Piye dadi kados pundi. Kenapa dadi kenging menapa.
    ar_eg: pira تبقى pinten. piye تبقى kados pundi. kenapa تبقى kenging menapa.
    ar: pira تصير pinten، وpiye تصير kados pundi، وkenapa تصير kenging menapa.
    en: Pira becomes pinten. Piye becomes kados pundi. Kenapa becomes kenging menapa.
    note:
      ar_eg: "كلمات: kenapa = ليه، ماله."
      ar: "مفردات: kenapa = لماذا، ما به."
      en: "Words: kenapa = why; what's wrong."
  - speaker: Mbak Sekar
    text: Lan sadurunge takon, matur "nyuwun pirsa" utawa "nyuwun sewu".
    ar_eg: وقبل ما تسأل، قول «nyuwun pirsa» أو «nyuwun sewu».
    ar: وقبل السؤال قل «nyuwun pirsa» أو «nyuwun sewu».
    en: And before you ask, say "nyuwun pirsa" or "nyuwun sewu".
  - speaker: Mas Danang
    text: "Lan aja lali, nggih!"
    ar_eg: "وماتنساش، ماشي!"
    ar: "ولا تنسَ، حسنًا!"
    en: "And don't forget, okay!"
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Nyuwun pirsa, menika menapa?
    ar_eg: لو سمحت أسأل، ده إيه؟
    ar: أستأذنك بسؤال، ما هذا؟
    en: May I ask, what is this?
  - speaker: Mas Danang
    text: Nyuwun pirsa, menika menapa?
    ar_eg: لو سمحت أسأل، ده إيه؟
    ar: أستأذنك بسؤال، ما هذا؟
    en: May I ask, what is this?
  - speaker: Mbak Sekar
    text: Sinten ingkang yasa?
    ar_eg: مين اللي بناه؟
    ar: من بناه؟
    en: Who built it?
  - speaker: Mas Danang
    text: Sinten ingkang yasa?
    ar_eg: مين اللي بناه؟
    ar: من بناه؟
    en: Who built it?
  - speaker: Mbak Sekar
    text: Loketipun wonten pundi?
    ar_eg: الشبّاك فين؟
    ar: أين الشبّاك؟
    en: Where's the counter?
  - speaker: Mas Danang
    text: Loketipun wonten pundi?
    ar_eg: الشبّاك فين؟
    ar: أين الشبّاك؟
    en: Where's the counter?
  - speaker: Mbak Sekar
    text: Tiketipun pinten?
    ar_eg: التذكرة بكام؟
    ar: بكم التذكرة؟
    en: How much is the ticket?
  - speaker: Mas Danang
    text: Tiketipun pinten?
    ar_eg: التذكرة بكام؟
    ar: بكم التذكرة؟
    en: How much is the ticket?
  - speaker: Mbak Sekar
    text: Kados pundi menawi badhe foto?
    ar_eg: لو عايز أتصوّر أعمل إيه؟
    ar: كيف أفعل إن أردت التصوير؟
    en: How about taking photos?
  - speaker: Mas Danang
    text: Kados pundi menawi badhe foto?
    ar_eg: لو عايز أتصوّر أعمل إيه؟
    ar: كيف أفعل إن أردت التصوير؟
    en: How about taking photos?
  - speaker: Mbak Sekar
    text: Kenging menapa mboten pareng?
    ar_eg: ليه ممنوع؟
    ar: لماذا هو ممنوع؟
    en: Why isn't it allowed?
  - speaker: Mas Danang
    text: Kenging menapa mboten pareng?
    ar_eg: ليه ممنوع؟
    ar: لماذا هو ممنوع؟
    en: Why isn't it allowed?
  - speaker: Mbak Sekar
    text: Sinten asmanipun, Bu?
    ar_eg: اسم حضرتك إيه يا ست؟
    ar: ما اسمك يا سيّدتي؟
    en: What's your name, Bu?
    note:
      ar_eg: "كلمات: asmanipun = اسمه (بأدب عالي)."
      ar: "مفردات: asmanipun = اسمه (بتوقير)."
      en: "Words: asmanipun = his/her name (honorific)."
  - speaker: Mas Danang
    text: Sinten asmanipun, Bu?
    ar_eg: اسم حضرتك إيه يا ست؟
    ar: ما اسمك يا سيّدتي؟
    en: What's your name, Bu?
  - speaker: Mas Danang
    text: Lan eling, "asma" iku krama inggil saka "jeneng". Kanggo wong liya, ora kanggo awake dhewe.
    ar_eg: "وافتكر، «asma» كراما إنجيل من «jeneng». للناس التانية، مش لنفسك."
    ar: "وتذكّر أنّ «asma» كراما إنغيل من «jeneng»، للآخرين لا لنفسك."
    en: "And remember, \"asma\" is krama inggil for \"jeneng\". For others, not yourself."
    note:
      ar_eg: "كلمات: kanggo = لـ، عشان (نغوكو)؛ asma = اسم (krama inggil، للكبير بس؛ ngoko jeneng، krama nami)؛ liya = تاني، غير."
      ar: "مفردات: kanggo = لِـ، من أجل (نغوكو)؛ asma = اسم (krama inggil للكبير؛ ngoko jeneng، وkrama nami)؛ liya = آخر، غير."
      en: "Words: kanggo = for (ngoko) = untuk; asma = name (krama inggil, for the elder only; ngoko jeneng, krama nami) = nama; liya = other, different."
  - speaker: Mbak Sekar
    text: Dadi takon "Asmanipun sinten?", nanging mangsuli "Nami kula Sekar."
    ar_eg: يعني تسأل «Asmanipun sinten?»، بس تردّ «Nami kula Sekar.»
    ar: فتسأل «Asmanipun sinten?» وتجيب «Nami kula Sekar.»
    en: So you ask "Asmanipun sinten?", but answer "Nami kula Sekar."
- kind: outro
  title: Pitakone Mas Mohamed
  lines:
  - speaker: Mas Danang
    text: "Mas Mohamed, saiki sampeyan. Takona telung pitakon nganggo krama."
    ar_eg: "يا ماس محمد، دورك دلوقتي. اسأل تلات أسئلة بالكراما."
    ar: "يا ماس محمد، الآن دورك. اطرح ثلاثة أسئلة بالكراما."
    en: "Mas Mohamed, now you. Ask three questions in krama."
    note:
      ar_eg: دورك! ابدأ بـ«Nyuwun pirsa»، واستخدم menapa وsinten وpundi.
      ar: دورك! ابدأ بـ«Nyuwun pirsa»، واستعمل menapa وsinten وpundi.
      en: Your turn! Start with "Nyuwun pirsa", and use menapa, sinten and pundi.
  - speaker: Mbak Sekar
    text: 'Contone: Nyuwun pirsa, Pak. Kamar mandi wonten pundi?'
    ar_eg: 'مثلًا: لو سمحت يا أستاذ، الحمّام فين؟'
    ar: 'مثلًا: أستأذنك يا سيّدي، أين الحمّام؟'
    en: 'For example: May I ask, Pak. Where is the bathroom?'
  - speaker: Mas Danang
    text: PR-mu, maca chat karo Pak Wiryo ing pelajaran, lan wangsulana kanthi krama.
    ar_eg: واجبك، اقرا الشات مع پاك ويريو في الدرس، وردّ بالكراما.
    ar: 'واجبك: اقرأ الدردشة مع باك ويريو في الدرس وأجب بالكراما.'
    en: 'Your homework: read the chat with Pak Wiryo in the lesson and reply in krama.'
    note:
      ar_eg: "كلمات: chat = شات، رسالة."
      ar: "مفردات: chat = دردشة، رسالة."
      en: "Words: chat = chat, message."
  - speaker: Mbak Sekar
    text: Sesuk kita menyang Pasar Beringharjo, tumbas batik! Nganti pinanggih malih!
    ar_eg: بكرة رايحين باسار بيرينجهارجو، نشتري باتيك! إلى اللقاء!
    ar: غدًا نذهب إلى سوق بيرينغهارجو لشراء الباتيك! إلى اللقاء!
    en: Tomorrow we go to Pasar Beringharjo to buy batik! Until next time!
