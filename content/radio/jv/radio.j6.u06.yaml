title:
  target: Pegon
  ar_eg: بيجون
  ar: بيغون
  en: Pegon
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pesantren ing Plered
  lines:
  - speaker: Mbak Sekar
    text: Assalamualaikum saking pesantren cedhak Plered. Kula Sekar. Menika episode pungkasan Kabar Radio basa Jawa.
    ar_eg: السلام عليكم من معهد ديني قريب من بليريد. أنا سيكار. دي آخر حلقة من راديو كابار بالجاوي.
    ar: السلام عليكم من معهد دينيّ قرب بليريد. أنا سيكار. هذه الحلقة الأخيرة من راديو كابار بالجاوية.
    en: Assalamualaikum from a pesantren near Plered. I'm Sekar. This is the last episode of Kabar Radio in Javanese.
  - speaker: Mas Danang
    text: Waalaikumsalam! Aku Danang. Aku rada sedhih, cah. Nanging dina iki pelajarane paling gampang kanggo Mas Mohamed!
    ar_eg: وعليكم السلام! أنا دانانج. أنا زعلان شويّة يا جماعة. بس النهارده الدرس أسهل حاجة لماس محمد!
    ar: وعليكم السلام! أنا دانانغ. حزين قليلًا، لكنّ درس اليوم هو الأسهل لماس محمد!
    en: Waalaikumsalam! I'm Danang. I'm a bit sad, folks. But today's lesson is the easiest one for Mas Mohamed!
  - speaker: Mbak Sekar
    text: Amarga dina iki kita sinau Pegon, basa Jawa sing ditulis nganggo huruf Arab.
    ar_eg: عشان النهارده هنتعلّم الپيجون، الجاوي المكتوب بالحروف العربي.
    ar: لأنّنا نتعلّم اليوم بيغون، أي الجاوية المكتوبة بالحروف العربية.
    en: Because today we learn Pegon, Javanese written in Arabic letters.
    note:
      ar_eg: الپيجون اتكتب بيه الجاوي في المعاهد الدينية من قرون. انت هتقراه أسرع من أيّ حدّ في الفصل!
      ar: كُتبت الجاوية بالبيغون في المعاهد الدينية منذ قرون، وستقرؤها أسرع من أيّ أحد!
      en: Pesantren have written Javanese in Pegon for centuries. You'll read it faster than anyone!
- kind: dialogue
  title: Ing kelas santri
  lines:
  - speaker: Mas Danang
    text: Mbak, santri-santri iki maca kitab. Ing ngisor saben tembung Arab ana tulisan cilik miring. Iku apa?
    ar_eg: يا مباك، الطلبة دول بيقروا كتاب. تحت كلّ كلمة عربي فيه كتابة صغيّرة مايلة. دي إيه؟
    ar: يا مباك، هؤلاء الطلبة يقرؤون كتابًا، وتحت كلّ كلمة عربية كتابة صغيرة مائلة. ما هي؟
    en: Mbak, these students are reading a kitab. Under every Arabic word there's small slanted writing. What's that?
  - speaker: Mbak Sekar
    text: Iku makna gandul. Tegese "makna sing gumantung". Terjemahan basa Jawa tembung siji-siji, ditulis nganggo Pegon.
    ar_eg: دي makna gandul. معناها «المعنى المتعلّق». ترجمة جاوي كلمة كلمة، مكتوبة بالپيجون.
    ar: 'هذه makna gandul أي «المعنى المعلّق»: ترجمة جاوية كلمةً كلمة مكتوبة بالبيغون.'
    en: That's makna gandul. It means "hanging meaning". A word-by-word Javanese translation, written in Pegon.
    note:
      ar_eg: makna gandul = الترجمة المتعلّقة تحت السطر. الطالب بيكتبها بإيده وهو بيسمع الشيخ.
      ar: makna gandul الترجمة المعلّقة تحت السطر، يكتبها الطالب بيده وهو يستمع إلى الشيخ.
      en: Makna gandul hangs under the line; the student writes it by hand while listening to the teacher.
  - speaker: Mas Danang
    text: Lan tembung sing paling akeh iku "utawi". Kenapa?
    ar_eg: والكلمة اللي متكرّرة أكتر حاجة هي utawi. ليه؟
    ar: والكلمة الأكثر تكرارًا هي utawi. لماذا؟
    en: And the most common word is "utawi". Why?
  - speaker: Mbak Sekar
    text: '"Utawi" iku tandha mubtada, lan "iku" tandha khabar. Kaya nahwu, nanging nganggo basa Jawa.'
    ar_eg: utawi علامة المبتدأ، وiku علامة الخبر. زي النحو، بس بالجاوي.
    ar: utawi علامة المبتدأ وiku علامة الخبر، كالنحو لكن بالجاوية.
    en: '"Utawi" marks the subject, and "iku" marks the predicate. Like Arabic grammar, but in Javanese.'
    note:
      ar_eg: utawi ... iku = المبتدأ ... الخبر. الطالب بيفهم النحو العربي من الترجمة الجاوي نفسها.
      ar: utawi ... iku = المبتدأ ... الخبر، فيفهم الطالب النحو العربيّ من الترجمة نفسها.
      en: Utawi ... iku marks mubtada ... khabar, so the grammar is read right out of the translation.
  - speaker: Mas Danang
    text: Mbak, Pegon nganggo huruf Arab kabeh? Ora ana huruf anyar?
    ar_eg: يا مباك، الپيجون كلّه بحروف عربي؟ مفيش حروف جديدة؟
    ar: يا مباك، هل البيغون كلّه بحروف عربية؟ ألا حروف جديدة؟
    en: Mbak, does Pegon use only Arabic letters? No new letters?
  - speaker: Mbak Sekar
    text: 'Ana sawetara, kanggo swara sing ora ana ing basa Arab: nga, ca, pa, ga, nya, dha, tha. Akeh-akehe ditambahi titik.'
    ar_eg: 'فيه شويّة، للأصوات اللي مش موجودة في العربي: nga ca pa ga nya dha tha. أغلبهم بنقط زيادة.'
    ar: 'هناك بضعة حروف لأصوات غير موجودة في العربية: nga وca وpa وga وnya وdha وtha، وأغلبها بنقاط زائدة.'
    en: 'A few, for sounds Arabic doesn''t have: nga, ca, pa, ga, nya, dha, tha. Mostly with extra dots.'
    note:
      ar_eg: ڠ nga، چ ca، ڤ pa، ڮ ga، ۑ nya، ڎ dha، ڟ tha. كلّها حروف عربي انت عارفها، بنقط زيادة.
      ar: ڠ nga وچ ca وڤ pa وڮ ga وۑ nya وڎ dha وڟ tha، كلّها حروف عربية تعرفها مع نقاط زائدة.
      en: 'ڠ nga, چ ca, ڤ pa, ڮ ga, ۑ nya, ڎ dha, ڟ tha: all Arabic letters you know, with extra dots.'
  - speaker: Mas Danang
    text: Dadi "ngaji" ditulis nganggo nga sing ana titik telu. Gampang banget kanggo wong Mesir!
    ar_eg: يعني ngaji بتتكتب بالـ nga اللي فوقها تلات نقط. سهلة جدًّا على المصري!
    ar: إذن ngaji تُكتب بـ nga ذات النقاط الثلاث. سهل جدًّا على المصريّ!
    en: So "ngaji" is written with the three-dot nga. Super easy for an Egyptian!
    note:
      ar_eg: 'ڠاجي = ngaji. وخلّي بالك: في الپيجون الـ چ هي c، لكن في كتابة النطق بتاعة Kabar الـ چ هي j. نظامين مختلفين!'
      ar: 'ڠاجي = ngaji. وانتبه: في البيغون چ هي c، أمّا في تلميحات النطق في Kabar فـچ تعني j. نظامان مختلفان!'
      en: 'ڠاجي = ngaji. Careful: in Pegon چ is c, but in Kabar''s pronunciation hints چ stands for j. Two different systems!'
- kind: word_spotlight
  title: Pegon lan pesantren
  lines:
  - speaker: Mbak Sekar
    text: 'Pegon: huruf Arab kanggo basa Jawa. Pesantren: pondhok kanggo sinau agama. Santri: murid ing pesantren.'
    ar_eg: 'pegon: حروف عربي للجاوي. pesantren: معهد لدراسة الدين. santri: طالب في المعهد.'
    ar: 'pegon: حروف عربية للجاوية. pesantren: معهد لدراسة الدين. santri: طالب المعهد.'
    en: 'Pegon: Arabic letters for Javanese. Pesantren: a boarding school for religion. Santri: a pesantren student.'
  - speaker: Mas Danang
    text: 'Kitab: buku agama. Makna gandul: terjemahan sing gumantung. Nasehat: pitutur, kaya ing basa Arab!'
    ar_eg: 'kitab: كتاب ديني. makna gandul: الترجمة المتعلّقة. nasehat: نصيحة، زي العربي!'
    ar: 'kitab: كتاب دينيّ. makna gandul: الترجمة المعلّقة. nasehat: نصيحة، كالعربية!'
    en: 'Kitab: a religious book. Makna gandul: the hanging translation. Nasehat: advice, just like Arabic!'
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Pegon iku huruf Arab kanggo basa Jawa.
    ar_eg: الپيجون حروف عربي للجاوي.
    ar: البيغون حروف عربية للجاوية.
    en: Pegon is Arabic letters for Javanese.
  - speaker: Mas Danang
    text: Pegon iku huruf Arab kanggo basa Jawa.
    ar_eg: الپيجون حروف عربي للجاوي.
    ar: البيغون حروف عربية للجاوية.
    en: Pegon is Arabic letters for Javanese.
  - speaker: Mbak Sekar
    text: Santri maca kitab.
    ar_eg: الطالب بيقرا الكتاب.
    ar: الطالب يقرأ الكتاب.
    en: The student reads the kitab.
  - speaker: Mas Danang
    text: Santri maca kitab.
    ar_eg: الطالب بيقرا الكتاب.
    ar: الطالب يقرأ الكتاب.
    en: The student reads the kitab.
  - speaker: Mbak Sekar
    text: Utawi ... iku.
    ar_eg: المبتدأ ... الخبر.
    ar: المبتدأ ... الخبر.
    en: Utawi ... iku.
  - speaker: Mas Danang
    text: Utawi ... iku.
    ar_eg: المبتدأ ... الخبر.
    ar: المبتدأ ... الخبر.
    en: Utawi ... iku.
  - speaker: Mas Danang
    text: Mbak, aku pengin nulis "santri" nganggo Pegon. Sa, na, ta, ra, lan ya. Bener?
    ar_eg: يا مباك، عايز أكتب santri بالپيجون. سين ونون وتاء وراء وياء. صحّ؟
    ar: 'يا مباك، أريد كتابة santri بالبيغون: سين نون تاء راء ياء. صحيح؟'
    en: Mbak, I want to write "santri" in Pegon. Sa, na, ta, ra and ya. Right?
  - speaker: Mbak Sekar
    text: Bener, Danang! Sampeyan wis dadi santri Pegon.
    ar_eg: صحّ يا دانانج! انت بقيت طالب پيجون.
    ar: صحيح يا دانانغ! صرتَ طالب بيغون.
    en: Right, Danang! You're a Pegon student now.
- kind: outro
  title: Matur nuwun, Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saking "sugeng enjing" ngantos Pegon. Panjenengan sampun nempuh dalan ingkang panjang. Kula bangga.
    ar_eg: يا ماس محمد، من «صباح الخير» لحدّ الپيجون. حضرتك مشيت طريق طويل. أنا فخورة بيك.
    ar: يا ماس محمد، من «صباح الخير» حتّى البيغون، قطعتَ طريقًا طويلًا. أنا فخورة بك.
    en: Mas Mohamed, from "good morning" all the way to Pegon. You've come a long way. I'm proud of you.
  - speaker: Mas Danang
    text: Aku uga, cah! Saiki kowe bisa ngomong, maca, lan nulis basa Jawa. Aja lali, ya!
    ar_eg: وأنا كمان يا جماعة! دلوقتي انت بتعرف تتكلّم وتقرا وتكتب جاوي. ماتنساش، ماشي!
    ar: وأنا أيضًا! صرتَ الآن تتكلّم الجاوية وتقرؤها وتكتبها. لا تنسَ!
    en: Me too, folks! Now you can speak, read and write Javanese. Don't forget, okay!
    note:
      ar_eg: cah = يا جماعة، بين الصحاب. aja = ماتعملش (في الشات بتتكتب ojo).
      ar: cah = يا جماعة بين الأصدقاء. aja = لا تفعل (وتُكتب ojo في الدردشة).
      en: Cah = folks, among friends. Aja = don't (typed ojo in chat).
  - speaker: Mbak Sekar
    text: 'PR pungkasan: tulisen nasehat cekak kanggo kanca nganggo Pegon. Kaya santri ing Plered.'
    ar_eg: 'آخر واجب: اكتب نصيحة قصيّرة لصاحبك بالپيجون. زي طلبة بليريد.'
    ar: 'الواجب الأخير: اكتب نصيحة قصيرة لصديق بالبيغون، مثل طلبة بليريد.'
    en: 'Last homework: write a short piece of advice to a friend in Pegon. Like the students in Plered.'
  - speaker: Mas Danang
    text: Matur nuwun wis ngrungokake Kabar Radio. Nganti ketemu maneh, cah!
    ar_eg: شكرًا إنّك سمعت راديو كابار. نشوفك تاني يا جماعة!
    ar: شكرًا لاستماعك إلى راديو كابار. إلى اللقاء يا جماعة!
    en: Thanks for listening to Kabar Radio. See you again, folks!
  - speaker: Mbak Sekar
    text: Nganti pinanggih malih, Mas Mohamed. Sugeng sinau!
    ar_eg: إلى اللقاء يا ماس محمد. مذاكرة سعيدة!
    ar: إلى اللقاء يا ماس محمد. تعلّمًا موفّقًا!
    en: Until next time, Mas Mohamed. Happy learning!
