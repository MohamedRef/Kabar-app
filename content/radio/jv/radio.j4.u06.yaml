review:
  status: draft
  verified: false
  notes: 'Wayang levels: punakawan clowns speak ngoko and joke, nobles speak krama. Ramayana ballet at Prambanan (performed in the open-air theatre in the dry season - left general). Last Yogya episode before Semarang.'
