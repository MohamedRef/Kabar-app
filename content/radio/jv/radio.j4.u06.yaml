title:
  target: Wayang lan gamelan
  ar_eg: الوايانج والجاملان
  ar: الوايانغ والغاملان
  en: Wayang and gamelan
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Galih
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Prambanan
  lines:
  - speaker: Mas Galih
    text: Sugeng dalu saking Prambanan! Candhine gedhe lan dhuwur, kena lampu bengi. Kula Galih.
    ar_eg: مساء الخير من برامبانان! المعبد كبير وعالي، والنور منوّره بالليل. أنا جاليه.
    ar: مساء الخير من برامبانان! المعبد كبير وشاهق، تضيئه الأنوار ليلًا. أنا غاليه.
    en: Good evening from Prambanan! The temple is huge and tall, lit up at night. I'm Galih.
    note:
      ar_eg: برامبانان مجمّع معابد هندوسية من القرن التاسع، وقدّامه بيتعرض باليه رامايانا في الهوا الطلق.
      ar: برامبانان مجمّع معابد هندوسية من القرن التاسع، يُعرض أمامه باليه رامايانا في الهواء الطلق.
      en: Prambanan is a 9th-century Hindu temple complex; the Ramayana ballet is staged in front of it in the open air.
  - speaker: Mbak Sekar
    text: Kula Sekar. Sakedhap malih wonten pentas Ramayana. Gamelanipun sampun muni.
    ar_eg: أنا سيكار. شويّة وهيبدأ عرض رامايانا. الجاملان ابتدى يعزف.
    ar: أنا سيكار. بعد قليل يبدأ عرض رامايانا. وقد بدأ الغاملان يعزف.
    en: I'm Sekar. The Ramayana show starts soon. The gamelan is already playing.
  - speaker: Mas Galih
    text: Dina iki kita sinau wayang lan gamelan. Lan sing paling menarik, basa ing wayang!
    ar_eg: النهارده هنتعلّم الوايانج والجاملان. والأحلى، الكلام في الوايانج!
    ar: 'اليوم نتعلّم الوايانغ والغاملان. والأطرف: لغة الوايانغ!'
    en: Today we learn about wayang and gamelan. And the best part, the language in wayang!
  - speaker: Mbak Sekar
    text: Ing wayang, ratu ngomong krama, abdi matur krama andhap, lan punakawan guyon nganggo ngoko.
    ar_eg: في الوايانج، الملك بيتكلّم كراما، والخدّام بيقولوا كراما أنداپ، والمهرّجين بيهزّروا بالنجوكو.
    ar: في الوايانغ يتكلّم الملك الكراما، ويخاطب الخدم بالكراما أنداب، ويمزح المهرّجون بالنغوكو.
    en: In wayang, kings speak krama, servants use krama andhap, and the punakawan clowns joke in ngoko.
- kind: dialogue
  title: Petruk lan Gareng
  lines:
  - speaker: Mas Galih
    text: Sekar, ayo dadi wayang. Aku Petruk, kowe Gareng. Punakawan loro!
    ar_eg: يا سيكار، يلّا نبقى عرايس وايانج. أنا پيتروك، وانتي جاريينج. اتنين مهرّجين!
    ar: يا سيكار، لنمثّل الوايانغ. أنا بيتروك وأنتِ غارينغ. مهرّجان!
    en: Sekar, let's be wayang. I'm Petruk, you're Gareng. Two clowns!
    note:
      ar_eg: Semar وأولاده Gareng وPetruk وBagong = الـpunakawan، خدّام الأبطال المضحكين والحكما. مش موجودين في رامايانا الهندي - دول اختراع جاوي!
      ar: سيمار وأبناؤه غارينغ وبيتروك وباغونغ = الـpunakawan، خدم الأبطال الظرفاء الحكماء. لا وجود لهم في الرامايانا الهندية - إنّهم اختراع جاويّ!
      en: Semar and his sons Gareng, Petruk and Bagong are the punakawan, funny wise servants of the heroes. They're not in the Indian epic - a Javanese invention!
  - speaker: Mbak Sekar
    text: Truk, kowe wis mangan? Irungmu dawa banget, kok ora krasa luwe?
    ar_eg: يا تروك، انت كلت؟ مناخيرك طويلة أوي، إزّاي مش حاسس بالجوع؟
    ar: يا تروك، هل أكلت؟ أنفك طويل جدًّا، كيف لا تشعر بالجوع؟
    en: Truk, have you eaten? Your nose is so long, how come you don't feel hungry?
  - speaker: Mas Galih
    text: Hahaha! Irungku dawa merga aku pinter, Reng. Ambu sega saka adoh!
    ar_eg: ههههه! مناخيري طويلة عشان أنا شاطر يا رينج. بشمّ ريحة الرز من بعيد!
    ar: ههههه! أنفي طويل لأنّي ذكيّ يا رينغ. أشمّ رائحة الأرز من بعيد!
    en: Hahaha! My nose is long because I'm clever, Reng. I smell rice from far away!
  - speaker: Mbak Sekar
    text: Ssst! Ndara Arjuna rawuh. Ayo, basane diganti!
    ar_eg: هسّ! سيّدنا أرجونا جه. يلّا، غيّر الكلام!
    ar: صه! السيّد أرجونا قد حضر. هيّا، غيّر الكلام!
    en: Shh! Lord Arjuna is coming. Quick, change how you speak!
    note:
      ar_eg: ndara = سيّدي (من الخدّام للسيّد). شوف إزّاي الكلام بيتغيّر لمّا السيّد ييجي!
      ar: ndara = سيّدي (من الخادم لسيّده). لاحظ كيف يتغيّر الكلام حين يأتي السيّد!
      en: Ndara = master (servant to lord). Notice how the speech changes when the master arrives!
  - speaker: Mas Galih
    text: Nuwun sewu, Ndara. Kula Petruk sowan. Menapa wonten dhawuh?
    ar_eg: لا مؤاخذة يا سيّدي. أنا پيتروك جيت أخدمك. فيه أوامر؟
    ar: عذرًا يا سيّدي. أنا بيتروك جئت إليك. هل من أمر؟
    en: Forgive me, master. I, Petruk, present myself. Is there any command?
  - speaker: Mbak Sekar
    text: Kula Gareng ugi ndherek, Ndara.
    ar_eg: وأنا جاريينج معاه كمان يا سيّدي.
    ar: وأنا غارينغ أرافقه أيضًا يا سيّدي.
    en: I, Gareng, am here too, master.
  - speaker: Mas Galih
    text: Lho, Ndara tindak. Wis, Reng, ayo mangan maneh!
    ar_eg: إيه ده، السيّد مشي. خلاص يا رينج، يلّا ناكل تاني!
    ar: عجبًا، رحل السيّد. هيّا يا رينغ، لنأكل مجدّدًا!
    en: Oh, the master's gone. Right, Reng, let's eat again!
  - speaker: Mbak Sekar
    text: Hahaha! Mas Mohamed, iki kunci wayang. Punakawan ngoko karo kanca, nanging krama karo ndara.
    ar_eg: ههههه! يا ماس محمد، ده سرّ الوايانج. المهرّجين نجوكو مع بعض، وكراما مع السيّد.
    ar: ههههه! يا ماس محمد، هذا مفتاح الوايانغ. المهرّجون نغوكو فيما بينهم، وكراما مع السيّد.
    en: Hahaha! Mas Mohamed, this is the key to wayang. Clowns speak ngoko to each other, krama to the master.
  - speaker: Mas Galih
    text: Lan dhalang sing nglakokake kabeh wayang, sewengi natas! Swarane ganti-ganti.
    ar_eg: والدالانج اللي بيحرّك كل العرايس، طول الليل لحدّ الصبح! وصوته بيتغيّر على طول.
    ar: والدالانغ الذي يحرّك كلّ الدمى طوال الليل حتى الفجر! يغيّر صوته باستمرار.
    en: And the dhalang moves every puppet, all night until dawn! His voice keeps changing.
    note:
      ar_eg: dhalang = محرّك العرايس وراوي الحكاية. عرض الوايانج كوليت (عرايس الجلد) ممكن ياخد الليل كلّه.
      ar: dhalang = محرّك الدمى وراوي القصّة. وقد يستغرق عرض الوايانغ كوليت (دمى الجلد) الليل كلّه.
      en: The dhalang is puppeteer and narrator. A wayang kulit (leather puppet) show can last all night.
- kind: word_spotlight
  title: Gamelan
  lines:
  - speaker: Mbak Sekar
    text: Gamelan iku kelompok gamelan... eh, kelompok piranti. Kendhang, gong, saron, bonang.
    ar_eg: الجاملان مجموعة آلات. kendhang طبلة، gong، saron، bonang.
    ar: 'الغاملان مجموعة آلات: kendhang طبل، وgong، وsaron، وbonang.'
    en: Gamelan is an ensemble of instruments. Kendhang drum, gong, saron, bonang.
  - speaker: Mas Galih
    text: Kendhang nuntun irama. Gong muni ing pungkasan. Gong!
    ar_eg: الطبلة بتقود الإيقاع. الجونج بيضرب في الآخر. جونج!
    ar: الطبل يقود الإيقاع، والغونغ يدقّ في الختام. غونغ!
    en: The kendhang leads the rhythm. The gong sounds at the end. Gong!
  - speaker: Mbak Sekar
    text: Wayang kulit, saka kulit. Wayang golek, saka kayu. Wayang wong, uwong sing nari.
    ar_eg: وايانج كوليت من الجلد. وايانج جوليك من الخشب. وايانج وونج، ناس بترقص.
    ar: وايانغ كوليت من الجلد، ووايانغ غوليك من الخشب، ووايانغ وونغ بشر يرقصون.
    en: Wayang kulit, of leather. Wayang golek, of wood. Wayang wong, people dancing.
  - speaker: Mas Galih
    text: 'Lan punakawan: Semar, Gareng, Petruk, Bagong. Semar iku bapake, paling wicaksana.'
    ar_eg: 'والمهرّجين: سيمار، جاريينج، پيتروك، باجونج. سيمار هو الأب، وأحكمهم.'
    ar: 'والمهرّجون: سيمار وغارينغ وبيتروك وباغونغ. سيمار الأب وأحكمهم.'
    en: 'And the punakawan: Semar, Gareng, Petruk, Bagong. Semar is the father, the wisest.'
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Nuwun sewu, Ndara.
    ar_eg: لا مؤاخذة يا سيّدي.
    ar: عذرًا يا سيّدي.
    en: Forgive me, master.
  - speaker: Mas Galih
    text: Nuwun sewu, Ndara.
    ar_eg: لا مؤاخذة يا سيّدي.
    ar: عذرًا يا سيّدي.
    en: Forgive me, master.
  - speaker: Mbak Sekar
    text: Menapa wonten dhawuh?
    ar_eg: فيه أوامر؟
    ar: هل من أمر؟
    en: Is there any command?
  - speaker: Mas Galih
    text: Menapa wonten dhawuh?
    ar_eg: فيه أوامر؟
    ar: هل من أمر؟
    en: Is there any command?
  - speaker: Mbak Sekar
    text: Kowe wis mangan, Truk?
    ar_eg: انت كلت يا تروك؟
    ar: هل أكلت يا تروك؟
    en: Have you eaten, Truk?
  - speaker: Mas Galih
    text: Kowe wis mangan, Truk?
    ar_eg: انت كلت يا تروك؟
    ar: هل أكلت يا تروك؟
    en: Have you eaten, Truk?
  - speaker: Mbak Sekar
    text: Gamelanipun sampun muni.
    ar_eg: الجاملان ابتدى.
    ar: بدأ الغاملان يعزف.
    en: The gamelan has started.
  - speaker: Mas Galih
    text: Gamelanipun sampun muni.
    ar_eg: الجاملان ابتدى.
    ar: بدأ الغاملان يعزف.
    en: The gamelan has started.
  - speaker: Mbak Sekar
    text: Dhalang nglakokake wayang.
    ar_eg: الدالانج بيحرّك العرايس.
    ar: يحرّك الدالانغ الدمى.
    en: The dhalang moves the puppets.
  - speaker: Mas Galih
    text: Dhalang nglakokake wayang.
    ar_eg: الدالانج بيحرّك العرايس.
    ar: يحرّك الدالانغ الدمى.
    en: The dhalang moves the puppets.
- kind: outro
  title: Mas Mohamed dadi dhalang
  lines:
  - speaker: Mas Galih
    text: Mas Mohamed, saiki sampeyan dhalang! Gawe adegan cilik. Petruk lan Gareng ngoko, banjur ndara rawuh, banjur krama.
    ar_eg: يا ماس محمد، دلوقتي انت الدالانج! اعمل مشهد صغيّر. پيتروك وجاريينج نجوكو، وبعدين السيّد ييجي، وبعدين كراما.
    ar: 'يا ماس محمد، أنت الآن الدالانغ! اصنع مشهدًا صغيرًا: بيتروك وغارينغ بالنغوكو، ثمّ يحضر السيّد فتأتي الكراما.'
    en: Mas Mohamed, now you're the dhalang! Make a little scene. Petruk and Gareng in ngoko, then the master arrives, then krama.
    note:
      ar_eg: دورك! جملتين نجوكو، وجملتين كراما. غيّر صوتك زي الدالانج!
      ar: دورك! جملتان نغوكو وجملتان كراما، وغيّر صوتك كالدالانغ!
      en: Your turn! Two ngoko lines, two krama lines. Change your voice like a dhalang!
  - speaker: Mbak Sekar
    text: PR-mu, wacanen crita wayang ing pelajaran, lan golekana sapa sing ngomong krama lan sapa ngoko.
    ar_eg: واجبك، اقرا حكاية الوايانج في الدرس، وشوف مين بيتكلّم كراما ومين نجوكو.
    ar: 'واجبك: اقرأ حكاية الوايانغ في الدرس وحدّد من يتكلّم الكراما ومن النغوكو.'
    en: 'Your homework: read the wayang story in the lesson and find who speaks krama and who ngoko.'
  - speaker: Mas Galih
    text: Matur nuwun, Yogya! Sesuk kita pindhah dhateng Semarang, sinau maca basa Jawa sing tenan.
    ar_eg: شكرًا يا يوجيا! بكرة هننقل سيمارانج، نتعلّم نقرا جاوي حقيقي.
    ar: شكرًا يا يوغيا! غدًا ننتقل إلى سيمارانغ لنتعلّم قراءة الجاوية الحقيقية.
    en: Thank you, Yogya! Tomorrow we move to Semarang, to learn to read real Javanese.
  - speaker: Mbak Sekar
    text: Nganti pinanggih malih! Gong!
    ar_eg: إلى اللقاء! جونج!
    ar: إلى اللقاء! غونغ!
    en: Until next time! Gong!
