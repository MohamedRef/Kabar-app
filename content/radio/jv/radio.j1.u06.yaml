schema: kabar.radio/v1
id: radio.j1.u06
language: jv
level: j1
unit: j1.u06
title:
  target: Nang endi?
  ar_eg: على فين؟
  ar: إلى أين؟
  en: Where to?
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Wonokromo
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saka Wonokromo! Ing kene ana terminal, pasar, lan kebun binatang Suroboyo. Aku Sekar.
    ar_eg: صباح الخير من وونوكرومو! هنا فيه موقف، وسوق، وجنينة حيوانات سورابايا. أنا سيكار.
    ar: صباح الخير من وونوكرومو! هنا موقف حافلات وسوق وحديقة حيوان سورابايا. أنا سيكار.
    en: Good morning from Wonokromo! There's a bus terminal, a market and the Surabaya zoo here. I'm Sekar.
  - speaker: Mas Danang
    text: Aku Danang. Lan aku kesasar, hehe. Dina iki kita sinau takon dalan.
    ar_eg: أنا دانانج. وأنا تايه، هههه. النهارده هنتعلّم نسأل على الطريق.
    ar: أنا دانانغ. وقد ضللت الطريق، هههه. اليوم نتعلّم السؤال عن الطريق.
    en: I'm Danang. And I'm lost, hehe. Today we learn to ask the way.
  - speaker: Mbak Sekar
    text: 'Tembunge: nang, neng, saka. Kene, kono, kana. Iki, kuwi, kae.'
    ar_eg: 'الكلمات: nang، neng، saka. هنا، هناك، هناك بعيد. ده، ده (اللي جنبك)، ده (اللي بعيد).'
    ar: 'الكلمات: nang وneng وsaka. هنا، هناك، هنالك. هذا، ذاك، ذلك البعيد.'
    en: 'The words: nang, neng, saka. Here, there, over there. This, that, that one over there.'
- kind: dialogue
  title: Takon dalan nang kebun binatang
  lines:
  - speaker: Mas Danang
    text: Sekar, aku turis sing kesasar. Kowe wong kene, ya.
    ar_eg: يا سيكار، أنا سايح تايه، وانتي بنت المنطقة.
    ar: يا سيكار، أنا سائح تائه وأنتِ من أهل المنطقة.
    en: Sekar, I'm a lost tourist. You're a local.
  - speaker: Mas Danang
    text: Nuwun sewu, Mbak. Kebun binatang nang endi, ya?
    ar_eg: لا مؤاخذة يا مباك. جنينة الحيوانات فين؟
    ar: عذرًا يا مباك. أين حديقة الحيوان؟
    en: Excuse me, Mbak. Where's the zoo?
    note:
      ar_eg: Nuwun sewu = لا مؤاخذة / بعد إذنك. مؤدّبة ومناسبة مع أي حدّ غريب.
      ar: Nuwun sewu = عذرًا / بعد إذنك. مهذّبة ومناسبة مع أيّ غريب.
      en: Nuwun sewu = excuse me. Polite, safe with any stranger.
  - speaker: Mbak Sekar
    text: Ora adoh, Mas. Saka kene lurus wae, banjur ngiwa ing prapatan.
    ar_eg: مش بعيد يا ماس. من هنا على طول، وبعدين شمال عند التقاطع.
    ar: ليست بعيدة يا ماس. من هنا مباشرة، ثمّ يسارًا عند التقاطع.
    en: Not far, Mas. Straight on from here, then left at the crossroads.
  - speaker: Mas Danang
    text: Prapatan sing endi? Sing kuwi?
    ar_eg: أنهي تقاطع؟ اللي هناك ده؟
    ar: أيّ تقاطع؟ ذاك؟
    en: Which crossroads? That one?
  - speaker: Mbak Sekar
    text: Dudu sing kuwi. Sing kae, sing ana patung baya lan iwak hiu.
    ar_eg: مش ده. اللي هناك بعيد، اللي فيه تمثال التمساح وسمكة القرش.
    ar: ليس ذاك. ذلك البعيد، الذي فيه تمثال التمساح وسمكة القرش.
    en: Not that one. That one over there, with the crocodile and shark statue.
    note:
      ar_eg: تمثال القرش (sura) والتمساح (baya) رمز سورابايا، ومنه جه اسم المدينة حسب الحكاية.
      ar: تمثال القرش (sura) والتمساح (baya) رمز سورابايا، ومنه اسم المدينة بحسب الحكاية.
      en: The shark (sura) and crocodile (baya) statue is Surabaya's symbol; the legend says the city's name comes from them.
  - speaker: Mas Danang
    text: Oh, sing kae! Banjur sawise ngiwa?
    ar_eg: آه، اللي هناك! وبعد ما أخش شمال؟
    ar: آه، ذاك البعيد! وبعد الانعطاف يسارًا؟
    en: Oh, that one! And after turning left?
  - speaker: Mbak Sekar
    text: Mlaku sithik, kebun binatange ana ing sisih tengen dalan.
    ar_eg: تمشي شويّة، وجنينة الحيوانات على يمين الطريق.
    ar: تمشي قليلًا، وتكون الحديقة على يمين الطريق.
    en: Walk a little, the zoo is on the right side of the road.
  - speaker: Mas Danang
    text: Matur nuwun, Mbak. Sampeyan saka kene?
    ar_eg: متشكّر يا مباك. انتي من هنا؟
    ar: شكرًا يا مباك. هل أنتِ من هنا؟
    en: Thank you, Mbak. Are you from here?
  - speaker: Mbak Sekar
    text: Ora, aku saka Solo. Nanging aku wis suwe manggon ing kene.
    ar_eg: لأ، أنا من سولو. بس أنا عايشة هنا من زمان.
    ar: لا، أنا من سولو، لكنّني أسكن هنا منذ زمن.
    en: No, I'm from Solo. But I've lived here a long time.
- kind: word_spotlight
  title: Iki, kuwi, kae
  lines:
  - speaker: Mas Danang
    text: Iki cedhak aku. Kuwi cedhak kowe. Kae adoh saka awake dhewe loro.
    ar_eg: iki جنبي أنا. kuwi جنبك انت. kae بعيد عن الاتنين.
    ar: iki قربي. kuwi قربك. kae بعيد عنّا نحن الاثنين.
    en: Iki is near me. Kuwi is near you. Kae is far from both of us.
    note:
      ar_eg: زي «ده» و«ده اللي عندك» و«ده اللي هناك». الإندونيسي فيه itu بس، الجاوي فيه مسافتين.
      ar: مثل «هذا» و«ذاك» و«ذلك»؛ في الإندونيسية itu فقط، وفي الجاوية مسافتان.
      en: Like "this", "that (by you)" and "that over there". Indonesian has just itu; Javanese has two distances.
  - speaker: Mbak Sekar
    text: Kene, kono, kana padha. Kene cedhak, kono rada adoh, kana adoh banget.
    ar_eg: kene وkono وkana نفس الفكرة. kene قريب، kono بعيد شويّة، kana بعيد أوي.
    ar: وكذلك kene وkono وkana. kene قريب، kono أبعد قليلًا، kana بعيد جدًّا.
    en: Kene, kono, kana work the same. Kene is near, kono a bit far, kana very far.
  - speaker: Mas Danang
    text: Ngiwa, nengen, lurus. Ngarep, mburi.
    ar_eg: شمال، يمين، على طول. قدّام، ورا.
    ar: يسارًا، يمينًا، مباشرة. أمام، خلف.
    en: Left, right, straight. In front, behind.
  - speaker: Mbak Sekar
    text: Lan nang utawa neng kanggo "menyang" utawa "ing". Ing chat ditulis "ng" wae.
    ar_eg: وnang أو neng يعني «لـ» أو «في». في الشات بتتكتب «ng» بس.
    ar: وnang أو neng تعني «إلى» أو «في». وفي الدردشة تُكتب «ng» فقط.
    en: And nang or neng means "to" or "at". In chats it's just "ng".
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Nuwun sewu, kebun binatang nang endi?
    ar_eg: لا مؤاخذة، جنينة الحيوانات فين؟
    ar: عذرًا، أين حديقة الحيوان؟
    en: Excuse me, where's the zoo?
  - speaker: Mas Danang
    text: Nuwun sewu, kebun binatang nang endi?
    ar_eg: لا مؤاخذة، جنينة الحيوانات فين؟
    ar: عذرًا، أين حديقة الحيوان؟
    en: Excuse me, where's the zoo?
  - speaker: Mbak Sekar
    text: Lurus wae, banjur ngiwa.
    ar_eg: على طول، وبعدين شمال.
    ar: مباشرة، ثمّ يسارًا.
    en: Straight on, then left.
  - speaker: Mas Danang
    text: Lurus wae, banjur ngiwa.
    ar_eg: على طول، وبعدين شمال.
    ar: مباشرة، ثمّ يسارًا.
    en: Straight on, then left.
  - speaker: Mbak Sekar
    text: Dudu sing kuwi, sing kae.
    ar_eg: مش ده، اللي هناك.
    ar: ليس ذاك، بل ذلك البعيد.
    en: Not that one, that one over there.
  - speaker: Mas Danang
    text: Dudu sing kuwi, sing kae.
    ar_eg: مش ده، اللي هناك.
    ar: ليس ذاك، بل ذلك البعيد.
    en: Not that one, that one over there.
  - speaker: Mbak Sekar
    text: Ana ing sisih tengen.
    ar_eg: على الجنب اليمين.
    ar: على الجانب الأيمن.
    en: It's on the right side.
  - speaker: Mas Danang
    text: Ana ing sisih tengen.
    ar_eg: على الجنب اليمين.
    ar: على الجانب الأيمن.
    en: It's on the right side.
  - speaker: Mas Danang
    text: Lan saka iku "dari". Saka Kairo nang Suroboyo, adoh banget!
    ar_eg: وsaka يعني «من». من القاهرة لسورابايا، بعيد أوي!
    ar: وsaka تعني «من». من القاهرة إلى سورابايا، بعيد جدًّا!
    en: And saka is "from". From Cairo to Surabaya, so far!
- kind: outro
  title: Saka omah nang masjid
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki critakna dalan saka omahmu nang masjid sing paling cedhak.
    ar_eg: يا ماس محمد، دلوقتي احكي الطريق من بيتك لأقرب جامع.
    ar: يا ماس محمد، صِف الطريق من بيتك إلى أقرب مسجد.
    en: Mas Mohamed, now describe the way from your house to the nearest mosque.
    note:
      ar_eg: دورك! استخدم lurus وngiwa وnengen، وكلمة من iki أو kuwi أو kae.
      ar: دورك! استعمل lurus وngiwa وnengen، وواحدة من iki أو kuwi أو kae.
      en: Your turn! Use lurus, ngiwa and nengen, and one of iki, kuwi or kae.
  - speaker: Mas Danang
    text: 'Contone: Saka omahku lurus wae, banjur nengen. Masjide ana ing sisih kiwa.'
    ar_eg: 'مثلًا: من بيتي على طول، وبعدين يمين. الجامع على الشمال.'
    ar: 'مثلًا: من بيتي مباشرة ثمّ يمينًا. والمسجد على اليسار.'
    en: 'For example: From my house straight on, then right. The mosque is on the left.'
  - speaker: Mbak Sekar
    text: PR-mu, gambaren peta cilik lan tulisen dalan telu nganggo basa Jawa.
    ar_eg: واجبك، ارسم خريطة صغيّرة واكتب تلات طرق بالجاوي.
    ar: 'واجبك: ارسم خريطة صغيرة واكتب ثلاثة طرق بالجاوية.'
    en: 'Your homework: draw a small map and write three routes in Javanese.'
  - speaker: Mas Danang
    text: Sesuk dina pungkasan ing Suroboyo. Kita nang Pasar Atom, tawar-tawaran! Nganti ketemu, rek!
    ar_eg: بكرة آخر يوم في سورابايا. رايحين باسار أتوم، فِصال! نتقابل يا جدعان!
    ar: غدًا آخر يوم في سورابايا. نذهب إلى باسار أتوم للمساومة! إلى اللقاء!
    en: Tomorrow is our last day in Surabaya. We're off to Pasar Atom to haggle! See you, mates!
