review:
  status: draft
  verified: false
  notes: 'Directions around Prawirotaman in south Jogja: Trans Jogja buses with raised halte shelters, becak (agree the fare before riding), Giwangan terminal and Gembira Loka zoo. Street "neng" vs careful "menyang"/"ing"; mrene/mrana. The lessons put the zoo next to Giwangan terminal; here it is only "not far from" it.'
