language: jv
level: j1
unit: j1.u06
title:
  target: Arep neng ndi?
  ar_eg: رايح فين؟
  ar: إلى أين أنت ذاهب؟
  en: Where are you off to?
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Prawirotaman
  lines:
  - speaker: Mbak Sekar
    text: Sugeng enjing saka Prawirotaman! Neng kene akeh kafe lan losmen cilik. Aku Sekar.
    ar_eg: صباح الخير من براويروتامان! هنا فيه كافيهات كتير وبنسيونات صغيّرة. أنا سيكار.
    ar: صباح الخير من براويروتامان! هنا مقاهٍ كثيرة ونُزُل صغيرة. أنا سيكار.
    en: Good morning from Prawirotaman! Lots of cafés and little guesthouses here. I'm Sekar.
    note:
      ar_eg: "براويروتامان حيّ في جنوب جوجا، مليان سيّاح وكافيهات ورسومات على الحيطان. كلمات: cilik = صغير؛ akeh = كتير."
      ar: "براويروتامان حيّ في جنوب جوغجا، مليء بالسيّاح والمقاهي والرسوم على الجدران. مفردات: cilik = صغير؛ akeh = كثير."
      en: "Prawirotaman is a south Jogja neighbourhood full of travellers, cafés and murals. Words: cilik = small, little = kecil; akeh = many, a lot (banyak)."
  - speaker: Mas Danang
    text: Aku Danang. Wingi aku numpak Trans Jogja mrene, lan aku kesasar, hehe.
    ar_eg: أنا دانانج. امبارح ركبت ترانس جوجا لحدّ هنا، وتهت، هههه.
    ar: أنا دانانغ. أمس ركبت ترانس جوغجا إلى هنا، وضللت الطريق، هههه.
    en: I'm Danang. Yesterday I took the Trans Jogja here, and I got lost, hehe.
    note:
      ar_eg: "كلمات: numpak = يركب (مواصلة)؛ kesasar = تاه."
      ar: "مفردات: numpak = يركب (وسيلة نقل)؛ kesasar = ضلّ الطريق."
      en: "Words: numpak = ride, take (transport) = naik; kesasar = get lost."
  - speaker: Mbak Sekar
    text: Mula dina iki kita sinau takon dalan. Neng ndi, saka ngendi, mrene, mrana.
    ar_eg: عشان كده النهارده هنتعلّم نسأل على الطريق. لفين، منين، لهنا، لهناك.
    ar: لذلك نتعلّم اليوم السؤال عن الطريق. إلى أين، من أين، إلى هنا، إلى هناك.
    en: So today we learn to ask the way. Where to, where from, over here, over there.
    note:
      ar_eg: "كلمات: ndi = فين؛ dina = يوم، نهار؛ mula = عشان كده."
      ar: "مفردات: ndi = أين؛ dina = يوم؛ mula = لذلك."
      en: "Words: ndi = where; dina = day; mula = that's why (makanya)."
  - speaker: Mas Danang
    text: Neng dalan, wong Jogja ngomong "neng". "Menyang" lan "ing" kanggo omongan sing rada resmi.
    ar_eg: في الشارع، أهل جوجا بيقولوا «neng». و«menyang» و«ing» للكلام الرسمي شويّة.
    ar: في الشارع يقول أهل جوغجا «neng». أمّا «menyang» و«ing» فللكلام الأقرب إلى الرسمي.
    en: On the street, Jogja people say "neng". "Menyang" and "ing" are for slightly more formal talk.
    note:
      ar_eg: "كلمات: kanggo = لـ، عشان (نغوكو)؛ rada = شوية."
      ar: "مفردات: kanggo = لِـ، من أجل (نغوكو)؛ rada = قليلًا."
      en: "Words: kanggo = for (ngoko) = untuk; rada = a bit (agak)."
- kind: dialogue
  title: Neng Gembira Loka
  lines:
  - speaker: Mas Danang
    text: Sekar, aku turis sing kesasar. Kowe wong kene, ya.
    ar_eg: يا سيكار، أنا سايح تايه، وانتي بنت المنطقة.
    ar: يا سيكار، أنا سائح تائه وأنتِ من أهل المنطقة.
    en: Sekar, I'm a lost tourist. You're a local.
  - speaker: Mas Danang
    text: Nuwun sewu, Mbak. Gembira Loka neng ndi, ya?
    ar_eg: لا مؤاخذة يا مباك. جمبيرا لوكا فين؟
    ar: عذرًا يا مباك. أين غمبيرا لوكا؟
    en: Excuse me, Mbak. Where's Gembira Loka?
    note:
      ar_eg: Gembira Loka هي جنينة الحيوانات بتاعة جوجا (kebun binatang). وNuwun sewu = لا مؤاخذة، مؤدّبة مع أي حدّ غريب.
      ar: Gembira Loka هي حديقة حيوان جوغجا (kebun binatang). وNuwun sewu = عذرًا، مهذّبة مع أيّ غريب.
      en: Gembira Loka is Jogja's zoo (kebun binatang). Nuwun sewu = excuse me, polite with any stranger.
  - speaker: Mbak Sekar
    text: Kebun binatang? Ora cedhak, Mas. Luwih kepenak numpak Trans Jogja.
    ar_eg: جنينة الحيوانات؟ مش قريبة يا ماس. الأريح تركب ترانس جوجا.
    ar: حديقة الحيوان؟ ليست قريبة يا ماس. الأسهل أن تركب ترانس جوغجا.
    en: The zoo? It's not close, Mas. Easier to take the Trans Jogja.
    note:
      ar_eg: "كلمات: kepenak = مريح (بالكراما sekeca)؛ luwih = أكتر (lebih)."
      ar: "مفردات: kepenak = مريح (بالكراما sekeca)؛ luwih = أكثر (lebih)."
      en: "Words: kepenak = comfortable, pleasant (krama sekeca) = enak, nyaman; luwih = more (lebih)."
  - speaker: Mas Danang
    text: Haltene neng ndi?
    ar_eg: المحطّة فين؟
    ar: أين المحطّة؟
    en: Where's the stop?
  - speaker: Mbak Sekar
    text: Saka kene lurus wae, banjur ngiwa neng prapatan. Haltene neng kono, sing dhuwur kae.
    ar_eg: من هنا على طول، وبعدين شمال عند التقاطع. المحطّة هناك، العالية اللي هناك دي.
    ar: من هنا مباشرة، ثمّ يسارًا عند التقاطع. المحطّة هناك، تلك المرتفعة.
    en: Straight on from here, then left at the crossroads. The stop's there, that raised one over there.
    note:
      ar_eg: "محطّات ترانس جوجا (halte) عالية عن الأرض: تطلع السلّم، تدفع، وتستنّى الأتوبيس جوّه. كلمات: banjur = وبعدين (في الحكي)؛ dhuwur = عالي، طويل."
      ar: "محطّات ترانس جوغجا (halte) مرتفعة عن الأرض: تصعد الدرج، تدفع، وتنتظر الحافلة في داخلها. مفردات: banjur = ثم (في السرد)؛ dhuwur = عالٍ، طويل."
      en: "Trans Jogja stops (halte) are raised: you climb the steps, pay, and wait inside. Words: banjur = then (lalu), in storytelling; dhuwur = high, tall."
  - speaker: Mas Danang
    text: Banjur mudhun neng ndi?
    ar_eg: وبعدين أنزل فين؟
    ar: ثمّ أين أنزل؟
    en: Then where do I get off?
  - speaker: Mbak Sekar
    text: Mudhun neng halte sing cedhak Gembira Loka. Ora adoh saka terminal Giwangan.
    ar_eg: انزل في المحطّة اللي جنب جمبيرا لوكا. مش بعيدة عن موقف جيوانجان.
    ar: انزل في المحطّة القريبة من غمبيرا لوكا. ليست بعيدة عن موقف غيوانغان.
    en: Get off at the stop near Gembira Loka. It's not far from Giwangan terminal.
    note:
      ar_eg: "كلمات: adoh = بعيد (jauh)."
      ar: "مفردات: adoh = بعيد (jauh)."
      en: "Words: adoh = far (jauh)."
  - speaker: Mas Danang
    text: Yen numpak becak wae, piye?
    ar_eg: ولو ركبت بيتشاك أحسن، إيه رأيك؟
    ar: وماذا لو ركبت بيتشاك؟
    en: What if I just take a becak?
  - speaker: Mbak Sekar
    text: Isa, nanging tawa regane dhisik, sadurunge munggah.
    ar_eg: ينفع، بس اتّفق على السعر الأوّل، قبل ما تركب.
    ar: ممكن، لكن اتّفق على السعر أوّلًا قبل أن تركب.
    en: Sure, but agree the price first, before you get on.
    note:
      ar_eg: "البيتشاك عجلة بتلات عجلات والراكب قاعد قدّام. في جوجا بتتّفق على الأجرة قبل الركوب، مش بعده. كلمات: nanging = بس، لكن؛ isa = يقدر."
      ar: "البيتشاك دراجة بثلاث عجلات يجلس الراكب في مقدّمتها. في جوغجا يُتّفق على الأجرة قبل الركوب لا بعده. مفردات: nanging = لكن، غير أنّ؛ isa = يستطيع."
      en: "A becak is a three-wheeled cycle with the passenger sitting in front. In Jogja you agree the fare before the ride, not after. Words: nanging = but, however; isa = can, be able to."
  - speaker: Mas Danang
    text: Matur nuwun, Mbak. Sampeyan wong Prawirotaman?
    ar_eg: متشكّر يا مباك. انتي من براويروتامان؟
    ar: شكرًا يا مباك. هل أنتِ من براويروتامان؟
    en: Thank you, Mbak. Are you from Prawirotaman?
  - speaker: Mbak Sekar
    text: Ora, omahku cedhak Kotabaru. Nanging aku seneng ngopi neng kene.
    ar_eg: لأ، بيتي جنب كوتابارو. بس بحبّ أشرب قهوة هنا.
    ar: لا، بيتي قرب كوتابارو. لكنّني أحبّ شرب القهوة هنا.
    en: No, my home's near Kotabaru. But I like having coffee here.
- kind: word_spotlight
  title: Mrene, mrana
  lines:
  - speaker: Mas Danang
    text: Kene, kono, kana. Kene cedhak aku, kono rada adoh, kana adoh banget.
    ar_eg: kene هنا جنبي، kono هناك شويّة، kana هناك بعيد أوي.
    ar: kene هنا قربي، kono هناك أبعد قليلًا، kana هناك بعيد جدًّا.
    en: Kene, kono, kana. Kene is near me, kono a bit further, kana really far.
  - speaker: Mbak Sekar
    text: Mrene tegese "neng kene". Mrana tegese "neng kana". Ayo, mrene!
    ar_eg: mrene يعني «لهنا». mrana يعني «لهناك». يلّا، تعالى هنا!
    ar: mrene تعني «إلى هنا». mrana تعني «إلى هناك». هيّا، تعالَ إلى هنا!
    en: Mrene means "to here". Mrana means "to there". Come on, over here!
    note:
      ar_eg: "بتسمعها كتير في الشارع: Mrene, Mas! = تعالى يا ماس! كلمات: tegese = معناه (artinya)."
      ar: "تسمعها كثيرًا في الشارع: Mrene, Mas! = تعالَ يا ماس! مفردات: tegese = معناه (artinya)."
      en: "You'll hear it a lot on the street: Mrene, Mas! = come here, Mas! Words: tegese = its meaning; that is = artinya."
  - speaker: Mas Danang
    text: Iki, kuwi, kae. Iki cedhak aku. Kuwi cedhak kowe. Kae adoh saka awake dhewe.
    ar_eg: iki جنبي أنا. kuwi جنبك انت. kae بعيد عن الاتنين.
    ar: iki قربي. kuwi قربك. kae بعيد عنّا كلينا.
    en: Iki, kuwi, kae. Iki is near me. Kuwi is near you. Kae is far from both of us.
    note:
      ar_eg: زي «ده» و«ده اللي عندك» و«ده اللي هناك». الإندونيسي فيه itu بس، الجاوي فيه مسافتين.
      ar: مثل «هذا» و«ذاك» و«ذلك»؛ في الإندونيسية itu فقط، وفي الجاوية مسافتان.
      en: Like "this", "that (by you)" and "that over there". Indonesian has only itu; Javanese has two distances.
  - speaker: Mbak Sekar
    text: 'Ngiwa, nengen, lurus wae. Lan "neng" kanggo kabeh: neng kene, neng kono, neng Jogja.'
    ar_eg: 'شمال، يمين، على طول. و«neng» لكل حاجة: هنا، هناك، في جوجا.'
    ar: 'يسارًا، يمينًا، مباشرة. و«neng» لكلّ شيء: هنا، هناك، في جوغجا.'
    en: 'Left, right, straight on. And "neng" for everything: here, there, in Jogja.'
    note:
      ar_eg: "neng = لـ / في. في الشات بتتكتب «ng»: «ng ndi?» = على فين؟ كلمات: kabeh = كله / الكل (= semua)."
      ar: "neng = إلى / في. وفي الدردشة تُكتب «ng»: «ng ndi?» = إلى أين؟ مفردات: kabeh = الكل / جميع (= semua)."
      en: "Neng = to / in. In chat it's written \"ng\": \"ng ndi?\" = where to? Words: kabeh = all, everything (= semua)."
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Nuwun sewu, Gembira Loka neng ndi?
    ar_eg: لا مؤاخذة، جمبيرا لوكا فين؟
    ar: عذرًا، أين غمبيرا لوكا؟
    en: Excuse me, where's Gembira Loka?
  - speaker: Mas Danang
    text: Nuwun sewu, Gembira Loka neng ndi?
    ar_eg: لا مؤاخذة، جمبيرا لوكا فين؟
    ar: عذرًا، أين غمبيرا لوكا؟
    en: Excuse me, where's Gembira Loka?
  - speaker: Mbak Sekar
    text: Lurus wae, banjur ngiwa.
    ar_eg: على طول، وبعدين شمال.
    ar: مباشرة، ثمّ يسارًا.
    en: Straight on, then left.
  - speaker: Mas Danang
    text: Lurus wae, banjur ngiwa.
    ar_eg: على طول، وبعدين شمال.
    ar: مباشرة، ثمّ يسارًا.
    en: Straight on, then left.
  - speaker: Mbak Sekar
    text: Haltene neng kono, sing kae.
    ar_eg: المحطّة هناك، اللي هناك دي.
    ar: المحطّة هناك، تلك البعيدة.
    en: The stop's there, that one over there.
  - speaker: Mas Danang
    text: Haltene neng kono, sing kae.
    ar_eg: المحطّة هناك، اللي هناك دي.
    ar: المحطّة هناك، تلك البعيدة.
    en: The stop's there, that one over there.
  - speaker: Mbak Sekar
    text: Tawa regane dhisik, ya.
    ar_eg: اتّفق على السعر الأوّل، ماشي.
    ar: اتّفق على السعر أوّلًا، حسنًا.
    en: Agree the price first, okay.
  - speaker: Mas Danang
    text: Tawa regane dhisik, ya.
    ar_eg: اتّفق على السعر الأوّل، ماشي.
    ar: اتّفق على السعر أوّلًا، حسنًا.
    en: Agree the price first, okay.
  - speaker: Mbak Sekar
    text: Mrene, Mas!
    ar_eg: تعالى هنا يا ماس!
    ar: تعالَ إلى هنا يا ماس!
    en: Come here, Mas!
  - speaker: Mas Danang
    text: Mrene, Mas!
    ar_eg: تعالى هنا يا ماس!
    ar: تعالَ إلى هنا يا ماس!
    en: Come here, Mas!
  - speaker: Mas Danang
    text: Lan saka iku "dari". Saka Kairo menyang Jogja, adoh banget!
    ar_eg: وsaka يعني «من». من القاهرة لجوجا، بعيد أوي!
    ar: وsaka تعني «من». من القاهرة إلى جوغجا، بعيد جدًّا!
    en: And saka is "from". From Cairo to Jogja, that's really far!
- kind: outro
  title: Saka omah neng masjid
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki critakna dalan saka omahmu neng masjid sing paling cedhak.
    ar_eg: يا ماس محمد، دلوقتي احكي الطريق من بيتك لأقرب جامع.
    ar: يا ماس محمد، صِف الآن الطريق من بيتك إلى أقرب مسجد.
    en: Mas Mohamed, now describe the way from your home to the nearest mosque.
    note:
      ar_eg: "دورك! استخدم lurus وngiwa وnengen، وكلمة من iki أو kuwi أو kae. كلمات: critakna = احكيها (أمر)."
      ar: "دورك! استعمل lurus وngiwa وnengen، وواحدة من iki أو kuwi أو kae. مفردات: critakna = احكِها (أمر)."
      en: "Your turn! Use lurus, ngiwa and nengen, and one of iki, kuwi or kae. Words: critakna = tell it (imperative) = ceritakan."
  - speaker: Mas Danang
    text: 'Contone: Saka omahku lurus wae, banjur nengen. Masjide neng sisih kiwa.'
    ar_eg: 'مثلًا: من بيتي على طول، وبعدين يمين. الجامع على الشمال.'
    ar: 'مثلًا: من بيتي مباشرة ثمّ يمينًا. والمسجد على اليسار.'
    en: 'For example: from my home straight on, then right. The mosque is on the left.'
    note:
      ar_eg: "كلمات: kiwa = شمال (tangan kiwa = الإيد الشمال)."
      ar: "مفردات: kiwa = يسار (tangan kiwa = اليد اليسرى)."
      en: "Words: kiwa = left side (tangan kiwa = left hand) = kiri."
  - speaker: Mbak Sekar
    text: PR-mu, gambaren peta cilik lan tulisen dalan telu nganggo basa Jawa.
    ar_eg: واجبك، ارسم خريطة صغيّرة واكتب تلات طرق بالجاوي.
    ar: 'واجبك: ارسم خريطة صغيرة واكتب ثلاثة طرق بالجاوية.'
    en: 'Your homework: draw a little map and write three routes in Javanese.'
    note:
      ar_eg: "كلمات: nganggo = بـ / بيستخدم."
      ar: "مفردات: nganggo = بـ / يستعمل."
      en: "Words: nganggo = with, using (pakai)."
  - speaker: Mas Danang
    text: Sesuk dina pungkasan neng Jogja. Kita menyang Pasar Klithikan, tawa-tawaran HP lawas! Nganti ketemu, cah!
    ar_eg: بكرة آخر يوم في جوجا. رايحين باسار كليتيكان نفاصل على موبايلات قديمة! نتقابل يا جماعة!
    ar: غدًا آخر يوم في جوغجا. سنذهب إلى سوق كليتيكان لنساوم على هواتف مستعملة! إلى اللقاء يا جماعة!
    en: Tomorrow's our last day in Jogja. We're off to Pasar Klithikan to haggle over second-hand phones! See you, guys!
    note:
      ar_eg: "كلمات: lawas = قديم (للحاجات)."
      ar: "مفردات: lawas = قديم (للأشياء)."
      en: "Words: lawas = old (of things) = lama."
