review:
  status: draft
  verified: false
  notes: 'A day at Parangtritis, south of Jogja: black sand, big waves (swimming is dangerous there - kept as a warning), andong carts, kites, jagung bakar and degan. Ora vs dudu. Jogja "je" and "og" are flagged unverified, as in the j1.u05 lessons.'
