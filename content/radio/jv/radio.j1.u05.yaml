schema: kabar.radio/v1
id: radio.j1.u05
language: jv
level: j1
unit: j1.u05
title:
  target: Neng pantai, cah!
  ar_eg: يلّا على البحر يا جماعة!
  ar: هيّا إلى الشاطئ يا جماعة!
  en: A day at the beach
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pantai Parangtritis
  lines:
  - speaker: Mas Danang
    text: Cah! Kabar Radio saiki neng pantai Parangtritis. Angine seger, ombake gedhe banget! Aku Danang.
    ar_eg: يا جماعة! كبار راديو دلوقتي على شطّ پارانجتريتيس. الهوا حلو، والموج عالي أوي! أنا دانانج.
    ar: يا جماعة! كبار راديو الآن على شاطئ بارانغتريتيس. الهواء منعش والأمواج عالية جدًّا! أنا دانانغ.
    en: Guys! Kabar Radio is at Parangtritis beach now. Fresh wind, and huge waves! I'm Danang.
    note:
      ar_eg: "پارانجتريتيس شطّ جنوب جوجا بحوالي ساعة، رملته سودا وموجه عالي، وفيه حناطير وطيّارات ورق. العوم هناك خطر، فالناس بتقعد على الرملة بس. كلمات: seger = منعش، فريش؛ saiki = دلوقتي (sekarang)."
      ar: "بارانغتريتيس شاطئ جنوب جوغجا بنحو ساعة، رماله سوداء وأمواجه عالية، وفيه عربات خيل وطائرات ورقية. السباحة هناك خطرة، فيكتفي الناس بالجلوس على الرمل. مفردات: seger = منعش، طازج؛ saiki = الآن (sekarang)."
      en: "Parangtritis is a beach about an hour south of Jogja, with black sand, big waves, horse carts and kites. Swimming there is dangerous, so people just hang out on the sand. Words: seger = fresh, refreshing; saiki = now (sekarang)."
  - speaker: Mbak Sekar
    text: Aku Sekar. Pasire ireng, lan akeh layangan neng langit. Dina iki kita sinau "ora" lan "dudu".
    ar_eg: أنا سيكار. الرملة سودا، وفيه طيّارات ورق كتير في السما. النهارده هنتعلّم «ora» و«dudu».
    ar: أنا سيكار. الرمال سوداء، وطائرات ورقية كثيرة في السماء. اليوم نتعلّم «ora» و«dudu».
    en: I'm Sekar. The sand is black, and there are lots of kites in the sky. Today we learn "ora" and "dudu".
    note:
      ar_eg: "كلمات: akeh = كتير؛ dina = يوم، نهار؛ ireng = أسود."
      ar: "مفردات: akeh = كثير؛ dina = يوم؛ ireng = أسود."
      en: "Words: akeh = many, a lot (banyak); dina = day; ireng = black."
  - speaker: Mas Danang
    text: Lan tembung wektu. Mau, saiki, mengko. Gampang banget!
    ar_eg: وكلمات الوقت. mau، saiki، mengko. زي «من شويّة، دلوقتي، بعدين».
    ar: وكلمات الزمن. mau وsaiki وmengko. مثل «قبل قليل، الآن، لاحقًا».
    en: And time words. Mau, saiki, mengko. Like "a while ago, now, later".
    note:
      ar_eg: mau = من شويّة (اللي فات)، saiki = دلوقتي، mengko = بعدين. وnganti = لحدّ.
      ar: mau = قبل قليل، saiki = الآن، mengko = لاحقًا. وnganti = حتى.
      en: Mau = a while ago, saiki = now, mengko = later. Nganti = until.
- kind: dialogue
  title: Nongkrong neng pinggir pantai
  lines:
  - speaker: Mbak Sekar
    text: Danang, ayo dolanan. Aku tamu saka Kairo, kowe kancaku sing wis kerep neng kene.
    ar_eg: يا دانانج، يلّا نمثّل. أنا ضيفة من القاهرة، وانت صاحبي اللي بيجي هنا على طول.
    ar: يا دانانغ، هيّا نمثّل. أنا ضيفة من القاهرة، وأنت صديقي الذي يأتي هنا كثيرًا.
    en: Danang, let's role-play. I'm a guest from Cairo, you're my friend who comes here a lot.
    note:
      ar_eg: "كلمات: kene = هنا (= sini)؛ dolanan = يلعب؛ kerep = كتير / غالبًا."
      ar: "مفردات: kene = هنا (= sini)؛ dolanan = يلعب؛ kerep = كثيرًا / غالبًا."
      en: "Words: kene = here (= sini); dolanan = to play (bermain); kerep = often = sering."
  - speaker: Mas Danang
    text: Sumuk banget, je! Ayo ngombe degan sik.
    ar_eg: حرّ أوي والله! يلّا نشرب جوز هند الأول.
    ar: الجوّ خانق جدًّا! هيّا نشرب ماء جوز الهند أوّلًا.
    en: So hot and sticky, man! Let's have a coconut first.
    note:
      ar_eg: "sumuk = حرّ ورطوبة، الجوّ اللي بيلزّق. وje في آخر الجملة بتأكّد الكلام، زي «والله» - كلمة جوجاوية، ولسّه «unverified». degan = جوز هند أخضر بتشرب ميّته. كلمات: ngombe = يشرب."
      ar: "sumuk = حرّ رطب خانق. وje في آخر الجملة تؤكّد الكلام مثل «والله» - وهي كلمة جوغجاوية ما زالت «unverified». degan = جوز هند أخضر يُشرب ماؤه. مفردات: ngombe = يشرب."
      en: "Sumuk = hot and sticky. Je at the end adds emphasis, like \"honestly\" - a Jogja word, still marked unverified. Degan = young green coconut you drink from. Words: ngombe = to drink."
  - speaker: Mbak Sekar
    text: Ayo! Mau aku weruh wong adol jagung bakar. Saiki ora ana.
    ar_eg: يلّا! من شويّة شفت واحد بيبيع درة مشوي. دلوقتي مش موجود.
    ar: هيّا! قبل قليل رأيت رجلًا يبيع ذرة مشوية. الآن لا يوجد.
    en: Let's go! A while ago I saw someone selling grilled corn. Now there's no one.
    note:
      ar_eg: "كلمات: jagung = درة؛ adol = يبيع."
      ar: "مفردات: jagung = ذرة؛ adol = يبيع."
      en: "Words: jagung = corn, maize; adol = sell."
  - speaker: Mas Danang
    text: Mengko teka maneh. Yen sore, akeh bakul neng kene.
    ar_eg: بعدين هييجي تاني. لمّا العصر ييجي، فيه بيّاعين كتير هنا.
    ar: سيأتي لاحقًا. حين يحلّ العصر يكثر الباعة هنا.
    en: He'll be back later. In the late afternoon, there are lots of sellers here.
    note:
      ar_eg: "كلمات: maneh = تاني / كمان مرة؛ teka = ييجي."
      ar: "مفردات: maneh = مرة أخرى؛ teka = يأتي."
      en: "Words: maneh = again = lagi; teka = come = datang."
  - speaker: Mbak Sekar
    text: Danang, aku pengin nglangi. Ombake apik!
    ar_eg: يا دانانج، نفسي أعوم. الموج حلو!
    ar: يا دانانغ، أريد أن أسبح. الأمواج جميلة!
    en: Danang, I want to swim. The waves look great!
    note:
      ar_eg: "كلمات: pengin = عايز، نفسه."
      ar: "مفردات: pengin = يريد، يرغب."
      en: "Words: pengin = to want, wish."
  - speaker: Mas Danang
    text: Aja! Ombak neng Parangtritis gedhe banget, mbebayani. Mung lungguh neng pasir wae, ya.
    ar_eg: لأ! الموج في پارانجتريتيس عالي أوي وخطر. اقعدي على الرملة بس.
    ar: لا! الأمواج في بارانغتريتيس عالية جدًّا وخطرة. اجلسي على الرمل فقط.
    en: Don't! The waves at Parangtritis are huge, dangerous. Just sit on the sand, okay.
    note:
      ar_eg: "كلمات: aja = متـ… (نهي)؛ lungguh = يقعد."
      ar: "مفردات: aja = لا (الناهية)؛ lungguh = يجلس."
      en: "Words: aja = don't; lungguh = sit."
  - speaker: Mbak Sekar
    text: Oke. Iki degan apa banyu kelapa biasa?
    ar_eg: ماشي. ده جوز هند أخضر ولّا ميّة جوز هند عادية؟
    ar: حسنًا. هل هذا جوز هند أخضر أم ماء جوز هند عادي؟
    en: Okay. Is this a young coconut or ordinary coconut water?
    note:
      ar_eg: "كلمات: biasa = عادي؛ oke = أوكي، ماشي."
      ar: "مفردات: biasa = عادي، معتاد؛ oke = حسنًا."
      en: "Words: biasa = usual, ordinary, normal; oke = OK."
  - speaker: Mas Danang
    text: Iki dudu banyu kelapa biasa. Iki degan asli, isih ijo!
    ar_eg: ده مش ميّة جوز هند عادية. ده جوز هند أخضر أصلي، لسّه أخضر!
    ar: هذا ليس ماء جوز هند عاديًّا. هذا جوز هند أخضر أصيل، ما زال أخضر!
    en: This isn't ordinary coconut water. It's a real young coconut, still green!
    note:
      ar_eg: "كلمات: ijo = أخضر."
      ar: "مفردات: ijo = أخضر."
      en: "Words: ijo = green = hijau."
  - speaker: Mbak Sekar
    text: Wah, enak og! Seger banget.
    ar_eg: يا سلام، حلو أوي! منعش جدًّا.
    ar: رائع، لذيذ حقًّا! منعش جدًّا.
    en: Wow, it's really good! So refreshing.
    note:
      ar_eg: og زي je، بتأكّد الكلام، وبيقولوها في جوجا. ولسّه «unverified» لحدّ ما محمد يراجعها.
      ar: og مثل je، تؤكّد الكلام، وتقال في جوغجا. وما زالت «unverified» حتى يراجعها محمد.
      en: Og, like je, adds emphasis and is heard in Jogja. Still unverified until Mohamed reviews it.
  - speaker: Mas Danang
    text: Mas Mohamed, krungu to? Neng kene, wong nongkrong nganti srengenge surup.
    ar_eg: يا ماس محمد، سمعت؟ هنا الناس بتقعد لحدّ ما الشمس تغيب.
    ar: يا ماس محمد، أسمعت؟ هنا يجلس الناس حتى تغيب الشمس.
    en: Mas Mohamed, hear that? Here, people hang out until the sun goes down.
    note:
      ar_eg: "كلمات: srengenge = شمس."
      ar: "مفردات: srengenge = شمس."
      en: "Words: srengenge = sun."
- kind: word_spotlight
  title: Ora, dudu
  lines:
  - speaker: Mbak Sekar
    text: Ora kanggo kriya lan sifat. Aku ora nglangi. Ombake ora cilik.
    ar_eg: ora للأفعال والصفات. أنا مش هعوم. الموج مش صغيّر.
    ar: ora للأفعال والصفات. لن أسبح. الأمواج ليست صغيرة.
    en: Ora is for verbs and adjectives. I'm not swimming. The waves aren't small.
    note:
      ar_eg: "كلمات: kanggo = لـ، عشان (نغوكو)؛ cilik = صغير؛ kriya = فعل (في النحو)."
      ar: "مفردات: kanggo = لِـ، من أجل (نغوكو)؛ cilik = صغير؛ kriya = فعل (نحويًّا)."
      en: "Words: kanggo = for (ngoko) = untuk; cilik = small, little = kecil; kriya = verb."
  - speaker: Mas Danang
    text: Dudu kanggo barang utawa wong. Iki dudu jagung, iki degan! Aku dudu wong Jogja, aku wong Madiun.
    ar_eg: dudu للحاجات والناس. ده مش درة، ده جوز هند! أنا مش من جوجا، أنا من ماديون.
    ar: dudu للأشياء والأشخاص. هذا ليس ذرة، هذا جوز هند! لست من جوغجا، أنا من ماديون.
    en: Dudu is for things or people. This isn't corn, it's a coconut! I'm not from Jogja, I'm from Madiun.
    note:
      ar_eg: 'زي tidak وbukan في الإندونيسي: ora = tidak، dudu = bukan. وra هي ora مختصرة.'
      ar: 'مثل tidak وbukan في الإندونيسية: ora = tidak، وdudu = bukan. وra هي ora مختصرة.'
      en: 'Like tidak and bukan in Indonesian: ora = tidak, dudu = bukan. Ra is short for ora.'
  - speaker: Mbak Sekar
    text: Lan "ora ana" iku "tidak ada". Saiki ora ana bakul jagung.
    ar_eg: و«ora ana» يعني «مفيش». دلوقتي مفيش بيّاع درة.
    ar: و«ora ana» تعني «لا يوجد». الآن لا يوجد بائع ذرة.
    en: And "ora ana" means "there isn't any". Right now there's no corn seller.
    note:
      ar_eg: "كلمات: iku = ده، دي، دول (البعيد)."
      ar: "مفردات: iku = ذلك، تلك."
      en: "Words: iku = that, those."
  - speaker: Mas Danang
    text: Lan "banget" iku "sangat". Sumuk banget, gedhe banget, enak banget!
    ar_eg: و«banget» يعني «أوي». حرّ أوي، كبير أوي، حلو أوي!
    ar: و«banget» تعني «جدًّا». حارّ جدًّا، كبير جدًّا، لذيذ جدًّا!
    en: And "banget" means "very". So hot, so big, so tasty!
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Sumuk banget, je!
    ar_eg: حرّ أوي والله!
    ar: الجوّ خانق جدًّا!
    en: So hot and sticky, man!
  - speaker: Mas Danang
    text: Sumuk banget, je!
    ar_eg: حرّ أوي والله!
    ar: الجوّ خانق جدًّا!
    en: So hot and sticky, man!
  - speaker: Mbak Sekar
    text: Iki dudu jagung.
    ar_eg: ده مش درة.
    ar: هذا ليس ذرة.
    en: This isn't corn.
  - speaker: Mas Danang
    text: Iki dudu jagung.
    ar_eg: ده مش درة.
    ar: هذا ليس ذرة.
    en: This isn't corn.
  - speaker: Mbak Sekar
    text: Saiki ora ana bakul.
    ar_eg: دلوقتي مفيش بيّاع.
    ar: الآن لا يوجد بائع.
    en: There's no seller right now.
  - speaker: Mas Danang
    text: Saiki ora ana bakul.
    ar_eg: دلوقتي مفيش بيّاع.
    ar: الآن لا يوجد بائع.
    en: There's no seller right now.
  - speaker: Mbak Sekar
    text: Mengko teka maneh.
    ar_eg: بعدين هييجي تاني.
    ar: سيأتي لاحقًا.
    en: He'll come back later.
  - speaker: Mas Danang
    text: Mengko teka maneh.
    ar_eg: بعدين هييجي تاني.
    ar: سيأتي لاحقًا.
    en: He'll come back later.
  - speaker: Mbak Sekar
    text: Aja nglangi, ombake gedhe!
    ar_eg: ماتعومش، الموج عالي!
    ar: لا تسبح، الأمواج عالية!
    en: Don't swim, the waves are big!
  - speaker: Mas Danang
    text: Aja nglangi, ombake gedhe!
    ar_eg: ماتعومش، الموج عالي!
    ar: لا تسبح، الأمواج عالية!
    en: Don't swim, the waves are big!
  - speaker: Mas Danang
    text: Lan eling, "je" lan "og" iku basa Jogja sing santai. Karo kanca oleh. Karo wong tuwa, ora usah.
    ar_eg: وافتكر، «je» و«og» كلام جوجاوي بسيط. مع الصحاب ماشي، ومع الكبار بلاش.
    ar: وتذكّر أنّ «je» و«og» من كلام جوغجا البسيط. لا بأس بهما مع الأصدقاء، ولا داعي لهما مع الكبار.
    en: And remember, "je" and "og" are casual Jogja talk. Fine with friends; with elders, skip them.
    note:
      ar_eg: "كلمات: oleh = ينفع / مسموح (= boleh)؛ santai = رايق، على مهله."
      ar: "مفردات: oleh = يجوز / مسموح (= boleh)؛ santai = هادئ البال، على مهل."
      en: "Words: oleh = may, allowed (= boleh); santai = relaxed, easy-going."
- kind: outro
  title: Ora apa dudu?
  lines:
  - speaker: Mas Danang
    text: 'Mas Mohamed, gilirane sampeyan. Gawe ukara loro: siji nganggo ora, siji nganggo dudu.'
    ar_eg: 'يا ماس محمد، دورك. اعمل جملتين: واحدة بـora، وواحدة بـdudu.'
    ar: 'يا ماس محمد، دورك. كوّن جملتين: واحدة بـora وواحدة بـdudu.'
    en: 'Mas Mohamed, your turn. Make two sentences: one with ora, one with dudu.'
    note:
      ar_eg: "دورك! وجرّب تزوّد banget أو je في الآخر، زي الشباب. كلمات: nganggo = بـ / بيستخدم؛ siji = واحد (satu)؛ gawe = يعمل / يحضّر (= buat)؛ loro = اتنين (dua)؛ قبل ewu: rong."
      ar: "دورك! وجرّب أن تضيف banget أو je في الآخر، كالشباب. مفردات: nganggo = بـ / يستعمل؛ siji = واحد (satu)؛ gawe = يصنع / يُعِدّ (= buat)؛ loro = اثنان (dua)؛ قبل ewu: rong."
      en: "Your turn! And try adding banget or je at the end, like the young ones. Words: nganggo = with, using (pakai); siji = one (satu); gawe = to make (= buat); loro = two (dua); before ewu: rong."
  - speaker: Mbak Sekar
    text: 'Contone: Aku dudu wong Jawa, nanging aku seneng pantai. Ombake gedhe banget!'
    ar_eg: 'مثلًا: أنا مش جاوي، بس بحبّ البحر. الموج عالي أوي!'
    ar: 'مثلًا: لست جاويًّا، لكنّي أحبّ الشاطئ. الأمواج عالية جدًّا!'
    en: 'For example: I''m not Javanese, but I love the beach. The waves are huge!'
    note:
      ar_eg: "كلمات: nanging = بس، لكن؛ seneng = يحب / مبسوط."
      ar: "مفردات: nanging = لكن، غير أنّ؛ seneng = يحب / سعيد."
      en: "Words: nanging = but, however; seneng = to like; happy (suka, senang)."
  - speaker: Mas Danang
    text: PR-mu, rungokna obrolan neng warung pantai ing pelajaran, banjur etung pira "ora" lan "dudu".
    ar_eg: واجبك، اسمع الكلام في قهوة الشطّ في الدرس، وعدّ كام «ora» و«dudu».
    ar: 'واجبك: استمع إلى الحديث في مقهى الشاطئ في الدرس، وعُدّ كم «ora» و«dudu».'
    en: 'Your homework: listen to the beach-stall chat in the lesson and count the "ora"s and "dudu"s.'
    note:
      ar_eg: "كلمات: banjur = وبعدين (في الحكي)؛ ing = في (= di)، رسمي ومكتوب."
      ar: "مفردات: banjur = ثم (في السرد)؛ ing = في (= di)، رسمي ومكتوب."
      en: "Words: banjur = then (lalu), in storytelling; ing = in, at (= di), formal / written."
  - speaker: Mbak Sekar
    text: Sesuk kita bali neng kutha, neng Prawirotaman, numpak Trans Jogja. Nganti ketemu, cah!
    ar_eg: بكرة راجعين المدينة، لپراويروتامان، بأتوبيس ترانس جوجا. نتقابل يا جماعة!
    ar: غدًا نعود إلى المدينة، إلى براويروتامان، بحافلة ترانس جوغجا. إلى اللقاء يا جماعة!
    en: Tomorrow we head back to town, to Prawirotaman, on the Trans Jogja bus. See you, guys!
    note:
      ar_eg: "كلمات: kutha = مدينة؛ numpak = يركب (مواصلة)؛ sesuk = بكرة."
      ar: "مفردات: kutha = مدينة؛ numpak = يركب (وسيلة نقل)؛ sesuk = غدًا."
      en: "Words: kutha = town, city (kota); numpak = ride, take (transport) = naik; sesuk = tomorrow (besok)."
