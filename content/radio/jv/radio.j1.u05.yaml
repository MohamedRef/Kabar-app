schema: kabar.radio/v1
id: radio.j1.u05
language: jv
level: j1
unit: j1.u05
title:
  target: Arek Suroboyo
  ar_eg: ولاد سورابايا
  ar: أبناء سورابايا
  en: Surabaya Arek speech
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Pantai Kenjeran
  lines:
  - speaker: Mas Danang
    text: Rek! Kabar Radio saiki ning pantai Kenjeran. Angine seger, iwake akeh! Aku Danang.
    ar_eg: يا جدعان! كبار راديو دلوقتي على شطّ كينجيران. الهوا حلو والسمك كتير! أنا دانانج.
    ar: يا رفاق! كبار راديو الآن على شاطئ كينجيران. النسيم منعش والسمك كثير! أنا دانانغ.
    en: Mates! Kabar Radio is at Kenjeran beach now. Fresh wind, lots of fish! I'm Danang.
  - speaker: Mbak Sekar
    text: Aku Sekar. Dina iki Danang dadi guru, aku dadi murid. Basa Suroboyo!
    ar_eg: أنا سيكار. النهارده دانانج هو المدرّس وأنا التلميذة. لهجة سورابايا!
    ar: أنا سيكار. اليوم دانانغ هو المعلّم وأنا التلميذة. لهجة سورابايا!
    en: I'm Sekar. Today Danang is the teacher and I'm the student. Surabaya speech!
  - speaker: Mas Danang
    text: Wong Jogja kaya Sekar ngomong "kowe" lan "ora". Arek Suroboyo ngomong "koen" lan "gak".
    ar_eg: أهل يوجيا زي سيكار بيقولوا «kowe» و«ora». ولاد سورابايا بيقولوا «koen» و«gak».
    ar: أهل سولو مثل سيكار يقولون «kowe» و«ora». وأبناء سورابايا يقولون «koen» و«gak».
    en: Jogja folks like Sekar say "kowe" and "ora". Surabaya kids say "koen" and "gak".
    note:
      ar_eg: الجاوي المركزي (Mataraman) أهدى، وجاوي سورابايا (Arek) مباشر وسريع. بين الصحاب ده دفء، مش قلّة أدب.
      ar: الجاوية الوسطى (Mataraman) أهدأ، وجاوية سورابايا (Arek) مباشرة وسريعة. وبين الأصدقاء هذا دفء لا وقاحة.
      en: Central (Mataraman) Javanese is softer; Surabaya (Arek) speech is direct and quick. Between friends it's warmth, not rudeness.
- kind: dialogue
  title: Ning warung iwak
  lines:
  - speaker: Mas Danang
    text: Sekar, ayo dolanan. Aku arek Kenjeran, kowe tamu saka Solo.
    ar_eg: يا سيكار، يلّا نمثّل. أنا ابن كينجيران، وانتي ضيفة من سولو.
    ar: يا سيكار، هيّا نمثّل. أنا ابن كينجيران وأنتِ ضيفة من سولو.
    en: Sekar, let's role-play. I'm a Kenjeran local, you're a guest from Solo.
  - speaker: Mas Danang
    text: Koen wis mangan ta, rek? Ayo mangan iwak bakar!
    ar_eg: انتي كلتي ولّا إيه؟ يلّا ناكل سمك مشوي!
    ar: هل أكلتِ؟ هيّا نأكل سمكًا مشويًّا!
    en: Have you eaten, mate? Let's eat grilled fish!
    note:
      ar_eg: «Koen wis mangan ta, rek?» = «كلت ولّا إيه يا جدع؟» - الجملة المشهورة بتاعة الوحدة دي.
      ar: «Koen wis mangan ta, rek?» = «هل أكلت يا صاحبي؟» - جملة هذه الوحدة الشهيرة.
      en: '"Koen wis mangan ta, rek?" = "Have you eaten, mate?" - this unit''s signature sentence.'
  - speaker: Mbak Sekar
    text: Durung. Nanging aku ora seneng iwak sing pedhes banget.
    ar_eg: لسّه. بس أنا مش بحبّ السمك الحرّاق أوي.
    ar: ليس بعد. لكنّي لا أحبّ السمك الحارّ جدًّا.
    en: Not yet. But I don't like really spicy fish.
  - speaker: Mas Danang
    text: Gak popo. Sambele gak pedhes, kok. Iki dudu sambel Suroboyo asli, hehe.
    ar_eg: مفيش مشكلة. الصلصة مش حرّاقة. دي مش صلصة سورابايا الأصلية، هههه.
    ar: لا بأس. الصلصة ليست حارّة. هذه ليست صلصة سورابايا الأصلية، هههه.
    en: No problem. The sambal isn't hot. It's not real Surabaya sambal, hehe.
  - speaker: Mbak Sekar
    text: Awakmu iki lho, mesthi guyon!
    ar_eg: انت دايمًا بتهزّر كده!
    ar: أنت دائمًا تمزح!
    en: You, always joking!
  - speaker: Mas Danang
    text: '"Awakmu"! Pinter, Sekar. Awakmu iku "kowe" utawa "awakmu dhewe".'
    ar_eg: «awakmu»! شاطرة يا سيكار. awakmu يعني «انت» أو «نفسك».
    ar: «awakmu»! أحسنتِ يا سيكار. awakmu تعني «أنت» أو «نفسك».
    en: '"Awakmu"! Clever, Sekar. Awakmu means "you" or "yourself".'
  - speaker: Mbak Sekar
    text: Iwake enak tenan. Pira, Cak?
    ar_eg: السمك حلو بجدّ. بكام يا تشاك؟
    ar: السمك لذيذ حقًّا. بكم يا تشاك؟
    en: The fish is really good. How much, Cak?
  - speaker: Mas Danang
    text: Gak usah bayar, rek. Aku sing traktir. Koen tamuku!
    ar_eg: مش لازم تدفعي. أنا عازمك. انتي ضيفتي!
    ar: لا داعي للدفع. الحساب عليّ. أنتِ ضيفتي!
    en: No need to pay. My treat. You're my guest!
  - speaker: Mbak Sekar
    text: Mas Mohamed, delok ta? Basane kasar, nanging atine apik banget.
    ar_eg: يا ماس محمد، شايف؟ الكلام خشن، بس القلب طيّب أوي.
    ar: يا ماس محمد، أرأيت؟ الكلام خشن لكنّ القلب طيّب جدًّا.
    en: Mas Mohamed, see? The words are rough, but the heart is very kind.
- kind: word_spotlight
  title: Ora, gak, dudu
  lines:
  - speaker: Mbak Sekar
    text: Ora lan gak padha, kanggo kriya lan sifat. Aku ora lunga. Aku gak lunga.
    ar_eg: ora وgak زي بعض، للأفعال والصفات. أنا مش رايح.
    ar: ora وgak متساويتان للأفعال والصفات. لن أذهب.
    en: Ora and gak are the same, for verbs and adjectives. I'm not going.
  - speaker: Mas Danang
    text: Dudu kanggo barang utawa wong. Iki dudu iwak, iki pitik!
    ar_eg: dudu للحاجات والناس. ده مش سمك، ده فرخة!
    ar: dudu للأشياء والأشخاص. هذا ليس سمكًا، هذا دجاج!
    en: Dudu is for things or people. This isn't fish, it's chicken!
    note:
      ar_eg: 'زي tidak وbukan في الإندونيسي: ora/gak = tidak، dudu = bukan.'
      ar: 'مثل tidak وbukan في الإندونيسية: ora/gak = tidak، وdudu = bukan.'
      en: 'Like Indonesian tidak and bukan: ora/gak = tidak, dudu = bukan.'
  - speaker: Mbak Sekar
    text: Lan ning iku cara Suroboyo kanggo "neng" utawa "ing". Ning pantai, ning omah.
    ar_eg: وning دي طريقة سورابايا لـ«neng» أو «ing». على الشطّ، في البيت.
    ar: وning طريقة سورابايا لـ«neng» أو «ing». على الشاطئ، في البيت.
    en: And ning is Surabaya's way of saying neng or ing. At the beach, at home.
  - speaker: Mas Danang
    text: Eling, Mas Mohamed. Karo kanca, Suroboyoan oleh. Karo wong anyar, ngoko biasa luwih aman.
    ar_eg: افتكر يا ماس محمد. مع الصحاب، السورابايي ماشي. مع الناس الجديدة، النجوكو العادي أأمن.
    ar: تذكّر يا ماس محمد. مع الأصدقاء السورابايية مقبولة. ومع الغرباء النغوكو العاديّة أسلم.
    en: Remember, Mas Mohamed. With friends, Suroboyoan is fine. With strangers, standard ngoko is safer.
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Koen wis mangan ta, rek?
    ar_eg: كلت ولّا إيه يا جدع؟
    ar: هل أكلت يا صاحبي؟
    en: Have you eaten, mate?
  - speaker: Mas Danang
    text: Koen wis mangan ta, rek?
    ar_eg: كلت ولّا إيه يا جدع؟
    ar: هل أكلت يا صاحبي؟
    en: Have you eaten, mate?
  - speaker: Mbak Sekar
    text: Durung, aku gak luwe.
    ar_eg: لسّه، أنا مش جعان.
    ar: ليس بعد، لست جائعًا.
    en: Not yet, I'm not hungry.
  - speaker: Mas Danang
    text: Durung, aku gak luwe.
    ar_eg: لسّه، أنا مش جعان.
    ar: ليس بعد، لست جائعًا.
    en: Not yet, I'm not hungry.
  - speaker: Mbak Sekar
    text: Iki dudu iwak.
    ar_eg: ده مش سمك.
    ar: هذا ليس سمكًا.
    en: This isn't fish.
  - speaker: Mas Danang
    text: Iki dudu iwak.
    ar_eg: ده مش سمك.
    ar: هذا ليس سمكًا.
    en: This isn't fish.
  - speaker: Mbak Sekar
    text: Gak popo, rek.
    ar_eg: مفيش مشكلة يا جدع.
    ar: لا بأس يا صاحبي.
    en: No worries, mate.
  - speaker: Mas Danang
    text: Gak popo, rek.
    ar_eg: مفيش مشكلة يا جدع.
    ar: لا بأس يا صاحبي.
    en: No worries, mate.
  - speaker: Mbak Sekar
    text: Awakmu iki lho!
    ar_eg: انت يا عمّ!
    ar: أنت يا هذا!
    en: Oh, you!
  - speaker: Mas Danang
    text: Awakmu iki lho!
    ar_eg: انت يا عمّ!
    ar: أنت يا هذا!
    en: Oh, you!
  - speaker: Mas Danang
    text: Lan aja kaget yen arek Suroboyo ngomong banter. Iku biasa, dudu nesu.
    ar_eg: وماتتخضّش لو ابن سورابايا اتكلّم بصوت عالي. ده عادي، مش زعلان.
    ar: ولا تفزع إن تكلّم ابن سورابايا بصوت عالٍ. هذا عاديّ، لا غضب.
    en: And don't be startled if a Surabaya kid talks loudly. That's normal, not anger.
- kind: outro
  title: Ora, gak, apa dudu?
  lines:
  - speaker: Mas Danang
    text: Mas Mohamed, gilirane sampeyan. Wangsulana "Koen wis mangan ta, rek?" nganggo gaya Suroboyo.
    ar_eg: يا ماس محمد، دورك. ردّ على «Koen wis mangan ta, rek?» بأسلوب سورابايا.
    ar: يا ماس محمد، دورك. أجب عن «Koen wis mangan ta, rek?» بأسلوب سورابايا.
    en: Mas Mohamed, your turn. Answer "Koen wis mangan ta, rek?" Surabaya-style.
    note:
      ar_eg: دورك! استخدم gak أو durung، وماتنساش «rek» في الآخر.
      ar: دورك! استعمل gak أو durung، ولا تنسَ «rek» في الآخر.
      en: Your turn! Use gak or durung, and don't forget "rek" at the end.
  - speaker: Mbak Sekar
    text: 'Contone: Durung, rek. Aku gak luwe. Mengko ae.'
    ar_eg: 'مثلًا: لسّه يا جدع. أنا مش جعان. بعدين.'
    ar: 'مثلًا: ليس بعد يا صاحبي. لست جائعًا. لاحقًا.'
    en: 'For example: Not yet, mate. I''m not hungry. Later.'
  - speaker: Mas Danang
    text: 'PR-mu, gawe ukara telu: siji nganggo ora, siji nganggo gak, siji nganggo dudu.'
    ar_eg: 'واجبك، اعمل تلات جمل: واحدة بـora، وواحدة بـgak، وواحدة بـdudu.'
    ar: 'واجبك: كوّن ثلاث جمل: واحدة بـora وواحدة بـgak وواحدة بـdudu.'
    en: 'Your homework: make three sentences: one with ora, one with gak, one with dudu.'
  - speaker: Mbak Sekar
    text: Sesuk kita nang Wonokromo, takon dalan. Nganti ketemu!
    ar_eg: بكرة رايحين وونوكرومو، نسأل على الطريق. نتقابل!
    ar: غدًا نذهب إلى وونوكرومو لنسأل عن الطريق. إلى اللقاء!
    en: Tomorrow we're off to Wonokromo to ask the way. See you!
