    ar_eg: حلو بجدّ!
    ar: لذيذ حقًّا!
    en: Really tasty!
  - speaker: Mbak Sekar
    text: Aku arep ngombe teh anget.
    ar_eg: أنا عايز أشرب شاي سخن.
    ar: أريد أن أشرب شايًا ساخنًا.
    en: I want to drink hot tea.
  - speaker: Mas Danang
    text: Aku arep ngombe teh anget.
    ar_eg: أنا عايز أشرب شاي سخن.
    ar: أريد أن أشرب شايًا ساخنًا.
    en: I want to drink hot tea.
  - speaker: Mbak Sekar
    text: Sambele gurih lan rada legi.
    ar_eg: الصلصة طعمها غني وحلوة شويّة.
    ar: الصلصة غنيّة وحلوة قليلًا.
    en: The sauce is savoury and a bit sweet.
  - speaker: Mas Danang
    text: Sambele gurih lan rada legi.
    ar_eg: الصلصة طعمها غني وحلوة شويّة.
    ar: الصلصة غنيّة وحلوة قليلًا.
    en: The sauce is savoury and a bit sweet.
  - speaker: Mas Danang
    text: Lan yen wis wareg, ngomong "wis wareg, suwun". Wareg iku kenyang ing basa Indonesia.
    ar_eg: ولو شبعت، قول «wis wareg, suwun». wareg يعني شبعان.
    ar: وإن شبعت فقل «wis wareg, suwun». wareg تعني شبعان.
    en: And when you're full, say "wis wareg, suwun". Wareg means full.
- kind: outro
  title: Pesenane Mas Mohamed
  lines:
  - speaker: Mbak Sekar
    text: Mas Mohamed, saiki pesena panganan favoritmu ing warung. Panganan, ombenan, lan rasane.
    ar_eg: يا ماس محمد، دلوقتي اطلب أكلتك المفضّلة في المطعم. الأكل، والمشروب، والطعم.
    ar: يا ماس محمد، اطلب الآن طعامك المفضّل في المطعم. الطعام والمشروب والمذاق.
    en: Mas Mohamed, now order your favourite food at the warung. Food, drink and taste.
    note:
      ar_eg: 'دورك! جرّب مثلًا الكشري: «Koshari siji, sing pedhes!»'
      ar: 'دورك! جرّب مثلًا الكشري: «Koshari siji, sing pedhes!»'
      en: 'Your turn! Try koshari, for example: "Koshari siji, sing pedhes!"'
  - speaker: Mas Danang
    text: 'Contone: Koshari siji, sing pedhes. Ngombe teh anget, ra legi.'
    ar_eg: 'مثلًا: كشري واحد، حرّاق. وشاي سخن، من غير سكّر كتير.'
    ar: 'مثلًا: كشري واحد، حارّ. وشاي ساخن، غير محلّى.'
    en: 'For example: One koshari, spicy. And hot tea, not sweet.'
  - speaker: Mbak Sekar
    text: PR-mu, tulisen kriya lima nganggo N-. Contone, nulis, maca, ngombe.
    ar_eg: واجبك، اكتب خمس أفعال بالـN-. زي nulis وmaca وngombe.
    ar: 'واجبك: اكتب خمسة أفعال بالـN-، مثل nulis وmaca وngombe.'
    en: 'Your homework: write five verbs with N-. Like nulis, maca, ngombe.'
  - speaker: Mas Danang
    text: Sesuk kita menyang pasar Nganjuk, kutha brambang! Nganti ketemu!
    ar_eg: بكرة رايحين سوق نجانجوك، بلد البصل! نتقابل!
    ar: غدًا نذهب إلى سوق نغانجوك، مدينة البصل! إلى اللقاء!
    en: Tomorrow we're off to the Nganjuk market, onion town! See you!
    note:
      ar_eg: "كلمات: kutha = مدينة؛ sesuk = بكرة."
      ar: "مفردات: kutha = مدينة؛ sesuk = غدًا."
      en: "Words: kutha = town, city (kota); sesuk = tomorrow (besok)."
