    ar: شاي ساخن، غير محلّى كثيرًا.
    en: Hot tea, not too sweet.
  - speaker: Mbak Sekar
    text: Enak tenan!
    ar_eg: حلو بجدّ!
    ar: لذيذ حقًّا!
    en: Really tasty!
