schema: kabar.radio/v1
id: radio.j2.u02
language: jv
level: j2
unit: j2.u02
title:
  target: Mangan apa?
  ar_eg: ناكل إيه؟
  ar: ماذا نأكل؟
  en: What shall we eat?
hosts:
- name: Mbak Sekar
  voice: jv-ID-SitiNeural
- name: Mas Danang
  voice: jv-ID-DimasNeural
minutes: 5
segments:
- kind: intro
  title: Caruban
  lines:
  - speaker: Mas Danang
    text: Sugeng enjing saka Caruban! Wetengku wis kluruk, hehe. Aku Danang.
    ar_eg: صباح الخير من كاروبان! بطني بتصوّت، هههه. أنا دانانج.
    ar: صباح الخير من كاروبان! بطني تقرقر، هههه. أنا دانانغ.
    en: Good morning from Caruban! My stomach's crowing, hehe. I'm Danang.
    note:
      ar_eg: «wetengku kluruk» حرفيًّا «بطني بتصيح زي الديك» - يعني جعان أوي.
      ar: «wetengku kluruk» حرفيًّا «بطني تصيح كالديك» - أي جائع جدًّا.
      en: '"Wetengku kluruk" literally "my belly crows like a rooster" - I''m starving.'
  - speaker: Mbak Sekar
    text: Aku Sekar. Kita ana ing warung pecel. Madiun lan sakiwa tengene iku omahe sega pecel.
    ar_eg: أنا سيكار. إحنا في مطعم بيتشيل. ماديون واللي حواليها هي بلد الرز بالبيتشيل.
    ar: أنا سيكار. نحن في مطعم بيتشيل. ماديون وما حولها موطن أرز البيتشيل.
    en: I'm Sekar. We're at a pecel warung. Madiun and around it are the home of nasi pecel.
    note:
      ar_eg: "كلمات: pecel = بيتشل (خضار مسلوقة بصوص فول سوداني)."
      ar: "مفردات: pecel = بيتشل، خضار بصلصة الفول السوداني."
      en: "Words: pecel = pecel (boiled vegetables with peanut sauce)."
  - speaker: Mas Danang
    text: Pecel iku sayuran karo sambel kacang. Asring diwenehi ing godhong jati.
    ar_eg: البيتشيل خضار بصلصة الفول السوداني. وغالبًا بيتقدّم على ورقة شجر الساج.
    ar: البيتشيل خضار بصلصة الفول السوداني، وغالبًا يُقدَّم على ورقة شجر الساج.
    en: Pecel is vegetables with peanut sauce. Often served on a teak leaf.
    note:
      ar_eg: "كلمات: asring = كتير، على طول (kerep ← asring)، كراما؛ diwenehi = اتدّى، اخد؛ sayuran = خضار."
      ar: "مفردات: asring = كثيرًا (kerep ← asring)، كراما؛ diwenehi = يُعطى؛ sayuran = خُضَر."
      en: "Words: asring = often (ngoko kerep, Indonesian sering), krama; diwenehi = to be given; sayuran = vegetables."
  - speaker: Mbak Sekar
    text: Dina iki kita sinau pesen panganan, rasa, lan kriya kaya mangan, ngombe, nulis, maca.
    ar_eg: النهارده هنتعلّم نطلب أكل، والطعم، وأفعال زي ياكل، يشرب، يكتب، يقرا.
    ar: اليوم نتعلّم طلب الطعام والمذاقات، وأفعالًا مثل يأكل ويشرب ويكتب ويقرأ.
    en: Today we learn to order food, tastes, and verbs like eat, drink, write, read.
    note:
      ar_eg: "كلمات: kriya = فعل (في النحو)؛ panganan = أكل؛ kaya = زي، كأنّ؛ dina = يوم، نهار."
      ar: "مفردات: kriya = فعل (نحويًّا)؛ panganan = طعام؛ kaya = مثل؛ dina = يوم."
      en: "Words: kriya = verb; panganan = food (makanan); kaya = like, as = seperti; dina = day."
- kind: dialogue
  title: Pesen pecel
  lines:
  - speaker: Mbak Sekar
    text: Danang, kowe dadi bakul pecel. Aku sing tuku.
    ar_eg: يا دانانج، انت بيّاع البيتشيل، وأنا الزبونة.
    ar: يا دانانغ، أنت بائع البيتشيل وأنا الزبونة.
    en: Danang, you're the pecel seller. I'm the customer.
    note:
      ar_eg: "كلمات: dadi = يبقى / يطلع."
      ar: "مفردات: dadi = يصير / يساوي."
      en: "Words: dadi = to become, come to (jadi)."
  - speaker: Mas Danang
    text: Monggo, Mbak. Arep mangan apa?
    ar_eg: اتفضّلي يا مباك. تاكلي إيه؟
    ar: تفضّلي يا مباك. ماذا تأكلين؟
    en: Come in, Mbak. What would you like to eat?
  - speaker: Mbak Sekar
    text: Sega pecel siji, Mas. Nganggo peyek, ya.
    ar_eg: طبق رز بيتشيل واحد يا ماس. بالبييك.
    ar: طبق أرز بيتشيل واحد يا ماس، مع البييك.
    en: One nasi pecel, Mas. With peyek, please.
    note:
      ar_eg: peyek = مقرمشات رقيقة بالفول السوداني أو الجمبري، بتتاكل مع البيتشيل.
      ar: peyek = رقائق مقرمشة بالفول السوداني أو الروبيان تؤكل مع البيتشيل.
      en: Peyek = thin crackers with peanuts or shrimp, eaten with pecel.
  - speaker: Mas Danang
    text: Sambele pedhes pa ra?
    ar_eg: الصلصة حرّاقة ولّا لأ؟
    ar: الصلصة حارّة أم لا؟
    en: Spicy sauce or not?
  - speaker: Mbak Sekar
    text: Sing sedheng wae. Aku ra kuwat pedhes banget.
    ar_eg: وسط بس. أنا مقدرش على الحرّاق أوي.
    ar: متوسّطة فقط. لا أحتمل الحارّ جدًّا.
    en: Just medium. I can't handle really spicy.
    note:
      ar_eg: "كلمات: kuwat = قوي."
      ar: "مفردات: kuwat = قويّ."
      en: "Words: kuwat = strong."
  - speaker: Mas Danang
    text: Siap. Ngombe apa, Mbak? Teh anget, es teh, utawa jeruk?
    ar_eg: تمام. تشربي إيه يا مباك؟ شاي سخن، شاي ساقع، ولّا برتقان؟
    ar: حسنًا. ماذا تشربين يا مباك؟ شاي ساخن أم شاي مثلّج أم برتقال؟
    en: Got it. What to drink, Mbak? Hot tea, iced tea, or orange?
    note:
      ar_eg: "كلمات: jeruk = برتقان، يوسفي، لمون؛ siap = تمام! حاضر!"
      ar: "مفردات: jeruk = برتقال، حمضيات؛ siap = حاضر!"
      en: "Words: jeruk = orange, citrus; siap = got it!, will do!"
  - speaker: Mbak Sekar
    text: Teh anget, ra legi banget.
    ar_eg: شاي سخن، مش مسكّر أوي.
    ar: شاي ساخن، غير محلّى كثيرًا.
    en: Hot tea, not too sweet.
    note:
      ar_eg: في جاوة الشاي غالبًا بييجي مسكّر أوي. لو عايزه خفيف قول «ora legi banget» أو «tawar» من غير سكّر.
      ar: في جاوة يأتي الشاي غالبًا شديد الحلاوة. إن أردته خفيفًا فقل «ora legi banget»، أو «tawar» بلا سكّر.
      en: In Java tea usually comes very sweet. Say "ora legi banget" for less, or "tawar" for none.
  - speaker: Mas Danang
    text: Iki, Mbak. Pecele, peyeke, lan teh anget. Piye rasane?
    ar_eg: اتفضّلي يا مباك. البيتشيل والبييك والشاي السخن. طعمه إيه؟
    ar: تفضّلي يا مباك. البيتشيل والبييك والشاي الساخن. ما رأيك في الطعم؟
    en: Here you go, Mbak. Pecel, peyek and hot tea. How does it taste?
    note:
      ar_eg: "كلمات: pecele = البيتشل (pecel + -e)."
      ar: "مفردات: pecele = البيتشل (pecel + -e)."
      en: "Words: pecele = the pecel (pecel + -e)."
  - speaker: Mbak Sekar
    text: Enak tenan! Sambele gurih, rada legi, rada pedhes.
    ar_eg: حلو بجدّ! الصلصة طعمها غني، حلوة شويّة وحرّاقة شويّة.
    ar: لذيذ حقًّا! الصلصة غنيّة، حلوة قليلًا وحارّة قليلًا.
    en: Really tasty! The sauce is savoury, a bit sweet, a bit spicy.
  - speaker: Mas Danang
    text: Mas Mohamed, ing Madiun, pecel iku sarapan. Esuk-esuk wis mangan pecel!
    ar_eg: يا ماس محمد، في ماديون البيتشيل فطار. من الصبح بدري بياكلوا بيتشيل!
    ar: يا ماس محمد، في ماديون البيتشيل فطور. يأكلونه منذ الصباح الباكر!
    en: Mas Mohamed, in Madiun pecel is breakfast. Pecel first thing in the morning!
- kind: word_spotlight
  title: Nulis, maca, ngombe
  lines:
  - speaker: Mbak Sekar
    text: Akeh kriya Jawa diwiwiti swara irung. Tulis dadi nulis. Waca dadi maca.
    ar_eg: أفعال جاوي كتير بتبدأ بصوت من المناخير. tulis تبقى nulis. waca تبقى maca.
    ar: تبدأ أفعال جاوية كثيرة بصوت أنفيّ. tulis تصير nulis، وwaca تصير maca.
    en: Many Javanese verbs start with a nasal sound. Tulis becomes nulis. Waca becomes maca.
    note:
      ar_eg: "كلمات: akeh = كتير؛ irung = مناخير؛ swara = صوت (sandhangan swara = علامات الحركات)."
      ar: "مفردات: akeh = كثير؛ irung = أنف؛ swara = صوت (sandhangan swara = علامات الحركات)."
      en: "Words: akeh = many, a lot (banyak); irung = nose (ngoko; krama inggil grana); swara = sound, voice (sandhangan swara = vowel marks)."
  - speaker: Mas Danang
    text: Gawe dadi nggawe. Ombe dadi ngombe. Pangan dadi mangan.
    ar_eg: gawe تبقى nggawe. ombe تبقى ngombe. pangan تبقى mangan.
    ar: gawe تصير nggawe، وombe تصير ngombe، وpangan تصير mangan.
    en: Gawe becomes nggawe. Ombe becomes ngombe. Pangan becomes mangan.
    note:
      ar_eg: "ده الـN- (زي meN- في الإندونيسي): بيقلب أول حرف لصوت أنفي - t يبقى n، w يبقى m، p يبقى m، والحروف المتحرّكة وg ياخدوا ng. كلمات: gawe = يعمل / يحضّر (= buat)؛ pangan = أكل، غذا."
      ar: "هذه السابقة N- (مثل meN- الإندونيسية): تقلب الحرف الأوّل صوتًا أنفيًّا - t إلى n، وw وp إلى m، والصوائت وg تأخذ ng. مفردات: gawe = يصنع / يُعِدّ (= buat)؛ pangan = طعام، غذاء."
      en: "This is the N- prefix (like Indonesian meN-): it turns the first sound nasal - t to n, w and p to m, vowels and g take ng. Words: gawe = to make (= buat); pangan = food, foodstuffs."
  - speaker: Mbak Sekar
    text: 'Rasa: enak, pedhes, legi, asin, kecut. Lan anget kanggo ombenan.'
    ar_eg: 'الطعم: حلو، حرّاق، مسكّر، مالح، حامض. وanget للمشروب السخن.'
    ar: 'المذاق: لذيذ، حارّ، حلو، مالح، حامض. وanget للمشروب الدافئ.'
    en: 'Tastes: tasty, spicy, sweet, salty, sour. And anget for warm drinks.'
    note:
      ar_eg: "كلمات: kanggo = لـ، عشان (نغوكو)."
      ar: "مفردات: kanggo = لِـ، من أجل (نغوكو)."
      en: "Words: kanggo = for (ngoko) = untuk."
  - speaker: Mas Danang
    text: Lan "pecel" ora ana ing basa Arab, nanging "sambel kacang" kaya dukkah sing teles, hehe.
    ar_eg: و«البيتشيل» مالوش اسم بالعربي، بس صلصة الفول السوداني دي زي دقّة مبلولة، هههه.
    ar: ولا اسم للبيتشيل بالعربية، لكنّ صلصة الفول السوداني تشبه دقّة رطبة، هههه.
    en: And there's no Arabic word for pecel, but peanut sauce is like a wet dukkah, hehe.
    note:
      ar_eg: "كلمات: nanging = بس، لكن."
      ar: "مفردات: nanging = لكن، غير أنّ."
      en: "Words: nanging = but, however."
- kind: recap
  title: Baleni, ya!
  lines:
  - speaker: Mbak Sekar
    text: Sega pecel siji.
    ar_eg: رز بيتشيل واحد.
    ar: أرز بيتشيل واحد.
    en: One nasi pecel.
  - speaker: Mas Danang
    text: Sega pecel siji.
    ar_eg: رز بيتشيل واحد.
    ar: أرز بيتشيل واحد.
    en: One nasi pecel.
  - speaker: Mbak Sekar
    text: Sing ra pedhes banget.
    ar_eg: مش حرّاق أوي.
    ar: ليس حارًّا جدًّا.
    en: Not too spicy.
