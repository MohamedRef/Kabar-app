# Tight semantic sets (#224, docs/PEDAGOGY.md §4.4: group words by situation,
# not by tight semantic sets). The content validator fails a learn lesson that
# teaches more than `max_per_lesson` new words from one set. Aim for three or
# fewer; spread the rest of a set over other situations.
#
# Closed sequences (numbers, days, months) are not listed: they are learnt as
# a series. Add words here when a new lesson introduces more members of a set.
max_per_lesson: 4
# Lessons that may go over, with the reason.
allow:
  bipa2.u07.l04: Exercise-class commands; the body parts are the objects of the commands (angkat tangan, angkat kaki kanan).
  j2.u01.l01: Grammar point jv.kinship.terms. The speech-level and age split (mbakyu, mas, adhi) is taught by contrast, so the terms must sit together.
  j2.u01.l02: Grammar point jv.kinship.terms. The age-based split (pakdhe or paklik = older or younger than your parent) is taught by contrast.
