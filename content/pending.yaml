schema: kabar.pending/v1
# Units still waiting for their Radio episode, Sinetron episode or chat
# partner. `kabar-content` fails if a unit is missing one and is not listed
# here, and also if a listed unit already has it, so this list only shrinks.
# When it is empty, every unit has everything.

# Units without content/radio/<lang>/radio.<unit>.yaml.
radio: []

# Units no Sinetron episode unlocks after (`unlock_after`).
sinetron: []

# Levels where no persona lists one of the level's units.
personas: []
