      - {speaker: Mbah Putri, text: "Hahaha, leres sanget! Mas Mohamed sampun ngertos wayang.", ar_eg: "هههه، صح جدًا! إنت بقيت فاهم الوايانغ يا محمد.", ar: "هاها، صحيح تمامًا! صرت تفهم الوايانغ يا محمد.", en: "Ha ha, exactly right! You understand wayang now, Mas Mohamed."}
