    meaning:
      ar_eg: سخّن الزيت في الطاسة.
      ar: سخّن الزيت في المقلاة.
      en: Heat the oil in the wok.
    answers: [Panaskan, panaskan]
    explain:
      ar_eg: panas = سخن، وpanaskan = سخّنه (أمر بـ -kan زي masukkan وtambahkan).
      ar: panas = ساخن، وpanaskan = سخّنه (أمر بـ -kan).
      en: panas = hot; panaskan = heat it (a -kan command like masukkan).
    words: [panaskan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اغسل وقطّع التوم.
      ar: اغسل الثوم وقطّعه.
      en: Wash and cut the garlic.
    answers:
      - Cuci dan potong bawang putih.
