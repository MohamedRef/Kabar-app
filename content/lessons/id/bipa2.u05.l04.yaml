  - id: e10
    type: translate
    direction: from_target
    source_text: Jangan terlalu banyak cabai, ya!
    answers_meaning:
      ar_eg: ["ماتحطش فلفل حرّاق كتير قوي!", "ماتكترش الشطة!", "بلاش فلفل كتير"]
      ar: ["لا تُكثر من الفلفل الحار!", "لا تضع فلفلًا حارًّا كثيرًا"]
