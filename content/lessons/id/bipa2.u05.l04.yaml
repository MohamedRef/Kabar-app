schema: kabar.lesson/v1
id: bipa2.u05.l04
language: id
title: Berdasarkan, berdatangan
can_do:
  ar_eg: تعرف تفهم كلمات ber-…-an وber-…-kan لما تشوفها.
  ar: أن تتعرّف على صيغتي ber-…-an وber-…-kan.
  en: Recognise ber-…-an / ber-…-kan.
slides:
  - title: Bersalaman = تسالموا
    body:
      ar_eg: |
        لما تحط ber- في الأول و-an في الآخر، المعنى غالبًا «بيعملوا كده مع بعض»، زي وزن «تفاعَل» في العربي:
        - salam → bersalaman = يسلّموا على بعض (بالإيد)
        - peluk → berpelukan = يحضنوا بعض
        - kenal → berkenalan = يتعرّفوا على بعض
        bersalaman فيها كلمة «سلام» العربي، يعني حرفيًا «تسالموا»!
        في الشارع بيقولوا:
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
      ar: |
        إذا أحاطت ber- و-an بالجذر دلّت غالبًا على المشاركة، كوزن «تفاعَل» في العربية:
        - salam → bersalaman = تصافحوا
        - peluk → berpelukan = تعانقوا
        - kenal → berkenalan = تعارفوا
        وفي bersalaman لفظ «سلام» العربي، فكأنها «تسالموا».
        في كلام الشارع:
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
      en: |
        With ber- in front and -an at the end, the meaning is often "doing it to each other", like the Arabic pattern تفاعَل:
        - salam → bersalaman = shake hands (greet each other)
        - peluk → berpelukan = hug each other
        - kenal → berkenalan = get to know each other
        bersalaman contains Arabic «سلام»: literally "exchange salāms".
        On the street:
        - banget = sekali (very), after the adjective just like sekali
    grammar: id.confix.ber-an
    examples:
      - text: Setelah salat Id, semua orang bersalaman.
        ar_eg: بعد صلاة العيد كل الناس بتسلّم على بعض.
        ar: بعد صلاة العيد يتصافح الجميع.
        en: After Eid prayers everyone shakes hands.
      - text: Kami berkenalan di Bali.
        ar_eg: اتعرّفنا على بعض في بالي.
        ar: تعارفنا في بالي.
        en: We got to know each other in Bali.
  - title: Berdatangan, berlarian
    body:
      ar_eg: |
        ber-…-an ليها معنى تاني: ناس كتير بتعمل نفس الحاجة، ورا بعض أو في كل حتة:
        - datang → berdatangan = جايين ورا بعض (بالعدد)
        - lari → berlarian = بيجروا هنا وهناك
        ومع المسافة:
        - dekat → berdekatan = قريبين من بعض
        - jauh → berjauhan = بعاد عن بعض
      ar: |
        ولـ ber-…-an معنى آخر: كثرة الفاعلين وتتابعهم أو تفرّقهم:
        - datang → berdatangan = توافدوا
        - lari → berlarian = تراكضوا هنا وهناك
        ومع المسافة:
        - dekat → berdekatan = متقاربون
        - jauh → berjauhan = متباعدون
      en: |
        ber-…-an also means many people doing the same thing, one after another or all over the place:
        - datang → berdatangan = arrive in numbers
        - lari → berlarian = run about
        And with distance:
        - dekat → berdekatan = close together
        - jauh → berjauhan = far apart
    grammar: id.confix.ber-an
    examples:
      - text: Tamu-tamu mulai berdatangan.
        ar_eg: الضيوف بدأوا ييجوا ورا بعض.
        ar: بدأ الضيوف يتوافدون.
        en: The guests started arriving one after another.
      - text: Anak-anak berlarian di taman.
        ar_eg: العيال بيجروا هنا وهناك في الجنينة.
        ar: الأطفال يتراكضون في الحديقة.
        en: The children are running about in the park.
  - title: Berdasarkan resep nenek
    body:
      ar_eg: |
        ber-…-kan أقل بكتير، وأهم كلمة فيها berdasarkan = بناءً على / حسب.
        dasar = أساس، فـ berdasarkan = «واخد كذا أساس».
        هتشوفها كتير في الوصفات والأخبار والإعلانات: berdasarkan resep nenek = حسب وصفة جدتي.
      ar: |
        ber-…-kan أقل شيوعًا، وأهم كلماتها berdasarkan = بناءً على / وفق.
        فـ dasar = أساس، وberdasarkan = «متخذًا كذا أساسًا».
        وتكثر في الوصفات والأخبار والإعلانات: berdasarkan resep nenek = وفق وصفة الجدة.
      en: |
        ber-…-kan is much rarer; the word to know is berdasarkan = based on / according to.
        dasar = base, so berdasarkan = "having … as the base".
        You'll meet it in recipes, news and ads: berdasarkan resep nenek = from grandma's recipe.
    grammar: id.confix.ber-an
    examples:
      - text: Saya memasak nasi goreng ini berdasarkan resep nenek saya.
        ar_eg: أنا طبخت الرز المقلي ده على وصفة جدتي.
        ar: طبختُ هذا الأرز المقلي وفق وصفة جدتي.
        en: I cooked this fried rice from my grandmother's recipe.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: berpelukan
        ar_eg: يحضنوا بعض
        ar: يتعانقون
        en: hug each other
      - text: berkenalan
        ar_eg: يتعرفوا على بعض
        ar: يتعارفون
        en: get acquainted
      - text: berlarian
        ar_eg: يجروا هنا وهناك
        ar: يتراكضون
        en: run about
      - text: berdekatan
        ar_eg: قريبين من بعض
        ar: متقاربون
        en: close together
      - text: berjauhan
        ar_eg: بعاد عن بعض
        ar: متباعدون
        en: far apart
      - text: berdasarkan
        ar_eg: بناءً على، حسب
        ar: وفق
        en: based on
    words: [berpelukan, berkenalan, berlarian, berdekatan, berjauhan, berdasarkan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: ضيوف كتير بيوصلوا ورا بعض للحفلة. أنهي كلمة تنفع؟
      ar: ضيوف كثيرون يصلون إلى الحفل تباعًا. أيّ كلمة تناسب؟
      en: Lots of guests are arriving at the party one after another. Which word fits?
    options: [berdasarkan, datang, berdatangan]
    answer: 2
    explain:
      ar_eg: datang = ييجي بس، وberdatangan = ييجوا بالعدد ورا بعض.
      ar: datang مجرد المجيء، وberdatangan التوافد بكثرة.
      en: datang just means come; berdatangan = arrive in numbers.
    words: [berdatangan]
  - id: e03
    type: fill_blank
    sentence: Setelah salat Id, Raka dan Mohamed ___.
    meaning:
      ar_eg: بعد صلاة العيد، راكا ومحمد سلّموا على بعض.
      ar: بعد صلاة العيد تصافح راكا ومحمد.
      en: After Eid prayers, Raka and Mohamed shake hands.
    options: [berjauhan, bersalaman, berdasarkan]
    answers: [bersalaman]
    words: [bersalaman]
    explain:
      ar_eg: "ber-…-an = بيعملوا الحاجة لبعض: bersalaman = سلّموا على بعض. berjauhan = بعاد عن بعض، وberdasarkan = حسب."
      ar: "ber-…-an = فعل متبادل: bersalaman = تصافحا. أما berjauhan فـ«متباعدان» وberdasarkan «وفق»."
      en: "ber-…-an is mutual action: bersalaman = shake hands with each other. berjauhan is far apart, berdasarkan \"based on\"."
  - id: e04
    type: listen
    text: Tamu-tamu mulai berdatangan.
    options: [Tamu-tamu mulai berdatangan., Tamu-tamu mulai berlarian., Tamu-tamu mulai bersalaman.]
    answer: 0
    words: [berdatangan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: اتعرّفنا على بعض في بالي.
      ar: تعارفنا في بالي.
      en: We got to know each other in Bali.
    answer: Kami berkenalan di Bali.
    distractors: [berdasarkan, ke]
    words: [berkenalan]
    explain:
      ar_eg: berkenalan = اتعرّفوا على بعض (ber- + kenal + -an). berdasarkan = حسب، وke = لـ (اتجاه).
      ar: berkenalan = تعارفوا (ber- + kenal + -an). أما berdasarkan فـ«وفق» وke «إلى».
      en: berkenalan = get to know each other (ber- + kenal + -an). berdasarkan is "based on", ke is "to".
  - id: e06
    type: dictation
    text: Rumah kami berdekatan, tidak berjauhan.
    meaning:
      ar_eg: بيوتنا قريبة من بعض، مش بعيدة.
      ar: بيوتنا متقاربة لا متباعدة.
      en: Our houses are close together, not far apart.
    words: [berdekatan, berjauhan]
  - id: e07
    type: speaking
    text: Setelah salat Id, tamu-tamu berdatangan. Kami bersalaman dan berpelukan.
    meaning:
      ar_eg: بعد صلاة العيد، الضيوف بييجوا ورا بعض. بنسلّم على بعض وبنحضن بعض.
      ar: بعد صلاة العيد يتوافد الضيوف، فنتصافح ونتعانق.
      en: After Eid prayers, guests pour in. We shake hands and hug.
    words: [berdatangan, bersalaman, berpelukan]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «العيال بيجروا هنا وهناك في الجنينة»؟
      ar: كيف تقول «الأطفال يتراكضون في الحديقة»؟
      en: How do you say "The children are running about in the park"?
    options: ['Anak-anak berlarian di taman.', 'Anak-anak berkenalan di taman.', 'Anak-anak berpelukan di taman.', 'Anak-anak bersalaman di taman.']
    answer: 0
    words: [berlarian, berkenalan, berpelukan, bersalaman]
    explain:
      ar_eg: berlarian = بيجروا هنا وهناك (ber- + lari + -an، حركة كتير). berkenalan اتعرّفوا، berpelukan اتحضنوا، bersalaman سلّموا.
      ar: berlarian = يتراكضون (حركة متكرّرة). أما berkenalan فتعارف، berpelukan عناق، bersalaman مصافحة.
      en: "berlarian = run about (repeated movement). The others: get acquainted, hug, shake hands."
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «حسب الجدول»؟
      ar: كيف تقول «وفق الجدول»؟
      en: How do you say "according to the schedule"?
    options: ['berdasarkan jadwal', 'berdekatan jadwal', 'berjauhan jadwal']
    answer: 0
    words: [berdasarkan, berdekatan, berjauhan]
    explain:
      ar_eg: berdasarkan = حسب/بناءً على (من dasar = أساس). berdekatan = قريبين من بعض، وberjauhan = بعاد.
      ar: berdasarkan = وفق (من dasar). أما berdekatan فـ«متقاربان» وberjauhan «متباعدان».
      en: berdasarkan = according to (from dasar, base). berdekatan is close together, berjauhan far apart.
dialogue:
  title: Pasar malam Gianyar
  lines:
    - speaker: Rina
      text: Lihat, orang-orang mulai berdatangan ke pasar malam.
      ar_eg: بص، الناس بدأت تيجي ورا بعض على سوق الليل.
      ar: انظر، بدأ الناس يتوافدون إلى السوق الليلي.
      en: Look, people are starting to pour into the night market.
    - speaker: Mohamed
      text: Ramai banget! Itu Raka dan Ni Luh. Mereka bersalaman.
      ar_eg: زحمة قوي! دول راكا وني لوه. بيسلّموا على بعض.
      ar: مزدحم جدًّا! هذان راكا وني لوه، يتصافحان.
      en: It's so busy! There are Raka and Ni Luh. They're shaking hands.
    - speaker: Rina
      text: Ya, mereka berkenalan di sini tahun lalu.
      ar_eg: أيوه، هما اتعرّفوا على بعض هنا السنة اللي فاتت.
      ar: نعم، تعارفا هنا في العام الماضي.
      en: Yes, they got to know each other here last year.
    - speaker: Mohamed
      text: Nasi goreng di warung itu enak, ya?
      ar_eg: الرز المقلي في الوارونج ده حلو، صح؟
      ar: الأرز المقلي في ذلك المطعم لذيذ، أليس كذلك؟
      en: The fried rice at that stall is good, isn't it?
    - speaker: Rina
      text: Lezat banget! Ibu itu memasak berdasarkan resep neneknya.
      ar_eg: لذيذ جدًّا! الست دي بتطبخ على وصفة جدتها.
      ar: لذيذ جدًّا! تلك السيدة تطبخ وفق وصفة جدتها.
      en: Delicious! That lady cooks from her grandmother's recipe.
