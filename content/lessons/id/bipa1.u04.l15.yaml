schema: kabar.lesson/v1
id: bipa1.u04.l15
language: id
title: Ulangan Unit 4
can_do:
  ar_eg: تتعامل مع الأرقام والساعات والتواريخ.
  ar: أن تتعامل مع الأعداد والأوقات والتواريخ.
  en: Handle numbers, times and dates.
slides:
  - title: Unit 4 dalam satu halaman
    body:
      ar_eg: |
        - الأرقام: belas (١١–١٩)، puluh (عشرات)، ratus، ribu، juta؛ و«واحد» قبلهم = se- (seratus، seribu). Rp25.000 = dua puluh lima ribu.
        - الساعة: jam / pukul + رقم؛ lewat = و، kurang = إلا، seperempat = ربع، وsetengah delapan = ٧:٣٠.
        - الأيام (٦ منهم عربي): Senin، Selasa، Rabu، Kamis، Jumat، Sabtu، Minggu. التاريخ: tanggal + يوم + شهر + سنة.
        - الترتيب: pertama، وke- + رقم (kedua، ketiga)، بعد الاسم.
        - kapan = إمتى، berapa = كام (سعر، سن، رقم، ساعة).
      ar: |
        - الأعداد: belas (١١–١٩)، puluh (العشرات)، ratus، ribu، juta، و«واحد» قبلها = se- (seratus، seribu). Rp25.000 = dua puluh lima ribu.
        - الساعة: jam / pukul + عدد؛ lewat = و، kurang = إلا، seperempat = ربع، وsetengah delapan = السابعة والنصف.
        - الأيام (ستة منها عربية): Senin، Selasa، Rabu، Kamis، Jumat، Sabtu، Minggu. والتاريخ: tanggal + اليوم + الشهر + السنة.
        - الترتيب: pertama، وke- + العدد (kedua، ketiga)، بعد الاسم.
        - kapan = متى، berapa = كم (السعر والعمر والرقم والساعة).
      en: |
        - Numbers: belas (11–19), puluh (tens), ratus, ribu, juta; "one" before them = se- (seratus, seribu). Rp25.000 = dua puluh lima ribu.
        - Clock: jam / pukul + number; lewat = past, kurang = to, seperempat = quarter, and setengah delapan = 7:30.
        - Days (six from Arabic): Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu. Dates: tanggal + day + month + year.
        - Ordinals: pertama, then ke- + number (kedua, ketiga), after the noun.
        - kapan = when, berapa = how much / what number (price, age, phone, time).
    grammar: id.number.cardinal
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Kamis
        ar_eg: الخميس
        ar: الخميس
        en: Thursday
      - text: Sabtu
        ar_eg: السبت
        ar: السبت
        en: Saturday
      - text: Minggu
        ar_eg: الحد
        ar: الأحد
        en: Sunday
      - text: bulan
        ar_eg: شهر
        ar: شهر
        en: month
      - text: tahun
        ar_eg: سنة
        ar: سنة
        en: year
    words: [Kamis, Sabtu, Minggu, bulan, tahun]
  - id: e02
    type: match_pairs
    pairs:
      - text: Juli
        ar_eg: يوليو
        ar: يوليو
        en: July
      - text: kue
        ar_eg: كيكة، تورتة، حلويات
        ar: كعكة، حلوى
        en: cake
      - text: usia
        ar_eg: سن، عمر (رسمي)
        ar: عمر، سنّ (رسمي)
        en: age (formal)
      - text: halo
        ar_eg: ألو، هاي
        ar: مرحبًا، ألو
        en: hello
    words: [Juli, kue, usia, halo]
  - id: e03
    type: multiple_choice
    question: '07.30'
    question_meaning:
      ar_eg: الساعة ٧ ونص. تقولها إزاي؟
      ar: الساعة السابعة والنصف. كيف تقولها؟
      en: It's 7:30. How do you say it?
    options: [jam tujuh kurang setengah, jam setengah tujuh, jam setengah delapan]
    answer: 2
    explain:
      ar_eg: setengah بتاخد الساعة الجاية، يعني «نص على تمانية».
      ar: setengah تأخذ الساعة التالية، أي «نصف نحو الثامنة».
      en: setengah takes the next hour, "half to eight".
    words: [setengah, delapan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «اليوم التالت»؟
      ar: كيف تقول «اليوم الثالث»؟
      en: How do you say "the third day"?
    options: [hari ketiga, ketiga hari, tiga hari]
    answer: 0
    explain:
      ar_eg: الترتيب بعد الاسم. وtiga hari = تلات أيام.
      ar: العدد الترتيبي بعد الاسم، وtiga hari = ثلاثة أيام.
      en: The ordinal follows the noun; tiga hari = three days.
    words: [hari, ketiga]
  - id: e05
    type: listen
    text: jam sepuluh kurang seperempat
    options: [jam sembilan kurang seperempat, jam sepuluh lewat seperempat, jam sepuluh kurang seperempat]
    answer: 2
    words: [kurang, seperempat]
  - id: e06
    type: fill_blank
    sentence: ___ ulang tahunmu? — Tanggal lima Mei.
    meaning:
      ar_eg: عيد ميلادك إمتى؟ — يوم ٥ مايو.
      ar: متى عيد ميلادك؟ — في ٥ مايو.
      en: When is your birthday? — On 5 May.
    options: [Berapa, Apa, Kapan]
    answers: [Kapan]
    words: [kapan, ulang tahun]
    explain:
      ar_eg: "الرد تاريخ، يعني السؤال إمتى: Kapan. Berapa للأرقام، وApa = إيه."
      ar: الجواب تاريخ فالسؤال Kapan أي متى.
      en: A date answers Kapan (when).
  - id: e07
    type: fill_blank
    sentence: Rp300.000 = tiga ___ ribu
    meaning:
      ar_eg: ٣٠٠ ألف روبية
      ar: ثلاثمئة ألف روبية
      en: 300,000 rupiah
    answers: [ratus]
    words: [ratus, ribu]
    explain:
      ar_eg: ٣٠٠ = tiga ratus (ratus = مية)، والألف ribu.
      ar: ٣٠٠ = tiga ratus، وratus = مئة.
      en: 300 is tiga ratus.
  - id: e08
    type: build_sentence
    source:
      ar_eg: المحل ده بيفتح الساعة ٨ الصبح.
      ar: يفتح ذلك المتجر في الثامنة صباحًا.
      en: That shop opens at 8 a.m.
    answer: Toko itu buka jam delapan pagi.
    distractors: [malam, kurang]
    words: [toko, buka, jam]
    explain:
      ar_eg: Toko itu + buka (بيفتح) + jam delapan pagi. malam وkurang زيادة.
      ar: Toko itu buka jam delapan pagi. malam وkurang زائدتان.
      en: Toko itu + buka + jam delapan pagi. malam and kurang are extra.
  - id: e09
    type: build_sentence
    source:
      ar_eg: عندي تلاتين سنة.
      ar: عمري ثلاثون عامًا.
      en: I'm thirty years old.
    answer: Umur saya tiga puluh tahun.
    distractors: [belas, jam]
    words: [umur, puluh, tahun]
    explain:
      ar_eg: Umur saya (عمري) + tiga puluh (٣٠) + tahun. belas وjam زيادة.
      ar: Umur saya tiga puluh tahun. belas وjam زائدتان.
      en: Umur saya + tiga puluh + tahun. belas and jam are extra.
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: النهارده الاتنين، ١ يونيو.
      ar: اليوم الاثنين، الأول من يونيو.
      en: Today is Monday, 1 June.
    answers: ['Hari ini hari Senin, tanggal satu Juni.', 'Hari ini hari Senin, tanggal 1 Juni.', 'Hari ini Senin, tanggal satu Juni.', Hari ini hari Senin tanggal satu Juni., 'Hari ini hari Senin, satu Juni.', 'Hari ini hari Senin, tanggal satu Juni']
    words: [hari ini, Senin, tanggal, Juni]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: سعره ١٥ ألف روبية.
      ar: سعره خمسة عشر ألف روبية.
      en: It costs fifteen thousand rupiah.
    answers: [Harganya lima belas ribu rupiah., Harganya lima belas ribu rupiah, Harganya lima belas ribu., Harganya Rp15.000., Lima belas ribu rupiah.]
    words: [harga, belas, ribu]
  - id: e12
    type: speaking
    text: Sekarang jam setengah delapan malam.
    meaning:
      ar_eg: الساعة دلوقتي سبعة ونص بالليل.
      ar: الساعة الآن السابعة والنصف مساءً.
      en: It's half past seven p.m. now.
    words: [sekarang, setengah, malam]
dialogue:
  title: Belanja di Pasar Tanah Abang
  lines:
    - speaker: Mohamed
      text: Permisi, Bu. Toko ini buka hari Minggu?
      ar_eg: لو سمحتي يا حاجة. المحل ده بيفتح يوم الحد؟
      ar: من فضلكِ يا سيدتي. هل يفتح هذا المتجر يوم الأحد؟
      en: Excuse me, ma'am. Is this shop open on Sunday?
    - speaker: Bu Ani
      text: Ya, Mas. Buka jam delapan pagi, tutup jam empat sore.
      ar_eg: أيوه. بيفتح ٨ الصبح ويقفل ٤ العصر.
      ar: نعم. يفتح في الثامنة صباحًا ويغلق في الرابعة عصرًا.
      en: Yes. It opens at 8 a.m. and closes at 4 p.m.
    - speaker: Mohamed
      text: Baju ini berapa harganya?
      ar_eg: القميص ده بكام؟
      ar: بكم هذا القميص؟
      en: How much is this shirt?
    - speaker: Bu Ani
      text: Lima puluh ribu. Dua baju, sembilan puluh ribu.
      ar_eg: خمسين ألف. والاتنين بتسعين ألف.
      ar: خمسون ألفًا، والقميصان بتسعين ألفًا.
      en: Fifty thousand. Two shirts, ninety thousand.
    - speaker: Mohamed
      text: Saya beli dua, Bu. Terima kasih!
      ar_eg: هاخد اتنين يا حاجة. شكرًا!
      ar: سأشتري اثنين يا سيدتي. شكرًا!
      en: I'll take two, ma'am. Thank you!
    - speaker: Bu Ani
      text: Sama-sama, Mas. Sampai jumpa hari Minggu!
      ar_eg: العفو. أشوفك يوم الحد!
      ar: العفو. إلى اللقاء يوم الأحد!
      en: You're welcome. See you on Sunday!
souvenir:
  id: bipa1.u04.souvenir
  title: Pasar Tanah Abang
  note:
    ar_eg: Tanah Abang من أكبر أسواق القماش والهدوم في جنوب شرق آسيا، وزحمته بتفكّرك بالعتبة والموسكي. وهناك هتلاحظ إن ستة من أيام الأسبوع السبعة اسمها عربي، من Senin لـ Sabtu. وفي الفصال الناس بتشيل الأصفار، فـ«dua puluh» يعني عشرين ألف، وفي عامية جاكرتا «goceng» = خمس تلاف — قولها وشوف البيّاع هيضحك إزاي!
    ar: سوق Tanah Abang من أكبر أسواق الأقمشة والملابس في جنوب شرق آسيا، وزحامه يذكّرك بالعتبة والموسكي. وستلاحظ أن ستة من أيام الأسبوع السبعة عربية الأسماء، من Senin إلى Sabtu. وعند المساومة تُحذف الأصفار، فـ«dua puluh» تعني عشرين ألفًا، وفي عامية جاكرتا «goceng» = خمسة آلاف. قلها وانظر كيف يبتسم البائع!
    en: Tanah Abang is one of Southeast Asia's biggest textile and clothing markets, as crowded as Cairo's Ataba and Muski. While you're there you'll notice six of the seven weekday names are Arabic, Senin through Sabtu. When haggling, people drop the zeros — "dua puluh" means twenty thousand — and in Jakarta slang "goceng" is 5,000. Say it and watch the seller grin!
