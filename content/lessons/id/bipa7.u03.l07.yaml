schema: kabar.lesson/v1
id: bipa7.u03.l07
language: id
title: Pertapa di gunung
can_do:
  ar_eg: تفهم حكاية ناسك عنده قوة خارقة وتتكلّم عنها باحترام.
  ar: أن تفهم حكاية ناسك ذي قوّة خارقة وتتحدّث عنها باحترام.
  en: Follow a tale of a hermit with supernatural power and discuss it respectfully.
slides:
  - title: Kata-kata legenda
    body:
      ar_eg: |
        في الحكايات الشعبية الجاوية:
        bertapa = يعتزل في جبل أو كهف علشان يتعبّد. اللي بيعمل كده اسمه pertapa.
        بعد ما يعتكف ممكن ياخد wangsit (إلهام في الحلم) أو kesaktian (قوة خارقة).
        keris = خنجر متموّج، وفيه كريسات بيعتبروها keramat (مبروكة ومهابة).
        sakral = مقدّس (upacara sakral). moksa = الشخص يختفي بجسمه كله، زي ما بتقول حكايات عن الملك جايابايا.
        دي حكايات وإيمان ناس؛ احكيها باحترام من غير ما تحكم عليها.
        - في الكلام: nggak = tidak، tapi = tetapi، soal = tentang، teriak = berteriak.
      ar: |
        في الحكايات الشعبية الجاوية:
        bertapa = أن يعتزل في جبل أو كهف للتعبّد، ومن يفعل ذلك pertapa.
        وبعد الاعتزال قد يتلقّى wangsit (إلهامًا في المنام) أو kesaktian (قوّة خارقة).
        keris = خنجر متموّج، وبعض الخناجر تُعدّ keramat (ذات بركة ومهابة).
        sakral = مقدّس (upacara sakral). moksa = اختفاء المرء بجسده كلّه، كما تروي حكايات عن الملك جايابايا.
        هذه حكايات ومعتقدات، فارْوِها باحترام دون حكم.
        - في الكلام اليومي: nggak = tidak، tapi = tetapi، soal = tentang، teriak = berteriak.
      en: |
        In Javanese folk tales:
        bertapa = to withdraw to a mountain or cave to meditate; such a person is a pertapa.
        After meditating they may receive a wangsit (a sign in a dream) or kesaktian (supernatural power).
        keris = the wavy dagger; some are considered keramat (charged with power).
        sakral = sacred (upacara sakral). moksa = vanishing body and soul, as tales say of King Jayabaya.
        These are stories and beliefs: tell them with respect, without judging.
        - In speech: nggak = tidak, tapi = tetapi, soal = tentang, teriak = berteriak.
    examples:
      - text: Pangeran itu bertapa di gua selama empat puluh hari.
        ar_eg: الأمير ده اعتكف في كهف أربعين يوم.
        ar: اعتزل ذلك الأمير في كهف أربعين يومًا.
        en: That prince meditated in a cave for forty days.
      - text: Pertapa tua itu mendapat wangsit dalam mimpinya.
        ar_eg: الناسك العجوز ده جاله إلهام في الحلم.
        ar: تلقّى ذلك الناسك العجوز إلهامًا في منامه.
        en: The old hermit received a sign in his dream.
      - text: Keris pusaka itu dianggap keramat oleh warga.
        ar_eg: الأهالي شايفين إن الكريس الموروث ده مبروك.
        ar: يعدّ السكّان ذلك الخنجر الموروث مقدّسًا.
        en: Villagers consider that heirloom kris sacred.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bertapa
        ar_eg: يتعبّد في عزلة / يعتكف
        ar: يعتزل للتعبّد والتأمّل
        en: to meditate in seclusion, live as an ascetic
      - text: pertapa
        ar_eg: ناسك / زاهد عايش لوحده
        ar: ناسك، زاهد
        en: hermit, ascetic
      - text: kesaktian
        ar_eg: قوة خارقة
        ar: قوّة خارقة
        en: supernatural power
      - text: wangsit
        ar_eg: إلهام / رسالة غيبية في الحلم
        ar: إلهام غيبيّ، رؤيا
        en: mystical revelation, sign in a dream
    words: [bertapa, pertapa, kesaktian, wangsit]
  - id: e02
    type: match_pairs
    pairs:
      - text: keramat
        ar_eg: مبروك / مقدّس عند الناس
        ar: مقدّس، ذو بركة
        en: sacred, believed to hold power
      - text: sakral
        ar_eg: مقدّس
        ar: مقدّس
        en: sacred
      - text: keris
        ar_eg: كريس (خنجر جاوي متموّج)
        ar: الكريس، خنجر جاويّ متموّج
        en: kris, wavy Javanese dagger
      - text: moksa
        ar_eg: اختفاء بالجسد / الخلاص في الحكايات
        ar: الانعتاق، الاختفاء بالجسد
        en: moksha, vanishing body and soul
    words: [keramat, sakral, keris, moksa]
  - id: e03
    type: listen
    text: Menurut cerita, raja itu tidak meninggal, tetapi moksa.
    question:
      ar_eg: حصل إيه للملك؟
      ar: ماذا جرى للملك؟
      en: What happened to the king?
    options: [اختفى بجسمه, اعتكف في الجبل, خد قوة خارقة]
    answer: 0
    meaning:
      ar_eg: على حسب الحكاية، الملك ده ما ماتش، ده اختفى بجسمه.
      ar: تقول الحكاية إنّ الملك لم يمت بل اختفى بجسده.
      en: According to the story, the king didn't die but vanished, body and soul.
    words: [moksa]
  - id: e04
    type: fill_blank
    sentence: Tari itu hanya ditampilkan pada upacara ___.
    meaning:
      ar_eg: الرقصة دي بتترقص بس في الطقوس الـ ___.
      ar: لا تُؤدّى تلك الرقصة إلا في الطقوس ___.
      en: That dance is only performed at ___ ceremonies.
    options: [sakral, pertapa, keris]
    answers: [sakral]
    words: [sakral, pertapa, keris]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «wangsit» يعني إيه؟
      ar: ما «wangsit»؟
      en: What is a 'wangsit'?
    options: [Pesan gaib yang datang lewat mimpi atau firasat., Senjata dari besi., Makanan untuk upacara.]
    answer: 0
    explain:
      ar_eg: wangsit = إلهام أو رسالة غيبية.
      ar: wangsit = إلهام أو رسالة غيبيّة.
      en: wangsit = a mystical message or revelation.
    words: [wangsit, keris]
  - id: e06
    type: fill_blank
    sentence: Ia pergi ke Gunung Lawu untuk ___.
    meaning:
      ar_eg: راح جبل لاوو علشان ___.
      ar: ذهب إلى جبل لاوو كي ___.
      en: He went to Mount Lawu to ___.
    options: [bertapa, moksa, kesaktian]
    answers: [bertapa]
    words: [bertapa, moksa, kesaktian]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الناس بتقول إن الشجرة دي مبروكة.
      ar: يقول الناس إنّ هذه الشجرة مقدّسة.
      en: People say this tree is sacred.
    answer: Kata orang, pohon ini keramat.
    distractors: [sakral, pertapa]
    words: [keramat]
  - id: e08
    type: translate
    direction: from_target
    source_text: Dalam legenda, kesaktiannya datang setelah bertapa bertahun-tahun.
    answers_meaning:
      ar_eg: [في الأسطورة، قوته الخارقة جت بعد ما اعتكف سنين, في الحكاية، خد القوة الخارقة بعد سنين من العزلة]
      ar: [في الأسطورة جاءته قوّته الخارقة بعد اعتزال دام سنوات, تقول الأسطورة إنّ قوّته الخارقة أتت بعد سنوات من التنسّك]
      en: ['In the legend, his power came after years of meditation', 'In the legend, he gained his power after meditating for years']
    words: [kesaktian, bertapa]
  - id: e09
    type: speaking
    text: Pertapa itu menyimpan sebilah keris tua.
    meaning:
      ar_eg: الناسك ده كان شايل كريس قديم.
      ar: كان ذلك الناسك يحتفظ بخنجر كريس قديم.
      en: That hermit kept an old kris.
    words: [pertapa, keris]
  - id: e10
    type: multiple_choice
    question: Siapa yang biasanya mendapat wangsit dalam legenda Jawa?
    options: [Pedagang di pasar., Turis dari luar negeri., Pertapa yang lama bertapa.]
    answer: 2
    explain:
      ar_eg: في الحكايات، الإلهام بييجي للناسك بعد عزلة طويلة.
      ar: في الحكايات يأتي الإلهام للناسك بعد طول اعتزال.
      en: In the tales, the sign comes to a hermit after long seclusion.
    words: [pertapa, bertapa, wangsit, kesaktian, moksa, sakral, keramat]
dialogue:
  lines:
    - speaker: Mama Ruth
      text: Di Jawa, katanya ada cerita soal raja yang bertapa, ya?
      ar_eg: بيقولوا إن في جاوة فيه حكايات عن ملوك بيعتكفوا، صح؟
      ar: يقال إنّ في جاوة حكايات عن ملوك يعتزلون للتعبّد، أليس كذلك؟
      en: In Java they have stories about kings who meditate, right?
    - speaker: Mohamed
      text: Betul, Mama. Seorang pertapa bisa mendapat wangsit atau kesaktian.
      ar_eg: مظبوط يا ماما. الناسك ممكن ياخد إلهام أو قوة خارقة.
      ar: صحيح يا أمّي، فقد ينال الناسك إلهامًا أو قوّة خارقة.
      en: Right, Mama. A hermit can receive a sign or supernatural power.
    - speaker: Mama Ruth
      text: Di sini juga ada tempat keramat. Kami nggak boleh teriak di sana.
      ar_eg: هنا كمان فيه أماكن مبروكة. ممنوع نزعق هناك.
      ar: وهنا أيضًا أماكن مقدّسة، لا يجوز لنا الصراخ فيها.
      en: Here we have sacred places too. We mustn't shout there.
    - speaker: Mohamed
      text: Saya akan menghormati aturan itu. Tempat sakral harus dijaga.
      ar_eg: هحترم القاعدة دي. الأماكن المقدّسة لازم تتصان.
      ar: سأحترم هذه القاعدة، فالأماكن المقدّسة يجب أن تُصان.
      en: I'll respect that rule. Sacred places must be protected.
    - speaker: Mama Ruth
      text: Bagus. Cerita boleh beda, tapi rasa hormatnya sama.
      ar_eg: حلو. الحكايات ممكن تختلف، بس الاحترام واحد.
      ar: جميل، قد تختلف الحكايات لكنّ الاحترام واحد.
      en: Good. The stories may differ, but the respect is the same.
