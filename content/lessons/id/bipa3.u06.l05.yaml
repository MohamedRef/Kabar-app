schema: kabar.lesson/v1
id: bipa3.u06.l05
language: id
title: Layanan hotel
can_do:
  ar_eg: تتكلم عن خدمة الفندق ومرافقه وجودتها، وتطلب طلب بأدب كزبون.
  ar: أن تتحدث عن خدمة الفندق ومرافقه وجودتها، وتقدّم طلبًا بأدب بصفتك عميلًا.
  en: Talk about a hotel's service, facilities and quality, and make a request as a guest.
slides:
  - title: Di hotel
    body:
      ar_eg: |
        layanan = خدمة (layanan kamar = خدمة الغرف). fasilitas = مرافق (حمام سباحة، جيم...).
        kualitas = جودة. pelanggan = زبون، عميل. permintaan = طلب.
        tersedia = موجود، متاح. menyediakan = يوفّر. terbatas = محدود.
      ar: |
        layanan = خدمة (layanan kamar = خدمة الغرف). fasilitas = مرافق (مسبح، نادٍ رياضي...).
        kualitas = جودة. pelanggan = زبون، عميل. permintaan = طلب.
        tersedia = متوفّر، متاح. menyediakan = يوفّر. terbatas = محدود.
      en: |
        layanan = service (layanan kamar = room service). fasilitas = facilities (pool, gym...).
        kualitas = quality. pelanggan = customer. permintaan = request.
        tersedia = available. menyediakan = provide. terbatas = limited.
    examples:
      - text: Hotel ini menyediakan sarapan gratis.
        ar_eg: الفندق ده بيوفّر فطار ببلاش.
        ar: يوفّر هذا الفندق فطورًا مجانيًا.
        en: This hotel provides free breakfast.
      - text: Kamar dengan pemandangan laut masih tersedia.
        ar_eg: الأوض اللي بتطل على البحر لسه متاحة.
        ar: الغرف المطلّة على البحر ما زالت متاحة.
        en: Rooms with a sea view are still available.
      - text: Kualitas layanannya tidak sesuai dengan harganya.
        ar_eg: جودة الخدمة مش على قد السعر.
        ar: جودة الخدمة لا تتناسب مع السعر.
        en: The quality of service doesn't match the price.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: layanan
        ar_eg: خدمة
        ar: خدمة
        en: service
      - text: fasilitas
        ar_eg: مرافق
        ar: مرافق
        en: facilities
      - text: kualitas
        ar_eg: جودة
        ar: جودة
        en: quality
      - text: pelanggan
        ar_eg: زبون
        ar: عميل
        en: customer
    words: [layanan, fasilitas, kualitas, pelanggan]
  - id: e02
    type: match_pairs
    pairs:
      - text: permintaan
        ar_eg: طلب
        ar: طلب
        en: request
      - text: tersedia
        ar_eg: متاح
        ar: متوفّر
        en: available
      - text: menyediakan
        ar_eg: يوفّر
        ar: يوفّر
        en: provide
      - text: terbatas
        ar_eg: محدود
        ar: محدود
        en: limited
    words: [permintaan, tersedia, menyediakan, terbatas]
  - id: e03
    type: listen
    text: Maaf, kamar untuk malam ini sudah tidak tersedia.
    question:
      ar_eg: الأوض عاملة إيه؟
      ar: ما وضع الغرف؟
      en: What about the rooms?
    options: [فيه أوض فاضية, مافيش أوض متاحة, الأوض رخيصة]
    answer: 1
    meaning:
      ar_eg: آسفين، الأوض للّيلة دي مابقتش متاحة.
      ar: عذرًا، لم تعد الغرف متاحة لهذه الليلة.
      en: Sorry, there are no rooms available tonight any more.
    words: [tersedia]
  - id: e04
    type: fill_blank
    sentence: 'Hotel ini punya banyak ___: kolam renang, restoran dan tempat olahraga.'
    meaning:
      ar_eg: 'الفندق ده عنده ___ كتير: حمام سباحة ومطعم ومكان رياضة.'
      ar: 'لهذا الفندق ___ كثيرة: مسبح ومطعم ونادٍ رياضي.'
      en: 'This hotel has lots of ___: a pool, a restaurant and a gym.'
    options: [fasilitas, permintaan, terbatas]
    answers: [fasilitas]
    words: [fasilitas, permintaan, terbatas]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي بيشتري حاجة أو بينزل في فندق بنسميه إيه؟
      ar: ماذا نسمّي من يشتري شيئًا أو ينزل في فندق؟
      en: What do we call someone who buys something or stays at a hotel?
    options: [kualitas, pelanggan, layanan]
    answer: 1
    explain:
      ar_eg: pelanggan = زبون، عميل.
      ar: pelanggan = زبون، عميل.
      en: pelanggan = customer.
    words: [pelanggan, kualitas, layanan]
  - id: e06
    type: fill_blank
    sentence: Tempat parkir di hotel ini ___. Ada sepuluh saja.
    meaning:
      ar_eg: الركنة في الفندق ده ___. عشرة بس.
      ar: مواقف السيارات في هذا الفندق ___. عشرة فقط.
      en: Parking at this hotel is ___. There are only ten spaces.
    options: [tersedia, terbatas, pelanggan]
    answers: [terbatas]
    words: [terbatas, tersedia, pelanggan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الفندق بيوفّر خدمة غرف ٢٤ ساعة.
      ar: يوفّر الفندق خدمة الغرف على مدار الساعة.
      en: The hotel provides 24-hour room service.
    answer: Hotel menyediakan layanan kamar dua puluh empat jam.
    distractors: [kualitas, fasilitas]
    words: [menyediakan, layanan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kualitas makanannya sangat baik.
    answers_meaning:
      ar_eg: [جودة الأكل كويسة جدًا, الأكل جودته عالية]
      ar: [جودة الطعام جيدة جدًا, الطعام عالي الجودة]
      en: [The quality of the food is very good, The food is of very good quality]
    words: [kualitas]
  - id: e09
    type: speaking
    text: 'Saya punya satu permintaan: tolong bersihkan kamar saya.'
    meaning:
      ar_eg: 'عندي طلب واحد: لو سمحت نضّفوا أوضتي.'
      ar: 'لديّ طلب واحد: من فضلكم نظّفوا غرفتي.'
      en: 'I have one request: please clean my room.'
    words: [permintaan]
  - id: e10
    type: multiple_choice
    question: Restoran kami ___ makanan halal.
    options: [menyediakan, terbatas, permintaan]
    answer: 0
    explain:
      ar_eg: menyediakan = يوفّر.
      ar: menyediakan = يوفّر.
      en: menyediakan = provide.
    words: [menyediakan, terbatas, permintaan, layanan, fasilitas]
dialogue:
  lines:
    - speaker: Resepsionis
      text: Selamat pagi, Pak. Ada yang bisa saya bantu?
      ar_eg: صباح الخير يا فندم. أقدر أساعدك في حاجة؟
      ar: صباح الخير يا سيدي. هل من خدمة؟
      en: Good morning, sir. How can I help?
    - speaker: Mohamed
      text: Pagi. Apakah hotel ini menyediakan layanan antar ke bandara?
      ar_eg: صباح النور. الفندق بيوفّر توصيل للمطار؟
      ar: صباح النور. هل يوفّر الفندق خدمة توصيل إلى المطار؟
      en: Morning. Does the hotel provide an airport transfer?
    - speaker: Resepsionis
      text: Ada, Pak, tapi mobilnya terbatas. Kapan Bapak ke bandara?
      ar_eg: أيوه يا فندم، بس العربيات محدودة. حضرتك رايح المطار إمتى؟
      ar: نعم يا سيدي، لكن السيارات محدودة. متى ستذهب إلى المطار؟
      en: Yes, sir, but cars are limited. When are you going to the airport?
    - speaker: Mohamed
      text: Besok, jam enam pagi. Masih tersedia?
      ar_eg: بكرة، الساعة ستة الصبح. لسه متاح؟
      ar: غدًا في السادسة صباحًا. هل ما زال متاحًا؟
      en: Tomorrow, 6 a.m. Is it still available?
    - speaker: Resepsionis
      text: Masih. Permintaan Bapak sudah saya catat. Terima kasih sudah menjadi pelanggan kami.
      ar_eg: لسه. سجّلت طلب حضرتك. شكرًا إنك عميل عندنا.
      ar: نعم. سجّلت طلبك. شكرًا لكونك من عملائنا.
      en: It is. I've noted your request. Thank you for being our guest.
