schema: kabar.lesson/v1
id: bipa4.u03.l04
language: id
title: Harganya selangit
can_do:
  ar_eg: تبالغ في الوصف عشان التأثير (سعره في السما).
  ar: أن تبالغ في الوصف للتأثير.
  en: Exaggerate for effect with hyperbole.
slides:
  - title: Hiperbola
    body:
      ar_eg: |
        المبالغة (hiperbola) = كلام أكبر من الحقيقة عشان يأثر، زي عندنا «سعره في السما» و«قلتلك ألف مرة»:
        harganya selangit = سعره في السما (se- + langit)
        sudah seribu kali = ألف مرة
        keringat sebesar biji jagung = عرق قد حبة الدرة
      ar: |
        المبالغة (hiperbola) تكبير الكلام للتأثير، كقولنا «ثمنه يناطح السماء» و«قلتُ لك ألف مرة»:
        harganya selangit = ثمنه في السماء (se- + langit)
        sudah seribu kali = ألف مرة
        keringat sebesar biji jagung = عرق بحجم حبّ الذرة
      en: |
        Hyperbole (hiperbola) exaggerates for effect, like Arabic «سعره في السما» or "I've told you a thousand times":
        harganya selangit = sky-high price (se- + langit, sky)
        sudah seribu kali = a thousand times
        keringat sebesar biji jagung = sweat drops as big as corn kernels
    grammar: id.figurative.simile-hyperbole
    examples:
      - text: Harga kerbau belang itu selangit!
        ar_eg: الجاموسة المنقطة دي سعرها في السما!
        ar: ثمن ذلك الجاموس المرقّط باهظ جدًا!
        en: That spotted buffalo costs a fortune!
      - text: Saya sudah seribu kali bilang, hati-hati di tebing!
        ar_eg: قلتلك ألف مرة، خلي بالك على الجرف!
        ar: قلتُ لك ألف مرة، احذر عند الجرف!
        en: I've told you a thousand times, be careful on the cliff!
  - title: Untuk cerita, bukan laporan
    body:
      ar_eg: |
        المبالغة حلوة في الحكاية والكلام، بس في التقرير الرسمي قول الأرقام بالظبط.
        وtak terhitung (ما يتعدش) من ter- بمعنى «ينفع / ما ينفعش» اللي اتعلمته.
        وmakam (قبر / ضريح) جاية من العربي «مقام».
      ar: |
        المبالغة جميلة في الحكاية والحديث، أما التقرير الرسمي فيلتزم الأرقام الدقيقة.
        وtak terhitung (لا يُحصى) من ter- بمعنى الإمكان التي تعلمتها.
        وmakam (القبر / الضريح) من العربية «مقام».
      en: |
        Hyperbole suits stories and talk; formal reports give exact numbers.
        tak terhitung (countless) uses the "can be" ter- you learned.
        makam (grave, tomb) comes from Arabic «مقام».
    grammar: id.figurative.simile-hyperbole
    examples:
      - text: Di Londa, makam leluhur terletak di tebing batu.
        ar_eg: في لوندا، قبور الأجداد موجودة في جرف صخري.
        ar: في لوندا تقع قبور الأسلاف في جرف صخري.
        en: At Londa, the ancestors' graves are set in a rock cliff.
      - text: Jumlah tamu di upacara itu tak terhitung.
        ar_eg: عدد الضيوف في الاحتفال ده ما يتعدش.
        ar: عدد الضيوف في تلك المراسم لا يُحصى.
        en: The guests at that ceremony were countless.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: selangit
        ar_eg: في السما (غالي جدًا)
        ar: باهظ جدًا
        en: sky-high
      - text: tak terhitung
        ar_eg: ما يتعدش
        ar: لا يُحصى
        en: countless
      - text: tebing
        ar_eg: جرف / حافة صخرية
        ar: جرف
        en: cliff
      - text: makam
        ar_eg: قبر / ضريح
        ar: قبر / ضريح
        en: grave, tomb
      - text: patung
        ar_eg: تمثال
        ar: تمثال
        en: statue
    words: [selangit, tak terhitung, tebing, makam, patung]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها مبالغة؟
      ar: أيّ جملة فيها مبالغة؟
      en: Which sentence is a hyperbole?
    options: ["Harga kerbau itu dua ratus juta rupiah.", "Harga kerbau itu selangit!", "Harga kerbau itu lebih mahal daripada motor."]
    answer: 1
    explain:
      ar_eg: مفيش حاجة سعرها فعلًا «في السما»، دي مبالغة. التانيين حقايق.
      ar: لا شيء ثمنه «في السماء» حقًا، فهي مبالغة، والجملتان الأخريان حقائق.
      en: Nothing literally costs "the sky" — that's hyperbole; the other two are facts.
    words: [selangit]
  - id: e03
    type: listen
    text: Makam leluhur terletak di tebing batu.
    options: ["Makam leluhur terletak di gua batu.", "Rumah leluhur terletak di tebing batu.", "Makam leluhur terletak di tebing batu."]
    answer: 2
    meaning:
      ar_eg: قبور الأجداد موجودة في جرف صخري.
      ar: تقع قبور الأسلاف في جرف صخري.
      en: The ancestors' graves are set in a rock cliff.
    words: [makam, tebing]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: بتكتب تقرير رسمي. أنهي جملة أنسب؟
      ar: تكتب تقريرًا رسميًا. أيّ جملة أنسب؟
      en: You're writing a formal report. Which sentence fits better?
    options: ["Menurut data resmi, harga tiket naik 50 persen.", "Menurut data resmi, harga tiket selangit.", "Menurut data resmi, harga tiket naik seribu kali."]
    answer: 0
    explain:
      ar_eg: في التقرير الرسمي بلاش مبالغة؛ قول الرقم.
      ar: لا مبالغة في التقرير الرسمي؛ اذكر الرقم.
      en: No hyperbole in a formal report — give the figure.
    words: [selangit]
  - id: e05
    type: fill_blank
    sentence: Di tebing itu ada banyak ___ kayu yang disebut tau-tau.
    meaning:
      ar_eg: في الجرف ده فيه تماثيل خشب كتير اسمها تاو تاو.
      ar: في ذلك الجرف تماثيل خشبية كثيرة تُسمّى تاو تاو.
      en: On that cliff there are many wooden statues called tau-tau.
    options: [patung, makam, tanduk]
    answers: [patung]
    words: [patung, tebing]
  - id: e06
    type: build_sentence
    source:
      ar_eg: عدد القبور في الكهف ده ما يتعدش.
      ar: عدد القبور في ذلك الكهف لا يُحصى.
      en: The graves in that cave are countless.
    answer: Jumlah makam di gua itu tak terhitung.
    distractors: [terlalu, selangit]
    words: [makam, tak terhitung]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: التماثيل دي شكلها زي البني آدمين.
      ar: تبدو تلك التماثيل كالبشر.
      en: Those statues look like people.
    answers:
      - Patung-patung itu terlihat seperti manusia.
      - Patung-patung itu terlihat seperti manusia
      - Patung-patung itu seperti manusia.
      - Patung-patung itu terlihat seperti orang.
      - Patung-patung itu kelihatan seperti manusia.
      - Patung itu terlihat seperti manusia.
      - Patung-patung itu terlihat bagaikan manusia.
      - Patung-patung itu tampak seperti manusia.
    words: [patung]
  - id: e08
    type: speaking
    text: Tamu di upacara itu tak terhitung, dan harga kerbaunya selangit!
    meaning:
      ar_eg: الضيوف في الاحتفال ده ما يتعدوش، وسعر الجاموس في السما!
      ar: ضيوف تلك المراسم لا يُحصون، وثمن جواميسها باهظ جدًا!
      en: The guests at that ceremony were countless, and the buffalo cost a fortune!
    words: [tak terhitung, selangit]
dialogue:
  title: Di Londa
  lines:
    - speaker: Mohamed
      text: Mas, tebing ini tinggi sekali! Keringat saya sebesar biji jagung.
      ar_eg: يا مَس، الجرف ده عالي أوي! العرق نازل مني قد حبة الدرة.
      ar: يا ماس، هذا الجرف عالٍ جدًا! عرقي بحجم حبّ الذرة.
      en: Mas, this cliff is so high! I'm sweating buckets.
    - speaker: Mas Rizal
      text: Ha-ha! Lihat ke atas. Itu patung tau-tau, wajah leluhur yang sudah meninggal.
      ar_eg: هههه! بص فوق. دي تماثيل التاو تاو، وشوش الأجداد اللي ماتوا.
      ar: انظر إلى الأعلى، تلك تماثيل تاو تاو، وجوه الأسلاف الراحلين.
      en: Ha ha! Look up. Those are tau-tau statues, the faces of ancestors who have died.
    - speaker: Mohamed
      text: Jadi makam mereka ada di dalam tebing?
      ar_eg: يعني قبورهم جوه الجرف؟
      ar: أي أن قبورهم داخل الجرف؟
      en: So their graves are inside the cliff?
    - speaker: Mas Rizal
      text: Betul. Untuk upacara Rambu Solo', keluarga membeli kerbau yang harganya selangit.
      ar_eg: مظبوط. ولاحتفال رامبو سولو، العيلة بتشتري جاموس سعره في السما.
      ar: صحيح. ولمراسم رامبو سولو تشتري الأسرة جواميس باهظة الثمن.
      en: Right. For the Rambu Solo' ceremony, families buy buffalo that cost a fortune.
    - speaker: Mohamed
      text: Pantas tamunya tak terhitung!
      ar_eg: علشان كده الضيوف ما يتعدوش!
      ar: لا عجب أن الضيوف لا يُحصون!
      en: No wonder there are countless guests!
