schema: kabar.lesson/v1
id: bipa1.u06.l04
language: id
title: Sudah, belum, sedang, akan
can_do:
  ar_eg: توضّح الفعل حصل إمتى من غير أزمنة.
  ar: أن تبيّن زمن الفعل بلا تصريف للأزمنة.
  en: Show when an action happens without tenses.
slides:
  - title: Kata kerja tidak berubah
    body:
      ar_eg: |
        خبر حلو: الفعل الإندونيسي عمره ما بيتغير! makan = كل / بياكل / هياكل.
        عشان توضح الزمن بتحط كلمة صغيرة قبل الفعل، بالظبط زي ما المصري بيحط «بـ» و«هـ» قدام الفعل:
        sudah (خلاص)، belum (لسه ماحصلش)، sedang (دلوقتي)، akan (هـ).
      ar: |
        الفعل الإندونيسي لا يتغير أبدًا: makan = أكل / يأكل / سيأكل.
        ويتحدد الزمن بكلمة قبل الفعل، كما تسبق «قد» و«سـ» الفعل العربي:
        sudah (قد)، belum (لمّا / ليس بعد)، sedang (الآن)، akan (سـ / سوف).
      en: |
        Good news — Indonesian verbs never change: makan = ate / eat / will eat.
        To show time, put a small word before the verb, just like Egyptian «بـ» and «هـ»:
        sudah (already), belum (not yet), sedang (in the middle of), akan (will).
    grammar: id.aspect.markers
    examples:
      - text: Saya makan.
        ar_eg: أنا باكل / كلت. (حسب السياق)
        ar: آكل / أكلت. (بحسب السياق)
        en: I eat / I ate. (context decides)
  - title: Sudah? — Belum.
    body:
      ar_eg: |
        - sudah = خلاص / بالفعل: Saya sudah makan = كلت خلاص.
        - belum = لسه (ماحصلش): Saya belum makan = لسه ماكلتش.
        belum هي الرد المؤدب بدل tidak. لو حد سألك «Sudah menikah?» (اتجوزت؟) وإنت لأ، قول «Belum» (لسه)، مش «Tidak».
        و«Sudah makan?» في إندونيسيا تحية زي «عامل إيه»، مش عزومة!
        في الشات: sudah = sdh / udah، belum = blm.
      ar: |
        - sudah = قد: Saya sudah makan = قد أكلت.
        - belum = لمّا / ليس بعد: Saya belum makan = لم آكل بعد.
        وbelum هو الجواب المهذب بدل tidak: «Sudah menikah?» (هل تزوجت؟) — «Belum».
        و«Sudah makan?» تحية شائعة كـ«كيف حالك»، لا دعوة إلى طعام.
        وفي المحادثات: sdh / udah، وblm.
      en: |
        - sudah = already: Saya sudah makan = I've eaten.
        - belum = not yet: Saya belum makan = I haven't eaten yet.
        belum is the polite answer instead of tidak: "Sudah menikah?" (Are you married?) — "Belum" (not yet), never a flat "Tidak".
        "Sudah makan?" is a greeting in Indonesia, like "how are you" — not an invitation!
        In chats: sdh / udah, blm.
    grammar: id.aspect.markers
    examples:
      - text: Kamu sudah makan? — Belum.
        ar_eg: كلت؟ — لسه.
        ar: هل أكلت؟ — ليس بعد.
        en: Have you eaten? — Not yet.
      - text: Sudah menikah? — Belum.
        ar_eg: إنت متجوز؟ — لسه.
        ar: هل أنت متزوج؟ — ليس بعد.
        en: Are you married? — Not yet.
  - title: Sedang / lagi · Akan / mau
    body:
      ar_eg: |
        sedang = «في النص»، بيعمل الحاجة دلوقتي، زي «بـ» في «بقرا».
        في الكلام العادي بيقولوا lagi بدلها.
        akan = «هـ» (المستقبل): Saya akan pergi besok = هسافر بكرة.
        في الكلام العادي بيقولوا mau، زي «ناوي».
      ar: |
        sedang = يفعل الآن، في أثناء الفعل.
        وفي العامية تُقال lagi بدلًا منها.
        akan = سـ / سوف: Saya akan pergi besok = سأذهب غدًا.
        وفي العامية تُستعمل mau.
      en: |
        sedang = in the middle of doing it, right now — like Egyptian «بـ» in «بقرا».
        Casual speech uses lagi instead.
        akan = will / going to: Saya akan pergi besok = I'll leave tomorrow.
        Everyday speech often uses mau instead.
    grammar: id.aspect.markers
    examples:
      - text: Saya sedang membaca buku.
        ar_eg: أنا بقرا كتاب دلوقتي.
        ar: أنا أقرأ كتابًا الآن.
        en: I'm reading a book.
      - text: Aku lagi makan.
        ar_eg: أنا باكل دلوقتي. (عامية)
        ar: آكل الآن. (عامية)
        en: I'm eating. (casual)
      - text: Saya akan pergi besok.
        ar_eg: همشي بكرة.
        ar: سأذهب غدًا.
        en: I'll leave tomorrow.
  - title: Masih, baru
    body:
      ar_eg: |
        - masih = لسه (مستمر): Dia masih tidur = لسه نايم.
        - baru = لسه حالًا: Saya baru datang = لسه جاي حالًا.
        خلي بالك: «لسه» المصرية ليها ٣ ترجمات! لسه ماكلتش = belum، لسه نايم = masih، لسه جاي = baru.
      ar: |
        - masih = ما زال: Dia masih tidur = ما زال نائمًا.
        - baru = للتو: Saya baru datang = وصلت للتو.
        انتبه: «لسه» المصرية تقابل ثلاث كلمات: belum (لم … بعد)، masih (ما زال)، baru (للتو).
      en: |
        - masih = still: Dia masih tidur = He's still asleep.
        - baru = just: Saya baru datang = I've just arrived.
        Heads-up: Egyptian «لسه» has three translations — not yet = belum, still = masih, just now = baru.
    grammar: id.aspect.markers
    examples:
      - text: Dia masih di kantor.
        ar_eg: لسه في المكتب.
        ar: ما زال في المكتب.
        en: He/She is still at the office.
exercises:
  - id: e01
    type: multiple_choice
    question: Kamu sudah makan?
    question_meaning:
      ar_eg: «أكلت؟» — الرد الصح إيه؟
      ar: «هل أكلت؟» — ما الجواب الصحيح؟
      en: '"Have you eaten?" — which answer is right?'
    options: ['Belum. Saya lapar.', 'Lagi. Saya lapar.', 'Sedang. Saya lapar.']
    answer: 0
    explain:
      ar_eg: الرد على sudah؟ بيكون Sudah أو Belum. lagi وsedang بييجوا قبل فعل.
      ar: جواب sudah؟ هو Sudah أو Belum، أما lagi وsedang فيسبقان فعلًا.
      en: Answer a sudah? question with Sudah or Belum; lagi and sedang go before a verb.
    words: [lapar, lagi, sedang]
  - id: e02
    type: listen
    text: Dia masih di kantor.
    options: ['Dia masih di kantor.', 'Dia sudah pergi ke kantor.', 'Dia akan pergi ke kantor.']
    answer: 0
    meaning:
      ar_eg: هو لسه في المكتب.
      ar: ما زال في المكتب.
      en: He's still at the office.
    words: [masih, kantor, pergi, akan]
  - id: e03
    type: fill_blank
    sentence: Saya lapar. Saya ___ makan sate.
    meaning:
      ar_eg: أنا جعان. هاكل سَتيه.
      ar: أنا جائع. سآكل الساتيه.
      en: I'm hungry. I'm going to eat satay.
    options: [akan, kantor, pergi]
    answers: [akan]
    words: [lapar, akan, sate]
  - id: e04
    type: match_pairs
    pairs:
      - text: sedang
        ar_eg: بيـ (دلوقتي)
        ar: يفعل الآن
        en: in the middle of (-ing)
      - text: lagi
        ar_eg: بيـ (عامية)
        ar: يفعل الآن (عامية)
        en: -ing (casual)
      - text: masih
        ar_eg: لسه (مستمر)
        ar: ما زال
        en: still
      - text: pergi
        ar_eg: يروح
        ar: يذهب
        en: go
      - text: lapar
        ar_eg: جعان
        ar: جائع
        en: hungry
      - text: kantor
        ar_eg: مكتب، شغل
        ar: مكتب
        en: office
    words: [sedang, lagi, masih, pergi, lapar, kantor]
  - id: e05
    type: listen
    text: Saya lagi makan sate.
    options: ['Saya lagi makan sate.', 'Saya akan makan sate.', 'Saya sudah makan sate.']
    answer: 0
    meaning:
      ar_eg: أنا باكل سَتيه دلوقتي.
      ar: آكل الساتيه الآن.
      en: I'm eating satay right now.
    words: [lagi, sate, akan]
  - id: e06
    type: speaking
    text: Saya lapar. Saya mau pergi makan sate.
    meaning:
      ar_eg: أنا جعان. عايز أروح آكل سَتيه.
      ar: أنا جائع. أريد أن أذهب لآكل الساتيه.
      en: I'm hungry. I want to go and eat satay.
    words: [lapar, pergi, sate]
  - id: e07
    type: fill_blank
    sentence: Ayah masih di kantor. Dia ___ bekerja.
    meaning:
      ar_eg: بابا لسه في المكتب. هو بيشتغل دلوقتي.
      ar: ما زال أبي في المكتب. إنه يعمل الآن.
      en: Dad is still at the office. He's working.
    options: [sedang, lapar, sate]
    answers: [sedang]
    words: [masih, kantor, sedang]
dialogue:
  title: Sudah makan?
  lines:
    - speaker: Raka
      text: Mohamed, kamu sudah makan?
      ar_eg: محمد، كلت؟
      ar: يا محمد، هل أكلت؟
      en: Mohamed, have you eaten?
    - speaker: Mohamed
      text: Belum. Aku masih di kantor.
      ar_eg: لسه. أنا لسه في المكتب.
      ar: ليس بعد. ما زلت في المكتب.
      en: Not yet. I'm still at the office.
    - speaker: Raka
      text: Aku lagi di Blok M. Aku mau makan sate.
      ar_eg: أنا في بلوك إم دلوقتي. هاكل ساتيه.
      ar: أنا الآن في بلوك إم. سآكل الساتيه.
      en: I'm at Blok M right now. I'm going to eat satay. (casual)
    - speaker: Mohamed
      text: Wah! Aku akan datang jam tujuh.
      ar_eg: الله! هاجي الساعة سبعة.
      ar: رائع! سآتي في السابعة.
      en: Oh! I'll come at seven.
    - speaker: Raka
      text: Oke, sampai jumpa!
      ar_eg: ماشي، أشوفك!
      ar: حسنًا، إلى اللقاء!
      en: OK, see you!
new_words:
  - word: sedang
    pos: adverb
    ar_eg: دلوقتي (في النص)
    ar: الآن (في أثناء الفعل)
    en: in the middle of (-ing)
  - word: lagi
    pos: adverb
    ar_eg: دلوقتي (عامية لـ sedang)
    ar: الآن (عامية)
    en: in the middle of (casual)
  - word: akan
    pos: adverb
    ar_eg: هـ (مستقبل)
    ar: سـ / سوف
    en: will, going to
  - word: masih
    pos: adverb
    ar_eg: لسه (مستمر)
    ar: ما زال
    en: still
  - word: pergi
    pos: verb
    ar_eg: يروح / يمشي
    ar: يذهب
    en: to go, to leave
  - word: lapar
    pos: adjective
    ar_eg: جعان
    ar: جائع
    en: hungry
  - word: kantor
    pos: noun
    ar_eg: مكتب (شغل)
    ar: مكتب
    en: office
  - word: sate
    pos: noun
    ar_eg: ساتيه (أسياخ لحمة مشوية)
    ar: ساتيه (أسياخ لحم مشوي)
    en: satay
