schema: kabar.lesson/v1
id: bipa2.u04.l07
language: id
title: Memasak dengan Bu Yanti
can_do:
  ar_eg: 'تطبخ مع حد: البطاطس والكرنب والطماطم والبابايا الخضرا، بالجرام والأوقية، والأخضر والبني.'
  ar: 'أن تطبخ مع أحد: البطاطس والملفوف والطماطم والبابايا الخضراء، بالغرام والأوقية، والأخضر والبنّي.'
  en: 'Cook with someone: potatoes, cabbage, tomatoes and green papaya, by the gram and ons, green and brown.'
slides:
  - title: Di dapur Bu Yanti
    body:
      ar_eg: |
        tomat = طماطم، kentang = بطاطس، kubis = كرنب.
        pepaya = بابايا: الناضجة بتتاكل فاكهة، والخضرا بيطبخوها!
        الوزن: gram وons وkilo. خلي بالك: في إندونيسيا 1 ons = 100 gram!
        hijau = أخضر، cokelat = بني (وكمان شوكولاتة!).
        في الشارع بيقولوا:
        - udah = sudah (خلاص، بقى)
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
      ar: |
        tomat = طماطم، kentang = بطاطس، kubis = ملفوف.
        pepaya = بابايا: الناضجة فاكهة، والخضراء تُطبخ!
        الوزن: gram وons وkilo. وانتبه: في إندونيسيا 1 ons = 100 gram!
        hijau = أخضر، cokelat = بنّي (وهي الشوكولاتة أيضًا!).
        في كلام الشارع:
        - udah = sudah (قد، بالفعل)
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
      en: |
        tomat = tomato, kentang = potato, kubis = cabbage.
        pepaya = papaya: ripe, it's a fruit; green, it gets cooked!
        Weight: gram, ons, kilo. Careful: in Indonesia 1 ons = 100 grams!
        hijau = green, cokelat = brown (and chocolate!).
        On the street:
        - udah = sudah (already)
        - banget = sekali (very), after the adjective just like sekali
    examples:
      - text: Satu ons sama dengan seratus gram.
        ar_eg: الأوقية = ١٠٠ جرام.
        ar: الأوقية تساوي مئة غرام.
        en: One ons equals a hundred grams.
      - text: Ibu memasak pepaya hijau.
        ar_eg: ماما بتطبخ بابايا خضرا.
        ar: تطبخ أمي بابايا خضراء.
        en: Mum is cooking green papaya.
      - text: Kentangnya cokelat dan enak.
        ar_eg: البطاطس بقت بني وطعمها حلو.
        ar: صارت البطاطس بنّية ولذيذة.
        en: The potatoes are brown and tasty.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tomat
        ar_eg: طماطم
        ar: طماطم
        en: tomato
      - text: kentang
        ar_eg: بطاطس
        ar: بطاطس
        en: potato
      - text: kubis
        ar_eg: كرنب
        ar: ملفوف
        en: cabbage
      - text: pepaya
        ar_eg: بابايا
        ar: بابايا
        en: papaya
    words: [tomat, kentang, kubis, pepaya]
  - id: e02
    type: match_pairs
    pairs:
      - text: gram
        ar_eg: جرام
        ar: غرام
        en: gram
      - text: ons
        ar_eg: ١٠٠ جرام
        ar: ١٠٠ غرام
        en: 100 grams
      - text: hijau
        ar_eg: أخضر
        ar: أخضر
        en: green
      - text: cokelat
        ar_eg: بني؛ شوكولاتة
        ar: بنّي؛ شوكولاتة
        en: brown; chocolate
    words: [gram, ons, hijau, cokelat]
  - id: e03
    type: listen
    text: Saya minta dua ons tomat, ya.
    question:
      ar_eg: عايزة قد إيه طماطم؟
      ar: كم تريد من الطماطم؟
      en: How many tomatoes does she want?
    options: [٢٠٠ جرام, ٢ كيلو, ٢٠ جرام]
    answer: 0
    meaning:
      ar_eg: عايزة ٢ أوقية طماطم لو سمحت.
      ar: أريد أوقيتين من الطماطم من فضلك.
      en: Two ons of tomatoes, please.
    words: [ons, tomat]
  - id: e04
    type: fill_blank
    sentence: Satu ons sama dengan seratus ___.
    meaning:
      ar_eg: الأوقية = ١٠٠ ___.
      ar: الأوقية تساوي مئة ___.
      en: One ons equals a hundred ___.
    options: [gram, kentang, hijau]
    answers: [gram]
    words: [gram, ons, kentang, hijau]
    explain:
      ar_eg: ons في إندونيسيا = ١٠٠ gram. kentang بطاطس وhijau أخضر.
      ar: الأوقية (ons) في إندونيسيا = ١٠٠ gram. أما kentang فبطاطس وhijau أخضر.
      en: In Indonesia one ons is 100 gram. kentang is potato, hijau green.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: فاكهة كبيرة جوّاها برتقاني، والخضرا منها بتتطبخ.
      ar: فاكهة كبيرة برتقالية من الداخل، والخضراء منها تُطبخ.
      en: A big fruit, orange inside; the green ones get cooked.
    options: [pepaya, kubis, tomat]
    answer: 0
    explain:
      ar_eg: pepaya = بابايا. kubis كرنب، وtomat طماطم.
      ar: pepaya بابايا، أما kubis فملفوف وtomat طماطم.
      en: pepaya = papaya; kubis is cabbage and tomat a tomato.
    words: [pepaya, kubis, tomat]
  - id: e06
    type: fill_blank
    sentence: Kubis ini warnanya ___.
    meaning:
      ar_eg: الكرنب ده لونه ___.
      ar: لون هذا الملفوف ___.
      en: This cabbage is ___.
    options: [hijau, cokelat, gram]
    answers: [hijau]
    words: [hijau, cokelat, kubis]
    explain:
      ar_eg: الكرنب لونه hijau (أخضر). cokelat بني، وgram وحدة وزن.
      ar: الملفوف hijau (أخضر). أما cokelat فبني وgram وحدة وزن.
      en: Cabbage is hijau (green). cokelat is brown, gram a weight.
  - id: e07
    type: build_sentence
    source:
      ar_eg: ماما بتطبخ بطاطس وكرنب.
      ar: تطبخ أمي بطاطس وملفوفًا.
      en: Mum is cooking potatoes and cabbage.
    answer: Ibu memasak kentang dan kubis.
    distractors: [gram, pepaya]
    words: [kentang, kubis]
    explain:
      ar_eg: memasak = بيطبخ، وkentang dan kubis = بطاطس وكرنب. gram وpepaya زيادة.
      ar: memasak = يطبخ، وkentang dan kubis = البطاطس والملفوف. أما gram وpepaya فزائدتان.
      en: memasak = cook, kentang dan kubis = potatoes and cabbage. gram and pepaya don't fit.
  - id: e08
    type: translate
    direction: from_target
    source_text: Saya suka cokelat, warna dan makanannya!
    answers_meaning:
      ar_eg: [بحب البني والشوكولاتة، اللون والأكل!, بحب cokelat، اللون والأكلة!]
      ar: [أحبّ cokelat، اللون والحلوى!, أحبّ البنّي والشوكولاتة!]
      en: ['I love cokelat, the colour and the food!', I like brown and chocolate!]
    words: [cokelat]
  - id: e09
    type: speaking
    text: Saya mau lima ratus gram tomat dan satu pepaya.
    meaning:
      ar_eg: عايز خمسمية جرام طماطم وبابايا واحدة.
      ar: أريد خمسمئة غرام طماطم وبابايا واحدة.
      en: I'd like five hundred grams of tomatoes and one papaya.
    words: [gram, tomat, pepaya]
  - id: e10
    type: multiple_choice
    question: Tomat ini belum merah. Warnanya masih ___.
    options: [hijau, cokelat, kuning]
    answer: 0
    explain:
      ar_eg: 'الطماطم اللي لسه ما استوتش خضرا: hijau.'
      ar: 'الطماطم غير الناضجة خضراء: hijau.'
      en: 'An unripe tomato is green: hijau.'
    words: [hijau, cokelat]
dialogue:
  lines:
    - speaker: Bu Yanti
      text: Mohamed, kita memasak, yuk!
      ar_eg: يلا يا محمد نطبخ!
      ar: هيّا يا محمد نطبخ!
      en: Mohamed, let's cook!
    - speaker: Mohamed
      text: Ya, Bu! Kita perlu apa?
      ar_eg: ماشي يا طنط! محتاجين إيه؟
      ar: حسنًا يا سيدتي! ماذا نحتاج؟
      en: OK! What do we need?
    - speaker: Bu Yanti
      text: Kentang, kubis, dan dua ons tomat.
      ar_eg: بطاطس وكرنب و٢ أوقية طماطم.
      ar: بطاطس وملفوفًا وأوقيتين من الطماطم.
      en: Potatoes, cabbage and two ons of tomatoes.
    - speaker: Mohamed
      text: Pepaya hijau ini juga?
      ar_eg: والبابايا الخضرا دي كمان؟
      ar: وهذه البابايا الخضراء أيضًا؟
      en: This green papaya too?
    - speaker: Bu Yanti
      text: Ya! Pepaya hijau enak banget.
      ar_eg: أيوه! البابايا الخضرا حلوة أوي.
      ar: نعم! البابايا الخضراء لذيذة جدًا.
      en: Yes! Green papaya is delicious.
    - speaker: Mohamed
      text: Bu, kentangnya udah cokelat!
      ar_eg: يا طنط، البطاطس بقت بني!
      ar: يا سيدتي، صارت البطاطس بنّية!
      en: The potatoes have gone brown!
