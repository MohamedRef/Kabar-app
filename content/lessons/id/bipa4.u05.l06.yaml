schema: kabar.lesson/v1
id: bipa4.u05.l06
language: id
title: Salat Id di Karebosi
can_do:
  ar_eg: 'تحكي عن العيد في ماكاسار: صلاة العيد، الصدقة، ولمّة العيلة.'
  ar: 'أن تحكي عن العيد في ماكاسار: صلاة العيد والصدقة واجتماع العائلة.'
  en: 'Talk about Eid in Makassar: the Eid prayer, charity and the family getting together.'
slides:
  - title: Hari raya untuk semua
    body:
      ar_eg: |
        imam = إمام، rangkaian = سلسلة (rangkaian acara = برنامج الاحتفال كله)، amal = عمل خير، صدقة.
        berpartisipasi = يشارك، menyatukan = يجمع ويوحّد، kesatuan = وحدة (Negara Kesatuan Republik Indonesia).
        kedamaian = السلام والهدوء، tercinta = الغالي، الحبيب (keluarga tercinta).
      ar: |
        imam = إمام، rangkaian = سلسلة (rangkaian acara = برنامج الفعاليات)، amal = عمل خيري، صدقة.
        berpartisipasi = يشارك، menyatukan = يوحّد ويجمع، kesatuan = وحدة (Negara Kesatuan Republik Indonesia).
        kedamaian = السلام والسكينة، tercinta = الحبيب، الغالي (keluarga tercinta).
      en: |
        imam = imam, rangkaian = series (rangkaian acara = programme of events), amal = charity, good deeds.
        berpartisipasi = to take part, menyatukan = to unite, bring together; kesatuan = unity (Negara Kesatuan Republik Indonesia).
        kedamaian = peace, calm; tercinta = beloved, dear (keluarga tercinta).
    examples:
      - text: Imam memimpin salat Id di Lapangan Karebosi.
        ar_eg: الإمام بيصلّي بالناس صلاة العيد في ميدان كاريبوسي.
        ar: يؤمّ الإمام صلاة العيد في ساحة كاريبوسي.
        en: The imam leads the Eid prayer at Karebosi Field.
      - text: Lebaran menyatukan keluarga yang tinggal jauh.
        ar_eg: العيد بيلمّ العيلة اللي ساكنة بعيد.
        ar: يجمع العيد شمل العائلة التي تسكن بعيدًا.
        en: Eid brings together family who live far away.
      - text: Banyak orang berpartisipasi dalam kegiatan amal.
        ar_eg: ناس كتير بتشارك في أعمال الخير.
        ar: يشارك كثيرون في الأعمال الخيرية.
        en: Many people take part in charity activities.
