dialogue:
  lines:
    - speaker: Andi
      text: Mohamed, besok salat Id di Lapangan Karebosi. Imamnya ulama terkenal.
      ar_eg: يا محمد، بكرة صلاة العيد في ميدان كاريبوسي. والإمام شيخ مشهور.
      ar: يا محمد، غدًا صلاة العيد في ساحة كاريبوسي، وإمامها عالم مشهور.
      en: Mohamed, tomorrow's Eid prayer is at Karebosi Field. The imam is a famous scholar.
    - speaker: Mohamed
      text: Insya Allah aku datang. Habis itu ada acara apa?
      ar_eg: إن شاء الله هاجي. وبعدها فيه إيه؟
      ar: سآتي إن شاء الله. وماذا بعد ذلك؟
      en: God willing, I'll come. What's on after that?
    - speaker: Andi
      text: 'Rangkaian acaranya panjang: makan-makan, lalu acara amal untuk warga yang kurang mampu.'
      ar_eg: 'البرنامج طويل: أكل مع بعض، وبعدين نشاط خيري للناس الغلابة.'
      ar: 'الفعاليات طويلة: طعام جماعي، ثم نشاط خيري للمحتاجين.'
      en: 'There''s a long programme: a meal together, then a charity event for people in need.'
    - speaker: Mohamed
      text: Aku mau berpartisipasi. Di Mesir juga ada acara kayak gitu.
      ar_eg: عايز أشارك. في مصر كمان فيه عادة زي دي.
      ar: أريد أن أشارك. في مصر أيضًا عادة كهذه.
      en: I want to take part. Egypt has a custom like that too.
    - speaker: Andi
      text: Mantap! Lebaran emang menyatukan kita semua.
      ar_eg: حلو! العيد فعلًا بيلمّنا كلنا.
      ar: رائع! العيد حقًا يجمعنا كلنا.
      en: Great! Eid really brings us all together.
