schema: kabar.lesson/v1
id: bipa7.u02.l10
language: id
title: Langit dan laut malam
can_do:
  ar_eg: توصف ظواهر في السما والبحر وتشرح سببها ببساطة.
  ar: أن تصف ظواهر في السماء والبحر وتشرح سببها ببساطة.
  en: Describe sky and sea phenomena and explain their cause simply.
slides:
  - title: Fenomena yang bisa dilihat
    body:
      ar_eg: |
        gerhana matahari = كسوف الشمس. يوم 9 مارس 2016 حصل gerhana total في بالو وتيرنات.
        kulminasi = الشمس بتبقى فوق راسك بالظبط، ساعتها ييجي hari tanpa bayangan (يوم من غير ضل)، مرتين في السنة في إندونيسيا.
        hujan meteor = زخّة شهب. rasi bintang = كوكبة؛ الفلاحين في جاوة كانوا بيزرعوا على حسب ظهور Waluku (الجبّار).
        bioluminesensi = كائنات بتنوّر لوحدها، زي plankton (عوالق) اللي بيخلّي الموج يلمع أزرق بالليل.
        - في الكلام: bikin = membuat، banget = sekali، bentar = sebentar، tunjukin = tunjukkan، celupin = celupkan.
      ar: |
        gerhana matahari = كسوف الشمس. في 9 مارس 2016 وقع gerhana total في بالو وتيرناتي.
        kulminasi = تعامد الشمس فوق الرأس، فيحلّ hari tanpa bayangan (يوم انعدام الظلّ) مرّتين في السنة في إندونيسيا.
        hujan meteor = زخّة شهب. rasi bintang = كوكبة؛ كان فلّاحو جاوة يزرعون بحسب ظهور Waluku (الجبّار).
        bioluminesensi = كائنات تضيء ذاتيًّا، مثل plankton (العوالق) التي تجعل الموج يتلألأ أزرق ليلًا.
        - في الكلام اليومي: bikin = membuat، banget = sekali، bentar = sebentar، tunjukin = tunjukkan، celupin = celupkan.
      en: |
        gerhana matahari = solar eclipse. On 9 March 2016 a gerhana total crossed Palu and Ternate.
        kulminasi = the sun directly overhead, giving a hari tanpa bayangan (shadowless day) twice a year in Indonesia.
        hujan meteor = meteor shower. rasi bintang = constellation; Javanese farmers planted by the rise of Waluku (Orion).
        bioluminesensi = living things that make their own light, like plankton that make waves glow blue at night.
        - In speech: bikin = membuat, banget = sekali, bentar = sebentar, tunjukin = tunjukkan, celupin = celupkan.
    examples:
      - text: Pada hari tanpa bayangan, tiang bendera tidak punya bayangan.
        ar_eg: في اليوم اللي من غير ضل، صاري العلم مالوش ضل.
        ar: في يوم انعدام الظلّ لا يكون لسارية العلم ظلّ.
        en: On a shadowless day, the flagpole casts no shadow.
      - text: Malam ini ada hujan meteor di langit timur.
        ar_eg: الليلة فيه زخّة شهب في السما ناحية الشرق.
        ar: الليلة زخّة شهب في السماء الشرقية.
        en: There's a meteor shower in the eastern sky tonight.
      - text: Ombak bercahaya biru karena plankton.
        ar_eg: الموج بينوّر أزرق بسبب العوالق.
        ar: يتلألأ الموج بالأزرق بسبب العوالق.
        en: The waves glow blue because of plankton.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gerhana matahari
        ar_eg: كسوف الشمس
        ar: كسوف الشمس
        en: solar eclipse
      - text: gerhana total
        ar_eg: كسوف أو خسوف كلّي
        ar: كسوف أو خسوف كلّي
        en: total eclipse
      - text: hari tanpa bayangan
        ar_eg: يوم من غير ضل
        ar: يوم انعدام الظلّ
        en: shadowless day
      - text: kulminasi
        ar_eg: الشمس في أعلى نقطة / تعامد الشمس
        ar: تعامد الشمس، بلوغ الذروة
        en: culmination (sun directly overhead)
    words: [gerhana matahari, gerhana total, hari tanpa bayangan, kulminasi]
  - id: e02
    type: match_pairs
    pairs:
      - text: hujan meteor
        ar_eg: زخّة شهب
        ar: زخّة شهب
        en: meteor shower
      - text: rasi bintang
        ar_eg: كوكبة نجوم / برج
        ar: كوكبة نجمية
        en: constellation
      - text: bioluminesensi
        ar_eg: توهّج حيوي (كائنات بتنوّر)
        ar: تلألؤ حيوي
        en: bioluminescence
      - text: plankton
        ar_eg: عوالق / بلانكتون
        ar: عوالق
        en: plankton
    words: [hujan meteor, rasi bintang, bioluminesensi, plankton]
  - id: e03
    type: listen
    text: Petani dulu menanam padi ketika rasi bintang Waluku muncul.
    question:
      ar_eg: كانوا بيزرعوا إمتى؟
      ar: متى كانوا يزرعون؟
      en: When did they plant?
    options: [كوكبة نجوم, كسوف, زخّة شهب]
    answer: 0
    meaning:
      ar_eg: الفلاحين زمان كانوا بيزرعوا الرز لما كوكبة والوكو تظهر.
      ar: كان الفلّاحون قديمًا يزرعون الأرز حين تظهر كوكبة والوكو.
      en: Farmers used to plant rice when the Waluku constellation appeared.
    words: [rasi bintang]
  - id: e04
    type: fill_blank
    sentence: Matahari berada tepat di atas kepala saat ___.
    meaning:
      ar_eg: الشمس بتبقى فوق الراس بالظبط وقت الـ ___.
      ar: تكون الشمس فوق الرأس تمامًا وقت ___.
      en: The sun is right overhead at ___.
    options: [kulminasi, plankton, rasi bintang]
    answers: [kulminasi]
    words: [kulminasi, plankton, rasi bintang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي بيخلّي البحر ينوّر بالليل؟
      ar: ما الذي يجعل البحر يضيء ليلًا؟
      en: What makes the sea glow at night?
    options: [Hujan meteor yang jatuh ke laut., Gerhana matahari., Bioluminesensi dari plankton.]
    answer: 2
    explain:
      ar_eg: 'العوالق بتنوّر لوحدها: ده توهّج حيوي.'
      ar: العوالق تضيء ذاتيًّا، وهذا تلألؤ حيوي.
      en: 'Plankton make their own light: bioluminescence.'
    words: [bioluminesensi, plankton, hujan meteor, gerhana matahari]
  - id: e06
    type: fill_blank
    sentence: Saat ___, langit siang menjadi gelap seperti malam.
    meaning:
      ar_eg: وقت الـ ___، سما النهار بتضلم زي الليل.
      ar: عند ___ تصبح سماء النهار مظلمة كالليل.
      en: During a ___, the daytime sky goes dark like night.
    options: [gerhana total, hari tanpa bayangan, kulminasi]
    answers: [gerhana total]
    words: [gerhana total, hari tanpa bayangan, kulminasi]
  - id: e07
    type: build_sentence
    source:
      ar_eg: ما تبصّش للكسوف من غير نضّارة مخصوصة.
      ar: لا تنظر إلى الكسوف دون نظّارة خاصّة.
      en: Don't look at the eclipse without special glasses.
    answer: Jangan melihat gerhana matahari tanpa kacamata khusus.
    distractors: [meteor, bintang]
    words: [gerhana matahari]
  - id: e08
    type: translate
    direction: from_target
    source_text: Hari tanpa bayangan terjadi dua kali setahun di Indonesia.
    answers_meaning:
      ar_eg: [اليوم اللي من غير ضل بيحصل مرتين في السنة في إندونيسيا, يوم من غير ضل بييجي مرتين كل سنة في إندونيسيا]
      ar: [يحدث يوم انعدام الظلّ مرّتين في السنة في إندونيسيا, يقع يوم انعدام الظلّ مرّتين سنويًّا في إندونيسيا]
      en: [The shadowless day happens twice a year in Indonesia, Indonesia has a shadowless day twice a year]
    words: [hari tanpa bayangan]
  - id: e09
    type: speaking
    text: Kami menonton hujan meteor dan mencari rasi bintang.
    meaning:
      ar_eg: إحنا اتفرّجنا على زخّة الشهب ودوّرنا على الكوكبات.
      ar: شاهدنا زخّة الشهب وبحثنا عن الكوكبات.
      en: We watched the meteor shower and looked for constellations.
    words: [hujan meteor, rasi bintang]
  - id: e10
    type: multiple_choice
    question: Fenomena mana yang bisa dilihat di siang hari?
    options: [Gerhana total matahari., Hujan meteor., Bioluminesensi di ombak.]
    answer: 0
    explain:
      ar_eg: الكسوف بيحصل بالنهار؛ الشهب والتوهّج بنشوفهم بالليل.
      ar: الكسوف نهاري، أمّا الشهب والتلألؤ فليليّان.
      en: An eclipse is a daytime event; meteors and glowing waves are night ones.
    words: [gerhana total, hujan meteor, bioluminesensi, kulminasi, plankton]
dialogue:
  lines:
    - speaker: Pak Yance
      text: Malam ini kita naik perahu sebentar. Ada sesuatu yang harus kamu lihat.
      ar_eg: الليلة هنركب المركب شوية. فيه حاجة لازم تشوفها.
      ar: الليلة سنركب القارب قليلًا. هناك شيء يجب أن تراه.
      en: Tonight we'll take the boat out for a bit. There's something you have to see.
    - speaker: Mohamed
      text: Apa, Pak? Hujan meteor?
      ar_eg: إيه يا أستاذ؟ زخّة شهب؟
      ar: ما هو يا سيّدي؟ زخّة شهب؟
      en: What, sir? A meteor shower?
    - speaker: Pak Yance
      text: Bukan. Coba masukkan tanganmu ke air.
      ar_eg: لأ. جرّب تحطّ إيدك في المية.
      ar: لا. جرّب أن تغمس يدك في الماء.
      en: No. Try dipping your hand in the water.
    - speaker: Mohamed
      text: Wah, airnya jadi biru! Ini bioluminesensi?
      ar_eg: الله، المية بقت زرقا! ده التلألؤ الحيوي؟
      ar: يا للروعة، صار الماء أزرق! أهذا هو التلألؤ الحيوي؟
      en: Wow, the water's turned blue! Is this bioluminescence?
    - speaker: Pak Yance
      text: Betul. Plankton kecil banget yang bikin warna biru itu.
      ar_eg: مظبوط. بلانكتون صغير أوي هو اللي بيعمل اللون الأزرق ده.
      ar: صحيح. عوالق صغيرة جدًا تصنع هذا اللون الأزرق.
      en: Right. Tiny plankton make that blue.
    - speaker: Mohamed
      text: Di atas ada rasi bintang, di bawah ada laut yang biru. Luar biasa.
      ar_eg: فوق فيه كوكبات نجوم، وتحت فيه بحر أزرق. حاجة تجنن.
      ar: في الأعلى كوكبات، وفي الأسفل بحر أزرق. مذهل.
      en: Constellations above, a blue sea below. Amazing.
