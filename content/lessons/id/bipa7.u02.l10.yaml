id: bipa7.u02.l10
language: id
title: Ulangan Unit 2
can_do:
  ar_eg: تشرح ظاهرة طبيعية بالكتابة وفي عرض رسمي.
  ar: أن تشرح ظاهرة طبيعية كتابةً وفي عرض رسمي.
  en: Explain a natural phenomenon in writing and in a formal talk.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: memaparkan
        ar_eg: يعرض بالتفصيل
        ar: يعرض مفصّلًا
        en: to set out, to present
      - text: ekosistem
        ar_eg: نظام بيئي
        ar: نظام بيئي
        en: ecosystem
      - text: pemutihan
        ar_eg: ابيضاض
        ar: ابيضاض
        en: bleaching
      - text: persentase
        ar_eg: نسبة مئوية
        ar: نسبة مئوية
        en: percentage
      - text: tahapan
        ar_eg: مراحل
        ar: مراحل
        en: stages
    words: [memaparkan, ekosistem, pemutihan, persentase, tahapan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة بتأكّد على نقطة مهمة في عرض رسمي؟
      ar: أيّ جملة تؤكّد نقطة مهمّة في عرض رسمي؟
      en: Which sentence stresses a key point in a formal talk?
    options:
      - Pokoknya gitu deh.
      - Perlu digarisbawahi bahwa pemanasan global adalah penyebab utamanya.
      - Saya lupa poinnya.
    answer: 1
    words: [perlu digarisbawahi, pemanasan global, penyebab]
  - id: e03
    type: fill_blank
    sentence: Setelah pemutihan tahun 2020, karang di teluk ini mulai ___ diri.
    meaning:
      ar_eg: بعد ابيضاض 2020، المرجان في الخليج ده بدأ يتعافى.
      ar: بعد ابيضاض 2020 بدأ المرجان في هذا الخليج يتعافى.
      en: After the 2020 bleaching, the coral in this bay began to recover.
    options: [memulihkan, beralih, terbagi]
    answers: [memulihkan]
    words: [memulihkan, beralih, terbagi]
  - id: e04
    type: listen
    text: Arus membawa nutrisi, sehingga keanekaragaman hayati di sini sangat tinggi.
    question:
      ar_eg: ليه التنوّع البيولوجي عالي هنا؟
      ar: لماذا التنوّع الحيوي مرتفع هنا؟
      en: Why is biodiversity so high here?
    options:
      - علشان التيار بيجيب مغذّيات.
      - علشان المية ساكنة.
      - علشان مفيش غطّاسين.
    answer: 0
    words: [arus, nutrisi, keanekaragaman hayati]
  - id: e05
    type: build_sentence
    source:
      ar_eg: نسبة المرجان الحي فضلت ثابتة تقريبًا في المحمية.
      ar: ظلّت نسبة المرجان الحيّ مستقرّة نسبيًّا في المحمية.
      en: Live coral cover stayed fairly stable in the conservation area.
    answer: Persentase karang hidup relatif stabil di kawasan konservasi.
    distractors: [tajam, alga]
    words: [relatif stabil, kawasan konservasi]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي بيدّي المرجان لونه؟
      ar: ما الذي يمنح المرجان لونه؟
      en: What gives coral its colour?
    options: [arus, segitiga, alga]
    answer: 2
    words: [alga, arus, segitiga]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عدد السمك طلع بسرعة بعد ما نزل بشكل حاد.
      ar: ارتفع عدد الأسماك بحدّة بعد انخفاض شديد.
      en: The number of fish rose steeply after falling sharply.
    answers:
      - Jumlah ikan meningkat tajam setelah menurun drastis.
      - Setelah menurun drastis, jumlah ikan meningkat tajam.
      - Jumlah ikan meningkat tajam sesudah menurun drastis.
    words: [meningkat tajam, menurun drastis]
  - id: e08
    type: speaking
    text: Yang saya hormati hadirin, teks eksplanasi ini menjelaskan bagaimana terumbu terbentuk.
    meaning:
      ar_eg: حضرات الحضور المحترمين، النص التفسيري ده بيشرح إزاي الشعاب بتتكوّن.
      ar: حضرات الحضور الكرام، يشرح هذا النصّ التفسيري كيف تتكوّن الشعاب.
      en: Honoured guests, this explanation text explains how reefs form.
    words: [yang saya hormati, teks eksplanasi, terbentuk]
  - id: e09
    type: dictation
    text: Segitiga Terumbu Karang adalah ekosistem laut yang sangat kaya.
    meaning:
      ar_eg: مثلث الشعاب المرجانية نظام بيئي بحري غني جدًا.
      ar: مثلّث الشعاب المرجانية نظام بيئي بحري بالغ الغنى.
      en: The Coral Triangle is an extremely rich marine ecosystem.
    words: [segitiga, ekosistem]
  - id: e10
    type: translate
    direction: from_target
    source_text: Presentasi ini terbagi menjadi tiga tahapan, dari penyebab sampai pemulihan.
    answers_meaning:
      ar_eg:
        - العرض ده متقسّم لتلات مراحل، من السبب لحد التعافي.
        - العرض ده تلات أجزاء، من السبب للتعافي.
      ar:
        - ينقسم هذا العرض إلى ثلاث مراحل، من السبب إلى التعافي.
        - يتألّف العرض من ثلاث مراحل تمتدّ من السبب إلى التعافي.
      en:
        - This presentation is divided into three stages, from cause to recovery.
        - The talk has three stages, running from the cause to the recovery.
    words: [terbagi, tahapan, penyebab]
  - id: e11
    type: match_pairs
    pairs:
      - text: endemik
        ar_eg: متوطّن
        ar: مستوطن
        en: endemic
      - text: abrasi
        ar_eg: تآكل الشط
        ar: تآكل الساحل
        en: coastal erosion
      - text: lestari
        ar_eg: مستدام
        ar: مستدام
        en: sustainable
      - text: gugusan
        ar_eg: مجموعة جزر
        ar: أرخبيل
        en: cluster of islands
      - text: pembicara
        ar_eg: متكلّم
        ar: متحدّث
        en: speaker
    words: [endemik, abrasi, lestari, gugusan, pembicara]
  - id: e12
    type: multiple_choice
    question_meaning:
      ar_eg: '«Setelah tutup sasi, hasil laut bertambah.» ده مثال على إيه؟'
      ar: '«Setelah tutup sasi, hasil laut bertambah.» على أيّ شيء هذا مثال؟'
      en: '«Setelah tutup sasi, hasil laut bertambah.» What is this an example of?'
    options:
      - سبب ونتيجة.
      - مقارنة بين بلدين.
      - عنوان خبر.
    answer: 0
    explain:
      ar_eg: السبب قفل الساسي، والنتيجة إن خير البحر زاد. ده قلب نص الـ eksplanasi.
      ar: السبب إغلاق الساسي، والنتيجة ازدياد خيرات البحر، وهذا جوهر نصّ الـ eksplanasi.
      en: The cause is closing the sasi; the effect is more sea produce. That's the heart of an explanation text.
    words: [tutup sasi, hasil laut, teks eksplanasi]
dialogue:
  title: Tepuk tangan di Waisai
  lines:
    - speaker: Pak Yance
      text: Presentasimu jelas sekali. Kepala dinas minta salinan grafiknya.
      ar_eg: عرضك كان واضح جدًا. مدير الإدارة طلب نسخة من الرسم.
      ar: كان عرضك واضحًا جدًّا، وطلب رئيس الإدارة نسخة من الرسم.
      en: Your presentation was very clear. The head of the agency wants a copy of the chart.
    - speaker: Mohamed
      text: Terima kasih. Saya gugup waktu beralih ke bagian pemutihan.
      ar_eg: شكرًا. اتوترت لما انتقلت لجزء الابيضاض.
      ar: شكرًا. ارتبكت حين انتقلت إلى جزء الابيضاض.
      en: Thanks. I got nervous moving on to the bleaching part.
    - speaker: Pak Yance
      text: Tidak terlihat. Besok kita ke Arborek, desa kecil di atas pasir putih.
      ar_eg: ماكانش باين. بكرة هنروح أربوريك، قرية صغيرة على رمل أبيض.
      ar: لم يظهر ذلك. غدًا نذهب إلى أربوريك، قرية صغيرة على رمل أبيض.
      en: It didn't show. Tomorrow we go to Arborek, a little village on white sand.
    - speaker: Mohamed
      text: Kata orang, di sana banyak cerita rakyat. Saya tidak sabar.
      ar_eg: بيقولوا إن هناك حواديت شعبية كتير. مش قادر أستنى.
      ar: يُقال إنّ هناك حكايات شعبية كثيرة، ولا أطيق صبرًا.
      en: People say there are lots of folk tales there. I can't wait.
souvenir:
  id: bipa7.u02.souvenir
  title: Terumbu karang Raja Ampat
  note:
    ar_eg: راجا أمبات في قلب مثلث الشعاب المرجانية، وفيها أعلى تنوّع بيولوجي بحري اتسجّل على الكوكب. المسوح العلمية لقت فيها حوالي تلات أرباع أنواع المرجان الصلب المعروفة في العالم، وأكتر من ألف نوع سمك شعاب. اسمها معناه «الأربع ملوك»، على اسم أربع جزر كبيرة، Waigeo وBatanta وSalawati وMisool. والزوّار بيدفعوا رسم دخول بيساعد في حماية المحميات وأهلها.
    ar: تقع راجا أمبات في قلب مثلّث الشعاب المرجانية، وفيها أعلى تنوّع حيوي بحري سُجّل على الأرض. وجدت المسوح العلمية فيها نحو ثلاثة أرباع أنواع المرجان الصلب المعروفة في العالم، وأكثر من ألف نوع من أسماك الشعاب. ومعنى اسمها «الملوك الأربعة» نسبةً إلى أربع جزر كبرى هي Waigeo وBatanta وSalawati وMisool. ويدفع الزوّار رسم دخول يُسهم في حماية المحميات وسكّانها.
    en: Raja Ampat sits at the heart of the Coral Triangle and holds the highest marine biodiversity recorded on Earth. Scientific surveys found about three quarters of the world's known hard coral species there and more than a thousand reef fish species. Its name means "Four Kings", after four large islands, Waigeo, Batanta, Salawati and Misool. Visitors pay an entry fee that helps protect the marine areas and the people who live by them.
