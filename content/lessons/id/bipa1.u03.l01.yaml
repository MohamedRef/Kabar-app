  - word: ini
    pos: pronoun
    ar_eg: ده / دي (قريب)
    ar: هذا / هذه
    en: this, these
  - word: itu
    pos: pronoun
    ar_eg: ده / دي (بعيد)
    ar: ذلك / تلك
    en: that, those
  - word: keluarga
    pos: noun
    ar_eg: عيلة
    ar: عائلة
    en: family
  - word: ayah
    pos: noun
    ar_eg: أب، بابا
    ar: أب
    en: father
  - word: kakak
    pos: noun
    ar_eg: أخ / أخت أكبر
