schema: kabar.lesson/v1
id: bipa1.u03.l01
language: id
title: Ini keluarga saya
can_do:
  ar_eg: تعرّف أفراد عيلتك بـ ini وitu.
  ar: أن تعرّف بأفراد عائلتك باستعمال ini وitu.
  en: Introduce family members with ini / itu.
slides:
  - title: Ini dan itu
    body:
      ar_eg: |
        - ini = ده / دي / دول (قريب منك)
        - itu = ده / دي / دول (بعيد، أو حاجة اتكلمنا عنها)
        مافيش مذكر ومؤنث ولا جمع. ولو جت في أول الجملة بتبقى «ده …»: «Ini keluarga saya» = «دي عيلتي».
      ar: |
        - ini = هذا / هذه / هؤلاء (للقريب)
        - itu = ذلك / تلك / أولئك (للبعيد أو لما سبق ذكره)
        ولا تذكير ولا تأنيث ولا جمع. وإذا تصدّرت الجملة صارت «هذا …»: «Ini keluarga saya» = «هذه عائلتي».
      en: |
        - ini = this / these (near you)
        - itu = that / those (far away, or already mentioned)
        No gender, no plural. At the start of a sentence they mean "this is / that is": "Ini keluarga saya" = "This is my family".
    grammar: id.demonstrative.ini-itu
    examples:
      - text: Ini keluarga saya.
        ar_eg: دي عيلتي.
        ar: هذه عائلتي.
        en: This is my family.
      - text: Itu Pak Budi.
        ar_eg: ده الأستاذ بودي (هناك).
        ar: ذلك الأستاذ بودي.
        en: That's Pak Budi (over there).
  - title: Orang itu atau itu orang?
    body:
      ar_eg: |
        الترتيب بيفرق، والمصري هنا بيساعدك:
        - orang itu = «الراجل ده» (عبارة، ini / itu بعد الاسم)
        - Itu orang Mesir. = «ده واحد مصري.» (جملة كاملة، ini / itu في الأول)
        فـ«Orang itu siapa?» = «الراجل ده مين؟».
      ar: |
        الترتيب يغيّر المعنى، والعامية المصرية تساعدك:
        - orang itu = «ذلك الرجل» (عبارة، وini / itu بعد الاسم)
        - Itu orang Mesir. = «ذاك رجل مصري.» (جملة تامة، وini / itu في أولها)
        فـ«Orang itu siapa?» = «مَن ذلك الرجل؟».
      en: |
        Order matters, and Egyptian Arabic helps:
        - orang itu = "that person" (a phrase: ini / itu after the noun, like «الراجل ده»)
        - Itu orang Mesir. = "That's an Egyptian." (a sentence: ini / itu first)
        So "Orang itu siapa?" = "Who is that person?"
    grammar: id.demonstrative.ini-itu
    examples:
      - text: Orang itu kakak saya.
        ar_eg: الراجل ده أخويا الكبير.
        ar: ذلك الرجل أخي الأكبر.
        en: That man is my older brother.
      - text: Ibu ini guru saya.
        ar_eg: الست دي مدرّستي.
        ar: هذه السيدة معلّمتي.
        en: This lady is my teacher.
  - title: Ayah, ibu, kakak, adik
    body:
      ar_eg: |
        - ayah / bapak = الأب، ibu = الأم
        - suami = الجوز، istri = الزوجة (مرات فلان)، anak = ابن / بنت
        - kakak = أخ أو أخت أكبر منك، adik = أخ أو أخت أصغر منك.
        الإندونيسي بيسمّي الإخوات بالسن مش بالنوع! ولو عايز تحدد: kakak laki-laki = أخ كبير، adik perempuan = أخت صغيرة.
      ar: |
        - ayah / bapak = الأب، ibu = الأم
        - suami = الزوج، istri = الزوجة، anak = الابن / البنت
        - kakak = الأخ أو الأخت الأكبر، adik = الأخ أو الأخت الأصغر.
        فالإندونيسية تسمّي الإخوة بحسب السن لا الجنس، وللتحديد: kakak laki-laki = أخ أكبر، adik perempuan = أخت صغرى.
      en: |
        - ayah / bapak = father, ibu = mother
        - suami = husband, istri = wife, anak = child
        - kakak = older sibling, adik = younger sibling.
        Siblings are named by age, not gender! To be specific: kakak laki-laki = older brother, adik perempuan = younger sister.
    examples:
      - text: Ini adik saya, Bayu.
        ar_eg: ده أخويا الصغير، بايو.
        ar: هذا أخي الأصغر، بايو.
        en: This is my younger brother, Bayu.
      - text: Itu kakak perempuan saya.
        ar_eg: دي أختي الكبيرة.
        ar: تلك أختي الكبرى.
        en: That's my older sister.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ayah
        ar_eg: الأب
        ar: الأب
        en: father
      - text: ibu
        ar_eg: الأم
        ar: الأم
        en: mother
      - text: kakak
        ar_eg: أخ / أخت أكبر
        ar: الأخ / الأخت الأكبر
        en: older sibling
      - text: adik
        ar_eg: أخ / أخت أصغر
        ar: الأخ / الأخت الأصغر
        en: younger sibling
      - text: keluarga
        ar_eg: العيلة
        ar: العائلة
        en: family
    words: [ayah, ibu, kakak, adik, keluarga]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «دي عيلتي»؟
      ar: كيف تقول «هذه عائلتي»؟
      en: How do you say "This is my family"?
    options: [Saya keluarga ini., Keluarga ini saya., Ini keluarga saya.]
    answer: 2
    explain:
      ar_eg: ini في الأول = «دي …»، وبعدين keluarga saya = عيلتي (الحاجة وبعدين صاحبها).
      ar: ini في الصدر = «هذه …»، ثم keluarga saya = عائلتي (المضاف ثم المضاف إليه).
      en: Ini first = "this is", then keluarga saya = my family (thing, then owner).
    words: [ini, keluarga]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة معناها «الراجل ده» (عبارة مش جملة)؟
      ar: أيّها تعني «ذلك الرجل» (عبارة لا جملة)؟
      en: Which one means "that person" (a phrase, not a sentence)?
    options: [itu orang, orang siapa, orang itu]
    answer: 2
    explain:
      ar_eg: itu بعد الاسم = «الراجل ده». itu في الأول = «ده راجل».
      ar: itu بعد الاسم = «ذلك الرجل»، وفي الصدر = «ذاك رجل».
      en: itu after the noun = "that person"; itu first = "that is a person".
    words: [itu, orang]
  - id: e04
    type: listen
    text: Ini adik saya.
    options: [Ini kakak saya., Itu adik saya., Ini adik saya.]
    answer: 2
    words: [ini, adik]
  - id: e05
    type: fill_blank
    sentence: Dimas, ___ ayah saya.
    meaning:
      ar_eg: (أبوك واقف جنبك) يا ديماس، ده أبويا.
      ar: (أبوك يقف بجانبك) يا ديماس، هذا أبي.
      en: (your father is right next to you) Dimas, this is my father.
    options: [siapa, itu, ini]
    answers: [ini]
    explain:
      ar_eg: قريب منك يبقى ini.
      ar: القريب يشار إليه بـ ini.
      en: Near you means ini.
    words: [ini, ayah]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الست دي مين؟
      ar: مَن هذه السيدة؟
      en: Who is this lady?
    answer: Ibu ini siapa?
    alternatives: ['Siapa ibu ini?']
    distractors: [itu, apa]
    words: [ini, siapa]
  - id: e07
    type: dictation
    text: Ini keluarga saya.
    meaning:
      ar_eg: دي عيلتي.
      ar: هذه عائلتي.
      en: This is my family.
    words: [ini, keluarga]
  - id: e08
    type: speaking
    text: Ini ayah saya, dan itu ibu saya.
    meaning:
      ar_eg: ده أبويا، ودي (هناك) أمي.
      ar: هذا أبي، وتلك أمي.
      en: This is my father, and that's my mother.
    words: [ini, itu, ayah, ibu]
dialogue:
  title: Rumah Rina di Cikini
  lines:
    - speaker: Rina
      text: Mohamed, ini keluarga saya.
      ar_eg: يا محمد، دي عيلتي.
      ar: يا محمد، هذه عائلتي.
      en: Mohamed, this is my family.
    - speaker: Mohamed
      text: Selamat sore, Pak, Bu!
      ar_eg: مساء الخير يا عمو، يا طنط!
      ar: مساء الخير يا سيدي، يا سيدتي!
      en: Good afternoon, sir, ma'am!
    - speaker: Rina
      text: Ini ayah saya, dan ini ibu saya.
      ar_eg: ده بابا، ودي ماما.
      ar: هذا أبي، وهذه أمي.
      en: This is my father, and this is my mother.
    - speaker: Ibu Rina
      text: Selamat datang, Mohamed!
      ar_eg: أهلًا بيك يا محمد!
      ar: أهلًا وسهلًا بك يا محمد!
      en: Welcome, Mohamed!
    - speaker: Mohamed
      text: Terima kasih, Bu. Rina, itu siapa?
      ar_eg: شكرًا يا طنط. يا رينا، ده مين؟
      ar: شكرًا يا سيدتي. يا رينا، مَن ذاك؟
      en: Thank you, ma'am. Rina, who's that?
    - speaker: Rina
      text: Itu adik saya, Bayu. Dia mahasiswa.
      ar_eg: ده أخويا الصغير بايو. هو طالب.
      ar: ذاك أخي الأصغر بايو، وهو طالب جامعي.
      en: That's my younger brother, Bayu. He's a student.
