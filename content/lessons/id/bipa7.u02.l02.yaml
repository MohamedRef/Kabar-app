language: id
title: Segitiga Terumbu Karang
can_do:
  ar_eg: تقرا شرح علمي عن ظاهرة طبيعية وتفهم السبب والنتيجة.
  ar: أن تقرأ شرحًا علميًّا لظاهرة طبيعية وتفهم السبب والنتيجة.
  en: Read a scientific explanation of a natural phenomenon and follow cause and effect.
slides:
  - title: Jantung laut dunia
    body:
      ar_eg: |
        اقرا (مكتوب للدرس، والأرقام تقريبية):
        Raja Ampat terletak di jantung Segitiga Terumbu Karang, kawasan laut yang meliputi enam negara: Indonesia, Malaysia, Filipina, Papua Nugini, Timor-Leste, dan Kepulauan Solomon. Keanekaragaman hayati lautnya tercatat paling tinggi di dunia. Mengapa? Arus laut yang kuat membawa larva karang dan nutrisi dari Samudra Pasifik ke Samudra Hindia. Akibatnya, ekosistem terumbu karang di sini sangat kaya. Lebih dari dua juta hektare perairannya kini menjadi kawasan konservasi.
        - keanekaragaman hayati = التنوّع البيولوجي، ekosistem = نظام بيئي، arus = تيار
        - segitiga = مثلث، kawasan konservasi = محمية
      ar: |
        اقرأ (نصّ مكتوب للدرس، والأرقام تقريبية):
        Raja Ampat terletak di jantung Segitiga Terumbu Karang, kawasan laut yang meliputi enam negara: Indonesia, Malaysia, Filipina, Papua Nugini, Timor-Leste, dan Kepulauan Solomon. Keanekaragaman hayati lautnya tercatat paling tinggi di dunia. Mengapa? Arus laut yang kuat membawa larva karang dan nutrisi dari Samudra Pasifik ke Samudra Hindia. Akibatnya, ekosistem terumbu karang di sini sangat kaya. Lebih dari dua juta hektare perairannya kini menjadi kawasan konservasi.
        - keanekaragaman hayati = التنوّع الحيوي، ekosistem = نظام بيئي، arus = تيّار
        - segitiga = مثلّث، kawasan konservasi = محمية طبيعية
      en: |
        Read (written for the lesson; figures are approximate):
        Raja Ampat terletak di jantung Segitiga Terumbu Karang, kawasan laut yang meliputi enam negara: Indonesia, Malaysia, Filipina, Papua Nugini, Timor-Leste, dan Kepulauan Solomon. Keanekaragaman hayati lautnya tercatat paling tinggi di dunia. Mengapa? Arus laut yang kuat membawa larva karang dan nutrisi dari Samudra Pasifik ke Samudra Hindia. Akibatnya, ekosistem terumbu karang di sini sangat kaya. Lebih dari dua juta hektare perairannya kini menjadi kawasan konservasi.
        - keanekaragaman hayati = biodiversity, ekosistem = ecosystem, arus = current
        - segitiga = triangle, kawasan konservasi = conservation area
