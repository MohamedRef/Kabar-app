dialogue:
  title: Sebelum menyelam
  lines:
    - speaker: Pak Yance
      text: Hati-hati, arus di selat ini kuat sekali hari ini.
      ar_eg: خلّي بالك، التيار في المضيق ده قوي جدًا النهارده.
      ar: احترس، فالتيّار في هذا المضيق قويّ جدًّا اليوم.
      en: Careful, the current in this strait is very strong today.
    - speaker: Mohamed
      text: Arus kuat itu berbahaya, tetapi juga membawa makanan untuk karang, kan?
      ar_eg: التيار القوي ده خطر، بس كمان بيجيب أكل للمرجان، صح؟
      ar: التيّار القويّ خطر، لكنّه يحمل الغذاء للمرجان أيضًا، أليس كذلك؟
      en: A strong current is dangerous, but it also brings food for the coral, right?
    - speaker: Pak Yance
      text: Betul. Karena itu keanekaragaman hayati di sini luar biasa.
      ar_eg: صح. علشان كده التنوّع البيولوجي هنا مش طبيعي.
      ar: صحيح، ولهذا فالتنوّع الحيوي هنا مذهل.
      en: Right. That's why the biodiversity here is extraordinary.
    - speaker: Mohamed
      text: Dan semua ini kawasan konservasi?
      ar_eg: وكل ده محمية؟
      ar: وهل كلّ هذا محمية؟
      en: And all of this is a conservation area?
    - speaker: Pak Yance
      text: Sebagian besar. Penyelam membayar tiket untuk ikut menjaganya.
      ar_eg: أغلبه. الغطّاسين بيدفعوا تذكرة عشان يساهموا في حمايته.
      ar: معظمه، ويدفع الغوّاصون رسمًا ليسهموا في حمايته.
      en: Most of it. Divers pay a fee to help protect it.
