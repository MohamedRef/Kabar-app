        ar_eg: لابس
        ar: يرتدي
        en: dressed
    words: [ritual, ditetapkan, menyalakan, berpakaian]
  - id: e03
    type: listen
    text: Festival ini diadakan setiap tahun di bulan Februari.
    question:
      ar_eg: المهرجان بيتعمل إمتى؟
      ar: متى يُقام المهرجان؟
      en: When is the festival held?
    options: [كل سنة, كل شهر, مرة واحدة بس]
    answer: 0
    meaning:
      ar_eg: المهرجان ده بيتعمل كل سنة في شهر فبراير.
      ar: يُقام هذا المهرجان كل عام في فبراير.
      en: This festival is held every year in February.
    words: [festival]
  - id: e04
    type: fill_blank
    sentence: Malam ini bulan ___. Langit terang sekali.
    meaning:
      ar_eg: الليلة القمر ___. السما منوّرة خالص.
      ar: الليلة القمر ___. السماء مضيئة جدًا.
      en: Tonight the moon is ___. The sky is very bright.
    options: [purnama, tahunan, ritual]
    answers: [purnama]
    words: [purnama, tahunan, ritual]
    explain:
      ar_eg: bulan purnama = بدر، والسما بتنوّر. tahunan = سنوي، وritual = طقس.
      ar: bulan purnama = البدر، ولذلك يضيء السماء. أما tahunan فسنوي، وritual طقس.
      en: bulan purnama is the full moon, which lights the sky. tahunan is annual, and ritual is a rite.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حفلة بتتعمل مرة كل سنة. بتتقال إزاي؟
      ar: احتفال يُقام مرة كل عام. كيف يُقال؟
      en: A celebration held once a year. How do you say it?
    options: [acara ritual, acara tahunan, acara purnama]
    answer: 1
    explain:
      ar_eg: tahunan = سنوي.
      ar: tahunan = سنوي.
      en: tahunan = annual.
    words: [ritual, tahunan, purnama]
  - id: e06
    type: fill_blank
    sentence: Ayo ___ lampu. Sudah gelap.
    meaning:
      ar_eg: يلا ___ النور. الدنيا ضلمت.
      ar: هيا ___ الضوء. لقد أظلم.
      en: Let's ___ the light. It's dark already.
    options: [nyalakan, tetapkan, pakai]
    answers: [nyalakan]
    words: [menyalakan, ditetapkan, berpakaian]
    explain:
      ar_eg: nyalakan = ولّع، وده اللي بتعمله في النور لما الدنيا تضلّم. tetapkan = حدّد، وpakai = البس أو استعمل.
      ar: nyalakan = أشعل، وهذا ما تفعله بالمصباح عند الظلام. أما tetapkan فحدّد، وpakai استعمل.
      en: nyalakan means switch on, which you do when it's dark. tetapkan is "set", and pakai is "use" or "wear".
  - id: e07
    type: multiple_choice
    question: Tanggal hari libur ___ oleh pemerintah.
    options: [berpakaian, menyalakan, ditetapkan]
    answer: 2
    explain:
      ar_eg: ditetapkan oleh = اتحدد من.
      ar: ditetapkan oleh = حُدّد من قِبَل.
      en: ditetapkan oleh = officially set by.
    words: [berpakaian, menyalakan, ditetapkan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الرقصة دي طقس قديم.
      ar: هذه الرقصة طقس قديم.
      en: This dance is an old ritual.
    answer: Tarian ini adalah ritual lama.
    distractors: [festival, purnama]
    words: [tarian, ritual, festival, purnama]
    explain:
      ar_eg: ritual lama = طقس قديم، والرقصة دي طقس. festival = مهرجان، وpurnama = بدر.
      ar: ritual lama = طقس قديم، والرقصة طقس. أما festival فالمهرجان، وpurnama البدر.
      en: ritual lama is an old rite, which the dance is. festival is a festival, and purnama is the full moon.
  - id: e09
    type: translate
    direction: from_target
    source_text: Semua penari berpakaian merah di festival itu.
    answers_meaning:
      ar_eg: [كل الراقصين لابسين أحمر في المهرجان ده, في المهرجان ده كل الرقاصين لابسين أحمر]
      ar: [يرتدي كل الراقصين الأحمر في ذلك المهرجان, كان جميع الراقصين في ذلك المهرجان بالأحمر]
      en: [All the dancers are dressed in red at that festival, Every dancer at the festival wears red]
    words: [berpakaian, festival]
  - id: e10
    type: speaking
    text: Festival tahunan ini punya tarian dan ritual yang indah.
    meaning:
      ar_eg: المهرجان السنوي ده فيه رقص وطقوس حلوة.
      ar: في هذا المهرجان السنوي رقصات وطقوس جميلة.
      en: This annual festival has beautiful dances and rituals.
    words: [festival, tahunan, tarian, ritual, ditetapkan]
dialogue:
  lines:
    - speaker: Andi Tenri
      text: Mohamed, malam ini Cap Go Meh di Jalan Sulawesi. Mau lihat?
      ar_eg: يا محمد، الليلة كاب جو ميه في شارع سولاويزي. تيجي تتفرج؟
      ar: يا محمد، الليلة احتفال كاب غو ميه في شارع سولاويسي. أتريد المشاهدة؟
      en: Mohamed, it's Cap Go Meh on Jalan Sulawesi tonight. Want to see it?
    - speaker: Mohamed
      text: Mau! Itu festival tahunan, ya?
      ar_eg: آه! ده مهرجان سنوي، صح؟
      ar: نعم! إنه مهرجان سنوي، أليس كذلك؟
      en: Yes! It's an annual festival, right?
    - speaker: Andi Tenri
      text: Iya, pas malam bulan purnama. Ada tarian barongsai dan ritual di kelenteng.
      ar_eg: أيوه، في ليلة البدر. فيه رقصة الأسد وطقوس في المعبد.
      ar: نعم، في ليلة البدر. فيه رقصة الأسد وطقوس في المعبد الصيني.
      en: Yes, on the full-moon night. There's a lion dance and rituals at the temple.
    - speaker: Mohamed
      text: Orang-orang juga menyalakan lampion?
      ar_eg: والناس بينوّروا فوانيس كمان؟
      ar: وهل يُضيء الناس الفوانيس أيضًا؟
      en: Do people light lanterns too?
    - speaker: Andi Tenri
      text: Iya, dan banyak yang berpakaian merah. Mereka percaya merah bawa untung.
      ar_eg: أيوه، وناس كتير بتلبس أحمر. بيآمنوا إن الأحمر بيجيب الحظ.
      ar: نعم، وكثيرون يرتدون الأحمر. يعتقدون أن الأحمر يجلب الحظ.
      en: Yes, and lots wear red. They believe red brings luck.
