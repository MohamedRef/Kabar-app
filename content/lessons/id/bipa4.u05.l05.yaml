schema: kabar.lesson/v1
id: bipa4.u05.l05
language: id
title: Malam purnama di Makassar
can_do:
  ar_eg: 'توصف احتفال سنوي: الرقص والطقوس والفوانيس واللبس.'
  ar: 'أن تصف احتفالًا سنويًا: الرقص والطقوس والفوانيس والملابس.'
  en: 'Describe an annual celebration: dances, rituals, lanterns and clothes.'
slides:
  - title: Cap Go Meh
    body:
      ar_eg: |
        festival = مهرجان، tahunan = سنوي (festival tahunan)، purnama = البدر، القمر الكامل (bulan purnama).
        tarian = رقصة، ritual = طقس، شعيرة، ditetapkan = اتحدد رسميًا (ditetapkan oleh pemerintah).
        menyalakan = يولّع، ينوّر (menyalakan lampion)، berpakaian = لابس (berpakaian merah = لابس أحمر).
      ar: |
        festival = مهرجان، tahunan = سنوي (festival tahunan)، purnama = البدر (bulan purnama).
        tarian = رقصة، ritual = طقس، شعيرة، ditetapkan = حُدّد رسميًا (ditetapkan oleh pemerintah).
        menyalakan = يُشعل، يُضيء (menyalakan lampion)، berpakaian = يرتدي (berpakaian merah = يرتدي الأحمر).
      en: |
        festival = festival, tahunan = annual (festival tahunan), purnama = full moon (bulan purnama).
        tarian = dance, ritual = ritual, ditetapkan = officially set (ditetapkan oleh pemerintah).
        menyalakan = to light, switch on (menyalakan lampion), berpakaian = dressed (berpakaian merah = dressed in red).
    examples:
      - text: Cap Go Meh dirayakan pada malam bulan purnama.
        ar_eg: كاب جو ميه بيتحتفل بيه في ليلة البدر.
        ar: يُحتفل بكاب غو ميه في ليلة البدر.
        en: Cap Go Meh is celebrated on the night of the full moon.
      - text: Warga menyalakan lampion di depan rumah.
        ar_eg: الناس بينوّروا الفوانيس قدام البيوت.
        ar: يُضيء السكان الفوانيس أمام البيوت.
        en: Residents light lanterns in front of their houses.
      - text: Penari berpakaian merah dan kuning.
        ar_eg: الراقصين لابسين أحمر وأصفر.
        ar: يرتدي الراقصون الأحمر والأصفر.
        en: The dancers are dressed in red and yellow.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: festival
        ar_eg: مهرجان
        ar: مهرجان
        en: festival
      - text: tahunan
        ar_eg: سنوي
        ar: سنوي
        en: annual
      - text: purnama
        ar_eg: البدر
        ar: البدر
        en: full moon
      - text: tarian
        ar_eg: رقصة
        ar: رقصة
        en: dance
    words: [festival, tahunan, purnama, tarian]
  - id: e02
    type: match_pairs
    pairs:
      - text: ritual
        ar_eg: طقس
        ar: طقس
        en: ritual
      - text: ditetapkan
        ar_eg: اتحدد رسميًا
        ar: حُدّد رسميًا
        en: officially set
      - text: menyalakan
        ar_eg: يولّع، ينوّر
        ar: يُشعل
        en: to light
