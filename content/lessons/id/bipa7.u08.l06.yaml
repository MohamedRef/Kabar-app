schema: kabar.lesson/v1
id: bipa7.u08.l06
language: id
title: Ulangan Unit 8
can_do:
  ar_eg: تشرح اتجاهات الاقتصاد وتربط جملك ببعض بوضوح.
  ar: أن تشرح اتّجاهات الاقتصاد وتربط جملك بوضوح.
  en: Explain economic trends and link your sentences clearly.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: meskipun demikian
        ar_eg: ومع ذلك
        ar: ومع ذلك
        en: even so
      - text: inflasi
        ar_eg: تضخّم
        ar: تضخّم
        en: inflation
      - text: UMKM
        ar_eg: المشاريع الصغيرة والمتوسطة
        ar: المشاريع الصغرى والمتوسّطة
        en: small and medium enterprises
      - text: daya beli
        ar_eg: القوة الشرائية
        ar: القدرة الشرائية
        en: purchasing power
      - text: kendala
        ar_eg: عقبة
        ar: عقبة
        en: obstacle
    words: [meskipun demikian, inflasi, UMKM, daya beli, kendala]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Ekspor naik. ___, impor turun.» بتقارن بين حاجتين في نفس الوقت. تحطّ إيه؟
      ar: «Ekspor naik. ___, impor turun.» تقارن بين أمرين في الوقت نفسه، فماذا تضع؟
      en: '"Ekspor naik. ___, impor turun." It contrasts two things at once. What goes in?'
    options: [Oleh sebab itu, Sementara itu, Bahkan]
    answer: 1
    words: [sementara itu, ekspor, impor, oleh sebab itu, bahkan]
  - id: e03
    type: fill_blank
    sentence: Untuk merintis usaha, kamu butuh ___ dan ide yang baik.
    meaning:
      ar_eg: علشان تبدأ مشروع من الصفر، محتاج رأس مال وفكرة كويسة.
      ar: لتأسيس مشروع تحتاج إلى رأس مال وفكرة جيّدة.
      en: To start a business, you need capital and a good idea.
    options: [modal, laba, omzet]
    answers: [modal]
    words: [modal, merintis, laba, omzet]
  - id: e04
    type: listen
    text: Bank sentral menurunkan suku bunga. Akan tetapi, investasi belum naik.
    question:
      ar_eg: إيه اللي ماحصلش رغم نزول الفايدة؟
      ar: ما الذي لم يحدث رغم خفض الفائدة؟
      en: What hasn't happened despite the rate cut?
    options:
      - التضخّم ماوقفش.
      - المحلات ماقفلتش.
      - الاستثمار لسّه مازادش.
    answer: 2
    words: [suku bunga, akan tetapi, investasi]
  - id: e05
    type: build_sentence
    source:
      ar_eg: سعر الصرف بيأثّر على الواردات.
      ar: يؤثّر سعر الصرف في الواردات.
      en: The exchange rate affects imports.
    answer: Nilai tukar memengaruhi impor.
    distractors: [laba, modal]
    words: [nilai tukar, impor]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي ساعد كاكا بيني يبيع لجاكرتا؟
      ar: ما الذي ساعد كاكا بيني على البيع في جاكرتا؟
      en: What helped Kaka Benny sell to Jakarta?
    options:
      - التسويق الأونلاين.
      - قرض كبير من الحكومة.
      - فتح فرع في جاكرتا.
    answer: 0
    words: [pemasaran daring, pinjaman]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: النمو الاقتصادي ثابت. ومع ذلك، الأسعار بتطلع.
      ar: النموّ الاقتصادي مستقرّ، ومع ذلك ترتفع الأسعار.
      en: Economic growth is stable. Even so, prices are rising.
    answers:
      - Pertumbuhan ekonomi stabil. Meskipun demikian, harga naik.
      - Pertumbuhan ekonomi stabil. Meskipun demikian, harga-harga naik.
      - Pertumbuhan ekonomi stabil. Meskipun demikian, harga terus naik.
      - Pertumbuhan ekonomi relatif stabil. Meskipun demikian, harga naik.
    words: [pertumbuhan ekonomi, meskipun demikian]
  - id: e08
    type: speaking
    text: Pengusaha kecil itu merintis usahanya tanpa pinjaman.
    meaning:
      ar_eg: صاحب المشروع الصغير ده بدأ من الصفر من غير قرض.
      ar: أسّس رائد الأعمال الصغير مشروعه دون قرض.
      en: That small business owner built up his business without a loan.
    words: [pengusaha, merintis, pinjaman]
  - id: e09
    type: dictation
    text: Produk domestik bruto naik. Bahkan, ekspor mencapai rekor baru.
    meaning:
      ar_eg: الناتج المحلي الإجمالي زاد. لا وكمان الصادرات وصلت لرقم قياسي جديد.
      ar: ارتفع الناتج المحلي الإجمالي، بل بلغت الصادرات رقمًا قياسيًّا جديدًا.
      en: GDP rose. In fact, exports hit a new record.
    words: [produk domestik bruto, bahkan, ekspor]
  - id: e10
    type: translate
    direction: from_target
    source_text: Inflasi menurunkan daya beli. Oleh sebab itu, omzet UMKM ikut turun.
    answers_meaning:
      ar_eg:
        - التضخّم بيقلّل القوة الشرائية. وعلشان كده مبيعات المشاريع الصغيرة بتنزل هي كمان.
        - الغلا بيقلّل اللي الناس تقدر تشتريه، فالمشاريع الصغيرة بتبيع أقل.
      ar:
        - يُضعف التضخّم القدرة الشرائية، ولذلك ينخفض رقم أعمال المشاريع الصغيرة أيضًا.
        - التضخّم يقلّص القدرة الشرائية، فتتراجع مبيعات المشاريع الصغيرة معه.
      en:
        - Inflation lowers purchasing power. Therefore, small businesses' turnover falls too.
        - Inflation cuts purchasing power, so small firms' sales drop as well.
    words: [inflasi, daya beli, oleh sebab itu, omzet, UMKM]
dialogue:
  title: Senja di bukit Jayapura
  lines:
    - speaker: Bu Frida
      text: Dari bukit ini kita bisa melihat seluruh teluk dan kota Jayapura.
      ar_eg: من التل ده نقدر نشوف الخليج كله ومدينة جايابورا.
      ar: من هذا التلّ نرى الخليج كلّه ومدينة جايابورا.
      en: From this hill we can see the whole bay and the city of Jayapura.
    - speaker: Mohamed
      text: Pelabuhannya sibuk sekali. Kapal-kapal itu membawa beras dan semen, ya?
      ar_eg: الميناء زحمة قوي. المراكب دي شايلة رز وأسمنت، صح؟
      ar: الميناء مزدحم جدًّا. تلك السفن تحمل الأرز والإسمنت، أليس كذلك؟
      en: The port is so busy. Those ships carry rice and cement, right?
    - speaker: Bu Frida
      text: Betul. Akan tetapi, dari sini juga keluar hasil bumi Papua.
      ar_eg: صح. بس من هنا كمان بتطلع محاصيل بابوا.
      ar: صحيح، لكن من هنا تخرج أيضًا خيرات أرض بابوا.
      en: Right. However, Papua's produce also leaves from here.
    - speaker: Mohamed
      text: Terima kasih, Bu. Besok saya ke Danau Sentani untuk festival.
      ar_eg: شكرًا يا دكتورة. بكرة رايح بحيرة سينتاني للمهرجان.
      ar: شكرًا يا دكتورة. غدًا أذهب إلى بحيرة سينتاني للمهرجان.
      en: Thank you, Bu. Tomorrow I'm off to Lake Sentani for the festival.
souvenir:
  id: bipa7.u08.souvenir
  title: Teluk Jayapura
  note:
    ar_eg: جايابورا عاصمة إقليم بابوا، على خليج واسع قريب من حدود بابوا غينيا الجديدة. الهولنديين كانوا بيسمّوها Hollandia، وفي الحرب العالمية التانية بقت قاعدة كبيرة للحلفاء. وبمناسبة الوحدة دي، إندونيسيا أكبر اقتصاد في جنوب شرق آسيا، والمشاريع الصغيرة (UMKM) بتشغّل أغلب العمّال على حسب الأرقام الحكومية.
    ar: جايابورا عاصمة إقليم بابوا، تطلّ على خليج واسع قرب حدود بابوا غينيا الجديدة. سمّاها الهولنديون Hollandia، وصارت في الحرب العالمية الثانية قاعدة كبرى للحلفاء. وإندونيسيا أكبر اقتصاد في جنوب شرق آسيا، وتشغّل المشاريع الصغيرة (UMKM) أغلب العمّال بحسب الأرقام الحكومية.
    en: Jayapura, capital of Papua province, sits on a wide bay near the Papua New Guinea border. The Dutch called it Hollandia, and in the Second World War it became a major Allied base. Indonesia is the largest economy in Southeast Asia, and small businesses (UMKM) employ most workers according to government figures.
