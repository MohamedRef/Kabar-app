schema: kabar.lesson/v1
id: bipa7.u08.l06
language: id
title: Koperasi
can_do:
  ar_eg: تشرح الجمعية التعاونية بتشتغل إزاي، والأعضاء بياخدوا نصيبهم إزاي.
  ar: أن تشرح طريقة عمل الجمعية التعاونية وكيف ينال أعضاؤها نصيبهم.
  en: Explain how a cooperative works and how members get their share.
slides:
  - title: Dari anggota, untuk anggota
    body:
      ar_eg: |
        الـ koperasi (جمعية تعاونية) بيزنس بيملكه الـ anggota (الأعضاء) نفسهم.
        - كل عضو بيحطّ simpanan (مدّخرات / اشتراك):
          · simpanan pokok: مرة واحدة لما تدخل
          · simpanan wajib: مبلغ ثابت كل شهر
        - في آخر السنة المكسب اسمه sisa hasil usaha (SHU، فايض النشاط)، وبيتقسم على الأعضاء على حسب مشاركتهم.
        محمد حتّا (نائب أول رئيس) اسمه «أبو التعاونيات الإندونيسية»، ويوم التعاونيات ١٢ يوليو.
        - في الكلام: nggak = tidak، banget = sekali، jual = menjual.
      ar: |
        الـ koperasi (الجمعية التعاونية) مشروع يملكه الـ anggota (الأعضاء) أنفسهم.
        - يدفع كلّ عضو simpanan (مدّخرات واشتراكات):
          · simpanan pokok: مرّة واحدة عند الانضمام
          · simpanan wajib: مبلغ ثابت كلّ شهر
        - وفي آخر العام يُسمّى الربح sisa hasil usaha (SHU، فائض النشاط)، ويُوزَّع على الأعضاء بقدر مشاركتهم.
        ويُلقّب محمد حتّا (أوّل نائب للرئيس) بـ«أبي التعاونيات الإندونيسية»، ويوم التعاونيات ١٢ يوليو.
        - في الكلام اليومي: nggak = tidak، banget = sekali، jual = menjual.
      en: |
        A koperasi (cooperative) is a business owned by its anggota (members) themselves.
        - Every member pays simpanan (savings, dues):
          · simpanan pokok: once, when you join
          · simpanan wajib: a fixed amount every month
        - At year's end the profit is called sisa hasil usaha (SHU, surplus), shared among members by how much they took part.
        Mohammad Hatta, the first vice-president, is called the "Father of Indonesian Cooperatives", and Cooperative Day is 12 July.
        - In speech: nggak = tidak, banget = sekali, jual = menjual.
    examples:
      - text: Setiap anggota koperasi membayar simpanan wajib sepuluh ribu rupiah sebulan.
        ar_eg: كل عضو في الجمعية بيدفع اشتراك شهري عشرة آلاف روبية.
        ar: يدفع كلّ عضو في الجمعية اشتراكًا شهريًّا قدره عشرة آلاف روبية.
        en: Every cooperative member pays a monthly due of ten thousand rupiah.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: koperasi
        ar_eg: جمعية تعاونية
        ar: جمعية تعاونية
        en: cooperative
      - text: anggota
        ar_eg: عضو
        ar: عضو
        en: member
      - text: simpanan
        ar_eg: مدّخرات / اشتراك
        ar: مدّخرات
        en: savings, dues
      - text: sisa hasil usaha
        ar_eg: فايض الأرباح
        ar: فائض النشاط
        en: surplus (co-op profit)
      - text: tengkulak
        ar_eg: وسيط
        ar: وسيط
        en: middleman
    words: [koperasi, anggota, simpanan, sisa hasil usaha, tengkulak]
  - id: e02
    type: listen
    text: Koperasi ini dimiliki oleh dua ratus anggota, semuanya nelayan. Setiap anggota punya satu suara dalam rapat tahunan. Keuntungan koperasi dibagi kembali kepada anggota sesuai dengan keaktifan mereka.
    question:
      ar_eg: مين اللي بيملك الجمعية؟
      ar: من يملك الجمعية؟
      en: Who owns the cooperative?
    options:
      - Sebuah bank besar.
      - Dua ratus nelayan yang menjadi anggotanya.
      - Pemerintah daerah.
    answer: 1
    explain:
      ar_eg: dimiliki oleh dua ratus anggota = ملك ميتين عضو كلهم صيّادين، ولكل عضو صوت واحد. مش بنك ولا حكومة.
      ar: dimiliki oleh dua ratus anggota = يملكها مئتا عضو كلّهم صيّادون، ولكلّ عضو صوت واحد، لا بنك ولا حكومة.
      en: 'dimiliki oleh dua ratus anggota: two hundred fishers own it, one vote each. Not a bank or the government.'
    words: [koperasi, anggota]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الـ simpanan pokok بتدفعها إمتى؟
      ar: متى تُدفع الـ simpanan pokok؟
      en: When do you pay the simpanan pokok?
    options:
      - Sekali saja, ketika masuk koperasi.
      - Setiap hari.
      - Ketika keluar dari koperasi.
    answer: 0
    explain:
      ar_eg: simpanan pokok = الاشتراك الأساسي، بيتدفع مرة واحدة لما تدخل الجمعية.
      ar: simpanan pokok = الاشتراك الأساسي، يُدفع مرّة واحدة عند الانضمام.
      en: simpanan pokok is paid once, on joining.
    words: [simpanan]
  - id: e04
    type: fill_blank
    sentence: Akhir tahun, ___ dibagikan kepada semua anggota.
    meaning:
      ar_eg: آخر السنة، فايض الأرباح بيتوزّع على كل الأعضاء.
      ar: في آخر العام يوزَّع فائض النشاط على الأعضاء كلّهم.
      en: At year's end, the surplus is shared among all members.
    options: [sisa hasil usaha, simpanan pokok, harga jual]
    answers: [sisa hasil usaha]
    words: [sisa hasil usaha, anggota]
    explain:
      ar_eg: sisa hasil usaha (SHU) = فايض الأرباح اللي بيتقسم على الأعضاء آخر السنة.
      ar: sisa hasil usaha = فائض الأرباح يوزَّع على الأعضاء آخر العام.
      en: The year-end surplus shared out is the SHU.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي اتسمّى «أبو التعاونيات الإندونيسية»؟
      ar: من لُقّب بـ«أبي التعاونيات الإندونيسية»؟
      en: Who is called the "Father of Indonesian Cooperatives"?
    options:
      - Soekarno.
      - Sultan Hasanuddin.
      - Mohammad Hatta.
    answer: 2
    explain:
      ar_eg: محمد حتّا هو «أبو الجمعيات التعاونية الإندونيسية».
      ar: محمد حتّا هو «أبو التعاونيّات الإندونيسية».
      en: Mohammad Hatta is the Father of Indonesian Cooperatives.
    words: [koperasi]
  - id: e06
    type: build_sentence
    source:
      ar_eg: بقيت عضو في الجمعية التعاونية.
      ar: صرت عضوًا في الجمعية التعاونية.
      en: I've become a member of the cooperative.
    answer: Saya sudah menjadi anggota koperasi.
    distractors: [simpanan, usaha]
    words: [anggota, koperasi]
    explain:
      ar_eg: Saya sudah menjadi (بقيت) + anggota koperasi (عضو في الجمعية). simpanan وusaha زيادة.
      ar: Saya sudah menjadi anggota koperasi. simpanan وusaha زائدتان.
      en: Saya sudah menjadi + anggota koperasi. simpanan and usaha are extra.
  - id: e07
    type: translate
    direction: from_target
    source_text: Dengan koperasi, nelayan tidak perlu menjual ikan ke tengkulak lagi.
    answers_meaning:
      ar_eg:
        - بالجمعية التعاونية، الصيّادين مش محتاجين يبيعوا السمك للوسيط تاني.
        - من خلال الجمعية، الصيّاد مايبيعش سمكه للسمسار تاني.
      ar:
        - بفضل الجمعية لم يعد الصيّادون بحاجة إلى بيع السمك للوسيط.
        - بالجمعية التعاونية يستغني الصيّادون عن بيع سمكهم للسمسار.
      en:
        - With a cooperative, fishers no longer need to sell fish to middlemen.
        - Thanks to the co-op, fishermen don't have to sell to middlemen any more.
    words: [koperasi, tengkulak]
  - id: e08
    type: speaking
    text: Simpanan wajib saya sepuluh ribu rupiah setiap bulan.
    meaning:
      ar_eg: اشتراكي الشهري عشرة آلاف روبية.
      ar: اشتراكي الشهريّ عشرة آلاف روبية.
      en: My monthly due is ten thousand rupiah.
    words: [simpanan]
  - id: e09
    type: dictation
    text: Anggota yang aktif mendapat sisa hasil usaha lebih besar, karena mereka lebih sering berbelanja di koperasi.
    meaning:
      ar_eg: العضو النشيط بياخد نصيب أكبر من الفايض، لأنه بيشتري من الجمعية أكتر.
      ar: ينال العضو النشيط حصّة أكبر من الفائض، لأنّه يشتري من التعاونية أكثر.
      en: Active members get a bigger share of the surplus, because they shop at the cooperative more often.
    words: [anggota, sisa hasil usaha]
  - id: e10
    type: speaking
    text: Uang simpanan anggota dipakai untuk membeli perahu bersama.
    meaning:
      ar_eg: فلوس اشتراكات الأعضاء بتتصرف على شراء مركب مشترك.
      ar: تُستعمل مدّخرات الأعضاء لشراء قارب مشترك.
      en: Members' savings are used to buy a shared boat.
    words: [simpanan, anggota, sisa hasil usaha]
dialogue:
  title: Rapat akhir tahun
  lines:
    - speaker: Bu Frida
      text: Mohamed, hari ini koperasi nelayan di Hamadi membagi sisa hasil usaha. Ayo kita lihat.
      ar_eg: يا محمد، النهارده جمعية الصيّادين في هامادي بتوزّع فايض الأرباح. يلا نروح نشوف.
      ar: يا محمد، توزّع جمعية الصيّادين في هامادي اليوم فائض النشاط، فلنذهب لنرى.
      en: Mohamed, today the fishers' cooperative in Hamadi shares out its surplus. Let's go see.
    - speaker: Mohamed
      text: Jadi semua anggota dapat uang yang sama, Bu?
      ar_eg: يعني كل الأعضاء بياخدوا نفس الفلوس يا أبلة؟
      ar: أيحصل الأعضاء جميعًا على المبلغ نفسه؟
      en: So every member gets the same amount, Bu?
    - speaker: Bu Frida
      text: Nggak. Tergantung simpanan dan seberapa sering mereka jual ikan lewat koperasi.
      ar_eg: لأ. على حسب اشتراكاتهم وقد إيه بيبيعوا سمك عن طريق الجمعية.
      ar: لا، بل بحسب مدّخراتهم ومقدار بيعهم السمك عبر الجمعية.
      en: No. It depends on their savings and how often they sell fish through the co-op.
    - speaker: Mohamed
      text: Adil banget. Yang lebih aktif, dapat lebih banyak.
      ar_eg: عادل جدًا. اللي بيشارك أكتر، بياخد أكتر.
      ar: عادل جدًّا، فمن يشارك أكثر ينل أكثر.
      en: Very fair. The more active you are, the more you get.
