schema: kabar.lesson/v1
id: bipa3.u08.l05
language: id
title: Badai malam ini
can_do:
  ar_eg: 'تفهم تحذير من عاصفة: الضلمة، حالة الطوارئ، الخطر، الناس اللي اتحاصروا والانفجار.'
  ar: 'أن تفهم تحذيرًا من عاصفة: الظلام وحالة الطوارئ والخطر والمحاصَرين والانفجار.'
  en: 'Understand a storm warning: darkness, emergencies, threats, people trapped and an explosion.'
slides:
  - title: Cuaca buruk
    body:
      ar_eg: |
        badai = عاصفة. kegelapan = الضلمة (من gelap). bangunan = مبنى (من bangun = يبني).
        ancaman = تهديد، خطر جاي. hancur = اتكسر حتت، اتدمّر. ledakan = انفجار.
        terjebak = اتحبس، اتزنق (مش قادر يطلع). bertahan = يصمد، يستحمل.
      ar: |
        badai = عاصفة. kegelapan = الظلام (من gelap). bangunan = مبنى (من bangun = يبني).
        ancaman = تهديد. hancur = تحطّم، دُمّر. ledakan = انفجار.
        terjebak = عالق، محاصَر. bertahan = يصمد.
      en: |
        badai = storm. kegelapan = darkness (from gelap). bangunan = building (from bangun = build).
        ancaman = threat. hancur = destroyed, smashed. ledakan = explosion.
        terjebak = trapped, stuck. bertahan = hold out, survive.
    examples:
      - text: Malam ini ada badai. Jangan keluar rumah!
        ar_eg: الليلة فيه عاصفة. ما تخرجش من البيت!
        ar: الليلة عاصفة. لا تخرج من البيت!
        en: There's a storm tonight. Don't go out!
      - text: Listrik mati, jadi rumah gelap.
        ar_eg: النور قطع، فالبيت ضلمة.
        ar: انقطعت الكهرباء فأظلم البيت.
        en: The power's out, so the house is dark.
      - text: Beberapa orang terjebak di dalam mobil.
        ar_eg: كام واحد اتحبسوا جوه العربية.
        ar: علق عدد من الناس داخل السيارة.
        en: Several people are trapped inside a car.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: badai
        ar_eg: عاصفة
        ar: عاصفة
        en: storm
      - text: kegelapan
        ar_eg: الضلمة
        ar: الظلام
        en: darkness
      - text: bangunan
        ar_eg: مبنى
        ar: مبنى
        en: building
      - text: ancaman
        ar_eg: تهديد
        ar: تهديد
        en: threat
    words: [badai, kegelapan, bangunan, ancaman]
  - id: e02
    type: match_pairs
    pairs:
      - text: hancur
        ar_eg: اتدمّر
        ar: دُمّر
        en: destroyed
      - text: terjebak
        ar_eg: اتحبس
        ar: عالق
        en: trapped
      - text: bertahan
        ar_eg: يصمد
        ar: يصمد
        en: hold out
      - text: ledakan
        ar_eg: انفجار
        ar: انفجار
        en: explosion
    words: [hancur, terjebak, bertahan, ledakan]
  - id: e03
    type: listen
    text: Ada ledakan di gunung! Semua warga harus mengungsi.
    question:
      ar_eg: حصل إيه في الجبل؟
      ar: ماذا حدث في الجبل؟
      en: What happened on the mountain?
    options: [انفجار, حريق, زلزال]
    answer: 0
    meaning:
      ar_eg: فيه انفجار في الجبل! كل السكان لازم يخلوا المكان.
      ar: وقع انفجار في الجبل! على جميع السكان الإخلاء.
      en: There's an explosion on the mountain! Everyone must evacuate.
    words: [ledakan]
  - id: e04
    type: fill_blank
    sentence: Rumah itu ___ karena gempa.
    meaning:
      ar_eg: البيت ده ___ بسبب الزلزال.
      ar: ___ ذلك البيت بسبب الزلزال.
      en: That house was ___ by the earthquake.
    options: [hancur, kegelapan, ancaman]
    answers: [hancur]
    words: [hancur, kegelapan, ancaman]
    explain:
      ar_eg: البيت «اتهدّ» = hancur. kegelapan = ضلمة، وancaman = تهديد، ودول أسماء.
      ar: البيت «تهدّم» hancur. أما kegelapan فظلام، وancaman تهديد، وهما اسمان.
      en: "The house was destroyed: hancur. kegelapan is darkness and ancaman a threat; both are nouns."
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حاجة كبيرة زي مدرسة أو مستشفى أو جامع، اسمها إيه؟
      ar: ما اسم الشيء الكبير مثل المدرسة أو المستشفى أو المسجد؟
      en: What do you call something like a school, a hospital or a mosque?
    options: [badai, bangunan, terjebak]
    answer: 1
    explain:
      ar_eg: bangunan = مبنى (من bangun = يبني).
      ar: bangunan = مبنى (من bangun = يبني).
      en: bangunan = building (from bangun = build).
    words: [bangunan, badai, terjebak]
  - id: e06
    type: fill_blank
    sentence: Tiga orang ___ di dalam rumah yang roboh.
    meaning:
      ar_eg: تلات أشخاص ___ جوه البيت اللي وقع.
      ar: ثلاثة أشخاص ___ داخل البيت المنهار.
      en: Three people are ___ inside the collapsed house.
    options: [bertahan, terjebak, ledakan]
    answers: [terjebak]
    words: [terjebak, bertahan, ledakan]
    explain:
      ar_eg: «محبوسين جوه» البيت اللي وقع = terjebak. bertahan = صامدين، وledakan = انفجار.
      ar: «محاصرون داخل» البيت المنهار terjebak. أما bertahan فـ«صامدون»، وledakan انفجار.
      en: Stuck inside a collapsed house is terjebak. bertahan means holding out and ledakan an explosion.
  - id: e07
    type: build_sentence
    source:
      ar_eg: العاصفة دي تهديد كبير.
      ar: هذه العاصفة تهديد كبير.
      en: This storm is a big threat.
    answer: Badai ini adalah ancaman besar.
    distractors: [kegelapan, hancur]
    words: [badai, ancaman]
    explain:
      ar_eg: "«تهديد كبير» = ancaman besar: Badai ini adalah ancaman besar. kegelapan = ضلمة، وhancur = اتهدّ."
      ar: «تهديد كبير» ancaman besar. أما kegelapan فظلام، وhancur «تهدّم».
      en: "\"A big threat\" is ancaman besar. kegelapan is darkness and hancur destroyed."
  - id: e08
    type: translate
    direction: from_target
    source_text: Kami bertahan di masjid sampai pagi.
    answers_meaning:
      ar_eg: [فضلنا صامدين في الجامع لحد الصبح, استحملنا في المسجد لحد الصبح]
      ar: [صمدنا في المسجد حتى الصباح, بقينا في المسجد حتى الصباح]
      en: [We held out in the mosque until morning, We sheltered in the mosque till morning]
    words: [bertahan]
  - id: e09
    type: speaking
    text: Kami duduk dalam kegelapan sampai pagi.
    meaning:
      ar_eg: قعدنا في الضلمة لحد الصبح.
      ar: جلسنا في الظلام حتى الصباح.
      en: We sat in the dark until morning.
    words: [kegelapan]
  - id: e10
    type: multiple_choice
    question: Banyak ___ hancur karena badai itu.
    options: [ledakan, bertahan, bangunan]
    answer: 2
    explain:
      ar_eg: bangunan = مبنى.
      ar: bangunan = مبنى.
      en: bangunan = building.
    words: [bangunan, ledakan, bertahan, hancur, badai]
dialogue:
  lines:
    - speaker: Bu Yanti
      text: Mohamed, katanya malam ini ada badai besar.
      ar_eg: يا محمد، بيقولوا فيه عاصفة كبيرة الليلة.
      ar: يا محمد، يقولون إن عاصفة كبيرة ستهبّ الليلة.
      en: Mohamed, they say there's a big storm tonight.
    - speaker: Mohamed
      text: Wah. Ini ancaman buat rumah kita nggak, Bu?
      ar_eg: ياه. هي خطر على بيتنا؟
      ar: هل هي تهديد لبيتنا؟
      en: Oh. Is it a threat to our house?
    - speaker: Bu Yanti
      text: Rumah ini kuat, bisa bertahan. Tapi listrik bisa mati.
      ar_eg: البيت ده متين، هيصمد. بس النور ممكن يقطع.
      ar: هذا البيت متين وسيصمد. لكن قد تنقطع الكهرباء.
      en: This house is solid; it'll hold. But the power may go.
    - speaker: Mohamed
      text: Saya punya senter. Kalau gelap, kita pakai itu aja.
      ar_eg: عندي كشاف. لو الدنيا ضلمت نستخدمه.
      ar: عندي مصباح يدوي. إن أظلم المكان استخدمناه.
      en: I've got a torch. If it gets dark, we'll use that.
    - speaker: Bu Yanti
      text: Bagus. Simpan juga nomor telepon darurat, ya.
      ar_eg: كويس. واحفظ كمان رقم الطوارئ.
      ar: جيد. واحفظ أيضًا رقم الطوارئ.
      en: Good. Save the emergency number too.
