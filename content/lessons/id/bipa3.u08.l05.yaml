  - id: e03
    type: listen
    text: Ada ledakan di gunung! Semua warga harus mengungsi.
    question:
      ar_eg: حصل إيه في الجبل؟
      ar: ماذا حدث في الجبل؟
      en: What happened on the mountain?
    options: [انفجار, حريق, زلزال]
    answer: 0
    meaning:
      ar_eg: فيه انفجار في الجبل! كل السكان لازم يخلوا المكان.
      ar: وقع انفجار في الجبل! على جميع السكان الإخلاء.
      en: There's an explosion on the mountain! Everyone must evacuate.
    words: [ledakan]
  - id: e04
    type: fill_blank
    sentence: Rumah itu ___ karena gempa.
    meaning:
      ar_eg: البيت ده ___ بسبب الزلزال.
      ar: ___ ذلك البيت بسبب الزلزال.
      en: That house was ___ by the earthquake.
    options: [hancur, gelap, ancaman]
    answers: [hancur]
    words: [hancur, gelap, ancaman]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بنتصل بالرقم ده في حالة إيه؟ «Telepon 112 jika ada keadaan ___»
      ar: متى نتصل بهذا الرقم؟ «Telepon 112 jika ada keadaan ___»
      en: When do we call this number? 'Telepon 112 jika ada keadaan ___'
    options: [badai, darurat, terjebak]
    answer: 1
    explain:
      ar_eg: keadaan darurat = حالة طوارئ (من «ضرورة»).
      ar: keadaan darurat = حالة طوارئ (من «ضرورة»).
      en: keadaan darurat = emergency (from Arabic ḍarūra).
    words: [darurat, badai, terjebak]
  - id: e06
    type: fill_blank
    sentence: Tiga orang ___ di dalam rumah yang roboh.
    meaning:
      ar_eg: تلات أشخاص ___ جوه البيت اللي وقع.
      ar: ثلاثة أشخاص ___ داخل البيت المنهار.
      en: Three people are ___ inside the collapsed house.
    options: [bertahan, terjebak, ledakan]
    answers: [terjebak]
    words: [terjebak, bertahan, ledakan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: العاصفة دي تهديد كبير.
      ar: هذه العاصفة تهديد كبير.
      en: This storm is a big threat.
    answer: Badai ini adalah ancaman besar.
    distractors: [gelap, hancur]
    words: [badai, ancaman]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kami bertahan di masjid sampai pagi.
    answers_meaning:
      ar_eg: [فضلنا صامدين في الجامع لحد الصبح, استحملنا في المسجد لحد الصبح]
      ar: [صمدنا في المسجد حتى الصباح, بقينا في المسجد حتى الصباح]
      en: [We held out in the mosque until morning, We sheltered in the mosque till morning]
    words: [bertahan]
  - id: e09
    type: speaking
    text: Di luar gelap sekali. Jangan keluar!
    meaning:
      ar_eg: برّه ضلمة أوي. ما تخرجش!
      ar: الخارج مظلم جدًا. لا تخرج!
      en: It's very dark outside. Don't go out!
    words: [gelap]
  - id: e10
    type: multiple_choice
    question: 'Petugas: "Ini keadaan ___. Semua orang ke lapangan!"'
    options: [ledakan, bertahan, darurat]
    answer: 2
    explain:
      ar_eg: keadaan darurat = حالة طوارئ.
      ar: keadaan darurat = حالة طوارئ.
      en: keadaan darurat = emergency.
    words: [darurat, ledakan, bertahan, hancur, badai, terjebak]
dialogue:
  lines:
    - speaker: Bu Yanti
      text: Mohamed, katanya malam ini ada badai besar.
      ar_eg: يا محمد، بيقولوا فيه عاصفة كبيرة الليلة.
      ar: يا محمد، يقولون إن عاصفة كبيرة ستهبّ الليلة.
      en: Mohamed, they say there's a big storm tonight.
    - speaker: Mohamed
      text: Wah. Apakah ini ancaman untuk rumah kita?
      ar_eg: ياه. هي خطر على بيتنا؟
      ar: هل هي تهديد لبيتنا؟
      en: Oh. Is it a threat to our house?
    - speaker: Bu Yanti
      text: Rumah ini kuat, bisa bertahan. Tapi listrik bisa mati.
      ar_eg: البيت ده متين، هيصمد. بس النور ممكن يقطع.
      ar: هذا البيت متين وسيصمد. لكن قد تنقطع الكهرباء.
      en: This house is solid; it'll hold. But the power may go.
    - speaker: Mohamed
      text: Saya punya senter. Kalau gelap, kita pakai itu.
      ar_eg: عندي كشاف. لو الدنيا ضلمت نستخدمه.
      ar: عندي مصباح يدوي. إن أظلم المكان استخدمناه.
      en: I've got a torch. If it gets dark, we'll use that.
    - speaker: Bu Yanti
      text: Bagus. Simpan juga nomor telepon darurat, ya.
      ar_eg: كويس. واحفظ كمان رقم الطوارئ.
      ar: جيد. واحفظ أيضًا رقم الطوارئ.
      en: Good. Save the emergency number too.
