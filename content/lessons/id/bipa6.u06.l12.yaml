schema: kabar.lesson/v1
id: bipa6.u06.l12
language: id
title: Menulis satire
can_do:
  ar_eg: تكتب خبر ساخر قصير بيكبّر مشكلة حقيقية عشان ينقدها من غير ما يجرح حد.
  ar: أن تكتب خبرًا ساخرًا قصيرًا يضخّم مشكلة حقيقية لينتقدها دون أن يجرح أحدًا.
  en: Write a short satirical news item that exaggerates a real problem to criticise it, without hurting anyone.
slides:
  - title: Besar-besarkan, tapi jangan bohong
    body:
      ar_eg: |
        الـ satire بياخد مشكلة حقيقية ويكبّرها لحد ما تبقى مضحكة.
        - melebih-lebihkan = يبالغ، يكبّر الحاجة أكتر من حجمها
        خطوات:
        1. اختار مشكلة يعرفها الكل: زحمة جاكرتا مثلًا.
        2. melebih-lebihkan: Warga Jakarta kini sarapan, makan siang, dan makan malam di dalam mobil.
        3. اكتب بأسلوب خبر جد، والقارئ هيفهم الـ ironi.
        4. انقد المسؤولين أو النظام، مش الـ SARA.
      ar: |
        يأخذ الـ satire مشكلة حقيقية ويضخّمها حتى تصير مضحكة.
        - melebih-lebihkan = يبالغ، يضخّم الأمر فوق حجمه
        الخطوات:
        ١. اختر مشكلة يعرفها الجميع، كازدحام جاكرتا.
        ٢. melebih-lebihkan: Warga Jakarta kini sarapan, makan siang, dan makan malam di dalam mobil.
        ٣. اكتب بأسلوب الخبر الجادّ، وسيفهم القارئ الـ ironi.
        ٤. انتقد المسؤولين أو النظام، لا الـ SARA.
      en: |
        Satire takes a real problem and blows it up until it's funny.
        - melebih-lebihkan = to exaggerate
        Steps:
        1. Pick a problem everyone knows, like Jakarta traffic.
        2. melebih-lebihkan: Warga Jakarta kini sarapan, makan siang, dan makan malam di dalam mobil.
        3. Write it in a straight news style; the reader will get the ironi.
        4. Aim at officials or the system, never at SARA.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي عنوان فيه satire؟
      ar: أيّ عنوان ساخر؟
      en: Which headline is satire?
    options:
      - Jalan Sudirman macet pada jam sibuk.
      - Macet makin parah, warga Jakarta pindah rumah ke dalam mobil.
      - Pemerintah membangun jalur MRT baru.
    answer: 1
    words: [satire]
  - id: e02
    type: listen
    text: Penulis satire itu melebih-lebihkan masalah sampah sampai terdengar konyol.
    question:
      ar_eg: الكاتب عمل إيه في مشكلة الزبالة؟
      ar: ماذا فعل الكاتب بمشكلة القمامة؟
      en: What did the writer do with the rubbish problem?
    options:
      - حلّها.
      - نسيها.
      - كبّرها لحد ما بقت تضحّك.
    answer: 2
    words: [satire, melebih-lebihkan, konyol]
  - id: e03
    type: fill_blank
    sentence: Dalam satire, kita boleh ___ masalah, tetapi masalahnya harus nyata.
    meaning:
      ar_eg: في السخرية، مسموح نكبّر المشكلة، بس المشكلة لازم تبقى حقيقية.
      ar: يجوز في السخرية تضخيم المشكلة، لكن يجب أن تكون حقيقية.
      en: In satire we may exaggerate a problem, but it has to be real.
    options: [melebih-lebihkan, menyinggung, menghibur]
    answers: [melebih-lebihkan]
    words: [melebih-lebihkan]
  - id: e04
    type: build_sentence
    source:
      ar_eg: السخرية بتنقد النظام، مش الناس الغلابة.
      ar: تنتقد السخرية النظام لا البسطاء.
      en: Satire criticises the system, not ordinary people.
    answer: Satire mengkritik sistem, bukan rakyat kecil.
    distractors: [sensitif, batas]
    words: [satire]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: نكتة الساخر دي بتهاجم دين ناس. المشكلة إيه؟
      ar: هذه النكتة الساخرة تهاجم دين قوم. ما المشكلة؟
      en: This satirical joke attacks people's religion. What's the problem?
    options:
      - عدّت الحد ودخلت في SARA.
      - قصيرة أوي.
      - مافيهاش مبالغة.
    answer: 0
    words: [batas, SARA]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ماتبالغش في القصة لحد ما تبقى كدب.
      ar: لا تبالغ في القصّة حتى تصير كذبًا.
      en: Don't exaggerate the story until it becomes a lie.
    answers:
      - Jangan melebih-lebihkan cerita sampai menjadi bohong.
      - Jangan melebih-lebihkan cerita itu sampai menjadi kebohongan.
      - Jangan melebih-lebihkan ceritanya sampai jadi bohong.
    words: [melebih-lebihkan]
  - id: e07
    type: speaking
    text: Satire yang baik membuat pembaca tertawa, lalu berpikir.
    meaning:
      ar_eg: السخرية الكويسة بتخلّي القارئ يضحك، وبعدين يفكر.
      ar: السخرية الجيّدة تُضحك القارئ ثم تجعله يفكّر.
      en: Good satire makes the reader laugh, then think.
    words: [satire]
  - id: e08
    type: dictation
    text: Kartunis dan penulis satire sama-sama melebih-lebihkan untuk mengkritik.
    meaning:
      ar_eg: رسامين الكاريكاتير وكتّاب السخرية الاتنين بيبالغوا عشان ينقدوا.
      ar: يبالغ رسّامو الكاريكاتير وكتّاب السخرية كلاهما لينتقدوا.
      en: Cartoonists and satirists both exaggerate in order to criticise.
    words: [kartunis, melebih-lebihkan]
  - id: e09
    type: fill_blank
    sentence: Berita palsu ingin menipu, tetapi ___ ingin pembaca tahu bahwa itu lelucon.
    meaning:
      ar_eg: الخبر الكداب عايز يضحك على الناس، بس السخرية عايزة القارئ يعرف إنها نكتة.
      ar: يريد الخبر الكاذب الخداع، أمّا السخرية فتريد أن يعرف القارئ أنها نكتة.
      en: Fake news wants to deceive, but satire wants readers to know it's a joke.
    options: [satire, karikatur, sindiran]
    answers: [satire]
    words: [satire]
  - id: e10
    type: speaking
    text: Pejabat itu sangat sibuk. Dia rapat dua puluh lima jam sehari.
    meaning:
      ar_eg: المسؤول ده مشغول جدًا. بيعمل اجتماعات خمسة وعشرين ساعة في اليوم.
      ar: هذا المسؤول مشغول جدًّا، يعقد اجتماعات خمسًا وعشرين ساعة في اليوم.
      en: That official is very busy. He holds meetings twenty-five hours a day.
    words: [pejabat, melebih-lebihkan]
dialogue:
  title: Berita untuk majalah kampus
  lines:
    - speaker: Bang Togar
      text: Mohamed, tulis satu berita satire untuk majalah kampus. Tentang apa saja.
      ar_eg: يا محمد، اكتب خبر ساخر لمجلة الجامعة. عن أي حاجة.
      ar: يا محمد، اكتب خبرًا ساخرًا لمجلّة الجامعة، عن أيّ شيء.
      en: Mohamed, write a satirical news piece for the campus magazine. About anything.
    - speaker: Mohamed
      text: "Bagaimana kalau ini: 'Mahasiswa menemukan dosen pembimbing setelah mencari tiga tahun.'"
      ar_eg: '«إيه رأيك في دي: طالب لقى المشرف بتاعه بعد ما دوّر عليه تلات سنين.»'
      ar: '«ما رأيك بهذا: طالب يعثر على مشرفه بعد بحث دام ثلاث سنوات.»'
      en: "How about this: 'Student finds thesis supervisor after a three-year search.'"
    - speaker: Bang Togar
      text: Ha! Kamu melebih-lebihkan, tetapi semua mahasiswa tahu masalahnya.
      ar_eg: ها! إنت بتبالغ، بس كل الطلبة عارفين المشكلة.
      ar: ها! أنت تبالغ، لكنّ كلّ الطلّاب يعرفون المشكلة.
      en: Ha! You're exaggerating, but every student knows the problem.
    - speaker: Mohamed
      text: Dan tidak ada SARA. Yang dikritik sistemnya, bukan orangnya.
      ar_eg: ومافيهاش SARA. اللي بننقده النظام، مش الشخص.
      ar: ولا SARA فيها؛ فالمنتقَد النظام لا الشخص.
      en: And no SARA. It's the system being criticised, not the person.
new_words:
  - word: satire
    pos: noun
    ar_eg: سخرية (نوع أدبي)
    ar: الهجاء الساخر
    en: satire
  - word: melebih-lebihkan
    pos: verb
    ar_eg: يبالغ
    ar: يبالغ، يضخّم
    en: to exaggerate
