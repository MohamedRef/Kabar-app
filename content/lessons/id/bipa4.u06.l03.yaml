schema: kabar.lesson/v1
id: bipa4.u06.l03
language: id
title: Hujan deras, angin kencang
can_do:
  ar_eg: تتكلم عن الجو والسفر بصفات بتيجي مع أسماء معيّنة (hujan deras، angin kencang).
  ar: أن تتحدث عن الطقس والسفر بصفات تتلازم مع أسماء معيّنة.
  en: Talk about weather and travel with natural noun + adjective pairs.
slides:
  - title: Hujan deras, bukan hujan berat
    body:
      ar_eg: |
        الصفة كمان ليها «صاحب». بالإنجليزي heavy rain، بس بالإندونيسي berat (تقيل) غلط هنا:
        مطر غزير = hujan deras (أو hujan lebat).
        ريح شديدة = angin kencang. والموج العالي = ombak tinggi أو ombak besar.
      ar: |
        للصفة أيضًا كلمات تلازمها. يقال بالإنجليزية heavy rain، لكن berat (ثقيل) خطأ هنا بالإندونيسية:
        مطر غزير = hujan deras (أو hujan lebat).
        ريح شديدة = angin kencang، وموج عالٍ = ombak tinggi أو ombak besar.
      en: |
        Adjectives have partners too. English says "heavy rain", but berat (heavy) is wrong here:
        heavy rain = hujan deras (or hujan lebat).
        strong wind = angin kencang; high waves = ombak tinggi or ombak besar.
    grammar: id.collocation
    examples:
      - text: Kemarin hujan deras dan angin kencang di Teluk Palu.
        ar_eg: امبارح كان فيه مطر غزير وريح شديدة في خليج بالو.
        ar: هطل أمس مطر غزير وهبّت ريح شديدة في خليج بالو.
        en: Yesterday there was heavy rain and a strong wind on Palu Bay.
      - text: Hari ini ombaknya tinggi.
        ar_eg: النهارده الموج عالي.
        ar: الموج عالٍ اليوم.
        en: The waves are high today.
  - title: Kopi kental, rusak parah
    body:
      ar_eg: |
        كمان شوية «أصحاب» مشهورين:
        قهوة تقيلة = kopi kental (مش kopi berat).
        باظ جامد = rusak parah، وعيان جامد = sakit parah. (في تقارير الكوارث بيقولوا كمان rusak berat.)
      ar: |
        ومن المتلازمات الشائعة أيضًا:
        قهوة ثقيلة = kopi kental (لا kopi berat).
        تضرّر بشدة = rusak parah، ومرض شديد = sakit parah. (وفي تقارير الكوارث يقال أيضًا rusak berat.)
      en: |
        A few more well-known pairs:
        strong coffee = kopi kental (not kopi berat).
        badly damaged = rusak parah; seriously ill = sakit parah. (Disaster reports also say rusak berat.)
    grammar: id.collocation
    examples:
      - text: Saya minum kopi kental supaya tidak mengantuk.
        ar_eg: بشرب قهوة تقيلة عشان مانامش.
        ar: أشرب قهوة ثقيلة كي لا أنعس.
        en: I drink strong coffee so I don't get sleepy.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: hujan deras
        ar_eg: مطر غزير
        ar: مطر غزير
        en: heavy rain
      - text: angin kencang
        ar_eg: ريح شديدة
        ar: ريح شديدة
        en: strong wind
      - text: ombak
        ar_eg: موج
        ar: موج
        en: wave
      - text: kopi kental
        ar_eg: قهوة تقيلة
        ar: قهوة ثقيلة
        en: strong coffee
      - text: rusak parah
        ar_eg: باظ جامد / متدمّر
        ar: متضرر بشدة
        en: badly damaged
    words: [deras, kencang, ombak, kental, parah]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي تعبير طبيعي بالإندونيسي لـ «مطر غزير»؟
      ar: أيّ تعبير طبيعي بالإندونيسية لـ «مطر غزير»؟
      en: Which is the natural Indonesian for "heavy rain"?
    options: [hujan berat, hujan deras, hujan keras]
    answer: 1
    explain:
      ar_eg: hujan berat ترجمة حرفية من الإنجليزي. الإندونيسيين بيقولوا hujan deras أو hujan lebat.
      ar: hujan berat ترجمة حرفية من الإنجليزية، والصحيح hujan deras أو hujan lebat.
      en: hujan berat is a word-for-word copy of English; Indonesians say hujan deras or hujan lebat.
    words: [deras]
  - id: e03
    type: listen
    text: Anginnya kencang, jadi ombaknya tinggi.
    options: ["Hujannya deras, jadi ombaknya tinggi.", "Anginnya kencang, jadi ombaknya tinggi.", "Anginnya kencang, jadi ombaknya rendah."]
    answer: 1
    meaning:
      ar_eg: الريح شديدة، عشان كده الموج عالي.
      ar: الريح شديدة، لذلك الموج عالٍ.
      en: The wind is strong, so the waves are high.
    words: [kencang, ombak]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إنت في وارونج وعايز قهوة تقيلة. تطلب إزاي؟
      ar: أنت في مطعم شعبي وتريد قهوة ثقيلة. كيف تطلبها؟
      en: You're at a warung and want strong coffee. How do you order?
    options: ["Kopi deras satu, Bu.", "Kopi parah satu, Bu.", "Kopi kental satu, Bu."]
    answer: 2
    words: [kental]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «بيوت كتير اتدمّرت جامد بسبب الزلزال»؟
      ar: أيّ جملة تعني «تضرّرت بيوت كثيرة بشدة بسبب الزلزال»؟
      en: Which sentence means "Many houses were badly damaged by the earthquake"?
    options: ["Banyak rumah rusak parah karena gempa.", "Banyak rumah rusak kental karena gempa.", "Banyak rumah rusak deras karena gempa."]
    answer: 0
    words: [parah]
  - id: e06
    type: fill_blank
    sentence: Jalan ke pantai rusak ___ setelah hujan deras.
    meaning:
      ar_eg: الطريق للشط باظ جامد بعد المطر الغزير.
      ar: تضرّر الطريق إلى الشاطئ بشدة بعد المطر الغزير.
      en: The road to the beach was badly damaged after the heavy rain.
    options: [kental, parah, kencang]
    answers: [parah]
    words: [parah, deras]
  - id: e07
    type: build_sentence
    source:
      ar_eg: امبارح كان فيه مطر غزير وريح شديدة في خليج بالو.
      ar: هطل أمس مطر غزير وهبّت ريح شديدة في خليج بالو.
      en: Yesterday there was heavy rain and a strong wind on Palu Bay.
    answer: Kemarin hujan deras dan angin kencang di Teluk Palu.
    distractors: [berat, kental]
    words: [deras, kencang]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الموج عالي عشان الريح شديدة.
      ar: الموج عالٍ لأن الريح شديدة.
      en: The waves are high because the wind is strong.
    answers:
      - Ombaknya tinggi karena anginnya kencang.
      - Ombaknya tinggi karena anginnya kencang
      - Ombak tinggi karena angin kencang.
      - Ombaknya tinggi karena angin kencang.
      - Ombaknya besar karena anginnya kencang.
      - Ombaknya tinggi sebab anginnya kencang.
    words: [ombak, kencang]
  - id: e09
    type: speaking
    text: Anginnya kencang dan ombaknya tinggi, jadi kami minum kopi kental di hotel.
    meaning:
      ar_eg: الريح شديدة والموج عالي، فإحنا بنشرب قهوة تقيلة في الفندق.
      ar: الريح شديدة والموج عالٍ، لذلك نشرب قهوة ثقيلة في الفندق.
      en: The wind is strong and the waves are high, so we're drinking strong coffee at the hotel.
    words: [kencang, ombak, kental]
dialogue:
  title: Batal ke Tanjung Karang
  lines:
    - speaker: Mohamed
      text: Mas, kita jadi snorkeling di Tanjung Karang hari ini?
      ar_eg: يا رزال، هنروح نغطس (سنوركلينج) في تانجونج كارانج النهارده ولا لأ؟
      ar: يا رزال، هل سنذهب للغطس السطحي في تانجونغ كارانغ اليوم؟
      en: Rizal, are we still going snorkelling at Tanjung Karang today?
    - speaker: Mas Rizal
      text: Kayaknya nggak. Anginnya kencang dan ombaknya tinggi.
      ar_eg: شكلها لأ. الريح شديدة والموج عالي.
      ar: يبدو أن لا. الريح شديدة والموج عالٍ.
      en: Looks like we aren't. The wind is strong and the waves are high.
    - speaker: Mohamed
      text: Wah, hujannya juga deras banget.
      ar_eg: ياه، والمطر كمان غزير أوي.
      ar: يا للعجب، والمطر غزير جدًا أيضًا.
      en: Wow, and the rain is really heavy too.
    - speaker: Mas Rizal
      text: Mending kita minum kopi kental di sini dulu.
      ar_eg: الأحسن نشرب قهوة تقيلة هنا الأول.
      ar: الأفضل أن نشرب قهوة ثقيلة هنا أولًا.
      en: We'd better have some strong coffee here first.
new_words:
  - word: kencang
    pos: adjective
    ar_eg: شديد (ريح) / سريع
    ar: شديد (للريح)، سريع
    en: strong (wind), fast
  - word: kental
    pos: adjective
    ar_eg: تقيل (قهوة / سايل)
    ar: ثقيل، كثيف (للقهوة والسوائل)
    en: thick, strong (coffee, liquids)
  - word: parah
    pos: adjective
    ar_eg: جامد / خطير (ضرر أو مرض)
    ar: شديد، خطير (للضرر أو المرض)
    en: severe, serious (damage, illness)
