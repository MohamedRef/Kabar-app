schema: kabar.lesson/v1
id: bipa3.u10.l05
language: id
title: Natal dan tahun baru
can_do:
  ar_eg: تتكلم عن الأجازات الرسمية في إندونيسيا وجوها، وعن خططك الجاية.
  ar: أن تتحدث عن العطلات الرسمية في إندونيسيا وأجوائها، وعن خططك القادمة.
  en: Talk about Indonesia's public holidays and their atmosphere, and about your plans ahead.
slides:
  - title: Kalender Indonesia
    body:
      ar_eg: |
        Natal = الكريسماس (عيد الميلاد، ٢٥ ديسمبر). tahun baru = راس السنة.
        upacara = احتفال رسمي، مراسم (upacara bendera = تحية العلم). suasana = جو (الجو العام، مش الطقس).
        sekaligus = في نفس الوقت، مرة واحدة. kini = دلوقتي (رسمي، زي sekarang).
        semakin = أكتر وأكتر: semakin ramai = بيزحم أكتر. nantinya = بعدين، في الآخر.
      ar: |
        Natal = عيد الميلاد (٢٥ ديسمبر). tahun baru = رأس السنة.
        upacara = مراسم، احتفال رسمي (upacara bendera = تحية العلم). suasana = جوّ (الأجواء، لا الطقس).
        sekaligus = في الوقت نفسه، دفعة واحدة. kini = الآن (رسمية، مثل sekarang).
        semakin = يزداد: semakin ramai = يزداد ازدحامًا. nantinya = لاحقًا، في النهاية.
      en: |
        Natal = Christmas (25 December). tahun baru = New Year.
        upacara = ceremony (upacara bendera = flag ceremony). suasana = atmosphere, mood (not weather).
        sekaligus = at the same time, all at once. kini = now (formal sekarang).
        semakin = more and more: semakin ramai = getting busier. nantinya = later on, eventually.
    examples:
      - text: Natal adalah hari libur nasional di Indonesia.
        ar_eg: الكريسماس أجازة رسمية في إندونيسيا.
        ar: عيد الميلاد عطلة رسمية في إندونيسيا.
        en: Christmas is a public holiday in Indonesia.
      - text: Setiap 17 Agustus ada upacara bendera.
        ar_eg: كل ١٧ أغسطس فيه تحية العلم.
        ar: تُقام كل ١٧ أغسطس مراسم رفع العلم.
        en: Every 17 August there's a flag ceremony.
      - text: Suasana malam tahun baru sangat ramai.
        ar_eg: جو ليلة راس السنة زحمة وفرحة جدًا.
        ar: أجواء ليلة رأس السنة صاخبة جدًا.
        en: New Year's Eve is very lively.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Natal
        ar_eg: الكريسماس
        ar: عيد الميلاد
        en: Christmas
      - text: tahun baru
        ar_eg: راس السنة
        ar: رأس السنة
        en: New Year
      - text: upacara
        ar_eg: مراسم
        ar: مراسم
        en: ceremony
      - text: suasana
        ar_eg: جو
        ar: أجواء
        en: atmosphere
    words: [Natal, tahun baru, upacara, suasana]
  - id: e02
    type: match_pairs
    pairs:
      - text: sekaligus
        ar_eg: في نفس الوقت
        ar: في الوقت نفسه
        en: at the same time
      - text: kini
        ar_eg: دلوقتي
        ar: الآن
        en: now
      - text: semakin
        ar_eg: أكتر وأكتر
        ar: يزداد
        en: more and more
      - text: nantinya
        ar_eg: بعدين
        ar: لاحقًا
        en: later on
    words: [sekaligus, kini, semakin, nantinya]
  - id: e03
    type: listen
    text: Menjelang Lebaran, jalan semakin macet.
    question:
      ar_eg: الطرق بتبقى عاملة إزاي؟
      ar: كيف تصبح الطرق؟
      en: What happens to the roads?
    options: [بتفضى, بتزحم أكتر, بتتقفل]
    answer: 1
    meaning:
      ar_eg: قبل العيد، الطرق بتزحم أكتر وأكتر.
      ar: قبيل العيد يزداد ازدحام الطرق.
      en: Just before Lebaran, the roads get more and more jammed.
    words: [semakin]
  - id: e04
    type: fill_blank
    sentence: Pada tanggal 25 Desember, umat Kristen merayakan ___.
    meaning:
      ar_eg: يوم ٢٥ ديسمبر، المسيحيين بيحتفلوا بـ ___.
      ar: في ٢٥ ديسمبر يحتفل المسيحيون بـ ___.
      en: On 25 December, Christians celebrate ___.
    options: [Natal, upacara, kini]
    answers: [Natal]
    words: [Natal, upacara, kini]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كلمة رسمية معناها sekarang؟
      ar: أي كلمة رسمية تعني sekarang؟
      en: Which formal word means sekarang?
    options: [nantinya, suasana, kini]
    answer: 2
    explain:
      ar_eg: kini = دلوقتي (رسمي).
      ar: kini = الآن (رسمية).
      en: kini = now (formal).
    words: [kini, nantinya, suasana]
  - id: e06
    type: fill_blank
    sentence: Saya ke Mataram untuk bekerja, ___ berlibur.
    meaning:
      ar_eg: رايح ماتارام أشتغل، و ___ أتفسّح.
      ar: أذهب إلى ماترام للعمل، و ___ للعطلة.
      en: I'm going to Mataram to work and ___ have a holiday.
    options: [sekaligus, semakin, tahun baru]
    answers: [sekaligus]
    words: [sekaligus, semakin, tahun baru]
  - id: e07
    type: build_sentence
    source:
      ar_eg: جو الكريسماس في الكنيسة كان حلو.
      ar: كانت أجواء عيد الميلاد في الكنيسة جميلة.
      en: The Christmas atmosphere at the church was lovely.
    answer: Suasana Natal di gereja sangat indah.
    distractors: [kini, nantinya]
    words: [suasana, Natal]
  - id: e08
    type: translate
    direction: from_target
    source_text: Nantinya saya ingin tinggal di Indonesia.
    answers_meaning:
      ar_eg: [في الآخر نفسي أعيش في إندونيسيا, بعدين عايز أعيش في إندونيسيا]
      ar: [أودّ لاحقًا أن أعيش في إندونيسيا, في المستقبل أريد أن أعيش في إندونيسيا]
      en: ['Later on I''d like to live in Indonesia', Eventually I want to live in Indonesia]
    words: [nantinya]
  - id: e09
    type: speaking
    text: Selamat tahun baru! Semoga semakin sukses.
    meaning:
      ar_eg: سنة سعيدة! ربنا يزيدك نجاح.
      ar: سنة سعيدة! أتمنى لك مزيدًا من النجاح.
      en: Happy New Year! Here's to even more success.
    words: [tahun baru, semakin]
  - id: e10
    type: multiple_choice
    question: Anak-anak sekolah ikut ___ bendera pada 17 Agustus.
    options: [suasana, upacara, sekaligus]
    answer: 1
    explain:
      ar_eg: upacara bendera = تحية العلم.
      ar: upacara bendera = مراسم رفع العلم.
      en: upacara bendera = flag ceremony.
    words: [upacara, suasana, sekaligus]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kamu tahu nggak? Di Indonesia, Natal sama Lebaran sama-sama tanggal merah.
      ar_eg: محمد، تعرف؟ في إندونيسيا الكريسماس والعيد الاتنين أجازة رسمية.
      ar: يا محمد، هل تعلم؟ في إندونيسيا عيد الميلاد والعيد كلاهما عطلة رسمية.
      en: Mohamed, did you know? In Indonesia, Christmas and Lebaran are both public holidays.
    - speaker: Mohamed
      text: Bagus banget. Suasananya rame, ya?
      ar_eg: حلو أوي. الجو بيبقى زحمة وفرحة، صح؟
      ar: جميل جدًا. الأجواء حافلة، أليس كذلك؟
      en: That's lovely. It's really lively, isn't it?
    - speaker: Rina
      text: Iya. Kini banyak orang juga merayakan tahun baru di pantai.
      ar_eg: أيوه. ودلوقتي ناس كتير كمان بتحتفل براس السنة على الشط.
      ar: نعم. والآن يحتفل كثيرون برأس السنة على الشاطئ.
      en: Yes. And now lots of people celebrate New Year on the beach.
    - speaker: Mohamed
      text: Akhir Desember aku ke Bali, sekaligus lihat kembang api.
      ar_eg: آخر ديسمبر رايح بالي، وفي نفس الوقت أتفرج على الصواريخ.
      ar: في آخر ديسمبر سأذهب إلى بالي وأشاهد الألعاب النارية في الوقت نفسه.
      en: At the end of December I'm off to Bali, and I'll catch the fireworks too.
    - speaker: Rina
      text: Asyik! Nantinya kirimkan foto, ya!
      ar_eg: يا سلام! بعدين ابعتلي صور!
      ar: رائع! أرسل لي صورًا لاحقًا!
      en: Brilliant! Send me photos later!
