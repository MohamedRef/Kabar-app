schema: kabar.lesson/v1
id: bipa2.u10.l06
language: id
title: Alergi dan gatal
can_do:
  ar_eg: 'تقول للدكتور عندك إيه: جرح، كسر، حساسية، هرش أو برد، وتفهم الحقنة والفيتامين.'
  ar: 'أن تخبر الطبيب بما لديك: جرح أو كسر أو حساسية أو حكّة أو زكام، وتفهم الحقنة والفيتامين.'
  en: 'Tell the doctor what''s wrong: a cut, a break, an allergy, an itch or flu, and follow talk of injections and vitamins.'
slides:
  - title: Di klinik
    body:
      ar_eg: |
        pasien = المريض اللي عند الدكتور. luka = جرح، patah = مكسور: Kaki saya patah.
        suntik = حقنة. vitamin = فيتامين.
        alergi = حساسية: Saya alergi kacang. gatal = بيهرش (بياكلني). flu = برد، إنفلونزا.
      ar: |
        pasien = المريض عند الطبيب. luka = جرح، patah = مكسور: Kaki saya patah.
        suntik = حقنة. vitamin = فيتامين.
        alergi = حساسية: Saya alergi kacang. gatal = يسبّب حكّة. flu = زكام، إنفلونزا.
      en: |
        pasien = patient. luka = wound, cut, patah = broken: Kaki saya patah.
        suntik = injection. vitamin = vitamin.
        alergi = allergy: Saya alergi kacang. gatal = itchy. flu = flu, a cold.
    examples:
      - text: Kaki saya patah waktu main bola.
        ar_eg: رجلي اتكسرت وأنا بلعب كورة.
        ar: انكسرت ساقي وأنا ألعب الكرة.
        en: I broke my leg playing football.
      - text: Saya alergi kacang. Kulit saya gatal.
        ar_eg: عندي حساسية من الفول السوداني. جلدي بيهرشني.
        ar: لديّ حساسية من الفول السوداني. جلدي يحكّني.
        en: I'm allergic to peanuts. My skin itches.
      - text: Pasien itu perlu suntik.
        ar_eg: المريض ده محتاج حقنة.
        ar: يحتاج ذلك المريض إلى حقنة.
        en: That patient needs an injection.
