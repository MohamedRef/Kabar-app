  - id: e03
    type: listen
    text: Saya alergi kacang. Kulit saya gatal sekali.
    question:
      ar_eg: عنده إيه؟
      ar: ماذا لديه؟
      en: What's his problem?
    options: [حساسية من الفول السوداني, برد, رجل مكسورة]
    answer: 0
    meaning:
      ar_eg: عندي حساسية من الفول السوداني. جلدي بيهرشني أوي.
      ar: لديّ حساسية من الفول السوداني، وجلدي يحكّني كثيرًا.
      en: I'm allergic to peanuts. My skin is really itchy.
    words: [alergi, gatal]
  - id: e04
    type: fill_blank
    sentence: Tangan saya ___ karena jatuh dari sepeda.
    meaning:
      ar_eg: إيدي ___ عشان وقعت من العجلة.
      ar: يدي ___ لأنني سقطت عن الدراجة.
      en: My arm is ___ because I fell off my bike.
    options: [patah, gatal, flu]
    answers: [patah]
    words: [patah, gatal, flu]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي بيتعالج عند الدكتور اسمه إيه؟
      ar: ماذا نسمّي من يعالجه الطبيب؟
      en: What do you call someone a doctor treats?
    options: [pasien, vitamin, luka]
    answer: 0
    explain:
      ar_eg: pasien = مريض.
      ar: pasien = مريض.
      en: pasien = patient.
    words: [pasien, vitamin, luka]
  - id: e06
    type: fill_blank
    sentence: Saya batuk, pilek, dan pusing. Saya ___.
    meaning:
      ar_eg: بكح ومزكّم ودايخ. عندي ___.
      ar: أسعل وأنا مزكوم وأشعر بالدوار. لديّ ___.
      en: I'm coughing, sniffly and dizzy. I've got ___.
    options: [flu, luka, suntik]
    answers: [flu]
    words: [flu, luka, suntik]
  - id: e07
    type: build_sentence
    source:
      ar_eg: كل يوم الصبح باخد فيتامين.
      ar: آخذ فيتامينًا كل صباح.
      en: I take a vitamin every morning.
    answer: Setiap pagi saya minum vitamin.
    distractors: [suntik, luka]
    words: [vitamin]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ada luka kecil di jari saya.
    answers_meaning:
      ar_eg: [فيه جرح صغير في صباعي, صباعي فيه جرح صغير]
      ar: [في إصبعي جرح صغير]
      en: ['There''s a small cut on my finger', I have a little cut on my finger]
    words: [luka]
  - id: e09
    type: speaking
    text: Dokter, saya takut suntik!
    meaning:
      ar_eg: يا دكتور، أنا بخاف من الحقن!
      ar: يا دكتور، أخاف من الحقن!
      en: Doctor, I'm scared of injections!
    words: [suntik]
  - id: e10
    type: multiple_choice
    question: Dokter punya banyak ___ hari ini.
    options: [pasien, alergi, patah]
    answer: 0
    explain:
      ar_eg: 'الدكتور عنده عيانين كتير: pasien.'
      ar: 'لدى الطبيب مرضى كثيرون: pasien.'
      en: 'The doctor has many patients: pasien.'
    words: [pasien, alergi, patah]
dialogue:
  lines:
    - speaker: Dokter
      text: Selamat pagi. Sakit apa?
      ar_eg: صباح الخير. عندك إيه؟
      ar: صباح الخير. ممّ تشكو؟
      en: Good morning. What's wrong?
    - speaker: Mohamed
      text: Kulit saya gatal, Dok. Merah semua.
      ar_eg: جلدي بيهرشني يا دكتور. كله أحمر.
      ar: جلدي يحكّني يا دكتور، وكله أحمر.
      en: My skin itches, doctor. It's all red.
    - speaker: Dokter
      text: Kemarin makan apa? Ada alergi?
      ar_eg: امبارح كلت إيه؟ عندك حساسية؟
      ar: ماذا أكلت أمس؟ هل لديك حساسية؟
      en: What did you eat yesterday? Any allergies?
    - speaker: Mohamed
      text: Saya makan sate kacang. Apa saya alergi kacang?
      ar_eg: كلت ساتيه بالفول السوداني. هو أنا عندي حساسية منه؟
      ar: أكلت ساتيه بالفول السوداني. هل لديّ حساسية منه؟
      en: I had satay with peanut sauce. Am I allergic to peanuts?
    - speaker: Dokter
      text: Ya, ini alergi. Minum obat ini, tidak perlu suntik.
      ar_eg: أيوه، دي حساسية. خد الدوا ده، مش محتاج حقنة.
      ar: نعم، هذه حساسية. تناول هذا الدواء، لا حاجة إلى حقنة.
      en: Yes, it's an allergy. Take this medicine; no injection needed.
    - speaker: Mohamed
      text: Bagus! Saya takut suntik.
      ar_eg: الحمد لله! أنا بخاف من الحقن.
      ar: الحمد لله! أخاف من الحقن.
      en: Phew! I'm scared of injections.
