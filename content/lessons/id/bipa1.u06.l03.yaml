schema: kabar.lesson/v1
id: bipa1.u06.l03
language: id
title: Makan, minum, tidur
can_do:
  ar_eg: تحكي يومك بأفعال كل يوم.
  ar: أن تتحدث عن يومك بأفعال يومية.
  en: Talk about your day with everyday verbs.
slides:
  - title: makan, minum, mandi, tidur
    body:
      ar_eg: |
        أفعال يومية كتير مالهاش بادئة خالص، وبتستخدمها زي ما هي:
        makan (ياكل)، minum (يشرب)، mandi (يستحمى)، tidur (ينام)، bangun (يصحى).
        وفي كلام جاكرتا العادي الناس بتشيل me- كمان: «Saya baca buku»، أو بتقول nulis، nyapu، ngirim، nonton.
      ar: |
        أفعال يومية كثيرة بلا سابقة أصلًا:
        makan (يأكل)، minum (يشرب)، mandi (يستحم)، tidur (ينام)، bangun (يستيقظ).
        وفي عامية جاكرتا تُحذف السابقة أو تُختصر: «Saya baca buku»، nulis، nyapu، ngirim، nonton.
      en: |
        Many everyday verbs have no prefix at all:
        makan (eat), minum (drink), mandi (bathe, shower), tidur (sleep), bangun (wake up).
        Casual Jakarta speech drops or shortens meN- too: "Saya baca buku", nulis, nyapu, ngirim, nonton.
    grammar: id.prefix.men.basic
    examples:
      - text: Saya bangun, lalu mandi.
        ar_eg: بصحى وبعدين أستحمى.
        ar: أستيقظ ثم أستحم.
        en: I wake up, then I shower.
      - text: Aku lagi nonton TV.
        ar_eg: أنا بتفرج على التلفزيون. (عامية)
        ar: أشاهد التلفاز الآن. (عامية)
        en: I'm watching TV. (casual)
exercises:
  - id: e01
    type: fill_blank
    sentence: Ibu ___ ikan.
    meaning:
      ar_eg: ماما بتقلي سمك.
      ar: الأم تقلي السمك.
      en: Mother is frying fish.
    options: [mengoreng, megoreng, menggoreng]
    answers: [menggoreng]
    explain:
      ar_eg: goreng بتبدأ بـ g، والـ g مابتقعش، فيبقى عندك meng + goreng = menggoreng.
      ar: لا تسقط g، فيجتمع حرفا g في meng + goreng = menggoreng.
      en: g doesn't drop, so you get two g's — meng + goreng = menggoreng.
    words: [menggoreng, ikan]
  - id: e02
    type: dictation
    text: Bu Yanti menyapu lantai.
    meaning:
      ar_eg: مدام يانتي بتكنس الأرضية.
      ar: السيدة يانتي تكنس الأرض.
      en: Bu Yanti is sweeping the floor.
    words: [menyapu, lantai]
  - id: e03
    type: speaking
    text: Pak Irwan mengajar bahasa Indonesia.
    meaning:
      ar_eg: أستاذ إروان بيدرّس إندونيسي.
      ar: الأستاذ إروان يدرّس الإندونيسية.
      en: Pak Irwan teaches Indonesian.
    words: [mengajar]
  - id: e04
    type: match_pairs
    pairs:
      - text: makan
        ar_eg: ياكل
        ar: يأكل
        en: to eat
      - text: minum
        ar_eg: يشرب
        ar: يشرب
        en: to drink
      - text: mandi
        ar_eg: يستحمى
        ar: يستحم
        en: to shower
      - text: tidur
        ar_eg: ينام
        ar: ينام
        en: to sleep
      - text: bangun
        ar_eg: يصحى
        ar: يستيقظ
        en: to wake up
    words: [makan, minum, mandi, tidur, bangun]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي فعل مش بياخد meN-؟
      ar: أي فعل لا يأخذ meN-؟
      en: Which verb does not take meN-?
    options: [membaca, menulis, makan]
    answer: 2
    explain:
      ar_eg: makan وminum وmandi وtidur أفعال أساسية من غير meN-.
      ar: makan وminum وmandi وtidur أفعال أساسية بلا meN-.
      en: Makan, minum, mandi and tidur are base verbs without meN-.
    words: [makan]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بصحى، وبعدين بستحمى.
      ar: أستيقظ، ثم أستحم.
      en: I wake up, then I shower.
    answers: ['Saya bangun, lalu mandi.', 'Saya bangun, lalu saya mandi.', 'Aku bangun, lalu mandi.', Saya bangun lalu mandi.]
    words: [bangun, mandi]
  - id: e07
    type: listen
    text: Saya minum kopi.
    options: [Saya makan nasi., Saya minum kopi., Saya minum teh.]
    answer: 1
    meaning:
      ar_eg: بشرب قهوة.
      ar: أشرب القهوة.
      en: I'm drinking coffee.
    words: [minum]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, jam berapa kamu bangun?
      ar_eg: محمد، بتصحى الساعة كام؟
      ar: محمد، متى تستيقظ؟
      en: Mohamed, what time do you wake up?
    - speaker: Mohamed
      text: Saya bangun jam enam, lalu mandi.
      ar_eg: بصحى الساعة ستة، وبعدين بستحمى.
      ar: أستيقظ في السادسة، ثم أستحم.
      en: I wake up at six, then I shower.
    - speaker: Rina
      text: Kamu minum kopi?
      ar_eg: بتشرب قهوة؟
      ar: هل تشرب القهوة؟
      en: Do you drink coffee?
    - speaker: Mohamed
      text: Ya! Saya minum kopi dan makan nasi.
      ar_eg: أيوه! بشرب قهوة وباكل رز.
      ar: نعم! أشرب القهوة وآكل الأرز.
      en: Yes! I drink coffee and eat rice.
    - speaker: Rina
      text: Jam berapa kamu tidur?
      ar_eg: وبتنام الساعة كام؟
      ar: ومتى تنام؟
      en: What time do you go to sleep?
    - speaker: Mohamed
      text: Jam sepuluh malam.
      ar_eg: الساعة عشرة بالليل.
      ar: في العاشرة ليلًا.
      en: At ten at night.
