    ar_eg: ينام
    ar: ينام
    en: to sleep
  - word: bangun
    pos: verb
    ar_eg: يصحى
    ar: يستيقظ
    en: to wake up
  - word: lantai
    pos: noun
    ar_eg: أرضية
    ar: أرضية
    en: floor
  - word: ikan
