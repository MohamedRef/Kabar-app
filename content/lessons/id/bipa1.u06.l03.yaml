schema: kabar.lesson/v1
id: bipa1.u06.l03
language: id
title: Selalu, sering, jarang
can_do:
  ar_eg: تقول بتعمل الحاجة كام مرة، وبأنهي ترتيب.
  ar: أن تقول كم مرة تفعل الشيء، وبأيّ ترتيب.
  en: Say how often and in what order.
slides:
  - title: Selalu → tidak pernah
    body:
      ar_eg: |
        من الأكتر للأقل:
        selalu (دايمًا) — biasanya (عادةً) — sering (كتير) — kadang-kadang (ساعات) — jarang (نادرًا) — tidak pernah (عمري ما).
        مكانها قبل الفعل: Saya sering minum kopi = بشرب قهوة كتير.
        وbiasanya ممكن تيجي في أول الجملة: Biasanya saya bangun jam lima.
      ar: |
        من الأكثر إلى الأقل:
        selalu (دائمًا) — biasanya (عادةً) — sering (كثيرًا) — kadang-kadang (أحيانًا) — jarang (نادرًا) — tidak pernah (أبدًا).
        وموضعها قبل الفعل: Saya sering minum kopi = أشرب القهوة كثيرًا.
        ويجوز تصدير biasanya: Biasanya saya bangun jam lima.
      en: |
        From most to least:
        selalu (always) — biasanya (usually) — sering (often) — kadang-kadang (sometimes) — jarang (rarely) — tidak pernah (never).
        They go before the verb: Saya sering minum kopi = I often drink coffee.
        biasanya can also open the sentence: Biasanya saya bangun jam lima.
    grammar: id.frequency.adverbs
    examples:
      - text: Saya selalu sarapan jam enam.
        ar_eg: دايمًا بفطر الساعة ستة.
        ar: أتناول الفطور دائمًا في السادسة.
        en: I always have breakfast at six.
      - text: Dia jarang makan pedas.
        ar_eg: نادرًا لما بياكل حراق.
        ar: نادرًا ما يأكل الطعام الحار.
        en: He/She rarely eats spicy food.
  - title: Setiap hari, lima kali sehari
    body:
      ar_eg: |
        - setiap = كل: setiap hari = كل يوم، setiap pagi = كل صبح.
        - kali = مرة: dua kali sehari = مرتين في اليوم، sekali seminggu = مرة في الأسبوع.
        وsalat (وكتير بيكتبوها sholat) جاية من العربي «صلاة».
      ar: |
        - setiap = كل: setiap hari = كل يوم، setiap pagi = كل صباح.
        - kali = مرة: dua kali sehari = مرتان في اليوم، sekali seminggu = مرة في الأسبوع.
        وsalat (وتُكتب كثيرًا sholat) من العربية «صلاة».
      en: |
        - setiap = every: setiap hari = every day, setiap pagi = every morning.
        - kali = time(s): dua kali sehari = twice a day, sekali seminggu = once a week.
        salat (often written sholat) comes from Arabic «صلاة».
    grammar: id.frequency.adverbs
    examples:
      - text: Saya salat lima kali sehari.
        ar_eg: بصلي خمس مرات في اليوم.
        ar: أصلي خمس مرات في اليوم.
        en: I pray five times a day.
  - title: Kemarin, tadi, sekarang, nanti
    body:
      ar_eg: |
        الفعل مابيتغيرش، فكلمة الوقت هي اللي بتقول إمتى:
        kemarin (امبارح) — tadi (من شوية، النهارده) — sekarang (دلوقتي) — nanti (بعدين، النهارده) — besok (بكرة).
        tadi pagi = النهارده الصبح (اللي فات)، nanti malam = بالليل النهارده (اللي جاي).
        كلمة وقت واحدة كفاية: Kemarin saya ke pasar = امبارح رحت السوق.
      ar: |
        لأن الفعل لا يتصرف، تحدد ظروف الزمان وقت الحدث:
        kemarin (أمس) — tadi (قبل قليل من اليوم) — sekarang (الآن) — nanti (لاحقًا اليوم) — besok (غدًا).
        tadi pagi = هذا الصباح (الماضي)، nanti malam = الليلة (القادمة).
        ويكفي ظرف واحد: Kemarin saya ke pasar = ذهبت أمس إلى السوق.
      en: |
        The verb never changes, so a time word tells you when:
        kemarin (yesterday) — tadi (earlier today) — sekarang (now) — nanti (later today) — besok (tomorrow).
        tadi pagi = this (past) morning, nanti malam = tonight (still to come).
        One time word is enough: Kemarin saya ke pasar = Yesterday I went to the market.
    grammar: id.time.sequence
    examples:
      - text: Tadi pagi saya ke kantor.
        ar_eg: النهارده الصبح رحت المكتب.
        ar: ذهبت هذا الصباح إلى المكتب.
        en: This morning I went to the office.
      - text: Nanti malam kita makan di Blok M.
        ar_eg: بالليل هناكل في بلوك إم.
        ar: سنأكل الليلة في بلوك إم.
        en: Tonight we'll eat at Blok M.
  - title: Sebelum, sesudah, lalu
    body:
      ar_eg: |
        عشان ترتب الأحداث:
        - sebelum = قبل: Sebelum tidur, saya membaca buku = قبل ما أنام بقرا كتاب.
        - sesudah / setelah = بعد: Setelah makan, kami jalan-jalan = بعد الأكل بنتمشى.
        - lalu = وبعدين (في الحكاية).
      ar: |
        لترتيب الأحداث:
        - sebelum = قبل: Sebelum tidur, saya membaca buku = أقرأ كتابًا قبل النوم.
        - sesudah / setelah = بعد: Setelah makan, kami jalan-jalan = بعد الأكل نتنزه.
        - lalu = ثم.
      en: |
        To put events in order:
        - sebelum = before: Sebelum tidur, saya membaca buku = Before sleeping, I read a book.
        - sesudah / setelah = after: Setelah makan, kami jalan-jalan = After eating, we go for a stroll.
        - lalu = then (in a story).
    grammar: id.time.sequence
    examples:
      - text: Saya bangun, lalu salat subuh.
        ar_eg: بصحى، وبعدين بصلي الصبح.
        ar: أستيقظ ثم أصلي الفجر.
        en: I wake up, then I pray the dawn prayer.
  - title: Di sini, di situ, di sana
    body:
      ar_eg: |
        الإندونيسي عنده ٣ أماكن بدل اتنين:
        - sini = هنا، جنبي.
        - situ = عندك، جنب اللي بكلمه.
        - sana = هناك، بعيد عن الاتنين.
        وعلى طول قبلها di (في)، ke (لـ)، dari (من): di sini، ke sana، dari situ.
        Ke sini! = تعالى هنا!
      ar: |
        للإشارة المكانية ثلاث درجات:
        - sini = هنا، قرب المتكلم.
        - situ = هناك، قرب المخاطب.
        - sana = هنالك، بعيدًا عنهما.
        وتسبقها di (في) أو ke (إلى) أو dari (من): di sini، ke sana، dari situ.
        Ke sini! = تعالَ إلى هنا!
      en: |
        Indonesian has three distances instead of two:
        - sini = here, near me.
        - situ = there, near you.
        - sana = over there, away from both of us.
        Always after di (at), ke (to) or dari (from): di sini, ke sana, dari situ.
        Ke sini! = Come here!
    grammar: id.demonstrative.sini-situ-sana
    examples:
      - text: Tasnya di situ.
        ar_eg: الشنطة عندك (جنبك).
        ar: الحقيبة عندك.
        en: The bag is there (by you).
      - text: Masjidnya di sana.
        ar_eg: الجامع هناك.
        ar: المسجد هناك.
        en: The mosque is over there.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: selalu
        ar_eg: دايمًا
        ar: دائمًا
        en: always
      - text: sering
        ar_eg: كتير
        ar: كثيرًا
        en: often
      - text: kadang-kadang
        ar_eg: ساعات
        ar: أحيانًا
        en: sometimes
      - text: jarang
        ar_eg: نادرًا
        ar: نادرًا
        en: rarely
      - text: tidak pernah
        ar_eg: عمري ما / أبدًا
        ar: أبدًا
        en: never
    words: [selalu, sering, kadang-kadang, jarang, tidak pernah]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة ترتيبها صح؟ (بشرب قهوة كتير)
      ar: أيّ جملة ترتيبها صحيح؟ (أشرب القهوة كثيرًا)
      en: Which sentence has the right word order? (I often drink coffee)
    options: ["Saya sering minum kopi.", "Sering minum saya kopi.", "Saya minum kopi sering."]
    answer: 0
    explain:
      ar_eg: كلمة التكرار بتيجي قبل الفعل على طول.
      ar: ظرف التكرار يسبق الفعل.
      en: The frequency word goes right before the verb.
    words: [sering, kopi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الساعة ٢ الضهر، وعايز تتكلم عن الساعة ٧ الصبح النهارده. تقول إيه؟
      ar: الساعة الثانية ظهرًا، وتريد الحديث عن السابعة صباح اليوم. ماذا تقول؟
      en: It's 2 p.m. and you're talking about 7 a.m. today. What do you say?
    options: ["nanti pagi", "tadi pagi", "besok pagi"]
    answer: 1
    explain:
      ar_eg: tadi = اللي فات النهارده. nanti = اللي جاي.
      ar: tadi لما مضى من اليوم، وnanti لما سيأتي.
      en: tadi = earlier today; nanti = later.
    words: [tadi]
  - id: e04
    type: listen
    text: Saya selalu sarapan jam enam.
    options: ["Saya jarang sarapan jam enam.", "Saya sering sarapan jam enam.", "Saya selalu sarapan jam enam."]
    answer: 2
    words: [selalu, sarapan]
  - id: e05
    type: fill_blank
    sentence: ___ tidur, saya membaca buku.
    meaning:
      ar_eg: قبل ما أنام بقرا كتاب.
      ar: أقرأ كتابًا قبل النوم.
      en: Before sleeping, I read a book.
    options: ["Sebelum", "Sesudah", "Sekarang"]
    answers: [Sebelum]
    words: [sebelum]
  - id: e06
    type: fill_blank
    sentence: Tasmu di ___.
    meaning:
      ar_eg: شنطتك عندك (جنبك).
      ar: حقيبتك عندك (بجانبك).
      en: Your bag is there (right by you).
    options: ["sini", "situ", "sana"]
    answers: [situ]
    explain:
      ar_eg: الحاجة جنب اللي بتكلمه، يبقى situ.
      ar: الشيء قرب المخاطب فيُشار إليه بـ situ.
      en: It's next to the person you're talking to, so situ.
    words: [situ, tas]
  - id: e07
    type: fill_blank
    sentence: Saya salat lima ___ sehari.
    meaning:
      ar_eg: بصلي خمس مرات في اليوم.
      ar: أصلي خمس مرات في اليوم.
      en: I pray five times a day.
    options: ["kali", "hari", "jam"]
    answers: [kali]
    words: [kali, salat]
  - id: e08
    type: build_sentence
    source:
      ar_eg: عادةً بصحى الساعة خمسة.
      ar: عادةً أستيقظ في الساعة الخامسة.
      en: I usually wake up at five.
    answer: Biasanya saya bangun jam lima.
    alternatives: ["Saya biasanya bangun jam lima."]
    distractors: [selalu, tidur]
    words: [biasanya, bangun]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: تعالى هنا!
      ar: تعالَ إلى هنا!
      en: Come here!
    answers:
      - Ke sini!
      - Ke sini
      - Sini!
      - Sini
      - Datang ke sini!
      - Ayo ke sini!
    words: [sini]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا نادرًا لما بتفرج على التلفزيون.
      ar: نادرًا ما أشاهد التلفاز.
      en: I rarely watch TV.
    answers:
      - Saya jarang menonton TV.
      - Saya jarang menonton TV
      - Aku jarang menonton TV.
      - Saya jarang menonton televisi.
      - Saya jarang nonton TV.
      - Aku jarang nonton TV.
    words: [jarang, menonton]
  - id: e11
    type: translate
    direction: from_target
    source_text: Setelah makan, kami jalan-jalan.
    answers_meaning:
      ar_eg: ["بعد الأكل بنتمشى.", "بعد الأكل اتفسحنا", "بعد ما كلنا اتمشينا"]
      ar: ["بعد الأكل نتنزه.", "بعد الطعام تنزهنا", "بعد أن أكلنا تمشّينا"]
      en: ["After eating, we go for a stroll.", "After eating, we went for a walk", "After the meal we went out"]
    words: [setelah, jalan-jalan]
  - id: e12
    type: dictation
    text: Kemarin saya ke pasar.
    meaning:
      ar_eg: امبارح رحت السوق.
      ar: ذهبت أمس إلى السوق.
      en: Yesterday I went to the market.
    words: [kemarin, pasar]
  - id: e13
    type: speaking
    text: Sebelum tidur, saya membaca buku.
    meaning:
      ar_eg: قبل ما أنام بقرا كتاب.
      ar: أقرأ كتابًا قبل النوم.
      en: Before sleeping, I read a book.
    words: [sebelum]
dialogue:
  title: Makan di Blok M
  lines:
    - speaker: Rina
      text: Mohamed, kamu sering makan di Blok M?
      ar_eg: محمد، إنت بتاكل في بلوك إم كتير؟
      ar: يا محمد، هل تأكل في بلوك إم كثيرًا؟
      en: Mohamed, do you often eat at Blok M?
    - speaker: Mohamed
      text: Kadang-kadang. Biasanya saya makan di rumah.
      ar_eg: ساعات. عادةً باكل في البيت.
      ar: أحيانًا. عادةً آكل في البيت.
      en: Sometimes. I usually eat at home.
    - speaker: Rina
      text: Saya sering makan di sini sesudah bekerja.
      ar_eg: أنا باكل هنا كتير بعد الشغل.
      ar: آكل هنا كثيرًا بعد العمل.
      en: I often eat here after work.
    - speaker: Mohamed
      text: Sate di sana enak?
      ar_eg: الساتيه اللي هناك حلو؟
      ar: هل الساتيه هناك لذيذ؟
      en: Is the satay over there good?
    - speaker: Rina
      text: Enak! Tadi siang saya makan sate di sana.
      ar_eg: حلو! النهارده الضهر كلت ساتيه هناك.
      ar: لذيذ! أكلت الساتيه هناك ظهر اليوم.
      en: It's good! I had satay there at lunchtime today.
    - speaker: Mohamed
      text: Oke, nanti malam kita ke sana!
      ar_eg: خلاص، بالليل نروح هناك!
      ar: حسنًا، لنذهب إلى هناك الليلة!
      en: OK, tonight we'll go there!
