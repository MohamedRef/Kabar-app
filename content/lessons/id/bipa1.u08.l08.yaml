schema: kabar.lesson/v1
id: bipa1.u08.l08
language: id
title: Siapa dia?
can_do:
  ar_eg: تخمّن مين الشخص من وصفه.
  ar: أن تخمّن الشخص من وصفه.
  en: Guess a person from a description.
slides:
  - title: Tebak, siapa dia?
    body:
      ar_eg: |-
        لعبة النهارده: حد يوصف، والتاني يخمّن (tebak = خمّن).
        كل اللي محتاجه من الوحدة دي:
        - الصفة على طول: Dia tinggi. Orangnya sabar.
        - tidak مع الصفة، وbukan مع الاسم: Dia tidak pendek. Dia bukan Raka.
        - yang عشان تميّز: Dia yang pakai kacamata.
        لو التخمين صح قول Betul! (صح!). ولو غلط: Bukan! أو Salah! (غلط!).
      ar: |-
        لعبة اليوم: يصف أحدهم شخصًا ويخمّن الآخر (tebak = خمِّن).
        وكل ما تحتاجه من الوحدة:
        - الصفة مباشرة: Dia tinggi. Orangnya sabar.
        - tidak مع الصفة وbukan مع الاسم: Dia tidak pendek. Dia bukan Raka.
        - yang للتمييز: Dia yang pakai kacamata.
        إن أصاب التخمين فقل Betul! (صحيح!)، وإن أخطأ فقل Bukan! أو Salah! (خطأ!).
      en: |-
        Today's game: one person describes, the other guesses (tebak = guess).
        Everything you need from this unit:
        - Adjective straight after the person: Dia tinggi. Orangnya sabar.
        - tidak with adjectives, bukan with nouns: Dia tidak pendek. Dia bukan Raka.
        - yang to single someone out: Dia yang pakai kacamata.
        If the guess is right, say Betul! (Right!). If not, Bukan! or Salah! (Wrong!).
    grammar: id.negation.tidak-bukan
    examples:
      - text: Dia bukan Raka. Dia yang pakai kacamata.
        ar_eg: هو مش راكا. هو اللي لابس نضارة.
        ar: ليس راكا، بل الذي يلبس نظارة.
        en: He's not Raka. He's the one wearing glasses.
      - text: Ni Luh yang rambutnya panjang? — Betul!
        ar_eg: ني لوه اللي شعرها طويل؟ — صح!
        ar: ني لوه ذات الشعر الطويل؟ — صحيح!
        en: Ni Luh, the one with long hair? — Right!
exercises:
  - id: e01
    type: multiple_choice
    question: Tebak! Rina bilang dia guru. Orangnya sabar, dan dia pakai kacamata. Siapa dia?
    options: [Ni Luh, Pak Irwan, Raka]
    answer: 1
    explain:
      ar_eg: Rina bilang = رينا بتقول. مدرس صبور ولابس نضارة، يبقى الأستاذ إروان.
      ar: 'Rina bilang = تقول رينا. معلم صبور يلبس نظارة: إنه الأستاذ إروان.'
      en: 'Rina bilang = Rina says. A patient teacher in glasses: Pak Irwan.'
    words: [tebak, bilang, sabar, kacamata, guru]
  - id: e02
    type: listen
    text: Salah, dia bukan Raka.
    options: ['Salah, dia bukan Raka.', 'Salah, dia tidak Raka.', 'Betul, dia Raka.']
    answer: 0
    meaning:
      ar_eg: غلط، ده مش راكا.
      ar: خطأ، ليس راكا.
      en: Wrong, he isn't Raka.
    words: [salah, bukan]
  - id: e03
    type: fill_blank
    sentence: Kata Rina, Raka lucu, tapi dia ___ sabar.
    meaning:
      ar_eg: على حسب كلام رينا، راكا دمه خفيف، بس مش صبور.
      ar: على حدّ قول رينا، راكا ظريف، لكنه ليس صبورًا.
      en: According to Rina, Raka is funny, but he isn't patient.
    answers: [tidak, nggak, gak]
    explain:
      ar_eg: sabar صفة، يبقى tidak.
      ar: sabar صفة، فتُنفى بـ tidak.
      en: sabar is an adjective → tidak.
    words: [kata, tidak, sabar, lucu]
  - id: e04
    type: fill_blank
    sentence: Salah! Dia ___ guru. Dia dokter.
    meaning:
      ar_eg: غلط! هي مش مدرسة. هي دكتورة.
      ar: خطأ! ليست معلمة، إنها طبيبة.
      en: Wrong! She isn't a teacher. She's a doctor.
    answers: [bukan]
    explain:
      ar_eg: guru اسم، يبقى bukan.
      ar: guru اسم، فيُنفى بـ bukan.
      en: guru is a noun → bukan.
    words: [salah, bukan, guru]
  - id: e05
    type: build_sentence
    source:
      ar_eg: رينا بتقول إنه إنسان صبور وشاطر.
      ar: تقول رينا إنه شخص صبور وذكي.
      en: Rina says he's a patient and smart person.
    answer: Kata Rina, orangnya sabar dan pintar.
    alternatives: ['Kata Rina, orangnya pintar dan sabar.']
    distractors: [tidak, yang]
    words: [kata, sabar, pintar]
    explain:
      ar_eg: Kata Rina (رينا بتقول) + orangnya sabar dan pintar. tidak وyang زيادة.
      ar: Kata Rina، orangnya sabar dan pintar. tidak وyang زائدتان.
      en: Kata Rina, + orangnya sabar dan pintar. tidak and yang are extra.
  - id: e06
    type: build_sentence
    source:
      ar_eg: شعر راكا عادي خالص.
      ar: شعر راكا عادي تمامًا.
      en: Raka's hair is just normal.
    answer: Rambut Raka biasa saja.
    distractors: [panjang, yang]
    explain:
      ar_eg: biasa = عادي، وbiasa saja (في الشارع biasa aja) = عادي خالص، مفيهوش حاجة مميزة.
      ar: biasa = عادي، وbiasa saja (في العامية biasa aja) = عادي تمامًا.
      en: biasa = normal; biasa saja (street biasa aja) = nothing special.
    words: [biasa, rambut]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: رينا بتقول إنه مدرس.
      ar: تقول رينا إنه معلم.
      en: Rina says he's a teacher.
    answers: ['Kata Rina, dia guru.', 'Kata Rina dia guru.', 'Rina bilang dia guru.', 'Rina bilang, dia guru.', 'Kata Rina, dia seorang guru.', 'Rina bilang dia seorang guru.']
    explain:
      ar_eg: 'kata Rina = على حسب كلام رينا (أول الجملة)، وRina bilang = رينا بتقول: الاتنين صح، وbilang أخف وأكتر في الكلام.'
      ar: 'kata Rina = على حدّ قول رينا (في أول الجملة)، وRina bilang = تقول رينا: كلاهما صحيح، وbilang أكثر في الكلام اليومي.'
      en: 'kata Rina = according to Rina (at the start), Rina bilang = Rina says: both work, and bilang is the everyday one.'
    words: [kata, bilang, guru]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هي مش ني لوه. شعر ني لوه طويل، مش عادي.
      ar: ليست ني لوه. شعر ني لوه طويل، ليس عاديًّا.
      en: She's not Ni Luh. Ni Luh's hair is long, not normal.
    answers: ['Dia bukan Ni Luh. Rambut Ni Luh panjang, tidak biasa.', 'Dia bukan Ni Luh. Rambut Ni Luh panjang, tidak biasa', 'Dia bukan Ni Luh, rambut Ni Luh panjang, tidak biasa.', 'Itu bukan Ni Luh. Rambut Ni Luh panjang, tidak biasa.', 'Dia bukan Ni Luh. Rambut Ni Luh panjang, nggak biasa.', 'Bukan Ni Luh. Rambut Ni Luh panjang, tidak biasa.']
    explain:
      ar_eg: Ni Luh اسم، يبقى bukan؛ biasa صفة، يبقى tidak biasa. وrambut Ni Luh = شعر ني لوه (الصاحب بعد الحاجة).
      ar: Ni Luh اسم فيُنفى بـ bukan، وbiasa صفة فتُنفى بـ tidak. وrambut Ni Luh = شعر ني لوه.
      en: Ni Luh is a noun → bukan; biasa is an adjective → tidak biasa. rambut Ni Luh = Ni Luh's hair (owner after the thing).
    words: [bukan, biasa, rambut, panjang]
  - id: e09
    type: fill_blank
    sentence: Tebak, siapa dia? — Raka? — ___! Dia Pak Irwan.
    meaning:
      ar_eg: خمّن، مين ده؟ — راكا؟ — غلط! ده الأستاذ إروان.
      ar: خمّن، من هذا؟ — راكا؟ — خطأ! إنه الأستاذ إروان.
      en: Guess who he is! — Raka? — Wrong! It's Pak Irwan.
    options: [Salah, Betul, Tebak]
    answers: [Salah]
    words: [tebak, salah]
    explain:
      ar_eg: خمّنت راكا وهو بك إروان، فده Salah = غلط. Betul = صح.
      ar: "الجواب خطأ: Salah. Betul = صحيح."
      en: "Raka is wrong: Salah!"
  - id: e10
    type: speaking
    text: Tebak, siapa dia? Rina bilang dia tinggi, rambutnya biasa, dan orangnya lucu.
    meaning:
      ar_eg: خمّن مين ده؟ رينا بتقول إنه طويل، شعره عادي، ودمه خفيف.
      ar: خمّن من هو؟ تقول رينا إنه طويل، شعره عادي، وظريف.
      en: Guess who? Rina says he's tall, his hair is normal, and he's funny.
    words: [tebak, bilang, tinggi, rambut, biasa, lucu]
dialogue:
  title: Tebak-tebakan di Petak Sembilan
  lines:
    - speaker: Rina
      text: Mohamed, coba tebak. Siapa dia? Orangnya sabar dan pintar.
      ar_eg: محمد، جرّب تخمّن. مين ده؟ إنسان صبور وشاطر.
      ar: 'يا محمد، حاول أن تخمّن: من هو؟ إنه صبور وذكي.'
      en: Mohamed, try to guess. Who is it? He's patient and smart.
    - speaker: Mohamed
      text: Hmm… Raka, bukan?
      ar_eg: امم… راكا، مش كده؟
      ar: همم… راكا، أليس كذلك؟
      en: Hmm… Raka, isn't it?
    - speaker: Rina
      text: Bukan! Raka lucu, tapi dia nggak sabar.
      ar_eg: لأ! راكا دمه خفيف، بس مش صبور خالص.
      ar: لا! راكا ظريف، لكنه ليس صبورًا.
      en: No! Raka is funny, but he isn't patient.
    - speaker: Mohamed
      text: Dia guru?
      ar_eg: هو مدرس؟
      ar: هل هو معلم؟
      en: Is he a teacher?
    - speaker: Rina
      text: Ya, dia guru. Dia yang pakai kacamata.
      ar_eg: أيوه، مدرس. هو اللي لابس نضارة.
      ar: نعم، معلم. هو الذي يلبس نظارة.
      en: Yes, he's a teacher. He's the one wearing glasses.
    - speaker: Mohamed
      text: Oh, Pak Irwan!
      ar_eg: آه، الأستاذ إروان!
      ar: آه، الأستاذ إروان!
      en: Oh, Pak Irwan!
new_words:
  - word: tebak
    pos: verb
    ar_eg: يخمّن
    ar: يخمّن
    en: to guess
  - word: salah
    pos: adjective
    ar_eg: غلط
    ar: خطأ
    en: wrong
  - word: bilang
    pos: verb
    ar_eg: يقول، يقول لـ (عامي، زي «قال»)؛ الرسمي berkata
    ar: يقول (عامّية)؛ والفصيح berkata
    en: to say, to tell (everyday; formal berkata)
  - word: kata
    pos: noun
    ar_eg: كلمة؛ kata Rina = على حسب كلام رينا
    ar: كلمة؛ kata Rina = على حدّ قول رينا
    en: word; kata Rina = according to Rina, Rina says
  - word: biasa
    pos: adjective
    ar_eg: عادي (biasa saja، في الشارع biasa aja = عادي خالص)
    ar: عادي (biasa saja، وفي العامية biasa aja = عادي تمامًا)
    en: normal, usual (biasa saja, street biasa aja = nothing special)
