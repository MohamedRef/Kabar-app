  - id: e03
    type: listen
    text: Suling ini dari plastik. Harganya murah.
    question:
      ar_eg: الناي ده معمول من إيه؟
      ar: مِمَّ صُنع هذا الناي؟
      en: What is the flute made of?
    options: [بلاستيك, حديد, أنتيكة]
    answer: 0
    meaning:
      ar_eg: الناي ده بلاستيك. سعره رخيص.
      ar: هذا الناي من البلاستيك، وسعره رخيص.
      en: This flute is plastic. It's cheap.
    words: [plastik]
  - id: e04
    type: fill_blank
    sentence: Gendang ini lebih ___ daripada gendang itu. Suaranya lebih keras.
    meaning:
      ar_eg: الطبلة دي ___ من الطبلة دي. صوتها أعلى.
      ar: هذا الطبل ___ من ذاك، وصوته أعلى.
      en: This drum is ___ than that one. It's louder.
    options: [lebar, kasar, antik]
    answers: [lebar]
    words: [lebar, kasar, antik]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حاجة قديمة من سنة ١٩٠٠ وليها قيمة. هي…؟
      ar: شيء قديم من عام ١٩٠٠ وذو قيمة. هو…؟
      en: Something old from 1900 and valuable. It's…?
    options: [antik, unik, plastik]
    answer: 0
    explain:
      ar_eg: antik = أنتيكة. unik فريد، وplastik بلاستيك.
      ar: antik أثري، أما unik ففريد وplastik بلاستيك.
      en: antik = antique; unik is unique and plastik plastic.
    words: [antik, unik, plastik]
  - id: e06
    type: fill_blank
    sentence: Kain ini ___, tidak lembut.
    meaning:
      ar_eg: القماش ده ___، مش ناعم.
      ar: هذا القماش ___، ليس ناعمًا.
      en: This cloth is ___, not soft.
    options: [kasar, asli, tebal]
    answers: [kasar]
    words: [kasar, asli, tebal]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الكرسي ده حديد، عشان كده تقيل.
      ar: هذا الكرسي من حديد، لذا هو ثقيل.
      en: This chair is iron, so it's heavy.
    answer: Kursi ini dari besi, jadi berat.
    distractors: [plastik, lebar]
    words: [besi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Batik ini asli dari Solo.
    answers_meaning:
      ar_eg: [الباتيك ده أصلي من سولو, دا باتيك أصلي من سولو]
      ar: [هذا الباتيك أصلي من سولو, هذا باتيك أصلي من سولو]
      en: ['This batik is genuine, from Solo', This is genuine batik from Solo]
    words: [asli]
  - id: e09
    type: speaking
    text: 'Gendang ini unik: lebar dan tebal.'
    meaning:
      ar_eg: 'الطبلة دي فريدة: عريضة وتخينة.'
      ar: 'هذا الطبل فريد: عريض وسميك.'
      en: 'This drum is unique: wide and thick.'
    words: [unik, lebar, tebal]
  - id: e10
    type: multiple_choice
    question: Pintu itu dari ___, jadi berat sekali.
    options: [besi, plastik, kasar]
    answer: 0
    explain:
      ar_eg: 'الحديد تقيل: besi.'
      ar: 'الحديد ثقيل: besi.'
      en: 'Iron is heavy: besi.'
    words: [besi, plastik]
dialogue:
  lines:
    - speaker: Mohamed
      text: Gendang ini lebih lebar daripada gendang itu.
      ar_eg: الطبلة دي أعرض من الطبلة دي.
      ar: هذا الطبل أعرض من ذاك.
      en: This drum is wider than that one.
    - speaker: Penjual
      text: Ya, Pak. Yang ini asli dari Bali, tidak dari plastik.
      ar_eg: أيوه يا أستاذ. دي أصلية من بالي، مش بلاستيك.
      ar: نعم يا سيدي، هذا أصلي من بالي، ليس من البلاستيك.
      en: Yes, sir. This one's genuine, from Bali, not plastic.
    - speaker: Mohamed
      text: Yang plastik lebih murah?
      ar_eg: والبلاستيك أرخص؟
      ar: وهل البلاستيكي أرخص؟
      en: Is the plastic one cheaper?
    - speaker: Penjual
      text: Lebih murah, tapi suaranya kurang bagus.
      ar_eg: أرخص، بس صوته مش حلو قوي.
      ar: أرخص، لكن صوته أقلّ جودة.
      en: Cheaper, but it doesn't sound as good.
    - speaker: Mohamed
      text: Dan kursi besi itu? Unik sekali!
      ar_eg: والكرسي الحديد ده؟ فريد جدًا!
      ar: وذلك الكرسي الحديدي؟ فريد جدًا!
      en: And that iron chair? It's so unusual!
    - speaker: Penjual
      text: Itu antik, Pak. Dari tahun 1930.
      ar_eg: دا أنتيكة يا أستاذ. من سنة ١٩٣٠.
      ar: إنه أثري يا سيدي، من عام ١٩٣٠.
      en: That's an antique, sir. From 1930.
