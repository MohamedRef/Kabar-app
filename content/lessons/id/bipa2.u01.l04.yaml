schema: kabar.lesson/v1
id: bipa2.u01.l04
language: id
title: Mencari gendang
can_do:
  ar_eg: 'تشتري آلة في محل: تقارن العرض والسُّمك والملمس، وتسأل أصلية ولا بلاستيك، أنتيكة ولا فريدة.'
  ar: 'أن تشتري آلة من متجر: تقارن العرض والسُّمك والملمس، وتسأل أصلية أم بلاستيك، أثرية أم فريدة.'
  en: 'Buy an instrument in a shop: compare width, thickness and texture, and ask if it''s genuine or plastic, antique or unique.'
slides:
  - title: Asli atau plastik?
    body:
      ar_eg: |
        lebar = عريض، tebal = تخين، kasar = خشن (عكس lembut).
        الخامات: besi = حديد، plastik = بلاستيك.
        asli = أصلي (من «أصل»). antik = أنتيكة: قديم وليه قيمة. unik = فريد ومختلف.
        ومع lebih … daripada: Gendang ini lebih lebar daripada gendang itu.
      ar: |
        lebar = عريض، tebal = سميك، kasar = خشن (ضدّ lembut).
        المواد: besi = حديد، plastik = بلاستيك.
        asli = أصلي (من «أصل»). antik = أثري: قديم ذو قيمة. unik = فريد.
        ومع lebih … daripada: Gendang ini lebih lebar daripada gendang itu.
      en: |
        lebar = wide, tebal = thick, kasar = rough (the opposite of lembut).
        Materials: besi = iron, plastik = plastic.
        asli = genuine, original (from Arabic أصل). antik = antique. unik = unique.
        With lebih … daripada: Gendang ini lebih lebar daripada gendang itu.
    examples:
      - text: Gendang ini lebih lebar daripada gendang itu.
        ar_eg: الطبلة دي أعرض من الطبلة دي.
        ar: هذا الطبل أعرض من ذاك.
        en: This drum is wider than that one.
      - text: Suling ini asli, bukan plastik.
        ar_eg: الناي ده أصلي، مش بلاستيك.
        ar: هذا الناي أصلي، ليس بلاستيكًا.
        en: This flute is genuine, not plastic.
      - text: Kursi besi itu antik.
        ar_eg: الكرسي الحديد ده أنتيكة.
        ar: ذلك الكرسي الحديدي أثري.
        en: That iron chair is an antique.
exercises:
