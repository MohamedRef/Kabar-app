schema: kabar.lesson/v1
id: bipa6.u07.l11
language: id
title: Aturan dengan kata sederhana
can_do:
  ar_eg: تشرح بند قانوني بكلام بسيط لأي حد.
  ar: أن تشرح بندًا قانونيًّا بكلام بسيط لأيّ شخص.
  en: Explain a legal rule in plain words to anyone.
slides:
  - title: Artinya …
    grammar: id.register.legal
    body:
      ar_eg: |
        علشان تبسّط بند: لاقي مين، ولازم ولا ممنوع، وفي أنهي حالة. وبعدين ابدأ بـ «Artinya, …» (يعني …).
        - قانوني (مكتوب للدرس): Setiap orang yang melakukan pelanggaran sebagaimana dimaksud dalam Pasal 5 dikenai denda paling banyak Rp500.000,00.
        - بسيط: Artinya, kalau kamu melanggar aturan di Pasal 5, kamu bisa kena denda sampai lima ratus ribu rupiah.
        خلي بالك: paling banyak = بالكتير، paling sedikit = على الأقل.
        - في الشارع: telat = terlambat (متأخر)، balikin = kembalikan (رجّع).
      ar: |
        لتبسيط بند: حدّد مَن، وهل هو واجب أم محظور، وفي أيّ حالة، ثمّ ابدأ بـ «Artinya, …» (أي …).
        - قانوني (مكتوب للدرس): Setiap orang yang melakukan pelanggaran sebagaimana dimaksud dalam Pasal 5 dikenai denda paling banyak Rp500.000,00.
        - مبسّط: Artinya, kalau kamu melanggar aturan di Pasal 5, kamu bisa kena denda sampai lima ratus ribu rupiah.
        وانتبه: paling banyak = على الأكثر، وpaling sedikit = على الأقلّ.
        - في كلام الشارع: telat = terlambat (متأخّر)، balikin = kembalikan (أعِد).
      en: |
        To simplify a rule: find who, must or mustn't, and in which case. Then start with "Artinya, …" (In plain terms, …).
        - Legal (written for the lesson): Setiap orang yang melakukan pelanggaran sebagaimana dimaksud dalam Pasal 5 dikenai denda paling banyak Rp500.000,00.
        - Plain: Artinya, kalau kamu melanggar aturan di Pasal 5, kamu bisa kena denda sampai lima ratus ribu rupiah.
        Note: paling banyak = at most, paling sedikit = at least.
        - On the street: telat = terlambat (late), balikin = kembalikan (give back).
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: denda
        ar_eg: غرامة
        ar: غرامة
        en: fine (penalty)
      - text: berlaku
        ar_eg: ساري
        ar: نافذ / ساري المفعول
        en: to be valid, to apply
      - text: persyaratan
        ar_eg: شروط
        ar: شروط
        en: requirements
      - text: pelanggaran
        ar_eg: مخالفة
        ar: مخالفة
        en: violation, offence
    words: [denda, berlaku, persyaratan, pelanggaran]
  - id: e02
    type: match_pairs
    pairs:
      - text: diadili
        ar_eg: اتحاكم
        ar: حوكم
        en: to be tried (in court)
      - text: memalsukan
        ar_eg: يزوّر
        ar: يزوّر
        en: to forge, falsify
      - text: mahkamah
        ar_eg: محكمة عليا
        ar: محكمة
        en: (high) court
      - text: menggugat
        ar_eg: يرفع قضية
        ar: يقاضي، يرفع دعوى
        en: to sue
      - text: asasi
        ar_eg: أساسي (hak asasi)
        ar: أساسي
        en: basic (hak asasi manusia = human rights)
    words: [diadili, memalsukan, mahkamah, menggugat, asasi]
  - id: e03
    type: fill_blank
    sentence: Kartu mahasiswa ini ___ sampai tahun 2027.
    meaning:
      ar_eg: كارنيه الجامعة ده ساري لحد سنة 2027.
      ar: هذه البطاقة الجامعية سارية حتّى عام 2027.
      en: This student card is valid until 2027.
    options: [berlaku, denda, pelanggaran]
    answers: [berlaku]
    words: [berlaku]
  - id: e04
    type: listen
    text: Persyaratannya hanya dua, paspor dan foto.
    question:
      ar_eg: الشروط إيه؟
      ar: ما الشروط؟
      en: What are the requirements?
    options:
      - باسبور وصورة.
      - باسبور بس.
      - جواب وفلوس.
    answer: 0
    words: [persyaratan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الركن هنا مخالفة.
      ar: الوقوف هنا مخالفة.
      en: Parking here is an offence.
    answer: Parkir di sini adalah pelanggaran.
    distractors: [denda, berlaku]
    words: [pelanggaran]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة بتبسّط «Dalam hal persyaratan tidak lengkap, permohonan tidak diproses»؟
      ar: أيّ جملة تبسّط «Dalam hal persyaratan tidak lengkap, permohonan tidak diproses»؟
      en: Which sentence simplifies "Dalam hal persyaratan tidak lengkap, permohonan tidak diproses"?
    options:
      - Semua permohonan pasti diproses.
      - Persyaratan tidak perlu dibawa.
      - Kalau syaratnya kurang, permohonanmu tidak diurus.
    answer: 2
    words: [persyaratan, pasti]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لو خالفت القاعدة، هتدفع غرامة.
      ar: إن خالفت القاعدة فستدفع غرامة.
      en: If you break the rule, you'll pay a fine.
    answers:
      - Kalau kamu melanggar aturan, kamu harus membayar denda.
      - Kalau melanggar aturan, kamu akan membayar denda.
      - Jika kamu melanggar aturan, kamu harus membayar denda.
      - Kalau kamu melanggar aturan, kamu kena denda.
    words: [denda]
  - id: e08
    type: speaking
    text: Artinya, aturan ini pasti berlaku untuk semua orang.
    meaning:
      ar_eg: يعني القاعدة دي أكيد سارية على كل الناس.
      ar: أي إنّ هذه القاعدة تسري حتمًا على الجميع.
      en: In plain terms, this rule definitely applies to everyone.
    words: [berlaku, pasti]
  - id: e09
    type: dictation
    text: Pelanggaran lalu lintas pasti dikenai denda.
    meaning:
      ar_eg: مخالفات المرور أكيد عليها غرامة.
      ar: تُفرض غرامة حتمًا على مخالفات المرور.
      en: Traffic offences always carry a fine.
    words: [pelanggaran, denda, pasti]
  - id: e10
    type: translate
    direction: from_target
    source_text: Persyaratan beasiswa ini berlaku untuk mahasiswa asing.
    answers_meaning:
      ar_eg:
        - شروط المنحة دي على الطلبة الأجانب.
        - الشروط دي للمنحة بتنطبق على الطلبة الأجانب.
      ar:
        - تسري شروط هذه المنحة على الطلّاب الأجانب.
        - تنطبق شروط المنحة على الطلبة الأجانب.
      en:
        - The requirements of this scholarship apply to foreign students.
        - These scholarship requirements apply to international students.
    words: [persyaratan, berlaku]
dialogue:
  title: Papan di perpustakaan
  lines:
    - speaker: Raka
      text: Bang Mohamed, papan ini bilang apa? Bahasanya susah.
      ar_eg: يا أبيه محمد، اللوحة دي بتقول إيه؟ كلامها صعب.
      ar: ماذا تقول هذه اللوحة يا محمد؟ لغتها صعبة.
      en: Bang Mohamed, what does this sign say? The language is hard.
    - speaker: Mohamed
      text: Artinya, kalau bukunya telat dikembalikan, kamu bayar denda.
      ar_eg: يعني لو رجّعت الكتاب متأخر، هتدفع غرامة.
      ar: أي إن تأخّرت في إعادة الكتاب دفعت غرامة.
      en: It means if you return the book late, you pay a fine.
    - speaker: Raka
      text: Dendanya berapa?
      ar_eg: الغرامة كام؟
      ar: كم الغرامة؟
      en: How much is the fine?
    - speaker: Mohamed
      text: Paling banyak lima ribu rupiah sehari. Jadi balikin tepat waktu, ya!
      ar_eg: بالكتير خمسة آلاف روبية في اليوم. يبقى رجّعه في معاده!
      ar: خمسة آلاف روبية يوميًّا على الأكثر. فأعِده في موعده!
      en: At most five thousand rupiah a day. So bring it back on time!
