schema: kabar.lesson/v1
id: bipa7.u03.l09
language: id
title: Mendongeng untuk anak
can_do:
  ar_eg: تحكي حكاية لأطفال بصوت الشخصيات وتخلّيهم متشوّقين للآخر.
  ar: أن تحكي حكاية للأطفال بأصوات الشخصيات وتُبقيهم متشوّقين حتى النهاية.
  en: Tell a story to children in the characters' voices and keep them hooked to the end.
slides:
  - title: Suara buaya, suara kancil
    body:
      ar_eg: |
        علشان العيال يفضلوا penasaran (عايزين يعرفوا اللي جاي):
        1. menirukan (قلّد) صوت كل شخصية: التمساح صوته تخين وبطيء، والكانشيل سريع ورفيع.
        2. اسأل: Menurut kalian, apa yang terjadi selanjutnya? (تفتكروا إيه اللي هيحصل؟)
        3. اسكت ثانية قبل الـ klimaks.
        4. في الآخر: Apa pesan moralnya, anak-anak?
      ar: |
        ليبقى الأطفال penasaran (متشوّقين لما سيأتي):
        ١. menirukan (قلِّد) صوت كلّ شخصية: التمساح غليظ الصوت بطيء، والكانشيل سريع رفيع الصوت.
        ٢. اسأل: Menurut kalian, apa yang terjadi selanjutnya? (ماذا تظنّون سيحدث؟)
        ٣. توقّف لحظة قبل الـ klimaks.
        ٤. وفي الختام: Apa pesan moralnya, anak-anak?
      en: |
        To keep children penasaran (curious, eager to know what's next):
        1. Menirukan (imitate) each character's voice: the crocodile deep and slow, Kancil quick and high.
        2. Ask: Menurut kalian, apa yang terjadi selanjutnya? (What do you think happens next?)
        3. Pause a moment before the klimaks.
        4. At the end: Apa pesan moralnya, anak-anak?
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: لو الأطفال «penasaran»، يبقى حاسّين بإيه؟
      ar: إن كان الأطفال «penasaran»، فبمَ يشعرون؟
      en: If the children are "penasaran", how do they feel?
    options:
      - زهقانين.
      - عايزين يعرفوا اللي هيحصل.
      - خايفين ينامو.
    answer: 1
    words: [penasaran]
  - id: e02
    type: listen
    text: Mama Ruth menirukan suara buaya yang berat dan pelan.
    question:
      ar_eg: ماما روث بتعمل إيه؟
      ar: ماذا تفعل ماما روث؟
      en: What is Mama Ruth doing?
    options:
      - بتقلّد صوت التمساح التخين والبطيء.
      - بتغنّي أغنية.
      - بتنادي على التمساح.
    answer: 0
    words: [menirukan]
  - id: e03
    type: fill_blank
    sentence: Anak-anak sangat ___ dan terus bertanya, "Lalu bagaimana?"
    meaning:
      ar_eg: 'العيال كانوا متشوّقين جدًا وفضلوا يسألوا: «وبعدين؟»'
      ar: 'كان الأطفال متشوّقين جدًّا وظلّوا يسألون: «ثمّ ماذا؟»'
      en: The children were really curious and kept asking, "Then what?"
    options: [penasaran, ringkas, lestari]
    answers: [penasaran]
    words: [penasaran]
  - id: e04
    type: build_sentence
    source:
      ar_eg: محمد قلّد صوت الكانشيل.
      ar: قلّد محمد صوت الكانشيل.
      en: Mohamed imitated Kancil's voice.
    answer: Mohamed menirukan suara Kancil.
    distractors: [mendongeng, penasaran]
    words: [menirukan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: تعمل إيه قبل الـ klimaks على طول؟
      ar: ماذا تفعل قبيل الـ klimaks؟
      en: What do you do right before the klimaks?
    options:
      - تخلّص الحكاية بسرعة.
      - تقول الرسالة الأخلاقية.
      - تسكت ثانية علشان التوتر يزيد.
    answer: 2
    words: [klimaks, ketegangan]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لما بحكي، بقلّد صوت كل الحيوانات.
      ar: حين أحكي أقلّد أصوات الحيوانات كلّها.
      en: When I tell stories, I imitate all the animals' voices.
    answers:
      - Saat mendongeng, saya menirukan suara semua hewan.
      - Kalau mendongeng, saya menirukan suara semua hewan.
      - Ketika mendongeng, saya menirukan suara semua binatang.
      - Waktu mendongeng, saya menirukan suara semua hewan.
    words: [mendongeng, menirukan]
  - id: e07
    type: speaking
    text: Menurut kalian, apa yang terjadi selanjutnya? Kancil takut atau tidak?
    meaning:
      ar_eg: تفتكروا إيه اللي هيحصل بعد كده؟ الكانشيل خاف ولا لأ؟
      ar: ماذا تظنّون سيحدث بعد ذلك؟ أخاف الكانشيل أم لا؟
      en: What do you think happens next? Was Kancil scared or not?
    words: [penasaran]
  - id: e08
    type: dictation
    text: Anak-anak penasaran sampai akhir dongeng.
    meaning:
      ar_eg: العيال فضلوا متشوّقين لحد آخر الحكاية.
      ar: ظلّ الأطفال متشوّقين حتى آخر الحكاية.
      en: The children stayed curious until the end of the tale.
    words: [penasaran, dongeng]
  - id: e09
    type: speaking
    text: Alkisah, Kancil ingin menyeberang sungai. Tetapi sungai itu penuh buaya!
    meaning:
      ar_eg: كان يا ما كان، الكانشيل عايز يعدّي النهر. بس النهر مليان تماسيح!
      ar: يُحكى أنّ الكانشيل أراد عبور النهر، لكنّ النهر كان مليئًا بالتماسيح!
      en: Once upon a time, Kancil wanted to cross a river. But the river was full of crocodiles!
    words: [alkisah]
dialogue:
  title: Malam dongeng di Arborek
  lines:
    - speaker: Mama Ruth
      text: Mohamed, malam ini kamu yang mendongeng Kancil untuk anak-anak.
      ar_eg: يا محمد، الليلة إنت اللي هتحكي حكاية الكانشيل للعيال.
      ar: يا محمد، ستحكي الليلة حكاية الكانشيل للأطفال.
      en: Mohamed, tonight you tell the Kancil story to the kids.
    - speaker: Mohamed
      text: Baik, Mama. "Raja ingin menghitung kalian!" Begitu suara Kancil?
      ar_eg: حاضر يا ماما. «الملك عايز يعدّكم!» كده صوت الكانشيل؟
      ar: حسنًا يا ماما. «يريد الملك أن يعدّكم!» أهكذا صوت الكانشيل؟
      en: Okay, Mama. "The king wants to count you!" Is that Kancil's voice?
    - speaker: Mama Ruth
      text: Bagus! Sekarang menirukan buaya. Lebih berat, lebih pelan.
      ar_eg: حلو! دلوقتي قلّد التمساح. أتقل وأبطأ.
      ar: أحسنت! والآن قلّد التمساح، أغلظ وأبطأ.
      en: Great! Now imitate the crocodile. Deeper, slower.
    - speaker: Mohamed
      text: '"Hmm… baik… kami… berbaris." Lihat, Mama, anak-anak sudah penasaran!'
      ar_eg: «همم… ماشي… هـ…نصطفّ.» بصي يا ماما، العيال متشوّقين خلاص!
      ar: «همم… حسنًا… سـ…نصطفّ.» انظري يا ماما، صار الأطفال متشوّقين!
      en: '"Hmm… okay… we''ll… line up." Look, Mama, the kids are hooked already!'
new_words:
  - word: menirukan
    pos: verb
    ar_eg: يقلّد
    ar: يقلّد، يحاكي
    en: to imitate
  - word: penasaran
    pos: adjective
    ar_eg: متشوّق يعرف / فضولي
    ar: متشوّق، فضوليّ
    en: curious, eager to know
