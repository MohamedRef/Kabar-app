        ar_eg: طبع / أخلاق
        ar: طبع، سلوك
        en: temperament, behaviour
      - text: balas budi
        ar_eg: يردّ الجميل
        ar: يردّ الجميل
        en: to repay a kindness
      - text: budi pekerti
        ar_eg: أخلاق وأدب
        ar: حُسن الخلق
        en: good character, morals
      - text: hikmah
        ar_eg: حكمة / عبرة
        ar: حكمة، عِبرة
        en: wisdom, lesson to draw
    words: [perangai, balas budi, budi pekerti, hikmah]
  - id: e03
    type: listen
    text: 'Hikmah cerita ini: orang yang tamak akan rugi sendiri.'
    question:
      ar_eg: إيه عبرة الحكاية؟
      ar: ما عبرة الحكاية؟
      en: What's the lesson?
    options: [الطمّاع بيخسر, الحسود بيكسب, الكبار بيزعلوا]
    answer: 0
    meaning:
      ar_eg: 'عبرة الحكاية دي: الطمّاع بيخسر في الآخر.'
      ar: عبرة هذه الحكاية أنّ الطمّاع يخسر في النهاية.
      en: 'The lesson of this story: the greedy lose out in the end.'
    words: [hikmah, tamak]
  - id: e04
    type: fill_blank
    sentence: Kakaknya ___ karena adiknya lebih disayang.
    meaning:
      ar_eg: أخوها الكبير ___ علشان أخته الصغيرة متدلّعة أكتر.
      ar: كان أخوها الأكبر ___ لأنّ الأصغر محبوبة أكثر.
      en: Her older brother was ___ because the younger one was loved more.
    options: [dengki, budi pekerti, hikmah]
    answers: [dengki]
    words: [dengki, budi pekerti, hikmah]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين الـ «antagonis» في حكاية السندريلا؟
      ar: مَن الخصم في حكاية سندريلا؟
      en: Who is the 'antagonis' in Cinderella?
    options: [Ibu tiri yang jahat., Cinderella yang sabar., Sepatu kaca.]
    answer: 0
    explain:
      ar_eg: مرات الأب هي اللي بتعادي البطلة.
      ar: زوجة الأب هي من تعادي البطلة.
      en: The stepmother opposes the heroine.
    words: [antagonis, protagonis]
  - id: e06
    type: fill_blank
    sentence: Sekolah itu mengajarkan ___ sejak kelas satu.
    meaning:
      ar_eg: المدرسة دي بتعلّم ___ من سنة أولى.
      ar: تعلّم تلك المدرسة ___ منذ الصفّ الأول.
      en: That school teaches ___ from year one.
    options: [budi pekerti, perangai, tamak]
    answers: [budi pekerti]
    words: [budi pekerti, perangai, tamak]
  - id: e07
    type: build_sentence
    source:
      ar_eg: طبعه اتغيّر بعد ما بقى غني.
      ar: تغيّر طبعه بعد أن صار غنيًّا.
      en: His behaviour changed after he got rich.
    answer: Perangainya berubah setelah ia kaya.
    distractors: [dengki, hikmah]
    words: [perangai]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kura-kura itu ingin balas budi kepada nelayan yang menolongnya.
    answers_meaning:
      ar_eg: [السلحفة كانت عايزة تردّ الجميل للصياد اللي ساعدها, السلحفاة عايزة تردّ جميل الصياد اللي أنقذها]
      ar: [أرادت السلحفاة أن تردّ الجميل للصيّاد الذي أنقذها, رغبت السلحفاة في ردّ جميل الصيّاد الذي ساعدها]
      en: [The turtle wanted to repay the fisherman who helped it, 'The turtle wished to return the fisherman''s kindness']
    words: [balas budi]
  - id: e09
    type: speaking
    text: Protagonisnya miskin, tetapi budi pekertinya baik.
    meaning:
      ar_eg: البطل فقير، بس أخلاقه حلوة.
      ar: البطل فقير لكنّه حسن الخلق.
      en: The protagonist is poor, but of good character.
    words: [protagonis, budi pekerti]
  - id: e10
    type: multiple_choice
    question: Tokoh yang ingin memiliki semua emas biasanya bersifat ...
    options: [sabar, jujur, tamak]
    answer: 2
    explain:
      ar_eg: tamak = طمّاع، عايز كل حاجة لنفسه.
      ar: tamak = طمّاع يريد كلّ شيء لنفسه.
      en: tamak = greedy, wants everything for himself.
    words: [tamak, dengki, perangai, antagonis, protagonis, balas budi]
dialogue:
  lines:
    - speaker: Kaka Yohana
      text: Buat siaran anak, kita bahas cerita Bawang Merah dan Bawang Putih.
      ar_eg: لبرنامج الأطفال، هنتكلّم عن حكاية باوانج ميراه وباوانج بوتيه.
      ar: في برنامج الأطفال سنناقش حكاية باوانغ ميراه وباوانغ بوتيه.
      en: For the kids' show, we'll discuss Bawang Merah and Bawang Putih.
    - speaker: Mohamed
      text: Protagonisnya Bawang Putih. Perangainya lembut dan sabar.
      ar_eg: البطلة باوانج بوتيه. طبعها هادي وصبورة.
      ar: البطلة باوانغ بوتيه، طبعها ليّن وصبور.
      en: The protagonist is Bawang Putih. She's gentle and patient.
    - speaker: Kaka Yohana
      text: Terus antagonisnya?
      ar_eg: والشريرة؟
      ar: والخصم؟
      en: And the antagonist?
    - speaker: Mohamed
      text: Bawang Merah dan ibunya. Mereka dengki dan tamak.
      ar_eg: باوانج ميراه وأمّها. حقودين وطمّاعين.
      ar: باوانغ ميراه وأمّها، حاسدتان طمّاعتان.
      en: Bawang Merah and her mother. They're spiteful and greedy.
    - speaker: Kaka Yohana
      text: Terus apa hikmahnya buat pendengar kecil kita?
      ar_eg: طب إيه العبرة لمستمعينا الصغيّرين؟
      ar: فما العبرة لمستمعينا الصغار؟
      en: So what's the lesson for our young listeners?
    - speaker: Mohamed
      text: Budi pekerti yang baik akan dibalas dengan kebaikan.
      ar_eg: الأخلاق الحلوة بتترد بالخير.
      ar: حسن الخلق يُجزى بالخير.
      en: Good character is repaid with good.
