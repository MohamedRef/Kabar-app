        ar: الشخصية الرئيسية، البطل
        en: protagonist
      - text: antagonis
        ar_eg: الشرير (الشخصية المعادية)
        ar: الشخصية المعادية
        en: antagonist
      - text: tamak
        ar_eg: طمّاع
        ar: طمّاع
        en: greedy
      - text: dengki
