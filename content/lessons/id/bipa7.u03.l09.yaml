schema: kabar.lesson/v1
id: bipa7.u03.l09
language: id
title: Watak tokoh
can_do:
  ar_eg: 'تحلّل شخصيات حكاية: مين البطل ومين الشرير وإيه العبرة.'
  ar: 'أن تحلّل شخصيات حكاية: من البطل ومن الخصم وما العبرة.'
  en: 'Analyse a tale''s characters: who is the hero, who the villain, and what the lesson is.'
slides:
  - title: Menganalisis cerita rakyat
    body:
      ar_eg: |
        protagonis = البطل الطيب. antagonis = الشخصية اللي بتعاديه.
        الأنتاجونيست غالبًا tamak (طمّاع) أو dengki (حسود وحقود).
        perangai = الطبع، اللي بيبان في التصرّفات (perangainya kasar).
        balas budi = يردّ الجميل، وفي حكايات كتير حيوان بيردّ الجميل لحد أنقذه.
        budi pekerti = الأخلاق الحلوة، والمدارس بتدرّسها.
        hikmah = الحكمة أو العبرة، وكلمة عربية الأصل: Apa hikmah cerita ini?
        - في الكلام: terus = lalu، buat = untuk.
      ar: |
        protagonis = البطل الخيّر. antagonis = الشخصية المعادية له.
        وكثيرًا ما يكون الخصم tamak (طمّاعًا) أو dengki (حسودًا حاقدًا).
        perangai = الطبع الظاهر في السلوك (perangainya kasar).
        balas budi = ردّ الجميل، وفي حكايات كثيرة يردّ حيوان الجميل لمن أنقذه.
        budi pekerti = حسن الخلق، وتعلّمه المدارس.
        hikmah = الحكمة أو العبرة، وهي عربية الأصل: Apa hikmah cerita ini?
        - في الكلام اليومي: terus = lalu، buat = untuk.
      en: |
        protagonis = the good main character. antagonis = the character who opposes them.
        The antagonist is often tamak (greedy) or dengki (spiteful, envious).
        perangai = temperament, the way someone behaves (perangainya kasar).
        balas budi = to repay a kindness; in many tales an animal repays the person who saved it.
        budi pekerti = good character, taught in schools.
        hikmah = wisdom or the lesson to take away, from Arabic: Apa hikmah cerita ini?
        - In speech: terus = lalu, buat = untuk.
    examples:
      - text: Bawang Putih adalah protagonis yang sabar.
        ar_eg: باوانج بوتيه هي البطلة الصبورة.
        ar: باوانغ بوتيه هي البطلة الصبورة.
        en: Bawang Putih is the patient protagonist.
      - text: Ibu tiri yang dengki menjadi antagonis.
        ar_eg: مرات الأب الحقودة هي الشريرة.
        ar: زوجة الأب الحاسدة هي الخصم.
        en: The spiteful stepmother is the antagonist.
      - text: Burung itu datang untuk balas budi.
        ar_eg: العصفور ده جه يردّ الجميل.
        ar: جاء ذلك الطائر ليردّ الجميل.
        en: The bird came to repay the kindness.
