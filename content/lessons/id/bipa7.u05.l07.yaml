  - id: e03
    type: listen
    text: Jalan Anyer sampai Panarukan dibangun dengan kerja rodi.
    question:
      ar_eg: الطريق اتبنى إزاي؟
      ar: كيف بُني الطريق؟
      en: How was the road built?
    options: [سُخرة, تجارة, احتكار]
    answer: 0
    meaning:
      ar_eg: طريق أنيير لباناروكان اتبنى بالسخرة.
      ar: بُني طريق أنيير-باناروكان بالسخرة.
      en: The Anyer–Panarukan road was built with forced labour.
    words: [kerja rodi]
  - id: e04
    type: fill_blank
    sentence: Sriwijaya adalah kerajaan ___ yang menguasai Selat Malaka.
    meaning:
      ar_eg: سريويجايا كانت مملكة ___ مسيطرة على مضيق ملقا.
      ar: كانت سريويجايا مملكة ___ تسيطر على مضيق ملقا.
      en: Srivijaya was a ___ kingdom that controlled the Strait of Malacca.
    options: [maritim, monopoli, kongsi]
    answers: [maritim]
    words: [maritim, monopoli, kongsi]
    explain:
      ar_eg: maritim = بحرية، وده مناسب لمملكة مسيطرة على مضيق ملقا. monopoli = احتكار وkongsi = شركة.
      ar: maritim = بحرية، تناسب مملكة تسيطر على مضيق ملقا. monopoli احتكار وkongsi شركة.
      en: maritim (maritime) fits a kingdom ruling the Strait of Malacca.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الـ «syahbandar» كان شغله إيه؟
      ar: ما عمل «syahbandar»؟
      en: What did a 'syahbandar' do?
    options: [Menanam cengkih., Memimpin perang., Mengatur kapal dan pajak di pelabuhan.]
    answer: 2
    explain:
      ar_eg: الشاهبندر كان بيدير الميناء.
      ar: كان الشاهبندر يدير شؤون الميناء.
      en: The syahbandar ran the port.
    words: [syahbandar]
  - id: e06
    type: fill_blank
    sentence: Kota pelabuhan itu menjadi pusat ___ rempah-rempah.
    meaning:
      ar_eg: مدينة الميناء دي بقت مركز ___ التوابل.
      ar: صارت تلك المدينة الساحلية مركز ___ التوابل.
      en: That port town became a centre of the spice ___.
    options: [niaga, tanam paksa, syahbandar]
    answers: [niaga]
    words: [niaga, tanam paksa, syahbandar, rempah-rempah]
    explain:
      ar_eg: pusat niaga = مركز تجارة. tanam paksa = الزراعة الإجبارية وsyahbandar = مدير الميناء، شخص مش نشاط.
      ar: pusat niaga = مركز تجارة. tanam paksa زراعة قسرية وsyahbandar ناظر الميناء.
      en: pusat niaga = trade centre. syahbandar is a harbour master, not trade.
  - id: e07
    type: build_sentence
    source:
      ar_eg: الـ VOC كانت شركة تجارية هولندية.
      ar: كانت VOC شركة تجارية هولندية.
      en: The VOC was a Dutch trading company.
    answer: VOC adalah kongsi dagang Belanda.
    distractors: [monopoli, niaga]
    words: [kongsi]
    explain:
      ar_eg: VOC adalah + kongsi dagang (شركة تجارية) + Belanda. monopoli وniaga زيادة.
      ar: VOC adalah kongsi dagang Belanda. monopoli وniaga زائدتان.
      en: VOC + adalah + kongsi dagang + Belanda. monopoli and niaga are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Monopoli VOC membuat harga cengkih di Maluku jatuh.
    answers_meaning:
      ar_eg: [احتكار الـ VOC خلّى سعر القرنفل في مالوكو يقع, احتكار الشركة الهولندية وقّع سعر القرنفل في مالوكو]
      ar: [أدّى احتكار VOC إلى انهيار سعر القرنفل في مالوكو, جعل احتكار VOC سعر القرنفل في مالوكو يهبط]
      en: [The VOC monopoly made clove prices in Maluku collapse, 'The VOC''s monopoly drove down clove prices in Maluku']
    words: [monopoli]
  - id: e09
    type: speaking
    text: Niaga rempah-rempah membawa kekayaan sekaligus penjajahan.
    meaning:
      ar_eg: تجارة التوابل جابت الغنى والاستعمار مع بعض.
      ar: جلبت تجارة التوابل الثروة والاستعمار معًا.
      en: The spice trade brought wealth and colonisation at once.
    words: [rempah-rempah, niaga]
  - id: e10
    type: multiple_choice
    question: Apa itu tanam paksa?
    options: [Petani dipaksa menanam tanaman ekspor untuk pemerintah kolonial., Pesta panen di desa., Sekolah pertanian modern.]
    answer: 0
    explain:
      ar_eg: الزراعة الإجبارية = الفلاح يزرع للمستعمر غصب عنه.
      ar: الزراعة القسرية = إكراه الفلّاح على الزراعة للمستعمر.
      en: Forced cultivation = farmers made to grow crops for the colonial state.
    words: [tanam paksa, kerja rodi, rempah-rempah, maritim, syahbandar]
dialogue:
  lines:
    - speaker: Pak Hasan
      text: Mohamed, kenapa orang Eropa datang jauh-jauh ke Maluku?
      ar_eg: يا محمد، ليه الأوروبيين جم من بعيد كده لمالوكو؟
      ar: يا محمد، لماذا جاء الأوروبيون من بعيد إلى مالوكو؟
      en: Mohamed, why did Europeans come all the way to Maluku?
    - speaker: Mohamed
      text: Gara-gara rempah-rempah, Pak. Pala dan cengkih mahal banget di Eropa.
      ar_eg: علشان التوابل يا أستاذ. جوزة الطيب والقرنفل كانوا غاليين جدًا في أوروبا.
      ar: بسبب التوابل يا أستاذ، فقد كانت جوزة الطيب والقرنفل غالية جدًّا في أوروبا.
      en: Because of spices, sir. Nutmeg and cloves were very expensive in Europe.
    - speaker: Pak Hasan
      text: Betul. VOC lalu memaksakan monopoli. Pedagang lain dilarang.
      ar_eg: مظبوط. وبعدين الـ VOC فرضت احتكار. والتجّار التانيين اتمنعوا.
      ar: صحيح، ثمّ فرضت VOC الاحتكار ومُنع التجّار الآخرون.
      en: Right. Then the VOC forced a monopoly. Other traders were banned.
    - speaker: Mohamed
      text: Padahal sebelumnya pelabuhan kita terbuka buat niaga dengan siapa aja.
      ar_eg: مع إن موانينا قبلها كانت مفتوحة للتجارة مع أي حد.
      ar: مع أنّ موانئنا كانت قبل ذلك مفتوحة للتجارة مع الجميع.
      en: Even though our ports had been open to trade with anyone.
    - speaker: Pak Hasan
      text: Ya. Syahbandar di Makassar dulu menerima kapal dari Arab, Cina, dan Gujarat.
      ar_eg: أيوه. الشاهبندر في ماكاسار زمان كان بيستقبل سفن من العرب والصين وجوجارات.
      ar: نعم، كان شاهبندر ماكاسار يستقبل سفنًا من العرب والصين وكجرات.
      en: Yes. The harbour master in Makassar used to receive ships from Arabia, China and Gujarat.
