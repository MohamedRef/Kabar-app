id: bipa7.u05.l07
language: id
title: Jalur rempah
can_do:
  ar_eg: تحكي إزاي التوابل جابت التجّار والمستعمرين لإندونيسيا.
  ar: أن تروي كيف جلبت التوابل التجّار والمستعمرين إلى إندونيسيا.
  en: Tell how spices drew traders and colonisers to Indonesia.
slides:
  - title: Dari pelabuhan ke penjajahan
    body:
      ar_eg: |
        زمان كانت ممالك maritim (بحرية) عايشة على niaga (التجارة) في rempah-rempah: القرنفل وجوزة الطيب من مالوكو.
        في الميناء، الـ syahbandar (الشاهبندر، كلمة فارسية) بيدير السفن والضرايب.
        سنة 1602 اتأسّست الـ VOC، kongsi dagang هولندي، وحاولت تعمل monopoli (احتكار) على التوابل.
        بعد ما الـ VOC اتحلّت سنة 1799، حكومة الهند الهولندية عملت:
        - kerja rodi = السخرة، زي طريق أنيير-باناروكان أيام دانديلس.
        - tanam paksa = من سنة 1830 الفلاحين اتجبروا يزرعوا محاصيل للتصدير.
        - في الكلام: aja = saja، banget = sekali، buat = untuk، gara-gara = karena.
      ar: |
        قديمًا عاشت ممالك maritim (بحرية) على niaga (التجارة) في rempah-rempah: القرنفل وجوزة الطيب من مالوكو.
        وفي الميناء كان syahbandar (الشاهبندر، لفظ فارسيّ) يدير السفن والمكوس.
        عام 1602 تأسّست VOC، وهي kongsi dagang هولندية سعت إلى monopoli (احتكار) التوابل.
        وبعد حلّ VOC عام 1799 فرضت حكومة الهند الهولندية:
        - kerja rodi = السخرة، كطريق أنيير-باناروكان في عهد دانديلس.
        - tanam paksa = منذ 1830 أُجبر الفلّاحون على زراعة محاصيل للتصدير.
        - في الكلام اليومي: aja = saja، banget = sekali، buat = untuk، gara-gara = karena.
      en: |
        Maritime (maritim) kingdoms once lived on niaga (trade) in rempah-rempah: cloves and nutmeg from Maluku.
        In port, the syahbandar (harbour master, a Persian word) ran the ships and the dues.
        In 1602 the VOC was founded, a Dutch kongsi dagang (trading company) that sought a monopoli on spices.
        After the VOC was dissolved in 1799, the Dutch East Indies government imposed:
        - kerja rodi = forced labour, such as Daendels' Anyer–Panarukan road.
        - tanam paksa = from 1830, farmers were forced to grow export crops.
        - In speech: aja = saja, banget = sekali, buat = untuk, gara-gara = karena.
    examples:
      - text: Pala dan cengkih adalah rempah-rempah dari Maluku.
        ar_eg: جوزة الطيب والقرنفل توابل من مالوكو.
        ar: جوزة الطيب والقرنفل من توابل مالوكو.
        en: Nutmeg and cloves are spices from Maluku.
      - text: VOC ingin memonopoli perdagangan rempah-rempah.
        ar_eg: الـ VOC كانت عايزة تحتكر تجارة التوابل.
        ar: أرادت VOC احتكار تجارة التوابل.
        en: The VOC wanted to monopolise the spice trade.
      - text: Banyak petani menderita karena tanam paksa.
        ar_eg: فلاحين كتير اتعذّبوا بسبب الزراعة الإجبارية.
        ar: عانى فلّاحون كثيرون بسبب الزراعة القسرية.
        en: Many farmers suffered under forced cultivation.
