schema: kabar.lesson/v1
id: bipa2.u08.l03
language: id
title: Jalan-jalan pelan-pelan
can_do:
  ar_eg: تستخدم التكرار عشان تقول «يتفسح»، «بالراحة»، «أي حاجة» و«من كل نوع».
  ar: أن تستعمل التكرار للتعبير عن التنويع وكيفية الفعل.
  en: Use reduplication for variety and manner.
slides:
  - title: Jalan-jalan, lihat-lihat
    body:
      ar_eg: |
        التكرار مش للجمع بس! لما تكرر فعل بيبقى معناه «بيعمله براحته، من غير هدف محدد»:
        - jalan = يمشي، jalan-jalan = يتفسح / يتمشى.
        - lihat = يشوف، lihat-lihat = يتفرج بس (في المحل: «Lihat-lihat dulu» = بتفرج بس).
        - duduk-duduk = قاعد كده من غير شغلة.
      ar: |
        للتكرار معانٍ غير الجمع. فالفعل المكرر يدل على فعلٍ بلا غاية محددة:
        - jalan = يمشي، وjalan-jalan = يتنزه.
        - lihat = يرى، وlihat-lihat = يتفرج فقط (في المتجر: «Lihat-lihat dulu»).
        - duduk-duduk = يجلس بلا شغل.
      en: |
        Repetition isn't only for plurals! A doubled verb means doing it casually, without a set goal:
        - jalan = walk, jalan-jalan = go out, stroll, travel for fun.
        - lihat = see, lihat-lihat = just browse ("Lihat-lihat dulu" in a shop).
        - duduk-duduk = sit around.
    grammar: id.reduplication.types
    examples:
      - text: Kami jalan-jalan ke Bedugul hari Minggu.
        ar_eg: اتفسحنا في بيدوجول يوم الحد.
        ar: تنزهنا في بيدوغول يوم الأحد.
        en: We went on a trip to Bedugul on Sunday.
      - text: Lihat-lihat dulu, ya, Bu.
        ar_eg: بتفرج بس يا مدام.
        ar: أتفرج فقط يا سيدتي.
        en: I'm just looking for now, ma'am.
  - title: Pelan-pelan, cepat-cepat
    body:
      ar_eg: |
        صفة مكررة = بتوصف إزاي بتعمل الحاجة (حال):
        - pelan = بطيء، pelan-pelan = بالراحة.
        - cepat-cepat = بسرعة.
        - baik-baik saja = تمام / كويس.
        زي عندنا «شوية شوية» و«بالراحة بالراحة»، بس في الإندونيسي ده قاعدة.
      ar: |
        الصفة المكررة تصير حالًا تصف كيفية الفعل:
        - pelan = بطيء، وpelan-pelan = ببطء / على مهل.
        - cepat-cepat = بسرعة.
        - baik-baik saja = على ما يرام.
        وهو يشبه «رويدًا رويدًا»، لكنه هنا قاعدة منتظمة.
      en: |
        A doubled adjective describes how you do something (an adverb):
        - pelan = slow, pelan-pelan = slowly, gently.
        - cepat-cepat = quickly, hurriedly.
        - baik-baik saja = just fine.
        Like Arabic «رويدًا رويدًا» — but in Indonesian it's regular grammar.
    grammar: id.reduplication.types
    examples:
      - text: Pelan-pelan saja, Pak, jalannya licin.
        ar_eg: بالراحة يا أسطى، الطريق بيزحلق.
        ar: على مهلك يا سيدي، الطريق زلق.
        en: Take it slowly, sir, the road is slippery.
      - text: Saya baik-baik saja.
        ar_eg: أنا كويس، تمام.
        ar: أنا على ما يرام.
        en: I'm just fine.
  - title: Apa-apa, kapan-kapan
    body:
      ar_eg: |
        أداة سؤال مكررة = «أي…»:
        - Tidak apa-apa = مفيش مشكلة / ولا يهمك.
        - siapa-siapa = حد (مع النفي: مفيش حد).
        - kapan-kapan = في يوم من الأيام / مرة كده.
        - di mana-mana = في كل حتة.
      ar: |
        أداة الاستفهام المكررة تفيد الإبهام:
        - Tidak apa-apa = لا بأس.
        - siapa-siapa = أحد (ومع النفي: لا أحد).
        - kapan-kapan = يومًا ما.
        - di mana-mana = في كل مكان.
      en: |
        A doubled question word means "any-":
        - Tidak apa-apa = no problem, it's nothing.
        - siapa-siapa = anyone (with a negative: no one).
        - kapan-kapan = some time.
        - di mana-mana = everywhere.
    grammar: id.reduplication.types
    examples:
      - text: Maaf! — Tidak apa-apa.
        ar_eg: آسف! — ولا يهمك.
        ar: عذرًا! — لا بأس.
        en: Sorry! — No problem.
      - text: Di Bali ada pura di mana-mana.
        ar_eg: في بالي فيه معابد في كل حتة.
        ar: في بالي معابد في كل مكان.
        en: In Bali there are temples everywhere.
  - title: Sayur-mayur, bolak-balik
    body:
      ar_eg: |
        فيه تكرار بيتغير فيه صوت، ومعناه «أنواع كتير / تنوّع»:
        - sayur-mayur = خضار من كل نوع.
        - lauk-pauk = أطباق جنب الرز.
        - bolak-balik = رايح جاي.
        وفي الشات بيكتبوا التكرار برقم 2: jln2 = jalan-jalan، pelan2 = pelan-pelan.
      ar: |
        ومن التكرار ما يتغير فيه الصوت ويدل على التنوع:
        - sayur-mayur = خضروات شتى.
        - lauk-pauk = أطباق جانبية.
        - bolak-balik = ذهابًا وإيابًا.
        وفي المحادثات يُكتب التكرار بالرقم 2: jln2، pelan2.
      en: |
        Some doubles change a sound and mean "all sorts of / variety":
        - sayur-mayur = all kinds of vegetables.
        - lauk-pauk = side dishes.
        - bolak-balik = back and forth.
        In chats the repeat is written as 2: jln2 = jalan-jalan, pelan2 = pelan-pelan.
    grammar: id.reduplication.types
    examples:
      - text: Bus itu bolak-balik dari Denpasar ke Bedugul.
        ar_eg: الأتوبيس ده رايح جاي من دنباسار لبيدوجول.
        ar: تذهب تلك الحافلة وتعود بين دنباسار وبيدوغول.
        en: That bus goes back and forth between Denpasar and Bedugul.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jalan-jalan
        ar_eg: يتفسح
        ar: يتنزه
        en: to go out, stroll, travel for fun
      - text: pelan-pelan
        ar_eg: بالراحة
        ar: ببطء
        en: slowly
      - text: bolak-balik
        ar_eg: رايح جاي
        ar: ذهابًا وإيابًا
        en: back and forth
      - text: tidak apa-apa
        ar_eg: ولا يهمك
        ar: لا بأس
        en: no problem
    words: [jalan-jalan, pelan-pelan, bolak-balik, apa-apa]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إنت في محل والبياعة بتسألك عايز إيه. إنت بتتفرج بس. تقول إيه؟
      ar: أنت في متجر وتسألك البائعة عمّا تريد، وأنت تتفرج فقط. ماذا تقول؟
      en: In a shop the seller asks what you want. You're only browsing. What do you say?
    options: ["Lihat-lihat dulu, ya, Bu.", "Cepat-cepat, ya, Bu.", "Kapan-kapan, ya, Bu."]
    answer: 0
    words: [lihat-lihat]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: سواق الأوجيك ماشي بسرعة والطريق مبلول. تقوله إيه؟
      ar: سائق الدرّاجة يسرع والطريق مبتل. ماذا تقول له؟
      en: The ojek driver is going fast and the road is wet. What do you say?
    options: ["Pelan-pelan, Pak!", "Bolak-balik, Pak!", "Jalan-jalan, Pak!"]
    answer: 0
    words: [pelan-pelan]
  - id: e04
    type: listen
    text: Tidak apa-apa.
    options: ["Tidak ada apa-apa.", "Tidak apa-apa.", "Tidak siapa-siapa."]
    answer: 1
    words: [apa-apa]
  - id: e05
    type: multiple_choice
    question: "Maaf, saya terlambat! — ___"
    question_meaning:
      ar_eg: «آسف، اتأخرت!» — ترد تقول إيه؟
      ar: «عذرًا، تأخرت!» — بماذا تردّ؟
      en: '"Sorry, I''m late!" — how do you reply?'
    options: ["Pelan-pelan.", "Tidak apa-apa.", "Lihat-lihat."]
    answer: 1
    words: [apa-apa]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تقول «اتفسحت في بالي». أنهي جملة صح؟
      ar: تريد أن تقول «تنزهت في بالي». أيّ الجملتين صحيحة؟
      en: You want to say "I went on holiday to Bali". Which is right?
    options: ["Saya jalan ke Bali.", "Saya jalan-jalan ke Bali."]
    answer: 1
    explain:
      ar_eg: jalan = يمشي. jalan-jalan = يتفسح. محدش بيمشي على رجليه لبالي!
      ar: jalan = يمشي، وjalan-jalan = يتنزه.
      en: jalan = walk; jalan-jalan = travel for fun. Nobody walks to Bali!
    words: [jalan-jalan]
  - id: e07
    type: fill_blank
    sentence: Hari Minggu kami ___ ke Bedugul.
    meaning:
      ar_eg: يوم الحد اتفسحنا في بيدوجول.
      ar: يوم الأحد تنزهنا في بيدوغول.
      en: On Sunday we went on a trip to Bedugul.
    options: ["pelan-pelan", "bolak-balik", "jalan-jalan"]
    answers: [jalan-jalan]
    words: [jalan-jalan]
  - id: e08
    type: fill_blank
    sentence: Ibu membeli ___ di pasar.
    meaning:
      ar_eg: ماما اشترت خضار من كل نوع من السوق.
      ar: اشترت أمي خضروات متنوعة من السوق.
      en: Mum bought all kinds of vegetables at the market.
    options: ["kapan-kapan", "sayur-mayur", "pelan-pelan"]
    answers: [sayur-mayur]
    words: [sayur-mayur]
  - id: e09
    type: fill_blank
    sentence: Bus itu ___ dari Denpasar ke Bedugul setiap hari.
    meaning:
      ar_eg: الأتوبيس ده رايح جاي من دنباسار لبيدوجول كل يوم.
      ar: تذهب تلك الحافلة وتعود بين دنباسار وبيدوغول كل يوم.
      en: That bus goes back and forth between Denpasar and Bedugul every day.
    options: ["siapa-siapa", "bolak-balik", "jalan-jalan"]
    answers: [bolak-balik]
    words: [bolak-balik]
  - id: e10
    type: build_sentence
    source:
      ar_eg: بالراحة يا أسطى، الطريق بيزحلق.
      ar: على مهلك يا سيدي، الطريق زلق.
      en: Take it slowly, sir, the road is slippery.
    answer: Pelan-pelan saja, Pak, jalannya licin.
    distractors: [cepat-cepat, Bu]
    words: [pelan-pelan, licin]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إحنا اتفسحنا في بيدوجول.
      ar: تنزهنا في بيدوغول.
      en: We went on a trip to Bedugul.
    answers:
      - Kami jalan-jalan ke Bedugul.
      - Kami jalan-jalan ke Bedugul
      - Kami jalan-jalan di Bedugul.
      - Kami jalan-jalan di Bedugul
      - Kita jalan-jalan ke Bedugul.
      - Kita jalan-jalan di Bedugul.
      - Kami berjalan-jalan ke Bedugul.
      - Kami berjalan-jalan di Bedugul.
    explain:
      ar_eg: jalan-jalan ke = اتفسحنا رايحين مكان، jalan-jalan di = اتفسحنا جوه المكان. الاتنين صح. berjalan-jalan أرسمي.
      ar: jalan-jalan ke للتنزه بالذهاب إلى المكان، وjalan-jalan di للتنزه فيه، وكلاهما صحيح، وberjalan-jalan أكثر رسمية.
      en: jalan-jalan ke = trip to a place, jalan-jalan di = strolling around in it; both are fine. berjalan-jalan is more formal.
    words: [jalan-jalan]
  - id: e12
    type: translate
    direction: from_target
    source_text: Kapan-kapan kita ke Lovina, yuk!
    answers_meaning:
      ar_eg: ["يلا نروح لوفينا في يوم من الأيام!", "يلا نروح لوفينا مرة كده!", "مرة من المرات نروح لوفينا!"]
      ar: ["لنذهب إلى لوفينا يومًا ما!", "هيا نذهب إلى لوفينا في وقت ما!"]
      en: ["Let's go to Lovina some time!", "Some time let's go to Lovina!"]
    words: [kapan-kapan]
  - id: e13
    type: dictation
    text: Pelan-pelan saja, Pak.
    meaning:
      ar_eg: بالراحة يا أسطى.
      ar: على مهلك يا سيدي.
      en: Take it slowly, sir.
    words: [pelan-pelan]
  - id: e14
    type: speaking
    text: Tidak apa-apa, saya lihat-lihat dulu.
    meaning:
      ar_eg: ولا يهمك، أنا بتفرج بس دلوقتي.
      ar: لا بأس، أتفرج فقط الآن.
      en: It's fine, I'm just looking for now.
    words: [apa-apa, lihat-lihat]
dialogue:
  title: Naik ojek ke danau
  lines:
    - speaker: Pak Wayan
      text: Mas mau ke mana?
      ar_eg: رايح فين يا أستاذ؟
      ar: إلى أين تريد الذهاب يا أخي؟
      en: Where are you going?
    - speaker: Mohamed
      text: Ke Danau Beratan, Pak. Saya mau jalan-jalan di sana.
      ar_eg: لبحيرة براتان يا أسطى. عايز أتفسح هناك.
      ar: إلى بحيرة براتان يا سيدي، أريد أن أتنزه هناك.
      en: To Lake Beratan, sir. I want to look around there.
    - speaker: Pak Wayan
      text: Baik. Jalannya licin, jadi saya pelan-pelan, ya.
      ar_eg: ماشي. الطريق بيزحلق، فهمشي بالراحة.
      ar: حسنًا. الطريق زلق، لذلك سأسير ببطء.
      en: OK. The road is slippery, so I'll go slowly.
    - speaker: Mohamed
      text: Tidak apa-apa, Pak. Pelan-pelan saja.
      ar_eg: ولا يهمك يا أسطى. بالراحة خالص.
      ar: لا بأس يا سيدي، على مهلك.
      en: No problem, sir. Nice and slow.
    - speaker: Pak Wayan
      text: Di sini ada pasar sayur-mayur dan buah. Mau lihat-lihat?
      ar_eg: هنا فيه سوق خضار وفاكهة من كل نوع. تحب تتفرج؟
      ar: هنا سوق للخضروات والفواكه المتنوعة. أتريد أن تتفرج؟
      en: There's a market here with all sorts of vegetables and fruit. Want to have a look?
    - speaker: Mohamed
      text: Kapan-kapan, Pak. Hari ini ke danau dulu.
      ar_eg: مرة تانية يا أسطى. النهارده البحيرة الأول.
      ar: في وقت آخر يا سيدي، اليوم إلى البحيرة أولًا.
      en: Some other time, sir. Today the lake first.
