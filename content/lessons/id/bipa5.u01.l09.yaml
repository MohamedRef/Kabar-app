schema: kabar.lesson/v1
id: bipa5.u01.l09
language: id
title: Gaji, tabungan, masa depan
can_do:
  ar_eg: تتكلم عن المرتب والتحويش والمستقبل المالي، وعن البطالة وصاحب الشغل والاستشاري.
  ar: أن تتحدث عن الراتب والادخار والمستقبل المالي، وعن البطالة وصاحب العمل والمستشار.
  en: Talk about salary, saving and your financial future, and about unemployment, employers and consultants.
slides:
  - title: Uang dari pekerjaan
    body:
      ar_eg: |
        profesi = مهنة: Apa profesi Anda? (مؤدبة أكتر من Kerja apa?)
        tabungan = تحويش، menabung = يحوّش، finansial = مالي، konsultan = استشاري (konsultan keuangan).
        imbalan = مقابل أو مكافأة: tanpa imbalan = من غير مقابل.
        pengangguran = بطالة أو عاطل، majikan = صاحب الشغل (للعمالة المنزلية وعمال اليومية).
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: udah = sudah، dikit = sedikit، buat = untuk، aku = saya، bantuin = membantu، nggak = tidak، ngobrol = berbicara، cepet = cepat.
      ar: |
        profesi = مهنة: Apa profesi Anda? (أكثر تهذيبًا من Kerja apa?)
        tabungan = مدّخرات، menabung = يدّخر، finansial = مالي، konsultan = مستشار (konsultan keuangan).
        imbalan = مقابل، مكافأة: tanpa imbalan = بلا مقابل.
        pengangguran = بطالة أو عاطل، majikan = صاحب العمل (للعمّال المنزليين وعمّال اليومية).
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: udah = sudah، dikit = sedikit، buat = untuk، aku = saya، bantuin = membantu، nggak = tidak، ngobrol = berbicara، cepet = cepat.
      en: |
        profesi = profession: Apa profesi Anda? (politer than Kerja apa?)
        tabungan = savings, menabung = to save, finansial = financial, konsultan = consultant (konsultan keuangan).
        imbalan = reward, something in return: tanpa imbalan = for nothing in return.
        pengangguran = unemployment, an unemployed person, majikan = employer (of domestic or day workers).
        The dialogue uses street forms; the formal ones are beside them: udah = sudah, dikit = sedikit, buat = untuk, aku = saya, bantuin = membantu, nggak = tidak, ngobrol = berbicara, cepet = cepat.
    examples:
      - text: Saya menabung sedikit setiap bulan.
        ar_eg: بحوّش حاجة بسيطة كل شهر.
        ar: أدّخر قليلًا كل شهر.
        en: I save a little every month.
      - text: Pengangguran di kalangan anak muda masih tinggi.
        ar_eg: البطالة بين الشباب لسه عالية.
        ar: ما زالت البطالة بين الشباب مرتفعة.
        en: Youth unemployment is still high.
      - text: Konsultan keuangan membantu kami membuat rencana finansial.
        ar_eg: الاستشاري المالي ساعدنا نعمل خطة مالية.
        ar: ساعدنا المستشار المالي على وضع خطة مالية.
        en: A financial consultant helped us make a financial plan.
