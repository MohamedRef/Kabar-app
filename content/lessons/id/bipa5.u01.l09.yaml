  - id: e03
    type: listen
    text: Tabungan saya cukup untuk tiga bulan.
    question:
      ar_eg: إيه اللي يكفي تلات شهور؟
      ar: ما الذي يكفي ثلاثة أشهر؟
      en: What is enough for three months?
    options: [ديونه, مرتبه, تحويشه]
    answer: 2
    meaning:
      ar_eg: التحويشة بتاعتي تكفي تلات شهور.
      ar: مدّخراتي تكفي ثلاثة أشهر.
      en: My savings are enough for three months.
    words: [tabungan]
  - id: e04
    type: fill_blank
    sentence: Kalau mau beli rumah, kamu harus ___ dari sekarang.
    meaning:
      ar_eg: لو عايز تشتري بيت لازم ___ من دلوقتي.
      ar: إن أردت شراء بيت فعليك أن ___ من الآن.
      en: If you want to buy a house, you have to ___ starting now.
    options: [menabung, finansial, profesi]
    answers: [menabung]
    words: [menabung, finansial, profesi]
  - id: e05
    type: multiple_choice
    question: Perusahaan itu bangkrut karena masalah ___.
    options: [majikan, pengangguran, finansial]
    answer: 2
    explain:
      ar_eg: masalah finansial = مشكلة مالية.
      ar: masalah finansial = مشكلة مالية.
      en: masalah finansial = financial trouble.
    words: [majikan, pengangguran, finansial]
  - id: e06
    type: fill_blank
    sentence: Apa ___ Anda sebelum pindah ke Balikpapan?
    meaning:
      ar_eg: كانت ___ حضرتك إيه قبل ما تنقل بالكبابان؟
      ar: ما ___ك قبل الانتقال إلى باليكبابان؟
      en: What was your ___ before moving to Balikpapan?
    options: [profesi, imbalan, tabungan]
    answers: [profesi]
    words: [profesi, imbalan, tabungan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بتطلب منه نصيحة عن فلوسك؟
      ar: ممّن تطلب نصيحة بشأن أموالك؟
      en: Who do you ask for advice about your money?
    options: [konsultan, majikan, pengangguran]
    answer: 0
    explain:
      ar_eg: konsultan keuangan = استشاري مالي.
      ar: konsultan keuangan = مستشار مالي.
      en: konsultan keuangan = financial consultant.
    words: [konsultan, majikan, pengangguran]
  - id: e08
    type: build_sentence
    source:
      ar_eg: صاحب الشغل لازم يدفع في ميعاده.
      ar: على صاحب العمل أن يدفع في موعده.
      en: The employer must pay on time.
    answer: Majikan harus membayar tepat waktu.
    distractors: [imbalan, konsultan]
    words: [majikan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Dia membantu saya tanpa minta imbalan.
    answers_meaning:
      ar_eg: [ساعدني من غير ما يطلب مقابل, ساعدني ببلاش من غير مقابل]
      ar: [ساعدني دون أن يطلب مقابلًا, ساعدني بلا مقابل]
      en: [He helped me without asking for anything in return, She helped me without asking for a reward]
    words: [imbalan]
  - id: e10
    type: speaking
    text: Menurut konsultan itu, kita harus mulai menabung sekarang.
    meaning:
      ar_eg: الاستشاري بيقول لازم نبدأ نحوّش من دلوقتي.
      ar: يرى المستشار أن علينا أن نبدأ الادخار الآن.
      en: The consultant says we have to start saving now.
    words: [konsultan, menabung]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kamu udah mulai menabung dari gaji pertama?
      ar_eg: يا محمد، بدأت تحوّش من أول مرتب؟
      ar: يا محمد، هل بدأت تدّخر من راتبك الأول؟
      en: Mohamed, have you started saving from your first salary?
    - speaker: Mohamed
      text: Udah, dikit. Tabunganku buat tiket pulang ke Kairo.
      ar_eg: أيوه، شوية. التحويشة بتاعتي لتذكرة الرجوع للقاهرة.
      ar: نعم، قليلًا. مدّخراتي لتذكرة العودة إلى القاهرة.
      en: Yes, a little. My savings are for a ticket home to Cairo.
    - speaker: Rina
      text: Bagus. Adikku masih pengangguran, jadi aku bantuin dia.
      ar_eg: حلو. أخويا الصغير لسه عاطل، فأنا بساعده.
      ar: جيد. أخي الأصغر ما زال عاطلًا، لذا أساعده.
      en: Good. My younger brother is still unemployed, so I help him.
    - speaker: Mohamed
      text: Dulu dia kerja harian, kan? Majikannya baik nggak?
      ar_eg: مش كان بيشتغل باليومية؟ صاحب الشغل كان كويس؟
      ar: ألم يكن يعمل باليومية؟ هل كان صاحب العمل جيدًا؟
      en: He used to do day work, right? Was his employer decent?
    - speaker: Rina
      text: Nggak. Sekarang dia lagi ngobrol sama konsultan karier soal profesi baru.
      ar_eg: لأ. دلوقتي بيتكلم مع استشاري مهني عن مهنة جديدة.
      ar: لا. الآن يتحدث مع مستشار مهني عن مهنة جديدة.
      en: No. Now he's talking to a career consultant about a new profession.
    - speaker: Mohamed
      text: Semoga masalah finansialnya cepet beres, ya.
      ar_eg: إن شاء الله مشاكله المالية تتحل قريب.
      ar: أرجو أن تنتهي مشكلاته المالية قريبًا.
      en: I hope his money troubles end soon.
