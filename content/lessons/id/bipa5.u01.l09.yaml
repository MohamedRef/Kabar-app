        en: unemployment
    words: [tabungan, menabung, finansial, pengangguran]
  - id: e02
    type: match_pairs
    pairs:
      - text: imbalan
        ar_eg: مقابل، مكافأة
        ar: مكافأة، مقابل
        en: reward
      - text: majikan
