  - id: e03
    type: listen
    text: Warung itu di depan gereja.
    question:
      ar_eg: المطعم الصغير فين؟
      ar: أين المطعم الشعبي؟
      en: Where's the warung?
    options: [قدام الكنيسة, ورا البنك, جنب المحطة]
    answer: 0
    meaning:
      ar_eg: المطعم الصغير ده قدام الكنيسة.
      ar: ذلك المطعم الشعبي أمام الكنيسة.
      en: That warung is in front of the church.
    words: [warung, gereja]
  - id: e04
    type: fill_blank
    sentence: Jaraknya lima ratus ___.
    meaning:
      ar_eg: المسافة خمسمية ___.
      ar: المسافة خمسمئة ___.
      en: It's five hundred ___ away.
    options: [meter, tangga, gedung]
    answers: [meter]
    words: [jarak, meter, tangga, gedung]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تسحب فلوس. تروح فين؟
      ar: تريد سحب نقود. إلى أين تذهب؟
      en: You want to withdraw money. Where do you go?
    options: [bank, gereja, warung]
    answer: 0
    explain:
      ar_eg: bank. gereja كنيسة، وwarung مطعم صغير.
      ar: bank، أما gereja فكنيسة وwarung مطعم شعبي.
      en: bank; gereja is a church and warung a small eatery.
    words: [bank, gereja, warung]
  - id: e06
    type: fill_blank
    sentence: Kantor saya di lantai tiga. Saya naik ___.
    meaning:
      ar_eg: مكتبي في الدور التالت. بطلع على ___.
      ar: مكتبي في الطابق الثالث، فأصعد ___.
      en: My office is on the third floor. I take the ___.
    options: [tangga, jarak, bank]
    answers: [tangga]
    words: [tangga, jarak, bank]
  - id: e07
    type: build_sentence
    source:
      ar_eg: انزل من الأتوبيس عند المحطة.
      ar: انزل من الحافلة عند المحطة.
      en: Get off the bus at the stop.
    answer: Turun dari bus di halte.
    distractors: [naik, meter]
    words: [turun]
  - id: e08
    type: translate
    direction: from_target
    source_text: Gedung itu tinggi sekali.
    answers_meaning:
      ar_eg: [المبنى ده عالي أوي, العمارة دي عالية جدًا]
      ar: [ذلك المبنى عالٍ جدًا, ذلك المبنى شاهق]
      en: [That building is very tall, That building is really tall]
    words: [gedung]
  - id: e09
    type: speaking
    text: Jarak dari stasiun ke museum dua ratus meter.
    meaning:
      ar_eg: المسافة من المحطة للمتحف ٢٠٠ متر.
      ar: المسافة من المحطة إلى المتحف مئتا متر.
      en: It's two hundred metres from the station to the museum.
    words: [jarak, meter]
  - id: e10
    type: multiple_choice
    question: Dari lantai dua ke lantai satu, kita ___.
    options: [turun, naik, jarak]
    answer: 0
    explain:
      ar_eg: من فوق لتحت = turun. naik العكس.
      ar: من الأعلى إلى الأسفل turun، وnaik عكسها.
      en: Going down is turun; naik is going up.
    words: [turun]
dialogue:
  lines:
    - speaker: Mohamed
      text: Permisi, Pak. Bank di mana?
      ar_eg: لو سمحت يا أستاذ، البنك فين؟
      ar: عفوًا يا سيدي، أين المصرف؟
      en: Excuse me, sir. Where's the bank?
    - speaker: Satpam
      text: Banknya di gedung itu, di sebelah gereja.
      ar_eg: البنك في المبنى ده، جنب الكنيسة.
      ar: المصرف في ذلك المبنى بجوار الكنيسة.
      en: The bank's in that building, next to the church.
    - speaker: Mohamed
      text: Jauh, Pak?
      ar_eg: بعيد يا أستاذ؟
      ar: هل هو بعيد يا سيدي؟
      en: Is it far?
    - speaker: Satpam
      text: Tidak. Jaraknya seratus meter. Jalan lurus, lalu belok kanan.
      ar_eg: لأ. المسافة ١٠٠ متر. امشي على طول، وبعدين حوّد يمين.
      ar: لا، المسافة مئة متر. امشِ مستقيمًا ثم انعطف يمينًا.
      en: No. It's a hundred metres. Go straight, then turn right.
    - speaker: Mohamed
      text: Ada warung di dekat bank?
      ar_eg: فيه مطعم صغير جنب البنك؟
      ar: هل هناك مطعم شعبي قرب المصرف؟
      en: Is there a warung near the bank?
    - speaker: Satpam
      text: Ada, di bawah, dekat tangga.
      ar_eg: أيوه، تحت، جنب السلم.
      ar: نعم، في الأسفل قرب الدرج.
      en: Yes, downstairs, near the stairs.
