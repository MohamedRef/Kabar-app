schema: kabar.lesson/v1
id: bipa1.u09.l07
language: id
title: Bank, warung, gereja
can_do:
  ar_eg: تسأل عن أماكن في المدينة وتفهم المسافة بالمتر وطلوع ونزول السلم.
  ar: أن تسأل عن أماكن في المدينة وتفهم المسافة بالأمتار وصعود الدرج ونزوله.
  en: Ask for places in town and understand distances in metres and going up or down stairs.
slides:
  - title: Di kota
    body:
      ar_eg: |
        gedung = مبنى، bank = بنك، warung = مطعم أو دكان صغير شعبي، gereja = كنيسة (وmasjid انت عارفها).
        tangga = سلم: naik tangga (يطلع السلم)، turun tangga (ينزل السلم). وturun كمان «ينزل» من الأتوبيس.
        meter = متر: Bank itu dua ratus meter dari sini. وtruk = عربية نقل كبيرة، بتقف قدام المحلات الصبح.
      ar: |
        gedung = مبنى، bank = مصرف، warung = مطعم أو دكّان شعبي صغير، gereja = كنيسة (وmasjid تعرفها).
        tangga = درج: naik tangga (يصعد الدرج)، turun tangga (ينزل الدرج). وturun أيضًا «ينزل» من الحافلة.
        meter = متر: Bank itu dua ratus meter dari sini. وtruk = شاحنة، تقف أمام المتاجر صباحًا.
      en: |
        gedung = building, bank = bank, warung = a small local eatery or shop, gereja = church (you know masjid).
        tangga = stairs: naik tangga (go upstairs), turun tangga (go downstairs). turun also means get off a bus.
        meter = metre: Bank itu dua ratus meter dari sini. truk = lorry, truck; they stop outside the shops in the morning.
    examples:
      - text: Bank itu di sebelah kiri gedung besar.
        ar_eg: البنك على شمال المبنى الكبير.
        ar: المصرف على يسار المبنى الكبير.
        en: The bank is to the left of the big building.
      - text: Bank itu dua ratus meter dari sini.
        ar_eg: البنك ده على بعد ٢٠٠ متر من هنا.
        ar: ذلك المصرف على بعد مئتي متر من هنا.
        en: That bank is two hundred metres from here.
      - text: Turun dari bus di halte Monas.
        ar_eg: انزل من الأتوبيس عند محطة موناس.
        ar: انزل من الحافلة عند محطة موناس.
        en: Get off the bus at the Monas stop.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gedung
        ar_eg: مبنى
        ar: مبنى
        en: building
      - text: bank
        ar_eg: بنك
        ar: مصرف
        en: bank
      - text: warung
        ar_eg: مطعم صغير
        ar: مطعم شعبي
        en: small eatery
      - text: gereja
        ar_eg: كنيسة
        ar: كنيسة
        en: church
    words: [gedung, bank, warung, gereja]
  - id: e02
    type: match_pairs
    pairs:
      - text: tangga
        ar_eg: سلم
        ar: درج
        en: stairs
      - text: turun
        ar_eg: ينزل
        ar: ينزل
        en: go down
      - text: meter
        ar_eg: متر
        ar: متر
        en: metre
      - text: truk
        ar_eg: عربية نقل
        ar: شاحنة
        en: truck
    words: [tangga, turun, meter, truk]
  - id: e03
    type: listen
    text: Warung itu di depan gereja.
    question:
      ar_eg: المطعم الصغير فين؟
      ar: أين المطعم الشعبي؟
      en: Where's the warung?
    options: [قدام الكنيسة, ورا البنك, جنب المحطة]
    answer: 0
    meaning:
      ar_eg: المطعم الصغير ده قدام الكنيسة.
      ar: ذلك المطعم الشعبي أمام الكنيسة.
      en: That warung is in front of the church.
    words: [warung, gereja]
  - id: e04
    type: fill_blank
    sentence: Gereja itu lima ratus ___ dari sini.
    meaning:
      ar_eg: الكنيسة دي على بعد خمسمية ___ من هنا.
      ar: تلك الكنيسة على بعد خمسمئة ___ من هنا.
      en: That church is five hundred ___ from here.
    options: [meter, tangga, gedung]
    answers: [meter]
    words: [meter, tangga, gedung]
    explain:
      ar_eg: خمسمية متر = lima ratus meter. tangga = سلّم، وgedung = مبنى.
      ar: خمسمئة meter. tangga سلّم وgedung مبنى.
      en: 500 meter from here.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تسحب فلوس. تروح فين؟
      ar: تريد سحب نقود. إلى أين تذهب؟
      en: You want to withdraw money. Where do you go?
    options: [bank, gereja, warung]
    answer: 0
    explain:
      ar_eg: bank. gereja كنيسة، وwarung مطعم صغير.
      ar: bank، أما gereja فكنيسة وwarung مطعم شعبي.
      en: bank; gereja is a church and warung a small eatery.
    words: [bank, gereja, warung]
  - id: e06
    type: fill_blank
    sentence: Kantor saya di lantai tiga. Saya naik ___.
    meaning:
      ar_eg: مكتبي في الدور التالت. بطلع على ___.
      ar: مكتبي في الطابق الثالث، فأصعد ___.
      en: My office is on the third floor. I take the ___.
    options: [tangga, truk, bank]
    answers: [tangga]
    words: [tangga, truk, bank]
    explain:
      ar_eg: الدور التالت، فبطلع tangga = السلم. truk = نقل، وbank = بنك.
      ar: الطابق الثالث فأصعد tangga أي الدرج.
      en: "Third floor: take the tangga (stairs)."
  - id: e07
    type: build_sentence
    source:
      ar_eg: انزل من الأتوبيس عند المحطة.
      ar: انزل من الحافلة عند المحطة.
      en: Get off the bus at the stop.
    answer: Turun dari bus di halte.
    distractors: [naik, meter]
    words: [turun]
    explain:
      ar_eg: Turun (انزل) + dari bus + di halte. naik عكسها، وmeter زيادة.
      ar: Turun dari bus di halte. naik ضدها وmeter زائدة.
      en: Turun + dari bus + di halte. naik and meter are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Gedung itu seratus meter dari stasiun.
    answers_meaning:
      ar_eg: [المبنى ده على بعد مية متر من المحطة, العمارة دي على بعد ١٠٠ متر من المحطة]
      ar: [ذلك المبنى على بعد مئة متر من المحطة, يبعد ذلك المبنى مئة متر عن المحطة]
      en: [That building is a hundred metres from the station, That building is 100 metres from the station]
    words: [gedung, meter]
  - id: e09
    type: speaking
    text: Ada truk besar di depan bank.
    meaning:
      ar_eg: فيه عربية نقل كبيرة قدام البنك.
      ar: هناك شاحنة كبيرة أمام المصرف.
      en: There's a big truck in front of the bank.
    words: [truk, bank]
  - id: e10
    type: multiple_choice
    question: Dari lantai dua ke lantai satu, kita ___.
    options: [turun, naik, meter]
    answer: 0
    explain:
      ar_eg: من فوق لتحت = turun. naik العكس.
      ar: من الأعلى إلى الأسفل turun، وnaik عكسها.
      en: Going down is turun; naik is going up.
    words: [turun]
dialogue:
  lines:
    - speaker: Mohamed
      text: Permisi, Pak. Bank di mana?
      ar_eg: لو سمحت يا أستاذ، البنك فين؟
      ar: عفوًا يا سيدي، أين المصرف؟
      en: Excuse me, sir. Where's the bank?
    - speaker: Satpam
      text: Banknya di gedung itu, di sebelah gereja.
      ar_eg: البنك في المبنى ده، جنب الكنيسة.
      ar: المصرف في ذلك المبنى بجوار الكنيسة.
      en: The bank's in that building, next to the church.
    - speaker: Mohamed
      text: Jauh, Pak?
      ar_eg: بعيد يا أستاذ؟
      ar: هل هو بعيد يا سيدي؟
      en: Is it far?
    - speaker: Satpam
      text: Tidak. Seratus meter dari sini. Jalan lurus, lalu belok kanan.
      ar_eg: لأ. ١٠٠ متر من هنا. امشي على طول، وبعدين حوّد يمين.
      ar: لا، مئة متر من هنا. امشِ مستقيمًا ثم انعطف يمينًا.
      en: No. A hundred metres from here. Go straight, then turn right.
    - speaker: Mohamed
      text: Ada warung di dekat bank?
      ar_eg: فيه مطعم صغير جنب البنك؟
      ar: هل هناك مطعم شعبي قرب المصرف؟
      en: Is there a warung near the bank?
    - speaker: Satpam
      text: Ada, di bawah, dekat tangga. Di depannya ada truk besar.
      ar_eg: أيوه، تحت، جنب السلم. قدامه عربية نقل كبيرة.
      ar: نعم، في الأسفل قرب الدرج، وأمامه شاحنة كبيرة.
      en: Yes, downstairs, near the stairs. There's a big truck in front of it.
