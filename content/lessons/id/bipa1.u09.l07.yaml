schema: kabar.lesson/v1
id: bipa1.u09.l07
language: id
title: Ke Monas
can_do:
  ar_eg: تفهم الاتجاهات وتوصفها على خريطة.
  ar: أن تتبع الاتجاهات وتصفها على خريطة.
  en: Follow and give directions on a map.
slides:
  - title: Bertanya jalan
    body:
      ar_eg: |-
        لما تسأل عن الطريق في جاكرتا:
        1. ابدأ بـ Permisi (لو سمحت).
        2. اسأل: … di mana, ya? أو Saya mau ke …
        3. اسمع الخطوات: jalan lurus، belok kiri / kanan، lalu، kemudian.
        4. كرّر عشان تتأكد: Belok kanan di lampu merah, lalu?
        5. اختم بـ Terima kasih banyak!
        الناس هنا بيوصفوا بالعلامات: «عند الجامع»، «بعد الإشارة».
        على الخريطة (peta) استخدم كلمات المكان: Loketnya di samping pintu masuk = شباك التذاكر جنب المدخل. Halte bus di depan stasiun = محطة الأتوبيس قدّام محطة القطر.
      ar: |-
        حين تسأل عن الطريق في جاكرتا:
        1. ابدأ بـ Permisi (عفوًا).
        2. اسأل: … di mana, ya؟ أو Saya mau ke …
        3. استمع للخطوات: jalan lurus، belok kiri / kanan، lalu، kemudian.
        4. كرّر لتتأكد: Belok kanan di lampu merah, lalu؟
        5. واختم بـ Terima kasih banyak!
        ويصف الناس الطريق بالمعالم: «عند المسجد»، «بعد الإشارة».
        وعلى الخريطة (peta) استعمل ظروف المكان: Loketnya di samping pintu masuk = شباك التذاكر بجانب المدخل. Halte bus di depan stasiun = موقف الحافلات أمام المحطة.
      en: |-
        Asking the way in Jakarta:
        1. Start with Permisi (excuse me).
        2. Ask: … di mana, ya? or Saya mau ke …
        3. Listen for the steps: jalan lurus, belok kiri / kanan, lalu, kemudian.
        4. Repeat to check: Belok kanan di lampu merah, lalu?
        5. Finish with Terima kasih banyak!
        People give directions by landmarks: "at the mosque", "after the lights".
        On a map (peta), use position words. Loketnya di samping pintu masuk = The ticket counter is next to the entrance. Halte bus di depan stasiun = The bus stop is in front of the station.
    grammar: id.conjunction.basic
    examples:
      - text: Permisi, Pak. Saya mau ke Monas. Jauh atau dekat?
        ar_eg: لو سمحت يا عمّ. أنا عايز أروح موناس. بعيد ولا قريب؟
        ar: عفوًا يا سيدي، أريد الذهاب إلى موناس. أهو بعيد أم قريب؟
        en: Excuse me, sir. I want to go to Monas. Is it far or close?
      - text: Monas di antara stasiun dan masjid.
        ar_eg: موناس بين المحطة والجامع.
        ar: موناس بين المحطة والمسجد.
        en: Monas is between the station and the mosque.
exercises:
  - id: e01
    type: multiple_choice
    question: Dari stasiun, jalan lurus, lalu belok kanan di lampu merah. Monas di sebelah kiri.
    question_meaning:
      ar_eg: بعد ما تخش يمين عند الإشارة، موناس هيبقى فين؟
      ar: بعد أن تنعطف يمينًا عند الإشارة، أين يكون موناس؟
      en: After you turn right at the traffic light, where is Monas?
    options: [Di sebelah kiri, Di belakang stasiun, Di sebelah kanan]
    answer: 0
    explain:
      ar_eg: di sebelah kiri = على الشمال.
      ar: di sebelah kiri = على اليسار.
      en: di sebelah kiri = on the left.
    words: [sebelah, kiri]
  - id: e02
    type: listen
    text: Loketnya di samping pintu masuk.
    options: [Loketnya di samping pintu masuk., Loketnya di dalam stasiun., Loketnya di belakang pintu masuk.]
    answer: 0
    words: [loket, samping, pintu masuk]
  - id: e03
    type: fill_blank
    sentence: Permisi, Pak. Saya mau ___ Monas.
    meaning:
      ar_eg: لو سمحت يا عمّ. أنا عايز أروح موناس.
      ar: عفوًا يا سيدي، أريد الذهاب إلى موناس.
      en: Excuse me, sir. I want to go to Monas.
    answers: [ke, pergi ke]
    explain:
      ar_eg: فيه حركة لمكان، يبقى ke.
      ar: الحركة نحو مكان تستلزم ke.
      en: Movement to a place → ke.
    words: [ke]
  - id: e04
    type: fill_blank
    sentence: Belok kanan di lampu merah, ___ jalan lurus.
    meaning:
      ar_eg: خش يمين عند الإشارة، وبعدين امشي دغري.
      ar: انعطف يمينًا عند الإشارة، ثم امشِ مستقيمًا.
      en: Turn right at the traffic light, then go straight.
    answers: [lalu, kemudian, terus]
    explain:
      ar_eg: «وبعدين» = lalu أو kemudian (وفي الكلام terus كمان).
      ar: «ثم» = lalu أو kemudian (وفي العامية terus).
      en: '"then" = lalu or kemudian (casually also terus).'
    words: [lalu, kemudian]
  - id: e05
    type: build_sentence
    source:
      ar_eg: امشي دغري، وبعدين خش شمال عند الجامع.
      ar: امشِ مستقيمًا، ثم انعطف يسارًا عند المسجد.
      en: Go straight, then turn left at the mosque.
    answer: Jalan lurus, lalu belok kiri di masjid.
    alternatives: [Jalan lurus lalu belok kiri di masjid.]
    distractors: [kanan, atau]
    words: [lurus, lalu, belok, kiri]
  - id: e06
    type: build_sentence
    source:
      ar_eg: محطة الأتوبيس قدّام محطة القطر.
      ar: موقف الحافلات أمام محطة القطار.
      en: The bus stop is in front of the train station.
    answer: Halte bus di depan stasiun.
    distractors: [belakang, ke]
    words: [halte, depan, stasiun]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لو سمحت، شباك التذاكر فين؟
      ar: عفوًا، أين شباك التذاكر؟
      en: Excuse me, where is the ticket counter?
    answers: ['Permisi, loketnya di mana?', 'Permisi, loket di mana?', 'Permisi, di mana loketnya?', 'Permisi, loket tiketnya di mana?', 'Permisi, loketnya di mana', 'Permisi, loketnya di mana, ya?']
    words: [permisi, loket]
  - id: e08
    type: dictation
    text: Terima kasih banyak, Pak!
    meaning:
      ar_eg: شكرًا جزيلًا يا عمّ!
      ar: شكرًا جزيلًا يا سيدي!
      en: Thank you very much, sir!
    words: [terima kasih]
  - id: e09
    type: speaking
    text: Dari stasiun, jalan lurus, lalu belok kanan di lampu merah. Monas di sebelah kiri.
    meaning:
      ar_eg: من المحطة امشي دغري، وبعدين خش يمين عند الإشارة. موناس على الشمال.
      ar: من المحطة امشِ مستقيمًا، ثم انعطف يمينًا عند الإشارة، وموناس على اليسار.
      en: From the station, go straight, then turn right at the traffic light. Monas is on the left.
    words: [dari, lurus, lalu, belok, sebelah]
  - id: e10
    type: speaking
    text: Permisi, Pak. Masjid Istiqlal di mana, ya?
    meaning:
      ar_eg: لو سمحت يا عمّ. جامع الاستقلال فين؟
      ar: عفوًا يا سيدي، أين مسجد الاستقلال؟
      en: Excuse me, sir. Where is Istiqlal Mosque?
    words: [permisi, masjid]
dialogue:
  title: Dari Stasiun Gambir ke Monas
  lines:
    - speaker: Mohamed
      text: Permisi, Pak. Saya mau ke Monas. Jauh atau dekat?
      ar_eg: لو سمحت يا عمّ. أنا عايز أروح موناس. بعيد ولا قريب؟
      ar: عفوًا يا سيدي، أريد الذهاب إلى موناس. أهو بعيد أم قريب؟
      en: Excuse me, sir. I want to go to Monas. Is it far or close?
    - speaker: Satpam
      text: Dekat sekali, Mas. Dari stasiun, jalan lurus ke depan.
      ar_eg: قريب جدًا يا ابني. من المحطة امشي دغري لقدّام.
      ar: قريب جدًا. من المحطة امشِ مستقيمًا إلى الأمام.
      en: Very close. From the station, go straight ahead.
    - speaker: Mohamed
      text: Jalan lurus, lalu?
      ar_eg: أمشي دغري، وبعدين؟
      ar: أمشي مستقيمًا، ثم؟
      en: Go straight, and then?
    - speaker: Satpam
      text: Lalu belok kanan di lampu merah. Monas di sebelah kiri.
      ar_eg: وبعدين خش يمين عند الإشارة. موناس هيبقى على شمالك.
      ar: ثم انعطف يمينًا عند الإشارة، وموناس على يسارك.
      en: Then turn right at the traffic light. Monas is on the left.
    - speaker: Mohamed
      text: Terima kasih banyak, Pak!
      ar_eg: شكرًا جزيلًا يا عمّ!
      ar: شكرًا جزيلًا يا سيدي!
      en: Thank you very much, sir!
    - speaker: Satpam
      text: Sama-sama, Mas. Selamat jalan!
      ar_eg: العفو يا ابني. توصل بالسلامة!
      ar: عفوًا. رافقتك السلامة!
      en: You're welcome. Have a good trip!
