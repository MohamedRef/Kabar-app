schema: kabar.lesson/v1
id: bipa3.u02.l03
language: id
title: Buanglah! Apakah…?
can_do:
  ar_eg: تفهم وتستعمل -lah في اليفط والأوامر المؤدبة، و -kah في الأسئلة.
  ar: أن تفهم -lah في اللافتات والأوامر المهذبة، و-kah في الأسئلة، وتستعملهما.
  en: Use -lah and -kah in signs and questions.
slides:
  - title: -lah
    grammar: id.particle.lah-kah-pun
    body:
      ar_eg: |
        -lah بتلزق في آخر الكلمة:
        - على فعل = أمر مؤدب أو بتأكيد، وده اللي بتشوفه في اليفط: Buanglah sampah pada tempatnya = ارمي الزبالة في مكانها.
        - على ini / itu = «ها هو»: Inilah Pantai Senggigi! = أهو ده شط سنجيجي!
        الفعل في الأمر بيبقى من غير meN-: buang، مش membuang.
      ar: |
        تتصل -lah بآخر الكلمة:
        - مع الفعل = أمر مهذّب أو مؤكّد، كما في اللافتات: Buanglah sampah pada tempatnya = ضع النفايات في مكانها.
        - مع ini / itu = «ها هو ذا»: Inilah Pantai Senggigi! = ها هو شاطئ سنغيغي!
        والفعل في الأمر يأتي بلا meN-: buang لا membuang.
      en: |
        -lah attaches to the end of a word:
        - on a verb = a polite or emphatic command, the kind you see on signs: Buanglah sampah pada tempatnya = Put rubbish in its place.
        - on ini / itu = "here is…!": Inilah Pantai Senggigi! = Here's Senggigi Beach!
        In a command the verb drops meN-: buang, not membuang.
    examples:
      - text: Buanglah sampah pada tempatnya.
        ar_eg: ارمي الزبالة في مكانها.
        ar: ضع النفايات في مكانها.
        en: Put rubbish in its place.
      - text: Inilah Pantai Senggigi yang terkenal itu.
        ar_eg: أهو ده شط سنجيجي المشهور.
        ar: ها هو شاطئ سنغيغي المشهور.
        en: Here's the famous Senggigi Beach.
  - title: Apakah, bukankah, benarkah
    grammar: id.particle.lah-kah-pun
    body:
      ar_eg: |
        -kah بتلزق في الكلمة اللي بتسأل عنها:
        apakah = «هل» بالظبط، وفي الكلام العادي بتتشال زي ما احنا بنشيل «هل».
        bukankah = «أليس…؟» (مستني إجابة «أيوه»).
        Benarkah? = بجد؟ / صحيح؟
      ar: |
        تتصل -kah بالكلمة المسؤول عنها:
        apakah = «هل» تمامًا، وتُحذف في الكلام العادي.
        bukankah = «أليس…؟» (ينتظر الجواب بنعم).
        Benarkah? = أحقًّا؟
      en: |
        -kah attaches to what's being asked:
        apakah = a yes/no question marker, like Arabic هل, often dropped in speech.
        bukankah = "isn't it…?" (expects yes), like Arabic أليس.
        Benarkah? = Really?
    examples:
      - text: Apakah kamu sudah melihat penyu di Gili?
        ar_eg: انت شفت السلاحف في جيلي؟
        ar: هل رأيتَ السلاحف في جيلي؟
        en: Have you seen the turtles on the Gilis?
      - text: Bukankah plastik berbahaya bagi laut?
        ar_eg: مش البلاستيك خطر على البحر؟
        ar: أليس البلاستيك خطرًا على البحر؟
        en: Isn't plastic dangerous for the sea?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: membuang
        ar_eg: يرمي
        ar: يرمي
        en: to throw away
      - text: tempat sampah
        ar_eg: صندوق زبالة
        ar: سلة المهملات
        en: rubbish bin
      - text: berbahaya
        ar_eg: خطير
        ar: خطير
        en: dangerous
      - text: bukankah
        ar_eg: مش…؟ (أليس)
        ar: أليس…؟
        en: isn't it…?
      - text: nelayan
        ar_eg: صياد سمك
        ar: صيّاد سمك
        en: fisherman
      - text: Benarkah?
        ar_eg: بجد؟
        ar: أحقًّا؟
        en: Really?
    words: [membuang, tempat sampah, berbahaya, bukankah, nelayan, benarkah]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: "يافطة على الشط: «ارمي الزبالة في مكانها». أنهي كتابة صح؟"
      ar: "لافتة على الشاطئ: «ضع النفايات في مكانها». أيّ كتابة صحيحة؟"
      en: 'A beach sign: "Put rubbish in its place." Which spelling is right?'
    options: ["Buang lah sampah pada tempatnya.", "Membuanglah sampah pada tempatnya.", "Buanglah sampah pada tempatnya."]
    answer: 2
    explain:
      ar_eg: -lah بتلزق من غير مسافة، والأمر من غير meN-.
      ar: تتصل -lah بلا فاصل، والأمر بلا meN-.
      en: -lah joins with no space, and the command drops meN-.
    words: [membuang]
  - id: e03
    type: listen
    text: Bukankah plastik berbahaya bagi laut?
    options: ["Apakah plastik berbahaya bagi laut?", "Bukankah plastik berbahaya bagi laut?", "Bukankah plastik bagus bagi laut?"]
    answer: 1
    meaning:
      ar_eg: مش البلاستيك خطر على البحر؟
      ar: أليس البلاستيك خطرًا على البحر؟
      en: Isn't plastic dangerous for the sea?
    words: [bukankah, berbahaya]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: "ني لوه قالت: «مفيش عربيات خالص في جيلي». انت مستغرب. تقول إيه؟"
      ar: "قالت ني لوه: «لا توجد سيارات في جيلي». أنت متعجّب، فماذا تقول؟"
      en: 'Ni Luh says: "There are no cars on the Gilis." You''re surprised. What do you say?'
    options: ["Benarkah?", "Inilah!", "Buanglah!"]
    answer: 0
    words: [benarkah]
  - id: e05
    type: fill_blank
    sentence: Jangan buang sampah di pantai. Buang di ___.
    meaning:
      ar_eg: ماترميش زبالة على الشط. ارميها في صندوق الزبالة.
      ar: لا ترمِ النفايات على الشاطئ، بل في سلة المهملات.
      en: Don't throw rubbish on the beach. Throw it in the bin.
    options: [nelayan, tempat sampah, laut]
    answers: [tempat sampah]
    words: [tempat sampah, membuang]
  - id: e06
    type: fill_blank
    sentence: Para ___ pergi ke laut dengan perahu setiap pagi.
    meaning:
      ar_eg: الصيادين بيطلعوا البحر بالمراكب كل يوم الصبح.
      ar: يخرج الصيّادون إلى البحر بالقوارب كل صباح.
      en: The fishermen go out to sea by boat every morning.
    options: [penyu, turis, nelayan]
    answers: [nelayan]
    words: [nelayan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: مش الزبالة خطر على السلاحف؟
      ar: أليست النفايات خطرًا على السلاحف؟
      en: Isn't rubbish dangerous for turtles?
    answer: Bukankah sampah berbahaya bagi penyu?
    distractors: [benarkah, tempat]
    words: [bukankah, berbahaya]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ارمي الزبالة في صندوق الزبالة (أمر مؤدب، زي اليفط).
      ar: ضع النفايات في سلة المهملات (أمر مهذّب كما في اللافتات).
      en: Put the rubbish in the bin (a polite command, as on signs).
    answers:
      - Buanglah sampah di tempat sampah.
      - Buanglah sampah di tempat sampah
      - Buanglah sampah ke tempat sampah.
      - Buanglah sampah ke tempat sampah
      - Buanglah sampah pada tempatnya.
      - Buanglah sampahnya di tempat sampah.
      - Buanglah sampahnya ke tempat sampah.
    words: [membuang, tempat sampah]
  - id: e09
    type: speaking
    text: Benarkah para nelayan juga menjaga penyu?
    meaning:
      ar_eg: بجد الصيادين كمان بيحافظوا على السلاحف؟
      ar: أحقًّا يحافظ الصيّادون أيضًا على السلاحف؟
      en: Is it true the fishermen look after the turtles too?
    words: [benarkah, nelayan]
dialogue:
  title: Tulisan di pantai
  lines:
    - speaker: Mohamed
      text: "Mas Rizal, tulisan itu artinya apa? \"Buanglah sampah pada tempatnya.\""
      ar_eg: يا أستاذ ريزال، اليافطة دي معناها إيه؟ «ارمي الزبالة في مكانها».
      ar: يا ريزال، ما معنى هذه اللافتة؟ «ضع النفايات في مكانها».
      en: Mas Rizal, what does that sign mean? "Put rubbish in its place."
    - speaker: Mas Rizal
      text: Artinya, jangan buang sampah di pantai. Buang di tempat sampah aja.
      ar_eg: يعني ماترميش زبالة على الشط. ارميها في صندوق الزبالة.
      ar: معناها لا ترمِ النفايات على الشاطئ، بل في سلة المهملات.
      en: It means don't throw rubbish on the beach. Use the bin.
    - speaker: Mohamed
      text: Bukankah banyak turis bawa plastik ke sini?
      ar_eg: مش سياح كتير بيجيبوا بلاستيك هنا؟
      ar: أليس كثير من السياح يجلبون البلاستيك إلى هنا؟
      en: Don't lots of tourists bring plastic here?
    - speaker: Mas Rizal
      text: Iya. Plastik berbahaya buat penyu sama ikan. Nelayan juga sedih.
      ar_eg: أيوه. البلاستيك خطر على السلاحف والسمك. والصيادين كمان زعلانين.
      ar: نعم، البلاستيك خطر على السلاحف والأسماك، والصيّادون حزانى أيضًا.
      en: Yes. Plastic is dangerous for turtles and fish. The fishermen are sad too.
    - speaker: Mohamed
      text: Benarkah? Kalau gitu, ayo kita jaga pantai ini!
      ar_eg: بجد؟ يبقى يلا نحافظ على الشط ده!
      ar: أحقًّا؟ إذن هيا نحافظ على هذا الشاطئ!
      en: Really? Then let's look after this beach!
