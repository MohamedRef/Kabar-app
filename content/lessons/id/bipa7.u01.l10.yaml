schema: kabar.lesson/v1
id: bipa7.u01.l10
language: id
title: Atlet paralimpiade
can_do:
  ar_eg: تتكلّم باحترام عن رياضيين من ذوي الإعاقة وعن تسليم الراية للجيل الجاي.
  ar: أن تتحدّث باحترام عن الرياضيين ذوي الإعاقة وعن إعداد الجيل القادم.
  en: Talk respectfully about athletes with disabilities and about raising the next generation.
slides:
  - title: Bahasa yang menghormati
    body:
      ar_eg: |
        الأخبار بتقول penyandang disabilitas أو difabel، مش كلمات قديمة جارحة.
        disabilitas = الإعاقة. Paralimpiade = البارالمبياد.
        perintis = الرائد اللي فتح الطريق. regenerasi = تجهيز جيل جديد ياخد مكان الكبار.
        almamater = الجامعة أو المدرسة اللي اتخرّجت منها.
        berdaya saing = قادر ينافس. mancanegara = بلاد برّه (atlet mancanegara = رياضيين أجانب).
        - في الكلام: gimana = bagaimana، soal = tentang، ngelatih = melatih، iya = ya، lawan = melawan، sama = dan / dengan.
      ar: |
        تستعمل الأخبار penyandang disabilitas أو difabel بدل الألفاظ القديمة الجارحة.
        disabilitas = الإعاقة. Paralimpiade = الألعاب البارالمبية.
        perintis = الرائد الذي فتح الطريق. regenerasi = إعداد جيل جديد يخلف الكبار.
        almamater = الجامعة أو المدرسة التي تخرّج فيها المرء.
        berdaya saing = ذو قدرة تنافسية. mancanegara = البلدان الأجنبية (atlet mancanegara = رياضيّون أجانب).
        - في الكلام اليومي: gimana = bagaimana، soal = tentang، ngelatih = melatih، iya = ya، lawan = melawan، sama = dan / dengan.
      en: |
        News language says penyandang disabilitas or difabel, not the old hurtful words.
        disabilitas = disability. Paralimpiade = the Paralympics.
        perintis = the pioneer who opened the way. regenerasi = raising a new generation to take over.
        almamater = the school or university you graduated from.
        berdaya saing = competitive. mancanegara = foreign countries (atlet mancanegara = foreign athletes).
        - In speech: gimana = bagaimana, soal = tentang, ngelatih = melatih, iya = ya, lawan = melawan, sama = dan / dengan.
    examples:
      - text: Atlet difabel itu bertanding di Paralimpiade.
        ar_eg: الرياضي ده من ذوي الهمم ونافس في البارالمبياد.
        ar: نافس ذلك الرياضي من ذوي الإعاقة في الألعاب البارالمبية.
        en: That athlete with a disability competed at the Paralympics.
      - text: Dia perintis klub renang untuk penyandang disabilitas.
        ar_eg: هي اللي أسّست أول نادي سباحة لذوي الإعاقة.
        ar: هي رائدة نادي السباحة للأشخاص ذوي الإعاقة.
        en: She pioneered a swimming club for people with disabilities.
      - text: Regenerasi atlet penting supaya kita tetap berdaya saing.
        ar_eg: تجديد الأجيال مهم علشان نفضل قادرين ننافس.
        ar: تجديد أجيال الرياضيين مهمّ لنبقى قادرين على المنافسة.
        en: Bringing up new athletes matters so we stay competitive.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: paralimpiade
        ar_eg: البارالمبياد
        ar: الألعاب البارالمبية
        en: the Paralympics
      - text: difabel
        ar_eg: من ذوي الهمم
        ar: من ذوي القدرات المختلفة
        en: person with a disability (differently abled)
      - text: disabilitas
        ar_eg: إعاقة
        ar: إعاقة
        en: disability
      - text: regenerasi
        ar_eg: تجديد الأجيال / تسليم الراية
        ar: تجديد الأجيال
        en: regeneration, bringing up the next generation
    words: [paralimpiade, difabel, disabilitas, regenerasi]
  - id: e02
    type: match_pairs
    pairs:
      - text: perintis
        ar_eg: رائد / أول واحد فتح الطريق
        ar: رائد، مؤسّس
        en: pioneer, trailblazer
      - text: almamater
        ar_eg: الجامعة أو المدرسة اللي اتخرّجت منها
        ar: الجامعة الأمّ (التي تخرّج فيها المرء)
        en: alma mater
      - text: berdaya saing
        ar_eg: قادر ينافس
        ar: ذو قدرة تنافسية
        en: competitive
      - text: mancanegara
        ar_eg: بلاد برّه / دول أجنبية
        ar: البلدان الأجنبية
        en: foreign countries, abroad
    words: [perintis, almamater, berdaya saing, mancanegara]
  - id: e03
    type: listen
    text: Setelah juara, dia kembali ke almamaternya untuk melatih adik kelas.
    question:
      ar_eg: رجع فين؟
      ar: إلى أين عاد؟
      en: Where did he go back to?
    options: [الجامعة اللي اتخرّج منها, بلاد برّه, البارالمبياد]
    answer: 0
    meaning:
      ar_eg: بعد ما كسب، رجع لجامعته اللي اتخرّج منها يدرّب الطلبة الأصغر.
      ar: بعد فوزه عاد إلى جامعته الأمّ ليدرّب الطلّاب الأصغر.
      en: After winning, he went back to his alma mater to coach younger students.
    words: [almamater]
  - id: e04
    type: fill_blank
    sentence: Banyak pelatih dari ___ datang ke Solo.
    meaning:
      ar_eg: مدرّبين كتير من ___ جم سولو.
      ar: جاء مدرّبون كثيرون من ___ إلى سولو.
      en: Many coaches from ___ came to Solo.
    options: [mancanegara, disabilitas, regenerasi]
    answers: [mancanegara]
    words: [mancanegara, disabilitas, regenerasi]
    explain:
      ar_eg: mancanegara = من برّه البلد/من دول تانية. disabilitas = إعاقة، وregenerasi = تجديد الأجيال.
      ar: mancanegara = الدول الأجنبية. أما disabilitas فالإعاقة وregenerasi تجديد الأجيال.
      en: dari mancanegara = from abroad. disabilitas is disability, regenerasi renewal.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين «perintis»؟
      ar: مَن «perintis»؟
      en: Who is a 'perintis'?
    options: [Orang yang datang paling akhir., Orang yang membuka jalan pertama kali., Atlet dari mancanegara.]
    answer: 1
    explain:
      ar_eg: perintis = الرائد، أول واحد بدأ.
      ar: perintis = الرائد الذي بدأ أوّلًا.
      en: perintis = the pioneer, the first to start.
    words: [perintis, mancanegara]
  - id: e06
    type: fill_blank
    sentence: Tanpa ___, tim kita akan kehabisan atlet muda.
    meaning:
      ar_eg: من غير ___، فريقنا هيخلص منه الرياضيين الصغيرين.
      ar: بدون ___ سينفد الرياضيون الشباب من فريقنا.
      en: Without ___, our team will run out of young athletes.
    options: [regenerasi, almamater, paralimpiade]
    answers: [regenerasi]
    words: [regenerasi, almamater, paralimpiade]
    explain:
      ar_eg: regenerasi = تجديد الأجيال، ومن غيره الفريق يخلص منه الرياضيين الصغيرين. almamater = الجامعة اللي اتخرجت منها، وparalimpiade = البارالمبياد.
      ar: regenerasi = تجديد الأجيال، ومن دونه ينفد الرياضيون الشباب. أما almamater فالجامعة الأم، وparalimpiade البارالمبياد.
      en: Without regenerasi (renewal) the team runs out of young athletes. almamater is your old school; paralimpiade the Paralympics.
  - id: e07
    type: build_sentence
    source:
      ar_eg: البلد محتاجة رياضيين قادرين ينافسوا.
      ar: يحتاج البلد إلى رياضيين قادرين على المنافسة.
      en: The country needs competitive athletes.
    answer: Negara membutuhkan atlet yang berdaya saing.
    distractors: [difabel, perintis]
    words: [berdaya saing]
    explain:
      ar_eg: berdaya saing = عنده قدرة تنافسية. difabel = ذوي الإعاقة، وperintis = رائد/مؤسس، ومش داخلين في الجملة.
      ar: berdaya saing = ذو قدرة تنافسية. أما difabel فذوو الإعاقة وperintis الرائد، ولا موضع لهما.
      en: berdaya saing means competitive. difabel and perintis don't fit this sentence.
  - id: e08
    type: translate
    direction: from_target
    source_text: Penyandang disabilitas berhak berolahraga seperti orang lain.
    answers_meaning:
      ar_eg: [ذوي الإعاقة ليهم حق يلعبوا رياضة زي أي حد, الناس اللي عندهم إعاقة من حقهم يمارسوا الرياضة زي غيرهم]
      ar: [يحقّ للأشخاص ذوي الإعاقة ممارسة الرياضة كغيرهم, لذوي الإعاقة الحقّ في الرياضة مثل الآخرين]
      en: [People with disabilities have the right to do sport like anyone else, Disabled people are entitled to play sport like others]
    words: [disabilitas]
  - id: e09
    type: speaking
    text: Atlet difabel kita berdaya saing di Paralimpiade.
    meaning:
      ar_eg: رياضيينا من ذوي الهمم بينافسوا بقوة في البارالمبياد.
      ar: رياضيّونا من ذوي الإعاقة قادرون على المنافسة في البارالمبياد.
      en: Our athletes with disabilities are competitive at the Paralympics.
    words: [difabel, berdaya saing, paralimpiade]
  - id: e10
    type: multiple_choice
    question: Kata mana yang sopan di berita?
    options: [difabel, perintis, almamater]
    answer: 0
    explain:
      ar_eg: difabel كلمة محترمة بتقولها الأخبار.
      ar: difabel لفظ لائق تستعمله الأخبار.
      en: difabel is a respectful word used in the news.
    words: [difabel, perintis, almamater, paralimpiade, disabilitas]
dialogue:
  lines:
    - speaker: Kaka Yohana
      text: Mohamed, besok kita liput Om Markus. Dia perintis klub para-renang di Sorong.
      ar_eg: يا محمد، بكرة هنغطّي عمّو ماركوس. هو اللي أسّس أول نادي سباحة لذوي الهمم في سورونج.
      ar: يا محمد، سنغطّي غدًا العمّ ماركوس، رائد نادي السباحة البارالمبية في سورونغ.
      en: Mohamed, tomorrow we cover Om Markus. He started the para-swimming club in Sorong.
    - speaker: Mohamed
      text: Muridnya pernah ikut Paralimpiade, kan?
      ar_eg: واحد من تلامذته شارك في البارالمبياد قبل كده، صح؟
      ar: شارك أحد تلاميذه في البارالمبياد، أليس كذلك؟
      en: One of his swimmers was at the Paralympics, wasn't she?
    - speaker: Kaka Yohana
      text: Betul. Sekarang dia ngelatih atlet difabel muda di almamaternya.
      ar_eg: مظبوط. ودلوقتي بتدرّب رياضيين صغيّرين من ذوي الهمم في مدرستها القديمة.
      ar: صحيح، وهي تدرّب الآن رياضيين شبابًا من ذوي الإعاقة في مدرستها الأمّ.
      en: Right. Now she coaches young athletes with disabilities at her old school.
    - speaker: Mohamed
      text: Jadi beritanya soal regenerasi.
      ar_eg: يبقى الخبر عن تسليم الراية للجيل الجديد.
      ar: إذن الخبر عن تجديد الأجيال.
      en: So the story is about the next generation.
    - speaker: Kaka Yohana
      text: Iya. Sama soal gimana atlet kita tetap berdaya saing lawan atlet mancanegara.
      ar_eg: أيوه. وعن إزاي رياضيينا يفضلوا قادرين ينافسوا الأجانب.
      ar: نعم، وعن كيف يبقى رياضيّونا قادرين على منافسة الرياضيين الأجانب.
      en: Yes. And how our athletes stay competitive against foreign ones.
