schema: kabar.lesson/v1
id: bipa5.u08.l04
language: id
title: Jajak pendapat
can_do:
  ar_eg: تقرا نتيجة استطلاع رأي وتفهم العينة وهامش الخطأ قبل ما تصدّق الرقم.
  ar: أن تقرأ نتيجة استطلاع رأي وتفهم العيّنة وهامش الخطأ قبل أن تصدّق الرقم.
  en: Read an opinion poll and check the sample and margin of error before trusting the number.
slides:
  - title: Angka di balik opini
    body:
      ar_eg: |
        الجرايد الإندونيسية بتنشر استطلاعات كتير، خصوصًا قبل الانتخابات:
        - jajak pendapat = استطلاع رأي
        - lembaga survei = مؤسسة استطلاعات
        - sampel = العينة: الناس اللي اتسألوا فعلًا
        - margin kesalahan = هامش الخطأ (مثلًا ±٣٪)
        - tingkat kepuasan = نسبة الرضا
        لو الفرق بين رقمين أصغر من هامش الخطأ، ماتقولش إن واحد كسب. قول: «tampaknya bersaing ketat» (شكلهم متقاربين).
        (الأمثلة هنا مكتوبة للدرس، مش من استطلاع حقيقي.)
      ar: |
        تنشر الصحف الإندونيسية استطلاعات كثيرة، لا سيّما قبل الانتخابات:
        - jajak pendapat = استطلاع رأي
        - lembaga survei = مؤسّسة استطلاع
        - sampel = العيّنة، أي من سُئلوا فعلًا
        - margin kesalahan = هامش الخطأ (مثلًا ±٣٪)
        - tingkat kepuasan = نسبة الرضا
        وإذا كان الفرق بين رقمين أصغر من هامش الخطأ فلا تقل إنّ أحدهما فاز، بل قل: «tampaknya bersaing ketat» (يبدو أنهما متقاربان).
        (الأمثلة هنا مكتوبة للدرس، وليست من استطلاع حقيقي.)
      en: |
        Indonesian papers publish many polls, especially before elections:
        - jajak pendapat = opinion poll
        - lembaga survei = polling institute
        - sampel = sample, the people actually asked
        - margin kesalahan = margin of error (say ±3%)
        - tingkat kepuasan = satisfaction rate
        If the gap between two numbers is smaller than the margin of error, don't say one is winning. Say «tampaknya bersaing ketat» (they look neck and neck).
        (The examples are written for the lesson, not taken from a real poll.)
    examples:
      - text: Margin kesalahan jajak pendapat ini sekitar tiga persen.
        ar_eg: هامش الخطأ في الاستطلاع ده حوالي ٣٪.
        ar: هامش الخطأ في هذا الاستطلاع نحو ثلاثة بالمئة.
        en: This poll's margin of error is about three per cent.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jajak pendapat
        ar_eg: استطلاع رأي
        ar: استطلاع رأي
        en: opinion poll
      - text: sampel
        ar_eg: عينة
        ar: عيّنة
        en: sample
      - text: margin kesalahan
        ar_eg: هامش الخطأ
        ar: هامش الخطأ
        en: margin of error
      - text: tingkat kepuasan
        ar_eg: نسبة الرضا
        ar: نسبة الرضا
        en: satisfaction rate
      - text: lembaga survei
        ar_eg: مؤسسة استطلاعات
        ar: مؤسّسة استطلاع
        en: polling institute
    words: [jajak pendapat, sampel, margin kesalahan, tingkat kepuasan, lembaga survei]
  - id: e02
    type: listen
    text: Lembaga survei itu mewawancarai sampel 1.200 orang di seluruh Indonesia. Margin kesalahannya tiga persen, jadi hasilnya cukup bisa dipercaya.
    question:
      ar_eg: نقول إيه عن الاستطلاع ده؟
      ar: ماذا نقول عن هذا الاستطلاع؟
      en: What can we say about this poll?
    options:
      - Sampelnya kecil, jadi hasilnya tidak bisa dipercaya.
      - Sampelnya 1.200 orang, dan hasilnya cukup dapat dipercaya.
      - Lembaga survei itu hanya bertanya kepada orang Jakarta.
    answer: 1
    meaning:
      ar_eg: مؤسسة الاستطلاع دي عملت مقابلات مع عينة ١٢٠٠ واحد في إندونيسيا كلها. هامش الخطأ ٣٪، فالنتيجة ممكن نثق فيها لحد كبير.
      ar: قابلت مؤسسة الاستطلاع عيّنة من ١٢٠٠ شخص في أنحاء إندونيسيا، وهامش الخطأ ٣٪، فالنتيجة جديرة بالثقة إلى حدّ ما.
      en: The polling institute interviewed a sample of 1,200 people across Indonesia. The margin of error is three percent, so the results are fairly reliable.
    explain:
      ar_eg: 1.200 = ألف ومتين (النقطة في الإندونيسي بتفصل الآلاف)، وdi seluruh Indonesia = في البلد كلها، وcukup bisa dipercaya = ممكن نثق فيها.
      ar: 1.200 = ألف ومئتان (النقطة تفصل الآلاف)، وdi seluruh Indonesia = في البلاد كلّها، وcukup bisa dipercaya = جديرة بالثقة.
      en: 1.200 = 1,200 (the dot separates thousands); di seluruh Indonesia = nationwide; cukup bisa dipercaya = fairly reliable.
    words: [lembaga survei, sampel]
  - id: e03
    type: fill_blank
    sentence: Hasil ini punya ___ sekitar tiga persen.
    meaning:
      ar_eg: النتيجة دي ليها هامش خطأ حوالي ٣٪.
      ar: لهذه النتيجة هامش خطأ نحو ثلاثة بالمئة.
      en: This result has a margin of error of about three per cent.
    options: [margin kesalahan, tingkat kepuasan, sampel]
    answers: [margin kesalahan]
    words: [margin kesalahan]
    explain:
      ar_eg: «هامش الخطأ» = margin kesalahan. tingkat kepuasan = نسبة الرضا وsampel = عينة، مش نسبة خطأ.
      ar: «هامش الخطأ» = margin kesalahan. أما tingkat kepuasan فنسبة الرضا، وsampel العيّنة.
      en: "\"Margin of error\" is margin kesalahan. tingkat kepuasan (satisfaction) and sampel (sample) aren't."
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: «Tingkat kepuasan terhadap transportasi umum naik menjadi 70 persen.» معناها إيه؟
      ar: ما معنى «Tingkat kepuasan terhadap transportasi umum naik menjadi 70 persen.»؟
      en: What does "Tingkat kepuasan terhadap transportasi umum naik menjadi 70 persen." mean?
    options:
      - Tujuh puluh persen orang tidak puas.
      - Tujuh puluh persen orang naik transportasi umum.
      - Sekarang tujuh puluh persen orang puas dengan transportasi umum.
    answer: 2
    words: [tingkat kepuasan, transportasi umum]
    explain:
      ar_eg: tingkat kepuasan naik menjadi 70% = نسبة الرضا طلعت لـ ٧٠٪. مش ٧٠٪ مش راضيين، ومش عدد الركاب (naik هنا = زاد، مش ركب).
      ar: tingkat kepuasan naik menjadi 70% = ارتفعت نسبة الرضا إلى ٧٠٪، لا غير الراضين ولا عدد الركّاب (naik هنا = ارتفع لا ركب).
      en: Satisfaction rose to 70%. It isn't 70% unhappy, or 70% who ride (naik here = rose, not ride).
  - id: e05
    type: build_sentence
    source:
      ar_eg: مؤسسة الاستطلاعات دي نشرت نتايج استطلاع رأي جديد.
      ar: نشرت مؤسّسة الاستطلاع تلك نتائج استطلاع رأي جديد.
      en: That polling institute published the results of a new poll.
    answer: Lembaga survei itu menerbitkan hasil jajak pendapat baru.
    distractors: [sampel, kepuasan]
    words: [lembaga survei, jajak pendapat, hasil]
    explain:
      ar_eg: «نتايج استطلاع رأي» = hasil jajak pendapat. sampel = عينة وkepuasan = رضا، مش في الجملة.
      ar: «نتائج استطلاع رأي» = hasil jajak pendapat. أما sampel فالعيّنة، وkepuasan الرضا.
      en: "\"Poll results\" is hasil jajak pendapat. sampel and kepuasan aren't in it."
  - id: e06
    type: translate
    direction: from_target
    source_text: Sampelnya terlalu kecil, jadi hasilnya kurang mewakili pendapat seluruh warga kota.
    answers_meaning:
      ar_eg:
        - العينة صغيرة أوي، فالنتيجة مش معبّرة عن رأي كل سكان المدينة.
        - العينة قليلة زيادة عن اللزوم، فالنتيجة مش ممثّلة كويس لرأي أهل المدينة كلهم.
      ar:
        - العيّنة صغيرة جدًا، فالنتيجة لا تمثّل رأي جميع سكّان المدينة تمثيلًا كافيًا.
        - العيّنة أصغر من اللازم، لذا لا تعبّر النتائج جيّدًا عن رأي كلّ أهل المدينة.
      en:
        - The sample is too small, so the result doesn't really represent the opinion of all the city's residents.
        - The sample is too small for the results to represent what the whole city thinks.
    explain:
      ar_eg: jadi = فـ، بتجيب النتيجة. kurang mewakili = مش ممثّلة كويس (kurang = نفي مؤدب).
      ar: jadi = لذلك، وتأتي بالنتيجة. kurang mewakili = لا تمثّل جيّدًا (kurang نفي مهذّب).
      en: jadi = so, the result; kurang mewakili = doesn't quite represent (kurang as a polite "not").
    words: [sampel]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: هامش الخطأ ٣٪، ومرشح واخد ٥١٪ والتاني ٤٩٪. تقول إيه؟
      ar: هامش الخطأ ٣٪، ولمرشّح ٥١٪ وللآخر ٤٩٪. ماذا تقول؟
      en: The margin of error is 3%; one candidate has 51% and the other 49%. What do you say?
    options:
      - Tampaknya keduanya bersaing ketat.
      - Calon pertama pasti menang.
      - Jajak pendapat itu harus dibatalkan.
    answer: 0
    explain:
      ar_eg: 'الفرق ٢٪ بس، وده أقل من الـ ٣٪، فالفرق ممكن مايكونش حقيقي. الأحسن تقول: Tampaknya keduanya bersaing ketat (يبدو إنهم متقاربين جدًا).'
      ar: 'الفرق ٢٪ فقط، وهو أقلّ من ٣٪، فقد لا يكون حقيقيًّا، والأدقّ أن تقول: Tampaknya keduanya bersaing ketat (يبدو أنّهما متقاربان جدًّا).'
      en: The 2% gap is under 3%, so it may not be real. Better to say Tampaknya keduanya bersaing ketat (they look neck and neck).
    words: [margin kesalahan]
  - id: e08
    type: speaking
    text: Menurut jajak pendapat terbaru, tingkat kepuasan warga cenderung naik.
    meaning:
      ar_eg: حسب آخر استطلاع، نسبة رضا الناس بتميل إنها تزيد.
      ar: بحسب أحدث استطلاع، تميل نسبة رضا السكّان إلى الارتفاع.
      en: According to the latest poll, residents' satisfaction tends to be rising.
    words: [jajak pendapat, tingkat kepuasan, cenderung]
  - id: e09
    type: dictation
    text: Jajak pendapat ini melibatkan seribu responden.
    meaning:
      ar_eg: الاستطلاع ده شارك فيه ألف واحد.
      ar: شارك في هذا الاستطلاع ألف مستجيب.
      en: This poll involved a thousand respondents.
    words: [jajak pendapat, responden]
  - id: e10
    type: fill_blank
    sentence: Kami membandingkan hasil dari tiga ___ yang berbeda.
    meaning:
      ar_eg: قارنّا نتايج تلات مؤسسات استطلاع مختلفة.
      ar: قارنّا نتائج ثلاث مؤسّسات استطلاع مختلفة.
      en: We compared results from three different polling institutes.
    options: [lembaga survei, margin kesalahan, tingkat kepuasan]
    answers: [lembaga survei]
    words: [lembaga survei]
    explain:
      ar_eg: «مؤسسات استطلاع» = lembaga survei. margin kesalahan = هامش خطأ وtingkat kepuasan = نسبة رضا، ومش جهات.
      ar: «مؤسّسات الاستطلاع» = lembaga survei. أما margin kesalahan وtingkat kepuasan فأرقام لا جهات.
      en: "\"Polling institutes\" is lembaga survei. The other two are figures, not organisations."
dialogue:
  title: Angka di koran pagi
  lines:
    - speaker: Pak Hendra
      text: Lihat, Pak Mohamed. Tingkat kepuasan warga terhadap pemerintah kota 62 persen.
      ar_eg: بص يا أستاذ محمد. نسبة رضا الناس عن حكومة المدينة ٦٢٪.
      ar: انظر يا أستاذ محمد، نسبة رضا السكّان عن حكومة المدينة ٦٢٪.
      en: Look, Pak Mohamed. Residents' satisfaction with the city government is 62 per cent.
    - speaker: Mohamed
      text: Berapa sampelnya, Pak? Dan lembaga survei mana?
      ar_eg: العينة كام يا أستاذ؟ ومين مؤسسة الاستطلاع؟
      ar: كم حجم العيّنة يا أستاذ؟ ومن مؤسّسة الاستطلاع؟
      en: How big is the sample, sir? And which polling institute?
    - speaker: Pak Hendra
      text: Lembaga survei dari kota ini, sampelnya lima ratus orang. Margin kesalahan empat persen.
      ar_eg: مؤسسة من المدينة دي، والعينة خمسمية واحد، وهامش الخطأ ٤٪.
      ar: مؤسّسة من هذه المدينة، وعيّنتها خمسمئة شخص، وهامش الخطأ أربعة بالمئة.
      en: An institute from this city, with a sample of five hundred. The margin of error is four per cent.
    - speaker: Mohamed
      text: Jadi angka sebenarnya barangkali antara 58 dan 66 persen.
      ar_eg: يبقى الرقم الحقيقي غالبًا بين ٥٨ و٦٦٪.
      ar: إذن الرقم الحقيقي ربما بين ٥٨ و٦٦ بالمئة.
      en: So the true figure is probably between 58 and 66 per cent.
