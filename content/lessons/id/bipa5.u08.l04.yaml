schema: kabar.lesson/v1
id: bipa5.u08.l04
language: id
title: Tanggapan
can_do:
  ar_eg: تكتب ردّ قصير على مقال رأي، توافق في حتة وتختلف في حتة بأدب.
  ar: أن تكتب ردًّا قصيرًا على مقالة رأي، توافق في جانب وتخالف في آخر بلطف.
  en: Write a short response to an op-ed, agreeing in part and disagreeing politely.
slides:
  - title: Menulis tanggapan
    grammar: id.hedging
    body:
      ar_eg: |
        الردّ (tanggapan) الكويس فيه 3 خطوات:
        1. Saya sependapat sebagian dengan penulis. = أنا متفق مع الكاتب في جزء.
        2. Namun, tampaknya … = بس، يبدو إن …
        3. Menurut sumber lain, … = على حسب مصدر تاني، …
        واختم بحاجة berimbang (متوازنة)، مش هجوم.
      ar: |
        للردّ (tanggapan) الجيّد ثلاث خطوات:
        1. Saya sependapat sebagian dengan penulis. = أتّفق مع الكاتب جزئيًّا.
        2. Namun, tampaknya … = لكن يبدو أنّ …
        3. Menurut sumber lain, … = بحسب مصدر آخر، …
        واختم بخلاصة berimbang (متوازنة)، لا بهجوم.
      en: |
        A good response (tanggapan) has three steps:
        1. Saya sependapat sebagian dengan penulis. = I partly agree with the writer.
        2. Namun, tampaknya … = However, it seems …
        3. Menurut sumber lain, … = According to another source, …
        Then close with something balanced (berimbang), not an attack.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tanggapan
        ar_eg: ردّ / تعليق
        ar: ردّ
        en: response
      - text: sependapat
        ar_eg: متفق في الرأي
        ar: متّفق في الرأي
        en: to agree, of the same opinion
      - text: sebagian
        ar_eg: جزء / في جزء
        ar: جزئيًّا
        en: partly, a part
      - text: sumber
        ar_eg: مصدر
        ar: مصدر
        en: source
      - text: berimbang
        ar_eg: متوازن
        ar: متوازن
        en: balanced
    words: [tanggapan, sependapat, sebagian, sumber, berimbang]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي بداية أحسن لردّ مؤدب؟
      ar: أيّ بداية أنسب لردّ مهذّب؟
      en: Which is the better opening for a polite response?
    options:
      - Penulis itu bodoh dan salah.
      - Saya sependapat sebagian dengan penulis.
      - Artikel ini tidak perlu dibaca.
    answer: 1
    words: [sependapat, sebagian]
  - id: e03
    type: fill_blank
    sentence: Menurut ___ lain, harga beras justru turun bulan lalu.
    meaning:
      ar_eg: على حسب مصدر تاني، سعر الرز بالعكس نزل الشهر اللي فات.
      ar: بحسب مصدر آخر، انخفض سعر الأرزّ في الشهر الماضي على العكس.
      en: According to another source, rice prices actually fell last month.
    options: [sumber, tanggapan, sebagian]
    answers: [sumber]
    words: [sumber]
  - id: e04
    type: listen
    text: Tanggapan Anda sangat berimbang dan sopan.
    question:
      ar_eg: الردّ اتوصف إزاي؟
      ar: كيف وُصف الردّ؟
      en: How is the response described?
    options:
      - قصير وزعلان.
      - متوازن ومؤدب.
      - طويل ومن غير دليل.
    answer: 1
    words: [tanggapan, berimbang]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا متفق مع الكاتب في جزء، بس الدليل قليل.
      ar: أتّفق مع الكاتب جزئيًّا، لكنّ الدليل قليل.
      en: I partly agree with the writer, but the evidence is thin.
    answer: Saya sependapat sebagian, tetapi buktinya kurang.
    distractors: [sumber, berimbang]
    words: [sependapat, sebagian, bukti]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لازم المقال يبقى متوازن ويجيب مصادر كتير.
      ar: ينبغي أن تكون المقالة متوازنة وأن تذكر مصادر كثيرة.
      en: An article should be balanced and cite many sources.
    answers:
      - Artikel harus berimbang dan menyebut banyak sumber.
      - Artikel seharusnya berimbang dan menyebutkan banyak sumber.
      - Sebuah artikel harus berimbang dan memakai banyak sumber.
      - Artikel sebaiknya berimbang dan menyertakan banyak sumber.
    words: [berimbang, sumber]
  - id: e07
    type: translate
    direction: from_target
    source_text: Saya ingin menulis tanggapan terhadap opini kemarin.
    answers_meaning:
      ar_eg:
        - عايز أكتب ردّ على مقال الرأي بتاع امبارح.
        - نفسي أكتب تعليق على مقال الرأي اللي نزل امبارح.
      ar:
        - أريد أن أكتب ردًّا على مقالة الرأي المنشورة أمس.
        - أودّ كتابة تعليق على مقالة رأي الأمس.
      en:
        - I want to write a response to yesterday's op-ed.
        - I'd like to write a reply to yesterday's opinion piece.
    words: [tanggapan]
  - id: e08
    type: speaking
    text: Saya sependapat sebagian, namun tampaknya penulis kurang berimbang.
    meaning:
      ar_eg: أنا متفق في جزء، بس يبدو إن الكاتب مش متوازن قوي.
      ar: أتّفق جزئيًّا، لكن يبدو أنّ الكاتب غير متوازن تمامًا.
      en: I partly agree, but the writer seems not quite balanced.
    words: [sependapat, sebagian, berimbang]
dialogue:
  title: Surat pembaca
  lines:
    - speaker: Mas Rizal
      text: Mohamed, koran Banjarmasin menerima surat pembaca. Mau menulis tanggapan?
      ar_eg: يا محمد، جرنال بانجارماسين بيستقبل رسايل القرّاء. تحب تكتب ردّ؟
      ar: يا محمد، صحيفة بانجارماسين تستقبل رسائل القرّاء. أتريد أن تكتب ردًّا؟
      en: Mohamed, the Banjarmasin paper takes readers' letters. Want to write a response?
    - speaker: Mohamed
      text: Boleh, Mas. Saya sependapat sebagian dengan opini tentang harga beras.
      ar_eg: ماشي يا ريزال. أنا متفق في جزء مع مقال الرأي عن سعر الرز.
      ar: حسنًا. أتّفق جزئيًّا مع مقالة الرأي عن سعر الأرزّ.
      en: Sure. I partly agree with the op-ed about rice prices.
    - speaker: Mas Rizal
      text: Bagus. Jangan lupa menyebut sumber, supaya tanggapanmu berimbang.
      ar_eg: حلو. ماتنساش تذكر المصدر، علشان ردّك يبقى متوازن.
      ar: جميل. لا تنسَ أن تذكر المصدر لكي يكون ردّك متوازنًا.
      en: Good. Don't forget to cite a source, so your response is balanced.
    - speaker: Mohamed
      text: Siap. Saya akan menulis dengan sopan, tidak menyerang.
      ar_eg: تمام. هكتب بأدب، من غير هجوم.
      ar: حاضر. سأكتب بأدب، دون هجوم.
      en: Will do. I'll write politely, without attacking.
