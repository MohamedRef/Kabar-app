schema: kabar.lesson/v1
id: bipa1.u08.l03
language: id
title: Tidak atau bukan?
can_do:
  ar_eg: تنفي الأفعال والصفات والأسماء صح.
  ar: أن تنفي الأفعال والصفات والأسماء نفيًا صحيحًا.
  en: Negate verbs, adjectives and nouns correctly.
slides:
  - title: Tidak + kata kerja / sifat
    body:
      ar_eg: |
        في المصري بنقول «مش» لكل حاجة، بس الإندونيسي عنده كلمتين.
        الأولى tidak = «مش / ما…ش» قبل الفعل أو الصفة:
        - Saya tidak makan daging = مابكلش لحمة.
        - Dimas tidak malas = ديماس مش كسلان.
      ar: |
        العامية المصرية تنفي كل شيء بـ«مش»، أما الإندونيسية فلها أداتان.
        الأولى tidak = «لا / ليس» قبل الفعل والصفة:
        - Saya tidak makan daging = لا آكل اللحم.
        - Dimas tidak malas = ديماس ليس كسولًا.
      en: |
        Egyptian «مش» negates everything, but Indonesian has two words.
        The first, tidak = not, goes before verbs and adjectives:
        - Saya tidak makan daging = I don't eat meat.
        - Dimas tidak malas = Dimas isn't lazy.
    grammar: id.negation.tidak-bukan
    examples:
      - text: Saya tidak suka kopi.
        ar_eg: مابحبش القهوة.
        ar: لا أحب القهوة.
        en: I don't like coffee.
      - text: Rumahnya tidak besar.
        ar_eg: بيته مش كبير.
        ar: بيته ليس كبيرًا.
        en: His house isn't big.
  - title: Bukan + kata benda
    body:
      ar_eg: |
        التانية bukan = «مش» قبل الاسم أو الضمير. فكّر فيها زي «ليس» في الفصحى مع الجملة الاسمية:
        - Saya bukan orang Malaysia = أنا مش ماليزي.
        - Itu bukan buku saya = ده مش كتابي.
        اسأل نفسك: الكلمة اللي بعدها اسم (orang، guru، buku)؟ يبقى bukan.
      ar: |
        الثانية bukan = «ليس» قبل الاسم والضمير، كـ«ليس» في الجملة الاسمية:
        - Saya bukan orang Malaysia = لستُ ماليزيًا.
        - Itu bukan buku saya = ذلك ليس كتابي.
        فإن كان ما بعدها اسمًا (orang، guru، buku) فهي bukan.
      en: |
        The second, bukan = not, goes before nouns and pronouns — like «ليس» with a noun sentence:
        - Saya bukan orang Malaysia = I'm not Malaysian.
        - Itu bukan buku saya = That's not my book.
        Is the next word a noun (orang, guru, buku)? Then it's bukan.
    grammar: id.negation.tidak-bukan
    examples:
      - text: Dia bukan guru, dia dokter.
        ar_eg: هو مش مدرس، هو دكتور.
        ar: ليس معلمًا، بل طبيب.
        en: He's not a teacher, he's a doctor.
  - title: Bukan…, tapi… · …, bukan?
    body:
      ar_eg: |
        bukan ليها استخدامين حلوين كمان:
        - للتصحيح: Bukan kopi, tapi teh = مش قهوة، شاي. (tapi = بس / لكن)
        - في آخر الجملة = «مش كده؟»: Kamu orang Mesir, bukan? = إنت مصري، مش كده؟ وفي الكلام بيقولوا kan?
      ar: |
        ولـ bukan استعمالان آخران:
        - للاستدراك: Bukan kopi, tapi teh = ليس قهوة بل شاي. (tapi = لكن)
        - في ذيل الجملة = «أليس كذلك؟»: Kamu orang Mesir, bukan? وفي العامية kan?
      en: |
        Two more uses of bukan:
        - Correcting: Bukan kopi, tapi teh = Not coffee — tea. (tapi = but)
        - As a tag: Kamu orang Mesir, bukan? = You're Egyptian, aren't you? Casually: kan?
    grammar: id.negation.tidak-bukan
    examples:
      - text: Ini halal, bukan?
        ar_eg: ده حلال، مش كده؟
        ar: هذا حلال، أليس كذلك؟
        en: This is halal, isn't it?
      - text: Bukan kopi, tapi teh.
        ar_eg: مش قهوة، شاي.
        ar: ليس قهوة بل شاي.
        en: Not coffee, but tea.
  - title: Nggak, gak
    body:
      ar_eg: |
        في الكلام اليومي tidak بتبقى nggak أو gak (وفي الشات gk). Saya nggak tahu = معرفش.
        الرد المختصر: Tidak. = لأ. وBukan. = لأ، مش هو / مش كده.
        Apa itu kopi? — Bukan, itu teh. (السؤال عن اسم، يبقى الرد bukan.)
      ar: |
        في الكلام اليومي تصير tidak: nggak أو gak (وفي المحادثات gk): Saya nggak tahu = لا أعرف.
        والجواب المختصر: Tidak = لا، وBukan = لا، ليس هو.
        Apa itu kopi؟ — Bukan, itu teh. (السؤال عن اسم فالجواب bukan.)
      en: |
        In everyday speech tidak becomes nggak or gak (chat: gk): Saya nggak tahu = I don't know.
        Short answers: Tidak. = No. Bukan. = No, it isn't (that thing).
        Apa itu kopi? — Bukan, itu teh. (A question about a noun gets bukan.)
    grammar: id.negation.tidak-bukan
    examples:
      - text: Saya nggak tahu.
        ar_eg: معرفش. (كلام عادي)
        ar: لا أعرف. (عامية)
        en: I don't know. (casual)
exercises:
  - id: e01
    type: multiple_choice
    question: Saya ___ makan daging.
    options: [bukan, tidak]
    answer: 1
    explain:
      ar_eg: makan فعل، يبقى tidak.
      ar: makan فعل، فيُنفى بـ tidak.
      en: makan is a verb, so tidak.
    words: [tidak]
  - id: e02
    type: listen
    text: Itu bukan buku saya.
    options: [Ini bukan buku saya., Itu buku saya., Itu bukan buku saya.]
    answer: 2
    words: [bukan, buku]
  - id: e03
    type: fill_blank
    sentence: Rumahnya ___ besar, tapi nyaman.
    meaning:
      ar_eg: بيته مش كبير، بس مريح.
      ar: بيته ليس كبيرًا، لكنه مريح.
      en: His house isn't big, but it's comfortable.
    answers: [tidak, nggak, gak]
    explain:
      ar_eg: besar صفة، يبقى tidak (أو nggak / gak في الكلام).
      ar: besar صفة، فتُنفى بـ tidak (وnggak / gak في العامية).
      en: besar is an adjective → tidak (casual nggak / gak).
    words: [tidak, besar]
  - id: e04
    type: build_sentence
    source:
      ar_eg: مش قهوة، شاي.
      ar: ليس قهوة بل شاي.
      en: Not coffee, but tea.
    answer: Bukan kopi, tapi teh.
    distractors: [tidak, dan]
    words: [bukan, tapi, kopi, teh]
  - id: e05
    type: dictation
    text: Saya nggak tahu.
    meaning:
      ar_eg: معرفش.
      ar: لا أعرف.
      en: I don't know.
    words: [nggak, tahu]
  - id: e06
    type: speaking
    text: Dia bukan guru, dia dokter.
    meaning:
      ar_eg: هو مش مدرس، هو دكتور.
      ar: ليس معلمًا، بل طبيب.
      en: He's not a teacher, he's a doctor.
    words: [bukan]
dialogue:
  title: Di toko teh Glodok
  lines:
    - speaker: Penjual
      text: Silakan, Mas. Mau minum apa?
      ar_eg: اتفضل يا أستاذ. تحب تشرب إيه؟
      ar: تفضّل. ماذا تريد أن تشرب؟
      en: Go ahead. What would you like to drink?
    - speaker: Mohamed
      text: Teh, Pak. Hari ini saya tidak mau kopi.
      ar_eg: شاي يا عمّ. النهارده مش عايز قهوة.
      ar: شايًا يا سيدي. لا أريد قهوة اليوم.
      en: Tea, please. I don't want coffee today.
    - speaker: Penjual
      text: Mas orang Malaysia, bukan?
      ar_eg: حضرتك ماليزي، مش كده؟
      ar: أنت ماليزي، أليس كذلك؟
      en: You're Malaysian, aren't you?
    - speaker: Mohamed
      text: Bukan, Pak. Saya bukan orang Malaysia, tapi orang Mesir.
      ar_eg: لأ يا عمّ. أنا مش ماليزي، أنا مصري.
      ar: لا يا سيدي. لستُ ماليزيًا، بل مصري.
      en: No, sir. I'm not Malaysian — I'm Egyptian.
    - speaker: Penjual
      text: Oh, dari Mesir! Teh ini tidak mahal, Mas.
      ar_eg: أوه، من مصر! الشاي ده مش غالي يا أستاذ.
      ar: آه، من مصر! هذا الشاي ليس غاليًا.
      en: Oh, from Egypt! This tea isn't expensive.
new_words:
  - word: tidak
    pos: particle
    ar_eg: مش / ما…ش (مع الأفعال والصفات)
    ar: لا / ليس (للفعل والصفة)
    en: not (verbs, adjectives); no
  - word: bukan
    pos: particle
    ar_eg: مش (مع الأسماء)؛ مش كده؟
    ar: ليس (للاسم)؛ أليس كذلك؟
    en: not (nouns, pronouns); isn't it?
  - word: nggak
    pos: particle
    ar_eg: مش (كلام عادي، بدل tidak)
    ar: لا (عامية tidak)
    en: not (casual tidak); also gak
  - word: daging
    pos: noun
    ar_eg: لحمة
    ar: لحم
    en: meat
  - word: tahu
    pos: verb
    ar_eg: يعرف
    ar: يعرف
    en: to know
  - word: nyaman
    pos: adjective
    ar_eg: مريح
    ar: مريح
    en: comfortable
review:
  status: draft
  verified: false
