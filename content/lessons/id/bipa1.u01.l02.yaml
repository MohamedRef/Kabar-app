schema: kabar.lesson/v1
id: bipa1.u01.l02
language: id
title: Apa kabar?
can_do:
  ar_eg: تسأل حد عامل إيه وترد عليه.
  ar: أن تسأل أحدًا عن حاله وتجيب عن السؤال نفسه.
  en: Ask how someone is and answer.
slides:
  - title: Kabar = خبر
    body:
      ar_eg: كلمة kabar جاية من العربي «خبر» (الخاء بقت k). فـ«Apa kabar?» حرفيًا «إيه الخبر؟» يعني «إزيك؟ عامل إيه؟». بتتقال في أي وقت، ومع Pak أو Bu تبقى مؤدبة.
      ar: كلمة kabar مأخوذة من العربية «خبر» بعد تحوّل الخاء إلى k، فعبارة «Apa kabar?» معناها الحرفي «ما الخبر؟» أي «كيف حالك؟». تُقال في أي وقت، ومع Pak أو Bu تصبح مهذبة.
      en: kabar comes from Arabic «خبر» (kh became k), so "Apa kabar?" is literally "what news?", meaning "How are you?". It works at any time of day; add Pak or Bu to be polite.
    grammar: id.question.apa
    examples:
      - text: Apa kabar, Bu?
        ar_eg: إزيك يا مدام؟
        ar: كيف حالكِ يا سيدتي؟
        en: How are you, ma'am?
      - text: Selamat pagi, Pak! Apa kabar?
        ar_eg: صباح الخير يا أستاذ! عامل إيه؟
        ar: صباح الخير يا سيدي! كيف حالك؟
        en: Good morning, sir! How are you?
  - title: Baik, terima kasih
    body:
      ar_eg: |
        الرد على «Apa kabar?»:
        - Baik / Kabar baik: كويس، الحمد لله
        - Baik-baik saja: كله تمام
        - Sehat: بصحة كويسة (sehat جاية من العربي «صحة»)
        - Kurang baik: مش أحسن حاجة
        وبعدين ترجّع السؤال: «Dan Ibu?» أو «Dan Bapak?» يعني «وحضرتك؟». واللي يرد يقول «Baik juga» يعني «وأنا كمان كويس».
      ar: |
        الإجابة عن «Apa kabar?»:
        - Baik / Kabar baik: بخير
        - Baik-baik saja: كل شيء على ما يرام
        - Sehat: بصحة جيدة (sehat من العربية «صحة»)
        - Kurang baik: لستُ على ما يرام تمامًا
        ثم تردّ السؤال: «Dan Ibu?» أو «Dan Bapak?» أي «وأنتِ / وأنتَ؟»، فيُجاب: «Baik juga» أي «بخير أيضًا».
      en: |
        Answers to "Apa kabar?":
        - Baik / Kabar baik: fine, good
        - Baik-baik saja: all fine
        - Sehat: healthy, well (sehat comes from Arabic «صحة»)
        - Kurang baik: not so good
        Then ask back: "Dan Ibu?" / "Dan Bapak?" (and you?). The reply: "Baik juga" (fine too).
    grammar: id.question.apa
    examples:
      - text: Kabar baik, terima kasih. Dan Ibu?
        ar_eg: كويس، شكرًا. وحضرتك؟
        ar: بخير، شكرًا. وأنتِ؟
        en: I'm fine, thank you. And you, ma'am?
      - text: Baik juga.
        ar_eg: وأنا كمان كويسة.
        ar: بخير أيضًا.
        en: Fine too.
  - title: Terima kasih — sama-sama
    body:
      ar_eg: «Terima kasih» يعني «شكرًا» (حرفيًا «استلمت المحبة»). والرد عليها «Sama-sama» يعني «العفو».
      ar: «Terima kasih» تعني «شكرًا» (حرفيًا «تلقّيتُ المودة»)، وجوابها «Sama-sama» أي «العفو».
      en: '"Terima kasih" means "thank you" (literally "receive affection"). The reply is "Sama-sama": you''re welcome.'
    examples:
      - text: Terima kasih, Pak! — Sama-sama.
        ar_eg: شكرًا يا أستاذ! — العفو.
        ar: شكرًا يا سيدي! — العفو.
        en: Thank you, sir! — You're welcome.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kabar
        ar_eg: الأخبار / الحال
        ar: الخبر / الحال
        en: news, how one is
      - text: baik
        ar_eg: كويس
        ar: جيد / بخير
        en: good, fine
      - text: terima kasih
        ar_eg: شكرًا
        ar: شكرًا
        en: thank you
      - text: sama-sama
        ar_eg: العفو
        ar: العفو
        en: you're welcome
      - text: juga
        ar_eg: كمان
        ar: أيضًا
        en: too, also
    words: [kabar, baik, terima kasih, sama-sama, juga]
  - id: e02
    type: multiple_choice
    question: Apa kabar, Pak?
    question_meaning:
      ar_eg: Rina بتسأل Pak Irwan. هو كويس النهارده. يرد بإيه؟
      ar: تسأل Rina الأستاذ Irwan عن حاله، وهو بخير اليوم. بماذا يجيب؟
      en: Rina asks Pak Irwan. He feels fine today. What does he answer?
    options: [Sama-sama., 'Baik, terima kasih.', Selamat jalan.]
    answer: 1
    explain:
      ar_eg: Sama-sama رد على «شكرًا»، وSelamat jalan وداع. الرد على Apa kabar هو Baik.
      ar: Sama-sama جواب «شكرًا»، وSelamat jalan للوداع، أما جواب Apa kabar فهو Baik.
      en: Sama-sama answers "thank you" and Selamat jalan is a goodbye; Apa kabar is answered with Baik.
    words: [baik, terima kasih, Pak / Bu]
  - id: e03
    type: fill_blank
    sentence: Selamat sore, Pak. Apa ___?
    meaning:
      ar_eg: مساء الخير يا أستاذ. عامل إيه؟
      ar: مساء الخير يا سيدي. كيف حالك؟
      en: Good afternoon, sir. How are you?
    options: [baik, juga, kabar]
    answers: [kabar]
    words: [apa, kabar, Pak / Bu]
    explain:
      ar_eg: "Apa kabar? = إزيك؟ (حرفيًا: إيه الأخبار؟). baik = كويس، وjuga = كمان."
      ar: "Apa kabar? = كيف حالك؟ (حرفيًا: ما الخبر؟). baik = بخير وjuga = أيضًا."
      en: "Apa kabar? = How are you? (literally: what news?)."
  - id: e04
    type: build_sentence
    source:
      ar_eg: كويس، شكرًا. وحضرتك يا أستاذ؟
      ar: بخير، شكرًا. وأنت يا سيدي؟
      en: Fine, thank you. And you, sir?
    answer: Baik, terima kasih. Dan Bapak?
    distractors: [Ibu, sama-sama]
    explain:
      ar_eg: مع راجل كبير بنقول Bapak مكان «إنت»، زي «حضرتك».
      ar: مع الرجل الأكبر سنًّا تُستعمل Bapak مكان «أنت»، كقولنا «حضرتك».
      en: With an older man, Bapak stands in for "you", like «حضرتك».
    words: [baik, terima kasih, dan]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: شكرًا. كويس كمان. وحضرتك يا أستاذ؟
      ar: شكرًا. بخير أيضًا. وأنت يا سيدي؟
      en: Thank you. Fine too. And you, sir?
    answers: ['Terima kasih. Baik juga. Dan Bapak?', 'Terima kasih, baik juga. Dan Bapak?', 'Terima kasih. Baik juga. Dan Bapak', 'Terima kasih. Saya juga baik. Dan Bapak?', 'Terima kasih. Saya juga baik. Dan Bapak', 'Terima kasih, saya juga baik. Dan Bapak?', 'Terima kasih. Saya juga baik, dan Bapak?', 'Terima kasih. Saya baik juga. Dan Bapak?', 'Terima kasih. Saya juga baik. Bapak?', 'Makasih. Baik juga. Dan Bapak?', 'Makasih, saya juga baik. Dan Bapak?']
    words: [terima kasih, juga, baik, dan]
  - id: e06
    type: dictation
    text: Baik juga. Dan Bu Yanti?
    meaning:
      ar_eg: كويس كمان. وحضرتك يا مدام يانتي؟
      ar: بخير أيضًا. وأنتِ يا سيدة يانتي؟
      en: Fine too. And you, Bu Yanti?
    words: [juga, baik, dan, Pak / Bu]
  - id: e07
    type: speaking
    text: Sama-sama, Pak. Apa kabar?
    meaning:
      ar_eg: العفو يا أستاذ. إزيك؟
      ar: العفو يا سيدي. كيف حالك؟
      en: You're welcome, sir. How are you?
    words: [sama-sama, apa, kabar, Pak / Bu]
dialogue:
  title: Pagi di Kota Tua
  lines:
    - speaker: Mohamed
      text: Selamat pagi, Bu Yanti! Apa kabar?
      ar_eg: صباح الخير يا مدام يانتي! إزيك؟
      ar: صباح الخير يا سيدة يانتي! كيف حالكِ؟
      en: Good morning, Bu Yanti! How are you?
    - speaker: Bu Yanti
      text: Pagi, Mohamed! Kabar baik, terima kasih. Dan Mohamed?
      ar_eg: صباح النور يا محمد! كويسة، شكرًا. وإنت؟
      ar: صباح النور يا محمد! بخير، شكرًا. وأنت؟
      en: Morning, Mohamed! I'm fine, thank you. And you?
    - speaker: Mohamed
      text: Baik juga, Bu. Terima kasih.
      ar_eg: وأنا كمان كويس يا مدام. شكرًا.
      ar: بخير أيضًا يا سيدتي. شكرًا.
      en: Fine too, ma'am. Thank you.
    - speaker: Bu Yanti
      text: Sama-sama. Sampai jumpa!
      ar_eg: العفو. أشوفك بعدين!
      ar: العفو. إلى اللقاء!
      en: You're welcome. See you!
    - speaker: Mohamed
      text: Sampai jumpa besok, Bu!
      ar_eg: أشوفك بكرة يا مدام!
      ar: إلى اللقاء غدًا يا سيدتي!
      en: See you tomorrow, ma'am!
new_words:
  - word: apa
    pos: question word
    ar_eg: إيه؟ / هل
    ar: ماذا؟ / هل
    en: what?; yes/no question marker
  - word: kabar
    pos: noun
    ar_eg: خبر، حال
    ar: خبر، حال
    en: news; how someone is
    arabic: خبر
  - word: baik
    pos: adjective
    ar_eg: كويس
    ar: جيد، بخير
    en: good, fine, well
  - word: terima kasih
    pos: phrase
    ar_eg: "شكرًا؛ في الشارع: makasih"
    ar: "شكرًا؛ في الشارع: makasih"
    en: "thank you; on the street: makasih"
  - word: sama-sama
    pos: phrase
    ar_eg: العفو
    ar: العفو
    en: you're welcome
  - word: dan
    pos: conjunction
    ar_eg: و
    ar: و
    en: and
  - word: juga
    pos: adverb
    ar_eg: كمان
    ar: أيضًا
    en: also, too
  - word: Pak / Bu
    pos: noun
    ar_eg: يا أستاذ / يا مدام، وكمان «حضرتك» (من Bapak وIbu)
    ar: يا سيدي / يا سيدتي، وتعني «حضرتك» أيضًا (من Bapak وIbu)
    en: sir / ma'am, also polite "you" (short for Bapak, Ibu)
