schema: kabar.lesson/v1
id: bipa5.u06.l03
language: id
title: Tari enggang
can_do:
  ar_eg: توصف عرض فني بالتفصيل، الحركة واللبس والموسيقى والمعنى.
  ar: أن تصف عرضًا فنّيًّا بالتفصيل، حركةً وزيًّا وموسيقى ومعنى.
  en: Describe a performance in detail, its movement, costume, music and meaning.
slides:
  - title: Mendeskripsikan pertunjukan
    body:
      ar_eg: |
        عشان توصف عرض، اتكلم عن 4 حاجات:
        - gerakan (الحركة): Gerakannya meniru burung enggang yang terbang. = الحركة بتقلّد طائر أبو قرن وهو طاير.
        - kostum (اللبس): bulu enggang = ريش أبو قرن
        - musik: sape = آلة وترية بتاعة الداياك
        - makna (المعنى): Tarian ini melambangkan … = الرقصة دي بترمز لـ …
        طائر أبو قرن (enggang) مقدّس عند الداياك.
      ar: |
        لتصف عرضًا تحدّث عن أربعة أمور:
        - gerakan (الحركة): Gerakannya meniru burung enggang yang terbang. = تحاكي الحركة طائر أبي قرن في طيرانه.
        - kostum (الزيّ): bulu enggang = ريش أبي قرن
        - musik: sape = آلة وترية عند الداياك
        - makna (المعنى): Tarian ini melambangkan … = ترمز هذه الرقصة إلى …
        وطائر أبي قرن (enggang) مقدّس عند الداياك.
      en: |
        To describe a show, cover four things:
        - gerakan (movement): Gerakannya meniru burung enggang yang terbang. = The moves imitate a hornbill in flight.
        - kostum (costume): bulu enggang = hornbill feathers
        - musik: sape = the Dayak lute
        - makna (meaning): Tarian ini melambangkan … = This dance symbolises …
        The hornbill (enggang) is sacred to the Dayak.
    examples:
      - text: Tarian ini melambangkan hubungan manusia dengan alam.
        ar_eg: الرقصة دي بترمز لعلاقة الإنسان بالطبيعة.
        ar: ترمز هذه الرقصة إلى علاقة الإنسان بالطبيعة.
        en: This dance symbolises the bond between people and nature.
