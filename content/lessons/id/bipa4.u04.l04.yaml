schema: kabar.lesson/v1
id: bipa4.u04.l04
language: id
title: Koran cetak atau digital?
can_do:
  ar_eg: 'تقارن الجرنان الورق بالأخبار الديجيتال: العدد، الموضوع، ودقة المعلومة.'
  ar: 'أن تقارن الصحيفة الورقية بالأخبار الرقمية: العدد والموضوع ودقّة المعلومة.'
  en: 'Compare print newspapers with digital news: editions, topics and accuracy.'
slides:
  - title: Membaca berita setiap hari
    body:
      ar_eg: |
        cetak = مطبوع (koran cetak = جرنان ورق)، digital = ديجيتال، harian = يومي (koran harian).
        edisi = عدد أو طبعة (edisi Minggu = عدد الحد)، pers = الصحافة (kebebasan pers).
        topik = موضوع، isu = قضية مطروحة، akurat = دقيق.
      ar: |
        cetak = مطبوع (koran cetak = صحيفة ورقية)، digital = رقمي، harian = يومي (koran harian).
        edisi = عدد أو طبعة (edisi Minggu = عدد الأحد)، pers = الصحافة (kebebasan pers).
        topik = موضوع، isu = قضية مطروحة، akurat = دقيق.
      en: |
        cetak = printed (koran cetak = print newspaper), digital = digital, harian = daily (koran harian).
        edisi = edition, issue (edisi Minggu = Sunday edition); pers = the press (kebebasan pers).
        topik = topic, isu = issue (in public debate), akurat = accurate.
    examples:
      - text: Ayah saya masih membaca koran cetak setiap pagi.
        ar_eg: أبويا لسه بيقرا الجرنان الورق كل يوم الصبح.
        ar: ما زال أبي يقرأ الصحيفة الورقية كل صباح.
        en: My father still reads a print newspaper every morning.
      - text: Edisi Minggu punya banyak artikel budaya.
        ar_eg: عدد الحد فيه مقالات ثقافية كتير.
        ar: في عدد الأحد مقالات ثقافية كثيرة.
        en: The Sunday edition has lots of culture articles.
      - text: Berita yang baik harus akurat.
        ar_eg: الخبر الكويس لازم يكون دقيق.
        ar: يجب أن يكون الخبر الجيد دقيقًا.
        en: Good news reporting must be accurate.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: cetak
        ar_eg: مطبوع
        ar: مطبوع
        en: printed
      - text: digital
        ar_eg: ديجيتال
        ar: رقمي
        en: digital
      - text: harian
        ar_eg: يومي
        ar: يومي
        en: daily
      - text: edisi
        ar_eg: عدد، طبعة
        ar: عدد، طبعة
        en: edition
    words: [cetak, digital, harian, edisi]
  - id: e02
    type: match_pairs
    pairs:
      - text: pers
        ar_eg: الصحافة
        ar: الصحافة
        en: the press
      - text: topik
        ar_eg: موضوع
        ar: موضوع
        en: topic
      - text: isu
        ar_eg: قضية
        ar: قضية
        en: issue
      - text: akurat
        ar_eg: دقيق
        ar: دقيق
        en: accurate
    words: [pers, topik, isu, akurat]
  - id: e03
    type: listen
    text: Koran harian ini juga punya edisi digital.
    question:
      ar_eg: الجرنان عنده إيه كمان؟
      ar: ماذا لدى الصحيفة أيضًا؟
      en: What else does the paper have?
    options: [نسخة ديجيتال, عدد الحد, جرنان ورق بس]
    answer: 0
    meaning:
      ar_eg: الجرنان اليومي ده كمان عنده نسخة ديجيتال.
      ar: لهذه الصحيفة اليومية نسخة رقمية أيضًا.
      en: This daily paper also has a digital edition.
    words: [harian, edisi, digital]
  - id: e04
    type: fill_blank
    sentence: Wartawan harus menulis berita yang ___.
    meaning:
      ar_eg: الصحفي لازم يكتب أخبار ___.
      ar: يجب أن يكتب الصحفي أخبارًا ___.
      en: Journalists must write ___ news.
    options: [akurat, cetak, harian]
    answers: [akurat]
    words: [akurat, cetak, harian]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عدد الحد من الجرنان، بالإندونيسي؟
      ar: عدد الأحد من الصحيفة، بالإندونيسية؟
      en: The paper's Sunday edition, in Indonesian?
    options: [isu Minggu, edisi Minggu, topik Minggu]
    answer: 1
    explain:
      ar_eg: edisi = عدد أو طبعة.
      ar: edisi = عدد أو طبعة.
      en: edisi = edition.
    words: [isu, edisi, topik]
  - id: e06
    type: fill_blank
    sentence: Hari ini ___ utama di semua koran adalah harga gula.
    meaning:
      ar_eg: النهارده ___ الرئيسي في كل الجرانين هو سعر السكر.
      ar: ___ الرئيسي اليوم في كل الصحف هو سعر السكر.
      en: Today the main ___ in every paper is the price of sugar.
    options: [topik, pers, digital]
    answers: [topik]
    words: [topik, pers, digital]
  - id: e07
    type: multiple_choice
    question: Kebebasan ___ penting untuk semua orang.
    options: [edisi, akurat, pers]
    answer: 2
    explain:
      ar_eg: kebebasan pers = حرية الصحافة.
      ar: kebebasan pers = حرية الصحافة.
      en: kebebasan pers = press freedom.
    words: [edisi, akurat, pers]
  - id: e08
    type: build_sentence
    source:
      ar_eg: قضية الميّه النضيفة بقت موضوع كبير.
      ar: صارت قضية المياه النظيفة موضوعًا كبيرًا.
      en: The clean water issue has become a big topic.
    answer: Isu air bersih menjadi topik besar.
    distractors: [pers, cetak]
    words: [isu, topik, pers, cetak]
  - id: e09
    type: translate
    direction: from_target
    source_text: Koran cetak makin sedikit, berita digital makin banyak.
    answers_meaning:
      ar_eg: [الجرانين الورق بتقل، والأخبار الديجيتال بتكتر, الجرايد المطبوعة بقت أقل والأخبار الديجيتال أكتر]
      ar: [الصحف الورقية تقلّ والأخبار الرقمية تكثر, تتناقص الصحف المطبوعة وتتزايد الأخبار الرقمية]
      en: [Print papers are fewer and digital news is growing, There are fewer printed newspapers and more digital news]
    words: [cetak, digital]
  - id: e10
    type: speaking
    text: Saya membaca koran harian edisi digital.
    meaning:
      ar_eg: أنا بقرا النسخة الديجيتال من الجرنان اليومي.
      ar: أقرأ النسخة الرقمية من الصحيفة اليومية.
      en: I read the digital edition of the daily paper.
    words: [harian, edisi, digital, isu, akurat]
dialogue:
  lines:
    - speaker: Kak Nirmala
      text: Mohamed, kamu masih beli koran cetak?
      ar_eg: يا محمد، لسه بتشتري الجرنان الورق؟
      ar: يا محمد، هل ما زلت تشتري الصحيفة الورقية؟
      en: Mohamed, do you still buy print newspapers?
    - speaker: Mohamed
      text: Hanya edisi Minggu. Setiap hari saya baca koran harian digital.
      ar_eg: عدد الحد بس. كل يوم بقرا جرنان يومي ديجيتال.
      ar: عدد الأحد فقط. وأقرأ كل يوم صحيفة يومية رقمية.
      en: Only the Sunday edition. Every day I read a digital daily.
    - speaker: Kak Nirmala
      text: Topik apa yang paling kamu suka?
      ar_eg: أكتر موضوع بتحبه إيه؟
      ar: ما الموضوع الذي تفضّله أكثر؟
      en: Which topic do you like most?
    - speaker: Mohamed
      text: Isu lingkungan dan pendidikan. Tapi beritanya harus akurat.
      ar_eg: قضايا البيئة والتعليم. بس الأخبار لازم تكون دقيقة.
      ar: قضايا البيئة والتعليم، لكن يجب أن تكون الأخبار دقيقة.
      en: Environment and education issues. But the news has to be accurate.
    - speaker: Kak Nirmala
      text: Setuju. Pers yang baik selalu menghubungi narasumber.
      ar_eg: موافقة. الصحافة الكويسة دايمًا بتكلّم المصادر.
      ar: أوافق. الصحافة الجيدة تتواصل مع المصادر دائمًا.
      en: Agreed. Good press always contacts its sources.
