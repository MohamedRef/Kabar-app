schema: kabar.lesson/v1
id: bipa4.u04.l04
language: id
title: Pro dan kontra
can_do:
  ar_eg: توزن مميزات وعيوب قرار وتقول رأيك.
  ar: أن تزن مزايا قرار وعيوبه وتبدي رأيك.
  en: Weigh the pros and cons of a policy.
slides:
  - title: Di satu sisi, di sisi lain
    body:
      ar_eg: |
        عشان توزن قرار (kebijakan):
        Di satu sisi, … (من ناحية) → kelebihan (الميزة)
        Di sisi lain, … (ومن ناحية تانية) → kekurangan (العيب) — ke-…-an تاني!
        وبعدين رأيك بأداة نتيجة: Oleh karena itu, saya mendukung / menolak …
      ar: |
        لموازنة قرار (kebijakan):
        Di satu sisi, … (من جهة) → kelebihan (الميزة)
        Di sisi lain, … (ومن جهة أخرى) → kekurangan (العيب)، وهي من ke-…-an أيضًا.
        ثم رأيك بأداة نتيجة: Oleh karena itu, saya mendukung / menolak …
      en: |
        To weigh a policy (kebijakan):
        Di satu sisi, … (on the one hand) → kelebihan (advantage)
        Di sisi lain, … (on the other hand) → kekurangan (drawback) — ke-…-an again!
        Then your view with a result connector: Oleh karena itu, saya mendukung / menolak … (support / reject)
    grammar: id.conjunction.cause-effect
    examples:
      - text: Di satu sisi, siswa lebih fokus. Di sisi lain, orang tua sulit menghubungi anaknya.
        ar_eg: من ناحية، التلاميذ بيركزوا أكتر. ومن ناحية تانية، الأهل صعب يكلموا ولادهم.
        ar: من جهة يزداد تركيز الطلاب، ومن جهة أخرى يصعب على الأهل الاتصال بأبنائهم.
        en: On the one hand, students focus more. On the other, parents find it hard to reach their children.
      - text: Oleh karena itu, saya mendukung kebijakan ini.
        ar_eg: عشان كده، أنا مؤيد القرار ده.
        ar: لذلك أؤيد هذه السياسة.
        en: Therefore, I support this policy.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها إنك ضد القرار؟
      ar: أيّ جملة تعني أنك ضد القرار؟
      en: Which sentence says you're against the policy?
    options: ["Saya mendukung kebijakan itu.", "Kebijakan itu punya kelebihan.", "Saya menolak kebijakan itu."]
    answer: 2
    words: [menolak, mendukung]
  - id: e02
    type: listen
    text: Kebijakan ini punya kelebihan dan kekurangan.
    options: ["Kebijakan ini punya kelebihan dan kekurangan.", "Kebijakan ini punya kelebihan dan dampak.", "Kebijakan ini tidak punya kekurangan."]
    answer: 0
    meaning:
      ar_eg: القرار ده ليه مميزات وعيوب.
      ar: لهذه السياسة مزايا وعيوب.
      en: This policy has advantages and drawbacks.
    words: [kelebihan, kekurangan]
  - id: e03
    type: match_pairs
    pairs:
      - text: kelebihan
        ar_eg: ميزة
        ar: ميزة
        en: advantage
      - text: kekurangan
        ar_eg: عيب / نقص
        ar: عيب
        en: drawback
      - text: dampak
        ar_eg: أثر / تأثير
        ar: أثر
        en: impact
      - text: mendukung
        ar_eg: يأيّد / يدعم
        ar: يؤيّد
        en: support
      - text: menolak
        ar_eg: يرفض
        ar: يرفض
        en: reject, oppose
    words: [kelebihan, kekurangan, dampak, mendukung, menolak]
  - id: e04
    type: fill_blank
    sentence: Saya ___ kebijakan itu karena siswa jadi lebih fokus.
    meaning:
      ar_eg: أنا مؤيد القرار ده عشان التلاميذ بقوا مركزين أكتر.
      ar: أؤيد تلك السياسة لأن الطلاب صاروا أكثر تركيزًا.
      en: I support that policy because students focus more.
    options: [mendukung, menolak, dampak]
    answers: [mendukung]
    words: [mendukung]
  - id: e05
    type: fill_blank
    sentence: Salah satu ___ kebijakan ini, orang tua sulit menghubungi anaknya.
    meaning:
      ar_eg: من عيوب القرار ده إن الأهل صعب يكلموا ولادهم.
      ar: من عيوب هذه السياسة صعوبة اتصال الأهل بأبنائهم.
      en: One drawback of this policy is that parents find it hard to reach their children.
    options: [kekurangan, kelebihan, berkat]
    answers: [kekurangan]
    words: [kekurangan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: أثر القرار ده كبير جدًا.
      ar: أثر هذه السياسة كبير جدًا.
      en: The impact of this policy is very big.
    answer: Dampak kebijakan ini sangat besar.
    distractors: [berkat, kelebihan]
    words: [dampak]
  - id: e07
    type: dictation
    text: Banyak orang tua menolak kebijakan itu.
    meaning:
      ar_eg: أهالي كتير رافضين القرار ده.
      ar: يرفض كثير من الأهالي تلك السياسة.
      en: Many parents oppose that policy.
    words: [menolak]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بفضل القرار ده، التلاميذ بيذاكروا أكتر. عشان كده، أنا مؤيده.
      ar: بفضل هذه السياسة يدرس الطلاب أكثر، لذلك أؤيدها.
      en: Thanks to this policy, students study more. Therefore, I support it.
    answers:
      - Berkat kebijakan ini, siswa lebih banyak belajar. Oleh karena itu, saya mendukungnya.
      - Berkat kebijakan ini, siswa belajar lebih banyak. Oleh karena itu, saya mendukungnya.
      - Berkat kebijakan ini, siswa lebih banyak belajar. Oleh karena itu, saya mendukung kebijakan ini.
      - Berkat kebijakan ini, para siswa lebih banyak belajar. Oleh karena itu, saya mendukungnya.
      - Berkat kebijakan ini, siswa lebih rajin belajar. Oleh karena itu, saya mendukungnya.
      - Berkat kebijakan ini, siswa lebih banyak belajar. Karena itu, saya mendukungnya.
    words: [mendukung]
  - id: e09
    type: speaking
    text: Di satu sisi, kebijakan ini punya kelebihan. Di sisi lain, dampaknya bagi orang tua cukup besar.
    meaning:
      ar_eg: من ناحية، القرار ده ليه مميزات. ومن ناحية تانية، أثره على الأهالي كبير شوية.
      ar: من جهة لهذه السياسة مزايا، ومن جهة أخرى أثرها على الأهالي كبير نسبيًا.
      en: On the one hand, this policy has advantages. On the other, its impact on parents is quite big.
    words: [kelebihan, dampak]
dialogue:
  title: Debat di kelas
  lines:
    - speaker: Kak Ayu
      text: Sekolah di Parepare melarang siswa membawa HP. Bagaimana pendapat kalian?
      ar_eg: مدارس باريباريه منعت التلاميذ يجيبوا موبايلات. إيه رأيكم؟
      ar: منعت مدارس باريباري الطلاب من إحضار الهواتف. ما رأيكم؟
      en: Schools in Parepare have banned students from bringing phones. What do you think?
    - speaker: Andi
      text: Saya mendukung. Berkat kebijakan itu, siswa lebih fokus belajar.
      ar_eg: أنا مؤيد. بفضل القرار ده، التلاميذ بقوا مركزين أكتر في المذاكرة.
      ar: أنا أؤيدها، فبفضلها صار الطلاب أكثر تركيزًا في الدراسة.
      en: I support it. Thanks to that policy, students focus more on studying.
    - speaker: Mohamed
      text: Itu kelebihannya. Tapi ada juga kekurangannya.
      ar_eg: دي ميزته. بس ليه عيوب كمان.
      ar: هذه ميزتها، لكن لها عيوبًا أيضًا.
      en: That's the advantage. But there's a drawback, too.
    - speaker: Andi
      text: Apa kekurangannya?
      ar_eg: إيه عيوبه؟
      ar: وما عيوبها؟
      en: What's the drawback?
    - speaker: Mohamed
      text: Orang tua sulit menghubungi anaknya. Akibatnya, ada yang menolak. Oleh karena itu, dampaknya perlu dipikirkan.
      ar_eg: الأهالي صعب يكلموا ولادهم. ونتيجة لكده، فيه ناس رافضة. عشان كده، لازم نفكر في أثره.
      ar: يصعب على الأهالي الاتصال بأبنائهم، ونتيجةً لذلك يرفضها بعضهم، لذا ينبغي التفكير في أثرها.
      en: Parents find it hard to reach their children. As a result, some oppose it. So its impact needs some thought.
