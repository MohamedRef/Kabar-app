      ar: كم الساعة الآن؟ — عذرًا، ليست معي ساعة.
      en: What time is it now? — Sorry, I don't have a watch.
    answers: [berapa]
    words: [berapa, sekarang, tidak]
  - id: e03
    type: dictation
    text: Jam berapa sekarang?
    meaning:
      ar_eg: الساعة كام دلوقتي؟
      ar: كم الساعة الآن؟
      en: What time is it now?
    words: [jam, berapa, sekarang]
  - id: e04
    type: speaking
    text: Permisi, Mbak. Sekarang jam berapa?
    meaning:
