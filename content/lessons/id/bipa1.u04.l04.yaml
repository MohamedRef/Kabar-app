schema: kabar.lesson/v1
id: bipa1.u04.l04
language: id
title: Jam berapa?
can_do:
  ar_eg: تسأل الساعة كام وتقولها بالساعة المظبوطة.
  ar: أن تسأل عن الوقت وتذكره بالساعات الكاملة.
  en: Ask and say the time on the hour.
slides:
  - title: Jam berapa?
    body:
      ar_eg: |
        «الساعة كام؟» = «Jam berapa?» أو «Pukul berapa?» (pukul أرسمى شوية).
        والرد: jam + الرقم + وقت اليوم: jam tujuh pagi = ٧ الصبح، jam tujuh malam = ٧ بالليل.
        خلي بالك من الترتيب: jam tujuh = الساعة ٧، لكن tujuh jam = سبع ساعات (مدة).
      ar: |
        «كم الساعة؟» = «Jam berapa?» أو «Pukul berapa?» (وpukul أكثر رسمية).
        والجواب: jam + العدد + جزء اليوم: jam tujuh pagi = السابعة صباحًا، jam tujuh malam = السابعة مساءً.
        وانتبه للترتيب: jam tujuh = الساعة السابعة، أما tujuh jam = سبع ساعات (مدة).
      en: |
        "What time is it?" = "Jam berapa?" or "Pukul berapa?" (pukul is more formal).
        Answer: jam + number + part of day: jam tujuh pagi = 7 a.m., jam tujuh malam = 7 p.m.
        Watch the order: jam tujuh = seven o'clock, but tujuh jam = seven hours (a duration).
    grammar: id.time.clock
    examples:
      - text: Sekarang jam berapa? — Jam tujuh pagi.
        ar_eg: الساعة كام دلوقتي؟ — سبعة الصبح.
        ar: كم الساعة الآن؟ — السابعة صباحًا.
        en: What time is it now? — Seven a.m.
exercises:
  - id: e01
    type: listen
    text: jam tiga sore
    options: [jam tiga sore, tiga jam, jam tiga pagi]
    answer: 0
    words: [jam, tiga, sore]
  - id: e02
    type: fill_blank
    sentence: Sekarang jam ___? — Jam empat.
    meaning:
      ar_eg: الساعة كام دلوقتي؟ — أربعة.
      ar: كم الساعة الآن؟ — الرابعة.
      en: What time is it now? — Four o'clock.
    answers: [berapa]
    words: [berapa, sekarang]
  - id: e03
    type: dictation
    text: Jam berapa sekarang?
    meaning:
      ar_eg: الساعة كام دلوقتي؟
      ar: كم الساعة الآن؟
      en: What time is it now?
    words: [jam, berapa, sekarang]
  - id: e04
    type: speaking
    text: Permisi, Mbak. Sekarang jam berapa?
    meaning:
      ar_eg: لو سمحتي، الساعة كام دلوقتي؟
      ar: من فضلكِ، كم الساعة الآن؟
      en: Excuse me, miss. What time is it now?
    words: [sekarang, jam, berapa]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: 'في خطاب رسمي: «الساعة عشرة». تقول إيه؟'
      ar: 'في إعلان رسمي: «الساعة العاشرة». ماذا تقول؟'
      en: 'In a formal announcement: "at ten o''clock". What do you say?'
    options: [sepuluh jam, pukul sepuluh, jam sepuluhan]
    answer: 1
    explain:
      ar_eg: pukul زي jam بس رسمي، وبييجي قبل الرقم.
      ar: pukul مثل jam لكنها رسمية، وتأتي قبل العدد.
      en: Pukul is the formal jam, and it comes before the number.
    words: [pukul]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الساعة دلوقتي تسعة.
      ar: الساعة الآن التاسعة.
      en: It's nine o'clock now.
    answer: Sekarang jam sembilan.
    alternatives: [Jam sembilan sekarang.]
    distractors: [berapa, pukul]
    words: [sekarang, jam]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الساعة تلاتة.
      ar: الساعة الثالثة.
      en: It's three o'clock.
    answers: [Jam tiga., Jam tiga, Sekarang jam tiga., Pukul tiga.]
    words: [jam]
dialogue:
  lines:
    - speaker: Mohamed
      text: Rina, sekarang jam berapa?
      ar_eg: رينا، الساعة كام دلوقتي؟
      ar: رينا، كم الساعة الآن؟
      en: Rina, what time is it now?
    - speaker: Rina
      text: Sekarang jam sepuluh.
      ar_eg: الساعة عشرة دلوقتي.
      ar: الساعة الآن العاشرة.
      en: It's ten o'clock now.
    - speaker: Mohamed
      text: Jam sepuluh? Terima kasih, Rina.
      ar_eg: عشرة؟ شكرًا يا رينا.
      ar: العاشرة؟ شكرًا يا رينا.
      en: Ten o'clock? Thanks, Rina.
    - speaker: Rina
      text: Sama-sama. Kursus bahasa Indonesia pukul sebelas, ya!
      ar_eg: العفو. كورس الإندونيسي الساعة حداشر، ماشي!
      ar: عفوًا. دورة الإندونيسية في الساعة الحادية عشرة!
      en: You're welcome. The Indonesian course is at eleven o'clock, OK!
