    answers: ['Maaf, saya tidak punya jam.', 'Maaf, saya tidak punya jam', 'Maaf saya tidak punya jam.', Saya tidak punya jam., Saya tidak punya jam, 'Maaf, aku tidak punya jam.', 'Maaf, aku nggak punya jam.', 'Maaf, saya nggak punya jam.', Aku nggak punya jam.]
