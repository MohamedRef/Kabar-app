    answer: 0
    meaning:
      ar_eg: الساعة دلوقتي تمانية بتوقيت غرب إندونيسيا.
      ar: الساعة الآن الثامنة بتوقيت غرب إندونيسيا.
      en: It's now eight o'clock, Western Indonesia Time.
