language: id
title: Mudik
can_do:
  ar_eg: توصف تقاليد الأعياد والإجازات في إندونيسيا.
  ar: أن تصف تقاليد الأعياد والعطلات في إندونيسيا.
  en: Describe holiday traditions in Indonesia.
slides:
  - title: Mudik Lebaran
    body:
      ar_eg: |
        mudik = إنك ترجع بلدك (kampung halaman) في العيد. قبل Lebaran ملايين الناس بيسيبوا المدن الكبيرة ويرجعوا لأهاليهم، وده من أكبر الهجرات السنوية في العالم.
        والنتيجة؟ macet (زحمة مرور) في كل حتة!
      ar: |
        mudik = العودة إلى البلدة الأصلية (kampung halaman) في العيد. فقبل Lebaran يغادر الملايين المدنَ الكبرى إلى أهاليهم، وهي من أكبر الهجرات السنوية في العالم.
        والنتيجة: macet (ازدحام مروري) في كل مكان!
      en: |
        mudik = going back to your hometown (kampung halaman) for the holiday. Before Lebaran, millions leave the big cities for their families: one of the biggest yearly migrations in the world.
        The result? macet (traffic jams) everywhere!
    examples:
      - text: Setiap Lebaran, jutaan orang mudik ke kampung halaman.
        ar_eg: كل عيد، ملايين الناس بيرجعوا بلادهم.
        ar: في كل عيد يعود الملايين إلى بلداتهم.
        en: Every Lebaran, millions of people go home to their hometowns.
      - text: Jalan ke pelabuhan macet sekali.
        ar_eg: الطريق للميناء زحمة جدًا.
        ar: الطريق إلى الميناء مزدحم جدًا.
        en: The road to the port is totally jammed.
  - title: Hari raya dan tanggal merah
    body:
      ar_eg: |
        إندونيسيا عندها أجازات إسلامية (بالتقويم الهجري) وأجازات قومية. الأجازة الرسمية اسمها tanggal merah (التاريخ الأحمر)، لأنها مكتوبة بالأحمر في النتيجة.
        hari raya = عيد كبير. وIduladha من «عيد الأضحى»، واسمه كمان Hari Raya Kurban، وkurban من «قُربان».
      ar: |
        في إندونيسيا عطلات إسلامية (بالتقويم الهجري) وعطلات وطنية. والعطلة الرسمية تُسمّى tanggal merah (التاريخ الأحمر) لأنها تُطبع بالأحمر في التقويم.
        hari raya = عيد كبير، وIduladha من «عيد الأضحى» ويُسمّى أيضًا Hari Raya Kurban، وkurban من «قُربان».
      en: |
        Indonesia has Islamic (Hijri) holidays and national ones. A public holiday is a tanggal merah (red date), printed in red on the calendar.
        hari raya = a major festival. Iduladha comes from «عيد الأضحى» and is also called Hari Raya Kurban; kurban comes from «قُربان».
    examples:
      - text: Iduladha adalah tanggal merah di Indonesia.
        ar_eg: عيد الأضحى أجازة رسمية في إندونيسيا.
        ar: عيد الأضحى عطلة رسمية في إندونيسيا.
        en: Eid al-Adha is a public holiday in Indonesia.
      - text: Pada Iduladha, ada daging kurban untuk semua warga.
        ar_eg: في عيد الأضحى فيه لحمة أضحية لكل الناس.
        ar: في عيد الأضحى يُوزَّع لحم الأضاحي على جميع السكان.
        en: At Eid al-Adha there's sacrificial meat for everyone.
