dialogue:
  title: Lebaran nanti
  lines:
    - speaker: Mohamed
      text: Mas, Lebaran nanti kamu mudik?
      ar_eg: يا ماس، العيد الجاي هترجع بلدك؟
      ar: يا ماس، هل ستعود إلى بلدتك في العيد القادم؟
      en: Mas, are you going home for the coming Lebaran?
    - speaker: Mas Rizal
      text: Ya, ke kampung halaman saya di Sumbawa. Tapi pelabuhannya pasti macet!
      ar_eg: أيوه، لبلدي في سومباوا. بس الميناء أكيد هيبقى زحمة!
      ar: نعم، إلى بلدتي في سومباوا، لكن الميناء سيكون مزدحمًا بالتأكيد!
      en: Yes, to my hometown on Sumbawa. But the port is sure to be jammed!
    - speaker: Mohamed
      text: Di Mesir, Iduladha juga tanggal merah. Kami makan daging kurban bersama keluarga.
      ar_eg: في مصر، عيد الأضحى برضه أجازة رسمية. بناكل لحمة الأضحية مع العيلة.
      ar: في مصر عيد الأضحى عطلة رسمية أيضًا، ونأكل لحم الأضحية مع الأسرة.
      en: In Egypt, Eid al-Adha is a public holiday too. We eat the sacrificial meat with family.
    - speaker: Mas Rizal
      text: Sama! Di sini hari raya juga untuk keluarga.
      ar_eg: زينا بالظبط! هنا كمان العيد للعيلة.
      ar: مثلنا تمامًا! هنا أيضًا العيد للأسرة.
      en: Same here! Here too, the holidays are for family.
