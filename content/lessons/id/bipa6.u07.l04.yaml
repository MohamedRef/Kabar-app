schema: kabar.lesson/v1
id: bipa6.u07.l04
language: id
title: Konstitusi
can_do:
  ar_eg: 'تتكلم عن دستور إندونيسيا: اتعمل إمتى، واتعدّل كام مرة، وفيه إيه.'
  ar: 'أن تتحدّث عن دستور إندونيسيا: متى أُقرّ، وكم مرّة عُدّل، وما فيه.'
  en: Talk about Indonesia's constitution, when it was passed, how often it was amended and what it holds.
slides:
  - title: UUD 1945
    body:
      ar_eg: |
        الـ konstitusi بتاعة إندونيسيا اسمها Undang-Undang Dasar 1945، واختصارها UUD 1945.
        - undang-undang dasar = الدستور (حرفيًا: القانون الأساسي)
        - disahkan = اتعتمد رسميًا. الدستور disahkan يوم ١٨ أغسطس ١٩٤٥، بعد الاستقلال بيوم.
        - pembukaan = الديباجة، أول جزء في الدستور
        - amandemen = تعديل. الدستور اتعدّل أربع مرات ما بين ١٩٩٩ و٢٠٠٢.
        بعد التعديلات، فترة الرئيس بقت محدودة بفترتين بس.
        - في الشارع: banget = sekali (أوي)، buat = untuk (عشان / لـ)، nggak = tidak (لأ / مش).
      ar: |
        دستور إندونيسيا اسمه Undang-Undang Dasar 1945، واختصاره UUD 1945.
        - undang-undang dasar = الدستور (حرفيًّا: القانون الأساسي)
        - disahkan = أُقرّ رسميًّا؛ وقد أُقرّ الدستور في ١٨ أغسطس ١٩٤٥، بعد الاستقلال بيوم.
        - pembukaan = الديباجة، أوّل أجزاء الدستور
        - amandemen = تعديل؛ عُدّل الدستور أربع مرّات بين ١٩٩٩ و٢٠٠٢.
        وبعد التعديلات صارت ولاية الرئيس محدودة بفترتين.
        - في كلام الشارع: banget = sekali (جدًّا)، buat = untuk (لـ / من أجل)، nggak = tidak (لا / ليس).
      en: |
        Indonesia's konstitusi is the Undang-Undang Dasar 1945, or UUD 1945.
        - undang-undang dasar = constitution (literally, basic law)
        - disahkan = formally enacted. The constitution was disahkan on 18 August 1945, the day after independence.
        - pembukaan = preamble, the first part of the constitution
        - amandemen = amendment. It was amended four times between 1999 and 2002.
        Since the amendments, a president may serve only two terms.
        - On the street: banget = sekali (very), buat = untuk (for), nggak = tidak (no, not).
    examples:
      - text: UUD 1945 disahkan sehari setelah Proklamasi Kemerdekaan.
        ar_eg: دستور ١٩٤٥ اتعتمد بعد إعلان الاستقلال بيوم.
        ar: أُقرّ دستور ١٩٤٥ بعد إعلان الاستقلال بيوم.
        en: UUD 1945 was enacted the day after the Proclamation of Independence.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: konstitusi
        ar_eg: دستور
        ar: دستور
        en: constitution
      - text: undang-undang dasar
        ar_eg: الدستور (القانون الأساسي)
        ar: القانون الأساسي
        en: basic law
      - text: disahkan
        ar_eg: اتعتمد رسميًا
        ar: أُقرّ
        en: enacted
      - text: pembukaan
        ar_eg: ديباجة
        ar: ديباجة
        en: preamble
      - text: amandemen
        ar_eg: تعديل
        ar: تعديل
        en: amendment
    words: [konstitusi, undang-undang dasar, disahkan, pembukaan, amandemen]
  - id: e02
    type: listen
    text: UUD 1945 sudah mengalami empat kali amandemen.
    question:
      ar_eg: الدستور اتعدّل كام مرة؟
      ar: كم مرّة عُدّل الدستور؟
      en: How many times has the constitution been amended?
    options:
      - مرة واحدة.
      - أربع مرات.
      - عشر مرات.
    answer: 1
    words: [amandemen]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الدستور اتعتمد إمتى؟
      ar: متى أُقرّ الدستور؟
      en: When was the constitution enacted?
    options:
      - ١٧ أغسطس ١٩٤٥.
      - سنة ١٩٩٨.
      - ١٨ أغسطس ١٩٤٥.
    answer: 2
    explain:
      ar_eg: الاستقلال يوم ١٧، والدستور disahkan تاني يوم.
      ar: الاستقلال في السابع عشر، وأُقرّ الدستور في اليوم التالي.
      en: Independence was on the 17th; the constitution was disahkan the next day.
    words: [disahkan]
  - id: e04
    type: fill_blank
    sentence: Bagian pertama UUD 1945 disebut ___.
    meaning:
      ar_eg: أول جزء في دستور ١٩٤٥ اسمه الديباجة.
      ar: يُسمّى الجزء الأوّل من دستور ١٩٤٥ الديباجة.
      en: The first part of UUD 1945 is called the preamble.
    options: [pembukaan, amandemen, pasal]
    answers: [pembukaan]
    words: [pembukaan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «UUD» اختصار لإيه؟
      ar: ما الذي تختصره «UUD»؟
      en: What does "UUD" stand for?
    options: [Undang-Undang Dasar, Usaha Umum Daerah, Ujian Umum Dasar]
    answer: 0
    words: [undang-undang dasar]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الدستور بيحمي حقوق كل المواطنين.
      ar: يحمي الدستور حقوق جميع المواطنين.
      en: The constitution protects the rights of every citizen.
    answer: Konstitusi melindungi hak semua warga negara.
    distractors: [amandemen, disahkan]
    words: [konstitusi, melindungi]
  - id: e07
    type: translate
    direction: from_target
    source_text: Setelah amandemen, presiden hanya boleh menjabat dua periode.
    answers_meaning:
      ar_eg:
        - بعد التعديل، الرئيس مسموحله يحكم فترتين بس.
        - من بعد التعديل، الرئيس مايقدرش يقعد أكتر من فترتين.
      ar:
        - بعد التعديل لا يجوز للرئيس أن يتولّى المنصب إلا فترتين.
        - صار الرئيس بعد التعديل محدودًا بولايتين.
      en:
        - After the amendment, a president may serve only two terms.
        - Since the amendment, presidents are limited to two terms.
    words: [amandemen]
  - id: e08
    type: speaking
    text: Undang-undang dasar adalah hukum tertinggi di negara ini.
    meaning:
      ar_eg: الدستور هو أعلى قانون في البلد دي.
      ar: الدستور هو القانون الأعلى في هذه الدولة.
      en: The constitution is the highest law in this country.
    words: [undang-undang dasar]
  - id: e09
    type: dictation
    text: Konstitusi itu disahkan pada tanggal delapan belas Agustus.
    meaning:
      ar_eg: الدستور ده اتعتمد يوم تمنتاشر أغسطس.
      ar: أُقرّ ذلك الدستور في الثامن عشر من أغسطس.
      en: That constitution was enacted on the eighteenth of August.
    words: [konstitusi, disahkan]
  - id: e10
    type: fill_blank
    sentence: Pancasila tertulis di dalam ___ UUD 1945.
    meaning:
      ar_eg: البانتشاسيلا مكتوبة في ديباجة دستور ١٩٤٥.
      ar: البانتشاسيلا مكتوبة في ديباجة دستور ١٩٤٥.
      en: Pancasila is written in the preamble of UUD 1945.
    options: [pembukaan, konstitusi, amandemen]
    answers: [pembukaan]
    words: [pembukaan]
dialogue:
  title: Buku saku UUD
  lines:
    - speaker: Kak Intan
      text: Mohamed, ini buku saku UUD 1945. Setiap mahasiswa hukum punya satu.
      ar_eg: يا محمد، ده كتاب الجيب بتاع دستور ١٩٤٥. كل طالب حقوق معاه واحد.
      ar: يا محمد، هذا كتيّب دستور ١٩٤٥، ولدى كلّ طالب قانون نسخة منه.
      en: Mohamed, this is a pocket UUD 1945. Every law student has one.
    - speaker: Mohamed
      text: Kecil banget buat sebuah konstitusi. Isinya masih sama dari 1945?
      ar_eg: صغير أوي على دستور. هو لسه زي ما هو من ١٩٤٥؟
      ar: صغير جدًّا لدستور! أما زال مضمونه كما كان منذ ١٩٤٥؟
      en: That's tiny for a constitution. Is it still the same as in 1945?
    - speaker: Kak Intan
      text: Nggak. Setelah Reformasi, ada empat amandemen. Pembukaannya nggak diubah.
      ar_eg: لأ. بعد الإصلاح، حصل أربع تعديلات. بس الديباجة ماتغيرتش.
      ar: لا، فبعد الإصلاح أُجريت أربعة تعديلات، أمّا الديباجة فلم تُغيَّر.
      en: No. After Reformasi there were four amendments. The preamble was left unchanged.
    - speaker: Mohamed
      text: Menarik. Di Mesir, konstitusi kami juga diamandemen beberapa kali.
      ar_eg: حلو. في مصر، دستورنا كمان اتعدّل كذا مرة.
      ar: مثير للاهتمام. وفي مصر عُدّل دستورنا أيضًا مرّات عدّة.
      en: Interesting. In Egypt, our constitution has been amended several times too.
