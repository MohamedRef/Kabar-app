schema: kabar.lesson/v1
id: bipa4.u08.l09
language: id
title: Kira-kira apa yang terjadi?
can_do:
  ar_eg: 'تخمّن وتفكر بصوت عالي وانت بتحكي حدوتة: أظن، يمكن، بالعكس.'
  ar: 'أن تخمّن وتفكّر بصوت عالٍ وأنت تروي حكاية: أظن، لا أدري، بل.'
  en: 'Guess and think aloud while telling a tale: I think, who knows, instead.'
slides:
  - title: Berpikir dan menebak
    body:
      ar_eg: |
        kira = يظن (kira-kira = تقريبًا، أو «تفتكر؟»)، berpikir = يفكّر (pikir = فكر)، pikiran = فكرة، عقل.
        mengalami = يمرّ بتجربة أو يعاني (mengalami kesulitan = يواجه صعوبة)، sendirian = لوحده.
        entah = مش عارف، الله أعلم (entah ke mana = مش عارف راح فين)، malah = بالعكس، بدل ما (لحاجة غير متوقعة).
        pantas = يستاهل أو مناسب (pantas mendapat hadiah = يستاهل جايزة).
      ar: |
        kira = يظن (kira-kira = تقريبًا، أو «أتظن؟»)، berpikir = يفكّر (pikir = فكر)، pikiran = الفكر والعقل.
        mengalami = يمرّ بـ أو يعاني (mengalami kesulitan = يواجه صعوبة)، sendirian = وحيدًا.
        entah = لا أدري (entah ke mana = لا يُدرى إلى أين)، malah = بل، على العكس (لأمر غير متوقع).
        pantas = يستحق أو لائق (pantas mendapat hadiah = يستحق جائزة).
      en: |
        kira = to think, suppose (kira-kira = roughly, or "do you think?"), berpikir = to think (pikir = thought), pikiran = mind, thoughts.
        mengalami = to experience, go through (mengalami kesulitan = have difficulties), sendirian = alone.
        entah = who knows (entah ke mana = who knows where), malah = instead, on the contrary (for something unexpected).
        pantas = to deserve, be fitting (pantas mendapat hadiah = deserves a prize).
    examples:
      - text: Saya kira nelayan itu akan kaya.
        ar_eg: أنا افتكرت إن الصياد ده هيبقى غني.
        ar: ظننت أن ذلك الصياد سيصبح غنيًا.
        en: I thought that fisherman would get rich.
      - text: Dia malah jatuh miskin karena berpikir dia paling pintar.
        ar_eg: بالعكس، افتقر عشان افتكر نفسه أذكى واحد.
        ar: بل افتقر لأنه ظنّ نفسه الأذكى.
        en: Instead he became poor because he thought he was the cleverest.
      - text: Anak itu tinggal sendirian di hutan, entah berapa tahun.
        ar_eg: الولد ده عاش لوحده في الغابة، الله أعلم كام سنة.
        ar: عاش ذلك الولد وحيدًا في الغابة، لا يُدرى كم سنة.
        en: The boy lived alone in the forest for who knows how many years.
