  - id: e03
    type: listen
    text: Kancil tinggal sendirian di tepi sungai.
    question:
      ar_eg: الكانتشيل عايش مع مين؟
      ar: مع من يعيش الكانتشيل؟
      en: Who does the mouse-deer live with?
    options: [لوحده, مع أهله, مع التماسيح]
    answer: 0
    meaning:
      ar_eg: الكانتشيل عايش لوحده على شط النهر.
      ar: يعيش الكانتشيل وحيدًا على ضفة النهر.
      en: The mouse-deer lives alone on the riverbank.
    words: [sendirian]
  - id: e04
    type: fill_blank
    sentence: Saya ___ dia sudah pulang, ternyata dia masih di kantor.
    meaning:
      ar_eg: أنا ___ إنه روّح، طلع لسه في المكتب.
      ar: ___ أنه عاد إلى البيت، فإذا هو ما زال في المكتب.
      en: I ___ they'd gone home, but they were still at the office.
    options: [kira, entah, pantas]
    answers: [kira]
    words: [kira, entah, pantas]
    explain:
      ar_eg: saya kira = كنت فاكر، وternyata بتقول إن الظن طلع غلط. entah = مش عارف، وpantas = يليق.
      ar: saya kira = ظننت، وternyata تبيّن أن الظن خطأ. أما entah فلا أدري، وpantas لائق.
      en: saya kira means I thought, and ternyata shows it was wrong. entah is who knows and pantas is fitting.
  - id: e05
    type: multiple_choice
    question: Dia disuruh belajar, tapi dia ___ tidur.
    options: [malah, entah, kira]
    answer: 0
    explain:
      ar_eg: malah = بالعكس، عمل حاجة غير المتوقعة. entah = الله أعلم، وkira = يظن.
      ar: malah = بل على العكس، ففعل غير المتوقع. أما entah فلا أدري، وkira يظن.
      en: malah means instead, doing the unexpected thing. entah is who knows, and kira is suppose.
    words: [malah, entah, kira]
  - id: e06
    type: fill_blank
    sentence: Nelayan itu ___ banyak kesulitan di laut.
    meaning:
      ar_eg: الصياد ده ___ صعوبات كتير في البحر.
      ar: ___ ذلك الصياد صعوبات كثيرة في البحر.
      en: That fisherman ___ many hardships at sea.
    options: [mengalami, berpikir, sendirian]
    answers: [mengalami]
    words: [mengalami, berpikir, sendirian]
    explain:
      ar_eg: mengalami kesulitan = مرّ بصعوبات. berpikir = يفكر، وsendirian = لوحده، ومايجوش قبل kesulitan.
      ar: mengalami kesulitan = عانى صعوبات. أما berpikir فيفكّر، وsendirian وحيدًا، ولا يسبقان kesulitan.
      en: mengalami kesulitan means went through hardships. berpikir is to think and sendirian is alone; neither goes before kesulitan.
  - id: e07
    type: multiple_choice
    question: Pemuda pemberani itu ___ mendapat hadiah dari raja.
    options: [pantas, malah, entah]
    answer: 0
    explain:
      ar_eg: pantas mendapat = يستاهل ياخد. malah = بالعكس، وentah = الله أعلم.
      ar: pantas mendapat = يستحق أن ينال. أما malah فبل، وentah لا أدري.
      en: pantas mendapat means deserves to get. malah is instead, and entah is who knows.
    words: [pantas, malah, entah]
  - id: e08
    type: build_sentence
    source:
      ar_eg: لازم نفكّر قبل ما نتكلم.
      ar: يجب أن نفكّر قبل أن نتكلم.
      en: We must think before we speak.
    answer: Kita harus berpikir dulu sebelum berbicara.
    distractors: [pikiran, kira]
    words: [berpikir, pikiran, kira]
    explain:
      ar_eg: harus berpikir dulu = لازم نفكر الأول. pikiran = فكرة (اسم)، وkira = يظن، ومالهمش مكان هنا.
      ar: harus berpikir dulu = يجب أن نفكّر أولًا. أما pikiran فاسم (فكرة)، وkira يظن، ولا مكان لهما هنا.
      en: harus berpikir dulu means we must think first. pikiran is the noun thought and kira is to guess; they don't belong here.
  - id: e09
    type: translate
    direction: from_target
    source_text: Entah ke mana kalung mutiara itu hilang.
    answers_meaning:
      ar_eg: [الله أعلم العقد اللولي ده راح فين, محدش عارف العقد اللولي اختفى فين]
      ar: [لا يُدرى أين اختفت قلادة اللؤلؤ, لا أحد يدري أين ضاعت قلادة اللؤلؤ]
      en: [Who knows where the pearl necklace went, Nobody knows where that pearl necklace disappeared to]
    words: [entah]
  - id: e10
    type: speaking
    text: Pikiran saya penuh dengan cerita Opa Jemmy.
    meaning:
      ar_eg: دماغي مليانة بحكايات أوبا جيمي.
      ar: عقلي مليء بحكايات أوبا جيمي.
      en: My mind is full of Opa Jemmy's stories.
    words: [pikiran, mengalami, sendirian]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Mohamed, kira-kira apa yang terjadi pada nelayan tua itu?
      ar_eg: يا محمد، تفتكر إيه اللي حصل للصياد العجوز ده؟
      ar: يا محمد، ماذا تظن أنه حدث لذلك الصياد العجوز؟
      en: Mohamed, what do you think happened to the old fisherman?
    - speaker: Mohamed
      text: Saya kira dia jadi kaya karena ikan ajaib itu.
      ar_eg: أنا أظن إنه بقى غني بسبب السمكة السحرية.
      ar: أظن أنه صار غنيًا بفضل السمكة السحرية.
      en: I think he got rich because of the magic fish.
    - speaker: Mas Rizal
      text: Salah! Dia malah tinggal sendirian di gua.
      ar_eg: غلط! بالعكس، عاش لوحده في كهف.
      ar: خطأ! بل عاش وحيدًا في كهف.
      en: Wrong! Instead he lived alone in a cave.
    - speaker: Mohamed
      text: Kasihan. Dia mengalami banyak kesulitan, ya?
      ar_eg: يا حرام. شاف صعوبات كتير، صح؟
      ar: مسكين. مرّ بصعوبات كثيرة، أليس كذلك؟
      en: Poor man. He went through a lot of hardship, didn't he?
    - speaker: Mas Rizal
      text: Iya. Tapi dia pantas mendapat itu, karena dia melanggar janjinya.
      ar_eg: أيوه. بس هو يستاهل، عشان خلف وعده.
      ar: نعم، لكنه استحق ذلك لأنه نقض وعده.
      en: Yes. But he deserved it, because he broke his promise.
