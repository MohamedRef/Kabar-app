schema: kabar.lesson/v1
id: bipa4.u08.l09
language: id
title: Kancil dan buaya
can_do:
  ar_eg: تقرا جزء من حكاية شعبية وتفهم الشخصيات واللي حصل.
  ar: أن تقرأ مقطعًا من حكاية شعبية وتفهم شخصياتها وأحداثها.
  en: Read an excerpt from a folk tale and follow its characters and events.
slides:
  - title: Dongeng kancil
    body:
      ar_eg: |
        Mas Rizal جاب لـ Mohamed كتاب حواديت للأطفال. اقرا الجزء ده من حكاية الكانتشيل (غزال صغير) والتماسيح.
        كلمة جديدة: punggung = ضهر.
      ar: |
        أحضر Mas Rizal لـ Mohamed كتاب حكايات للأطفال. اقرأ هذا المقطع من حكاية الكانتشيل (غزال صغير) والتماسيح.
        كلمة جديدة: punggung = ظهر.
      en: |
        Mas Rizal brought Mohamed a children's storybook. Read this excerpt from the tale of the mouse-deer and the crocodiles.
        New word: punggung = back (of the body).
    examples:
      - text: Pada zaman dahulu, seekor kancil yang licik ingin menyeberangi sebuah sungai besar. Tetapi di sungai itu hidup banyak buaya yang lapar.
        ar_eg: زمان زمان، كان فيه كانتشيل مكّار عايز يعدّي نهر كبير. بس في النهر ده كان عايش تماسيح كتير جعانة.
        ar: في قديم الزمان أراد كانتشيل ماكر أن يعبر نهرًا كبيرًا، لكن في ذلك النهر عاشت تماسيح كثيرة جائعة.
        en: Long ago, a cunning mouse-deer wanted to cross a big river. But many hungry crocodiles lived in that river.
      - text: Kancil berkata, 'Raja menyuruh saya menghitung kalian. Berdirilah satu per satu sampai ke seberang!'
        ar_eg: "الكانتشيل قال: «الملك أمرني أعدّكم. اقفوا واحد ورا واحد لحد البر التاني!»"
        ar: "قال الكانتشيل: «أمرني الملك أن أعدّكم. قفوا واحدًا تلو الآخر حتى الضفة الأخرى!»"
        en: The mouse-deer said, 'The king has ordered me to count you. Line up one by one to the other bank!'
      - text: Buaya-buaya yang sombong itu percaya. Kancil melompat dari punggung ke punggung, lalu tertawa di seberang sungai.
        ar_eg: التماسيح المغرورة صدّقت. والكانتشيل نط من ضهر لضهر، وبعدين ضحك على البر التاني من النهر.
        ar: صدّقت التماسيح المغرورة، فقفز الكانتشيل من ظهر إلى ظهر ثم ضحك على الضفة الأخرى من النهر.
        en: The arrogant crocodiles believed him. The mouse-deer jumped from back to back, then laughed on the other side of the river.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الكانتشيل كان عايز إيه؟
      ar: ماذا أراد الكانتشيل؟
      en: What did the mouse-deer want?
    options: [Makan buaya, Menyeberangi sungai, Bertemu raja]
    answer: 1
    explain:
      ar_eg: الكانتشيل كان عايز يعدّي النهر (menyeberangi sungai). ماكانش عايز ياكل التماسيح ولا يقابل الملك.
      ar: أراد الكانتشيل عبور النهر (menyeberangi sungai)، لا أكل التماسيح ولا لقاء الملك.
      en: The mouse-deer wanted to cross the river (menyeberangi sungai), not eat crocodiles or meet the king.
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: التماسيح وقفت ورا بعض ليه؟
      ar: لماذا اصطفّت التماسيح؟
      en: Why did the crocodiles line up?
    options:
      - Karena mereka percaya kata-kata kancil.
      - Karena mereka setia kepada kancil.
      - Karena mereka juga ingin menyeberang.
    answer: 0
    words: [sombong]
    explain:
      ar_eg: التماسيح وقفت صف عشان صدّقت كلام الكانتشيل. ماكانوش أوفيا له، ولا عايزين يعدّوا.
      ar: اصطفت التماسيح لأنها صدّقت كلام الكانتشيل، لا وفاءً له ولا رغبةً في العبور.
      en: The crocodiles lined up because they believed him. They weren't loyal to him or wanting to cross.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الكانتشيل عدّى النهر إزاي؟
      ar: كيف عبر الكانتشيل النهر؟
      en: How did the mouse-deer cross the river?
    options:
      - Dengan perahu kecil
      - Dengan berenang
      - Dengan melompat dari punggung buaya
    answer: 2
    words: [punggung]
    explain:
      ar_eg: الكانتشيل نط على ضهر التماسيح واحد واحد. ماكانش معاه مركب، ومابيعرفش يعوم.
      ar: قفز الكانتشيل على ظهور التماسيح واحدًا تلو الآخر، فلم يكن معه قارب ولم يسبح.
      en: He jumped across the crocodiles' backs. He had no boat and didn't swim.
  - id: e04
    type: listen
    text: Kancil melompat dari punggung ke punggung.
    options:
      - Kancil melompat dari perahu ke perahu.
      - Kancil melompat dari punggung ke punggung.
      - Kancil berjalan dari punggung ke punggung.
    answer: 1
    meaning:
      ar_eg: الكانتشيل نط من ضهر لضهر.
      ar: قفز الكانتشيل من ظهر إلى ظهر.
      en: The mouse-deer jumped from back to back.
    words: [punggung]
  - id: e05
    type: match_pairs
    pairs:
      - text: licik
        ar_eg: مكّار
        ar: ماكر
        en: cunning
      - text: sombong
        ar_eg: مغرور
        ar: مغرور
        en: arrogant
      - text: punggung
        ar_eg: ضهر
        ar: ظهر
        en: back (of the body)
      - text: menyeberangi
        ar_eg: يعدّي (نهر / شارع)
        ar: يعبر
        en: cross
      - text: seberang
        ar_eg: الناحية التانية
        ar: الضفة / الجهة المقابلة
        en: the other side
    words: [licik, sombong, punggung]
  - id: e06
    type: fill_blank
    sentence: Tokoh kancil dalam cerita ini ___, tetapi pintar.
    meaning:
      ar_eg: شخصية الكانتشيل في الحكاية دي مكّارة، بس ذكية.
      ar: شخصية الكانتشيل في هذه الحكاية ماكرة لكنها ذكية.
      en: The mouse-deer in this story is cunning, but clever.
    options: [setia, licik, sombong]
    answers: [licik]
    explain:
      ar_eg: النص بيقول «seekor kancil yang licik». المغرورين (sombong) هما التماسيح.
      ar: يقول النص «seekor kancil yang licik»، أما المغرورة (sombong) فهي التماسيح.
      en: The text says "seekor kancil yang licik"; the sombong ones are the crocodiles.
    words: [licik, tokoh]
  - id: e07
    type: build_sentence
    source:
      ar_eg: التماسيح المغرورة دي صدّقت الكانتشيل.
      ar: صدّقت تلك التماسيح المغرورة الكانتشيل.
      en: The arrogant crocodiles believed the mouse-deer.
    answer: Buaya-buaya yang sombong itu percaya kepada kancil.
    distractors: [licik, setia]
    words: [sombong]
    explain:
      ar_eg: sombong = مغرور، والتماسيح المغرورة صدّقت. licik = مكّار ودي صفة الكانتشيل، وsetia = وفي.
      ar: sombong = مغرور، فالتماسيح المغرورة صدّقت. أما licik فماكر وهي صفة الكانتشيل، وsetia وفيّ.
      en: sombong means arrogant, describing the crocodiles. licik (cunning) is the mouse-deer's trait, and setia is loyal.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الكانتشيل نط على ضهر التمساح.
      ar: قفز الكانتشيل على ظهر التمساح.
      en: The mouse-deer jumped onto the crocodile's back.
    answers:
      - Kancil melompat ke punggung buaya.
      - Kancil itu melompat ke punggung buaya.
      - Kancil melompat ke atas punggung buaya.
      - Kancil itu melompat ke atas punggung buaya.
      - Sang kancil melompat ke punggung buaya.
    words: [punggung]
