dialogue:
  title: Membahas dongeng
  lines:
    - speaker: Mas Rizal
      text: Gimana cerita kancil tadi? Kamu suka?
      ar_eg: إيه رأيك في حكاية الكانتشيل؟ عجبتك؟
      ar: ما رأيك في حكاية الكانتشيل؟ هل أعجبتك؟
      en: How was the mouse-deer story? Did you like it?
    - speaker: Mohamed
      text: Suka! Kancil itu licik banget. Dia bilang raja minta dia menghitung buaya.
      ar_eg: عجبتني! الكانتشيل ده مكّار جدًا. قال إن الملك طلب منه يعدّ التماسيح.
      ar: أعجبتني! الكانتشيل ماكر جدًا، فقد قال إن الملك طلب منه عدّ التماسيح.
      en: I did! The mouse-deer is so cunning. He said the king asked him to count the crocodiles.
    - speaker: Mas Rizal
      text: Terus buaya-buaya itu percaya karena mereka sombong.
      ar_eg: والتماسيح صدّقته عشان مغرورين.
      ar: وصدّقته التماسيح لأنها مغرورة.
      en: And the crocodiles believed him because they were arrogant.
    - speaker: Mohamed
      text: Jadi amanatnya, jangan sombong biar orang nggak bisa bohongin kamu.
      ar_eg: 'يبقى العبرة: ما تبقاش مغرور عشان ماحدش يقدر يضحك عليك.'
      ar: 'فالعبرة: لا تتكبّر كي لا يستطيع أحد خداعك.'
      en: 'So the moral is: don''t be arrogant, so nobody can fool you.'
    - speaker: Mas Rizal
      text: Bener banget! Kamu udah kayak guru.
      ar_eg: بالظبط! إنت بقيت زي المدرس.
      ar: تمامًا! صرت مثل المعلّم.
      en: Exactly! You sound like a teacher.
