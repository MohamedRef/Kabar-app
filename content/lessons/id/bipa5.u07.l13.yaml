  - id: e08
    type: listen
    text: Pasokan udang berkurang, jadi stok di pasar terapung cepat habis.
    question:
      ar_eg: حصل إيه في السوق؟
      ar: ماذا حدث في السوق؟
      en: What happened at the market?
    options: [الستوك بيخلص بسرعة, الأسعار بتقل, السوق مقفول]
    answer: 0
    meaning:
      ar_eg: توريد الجمبري قل، فالستوك في السوق العايم بيخلص بسرعة.
      ar: قلّ إمداد الروبيان فنفد المخزون في السوق العائمة سريعًا.
      en: Prawn supply fell, so stock at the floating market runs out fast.
    words: [pasokan, udang, stok]
  - id: e09
    type: dictation
    text: Tradisi pasar terapung sudah ada sejak zaman kesultanan.
    meaning:
      ar_eg: عادة السوق العايم موجودة من أيام السلطنة.
      ar: تقليد السوق العائم قائم منذ عهد السلطنة.
      en: The floating market tradition dates back to the sultanate.
    words: [tradisi, terapung]
  - id: e10
