    text: Adab makan di Mesir dan Indonesia punya banyak persamaan.
    meaning:
      ar_eg: آداب الأكل في مصر وإندونيسيا فيها حاجات مشتركة كتير.
      ar: لآداب الطعام في مصر وإندونيسيا أوجه شبه كثيرة.
      en: Table manners in Egypt and Indonesia have a lot in common.
    words: [adab]
  - id: e11
    type: fill_blank
    sentence: Kapal itu membawa ___ daging dengan label halal dari Australia.
    meaning:
      ar_eg: المركب دي شايلة ___ لحمة عليها علامة حلال من أستراليا.
      ar: تحمل تلك السفينة ___ لحم بعلامة حلال من أستراليا.
      en: That ship carries a ___ of halal-labelled meat from Australia.
    options: [kargo, salad, lelang]
    answers: [kargo]
    words: [kargo, salad, lelang, label halal]
  - id: e12
