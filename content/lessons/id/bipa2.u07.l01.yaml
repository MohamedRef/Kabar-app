schema: kabar.lesson/v1
id: bipa2.u07.l01
language: id
title: Bersepeda dan berselancar
can_do:
  ar_eg: تستعمل ber- بمعنى يركب / يلبس / يعمل حاجة.
  ar: أن تستعمل ber- بمعنى الركوب واللبس والمزاولة.
  en: Use ber- for using / riding / doing.
slides:
  - title: Bersepeda = naik sepeda
    body:
      ar_eg: |
        في BIPA 1 شفنا ber- = بيعمل نشاط (berenang، berlibur). لما تحطها قبل اسم وسيلة أو أداة رياضة بتبقى «يركب / يستعمل»:
        - sepeda (عجلة) → bersepeda = يركب عجلة
        - selancar (ركوب الأمواج) → berselancar = يركب الأمواج (سيرف)
        - motor → bermotor = راكب موتوسيكل
        خلّي بالك: bersepeda فيها «يركب» خلاص. يا تقول bersepeda، يا naik sepeda، بس مش naik bersepeda ✗.
      ar: |
        عرفنا في BIPA 1 أن ber- تفيد مزاولة النشاط (berenang، berlibur). وقبل اسم المركبة أو أداة الرياضة تفيد الركوب أو الاستعمال:
        - sepeda (دراجة) → bersepeda = يركب الدراجة
        - selancar (ركوب الأمواج) → berselancar = يركب الأمواج
        - motor → bermotor = يركب درّاجة نارية
        وانتبه: bersepeda تتضمن الركوب، فقل bersepeda أو naik sepeda، لا naik bersepeda ✗.
      en: |
        BIPA 1 showed ber- = doing an activity (berenang, berlibur). Before a vehicle or a piece of sports kit it means "ride / use":
        - sepeda (bicycle) → bersepeda = cycle
        - selancar (surfing) → berselancar = surf
        - motor → bermotor = ride a motorbike
        Careful: bersepeda already contains "ride". Say bersepeda or naik sepeda, never naik bersepeda ✗.
    grammar: id.prefix.ber.meanings
    examples:
      - text: Setiap pagi saya bersepeda di pantai.
        ar_eg: كل يوم الصبح بركب العجلة على البحر.
        ar: كل صباح أركب الدراجة على الشاطئ.
        en: Every morning I cycle on the beach.
      - text: Di Kuta banyak orang berselancar.
        ar_eg: في كوتا ناس كتير بتركب الأمواج.
        ar: في كوتا يركب كثيرون الأمواج.
        en: Lots of people surf in Kuta.
  - title: Berkacamata, bertopi
    body:
      ar_eg: |
        ber- + حاجة بتلبسها أو عندك = «لابس / عنده»، زي «أبو نضارة» بالمصري:
        - kacamata → berkacamata = لابس نضارة
        - topi → bertopi = لابس كاب / برنيطة
        - baju → berbaju merah = لابس أحمر
        وبتيجي كتير مع yang عشان تحدد شخص: orang yang berkacamata itu = اللي لابس نضارة ده.
      ar: |
        ber- + ملبوس أو مملوك = «يلبس / ذو»:
        - kacamata → berkacamata = يلبس نظارة
        - topi → bertopi = يلبس قبعة
        - baju → berbaju merah = يلبس الأحمر
        وتكثر مع yang لتعيين شخص: orang yang berkacamata itu = صاحب النظارة ذاك.
      en: |
        ber- + something you wear or have = "wearing / with", like Arabic «ذو» (Egyptians say «أبو نضارة»):
        - kacamata → berkacamata = wearing glasses
        - topi → bertopi = wearing a cap / hat
        - baju → berbaju merah = wearing red
        Often with yang to pick someone out: orang yang berkacamata itu = the person in glasses.
    grammar: id.prefix.ber.meanings
    examples:
      - text: Orang yang berkacamata itu pelatih kami.
        ar_eg: اللي لابس نضارة ده المدرّب بتاعنا.
        ar: صاحب النظارة ذاك مدرّبنا.
        en: The person wearing glasses is our coach.
  - title: Bersuara, bersedih
    body:
      ar_eg: |
        ber- كمان بتعني:
        - بيطلّع / بينتج: suara (صوت) → bersuara = بيطلّع صوت، telur (بيضة) → bertelur = بتبيض.
        - حالة / إحساس: sedih → bersedih = زعلان، gembira → bergembira = فرحان.
        القاعدة الذهبية: ber- + اسم ≈ «صاحب الحاجة دي / معاه الحاجة دي».
      ar: |
        وتفيد ber- أيضًا:
        - الإصدار والإنتاج: suara → bersuara = يُصدر صوتًا، telur → bertelur = تبيض.
        - الحال والشعور: sedih → bersedih = يحزن، gembira → bergembira = يفرح.
        والقاعدة: ber- + اسم ≈ «ذو كذا».
      en: |
        ber- can also mean:
        - Produce: suara (sound) → bersuara = make a sound; telur (egg) → bertelur = lay eggs.
        - Be in a state: sedih → bersedih = be sad; gembira → bergembira = be happy.
        Golden rule: ber- + noun ≈ "having / with that thing".
    grammar: id.prefix.ber.meanings
    examples:
      - text: Jangan bersedih, besok kita main lagi.
        ar_eg: ماتزعلش، بكرة نلعب تاني.
        ar: لا تحزن، سنلعب غدًا مرة أخرى.
        en: Don't be sad, we'll play again tomorrow.
      - text: Anak-anak bergembira di pantai.
        ar_eg: العيال فرحانين على البحر.
        ar: الأطفال فرحون على الشاطئ.
        en: The children are having a happy time on the beach.
  - title: Berdua, bertiga
    body:
      ar_eg: |
        ber- + رقم = «إحنا / هما الـ… مع بعض»:
        - berdua = الاتنين مع بعض
        - bertiga = التلاتة مع بعض
        - berempat = الأربعة
        Kami berdua suka berselancar = إحنا الاتنين بنحب السيرف.
      ar: |
        ber- + عدد = الاجتماع:
        - berdua = اثنان معًا
        - bertiga = ثلاثة معًا
        - berempat = أربعة معًا
        Kami berdua suka berselancar = كلانا يحب ركوب الأمواج.
      en: |
        ber- + number = as a group of:
        - berdua = the two of (us / them), together
        - bertiga = the three of …
        - berempat = the four of …
        Kami berdua suka berselancar = The two of us love surfing.
    grammar: id.prefix.ber.meanings
    examples:
      - text: Kami berdua suka berselancar.
        ar_eg: إحنا الاتنين بنحب ركوب الأمواج.
        ar: كلانا يحب ركوب الأمواج.
        en: The two of us love surfing.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bersepeda
        ar_eg: يركب عجلة
        ar: يركب الدراجة
        en: cycle
      - text: berselancar
        ar_eg: يركب الأمواج
        ar: يركب الأمواج
        en: surf
      - text: berkacamata
        ar_eg: لابس نضارة
        ar: يلبس نظارة
        en: wearing glasses
      - text: bersedih
        ar_eg: زعلان
        ar: حزين
        en: be sad
      - text: berdua
        ar_eg: الاتنين مع بعض
        ar: اثنان معًا
        en: the two of … together
    words: [bersepeda, berselancar, berkacamata, bersedih, berdua]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح بمعنى «أنا بركب العجلة»؟
      ar: أيّ جملة صحيحة بمعنى «أركب الدراجة»؟
      en: Which sentence correctly says "I ride a bike"?
    options: ["Saya naik bersepeda.", "Saya bersepeda.", "Saya sepeda."]
    answer: 1
    explain:
      ar_eg: bersepeda فيها «يركب»، فـ naik زيادة. (Saya naik sepeda صح برضه.)
      ar: bersepeda تتضمن الركوب فلا حاجة إلى naik. (وSaya naik sepeda صحيحة أيضًا.)
      en: bersepeda already means "ride a bike", so naik is extra. (Saya naik sepeda is also fine.)
    words: [bersepeda]
  - id: e03
    type: multiple_choice
    question: Dimas dan Rina pergi ke pantai ___.
    question_meaning:
      ar_eg: ديماس ورينا راحوا البحر هما الاتنين بس.
      ar: ذهب ديماس ورينا إلى الشاطئ وحدهما.
      en: Dimas and Rina go to the beach, just the two of them.
    options: ["bersedih", "bertiga", "berdua"]
    answer: 2
    words: [berdua]
  - id: e04
    type: listen
    text: Kami berdua suka berselancar.
    options: ["Kami berdua suka bersepeda.", "Kami berdua suka berselancar.", "Kami bertiga suka berselancar."]
    answer: 1
    words: [berdua, berselancar]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «لابس كاب»؟
      ar: أيّ كلمة تعني «يلبس قبعة»؟
      en: Which word means "wearing a cap"?
    options: ["bersuara", "bertopi", "berkacamata"]
    answer: 1
    words: [bertopi]
  - id: e06
    type: fill_blank
    sentence: Orang yang ___ itu pelatih kami.
    meaning:
      ar_eg: اللي لابس نضارة ده المدرّب بتاعنا.
      ar: صاحب النظارة ذاك مدرّبنا.
      en: The person wearing glasses is our coach.
    options: ["berkacamata", "bersuara", "bersepeda"]
    answers: [berkacamata]
    words: [berkacamata, pelatih]
  - id: e07
    type: fill_blank
    sentence: Jangan ___, besok kita main lagi.
    meaning:
      ar_eg: ماتزعلش، بكرة نلعب تاني.
      ar: لا تحزن، سنلعب غدًا مرة أخرى.
      en: Don't be sad, we'll play again tomorrow.
    options: ["berdua", "bergembira", "bersedih"]
    answers: [bersedih]
    words: [bersedih]
  - id: e08
    type: fill_blank
    sentence: Ayam itu ___ setiap hari.
    meaning:
      ar_eg: الفرخة دي بتبيض كل يوم.
      ar: تلك الدجاجة تبيض كل يوم.
      en: That hen lays an egg every day.
    options: ["berbaju", "bertelur", "bersepeda"]
    answers: [bertelur]
    explain:
      ar_eg: ber- + telur (بيضة) = بتطلّع بيض.
      ar: ber- + telur = تُنتج البيض.
      en: ber- + telur (egg) = produce eggs.
    words: [bertelur]
  - id: e09
    type: build_sentence
    source:
      ar_eg: كل يوم الصبح بركب العجلة على البحر.
      ar: كل صباح أركب الدراجة على الشاطئ.
      en: Every morning I cycle on the beach.
    answer: Setiap pagi saya bersepeda di pantai.
    alternatives: ["Saya bersepeda di pantai setiap pagi."]
    distractors: [naik, sepeda]
    words: [bersepeda]
  - id: e10
    type: build_sentence
    source:
      ar_eg: اللي لابس أحمر ده بيركب الأمواج.
      ar: ذلك الشخص الذي يلبس الأحمر يركب الأمواج.
      en: The person wearing red is surfing.
    answer: Orang yang berbaju merah itu sedang berselancar.
    distractors: [bertopi, naik]
    words: [berbaju, berselancar]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إحنا الاتنين بنحب ركوب الأمواج.
      ar: كلانا يحب ركوب الأمواج.
      en: The two of us love surfing.
    answers:
      - Kami berdua suka berselancar.
      - Kami berdua suka berselancar
      - Kita berdua suka berselancar.
      - Kita berdua suka berselancar
      - Kami berdua senang berselancar.
      - Kami berdua sangat suka berselancar.
    explain:
      ar_eg: kami لو بتكلّم حد تالت، وkita لو بتكلّم صاحبك اللي معاك.
      ar: kami عند مخاطبة شخص ثالث، وkita عند مخاطبة رفيقك نفسه.
      en: kami when talking to someone else; kita when talking to your partner.
    words: [berdua, berselancar]
  - id: e12
    type: translate
    direction: from_target
    source_text: Anak-anak bergembira di pantai.
    answers_meaning:
      ar_eg: ["العيال فرحانين على البحر.", "الأطفال مبسوطين على الشط"]
      ar: ["الأطفال فرحون على الشاطئ.", "يفرح الأطفال على الشاطئ"]
      en: ["The children are happy on the beach.", "The children are having fun on the beach", "Children are happy at the beach"]
    words: [bergembira]
  - id: e13
    type: dictation
    text: Pelatih kami berkacamata dan bertopi.
    meaning:
      ar_eg: المدرّب بتاعنا لابس نضارة وكاب.
      ar: مدرّبنا يلبس نظارة وقبعة.
      en: Our coach wears glasses and a cap.
    words: [pelatih, berkacamata, bertopi]
  - id: e14
    type: speaking
    text: Setiap sore kami bertiga bersepeda di Kuta.
    meaning:
      ar_eg: كل يوم العصر إحنا التلاتة بنركب العجل في كوتا.
      ar: كل عصر نركب نحن الثلاثة الدراجات في كوتا.
      en: Every afternoon the three of us cycle in Kuta.
    words: [bertiga, bersepeda]
dialogue:
  title: Pantai Kuta
  lines:
    - speaker: Dimas
      text: Mohamed, kamu suka berselancar?
      ar_eg: يا محمد، بتحب ركوب الأمواج؟
      ar: يا محمد، هل تحب ركوب الأمواج؟
      en: Mohamed, do you like surfing?
    - speaker: Mohamed
      text: Belum pernah. Saya biasanya bersepeda.
      ar_eg: عمري ما جربت. أنا عادةً بركب عجلة.
      ar: لم أجرّب قط. عادةً أركب الدراجة.
      en: I've never tried. I usually cycle.
    - speaker: Dimas
      text: Lihat orang yang berkacamata itu. Itu Mas Ardi, pelatih selancar.
      ar_eg: بص على اللي لابس نضارة ده. ده مَس أردي، مدرّب السيرف.
      ar: انظر إلى صاحب النظارة ذاك. إنه ماس أردي، مدرّب ركوب الأمواج.
      en: Look at the man in glasses. That's Mas Ardi, the surf coach.
    - speaker: Mohamed
      text: Yang bertopi merah?
      ar_eg: اللي لابس كاب أحمر؟
      ar: صاحب القبعة الحمراء؟
      en: The one in the red cap?
    - speaker: Dimas
      text: Ya! Besok kita berdua belajar berselancar dengan dia.
      ar_eg: أيوه! بكرة إحنا الاتنين هنتعلّم السيرف معاه.
      ar: نعم! غدًا سنتعلّم نحن الاثنان ركوب الأمواج معه.
      en: Yes! Tomorrow the two of us will learn to surf with him.
    - speaker: Mohamed
      text: Wah, saya senang sekali!
      ar_eg: الله، أنا مبسوط جدًّا!
      ar: رائع، أنا سعيد جدًّا!
      en: Wow, I'm so happy!
