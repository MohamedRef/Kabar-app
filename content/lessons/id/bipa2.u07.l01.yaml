    ar: يركب الأمواج
    en: to surf
  - word: berdua
    pos: adverb
    ar_eg: الاتنين مع بعض
    ar: اثنان معًا
    en: the two together
  - word: bertiga
    pos: adverb
    ar_eg: التلاتة مع بعض
    ar: ثلاثة معًا
    en: the three together
  - word: pelatih
    pos: noun
    ar_eg: مدرّب
    ar: مدرّب
    en: coach, trainer
review:
