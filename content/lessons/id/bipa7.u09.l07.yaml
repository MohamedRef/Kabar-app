schema: kabar.lesson/v1
id: bipa7.u09.l07
language: id
title: Moderasi beragama
can_do:
  ar_eg: تتكلّم عن الوسطية وعن مواجهة التطرّف وعدم التسامح.
  ar: أن تتحدّث عن الاعتدال الديني ومواجهة التطرّف وعدم التسامح.
  en: Talk about religious moderation and countering extremism and intolerance.
slides:
  - title: Jalan tengah
    body:
      ar_eg: |
        moderasi beragama = الاعتدال الديني، برنامج بتشجّعه وزارة الأديان.
        عكسه: intoleransi (عدم التسامح)، radikalisme وekstremisme (التطرّف).
        kemajemukan = تعدّد المجتمع، وإندونيسيا بلد majemuk (متعدّد). pluralisme = قبول التعدّد ده.
        deradikalisasi = برامج بتساعد اللي اتطرّفوا يسيبوا الفكر ده ويرجعوا للمجتمع.
        وSARA (القبيلة والدين والعرق والفئة) موضوعات حسّاسة، والتحريض بيها ممنوع في الإعلام.
        ukhuwah = الأخوّة (من العربي). في نهضة العلما بيتكلّموا عن تلات أنواع: islamiyah وwathaniyah (وطنية) وbasyariyah (إنسانية).
      ar: |
        moderasi beragama = الاعتدال الديني، وهو برنامج ترعاه وزارة الشؤون الدينية.
        ونقيضه: intoleransi (عدم التسامح) وradikalisme وekstremisme (التطرّف).
        kemajemukan = تعدّد المجتمع، وإندونيسيا بلد majemuk (متعدّد). pluralisme = قبول هذا التعدّد.
        deradikalisasi = برامج تساعد المتطرّفين على ترك أفكارهم والعودة إلى المجتمع.
        وSARA (القبيلة والدين والعرق والفئة) قضايا حسّاسة يُحظر التحريض بها في الإعلام.
        ukhuwah = الأخوّة (من العربية)، وتتحدّث نهضة العلماء عن ثلاثة أنواع: islamiyah وwathaniyah (الوطنية) وbasyariyah (الإنسانية).
      en: |
        moderasi beragama = religious moderation, a programme promoted by the Ministry of Religious Affairs.
        Its opposites: intoleransi, radikalisme and ekstremisme.
        kemajemukan = a society's plurality; Indonesia is majemuk (plural). pluralisme = accepting that plurality.
        deradikalisasi = programmes that help radicalised people leave those ideas and rejoin society.
        SARA (ethnicity, religion, race, group) issues are sensitive; inciting over them is banned in the media.
        ukhuwah = brotherhood (from Arabic). Nahdlatul Ulama speaks of three kinds: islamiyah, wathaniyah (national) and basyariyah (human).
    examples:
      - text: Program moderasi beragama diadakan di sekolah dan pesantren.
        ar_eg: برنامج الاعتدال الديني بيتعمل في المدارس والمعاهد الدينية.
        ar: يُقام برنامج الاعتدال الديني في المدارس والمعاهد.
        en: The religious moderation programme runs in schools and pesantren.
      - text: Kemajemukan adalah kekuatan bangsa ini.
        ar_eg: التنوّع هو قوة البلد ده.
        ar: التعدّد قوّة هذه الأمّة.
        en: Plurality is this nation's strength.
      - text: Berita itu tidak boleh memancing isu SARA.
        ar_eg: الخبر ده ما ينفعش يهيّج قضايا الدين والعرق.
        ar: لا يجوز أن يثير الخبر قضايا الدين والعرق.
        en: That news item mustn't stir up SARA issues.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: moderasi beragama
        ar_eg: الاعتدال الديني / الوسطية
        ar: الاعتدال الديني
        en: religious moderation
      - text: intoleransi
        ar_eg: عدم التسامح
        ar: عدم التسامح
        en: intolerance
      - text: radikalisme
        ar_eg: التطرّف الفكري / الراديكالية
        ar: الراديكالية
        en: radicalism
      - text: ekstremisme
        ar_eg: التطرّف
        ar: التطرّف
        en: extremism
    words: [moderasi beragama, intoleransi, radikalisme, ekstremisme]
  - id: e02
    type: match_pairs
    pairs:
      - text: pluralisme
        ar_eg: التعدّدية
        ar: التعدّدية
        en: pluralism
      - text: kemajemukan
        ar_eg: التنوّع / تعدّد المجتمع
        ar: التعدّد، تنوّع المجتمع
        en: diversity, plurality
      - text: deradikalisasi
        ar_eg: برامج نزع التطرّف
        ar: نزع التطرّف
        en: deradicalisation
      - text: ukhuwah
        ar_eg: أخوّة
        ar: أخوّة
        en: brotherhood
    words: [pluralisme, kemajemukan, deradikalisasi, ukhuwah]
  - id: e03
    type: listen
    text: Ukhuwah tidak hanya untuk sesama Muslim, tetapi juga sesama manusia.
    question:
      ar_eg: إيه اللي مش بس للمسلمين؟
      ar: ما الذي ليس للمسلمين وحدهم؟
      en: What isn't only for Muslims?
    options: [الأخوّة, التطرّف, التعدّدية]
    answer: 0
    meaning:
      ar_eg: الأخوّة مش بس بين المسلمين، كمان بين كل البشر.
      ar: ليست الأخوّة بين المسلمين وحدهم بل بين البشر جميعًا.
      en: Brotherhood isn't only among Muslims but among all people.
    words: [ukhuwah]
  - id: e04
    type: fill_blank
    sentence: Melarang tetangga beribadah adalah contoh ___.
    meaning:
      ar_eg: إنك تمنع جارك يصلّي ده مثال على ___.
      ar: منع الجار من العبادة مثال على ___.
      en: Stopping a neighbour from worshipping is an example of ___.
    options: [intoleransi, pluralisme, moderasi beragama]
    answers: [intoleransi]
    words: [intoleransi, pluralisme, moderasi beragama]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «deradikalisasi» يعني إيه؟
      ar: ما «deradikalisasi»؟
      en: What is 'deradikalisasi'?
    options: [Nama sebuah partai., Program untuk membantu orang meninggalkan paham radikal., Program pemerintah tentang ekonomi.]
    answer: 1
    explain:
      ar_eg: نزع التطرّف = مساعدة الناس يسيبوا الفكر المتطرّف.
      ar: نزع التطرّف = مساعدة الناس على ترك الفكر المتطرّف.
      en: Deradicalisation = helping people leave radical ideas.
    words: [deradikalisasi]
  - id: e06
    type: fill_blank
    sentence: Indonesia adalah negara dengan ___ yang luar biasa.
    meaning:
      ar_eg: إندونيسيا بلد فيه ___ مذهل.
      ar: إندونيسيا بلد ذو ___ مذهل.
      en: Indonesia is a country of extraordinary ___.
    options: [kemajemukan, radikalisme, ukhuwah]
    answers: [kemajemukan]
    words: [kemajemukan, radikalisme, ukhuwah]
  - id: e07
    type: build_sentence
    source:
      ar_eg: التطرّف ممكن ينتشر على الإنترنت.
      ar: قد ينتشر التطرّف عبر الإنترنت.
      en: Extremism can spread online.
    answer: Ekstremisme bisa menyebar lewat internet.
    distractors: [pluralisme, SARA]
    words: [ekstremisme]
  - id: e08
    type: translate
    direction: from_target
    source_text: Radikalisme sering tumbuh dari rasa tidak adil, jadi deradikalisasi juga harus adil.
    answers_meaning:
      ar_eg: [التطرّف كتير بيطلع من الإحساس بالظلم، فنزع التطرّف لازم يكون عادل كمان, الراديكالية غالبًا بتكبر من الإحساس بالظلم، علشان كده برامج نزع التطرّف لازم تبقى عادلة]
      ar: [كثيرًا ما تنمو الراديكالية من الشعور بالظلم، فيجب أن يكون نزع التطرّف عادلًا أيضًا, تنشأ الراديكالية غالبًا من الإحساس بالظلم، لذا ينبغي أن تكون برامج نزع التطرّف عادلة]
      en: ['Radicalism often grows from a sense of injustice, so deradicalisation must be fair too', 'Radicalism frequently springs from unfairness, so deradicalisation has to be just as well']
    words: [radikalisme, deradikalisasi]
  - id: e09
    type: speaking
    text: Moderasi beragama dan pluralisme menjaga persatuan.
    meaning:
      ar_eg: الاعتدال الديني والتعدّدية بيحافظوا على الوحدة.
      ar: يحفظ الاعتدال الديني والتعدّدية الوحدة.
      en: Religious moderation and pluralism keep the nation united.
    words: [moderasi beragama, pluralisme]
  - id: e10
    type: multiple_choice
    question: Mana sikap yang sesuai dengan moderasi beragama?
    options: [Menolak semua orang yang berbeda., Menyebar isu SARA., Kuat dalam iman dan menghormati keyakinan orang lain.]
    answer: 2
    explain:
      ar_eg: الوسطية = إيمان قوي واحترام للآخرين.
      ar: الاعتدال = إيمان راسخ واحترام لمعتقدات الآخرين.
      en: Moderation = firm faith and respect for others' beliefs.
    words: [moderasi beragama, intoleransi, ekstremisme, radikalisme, kemajemukan, ukhuwah]
dialogue:
  lines:
    - speaker: Pak Daeng
      text: Mohamed, minggu depan ada pelatihan moderasi beragama untuk guru.
      ar_eg: يا محمد، الأسبوع الجاي فيه تدريب على الاعتدال الديني للمدرّسين.
      ar: يا محمد، هناك تدريب على الاعتدال الديني للمعلّمين الأسبوع المقبل.
      en: Mohamed, there's religious moderation training for teachers next week.
    - speaker: Mohamed
      text: Apa yang dibahas, Pak?
      ar_eg: هيتكلّموا عن إيه يا أستاذ؟
      ar: عمّ سيتحدّثون يا أستاذ؟
      en: What will it cover, sir?
    - speaker: Pak Daeng
      text: Cara mengenali radikalisme di media sosial dan cara mencegah intoleransi.
      ar_eg: إزاي نعرف التطرّف على السوشيال ميديا وإزاي نمنع عدم التسامح.
      ar: كيف نتعرّف على الراديكالية في وسائل التواصل وكيف نمنع عدم التسامح.
      en: How to spot radicalism on social media and how to prevent intolerance.
    - speaker: Mohamed
      text: Di Al-Azhar juga sering dibicarakan wasatiyah, jalan tengah.
      ar_eg: في الأزهر كمان بيتكلّموا كتير عن الوسطية.
      ar: وفي الأزهر يكثر الحديث عن الوسطية.
      en: At Al-Azhar they often talk about wasatiyya, the middle way, too.
    - speaker: Pak Daeng
      text: Bagus. Kamu bisa cerita tentang ukhuwah dari pengalamanmu.
      ar_eg: حلو. ممكن تحكي عن الأخوّة من تجربتك.
      ar: جميل، يمكنك أن تحدّثهم عن الأخوّة من تجربتك.
      en: Good. You can talk about brotherhood from your own experience.
