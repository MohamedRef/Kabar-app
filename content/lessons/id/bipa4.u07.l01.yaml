schema: kabar.lesson/v1
id: bipa4.u07.l01
language: id
title: Pemeriksaan kesehatan
can_do:
  ar_eg: تعمل أسماء «العملية» بـ peN-…-an (فحص، علاج، وقاية) وتتكلم عن كشف دوري.
  ar: أن تصوغ أسماء العملية بـ peN-…-an (فحص، علاج، وقاية) وتتحدث عن الفحص الدوري.
  en: Form process nouns with peN-…-an and talk about a routine check-up.
slides:
  - title: Memeriksa → pemeriksaan
    body:
      ar_eg: |
        peN-…-an بيعمل اسم «العملية» من فعل meN-. القاعدة السهلة: خد فعل meN-، غيّر me لـ pe، وزوّد -an:
        memeriksa (يفحص) → pemeriksaan (فحص)
        mengobati (يعالج) → pengobatan (علاج)
        mencegah (يمنع / يقي) → pencegahan (وقاية)
        نفس الأنف (m / n / ng / ny) اللي في الفعل بيفضل في الاسم.
      ar: |
        تصوغ peN-…-an اسم العملية من فعل meN-. القاعدة: خذ فعل meN-، واستبدل pe بـ me، وأضف -an:
        memeriksa (يفحص) → pemeriksaan (فحص)
        mengobati (يعالج) → pengobatan (علاج)
        mencegah (يقي) → pencegahan (وقاية)
        ويبقى الصوت الأنفي (m / n / ng / ny) نفسه الذي في الفعل.
      en: |
        peN-…-an makes the "process" noun of a meN- verb. Easy rule: take the meN- verb, change me to pe, add -an:
        memeriksa (examine) → pemeriksaan (examination, check-up)
        mengobati (treat) → pengobatan (treatment)
        mencegah (prevent) → pencegahan (prevention)
        The nasal (m / n / ng / ny) of the verb stays in the noun.
    grammar: id.confix.peng-an
    examples:
      - text: Pencegahan lebih baik daripada pengobatan.
        ar_eg: الوقاية أحسن من العلاج.
        ar: الوقاية خير من العلاج.
        en: Prevention is better than cure.
      - text: Pemeriksaan kesehatan sebaiknya dilakukan setiap tahun.
        ar_eg: الأحسن الكشف الطبي يتعمل كل سنة.
        ar: يُستحسن إجراء الفحص الطبي كل عام.
        en: A health check-up should be done every year.
  - title: Kesehatan dan tekanan darah
    body:
      ar_eg: |
        sehat جاية من العربي «صحة»، وkesehatan = الصحة (اسم).
        tekan = يضغط → tekanan = ضغط، وtekanan darah = ضغط الدم.
        rutin = دوري / بانتظام: pemeriksaan rutin = كشف دوري.
      ar: |
        sehat مأخوذة من العربية «صحة»، وkesehatan = الصحة.
        tekan = يضغط → tekanan = ضغط، وtekanan darah = ضغط الدم.
        rutin = دوري: pemeriksaan rutin = فحص دوري.
      en: |
        sehat comes from Arabic «صحة»; kesehatan = health.
        tekan = press → tekanan = pressure; tekanan darah = blood pressure.
        rutin = routine, regular: pemeriksaan rutin = routine check-up.
    grammar: id.confix.peng-an
    examples:
      - text: Dokter memeriksa tekanan darah saya secara rutin.
        ar_eg: الدكتور بيقيس ضغطي بانتظام.
        ar: يفحص الطبيب ضغط دمي بانتظام.
        en: The doctor checks my blood pressure regularly.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pemeriksaan
        ar_eg: فحص / كشف
        ar: فحص
        en: examination, check-up
      - text: pengobatan
        ar_eg: علاج
        ar: علاج
        en: treatment
      - text: pencegahan
        ar_eg: وقاية
        ar: وقاية
        en: prevention
      - text: tekanan darah
        ar_eg: ضغط الدم
        ar: ضغط الدم
        en: blood pressure
      - text: rutin
        ar_eg: دوري / بانتظام
        ar: دوري، منتظم
        en: routine, regular
    words: [pemeriksaan, pengobatan, pencegahan, tekanan darah, rutin]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اسم peN-…-an من mencegah؟
      ar: ما اسم peN-…-an من mencegah؟
      en: What is the peN-…-an noun of mencegah?
    options: [pengcegahan, pecegahan, pencegahan]
    answer: 2
    explain:
      ar_eg: mencegah فيها men-، يبقى الاسم pen-…-an = pencegahan.
      ar: في mencegah البادئة men-، فيكون الاسم pen-…-an أي pencegahan.
      en: mencegah has men-, so the noun has pen-…-an = pencegahan.
    words: [pencegahan]
  - id: e03
    type: listen
    text: Pemeriksaan kesehatan dilakukan setiap tahun.
    options: ["Pemeriksaan kesehatan dilakukan setiap bulan.", "Pemeriksaan kesehatan dilakukan setiap tahun.", "Pengobatan dilakukan setiap tahun."]
    answer: 1
    meaning:
      ar_eg: الكشف الطبي بيتعمل كل سنة.
      ar: يُجرى الفحص الطبي كل عام.
      en: The health check-up is done every year.
    words: [pemeriksaan, kesehatan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «علاج»؟
      ar: أيّ كلمة تعني «علاج»؟
      en: Which word means "treatment"?
    options: [pengobatan, pemeriksaan, pencegahan]
    answer: 0
    words: [pengobatan]
  - id: e05
    type: fill_blank
    sentence: Dokter memeriksa ___ darah saya.
    meaning:
      ar_eg: الدكتور بيقيس ضغط دمي.
      ar: يفحص الطبيب ضغط دمي.
      en: The doctor checks my blood pressure.
    options: [pencegahan, tekanan, rutin]
    answers: [tekanan]
    words: [tekanan darah]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الوقاية أحسن من العلاج.
      ar: الوقاية خير من العلاج.
      en: Prevention is better than cure.
    answer: Pencegahan lebih baik daripada pengobatan.
    distractors: [pemeriksaan, paling]
    words: [pencegahan, pengobatan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا بعمل كشف طبي دوري كل سنة.
      ar: أُجري فحصًا طبيًا دوريًا كل عام.
      en: I have a routine health check-up every year.
    answers:
      - Saya melakukan pemeriksaan kesehatan rutin setiap tahun.
      - Saya melakukan pemeriksaan kesehatan rutin setiap tahun
      - Saya menjalani pemeriksaan kesehatan rutin setiap tahun.
      - Setiap tahun saya melakukan pemeriksaan kesehatan rutin.
      - Saya melakukan pemeriksaan kesehatan secara rutin setiap tahun.
      - Saya melakukan pemeriksaan kesehatan rutin tiap tahun.
    words: [pemeriksaan, kesehatan, rutin, melakukan]
  - id: e08
    type: speaking
    text: Kesehatan itu penting, jadi saya memeriksa tekanan darah secara rutin.
    meaning:
      ar_eg: الصحة مهمة، عشان كده بقيس ضغطي بانتظام.
      ar: الصحة مهمة، لذلك أفحص ضغط دمي بانتظام.
      en: Health matters, so I check my blood pressure regularly.
    words: [kesehatan, tekanan darah, rutin]
  - id: e09
    type: multiple_choice
    question: Dokter melakukan pemeriksaan kesehatan.
    question_meaning:
      ar_eg: الدكتور عمل إيه؟
      ar: ماذا فعل الطبيب؟
      en: What did the doctor do?
    options: ['Memeriksa pasien.', 'Memasak.', 'Membeli obat.']
    answer: 0
    explain:
      ar_eg: melakukan = يعمل / يقوم بـ.
      ar: melakukan = يقوم بـ.
      en: melakukan = do, carry out.
    words: [melakukan, pemeriksaan]
  - id: e10
    type: fill_blank
    sentence: Saya ___ olahraga setiap pagi.
    meaning:
      ar_eg: أنا بعمل رياضة كل يوم الصبح.
      ar: أمارس الرياضة كل صباح.
      en: I do exercise every morning.
    options: [melakukan, pencegahan, rutin]
    answers: [melakukan]
    words: [melakukan]
dialogue:
  title: Di klinik Gorontalo
  lines:
    - speaker: Dokter Fitri
      text: Selamat pagi, Pak. Mau pemeriksaan rutin?
      ar_eg: صباح الخير يا أستاذ. جاي تعمل كشف دوري؟
      ar: صباح الخير يا سيدي. هل جئت لفحص دوري؟
      en: Good morning, sir. Here for a routine check-up?
    - speaker: Mohamed
      text: Ya, Dok. Saya ingin memeriksa tekanan darah saya.
      ar_eg: أيوه يا دكتورة. عايز أقيس ضغطي.
      ar: نعم يا دكتورة. أريد أن أفحص ضغط دمي.
      en: Yes, Doctor. I'd like to check my blood pressure.
    - speaker: Dokter Fitri
      text: Bagus. Pencegahan lebih baik daripada pengobatan.
      ar_eg: كويس. الوقاية أحسن من العلاج.
      ar: جيد. الوقاية خير من العلاج.
      en: Good. Prevention is better than cure.
    - speaker: Mohamed
      text: Betul, Dok. Kesehatan itu mahal harganya.
      ar_eg: مظبوط يا دكتورة. الصحة تمنها غالي.
      ar: صحيح يا دكتورة. الصحة ثمنها غالٍ.
      en: That's right, Doctor. Health is priceless.
