schema: kabar.lesson/v1
id: bipa5.u04.l08
language: id
title: Esai beasiswa
can_do:
  ar_eg: تكتب جواب دوافع لمنحة دراسية بأسلوب رسمي ومقنع.
  ar: أن تكتب خطاب دوافع لمنحة دراسية بأسلوب رسمي مقنع.
  en: Write a formal, convincing motivation letter for a scholarship.
slides:
  - title: Surat motivasi
    body:
      ar_eg: |
        أغلب المنح بتطلب surat motivasi (جواب الدوافع). رتبه كده:
        ١. أنت مين وبتدرس إيه.
        ٢. ليه البلد دي والتخصص ده (agar / supaya …).
        ٣. هتعمل إيه بعدين: berkontribusi bagi … = تساهم في …
        وخليك متواضع وواضح، من غير «pokoknya» ولا «dong».
      ar: |
        تطلب معظم المنح surat motivasi (خطاب الدوافع). رتّبه هكذا:
        ١. من أنت وماذا تدرس.
        ٢. لماذا هذا البلد وهذا التخصّص (agar / supaya …).
        ٣. ماذا ستفعل بعد ذلك: berkontribusi bagi … = تُسهم في …
        وكن متواضعًا واضحًا، دون «pokoknya» أو «dong».
      en: |
        Most scholarships ask for a surat motivasi (motivation letter). Order it like this:
        1. Who you are and what you study.
        2. Why this country and this field (agar / supaya …).
        3. What you'll do afterwards: berkontribusi bagi … = contribute to …
        Stay modest and clear, with no «pokoknya» or «dong».
exercises:
  - id: e01
    type: listen
    text: Dalam surat motivasi, jelaskan mengapa Anda memilih jurusan ini.
    question:
      ar_eg: جواب الدوافع لازم يشرح إيه؟
      ar: ماذا يجب أن يشرح خطاب الدوافع؟
      en: What must the motivation letter explain?
    options:
      - ليه اخترت التخصص ده.
      - عنوان بيتك.
      - مرتب والدك.
    answer: 0
    words: [surat motivasi, jurusan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «berkontribusi» معناها إيه؟
      ar: ما معنى «berkontribusi»؟
      en: What does "berkontribusi" mean?
    options:
      - يستلف.
      - يساهم.
      - يسافر.
    answer: 1
    words: [berkontribusi]
  - id: e03
    type: fill_blank
    sentence: Setelah lulus, saya ingin ___ bagi pendidikan di Mesir.
    meaning:
      ar_eg: بعد التخرج عايز أساهم في التعليم في مصر.
      ar: بعد التخرّج أريد أن أُسهم في التعليم بمصر.
      en: After graduating, I want to contribute to education in Egypt.
    options: [berkontribusi, beradaptasi, mengatakan]
    answers: [berkontribusi]
    words: [berkontribusi]
  - id: e04
    type: build_sentence
    source:
      ar_eg: عايز أدرس في إندونيسيا عشان أبقى مترجم أحسن.
      ar: أريد الدراسة في إندونيسيا لأصبح مترجمًا أفضل.
      en: I want to study in Indonesia so that I become a better translator.
    answer: Saya ingin belajar di Indonesia agar menjadi penerjemah yang lebih baik.
    distractors: [beasiswa, asrama]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عايز أقدّم على منحة دارماسيسوا.
      ar: أريد التقدّم لمنحة دارماسيسوا.
      en: I want to apply for the Darmasiswa scholarship.
    answers:
      - Saya ingin mendaftar beasiswa Darmasiswa.
      - Saya ingin melamar beasiswa Darmasiswa.
      - Saya mau mendaftar beasiswa Darmasiswa.
      - Saya ingin mendaftar untuk beasiswa Darmasiswa.
    words: [beasiswa]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة تنفع في جواب دوافع؟
      ar: أيّ جملة تصلح لخطاب دوافع؟
      en: Which sentence belongs in a motivation letter?
    options:
      - Saya butuh uang, jadi kasih beasiswa dong.
      - Pokoknya saya pasti lulus.
      - Saya ingin memperdalam bahasa Indonesia agar dapat berkontribusi bagi hubungan Mesir dan Indonesia.
    answer: 2
    explain:
      ar_eg: الجملة التالتة رسمية وفيها هدف واضح. dong وpokoknya عامية ومش مقنعة.
      ar: الجملة الثالثة رسمية ذات هدف واضح، أمّا dong وpokoknya فعاميّتان غير مقنعتين.
      en: The third is formal with a clear goal; dong and pokoknya are casual and unconvincing.
    words: [berkontribusi, surat motivasi]
  - id: e07
    type: speaking
    text: Saya sudah menulis surat motivasi dan melampirkan ijazah saya.
    meaning:
      ar_eg: كتبت جواب الدوافع ورفقت شهادتي.
      ar: كتبتُ خطاب الدوافع وأرفقتُ شهادتي.
      en: I've written my motivation letter and attached my diploma.
    words: [surat motivasi]
  - id: e08
    type: dictation
    text: Batas akhir pendaftaran beasiswa adalah tanggal 31 Januari.
    meaning:
      ar_eg: آخر ميعاد للتقديم على المنحة ٣١ يناير.
      ar: الموعد النهائي للتسجيل في المنحة ٣١ يناير.
      en: The scholarship registration deadline is 31 January.
    words: [batas akhir, pendaftaran, beasiswa]
  - id: e09
    type: match_pairs
    pairs:
      - text: mahasiswa asing
        ar_eg: طالب أجنبي
        ar: طالب أجنبي
        en: foreign student
      - text: biaya hidup
        ar_eg: مصاريف المعيشة
        ar: تكاليف المعيشة
        en: cost of living
      - text: alumni
        ar_eg: خريجين
        ar: خرّيجون
        en: alumni
      - text: menyarankan
        ar_eg: ينصح / يقترح
        ar: ينصح، يقترح
        en: to suggest
      - text: persamaan
        ar_eg: أوجه الشبه
        ar: أوجه الشبه
        en: similarity
    words: [mahasiswa asing, biaya hidup, alumni, menyarankan, persamaan]
  - id: e10
    type: fill_blank
    sentence: Ustaz Hasan ___ agar saya menulis surat motivasi yang jujur.
    meaning:
      ar_eg: الأستاذ حسن نصحني أكتب جواب دوافع صادق.
      ar: نصحني الأستاذ حسن بأن أكتب خطاب دوافع صادقًا.
      en: Ustaz Hasan suggested I write an honest motivation letter.
    options: [menyarankan, berkontribusi, bertanya]
    answers: [menyarankan]
    words: [menyarankan, surat motivasi]
dialogue:
  title: Draf untuk Ustaz Hasan
  lines:
    - speaker: Mohamed
      text: Ustaz, ini draf surat motivasi saya untuk beasiswa Darmasiswa.
      ar_eg: يا أستاذ، دي المسودة بتاعة جواب الدوافع للمنحة.
      ar: يا أستاذ، هذه مسوّدة خطاب الدوافع لمنحة دارماسيسوا.
      en: Ustaz, here's my draft motivation letter for the Darmasiswa scholarship.
    - speaker: Ustaz Hasan
      text: Bagus. Tapi Anda belum menjelaskan apa yang akan Anda lakukan setelah lulus.
      ar_eg: كويس. بس لسه ماشرحتش هتعمل إيه بعد التخرج.
      ar: جيّد، لكنك لم تشرح بعدُ ما ستفعله بعد التخرّج.
      en: Good. But you haven't explained what you'll do after graduating.
    - speaker: Mohamed
      text: Saya ingin berkontribusi bagi hubungan Mesir dan Indonesia sebagai penerjemah.
      ar_eg: عايز أساهم في العلاقة بين مصر وإندونيسيا كمترجم.
      ar: أريد أن أُسهم في العلاقات بين مصر وإندونيسيا مترجمًا.
      en: I want to contribute to Egypt–Indonesia relations as a translator.
    - speaker: Ustaz Hasan
      text: Nah, tulis kalimat itu. Saya sarankan juga Anda menyebut pengalaman Anda di kedutaan.
      ar_eg: أهو، اكتب الجملة دي. وأنصحك كمان تذكر خبرتك في السفارة.
      ar: هكذا، اكتب هذه الجملة. وأنصحك أيضًا بذكر خبرتك في السفارة.
      en: There, write that sentence. I'd also suggest you mention your embassy experience.
    - speaker: Mohamed
      text: Terima kasih, Ustaz. Batas akhirnya minggu depan, jadi saya perbaiki malam ini.
      ar_eg: شكرًا يا أستاذ. آخر ميعاد الأسبوع الجاي، فهصلحها النهارده بالليل.
      ar: شكرًا يا أستاذ. الموعد النهائي الأسبوع المقبل، فسأصحّحه الليلة.
      en: Thank you, Ustaz. The deadline is next week, so I'll fix it tonight.
