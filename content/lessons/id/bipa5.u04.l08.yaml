        ar: رسوم (bea cukai = جمارك)
        en: duty (bea cukai = customs)
      - text: karantina
        ar_eg: حجر صحي
        ar: حجر صحي
        en: quarantine
      - text: reuni
        ar_eg: لمّة القدامى
        ar: لقاء القدامى
        en: reunion
    words: [kedutaan, bea, karantina, reuni]
  - id: e02
    type: match_pairs
    pairs:
      - text: kangen
        ar_eg: مشتاق، وحشني
        ar: مشتاق
        en: to miss
      - text: betah
        ar_eg: مرتاح في المكان
        ar: مرتاح في المكان
        en: to feel at home
      - text: pertimbangan
        ar_eg: تفكير، اعتبار
        ar: اعتبار
        en: consideration
      - text: beragama
        ar_eg: متدين، ليه دين
        ar: يعتنق دينًا
        en: religious
    words: [kangen, betah, pertimbangan, beragama]
  - id: e03
    type: listen
    text: Kurma ini harus diperiksa di bea cukai.
    question:
      ar_eg: هيتفتش فين؟
      ar: أين سيُفتَّش؟
      en: Where will it be checked?
    options: [الجمارك, المطعم, السفارة]
    answer: 0
    meaning:
      ar_eg: البلح ده لازم يتفتش في الجمارك.
      ar: يجب تفتيش هذا التمر في الجمارك.
      en: These dates must be checked at customs.
    words: [bea]
  - id: e04
    type: fill_blank
    sentence: Sebelum masuk negara itu, kucing kami harus ___ dua minggu.
    meaning:
      ar_eg: قبل ما ندخل البلد دي، القطة بتاعتنا لازم تقعد في ___ أسبوعين.
      ar: قبل دخول ذلك البلد يجب أن تخضع قطّتنا لـ___ أسبوعين.
      en: Before entering that country, our cat has to be in ___ for two weeks.
    options: [karantina, kedutaan, reuni]
    answers: [karantina]
    words: [karantina, kedutaan, reuni]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: سافرت بعيد وماما وحشتك أوي. تقول إيه؟
      ar: سافرت بعيدًا واشتقت إلى أمك. ماذا تقول؟
      en: You've travelled far and miss your mum. What do you say?
    options: [Saya betah ibu., Saya kangen ibu., Saya beragama ibu.]
    answer: 1
    explain:
      ar_eg: kangen = وحشني، مشتاق.
      ar: kangen = مشتاق.
      en: kangen = to miss someone.
    words: [betah, kangen, beragama]
  - id: e06
    type: fill_blank
    sentence: Tiga tahun lalu kami lulus. Bulan depan ada ___ di Kairo.
    meaning:
      ar_eg: اتخرجنا من تلات سنين. الشهر الجاي فيه ___ في القاهرة.
      ar: تخرّجنا قبل ثلاث سنوات. الشهر القادم هناك ___ في القاهرة.
      en: We graduated three years ago. Next month there's a ___ in Cairo.
    options: [reuni, bea, pertimbangan]
    answers: [reuni]
    words: [reuni, bea, pertimbangan]
  - id: e07
    type: multiple_choice
    question: Indonesia adalah negara yang penduduknya ___ dan beragam.
    options: [kangen, karantina, beragama]
    answer: 2
    explain:
      ar_eg: beragama = متدين، ليه دين.
      ar: beragama = متديّن.
      en: beragama = religious.
    words: [kangen, karantina, beragama]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا مرتاح في القاهرة، بس البيت واحشني.
      ar: أنا مرتاح في القاهرة، لكني أشتاق إلى البيت.
      en: I feel at home in Cairo, but I miss home.
    answer: Saya betah di Kairo, tapi kangen rumah.
    distractors: [kedutaan, reuni]
    words: [betah, kangen]
  - id: e09
    type: translate
    direction: from_target
    source_text: Setelah banyak pertimbangan, saya memilih kuliah di Kairo.
    answers_meaning:
      ar_eg: [بعد تفكير كتير، اخترت أدرس في القاهرة, بعد ما فكرت كتير، قررت أدرس في القاهرة]
      ar: [بعد تفكير طويل اخترت الدراسة في القاهرة, بعد اعتبارات كثيرة اخترت الدراسة في القاهرة]
      en: ['After much thought, I chose to study in Cairo', 'After a lot of consideration, I decided to study in Cairo']
    words: [pertimbangan]
  - id: e10
    type: speaking
    text: Visa dari kedutaan sudah ada, tinggal urusan bea cukai.
    meaning:
      ar_eg: الفيزا من السفارة جاهزة، فاضل الجمارك.
      ar: التأشيرة من السفارة جاهزة، وبقيت الجمارك.
      en: The visa's sorted; only customs is left.
    words: [visa, kedutaan, bea]
dialogue:
  lines:
    - speaker: Ustaz Hasan
      text: Pak Mohamed, tiga santri kami akan kuliah di Al-Azhar tahun ini.
      ar_eg: يا أستاذ محمد، تلاتة من طلبتنا هيدرسوا في الأزهر السنة دي.
      ar: يا أستاذ محمد، سيدرس ثلاثة من طلابنا في الأزهر هذا العام.
      en: Mohamed, three of our students will study at Al-Azhar this year.
    - speaker: Mohamed
      text: Masya Allah! Visanya sudah keluar?
      ar_eg: ما شاء الله! الفيزا طلعت؟
      ar: ما شاء الله! هل صدرت التأشيرات؟
      en: Masha'Allah! Have their visas come through?
    - speaker: Ustaz Hasan
      text: Sudah. Mereka cuma khawatir soal bea cukai dan karantina obat.
      ar_eg: أيوه. هم بس قلقانين من الجمارك والحجر على الأدوية.
      ar: نعم. يقلقهم فقط أمر الجمارك والحجر على الأدوية.
      en: Yes. They're only worried about customs and medicine quarantine rules.
    - speaker: Mohamed
      text: 'Itu mudah. Yang sulit biasanya bulan pertama: mereka pasti kangen rumah.'
      ar_eg: 'دي سهلة. الصعب عادة أول شهر: أكيد البيت هيوحشهم.'
      ar: 'هذا سهل. الصعب عادة الشهر الأول: سيشتاقون إلى البيت حتمًا.'
      en: 'That''s easy. The hard part is usually the first month: they''ll be homesick.'
    - speaker: Ustaz Hasan
      text: Tapi alumni kami bilang, setelah itu mereka betah. Banyak yang ikut reuni di Kairo!
      ar_eg: بس خريجينا بيقولوا إنهم بعد كده بيرتاحوا. وكتير منهم بيحضروا اللمّة في القاهرة!
      ar: لكن خرّيجينا يقولون إنهم يرتاحون بعد ذلك. وكثيرون يحضرون لقاء الخرّيجين في القاهرة!
      en: But our alumni say they settle in after that. Many go to the reunion in Cairo!
