schema: kabar.lesson/v1
id: bipa5.u04.l08
language: id
title: Sebelum berangkat ke Kairo
can_do:
  ar_eg: 'تتكلم عن السفر للدراسة بره: الفيزا والجمارك والحجر الصحي، الحنين والتأقلم، والعزومات واللمّات، والدين.'
  ar: 'أن تتحدث عن السفر للدراسة في الخارج: التأشيرة والجمارك والحجر الصحي، والحنين والتأقلم، ولقاءات الخرّيجين، والدين.'
  en: 'Talk about leaving to study abroad: visa, customs and quarantine, homesickness and settling in, reunions, and religion.'
slides:
  - title: Kuliah di luar negeri
    body:
      ar_eg: |
        visa = فيزا (بتطلع من kedutaan = السفارة)، bea cukai = الجمارك (bea = رسوم)، karantina = حجر صحي.
        kangen = مشتاق، وحشني (غير رسمي، الرسمي rindu): Saya kangen ibu.
        betah = مرتاح في مكان ومش عايز تمشي: Saya betah di Kairo.
        reuni = لمّة قدامى (reuni alumni)، pertimbangan = اعتبار، تفكير قبل القرار، beragama = متدين، ليه دين.
      ar: |
        visa = تأشيرة (تصدرها kedutaan = السفارة)، bea cukai = الجمارك (bea = رسوم)، karantina = حجر صحي.
        kangen = مشتاق (غير رسمية، والرسمية rindu): Saya kangen ibu.
        betah = مرتاح في مكان لا يريد مغادرته: Saya betah di Kairo.
        reuni = لقاء القدامى (reuni alumni)، pertimbangan = اعتبار، تروٍّ، beragama = متديّن، يعتنق دينًا.
      en: |
        visa = visa (from the kedutaan = embassy), bea cukai = customs (bea = duty, fee), karantina = quarantine.
        kangen = to miss someone, homesick (informal; formal: rindu): Saya kangen ibu.
        betah = to feel at home, happy to stay: Saya betah di Kairo.
        reuni = reunion (reuni alumni), pertimbangan = consideration, beragama = religious, to have a religion.
    examples:
      - text: Visa pelajar saya sudah keluar minggu lalu.
        ar_eg: فيزا الدراسة بتاعتي طلعت الأسبوع اللي فات.
        ar: صدرت تأشيرتي الدراسية الأسبوع الماضي.
        en: My student visa came through last week.
      - text: Bulan pertama saya kangen rumah, tapi sekarang saya betah.
        ar_eg: أول شهر كان البيت وحشني، بس دلوقتي أنا مرتاح.
        ar: في الشهر الأول اشتقت إلى البيت، لكني الآن مرتاح.
        en: The first month I was homesick, but now I feel at home.
      - text: Setelah banyak pertimbangan, dia memilih Al-Azhar.
        ar_eg: بعد تفكير كتير، اختار الأزهر.
        ar: بعد تفكير طويل اختار الأزهر.
        en: After much thought, he chose Al-Azhar.
exercises:
  - id: e01
    type: match_pairs
    pairs:
