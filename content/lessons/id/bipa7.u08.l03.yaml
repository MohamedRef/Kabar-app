language: id
title: UMKM
can_do:
  ar_eg: تقرا عن المشاريع الصغيرة وإزاي بتبدأ وبتكبر.
  ar: أن تقرأ عن المشاريع الصغيرة وكيف تبدأ وتنمو.
  en: Read about small businesses and how they start and grow.
slides:
  - title: Noken Kaka Benny
    body:
      ar_eg: |
        الـ UMKM (المشاريع الصغيرة والمتوسطة) هي عمود الاقتصاد الإندونيسي، وعلى حسب أرقام حكومية بتتقال كتير، بتشغّل أغلب العمّال.
        حكاية متألّفة للدرس: كاكا بيني بيبيع شنط الـ noken، شنطة بابوا المعمولة بالإيد.
        - بدأ بـ modal (رأس مال) صغير من مدّخراته.
        - خد pinjaman (قرض) صغير من البنك.
        - عمل pemasaran daring (تسويق أونلاين) على إنستجرام.
        - Oleh sebab itu، الـ omzet (المبيعات/حجم الشغل) بتاعه زاد الضعف.
        معلومة: الـ noken متسجّل في قائمة اليونسكو للتراث الثقافي غير المادي من 2012.
        - في الكلام: aja = saja، terus = lalu.
      ar: |
        الـ UMKM (المشاريع الصغرى والمتوسّطة) عماد الاقتصاد الإندونيسي، ويعمل فيها أغلب العمّال بحسب أرقام حكومية كثيرًا ما تُذكر.
        قصّة مؤلَّفة للدرس: يبيع كاكا بيني حقائب الـ noken، حقيبة بابوا المنسوجة يدويًّا.
        - بدأ بـ modal (رأس مال) صغير من مدّخراته.
        - أخذ pinjaman (قرضًا) صغيرًا من المصرف.
        - اعتمد pemasaran daring (التسويق الإلكتروني) على إنستغرام.
        - Oleh sebab itu، تضاعف omzet (رقم أعماله).
        معلومة: أُدرج الـ noken في قائمة اليونسكو للتراث الثقافي غير المادي عام 2012.
        - في الكلام اليومي: aja = saja، terus = lalu.
      en: |
        UMKM (micro, small and medium enterprises) are the backbone of Indonesia's economy; by often-quoted government figures they employ most workers.
        A story invented for the lesson: Kaka Benny sells noken, the hand-made Papuan string bag.
        - He started with a small modal (capital) from his savings.
        - He took a small pinjaman (loan) from the bank.
        - He did pemasaran daring (online marketing) on Instagram.
        - Oleh sebab itu, his omzet (turnover) doubled.
        Did you know? Noken has been on UNESCO's intangible cultural heritage list since 2012.
        - In speech: aja = saja, terus = lalu.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: UMKM
        ar_eg: المشاريع الصغيرة والمتوسطة
        ar: المشاريع الصغرى والمتوسّطة
        en: small and medium enterprises
      - text: modal
        ar_eg: رأس مال
        ar: رأس مال
        en: capital
      - text: omzet
        ar_eg: حجم المبيعات
        ar: رقم الأعمال
        en: turnover
      - text: pinjaman
        ar_eg: قرض
        ar: قرض
        en: loan
      - text: pemasaran daring
        ar_eg: تسويق أونلاين
        ar: تسويق إلكتروني
        en: online marketing
    words: [UMKM, modal, omzet, pinjaman, pemasaran daring]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: كاكا بيني بدأ مشروعه بإيه؟
      ar: بمَ بدأ كاكا بيني مشروعه؟
      en: What did Kaka Benny start his business with?
    options:
      - بقرض كبير من بنك أجنبي.
      - برأس مال صغير من مدّخراته.
      - من غير فلوس خالص.
    answer: 1
    words: [modal]
    explain:
      ar_eg: كاكا بيني بدأ بـ modal صغير (رأس مال) من مدّخراته، مش بقرض.
      ar: بدأ كاكا بيني برأس مال صغير من مدخراته.
      en: Kaka Benny started with small savings as capital.
  - id: e03
    type: fill_blank
    sentence: Ia mengajukan ___ ke bank untuk membeli benang.
    meaning:
      ar_eg: قدّم على قرض من البنك علشان يشتري خيط.
      ar: تقدّم بطلب قرض إلى المصرف لشراء الخيوط.
      en: He applied to the bank for a loan to buy thread.
    options: [pinjaman, omzet, UMKM]
    answers: [pinjaman]
    words: [pinjaman]
    explain:
      ar_eg: mengajukan pinjaman ke bank = قدّم على قرض من البنك. omzet = حجم المبيعات وUMKM = مشروعات صغيرة.
      ar: mengajukan pinjaman = تقدّم بطلب قرض. omzet حجم المبيعات وUMKM المشروعات الصغيرة.
      en: You apply to a bank for a pinjaman (loan).
  - id: e04
    type: listen
    text: Berkat pemasaran daring, pembeli dari Jakarta bisa memesan noken.
    question:
      ar_eg: الزباين من جاكرتا قدروا يطلبوا إزاي؟
      ar: كيف استطاع المشترون من جاكرتا الطلب؟
      en: How could buyers in Jakarta order?
    options:
      - بفضل التسويق الأونلاين.
      - بالبريد العادي بس.
      - سافروا جايابورا.
    answer: 0
    words: [pemasaran daring]
  - id: e05
    type: build_sentence
    source:
      ar_eg: المشاريع الصغيرة بتشغّل ملايين الناس.
      ar: تشغّل المشاريع الصغيرة ملايين الناس.
      en: Small businesses employ millions of people.
    answer: UMKM mempekerjakan jutaan orang.
    distractors: [modal, omzet]
    words: [UMKM]
    explain:
      ar_eg: UMKM (المشروعات الصغيرة) + mempekerjakan (بتشغّل) + jutaan orang (ملايين). modal وomzet زيادة.
      ar: UMKM mempekerjakan jutaan orang. modal وomzet زائدتان.
      en: UMKM + mempekerjakan + jutaan orang. modal and omzet are extra.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: «Omzet naik dua kali lipat» معناها إيه؟
      ar: ما معنى «Omzet naik dua kali lipat»؟
      en: What does "Omzet naik dua kali lipat" mean?
    options:
      - القرض اتسدّد.
      - رأس المال ضاع.
      - المبيعات زادت الضعف.
    answer: 2
    words: [omzet]
    explain:
      ar_eg: Omzet (المبيعات) naik (زادت) dua kali lipat (الضعف). مش عن قرض ولا خسارة.
      ar: Omzet naik dua kali lipat = تضاعفت المبيعات.
      en: Omzet doubled means sales doubled.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: محتاج رأس مال علشان أفتح محل.
      ar: أحتاج إلى رأس مال لأفتح متجرًا.
      en: I need capital to open a shop.
    answers:
      - Saya butuh modal untuk membuka toko.
      - Saya memerlukan modal untuk membuka toko.
      - Saya membutuhkan modal untuk membuka toko.
      - Aku butuh modal untuk membuka toko.
      - Saya butuh modal buat membuka toko.
      - Saya memerlukan modal buat membuka toko.
      - Saya membutuhkan modal buat membuka toko.
      - Aku butuh modal buat membuka toko.
    words: [modal]
  - id: e08
    type: speaking
    text: Omzet UMKM itu naik berkat pemasaran daring.
    meaning:
      ar_eg: مبيعات المشروع الصغير ده زادت بفضل التسويق الأونلاين.
      ar: ارتفع رقم أعمال ذلك المشروع الصغير بفضل التسويق الإلكتروني.
      en: That small business's turnover rose thanks to online marketing.
    words: [omzet, UMKM, pemasaran daring]
  - id: e09
    type: dictation
    text: Pinjaman kecil itu sudah lunas.
    meaning:
      ar_eg: القرض الصغير ده اتسدّد خلاص.
      ar: سُدّد ذلك القرض الصغير بالكامل.
      en: That small loan has been paid off.
    words: [pinjaman]
  - id: e10
    type: translate
    direction: from_target
    source_text: Dengan modal kecil dan pemasaran daring, banyak UMKM bisa berkembang.
    answers_meaning:
      ar_eg:
        - برأس مال صغير وتسويق أونلاين، مشاريع صغيرة كتير تقدر تكبر.
        - مشاريع صغيرة كتير بتكبر بفلوس قليلة وتسويق على النت.
      ar:
        - برأس مال صغير وتسويق إلكتروني تستطيع مشاريع صغيرة كثيرة أن تنمو.
        - تنمو مشاريع صغيرة كثيرة برأس مال قليل وتسويق عبر الإنترنت.
      en:
        - With small capital and online marketing, many small businesses can grow.
        - Lots of small businesses grow on little capital and online marketing.
    words: [modal, pemasaran daring, UMKM]
dialogue:
  title: Di kios noken
  lines:
    - speaker: Kaka Benny
      text: Dulu aku jual noken di pinggir jalan aja. Modalnya dari tabungan.
      ar_eg: زمان كنت ببيع الـ noken على الرصيف بس. رأس المال من التحويشة.
      ar: كنت أبيع الـ noken على الرصيف فقط، ورأس المال من مدّخراتي.
      en: I used to sell noken just at the roadside. The capital came from savings.
    - speaker: Mohamed
      text: Sekarang kiosnya ramai. Apa rahasianya, Kaka?
      ar_eg: دلوقتي الكشك زحمة. إيه السرّ يا كاكا؟
      ar: والآن الكشك مزدحم. ما السرّ يا كاكا؟
      en: Now the kiosk is busy. What's the secret, Kaka?
    - speaker: Kaka Benny
      text: Pemasaran daring. Satu video di Instagram, terus pesanan datang dari Jakarta.
      ar_eg: التسويق الأونلاين. فيديو واحد على إنستجرام، والطلبات جت من جاكرتا.
      ar: التسويق الإلكتروني. فيديو واحد على إنستغرام، فتوالت الطلبات من جاكرتا.
      en: Online marketing. One Instagram video, then orders came from Jakarta.
    - speaker: Mohamed
      text: Jadi omzetnya naik. Oleh sebab itu, Kaka bisa melunasi pinjaman?
      ar_eg: يبقى المبيعات زادت. وعلشان كده قدرت تسدّد القرض؟
      ar: إذن زاد رقم أعمالك، ولذلك سدّدت القرض؟
      en: So turnover went up. Is that why you could pay off the loan?
