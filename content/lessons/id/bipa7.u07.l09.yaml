schema: kabar.lesson/v1
id: bipa7.u07.l09
language: id
title: Melawan korupsi
can_do:
  ar_eg: تسمّي أشكال الفساد المختلفة وتتكلّم عن الشفافية والمساءلة.
  ar: أن تسمّي أشكال الفساد وتتحدّث عن الشفافية والمساءلة.
  en: Name forms of corruption and talk about transparency and accountability.
slides:
  - title: KKN dan lawannya
    body:
      ar_eg: |
        سنة 1998 الطلبة طالبوا بإنهاء KKN: korupsi وkolusi (التواطؤ) وnepotisme (المحسوبية للقرايب).
        penyuapan = الرشوة. gratifikasi = هدية للموظّف بسبب منصبه؛ لازم يبلّغ عنها لـ KPK.
        pungutan liar (pungli) = فلوس بتتاخد من غير وجه حق، زي «رسوم» مش موجودة في البلدية.
        العلاج: transparansi (الشفافية) وakuntabilitas (المساءلة).
        pelapor = المبلّغ؛ القانون لازم يحميه.
        - في الكلام: terus = lalu، buat = untuk، nelepon = menelepon، harusnya = seharusnya.
      ar: |
        طالب الطلّاب عام 1998 بإنهاء KKN: korupsi وkolusi (التواطؤ) وnepotisme (المحسوبية).
        penyuapan = الرشوة. gratifikasi = هدية للموظّف بسبب منصبه، ويجب الإبلاغ عنها لهيئة KPK.
        pungutan liar (pungli) = أموال تؤخذ بلا حقّ، كـ«رسوم» لا وجود لها في البلدية.
        والعلاج: transparansi (الشفافية) وakuntabilitas (المساءلة).
        pelapor = المُبلّغ، وعلى القانون أن يحميه.
        - في الكلام اليومي: terus = lalu، buat = untuk، nelepon = menelepon، harusnya = seharusnya.
      en: |
        In 1998 students demanded an end to KKN: korupsi, kolusi (collusion) and nepotisme.
        penyuapan = bribery. gratifikasi = a gift to an official because of their post; it must be reported to the KPK.
        pungutan liar (pungli) = money taken without right, like a "fee" that doesn't exist at the council office.
        The cure: transparansi and akuntabilitas.
        pelapor = the whistleblower; the law should protect them.
        - In speech: terus = lalu, buat = untuk, nelepon = menelepon, harusnya = seharusnya.
    examples:
      - text: Pejabat itu ditangkap karena kasus penyuapan.
        ar_eg: المسؤول ده اتقبض عليه في قضية رشوة.
        ar: اعتُقل ذلك المسؤول في قضية رشوة.
        en: That official was arrested in a bribery case.
      - text: Semua anggaran desa harus diumumkan demi transparansi.
        ar_eg: كل ميزانية القرية لازم تتعلن علشان الشفافية.
        ar: يجب إعلان ميزانية القرية كلّها من أجل الشفافية.
        en: The whole village budget must be published for transparency.
      - text: Pelapor kasus itu mendapat perlindungan.
        ar_eg: المبلّغ عن القضية دي اتحمى.
        ar: حصل المبلّغ عن القضية على الحماية.
        en: The whistleblower in that case was given protection.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gratifikasi
        ar_eg: هدية للموظّف علشان منصبه
        ar: هدية للموظّف بسبب منصبه
        en: gratuity (gift to an official)
      - text: penyuapan
        ar_eg: رشوة
        ar: الرشوة
        en: bribery
      - text: pungutan liar
        ar_eg: إتاوة / فلوس بتتاخد من غير وجه حق
        ar: جباية غير قانونية
        en: illegal levy, extortion
      - text: nepotisme
        ar_eg: محسوبية للقرايب
        ar: المحسوبية
        en: nepotism
    words: [gratifikasi, penyuapan, pungutan liar, nepotisme]
  - id: e02
    type: match_pairs
    pairs:
      - text: kolusi
        ar_eg: تواطؤ
        ar: تواطؤ
        en: collusion
      - text: akuntabilitas
        ar_eg: مساءلة
        ar: المساءلة
        en: accountability
      - text: transparansi
        ar_eg: شفافية
        ar: الشفافية
        en: transparency
      - text: pelapor
        ar_eg: المبلّغ
        ar: المُبلِّغ
        en: whistleblower, reporter (of a crime)
    words: [kolusi, akuntabilitas, transparansi, pelapor]
  - id: e03
    type: listen
    text: Petugas itu meminta uang tambahan yang tidak resmi. Itu pungutan liar.
    question:
      ar_eg: الموظّف عمل إيه؟
      ar: ماذا فعل الموظّف؟
      en: What did the officer do?
    options: [إتاوة, هدية, شفافية]
    answer: 0
    meaning:
      ar_eg: الموظّف ده طلب فلوس زيادة مش رسمية. دي إتاوة.
      ar: طلب ذلك الموظّف مالًا إضافيًا غير رسمي، وهذه جباية غير قانونية.
      en: That officer asked for unofficial extra money. That's an illegal levy.
    words: [pungutan liar]
  - id: e04
    type: fill_blank
    sentence: Wali kota itu mengangkat tiga keponakannya. Itu ___.
    meaning:
      ar_eg: المحافظ ده عيّن تلات ولاد إخواته. ده ___.
      ar: عيّن رئيس البلدية ثلاثة من أبناء إخوته، وهذه ___.
      en: The mayor appointed three of his nephews. That's ___.
    options: [nepotisme, transparansi, akuntabilitas]
    answers: [nepotisme]
    words: [nepotisme, transparansi, akuntabilitas]
    explain:
      ar_eg: تعيين القرايب = nepotisme (محسوبية). transparansi = شفافية وakuntabilitas = محاسبة، ودول عكسها.
      ar: تعيين الأقارب nepotisme أي محسوبية. transparansi وakuntabilitas نقيضاها.
      en: Hiring your nephews is nepotisme.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه «gratifikasi» ممكن تبقى مشكلة حتى لو مفيش طلب صريح؟
      ar: لماذا قد تكون «gratifikasi» مشكلة ولو بلا طلب صريح؟
      en: Why can 'gratifikasi' be a problem even without an explicit request?
    options: [Karena hadiahnya selalu murah., Karena hadiah itu diberikan karena jabatan dan bisa memengaruhi keputusan., Karena dilarang membeli hadiah.]
    answer: 1
    explain:
      ar_eg: الهدية بتيجي علشان المنصب وممكن تأثّر على القرار.
      ar: تُمنح الهدية بسبب المنصب وقد تؤثّر في القرار.
      en: The gift comes because of the post and can sway decisions.
    words: [gratifikasi]
  - id: e06
    type: fill_blank
    sentence: Pemerintah harus menjelaskan setiap rupiah. Itu namanya ___.
    meaning:
      ar_eg: الحكومة لازم تشرح كل روبية. ده اسمه ___.
      ar: على الحكومة أن تفسّر كلّ روبية، وهذا ما يسمّى ___.
      en: The government must account for every rupiah. That's ___.
    options: [akuntabilitas, kolusi, penyuapan]
    answers: [akuntabilitas]
    words: [akuntabilitas, kolusi, penyuapan]
    explain:
      ar_eg: تشرح كل روبية = akuntabilitas (المساءلة). kolusi = تواطؤ وpenyuapan = رشوة، ودول فساد.
      ar: تفسير كل روبية akuntabilitas أي المساءلة. kolusi وpenyuapan فساد.
      en: Accounting for every rupiah is akuntabilitas.
  - id: e07
    type: build_sentence
    source:
      ar_eg: المقاول والموظّف اتواطؤوا مع بعض.
      ar: تواطأ المقاول والموظّف.
      en: The contractor and the official colluded.
    answer: Kontraktor dan pejabat itu melakukan kolusi.
    distractors: [nepotisme, pelapor]
    words: [kolusi]
    explain:
      ar_eg: Kontraktor dan pejabat itu + melakukan kolusi (اتواطئوا). nepotisme وpelapor زيادة.
      ar: Kontraktor dan pejabat itu melakukan kolusi. nepotisme وpelapor زائدتان.
      en: Kontraktor dan pejabat itu + melakukan kolusi. nepotisme and pelapor are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Transparansi anggaran mencegah korupsi.
    answers_meaning:
      ar_eg: [شفافية الميزانية بتمنع الفساد, لما الميزانية تبقى شفافة الفساد بيقلّ]
      ar: [شفافية الميزانية تمنع الفساد, تحول الشفافية في الميزانية دون الفساد]
      en: [Budget transparency prevents corruption, Transparent budgets stop corruption]
    words: [transparansi]
  - id: e09
    type: speaking
    text: Pelapor penyuapan harus dilindungi.
    meaning:
      ar_eg: اللي بيبلّغ عن الرشوة لازم يتحمى.
      ar: يجب حماية المبلّغ عن الرشوة.
      en: Those who report bribery must be protected.
    words: [pelapor, penyuapan]
  - id: e10
    type: multiple_choice
    question: Seorang kontraktor memberi mobil kepada kepala dinas sebelum tender. Ini termasuk ...
    options: [nepotisme, akuntabilitas, gratifikasi atau penyuapan]
    answer: 2
    explain:
      ar_eg: هدية قبل المناقصة = هدية بسبب المنصب أو رشوة.
      ar: هدية قبل المناقصة = هدية بسبب المنصب أو رشوة.
      en: A gift before a tender = gratuity or bribery.
    words: [gratifikasi, penyuapan, nepotisme, akuntabilitas, pungutan liar, pelapor]
dialogue:
  lines:
    - speaker: Kaka Yohana
      text: Mohamed, ada pendengar nelepon. Katanya ada pungutan liar di kantor kelurahan.
      ar_eg: يا محمد، مستمع اتصل. بيقول فيه إتاوة في مكتب الحي.
      ar: يا محمد، اتّصل مستمع يقول إنّ هناك جباية غير قانونية في مكتب الحيّ.
      en: Mohamed, a listener called. He says there's an illegal levy at the ward office.
    - speaker: Mohamed
      text: Berapa yang diminta, Kaka?
      ar_eg: طالبين كام يا كاكا؟
      ar: كم طلبوا يا كاكا؟
      en: How much are they asking, Kaka?
    - speaker: Kaka Yohana
      text: Lima puluh ribu buat surat yang harusnya gratis.
      ar_eg: خمسين ألف علشان ورقة المفروض إنها ببلاش.
      ar: خمسين ألفًا مقابل وثيقة يُفترض أنها مجانية.
      en: Fifty thousand for a letter that should be free.
    - speaker: Mohamed
      text: Kita harus lindungi pelapornya. Jangan sebut namanya di siaran.
      ar_eg: لازم نحمي المبلّغ. ما نقولش اسمه على الهوا.
      ar: يجب أن نحمي المبلّغ، فلا نذكر اسمه على الهواء.
      en: We must protect the whistleblower. Don't say his name on air.
    - speaker: Kaka Yohana
      text: Setuju. Terus kita minta transparansi tarif dari lurah.
      ar_eg: موافقة. وبعدين نطلب من رئيس الحي يعلن الرسوم بشفافية.
      ar: موافقة، ثمّ نطالب رئيس الحيّ بالشفافية في الرسوم.
      en: Agreed. Then we ask the ward head to be transparent about fees.
