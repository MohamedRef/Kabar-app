schema: kabar.lesson/v1
id: bipa2.u04.l02
language: id
title: Ayo, mari, jangan
can_do:
  ar_eg: تعزم حد («يلا نروح…») وتحذره («ماتعملش كده»).
  ar: أن تدعو غيرك إلى أمر وتحذّره من آخر.
  en: Invite and warn.
slides:
  - title: Ayo! Yuk!
    body:
      ar_eg: |
        ayo = «يلا» بالظبط: Ayo makan! = يلا ناكل!
        yuk = يلا بس ألطف، وبتيجي في الأول أو الآخر: Ngopi, yuk! / Yuk, ke pasar!
        ولو بتعزم اللي قدامك معاك قول kita (مش kami): Ayo kita ke pasar!
      ar: |
        ayo = «هيّا»: Ayo makan!
        yuk = هيّا بلطف، في أول الجملة أو آخرها: Ngopi, yuk!
        وإذا كانت الدعوة تشمل المخاطب فاستعمل kita لا kami: Ayo kita ke pasar!
      en: |
        ayo = "come on, let's": Ayo makan! = Let's eat!
        yuk = a softer "let's", at the start or the end: Ngopi, yuk! / Yuk, ke pasar!
        When the invitation includes the listener, use kita (not kami): Ayo kita ke pasar!
    grammar: id.invitation.ayo-mari
    examples:
      - text: Ayo, kita ke pasar!
        ar_eg: يلا نروح السوق!
        ar: هيّا نذهب إلى السوق!
        en: Come on, let's go to the market!
      - text: Ngopi, yuk!
        ar_eg: يلا نشرب قهوة!
        ar: هيا نشرب القهوة!
        en: Let's grab a coffee!
  - title: Mari kita …
    body:
      ar_eg: |
        mari = «هيا بنا» بس رسمية، في الخطب والإعلانات واللافتات:
        Mari kita mulai = هيا نبدأ. Mari kita jaga kebersihan = هيا نحافظ على النضافة.
        وMari! لوحدها لما تمشي = «سلام / عن إذنك».
        الرد على العزومة: Ayo! = يلا!، Boleh = ماشي، Nanti dulu = بعدين.
      ar: |
        mari = «هلمّ / لِنَفعل»، وهي رسمية، في الخطب والإعلانات:
        Mari kita mulai = لنبدأ. Mari kita jaga kebersihan = لنحافظ على النظافة.
        و«Mari!» وحدها عند الانصراف = «أستأذن».
        والرد: Ayo! = هيّا!، Boleh = حسنًا، Nanti dulu = لاحقًا.
      en: |
        mari = "let us" — formal: speeches, announcements, signs:
        Mari kita mulai = Let's begin. Mari kita jaga kebersihan = Let's keep things clean.
        "Mari!" alone when leaving = "I'll be off then".
        Replies: Ayo! = Let's!, Boleh = Sure, Nanti dulu = Later.
    grammar: id.invitation.ayo-mari
    examples:
      - text: Mari kita mulai.
        ar_eg: هيا نبدأ.
        ar: لنبدأ.
        en: Let's begin.
  - title: Jangan …!
    body:
      ar_eg: |
        jangan = «ماتـ…ش» (لا الناهية)، والفعل بعدها مابيتغيرش:
        Jangan merokok! = ماتدخنش! — Jangan lupa! = ماتنساش!
        Jangan khawatir = ماتقلقش (khawatir جاية من العربي «خاطر»).
        ومع الصفات: Jangan marah, ya = ماتزعلش بقى.
      ar: |
        jangan = «لا» الناهية، والفعل بعدها لا يتغير:
        Jangan merokok! = لا تدخّن! — Jangan lupa! = لا تنسَ!
        Jangan khawatir = لا تقلق (وkhawatir من العربية «خاطر»).
        ومع الصفة: Jangan marah = لا تغضب.
      en: |
        jangan = "don't", and the verb doesn't change:
        Jangan merokok! = Don't smoke! — Jangan lupa! = Don't forget!
        Jangan khawatir = Don't worry (khawatir comes from Arabic «خاطر»).
        With adjectives too: Jangan marah, ya = Don't be angry, OK?
    grammar: id.prohibition.jangan
    examples:
      - text: Jangan lupa bawa payung.
        ar_eg: ماتنساش تاخد شمسية.
        ar: لا تنسَ أن تأخذ مظلة.
        en: Don't forget to bring an umbrella.
      - text: Jangan khawatir, saya bisa sendiri.
        ar_eg: ماتقلقش، أقدر لوحدي.
        ar: لا تقلق، أستطيع وحدي.
        en: Don't worry, I can do it myself.
  - title: Jangan ≠ tidak
    body:
      ar_eg: |
        tidak = نفي (مش بيدخن)، jangan = نهي (ماتدخنش).
        Dia tidak merokok = هو مش بيدخن. — Jangan merokok! = ماتدخنش!
        وعشان تبقى ألطف حط ya أو dulu: Jangan pergi dulu = ماتمشيش لسه.
        في السوق: Jangan mahal-mahal, Bu! = ماتغليهاش علينا يا حاجة!
      ar: |
        tidak للنفي، وjangan للنهي:
        Dia tidak merokok = هو لا يدخّن. — Jangan merokok! = لا تدخّن!
        وللتلطيف أضف ya أو dulu: Jangan pergi dulu = لا تذهب الآن.
        وفي السوق: Jangan mahal-mahal, Bu! = لا تبالغي في السعر يا سيدتي!
      en: |
        tidak states "doesn't"; jangan commands "don't".
        Dia tidak merokok = He doesn't smoke. — Jangan merokok! = Don't smoke!
        Soften with ya or dulu: Jangan pergi dulu = Don't go yet.
        At the market: Jangan mahal-mahal, Bu! = Don't make it so expensive!
    grammar: id.prohibition.jangan
    examples:
      - text: Jangan mahal-mahal, Bu!
        ar_eg: ماتغليهاش علينا يا حاجة!
        ar: لا تبالغي في السعر يا سيدتي!
        en: Don't make it so expensive, ma'am!
      - text: Jangan pergi dulu!
        ar_eg: ماتمشيش لسه!
        ar: لا تذهب الآن!
        en: Don't go yet!
