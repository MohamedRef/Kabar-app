      - text: Jangan lupa!
        ar_eg: ماتنساش!
        ar: لا تنسَ!
        en: Don't forget!
      - text: Jangan khawatir.
        ar_eg: ماتقلقش.
        ar: لا تقلق.
        en: Don't worry.
      - text: Mari kita mulai.
        ar_eg: هيا نبدأ.
        ar: لنبدأ.
        en: Let's begin.
      - text: Nanti dulu.
        ar_eg: بعدين.
        ar: لاحقًا.
        en: Later.
    words: [ayo, jangan, lupa, khawatir, mari]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تعزم ني لوه تروحوا السوق سوا. تقول إيه؟
      ar: تريد أن تدعو ني لوه للذهاب معًا إلى السوق. ماذا تقول؟
      en: You want to invite Ni Luh to go to the market together. What do you say?
    options: ["Ayo kita ke pasar!", "Ayo kami ke pasar!", "Jangan ke pasar!"]
    answer: 0
    explain:
      ar_eg: العزومة فيها اللي قدامك، يبقى kita مش kami.
      ar: الدعوة تشمل المخاطب، فتأتي kita لا kami.
      en: The invitation includes the listener, so kita, not kami.
    words: [ayo, kita]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك هيمسك طبق سخن. تحذره إزاي؟
      ar: صديقك سيلمس طبقًا ساخنًا. كيف تحذّره؟
      en: Your friend is about to touch a hot plate. How do you warn him?
    options: ["Jangan pegang itu, panas!", "Ayo pegang itu, panas!", "Tidak pegang itu, panas!"]
    answer: 0
    explain:
      ar_eg: النهي بـ jangan. tidak للنفي بس.
      ar: النهي بـ jangan، وtidak للنفي فقط.
      en: Commands use jangan; tidak only negates statements.
    words: [jangan, pegang]
  - id: e04
    type: listen
    text: Jangan lupa bawa payung.
    options: ["Ayo bawa payung.", "Jangan lupa bawa payung.", "Jangan lupa bawa uang."]
    answer: 1
    words: [jangan, lupa, payung]
  - id: e05
    type: multiple_choice
