schema: kabar.lesson/v1
id: bipa4.u05.l11
language: id
title: Ulangan Unit 5
can_do:
  ar_eg: تقارن بين الأعياد الوطنية في مصر وإندونيسيا.
  ar: أن تقارن بين الأعياد الوطنية في مصر وإندونيسيا.
  en: Compare holidays in Egypt and Indonesia.
slides:
  - title: meN-…-i dan metafora
    body:
      ar_eg: |
        مراجعة سريعة:
        meN-…-i + المفعول على طول: memperingati، menghadiri، menghormati، menyemangati (من غير ke / di).
        الاستعارة = من غير seperti: Guru adalah pahlawan tanpa tanda jasa، jantung kota، buah hati.
      ar: |
        مراجعة سريعة:
        meN-…-i + المفعول مباشرة: memperingati، menghadiri، menghormati، menyemangati (بلا ke / di).
        الاستعارة بلا seperti: Guru adalah pahlawan tanpa tanda jasa، jantung kota، buah hati.
      en: |
        Quick review:
        meN-…-i + object directly: memperingati, menghadiri, menghormati, menyemangati (no ke / di).
        Metaphor = no seperti: Guru adalah pahlawan tanpa tanda jasa, jantung kota, buah hati.
    grammar: id.confix.men-i
    examples:
      - text: Warga menghadiri upacara bendera di jantung kota.
        ar_eg: السكان بيحضروا تحية العلم في قلب المدينة.
        ar: يحضر السكان مراسم رفع العلم في قلب المدينة.
        en: Residents attend the flag ceremony in the heart of the city.
      - text: Kita menghormati jasa para pahlawan.
        ar_eg: إحنا بنقدّر أفضال الأبطال.
        ar: نكرّم مآثر الأبطال.
        en: We honour the heroes' service.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: memperingati
        ar_eg: يحيي ذكرى
        ar: يُحيي ذكرى
        en: commemorate
      - text: menghadiri
        ar_eg: يحضر
        ar: يحضر
        en: attend
      - text: hadiah
        ar_eg: جايزة / هدية
        ar: جائزة
        en: prize
      - text: meriah
        ar_eg: مبهج
        ar: بهيج
        en: festive
      - text: buah hati
        ar_eg: فلذة الكبد
        ar: فلذة الكبد
        en: darling, one's child
      - text: pejuang
        ar_eg: مناضل
        ar: مناضل
        en: fighter, champion
    words: [memperingati, menghadiri, hadiah, meriah, buah hati, pejuang]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options: ["Kami menghadiri ke upacara itu.", "Guru adalah seperti pahlawan.", "Warga menghormati jasa para pahlawan."]
    answer: 2
    explain:
      ar_eg: بعد menghadiri مفيش ke، وما تجمعش adalah مع seperti.
      ar: لا ke بعد menghadiri، ولا يُجمع بين adalah وseperti.
      en: No ke after menghadiri, and don't combine adalah with seperti.
    words: [menghormati, jasa]
  - id: e03
    type: fill_blank
    sentence: Festival ___ ini selalu diadakan pada bulan Agustus.
    meaning:
      ar_eg: المهرجان ___ ده دايمًا بيتعمل في أغسطس.
      ar: يُقام هذا المهرجان ___ دائمًا في أغسطس.
      en: This ___ festival is always held in August.
    options: [tahunan, kostum, kedamaian]
    answers: [tahunan]
    words: [tahunan, kostum, kedamaian, festival, diadakan]
    explain:
      ar_eg: tahunan = سنوي، والمهرجان بيتعمل كل أغسطس. kostum = زي تنكّري، وkedamaian = سلام، ودول أسماء.
      ar: tahunan = سنوي، فالمهرجان يُقام كل أغسطس. أما kostum فالزي التنكري، وkedamaian السلام، وهما اسمان.
      en: "tahunan means annual: the festival is every August. kostum (costume) and kedamaian (peace) are nouns."
  - id: e04
    type: listen
    text: Anak-anak mengikuti lomba balap karung.
    options: ["Anak-anak menyemangati lomba balap karung.", "Anak-anak mengikuti lomba balap karung.", "Anak-anak mengikuti lomba panjat pinang."]
    answer: 1
    meaning:
      ar_eg: العيال بيشاركوا في سباق الشوال.
      ar: يشارك الأطفال في سباق الأكياس.
      en: The children take part in the sack race.
    words: [balap karung]
  - id: e05
    type: fill_blank
    sentence: Warga ___ peserta panjat pinang.
    meaning:
      ar_eg: السكان بيشجعوا اللي بيطلعوا العمود المدهون.
      ar: يشجّع السكان المتسابقين في تسلّق العمود.
      en: Residents cheer on the pole climbers.
    options: [menyemangati, menghadiri, memperingati]
    answers: [menyemangati]
    words: [menyemangati, panjat pinang, peserta]
    explain:
      ar_eg: menyemangati = يشجّع، والأهالي بيشجّعوا المتسابقين. menghadiri = يحضر، وmemperingati = يحيي ذكرى.
      ar: menyemangati = يشجّع، فالسكان يشجّعون المتسابقين. أما menghadiri فيحضر، وmemperingati يُحيي ذكرى.
      en: menyemangati means cheer on, which the residents do. menghadiri is attend, and memperingati is commemorate.
  - id: e06
    type: fill_blank
    sentence: Guru adalah pahlawan tanpa tanda ___.
    meaning:
      ar_eg: (كمّل الاستعارة) المدرس بطل من غير وسام.
      ar: (أكمل الاستعارة) المعلم بطل بلا وسام.
      en: (Complete the metaphor.) Teachers are heroes without medals.
    answers: [jasa]
    words: [tanda jasa]
    explain:
      ar_eg: "pahlawan tanpa tanda jasa = بطل من غير نيشان: المدرس بيدّي كتير ومحدش بيكرّمه."
      ar: "pahlawan tanpa tanda jasa = بطل بلا وسام: يعطي المعلم كثيرًا دون تكريم."
      en: "pahlawan tanpa tanda jasa is a hero without medals: teachers give much and get little honour."
  - id: e07
    type: build_sentence
    source:
      ar_eg: في مصر، بنحيي ذكرى يوم ٢٣ يوليو.
      ar: في مصر نحيي ذكرى الثالث والعشرين من يوليو.
      en: In Egypt, we commemorate 23 July.
    answer: Di Mesir, kami memperingati tanggal 23 Juli.
    distractors: [menghadiri, ke]
    words: [memperingati]
    explain:
      ar_eg: memperingati = يحيي ذكرى، والتاريخ بييجي بعدها على طول. menghadiri = يحضر، وke زيادة قبل التاريخ.
      ar: memperingati = يُحيي ذكرى، ويليها التاريخ مباشرة. أما menghadiri فيحضر، وke زائدة قبل التاريخ.
      en: memperingati means commemorate and takes the date directly. menghadiri is attend, and ke is extra before a date.
  - id: e08
    type: match_pairs
    pairs:
      - text: menjelang
        ar_eg: قبل ما ييجي
        ar: قُبيل
        en: just before
      - text: bendera
        ar_eg: علم
        ar: علم
        en: flag
      - text: tarian
        ar_eg: رقصة
        ar: رقصة
        en: dance
      - text: purnama
        ar_eg: البدر
        ar: البدر
        en: full moon
      - text: imam
        ar_eg: إمام
        ar: إمام
        en: imam
      - text: amal
        ar_eg: عمل خير
        ar: عمل خيري
        en: charity
    words: [menjelang, bendera, tarian, purnama, imam, amal]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كل ١٧ أغسطس، بنحضر تحية العلم.
      ar: نحضر مراسم رفع العلم في ١٧ أغسطس من كل عام.
      en: Every 17 August, we attend the flag ceremony.
    answers:
      - Setiap 17 Agustus, kami menghadiri upacara bendera.
      - Setiap 17 Agustus, kita menghadiri upacara bendera.
      - Setiap tanggal 17 Agustus, kami menghadiri upacara bendera.
      - Kami menghadiri upacara bendera setiap 17 Agustus.
      - Kita menghadiri upacara bendera setiap 17 Agustus.
      - Setiap 17 Agustus kami menghadiri upacara bendera.
    words: [menghadiri, upacara bendera]
  - id: e10
    type: speaking
    text: Orang Mesir dan orang Indonesia sama-sama menghormati jasa para pahlawan.
    meaning:
      ar_eg: المصريين والإندونيسيين الاتنين بيقدّروا أفضال الأبطال.
      ar: يكرّم المصريون والإندونيسيون على السواء مآثر الأبطال.
      en: Egyptians and Indonesians alike honour their heroes' service.
    words: [menghormati, jasa]
dialogue:
  title: Hari besar di dua negara
  lines:
    - speaker: Andi Tenri
      text: Mohamed, di Mesir ada hari besar nasional kayak 17 Agustus nggak?
      ar_eg: يا محمد، هو في مصر فيه عيد وطني زي ١٧ أغسطس؟
      ar: يا محمد، هل في مصر عيد وطني مثل ١٧ أغسطس؟
      en: Mohamed, does Egypt have a national holiday like 17 August?
    - speaker: Mohamed
      text: Ada. Setiap 23 Juli kami memperingati Hari Revolusi.
      ar_eg: أيوه. كل ٢٣ يوليو بنحيي ذكرى عيد الثورة.
      ar: نعم، نحيي ذكرى عيد الثورة في ٢٣ يوليو من كل عام.
      en: Yes. Every 23 July we commemorate Revolution Day.
    - speaker: Andi Tenri
      text: Ada lomba kayak panjat pinang juga?
      ar_eg: وفيه مسابقات زي العمود المدهون؟
      ar: وهل توجد مسابقات مثل تسلّق العمود؟
      en: Are there games like greased-pole climbing?
    - speaker: Mohamed
      text: Nggak ada. Biasanya ada acara resmi dan lagu nasional di TV. Tapi Lebaran di Mesir meriah banget!
      ar_eg: لأ. عادةً فيه احتفالات رسمية وأغاني وطنية في التلفزيون. بس العيد في مصر مبهج جدًا!
      ar: لا. تُقام عادةً احتفالات رسمية وتُبث الأغاني الوطنية في التلفاز، لكن العيد في مصر بهيج جدًا!
      en: No. Usually there are official events and patriotic songs on TV. But Eid in Egypt is very festive!
    - speaker: Andi Tenri
      text: Sama kayak di sini! Hari besar itu jantung kehidupan masyarakat.
      ar_eg: زي هنا بالظبط! الأعياد هي قلب حياة الناس.
      ar: تمامًا كما هنا! الأعياد قلب حياة المجتمع.
      en: Just like here! Holidays are the heart of community life.
souvenir:
  id: bipa4.u05.souvenir
  title: Lomba Tujuh Belasan
  note:
    ar_eg: "يوم ١٧ أغسطس كل حتة في إندونيسيا بتتحول لمهرجان: شباب بيطلعوا على أكتاف بعض فوق عمود مدهون عشان يوصلوا للجوايز، وعيال بينطوا جوه شوالات، والكل بيضحك وهو بياكل كروبوك متعلق في خيط من غير إيدين. الفكرة كلها tolong-menolong: مفيش حد بيوصل لوحده لراس عمود البينانج. وكده الحرية بتتحس فرحة يشارك فيها الكل."
    ar: "في ١٧ أغسطس يتحول كل حيّ في إندونيسيا إلى مهرجان: شبّان يعتلي بعضهم أكتاف بعض لتسلق عمود مدهون بلوغًا للجوائز، وأطفال يقفزون في أكياس، والجميع يضحك وهو يأكل الكروبوك المعلّق بخيط دون استعمال اليدين. والفكرة كلها التعاون (tolong-menolong)، فلا أحد يبلغ قمة العمود وحده، وهكذا تصير الحرية فرحة مشتركة."
    en: "On 17 August every Indonesian neighbourhood turns into a festival — young men climb on each other's shoulders up a greased pole to reach the prizes, children hop along in sacks, and everyone laughs while eating crackers off a string, hands behind their backs. The whole idea is tolong-menolong: nobody reaches the top of the pinang pole alone. That's how freedom becomes a shared celebration."
