schema: kabar.lesson/v1
id: bipa3.u05.l09
language: id
title: Blog Ni Luh
can_do:
  ar_eg: تقرا بوست في بلوج عن رحلة طلوع جبل وتفهم مين عمل إيه وإمتى.
  ar: أن تقرأ تدوينة عن رحلة صعود جبل وتفهم من فعل ماذا ومتى.
  en: Read a blog recount of a hike and follow who did what, and when.
slides:
  - title: '"Tiga hari di Rinjani"'
    grammar: id.verb.transitive
    body:
      ar_eg: |
        نيلوه كتبت بوست في البلوج بتاعها عن طلوع جبل رينجاني. ده نص «recount»: بيحكي اللي حصل بالترتيب.
        دوّر على: مين شال الخيمة؟ مين إدّاهم الأكل؟ وشافوا إيه فوق القمة؟
        وخد بالك من الأفعال اللي ليها مفعول: membawa tenda، memberi kami bekal.
      ar: |
        كتبت نيلوه تدوينة عن صعود جبل رينجاني. هذا نصّ «recount» يروي ما حدث بالترتيب.
        ابحث عن: من حمل الخيمة؟ من أعطاهم الطعام؟ وماذا رأوا من القمة؟
        ولاحظ الأفعال المتعدّية: membawa tenda وmemberi kami bekal.
      en: |
        Ni Luh wrote a blog post about climbing Mount Rinjani. It's a recount: it tells what happened, in order.
        Look for: who carried the tent? Who gave them food? What did they see from the top?
        Notice the verbs with objects: membawa tenda, memberi kami bekal.
    examples:
      - text: Akhir pekan lalu, saya dan dua teman mendaki Gunung Rinjani dari Senaru.
        ar_eg: الويك إند اللي فات، أنا واتنين صحابي طلعنا جبل رينجاني من سينارو.
        ar: في عطلة نهاية الأسبوع الماضية صعدتُ مع صديقين جبل رينجاني من سينارو.
        en: Last weekend, two friends and I climbed Mount Rinjani from Senaru.
      - text: Pak Sahdan, porter kami, membawa tenda. Istrinya memberi kami bekal nasi dan telur.
        ar_eg: عم سهدان، الشيّال بتاعنا، شال الخيمة. ومراته إدّتنا زوّادة رز وبيض.
        ar: حمل السيد سهدان، حمّالنا، الخيمة، وأعطتنا زوجته زادًا من الأرز والبيض.
        en: Pak Sahdan, our porter, carried the tent. His wife gave us packed rice and eggs.
      - text: Pada hari ketiga, sesampainya di puncak, kami melihat matahari terbit. Pengalaman itu sangat berkesan!
        ar_eg: في اليوم التالت، أول ما وصلنا القمة، شفنا الشمس وهي بتطلع. التجربة دي ما تتنسيش!
        ar: في اليوم الثالث، حين وصلنا إلى القمة، رأينا شروق الشمس. كانت تجربة لا تُنسى!
        en: On the third day, on reaching the summit, we saw the sunrise. It was a memorable experience!
exercises:
  - id: e01
    type: listen
    text: Akhir pekan lalu, saya dan dua teman mendaki Gunung Rinjani dari Senaru.
    question:
      ar_eg: نيلوه طلعت الجبل إمتى؟
      ar: متى صعدت نيلوه الجبل؟
      en: When did Ni Luh climb the mountain?
    options: ["Minggu depan.", "Akhir pekan lalu.", "Tahun lalu."]
    answer: 1
    meaning:
      ar_eg: الويك إند اللي فات، أنا واتنين صحابي طلعنا جبل رينجاني من سينارو.
      ar: في عطلة نهاية الأسبوع الماضية صعدتُ مع صديقين جبل رينجاني من سينارو.
      en: Last weekend, two friends and I climbed Mount Rinjani from Senaru.
    words: [akhir pekan, mendaki]
  - id: e02
    type: listen
    text: Istrinya memberi kami bekal nasi dan telur.
    options:
      - Istrinya memberi kami bekal nasi dan telur.
      - Istrinya membawa kami ke rumah.
      - Istrinya memberi kami peta dan senter.
    answer: 0
    meaning:
      ar_eg: ومراته إدّتنا زوّادة رز وبيض.
      ar: وأعطتنا زوجته زادًا من الأرز والبيض.
      en: His wife gave us packed rice and eggs.
    words: [memberi, bekal]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي شال الخيمة؟
      ar: مَن حمل الخيمة؟
      en: Who carried the tent?
    options: ["Ni Luh.", "Istri Pak Sahdan.", "Pak Sahdan."]
    answer: 2
    words: [membawa, tenda]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: وصلوا القمة في أنهي يوم؟
      ar: في أيّ يوم وصلوا إلى القمة؟
      en: On which day did they reach the summit?
    options: ["Hari pertama.", "Hari kedua.", "Hari ketiga."]
    answer: 2
    words: [puncak]
  - id: e05
    type: match_pairs
    pairs:
      - text: mendaki
        ar_eg: يطلع (جبل)
        ar: يصعد (جبلًا)
        en: to climb
      - text: bekal
        ar_eg: زوّادة، أكل للسكة
        ar: زاد الطريق
        en: packed food
      - text: sesampainya
        ar_eg: أول ما وصل
        ar: عند الوصول
        en: on arriving
      - text: berkesan
        ar_eg: ما يتنسيش
        ar: لا يُنسى
        en: memorable
      - text: puncak
        ar_eg: قمة
        ar: قمّة
        en: summit
    words: [mendaki, bekal, sesampainya, berkesan, puncak]
  - id: e06
    type: dictation
    text: Pengalaman itu sangat berkesan!
    meaning:
      ar_eg: التجربة دي ما تتنسيش!
      ar: كانت تجربة لا تُنسى!
      en: That experience was very memorable!
    words: [pengalaman, berkesan]
  - id: e07
    type: fill_blank
    sentence: ___ di puncak, kami melihat matahari terbit.
    meaning:
      ar_eg: أول ما وصلنا القمة، شفنا الشمس وهي بتطلع.
      ar: حين وصلنا إلى القمة، رأينا شروق الشمس.
      en: On reaching the summit, we saw the sunrise.
    options: [Sesampainya, Keesokan harinya, Akhir pekan]
    answers: [Sesampainya]
    words: [sesampainya]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الشيّال شال الخيمة لحد القمة.
      ar: حمل الحمّال الخيمة إلى القمة.
      en: The porter carried the tent to the summit.
    answer: Porter itu membawa tenda ke puncak.
    distractors: [memberi, di]
    words: [membawa, tenda, puncak]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مرات عم سهدان إدّتنا زوّادة.
      ar: أعطتنا زوجة السيد سهدان زادًا.
      en: Pak Sahdan's wife gave us packed food.
    answers:
      - Istri Pak Sahdan memberi kami bekal.
      - Istri Pak Sahdan memberi kami bekal
      - Istri Pak Sahdan memberikan bekal kepada kami.
      - Istri Pak Sahdan memberikan bekal kepada kami
      - Istri Pak Sahdan memberi kita bekal.
      - Istri Pak Sahdan memberikan bekal kepada kita.
    explain:
      ar_eg: memberi + الشخص + الحاجة (memberi kami bekal)، أو memberikan + الحاجة + kepada + الشخص.
      ar: memberi + الشخص + الشيء (memberi kami bekal)، أو memberikan + الشيء + kepada + الشخص.
      en: memberi + person + thing (memberi kami bekal), or memberikan + thing + kepada + person.
    words: [memberi, bekal]
dialogue:
  title: Komentar di blog
  lines:
    - speaker: Mohamed
      text: Ni Luh, aku baca blogmu tentang Rinjani. Bagus banget!
      ar_eg: نيلوه، قريت البلوج بتاعك عن رينجاني. حلو جدًا!
      ar: يا نيلوه، قرأت مدوّنتكِ عن رينجاني. رائعة جدًا!
      en: Ni Luh, I read your blog about Rinjani. Really good!
    - speaker: Ni Luh
      text: Makasih! Kamu juga mendaki sama Pak Sahdan, kan?
      ar_eg: شكرًا! إنت كمان طلعت مع عم سهدان، مش كده؟
      ar: شكرًا! أنت أيضًا صعدت مع السيد سهدان، أليس كذلك؟
      en: Thanks! You climbed with Pak Sahdan too, didn't you?
    - speaker: Mohamed
      text: Iya! Dia bawa tenda kami, terus istrinya ngasih kami bekal juga.
      ar_eg: أيوه! هو شال خيمتنا، ومراته إدّتنا زوّادة برضه.
      ar: نعم! حمل خيمتنا، وأعطتنا زوجته زادًا أيضًا.
      en: Yes! He carried our tent, and his wife gave us packed food too.
    - speaker: Ni Luh
      text: Kamu lihat matahari terbit dari puncak?
      ar_eg: شفت الشروق من فوق القمة؟
      ar: هل رأيت شروق الشمس من القمة؟
      en: Did you see the sunrise from the summit?
    - speaker: Mohamed
      text: Iya. Sesampainya di puncak, aku diam aja. Pengalaman itu berkesan banget.
      ar_eg: أيوه. أول ما وصلت القمة سكتّ خالص. تجربة ما تتنسيش.
      ar: نعم. حين وصلت إلى القمة صمتُّ تمامًا. كانت تجربة لا تُنسى.
      en: Yes. When I reached the top, I just went quiet. It was a memorable experience.
