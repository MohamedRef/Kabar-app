schema: kabar.lesson/v1
id: bipa6.u10.l13
language: id
title: Ulangan Unit 10
can_do:
  ar_eg: تكتب فقرة أكاديمية بمصادرها وتدافع عن مقالك.
  ar: أن تكتب فقرة أكاديمية موثّقة المصادر وتدافع عن مقالتك.
  en: Write a sourced academic paragraph and defend your essay.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: parafrasa
        ar_eg: إعادة صياغة
        ar: إعادة صياغة
        en: paraphrase
      - text: kalimat utama
        ar_eg: الجملة الرئيسية
        ar: الجملة الرئيسية
        en: topic sentence
      - text: daftar pustaka
        ar_eg: قايمة المراجع
        ar: قائمة المراجع
        en: bibliography, reference list
      - text: tesis
        ar_eg: أطروحة
        ar: أطروحة
        en: thesis statement
      - text: penguji
        ar_eg: ممتحن
        ar: ممتحِن
        en: examiner
    words: [parafrasa, kalimat utama, daftar pustaka, tesis, penguji]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي فعل أقوى عشان تنقل إن الكاتب أكّد على فكرته؟
      ar: أيّ فعل أقوى لنقل أنّ الكاتب ألحّ على فكرته؟
      en: Which verb best reports that the writer insisted on a point?
    options: [menyatakan, menegaskan, mengutip]
    answer: 1
    words: [menegaskan, menyatakan, mengutip]
  - id: e03
    type: fill_blank
    sentence: Tanah di Karo subur. ___, iklimnya sejuk sepanjang tahun.
    meaning:
      ar_eg: أرض كارو خصبة. وعلاوة على كده، الجو بارد طول السنة.
      ar: تربة كارو خصبة، وفضلًا عن ذلك فمناخها معتدل طوال العام.
      en: The soil in Karo is fertile. Besides, the climate is cool all year round.
    options: [Di samping itu, Singkatnya, Kutipan langsung]
    answers: [Di samping itu]
    words: [di samping itu, singkatnya, kutipan langsung]
  - id: e04
    type: listen
    text: Penguji meminta Mohamed menanggapi kelemahan datanya.
    question:
      ar_eg: الممتحن طلب إيه؟
      ar: ماذا طلب الممتحن؟
      en: What did the examiner ask for?
    options:
      - إن محمد يرد على نقطة الضعف في بياناته.
      - إن محمد يغيّر الموضوع.
      - إن محمد يقرا المقال من الأول.
    answer: 0
    words: [penguji, menanggapi, kelemahan, data]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الكتاب ده اتنشر سنة 2021، صفحة خمستاشر.
      ar: صدر هذا الكتاب عام 2021، الصفحة الخامسة عشرة.
      en: This book was published in 2021, page fifteen.
    answer: Buku ini terbit tahun 2021, halaman lima belas.
    distractors: [rujukan, tesis]
    words: [terbit, halaman]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: نسخت فقرة من مقال وحطيت اسمك عليها. ده اسمه إيه؟
      ar: نسخت فقرة من مقالة ونسبتها إلى نفسك. ما اسم هذا؟
      en: You copied a paragraph from an article and put your name on it. What is that called?
    options: [parafrasa, rujukan, plagiarisme]
    answer: 2
    words: [plagiarisme, parafrasa, rujukan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: وزيادة على كده، الجمل الشارحة لازم تبقى أصلية.
      ar: وعلاوة على ذلك، يجب أن تكون الجمل الشارحة أصيلة.
      en: Furthermore, the supporting sentences must be original.
    answers:
      - Lebih lanjut, kalimat penjelas harus orisinal.
      - Lebih lanjut, kalimat-kalimat penjelas harus orisinal.
      - Lebih lanjut, kalimat penjelasnya harus orisinal.
    words: [lebih lanjut, kalimat penjelas, orisinal]
  - id: e08
    type: speaking
    text: Penulis mengungkapkan harapannya, dan datanya cukup meyakinkan.
    meaning:
      ar_eg: الكاتب عبّر عن أمله، وبياناته مقنعة كفاية.
      ar: عبّر الكاتب عن أمله، وبياناته مقنعة بما يكفي.
      en: The writer expressed his hope, and his data are fairly convincing.
    words: [mengungkapkan, meyakinkan, data]
  - id: e09
    type: dictation
    text: Penulis menekankan pentingnya membaca sumber dengan cermat.
    meaning:
      ar_eg: الكاتب بيأكد على أهمية قراية المصادر بدقة.
      ar: يؤكّد الكاتب أهمية قراءة المصادر بتأنٍّ.
      en: The writer stresses the importance of reading sources carefully.
    words: [menekankan, cermat]
  - id: e10
    type: speaking
    text: Kajian ini merujuk pada sumber primer dari penerbit kampus.
    meaning:
      ar_eg: الدراسة دي بترجع لمصادر أولية من دار نشر الجامعة.
      ar: تحيل هذه الدراسة إلى مصادر أوّلية من دار نشر الجامعة.
      en: This study refers to primary sources from the university press.
    words: [kajian, merujuk, primer, penerbit]
  - id: e11
    type: match_pairs
    pairs:
      - text: kerangka
        ar_eg: هيكل
        ar: هيكل
        en: outline
      - text: draf
        ar_eg: مسودة
        ar: مسوّدة
        en: draft
      - text: terpercaya
        ar_eg: يتوثق فيه
        ar: موثوق
        en: trustworthy
      - text: indikasi
        ar_eg: مؤشر
        ar: مؤشّر
        en: indication
      - text: wawasan
        ar_eg: سعة الأفق
        ar: اطّلاع
        en: insight
      - text: bias
        ar_eg: تحيز
        ar: تحيّز
        en: bias
    words: [kerangka, draf, terpercaya, indikasi, wawasan, bias]
  - id: e12
    type: fill_blank
    sentence: Setelah membaca ulang, saya ___ esai itu dan memperbaiki tiga salah ketik.
    meaning:
      ar_eg: بعد ما قريته تاني، حرّرت المقال وصلّحت تلات غلطات كتابة.
      ar: بعد إعادة القراءة حرّرت المقال وصحّحت ثلاثة أخطاء طباعية.
      en: After rereading, I edited the essay and fixed three typos.
    options: [menyunting, memeriksa, menyetujui]
    answers: [menyunting]
    words: [membaca ulang, menyunting, salah ketik]
dialogue:
  title: Pagi di Bukit Gundaling
  lines:
    - speaker: Rani
      text: Lihat, Sinabung kelihatan jelas pagi ini. Selamat, esaimu lulus!
      ar_eg: بص، سينابونج باين واضح النهارده الصبح. مبروك، مقالك نجح!
      ar: انظر، سينابونغ واضح هذا الصباح. مبارك، نجحت مقالتك!
      en: Look, Sinabung is clear this morning. Congratulations, your essay passed!
    - speaker: Mohamed
      text: Terima kasih. Penguji bilang jawaban saya meyakinkan.
      ar_eg: شكرًا. الممتحنة قالت إن ردودي كانت مقنعة.
      ar: شكرًا. قالت الممتحنة إنّ أجوبتي كانت مقنعة.
      en: Thanks. The examiner said my answers were convincing.
    - speaker: Rani
      text: Jadi, BIPA 6 selesai. Ke mana sesudah ini?
      ar_eg: يعني BIPA 6 خلص. رايح فين بعد كده؟
      ar: إذن انتهى BIPA 6. إلى أين بعد هذا؟
      en: So that's BIPA 6 done. Where to next?
    - speaker: Mohamed
      text: Ke timur, jauh sekali. Raja Ampat, Papua!
      ar_eg: على الشرق، بعيد خالص. راجا أمبات، بابوا!
      ar: شرقًا، بعيدًا جدًّا. راجا أمبات في بابوا!
      en: East, a long way. Raja Ampat, Papua!
souvenir:
  id: bipa6.u10.souvenir
  title: Pemandangan Gunung Sinabung
  note:
    ar_eg: جبل سينابونج في مقاطعة كارو بشمال سومطرة، وارتفاعه حوالي 2,460 متر. فضل ساكت حوالي 400 سنة لحد ما ثار سنة 2010، ورجع ثار تاني من 2013 ولسنين بعدها، وآلاف من الأهالي اضطروا يسيبوا قراهم ويتنقلوا. من تل جوندالينج (Bukit Gundaling) في برستاجي تقدر تشوف سينابونج وجبل سيباياك. وبالمناسبة، الكتابة الأكاديمية الإندونيسية بتمشي على قواعد الإملاء الرسمية EYD (آخر نسخة EYD V سنة 2022، وقبلها PUEBI)، وقاموس KBBI هو المرجع للكلمات الفصحى.
    ar: جبل سينابونغ في مقاطعة كارو بشمال سومطرة، ويبلغ ارتفاعه نحو 2,460 مترًا. ظلّ خامدًا قرابة 400 عام حتّى ثار سنة 2010، ثمّ عاد إلى الثوران منذ 2013 لسنوات، فاضطُرّ آلاف السكّان إلى ترك قراهم والانتقال. ومن تلّ غونداليغ (Bukit Gundaling) في برستاغي يُرى سينابونغ وجبل سيباياك. وتتبع الكتابة الأكاديمية الإندونيسية قواعد الإملاء الرسمية EYD (أحدثها EYD V سنة 2022، وقبلها PUEBI)، ومعجم KBBI مرجع الألفاظ الفصيحة.
    en: Mount Sinabung, in Karo Regency, North Sumatra, rises about 2,460 m. It lay quiet for roughly 400 years until it erupted in 2010, then erupted again from 2013 for years afterwards, and thousands of villagers had to leave their homes and be relocated. From Bukit Gundaling in Berastagi you can see both Sinabung and Mount Sibayak. Indonesian academic writing follows the official EYD spelling rules (the latest is EYD V, 2022; before it came PUEBI), and the KBBI dictionary is the reference for standard words.
