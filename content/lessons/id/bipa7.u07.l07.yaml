schema: kabar.lesson/v1
id: bipa7.u07.l07
language: id
title: Trias politika
can_do:
  ar_eg: تشرح السلطات التلاتة في إندونيسيا وإزاي الناس بتطعن في قانون.
  ar: أن تشرح السلطات الثلاث في إندونيسيا وكيف يُطعن في قانون.
  en: Explain Indonesia's three branches of power and how a law is challenged.
slides:
  - title: Tiga cabang kekuasaan
    body:
      ar_eg: |
        trias politika = فصل السلطات لتلاتة:
        - legislatif (تشريعي): DPR وDPD، شغلتهم legislasi (سنّ القوانين).
        - eksekutif (تنفيذي): الرئيس والحكومة. إندونيسيا نظامها presidensial (رئاسي).
        - yudikatif (قضائي): المحكمة العليا وMahkamah Konstitusi (المحكمة الدستورية، اتأسّست 2003).
        أي مواطن يقدر يقدّم uji materi: يطلب من المحكمة الدستورية تشوف القانون ضد الدستور ولا لأ.
        hukum ketatanegaraan = القانون الدستوري.
        - في الكلام: nggak = tidak.
      ar: |
        trias politika = فصل السلطات إلى ثلاث:
        - legislatif (تشريعية): DPR وDPD، وعملهما legislasi (سنّ القوانين).
        - eksekutif (تنفيذية): الرئيس والحكومة، والنظام في إندونيسيا presidensial (رئاسي).
        - yudikatif (قضائية): المحكمة العليا وMahkamah Konstitusi (المحكمة الدستورية، تأسّست عام 2003).
        ويحقّ لأيّ مواطن تقديم uji materi: أن يطلب من المحكمة الدستورية فحص دستورية قانون ما.
        hukum ketatanegaraan = القانون الدستوري.
        - في الكلام اليومي: nggak = tidak.
      en: |
        trias politika = power split three ways:
        - legislatif: the DPR and DPD, whose job is legislasi (law-making).
        - eksekutif: the president and cabinet. Indonesia's system is presidensial.
        - yudikatif: the Supreme Court and the Mahkamah Konstitusi (Constitutional Court, set up in 2003).
        Any citizen can file an uji materi: ask the Constitutional Court whether a law breaks the Constitution.
        hukum ketatanegaraan = constitutional law.
        - In speech: nggak = tidak.
    examples:
      - text: Indonesia menganut sistem presidensial.
        ar_eg: إندونيسيا ماشية بالنظام الرئاسي.
        ar: تأخذ إندونيسيا بالنظام الرئاسي.
        en: Indonesia follows a presidential system.
      - text: Mahasiswa itu mengajukan uji materi ke Mahkamah Konstitusi.
        ar_eg: الطالب ده قدّم طعن بعدم الدستورية للمحكمة الدستورية.
        ar: قدّم ذلك الطالب طعنًا دستوريًّا إلى المحكمة الدستورية.
        en: That student filed a judicial review with the Constitutional Court.
      - text: Fungsi legislasi ada di tangan DPR.
        ar_eg: سنّ القوانين في إيد البرلمان.
        ar: وظيفة التشريع بيد مجلس النوّاب.
        en: The law-making function lies with the DPR.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: trias politika
        ar_eg: فصل السلطات التلاتة
        ar: مبدأ فصل السلطات
        en: separation of powers (trias politica)
      - text: legislatif
        ar_eg: تشريعي
        ar: تشريعي
        en: legislative
      - text: yudikatif
        ar_eg: قضائي
        ar: قضائي
        en: judicial
      - text: ketatanegaraan
        ar_eg: نظام الدولة الدستوري
        ar: الشؤون الدستورية
        en: constitutional affairs, statecraft
    words: [trias politika, legislatif, yudikatif, ketatanegaraan]
  - id: e02
    type: match_pairs
    pairs:
      - text: presidensial
        ar_eg: رئاسي
        ar: رئاسي
        en: presidential
      - text: Mahkamah Konstitusi
        ar_eg: المحكمة الدستورية
        ar: المحكمة الدستورية
        en: Constitutional Court
      - text: uji materi
        ar_eg: طعن بعدم الدستورية
