        en: judicial review
      - text: legislasi
        ar_eg: سنّ القوانين
        ar: التشريع
        en: legislation, law-making
    words: [presidensial, Mahkamah Konstitusi, uji materi, legislasi]
  - id: e03
    type: listen
    text: Hakim adalah bagian dari kekuasaan yudikatif.
    question:
      ar_eg: القضاة من أنهي سلطة؟
      ar: إلى أيّ سلطة ينتمي القضاة؟
      en: Which branch are judges in?
    options: [القضائية, التشريعية, التنفيذية]
    answer: 0
    meaning:
      ar_eg: القضاة جزء من السلطة القضائية.
      ar: القضاة جزء من السلطة القضائية.
      en: Judges are part of the judicial branch.
    words: [yudikatif]
  - id: e04
    type: fill_blank
    sentence: DPR adalah lembaga ___.
    meaning:
      ar_eg: البرلمان مؤسسة ___.
      ar: مجلس النوّاب مؤسسة ___.
      en: The DPR is a ___ body.
    options: [legislatif, yudikatif, presidensial]
    answers: [legislatif]
    words: [legislatif, yudikatif, presidensial]
    explain:
      ar_eg: DPR بيعمل القوانين، فهو legislatif = تشريعي. yudikatif = قضائي، وpresidensial = رئاسي.
      ar: DPR سلطة legislatif أي تشريعية. yudikatif قضائية وpresidensial رئاسي.
      en: The DPR makes laws, so it is legislatif.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه بنقسم السلطة لتلاتة («trias politika»)؟
      ar: لماذا تُقسم السلطة ثلاثًا («trias politika»)؟
      en: Why split power three ways ('trias politika')?
    options: [Supaya tidak ada satu lembaga yang terlalu berkuasa., Supaya pemilu lebih jarang., Supaya hakim membuat undang-undang.]
    answer: 0
    explain:
      ar_eg: علشان مفيش جهة واحدة تمسك كل حاجة.
      ar: لئلّا تستأثر جهة واحدة بالسلطة.
      en: So no single body holds too much power.
    words: [trias politika]
  - id: e06
    type: fill_blank
    sentence: Undang-undang itu dibatalkan sebagian setelah ___.
    meaning:
      ar_eg: القانون ده اتلغى جزء منه بعد ___.
      ar: أُبطل جزء من ذلك القانون بعد ___.
      en: Part of that law was struck down after a ___.
    options: [uji materi, legislasi, ketatanegaraan]
    answers: [uji materi]
    words: [uji materi, legislasi, ketatanegaraan]
    explain:
      ar_eg: القانون اتلغى جزء منه بعد uji materi = طعن دستوري (مراجعة قضائية). legislasi = تشريع، وketatanegaraan = نظام الدولة.
      ar: أُبطل جزء من القانون بعد uji materi أي الطعن الدستوري.
      en: A law is struck down after uji materi (judicial review).
  - id: e07
    type: build_sentence
    source:
      ar_eg: هي دارسة القانون الدستوري في جامعة سيندراواسيه.
      ar: درست القانون الدستوري في جامعة تشندراواسيه.
      en: She studied constitutional law at Cenderawasih University.
    answer: Dia belajar hukum ketatanegaraan di Universitas Cenderawasih.
    distractors: [legislasi, yudikatif]
    words: [ketatanegaraan]
    explain:
      ar_eg: Dia belajar + hukum ketatanegaraan (القانون الدستوري) + di Universitas Cenderawasih. legislasi وyudikatif زيادة.
      ar: Dia belajar hukum ketatanegaraan di Universitas Cenderawasih. legislasi وyudikatif زائدتان.
      en: Dia belajar + hukum ketatanegaraan + di Universitas Cenderawasih. The other two are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Mahkamah Konstitusi menguji undang-undang terhadap UUD 1945.
    answers_meaning:
      ar_eg: [المحكمة الدستورية بتراجع القوانين قصاد دستور 1945, المحكمة الدستورية بتشوف القوانين متوافقة مع دستور 1945 ولا لأ]
      ar: [تفحص المحكمة الدستورية القوانين في ضوء دستور 1945, تراجع المحكمة الدستورية مدى توافق القوانين مع دستور 1945]
      en: [The Constitutional Court reviews laws against the 1945 Constitution, The Constitutional Court tests laws against the 1945 Constitution]
    words: [Mahkamah Konstitusi]
  - id: e09
    type: speaking
    text: Dalam sistem presidensial, presiden dipilih langsung oleh rakyat.
    meaning:
      ar_eg: في النظام الرئاسي، الشعب بينتخب الرئيس مباشرة.
      ar: في النظام الرئاسي ينتخب الشعب الرئيس مباشرة.
      en: In a presidential system, the people elect the president directly.
    words: [presidensial]
  - id: e10
    type: multiple_choice
    question: Lembaga mana yang menjalankan fungsi legislasi?
    options: [Mahkamah Konstitusi., Presiden saja., DPR bersama pemerintah.]
    answer: 2
    explain:
      ar_eg: البرلمان مع الحكومة بيعملوا القوانين.
      ar: يسنّ مجلس النوّاب القوانين مع الحكومة.
      en: The DPR makes laws together with the government.
    words: [legislasi, Mahkamah Konstitusi, trias politika, uji materi, legislatif, yudikatif, ketatanegaraan]
dialogue:
  lines:
    - speaker: Bu Debora
      text: 'Mohamed, berita kita malam ini: putusan Mahkamah Konstitusi.'
      ar_eg: 'يا محمد، خبرنا الليلة: حكم المحكمة الدستورية.'
      ar: 'يا محمد، خبرنا الليلة: حكم المحكمة الدستورية.'
      en: 'Mohamed, tonight''s story: a Constitutional Court ruling.'
    - speaker: Mohamed
      text: Tentang uji materi undang-undang pemilu, Bu?
      ar_eg: عن الطعن في قانون الانتخابات يا أستاذة؟
      ar: عن الطعن الدستوري في قانون الانتخابات يا سيّدتي؟
      en: On the judicial review of the election law, ma'am?
    - speaker: Bu Debora
      text: 'Ya. Jelaskan dulu untuk pendengar: apa itu kekuasaan yudikatif.'
      ar_eg: أيوه. اشرح للمستمعين الأول يعني إيه سلطة قضائية.
      ar: نعم، واشرح للمستمعين أوّلًا معنى السلطة القضائية.
      en: Yes. First explain to listeners what the judicial branch is.
    - speaker: Mohamed
      text: 'Baik. Saya mulai dari trias politika: legislatif, eksekutif, yudikatif.'
      ar_eg: 'حاضر. هبدأ من فصل السلطات: تشريعية، تنفيذية، قضائية.'
      ar: 'حسنًا، سأبدأ بفصل السلطات: التشريعية والتنفيذية والقضائية.'
      en: 'OK. I''ll start with the separation of powers: legislative, executive, judicial.'
    - speaker: Bu Debora
      text: Bagus. Pakai bahasa sederhana. Nggak semua pendengar paham ketatanegaraan.
      ar_eg: حلو. استعمل كلام بسيط. مش كل المستمعين فاهمين في القانون الدستوري.
      ar: جيّد، واستعمل لغة بسيطة، فليس كلّ المستمعين ملمّين بالشؤون الدستورية.
      en: Good. Keep it simple. Not every listener knows constitutional law.
