schema: kabar.lesson/v1
id: bipa5.u05.l06
language: id
title: Malam di Tanjung Puting
can_do:
  ar_eg: 'توصف ليلة في رحلة نهرية في الغابة: المستنقع والرطوبة والغابة الكثيفة والمية الضحلة، والقرود والخفافيش والناموس والحيوانات المفترسة.'
  ar: 'أن تصف ليلة في رحلة نهرية في الغابة: المستنقع والرطوبة والغابة الكثيفة والماء الضحل، والقردة والخفافيش والبعوض والحيوانات المفترسة.'
  en: 'Describe a night on a jungle river trip: swamp, humidity, dense forest and shallow water, monkeys, bats, mosquitoes and wild beasts.'
slides:
  - title: Di atas klotok
    body:
      ar_eg: |
        klotok = مركب خشب صغير بموتور في أنهار كاليمانتان.
        rawa = مستنقع، lembab = رطب، lebat = كثيف (hutan lebat = غابة كثيفة، hujan lebat = مطر غزير)، dangkal = ضحل، مش غويط.
        kera = قرد (الصغير زي المكاك)، kelelawar = خفاش، nyamuk = ناموسة.
        buas = متوحش، مفترس: binatang buas = حيوان مفترس.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: malem = malam، aja = saja، buat = untuk، banget = sekali، nggak = tidak.
      ar: |
        klotok = قارب خشبي صغير بمحرّك في أنهار كاليمانتان.
        rawa = مستنقع، lembab = رطب، lebat = كثيف (hutan lebat = غابة كثيفة، hujan lebat = مطر غزير)، dangkal = ضحل.
        kera = قرد (صغير كالمكاك)، kelelawar = خفّاش، nyamuk = بعوضة.
        buas = متوحّش، مفترس: binatang buas = حيوان مفترس.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: malem = malam، aja = saja، buat = untuk، banget = sekali، nggak = tidak.
      en: |
        klotok = small wooden motorboat on Kalimantan's rivers.
        rawa = swamp, lembab = humid, damp, lebat = dense, heavy (hutan lebat = dense forest, hujan lebat = heavy rain), dangkal = shallow.
        kera = monkey (small, like a macaque), kelelawar = bat, nyamuk = mosquito.
        buas = wild, ferocious: binatang buas = wild beast.
        The dialogue uses street forms; the formal ones are beside them: malem = malam, aja = saja, buat = untuk, banget = sekali, nggak = tidak.
    examples:
      - text: Klotok kami berhenti karena sungainya dangkal.
        ar_eg: المركب بتاعنا وقف عشان النهر ضحل.
        ar: توقّف قاربنا لأن النهر ضحل.
        en: Our boat stopped because the river is shallow.
      - text: Hutan rawa ini lebat dan sangat lembab.
        ar_eg: غابة المستنقعات دي كثيفة ورطبة جدًا.
        ar: غابة المستنقع هذه كثيفة ورطبة جدًا.
        en: This swamp forest is dense and very humid.
      - text: Saat matahari terbenam, ribuan kelelawar terbang di atas sungai.
        ar_eg: وقت المغرب، آلاف الخفافيش بتطير فوق النهر.
        ar: عند الغروب تطير آلاف الخفافيش فوق النهر.
        en: At sunset, thousands of bats fly over the river.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rawa
        ar_eg: مستنقع
        ar: مستنقع
        en: swamp
      - text: lembab
        ar_eg: رطب
        ar: رطب
        en: humid
      - text: lebat
        ar_eg: كثيف
        ar: كثيف
        en: dense
      - text: dangkal
        ar_eg: ضحل
        ar: ضحل
        en: shallow
    words: [rawa, lembab, lebat, dangkal]
  - id: e02
    type: match_pairs
    pairs:
      - text: kera
        ar_eg: قرد
        ar: قرد
        en: monkey
      - text: kelelawar
        ar_eg: خفاش
        ar: خفّاش
        en: bat
      - text: nyamuk
        ar_eg: ناموسة
        ar: بعوضة
        en: mosquito
      - text: buas
        ar_eg: مفترس
        ar: مفترس
        en: ferocious
    words: [kera, kelelawar, nyamuk, buas]
  - id: e03
    type: listen
    text: Pakai obat nyamuk, ya. Di rawa banyak sekali.
    question:
      ar_eg: إيه اللي كتير في المستنقع؟
      ar: ما الكثير في المستنقع؟
      en: What is there a lot of in the swamp?
    options: [ناموس, تعابين, قرود]
    answer: 0
    meaning:
      ar_eg: حط دهان الناموس. في المستنقع فيه كتير أوي.
      ar: ضع طارد البعوض، ففي المستنقع منه الكثير.
      en: Put on mosquito repellent. There are loads in the swamp.
    words: [nyamuk, rawa]
  - id: e04
    type: fill_blank
    sentence: Jangan berenang di sini. Airnya ___, banyak batu.
    meaning:
      ar_eg: ما تعومش هنا. المية ___، وفيها حجارة كتير.
      ar: لا تسبح هنا. الماء ___ وفيه صخور كثيرة.
      en: Don't swim here. The water is ___, with lots of rocks.
    options: [dangkal, lebat, buas]
    answers: [dangkal]
    words: [dangkal, lebat, buas]
    explain:
      ar_eg: المية فيها حجارة ومش عميقة = dangkal (ضحلة). lebat = كثيف (للغابة)، وbuas = مفترس (للحيوان).
      ar: الماء قليل العمق كثير الصخور = dangkal. أما lebat فـ«كثيف» للغابة، وbuas «مفترس» للحيوان.
      en: Shallow, rocky water is dangkal. lebat (dense) is for forests and buas (fierce) for animals.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الحيوان اللي بيطير بالليل ويتعلق مقلوب اسمه إيه؟
      ar: ما الحيوان الذي يطير ليلًا ويتدلّى مقلوبًا؟
      en: Which animal flies at night and hangs upside down?
    options: [kera, nyamuk, kelelawar]
    answer: 2
    explain:
      ar_eg: kelelawar = خفاش.
      ar: kelelawar = خفّاش.
      en: kelelawar = bat.
    words: [kera, nyamuk, kelelawar]
  - id: e06
    type: fill_blank
    sentence: Bajunya tidak kering-kering karena udaranya ___.
    meaning:
      ar_eg: الهدوم مش بتنشف عشان الجو ___.
      ar: لا تجفّ الملابس لأن الجو ___.
      en: The clothes won't dry because the air is ___.
    options: [lembab, dangkal, rawa]
    answers: [lembab]
    words: [lembab, dangkal, rawa]
    explain:
      ar_eg: الهدوم مش بتنشف عشان الجو lembab (رطب). dangkal = ضحل وrawa = مستنقع، مش وصف للجو.
      ar: لا تجفّ الملابس لأنّ الجوّ lembab (رطب). أما dangkal فـ«ضحل»، وrawa المستنقع.
      en: Clothes won't dry in lembab (humid) air. dangkal (shallow) and rawa (swamp) don't describe air.
  - id: e07
    type: multiple_choice
    question: Seekor ___ mencuri pisang dari perahu kami!
    options: [buas, kera, lembab]
    answer: 1
    explain:
      ar_eg: kera = قرد، والقرود بتحب الموز.
      ar: kera = قرد، والقردة تحبّ الموز.
      en: kera = monkey; monkeys love bananas.
    words: [buas, kera, lembab]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الغابة الكثيفة دي فيها حيوانات مفترسة.
      ar: في هذه الغابة الكثيفة حيوانات مفترسة.
      en: There are wild beasts in this dense forest.
    answer: Di hutan lebat ini ada binatang buas.
    distractors: [rawa, kelelawar]
    words: [lebat, buas]
    explain:
      ar_eg: «غابة كثيفة» = hutan lebat و«حيوانات مفترسة» = binatang buas. rawa = مستنقع وkelelawar = خفاش، مش في الجملة.
      ar: «غابة كثيفة» = hutan lebat و«حيوانات مفترسة» = binatang buas. أما rawa فالمستنقع، وkelelawar الخفّاش.
      en: "\"Dense forest\" is hutan lebat and \"wild beasts\" binatang buas. rawa (swamp) and kelelawar (bat) aren't in it."
  - id: e09
    type: translate
    direction: from_target
    source_text: Saat matahari terbenam, ribuan kelelawar terbang di atas sungai.
    answers_meaning:
      ar_eg: [وقت المغرب آلاف الخفافيش بتطير فوق النهر, لما الشمس بتغيب، آلاف الخفافيش بتطير فوق النهر]
      ar: [عند الغروب تطير آلاف الخفافيش فوق النهر, حين تغرب الشمس تطير آلاف الخفافيش فوق النهر]
      en: ['At sunset, thousands of bats fly over the river', 'When the sun sets, thousands of bats fly above the river']
    words: [kelelawar]
  - id: e10
    type: speaking
    text: Hutan rawa ini lebat, lembab, dan penuh nyamuk.
    meaning:
      ar_eg: غابة المستنقع دي كثيفة ورطبة ومليانة ناموس.
      ar: غابة المستنقع هذه كثيفة ورطبة ومليئة بالبعوض.
      en: This swamp forest is dense, humid and full of mosquitoes.
    words: [rawa, lebat, lembab, nyamuk]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Malem ini kita tidur di atas klotok aja. Sungainya terlalu dangkal buat lanjut.
      ar_eg: الليلة هننام على المركب. النهر ضحل أوي عشان نكمّل.
      ar: سننام الليلة على القارب. النهر أضحل من أن نتابع.
      en: Tonight we sleep on the boat. The river's too shallow to go on.
    - speaker: Mohamed
      text: Udaranya lembab banget. Nyamuknya juga banyak!
      ar_eg: الجو رطب أوي. والناموس كتير!
      ar: الجو رطب جدًا. والبعوض كثير!
      en: It's so humid. And there are so many mosquitoes!
    - speaker: Mas Rizal
      text: "Itu biasa di rawa. Lihat ke atas, deh: ribuan kelelawar keluar dari hutan."
      ar_eg: 'ده عادي في المستنقع. بص فوق: آلاف الخفافيش طالعة من الغابة.'
      ar: 'هذا عادي في المستنقع. انظر إلى الأعلى: آلاف الخفافيش تخرج من الغابة.'
      en: 'That''s normal in a swamp. Look up: thousands of bats are leaving the forest.'
    - speaker: Mohamed
      text: Di hutan lebat itu ada binatang buas nggak?
      ar_eg: فيه حيوانات مفترسة في الغابة الكثيفة دي؟
      ar: هل في تلك الغابة الكثيفة حيوانات مفترسة؟
      en: Are there wild beasts in that dense forest?
    - speaker: Mas Rizal
      text: Ada buaya di sungai, tapi tenang aja. Yang paling nakal malah kera!
      ar_eg: فيه تماسيح في النهر، بس ما تخافش. أشقى حاجة هي القرود!
      ar: في النهر تماسيح، لكن لا تخف. أكثر المخلوقات شقاوة هي القردة!
      en: There are crocodiles in the river, but don't worry. The naughtiest are the monkeys!
