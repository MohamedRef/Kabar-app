schema: kabar.lesson/v1
id: bipa2.u05.l02
language: id
title: Potong, goreng, aduk
can_do:
  ar_eg: تدّي خطوات طبخ بسيطة.
  ar: أن تعطي خطوات طبخ بسيطة.
  en: Give basic cooking steps.
slides:
  - title: Memotong → Potong!
    body:
      ar_eg: |
        الأمر في الإندونيسي سهل جدًّا: خد فعل meN- وشيل البادئة، يفضل الجذر هو الأمر.
        - memotong → Potong! = قطّع!
        - menggoreng → Goreng! = اقلي!
        - mengaduk → Aduk! = قلّب!
        - mencuci → Cuci! = اغسل!
        - merebus → Rebus! = اسلق!
        زي العربي بالظبط: من «يقطّع» بنشيل حرف المضارعة ونقول «قطّع».
        في الشارع بيقولوا:
        - udah = sudah (خلاص، بقى)
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
      ar: |
        صيغة الأمر يسيرة: احذف سابقة meN- يبقَ الجذر، وهو الأمر.
        - memotong → Potong! = قطّع!
        - menggoreng → Goreng! = اقلِ!
        - mengaduk → Aduk! = قلّب!
        - mencuci → Cuci! = اغسل!
        - merebus → Rebus! = اسلق!
        كما نصوغ الأمر في العربية بحذف حرف المضارعة.
        في كلام الشارع:
        - udah = sudah (قد، بالفعل)
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
      en: |
        Commands are easy: take a meN- verb and drop the prefix; the root is the command.
        - memotong → Potong! = Cut!
        - menggoreng → Goreng! = Fry!
        - mengaduk → Aduk! = Stir!
        - mencuci → Cuci! = Wash!
        - merebus → Rebus! = Boil!
        Just like Arabic forms «قطّع» from «يقطّع» by dropping the prefix.
        On the street:
        - udah = sudah (already)
        - banget = sekali (very), after the adjective just like sekali
    grammar: id.imperative.basic
    examples:
      - text: Potong bawang merah, lalu goreng sampai harum.
        ar_eg: قطّع البصل الأحمر، وبعدين اقليه لحد ما ريحته تطلع.
        ar: قطّع البصل الأحمر ثم اقلِه حتى تفوح رائحته.
        en: Cut the shallots, then fry until fragrant.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: potong
        ar_eg: قطّع
        ar: قطّع
        en: cut
      - text: goreng
        ar_eg: اقلي
        ar: اقلِ
        en: fry
      - text: aduk
        ar_eg: قلّب
        ar: قلّب
        en: stir
      - text: cuci
        ar_eg: اغسل
        ar: اغسل
        en: wash
      - text: rebus
        ar_eg: اسلق
        ar: اسلق
        en: boil
    words: [potong, goreng, aduk, cuci, rebus]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الأمر من menggoreng (يقلي)؟
      ar: ما صيغة الأمر من menggoreng (يقلي)؟
      en: What is the command form of menggoreng (to fry)?
    options: [Mengoreng!, Menggoreng!, Goreng!]
    answer: 2
    explain:
      ar_eg: في الأمر بنشيل meN- (هنا meng-)، فيفضل الجذر goreng.
      ar: تُحذف meN- (وهي هنا meng-) فيبقى الجذر goreng.
      en: Drop meN- (here meng-) and you get the root goreng.
    words: [goreng]
  - id: e03
    type: listen
    text: Cuci bawang putih, lalu potong.
    options: ['Cuci bawang merah, lalu goreng.', 'Cuci bawang putih, lalu potong.', 'Potong bawang putih, lalu cuci.']
    answer: 1
    words: [cuci, bawang putih, potong]
  - id: e04
    type: fill_blank
    sentence: ___ bawang merah, lalu goreng sampai harum.
    meaning:
      ar_eg: قطّع البصل الأحمر، وبعدين اقليه لحد ما ريحته تطلع.
      ar: قطّع البصل الأحمر ثم اقلِه حتى تفوح رائحته.
      en: Cut the shallots, then fry until fragrant.
    options: [Memotong, Potong, Berpotong]
    answers: [Potong]
    explain:
      ar_eg: ده أمر، يبقى الجذر من غير meN-.
      ar: هذا أمر، فنستعمل الجذر بلا meN-.
      en: It's a command, so use the bare root.
    words: [potong, bawang merah, harum]
  - id: e05
    type: build_sentence
    source:
      ar_eg: اقلي البصل لحد ما ريحته تطلع.
      ar: اقلِ البصل حتى تفوح رائحته.
      en: Fry the onions until fragrant.
    answer: Goreng bawang sampai harum.
    distractors: [menggoreng, rebus]
    words: [goreng, bawang, sampai, harum]
    explain:
      ar_eg: "في الوصفات الأمر بالجذر من غير me-: Goreng! (اقلي). menggoreng = بيقلي (وصف مش أمر)، وrebus = اسلق."
      ar: "في الوصفات يأتي الأمر بالجذر بلا me-: Goreng!. أما menggoreng فوصف لا أمر، وrebus «اسلق»."
      en: "Recipes give orders with the bare root: Goreng! menggoreng describes rather than instructs; rebus means boil."
  - id: e06
    type: dictation
    text: Goreng telur dengan sedikit minyak.
    meaning:
      ar_eg: اقلي البيض بشوية زيت.
      ar: اقلِ البيض بقليل من الزيت.
      en: Fry the egg in a little oil.
    words: [goreng, minyak]
  - id: e07
    type: match_pairs
    pairs:
      - text: aduk
        ar_eg: قلّب
        ar: قلّب
        en: stir
      - text: cuci
        ar_eg: اغسل
        ar: اغسل
        en: wash
      - text: rebus
        ar_eg: اسلق
        ar: اسلق
        en: boil
      - text: bawang merah
        ar_eg: بصل أحمر صغير
        ar: شالوت
        en: shallot
      - text: bawang putih
        ar_eg: توم
        ar: ثوم
        en: garlic
      - text: minyak
        ar_eg: زيت
        ar: زيت
        en: oil
    words: [aduk, cuci, rebus, bawang merah, bawang putih, minyak]
  - id: e08
    type: listen
    text: Rebus air, lalu aduk.
    options: ['Rebus air, lalu aduk.', 'Goreng air, lalu aduk.', 'Rebus minyak, lalu cuci.']
    answer: 0
    meaning:
      ar_eg: اسلق المية، وبعدين قلّب.
      ar: اغلِ الماء ثم قلّب.
      en: Boil the water, then stir.
    words: [rebus, aduk, minyak, cuci]
  - id: e09
    type: fill_blank
    sentence: Bawang putih ini ___ sekali!
    meaning:
      ar_eg: التوم ده ريحته حلوة أوي!
      ar: رائحة هذا الثوم زكية جدًا!
      en: This garlic smells wonderful!
    options: [harum, minyak, rebus]
    answers: [harum]
    words: [bawang putih, harum]
    explain:
      ar_eg: harum = ريحته حلوة. minyak = زيت، وrebus = اسلق، ومش صفات.
      ar: harum = زكيّ الرائحة. أما minyak فزيت وrebus «اسلق».
      en: harum = fragrant. minyak is oil, rebus is boil; neither is an adjective.
  - id: e10
    type: speaking
    text: Rebus telur, lalu goreng bawang putih.
    meaning:
      ar_eg: اسلق البيض، وبعدين اقلي التوم.
      ar: اسلق البيض ثم اقلِ الثوم.
      en: Boil the eggs, then fry the garlic.
    words: [rebus, goreng, bawang putih]
dialogue:
  lines:
    - speaker: Bu Yanti
      text: Mohamed, cuci bawang putih, ya.
      ar_eg: محمد، اغسل التوم.
      ar: محمد، اغسل الثوم من فضلك.
      en: Mohamed, wash the garlic, please.
    - speaker: Mohamed
      text: Udah, Bu. Lalu?
      ar_eg: خلصت يا مدام. وبعدين؟
      ar: انتهيت يا سيدتي. ثم؟
      en: Done, ma'am. Then?
    - speaker: Bu Yanti
      text: Potong, lalu goreng dengan sedikit minyak.
      ar_eg: قطّعه، وبعدين اقليه في شوية زيت.
      ar: قطّعه، ثم اقلِه بقليل من الزيت.
      en: Cut it, then fry it in a little oil.
    - speaker: Mohamed
      text: Wah, harum banget, Bu!
      ar_eg: الله، ريحته حلوة قوي يا مدام!
      ar: رائحته زكية جدًّا يا سيدتي!
      en: Wow, it smells so good, ma'am!
