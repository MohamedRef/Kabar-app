schema: kabar.lesson/v1
id: bipa3.u02.l05
language: id
title: Menurut saya…
can_do:
  ar_eg: تقول رأيك، وتوافق أو تعترض بأدب في نقاش.
  ar: أن تعبّر عن رأيك وتوافق أو تعترض بأدب في نقاش.
  en: Give an opinion, agree and disagree politely.
slides:
  - title: Setuju atau kurang setuju?
    grammar: id.discussion.expressions
    body:
      ar_eg: |
        الرأي: Menurut saya, … = في رأيي، …
        الموافقة: Saya setuju dengan … / Saya sependapat = أنا موافق / رأيي زي رأيك.
        الاعتراض بأدب: Saya kurang setuju karena … = مش موافق أوي عشان … (حرفيًا: موافق أقل). أو Ada benarnya, tetapi … = عندك حق شوية، بس …
        في إندونيسيا النقاش هادي؛ «Kamu salah!» (انت غلطان!) بتبان قاسية جدًا.
      ar: |
        الرأي: Menurut saya, … = في رأيي، …
        الموافقة: Saya setuju dengan … / Saya sependapat = أوافق / أشاركك الرأي.
        الاعتراض المهذّب: Saya kurang setuju karena … = لا أوافق تمامًا لأن … أو Ada benarnya, tetapi … = في كلامك شيء من الصواب، لكن …
        النقاش في إندونيسيا هادئ، وعبارة «Kamu salah!» (أنت مخطئ!) تبدو قاسية جدًا.
      en: |
        Opinion: Menurut saya, … = In my opinion, …
        Agreeing: Saya setuju dengan … / Saya sependapat = I agree / I share that view.
        Disagreeing politely: Saya kurang setuju karena … = I don't quite agree, because … Or: Ada benarnya, tetapi … = That's partly true, but …
        Indonesian discussions stay calm; "Kamu salah!" (You're wrong!) sounds very harsh.
    examples:
      - text: Menurut saya, kantong plastik harus dilarang di Senggigi.
        ar_eg: في رأيي، أكياس البلاستيك لازم تتمنع في سنجيجي.
        ar: في رأيي، يجب منع الأكياس البلاستيكية في سنغيغي.
        en: In my opinion, plastic bags should be banned in Senggigi.
      - text: Saya kurang setuju karena banyak pedagang kecil memakai plastik.
        ar_eg: أنا مش موافق أوي، عشان تجار صغيرين كتير بيستعملوا البلاستيك.
        ar: لا أوافق تمامًا، لأنّ كثيرًا من صغار التجار يستعملون البلاستيك.
        en: I don't quite agree, because many small traders use plastic.
  - title: Musyawarah untuk mufakat
    grammar: id.discussion.expressions
    body:
      ar_eg: |
        تسأل غيرك: Bagaimana pendapat Anda? = إيه رأي حضرتك؟
        تقفل النقاش: Jadi, kesimpulannya, … = يعني في الآخر، …
        المبدأ الإندونيسي المشهور: musyawarah untuk mufakat = نتشاور لحد ما نتفق. musyawarah من «مشاورة» و mufakat من «موافقة»!
      ar: |
        لتسأل غيرك: Bagaimana pendapat Anda? = ما رأيك؟
        لتختم النقاش: Jadi, kesimpulannya, … = إذن، الخلاصة …
        والمبدأ الإندونيسي الشهير: musyawarah untuk mufakat = التشاور حتى الاتفاق؛ فـmusyawarah من «مشاورة» وmufakat من «موافقة».
      en: |
        To ask others: Bagaimana pendapat Anda? = What's your opinion?
        To wrap up: Jadi, kesimpulannya, … = So, to conclude, …
        The famous Indonesian principle: musyawarah untuk mufakat = consult until you agree. musyawarah is from Arabic «مشاورة» and mufakat from «موافقة».
    examples:
      - text: Bagaimana pendapat Anda, Pak Hamdi?
        ar_eg: إيه رأي حضرتك يا أستاذ حمدي؟
        ar: ما رأيك يا سيد حمدي؟
        en: What's your opinion, Pak Hamdi?
      - text: Jadi, kesimpulannya, kita harus mengurangi sampah plastik.
        ar_eg: يعني في الآخر، لازم نقلّل الزبالة البلاستيك.
        ar: إذن، الخلاصة أنه يجب أن نقلّل النفايات البلاستيكية.
        en: So, to conclude, we have to reduce plastic waste.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pendapat
        ar_eg: رأي
        ar: رأي
        en: opinion
      - text: sependapat
        ar_eg: رأيه زي رأيك
        ar: يشاركك الرأي
        en: of the same opinion
      - text: kurang setuju
        ar_eg: مش موافق أوي
        ar: غير موافق تمامًا
        en: don't quite agree
      - text: musyawarah
        ar_eg: تشاور
        ar: مشاورة
        en: deliberation, consultation
      - text: mufakat
        ar_eg: اتفاق، إجماع
        ar: اتفاق، إجماع
        en: consensus
      - text: kesimpulannya
        ar_eg: في الآخر، الخلاصة
        ar: الخلاصة
        en: in conclusion
    words: [pendapat, sependapat, kurang setuju, musyawarah, mufakat, kesimpulannya]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: انت مش موافق على كلام راكا، وعايز تقول ده بأدب. تقول إيه؟
      ar: لا توافق على كلام راكا وتريد أن تقول ذلك بأدب. ماذا تقول؟
      en: You don't agree with Raka and want to say so politely. What do you say?
    options: ["Kamu salah!", "Saya kurang setuju karena…", "Saya sependapat."]
    answer: 1
    explain:
      ar_eg: kurang setuju + السبب هي الطريقة المؤدبة. Kamu salah قاسية، و sependapat يعني موافق.
      ar: kurang setuju مع ذكر السبب هي الطريقة المهذّبة؛ وKamu salah قاسية، وsependapat تعني الموافقة.
      en: kurang setuju plus a reason is the polite way; Kamu salah is harsh, and sependapat means you agree.
    words: [kurang setuju]
  - id: e03
    type: listen
    text: Saya sependapat dengan Rina.
    options: ["Saya sependapat dengan Rina.", "Saya kurang setuju dengan Rina.", "Saya setuju dengan Raka."]
    answer: 0
    meaning:
      ar_eg: رأيي زي رأي رينا.
      ar: أشارك رينا رأيها.
      en: I share Rina's view.
    words: [sependapat]
  - id: e04
    type: multiple_choice
    question: Saya setuju ___ pendapat Rina.
    options: [kepada, untuk, dengan]
    answer: 2
    explain:
      ar_eg: setuju محتاجة dengan قبل الشخص أو الرأي.
      ar: يتعدى setuju بـdengan قبل الشخص أو الرأي.
      en: setuju takes dengan before the person or opinion.
    words: [pendapat]
  - id: e05
    type: fill_blank
    sentence: ___ saya, kantong plastik harus dilarang.
    meaning:
      ar_eg: في رأيي، أكياس البلاستيك لازم تتمنع.
      ar: في رأيي، يجب منع الأكياس البلاستيكية.
      en: In my opinion, plastic bags should be banned.
    options: [Pendapat, Menurut, Dengan]
    answers: [Menurut]
  - id: e06
    type: fill_blank
    sentence: Jadi, ___, kita semua harus membawa tas kain.
    meaning:
      ar_eg: يعني في الآخر، كلنا لازم نجيب شنط قماش.
      ar: إذن، الخلاصة أنّ علينا جميعًا أن نحمل حقائب قماشية.
      en: So, to conclude, we should all bring cloth bags.
    options: [musyawarah, kesimpulannya, sependapat]
    answers: [kesimpulannya]
    words: [kesimpulannya]
  - id: e07
    type: multiple_choice
    question: Musyawarah untuk ___.
    options: [mufakat, pendapat, kesimpulannya]
    answer: 0
    explain:
      ar_eg: "المبدأ: نتشاور (musyawarah) لحد ما نتفق (mufakat)."
      ar: "المبدأ: التشاور (musyawarah) حتى الاتفاق (mufakat)."
      en: 'The principle: consult (musyawarah) until you reach consensus (mufakat).'
    words: [musyawarah, mufakat]
  - id: e08
    type: build_sentence
    source:
      ar_eg: يعني في الآخر، لازم نقلّل الزبالة البلاستيك.
      ar: إذن، الخلاصة أنه يجب أن نقلّل النفايات البلاستيكية.
      en: So, to conclude, we must reduce plastic waste.
    answer: Jadi, kesimpulannya, kita harus mengurangi sampah plastik.
    distractors: [setuju, dengan]
    words: [kesimpulannya]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا مش موافق أوي على رأي راكا.
      ar: لا أوافق تمامًا على رأي راكا.
      en: I don't quite agree with Raka's opinion.
    answers:
      - Saya kurang setuju dengan pendapat Raka.
      - Saya kurang setuju dengan pendapat Raka
      - Aku kurang setuju dengan pendapat Raka.
      - Saya kurang setuju dengan Raka.
      - Saya kurang sependapat dengan Raka.
      - Maaf, saya kurang setuju dengan pendapat Raka.
    words: [kurang setuju, pendapat]
  - id: e10
    type: speaking
    text: Saya sependapat. Mari kita bermusyawarah sampai mufakat.
    meaning:
      ar_eg: أنا موافق. يلا نتشاور لحد ما نتفق.
      ar: أشاركك الرأي. هيا نتشاور حتى نتفق.
      en: I agree. Let's discuss it until we reach consensus.
    words: [sependapat, musyawarah, mufakat]
dialogue:
  title: Rapat warga Senggigi
  lines:
    - speaker: Pak Hamdi
      text: Bagaimana pendapat Anda tentang kantong plastik di pasar?
      ar_eg: إيه رأيكم في أكياس البلاستيك في السوق؟
      ar: ما رأيكم في الأكياس البلاستيكية في السوق؟
      en: What's your opinion on plastic bags at the market?
    - speaker: Rina
      text: Menurut saya, kantong plastik harus dilarang.
      ar_eg: في رأيي، أكياس البلاستيك لازم تتمنع.
      ar: في رأيي، يجب منع الأكياس البلاستيكية.
      en: In my opinion, plastic bags should be banned.
    - speaker: Raka
      text: Saya kurang setuju karena banyak pedagang kecil memakai plastik.
      ar_eg: أنا مش موافق أوي، عشان تجار صغيرين كتير بيستعملوا البلاستيك.
      ar: لا أوافق تمامًا، لأنّ كثيرًا من صغار التجار يستعملون البلاستيك.
      en: I don't quite agree, because many small traders use plastic.
    - speaker: Mohamed
      text: Ada benarnya, tetapi pedagang juga bisa memakai tas kain.
      ar_eg: عندك حق شوية، بس التجار كمان يقدروا يستعملوا شنط قماش.
      ar: في كلامك شيء من الصواب، لكنّ التجار يستطيعون أيضًا استعمال حقائب القماش.
      en: That's partly true, but traders can also use cloth bags.
    - speaker: Rina
      text: Saya sependapat dengan Mohamed.
      ar_eg: رأيي زي رأي محمد.
      ar: أشارك محمدًا رأيه.
      en: I agree with Mohamed.
    - speaker: Pak Hamdi
      text: Jadi, kesimpulannya, kita mengurangi plastik pelan-pelan. Musyawarah untuk mufakat!
      ar_eg: يعني في الآخر، هنقلّل البلاستيك واحدة واحدة. نتشاور لحد ما نتفق!
      ar: إذن، الخلاصة أن نقلّل البلاستيك تدريجيًا. التشاور حتى الاتفاق!
      en: So, to conclude, we'll cut down on plastic step by step. Consultation until consensus!
