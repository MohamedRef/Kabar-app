  - id: e03
    type: listen
    text: Pidato presiden itu didengar jutaan orang.
    question:
      ar_eg: الملايين سمعوا إيه؟
      ar: إلى ماذا استمع الملايين؟
      en: What did millions hear?
    options: [الخطبة, الأغنية, الكتاب]
    answer: 0
    meaning:
      ar_eg: خطبة الرئيس دي سمعها ملايين.
      ar: استمع ملايين الناس إلى خطاب الرئيس.
      en: Millions of people heard the president's speech.
    words: [pidato]
  - id: e04
    type: fill_blank
    sentence: Universitas itu punya ___ yang baik di seluruh dunia.
    meaning:
      ar_eg: الجامعة دي ليها ___ حلوة في العالم كله.
      ar: لتلك الجامعة ___ طيبة في العالم كله.
      en: That university has a good ___ all over the world.
    options: [reputasi, kehendak, pidato]
    answers: [reputasi]
    words: [reputasi, kehendak, pidato]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بنت صغيرة بترسم حلو أوي من غير ما تتعلم. هي إيه؟
      ar: طفلة ترسم ببراعة دون تعلّم. ما صفتها؟
      en: A little girl draws beautifully without lessons. What is she?
    options: [berbakat, sosok, kemanusiaan]
    answer: 0
    explain:
      ar_eg: berbakat = موهوب.
      ar: berbakat = موهوبة.
      en: berbakat = talented.
    words: [berbakat, sosok, kemanusiaan]
  - id: e06
    type: fill_blank
    sentence: Dokter itu mengobati orang miskin dengan gratis. Dia bekerja demi ___.
    meaning:
      ar_eg: الدكتور ده بيعالج الفقرا ببلاش. بيشتغل عشان ___.
      ar: يعالج ذلك الطبيب الفقراء مجانًا. إنه يعمل من أجل ___.
      en: That doctor treats poor people for free. He works for the sake of ___.
    options: [kemanusiaan, inspirasi, reputasi]
    answers: [kemanusiaan]
    words: [kemanusiaan, inspirasi, reputasi]
  - id: e07
    type: multiple_choice
    question: Di negara yang baik, pemimpin harus mengikuti ___ rakyat.
    options: [jenius, pidato, kehendak]
    answer: 2
    explain:
      ar_eg: kehendak rakyat = إرادة الشعب.
      ar: kehendak rakyat = إرادة الشعب.
      en: kehendak rakyat = the will of the people.
    words: [jenius, pidato, kehendak]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المهندس العبقري ده بقى إلهام لأولادي.
      ar: صار هذا المهندس العبقري مصدر إلهام لأولادي.
      en: That genius engineer became an inspiration to my children.
    answer: Insinyur jenius itu menjadi inspirasi anak-anak saya.
    distractors: [reputasi, sosok]
    words: [jenius, inspirasi, reputasi, sosok]
  - id: e09
    type: translate
    direction: from_target
    source_text: Dia sosok yang berbakat dan peduli pada kemanusiaan.
    answers_meaning:
      ar_eg: [هو شخصية موهوبة ومهتمة بالإنسانية, ده إنسان موهوب وبيهتم بالقيم الإنسانية]
      ar: [إنه شخصية موهوبة تهتمّ بالإنسانية, هو شخص موهوب يُعنى بالقيم الإنسانية]
      en: [He is a talented figure who cares about humanity, 'He''s a gifted person who cares about humanitarian values']
    words: [sosok, berbakat, kemanusiaan]
  - id: e10
    type: speaking
    text: Pidatonya penuh inspirasi tentang kehendak dan kerja keras.
    meaning:
      ar_eg: خطبته مليانة إلهام عن الإرادة والشغل الجامد.
      ar: خطابه مليء بالإلهام عن الإرادة والعمل الجادّ.
      en: His speech is full of inspiration about willpower and hard work.
    words: [pidato, inspirasi, kehendak, jenius, berbakat]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Mohamed, kita sudah dekat Parepare. Kamu tahu siapa yang lahir di sini?
      ar_eg: يا محمد، قرّبنا من باريباري. عارف مين اتولد هنا؟
      ar: يا محمد، اقتربنا من باريباري. أتعرف من وُلد هنا؟
      en: Mohamed, we're near Parepare. Do you know who was born here?
    - speaker: Mohamed
      text: B.J. Habibie! Insinyur pesawat yang jenius itu.
      ar_eg: حبيبي! مهندس الطيارات العبقري.
      ar: حبيبي! مهندس الطائرات العبقري.
      en: B.J. Habibie! That genius aircraft engineer.
    - speaker: Mas Rizal
      text: Betul. Dia belajar di Jerman dan punya reputasi besar di sana.
      ar_eg: صح. درس في ألمانيا وكان ليه سمعة كبيرة هناك.
      ar: صحيح. درس في ألمانيا وكانت له سمعة كبيرة هناك.
      en: Right. He studied in Germany and had a big reputation there.
    - speaker: Mohamed
      text: Sosoknya menjadi inspirasi banyak mahasiswa, termasuk saya.
      ar_eg: شخصيته ألهمت طلبة كتير، وأنا منهم.
      ar: صارت شخصيته مصدر إلهام لطلاب كثيرين، وأنا منهم.
      en: He's an inspiration to many students, me included.
    - speaker: Mas Rizal
      text: Saya suka pidatonya tentang teknologi dan kemanusiaan.
      ar_eg: أنا بحب خطبته عن التكنولوجيا والإنسانية.
      ar: أحبّ خطابه عن التكنولوجيا والإنسانية.
      en: I love his speech about technology and humanity.
