schema: kabar.lesson/v1
id: bipa4.u10.l06
language: id
title: Habibie dari Parepare
can_do:
  ar_eg: 'توصف شخصية ملهمة: موهبتها وسمعتها وأفكارها عن الإنسانية.'
  ar: 'أن تصف شخصية ملهمة: موهبتها وسمعتها وأفكارها الإنسانية.'
  en: 'Describe an inspiring figure: their talent, reputation and humanitarian ideas.'
slides:
  - title: Sosok yang menginspirasi
    body:
      ar_eg: |
        sosok = شخصية، شكل إنسان (sosok yang hebat)، inspirasi = إلهام، reputasi = سمعة.
        jenius = عبقري، berbakat = موهوب، kehendak = إرادة، رغبة (kehendak rakyat = إرادة الشعب).
        kemanusiaan = الإنسانية، pidato = خطبة، كلمة قدام الناس.
      ar: |
        sosok = شخصية، هيئة (sosok yang hebat)، inspirasi = إلهام، reputasi = سمعة.
        jenius = عبقري، berbakat = موهوب، kehendak = إرادة (kehendak rakyat = إرادة الشعب).
        kemanusiaan = الإنسانية، pidato = خطاب، خطبة.
      en: |
        sosok = figure, personality (sosok yang hebat); inspirasi = inspiration; reputasi = reputation.
        jenius = genius, berbakat = talented, kehendak = will, wish (kehendak rakyat = the will of the people).
        kemanusiaan = humanity, humanitarian values; pidato = speech.
    examples:
      - text: B.J. Habibie lahir di Parepare, Sulawesi Selatan.
        ar_eg: حبيبي اتولد في باريباري في جنوب سولاويزي.
        ar: وُلد حبيبي في باريباري بجنوب سولاويسي.
        en: B.J. Habibie was born in Parepare, South Sulawesi.
      - text: Dia insinyur pesawat yang jenius dan berbakat.
        ar_eg: كان مهندس طيارات عبقري وموهوب.
        ar: كان مهندس طائرات عبقريًا وموهوبًا.
        en: He was a brilliant, gifted aircraft engineer.
      - text: Sosoknya menjadi inspirasi bagi anak muda.
        ar_eg: شخصيته بقت إلهام للشباب.
        ar: صارت شخصيته مصدر إلهام للشباب.
        en: He became an inspiration to young people.
