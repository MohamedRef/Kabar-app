schema: kabar.lesson/v1
id: bipa5.u02.l11
language: id
title: Esai argumentasi
can_do:
  ar_eg: تكتب مقال قصير منظم فيه رأي وحجج واستنتاج.
  ar: أن تكتب مقالة قصيرة منظّمة فيها رأي وحجج وخاتمة.
  en: Write a short, organised essay with a thesis, arguments and a conclusion.
slides:
  - title: Tiga bagian esai
    grammar: id.argument.connectors
    body:
      ar_eg: |
        المقال الإندونيسي الرسمي له 3 أجزاء:
        - Pendahuluan (المقدمة): رأيك في جملة واحدة. Menurut penulis, … = في رأي الكاتب …
        - Isi (المتن): الحجج. Pertama, … Kedua, … Selain itu, …
        - Penutup (الخاتمة): Dengan demikian, … أو Oleh karena itu, …
        في المقالات الرسمية بيكتبوا penulis (الكاتب) بدل saya كتير.
      ar: |
        للمقالة الإندونيسية الرسمية ثلاثة أجزاء:
        - Pendahuluan (المقدّمة): رأيك في جملة. Menurut penulis, … = في رأي الكاتب …
        - Isi (المتن): الحجج. Pertama, … Kedua, … Selain itu, …
        - Penutup (الخاتمة): Dengan demikian, … أو Oleh karena itu, …
        وكثيرًا ما تُكتب penulis (الكاتب) بدل saya في المقالات الرسمية.
      en: |
        A formal Indonesian essay has three parts:
        - Pendahuluan (introduction): your thesis in one sentence. Menurut penulis, … = In the writer's view, …
        - Isi (body): the arguments. Pertama, … Kedua, … Selain itu, …
        - Penutup (conclusion): Dengan demikian, … or Oleh karena itu, …
        Formal essays often say penulis (the writer) instead of saya.
    examples:
      - text: Pertama, Jakarta sudah terlalu padat. Kedua, Kalimantan lebih aman dari gempa.
        ar_eg: أولًا، جاكرتا زحمة زيادة. تانيًا، كاليمانتان أأمن من الزلازل.
        ar: أولًا، جاكرتا مكتظّة جدًّا. ثانيًا، كاليمانتان أكثر أمانًا من الزلازل.
        en: First, Jakarta is already too crowded. Second, Kalimantan is safer from earthquakes.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pendahuluan
        ar_eg: مقدمة
        ar: مقدّمة
        en: introduction
      - text: penutup
        ar_eg: خاتمة
        ar: خاتمة
        en: conclusion
      - text: penulis
        ar_eg: الكاتب
        ar: الكاتب
        en: the writer
      - text: argumen
        ar_eg: حجة
        ar: حجّة
        en: argument
    words: [pendahuluan, penutup, penulis, argumen]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الجملة «Dengan demikian, pemindahan ibu kota perlu didukung.» مكانها فين في المقال؟
      ar: أين موضع الجملة «Dengan demikian, pemindahan ibu kota perlu didukung.» في المقالة؟
      en: Where does "Dengan demikian, pemindahan ibu kota perlu didukung." belong in the essay?
    options: [pendahuluan, isi, penutup]
    answer: 2
    explain:
      ar_eg: Dengan demikian بتستنتج، يبقى دي الخاتمة.
      ar: Dengan demikian للاستنتاج، فموضعها الخاتمة.
      en: Dengan demikian concludes, so it goes in the conclusion.
    words: [penutup]
  - id: e03
    type: build_sentence
    source:
      ar_eg: في رأي الكاتب، العاصمة الجديدة مهمة لإندونيسيا.
      ar: في رأي الكاتب، العاصمة الجديدة مهمّة لإندونيسيا.
      en: In the writer's view, the new capital is important for Indonesia.
    answer: Menurut penulis, ibu kota baru penting bagi Indonesia.
    distractors: [penutup, saya]
    words: [penulis]
  - id: e04
    type: fill_blank
    sentence: Argumen ___ adalah bahwa Jakarta sering banjir.
    meaning:
      ar_eg: الحجة الأولى إن جاكرتا بتغرق في الفيضانات كتير.
      ar: الحجّة الأولى أنّ جاكرتا تتعرّض للفيضانات كثيرًا.
      en: The first argument is that Jakarta floods often.
    options: [pertama, penutup, demikian]
    answers: [pertama]
    words: [argumen]
  - id: e05
    type: listen
    text: Dalam pendahuluan, penulis menyampaikan pendapatnya.
    question:
      ar_eg: الكاتب بيقول رأيه فين؟
      ar: أين يعرض الكاتب رأيه؟
      en: Where does the writer state their view?
    options:
      - في الخاتمة.
      - في المقدمة.
      - في العنوان بس.
    answer: 1
    words: [pendahuluan, penulis]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: في الخاتمة، الكاتب بيلخّص حججه.
      ar: في الخاتمة، يلخّص الكاتب حججه.
      en: In the conclusion, the writer summarises their arguments.
    answers:
      - Dalam penutup, penulis merangkum argumennya.
      - Di penutup, penulis merangkum argumennya.
      - Dalam penutup, penulis meringkas argumennya.
      - Pada penutup, penulis merangkum argumennya.
    words: [penutup, penulis, argumen]
  - id: e07
    type: dictation
    text: Pertama, pendahuluan harus singkat dan jelas.
    meaning:
      ar_eg: أولًا، المقدمة لازم تكون قصيرة وواضحة.
      ar: أولًا، يجب أن تكون المقدّمة موجزة وواضحة.
      en: First, the introduction must be short and clear.
    words: [pendahuluan]
  - id: e08
    type: speaking
    text: Argumen kedua saya adalah biaya yang terlalu besar.
    meaning:
      ar_eg: حجتي التانية هي التكلفة الكبيرة زيادة.
      ar: حجّتي الثانية هي التكلفة الباهظة.
      en: My second argument is the excessive cost.
    words: [argumen]
dialogue:
  title: Tugas menulis
  lines:
    - speaker: Bu Lestari
      text: Mohamed, esaimu bagus, tetapi pendahuluannya terlalu panjang.
      ar_eg: يا محمد، مقالك حلو، بس المقدمة طويلة زيادة.
      ar: يا محمد، مقالتك جيّدة، لكنّ مقدّمتها طويلة جدًّا.
      en: Mohamed, your essay is good, but the introduction is too long.
    - speaker: Mohamed
      text: Maaf, Bu. Jadi pendapat saya cukup satu kalimat saja?
      ar_eg: آسف يا أستاذة. يعني رأيي يكفيه جملة واحدة بس؟
      ar: عذرًا يا أستاذة. أيكفي أن أعرض رأيي في جملة واحدة؟
      en: Sorry, ma'am. So one sentence is enough for my view?
    - speaker: Bu Lestari
      text: Betul. Lalu tulis argumenmu di isi, satu per satu.
      ar_eg: مظبوط. وبعدين اكتب حججك في المتن، واحدة واحدة.
      ar: صحيح. ثم اكتب حججك في المتن واحدة تلو الأخرى.
      en: Right. Then write your arguments in the body, one by one.
    - speaker: Mohamed
      text: Dan penutupnya dimulai dengan "dengan demikian", ya, Bu?
      ar_eg: والخاتمة تبدأ بـ dengan demikian، صح يا أستاذة؟
      ar: وتبدأ الخاتمة بـ dengan demikian، أليس كذلك يا أستاذة؟
      en: And the conclusion starts with dengan demikian, right, ma'am?
    - speaker: Bu Lestari
      text: Ya. Penulis yang baik selalu menutup dengan jelas.
      ar_eg: أيوه. الكاتب الشاطر دايمًا يختم بوضوح.
      ar: نعم. الكاتب الجيّد يختم دائمًا بوضوح.
      en: Yes. A good writer always closes clearly.
new_words:
  - word: pendahuluan
    pos: noun
    ar_eg: مقدمة
    ar: مقدّمة
    en: introduction
  - word: penutup
    pos: noun
    ar_eg: خاتمة
    ar: خاتمة
    en: conclusion
review:
  status: draft
  verified: false
