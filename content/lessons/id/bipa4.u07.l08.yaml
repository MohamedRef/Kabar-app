schema: kabar.lesson/v1
id: bipa4.u07.l08
language: id
title: Susah tidur
can_do:
  ar_eg: تتكلم عن التوتر وقلة النوم والاكتئاب وتشجّع حد يروح لمعالج.
  ar: أن تتحدث عن القلق والأرق والاكتئاب وتشجّع شخصًا على العلاج النفسي.
  en: Talk about anxiety, poor sleep and depression, and encourage someone to see a therapist.
slides:
  - title: Kesehatan jiwa juga penting
    body:
      ar_eg: |
        gelisah = قلقان ومش مرتاح، kelelahan = تعب شديد، إرهاق، nyenyak = نوم عميق (tidur nyenyak).
        bernapas / bernafas = يتنفّس (الاتنين صح)، menenangkan = يهدّي (musik yang menenangkan).
        depresi = اكتئاب، trauma = صدمة نفسية، terapi = علاج (terapi bicara = علاج بالكلام).
      ar: |
        gelisah = قلِق مضطرب، kelelahan = إرهاق شديد، nyenyak = عميق (tidur nyenyak = نوم عميق).
        bernapas / bernafas = يتنفّس (الصيغتان صحيحتان)، menenangkan = يُهدّئ (musik yang menenangkan).
        depresi = اكتئاب، trauma = صدمة نفسية، terapi = علاج (terapi bicara = العلاج بالكلام).
      en: |
        gelisah = restless, anxious; kelelahan = exhaustion; nyenyak = sound (tidur nyenyak = sleep soundly).
        bernapas / bernafas = to breathe (both spellings are used); menenangkan = to calm, soothe (musik yang menenangkan).
        depresi = depression, trauma = trauma, terapi = therapy (terapi bicara = talking therapy).
    examples:
      - text: Sejak gempa itu, dia sering gelisah di malam hari.
        ar_eg: من ساعة الزلزال ده، بيبقى قلقان كتير بالليل.
        ar: منذ ذلك الزلزال وهو يقلق كثيرًا في الليل.
        en: Since that earthquake, he's often restless at night.
      - text: Tarik napas, lalu bernapas pelan-pelan.
        ar_eg: خد نفس، وبعدين اتنفّس بالراحة.
        ar: خذ نفسًا ثم تنفّس ببطء.
        en: Take a breath, then breathe slowly.
      - text: Terapi bisa membantu orang dengan depresi.
        ar_eg: العلاج ممكن يساعد الناس اللي عندهم اكتئاب.
        ar: قد يساعد العلاج المصابين بالاكتئاب.
        en: Therapy can help people with depression.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gelisah
        ar_eg: قلقان
        ar: قلِق
        en: restless
      - text: kelelahan
        ar_eg: تعب شديد
        ar: إرهاق
        en: exhaustion
      - text: nyenyak
        ar_eg: نوم عميق
        ar: عميق (نوم)
        en: sound (sleep)
      - text: bernapas
        ar_eg: يتنفّس
        ar: يتنفّس
        en: to breathe
    words: [gelisah, kelelahan, nyenyak, bernapas]
  - id: e02
    type: match_pairs
    pairs:
      - text: menenangkan
        ar_eg: يهدّي
        ar: يُهدّئ
        en: to calm
      - text: depresi
        ar_eg: اكتئاب
        ar: اكتئاب
        en: depression
      - text: trauma
        ar_eg: صدمة نفسية
        ar: صدمة نفسية
        en: trauma
      - text: terapi
        ar_eg: علاج
        ar: علاج
        en: therapy
    words: [menenangkan, depresi, trauma, terapi]
  - id: e03
    type: listen
    text: Dia pingsan karena kelelahan dan tidak makan.
    question:
      ar_eg: حصله إيه؟
      ar: ماذا حدث له؟
      en: What happened to him?
    options: [أغمى عليه, نام كويس, اتنفّس]
    answer: 0
    meaning:
      ar_eg: أغمى عليه من التعب وعشان ما كلش.
      ar: أُغمي عليه من الإرهاق وعدم الأكل.
      en: He fainted from exhaustion and not eating.
    words: [pingsan, kelelahan]
  - id: e04
    type: fill_blank
    sentence: Udara di kamar ini panas. Saya sulit ___.
    meaning:
      ar_eg: الهوا في الأوضة دي حر. صعب عليّ ___.
      ar: الهواء في هذه الغرفة حارّ. يصعب عليّ ___.
      en: The air in this room is hot. It's hard to ___.
    options: [bernapas, menenangkan, terapi]
    answers: [bernapas]
    words: [bernapas, menenangkan, terapi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: نمت كويس أوي امبارح. بالإندونيسي؟
      ar: نمت جيدًا جدًا أمس. بالإندونيسية؟
      en: I slept really well last night. In Indonesian?
    options: [Tidur saya gelisah., Tidur saya nyenyak., Tidur saya trauma.]
    answer: 1
    explain:
      ar_eg: tidur nyenyak = نوم عميق ومريح.
      ar: tidur nyenyak = نوم عميق.
      en: tidur nyenyak = sound sleep.
    words: [gelisah, nyenyak, trauma]
  - id: e06
    type: fill_blank
    sentence: Setelah kecelakaan itu, anak itu punya ___. Dia takut naik mobil.
    meaning:
      ar_eg: بعد الحادثة دي، الولد عنده ___. بيخاف يركب عربية.
      ar: بعد ذلك الحادث أصيب الطفل بـ ___، فصار يخاف ركوب السيارة.
      en: After that accident, the child has ___. He's scared to ride in cars.
    options: [trauma, kelelahan, nyenyak]
    answers: [trauma]
    words: [trauma, kelelahan, nyenyak]
  - id: e07
    type: multiple_choice
    question: Dia sedih setiap hari selama berbulan-bulan. Mungkin dia ___.
    options: [menenangkan, nyenyak, depresi]
    answer: 2
    explain:
      ar_eg: depresi = اكتئاب، زعل طويل.
      ar: depresi = اكتئاب.
      en: depresi = depression.
    words: [menenangkan, nyenyak, depresi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: العلاج ساعدني أنام كويس.
      ar: ساعدني العلاج على النوم العميق.
      en: Therapy helped me sleep soundly.
    answer: Terapi membantu saya tidur nyenyak.
    distractors: [gelisah, depresi]
    words: [terapi, nyenyak, gelisah, depresi]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kalau gelisah, duduk dan bernapas pelan-pelan.
    answers_meaning:
      ar_eg: [لو قلقان، اقعد واتنفّس بالراحة, لو حاسس بقلق اقعد وخد نفسك بهدوء]
      ar: [إذا شعرت بالقلق فاجلس وتنفّس ببطء, عند القلق اجلس وتنفّس بهدوء]
      en: ['If you feel anxious, sit down and breathe slowly', 'When restless, sit and breathe slowly']
    words: [gelisah, bernapas]
  - id: e10
    type: speaking
    text: Kelelahan dan trauma bisa diobati dengan terapi.
    meaning:
      ar_eg: التعب الشديد والصدمة ممكن يتعالجوا بالعلاج.
      ar: يمكن معالجة الإرهاق والصدمة بالعلاج.
      en: Exhaustion and trauma can be treated with therapy.
    words: [kelelahan, trauma, terapi, menenangkan, depresi]
dialogue:
  lines:
    - speaker: Mohamed
      text: Kak Nurul, mukamu pucat. Kamu sakit?
      ar_eg: يا نورول، وشك أصفر. إنتي عيانة؟
      ar: يا نورول، وجهك شاحب. هل أنتِ مريضة؟
      en: Nurul, you look pale. Are you ill?
    - speaker: Nurul
      text: Aku kelelahan. Udah seminggu aku nggak tidur nyenyak.
      ar_eg: أنا تعبانة خالص. بقالي أسبوع ما نمتش كويس.
      ar: أنا مرهقة. لم أنم نومًا عميقًا منذ أسبوع.
      en: I'm exhausted. I haven't slept properly for a week.
    - speaker: Mohamed
      text: Kenapa? Ada masalah di kantor?
      ar_eg: ليه؟ فيه مشكلة في الشغل؟
      ar: لماذا؟ هل هناك مشكلة في العمل؟
      en: Why? Is something wrong at work?
    - speaker: Nurul
      text: Banyak. Malam-malam aku gelisah, kadang susah bernapas.
      ar_eg: كتير. بالليل ببقى قلقانة، وساعات بيبقى صعب أتنفّس.
      ar: مشكلات كثيرة. أقلق ليلًا، وأحيانًا يصعب عليّ التنفّس.
      en: Lots. At night I'm restless, and sometimes it's hard to breathe.
    - speaker: Mohamed
      text: Jangan tunggu sampai pingsan. Coba datang ke ahli terapi, ya.
      ar_eg: ما تستنيش لحد ما يغمى عليكي. جرّبي تروحي لمعالج نفسي.
      ar: لا تنتظري حتى يُغمى عليك. جرّبي زيارة معالج نفسي.
      en: Don't wait until you faint. Try seeing a therapist, OK?
