dialogue:
  lines:
    - speaker: Bu Yanti
      text: Mohamed, ini kamar kamu.
      ar_eg: يا محمد، دي أوضتك.
      ar: يا محمد، هذه غرفتك.
      en: Mohamed, this is your room.
    - speaker: Mohamed
      text: Terima kasih, Bu! Kamarnya rapi.
      ar_eg: شكرًا يا طنط! الأوضة مترتبة.
      ar: شكرًا يا سيدتي! الغرفة مرتّبة.
      en: Thank you! The room is tidy.
    - speaker: Bu Yanti
      text: Ada tempat tidur, meja, dan lampu.
      ar_eg: فيه سرير وترابيزة ولمبة.
      ar: فيها سرير وطاولة ومصباح.
      en: There's a bed, a table and a lamp.
    - speaker: Mohamed
      text: Cerminnya di mana, Bu?
      ar_eg: والمراية فين يا طنط؟
      ar: وأين المرآة يا سيدتي؟
      en: Where's the mirror?
    - speaker: Bu Yanti
      text: Di kamar mandi, di dinding. Ada sabun dan handuk juga.
      ar_eg: في الحمام، على الحيطة. وفيه صابون وفوطة كمان.
      ar: في الحمّام على الجدار، وهناك صابون ومنشفة أيضًا.
      en: In the bathroom, on the wall. There's soap and a towel too.
    - speaker: Mohamed
      text: Bu, ada kucing di dalam kotak ini!
      ar_eg: يا طنط، فيه قطة جوه العلبة دي!
      ar: يا سيدتي، في هذا الصندوق قطّة!
      en: There's a cat inside this box!
