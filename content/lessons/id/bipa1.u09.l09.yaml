schema: kabar.lesson/v1
id: bipa1.u09.l09
language: id
title: Di kamar saya
can_do:
  ar_eg: 'توصف أوضتك والحمام: السرير واللمبة والمراية والصابون والفوطة.'
  ar: 'أن تصف غرفتك والحمّام: السرير والمصباح والمرآة والصابون والمنشفة.'
  en: 'Describe your room and bathroom: bed, lamp, mirror, soap and towel.'
slides:
  - title: Kamar dan kamar mandi
    body:
      ar_eg: |
        tempat tidur = سرير (حرفيًا «مكان النوم»). lampu = لمبة أو نور. cermin = مراية. dinding = حيطة. kotak = علبة أو صندوق.
        في الحمام: sabun = صابون (من العربي!) وhanduk = فوطة (من الهولندي).
        rapi = متروّق ومترتّب.
      ar: |
        tempat tidur = سرير (حرفيًا «مكان النوم»). lampu = مصباح. cermin = مرآة. dinding = جدار. kotak = علبة، صندوق.
        في الحمّام: sabun = صابون (من العربية!) وhanduk = منشفة (من الهولندية).
        rapi = مرتّب.
      en: |
        tempat tidur = bed (literally "place to sleep"). lampu = lamp, light. cermin = mirror. dinding = wall. kotak = box.
        In the bathroom: sabun = soap (from Arabic!) and handuk = towel (from Dutch).
        rapi = tidy.
    examples:
      - text: Di kamar mandi ada sabun dan handuk.
        ar_eg: في الحمام فيه صابون وفوطة.
        ar: في الحمّام صابون ومنشفة.
        en: There's soap and a towel in the bathroom.
      - text: Cermin itu di dinding, di atas meja.
        ar_eg: المراية على الحيطة، فوق الترابيزة.
        ar: المرآة على الجدار فوق الطاولة.
        en: The mirror is on the wall, above the table.
      - text: Kamar saya kecil, tapi rapi.
        ar_eg: أوضتي صغيرة بس مترتبة.
        ar: غرفتي صغيرة لكنها مرتّبة.
        en: My room is small but tidy.
