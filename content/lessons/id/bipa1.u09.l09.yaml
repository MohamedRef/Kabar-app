      ar_eg: السرير جنب الباب.
      ar: السرير بجانب الباب.
      en: The bed is next to the door.
    answer: Tempat tidur di samping pintu.
    distractors: [lampu, rapi]
    words: [tempat tidur]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ada lampu kecil di samping tempat tidur.
    answers_meaning:
      ar_eg: [فيه لمبة صغيرة جنب السرير, فيه أباجورة صغيرة جنب السرير]
      ar: [بجانب السرير مصباح صغير, هناك مصباح صغير بجوار السرير]
      en: ['There''s a small lamp next to the bed', There is a little lamp beside the bed]
    words: [lampu, tempat tidur]
  - id: e09
