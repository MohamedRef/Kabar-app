      ar: ماذا في الحمّام؟
      en: What's in the bathroom?
    options: [صابون وفوطة, سرير ولمبة, مراية وعلبة]
    answer: 0
    meaning:
      ar_eg: في الحمام فيه صابون وفوطة.
      ar: في الحمّام صابون ومنشفة.
      en: There's soap and a towel in the bathroom.
    words: [sabun, handuk]
  - id: e04
    type: fill_blank
    sentence: Kucing saya tidur di dalam ___.
    meaning:
      ar_eg: القطة بتاعتي نايمة جوه ___.
      ar: قطّتي نائمة داخل ___.
      en: My cat is sleeping inside a ___.
