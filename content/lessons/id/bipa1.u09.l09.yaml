    options: [cermin, kotak, handuk]
    answer: 0
    explain:
      ar_eg: 'بتشوف وشك في المراية: cermin.'
      ar: 'ترى وجهك في المرآة: cermin.'
      en: 'You see your face in a mirror: cermin.'
