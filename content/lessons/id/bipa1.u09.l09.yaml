      ar: غرفتك مرتّبة وكل شيء في مكانه. هي…؟
      en: Your room is neat, everything in its place. It's…?
    options: [rapi, dinding, kotak]
    answer: 0
    explain:
      ar_eg: rapi = مترتّب.
      ar: rapi = مرتّب.
      en: rapi = tidy.
    words: [rapi, dinding, kotak]
  - id: e06
