  - id: e03
    type: listen
    text: Maaf, stok kue labu sudah habis.
    question:
      ar_eg: كيكة القرع مالها؟
      ar: ما خبر كعك القرع؟
      en: What about the pumpkin cakes?
    options: [خلصت, لسه بتتعمل, ببلاش]
    answer: 0
    meaning:
      ar_eg: آسفين، كيكة القرع خلصت.
      ar: عذرًا، نفد مخزون كعك القرع.
      en: Sorry, the pumpkin cakes are sold out.
    words: [stok, labu]
  - id: e04
    type: fill_blank
    sentence: Sambal ini pedas sekali karena banyak ___-nya.
    meaning:
      ar_eg: الصلصة دي حامية أوي عشان فيها ___ كتير.
      ar: هذه الصلصة حارة جدًا لكثرة ___ فيها.
      en: This sambal is very hot because it has lots of ___.
    options: [cabe, udang, lelang]
    answers: [cabe]
    words: [cabe, udang, lelang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بيع بيتعلى فيه السعر لحد ما أعلى واحد ياخد البضاعة. اسمه إيه؟
      ar: بيع يرتفع فيه السعر حتى يأخذ أعلى مزايد البضاعة. ما اسمه؟
      en: A sale where the price rises until the highest bidder wins. What is it?
    options: [pasokan, lelang, wangi]
    answer: 1
    explain:
      ar_eg: lelang = مزاد.
      ar: lelang = مزاد.
      en: lelang = auction.
    words: [pasokan, lelang, wangi]
  - id: e06
    type: fill_blank
    sentence: Nasi kuning ini ___ sekali, baunya seperti daun pandan.
    meaning:
      ar_eg: الرز الأصفر ده ___ أوي، ريحته زي ورق الباندان.
      ar: هذا الأرز الأصفر ___ جدًا، رائحته كورق الباندان.
      en: This yellow rice is so ___; it smells of pandan leaves.
    options: [wangi, stok, dagang]
    answers: [wangi]
    words: [wangi, stok, dagang]
  - id: e07
    type: multiple_choice
    question: Karena jalan rusak, ___ sayur ke kota terlambat.
    options: [labu, cabe, pasokan]
    answer: 2
    explain:
      ar_eg: pasokan = توريد، إمدادات.
      ar: pasokan = إمداد.
      en: pasokan = supply.
    words: [labu, cabe, pasokan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الجمبري ده جاي من المزاد الصبح.
      ar: جاء هذا الروبيان من مزاد الصباح.
      en: These prawns are from this morning's auction.
    answer: Udang ini dari lelang tadi pagi.
    distractors: [stok, cabe]
    words: [udang, lelang]
  - id: e09
    type: translate
    direction: from_target
    source_text: Barang dagangannya sudah habis sebelum jam sembilan.
    answers_meaning:
      ar_eg: [بضاعته خلصت قبل الساعة تسعة, باع كل بضاعته قبل تسعة]
      ar: [نفدت بضاعته قبل التاسعة, بيعت كل بضاعتها قبل الساعة التاسعة]
      en: [His goods were sold out before nine, 'She sold all her goods before nine o''clock']
    words: [dagang]
  - id: e10
    type: speaking
    text: Stok udang menipis karena pasokan dari laut berkurang.
    meaning:
      ar_eg: ستوك الجمبري بيقل عشان التوريد من البحر قل.
      ar: يتناقص مخزون الروبيان لأن الإمداد من البحر قلّ.
      en: Prawn stock is running low because supply from the sea has dropped.
    words: [stok, udang, pasokan]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Ayo naik klotok. Pasar terapung paling rame pagi-pagi.
      ar_eg: يلا نركب المركب. السوق العايم بيبقى في عزه بدري الصبح.
      ar: هيّا نركب القارب. السوق العائمة في أوج نشاطها صباحًا.
      en: Let's get on the boat. The floating market is busiest early in the morning.
    - speaker: Mohamed
      text: Wah, wangi banget! Itu kue apa, Bu?
      ar_eg: الله، الريحة حلوة أوي! دي كيكة إيه؟
      ar: ما أزكى الرائحة! ما هذه الكعكة؟
      en: Mmm, that smells amazing! What cake is that?
    - speaker: Penjual
      text: Kue labu, Pak. Tinggal tiga, stoknya udah mau habis.
      ar_eg: كيكة قرع يا أستاذ. فاضل تلاتة بس، الستوك قرب يخلص.
      ar: كعك القرع يا سيّدي. بقيت ثلاث، والمخزون يوشك أن ينفد.
      en: Pumpkin cake, sir. Only three left, almost sold out.
    - speaker: Mohamed
      text: Saya ambil semua, Bu. Ibu jual udang sama cabe juga?
      ar_eg: هاخدهم كلهم. حضرتك بتبيعي جمبري وشطة كمان؟
      ar: سآخذها كلها. هل تبيعين الروبيان والفلفل الحار أيضًا؟
      en: I'll take all three. Do you sell prawns and chillies too?
    - speaker: Penjual
      text: Udang hari ini dikit, Pak. Pasokan dari laut berkurang, jadi harganya naik di lelang.
      ar_eg: الجمبري النهارده قليل. التوريد من البحر قل، فسعره علي في المزاد.
      ar: الروبيان قليل اليوم. قلّ الإمداد من البحر فارتفع سعره في المزاد.
      en: Few prawns today. Supply from the sea dropped, so the price went up at auction.
    - speaker: Mas Rizal
      text: "Ya gitu dagang di sungai: semuanya tergantung air sama cuaca."
      ar_eg: 'هي دي التجارة على النهر: كله على حسب المية والجو.'
      ar: 'هكذا التجارة على النهر: كل شيء رهن الماء والطقس.'
      en: 'That''s river trading: it all depends on the water and the weather.'
