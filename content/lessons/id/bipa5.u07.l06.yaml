schema: kabar.lesson/v1
id: bipa5.u07.l06
language: id
title: Berdagang di atas perahu
can_do:
  ar_eg: 'تتكلم في السوق العايم: التجارة والمزاد والمخزون والتوريد، والجمبري والقرع والشطة، والريحة الحلوة.'
  ar: 'أن تتحدث في السوق العائمة: التجارة والمزاد والمخزون والإمداد، والروبيان والقرع والفلفل الحار، والرائحة الزكية.'
  en: 'Talk at the floating market: trading, auctions, stock and supply, prawns, pumpkin and chillies, and lovely smells.'
slides:
  - title: Pasar Lok Baintan
    body:
      ar_eg: |
        dagang = تجارة، بضاعة: berdagang = يتاجر، pedagang = تاجر.
        lelang = مزاد، stok = مخزون، ستوك: stoknya habis = الستوك خلص، pasokan = توريد، إمدادات.
        udang = جمبري، labu = قرع، cabe = شطة، فلفل حامي (والكتابة الرسمية cabai).
        wangi = ريحته حلوة: kue ini wangi pandan = الكيكة دي ريحتها باندان.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: rame = ramai، banget = sekali، udah = sudah، dikit = sedikit، gitu = begitu.
      ar: |
        dagang = تجارة، بضاعة: berdagang = يتاجر، pedagang = تاجر.
        lelang = مزاد، stok = مخزون: stoknya habis = نفد المخزون، pasokan = إمداد، توريد.
        udang = روبيان، labu = قرع، cabe = فلفل حار (والمعيارية cabai).
        wangi = عطِر، زكيّ الرائحة: kue ini wangi pandan = لهذه الكعكة رائحة الباندان.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: rame = ramai، banget = sekali، udah = sudah، dikit = sedikit، gitu = begitu.
      en: |
        dagang = trade, goods: berdagang = to trade, pedagang = trader.
        lelang = auction, stok = stock: stoknya habis = sold out, pasokan = supply.
        udang = prawn, shrimp, labu = pumpkin, squash, cabe = chilli (standard spelling cabai).
        wangi = fragrant: kue ini wangi pandan = this cake smells of pandan.
        The dialogue uses street forms; the formal ones are beside them: rame = ramai, banget = sekali, udah = sudah, dikit = sedikit, gitu = begitu.
    examples:
      - text: Pedagang di Lok Baintan berdagang dari perahu sejak pagi-pagi.
        ar_eg: التجار في لوك باينتان بيبيعوا من المراكب من بدري.
        ar: يتاجر باعة لوك باينتان من قواربهم منذ الصباح الباكر.
        en: Traders at Lok Baintan sell from their boats from early morning.
      - text: Pasokan udang dari laut berkurang karena cuaca buruk.
        ar_eg: توريد الجمبري من البحر قل عشان الجو وحش.
        ar: قلّ إمداد الروبيان من البحر بسبب سوء الطقس.
        en: The supply of prawns from the sea fell because of bad weather.
      - text: Ikan segar dijual lewat lelang di pelabuhan.
        ar_eg: السمك الطازة بيتباع في مزاد في الميناء.
        ar: يُباع السمك الطازج بالمزاد في الميناء.
        en: Fresh fish is sold at auction in the port.
