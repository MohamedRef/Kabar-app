  - id: e03
    type: listen
    text: Kapal kami tiba di pelabuhan jam tujuh pagi.
    question:
      ar_eg: المركب وصل إمتى؟
      ar: متى وصلت السفينة؟
      en: When did the boat arrive?
    options: [الساعة ٧ الصبح, الساعة ٧ بالليل, الساعة ١٠]
    answer: 0
    meaning:
      ar_eg: المركب بتاعنا وصل المينا الساعة ٧ الصبح.
      ar: وصلت سفينتنا إلى الميناء في السابعة صباحًا.
      en: Our boat arrived at the harbour at seven in the morning.
    words: [tiba]
  - id: e04
    type: fill_blank
    sentence: Snorkeling di laut? Saya ___!
    meaning:
      ar_eg: سنوركلينج في البحر؟ أنا ___!
      ar: الغطس في البحر؟ أنا ___!
      en: Snorkelling in the sea? I ___!
    options: [berani, dewasa, ide]
    answers: [berani]
    words: [berani, dewasa, ide]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كسبت تذكرة ببلاش لجزيرة حلوة. إنت…؟
      ar: ربحت تذكرة مجانية إلى جزيرة جميلة. أنت…؟
      en: You won a free ticket to a beautiful island. You're…?
    options: [beruntung, berani, nyata]
    answer: 0
    explain:
      ar_eg: beruntung = محظوظ.
      ar: beruntung = محظوظ.
      en: beruntung = lucky.
    words: [beruntung, berani, nyata]
  - id: e06
    type: fill_blank
    sentence: Foto ini ___ liburan saya di Bali.
    meaning:
      ar_eg: الصورة دي ___ من إجازتي في بالي.
      ar: هذه الصورة ___ من عطلتي في بالي.
      en: This photo is a ___ of my holiday in Bali.
    options: [kenangan, ide, tiba]
    answers: [kenangan]
    words: [kenangan, ide, tiba]
  - id: e07
    type: build_sentence
    source:
      ar_eg: دي فكرة حلوة!
      ar: هذه فكرة جميلة!
      en: That's a good idea!
    answer: Itu ide yang bagus!
    distractors: [nyata, tiba]
    words: [ide]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ini mimpi atau nyata?
    answers_meaning:
      ar_eg: [ده حلم ولا حقيقة؟, أنا بحلم ولا ده بجد؟]
      ar: [أهذا حلم أم حقيقة؟, هل هذا حلم أم واقع؟]
      en: ['Is this a dream or real?', 'Is this a dream or reality?']
    words: [nyata]
  - id: e09
    type: speaking
    text: Saya beruntung, saya punya banyak kenangan indah.
    meaning:
      ar_eg: أنا محظوظ، عندي ذكريات حلوة كتير.
      ar: أنا محظوظ، فلديّ ذكريات جميلة كثيرة.
      en: 'I''m lucky: I have lots of beautiful memories.'
    words: [beruntung, kenangan]
  - id: e10
    type: multiple_choice
    question: Dia bukan anak-anak lagi. Dia sudah ___.
    options: [dewasa, beruntung, tiba]
    answer: 0
    explain:
      ar_eg: 'مبقاش عيل، بقى كبير: dewasa.'
      ar: 'لم يعد طفلًا، صار راشدًا: dewasa.'
      en: 'No longer a child, he''s grown up: dewasa.'
    words: [dewasa, beruntung, tiba]
dialogue:
  lines:
    - speaker: Mohamed
      text: Kapal kita tiba jam berapa?
      ar_eg: مركبنا هيوصل الساعة كام؟
      ar: متى تصل سفينتنا؟
      en: What time does our boat arrive?
    - speaker: Raka
      text: Jam sepuluh. Setelah itu kita snorkeling! Kamu berani?
      ar_eg: الساعة عشرة. وبعدين نعمل سنوركلينج! تقدر؟
      ar: في العاشرة، وبعدها نغطس! أتجرؤ؟
      en: At ten. After that we go snorkelling! Do you dare?
    - speaker: Mohamed
      text: Berani! Ini pertama kali aku snorkeling.
      ar_eg: أقدر! دي أول مرة أعمل سنوركلينج.
      ar: نعم! هذه أوّل مرة أغطس فيها.
      en: I dare! It's my first time snorkelling.
    - speaker: Raka
      text: 'Ide bagus: kita memotret ikan di laut!'
      ar_eg: 'فكرة حلوة: نصوّر السمك في البحر!'
      ar: 'فكرة جميلة: نصوّر السمك في البحر!'
      en: 'Good idea: we''ll photograph fish in the sea!'
    - speaker: Mohamed
      text: Lautnya indah banget. Ini mimpi atau nyata?
      ar_eg: البحر جميل أوي. أنا بحلم ولا ده بجد؟
      ar: البحر جميل جدًا. أهذا حلم أم حقيقة؟
      en: The sea is so beautiful. Is this a dream or real?
    - speaker: Raka
      text: Nyata! Kita beruntung. Ini kenangan yang indah.
      ar_eg: بجد! إحنا محظوظين. دي ذكرى حلوة.
      ar: حقيقة! نحن محظوظون، وهذه ذكرى جميلة.
      en: Real! We're lucky. This is a beautiful memory.
