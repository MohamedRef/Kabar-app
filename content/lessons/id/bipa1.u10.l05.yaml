        ar: محظوظ
        en: lucky
      - text: ide
        ar_eg: فكرة
        ar: فكرة
        en: idea
    words: [tiba, berani, beruntung, ide]
  - id: e02
    type: match_pairs
    pairs:
      - text: kenangan
        ar_eg: ذكرى
        ar: ذكرى
        en: memory
      - text: dewasa
