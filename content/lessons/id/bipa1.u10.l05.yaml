schema: kabar.lesson/v1
id: bipa1.u10.l05
language: id
title: Kenangan di laut
can_do:
  ar_eg: 'تحكي عن تجربة: إمتى وصلت، وكنت جريء ولا محظوظ، والذكرى اللي فضلت معاك.'
  ar: 'أن تروي تجربة: متى وصلت، وهل كنت جريئًا أو محظوظًا، والذكرى التي بقيت.'
  en: 'Tell an experience: when you arrived, whether you were brave or lucky, and the memory it left.'
slides:
  - title: Pengalaman di laut
    body:
      ar_eg: |
        tiba = يوصل (أرسمي من datang وsampai): «Kapal tiba di pelabuhan.»
        berani = جريء أو يجرؤ: «Kamu berani?» = تقدر تعملها؟
        beruntung = محظوظ (untung = حظ). ide = فكرة: «Ide bagus!»
        kenangan = ذكرى، من kenang (يفتكر بحنين). dewasa = كبير، بالغ. nyata = حقيقي: «Ini mimpi atau nyata?»
      ar: |
        tiba = يصل (أرسم من datang وsampai): «Kapal tiba di pelabuhan.»
        berani = جريء أو يجرؤ: «Kamu berani?» = أتجرؤ؟
        beruntung = محظوظ (untung = حظ). ide = فكرة: «Ide bagus!»
        kenangan = ذكرى، من kenang (يتذكّر بحنين). dewasa = راشد، بالغ. nyata = حقيقي: «Ini mimpi atau nyata?»
      en: |
        tiba = arrive (more formal than datang or sampai): "Kapal tiba di pelabuhan."
        berani = brave, dare: "Kamu berani?" = Do you dare?
        beruntung = lucky (untung = luck). ide = idea: "Ide bagus!"
        kenangan = memory, from kenang (remember fondly). dewasa = adult, grown-up. nyata = real: "Ini mimpi atau nyata?"
    examples:
      - text: Kapal kami tiba di pelabuhan jam tujuh pagi.
        ar_eg: المركب بتاعنا وصل المينا الساعة ٧ الصبح.
        ar: وصلت سفينتنا إلى الميناء في السابعة صباحًا.
        en: Our boat arrived at the harbour at seven in the morning.
      - text: Kamu berani snorkeling? — Berani!
        ar_eg: تقدر تعمل سنوركلينج؟ — أقدر!
        ar: أتجرؤ على الغطس السطحي؟ — نعم!
        en: Dare to go snorkelling? — I dare!
      - text: Foto ini kenangan liburan saya.
        ar_eg: الصورة دي ذكرى من إجازتي.
        ar: هذه الصورة ذكرى من عطلتي.
        en: This photo is a memory of my holiday.
