      ar_eg: أنهي مركّب معناه حرفيًا «عين مية» زي العربي؟
      ar: أيّ مركّب يعني حرفيًا «عين ماء» كما في العربية؟
      en: Which compound literally means «عين ماء» (eye of water), as in Arabic?
    options: [rumah makan, kereta api, mata air]
    answer: 2
    words: [mata air, kereta api, rumah makan]
  - id: e04
