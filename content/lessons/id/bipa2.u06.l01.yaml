schema: kabar.lesson/v1
id: bipa2.u06.l01
language: id
title: Kamar mandi dan kamar tidur
can_do:
  ar_eg: تسمّي أوض البيت بالأسماء المركّبة.
  ar: أن تسمّي غرف البيت بالأسماء المركّبة.
  en: Name rooms with compounds.
slides:
  - title: Kamar + mandi = حمّام
    body:
      ar_eg: |
        اسمين ورا بعض بيعملوا كلمة جديدة، زي «أوضة النوم» عندنا:
        - kamar mandi (أوضة + استحمام) = حمّام
        - kamar tidur (أوضة + نوم) = أوضة نوم
        - ruang tamu (مكان + ضيف) = الصالون / أوضة الضيوف
        - rumah sakit (بيت + عيان) = مستشفى
        - rumah makan (بيت + أكل) = مطعم
        الكلمة الأولى هي الأساس، والتانية بتقول نوعها.
        في الشارع بيقولوا:
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
      ar: |
        اسمان متتاليان يكوّنان كلمة جديدة، كالإضافة في «غرفة النوم»:
        - kamar mandi (غرفة + استحمام) = حمّام
        - kamar tidur (غرفة + نوم) = غرفة نوم
        - ruang tamu (مكان + ضيف) = غرفة الضيوف
        - rumah sakit (بيت + مريض) = مستشفى
        - rumah makan (بيت + أكل) = مطعم
        الاسم الأول هو الأصل، والثاني يحدّد نوعه.
        في كلام الشارع:
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
      en: |
        Two nouns side by side make a new word, like "bedroom":
        - kamar mandi (room + bathe) = bathroom
        - kamar tidur (room + sleep) = bedroom
        - ruang tamu (space + guest) = living room
        - rumah sakit (house + sick) = hospital
        - rumah makan (house + eat) = restaurant
        The first noun is the core; the second says what kind.
        On the street:
        - banget = sekali (very), after the adjective just like sekali
    grammar: id.noun.compound
    examples:
      - text: Kamar tidur saya kecil, tetapi bersih.
        ar_eg: أوضة نومي صغيرة بس نضيفة.
        ar: غرفة نومي صغيرة لكنها نظيفة.
        en: My bedroom is small but clean.
      - text: Rumah sakit itu dekat dengan kos saya.
        ar_eg: المستشفى دي قريبة من السكن بتاعي.
        ar: ذلك المستشفى قريب من سكني.
        en: That hospital is near my boarding house.
  - title: Kamar mandi saya
    body:
      ar_eg: |
        المركّب بيتعامل كأنه كلمة واحدة، فماتقطعهوش. صاحبه وini / itu و-nya بييجوا في الآخر خالص:
        - kamar mandi saya = حمّامي (مش kamar saya mandi ✗)
        - ruang tamu itu = الصالون ده
        - Kamar mandinya di mana? = الحمّام فين؟
      ar: |
        يُعامل المركّب معاملة الكلمة الواحدة فلا يُفصل بين جزأيه، ويأتي المالك وini / itu و-nya في آخره:
        - kamar mandi saya = حمّامي (لا kamar saya mandi ✗)
        - ruang tamu itu = غرفة الضيوف تلك
        - Kamar mandinya di mana? = أين الحمّام؟
      en: |
        A compound behaves like one word, so don't split it. Owners, ini / itu and -nya go at the very end:
        - kamar mandi saya = my bathroom (not kamar saya mandi ✗)
        - ruang tamu itu = that living room
        - Kamar mandinya di mana? = Where's the bathroom?
    grammar: id.noun.compound
    examples:
      - text: Kamar mandinya di mana?
        ar_eg: الحمّام فين؟
        ar: أين الحمّام؟
        en: Where's the bathroom?
      - text: Ruang tamu Bu Yanti besar sekali.
        ar_eg: صالون مدام يانتي كبير قوي.
        ar: غرفة ضيوف السيدة يانتي كبيرة جدًّا.
        en: Bu Yanti's living room is very big.
  - title: Mata air = عين ماء
    body:
      ar_eg: |
        مركّبات تانية مفيدة:
        - meja makan (ترابيزة + أكل) = السفرة
        - kereta api (عربية + نار) = القطر
        - mata air (عين + مية) = ينبوع، زي «عين مية» بالعربي حرفيًا!
        وفي الجمع بتكرر الكلمة الأولى بس: rumah-rumah sakit = مستشفيات.
      ar: |
        مركّبات أخرى مفيدة:
        - meja makan (طاولة + أكل) = مائدة الطعام
        - kereta api (عربة + نار) = القطار
        - mata air (عين + ماء) = ينبوع، وهي «عين الماء» حرفيًا!
        وفي الجمع يُكرَّر الجزء الأول وحده: rumah-rumah sakit = مستشفيات.
      en: |
        More useful compounds:
        - meja makan (table + eat) = dining table
        - kereta api (carriage + fire) = train
        - mata air (eye + water) = spring, literally Arabic «عين ماء»!
        For plurals, repeat only the first part: rumah-rumah sakit = hospitals.
    grammar: id.noun.compound
    examples:
      - text: Di Bali tidak ada kereta api.
        ar_eg: في بالي مافيش قطر.
        ar: لا يوجد قطار في بالي.
        en: There are no trains in Bali.
      - text: Meja makan kami di dapur.
        ar_eg: السفرة بتاعتنا في المطبخ.
        ar: مائدتنا في المطبخ.
        en: Our dining table is in the kitchen.
