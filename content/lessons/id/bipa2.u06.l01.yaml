dialogue:
  title: Rumah Bu Yanti di Sanur
  lines:
    - speaker: Bu Yanti
      text: Selamat datang, Pak Mohamed. Ini ruang tamu.
      ar_eg: أهلًا بيك يا أستاذ محمد. ده الصالون.
      ar: أهلًا بك يا سيد محمد. هذه غرفة الضيوف.
      en: Welcome, Mr Mohamed. This is the living room.
    - speaker: Mohamed
      text: Besar banget, Bu! Kamar tidur saya di mana?
      ar_eg: كبير قوي يا مدام! أوضة نومي فين؟
      ar: كبيرة جدًّا يا سيدتي! أين غرفة نومي؟
      en: It's very big, ma'am! Where's my bedroom?
    - speaker: Bu Yanti
      text: Di sana, di sebelah dapur.
      ar_eg: هناك، جنب المطبخ.
      ar: هناك، بجانب المطبخ.
      en: Over there, next to the kitchen.
    - speaker: Mohamed
      text: Kamar mandinya di mana?
      ar_eg: والحمّام فين؟
      ar: وأين الحمّام؟
      en: Where's the bathroom?
    - speaker: Bu Yanti
      text: Di dalam kamar tidur. Meja makan di dapur, ya.
      ar_eg: جوّه أوضة النوم. والسفرة في المطبخ.
      ar: داخل غرفة النوم. ومائدة الطعام في المطبخ.
      en: Inside the bedroom. And the dining table is in the kitchen.
    - speaker: Mohamed
      text: Bagus banget. Terima kasih, Bu!
      ar_eg: حلو قوي. شكرًا يا مدام!
      ar: رائع جدًّا. شكرًا يا سيدتي!
      en: Very nice. Thank you, ma'am!
