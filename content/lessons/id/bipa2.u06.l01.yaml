schema: kabar.lesson/v1
id: bipa2.u06.l01
language: id
title: Kamar mandi dan kamar tidur
can_do:
  ar_eg: تسمّي أوض البيت بالأسماء المركّبة.
  ar: أن تسمّي غرف البيت بالأسماء المركّبة.
  en: Name rooms with compounds.
slides:
  - title: Kamar + mandi = حمّام
    body:
      ar_eg: |
        اسمين ورا بعض بيعملوا كلمة جديدة، زي «أوضة النوم» عندنا:
        - kamar mandi (أوضة + استحمام) = حمّام
        - kamar tidur (أوضة + نوم) = أوضة نوم
        - ruang tamu (مكان + ضيف) = الصالون / أوضة الضيوف
        - rumah sakit (بيت + عيان) = مستشفى
        - rumah makan (بيت + أكل) = مطعم
        الكلمة الأولى هي الأساس، والتانية بتقول نوعها.
      ar: |
        اسمان متتاليان يكوّنان كلمة جديدة، كالإضافة في «غرفة النوم»:
        - kamar mandi (غرفة + استحمام) = حمّام
        - kamar tidur (غرفة + نوم) = غرفة نوم
        - ruang tamu (مكان + ضيف) = غرفة الضيوف
        - rumah sakit (بيت + مريض) = مستشفى
        - rumah makan (بيت + أكل) = مطعم
        الاسم الأول هو الأصل، والثاني يحدّد نوعه.
      en: |
        Two nouns side by side make a new word, like "bedroom":
        - kamar mandi (room + bathe) = bathroom
        - kamar tidur (room + sleep) = bedroom
        - ruang tamu (space + guest) = living room
        - rumah sakit (house + sick) = hospital
        - rumah makan (house + eat) = restaurant
        The first noun is the core; the second says what kind.
    grammar: id.noun.compound
    examples:
      - text: Kamar tidur saya kecil, tetapi bersih.
        ar_eg: أوضة نومي صغيرة بس نضيفة.
        ar: غرفة نومي صغيرة لكنها نظيفة.
        en: My bedroom is small but clean.
      - text: Rumah sakit itu dekat dengan kos saya.
        ar_eg: المستشفى دي قريبة من السكن بتاعي.
        ar: ذلك المستشفى قريب من سكني.
        en: That hospital is near my boarding house.
  - title: Kamar mandi saya
    body:
      ar_eg: |
        المركّب بيتعامل كأنه كلمة واحدة، فماتقطعهوش. صاحبه وini / itu و-nya بييجوا في الآخر خالص:
        - kamar mandi saya = حمّامي (مش kamar saya mandi ✗)
        - ruang tamu itu = الصالون ده
        - Kamar mandinya di mana? = الحمّام فين؟
      ar: |
        يُعامل المركّب معاملة الكلمة الواحدة فلا يُفصل بين جزأيه، ويأتي المالك وini / itu و-nya في آخره:
        - kamar mandi saya = حمّامي (لا kamar saya mandi ✗)
        - ruang tamu itu = غرفة الضيوف تلك
        - Kamar mandinya di mana? = أين الحمّام؟
      en: |
        A compound behaves like one word, so don't split it. Owners, ini / itu and -nya go at the very end:
        - kamar mandi saya = my bathroom (not kamar saya mandi ✗)
        - ruang tamu itu = that living room
        - Kamar mandinya di mana? = Where's the bathroom?
    grammar: id.noun.compound
    examples:
      - text: Kamar mandinya di mana?
        ar_eg: الحمّام فين؟
        ar: أين الحمّام؟
        en: Where's the bathroom?
      - text: Ruang tamu Bu Sari besar sekali.
        ar_eg: صالون مدام ساري كبير قوي.
        ar: غرفة ضيوف السيدة ساري كبيرة جدًّا.
        en: Bu Sari's living room is very big.
  - title: Mata air = عين ماء
    body:
      ar_eg: |
        مركّبات تانية مفيدة:
        - meja makan (ترابيزة + أكل) = السفرة
        - kereta api (عربية + نار) = القطر
        - mata air (عين + مية) = ينبوع، زي «عين مية» بالعربي حرفيًا!
        وفي الجمع بتكرر الكلمة الأولى بس: rumah-rumah sakit = مستشفيات.
      ar: |
        مركّبات أخرى مفيدة:
        - meja makan (طاولة + أكل) = مائدة الطعام
        - kereta api (عربة + نار) = القطار
        - mata air (عين + ماء) = ينبوع، وهي «عين الماء» حرفيًا!
        وفي الجمع يُكرَّر الجزء الأول وحده: rumah-rumah sakit = مستشفيات.
      en: |
        More useful compounds:
        - meja makan (table + eat) = dining table
        - kereta api (carriage + fire) = train
        - mata air (eye + water) = spring, literally Arabic «عين ماء»!
        For plurals, repeat only the first part: rumah-rumah sakit = hospitals.
    grammar: id.noun.compound
    examples:
      - text: Di Bali tidak ada kereta api.
        ar_eg: في بالي مافيش قطر.
        ar: لا يوجد قطار في بالي.
        en: There are no trains in Bali.
      - text: Meja makan kami di dapur.
        ar_eg: السفرة بتاعتنا في المطبخ.
        ar: مائدتنا في المطبخ.
        en: Our dining table is in the kitchen.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kamar mandi
        ar_eg: حمّام
        ar: حمّام
        en: bathroom
      - text: kamar tidur
        ar_eg: أوضة نوم
        ar: غرفة نوم
        en: bedroom
      - text: ruang tamu
        ar_eg: صالون
        ar: غرفة الضيوف
        en: living room
      - text: rumah sakit
        ar_eg: مستشفى
        ar: مستشفى
        en: hospital
      - text: rumah makan
        ar_eg: مطعم
        ar: مطعم
        en: restaurant
    words: [kamar mandi, kamar tidur, ruang tamu, rumah sakit, rumah makan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إنت عيان قوي ومحتاج دكتور. تروح فين؟
      ar: أنت مريض جدًّا وتحتاج إلى طبيب. إلى أين تذهب؟
      en: You're very ill and need a doctor. Where do you go?
    options: ["ruang tamu", "rumah sakit", "rumah makan"]
    answer: 1
    words: [rumah sakit]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «حمّامي»؟
      ar: كيف تقول «حمّامي»؟
      en: How do you say "my bathroom"?
    options: ["saya kamar mandi", "kamar mandi saya", "kamar saya mandi"]
    answer: 1
    explain:
      ar_eg: ماتقطعش المركّب؛ saya بتيجي بعد kamar mandi كلها.
      ar: لا يُفصل المركّب، ويأتي saya بعده كاملًا.
      en: Don't split the compound; saya comes after the whole of kamar mandi.
    words: [kamar mandi]
  - id: e04
    type: listen
    text: Kamar mandinya di mana?
    options: ["Ruang tamunya di mana?", "Kamar tidurnya di mana?", "Kamar mandinya di mana?"]
    answer: 2
    words: [kamar mandi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي مركّب معناه حرفيًا «عين مية» زي العربي؟
      ar: أيّ مركّب يعني حرفيًا «عين ماء» كما في العربية؟
      en: Which compound literally means «عين ماء» (eye of water), as in Arabic?
    options: ["kamar mandi", "kereta api", "mata air"]
    answer: 2
    words: [mata air]
  - id: e06
    type: fill_blank
    sentence: Kami makan malam di meja ___.
    meaning:
      ar_eg: إحنا بنتعشّى على السفرة.
      ar: نتناول العشاء على مائدة الطعام.
      en: We have dinner at the dining table.
    options: ["tidur", "makan", "mandi"]
    answers: [makan]
    words: [meja makan]
  - id: e07
    type: fill_blank
    sentence: Kamar ___ saya kecil, tetapi bersih.
    meaning:
      ar_eg: أوضة نومي صغيرة بس نضيفة.
      ar: غرفة نومي صغيرة لكنها نظيفة.
      en: My bedroom is small but clean.
    options: ["tamu", "mandi", "tidur"]
    answers: [tidur]
    words: [kamar tidur]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المستشفى دي قريبة من السكن بتاعي.
      ar: ذلك المستشفى قريب من سكني.
      en: That hospital is near my boarding house.
    answer: Rumah sakit itu dekat dengan kos saya.
    distractors: [makan, ini]
    words: [rumah sakit, kos]
  - id: e09
    type: build_sentence
    source:
      ar_eg: أوضة نومي جنب الحمّام.
      ar: غرفة نومي بجانب الحمّام.
      en: My bedroom is next to the bathroom.
    answer: Kamar tidur saya di sebelah kamar mandi.
    distractors: [tamu, makan]
    words: [kamar tidur, kamar mandi]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الحمّام فين؟
      ar: أين الحمّام؟
      en: Where is the bathroom?
    answers:
      - Kamar mandinya di mana?
      - Kamar mandinya di mana
      - Kamar mandi di mana?
      - Kamar mandi di mana
      - Di mana kamar mandinya?
      - Di mana kamar mandi?
      - Di mana kamar mandinya
      - Di mana kamar mandi
    words: [kamar mandi]
  - id: e11
    type: translate
    direction: from_target
    source_text: Ruang tamu Bu Sari besar dan bersih.
    answers_meaning:
      ar_eg: ["صالون مدام ساري كبير ونضيف.", "أوضة الضيوف بتاعة مدام ساري كبيرة ونضيفة"]
      ar: ["غرفة ضيوف السيدة ساري كبيرة ونظيفة.", "صالة السيدة ساري واسعة ونظيفة"]
      en: ["Bu Sari's living room is big and clean.", "Mrs Sari's living room is big and clean"]
    words: [ruang tamu]
  - id: e12
    type: dictation
    text: Rumah makan itu di depan rumah sakit.
    meaning:
      ar_eg: المطعم ده قدّام المستشفى.
      ar: ذلك المطعم أمام المستشفى.
      en: That restaurant is in front of the hospital.
    words: [rumah makan, rumah sakit]
  - id: e13
    type: speaking
    text: Kamar mandi saya di dalam kamar tidur.
    meaning:
      ar_eg: الحمّام بتاعي جوّه أوضة النوم.
      ar: حمّامي داخل غرفة النوم.
      en: My bathroom is inside the bedroom.
    words: [kamar mandi, kamar tidur]
dialogue:
  title: Rumah Bu Sari di Sanur
  lines:
    - speaker: Bu Sari
      text: Selamat datang, Pak Mohamed. Ini ruang tamu.
      ar_eg: أهلًا بيك يا أستاذ محمد. ده الصالون.
      ar: أهلًا بك يا سيد محمد. هذه غرفة الضيوف.
      en: Welcome, Mr Mohamed. This is the living room.
    - speaker: Mohamed
      text: Besar sekali, Bu! Kamar tidur saya di mana?
      ar_eg: كبير قوي يا مدام! أوضة نومي فين؟
      ar: كبيرة جدًّا يا سيدتي! أين غرفة نومي؟
      en: It's very big, ma'am! Where's my bedroom?
    - speaker: Bu Sari
      text: Di sana, di sebelah dapur.
      ar_eg: هناك، جنب المطبخ.
      ar: هناك، بجانب المطبخ.
      en: Over there, next to the kitchen.
    - speaker: Mohamed
      text: Kamar mandinya di mana?
      ar_eg: والحمّام فين؟
      ar: وأين الحمّام؟
      en: Where's the bathroom?
    - speaker: Bu Sari
      text: Di dalam kamar tidur. Meja makan di dapur, ya.
      ar_eg: جوّه أوضة النوم. والسفرة في المطبخ.
      ar: داخل غرفة النوم. ومائدة الطعام في المطبخ.
      en: Inside the bedroom. And the dining table is in the kitchen.
    - speaker: Mohamed
      text: Bagus sekali. Terima kasih, Bu!
      ar_eg: حلو قوي. شكرًا يا مدام!
      ar: رائع جدًّا. شكرًا يا سيدتي!
      en: Very nice. Thank you, ma'am!
