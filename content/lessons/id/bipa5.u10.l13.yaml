schema: kabar.lesson/v1
id: bipa5.u10.l13
language: id
title: Ulangan Unit 10
can_do:
  ar_eg: تقدّم تقرير بالبيانات وبوجهة نظرك، في كلام مرتّب ورسمي.
  ar: أن تقدّم تقريرًا بالبيانات ووجهة نظرك، بكلام مرتّب ورسمي.
  en: Present a report with data and your point of view, clearly and formally.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: laporan
        ar_eg: تقرير
        ar: تقرير
        en: report
      - text: kesimpulan
        ar_eg: خلاصة / استنتاج
        ar: خلاصة
        en: conclusion
      - text: grafik
        ar_eg: رسم بياني
        ar: رسم بياني
        en: chart, graph
      - text: hadirin
        ar_eg: الحاضرين
        ar: الحضور
        en: audience
      - text: toleransi
        ar_eg: تسامح
        ar: تسامح
        en: tolerance
    words: [laporan, kesimpulan, grafik, hadirin, toleransi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الاسم من turun؟
      ar: ما الاسم من turun؟
      en: What is the noun from turun?
    options: [diturunkan, menurunkan, penurunan]
    answer: 2
    words: [penurunan]
  - id: e03
    type: fill_blank
    sentence: ___ data, jumlah wisatawan meningkat setiap tahun.
    meaning:
      ar_eg: بناءً على البيانات، عدد السياح بيزيد كل سنة.
      ar: بناءً على البيانات، يزداد عدد السيّاح كلّ عام.
      en: Based on the data, tourist numbers rise every year.
    options: [Berdasarkan, Sebagai penutup, Pertama-tama]
    answers: [Berdasarkan]
    words: [berdasarkan, meningkat]
  - id: e04
    type: listen
    text: Sebagai penutup, saya menyarankan festival kecil setiap bulan.
    question:
      ar_eg: المتكلم بيقترح إيه؟
      ar: ماذا يقترح المتكلّم؟
      en: What does the speaker suggest?
    options:
      - مهرجان صغير كل شهر.
      - يلغوا المهرجان.
      - فندق جديد.
    answer: 0
    words: [sebagai penutup]
  - id: e05
    type: build_sentence
    source:
      ar_eg: البحث ده بيعرض بيانات عن زيارات السياح.
      ar: يعرض هذا البحث بيانات عن زيارات السيّاح.
      en: This study presents data on tourist visits.
    answer: Penelitian ini menyajikan data tentang kunjungan wisatawan.
    distractors: [hadirin, rukun]
    words: [penelitian, menyajikan, kunjungan]
  - id: e06
    type: listen
    text: Saya merekomendasikan parade Cap Go Meh; barongsainya paling menarik perhatian.
    question:
      ar_eg: إيه أكتر حاجة بتلفت النظر؟
      ar: ما أكثر ما يلفت الانتباه؟
      en: What draws the most attention?
    options: [رقصة الأسد, الأكل, البحر]
    answer: 0
    meaning:
      ar_eg: بوصي باستعراض كاب جو ميه؛ رقصة الأسد أكتر حاجة بتلفت النظر.
      ar: أوصي باستعراض كاب غو ميه؛ رقصة الأسد أكثر ما يلفت الانتباه.
      en: I recommend the Cap Go Meh parade; the lion dance draws the most attention.
    words: [merekomendasikan, parade, barongsai, menarik perhatian]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: في المتوسط، عدد الزوار قلّ بعد المهرجان.
      ar: في المتوسّط، انخفض عدد الزوّار بعد المهرجان.
      en: On average, visitor numbers fell after the festival.
    answers:
      - Rata-rata, jumlah pengunjung menurun setelah festival.
      - Rata-rata jumlah pengunjung menurun setelah festival.
      - Rata-rata, jumlah pengunjung turun setelah festival.
      - Setelah festival, rata-rata jumlah pengunjung menurun.
    words: [rata-rata, jumlah, menurun]
  - id: e08
    type: match_pairs
    pairs:
      - text: susunan
        ar_eg: ترتيب
        ar: بنية
        en: structure
      - text: kecenderungan
        ar_eg: اتجاه عام
        ar: اتجاه عام
        en: trend
      - text: kelenteng
        ar_eg: معبد صيني
        ar: معبد صيني
        en: Chinese temple
      - text: benua
        ar_eg: قارة
        ar: قارة
        en: continent
      - text: rinci
        ar_eg: بالتفصيل
        ar: مفصّل
        en: detailed
    words: [susunan, kecenderungan, kelenteng, benua, rinci]
  - id: e09
    type: dictation
    text: Apakah ada pertanyaan tentang kenaikan harga ini?
    meaning:
      ar_eg: فيه أسئلة عن زيادة الأسعار دي؟
      ar: هل من أسئلة عن ارتفاع الأسعار هذا؟
      en: Are there any questions about this price rise?
    words: [pertanyaan, kenaikan]
  - id: e10
    type: speaking
    text: Hadirin yang saya hormati, saya menyimpulkan bahwa toleransi adalah kekuatan Singkawang.
    meaning:
      ar_eg: حضراتكم المحترمين، أنا بستنتج إن التسامح هو قوة سينجكاوانج.
      ar: أيّها الحضور الكرام، أستنتج أنّ التسامح هو قوّة سينغكاوانغ.
      en: Distinguished audience, I conclude that tolerance is Singkawang's strength.
    words: [hadirin, menyimpulkan, toleransi]
  - id: e11
    type: fill_blank
    sentence: Kami ___ hutan Kalimantan dengan kompas dan penuh percaya diri.
    meaning:
      ar_eg: ___ غابة كاليمانتان بالبوصلة وبثقة كاملة.
      ar: ___ غابة كاليمانتان بالبوصلة وبثقة تامة.
      en: We ___ the Kalimantan forest with a compass, full of confidence.
    options: [menjelajahi, mengacu, menonjol]
    answers: [menjelajahi]
    words: [menjelajahi, mengacu, menonjol, kompas, percaya diri]
  - id: e12
    type: multiple_choice
    question: Dalam presentasi itu, penjualan ___ terjadi pada bulan Desember, yang terendah pada bulan puasa.
    options: [terbanyak, sekilas, dupa]
    answer: 0
    explain:
      ar_eg: terbanyak = الأكتر.
      ar: terbanyak = الأكثر.
      en: terbanyak = the most.
    words: [terbanyak, sekilas, dupa, terendah, presentasi]
dialogue:
  title: Malam Cap Go Meh
  lines:
    - speaker: Rina
      text: Mohamed, lihat lampion dan naganya! Semua orang ikut merayakan.
      ar_eg: يا محمد، بص على الفوانيس والتنين! الكل بيحتفل.
      ar: يا محمد، انظر إلى الفوانيس والتنّين! الجميع يحتفلون.
      en: Mohamed, look at the lanterns and the dragon! Everyone's celebrating.
    - speaker: Mohamed
      text: Ada tatung Tionghoa dan juga tatung Dayak. Ini data terbaik untuk laporan saya.
      ar_eg: فيه tatung صينيين وكمان tatung داياك. دي أحسن بيانات لتقريري.
      ar: هناك tatung صينيون وtatung من الداياك أيضًا. هذه أفضل بيانات لتقريري.
      en: There are Chinese tatung and Dayak tatung too. This is the best data for my report.
    - speaker: Rina
      text: Jadi apa kesimpulanmu?
      ar_eg: يعني إيه خلاصتك؟
      ar: إذن ما خلاصتك؟
      en: So what's your conclusion?
    - speaker: Mohamed
      text: Keberagaman bukan masalah. Di sini, keberagaman adalah perayaan.
      ar_eg: التنوّع مش مشكلة. هنا التنوّع احتفال.
      ar: التنوّع ليس مشكلة، بل هو هنا احتفال.
      en: Diversity isn't a problem. Here, diversity is a celebration.
souvenir:
  id: bipa5.u10.souvenir
  title: Cap Go Meh di Singkawang
  note:
    ar_eg: Cap Go Meh معناها «الليلة الخمستاشر» بلهجة هوكيين، وهي آخر يوم في احتفالات رأس السنة الصيني. في سينجكاوانج، اللي بيسموها «مدينة الألف معبد»، الموكب فيه فوانيس وتنانين، وفيه tatung، ناس في حالة غيبوبة طقسية، منهم صينيين ومنهم داياك. والملايو والداياك والصينيين بيتفرجوا ويحتفلوا مع بعض، وعشان كده الموكب بقى رمز للتسامح.
    ar: Cap Go Meh تعني «الليلة الخامسة عشرة» بلهجة هوكيين، وهي ختام احتفالات رأس السنة الصينية. وفي سينغكاوانغ، الملقّبة «مدينة الألف معبد»، يضمّ الموكب فوانيس وتنانين ومؤدّين يسمّون tatung في حالة نشوة طقسية، بعضهم صينيون وبعضهم من الداياك. ويحتفل الملايو والداياك والصينيون معًا، فصار الموكب رمزًا للتسامح.
    en: Cap Go Meh means "fifteenth night" in Hokkien, the last day of Chinese New Year celebrations. In Singkawang, nicknamed the "city of a thousand temples", the parade has lanterns, dragons and tatung, performers in a ritual trance, some Chinese and some Dayak. Malays, Dayaks and Chinese celebrate together, which has made the parade a symbol of tolerance.
