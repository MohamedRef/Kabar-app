      - text: duta besar
        ar_eg: سفير
        ar: سفير
        en: ambassador
      - text: kementerian
        ar_eg: وزارة
        ar: وزارة
        en: ministry
      - text: pernyataan
        ar_eg: بيان
        ar: بيان
        en: statement
    words: [mengumumkan, duta besar, kementerian, pernyataan]
  - id: e02
    type: match_pairs
    pairs:
      - text: otoritas
        ar_eg: سلطة رسمية
        ar: سلطة
        en: authority
      - text: politisi
        ar_eg: سياسي
        ar: سياسي
        en: politician
      - text: komite
        ar_eg: لجنة
        ar: لجنة
        en: committee
      - text: dirilis
