  - id: e03
    type: listen
    text: Otoritas bandara mengumumkan penerbangan ke Kairo terlambat.
    question:
      ar_eg: مين اللي أعلن؟
      ar: من الذي أعلن؟
      en: Who made the announcement?
    options: [سلطة المطار, السفارة, الوزارة]
    answer: 0
    meaning:
      ar_eg: سلطة المطار أعلنت إن الطيارة للقاهرة متأخرة.
      ar: أعلنت سلطة المطار تأخر الرحلة إلى القاهرة.
      en: The airport authority announced that the Cairo flight is delayed.
    words: [otoritas, mengumumkan]
  - id: e04
    type: fill_blank
    sentence: Kementerian sudah memberi ___ resmi tentang masalah itu.
    meaning:
      ar_eg: الوزارة طلّعت ___ رسمي عن المشكلة دي.
      ar: أصدرت الوزارة ___ رسميًا عن تلك المسألة.
      en: The ministry has issued an official ___ about that problem.
    options: [pernyataan, komite, politisi]
    answers: [pernyataan]
    words: [pernyataan, komite, politisi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين بيرشّح نفسه في الانتخابات؟
      ar: من يترشّح في الانتخابات؟
      en: Who runs in elections?
    options: [kementerian, politisi, pengumuman]
    answer: 1
    explain:
      ar_eg: politisi = سياسي.
      ar: politisi = سياسي.
      en: politisi = politician.
    words: [kementerian, politisi, pengumuman]
  - id: e06
    type: fill_blank
    sentence: Nilai ujian akan ___ di internet hari Jumat.
    meaning:
      ar_eg: درجات الامتحان ___ على النت يوم الجمعة.
      ar: ستُـ ___ درجات الامتحان على الإنترنت يوم الجمعة.
      en: Exam marks will be ___ online on Friday.
    options: [dirilis, otoritas, pernyataan]
    answers: [dirilis]
    words: [dirilis, otoritas, pernyataan]
  - id: e07
    type: multiple_choice
    question: Sebuah ___ dibentuk untuk memeriksa masalah itu.
    options: [duta besar, pernyataan, komite]
    answer: 2
    explain:
      ar_eg: komite = لجنة.
      ar: komite = لجنة.
      en: komite = committee.
    words: [duta besar, pernyataan, komite]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الوزارة أعلنت القرار الصبح.
      ar: أعلنت الوزارة القرار صباحًا.
      en: The ministry announced the decision this morning.
    answer: Kementerian mengumumkan keputusan itu tadi pagi.
    distractors: [dirilis, komite]
    words: [kementerian, mengumumkan, dirilis, komite]
  - id: e09
    type: translate
    direction: from_target
    source_text: Pengumuman itu dibaca oleh duta besar Mesir.
    answers_meaning:
      ar_eg: [الإعلان ده قراه السفير المصري, السفير المصري هو اللي قرا الإعلان]
      ar: [قرأ ذلك الإعلانَ السفيرُ المصري, تلا السفير المصري الإعلان]
      en: [The announcement was read by the Egyptian ambassador, The Egyptian ambassador read out the announcement]
    words: [duta besar]
  - id: e10
    type: speaking
    text: Otoritas kota mengumumkan pernyataan penting kepada pers.
    meaning:
      ar_eg: سلطة المدينة أعلنت بيان مهم للصحافة.
      ar: أعلنت سلطة المدينة بيانًا مهمًا للصحافة.
      en: The city authority announced an important statement to the press.
    words: [pernyataan, otoritas, mengumumkan, politisi]
dialogue:
  lines:
    - speaker: Kak Nirmala
      text: Mohamed, ikut saya ke kantor kota? Ada pengumuman penting untuk pers.
      ar_eg: يا محمد، تيجي معايا مكتب المدينة؟ فيه إعلان مهم للصحافة.
      ar: يا محمد، هل تأتي معي إلى مكتب المدينة؟ هناك إعلان مهم للصحافة.
      en: Mohamed, coming with me to the city office? There's an important announcement for the press.
    - speaker: Mohamed
      text: Boleh. Siapa yang akan mengumumkan apa?
      ar_eg: ماشي. مين هيعلن إيه؟
      ar: حسنًا. من سيعلن ماذا؟
      en: Sure. Who's announcing what?
    - speaker: Kak Nirmala
      text: Kementerian Pendidikan dan komite beasiswa. Nama-nama penerima beasiswa baru dirilis.
      ar_eg: وزارة التعليم ولجنة المنح. أسامي اللي خدوا المنحة لسه نازلة.
      ar: وزارة التعليم ولجنة المنح. صدرت للتوّ أسماء الحاصلين على المنح.
      en: The Education Ministry and the scholarship committee. The names of the scholarship winners have just been released.
    - speaker: Mohamed
      text: Apakah ada politisi juga?
      ar_eg: هيبقى فيه سياسيين كمان؟
      ar: هل سيحضر سياسيون أيضًا؟
      en: Will there be politicians too?
    - speaker: Kak Nirmala
      text: Ada. Mereka akan memberi pernyataan jam sepuluh.
      ar_eg: أيوه. هيدّوا بيان الساعة عشرة.
      ar: نعم. سيُدلون ببيان في العاشرة.
      en: Yes. They'll give a statement at ten.
