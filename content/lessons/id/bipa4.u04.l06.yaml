schema: kabar.lesson/v1
id: bipa4.u04.l06
language: id
title: Konferensi pers
can_do:
  ar_eg: 'تفهم إعلان رسمي من وزارة أو سفارة: مين أعلن وإيه اللي اتنشر.'
  ar: 'أن تفهم إعلانًا رسميًا من وزارة أو سفارة: من أعلن وما الذي صدر.'
  en: 'Follow an official announcement from a ministry or embassy: who announced what, and what was released.'
slides:
  - title: Pengumuman resmi
    body:
      ar_eg: |
        mengumumkan = يعلن، duta besar = سفير، dirilis = اتنشر، صدر (keputusan itu dirilis kemarin).
        kementerian = وزارة (Kementerian Pendidikan)، pernyataan = بيان (pernyataan resmi)، otoritas = سلطة رسمية (otoritas bandara).
        politisi = سياسي، komite = لجنة.
      ar: |
        mengumumkan = يعلن، duta besar = سفير، dirilis = صدر، نُشر (keputusan itu dirilis kemarin).
        kementerian = وزارة (Kementerian Pendidikan)، pernyataan = بيان (pernyataan resmi)، otoritas = سلطة (otoritas bandara).
        politisi = سياسي، komite = لجنة.
      en: |
        mengumumkan = to announce, duta besar = ambassador, dirilis = released (keputusan itu dirilis kemarin).
        kementerian = ministry (Kementerian Pendidikan), pernyataan = statement (pernyataan resmi), otoritas = authority (otoritas bandara).
        politisi = politician, komite = committee.
    examples:
      - text: Kementerian Pendidikan mengumumkan program baru.
        ar_eg: وزارة التعليم أعلنت برنامج جديد.
        ar: أعلنت وزارة التعليم عن برنامج جديد.
        en: The Ministry of Education announced a new programme.
      - text: Duta besar Mesir membaca pernyataan untuk mahasiswa.
        ar_eg: السفير المصري قرا بيان للطلبة.
        ar: قرأ السفير المصري بيانًا للطلاب.
        en: The Egyptian ambassador read a statement for students.
      - text: Keputusan komite itu dirilis kemarin.
        ar_eg: قرار اللجنة دي نزل امبارح.
        ar: صدر قرار تلك اللجنة أمس.
        en: The committee's decision was released yesterday.
exercises:
  - id: e01
    type: match_pairs
    pairs:
