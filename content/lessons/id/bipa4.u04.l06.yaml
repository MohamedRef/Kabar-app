schema: kabar.lesson/v1
id: bipa4.u04.l06
language: id
title: Konferensi pers
can_do:
  ar_eg: 'تفهم إعلان رسمي من وزارة أو سفارة: مين أعلن وإيه اللي اتنشر.'
  ar: 'أن تفهم إعلانًا رسميًا من وزارة أو سفارة: من أعلن وما الذي صدر.'
  en: 'Follow an official announcement from a ministry or embassy: who announced what, and what was released.'
slides:
  - title: Pengumuman resmi
    body:
      ar_eg: |
        mengumumkan = يعلن، pengumuman = إعلان، dirilis = اتنشر، صدر (keputusan itu dirilis kemarin).
        kementerian = وزارة (Kementerian Pendidikan)، kedutaan = سفارة (Kedutaan Mesir)، otoritas = سلطة رسمية (otoritas bandara).
        politisi = سياسي، komite = لجنة.
      ar: |
        mengumumkan = يعلن، pengumuman = إعلان، dirilis = صدر، نُشر (keputusan itu dirilis kemarin).
        kementerian = وزارة (Kementerian Pendidikan)، kedutaan = سفارة (Kedutaan Mesir)، otoritas = سلطة (otoritas bandara).
        politisi = سياسي، komite = لجنة.
      en: |
        mengumumkan = to announce, pengumuman = announcement, dirilis = released (keputusan itu dirilis kemarin).
        kementerian = ministry (Kementerian Pendidikan), kedutaan = embassy (Kedutaan Mesir), otoritas = authority (otoritas bandara).
        politisi = politician, komite = committee.
    examples:
      - text: Kementerian Pendidikan mengumumkan program baru.
        ar_eg: وزارة التعليم أعلنت برنامج جديد.
        ar: أعلنت وزارة التعليم عن برنامج جديد.
        en: The Ministry of Education announced a new programme.
      - text: Kedutaan Mesir di Jakarta membuat pengumuman untuk mahasiswa.
        ar_eg: السفارة المصرية في جاكرتا عملت إعلان للطلبة.
        ar: أصدرت السفارة المصرية في جاكرتا إعلانًا للطلاب.
        en: The Egyptian Embassy in Jakarta made an announcement for students.
      - text: Keputusan komite itu dirilis kemarin.
        ar_eg: قرار اللجنة دي نزل امبارح.
        ar: صدر قرار تلك اللجنة أمس.
        en: The committee's decision was released yesterday.
