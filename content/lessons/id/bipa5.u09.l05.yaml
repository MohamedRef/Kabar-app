schema: kabar.lesson/v1
id: bipa5.u09.l05
language: id
title: Campur kode
can_do:
  ar_eg: تلاحظ لما الناس بيخلطوا لغتين، وتعرف إمتى ده مناسب وإمتى لأ.
  ar: أن تلاحظ خلط الناس بين لغتين، وتعرف متى يناسب ذلك ومتى لا يناسب.
  en: Notice when people mix two languages, and know when it fits and when it doesn't.
slides:
  - title: '"Which is", "literally", dan kawan-kawan'
    body:
      ar_eg: |
        الشباب في المدن الكبيرة، وأشهرهم «anak Jaksel» (شباب جنوب جاكرتا)، بيخلطوا إنجليزي في الإندونيسي:
        - campur kode = خلط كلمات من لغة تانية جوه نفس الجملة: «Meeting-nya jam berapa?»
        - alih kode = إنك تنقل من لغة للتانية حسب الموقف: جاوي في البيت، وإندونيسي في الشغل
        - menyelipkan = يدخّل حاجة صغيرة في النص (selip = يزق في النص)
        - terdengar = يبان / صوته بيبان: terdengar keren = بيبان روش
        - gengsi = البرستيج والمنظرة، وكمان الكسوف من حاجة شايفها أقل من مستواك
        زيّنا بالظبط لما بنقول «أنا busy النهارده»!
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: aku = saya، nggak = tidak، ngerti = mengerti، banget = sekali، nyelipin = menyelipkan، gara-gara = karena، cuma = hanya، pengin = ingin.
      ar: |
        يخلط الشباب في المدن الكبرى، وأشهرهم «anak Jaksel» (شباب جنوب جاكرتا)، الإنجليزية بالإندونيسية:
        - campur kode = إدخال كلمات من لغة أخرى في الجملة نفسها: «Meeting-nya jam berapa?»
        - alih kode = الانتقال من لغة إلى أخرى بحسب الموقف: الجاوية في البيت والإندونيسية في العمل
        - menyelipkan = يُقحم شيئًا صغيرًا في الوسط (selip = يندسّ)
        - terdengar = يبدو (سمعًا): terdengar keren = يبدو أنيقًا
        - gengsi = الوجاهة والتفاخر، وكذلك الأنفة ممّا يراه المرء دون مستواه
        تمامًا كما نقول بالعامية «أنا busy النهارده»!
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: aku = saya، nggak = tidak، ngerti = mengerti، banget = sekali، nyelipin = menyelipkan، gara-gara = karena، cuma = hanya، pengin = ingin.
      en: |
        Big-city youth, most famously «anak Jaksel» (South Jakarta kids), mix English into Indonesian:
        - campur kode = code-mixing, other-language words inside one sentence: «Meeting-nya jam berapa?»
        - alih kode = code-switching, moving between languages by situation: Javanese at home, Indonesian at work
        - menyelipkan = to slip something in (selip = to slip between)
        - terdengar = to sound: terdengar keren = sounds cool
        - gengsi = prestige, status-consciousness; also pride that makes something feel beneath you
        Just like Egyptians saying «أنا busy النهارده»!
        The dialogue uses street forms; the formal ones are beside them: aku = saya, nggak = tidak, ngerti = mengerti, banget = sekali, nyelipin = menyelipkan, gara-gara = karena, cuma = hanya, pengin = ingin.
    examples:
      - text: Dia suka menyelipkan kata bahasa Inggris supaya terdengar keren.
        ar_eg: بيحب يدخّل كلام إنجليزي عشان يبان روش.
        ar: يحبّ أن يُقحم كلمات إنجليزية ليبدو أنيقًا.
        en: He likes slipping in English words to sound cool.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: campur kode
        ar_eg: خلط لغتين في جملة
        ar: خلط لغوي
        en: code-mixing
      - text: alih kode
        ar_eg: تنقل من لغة لتانية
        ar: تحوّل لغوي
        en: code-switching
      - text: menyelipkan
        ar_eg: يدخّل في النص
        ar: يُقحم
        en: to slip in
      - text: terdengar
        ar_eg: يبان (بالسمع)
        ar: يبدو سمعًا
        en: to sound
      - text: gengsi
        ar_eg: برستيج / منظرة
        ar: وجاهة
        en: prestige, pride
    words: [campur kode, alih kode, menyelipkan, terdengar, gengsi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Jujur, aku literally capek banget.» دي إيه؟
      ar: 'ما هذه الجملة: «Jujur, aku literally capek banget.»؟'
      en: What is going on in "Jujur, aku literally capek banget."?
    options:
      - إندونيسي رسمي.
      - campur kode، كلمة إنجليزي جوه جملة إندونيسي.
      - جاوي.
    answer: 1
    words: [campur kode]
  - id: e03
    type: listen
    text: Di rumah dia berbahasa Jawa, tetapi di kantor dia melakukan alih kode ke bahasa Indonesia.
    question:
      ar_eg: بيتكلم إندونيسي فين؟
      ar: أين يتكلّم الإندونيسية؟
      en: Where does he speak Indonesian?
    options:
      - في البيت.
      - في السوق.
      - في المكتب.
    answer: 2
    words: [alih kode]
  - id: e04
    type: fill_blank
    sentence: Banyak anak muda ___ kata bahasa Inggris dalam kalimat bahasa Indonesia.
    meaning:
      ar_eg: شباب كتير بيدخّلوا كلام إنجليزي في جمل إندونيسي.
      ar: يُقحم كثير من الشباب كلمات إنجليزية في جمل إندونيسية.
      en: Many young people slip English words into Indonesian sentences.
    options: [menyelipkan, terdengar, gengsi]
    answers: [menyelipkan]
    words: [menyelipkan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: عند بعض الناس، الإنجليزي بيدّي برستيج.
      ar: لدى بعض الناس، تمنح الإنجليزية وجاهة.
      en: For some people, English gives prestige.
    answer: Bagi sebagian orang, bahasa Inggris memberi gengsi.
    distractors: [campur, terdengar]
    words: [gengsi]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كلامه بيبان أروش بالكلام الإنجليزي.
      ar: يبدو كلامه أكثر أناقة بالكلمات الإنجليزية.
      en: His sentences sound cooler with English words.
    answers:
      - Kalimatnya terdengar lebih keren dengan kata bahasa Inggris.
      - Kalimatnya terdengar lebih keren dengan kata-kata bahasa Inggris.
      - Ucapannya terdengar lebih keren dengan kata bahasa Inggris.
      - Kalimatnya terdengar lebih keren dengan bahasa Inggris.
    words: [terdengar]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: محمد بيكلم رينا إندونيسي، وبعدين بيكلم مامته في التليفون عربي. ده اسمه إيه؟
      ar: يكلّم محمد رينا بالإندونيسية، ثم يكلّم أمّه هاتفيًا بالعربية. ما اسم ذلك؟
      en: Mohamed speaks Indonesian with Rina, then Arabic with his mother on the phone. What's that called?
    options: [alih kode, campur kode, bahasa baku]
    answer: 0
    explain:
      ar_eg: نقل كامل من لغة للتانية حسب الشخص = alih kode. الخلط جوه نفس الجملة = campur kode.
      ar: الانتقال الكامل من لغة إلى أخرى بحسب المخاطَب alih kode، والخلط داخل الجملة campur kode.
      en: A full switch by listener is alih kode; mixing within one sentence is campur kode.
    words: [alih kode, campur kode]
  - id: e08
    type: speaking
    text: Dalam rapat resmi, sebaiknya kita tidak menyelipkan terlalu banyak kata asing.
    meaning:
      ar_eg: في الاجتماع الرسمي، الأحسن مانحطش كلام أجنبي كتير.
      ar: في الاجتماع الرسمي، يحسن ألّا نُقحم كلمات أجنبية كثيرة.
      en: In a formal meeting, we'd better not slip in too many foreign words.
    words: [menyelipkan, asing]
  - id: e09
    type: dictation
    text: Bahasa campur kode terdengar santai, tetapi kurang baku.
    meaning:
      ar_eg: الكلام المخلوط بيبان رايق، بس مش فصيح.
      ar: يبدو الكلام المخلوط مريحًا، لكنه أقلّ فصاحة.
      en: Mixed language sounds relaxed, but it's less standard.
    words: [campur kode, terdengar]
  - id: e10
    type: fill_blank
    sentence: Karena ___, dia malu naik angkot dan memilih naik taksi.
    meaning:
      ar_eg: عشان المنظرة، بيتكسف يركب ميكروباص وبيختار تاكسي.
      ar: بدافع الوجاهة، يستحيي من ركوب الحافلة الصغيرة ويختار سيارة الأجرة.
      en: Out of pride, he's embarrassed to take an angkot and picks a taxi.
    options: [gengsi, alih kode, terdengar]
    answers: [gengsi]
    words: [gengsi]
dialogue:
  title: Sepupu dari Jakarta Selatan
  lines:
    - speaker: Rina
      text: Sepupuku dari Jaksel. Dia bilang, "Aku tuh literally nggak ngerti, which is aneh banget."
      ar_eg: 'ابن خالتي من جنوب جاكرتا. بيقول: «أنا literally مش فاهم، which is غريب أوي.»'
      ar: 'ابن خالتي من جنوب جاكرتا، يقول: «أنا literally لا أفهم، which is غريب جدًا.»'
      en: My cousin is from South Jakarta. He says, "I literally don't get it, which is so weird."
    - speaker: Mohamed
      text: Ha! Itu campur kode. Di Kairo juga banyak yang nyelipin kata bahasa Inggris.
      ar_eg: ها! ده خلط لغات. في القاهرة كمان ناس كتير بتدخّل كلام إنجليزي.
      ar: ها! هذا خلط لغوي، وفي القاهرة أيضًا يُقحم كثيرون كلمات إنجليزية.
      en: Ha! That's code-mixing. In Cairo lots of people slip in English words too.
    - speaker: Rina
      text: Kenapa, ya? Gara-gara gengsi, kali?
      ar_eg: ليه يا ترى؟ عشان المنظرة؟
      ar: لماذا يا ترى؟ أمن أجل الوجاهة؟
      en: Why, I wonder? Is it prestige?
    - speaker: Mohamed
      text: Kadang-kadang. Tapi kadang mereka cuma pengin kedengeran santai.
      ar_eg: ساعات. بس ساعات تانية بس عايزين يبانوا رايقين.
      ar: أحيانًا، لكنهم أحيانًا يريدون فقط أن يبدوا مسترخين.
      en: Sometimes. But sometimes they just want to sound relaxed.
