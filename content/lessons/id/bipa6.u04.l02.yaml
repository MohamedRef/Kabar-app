schema: kabar.lesson/v1
id: bipa6.u04.l02
language: id
title: Sriwijaya
can_do:
  ar_eg: تقرا نص تاريخي عن سريويجايا وتفهم الأحداث وترتيبها.
  ar: أن تقرأ نصًّا تاريخيًّا عن سريويجايا وتفهم أحداثه وتسلسلها.
  en: Read a historical text about Srivijaya and follow its events in order.
slides:
  - title: Penguasa selat
    body:
      ar_eg: |
        اقرا الفقرة دي (مكتوبة للدرس):
        Sriwijaya berpusat di sekitar Palembang sejak abad ketujuh. Kerajaan ini menguasai Selat Malaka, jalur laut antara India dan Tiongkok. Pada tahun 671, singgahlah seorang biksu Tiongkok bernama I-Tsing untuk belajar bahasa Sanskerta. Pada abad ke-11, Sriwijaya diserang dari India, lalu perlahan-lahan runtuh.
        - pusat = مركز، menguasai = يسيطر على، selat = مضيق
        - biksu = راهب بوذي، runtuh = ينهار
        ولاحظ القلب: singgahlah seorang biksu.
        - في الشارع: kayak = seperti (زي)، banget = sekali (أوي).
      ar: |
        اقرأ هذه الفقرة (المكتوبة للدرس):
        Sriwijaya berpusat di sekitar Palembang sejak abad ketujuh. Kerajaan ini menguasai Selat Malaka, jalur laut antara India dan Tiongkok. Pada tahun 671, singgahlah seorang biksu Tiongkok bernama I-Tsing untuk belajar bahasa Sanskerta. Pada abad ke-11, Sriwijaya diserang dari India, lalu perlahan-lahan runtuh.
        - pusat = مركز، menguasai = يسيطر على، selat = مضيق
        - biksu = راهب بوذي، runtuh = ينهار
        ولاحظ القلب في: singgahlah seorang biksu.
        - في كلام الشارع: kayak = seperti (مثل)، banget = sekali (جدًّا).
      en: |
        Read this paragraph (written for the lesson):
        Sriwijaya berpusat di sekitar Palembang sejak abad ketujuh. Kerajaan ini menguasai Selat Malaka, jalur laut antara India dan Tiongkok. Pada tahun 671, singgahlah seorang biksu Tiongkok bernama I-Tsing untuk belajar bahasa Sanskerta. Pada abad ke-11, Sriwijaya diserang dari India, lalu perlahan-lahan runtuh.
        - pusat = centre, menguasai = to control, selat = strait
        - biksu = Buddhist monk, runtuh = to collapse
        Note the inversion: singgahlah seorang biksu.
        - On the street: kayak = seperti (like), banget = sekali (very).
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pusat
        ar_eg: مركز
        ar: مركز
        en: centre
      - text: menguasai
        ar_eg: يسيطر على
        ar: يسيطر على
        en: to control
      - text: selat
        ar_eg: مضيق
        ar: مضيق
        en: strait
      - text: biksu
        ar_eg: راهب بوذي
        ar: راهب بوذي
        en: Buddhist monk
      - text: runtuh
        ar_eg: ينهار / يقع
        ar: ينهار
        en: to collapse
    words: [pusat, menguasai, selat, biksu, runtuh]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: سريويجايا كانت مسيطرة على إيه؟
      ar: على أيّ شيء سيطرت سريويجايا؟
      en: What did Srivijaya control?
    options:
      - مضيق ملقا.
      - جبال جاوة.
      - موانئ اليابان.
    answer: 0
    words: [menguasai, selat]
    explain:
      ar_eg: سريويجايا كانت مسيطرة على مضيق ملقا. ماحكمتش جبال جاوة ولا موانئ اليابان.
      ar: سيطرت سريويجايا على مضيق ملقا، لا على جبال جاوة ولا موانئ اليابان.
      en: Srivijaya controlled the Strait of Malacca, not Java's mountains or Japan's ports.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: I-Tsing جه سريويجايا ليه؟
      ar: لماذا جاء I-Tsing إلى سريويجايا؟
      en: Why did I-Tsing come to Srivijaya?
    options:
      - علشان يتاجر في البهارات.
      - علشان يحارب.
      - علشان يتعلم السنسكريتي.
    answer: 2
    words: [biksu]
    explain:
      ar_eg: إي تسينج كان راهب جه يتعلم السنسكريتي. ماجاش يتاجر ولا يحارب.
      ar: كان إي تسينغ راهبًا جاء ليتعلّم السنسكريتية، لا ليتاجر ولا ليحارب.
      en: I-Tsing was a monk who came to study Sanskrit, not to trade or fight.
  - id: e04
    type: fill_blank
    sentence: Pada abad ke-11, kerajaan itu mulai ___.
    meaning:
      ar_eg: في القرن الحداشر، المملكة دي ابتدت تنهار.
      ar: في القرن الحادي عشر بدأت تلك المملكة تنهار.
      en: In the 11th century, that kingdom began to collapse.
    options: [runtuh, menguasai, pusat]
    answers: [runtuh]
    words: [runtuh]
    explain:
      ar_eg: "mulai بعدها فعل: runtuh = انهارت. menguasai = سيطر (عكس المعنى)، وpusat = مركز، اسم."
      ar: "بعد mulai فعل: runtuh أي انهارت؛ أمّا menguasai (سيطر) فعكس المعنى، وpusat (مركز) اسم."
      en: "After mulai comes a verb: runtuh, collapse. menguasai (control) is the opposite, and pusat (centre) is a noun."
  - id: e05
    type: listen
    text: Pusat kerajaan itu terletak di tepi Sungai Musi.
    question:
      ar_eg: مركز المملكة كان فين؟
      ar: أين كان مركز المملكة؟
      en: Where was the kingdom's centre?
    options:
      - على البحر المفتوح.
      - على شط نهر موسي.
      - فوق جبل.
    answer: 1
    words: [pusat]
  - id: e06
    type: build_sentence
    source:
      ar_eg: المملكة دي سيطرت على مضيق ملقا قرون.
      ar: سيطرت هذه المملكة على مضيق ملقا قرونًا.
      en: This kingdom controlled the Strait of Malacca for centuries.
    answer: Kerajaan ini menguasai Selat Malaka selama berabad-abad.
    distractors: [runtuh, biksu]
    words: [menguasai, selat]
    explain:
      ar_eg: «سيطرت على» = menguasai و«لقرون» = selama berabad-abad. runtuh وbiksu مش في المعنى.
      ar: «سيطرت على» menguasai و«لقرون» selama berabad-abad؛ أمّا runtuh وbiksu فليستا في المعنى.
      en: "\"Controlled\" is menguasai and \"for centuries\" is selama berabad-abad. runtuh and biksu aren't in the meaning."
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: راهب صيني وقف في باليمبانج.
      ar: توقّف راهب صيني في باليمبانغ.
      en: A Chinese monk stopped in Palembang.
    answers:
      - Seorang biksu Tiongkok singgah di Palembang.
      - Singgahlah seorang biksu Tiongkok di Palembang.
      - Seorang biksu dari Tiongkok singgah di Palembang.
      - Ada seorang biksu Tiongkok yang singgah di Palembang.
    words: [biksu]
  - id: e08
    type: speaking
    text: Selat Malaka menjadi pusat perdagangan dunia.
    meaning:
      ar_eg: مضيق ملقا بقى مركز تجارة العالم.
      ar: صار مضيق ملقا مركزًا للتجارة العالمية.
      en: The Strait of Malacca became a centre of world trade.
    words: [selat, pusat]
  - id: e09
    type: dictation
    text: Kerajaan yang kuat pun akhirnya bisa runtuh.
    meaning:
      ar_eg: حتى المملكة القوية ممكن في الآخر تنهار.
      ar: حتى المملكة القويّة قد تنهار في النهاية.
      en: Even a strong kingdom can collapse in the end.
    words: [runtuh]
dialogue:
  title: Di Museum Sriwijaya
  lines:
    - speaker: Kak Dewi
      text: Lihat peta ini. Sriwijaya menguasai jalur dari India sampai Tiongkok.
      ar_eg: بص على الخريطة دي. سريويجايا كانت مسيطرة على الطريق من الهند للصين.
      ar: انظر إلى هذه الخريطة. سيطرت سريويجايا على الطريق من الهند إلى الصين.
      en: Look at this map. Srivijaya controlled the route from India to China.
    - speaker: Mohamed
      text: Jadi Palembang dulu kayak Iskandariah, pusat ilmu dan dagang.
      ar_eg: يعني باليمبانج زمان كانت زي إسكندرية، مركز علم وتجارة.
      ar: إذن كانت باليمبانغ قديمًا كالإسكندرية، مركزًا للعلم والتجارة.
      en: So Palembang was once like Alexandria, a centre of learning and trade.
    - speaker: Kak Dewi
      text: Persis. Biksu dari Tiongkok pun datang belajar di sini.
      ar_eg: بالظبط. حتى الرهبان من الصين كانوا بييجوا يتعلّموا هنا.
      ar: تمامًا. حتى رهبان الصين جاؤوا للتعلّم هنا.
      en: Exactly. Even monks from China came to study here.
    - speaker: Mohamed
      text: Sayang banget kerajaan sebesar itu runtuh.
      ar_eg: خسارة إن مملكة بالحجم ده تنهار.
      ar: من المؤسف أن تنهار مملكة بهذا الحجم.
      en: What a pity a kingdom that great collapsed.
