schema: kabar.lesson/v1
id: bipa1.u05.l04
language: id
title: Boleh? Silakan!
can_do:
  ar_eg: تستأذن وترد بأدب.
  ar: أن تستأذن وتجيب بأدب.
  en: Ask permission and answer politely.
slides:
  - title: Permisi dan maaf
    body:
      ar_eg: |
        - permisi = «لو سمحت / عن إذنك»: لما تنادي حد غريب، أو تعدّي من قدامه، أو تستأذن تمشي.
        - maaf = «آسف» (من العربي «عفو / معافاة»)، للاعتذار. وكمان قبل سؤال محرج: Maaf, boleh tanya? = معلش، ممكن أسأل؟
        - Terima kasih (banyak)! = شكرًا (جزيلًا)! والرد: Sama-sama = العفو.
      ar: |
        - permisi = «عن إذنك / من فضلك»: لنداء غريب، أو للمرور أمام أحد، أو للاستئذان بالانصراف.
        - maaf = «عذرًا» (من العربية «عفو»)، للاعتذار، وقبل السؤال المحرج: Maaf, boleh tanya? = عذرًا، أيمكنني أن أسأل؟
        - Terima kasih (banyak)! = شكرًا (جزيلًا)! وجوابها Sama-sama = عفوًا.
      en: |
        - permisi = "excuse me": to call a stranger, to pass in front of someone, or to take your leave.
        - maaf = "sorry" (from Arabic «عفو»), to apologise — and to soften an awkward question: Maaf, boleh tanya? = Sorry, may I ask?
        - Terima kasih (banyak)! = Thank you (very much)! Reply: Sama-sama = You're welcome.
    grammar: id.politeness.phrases
    examples:
      - text: Permisi, Pak.
        ar_eg: عن إذنك يا أستاذ.
        ar: عن إذنك يا سيدي.
        en: Excuse me, sir.
      - text: Maaf, saya terlambat.
        ar_eg: آسف إني اتأخرت.
        ar: عذرًا على التأخير.
        en: Sorry, I'm late.
  - title: Boleh …? — Silakan!
    body:
      ar_eg: |
        Boleh + فعل؟ = «ممكن …؟» عشان تستأذن:
        - Boleh saya duduk? = ممكن أقعد؟
        - Boleh saya foto? = ممكن أصوّر؟
        الرد بالموافقة: Boleh! أو Silakan = اتفضل.
        وBoleh! لوحدها كمان معناها «ماشي، موافق» لما حد يقترح حاجة.
      ar: |
        Boleh + فعل؟ = «هل يمكنني …؟» للاستئذان:
        - Boleh saya duduk? = هل يمكنني الجلوس؟
        - Boleh saya foto? = هل يمكنني التصوير؟
        والجواب بالموافقة: Boleh! أو Silakan = تفضل.
        وتأتي Boleh! وحدها بمعنى «موافق» جوابًا عن اقتراح.
      en: |
        Boleh + verb? = "May I …?" to ask permission:
        - Boleh saya duduk? = May I sit down?
        - Boleh saya foto? = May I take a photo?
        Say yes with Boleh! or Silakan = Go ahead / Please do.
        Boleh! on its own also means "Sure!" when someone suggests something.
    grammar: id.politeness.phrases
    examples:
      - text: Boleh saya foto? — Silakan.
        ar_eg: ممكن أصوّر؟ — اتفضل.
        ar: هل يمكنني التصوير؟ — تفضل.
        en: May I take a photo? — Go ahead.
      - text: Terima kasih banyak! — Sama-sama.
        ar_eg: شكرًا جدًا! — العفو.
        ar: شكرًا جزيلًا! — عفوًا.
        en: Thanks a lot! — You're welcome.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bagaimana
        ar_eg: إزاي / عامل إيه
        ar: كيف
        en: how
      - text: permisi
        ar_eg: عن إذنك / لو سمحت
        ar: عن إذنك
        en: excuse me
      - text: silakan
        ar_eg: اتفضل
        ar: تفضّل
        en: go ahead, please do
      - text: cuaca
        ar_eg: الجو
        ar: الطقس
        en: weather
      - text: hujan
        ar_eg: مطر
        ar: مطر
        en: rain
    words: [bagaimana, permisi, silakan, cuaca, hujan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: راجل كبير قاعد وإنت لازم تعدّي من قدامه. تقول إيه؟
      ar: رجل مسن جالس وعليك أن تمر أمامه. ماذا تقول؟
      en: An older man is sitting and you need to pass in front of him. What do you say?
    options: ['Permisi, Pak.', 'Sama-sama, Pak.', 'Silakan, Pak.']
    answer: 0
    explain:
      ar_eg: permisi هي «عن إذنك» لما تعدّي من قدام حد.
      ar: permisi تعني «عن إذنك» عند المرور أمام أحد.
      en: permisi is "excuse me" when passing in front of someone.
    words: [permisi]
  - id: e03
    type: multiple_choice
    question: Terima kasih banyak!
    question_meaning:
      ar_eg: حد قالك «شكرًا جدًا!». ترد بإيه؟
      ar: قال لك أحدهم «شكرًا جزيلًا!». بماذا تردّ؟
      en: Someone says "Thanks a lot!". How do you reply?
    options: [Sama-sama., Boleh., Permisi.]
    answer: 0
    words: [sama-sama]
  - id: e04
    type: fill_blank
    sentence: ___ saya foto? — Silakan.
    meaning:
      ar_eg: ممكن أصوّر؟ — اتفضل.
      ar: هل يمكنني التصوير؟ — تفضل.
      en: May I take a photo? — Go ahead.
    options: [Bagaimana, Boleh, Permisi]
    answers: [Boleh]
    words: [boleh, foto]
  - id: e05
    type: build_sentence
    source:
      ar_eg: ممكن أقعد يا أستاذ؟
      ar: هل يمكنني الجلوس يا سيدي؟
      en: May I sit down, sir?
    answer: Boleh saya duduk, Pak?
    alternatives: ['Saya boleh duduk, Pak?']
    distractors: [Bagaimana, Bu]
    words: [boleh, duduk]
  - id: e06
    type: dictation
    text: Permisi, boleh saya duduk?
    meaning:
      ar_eg: عن إذنك، ممكن أقعد؟
      ar: عن إذنك، هل يمكنني الجلوس؟
      en: Excuse me, may I sit down?
    words: [permisi, boleh, duduk]
  - id: e07
    type: speaking
    text: Terima kasih banyak, Bu!
    meaning:
      ar_eg: شكرًا جدًا يا مدام!
      ar: شكرًا جزيلًا يا سيدتي!
      en: Thank you very much, ma'am!
dialogue:
  title: Senin pagi
  lines:
    - speaker: Rina
      text: Halo, Mohamed! Bagaimana liburanmu di Ancol?
      ar_eg: أهلًا يا محمد! الأجازة في أنكول كانت عاملة إزاي؟
      ar: مرحبًا يا محمد! كيف كانت عطلتك في أنكول؟
      en: Hi, Mohamed! How was your holiday in Ancol?
    - speaker: Mohamed
      text: Seru! Saya berenang di pantai.
      ar_eg: تحفة! عُمت في البحر.
      ar: ممتعة! سبحت في الشاطئ.
      en: Fun! I swam at the beach.
    - speaker: Rina
      text: Bagaimana cuacanya?
      ar_eg: والجو كان عامل إيه؟
      ar: وكيف كان الطقس؟
      en: How was the weather?
    - speaker: Mohamed
      text: Cerah dan panas. Tidak ada hujan.
      ar_eg: صحو وحر. مكانش فيه مطر.
      ar: صحو وحار. لم يكن هناك مطر.
      en: Sunny and hot. No rain.
    - speaker: Rina
      text: Bagaimana kalau kita ke Ancol hari Minggu?
      ar_eg: إيه رأيك نروح أنكول يوم الحد؟
      ar: ما رأيك أن نذهب إلى أنكول يوم الأحد؟
      en: How about we go to Ancol on Sunday?
    - speaker: Mohamed
      text: Boleh! Terima kasih, Rina.
      ar_eg: ماشي! شكرًا يا رينا.
      ar: موافق! شكرًا يا رينا.
      en: Sure! Thanks, Rina.
