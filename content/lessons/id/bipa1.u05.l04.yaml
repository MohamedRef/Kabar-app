dialogue:
  title: Di loket Ancol
  lines:
    - speaker: Mohamed
      text: Permisi, Mbak. Berapa harga tiket masuk?
      ar_eg: لو سمحتي، تذكرة الدخول بكام؟
      ar: من فضلك، كم ثمن تذكرة الدخول؟
      en: Excuse me. How much is an entrance ticket?
    - speaker: Petugas loket
      text: Tiga puluh lima ribu rupiah, Pak.
      ar_eg: خمسة وتلاتين ألف روبية يا أستاذ.
      ar: خمسة وثلاثون ألف روبية يا سيدي.
      en: Thirty-five thousand rupiah, sir.
    - speaker: Mohamed
      text: Dua tiket, Mbak.
      ar_eg: تذكرتين لو سمحتي.
      ar: تذكرتان من فضلك.
      en: Two tickets, please.
    - speaker: Petugas loket
      text: Jadi tujuh puluh ribu, Pak.
      ar_eg: يبقى سبعين ألف يا أستاذ.
      ar: إذن سبعون ألفًا يا سيدي.
      en: So that's seventy thousand, sir.
    - speaker: Mohamed
      text: Ini uangnya. Ada kolam renang di Ancol?
      ar_eg: اتفضلي الفلوس. فيه حمام سباحة في أنكول؟
      ar: تفضلي المال. هل يوجد مسبح في أنكول؟
      en: Here's the money. Is there a swimming pool in Ancol?
    - speaker: Petugas loket
      text: Ada, Pak. Kolam renang buka jam delapan.
      ar_eg: فيه يا أستاذ. حمام السباحة بيفتح الساعة ٨.
      ar: يوجد يا سيدي. يفتح المسبح في الثامنة.
      en: There is, sir. The pool opens at eight.
    - speaker: Mohamed
      text: Boleh saya foto di pantai?
      ar_eg: ممكن أصوّر على البحر؟
      ar: هل يمكنني التصوير على الشاطئ؟
      en: May I take photos on the beach?
    - speaker: Petugas loket
      text: Boleh, Pak. Silakan.
      ar_eg: ممكن يا أستاذ. اتفضل.
      ar: نعم يا سيدي. تفضل.
      en: Yes, sir. Go ahead.
    - speaker: Mohamed
      text: Terima kasih banyak, Mbak.
      ar_eg: شكرًا جدًا يا آنسة.
      ar: شكرًا جزيلًا يا آنسة.
      en: Thank you very much, miss.
    - speaker: Petugas loket
      text: Sama-sama. Selamat berlibur!
      ar_eg: العفو. أجازة سعيدة!
      ar: عفوًا. عطلة سعيدة!
      en: You're welcome. Have a good holiday!
