  - id: e10
    type: translate
    direction: from_target
    source_text: Tekuk lutut sedikit dan lihat ke depan.
    answers_meaning:
      ar_eg: ["اثني ركبتك شوية وبص لقدّام.", "اثني ركبك شوية وبص قدامك"]
      ar: ["اثنِ ركبتيك قليلًا وانظر إلى الأمام.", "اثنِ ركبتك قليلًا وانظر أمامك"]
