      en: First, lie down on the board, then paddle with your hands.
    words: [berbaring, dayung]
dialogue:
  title: Mohamed jadi pelatih
  lines:
    - speaker: Rina
      text: Mohamed, kamu sudah bisa berselancar?
      ar_eg: يا محمد، إنت بقيت بتعرف تركب الأمواج؟
      ar: يا محمد، هل صرت تعرف ركوب الأمواج؟
      en: Mohamed, can you surf now?
    - speaker: Mohamed
      text: Sudah sedikit! Saya belajar dengan Mas Ardi selama dua minggu.
      ar_eg: شوية! اتعلّمت مع مَس أردي لمدة أسبوعين.
      ar: قليلًا! تعلّمتُ مع ماس أردي مدة أسبوعين.
      en: A bit! I learned with Mas Ardi for two weeks.
    - speaker: Rina
      text: Wah! Tolong ajari saya, ya.
      ar_eg: الله! لو سمحت علّمني.
      ar: رائع! علّمني من فضلك.
      en: Wow! Please teach me.
    - speaker: Mohamed
      text: Mudah! Pertama, bawa papan selancar ke laut, lalu berbaring di atas papan.
      ar_eg: سهلة! الأول خدي اللوح للبحر، وبعدين نامي عليه.
      ar: سهل! أولًا خذي اللوح إلى البحر ثم استلقي عليه.
      en: Easy! First, take the surfboard into the sea, then lie down on it.
    - speaker: Rina
      text: Lalu?
      ar_eg: وبعدين؟
      ar: ثم؟
      en: Then?
    - speaker: Mohamed
      text: Dayung dengan tangan. Lihat ombaknya, lalu berdiri dengan cepat.
      ar_eg: جدّفي بإيديكي. بصّي على الموجة، وبعدين قومي اقفي بسرعة.
      ar: جدّفي بيديكِ، وراقبي الموجة ثم قِفي بسرعة.
      en: Paddle with your hands. Watch the wave, then stand up quickly.
    - speaker: Rina
      text: Kakinya bagaimana?
      ar_eg: والرجلين أعمل فيهم إيه؟
      ar: وماذا عن القدمين؟
      en: What about my legs?
    - speaker: Mohamed
      text: Tekuk lutut sedikit dan lihat ke depan.
      ar_eg: اثني ركبك شوية وبصّي لقدّام.
      ar: اثني ركبتيكِ قليلًا وانظري إلى الأمام.
      en: Bend your knees a little and look ahead.
    - speaker: Rina
      text: Saya takut jatuh.
      ar_eg: أنا خايفة أقع.
      ar: أخاف أن أسقط.
      en: I'm scared of falling.
    - speaker: Mohamed
      text: Jangan takut! Jatuh itu biasa. Ayo, kita berdua coba!
      ar_eg: ماتخافيش! الوقعة عادي. يلا نجرّب إحنا الاتنين!
      ar: لا تخافي! السقوط أمر عادي. هيّا نجرّب نحن الاثنين!
      en: Don't be scared! Falling is normal. Come on, let's both try!
