schema: kabar.lesson/v1
id: bipa5.u05.l05
language: id
title: Masyarakat Dayak
can_do:
  ar_eg: توصف حياة الداياك وحقهم في أرضهم بكلام دقيق ومحترم.
  ar: أن تصف حياة الدّاياك وحقّهم في أرضهم بكلام دقيق محترم.
  en: Describe Dayak life and their rights to their land, precisely and respectfully.
slides:
  - title: Rumah panjang dan hak ulayat
    body:
      ar_eg: |
        الداياك (Dayak) شعوب أصلية كتير في بورنيو، كل واحد ليه لغته وعاداته.
        - rumah panjang (betang / lamin) = البيت الطويل، بتسكن فيه عيلات كتير مع بعض
        - berladang = يزرع في أرض، وبعد كام موسم يسيبها ترتاح ويروح لأرض تانية
        - tetua adat = كبير القوم، بيحكم بالعرف
        - kearifan lokal = الحكمة المحلية: معرفة متوارثة بتحافظ على الغابة
        - hak ulayat = حق الجماعة العرفي في أرضها
        وفي ٢٠١٣ المحكمة الدستورية قررت إن الغابة العرفية (hutan adat) مش غابة تبع الدولة.
      ar: |
        الدّاياك (Dayak) شعوب أصلية عديدة في بورنيو، لكلّ منها لغته وعاداته.
        - rumah panjang (betang / lamin) = البيت الطويل، تسكنه عائلات عدّة معًا
        - berladang = يزرع أرضًا ثم يتركها بعد مواسم لتستريح وينتقل إلى غيرها
        - tetua adat = شيخ القوم الذي يحكم بالعرف
        - kearifan lokal = الحكمة المحلية: معرفة موروثة تحفظ الغابة
        - hak ulayat = الحقّ العرفي الجماعي في الأرض
        وفي ٢٠١٣ قضت المحكمة الدستورية بأنّ الغابة العرفية (hutan adat) ليست غابة تابعة للدولة.
      en: |
        The Dayak are many indigenous peoples of Borneo, each with its own language and customs.
        - rumah panjang (betang / lamin) = longhouse, home to many families together
        - berladang = to farm a plot, then leave it to rest after some seasons and move on
        - tetua adat = customary elder, who rules by adat
        - kearifan lokal = local wisdom: inherited knowledge that protects the forest
        - hak ulayat = a community's customary right to its land
        In 2013 the Constitutional Court ruled that customary forest (hutan adat) is not state forest.
    examples:
      - text: Hak ulayat masyarakat adat harus dihormati.
        ar_eg: حق المجتمع العرفي في أرضه لازم يتحترم.
        ar: يجب احترام الحقّ العرفي للمجتمعات الأصلية في أراضيها.
        en: Indigenous communities' customary land rights must be respected.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rumah panjang
        ar_eg: البيت الطويل
        ar: البيت الطويل
        en: longhouse
      - text: berladang
        ar_eg: يزرع أرض ويسيبها ترتاح
        ar: يزرع زراعة متنقّلة
        en: to farm swidden plots
      - text: tetua adat
        ar_eg: كبير القوم
        ar: شيخ القوم
        en: customary elder
      - text: kearifan lokal
        ar_eg: الحكمة المحلية
        ar: الحكمة المحلية
        en: local wisdom
      - text: hak ulayat
        ar_eg: حق عرفي في الأرض
        ar: حقّ عرفي في الأرض
        en: customary land right
    words: [rumah panjang, berladang, tetua adat, kearifan lokal, hak ulayat]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «rumah panjang» عند الداياك إيه؟
      ar: ما «rumah panjang» عند الدّاياك؟
      en: What is a Dayak "rumah panjang"?
    options:
      - عمارة سكنية في المدينة.
      - بيت طويل بتعيش فيه عيلات كتير مع بعض.
      - بيت صيفي على البحر.
    answer: 1
    words: [rumah panjang]
    explain:
      ar_eg: rumah panjang = بيت طويل بتعيش فيه عيلات كتير. مش عمارة في المدينة ولا بيت مصيف.
      ar: rumah panjang بيت طويل تسكنه أسر كثيرة معًا، لا عمارة مدينة ولا بيت صيفي.
      en: A rumah panjang is a long house shared by many families, not a city block or a beach house.
  - id: e03
    type: listen
    text: Tetua adat memutuskan kapan warga boleh berladang di bukit itu.
    question:
      ar_eg: مين اللي بيقرر إمتى الناس تزرع في التل؟
      ar: من يقرّر متى يزرع الناس على التلّ؟
      en: Who decides when people may farm on the hill?
    options:
      - الحكومة.
      - شركة النخيل.
      - كبير القوم.
    answer: 2
    words: [tetua adat, berladang]
  - id: e04
    type: fill_blank
    sentence: Masyarakat Dayak ___ bersama di bukit, lalu membiarkan tanahnya beristirahat.
    meaning:
      ar_eg: الداياك بيزرعوا سوا على التل، وبعدين بيسيبوا الأرض ترتاح.
      ar: يزرع الدّاياك معًا على التلّ، ثم يتركون الأرض لتستريح.
      en: Dayak communities farm the hill together, then let the soil rest.
    options: [berladang, kearifan lokal, hak ulayat]
    answers: [berladang]
    words: [berladang, bersama]
    explain:
      ar_eg: فعل «يزرعوا» = berladang. kearifan lokal = حكمة محلية وhak ulayat = حق عرفي، وهما أسماء.
      ar: الفعل «يزرعون» = berladang. أما kearifan lokal فالحكمة المحلية، وhak ulayat الحقّ العرفي، وهما اسمان.
      en: The verb "farm" is berladang. kearifan lokal and hak ulayat are nouns.
  - id: e05
    type: build_sentence
    source:
      ar_eg: الحكمة المحلية بتحمي الغابة.
      ar: الحكمة المحلية تحمي الغابة.
      en: Local wisdom protects the forest.
    answer: Kearifan lokal melindungi hutan.
    distractors: [ulayat, panjang]
    words: [kearifan lokal]
    explain:
      ar_eg: «الحكمة المحلية» = Kearifan lokal. ulayat من hak ulayat وpanjang من rumah panjang، مش هنا.
      ar: «الحكمة المحلية» = Kearifan lokal. أما ulayat فمن hak ulayat، وpanjang من rumah panjang.
      en: "\"Local wisdom\" is kearifan lokal. ulayat and panjang come from other phrases."
  - id: e06
    type: translate
    direction: from_target
    source_text: Hak ulayat masyarakat adat harus dihormati.
    answers_meaning:
      ar_eg:
        - حق المجتمع العرفي في أرضه لازم يتحترم.
        - لازم نحترم حق السكان الأصليين في أرضهم.
      ar:
        - يجب احترام الحقّ العرفي للمجتمعات الأصلية في أرضها.
        - لا بدّ من احترام حقوق المجتمع العرفي في أرضه.
      en:
        - Indigenous communities' customary land rights must be respected.
        - The customary land rights of adat communities must be honoured.
    words: [hak ulayat, masyarakat adat]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «hak ulayat» يعني إيه؟
      ar: ما «hak ulayat»؟
      en: What is "hak ulayat"?
    options:
      - حق الجماعة العرفي في أرضها المشتركة.
      - ضريبة على الأرض.
      - رخصة صيد في الغابة.
    answer: 0
    words: [hak ulayat]
    explain:
      ar_eg: hak ulayat = حق الجماعة العرفي في أرضها. مش ضريبة ولا رخصة صيد.
      ar: hak ulayat حقّ الجماعة العرفي في أرضها المشتركة، لا ضريبة ولا رخصة صيد.
      en: hak ulayat is a community's customary right to its land, not a tax or hunting licence.
  - id: e08
    type: speaking
    text: Tetua adat menjelaskan kearifan lokal kepada anak-anak muda.
    meaning:
      ar_eg: كبير القوم بيشرح الحكمة المحلية للشباب.
      ar: يشرح شيخ القوم الحكمة المحلية للشباب.
      en: The elder explains local wisdom to the young people.
    words: [tetua adat, kearifan lokal]
  - id: e09
    type: dictation
    text: Dulu banyak keluarga tinggal bersama di rumah panjang.
    meaning:
      ar_eg: زمان عيلات كتير كانت عايشة مع بعض في البيت الطويل.
      ar: قديمًا كانت عائلات كثيرة تسكن معًا في البيت الطويل.
      en: In the past, many families lived together in a longhouse.
    words: [rumah panjang, bersama]
  - id: e10
    type: fill_blank
    sentence: Menurut ___, tanah ini milik bersama seluruh kampung.
    meaning:
      ar_eg: حسب الحق العرفي، الأرض دي ملك القرية كلها.
      ar: بحسب الحقّ العرفي، هذه الأرض ملك مشترك للقرية كلّها.
      en: Under customary right, this land belongs to the whole village.
    options: [hak ulayat, rumah panjang, berladang]
    answers: [hak ulayat]
    words: [hak ulayat, bersama]
    explain:
      ar_eg: «حسب الحق العرفي» = Menurut hak ulayat. rumah panjang = بيت طويل وberladang = يزرع، مش قانون ملكية.
      ar: «بحسب الحقّ العرفي» = Menurut hak ulayat. أما rumah panjang فالبيت الطويل، وberladang «يزرع».
      en: "\"Under customary right\" is menurut hak ulayat. rumah panjang (long house) and berladang (farm) aren't rules of ownership."
dialogue:
  title: Tamu di rumah betang
  lines:
    - speaker: Pak Lawing
      text: Selamat datang di rumah panjang kami. Dua puluh keluarga tinggal di sini.
      ar_eg: أهلًا بيك في بيتنا الطويل. عشرين عيلة عايشين هنا.
      ar: أهلًا بك في بيتنا الطويل، تسكنه عشرون عائلة.
      en: Welcome to our longhouse. Twenty families live here.
    - speaker: Mohamed
      text: Luar biasa, Pak. Apakah Bapak tetua adat di kampung ini?
      ar_eg: حاجة تحفة يا عم. حضرتك كبير القوم في القرية دي؟
      ar: هذا مدهش يا سيدي. هل أنت شيخ القوم في هذه القرية؟
      en: Amazing, sir. Are you the elder of this village?
    - speaker: Pak Lawing
      text: Ya. Kami berladang di bukit, tetapi hutan keramat tidak boleh disentuh. Itu kearifan lokal kami.
      ar_eg: أيوه. إحنا بنزرع على التل، بس الغابة المقدسة محدش يلمسها. دي حكمتنا المحلية.
      ar: نعم. نزرع على التلّ، لكنّ الغابة المقدّسة لا تُمسّ، وهذه حكمتنا المحلية.
      en: Yes. We farm on the hill, but the sacred forest must not be touched. That's our local wisdom.
    - speaker: Mohamed
      text: Lalu bagaimana dengan perusahaan sawit di dekat sini?
      ar_eg: طب وشركة النخيل اللي قريبة من هنا؟
      ar: وماذا عن شركة النخيل القريبة من هنا؟
      en: And what about the palm-oil company nearby?
    - speaker: Pak Lawing
      text: Kami memperjuangkan hak ulayat kami. Tanah ini warisan nenek moyang.
      ar_eg: إحنا بندافع عن حقنا في أرضنا. الأرض دي ورث أجدادنا.
      ar: نناضل من أجل حقّنا العرفي، فهذه الأرض إرث الأجداد.
      en: We're fighting for our customary rights. This land is our ancestors' legacy.
