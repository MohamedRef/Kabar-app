schema: kabar.lesson/v1
id: bipa7.u10.l06
language: id
title: Sidang skripsi
can_do:
  ar_eg: 'تعدّي مناقشة رسالة التخرّج: تعرض، وتردّ على اللجنة، وتشكر مشرفك.'
  ar: 'أن تجتاز مناقشة بحث التخرّج: تعرض وتجيب اللجنة وتشكر مشرفك.'
  en: 'Get through a thesis defence: present, answer the panel, and thank your supervisor.'
slides:
  - title: Tiga puluh menit yang menegangkan
    body:
      ar_eg: |
        علشان تاخد gelar sarjana (درجة البكالوريوس) في إندونيسيا لازم تكتب skripsi (بحث تخرّج).
        - الماجستير اسمه tesis، والدكتوراه disertasi.
        - dosen pembimbing = الدكتور المشرف: بيساعدك من أول الفكرة لآخر صفحة.
        - sidang skripsi = مناقشة البحث: بتعرض حوالي ١٥ دقيقة، وبعدين اللجنة (dosen penguji) بتسأل.
        عبارات:
        - Terima kasih atas pertanyaannya. (شكرًا على السؤال.)
        - Itu keterbatasan penelitian saya. (دي من حدود بحثي.)
        - Terima kasih kepada dosen pembimbing saya… (شكر للمشرف…)
        - في الكلام: aja = saja، terus = lalu، buat = untuk.
      ar: |
        لنيل الـ gelar sarjana (درجة البكالوريوس) في إندونيسيا لا بدّ من كتابة skripsi (بحث التخرّج).
        - ويُسمّى بحث الماجستير tesis، والدكتوراه disertasi.
        - dosen pembimbing = الأستاذ المشرف، يرافقك من الفكرة إلى آخر صفحة.
        - sidang skripsi = مناقشة البحث: تعرض نحو ١٥ دقيقة، ثمّ تسأل اللجنة (dosen penguji).
        عبارات:
        - Terima kasih atas pertanyaannya. (شكرًا على السؤال.)
        - Itu keterbatasan penelitian saya. (ذلك من حدود بحثي.)
        - Terima kasih kepada dosen pembimbing saya… (الشكر لمشرفي…)
        - في الكلام اليومي: aja = saja، terus = lalu، buat = untuk.
      en: |
        To earn a gelar sarjana (bachelor's degree) in Indonesia you write a skripsi (undergraduate thesis).
        - A master's thesis is a tesis, a doctorate a disertasi.
        - dosen pembimbing = supervisor, who guides you from the idea to the last page.
        - sidang skripsi = thesis defence: you present for about 15 minutes, then the panel (dosen penguji) asks questions.
        Phrases:
        - Terima kasih atas pertanyaannya. (Thank you for the question.)
        - Itu keterbatasan penelitian saya. (That's a limitation of my study.)
        - Terima kasih kepada dosen pembimbing saya… (Thanks to my supervisor…)
        - In speech: aja = saja, terus = lalu, buat = untuk.
    examples:
      - text: Setelah sidang skripsi, Rani resmi mendapat gelar sarjana.
        ar_eg: بعد مناقشة البحث، راني خدت درجة البكالوريوس رسميًا.
        ar: بعد مناقشة البحث نالت راني درجة البكالوريوس رسميًّا.
        en: After her thesis defence, Rani officially earned her bachelor's degree.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: skripsi
        ar_eg: بحث التخرّج
        ar: بحث التخرّج
        en: undergraduate thesis
      - text: sidang skripsi
        ar_eg: مناقشة البحث
        ar: مناقشة البحث
        en: thesis defence
      - text: dosen pembimbing
        ar_eg: الدكتور المشرف
        ar: الأستاذ المشرف
        en: supervisor
      - text: gelar sarjana
        ar_eg: درجة البكالوريوس
        ar: درجة البكالوريوس
        en: bachelor's degree
      - text: partisipan
        ar_eg: مشارك
        ar: مشارك
        en: participant
    words: [skripsi, sidang skripsi, dosen pembimbing, gelar sarjana, partisipan]
  - id: e02
    type: listen
    text: Sidang skripsi Mohamed dimulai pukul sembilan di ruang seminar.
    question:
      ar_eg: إيه اللي هيبدأ الساعة تسعة؟
      ar: ما الذي يبدأ في التاسعة؟
      en: What starts at nine?
    options:
      - محاضرة عادية.
      - مناقشة بحث تخرّج محمد.
      - حفلة تخرّج.
    answer: 1
    words: [sidang skripsi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: بحث الماجستير اسمه إيه بالإندونيسي؟
      ar: ما اسم بحث الماجستير بالإندونيسية؟
      en: What is a master's thesis called in Indonesian?
    options:
      - skripsi
      - disertasi
      - tesis
    answer: 2
    words: [skripsi]
    explain:
      ar_eg: رسالة الماجستير اسمها tesis. skripsi للبكالوريوس وdisertasi للدكتوراه.
      ar: رسالة الماجستير tesis، وskripsi للبكالوريوس وdisertasi للدكتوراه.
      en: Master's = tesis; skripsi is bachelor's; disertasi is PhD.
  - id: e04
    type: fill_blank
    sentence: Pak Elias adalah ___ saya. Beliau membaca setiap bab skripsi saya.
    meaning:
      ar_eg: الأستاذ إلياس هو المشرف بتاعي. بيقرا كل فصل في بحثي.
      ar: الأستاذ إلياس مشرفي، يقرأ كلّ فصل من بحثي.
      en: Pak Elias is my supervisor. He reads every chapter of my thesis.
    options: [dosen pembimbing, pemakalah, partisipan]
    answers: [dosen pembimbing]
    words: [dosen pembimbing, skripsi]
    explain:
      ar_eg: اللي بيقرا كل فصل هو dosen pembimbing = المشرف. pemakalah وpartisipan مش ليهم دعوة.
      ar: من يقرأ كل فصل هو dosen pembimbing أي المشرف.
      en: A supervisor is a dosen pembimbing.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللجنة سألت عن حاجة بحثك ماغطّاهاش. تقول إيه؟
      ar: سألت اللجنة عن أمر لم يتناوله بحثك. ماذا تقول؟
      en: The panel asks about something your study didn't cover. What do you say?
    options:
      - Itu keterbatasan penelitian saya. Terima kasih atas pertanyaannya.
      - Pertanyaan itu salah.
      - Saya tidak mau menjawab.
    answer: 0
    words: [sidang skripsi]
    explain:
      ar_eg: "الرد الأمين المؤدب: ده من keterbatasan (حدود) بحثي، وشكرًا على السؤال. الرفض والهجوم مش لايقين."
      ar: "الرد المهذب: هذا من keterbatasan بحثي، شكرًا على السؤال."
      en: Name it as a limitation and thank the asker.
  - id: e06
    type: build_sentence
    source:
      ar_eg: هاخد درجة البكالوريوس السنة الجاية.
      ar: سأنال درجة البكالوريوس العام القادم.
      en: I'll get my bachelor's degree next year.
    answer: Saya akan mendapat gelar sarjana tahun depan.
    distractors: [skripsi, sidang]
    words: [gelar sarjana]
    explain:
      ar_eg: Saya akan mendapat (هاخد) + gelar sarjana (شهادة البكالوريوس) + tahun depan. skripsi وsidang زيادة.
      ar: Saya akan mendapat gelar sarjana tahun depan. skripsi وsidang زائدتان.
      en: Saya akan mendapat + gelar sarjana + tahun depan. skripsi and sidang are extra.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بشكر مشرفي على صبره.
      ar: أشكر مشرفي على صبره.
      en: I thank my supervisor for his patience.
    answers:
      - Terima kasih kepada dosen pembimbing saya atas kesabarannya.
      - Saya berterima kasih kepada dosen pembimbing saya atas kesabarannya.
      - Saya mengucapkan terima kasih kepada dosen pembimbing atas kesabaran beliau.
      - Terima kasih kepada dosen pembimbing saya atas kesabaran beliau.
      - Makasih kepada dosen pembimbing saya atas kesabarannya.
      - Saya mengucapkan makasih kepada dosen pembimbing atas kesabaran beliau.
      - Makasih kepada dosen pembimbing saya atas kesabaran beliau.
    words: [dosen pembimbing]
  - id: e08
    type: speaking
    text: Skripsi saya membahas pertanian ubi jalar di Lembah Baliem.
    meaning:
      ar_eg: بحثي بيتكلّم عن زراعة البطاطا الحلوة في وادي باليم.
      ar: يتناول بحثي زراعة البطاطا الحلوة في وادي باليم.
      en: My thesis is about sweet-potato farming in the Baliem Valley.
    words: [skripsi]
  - id: e09
    type: dictation
    text: Sidang skripsi biasanya berlangsung sekitar satu jam.
    meaning:
      ar_eg: مناقشة البحث عادةً بتاخد حوالي ساعة.
      ar: تستغرق مناقشة البحث عادةً نحو ساعة.
      en: A thesis defence usually lasts about an hour.
    words: [sidang skripsi]
  - id: e10
    type: speaking
    text: Selamat! Sidang skripsimu lulus, dan gelar sarjanamu sudah di tangan.
    meaning:
      ar_eg: مبروك! عدّيت المناقشة، ودرجة البكالوريوس بقت في إيدك خلاص.
      ar: مبارك! اجتزت المناقشة، ودرجة البكالوريوس صارت في يدك.
      en: Congratulations! You passed your defence, and your degree is in your hands.
    words: [sidang skripsi, gelar sarjana]
dialogue:
  title: Di depan pintu ruang sidang
  lines:
    - speaker: Mohamed
      text: Pak Elias, tangan saya dingin. Bagaimana kalau penguji bertanya tentang hal yang tidak saya teliti?
      ar_eg: يا أستاذ إلياس، إيديّا متلّجة. ولو اللجنة سألت عن حاجة ماعملتش فيها بحث؟
      ar: يا أستاذ إلياس، يداي باردتان. ماذا لو سأل الممتحنون عمّا لم أبحثه؟
      en: Pak Elias, my hands are cold. What if the examiners ask about something I didn't study?
    - speaker: Pak Elias
      text: Jujur aja. Bilang, "Itu keterbatasan penelitian saya," terus usulkan penelitian berikutnya.
      ar_eg: 'خلّيك صريح. قول: «دي من حدود بحثي»، وبعدين اقترح بحث جاي.'
      ar: 'كن صادقًا، وقل: «ذلك من حدود بحثي»، ثمّ اقترح بحثًا لاحقًا.'
      en: Just be honest. Say, "That's a limitation of my study," then suggest the next piece of research.
    - speaker: Mohamed
      text: Baik. Terima kasih, Pak. Bapak dosen pembimbing terbaik.
      ar_eg: تمام. شكرًا يا أستاذ. حضرتك أحسن مشرف.
      ar: حسنًا، شكرًا يا أستاذ، أنت خير مشرف.
      en: Okay. Thank you, sir. You're the best supervisor.
    - speaker: Pak Elias
      text: Simpan terima kasihmu buat setelah sidang skripsi. Ayo masuk!
      ar_eg: خلّي الشكر لبعد المناقشة. يلا ادخل!
      ar: ادّخر شكرك لما بعد المناقشة، هيّا ادخل!
      en: Save your thanks for after the defence. In you go!
