schema: kabar.lesson/v1
id: bipa2.u09.l01
language: id
title: Wah! Aduh! Lho?
can_do:
  ar_eg: تتفاعل بشكل طبيعي وتعبّر عن إحساسك بكلمات صغيرة زي wah وaduh.
  ar: أن تتفاعل بشكل طبيعي وتعبّر عن مشاعرك بألفاظ التعجب.
  en: React naturally.
slides:
  - title: Wah! Aduh!
    body:
      ar_eg: |
        الكلمات الصغيرة دي هي اللي هتخلي كلامك طبيعي ومش «كتاب»:
        - wah = ياه / واو! للإعجاب والمفاجأة الحلوة.
        - aduh = آه! (وجع) أو يا خبر! (مشكلة).
      ar: |
        هذه الألفاظ الصغيرة تجعل كلامك طبيعيًا لا كلام كتب:
        - wah = للإعجاب والدهشة السارّة.
        - aduh = للألم (آه!) أو للضيق (يا للمصيبة!).
      en: |
        These little words make you sound human, not textbook:
        - wah = wow! (admiration, pleasant surprise)
        - aduh = ouch! (pain) or oh no! (trouble)
    grammar: id.interjection.particles
    examples:
      - text: Wah, pantainya indah banget!
        ar_eg: ياه، البحر جميل أوي!
        ar: يا للروعة، الشاطئ جميل جدًا!
        en: Wow, the beach is so beautiful!
  - title: Lho? Kok?
    body:
      ar_eg: |
        - lho (أو loh) = إيه ده! لما تتفاجئ أو تنبّه حد.
        - kok = إزاي يعني؟ / ليه كده؟ استغراب، وبتيجي في أول السؤال.
      ar: |
        - lho (أو loh) = للتنبيه والمفاجأة.
        - kok = كيف ذلك؟ للاستغراب، وتأتي أول السؤال.
      en: |
        - lho (or loh) = hey! / oh! — surprise or a heads-up.
        - kok = how come? — puzzlement; it opens the question.
    grammar: id.interjection.particles
    examples:
      - text: Lho, kamu di sini?
        ar_eg: إيه ده، إنت هنا؟
        ar: عجبًا، أأنت هنا؟
        en: Oh! You're here?
      - text: Kok mahal sekali?
        ar_eg: إزاي غالي كده؟
        ar: كيف يكون غاليًا هكذا؟
        en: How come it's so expensive?
  - title: Dong, sih, deh
    body:
      ar_eg: |
        الحروف دي بتيجي بعد الكلمة:
        - dong = بقى (إلحاح لطيف): Ayo dong! = يلا بقى!
        - sih = يعني / أصل (بتلطف السؤال): Kenapa sih? = ليه بس؟
        - deh = خلاص / ماشي: Ya udah deh = خلاص ماشي.
        المصري عنده نفس الحروف دي بالظبط!
      ar: |
        تأتي هذه الأدوات بعد الكلمة:
        - dong للإلحاح اللطيف: Ayo dong! = هيّا إذن!
        - sih لتلطيف السؤال أو التعليل: Kenapa sih؟ = لماذا يا ترى؟
        - deh للموافقة: Ya udah deh = حسنًا إذن.
      en: |
        These come after the word they colour:
        - dong = come on (gentle push): Ayo dong!
        - sih = well / anyway (softens questions): Kenapa sih?
        - deh = OK then: Ya udah deh.
        Egyptian has exact matches — dong ≈ «بقى».
    grammar: id.interjection.particles
    examples:
      - text: Ikut dong!
        ar_eg: خدوني معاكم بقى!
        ar: خذوني معكم!
        en: Let me come too!
      - text: Ya udah deh, besok saja.
        ar_eg: خلاص ماشي، بكرة بقى.
        ar: حسنًا إذن، غدًا.
        en: OK then, tomorrow.
  - title: Kan? Ya?
    body:
      ar_eg: |
        - kan = مش كده؟ / ما إنت عارف: Kan sudah saya bilang = ما أنا قلتلك.
        - ya في آخر الطلب بيلطفه: Tunggu sebentar, ya = استنى شوية، ماشي؟
        كل الكلمات دي عامية، للكلام والشات مع الصحاب. في الإيميل الرسمي استخدم mohon بدل dong.
      ar: |
        - kan = أليس كذلك؟: Kan sudah saya bilang = ألم أقل لك؟
        - ya في آخر الطلب تلطّفه: Tunggu sebentar, ya.
        وكلها عامية للكلام والمحادثات، وفي الرسائل الرسمية تُستعمل mohon بدل dong.
      en: |
        - kan = right? / you know: Kan sudah saya bilang = I told you, didn't I.
        - ya at the end softens a request: Tunggu sebentar, ya.
        All informal — for speech and chats with friends. In a formal email use mohon, not dong.
    grammar: id.interjection.particles
    examples:
      - text: Tunggu sebentar, ya.
        ar_eg: استنى شوية، ماشي؟
        ar: انتظر قليلًا من فضلك.
        en: Wait a moment, OK?
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: إنت شايف غروب جميل جدًا على البحر في لوفينا. تقول إيه؟
      ar: ترى غروبًا رائعًا على البحر في لوفينا. ماذا تقول؟
      en: You see a gorgeous sunset over the sea at Lovina. What do you say?
    options: ['Deh, indah sekali!', 'Wah, indah sekali!', 'Aduh, indah sekali!']
    answer: 1
    explain:
      ar_eg: wah للإعجاب. aduh للوجع أو المشكلة.
      ar: wah للإعجاب، وaduh للألم أو الضيق.
      en: wah is for admiration; aduh is for pain or trouble.
    words: [wah]
  - id: e02
    type: listen
    text: Lho, kamu di sini?
    options: ['Kok kamu di sini?', 'Wah, kamu di sini!', 'Lho, kamu di sini?']
    answer: 2
    words: [lho, kok, wah]
  - id: e03
    type: fill_blank
    sentence: Ayo ___! Saya juga mau ke Lovina, lho.
    meaning:
      ar_eg: يلا بقى! أنا كمان عايز أروح لوفينا على فكرة.
      ar: هيّا إذن! أنا أيضًا أريد الذهاب إلى لوفينا.
      en: Come on! I want to go to Lovina as well, you know.
    options: [kan, lho, dong]
    answers: [dong]
    words: [dong, lho]
  - id: e04
    type: match_pairs
    pairs:
      - text: kok
        ar_eg: إزاي كده؟ (استغراب)
        ar: كيف ذلك؟ (استغراب)
        en: how come? (surprise)
      - text: dong
        ar_eg: بقى (إلحاح)
        ar: هيّا (إلحاح)
        en: come on (urging)
      - text: sih
        ar_eg: يعني / بقى (تليين السؤال)
        ar: يا ترى (تليين)
        en: softener in questions
      - text: deh
        ar_eg: خلاص / طيب (موافقة)
        ar: حسنًا (قبول)
        en: OK then (agreeing)
      - text: kan
        ar_eg: مش كده؟
        ar: أليس كذلك؟
        en: right? isn't it?
      - text: ketinggalan
        ar_eg: اتنسى / فاته
        ar: تُرك سهوًا
        en: left behind
    words: [kok, dong, sih, deh, kan, ketinggalan]
  - id: e05
    type: listen
    text: Kameranya ketinggalan, kan?
    options: ['Kameranya ketinggalan, kan?', 'Kameranya ketinggalan, lho!', 'Kok kameranya ketinggalan, sih?']
    answer: 0
    meaning:
      ar_eg: الكاميرا اتنسيت، مش كده؟
      ar: نسينا الكاميرا، أليس كذلك؟
      en: The camera got left behind, right?
    words: [ketinggalan, kan, lho, kok, sih]
  - id: e06
    type: speaking
    text: Wah, lumba-lumbanya banyak sekali! Aduh, kameranya ketinggalan!
    meaning:
      ar_eg: ياه، الدلافين كتير أوي! يا خبر، الكاميرا اتنسيت!
      ar: يا للروعة، الدلافين كثيرة جدًا! يا للمصيبة، نسيتُ الكاميرا!
      en: Wow, there are so many dolphins! Oh no, the camera got left behind!
    words: [wah, lumba-lumba, aduh, ketinggalan]
  - id: e07
    type: multiple_choice
    question: Kok mahal ___?
    question_meaning:
      ar_eg: (بتشتكي) إزاي غالي كده بقى؟
      ar: (تشكو) كيف يكون غاليًا هكذا؟
      en: (complaining) How come it's so expensive?
    options: [sih, dong, deh, kan]
    answer: 0
    explain:
      ar_eg: sih بتيجي مع kok وkenapa عشان تليّن السؤال أو الشكوى. dong للطلب، وdeh للموافقة.
      ar: sih ترافق kok وkenapa لتليين السؤال أو الشكوى، وdong للطلب، وdeh للموافقة.
      en: sih goes with kok / kenapa to soften a question or complaint; dong urges, deh agrees.
    words: [kok, sih, dong, deh, kan]
dialogue:
  title: Pagi di perahu
  lines:
    - speaker: Ni Luh
      text: Mohamed, lihat! Itu lumba-lumba!
      ar_eg: يا محمد، بص! دي دلافين!
      ar: يا محمد، انظر! تلك دلافين!
      en: Mohamed, look! Dolphins!
    - speaker: Mohamed
      text: Wah, banyak sekali! Indah banget!
      ar_eg: ياه، كتير أوي! حلوين جدًا!
      ar: يا للروعة، كثيرة جدًا! جميلة للغاية!
      en: Wow, so many! So beautiful!
    - speaker: Ni Luh
      text: Lho, kamera kamu mana?
      ar_eg: إيه ده، فين الكاميرا بتاعتك؟
      ar: عجبًا، أين كاميرتك؟
      en: Hey, where's your camera?
    - speaker: Mohamed
      text: Aduh, kameranya ketinggalan di hotel!
      ar_eg: يا خبر، الكاميرا نسيتها في الفندق!
      ar: يا للمصيبة، نسيت الكاميرا في الفندق!
      en: Oh no, I left the camera at the hotel!
    - speaker: Ni Luh
      text: Kok bisa? Pakai HP saja, dong!
      ar_eg: إزاي يعني؟ صوّر بالموبايل بقى!
      ar: كيف حدث هذا؟ صوّر بالهاتف إذن!
      en: How come? Just use your phone, then!
    - speaker: Mohamed
      text: Oh iya, ya. Ayo, kita foto!
      ar_eg: آه صح. يلا نتصور!
      ar: آه، صحيح. هيّا نلتقط صورة!
      en: Oh right. Come on, let's take a photo!
new_words:
  - word: wah
    pos: interjection
    ar_eg: ياه! / واو!
    ar: يا للروعة!
    en: wow!
  - word: lho
    pos: interjection
    ar_eg: إيه ده! (مفاجأة)
    ar: عجبًا! (مفاجأة وتنبيه)
    en: hey! / oh! (surprise)
  - word: kok
    pos: particle
    ar_eg: إزاي يعني؟ / ليه كده؟
    ar: كيف ذلك؟ (استغراب)
    en: how come?
  - word: dong
    pos: particle
    ar_eg: بقى (إلحاح لطيف)
    ar: إذن (إلحاح لطيف)
    en: come on (gentle insistence)
  - word: sih
    pos: particle
    ar_eg: يعني / بس (بتلطّف السؤال)
    ar: يا ترى (تلطّف السؤال)
    en: well, anyway (softener)
  - word: deh
    pos: particle
    ar_eg: خلاص، ماشي
    ar: حسنًا إذن
    en: OK then
  - word: kan
    pos: particle
    ar_eg: مش كده؟ / ما إنت عارف
    ar: أليس كذلك؟
    en: right? / you know
  - word: ketinggalan
    pos: verb
    ar_eg: اتنسى، فضل ورا
    ar: نُسي وتُرك خلفك
    en: left behind
