schema: kabar.lesson/v1
id: bipa2.u09.l01
language: id
title: Wah! Aduh! Lho?
can_do:
  ar_eg: تتفاعل بشكل طبيعي وتعبّر عن إحساسك بكلمات صغيرة زي wah وaduh.
  ar: أن تتفاعل بشكل طبيعي وتعبّر عن مشاعرك بألفاظ التعجب.
  en: React naturally.
slides:
  - title: Wah! Aduh!
    body:
      ar_eg: |
        الكلمات الصغيرة دي هي اللي هتخلي كلامك طبيعي ومش «كتاب»:
        - wah = ياه / واو! للإعجاب والمفاجأة الحلوة.
        - aduh = آه! (وجع) أو يا خبر! (مشكلة).
      ar: |
        هذه الألفاظ الصغيرة تجعل كلامك طبيعيًا لا كلام كتب:
        - wah = للإعجاب والدهشة السارّة.
        - aduh = للألم (آه!) أو للضيق (يا للمصيبة!).
      en: |
        These little words make you sound human, not textbook:
        - wah = wow! (admiration, pleasant surprise)
        - aduh = ouch! (pain) or oh no! (trouble)
    grammar: id.interjection.particles
    examples:
      - text: Wah, pantainya indah banget!
        ar_eg: ياه، البحر جميل أوي!
        ar: يا للروعة، الشاطئ جميل جدًا!
        en: Wow, the beach is so beautiful!
      - text: Aduh, dompet saya ketinggalan!
        ar_eg: يا نهار، المحفظة نسيتها!
        ar: يا للمصيبة، نسيت محفظتي!
        en: Oh no, I left my wallet behind!
  - title: Lho? Kok?
    body:
      ar_eg: |
        - lho (أو loh) = إيه ده! لما تتفاجئ أو تنبّه حد.
        - kok = إزاي يعني؟ / ليه كده؟ استغراب، وبتيجي في أول السؤال.
      ar: |
        - lho (أو loh) = للتنبيه والمفاجأة.
        - kok = كيف ذلك؟ للاستغراب، وتأتي أول السؤال.
      en: |
        - lho (or loh) = hey! / oh! — surprise or a heads-up.
        - kok = how come? — puzzlement; it opens the question.
    grammar: id.interjection.particles
    examples:
      - text: Lho, kamu di sini?
        ar_eg: إيه ده، إنت هنا؟
        ar: عجبًا، أأنت هنا؟
        en: Oh! You're here?
      - text: Kok mahal sekali?
        ar_eg: إزاي غالي كده؟
        ar: كيف يكون غاليًا هكذا؟
        en: How come it's so expensive?
  - title: Dong, sih, deh
    body:
      ar_eg: |
        الحروف دي بتيجي بعد الكلمة:
        - dong = بقى (إلحاح لطيف): Ayo dong! = يلا بقى!
        - sih = يعني / أصل (بتلطف السؤال): Kenapa sih? = ليه بس؟
        - deh = خلاص / ماشي: Ya udah deh = خلاص ماشي.
        المصري عنده نفس الحروف دي بالظبط!
      ar: |
        تأتي هذه الأدوات بعد الكلمة:
        - dong للإلحاح اللطيف: Ayo dong! = هيّا إذن!
        - sih لتلطيف السؤال أو التعليل: Kenapa sih؟ = لماذا يا ترى؟
        - deh للموافقة: Ya udah deh = حسنًا إذن.
      en: |
        These come after the word they colour:
        - dong = come on (gentle push): Ayo dong!
        - sih = well / anyway (softens questions): Kenapa sih?
        - deh = OK then: Ya udah deh.
        Egyptian has exact matches — dong ≈ «بقى».
    grammar: id.interjection.particles
    examples:
      - text: Ikut dong!
        ar_eg: خدوني معاكم بقى!
        ar: خذوني معكم!
        en: Let me come too!
      - text: Ya udah deh, besok saja.
        ar_eg: خلاص ماشي، بكرة بقى.
        ar: حسنًا إذن، غدًا.
        en: OK then, tomorrow.
  - title: Kan? Ya?
    body:
      ar_eg: |
        - kan = مش كده؟ / ما إنت عارف: Kan sudah saya bilang = ما أنا قلتلك.
        - ya في آخر الطلب بيلطفه: Tunggu sebentar, ya = استنى شوية، ماشي؟
        كل الكلمات دي عامية، للكلام والشات مع الصحاب. في الإيميل الرسمي استخدم mohon بدل dong.
      ar: |
        - kan = أليس كذلك؟: Kan sudah saya bilang = ألم أقل لك؟
        - ya في آخر الطلب تلطّفه: Tunggu sebentar, ya.
        وكلها عامية للكلام والمحادثات، وفي الرسائل الرسمية تُستعمل mohon بدل dong.
      en: |
        - kan = right? / you know: Kan sudah saya bilang = I told you, didn't I.
        - ya at the end softens a request: Tunggu sebentar, ya.
        All informal — for speech and chats with friends. In a formal email use mohon, not dong.
    grammar: id.interjection.particles
    examples:
      - text: Tunggu sebentar, ya.
        ar_eg: استنى شوية، ماشي؟
        ar: انتظر قليلًا من فضلك.
        en: Wait a moment, OK?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wah
        ar_eg: ياه! / واو!
        ar: يا للروعة!
        en: wow!
      - text: aduh
        ar_eg: آه! / يا خبر!
        ar: آه! / يا للمصيبة!
        en: ouch! / oh no!
      - text: kok
        ar_eg: إزاي يعني؟
        ar: كيف ذلك؟
        en: how come?
      - text: dong
        ar_eg: بقى
        ar: هيّا إذن (إلحاح لطيف)
        en: come on (gentle push)
    words: [wah, aduh, kok, dong]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إنت شايف غروب جميل جدًا على البحر في لوفينا. تقول إيه؟
      ar: ترى غروبًا رائعًا على البحر في لوفينا. ماذا تقول؟
      en: You see a gorgeous sunset over the sea at Lovina. What do you say?
    options: ["Deh, indah sekali!", "Wah, indah sekali!", "Aduh, indah sekali!"]
    answer: 1
    explain:
      ar_eg: wah للإعجاب. aduh للوجع أو المشكلة.
      ar: wah للإعجاب، وaduh للألم أو الضيق.
      en: wah is for admiration; aduh is for pain or trouble.
    words: [wah]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: رجلك خبطت في الكرسي. تقول إيه؟
      ar: اصطدمت قدمك بالكرسي. ماذا تقول؟
      en: You bang your foot on a chair. What do you say?
    options: ["Dong, sakit!", "Aduh, sakit!", "Wah, sakit!"]
    answer: 1
    words: [aduh]
  - id: e04
    type: listen
    text: Lho, kamu di sini?
    options: ["Wah, kamu di sini!", "Aduh, kamu di sini!", "Lho, kamu di sini?"]
    answer: 2
    words: [lho]
  - id: e05
    type: fill_blank
    sentence: ___ mahal sekali? Kemarin cuma dua puluh ribu.
    meaning:
      ar_eg: إزاي غالي كده؟ امبارح كان بعشرين ألف بس.
      ar: كيف صار غاليًا هكذا؟ كان أمس بعشرين ألفًا فقط.
      en: How come it's so expensive? Yesterday it was only twenty thousand.
    options: ["Deh", "Wah", "Kok"]
    answers: [Kok]
    explain:
      ar_eg: kok في أول السؤال = إزاي يعني؟ (استغراب).
      ar: kok في أول السؤال للاستغراب.
      en: kok opens a puzzled "how come?" question.
    words: [kok]
  - id: e06
    type: fill_blank
    sentence: Ikut ___! Saya juga mau ke Lovina.
    meaning:
      ar_eg: خدوني معاكم بقى! أنا كمان عايز أروح لوفينا.
      ar: خذوني معكم! أنا أيضًا أريد الذهاب إلى لوفينا.
      en: Let me come too! I want to go to Lovina as well.
    options: ["kan", "lho", "dong"]
    answers: [dong]
    words: [dong]
  - id: e07
    type: fill_blank
    sentence: Tunggu sebentar, ___.
    meaning:
      ar_eg: استنى شوية، ماشي؟
      ar: انتظر قليلًا، من فضلك.
      en: Wait a moment, OK?
    options: ["ya", "kok", "aduh"]
    answers: [ya]
    words: [ya]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: بتكتب إيميل رسمي للجامعة. أنهي جملة تنفع؟
      ar: تكتب رسالة رسمية إلى الجامعة. أيّ الجملتين تناسب؟
      en: You're writing a formal email to the university. Which sentence fits?
    options: ["Mohon kirimkan dokumennya.", "Kirim dokumennya dong."]
    answer: 0
    explain:
      ar_eg: dong عامية، للصحاب بس. في الرسمي استخدم mohon.
      ar: dong عامية، والرسمي mohon.
      en: dong is casual; formal writing uses mohon.
    words: [dong, mohon]
  - id: e09
    type: build_sentence
    source:
      ar_eg: ياه، البحر جميل أوي!
      ar: يا للروعة، الشاطئ جميل جدًا!
      en: Wow, the beach is so beautiful!
    answer: Wah, pantainya indah banget!
    distractors: [aduh, kok]
    words: [wah, indah, banget]
  - id: e10
    type: build_sentence
    source:
      ar_eg: يا خبر، نسيت الكاميرا!
      ar: يا للمصيبة، نسيت الكاميرا!
      en: Oh no, I left my camera behind!
    answer: Aduh, kamera saya ketinggalan!
    distractors: [wah, dong]
    words: [aduh, ketinggalan]
  - id: e11
    type: translate
    direction: from_target
    source_text: Kan sudah saya bilang!
    answers_meaning:
      ar_eg: ["ما أنا قلتلك!", "مش أنا قلتلك؟", "ما قلتلك!"]
      ar: ["ألم أقل لك!", "قلتُ لك ذلك!", "ألم أخبرك؟"]
      en: ["I told you!", "Didn't I tell you?", "I already told you!"]
    words: [kan]
  - id: e12
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إزاي غالي أوي كده؟
      ar: كيف يكون غاليًا إلى هذا الحد؟
      en: How come it's so expensive?
    answers:
      - Kok mahal sekali?
      - Kok mahal banget?
      - Kok mahal sekali
      - Kok mahal banget
      - Kok mahal banget sih?
      - Kok mahal sekali sih?
      - Kok mahal sih?
      - Kenapa mahal sekali?
      - Kenapa mahal banget?
    words: [kok]
  - id: e13
    type: dictation
    text: Aduh, kameranya ketinggalan!
    meaning:
      ar_eg: يا خبر، الكاميرا اتنسيت!
      ar: يا للمصيبة، نسيتُ الكاميرا!
      en: Oh no, the camera got left behind!
    words: [aduh, ketinggalan]
  - id: e14
    type: speaking
    text: Wah, lumba-lumbanya banyak sekali!
    meaning:
      ar_eg: ياه، الدلافين كتير أوي!
      ar: يا للروعة، الدلافين كثيرة جدًا!
      en: Wow, there are so many dolphins!
    words: [wah, lumba-lumba]
dialogue:
  title: Pagi di perahu
  lines:
    - speaker: Ni Luh
      text: Mohamed, lihat! Itu lumba-lumba!
      ar_eg: يا محمد، بص! دي دلافين!
      ar: يا محمد، انظر! تلك دلافين!
      en: Mohamed, look! Dolphins!
    - speaker: Mohamed
      text: Wah, banyak sekali! Indah banget!
      ar_eg: ياه، كتير أوي! حلوين جدًا!
      ar: يا للروعة، كثيرة جدًا! جميلة للغاية!
      en: Wow, so many! So beautiful!
    - speaker: Ni Luh
      text: Lho, kamera kamu mana?
      ar_eg: إيه ده، فين الكاميرا بتاعتك؟
      ar: عجبًا، أين كاميرتك؟
      en: Hey, where's your camera?
    - speaker: Mohamed
      text: Aduh, kameranya ketinggalan di hotel!
      ar_eg: يا خبر، الكاميرا نسيتها في الفندق!
      ar: يا للمصيبة، نسيت الكاميرا في الفندق!
      en: Oh no, I left the camera at the hotel!
    - speaker: Ni Luh
      text: Kok bisa? Pakai HP saja, dong!
      ar_eg: إزاي يعني؟ صوّر بالموبايل بقى!
      ar: كيف حدث هذا؟ صوّر بالهاتف إذن!
      en: How come? Just use your phone, then!
    - speaker: Mohamed
      text: Oh iya, ya. Ayo, kita foto!
      ar_eg: آه صح. يلا نتصور!
      ar: آه، صحيح. هيّا نلتقط صورة!
      en: Oh right. Come on, let's take a photo!
