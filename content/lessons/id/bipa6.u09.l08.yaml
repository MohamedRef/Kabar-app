schema: kabar.lesson/v1
id: bipa6.u09.l08
language: id
title: Membalas penawaran
can_do:
  ar_eg: ترد كتابةً على عرض تجاري، تقبل أو تعدّل وتطلب تأكيد.
  ar: أن تردّ كتابةً على عرض تجاري فتقبله أو تعدّله وتطلب التأكيد.
  en: Answer a business offer in writing, accepting or adjusting it and asking for confirmation.
slides:
  - title: Balasan yang rapi
    grammar: id.register.formal-informal
    body:
      ar_eg: |
        الرد على penawaran (عرض) بيمشي كده:
        1. اشكر: Terima kasih atas penawaran yang Bapak kirimkan.
        2. اقبل أو عدّل: Kami bersedia memesan 500 kg dengan harga satuan Rp80.000.
        3. اطلب تأكيد: Mohon konfirmasi jadwal pengiriman.
        4. اقفل رسمي: Atas perhatiannya, kami ucapkan terima kasih. Hormat kami, …
        الـ pesanan = الطلبية، والـ harga satuan = سعر الوحدة.
      ar: |
        يسير الردّ على penawaran (العرض) هكذا:
        1. اشكر: Terima kasih atas penawaran yang Bapak kirimkan.
        2. اقبل أو عدّل: Kami bersedia memesan 500 kg dengan harga satuan Rp80.000.
        3. اطلب التأكيد: Mohon konfirmasi jadwal pengiriman.
        4. اختم رسميًّا: Atas perhatiannya, kami ucapkan terima kasih. Hormat kami, …
        والـ pesanan = الطلبية، والـ harga satuan = سعر الوحدة.
      en: |
        A reply to a penawaran (offer) goes like this:
        1. Thank them: Terima kasih atas penawaran yang Bapak kirimkan.
        2. Accept or adjust: Kami bersedia memesan 500 kg dengan harga satuan Rp80.000.
        3. Ask for confirmation: Mohon konfirmasi jadwal pengiriman.
        4. Close formally: Atas perhatiannya, kami ucapkan terima kasih. Hormat kami, …
        pesanan = order, harga satuan = unit price.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: penawaran
        ar_eg: عرض (أسعار)
        ar: عرض تجاري
        en: (business) offer, quotation
      - text: konfirmasi
        ar_eg: تأكيد
        ar: تأكيد
        en: confirmation
      - text: pesanan
        ar_eg: طلبية
        ar: طلبية
        en: order
      - text: harga satuan
        ar_eg: سعر الوحدة
        ar: سعر الوحدة
        en: unit price
    words: [penawaran, konfirmasi, pesanan, harga satuan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة بتقبل جزء من العرض؟
      ar: أيّ جملة تقبل جزءًا من العرض؟
      en: Which sentence accepts part of the offer?
    options:
      - Kami bersedia memesan 500 kg, bukan 1.000 kg.
      - Kami menolak semuanya.
      - Terima kasih, sampai jumpa.
    answer: 0
  - id: e03
    type: fill_blank
    sentence: Mohon ___ jadwal pengiriman paling lambat hari Jumat.
    meaning:
      ar_eg: لو سمحت أكّد ميعاد الشحن في موعد أقصاه يوم الجمعة.
      ar: يُرجى تأكيد موعد الشحن في موعد أقصاه الجمعة.
      en: Please confirm the delivery schedule by Friday at the latest.
    options: [konfirmasi, pesanan, penawaran]
    answers: [konfirmasi]
    words: [konfirmasi]
  - id: e04
    type: listen
    text: Harga satuannya delapan puluh ribu rupiah per kilo.
    question:
      ar_eg: سعر الوحدة كام؟
      ar: كم سعر الوحدة؟
      en: What is the unit price?
    options:
      - تمنتاشر ألف للكيلو.
      - تمانين ألف للكيلو.
      - تمنمية ألف للكرتونة.
    answer: 1
    words: [harga satuan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: شكرًا على العرض اللي حضرتك بعته.
      ar: شكرًا على العرض الذي أرسلتموه.
      en: Thank you for the offer you sent.
    answer: Terima kasih atas penawaran yang Bapak kirimkan.
    distractors: [pesanan, konfirmasi]
    words: [penawaran]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: في «Pesanan Anda sudah kami terima»، pesanan معناها إيه؟
      ar: ما معنى pesanan في «Pesanan Anda sudah kami terima»؟
      en: In "Pesanan Anda sudah kami terima", what does pesanan mean?
    options:
      - رسالتك.
      - عرضك.
      - طلبيتك.
    answer: 2
    words: [pesanan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لو سمحت أكّد سعر الوحدة.
      ar: يُرجى تأكيد سعر الوحدة.
      en: Please confirm the unit price.
    answers:
      - Mohon konfirmasi harga satuannya.
      - Mohon konfirmasi harga satuan.
      - Mohon konfirmasikan harga satuannya.
      - Tolong konfirmasi harga satuannya.
    words: [konfirmasi, harga satuan]
  - id: e08
    type: speaking
    text: Pesanan pertama kami lima ratus kilogram kurma.
    meaning:
      ar_eg: أول طلبية لينا خمسمية كيلو بلح.
      ar: طلبيتنا الأولى خمسمئة كيلوغرام من التمر.
      en: Our first order is five hundred kilograms of dates.
    words: [pesanan]
  - id: e09
    type: dictation
    text: Penawaran itu berlaku sampai akhir bulan.
    meaning:
      ar_eg: العرض ده ساري لحد آخر الشهر.
      ar: يسري ذلك العرض حتّى نهاية الشهر.
      en: That offer is valid until the end of the month.
    words: [penawaran]
  - id: e10
    type: translate
    direction: from_target
    source_text: Harga satuan untuk pesanan besar lebih murah.
    answers_meaning:
      ar_eg:
        - سعر الوحدة للطلبيات الكبيرة أرخص.
        - الطلبية الكبيرة سعر الوحدة فيها أقل.
      ar:
        - سعر الوحدة للطلبيات الكبيرة أرخص.
        - يقلّ سعر الوحدة في الطلبيات الكبيرة.
      en:
        - The unit price for large orders is lower.
        - Large orders get a cheaper unit price.
    words: [harga satuan, pesanan]
dialogue:
  title: Balasan ke Kairo
  lines:
    - speaker: Mohamed
      text: Uni, penawaran dari Kairo sudah datang. Bagaimana saya membalasnya?
      ar_eg: يا أوني، العرض من القاهرة وصل. أرد عليه إزاي؟
      ar: وصل العرض من القاهرة. كيف أردّ عليه؟
      en: Uni, the offer from Cairo has arrived. How do I reply?
    - speaker: Uni Rina
      text: Mulai dengan terima kasih, lalu sebutkan pesanan kita dan harga satuannya.
      ar_eg: ابدأ بالشكر، وبعدين اذكر طلبيتنا وسعر الوحدة.
      ar: ابدأ بالشكر، ثمّ اذكر طلبيتنا وسعر الوحدة.
      en: Start with thanks, then state our order and the unit price.
    - speaker: Mohamed
      text: '"Kami bersedia memesan lima ratus kilogram dengan harga satuan yang disepakati."'
      ar_eg: «إحنا مستعدين نطلب خمسمية كيلو بسعر الوحدة اللي اتفقنا عليه».
      ar: «نحن مستعدّون لطلب خمسمئة كيلوغرام بسعر الوحدة المتّفق عليه».
      en: '"We are prepared to order five hundred kilograms at the agreed unit price."'
    - speaker: Uni Rina
      text: Bagus. Terakhir, minta konfirmasi tanggal pengirimannya.
      ar_eg: حلو. وفي الآخر، اطلب تأكيد ميعاد الشحن.
      ar: جميل. وأخيرًا، اطلب تأكيد تاريخ الشحن.
      en: Good. Finally, ask them to confirm the delivery date.
