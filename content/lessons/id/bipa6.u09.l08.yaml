schema: kabar.lesson/v1
id: bipa6.u09.l08
language: id
title: Rendang dalam kemasan
can_do:
  ar_eg: 'تبيع رندانج متغلّف: التغليف والكتالوج والجملة والعروض والأسعار المعقولة.'
  ar: 'أن تبيع الرندانغ المعلّب: التغليف والكتالوج والجملة والعروض والأسعار المعقولة.'
  en: 'Sell packaged rendang: packaging, catalogue, wholesale, promotions and affordable prices.'
slides:
  - title: Dari dapur ke rak toko
    body:
      ar_eg: |
        رندانج أودا فضلي دلوقتي بيتباع في علب:
        kemasan = تغليف، عبوة (من kemas). katalog = كتالوج. grosir = جملة؛ تاجر جملة (harga grosir).
        promo = عرض، تخفيض (من promosi). laris = عليه طلب، بيتباع بسرعة. terjangkau = في المتناول، سعره معقول (من jangkau).
        kasir = كاشير. porsi = حصة، طبق (satu porsi).
      ar: |
        يباع رندانغ أودا فضلي الآن في علب:
        kemasan = تغليف، عبوة (من kemas). katalog = فهرس، كتالوج. grosir = جملة؛ تاجر جملة (harga grosir).
        promo = عرض ترويجي (من promosi). laris = رائج، يُباع بسرعة. terjangkau = في المتناول (من jangkau).
        kasir = أمين الصندوق. porsi = حصّة، طبق (satu porsi).
      en: |
        Uda Fadli's rendang now sells in packs:
        kemasan = packaging (from kemas). katalog = catalogue. grosir = wholesale; wholesaler (harga grosir).
        promo = promotion, special offer (from promosi). laris = selling well. terjangkau = affordable (from jangkau).
        kasir = cashier. porsi = portion, serving (satu porsi).
    examples:
      - text: Kemasan baru membuat rendang tahan enam bulan.
        ar_eg: التغليف الجديد بيخلي الرندانج يستحمل ست شهور.
        ar: يجعل التغليف الجديد الرندانغ يدوم ستة أشهر.
        en: The new packaging makes the rendang last six months.
      - text: Rendang ini laris karena harganya terjangkau.
        ar_eg: الرندانج ده عليه طلب عشان سعره معقول.
        ar: هذا الرندانغ رائج لأن سعره في المتناول.
        en: This rendang sells well because it's affordable.
      - text: Beli sepuluh dapat harga grosir.
        ar_eg: اشتري عشرة تاخدهم بسعر الجملة.
        ar: اشترِ عشرة تحصل على سعر الجملة.
        en: Buy ten and get the wholesale price.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kemasan
        ar_eg: تغليف
        ar: تغليف، عبوة
        en: packaging
      - text: katalog
        ar_eg: كتالوج
        ar: كتالوج
        en: catalogue
      - text: grosir
        ar_eg: جملة
        ar: جملة
        en: wholesale
      - text: promo
        ar_eg: عرض
        ar: عرض ترويجي
        en: special offer
    words: [kemasan, katalog, grosir, promo]
  - id: e02
    type: match_pairs
    pairs:
      - text: laris
        ar_eg: عليه طلب
        ar: رائج
        en: selling well
      - text: terjangkau
        ar_eg: سعره معقول
        ar: في المتناول
        en: affordable
      - text: kasir
        ar_eg: كاشير
        ar: أمين الصندوق
        en: cashier
      - text: porsi
        ar_eg: حصة، طبق
        ar: حصّة
        en: portion
    words: [laris, terjangkau, kasir, porsi]
  - id: e03
    type: listen
    text: Silakan bayar di kasir sebelah kanan.
    question:
      ar_eg: يدفع فين؟
      ar: أين يدفع؟
      en: Where does he pay?
    options: [الكاشير, المخزن, المطبخ]
    answer: 0
    meaning:
      ar_eg: اتفضل ادفع عند الكاشير اللي على اليمين.
      ar: تفضّل بالدفع عند أمين الصندوق على اليمين.
      en: Please pay at the cashier on the right.
    words: [kasir]
  - id: e04
    type: fill_blank
    sentence: 'Ada ___ akhir pekan: beli dua gratis satu!'
    meaning:
      ar_eg: 'فيه ___ آخر الأسبوع: اشتري اتنين وخد واحد ببلاش!'
      ar: 'هناك ___ نهاية الأسبوع: اشترِ اثنين واحصل على الثالث مجانًا!'
      en: 'There''s a weekend ___: buy two, get one free!'
    options: [promo, porsi, katalog]
    answers: [promo]
    words: [promo, porsi, katalog]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: المحل اللي بيبيع كميات كبيرة بسعر أرخص اسمه إيه؟
      ar: ماذا يُسمّى من يبيع بكميات كبيرة بسعر أرخص؟
      en: What's a shop that sells in bulk for less?
    options: [kasir, grosir, kemasan]
    answer: 1
    explain:
      ar_eg: grosir = جملة، تاجر جملة.
      ar: grosir = جملة، تاجر جملة.
      en: grosir = wholesale, wholesaler.
    words: [grosir, kasir, kemasan]
  - id: e06
    type: fill_blank
    sentence: Rumah makan itu selalu ramai; makanannya ___ sekali.
    meaning:
      ar_eg: المطعم ده دايمًا زحمة؛ أكله ___ أوي.
      ar: ذلك المطعم مزدحم دائمًا؛ طعامه ___ جدًا.
      en: That restaurant is always busy; its food ___ fast.
    options: [laris, terjangkau, grosir]
    answers: [laris]
    words: [laris, terjangkau, grosir]
  - id: e07
    type: multiple_choice
    question: Satu ___ rendang dengan nasi harganya tiga puluh ribu.
    options: [katalog, promo, porsi]
    answer: 2
    explain:
      ar_eg: طبق واحد = satu porsi.
      ar: حصّة واحدة = satu porsi.
      en: One serving = satu porsi.
    words: [porsi, katalog, promo]
  - id: e08
    type: build_sentence
    source:
      ar_eg: كل منتجاتنا موجودة في الكتالوج ده.
      ar: كل منتجاتنا في هذا الكتالوج.
      en: All our products are in this catalogue.
    answer: Semua produk kami ada di katalog ini.
    distractors: [kemasan, promo]
    words: [katalog]
  - id: e09
    type: translate
    direction: from_target
    source_text: Harga yang terjangkau dan kemasan yang menarik membuat produk laris.
    answers_meaning:
      ar_eg: [السعر المعقول والتغليف الحلو بيخلّوا المنتج عليه طلب, سعر في المتناول وعلبة حلوة يخلّوا المنتج يتباع]
      ar: [السعر المعقول والتغليف الجذّاب يجعلان المنتج رائجًا]
      en: [An affordable price and attractive packaging make a product sell well, Good prices and nice packaging make products sell]
    words: [terjangkau, kemasan, laris]
  - id: e10
    type: speaking
    text: Kemasan kecil cocok untuk satu porsi.
    meaning:
      ar_eg: العلبة الصغيرة مناسبة لطبق واحد.
      ar: العبوة الصغيرة تناسب حصّة واحدة.
      en: The small pack is right for one serving.
    words: [kemasan, porsi]
dialogue:
  lines:
    - speaker: Uda Fadli
      text: Lihat, rendang kami sekarang dalam kemasan. Bisa dikirim ke Mesir!
      ar_eg: بص، الرندانج بتاعنا بقى في علب. ينفع يتبعت مصر!
      ar: انظر، رندانغنا الآن معلّب. يمكن شحنه إلى مصر!
      en: Look, our rendang comes in packs now. It can be shipped to Egypt!
    - speaker: Mohamed
      text: Bagus! Berapa harganya?
      ar_eg: حلو! بكام؟
      ar: رائع! كم سعره؟
      en: Great! How much?
    - speaker: Uda Fadli
      text: Satu porsi lima puluh ribu. Untuk toko, ada harga grosir di katalog.
      ar_eg: الطبق بخمسين ألف. وللمحلات فيه سعر جملة في الكتالوج.
      ar: الحصّة بخمسين ألفًا. وللمتاجر سعر جملة في الكتالوج.
      en: Fifty thousand a serving. For shops, there's a wholesale price in the catalogue.
    - speaker: Mohamed
      text: Harganya terjangkau. Pasti laris di Kairo!
      ar_eg: السعر معقول. أكيد هيتباع في القاهرة!
      ar: السعر في المتناول. سيكون رائجًا في القاهرة حتمًا!
      en: Affordable. It'll sell like hot cakes in Cairo!
    - speaker: Uda Fadli
      text: Bulan Ramadan nanti kami buat promo khusus.
      ar_eg: في رمضان الجاي هنعمل عرض مخصوص.
      ar: في رمضان القادم سنقدّم عرضًا خاصًا.
      en: This coming Ramadan we'll run a special offer.
