  - id: e12
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي judul berita مكتوب صح عن الـ PON؟
      ar: أيّ judul berita مكتوب صحيحًا عن PON؟
      en: Which judul berita about PON is written correctly?
    options:
      - Papua jadi tuan rumah PON untuk pertama kalinya.
      - Papua sudah menjadi tuan rumah PON.
      - Papua Jadi Tuan Rumah PON
    answer: 2
    explain:
      ar_eg: مختصر، حرف كبير في أول كل كلمة، ومن غير نقطة.
      ar: موجز، وحرف كبير في أوّل كلّ كلمة، وبلا نقطة.
      en: Concise, a capital on every word, no full stop.
    words: [judul berita, huruf kapital, tuan rumah, PON]
dialogue:
  title: Siaran pertama Mohamed
  lines:
    - speaker: Kaka Yohana
      text: Siaranmu tadi bagus banget. Banyak pendengar kirim pesan.
      ar_eg: نشرتك من شوية كانت حلوة قوي. مستمعين كتير بعتوا رسايل.
      ar: كانت نشرتك قبل قليل رائعة، وأرسل كثير من المستمعين رسائل.
      en: Your broadcast just now was great. Lots of listeners sent messages.
    - speaker: Mohamed
      text: Makasih, Kaka. Aku hampir lupa bilang "ujarnya" habis kutipan.
      ar_eg: شكرًا يا كاكا. كنت هنسى أقول «ujarnya» بعد الاقتباس.
      ar: شكرًا يا كاكا. كدت أنسى «ujarnya» بعد الاقتباس.
      en: Thanks, Kaka. I nearly forgot to say "ujarnya" after the quote.
    - speaker: Kaka Yohana
      text: Besok kamu naik kapal cepat ke Waisai, kan? Dua jam aja.
      ar_eg: بكرة هتركب المركب السريع لوايساي، صح؟ ساعتين بس.
      ar: ستركب غدًا القارب السريع إلى وايساي، أليس كذلك؟ ساعتان فقط.
      en: Tomorrow you're taking the fast boat to Waisai, right? Only two hours.
    - speaker: Mohamed
      text: Iya. Aku mau lihat terumbu karang Raja Ampat.
      ar_eg: صح. عايز أشوف الشعاب المرجانية في راجا أمبات.
      ar: صحيح. أريد أن أرى الشعاب المرجانية في راجا أمبات.
      en: That's right. I want to see the coral reefs of Raja Ampat.
souvenir:
  id: bipa7.u01.souvenir
  title: Pelabuhan Sorong
  note:
    ar_eg: سورونج هي بوّابة راجا أمبات، ومن مينائها المراكب السريعة بتوصل وايساي في حوالي ساعتين. اسمها «مدينة البترول» (Kota Minyak) علشان الهولنديين بدأوا يدوّروا على البترول هناك في التلاتينات، ومن 2022 بقت عاصمة مقاطعة بابوا الجنوبية الغربية. وبمناسبة الوحدة دي، يوم 28 أكتوبر هو Hari Sumpah Pemuda، اليوم اللي شباب من مناطق كتير حلفوا فيه سنة 1928 على وطن واحد وأمّة واحدة ولغة وحدة واحدة.
    ar: سورونغ بوّابة راجا أمبات، ومن مينائها تبلغ القوارب السريعة وايساي في نحو ساعتين. تُلقَّب «مدينة النفط» (Kota Minyak) لأنّ الهولنديّين بدأوا التنقيب عن النفط فيها في ثلاثينيات القرن العشرين، وصارت منذ 2022 عاصمة مقاطعة بابوا الجنوبية الغربية. ويوم 28 أكتوبر هو Hari Sumpah Pemuda، ذكرى قسم شباب من مناطق شتّى عام 1928 على وطن واحد وأمّة واحدة ولغة وحدة.
    en: Sorong is the gateway to Raja Ampat; fast boats from its harbour reach Waisai in about two hours. It is nicknamed Kota Minyak (Oil City) because the Dutch began drilling for oil there in the 1930s, and since 2022 it has been the capital of Southwest Papua province. And 28 October is Hari Sumpah Pemuda, marking the day in 1928 when young people from many regions pledged one homeland, one nation and one language of unity.
