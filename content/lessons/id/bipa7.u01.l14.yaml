title: Ulangan Unit 1
can_do:
  ar_eg: تكتب خبر عن إنجاز وتقراه بصوت عالي زي المذيع.
  ar: أن تكتب خبرًا عن إنجاز وتلقيه كما يفعل المذيع.
  en: Write a news story about an achievement and read it out like a newsreader.
