      ar: ذلك الرياضي ___ لم يتوقّف عن التدريب قطّ.
      en: That athlete is ___ and never stops training.
    options: [tekun, bergengsi, rintisan]
    answers: [tekun]
    words: [tekun, bergengsi, rintisan]
  - id: e10
