  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: «الميدالية دي للوطن»، قالت.
      ar: «هذه الميدالية للوطن»، قالت.
      en: '"This medal is for the homeland," she said.'
    answers:
      - '"Medali ini untuk tanah air," ujarnya.'
      - '"Medali ini untuk tanah air," katanya.'
      - '"Medali ini untuk tanah air," tuturnya.'
      - '"Medali ini buat tanah air," ujarnya.'
      - '"Medali ini buat tanah air," katanya.'
      - '"Medali ini buat tanah air," tuturnya.'
