  - id: e03
    type: fill_blank
    sentence: Pada tahun 1928, para pemuda membacakan ___ di Batavia.
    meaning:
      ar_eg: سنة 1928، الشباب قروا اليمين في باتافيا.
      ar: في عام 1928 تلا الشباب القسم في باتافيا.
      en: In 1928, the young people read out the pledge in Batavia.
    options: [sumpah, siaran, liputan]
    answers: [sumpah]
    words: [sumpah, siaran, liputan]
  - id: e04
    type: listen
    text: Wirausaha muda itu menerima penghargaan karena inovasinya yang menginspirasi.
    question:
