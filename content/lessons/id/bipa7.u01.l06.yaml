schema: kabar.lesson/v1
id: bipa7.u01.l06
language: id
title: Noken
can_do:
  ar_eg: توصف شنطة النوكين البابوية وتشرح معناها لأهل بابوا.
  ar: أن تصف حقيبة النوكين البابوية وتشرح معناها لأهل بابوا.
  en: Describe the Papuan noken bag and explain what it means to Papuans.
slides:
  - title: Tas yang digantung di kepala
    body:
      ar_eg: |
        الـ noken شنطة تقليدية من بابوا، بيعلّقوها على الراس من قدّام وتنزل على الضهر.
        - noken = شنطة بابوا التقليدية
        - kulit kayu = لحاء الشجر: بيعملوا منه خيوط
        - merajut = يعقد / يشغّل الخيوط بالإيد (زي التريكو)
        - anyaman = حاجة مضفّرة / منسوجة بالإيد
        الستات بيشيلوا فيها أكل وخضار، وساعات طفل صغير. في ٤ ديسمبر ٢٠١٢ اليونسكو حطّت الـ noken في قايمة التراث اللي محتاج حماية عاجلة.
        - في الكلام: gini = begini، kayak = seperti، banget = sekali، buat = untuk، soal = tentang، nulis = menulis.
      ar: |
        الـ noken حقيبة تقليدية من بابوا تُعلَّق على الرأس من الأمام وتتدلّى على الظهر.
        - noken = حقيبة بابوا التقليدية
        - kulit kayu = لحاء الشجر، تُصنع منه الخيوط
        - merajut = يعقد الخيوط ويحيكها باليد (كالكروشيه)
        - anyaman = مشغول مضفور أو منسوج يدويًّا
        وتحمل فيها النساء الطعام والخضار، وأحيانًا طفلًا صغيرًا. وفي ٤ ديسمبر ٢٠١٢ أدرجت اليونسكو الـ noken في قائمة التراث الذي يحتاج إلى صون عاجل.
        - في الكلام اليومي: gini = begini، kayak = seperti، banget = sekali، buat = untuk، soal = tentang، nulis = menulis.
      en: |
        The noken is a traditional Papuan bag, hung from the forehead and down the back.
        - noken = traditional Papuan bag
        - kulit kayu = tree bark, made into thread
        - merajut = to knot or knit thread by hand
        - anyaman = something plaited or woven by hand
        Women carry food, vegetables and sometimes a small child in it. On 4 December 2012 UNESCO listed the noken as heritage in need of urgent safeguarding.
        - In speech: gini = begini, kayak = seperti, banget = sekali, buat = untuk, soal = tentang, nulis = menulis.
    examples:
      - text: Mama di Wamena merajut noken dari serat kulit kayu.
        ar_eg: الست في وامينا بتشغّل نوكين من خيوط لحاء الشجر.
        ar: تحيك الأمّ في وامينا نوكين من ألياف لحاء الشجر.
        en: A mother in Wamena knits a noken from tree-bark fibre.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: noken
        ar_eg: شنطة بابوا
        ar: حقيبة بابوا
        en: Papuan bag
      - text: kulit kayu
        ar_eg: لحاء الشجر
        ar: لحاء الشجر
        en: tree bark
      - text: merajut
        ar_eg: يشغّل الخيط بالإيد
        ar: يحيك
        en: to knit, knot
      - text: anyaman
        ar_eg: شغل مضفّر
        ar: مشغول مضفور
        en: woven work
      - text: medali
        ar_eg: ميدالية
        ar: ميدالية
        en: medal
    words: [noken, kulit kayu, merajut, anyaman, medali]
  - id: e02
    type: listen
    text: Noken digantung di kepala, lalu jatuh ke punggung.
    question:
      ar_eg: النوكين بيتشال إزاي؟
      ar: كيف تُحمل النوكين؟
      en: How is a noken carried?
    options:
      - في الإيد.
      - متعلّقة على الراس ونازلة على الضهر.
      - على الكتف الشمال.
    answer: 1
    words: [noken]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الخيوط بتاعة النوكين بتتعمل من إيه عادةً؟
      ar: ممّ تُصنع خيوط النوكين عادةً؟
      en: What is noken thread usually made from?
    options:
      - بلاستيك.
      - حرير صيني.
      - لحاء الشجر.
    answer: 2
    words: [kulit kayu]
    explain:
      ar_eg: خيط النوكين بيتعمل من لحاء الشجر (kulit kayu). البلاستيك والحرير مش مذكورين.
      ar: يُصنع خيط النوكين من لحاء الشجر (kulit kayu)، ولم يُذكر البلاستيك ولا الحرير.
      en: Noken thread comes from tree bark (kulit kayu), not plastic or silk.
  - id: e04
    type: fill_blank
    sentence: Nenek ___ noken sambil bercerita kepada cucunya.
    meaning:
      ar_eg: الجدة بتشغّل نوكين وهي بتحكي لحفيدها.
      ar: تحيك الجدّة نوكين وهي تحكي لحفيدها.
      en: Grandma knits a noken while telling her grandchild stories.
    options: [merajut, meliput, meresmikan]
    answers: [merajut]
    words: [merajut]
    explain:
      ar_eg: merajut = يشغل تريكو/يحيك، وده اللي الجدة بتعمله في النوكين. meliput = يغطي صحفيًا، وmeresmikan = يفتتح.
      ar: merajut = يحيك، وهو ما تفعله الجدة بالنوكين. أما meliput فالتغطية الصحفية وmeresmikan الافتتاح.
      en: merajut (to knit) is what Grandma does. meliput is to report, meresmikan to inaugurate.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اليونسكو حطّت النوكين في القايمة سنة كام؟
      ar: في أيّ سنة أدرجت اليونسكو النوكين؟
      en: In which year did UNESCO list the noken?
    options: ['2012', '1999', '2021']
    answer: 0
    words: [noken]
    explain:
      ar_eg: اليونسكو سجّلت النوكين سنة 2012. السنين التانية مش في النص.
      ar: سجّلت اليونسكو النوكين عام 2012، والسنتان الأخريان لم تردا في النص.
      en: UNESCO listed the noken in 2012; the other years aren't in the text.
  - id: e06
    type: build_sentence
    source:
      ar_eg: الشغل المضفّر ده اتعمل بالإيد.
      ar: صُنع هذا المشغول المضفور باليد.
      en: This woven piece was made by hand.
    answer: Anyaman ini dibuat dengan tangan.
    distractors: [noken, kulit]
    words: [anyaman]
    explain:
      ar_eg: anyaman = حاجة منسوجة، وdibuat dengan tangan = معمولة باليد. noken وkulit مش داخلين في الجملة دي.
      ar: anyaman = منسوجة، وdibuat dengan tangan = مصنوعة يدويًا، ولا مكان لـ noken ولا kulit.
      en: anyaman (woven piece) dibuat dengan tangan (made by hand). noken and kulit don't fit.
  - id: e07
    type: translate
    direction: from_target
    source_text: Bagi orang Papua, noken adalah simbol kehidupan dan kesuburan.
    answers_meaning:
      ar_eg:
        - بالنسبة لأهل بابوا، النوكين رمز للحياة والخصوبة.
        - النوكين عند البابويين بيرمز للحياة والخير.
      ar:
        - النوكين عند أهل بابوا رمز للحياة والخصب.
        - يرى البابويون في النوكين رمزًا للحياة والخصوبة.
      en:
        - For Papuans, the noken is a symbol of life and fertility.
        - To Papuans, the noken stands for life and fruitfulness.
    words: [noken]
  - id: e08
    type: speaking
    text: Noken ini dirajut dari serat kulit kayu selama dua minggu.
    meaning:
      ar_eg: النوكين ده اتشغل من خيوط لحاء الشجر في أسبوعين.
      ar: حيكت هذه النوكين من ألياف لحاء الشجر خلال أسبوعين.
      en: This noken was knitted from bark fibre over two weeks.
    words: [noken, merajut, kulit kayu]
  - id: e09
    type: dictation
    text: Mama itu menjual anyaman dan noken di pasar Wamena.
    meaning:
      ar_eg: الست دي بتبيع شغل مضفّر ونوكين في سوق وامينا.
      ar: تبيع تلك الأمّ مشغولات مضفورة ونوكين في سوق وامينا.
      en: That mother sells woven goods and noken at Wamena market.
    words: [anyaman, noken]
  - id: e10
    type: fill_blank
    sentence: Benang noken dibuat dari ___ yang dijemur di bawah matahari.
    meaning:
      ar_eg: خيط النوكين بيتعمل من لحاء الشجر اللي بيتنشف في الشمس.
      ar: يُصنع خيط النوكين من لحاء الشجر المجفّف في الشمس.
      en: Noken thread is made from tree bark dried in the sun.
    options: [kulit kayu, anyaman, merajut]
    answers: [kulit kayu]
    words: [kulit kayu]
    explain:
      ar_eg: kulit kayu = لحاء الشجر، وده اللي بينشفوه في الشمس. anyaman = حاجة منسوجة، وmerajut فعل.
      ar: kulit kayu = لحاء الشجر الذي يُجفَّف في الشمس. أما anyaman فمنسوجة وmerajut فعل.
      en: kulit kayu (bark) is what's dried in the sun. anyaman is a woven piece, merajut a verb.
dialogue:
  title: Hadiah dari Wamena
  lines:
    - speaker: Kaka Yohana
      text: Mohamed, ini noken buat kamu. Mamaku merajutnya sendiri.
      ar_eg: يا محمد، دي نوكين علشانك. ماما شغلتها بنفسها.
      ar: يا محمد، هذه نوكين لك، حاكتها أمّي بنفسها.
      en: Mohamed, this noken is for you. My mother knitted it herself.
    - speaker: Mohamed
      text: Bagus banget! Ini dari benang apa, Kaka?
      ar_eg: حلوة أوي! معمولة من خيط إيه يا كاكا؟
      ar: رائعة! من أيّ خيط صُنعت يا كاكا؟
      en: It's beautiful! What thread is it made from, Kaka?
    - speaker: Kaka Yohana
      text: Dari kulit kayu. Anyaman kayak gini butuh waktu berminggu-minggu.
      ar_eg: من لحاء الشجر. الشغل المضفّر ده بياخد أسابيع.
      ar: من لحاء الشجر، ويستغرق مثل هذا المشغول أسابيع.
      en: Tree bark. A piece like this takes weeks.
    - speaker: Mohamed
      text: Aku mau nulis berita soal noken buat radio kita.
      ar_eg: هكتب خبر عن النوكين للراديو بتاعنا.
      ar: سأكتب خبرًا عن النوكين لإذاعتنا.
      en: I'll write a story about the noken for our radio.
