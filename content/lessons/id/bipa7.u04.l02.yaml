schema: kabar.lesson/v1
id: bipa7.u04.l02
language: id
title: Laporan informatif
can_do:
  ar_eg: تقرا تقرير معلوماتي عن لهجة وتطلّع منه الحقايق الأساسية.
  ar: أن تقرأ تقريرًا إعلاميًّا عن لهجة وتستخرج حقائقه الأساسية.
  en: Read an informative report on a dialect and pull out the key facts.
slides:
  - title: Melayu Papua
    body:
      ar_eg: |
        تقرير (مكتوب للدرس):
        Melayu Papua adalah dialek bahasa Melayu yang digunakan di wilayah Papua. Dialek ini sudah lama menjadi bahasa pergaulan antarsuku. Ciri khasnya antara lain kata ganti sa, ko, dan kitong, serta bentuk pendek seperti su (sudah) dan pi (pergi). Ragam pesisir dan ragam pegunungan memiliki variasi kosakata dan logat. Meskipun begitu, penuturnya dapat saling memahami.
        - dialek = لهجة، wilayah = منطقة / إقليم، ciri khas = سمة مميزة
        - ragam = نوع / شكل من أشكال اللغة، variasi = اختلافات / تنوّع
        - في الكلام: soal = tentang، nulis = menulis.
      ar: |
        تقرير (مكتوب للدرس):
        Melayu Papua adalah dialek bahasa Melayu yang digunakan di wilayah Papua. Dialek ini sudah lama menjadi bahasa pergaulan antarsuku. Ciri khasnya antara lain kata ganti sa, ko, dan kitong, serta bentuk pendek seperti su (sudah) dan pi (pergi). Ragam pesisir dan ragam pegunungan memiliki variasi kosakata dan logat. Meskipun begitu, penuturnya dapat saling memahami.
        - dialek = لهجة، wilayah = إقليم، ciri khas = سمة مميّزة
        - ragam = ضرب من ضروب اللغة، variasi = تنوّع
        - في الكلام اليومي: soal = tentang، nulis = menulis.
      en: |
        A report (written for the lesson):
        Melayu Papua adalah dialek bahasa Melayu yang digunakan di wilayah Papua. Dialek ini sudah lama menjadi bahasa pergaulan antarsuku. Ciri khasnya antara lain kata ganti sa, ko, dan kitong, serta bentuk pendek seperti su (sudah) dan pi (pergi). Ragam pesisir dan ragam pegunungan memiliki variasi kosakata dan logat. Meskipun begitu, penuturnya dapat saling memahami.
        - dialek = dialect, wilayah = region, ciri khas = distinctive feature
        - ragam = variety (of a language), variasi = variation
        - In speech: soal = tentang, nulis = menulis.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dialek
        ar_eg: لهجة
        ar: لهجة
        en: dialect
      - text: ragam
        ar_eg: نوع من اللغة
        ar: ضرب من اللغة
        en: variety, register
      - text: ciri khas
        ar_eg: سمة مميزة
        ar: سمة مميّزة
        en: distinctive feature
      - text: wilayah
        ar_eg: منطقة / إقليم
        ar: إقليم
        en: region, territory
      - text: variasi
        ar_eg: اختلافات / تنوّع
        ar: تنوّع
        en: variation
    words: [dialek, ragam, ciri khas, wilayah, variasi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: على حسب التقرير، إيه من السمات المميزة لملايو بابوا؟
      ar: ما إحدى السمات المميّزة لملايو بابوا بحسب التقرير؟
      en: According to the report, what is one distinctive feature of Papuan Malay?
    options:
      - Kata ganti gue dan lu.
      - Kata ganti sa, ko, dan kitong.
      - Bahasa ini tidak pernah ditulis.
    answer: 1
    words: [ciri khas]
    explain:
      ar_eg: من ciri khas (السمة المميّزة) للملايو البابوي الضماير sa وko وkitong. gue وlu بتوع جاكرتا.
      ar: من السمات المميّزة للملايويّة البابويّة الضمائر sa وko وkitong، أمّا gue وlu فمن جاكرتا.
      en: A hallmark of Papuan Malay is sa, ko, kitong; gue and lu are Jakarta.
  - id: e03
    type: fill_blank
    sentence: Melayu Papua adalah ___ bahasa Melayu.
    meaning:
      ar_eg: ملايو بابوا لهجة من لهجات الملايو.
      ar: ملايو بابوا لهجة من لهجات الملايوية.
      en: Papuan Malay is a dialect of Malay.
    options: [dialek, wilayah, variasi]
    answers: [dialek]
    words: [dialek]
    explain:
      ar_eg: dialek = لهجة، وملايو بابوا لهجة من الملايو. wilayah = منطقة، وvariasi = تنويعة بس مش المصطلح المطلوب هنا.
      ar: dialek = لهجة. أما wilayah فمنطقة، وvariasi تنويعة عامة.
      en: Papuan Malay is a dialek (dialect) of Malay. wilayah is a region.
  - id: e04
    type: listen
    text: Bahasa Melayu Papua punya beberapa ragam. Ragam pesisir dan ragam pegunungan memiliki variasi kosakata. Misalnya, kata untuk ubi berbeda di Sorong dan di Wamena, tetapi penuturnya tetap saling mengerti.
    question:
      ar_eg: إيه الفرق بين شكل الساحل وشكل الجبل؟
      ar: ما الفرق بين ضرب الساحل وضرب الجبال؟
      en: How do the coastal and highland varieties differ?
    options:
      - Ragam itu berbeda dalam semua hal, sehingga penuturnya tidak saling mengerti.
      - Ragam itu berbeda dalam beberapa kata, tetapi penuturnya tetap saling mengerti.
      - Tidak ada perbedaan sama sekali di antara ragam itu.
    answer: 1
    words: [ragam, variasi]
    explain:
      ar_eg: variasi kosakata = اختلاف في بعض الكلمات (زي كلمة البطاطا)، بس tetap saling mengerti = لسه بيفهموا بعض. مش اختلاف في كل حاجة، ومش مفيش فرق خالص.
      ar: يختلف المعجم في بعض الكلمات كاسم البطاطا، لكنّ المتكلّمين يتفاهمون، فلا هو اختلاف تامّ ولا تطابق.
      en: Some words differ (like the word for tuber), but speakers still understand each other.
  - id: e05
    type: build_sentence
    source:
      ar_eg: اللهجة دي مستعملة في المنطقة كلها.
      ar: تُستعمل هذه اللهجة في الإقليم كلّه.
      en: This dialect is used across the whole region.
    answer: Dialek ini digunakan di seluruh wilayah.
    distractors: [ragam, variasi]
    words: [dialek, wilayah]
    explain:
      ar_eg: digunakan di seluruh wilayah = بتتستعمل في المنطقة كلها. ragam وvariasi مش جزء من الجملة.
      ar: digunakan di seluruh wilayah = يُستعمل في المنطقة كلها.
      en: digunakan di seluruh wilayah = used across the whole region.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: الناس اللي بتتكلم الأشكال المختلفة بيفهموا بعض؟
      ar: هل يفهم متكلّمو الضروب المختلفة بعضهم بعضًا؟
      en: Do speakers of the different varieties understand each other?
    options:
      - Tidak, mereka memerlukan penerjemah.
      - Hanya lewat tulisan.
      - Ya, mereka saling mengerti.
    answer: 2
    words: [ragam]
    explain:
      ar_eg: 'أيوه، بيفهموا بعض (saling mengerti): الفرق في كلمات قليلة. مش محتاجين مترجم.'
      ar: نعم يتفاهمون، فالفرق في كلمات قليلة ولا حاجة إلى مترجم.
      en: Yes, they understand each other; only a few words differ.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كل منطقة ليها سمة مميزة في الكلام.
      ar: لكلّ منطقة سمة مميّزة في الكلام.
      en: Every region has a distinctive way of speaking.
    answers:
      - Setiap wilayah punya ciri khas dalam berbicara.
      - Setiap wilayah memiliki ciri khas dalam berbicara.
      - Tiap wilayah punya ciri khas dalam berbicara.
      - Setiap wilayah mempunyai ciri khas dalam berbicara.
    words: [wilayah, ciri khas]
  - id: e08
    type: speaking
    text: Variasi dialek membuat bahasa Indonesia makin kaya.
    meaning:
      ar_eg: تنوّع اللهجات بيخلّي الإندونيسي أغنى.
      ar: يزيد تنوّعُ اللهجات الإندونيسيةَ ثراءً.
      en: Dialect variation makes Indonesian ever richer.
    words: [variasi, dialek]
  - id: e09
    type: dictation
    text: Ciri khas ragam ini adalah bentuk kata yang pendek.
    meaning:
      ar_eg: السمة المميزة للشكل ده إن الكلمات قصيرة.
      ar: السمة المميّزة لهذا الضرب قِصر الكلمات.
      en: The distinctive feature of this variety is its short word forms.
    words: [ciri khas, ragam]
  - id: e10
    type: translate
    direction: from_target
    source_text: Laporan ini memetakan variasi bahasa di wilayah timur Indonesia, supaya pembaca tahu di mana setiap ragam dipakai.
    answers_meaning:
      ar_eg:
        - التقرير ده بيرسم خريطة لتنوّع اللغة في شرق إندونيسيا، عشان القارئ يعرف كل لهجة بتتقال فين.
        - التقرير بيعمل خريطة للاختلافات اللغوية في المنطقة الشرقية، علشان القارئ يعرف كل نوع مستعمل فين.
      ar:
        - يرسم هذا التقرير خريطة للتنوّع اللغويّ في شرق إندونيسيا، كي يعرف القارئ أين تُستعمل كلّ لهجة.
        - يرصد التقرير التنوّع اللغويّ في المنطقة الشرقيّة، ليعرف القارئ موضع استعمال كلّ ضرب منه.
      en:
        - This report maps language variation in eastern Indonesia, so readers know where each variety is used.
        - The report charts language variety across eastern Indonesia so the reader knows where each one is spoken.
    words: [variasi, wilayah]
    explain:
      ar_eg: supaya = عشان (الهدف). memetakan = يرسم خريطة، وragam = نوع / لهجة.
      ar: supaya = كي (الغاية)، وmemetakan = يرسم خريطة، وragam = ضرب لغويّ.
      en: supaya = so that; memetakan = to map; ragam = variety.
dialogue:
  title: Laporan untuk radio
  lines:
    - speaker: Mohamed
      text: Om, Kaka Yohana minta saya nulis laporan soal dialek di sini.
      ar_eg: يا عمّ، كاكا يوهانا طلبت مني أكتب تقرير عن اللهجة هنا.
      ar: يا عمّ، طلبت منّي كاكا يوهانا تقريرًا عن اللهجة هنا.
      en: Om, Kaka Yohana asked me to write a report on the dialect here.
    - speaker: Om Nus
      text: Bagus. Tulis bahwa ragam di pantai dan di gunung berbeda sedikit.
      ar_eg: حلو. اكتب إن الشكل اللي على الشط واللي في الجبل مختلفين شوية.
      ar: جميل. اكتب أنّ ضرب الساحل وضرب الجبل يختلفان قليلًا.
      en: Good. Write that the varieties on the coast and in the mountains differ a little.
    - speaker: Mohamed
      text: Apa ciri khas yang paling penting?
      ar_eg: إيه أهم سمة مميزة؟
      ar: ما أهمّ سمة مميّزة؟
      en: What's the most important distinctive feature?
    - speaker: Om Nus
      text: Kata ganti, sa, ko, kitong. Itu yang orang dengar pertama kali.
      ar_eg: الضماير، sa وko وkitong. دي أول حاجة الناس بتسمعها.
      ar: الضمائر sa وko وkitong، فهي أوّل ما يسمعه الناس.
      en: The pronouns, sa, ko, kitong. That's the first thing people hear.
