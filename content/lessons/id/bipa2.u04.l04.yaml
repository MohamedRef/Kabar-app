schema: kabar.lesson/v1
id: bipa2.u04.l04
language: id
title: Jangan lupa!
can_do:
  ar_eg: تقول لحد ما يعملش حاجة بلطف.
  ar: أن تطلب من أحدهم بلطف ألا يفعل شيئًا.
  en: Tell someone not to do something, kindly.
slides:
  - title: Jangan …!
    body:
      ar_eg: |
        jangan = «ماتـ…ش» (لا الناهية)، والفعل بعدها مابيتغيرش:
        Jangan merokok! = ماتدخنش! — Jangan lupa! = ماتنساش!
        Jangan khawatir = ماتقلقش (khawatir جاية من العربي «خواطر»، جمع «خاطر»).
        ومع الصفات: Jangan marah, ya = ماتزعلش بقى.
      ar: |
        jangan = «لا» الناهية، والفعل بعدها لا يتغير:
        Jangan merokok! = لا تدخّن! — Jangan lupa! = لا تنسَ!
        Jangan khawatir = لا تقلق (وkhawatir من العربية «خواطر»، جمع «خاطر»).
        ومع الصفة: Jangan marah = لا تغضب.
      en: |
        jangan = "don't", and the verb doesn't change:
        Jangan merokok! = Don't smoke! — Jangan lupa! = Don't forget!
        Jangan khawatir = Don't worry (khawatir comes from Arabic «خواطر», plural of «خاطر»).
        With adjectives too: Jangan marah, ya = Don't be angry, OK?
    grammar: id.prohibition.jangan
    examples:
      - text: Jangan lupa bawa payung.
        ar_eg: ماتنساش تاخد شمسية.
        ar: لا تنسَ أن تأخذ مظلة.
        en: Don't forget to bring an umbrella.
      - text: Jangan khawatir, saya bisa sendiri.
        ar_eg: ماتقلقش، أقدر لوحدي.
        ar: لا تقلق، أستطيع وحدي.
        en: Don't worry, I can do it myself.
  - title: Jangan ≠ tidak
    body:
      ar_eg: |
        tidak = نفي (مش بيدخن)، jangan = نهي (ماتدخنش).
        Dia tidak merokok = هو مش بيدخن. — Jangan merokok! = ماتدخنش!
        وعشان تبقى ألطف حط ya أو dulu: Jangan pergi dulu = ماتمشيش لسه.
        في السوق: Jangan mahal-mahal, Bu! = ماتغليهاش علينا يا حاجة!
      ar: |
        tidak للنفي، وjangan للنهي:
        Dia tidak merokok = هو لا يدخّن. — Jangan merokok! = لا تدخّن!
        وللتلطيف أضف ya أو dulu: Jangan pergi dulu = لا تذهب الآن.
        وفي السوق: Jangan mahal-mahal, Bu! = لا تبالغي في السعر يا سيدتي!
      en: |
        tidak states "doesn't"; jangan commands "don't".
        Dia tidak merokok = He doesn't smoke. — Jangan merokok! = Don't smoke!
        Soften with ya or dulu: Jangan pergi dulu = Don't go yet.
        At the market: Jangan mahal-mahal, Bu! = Don't make it so expensive!
    grammar: id.prohibition.jangan
    examples:
      - text: Jangan mahal-mahal, Bu!
        ar_eg: ماتغليهاش علينا يا حاجة!
        ar: لا تبالغي في السعر يا سيدتي!
        en: Don't make it so expensive, ma'am!
      - text: Jangan pergi dulu!
        ar_eg: ماتمشيش لسه!
        ar: لا تذهب الآن!
        en: Don't go yet!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Ayo makan!
        ar_eg: يلا ناكل!
        ar: هيّا نأكل!
        en: Let's eat!
      - text: Jangan lupa!
        ar_eg: ماتنساش!
        ar: لا تنسَ!
        en: Don't forget!
      - text: Jangan khawatir.
        ar_eg: ماتقلقش.
        ar: لا تقلق.
        en: Don't worry.
      - text: Mari kita mulai.
        ar_eg: هيا نبدأ.
        ar: لنبدأ.
        en: Let's begin.
      - text: Nanti dulu.
        ar_eg: بعدين.
        ar: لاحقًا.
        en: Later.
    words: [ayo, jangan, lupa, khawatir, mari]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك هيمسك طبق سخن. تحذره إزاي؟
      ar: صديقك سيلمس طبقًا ساخنًا. كيف تحذّره؟
      en: Your friend is about to touch a hot plate. How do you warn him?
    options: ['Jangan pegang itu, panas!', 'Ayo pegang itu, panas!', 'Tidak pegang itu, panas!']
    answer: 0
    explain:
      ar_eg: النهي بـ jangan. tidak للنفي بس.
      ar: النهي بـ jangan، وtidak للنفي فقط.
      en: Commands use jangan; tidak only negates statements.
    words: [jangan, pegang]
  - id: e03
    type: listen
    text: Jangan lupa bawa payung.
    options: [Ayo bawa payung., Jangan lupa bawa payung., Jangan lupa bawa uang.]
    answer: 1
    words: [jangan, lupa, payung]
  - id: e04
    type: fill_blank
    sentence: ___ khawatir, saya bisa sendiri.
    meaning:
      ar_eg: ماتقلقش، أقدر لوحدي.
      ar: لا تقلق، أستطيع وحدي.
      en: Don't worry, I can do it myself.
    options: [Tidak, Jangan, Ayo]
    answers: [Jangan]
    words: [jangan, khawatir]
  - id: e05
    type: build_sentence
    source:
      ar_eg: ماتنساش تاخد شمسية.
      ar: لا تنسَ أن تأخذ مظلة.
      en: Don't forget to bring an umbrella.
    answer: Jangan lupa bawa payung.
    distractors: [tidak, ayo]
    words: [jangan, lupa, payung]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ماتدخنش هنا!
      ar: لا تدخّن هنا!
      en: Don't smoke here!
    answers: [Jangan merokok di sini!, Jangan merokok di sini, Jangan merokok di sini., 'Jangan merokok di sini, ya!']
    words: [jangan, merokok]
  - id: e07
    type: dictation
    text: Jangan pergi dulu!
    meaning:
      ar_eg: ماتمشيش لسه!
      ar: لا تذهب الآن!
      en: Don't go yet!
    words: [jangan]
  - id: e08
    type: speaking
    text: Ayo kita ke Sukawati! Jangan lupa bawa uang, ya.
    meaning:
      ar_eg: يلا نروح سوكاواتي! ماتنساش تاخد فلوس.
      ar: هيّا نذهب إلى سوكاواتي! لا تنسَ أن تأخذ نقودًا.
      en: Let's go to Sukawati! Don't forget to bring money.
    words: [ayo, jangan, lupa]
dialogue:
  title: Ajakan Ni Luh
  lines:
    - speaker: Ni Luh
      text: Mohamed, ayo kita ke Pasar Seni Sukawati!
      ar_eg: يا محمد، يلا نروح سوق الفن في سوكاواتي!
      ar: يا محمد، هيّا نذهب إلى سوق الفن في سوكاواتي!
      en: Mohamed, let's go to Sukawati Art Market!
    - speaker: Mohamed
      text: Ayo! Saya mau beli kain dan patung.
      ar_eg: يلا! عايز أشتري قماش وتماثيل.
      ar: هيّا! أريد أن أشتري قماشًا وتماثيل.
      en: Let's! I want to buy cloth and carvings.
    - speaker: Ni Luh
      text: Jangan lupa menawar, ya. Jangan langsung bayar!
      ar_eg: ماتنساش تفاصل، ماشي؟ ماتدفعش علطول!
      ar: لا تنسَ أن تساوم، اتفقنا؟ لا تدفع مباشرة!
      en: Don't forget to bargain, OK? Don't just pay straight away!
    - speaker: Mohamed
      text: Jangan khawatir. Orang Mesir pintar menawar!
      ar_eg: ماتقلقيش. المصريين شاطرين في الفصال!
      ar: لا تقلقي. المصريون بارعون في المساومة!
      en: Don't worry. Egyptians are great at bargaining!
    - speaker: Ni Luh
      text: Ha-ha, bagus! Yuk, berangkat sekarang.
      ar_eg: ههه، حلو! يلا نمشي دلوقتي.
      ar: ها ها، جيد! هيا ننطلق الآن.
      en: Ha-ha, great! Come on, let's head off now.
