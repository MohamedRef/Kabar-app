schema: kabar.lesson/v1
id: bipa2.u04.l04
language: id
title: Pasar! (tawar-menawar)
can_do:
  ar_eg: تفاصل في السوق من غير ما تعدّي الميزانية بتاعتك (لعبة Pasar!).
  ar: أن تساوم في السوق ضمن ميزانيتك (لعبة Pasar!).
  en: Haggle within a budget (Pasar! mini-game).
slides:
  - title: Boleh kurang?
    body:
      ar_eg: |
        جمل الفصال:
        - Boleh kurang? = ممكن تنزل شوية؟
        - Jangan mahal-mahal, Bu! = ماتغليهاش علينا!
        - Harga pas = آخر سعر (مفيش فصال تاني).
        - Ya sudah, boleh. = خلاص ماشي.
        البياع ممكن يقول Saya rugi! = كده هخسر! — ده جزء من اللعبة، ابتسم وكمّل.
      ar: |
        عبارات المساومة:
        - Boleh kurang؟ = هل يمكن تخفيض السعر؟
        - Jangan mahal-mahal, Bu! = لا تبالغي في السعر!
        - Harga pas = السعر النهائي.
        - Ya sudah, boleh. = حسنًا، موافق.
        وقد يقول البائع Saya rugi! = سأخسر! وهذا جزء من اللعبة، فابتسم وتابع.
      en: |
        Haggling phrases:
        - Boleh kurang? = Can you go lower?
        - Jangan mahal-mahal, Bu! = Don't make it so expensive!
        - Harga pas = fixed, final price.
        - Ya sudah, boleh. = OK then, fine.
        The seller may say Saya rugi! = I'll lose money! — it's part of the game; smile and carry on.
    grammar: id.prohibition.jangan
    examples:
      - text: Jangan mahal-mahal, Bu! Boleh kurang?
        ar_eg: ماتغليهاش علينا يا حاجة! ممكن تنزلي شوية؟
        ar: لا تبالغي في السعر يا سيدتي! هل يمكن التخفيض؟
        en: Don't make it so expensive, ma'am! Can you go lower?
  - title: Dua lembar, harga pas
    body:
      ar_eg: |
        الخطة: ابدأ بنص السعر، واتقابلوا في النص. وقول العدد صح: dua lembar kain، tiga buah patung.
        ولو هتشتري أكتر من حاجة، اطلب سعر أحسن: Saya beli dua lembar, boleh kurang?
      ar: |
        الخطة: ابدأ بنصف السعر والتقيا في المنتصف، واستعمل لفظ العدّ الصحيح: dua lembar kain، tiga buah patung.
        وإن اشتريت أكثر من قطعة فاطلب سعرًا أفضل: Saya beli dua lembar, boleh kurang؟
      en: |
        The plan: start at half the price and meet in the middle. Count properly: dua lembar kain, tiga buah patung.
        Buying more than one? Ask for a better price: Saya beli dua lembar, boleh kurang?
    grammar: id.classifier.basic
    examples:
      - text: Saya beli dua lembar, boleh kurang?
        ar_eg: هاخد اتنين، ممكن تنزل شوية؟
        ar: سأشتري قطعتين، هل يمكن التخفيض؟
        en: I'll take two, can you go lower?
exercises:
  - id: e01
    type: listen
    text: Boleh kurang, Bu?
    options: ["Boleh kurang, Bu?", "Boleh lihat, Bu?", "Boleh pulang, Bu?"]
    answer: 0
    words: [boleh kurang]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: البياعة قالت «Dua ratus ribu». ميزانيتك ١٢٠ ألف. تبدأ الفصال بإيه؟
      ar: قالت البائعة «Dua ratus ribu»، وميزانيتك ١٢٠ ألفًا. بمَ تبدأ المساومة؟
      en: The seller says "Dua ratus ribu". Your budget is 120,000. How do you open?
    options: ["Seratus ribu, boleh?", "Dua ratus ribu, oke!", "Tiga ratus ribu, ya?"]
    answer: 0
    explain:
      ar_eg: ابدأ بنص السعر عشان يبقى فيه مسافة تتقابلوا فيها تحت ميزانيتك.
      ar: ابدأ بنصف السعر ليبقى مجال للالتقاء دون تجاوز ميزانيتك.
      en: Start at half so you can meet in the middle without passing your budget.
    words: [boleh]
