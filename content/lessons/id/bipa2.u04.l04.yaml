      en: Oh, too expensive. Don't make it so pricey, ma'am! Can you go lower?
    words: [terlalu, jangan, boleh kurang]
dialogue:
  title: Tawar-menawar di Pasar Seni Sukawati
  lines:
    - speaker: Bu Nyoman
      text: Mari, Pak, silakan lihat-lihat! Kainnya bagus-bagus.
      ar_eg: اتفضل يا أستاذ، اتفرّج! القماش كله حلو.
      ar: تفضل يا سيدي، تفرّج! الأقمشة كلها جميلة.
      en: Come in, sir, have a look! The cloths are all lovely.
    - speaker: Mohamed
      text: Berapa harga kain ini, Bu?
      ar_eg: القماشة دي بكام يا مدام؟
      ar: كم ثمن هذا القماش يا سيدتي؟
      en: How much is this cloth, ma'am?
    - speaker: Bu Nyoman
      text: Dua ratus ribu, Pak.
      ar_eg: بميتين ألف يا أستاذ.
      ar: بمئتي ألف يا سيدي.
      en: Two hundred thousand, sir.
    - speaker: Mohamed
      text: Wah, terlalu mahal. Seratus ribu, boleh?
      ar_eg: يا خبر، غالي زيادة. بمية ألف، ينفع؟
      ar: آه، إنه غالٍ جدًا. بمئة ألف، هل يمكن؟
      en: Oh, too expensive. A hundred thousand, OK?
    - speaker: Bu Nyoman
      text: Aduh, jangan seratus, Pak. Saya rugi! Seratus delapan puluh.
      ar_eg: يا لهوي، مش مية يا أستاذ. كده هخسر! مية وتمانين.
      ar: آه، لا تقل مئة يا سيدي، سأخسر! مئة وثمانون.
      en: Oh no, not a hundred, sir. I'll lose money! A hundred and eighty.
    - speaker: Mohamed
      text: Di toko sebelah, kain yang sama seratus dua puluh ribu.
      ar_eg: في المحل اللي جنبك، نفس القماشة بمية وعشرين ألف.
      ar: في المتجر المجاور، القماش نفسه بمئة وعشرين ألفًا.
      en: Next door, the same cloth is a hundred and twenty thousand.
    - speaker: Bu Nyoman
      text: Seratus lima puluh. Itu harga pas.
      ar_eg: مية وخمسين. ده آخر سعر.
      ar: مئة وخمسون. هذا السعر النهائي.
      en: A hundred and fifty. That's my final price.
    - speaker: Mohamed
      text: Seratus tiga puluh ribu, dan saya beli dua lembar.
      ar_eg: مية وتلاتين ألف، وهاخد حتتين.
      ar: مئة وثلاثون ألفًا، وسأشتري قطعتين.
      en: A hundred and thirty thousand, and I'll take two pieces.
    - speaker: Bu Nyoman
      text: Ya sudah, boleh. Jangan lupa datang lagi, ya!
      ar_eg: خلاص ماشي. ماتنساش تيجي تاني!
      ar: حسنًا، موافقة. لا تنسَ أن تعود مرة أخرى!
      en: OK then, fine. Don't forget to come again!
    - speaker: Mohamed
      text: Terima kasih, Bu. Pasti!
      ar_eg: شكرًا يا مدام. أكيد!
      ar: شكرًا يا سيدتي. بالتأكيد!
      en: Thank you, ma'am. Definitely!
