schema: kabar.lesson/v1
id: bipa4.u05.l07
language: id
title: Hari Kartini
can_do:
  ar_eg: تكتب عن مناسبة وطنية بتحيي ذكرى شخصية.
  ar: أن تكتب عن مناسبة وطنية تُحيي ذكرى شخصية.
  en: Write about a commemoration.
slides:
  - title: Habis gelap terbitlah terang
    body:
      ar_eg: |
        كل ٢١ أبريل إندونيسيا بتحيي ذكرى كارتيني، البنت الجاوية اللي من أكتر من ١٠٠ سنة كتبت جوابات بتطالب بتعليم البنات.
        جواباتها اتجمعت في كتاب اسمه Habis Gelap Terbitlah Terang = «بعد الضلمة بيطلع النور».
        ودي استعارة: gelap (الضلمة) = الجهل، terang (النور) = التعليم.
        اكتب عن المناسبة بأفعال -i اللي اتعلمتها: memperingati، menghormati، menghadiri.
      ar: |
        تُحيي إندونيسيا في ٢١ أبريل ذكرى كارتيني، الفتاة الجاوية التي كتبت قبل أكثر من مئة عام رسائل تطالب بتعليم البنات.
        وجُمعت رسائلها في كتاب عنوانه Habis Gelap Terbitlah Terang = «بعد الظلام يشرق النور».
        وهي استعارة: gelap (الظلام) = الجهل، وterang (النور) = التعليم.
        واكتب عن المناسبة بأفعال -i: memperingati، menghormati، menghadiri.
      en: |
        Every 21 April Indonesia commemorates Kartini, the Javanese young woman who, over a century ago, wrote letters calling for girls' education.
        Her letters were collected as Habis Gelap Terbitlah Terang = "After darkness comes light".
        That's a metaphor: gelap (darkness) = ignorance, terang (light) = education.
        Write about the day with your -i verbs: memperingati, menghormati, menghadiri.
    grammar: id.figurative.metaphor
    examples:
      - text: Setiap 21 April, kita memperingati Hari Kartini.
        ar_eg: كل ٢١ أبريل بنحيي ذكرى يوم كارتيني.
        ar: نحيي ذكرى يوم كارتيني في ٢١ أبريل من كل عام.
        en: Every 21 April we commemorate Kartini Day.
      - text: Habis gelap terbitlah terang.
        ar_eg: بعد الضلمة بيطلع النور.
        ar: بعد الظلام يشرق النور.
        en: After darkness comes light.
exercises:
  - id: e01
    type: listen
    text: Pada Hari Kartini, para siswi memakai kebaya.
    options: ["Pada Hari Guru, para siswi memakai kebaya.", "Pada Hari Kartini, para siswi memakai kebaya.", "Pada Hari Kartini, para siswa memakai batik."]
    answer: 1
    meaning:
      ar_eg: في يوم كارتيني، التلميذات بيلبسوا الكباية.
      ar: في يوم كارتيني ترتدي الطالبات الكبايا.
      en: On Kartini Day, the schoolgirls wear kebaya.
    words: [kebaya]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: في عنوان كارتيني، كلمة gelap (الضلمة) رمز لإيه؟
      ar: في عنوان كارتيني، إلامَ ترمز gelap (الظلام)؟
      en: In Kartini's title, what does gelap (darkness) stand for?
    options: ["kebodohan", "malam hari", "listrik mati"]
    answer: 0
    explain:
      ar_eg: "دي استعارة: الضلمة = الجهل، والنور = التعليم."
      ar: "هي استعارة: الظلام = الجهل، والنور = التعليم."
      en: It's a metaphor — darkness = ignorance, light = education.
  - id: e03
    type: match_pairs
    pairs:
      - text: emansipasi
        ar_eg: تحرير / مساواة (للستات)
        ar: التحرّر / المساواة
        en: emancipation
      - text: kebaya
        ar_eg: كباية (بلوزة تقليدية للستات)
        ar: الكبايا (بلوزة نسائية تقليدية)
        en: kebaya (traditional blouse)
      - text: pejuang
        ar_eg: مناضل / مكافح
        ar: مناضل
        en: fighter, champion
      - text: kaum perempuan
        ar_eg: الستات / النساء
        ar: النساء
        en: women (as a group)
      - text: memperingati
        ar_eg: يحيي ذكرى
        ar: يُحيي ذكرى
        en: commemorate
    words: [emansipasi, kebaya, pejuang, kaum perempuan, memperingati]
  - id: e04
    type: fill_blank
    sentence: Kartini adalah ___ emansipasi perempuan.
    meaning:
      ar_eg: كارتيني مناضلة من أجل تحرير المرأة.
      ar: كارتيني مناضلة من أجل تحرّر المرأة.
      en: Kartini was a champion of women's emancipation.
    options: [pejuang, kebaya, terang]
    answers: [pejuang]
    words: [pejuang, emansipasi]
    explain:
      ar_eg: pejuang = مناضلة، وكارتيني ناضلت لتحرير المرأة. kebaya = لبس تقليدي، وterang = نور.
      ar: pejuang = المناضلة، فقد ناضلت كارتيني لتحرير المرأة. أما kebaya فزي تقليدي، وterang النور.
      en: pejuang means champion or fighter, which Kartini was. kebaya is traditional dress, and terang is light.
  - id: e05
    type: fill_blank
    sentence: Setiap 21 April, kita ___ Hari Kartini.
    meaning:
      ar_eg: (اكتب الفعل من ingat) كل ٢١ أبريل بنحيي ذكرى يوم كارتيني.
      ar: (اكتب الفعل من ingat) نحيي ذكرى يوم كارتيني في ٢١ أبريل.
      en: (Type the verb from ingat.) Every 21 April we commemorate Kartini Day.
    answers: [memperingati]
    words: [memperingati]
    explain:
      ar_eg: memperingati = يحيي ذكرى، من ingat + meN-…-i (memper-…-i).
      ar: memperingati = يُحيي ذكرى، من ingat مع memper-…-i.
      en: memperingati means commemorate, from ingat with memper-…-i.
  - id: e06
    type: build_sentence
    source:
      ar_eg: كارتيني كانت عايزة الستات يقدروا يتعلموا.
      ar: أرادت كارتيني أن تتمكن النساء من التعلّم في المدارس.
      en: Kartini wanted women to be able to go to school.
    answer: Kartini ingin kaum perempuan bisa sekolah.
    distractors: [kebaya, seperti]
    words: [kaum perempuan]
    explain:
      ar_eg: ingin = عايزة، وkaum perempuan = الستات. kebaya = لبس تقليدي، وseperti = زي، ومش في الجملة.
      ar: ingin = تريد، وkaum perempuan = النساء. أما kebaya فزي تقليدي، وseperti مثل، وليسا في الجملة.
      en: ingin means want, and kaum perempuan is women. kebaya (traditional dress) and seperti (like) aren't in the sentence.
  - id: e07
    type: dictation
    text: Kartini adalah pejuang emansipasi dari Jepara.
    meaning:
      ar_eg: كارتيني مناضلة من أجل تحرير المرأة من جيبارا.
      ar: كارتيني مناضلة من أجل التحرّر من جيبارا.
      en: Kartini was a champion of emancipation from Jepara.
    words: [pejuang, emansipasi]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الستات بيلبسوا الكباية في يوم كارتيني.
      ar: ترتدي النساء الكبايا في يوم كارتيني.
      en: Women wear kebaya on Kartini Day.
    answers:
      - Kaum perempuan memakai kebaya pada Hari Kartini.
      - Kaum perempuan memakai kebaya pada Hari Kartini
      - Pada Hari Kartini, kaum perempuan memakai kebaya.
      - Perempuan memakai kebaya pada Hari Kartini.
      - Para perempuan memakai kebaya pada Hari Kartini.
      - Kaum perempuan memakai kebaya di Hari Kartini.
      - Wanita memakai kebaya pada Hari Kartini.
    words: [kaum perempuan, kebaya]
  - id: e09
    type: speaking
    text: Bagi Kartini, pendidikan adalah terang setelah gelap. Itulah arti emansipasi.
    meaning:
      ar_eg: بالنسبة لكارتيني، التعليم هو النور بعد الضلمة. ده معنى التحرير.
      ar: كان التعليم عند كارتيني نورًا بعد ظلام، وهذا هو معنى التحرّر.
      en: For Kartini, education was light after darkness. That's what emancipation means.
    words: [emansipasi]
dialogue:
  title: Tanggal 21 April
  lines:
    - speaker: Mohamed
      text: Kok hari ini semua murid perempuan pakai kebaya?
      ar_eg: ليه النهارده كل البنات في المدرسة لابسين كباية؟
      ar: لماذا ترتدي كل الطالبات الكبايا اليوم؟
      en: Why are all the schoolgirls wearing kebaya today?
    - speaker: Andi Tenri
      text: Hari ini 21 April. Kita memperingati Hari Kartini.
      ar_eg: النهارده ٢١ أبريل. بنحيي ذكرى يوم كارتيني.
      ar: اليوم ٢١ أبريل، ونحن نحيي ذكرى يوم كارتيني.
      en: Today is 21 April. We're commemorating Kartini Day.
    - speaker: Mohamed
      text: Siapa Kartini?
      ar_eg: مين كارتيني؟
      ar: من كارتيني؟
      en: Who was Kartini?
    - speaker: Andi Tenri
      text: Pejuang emansipasi. Dia ingin kaum perempuan bisa sekolah. Surat-suratnya jadi buku, judulnya Habis Gelap Terbitlah Terang.
      ar_eg: مناضلة لتحرير المرأة. كانت عايزة الستات يتعلموا. وجواباتها بقت كتاب اسمه «بعد الضلمة بيطلع النور».
      ar: مناضلة من أجل تحرير المرأة، أرادت أن تتعلم النساء. وصارت رسائلها كتابًا عنوانه «بعد الظلام يشرق النور».
      en: A champion of emancipation. She wanted women to be able to go to school. Her letters became a book called After Darkness Comes Light.
    - speaker: Mohamed
      text: Metafora yang indah! Gelap artinya nggak tahu apa-apa, dan terang artinya belajar.
      ar_eg: استعارة جميلة! الضلمة يعني ماتعرفش حاجة، والنور يعني تتعلم.
      ar: استعارة جميلة! الظلام هو الجهل، والنور هو التعلّم.
      en: A beautiful metaphor! Darkness means knowing nothing, and light means learning.
