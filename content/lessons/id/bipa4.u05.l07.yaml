schema: kabar.lesson/v1
id: bipa4.u05.l07
language: id
title: Undangan dan perasaan
can_do:
  ar_eg: 'تتكلم عن احتفال: دعوة، مشاعرك، والفن والنور اللي فيه.'
  ar: 'أن تتحدث عن احتفال: الدعوة ومشاعرك والفن والأنوار.'
  en: 'Talk about a celebration: the invitation, your feelings, the art and the lights.'
slides:
  - title: Malam yang indah
    body:
      ar_eg: |
        undangan = دعوة (من undang)، bergabung = ينضم (bergabung dengan = ينضم لـ).
        perasaan = إحساس، مشاعر (من rasa)، sungguh = بجد، فعلًا (sungguh indah = جميل بجد)، betapa = قد إيه (للتعجب): Betapa indahnya! = ده جميل قد إيه!
        cahaya = نور، seni = فن (seni tari = فن الرقص)، pendidikan = تعليم (من didik).
      ar: |
        undangan = الدعوة (من undang)، bergabung = ينضمّ (bergabung dengan).
        perasaan = الشعور (من rasa)، sungguh = حقًّا (sungguh indah = جميل حقًّا)، betapa = ما أشدّ (للتعجب): Betapa indahnya! = ما أجمله!
        cahaya = النور، seni = الفن (seni tari = فن الرقص)، pendidikan = التعليم (من didik).
      en: |
        undangan = invitation (from undang), bergabung = to join (bergabung dengan = join with).
        perasaan = feeling (from rasa), sungguh = truly (sungguh indah = truly beautiful), betapa = how (in exclamations): Betapa indahnya! = How beautiful!
        cahaya = light, seni = art (seni tari = dance), pendidikan = education (from didik).
    examples:
      - text: Saya dapat undangan untuk bergabung dengan acara itu.
        ar_eg: جاتلي دعوة أنضم للحفلة دي.
        ar: تلقيت دعوة للانضمام إلى ذلك الحفل.
        en: I got an invitation to join that event.
      - text: Betapa indahnya cahaya lampu di jalan!
        ar_eg: نور الفوانيس في الشارع حلو قد إيه!
        ar: ما أجمل أضواء المصابيح في الشارع!
        en: How beautiful the street lights are!
      - text: Kartini berjuang untuk pendidikan perempuan.
        ar_eg: كارتيني ناضلت عشان تعليم الستات.
        ar: ناضلت كارتيني من أجل تعليم المرأة.
        en: Kartini fought for women's education.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: undangan
        ar_eg: دعوة
        ar: دعوة
        en: invitation
      - text: bergabung
        ar_eg: ينضم
        ar: ينضمّ
        en: to join
      - text: perasaan
        ar_eg: إحساس
        ar: شعور
        en: feeling
      - text: sungguh
        ar_eg: بجد
        ar: حقًّا
        en: truly
    words: [undangan, bergabung, perasaan, sungguh]
  - id: e02
    type: match_pairs
    pairs:
      - text: betapa
        ar_eg: قد إيه
        ar: ما أشدّ
        en: how (exclamation)
      - text: cahaya
        ar_eg: نور
        ar: نور
        en: light
      - text: seni
        ar_eg: فن
        ar: فن
        en: art
      - text: pendidikan
        ar_eg: تعليم
        ar: تعليم
        en: education
    words: [betapa, cahaya, seni, pendidikan]
  - id: e03
    type: listen
    text: Saya mau bergabung dengan kelompok tari.
    question:
      ar_eg: عايز ينضم لإيه؟
      ar: إلامَ يريد أن ينضم؟
      en: What does the speaker want to join?
    options: [فرقة الرقص, فرقة المزيكا, الكشافة]
    answer: 0
    meaning:
      ar_eg: عايز أنضم لفرقة الرقص.
      ar: أريد الانضمام إلى فرقة الرقص.
      en: I want to join the dance group.
    words: [bergabung]
  - id: e04
    type: fill_blank
    sentence: Kartini ingin semua perempuan mendapat ___.
    meaning:
      ar_eg: كارتيني كانت عايزة كل الستات ياخدوا ___.
      ar: أرادت كارتيني أن تنال كل النساء ___.
      en: Kartini wanted every woman to get an ___.
    options: [pendidikan, undangan, cahaya]
    answers: [pendidikan]
    words: [pendidikan, undangan, cahaya]
    explain:
      ar_eg: mendapat pendidikan = تاخد تعليم، وده اللي كارتيني كانت عايزاه. undangan = دعوة، وcahaya = نور.
      ar: mendapat pendidikan = تحصل على التعليم، وهذا ما أرادته كارتيني. أما undangan فدعوة، وcahaya نور.
      en: mendapat pendidikan is to get an education, which Kartini wanted. undangan is an invitation and cahaya is light.
  - id: e05
    type: multiple_choice
    question: ___ indahnya kembang api malam ini!
    options: [Betapa, Sungguh, Seni]
    answer: 0
    explain:
      ar_eg: Betapa + صفة + ‑nya = قد إيه (تعجّب). sungguh = بجد ومش بتاخد ‑nya كده، وseni = فن.
      ar: Betapa مع الصفة و‑nya للتعجب. أما sungguh فحقًّا ولا تأتي هكذا مع ‑nya، وseni الفن.
      en: Betapa + adjective + ‑nya makes an exclamation. sungguh means truly and isn't used this way, and seni is art.
    words: [betapa, sungguh, seni]
  - id: e06
    type: fill_blank
    sentence: Di malam purnama, ___ bulan masuk ke kamar saya.
    meaning:
      ar_eg: في ليلة البدر، ___ القمر دخل أوضتي.
      ar: في ليلة البدر دخل ___ القمر غرفتي.
      en: On the full-moon night, the ___ of the moon came into my room.
    options: [cahaya, perasaan, seni]
    answers: [cahaya]
    words: [cahaya, perasaan, seni]
    explain:
      ar_eg: cahaya bulan = نور القمر، وهو اللي بيدخل الأوضة. perasaan = إحساس، وseni = فن.
      ar: cahaya bulan = ضوء القمر، وهو ما يدخل الغرفة. أما perasaan فشعور، وseni فن.
      en: cahaya bulan is moonlight, which comes into the room. perasaan is a feeling and seni is art.
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: بتقول لصاحبك إن الرقصة كانت جميلة بجد.
      ar: تقول لصديقك إن الرقصة كانت جميلة حقًّا.
      en: You tell a friend the dance was truly beautiful.
    options: [Tariannya sungguh indah., Tariannya betapa indah., Tariannya perasaan indah.]
    answer: 0
    explain:
      ar_eg: sungguh indah = جميلة بجد. betapa بتيجي في أول جملة التعجب، وperasaan = إحساس (اسم).
      ar: sungguh indah = جميلة حقًّا. أما betapa فتتصدّر جملة التعجب، وperasaan اسم.
      en: sungguh indah means truly beautiful. betapa starts an exclamation, and perasaan is a noun.
    words: [sungguh, betapa, perasaan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا فرحان إني جاتلي دعوة الحفلة دي.
      ar: أنا سعيد لأنني تلقيت دعوة هذا الحفل.
      en: I'm happy I got the invitation to this event.
    answer: Saya senang mendapat undangan acara ini.
    distractors: [seni, cahaya]
    words: [undangan, seni, cahaya]
    explain:
      ar_eg: mendapat undangan = جاتلي دعوة. seni = فن، وcahaya = نور، ومالهمش مكان هنا.
      ar: mendapat undangan = تلقّيت دعوة. أما seni ففن، وcahaya نور، ولا مكان لهما هنا.
      en: mendapat undangan means to get an invitation. seni is art and cahaya is light; they don't belong here.
  - id: e09
    type: translate
    direction: from_target
    source_text: Perasaan saya sungguh senang malam ini.
    answers_meaning:
      ar_eg: [أنا حاسس بفرحة بجد الليلة دي, إحساسي الليلة دي فرحان بجد]
      ar: [أشعر بسعادة حقيقية هذه الليلة, شعوري الليلة سعيد حقًّا]
      en: [I feel truly happy tonight, My feeling tonight is one of real happiness]
    words: [perasaan, sungguh]
  - id: e10
    type: speaking
    text: Anak-anak bergabung dalam festival seni di sekolah.
    meaning:
      ar_eg: العيال انضموا لمهرجان الفن في المدرسة.
      ar: انضمّ الأطفال إلى مهرجان الفن في المدرسة.
      en: The children joined the school arts festival.
    words: [bergabung, seni, pendidikan, undangan]
dialogue:
  lines:
    - speaker: Andi Tenri
      text: Mohamed, ini undangan untuk malam seni tujuh belasan.
      ar_eg: يا محمد، دي دعوة لليلة الفن بتاعة ١٧ أغسطس.
      ar: يا محمد، هذه دعوة لأمسية الفن في السابع عشر من أغسطس.
      en: Mohamed, here's an invitation to the 17 August arts night.
    - speaker: Mohamed
      text: Terima kasih! Aku boleh bergabung dengan kalian?
      ar_eg: شكرًا! ينفع أنضم ليكم؟
      ar: شكرًا! هل يمكنني الانضمام إليكم؟
      en: Thanks! Can I join you?
    - speaker: Andi Tenri
      text: Tentu! Ada tarian, musik, dan lampu warna-warni.
      ar_eg: طبعًا! فيه رقص ومزيكا ولمبات ألوان.
      ar: بالطبع! هناك رقص وموسيقى وأضواء ملوّنة.
      en: Of course! There's dancing, music and coloured lights.
    - speaker: Mohamed
      text: Betapa indahnya! Cahaya lampu di Mesir juga ramai waktu Ramadan.
      ar_eg: حلو قد إيه! النور في مصر كمان بيبقى كتير في رمضان.
      ar: ما أجمل ذلك! وأضواء مصر أيضًا كثيرة في رمضان.
      en: How lovely! Egypt's lights are everywhere at Ramadan too.
    - speaker: Andi Tenri
      text: Perasaanku sungguh senang kamu mau datang.
      ar_eg: أنا فرحانة بجد إنك جاي.
      ar: أنا سعيدة حقًّا لأنك ستأتي.
      en: I'm truly glad you're coming.
