schema: kabar.lesson/v1
id: bipa4.u05.l07
language: id
title: Surat-surat Kartini
can_do:
  ar_eg: تقرا مقال قصير عن كارتيني وتفهم حياتها وحلمها ومعنى عنوان كتابها.
  ar: أن تقرأ مقالًا قصيرًا عن كارتيني وتفهم سيرتها وحلمها ومعنى عنوان كتابها.
  en: Read a short article about Kartini and understand her life, her dream and her book's title.
slides:
  - title: Artikel tentang Kartini
    body:
      ar_eg: |
        مقال قصير من مجلة مدرسة في بالوبو، بمناسبة يوم كارتيني (٢١ أبريل).
        افتكر الاستعارة: gelap (الضلمة) و terang (النور).
      ar: |
        مقال قصير من مجلة مدرسية في بالوبو بمناسبة يوم كارتيني (٢١ أبريل).
        تذكّر الاستعارة: gelap (الظلام) و terang (النور).
      en: |
        A short article from a Palopo school magazine for Kartini Day (21 April).
        Remember the metaphor: gelap (darkness) and terang (light).
    examples:
      - text: Raden Ajeng Kartini lahir di Jepara pada 21 April 1879. Pada zaman itu, banyak anak perempuan tidak boleh sekolah.
        ar_eg: رادين أجينج كارتيني اتولدت في جيبارا يوم ٢١ أبريل ١٨٧٩. في الزمن ده، بنات كتير ماكانش مسموحلهم يتعلّموا.
        ar: وُلدت رادين أجينغ كارتيني في جيبارا في ٢١ أبريل ١٨٧٩. وفي ذلك الزمن لم يكن يُسمح لكثير من البنات بالتعلّم.
        en: Raden Ajeng Kartini was born in Jepara on 21 April 1879. In those days, many girls were not allowed to go to school.
      - text: Kartini menulis banyak surat kepada sahabatnya di Belanda. Dalam surat-suratnya, ia menceritakan mimpinya tentang pendidikan bagi kaum perempuan.
        ar_eg: كارتيني كتبت جوابات كتير لصاحباتها في هولندا. وفي جواباتها حكت عن حلمها إن الستات يتعلّموا.
        ar: كتبت كارتيني رسائل كثيرة إلى صديقاتها في هولندا، وروت فيها حلمها بتعليم النساء.
        en: Kartini wrote many letters to her friends in the Netherlands. In them she told of her dream of education for women.
      - text: "Setelah Kartini meninggal, surat-surat itu dijadikan sebuah buku: Habis Gelap Terbitlah Terang."
        ar_eg: "بعد ما كارتيني ماتت، الجوابات دي اتعملت كتاب: «بعد الضلمة بيطلع النور»."
        ar: "بعد وفاة كارتيني جُمعت تلك الرسائل في كتاب: «بعد الظلام يشرق النور»."
        en: "After Kartini died, the letters were made into a book: After Darkness Comes Light."
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: كارتيني اتولدت فين؟
      ar: أين وُلدت كارتيني؟
      en: Where was Kartini born?
    options: [Di Palopo, Di Jepara, Di Belanda]
    answer: 1
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: كارتيني كانت بتكتب جوابات لمين؟
      ar: إلى من كانت كارتيني تكتب رسائلها؟
      en: Who did Kartini write her letters to?
    options:
      - Kepada sahabatnya di Belanda
      - Kepada raja Jawa
      - Kepada para wartawan
    answer: 0
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: كارتيني كانت بتحلم بإيه؟
      ar: بمَ كانت كارتيني تحلم؟
      en: What did Kartini dream of?
    options:
      - Lomba tujuh belasan
      - Kebaya baru untuk semua siswi
      - Pendidikan bagi kaum perempuan
    answer: 2
    words: [kaum perempuan, emansipasi]
  - id: e04
    type: listen
    text: Kartini menulis banyak surat kepada sahabatnya.
    options:
      - Kartini membaca banyak surat dari sahabatnya.
      - Kartini menulis banyak surat kepada sahabatnya.
      - Kartini menulis banyak buku untuk sahabatnya.
    answer: 1
    meaning:
      ar_eg: كارتيني كتبت جوابات كتير لصاحباتها.
      ar: كتبت كارتيني رسائل كثيرة إلى صديقاتها.
      en: Kartini wrote many letters to her friends.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: في عنوان «Habis Gelap Terbitlah Terang»، كلمة terang (النور) بترمز لإيه؟
      ar: في عنوان «Habis Gelap Terbitlah Terang»، إلامَ ترمز كلمة terang (النور)؟
      en: In the title "Habis Gelap Terbitlah Terang", what does terang (light) stand for?
    options: [Pendidikan, Matahari pagi, Lampu rumah]
    answer: 0
    explain:
      ar_eg: "ده استعارة: الضلمة = الجهل، والنور = التعليم اللي كارتيني كانت بتحلم بيه."
      ar: "هذه استعارة: الظلام = الجهل، والنور = التعليم الذي حلمت به كارتيني."
      en: "It's a metaphor: darkness = ignorance, light = the education Kartini dreamed of."
  - id: e06
    type: match_pairs
    pairs:
      - text: pejuang
        ar_eg: مناضل / مكافح
        ar: مناضل
        en: fighter, champion
      - text: emansipasi
        ar_eg: تحرّر / مساواة
        ar: تحرّر
        en: emancipation
      - text: kaum perempuan
        ar_eg: الستات (كفئة)
        ar: النساء (فئةً)
        en: women (as a group)
      - text: kebaya
        ar_eg: الكبايا (بلوزة تقليدية)
        ar: الكبايا (بلوزة تقليدية)
        en: kebaya (traditional blouse)
      - text: menghormati
        ar_eg: يحترم / يكرّم
        ar: يحترم / يكرّم
        en: respect, honour
    words: [pejuang, emansipasi, kaum perempuan, kebaya, menghormati]
  - id: e07
    type: fill_blank
    sentence: Dalam surat-suratnya, Kartini ___ mimpinya tentang pendidikan.
    meaning:
      ar_eg: في جواباتها، كارتيني حكت عن حلمها في التعليم.
      ar: روت كارتيني في رسائلها حلمها بالتعليم.
      en: In her letters, Kartini told of her dream of education.
    options: [memperingati, menyemangati, menceritakan]
    answers: [menceritakan]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كارتيني كانت مناضلة عشان الستات يتعلّموا.
      ar: كانت كارتيني مناضلة من أجل تعليم النساء.
      en: Kartini was a champion of education for women.
    answers:
      - Kartini adalah pejuang pendidikan bagi kaum perempuan.
      - Kartini adalah pejuang pendidikan untuk kaum perempuan.
      - Kartini pejuang pendidikan bagi kaum perempuan.
      - Kartini adalah pejuang pendidikan bagi perempuan.
      - Kartini adalah pejuang pendidikan untuk perempuan.
      - Kartini adalah seorang pejuang pendidikan bagi kaum perempuan.
    words: [pejuang, kaum perempuan]
dialogue:
  title: Setelah membaca
  lines:
    - speaker: Mohamed
      text: Tenri, saya baru baca artikel tentang Kartini.
      ar_eg: يا Tenri، لسه قاري مقال عن كارتيني.
      ar: يا Tenri، قرأت للتوّ مقالًا عن كارتيني.
      en: Tenri, I've just read an article about Kartini.
    - speaker: Andi Tenri
      text: Oh ya? Apa yang paling menarik?
      ar_eg: بجد؟ إيه أكتر حاجة عجبتك؟
      ar: حقًّا؟ ما أكثر ما أثار اهتمامك؟
      en: Oh really? What was most interesting?
    - speaker: Mohamed
      text: Dia menulis banyak surat kepada sahabatnya di Belanda.
      ar_eg: إنها كتبت جوابات كتير لصاحباتها في هولندا.
      ar: أنها كتبت رسائل كثيرة إلى صديقاتها في هولندا.
      en: She wrote lots of letters to her friends in the Netherlands.
    - speaker: Andi Tenri
      text: Betul. Surat-surat itu kemudian dijadikan buku.
      ar_eg: مظبوط. وبعدين الجوابات دي اتعملت كتاب.
      ar: صحيح. ثم جُمعت تلك الرسائل في كتاب.
      en: Right. Later those letters were made into a book.
    - speaker: Mohamed
      text: Judulnya metafora yang indah. Setelah gelap, datang terang.
      ar_eg: عنوانه استعارة حلوة. بعد الضلمة، ييجي النور.
      ar: "عنوانه استعارة جميلة: بعد الظلام يأتي النور."
      en: Its title is a lovely metaphor. After darkness comes light.
