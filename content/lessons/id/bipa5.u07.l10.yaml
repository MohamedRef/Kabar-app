schema: kabar.lesson/v1
id: bipa5.u07.l10
language: id
title: Identitas di piring
can_do:
  ar_eg: تكتب فقرة عن إزاي الأكل بيعبّر عن هوية الناس.
  ar: أن تكتب فقرة عن تعبير الطعام عن هويّة الناس.
  en: Write a paragraph on how food expresses identity.
slides:
  - title: Makanan dan identitas
    grammar: id.confix.per-an
    body:
      ar_eg: |
        عشان تكتب عن الأكل والهوية:
        - Makanan ini mencerminkan … = الأكلة دي بتعكس …
        - … menjadi bagian dari identitas … = … بقى جزء من هوية …
        - Bagi orang Mesir, koshary bukan sekadar makanan. = بالنسبة للمصريين، الكشري مش مجرد أكل.
        واستخدم أسماء per-…-an زي perdagangan وpertemuan: Makanan ini lahir dari pertemuan banyak budaya. = الأكلة دي اتولدت من لقاء ثقافات كتير.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: kayaknya = sepertinya، kayak = seperti، bener = benar.
      ar: |
        لتكتب عن الطعام والهويّة:
        - Makanan ini mencerminkan … = يعكس هذا الطبق …
        - … menjadi bagian dari identitas … = صار … جزءًا من هويّة …
        - Bagi orang Mesir, koshary bukan sekadar makanan. = ليس الكشري مجرّد طعام عند المصريين.
        واستعمل أسماء per-…-an مثل perdagangan وpertemuan: Makanan ini lahir dari pertemuan banyak budaya.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: kayaknya = sepertinya، kayak = seperti، bener = benar.
      en: |
        To write about food and identity:
        - Makanan ini mencerminkan … = This dish reflects …
        - … menjadi bagian dari identitas … = … has become part of … identity
        - Bagi orang Mesir, koshary bukan sekadar makanan. = For Egyptians, koshary is more than food.
        Use per-…-an nouns like perdagangan and pertemuan: Makanan ini lahir dari pertemuan banyak budaya. = This dish was born where many cultures met.
        The dialogue uses street forms; the formal ones are beside them: kayaknya = sepertinya, kayak = seperti, bener = benar.
    examples:
      - text: Soto Banjar mencerminkan sejarah perdagangan di Kalimantan.
        ar_eg: سوتو بانجار بتعكس تاريخ التجارة في كاليمانتان.
        ar: تعكس سوتو بانجار تاريخ التجارة في كاليمانتان.
        en: Soto Banjar reflects the history of trade in Kalimantan.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mencerminkan
        ar_eg: يعكس
        ar: يعكس
        en: to reflect
      - text: identitas
        ar_eg: هوية
        ar: هويّة
        en: identity
      - text: bukan sekadar
        ar_eg: مش مجرد
        ar: ليس مجرّد
        en: more than just
      - text: lahir
        ar_eg: يتولد
        ar: يولد
        en: to be born
    words: [mencerminkan, identitas, bukan sekadar, lahir]
  - id: e02
    type: multiple_choice
    question: "Bagi orang Mesir, koshary ___ makanan, tetapi juga kenangan."
    question_meaning:
      ar_eg: كمّل الجملة. «بالنسبة للمصريين، الكشري … أكل، ده كمان ذكريات.»
      ar: أكمل الجملة. «ليس الكشري عند المصريين … طعامًا، بل ذكريات أيضًا.»
      en: Complete the sentence. "For Egyptians, koshary is … food, but memories too."
    options: [mencerminkan, lahir, bukan sekadar]
    answer: 2
    words: [bukan sekadar]
    explain:
      ar_eg: «مش مجرد أكل، كمان…» = bukan sekadar … tetapi juga. mencerminkan = يعكس وlahir = اتولد، مايمشوش قبل makanan هنا.
      ar: «ليس مجرّد طعام بل…» = bukan sekadar … tetapi juga. أما mencerminkan فـ«يعكس»، وlahir «وُلد».
      en: "\"Not just food, but also…\" is bukan sekadar … tetapi juga. mencerminkan and lahir don't fit there."
  - id: e03
    type: fill_blank
    sentence: Masakan ini ___ budaya Arab, Melayu, dan Tionghoa.
    meaning:
      ar_eg: الأكلة دي بتعكس الثقافة العربية والملاوية والصينية.
      ar: يعكس هذا الطبق الثقافات العربية والملايوية والصينية.
      en: This dish reflects Arab, Malay and Chinese culture.
    options: [mencerminkan, lahir, identitas]
    answers: [mencerminkan]
    words: [mencerminkan]
    explain:
      ar_eg: «بتعكس» = mencerminkan. lahir = اتولد وidentitas = هوية (اسم)، مش فعل يعكس.
      ar: «يعكس» = mencerminkan. أما lahir فـ«وُلد»، وidentitas اسم «الهويّة».
      en: "\"Reflects\" is mencerminkan. lahir (born) and identitas (identity) aren't that verb."
  - id: e04
    type: listen
    text: Makanan ini lahir dari pertemuan banyak budaya.
    options:
      - Makanan ini lahir dari pertemuan banyak budaya.
      - Makanan ini lahir dari perdagangan satu budaya.
      - Makanan ini lahir di pertemuan keluarga.
    answer: 0
    words: [lahir]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الأكل جزء من هوية الشعب.
      ar: الطعام جزء من هويّة الشعب.
      en: Food is part of a people's identity.
    answer: Makanan adalah bagian dari identitas bangsa.
    distractors: [lahir, sekadar]
    words: [identitas]
    explain:
      ar_eg: «هوية الشعب» = identitas bangsa. lahir = اتولد وsekadar = مجرد، مش في الجملة.
      ar: «هويّة الشعب» = identitas bangsa. أما lahir فـ«وُلد»، وsekadar «مجرّد».
      en: "\"A people's identity\" is identitas bangsa. lahir and sekadar aren't in it."
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الملوخية بتعكس الهوية المصرية.
      ar: تعكس الملوخية الهويّة المصرية.
      en: Molokhia reflects Egyptian identity.
    answers:
      - Molokhia mencerminkan identitas Mesir.
      - Mulukhiyah mencerminkan identitas Mesir.
      - Molokhia mencerminkan identitas orang Mesir.
      - Molokhiya mencerminkan identitas Mesir.
    words: [mencerminkan, identitas]
  - id: e07
    type: dictation
    text: Soto ini bukan sekadar sup, tetapi juga sejarah.
    meaning:
      ar_eg: السوتو دي مش مجرد شوربة، دي كمان تاريخ.
      ar: هذه السوتو ليست مجرّد حساء، بل تاريخ أيضًا.
      en: This soto is more than soup; it's history too.
    words: [bukan sekadar]
  - id: e08
    type: speaking
    text: Kue ini lahir di Banjarmasin dan menjadi bagian dari identitas kota.
    meaning:
      ar_eg: الكيكة دي اتولدت في بانجارماسين وبقت جزء من هوية المدينة.
      ar: وُلدت هذه الحلوى في بانجارماسين وصارت جزءًا من هويّة المدينة.
      en: This cake was born in Banjarmasin and became part of the city's identity.
    words: [lahir, identitas]
dialogue:
  title: Membandingkan dapur
  lines:
    - speaker: Rina
      text: Mohamed, makanan yang paling mencerminkan Mesir apa, sih?
      ar_eg: يا محمد، أنهي أكلة بتعكس مصر أكتر حاجة؟
      ar: يا محمد، أيّ طعام يعكس مصر أكثر؟
      en: Mohamed, which food reflects Egypt best?
    - speaker: Mohamed
      text: "Kayaknya koshary: nasi sama makaroni. Lahirnya juga dari pertemuan banyak budaya."
      ar_eg: "يمكن الكشري: رز ومكرونة. اتولد هو كمان من لقاء ثقافات كتير."
      ar: "ربّما الكشري: أرزّ ومعكرونة، ووُلد هو أيضًا من لقاء ثقافات كثيرة."
      en: "Maybe koshary: rice and pasta. Also born where many cultures met."
    - speaker: Rina
      text: Kayak soto Banjar! Jadi makanan bukan sekadar makanan, ya.
      ar_eg: زي سوتو بانجار! يعني الأكل مش مجرد أكل.
      ar: مثل سوتو بانجار! فالطعام ليس مجرّد طعام إذن.
      en: Like soto Banjar! So food is more than just food.
    - speaker: Mohamed
      text: Bener. Makanan itu bagian dari identitas kita.
      ar_eg: مظبوط. الأكل جزء من هويتنا.
      ar: صحيح. الطعام جزء من هويّتنا.
      en: Right. Food is part of our identity.
new_words:
  - word: mencerminkan
    pos: verb
