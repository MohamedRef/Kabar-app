schema: kabar.lesson/v1
id: bipa1.u02.l02
language: id
title: Saya orang Mesir
can_do:
  ar_eg: تقول جنسيتك واللغات اللي بتتكلمها.
  ar: أن تذكر جنسيتك واللغات التي تتحدثها.
  en: Say your nationality and languages.
slides:
  - title: Orang Mesir
    body:
      ar_eg: |
        مافيش نهاية زي «ـي» في «مصري». بتقول orang (شخص) + اسم البلد: orang Mesir = مصري، orang Indonesia = إندونيسي.
        خلي بالك: «Saya Mesir» معناها «أنا مصر» نفسها! لازم orang.
        وMesir جاية من العربي «مصر» — الإندونيسيين بيعرفوا مصر كويس بسبب الأزهر.
      ar: |
        لا توجد لاحقة كياء النسب في «مصري»، بل تقول orang (شخص) + اسم البلد: orang Mesir = مصري، orang Indonesia = إندونيسي.
        انتبه: «Saya Mesir» تعني «أنا مصر» نفسها، فلا بد من orang.
        وMesir من العربية «مصر»، ومصر معروفة هناك بفضل الأزهر.
      en: |
        There's no "-ian" ending. Say orang (person) + country: orang Mesir = Egyptian, orang Indonesia = Indonesian.
        Careful: "Saya Mesir" means "I am Egypt"! You need orang.
        Mesir comes from Arabic «مصر» — Indonesians know Egypt well thanks to Al-Azhar.
    grammar: id.origin.orang-bahasa
    examples:
      - text: Saya orang Mesir.
        ar_eg: أنا مصري.
        ar: أنا مصري.
        en: I'm Egyptian.
      - text: Rina orang Indonesia.
        ar_eg: رينا إندونيسية.
        ar: رينا إندونيسية.
        en: Rina is Indonesian.
  - title: Bahasa Arab, bahasa Inggris
    body:
      ar_eg: |
        اللغة = bahasa + اسمها: bahasa Arab = العربي (Arab ← «عرب»)، bahasa Inggris = الإنجليزي، bahasa Indonesia = الإندونيسي.
        وعشان تقول بتتكلم إيه: Saya bisa bahasa … (bisa = يقدر / يعرف). وsedikit = شوية.
      ar: |
        اللغة = bahasa + اسمها: bahasa Arab = العربية (Arab ← «عرب»)، bahasa Inggris = الإنجليزية، bahasa Indonesia = الإندونيسية.
        وللتعبير عما تتحدثه: Saya bisa bahasa … (bisa = يستطيع / يُحسن)، وsedikit = قليلًا.
      en: |
        Language = bahasa + name: bahasa Arab = Arabic (Arab ← «عرب»), bahasa Inggris = English, bahasa Indonesia = Indonesian.
        To say what you speak: Saya bisa bahasa … (bisa = can). sedikit = a little.
    grammar: id.origin.orang-bahasa
    examples:
      - text: Saya bisa bahasa Arab dan bahasa Inggris.
        ar_eg: أنا بتكلم عربي وإنجليزي.
        ar: أتحدث العربية والإنجليزية.
        en: I speak Arabic and English.
      - text: Saya bisa bahasa Indonesia sedikit.
        ar_eg: بتكلم إندونيسي شوية.
        ar: أتحدث الإندونيسية قليلًا.
        en: I speak a little Indonesian.
  - title: Dari mana? Di mana?
    body:
      ar_eg: |
        «فين» في الإندونيسي = حرف جر + mana، زي العربي بالظبط:
        - dari mana = منين (dari ≈ من)
        - di mana = فين (di ≈ في) — بتتكتب كلمتين.
        - ke mana = على فين (ke ≈ لـ)
        وكلمة السؤال غالبًا بتيجي في الآخر: «Kamu tinggal di mana?» = «إنت ساكن فين؟».
      ar: |
        «أين» في الإندونيسية = حرف جر + mana، كما في العربية:
        - dari mana = من أين (dari ≈ من)
        - di mana = أين (di ≈ في)، وتُكتب كلمتين.
        - ke mana = إلى أين (ke ≈ إلى)
        وكثيرًا ما تأتي أداة الاستفهام في آخر الجملة: «Kamu tinggal di mana?» = «أين تسكن؟».
      en: |
        "Where" = preposition + mana, just like Arabic:
        - dari mana = where from (dari ≈ من)
        - di mana = where (di ≈ في) — written as two words.
        - ke mana = where to (ke ≈ إلى)
        The question phrase often goes last: "Kamu tinggal di mana?" = "Where do you live?"
    grammar: id.question.mana
    examples:
      - text: Anda dari mana? — Saya dari Mesir.
        ar_eg: حضرتك منين؟ — أنا من مصر.
        ar: من أين أنت؟ — أنا من مصر.
        en: Where are you from? — I'm from Egypt.
      - text: Kamu tinggal di mana? — Di Menteng.
        ar_eg: إنت ساكن فين؟ — في منتنج.
        ar: أين تسكن؟ — في منتنج.
        en: Where do you live? — In Menteng.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: orang Mesir
        ar_eg: مصري
        ar: مصري
        en: Egyptian (person)
      - text: bahasa Arab
        ar_eg: اللغة العربي
        ar: اللغة العربية
        en: Arabic (language)
      - text: dari mana
        ar_eg: منين
        ar: من أين
        en: where from
      - text: di mana
        ar_eg: فين
        ar: أين
        en: where
      - text: sedikit
        ar_eg: شوية
        ar: قليلًا
        en: a little
    words: [orang, bahasa, dari, mana, sedikit]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «أنا مصري»؟
      ar: كيف تقول «أنا مصري»؟
      en: How do you say "I'm Egyptian"?
    options: ["Saya orang Mesir.", "Saya Mesir.", "Saya bahasa Mesir."]
    answer: 0
    explain:
      ar_eg: «Saya Mesir» يعني «أنا مصر»، و«bahasa» للغة مش للجنسية.
      ar: «Saya Mesir» تعني «أنا مصر»، وbahasa للغة لا للجنسية.
      en: '"Saya Mesir" means "I am Egypt", and bahasa is for languages, not nationality.'
    words: [orang, Mesir]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تعرف Ni Luh ساكنة فين. تسأل إيه؟
      ar: تريد أن تعرف أين تسكن Ni Luh. ماذا تسأل؟
      en: You want to know where Ni Luh lives. What do you ask?
    options: ["Kamu dari mana?", "Kamu siapa?", "Kamu tinggal di mana?"]
    answer: 2
    explain:
      ar_eg: di mana = فين (المكان). dari mana = منين (الأصل).
      ar: di mana للمكان (أين)، وdari mana للأصل (من أين).
      en: di mana asks for the place; dari mana asks for the origin.
    words: [tinggal, di mana]
  - id: e04
    type: listen
    text: Saya dari Kairo
    options: ["Saya orang Kairo", "Saya dari Kairo", "Saya di Kairo"]
    answer: 1
    words: [dari]
  - id: e05
    type: fill_blank
    sentence: Saya bisa bahasa ___ dan bahasa Inggris.
    meaning:
      ar_eg: أنا بتكلم عربي وإنجليزي.
      ar: أتحدث العربية والإنجليزية.
      en: I speak Arabic and English.
    options: ["Arab", "orang", "Mesir"]
    answers: [Arab]
    explain:
      ar_eg: المصريين بيتكلموا bahasa Arab، مافيش «bahasa Mesir».
      ar: لغة المصريين bahasa Arab، ولا يقال «bahasa Mesir».
      en: Egyptians speak bahasa Arab; there's no "bahasa Mesir".
    words: [bahasa, Arab]
  - id: e06
    type: fill_blank
    sentence: Anda ___ mana? — Saya dari Mesir.
    meaning:
      ar_eg: حضرتك منين؟ — أنا من مصر.
      ar: من أين أنت؟ — أنا من مصر.
      en: Where are you from? — I'm from Egypt.
    options: ["dari", "ke", "di"]
    answers: [dari]
    words: [dari, mana]
  - id: e07
    type: fill_blank
    sentence: Rina orang ___. Dia tinggal di Jakarta.
    meaning:
      ar_eg: رينا إندونيسية. ساكنة في جاكرتا.
      ar: رينا إندونيسية، وتسكن في جاكرتا.
      en: Rina is Indonesian. She lives in Jakarta.
    answers: [Indonesia]
    words: [orang, Indonesia]
  - id: e08
    type: build_sentence
