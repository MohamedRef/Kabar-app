schema: kabar.lesson/v1
id: bipa1.u02.l02
language: id
title: Saya orang Mesir
can_do:
  ar_eg: تقول جنسيتك واللغات اللي بتتكلمها.
  ar: أن تذكر جنسيتك واللغات التي تتحدثها.
  en: Say your nationality and languages.
slides:
  - title: Orang Mesir
    body:
      ar_eg: |
        مافيش نهاية زي «ـي» في «مصري». بتقول orang (شخص) + اسم البلد: orang Mesir = مصري، orang Indonesia = إندونيسي.
        خلي بالك: «Saya Mesir» معناها «أنا مصر» نفسها! لازم orang.
        وMesir جاية من العربي «مصر» — الإندونيسيين بيعرفوا مصر كويس بسبب الأزهر.
      ar: |
        لا توجد لاحقة كياء النسب في «مصري»، بل تقول orang (شخص) + اسم البلد: orang Mesir = مصري، orang Indonesia = إندونيسي.
        انتبه: «Saya Mesir» تعني «أنا مصر» نفسها، فلا بد من orang.
        وMesir من العربية «مصر»، ومصر معروفة هناك بفضل الأزهر.
      en: |
        There's no "-ian" ending. Say orang (person) + country: orang Mesir = Egyptian, orang Indonesia = Indonesian.
        Careful: "Saya Mesir" means "I am Egypt"! You need orang.
        Mesir comes from Arabic «مصر» — Indonesians know Egypt well thanks to Al-Azhar.
    grammar: id.origin.orang-bahasa
    examples:
      - text: Saya orang Mesir.
        ar_eg: أنا مصري.
        ar: أنا مصري.
        en: I'm Egyptian.
      - text: Rina orang Indonesia.
        ar_eg: رينا إندونيسية.
        ar: رينا إندونيسية.
        en: Rina is Indonesian.
  - title: Bahasa Arab, bahasa Inggris
    body:
      ar_eg: |
        اللغة = bahasa + اسمها: bahasa Arab = العربي (Arab ← «عرب»)، bahasa Inggris = الإنجليزي، bahasa Indonesia = الإندونيسي.
        وعشان تقول بتتكلم إيه: Saya bisa bahasa … (bisa = يقدر / يعرف). وsedikit = شوية.
      ar: |
        اللغة = bahasa + اسمها: bahasa Arab = العربية (Arab ← «عرب»)، bahasa Inggris = الإنجليزية، bahasa Indonesia = الإندونيسية.
        وللتعبير عما تتحدثه: Saya bisa bahasa … (bisa = يستطيع / يُحسن)، وsedikit = قليلًا.
      en: |
        Language = bahasa + name: bahasa Arab = Arabic (Arab ← «عرب»), bahasa Inggris = English, bahasa Indonesia = Indonesian.
        To say what you speak: Saya bisa bahasa … (bisa = can). sedikit = a little.
    grammar: id.origin.orang-bahasa
    examples:
      - text: Saya bisa bahasa Arab dan bahasa Inggris.
        ar_eg: أنا بتكلم عربي وإنجليزي.
        ar: أتحدث العربية والإنجليزية.
        en: I speak Arabic and English.
      - text: Saya bisa bahasa Indonesia sedikit.
        ar_eg: بتكلم إندونيسي شوية.
        ar: أتحدث الإندونيسية قليلًا.
        en: I speak a little Indonesian.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «أنا مصري»؟
      ar: كيف تقول «أنا مصري»؟
      en: How do you say "I'm Egyptian"?
    options: [Saya orang Mesir., Saya Mesir., Saya bahasa Mesir.]
    answer: 0
    explain:
      ar_eg: «Saya Mesir» يعني «أنا مصر»، و«bahasa» للغة مش للجنسية.
      ar: «Saya Mesir» تعني «أنا مصر»، وbahasa للغة لا للجنسية.
      en: '"Saya Mesir" means "I am Egypt", and bahasa is for languages, not nationality.'
    words: [orang, Mesir]
  - id: e02
    type: fill_blank
    sentence: Saya bisa bahasa ___ dan bahasa Inggris.
    meaning:
      ar_eg: أنا بتكلم عربي وإنجليزي.
      ar: أتحدث العربية والإنجليزية.
      en: I speak Arabic and English.
    options: [Arab, orang, Mesir]
    answers: [Arab]
    explain:
      ar_eg: المصريين بيتكلموا bahasa Arab، مافيش «bahasa Mesir».
      ar: لغة المصريين bahasa Arab، ولا يقال «bahasa Mesir».
      en: Egyptians speak bahasa Arab; there's no "bahasa Mesir".
    words: [bahasa, Arab]
  - id: e03
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بتكلم إندونيسي شوية.
      ar: أتحدث الإندونيسية قليلًا.
      en: I speak a little Indonesian.
    answers: [Saya bisa bahasa Indonesia sedikit., Saya bisa bahasa Indonesia sedikit, Saya bisa sedikit bahasa Indonesia., Saya bisa sedikit bahasa Indonesia, Aku bisa bahasa Indonesia sedikit., Aku bisa sedikit bahasa Indonesia., Saya bisa berbahasa Indonesia sedikit., Saya bisa berbicara bahasa Indonesia sedikit.]
    words: [bisa, bahasa, sedikit]
  - id: e04
    type: speaking
    text: Saya orang Mesir. Saya bisa bahasa Arab dan bahasa Inggris.
    meaning:
      ar_eg: أنا مصري. بتكلم عربي وإنجليزي.
      ar: أنا مصري. أتحدث العربية والإنجليزية.
      en: I'm Egyptian. I speak Arabic and English.
    words: [orang, bahasa, bisa]
  - id: e05
    type: match_pairs
    pairs:
      - text: orang Mesir
        ar_eg: مصري
        ar: مصري
        en: Egyptian
      - text: bahasa Arab
        ar_eg: العربي
        ar: العربية
        en: Arabic
      - text: bahasa Inggris
        ar_eg: الإنجليزي
        ar: الإنجليزية
        en: English
      - text: sedikit
        ar_eg: شوية
        ar: قليلًا
        en: a little
    words: [orang, bahasa, sedikit]
  - id: e06
    type: listen
    text: Saya bisa bahasa Arab.
    options: ['Saya bisa bahasa Inggris.', 'Saya bisa bahasa Arab.', 'Saya bisa bahasa Indonesia.']
    answer: 1
    meaning:
      ar_eg: بعرف أتكلم عربي.
      ar: أتحدث العربية.
      en: I speak Arabic.
    words: [bisa, bahasa, Arab]
  - id: e07
    type: dictation
    text: Saya bisa bahasa Indonesia sedikit.
    meaning:
      ar_eg: بعرف إندونيسي شوية.
      ar: أتحدث الإندونيسية قليلًا.
      en: I speak a little Indonesian.
    words: [bisa, bahasa, Indonesia, sedikit]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kamu orang Mesir?
      ar_eg: محمد، إنت مصري؟
      ar: محمد، هل أنت مصري؟
      en: Mohamed, are you Egyptian?
    - speaker: Mohamed
      text: Ya, aku orang Mesir. Kamu orang Indonesia?
      ar_eg: أيوه، أنا مصري. وإنتي إندونيسية؟
      ar: نعم، أنا مصري. وهل أنتِ إندونيسية؟
      en: Yes, I'm Egyptian. Are you Indonesian?
    - speaker: Rina
      text: Ya! Kamu bisa bahasa Indonesia?
      ar_eg: أيوه! بتعرف تتكلم إندونيسي؟
      ar: نعم! هل تتحدث الإندونيسية؟
      en: Yes! Do you speak Indonesian?
    - speaker: Mohamed
      text: Sedikit. Aku bisa bahasa Arab dan bahasa Inggris.
      ar_eg: شوية. بتكلم عربي وإنجليزي.
      ar: قليلًا. أتحدث العربية والإنجليزية.
      en: A little. I speak Arabic and English.
