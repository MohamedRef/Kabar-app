schema: kabar.lesson/v1
id: bipa2.u03.l01
language: id
title: Beberapa dan banyak
can_do:
  ar_eg: تتكلم عن الكميات (كام، كتير، شوية، كل).
  ar: أن تتحدث عن الكميات.
  en: Talk about amounts.
slides:
  - title: Beberapa, banyak, sedikit
    body:
      ar_eg: |
        كلمات الكمية بتيجي قبل الاسم:
        - beberapa = كام / بعض: beberapa hari = كام يوم
        - banyak = كتير: banyak orang = ناس كتير
        - sedikit = شوية: sedikit gula = سكر شوية
        والمهم: متكررش الاسم بعدهم! banyak orang، مش banyak orang-orang.
        في الشارع بيقولوا:
        - aja = saja (بس، وخلاص)
        - gimana = bagaimana (إزاي، عامل إيه)
      ar: |
        ألفاظ الكم تسبق الاسم:
        - beberapa = بضعة / بعض: beberapa hari
        - banyak = كثير: banyak orang
        - sedikit = قليل: sedikit gula
        ولا يُكرَّر الاسم بعدها: banyak orang لا banyak orang-orang.
        في كلام الشارع:
        - aja = saja (فقط)
        - gimana = bagaimana (كيف)
      en: |
        Quantity words go before the noun:
        - beberapa = several, a few: beberapa hari
        - banyak = many, a lot of: banyak orang
        - sedikit = a little, few: sedikit gula
        No reduplication after them: banyak orang, not banyak orang-orang.
        On the street:
        - aja = saja (just, only)
        - gimana = bagaimana (how)
    grammar: id.quantifier.basic
    examples:
      - text: Beberapa pesawat berangkat pagi ini.
        ar_eg: كام طيارة طالعين الصبح ده.
        ar: تقلع عدة طائرات هذا الصباح.
        en: Several planes leave this morning.
      - text: Di bandara ada banyak orang.
        ar_eg: في المطار فيه ناس كتير.
        ar: في المطار أناس كثيرون.
        en: There are lots of people at the airport.
  - title: Semua, seluruh, setiap
    body:
      ar_eg: |
        تلات كلمات بمعنى «كل»:
        - semua = كل (المجموعة كلها): semua penumpang = كل الركاب
        - seluruh = الحاجة كلها على بعضها: seluruh Indonesia = إندونيسيا كلها
        - setiap / tiap = كل واحد لوحده: setiap hari = كل يوم
        زي العربي بالظبط: «كل يوم» (مفرد) = setiap، «كل الناس» (جمع) = semua.
      ar: |
        ثلاث كلمات بمعنى «كل»:
        - semua = جميع أفراد المجموعة: semua penumpang
        - seluruh = الشيء كله: seluruh Indonesia
        - setiap / tiap = كل فرد على حدة: setiap hari
        وكالعربية: «كل يوم» مع المفرد = setiap، و«كل الناس» = semua.
      en: |
        Three words for "all / every":
        - semua = all (members of a group): semua penumpang = all passengers
        - seluruh = the whole: seluruh Indonesia = all of Indonesia
        - setiap / tiap = every (each one): setiap hari = every day
        Just like Arabic كل: «كل يوم» (singular) = setiap; «كل الناس» = semua.
    grammar: id.quantifier.basic
    examples:
      - text: Semua orang suka nasi goreng.
        ar_eg: كل الناس بتحب الرز المقلي.
        ar: الجميع يحب الأرز المقلي.
        en: Everyone likes fried rice.
      - text: Setiap hari ada pesawat ke Kairo.
        ar_eg: كل يوم فيه طيارة للقاهرة.
        ar: كل يوم توجد طائرة إلى القاهرة.
        en: There's a plane to Cairo every day.
  - title: Para penumpang
    body:
      ar_eg: |
        para = «حضرات / السادة»، للناس بس، وبتسمعها كتير في الإعلانات:
        Para penumpang yang terhormat = حضرات الركاب الكرام.
        وعلى فكرة: penumpang (راكب) فيها peN- اللي اتعلمتها: tumpang (يركب مع) → penumpang.
      ar: |
        para = «السادة / حضرات»، للبشر خاصة، وتكثر في الإعلانات:
        Para penumpang yang terhormat = السادة الركاب الكرام.
        وpenumpang (راكب) فيها peN- التي تعلمتها: tumpang → penumpang.
      en: |
        para is a plural marker for people, like "dear …" — you hear it in announcements:
        Para penumpang yang terhormat = Dear passengers.
        And penumpang (passenger) has the peN- you learned: tumpang (ride along) → penumpang.
    grammar: id.quantifier.basic
    examples:
      - text: Para penumpang yang terhormat, selamat datang di Bali.
        ar_eg: حضرات الركاب الكرام، أهلًا بيكم في بالي.
        ar: السادة الركاب الكرام، مرحبًا بكم في بالي.
        en: Dear passengers, welcome to Bali.
  - title: Sedikit saja
    body:
      ar_eg: |
        saja بعد الكمية = «بس»: sedikit saja = شوية بس، satu saja = واحد بس.
        وBerapa banyak? = قد إيه؟
      ar: |
        saja بعد الكمية = «فقط»: sedikit saja = قليل فقط، satu saja = واحد فقط.
        وBerapa banyak؟ = كم الكمية؟
      en: |
        saja after an amount = "just, only": sedikit saja = just a little, satu saja = just one.
        Berapa banyak? = How much / how many?
    grammar: id.quantifier.basic
    examples:
      - text: Saya minta gula sedikit saja.
        ar_eg: سكر شوية بس لو سمحت.
        ar: قليل من السكر فقط من فضلك.
        en: Just a little sugar for me, please.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options: [Di bandara ada banyak orang., Di bandara ada orang banyak-banyak., Di bandara ada banyak orang-orang.]
    answer: 0
    explain:
      ar_eg: بعد banyak الاسم بيفضل مفرد من غير تكرار.
      ar: بعد banyak يبقى الاسم دون تكرار.
      en: After banyak the noun isn't reduplicated.
    words: [banyak, bandara]
  - id: e02
    type: listen
    text: Beberapa pesawat berangkat pagi ini.
    options: [Beberapa pesawat berangkat pagi ini., Seluruh pesawat berangkat pagi ini., Banyak pesawat berangkat pagi ini.]
    answer: 0
    words: [beberapa, pesawat, seluruh]
  - id: e03
    type: fill_blank
    sentence: ___ penumpang harus bawa paspor dan koper.
    meaning:
      ar_eg: كل الركاب لازم يجيبوا الباسبور والشنطة.
      ar: على جميع الركاب إحضار جواز السفر والحقيبة.
      en: All passengers must bring their passport and suitcase.
    options: [Setiap hari, Semua, Sedikit]
    answers: [Semua]
    words: [semua, penumpang, paspor, koper]
    explain:
      ar_eg: "semua + اسم = كل الـ…: semua penumpang = كل الركاب. setiap hari = كل يوم، وsedikit = شوية."
      ar: "semua + اسم = جميع: semua penumpang. أما setiap hari فـ«كل يوم» وsedikit «قليل»."
      en: "semua + noun = all the…: semua penumpang. setiap hari is \"every day\", sedikit is \"a little\"."
  - id: e04
    type: match_pairs
    pairs:
      - text: beberapa
        ar_eg: كام، بعض
        ar: بضعة
        en: several
      - text: seluruh
        ar_eg: كل (كله على بعضه)
        ar: كامل
        en: whole, entire
      - text: para
        ar_eg: حضرات (قبل الناس)
        ar: السادة
        en: (plural for people)
      - text: penumpang
        ar_eg: راكب
        ar: راكب
        en: passenger
      - text: bandara
        ar_eg: مطار
        ar: مطار
        en: airport
      - text: pesawat
        ar_eg: طيارة
        ar: طائرة
        en: plane
    words: [beberapa, seluruh, para, penumpang, bandara, pesawat]
  - id: e05
    type: listen
    text: Seluruh penumpang punya paspor dan koper.
    options: ['Seluruh penumpang punya paspor dan koper.', 'Beberapa penumpang punya paspor dan koper.', 'Para penumpang punya pesawat dan koper.']
    answer: 0
    meaning:
      ar_eg: كل الركاب معاهم باسبور وشنطة.
      ar: جميع الركاب لديهم جواز سفر وحقيبة.
      en: All the passengers have a passport and a suitcase.
    words: [seluruh, penumpang, paspor, koper, beberapa, para, pesawat]
  - id: e06
    type: speaking
    text: Para penumpang yang terhormat, selamat datang di Bandara Ngurah Rai, Bali.
    meaning:
      ar_eg: حضرات الركاب الكرام، أهلًا بيكم في مطار نجوراه راي، بالي.
      ar: السادة الركاب الكرام، مرحبًا بكم في مطار نجوراه راي، بالي.
      en: Dear passengers, welcome to Ngurah Rai Airport, Bali.
    words: [para, penumpang, bandara]
  - id: e07
    type: fill_blank
    sentence: Paspor saya di dalam ___.
    meaning:
      ar_eg: الباسبور بتاعي جوه الشنطة.
      ar: جواز سفري داخل الحقيبة.
      en: My passport is in the suitcase.
    options: [koper, pesawat, bandara]
    answers: [koper]
    words: [paspor, koper]
    explain:
      ar_eg: الباسبور بيبقى جوه koper (الشنطة). pesawat طيارة وbandara مطار، ودول أكبر من إن الباسبور يبقى «جواهم».
      ar: يكون الجواز داخل koper (الحقيبة). أما pesawat فطائرة وbandara مطار.
      en: The passport is inside the koper (suitcase). pesawat is the plane, bandara the airport.
dialogue:
  title: Tiba di Ngurah Rai
  lines:
    - speaker: Mas Rizal
      text: Mohamed! Selamat datang di Bali! Gimana perjalananmu?
      ar_eg: محمد! أهلًا بيك في بالي! الرحلة كانت عاملة إيه؟
      ar: محمد! أهلًا بك في بالي! كيف كانت الرحلة؟
      en: Mohamed! Welcome to Bali! How was the flight?
    - speaker: Mohamed
      text: Lumayan. Tapi beberapa penumpang sakit.
      ar_eg: مش بطالة. بس كام راكب تعبوا.
      ar: لا بأس بها، لكن بعض الركاب مرضوا.
      en: Not bad. But a few passengers got sick.
    - speaker: Mas Rizal
      text: Wah, kasihan. Kopernya berapa?
      ar_eg: يا حرام. معاك كام شنطة؟
      ar: يا للأسف. كم حقيبة معك؟
      en: Oh, poor things. How many suitcases do you have?
    - speaker: Mohamed
      text: Dua aja. Semua oleh-oleh dari Mesir ada di sini.
      ar_eg: اتنين بس. كل الهدايا اللي من مصر هنا.
      ar: اثنتان فقط. وكل الهدايا من مصر هنا.
      en: Just two. All the gifts from Egypt are in here.
    - speaker: Mas Rizal
      text: Bagus! Kita pergi sekarang. Di bandara ada banyak orang.
      ar_eg: حلو! نمشي دلوقتي. المطار فيه ناس كتير.
      ar: جيد! لنذهب الآن، ففي المطار أناس كثيرون.
      en: Great! Let's go now. There are lots of people at the airport.
