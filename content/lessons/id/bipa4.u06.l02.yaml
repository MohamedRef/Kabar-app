schema: kabar.lesson/v1
id: bipa4.u06.l02
language: id
title: Festival budaya Kaili
can_do:
  ar_eg: توصف مهرجان بتعبيرات ثابتة (يقيم مهرجان، يلفت الانتباه، يحافظ على التراث).
  ar: أن تصف مهرجانًا بتعابير متلازمة (يقيم مهرجانًا، يلفت الانتباه، يحافظ على التراث).
  en: Describe a festival with fixed word partners.
slides:
  - title: Mengadakan festival
    body:
      ar_eg: |
        «يعمل / يقيم مهرجان» = mengadakan festival (من ada). نفس الفعل مع acara (فعالية) وrapat (اجتماع).
        و«يلفت الانتباه» = menarik perhatian، نفس menarik بتاعة menarik wisatawan.
      ar: |
        «يقيم مهرجانًا» = mengadakan festival (من ada)، والفعل نفسه مع acara (فعالية) وrapat (اجتماع).
        و«يلفت الانتباه» = menarik perhatian، بالفعل نفسه في menarik wisatawan.
      en: |
        "Hold a festival" is mengadakan festival (from ada). The same verb goes with acara (event) and rapat (meeting).
        "Attract attention" is menarik perhatian, the same menarik as in menarik wisatawan.
    grammar: id.collocation
    examples:
      - text: Panitia mengadakan festival budaya setiap tahun.
        ar_eg: اللجنة بتعمل مهرجان ثقافي كل سنة.
        ar: تقيم اللجنة مهرجانًا ثقافيًا كل عام.
        en: The committee holds a cultural festival every year.
      - text: Pertunjukan tari Kaili menarik perhatian wisatawan.
        ar_eg: عرض رقص الكايلي بيلفت انتباه السياح.
        ar: يلفت عرض رقص الكايلي انتباه السياح.
        en: The Kaili dance performance attracts tourists' attention.
  - title: Melestarikan warisan budaya
    body:
      ar_eg: |
        «يحافظ على الثقافة / التراث» = melestarikan budaya / warisan budaya. (lestari = دايم ومحفوظ)
        warisan = تراث / ورث، من العربي «وارث». Kaili هي أكبر قبيلة في بالو.
      ar: |
        «يحافظ على الثقافة / التراث» = melestarikan budaya / warisan budaya (lestari = باقٍ محفوظ).
        warisan = تراث، من العربية «وارث». والكايلي أكبر جماعة عرقية في بالو.
      en: |
        "Preserve culture / heritage" is melestarikan budaya / warisan budaya (lestari = lasting, preserved).
        warisan (heritage, inheritance) comes from Arabic «وارث». The Kaili are Palu's largest ethnic group.
    grammar: id.collocation
    examples:
      - text: Festival ini melestarikan warisan budaya suku Kaili.
        ar_eg: المهرجان ده بيحافظ على تراث قبيلة الكايلي.
        ar: يحافظ هذا المهرجان على التراث الثقافي لقبيلة الكايلي.
        en: This festival preserves the cultural heritage of the Kaili people.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: panitia
        ar_eg: لجنة (المنظمين)
        ar: لجنة منظِّمة
        en: organising committee
      - text: pertunjukan
        ar_eg: عرض (فني)
        ar: عرض فني
        en: performance, show
      - text: warisan
        ar_eg: تراث / ورث
        ar: تراث، إرث
        en: heritage, inheritance
      - text: perhatian
        ar_eg: انتباه
        ar: انتباه
        en: attention
      - text: mengadakan
        ar_eg: يقيم / يعمل (فعالية)
        ar: يقيم (فعالية)
        en: to hold (an event)
    words: [panitia, pertunjukan, warisan, perhatian, mengadakan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي تعبير معناه «يقيم مهرجان»؟
      ar: أيّ تعبير يعني «يقيم مهرجانًا»؟
      en: Which phrase means "hold a festival"?
    options: [meningkatkan festival, mengambil festival, mengadakan festival]
    answer: 2
    words: [mengadakan]
  - id: e03
    type: listen
    text: Pertunjukan tari itu menarik perhatian wisatawan.
    options: ["Pertunjukan tari itu menarik perhatian wisatawan.", "Pertunjukan musik itu menarik perhatian wisatawan.", "Pertunjukan tari itu menarik perhatian warga."]
    answer: 0
    meaning:
      ar_eg: عرض الرقص ده لفت انتباه السياح.
      ar: لفت عرض الرقص ذلك انتباه السياح.
      en: That dance performance attracted the tourists' attention.
    words: [pertunjukan, perhatian]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «لازم نحافظ على الثقافة المحلية»؟
      ar: أيّ جملة تعني «يجب أن نحافظ على الثقافة المحلية»؟
      en: Which sentence means "We must preserve the local culture"?
    options: ["Kita harus meningkatkan budaya lokal.", "Kita harus melestarikan budaya lokal.", "Kita harus menarik budaya lokal."]
    answer: 1
    explain:
      ar_eg: budaya صاحبها melestarikan (يحافظ عليها). meningkatkan بيمشي مع pendapatan.
      ar: budaya تتلازم مع melestarikan (يحافظ)، أما meningkatkan فتتلازم مع pendapatan.
      en: budaya partners with melestarikan (preserve); meningkatkan goes with pendapatan.
    words: [melestarikan]
  - id: e05
    type: fill_blank
    sentence: Festival ini melestarikan ___ budaya suku Kaili.
    meaning:
      ar_eg: المهرجان ده بيحافظ على تراث قبيلة الكايلي.
      ar: يحافظ هذا المهرجان على التراث الثقافي لقبيلة الكايلي.
      en: This festival preserves the cultural heritage of the Kaili people.
    options: [pendapatan, warisan, perhatian]
    answers: [warisan]
    words: [warisan, melestarikan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: اللجنة بتعمل مهرجان ثقافي كل سنة.
      ar: تقيم اللجنة مهرجانًا ثقافيًا كل عام.
      en: The committee holds a cultural festival every year.
    answer: Panitia mengadakan festival budaya setiap tahun.
    distractors: [menarik, pertunjukan]
    words: [panitia, mengadakan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عرض الرقص لفت انتباه السياح.
      ar: لفت عرض الرقص انتباه السياح.
      en: The dance performance attracted the tourists' attention.
    answers:
      - Pertunjukan tari itu menarik perhatian wisatawan.
      - Pertunjukan tari itu menarik perhatian wisatawan
      - Pertunjukan tari menarik perhatian wisatawan.
      - Pertunjukan tarian itu menarik perhatian wisatawan.
      - Pertunjukan tari itu menarik perhatian para wisatawan.
      - Pertunjukan tarinya menarik perhatian wisatawan.
      - Pertunjukan tari itu menarik perhatian turis.
    words: [pertunjukan, perhatian]
  - id: e08
    type: dictation
    text: Panitia ingin melestarikan warisan budaya Kaili.
    meaning:
      ar_eg: اللجنة عايزة تحافظ على تراث الكايلي.
      ar: تريد اللجنة أن تحافظ على التراث الثقافي للكايلي.
      en: The committee wants to preserve Kaili cultural heritage.
    words: [panitia, melestarikan, warisan]
dialogue:
  title: Di festival budaya Kaili
  lines:
    - speaker: Mohamed
      text: Ramai sekali! Siapa yang mengadakan festival ini, Bu?
      ar_eg: زحمة أوي! مين اللي عامل المهرجان ده يا مدام؟
      ar: ما أكثر الناس! من يقيم هذا المهرجان يا سيدتي؟
      en: So lively! Who holds this festival, ma'am?
    - speaker: Bu Ratna
      text: Pemerintah kota bersama panitia dari warga Palu.
      ar_eg: حكومة المدينة مع لجنة من أهل بالو.
      ar: حكومة المدينة مع لجنة من سكان بالو.
      en: The city government together with a committee of Palu residents.
    - speaker: Mohamed
      text: Pertunjukan tarinya menarik perhatian banyak wisatawan.
      ar_eg: عرض الرقص لافت انتباه سياح كتير.
      ar: عرض الرقص يلفت انتباه كثير من السياح.
      en: The dance performance is drawing a lot of tourists' attention.
    - speaker: Bu Ratna
      text: Betul. Kami ingin melestarikan warisan budaya Kaili.
      ar_eg: مظبوط. إحنا عايزين نحافظ على تراث الكايلي.
      ar: صحيح. نريد أن نحافظ على التراث الثقافي للكايلي.
      en: That's right. We want to preserve Kaili cultural heritage.
