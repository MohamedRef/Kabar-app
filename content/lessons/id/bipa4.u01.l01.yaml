schema: kabar.lesson/v1
id: bipa4.u01.l01
language: id
title: Tertidur, tertinggal
can_do:
  ar_eg: تقول حاجة حصلت من غير قصد بـ ter-.
  ar: أن تعبّر عمّا حدث دون قصد بالسابقة ter-.
  en: Say what happened by accident with ter-.
slides:
  - title: ter- = من غير قصد
    body:
      ar_eg: |
        إنت عارف ter- بمعنى «الأكتر»: terbesar = الأكبر. هنا معنى جديد: ter- + فعل = الحاجة حصلت لوحدها، من غير ما تقصد.
        tidur (نام) → tertidur = غلبه النوم
        tinggal (فضل / ساب) → tertinggal = اتنسى / فضل ورا
        bawa (شال) → terbawa = اتشال بالغلط
        قارن: Saya tidur jam sepuluh (قاصد) — Saya tertidur di bus (غصب عني).
      ar: |
        عرفتَ ter- بمعنى التفضيل (terbesar). وهنا معنى جديد: ter- + الفعل = حدث الأمر من تلقاء نفسه دون قصد.
        tidur (نام) → tertidur = غلبه النوم
        tinggal (بقي / ترك) → tertinggal = نُسي وبقي خلفه
        bawa (حمل) → terbawa = حُمل خطأً
        قارن: Saya tidur jam sepuluh (عن قصد) وSaya tertidur di bus (دون قصد).
      en: |
        You know ter- as "the most" (terbesar). Here is a new meaning: ter- + verb = it just happened, without intention.
        tidur (sleep) → tertidur = dozed off
        tinggal (stay, leave) → tertinggal = got left behind
        bawa (carry) → terbawa = got taken by mistake
        Compare: Saya tidur jam sepuluh (on purpose) vs Saya tertidur di bus (couldn't help it).
    grammar: id.prefix.ter
    examples:
      - text: Karena terlalu lelah, perawat itu tertidur di kursinya.
        ar_eg: من كتر التعب، الممرضة نامت على الكرسي من غير ما تاخد بالها.
        ar: غلب النومُ الممرضةَ على كرسيها من شدة التعب.
        en: Too tired, the nurse dozed off in her chair.
      - text: Laptop saya tertinggal di kantor.
        ar_eg: اللابتوب بتاعي اتنسى في المكتب.
        ar: نسيتُ حاسوبي المحمول في المكتب.
        en: I left my laptop at the office (by accident).
  - title: Tidak sengaja
    body:
      ar_eg: |
        sengaja = قاصد / بالقصد. tidak sengaja = من غير قصد.
        بتيجي كتير مع ter- عشان تأكد إنك ما قصدتش، وتبقى اعتذار لطيف:
        Maaf, saya tidak sengaja. = آسف، ما كانش قصدي.
        وخلي بالك: terlalu (زيادة عن اللزوم) مش من ter-، دي كلمة لوحدها.
      ar: |
        sengaja = عمدًا، وtidak sengaja = دون قصد.
        تأتي كثيرًا مع ter- لتأكيد عدم القصد، وهي اعتذار مهذب:
        Maaf, saya tidak sengaja. = آسف، لم أقصد.
        وانتبه: terlalu (أكثر من اللازم) كلمة مستقلة وليست من ter-.
      en: |
        sengaja = on purpose; tidak sengaja = not on purpose.
        It often goes with ter- to stress that you didn't mean it, and makes a gentle apology:
        Maaf, saya tidak sengaja. = Sorry, I didn't mean to.
        Note: terlalu (too) is a separate word, not ter-.
    grammar: id.prefix.ter
    examples:
      - text: Maaf, kunci kantor terbawa ke rumah saya. Saya tidak sengaja.
        ar_eg: آسف، مفتاح المكتب اتشال معايا البيت. ما كانش قصدي.
        ar: آسف، حملتُ مفتاح المكتب إلى بيتي خطأً، لم أقصد.
        en: Sorry, I took the office key home by mistake. I didn't mean to.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tertidur
        ar_eg: غلبه النوم
        ar: غلبه النوم
        en: dozed off
      - text: tertinggal
        ar_eg: اتنسى / فضل ورا
        ar: نُسي وبقي خلفه
        en: left behind
      - text: terbawa
        ar_eg: اتشال بالغلط
        ar: حُمل خطأً
        en: taken by mistake
      - text: sengaja
        ar_eg: بالقصد
        ar: عمدًا
        en: on purpose
      - text: perawat
        ar_eg: ممرض / ممرضة
        ar: ممرض / ممرضة
        en: nurse
      - text: lembur
        ar_eg: يشتغل ساعات زيادة (أوفر تايم)
        ar: يعمل ساعات إضافية
        en: work overtime
    words: [tertidur, tertinggal, terbawa, sengaja, perawat, lembur]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «غلبني النوم في الأتوبيس» (من غير ما أقصد)؟
      ar: أيّ جملة تعني «غلبني النوم في الحافلة» (دون قصد)؟
      en: Which sentence means "I dozed off on the bus" (without meaning to)?
    options: ["Saya sengaja tidur di bus.", "Saya tertidur di bus.", "Saya terlalu tidur di bus."]
    answer: 1
    explain:
      ar_eg: tertidur = النوم غلبك. sengaja tidur = نمت بالقصد. وterlalu معناها «زيادة» ومش من ter-.
      ar: tertidur للنوم غير المقصود، وsengaja tidur للمقصود، وterlalu بمعنى «أكثر من اللازم» وليست من ter-.
      en: tertidur = sleep took over; sengaja tidur = slept on purpose; terlalu means "too" and isn't ter-.
    words: [tertidur, sengaja]
  - id: e03
    type: listen
    text: Maaf, kunci kantor terbawa ke rumah saya.
    options: ["Maaf, kunci kantor terbawa ke rumah saya.", "Maaf, kunci kantor tertinggal di rumah saya.", "Maaf, kunci kantor dibawa ke rumah saya."]
    answer: 0
    meaning:
      ar_eg: آسف، مفتاح المكتب اتشال معايا البيت بالغلط.
      ar: آسف، حملتُ مفتاح المكتب إلى بيتي خطأً.
      en: Sorry, the office key got taken to my house by mistake.
    words: [terbawa]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: كاك نورول ممرضة وفضلت في المستشفى لحد نص الليل بعد ما الشيفت بتاعها خلص. هي …
      ar: نورول ممرضة بقيت في المستشفى حتى منتصف الليل بعد انتهاء نوبتها. إنها …
      en: Kak Nurul is a nurse who stayed at the hospital until midnight after her shift ended. She …
    options: ["tertidur", "terbawa", "lembur"]
    answer: 2
    explain:
      ar_eg: lembur = تشتغل وقت زيادة بعد معاد الشغل.
      ar: lembur = العمل ساعات إضافية بعد الدوام.
      en: lembur = to work overtime, past normal hours.
    words: [lembur, perawat]
  - id: e05
    type: fill_blank
    sentence: Payung saya ___ di pete-pete. Saya lupa mengambilnya.
    meaning:
      ar_eg: الشمسية بتاعتي اتنسيت في الميكروباص (البيتي بيتي). نسيت آخدها.
      ar: نسيتُ مظلتي في الحافلة الصغيرة (بيتي بيتي)، فلم آخذها.
      en: My umbrella got left on the minibus (pete-pete). I forgot to take it.
    options: [tertinggal, terbawa, tertidur]
    answers: [tertinggal]
    explain:
      ar_eg: الحاجة فضلت «في» مكان = tertinggal di. terbawa بتيجي مع ke (اتشالت «لـ» مكان).
      ar: ما بقي في مكان = tertinggal di، أما terbawa فتأتي مع ke.
      en: Something left in a place = tertinggal di; terbawa goes with ke (carried to a place).
    words: [tertinggal]
  - id: e06
    type: fill_blank
    sentence: Maaf, Bu, kunci lemari obat ___ ke rumah saya.
    meaning:
      ar_eg: آسف يا مدام، مفتاح دولاب الأدوية اتشال معايا البيت بالغلط.
      ar: آسف يا سيدتي، حملتُ مفتاح خزانة الأدوية إلى بيتي خطأً.
      en: Sorry, ma'am, the key to the medicine cabinet got taken to my house by mistake.
    options: [tertinggal, terbawa, tertidur]
    answers: [terbawa]
    words: [terbawa]
  - id: e07
    type: build_sentence
    source:
      ar_eg: نمت في المكتب من غير قصد.
      ar: غلبني النوم في المكتب دون قصد.
      en: I didn't mean to fall asleep at the office.
    answer: Saya tidak sengaja tertidur di kantor.
    distractors: [tidur, terlalu]
    words: [sengaja, tertidur]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الموبايل بتاعي اتنسى في المستشفى.
      ar: نسيتُ هاتفي في المستشفى.
      en: My phone got left behind at the hospital.
    answers:
      - Ponsel saya tertinggal di rumah sakit.
      - Ponsel saya tertinggal di rumah sakit
      - HP saya tertinggal di rumah sakit.
      - HP saya tertinggal di rumah sakit
      - Ponselku tertinggal di rumah sakit.
      - HP-ku tertinggal di rumah sakit.
      - Telepon saya tertinggal di rumah sakit.
    words: [tertinggal]
  - id: e09
    type: speaking
    text: Perawat itu lembur lagi, jadi dia tertidur di pete-pete.
    meaning:
      ar_eg: الممرضة دي اشتغلت وقت زيادة تاني، فنامت في الميكروباص من غير ما تاخد بالها.
      ar: عملت الممرضة ساعات إضافية مرة أخرى، فغلبها النوم في الحافلة.
      en: That nurse worked overtime again, so she dozed off on the minibus.
    words: [perawat, lembur, tertidur]
dialogue:
  title: Kopi pagi di Pantai Losari
  lines:
    - speaker: Mohamed
      text: Kak Nurul, kenapa kelihatan capek sekali?
      ar_eg: يا كاك نورول، شكلك تعبان أوي ليه؟
      ar: يا نورول، لماذا تبدين متعبة جدًا؟
      en: Kak Nurul, why do you look so tired?
    - speaker: Nurul
      text: Semalam saya lembur di rumah sakit. Tadi saya tertidur di pete-pete!
      ar_eg: امبارح اشتغلت وقت زيادة في المستشفى. والنهارده النوم غلبني في الميكروباص!
      ar: عملت ساعات إضافية في المستشفى ليلة أمس، وغلبني النوم اليوم في الحافلة!
      en: I worked overtime at the hospital last night. Just now I dozed off on the minibus!
    - speaker: Mohamed
      text: Wah! Barang-barangmu aman?
      ar_eg: يا خبر! حاجتك سليمة؟
      ar: يا للهول! هل أغراضك سالمة؟
      en: Oh no! Is your stuff OK?
    - speaker: Nurul
      text: Aman, tapi payung saya tertinggal di rumah sakit.
      ar_eg: سليمة، بس الشمسية بتاعتي اتنسيت في المستشفى.
      ar: سالمة، لكنني نسيت مظلتي في المستشفى.
      en: Yes, but my umbrella got left at the hospital.
    - speaker: Mohamed
      text: Jadi perawat memang berat, ya.
      ar_eg: شغلانة الممرضة صعبة فعلًا.
      ar: مهنة التمريض شاقة حقًا.
      en: Being a nurse really is hard work.
    - speaker: Nurul
      text: Iya. Oh, maaf, pulpenmu terbawa ke rumah saya. Saya tidak sengaja!
      ar_eg: أيوه. آه، آسفة، قلمك اتشال معايا البيت. ما كانش قصدي!
      ar: نعم. آه، آسفة، حملتُ قلمك إلى بيتي خطأً، لم أقصد!
      en: Yes. Oh, sorry, your pen ended up at my place. I didn't mean to!
