schema: kabar.lesson/v1
id: bipa4.u04.l08
language: id
title: Situasi dan tindakan
can_do:
  ar_eg: تقرا خبر وتفهم الموقف، مين متورط، وإيه اللي اتعمل.
  ar: أن تقرأ خبرًا وتفهم الموقف والمتورطين والإجراءات المتخذة.
  en: Read a news story and follow the situation, who is involved and what action was taken.
slides:
  - title: Bahasa berita
    body:
      ar_eg: |
        media = إعلام (media sosial = سوشيال ميديا)، jaringan = شبكة (jaringan internet).
        situasi = موقف، وضع، tindakan = إجراء أو تصرّف (mengambil tindakan = ياخد إجراء).
        terlibat = متورّط أو مشارك (terlibat dalam = متورّط في)، terhadap = تجاه، على (dampak terhadap = تأثير على).
        kemungkinan = احتمال، menyebut = يذكر أو يسمّي، disebut = اتذكر، اسمه.
      ar: |
        media = الإعلام (media sosial = وسائل التواصل)، jaringan = الشبكة (jaringan internet).
        situasi = الموقف أو الوضع، tindakan = الإجراء أو التصرف (mengambil tindakan = يتخذ إجراءً).
        terlibat = متورّط أو مشارك (terlibat dalam)، terhadap = تجاه، على (dampak terhadap = أثر على).
        kemungkinan = الاحتمال، menyebut = يذكر أو يسمّي، disebut = يُذكر، يُسمّى.
      en: |
        media = media (media sosial = social media), jaringan = network (jaringan internet).
        situasi = situation, tindakan = action, step (mengambil tindakan = take action).
        terlibat = involved (terlibat dalam = involved in), terhadap = towards, on (dampak terhadap = impact on).
        kemungkinan = possibility, chance, menyebut = to mention, name, disebut = is called, is mentioned.
    examples:
      - text: Berita itu cepat tersebar di media sosial.
        ar_eg: الخبر ده انتشر بسرعة على السوشيال ميديا.
        ar: انتشر ذلك الخبر بسرعة على وسائل التواصل.
        en: That story spread fast on social media.
      - text: Polisi mengambil tindakan terhadap pengemudi itu.
        ar_eg: البوليس اتخذ إجراء ضد السواق ده.
        ar: اتخذت الشرطة إجراءً بحق ذلك السائق.
        en: The police took action against that driver.
      - text: Ada kemungkinan hujan deras besok.
        ar_eg: فيه احتمال مطر جامد بكرة.
        ar: هناك احتمال لمطر غزير غدًا.
        en: There's a chance of heavy rain tomorrow.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: media
        ar_eg: إعلام
        ar: إعلام
        en: media
      - text: jaringan
        ar_eg: شبكة
        ar: شبكة
        en: network
      - text: situasi
        ar_eg: موقف، وضع
        ar: وضع
        en: situation
      - text: tindakan
        ar_eg: إجراء
        ar: إجراء
        en: action
    words: [media, jaringan, situasi, tindakan]
  - id: e02
    type: match_pairs
    pairs:
      - text: terlibat
        ar_eg: متورّط
        ar: متورّط
        en: involved
      - text: terhadap
        ar_eg: تجاه، على
        ar: تجاه
        en: towards, on
      - text: kemungkinan
        ar_eg: احتمال
        ar: احتمال
        en: possibility
      - text: disebut
        ar_eg: اسمه، اتذكر
        ar: يُسمّى
        en: is called
    words: [terlibat, terhadap, kemungkinan, disebut]
  - id: e03
    type: listen
    text: Jaringan internet di kota mati sejak pagi.
    question:
      ar_eg: إيه اللي واقع؟
      ar: ما المعطّل؟
      en: What's down?
    options: [الإنترنت, الكهربا, المية]
    answer: 0
    meaning:
      ar_eg: شبكة الإنترنت في المدينة واقعة من الصبح.
      ar: شبكة الإنترنت في المدينة معطّلة منذ الصباح.
      en: The internet network in the city has been down since morning.
    words: [jaringan]
  - id: e04
    type: fill_blank
    sentence: Situasi di pasar sudah aman. Polisi tidak perlu mengambil ___.
    meaning:
      ar_eg: الوضع في السوق بقى أمان. البوليس مش محتاج ياخد ___.
      ar: صار الوضع في السوق آمنًا، فلا حاجة لأن تتخذ الشرطة ___.
      en: The situation at the market is safe now. The police don't need to take ___.
    options: [tindakan, jaringan, media]
    answers: [tindakan]
    words: [tindakan, situasi, jaringan, media]
    explain:
      ar_eg: mengambil tindakan = ياخد إجراء. jaringan = شبكة، وmedia = إعلام.
      ar: mengambil tindakan = يتخذ إجراءً. أما jaringan فشبكة، وmedia إعلام.
      en: mengambil tindakan means to take action. jaringan is a network and media is the media.
  - id: e05
    type: multiple_choice
    question: Tiga pejabat ___ dalam kasus korupsi itu.
    options: [terlibat, terhadap, disebut]
    answer: 0
    explain:
      ar_eg: terlibat dalam = متورّط في. terhadap = تجاه، وdisebut = اسمه.
      ar: terlibat dalam = متورّط في. أما terhadap فتجاه، وdisebut يُسمّى.
      en: terlibat dalam means involved in. terhadap means towards, and disebut means is called.
    words: [terlibat, terhadap, disebut]
  - id: e06
    type: fill_blank
    sentence: Banjir itu punya dampak besar ___ pedagang kecil.
    meaning:
      ar_eg: الفيضان ده كان ليه تأثير كبير ___ التجار الصغيرين.
      ar: كان لذلك الفيضان أثر كبير ___ صغار التجار.
      en: The flood had a big impact ___ small traders.
    options: [terhadap, terlibat, kemungkinan]
    answers: [terhadap]
    words: [terhadap, terlibat, kemungkinan]
    explain:
      ar_eg: dampak terhadap = تأثير على. terlibat = متورط، وkemungkinan = احتمال، ومايجوش بعد dampak.
      ar: dampak terhadap = أثر على. أما terlibat فمتورّط، وkemungkinan احتمال، ولا يأتيان بعد dampak.
      en: dampak terhadap means an impact on. terlibat is involved and kemungkinan is a chance; neither follows dampak.
  - id: e07
    type: multiple_choice
    question: Wartawan itu tidak mau ___ nama narasumbernya.
    options: [menyebut, terlibat, situasi]
    answer: 0
    explain:
      ar_eg: menyebut = يذكر اسم. terlibat = متورّط، وsituasi = وضع.
      ar: menyebut = يذكر الاسم. أما terlibat فمتورّط، وsituasi الوضع.
      en: menyebut means to name or mention. terlibat is involved, and situasi is a situation.
    words: [menyebut, terlibat, situasi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: فيه احتمال إن الطريق يتقفل بكرة.
      ar: هناك احتمال أن يُغلق الطريق غدًا.
      en: There's a chance the road will be closed tomorrow.
    answer: Ada kemungkinan jalan itu ditutup besok.
    distractors: [situasi, media]
    words: [kemungkinan, situasi, media]
    explain:
      ar_eg: ada kemungkinan = فيه احتمال. situasi = موقف، وmedia = إعلام، ومالهمش مكان هنا.
      ar: ada kemungkinan = هناك احتمال. أما situasi فوضع، وmedia إعلام، ولا مكان لهما هنا.
      en: ada kemungkinan means there's a chance. situasi is a situation and media is the media; they don't belong here.
  - id: e09
    type: translate
    direction: from_target
    source_text: Pasar tua itu disebut jantung kota.
    answers_meaning:
      ar_eg: [السوق القديم ده بيسمّوه قلب المدينة, السوق القديم ده اسمه قلب المدينة]
      ar: [يُسمّى ذلك السوق القديم قلب المدينة, يُطلق على ذلك السوق القديم قلب المدينة]
      en: [That old market is called the heart of the city, 'The old market is known as the city''s heart']
    words: [disebut]
  - id: e10
    type: speaking
    text: Media melaporkan situasi banjir setiap jam.
    meaning:
      ar_eg: الإعلام بيبلّغ عن وضع الفيضان كل ساعة.
      ar: تنقل وسائل الإعلام وضع الفيضان كل ساعة.
      en: The media report on the flood situation every hour.
    words: [media, situasi, jaringan, tindakan]
dialogue:
  lines:
    - speaker: Kak Nirmala
      text: Mohamed, kamu sudah lihat berita di media sosial?
      ar_eg: يا محمد، شفت الخبر على السوشيال ميديا؟
      ar: يا محمد، هل رأيت الخبر على وسائل التواصل؟
      en: Mohamed, have you seen the news on social media?
    - speaker: Mohamed
      text: Belum, Kak. Jaringan internet di rumah mati.
      ar_eg: لسه. الإنترنت في البيت واقع.
      ar: لم أره بعد، فالإنترنت في البيت معطّل.
      en: Not yet. The internet at home is down.
    - speaker: Kak Nirmala
      text: Ada kebakaran di pasar. Situasinya sudah aman sekarang.
      ar_eg: فيه حريقة في السوق. الوضع بقى أمان دلوقتي.
      ar: شبّ حريق في السوق، والوضع آمن الآن.
      en: There was a fire at the market. It's safe now.
    - speaker: Mohamed
      text: Ada orang yang terlibat?
      ar_eg: فيه حد متورّط؟
      ar: هل هناك متورّطون؟
      en: Is anyone involved?
    - speaker: Kak Nirmala
      text: Polisi menyebut ada kemungkinan kabel listrik yang rusak. Mereka sudah mengambil tindakan.
      ar_eg: البوليس قال إن فيه احتمال سلك كهربا بايظ. وخدوا إجراء خلاص.
      ar: ذكرت الشرطة احتمال وجود سلك كهربائي تالف، وقد اتخذت إجراءً.
      en: The police mentioned a possible faulty power cable. They've already taken action.
