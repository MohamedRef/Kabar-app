schema: kabar.lesson/v1
id: bipa1.u04.l11
language: id
title: Kue, lilin, kado
can_do:
  ar_eg: 'تتكلم عن حفلة عيد ميلاد: التورتة والشمع والهدايا والورد والصحاب.'
  ar: 'أن تتحدث عن حفلة عيد ميلاد: الكعكة والشموع والهدايا والزهور والأصدقاء.'
  en: 'Talk about a birthday party: cake, candles, presents, flowers and friends.'
slides:
  - title: Pesta ulang tahun
    body:
      ar_eg: |
        في الحفلة: kue (كيكة أو تورتة) عليها lilin (شمع)، وkado (هدية، أخف من hadiah)، وkartu (كارت)، وbunga (ورد).
        lagu = أغنية. الإندونيسيين بيغنوا «Selamat ulang tahun» وكمان «Panjang umurnya»: «يطوّل عمره».
        kawan = صاحب (كلمة أقدم شوية من teman). وsahabat = صاحب قريب جدًا، وأصلها من العربي «صاحب».
      ar: |
        في الحفلة: kue (كعكة) عليها lilin (شموع)، وkado (هدية، أخفّ من hadiah)، وkartu (بطاقة)، وbunga (زهور).
        lagu = أغنية. يغنّي الإندونيسيون «Selamat ulang tahun» و«Panjang umurnya» أي «أطال الله عمره».
        kawan = صديق (أقدم قليلًا من teman)، وsahabat = الصديق المقرّب، وأصلها العربية «صاحب».
      en: |
        At the party: a kue (cake) with lilin (candles), a kado (present, more casual than hadiah), a kartu (card) and bunga (flowers).
        lagu = song. Indonesians sing "Selamat ulang tahun" and "Panjang umurnya" ("long may they live").
        kawan = friend (a little older-fashioned than teman). sahabat = a close friend, from Arabic صاحب.
    examples:
      - text: Kuenya besar! Lilinnya tujuh.
        ar_eg: التورتة كبيرة! والشمع ٧.
        ar: الكعكة كبيرة! وعليها سبع شموع.
        en: The cake is big! There are seven candles.
      - text: Rina beli kado dan kartu. Sahabatnya ulang tahun.
        ar_eg: رينا اشترت هدية وكارت. النهارده عيد ميلاد صاحبتها الأنتيم.
        ar: اشترت رينا هدية وبطاقة، فاليوم عيد ميلاد صديقتها المقرّبة.
        en: Rina bought a present and a card. It's her best friend's birthday.
      - text: Kawan-kawan saya datang ke pesta ulang tahun saya.
        ar_eg: صحابي جم حفلة عيد ميلادي.
        ar: جاء أصدقائي إلى حفلة عيد ميلادي.
        en: My friends came to my birthday party.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kue
        ar_eg: كيكة، تورتة
        ar: كعكة
        en: cake
      - text: kado
        ar_eg: هدية
        ar: هدية
        en: present
      - text: lilin
        ar_eg: شمع
        ar: شمعة
        en: candle
      - text: kartu
        ar_eg: كارت
        ar: بطاقة
        en: card
    words: [kue, kado, lilin, kartu]
  - id: e02
    type: match_pairs
    pairs:
      - text: lagu
        ar_eg: أغنية
        ar: أغنية
        en: song
      - text: bunga
        ar_eg: ورد
        ar: زهرة
        en: flower
      - text: kawan
        ar_eg: صاحب
        ar: صديق
        en: friend
      - text: sahabat
        ar_eg: صاحب أنتيم
        ar: صديق مقرّب
        en: close friend
    words: [lagu, bunga, kawan, sahabat]
  - id: e03
    type: listen
    text: Rina beli kue dan lilin di toko.
    question:
      ar_eg: رينا اشترت إيه؟
      ar: ماذا اشترت رينا؟
      en: What did Rina buy?
    options: [تورتة وشمع, ورد وكارت, هدية وكارت]
    answer: 0
    meaning:
      ar_eg: رينا اشترت تورتة وشمع من المحل.
      ar: اشترت رينا كعكة وشموعًا من المتجر.
      en: Rina bought a cake and candles at the shop.
    words: [kue, lilin]
  - id: e04
    type: fill_blank
    sentence: Selamat ulang tahun! Ini ___ dari saya.
    meaning:
      ar_eg: كل سنة وإنت طيب! دي ___ مني.
      ar: عيد ميلاد سعيد! هذه ___ مني.
      en: Happy birthday! This ___ is from me.
    options: [kado, lilin, lagu]
    answers: [kado]
    words: [kado]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تكتب «كل سنة وإنت طيب» على ورقة صغيرة حلوة. تشتري…؟
      ar: تريد أن تكتب «عيد ميلاد سعيد» على ورقة صغيرة جميلة. ماذا تشتري؟
      en: You want to write "happy birthday" on a nice little piece of paper. What do you buy?
    options: [kartu, kue, lagu]
    answer: 0
    explain:
      ar_eg: kartu = كارت. kue تتاكل، وlagu تتغنّى.
      ar: kartu بطاقة، أما kue فتؤكل وlagu تُغنّى.
      en: kartu is a card; you eat a kue and sing a lagu.
    words: [kartu, kue, lagu]
  - id: e06
    type: fill_blank
    sentence: Rina ___ saya, dari kecil.
    meaning:
      ar_eg: رينا ___ ـتي من وإحنا صغيرين.
      ar: رينا ___ ـتي منذ الصغر.
      en: Rina has been my ___ since we were little.
    options: [sahabat, bunga, kartu]
    answers: [sahabat]
    words: [sahabat]
  - id: e07
    type: build_sentence
    source:
      ar_eg: صاحبي اشترى ورد وكارت.
      ar: اشترى صديقي زهورًا وبطاقة.
      en: My friend bought flowers and a card.
    answer: Kawan saya beli bunga dan kartu.
    distractors: [kue, lagu]
    words: [kawan, bunga]
  - id: e08
    type: translate
    direction: from_target
    source_text: Sahabat saya beli kado dan kartu.
    answers_meaning:
      ar_eg: [صاحبي اشترى هدية وكارت, صاحبتي اشترت هدية وكارت, صاحبي الأنتيم اشترى هدية وكارت]
      ar: [اشترى صديقي المقرّب هدية وبطاقة, اشترت صديقتي المقرّبة هدية وبطاقة, صديقي اشترى هدية وبطاقة]
      en: [My best friend bought a present and a card, My close friend bought a gift and a card]
    words: [sahabat, kado, kartu]
  - id: e09
    type: speaking
    text: Wah, kado dan bunga! Terima kasih!
    meaning:
      ar_eg: شكرًا على الهدية والورد!
      ar: شكرًا على الهدية والزهور!
      en: Thanks for the present and the flowers!
    words: [kado, bunga]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «صاحب» زي teman؟
      ar: أيّ كلمة تعني «صديق» مثل teman؟
      en: Which word means "friend", like teman?
    options: [kawan, lagu, lilin]
    answer: 0
    explain:
      ar_eg: kawan = teman. lagu أغنية وlilin شمعة.
      ar: kawan بمعنى teman، أما lagu فأغنية وlilin شمعة.
      en: kawan = teman; lagu is a song and lilin a candle.
    words: [kawan, lagu, lilin]
dialogue:
  lines:
    - speaker: Rina
      text: Selamat ulang tahun, Ni Luh! Ini kado dari saya.
      ar_eg: كل سنة وإنتي طيبة يا ني لوه! دي هدية عشانك.
      ar: عيد ميلاد سعيد يا ني لوه! هذه هدية لك.
      en: Happy birthday, Ni Luh! This present is for you.
    - speaker: Ni Luh
      text: Terima kasih, Rina! Kartunya lucu!
      ar_eg: شكرًا يا رينا! الكارت عسول!
      ar: شكرًا يا رينا! البطاقة لطيفة!
      en: Thank you, Rina! The card is cute!
    - speaker: Mohamed
      text: Dan ini kue dari saya.
      ar_eg: ودي التورتة مني.
      ar: وهذه الكعكة منّي.
      en: And this cake is from me.
    - speaker: Ni Luh
      text: Kuenya besar! Terima kasih, Mohamed.
      ar_eg: التورتة كبيرة! شكرًا يا محمد.
      ar: الكعكة كبيرة! شكرًا يا محمد.
      en: The cake is big! Thank you, Mohamed.
    - speaker: Rina
      text: Sekarang lilinnya!
      ar_eg: يلّا الشمع دلوقتي!
      ar: والآن الشموع!
      en: Now the candles!
    - speaker: Ni Luh
      text: Kawan-kawan, terima kasih! Kalian sahabat saya.
      ar_eg: يا جماعة، شكرًا! إنتو صحابي الأنتيم.
      ar: يا أصدقاء، شكرًا! أنتم أصدقائي المقرّبون.
      en: Friends, thank you! You're my best friends.
