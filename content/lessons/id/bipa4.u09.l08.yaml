      ar_eg: فلوس رسم الدخول بتتصرف على إيه؟
      ar: فيمَ تُستخدم أموال رسم الدخول؟
      en: What is the entrance-fee money used for?
    options:
      - Membangun hotel baru
      - Menjaga kawasan dan menyelamatkan terumbu karang
      - Membeli perahu untuk nelayan
    answer: 1
    words: [dana, kawasan, menyelamatkan]
