dialogue:
  title: Sebelum menyelam
  lines:
    - speaker: Kak Steven
      text: Udah baca papan pengumuman di pelabuhan?
      ar_eg: قريت اللافتة اللي في المينا؟
      ar: هل قرأت لوحة الإعلانات في الميناء؟
      en: Have you read the notice board at the harbour?
    - speaker: Mohamed
      text: Udah. Aku nggak boleh pegang karang, ya?
      ar_eg: قريتها. ممنوع ألمس المرجان، صح؟
      ar: نعم. لا يجوز لي لمس المرجان، أليس كذلك؟
      en: Yes. I mustn't touch the coral, right?
    - speaker: Kak Steven
      text: Bener. Karang gampang rusak dan tumbuhnya lambat banget.
      ar_eg: مظبوط. المرجان بيتكسر بسهولة وبيكبر ببطء جدًا.
      ar: صحيح. المرجان سريع التلف وينمو ببطء شديد.
      en: Right. Coral is easily damaged and grows very slowly.
    - speaker: Mohamed
      text: Oke, Kak. Ini biaya masukku.
      ar_eg: حاضر. اتفضل رسم الدخول بتاعي.
      ar: حسنًا. تفضّل رسم دخولي.
      en: All right. Here's my entrance fee.
    - speaker: Kak Steven
      text: Makasih. Dana ini buat menjaga kawasan Bunaken.
      ar_eg: شكرًا. الفلوس دي لحماية منطقة بوناكين.
      ar: شكرًا. هذه الأموال لحماية منطقة بوناكين.
      en: Thank you. This money goes to protecting the Bunaken area.
