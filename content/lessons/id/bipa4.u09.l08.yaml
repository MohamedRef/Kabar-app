language: id
title: Papan pengumuman
can_do:
  ar_eg: تقرا لافتة القواعد في محمية بحرية وتعرف المسموح والممنوع.
  ar: أن تقرأ لوحة القواعد في محمية بحرية وتعرف المسموح والممنوع.
  en: Read the rules board at a marine park and tell what is allowed and what is not.
slides:
  - title: Papan di pelabuhan Bunaken
    body:
      ar_eg: |
        اللافتة دي في مينا جزيرة بوناكين، قبل ما الغطّاسين ينزلوا البحر.
        Dilarang + فعل = ممنوع. wajib + فعل = لازم / إجباري.
      ar: |
        هذه اللوحة في ميناء جزيرة بوناكين، قبل أن ينزل الغوّاصون إلى البحر.
        Dilarang + فعل = ممنوع، وwajib + فعل = واجب / إلزامي.
      en: |
        This board stands at the Bunaken harbour, before divers go into the sea.
        Dilarang + verb = it is forbidden to; wajib + verb = must.
    examples:
      - text: Selamat datang di Taman Nasional Bunaken. Setiap penyelam wajib membayar biaya masuk.
        ar_eg: أهلًا بيكم في محمية بوناكين الوطنية. كل غطّاس لازم يدفع رسم الدخول.
        ar: مرحبًا بكم في متنزّه بوناكين الوطني. على كل غوّاص دفع رسم الدخول.
        en: Welcome to Bunaken National Park. Every diver must pay the entrance fee.
      - text: Dilarang memegang karang, memberi makan ikan, dan membuang sampah ke laut.
        ar_eg: ممنوع تلمس المرجان، أو تأكّل السمك، أو ترمي زبالة في البحر.
        ar: يُمنع لمس المرجان وإطعام الأسماك ورمي القمامة في البحر.
        en: It is forbidden to touch the coral, feed the fish, or throw rubbish into the sea.
      - text: Dana dari biaya masuk digunakan untuk menjaga kawasan ini dan menyelamatkan terumbu karang.
        ar_eg: الفلوس اللي بتتجمع من رسم الدخول بتتصرف على حماية المنطقة دي وإنقاذ الشعاب المرجانية.
        ar: تُستخدم أموال رسوم الدخول لحماية هذه المنطقة وإنقاذ الشعاب المرجانية.
        en: The money from entrance fees is used to protect this area and save the coral reefs.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: مين لازم يدفع رسم الدخول؟
      ar: من يجب عليه دفع رسم الدخول؟
      en: Who must pay the entrance fee?
    options: [Semua nelayan, Setiap penyelam, Hanya anak-anak]
    answer: 1
    words: [penyelam, wajib]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي حاجة من دول ممنوعة في المحمية؟
      ar: أيّ هذه الأمور ممنوع في المحمية؟
      en: Which of these is forbidden in the park?
    options: [Berenang, Mengambil foto ikan, Memegang karang]
    answer: 2
  - id: e03
    type: multiple_choice
