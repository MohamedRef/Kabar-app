schema: kabar.lesson/v1
id: bipa4.u10.l10
language: id
title: Pidato singkat
can_do:
  ar_eg: تقول خطبة قصيرة (حوالي دقيقتين) في مهرجان، من التحية للختام.
  ar: أن تلقي خطابًا قصيرًا (نحو دقيقتين) في مهرجان، من التحية إلى الختام.
  en: Give a short (about two-minute) speech at a festival, from greeting to closing.
slides:
  - title: Pidato di festival bunga
    body:
      ar_eg: |
        خطبتك في مهرجان الورد في توموهون:
        1) Yang terhormat … , hadirin yang berbahagia.
        2) Puji syukur … ← Pada kesempatan ini, saya mewakili … (mewakili = بيمثّل، من wakil ← العربي «وكيل»).
        3) حاجة شخصية، وممكن تعبير زي buah tangan.
        4) أمنية: Semoga persahabatan … (persahabatan = الصداقة) ← Akhir kata, terima kasih.
      ar: |
        خطابك في مهرجان الزهور في توموهون:
        1) Yang terhormat … , hadirin yang berbahagia.
        2) Puji syukur … ← Pada kesempatan ini, saya mewakili … (mewakili = يمثّل، من wakil ← العربية «وكيل»).
        3) لمسة شخصية، ويمكن أن تستعمل تعبيرًا مثل buah tangan.
        4) أمنية: Semoga persahabatan … (persahabatan = الصداقة) ← Akhir kata, terima kasih.
      en: |
        Your speech at the Tomohon flower festival:
        1) Yang terhormat … , hadirin yang berbahagia.
        2) Puji syukur … → Pada kesempatan ini, saya mewakili … (mewakili = represent, from wakil ← Arabic «وكيل»).
        3) A personal touch, maybe an idiom like buah tangan.
        4) A wish: Semoga persahabatan … (persahabatan = friendship) → Akhir kata, terima kasih.
    grammar: id.idiom.basic
    examples:
      - text: Saya berdiri di sini mewakili teman-teman dari Mesir.
        ar_eg: أنا واقف هنا بمثّل صحابي من مصر.
        ar: أقف هنا ممثّلًا أصدقائي من مصر.
        en: I stand here representing my friends from Egypt.
      - text: Semoga persahabatan Indonesia dan Mesir semakin kuat.
        ar_eg: يا رب الصداقة بين إندونيسيا ومصر تقوى أكتر.
        ar: نرجو أن تزداد الصداقة بين إندونيسيا ومصر قوة.
        en: May the friendship between Indonesia and Egypt grow ever stronger.
exercises:
  - id: e01
    type: listen
    text: Saya berdiri di sini mewakili teman-teman dari Mesir.
    options: ["Saya berdiri di sini dengan teman-teman dari Mesir.", "Saya berdiri di sini mewakili teman-teman dari Mesir.", "Saya datang ke sini mewakili keluarga dari Mesir."]
    answer: 1
    meaning:
      ar_eg: أنا واقف هنا بمثّل صحابي من مصر.
      ar: أقف هنا ممثّلًا أصدقائي من مصر.
      en: I stand here representing my friends from Egypt.
    words: [mewakili]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جزء بييجي في آخر الخطبة؟
      ar: أيّ جزء يأتي في آخر الخطاب؟
      en: Which part comes at the very end of the speech?
    options: ["Yang terhormat panitia festival.", "Pada kesempatan ini, saya ingin bercerita.", "Akhir kata, terima kasih."]
    answer: 2
    words: [akhir kata]
    explain:
      ar_eg: "آخر حاجة في الكلمة: Akhir kata, terima kasih. Yang terhormat للبداية، وPada kesempatan ini لنص الكلمة."
      ar: "آخر الكلمة: Akhir kata, terima kasih. أما Yang terhormat فللافتتاح، وPada kesempatan ini لمتن الكلمة."
      en: The very end is Akhir kata, terima kasih. Yang terhormat opens the speech, and Pada kesempatan ini starts the body.
  - id: e03
    type: match_pairs
    pairs:
      - text: mewakili
        ar_eg: يمثّل
        ar: يمثّل
        en: to represent
      - text: persahabatan
        ar_eg: صداقة
        ar: صداقة
        en: friendship
      - text: hadirin
        ar_eg: الحاضرين
        ar: الحاضرون
        en: audience
      - text: sambutan
        ar_eg: كلمة ترحيب
        ar: كلمة ترحيب
        en: welcome speech
      - text: buah tangan
        ar_eg: هدية من السفر
        ar: هدية من السفر
        en: gift from a trip
    words: [mewakili, persahabatan, hadirin, sambutan, buah tangan]
  - id: e04
    type: fill_blank
    sentence: Semoga ___ Indonesia dan Mesir semakin kuat.
    meaning:
      ar_eg: يا رب الصداقة بين إندونيسيا ومصر تقوى أكتر.
      ar: نرجو أن تزداد الصداقة بين إندونيسيا ومصر قوة.
      en: May the friendship between Indonesia and Egypt grow ever stronger.
    options: [sambutan, persahabatan, kesempatan]
    answers: [persahabatan]
    words: [persahabatan]
    explain:
      ar_eg: persahabatan = صداقة، وده اللي بيقوى بين بلدين. sambutan = كلمة ترحيب، وkesempatan = فرصة.
      ar: persahabatan = الصداقة، وهي ما يقوى بين البلدين. أما sambutan فكلمة الترحيب، وkesempatan الفرصة.
      en: persahabatan is friendship, which grows between two countries. sambutan is a welcome speech, and kesempatan is an opportunity.
  - id: e05
    type: build_sentence
    source:
      ar_eg: في المناسبة دي، أنا بمثّل صحابي من مصر.
      ar: في هذه المناسبة أمثّل أصدقائي من مصر.
      en: On this occasion, I represent my friends from Egypt.
    answer: Pada kesempatan ini, saya mewakili teman-teman dari Mesir.
    distractors: [hadirin, sambutan]
    words: [mewakili, kesempatan]
    explain:
      ar_eg: pada kesempatan ini = في المناسبة دي، وmewakili = بمثّل. hadirin = الحاضرين، وsambutan = كلمة ترحيب، ومش في الجملة.
      ar: pada kesempatan ini = في هذه المناسبة، وmewakili = أمثّل. أما hadirin فالحضور، وsambutan كلمة الترحيب، وليسا في الجملة.
      en: pada kesempatan ini means "on this occasion", and mewakili is "represent". hadirin and sambutan aren't in the sentence.
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: جبت هدايا من مصر للجنة.
      ar: أحضرت هدايا من مصر للجنة.
      en: I brought gifts from Egypt for the committee.
    answers:
      - Saya membawa buah tangan dari Mesir untuk panitia.
      - Saya membawa buah tangan dari Mesir untuk panitia
      - Saya membawakan panitia buah tangan dari Mesir.
      - Saya membawa oleh-oleh dari Mesir untuk panitia.
      - Saya membawa buah tangan untuk panitia dari Mesir.
      - Aku membawa buah tangan dari Mesir buat panitia.
      - Aku membawa buah tangan dari Mesir buat panitia
    words: [buah tangan, panitia]
  - id: e07
    type: dictation
    text: Semoga persahabatan kita semakin kuat.
    meaning:
      ar_eg: يا رب صداقتنا تقوى أكتر.
      ar: نرجو أن تزداد صداقتنا قوة.
      en: May our friendship grow ever stronger.
    words: [persahabatan]
  - id: e08
    type: speaking
    text: Yang terhormat panitia festival, hadirin yang berbahagia, saya bangga mewakili Mesir di Tomohon.
    meaning:
      ar_eg: حضرات لجنة المهرجان المحترمين، أيها الحضور الكرام، أنا فخور إني بمثّل مصر في توموهون.
      ar: حضرات لجنة المهرجان المحترمين، أيها الحضور الكرام، يشرّفني أن أمثّل مصر في توموهون.
      en: Honourable festival committee, dear guests, I'm proud to represent Egypt in Tomohon.
    words: [terhormat, hadirin, mewakili]
dialogue:
  title: Setelah pidato
  lines:
    - speaker: Ibu Meity
      text: Pidatomu bagus sekali, Pak Mohamed!
      ar_eg: خطبتك كانت حلوة أوي يا أستاذ محمد!
      ar: كان خطابك رائعًا يا أستاذ محمد!
      en: Your speech was wonderful, Mr Mohamed!
    - speaker: Mohamed
      text: Terima kasih, Bu. Sebenarnya saya agak gugup.
      ar_eg: شكرًا يا مدام. الحقيقة كنت متوتر شوية.
      ar: شكرًا يا سيدتي. في الحقيقة كنت متوترًا قليلًا.
      en: Thank you, ma'am. Actually, I was a bit nervous.
    - speaker: Ibu Meity
      text: Tidak kelihatan! Cerita tentang persahabatan Indonesia dan Mesir sangat indah.
      ar_eg: ماكانش باين خالص! الجزء بتاع الصداقة بين إندونيسيا ومصر كان جميل أوي.
      ar: لم يبدُ عليك ذلك! والجزء عن الصداقة بين إندونيسيا ومصر كان جميلًا جدًا.
      en: It didn't show! The part about the friendship between Indonesia and Egypt was beautiful.
    - speaker: Mas Rizal
      text: Wah, besok kamu jadi buah bibir di Tomohon!
      ar_eg: الله، بكرة هتبقى حديث توموهون كلها!
      ar: رائع، ستصبح غدًا حديث توموهون!
      en: Wow, tomorrow you'll be the talk of Tomohon!
    - speaker: Mohamed
      text: Asal saya tidak jadi tinggi hati, ya!
      ar_eg: المهم ماابقاش متكبّر بقى!
      ar: المهم ألّا أصير متكبّرًا!
      en: As long as I don't get big-headed!
new_words:
  - word: mewakili
    pos: verb
    ar_eg: يمثّل (حد أو بلد)
    ar: يمثّل
    en: to represent
    arabic: وكيل
  - word: persahabatan
    pos: noun
    ar_eg: صداقة
    ar: صداقة
    en: friendship
