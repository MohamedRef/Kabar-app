schema: kabar.lesson/v1
id: bipa4.u10.l10
language: id
title: Sambutan festival bunga
can_do:
  ar_eg: تفهم كلمة افتتاح رسمية في مهرجان وتعرف أجزاءها والتعبيرات اللي فيها.
  ar: أن تفهم كلمة افتتاح رسمية في مهرجان وتميّز أجزاءها وتعابيرها الاصطلاحية.
  en: Follow a formal opening speech at a festival and recognise its parts and idioms.
slides:
  - title: Sambutan ketua panitia
    body:
      ar_eg: |
        رئيسة لجنة مهرجان الورد في توموهون بتقول كلمة الافتتاح. اسمع الأول.
        خد بالك من الأجزاء: الافتتاح (Yang terhormat…)، المحتوى، والختام (Akhir kata…).
      ar: |
        تلقي رئيسة لجنة مهرجان الزهور في توموهون كلمة الافتتاح. استمع أولًا.
        لاحظ الأجزاء: الافتتاح (Yang terhormat…)، والمضمون، والختام (Akhir kata…).
      en: |
        The chair of the Tomohon flower festival committee gives the opening speech. Listen first.
        Notice the parts: opening (Yang terhormat…), body, and closing (Akhir kata…).
    examples:
      - text: Yang terhormat Bapak Wali Kota Tomohon, para tamu, dan hadirin yang berbahagia.
        ar_eg: سعادة عمدة توموهون المحترم، والضيوف الكرام، والحضور السعيد.
        ar: سعادة رئيس بلدية توموهون المحترم، والضيوف الكرام، والحضور الكريم.
        en: The Honourable Mayor of Tomohon, guests, and ladies and gentlemen.
      - text: Puji syukur kepada Tuhan Yang Maha Esa. Bunga-bunga ini adalah hasil kerja petani yang membanting tulang setiap hari.
        ar_eg: الحمد والشكر لله. الورد ده تعب الفلاحين اللي بيشتغلوا بكل طاقتهم كل يوم.
        ar: الحمد والشكر لله الواحد الأحد. هذه الزهور ثمرة عمل مزارعين يكدّون كل يوم.
        en: Praise and thanks be to God Almighty. These flowers are the work of farmers who toil every day.
      - text: Semoga Anda membawa pulang buah tangan dari Tomohon. Akhir kata, selamat menikmati festival!
        ar_eg: يا رب تروّحوا ومعاكم هدية من توموهون. وفي الختام، استمتعوا بالمهرجان!
        ar: نرجو أن تعودوا بهدية من توموهون. وفي الختام، استمتعوا بالمهرجان!
        en: We hope you take home a gift from Tomohon. In closing, enjoy the festival!
exercises:
  - id: e01
    type: listen
    text: Yang terhormat Bapak Wali Kota Tomohon, para tamu, dan hadirin yang berbahagia.
    question:
      ar_eg: المتكلمة بتحيّي مين الأول؟
      ar: من تحيّي المتحدثة أولًا؟
      en: Who does the speaker greet first?
    options: [Para petani bunga, Bapak Wali Kota Tomohon, Para wisatawan]
    answer: 1
    meaning:
      ar_eg: سعادة عمدة توموهون المحترم، والضيوف الكرام، والحضور السعيد.
      ar: سعادة رئيس بلدية توموهون المحترم، والضيوف الكرام، والحضور الكريم.
      en: The Honourable Mayor of Tomohon, guests, and ladies and gentlemen.
    words: [yang terhormat, hadirin]
  - id: e02
    type: listen
    text: Bunga-bunga ini adalah hasil para petani yang membanting tulang setiap hari.
    question:
      ar_eg: المتكلمة بتقول إيه عن الفلاحين؟
      ar: ماذا تقول المتحدثة عن المزارعين؟
      en: What does the speaker say about the farmers?
    options:
      - Mereka bekerja sangat keras.
      - Mereka keras kepala.
      - Mereka tinggal di Manado.
    answer: 0
    meaning:
      ar_eg: الورد ده تعب الفلاحين اللي بيشتغلوا بكل طاقتهم كل يوم.
      ar: هذه الزهور ثمرة عمل مزارعين يكدّون كل يوم.
      en: These flowers are the work of farmers who toil every day.
    words: [banting tulang]
  - id: e03
    type: listen
    text: Akhir kata, selamat menikmati festival!
    question:
      ar_eg: الجملة دي من أنهي جزء في الكلمة؟
      ar: من أيّ جزء من الكلمة هذه الجملة؟
      en: Which part of the speech is this sentence from?
    options: [Pembukaan, Isi, Penutup]
    answer: 2
    meaning:
      ar_eg: وفي الختام، استمتعوا بالمهرجان!
      ar: وفي الختام، استمتعوا بالمهرجان!
      en: In closing, enjoy the festival!
    words: [akhir kata]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: المتكلمة بتتمنى الزوار ياخدوا معاهم إيه؟
      ar: ماذا تتمنى المتحدثة أن يحمل الزوار معهم؟
      en: What does the speaker hope visitors take home?
    options: [Buah bibir, Buah tangan, Kambing hitam]
    answer: 1
    explain:
      ar_eg: buah tangan = هدية من السفر. buah bibir = حديث الناس، وkambing hitam = كبش فدا.
      ar: buah tangan = هدية من السفر، أما buah bibir فحديث الناس، وkambing hitam كبش الفداء.
      en: buah tangan = a gift from a trip; buah bibir = talk of the town; kambing hitam = scapegoat.
    words: [buah tangan, buah bibir, kambing hitam]
  - id: e05
    type: match_pairs
    pairs:
      - text: hadirin
        ar_eg: الحضور
        ar: الحاضرون
        en: audience
      - text: puji syukur
        ar_eg: الحمد والشكر (لله)
        ar: الحمد والشكر (لله)
        en: praise and thanks (to God)
      - text: membanting tulang
        ar_eg: يشتغل بكل طاقته
        ar: يكدّ ويجتهد
        en: work very hard
      - text: buah tangan
        ar_eg: هدية من السفر
        ar: هدية من السفر
        en: gift brought back from a trip
      - text: akhir kata
        ar_eg: وفي الختام
        ar: وفي الختام
        en: in closing
    words: [hadirin, puji syukur, banting tulang, buah tangan, akhir kata]
  - id: e06
    type: dictation
    text: Selamat menikmati festival bunga Tomohon!
    meaning:
      ar_eg: استمتعوا بمهرجان الورد في توموهون!
      ar: استمتعوا بمهرجان زهور توموهون!
      en: Enjoy the Tomohon flower festival!
  - id: e07
    type: fill_blank
    sentence: ___ kata, terima kasih atas perhatian Anda.
    meaning:
      ar_eg: وفي الختام، شكرًا على اهتمامكم.
      ar: وفي الختام، شكرًا على حسن انتباهكم.
      en: In closing, thank you for your attention.
    options: [Puji, Akhir, Hadirin]
    answers: [Akhir]
    words: [akhir kata]
    explain:
      ar_eg: akhir kata = وفي الختام، وبيها تقفل الكلمة. puji بتيجي مع syukur في البداية، وhadirin = الحاضرين.
      ar: akhir kata = وفي الختام، وبها تُختم الكلمة. أما puji فمع syukur في البداية، وhadirin الحضور.
      en: akhir kata means "in closing", ending the speech. puji goes with syukur at the start, and hadirin is the audience.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: فلاحين الورد بيشتغلوا بكل طاقتهم كل يوم.
      ar: يكدّ مزارعو الزهور كل يوم.
      en: The flower farmers work extremely hard every day.
    answers:
      - Petani bunga membanting tulang setiap hari.
      - Para petani bunga membanting tulang setiap hari.
      - Petani bunga banting tulang setiap hari.
      - Para petani bunga banting tulang setiap hari.
      - Petani bunga membanting tulang tiap hari.
      - Para petani bunga membanting tulang tiap hari.
    words: [banting tulang]
dialogue:
  title: Setelah pembukaan
  lines:
    - speaker: Ibu Meity
      text: Pak Mohamed, bagaimana sambutan ketua panitia tadi?
      ar_eg: يا أستاذ Mohamed، إيه رأيك في كلمة رئيسة اللجنة؟
      ar: يا أستاذ Mohamed، ما رأيك في كلمة رئيسة اللجنة؟
      en: Pak Mohamed, what did you think of the committee chair's speech?
    - speaker: Mohamed
      text: Bagus sekali, Bu. Awalnya lengkap, semua hadirin disapa.
      ar_eg: حلوة جدًا يا مدام. البداية كانت كاملة، وسلّمت على كل الحضور.
      ar: رائعة يا سيدتي. كانت البداية كاملة، وحيّت جميع الحاضرين.
      en: Excellent, ma'am. The opening was complete; everyone present was greeted.
    - speaker: Ibu Meity
      text: Beliau juga bilang terima kasih kepada para petani bunga.
      ar_eg: وكمان شكرت فلاحين الورد.
      ar: وشكرت أيضًا مزارعي الزهور.
      en: She also thanked the flower farmers.
    - speaker: Mohamed
      text: Ya, katanya mereka membanting tulang setiap hari.
      ar_eg: أيوه، قالت إنهم بيشتغلوا بكل طاقتهم كل يوم.
      ar: نعم، قالت إنهم يكدّون كل يوم.
      en: Yes, she said they work their fingers to the bone every day.
    - speaker: Ibu Meity
      text: Betul. Jangan lupa beli bunga sebagai buah tangan, ya!
      ar_eg: مظبوط. ما تنساش تشتري ورد هدية للي في البيت!
      ar: صحيح. لا تنسَ شراء زهور هديةً من الرحلة!
      en: True. Don't forget to buy flowers as a gift to take home!
