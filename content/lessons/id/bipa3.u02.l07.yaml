schema: kabar.lesson/v1
id: bipa3.u02.l07
language: id
title: Relawan penyu
can_do:
  ar_eg: تتكلم عن مجموعة متطوعين بتحمي السلاحف والحيوانات البرية للجيل الجاي.
  ar: أن تتحدث عن مجموعة متطوعين تحمي السلاحف والحيوانات البرية للجيل القادم.
  en: Talk about a volunteer group protecting turtles and wildlife for the next generation.
slides:
  - title: Komunitas di Gili
    body:
      ar_eg: |
        peduli = يهتم بـ (peduli lingkungan = مهتم بالبيئة). komunitas = جماعة، مجتمع صغير.
        sekelompok = مجموعة من (sekelompok anak muda = شوية شباب). upaya = مجهود، محاولة.
        perlindungan = حماية (من lindung). generasi = جيل (generasi muda = الجيل الجديد).
        mempertahankan = يحافظ على حاجة عشان تفضل. liar = بري (hewan liar = حيوانات برية).
      ar: |
        peduli = يهتم بـ (peduli lingkungan = مهتم بالبيئة). komunitas = مجتمع، جماعة.
        sekelompok = مجموعة من (sekelompok anak muda = مجموعة من الشباب). upaya = جهد، مسعى.
        perlindungan = حماية (من lindung). generasi = جيل (generasi muda = جيل الشباب).
        mempertahankan = يحافظ على الشيء ويُبقيه. liar = بري (hewan liar = حيوانات برية).
      en: |
        peduli = care (about) (peduli lingkungan = environmentally minded). komunitas = community.
        sekelompok = a group of (sekelompok anak muda = a group of young people). upaya = effort.
        perlindungan = protection (from lindung). generasi = generation (generasi muda = the young generation).
        mempertahankan = preserve, keep. liar = wild (hewan liar = wild animals).
    examples:
      - text: Sekelompok anak muda peduli pada penyu.
        ar_eg: شوية شباب مهتمين بالسلاحف.
        ar: مجموعة من الشباب تهتم بالسلاحف.
        en: A group of young people care about turtles.
      - text: Upaya komunitas ini sangat bagus.
        ar_eg: مجهود الجماعة دي حلو جدًا.
        ar: جهود هذا المجتمع رائعة.
        en: This community's efforts are great.
      - text: Kita harus mempertahankan alam untuk generasi muda.
        ar_eg: لازم نحافظ على الطبيعة للجيل الجديد.
        ar: علينا أن نحافظ على الطبيعة لجيل الشباب.
        en: We must preserve nature for the young generation.
