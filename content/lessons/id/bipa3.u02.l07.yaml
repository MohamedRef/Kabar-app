  - id: e03
    type: listen
    text: Sekelompok anak muda membuka tempat perlindungan penyu.
    question:
      ar_eg: الشباب فتحوا إيه؟
      ar: ماذا افتتح الشباب؟
      en: What did the young people open?
    options: [مطعم, مكان لحماية السلاحف, مدرسة]
    answer: 1
    meaning:
      ar_eg: شوية شباب فتحوا مكان لحماية السلاحف.
      ar: افتتحت مجموعة من الشباب مكانًا لحماية السلاحف.
      en: A group of young people opened a turtle sanctuary.
    words: [sekelompok, perlindungan]
  - id: e04
    type: fill_blank
    sentence: Rina sangat ___ pada lingkungan. Dia tidak pakai plastik.
    meaning:
      ar_eg: رينا ___ جدًا بالبيئة. مش بتستخدم بلاستيك.
      ar: رينا ___ جدًا بالبيئة. لا تستخدم البلاستيك.
      en: Rina really ___ about the environment. She doesn't use plastic.
    options: [peduli, liar, generasi]
    answers: [peduli]
    words: [peduli, liar, generasi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حيوان عايش في الغابة مش في البيت، اسمه hewan …؟
      ar: الحيوان الذي يعيش في الغابة لا في البيت هو hewan …؟
      en: An animal that lives in the wild, not at home, is hewan …?
    options: [komunitas, upaya, liar]
    answer: 2
    explain:
      ar_eg: hewan liar = حيوان بري.
      ar: hewan liar = حيوان بري.
      en: hewan liar = wild animal.
    words: [liar, komunitas, upaya]
  - id: e06
    type: fill_blank
    sentence: ___ anak muda membersihkan pantai setiap Minggu.
    meaning:
      ar_eg: ___ شباب بينضفوا الشط كل أحد.
      ar: ___ الشباب تنظف الشاطئ كل أحد.
      en: ___ young people clean the beach every Sunday.
    options: [Sekelompok, Perlindungan, Upaya]
    answers: [Sekelompok]
    words: [sekelompok, perlindungan, upaya]
  - id: e07
    type: build_sentence
    source:
      ar_eg: لازم نحافظ على الشعاب المرجانية دي.
      ar: علينا أن نحافظ على هذه الشعاب المرجانية.
      en: We must preserve this coral reef.
    answer: Kita harus mempertahankan terumbu karang ini.
    distractors: [liar, generasi]
    words: [mempertahankan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Upaya ini untuk generasi muda.
    answers_meaning:
      ar_eg: [المجهود ده عشان الجيل الجديد, المجهود ده علشان الشباب]
      ar: [هذا الجهد من أجل جيل الشباب, هذه الجهود لأجل الجيل الجديد]
      en: [This effort is for the young generation, These efforts are for the younger generation]
    words: [upaya, generasi]
  - id: e09
    type: speaking
    text: Komunitas kami peduli pada hewan liar.
    meaning:
      ar_eg: جماعتنا مهتمة بالحيوانات البرية.
      ar: مجتمعنا يهتم بالحيوانات البرية.
      en: Our community cares about wild animals.
    words: [komunitas, peduli, liar]
  - id: e10
    type: multiple_choice
    question: Penyu perlu ___ dari kita.
    options: [generasi, perlindungan, mempertahankan]
    answer: 1
    explain:
      ar_eg: perlindungan = حماية، من lindung.
      ar: perlindungan = حماية، من lindung.
      en: perlindungan = protection, from lindung.
    words: [perlindungan, generasi, mempertahankan]
dialogue:
  lines:
    - speaker: Relawan
      text: Selamat datang di tempat perlindungan penyu!
      ar_eg: أهلًا بيك في مكان حماية السلاحف!
      ar: أهلًا بك في محمية السلاحف!
      en: Welcome to the turtle sanctuary!
    - speaker: Mohamed
      text: Terima kasih. Siapa yang bekerja di sini?
      ar_eg: شكرًا. مين اللي بيشتغل هنا؟
      ar: شكرًا. من يعمل هنا؟
      en: Thanks. Who works here?
    - speaker: Relawan
      text: Sekelompok anak muda dari desa. Kami semua relawan.
      ar_eg: شوية شباب من القرية. كلنا متطوعين.
      ar: مجموعة من شباب القرية. كلنا متطوعون.
      en: A group of young people from the village. We're all volunteers.
    - speaker: Mohamed
      text: Upaya kalian luar biasa! Kenapa sih kalian peduli sama penyu?
      ar_eg: مجهودكم جامد! ليه مهتمين بالسلاحف؟
      ar: جهودكم رائعة! لماذا تهتمون بالسلاحف؟
      en: Your work is amazing! Why do you care about turtles?
    - speaker: Relawan
      text: Kami mau mempertahankan alam kami untuk generasi berikut.
      ar_eg: عايزين نحافظ على طبيعتنا للجيل الجاي.
      ar: نريد أن نحافظ على طبيعتنا للجيل القادم.
      en: We want to preserve our nature for the next generation.
