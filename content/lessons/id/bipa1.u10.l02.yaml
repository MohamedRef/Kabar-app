schema: kabar.lesson/v1
id: bipa1.u10.l02
language: id
title: Pernah ke Bali?
can_do:
  ar_eg: تتكلم عن تجاربك بـ pernah.
  ar: أن تتحدث عن تجاربك باستعمال pernah.
  en: Talk about experiences with pernah.
slides:
  - title: Pernah = عمرك…؟
    body:
      ar_eg: |
        pernah بتسأل عن التجربة: حصلت ولو مرة؟ زي «عمرك…؟» بالمصري.
        - Kamu pernah ke Bali? = عمرك رحت بالي؟
        - Kamu pernah makan durian? = عمرك كلت دوريان؟
        وفي الإثبات معناها «قبل كده»: Saya pernah tinggal di Jakarta = عشت في جاكرتا قبل كده.
      ar: |
        pernah للسؤال عن التجربة ولو مرة واحدة، كـ«هل سبق أن…؟».
        - Kamu pernah ke Bali؟ = هل سبق أن زرت بالي؟
        - Kamu pernah makan durian؟ = هل سبق أن أكلت الدوريان؟
        وفي الإثبات تعني «سبق أن»: Saya pernah tinggal di Jakarta.
      en: |
        pernah asks about experience — has it happened even once? Like Egyptian «عمرك…؟».
        - Kamu pernah ke Bali? = Have you ever been to Bali?
        - Kamu pernah makan durian? = Have you ever eaten durian?
        In statements it means "once / before": Saya pernah tinggal di Jakarta = I once lived in Jakarta.
    grammar: id.aspect.pernah
    examples:
      - text: Kamu pernah ke Mesir?
        ar_eg: عمرك رحت مصر؟
        ar: هل سبق أن زرت مصر؟
        en: Have you ever been to Egypt?
      - text: Saya pernah belajar di Al-Azhar.
        ar_eg: درست في الأزهر قبل كده.
        ar: سبق أن درست في الأزهر.
        en: I once studied at Al-Azhar.
  - title: Pernah. · Belum pernah.
    body:
      ar_eg: |
        الرد:
        - Pernah. = أيوه، حصل قبل كده.
        - Belum (pernah). = لسه ماحصلش (بس ممكن يحصل). ده الرد المؤدب والحلو.
        - Tidak pernah = عمري ما (أبدًا): Dia tidak pernah terlambat = عمره ما بيتأخر.
        فلو حد سألك «Pernah makan durian?» ولسه مادقتهوش، قول Belum! مش Tidak.
      ar: |
        الجواب:
        - Pernah = نعم، سبق.
        - Belum (pernah) = لم يسبق بعدُ (وقد يحدث)، وهو الجواب المهذب.
        - Tidak pernah = لم يحدث قط: Dia tidak pernah terlambat = لا يتأخر أبدًا.
        فإن سُئلت «Pernah makan durian؟» ولم تذقه بعد، فقل Belum لا Tidak.
      en: |
        Answers:
        - Pernah. = Yes, I have.
        - Belum (pernah). = Not yet (but maybe one day) — the friendly, polite answer.
        - Tidak pernah = never: Dia tidak pernah terlambat = He's never late.
        So if asked "Pernah makan durian?" and you haven't yet, say Belum, not Tidak.
    grammar: id.aspect.pernah
    examples:
      - text: Saya belum pernah naik kapal.
        ar_eg: لسه عمري ما ركبت مركب.
        ar: لم يسبق لي أن ركبت قاربًا بعد.
        en: I've never been on a boat (yet).
      - text: Dia tidak pernah makan pedas.
        ar_eg: عمره ما بياكل حراق.
        ar: لا يأكل الطعام الحار أبدًا.
        en: He never eats spicy food.
  - title: Pertama kali
    body:
      ar_eg: |
        وأول مرة؟ pertama kali:
        Ini pertama kali saya naik kapal = دي أول مرة أركب مركب.
        «Pernah ke Mesir?» سؤال الإندونيسيين بيحبوه جدًا لما يعرفوا إنك مصري، والرد بيفتح كلام حلو عن الأزهر والأهرامات.
      ar: |
        وللمرة الأولى: pertama kali:
        Ini pertama kali saya naik kapal = هذه أول مرة أركب فيها قاربًا.
        وسؤال «Pernah ke Mesir؟» محبَّب عند الإندونيسيين حين يعرفون أنك مصري، ويفتح حديثًا عن الأزهر والأهرام.
      en: |
        And "the first time"? pertama kali:
        Ini pertama kali saya naik kapal = This is my first time on a boat.
        "Pernah ke Mesir?" is a favourite question once people learn you're Egyptian — it opens warm talk about Al-Azhar and the pyramids.
    grammar: id.aspect.pernah
    examples:
      - text: Ini pertama kali saya ke Kepulauan Seribu.
        ar_eg: دي أول مرة أروح جزر الألف.
        ar: هذه أول مرة أزور فيها جزر الألف.
        en: This is my first time at the Thousand Islands.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pernah
        ar_eg: قبل كده، عمرك…
        ar: سبق أن
        en: have ever, once
      - text: belum pernah
        ar_eg: لسه ماحصلش
        ar: لم يسبق بعدُ
        en: not yet ever
      - text: tidak pernah
        ar_eg: عمري ما، أبدًا
        ar: لم يحدث قط
        en: never
      - text: pertama kali
        ar_eg: أول مرة
        ar: أول مرة
        en: the first time
    words: [pernah, belum pernah, tidak pernah, pertama kali]
  - id: e02
    type: multiple_choice
    question: Kamu pernah makan durian?
    question_meaning:
      ar_eg: لسه مادقتش الدوريان بس نفسك تجربه. ترد بإيه؟
      ar: لم تذق الدوريان بعد لكنك تودّ تجربته. بماذا تجيب؟
      en: You haven't tried durian yet but you'd like to. What do you answer?
    options: ["Belum pernah.", "Tidak.", "Pernah."]
    answer: 0
    explain:
      ar_eg: Belum pernah = لسه، وده الرد المؤدب اللي بيسيب الباب مفتوح.
      ar: Belum pernah = لم يسبق بعدُ، وهو الجواب المهذب.
      en: Belum pernah = not yet — polite, and it leaves the door open.
    words: [belum pernah, durian]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تسأل «عمرك رحت مصر؟»
      ar: كيف تسأل «هل سبق أن زرت مصر؟»
      en: How do you ask "Have you ever been to Egypt?"
    options: ["Kamu dari Mesir?", "Kamu pernah ke Mesir?", "Kamu sudah di Mesir?"]
    answer: 1
    explain:
      ar_eg: pernah للتجربة. Kamu dari Mesir? = إنت من مصر؟ وده سؤال تاني خالص.
      ar: pernah للتجربة، أما Kamu dari Mesir؟ فسؤال عن الأصل.
      en: pernah asks about experience; Kamu dari Mesir? asks where you're from.
    words: [pernah]
  - id: e04
    type: listen
    text: Saya belum pernah naik kapal.
    options: ["Saya pernah naik kapal.", "Saya belum pernah naik kapal.", "Saya tidak mau naik kapal."]
    answer: 1
    words: [belum pernah, kapal]
  - id: e05
    type: fill_blank
    sentence: Dia ___ pernah terlambat. Dia selalu datang jam tujuh.
    meaning:
      ar_eg: هو عمره ما بيتأخر. دايمًا بييجي الساعة سبعة.
      ar: لا يتأخر أبدًا، فهو يأتي دائمًا في السابعة.
      en: He's never late. He always comes at seven.
    options: ["sudah", "bukan", "tidak"]
    answers: [tidak]
    explain:
      ar_eg: «عمره ما» (أبدًا) = tidak pernah.
      ar: «لا… أبدًا» = tidak pernah.
      en: never = tidak pernah.
    words: [tidak pernah, terlambat]
  - id: e06
    type: fill_blank
    sentence: Ini ___ kali saya ke Kepulauan Seribu.
    meaning:
      ar_eg: دي أول مرة أروح جزر الألف.
      ar: هذه أول مرة أزور فيها جزر الألف.
      en: This is my first time at the Thousand Islands.
    options: ["pernah", "belum", "pertama"]
    answers: [pertama]
    words: [pertama kali]
  - id: e07
    type: build_sentence
    source:
      ar_eg: درست في الأزهر قبل كده.
      ar: سبق أن درست في الأزهر.
      en: I once studied at Al-Azhar.
    answer: Saya pernah belajar di Al-Azhar.
    distractors: [belum, ke]
    words: [pernah, belajar]
  - id: e08
    type: build_sentence
    source:
      ar_eg: عمرك جربت السنوركلنج؟
      ar: هل سبق أن جرّبت الغطس السطحي؟
      en: Have you ever tried snorkeling?
    answer: Kamu pernah mencoba snorkeling?
    distractors: [belum, tidak]
    words: [pernah, mencoba]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عمرك رحت بالي؟
      ar: هل سبق أن زرت بالي؟
      en: Have you ever been to Bali?
    answers:
      - Kamu pernah ke Bali?
      - Pernah ke Bali?
      - Kamu pernah pergi ke Bali?
      - Anda pernah ke Bali?
      - Kamu pernah ke Bali
      - Apakah kamu pernah ke Bali?
    explain:
      ar_eg: ke لوحدها كفاية بعد pernah، مش لازم pergi.
      ar: تكفي ke بعد pernah دون pergi.
      en: ke alone is enough after pernah; pergi is optional.
    words: [pernah, ke]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لسه عمري ما كلت دوريان.
      ar: لم يسبق لي أن أكلت الدوريان بعد.
      en: I've never eaten durian (yet).
    answers:
      - Saya belum pernah makan durian.
      - Aku belum pernah makan durian.
      - Saya belum pernah makan durian
      - Saya belum pernah mencoba durian.
    words: [belum pernah, durian]
  - id: e11
    type: translate
    direction: from_target
    source_text: Saya pernah tinggal di Jakarta.
    answers_meaning:
      ar_eg: ["عشت في جاكرتا قبل كده.", "أنا عشت في جاكرتا قبل كده", "سكنت في جاكرتا قبل كده"]
      ar: ["سبق أن عشت في جاكرتا.", "عشت في جاكرتا من قبل"]
      en: ["I once lived in Jakarta.", "I have lived in Jakarta", "I lived in Jakarta before"]
    words: [pernah, tinggal]
  - id: e12
    type: dictation
    text: Kamu pernah ke Mesir?
    meaning:
      ar_eg: عمرك رحت مصر؟
      ar: هل سبق أن زرت مصر؟
      en: Have you ever been to Egypt?
    words: [pernah]
  - id: e13
    type: speaking
    text: Belum pernah, tapi saya mau mencoba!
    meaning:
      ar_eg: لسه، بس عايز أجرّب!
      ar: لم يسبق بعد، لكني أريد أن أجرّب!
      en: Not yet, but I want to try!
    words: [belum pernah, mencoba]
dialogue:
  title: Sebelum naik kapal
  lines:
    - speaker: Mas Ardi
      text: Mohamed, kamu pernah ke Kepulauan Seribu?
      ar_eg: يا محمد، عمرك رحت جزر الألف؟
      ar: يا محمد، هل سبق أن زرت جزر الألف؟
      en: Mohamed, have you ever been to the Thousand Islands?
    - speaker: Mohamed
      text: Belum pernah, Mas. Ini pertama kali.
      ar_eg: لسه يا أردي. دي أول مرة.
      ar: لم يسبق بعد. هذه أول مرة.
      en: Not yet. This is the first time.
    - speaker: Mas Ardi
      text: Kamu pernah mencoba snorkeling?
      ar_eg: عمرك جربت السنوركلنج؟
      ar: هل سبق أن جرّبت الغطس السطحي؟
      en: Have you ever tried snorkeling?
    - speaker: Mohamed
      text: Pernah! Di Laut Merah, di Mesir. Ikannya cantik sekali.
      ar_eg: أيوه! في البحر الأحمر في مصر. السمك هناك حلو أوي.
      ar: نعم! في البحر الأحمر بمصر، وأسماكه جميلة جدًا.
      en: Yes! In the Red Sea, in Egypt. The fish are so beautiful.
    - speaker: Mas Ardi
      text: Wah! Saya belum pernah ke Mesir. Saya mau ke sana!
      ar_eg: الله! أنا لسه عمري ما رحت مصر. نفسي أروح هناك!
      ar: رائع! لم أزر مصر بعد، وأودّ الذهاب إليها!
      en: Wow! I've never been to Egypt. I'd love to go there!
