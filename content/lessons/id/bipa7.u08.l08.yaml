schema: kabar.lesson/v1
id: bipa7.u08.l08
language: id
title: Resesi dan pemulihan
can_do:
  ar_eg: تفهم كلام الأخبار عن الركود وخطط الحكومة علشان الاقتصاد يقوم.
  ar: أن تفهم لغة الأخبار عن الركود وخطط الحكومة لإنعاش الاقتصاد.
  en: Follow news about recession and the government's recovery plans.
slides:
  - title: Ketika ekonomi melambat
    body:
      ar_eg: |
        resesi = ركود: النمو بيبقى بالسالب ربعين ورا بعض، زي اللي حصل في إندونيسيا سنة 2020 أيام الكورونا.
        stagnasi = الاقتصاد واقف مكانه. deflasi = الأسعار بتنزل لأن الناس مش بتشتري.
        الحكومة بتعمل paket stimulus (حزمة تحفيز): insentif pajak (حوافز ضريبية) للشركات، وsubsidi (دعم) للبنزين والكهربا.
        jaring pengaman sosial = شبكة أمان اجتماعي للفقرا.
        الهدف: pemulihan ekonomi (التعافي الاقتصادي).
        - في الكلام: udah = sudah، kerasa = terasa، nolong = menolong.
      ar: |
        resesi = ركود: نموّ سالب ربعين متتاليين، كما حدث في إندونيسيا عام 2020 في جائحة كورونا.
        stagnasi = جمود الاقتصاد. deflasi = هبوط الأسعار لأنّ الناس لا يشترون.
        وتطلق الحكومة paket stimulus (حزمة تحفيز): insentif pajak (حوافز ضريبية) للشركات وsubsidi (دعمًا) للوقود والكهرباء.
        jaring pengaman sosial = شبكة الأمان الاجتماعي للفقراء.
        والغاية pemulihan ekonomi (التعافي الاقتصادي).
        - في الكلام اليومي: udah = sudah، kerasa = terasa، nolong = menolong.
      en: |
        resesi = recession: negative growth for two quarters in a row, as in Indonesia in 2020 during COVID.
        stagnasi = an economy standing still. deflasi = prices falling because people aren't buying.
        The government launches a paket stimulus: insentif pajak (tax incentives) for firms and subsidi for fuel and electricity.
        jaring pengaman sosial = a social safety net for the poor.
        The goal: pemulihan ekonomi (economic recovery).
        - In speech: udah = sudah, kerasa = terasa, nolong = menolong.
    examples:
      - text: Indonesia masuk resesi pada tahun 2020.
        ar_eg: إندونيسيا دخلت ركود سنة 2020.
        ar: دخلت إندونيسيا في ركود عام 2020.
        en: Indonesia went into recession in 2020.
      - text: Pemerintah memberi insentif pajak untuk usaha kecil.
        ar_eg: الحكومة إدّت حوافز ضريبية للمشاريع الصغيّرة.
        ar: منحت الحكومة حوافز ضريبية للمشاريع الصغيرة.
        en: The government gave tax incentives to small businesses.
      - text: Subsidi listrik membantu keluarga miskin.
        ar_eg: دعم الكهربا بيساعد العيلات الفقيرة.
        ar: يساعد دعم الكهرباء الأسر الفقيرة.
        en: Electricity subsidies help poor families.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: resesi
        ar_eg: ركود اقتصادي
        ar: ركود اقتصادي
        en: recession
      - text: deflasi
        ar_eg: انكماش الأسعار (الأسعار بتنزل)
        ar: انكماش الأسعار
        en: deflation
      - text: stagnasi
        ar_eg: ركود / جمود
        ar: ركود، جمود
        en: stagnation
      - text: stimulus
        ar_eg: حزمة تحفيز
        ar: حافز اقتصادي
        en: (economic) stimulus
    words: [resesi, deflasi, stagnasi, stimulus]
  - id: e02
    type: match_pairs
    pairs:
      - text: insentif
        ar_eg: حافز
        ar: حافز
        en: incentive
      - text: subsidi
        ar_eg: دعم (حكومي)
        ar: دعم حكومي
        en: subsidy
      - text: pemulihan ekonomi
        ar_eg: تعافي اقتصادي
        ar: التعافي الاقتصادي
        en: economic recovery
      - text: jaring pengaman
        ar_eg: شبكة أمان
        ar: شبكة أمان
        en: safety net
    words: [insentif, subsidi, pemulihan ekonomi, jaring pengaman]
  - id: e03
    type: listen
    text: Harga sayur turun tiga bulan berturut-turut. Para ahli bicara tentang deflasi.
    question:
      ar_eg: الخبرا بيتكلّموا عن إيه؟
      ar: عمّ يتحدّث الخبراء؟
      en: What are experts talking about?
    options: [انكماش الأسعار, حزمة تحفيز, شبكة أمان]
    answer: 0
    meaning:
      ar_eg: أسعار الخضار نزلت تلات شهور ورا بعض. الخبرا بيتكلّموا عن انكماش.
      ar: هبطت أسعار الخضار ثلاثة أشهر متتالية، فتحدّث الخبراء عن انكماش.
      en: Vegetable prices fell three months in a row. Experts talk of deflation.
    words: [deflasi]
  - id: e04
    type: fill_blank
    sentence: Bantuan tunai adalah bagian dari ___ sosial.
    meaning:
      ar_eg: المساعدة النقدية جزء من ___ الاجتماعي.
      ar: المساعدة النقدية جزء من ___ الاجتماعية.
      en: Cash aid is part of the social ___.
    options: [jaring pengaman, stagnasi, resesi]
    answers: [jaring pengaman]
    words: [jaring pengaman, stagnasi, resesi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الاقتصاد يبقى في «resesi» إمتى؟
      ar: متى يكون الاقتصاد في «resesi»؟
      en: When is an economy in 'resesi'?
    options: [Ketika pertumbuhan negatif dua kuartal berturut-turut., Ketika harga naik sedikit., Ketika ada subsidi.]
    answer: 0
    explain:
      ar_eg: ركود = نمو بالسالب ربعين ورا بعض.
      ar: الركود = نموّ سالب ربعين متتاليين.
      en: Recession = two consecutive quarters of negative growth.
    words: [resesi, subsidi]
  - id: e06
    type: fill_blank
    sentence: Paket ___ itu bernilai ratusan triliun rupiah.
    meaning:
      ar_eg: حزمة الـ ___ دي قيمتها مئات التريليونات روبية.
      ar: تبلغ قيمة حزمة ___ مئات التريليونات من الروبيات.
      en: That ___ package is worth hundreds of trillions of rupiah.
    options: [stimulus, deflasi, pemulihan ekonomi]
    answers: [stimulus]
    words: [stimulus, deflasi, pemulihan ekonomi]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الاقتصاد واقف مكانه بقاله سنتين.
      ar: يعاني الاقتصاد من الجمود منذ عامين.
      en: The economy has stagnated for two years.
    answer: Ekonomi mengalami stagnasi selama dua tahun.
    distractors: [resesi, insentif]
    words: [stagnasi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Pemulihan ekonomi berjalan lebih cepat di kota besar.
    answers_meaning:
      ar_eg: [التعافي الاقتصادي ماشي أسرع في المدن الكبيرة, الاقتصاد بيتعافى أسرع في المدن الكبيرة]
      ar: [يسير التعافي الاقتصادي أسرع في المدن الكبرى, التعافي الاقتصادي أسرع في المدن الكبيرة]
      en: [Economic recovery is faster in big cities, The economy is recovering more quickly in large cities]
    words: [pemulihan ekonomi]
  - id: e09
    type: speaking
    text: Insentif dan subsidi harus tepat sasaran.
    meaning:
      ar_eg: الحوافز والدعم لازم يوصلوا للناس الصح.
      ar: يجب أن تصيب الحوافز والدعم مستحقّيها.
      en: Incentives and subsidies must reach the right people.
    words: [insentif, subsidi]
  - id: e10
    type: multiple_choice
    question: Mana yang paling cepat membantu warga miskin saat resesi?
    options: [Stagnasi harga., Pajak baru yang tinggi., Jaring pengaman sosial dan subsidi.]
    answer: 2
    explain:
      ar_eg: شبكة الأمان والدعم بيساعدوا الفقرا بسرعة.
      ar: تساعد شبكة الأمان والدعم الفقراء سريعًا.
      en: Safety nets and subsidies help the poor fastest.
    words: [jaring pengaman, subsidi, stagnasi, resesi, insentif, stimulus, pemulihan ekonomi, deflasi]
dialogue:
  lines:
    - speaker: Mama Ester
      text: Anak, dulu waktu korona toko saya hampir tutup.
      ar_eg: يا ابني، زمان أيام الكورونا محلي كان هيقفل.
      ar: يا بني، في أيام كورونا كاد متجري يُغلق.
      en: Child, back during COVID my shop almost closed.
    - speaker: Mohamed
      text: Waktu itu Indonesia masuk resesi, Mama.
      ar_eg: الوقت ده إندونيسيا دخلت ركود يا ماما.
      ar: دخلت إندونيسيا حينها في ركود يا أمّي.
      en: Indonesia was in recession then, Mama.
    - speaker: Mama Ester
      text: Untung ada bantuan tunai. Itu yang membantu kami.
      ar_eg: الحمد لله كان فيه مساعدة نقدية. هي اللي نجدتنا.
      ar: لحسن الحظّ كانت هناك مساعدات نقدية أنقذتنا.
      en: Luckily there was cash aid. That's what saved us.
    - speaker: Mohamed
      text: Itu bagian dari jaring pengaman sosial dalam paket stimulus.
      ar_eg: دي جزء من شبكة الأمان الاجتماعي في حزمة التحفيز.
      ar: هذا جزء من شبكة الأمان الاجتماعي ضمن حزمة التحفيز.
      en: That was part of the social safety net in the stimulus package.
    - speaker: Mama Ester
      text: Sekarang pasar ramai lagi. Pemulihan ekonomi udah terasa.
      ar_eg: دلوقتي السوق رجع زحمة. التعافي الاقتصادي باين.
      ar: عاد السوق مزدحمًا، والتعافي الاقتصادي محسوس.
      en: Now the market's busy again. You can feel the recovery.
