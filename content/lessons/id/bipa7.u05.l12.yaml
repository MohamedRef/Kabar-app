schema: kabar.lesson/v1
id: bipa7.u05.l12
language: id
title: Linimasa
can_do:
  ar_eg: تكتب خط زمني متماسك لأهم محطات تاريخ إندونيسيا الحديث.
  ar: أن تكتب خطًّا زمنيًّا متماسكًا لأبرز محطّات تاريخ إندونيسيا الحديث.
  en: Write a cohesive timeline of the key milestones in modern Indonesian history.
slides:
  - title: Empat tonggak
    grammar: id.cohesion.grammatical
    body:
      ar_eg: |
        الـ linimasa (الخط الزمني) مش قايمة تواريخ بس، لازم يتربط:
        - 1945: Proklamasi kemerdekaan dibacakan pada 17 Agustus.
        - 1966: Orde Baru dimulai. Masa ini berlangsung lebih dari tiga puluh tahun.
        - 1998: Reformasi. Sejak saat itu, pers menjadi lebih bebas.
        - 2004: Untuk pertama kalinya, rakyat memilih presiden secara langsung.
        كل واحدة من دول tonggak sejarah (علامة فارقة في التاريخ). والكلمات Masa ini وSejak saat itu بتربط المحطة باللي قبلها.
      ar: |
        ليس الـ linimasa (الخطّ الزمني) قائمة تواريخ فحسب، بل يجب أن يترابط:
        - 1945: Proklamasi kemerdekaan dibacakan pada 17 Agustus.
        - 1966: Orde Baru dimulai. Masa ini berlangsung lebih dari tiga puluh tahun.
        - 1998: Reformasi. Sejak saat itu, pers menjadi lebih bebas.
        - 2004: Untuk pertama kalinya, rakyat memilih presiden secara langsung.
        وكلّ منها tonggak sejarah (معلم تاريخي فارق)، وتصل عبارتا Masa ini وSejak saat itu المحطّة بما قبلها.
      en: |
        A linimasa (timeline) isn't just a list of dates; it has to hang together:
        - 1945: Proklamasi kemerdekaan dibacakan pada 17 Agustus.
        - 1966: Orde Baru dimulai. Masa ini berlangsung lebih dari tiga puluh tahun.
        - 1998: Reformasi. Sejak saat itu, pers menjadi lebih bebas.
        - 2004: Untuk pertama kalinya, rakyat memilih presiden secara langsung.
        Each is a tonggak sejarah (historic milestone). Masa ini and Sejak saat itu tie each step to the one before.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: linimasa
        ar_eg: خط زمني
        ar: خطّ زمني
        en: timeline
      - text: proklamasi
        ar_eg: إعلان (الاستقلال)
        ar: إعلان الاستقلال
        en: proclamation
      - text: Orde Baru
        ar_eg: النظام الجديد (عصر سوهارتو)
        ar: النظام الجديد
        en: the New Order (Soeharto era)
      - text: tonggak sejarah
        ar_eg: علامة فارقة في التاريخ
        ar: معلم تاريخي فارق
        en: historic milestone
    words: [linimasa, proklamasi, Orde Baru, tonggak sejarah]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أول انتخابات رئاسية مباشرة كانت سنة كام؟
      ar: في أيّ سنة جرت أوّل انتخابات رئاسية مباشرة؟
      en: In which year was the first direct presidential election?
    options: ["1966", "2004", "1998"]
    answer: 1
    words: [tonggak sejarah]
    explain:
      ar_eg: أول انتخابات رئاسية مباشرة كانت سنة 2004. 1998 سنة الإصلاح و1966 بداية النظام الجديد.
      ar: أول انتخابات رئاسية مباشرة عام 2004. 1998 الإصلاح و1966 بداية العهد الجديد.
      en: The first direct presidential election was in 2004.
  - id: e03
    type: fill_blank
    sentence: ___ kemerdekaan dibacakan pada 17 Agustus 1945.
    meaning:
      ar_eg: إعلان الاستقلال اتقرا يوم 17 أغسطس 1945.
      ar: تُلي إعلان الاستقلال في 17 أغسطس 1945.
      en: The proclamation of independence was read on 17 August 1945.
    options: [Proklamasi, Linimasa, Orde Baru]
    answers: [Proklamasi]
    words: [proklamasi]
    explain:
      ar_eg: Proklamasi kemerdekaan = إعلان الاستقلال، اتقرا 17 أغسطس 1945. linimasa = خط زمني، وOrde Baru عهد سوهارتو.
      ar: Proklamasi kemerdekaan = إعلان الاستقلال يوم 17 أغسطس 1945. linimasa خط زمني.
      en: The proclamation was read on 17 August 1945. linimasa is a timeline.
  - id: e04
    type: listen
    text: Setelah tahun 1966, Soeharto memimpin pemerintahan baru yang disebut Orde Baru. Orde Baru berlangsung lebih dari tiga puluh tahun, sampai Reformasi pada tahun 1998.
    question:
      ar_eg: النظام الجديد فضل قد إيه؟
      ar: كم دام النظام الجديد؟
      en: How long did the New Order last?
    options:
      - Lebih dari tiga puluh tahun, dari 1966 sampai 1998.
      - Sepuluh tahun.
      - Hanya dua tahun.
    answer: 0
    words: [Orde Baru]
    explain:
      ar_eg: Orde Baru استمر (berlangsung) أكتر من تلاتين سنة، من ١٩٦٦ لحد الإصلاح سنة ١٩٩٨.
      ar: دام النظام الجديد أكثر من ثلاثين عامًا، من ١٩٦٦ حتى الإصلاح سنة ١٩٩٨.
      en: The New Order lasted over thirty years, 1966–1998.
  - id: e05
    type: build_sentence
    source:
      ar_eg: الخط الزمني ده بيبدأ بإعلان الاستقلال.
      ar: يبدأ هذا الخطّ الزمني بإعلان الاستقلال.
      en: This timeline begins with the proclamation.
    answer: Linimasa ini dimulai dengan proklamasi.
    distractors: [tonggak, Orde]
    words: [linimasa, proklamasi]
    explain:
      ar_eg: Linimasa ini (الخط الزمني ده) + dimulai (بيبدأ) + dengan proklamasi. tonggak وOrde زيادة.
      ar: Linimasa ini dimulai dengan proklamasi. tonggak وOrde زائدتان.
      en: Linimasa ini + dimulai + dengan proklamasi. tonggak and Orde are extra.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي بيخلّي الخط الزمني متماسك مش قايمة؟
      ar: ما الذي يجعل الخطّ الزمني متماسكًا لا مجرّد قائمة؟
      en: What makes a timeline cohesive rather than a list?
    options:
      - Karena linimasanya panjang.
      - Karena tanggalnya ditulis dengan warna merah.
      - Karena ada kata penghubung seperti "Sejak saat itu" dan "Masa ini".
    answer: 2
    words: [linimasa]
    explain:
      ar_eg: الخط الزمني بيبقى مترابط بكلمات الربط زي Sejak saat itu وMasa ini، مش بالطول ولا بالألوان.
      ar: يترابط الخطّ الزمنيّ بأدوات الربط مثل Sejak saat itu وMasa ini، لا بالطول ولا بالألوان.
      en: Linking phrases like Sejak saat itu make it cohesive, not length or colour.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الإصلاح كان علامة فارقة في التاريخ.
      ar: كان الإصلاح معلمًا تاريخيًّا فارقًا.
      en: Reform was a historic milestone.
    answers:
      - Reformasi adalah tonggak sejarah.
      - Reformasi merupakan tonggak sejarah.
      - Reformasi menjadi tonggak sejarah.
      - Reformasi adalah sebuah tonggak sejarah.
    words: [tonggak sejarah]
  - id: e08
    type: speaking
    text: Masa Orde Baru berakhir pada tahun 1998.
    meaning:
      ar_eg: عصر النظام الجديد خلص سنة 1998.
      ar: انتهى عهد النظام الجديد عام 1998.
      en: The New Order era ended in 1998.
    words: [Orde Baru]
  - id: e09
    type: dictation
    text: Proklamasi adalah tonggak sejarah bangsa Indonesia.
    meaning:
      ar_eg: إعلان الاستقلال علامة فارقة في تاريخ الشعب الإندونيسي.
      ar: إعلان الاستقلال معلم فارق في تاريخ الأمّة الإندونيسية.
      en: The proclamation is a milestone in the history of the Indonesian nation.
    words: [proklamasi, tonggak sejarah]
  - id: e10
    type: translate
    direction: from_target
    source_text: Dalam linimasa saya, Orde Baru ditandai dengan warna kuning, supaya periode itu mudah dibedakan dari era Reformasi.
    answers_meaning:
      ar_eg:
        - في الخط الزمني بتاعي، الأوردي بارو متعلّم باللون الأصفر، عشان الفترة دي تتفرّق بسهولة عن عصر الإصلاح.
        - علّمت النظام الجديد بالأصفر في خطي الزمني، علشان يبان مختلف عن فترة الريفورماسي.
      ar:
        - في خطّي الزمنيّ مُيّز النظام الجديد باللون الأصفر، كي يسهل تمييز تلك الحقبة من عصر الإصلاح.
        - لوّنت النظام الجديد بالأصفر في خطّي الزمنيّ، لتتميّز تلك المرحلة بسهولة عن عهد الإصلاح.
      en:
        - In my timeline, the New Order is marked in yellow, so that period is easy to tell apart from the Reform era.
        - I marked the New Order in yellow on my timeline so it stands out clearly from the Reformasi era.
    words: [linimasa, Orde Baru]
    explain:
      ar_eg: supaya = عشان (الهدف). dibedakan = يتفرّق / يتميّز.
      ar: supaya = كي (الغاية)، وdibedakan = يُميَّز.
      en: supaya = so that; dibedakan = told apart.
dialogue:
  title: Linimasa di buku catatan
  lines:
    - speaker: Mohamed
      text: Pak, ini linimasa saya. Empat tonggak sejarah, dari proklamasi sampai 2004.
      ar_eg: يا أستاذ، ده الخط الزمني بتاعي. أربع علامات فارقة، من الإعلان لحد 2004.
      ar: يا أستاذ، هذا خطّي الزمني، أربعة معالم فارقة من الإعلان حتّى 2004.
      en: Sir, here's my timeline. Four milestones, from the proclamation to 2004.
    - speaker: Pak Hasan
      text: Rapi. Tapi antara 1966 dan 1998, tulis apa yang berubah.
      ar_eg: مترتّب. بس بين 1966 و1998، اكتب إيه اللي اتغيّر.
      ar: مرتّب، لكن اكتب ما تغيّر بين 1966 و1998.
      en: Neat. But between 1966 and 1998, write what changed.
    - speaker: Mohamed
      text: Masa Orde Baru panjang. Sejak Reformasi, pers menjadi lebih bebas.
      ar_eg: عصر النظام الجديد كان طويل. ومن وقت الإصلاح، الصحافة بقت أحرّ.
      ar: كان عهد النظام الجديد طويلًا، ومنذ الإصلاح صارت الصحافة أكثر حرّية.
      en: The New Order was long. Since Reformasi, the press has been freer.
    - speaker: Pak Hasan
      text: Nah, sekarang linimasamu bercerita, bukan hanya berhitung.
      ar_eg: أيوه، دلوقتي الخط الزمني بتاعك بيحكي، مش بس بيعدّ.
      ar: الآن صار خطّك الزمني يروي لا يعدّ فحسب.
      en: There, now your timeline tells a story instead of just counting.
