schema: kabar.lesson/v1
id: bipa7.u06.l02
language: id
title: Hoaks
can_do:
  ar_eg: تعرف علامات الخبر الكدب على الإنترنت وتقيّم الادّعاء.
  ar: أن تعرف علامات الخبر الكاذب على الإنترنت وتقيّم الادّعاء.
  en: Spot the signs of a hoax online and weigh a claim.
slides:
  - title: Pesan berantai
    body:
      ar_eg: |
        رسالة واتساب (متألّفة للدرس):
        "SEBARKAN!!! Air laut di Misool beracun mulai besok. Jangan makan ikan selama sebulan! Info dari teman yang kerja di dinas."
        علامات الـ hoaks (الخبر الكدب):
        - عنوان provokatif (مستفزّ) وحروف كبيرة وعلامات تعجّب.
        - بيطلب منك menyebarkan (تنشر) بسرعة.
        - المصدر «صاحب بيشتغل في الإدارة»، مش اسم ولا رابط.
        خبر زي ده menyesatkan (مضلّل)، وممكن يضرّ الصيادين. الـ berita palsu بيمشي أسرع من الحقيقة.
      ar: |
        رسالة واتساب (مؤلَّفة للدرس):
        "SEBARKAN!!! Air laut di Misool beracun mulai besok. Jangan makan ikan selama sebulan! Info dari teman yang kerja di dinas."
        علامات الـ hoaks (الخبر الكاذب):
        - عنوان provokatif (استفزازي) وحروف كبيرة وعلامات تعجّب.
        - يطلب منك menyebarkan (النشر) سريعًا.
        - المصدر «صديق يعمل في الإدارة»، بلا اسم ولا رابط.
        ومثل هذا الخبر menyesatkan (مضلِّل) وقد يضرّ الصيّادين، والـ berita palsu أسرع انتشارًا من الحقيقة.
      en: |
        A WhatsApp message (invented for the lesson):
        "SEBARKAN!!! Air laut di Misool beracun mulai besok. Jangan makan ikan selama sebulan! Info dari teman yang kerja di dinas."
        Signs of a hoaks (hoax):
        - A provokatif (inflammatory) headline, capital letters, exclamation marks.
        - It asks you to menyebarkan (spread) it fast.
        - The source is "a friend who works at the agency", no name, no link.
        News like this is menyesatkan (misleading) and can hurt fishermen. Berita palsu travels faster than the truth.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: hoaks
        ar_eg: خبر كدب / إشاعة
        ar: خبر كاذب
        en: hoax
      - text: menyebarkan
        ar_eg: ينشر
        ar: ينشر
        en: to spread
      - text: berita palsu
        ar_eg: خبر مزيّف
        ar: خبر مزيّف
        en: fake news
      - text: menyesatkan
        ar_eg: مضلّل
        ar: مضلِّل
        en: misleading
      - text: provokatif
        ar_eg: مستفزّ / بيهيّج
        ar: استفزازي
        en: inflammatory, provocative
    words: [hoaks, menyebarkan, berita palsu, menyesatkan, provokatif]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه أوضح علامة إن رسالة الواتساب دي hoaks؟
      ar: ما أوضح علامة على أنّ رسالة الواتساب هذه hoaks؟
      en: What's the clearest sign this WhatsApp message is a hoax?
    options:
      - إنها مكتوبة بالإندونيسي.
      - مصدرها «صاحب»، من غير اسم ولا رابط.
      - إنها عن البحر.
    answer: 1
    words: [hoaks]
  - id: e03
    type: fill_blank
    sentence: Jangan ___ pesan itu sebelum kamu memeriksanya.
    meaning:
      ar_eg: ماتنشرش الرسالة دي قبل ما تتأكّد منها.
      ar: لا تنشر تلك الرسالة قبل أن تتحقّق منها.
      en: Don't spread that message before you've checked it.
    options: [menyebarkan, menyesatkan, provokatif]
    answers: [menyebarkan]
    words: [menyebarkan]
  - id: e04
    type: listen
    text: Judul yang provokatif sering dipakai untuk menarik klik.
    question:
      ar_eg: ليه بيستعملوا عناوين مستفزّة؟
      ar: لماذا تُستعمل العناوين الاستفزازية؟
      en: Why are inflammatory headlines used?
    options:
      - علشان يجيبوا كليكات.
      - علشان يشرحوا العلم.
      - علشان يهدّوا الناس.
    answer: 0
    words: [provokatif]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الخبر المزيّف بينتشر أسرع من الحقيقة.
      ar: ينتشر الخبر المزيّف أسرع من الحقيقة.
      en: Fake news spreads faster than the truth.
    answer: Berita palsu menyebar lebih cepat daripada kebenaran.
    distractors: [provokatif, hoaks]
    words: [berita palsu]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الخبر ده «menyesatkan»؟
      ar: لماذا يُعدّ هذا الخبر «menyesatkan»؟
      en: Why is this message "menyesatkan"?
    options:
      - علشان طويل.
      - علشان فيه صور.
      - علشان بيخلّي الناس تصدّق حاجة مش حقيقية وتتصرّف غلط.
    answer: 2
    words: [menyesatkan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الإشاعة دي مضلّلة وخطيرة.
      ar: هذا الخبر الكاذب مضلِّل وخطير.
      en: This hoax is misleading and dangerous.
    answers:
      - Hoaks ini menyesatkan dan berbahaya.
      - Hoaks itu menyesatkan dan berbahaya.
      - Hoaks ini menyesatkan serta berbahaya.
    words: [hoaks, menyesatkan]
  - id: e08
    type: speaking
    text: Saya tidak mau menyebarkan berita palsu.
    meaning:
      ar_eg: أنا مش عايز أنشر أخبار مزيّفة.
      ar: لا أريد أن أنشر أخبارًا مزيّفة.
      en: I don't want to spread fake news.
    words: [menyebarkan, berita palsu]
  - id: e09
    type: dictation
    text: Judul berita itu provokatif dan isinya menyesatkan.
    meaning:
      ar_eg: عنوان الخبر ده مستفزّ ومحتواه مضلّل.
      ar: عنوان ذلك الخبر استفزازي ومضمونه مضلِّل.
      en: That story's headline is inflammatory and its content misleading.
    words: [provokatif, menyesatkan]
  - id: e10
    type: translate
    direction: from_target
    source_text: Hoaks tentang laut beracun membuat nelayan kehilangan pembeli.
    answers_meaning:
      ar_eg:
        - الإشاعة عن البحر المسموم خلّت الصيادين يخسروا زباينهم.
        - الخبر الكدب عن سمّ البحر طيّر زباين الصيادين.
      ar:
        - أفقد الخبرُ الكاذب عن البحر المسموم الصيّادين زبائنهم.
        - خسر الصيّادون مشتريهم بسبب إشاعة البحر المسموم.
      en:
        - The hoax about a poisoned sea made fishermen lose their buyers.
        - The poisoned-sea hoax cost the fishermen their customers.
    words: [hoaks]
dialogue:
  title: Grup WhatsApp desa
  lines:
    - speaker: Kak Selvi
      text: Lihat pesan ini. Sudah dibagikan ke dua puluh grup sejak tadi pagi.
      ar_eg: بص على الرسالة دي. اتشيّرت في عشرين جروب من الصبح.
      ar: انظر إلى هذه الرسالة، نُشرت في عشرين مجموعة منذ الصباح.
      en: Look at this message. It's been shared to twenty groups since this morning.
    - speaker: Mohamed
      text: Judulnya provokatif sekali, dan sumbernya cuma "teman".
      ar_eg: عنوانها مستفزّ قوي، ومصدرها «صاحب» وبس.
      ar: عنوانها استفزازي جدًّا، ومصدرها «صديق» فقط.
      en: The headline is very inflammatory, and the source is just "a friend".
    - speaker: Kak Selvi
      text: Betul. Para nelayan sudah panik. Hoaks seperti ini menyesatkan banyak orang.
      ar_eg: صح. الصيادين اتخضّوا خلاص. إشاعة زي دي بتضلّل ناس كتير.
      ar: صحيح. ذُعر الصيّادون، فمثل هذه الإشاعة يضلّل كثيرين.
      en: Right. The fishermen are already panicking. Hoaxes like this mislead a lot of people.
    - speaker: Mohamed
      text: Kalau begitu, besok kita cek faktanya bersama-sama.
      ar_eg: يبقى بكرة نتأكّد من الحقيقة سوا.
      ar: إذن نتحقّق من الحقيقة معًا غدًا.
      en: Then tomorrow we'll fact-check it together.
