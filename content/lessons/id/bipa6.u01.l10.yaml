schema: kabar.lesson/v1
id: bipa6.u01.l10
language: id
title: Diskusi sastra
can_do:
  ar_eg: تتناقش في موضوع قصة وتقول تفسيرك وتسمع تفسير غيرك.
  ar: أن تناقش موضوع قصّة فتعرض تفسيرك وتصغي إلى تفسير غيرك.
  en: Discuss a story's theme, giving your reading and hearing other readings.
slides:
  - title: Tafsiran saya
    grammar: id.implicature
    body:
      ar_eg: |
        القصة الحلوة ليها أكتر من تفسير. اتكلم كده:
        - Saya menafsirkan … sebagai … = أنا بفسّر … على إنه …
        - … adalah simbol … = … رمز لـ …
        - Amanat cerpen ini adalah … = رسالة / عبرة القصة …
        - Cerpen ini punya akhir terbuka. = النهاية مفتوحة، والقارئ يكمّل.
        ولما حد يختلف معاك: Tafsiran Anda menarik, tetapi …
        - في الشارع: aku / -ku = saya (أنا)، tapi = tetapi (بس / لكن)، kayak = seperti (زي)، nunggu = menunggu (يستنّى).
      ar: |
        للقصّة الجيّدة أكثر من تفسير. قل:
        - Saya menafsirkan … sebagai … = أفسّر … على أنّه …
        - … adalah simbol … = … رمز لـ …
        - Amanat cerpen ini adalah … = عبرة القصّة …
        - Cerpen ini punya akhir terbuka. = نهايتها مفتوحة، يكملها القارئ.
        وإذا خالفك أحد: Tafsiran Anda menarik, tetapi …
        - في كلام الشارع: aku / -ku = saya (أنا)، tapi = tetapi (لكن)، kayak = seperti (مثل)، nunggu = menunggu (ينتظر).
      en: |
        A good story has more than one reading. Say:
        - Saya menafsirkan … sebagai … = I read … as …
        - … adalah simbol … = … is a symbol of …
        - Amanat cerpen ini adalah … = The story's message is …
        - Cerpen ini punya akhir terbuka. = It has an open ending; the reader finishes it.
        When someone disagrees: Tafsiran Anda menarik, tetapi …
        - On the street: aku / -ku = saya (I), tapi = tetapi (but), kayak = seperti (like), nunggu = menunggu (to wait).
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: menafsirkan
        ar_eg: يفسّر
        ar: يفسّر
        en: to interpret
      - text: simbol
        ar_eg: رمز
        ar: رمز
        en: symbol
      - text: amanat
        ar_eg: عبرة / رسالة
        ar: عبرة
        en: moral, message
      - text: akhir terbuka
        ar_eg: نهاية مفتوحة
        ar: نهاية مفتوحة
        en: open ending
    words: [menafsirkan, simbol, amanat, akhir terbuka]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: في «Kursi di Teras»، الكرسي الفاضي رمز لإيه؟
      ar: في «Kursi di Teras»، رمزُ ماذا الكرسيّ الفارغ؟
      en: In "Kursi di Teras", what is the empty chair a symbol of?
    options:
      - الفقر.
      - غياب الابن والشوق ليه.
      - الأثاث القديم.
    answer: 1
    words: [simbol]
  - id: e03
    type: fill_blank
    sentence: Saya ___ dua cangkir teh itu sebagai tanda maaf.
    meaning:
      ar_eg: أنا بفسّر فنجانين الشاي دول على إنهم علامة سماح.
      ar: أفسّر فنجاني الشاي علامةً على الصفح.
      en: I read those two cups of tea as a sign of forgiveness.
    options: [menafsirkan, amanat, simbol]
    answers: [menafsirkan]
    words: [menafsirkan]
  - id: e04
    type: listen
    text: Amanat cerpen ini adalah bahwa keluarga selalu menunggu kita pulang.
    question:
      ar_eg: إيه عبرة القصة؟
      ar: ما عبرة القصّة؟
      en: What is the story's message?
    options:
      - إن العيلة دايمًا مستنيانا نرجع.
      - إن السفر وحش.
      - إن الشاي لازم يتشرب سخن.
    answer: 0
    words: [amanat]
  - id: e05
    type: build_sentence
    source:
      ar_eg: النهاية المفتوحة بتخلّي القارئ يفكّر.
      ar: النهاية المفتوحة تجعل القارئ يفكّر.
      en: An open ending makes the reader think.
    answer: Akhir terbuka membuat pembaca berpikir.
    distractors: [simbol, amanat]
    words: [akhir terbuka]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: تفسيرك حلو، بس أنا شايفه بشكل تاني.
      ar: تفسيرك جميل، لكنّي أراه على نحو آخر.
      en: Your reading is interesting, but I see it differently.
    answers:
      - Tafsiran Anda menarik, tetapi saya melihatnya secara berbeda.
      - Tafsiranmu menarik, tetapi saya melihatnya dengan cara lain.
      - Tafsiran Anda menarik, tapi saya menafsirkannya secara berbeda.
      - Tafsiranmu bagus, tetapi saya melihatnya berbeda.
      - Tafsiranmu menarik, tapi aku melihatnya dengan cara lain.
      - Tafsiranmu menarik, tapi saya melihatnya dengan cara lain.
      - Tafsiranmu bagus, tapi aku melihatnya berbeda.
      - Tafsiranmu bagus, tapi saya melihatnya berbeda.
    words: [menafsirkan]
  - id: e07
    type: speaking
    text: Hujan dalam cerpen itu adalah simbol kesedihan, menurut saya.
    meaning:
      ar_eg: المطر في القصة دي رمز للحزن، في رأيي.
      ar: المطر في تلك القصّة رمز للحزن، في رأيي.
      en: The rain in that story is a symbol of sadness, in my view.
    words: [simbol]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: قصة من غير نهاية واضحة اسمها إيه؟
      ar: ماذا تسمّى قصّة بلا خاتمة واضحة؟
      en: What do you call a story with no clear ending?
    options:
      - cerpen tanpa tokoh
      - cerpen tanpa latar
      - cerpen dengan akhir terbuka
    answer: 2
    words: [akhir terbuka, amanat]
  - id: e09
    type: dictation
    text: Setiap pembaca bisa menafsirkan cerpen itu secara berbeda.
    meaning:
      ar_eg: كل قارئ ممكن يفسّر القصة دي بشكل مختلف.
      ar: يمكن لكلّ قارئ أن يفسّر تلك القصّة تفسيرًا مختلفًا.
      en: Every reader can interpret that story differently.
    words: [menafsirkan]
  - id: e10
    type: match_pairs
    pairs:
      - text: kepergian
        ar_eg: رحيل
        ar: رحيل، ذهاب
        en: departure, leaving
      - text: hampa
        ar_eg: فاضي من جوه
        ar: فارغ، خاوٍ
        en: empty, hollow
      - text: nafkah
        ar_eg: لقمة العيش، المصروف
        ar: رزق، نفقة
        en: livelihood, support
      - text: bisikan
        ar_eg: همس، وشوشة
        ar: همس
        en: whisper
      - text: tersadar
        ar_eg: فاق، خد باله فجأة
        ar: أفاق، انتبه فجأة
        en: to come to, suddenly realise
    words: [kepergian, hampa, nafkah, bisikan, tersadar]
dialogue:
  title: Dua tafsiran
  lines:
    - speaker: Bang Togar
      text: Aku menafsirkan hujan itu sebagai simbol kesedihan ayah.
      ar_eg: أنا بفسّر المطر ده كرمز لحزن الأب.
      ar: أفسّر ذلك المطر رمزًا لحزن الأب.
      en: I read the rain as a symbol of the father's sadness.
    - speaker: Mohamed
      text: Tafsiranmu menarik, Bang. Tapi buatku, hujan itu membersihkan, kayak awal yang baru.
      ar_eg: تفسيرك حلو يا بانج. بس بالنسبة لي، المطر بيغسل، زي بداية جديدة.
      ar: تفسيرك جميل، لكنّ المطر عندي يطهّر، كبداية جديدة.
      en: Your reading is interesting, Bang. But for me, the rain cleans, like a new beginning.
    - speaker: Kak Mei
      text: Dua-duanya bisa benar. Akhirnya kan terbuka.
      ar_eg: الاتنين ممكن يبقوا صح. ما النهاية مفتوحة.
      ar: قد يصحّ التفسيران، فالنهاية مفتوحة.
      en: Both could be right. The ending is open, after all.
    - speaker: Mohamed
      text: 'Setuju. Amanatnya tetap sama: keluarga selalu nunggu.'
      ar_eg: موافق. والعبرة زي ما هي، العيلة دايمًا مستنية.
      ar: أوافق. والعبرة واحدة، فالأسرة تنتظر دائمًا.
      en: Agreed. The message stays the same; family always waits.
