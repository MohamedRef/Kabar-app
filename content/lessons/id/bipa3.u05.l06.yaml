schema: kabar.lesson/v1
id: bipa3.u05.l06
language: id
title: Foto dan telepon
can_do:
  ar_eg: تبعت صور الرحلة أونلاين، تحفظ وتمسح ملفات، وتكلم أهلك في التليفون.
  ar: أن ترسل صور الرحلة عبر الإنترنت، وتحفظ الملفات وتحذفها، وتتصل بأهلك.
  en: Send trip photos online, save and delete files, and phone home.
slides:
  - title: Di HP
    body:
      ar_eg: |
        online = أونلاين، على النت. akun = أكاونت، حساب. klik = يدوس، كليك. file = ملف.
        menyimpan = يحفظ، يخزّن. menghapus = يمسح. mengirimkan = يبعت (حاجة لحد).
        menelepon = يتصل بالتليفون: Saya menelepon ibu saya.
      ar: |
        online = متصل بالإنترنت. akun = حساب. klik = ينقر. file = ملف.
        menyimpan = يحفظ، يخزّن. menghapus = يحذف، يمسح. mengirimkan = يرسل (شيئًا لأحد).
        menelepon = يتصل هاتفيًا: Saya menelepon ibu saya.
      en: |
        online = online. akun = account. klik = click. file = file.
        menyimpan = save, keep. menghapus = delete, erase. mengirimkan = send (something to someone).
        menelepon = phone, call: Saya menelepon ibu saya.
    examples:
      - text: Saya menyimpan foto-foto itu di laptop.
        ar_eg: حفظت الصور دي على اللابتوب.
        ar: حفظت تلك الصور على الحاسوب المحمول.
        en: I saved those photos on my laptop.
      - text: Klik di sini untuk membuat akun baru.
        ar_eg: دوس هنا عشان تعمل أكاونت جديد.
        ar: انقر هنا لإنشاء حساب جديد.
        en: Click here to make a new account.
      - text: Malam ini saya menelepon keluarga di Kairo.
        ar_eg: الليلة دي هكلم عيلتي في القاهرة.
        ar: سأتصل الليلة بعائلتي في القاهرة.
        en: Tonight I'm calling my family in Cairo.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: online
        ar_eg: أونلاين
        ar: متصل بالإنترنت
        en: online
      - text: akun
        ar_eg: أكاونت
        ar: حساب
        en: account
      - text: klik
        ar_eg: يدوس، كليك
        ar: ينقر
        en: click
      - text: file
        ar_eg: ملف
        ar: ملف
        en: file
    words: [online, akun, klik, file]
  - id: e02
    type: match_pairs
    pairs:
      - text: menyimpan
        ar_eg: يحفظ
        ar: يحفظ
        en: save
      - text: menghapus
        ar_eg: يمسح
        ar: يحذف
        en: delete
      - text: mengirimkan
        ar_eg: يبعت
        ar: يرسل
        en: send
      - text: menelepon
        ar_eg: يتصل
        ar: يتصل هاتفيًا
        en: phone
    words: [menyimpan, menghapus, mengirimkan, menelepon]
  - id: e03
    type: listen
    text: Jangan menghapus file itu! Saya belum menyimpannya.
    question:
      ar_eg: هي عايزاه يعمل إيه؟
      ar: ماذا تريد منه؟
      en: What does she want him to do?
    options: [يحفظ الملف, ما يمسحش الملف, يبعت الملف]
    answer: 1
    meaning:
      ar_eg: ما تمسحش الملف ده! أنا لسه ما حفظتوش.
      ar: لا تحذف ذلك الملف! لم أحفظه بعد.
      en: Don't delete that file! I haven't saved it yet.
    words: [menghapus, file, menyimpan]
  - id: e04
    type: fill_blank
    sentence: Saya ___ foto-foto Rinjani kepada Rina.
    meaning:
      ar_eg: أنا ___ صور رينجاني لرينا.
      ar: ___ صور رينجاني إلى رينا.
      en: I ___ the Rinjani photos to Rina.
    options: [mengirimkan, online, akun]
    answers: [mengirimkan]
    words: [mengirimkan, online, akun]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تكلم ماما وهي في مصر. بتعمل إيه؟
      ar: تريد أن تكلّم أمك في مصر. ماذا تفعل؟
      en: You want to talk to your mum in Egypt. What do you do?
    options: [menghapus, menelepon, klik]
    answer: 1
    explain:
      ar_eg: menelepon = يتصل بالتليفون.
      ar: menelepon = يتصل هاتفيًا.
      en: menelepon = to phone.
    words: [menelepon, menghapus, klik]
  - id: e06
    type: fill_blank
    sentence: Rina sedang ___. Dia membalas pesan saya.
    meaning:
      ar_eg: رينا ___ دلوقتي. بترد على رسالتي.
      ar: رينا ___ الآن. إنها تردّ على رسالتي.
      en: Rina is ___ now. She's answering my message.
    options: [online, file, menyimpan]
    answers: [online]
    words: [online, file, menyimpan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: اعمل أكاونت وبعدين دوس هنا.
      ar: أنشئ حسابًا ثم انقر هنا.
      en: Make an account, then click here.
    answer: Buat akun, lalu klik di sini.
    distractors: [file, menghapus]
    words: [akun, klik]
  - id: e08
    type: translate
    direction: from_target
    source_text: Saya menelepon ibu saya setiap hari Jumat.
    answers_meaning:
      ar_eg: [بكلم أمي كل يوم جمعة, بتصل بماما كل جمعة]
      ar: [أتصل بأمي كل يوم جمعة]
      en: [I phone my mother every Friday, I call my mum every Friday]
    words: [menelepon]
  - id: e09
    type: speaking
    text: Saya sudah menyimpan file ini dan mengirimkannya kepada Anda.
    meaning:
      ar_eg: أنا حفظت الملف ده وبعتهولك.
      ar: لقد حفظتُ هذا الملف وأرسلته إليك.
      en: I've saved this file and sent it to you.
    words: [menyimpan, file, mengirimkan]
  - id: e10
    type: multiple_choice
    question: Mau membuat akun baru? ___ di sini.
    options: [Akun, Online, Klik]
    answer: 2
    explain:
      ar_eg: klik = دوس، انقر.
      ar: klik = انقر.
      en: klik = click.
    words: [klik, akun, online]
dialogue:
  lines:
    - speaker: Mohamed
      text: Rina, saya sudah mengirimkan foto-foto dari Senaru. Sudah lihat?
      ar_eg: يا رينا، بعتلك صور سنارو. شفتيها؟
      ar: يا رينا، أرسلت إليك صور سنارو. هل رأيتها؟
      en: Rina, I've sent you the photos from Senaru. Seen them?
    - speaker: Rina
      text: Belum. Saya baru online. Wah, air terjunnya indah!
      ar_eg: لسه. لسه داخلة أونلاين. الله، الشلال حلو!
      ar: ليس بعد. اتصلت بالإنترنت للتو. الشلال جميل!
      en: Not yet. I've only just come online. Wow, the waterfall's lovely!
    - speaker: Mohamed
      text: Simpan saja. Saya mau menghapusnya dari HP, memorinya penuh.
      ar_eg: احفظيها. عايز أمسحها من الموبايل، الذاكرة اتملت.
      ar: احفظيها. أريد حذفها من الهاتف، فالذاكرة ممتلئة.
      en: Save them. I want to delete them from my phone, the memory's full.
    - speaker: Rina
      text: Oke. Kamu sudah menelepon ibumu?
      ar_eg: ماشي. كلّمت مامتك؟
      ar: حسنًا. هل اتصلت بأمك؟
      en: OK. Have you phoned your mum?
    - speaker: Mohamed
      text: Sudah, tadi pagi. Dia mau saya membuat akun untuk dia juga!
      ar_eg: أيوه، الصبح. عايزاني أعملها أكاونت هي كمان!
      ar: نعم، هذا الصباح. تريدني أن أنشئ لها حسابًا أيضًا!
      en: Yes, this morning. She wants me to make her an account too!
