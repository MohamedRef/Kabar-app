schema: kabar.lesson/v1
id: bipa6.u05.l08
language: id
title: Gereja di Banda Aceh
can_do:
  ar_eg: تتكلم باحترام مع أقلية دينية في آتشيه عن الحياة الروحية والتعايش.
  ar: أن تتحدث باحترام مع أقلية دينية في آتشيه عن الحياة الروحية والتعايش.
  en: Talk respectfully with a religious minority in Aceh about spiritual life and living together.
slides:
  - title: Hidup berdampingan
    body:
      ar_eg: |
        آتشيه بتطبق الشريعة على المسلمين، وفيها برضه مسيحيين وبوذيين.
        penganut = تابع لدين (penganut Katolik). minoritas = أقلية. jemaat = رعية الكنيسة، جماعة المصلّين (من جماعة).
        misa = القداس (عند الكاثوليك). rohani = روحي (من روحاني). keagamaan = ديني (kegiatan keagamaan).
        berbaur = يختلط بالناس ويندمج. pengabdian = تفاني، خدمة بإخلاص (من abdi).
      ar: |
        تطبّق آتشيه الشريعة على المسلمين، وفيها أيضًا مسيحيون وبوذيون.
        penganut = تابع لدين (penganut Katolik). minoritas = أقلية. jemaat = رعية، جماعة المصلّين (من جماعة).
        misa = القدّاس (عند الكاثوليك). rohani = روحي (من روحاني). keagamaan = ديني (kegiatan keagamaan).
        berbaur = يختلط ويندمج. pengabdian = تفانٍ، خدمة مخلصة (من abdi).
      en: |
        Aceh applies sharia to Muslims; it also has Christians and Buddhists.
        penganut = follower of a faith (penganut Katolik). minoritas = minority. jemaat = congregation (from Arabic جماعة).
        misa = Mass (Catholic). rohani = spiritual (from Arabic روحاني). keagamaan = religious (kegiatan keagamaan).
        berbaur = to mingle, blend in. pengabdian = devoted service (from abdi).
    examples:
      - text: Penganut Katolik di Aceh adalah minoritas kecil.
        ar_eg: الكاثوليك في آتشيه أقلية صغيرة.
        ar: الكاثوليك في آتشيه أقلية صغيرة.
        en: Catholics in Aceh are a small minority.
      - text: Setiap Minggu, jemaat datang untuk misa pagi.
        ar_eg: كل حد، الرعية بتيجي لقداس الصبح.
        ar: تأتي الرعية كل أحد إلى قدّاس الصباح.
        en: Every Sunday the congregation comes to morning Mass.
      - text: Anak-anak mereka berbaur dengan tetangga.
        ar_eg: عيالهم بيختلطوا بالجيران.
        ar: يختلط أولادهم بالجيران.
        en: Their children mix with the neighbours.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: penganut
        ar_eg: تابع لدين
        ar: تابع، معتنق
        en: follower
      - text: minoritas
        ar_eg: أقلية
        ar: أقلية
        en: minority
      - text: jemaat
        ar_eg: رعية
        ar: رعية، جماعة
        en: congregation
      - text: misa
        ar_eg: قداس
        ar: قدّاس
        en: Mass
    words: [penganut, minoritas, jemaat, misa]
  - id: e02
    type: match_pairs
    pairs:
      - text: rohani
        ar_eg: روحي
        ar: روحي
        en: spiritual
      - text: keagamaan
        ar_eg: ديني
        ar: ديني
        en: religious
      - text: berbaur
        ar_eg: يختلط
        ar: يختلط، يندمج
        en: to mingle
      - text: pengabdian
        ar_eg: تفاني
        ar: تفانٍ
        en: devoted service
    words: [rohani, keagamaan, berbaur, pengabdian]
  - id: e03
    type: listen
    text: Misa Natal dimulai pukul enam sore.
    question:
      ar_eg: إيه اللي بيبدأ الساعة ستة؟
      ar: ما الذي يبدأ الساعة السادسة؟
      en: What starts at six?
    options: [القداس, الدرس, الفرح]
    answer: 0
    meaning:
      ar_eg: قداس الكريسماس بيبدأ الساعة ستة المغرب.
      ar: يبدأ قدّاس الميلاد الساعة السادسة مساءً.
      en: Christmas Mass begins at six in the evening.
    words: [misa]
  - id: e04
    type: fill_blank
    sentence: Di Aceh, umat Kristen adalah ___; jumlahnya sedikit.
    meaning:
      ar_eg: في آتشيه، المسيحيين ___؛ عددهم قليل.
      ar: في آتشيه المسيحيون ___؛ عددهم قليل.
      en: In Aceh, Christians are a ___; their numbers are small.
    options: [minoritas, jemaat, rohani]
    answers: [minoritas]
    words: [minoritas, jemaat, rohani]
    explain:
      ar_eg: عددهم قليل يبقى minoritas (أقلية). jemaat = جماعة المصلين وrohani = روحي.
      ar: العدد القليل minoritas (أقلّية)؛ أمّا jemaat فجماعة المصلّين، وrohani روحي.
      en: Few in number means minoritas, a minority. jemaat is a congregation, and rohani spiritual.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الكلمة اللي معناها روحي، وأصلها عربي؟
      ar: ما الكلمة التي تعني روحي، وأصلها عربي؟
      en: Which word means spiritual and comes from Arabic?
    options: [keagamaan, rohani, penganut]
    answer: 1
    explain:
      ar_eg: 'rohani من روحاني: kehidupan rohani = الحياة الروحية.'
      ar: 'rohani من روحاني: kehidupan rohani = الحياة الروحية.'
      en: 'rohani from Arabic روحاني: kehidupan rohani = spiritual life.'
    words: [rohani, keagamaan, penganut]
  - id: e06
    type: fill_blank
    sentence: Pastor itu sudah tiga puluh tahun melayani; ___-nya luar biasa.
    meaning:
      ar_eg: القسيس ده بيخدم بقاله تلاتين سنة؛ ___ بتاعه مدهش.
      ar: يخدم ذلك القس منذ ثلاثين عامًا؛ ___ه مدهش.
      en: The priest has served for thirty years; his ___ is remarkable.
    options: [pengabdian, misa, minoritas]
    answers: [pengabdian]
    words: [pengabdian, misa, minoritas]
    explain:
      ar_eg: تلاتين سنة خدمة = pengabdian (تفاني). misa = قدّاس وminoritas = أقلية.
      ar: ثلاثون عامًا من الخدمة pengabdian (تفانٍ)؛ أمّا misa فقدّاس، وminoritas أقلّية.
      en: Thirty years of service is pengabdian, devotion. misa is Mass, and minoritas a minority.
  - id: e07
    type: multiple_choice
    question: Pengajian, misa, dan kebaktian adalah kegiatan ___.
    options: [berbaur, jemaat, keagamaan]
    answer: 2
    explain:
      ar_eg: 'كلها أنشطة دينية: kegiatan keagamaan.'
      ar: 'كلّها أنشطة دينية: kegiatan keagamaan.'
      en: 'All are religious activities: kegiatan keagamaan.'
    words: [keagamaan, berbaur, jemaat]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الرعية بتصلّي مع بعض كل حد.
      ar: تصلّي الرعية معًا كل أحد.
      en: The congregation prays together every Sunday.
    answer: Jemaat berdoa bersama setiap hari Minggu.
    distractors: [misa, penganut]
    words: [jemaat]
    explain:
      ar_eg: «جماعة الكنيسة» = Jemaat و«بيصلوا مع بعض» = berdoa bersama. misa وpenganut مش في المعنى.
      ar: «جماعة الكنيسة» Jemaat و«يصلّون معًا» berdoa bersama؛ أمّا misa وpenganut فليستا في المعنى.
      en: "\"The congregation\" is Jemaat and \"pray together\" is berdoa bersama. misa and penganut aren't in the meaning."
  - id: e09
    type: translate
    direction: from_target
    source_text: Para penganut agama yang berbeda berbaur di pasar.
    answers_meaning:
      ar_eg: [أتباع الأديان المختلفة بيختلطوا في السوق, الناس من أديان مختلفة بيتخالطوا في السوق]
      ar: [يختلط أتباع الأديان المختلفة في السوق]
      en: [Followers of different religions mingle at the market, People of different faiths mix in the market]
    words: [penganut, berbaur]
  - id: e10
    type: speaking
    text: Kehidupan rohani dan pengabdian kepada sesama sama pentingnya.
    meaning:
      ar_eg: الحياة الروحية وخدمة الناس مهمين زي بعض.
      ar: الحياة الروحية وخدمة الآخرين سواء في الأهمية.
      en: Spiritual life and serving others matter equally.
    words: [rohani, pengabdian]
dialogue:
  lines:
    - speaker: Pak Yohanes
      text: Selamat pagi, Mohamed. Jemaat baru saja selesai misa.
      ar_eg: صباح الخير يا محمد. الرعية لسه مخلّصة القداس.
      ar: صباح الخير يا محمد. انتهت الرعية للتو من القدّاس.
      en: Good morning, Mohamed. The congregation has just finished Mass.
    - speaker: Mohamed
      text: Pagi, Pak. Bagaimana rasanya menjadi minoritas di Aceh?
      ar_eg: صباح النور. إحساسك إيه وإنت أقلية في آتشيه؟
      ar: صباح النور. كيف هو شعور الأقلية في آتشيه؟
      en: Morning, sir. What's it like being a minority in Aceh?
    - speaker: Pak Yohanes
      text: Ada aturan berbeda, tapi kami berbaur dengan tetangga Muslim.
      ar_eg: فيه قواعد مختلفة، بس إحنا مختلطين بجيرانا المسلمين.
      ar: ثمة قواعد مختلفة، لكننا نختلط بجيراننا المسلمين.
      en: There are different rules, but we mix with our Muslim neighbours.
    - speaker: Mohamed
      text: Di Mesir juga ada penganut Kristen Koptik. Kami bertetangga sejak lama.
      ar_eg: في مصر كمان فيه مسيحيين أقباط. وإحنا جيران من زمان.
      ar: في مصر أيضًا أتباع للمسيحية القبطية. نحن جيران منذ زمن.
      en: In Egypt there are Coptic Christians too. We've been neighbours for ages.
    - speaker: Pak Yohanes
      text: 'Itu kehidupan rohani yang sehat: saling menghormati.'
      ar_eg: 'هي دي الحياة الروحية السليمة: الاحترام المتبادل.'
      ar: 'تلك هي الحياة الروحية السليمة: الاحترام المتبادل.'
      en: 'That''s healthy spiritual life: mutual respect.'
