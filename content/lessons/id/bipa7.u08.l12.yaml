schema: kabar.lesson/v1
id: bipa7.u08.l12
language: id
title: Wawancara pengusaha
can_do:
  ar_eg: تعمل مقابلة مع صاحب مشروع عن بدايته ومشاكله ومكسبه.
  ar: أن تحاور صاحب مشروع عن بدايته وعقباته وأرباحه.
  en: Interview a business owner about their start, obstacles and profit.
slides:
  - title: Pertanyaan untuk pengusaha
    grammar: id.conjunction.intersentential
    body:
      ar_eg: |
        أسئلة مقابلة مع pengusaha (رجل/سيدة أعمال)، والإجابات متألّفة للدرس:
        - Bagaimana Mama merintis (بدأ من الصفر) usaha ini?
          Saya mulai dengan satu kompor. Akan tetapi, pesanan cepat bertambah.
        - Apa kendala (عقبة) terbesar?
          Ongkos kirim sagu mahal. Oleh sebab itu, saya membeli langsung dari petani.
        - Apakah laba (مكسب) sudah stabil?
          Sudah. Bahkan, saya bisa membayar sekolah lima keponakan.
        لاحظ إن الإجابات المترابطة بأدوات الربط بتبان أوضح وأقنع.
      ar: |
        أسئلة مقابلة مع pengusaha (صاحبة أعمال)، والأجوبة مؤلَّفة للدرس:
        - Bagaimana Mama merintis (أسّست من الصفر) usaha ini?
          Saya mulai dengan satu kompor. Akan tetapi, pesanan cepat bertambah.
        - Apa kendala (العقبة) terbesar?
          Ongkos kirim sagu mahal. Oleh sebab itu, saya membeli langsung dari petani.
        - Apakah laba (الربح) sudah stabil?
          Sudah. Bahkan, saya bisa membayar sekolah lima keponakan.
        لاحظ أنّ الأجوبة المربوطة بأدوات الربط أوضح وأقنع.
      en: |
        Interview questions for a pengusaha (entrepreneur), with answers invented for the lesson:
        - Bagaimana Mama merintis (start from scratch) usaha ini?
          Saya mulai dengan satu kompor. Akan tetapi, pesanan cepat bertambah.
        - Apa kendala (obstacle) terbesar?
          Ongkos kirim sagu mahal. Oleh sebab itu, saya membeli langsung dari petani.
        - Apakah laba (profit) sudah stabil?
          Sudah. Bahkan, saya bisa membayar sekolah lima keponakan.
        Notice how answers linked with connectors sound clearer and more convincing.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pengusaha
        ar_eg: رجل/سيدة أعمال
        ar: رائد أعمال
        en: entrepreneur
      - text: merintis
        ar_eg: يبدأ من الصفر
        ar: يؤسّس من الصفر
        en: to pioneer, start from scratch
      - text: kendala
        ar_eg: عقبة
        ar: عقبة
        en: obstacle
      - text: laba
        ar_eg: مكسب
        ar: ربح
        en: profit
    words: [pengusaha, merintis, kendala, laba]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه أكبر عقبة عند ماما إستر؟
      ar: ما أكبر عقبة لدى ماما إستر؟
      en: What is Mama Ester's biggest obstacle?
    options:
      - مافيش زباين.
      - مصاريف شحن السجو غالية.
      - مابتعرفش تطبخ.
    answer: 1
    words: [kendala]
    explain:
      ar_eg: أكبر مشكلة (kendala) عند ماما إستر مصاريف شحن السجو الغالية.
      ar: أكبر عائق لدى ماما إستر غلاء شحن الساغو.
      en: Her main kendala is costly sago shipping.
  - id: e03
    type: fill_blank
    sentence: Mama Ester ___ usaha kue sagu sejak tahun 2015.
    meaning:
      ar_eg: ماما إستر بدأت مشروع كيك السجو من الصفر من سنة 2015.
      ar: أسّست ماما إستر مشروع كعك الساغو منذ عام 2015.
      en: Mama Ester has been building her sago-cake business from scratch since 2015.
    options: [merintis, menyesuaikan, mencoblos]
    answers: [merintis]
    words: [merintis]
    explain:
      ar_eg: merintis usaha = بدأت مشروع من الصفر. menyesuaikan = يظبط وmencoblos = يخرّم ورقة التصويت.
      ar: merintis usaha = أسّست عملًا من الصفر. الآخران لا يناسبان.
      en: merintis means to build a business from scratch.
  - id: e04
    type: listen
    text: Laba usaha ini dipakai untuk membayar sekolah keponakan.
    question:
      ar_eg: مكسب المشروع بيروح فين؟
      ar: فيمَ يُنفق ربح المشروع؟
      en: What is the business's profit used for?
    options:
      - مصاريف مدارس ولاد إخواتها.
      - عربية جديدة.
      - سفر لجاكرتا.
    answer: 0
    words: [laba]
  - id: e05
    type: build_sentence
    source:
      ar_eg: سيدة الأعمال دي بتشغّل عشر ستات.
      ar: توظّف رائدة الأعمال هذه عشر نساء.
      en: This entrepreneur employs ten women.
    answer: Pengusaha ini mempekerjakan sepuluh perempuan.
    distractors: [laba, kendala]
    words: [pengusaha]
    explain:
      ar_eg: Pengusaha ini (رجل/ست الأعمال) + mempekerjakan (بتشغّل) + sepuluh perempuan. laba وkendala زيادة.
      ar: Pengusaha ini mempekerjakan sepuluh perempuan. laba وkendala زائدتان.
      en: Pengusaha ini + mempekerjakan + sepuluh perempuan. laba and kendala are extra.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي سؤال مناسب تسأله لسيدة أعمال عن البداية؟
      ar: أيّ سؤال يناسب سؤال صاحبة أعمال عن البداية؟
      en: Which question suits asking an entrepreneur about her start?
    options:
      - Berapa umur Mama?
      - Apa warna favorit Mama?
      - Bagaimana Mama merintis usaha ini?
    answer: 2
    words: [merintis, pengusaha]
    explain:
      ar_eg: "علشان تسأل عن البداية: Bagaimana Mama merintis usaha ini؟ (إزاي بدأتي المشروع؟). السن واللون أسئلة شخصية مش في الموضوع."
      ar: "للسؤال عن البداية: Bagaimana Mama merintis usaha ini؟"
      en: Ask about the start with merintis.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المكسب زاد السنة دي.
      ar: ارتفع الربح هذا العام.
      en: Profit went up this year.
    answers:
      - Labanya naik tahun ini.
      - Laba naik tahun ini.
      - Tahun ini labanya naik.
      - Labanya meningkat tahun ini.
    words: [laba]
  - id: e08
    type: speaking
    text: Setiap pengusaha pasti menghadapi kendala.
    meaning:
      ar_eg: كل صاحب مشروع لازم يقابل عقبات.
      ar: لا بدّ أن يواجه كلّ رائد أعمال عقبات.
      en: Every entrepreneur faces obstacles.
    words: [pengusaha, kendala]
  - id: e09
    type: dictation
    text: Kendala utama kami adalah ongkos kirim.
    meaning:
      ar_eg: أكبر عقبة عندنا هي مصاريف الشحن.
      ar: عقبتنا الكبرى تكلفة الشحن.
      en: Our main obstacle is shipping costs.
    words: [kendala]
  - id: e10
    type: translate
    direction: from_target
    source_text: Ia merintis usahanya dari dapur kecil. Bahkan, kini labanya cukup untuk membuka toko.
    answers_meaning:
      ar_eg:
        - بدأت مشروعها من مطبخ صغير. لا وكمان دلوقتي مكسبها يكفّي تفتح محل.
        - ابتدت من مطبخ صغير، ودلوقتي مكسبها بقى يكفّي محل كمان.
      ar:
        - أسّست مشروعها من مطبخ صغير، بل صار ربحها الآن يكفي لافتتاح متجر.
        - بدأت من مطبخ صغير، والآن يكفي ربحها لفتح متجر.
      en:
        - She started her business from a small kitchen. In fact, her profit is now enough to open a shop.
        - She began in a tiny kitchen, and now her profit even covers opening a shop.
    words: [merintis, laba]
dialogue:
  title: Dapur kue sagu
  lines:
    - speaker: Mohamed
      text: Mama Ester, boleh saya rekam wawancara ini untuk kelas Bu Frida?
      ar_eg: يا ماما إستر، ممكن أسجّل المقابلة دي لمحاضرة الدكتورة فريدة؟
      ar: يا ماما إستر، أتسمحين بتسجيل هذا الحوار لمحاضرة الدكتورة فريدا؟
      en: Mama Ester, may I record this interview for Bu Frida's class?
    - speaker: Mama Ester
      text: Boleh. Saya merintis usaha ini dengan satu kompor dan satu panci.
      ar_eg: ماشي. أنا بدأت المشروع ده بوابور واحد وحلّة واحدة.
      ar: نعم. أسّست هذا المشروع بموقد واحد وقدر واحدة.
      en: Sure. I started this business with one stove and one pot.
    - speaker: Mohamed
      text: Apa kendala terbesar waktu itu?
      ar_eg: إيه كانت أكبر عقبة ساعتها؟
      ar: ما كانت أكبر عقبة حينها؟
      en: What was the biggest obstacle back then?
    - speaker: Mama Ester
      text: Modal. Akan tetapi, mama-mama di gereja membantu. Sekarang labanya kami bagi bersama.
      ar_eg: رأس المال. بس ستات الكنيسة ساعدوني. ودلوقتي بنقسم المكسب سوا.
      ar: رأس المال. لكنّ نساء الكنيسة ساعدنني، والآن نتقاسم الربح معًا.
      en: Capital. However, the women at church helped. Now we share the profit together.
