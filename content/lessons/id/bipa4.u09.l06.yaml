schema: kabar.lesson/v1
id: bipa4.u09.l06
language: id
title: Menginap di desa peternak
can_do:
  ar_eg: 'توصف الحياة في قرية فيها مواشي: الميّه من البير، الرز، الدبان، والكهربا بالبطاريات.'
  ar: 'أن تصف الحياة في قرية لتربية المواشي: ماء البئر والأرز والذباب والكهرباء بالبطاريات.'
  en: 'Describe life in a livestock village: well water, rice, flies and battery power.'
slides:
  - title: Hidup sederhana
    body:
      ar_eg: |
        ternak = مواشي (sapi, kambing)، peternakan = مزرعة مواشي، beras = رز ني (لسه ما اتطبخش).
        sumur = بير، lalat = دبّانة، semut = نملة.
        baterai = بطارية، elektronik = إلكترونيات، أجهزة (barang elektronik).
      ar: |
        ternak = ماشية (sapi, kambing)، peternakan = مزرعة مواشٍ، beras = أرز غير مطبوخ.
        sumur = بئر، lalat = ذبابة، semut = نملة.
        baterai = بطارية، elektronik = إلكترونيات (barang elektronik).
      en: |
        ternak = livestock (sapi, kambing), peternakan = livestock farm, beras = (uncooked) rice.
        sumur = well, lalat = fly, semut = ant.
        baterai = battery, elektronik = electronics (barang elektronik).
    examples:
      - text: Keluarga Pak Johan punya peternakan sapi.
        ar_eg: عيلة أستاذ يوهان عندها مزرعة بقر.
        ar: لدى عائلة السيد يوهان مزرعة أبقار.
        en: Pak Johan's family has a cattle farm.
      - text: Kami mengambil air dari sumur.
        ar_eg: بنجيب الميّه من البير.
        ar: نأخذ الماء من البئر.
        en: We get water from the well.
      - text: Lampu ini pakai baterai, bukan listrik.
        ar_eg: اللمبة دي بالبطارية، مش بالكهربا.
        ar: يعمل هذا المصباح بالبطارية لا بالكهرباء.
        en: This lamp runs on batteries, not mains power.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ternak
        ar_eg: مواشي
        ar: ماشية
        en: livestock
      - text: peternakan
        ar_eg: مزرعة مواشي
        ar: مزرعة مواشٍ
        en: livestock farm
      - text: beras
        ar_eg: رز ني
        ar: أرز
        en: rice (uncooked)
      - text: sumur
        ar_eg: بير
        ar: بئر
        en: well
    words: [ternak, peternakan, beras, sumur]
  - id: e02
    type: match_pairs
    pairs:
      - text: lalat
        ar_eg: دبّانة
        ar: ذبابة
        en: fly
      - text: semut
        ar_eg: نملة
        ar: نملة
        en: ant
      - text: baterai
        ar_eg: بطارية
        ar: بطارية
        en: battery
      - text: elektronik
        ar_eg: إلكترونيات
        ar: إلكترونيات
        en: electronics
    words: [lalat, semut, baterai, elektronik]
  - id: e03
    type: listen
    text: Banyak lalat di dekat kandang ternak.
    question:
      ar_eg: فيه إيه كتير جنب الحظيرة؟
      ar: ماذا يكثر قرب الحظيرة؟
      en: What is there a lot of near the pen?
    options: [دبّان, نمل, نحل]
    answer: 0
    meaning:
      ar_eg: فيه دبّان كتير جنب حظيرة المواشي.
      ar: يكثر الذباب قرب حظيرة المواشي.
      en: There are lots of flies near the livestock pen.
    words: [lalat, ternak]
  - id: e04
    type: fill_blank
    sentence: Ibu membeli lima kilo ___ di pasar.
    meaning:
      ar_eg: ماما اشترت خمسة كيلو ___ من السوق.
      ar: اشترت أمي خمسة كيلوغرامات من ___ من السوق.
      en: Mum bought five kilos of ___ at the market.
    options: [beras, sumur, semut]
    answers: [beras]
    words: [beras, sumur, semut]
    explain:
      ar_eg: beras = رز ني، وبيتشترى بالكيلو. sumur = بير، وsemut = نمل.
      ar: beras = الأرز غير المطبوخ، ويُشترى بالكيلو. أما sumur فالبئر، وsemut النمل.
      en: beras is uncooked rice, bought by the kilo. sumur is a well, and semut are ants.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حشرة صغيرة بتحب السكر. ده إيه؟
      ar: حشرة صغيرة تحب السكر. ما هي؟
      en: A small insect that loves sugar. What is it?
    options: [baterai, semut, ternak]
    answer: 1
    explain:
      ar_eg: semut = نملة.
      ar: semut = نملة.
      en: semut = ant.
    words: [baterai, semut, ternak]
  - id: e06
    type: fill_blank
    sentence: Ponselnya mati karena ___ habis.
    meaning:
      ar_eg: الموبايل فصل عشان ___ خلصت.
      ar: انطفأ الهاتف لأن ___ نفدت.
      en: The phone died because the ___ ran out.
    options: [baterai, lalat, peternakan]
    answers: [baterai]
    words: [baterai, lalat, peternakan]
    explain:
      ar_eg: baterai = بطارية، ولما تخلص الموبايل يقفل. lalat = دبّان، وpeternakan = مزرعة مواشي.
      ar: baterai = البطارية، وبنفادها ينطفئ الهاتف. أما lalat فالذباب، وpeternakan مزرعة الماشية.
      en: baterai is the battery; when it runs out, the phone dies. lalat are flies, and peternakan is a livestock farm.
  - id: e07
    type: multiple_choice
    question: 'Toko itu menjual barang ___: televisi, radio, dan ponsel.'
    options: [sumur, beras, elektronik]
    answer: 2
    explain:
      ar_eg: elektronik = إلكترونيات.
      ar: elektronik = إلكترونيات.
      en: elektronik = electronics.
    words: [sumur, beras, elektronik]
  - id: e08
    type: build_sentence
    source:
      ar_eg: القرية دي فيها مزارع مواشي كتير.
      ar: في هذه القرية مزارع مواشٍ كثيرة.
      en: This village has many livestock farms.
    answer: Desa ini punya banyak peternakan.
    distractors: [elektronik, sumur]
    words: [peternakan, elektronik, sumur]
    explain:
      ar_eg: peternakan = مزارع مواشي. elektronik = إلكترونيات، وsumur = بير، ومش في الجملة.
      ar: peternakan = مزارع الماشية. أما elektronik فالإلكترونيات، وsumur البئر، وليسا في الجملة.
      en: peternakan are livestock farms. elektronik and sumur (well) aren't in the sentence.
  - id: e09
    type: translate
    direction: from_target
    source_text: Air sumur itu bersih, tapi banyak semut di dapur.
    answers_meaning:
      ar_eg: [ميّة البير دي نضيفة، بس فيه نمل كتير في المطبخ, البير ميّته نضيفة بس المطبخ مليان نمل]
      ar: [ماء ذلك البئر نظيف، لكن في المطبخ نمل كثير, البئر ماؤه نظيف غير أن المطبخ مليء بالنمل]
      en: ['The well water is clean, but there are lots of ants in the kitchen', 'The well''s water is clean, though the kitchen is full of ants']
    words: [sumur, semut]
  - id: e10
    type: speaking
    text: Baterai bekas dan barang elektronik jangan dibuang ke sumur.
    meaning:
      ar_eg: البطاريات القديمة والأجهزة الإلكترونية ما تترميش في البير.
      ar: لا تُرمَ البطاريات المستعملة والأجهزة الإلكترونية في البئر.
      en: Don't throw used batteries and electronics into the well.
    words: [baterai, elektronik, sumur, ternak, lalat, beras]
dialogue:
  lines:
    - speaker: Pak Johan
      text: Selamat datang di desa kami, Mohamed. Ini peternakan sapi keluarga saya.
      ar_eg: أهلًا بيك في قريتنا يا محمد. دي مزرعة البقر بتاعة عيلتي.
      ar: أهلًا بك في قريتنا يا محمد. هذه مزرعة أبقار عائلتي.
      en: Welcome to our village, Mohamed. This is my family's cattle farm.
    - speaker: Mohamed
      text: Ternaknya banyak! Airnya dari mana, Pak?
      ar_eg: المواشي كتير! الميّه منين يا أستاذ؟
      ar: ماشيتكم كثيرة! ومن أين الماء يا سيدي؟
      en: So many animals! Where does the water come from, sir?
    - speaker: Pak Johan
      text: Dari sumur. Listrik di sini belum stabil, jadi kami pakai baterai dan panel surya.
      ar_eg: من البير. الكهربا هنا لسه مش مستقرة، فبنستخدم بطاريات وألواح شمسية.
      ar: من البئر. الكهرباء هنا غير مستقرة بعد، فنستخدم البطاريات والألواح الشمسية.
      en: From the well. The power here isn't stable yet, so we use batteries and solar panels.
    - speaker: Mohamed
      text: Barang elektronik juga pakai baterai?
      ar_eg: والأجهزة الإلكترونية كمان بالبطارية؟
      ar: وهل تعمل الأجهزة الإلكترونية بالبطاريات أيضًا؟
      en: Do your electronics run on batteries too?
    - speaker: Pak Johan
      text: Iya. Nah, ayo makan. Nasinya dari beras kami sendiri. Awas, ada lalat!
      ar_eg: أيوه. يلا ناكل. الرز من رزنا إحنا. خلي بالك من الدبّان!
      ar: نعم. هيا نأكل، فالأرز من محصولنا. انتبه للذباب!
      en: Yes. Now, let's eat. The rice is from our own crop. Watch out for flies!
