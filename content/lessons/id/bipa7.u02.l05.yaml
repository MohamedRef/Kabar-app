      ar: غرس الطلّاب ألف شتلة على الساحل.
      en: The students planted a thousand seedlings on the coast.
    answer: Para siswa menanam seribu bibit di pesisir.
    distractors: [bakau, abrasi]
    words: [menanam, bibit, pesisir]
  - id: e06
