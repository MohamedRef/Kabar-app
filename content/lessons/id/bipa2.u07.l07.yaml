schema: kabar.lesson/v1
id: bipa2.u07.l07
language: id
title: Dada, lengan, jari
can_do:
  ar_eg: 'تقول أجزاء جسم أكتر في التمرين: الصدر والدراع والصوابع والوسط، والنفَس والعرق.'
  ar: 'أن تسمّي أجزاء جسم أكثر في التمرين: الصدر والذراع والأصابع والخصر، والنفَس والعرق.'
  en: 'Name more body parts during exercise: chest, arm, fingers, waist, plus breath and sweat.'
slides:
  - title: Badan kita
    body:
      ar_eg: |
        dada = صدر، lengan = دراع، jari = صباع (jari kaki = صباع رجل)، pinggang = وسط.
        kulit = جلد، darah = دم.
        napas = نفَس: Tarik napas! = خد نفس! وkeringat = عرق.
      ar: |
        dada = صدر، lengan = ذراع، jari = إصبع (jari kaki = إصبع القدم)، pinggang = خصر.
        kulit = جلد، darah = دم.
        napas = نفَس: Tarik napas! = خذ نفَسًا! وkeringat = عرق.
      en: |
        dada = chest, lengan = arm, jari = finger (jari kaki = toe), pinggang = waist.
        kulit = skin, darah = blood.
        napas = breath: Tarik napas! = breathe in! keringat = sweat.
    examples:
      - text: Tarik napas, angkat lengan!
        ar_eg: خد نفس، وارفع دراعاتك!
        ar: خذ نفَسًا وارفع ذراعيك!
        en: Breathe in, raise your arms!
      - text: Sesudah lari, badan saya penuh keringat.
        ar_eg: بعد الجري، جسمي كله عرق.
        ar: بعد الجري امتلأ جسمي بالعرق.
        en: After running I'm covered in sweat.
      - text: Jari saya kecil, lengan saya panjang.
        ar_eg: صوابعي صغيرة ودراعاتي طويلة.
        ar: أصابعي صغيرة وذراعاي طويلتان.
        en: My fingers are small, my arms are long.
