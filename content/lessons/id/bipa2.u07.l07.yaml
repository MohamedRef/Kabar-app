schema: kabar.lesson/v1
id: bipa2.u07.l07
language: id
title: Voli di pantai Kuta
can_do:
  ar_eg: 'تلعب فولي على الشط: الشورت والشراب، الدراع والصوابع والوسط، والجلد اللي احمر من الشمس، وتقارن بالباسكت.'
  ar: 'أن تلعب الطائرة على الشاطئ: السروال القصير والجوارب، والذراع والأصابع والخصر، والجلد المحمرّ من الشمس، وتقارن بالسلة.'
  en: 'Play beach volleyball: shorts and socks, arms, fingers and waist, sunburnt skin, and compare it with basketball.'
slides:
  - title: Voli pantai
    body:
      ar_eg: |
        voli = فولي (voli pantai = فولي شاطئ)، basket = باسكت.
        celana pendek = شورت، kaos kaki = شراب (حرفيًا «تيشيرت رجل»!).
        lengan = دراع، jari = صباع (jari kaki = صباع رجل)، pinggang = وسط.
        kulit = جلد: Kulit saya merah karena matahari.
        في الشارع بيقولوا:
        - nggak = tidak (مش، لأ)
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
      ar: |
        voli = الكرة الطائرة (voli pantai = الطائرة الشاطئية)، basket = كرة السلة.
        celana pendek = سروال قصير، kaos kaki = جوارب (حرفيًا «قميص القدم»!).
        lengan = ذراع، jari = إصبع (jari kaki = إصبع القدم)، pinggang = خصر.
        kulit = جلد: Kulit saya merah karena matahari.
        في كلام الشارع:
        - nggak = tidak (لا، ليس)
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
      en: |
        voli = volleyball (voli pantai = beach volleyball), basket = basketball.
        celana pendek = shorts, kaos kaki = socks (literally "foot T-shirt"!).
        lengan = arm, jari = finger (jari kaki = toe), pinggang = waist.
        kulit = skin: Kulit saya merah karena matahari.
        On the street:
        - nggak = tidak (not, no)
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
    examples:
      - text: Kami main voli pantai di Kuta.
        ar_eg: بنلعب فولي شاطئ في كوتا.
        ar: نلعب الكرة الطائرة الشاطئية في كوتا.
        en: We play beach volleyball in Kuta.
      - text: Pakai celana pendek, tidak usah kaos kaki.
        ar_eg: البس شورت، مش لازم شراب.
        ar: البس سروالًا قصيرًا، لا داعي للجوارب.
        en: Wear shorts; no need for socks.
      - text: Kulit saya merah karena matahari.
        ar_eg: جلدي احمر من الشمس.
        ar: احمرّ جلدي من الشمس.
        en: My skin is red from the sun.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: basket
        ar_eg: باسكت
        ar: كرة السلة
        en: basketball
      - text: voli
        ar_eg: فولي
        ar: الكرة الطائرة
        en: volleyball
      - text: kaos kaki
        ar_eg: شراب
        ar: جوارب
        en: socks
      - text: celana pendek
        ar_eg: شورت
        ar: سروال قصير
        en: shorts
    words: [basket, voli, kaos kaki, celana pendek]
  - id: e02
    type: match_pairs
    pairs:
      - text: lengan
        ar_eg: دراع
        ar: ذراع
        en: arm
      - text: jari
        ar_eg: صباع
        ar: إصبع
        en: finger
      - text: pinggang
        ar_eg: وسط
        ar: خصر
        en: waist
      - text: kulit
        ar_eg: جلد
        ar: جلد
        en: skin
    words: [lengan, jari, pinggang, kulit]
  - id: e03
    type: listen
    text: Angkat kedua lengan, lalu lompat!
    question:
      ar_eg: المدرب بيقول إيه؟
      ar: ماذا يقول المدرّب؟
      en: What does the coach say?
    options: [ارفع دراعاتك واتنطط, اقعد على الأرض, اجري بسرعة]
    answer: 0
    meaning:
      ar_eg: ارفع دراعاتك الاتنين، وبعدين اتنطط!
      ar: ارفع ذراعيك ثم اقفز!
      en: Raise both arms, then jump!
    words: [lengan]
  - id: e04
    type: fill_blank
    sentence: Untuk main bola, pakai ___ dan sepatu.
    meaning:
      ar_eg: عشان تلعب كورة، البس ___ وجزمة.
      ar: لتلعب الكرة، البس ___ وحذاءً.
      en: To play football, wear ___ and shoes.
    options: [kaos kaki, kulit, voli]
    answers: [kaos kaki]
    words: [kaos kaki, kulit, voli]
    explain:
      ar_eg: مع الجزمة بنلبس kaos kaki (شُرابات). kulit = جلد، وvoli لعبة.
      ar: مع الحذاء تُلبس kaos kaki. أما kulit فجلد وvoli لعبة.
      en: With shoes you wear kaos kaki (socks). kulit is skin, voli a sport.
  - id: e05
    type: multiple_choice
    question: Di pantai Kuta, orang main ___ pantai.
    options: [voli, basket, jari]
    answer: 0
    explain:
      ar_eg: voli pantai = فولي شاطئ.
      ar: voli pantai = الطائرة الشاطئية.
      en: voli pantai = beach volleyball.
    words: [voli, basket]
  - id: e06
    type: fill_blank
    sentence: Jangan lama di bawah matahari, nanti ___ kamu merah.
    meaning:
      ar_eg: 'ما تقعدش كتير في الشمس، جلدك هيحمر: ___.'
      ar: لا تبقَ طويلًا تحت الشمس وإلا احمرّ ___ك.
      en: Don't stay long in the sun, or your ___ will go red.
    options: [kulit, jari, pinggang]
    answers: [kulit]
    words: [kulit, jari, pinggang]
    explain:
      ar_eg: الشمس بتحمّر kulit (الجلد). jari صوابع، وpinggang وسط.
      ar: الشمس تُحمّر kulit. أما jari فأصابع وpinggang خصر.
      en: The sun reddens your kulit (skin). jari are fingers, pinggang the waist.
  - id: e07
    type: build_sentence
    source:
      ar_eg: إيدك على وسطك، وبعدين خد نفس.
      ar: يداك على خصرك، ثم خذ نفَسًا.
      en: Hands on your waist, then breathe in.
    answer: Tangan di pinggang, lalu tarik napas.
    distractors: [lengan, basket]
    words: [pinggang]
    explain:
      ar_eg: Tangan di pinggang = الإيد على الوسط. lengan (دراع) وbasket زيادة.
      ar: Tangan di pinggang = اليدان على الخصر. أما lengan وbasket فزائدتان.
      en: Tangan di pinggang = hands on hips. lengan (arm) and basket don't fit.
  - id: e08
    type: translate
    direction: from_target
    source_text: Panas sekali. Saya pakai celana pendek.
    answers_meaning:
      ar_eg: [الجو حر أوي. أنا لابس شورت, حر جدًا. هلبس شورت]
      ar: [الجو حارّ جدًا. ألبس سروالًا قصيرًا]
      en: ['It''s very hot. I''m wearing shorts', 'It''s so hot. I''ll wear shorts']
    words: [celana pendek]
  - id: e09
    type: speaking
    text: Saya suka main basket pakai celana pendek.
    meaning:
      ar_eg: بحب ألعب باسكت بالشورت.
      ar: أحبّ لعب السلة بسروال قصير.
      en: I like playing basketball in shorts.
    words: [basket, celana pendek]
  - id: e10
    type: multiple_choice
    question: Tangan saya punya lima ___.
    options: [jari, lengan, kaos kaki]
    answer: 0
    explain:
      ar_eg: 'الإيد فيها خمس صوابع: jari.'
      ar: 'في اليد خمسة أصابع: jari.'
      en: 'A hand has five fingers: jari.'
    words: [jari, lengan, kaos kaki]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, ayo main voli pantai!
      ar_eg: يا محمد، يلا نلعب فولي شاطئ!
      ar: يا محمد، هيّا نلعب الطائرة الشاطئية!
      en: Mohamed, let's play beach volleyball!
    - speaker: Mohamed
      text: Ayo! Aku pakai celana pendek. Kaos kaki juga?
      ar_eg: يلا! أنا لابس شورت. والشراب كمان؟
      ar: هيّا! ألبس سروالًا قصيرًا. والجوارب أيضًا؟
      en: Let's go! I'm in shorts. Socks too?
    - speaker: Ni Luh
      text: Nggak usah kaos kaki di pantai!
      ar_eg: مش لازم شراب على الشط!
      ar: لا داعي للجوارب على الشاطئ!
      en: No socks on the beach!
    - speaker: Mohamed
      text: Bolanya keras! Jariku merah.
      ar_eg: الكورة ناشفة! صوابعي احمرّت.
      ar: الكرة قاسية! احمرّت أصابعي.
      en: The ball's hard! My fingers are red.
    - speaker: Ni Luh
      text: Pakai lengan, jangan pakai jari.
      ar_eg: استعمل دراعك، ما تستعملش صوابعك.
      ar: استعمل ذراعك، لا أصابعك.
      en: Use your arms, not your fingers.
    - speaker: Mohamed
      text: Kulitku juga merah. Aku lebih suka basket!
      ar_eg: وجلدي احمر كمان. أنا بحب الباسكت أكتر!
      ar: وجلدي احمرّ أيضًا. أفضّل كرة السلة!
      en: My skin's red too. I prefer basketball!
