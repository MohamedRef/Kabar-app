        ar: سيل طيني بركاني
        en: lahar, volcanic mudflow
      - text: awan panas
        ar_eg: سحابة رماد سخنة بتنزل من البركان
        ar: سحابة بركانية حارقة
        en: pyroclastic flow
    words: [gunung api, erupsi, lahar, awan panas]
  - id: e02
    type: match_pairs
    pairs:
      - text: kaldera
        ar_eg: فوّهة بركان كبيرة متهدّمة
        ar: كالديرا، فوهة بركانية منهارة
        en: caldera
      - text: vulkanik
        ar_eg: بركاني
        ar: بركاني
        en: volcanic
      - text: belerang
        ar_eg: كبريت
        ar: كبريت
        en: sulphur
      - text: vulkanologi
        ar_eg: علم البراكين
        ar: علم البراكين
        en: volcanology
    words: [kaldera, vulkanik, belerang, vulkanologi]
  - id: e03
    type: listen
    text: Penambang di Kawah Ijen memikul belerang setiap pagi.
    question:
      ar_eg: بيشيلوا إيه؟
      ar: ماذا يحملون؟
      en: What do they carry?
    options: [كبريت, طين, رماد]
    answer: 0
    meaning:
      ar_eg: عمّال المنجم في كاوا إيجين بيشيلوا كبريت كل صبح.
      ar: يحمل عمّال المناجم في كاوا إيجين الكبريت كلّ صباح.
      en: Miners at Kawah Ijen carry sulphur every morning.
    words: [belerang]
  - id: e04
    type: fill_blank
    sentence: Tanah ___ di lereng Merapi sangat subur.
    meaning:
      ar_eg: الأرض الـ ___ على سفح ميرابي خصبة جدًا.
      ar: التربة ___ على سفح ميرابي خصبة جدًا.
      en: The ___ soil on Merapi's slopes is very fertile.
    options: [vulkanik, kaldera, lahar]
    answers: [vulkanik]
    words: [vulkanik, kaldera, lahar]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه «awan panas» أخطر من الرماد العادي؟
      ar: لماذا «awan panas» أخطر من الرماد العادي؟
      en: Why is 'awan panas' more dangerous than ordinary ash?
    options: [Karena warnanya putih., Karena turun sangat cepat dan sangat panas., Karena hanya ada di laut.]
    answer: 1
    explain:
      ar_eg: awan panas بتنزل بسرعة جامدة وحرارتها مئات الدرجات.
      ar: تنحدر awan panas بسرعة هائلة وحرارتها مئات الدرجات.
      en: Awan panas moves very fast at hundreds of degrees.
    words: [awan panas, erupsi]
  - id: e06
    type: fill_blank
    sentence: Dia belajar ___ supaya bisa membaca tanda-tanda erupsi.
    meaning:
      ar_eg: هي بتدرس ___ علشان تعرف تقرا علامات الثوران.
      ar: تدرس ___ لتتمكّن من قراءة علامات الثوران.
      en: She studies ___ so she can read the signs of an eruption.
    options: [vulkanologi, belerang, gunung api]
    answers: [vulkanologi]
    words: [vulkanologi, belerang, gunung api, erupsi]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الثوران بدأ بعد نص الليل.
      ar: بدأ الثوران بعد منتصف الليل.
      en: The eruption began after midnight.
    answer: Erupsi dimulai setelah tengah malam.
    distractors: [lahar, kaldera]
    words: [erupsi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Lahar dingin bisa datang berhari-hari setelah erupsi.
    answers_meaning:
      ar_eg: [سيل الطين البارد ممكن ييجي بعد الثوران بأيام, اللاهار البارد ممكن يوصل بعد أيام من الثوران]
      ar: [قد يأتي السيل الطيني البارد بعد الثوران بأيّام, يمكن أن يصل اللاهار البارد بعد الثوران بأيّام]
      en: [A cold lahar can come days after an eruption, Cold lahars can arrive several days after the eruption]
    words: [lahar, erupsi]
  - id: e09
    type: speaking
    text: Kaldera itu terbentuk dari gunung api yang runtuh.
    meaning:
      ar_eg: الكالديرا دي اتكوّنت من بركان اتهدّ.
      ar: تكوّنت تلك الكالديرا من بركان منهار.
      en: That caldera formed from a collapsed volcano.
    words: [kaldera, gunung api]
  - id: e10
    type: multiple_choice
    question: Apa yang paling berbahaya bagi desa di lembah sungai saat musim hujan?
    options: [Belerang di kawah., Buku vulkanologi., Lahar dari gunung api.]
    answer: 2
    explain:
      ar_eg: سيل الطين بيمشي في مجرى النهر لحد القرى.
      ar: يجري السيل الطيني في مجرى النهر حتى القرى.
      en: A lahar runs down the river valley into villages.
    words: [lahar, gunung api, belerang, vulkanologi, awan panas, vulkanik, kaldera]
dialogue:
  lines:
    - speaker: Petugas Pos
      text: Status gunung api ini naik ke Siaga sejak pagi.
      ar_eg: حالة البركان ده اتعلّت لمستوى «سياجا» من الصبح.
      ar: رُفع مستوى هذا البركان إلى «سياغا» منذ الصباح.
      en: This volcano went up to alert level Siaga this morning.
    - speaker: Mohamed
      text: Apakah erupsinya besar, Pak?
      ar_eg: الثوران كبير يا أستاذ؟
      ar: هل الثوران كبير يا سيّدي؟
      en: Is it a big eruption, sir?
    - speaker: Petugas Pos
      text: Belum. Tetapi awan panas sudah turun dua kilometer ke arah selatan.
      ar_eg: لسه. بس السحابة السخنة نزلت كيلومترين ناحية الجنوب.
      ar: ليس بعد، لكنّ سحابة حارقة انحدرت كيلومترين نحو الجنوب.
      en: Not yet. But a pyroclastic flow has already run two kilometres south.
    - speaker: Mohamed
      text: Kalau nanti hujan, bagaimana dengan lahar?
      ar_eg: ولو المطر نزل بعدين، إيه حكاية سيل الطين؟
      ar: وإن هطل المطر لاحقًا، فماذا عن السيل الطيني؟
      en: And if it rains later, what about lahars?
    - speaker: Petugas Pos
      text: Itu yang kami takutkan. Warga di dekat sungai harus mengungsi.
      ar_eg: ده اللي خايفين منه. الأهالي اللي جنب النهر لازم يسيبوا بيوتهم.
      ar: هذا ما نخشاه، وعلى سكّان ضفاف النهر أن ينزحوا.
      en: That's what we fear. People near the river must evacuate.
