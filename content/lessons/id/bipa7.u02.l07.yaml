schema: kabar.lesson/v1
id: bipa7.u02.l07
language: id
title: Gunung api aktif
can_do:
  ar_eg: تفهم تحذير عن بركان نشط وتشرح أخطاره.
  ar: أن تفهم تحذيرًا من بركان نشط وتشرح أخطاره.
  en: Understand a warning about an active volcano and explain its dangers.
slides:
  - title: Hidup di dekat gunung api
    body:
      ar_eg: |
        إندونيسيا فيها حوالي 127 gunung api نشط.
        erupsi = الثوران. awan panas = سحابة رماد وغاز سخنة جدًا بتنزل بسرعة على جنب الجبل.
        lahar = سيل طين ورماد، بييجي حتى بعد الثوران لما المطر ينزل (lahar dingin).
        kaldera = فوّهة ضخمة اتهدّت؛ بحيرة توبا جوّه kaldera.
        tanah vulkanik = أرض بركانية خصبة. belerang = كبريت، بيطلعوه من كاوا إيجين.
        vulkanologi = علم البراكين.
      ar: |
        في إندونيسيا نحو 127 gunung api نشطًا.
        erupsi = الثوران. awan panas = سحابة رماد وغاز شديدة الحرارة تنحدر بسرعة على سفح الجبل.
        lahar = سيل من الطين والرماد قد يأتي بعد الثوران حين يهطل المطر (lahar dingin).
        kaldera = فوهة ضخمة منهارة، وبحيرة توبا تقع داخل kaldera.
        tanah vulkanik = تربة بركانية خصبة. belerang = الكبريت، ويُستخرج من كاوا إيجين.
        vulkanologi = علم البراكين.
      en: |
        Indonesia has about 127 active gunung api (volcanoes).
        erupsi = eruption. awan panas = a scorching cloud of ash and gas racing down the slope.
        lahar = a mudflow of ash and water, which can come after an eruption when it rains (lahar dingin).
        kaldera = a huge collapsed crater; Lake Toba lies inside a kaldera.
        tanah vulkanik = fertile volcanic soil. belerang = sulphur, mined at Kawah Ijen.
        vulkanologi = volcanology.
    examples:
      - text: Awan panas turun dari puncak gunung api itu.
        ar_eg: سحابة سخنة نزلت من قمة البركان ده.
        ar: انحدرت سحابة حارقة من قمّة ذلك البركان.
        en: A pyroclastic flow came down from that volcano's summit.
      - text: Setelah hujan deras, warga waspada terhadap lahar.
        ar_eg: بعد المطر الجامد، الأهالي بيخلّوا بالهم من سيل الطين.
        ar: بعد المطر الغزير يحذر السكّان من السيل الطيني.
        en: After heavy rain, residents watch out for lahars.
      - text: Danau Toba berada di dalam kaldera raksasa.
        ar_eg: بحيرة توبا جوّه فوّهة بركان ضخمة.
        ar: تقع بحيرة توبا داخل كالديرا عملاقة.
        en: Lake Toba sits inside a giant caldera.
