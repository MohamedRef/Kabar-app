dialogue:
  lines:
    - speaker: Pak Irwan
      text: Mohamed, tadi pagi kamu ke mana?
      ar_eg: محمد، رحت فين الصبح؟
      ar: محمد، إلى أين ذهبت صباح اليوم؟
      en: Mohamed, where did you go this morning?
    - speaker: Mohamed
      text: Tadi pagi saya ke masjid, lalu sarapan.
      ar_eg: الصبح رحت الجامع، وبعدين فطرت.
      ar: صباحًا ذهبت إلى المسجد، ثم تناولت الفطور.
      en: This morning I went to the mosque, then had breakfast.
    - speaker: Pak Irwan
      text: Nanti malam kamu belajar?
      ar_eg: بالليل هتذاكر؟
      ar: هل ستدرس الليلة؟
      en: Will you study tonight?
    - speaker: Mohamed
      text: Ya, Pak. Sesudah makan malam.
      ar_eg: أيوه يا أستاذ. بعد العشا.
      ar: نعم يا أستاذ. بعد العشاء.
      en: Yes, sir. After dinner.
