schema: kabar.lesson/v1
id: bipa4.u04.l12
language: id
title: Ulangan Unit 4
can_do:
  ar_eg: "تتناقش في خبر: تلخصه، تقول أسبابه ونتايجه، وتدي رأيك."
  ar: "أن تناقش قضية إخبارية: تلخصها وتذكر أسبابها ونتائجها وتبدي رأيك."
  en: Discuss a news issue.
slides:
  - title: Sebab dan akibat
    body:
      ar_eg: |
        مراجعة سريعة:
        السبب: karena، berkat (حلو)، gara-gara (وحش، عامي)، akibat + اسم (وحش، رسمي).
        النتيجة: sehingga (جوه الجملة)، Akibatnya, / Oleh karena itu, (في أول جملة جديدة).
        ما تجمعش karena مع maka.
      ar: |
        مراجعة سريعة:
        السبب: karena، berkat (للمحمود)، gara-gara (للسلبي، عامية)، akibat + اسم (للسلبي، رسمية).
        النتيجة: sehingga داخل الجملة، وAkibatnya, / Oleh karena itu, في أول جملة جديدة.
        ولا تجمع بين karena وmaka.
      en: |
        Quick review:
        Cause: karena, berkat (good), gara-gara (bad, casual), akibat + noun (bad, formal).
        Effect: sehingga (inside the sentence), Akibatnya, / Oleh karena itu, (starting a new one).
        Don't pair karena with maka.
    grammar: id.conjunction.cause-effect
    examples:
      - text: Karena hujan deras, acara itu dibatalkan.
        ar_eg: عشان المطر الجامد، الحفلة اتلغت.
        ar: أُلغيت الفعالية بسبب الأمطار الغزيرة.
        en: Because of the heavy rain, the event was cancelled.
      - text: Tanggul rusak. Akibatnya, pasar terendam.
        ar_eg: السد باظ. ونتيجة لكده، السوق غرق.
        ar: تضرر السد، ونتيجةً لذلك غُمر السوق.
        en: The levee broke. As a result, the market flooded.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: akibatnya
        ar_eg: ونتيجة لكده
        ar: ونتيجةً لذلك
        en: as a result
      - text: berkat
        ar_eg: بفضل
        ar: بفضل
        en: thanks to
      - text: wartawan
        ar_eg: صحفي
        ar: صحفي
        en: journalist
      - text: narasumber
        ar_eg: مصدر
        ar: مصدر
        en: source
      - text: kebijakan
        ar_eg: سياسة / قرار حكومي
        ar: سياسة
        en: policy
      - text: dampak
        ar_eg: أثر
        ar: أثر
        en: impact
    words: [akibatnya, berkat, wartawan, narasumber, kebijakan, dampak]
  - id: e02
    type: multiple_choice
    question: ___ banjir, sekolah ditutup.
    question_meaning:
      ar_eg: … الفيضان، المدرسة اتقفلت.
      ar: … الفيضان أُغلقت المدرسة.
      en: … the flood, the school was closed.
    options: ["Berkat", "Akibat", "Sehingga"]
    answer: 1
    explain:
      ar_eg: الفيضان مش «بركة»، فـ berkat غلط. akibat + اسم = نتيجةً لـ.
      ar: الفيضان ليس «بركة» فلا تصح berkat، وakibat + اسم = نتيجةً لـ.
      en: A flood is no blessing, so not berkat; akibat + noun = as a result of.
    words: [berkat]
  - id: e03
    type: fill_blank
    sentence: Polisi sedang ___ kasus korupsi itu.
    meaning:
      ar_eg: البوليس ___ في قضية الفساد دي.
      ar: الشرطة ___ في قضية الفساد تلك.
      en: The police are ___ that corruption case.
    options: [menyelidiki, beredar, akurat]
    answers: [menyelidiki]
    words: [menyelidiki, beredar, akurat, korupsi]
    explain:
      ar_eg: sedang menyelidiki = بيحقق دلوقتي. beredar = منتشر، وakurat = دقيق، ومش أفعال للبوليس.
      ar: sedang menyelidiki = يحقق الآن. أما beredar فمتداول، وakurat دقيق، وليسا فعلين للشرطة.
      en: sedang menyelidiki means "is investigating". beredar (circulating) and akurat (accurate) aren't things the police do.
  - id: e04
    type: listen
    text: Menurut narasumber, ratusan warga mengungsi.
    options: ["Menurut narasumber, ratusan warga mengungsi.", "Menurut wartawan, ratusan warga mengungsi.", "Menurut narasumber, puluhan warga mengungsi."]
    answer: 0
    meaning:
      ar_eg: حسب كلام المصدر، مئات السكان نزحوا.
      ar: بحسب المصدر نزح مئات السكان.
      en: According to the source, hundreds of residents evacuated.
    words: [narasumber, mengungsi]
  - id: e05
    type: fill_blank
    sentence: Tanggul rusak. ___, pasar terendam.
    meaning:
      ar_eg: السد باظ. ونتيجة لكده، السوق غرق.
      ar: تضرر السد، ونتيجةً لذلك غُمر السوق.
      en: The levee broke. As a result, the market flooded.
    options: [Akibatnya, Berkat, Sehingga]
    answers: [Akibatnya]
    words: [akibatnya, terendam]
    explain:
      ar_eg: akibatnya = ونتيجة لكده، وبتبدأ جملة جديدة. berkat للحاجات الكويسة، وsehingga ماتبدأش جملة.
      ar: akibatnya = ونتيجة لذلك، وتبدأ جملة جديدة. أما berkat فللخير، وsehingga لا تبدأ الجملة.
      en: akibatnya means "as a result" and starts a new sentence. berkat is for good outcomes, and sehingga can't start a sentence.
  - id: e06
    type: fill_blank
    sentence: Berita itu dibaca secara ___ oleh ribuan orang.
    meaning:
      ar_eg: (اكتب الكلمة) الخبر ده اتقرا أونلاين من آلاف الناس.
      ar: (اكتب الكلمة) قرأ آلاف الناس ذلك الخبر عبر الإنترنت.
      en: (Type the word.) That story was read online by thousands of people.
    answers: [daring]
    words: [daring]
    explain:
      ar_eg: secara daring = أونلاين، وdaring اختصار dalam jaringan = على الشبكة.
      ar: secara daring = عبر الإنترنت، وdaring اختصار dalam jaringan = على الشبكة.
      en: secara daring means online; daring is short for dalam jaringan, "on the network".
  - id: e07
    type: build_sentence
    source:
      ar_eg: بفضل المنحة دي، بقت صحفية.
      ar: بفضل تلك المنحة أصبحت صحفية.
      en: Thanks to that scholarship, she became a journalist.
    answer: Berkat beasiswa itu, dia menjadi wartawan.
    distractors: [gara-gara, akibat]
    words: [berkat, beasiswa, wartawan]
    explain:
      ar_eg: berkat = بفضل، والمنحة نتيجتها كويسة. gara-gara وakibat للنتايج الوحشة.
      ar: berkat = بفضل، ونتيجة المنحة طيبة. أما gara-gara وakibat فللنتائج السيئة.
      en: berkat means "thanks to", and the scholarship led somewhere good. gara-gara and akibat are for bad outcomes.
  - id: e08
    type: match_pairs
    pairs:
      - text: edisi
        ar_eg: عدد، طبعة
        ar: عدد، طبعة
        en: edition
      - text: rumor
        ar_eg: إشاعة
        ar: إشاعة
        en: rumour
      - text: dikonfirmasi
        ar_eg: اتأكد
        ar: تأكّد
        en: confirmed
      - text: kementerian
        ar_eg: وزارة
        ar: وزارة
        en: ministry
      - text: insiden
        ar_eg: حادثة
        ar: حادثة
        en: incident
      - text: korupsi
        ar_eg: فساد
        ar: فساد
        en: corruption
    words: [edisi, rumor, dikonfirmasi, kementerian, insiden, korupsi]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: زبالة البلاستيك بتسبب فيضانات.
      ar: تسبب النفايات البلاستيكية الفيضانات.
      en: Plastic waste causes floods.
    answers:
      - Sampah plastik menyebabkan banjir.
      - Sampah plastik menyebabkan banjir
      - Sampah plastik dapat menyebabkan banjir.
      - Sampah plastik bisa menyebabkan banjir.
      - Sampah plastik mengakibatkan banjir.
    words: [menyebabkan]
  - id: e10
    type: speaking
    text: Di satu sisi, saya mendukung kebijakan ini. Di sisi lain, dampaknya harus dipikirkan.
    meaning:
      ar_eg: من ناحية، أنا مؤيد القرار ده. ومن ناحية تانية، لازم نفكر في أثره.
      ar: من جهة أؤيد هذه السياسة، ومن جهة أخرى ينبغي التفكير في أثرها.
      en: On the one hand, I support this policy. On the other, its impact must be considered.
    words: [mendukung, dampak]
dialogue:
  title: Membahas berita
  lines:
    - speaker: Kak Nirmala
      text: Mohamed, udah baca berita banjir hari ini?
      ar_eg: يا محمد، قريت خبر الفيضان النهارده؟
      ar: يا محمد، هل قرأت خبر الفيضان اليوم؟
      en: Mohamed, have you read today's flood story?
    - speaker: Mohamed
      text: Udah. Kata wartawan, saluran air tersumbat sampah plastik. Akibatnya, jalan terendam.
      ar_eg: أيوه. حسب الصحفي، مجاري المية اتسدت بزبالة البلاستيك. ونتيجة لكده، الشوارع غرقت.
      ar: نعم. بحسب الصحفي انسدت المجاري بالنفايات البلاستيكية، ونتيجةً لذلك غُمرت الشوارع.
      en: Yes. According to the journalist, the drains were blocked by plastic waste. As a result, the streets flooded.
    - speaker: Kak Nirmala
      text: Oleh karena itu, pemerintah membuat kebijakan baru. Kantong plastik dilarang di pasar.
      ar_eg: عشان كده، الحكومة عملت قرار جديد. الأكياس البلاستيك ممنوعة في السوق.
      ar: "لذلك وضعت الحكومة سياسة جديدة: يُمنع استعمال الأكياس البلاستيكية في السوق."
      en: So the government made a new policy. Plastic bags are banned at the market.
    - speaker: Mohamed
      text: Aku mendukung. Tapi pedagang kecil mungkin nggak setuju.
      ar_eg: أنا مؤيد. بس التجار الصغيرين ممكن يرفضوا.
      ar: أنا أؤيدها، لكن صغار التجار قد يرفضونها.
      en: I support it. But small traders might oppose it.
    - speaker: Kak Nirmala
      text: Itu dampak yang harus dipikirkan. Berita yang baik selalu melihat dua sisi.
      ar_eg: ده أثر لازم نفكر فيه. الخبر الكويس دايمًا بيشوف الناحيتين.
      ar: هذا أثر ينبغي التفكير فيه، فالخبر الجيد يرى الجانبين دائمًا.
      en: That's an impact to think about. Good news reporting always looks at both sides.
souvenir:
  id: bipa4.u04.souvenir
  title: Kota kelahiran B. J. Habibie
  note:
    ar_eg: باريباريه هي البلد اللي اتولد فيها الرئيس حبيبي، المهندس اللي اشتغل في الطيارات في ألمانيا قبل ما يرجع يخدم بلده. لما بقى رئيس سنة ١٩٩٨، فتح الباب لحرية الصحافة، والجرايد والإذاعات زادت بشكل كبير. وفي باريباريه لسه فيه تمثال لحبيبي ومراته عينون، والناس بتزوره كرمز للحب الصادق.
    ar: باريباري مسقط رأس الرئيس حبيبي، المهندس الذي عمل في صناعة الطائرات بألمانيا قبل أن يعود لخدمة بلاده. ولما تولى الرئاسة عام ١٩٩٨ فتح الباب لحرية الصحافة، فتكاثرت الصحف والإذاعات. وفي باريباري نصب تذكاري لحبيبي وزوجته عينون، يزوره الناس رمزًا للحب الوفي.
    en: Parepare is the birthplace of President Habibie, the aircraft engineer who worked in Germany before coming home to serve his country. As president from 1998 he opened the door to press freedom, and newspapers and radio stations multiplied. A monument to Habibie and his wife Ainun stands in Parepare, visited as a symbol of true love.
