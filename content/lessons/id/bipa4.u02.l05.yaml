schema: kabar.lesson/v1
id: bipa4.u02.l05
language: id
title: Pesanan yang mengecewakan
can_do:
  ar_eg: 'تشتكي من طلب أونلاين وحش: تلغيه، ترجّعه، وتطلب فلوسك.'
  ar: 'أن تشكو من طلب سيئ عبر الإنترنت: تلغيه وتعيده وتطالب بالمبلغ.'
  en: 'Complain about a bad online order: cancel it, send it back and ask for a refund.'
slides:
  - title: Barang tidak sesuai
    body:
      ar_eg: |
        mengecewakan = بيخيّب الأمل، memuaskan = يرضي، يبسط (pelayanan yang memuaskan).
        berkualitas = جودته عالية، rincian = التفاصيل (rincian pesanan = تفاصيل الطلب).
        dibatalkan = اتلغى، dikembalikan = اترجّع، kerugian = خسارة، terganggu = متضايق أو متعطّل.
      ar: |
        mengecewakan = مخيّب للآمال، memuaskan = مُرضٍ (pelayanan yang memuaskan).
        berkualitas = عالي الجودة، rincian = التفاصيل (rincian pesanan = تفاصيل الطلب).
        dibatalkan = أُلغي، dikembalikan = أُعيد، kerugian = خسارة، terganggu = منزعج أو متعطّل.
      en: |
        mengecewakan = disappointing, memuaskan = satisfying (pelayanan yang memuaskan).
        berkualitas = high-quality, rincian = details (rincian pesanan = order details).
        dibatalkan = cancelled, dikembalikan = returned, kerugian = loss, terganggu = disturbed, disrupted.
    examples:
      - text: Pelayanan toko itu sangat mengecewakan.
        ar_eg: خدمة المحل ده بتخيّب الأمل خالص.
        ar: خدمة ذلك المتجر مخيّبة للآمال جدًا.
        en: That shop's service is very disappointing.
      - text: Pesanan saya dibatalkan oleh toko.
        ar_eg: طلبي اتلغى من المحل.
        ar: ألغى المتجر طلبي.
        en: My order was cancelled by the shop.
      - text: Sepatu ini berkualitas dan harganya murah.
        ar_eg: الجزمة دي جودتها عالية وسعرها رخيص.
        ar: هذا الحذاء عالي الجودة وسعره رخيص.
        en: These shoes are good quality and cheap.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mengecewakan
        ar_eg: بيخيّب الأمل
        ar: مخيّب للآمال
        en: disappointing
      - text: memuaskan
        ar_eg: يرضي
        ar: مُرضٍ
        en: satisfying
      - text: berkualitas
        ar_eg: جودته عالية
        ar: عالي الجودة
        en: high-quality
      - text: rincian
        ar_eg: تفاصيل
        ar: تفاصيل
        en: details
    words: [mengecewakan, memuaskan, berkualitas, rincian]
  - id: e02
    type: match_pairs
    pairs:
      - text: dibatalkan
        ar_eg: اتلغى
        ar: أُلغي
        en: cancelled
      - text: dikembalikan
        ar_eg: اترجّع
        ar: أُعيد
        en: returned
      - text: kerugian
        ar_eg: خسارة
        ar: خسارة
        en: loss
      - text: terganggu
        ar_eg: متضايق، متعطّل
        ar: منزعج، متعطّل
        en: disturbed
    words: [dibatalkan, dikembalikan, kerugian, terganggu]
  - id: e03
    type: listen
    text: Uang Anda akan dikembalikan dalam tiga hari.
    question:
      ar_eg: هيحصل إيه للفلوس؟
      ar: ماذا سيحدث للمال؟
      en: What will happen to the money?
    options: [الفلوس هترجع, الطلب اتلغى, فيه خسارة]
    answer: 0
    meaning:
      ar_eg: فلوس حضرتك هترجعلك في تلات أيام.
      ar: ستُعاد أموالك خلال ثلاثة أيام.
      en: Your money will be returned within three days.
    words: [dikembalikan]
  - id: e04
    type: fill_blank
    sentence: Hasilnya bagus sekali. Saya sangat puas, pelayanannya ___.
    meaning:
      ar_eg: النتيجة حلوة جدًا. أنا مبسوط خالص، الخدمة ___.
      ar: النتيجة ممتازة. أنا راضٍ جدًا، فالخدمة ___.
      en: The result is great. I'm very pleased; the service is ___.
    options: [memuaskan, mengecewakan, terganggu]
    answers: [memuaskan]
    words: [memuaskan, mengecewakan, terganggu]
    explain:
      ar_eg: memuaskan = مُرضي، وده يناسب «أنا مبسوط جدًا». mengecewakan = مخيّب للأمل، وterganggu = اتعطّل.
      ar: memuaskan = مُرضٍ، ويناسب «أنا راضٍ جدًا». أما mengecewakan فمخيّب للآمال، وterganggu تعطّل.
      en: memuaskan means satisfying, matching "I'm very pleased". mengecewakan is disappointing, and terganggu is disrupted.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الطلب اتلغى. بالإندونيسي؟
      ar: أُلغي الطلب. بالإندونيسية؟
      en: The order was cancelled. In Indonesian?
    options: [Pesanan dikembalikan., Pesanan berkualitas., Pesanan dibatalkan.]
    answer: 2
    explain:
      ar_eg: dibatalkan = اتلغى. dikembalikan = اترجّع.
      ar: dibatalkan = أُلغي، dikembalikan = أُعيد.
      en: dibatalkan = cancelled; dikembalikan = returned.
    words: [dikembalikan, berkualitas, dibatalkan]
  - id: e06
    type: fill_blank
    sentence: Karena listrik mati, pekerjaan kami ___.
    meaning:
      ar_eg: عشان الكهربا قطعت، شغلنا ___.
      ar: لأن الكهرباء انقطعت، ___ عملنا.
      en: Because of the power cut, our work was ___.
    options: [terganggu, memuaskan, rincian]
    answers: [terganggu]
    words: [terganggu, memuaskan, rincian]
    explain:
      ar_eg: terganggu = اتعطّل أو اتأثر، وده اللي بيحصل لما النور يقطع. memuaskan = مُرضي، وrincian = تفاصيل.
      ar: terganggu = تعطّل أو تأثر، وهذا ما يحدث عند انقطاع الكهرباء. أما memuaskan فمُرضٍ، وrincian التفاصيل.
      en: terganggu means disrupted, which a power cut does. memuaskan is satisfying, and rincian are details.
  - id: e07
    type: multiple_choice
    question: Barangnya rusak, jadi toko itu harus membayar ___ saya.
    options: [rincian, kerugian, kualitasnya]
    answer: 1
    explain:
      ar_eg: kerugian = خسارة. membayar kerugian = يعوّض الخسارة.
      ar: kerugian = خسارة، وmembayar kerugian = يعوّض الخسارة.
      en: kerugian = loss; membayar kerugian = to cover a loss.
    words: [rincian, kerugian]
  - id: e08
    type: build_sentence
    source:
      ar_eg: لو سمحت ابعتلي تفاصيل الطلب.
      ar: من فضلك أرسل لي تفاصيل الطلب.
      en: Please send me the order details.
    answer: Tolong kirim rincian pesanan saya.
    distractors: [kerugian, dibatalkan]
    words: [rincian, kerugian, dibatalkan]
    explain:
      ar_eg: rincian pesanan = تفاصيل الطلب. kerugian = خسارة، وdibatalkan = اتلغى.
      ar: rincian pesanan = تفاصيل الطلب. أما kerugian فالخسارة، وdibatalkan أُلغي.
      en: rincian pesanan means order details. kerugian is a loss, and dibatalkan is cancelled.
  - id: e09
    type: translate
    direction: from_target
    source_text: Barangnya tidak berkualitas dan sangat mengecewakan.
    answers_meaning:
      ar_eg: [الحاجة جودتها وحشة وبتخيّب الأمل خالص, البضاعة مش كويسة ومخيّبة للأمل جدًا]
      ar: [البضاعة ليست جيدة الجودة ومخيّبة للآمال جدًا, السلعة رديئة الجودة ومخيبة جدًا للآمال]
      en: [The item is poor quality and very disappointing, 'The goods aren''t good quality and are really disappointing']
    words: [berkualitas, mengecewakan]
  - id: e10
    type: speaking
    text: Saya minta pesanan dibatalkan dan uang saya dikembalikan.
    meaning:
      ar_eg: عايز الطلب يتلغي وفلوسي ترجعلي.
      ar: أطلب إلغاء الطلب وإعادة مالي.
      en: I'd like the order cancelled and my money returned.
    words: [dibatalkan, dikembalikan, memuaskan, terganggu]
dialogue:
  lines:
    - speaker: Bu Hasnah
      text: Mohamed, kenapa kamu kecewa?
      ar_eg: يا محمد، مالك زعلان كده؟
      ar: يا محمد، لماذا أنت محبط؟
      en: Mohamed, why are you disappointed?
    - speaker: Mohamed
      text: Saya pesan jaket lewat internet, Bu. Yang datang kecil dan nggak berkualitas.
      ar_eg: طلبت جاكيت من النت. اللي جه صغير وجودته وحشة.
      ar: طلبت سترة عبر الإنترنت، فوصلت صغيرة ورديئة الجودة.
      en: I ordered a jacket online. What came is small and poor quality.
    - speaker: Bu Hasnah
      text: Wah, mengecewakan banget. Udah cek lagi apa yang kamu pesan?
      ar_eg: يا خبر، دي حاجة تخيّب الأمل. راجعت تاني إنت طالب إيه؟
      ar: يا للخيبة! هل راجعت ما طلبته مرة أخرى؟
      en: Oh, how disappointing. Did you check again what you ordered?
    - speaker: Mohamed
      text: Udah. Saya minta jaketnya dikembalikan, tapi tokonya diam aja.
      ar_eg: أيوه. طلبت أرجّع الجاكيت، بس المحل ساكت خالص.
      ar: نعم. طلبت إعادة السترة، لكن المتجر لم يقل شيئًا.
      en: Yes. I asked to send it back, but the shop just stays silent.
    - speaker: Bu Hasnah
      text: Tulis aja surat pembaca. Toko harus mengganti kerugianmu!
      ar_eg: اكتب رسالة للجرنال. المحل لازم يعوّضك عن خسارتك!
      ar: اكتب رسالة إلى الصحيفة. يجب أن يعوّضك المتجر عن خسارتك!
      en: Write a letter to the editor. The shop has to make up for your loss!
