language: id
title: Ulangan Unit 4
can_do:
  ar_eg: تقارن بين أنظمة تعليم وتنقل كلام الناس عنها.
  ar: أن تقارن بين أنظمة التعليم وتنقل ما يقوله الناس عنها.
  en: Compare education systems and report what people say about them.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: santri
        ar_eg: طالب معهد ديني
        ar: طالب معهد ديني
        en: pesantren student
      - text: beasiswa
        ar_eg: منحة دراسية
        ar: منحة دراسية
        en: scholarship
      - text: perbedaan
        ar_eg: فرق
        ar: فرق
        en: difference
      - text: menyarankan
        ar_eg: ينصح
        ar: ينصح
        en: to advise
      - text: kurikulum
        ar_eg: منهج
        ar: منهج
        en: curriculum
    words: [santri, beasiswa, perbedaan, menyarankan, kurikulum]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: المدرّس قال «Apakah kamu sudah daftar?». تنقلها إزاي؟
      ar: قال المعلّم «Apakah kamu sudah daftar?». كيف تنقلها؟
      en: The teacher said "Apakah kamu sudah daftar?". How do you report it?
    options:
      - Guru mengatakan agar saya sudah daftar.
      - Guru bertanya apakah saya sudah mendaftar.
      - Guru meminta bahwa saya sudah mendaftar.
    answer: 1
    words: [bertanya]
    explain:
      ar_eg: سؤال بـ apakah، فبنقول bertanya apakah. mengatakan agar وmeminta bahwa تركيبات غلط.
      ar: سؤال بـ apakah فننقله بـ bertanya apakah. أما mengatakan agar وmeminta bahwa فتركيبان خاطئان.
      en: A question with apakah becomes bertanya apakah. mengatakan agar and meminta bahwa are wrong pairings.
  - id: e03
    type: fill_blank
    sentence: Batas akhir ___ beasiswa adalah 31 Januari.
    meaning:
      ar_eg: آخر ميعاد للتسجيل في المنحة 31 يناير.
      ar: الموعد النهائي للتسجيل في المنحة 31 يناير.
      en: The scholarship registration deadline is 31 January.
    options: [pendaftaran, pelamar, persamaan]
    answers: [pendaftaran]
    words: [pendaftaran, beasiswa]
    explain:
      ar_eg: «التسجيل» = pendaftaran. pelamar = متقدم (شخص)، وpersamaan = تشابه.
      ar: «التسجيل» = pendaftaran. أما pelamar فالمتقدّم وهو شخص، وpersamaan التشابه.
      en: "\"Registration\" is pendaftaran. pelamar is the applicant, a person, and persamaan is similarity."
  - id: e04
    type: listen
    text: Katanya, santri di Tenggarong belajar kitab setiap malam.
    question:
      ar_eg: بيقولوا إيه عن طلاب المعهد؟
      ar: ماذا يقال عن طلّاب المعهد؟
      en: What is said about the students?
    options:
      - إنهم بيقروا في كتب التراث كل ليلة.
      - إنهم بيسافروا القاهرة كل سنة.
      - إنهم مابيدرسوش بالليل.
    answer: 0
    words: [katanya, santri]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الاتنين بيعلّموا العلم، بس الأزهر أكبر بكتير.
      ar: كلاهما يعلّم العلم، لكنّ الأزهر أكبر بكثير.
      en: Both teach knowledge, but Al-Azhar is much bigger.
    answer: Keduanya mengajarkan ilmu, tetapi Al-Azhar jauh lebih besar.
    distractors: [maupun, perbedaan]
    words: [keduanya, ilmu]
    explain:
      ar_eg: «الاتنين» = Keduanya، و«بس» = tetapi. maupun = وكمان، وperbedaan = فرق (اسم مش رابط).
      ar: «كلاهما» = Keduanya، و«لكنّ» = tetapi. أما maupun فأداة جمع، وperbedaan اسم «الفرق».
      en: "\"Both\" is Keduanya and \"but\" tetapi. maupun is \"as well as\", and perbedaan is the noun \"difference\"."
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هو قال إن المنحة دي للأجانب بس.
      ar: قال إنّ هذه المنحة مخصّصة للأجانب فقط.
      en: He said that this scholarship is only for foreigners.
    answers:
      - Beliau mengatakan bahwa beasiswa ini hanya untuk orang asing.
      - Dia mengatakan bahwa beasiswa ini hanya untuk orang asing.
      - Beliau mengatakan beasiswa ini hanya untuk orang asing.
      - Dia mengatakan bahwa beasiswa ini cuma untuk orang asing.
      - Beliau mengatakan bahwa beasiswa ini cuma untuk orang asing.
      - Beliau mengatakan beasiswa ini cuma untuk orang asing.
    words: [mengatakan, beasiswa]
  - id: e07
    type: match_pairs
    pairs:
      - text: seminar
        ar_eg: ندوة
        ar: ندوة
        en: seminar
      - text: teladan
        ar_eg: قدوة
        ar: قدوة
        en: role model
      - text: kedutaan
        ar_eg: سفارة
        ar: سفارة
        en: embassy
      - text: bacaan
        ar_eg: قراية
        ar: مادة للقراءة
        en: reading
      - text: betah
        ar_eg: مرتاح في المكان
        ar: مرتاح في المكان
        en: to feel at home
    words: [seminar, teladan, kedutaan, bacaan, betah]
  - id: e08
    type: listen
    text: 'Nasehat terakhir dari pesantren: walaupun ada gegar budaya dan kangen rumah, jangan lupa salat.'
    question:
      ar_eg: النصيحة إيه؟
      ar: ما النصيحة؟
      en: What is the advice?
    options: [ما ينساش الصلاة, يرجع بسرعة, يذاكر رياضة]
    answer: 0
    meaning:
      ar_eg: 'آخر نصيحة من البيسانترين: حتى لو فيه صدمة ثقافية والبيت واحشك، ما تنساش الصلاة.'
      ar: 'آخر نصيحة من المعهد: وإن واجهت صدمة ثقافية واشتقت إلى البيت، فلا تنسَ الصلاة.'
      en: 'The pesantren''s last advice: even with culture shock and homesickness, don''t forget to pray.'
    words: [nasehat, kangen, gegar budaya]
  - id: e09
    type: dictation
    text: Persamaannya, keduanya punya banyak alumni di Kairo.
    meaning:
      ar_eg: وجه الشبه إن الاتنين ليهم خريجين كتير في القاهرة.
      ar: وجه الشبه أنّ لكليهما خرّيجين كثيرين في القاهرة.
      en: The similarity is that both have many alumni in Cairo.
    words: [persamaan, keduanya, alumni]
  - id: e10
    type: speaking
    text: Para alumni menyarankan agar kami belajar bahasa Arab.
    meaning:
      ar_eg: الخريجين نصحونا نتعلم عربي.
      ar: نصحنا الخرّيجون بتعلّم العربية.
      en: The alumni advised us to learn Arabic.
    words: [alumni, menyarankan]
  - id: e11
    type: multiple_choice
    question: Para alumni sekolah negeri itu bertemu lagi dalam sebuah ___ di Kairo.
    options: [karantina, reuni, rumus]
    answer: 1
    explain:
      ar_eg: reuni = لمّة القدامى.
      ar: reuni = لقاء القدامى.
      en: reuni = reunion.
    words: [karantina, reuni, rumus, sekolah negeri]
  - id: e12
    type: fill_blank
    sentence: Pesantren tidak hanya mengajar, tetapi juga ___ santri.
    meaning:
      ar_eg: البيسانترين مش بيعلّم بس، ده كمان ___ الطلبة.
      ar: المعهد لا يعلّم فحسب، بل ___ الطلاب أيضًا.
      en: A pesantren doesn't only teach; it also ___ its students.
    options: [mendidik, seputar, kantin]
    answers: [mendidik]
    words: [mendidik, seputar, kantin]
    explain:
      ar_eg: «مش بيعلّم بس، كمان بيربّي» = mendidik. seputar = حوالين وkantin = كافيتريا، مش أفعال.
      ar: «لا يعلّم فحسب بل يربّي» = mendidik. أما seputar فـ«حول»، وkantin المقصف، وليسا فعلين.
      en: "Not only teaching but raising: mendidik. seputar (\"about\") and kantin (canteen) aren't verbs."
dialogue:
  title: Di Keraton Kutai Kartanegara
  lines:
    - speaker: Mas Rizal
      text: Ini museum Kutai. Katanya, kerajaan ini yang paling tua di Indonesia.
      ar_eg: ده متحف كوتاي. بيقولوا إن المملكة دي أقدم واحدة في إندونيسيا.
      ar: هذا متحف كوتاي، ويقال إنّ هذه المملكة أقدم ممالك إندونيسيا.
      en: This is the Kutai museum. They say this kingdom is the oldest in Indonesia.
    - speaker: Mohamed
      text: Serius? Tadi di museum ada tulisan yang umurnya lebih dari seribu lima ratus tahun.
      ar_eg: بجد؟ من شوية في المتحف كان فيه كتابة عمرها أكتر من ألف وخمسمية سنة.
      ar: حقًّا؟ رأينا في المتحف قبل قليل كتابة عمرها أكثر من ألف وخمسمئة سنة.
      en: Really? Earlier in the museum there was writing more than one thousand five hundred years old.
    - speaker: Mas Rizal
      text: Bener. Terus sekarang banyak santri dari sini kuliah di Kairo.
      ar_eg: مظبوط. ودلوقتي طلاب كتير من هنا بيدرسوا في القاهرة.
      ar: صحيح. واليوم يدرس كثير من طلّاب هذا المكان في القاهرة.
      en: Right. And now many students from here study in Cairo.
    - speaker: Mohamed
      text: Dari kerajaan kuno sampai Al-Azhar. Perbedaannya gede, tapi cinta belajarnya sama.
      ar_eg: من مملكة قديمة للأزهر. الفرق كبير، بس روح التعلم واحدة.
      ar: من مملكة قديمة إلى الأزهر؛ الفرق كبير لكنّ شغف العلم واحد.
      en: From an ancient kingdom to Al-Azhar. A big difference, but the same love of learning.
souvenir:
  id: bipa5.u04.souvenir
  title: Keraton Kutai Kartanegara
  note:
    ar_eg: في تينغارونغ، على نهر ماهاكام، فيه قصر سلطنة كوتاي كارتانيغارا، والنهارده بقى متحف. منطقة كوتاي فيها أقدم نقوش حجرية اتلقت في إندونيسيا، من حوالي القرن الرابع. وفي كاليمانتان زي جاوة، المعاهد الدينية (pesantren) منتشرة، وخريجين كتير منها بيكملوا في الأزهر، فلو قلت إنك من القاهرة هتلاقي حد يقولك «أنا درست في الحي العاشر!».
    ar: في تنغارونغ على نهر ماهاكام يقوم قصر سلطنة كوتاي كارتانيغارا، وقد صار متحفًا. وفي منطقة كوتاي أقدم نقوش حجرية عُثر عليها في إندونيسيا، من نحو القرن الرابع الميلادي. وتنتشر المعاهد الدينية في كاليمانتان كما في جاوة، ويواصل كثير من خرّيجيها الدراسة في الأزهر، فإن قلت إنك من القاهرة فقد يجيبك أحدهم «درستُ في الحيّ العاشر!».
    en: In Tenggarong, on the Mahakam, stands the palace of the Kutai Kartanegara sultanate, now a museum. The Kutai area holds the oldest stone inscriptions found in Indonesia, from around the fourth century. Pesantren are as common here as on Java, and many graduates go on to Al-Azhar, so say you're from Cairo and someone may answer "I studied in the Tenth District!"
