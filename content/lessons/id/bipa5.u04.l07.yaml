  - id: e03
    type: listen
    text: Orang tua yang baik mendidik anak dengan sabar.
    question:
      ar_eg: بيربوا ولادهم إزاي؟
      ar: كيف يربّيان الأولاد؟
      en: How do they bring up their children?
    options: [بصبر, بالضرب, بالفلوس]
    answer: 0
    meaning:
      ar_eg: الأهل الكويسين بيربوا ولادهم بصبر.
      ar: الوالدان الصالحان يربّيان أولادهما بصبر.
      en: Good parents bring up children patiently.
    words: [mendidik]
  - id: e04
    type: fill_blank
    sentence: Dalam Islam, Al-Qur'an adalah ___ yang diturunkan kepada Nabi Muhammad.
    meaning:
      ar_eg: في الإسلام، القرآن هو ال___ اللي نزل على النبي محمد.
      ar: في الإسلام، القرآن هو ال___ المنزل على النبي محمد.
      en: In Islam, the Qur'an is the ___ sent down to the Prophet Muhammad.
    options: [wahyu, pembelajaran, siswi]
    answers: [wahyu]
    words: [wahyu, pembelajaran, siswi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الحياة بعد الموت اسمها إيه بالإندونيسي؟
      ar: ما اسم الحياة بعد الموت بالإندونيسية؟
      en: What is the life after death called in Indonesian?
    options: [teladan, firman, akhirat]
    answer: 2
    explain:
      ar_eg: akhirat ← آخرة.
      ar: akhirat ← الآخرة.
      en: akhirat ← Arabic آخرة, the hereafter.
    words: [teladan, firman, akhirat]
  - id: e06
    type: fill_blank
    sentence: Seorang guru harus menjadi ___ bagi murid-muridnya.
    meaning:
      ar_eg: المدرس لازم يبقى ___ لتلاميذه.
      ar: على المعلّم أن يكون ___ لتلاميذه.
      en: A teacher should be a ___ for his pupils.
    options: [teladan, nasehat, mendidik]
    answers: [teladan]
    words: [teladan, nasehat, mendidik]
  - id: e07
    type: multiple_choice
    question: Metode ___ di pesantren itu sekarang memakai tablet.
    options: [akhirat, pembelajaran, wahyu]
    answer: 1
    explain:
      ar_eg: pembelajaran = التعلم والتدريس.
      ar: pembelajaran = التعلّم والتعليم.
      en: pembelajaran = learning and teaching.
    words: [akhirat, pembelajaran, wahyu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: التلميذات دول بيسمعوا نصيحة المدرسة.
      ar: تستمع هؤلاء التلميذات إلى نصيحة المعلّمة.
      en: These girls listen to their teacher's advice.
    answer: Para siswi itu mendengarkan nasehat ibu guru.
    distractors: [firman, teladan]
    words: [siswi, nasehat]
  - id: e09
    type: translate
    direction: from_target
    source_text: Firman Allah dibaca setiap pagi di pesantren.
    answers_meaning:
      ar_eg: [كلام ربنا بيتقري كل يوم الصبح في البيسانترين, بيقروا القرآن كل صبح في المعهد]
      ar: [يُقرأ كلام الله كل صباح في المعهد, يُتلى كلام الله كل صباح في المعهد الإسلامي]
      en: ['God''s word is read every morning at the pesantren', The word of God is recited every morning at the boarding school]
    words: [firman]
  - id: e10
    type: speaking
    text: Nasehat terbaik adalah teladan yang baik.
    meaning:
      ar_eg: أحسن نصيحة هي القدوة الكويسة.
      ar: أفضل نصيحة هي القدوة الحسنة.
      en: The best advice is a good example.
    words: [nasehat, teladan]
dialogue:
  lines:
    - speaker: Bu Hamidah
      text: Selamat datang di pesantren kami, Pak Mohamed.
      ar_eg: أهلًا بحضرتك في البيسانترين بتاعنا يا أستاذ محمد.
      ar: أهلًا بك في معهدنا يا أستاذ محمد.
      en: Welcome to our pesantren, Mohamed.
    - speaker: Mohamed
      text: Terima kasih, Bu. Ada berapa siswi di sini?
      ar_eg: شكرًا يا هانم. فيه كام تلميذة هنا؟
      ar: شكرًا يا سيّدتي. كم تلميذة هنا؟
      en: Thank you. How many girls study here?
    - speaker: Bu Hamidah
      text: Sekitar empat ratus. Kami mendidik mereka untuk dunia dan akhirat.
      ar_eg: حوالي أربعمية. بنربيهم للدنيا والآخرة.
      ar: نحو أربعمئة. نربّيهن للدنيا والآخرة.
      en: About four hundred. We educate them for this world and the hereafter.
    - speaker: Mohamed
      text: Apakah pembelajarannya hanya agama?
      ar_eg: التعليم هنا دين بس؟
      ar: هل التعليم هنا ديني فقط؟
      en: Is the teaching only religious?
    - speaker: Bu Hamidah
      text: 'Tidak. Ada sains dan bahasa juga. Tapi nasehat pertama kami selalu sama: jadilah teladan.'
      ar_eg: 'لأ. فيه علوم ولغات كمان. بس أول نصيحة بنقولها دايمًا واحدة: كوني قدوة.'
      ar: 'لا. هناك علوم ولغات أيضًا. لكن نصيحتنا الأولى دائمًا واحدة: كوني قدوة.'
      en: 'No. There''s science and languages too. But our first advice is always the same: be an example.'
    - speaker: Mohamed
      text: 'Banyak kata di sini dari bahasa Arab: nasehat, wahyu, akhirat!'
      ar_eg: 'كلمات كتير هنا أصلها عربي: نصيحة، وحي، آخرة!'
      ar: 'كلمات كثيرة هنا عربية الأصل: نصيحة ووحي وآخرة!'
      en: 'So many words here come from Arabic: nasehat, wahyu, akhirat!'
