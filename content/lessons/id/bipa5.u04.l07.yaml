schema: kabar.lesson/v1
id: bipa5.u04.l07
language: id
title: Nasehat dari pesantren
can_do:
  ar_eg: 'تتكلم عن التعليم في البيسانترين: النصيحة والقدوة، الوحي وكلام ربنا والآخرة، والتربية والتعلم.'
  ar: 'أن تتحدث عن التعليم في المعهد الإسلامي: النصيحة والقدوة، والوحي وكلام الله والآخرة، والتربية والتعلّم.'
  en: 'Talk about pesantren education: advice and role models, revelation, God''s word and the hereafter, and teaching and learning.'
slides:
  - title: Kata dari bahasa Arab
    body:
      ar_eg: |
        nasehat ← نصيحة (والكتابة الرسمية nasihat)، wahyu ← وحي، akhirat ← آخرة.
        firman = كلام ربنا (firman Allah)، teladan = قدوة: menjadi teladan = يبقى قدوة.
        mendidik = يربي ويعلم، pembelajaran = عملية التعلم والتدريس، siswi = تلميذة (siswa للولد أو للكل).
      ar: |
        nasehat ← نصيحة (الصيغة المعيارية nasihat)، wahyu ← وحي، akhirat ← آخرة.
        firman = كلام الله (firman Allah)، teladan = قدوة: menjadi teladan = يكون قدوة.
        mendidik = يربّي ويعلّم، pembelajaran = عملية التعلّم والتعليم، siswi = تلميذة (siswa للذكر أو للجميع).
      en: |
        nasehat ← Arabic نصيحة (standard spelling nasihat), wahyu ← وحي revelation, akhirat ← آخرة the hereafter.
        firman = the word of God (firman Allah), teladan = role model: menjadi teladan = to set an example.
        mendidik = to educate, bring up, pembelajaran = learning, teaching process, siswi = schoolgirl, female pupil (siswa for a boy or anyone).
    examples:
      - text: Nasehat guru itu masih saya ingat sampai sekarang.
        ar_eg: نصيحة الأستاذ دي لسه فاكرها لحد دلوقتي.
        ar: ما زلت أذكر نصيحة ذلك المعلّم حتى الآن.
        en: I still remember that teacher's advice.
      - text: Para siswi belajar tafsir firman Allah setiap pagi.
        ar_eg: التلميذات بيدرسوا تفسير كلام ربنا كل يوم الصبح.
        ar: تدرس التلميذات تفسير كلام الله كل صباح.
        en: The girls study the interpretation of God's word every morning.
      - text: Kiai itu menjadi teladan bagi para santri.
        ar_eg: الشيخ ده بقى قدوة للطلبة.
        ar: صار ذلك الشيخ قدوة للطلاب.
        en: That kiai became a role model for the students.
