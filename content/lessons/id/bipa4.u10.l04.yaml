  - id: e08
    type: speaking
    text: Hadirin yang terhormat, puji syukur kepada Tuhan atas festival yang indah ini.
    meaning:
      ar_eg: أيها الحضور المحترمين، الحمد والشكر لله على المهرجان الجميل ده.
      ar: أيها الحضور المحترمون، الحمد والشكر لله على هذا المهرجان الجميل.
      en: Honoured guests, praise and thanks to God for this beautiful festival.
    words: [hadirin, terhormat, puji syukur, Tuhan]
dialogue:
  title: Persiapan sambutan
  lines:
    - speaker: Mas Rizal
      text: Panitia festival meminta kamu memberikan sambutan singkat.
      ar_eg: لجنة المهرجان طالبة منك تقول كلمة ترحيب قصيرة.
      ar: طلبت لجنة المهرجان منك أن تلقي كلمة ترحيب قصيرة.
      en: The festival committee has asked you to give a short welcome speech.
    - speaker: Mohamed
      text: Wah! Bagaimana cara membukanya?
      ar_eg: ياه! أفتحها إزاي؟
      ar: يا إلهي! كيف أفتتحها؟
      en: Wow! How do I open it?
    - speaker: Mas Rizal
      text: Mulai dengan yang terhormat, lalu sapa semua hadirin.
      ar_eg: ابدأ بـ «حضرة المحترم»، وبعدين حيّي كل الحاضرين.
      ar: ابدأ بعبارة «حضرة المحترم»، ثم حيِّ جميع الحاضرين.
      en: Start with "the honourable", then greet everyone present.
    - speaker: Mohamed
      text: Lalu saya tutup dengan akhir kata dan terima kasih, ya?
      ar_eg: وبعدين أقفل بـ «وفي الختام» وشكرًا، صح؟
      ar: ثم أختم بـ «وفي الختام» والشكر، أليس كذلك؟
      en: And then I close with "in closing" and a thank-you, right?
