schema: kabar.lesson/v1
id: bipa4.u10.l04
language: id
title: Yang terhormat…
can_do:
  ar_eg: تفتح خطبة رسمية وتقفلها بالتعبيرات المظبوطة.
  ar: أن تفتتح خطابًا رسميًا وتختمه بالتعابير المناسبة.
  en: Open and close a formal speech with the right set phrases.
slides:
  - title: Pembukaan pidato
    body:
      ar_eg: |
        الخطبة الرسمية بتبدأ بالتحية للحاضرين حسب مقامهم:
        Yang terhormat … = حضرة … المحترم (terhormat من hormat، من العربي «حُرمة»).
        Hadirin yang berbahagia = أيها الحضور الكرام (hadirin من العربي «حاضرين»).
        وبعدين الحمد: Puji syukur kepada Tuhan Yang Maha Esa (syukur من «شكر»).
      ar: |
        يبدأ الخطاب الرسمي بتحية الحاضرين بحسب مقاماتهم:
        Yang terhormat … = حضرة … المحترم (terhormat من hormat، من العربية «حُرمة»).
        Hadirin yang berbahagia = أيها الحضور الكرام (hadirin من العربية «حاضرين»).
        ثم الحمد: Puji syukur kepada Tuhan Yang Maha Esa (syukur من «شكر»).
      en: |
        A formal speech opens by greeting everyone present, by rank:
        Yang terhormat … = The honourable … (terhormat from hormat, from Arabic «حُرمة»).
        Hadirin yang berbahagia = Dear guests (hadirin from Arabic «حاضرين»).
        Then the thanksgiving: Puji syukur kepada Tuhan Yang Maha Esa (syukur from «شكر»).
    examples:
      - text: Yang terhormat Bapak Wali Kota Tomohon, hadirin yang berbahagia.
        ar_eg: حضرة السيد عمدة توموهون المحترم، أيها الحضور الكرام.
        ar: حضرة السيد عمدة توموهون المحترم، أيها الحضور الكرام.
        en: The honourable Mayor of Tomohon, dear guests.
      - text: Puji syukur kepada Tuhan Yang Maha Esa.
        ar_eg: الحمد والشكر لله.
        ar: الحمد والشكر لله تعالى.
        en: Praise and thanks to God Almighty.
  - title: Isi dan penutup
    body:
      ar_eg: |
        Pada kesempatan ini, … = في المناسبة دي، … (kesempatan = فرصة / مناسبة)
        sambutan = كلمة ترحيب قصيرة في حفلة أو مهرجان.
        والقفلة: Akhir kata, … = وفي الختام، … (akhir من العربي «آخر»).
      ar: |
        Pada kesempatan ini, … = في هذه المناسبة، … (kesempatan = فرصة، مناسبة)
        sambutan = كلمة ترحيب قصيرة في حفل أو مهرجان.
        والختام: Akhir kata, … = وفي الختام، … (akhir من العربية «آخر»).
      en: |
        Pada kesempatan ini, … = On this occasion, … (kesempatan = opportunity, occasion)
        sambutan = a short welcome speech at an event.
        To close: Akhir kata, … = Finally, in closing, … (akhir from Arabic «آخر»).
    examples:
      - text: Terima kasih atas kesempatan yang diberikan kepada saya.
        ar_eg: شكرًا على الفرصة اللي اتدّت لي.
        ar: شكرًا على الفرصة التي مُنحت لي.
        en: Thank you for the opportunity given to me.
      - text: Akhir kata, terima kasih atas perhatian Anda.
        ar_eg: وفي الختام، شكرًا على حسن استماعكم.
        ar: وفي الختام، شكرًا لحسن إصغائكم.
        en: In closing, thank you for your attention.
