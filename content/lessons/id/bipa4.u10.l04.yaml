  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بعد ما تحيّي الحاضرين، إيه اللي بييجي عادةً في الخطبة الرسمية؟
      ar: بعد تحية الحاضرين، ما الذي يأتي عادةً في الخطاب الرسمي؟
      en: After greeting the guests, what usually comes next in a formal speech?
    options: ["Akhir kata, terima kasih.", "Puji syukur kepada Tuhan Yang Maha Esa.", "Sampai jumpa lagi!"]
    answer: 1
    words: [puji syukur, Tuhan]
  - id: e03
