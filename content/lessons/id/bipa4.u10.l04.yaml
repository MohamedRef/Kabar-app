    options: ["Yang terhormat Bapak Wali Kota dan hadirin yang berbahagia.", "Yang terhormat Ibu Wali Kota dan hadirin yang berbahagia.", "Yang terhormat Bapak Gubernur dan hadirin yang berbahagia."]
    answer: 0
    meaning:
      ar_eg: حضرة السيد العمدة المحترم وأيها الحضور الكرام.
      ar: حضرة السيد العمدة المحترم وأيها الحضور الكرام.
