        ar_eg: مشارك
        ar: مشارك
        en: participant
    words: [etika penelitian, persetujuan, kerahasiaan, izin penelitian, partisipan]
  - id: e02
    type: listen
    text: Partisipan boleh berhenti kapan saja tanpa alasan.
    question:
      ar_eg: المشارك يقدر يعمل إيه؟
      ar: ماذا يحقّ للمشارك؟
      en: What may a participant do?
    options:
      - ياخد فلوس أكتر.
      - يوقف في أي وقت من غير ما يقول السبب.
      - يكتب البحث بنفسه.
    answer: 1
    words: [partisipan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الـ «kerahasiaan» في البحث معناها إيه؟
      ar: ما معنى «kerahasiaan» في البحث؟
      en: What does "kerahasiaan" mean in research?
    options:
      - تنشر أسامي الناس كلها.
      - تبعت البيانات لأي حد.
      - تحافظ على سرّية الأسامي والبيانات.
    answer: 2
    words: [kerahasiaan]
  - id: e04
    type: fill_blank
    sentence: Peneliti asing harus punya ___ dari BRIN.
    meaning:
      ar_eg: الباحث الأجنبي لازم يبقى معاه تصريح بحث من BRIN.
      ar: على الباحث الأجنبيّ أن يحمل تصريح بحث من BRIN.
      en: A foreign researcher must have a research permit from BRIN.
    options: [izin penelitian, kerahasiaan, kuesioner]
    answers: [izin penelitian]
    words: [izin penelitian]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: قبل ما تسجّل مقابلة، لازم تاخد إيه؟
      ar: ما الذي يجب أخذه قبل تسجيل مقابلة؟
      en: What must you get before recording an interview?
    options:
      - موافقة المشارك.
      - صورة سيلفي.
      - فلوس من المشارك.
    answer: 0
    words: [persetujuan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: أخلاقيات البحث بتحمي المشاركين.
      ar: تحمي أخلاقيات البحث المشاركين.
      en: Research ethics protect participants.
    answer: Etika penelitian melindungi para partisipan.
    distractors: [izin, rahasia]
    words: [etika penelitian, partisipan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مش هكتب اسمك الحقيقي علشان السرّية.
      ar: لن أكتب اسمك الحقيقيّ حفاظًا على السرّية.
      en: I won't write your real name, for confidentiality.
    answers:
      - Saya tidak akan menulis nama asli Anda demi kerahasiaan.
      - Demi kerahasiaan, saya tidak akan menulis nama asli Bapak.
      - Saya tidak akan menulis nama asli Anda untuk menjaga kerahasiaan.
      - Demi kerahasiaan, saya tidak akan menuliskan nama asli Anda.
      - Saya nggak akan menulis nama asli Anda demi kerahasiaan.
      - Demi kerahasiaan, saya nggak akan menulis nama asli Bapak.
      - Saya nggak akan menulis nama asli Anda buat menjaga kerahasiaan.
      - Demi kerahasiaan, saya nggak akan menuliskan nama asli Anda.
    words: [kerahasiaan]
  - id: e08
    type: speaking
    text: Apakah Bapak memberikan persetujuan untuk wawancara ini direkam?
    meaning:
      ar_eg: حضرتك موافق إن المقابلة دي تتسجّل؟
      ar: أتوافق يا سيّدي على تسجيل هذه المقابلة؟
      en: Do you consent to this interview being recorded, sir?
    words: [persetujuan, rekaman]
  - id: e09
    type: dictation
    text: Etika penelitian dimulai dari sikap hormat kepada partisipan.
    meaning:
      ar_eg: أخلاقيات البحث بتبدأ من احترام المشاركين.
      ar: تبدأ أخلاقيات البحث باحترام المشاركين.
      en: Research ethics begin with respect for participants.
    words: [etika penelitian, partisipan]
  - id: e10
    type: speaking
    text: Izin penelitian saya sudah keluar, dan kepala kampung juga sudah memberi persetujuan.
    meaning:
      ar_eg: تصريح البحث بتاعي طلع، ورئيس القرية كمان وافق.
      ar: صدر تصريح بحثي، ووافق رئيس القرية أيضًا.
      en: My research permit has come through, and the village head has given consent too.
    words: [izin penelitian, persetujuan, kerahasiaan]
dialogue:
  title: Formulir di dalam honai
  lines:
    - speaker: Pak Elias
      text: Sebelum mulai, bacakan formulir persetujuan ini untuk Bapak Kogoya dalam bahasa yang sederhana.
      ar_eg: قبل ما نبدأ، اقرا استمارة الموافقة دي لعمّو كوجويا بلغة بسيطة.
      ar: قبل البدء، اقرأ استمارة الموافقة هذه على السيّد كوغويا بلغة بسيطة.
      en: Before we start, read this consent form to Bapak Kogoya in simple language.
    - speaker: Mohamed
      text: Bapak, nama Bapak tidak akan ditulis. Kerahasiaannya kami jaga. Bapak juga boleh berhenti kapan saja.
      ar_eg: يا عمّو، اسمك مش هيتكتب. هنحافظ على السرّية. وكمان من حقّك توقف في أي وقت.
      ar: يا سيّدي، لن يُكتب اسمك، وسنحفظ السرّية، ولك أن تتوقّف متى شئت.
      en: Sir, your name won't be written. We'll keep it confidential. You can also stop at any time.
    - speaker: Pak Elias
      text: Bagus. Bapak Kogoya bilang dia setuju, dan dia ingin cerita tentang kebun ubinya.
      ar_eg: حلو. عمّو كوجويا بيقول إنه موافق، وعايز يحكي عن جنينة البطاطا بتاعته.
      ar: جيّد. يقول السيّد كوغويا إنّه موافق، ويريد أن يحكي عن حقل البطاطا الحلوة.
      en: Good. Bapak Kogoya says he agrees, and he wants to talk about his sweet-potato garden.
    - speaker: Mohamed
      text: Terima kasih atas persetujuannya, Bapak. Kita mulai sekarang.
      ar_eg: شكرًا على موافقتك يا عمّو. يلا نبدأ.
      ar: شكرًا على موافقتك يا سيّدي، فلنبدأ الآن.
      en: Thank you for your consent, sir. Let's begin.
