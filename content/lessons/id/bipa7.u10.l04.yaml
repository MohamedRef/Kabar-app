schema: kabar.lesson/v1
id: bipa7.u10.l04
language: id
title: Etika penelitian
can_do:
  ar_eg: 'تشرح قواعد أخلاقيات البحث: الموافقة، السرّية، والتصريح.'
  ar: 'أن تشرح قواعد أخلاقيات البحث: الموافقة والسرّية والتصريح.'
  en: 'Explain the rules of research ethics: consent, confidentiality and permits.'
slides:
  - title: Sebelum bertanya, minta izin
    body:
      ar_eg: |
        الـ etika penelitian (أخلاقيات البحث) بتحمي الناس اللي بتدرسهم.
        1. persetujuan = موافقة: لازم الـ partisipan يفهم البحث ويوافق بنفسه، ومن حقّه ينسحب في أي وقت.
        2. kerahasiaan = السرّية: ماتكتبش أسامي حقيقية من غير إذن، واحفظ البيانات في مكان آمن.
        3. izin penelitian = تصريح البحث: الباحث الأجنبي محتاج تصريح من BRIN (هيئة البحث والابتكار الوطنية).
        وفي بابوا كمان: استأذن رئيس القرية والكبار قبل ما تبدأ.
      ar: |
        تحمي الـ etika penelitian (أخلاقيات البحث) الناس الذين تدرسهم.
        ١. persetujuan = الموافقة: يجب أن يفهم الـ partisipan البحث ويوافق بنفسه، وله الانسحاب متى شاء.
        ٢. kerahasiaan = السرّية: لا تكتب أسماء حقيقية دون إذن، واحفظ البيانات في مكان آمن.
        ٣. izin penelitian = تصريح البحث: يحتاج الباحث الأجنبيّ إلى تصريح من BRIN (الهيئة الوطنية للبحث والابتكار).
        وفي بابوا أيضًا: استأذن رئيس القرية وكبارها قبل البدء.
      en: |
        Etika penelitian (research ethics) protects the people you study.
        1. persetujuan = consent: the partisipan must understand the study and agree themselves, and may withdraw at any time.
        2. kerahasiaan = confidentiality: no real names without permission, and keep data somewhere safe.
        3. izin penelitian = research permit: a foreign researcher needs a permit from BRIN (the National Research and Innovation Agency).
        In Papua too: ask the village head and elders before you begin.
    examples:
      - text: Sebelum wawancara, Mohamed meminta persetujuan setiap partisipan.
        ar_eg: قبل المقابلة، محمد طلب موافقة كل مشارك.
        ar: قبل المقابلة طلب محمد موافقة كلّ مشارك.
        en: Before the interview, Mohamed asked each participant for consent.
