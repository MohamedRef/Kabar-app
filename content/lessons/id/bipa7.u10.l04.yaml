        ar_eg: أخلاقيات البحث
        ar: أخلاقيات البحث
        en: research ethics
      - text: persetujuan
        ar_eg: موافقة
        ar: موافقة
        en: consent
      - text: kerahasiaan
        ar_eg: سرّية
        ar: سرّية
        en: confidentiality
      - text: izin penelitian
        ar_eg: تصريح البحث
        ar: تصريح البحث
        en: research permit
