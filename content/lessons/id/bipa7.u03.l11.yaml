schema: kabar.lesson/v1
id: bipa7.u03.l11
language: id
title: Bercerita
can_do:
  ar_eg: تحكي حدّوتة بصوت عالي وتبني التشويق لحد الذروة.
  ar: أن تروي حكاية بصوت مسموع وتبني التشويق حتّى الذروة.
  en: Tell a story aloud and build tension up to the climax.
slides:
  - title: Naik, naik, lalu turun
    grammar: id.register.context
    body:
      ar_eg: |
        الـ dongeng (الحدّوتة) ليها شكل جبل:
        1. البداية: Alkisah, hiduplah seorang anak nelayan bernama Mambri.
        2. الـ ketegangan (التوتر / التشويق) بيزيد: Suatu malam, perahunya terseret arus ke laut lepas…
        3. الـ klimaks (الذروة): Tiba-tiba, seekor penyu raksasa muncul dari bawah perahu!
        4. الحل والنهاية: Penyu itu membawanya pulang, dan sejak itu warga tidak pernah memburu penyu.
        وانت بتـ mendongeng (تحكي): وطّي صوتك قبل الذروة، وسكت لحظة قبل «Tiba-tiba».
        (الحدّوتة متألّفة للدرس.)
        - في الكلام: udah = sudah، pelanin = pelankan.
      ar: |
        للـ dongeng (الحكاية) شكل الجبل:
        1. البداية: Alkisah, hiduplah seorang anak nelayan bernama Mambri.
        2. يتصاعد الـ ketegangan (التوتّر): Suatu malam, perahunya terseret arus ke laut lepas…
        3. الـ klimaks (الذروة): Tiba-tiba, seekor penyu raksasa muncul dari bawah perahu!
        4. الحلّ والخاتمة: Penyu itu membawanya pulang, dan sejak itu warga tidak pernah memburu penyu.
        وحين تـ mendongeng (تروي): اخفض صوتك قبل الذروة، وتوقّف لحظةً قبل «Tiba-tiba».
        (الحكاية مؤلَّفة للدرس.)
        - في الكلام اليومي: udah = sudah، pelanin = pelankan.
      en: |
        A dongeng (folk tale) is shaped like a mountain:
        1. Opening: Alkisah, hiduplah seorang anak nelayan bernama Mambri.
        2. Ketegangan (tension) rises: Suatu malam, perahunya terseret arus ke laut lepas…
        3. Klimaks (climax): Tiba-tiba, seekor penyu raksasa muncul dari bawah perahu!
        4. Resolution: Penyu itu membawanya pulang, dan sejak itu warga tidak pernah memburu penyu.
        When you mendongeng (tell tales): drop your voice before the climax and pause before "Tiba-tiba".
        (The tale is invented for the lesson.)
        - In speech: udah = sudah, pelanin = pelankan.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dongeng
        ar_eg: حدّوتة
        ar: حكاية
        en: folk tale, fairy tale
      - text: mendongeng
        ar_eg: يحكي حواديت
        ar: يروي الحكايات
        en: to tell tales
      - text: klimaks
        ar_eg: ذروة
        ar: ذروة
        en: climax
      - text: ketegangan
        ar_eg: توتر / تشويق
        ar: توتّر
        en: tension
    words: [dongeng, mendongeng, klimaks, ketegangan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة هي ذروة حدّوتة مامبري؟
      ar: أيّ جملة هي ذروة حكاية مامبري؟
      en: Which sentence is the climax of Mambri's tale?
    options:
      - Alkisah, hiduplah seorang anak nelayan.
      - Penyu itu membawanya pulang.
      - Tiba-tiba, seekor penyu raksasa muncul dari bawah perahu!
    answer: 2
    words: [klimaks]
  - id: e03
    type: fill_blank
    sentence: Suara pendongeng makin pelan, dan ___ di antara pendengar makin terasa.
    meaning:
      ar_eg: صوت الحكّاء بقى يوطى، والتوتر بين المستمعين بقى باين أكتر.
      ar: خفت صوت الحكّاء، فاشتدّ التوتّر بين المستمعين.
      en: The storyteller's voice grew quieter, and the tension among the listeners grew.
    options: [ketegangan, dongeng, klimaks]
    answers: [ketegangan]
    words: [ketegangan]
  - id: e04
    type: listen
    text: Setiap malam Jumat, Mama Ruth mendongeng untuk anak-anak di dermaga.
    question:
      ar_eg: ماما روث بتحكي حواديت إمتى وفين؟
      ar: متى وأين تروي ماما روث الحكايات؟
      en: When and where does Mama Ruth tell stories?
    options:
      - كل ليلة جمعة، على رصيف المراكب.
      - كل صبح، في المدرسة.
      - في رمضان بس، في الجامع.
    answer: 0
    words: [mendongeng]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الحدّوتة دي بتعلّم الأطفال يحترموا البحر.
      ar: تعلّم هذه الحكاية الأطفال احترام البحر.
      en: This tale teaches children to respect the sea.
    answer: Dongeng ini mengajarkan anak-anak menghormati laut.
    distractors: [klimaks, ketegangan]
    words: [dongeng]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيه أحسن حاجة تعملها قبل الذروة على طول؟
      ar: ما أفضل ما تفعله قبيل الذروة؟
      en: What's best to do just before the climax?
    options:
      - تعلّي صوتك وتسرّع.
      - توطّي صوتك وتسكت لحظة.
      - تقول النهاية الأول.
    answer: 1
    words: [klimaks]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: جدّي كان بيحكي حواديت كل ليلة.
      ar: كان جدّي يروي الحكايات كلّ ليلة.
      en: My grandfather used to tell stories every night.
    answers:
      - Kakek saya mendongeng setiap malam.
      - Dulu kakek saya mendongeng setiap malam.
      - Kakekku mendongeng setiap malam.
      - Kakek saya selalu mendongeng setiap malam.
    words: [mendongeng]
  - id: e08
    type: speaking
    text: Ketegangan naik pelan-pelan sampai klimaks cerita.
    meaning:
      ar_eg: التوتر بيطلع واحدة واحدة لحد ذروة الحكاية.
      ar: يتصاعد التوتّر رويدًا حتّى ذروة القصّة.
      en: The tension rises slowly up to the story's climax.
    words: [ketegangan, klimaks]
  - id: e09
    type: dictation
    text: Anak-anak diam mendengarkan dongeng tentang penyu raksasa.
    meaning:
      ar_eg: العيال ساكتين بيسمعوا حدّوتة السلحفاة العملاقة.
      ar: أنصت الأطفال صامتين إلى حكاية السلحفاة العملاقة.
      en: The children listened quietly to the tale of the giant turtle.
    words: [dongeng]
  - id: e10
    type: translate
    direction: from_target
    source_text: Pendongeng yang baik tahu kapan harus membangun ketegangan.
    answers_meaning:
      ar_eg:
        - الحكّاء الكويس عارف إمتى يبني التشويق.
        - الراوي الشاطر بيعرف إمتى يزوّد التوتر.
      ar:
        - يعرف الحكّاء الجيّد متى يبني التوتّر.
        - يدرك الراوي الماهر متى يصنع التشويق.
      en:
        - A good storyteller knows when to build tension.
        - A skilled storyteller knows when to build suspense.
    words: [ketegangan]
dialogue:
  title: Giliran Mohamed
  lines:
    - speaker: Mama Ruth
      text: Sekarang giliranmu mendongeng, Nak. Cerita dari Mesir, ya.
      ar_eg: دلوقتي دورك تحكي يا ابني. حدّوتة من مصر.
      ar: الآن دورك في الرواية يا بنيّ، حكاية من مصر.
      en: Now it's your turn to tell a tale, son. One from Egypt.
    - speaker: Mohamed
      text: Alkisah, ada seorang nelayan miskin di tepi Sungai Nil…
      ar_eg: يُحكى إنّ كان فيه صيّاد فقير على شط النيل…
      ar: يُحكى أنّ صيّادًا فقيرًا كان يعيش على ضفّة النيل…
      en: Once there was a poor fisherman on the bank of the Nile…
    - speaker: Mama Ruth
      text: Bagus! Pelanin suaramu sebelum klimaks. Lihat, anak-anak udah tegang.
      ar_eg: حلو! وطّي صوتك قبل الذروة. بص، العيال اتوتروا خلاص.
      ar: أحسنت! اخفض صوتك قبل الذروة. انظر، الأطفال متوتّرون.
      en: Good! Lower your voice before the climax. Look, the children are on edge.
    - speaker: Mohamed
      text: "Tiba-tiba… jala nelayan itu menarik sebuah botol tua!"
      ar_eg: وفجأة… شبكة الصيّاد طلّعت إزازة قديمة!
      ar: وفجأة… أخرجت شبكة الصيّاد زجاجة قديمة!
      en: Suddenly… the fisherman's net pulled up an old bottle!
