schema: kabar.lesson/v1
id: bipa5.u09.l02
language: id
title: Bahasa baku dan gaul
can_do:
  ar_eg: تفهم كلام الشباب العامي وتعرف تقابله بالفصيح.
  ar: أن تفهم عامّية الشباب وتقابلها بالفصحى الإندونيسية.
  en: Understand young people's slang and match it to standard Indonesian.
slides:
  - title: Baku vs gaul
    body:
      ar_eg: |
        bahasa baku = الفصيح بتاع الجرايد والشغل. bahasa gaul = عامية الشباب، أغلبها من جاكرتا.
        - tidak → nggak، sangat → banget، saya / kamu → gue / lu
        - malas gerak → mager (كسلان يتحرك)
        - bawa perasaan → baper (حسّاس، بياخد الكلام على صدره)
        - kepo = فضولي، بيحشر مناخيره
        كتير من الكلمات دي singkatan (اختصارات). افهمها، بس في المواقف الرسمية خليك على الفصيح.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: nggak = tidak، banget = sekali.
      ar: |
        bahasa baku = الفصحى في الصحف والعمل، وbahasa gaul = عامّية الشباب، وجلّها من جاكرتا.
        - tidak → nggak، وsangat → banget، وsaya / kamu → gue / lu
        - malas gerak → mager (كسول عن الحركة)
        - bawa perasaan → baper (مرهف الحسّ، يتأثّر بسرعة)
        - kepo = فضولي
        وكثير منها singkatan (اختصارات). افهمها، لكن التزم الفصحى في المقام الرسمي.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: nggak = tidak، banget = sekali.
      en: |
        bahasa baku = standard Indonesian, for papers and work. bahasa gaul = youth slang, mostly from Jakarta.
        - tidak → nggak, sangat → banget, saya / kamu → gue / lu
        - malas gerak → mager (too lazy to move)
        - bawa perasaan → baper (oversensitive, takes things to heart)
        - kepo = nosy
        Many are singkatan (abbreviations). Understand them, but keep to standard in formal settings.
        The dialogue uses street forms; the formal ones are beside them: nggak = tidak, banget = sekali.
    examples:
      - text: Gue mager banget hari ini.
        ar_eg: أنا كسلان قوي النهارده.
        ar: أنا كسول جدًّا اليوم.
        en: I'm so lazy today.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bahasa baku
        ar_eg: الفصيح
        ar: اللغة الفصحى
        en: standard language
      - text: bahasa gaul
        ar_eg: عامية الشباب
        ar: عامّية الشباب
        en: slang
      - text: singkatan
        ar_eg: اختصار
        ar: اختصار
        en: abbreviation
      - text: kepo
        ar_eg: فضولي
        ar: فضولي
        en: nosy
      - text: santai
        ar_eg: رايق / على راحته
        ar: مسترخٍ
        en: relaxed, casual
    words: [bahasa baku, bahasa gaul, singkatan, kepo, santai]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الفصيح من «Gue nggak tahu»؟
      ar: ما الصيغة الفصحى لـ «Gue nggak tahu»؟
      en: What is the standard form of "Gue nggak tahu"?
    options:
      - Saya tidak tahu.
      - Aku nggak tahu.
      - Lu tidak tahu.
    answer: 0
    words: [bahasa baku, bahasa gaul]
    explain:
      ar_eg: "الفصيح: gue ← saya، nggak ← tidak. «Aku nggak» لسه عامية، و«Lu» = إنت مش أنا."
      ar: "الفصحى: gue ← saya وnggak ← tidak. أما «Aku nggak» فما زالت عامّية، و«Lu» تعني «أنت»."
      en: Standard is Saya tidak tahu. "Aku nggak" is still casual, and "Lu" means "you".
  - id: e03
    type: fill_blank
    sentence: Kata "mager" adalah ___ dari "malas gerak".
    meaning:
      ar_eg: كلمة mager اختصار لـ malas gerak.
      ar: كلمة mager اختصار لـ malas gerak.
      en: The word "mager" is an abbreviation of "malas gerak".
    options: [singkatan, kosakata, santai]
    answers: [singkatan]
    words: [singkatan]
    explain:
      ar_eg: mager اختصار = singkatan من malas gerak. kosakata = مفردات وsantai = رايق، مش اختصار.
      ar: mager اختصار = singkatan لـ malas gerak. أما kosakata فالمفردات، وsantai «مسترخٍ».
      en: mager is a singkatan (abbreviation) of malas gerak. kosakata (vocabulary) and santai (relaxed) aren't.
  - id: e04
    type: listen
    text: Jangan kepo, itu urusan pribadi dia. Kalau dia mau cerita, nanti dia sendiri yang bilang.
    question:
      ar_eg: المتكلم بينصح بإيه؟
      ar: بماذا ينصح المتكلّم؟
      en: What does the speaker advise?
    options:
      - Jangan bertanya terlalu banyak; tunggu sampai dia mau bercerita.
      - Tanyakan semuanya kepada dia sekarang.
      - Ceritakan urusan dia kepada teman-teman.
    answer: 0
    meaning:
      ar_eg: ماتبقاش فضولي، دي حاجة تخصه. لو عايز يحكي، هو بنفسه هيقول بعدين.
      ar: لا تكن فضوليًّا، فهذا شأنه الخاص. وإن أراد أن يحكي فسيقول ذلك بنفسه لاحقًا.
      en: Don't be nosy, that's his private business. If he wants to tell, he'll say so himself later.
    explain:
      ar_eg: jangan kepo = ماتبقاش فضولي، وnanti dia sendiri yang bilang = هو اللي هيقول بنفسه، يعني استنى.
      ar: jangan kepo = لا تكن فضوليًّا، وnanti dia sendiri yang bilang = سيقول بنفسه، أي انتظر.
      en: jangan kepo = don't be nosy; nanti dia sendiri yang bilang = he'll tell you himself, so wait.
    words: [kepo]
  - id: e05
    type: build_sentence
    source:
      ar_eg: في الشغل بنستخدم اللغة الفصحى.
      ar: نستعمل الفصحى في العمل.
      en: At work we use standard language.
    answer: Di kantor kita memakai bahasa baku.
    distractors: [gaul, santai]
    words: [bahasa baku]
    explain:
      ar_eg: «الفصحى» = bahasa baku. gaul = عامية الشباب، وsantai = رايق، وده عكس الشغل.
      ar: «الفصحى» = bahasa baku. أما gaul فعامّية الشباب، وsantai «غير رسمي»، وهما عكس لغة العمل.
      en: "\"Standard language\" is bahasa baku. gaul (slang) and santai (casual) are the opposite of office language."
  - id: e06
    type: translate
    direction: from_target
    source_text: Dengan teman, saya lebih santai dan memakai bahasa gaul, tetapi di kantor saya selalu memakai bahasa baku.
    answers_meaning:
      ar_eg:
        - مع صحابي ببقى رايق أكتر وبتكلم عامية، بس في الشغل دايمًا بتكلم رسمي.
        - مع أصحابي باخدها ببساطة وبستخدم لغة الشباب، لكن في المكتب دايمًا بستخدم الفصيح.
      ar:
        - مع الأصدقاء أكون أكثر استرخاءً وأستعمل العامّية، لكنّي في المكتب أستعمل الفصحى دائمًا.
        - أتحدّث مع أصدقائي ببساطة وبلغة الشباب، أما في العمل فأتكلّم باللغة المعيارية دائمًا.
      en:
        - With friends I'm more relaxed and use slang, but at the office I always use standard Indonesian.
        - With my friends I'm more casual and speak slang, but at work I always speak formally.
    explain:
      ar_eg: tetapi = بس، بتقارن بين الصحاب (gaul) والشغل (baku).
      ar: tetapi = لكنّ، وتقارن بين الأصدقاء (gaul) والعمل (baku).
      en: tetapi = but, contrasting friends (gaul) with work (baku).
    words: [santai, bahasa gaul]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «baper» اختصار لإيه؟
      ar: ما أصل الاختصار «baper»؟
      en: What is "baper" short for?
    options:
      - bawa permen
      - baru pergi
      - bawa perasaan
    answer: 2
    words: [singkatan, bahasa gaul]
    explain:
      ar_eg: baper = bawa perasaan (بياخد الكلام على قلبه). bawa permen وbaru pergi مش أصلها.
      ar: baper = bawa perasaan (يتأثّر عاطفيًا)، لا bawa permen ولا baru pergi.
      en: baper is short for bawa perasaan, taking things to heart. The other two aren't it.
  - id: e08
    type: speaking
    text: Bahasa gaul itu santai, tetapi surat lamaran harus memakai bahasa baku.
    meaning:
      ar_eg: العامية رايقة، بس جواب التقديم على شغل لازم يبقى بالفصيح.
      ar: العامّية مريحة، لكنّ رسالة طلب العمل يجب أن تكون بالفصحى.
      en: Slang is relaxed, but a job application must be in standard language.
    words: [bahasa gaul, santai, bahasa baku]
  - id: e09
    type: dictation
    text: Adik saya kepo sekali tentang kehidupan saya di Mesir.
    meaning:
      ar_eg: أخويا الصغير فضولي قوي عن حياتي في مصر.
      ar: أخي الصغير فضوليّ جدًّا بشأن حياتي في مصر.
      en: My little brother is very nosy about my life in Egypt.
    words: [kepo]
dialogue:
  title: Grup WhatsApp
  lines:
    - speaker: Rina
      text: Mohamed, kamu ikut nongkrong nanti malam nggak?
      ar_eg: يا محمد، جاي تقعد معانا بالليل ولا لأ؟
      ar: يا محمد، هل ستأتي للسهر معنا الليلة؟
      en: Mohamed, you coming to hang out tonight?
    - speaker: Mohamed
      text: Maaf, gue capek banget. Eh, benar nggak bahasa gaul saya?
      ar_eg: معلش، أنا تعبان قوي. إيه، العامية بتاعتي مظبوطة؟
      ar: آسف، أنا متعب جدًّا. هل عامّيتي صحيحة؟
      en: Sorry, I'm really tired. Hey, is my slang right?
    - speaker: Rina
      text: Hampir! Tapi jangan pakai "gue" dan "saya" bareng. Satu aja.
      ar_eg: قربت! بس ماتستخدمش gue وsaya مع بعض. واحدة بس.
      ar: كدت! لكن لا تستعمل gue وsaya معًا، واحدة فقط.
      en: Almost! But don't use "gue" and "saya" together. Just one.
    - speaker: Mohamed
      text: Oke, paham. Di sini "gue", di kantor "saya" dan bahasa baku.
      ar_eg: ماشي، فهمت. هنا gue، وفي الشغل saya وكلام فصيح.
      ar: حسنًا، فهمت. هنا gue، وفي العمل saya والفصحى.
      en: OK, got it. Here it's "gue"; at the office it's "saya" and standard language.
