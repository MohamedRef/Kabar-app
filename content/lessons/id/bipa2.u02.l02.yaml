schema: kabar.lesson/v1
id: bipa2.u02.l02
language: id
title: Pedagang dan petani
can_do:
  ar_eg: تسأل وتقول الناس شغالين إيه.
  ar: أن تسأل وتقول ما يعمله الناس.
  en: Ask and say what people do for a living.
slides:
  - title: ber- → pe-
    body:
      ar_eg: |
        مع أفعال ber- غالبًا بتبقى pe- بس من غير تغيير:
        berdagang (يتاجر) → pedagang (تاجر)
        bertani (يزرع) → petani (فلاح)
        belajar (يتعلم) → pelajar (تلميذ)
      ar: |
        ومع أفعال ber- تأتي غالبًا pe- دون تغيير:
        berdagang → pedagang (تاجر)
        bertani → petani (فلاح)
        belajar → pelajar (تلميذ)
      en: |
        With ber- verbs it's usually plain pe-:
        berdagang (to trade) → pedagang (trader)
        bertani (to farm) → petani (farmer)
        belajar (to study) → pelajar (pupil)
    grammar: id.prefix.peng.agent
    examples:
      - text: Ibu Wayan pedagang di Pasar Badung.
        ar_eg: والدة وايان تاجرة في سوق بادونج.
        ar: والدة وايان تاجرة في سوق بادونغ.
        en: Wayan's mother is a trader at Badung Market.
      - text: Ayah saya petani.
        ar_eg: أبويا فلاح.
        ar: أبي فلاح.
        en: My father is a farmer.
  - title: Apa pekerjaan Anda?
    body:
      ar_eg: |
        مش كل المهن بـ peN-: guru (مدرس)، dokter (دكتور)، sopir (سواق) كلمات عادية.
        السؤال: Apa pekerjaan Anda? = بتشتغل إيه؟
        والرد سهل: Saya penulis. = أنا كاتب. (مفيش «يكون» في الإندونيسي.)
      ar: |
        ليست كل المهن بـ peN-: guru (معلم)، dokter (طبيب)، sopir (سائق).
        السؤال: Apa pekerjaan Anda؟ = ما عملك؟
        والجواب: Saya penulis. = أنا كاتب.
      en: |
        Not every job uses peN-: guru (teacher), dokter (doctor), sopir (driver) are plain words.
        Ask: Apa pekerjaan Anda? = What do you do?
        Answer: Saya penulis. = I'm a writer. (No "to be" needed.)
    grammar: id.prefix.peng.agent
    examples:
      - text: Apa pekerjaan Anda? — Saya pemandu wisata.
        ar_eg: بتشتغل إيه؟ — أنا مرشد سياحي.
        ar: ما عملك؟ — أنا مرشد سياحي.
        en: What do you do? — I'm a tour guide.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: menjual = بيبيع. الشخص اللي بيبيع اسمه إيه؟
      ar: menjual = يبيع. ما اسم من يبيع؟
      en: menjual = to sell. What do you call the person who sells?
    options: [penjual, pejual, pemjual]
    answer: 0
    explain:
      ar_eg: j بتاخد pen-، زي menjual بالظبط.
      ar: مع j تأتي pen-، كما في menjual.
      en: j takes pen-, just like menjual.
    words: [penjual]
  - id: e02
    type: listen
    text: Ibu Wayan pedagang di pasar.
    options: [Ibu Wayan penari di pasar., Ibu Wayan petani di pasar., Ibu Wayan pedagang di pasar.]
    answer: 2
    words: [pedagang]
  - id: e03
    type: fill_blank
    sentence: Mas Rizal ___ wisata. Dia memandu turis di Ubud setiap hari.
    meaning:
      ar_eg: (اكتب الكلمة) ماس ريزال مرشد سياحي. بيرشد السياح في أوبود كل يوم.
      ar: (اكتب الكلمة) ماس ريزال مرشد سياحي، يرشد السياح في أوبود كل يوم.
      en: (Type the word.) Mas Rizal is a tour guide. He guides tourists in Ubud every day.
    answers: [pemandu]
    explain:
      ar_eg: memandu (بيرشد) → pemandu (مرشد).
      ar: memandu (يرشد) → pemandu (مرشد).
      en: memandu (to guide) → pemandu (guide).
    words: [pemandu wisata, turis]
  - id: e04
    type: build_sentence
    source:
      ar_eg: أبويا فلاح في بالي.
      ar: أبي مزارع في بالي.
      en: My father is a farmer in Bali.
    answer: Ayah saya petani di Bali.
    distractors: [pelukis, penari]
    words: [petani]
  - id: e05
    type: translate
    direction: from_target
    source_text: Banyak pengunjung datang ke Ubud.
    answers_meaning:
      ar_eg: [زوار كتير بييجوا أوبود, فيه زوار كتير بييجوا أوبود]
      ar: [يأتي زوار كثيرون إلى أوبود, كثير من الزوار يأتون إلى أوبود]
      en: [Many visitors come to Ubud., Lots of visitors come to Ubud.]
    explain:
      ar_eg: kunjung (زيارة) → pengunjung = زائر. k بتقع زي mengunjungi.
      ar: kunjung → pengunjung = زائر، وتسقط k كما في mengunjungi.
      en: kunjung (visit) → pengunjung (visitor); k drops as in mengunjungi.
    words: [pengunjung]
  - id: e06
    type: speaking
    text: Ayah saya petani, dan ibu saya pedagang.
    meaning:
      ar_eg: أبويا فلاح، وأمي تاجرة.
      ar: أبي مزارع، وأمي تاجرة.
      en: My father is a farmer, and my mother is a trader.
    words: [petani, pedagang]
  - id: e07
    type: match_pairs
    pairs:
      - text: penjual
        ar_eg: بيّاع
        ar: بائع
        en: seller
      - text: pedagang
        ar_eg: تاجر
        ar: تاجر
        en: trader
      - text: petani
        ar_eg: فلاح
        ar: مزارع
        en: farmer
      - text: pemandu wisata
        ar_eg: مرشد سياحي
        ar: مرشد سياحي
        en: tour guide
      - text: pengunjung
        ar_eg: زائر
        ar: زائر
        en: visitor
      - text: turis
        ar_eg: سايح
        ar: سائح
        en: tourist
    words: [penjual, pedagang, petani, pemandu wisata, pengunjung, turis]
  - id: e08
    type: listen
    text: Banyak turis dan pengunjung di pasar.
    options: ['Banyak turis dan pengunjung di pasar.', 'Banyak penjual dan pedagang di pasar.', 'Banyak turis dan pemandu wisata di pasar.']
    answer: 0
    meaning:
      ar_eg: فيه سيّاح وزوار كتير في السوق.
      ar: في السوق سيّاح وزوار كثيرون.
      en: There are lots of tourists and visitors at the market.
    words: [turis, pengunjung, penjual, pedagang, pemandu wisata]
  - id: e09
    type: fill_blank
    sentence: ___ batik itu ramah sekali.
    meaning:
      ar_eg: بيّاع الباتيك ده لطيف أوي.
      ar: بائع الباتيك ذاك ودود جدًا.
      en: That batik seller is really friendly.
    options: [Penjual, Turis, Petani]
    answers: [Penjual]
    words: [penjual]
  - id: e10
    type: speaking
    text: Saya pemandu wisata untuk pengunjung dari Mesir.
    meaning:
      ar_eg: أنا مرشد سياحي للزوار اللي جايين من مصر.
      ar: أنا مرشد سياحي للزوار القادمين من مصر.
      en: I'm a tour guide for visitors from Egypt.
    words: [pemandu wisata, pengunjung]
dialogue:
  title: Di Pasar Badung
  lines:
    - speaker: Raka
      text: Mohamed, ini teman saya, Wayan. Dia pelukis.
      ar_eg: يا محمد، ده صاحبي وايان. هو رسام.
      ar: يا محمد، هذا صديقي وايان، وهو رسّام.
      en: Mohamed, this is my friend Wayan. He's a painter.
    - speaker: Mohamed
      text: Wah, pelukis! Saya suka lukisan Bali.
      ar_eg: الله، رسام! أنا بحب اللوحات البالية.
      ar: رائع، رسّام! أنا أحب اللوحات البالية.
      en: Wow, a painter! I love Balinese paintings.
    - speaker: Wayan
      text: Terima kasih. Ibu saya pedagang di pasar ini.
      ar_eg: شكرًا. أمي تاجرة في السوق ده.
      ar: شكرًا. أمي تاجرة في هذا السوق.
      en: Thank you. My mother is a trader in this market.
    - speaker: Mohamed
      text: Dan kamu, Raka? Apa pekerjaanmu?
      ar_eg: وإنت يا راكا؟ بتشتغل إيه؟
      ar: وأنت يا راكا؟ ما عملك؟
      en: And you, Raka? What do you do?
    - speaker: Raka
      text: Saya pemandu wisata. Banyak pengunjung dari Mesir juga!
      ar_eg: أنا مرشد سياحي. وفيه زوار كتير من مصر كمان!
      ar: أنا مرشد سياحي، ويأتي زوار كثيرون من مصر أيضًا!
      en: I'm a tour guide. Lots of visitors from Egypt, too!
