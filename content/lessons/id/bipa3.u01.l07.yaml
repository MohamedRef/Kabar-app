schema: kabar.lesson/v1
id: bipa3.u01.l07
language: id
title: Doa dan janji
can_do:
  ar_eg: 'تكتب دعاء ووعد لحد بتحبه: للأبد، غالي، نبيل.'
  ar: 'أن تكتب دعاءً ووعدًا لمن تحب: إلى الأبد، ثمين، نبيل.'
  en: 'Write a prayer and a promise for someone you love: forever, precious, noble.'
slides:
  - title: Doa untuk pengantin
    body:
      ar_eg: |
        doa = دعاء (من العربي). iman = إيمان. cinta = حب: Saya cinta kamu.
        mulia = نبيل، كريم (orang yang mulia = إنسان نبيل). berharga = غالي، له قيمة.
        abadi = أبدي (من العربي)، selamanya = على طول، للأبد. berjanji = يوعد.
      ar: |
        doa = دعاء (من العربية). iman = إيمان. cinta = حبّ: Saya cinta kamu.
        mulia = نبيل، كريم (orang yang mulia = إنسان نبيل). berharga = ثمين، ذو قيمة.
        abadi = أبدي (من العربية)، selamanya = إلى الأبد. berjanji = يَعِد.
      en: |
        doa = prayer (from Arabic). iman = faith. cinta = love: Saya cinta kamu.
        mulia = noble, honourable (orang yang mulia = a noble person). berharga = precious, valuable.
        abadi = eternal (from Arabic), selamanya = forever. berjanji = promise.
    examples:
      - text: Doa kami untuk kalian berdua.
        ar_eg: دعاءنا ليكم انتو الاتنين.
        ar: دعاؤنا لكما.
        en: Our prayers are with you both.
      - text: Saya berjanji akan cinta kamu selamanya.
        ar_eg: أوعدك إني هحبك على طول.
        ar: أعدك أن أحبك إلى الأبد.
        en: I promise to love you forever.
      - text: Keluarga adalah yang paling berharga.
        ar_eg: العيلة هي أغلى حاجة.
        ar: العائلة هي الأثمن.
        en: Family is what is most precious.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: doa
        ar_eg: دعاء
        ar: دعاء
        en: prayer
      - text: iman
        ar_eg: إيمان
        ar: إيمان
        en: faith
      - text: cinta
        ar_eg: حب
        ar: حبّ
        en: love
      - text: mulia
        ar_eg: نبيل
        ar: نبيل
        en: noble
    words: [doa, iman, cinta, mulia]
  - id: e02
    type: match_pairs
    pairs:
      - text: berharga
        ar_eg: غالي
        ar: ثمين
        en: precious
      - text: abadi
        ar_eg: أبدي
        ar: أبدي
        en: eternal
      - text: selamanya
        ar_eg: للأبد
        ar: إلى الأبد
        en: forever
      - text: berjanji
        ar_eg: يوعد
        ar: يَعِد
        en: promise
    words: [berharga, abadi, selamanya, berjanji]
  - id: e03
    type: listen
    text: Saya berjanji akan selalu ada untuk keluarga kita.
    question:
      ar_eg: بيعمل إيه؟
      ar: ماذا يفعل؟
      en: What is he doing?
    options: [بيوعد, بيعتذر, بيسأل]
    answer: 0
    meaning:
      ar_eg: أوعدك إني هكون دايمًا موجود لعيلتنا.
      ar: أعدك أن أكون دائمًا بجانب عائلتنا.
      en: I promise I'll always be there for our family.
    words: [berjanji]
  - id: e04
    type: fill_blank
    sentence: Terima kasih atas ___ Anda untuk keluarga kami.
    meaning:
      ar_eg: شكرًا على ___ لعيلتنا.
      ar: شكرًا على ___ لعائلتنا.
      en: Thank you for your ___ for our family.
    options: [doa, selamanya, abadi]
    answers: [doa]
    words: [doa, selamanya, abadi]
    explain:
      ar_eg: بنشكر الناس على doa (دعاهم). selamanya = للأبد، وabadi = دايم، ودول مش أسماء.
      ar: نشكر الناس على doa (دعائهم). أما selamanya فـ«إلى الأبد»، وabadi «دائم»، وليسا اسمين.
      en: We thank people for their doa (prayers). selamanya means forever, abadi lasting; neither is a noun.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كلمة بمعنى «على طول، للأبد»؟
      ar: أي كلمة تعني «إلى الأبد»؟
      en: Which word means 'forever'?
    options: [berharga, mulia, selamanya]
    answer: 2
    explain:
      ar_eg: selamanya = للأبد. وabadi = أبدي (صفة).
      ar: selamanya = إلى الأبد. وabadi = أبدي (صفة).
      en: selamanya = forever; abadi = eternal (adjective).
    words: [selamanya, berharga, mulia]
  - id: e06
    type: fill_blank
    sentence: Cinta mereka ___. Sampai tua mereka masih sayang.
    meaning:
      ar_eg: حبهم ___. لحد ما كبروا لسه بيحبوا بعض.
      ar: حبهما ___. ما زالا يتحابّان حتى الشيخوخة.
      en: Their love is ___. Even in old age they still adore each other.
    options: [iman, abadi, berjanji]
    answers: [abadi]
    words: [abadi, iman, berjanji]
    explain:
      ar_eg: حب لحد ما كبروا = حب abadi (دايم). iman = إيمان، وberjanji = يوعد.
      ar: الحب الباقي حتى الشيخوخة حب abadi (دائم). أما iman فالإيمان، وberjanji يَعِد.
      en: Love that lasts into old age is abadi (eternal). iman is faith, berjanji means promise.
  - id: e07
    type: build_sentence
    source:
      ar_eg: صاحبك ده قلبه نبيل.
      ar: لصديقك قلب نبيل.
      en: Your friend has a noble heart.
    answer: Teman kamu orang yang mulia.
    distractors: [berharga, abadi]
    words: [mulia]
    explain:
      ar_eg: "نبيل = mulia، والجملة: Teman kamu orang yang mulia. berharga = غالي / قيّم، وabadi = دايم."
      ar: "النبيل mulia: Teman kamu orang yang mulia. أما berharga فثمين، وabadi دائم."
      en: "Noble is mulia: Teman kamu orang yang mulia. berharga means precious, abadi lasting."
  - id: e08
    type: translate
    direction: from_target
    source_text: Waktu dengan keluarga sangat berharga.
    answers_meaning:
      ar_eg: [الوقت مع العيلة غالي جدًا, الوقت اللي بنقضيه مع العيلة غالي أوي]
      ar: [الوقت مع العائلة ثمين جدًا, الوقت الذي نقضيه مع العائلة ثمين جدًا]
      en: [Time with family is very precious, Time spent with family is very precious]
    words: [berharga]
  - id: e09
    type: speaking
    text: Semoga cinta dan iman kalian selalu kuat.
    meaning:
      ar_eg: ربنا يخلّي حبكم وإيمانكم قوي دايمًا.
      ar: أدام الله حبكما وإيمانكما قويين.
      en: May your love and faith always be strong.
    words: [cinta, iman]
  - id: e10
    type: multiple_choice
    question: Ibu saya selalu ___ untuk saya setiap malam.
    options: [cinta, berdoa, mulia]
    answer: 1
    explain:
      ar_eg: berdoa = يدعي، من doa.
      ar: berdoa = يدعو، من doa.
      en: berdoa = to pray, from doa.
    words: [doa, cinta, mulia]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, bantuin aku nulis kartu buat pengantin, dong.
      ar_eg: يا محمد، ساعدني أكتب كارت للعرسان.
      ar: يا محمد، ساعدني في كتابة بطاقة للعروسين.
      en: Mohamed, help me write a card for the newlyweds.
    - speaker: Mohamed
      text: 'Tulis doa dulu: "Semoga cinta kalian abadi."'
      ar_eg: 'اكتبي دعاء الأول: «ربنا يخلّي حبكم للأبد.»'
      ar: 'اكتبي دعاءً أولًا: «أدام الله حبكما.»'
      en: 'Start with a prayer: ''May your love last forever.'''
    - speaker: Rina
      text: Bagus. Terus apa?
      ar_eg: حلو. وبعدين؟
      ar: جميل. ثم ماذا؟
      en: Nice. Then what?
    - speaker: Mohamed
      text: '"Kalian berdua orang yang mulia. Teman yang baik sangat berharga."'
      ar_eg: «انتو الاتنين ناس نبلاء. الصحاب الكويسين غاليين جدًا.»
      ar: «كلاكما نبيل. الأصدقاء الطيبون ثمينون جدًا.»
      en: '''You''re both noble people. Good friends are very precious.'''
    - speaker: Rina
      text: Terus aku berjanji bakal selalu datang bawa makanan enak!
      ar_eg: وأنا أوعدكم إني هاجي دايمًا بأكل حلو!
      ar: وأعدكم أن آتي دائمًا بطعام لذيذ!
      en: And I promise I'll always come with good food!
