schema: kabar.lesson/v1
id: bipa1.u07.l07
language: id
title: Musik dan film
can_do:
  ar_eg: 'تتكلم عن هوايات الفن: الأفلام والغنا والرسم والآلات الموسيقية.'
  ar: 'أن تتحدث عن الهوايات الفنية: الأفلام والغناء والرسم والآلات الموسيقية.'
  en: 'Talk about arty hobbies: films, singing, drawing and instruments.'
slides:
  - title: Hobi saya
    body:
      ar_eg: |
        menonton film (يتفرج على فيلم) في tv (بتتنطق «تيفي»، والكلمة الكاملة televisi)، ومرات بيسمع radio.
        menyanyi = يغني، وmenggambar = يرسم.
        الآلات: gitar وpiano وdrum. والعزف: bermain gitar (حرفيًا «يلعب جيتار»)، زي الإنجليزي play.
      ar: |
        menonton film (يشاهد فيلمًا) على الـ tv (تُنطق «تيفي»، وأصلها televisi)، ويستمع أحيانًا إلى الـ radio.
        menyanyi = يغنّي، وmenggambar = يرسم.
        الآلات: gitar وpiano وdrum. والعزف bermain gitar (حرفيًا «يلعب الغيتار») كما في الإنجليزية play.
      en: |
        menonton film (watch a film) on tv (said "tivi", short for televisi), and sometimes listen to the radio.
        menyanyi = sing, menggambar = draw.
        Instruments: gitar, piano, drum. Playing one is bermain gitar, like English "play".
    examples:
      - text: Saya suka menonton film di tv.
        ar_eg: بحب أتفرج على أفلام في التلفزيون.
        ar: أحبّ مشاهدة الأفلام على التلفاز.
        en: I like watching films on TV.
      - text: Rina bisa bermain piano dan gitar.
        ar_eg: رينا بتعرف تعزف بيانو وجيتار.
        ar: تجيد رينا العزف على البيانو والغيتار.
        en: Rina can play the piano and guitar.
      - text: Adik saya suka menggambar.
        ar_eg: أخويا الصغير بيحب يرسم.
        ar: يحبّ أخي الصغير الرسم.
        en: My little brother likes drawing.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: film
        ar_eg: فيلم
        ar: فيلم
