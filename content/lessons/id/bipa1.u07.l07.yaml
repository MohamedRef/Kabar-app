  - id: e03
    type: listen
    text: Raka suka bermain gitar dan menyanyi.
    question:
      ar_eg: رَكا بيحب إيه؟
      ar: ماذا يحبّ راكا؟
      en: What does Raka like?
    options: [الجيتار والغنا, الرسم, البيانو]
    answer: 0
    meaning:
      ar_eg: رَكا بيحب يعزف جيتار ويغني.
      ar: يحبّ راكا العزف على الغيتار والغناء.
      en: Raka likes playing the guitar and singing.
    words: [gitar, menyanyi]
  - id: e04
    type: fill_blank
    sentence: Malam ini kita menonton ___ di tv.
    meaning:
      ar_eg: الليلة هنتفرج على ___ في التلفزيون.
      ar: الليلة نشاهد ___ على التلفاز.
      en: Tonight we're watching a ___ on TV.
    options: [film, gitar, drum]
    answers: [film]
    words: [film, tv, gitar, drum]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: آلة موسيقية ليها مفاتيح بيضا وسودا. اسمها؟
      ar: آلة موسيقية لها مفاتيح بيضاء وسوداء. ما اسمها؟
      en: An instrument with black and white keys. What is it?
    options: [piano, drum, radio]
    answer: 0
    explain:
      ar_eg: piano. الـ drum بيتضرب، والـ radio مش آلة.
      ar: piano؛ أما الـ drum فيُقرع، والـ radio ليس آلة.
      en: piano; drums are hit, and a radio isn't an instrument.
    words: [piano, drum, radio]
  - id: e06
    type: fill_blank
    sentence: Adik saya suka ___ bunga.
    meaning:
      ar_eg: أخويا الصغير بيحب ___ ورد.
      ar: يحبّ أخي الصغير ___ الزهور.
      en: My little brother likes ___ flowers.
    options: [menggambar, menyanyi, radio]
    answers: [menggambar]
    words: [menggambar, menyanyi]
  - id: e07
    type: build_sentence
    source:
      ar_eg: بابا بيسمع الراديو كل يوم الصبح.
      ar: يستمع أبي إلى المذياع كل صباح.
      en: Dad listens to the radio every morning.
    answer: Ayah mendengar radio setiap pagi.
    distractors: [film, piano]
    words: [radio]
  - id: e08
    type: translate
    direction: from_target
    source_text: Teman saya bisa bermain drum.
    answers_meaning:
      ar_eg: [صاحبي بيعرف يعزف درامز, صاحبي بيعرف يضرب درامز]
      ar: [صديقي يجيد العزف على الطبول, صديقي يعزف الدرامز]
      en: [My friend can play the drums, My friend plays the drums]
    words: [drum]
  - id: e09
    type: speaking
    text: Saya suka menyanyi dan menggambar.
    meaning:
      ar_eg: بحب الغنا والرسم.
      ar: أحبّ الغناء والرسم.
      en: I like singing and drawing.
    words: [menyanyi, menggambar]
  - id: e10
    type: multiple_choice
    question: Saya menonton film di ___.
    options: [tv, radio, piano]
    answer: 0
    explain:
      ar_eg: الفيلم بيتشاف على الـ tv. الراديو صوت بس.
      ar: يُشاهد الفيلم على الـ tv، أما المذياع فصوت فقط.
      en: You watch films on tv; radio is sound only.
    words: [tv, radio, film, piano]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, hobi kamu apa?
      ar_eg: يا محمد، هوايتك إيه؟
      ar: يا محمد، ما هوايتك؟
      en: Mohamed, what's your hobby?
    - speaker: Mohamed
      text: Saya suka menonton film. Kamu?
      ar_eg: بحب أتفرج على أفلام. وإنتي؟
      ar: أحبّ مشاهدة الأفلام. وأنتِ؟
      en: I like watching films. You?
    - speaker: Rina
      text: Saya suka menyanyi. Saya juga bermain piano.
      ar_eg: بحب أغني، وكمان بعزف بيانو.
      ar: أحبّ الغناء، وأعزف البيانو أيضًا.
      en: I like singing. I play the piano too.
    - speaker: Mohamed
      text: Hebat! Raka bisa bermain gitar, ya?
      ar_eg: جامد! ورَكا بيعرف يعزف جيتار، صح؟
      ar: رائع! وراكا يعزف الغيتار، أليس كذلك؟
      en: Great! Raka can play the guitar, right?
    - speaker: Rina
      text: Ya, dan dia suka menggambar juga.
      ar_eg: أيوه، وبيحب يرسم كمان.
      ar: نعم، ويحبّ الرسم أيضًا.
      en: Yes, and he likes drawing too.
    - speaker: Mohamed
      text: Malam ini kita bermain musik di rumah Raka!
      ar_eg: الليلة نعمل مزيكا في بيت رَكا!
      ar: الليلة نعزف الموسيقى في بيت راكا!
      en: Tonight we play music at Raka's place!
