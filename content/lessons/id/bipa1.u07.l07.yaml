      - text: piano
        ar_eg: بيانو
        ar: بيانو
        en: piano
      - text: drum
        ar_eg: درامز
        ar: طبول
        en: drums
    words: [film, gitar, piano, drum]
  - id: e02
    type: match_pairs
    pairs:
