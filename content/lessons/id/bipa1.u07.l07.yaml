  - id: e03
    type: listen
    text: Kami main bola di taman setiap Sabtu.
    question:
      ar_eg: بيلعبوا إيه؟
      ar: ماذا يلعبون؟
      en: What do they play?
    options: [كورة, بيانو, جري]
    answer: 0
    meaning:
      ar_eg: بنلعب كورة في الجنينة كل سبت.
      ar: نلعب الكرة في الحديقة كل سبت.
      en: We play football in the park every Saturday.
    words: [main, bola]
  - id: e04
    type: fill_blank
    sentence: Klub saya ___! Tiga — nol!
    meaning:
      ar_eg: النادي بتاعي ___! تلاتة — صفر!
      ar: نادِيَّ ___! ثلاثة مقابل لا شيء!
      en: My club ___! Three — nil!
    options: [menang, kalah, lari]
    answers: [menang]
    words: [klub, menang, kalah, lari]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: 'سباحة، جري، كورة: دول كلهم إيه؟'
      ar: 'السباحة والجري والكرة: ما هي كلّها؟'
      en: 'Swimming, running, football: what are they all?'
    options: [olahraga, permainan, klub]
    answer: 0
    explain:
      ar_eg: olahraga = رياضة. permainan لعبة، وklub نادي.
      ar: olahraga رياضة، أما permainan فلعبة وklub نادٍ.
      en: olahraga = sport; permainan is a game, klub a club.
    words: [olahraga, permainan, klub]
  - id: e06
    type: fill_blank
    sentence: Mesir ___ satu — dua. Tidak apa-apa!
    meaning:
      ar_eg: مصر ___ واحد — اتنين. مش مشكلة!
      ar: ___ مصر بهدف مقابل هدفين. لا بأس!
      en: Egypt ___ one — two. Never mind!
    options: [kalah, menang, main]
    answers: [kalah]
    words: [kalah]
  - id: e07
    type: build_sentence
    source:
      ar_eg: بجري كل يوم الصبح.
      ar: أجري كل صباح.
      en: I run every morning.
    answer: Saya lari setiap pagi.
    distractors: [bola, klub]
    words: [lari]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ini permainan favorit anak-anak.
    answers_meaning:
      ar_eg: [دي اللعبة المفضلة عند العيال, دي لعبة العيال المفضلة]
      ar: [هذه لعبة الأطفال المفضّلة, هذه اللعبة المفضّلة لدى الأطفال]
      en: ['This is the kids'' favourite game', 'This is the children''s favourite game']
    words: [permainan]
  - id: e09
    type: speaking
    text: Olahraga favorit saya main bola.
    meaning:
      ar_eg: رياضتي المفضلة الكورة.
      ar: رياضتي المفضّلة لعب الكرة.
      en: My favourite sport is playing football.
    words: [olahraga, main, bola]
  - id: e10
    type: multiple_choice
    question: Klub Rina menang, klub Raka ___.
    options: [kalah, lari, main]
    answer: 0
    explain:
      ar_eg: 'لو حد كسب، التاني خسر: kalah.'
      ar: 'إذا فاز أحدهما خسر الآخر: kalah.'
      en: 'If one wins, the other loses: kalah.'
    words: [klub, kalah, menang]
dialogue:
  lines:
    - speaker: Raka
      text: Mohamed, kamu suka olahraga?
      ar_eg: يا محمد، بتحب الرياضة؟
      ar: يا محمد، هل تحبّ الرياضة؟
      en: Mohamed, do you like sport?
    - speaker: Mohamed
      text: Suka! Saya suka main bola dan lari.
      ar_eg: بحبها! بحب الكورة والجري.
      ar: أحبّها! أحبّ الكرة والجري.
      en: I do! I like football and running.
    - speaker: Raka
      text: 'Malam ini ada sepak bola di tv: Indonesia dan Mesir!'
      ar_eg: 'الليلة فيه ماتش كورة في التلفزيون: إندونيسيا ومصر!'
      ar: 'الليلة مباراة كرة على التلفاز: إندونيسيا ومصر!'
      en: 'There''s football on TV tonight: Indonesia and Egypt!'
    - speaker: Mohamed
      text: Seru! Siapa menang, ya?
      ar_eg: تحفة! يا ترى مين هيكسب؟
      ar: مثير! تُرى من سيفوز؟
      en: Exciting! Who'll win, I wonder?
    - speaker: Raka
      text: Indonesia menang, dua — satu!
      ar_eg: إندونيسيا كسبت، اتنين — واحد!
      ar: فازت إندونيسيا بهدفين مقابل هدف!
      en: Indonesia won, two — one!
    - speaker: Mohamed
      text: Mesir kalah… Tidak apa-apa. Permainannya seru!
      ar_eg: مصر خسرت… مش مشكلة. الماتش كان حلو!
      ar: خسرت مصر… لا بأس، كانت مباراة مثيرة!
      en: Egypt lost… Never mind. It was a great game!
