schema: kabar.lesson/v1
id: bipa1.u07.l07
language: id
title: Main bola
can_do:
  ar_eg: 'تتكلم عن الرياضة والماتشات: مين كسب ومين خسر.'
  ar: 'أن تتحدث عن الرياضة والمباريات: من فاز ومن خسر.'
  en: 'Talk about sport and matches: who won and who lost.'
slides:
  - title: Menang atau kalah?
    body:
      ar_eg: |
        main = يلعب (عامية، والرسمي bermain): main bola = يلعب كورة.
        olahraga = رياضة، permainan = لعبة، klub = نادي.
        menang = يكسب، وkalah = يخسر.
        lari = يجري (والرسمي berlari).
      ar: |
        main = يلعب (بالعامية، والفصيح bermain): main bola = يلعب كرة القدم.
        olahraga = رياضة، permainan = لعبة، klub = نادٍ.
        menang = يفوز، وkalah = يخسر.
        lari = يجري (والفصيح berlari).
      en: |
        main = play (casual; formal bermain): main bola = play football.
        olahraga = sport, permainan = game, klub = club.
        menang = win, kalah = lose.
        lari = run (formal berlari).
    examples:
      - text: Setiap Minggu kami main bola di taman.
        ar_eg: كل حد بنلعب كورة في الجنينة.
        ar: كل أحد نلعب الكرة في الحديقة.
        en: Every Sunday we play football in the park.
      - text: Klub saya menang!
        ar_eg: النادي بتاعي كسب!
        ar: فاز نادِيَّ!
        en: My club won!
      - text: Olahraga favorit saya lari.
        ar_eg: رياضتي المفضلة الجري.
        ar: رياضتي المفضّلة الجري.
        en: My favourite sport is running.
