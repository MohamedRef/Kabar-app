        ar_eg: راديو
        ar: مذياع
        en: radio
      - text: tv
        ar_eg: تلفزيون
        ar: تلفاز
        en: TV
      - text: menyanyi
        ar_eg: يغني
        ar: يغنّي
        en: sing
