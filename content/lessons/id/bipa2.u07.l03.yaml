schema: kabar.lesson/v1
id: bipa2.u07.l03
language: id
title: Angkat tangan!
can_do:
  ar_eg: تدّي تعليمات تمارين رياضية.
  ar: أن تعطي تعليمات التمارين الرياضية.
  en: Give exercise instructions.
slides:
  - title: Angkat tangan, tarik napas
    body:
      ar_eg: |
        زي الوصفات بالظبط: الأمر = الجذر من غير meN-:
        - mengangkat → Angkat tangan! = ارفع إيدك!
        - menarik → Tarik napas! = خد نفس!
        - membuang → Buang napas! = طلّع النفس!
        - memutar → Putar bahu! = لِف كتفك!
        أجزاء الجسم: tangan (إيد)، kaki (رجل)، kepala (راس)، bahu (كتف)، lutut (ركبة).
      ar: |
        كما في الوصفات، الأمر هو الجذر بلا meN-:
        - mengangkat → Angkat tangan! = ارفع يدك!
        - menarik → Tarik napas! = خذ نفسًا!
        - membuang → Buang napas! = أخرِج النفس!
        - memutar → Putar bahu! = أدِر كتفك!
        وأعضاء الجسم: tangan (يد)، kaki (رِجل)، kepala (رأس)، bahu (كتف)، lutut (ركبة).
      en: |
        Just like recipes: the command is the root without meN-:
        - mengangkat → Angkat tangan! = Raise your hand(s)!
        - menarik → Tarik napas! = Breathe in!
        - membuang → Buang napas! = Breathe out!
        - memutar → Putar bahu! = Roll your shoulders!
        Body parts: tangan (hand / arm), kaki (foot / leg), kepala (head), bahu (shoulder), lutut (knee).
    grammar: id.imperative.basic
    examples:
      - text: Angkat tangan kanan, lalu tarik napas.
        ar_eg: ارفع إيدك اليمين، وبعدين خد نفس.
        ar: ارفع يدك اليمنى ثم خذ نفسًا.
        en: Raise your right hand, then breathe in.
  - title: Berdiri! Lompat!
    body:
      ar_eg: |
        - أفعال ber- بتفضل زي ما هي: Berdiri! = قوم اقف! Berhenti! = اقف (بطّل)! Berlari di tempat! = اجري في مكانك!
        - الكلمات اللي من غير بادئة كمان: Duduk! = اقعد! Lompat! = نُط!
        وفي التمارين بيعدّوا: Lompat tiga kali! = نُط تلات مرات!
      ar: |
        - أفعال ber- تبقى كما هي: Berdiri! = قِف! Berhenti! = توقّف! Berlari di tempat! = اركض في مكانك!
        - والأفعال المجردة أيضًا: Duduk! = اجلس! Lompat! = اقفز!
        ويكثر العدّ في التمارين: Lompat tiga kali! = اقفز ثلاث مرات!
      en: |
        - ber- verbs keep ber-: Berdiri! = Stand up! Berhenti! = Stop! Berlari di tempat! = Run on the spot!
        - Bare roots stay too: Duduk! = Sit! Lompat! = Jump!
        Workouts count a lot: Lompat tiga kali! = Jump three times!
    grammar: id.imperative.basic
    examples:
      - text: Berdiri, lalu lompat tiga kali.
        ar_eg: قوم اقف، وبعدين نُط تلات مرات.
        ar: قِف ثم اقفز ثلاث مرات.
        en: Stand up, then jump three times.
  - title: Turunkan tangan, ayo!
    body:
      ar_eg: |
        - زي masukkan في الوصفات، turunkan = نزّل (الحاجة): Turunkan tangan = نزّل إيدك.
        - عشان تشجّع: Ayo! = يلا!، Coba lagi! = جرّب تاني!
        - ولطيفة شوية: Duduklah = اتفضل اقعد.
      ar: |
        - كما في masukkan، فإن turunkan = أنزِل (الشيء): Turunkan tangan = أنزِل يدك.
        - وللتشجيع: Ayo! = هيّا!، Coba lagi! = حاول مرة أخرى!
        - وللتلطيف: Duduklah = تفضّل بالجلوس.
      en: |
        - Like masukkan in recipes, turunkan = lower (something): Turunkan tangan = Lower your hands.
        - To encourage: Ayo! = Come on!, Coba lagi! = Try again!
        - Gentler: Duduklah = Do sit down.
    grammar: id.imperative.basic
    examples:
      - text: Turunkan tangan dan buang napas.
        ar_eg: نزّل إيدك وطلّع النفس.
        ar: أنزِل يديك وأخرِج النفس.
        en: Lower your arms and breathe out.
      - text: Ayo, coba lagi!
        ar_eg: يلا، جرّب تاني!
        ar: هيّا، حاول مرة أخرى!
        en: Come on, try again!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tangan
        ar_eg: إيد
        ar: يد
        en: hand, arm
      - text: kaki
        ar_eg: رِجل
        ar: رِجل
        en: foot, leg
      - text: kepala
        ar_eg: راس
        ar: رأس
        en: head
      - text: bahu
        ar_eg: كتف
        ar: كتف
        en: shoulder
      - text: lutut
        ar_eg: رُكبة
        ar: رُكبة
        en: knee
    words: [tangan, kaki, kepala, bahu, lutut]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الأمر من mengangkat (يرفع)؟
      ar: ما صيغة الأمر من mengangkat (يرفع)؟
      en: What is the command form of mengangkat (to lift)?
    options: ["Berangkat!", "Mengangkat!", "Angkat!"]
    answer: 2
    explain:
      ar_eg: بنشيل meng- يفضل angkat. وخلّي بالك، berangkat كلمة تانية خالص = يسافر / يمشي!
      ar: تُحذف meng- فيبقى angkat. أما berangkat فكلمة أخرى بمعنى «ينطلق / يغادر».
      en: Drop meng- to get angkat. Careful, berangkat is a different word = set off!
    words: [angkat]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: المدرّب عايز الناس يقوموا يقفوا. يقول إيه؟
      ar: يريد المدرّب أن يقف الجميع. ماذا يقول؟
      en: The coach wants everyone to stand up. What does he say?
    options: ["Diri!", "Berdiri!", "Mendiri!"]
    answer: 1
    explain:
      ar_eg: أفعال ber- بتفضل زي ما هي في الأمر.
      ar: أفعال ber- تحتفظ بسابقتها في الأمر.
      en: ber- verbs keep ber- in commands.
    words: [berdiri]
  - id: e04
    type: listen
    text: Angkat tangan kanan, lalu tarik napas.
    options: ["Angkat tangan kanan, lalu tarik napas.", "Angkat tangan kiri, lalu buang napas.", "Angkat kaki kanan, lalu tarik napas."]
    answer: 0
    words: [angkat, tangan, tarik napas]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: المدرّبة عايزاك تطلّع النفس. تقول إيه؟
      ar: تريد المدرّبة أن تُخرج النفس. ماذا تقول؟
      en: The coach wants you to breathe out. What does she say?
    options: ["Angkat kaki.", "Tarik napas.", "Buang napas."]
    answer: 2
    words: [buang napas]
  - id: e06
    type: fill_blank
    sentence: ___ tangan kiri, lalu turunkan.
    meaning:
      ar_eg: ارفع إيدك الشمال، وبعدين نزّلها.
      ar: ارفع يدك اليسرى ثم أنزِلها.
      en: Raise your left hand, then lower it.
    options: ["Berangkat", "Mengangkat", "Angkat"]
    answers: [Angkat]
    words: [angkat, turunkan]
  - id: e07
    type: fill_blank
    sentence: Sekarang ___ dan berlari di tempat.
    meaning:
      ar_eg: دلوقتي قوم اقف واجري في مكانك.
      ar: الآن قِف واركض في مكانك.
      en: Now stand up and run on the spot.
    options: ["mendiri", "berdiri", "diri"]
    answers: [berdiri]
    words: [berdiri]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ارفع إيدك اليمين، وبعدين خد نفس.
      ar: ارفع يدك اليمنى ثم خذ نفسًا.
      en: Raise your right hand, then breathe in.
    answer: Angkat tangan kanan, lalu tarik napas.
    distractors: [mengangkat, buang]
    words: [angkat, tarik napas]
  - id: e09
    type: build_sentence
    source:
      ar_eg: قوم اقف، وبعدين نُط تلات مرات.
      ar: قِف ثم اقفز ثلاث مرات.
      en: Stand up, then jump three times.
    answer: Berdiri, lalu lompat tiga kali.
    distractors: [duduk, melompat]
    words: [berdiri, lompat]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: نزّل إيدك وطلّع النفس.
      ar: أنزِل يديك وأخرِج النفس.
      en: Lower your arms and breathe out.
    answers:
      - Turunkan tangan dan buang napas.
      - Turunkan tangan dan buang napas
      - Turunkan tanganmu dan buang napas.
      - Turunkan tangan, lalu buang napas.
      - Turunkan tangan lalu buang napas.
      - Turunkan tanganmu, lalu buang napas.
      - Turunkan tangan, buang napas.
    words: [turunkan, buang napas]
  - id: e11
    type: translate
    direction: from_target
    source_text: Putar bahu ke depan sepuluh kali.
    answers_meaning:
      ar_eg: ["لِف كتافك لقدّام عشر مرات.", "لِف كتفك لقدام عشر مرات"]
      ar: ["أدِر كتفيك إلى الأمام عشر مرات.", "أدِر كتفك للأمام عشر مرات"]
      en: ["Roll your shoulders forward ten times.", "Rotate your shoulders forwards ten times"]
    words: [putar, bahu]
  - id: e12
    type: dictation
    text: Tarik napas, lalu buang napas.
    meaning:
      ar_eg: خد نفس، وبعدين طلّعه.
      ar: خذ نفسًا ثم أخرِجه.
      en: Breathe in, then breathe out.
    words: [tarik napas, buang napas]
  - id: e13
    type: speaking
    text: Ayo, angkat tangan! Satu, dua, tiga!
    meaning:
      ar_eg: يلا، ارفعوا إيديكم! واحد، اتنين، تلاتة!
      ar: هيّا، ارفعوا أيديكم! واحد، اثنان، ثلاثة!
      en: Come on, hands up! One, two, three!
    words: [angkat, tangan]
dialogue:
  title: Senam pagi di Kuta
  lines:
    - speaker: Mas Ardi
      text: Selamat pagi, semua! Ayo, berdiri. Angkat tangan kanan, lalu tarik napas.
      ar_eg: صباح الخير يا جماعة! يلا، قوموا اقفوا. ارفعوا إيدكم اليمين، وبعدين خدوا نفس.
      ar: صباح الخير جميعًا! هيّا قِفوا. ارفعوا أيديكم اليمنى ثم خذوا نفسًا.
      en: Good morning, everyone! Come on, stand up. Raise your right hand, then breathe in.
    - speaker: Mohamed
      text: Seperti ini, Mas?
      ar_eg: كده يا مَس؟
      ar: هكذا يا ماس؟
      en: Like this, Mas?
    - speaker: Mas Ardi
      text: Ya, bagus! Sekarang turunkan tangan dan buang napas.
      ar_eg: أيوه، برافو! دلوقتي نزّل إيدك وطلّع النفس.
      ar: نعم، أحسنت! الآن أنزِل يدك وأخرِج النفس.
      en: Yes, good! Now lower your arm and breathe out.
    - speaker: Rina
      text: Mas, lutut saya sakit.
      ar_eg: يا مَس، ركبتي بتوجعني.
      ar: يا ماس، ركبتي تؤلمني.
      en: Mas, my knee hurts.
    - speaker: Mas Ardi
      text: Oh, berhenti dulu, Rina. Duduklah dan minum air.
      ar_eg: أوه، بطّلي شوية يا رينا. اتفضلي اقعدي واشربي مية.
      ar: أوه، توقّفي قليلًا يا رينا. تفضّلي اجلسي واشربي ماءً.
      en: Oh, stop for now, Rina. Do sit down and drink some water.
    - speaker: Mohamed
      text: Ayo, Rina! Besok coba lagi!
      ar_eg: يلا يا رينا! بكرة جرّبي تاني!
      ar: هيّا يا رينا! حاولي مرة أخرى غدًا!
      en: Come on, Rina! Try again tomorrow!
new_words:
  - word: angkat
    pos: verb
    ar_eg: ارفع (mengangkat = يرفع)
    ar: ارفع (mengangkat = يرفع)
    en: lift, raise (mengangkat = to lift)
  - word: turunkan
    pos: verb
    ar_eg: نزّل
    ar: أنزِل
    en: lower (it)
  - word: tarik napas
    pos: phrase
    ar_eg: خد نفس
    ar: خذ نفسًا (شهيق)
    en: breathe in
  - word: buang napas
    pos: phrase
    ar_eg: طلّع النفس
    ar: أخرِج النفس (زفير)
    en: breathe out
  - word: putar
    pos: verb
    ar_eg: لِف (memutar = يلف)
    ar: أدِر (memutar = يُدير)
    en: turn, rotate
  - word: lompat
    pos: verb
    ar_eg: نُط
    ar: اقفز
    en: jump
  - word: berdiri
    pos: verb
    ar_eg: يقف (على رجليه)
    ar: يقف
    en: to stand
  - word: tangan
    pos: noun
    ar_eg: إيد، دراع
    ar: يد، ذراع
    en: hand, arm
  - word: kaki
    pos: noun
    ar_eg: رِجل
    ar: رِجل، قدم
    en: foot, leg
  - word: kepala
    pos: noun
    ar_eg: راس
    ar: رأس
    en: head
  - word: bahu
    pos: noun
    ar_eg: كتف
    ar: كتف
    en: shoulder
  - word: lutut
    pos: noun
    ar_eg: رُكبة
    ar: رُكبة
    en: knee
  - word: kali
    pos: noun
    ar_eg: مرة (tiga kali = تلات مرات)
    ar: مرّة (tiga kali = ثلاث مرات)
    en: time(s) (tiga kali = three times)
