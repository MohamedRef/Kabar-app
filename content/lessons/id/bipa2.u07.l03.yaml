schema: kabar.lesson/v1
id: bipa2.u07.l03
language: id
title: Sudah berapa lama?
can_do:
  ar_eg: تتكلم عن المدة (بقالك قد إيه، من إمتى، كمان قد إيه).
  ar: أن تتحدث عن المدة الزمنية.
  en: Talk about duration.
slides:
  - title: Sudah berapa lama?
    body:
      ar_eg: |
        berapa lama = قد إيه (مدة)، مش «إمتى». ومع sudah تبقى «بقالك قد إيه؟»:
        - Sudah berapa lama di Bali? = بقالك قد إيه في بالي؟
        والرد: sudah + المدة = بقالي:
        - Sudah tiga bulan. = بقالي تلات شهور.
        - Saya sudah dua tahun belajar bahasa Indonesia. = بقالي سنتين بتعلّم إندونيسي.
      ar: |
        berapa lama = كم من الوقت (للمدة لا للموعد). ومع sudah تصير «منذ متى وأنت…؟»:
        - Sudah berapa lama di Bali? = منذ متى وأنت في بالي؟
        والجواب: sudah + المدة:
        - Sudah tiga bulan. = منذ ثلاثة أشهر.
        - Saya sudah dua tahun belajar bahasa Indonesia. = أتعلّم الإندونيسية منذ سنتين.
      en: |
        berapa lama = how long (a span, not "when"). With sudah it becomes "how long have you…?":
        - Sudah berapa lama di Bali? = How long have you been in Bali?
        Answer with sudah + duration:
        - Sudah tiga bulan. = Three months now.
        - Saya sudah dua tahun belajar bahasa Indonesia. = I've been learning Indonesian for two years.
    grammar: id.duration
    examples:
      - text: Sudah berapa lama kamu main bulu tangkis?
        ar_eg: بقالك قد إيه بتلعب ريشة؟
        ar: منذ متى تلعب الريشة الطائرة؟
        en: How long have you been playing badminton?
  - title: Selama atau sejak?
    body:
      ar_eg: |
        - selama + مدة = لمدة / طول: selama tiga puluh menit = لمدة نص ساعة، selama liburan = طول الأجازة.
        - sejak + نقطة بداية = من (ساعة ما): sejak tahun 2020 = من ٢٠٢٠، sejak kecil = من وأنا صغير.
        الغلطة المشهورة: «selama tahun 2020» بمعنى «من ٢٠٢٠» ✗. الصح sejak tahun 2020 ✓.
      ar: |
        - selama + مدة = طوال / لمدة: selama tiga puluh menit، selama liburan.
        - sejak + نقطة البداية = منذ: sejak tahun 2020، sejak kecil.
        والخطأ الشائع: «selama tahun 2020» بمعنى «منذ ٢٠٢٠» ✗، والصواب sejak tahun 2020 ✓.
      en: |
        - selama + span = for / during: selama tiga puluh menit = for thirty minutes, selama liburan = during the holiday.
        - sejak + starting point = since: sejak tahun 2020, sejak kecil = since childhood.
        Classic mistake: "selama tahun 2020" for "since 2020" ✗. Say sejak tahun 2020 ✓.
    grammar: id.duration
    examples:
      - text: Saya berenang selama tiga puluh menit setiap pagi.
        ar_eg: بعوم نص ساعة كل يوم الصبح.
        ar: أسبح ثلاثين دقيقة كل صباح.
        en: I swim for thirty minutes every morning.
      - text: Saya tinggal di Indonesia sejak bulan Maret.
        ar_eg: أنا عايش في إندونيسيا من شهر مارس.
        ar: أعيش في إندونيسيا منذ مارس.
        en: I've lived in Indonesia since March.
  - title: Dua hari lalu, dua hari lagi
    body:
      ar_eg: |
        - المدة + (yang) lalu = من … (فات): tiga hari lalu = من تلات أيام.
        - المدة + lagi = كمان … (جاي): tiga hari lagi = كمان تلات أيام.
        بالمصري بالظبط: «كمان يومين» = dua hari lagi. وماتلخبطهمش: lalu للي فات، lagi للي جاي.
      ar: |
        - المدة + (yang) lalu = قبل … (ماضٍ): tiga hari lalu = قبل ثلاثة أيام.
        - المدة + lagi = بعد … (مستقبل): tiga hari lagi = بعد ثلاثة أيام.
        فـ lalu للماضي وlagi للمستقبل.
      en: |
        - duration + (yang) lalu = … ago: tiga hari lalu = three days ago.
        - duration + lagi = in … (from now): tiga hari lagi = in three days.
        Egyptian «كمان يومين» is exactly dua hari lagi. Don't mix them up: lalu = past, lagi = future.
    grammar: id.duration
    examples:
      - text: Pertandingannya dua hari lagi.
        ar_eg: الماتش كمان يومين.
        ar: المباراة بعد يومين.
        en: The match is in two days.
      - text: Dua minggu yang lalu saya mulai bermain bulu tangkis.
        ar_eg: من أسبوعين بدأت ألعب ريشة.
        ar: قبل أسبوعين بدأتُ ألعب الريشة الطائرة.
        en: Two weeks ago I started playing badminton.
