  - id: e04
    type: fill_blank
    sentence: Saya berenang ___ tiga puluh menit setiap pagi.
    meaning:
      ar_eg: بعوم لمدة نص ساعة كل يوم الصبح.
      ar: أسبح لمدة ثلاثين دقيقة كل صباح.
      en: I swim for thirty minutes every morning.
    options: [selama, sejak, lalu]
    answers: [selama]
    explain:
      ar_eg: «تلاتين دقيقة» مدة، يبقى selama.
      ar: «ثلاثون دقيقة» مدة، فنستعمل selama.
      en: Thirty minutes is a span, so selama.
