dialogue:
  title: Kelas selancar
  lines:
    - speaker: Mas Rizal
      text: Mohamed, sudah berapa lama di Bali?
      ar_eg: يا محمد، بقالك قد إيه في بالي؟
      ar: يا محمد، منذ متى وأنت في بالي؟
      en: Mohamed, how long have you been in Bali?
    - speaker: Mohamed
      text: Sejak bulan Juli, Mas. Sudah tiga bulan. Mas sudah berapa lama menjadi pelatih?
      ar_eg: من شهر يوليو يا مَس. بقالي تلات شهور. وإنت بقالك قد إيه مدرّب؟
      ar: منذ يوليو يا ماس، أي منذ ثلاثة أشهر. ومنذ متى وأنت مدرّب؟
      en: Since July, Mas. Three months now. How long have you been a coach?
    - speaker: Mas Rizal
      text: Sepuluh tahun. Saya berselancar sejak kecil.
      ar_eg: عشر سنين. أنا بركب الأمواج من وأنا صغير.
      ar: عشر سنوات. أركب الأمواج منذ الصغر.
      en: Ten years. I've surfed since I was little.
    - speaker: Mohamed
      text: Hebat! Kapan kelas pertama saya?
      ar_eg: جامد! أول حصة ليا إمتى؟
      ar: رائع! متى حصّتي الأولى؟
      en: Amazing! When is my first class?
    - speaker: Mas Rizal
      text: Dua hari lagi, hari Sabtu. Kelasnya selama satu jam.
      ar_eg: كمان يومين، يوم السبت. والحصة ساعة.
      ar: بعد يومين، يوم السبت، ومدّتها ساعة.
      en: In two days, on Saturday. The class lasts an hour.
    - speaker: Mohamed
      text: Baik, sampai hari Sabtu, Mas!
      ar_eg: تمام، أشوفك يوم السبت يا مَس!
      ar: حسنًا، إلى اللقاء يوم السبت يا ماس!
      en: Great, see you on Saturday, Mas!
