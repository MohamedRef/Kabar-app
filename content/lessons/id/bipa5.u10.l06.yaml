schema: kabar.lesson/v1
id: bipa5.u10.l06
language: id
title: Menyiapkan presentasi
can_do:
  ar_eg: 'تجهز عرض تقديمي: العرض التجريبي والزوم، الترتيب والانتقال بين الأجزا، نظرة سريعة وتفاصيل، ومن أنهي زاوية، وتوصي بحاجة.'
  ar: 'أن تُعدّ عرضًا تقديميًا: العرض التجريبي وزوم، والترتيب والانتقال بين الأجزاء، ولمحة سريعة وتفاصيل، والجوانب، والتوصية.'
  en: 'Prepare a presentation: a demo and Zoom, structure and transitions, a quick overview and details, angles, and recommending.'
slides:
  - title: Struktur yang jelas
    body:
      ar_eg: |
        susunan = ترتيب، تركيب (susunan presentasi = ترتيب العرض)، transisi = انتقال: kalimat transisi = جملة انتقالية (Selanjutnya، Dengan demikian).
        sekilas = بسرعة، نظرة سريعة، rinci = بالتفصيل (secara rinci).
        segi = جانب، زاوية: dari segi biaya = من ناحية التكلفة.
        demo = عرض تجريبي (وكمان مظاهرة)، Zoom = الزوم (rapat lewat Zoom)، merekomendasikan = يوصي.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: buat = untuk.
      ar: |
        susunan = ترتيب، بنية (susunan presentasi = بنية العرض)، transisi = انتقال: kalimat transisi = جملة انتقالية (Selanjutnya، Dengan demikian).
        sekilas = بإيجاز، لمحة سريعة، rinci = مفصّل (secara rinci = بالتفصيل).
        segi = جانب، ناحية: dari segi biaya = من ناحية التكلفة.
        demo = عرض تجريبي (وأيضًا مظاهرة)، Zoom = زوم (rapat lewat Zoom)، merekomendasikan = يوصي.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: buat = untuk.
      en: |
        susunan = structure, arrangement (susunan presentasi), transisi = transition: kalimat transisi = linking sentence (Selanjutnya, Dengan demikian).
        sekilas = briefly, at a glance, rinci = detailed (secara rinci = in detail).
        segi = aspect, angle: dari segi biaya = in terms of cost.
        demo = demo (also a street protest), Zoom = Zoom (rapat lewat Zoom), merekomendasikan = to recommend.
        The dialogue uses street forms; the formal ones are beside them: buat = untuk.
    examples:
      - text: Sekilas saya jelaskan susunan presentasi ini.
        ar_eg: هشرح بسرعة ترتيب العرض ده.
        ar: أشرح بإيجاز بنية هذا العرض.
        en: Let me briefly explain how this presentation is structured.
      - text: Dari segi biaya, rencana kedua lebih murah.
        ar_eg: من ناحية التكلفة، الخطة التانية أرخص.
        ar: من ناحية التكلفة، الخطة الثانية أرخص.
        en: In terms of cost, the second plan is cheaper.
      - text: Kami merekomendasikan demo produk lewat Zoom.
        ar_eg: إحنا بنوصي بعرض تجريبي للمنتج على الزوم.
        ar: نوصي بعرض تجريبي للمنتج عبر زوم.
        en: We recommend a product demo over Zoom.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: susunan
        ar_eg: ترتيب
        ar: بنية، ترتيب
        en: structure
      - text: transisi
        ar_eg: انتقال
        ar: انتقال
        en: transition
      - text: sekilas
        ar_eg: بسرعة، نظرة سريعة
        ar: لمحة سريعة
        en: briefly
      - text: rinci
        ar_eg: بالتفصيل
        ar: مفصّل
        en: detailed
    words: [susunan, transisi, sekilas, rinci]
  - id: e02
    type: match_pairs
    pairs:
      - text: segi
        ar_eg: ناحية، زاوية
        ar: جانب
        en: aspect
      - text: demo
        ar_eg: عرض تجريبي
        ar: عرض تجريبي
        en: demo
      - text: zoom
        ar_eg: زوم
        ar: زوم
        en: Zoom
      - text: merekomendasikan
        ar_eg: يوصي
        ar: يوصي
        en: to recommend
    words: [segi, demo, zoom, merekomendasikan]
  - id: e03
    type: listen
    text: Rapat hari ini lewat Zoom, bukan di kantor.
    question:
      ar_eg: الاجتماع فين؟
      ar: أين الاجتماع؟
      en: Where is the meeting?
    options: [على الزوم, في المكتب, في الكافيه]
    answer: 0
    meaning:
      ar_eg: اجتماع النهارده على الزوم، مش في المكتب.
      ar: اجتماع اليوم عبر زوم، لا في المكتب.
      en: Today's meeting is on Zoom, not at the office.
    words: [zoom]
  - id: e04
    type: fill_blank
    sentence: Jelaskan datanya secara ___, jangan hanya sekilas.
    meaning:
      ar_eg: اشرح الداتا ___، مش بسرعة وخلاص.
      ar: اشرح البيانات بشكل ___، لا بإيجاز فقط.
      en: Explain the data in ___, not just briefly.
    options: [rinci, demo, segi]
    answers: [rinci]
    words: [rinci, demo, segi, sekilas]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: جملة زي Selanjutnya أو Dengan demikian بتربط جزء بجزء. اسمها إيه؟
      ar: جملة مثل Selanjutnya أو Dengan demikian تربط قسمًا بآخر. ما اسمها؟
      en: A sentence like Selanjutnya or Dengan demikian links one part to the next. What is it?
    options: [kalimat demo, kalimat transisi, kalimat segi]
    answer: 1
    explain:
      ar_eg: kalimat transisi = جملة انتقالية.
      ar: kalimat transisi = جملة انتقالية.
      en: kalimat transisi = linking sentence.
    words: [demo, transisi, segi]
  - id: e06
    type: fill_blank
    sentence: Saya ___ hotel ini karena dekat dengan pantai.
    meaning:
      ar_eg: أنا ___ بالأوتيل ده عشان قريب من البحر.
      ar: ___ بهذا الفندق لأنه قريب من الشاطئ.
      en: I ___ this hotel because it's near the beach.
    options: [merekomendasikan, sekilas, transisi]
    answers: [merekomendasikan]
    words: [merekomendasikan, sekilas, transisi]
  - id: e07
    type: multiple_choice
    question: Dari ___ keamanan, sistem baru ini lebih baik.
    options: [rinci, zoom, segi]
    answer: 2
    explain:
      ar_eg: dari segi = من ناحية.
      ar: dari segi = من ناحية.
      en: dari segi = in terms of.
    words: [rinci, zoom, segi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ترتيب العرض ده واضح جدًا.
      ar: بنية هذا العرض واضحة جدًا.
      en: This presentation's structure is very clear.
    answer: Susunan presentasi ini sangat jelas.
    distractors: [demo, rinci]
    words: [susunan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kami merekomendasikan demo produk lewat Zoom.
    answers_meaning:
      ar_eg: [بنوصي بعرض تجريبي للمنتج على الزوم, إحنا بنوصي بديمو للمنتج على الزوم]
      ar: [نوصي بعرض تجريبي للمنتج عبر زوم, نوصي بتقديم عرض تجريبي للمنتج عبر زوم]
      en: [We recommend a product demo over Zoom, We recommend demoing the product on Zoom]
    words: [merekomendasikan, demo, zoom]
  - id: e10
    type: speaking
    text: 'Sekilas saja: susunan presentasi saya ada tiga bagian.'
    meaning:
      ar_eg: 'بسرعة كده: العرض بتاعي متقسم تلات أجزا.'
      ar: 'بإيجاز: يتكوّن عرضي من ثلاثة أقسام.'
      en: 'Briefly: my presentation has three parts.'
    words: [sekilas, susunan]
dialogue:
  lines:
    - speaker: Pak Hendra
      text: Pak Mohamed, besok Anda presentasi untuk mitra dari Kairo lewat Zoom.
      ar_eg: يا أستاذ محمد، بكرة هتعمل عرض للشركا اللي من القاهرة على الزوم.
      ar: يا أستاذ محمد، غدًا تقدّم عرضًا لشركائنا من القاهرة عبر زوم.
      en: Mohamed, tomorrow you're presenting to our Cairo partners over Zoom.
    - speaker: Mohamed
      text: 'Baik, Pak. Susunannya: pembukaan, data, lalu rekomendasi.'
      ar_eg: 'حاضر يا فندم. الترتيب: مقدمة، الداتا، وبعدين التوصيات.'
      ar: 'حسنًا يا سيّدي. البنية: مقدمة، ثم البيانات، ثم التوصيات.'
      en: 'Certainly. The structure: opening, data, then recommendations.'
    - speaker: Pak Hendra
      text: Bagus. Jangan lupa kalimat transisi di antara bagian-bagiannya.
      ar_eg: كويس. ما تنساش جمل الانتقال بين الأجزا.
      ar: جيد. لا تنسَ الجمل الانتقالية بين الأقسام.
      en: Good. Don't forget transitions between the sections.
    - speaker: Mohamed
      text: Datanya saya jelaskan sekilas atau secara rinci?
      ar_eg: أشرح الداتا بسرعة ولا بالتفصيل؟
      ar: هل أشرح البيانات بإيجاز أم بالتفصيل؟
      en: Should I explain the data briefly or in detail?
    - speaker: Pak Hendra
      text: Sekilas saja, tapi tunjukkan segi biaya dengan jelas. Lalu kita buat demo alatnya.
      ar_eg: بسرعة بس، لكن وضّح ناحية التكلفة كويس. وبعدين نعمل ديمو للجهاز.
      ar: بإيجاز، لكن أوضح ناحية التكلفة جيدًا. ثم نقدّم عرضًا تجريبيًا للجهاز.
      en: Briefly, but make the cost side clear. Then we'll demo the device.
    - speaker: Mohamed
      text: Siap. Saya akan merekomendasikan rencana kedua.
      ar_eg: تمام. هوصي بالخطة التانية.
      ar: حاضر. سأوصي بالخطة الثانية.
      en: Will do. I'll recommend the second plan.
