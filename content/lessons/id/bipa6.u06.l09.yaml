    words: [aparat, remeh, ironis, heboh]
  - id: e03
    type: listen
    text: Berita itu heboh, tetapi isinya remeh.
    question:
      ar_eg: الخبر عامل إزاي؟
      ar: كيف هو الخبر؟
      en: What's the story like?
    options: [عامل دوشة بس تافه, مهم وخطير, قديم ومنسي]
    answer: 0
    meaning:
      ar_eg: الخبر ده عامل ضجة، بس محتواه تافه.
      ar: أثار الخبر ضجة، لكن مضمونه تافه.
      en: The story made a big fuss, but its content is trivial.
    words: [heboh, remeh]
  - id: e04
    type: fill_blank
    sentence: Partai yang tidak ikut pemerintah disebut ___.
    meaning:
      ar_eg: الحزب اللي مش في الحكومة اسمه ___.
      ar: يُسمّى الحزب الذي لا يشارك في الحكومة ___.
      en: A party outside the government is called the ___.
    options: [oposisi, koalisi, aparat]
    answers: [oposisi]
    words: [oposisi, koalisi, aparat]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الأحزاب اللي بتتفق تحكم مع بعض بتعمل إيه؟
      ar: ماذا تشكّل الأحزاب التي تتفق على الحكم معًا؟
      en: Parties that agree to govern together form a…
    options: [parpol, koalisi, politikus]
    answer: 1
    explain:
      ar_eg: koalisi = ائتلاف.
      ar: koalisi = ائتلاف.
      en: koalisi = coalition.
    words: [koalisi, parpol, politikus]
  - id: e06
    type: fill_blank
    sentence: 'Satire itu lucu karena situasinya ___: pemadam kebakaran yang rumahnya terbakar.'
    meaning:
      ar_eg: 'الساتير ده مضحك عشان الموقف ___: مطافي بيته ولّع.'
      ar: 'الهجاء مضحك لأن الموقف ___: إطفائيّ احترق بيته.'
      en: 'The satire is funny because it''s ___: a firefighter whose house burns down.'
    options: [ironis, remeh, heboh]
    answers: [ironis]
    words: [ironis, remeh, heboh]
  - id: e07
    type: multiple_choice
    question: PDI-P, Golkar, dan Gerindra adalah nama ___.
    options: [aparat, oposisi, parpol]
    answer: 2
    explain:
      ar_eg: 'دي أسامي أحزاب: parpol = partai politik.'
      ar: 'هذه أسماء أحزاب: parpol = partai politik.'
      en: 'These are party names: parpol = partai politik.'
    words: [parpol, aparat, oposisi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: السياسي ده بيتكلم كتير عن الحاجات التافهة.
      ar: يتحدث هذا السياسي كثيرًا عن التوافه.
      en: This politician talks a lot about trivial things.
    answer: Politikus itu banyak berbicara tentang hal yang remeh.
    distractors: [heboh, koalisi]
    words: [politikus, remeh]
  - id: e09
    type: translate
    direction: from_target
    source_text: Aparat keamanan menjaga gedung parlemen.
    answers_meaning:
      ar_eg: [الأجهزة الأمنية بتحرس مبنى البرلمان, الأمن بيحمي البرلمان]
      ar: [تحرس الأجهزة الأمنية مبنى البرلمان]
      en: [Security forces guard the parliament building, The security forces are guarding parliament]
    words: [aparat]
  - id: e10
    type: speaking
    text: Berita satire ini heboh karena sangat ironis.
    meaning:
      ar_eg: الخبر الساخر ده عامل ضجة عشان فيه مفارقة كبيرة.
      ar: أثار هذا الخبر الساخر ضجة لأنه شديد المفارقة.
      en: This satirical item caused a stir because it's so ironic.
    words: [heboh, ironis]
dialogue:
  lines:
    - speaker: Bang Togar
      text: 'Baca judul ini: ''Koalisi dan oposisi sepakat: rakyat terlalu remeh.'''
      ar_eg: 'اقرا العنوان ده: ''الائتلاف والمعارضة اتفقوا: الشعب تافه أوي.'''
      ar: 'اقرأ هذا العنوان: ''الائتلاف والمعارضة يتفقان: الشعب أتفه من أن يُناقَش.'''
      en: 'Read this headline: ''Coalition and opposition agree: the people are too trivial.'''
    - speaker: Mohamed
      text: Ini berita beneran? Heboh banget!
      ar_eg: ده خبر بجد؟ ده عامل ضجة!
      ar: أهذا خبر حقيقي؟ إنه مثير جدًا!
      en: Is this real news? What a stir!
    - speaker: Bang Togar
      text: Bukan, ini satire. Tapi ironis, kan? Kayak beneran.
      ar_eg: لأ، ده ساتير. بس فيه مفارقة، صح؟ حاسس إنه حقيقي.
      ar: لا، هذا هجاء. لكنه مفارق، أليس كذلك؟ يبدو كأنه حقيقي.
      en: No, it's satire. But ironic, right? It feels true.
    - speaker: Mohamed
      text: Di Mesir juga ada politikus yang lebih sibuk sama parpolnya daripada rakyat.
      ar_eg: في مصر كمان فيه سياسيين مشغولين بحزبهم أكتر من الناس.
      ar: في مصر أيضًا ساسة ينشغلون بأحزابهم أكثر من الشعب.
      en: In Egypt too there are politicians busier with their party than with the people.
    - speaker: Bang Togar
      text: Satire bagus membuat kita tertawa dulu, lalu berpikir.
      ar_eg: الساتير الحلو بيضحّكنا الأول، وبعدين يخلينا نفكر.
      ar: الهجاء الجيد يضحكنا أولًا، ثم يجعلنا نفكر.
      en: Good satire makes us laugh first, then think.
