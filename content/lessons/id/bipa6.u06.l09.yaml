schema: kabar.lesson/v1
id: bipa6.u06.l09
language: id
title: Berita satire
can_do:
  ar_eg: تقرا خبر ساخر عن الأحزاب والسياسيين وتفهم المفارقة اللي فيه.
  ar: أن تقرأ خبرًا ساخرًا عن الأحزاب والساسة وتفهم مفارقته.
  en: Read a satirical news item about parties and politicians and see its irony.
slides:
  - title: Berita palsu yang jujur
    body:
      ar_eg: |
        خبر ساخر (مكتوب للدرس): "Koalisi dan oposisi sepakat: masalah rakyat terlalu remeh untuk dibahas."
        parpol = حزب سياسي (اختصار partai politik). politikus = سياسي. koalisi = ائتلاف. oposisi = معارضة.
        aparat = أجهزة الدولة، الأمن والموظفين (aparat keamanan). remeh = تافه، مش مهم.
        ironis = فيه مفارقة، ساخر. heboh = ضجة، دوشة؛ بيعمل شو.
        - في الشارع: beneran = sungguhan (بجد)، banget = sekali (أوي)، kayak = seperti (زي)، sama = dengan / oleh (مع / من).
      ar: |
        خبر ساخر (مكتوب للدرس): "Koalisi dan oposisi sepakat: masalah rakyat terlalu remeh untuk dibahas."
        parpol = حزب سياسي (اختصار partai politik). politikus = سياسي. koalisi = ائتلاف. oposisi = معارضة.
        aparat = أجهزة الدولة (aparat keamanan = الأجهزة الأمنية). remeh = تافه.
        ironis = فيه مفارقة. heboh = صاخب، مثير للضجة.
        - في كلام الشارع: beneran = sungguhan (حقيقيّ)، banget = sekali (جدًّا)، kayak = seperti (مثل)، sama = dengan / oleh (مع / مِن قِبَل).
      en: |
        A satirical item (written for the lesson): "Koalisi dan oposisi sepakat: masalah rakyat terlalu remeh untuk dibahas."
        parpol = political party (short for partai politik). politikus = politician. koalisi = coalition. oposisi = opposition.
        aparat = state apparatus, officials (aparat keamanan = security forces). remeh = trivial.
        ironis = ironic. heboh = sensational, a big fuss.
        - On the street: beneran = sungguhan (for real), banget = sekali (very), kayak = seperti (like), sama = dengan / oleh (with, by).
    examples:
      - text: Koalisi dan oposisi akhirnya sepakat tentang hal yang remeh.
        ar_eg: الائتلاف والمعارضة اتفقوا أخيرًا على حاجة تافهة.
        ar: اتفق الائتلاف والمعارضة أخيرًا على أمر تافه.
        en: The coalition and the opposition finally agreed on something trivial.
      - text: Politikus dari tiga parpol berebut kursi.
        ar_eg: سياسيين من تلات أحزاب بيتخانقوا على الكراسي.
        ar: يتنازع ساسة من ثلاثة أحزاب على المقاعد.
        en: Politicians from three parties fight over seats.
      - text: 'Ironis: aparat yang harus menjaga aturan malah melanggarnya.'
        ar_eg: 'مفارقة: الأجهزة اللي المفروض تحمي القانون هي اللي بتخالفه.'
        ar: من المفارقة أن الأجهزة المكلّفة بحفظ القانون تخالفه.
        en: 'Ironic: the officials who should uphold the rules break them.'
