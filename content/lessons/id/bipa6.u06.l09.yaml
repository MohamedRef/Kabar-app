        ar: ائتلاف
        en: coalition
      - text: oposisi
        ar_eg: معارضة
        ar: معارضة
        en: opposition
    words: [parpol, politikus, koalisi, oposisi]
  - id: e02
    type: match_pairs
    pairs:
      - text: aparat
        ar_eg: أجهزة الدولة
        ar: أجهزة الدولة
        en: officials, apparatus
      - text: remeh
        ar_eg: تافه
        ar: تافه
        en: trivial
      - text: ironis
        ar_eg: فيه مفارقة
        ar: مفارِق، ساخر
