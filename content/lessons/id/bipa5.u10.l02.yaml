schema: kabar.lesson/v1
id: bipa5.u10.l02
language: id
title: Bahasa presentasi
can_do:
  ar_eg: تفتح عرض تقديمي وتنقّل بين أجزائه وتختمه بأدوات ربط واضحة.
  ar: أن تفتتح عرضًا تقديميًّا وتنتقل بين أجزائه وتختمه بأدوات ربط واضحة.
  en: Open a presentation, move between its parts and close it with clear connectors.
slides:
  - title: Peta jalan presentasi
    grammar: id.argument.connectors
    body:
      ar_eg: |
        العرض (presentasi) الكويس بيقول للجمهور هو فين:
        - Hadirin yang saya hormati, … = حضراتكم المحترمين، …
        - Pertama-tama, saya akan membahas … = في الأول، هتكلم عن …
        - Selanjutnya, … = بعد كده، …
        - Oleh karena itu, … = وعلشان كده، … (نتيجة)
        - Sebagai penutup, … = وفي الختام، …
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: terus = lalu، gimana = bagaimana، buat = untuk، simpen = simpan، aja = saja.
      ar: |
        العرض الجيّد (presentasi) يُعلم الجمهور أين هو:
        - Hadirin yang saya hormati, … = أيّها الحضور الكرام، …
        - Pertama-tama, saya akan membahas … = أوّلًا، سأتناول …
        - Selanjutnya, … = بعد ذلك، …
        - Oleh karena itu, … = ولذلك، … (نتيجة)
        - Sebagai penutup, … = وختامًا، …
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: terus = lalu، gimana = bagaimana، buat = untuk، simpen = simpan، aja = saja.
      en: |
        A good presentation (presentasi) tells the audience where they are:
        - Hadirin yang saya hormati, … = Distinguished audience, …
        - Pertama-tama, saya akan membahas … = First of all, I will discuss …
        - Selanjutnya, … = Next, …
        - Oleh karena itu, … = Therefore, … (a result)
        - Sebagai penutup, … = To close, …
        The dialogue uses street forms; the formal ones are beside them: terus = lalu, gimana = bagaimana, buat = untuk, simpen = simpan, aja = saja.
    examples:
      - text: Pertama-tama, saya akan membahas sejarah Singkawang.
        ar_eg: في الأول، هتكلم عن تاريخ سينجكاوانج.
        ar: أوّلًا، سأتناول تاريخ سينغكاوانغ.
        en: First of all, I'll discuss the history of Singkawang.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: presentasi
        ar_eg: عرض تقديمي
        ar: عرض تقديمي
        en: presentation
      - text: hadirin
        ar_eg: الحاضرين
        ar: الحضور
        en: audience, those present
      - text: pertama-tama
        ar_eg: في الأول خالص
        ar: أوّلًا
        en: first of all
      - text: oleh karena itu
        ar_eg: وعلشان كده
        ar: لذلك
        en: therefore
      - text: sebagai penutup
        ar_eg: في الختام
        ar: ختامًا
        en: to close
    words: [presentasi, hadirin, pertama-tama, oleh karena itu, sebagai penutup]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: هتبدأ العرض بإيه؟
      ar: بمَ تبدأ العرض؟
      en: How do you open the presentation?
    options:
      - Sebagai penutup, terima kasih.
      - Hadirin yang saya hormati, selamat pagi.
      - Simpan pertanyaan Anda, ya.
    answer: 1
    words: [hadirin, sebagai penutup, simpan]
    explain:
      ar_eg: بتفتح العرض بـ «Hadirin yang saya hormati, selamat pagi». Sebagai penutup للآخر، و«Simpan pertanyaan» بتتقال بعد البداية.
      ar: يُفتتح العرض بـ «Hadirin yang saya hormati, selamat pagi». أما Sebagai penutup فللختام، و«Simpan pertanyaan» تأتي لاحقًا.
      en: Open with "Hadirin yang saya hormati, selamat pagi". Sebagai penutup closes, and holding questions comes later.
  - id: e03
    type: fill_blank
    sentence: Wisatawan makin banyak. ___, kota ini perlu hotel baru.
    meaning:
      ar_eg: السياح بيزيدوا. وعلشان كده، المدينة محتاجة فنادق جديدة.
      ar: يتزايد السيّاح، ولذلك تحتاج المدينة إلى فنادق جديدة.
      en: Tourists are increasing. Therefore, the city needs new hotels.
    options: [Oleh karena itu, Pertama-tama, Hadirin]
    answers: [Oleh karena itu]
    words: [oleh karena itu]
    explain:
      ar_eg: «وعلشان كده» = Oleh karena itu (نتيجة). Pertama-tama = أولًا، وHadirin = الحاضرين، مش رابط نتيجة.
      ar: «ولذلك» = Oleh karena itu للنتيجة. أما Pertama-tama فـ«أوّلًا»، وHadirin الحاضرون.
      en: "\"Therefore\" is Oleh karena itu. Pertama-tama (first of all) and Hadirin (audience) don't give a result."
  - id: e04
    type: listen
    text: Sebagai penutup, saya ingin mengucapkan terima kasih kepada Mas Rizal. Tanpa bantuannya, data dalam presentasi ini tidak akan lengkap.
    question:
      ar_eg: المتكلم بيشكر مسعود ريزال ليه؟
      ar: لماذا يشكر المتكلّم ماس ريزال؟
      en: Why does the speaker thank Mas Rizal?
    options:
      - Karena Mas Rizal membuka presentasi.
      - Karena Mas Rizal datang terlambat.
      - Karena Mas Rizal membantu melengkapi datanya.
    answer: 2
    meaning:
      ar_eg: وفي الختام، حابب أشكر ماس ريزال. من غير مساعدته، البيانات اللي في العرض ده ماكانتش هتبقى كاملة.
      ar: وختامًا، أودّ أن أشكر ماس ريزال، فلولا مساعدته لما اكتملت بيانات هذا العرض.
      en: To close, I'd like to thank Mas Rizal. Without his help, the data in this presentation wouldn't be complete.
    explain:
      ar_eg: sebagai penutup = في الختام، وtanpa bantuannya… tidak akan lengkap = من غير مساعدته البيانات ماكانتش هتكمل.
      ar: sebagai penutup = ختامًا، وtanpa bantuannya… tidak akan lengkap = لولا مساعدته لما اكتملت البيانات.
      en: sebagai penutup = to close; tanpa bantuannya… tidak akan lengkap = without his help it wouldn't be complete.
    words: [sebagai penutup]
  - id: e05
    type: build_sentence
    source:
      ar_eg: في الأول، هتكلم عن مهرجان كاب جو مِه.
      ar: أوّلًا، سأتحدّث عن مهرجان كاب غو مه.
      en: First of all, I'll talk about the Cap Go Meh festival.
    answer: Pertama-tama, saya akan membahas festival Cap Go Meh.
    distractors: [penutup, hadirin]
    words: [pertama-tama]
    explain:
      ar_eg: «في الأول» = Pertama-tama و«هتكلم عن» = akan membahas. penutup = ختام وhadirin = حاضرين، مش في الجملة.
      ar: «أوّلًا» = Pertama-tama و«سأتحدّث عن» = akan membahas. أما penutup فالختام، وhadirin الحاضرون.
      en: "\"First of all\" is Pertama-tama and \"talk about\" akan membahas. penutup and hadirin aren't in it."
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: العرض بتاعي هيبقى عشر دقايق.
      ar: سيستغرق عرضي عشر دقائق.
      en: My presentation will take ten minutes.
    answers:
      - Presentasi saya akan berlangsung sepuluh menit.
      - Presentasi saya sepuluh menit.
      - Presentasi saya akan memakan waktu sepuluh menit.
      - Presentasiku akan berlangsung selama sepuluh menit.
    words: [presentasi]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «Oleh karena itu» بتقدّم إيه؟
      ar: ماذا تقدّم «Oleh karena itu»؟
      en: What does "Oleh karena itu" introduce?
    options:
      - Sebuah akibat atau hasil.
      - Sebuah contoh.
      - Sebuah pertanyaan.
    answer: 0
    words: [oleh karena itu]
    explain:
      ar_eg: Oleh karena itu = «علشان كده»، يعني نتيجة (akibat). المثال بـ misalnya، والسؤال بـ apakah.
      ar: Oleh karena itu = «لذلك» فتقدّم نتيجة (akibat)، أما المثال فبـ misalnya والسؤال بـ apakah.
      en: Oleh karena itu introduces a result (akibat). Examples use misalnya and questions apakah.
  - id: e08
    type: speaking
    text: Hadirin yang saya hormati, silakan simpan pertanyaan Anda sampai akhir presentasi.
    meaning:
      ar_eg: حضراتكم المحترمين، ياريت تحتفظوا بأسئلتكم لحد آخر العرض.
      ar: أيّها الحضور الكرام، أرجو الاحتفاظ بأسئلتكم حتى نهاية العرض.
      en: Distinguished audience, please save your questions for the end of the presentation.
    words: [hadirin, simpan, presentasi]
  - id: e09
    type: dictation
    text: Pertama-tama, presentasi saya terdiri atas tiga bagian, dan setiap bagian berlangsung tiga menit.
    meaning:
      ar_eg: في الأول، العرض بتاعي فيه 3 أجزاء، وكل جزء مدته تلات دقايق.
      ar: أوّلًا، يتكوّن عرضي من ثلاثة أجزاء، ويستغرق كلّ جزء ثلاث دقائق.
      en: First of all, my presentation has three parts, and each part lasts three minutes.
    words: [pertama-tama, presentasi]
  - id: e10
    type: multiple_choice
    question: Simpan untuk kesimpulan, ya.
    question_meaning:
      ar_eg: Mas Rizal قال كده عن «oleh karena itu». قصده إيه؟
      ar: قال Mas Rizal هذا عن «oleh karena itu». ماذا يقصد؟
      en: Mas Rizal said this about "oleh karena itu". What does he mean?
    options:
      - Pakai kata itu nanti, di bagian kesimpulan.
      - Hapus kata itu dari presentasi.
      - Ucapkan kata itu di awal presentasi.
    answer: 0
    explain:
      ar_eg: simpan = احتفظ بيها / خزّنها لبعدين (menyimpan = يحتفظ)، يعني استخدمها في الخلاصة في الآخر.
      ar: simpan = احتفظ بها لوقت لاحق (menyimpan = يحتفظ)، أي استعملها في الخلاصة.
      en: simpan = keep it for later (menyimpan = to keep), so use it in the conclusion.
    words: [simpan, oleh karena itu]
dialogue:
  title: Latihan sebelum presentasi
  lines:
    - speaker: Mohamed
      text: Hadirin yang saya hormati, pertama-tama saya akan membahas sejarah Singkawang.
      ar_eg: حضراتكم المحترمين، في الأول هتكلم عن تاريخ سينجكاوانج.
      ar: أيّها الحضور الكرام، أوّلًا سأتناول تاريخ سينغكاوانغ.
      en: Distinguished audience, first of all I'll discuss the history of Singkawang.
    - speaker: Mas Rizal
      text: Bagus! Terus gimana caranya kamu pindah ke bagian kedua?
      ar_eg: حلو! وبعدين هتنقل للجزء التاني إزاي؟
      ar: جميل! ثمّ كيف تنتقل إلى الجزء الثاني؟
      en: Good! Then how do you move to the second part?
    - speaker: Mohamed
      text: Selanjutnya, saya akan menjelaskan festival Cap Go Meh. Oleh karena itu … hmm, belum ada hasilnya.
      ar_eg: بعد كده، هشرح مهرجان كاب جو مِه. وعلشان كده … همم، لسه مفيش نتيجة.
      ar: بعد ذلك سأشرح مهرجان كاب غو مه. ولذلك … همم، لا نتيجة بعد.
      en: Next, I'll explain the Cap Go Meh festival. Therefore … hmm, there's no result yet.
    - speaker: Mas Rizal
      text: Nah, "oleh karena itu" buat akibat. Simpen aja buat kesimpulan, ya.
      ar_eg: مظبوط، oleh karena itu للنتيجة. خليها للخلاصة.
      ar: صحيح، oleh karena itu للنتيجة، فاحتفظ بها للخلاصة.
      en: Right, "oleh karena itu" is for a result. Save it for the conclusion.
new_words:
  - word: presentasi
    pos: noun
    ar_eg: عرض تقديمي
    ar: عرض تقديمي
    en: presentation
  - word: pertama-tama
    pos: adverb
    ar_eg: في الأول خالص
    ar: أوّلًا
    en: first of all
  - word: simpan
    pos: verb
    ar_eg: 'احتفظ بيها لبعدين (menyimpan = يحتفظ / يخزّن)'
    ar: 'احتفظ بها لاحقًا (menyimpan = يحفظ)'
    en: 'keep it, save it for later (menyimpan = to keep, store)'
