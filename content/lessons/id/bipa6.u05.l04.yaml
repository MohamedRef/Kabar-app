  - id: e02
    type: listen
    text: Kalau gempa besar dan air surut, larilah ke bukit.
    question:
      ar_eg: الحكاية بتقول نعمل إيه؟
      ar: ماذا توصي الحكاية أن نفعل؟
      en: What does the story tell you to do?
    options:
      - نروح البحر نلم السمك.
      - نجري على التل.
      - نستخبى في البيت.
    answer: 1
    words: [air surut, bukit]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه عدد الضحايا في سيميولوي كان قليل سنة ٢٠٠٤؟
      ar: لماذا كان عدد الضحايا في سيميولوي قليلًا سنة ٢٠٠٤؟
      en: Why were there so few victims on Simeulue in 2004?
    options:
      - عشان مافيش زلزال هناك.
      - عشان الحكومة بنت سور.
      - عشان الناس افتكروا حكاية الـ smong.
    answer: 2
    words: [smong]
  - id: e04
    type: fill_blank
    sentence: Cerita smong adalah ___, karena tidak pernah ditulis di buku.
    meaning:
      ar_eg: حكاية الـ smong تقليد شفهي، عشان عمرها ما اتكتبت في كتاب.
      ar: حكاية الـ smong تقليد شفهي، لأنها لم تُكتب في كتاب قطّ.
      en: The smong story is an oral tradition, because it was never written in a book.
    options: [tradisi lisan, air surut, bukit]
    answers: [tradisi lisan]
    words: [tradisi lisan, smong]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «senandung» أقرب حاجة ليها إيه؟
      ar: إلامَ تقرب «senandung»؟
      en: What is a "senandung" closest to?
    options:
      - غنوة بنغنيها للأطفال بالراحة.
      - خطبة جمعة.
      - إعلان في الراديو.
    answer: 0
    words: [senandung]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الجدة غنت غنوة الـ smong لحفيدها.
      ar: غنّت الجدّة أغنية الـ smong لحفيدها.
      en: Grandmother sang the smong song to her grandchild.
    answer: Nenek menyanyikan senandung smong untuk cucunya.
    distractors: [bukit, surut]
    words: [senandung, smong]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: البحر رجع لورا فجأة.
      ar: انحسر البحر فجأة.
      en: The sea suddenly drew back.
    answers:
      - Air laut tiba-tiba surut.
      - Tiba-tiba air laut surut.
      - Air laut surut tiba-tiba.
      - Tiba-tiba air surut.
    words: [air surut]
  - id: e08
    type: speaking
    text: Tradisi lisan ini menyelamatkan ribuan nyawa di Simeulue.
    meaning:
      ar_eg: التقليد الشفهي ده نجّى آلاف الأرواح في سيميولوي.
      ar: أنقذ هذا التقليد الشفهي آلاف الأرواح في سيميولوي.
      en: This oral tradition saved thousands of lives on Simeulue.
    words: [tradisi lisan]
  - id: e09
    type: dictation
    text: Anak-anak sudah tahu jalan ke bukit sejak kecil.
    meaning:
      ar_eg: الأطفال عارفين طريق التل من وهما صغيرين.
      ar: يعرف الأطفال الطريق إلى التلّ منذ صغرهم.
      en: The children have known the way to the hill since they were little.
    words: [bukit]
  - id: e10
    type: fill_blank
    sentence: Setiap malam, ibu itu bernyanyi ___ untuk anaknya.
    meaning:
      ar_eg: كل ليلة، الأم دي بتغني بصوت واطي لابنها.
      ar: تغنّي تلك الأمّ كلّ ليلة بصوت خافت لطفلها.
      en: Every night, that mother hums a soft song to her child.
    options: [senandung, bukit, smong]
    answers: [senandung]
    words: [senandung]
dialogue:
  title: Lagu pengantar tidur
  lines:
    - speaker: Kak Rahmah
      text: Mohamed, di Simeulue ada lagu anak-anak tentang smong.
      ar_eg: يا محمد، في سيميولوي فيه غنوة أطفال عن الـ smong.
      ar: يا محمد، في سيميولوي أغنية أطفال عن الـ smong.
      en: Mohamed, on Simeulue there's a children's song about smong.
    - speaker: Mohamed
      text: Smong itu apa, Kak?
      ar_eg: يعني إيه smong؟
      ar: وما الـ smong؟
      en: What's smong, Kak?
    - speaker: Kak Rahmah
      text: Tsunami. Senandungnya bilang, kalau air surut, segera lari ke bukit.
      ar_eg: تسونامي. الغنوة بتقول لو البحر رجع لورا، اجري على التل على طول.
      ar: 'التسونامي. تقول الأغنية: إن انحسر البحر فاهرب إلى التلّ فورًا.'
      en: Tsunami. The song says, if the sea draws back, run to the hill at once.
    - speaker: Mohamed
      text: Jadi tradisi lisan bisa lebih kuat daripada sirene.
      ar_eg: يعني التقليد الشفهي ممكن يبقى أقوى من صفارة الإنذار.
      ar: إذن قد يكون التقليد الشفهي أقوى من صفّارة الإنذار.
      en: So an oral tradition can be stronger than a siren.
