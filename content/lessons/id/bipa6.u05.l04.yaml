schema: kabar.lesson/v1
id: bipa6.u05.l04
language: id
title: Smong dari Simeulue
can_do:
  ar_eg: تحكي إزاي حكاية شعبية قديمة نجّت أهل جزيرة سيميولوي من التسونامي.
  ar: أن تروي كيف أنقذت حكاية شعبية قديمة أهل جزيرة سيميولوي من التسونامي.
  en: Tell how an old oral tradition saved the people of Simeulue from the tsunami.
slides:
  - title: Kalau air laut surut
    body:
      ar_eg: |
        في جزيرة سيميولوي قدام ساحل آتشيه، الناس افتكروا تسونامي سنة ١٩٠٧، وسمّوه smong.
        - smong = الكلمة المحلية للتسونامي في سيميولوي
        - air surut = البحر يرجع لورا وينشف فجأة
        - bukit = تل / جبل صغير
        - senandung = غنوة بصوت واطي، زي اللي بنغنيها للأطفال
        - tradisi lisan = حاجة بتتنقل بالكلام من جيل لجيل، مش مكتوبة
        الرسالة في الـ senandung: لو حصل زلزال والـ air surut، اجري على الـ bukit. وفي ٢٠٠٤ الناس عملوا كده، وعدد الضحايا هناك كان قليل جدًا.
      ar: |
        في جزيرة سيميولوي قبالة ساحل آتشيه، حفظ الناس ذكرى تسونامي ١٩٠٧ وسمّوه smong.
        - smong = الاسم المحلّي للتسونامي في سيميولوي
        - air surut = انحسار البحر فجأة
        - bukit = تلّ
        - senandung = أغنية خافتة كالتي تُغنّى للأطفال
        - tradisi lisan = ما يُتناقل شفهيًّا من جيل إلى جيل دون كتابة
        ورسالة الـ senandung: إن وقع زلزال وحدث air surut فاهرب إلى الـ bukit. وفي ٢٠٠٤ فعل الناس ذلك، فكان عدد الضحايا هناك قليلًا جدًّا.
      en: |
        On Simeulue island off the Aceh coast, people remembered the 1907 tsunami and called it smong.
        - smong = the Simeulue word for tsunami
        - air surut = the sea suddenly drawing back
        - bukit = hill
        - senandung = a soft song, like one sung to children
        - tradisi lisan = oral tradition, passed on by word of mouth, not written
        The message in the senandung: if the earth shakes and there's air surut, run to the bukit. In 2004 people did just that, and very few died there.
    examples:
      - text: Ketika air surut, warga Simeulue berteriak "Smong!" dan berlari ke bukit.
        ar_eg: لما البحر رجع لورا، أهل سيميولوي زعقوا «سمونج!» وجريوا على التل.
        ar: حين انحسر البحر صاح أهل سيميولوي «سمونغ!» وركضوا إلى التلّ.
        en: When the sea drew back, Simeulue's people shouted "Smong!" and ran to the hills.
