        ar: طويل، عالٍ
        en: tall, high
      - text: baru
        ar_eg: جديد
        ar: جديد
        en: new
      - text: banyak
        ar_eg: كتير
        ar: كثير
        en: many, a lot
    words: [besar, kecil, tinggi, baru, banyak]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «بيت كبير»؟
      ar: كيف تقول «بيت كبير»؟
      en: How do you say "a big house"?
    options: ["rumah besar", "rumah-rumah besar", "besar rumah"]
    answer: 0
    explain:
      ar_eg: الاسم الأول وبعدين الصفة، زي العربي.
      ar: الاسم أولًا ثم الصفة كما في العربية.
      en: Noun first, then the adjective — Arabic order.
    words: [rumah, besar]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «عيلين» (اتنين أطفال)؟
      ar: كيف تقول «طفلان»؟
      en: How do you say "two children"?
    options: ["dua anak", "dua anak-anak", "anak dua"]
    answer: 0
    explain:
      ar_eg: العدد قبل الاسم، ومن غير تكرار لأن العدد بيوضّح إنهم أكتر من واحد.
      ar: العدد قبل الاسم، ولا تكرار لأن العدد يدل على الكثرة.
      en: The number goes first, and no repetition — the number already shows plurality.
    words: [dua, anak]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «أخويا الكبير اللي طويل»؟
      ar: كيف تقول «أخي الأكبر الطويل»؟
      en: How do you say "my older sibling, the tall one"?
    options: ["kakak saya yang tinggi", "kakak yang saya tinggi", "tinggi kakak saya"]
    answer: 0
    explain:
      ar_eg: الاسم، وبعدين صاحبه، وبعدين yang + الوصف.
      ar: الاسم ثم المضاف إليه ثم yang + الصفة.
      en: Noun, then owner, then yang + describer.
    words: [yang, tinggi]
