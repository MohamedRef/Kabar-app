      ar: أخي الأكبر طويل.
      en: My older sibling is tall.
    answer: Kakak saya tinggi.
    distractors: [yang, adik]
    explain:
      ar_eg: دي جملة كاملة (هو طويل)، فمش محتاجين yang.
      ar: هذه جملة تامة (هو طويل)، فلا حاجة إلى yang.
      en: This is a full sentence ("is tall"), so no yang is needed.
    words: [kakak, tinggi]
