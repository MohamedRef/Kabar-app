dialogue:
  title: Keluarga besar Rina
  lines:
    - speaker: Mohamed
      text: Rina, kakakmu yang mana?
      ar_eg: يا رينا، أنهي واحدة أختك الكبيرة؟
      ar: يا رينا، أيّهم أختك الكبرى؟
      en: Rina, which one is your older sister?
    - speaker: Rina
      text: Kakak saya yang tinggi itu. Namanya Ayu.
      ar_eg: أختي الكبيرة الطويلة دي. اسمها أيو.
      ar: أختي الكبرى الطويلة تلك. اسمها أيو.
      en: My older sister is the tall one there. Her name is Ayu.
    - speaker: Mohamed
      text: Dan anak-anak itu?
      ar_eg: والعيال دول؟
      ar: وأولئك الأطفال؟
      en: And those children?
    - speaker: Rina
      text: Itu anak-anak Kak Ayu. Dia punya dua anak.
      ar_eg: دول عيال أيو. عندها عيلين.
      ar: أولئك أطفال أيو، فلديها طفلان.
      en: Those are Ayu's children. She has two kids.
    - speaker: Mohamed
      text: Keluargamu besar!
      ar_eg: عيلتك كبيرة!
      ar: عائلتك كبيرة!
      en: Your family is big!
    - speaker: Rina
      text: Ya, keluarga kami besar, tapi rumah kami kecil!
      ar_eg: أيوه، عيلتنا كبيرة، بس بيتنا صغيّر!
      ar: نعم، عائلتنا كبيرة، لكن بيتنا صغير!
      en: Yes, our family is big, but our house is small!
