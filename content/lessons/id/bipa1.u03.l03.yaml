schema: kabar.lesson/v1
id: bipa1.u03.l03
language: id
title: Kakak saya yang tinggi
can_do:
  ar_eg: ترتّب الاسم والوصف صح، وتعمل الجمع.
  ar: أن ترتّب الاسم وصفاته ترتيبًا صحيحًا، وتصوغ الجمع.
  en: Order nouns and describers; make plurals.
slides:
  - title: Rumah besar = بيت كبير
    body:
      ar_eg: |
        القاعدة الذهبية: الاسم الأول، وبعدين كل اللي بيوصفه — زي العربي بالظبط وعكس الإنجليزي.
        - rumah besar = بيت كبير
        - rumah besar saya = بيتي الكبير
        - rumah besar saya itu = بيتي الكبير ده
      ar: |
        القاعدة الذهبية: الاسم أولًا ثم كل ما يصفه، كالعربية تمامًا وعلى عكس الإنجليزية.
        - rumah besar = بيت كبير
        - rumah besar saya = بيتي الكبير
        - rumah besar saya itu = بيتي الكبير ذاك
      en: |
        The golden rule: the noun first, then everything describing it — Arabic order, the reverse of English.
        - rumah besar = big house
        - rumah besar saya = my big house
        - rumah besar saya itu = that big house of mine
    grammar: id.noun-phrase.order
    examples:
      - text: Ini rumah baru saya.
        ar_eg: ده بيتي الجديد.
        ar: هذا بيتي الجديد.
        en: This is my new house.
      - text: Adik saya kecil.
        ar_eg: أخويا (الأصغر مني) لسه صغيّر.
        ar: أخي الأصغر صغير.
        en: My younger sibling is little.
  - title: Kakak saya yang tinggi
    body:
      ar_eg: |
        yang = «اللي». بتستخدمها عشان تحدد واحد معيّن أو تزوّد وصف:
        «kakak saya yang tinggi» = «أخويا الكبير اللي طويل» (يعني مش التاني).
        والسؤال: «yang mana?» = «أنهي واحد؟».
      ar: |
        yang = «الذي / التي». تُستعمل لتعيين واحد بعينه أو لإضافة وصف:
        «kakak saya yang tinggi» = «أخي الأكبر الطويل» (لا الآخر).
        والسؤال: «yang mana?» = «أيّهم؟».
      en: |
        yang = "the one that / who". Use it to pick one out or to add a describer:
        "kakak saya yang tinggi" = "my older sibling, the tall one" (not the other).
        The question: "yang mana?" = "which one?"
    grammar: id.noun-phrase.order
    examples:
      - text: Kakak saya yang tinggi itu dokter.
        ar_eg: أخويا الكبير الطويل ده دكتور.
        ar: أخي الأكبر الطويل ذاك طبيب.
        en: My tall older sibling is a doctor.
      - text: Kakakmu yang mana?
        ar_eg: أنهي واحد فيهم أخوك الكبير؟
        ar: أيّهم أخوك الأكبر؟
        en: Which one is your older sibling?
  - title: Dua anak, banyak orang
    body:
      ar_eg: |
        الاستثناء الوحيد: العدد والكمية بييجوا قبل الاسم، زي «تلات كتب».
        - dua anak = عيلين، tiga adik = تلات إخوات صغيرين
        - banyak orang = ناس كتير، semua keluarga saya = عيلتي كلها
        (الأرقام كلها جاية في الوحدة الجاية.)
      ar: |
        الاستثناء الوحيد: العدد والكمية يسبقان الاسم، كقولنا «ثلاثة كتب».
        - dua anak = طفلان، tiga adik = ثلاثة إخوة أصغر
        - banyak orang = ناس كثيرون، semua keluarga saya = عائلتي كلها
        (الأعداد كاملة في الوحدة القادمة.)
      en: |
        The one exception: numbers and quantities go before the noun, like Arabic «ثلاثة كتب».
        - dua anak = two children, tiga adik = three younger siblings
        - banyak orang = many people, semua keluarga saya = all my family
        (The full number system comes next unit.)
    grammar: id.noun-phrase.order
    examples:
      - text: Saya punya dua adik.
        ar_eg: عندي اتنين إخوات أصغر مني.
        ar: لديّ أخوان أصغر مني.
        en: I have two younger siblings.
      - text: Banyak orang di Cikini.
        ar_eg: فيه ناس كتير في تشيكيني.
        ar: في تشيكيني ناس كثيرون.
        en: There are many people in Cikini.
  - title: Anak-anak
    body:
      ar_eg: |
        مافيش جمع تكسير ولا سالم! الاسم لوحده ممكن يبقى واحد أو كتير. ولو عايز تأكد إنهم كتير، كرّر الكلمة بشَرطة: anak-anak = العيال، buku-buku = كتب.
        بس عمرك ما تكرر بعد عدد أو banyak / semua: dua anak مش dua anak-anak.
        وفي الشات بيكتبوها برقم ٢: anak2.
      ar: |
        لا جمع تكسير ولا جمع سالم! الاسم المفرد قد يدل على الواحد أو الكثير، وللتأكيد على الكثرة يُكرَّر بشرطة: anak-anak = الأطفال، buku-buku = كتب.
        ولا يُكرَّر بعد عدد أو بعد banyak / semua: dua anak لا dua anak-anak.
        وفي المحادثات يُكتب التكرار بالرقم ٢: anak2.
      en: |
        No broken or sound plurals! A bare noun can be one or many. To stress "many", repeat it with a hyphen: anak-anak = children, buku-buku = books.
        Never repeat after a number or banyak / semua: dua anak, not dua anak-anak.
        In chats the repeat is written with a 2: anak2.
    grammar: id.reduplication.plural
    examples:
      - text: Anak-anak bermain di taman.
        ar_eg: العيال بيلعبوا في الجنينة.
        ar: الأطفال يلعبون في الحديقة.
        en: The children are playing in the park.
      - text: Buku-buku itu punya Rina.
        ar_eg: الكتب دي بتاعة رينا.
        ar: تلك الكتب لرينا.
        en: Those books are Rina's.
