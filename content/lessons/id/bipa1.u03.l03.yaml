    ar_eg: كتاب
    ar: كتاب
    en: book
  - word: tas
    pos: noun
    ar_eg: شنطة
    ar: حقيبة
    en: bag
  - word: punya
    pos: verb
    ar_eg: بتاع؛ يملك
    ar: مِلك؛ يملك
    en: belonging to; to have, own
  - word: -ku
    pos: pronoun
    ar_eg: ـي (بتاعي)
    ar: ياء المتكلم
    en: my (attached)
  - word: -mu
    pos: pronoun
    ar_eg: ـك (بتاعك)
    ar: كاف المخاطب
    en: your (attached)
  - word: -nya
    pos: pronoun
    ar_eg: ـه / ـها (بتاعه / بتاعها)
    ar: هاء الغائب
    en: his, her, its, their (attached)
