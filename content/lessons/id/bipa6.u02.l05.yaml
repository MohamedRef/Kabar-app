schema: kabar.lesson/v1
id: bipa6.u02.l05
language: id
title: Chairil Anwar
can_do:
  ar_eg: تتكلم عن شاعر إندونيسيا الأشهر وتفهم سطرين من قصيدته «Aku».
  ar: أن تتحدّث عن أشهر شعراء إندونيسيا وتفهم سطرين من قصيدته «Aku».
  en: Talk about Indonesia's most famous poet and understand two lines of his poem «Aku».
slides:
  - title: Binatang jalang
    body:
      ar_eg: |
        Chairil Anwar (١٩٢٢–١٩٤٩) اتولد في ميدان ومات في جاكرتا وهو عنده ٢٦ سنة بس.
        - sajak = قصيدة (كلمة تانية لـ puisi)
        - pelopor = رائد، أول واحد يفتح طريق جديد
        - angkatan = جيل أدبي: هو رائد Angkatan 45
        - jalang = برّي، متوحش، مش متربي
        - semangat = روح وحماس
        من قصيدته «Aku» (١٩٤٣):
        Aku ini binatang jalang
        Dari kumpulannya terbuang
        - في الشارع: baca = membaca (يقرا)، banget = sekali (أوي).
      ar: |
        وُلد Chairil Anwar (١٩٢٢–١٩٤٩) في ميدان ومات في جاكرتا ولم يتجاوز السادسة والعشرين.
        - sajak = قصيدة (مرادف لـ puisi)
        - pelopor = رائد، أوّل من يشقّ طريقًا جديدًا
        - angkatan = جيل أدبي، وهو رائد Angkatan 45
        - jalang = برّي، متوحّش، غير مروَّض
        - semangat = روح، حماسة
        ومن قصيدته «Aku» (١٩٤٣):
        Aku ini binatang jalang
        Dari kumpulannya terbuang
        - في كلام الشارع: baca = membaca (يقرأ)، banget = sekali (جدًّا).
      en: |
        Chairil Anwar (1922–1949) was born in Medan and died in Jakarta aged only 26.
        - sajak = poem (another word for puisi)
        - pelopor = pioneer, the first to open a new path
        - angkatan = literary generation; he led Angkatan 45
        - jalang = wild, untamed
        - semangat = spirit, drive
        From his poem «Aku» (1943):
        Aku ini binatang jalang
        Dari kumpulannya terbuang
        - On the street: baca = membaca (to read), banget = sekali (very).
    examples:
      - text: Sajak "Aku" penuh semangat bebas dan berani.
        ar_eg: قصيدة «Aku» مليانة روح حرة وجريئة.
        ar: تفيض قصيدة «Aku» بروح حرّة جريئة.
        en: The poem "Aku" is full of a free, bold spirit.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sajak
        ar_eg: قصيدة
        ar: قصيدة
        en: poem
      - text: pelopor
        ar_eg: رائد
        ar: رائد
        en: pioneer
      - text: angkatan
        ar_eg: جيل أدبي
        ar: جيل
        en: generation
      - text: jalang
        ar_eg: برّي
        ar: برّي، متوحّش
        en: wild
      - text: semangat
        ar_eg: حماس
        ar: حماسة
        en: spirit
    words: [sajak, pelopor, angkatan, jalang, semangat]
  - id: e02
    type: listen
    text: Chairil Anwar meninggal pada tahun 1949, ketika umurnya baru dua puluh enam tahun.
    question:
      ar_eg: تشايريل أنوار مات وعنده كام سنة؟
      ar: كم كان عمر تشايريل أنوار حين مات؟
      en: How old was Chairil Anwar when he died?
    options:
      - ستين سنة.
      - ستة وعشرين سنة.
      - ستاشر سنة.
    answer: 1
    words: [sajak]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «Aku ini binatang jalang» الشاعر بيوصف نفسه بإيه؟
      ar: بمَ يصف الشاعر نفسه في «Aku ini binatang jalang»؟
      en: In "Aku ini binatang jalang", how does the poet describe himself?
    options:
      - حيوان أليف في بيت.
      - راجل عجوز تعبان.
      - حيوان برّي محدش يقدر يروّضه.
    answer: 2
    explain:
      ar_eg: jalang = برّي. هو بيقول إنه حر ومش تبع حد، ودي استعارة.
      ar: jalang = برّي؛ فهو يقول إنه حرّ لا يتبع أحدًا، وهي استعارة.
      en: jalang = wild. He's saying he is free and belongs to no one; it's a metaphor.
    words: [jalang]
  - id: e04
    type: fill_blank
    sentence: Chairil Anwar adalah ___ Angkatan 45 dalam sastra Indonesia.
    meaning:
      ar_eg: تشايريل أنوار رائد جيل ٤٥ في الأدب الإندونيسي.
      ar: تشايريل أنوار رائد جيل ٤٥ في الأدب الإندونيسي.
      en: Chairil Anwar is the pioneer of Angkatan 45 in Indonesian literature.
    options: [pelopor, redaktur, pencerita]
    answers: [pelopor]
    words: [pelopor, angkatan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: قصايده مليانة روح الحرية.
      ar: قصائده مفعمة بروح الحرّية.
      en: His poems are full of the spirit of freedom.
    answer: Sajak-sajaknya penuh semangat kebebasan.
    distractors: [jalang, pelopor]
    words: [sajak, semangat]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الشاعر ده رائد جيل جديد.
      ar: هذا الشاعر رائد جيل جديد.
      en: This poet is the pioneer of a new generation.
    answers:
      - Penyair ini pelopor angkatan baru.
      - Penyair ini adalah pelopor angkatan baru.
      - Penyair itu pelopor angkatan baru.
      - Penyair itu adalah pelopor angkatan baru.
    words: [pelopor, angkatan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «sajak» معناها إيه؟
      ar: ما معنى «sajak»؟
      en: What does "sajak" mean?
    options: [puisi, cerpen, kumpulan cerpen]
    answer: 0
    words: [sajak]
  - id: e08
    type: speaking
    text: Aku ini binatang jalang, dari kumpulannya terbuang.
    meaning:
      ar_eg: أنا حيوان برّي، مطرود من قطيعه.
      ar: أنا حيوان برّيّ، منبوذ من قطيعه.
      en: I am a wild animal, cast out from its herd.
    words: [jalang]
  - id: e09
    type: dictation
    text: Angkatan muda membaca sajak Chairil dengan penuh semangat.
    meaning:
      ar_eg: الجيل الشاب بيقرا قصايد تشايريل بحماس كبير.
      ar: يقرأ الجيل الشابّ قصائد تشايريل بحماسة كبيرة.
      en: The young generation reads Chairil's poems with great enthusiasm.
    words: [angkatan, semangat]
  - id: e10
    type: fill_blank
    sentence: Kuda ___ itu tidak mau dinaiki siapa pun.
    meaning:
      ar_eg: الحصان البرّي ده مش راضي حد يركبه.
      ar: لا يقبل ذلك الحصان البرّي أن يمتطيه أحد.
      en: That wild horse won't let anyone ride it.
    options: [jalang, semangat, sajak]
    answers: [jalang]
    words: [jalang]
dialogue:
  title: Hidup seribu tahun lagi
  lines:
    - speaker: Encik Zul
      text: Kenal Chairil Anwar, Mohamed? Dia pelopor puisi modern kita.
      ar_eg: تعرف تشايريل أنوار يا محمد؟ ده رائد الشعر الحديث عندنا.
      ar: أتعرف تشايريل أنوار يا محمد؟ إنه رائد شعرنا الحديث.
      en: Do you know Chairil Anwar, Mohamed? He pioneered our modern poetry.
    - speaker: Mohamed
      text: Saya baru baca sajak "Aku". Semangatnya keras banget.
      ar_eg: لسه قاري قصيدة «Aku». روحها قوية جدًا.
      ar: قرأت للتوّ قصيدة «Aku»، وروحها قويّة جدًّا.
      en: I've just read the poem "Aku". Its spirit is so fierce.
    - speaker: Encik Zul
      text: Betul. Di akhir sajak dia menulis, "Aku mau hidup seribu tahun lagi."
      ar_eg: 'مظبوط. وفي آخر القصيدة كتب: «عايز أعيش ألف سنة كمان».'
      ar: 'صحيح، وفي ختامها كتب: «أريد أن أحيا ألف عام أخرى».'
      en: Right. At the end he wrote, "I want to live a thousand more years."
    - speaker: Mohamed
      text: Dia meninggal muda, tetapi sajaknya masih hidup sampai sekarang.
      ar_eg: هو مات صغير، بس قصايده لسه عايشة لحد النهارده.
      ar: مات شابًّا، لكنّ قصائده ما زالت حيّة إلى اليوم.
      en: He died young, but his poems are still alive today.
