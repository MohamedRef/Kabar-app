schema: kabar.lesson/v1
id: bipa2.u09.l03
language: id
title: Indah dan menyenangkan
can_do:
  ar_eg: تكتب حكاية رحلة حلوة ومليانة إحساس.
  ar: أن تكتب سردًا حيًّا لرحلة.
  en: Write a lively recount.
slides:
  - title: Kata sifat untuk cerita
    body:
      ar_eg: |
        عشان حكايتك تبقى حلوة، محتاج صفات:
        - indah = جميل (منظر)، sejuk = منعش / بارد لطيف (هوا)، tenang = هادي.
        - ramai = زحمة / فيه ناس كتير، sepi = فاضي / هادي.
        - menyenangkan = ممتع / بيبسط، seru = جامد / مثير (عامية)، melelahkan = متعب.
      ar: |
        ليكون سردك حيًّا تحتاج إلى صفات:
        - indah = جميل، sejuk = منعش، tenang = هادئ.
        - ramai = مزدحم، sepi = خالٍ / هادئ.
        - menyenangkan = ممتع، seru = مثير (عامية)، melelahkan = مُتعب.
      en: |
        A lively story needs adjectives:
        - indah = beautiful, sejuk = cool and fresh, tenang = calm.
        - ramai = busy, crowded; sepi = quiet, empty.
        - menyenangkan = fun, pleasant; seru = exciting (casual); melelahkan = tiring.
    examples:
      - text: Udara pagi di Lovina sejuk dan lautnya tenang.
        ar_eg: هوا الصبح في لوفينا منعش والبحر هادي.
        ar: هواء الصباح في لوفينا منعش والبحر هادئ.
        en: The morning air in Lovina is cool and the sea is calm.
  - title: Pertama … akhirnya
    body:
      ar_eg: |
        رتّب الحكاية بالكلمات اللي اتعلمتها: pertama → lalu → setelah itu → akhirnya.
        وبعد كل حدث حط إحساسك بصفة أو بكلمة زي wah: «Lalu, kami melihat lumba-lumba. Wah, seru sekali!»
      ar: |
        رتّب السرد بالكلمات التي تعلمتها: pertama ← lalu ← setelah itu ← akhirnya.
        وأضف شعورك بعد كل حدث بصفة أو بلفظ مثل wah: «Lalu, kami melihat lumba-lumba. Wah, seru sekali!»
      en: |
        Order the story with the words you know: pertama → lalu → setelah itu → akhirnya.
        After each event add a feeling, with an adjective or a word like wah: "Lalu, kami melihat lumba-lumba. Wah, seru sekali!"
    grammar: id.conjunction.sequence
    examples:
      - text: Pertama, kami naik perahu jam enam pagi.
        ar_eg: الأول ركبنا مركب الساعة ستة الصبح.
        ar: أولًا ركبنا قاربًا في السادسة صباحًا.
        en: First, we got on a boat at six in the morning.
      - text: Lalu, kami melihat matahari terbit. Indah sekali!
        ar_eg: وبعدين شفنا الشروق. جميل جدًا!
        ar: ثم شاهدنا شروق الشمس. ما أجمله!
        en: Then we watched the sunrise. So beautiful!
  - title: Menyenangkan, melelahkan
    body:
      ar_eg: |
        كلمات menyenangkan وmelelahkan على شكل me- … -kan، ومعناها «اللي بيعمل الإحساس ده»:
        - senang = مبسوط → menyenangkan = بيبسط.
        - lelah = تعبان → melelahkan = بيتعب.
        ماتحتاجش تعمل الكلمات دي بنفسك دلوقتي، بس احفظها كده.
      ar: |
        menyenangkan وmelelahkan على وزن me- … -kan، أي «ما يُحدث هذا الشعور»:
        - senang = مسرور ← menyenangkan = ممتع.
        - lelah = متعب ← melelahkan = مُتعب.
        احفظهما كما هما الآن.
      en: |
        menyenangkan and melelahkan have the shape me- … -kan: "causing that feeling".
        - senang = happy → menyenangkan = fun, pleasant.
        - lelah = tired → melelahkan = tiring.
        Just learn them as words for now.
    examples:
      - text: Perjalanannya panjang dan melelahkan, tapi kami senang.
        ar_eg: الرحلة كانت طويلة ومتعبة، بس كنا مبسوطين.
        ar: كانت الرحلة طويلة ومتعبة، لكننا كنا مسرورين.
        en: The journey was long and tiring, but we were happy.
  - title: Akhirnya … capek, tapi senang!
    body:
      ar_eg: |
        اختم الحكاية بـ akhirnya وإحساسك في الآخر. جملة إندونيسية مشهورة: «Capek, tapi senang!» = تعبان بس مبسوط!
        وابدأها بالوقت والمكان: «Minggu lalu, saya berlibur ke Lovina.»
      ar: |
        اختم السرد بـ akhirnya وبشعورك الأخير، ومن العبارات الشائعة: «Capek, tapi senang!» = متعب لكني سعيد!
        وابدأه بالزمان والمكان: «Minggu lalu, saya berlibur ke Lovina.»
      en: |
        Close with akhirnya and how you felt. A favourite Indonesian line: "Capek, tapi senang!" = tired but happy!
        Open with time and place: "Minggu lalu, saya berlibur ke Lovina."
    grammar: id.conjunction.sequence
    examples:
      - text: Akhirnya, kami pulang ke hotel. Capek, tapi senang!
        ar_eg: وفي الآخر رجعنا الفندق. تعبانين بس مبسوطين!
        ar: وأخيرًا عدنا إلى الفندق، متعبين لكن سعداء!
        en: Finally, we went back to the hotel. Tired but happy!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: menyenangkan
        ar_eg: ممتع
        ar: ممتع
        en: fun, pleasant
      - text: sejuk
        ar_eg: منعش (هوا)
        ar: منعش
        en: cool and fresh
      - text: melelahkan
        ar_eg: متعب
        ar: مُتعب
        en: tiring
      - text: perahu
        ar_eg: مركب
        ar: قارب
        en: boat
      - text: matahari terbit
        ar_eg: الشروق
        ar: شروق الشمس
        en: sunrise
      - text: perjalanan
        ar_eg: رحلة، مشوار
        ar: رحلة
        en: journey
    words: [menyenangkan, sejuk, melelahkan, perahu, matahari terbit, perjalanan]
  - id: e02
    type: multiple_choice
    question: Liburan saya di Lovina sangat ___.
    question_meaning:
      ar_eg: أجازتك كانت ممتعة جدًا. تختار أنهي صفة؟
      ar: كانت عطلتك ممتعة جدًا. أيّ صفة تختار؟
      en: Your holiday was really fun. Which adjective?
    options: [melelahkan, sejuk, menyenangkan]
    answer: 2
    words: [menyenangkan, sejuk, melelahkan]
    explain:
      ar_eg: menyenangkan = ممتع (me- + senang + -kan). melelahkan = متعب، وsejuk = هوا منعش.
      ar: menyenangkan = ممتع. أما melelahkan فمُتعب وsejuk منعش البرودة.
      en: menyenangkan = fun (me- + senang + -kan). melelahkan is tiring, sejuk cool and fresh.
  - id: e03
    type: listen
    text: Kami naik perahu jam enam pagi.
    options: [Kami naik perahu jam enam pagi., Kami naik bus jam enam pagi., Kami naik perahu jam enam sore.]
    answer: 0
    words: [perahu]
  - id: e04
    type: fill_blank
    sentence: Perjalanannya panjang dan ___, tapi kami senang.
    meaning:
      ar_eg: الرحلة كانت طويلة ومتعبة، بس كنا مبسوطين.
      ar: كانت الرحلة طويلة ومتعبة، لكننا كنا سعداء.
      en: The journey was long and tiring, but we were happy.
    options: [sejuk, menyenangkan, melelahkan]
    answers: [melelahkan]
    explain:
      ar_eg: tapi (بس) بتقول إن اللي قبلها عكس «مبسوطين»، يبقى melelahkan.
      ar: tapi تدل على تضاد مع «سعداء»، فالمناسب melelahkan.
      en: tapi (but) signals a contrast with "happy", so melelahkan.
    words: [melelahkan, perjalanan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: بعد كده ركبنا مركب وشفنا دلافين.
      ar: بعد ذلك ركبنا قاربًا ورأينا دلافين.
      en: After that, we took a boat and saw dolphins.
    answer: Setelah itu, kami naik perahu dan melihat lumba-lumba.
    distractors: [akhirnya, sangat]
    words: [setelah itu, perahu, lumba-lumba]
    explain:
      ar_eg: Setelah itu = بعد كده، وnaik perahu = ركبنا مركب. akhirnya للآخر، وsangat = جدًا.
      ar: Setelah itu = بعد ذلك. أما akhirnya فللنهاية وsangat «جدًا».
      en: Setelah itu = after that. akhirnya is for the end, sangat means very.
  - id: e06
    type: speaking
    text: Pertama, kami melihat matahari terbit. Setelah itu, kami melihat lumba-lumba. Perjalanannya seru sekali!
    meaning:
      ar_eg: الأول شفنا الشروق، وبعد كده شفنا الدلافين. الرحلة كانت جامدة جدًا!
      ar: أولًا شاهدنا الشروق، وبعد ذلك رأينا الدلافين. كانت الرحلة مثيرة جدًا!
      en: First we watched the sunrise. After that we saw the dolphins. The trip was so exciting!
    words: [pertama, matahari terbit, setelah itu, seru, perjalanan]
  - id: e07
    type: multiple_choice
    question: Saat matahari terbit, pagi di Lovina ___.
    question_meaning:
      ar_eg: وقت الشروق الهوا كان منعش وبارد شوية. أنهي كلمة؟
      ar: عند الشروق كان الهواء منعشًا وباردًا قليلًا. أيّ كلمة؟
      en: At sunrise the air was cool and fresh. Which word?
    options: [melelahkan, sejuk, menyenangkan]
    answer: 1
    words: [matahari terbit, sejuk, menyenangkan, melelahkan]
    explain:
      ar_eg: sejuk = بارد ومنعش، للهوا الحلو الصبح. melelahkan متعب، وmenyenangkan ممتع، ودول مش للهوا.
      ar: sejuk = بارد منعش، للهواء. أما melelahkan وmenyenangkan فلا يصفان الهواء.
      en: sejuk = cool and fresh, for air. melelahkan and menyenangkan don't describe air.
dialogue:
  title: Cerita dari Lovina
  lines:
    - speaker: Rina
      text: Bagaimana liburanmu di Lovina?
      ar_eg: إيه أخبار أجازتك في لوفينا؟
      ar: كيف كانت عطلتك في لوفينا؟
      en: How was your holiday in Lovina?
    - speaker: Mohamed
      text: Menyenangkan sekali! Pertama, kami naik perahu jam enam pagi.
      ar_eg: ممتعة جدًا! الأول ركبنا مركب الساعة ستة الصبح.
      ar: ممتعة جدًا! أولًا ركبنا قاربًا في السادسة صباحًا.
      en: So much fun! First, we got on a boat at six in the morning.
    - speaker: Rina
      text: Pagi sekali! Lalu?
      ar_eg: بدري أوي! وبعدين؟
      ar: باكرًا جدًا! ثم ماذا؟
      en: So early! And then?
    - speaker: Mohamed
      text: Lalu, kami melihat matahari terbit. Udaranya sejuk dan lautnya tenang.
      ar_eg: وبعدين شفنا الشروق. الهوا كان منعش والبحر هادي.
      ar: ثم شاهدنا الشروق، وكان الهواء منعشًا والبحر هادئًا.
      en: Then we watched the sunrise. The air was cool and the sea was calm.
    - speaker: Rina
      text: Kamu melihat lumba-lumba?
      ar_eg: شفت دلافين؟
      ar: هل رأيت الدلافين؟
      en: Did you see dolphins?
    - speaker: Mohamed
      text: Iya! Setelah itu, banyak lumba-lumba datang. Seru sekali! Akhirnya kami kembali ke pantai. Capek, tapi senang!
      ar_eg: أيوه! بعد كده جت دلافين كتير. كانت جامدة! وفي الآخر رجعنا الشط. تعبانين بس مبسوطين!
      ar: نعم! بعد ذلك جاءت دلافين كثيرة، وكان الأمر مثيرًا جدًا. وأخيرًا عدنا إلى الشاطئ، متعبين لكن سعداء!
      en: Yes! After that, lots of dolphins came. So exciting! Finally we went back to the beach. Tired but happy!
