schema: kabar.lesson/v1
id: bipa4.u06.l07
language: id
title: Konro dan coto
can_do:
  ar_eg: تطلب أكل ماكاسار المشهور وتوصف الريحة والطعم ودرجة الاستواء.
  ar: أن تطلب أكلات ماكاسار المشهورة وتصف الرائحة والطعم ودرجة النضج.
  en: Order Makassar's famous dishes and describe smell, taste and how well done they are.
slides:
  - title: Wisata kuliner
    body:
      ar_eg: |
        masakan = أكل مطبوخ، طبخ (masakan Makassar)، hidangan = طبق، أكلة بتتقدّم.
        menu = منيو، selera = ذوق (sesuai selera = على ذوقك)، aroma = ريحة حلوة.
        busuk = بايظ، معفّن، panggang = مشوي في الفرن أو على النار، saus = صوص.
      ar: |
        masakan = طعام مطبوخ، مطبخ (masakan Makassar)، hidangan = طبق يُقدَّم.
        menu = قائمة الطعام، selera = ذوق (sesuai selera = حسب الذوق)، aroma = رائحة طيبة.
        busuk = فاسد، متعفّن، panggang = مشويّ أو مخبوز، saus = صلصة.
      en: |
        masakan = cooking, cuisine (masakan Makassar); hidangan = dish (served).
        menu = menu, selera = taste, appetite (sesuai selera = to taste); aroma = aroma.
        busuk = rotten, off; panggang = grilled, roasted, baked; saus = sauce.
    examples:
      - text: Coto Makassar adalah masakan khas kota ini.
        ar_eg: كوتو ماكاسار أكلة مشهورة في المدينة دي.
        ar: كوتو ماكاسار طبق مميّز لهذه المدينة.
        en: Coto Makassar is this city's signature dish.
      - text: Aroma konro bakar tercium dari jauh.
        ar_eg: ريحة الكونرو المشوي باينة من بعيد.
        ar: تُشمّ رائحة الكونرو المشوي من بعيد.
        en: You can smell grilled konro from far away.
      - text: Dagingnya sudah matang. Silakan makan.
        ar_eg: اللحمة استوت. اتفضل كُل.
        ar: نضج اللحم. تفضّل بالأكل.
        en: The meat is done. Please eat.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: masakan
        ar_eg: أكل مطبوخ
        ar: طعام مطبوخ
        en: cuisine
      - text: hidangan
        ar_eg: طبق
        ar: طبق
        en: dish
      - text: menu
        ar_eg: منيو
        ar: قائمة الطعام
        en: menu
      - text: selera
        ar_eg: ذوق
        ar: ذوق
        en: taste
    words: [masakan, hidangan, menu, selera]
  - id: e02
    type: match_pairs
    pairs:
      - text: aroma
        ar_eg: ريحة
        ar: رائحة
        en: aroma
      - text: busuk
        ar_eg: بايظ، معفّن
        ar: فاسد
        en: rotten
      - text: panggang
        ar_eg: مشوي
        ar: مشويّ
        en: grilled
      - text: saus
        ar_eg: صوص
        ar: صلصة
        en: sauce
    words: [aroma, busuk, panggang, saus]
  - id: e03
    type: listen
    text: Boleh saya lihat menunya? Saya mau hidangan khas Makassar.
    question:
      ar_eg: هو عايز يشوف إيه؟
      ar: ماذا يريد أن يرى؟
      en: What does he want to see?
    options: [المنيو, الحساب, الشوكة]
    answer: 0
    meaning:
      ar_eg: ممكن أشوف المنيو؟ عايز أكلة من أكلات ماكاسار.
      ar: هل يمكن أن أرى قائمة الطعام؟ أريد طبقًا مميزًا من ماكاسار.
      en: May I see the menu? I'd like a Makassar speciality.
    words: [menu, hidangan]
  - id: e04
    type: fill_blank
    sentence: Jangan makan ikan ini. Ikannya sudah ___.
    meaning:
      ar_eg: ما تاكلش السمك ده. السمك ___.
      ar: لا تأكل هذا السمك، فقد صار ___.
      en: Don't eat this fish. It's gone ___.
    options: [busuk, aroma, menu]
    answers: [busuk]
    words: [busuk, aroma, menu]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حاجة سايلة بتتحط على الأكل، زي الكاتشب. ده إيه؟
      ar: سائل يوضع على الطعام مثل الكاتشب. ما هو؟
      en: A liquid you put on food, like ketchup. What is it?
    options: [selera, saus, panggang]
    answer: 1
    explain:
      ar_eg: saus = صوص.
      ar: saus = صلصة.
      en: saus = sauce.
    words: [selera, saus, panggang]
  - id: e06
    type: fill_blank
    sentence: Ikan ___ ini dimasak di atas api.
    meaning:
      ar_eg: السمك ___ ده اتطبخ على النار.
      ar: طُهي هذا السمك ___ على النار.
      en: This ___ fish was cooked over a fire.
    options: [panggang, busuk, hidangan]
    answers: [panggang]
    words: [panggang, busuk, hidangan]
  - id: e07
    type: multiple_choice
    question: Pedas atau tidak? Sesuai ___ Anda saja.
    options: [aroma, masakan, selera]
    answer: 2
    explain:
      ar_eg: sesuai selera = على ذوقك.
      ar: sesuai selera = حسب ذوقك.
      en: sesuai selera = as you like it.
    words: [aroma, masakan, selera]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ريحة الأكل ده حلوة أوي.
      ar: رائحة هذا الطعام طيبة جدًا.
      en: This food smells wonderful.
    answer: Aroma masakan ini enak sekali.
    distractors: [saus, menu]
    words: [aroma, masakan, saus, menu]
  - id: e09
    type: translate
    direction: from_target
    source_text: Hidangan ini pakai saus kacang yang pedas.
    answers_meaning:
      ar_eg: [الطبق ده بصوص فول سوداني حرّاق, الأكلة دي معاها صوص سوداني حامي]
      ar: [يُقدَّم هذا الطبق بصلصة فول سوداني حارّة, في هذا الطبق صلصة فول سوداني حارة]
      en: [This dish comes with spicy peanut sauce, The dish has a spicy peanut sauce]
    words: [hidangan, saus]
  - id: e10
    type: speaking
    text: Konro panggang ini sudah matang dan aromanya enak.
    meaning:
      ar_eg: الكونرو المشوي ده استوى وريحته حلوة.
      ar: نضج هذا الكونرو المشوي ورائحته طيبة.
      en: This grilled konro is done and smells great.
    words: [panggang, aroma, hidangan, selera]
dialogue:
  lines:
    - speaker: Pelayan
      text: Selamat malam. Ini menunya, Pak.
      ar_eg: مساء الخير. اتفضل المنيو يا أستاذ.
      ar: مساء الخير. تفضّل قائمة الطعام يا سيدي.
      en: Good evening. Here's the menu, sir.
    - speaker: Mohamed
      text: Terima kasih. Hidangan apa yang paling terkenal di sini?
      ar_eg: شكرًا. إيه أشهر أكلة عندكم؟
      ar: شكرًا. ما أشهر طبق هنا؟
      en: Thank you. What's the most famous dish here?
    - speaker: Pelayan
      text: Konro panggang. Iga sapi dengan saus kacang. Aromanya harum sekali.
      ar_eg: كونرو مشوي. ريش بقري بصوص سوداني. ريحته تجنن.
      ar: 'كونرو مشوي: أضلاع بقر بصلصة الفول السوداني. رائحته زكية جدًا.'
      en: Grilled konro. Beef ribs with peanut sauce. It smells amazing.
    - speaker: Mohamed
      text: Saya pesan satu, dagingnya yang matang, ya.
      ar_eg: عايز واحد، واللحمة تكون مستوية كويس.
      ar: أطلب واحدًا، واللحم ناضج جيدًا من فضلك.
      en: One please, with the meat well done.
    - speaker: Pelayan
      text: Baik. Sambalnya sesuai selera, ya. Masakan Makassar biasanya pedas!
      ar_eg: حاضر. الشطة على ذوقك. أكل ماكاسار عادة حرّاق!
      ar: حسنًا. الشطّة حسب ذوقك، فطعام ماكاسار عادةً حارّ!
      en: All right. Add chilli to taste. Makassar food is usually spicy!
