schema: kabar.lesson/v1
id: bipa4.u06.l07
language: id
title: Ulasan wisatawan
can_do:
  ar_eg: تفهم تقييم سايح متسجّل عن رحلة لشاطئ وتقول إيه الحلو وإيه الوحش.
  ar: أن تفهم تقييمًا صوتيًا لسائح عن رحلة إلى شاطئ وتذكر الإيجابيات والسلبيات.
  en: Follow a tourist's recorded review of a beach trip and say what was good and bad.
slides:
  - title: Ulasan video
    body:
      ar_eg: |
        سايحة من جاكرتا عاملة فيديو تقييم عن شاطئ تانجونج كارانج في دونجالا، جنب بالو. اسمع الأول.
        خد بالك من الكلمات اللي بتيجي مع بعض: angin kencang، ombak tinggi، meningkatkan pendapatan.
      ar: |
        سائحة من جاكرتا سجّلت فيديو تقييم عن شاطئ تانجونغ كارانغ في دونغالا قرب بالو. استمع أولًا.
        لاحظ المتلازمات: angin kencang، ombak tinggi، meningkatkan pendapatan.
      en: |
        A tourist from Jakarta made a video review of Tanjung Karang beach in Donggala, near Palu. Listen first.
        Notice the word partners: angin kencang, ombak tinggi, meningkatkan pendapatan.
    examples:
      - text: Akhir pekan lalu saya ke Pantai Tanjung Karang di Donggala. Airnya bersih dan biru.
        ar_eg: الويك إند اللي فات رحت شاطئ تانجونج كارانج في دونجالا. الميّة نضيفة وزرقا.
        ar: في عطلة نهاية الأسبوع الماضية ذهبت إلى شاطئ تانجونغ كارانغ في دونغالا. ماؤه نظيف وأزرق.
        en: Last weekend I went to Tanjung Karang Beach in Donggala. The water is clean and blue.
      - text: Sayangnya, hari kedua angin kencang dan ombaknya tinggi, jadi kami tidak bisa berenang.
        ar_eg: للأسف، تاني يوم الريح كانت شديدة والموج عالي، فماعرفناش نعوم.
        ar: للأسف، كانت الرياح شديدة والأمواج عالية في اليوم الثاني، فلم نستطع السباحة.
        en: Unfortunately, on the second day the wind was strong and the waves were high, so we couldn't swim.
      - text: Warga desa membuka warung dan penginapan kecil. Saya senang, karena pariwisata meningkatkan pendapatan mereka.
        ar_eg: أهل القرية فاتحين محلات أكل وأماكن مبيت صغيرة. أنا مبسوطة، عشان السياحة بتزوّد دخلهم.
        ar: افتتح أهل القرية مطاعم صغيرة ونُزُلًا صغيرة. وأنا سعيدة لأن السياحة تزيد دخلهم.
        en: The villagers have opened food stalls and small guesthouses. I'm glad, because tourism raises their income.
exercises:
  - id: e01
    type: listen
    text: Akhir pekan lalu saya ke Pantai Tanjung Karang di Donggala.
    question:
      ar_eg: السايحة راحت الشاطئ إمتى؟
      ar: متى ذهبت السائحة إلى الشاطئ؟
      en: When did the reviewer go to the beach?
    options: [Kemarin, Akhir pekan lalu, Bulan lalu]
    answer: 1
    meaning:
      ar_eg: الويك إند اللي فات رحت شاطئ تانجونج كارانج في دونجالا.
      ar: في عطلة نهاية الأسبوع الماضية ذهبت إلى شاطئ تانجونغ كارانغ في دونغالا.
      en: Last weekend I went to Tanjung Karang Beach in Donggala.
  - id: e02
    type: listen
    text: Sayangnya, hari kedua angin kencang dan ombaknya tinggi.
    question:
      ar_eg: إيه اللي حصل تاني يوم؟
      ar: ماذا حدث في اليوم الثاني؟
      en: What happened on the second day?
    options:
      - Cuacanya cerah sekali.
      - Pantainya kotor.
      - Angin kencang dan ombak tinggi.
    answer: 2
    meaning:
      ar_eg: للأسف، تاني يوم الريح كانت شديدة والموج عالي.
      ar: للأسف، كانت الرياح شديدة والأمواج عالية في اليوم الثاني.
      en: Unfortunately, on the second day the wind was strong and the waves were high.
    words: [kencang, ombak]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه السايحة مبسوطة من المحلات وأماكن المبيت؟
      ar: لماذا السائحة سعيدة بالمطاعم والنُّزُل؟
      en: Why is the reviewer happy about the stalls and guesthouses?
    options:
      - Karena harganya murah.
      - Karena pariwisata meningkatkan pendapatan warga.
      - Karena makanannya pedas.
    answer: 1
    words: [meningkatkan, pendapatan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي تعبير طبيعي في الإندونيسي؟
      ar: أيّ تعبير طبيعي في الإندونيسية؟
      en: Which pair sounds natural in Indonesian?
    options: [ombak tinggi, ombak deras, ombak kental]
    answer: 0
    explain:
      ar_eg: الموج بيبقى tinggi (عالي). deras للمطر والتيار، وkental للقهوة والسوايل التقيلة.
      ar: الموج يوصف بـ tinggi (عالٍ)، أما deras فللمطر والتيار، وkental للقهوة والسوائل الكثيفة.
      en: Waves are tinggi (high); deras is for rain and currents, kental for coffee and thick liquids.
    words: [ombak]
  - id: e05
    type: match_pairs
    pairs:
      - text: ombak
        ar_eg: موج
        ar: موج
        en: wave
      - text: kencang
        ar_eg: شديد (ريح) / سريع
        ar: شديد (للريح) / سريع
        en: strong (wind), fast
      - text: pendapatan
        ar_eg: دخل
        ar: دخل
        en: income
      - text: wisatawan
        ar_eg: سايح
        ar: سائح
        en: tourist
      - text: manfaat
        ar_eg: فايدة
        ar: فائدة / منفعة
        en: benefit
    words: [ombak, kencang, pendapatan, wisatawan, manfaat]
  - id: e06
    type: dictation
    text: Hari kedua angin kencang dan ombaknya tinggi.
    meaning:
      ar_eg: تاني يوم الريح كانت شديدة والموج عالي.
      ar: في اليوم الثاني كانت الرياح شديدة والأمواج عالية.
      en: On the second day the wind was strong and the waves were high.
    words: [kencang, ombak]
  - id: e07
    type: fill_blank
    sentence: Kemarin hujan ___, jadi kami tidak bisa berenang.
    meaning:
      ar_eg: امبارح المطر كان غزير، فماعرفناش نعوم.
      ar: أمس كان المطر غزيرًا، فلم نستطع السباحة.
      en: Yesterday it rained heavily, so we couldn't swim.
    options: [kencang, kental, deras]
    answers: [deras]
    explain:
      ar_eg: hujan deras = مطر غزير. kencang للريح، وkental للقهوة.
      ar: hujan deras = مطر غزير، أما kencang فللريح، وkental للقهوة.
      en: hujan deras = heavy rain; kencang is for wind, kental for coffee.
    words: [deras]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: السياحة بتزوّد دخل الأهالي.
      ar: تزيد السياحة دخل السكان.
      en: Tourism raises residents' income.
    answers:
      - Pariwisata meningkatkan pendapatan warga.
      - Pariwisata meningkatkan pendapatan penduduk.
      - Pariwisata meningkatkan pendapatan masyarakat.
      - Pariwisata menaikkan pendapatan warga.
      - Pariwisata meningkatkan penghasilan warga.
    words: [meningkatkan, pendapatan]
dialogue:
  title: Rencana ke pantai
  lines:
    - speaker: Mas Rizal
      text: Kamu sudah dengar ulasan wisatawan tentang Tanjung Karang?
      ar_eg: سمعت تقييم السياح عن تانجونج كارانج؟
      ar: هل سمعت تقييم السياح عن تانجونغ كارانغ؟
      en: Have you heard the tourist's review of Tanjung Karang?
    - speaker: Mohamed
      text: Sudah. Katanya airnya bersih, tapi kadang ombaknya tinggi.
      ar_eg: سمعته. بيقولوا الميّة نضيفة، بس ساعات الموج بيبقى عالي.
      ar: نعم. يقولون إن الماء نظيف، لكن الأمواج تعلو أحيانًا.
      en: Yes. They say the water's clean, but sometimes the waves are high.
    - speaker: Mas Rizal
      text: Betul. Kita cek cuaca dulu sebelum berangkat.
      ar_eg: مظبوط. نشوف الجو الأول قبل ما نطلع.
      ar: صحيح. لنتحقّق من الطقس قبل الانطلاق.
      en: Right. Let's check the weather before we set off.
    - speaker: Mohamed
      text: Ide bagus. Saya juga mau makan di warung warga.
      ar_eg: فكرة حلوة. وأنا كمان عايز آكل في محلات الأهالي.
      ar: فكرة جيدة. وأريد أيضًا أن آكل في مطاعم السكان.
      en: Good idea. I also want to eat at the villagers' food stalls.
    - speaker: Mas Rizal
      text: Bagus, supaya warga juga mendapat manfaat.
      ar_eg: حلو، عشان الأهالي كمان يستفيدوا.
      ar: جميل، حتى يستفيد السكان أيضًا.
      en: Good, so the villagers benefit too.
