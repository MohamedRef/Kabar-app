schema: kabar.lesson/v1
id: bipa6.u10.l08
language: id
title: Di penerbit kampus
can_do:
  ar_eg: 'تتكلم مع دار نشر جامعية عن نشر كتاب: الغلاف والرسوم والمصادر الأولية والثانوية.'
  ar: 'أن تتحدث مع دار نشر جامعية عن نشر كتاب: الغلاف والرسوم والمصادر الأولية والثانوية.'
  en: 'Talk with a university press about publishing a book: cover, illustrations, primary and secondary sources.'
slides:
  - title: Menerbitkan buku
    body:
      ar_eg: |
        عايز تنشر كتاب عن الكلمات العربي في الإندونيسي:
        penerbit = دار نشر، ناشر. penerbitan = النشر (proses penerbitan). publikasi = منشور، نشر (publikasi ilmiah).
        penulisan = الكتابة، التأليف (gaya penulisan). sampul = غلاف. ilustrasi = رسم توضيحي.
        primer = أولي، أساسي (sumber primer). sekunder = ثانوي (sumber sekunder).
      ar: |
        تريد نشر كتاب عن الكلمات العربية في الإندونيسية:
        penerbit = دار نشر، ناشر. penerbitan = النشر (proses penerbitan). publikasi = منشور (publikasi ilmiah).
        penulisan = الكتابة، التأليف (gaya penulisan). sampul = غلاف. ilustrasi = رسم توضيحي.
        primer = أوّلي (sumber primer). sekunder = ثانوي (sumber sekunder).
      en: |
        You want to publish a book on Arabic words in Indonesian:
        penerbit = publisher. penerbitan = publishing (proses penerbitan). publikasi = publication (publikasi ilmiah).
        penulisan = writing (gaya penulisan = writing style). sampul = cover. ilustrasi = illustration.
        primer = primary (sumber primer). sekunder = secondary (sumber sekunder).
    examples:
      - text: Penerbit kampus menerima naskah saya.
        ar_eg: دار النشر بتاعة الجامعة قبلت مخطوطتي.
        ar: قبلت دار نشر الجامعة مخطوطتي.
        en: The university press accepted my manuscript.
      - text: Sampulnya memakai ilustrasi kapal Bugis.
        ar_eg: الغلاف عليه رسمة مركب بوجيس.
        ar: على الغلاف رسم لسفينة بوغيسية.
        en: The cover uses an illustration of a Bugis ship.
      - text: Surat kuno adalah sumber primer; buku sejarah adalah sumber sekunder.
        ar_eg: الجواب القديم مصدر أولي؛ وكتاب التاريخ مصدر ثانوي.
        ar: الرسالة القديمة مصدر أوّلي؛ وكتاب التاريخ مصدر ثانوي.
        en: An old letter is a primary source; a history book is a secondary one.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: penerbit
        ar_eg: دار نشر
        ar: دار نشر
        en: publisher
      - text: penerbitan
        ar_eg: النشر
        ar: النشر
        en: publishing
      - text: publikasi
        ar_eg: منشور
        ar: منشور
        en: publication
      - text: penulisan
        ar_eg: الكتابة
        ar: الكتابة، التأليف
        en: writing
    words: [penerbit, penerbitan, publikasi, penulisan]
  - id: e02
    type: match_pairs
    pairs:
      - text: sampul
        ar_eg: غلاف
        ar: غلاف
        en: cover
      - text: ilustrasi
        ar_eg: رسم توضيحي
        ar: رسم توضيحي
        en: illustration
      - text: primer
        ar_eg: أولي
        ar: أوّلي
        en: primary
      - text: sekunder
        ar_eg: ثانوي
        ar: ثانوي
        en: secondary
    words: [sampul, ilustrasi, primer, sekunder]
  - id: e03
    type: listen
    text: Proses penerbitan buku ini memakan waktu enam bulan.
    question:
      ar_eg: إيه اللي أخد ست شهور؟
      ar: ما الذي استغرق ستة أشهر؟
      en: What took six months?
    options: [النشر, الكتابة, الترجمة]
    answer: 0
    meaning:
      ar_eg: نشر الكتاب ده أخد ست شهور.
      ar: استغرقت عملية نشر هذا الكتاب ستة أشهر.
      en: Publishing this book took six months.
    words: [penerbitan]
  - id: e04
    type: fill_blank
    sentence: Jangan menilai buku dari ___-nya.
    meaning:
      ar_eg: ما تحكمش على الكتاب من ___.
      ar: لا تحكم على الكتاب من ___ه.
      en: Don't judge a book by its ___.
    options: [sampul, primer, publikasi]
    answers: [sampul]
    words: [sampul, primer, publikasi]
    explain:
      ar_eg: "المثل: ماتحكمش على الكتاب من غلافه sampul. primer = أولي، وpublikasi = نشر."
      ar: "المثل: لا تحكم على الكتاب من غلافه sampul؛ أمّا primer فأوّلي، وpublikasi منشور."
      en: Don't judge a book by its sampul, cover. primer is primary, and publikasi a publication.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مذكرات واحد عاش الحدث بنفسه تبقى مصدر…
      ar: مذكّرات شاهد عاش الحدث بنفسه مصدر…
      en: The diary of someone who lived the event is a … source.
    options: [sekunder, primer, ilustrasi]
    answer: 1
    explain:
      ar_eg: مصدر أولي = sumber primer.
      ar: مصدر أوّلي = sumber primer.
      en: A primary source = sumber primer.
    words: [primer, sekunder, ilustrasi]
  - id: e06
    type: fill_blank
    sentence: Dosen itu sudah punya lima ___ di jurnal internasional.
    meaning:
      ar_eg: الدكتور ده عنده خمس ___ في مجلات دولية.
      ar: لذلك الأستاذ خمسة ___ في مجلات دولية.
      en: That lecturer already has five ___ in international journals.
    options: [publikasi, penulisan, sampul]
    answers: [publikasi]
    words: [publikasi, penulisan, sampul]
    explain:
      ar_eg: الدكتور عنده خمس أبحاث منشورة publikasi. penulisan = الكتابة كعملية، وsampul = غلاف.
      ar: للمحاضر خمسة أبحاث منشورة publikasi؛ أمّا penulisan فالكتابة، وsampul غلاف.
      en: Five publikasi, publications. penulisan is the act of writing, and sampul a cover.
  - id: e07
    type: multiple_choice
    question: Buku anak-anak biasanya penuh ___ berwarna.
    options: [penerbitan, sekunder, ilustrasi]
    answer: 2
    explain:
      ar_eg: ilustrasi = رسوم توضيحية.
      ar: ilustrasi = رسوم توضيحية.
      en: ilustrasi = illustrations.
    words: [ilustrasi, penerbitan, sekunder]
  - id: e08
    type: build_sentence
    source:
      ar_eg: دار النشر عايزة أسلوب كتابة أبسط.
      ar: يريد الناشر أسلوب كتابة أبسط.
      en: The publisher wants a simpler writing style.
    answer: Penerbit ingin gaya penulisan yang lebih sederhana.
    distractors: [sampul, primer]
    words: [penerbit, penulisan]
    explain:
      ar_eg: «دار النشر» = Penerbit و«أسلوب كتابة أبسط» = gaya penulisan yang lebih sederhana. sampul وprimer زيادة.
      ar: «الناشر» Penerbit و«أسلوب كتابة أبسط» gaya penulisan yang lebih sederhana؛ أمّا sampul وprimer فزائدتان.
      en: "\"The publisher\" is Penerbit and \"a simpler writing style\" is gaya penulisan yang lebih sederhana. sampul and primer aren't needed."
  - id: e09
    type: translate
    direction: from_target
    source_text: Artikel ini memakai sumber sekunder saja.
    answers_meaning:
      ar_eg: [المقالة دي بتستخدم مصادر ثانوية بس, المقال ده معتمد على مصادر ثانوية وبس]
      ar: [تعتمد هذه المقالة على مصادر ثانوية فقط]
      en: [This article uses only secondary sources, The article relies on secondary sources alone]
    words: [sekunder]
  - id: e10
    type: speaking
    text: Penerbit itu menyukai sampul dengan ilustrasi sederhana.
    meaning:
      ar_eg: دار النشر دي بتحب الغلاف اللي عليه رسمة بسيطة.
      ar: يحبّ ذلك الناشر الغلاف ذا الرسم البسيط.
      en: That publisher likes a cover with a simple illustration.
    words: [penerbit, sampul, ilustrasi]
dialogue:
  lines:
    - speaker: Pak Ginting
      text: Naskah Bapak tentang kata serapan Arab sudah kami baca.
      ar_eg: قرينا مخطوطتك عن الكلمات العربي الدخيلة.
      ar: قرأنا مخطوطتك عن الكلمات العربية الدخيلة.
      en: We've read your manuscript on Arabic loanwords.
    - speaker: Mohamed
      text: Terima kasih, Pak. Apakah penerbit tertarik?
      ar_eg: شكرًا يا أستاذ. دار النشر مهتمة؟
      ar: شكرًا يا أستاذ. هل الناشر مهتم؟
      en: Thank you, sir. Is the press interested?
    - speaker: Pak Ginting
      text: Ya. Tapi penulisan bab tiga perlu lebih banyak sumber primer.
      ar_eg: أيوه. بس كتابة الفصل التالت محتاجة مصادر أولية أكتر.
      ar: نعم. لكن كتابة الفصل الثالث تحتاج مصادر أوّلية أكثر.
      en: Yes. But chapter three needs more primary sources.
    - speaker: Mohamed
      text: Baik. Saya bisa memakai manuskrip Melayu lama.
      ar_eg: تمام. أقدر أستخدم مخطوطات ملايو قديمة.
      ar: حسنًا. يمكنني استخدام مخطوطات ملايوية قديمة.
      en: Fine. I can use old Malay manuscripts.
    - speaker: Pak Ginting
      text: Bagus. Untuk sampul, kami siapkan ilustrasi. Publikasinya tahun depan.
      ar_eg: حلو. للغلاف، هنجهز رسمة. والنشر السنة الجاية.
      ar: جيد. سنعدّ رسمًا للغلاف. والنشر في العام القادم.
      en: Good. We'll prepare an illustration for the cover. Publication is next year.
