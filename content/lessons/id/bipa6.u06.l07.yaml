schema: kabar.lesson/v1
id: bipa6.u06.l07
language: id
title: Bergurau di kedai kopi
can_do:
  ar_eg: تهزر وتفضفض على قهوة في باراپات، وتفهم الألغاز والمقالب والكلام العامي.
  ar: أن تمزح وتبوح في مقهى في باراپات، وتفهم الأحاجي والمقالب والكلام الدارج.
  en: Joke and open up at a coffee stall in Parapat; follow riddles, pranks and slang.
slides:
  - title: Di kedai kopi
    body:
      ar_eg: |
        على القهوة جنب بحيرة توبا:
        bergurau = يهزر (رسمي؛ وفي الكلام becanda). terkekeh = يضحك ضحكة مكتومة "هِهِه". geli = بيزغزغ؛ وكمان مضحك أو مقرف شوية.
        tebakan = فزورة، تخمين (من tebak). iseng = بيعمل حاجة للتسلية، بيرخم شوية (orang iseng).
        cerewet = رغاي، كتير الكلام. galau = محتار ومتضايق (عامية). curhat = يفضفض (من curahan hati).
        - في الشارع: aja = saja (بس / وخلاص)، udah = sudah (خلاص / بالفعل)، kedengaran = terdengar (بيتسمع)، emang = memang (فعلًا)، nggak = tidak (لأ / مش)، ketawa = tertawa (يضحك).
      ar: |
        في مقهى قرب بحيرة توبا:
        bergurau = يمزح (فصيح؛ وفي الحديث becanda). terkekeh = يقهقه ضحكة مكتومة. geli = يدغدغ؛ ومضحك أو مقزّز قليلًا.
        tebakan = أحجية، تخمين (من tebak). iseng = يفعل الشيء للتسلية أو المشاكسة (orang iseng).
        cerewet = ثرثار. galau = حائر مضطرب (عامي). curhat = يبوح بما في قلبه (من curahan hati).
        - في كلام الشارع: aja = saja (فقط)، udah = sudah (قد / بالفعل)، kedengaran = terdengar (يُسمَع)، emang = memang (حقًّا)، nggak = tidak (لا / ليس)، ketawa = tertawa (يضحك).
      en: |
        At a coffee stall by Lake Toba:
        bergurau = to joke (formal; in speech becanda). terkekeh = to chuckle. geli = ticklish; also funny or a bit icky.
        tebakan = riddle, guess (from tebak). iseng = doing something for fun, mischievous (orang iseng).
        cerewet = chatty, nagging. galau = mixed-up and down (slang). curhat = to pour your heart out (from curahan hati).
        - On the street: aja = saja (just, only), udah = sudah (already), kedengaran = terdengar (can be heard), emang = memang (indeed), nggak = tidak (no, not), ketawa = tertawa (to laugh).
    examples:
      - text: Bang Togar suka bergurau dengan wajah serius.
        ar_eg: بانج توجار بيحب يهزر ووشه جد.
        ar: يحبّ بانغ توغار المزاح بوجه جادّ.
        en: Bang Togar likes to joke with a straight face.
      - text: Kakek terkekeh mendengar tebakan cucunya.
        ar_eg: جدي ضحك ضحكة مكتومة لما سمع فزورة حفيده.
        ar: قهقه الجد حين سمع أحجية حفيده.
        en: Grandpa chuckled at his grandson's riddle.
      - text: Dia galau, lalu curhat kepada temannya.
        ar_eg: كان متضايق ومحتار، فراح فضفض لصاحبه.
        ar: كان حائرًا مضطربًا، فباح لصديقه.
        en: He was feeling low, so he poured his heart out to a friend.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bergurau
        ar_eg: يهزر
        ar: يمزح
        en: to joke
      - text: terkekeh
        ar_eg: يضحك ضحكة مكتومة
        ar: يقهقه بخفوت
        en: to chuckle
      - text: geli
        ar_eg: بيزغزغ؛ مضحك
        ar: يدغدغ؛ مضحك
        en: ticklish; funny
      - text: tebakan
        ar_eg: فزورة
        ar: أحجية
        en: riddle, guess
    words: [bergurau, terkekeh, geli, tebakan]
  - id: e02
    type: match_pairs
    pairs:
      - text: iseng
        ar_eg: بيرخم للتسلية
        ar: مشاكس للتسلية
        en: for fun, mischievous
      - text: cerewet
        ar_eg: رغاي
        ar: ثرثار
        en: chatty, nagging
      - text: galau
        ar_eg: متضايق ومحتار
        ar: حائر مضطرب
        en: mixed-up, low
      - text: curhat
        ar_eg: يفضفض
        ar: يبوح
        en: to pour one's heart out
    words: [iseng, cerewet, galau, curhat]
  - id: e03
    type: listen
    text: Kenapa kamu galau? Ayo curhat saja.
    question:
      ar_eg: صاحبه حاله إيه؟
      ar: ما حال صديقه؟
      en: How is his friend feeling?
    options: [متضايق, جعان, مستعجل]
    answer: 0
    meaning:
      ar_eg: مالك متضايق كده؟ يلا فضفض.
      ar: لماذا أنت مضطرب؟ هيّا، بُح بما في قلبك.
      en: Why so down? Come on, get it off your chest.
    words: [galau, curhat]
  - id: e04
    type: fill_blank
    sentence: 'Ini ___: binatang apa yang paling panjang? Ular tangga!'
    meaning:
      ar_eg: 'دي ___: إيه أطول حيوان؟ السلم والتعبان!'
      ar: 'هذه ___: ما أطول حيوان؟ لعبة السلّم والثعبان!'
      en: 'Here''s a ___: which animal is the longest? Snakes and ladders!'
    options: [tebakan, galau, cerewet]
    answers: [tebakan]
    words: [tebakan, galau, cerewet]
    explain:
      ar_eg: سؤال بإجابة مضحكة = فزورة tebakan. galau = متلخبط في مشاعره وcerewet = رغّاي.
      ar: سؤال بجواب مضحك فزّورة tebakan؛ أمّا galau فمضطرب المشاعر، وcerewet ثرثار.
      en: A riddle with a funny answer is a tebakan. galau is emotionally muddled, and cerewet chatty.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي ما بيبطلش كلام وتعليقات اسمه إيه؟
      ar: ماذا تسمّي من لا يكفّ عن الكلام والتعليق؟
      en: What do you call someone who never stops talking and commenting?
    options: [iseng, cerewet, geli]
    answer: 1
    explain:
      ar_eg: cerewet = رغاي، كتير الكلام.
      ar: cerewet = ثرثار.
      en: cerewet = chatty, nagging.
    words: [cerewet, iseng, geli]
  - id: e06
    type: fill_blank
    sentence: Adik saya ___ sekali; dia menyembunyikan sandal ayah.
    meaning:
      ar_eg: أخويا الصغير ___ أوي؛ خبّى شبشب بابا.
      ar: أخي الصغير ___ جدًا؛ خبّأ نعل أبي.
      en: My little brother is so ___; he hid Dad's sandals.
    options: [iseng, terkekeh, curhat]
    answers: [iseng]
    words: [iseng, terkekeh, curhat]
    explain:
      ar_eg: اللي بيستخبّى الشبشب بهزار iseng (غلس بهزار). terkekeh = ضحك بصوت وcurhat = فضفضة.
      ar: من يخبّئ النعال مزاحًا iseng (عابث)؛ أمّا terkekeh فقهقه، وcurhat فضفضة.
      en: Hiding sandals for fun is iseng, mischievous. terkekeh is chuckling, and curhat venting.
  - id: e07
    type: multiple_choice
    question: Jangan sentuh perutku! Aku ___!
    options: [galau, tebakan, geli]
    answer: 2
    explain:
      ar_eg: geli = بيزغزغ (وكمان مضحك أو مقرف).
      ar: geli = يدغدغ (وتعني مضحكًا أو مقزّزًا أيضًا).
      en: geli = ticklish (also funny, or icky).
    words: [geli, galau, tebakan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ما تزعلش، أنا بهزر بس.
      ar: لا تغضب، أنا أمزح فقط.
      en: Don't be cross, I'm only joking.
    answer: Jangan marah, saya hanya bergurau.
    distractors: [terkekeh, curhat]
    words: [bergurau]
    explain:
      ar_eg: «بهزر بس» = hanya bergurau. terkekeh وcurhat مش في المعنى.
      ar: «أمزح فقط» hanya bergurau؛ أمّا terkekeh وcurhat فليستا في المعنى.
      en: "\"Only joking\" is hanya bergurau. terkekeh and curhat aren't in the meaning."
  - id: e09
    type: translate
    direction: from_target
    source_text: Bapak tua itu terkekeh ketika kami bergurau.
    answers_meaning:
      ar_eg: [الراجل العجوز ضحك ضحكة مكتومة لما سمع هزارنا, العجوز ضحك على هزارنا]
      ar: [قهقه ذلك الشيخ حين سمع مزاحنا]
      en: [The old man chuckled at our jokes, That old man chuckled when he heard our joking]
    words: [terkekeh, bergurau]
  - id: e10
    type: speaking
    text: Kalau galau, curhat saja; jangan dipendam.
    meaning:
      ar_eg: لو متضايق، فضفض؛ ما تكتمش.
      ar: إن كنت مضطربًا فبُح؛ لا تكتم.
      en: If you're feeling low, talk it out; don't bottle it up.
    words: [galau, curhat]
dialogue:
  lines:
    - speaker: Bang Togar
      text: 'Mohamed, tebakan: kenapa orang Batak tidak bisa berbisik?'
      ar_eg: 'يا محمد، فزورة: ليه الباتاك ما يعرفوش يوشوشوا؟'
      ar: 'يا محمد، أحجية: لماذا لا يستطيع الباتاك الهمس؟'
      en: 'Mohamed, riddle: why can''t Batak people whisper?'
    - speaker: Mohamed
      text: Kenapa, Bang?
      ar_eg: ليه يا بانج؟
      ar: لماذا يا بانغ؟
      en: Why, Bang?
    - speaker: Bang Togar
      text: Karena berbisik aja udah kedengaran sampai Samosir!
      ar_eg: عشان وشوشتهم بتتسمع لحد ساموسير!
      ar: لأن همسهم يُسمَع حتى ساموسير!
      en: Because even their whisper reaches Samosir!
    - speaker: Mohamed
      text: Hahaha! Abang emang iseng. Tapi orang Batak nggak marah?
      ar_eg: هاهاها! إنت رخم فعلًا. بس الباتاك ما بيزعلوش؟
      ar: هاهاها! أنت مشاكس حقًا. ألا يغضب الباتاك؟
      en: Hahaha! You're such a tease. Don't Batak people mind?
    - speaker: Bang Togar
      text: Nggak! Kami suka bergurau tentang diri sendiri. Yang galau malah orang yang nggak bisa ketawa.
      ar_eg: لأ! إحنا بنحب نهزر على نفسنا. اللي يتضايق هو اللي ما يعرفش يضحك.
      ar: لا! نحب المزاح عن أنفسنا. المضطرب هو من لا يقدر على الضحك.
      en: No! We love joking about ourselves. It's the people who can't laugh who end up miserable.
