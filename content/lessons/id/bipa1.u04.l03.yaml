        ar_eg: الأربع
        ar: الأربعاء
        en: Wednesday
      - text: Kamis
        ar_eg: الخميس
        ar: الخميس
        en: Thursday
      - text: Jumat
        ar_eg: الجمعة
        ar: الجمعة
        en: Friday
    words: [Senin, Selasa, Rabu, Kamis, Jumat]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: يوم السبت اسمه إيه بالإندونيسي؟
      ar: ما اسم يوم السبت بالإندونيسية؟
      en: What is Saturday in Indonesian?
    options: ["Senin", "Sabtu", "Minggu"]
    answer: 1
    explain:
      ar_eg: Sabtu ← السبت. وMinggu هو الحد.
      ar: Sabtu ← السبت، وMinggu هو الأحد.
      en: Sabtu ← «السبت»; Minggu is Sunday.
    words: [Sabtu]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «اليوم الأول»؟
      ar: كيف تقول «اليوم الأول»؟
      en: How do you say "the first day"?
    options: ["hari pertama", "hari kedua", "pertama hari"]
    answer: 0
    explain:
      ar_eg: الترتيب بعد الاسم، و«الأول» = pertama.
      ar: العدد الترتيبي بعد الاسم، و«الأول» = pertama.
      en: The ordinal follows the noun, and "first" = pertama.
    words: [hari, pertama]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «الابن التاني»؟
      ar: كيف تقول «الابن الثاني»؟
      en: How do you say "the second child"?
    options: ["dua anak", "anak kedua", "kedua anak"]
    answer: 1
    explain:
      ar_eg: kedua بعد الاسم = التاني. قبل الاسم = الاتنين (كلاهما). وdua anak = عيلين.
      ar: kedua بعد الاسم = الثاني، وقبله = كلاهما، وdua anak = طفلان.
      en: kedua after the noun = second; before it = both; dua anak = two children.
    words: [kedua, anak]
  - id: e05
    type: listen
    text: tanggal tujuh belas Agustus
    options: ["tanggal tujuh belas Agustus", "tanggal tujuh Agustus", "tanggal tujuh belas Oktober"]
    answer: 0
    words: [tanggal, Agustus]
  - id: e06
    type: fill_blank
    sentence: Hari ini hari ___? — Hari Jumat.
    meaning:
      ar_eg: النهارده إيه؟ — الجمعة.
      ar: ما اليوم؟ — الجمعة.
      en: What day is it today? — Friday.
    options: ["siapa", "apa", "berapa"]
    answers: [apa]
    explain:
      ar_eg: اسم اليوم مش رقم، يبقى apa. للتاريخ بنقول tanggal berapa.
      ar: اسم اليوم ليس عددًا فيُسأل عنه بـ apa، أما التاريخ فـ tanggal berapa.
      en: A day name isn't a number, so it's apa; for the date, tanggal berapa.
    words: [hari, apa]
  - id: e07
    type: fill_blank
    sentence: Hari ini tanggal ___? — Tanggal sepuluh.
    meaning:
