schema: kabar.lesson/v1
id: bipa1.u04.l03
language: id
title: Berapa harganya?
can_do:
  ar_eg: تسأل عن السعر وتقوله، وتقول رخيص ولا غالي.
  ar: أن تسأل عن السعر وتذكره، وتقول رخيص أو غالٍ.
  en: Ask and say prices, and say cheap or expensive.
slides:
  - title: Berapa harganya?
    body:
      ar_eg: |
        في السوق: «Berapa harganya?» = «بكام؟».
        في الكتابة الإندونيسية النقطة بتفصل الآلاف: Rp25.000 = dua puluh lima ribu rupiah (٢٥ ألف).
        وفي السوق كتير بيشيلوا «ribu»: «lima belas» يعني ١٥ ألف.
        ورقم الموبايل بيتقال رقم رقم: 0812 = nol delapan satu dua.
      ar: |
        في السوق: «Berapa harganya?» = «بكم هذا؟».
        وفي الكتابة الإندونيسية تفصل النقطة بين الآلاف: Rp25.000 = dua puluh lima ribu rupiah (خمسة وعشرون ألفًا).
        وكثيرًا ما تُحذف «ribu» في السوق: «lima belas» تعني خمسة عشر ألفًا.
        ورقم الهاتف يُقرأ رقمًا رقمًا: 0812 = nol delapan satu dua.
      en: |
        At the market: "Berapa harganya?" = "How much is it?"
        In writing, a dot separates thousands: Rp25.000 = dua puluh lima ribu rupiah (25,000).
        Market talk often drops ribu: "lima belas" means 15,000.
        Phone numbers are read digit by digit: 0812 = nol delapan satu dua.
    grammar: id.number.cardinal
    examples:
      - text: Berapa harganya, Bu? — Dua puluh lima ribu.
        ar_eg: بكام يا حاجة؟ — خمسة وعشرين ألف.
        ar: بكم هذا يا سيدتي؟ — خمسة وعشرون ألفًا.
        en: How much is it, ma'am? — Twenty-five thousand.
      - text: Kain ini murah!
        ar_eg: القماش ده رخيص!
        ar: هذا القماش رخيص!
        en: This fabric is cheap!
exercises:
  - id: e01
    type: build_sentence
    source:
      ar_eg: القميص ده بكام؟
      ar: بكم هذا القميص؟
      en: How much is this shirt?
    answer: Baju ini berapa harganya?
    distractors: [apa, itu, murah]
    explain:
      ar_eg: السعر رقم، فبنسأل بـ berapa مش apa.
      ar: السعر عدد، فيُسأل عنه بـ berapa لا apa.
      en: A price is a number, so you ask with berapa, not apa.
    words: ['Berapa harganya?', baju]
  - id: e02
    type: translate
    direction: from_target
    source_text: Harganya seratus dua puluh ribu.
    answers_meaning:
      ar_eg: [سعره مية وعشرين ألف., بمية وعشرين ألف, تمنه ١٢٠ ألف]
      ar: [سعره مئة وعشرون ألفًا., ثمنه ١٢٠ ألفًا]
      en: ['It costs 120,000.', The price is one hundred twenty thousand, 'It''s 120,000']
    words: [harga, seratus, puluh, ribu]
  - id: e03
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: القماش ده رخيص!
      ar: هذا القماش رخيص!
      en: This fabric is cheap!
    answers: [Kain ini murah!, Kain ini murah, Kain ini murah.]
    words: [kain, murah]
  - id: e04
    type: speaking
    text: Berapa harganya, Bu? — Lima puluh ribu.
    meaning:
      ar_eg: بكام يا حاجة؟ — خمسين ألف.
      ar: بكم هذا يا سيدتي؟ — خمسون ألفًا.
      en: How much is it, ma'am? — Fifty thousand.
    words: [harga, puluh, ribu]
  - id: e05
    type: match_pairs
    pairs:
      - text: harga
        ar_eg: السعر
        ar: السعر
        en: price
      - text: murah
        ar_eg: رخيص
        ar: رخيص
        en: cheap
      - text: mahal
        ar_eg: غالي
        ar: غالٍ
        en: expensive
      - text: kain
        ar_eg: قماش
        ar: قماش
        en: fabric
      - text: baju
        ar_eg: قميص / هدوم
        ar: قميص / ملابس
        en: shirt, clothes
      - text: batik
        ar_eg: باتيك (قماش مرسوم بالشمع)
        ar: باتيك (قماش مصبوغ بالشمع)
        en: batik (wax-dyed cloth)
    words: [harga, murah, mahal, kain, baju, batik]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: القميص الباتيك بـ ٥٠٠ ألف روبية. تقول إيه؟
      ar: قميص الباتيك بخمسمئة ألف روبية. ماذا تقول؟
      en: The batik shirt is Rp500,000. What do you say?
    options: [Murah!, Mahal!, Sedikit!]
    answer: 1
    words: [mahal]
  - id: e07
    type: listen
    text: Berapa harganya, Mas?
    options: ['Berapa harganya, Mas?', 'Harganya mahal, Mas.', 'Baju ini murah, Mas.']
    answer: 0
    meaning:
      ar_eg: بكام دي؟
      ar: كم سعرها؟
      en: How much is it?
    words: ['Berapa harganya?']
  - id: e08
    type: fill_blank
    sentence: Berapa ___, Bu?
    meaning:
      ar_eg: بكام يا مدام؟
      ar: بكم هذا يا سيدتي؟
      en: How much is it, ma'am?
    options: [harganya, mahal, batik]
    answers: [harganya]
    words: ['Berapa harganya?']
  - id: e09
    type: listen
    text: Batik ini mahal, tapi kain itu murah.
    options: ['Batik ini mahal, tapi kain itu murah.', 'Batik ini murah, tapi kain itu mahal.', 'Baju ini mahal, tapi kain itu murah.']
    answer: 0
    meaning:
      ar_eg: الباتيك ده غالي، بس القماش ده رخيص.
      ar: هذا الباتيك غالٍ، لكن ذلك القماش رخيص.
      en: This batik is expensive, but that cloth is cheap.
    words: [batik, kain, mahal, murah]
  - id: e10
    type: speaking
    text: Batik ini, berapa harganya?
    meaning:
      ar_eg: الباتيك ده بكام؟
      ar: بكم هذا الباتيك؟
      en: How much is this batik?
    words: [batik, 'Berapa harganya?']
dialogue:
  title: Di Pasar Tanah Abang
  lines:
    - speaker: Mohamed
      text: Permisi, Bu. Baju batik ini berapa harganya?
      ar_eg: لو سمحتي يا حاجة. قميص الباتيك ده بكام؟
      ar: من فضلكِ يا سيدتي. بكم قميص الباتيك هذا؟
      en: Excuse me, ma'am. How much is this batik shirt?
    - speaker: Bu Ani
      text: Seratus lima puluh ribu, Mas.
      ar_eg: مية وخمسين ألف.
      ar: مئة وخمسون ألفًا.
      en: A hundred and fifty thousand.
    - speaker: Mohamed
      text: Seratus lima puluh? Mahal, Bu!
      ar_eg: مية وخمسين؟ غالي يا حاجة!
      ar: مئة وخمسون؟ إنه غالٍ يا سيدتي!
      en: A hundred and fifty? That's expensive, ma'am!
    - speaker: Bu Ani
      text: Seratus dua puluh, ya?
      ar_eg: خلاص، مية وعشرين؟
      ar: مئة وعشرون، حسنًا؟
      en: A hundred and twenty, OK?
    - speaker: Mohamed
      text: Seratus ribu, Bu?
      ar_eg: مية ألف يا حاجة؟
      ar: مئة ألف يا سيدتي؟
      en: A hundred thousand, ma'am?
    - speaker: Bu Ani
      text: Baik, seratus ribu. Terima kasih, Mas!
      ar_eg: ماشي، مية ألف. شكرًا!
      ar: حسنًا، مئة ألف. شكرًا!
      en: All right, a hundred thousand. Thank you!
