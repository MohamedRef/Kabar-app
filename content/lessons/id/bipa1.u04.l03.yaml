schema: kabar.lesson/v1
id: bipa1.u04.l03
language: id
title: Hari Senin, tanggal satu
can_do:
  ar_eg: تقول التواريخ وترتّب الحاجات (الأول، التاني).
  ar: أن تذكر التواريخ وترتّب الأشياء (الأول، الثاني).
  en: Say dates and order things (first, second).
slides:
  - title: Senin, Selasa, Rabu…
    body:
      ar_eg: |
        هتفرح: ستة من سبع أيام الأسبوع جايين من العربي!
        Senin (الاتنين) · Selasa (التلات) · Rabu (الأربع) · Kamis (الخميس) · Jumat (الجمعة) · Sabtu (السبت)
        والحد = Minggu، من البرتغالي domingo. (وفيه كمان Ahad من «الأحد» بس أقل.)
        وMinggu بحرف صغير = أسبوع: dua minggu = أسبوعين.
      ar: |
        ستّة من أيام الأسبوع السبعة عربية الأصل:
        Senin (الاثنين) · Selasa (الثلاثاء) · Rabu (الأربعاء) · Kamis (الخميس) · Jumat (الجمعة) · Sabtu (السبت)
        أما الأحد فهو Minggu، من البرتغالية domingo، وتوجد أيضًا Ahad من «الأحد» لكنها أقل شيوعًا.
        وminggu بحرف صغير تعني «أسبوع»: dua minggu = أسبوعان.
      en: |
        Good news: six of the seven weekdays come from Arabic!
        Senin (Mon) · Selasa (Tue) · Rabu (Wed) · Kamis (Thu) · Jumat (Fri) · Sabtu (Sat)
        Sunday is Minggu, from Portuguese domingo (Ahad, from «الأحد», also exists but is less common).
        Lower-case minggu means "week": dua minggu = two weeks.
    grammar: id.time.calendar
    examples:
      - text: Hari ini hari apa? — Hari ini hari Jumat.
        ar_eg: النهارده إيه؟ — النهارده الجمعة.
        ar: ما اليوم؟ — اليوم الجمعة.
        en: What day is it today? — Today is Friday.
  - title: Tanggal dan bulan
    body:
      ar_eg: |
        الشهور شبه الإنجليزي: Januari، Februari، Maret، April، Mei، Juni، Juli، Agustus، September، Oktober، November، Desember.
        التاريخ: اليوم، وبعدين الشهر، وبعدين السنة: tanggal 17 Agustus 2026.
        والسنة بتتقري كرقم عادي: dua ribu dua puluh enam (٢٠٢٦).
        السؤال: «Tanggal berapa hari ini?» = «النهارده كام في الشهر؟»
      ar: |
        أسماء الشهور قريبة من الإنجليزية: Januari، Februari، Maret، April، Mei، Juni، Juli، Agustus، September، Oktober، November، Desember.
        والتاريخ: اليوم ثم الشهر ثم السنة: tanggal 17 Agustus 2026.
        وتُقرأ السنة عددًا عاديًا: dua ribu dua puluh enam (٢٠٢٦).
        والسؤال: «Tanggal berapa hari ini?» = «ما تاريخ اليوم؟»
      en: |
        Months look like English: Januari, Februari, Maret, April, Mei, Juni, Juli, Agustus, September, Oktober, November, Desember.
        Dates go day, month, year: tanggal 17 Agustus 2026.
        Years are read as ordinary numbers: dua ribu dua puluh enam (2026).
        Ask: "Tanggal berapa hari ini?" = "What's the date today?"
    grammar: id.time.calendar
    examples:
      - text: Ulang tahun saya tanggal dua belas Maret.
        ar_eg: عيد ميلادي يوم ١٢ مارس.
        ar: عيد ميلادي في ١٢ مارس.
        en: My birthday is on 12 March.
      - text: Toko itu tutup hari Minggu.
        ar_eg: المحل ده بيقفل يوم الحد.
        ar: ذلك المتجر مغلق يوم الأحد.
        en: That shop is closed on Sunday.
  - title: Pertama, kedua, ketiga
    body:
      ar_eg: |
        الترتيب = ke- + الرقم: kedua = التاني، ketiga = التالت، kesepuluh = العاشر.
        بس «الأول» ليه كلمة لوحده: pertama.
        وبيجي بعد الاسم زي العربي: hari pertama = اليوم الأول، anak kedua = الابن التاني.
        خلي بالك: لو جه قبل الاسم معناه «الاتنين / التلاتة»: kedua anak itu = العيلين دول الاتنين.
      ar: |
        العدد الترتيبي = ke- + العدد: kedua = الثاني، ketiga = الثالث، kesepuluh = العاشر.
        أما «الأول» فله كلمة خاصة: pertama.
        ويأتي بعد الاسم كالعربية: hari pertama = اليوم الأول، anak kedua = الابن الثاني.
        وانتبه: إذا سبق الاسم صار بمعنى «كلا / الثلاثة»: kedua anak itu = كلا الطفلين.
      en: |
        Ordinals = ke- + number: kedua = second, ketiga = third, kesepuluh = tenth.
        "First" has its own word: pertama.
        They follow the noun, as in Arabic: hari pertama = the first day, anak kedua = the second child.
        Careful: before a noun it means "both / all three": kedua anak itu = both children.
    grammar: id.number.ordinal
    examples:
      - text: Ini hari pertama saya di Jakarta.
        ar_eg: ده أول يوم ليا في جاكرتا.
        ar: هذا يومي الأول في جاكرتا.
        en: This is my first day in Jakarta.
      - text: Saya anak kedua.
        ar_eg: أنا الابن التاني.
        ar: أنا الابن الثاني.
        en: I'm the second child.
  - title: Selamat ulang tahun!
    body:
      ar_eg: |
        ulang tahun = عيد الميلاد (حرفيًا «السنة بتتكرر»). و«Selamat ulang tahun!» = «كل سنة وإنت طيب!» — نفس selamat بتاعة أول درس.
        والسؤال: «Kapan ulang tahunmu?» = «عيد ميلادك إمتى؟»
      ar: |
        ulang tahun = عيد الميلاد (حرفيًا «تكرار السنة»). و«Selamat ulang tahun!» = «عيد ميلاد سعيد!» بكلمة selamat نفسها من الدرس الأول.
        والسؤال: «Kapan ulang tahunmu?» = «متى عيد ميلادك؟»
      en: |
        ulang tahun = birthday (literally "the year repeats"). "Selamat ulang tahun!" = "Happy birthday!" — the same selamat from lesson one.
        Ask: "Kapan ulang tahunmu?" = "When is your birthday?"
    grammar: id.time.calendar
    examples:
      - text: Selamat ulang tahun, Rina!
        ar_eg: كل سنة وإنتي طيبة يا رينا!
        ar: عيد ميلاد سعيد يا رينا!
        en: Happy birthday, Rina!
