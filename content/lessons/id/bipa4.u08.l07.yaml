    text: Penari itu memakai topeng merah.
    question:
      ar_eg: الراقص لابس إيه؟
      ar: ماذا يرتدي الراقص؟
      en: What is the dancer wearing?
    options: [قناع, عقد, تاج]
    answer: 0
    meaning:
      ar_eg: الراقص ده لابس قناع أحمر.
      ar: يرتدي ذلك الراقص قناعًا أحمر.
      en: The dancer is wearing a red mask.
    words: [topeng]
  - id: e04
    type: fill_blank
    sentence: Nenek membuat ___ dari daun dan jahe untuk batuk.
    meaning:
      ar_eg: جدتي بتعمل ___ من ورق الشجر والجنزبيل للكحة.
      ar: تصنع جدّتي ___ من الأوراق والزنجبيل للسعال.
      en: Grandma makes a ___ of leaves and ginger for coughs.
    options: [ramuan, permata, elang]
    answers: [ramuan]
    words: [ramuan, permata, elang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: طير كبير قوي بيطير عالي فوق الجبال. ده إيه؟
      ar: طائر كبير قوي يحلّق عاليًا فوق الجبال. ما هو؟
      en: A big strong bird that flies high over mountains. What is it?
    options: [peri, elang, mantra]
    answer: 1
    explain:
      ar_eg: elang = نسر.
      ar: elang = نسر.
      en: elang = eagle.
    words: [peri, elang, mantra]
  - id: e06
    type: fill_blank
    sentence: Raja itu ___ menjadi orang miskin untuk melihat rakyatnya.
    meaning:
      ar_eg: الملك ده ___ في شكل واحد فقير عشان يشوف شعبه.
      ar: ___ الملك في هيئة فقير ليرى شعبه.
      en: The king ___ as a poor man to see his people.
    options: [menyamar, ksatria, topeng]
    answers: [menyamar]
    words: [menyamar, ksatria, topeng]
  - id: e07
    type: multiple_choice
    question: Penyihir membaca ___, lalu pangeran menjadi katak.
    options: [permata, ramuan, mantra]
    answer: 2
    explain:
      ar_eg: mantra = تعويذة.
      ar: mantra = تعويذة.
      en: mantra = spell.
    words: [permata, ramuan, mantra]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الجنّية إدّت الفارس جوهرة.
      ar: أعطت الجنّية الفارس جوهرة.
      en: The fairy gave the knight a jewel.
    answer: Peri memberi ksatria sebuah permata.
    distractors: [topeng, elang]
    words: [peri, ksatria, permata, topeng, elang]
  - id: e09
    type: translate
    direction: from_target
    source_text: Ksatria itu memakai topeng supaya tidak dikenal.
    answers_meaning:
      ar_eg: [الفارس ده لبس قناع عشان محدش يعرفه, الفارس لابس قناع علشان ما يتعرفش]
      ar: [ارتدى ذلك الفارس قناعًا كي لا يُعرف, لبس الفارس قناعًا حتى لا يعرفه أحد]
      en: ['The knight wore a mask so he wouldn''t be recognised', That knight wore a mask to stay unknown]
    words: [ksatria, topeng]
  - id: e10
    type: speaking
    text: Dengan mantra dan ramuan, ksatria itu menyamar menjadi elang.
    meaning:
      ar_eg: بالتعويذة والخلطة السحرية، الفارس اتنكّر في شكل نسر.
      ar: بالتعويذة والشراب السحري تنكّر الفارس في هيئة نسر.
      en: With a spell and a potion, the knight disguised himself as an eagle.
    words: [mantra, ramuan, ksatria, menyamar, elang, peri]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: 'Cerita terakhir: seorang ksatria mencari permata di puncak gunung.'
      ar_eg: 'آخر حكاية: فارس بيدوّر على جوهرة فوق قمة جبل.'
      ar: 'الحكاية الأخيرة: فارس يبحث عن جوهرة على قمة جبل.'
      en: 'Last story: a knight searches for a jewel on a mountaintop.'
    - speaker: Mohamed
      text: Kenapa dia tidak langsung naik?
      ar_eg: وهو ليه ما طلعش على طول؟
      ar: لماذا لم يصعد مباشرة؟
      en: Why doesn't he just climb up?
    - speaker: Mas Rizal
      text: Ada penjaga jahat. Jadi dia menyamar menjadi pedagang dan memakai topeng.
      ar_eg: فيه حارس شرير. فاتنكّر في شكل تاجر ولبس قناع.
      ar: هناك حارس شرير، فتنكّر في هيئة تاجر ولبس قناعًا.
      en: There's an evil guard. So he disguises himself as a trader and wears a mask.
    - speaker: Mohamed
      text: Lalu bagaimana dia sampai ke puncak?
      ar_eg: وبعدين وصل القمة إزاي؟
      ar: ثم كيف وصل إلى القمة؟
      en: Then how does he reach the top?
    - speaker: Mas Rizal
      text: Seorang peri memberinya ramuan dan mantra. Dia menjadi elang dan terbang!
      ar_eg: جنّية إدّته شراب سحري وتعويذة. اتحوّل لنسر وطار!
      ar: أعطته جنّية شرابًا سحريًا وتعويذة، فتحوّل إلى نسر وطار!
      en: A fairy gives him a potion and a spell. He turns into an eagle and flies!
