schema: kabar.lesson/v1
id: bipa4.u08.l07
language: id
title: Ksatria yang menyamar
can_do:
  ar_eg: 'تحكي حكاية سحرية: فارس متنكّر وجنية وتعويذة وجوهرة.'
  ar: 'أن تروي حكاية سحرية: فارس متنكّر وجنّية وتعويذة وجوهرة.'
  en: 'Tell a magic tale: a knight in disguise, a fairy, a spell and a jewel.'
slides:
  - title: Permata di puncak gunung
    body:
      ar_eg: |
        ksatria = فارس، menyamar = يتنكّر (menyamar menjadi = يتنكّر في شكل)، topeng = قناع.
        peri = جنّية (من الحواديت)، mantra = تعويذة، ramuan = خلطة أعشاب، جرعة سحرية.
        elang = نسر، صقر، permata = جوهرة، حجر كريم.
      ar: |
        ksatria = فارس، menyamar = يتنكّر (menyamar menjadi = يتنكّر في هيئة)، topeng = قناع.
        peri = جنّية (في الحكايات)، mantra = تعويذة، ramuan = خلطة أعشاب، شراب سحري.
        elang = نسر، عُقاب، permata = جوهرة.
      en: |
        ksatria = knight, warrior; menyamar = to disguise oneself (menyamar menjadi = disguised as); topeng = mask.
        peri = fairy, mantra = spell, incantation; ramuan = herbal mixture, potion.
        elang = eagle, permata = jewel, gem.
    examples:
      - text: Ksatria itu menyamar menjadi pedagang.
        ar_eg: الفارس ده اتنكّر في شكل تاجر.
        ar: تنكّر ذلك الفارس في هيئة تاجر.
        en: The knight disguised himself as a trader.
      - text: Peri memberinya ramuan dari bunga hutan.
        ar_eg: الجنّية إدّته خلطة من ورد الغابة.
        ar: أعطته الجنّية شرابًا من أزهار الغابة.
        en: The fairy gave him a potion made from forest flowers.
      - text: Seekor elang membawa permata ke puncak gunung.
        ar_eg: نسر شال الجوهرة لقمة الجبل.
        ar: حمل نسرٌ الجوهرة إلى قمة الجبل.
        en: An eagle carried the jewel to the mountaintop.
