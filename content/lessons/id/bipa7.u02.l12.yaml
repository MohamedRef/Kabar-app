schema: kabar.lesson/v1
id: bipa7.u02.l12
language: id
title: Teks eksplanasi
can_do:
  ar_eg: تكتب نص تفسيري فيه الظاهرة ومراحلها وخاتمة.
  ar: أن تكتب نصًّا تفسيريًّا من ظاهرة ومراحل وخاتمة.
  en: Write an explanation text with a phenomenon, its stages and a conclusion.
slides:
  - title: Bagaimana terumbu karang terbentuk?
    grammar: id.presentation.expressions
    body:
      ar_eg: |
        الـ teks eksplanasi (النص التفسيري) ليه تلات أجزاء:
        1. الظاهرة: Terumbu karang adalah bangunan kapur raksasa yang dibuat oleh hewan kecil.
        2. الـ tahapan (المراحل) بالترتيب: Pertama, larva karang menempel di batu. Kemudian, ia membangun rumah dari kapur. Setelah itu, koloni tumbuh dengan bantuan nutrisi (مغذّيات) dari arus. Akhirnya, setelah ratusan tahun, terbentuklah (اتكوّن) terumbu.
        3. الخاتمة: Jadi, terumbu yang kita lihat hari ini adalah hasil kerja yang sangat lama.
        (النص مكتوب للدرس.)
      ar: |
        للـ teks eksplanasi (النصّ التفسيري) ثلاثة أجزاء:
        1. الظاهرة: Terumbu karang adalah bangunan kapur raksasa yang dibuat oleh hewan kecil.
        2. الـ tahapan (المراحل) مرتّبة: Pertama, larva karang menempel di batu. Kemudian, ia membangun rumah dari kapur. Setelah itu, koloni tumbuh dengan bantuan nutrisi (المغذّيات) dari arus. Akhirnya, setelah ratusan tahun, terbentuklah (تكوّن) terumbu.
        3. الخاتمة: Jadi, terumbu yang kita lihat hari ini adalah hasil kerja yang sangat lama.
        (النصّ مكتوب للدرس.)
      en: |
        A teks eksplanasi (explanation text) has three parts:
        1. The phenomenon: Terumbu karang adalah bangunan kapur raksasa yang dibuat oleh hewan kecil.
        2. The tahapan (stages) in order: Pertama, larva karang menempel di batu. Kemudian, ia membangun rumah dari kapur. Setelah itu, koloni tumbuh dengan bantuan nutrisi (nutrients) dari arus. Akhirnya, setelah ratusan tahun, terbentuklah (is formed) terumbu.
        3. Conclusion: Jadi, terumbu yang kita lihat hari ini adalah hasil kerja yang sangat lama.
        (The text is written for the lesson.)
