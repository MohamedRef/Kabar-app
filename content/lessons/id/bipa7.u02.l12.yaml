dialogue:
  title: Tugas menulis
  lines:
    - speaker: Pak Yance
      text: Untuk buku panduan pengunjung, bisa kamu tulis teks eksplanasi tentang terumbu karang?
      ar_eg: لكتيّب الزوار، تقدر تكتب نص تفسيري عن الشعاب المرجانية؟
      ar: هل تكتب لدليل الزوّار نصًّا تفسيريًّا عن الشعاب المرجانية؟
      en: For the visitors' guide, could you write an explanation text about coral reefs?
    - speaker: Mohamed
      text: Bisa. Saya mulai dari definisinya, lalu tahapan bagaimana terumbu terbentuk.
      ar_eg: أقدر. هبدأ بالتعريف، وبعدين مراحل تكوين الشعاب.
      ar: نعم. أبدأ بالتعريف ثمّ بمراحل تكوّن الشعاب.
      en: Sure. I'll start with the definition, then the stages of how a reef forms.
    - speaker: Pak Yance
      text: Jangan lupa peran arus dan nutrisi. Pengunjung sering tidak tahu itu.
      ar_eg: ماتنساش دور التيار والمغذّيات. الزوار غالبًا مايعرفوش ده.
      ar: لا تنسَ دور التيّار والمغذّيات، فكثيرًا ما يجهله الزوّار.
      en: Don't forget the role of currents and nutrients. Visitors often don't know that.
    - speaker: Mohamed
      text: Baik. Dan saya tutup dengan pesan agar mereka tidak menyentuh karang.
      ar_eg: ماشي. وهقفل برسالة إنهم مايلمسوش المرجان.
      ar: حسنًا، وأختم بتنبيه ألّا يلمسوا المرجان.
      en: Right. And I'll close with a reminder not to touch the coral.
