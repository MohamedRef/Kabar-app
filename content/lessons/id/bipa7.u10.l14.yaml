schema: kabar.lesson/v1
id: bipa7.u10.l14
language: id
title: Ulangan Unit 10
can_do:
  ar_eg: تدافع عن حاجة كتبتها، بأسلوب علمي وبأمانة.
  ar: أن تدافع عن نصّ كتبته، بأسلوب علمي وأمانة.
  en: Defend a piece you wrote, in academic register and honestly.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: hipotesis
        ar_eg: فرضية
        ar: فرضية
        en: hypothesis
      - text: makalah
        ar_eg: ورقة بحثية
        ar: ورقة بحثية
        en: paper
      - text: kualitatif
        ar_eg: كيفي
        ar: نوعي
        en: qualitative
      - text: jargon
        ar_eg: مصطلحات تقيلة
        ar: رطانة اصطلاحية
        en: jargon
      - text: keterbatasan
        ar_eg: حدود / قصور
        ar: حدود البحث
        en: limitation
    words: [hipotesis, makalah, kualitatif, jargon, keterbatasan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة مكتوبة بأسلوب علمي محكم؟
      ar: أيّ جملة مكتوبة بأسلوب علمي محكم؟
      en: Which sentence is in tight academic register?
    options:
      - Saya kira datanya lumayan banyak banget.
      - Data dikumpulkan dari 120 partisipan di tiga distrik.
      - Wah, partisipannya seru-seru!
    answer: 1
    words: [ragam ilmiah, kalimat efektif, partisipan]
  - id: e03
    type: fill_blank
    sentence: Moderator membuka ___ setelah semua pemakalah selesai.
    meaning:
      ar_eg: مدير الجلسة فتح جلسة الأسئلة بعد ما كل أصحاب الأوراق خلّصوا.
      ar: افتتح مدير الجلسة الأسئلة بعد أن أنهى أصحاب الأوراق.
      en: The moderator opened the Q&A after all presenters had finished.
    options: [sesi tanya jawab, abstrak, kuesioner]
    answers: [sesi tanya jawab]
    words: [sesi tanya jawab, moderator, pemakalah, abstrak, kuesioner]
  - id: e04
    type: listen
    text: Untuk pembaca awam, peneliti memakai analogi, bukan istilah teknis.
    question:
      ar_eg: الباحث بيستعمل إيه للقارئ العادي؟
      ar: ماذا يستعمل الباحث للقارئ غير المتخصّص؟
      en: What does the researcher use for lay readers?
    options:
      - مصطلحات فنية أكتر.
      - جداول بس.
      - تشبيهات.
    answer: 2
    words: [pembaca awam, analogi, istilah]
  - id: e05
    type: match_pairs
    pairs:
      - text: rumusan masalah
        ar_eg: صياغة مشكلة البحث / أسئلة البحث
        ar: صياغة الإشكالية
        en: problem statement, research questions
      - text: median
        ar_eg: الوسيط (الرقم اللي في النص)
        ar: الوسيط
        en: median
      - text: triangulasi
        ar_eg: تثليث (مقارنة أكتر من مصدر)
        ar: التثليث المنهجي
        en: triangulation
      - text: penelaah
        ar_eg: مُحكّم / مراجع
        ar: المحكّم
        en: reviewer, referee
    words: [rumusan masalah, median, triangulasi, penelaah]
  - id: e06
    type: match_pairs
    pairs:
      - text: kerangka teori
        ar_eg: الإطار النظري
        ar: الإطار النظري
        en: theoretical framework
      - text: korelasi
        ar_eg: ارتباط
        ar: ارتباط
        en: correlation
      - text: catatan lapangan
        ar_eg: ملاحظات ميدانية
        ar: مذكّرات ميدانية
        en: field notes
      - text: akses terbuka
        ar_eg: وصول مفتوح (ببلاش للكل)
        ar: الوصول المفتوح
        en: open access
    words: [kerangka teori, korelasi, catatan lapangan, akses terbuka]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: البحث ده بيستعمل منهج كمّي وكيفي.
      ar: يستعمل هذا البحث منهجًا كمّيًّا ونوعيًّا.
      en: This study uses quantitative and qualitative methods.
    answers:
      - Penelitian ini memakai metode kuantitatif dan kualitatif.
      - Penelitian ini menggunakan metode kuantitatif dan kualitatif.
      - Penelitian ini menggunakan pendekatan kuantitatif dan kualitatif.
    words: [kuantitatif, kualitatif, metode penelitian]
  - id: e08
    type: speaking
    text: Terima kasih atas pertanyaannya. Mohon klarifikasi, distrik mana yang Ibu maksud?
    meaning:
      ar_eg: شكرًا على السؤال. ممكن توضّحي، تقصدي أنهي منطقة؟
      ar: شكرًا على السؤال. هلّا وضّحتِ أيّ منطقة تقصدين؟
      en: Thank you for the question. Could you clarify which district you mean?
    words: [klarifikasi]
  - id: e09
    type: fill_blank
    sentence: Artikel ini masih ___, belum melewati tinjauan sejawat.
    meaning:
      ar_eg: المقالة دي لسه ___، ما عدّتش على تحكيم الأقران.
      ar: ما زالت هذه المقالة ___ ولم تمرّ بتحكيم الأقران.
      en: This article is still a ___ and hasn't been peer reviewed.
    options: [pracetak, latar belakang, etnografi]
    answers: [pracetak]
    words: [pracetak, latar belakang, etnografi]
  - id: e10
    type: fill_blank
    sentence: Korelasi tidak sama dengan ___.
    meaning:
      ar_eg: الارتباط مش هو ___.
      ar: الارتباط ليس ___.
      en: Correlation isn't ___.
    options: [kausalitas, komite etik, kata kunci]
    answers: [kausalitas]
    words: [kausalitas, komite etik, kata kunci]
  - id: e11
    type: match_pairs
    pairs:
      - text: persetujuan
        ar_eg: موافقة
        ar: موافقة
        en: consent
      - text: sumbu
        ar_eg: محور
        ar: محور
        en: axis
      - text: dosen pembimbing
        ar_eg: الدكتور المشرف
        ar: الأستاذ المشرف
        en: supervisor
      - text: tata letak
        ar_eg: تنسيق
        ar: تنسيق
        en: layout
      - text: kerahasiaan
        ar_eg: سرّية
        ar: سرّية
        en: confidentiality
    words: [persetujuan, sumbu, dosen pembimbing, tata letak, kerahasiaan]
  - id: e12
    type: multiple_choice
    question_meaning:
      ar_eg: 'في مناقشة الـ skripsi، اللجنة سألت: «الفرق ده signifikan؟» وإنت ماعملتش اختبار. تقول إيه؟'
      ar: في مناقشة الـ skripsi سألت اللجنة «أهذا الفرق signifikan؟» ولم تُجرِ اختبارًا. بمَ تجيب؟
      en: At your skripsi defence the panel asks, "Is that difference signifikan?" and you didn't test it. What do you say?
    options:
      - Ya, pasti signifikan.
      - Pertanyaan itu tidak relevan.
      - Belum saya uji. Itu keterbatasan penelitian saya.
    answer: 2
    explain:
      ar_eg: 'الصراحة أحسن: اعترف بالـ keterbatasan واقترح بحث جاي.'
      ar: 'الصدق أولى: اعترف بالـ keterbatasan واقترح بحثًا لاحقًا.'
      en: 'Honesty wins: admit the keterbatasan and suggest further research.'
    words: [sidang skripsi, signifikan, keterbatasan, relevan]
dialogue:
  title: Festival di Lembah Baliem
  lines:
    - speaker: Pak Elias
      text: Makalahmu sudah dipertahankan, dan sekarang kita menonton festival bersama.
      ar_eg: دافعت عن ورقتك خلاص، ودلوقتي هنتفرّج على المهرجان سوا.
      ar: دافعتَ عن ورقتك، والآن نشاهد المهرجان معًا.
      en: You've defended your paper, and now we watch the festival together.
    - speaker: Mohamed
      text: Suku Dani, Lani, dan Yali datang dengan pakaian adat. Luar biasa.
      ar_eg: الداني واللاني واليالي جايين بلبسهم التقليدي. حاجة تحفة.
      ar: جاءت جماعات الداني واللاني واليالي بأزيائها التقليدية. أمر مذهل.
      en: The Dani, Lani and Yali have come in traditional dress. Amazing.
    - speaker: Pak Elias
      text: Dari Sorong sampai Wamena, kamu sudah belajar bahasa berita, sejarah, dan ilmu.
      ar_eg: من سورونج لوامينا، اتعلّمت لغة الأخبار والتاريخ والعلم.
      ar: من سورونغ إلى وامينا تعلّمتَ لغة الأخبار والتاريخ والعلم.
      en: From Sorong to Wamena, you've learnt the language of news, history and science.
    - speaker: Mohamed
      text: Perjalanan ini selesai, tetapi belajar bahasa Indonesia tidak pernah selesai.
      ar_eg: الرحلة دي خلصت، بس تعلّم الإندونيسي عمره ما بيخلص.
      ar: انتهت هذه الرحلة، لكنّ تعلّم الإندونيسية لا ينتهي أبدًا.
      en: This journey is over, but learning Indonesian never ends.
souvenir:
  id: bipa7.u10.souvenir
  title: Festival Lembah Baliem
  note:
    ar_eg: وادي باليم في جبال بابوا العالية، ووامينا هي بلده الأساسية. العالم برّه ماكانش يعرف الوادي ده لحدّ سنة 1938، لما طيّارة بعثة علمية شافته من فوق. وكل سنة، عادةً في أغسطس، مهرجان الوادي بيجمّع جماعات الداني واللاني واليالي، بمعارك تمثيلية ورقص وأغاني. ومبروك، دي آخر محطة في رحلة BIPA 7.
    ar: يقع وادي باليم في مرتفعات بابوا، ووامينا بلدته الرئيسة. ولم يعرفه العالم الخارجي حتّى عام 1938، حين رأته طائرة بعثة علمية من الجوّ. ويجمع مهرجانه السنوي، في أغسطس عادةً، جماعات الداني واللاني واليالي بمعارك تمثيلية ورقص وغناء. وتهانينا، فهذه آخر محطّة في رحلة BIPA 7.
    en: The Baliem valley lies in Papua's highlands, with Wamena as its main town. Outsiders did not know of it until 1938, when a scientific expedition's plane spotted it from the air. Each year, usually in August, its festival brings the Dani, Lani and Yali together with mock battles, dance and song. Congratulations, this is the last stop of the BIPA 7 journey.
review:
