schema: kabar.lesson/v1
id: bipa3.u08.l08
language: id
title: Pengumuman banjir
can_do:
  ar_eg: تسمع إعلان طوارئ عن فيضان من ميكروفون الجامع وتفهم تعمل إيه.
  ar: أن تستمع إلى إعلان طوارئ عن فيضان من مكبّر صوت المسجد وتفهم ما يجب فعله.
  en: Follow a flood warning over the mosque loudspeaker and know what to do.
slides:
  - title: Dari pengeras suara masjid
    grammar: id.conjunction.purpose-condition
    body:
      ar_eg: |
        في تيتيباتو، لما بيحصل خطر، الإعلان بيطلع من ميكروفون الجامع (pengeras suara). الدرس ده للسمع الأول.
        دوّر على: النهر فاض ليه؟ الناس اللي جنب النهر يروحوا فين؟ يبعدوا عن إيه، وليه؟
        وخد بالك من sehingga (النتيجة) وsupaya (الهدف).
      ar: |
        في تيتيباتو، عند الخطر يُذاع الإعلان من مكبّر صوت المسجد (pengeras suara). هذا الدرس للاستماع أولًا.
        ابحث عن: لماذا فاض النهر؟ إلى أين يذهب سكّان ضفّته؟ عمَّ يبتعدون ولماذا؟
        ولاحظ sehingga (النتيجة) وsupaya (الغاية).
      en: |
        In Tetebatu, when there's danger, the warning comes over the mosque loudspeaker (pengeras suara). This lesson is listening first.
        Listen for: why did the river overflow? Where do people by the river go? What do they keep away from, and why?
        Notice sehingga (result) and supaya (purpose).
    examples:
      - text: Perhatian, perhatian! Hujan turun deras sejak tadi pagi sehingga sungai meluap.
        ar_eg: انتباه، انتباه! المطر نازل جامد من الصبح بدري، فالنهر فاض.
        ar: انتباه، انتباه! ينزل المطر بغزارة منذ الصباح، ممّا جعل النهر يفيض.
        en: Attention, attention! Heavy rain has been falling since this morning, so the river has overflowed.
      - text: Warga yang tinggal dekat sungai harus segera mengungsi ke masjid.
        ar_eg: السكان اللي ساكنين جنب النهر لازم يروحوا الجامع حالًا.
        ar: على السكّان القاطنين قرب النهر أن ينتقلوا فورًا إلى المسجد.
        en: Residents who live near the river must evacuate to the mosque at once.
      - text: Bawa tas siaga bencana, dan jauhi jembatan supaya selamat.
        ar_eg: خدوا شنطة الطوارئ، وابعدوا عن الكوبري عشان تفضلوا سالمين.
        ar: احملوا حقيبة الطوارئ، وابتعدوا عن الجسر كي تبقوا سالمين.
        en: Bring your emergency bag, and keep away from the bridge so you stay safe.
exercises:
  - id: e01
    type: listen
    text: Perhatian, perhatian! Hujan turun deras sejak tadi pagi sehingga sungai meluap.
    question:
      ar_eg: النهر فاض ليه؟
      ar: لماذا فاض النهر؟
      en: Why did the river overflow?
    options: ["Karena ada gempa.", "Karena hujan deras sejak pagi.", "Karena gunung berapi meletus."]
    answer: 1
    meaning:
      ar_eg: انتباه، انتباه! المطر نازل جامد من الصبح بدري، فالنهر فاض.
      ar: انتباه، انتباه! ينزل المطر بغزارة منذ الصباح، ممّا جعل النهر يفيض.
      en: Attention, attention! Heavy rain has been falling since this morning, so the river has overflowed.
    words: [deras, meluap]
  - id: e02
    type: listen
    text: Warga yang tinggal dekat sungai harus segera mengungsi ke masjid.
    question:
      ar_eg: السكان اللي جنب النهر يروحوا فين؟
      ar: إلى أين يذهب السكّان القريبون من النهر؟
      en: Where should people living by the river go?
    options: ["Ke lapangan.", "Ke jembatan.", "Ke masjid."]
    answer: 2
    meaning:
      ar_eg: السكان اللي ساكنين جنب النهر لازم يروحوا الجامع حالًا.
      ar: على السكّان القاطنين قرب النهر أن ينتقلوا فورًا إلى المسجد.
      en: Residents who live near the river must evacuate to the mosque at once.
    words: [warga, mengungsi]
  - id: e03
    type: listen
    text: Bawa tas siaga bencana, dan jauhi jembatan supaya selamat.
    options:
      - Bawa tas siaga bencana, dan jauhi jendela supaya selamat.
      - Bawa jas hujan, dan jauhi jembatan supaya tidak basah.
      - Bawa tas siaga bencana, dan jauhi jembatan supaya selamat.
    answer: 2
    meaning:
      ar_eg: خدوا شنطة الطوارئ، وابعدوا عن الكوبري عشان تفضلوا سالمين.
      ar: احملوا حقيبة الطوارئ، وابتعدوا عن الجسر كي تبقوا سالمين.
      en: Bring your emergency bag, and keep away from the bridge so you stay safe.
    words: [tas siaga, menjauhi, jembatan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الإعلان قال للناس يبعدوا عن إيه؟
      ar: عمَّ طلب الإعلان من الناس أن يبتعدوا؟
      en: What did the announcement tell people to keep away from?
    options: ["Jembatan.", "Masjid.", "Tas siaga."]
    answer: 0
    words: [jembatan, menjauhi]
  - id: e05
    type: match_pairs
    pairs:
      - text: meluap
        ar_eg: يفيض
        ar: يفيض
        en: to overflow
      - text: mengungsi
        ar_eg: يسيب بيته لمكان آمن
        ar: ينزح إلى مكان آمن
        en: to evacuate
      - text: jauhi
        ar_eg: ابعد عن
        ar: ابتعِد عن
        en: keep away from
      - text: warga
        ar_eg: السكان، الأهالي
        ar: السكّان
