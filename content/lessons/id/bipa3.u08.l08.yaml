  - id: e06
    type: multiple_choice
    question: Hujan turun deras sejak tadi pagi ___ sungai meluap.
    options: [supaya, sehingga, seandainya]
    answer: 1
    explain:
      ar_eg: فيضان النهر نتيجة المطر، مش هدف، فبنقول sehingga.
      ar: فيضان النهر نتيجة للمطر لا غاية له، لذلك نقول sehingga.
      en: The river overflowing is a result of the rain, not a goal, so it's sehingga.
    words: [deras, meluap]
  - id: e07
    type: fill_blank
    sentence: Jauhi jembatan ___ selamat.
    meaning:
      ar_eg: ابعدوا عن الكوبري عشان تفضلوا سالمين.
      ar: ابتعدوا عن الجسر كي تبقوا سالمين.
      en: Keep away from the bridge so you stay safe.
    answers: [supaya, agar]
    explain:
      ar_eg: ده هدف (عشان)، فـ supaya أو agar.
      ar: هذه غاية، لذلك supaya أو agar.
      en: This is a purpose ("so that"), so supaya or agar.
    words: [menjauhi, jembatan]
