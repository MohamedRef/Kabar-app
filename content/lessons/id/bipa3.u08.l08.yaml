dialogue:
  title: Di rumah Bu Endah
  lines:
    - speaker: Mohamed
      text: Bu Endah, ada pengumuman dari masjid. Apa katanya?
      ar_eg: يا طنط إنداه، فيه إعلان من الجامع. بيقولوا إيه؟
      ar: يا سيدة إنداه، هناك إعلان من المسجد. ماذا يقولون؟
      en: Bu Endah, there's an announcement from the mosque. What does it say?
    - speaker: Bu Endah
      text: Hujan deras sejak pagi sehingga sungai meluap. Warga dekat sungai harus mengungsi.
      ar_eg: المطر جامد من الصبح، فالنهر فاض. واللي ساكنين جنب النهر لازم يمشوا.
      ar: المطر غزير منذ الصباح ففاض النهر، وعلى سكّان ضفّته أن ينزحوا.
      en: It's been raining hard since morning, so the river overflowed. People near the river must evacuate.
    - speaker: Mohamed
      text: Rumah kita dekat sungai, kan? Kita harus ke mana?
      ar_eg: بيتنا جنب النهر، صح؟ نروح فين؟
      ar: بيتنا قرب النهر، أليس كذلك؟ إلى أين نذهب؟
      en: Our house is near the river, isn't it? Where do we go?
    - speaker: Bu Endah
      text: Ke masjid. Bawa tas siaga bencana, dan jangan lewat jembatan, ya.
      ar_eg: على الجامع. خد شنطة الطوارئ، وما تعديش من على الكوبري.
      ar: إلى المسجد. احمل حقيبة الطوارئ، ولا تمرّ على الجسر.
      en: To the mosque. Bring the emergency bag, and don't cross the bridge.
    - speaker: Mohamed
      text: Baik, Bu. Saya bawa tasnya sekarang. Ayo, kita pergi!
      ar_eg: حاضر يا طنط. هاخد الشنطة دلوقتي. يلا بينا!
      ar: حسنًا يا سيدتي. سآخذ الحقيبة الآن. هيّا بنا!
      en: All right, Bu. I'll take the bag now. Let's go!
