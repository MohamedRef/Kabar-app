schema: kabar.lesson/v1
id: bipa3.u03.l03
language: id
title: Tokoh dan alur
can_do:
  ar_eg: توصف أبطال الفيلم وأحداثه ومكانه.
  ar: أن تصف شخصيات الفيلم وحبكته ومكانه وزمانه.
  en: Describe a film's characters and plot.
slides:
  - title: Tokoh, latar, kisah
    body:
      ar_eg: |
        الكلام عن فيلم محتاج كلمات زي دي:
        tokoh utama = البطل (الشخصية الرئيسية).
        latar = المكان والزمان اللي القصة فيهم.
        kisah = قصة، وجاية من العربي «قصة»! (cerita كمان = حكاية).
      ar: |
        للحديث عن فيلم تحتاج إلى هذه الكلمات:
        tokoh utama = الشخصية الرئيسية.
        latar = مكان القصة وزمانها.
        kisah = قصة، وهي من العربية «قصة»! (وcerita = حكاية).
      en: |
        To talk about a film you need these words:
        tokoh utama = the main character.
        latar = the setting (where and when the story happens).
        kisah = story, from Arabic «قصة»! (cerita also means story.)
    examples:
      - text: Tokoh utamanya seorang nelayan muda.
        ar_eg: البطل صياد شاب.
        ar: الشخصية الرئيسية صيّاد شاب.
        en: The main character is a young fisherman.
      - text: Latar film ini Gili Trawangan.
        ar_eg: الفيلم ده أحداثه في جيلي تراوانجان.
        ar: تدور أحداث هذا الفيلم في جيلي تراوانغان.
        en: This film is set on Gili Trawangan.
  - title: Alur, konflik, berakhir
    body:
      ar_eg: |
        alur = الأحداث (الحبكة)، konflik = الصراع / المشكلة، berakhir = بيخلص (berakhir bahagia = نهايته سعيدة).
        ولو الفيلم شدّك: menarik = مشوّق / حلو.
      ar: |
        alur = الحبكة، وkonflik = الصراع، وberakhir = ينتهي (berakhir bahagia = نهايته سعيدة).
        وإن شدّك الفيلم فهو menarik = مشوّق.
      en: |
        alur = plot, konflik = conflict, berakhir = to end (berakhir bahagia = has a happy ending).
        If a film grips you, it's menarik = interesting.
    examples:
      - text: Alurnya cepat dan konfliknya menarik.
        ar_eg: الأحداث سريعة والصراع مشوّق.
        ar: الحبكة سريعة والصراع مشوّق.
        en: The plot is fast and the conflict is interesting.
      - text: Kisah ini berakhir bahagia.
        ar_eg: القصة دي نهايتها سعيدة.
        ar: تنتهي هذه القصة نهاية سعيدة.
        en: This story has a happy ending.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tokoh utama
        ar_eg: البطل، الشخصية الرئيسية
        ar: الشخصية الرئيسية
