        ar: درّاجة نارية للأجرة
        en: motorbike taxi
      - text: angkot
        ar_eg: ميكروباص المدينة
        ar: حافلة صغيرة داخل المدينة
        en: city minibus
      - text: terminal
        ar_eg: موقف الأتوبيسات
        ar: محطة الحافلات
        en: bus station
      - text: danau
        ar_eg: بحيرة
        ar: بحيرة
        en: lake
    words: [ojek, angkot, terminal, danau]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: محمد بيحكي رحلته. أنهي كلمة بيبدأ بيها الحكاية؟
      ar: يسرد محمد رحلته. بأيّ كلمة يبدأ الحكاية؟
      en: Mohamed is telling his trip. Which word opens the story?
    options: ["Akhirnya", "Setelah itu", "Pertama"]
    answer: 2
    explain:
      ar_eg: pertama = الأول. setelah itu في النص، وakhirnya في الآخر.
      ar: pertama = أولًا، وsetelah itu في الوسط، وakhirnya في الختام.
      en: pertama = first; setelah itu goes in the middle, akhirnya at the end.
    words: [pertama]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ الجملتين صحيحة؟
      en: Which sentence is correct?
    options: ["Akhir, kami pulang.", "Akhirnya, kami pulang."]
    answer: 1
    explain:
      ar_eg: «في الآخر» = akhirnya، لازم بـ -nya. akhir لوحدها اسم معناه «آخِر».
      ar: الظرف هو akhirnya بـ -nya، أما akhir وحدها فاسم بمعنى «آخِر».
      en: The adverb is akhirnya, with -nya; akhir alone is the noun "end".
    words: [akhirnya]
  - id: e05
    type: listen
    text: Lalu, saya naik angkot ke terminal.
    options: ["Lalu, saya naik angkot ke terminal.", "Pertama, saya naik angkot ke terminal.", "Akhirnya, saya naik angkot ke terminal."]
    answer: 0
    words: [lalu, angkot, terminal]
  - id: e06
    type: fill_blank
    sentence: ___, kami sampai di Bedugul jam dua belas.
    meaning:
      ar_eg: في الآخر وصلنا بيدوجول الساعة ١٢.
      ar: وصلنا أخيرًا إلى بيدوغول في الساعة الثانية عشرة.
      en: In the end, we arrived in Bedugul at twelve.
    options: ["Mula-mula", "Akhirnya", "Pertama"]
    answers: [Akhirnya]
    words: [akhirnya]
  - id: e07
    type: fill_blank
    sentence: Pertama, saya naik ojek ke terminal. ___ itu, saya naik bus.
    meaning:
      ar_eg: الأول ركبت أوجيك للموقف. بعد كده ركبت أتوبيس.
      ar: أولًا ركبت درّاجة أجرة إلى المحطة، وبعد ذلك ركبت الحافلة.
      en: First I took an ojek to the terminal. After that, I took a bus.
    options: ["Setelah", "Sebelum", "Akhirnya"]
    answers: [Setelah]
    explain:
      ar_eg: setelah itu = بعد كده. sebelum itu = قبل كده، وده عكس المعنى.
      ar: setelah itu = بعد ذلك، أما sebelum itu فمعناها قبل ذلك.
      en: setelah itu = after that; sebelum itu would mean "before that".
    words: [setelah itu, ojek]
  - id: e08
    type: fill_blank
    sentence: ___, silakan beli tiket di loket.
    meaning:
      ar_eg: (إعلان في المحطة) وبعد كده، اتفضلوا اشتروا التذكرة من الشباك.
      ar: (إعلان في المحطة) بعد ذلك، تفضّلوا بشراء التذاكر من الشبّاك.
      en: (station announcement) Next, please buy a ticket at the counter.
    options: ["Selanjutnya", "Akhirnya", "Mula-mula"]
    answers: [Selanjutnya]
    explain:
      ar_eg: selanjutnya = وبعد كده، الكلمة الرسمية اللي بتيجي في التعليمات.
      ar: selanjutnya = بعد ذلك، وهي الكلمة الرسمية في التعليمات.
      en: selanjutnya = next, the formal word used in instructions.
    words: [selanjutnya]
