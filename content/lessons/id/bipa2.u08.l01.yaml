schema: kabar.lesson/v1
id: bipa2.u08.l01
language: id
title: Pertama, lalu, akhirnya
can_do:
  ar_eg: تحكي رحلة بالترتيب، من الأول للآخر.
  ar: أن تسرد أحداث رحلة بترتيبها.
  en: Sequence a trip.
slides:
  - title: Pertama, lalu, kemudian
    body:
      ar_eg: |
        لما تحكي رحلة، ابدأ بـ pertama (الأول) أو mula-mula (في الأول).
        وبعدين قول lalu أو kemudian (بعدين). kemudian أرسمي شوية، وlalu إنت عارفها من الاتجاهات: «Lurus, lalu belok kiri».
        الكلمات دي بتيجي في أول الجملة وبعدها فاصلة.
        في الشارع بيقولوا:
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
      ar: |
        لسرد رحلة ابدأ بـ pertama (أولًا) أو mula-mula (في البداية)،
        ثم استعمل lalu أو kemudian (ثم)، وkemudian أكثر رسمية. وقد عرفت lalu في الاتجاهات: «Lurus, lalu belok kiri».
        تأتي هذه الكلمات في أول الجملة وتليها فاصلة.
        في كلام الشارع:
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
      en: |
        To tell a trip, start with pertama (first) or mula-mula (at first),
        then go on with lalu or kemudian (then); kemudian is a bit more formal. You know lalu from directions: "Lurus, lalu belok kiri".
        These words open the sentence, followed by a comma.
        On the street:
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
    grammar: id.conjunction.sequence
    examples:
      - text: Pertama, saya naik ojek ke terminal.
        ar_eg: الأول ركبت أوجيك للموقف.
        ar: أولًا ركبت درّاجة أجرة إلى المحطة.
        en: First, I took an ojek to the terminal.
      - text: Lalu, saya naik bus ke Bedugul.
        ar_eg: وبعدين ركبت أتوبيس لبيدوجول.
        ar: ثم ركبت الحافلة إلى بيدوغول.
        en: Then I took a bus to Bedugul.
  - title: Setelah itu, selanjutnya
    body:
      ar_eg: |
        إنت عارف setelah (بعد) من «Setelah makan…». لو حطيت بعدها itu تبقى setelah itu = بعد كده. (sesudah itu نفس المعنى.)
        selanjutnya = وبعد كده، بس رسمية، بتسمعها في الإعلانات والتعليمات.
      ar: |
        عرفتَ setelah (بعد) في «Setelah makan…»، ومع itu تصير setelah itu = بعد ذلك، ومثلها sesudah itu.
        أما selanjutnya فمعناها «وبعد ذلك» وهي رسمية، تكثر في الإعلانات والتعليمات.
      en: |
        You know setelah (after) from "Setelah makan…". Add itu and you get setelah itu = after that (sesudah itu is the same).
        selanjutnya = next — formal, typical of announcements and instructions.
    grammar: id.conjunction.sequence
    examples:
      - text: Setelah itu, kami makan siang di dekat danau.
        ar_eg: بعد كده اتغدينا جنب البحيرة.
        ar: بعد ذلك تناولنا الغداء قرب البحيرة.
        en: After that, we had lunch near the lake.
      - text: Selanjutnya, silakan beli tiket di loket.
        ar_eg: وبعد كده، اتفضل اشتري التذكرة من الشباك.
        ar: بعد ذلك، تفضّل بشراء التذكرة من الشبّاك.
        en: Next, please buy a ticket at the counter.
  - title: Akhirnya = آخِر
    body:
      ar_eg: |
        akhirnya جاية من العربي «آخِر» + -nya، يعني حرفيًا «في آخره». معناها في الآخر / أخيرًا.
        ولوحدها «Akhirnya!» = أخيرًا! لما حاجة تحصل بعد انتظار طويل.
        خلي بالك: لازم -nya. «Akhir, kami pulang» غلط.
      ar: |
        akhirnya من العربية «آخِر» مع -nya، أي «في آخره»، ومعناها: في النهاية / أخيرًا.
        وتُقال وحدها «Akhirnya!» = أخيرًا! حين يحدث أمر بعد انتظار.
        ولا بد من -nya، فقول «Akhir, kami pulang» خطأ.
      en: |
        akhirnya comes from Arabic «آخِر» (last) + -nya: "at its end", i.e. finally / in the end.
        On its own, "Akhirnya!" means "At last!" after a long wait.
        The -nya is required: "Akhir, kami pulang" is wrong.
    grammar: id.conjunction.sequence
    examples:
      - text: Akhirnya kami sampai di hotel jam sepuluh malam.
        ar_eg: في الآخر وصلنا الفندق الساعة عشرة بالليل.
        ar: وصلنا أخيرًا إلى الفندق في العاشرة ليلًا.
        en: We finally reached the hotel at 10 p.m.
      - text: Akhirnya! Busnya datang.
        ar_eg: أخيرًا! الأتوبيس جه.
        ar: أخيرًا! وصلت الحافلة.
        en: At last! The bus is here.
  - title: Ojek, angkot, bus
    body:
      ar_eg: |
        مواصلات بالي (وإندونيسيا كلها):
        - ojek = موتوسيكل أجرة، بتقعد ورا السواق. أغلب الناس بتطلبه من أبلكيشن.
        - angkot = ميكروباص صغير جوه المدينة (من angkutan kota).
        - bus = أتوبيس، بيطلع من terminal = موقف / محطة الأتوبيسات.
        وإنت عارف naik (يركب) وturun (ينزل).
      ar: |
        وسائل النقل في بالي وإندونيسيا:
        - ojek = درّاجة نارية للأجرة يجلس الراكب خلف السائق، وتُطلب غالبًا بتطبيق.
        - angkot = حافلة صغيرة داخل المدينة (اختصار angkutan kota).
        - bus = الحافلة، وتنطلق من terminal = محطة الحافلات.
        وتعرف naik (يركب) وturun (ينزل).
      en: |
        Getting around Bali (and all Indonesia):
        - ojek = motorbike taxi; you ride behind the driver, usually booked in an app.
        - angkot = small city minibus (from angkutan kota).
        - bus = bus, leaving from the terminal (bus station).
        You already know naik (get on / ride) and turun (get off).
    examples:
      - text: Angkot ini ke terminal, Pak?
        ar_eg: الميكروباص ده رايح الموقف يا أسطى؟
        ar: هل تذهب هذه الحافلة الصغيرة إلى المحطة يا سيدي؟
        en: Does this angkot go to the terminal, sir?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mula-mula
        ar_eg: في الأول خالص
        ar: في البداية
        en: at first
      - text: selanjutnya
        ar_eg: وبعد كده (رسمي)
        ar: بعد ذلك (رسمي)
        en: next (formal)
      - text: ojek
        ar_eg: موتوسيكل أجرة
        ar: درّاجة نارية أجرة
        en: motorbike taxi
      - text: angkot
        ar_eg: ميكروباص
        ar: حافلة صغيرة
        en: minibus
      - text: terminal
        ar_eg: موقف الأتوبيسات
        ar: محطة الحافلات
        en: bus terminal
      - text: danau
        ar_eg: بحيرة
        ar: بحيرة
        en: lake
    words: [mula-mula, selanjutnya, ojek, angkot, terminal, danau]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: محمد بيحكي رحلته. أنهي كلمة بيبدأ بيها الحكاية؟
      ar: يسرد محمد رحلته. بأيّ كلمة يبدأ الحكاية؟
      en: Mohamed is telling his trip. Which word opens the story?
    options: [Akhirnya, Selanjutnya, Mula-mula]
    answer: 2
    explain:
      ar_eg: mula-mula = في الأول (زي pertama). selanjutnya في النص، وakhirnya في الآخر.
      ar: mula-mula = في البداية (مثل pertama)، وselanjutnya في الوسط، وakhirnya في الختام.
      en: mula-mula = at first (like pertama); selanjutnya goes in the middle, akhirnya at the end.
    words: [mula-mula, selanjutnya, akhirnya]
  - id: e03
    type: listen
    text: Lalu, saya naik angkot ke terminal.
    options: ['Lalu, saya naik angkot ke terminal.', 'Mula-mula, saya naik ojek ke terminal.', 'Akhirnya, saya naik angkot ke danau.']
    answer: 0
    words: [lalu, angkot, terminal, mula-mula, ojek, akhirnya, danau]
  - id: e04
    type: fill_blank
    sentence: ___, silakan beli tiket di loket.
    meaning:
      ar_eg: (إعلان في المحطة) وبعد كده، اتفضلوا اشتروا التذكرة من الشباك.
      ar: (إعلان في المحطة) بعد ذلك، تفضّلوا بشراء التذاكر من الشبّاك.
      en: (station announcement) Next, please buy a ticket at the counter.
    options: [Selanjutnya, Akhirnya, Mula-mula]
    answers: [Selanjutnya]
    explain:
      ar_eg: selanjutnya = وبعد كده، الكلمة الرسمية اللي بتيجي في التعليمات.
      ar: selanjutnya = بعد ذلك، وهي الكلمة الرسمية في التعليمات.
      en: selanjutnya = next, the formal word used in instructions.
    words: [selanjutnya]
  - id: e05
    type: build_sentence
    source:
      ar_eg: بعد كده اتغدينا جنب البحيرة.
      ar: بعد ذلك تناولنا الغداء قرب البحيرة.
      en: After that, we had lunch near the lake.
    answer: Setelah itu, kami makan siang di dekat danau.
    distractors: [sebelum, ke]
    words: [setelah itu, danau]
    explain:
      ar_eg: Setelah itu = بعد كده. sebelum = قبل، وده عكس المعنى، وke للاتجاه مش للمكان.
      ar: Setelah itu = بعد ذلك. أما sebelum فعكس المعنى، وke للاتجاه لا للمكان.
      en: Setelah itu = after that. sebelum is the opposite; ke marks direction, not place.
  - id: e06
    type: speaking
    text: Mula-mula, saya naik ojek. Lalu, saya naik angkot ke terminal. Akhirnya, saya sampai di danau.
    meaning:
      ar_eg: في الأول ركبت أوجيك، وبعدين ركبت ميكروباص للموقف، وفي الآخر وصلت البحيرة.
      ar: في البداية ركبت درّاجة أجرة، ثم ركبت حافلة صغيرة إلى المحطة، وأخيرًا وصلت إلى البحيرة.
      en: At first I took an ojek. Then I took an angkot to the terminal. Finally, I reached the lake.
    words: [mula-mula, ojek, lalu, angkot, terminal, akhirnya, danau]
dialogue:
  title: Naik apa ke Bedugul?
  lines:
    - speaker: Ni Luh
      text: Mohamed, kamu ke Bedugul naik apa?
      ar_eg: يا محمد، جيت بيدوجول بإيه؟
      ar: يا محمد، بماذا جئت إلى بيدوغول؟
      en: Mohamed, how did you get to Bedugul?
    - speaker: Mohamed
      text: Pertama, aku naik ojek ke terminal.
      ar_eg: الأول ركبت أوجيك للموقف.
      ar: أولًا ركبت درّاجة أجرة إلى المحطة.
      en: First, I took an ojek to the terminal.
    - speaker: Ni Luh
      text: Lalu?
      ar_eg: وبعدين؟
      ar: ثم ماذا؟
      en: And then?
    - speaker: Mohamed
      text: Lalu, aku naik bus ke Bedugul. Setelah itu, aku jalan kaki ke danau.
      ar_eg: وبعدين ركبت أتوبيس لبيدوجول، وبعد كده مشيت على رجلي للبحيرة.
      ar: ثم ركبت الحافلة إلى بيدوغول، وبعد ذلك مشيت إلى البحيرة.
      en: Then I took a bus to Bedugul. After that, I walked to the lake.
    - speaker: Ni Luh
      text: Berapa jam di bus?
      ar_eg: قعدت كام ساعة في الأتوبيس؟
      ar: كم ساعة قضيت في الحافلة؟
      en: How many hours on the bus?
    - speaker: Mohamed
      text: Tiga jam. Akhirnya aku sampai jam dua belas.
      ar_eg: تلات ساعات. وفي الآخر وصلت الساعة ١٢.
      ar: ثلاث ساعات، ووصلت أخيرًا في الثانية عشرة.
      en: Three hours. I finally arrived at twelve.
