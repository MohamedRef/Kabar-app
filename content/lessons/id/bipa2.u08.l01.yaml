schema: kabar.lesson/v1
id: bipa2.u08.l01
language: id
title: Pertama, lalu, akhirnya
can_do:
  ar_eg: تحكي رحلة بالترتيب، من الأول للآخر.
  ar: أن تسرد أحداث رحلة بترتيبها.
  en: Sequence a trip.
slides:
  - title: Pertama, lalu, kemudian
    body:
      ar_eg: |
        لما تحكي رحلة، ابدأ بـ pertama (الأول) أو mula-mula (في الأول).
        وبعدين قول lalu أو kemudian (بعدين). kemudian أرسمي شوية، وlalu إنت عارفها من الاتجاهات: «Lurus, lalu belok kiri».
        الكلمات دي بتيجي في أول الجملة وبعدها فاصلة.
      ar: |
        لسرد رحلة ابدأ بـ pertama (أولًا) أو mula-mula (في البداية)،
        ثم استعمل lalu أو kemudian (ثم)، وkemudian أكثر رسمية. وقد عرفت lalu في الاتجاهات: «Lurus, lalu belok kiri».
        تأتي هذه الكلمات في أول الجملة وتليها فاصلة.
      en: |
        To tell a trip, start with pertama (first) or mula-mula (at first),
        then go on with lalu or kemudian (then); kemudian is a bit more formal. You know lalu from directions: "Lurus, lalu belok kiri".
        These words open the sentence, followed by a comma.
    grammar: id.conjunction.sequence
    examples:
      - text: Pertama, saya naik ojek ke terminal.
        ar_eg: الأول ركبت أوجيك للموقف.
        ar: أولًا ركبت درّاجة أجرة إلى المحطة.
        en: First, I took an ojek to the terminal.
      - text: Lalu, saya naik bus ke Bedugul.
        ar_eg: وبعدين ركبت أتوبيس لبيدوجول.
        ar: ثم ركبت الحافلة إلى بيدوغول.
        en: Then I took a bus to Bedugul.
  - title: Setelah itu, selanjutnya
    body:
      ar_eg: |
        إنت عارف setelah (بعد) من «Setelah makan…». لو حطيت بعدها itu تبقى setelah itu = بعد كده. (sesudah itu نفس المعنى.)
        selanjutnya = وبعد كده، بس رسمية، بتسمعها في الإعلانات والتعليمات.
      ar: |
        عرفتَ setelah (بعد) في «Setelah makan…»، ومع itu تصير setelah itu = بعد ذلك، ومثلها sesudah itu.
        أما selanjutnya فمعناها «وبعد ذلك» وهي رسمية، تكثر في الإعلانات والتعليمات.
      en: |
        You know setelah (after) from "Setelah makan…". Add itu and you get setelah itu = after that (sesudah itu is the same).
        selanjutnya = next — formal, typical of announcements and instructions.
    grammar: id.conjunction.sequence
    examples:
      - text: Setelah itu, kami makan siang di dekat danau.
        ar_eg: بعد كده اتغدينا جنب البحيرة.
        ar: بعد ذلك تناولنا الغداء قرب البحيرة.
        en: After that, we had lunch near the lake.
      - text: Selanjutnya, silakan beli tiket di loket.
        ar_eg: وبعد كده، اتفضل اشتري التذكرة من الشباك.
        ar: بعد ذلك، تفضّل بشراء التذكرة من الشبّاك.
        en: Next, please buy a ticket at the counter.
  - title: Akhirnya = آخِر
    body:
      ar_eg: |
        akhirnya جاية من العربي «آخِر» + -nya، يعني حرفيًا «في آخره». معناها في الآخر / أخيرًا.
        ولوحدها «Akhirnya!» = أخيرًا! لما حاجة تحصل بعد انتظار طويل.
        خلي بالك: لازم -nya. «Akhir, kami pulang» غلط.
      ar: |
        akhirnya من العربية «آخِر» مع -nya، أي «في آخره»، ومعناها: في النهاية / أخيرًا.
        وتُقال وحدها «Akhirnya!» = أخيرًا! حين يحدث أمر بعد انتظار.
        ولا بد من -nya، فقول «Akhir, kami pulang» خطأ.
      en: |
        akhirnya comes from Arabic «آخِر» (last) + -nya: "at its end", i.e. finally / in the end.
        On its own, "Akhirnya!" means "At last!" after a long wait.
        The -nya is required: "Akhir, kami pulang" is wrong.
    grammar: id.conjunction.sequence
    examples:
      - text: Akhirnya kami sampai di hotel jam sepuluh malam.
        ar_eg: في الآخر وصلنا الفندق الساعة عشرة بالليل.
        ar: وصلنا أخيرًا إلى الفندق في العاشرة ليلًا.
        en: We finally reached the hotel at 10 p.m.
      - text: Akhirnya! Busnya datang.
        ar_eg: أخيرًا! الأتوبيس جه.
        ar: أخيرًا! وصلت الحافلة.
        en: At last! The bus is here.
  - title: Ojek, angkot, bus
    body:
      ar_eg: |
        مواصلات بالي (وإندونيسيا كلها):
        - ojek = موتوسيكل أجرة، بتقعد ورا السواق. أغلب الناس بتطلبه من أبلكيشن.
        - angkot = ميكروباص صغير جوه المدينة (من angkutan kota).
        - bus = أتوبيس، بيطلع من terminal = موقف / محطة الأتوبيسات.
        وإنت عارف naik (يركب) وturun (ينزل).
      ar: |
        وسائل النقل في بالي وإندونيسيا:
        - ojek = درّاجة نارية للأجرة يجلس الراكب خلف السائق، وتُطلب غالبًا بتطبيق.
        - angkot = حافلة صغيرة داخل المدينة (اختصار angkutan kota).
        - bus = الحافلة، وتنطلق من terminal = محطة الحافلات.
        وتعرف naik (يركب) وturun (ينزل).
      en: |
        Getting around Bali (and all Indonesia):
        - ojek = motorbike taxi; you ride behind the driver, usually booked in an app.
        - angkot = small city minibus (from angkutan kota).
        - bus = bus, leaving from the terminal (bus station).
        You already know naik (get on / ride) and turun (get off).
    examples:
      - text: Angkot ini ke terminal, Pak?
        ar_eg: الميكروباص ده رايح الموقف يا أسطى؟
        ar: هل تذهب هذه الحافلة الصغيرة إلى المحطة يا سيدي؟
        en: Does this angkot go to the terminal, sir?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pertama
        ar_eg: الأول
        ar: أولًا
        en: first
      - text: lalu
        ar_eg: بعدين
        ar: ثم
        en: then
      - text: setelah itu
        ar_eg: بعد كده
        ar: بعد ذلك
        en: after that
      - text: akhirnya
        ar_eg: في الآخر
        ar: أخيرًا
        en: finally
    words: [pertama, lalu, setelah itu, akhirnya]
  - id: e02
    type: match_pairs
    pairs:
