      en: First I took an ojek. Then I took a bus. Finally, I arrived in Bedugul.
    words: [pertama, lalu, akhirnya]
dialogue:
  title: Naik apa ke Bedugul?
  lines:
    - speaker: Ni Luh
      text: Mohamed, kamu ke Bedugul naik apa?
      ar_eg: يا محمد، جيت بيدوجول بإيه؟
      ar: يا محمد، بماذا جئت إلى بيدوغول؟
      en: Mohamed, how did you get to Bedugul?
    - speaker: Mohamed
      text: Pertama, saya naik ojek ke terminal.
      ar_eg: الأول ركبت أوجيك للموقف.
      ar: أولًا ركبت درّاجة أجرة إلى المحطة.
      en: First, I took an ojek to the terminal.
    - speaker: Ni Luh
      text: Lalu?
      ar_eg: وبعدين؟
      ar: ثم ماذا؟
      en: And then?
    - speaker: Mohamed
      text: Lalu, saya naik bus ke Bedugul. Setelah itu, saya jalan kaki ke danau.
      ar_eg: وبعدين ركبت أتوبيس لبيدوجول، وبعد كده مشيت على رجلي للبحيرة.
      ar: ثم ركبت الحافلة إلى بيدوغول، وبعد ذلك مشيت إلى البحيرة.
      en: Then I took a bus to Bedugul. After that, I walked to the lake.
    - speaker: Ni Luh
      text: Berapa jam di bus?
      ar_eg: قعدت كام ساعة في الأتوبيس؟
      ar: كم ساعة قضيت في الحافلة؟
      en: How many hours on the bus?
    - speaker: Mohamed
      text: Tiga jam. Akhirnya saya sampai jam dua belas.
      ar_eg: تلات ساعات. وفي الآخر وصلت الساعة ١٢.
      ar: ثلاث ساعات، ووصلت أخيرًا في الثانية عشرة.
      en: Three hours. I finally arrived at twelve.
