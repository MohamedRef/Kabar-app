    source_text: Mula-mula kami naik angkot, kemudian kami naik bus.
    answers_meaning:
      ar_eg: ["في الأول ركبنا ميكروباص، وبعدين ركبنا أتوبيس.", "الأول ركبنا ميكروباص وبعدين ركبنا الأتوبيس"]
      ar: ["في البداية ركبنا حافلة صغيرة، ثم ركبنا الحافلة.", "أولًا ركبنا الحافلة الصغيرة ثم ركبنا الحافلة"]
