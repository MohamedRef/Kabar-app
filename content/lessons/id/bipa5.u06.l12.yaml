schema: kabar.lesson/v1
id: bipa5.u06.l12
language: id
title: Wawancara seniman
can_do:
  ar_eg: تعمل حوار مع فنان عن شغله وتسأله أسئلة مؤدبة ومفتوحة.
  ar: أن تُجري حوارًا مع فنّان عن عمله وتطرح أسئلة لبقة مفتوحة.
  en: Interview an artist about their work with polite, open questions.
slides:
  - title: Bertanya kepada seniman
    grammar: id.prefix.memper
    body:
      ar_eg: |
        في الحوار مع فنان، اسأل أسئلة مفتوحة واستخدم أفعال memper-:
        - Sejak kapan Bapak / Ibu berkarya? = بتعمل فن من إمتى؟
        - Apa yang ingin Bapak / Ibu perkenalkan kepada penonton muda?
        - Bagaimana Anda memperkuat tradisi ini?
        كلمتين جداد: seniman = فنان، وberkarya = يبدع / يعمل أعمال فنية.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: kasih = beri.
      ar: |
        في الحوار مع فنّان، اطرح أسئلة مفتوحة واستعمل أفعال memper-:
        - Sejak kapan Bapak / Ibu berkarya? = منذ متى تُبدع؟
        - Apa yang ingin Bapak / Ibu perkenalkan kepada penonton muda?
        - Bagaimana Anda memperkuat tradisi ini?
        وكلمتان جديدتان: seniman = فنّان، وberkarya = يُبدع، ينتج أعمالًا فنية.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: kasih = beri.
      en: |
        When interviewing an artist, ask open questions and use memper- verbs:
        - Sejak kapan Bapak / Ibu berkarya? = Since when have you been making art?
        - Apa yang ingin Bapak / Ibu perkenalkan kepada penonton muda?
        - Bagaimana Anda memperkuat tradisi ini?
        Two new words: seniman = artist; berkarya = to create, to produce work.
        The dialogue uses street forms; the formal ones are beside them: kasih = beri.
exercises:
  - id: e01
    type: listen
    text: Seniman itu sudah berkarya selama tiga puluh tahun.
    question:
      ar_eg: الفنان بيشتغل في الفن بقاله قد إيه؟
      ar: منذ كم سنة يعمل الفنّان في الفنّ؟
      en: How long has the artist been working?
    options:
      - تلات سنين.
      - تلاتين سنة.
      - تلتاشر سنة.
    answer: 1
    words: [seniman, berkarya]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Saya ingin memperkenalkan sape kepada anak muda.» معناها إيه؟
      ar: ما معنى «Saya ingin memperkenalkan sape kepada anak muda.»؟
      en: What does "Saya ingin memperkenalkan sape kepada anak muda." mean?
    options:
      - عايز أعرّف الشباب بالسابي.
      - عايز أبيع السابي للشباب.
      - عايز أصلّح السابي بتاعة الشباب.
    answer: 0
    words: [memperkenalkan]
  - id: e03
    type: fill_blank
    sentence: Pak Lawing adalah ___ sape yang terkenal di Kalimantan Tengah.
    meaning:
      ar_eg: الأستاذ لاوينج فنان سابي مشهور في وسط كاليمانتان.
      ar: الأستاذ لاوينغ فنّان سابي مشهور في كاليمانتان الوسطى.
      en: Pak Lawing is a well-known sape artist in Central Kalimantan.
    options: [seniman, sanggar, naskah]
    answers: [seniman]
    words: [seniman]
  - id: e04
    type: build_sentence
    source:
      ar_eg: بقالي عشرين سنة بعمل فن في الفرقة دي.
      ar: أُبدع في هذه الفرقة منذ عشرين سنة.
      en: I've been creating work in this troupe for twenty years.
    answer: Saya sudah berkarya di sanggar ini selama dua puluh tahun.
    distractors: [seniman, pentas]
    words: [berkarya, sanggar]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إزاي حضرتك بتقوّي التقليد ده؟
      ar: كيف تقوّي هذا التقليد؟
      en: How do you strengthen this tradition?
    answers:
      - Bagaimana Bapak memperkuat tradisi ini?
      - Bagaimana Ibu memperkuat tradisi ini?
      - Bagaimana Anda memperkuat tradisi ini?
      - Bagaimana cara Bapak memperkuat tradisi ini?
    words: [memperkuat]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي سؤال مفتوح ومؤدب لفنان؟
      ar: أيّ سؤال مفتوح ولبق لفنّان؟
      en: Which is a polite, open question for an artist?
    options:
      - Bapak suka sape, ya?
      - Kamu main musik nggak?
      - Apa yang membuat Bapak mulai berkarya?
    answer: 2
    explain:
      ar_eg: السؤال المفتوح (Apa / Bagaimana / Mengapa) بيخلي الفنان يحكي. أما «ya?» فإجابتها أيوه أو لأ بس.
      ar: السؤال المفتوح (Apa / Bagaimana / Mengapa) يدفع الفنّان إلى الحديث، أمّا «ya?» فجوابه نعم أو لا فقط.
      en: Open questions (Apa / Bagaimana / Mengapa) get the artist talking; a «ya?» question only gets yes or no.
    words: [berkarya]
  - id: e07
    type: speaking
    text: Sejak kapan Bapak berkarya sebagai seniman?
    meaning:
      ar_eg: حضرتك بتشتغل فنان من إمتى؟
      ar: منذ متى تعمل فنّانًا؟
      en: Since when have you worked as an artist?
    words: [berkarya, seniman]
  - id: e08
    type: dictation
    text: Para seniman muda mempertunjukkan tari enggang di Museum Balanga.
    meaning:
      ar_eg: الفنانين الشباب قدموا رقصة أبو قرن في متحف بالانجا.
      ar: قدّم الفنّانون الشباب رقصة طائر أبي قرن في متحف بالانغا.
      en: The young artists performed the hornbill dance at the Balanga Museum.
    words: [seniman, mempertunjukkan]
  - id: e09
    type: match_pairs
    pairs:
      - text: dawai
        ar_eg: وتر
        ar: وتر
        en: string
      - text: merdu
        ar_eg: صوته حلو
        ar: عذب الصوت
        en: melodious
      - text: latihan
        ar_eg: بروفة
        ar: تدريب
        en: rehearsal
      - text: ulasan
        ar_eg: نقد / مراجعة
        ar: مراجعة نقدية
        en: review
      - text: melambangkan
        ar_eg: يرمز لـ
        ar: يرمز إلى
        en: to symbolise
    words: [dawai, merdu, latihan, ulasan, melambangkan]
  - id: e10
    type: fill_blank
    sentence: Lewat lagunya, seniman itu ___ budaya Dayak kepada dunia.
    meaning:
      ar_eg: من خلال أغانيه، الفنان ده بيعرّف العالم بثقافة الداياك.
      ar: من خلال أغانيه، يعرّف ذلك الفنّان العالمَ بثقافة الدّاياك.
      en: Through his songs, that artist introduces Dayak culture to the world.
    options: [memperkenalkan, memperbaiki, memetik]
    answers: [memperkenalkan]
    words: [memperkenalkan, seniman]
dialogue:
  title: Bersama Pak Lawing
  lines:
    - speaker: Mohamed
      text: Terima kasih atas waktunya, Pak. Sejak kapan Bapak berkarya dengan sape?
      ar_eg: شكرًا على وقتك يا أستاذ. حضرتك بتعزف سابي من إمتى؟
      ar: شكرًا على وقتك يا أستاذ. منذ متى تُبدع بالسابي؟
      en: Thank you for your time, sir. Since when have you been making music with the sape?
    - speaker: Pak Lawing
      text: Sejak umur dua belas tahun. Kakek saya juga seniman sape.
      ar_eg: من وأنا عندي اتناشر سنة. وجدي كمان كان فنان سابي.
      ar: منذ الثانية عشرة، وكان جدّي فنّان سابي أيضًا.
      en: Since I was twelve. My grandfather was a sape artist too.
    - speaker: Mohamed
      text: Apa yang ingin Bapak perkenalkan kepada anak muda sekarang?
      ar_eg: عايز تعرّف الشباب دلوقتي بإيه؟
      ar: ما الذي تودّ أن تعرّف به الشباب اليوم؟
      en: What would you like to introduce to young people today?
    - speaker: Pak Lawing
      text: Bahwa sape bukan musik kuno. Kami memperbarui iramanya, tetapi maknanya tetap.
      ar_eg: إن السابي مش موسيقى قديمة وخلاص. إحنا بنجدد إيقاعها، بس معناها زي ما هو.
      ar: أنّ السابي ليست موسيقى بالية، فنحن نجدّد إيقاعها ويبقى معناها.
      en: That the sape isn't old-fashioned music. We renew its rhythms, but the meaning stays.
    - speaker: Mohamed
      text: Kalimat yang indah. Boleh saya kutip dalam ulasan saya?
      ar_eg: جملة جميلة. ينفع أنقلها في المقال بتاعي؟
      ar: عبارة جميلة. هل تسمح بأن أقتبسها في مراجعتي؟
      en: A beautiful line. May I quote it in my review?
