schema: kabar.lesson/v1
id: bipa3.u03.l07
language: id
title: Keren atau payah?
can_do:
  ar_eg: 'تدي رأيك في فيلم بكلام قوي: جامد، وحش، مثالي، مبالغ فيه، مذهل.'
  ar: 'أن تقيّم فيلمًا بكلمات قوية: رائع، سيئ، مثالي، مبالغ فيه، مذهل.'
  en: 'Give a strong verdict on a film: cool, rubbish, perfect, over the top, amazing.'
slides:
  - title: Ulasan singkat
    body:
      ar_eg: |
        keren = جامد، روعة (كلمة شبابية). payah = وحش، فاشل (برضه شبابية).
        menyedihkan = يزعّل، محزن. berlebihan = مبالغ فيه، أوفر. menakjubkan = مذهل.
        romantis = رومانسي، klasik = كلاسيكي (film klasik = فيلم قديم مشهور). kejutan = مفاجأة.
      ar: |
        keren = رائع (عامية الشباب). payah = سيئ، فاشل (عامية أيضًا).
        menyedihkan = محزن. berlebihan = مبالغ فيه. menakjubkan = مذهل.
        romantis = رومانسي، klasik = كلاسيكي (film klasik = فيلم قديم شهير). kejutan = مفاجأة.
      en: |
        keren = cool, awesome (casual). payah = rubbish, lame (casual).
        menyedihkan = sad, saddening. berlebihan = over the top, excessive. menakjubkan = amazing.
        romantis = romantic, klasik = classic (film klasik = a well-known old film). kejutan = surprise.
    examples:
      - text: Film ini keren! Musiknya sempurna.
        ar_eg: الفيلم ده جامد! المزيكا بتاعته مثالية.
        ar: هذا الفيلم رائع! موسيقاه مثالية.
        en: This film is awesome! The music is perfect.
      - text: Akhirnya payah, dan aktingnya berlebihan.
        ar_eg: النهاية وحشة، والتمثيل أوفر.
        ar: نهايته سيئة، والتمثيل مبالغ فيه.
        en: The ending is lame, and the acting is over the top.
      - text: Pemandangan di film itu menakjubkan.
        ar_eg: المناظر في الفيلم ده مذهلة.
        ar: المناظر في ذلك الفيلم مذهلة.
        en: The scenery in that film is amazing.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: keren
        ar_eg: جامد
        ar: رائع
        en: cool
      - text: payah
        ar_eg: وحش، فاشل
        ar: سيئ
        en: lame
      - text: menyedihkan
        ar_eg: محزن
        ar: محزن
        en: sad
      - text: berlebihan
        ar_eg: أوفر، مبالغ فيه
        ar: مبالغ فيه
        en: over the top
    words: [keren, payah, menyedihkan, berlebihan]
  - id: e02
    type: match_pairs
    pairs:
      - text: menakjubkan
        ar_eg: مذهل
        ar: مذهل
        en: amazing
      - text: romantis
        ar_eg: رومانسي
        ar: رومانسي
        en: romantic
      - text: klasik
        ar_eg: كلاسيكي
        ar: كلاسيكي
        en: classic
      - text: kejutan
        ar_eg: مفاجأة
        ar: مفاجأة
        en: surprise
    words: [menakjubkan, romantis, klasik, kejutan]
  - id: e03
    type: listen
    text: Wah, filmnya payah! Ceritanya tidak menarik.
    question:
      ar_eg: رأيه في الفيلم إيه؟
      ar: ما رأيه في الفيلم؟
      en: What does he think of the film?
    options: [عجبه جدًا, ما عجبوش, خاف منه]
    answer: 1
    meaning:
      ar_eg: ياه، الفيلم وحش! القصة مش حلوة.
      ar: الفيلم سيئ! قصته غير ممتعة.
      en: Ugh, the film's lame! The story's no good.
    words: [payah]
  - id: e04
    type: fill_blank
    sentence: Ini film ___ tentang dua orang yang saling mencintai.
    meaning:
      ar_eg: ده فيلم ___ عن اتنين بيحبوا بعض.
      ar: هذا فيلم ___ عن شخصين يحبّ أحدهما الآخر.
      en: This is a ___ film about two people in love.
    options: [romantis, berlebihan, kejutan]
    answers: [romantis]
    words: [romantis, berlebihan, kejutan]
    explain:
      ar_eg: فيلم عن اتنين بيحبوا بعض = film romantis. berlebihan = أوفر، وkejutan = مفاجأة.
      ar: فيلم عن حبيبين film romantis. أما berlebihan فـ«مبالغ فيه»، وkejutan «مفاجأة».
      en: A film about two people in love is romantis. berlebihan means over the top and kejutan a surprise.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: فيلم قديم ومشهور الناس لسه بتحبه، يبقى film …؟
      ar: فيلم قديم مشهور ما زال الناس يحبونه هو film …؟
      en: An old, famous film people still love is a film …?
    options: [klasik, keren, menyedihkan]
    answer: 0
    explain:
      ar_eg: film klasik = فيلم كلاسيكي.
      ar: film klasik = فيلم كلاسيكي.
      en: film klasik = a classic film.
    words: [klasik, keren, menyedihkan]
  - id: e06
    type: fill_blank
    sentence: 'Ada ___ di akhir film: dia tidak mati!'
    meaning:
      ar_eg: 'فيه ___ في آخر الفيلم: هو ما ماتش!'
      ar: 'في نهاية الفيلم ___: لم يمت!'
      en: 'There''s a ___ at the end: he didn''t die!'
    options: [payah, klasik, kejutan]
    answers: [kejutan]
    words: [kejutan, payah, klasik]
    explain:
      ar_eg: «هو ما ماتش!» دي مفاجأة = kejutan. payah = وحش أو ضعيف، وklasik = كلاسيكي.
      ar: «لم يمت!» مفاجأة kejutan. أما payah فـ«سيّئ، ضعيف»، وklasik «كلاسيكي».
      en: "\"He didn't die!\" is a kejutan, a surprise. payah means lame and klasik classic."
  - id: e07
    type: build_sentence
    source:
      ar_eg: التمثيل في المشهد ده أوفر شوية.
      ar: التمثيل في هذا المشهد مبالغ فيه قليلًا.
      en: The acting in this scene is a bit over the top.
    answer: Akting di adegan ini agak berlebihan.
    distractors: [menyedihkan, romantis]
    words: [berlebihan]
    explain:
      ar_eg: "«أوفر شوية» = agak berlebihan: Akting di adegan ini agak berlebihan. menyedihkan (حزين) وromantis زيادة."
      ar: "«مبالغ فيه قليلًا» agak berlebihan: Akting di adegan ini agak berlebihan. أما menyedihkan (محزن) وromantis فزائدتان."
      en: "\"A bit over the top\" is agak berlebihan: Akting di adegan ini agak berlebihan. menyedihkan (sad) and romantis are extra."
  - id: e08
    type: translate
    direction: from_target
    source_text: Pemandangan di film itu menakjubkan.
    answers_meaning:
      ar_eg: [المناظر في الفيلم ده مذهلة, المناظر في الفيلم تحفة]
      ar: [المناظر في ذلك الفيلم مذهلة]
      en: [The scenery in that film is amazing, The views in that film are stunning]
    words: [menakjubkan]
  - id: e09
    type: speaking
    text: Film romantis ini keren, tapi akhirnya menyedihkan.
    meaning:
      ar_eg: الفيلم الرومانسي ده جامد، بس نهايته تزعّل.
      ar: هذا الفيلم الرومانسي رائع، لكن نهايته محزنة.
      en: This romance is great, but the ending is sad.
    words: [romantis, keren, menyedihkan]
  - id: e10
    type: multiple_choice
    question: Bintang lima! Filmnya ___!
    options: [payah, berlebihan, menakjubkan]
    answer: 2
    explain:
      ar_eg: 'خمس نجوم يعني مذهل: menakjubkan.'
      ar: 'خمس نجوم تعني مذهلًا: menakjubkan.'
      en: 'Five stars means amazing: menakjubkan.'
    words: [menakjubkan, payah, berlebihan]
dialogue:
  lines:
    - speaker: Raka
      text: Mohamed, gimana film kemarin? Keren nggak?
      ar_eg: يا محمد، فيلم امبارح كان عامل إيه؟ جامد؟
      ar: يا محمد، كيف كان فيلم الأمس؟ رائع؟
      en: Mohamed, how was yesterday's film? Cool?
    - speaker: Mohamed
      text: Pemandangannya menakjubkan sih, tapi ceritanya agak payah.
      ar_eg: المناظر مذهلة، بس القصة وحشة شوية.
      ar: المناظر مذهلة لكن القصة سيئة قليلًا.
      en: The scenery was amazing, but the story was a bit lame.
    - speaker: Raka
      text: Kok gitu? Itu film romantis, kan?
      ar_eg: ليه؟ مش ده فيلم رومانسي؟
      ar: لماذا؟ إنه فيلم رومانسي، أليس كذلك؟
      en: How come? It's a romance, isn't it?
    - speaker: Mohamed
      text: Iya, tapi aktingnya berlebihan. Nggak ada kejutan.
      ar_eg: أيوه، بس التمثيل أوفر. ومافيش أي مفاجأة.
      ar: نعم، لكن التمثيل مبالغ فيه. ولا مفاجآت.
      en: Yes, but the acting was over the top. No surprises.
    - speaker: Raka
      text: Kalau gitu, nonton film klasik aja deh. Ceritanya keren!
      ar_eg: لو كده، اتفرج على فيلم كلاسيكي. قصته مثالية!
      ar: إذن شاهد فيلمًا كلاسيكيًا. قصته مثالية!
      en: Then just watch a classic. The stories are great!
