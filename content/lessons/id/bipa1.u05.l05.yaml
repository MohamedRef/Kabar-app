  - id: e03
    type: listen
    text: Langitnya cerah. Mataharinya panas.
    question:
      ar_eg: الجو عامل إزاي؟
      ar: كيف الطقس؟
      en: What's the weather like?
    options: [مشمس وحر, فيه مطر, فيه تلج]
    answer: 0
    meaning:
      ar_eg: السما صافية. والشمس حامية.
      ar: السماء صافية، والشمس حارّة.
      en: The sky is clear. The sun is hot.
    words: [langit, matahari]
  - id: e04
    type: fill_blank
    sentence: Di Indonesia tidak ada ___, tapi ada banyak hujan.
    meaning:
      ar_eg: مفيش ___ في إندونيسيا، بس فيه مطر كتير.
      ar: لا ___ في إندونيسيا، لكن فيها مطر كثير.
      en: There's no ___ in Indonesia, but there's lots of rain.
    options: [salju, sapi, langit]
    answers: [salju]
    words: [salju, sapi, langit]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: air بالإندونيسي معناها مية. طب الهوا اللي بنتنفسه؟
      ar: air بالإندونيسية تعني ماء. فما الهواء الذي نتنفّسه؟
      en: air in Indonesian means water. So what's the air we breathe?
    options: [udara, angin, air]
    answer: 0
    explain:
      ar_eg: udara = الهوا اللي بنتنفسه، angin = ريح، air = مية.
      ar: udara الهواء، وangin الريح، وair الماء.
      en: udara = air, angin = wind, air = water.
    words: [udara, angin]
  - id: e06
    type: fill_blank
    sentence: Di rumah nenek ada banyak ___ dan ayam.
    meaning:
      ar_eg: في بيت جدتي فيه ___ كتير وفراخ.
      ar: في بيت جدّتي ___ كثيرة ودجاج.
      en: Grandma's house has lots of ___ and chickens.
    options: [sapi, salju, udara]
    answers: [sapi]
    words: [sapi, ayam, salju, udara]
  - id: e07
    type: build_sentence
    source:
      ar_eg: في سومبا فيه خيل كتير.
      ar: في سومبا خيل كثيرة.
      en: There are lots of horses in Sumba.
    answer: Di Sumba ada banyak kuda.
    distractors: [ayam, angin]
    words: [kuda]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ada angin di pantai.
    answers_meaning:
      ar_eg: [فيه هوا على البحر, فيه ريح على الشط, فيه هوا على الشط]
      ar: [هناك ريح على الشاطئ, توجد رياح على الشاطئ]
      en: ['There''s wind at the beach', 'It''s windy at the beach', There is wind on the beach]
    words: [angin]
  - id: e09
    type: speaking
    text: Di rumah ini ada ayam, sapi, dan kuda. Udaranya bagus!
    meaning:
      ar_eg: هنا فيه فراخ وبقر وخيل. والهوا حلو!
      ar: هنا دجاج وأبقار وخيل، والهواء جميل!
      en: There are chickens, cows and horses here. The air is lovely!
    words: [ayam, sapi, kuda, udara]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: حاجة بيضا وساقعة بتنزل من السما في الشتا في أوروبا. اسمها إيه؟
      ar: شيء أبيض بارد ينزل من السماء في شتاء أوروبا. ما اسمه؟
      en: Something white and cold falls from the sky in a European winter. What is it?
    options: [salju, matahari, ayam]
    answer: 0
    explain:
      ar_eg: salju = تلج، زي الكلمة العربية.
      ar: salju = ثلج، كالكلمة العربية.
      en: salju = snow, like the Arabic word.
    words: [salju, matahari, ayam]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Selamat pagi, Mohamed! Ini rumah saya.
      ar_eg: صباح الخير يا محمد! ده بيتي.
      ar: صباح الخير يا محمد! هذا بيتي.
      en: Good morning, Mohamed! This is my house.
    - speaker: Mohamed
      text: Udaranya bagus! Langitnya cerah.
      ar_eg: الهوا حلو! والسما صافية.
      ar: الهواء جميل! والسماء صافية.
      en: The air is lovely! The sky is clear.
    - speaker: Ni Luh
      text: Ya. Di rumah saya ada ayam, sapi, dan kuda.
      ar_eg: أيوه. هنا فيه فراخ وبقر وخيل.
      ar: نعم. هنا دجاج وأبقار وخيل.
      en: Yes. There are chickens, cows and horses here.
    - speaker: Mohamed
      text: Di Mesir ada sapi juga. Tapi mataharinya panas!
      ar_eg: في مصر فيه بقر برضه. بس الشمس حامية!
      ar: في مصر أبقار أيضًا، لكن الشمس حارّة!
      en: There are cows in Egypt too. But the sun is hot!
    - speaker: Ni Luh
      text: Di Mesir ada salju?
      ar_eg: في مصر فيه تلج؟
      ar: هل في مصر ثلج؟
      en: Is there snow in Egypt?
    - speaker: Mohamed
      text: Tidak ada! Ada angin, tapi tidak ada salju.
      ar_eg: لأ خالص! فيه هوا، بس مفيش تلج.
      ar: لا! فيها رياح، لكن لا ثلج.
      en: No! There's wind, but no snow.
