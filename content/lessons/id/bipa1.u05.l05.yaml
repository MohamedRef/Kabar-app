schema: kabar.lesson/v1
id: bipa1.u05.l05
language: id
title: Pagi di rumah Ni Luh
can_do:
  ar_eg: 'توصف صباح في الريف: السما والشمس والهوا، والفراخ والبقر والخيل.'
  ar: 'أن تصف صباحًا في الريف: السماء والشمس والهواء، والدجاج والأبقار والخيل.'
  en: 'Describe a country morning: sky, sun and air, chickens, cows and horses.'
slides:
  - title: Air bukan udara
    body:
      ar_eg: |
        خلي بالك: air بالإندونيسي = مية! أما الهوا اللي بنتنفسه فـ udara، والريح angin.
        matahari = الشمس، وحرفيًا «عين النهار» (mata = عين، hari = يوم). langit = السما.
        salju = تلج، من العربي «ثلج». في إندونيسيا مفيش تلج غير على قمة جبل في بابوا.
        وفي بيوت الريف: ayam = فرخة، sapi = بقرة، kuda = حصان (جزيرة سومبا مشهورة بالخيل).
      ar: |
        انتبه: air في الإندونيسية = ماء! أما الهواء الذي نتنفّسه فـ udara، والريح angin.
        matahari = الشمس، وحرفيًا «عين النهار» (mata = عين، hari = يوم). langit = السماء.
        salju = الثلج، من العربية «ثلج»، ولا ثلج في إندونيسيا إلا على قمّة جبل في بابوا.
        وفي بيوت الريف: ayam = دجاجة، sapi = بقرة، kuda = حصان (وجزيرة سومبا مشهورة بالخيل).
      en: |
        Careful: air in Indonesian = water! The air you breathe is udara, and wind is angin.
        matahari = the sun, literally "eye of the day" (mata = eye, hari = day). langit = sky.
        salju = snow, from Arabic ثلج. Indonesia has none, except on one mountain top in Papua.
        Around a country house: ayam = chicken, sapi = cow, kuda = horse (Sumba island is famous for them).
    examples:
      - text: Langitnya cerah, mataharinya panas.
        ar_eg: السما صافية والشمس حامية.
        ar: السماء صافية والشمس حارّة.
        en: The sky is clear and the sun is hot.
      - text: Di rumah Ni Luh ada ayam, sapi, dan kuda.
        ar_eg: في بيت ني لوه فيه فراخ وبقر وخيل.
        ar: في بيت ني لوه دجاج وأبقار وخيل.
        en: Ni Luh's house has chickens, cows and horses.
      - text: Di Indonesia tidak ada salju.
        ar_eg: مفيش تلج في إندونيسيا.
        ar: لا ثلج في إندونيسيا.
        en: There's no snow in Indonesia.
