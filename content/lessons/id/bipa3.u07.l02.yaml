schema: kabar.lesson/v1
id: bipa3.u07.l02
language: id
title: Oleh siapa?
can_do:
  ar_eg: تقول مين عمل الحاجة في المبني للمجهول (di- … oleh).
  ar: أن تذكر الفاعل في المبني للمجهول (di- … oleh).
  en: Name the doer in a di- passive (di- … oleh).
slides:
  - title: oleh = بواسطة
    body:
      ar_eg: |
        لو عايز تقول مين عمل الحاجة في جملة di-، حطه بعد oleh (= من / بواسطة):
        Pahlawan itu ditangkap oleh penjajah = البطل اتقبض عليه من المستعمر.
        ولو الفاعل جه بعد الفعل على طول، ممكن تشيل oleh: ditangkap penjajah.
      ar: |
        لذكر الفاعل في جملة di- ضعه بعد oleh (= من قِبَل):
        Pahlawan itu ditangkap oleh penjajah = قُبض على البطل من قِبَل المستعمِر.
        وإذا تلا الفاعلُ الفعلَ مباشرةً جاز حذف oleh: ditangkap penjajah.
      en: |
        To say who did it in a di- sentence, put the doer after oleh (by):
        Pahlawan itu ditangkap oleh penjajah = The hero was captured by the colonisers.
        If the doer comes right after the verb, oleh can drop: ditangkap penjajah.
    grammar: id.passive.di
    examples:
      - text: Pahlawan itu ditangkap oleh penjajah.
        ar_eg: البطل ده اتقبض عليه من المستعمر.
        ar: قُبض على ذلك البطل من قِبَل المستعمِر.
        en: That hero was captured by the colonisers.
      - text: Surat-surat itu ditulis oleh Kartini.
        ar_eg: الجوابات دي كتبتها كارتيني.
        ar: كتبت كارتيني تلك الرسائل.
        en: Those letters were written by Kartini.
  - title: Sejarah kemerdekaan
    body:
      ar_eg: |
        كلمات التاريخ: pahlawan (بطل)، penjajah (مستعمر)، kemerdekaan (استقلال)، berjuang (يكافح).
        وsejarah (تاريخ) جاية من العربي «شجرة»، يعني شجرة العيلة والنسب، وبعدين بقت «تاريخ».
        والتاريخ مليان di-: dipelajari (بيتدرس)، ditangkap (اتقبض عليه).
      ar: |
        من مفردات التاريخ: pahlawan (بطل)، penjajah (مستعمِر)، kemerdekaan (استقلال)، berjuang (يكافح).
        وsejarah (تاريخ) من العربية «شجرة» أي شجرة النسب، ثم صارت بمعنى التاريخ.
        ويكثر المبني للمجهول في التاريخ: dipelajari، ditangkap.
      en: |
        History words: pahlawan (hero), penjajah (coloniser), kemerdekaan (independence), berjuang (to struggle, fight).
        sejarah (history) comes from Arabic «شجرة», the family tree, and came to mean history.
        History is full of di-: dipelajari (is studied), ditangkap (was captured).
    grammar: id.passive.di
    examples:
      - text: Banyak pahlawan berjuang untuk kemerdekaan.
        ar_eg: أبطال كتير كافحوا عشان الاستقلال.
        ar: كافح أبطال كثيرون من أجل الاستقلال.
        en: Many heroes fought for independence.
      - text: Sejarah kemerdekaan dipelajari di sekolah.
        ar_eg: تاريخ الاستقلال بيتدرس في المدرسة.
        ar: يُدرَّس تاريخ الاستقلال في المدرسة.
        en: The history of independence is studied at school.
  - title: "Kayak, emang, gitu"
    body:
      ar_eg: |
        لما تحكي تاريخ لصاحبك:
        kayak = seperti (زي)، emang = memang (فعلًا)، gitu = begitu (كده)، gara-gara = karena (بسبب).
        بس الأسماء الكبيرة لسه بتاخد احترام: beliau للبطل أو العالِم حتى في الكلام العامي.
        وكتاب التاريخ بيفضل رسمي: «Beliau ditangkap oleh Belanda pada tahun 1830.»
      ar: |
        عندما تحكي التاريخ لصديقك:
        kayak = seperti، emang = memang، gitu = begitu، gara-gara = karena.
        لكن الشخصيات الكبيرة تبقى محترمة: beliau للبطل أو العالِم حتى في العامية.
        وكتاب التاريخ يبقى بالفصحى: «Beliau ditangkap oleh Belanda pada tahun 1830.»
      en: |
        Telling history to a friend:
        kayak = seperti (like), emang = memang (really, indeed), gitu = begitu (like that), gara-gara = karena (because of).
        Great figures still get respect: beliau for a hero or scholar, even in casual talk.
        The history book stays formal: «Beliau ditangkap oleh Belanda pada tahun 1830.»
    examples:
      - text: "Emang seru banget sejarahnya!"
        ar_eg: "التاريخ ممتع أوي فعلًا! (رسمي: Sejarahnya memang sangat seru!)"
        ar: "التاريخ ممتع حقًا! (بالفصحى: Sejarahnya memang sangat seru!)"
        en: "The history really is exciting! (standard: Sejarahnya memang sangat seru!)"
      - text: "Kainnya kayak lukisan."
        ar_eg: "القماش زي اللوحة. (رسمي: Kainnya seperti lukisan.)"
        ar: "القماش كأنه لوحة. (بالفصحى: Kainnya seperti lukisan.)"
        en: "The cloth is like a painting. (standard: Kainnya seperti lukisan.)"
