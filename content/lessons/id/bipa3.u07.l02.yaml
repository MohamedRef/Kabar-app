  - id: e02
    type: multiple_choice
    question: Pahlawan itu ditangkap ___ penjajah.
    options: [dari, untuk, oleh]
    answer: 2
    explain:
      ar_eg: الفاعل في جملة di- بييجي بعد oleh (بواسطة / من).
      ar: يأتي الفاعل في جملة di- بعد oleh.
      en: In a di- sentence, the doer comes after oleh (by).
    words: [pahlawan, penjajah, oleh]
  - id: e03
    type: listen
    text: Mereka berjuang untuk kemerdekaan Indonesia.
    options:
      - Mereka belajar untuk kemerdekaan Indonesia.
      - Mereka berjuang untuk kemerdekaan Indonesia.
      - Mereka berjuang untuk sejarah Indonesia.
    answer: 1
    meaning:
      ar_eg: كافحوا عشان استقلال إندونيسيا.
      ar: كافحوا من أجل استقلال إندونيسيا.
      en: They fought for Indonesia's independence.
    words: [berjuang, kemerdekaan]
  - id: e04
    type: multiple_choice
    question: Pahlawan itu ditangkap oleh penjajah. Siapa yang menangkap?
    options: [Pahlawan itu, Penjajah, Kartini]
    answer: 1
    explain:
      ar_eg: اللي بعد oleh هو الفاعل. البطل هو اللي اتقبض عليه.
      ar: ما بعد oleh هو الفاعل، والبطل هو المقبوض عليه.
      en: Whoever follows oleh is the doer; the hero is the one captured.
    words: [menangkap, penjajah, oleh]
