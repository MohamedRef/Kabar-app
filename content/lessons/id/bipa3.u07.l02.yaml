dialogue:
  title: Pahlawan siapa?
  lines:
    - speaker: Mohamed
      text: Mas Rizal, pahlawan Indonesia yang terkenal siapa aja?
      ar_eg: يا ماس ريزال، مين أشهر أبطال إندونيسيا؟
      ar: يا ماس ريزال، مَن أبطال إندونيسيا المشهورون؟
      en: Mas Rizal, who are the famous Indonesian heroes?
    - speaker: Mas Rizal
      text: Banyak! Misalnya Pangeran Diponegoro. Beliau berjuang melawan penjajah Belanda.
      ar_eg: كتير! مثلًا الأمير ديبونيجورو. كافح ضد المستعمر الهولندي.
      ar: كثيرون! مثل الأمير ديبونيغورو الذي كافح ضد المستعمر الهولندي.
      en: Lots! Prince Diponegoro, for example. He fought against the Dutch colonisers.
    - speaker: Mohamed
      text: Terus beliau ditangkap?
      ar_eg: وبعدين اتقبض عليه؟
      ar: ثم قُبض عليه؟
      en: And then he was captured?
    - speaker: Mas Rizal
      text: Iya, beliau ditangkap oleh Belanda tahun 1830.
      ar_eg: أيوه، اتقبض عليه من الهولنديين سنة 1830.
      ar: نعم، قبض عليه الهولنديون عام 1830.
      en: Yes, he was captured by the Dutch in 1830.
    - speaker: Mohamed
      text: Sejarah Indonesia seru banget!
      ar_eg: تاريخ إندونيسيا شيق جدًا!
      ar: تاريخ إندونيسيا مشوّق جدًا!
      en: Indonesian history is so exciting!
