schema: kabar.lesson/v1
id: bipa5.u01.l08
language: id
title: Evaluasi tiga bulan
can_do:
  ar_eg: 'تفهم تقييم الأداء: منتج وكفء وثابت، المساهمة ونقط القوة، والمستشار، والاستقالة.'
  ar: 'أن تفهم تقييم الأداء: منتج وكفء وثابت، والمساهمة ونقاط القوة، والمستشار، والاستقالة.'
  en: 'Follow a performance review: productive, efficient, consistent, contribution and strengths, the adviser, and resigning.'
slides:
  - title: Evaluasi kinerja
    body:
      ar_eg: |
        evaluasi = تقييم (evaluasi kinerja = تقييم الأداء).
        produktif = منتج، efisien = كفء وبيوفر وقت وفلوس، konsisten = ثابت على نفس المستوى.
        kontribusi = مساهمة، keunggulan = ميزة أو نقطة قوة.
        penasihat = مستشار بينصح (penasihat hukum = مستشار قانوني)، pengunduran diri = استقالة.
      ar: |
        evaluasi = تقييم (evaluasi kinerja = تقييم الأداء).
        produktif = منتج، efisien = كفء يوفّر الوقت والمال، konsisten = ثابت على المستوى نفسه.
        kontribusi = مساهمة، keunggulan = ميزة، نقطة قوة.
        penasihat = مستشار ناصح (penasihat hukum = مستشار قانوني)، pengunduran diri = استقالة.
      en: |
        evaluasi = evaluation (evaluasi kinerja = performance review).
        produktif = productive, efisien = efficient, konsisten = consistent.
        kontribusi = contribution, keunggulan = strength, advantage.
        penasihat = adviser (penasihat hukum = legal adviser), pengunduran diri = resignation.
    examples:
      - text: Evaluasi kinerja dilakukan setiap bulan Desember.
        ar_eg: تقييم الأداء بيتعمل كل شهر ديسمبر.
        ar: يُجرى تقييم الأداء كل شهر ديسمبر.
        en: Performance reviews take place every December.
      - text: Timnya kecil, tetapi sangat produktif.
        ar_eg: فريقه صغير بس منتج جدًا.
        ar: فريقه صغير لكنه منتج جدًا.
        en: His team is small but very productive.
      - text: Surat pengunduran diri saya sudah di meja Bapak.
        ar_eg: جواب استقالتي على مكتب حضرتك.
        ar: رسالة استقالتي على مكتبك يا سيّدي.
        en: My resignation letter is on your desk, sir.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: evaluasi
        ar_eg: تقييم
        ar: تقييم
        en: evaluation
      - text: produktif
        ar_eg: منتج
        ar: منتج
        en: productive
      - text: efisien
        ar_eg: كفء
        ar: كفء
        en: efficient
      - text: konsisten
        ar_eg: ثابت
        ar: ثابت
        en: consistent
    words: [evaluasi, produktif, efisien, konsisten]
  - id: e02
    type: match_pairs
    pairs:
      - text: kontribusi
        ar_eg: مساهمة
        ar: مساهمة
        en: contribution
      - text: keunggulan
        ar_eg: ميزة
        ar: ميزة، تفوّق
        en: strength
      - text: penasihat
        ar_eg: مستشار بينصح
        ar: مستشار ناصح
        en: adviser
      - text: pengunduran
        ar_eg: انسحاب، استقالة
        ar: انسحاب، استقالة
        en: withdrawal, resignation
    words: [kontribusi, keunggulan, penasihat, pengunduran]
  - id: e03
    type: listen
    text: Kontribusi Anda tahun ini sangat besar.
    question:
      ar_eg: المدير بيمدح إيه؟
      ar: ماذا يمدح المدير؟
      en: What is the manager praising?
    options: [غيابك, مساهمتك, مرتبك]
    answer: 1
    meaning:
      ar_eg: مساهمتك السنة دي كانت كبيرة أوي.
      ar: كانت مساهمتك هذا العام كبيرة جدًا.
      en: Your contribution this year was huge.
    words: [kontribusi]
  - id: e04
    type: fill_blank
    sentence: 'Mesin baru ini lebih ___: listriknya hemat dan cepat.'
    meaning:
      ar_eg: 'المكنة الجديدة دي ___ أكتر: بتوفر كهربا وسريعة.'
      ar: 'هذه الآلة الجديدة أكثر ___: توفّر الكهرباء وسريعة.'
      en: 'This new machine is more ___: it saves power and is fast.'
    options: [efisien, konsisten, penasihat]
    answers: [efisien]
    words: [efisien, konsisten, penasihat]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: 'إيه اللي يميزك عن باقي المرشحين؟ بالإندونيسي: Apa ___ Anda?'
      ar: 'ما الذي يميّزك عن بقية المرشحين؟ بالإندونيسية: Apa ___ Anda؟'
      en: 'What sets you apart from other candidates? In Indonesian: Apa ___ Anda?'
    options: [evaluasi, keunggulan, pengunduran]
    answer: 1
    explain:
      ar_eg: keunggulan = ميزة، نقطة قوة.
      ar: keunggulan = ميزة، نقطة قوة.
      en: keunggulan = strength, advantage.
    words: [evaluasi, keunggulan, pengunduran]
  - id: e06
    type: fill_blank
    sentence: Nilainya selalu baik dari awal sampai akhir. Dia sangat ___.
    meaning:
      ar_eg: درجاتها دايمًا كويسة من الأول للآخر. هي ___ جدًا.
      ar: درجاتها جيدة دائمًا من البداية إلى النهاية. إنها ___ جدًا.
      en: Her marks are always good from start to finish. She's very ___.
    options: [konsisten, produktif, kontribusi]
    answers: [konsisten]
    words: [konsisten, produktif, kontribusi]
  - id: e07
    type: multiple_choice
    question: Sebelum menandatangani kontrak, tanyakan dulu kepada ___ hukum Anda.
    options: [produktif, evaluasi, penasihat]
    answer: 2
    explain:
      ar_eg: penasihat hukum = مستشار قانوني.
      ar: penasihat hukum = مستشار قانوني.
      en: penasihat hukum = legal adviser.
    words: [produktif, evaluasi, penasihat]
  - id: e08
    type: build_sentence
    source:
      ar_eg: التقييم بيوري نقط القوة والضعف.
      ar: يُظهر التقييم نقاط القوة والضعف.
      en: The evaluation shows strengths and weaknesses.
    answer: Evaluasi menunjukkan keunggulan dan kelemahan.
    distractors: [kontribusi, penasihat]
    words: [evaluasi, keunggulan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Pengunduran dirinya mengejutkan semua orang.
    answers_meaning:
      ar_eg: [استقالته فاجأت الكل, استقالتها صدمت الناس كلها]
      ar: [فاجأت استقالته الجميع, أدهشت استقالتها الجميع]
      en: [His resignation surprised everyone, Her resignation shocked everyone]
    words: [pengunduran]
  - id: e10
    type: speaking
    text: Kantor kami kecil, tetapi produktif dan efisien.
    meaning:
      ar_eg: مكتبنا صغير بس منتج وكفء.
      ar: مكتبنا صغير لكنه منتج وكفء.
      en: Our office is small but productive and efficient.
    words: [produktif, efisien]
dialogue:
  lines:
    - speaker: Pak Hendra
      text: Pak Mohamed, ini evaluasi tiga bulan pertama Anda.
      ar_eg: يا أستاذ محمد، ده تقييم أول تلات شهور ليك.
      ar: يا أستاذ محمد، هذا تقييم أشهرك الثلاثة الأولى.
      en: Mohamed, this is your first three-month review.
    - speaker: Mohamed
      text: Terima kasih, Pak. Apa ada yang perlu saya perbaiki?
      ar_eg: شكرًا يا فندم. فيه حاجة محتاج أحسنها؟
      ar: شكرًا يا سيّدي. هل هناك ما ينبغي تحسينه؟
      en: Thank you, sir. Is there anything I should improve?
    - speaker: Pak Hendra
      text: Terjemahan Anda konsisten dan efisien. Kontribusi Anda jelas.
      ar_eg: ترجمتك ثابتة المستوى وكفء. ومساهمتك واضحة.
      ar: ترجمتك ثابتة وفعّالة، ومساهمتك واضحة.
      en: Your translations are consistent and efficient. Your contribution is clear.
    - speaker: Mohamed
      text: Saya senang mendengarnya. Saya ingin lebih produktif lagi.
      ar_eg: مبسوط إني سمعت كده. وعايز أكون منتج أكتر.
      ar: يسرّني سماع ذلك. أريد أن أكون أكثر إنتاجًا.
      en: I'm glad to hear it. I'd like to be even more productive.
    - speaker: Pak Hendra
      text: Bagus. Setelah pengunduran diri Pak Rudi, Anda jadi penasihat bahasa untuk tim.
      ar_eg: كويس. بعد استقالة أستاذ رودي، هتبقى المستشار اللغوي للفريق.
      ar: جيد. بعد استقالة الأستاذ رودي ستصبح المستشار اللغوي للفريق.
      en: Good. Since Pak Rudi resigned, you'll be the team's language adviser.
    - speaker: Mohamed
      text: Itu keunggulan saya, Pak. Saya siap.
      ar_eg: دي نقطة قوتي يا فندم. أنا جاهز.
      ar: هذه نقطة قوّتي يا سيّدي. أنا مستعد.
      en: That's my strength, sir. I'm ready.
