    pos: verb
    ar_eg: يفيد / يكسّب
    ar: يفيد، يعود بالربح
    en: to benefit, to be profitable for
  - word: merugikan
    pos: verb
    ar_eg: يضر / يخسّر
    ar: يضرّ، يُلحق خسارة
    en: to harm, to cause loss to
