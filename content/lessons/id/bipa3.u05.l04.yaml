dialogue:
  title: Telepon dari Rina
  lines:
    - speaker: Rina
      text: Mohamed, bagaimana minggumu di Senaru?
      ar_eg: يا محمد، أسبوعك في سنارو كان عامل إزاي؟
      ar: يا محمد، كيف كان أسبوعك في سنارو؟
      en: Mohamed, how was your week in Senaru?
    - speaker: Mohamed
      text: Seru! Hari Senin saya tiba di Senaru. Sesampainya di sana, saya bertemu Pak Sahdan.
      ar_eg: جامد! يوم الاتنين وصلت سنارو. أول ما وصلت، قابلت عم سهدان.
      ar: رائع! وصلتُ إلى سنارو يوم الاثنين، وحين وصلت قابلتُ السيد سهدان.
      en: Great! On Monday I arrived in Senaru. When I got there, I met Pak Sahdan.
    - speaker: Rina
      text: Lalu?
      ar_eg: وبعدين؟
      ar: ثم؟
      en: And then?
    - speaker: Mohamed
      text: Keesokan harinya kami mendaki Rinjani. Pengalaman itu sangat berkesan!
      ar_eg: تاني يوم طلعنا رينجاني. التجربة دي فضلت في بالي جدًا!
      ar: في اليوم التالي صعدنا رينجاني. كانت تجربة لا تُنسى!
      en: The next day we climbed Rinjani. It was an unforgettable experience!
