schema: kabar.lesson/v1
id: bipa3.u05.l04
language: id
title: Minggu lalu
can_do:
  ar_eg: ترتّب حكاية عن اللي عملته (بداية، أحداث بالترتيب، ونهاية).
  ar: أن ترتّب سردًا لما فعلته (تمهيد، وأحداث متتابعة، وخاتمة).
  en: Structure a recount.
slides:
  - title: Teks recount
    body:
      ar_eg: |
        الحكاية عن اللي حصل (recount) ليها تلات أجزاء:
        ١) البداية: إمتى وفين: Akhir pekan lalu, saya … = آخر الأسبوع اللي فات …
        ٢) الأحداث بالترتيب: Pertama, … Setelah itu, … (اللي انت عارفهم من BIPA 2).
        ٣) النهاية، إحساسك: Pengalaman itu sangat berkesan = التجربة دي فضلت في بالي.
      ar: |
        للسرد (recount) ثلاثة أجزاء:
        ١) التمهيد: متى وأين: Akhir pekan lalu, saya … = في عطلة نهاية الأسبوع الماضية …
        ٢) الأحداث مرتّبة: Pertama, … Setelah itu, … (تعرفها من BIPA 2).
        ٣) الخاتمة وانطباعك: Pengalaman itu sangat berkesan = كانت تلك التجربة لا تُنسى.
      en: |
        A recount has three parts:
        1) Orientation, when and where: Akhir pekan lalu, saya … = Last weekend, I …
        2) Events in order: Pertama, … Setelah itu, … (which you know from BIPA 2).
        3) Closing, how you felt: Pengalaman itu sangat berkesan = That experience was unforgettable.
    examples:
      - text: Akhir pekan lalu, saya mengunjungi Senaru.
        ar_eg: آخر الأسبوع اللي فات، زرت سنارو.
        ar: في عطلة نهاية الأسبوع الماضية زرتُ سنارو.
        en: Last weekend, I visited Senaru.
      - text: Pengalaman itu sangat berkesan bagi saya.
        ar_eg: التجربة دي فضلت في بالي جدًا.
        ar: كانت تلك التجربة مؤثّرة جدًا بالنسبة إليّ.
        en: That experience really stayed with me.
  - title: Sesampainya, keesokan harinya
    body:
      ar_eg: |
        كلمتين بيربطوا الأحداث في الحكاية:
        sesampainya di … = أول ما وصلنا …
        keesokan harinya = تاني يوم.
      ar: |
        كلمتان تربطان الأحداث في السرد:
        sesampainya di … = حين وصلنا إلى …
        keesokan harinya = في اليوم التالي.
      en: |
        Two linkers for recounts:
        sesampainya di … = on arriving at …
        keesokan harinya = the next day.
    examples:
      - text: Sesampainya di Senaru, kami makan siang.
        ar_eg: أول ما وصلنا سنارو، اتغدّينا.
        ar: حين وصلنا إلى سنارو تناولنا الغداء.
        en: When we got to Senaru, we had lunch.
      - text: Keesokan harinya, kami mendaki gunung.
        ar_eg: تاني يوم، طلعنا الجبل.
        ar: في اليوم التالي صعدنا الجبل.
        en: The next day, we climbed the mountain.
