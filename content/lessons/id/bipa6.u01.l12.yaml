schema: kabar.lesson/v1
id: bipa6.u01.l12
language: id
title: Menulis cerpen mini
can_do:
  ar_eg: تكتب قصة قصيرة جدًا ليها بداية قوية وراوي واضح وحوار صغير.
  ar: أن تكتب قصة قصيرة جدًا ذات بداية قوية وراوٍ واضح وحوار قصير.
  en: Write a very short story with a strong opening, a clear narrator and a bit of dialogue.
slides:
  - title: Cerita dalam seratus kata
    body:
      ar_eg: |
        الـ cerita mini (القصة القصيرة جدًا) حوالي ١٠٠ كلمة بس، فكل جملة لازم تشتغل:
        - kalimat pembuka = الجملة الأولى: لازم تشد القارئ من أول سطر
        - اختار pencerita واحد: orang pertama ولا orang ketiga
        - حوار صغير بين tanda petik، بفعل زي berbisik أو membentak
        - akhir terbuka لو عايز القارئ يفكر بعد ما يخلص
        - في الشارع: lagi = sedang (بـ (دلوقتي))، nyari = mencari (يدوّر)، gitu = begitu (كده)، banget = sekali (أوي)، tambahin = tambahkan (زوّد)، terus = lalu (وبعدين)، biar = supaya (عشان)، mikir = berpikir (يفكّر).
      ar: |
        الـ cerita mini (القصة القصيرة جدًا) نحو مئة كلمة فقط، فلكلّ جملة عملها:
        - kalimat pembuka = الجملة الافتتاحية، وعليها أن تشدّ القارئ من السطر الأول
        - اختر pencerita واحدًا: orang pertama أو orang ketiga
        - حوار قصير بين tanda petik، بفعل مثل berbisik أو membentak
        - akhir terbuka إن أردت أن يفكّر القارئ بعد الانتهاء
        - في كلام الشارع: lagi = sedang (يفعل الآن)، nyari = mencari (يبحث)، gitu = begitu (هكذا)، banget = sekali (جدًّا)، tambahin = tambahkan (أضِف)، terus = lalu (ثمّ)، biar = supaya (لكي)، mikir = berpikir (يفكّر).
      en: |
        A cerita mini (flash fiction) is about a hundred words, so every sentence has a job:
        - kalimat pembuka = the opening line; it must hook the reader at once
        - pick one pencerita: orang pertama or orang ketiga
        - a little dialogue in tanda petik, with a verb like berbisik or membentak
        - an akhir terbuka if you want the reader to keep thinking
        - On the street: lagi = sedang (in the middle of), nyari = mencari (to look for), gitu = begitu (like that), banget = sekali (very), tambahin = tambahkan (add), terus = lalu (then), biar = supaya (so that), mikir = berpikir (to think).
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي kalimat pembuka أقوى؟
      ar: أيّ kalimat pembuka أقوى؟
      en: Which kalimat pembuka is strongest?
    options:
      - Pada suatu hari, ada seorang bapak.
      - Kursi itu sudah sepuluh tahun menunggu.
      - Cerita ini tentang keluarga.
    answer: 1
    explain:
      ar_eg: 'بتفتح سؤال في دماغ القارئ: الكرسي مستني مين؟'
      ar: 'تفتح سؤالًا في ذهن القارئ: من ينتظر الكرسي؟'
      en: It opens a question in the reader's mind. Who is the chair waiting for?
    words: [kalimat pembuka]
  - id: e02
    type: listen
    text: Cerita mini ini hanya seratus kata, tetapi ada kilas balik dan akhir terbuka.
    question:
      ar_eg: القصة دي طولها قد إيه؟
      ar: كم طول هذه القصة؟
      en: How long is this story?
    options:
      - ألف كلمة.
      - عشر صفحات.
      - مية كلمة بس.
    answer: 2
    words: [cerita mini, kilas balik, akhir terbuka]
  - id: e03
    type: fill_blank
    sentence: '"Aku takut," ___ anak itu, sangat pelan.'
    meaning:
      ar_eg: «أنا خايف»، وشوش الولد، بصوت واطي جدًا.
      ar: «أنا خائف»، همس الطفل بصوت خافت جدًا.
      en: '"I''m scared," the child whispered, very softly.'
    options: [bisik, bentak, sahut]
    answers: [bisik]
    words: [berbisik]
  - id: e04
    type: build_sentence
    source:
      ar_eg: القصة دي بتستخدم ضمير المتكلم وحوار قليل.
      ar: تستعمل هذه القصة ضمير المتكلّم وحوارًا قليلًا.
      en: This story uses the first person and a little dialogue.
    answer: Cerita ini memakai sudut pandang orang pertama dan sedikit dialog.
    distractors: [ketiga, petik]
    words: [orang pertama]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: '«"Diam!" bentak ayahnya.» الأب كان عامل إزاي؟'
      ar: '«"Diam!" bentak ayahnya.» كيف كان الأب؟'
      en: '«"Diam!" bentak ayahnya.» How was the father?'
    options:
      - زعلان ومتعصب.
      - هادي ونعسان.
      - فرحان ومبسوط.
    answer: 0
    words: [membentak]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الجملة الأولى في القصة القصيرة جدًا لازم تشد القارئ.
      ar: يجب أن تشدّ الجملة الأولى في القصة القصيرة جدًا القارئ.
      en: The opening line of a flash fiction must grab the reader.
    answers:
      - Kalimat pembuka cerita mini harus menarik pembaca.
      - Kalimat pembuka dalam cerita mini harus menarik pembaca.
      - Kalimat pembuka cerita mini harus menarik perhatian pembaca.
    words: [kalimat pembuka, cerita mini]
  - id: e07
    type: fill_blank
    sentence: Ibunya memanggil dua kali, tetapi Rudi tidak ___.
    meaning:
      ar_eg: أمه ندهت عليه مرتين، بس رودي مارّدش.
      ar: نادته أمّه مرّتين، لكنّ رودي لم يردّ.
      en: His mother called twice, but Rudi didn't answer.
    options: [menyahut, bergumam, diterbitkan]
    answers: [menyahut]
    words: [menyahut]
  - id: e08
    type: speaking
    text: Dalam cerita mini saya, pencerita bergumam tentang masa kecilnya.
    meaning:
      ar_eg: في القصة القصيرة جدًا بتاعتي، الراوي بيبرطم عن طفولته.
      ar: في قصتي القصيرة جدًا، يتمتم الراوي عن طفولته.
      en: In my flash fiction, the narrator mutters about his childhood.
    words: [cerita mini, pencerita, bergumam]
  - id: e09
    type: dictation
    text: Redaktur suka kalimat pembuka yang pendek dan kuat.
    meaning:
      ar_eg: المحرر بيحب الجملة الأولى تبقى قصيرة وقوية.
      ar: يحبّ المحرّر الجملة الافتتاحية القصيرة القوية.
      en: The editor likes a short, strong opening line.
    words: [kalimat pembuka, redaktur]
  - id: e10
    type: speaking
    text: Kursi itu sudah sepuluh tahun menunggu. "Dia akan pulang," bisik Pak Lubis.
    meaning:
      ar_eg: الكرسي ده مستني من عشر سنين. «أكيد هيرجع»، وشوش الأستاذ لوبيس.
      ar: انتظر ذلك الكرسي عشر سنين. «سيعود حتمًا»، همس الأستاذ لوبيس.
      en: That chair has been waiting ten years. "He'll come home," Pak Lubis whispered.
    words: [kalimat pembuka, berbisik, tanda petik]
dialogue:
  title: Seratus kata saja
  lines:
    - speaker: Kak Mei
      text: Mohamed, koran kampus lagi nyari cerita mini. Paling banyak seratus kata.
      ar_eg: يا محمد، جرنال الجامعة عايز قصص قصيرة جدًا. مية كلمة بالكتير.
      ar: يا محمد، صحيفة الجامعة تطلب قصصًا قصيرة جدًا، مئة كلمة على الأكثر.
      en: Mohamed, the campus paper wants flash fiction. A hundred words at most.
    - speaker: Mohamed
      text: Seratus kata? Kalau gitu kalimat pembukanya harus kuat banget.
      ar_eg: مية كلمة؟ يبقى الجملة الأولى لازم تبقى قوية جدًا.
      ar: مئة كلمة؟ إذن ينبغي أن تكون الجملة الافتتاحية قوية جدًا.
      en: A hundred words? Then the opening line has to be really strong.
    - speaker: Kak Mei
      text: Iya. Pilih satu pencerita, tambahin sedikit dialog, terus berhenti.
      ar_eg: أيوه. اختار راوي واحد، وزوّد حوار صغير، وبعدين اقف.
      ar: نعم. اختر راويًا واحدًا، وأضف حوارًا قليلًا، ثم توقّف.
      en: Yes. Choose one narrator, add a bit of dialogue, then stop.
    - speaker: Mohamed
      text: Dengan akhir terbuka, biar pembaca terus mikir.
      ar_eg: وبنهاية مفتوحة، عشان القارئ يفضل يفكر.
      ar: وبنهاية مفتوحة، كي يظلّ القارئ يفكّر.
      en: With an open ending, so the reader keeps thinking.
