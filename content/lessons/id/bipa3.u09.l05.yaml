  - id: e03
    type: listen
    text: Seekor tikus kecil berlari di dekat singa.
    question:
      ar_eg: مين اللي جري جنب الأسد؟
      ar: من ركض قرب الأسد؟
      en: Who ran past the lion?
    options: [قطة, فار, كلب]
    answer: 1
    meaning:
      ar_eg: فار صغير جري جنب الأسد.
      ar: ركض فأر صغير قرب الأسد.
      en: A little mouse ran past the lion.
    words: [tikus, singa]
  - id: e04
    type: fill_blank
    sentence: Para pemburu memasukkan singa itu ke dalam ___.
    meaning:
      ar_eg: الصيادين حطّوا الأسد في ___.
      ar: وضع الصيادون الأسد في ___.
      en: The hunters put the lion in a ___.
    options: [kandang, mahkota, ratu]
    answers: [kandang]
    words: [kandang, mahkota, ratu]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي بيلبسه الملك أو الملكة على راسه؟
      ar: ماذا يلبس الملك أو الملكة على الرأس؟
      en: What does a king or queen wear on their head?
    options: [nasib, mahkota, kandang]
    answer: 1
    explain:
      ar_eg: mahkota = تاج.
      ar: mahkota = تاج.
      en: mahkota = crown.
    words: [mahkota, nasib, kandang]
  - id: e06
    type: fill_blank
    sentence: Dulu dia miskin, sekarang kaya. ___nya berubah!
    meaning:
      ar_eg: زمان كان فقير، دلوقتي غني. ___ه اتغيّر!
      ar: كان فقيرًا والآن صار غنيًّا. تغيّر ___ه!
      en: He used to be poor; now he's rich. His ___ has changed!
    options: [Nasib, Ratu, Singa]
    answers: [Nasib]
    words: [nasib, ratu, singa]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الملك كان بيحب يصطاد.
      ar: كان الملك يحب الصيد.
      en: The king loved to hunt.
    answer: Raja itu suka berburu.
    distractors: [tikus, kandang]
    words: [berburu]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ratu itu sangat baik kepada orang miskin.
    answers_meaning:
      ar_eg: [الملكة دي طيبة جدًا مع الفقرا, الملكة كانت طيبة أوي مع الغلابة]
      ar: [كانت تلك الملكة طيبة جدًا مع الفقراء]
      en: [That queen was very kind to the poor, The queen was very good to poor people]
    words: [ratu]
  - id: e09
    type: speaking
    text: Tikus kecil itu menolong singa.
    meaning:
      ar_eg: الفار الصغير ده أنقذ الأسد.
      ar: أنقذ ذلك الفأر الصغير الأسد.
      en: The little mouse rescued the lion.
    words: [menolong, tikus, singa]
  - id: e10
    type: multiple_choice
    question: Terima kasih sudah ___ saya!
    options: [kandang, berburu, menolong]
    answer: 2
    explain:
      ar_eg: menolong = ينجد، يساعد.
      ar: menolong = ينجد، يساعد.
      en: menolong = help, rescue.
    words: [menolong, berburu, kandang]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Mohamed, kamu tahu cerita singa dan tikus?
      ar_eg: يا محمد، تعرف حدوتة الأسد والفار؟
      ar: يا محمد، أتعرف قصة الأسد والفأر؟
      en: Mohamed, do you know the story of the lion and the mouse?
    - speaker: Mohamed
      text: Belum. Bagaimana ceritanya?
      ar_eg: لأ. الحكاية إيه؟
      ar: لا. ما القصة؟
      en: No. How does it go?
    - speaker: Mas Rizal
      text: Seekor singa melepaskan seekor tikus kecil. Lalu orang-orang yang berburu menangkap singa itu.
      ar_eg: أسد ساب فار صغير يمشي. وبعدين الصيادين مسكوا الأسد.
      ar: أطلق أسدٌ سراح فأر صغير. ثم أمسك الصيادون بالأسد.
      en: A lion let a little mouse go. Then some hunters caught the lion.
    - speaker: Mohamed
      text: Wah, bagaimana nasib singa itu?
      ar_eg: ياه، وحصل إيه للأسد؟
      ar: وماذا كان مصير الأسد؟
      en: Oh no, what happened to the lion?
    - speaker: Mas Rizal
      text: Tikus itu datang dan memotong talinya. Singa itu bebas!
      ar_eg: الفار جه وقطع الحبل. والأسد بقى حر!
      ar: جاء الفأر وقطع الحبل. فتحرّر الأسد!
      en: The mouse came and cut through the rope. The lion was free!
