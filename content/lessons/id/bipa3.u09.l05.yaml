schema: kabar.lesson/v1
id: bipa3.u09.l05
language: id
title: Singa dan tikus
can_do:
  ar_eg: 'تحكي حدوتة الأسد والفار: الصيد والقفص والتاج ونصيب كل واحد.'
  ar: 'أن تحكي حكاية الأسد والفأر: الصيد والقفص والتاج ومصير كل واحد.'
  en: 'Tell the fable of the lion and the mouse: the hunt, the cage, the crown and each one''s fate.'
slides:
  - title: Seekor singa yang sombong
    body:
      ar_eg: |
        menolong = ينجد، يساعد (من tolong): Tikus menolong singa.
        singa = أسد، tikus = فار. berburu = يصطاد (حيوانات).
        kandang = قفص، زريبة. mahkota = تاج. ratu = ملكة.
        nasib = نصيب، حظ (من العربي «نصيب»).
      ar: |
        menolong = ينجد، يساعد (من tolong): Tikus menolong singa.
        singa = أسد، tikus = فأر. berburu = يصطاد (الحيوانات).
        kandang = قفص، حظيرة. mahkota = تاج. ratu = ملكة.
        nasib = نصيب، حظّ (من العربية «نصيب»).
      en: |
        menolong = help, rescue (from tolong): Tikus menolong singa.
        singa = lion, tikus = mouse, rat. berburu = hunt.
        kandang = cage, pen. mahkota = crown. ratu = queen.
        nasib = fate, lot, luck (from Arabic naṣīb).
    examples:
      - text: Seekor singa tidur di bawah pohon.
        ar_eg: أسد نايم تحت شجرة.
        ar: أسدٌ نائم تحت شجرة.
        en: A lion is sleeping under a tree.
      - text: Orang-orang itu berburu di hutan.
        ar_eg: الناس دول بيصطادوا في الغابة.
        ar: أولئك الناس يصطادون في الغابة.
        en: Those people are hunting in the forest.
      - text: Ratu memakai mahkota emas.
        ar_eg: الملكة لابسة تاج دهب.
        ar: تلبس الملكة تاجًا من ذهب.
        en: The queen wears a golden crown.
