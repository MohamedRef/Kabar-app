      ar: عادةً أستيقظ في الساعة الخامسة.
      en: I usually wake up at five.
    answer: Biasanya saya bangun jam lima.
    alternatives: [Saya biasanya bangun jam lima.]
    distractors: [selalu, tidur]
    words: [biasanya, bangun]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا نادرًا لما بتفرج على التلفزيون.
      ar: نادرًا ما أشاهد التلفاز.
      en: I rarely watch TV.
    answers: [Saya jarang menonton TV., Saya jarang menonton TV, Aku jarang menonton TV., Saya jarang menonton televisi., Saya jarang nonton TV., Aku jarang nonton TV.]
    words: [jarang, menonton]
  - id: e06
