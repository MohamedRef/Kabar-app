      ar: أتناول الفطور دائمًا. كل يوم!
      en: I always have breakfast. Every day!
    options: [jarang, selalu, tidak pernah]
    answers: [selalu]
    words: [selalu, setiap, sarapan]
  - id: e07
    type: speaking
    text: Saya kadang-kadang minum kopi.
    meaning:
      ar_eg: ساعات بشرب قهوة.
      ar: أشرب القهوة أحيانًا.
      en: I sometimes drink coffee.
    words: [kadang-kadang]
  - id: e08
    type: listen
    text: Biasanya saya sarapan jam enam.
    options: ['Biasanya saya sarapan jam enam.', 'Saya tidak pernah sarapan jam enam.', 'Kadang-kadang saya sarapan jam enam.']
    answer: 0
    meaning:
      ar_eg: عادةً بفطر الساعة ستة.
      ar: عادةً أفطر في السادسة.
      en: I usually have breakfast at six.
    words: [biasanya, sarapan, tidak pernah, kadang-kadang]
  - id: e09
    type: fill_blank
