      ar_eg: إزاي تقول «أنا عمري ما بشرب قهوة»؟
      ar: كيف تقول «لا أشرب القهوة أبدًا»؟
      en: How do you say "I never drink coffee"?
    options: ['Saya tidak pernah minum kopi.', 'Saya biasanya minum kopi.', 'Saya setiap minum kopi.']
    answer: 0
    words: [tidak pernah, biasanya, setiap]
dialogue:
  lines:
    - speaker: Raka
      text: Mohamed, kamu sering minum kopi?
      ar_eg: محمد، بتشرب قهوة كتير؟
      ar: محمد، هل تشرب القهوة كثيرًا؟
      en: Mohamed, do you often drink coffee?
    - speaker: Mohamed
      text: Ya, setiap hari! Kamu?
      ar_eg: أيوه، كل يوم! وإنت؟
      ar: نعم، كل يوم! وأنت؟
      en: Yes, every day! You?
    - speaker: Raka
      text: Saya jarang minum kopi. Biasanya saya minum teh.
      ar_eg: أنا نادرًا ما بشرب قهوة. عادةً بشرب شاي.
      ar: نادرًا ما أشرب القهوة. عادةً أشرب الشاي.
      en: I rarely drink coffee. I usually drink tea.
    - speaker: Mohamed
      text: Saya tidak pernah minum teh!
      ar_eg: أنا عمري ما بشرب شاي!
      ar: لا أشرب الشاي أبدًا!
      en: I never drink tea!
