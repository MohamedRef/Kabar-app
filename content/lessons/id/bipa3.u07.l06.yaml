  - id: e03
    type: listen
    text: Pertempuran Surabaya dimulai pada 10 November. Hari itu sekarang Hari Pahlawan.
    question:
      ar_eg: يوم الأبطال إمتى؟
      ar: متى يوم الأبطال؟
      en: When is Heroes' Day?
    options: [١٧ أغسطس, ١٠ نوفمبر, ١ يونيو]
    answer: 1
    meaning:
      ar_eg: معركة سورابايا بدأت يوم ١٠ نوفمبر. اليوم ده بقى دلوقتي يوم الأبطال.
      ar: بدأت معركة سورابايا في ١٠ نوفمبر. صار ذلك اليوم يوم الأبطال.
      en: The Battle of Surabaya began on 10 November. That day is now Heroes' Day.
    words: [pertempuran]
  - id: e04
    type: fill_blank
    sentence: Setelah perang, semua orang ingin ___.
    meaning:
      ar_eg: بعد الحرب، كل الناس عايزة ___.
      ar: بعد الحرب أراد الجميع ___.
      en: After the war, everyone wanted ___.
    options: [perdamaian, prajurit, menyerah]
    answers: [perdamaian]
    words: [perdamaian, prajurit, menyerah]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: لما جيش يبطّل يحارب ويقول «خلاص، كسبتوا»، بيعمل إيه؟
      ar: حين يكفّ جيش عن القتال ويقرّ بالهزيمة، ماذا يفعل؟
      en: When an army stops fighting and admits defeat, what does it do?
    options: [merebut, bebas, menyerah]
    answer: 2
    explain:
      ar_eg: menyerah = يستسلم.
      ar: menyerah = يستسلم.
      en: menyerah = surrender.
    words: [menyerah, merebut, bebas]
  - id: e06
    type: fill_blank
    sentence: Pasukan kecil itu berhasil ___ musuh yang besar.
    meaning:
      ar_eg: القوة الصغيرة دي قدرت ___ العدو الكبير.
      ar: تمكّنت تلك الفرقة الصغيرة من ___ العدو الكبير.
      en: That small force managed to ___ a large enemy.
    options: [mengalahkan, pertempuran, kemenangan]
    answers: [mengalahkan]
    words: [mengalahkan, pertempuran, kemenangan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الشعب عايز يبقى حر.
      ar: يريد الشعب أن يكون حرًّا.
      en: The people want to be free.
    answer: Mereka ingin bebas.
    distractors: [perdamaian, prajurit]
    words: [bebas]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kemenangan itu sangat mahal. Banyak prajurit meninggal.
    answers_meaning:
      ar_eg: [الانتصار ده كان تمنه غالي. عساكر كتير استشهدوا, النصر ده كلّف كتير. عساكر كتير ماتوا]
      ar: [كان ذلك النصر باهظ الثمن. سقط جنود كثيرون, كلّف ذلك النصر كثيرًا. استُشهد جنود كثيرون]
      en: [That victory came at a high price. Many soldiers fell, That victory was very costly. Many soldiers died]
    words: [kemenangan, prajurit]
  - id: e09
    type: speaking
    text: Para pemuda merebut senjata dan melawan.
    meaning:
      ar_eg: الشباب خدوا السلاح وقاوموا.
      ar: استولى الشباب على السلاح وقاوموا.
      en: The young men seized weapons and fought back.
    words: [merebut]
  - id: e10
    type: multiple_choice
    question: Merdeka! Sekarang ada perdamaian. Ini ___ kita semua!
    options: [kemenangan, bebas, mengalahkan]
    answer: 0
    explain:
      ar_eg: kemenangan = انتصار (من menang).
      ar: kemenangan = نصر (من menang).
      en: kemenangan = victory (from menang).
    words: [kemenangan, bebas, mengalahkan, perdamaian]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas Rizal, kok 10 November jadi Hari Pahlawan?
      ar_eg: يا مستر رزال، ليه ١٠ نوفمبر بقى يوم الأبطال؟
      ar: يا رزال، لماذا صار ١٠ نوفمبر يوم الأبطال؟
      en: Mas Rizal, how come 10 November is Heroes' Day?
    - speaker: Mas Rizal
      text: Gara-gara pertempuran Surabaya tahun 1945. Orang-orang Surabaya melawan tentara Inggris.
      ar_eg: عشان معركة سورابايا سنة ١٩٤٥. الشعب حارب الجيش الإنجليزي.
      ar: بسبب معركة سورابايا عام ١٩٤٥. قاوم الشعب الجيش البريطاني.
      en: Because of the Battle of Surabaya in 1945. The people fought the British army.
    - speaker: Mohamed
      text: Mereka menang nggak?
      ar_eg: الشعب كسب؟
      ar: هل انتصر الشعب؟
      en: Did the people win?
    - speaker: Mas Rizal
      text: Kotanya kalah, tapi mereka nggak menyerah. Keberanian mereka itu kemenangan.
      ar_eg: المدينة وقعت، بس الشعب ما استسلمش. روحهم دي كانت هي الانتصار.
      ar: سقطت المدينة لكن الشعب لم يستسلم. كانت روحهم هي النصر.
      en: The city fell, but the people didn't surrender. Their spirit was the victory.
    - speaker: Mohamed
      text: Sekarang Indonesia bebas dan damai. Semoga perdamaian ini abadi.
      ar_eg: دلوقتي إندونيسيا حرة وفي سلام. يا رب السلام ده يدوم.
      ar: إندونيسيا الآن حرّة ومسالمة. عسى أن يدوم هذا السلام.
      en: Now Indonesia is free and at peace. May this peace last for ever.
