schema: kabar.lesson/v1
id: bipa3.u07.l06
language: id
title: Halaman buku sejarah
can_do:
  ar_eg: تقرا صفحة تاريخ عن بطل قومي وتطلّع منها الأماكن والتواريخ.
  ar: أن تقرأ صفحة تاريخية عن بطل قومي وتستخرج منها الأماكن والتواريخ.
  en: Read a history-book page about a national hero and pick out places and dates.
slides:
  - title: Pangeran Diponegoro
    grammar: id.passive.di
    body:
      ar_eg: |
        محمد اشترى من ساده كتاب تاريخ صغير. دي صفحة عن الأمير ديبونيجورو، اللي سمعت عنه قبل كده.
        دوّر على: اتولد فين وإمتى؟ حارب مين وكام سنة؟ مين قبض عليه؟ ومات فين؟
        وخد بالك من المبني للمجهول: ditangkap oleh Belanda، diangkat menjadi pahlawan nasional.
      ar: |
        اشترى محمد من ساده كتاب تاريخ صغيرًا. هذه صفحة عن الأمير ديبونيغورو الذي سمعت عنه من قبل.
        ابحث عن: أين ومتى وُلد؟ مَن حارب وكم سنة؟ مَن قبض عليه؟ وأين توفّي؟
        ولاحظ المبني للمجهول: ditangkap oleh Belanda وdiangkat menjadi pahlawan nasional.
      en: |
        Mohamed bought a small history book in Sade. This page is about Prince Diponegoro, whom you've met before.
        Look for: where and when was he born? Whom did he fight, and for how long? Who captured him? Where did he die?
        Notice the passives: ditangkap oleh Belanda, diangkat menjadi pahlawan nasional.
    examples:
      - text: Pangeran Diponegoro lahir di Yogyakarta pada tahun 1785.
        ar_eg: الأمير ديبونيجورو اتولد في يوجياكارتا سنة ١٧٨٥.
        ar: وُلد الأمير ديبونيغورو في يوغياكارتا عام ١٧٨٥.
        en: Prince Diponegoro was born in Yogyakarta in 1785.
      - text: Beliau berjuang melawan penjajah Belanda dari tahun 1825 sampai tahun 1830.
        ar_eg: حارب المستعمر الهولندي من سنة ١٨٢٥ لحد سنة ١٨٣٠.
        ar: جاهد ضد المستعمر الهولندي من عام ١٨٢٥ حتى عام ١٨٣٠.
        en: He fought the Dutch colonisers from 1825 to 1830.
      - text: Pada tahun 1830, beliau ditangkap oleh Belanda. Beliau wafat di Makassar pada tahun 1855 dan diangkat menjadi pahlawan nasional pada tahun 1973.
        ar_eg: سنة ١٨٣٠ الهولنديين قبضوا عليه. اتوفّى في ماكاسار سنة ١٨٥٥، واتعيّن بطل قومي سنة ١٩٧٣.
        ar: في عام ١٨٣٠ قبض عليه الهولنديون. توفّي في ماكاسار عام ١٨٥٥، ونال لقب بطل قومي عام ١٩٧٣.
        en: In 1830 he was captured by the Dutch. He died in Makassar in 1855 and was made a national hero in 1973.
exercises:
  - id: e01
    type: listen
    text: Pangeran Diponegoro lahir di Yogyakarta pada tahun 1785.
    question:
      ar_eg: ديبونيجورو اتولد فين؟
      ar: أين وُلد ديبونيغورو؟
      en: Where was Diponegoro born?
    options: [Makassar, Yogyakarta, Lombok]
    answer: 1
    meaning:
      ar_eg: الأمير ديبونيجورو اتولد في يوجياكارتا سنة ١٧٨٥.
      ar: وُلد الأمير ديبونيغورو في يوغياكارتا عام ١٧٨٥.
      en: Prince Diponegoro was born in Yogyakarta in 1785.
    words: [lahir]
  - id: e02
    type: listen
    text: Pada tahun 1830, beliau ditangkap oleh Belanda.
    options:
      - Pada tahun 1830, beliau menangkap orang Belanda.
      - Pada tahun 1830, beliau ditangkap oleh Belanda.
      - Pada tahun 1830, beliau tinggal di Belanda.
    answer: 1
    meaning:
      ar_eg: سنة ١٨٣٠ الهولنديين قبضوا عليه.
      ar: في عام ١٨٣٠ قبض عليه الهولنديون.
      en: In 1830 he was captured by the Dutch.
    explain:
      ar_eg: ditangkap oleh Belanda = اتقبض عليه من الهولنديين. هو اللي اتمسك، مش هو اللي مسك.
      ar: ditangkap oleh Belanda أي قُبض عليه من قِبل الهولنديين؛ هو المقبوض عليه لا القابض.
      en: ditangkap oleh Belanda = captured by the Dutch. He was the one caught, not the catcher.
    words: [menangkap, beliau]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: ديبونيجورو حارب الهولنديين كام سنة؟
      ar: كم سنة حارب ديبونيغورو الهولنديين؟
      en: For how many years did Diponegoro fight the Dutch?
    options: ["Lima tahun.", "Dua puluh tahun.", "Satu tahun."]
    answer: 0
    explain:
      ar_eg: من ١٨٢٥ لحد ١٨٣٠ = خمس سنين.
      ar: من ١٨٢٥ إلى ١٨٣٠، أي خمس سنوات.
      en: From 1825 to 1830 = five years.
    words: [berjuang]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: ديبونيجورو اتوفّى فين؟
      ar: أين توفّي ديبونيغورو؟
      en: Where did Diponegoro die?
    options: [Yogyakarta, Jepara, Makassar]
    answer: 2
    words: [wafat]
  - id: e05
    type: match_pairs
    pairs:
      - text: berjuang
        ar_eg: يناضل، يحارب
        ar: يناضل
        en: to fight, struggle
      - text: penjajah
        ar_eg: مستعمر
        ar: مستعمر
        en: coloniser
      - text: ditangkap
        ar_eg: اتقبض عليه
        ar: قُبض عليه
        en: was captured
      - text: wafat
        ar_eg: اتوفّى
        ar: توفّي
        en: passed away
      - text: diangkat menjadi
        ar_eg: اتعيّن / اتسمّى
        ar: عُيّن، نال لقب
        en: was made, was named
    words: [berjuang, penjajah, menangkap, wafat]
  - id: e06
    type: multiple_choice
    question: Pada tahun 1973, beliau ___ menjadi pahlawan nasional.
    options: [mengangkat, diangkat, angkat]
    answer: 1
    explain:
      ar_eg: "هو ما عيّنش حد؛ هو اللي اتعيّن، فبنستعمل di-: diangkat."
      ar: "هو لم يعيّن أحدًا، بل عُيّن هو، لذلك نستعمل di-: diangkat."
      en: He didn't appoint anyone; he was the one named, so we use di-, diangkat.
    words: [pahlawan]
  - id: e07
    type: fill_blank
    sentence: Beliau ___ di Makassar pada tahun 1855.
    meaning:
      ar_eg: اتوفّى في ماكاسار سنة ١٨٥٥.
      ar: توفّي في ماكاسار عام ١٨٥٥.
      en: He passed away in Makassar in 1855.
    options: [wafat, lahir, berjuang]
    answers: [wafat]
    words: [wafat]
  - id: e08
    type: build_sentence
    source:
      ar_eg: حارب المستعمر الهولندي.
      ar: جاهد ضد المستعمر الهولندي.
      en: He fought against the Dutch colonisers.
    answer: Beliau berjuang melawan penjajah Belanda.
    distractors: [ditangkap, oleh]
    words: [berjuang, penjajah, beliau]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ديبونيجورو اتقبض عليه من الهولنديين سنة ١٨٣٠.
      ar: قبض الهولنديون على ديبونيغورو عام ١٨٣٠.
      en: Diponegoro was captured by the Dutch in 1830.
    answers:
      - Diponegoro ditangkap oleh Belanda pada tahun 1830.
      - Diponegoro ditangkap oleh Belanda pada tahun 1830
      - Diponegoro ditangkap Belanda pada tahun 1830.
      - Diponegoro ditangkap oleh Belanda tahun 1830.
      - Pada tahun 1830, Diponegoro ditangkap oleh Belanda.
      - Pada tahun 1830 Diponegoro ditangkap oleh Belanda.
      - Pangeran Diponegoro ditangkap oleh Belanda pada tahun 1830.
      - Diponegoro ditangkap oleh orang Belanda pada tahun 1830.
      - Diponegoro ditangkap oleh penjajah Belanda pada tahun 1830.
    words: [menangkap]
dialogue:
  title: Malam di Sade
  lines:
    - speaker: Mohamed
      text: Mas Rizal, saya membaca tentang Pangeran Diponegoro di buku ini.
      ar_eg: يا مَس ريزال، بقرا عن الأمير ديبونيجورو في الكتاب ده.
      ar: يا أخ ريزال، أقرأ عن الأمير ديبونيغورو في هذا الكتاب.
      en: Mas Rizal, I'm reading about Prince Diponegoro in this book.
    - speaker: Mas Rizal
      text: Beliau pahlawan dari Jawa. Beliau berjuang melawan Belanda selama lima tahun.
      ar_eg: ده بطل من جاوة. حارب الهولنديين خمس سنين.
      ar: إنه بطل من جاوة، جاهد ضد الهولنديين خمس سنوات.
      en: He's a hero from Java. He fought the Dutch for five years.
    - speaker: Mohamed
      text: Di sini tertulis, beliau ditangkap oleh Belanda pada tahun 1830.
      ar_eg: هنا مكتوب إن الهولنديين قبضوا عليه سنة ١٨٣٠.
      ar: مكتوب هنا أنّ الهولنديين قبضوا عليه عام ١٨٣٠.
      en: It says here he was captured by the Dutch in 1830.
    - speaker: Mas Rizal
      text: Betul. Beliau wafat jauh dari rumah, di Makassar.
      ar_eg: صح. واتوفّى بعيد عن بلده، في ماكاسار.
      ar: صحيح، وتوفّي بعيدًا عن وطنه، في ماكاسار.
      en: That's right. He died far from home, in Makassar.
    - speaker: Mohamed
      text: Sedih sekali. Tapi sekarang beliau dihormati sebagai pahlawan nasional.
      ar_eg: حاجة تزعّل أوي. بس دلوقتي الناس بتحترمه كبطل قومي.
      ar: هذا محزن جدًا، لكنّه اليوم يُكرَّم بطلًا قوميًّا.
      en: That's so sad. But now he's honoured as a national hero.
