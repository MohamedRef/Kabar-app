schema: kabar.lesson/v1
id: bipa3.u07.l06
language: id
title: Hari Pahlawan
can_do:
  ar_eg: 'تحكي عن معركة سورابايا ١٩٤٥: الانتصار والاستسلام والحرية والسلام.'
  ar: 'أن تحكي عن معركة سورابايا ١٩٤٥: النصر والاستسلام والحرية والسلام.'
  en: 'Tell the story of the 1945 Battle of Surabaya: victory, surrender, freedom and peace.'
slides:
  - title: 10 November
    body:
      ar_eg: |
        prajurit = عسكري، جندي. pertempuran = معركة (من tempur).
        merebut = ياخد بالعافية، يستولي على. mengalahkan = يغلب، يهزم. menyerah = يستسلم.
        kemenangan = انتصار، فوز (من menang). bebas = حر. perdamaian = سلام (من damai).
      ar: |
        prajurit = جندي. pertempuran = معركة (من tempur).
        merebut = يستولي على، ينتزع. mengalahkan = يهزم. menyerah = يستسلم.
        kemenangan = نصر، فوز (من menang). bebas = حرّ. perdamaian = سلام (من damai).
      en: |
        prajurit = soldier. pertempuran = battle (from tempur).
        merebut = seize, capture. mengalahkan = defeat. menyerah = surrender.
        kemenangan = victory (from menang). bebas = free. perdamaian = peace (from damai).
    examples:
      - text: Jepang menyerah pada bulan Agustus 1945.
        ar_eg: اليابان استسلمت في أغسطس ١٩٤٥.
        ar: استسلمت اليابان في أغسطس ١٩٤٥.
        en: Japan surrendered in August 1945.
      - text: Pemuda Surabaya merebut senjata dari tentara Jepang.
        ar_eg: شباب سورابايا خدوا السلاح من العساكر اليابانيين.
        ar: استولى شباب سورابايا على السلاح من الجنود اليابانيين.
        en: Surabaya's youth seized weapons from Japanese soldiers.
      - text: Pertempuran Surabaya dimulai pada 10 November 1945.
        ar_eg: معركة سورابايا بدأت يوم ١٠ نوفمبر ١٩٤٥.
        ar: بدأت معركة سورابايا في ١٠ نوفمبر ١٩٤٥.
        en: The Battle of Surabaya began on 10 November 1945.
