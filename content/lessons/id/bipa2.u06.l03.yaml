schema: kabar.lesson/v1
id: bipa2.u06.l03
language: id
title: Di sebelah warung
can_do:
  ar_eg: توصف الحاجات اللي حواليك فين بالظبط.
  ar: أن تصف أماكن الأشياء من حولك.
  en: Describe where things are around you.
slides:
  - title: Di seberang, di ujung
    body:
      ar_eg: |
        إنت عارف di atas، di bawah، di depan، di belakang، di sebelah. ودول كلمات مكان زيادة للشارع:
        - di seberang … = قصاد … (على الناحية التانية من الشارع)
        - di ujung … = في آخر … : di ujung gang = في آخر الحارة
        - di antara … dan … = بين … و…
        - dekat dengan … / jauh dari … = قريب من / بعيد عن
        والترتيب زي العربي: di + كلمة المكان + الحاجة.
      ar: |
        تعرف di atas وdi bawah وdi depan وdi belakang وdi sebelah. وهذه ظروف أخرى للشارع:
        - di seberang … = في الجهة المقابلة من …
        - di ujung … = في نهاية … : di ujung gang = في آخر الزقاق
        - di antara … dan … = بين … و…
        - dekat dengan … / jauh dari … = قريب من / بعيد عن
        والترتيب كالعربية: di + الظرف + الاسم.
      en: |
        You know di atas, di bawah, di depan, di belakang, di sebelah. Here are more for your street:
        - di seberang … = across from …
        - di ujung … = at the end of … : di ujung gang = at the end of the alley
        - di antara … dan … = between … and …
        - dekat dengan … / jauh dari … = near / far from
        Same order as Arabic: di + position + noun.
    grammar: id.location.words
    examples:
      - text: Apotek itu di seberang warung.
        ar_eg: الصيدلية دي قصاد الوارونج.
        ar: تلك الصيدلية مقابل المطعم الصغير.
        en: That pharmacy is across from the warung.
      - text: Kos saya di ujung gang.
        ar_eg: السكن بتاعي في آخر الحارة.
        ar: سكني في آخر الزقاق.
        en: My boarding house is at the end of the alley.
  - title: Ada sebuah warung
    body:
      ar_eg: |
        لما توصف شارعك بـ ada (فيه)، استعمل كلمات العدّ اللي اتعلمتها في السوق:
        - sebuah للمباني والحاجات: sebuah masjid، dua buah warung
        - seorang للناس: seorang tetangga = جار واحد
        - seekor للحيوانات: seekor anjing = كلب
        se- = واحد. وفي الكلام العادي ممكن يشيلوها، بس في الوصف بتبان أحلى.
      ar: |
        عند وصف شارعك بـ ada (يوجد) استعمل ألفاظ العدّ:
        - buah للمباني والأشياء: sebuah masjid، dua buah warung
        - orang للبشر: seorang tetangga = جار
        - ekor للحيوان: seekor anjing = كلب
        وse- = واحد. وقد تُحذف في الكلام اليومي، لكنها أجمل في الوصف.
      en: |
        When you describe your street with ada (there is), use the counters from the market:
        - buah for buildings and things: sebuah masjid, dua buah warung
        - orang for people: seorang tetangga = a neighbour
        - ekor for animals: seekor anjing = a dog
        se- = one. Casual speech may drop them, but they make a description sound good.
    grammar: id.classifier.basic
    examples:
      - text: Di jalan saya ada sebuah masjid dan dua buah warung.
        ar_eg: في شارعي فيه جامع ووارونجين.
        ar: في شارعي مسجد ومطعمان صغيران.
        en: On my street there's a mosque and two warungs.
      - text: Di depan pura ada seekor anjing.
        ar_eg: قدّام المعبد فيه كلب.
        ar: أمام المعبد كلب.
        en: There's a dog in front of the temple.
  - title: Anak-anak bermain di taman
    body:
      ar_eg: |
        حط الاتنين مع بعض وانت بتوصف: الحاجة + كلمة المكان، أو ada + العدد + الحاجة + المكان.
        - Warungnya di antara masjid dan apotek.
        - Di sebelah kos saya ada seorang tetangga yang ramah.
        - Anak-anak bermain di taman.
        pura = معبد هندوسي بالي، هتشوفه في كل شارع تقريبًا في سانور.
      ar: |
        اجمع الأمرين في الوصف: الشيء + الظرف، أو ada + العدد + الشيء + المكان.
        - Warungnya di antara masjid dan apotek.
        - Di sebelah kos saya ada seorang tetangga yang ramah.
        - Anak-anak bermain di taman.
        وpura = معبد هندوسي بالي، تراه في كل شارع تقريبًا في سانور.
      en: |
        Put both together when you describe: thing + position, or ada + number + thing + place.
        - Warungnya di antara masjid dan apotek.
        - Di sebelah kos saya ada seorang tetangga yang ramah.
        - Anak-anak bermain di taman.
        pura = a Balinese Hindu temple; you'll see one on almost every street in Sanur.
    grammar: id.location.words
    examples:
      - text: Anak-anak bermain di taman.
        ar_eg: العيال بيلعبوا في الجنينة.
        ar: الأطفال يلعبون في الحديقة.
        en: The children are playing in the park.
      - text: Di sebelah kos saya ada seorang tetangga yang ramah.
        ar_eg: جنب سكني فيه جار لطيف.
        ar: بجانب سكني جار لطيف.
        en: Next to my boarding house lives a friendly neighbour.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: di seberang
        ar_eg: قصاد
        ar: مقابل
        en: across from
      - text: di ujung
        ar_eg: في الآخر
        ar: في نهاية
        en: at the end of
      - text: gang
        ar_eg: حارة
        ar: زقاق
        en: alley
      - text: tetangga
        ar_eg: جار
        ar: جار
        en: neighbour
      - text: anjing
        ar_eg: كلب
        ar: كلب
        en: dog
      - text: lengkap
        ar_eg: كامل، فيه كل حاجة
        ar: كامل
        en: complete
    words: [seberang, ujung, gang, tetangga, anjing, lengkap]
  - id: e02
    type: multiple_choice
    question: Di depan rumah tetangga ada ___ anjing.
    options: [seekor, sebuah, seorang]
    answer: 0
    explain:
      ar_eg: الكلب حيوان، يبقى ekor.
      ar: الكلب حيوان فيُعدّ بـ ekor.
      en: A dog is an animal, so ekor.
    words: [seekor, anjing, tetangga]
  - id: e03
    type: listen
    text: Apotek itu di seberang warung.
    options: [Apotek itu di belakang warung., Apotek itu di sebelah warung., Apotek itu di seberang warung.]
    answer: 2
    words: [seberang]
  - id: e04
    type: fill_blank
    sentence: Rumah saya di ___ gang, rumah yang terakhir.
    meaning:
      ar_eg: بيتي في آخر الحارة، آخر بيت.
      ar: بيتي في آخر الزقاق، البيت الأخير.
      en: My house is at the end of the alley, the last house.
    options: [antara, seberang, ujung]
    answers: [ujung]
    words: [ujung, gang, terakhir]
    explain:
      ar_eg: ujung = آخر/طرف، وdi ujung gang = في آخر الحارة. antara = بين، وseberang = قصاد.
      ar: "ujung = نهاية: di ujung gang. أما antara فـ«بين» وseberang «مقابل»."
      en: "ujung = end: di ujung gang. antara is between, seberang opposite."
  - id: e05
    type: build_sentence
    source:
      ar_eg: جاري عنده كلب.
      ar: لدى جاري كلب.
      en: My neighbour has a dog.
    answer: Tetangga saya punya seekor anjing.
    distractors: [sebuah, seorang]
    words: [tetangga, anjing, ekor]
    explain:
      ar_eg: الكلب حيوان، فكلمة العدّ seekor. sebuah للحاجات، وseorang للناس.
      ar: الكلب حيوان فلفظه seekor. أما sebuah فللأشياء وseorang للناس.
      en: "A dog is an animal: seekor. sebuah is for things, seorang for people."
  - id: e06
    type: dictation
    text: Warung terakhir di ujung gang itu lengkap.
    meaning:
      ar_eg: آخر كشك في آخر الحارة فيه كل حاجة.
      ar: آخر دكان في نهاية الزقاق فيه كل شيء.
      en: The last shop at the end of the alley has everything.
    words: [ujung, gang, lengkap, terakhir]
  - id: e07
    type: speaking
    text: Kos saya di seberang warung. Warungnya lengkap!
    meaning:
      ar_eg: سكني قصاد الكشك. والكشك فيه كل حاجة!
      ar: سكني مقابل الدكان، والدكان فيه كل شيء!
      en: My boarding house is across from a shop. The shop has everything!
    words: [kos, seberang, lengkap]
  - id: e08
    type: multiple_choice
    question: Rumah saya rumah terakhir di gang ini.
    question_meaning:
      ar_eg: بيته فين؟
      ar: أين بيته؟
      en: Where is the house?
    options: [آخر بيت في الحارة, أول بيت في الحارة, في نص الحارة]
    answer: 0
    explain:
      ar_eg: terakhir = الأخير، وpertama = الأول.
      ar: terakhir = الأخير، وpertama = الأول.
      en: terakhir = last; pertama = first.
    words: [terakhir]
dialogue:
  title: Jalan di Sanur
  lines:
    - speaker: Raka
      text: Mohamed, kosmu di mana?
      ar_eg: يا محمد، سكنك فين؟
      ar: يا محمد، أين سكنك؟
      en: Mohamed, where's your place?
    - speaker: Mohamed
      text: Di Jalan Danau Tamblingan, di ujung gang.
      ar_eg: في شارع داناو تامبلينجان، في آخر الحارة.
      ar: في شارع داناو تامبلينغان، في آخر الزقاق.
      en: On Jalan Danau Tamblingan, at the end of the alley.
    - speaker: Raka
      text: Ada apa di dekat kosmu?
      ar_eg: إيه اللي جنب سكنك؟
      ar: ماذا يوجد قرب سكنك؟
      en: What's near your place?
    - speaker: Mohamed
      text: Ada sebuah warung. Di sebelah warung ada apotek, dan masjidnya di seberang apotek.
      ar_eg: فيه وارونج. جنب الوارونج فيه صيدلية، والجامع قصاد الصيدلية.
      ar: يوجد مطعم صغير، وبجانبه صيدلية، والمسجد مقابل الصيدلية.
      en: There's a warung. Next to the warung there's a pharmacy, and the mosque is across from the pharmacy.
    - speaker: Raka
      text: Wah, lengkap! Ada pantai juga?
      ar_eg: الله، كله موجود! والبحر كمان؟
      ar: رائع، كل شيء موجود! وهل يوجد شاطئ أيضًا؟
      en: Wow, it's got everything! Is there a beach too?
    - speaker: Mohamed
      text: Ada, dekat sekali. Tapi di depan pura ada seekor anjing besar. Hati-hati, ya!
      ar_eg: أيوه، قريب جدًّا. بس قدّام المعبد فيه كلب كبير. خلّي بالك!
      ar: نعم، قريب جدًّا. لكنّ أمام المعبد كلبًا كبيرًا، فانتبه!
      en: Yes, very close. But there's a big dog in front of the temple. Be careful!
