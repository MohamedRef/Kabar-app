schema: kabar.lesson/v1
id: bipa5.u06.l07
language: id
title: Musisi muda dari Palangka Raya
can_do:
  ar_eg: 'تعمل حوار مع موسيقي شاب: الجاز والباص والتأليف، الغُنا والاهتزاز، المنتج والخيال، والهوس بالمزيكا.'
  ar: 'أن تحاور موسيقيًا شابًا: الجاز والباص والتأليف، والغناء والاهتزاز، والمنتج والخيال، والهوس بالموسيقى.'
  en: 'Interview a young musician: jazz, bass and composition, singing and vibration, the producer, imagination and obsession.'
slides:
  - title: Dari sape ke jazz
    body:
      ar_eg: |
        jazz = جاز، bass = باص (gitar bass)، komposisi = تأليف موسيقي، قطعة (وكمان "تركيبة").
        nyanyian = غُنا، أغاني (nyanyian adat = غُنا تقليدي)، getaran = اهتزاز، ذبذبة (getaran senar = اهتزاز الوتر).
        produser = منتج، imajinasi = خيال.
        terobsesi = مهووس: terobsesi dengan musik = مهووس بالمزيكا.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: banget = sekali، bener = benar، aku = saya، aja = saja، emang = memang، pengin = ingin، ngerasain = merasakan.
      ar: |
        jazz = جاز، bass = الباص (gitar bass)، komposisi = تأليف موسيقي، مقطوعة (وأيضًا "تركيب").
        nyanyian = غناء، أغانٍ (nyanyian adat = غناء تقليدي)، getaran = اهتزاز، ذبذبة (getaran senar = اهتزاز الوتر).
        produser = منتج، imajinasi = خيال.
        terobsesi = مهووس: terobsesi dengan musik = مهووس بالموسيقى.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: banget = sekali، bener = benar، aku = saya، aja = saja، emang = memang، pengin = ingin، ngerasain = merasakan.
      en: |
        jazz = jazz, bass = bass (gitar bass), komposisi = composition (also "make-up, composition").
        nyanyian = singing, songs (nyanyian adat = traditional chant), getaran = vibration (getaran senar = string vibration).
        produser = producer, imajinasi = imagination.
        terobsesi = obsessed: terobsesi dengan musik = obsessed with music.
        The dialogue uses street forms; the formal ones are beside them: banget = sekali, bener = benar, aku = saya, aja = saja, emang = memang, pengin = ingin, ngerasain = merasakan.
    examples:
      - text: Komposisi barunya menggabungkan sape dan jazz.
        ar_eg: تأليفه الجديد بيجمع بين السابي والجاز.
        ar: تمزج مقطوعته الجديدة بين السابي والجاز.
        en: His new composition blends sape and jazz.
      - text: Saya bisa merasakan getaran bass di dada.
        ar_eg: أنا حاسس باهتزاز الباص في صدري.
        ar: أشعر باهتزاز الباص في صدري.
        en: I can feel the bass vibrating in my chest.
      - text: Sejak kecil dia terobsesi dengan nyanyian neneknya.
        ar_eg: من وهو صغير وهو مهووس بغُنا جدته.
        ar: منذ صغره وهو مهووس بغناء جدّته.
        en: Since childhood he's been obsessed with his grandmother's songs.
