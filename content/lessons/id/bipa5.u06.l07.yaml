    answers_meaning:
      ar_eg: [تأليفه الجديد بيجمع بين غُنا الداياك والجاز, المقطوعة الجديدة بتاعته فيها غُنا داياك وجاز]
      ar: [تجمع مقطوعته الجديدة بين غناء الداياك والجاز, تمزج مقطوعتها الجديدة غناء الداياك بالجاز]
