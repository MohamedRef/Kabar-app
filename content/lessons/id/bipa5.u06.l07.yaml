    meaning:
      ar_eg: المنتج ده مهووس باهتزاز السابي.
      ar: ذلك المنتج مهووس باهتزاز السابي.
      en: That producer is obsessed with the sape's vibration.
    words: [produser, terobsesi, getaran]
dialogue:
  lines:
    - speaker: Mohamed
      text: Musikmu unik banget. Itu sape campur jazz, ya?
      ar_eg: المزيكا بتاعتك مميزة جدًا. ده سابي وجاز، صح؟
      ar: موسيقاك فريدة جدًا. إنها سابي وجاز، أليس كذلك؟
      en: Your music is so unique. That's sape and jazz, right?
    - speaker: Musisi
      text: Bener. Aku terobsesi sama sape dari kecil, tapi aku juga main bass.
      ar_eg: مظبوط. أنا مهووس بالسابي من وأنا صغير، بس بعزف باص كمان.
      ar: صحيح. أنا مهووس بالسابي منذ صغري، لكني أعزف الباص أيضًا.
      en: Right. I've been obsessed with the sape since I was little, but I also play bass.
    - speaker: Mohamed
      text: Ide komposisi ini dari mana, sih?
      ar_eg: فكرة المقطوعة دي جت منين؟
      ar: من أين جاءت فكرة هذه المقطوعة؟
      en: Where did the idea for this piece come from?
    - speaker: Musisi
      text: Dari nyanyian nenekku. Sisanya imajinasi aja.
      ar_eg: من غُنا جدتي. والباقي خيال.
      ar: من غناء جدّتي، والباقي خيال.
      en: From my grandmother's songs. The rest is imagination.
    - speaker: Mohamed
      text: Getaran bass-nya kerasa banget di dada!
      ar_eg: أنا حاسس باهتزاز الباص في صدري!
      ar: أشعر باهتزاز الباص في صدري!
      en: I can feel the bass in my chest!
    - speaker: Musisi
      text: Emang itu tujuannya. Produserku pengin orang ngerasain sungai.
      ar_eg: ده المقصود. المنتج بتاعي عايز الناس تحس بالنهر.
      ar: هذا هو الهدف. يريد منتجي أن يشعر الناس بالنهر.
      en: That's the point. My producer wants people to feel the river.
