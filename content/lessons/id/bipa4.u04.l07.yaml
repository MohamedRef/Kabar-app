  - id: e03
    type: listen
    text: Tragedi kapal itu terjadi tahun lalu.
    question:
      ar_eg: إيه اللي حصل السنة اللي فاتت؟
      ar: ماذا حدث العام الماضي؟
      en: What happened last year?
    options: [مأساة, حفلة, إعلان]
    answer: 0
    meaning:
      ar_eg: مأساة المركب دي حصلت السنة اللي فاتت.
      ar: وقعت مأساة تلك السفينة العام الماضي.
      en: That ship tragedy happened last year.
    words: [tragedi]
  - id: e04
    type: fill_blank
    sentence: Polisi masih ___ kecelakaan itu.
    meaning:
      ar_eg: البوليس لسه ___ الحادثة دي.
      ar: ما زالت الشرطة ___ ذلك الحادث.
      en: The police are still ___ the accident.
    options: [menyelidiki, terungkap, blog]
    answers: [menyelidiki]
    words: [menyelidiki, terungkap, blog]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: صحفية بتكتب يومياتها على الإنترنت. ده إيه؟
      ar: صحفية تكتب يومياتها على الإنترنت. ما هذا؟
      en: A journalist writes her diary online. What is it?
    options: [blog, korupsi, insiden]
    answer: 0
    explain:
      ar_eg: blog = مدوّنة على الإنترنت.
      ar: blog = مدوّنة إلكترونية.
      en: blog = an online diary.
    words: [blog, korupsi, insiden]
  - id: e06
    type: fill_blank
    sentence: Setelah lima tahun, rahasia itu akhirnya ___.
    meaning:
      ar_eg: بعد خمس سنين، السر ده أخيرًا ___.
      ar: بعد خمس سنوات ___ ذلك السرّ أخيرًا.
      en: After five years, the secret was finally ___.
    options: [terungkap, menyelidiki, website]
    answers: [terungkap]
    words: [terungkap, menyelidiki, website]
  - id: e07
    type: multiple_choice
    question: Pejabat itu mengambil uang rakyat. Itu namanya ___.
    options: [tragedi, investigasi, korupsi]
    answer: 2
    explain:
      ar_eg: korupsi = فساد.
      ar: korupsi = فساد.
      en: korupsi = corruption.
    words: [tragedi, investigasi, korupsi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: التحقيق بتاعها كشف قضية فساد كبيرة.
      ar: كشف تحقيقها قضية فساد كبيرة.
      en: Her investigation uncovered a big corruption case.
    answer: Investigasinya membongkar kasus korupsi besar.
    distractors: [insiden, tragedi]
    words: [investigasi, korupsi, insiden, tragedi]
  - id: e09
    type: translate
    direction: from_target
    source_text: Berita insiden itu dimuat di website dan blog.
    answers_meaning:
      ar_eg: [خبر الحادثة دي اتنشر على الموقع والمدوّنة, خبر الحادثة نزل على المواقع والبلوجات]
      ar: [نُشر خبر تلك الحادثة على الموقع والمدوّنة, ظهر خبر الحادثة على موقع إلكتروني ومدوّنة]
      en: [News of the incident was published on the website and the blog, The incident story appeared on a website and a blog]
    words: [insiden, website, blog]
  - id: e10
    type: speaking
    text: Investigasi ini menyelidiki korupsi di kantor pelabuhan.
    meaning:
      ar_eg: التحقيق ده بيدوّر في الفساد في مكتب الميناء.
      ar: يبحث هذا التحقيق في الفساد بمكتب الميناء.
      en: This investigation looks into corruption at the port office.
    words: [investigasi, menyelidiki, korupsi, terungkap, website]
dialogue:
  lines:
    - speaker: Kak Nirmala
      text: Mohamed, artikel investigasi saya sudah ada di website!
      ar_eg: يا محمد، مقال التحقيق بتاعي نزل على الموقع!
      ar: يا محمد، نُشر مقال تحقيقي على الموقع!
      en: Mohamed, my investigative article is up on the website!
    - speaker: Mohamed
      text: Selamat! Tentang insiden di pelabuhan itu?
      ar_eg: مبروك! عن الحادثة اللي في الميناء؟
      ar: مبارك! عن حادثة الميناء تلك؟
      en: Congratulations! About that incident at the port?
    - speaker: Kak Nirmala
      text: Ya. Saya menyelidiki selama tiga bulan. Ternyata ada korupsi.
      ar_eg: أيوه. حققت تلات شهور. وطلع فيه فساد.
      ar: نعم. حقّقت ثلاثة أشهر، فتبيّن أن هناك فسادًا.
      en: Yes. I investigated for three months. It turned out there was corruption.
    - speaker: Mohamed
      text: Wah, akhirnya semuanya terungkap. Kasihan keluarga mereka yang kena tragedi itu.
      ar_eg: يا خبر، كل حاجة اتكشفت أخيرًا. صعبانين عليّ أهالي اللي حصلتلهم المأساة دي.
      ar: يا للعجب! انكشف كل شيء أخيرًا. مساكين أهالي من أصابتهم تلك المأساة.
      en: Wow, it's all come out at last. I feel for the families of the tragedy's victims.
    - speaker: Kak Nirmala
      text: Betul. Saya juga menulis cerita mereka di blog saya.
      ar_eg: صح. وأنا كمان كتبت حكايتهم على المدوّنة بتاعتي.
      ar: صحيح. وكتبت قصتهم أيضًا في مدوّنتي.
      en: True. I also wrote their story on my blog.
