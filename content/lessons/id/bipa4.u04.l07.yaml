schema: kabar.lesson/v1
id: bipa4.u04.l07
language: id
title: Komentar pembaca
can_do:
  ar_eg: تقرا تعليقات القرّاء على خبر وتعرف مين مؤيد ومين معارض وليه.
  ar: أن تقرأ تعليقات القرّاء على خبر وتميّز المؤيد من المعارض وحججهما.
  en: Read readers' comments on a news story and tell who is for, who is against, and why.
slides:
  - title: Komentar di bawah berita
    body:
      ar_eg: |
        تحت خبر «مدارس باريباري بتمنع الموبايل» كتب ٣ قرّاء تعليقات.
        كل واحد رأيه إيه؟ مؤيد (mendukung) ولا معارض (menolak) ولا شايف الناحيتين؟
      ar: |
        كتب ثلاثة قرّاء تعليقات تحت خبر «مدارس باريباري تمنع الهواتف».
        ما رأي كلٍّ منهم؟ مؤيد (mendukung) أم معارض (menolak) أم يرى الجانبين؟
      en: |
        Under the story "Parepare schools ban phones", three readers left comments.
        What does each think? For (mendukung), against (menolak), or seeing both sides?
    examples:
      - text: "Rahma: Saya mendukung kebijakan ini. Sejak HP dilarang, anak saya lebih fokus belajar."
        ar_eg: "رحمة: أنا مؤيدة القرار ده. من ساعة ما منعوا الموبايل، ابني بقى مركّز أكتر في المذاكرة."
        ar: "رحمة: أؤيد هذه السياسة. منذ مُنع الهاتف صار ابني أكثر تركيزًا في الدراسة."
        en: "Rahma: I support this policy. Since phones were banned, my child focuses more on studying."
      - text: "Ilham: Saya menolak. Gara-gara tidak membawa HP, anak saya tidak bisa menghubungi saya waktu pulang terlambat."
        ar_eg: "إلهام: أنا معترض. بسبب إن ابني مش معاه موبايل، ماقدرش يكلمني لما اتأخر في الرجوع."
        ar: "إلهام: أنا أرفض. لأن ابني لا يحمل هاتفًا، لم يستطع الاتصال بي حين تأخّر في العودة."
        en: "Ilham: I'm against it. Because he had no phone, my son couldn't contact me when he came home late."
      - text: "Pak Yusuf: Di satu sisi, siswa lebih fokus. Di sisi lain, sekolah harus membantu orang tua menghubungi anaknya."
        ar_eg: "الأستاذ يوسف: من ناحية، الطلبة بقوا مركّزين أكتر. ومن ناحية تانية، المدرسة لازم تساعد الأهالي يكلّموا ولادهم."
        ar: "الأستاذ يوسف: من جهة، صار الطلاب أكثر تركيزًا. ومن جهة أخرى، على المدرسة أن تساعد الأهل على الاتصال بأبنائهم."
        en: "Pak Yusuf: On the one hand, students focus more. On the other hand, the school must help parents contact their children."
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي مؤيد القرار؟
      ar: من يؤيد السياسة؟
      en: Who supports the policy?
    options: [Rahma, Ilham, Pak Yusuf]
    answer: 0
    explain:
      ar_eg: Rahma كتبت «Saya mendukung». Pak Yusuf شايف الناحيتين، وIlham معترض.
      ar: كتبت Rahma «Saya mendukung»، أما Pak Yusuf فيرى الجانبين، وIlham يرفض.
      en: Rahma wrote "Saya mendukung"; Pak Yusuf sees both sides, and Ilham is against.
    words: [mendukung]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: Ilham معترض ليه؟
      ar: لماذا يرفض Ilham؟
      en: Why is Ilham against it?
    options:
      - Anaknya tidak fokus belajar.
      - HP anaknya hilang di sekolah.
      - Anaknya tidak bisa menghubunginya.
    answer: 2
    words: [menolak]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الأستاذ يوسف بيقترح إيه؟
      ar: ماذا يقترح الأستاذ يوسف؟
      en: What does Pak Yusuf suggest?
    options:
      - Siswa boleh membawa HP ke kelas.
      - Sekolah harus membantu orang tua menghubungi anaknya.
      - Kebijakan itu harus dibatalkan.
    answer: 1
    words: [kekurangan]
  - id: e04
    type: match_pairs
    pairs:
      - text: mendukung
        ar_eg: يؤيّد
        ar: يؤيّد
        en: support
      - text: menolak
        ar_eg: يعترض / يرفض
        ar: يرفض
        en: reject, oppose
      - text: kelebihan
        ar_eg: ميزة
        ar: ميزة
        en: advantage
      - text: kekurangan
        ar_eg: عيب
        ar: عيب
        en: drawback
      - text: dampak
        ar_eg: تأثير
        ar: أثر
        en: impact
    words: [mendukung, menolak, kelebihan, kekurangan, dampak]
  - id: e05
    type: listen
    text: Di satu sisi, siswa lebih fokus.
    options:
      - Di sisi lain, siswa lebih fokus.
      - Di satu sisi, siswa lebih fokus.
      - Di satu sisi, siswa kurang fokus.
    answer: 1
    meaning:
      ar_eg: من ناحية، الطلبة بقوا مركّزين أكتر.
      ar: من جهة، صار الطلاب أكثر تركيزًا.
      en: On the one hand, students focus more.
  - id: e06
    type: fill_blank
    sentence: ___ tidak membawa HP, anak saya tidak bisa menghubungi saya.
    meaning:
      ar_eg: بسبب إن ابني مش معاه موبايل، ماقدرش يكلمني.
      ar: لأن ابني لا يحمل هاتفًا، لم يستطع الاتصال بي.
      en: Because he had no phone, my son couldn't contact me.
    options: [Berkat, Gara-gara, Akibatnya]
    answers: [Gara-gara]
    explain:
      ar_eg: السبب هنا وحش، فـ gara-gara (عامية) مناسبة. berkat للسبب الحلو بس.
      ar: السبب هنا سلبي فتناسبه gara-gara (عامية)، أما berkat فللسبب الإيجابي.
      en: The cause is a bad one, so gara-gara (casual) fits; berkat is only for good causes.
    words: [gara-gara]
  - id: e07
    type: build_sentence
    source:
      ar_eg: ومن ناحية تانية، الأهالي صعب عليهم يكلّموا ولادهم.
      ar: ومن جهة أخرى، يصعب على الأهل الاتصال بأبنائهم.
      en: On the other hand, parents find it hard to contact their children.
    answer: Di sisi lain, orang tua sulit menghubungi anaknya.
    distractors: [satu, mendukung]
    words: [kekurangan]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا مؤيد السياسة دي عشان الطلبة بيركّزوا أكتر.
      ar: أؤيد هذه السياسة لأن الطلاب يركّزون أكثر.
      en: I support this policy because students focus more.
    answers:
      - Saya mendukung kebijakan ini karena siswa lebih fokus.
      - Saya mendukung kebijakan ini karena siswa jadi lebih fokus.
      - Saya mendukung kebijakan ini karena para siswa lebih fokus.
      - Saya mendukung kebijakan ini sebab siswa lebih fokus.
      - Saya mendukung kebijakan ini karena siswa menjadi lebih fokus.
      - Aku mendukung kebijakan ini karena siswa lebih fokus.
    words: [mendukung]
  - id: e09
    type: speaking
    text: Menurut saya, kebijakan ini punya kelebihan dan kekurangan.
    meaning:
      ar_eg: في رأيي، السياسة دي ليها مميزات وعيوب.
      ar: في رأيي، لهذه السياسة مزايا وعيوب.
      en: In my opinion, this policy has advantages and drawbacks.
    words: [kelebihan, kekurangan]
dialogue:
  title: Membaca komentar
  lines:
    - speaker: Kak Ayu
      text: Berita tentang HP di sekolah dapat banyak komentar pembaca.
      ar_eg: خبر الموبايلات في المدارس جاله تعليقات كتير من القرّاء.
      ar: تلقّى خبر الهواتف في المدارس تعليقات كثيرة من القرّاء.
      en: The story about phones at school got lots of reader comments.
    - speaker: Mohamed
      text: Iya, Kak. Ada yang mendukung, ada yang menolak.
      ar_eg: أيوه. فيه ناس مؤيدة وناس معترضة.
      ar: نعم. منهم المؤيد ومنهم الرافض.
      en: Yes. Some support it, some are against it.
    - speaker: Kak Ayu
      text: Menurutmu, komentar mana yang paling bagus?
      ar_eg: في رأيك، أنهي تعليق أحسن واحد؟
      ar: في رأيك، أيّ تعليق هو الأفضل؟
      en: Which comment do you think is the best?
    - speaker: Mohamed
      text: Komentar Pak Yusuf. Dia melihat kelebihan dan kekurangannya.
      ar_eg: تعليق الأستاذ يوسف. هو شايف المميزات والعيوب.
      ar: تعليق الأستاذ يوسف، فهو ينظر إلى المزايا والعيوب.
      en: Pak Yusuf's. He looks at the advantages and the drawbacks.
    - speaker: Kak Ayu
      text: Setuju. Pembaca yang baik melihat dua sisi.
      ar_eg: موافقة. القارئ الشاطر بيشوف الناحيتين.
      ar: أوافق. القارئ الجيد ينظر إلى الجانبين.
      en: Agreed. A good reader looks at both sides.
new_words: []
review:
