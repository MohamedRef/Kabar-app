schema: kabar.lesson/v1
id: bipa4.u04.l07
language: id
title: Investigasi wartawan
can_do:
  ar_eg: تحكي إزاي صحفي حقق في حادثة وكشف فساد ونشر القصة.
  ar: أن تروي كيف حقّق صحفي في حادثة وكشف فسادًا ونشر القصة.
  en: Tell how a journalist investigated an incident, uncovered corruption and published the story.
slides:
  - title: Dari insiden ke skandal
    body:
      ar_eg: |
        investigasi = تحقيق صحفي، menyelidiki = يحقق في حاجة، terungkap = اتكشف (kebenaran terungkap).
        korupsi = فساد، insiden = حادثة، tragedi = مأساة.
        website = موقع إنترنت، blog = مدوّنة.
      ar: |
        investigasi = تحقيق صحفي، menyelidiki = يحقّق في أمر، terungkap = انكشف (kebenaran terungkap).
        korupsi = فساد، insiden = حادثة، tragedi = مأساة.
        website = موقع إلكتروني، blog = مدوّنة.
      en: |
        investigasi = investigation, menyelidiki = to investigate, terungkap = revealed, uncovered (kebenaran terungkap).
        korupsi = corruption, insiden = incident, tragedi = tragedy.
        website = website, blog = blog.
    examples:
      - text: Wartawan itu menyelidiki insiden di pelabuhan.
        ar_eg: الصحفي ده بيحقق في الحادثة اللي في الميناء.
        ar: يحقّق ذلك الصحفي في حادثة الميناء.
        en: That journalist is investigating the incident at the port.
      - text: Akhirnya kasus korupsi itu terungkap.
        ar_eg: في الآخر قضية الفساد دي اتكشفت.
        ar: انكشفت قضية الفساد تلك أخيرًا.
        en: In the end, the corruption case came to light.
      - text: Investigasinya dimuat di website koran.
        ar_eg: التحقيق بتاعه اتنشر على موقع الجرنان.
        ar: نُشر تحقيقه على موقع الصحيفة.
        en: His investigation was published on the paper's website.
