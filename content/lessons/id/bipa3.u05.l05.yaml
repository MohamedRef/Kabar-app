schema: kabar.lesson/v1
id: bipa3.u05.l05
language: id
title: Mampir dan beristirahat
can_do:
  ar_eg: 'تحكي يوم مشغول: تخلّص ورق، تجهّز للرحلة، تعدّي على حد، وترتاح في الآخر.'
  ar: 'أن تحكي يومًا مزدحمًا: تنهي الأوراق، وتستعد للرحلة، وتمرّ على أحد، ثم ترتاح.'
  en: 'Recount a busy day: sort out paperwork, get ready for a trip, drop in on someone, then rest.'
slides:
  - title: Hari yang sibuk
    body:
      ar_eg: |
        mengurus = يخلّص (ورق)، ياخد باله من: mengurus izin = يطلّع تصريح.
        mengerjakan = يعمل (شغل، واجب)، menyelesaikan = يخلّص، ينهي.
        menyiapkan = يجهّز، persiapan = تجهيز، استعداد.
        mampir = يعدّي على (زيارة قصيرة). seharian = طول اليوم. beristirahat = يرتاح.
      ar: |
        mengurus = يتولّى، ينجز (الأوراق): mengurus izin = يستخرج تصريحًا.
        mengerjakan = يعمل على (عمل، واجب)، menyelesaikan = يُنهي.
        menyiapkan = يُعِدّ، persiapan = استعداد، تحضير.
        mampir = يمرّ على (زيارة قصيرة). seharian = طوال اليوم. beristirahat = يستريح.
      en: |
        mengurus = take care of, sort out: mengurus izin = get a permit.
        mengerjakan = work on, do (a task), menyelesaikan = finish, complete.
        menyiapkan = prepare, persiapan = preparation.
        mampir = drop in, stop by. seharian = all day. beristirahat = rest.
    examples:
      - text: Pagi ini saya mengurus izin mendaki.
        ar_eg: الصبح ده طلّعت تصريح الطلوع.
        ar: هذا الصباح استخرجت تصريح التسلّق.
        en: This morning I sorted out the climbing permit.
      - text: Setelah menyelesaikan pekerjaan, saya mampir ke warung.
        ar_eg: بعد ما خلّصت الشغل، عدّيت على الوارونج.
        ar: بعد أن أنهيت العمل مررت بالمطعم الشعبي.
        en: After finishing work, I stopped by the warung.
      - text: Kami beristirahat seharian sebelum mendaki.
        ar_eg: ارتحنا طول اليوم قبل الطلوع.
        ar: استرحنا طوال اليوم قبل التسلّق.
        en: We rested all day before the climb.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mengurus
        ar_eg: يخلّص (ورق)
        ar: يتولّى، ينجز
        en: sort out
      - text: mengerjakan
        ar_eg: يعمل (شغل)
        ar: يعمل على
        en: work on
      - text: menyelesaikan
        ar_eg: يخلّص، ينهي
        ar: يُنهي
        en: finish
      - text: menyiapkan
        ar_eg: يجهّز
        ar: يُعِدّ
        en: prepare
    words: [mengurus, mengerjakan, menyelesaikan, menyiapkan]
  - id: e02
    type: match_pairs
    pairs:
      - text: persiapan
        ar_eg: تجهيز
        ar: استعداد
        en: preparation
      - text: mampir
        ar_eg: يعدّي على
        ar: يمرّ على
        en: drop in
      - text: seharian
        ar_eg: طول اليوم
        ar: طوال اليوم
        en: all day
      - text: beristirahat
        ar_eg: يرتاح
        ar: يستريح
        en: rest
    words: [persiapan, mampir, seharian, beristirahat]
  - id: e03
    type: listen
    text: Nanti sore saya mampir ke rumahmu sebentar, ya.
    question:
      ar_eg: هيعمل إيه؟
      ar: ماذا سيفعل؟
      en: What will he do?
    options: [هيعدّي عليه شوية, هينام عنده, هيكلمه في التليفون]
    answer: 0
    meaning:
      ar_eg: العصر هعدّي عليك شوية.
      ar: سأمرّ ببيتك قليلًا بعد العصر.
      en: I'll drop by your place for a bit this afternoon.
    words: [mampir]
  - id: e04
    type: fill_blank
    sentence: Saya harus ___ tugas ini sebelum hari Jumat.
    meaning:
      ar_eg: لازم ___ المهمة دي قبل الجمعة.
      ar: يجب أن ___ هذه المهمة قبل الجمعة.
      en: I have to ___ this task before Friday.
    options: [seharian, menyelesaikan, persiapan]
    answers: [menyelesaikan]
    words: [menyelesaikan, seharian, persiapan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كلمة معناها «طول اليوم»؟
      ar: أي كلمة تعني «طوال اليوم»؟
      en: Which word means 'all day'?
    options: [mampir, mengurus, seharian]
    answer: 2
    explain:
      ar_eg: seharian = طول اليوم (se- + hari + -an).
      ar: seharian = طوال اليوم (se- + hari + -an).
      en: seharian = all day (se- + hari + -an).
    words: [seharian, mampir, mengurus]
  - id: e06
    type: fill_blank
    sentence: Ibu sedang ___ makan malam di dapur.
    meaning:
      ar_eg: ماما بتـ ___ العشا في المطبخ.
      ar: أمي ___ العشاء في المطبخ.
      en: Mum is ___ dinner in the kitchen.
    options: [menyiapkan, beristirahat, mengerjakan]
    answers: [menyiapkan]
    words: [menyiapkan, beristirahat, mengerjakan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: أخويا بيعمل الواجب في أوضته.
      ar: أخي يحلّ واجبه في غرفته.
      en: My brother is doing his homework in his room.
    answer: Adik saya mengerjakan PR di kamarnya.
    distractors: [mampir, persiapan]
    words: [mengerjakan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Persiapan untuk mendaki Rinjani sudah selesai.
    answers_meaning:
      ar_eg: [التجهيز لطلوع رينجاني خلص, خلّصنا التجهيز لطلوع جبل رينجاني]
      ar: [انتهى الاستعداد لتسلّق رينجاني, اكتمل التحضير لصعود رينجاني]
      en: [The preparations for climbing Rinjani are done, Preparation for the Rinjani climb is finished]
    words: [persiapan]
  - id: e09
    type: speaking
    text: Setelah menyelesaikan semuanya, saya mau beristirahat seharian.
    meaning:
      ar_eg: بعد ما أخلّص كل حاجة، عايز أرتاح طول اليوم.
      ar: بعد أن أُنهي كل شيء، أريد أن أستريح طوال اليوم.
      en: After finishing everything, I want to rest all day.
    words: [menyelesaikan, beristirahat, seharian]
  - id: e10
    type: multiple_choice
    question: Saya menyiapkan tas, dan Pak Sahdan ___ izin untuk mendaki.
    options: [beristirahat, mengurus, persiapan]
    answer: 1
    explain:
      ar_eg: mengurus izin = يطلّع تصريح.
      ar: mengurus izin = يستخرج تصريحًا.
      en: mengurus izin = sort out a permit.
    words: [mengurus, beristirahat, persiapan, menyiapkan]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kamu sibuk hari ini?
      ar_eg: يا محمد، إنت مشغول النهارده؟
      ar: يا محمد، هل أنت مشغول اليوم؟
      en: Mohamed, are you busy today?
    - speaker: Mohamed
      text: Ya, seharian. Pagi saya mengurus izin mendaki, lalu menyiapkan tas.
      ar_eg: أيوه، طول اليوم. الصبح خلّصت تصريح الطلوع، وبعدين جهّزت الشنطة.
      ar: نعم، طوال اليوم. صباحًا استخرجت تصريح التسلّق ثم جهّزت الحقيبة.
      en: Yes, all day. This morning I got the climbing permit, then packed my bag.
    - speaker: Rina
      text: Persiapanmu sudah selesai?
      ar_eg: خلّصت تجهيزاتك؟
      ar: هل انتهت استعداداتك؟
      en: Are your preparations done?
    - speaker: Mohamed
      text: Hampir. Saya masih mengerjakan tugas kantor sedikit.
      ar_eg: تقريبًا. لسه بعمل شوية شغل للمكتب.
      ar: تقريبًا. ما زلت أعمل على بعض مهام المكتب.
      en: Almost. I'm still doing a bit of office work.
    - speaker: Rina
      text: Nanti malam mampir ke warung, ya. Lalu beristirahat!
      ar_eg: بالليل عدّي على الوارونج. وبعدين ارتاح!
      ar: مُرّ بالمطعم مساءً، ثم استرح!
      en: Drop by the warung tonight. Then get some rest!
