schema: kabar.lesson/v1
id: bipa4.u09.l04
language: id
title: Eksposisi lingkungan
can_do:
  ar_eg: تكتب مقال إكسبوزيسي قصير عن قانون بيئي بأسباب ونتايج وحل.
  ar: أن تكتب نصًا عرضيًا قصيرًا عن قانون بيئي يتضمن أسبابًا ونتائج وحلًا.
  en: Write a short exposition on an environmental rule, with causes, effects and a solution.
slides:
  - title: Tesis, sebab-akibat, solusi
    body:
      ar_eg: |
        مقالك عن البيئة يمشي كده:
        الرأي: Saya berpendapat bahwa … wajib … (wajib = واجب، من العربي «واجب»).
        الحجج بروابط السبب والنتيجة: karena، sehingga، Akibatnya, …
        الحل: Solusinya, … / Oleh karena itu, kesadaran warga harus ditingkatkan (kesadaran = الوعي).
      ar: |
        يسير مقالك عن البيئة هكذا:
        الرأي: Saya berpendapat bahwa … wajib … (wajib = واجب، من العربية «واجب»).
        الحجج بروابط السبب والنتيجة: karena، sehingga، Akibatnya, …
        الحل: Solusinya, … / Oleh karena itu, kesadaran warga harus ditingkatkan (kesadaran = الوعي).
      en: |
        Your environmental essay runs like this:
        Thesis: Saya berpendapat bahwa … wajib … (wajib = compulsory, from Arabic «واجب»).
        Arguments with cause-effect links: karena, sehingga, Akibatnya, …
        Solution: Solusinya, … / Oleh karena itu, kesadaran warga harus ditingkatkan (kesadaran = awareness).
    grammar: id.conjunction.cause-effect
    examples:
      - text: Saya berpendapat bahwa larangan kantong plastik wajib diterapkan di semua kota.
        ar_eg: رأيي إن منع الأكياس البلاستيك لازم يتطبّق في كل المدن.
        ar: أرى أنّ حظر الأكياس البلاستيكية يجب أن يُطبَّق في كل المدن.
        en: I believe the plastic-bag ban must be applied in every city.
      - text: Oleh karena itu, kesadaran warga harus ditingkatkan.
        ar_eg: عشان كده، لازم وعي الناس يزيد.
        ar: لذلك يجب رفع وعي السكان.
        en: Therefore, residents' awareness must be raised.
exercises:
  - id: e01
    type: listen
    text: Kesadaran warga tentang sampah plastik masih rendah.
    options: ["Kesadaran warga tentang sampah plastik sudah tinggi.", "Kesadaran warga tentang sampah plastik masih rendah.", "Kesadaran wisatawan tentang sampah plastik masih rendah."]
    answer: 1
    meaning:
      ar_eg: وعي الناس بزبالة البلاستيك لسه قليل.
      ar: ما زال وعي السكان بنفايات البلاستيك منخفضًا.
      en: Residents' awareness of plastic waste is still low.
    words: [kesadaran]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة تنفع حل في آخر المقال؟
      ar: أيّ جملة تصلح حلًا في آخر المقال؟
      en: Which sentence works as the solution at the end of the essay?
    options: ["Solusinya, kita membawa tas belanja sendiri.", "Solusinya, kita membeli lebih banyak kantong plastik.", "Solusinya, kita membuang sampah ke laut."]
    answer: 0
    words: [solusi]
  - id: e03
    type: match_pairs
    pairs:
      - text: kesadaran
        ar_eg: وعي
        ar: وعي
        en: awareness
      - text: wajib
        ar_eg: واجب / إجباري
        ar: واجب، إلزامي
        en: compulsory
      - text: solusi
        ar_eg: حل
        ar: حل
        en: solution
      - text: kebijakan
        ar_eg: سياسة
        ar: سياسة
        en: policy
      - text: menerapkan
        ar_eg: يطبّق
        ar: يطبّق
        en: to implement
    words: [kesadaran, wajib, solusi, kebijakan, menerapkan]
  - id: e04
    type: fill_blank
    sentence: Setiap toko ___ menerapkan larangan ini.
    meaning:
      ar_eg: كل محل لازم يطبّق المنع ده.
      ar: يجب على كل متجر أن يطبّق هذا الحظر.
      en: Every shop must apply this ban.
    options: [solusi, wajib, kesadaran]
    answers: [wajib]
    words: [wajib, menerapkan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: عشان كده، لازم وعي الناس يزيد.
      ar: لذلك يجب رفع وعي السكان.
      en: Therefore, residents' awareness must be raised.
    answer: Oleh karena itu, kesadaran warga harus ditingkatkan.
    distractors: [berkat, meningkatkan]
    words: [kesadaran]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أحسن حل إننا نقلّل البلاستيك اللي بيتستعمل مرة واحدة.
      ar: أفضل حل هو تقليل البلاستيك أحادي الاستخدام.
      en: The best solution is to reduce single-use plastic.
    answers:
      - Solusi terbaik adalah mengurangi plastik sekali pakai.
      - Solusi terbaik adalah mengurangi plastik sekali pakai
      - Solusi yang terbaik adalah mengurangi plastik sekali pakai.
      - Solusi terbaik ialah mengurangi plastik sekali pakai.
      - Solusi terbaik adalah mengurangi penggunaan plastik sekali pakai.
      - Solusi paling baik adalah mengurangi plastik sekali pakai.
    words: [solusi, sekali pakai]
  - id: e07
    type: dictation
    text: Larangan ini wajib diterapkan di semua kota.
    meaning:
      ar_eg: المنع ده لازم يتطبّق في كل المدن.
      ar: يجب تطبيق هذا الحظر في كل المدن.
      en: This ban must be applied in every city.
    words: [wajib, larangan]
  - id: e08
    type: speaking
    text: Saya berpendapat bahwa kesadaran warga adalah solusi terbaik.
    meaning:
      ar_eg: رأيي إن وعي الناس هو أحسن حل.
      ar: أرى أنّ وعي السكان هو أفضل حل.
      en: I believe residents' awareness is the best solution.
    words: [kesadaran, solusi]
dialogue:
  title: Esai untuk Bu Grace
  lines:
    - speaker: Bu Grace
      text: Apa tesis eksposisimu, Mohamed?
      ar_eg: إيه رأيك الأساسي في المقال يا محمد؟
      ar: ما أطروحة نصك العرضي يا محمد؟
      en: What's the thesis of your exposition, Mohamed?
    - speaker: Mohamed
      text: Saya berpendapat bahwa larangan kantong plastik wajib diterapkan di Manado.
      ar_eg: رأيي إن منع الأكياس البلاستيك لازم يتطبّق في مانادو.
      ar: أرى أنّ حظر الأكياس البلاستيكية يجب أن يُطبَّق في مانادو.
      en: I believe the plastic-bag ban must be applied in Manado.
    - speaker: Bu Grace
      text: Apa argumenmu?
      ar_eg: وإيه حجتك؟
      ar: وما حجتك؟
      en: What's your argument?
    - speaker: Mohamed
      text: Plastik merusak terumbu karang. Akibatnya, ikan dan wisatawan berkurang.
      ar_eg: البلاستيك بيبوّظ الشعاب المرجانية. والنتيجة إن السمك والسياح بيقلّوا.
      ar: البلاستيك يضرّ الشعاب المرجانية، ونتيجة لذلك يقلّ السمك والسياح.
      en: Plastic damages the coral reefs. As a result, there are fewer fish and fewer tourists.
    - speaker: Bu Grace
      text: Bagus. Dan solusinya?
      ar_eg: حلو. والحل؟
      ar: جيد. وما الحل؟
      en: Good. And the solution?
    - speaker: Mohamed
      text: Kita harus meningkatkan kesadaran warga dan membawa tas belanja sendiri.
      ar_eg: لازم نزوّد وعي الناس ونجيب شنط التسوّق بتاعتنا معانا.
      ar: يجب أن نرفع وعي السكان وأن نحمل أكياس التسوّق الخاصة بنا.
      en: We need to raise residents' awareness and bring our own shopping bags.
new_words:
  - word: kesadaran
    pos: noun
    ar_eg: وعي
    ar: وعي
    en: awareness
