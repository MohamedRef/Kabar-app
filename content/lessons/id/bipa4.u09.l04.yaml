  - id: e03
    type: listen
    text: Setelah hujan, jalan ke ladang penuh lumpur.
    question:
      ar_eg: الطريق مليان إيه؟
      ar: بماذا يمتلئ الطريق؟
      en: What is the path full of?
    options: [طين, رمل, تراب ناشف]
    answer: 0
    meaning:
      ar_eg: بعد المطر، الطريق للغيط مليان طين.
      ar: بعد المطر يمتلئ طريق الحقل بالطين.
      en: After the rain, the path to the field is full of mud.
    words: [lumpur, ladang]
  - id: e04
    type: fill_blank
    sentence: Madu ini dibuat oleh ___ di kebun bunga.
    meaning:
      ar_eg: العسل ده عملته ___ في جنينة الورد.
      ar: صنعت هذا العسلَ ___ في حديقة الزهور.
      en: This honey was made by ___ in the flower garden.
    options: [lebah, cacing, jamur]
    answers: [lebah]
    words: [lebah, cacing, jamur]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: خضار من غير سماد كيماوي ولا مبيدات. بالإندونيسي؟
      ar: خضار بلا سماد كيميائي ولا مبيدات. بالإندونيسية؟
      en: Vegetables without chemical fertiliser or pesticide. In Indonesian?
    options: [sayur lumpur, sayur organik, sayur akar]
    answer: 1
    explain:
      ar_eg: organik = عضوي.
      ar: organik = عضوي.
      en: organik = organic.
    words: [lumpur, organik, akar]
  - id: e06
    type: fill_blank
    sentence: Air masuk ke tanaman lewat ___.
    meaning:
      ar_eg: الميّه بتدخل النبات عن طريق ___.
      ar: يدخل الماء إلى النبات عبر ___.
      en: Water enters a plant through its ___.
    options: [akar, ladang, organik]
    answers: [akar]
    words: [akar, ladang, organik, tumbuhan]
  - id: e07
    type: multiple_choice
    question: Sup ini enak karena ada ___ segar dari hutan.
    options: [cacing, lumpur, jamur]
    answer: 2
    explain:
      ar_eg: jamur = عيش الغراب، فطر.
      ar: jamur = فطر.
      en: jamur = mushroom.
    words: [cacing, lumpur, jamur]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الدود والنحل مهمين للنبات.
      ar: الديدان والنحل مهمّة للنباتات.
      en: Worms and bees are important for plants.
    answer: Cacing dan lebah penting untuk tumbuhan.
    distractors: [jamur, ladang]
    words: [cacing, lebah, tumbuhan, jamur, ladang]
  - id: e09
    type: translate
    direction: from_target
    source_text: Tumbuhan di ladang organik itu tumbuh tanpa racun.
    answers_meaning:
      ar_eg: [النبات في الغيط العضوي ده بيطلع من غير سموم, الزرع في الغيط العضوي بيكبر من غير كيماويات سامة]
      ar: [تنمو النباتات في ذلك الحقل العضوي بلا سموم, النباتات في الحقل العضوي تنمو من غير مواد سامّة]
      en: [The plants in that organic field grow without poison, Plants grow without poisons in that organic field]
    words: [tumbuhan, ladang, organik]
  - id: e10
    type: speaking
    text: Di ladang organik ada cacing, lebah, dan jamur.
    meaning:
      ar_eg: في الغيط العضوي فيه دود ونحل وعيش غراب.
      ar: في الحقل العضوي ديدان ونحل وفطر.
      en: In an organic field there are worms, bees and mushrooms.
    words: [ladang, organik, cacing, lebah, jamur, lumpur, akar]
dialogue:
  lines:
    - speaker: Bu Grace
      text: Mohamed, ini kebun keluarga saya di Tomohon. Semuanya organik.
      ar_eg: يا محمد، دي جنينة عيلتي في توموهون. كلها عضوي.
      ar: يا محمد، هذه مزرعة عائلتي في توموهون، وكل ما فيها عضوي.
      en: Mohamed, this is my family's farm in Tomohon. Everything's organic.
    - speaker: Mohamed
      text: Tanpa pupuk kimia? Kok tumbuhannya bisa subur?
      ar_eg: من غير سماد كيماوي؟ إزاي النبات بيطلع حلو كده؟
      ar: بلا سماد كيميائي؟ كيف تنمو النباتات بهذه الخصوبة؟
      en: No chemical fertiliser? How do the plants grow so well?
    - speaker: Bu Grace
      text: Kami pakai kompos. Cacing membuat tanah bagus untuk akar.
      ar_eg: بنستخدم سماد طبيعي. والدود بيخلّي الأرض كويسة للجذور.
      ar: نستخدم السماد العضوي، والديدان تجعل التربة جيدة للجذور.
      en: We use compost. Worms make the soil good for the roots.
    - speaker: Mohamed
      text: Itu ada kotak kayu. Buat apa, Bu?
      ar_eg: فيه صندوق خشب هناك. ده لإيه؟
      ar: هناك صندوق خشبي. ما فائدته؟
      en: There's a wooden box there. What's it for?
    - speaker: Bu Grace
      text: Rumah lebah! Madu kami dari ladang ini juga.
      ar_eg: بيت النحل! والعسل بتاعنا من الغيط ده برضه.
      ar: إنه خلية نحل! وعسلنا أيضًا من هذا الحقل.
      en: A beehive! Our honey comes from this field too.
