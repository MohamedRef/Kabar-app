schema: kabar.lesson/v1
id: bipa4.u09.l04
language: id
title: Kebun organik di Tomohon
can_do:
  ar_eg: 'توصف مزرعة عضوية: التربة والجذور والدود والنحل من غير كيماويات.'
  ar: 'أن تصف مزرعة عضوية: التربة والجذور والديدان والنحل بلا مواد كيميائية.'
  en: 'Describe an organic farm: soil, roots, worms and bees, without chemicals.'
slides:
  - title: Bertani tanpa racun
    body:
      ar_eg: |
        organik = عضوي (sayur organik)، ladang = غيط، أرض زراعية، tumbuhan = نبات.
        akar = جذر، lumpur = طين، jamur = عيش الغراب، فطر.
        cacing = دودة، lebah = نحلة (madu dari lebah).
      ar: |
        organik = عضوي (sayur organik)، ladang = حقل، tumbuhan = نبات.
        akar = جذر، lumpur = طين، jamur = فطر.
        cacing = دودة، lebah = نحلة (madu dari lebah).
      en: |
        organik = organic (sayur organik), ladang = field, farmland; tumbuhan = plant.
        akar = root, lumpur = mud, jamur = mushroom, fungus.
        cacing = worm, lebah = bee (madu dari lebah).
    examples:
      - text: Pak Ferry punya sayur organik di ladangnya.
        ar_eg: أستاذ فيري عنده خضار عضوي في غيطه.
        ar: لدى السيد فيري خضار عضوية في حقله.
        en: Pak Ferry has organic vegetables in his field.
      - text: Cacing membuat tanah subur.
        ar_eg: الدود بيخلّي الأرض خصبة.
        ar: تجعل الديدان التربة خصبة.
        en: Worms make the soil fertile.
      - text: Akar pohon itu sangat panjang.
        ar_eg: جذور الشجرة دي طويلة أوي.
        ar: جذور تلك الشجرة طويلة جدًا.
        en: That tree's roots are very long.
