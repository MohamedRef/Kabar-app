schema: kabar.lesson/v1
id: bipa1.u06.l01
language: id
title: Saya membaca buku
can_do:
  ar_eg: تستعمل أفعال meN- اللي بتبقى me- وmem-.
  ar: أن تستعمل أفعال meN- بصيغتي me- وmem-.
  en: Use meN- verbs with me- and mem-.
slides:
  - title: meN- = بيعمل حاجة لحاجة
    body:
      ar_eg: |
        فاكر ber- (مالهاش مفعول)؟ meN- أختها، بس فعلها غالبًا ليه مفعول به:
        - baca → membaca buku (يقرا كتاب)
        - tulis → menulis surat (يكتب جواب)
        الـ N دي «نون بتتشكل»: بتتغير حسب أول حرف في الجذر عشان النطق يبقى ناعم. هنشوف القواعد في الشرايح الجاية.
      ar: |
        تذكر ber- (بلا مفعول)؟ أختها meN- تصوغ فعلًا يأخذ مفعولًا غالبًا:
        - baca → membaca buku (يقرأ كتابًا)
        - tulis → menulis surat (يكتب رسالة)
        وحرف N نون متشكّلة تتغير بحسب أول الجذر تيسيرًا للنطق، وسنرى قواعدها الآن.
      en: |
        Remember ber- (no object)? Its sibling meN- usually makes verbs that do take an object:
        - baca → membaca buku (read a book)
        - tulis → menulis surat (write a letter)
        The N is a shape-shifting nasal: it changes with the root's first sound so it's smooth to say. Rules on the next slides.
    grammar: id.prefix.men.basic
    examples:
      - text: Saya membaca buku.
        ar_eg: أنا بقرا كتاب.
        ar: أقرأ كتابًا.
        en: I read a book.
      - text: Rina menulis surat.
        ar_eg: رينا بتكتب جواب.
        ar: رينا تكتب رسالة.
        en: Rina is writing a letter.
  - title: me- dan mem-
    body:
      ar_eg: |
        - me- قبل l m n ng ny r w y: lihat → melihat (يشوف)، masak → memasak (يطبخ).
        - mem- قبل b و p و f: baca → membaca (يقرا).
        وخلي بالك: الـ p بتقع! pakai → memakai (يلبس / يستخدم)، مش «mempakai».
      ar: |
        - me- قبل l m n ng ny r w y: lihat → melihat (يرى)، masak → memasak (يطبخ).
        - mem- قبل b وp وf: baca → membaca (يقرأ).
        وتسقط p: pakai → memakai (يلبس / يستعمل)، لا «mempakai».
      en: |
        - me- before l m n ng ny r w y: lihat → melihat (see), masak → memasak (cook).
        - mem- before b, p, f: baca → membaca (read).
        Watch out — p drops: pakai → memakai (wear / use), never "mempakai".
    grammar: id.prefix.men.basic
    examples:
      - text: Bu Yanti memasak nasi.
        ar_eg: مدام يانتي بتطبخ رز.
        ar: السيدة يانتي تطبخ الأرز.
        en: Bu Yanti is cooking rice.
      - text: Saya memakai baju batik.
        ar_eg: أنا لابس قميص باتيك.
        ar: ألبس قميص باتيك.
        en: I'm wearing a batik shirt.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: meN- + tulis تبقى إيه؟
      ar: ما ناتج meN- + tulis؟
      en: What does meN- + tulis become?
    options: [menulis, metulis, mentulis]
    answer: 0
    explain:
      ar_eg: قبل t بتبقى men-، والـ t بتقع.
      ar: قبل t تصير men- وتسقط t.
      en: Before t it's men-, and the t drops.
    words: [menulis]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: meN- + pakai تبقى إيه؟
      ar: ما ناتج meN- + pakai؟
      en: What does meN- + pakai become?
    options: [memakai, mempakai, mepakai]
    answer: 0
    explain:
      ar_eg: قبل p بتبقى mem-، والـ p بتقع.
      ar: قبل p تصير mem- وتسقط p.
      en: Before p it's mem-, and the p drops.
    words: [memakai]
  - id: e03
    type: listen
    text: Saya membaca buku.
    options: [Saya menulis surat., Saya membaca buku., Saya memakai baju.]
    answer: 1
    words: [membaca, buku, surat]
  - id: e04
    type: fill_blank
    sentence: Rina ___ surat itu.
    meaning:
      ar_eg: رينا شافت الجواب ده.
      ar: رأت رينا تلك الرسالة.
      en: Rina sees that letter.
    options: [melihat, memasak, memakai]
    answers: [melihat]
    words: [melihat, surat]
    explain:
      ar_eg: "الجواب يشوف الجواب: melihat (من lihat). memasak = يطبخ، وmemakai = يلبس/يستعمل."
      ar: melihat (من lihat) = يرى. memasak يطبخ وmemakai يستعمل.
      en: You melihat (see) a letter.
  - id: e05
    type: match_pairs
    pairs:
      - text: membaca
        ar_eg: يقرا
        ar: يقرأ
        en: to read
      - text: menulis
        ar_eg: يكتب
        ar: يكتب
        en: to write
      - text: melihat
        ar_eg: يشوف
        ar: يرى
        en: to see
      - text: memasak
        ar_eg: يطبخ
        ar: يطبخ
        en: to cook
      - text: memakai
        ar_eg: يلبس / يستعمل
        ar: يلبس / يستعمل
        en: to wear, to use
    words: [membaca, menulis, melihat, memasak, memakai]
  - id: e06
    type: build_sentence
    source:
      ar_eg: مدام يانتي بتطبخ رز.
      ar: السيدة يانتي تطبخ الأرز.
      en: Bu Yanti is cooking rice.
    answer: Bu Yanti memasak nasi.
    distractors: [menulis, membaca]
    words: [memasak, nasi]
    explain:
      ar_eg: Bu Yanti + memasak (بتطبخ، من masak) + nasi. menulis وmembaca زيادة.
      ar: Bu Yanti memasak nasi. menulis وmembaca زائدتان.
      en: Bu Yanti + memasak + nasi. menulis and membaca are extra.
  - id: e07
    type: fill_blank
    sentence: Rina ___ surat.
    meaning:
      ar_eg: رينا بتكتب جواب.
      ar: رينا تكتب رسالة.
      en: Rina is writing a letter.
    options: [tulis, menulis, membaca]
    answers: [menulis]
    explain:
      ar_eg: في الجملة الرسمية بنقول menulis، مش tulis لوحدها.
      ar: في الجملة الخبرية الفصيحة نقول menulis لا tulis.
      en: In a standard statement, use menulis, not bare tulis.
    words: [menulis, surat]
  - id: e08
    type: speaking
    text: Nasi Bu Yanti enak!
    meaning:
      ar_eg: رز طنط يانتي حلو!
      ar: أرز السيدة يانتي لذيذ!
      en: Bu Yanti's rice is delicious!
    words: [nasi, enak]
  - id: e09
    type: listen
    text: Bu Yanti memasak nasi. Enak!
    options: ['Bu Yanti memasak nasi. Enak!', 'Bu Yanti memasak nasi. Bagus!', 'Bu Yanti membaca surat. Bagus!']
    answer: 0
    meaning:
      ar_eg: طنط يانتي بتطبخ رز. حلو أوي!
      ar: السيدة يانتي تطبخ الأرز. لذيذ جدًا!
      en: Bu Yanti is cooking rice. Delicious!
    words: [memasak, nasi, enak, membaca]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «الرز ده طعمه حلو»؟
      ar: كيف تقول «هذا الأرز لذيذ»؟
      en: How do you say "This rice is tasty"?
    options: ['Nasi ini enak.', 'Nasi ini bagus.', 'Saya melihat nasi.']
    answer: 0
    explain:
      ar_eg: enak للأكل والطعم؛ bagus للشكل والحاجة الحلوة عمومًا.
      ar: enak للطعم، وbagus للمظهر والجودة عمومًا.
      en: enak is for taste; bagus is for looks and quality in general.
    words: [nasi, enak, melihat]
dialogue:
  lines:
    - speaker: Bu Yanti
      text: Pagi, Mohamed! Kamu membaca apa?
      ar_eg: صباح الخير يا محمد! بتقرا إيه؟
      ar: صباح الخير يا محمد! ماذا تقرأ؟
      en: Morning, Mohamed! What are you reading?
    - speaker: Mohamed
      text: Pagi, Bu! Saya membaca buku bahasa Indonesia.
      ar_eg: صباح النور يا مدام! بقرا كتاب إندونيسي.
      ar: صباح النور يا سيدتي! أقرأ كتابًا بالإندونيسية.
      en: Morning! I'm reading an Indonesian book.
    - speaker: Bu Yanti
      text: Wah, bagus! Ibu memasak nasi goreng.
      ar_eg: الله، حلو! أنا بطبخ رز مقلي.
      ar: رائع! أنا أطبخ أرزًا مقليًّا.
      en: Oh, good! I'm cooking fried rice.
    - speaker: Mohamed
      text: Hmm, enak! Boleh saya melihat?
      ar_eg: ممم، شكله حلو! ممكن أشوف؟
      ar: ممم، لذيذ! هل لي أن أرى؟
      en: Mmm, yummy! May I see?
    - speaker: Bu Yanti
      text: Boleh! Silakan, Mohamed.
      ar_eg: طبعًا! اتفضل يا محمد.
      ar: طبعًا! تفضل يا محمد.
      en: Sure! Go ahead, Mohamed.
new_words:
  - word: membaca
    pos: verb
    ar_eg: يقرا؛ في الشارع baca (aku baca buku)
    ar: يقرأ؛ وفي العامية baca (aku baca buku)
    en: to read; on the street baca (aku baca buku)
  - word: menulis
    pos: verb
    ar_eg: يكتب؛ في الشارع tulis (aku tulis surat)
    ar: يكتب؛ وفي العامية tulis (aku tulis surat)
    en: to write; on the street tulis (aku tulis surat)
  - word: melihat
    pos: verb
    ar_eg: يشوف
    ar: يرى
    en: to see, to look at
  - word: memasak
    pos: verb
    ar_eg: يطبخ
    ar: يطبخ
    en: to cook
  - word: memakai
    pos: verb
    ar_eg: يلبس / يستخدم
    ar: يلبس / يستعمل
    en: to wear, to use
  - word: surat
    pos: noun
    ar_eg: جواب
    ar: رسالة
    en: letter
  - word: nasi
    pos: noun
    ar_eg: رز (مطبوخ)
    ar: أرز (مطبوخ)
    en: cooked rice
  - word: enak
    pos: adjective
    ar_eg: حلو (في الأكل) / لذيذ
    ar: لذيذ
    en: tasty, delicious; pleasant
