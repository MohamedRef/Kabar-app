schema: kabar.lesson/v1
id: bipa1.u06.l01
language: id
title: Saya membaca buku
can_do:
  ar_eg: تستخدم أشهر أفعال meN-.
  ar: أن تستعمل أشهر أفعال meN-.
  en: Use common meN- verbs.
slides:
  - title: meN- = بيعمل حاجة لحاجة
    body:
      ar_eg: |
        فاكر ber- (مالهاش مفعول)؟ meN- أختها، بس فعلها غالبًا ليه مفعول به:
        - baca → membaca buku (يقرا كتاب)
        - tulis → menulis surat (يكتب جواب)
        الـ N دي «نون بتتشكل»: بتتغير حسب أول حرف في الجذر عشان النطق يبقى ناعم. هنشوف القواعد في الشرايح الجاية.
      ar: |
        تذكر ber- (بلا مفعول)؟ أختها meN- تصوغ فعلًا يأخذ مفعولًا غالبًا:
        - baca → membaca buku (يقرأ كتابًا)
        - tulis → menulis surat (يكتب رسالة)
        وحرف N نون متشكّلة تتغير بحسب أول الجذر تيسيرًا للنطق، وسنرى قواعدها الآن.
      en: |
        Remember ber- (no object)? Its sibling meN- usually makes verbs that do take an object:
        - baca → membaca buku (read a book)
        - tulis → menulis surat (write a letter)
        The N is a shape-shifting nasal: it changes with the root's first sound so it's smooth to say. Rules on the next slides.
    grammar: id.prefix.men.basic
    examples:
      - text: Saya membaca buku.
        ar_eg: أنا بقرا كتاب.
        ar: أقرأ كتابًا.
        en: I read a book.
      - text: Rina menulis surat.
        ar_eg: رينا بتكتب جواب.
        ar: رينا تكتب رسالة.
        en: Rina is writing a letter.
  - title: me- dan mem-
    body:
      ar_eg: |
        - me- قبل l m n ng ny r w y: lihat → melihat (يشوف)، masak → memasak (يطبخ).
        - mem- قبل b و p و f: baca → membaca (يقرا).
        وخلي بالك: الـ p بتقع! pakai → memakai (يلبس / يستخدم)، مش «mempakai».
      ar: |
        - me- قبل l m n ng ny r w y: lihat → melihat (يرى)، masak → memasak (يطبخ).
        - mem- قبل b وp وf: baca → membaca (يقرأ).
        وتسقط p: pakai → memakai (يلبس / يستعمل)، لا «mempakai».
      en: |
        - me- before l m n ng ny r w y: lihat → melihat (see), masak → memasak (cook).
        - mem- before b, p, f: baca → membaca (read).
        Watch out — p drops: pakai → memakai (wear / use), never "mempakai".
    grammar: id.prefix.men.basic
    examples:
      - text: Bu Sari memasak nasi.
        ar_eg: مدام ساري بتطبخ رز.
        ar: السيدة ساري تطبخ الأرز.
        en: Bu Sari is cooking rice.
      - text: Saya memakai baju batik.
        ar_eg: أنا لابس قميص باتيك.
        ar: ألبس قميص باتيك.
        en: I'm wearing a batik shirt.
  - title: men- dan meny-
    body:
      ar_eg: |
        - men- قبل d و t و c و j: dengar → mendengar (يسمع)، cuci → mencuci (يغسل).
        الـ t بتقع: tulis → menulis (يكتب)، tonton → menonton (يتفرج).
        - meny- مع s، والـ s بتقع: sapu → menyapu (يكنس).
      ar: |
        - men- قبل d وt وc وj: dengar → mendengar (يسمع)، cuci → mencuci (يغسل).
        وتسقط t: tulis → menulis (يكتب)، tonton → menonton (يشاهد).
        - meny- مع s مع سقوطها: sapu → menyapu (يكنس).
      en: |
        - men- before d, t, c, j: dengar → mendengar (hear), cuci → mencuci (wash).
        t drops: tulis → menulis (write), tonton → menonton (watch).
        - meny- for s, and s drops: sapu → menyapu (sweep).
    grammar: id.prefix.men.basic
    examples:
      - text: Dimas menonton TV.
        ar_eg: ديماس بيتفرج على التلفزيون.
        ar: ديماس يشاهد التلفاز.
        en: Dimas is watching TV.
      - text: Bu Sari menyapu lantai.
        ar_eg: مدام ساري بتكنس الأرضية.
        ar: السيدة ساري تكنس الأرض.
        en: Bu Sari is sweeping the floor.
  - title: meng-
    body:
      ar_eg: |
        meng- قبل الحروف المتحركة وg وh وk، والـ k بتقع:
        - ajar → mengajar (يدرّس)
        - goreng → menggoreng (يقلي) — اتنين g!
        - kirim → mengirim (يبعت)
        حيلة الجذر: men- + حرف متحرك؟ جرّب t. meny- + متحرك؟ جرّب s. mem- + متحرك؟ جرّب p. meng- + متحرك؟ جرّب k أو متحرك. زي ما بنطلّع الجذر «ك ت ب» من «يكتب».
      ar: |
        meng- قبل الصوائت وg وh وk، مع سقوط k:
        - ajar → mengajar (يُدرّس)
        - goreng → menggoreng (يقلي) — بحرفي g.
        - kirim → mengirim (يرسل)
        ولاستخراج الجذر: men- + صائت → t، meny- + صائت → s، mem- + صائت → p، meng- + صائت → k أو صائت؛ كما نستخرج «ك ت ب» من «يكتب».
      en: |
        meng- before vowels, g, h, k — and k drops:
        - ajar → mengajar (teach)
        - goreng → menggoreng (fry) — double g!
        - kirim → mengirim (send)
        Root trick: men- + vowel → try t; meny- + vowel → s; mem- + vowel → p; meng- + vowel → k or a vowel. Like finding «ك ت ب» inside «يكتب».
    grammar: id.prefix.men.basic
    examples:
      - text: Pak Budi mengajar bahasa Indonesia.
        ar_eg: أستاذ بودي بيدرّس إندونيسي.
        ar: الأستاذ بودي يدرّس الإندونيسية.
        en: Pak Budi teaches Indonesian.
      - text: Saya mengirim pesan.
        ar_eg: أنا ببعت رسالة.
        ar: أرسل رسالة.
        en: I'm sending a message.
  - title: makan, minum, mandi, tidur
    body:
      ar_eg: |
        أفعال يومية كتير مالهاش بادئة خالص، وبتستخدمها زي ما هي:
        makan (ياكل)، minum (يشرب)، mandi (يستحمى)، tidur (ينام)، bangun (يصحى).
        وفي كلام جاكرتا العادي الناس بتشيل me- كمان: «Saya baca buku»، أو بتقول nulis، nyapu، ngirim، nonton.
      ar: |
        أفعال يومية كثيرة بلا سابقة أصلًا:
        makan (يأكل)، minum (يشرب)، mandi (يستحم)، tidur (ينام)، bangun (يستيقظ).
        وفي عامية جاكرتا تُحذف السابقة أو تُختصر: «Saya baca buku»، nulis، nyapu، ngirim، nonton.
      en: |
        Many everyday verbs have no prefix at all:
        makan (eat), minum (drink), mandi (bathe, shower), tidur (sleep), bangun (wake up).
        Casual Jakarta speech drops or shortens meN- too: "Saya baca buku", nulis, nyapu, ngirim, nonton.
    grammar: id.prefix.men.basic
    examples:
      - text: Saya bangun, lalu mandi.
        ar_eg: بصحى وبعدين أستحمى.
        ar: أستيقظ ثم أستحم.
        en: I wake up, then I shower.
      - text: Aku lagi nonton TV.
        ar_eg: أنا بتفرج على التلفزيون. (عامية)
        ar: أشاهد التلفاز الآن. (عامية)
        en: I'm watching TV. (casual)
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: membaca
        ar_eg: يقرا
        ar: يقرأ
        en: read
      - text: menulis
        ar_eg: يكتب
        ar: يكتب
        en: write
      - text: memasak
        ar_eg: يطبخ
        ar: يطبخ
        en: cook
      - text: menonton
        ar_eg: يتفرج
        ar: يشاهد
        en: watch
      - text: mencuci
        ar_eg: يغسل
        ar: يغسل
        en: wash
    words: [membaca, menulis, memasak, menonton, mencuci]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: meN- + tulis تبقى إيه؟
      ar: ما ناتج meN- + tulis؟
      en: What does meN- + tulis become?
    options: ["menulis", "metulis", "mentulis"]
    answer: 0
    explain:
      ar_eg: قبل t بتبقى men-، والـ t بتقع.
      ar: قبل t تصير men- وتسقط t.
      en: Before t it's men-, and the t drops.
    words: [menulis]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: meN- + pakai تبقى إيه؟
      ar: ما ناتج meN- + pakai؟
      en: What does meN- + pakai become?
    options: ["memakai", "mempakai", "mepakai"]
    answer: 0
    explain:
      ar_eg: قبل p بتبقى mem-، والـ p بتقع.
      ar: قبل p تصير mem- وتسقط p.
      en: Before p it's mem-, and the p drops.
    words: [memakai]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إيه جذر menyapu؟
      ar: ما جذر menyapu؟
      en: What's the root of menyapu?
    options: ["nyapu", "sapu", "apu"]
    answer: 1
    explain:
      ar_eg: meny- + حرف متحرك معناها إن الجذر بيبدأ بـ s.
      ar: meny- + صائت تعني أن الجذر يبدأ بـ s.
      en: meny- + vowel means the root starts with s.
    words: [menyapu]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: meN- + kirim تبقى إيه؟
      ar: ما ناتج meN- + kirim؟
      en: What does meN- + kirim become?
    options: ["mengirim", "mengkirim", "menkirim"]
    answer: 0
    explain:
      ar_eg: قبل k بتبقى meng-، والـ k بتقع.
      ar: قبل k تصير meng- وتسقط k.
      en: Before k it's meng-, and the k drops.
    words: [mengirim]
  - id: e06
    type: listen
    text: Saya membaca buku.
    options: ["Saya menulis buku.", "Saya membaca buku.", "Saya memakai baju."]
    answer: 1
    words: [membaca, buku]
  - id: e07
    type: fill_blank
    sentence: Ibu ___ ikan.
    meaning:
      ar_eg: ماما بتقلي سمك.
      ar: الأم تقلي السمك.
      en: Mother is frying fish.
    options: ["mengoreng", "megoreng", "menggoreng"]
    answers: [menggoreng]
    explain:
      ar_eg: goreng بتبدأ بـ g، والـ g مابتقعش، فيبقى عندك meng + goreng = menggoreng.
      ar: لا تسقط g، فيجتمع حرفا g في meng + goreng = menggoreng.
      en: g doesn't drop, so you get two g's — meng + goreng = menggoreng.
    words: [menggoreng, ikan]
  - id: e08
    type: fill_blank
    sentence: Pak Budi ___ bahasa Indonesia.
    meaning:
      ar_eg: أستاذ بودي بيدرّس إندونيسي.
      ar: الأستاذ بودي يدرّس الإندونيسية.
      en: Pak Budi teaches Indonesian.
    answers: [mengajar, mengajarkan]
    explain:
      ar_eg: meng + ajar = mengajar (يدرّس). belajar = يتعلم، mengajar = يعلّم.
      ar: meng + ajar = mengajar (يُعلّم)، أما belajar فـ «يتعلم».
      en: meng + ajar = mengajar (teach); belajar = learn.
    words: [mengajar]
  - id: e09
    type: build_sentence
    source:
      ar_eg: أنا بتفرج على التلفزيون في البيت.
      ar: أشاهد التلفاز في البيت.
      en: I watch TV at home.
    answer: Saya menonton TV di rumah.
    distractors: [tonton, membaca]
    words: [menonton]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا بقرا كتاب.
      ar: أقرأ كتابًا.
      en: I'm reading a book.
    answers:
      - Saya membaca buku.
      - Saya membaca buku
      - Aku membaca buku.
      - Aku membaca buku
      - Saya baca buku.
      - Aku baca buku.
    words: [membaca, buku]
  - id: e11
    type: translate
    direction: from_target
    source_text: Dimas mengirim pesan.
    answers_meaning:
      ar_eg: ["ديماس بيبعت رسالة.", "ديماس بعت رسالة", "ديماس بيبعت مسج"]
      ar: ["ديماس يرسل رسالة.", "أرسل ديماس رسالة", "ديماس يُرسل رسالة"]
      en: ["Dimas is sending a message.", "Dimas sends a message", "Dimas sent a message"]
    words: [mengirim, pesan]
  - id: e12
    type: dictation
    text: Bu Sari menyapu lantai.
    meaning:
      ar_eg: مدام ساري بتكنس الأرضية.
      ar: السيدة ساري تكنس الأرض.
      en: Bu Sari is sweeping the floor.
    words: [menyapu, lantai]
  - id: e13
    type: speaking
    text: Pak Budi mengajar bahasa Indonesia.
    meaning:
      ar_eg: أستاذ بودي بيدرّس إندونيسي.
      ar: الأستاذ بودي يدرّس الإندونيسية.
      en: Pak Budi teaches Indonesian.
    words: [mengajar]
dialogue:
  title: Pagi di Blok M
  lines:
    - speaker: Bu Sari
      text: Pagi, Mohamed! Kamu membaca apa?
      ar_eg: صباح الخير يا محمد! بتقرا إيه؟
      ar: صباح الخير يا محمد! ماذا تقرأ؟
      en: Morning, Mohamed! What are you reading?
    - speaker: Mohamed
      text: Pagi, Bu! Saya membaca buku bahasa Indonesia.
      ar_eg: صباح النور يا مدام! بقرا كتاب إندونيسي.
      ar: صباح النور يا سيدتي! أقرأ كتابًا بالإندونيسية.
      en: Morning! I'm reading an Indonesian book.
    - speaker: Bu Sari
      text: Wah, bagus! Ibu memasak nasi goreng.
      ar_eg: الله، حلو! وأنا بطبخ رز مقلي.
      ar: رائع! وأنا أطبخ أرزًا مقليًا.
      en: Oh, good! I'm cooking fried rice.
    - speaker: Mohamed
      text: Hmm, enak! Boleh saya melihat?
      ar_eg: ممم، ريحته حلوة! ممكن أشوف؟
      ar: ممم، شهي! هل يمكنني أن أرى؟
      en: Mmm, yummy! May I see?
    - speaker: Bu Sari
      text: Boleh! Silakan makan, Mohamed.
      ar_eg: طبعًا! اتفضل كُل يا محمد.
      ar: بالطبع! تفضل كُل يا محمد.
      en: Sure! Please eat, Mohamed.
