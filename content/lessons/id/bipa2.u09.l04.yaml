dialogue:
  lines:
    - speaker: Ni Luh
      text: Besok kita ke air terjun Sekumpul, ya.
      ar_eg: بكرة نروح شلال سِكومبول.
      ar: غدًا نذهب إلى شلال سكومبول.
      en: Tomorrow we're going to Sekumpul waterfall.
    - speaker: Mohamed
      text: Jauh dari sini?
      ar_eg: بعيد من هنا؟
      ar: هل هو بعيد من هنا؟
      en: Is it far from here?
    - speaker: Ni Luh
      text: Lumayan. Kita jalan lewat hutan.
      ar_eg: شوية. هنمشي في الغابة.
      ar: قليلًا. سنمشي عبر الغابة.
      en: Fairly. We walk through the forest.
    - speaker: Mohamed
      text: Aku bawa ransel, air, dan sandal.
      ar_eg: هاخد شنطة الضهر ومية وصندل.
      ar: سآخذ حقيبة الظهر والماء والصندل.
      en: I'll bring my backpack, water and sandals.
    - speaker: Ni Luh
      text: Bagus. Malamnya kita tidur di penginapan dekat sana.
      ar_eg: حلو. بالليل ننام في مكان قريب من هناك.
      ar: جيّد. وفي الليل ننام في نُزُل قريب.
      en: Good. At night we'll sleep in a guesthouse nearby.
    - speaker: Mohamed
      text: Vila mahal, ya? Penginapan aja!
      ar_eg: الفيلا غالية، صح؟ خلّينا في اللوكاندة!
      ar: الفيلا غالية، أليس كذلك؟ النُّزُل يكفي!
      en: Villas are pricey, right? A guesthouse is fine!
