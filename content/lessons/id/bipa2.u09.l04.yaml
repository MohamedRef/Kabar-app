language: id
title: Hutan dan air terjun
can_do:
  ar_eg: 'تخطط رحلة طبيعة: غابة وشلال وشعاب مرجانية، وشنطة ضهر وبوصلة، وتختار مكان تبات فيه.'
  ar: 'أن تخطط لرحلة في الطبيعة: غابة وشلال وشعاب مرجانية، وحقيبة ظهر وبوصلة، وتختار مكان المبيت.'
  en: 'Plan a nature trip: forest, waterfall and coral reef, a backpack and compass, and somewhere to stay.'
slides:
  - title: Ke alam
    body:
      ar_eg: |
        hutan = غابة، air terjun = شلال (حرفيًا «مية واقعة»)، karang = شعاب مرجانية.
        kompas = بوصلة، ransel = شنطة ضهر، sandal = صندل (أحسن من الجزمة للشلال!).
        penginapan = مكان تبات فيه (من inap = يبات)، vila = فيلا.
        في الشارع بيقولوا:
        - aja = saja (بس، وخلاص)
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
      ar: |
        hutan = غابة، air terjun = شلال (حرفيًا «ماء ساقط»)، karang = شعاب مرجانية.
        kompas = بوصلة، ransel = حقيبة ظهر، sandal = صندل (أفضل من الحذاء عند الشلال!).
        penginapan = مكان المبيت (من inap = يبيت)، vila = فيلا.
        في كلام الشارع:
        - aja = saja (فقط)
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
      en: |
        hutan = forest, air terjun = waterfall (literally "falling water"), karang = coral reef.
        kompas = compass, ransel = backpack, sandal = sandals (better than shoes at a waterfall!).
        penginapan = lodging, guesthouse (inap = stay overnight), vila = villa.
        On the street:
        - aja = saja (just, only)
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
    examples:
      - text: Di Bali ada air terjun yang indah.
        ar_eg: في بالي فيه شلال جميل.
        ar: في بالي شلال جميل.
        en: Bali has a beautiful waterfall.
      - text: Bawa ransel dan kompas ke hutan.
        ar_eg: خد شنطة الضهر والبوصلة للغابة.
        ar: خذ حقيبة الظهر والبوصلة إلى الغابة.
        en: Take a backpack and compass to the forest.
      - text: Kami tinggal di vila dekat pantai.
        ar_eg: إحنا قاعدين في فيلا جنب البحر.
        ar: نقيم في فيلا قرب الشاطئ.
        en: We're staying in a villa near the beach.
