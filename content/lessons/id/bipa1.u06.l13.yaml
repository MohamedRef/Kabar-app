schema: kabar.lesson/v1
id: bipa1.u06.l13
language: id
title: Ulangan Unit 6
can_do:
  ar_eg: توصف روتينك اليومي.
  ar: أن تصف روتينك اليومي.
  en: Describe your routine.
slides:
  - title: Aktivitas harianku — ringkasan
    body:
      ar_eg: |
        اللي أخدناه في الوحدة دي:
        - meN-: membaca، menulis، menonton، menyapu، mengirim (p / t / k / s بيقعوا).
        - sudah، belum، sedang، akan، masih، baru قبل الفعل.
        - selalu، biasanya، sering، kadang-kadang، jarang، tidak pernah.
        - kemarin، tadi، sekarang، nanti · sebelum، sesudah، lalu.
        - di sini، di situ، di sana.
      ar: |
        ما تعلمناه في هذه الوحدة:
        - meN-: membaca، menulis، menonton، menyapu، mengirim (مع سقوط p / t / k / s).
        - sudah، belum، sedang، akan، masih، baru قبل الفعل.
        - selalu، biasanya، sering، kadang-kadang، jarang، tidak pernah.
        - kemarin، tadi، sekarang، nanti · sebelum، sesudah، lalu.
        - di sini، di situ، di sana.
      en: |
        What this unit covered:
        - meN-: membaca, menulis, menonton, menyapu, mengirim (p / t / k / s drop).
        - sudah, belum, sedang, akan, masih, baru before the verb.
        - selalu, biasanya, sering, kadang-kadang, jarang, tidak pernah.
        - kemarin, tadi, sekarang, nanti · sebelum, sesudah, lalu.
        - di sini, di situ, di sana.
    grammar: id.prefix.men.basic
    examples:
      - text: Saya sedang membaca buku.
        ar_eg: أنا بقرا كتاب دلوقتي.
        ar: أنا أقرأ كتابًا الآن.
        en: I'm reading a book.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: menulis
        ar_eg: يكتب
        ar: يكتب
        en: write
      - text: memasak
        ar_eg: يطبخ
        ar: يطبخ
        en: cook
      - text: mencuci
        ar_eg: يغسل
        ar: يغسل
        en: wash
      - text: mengirim
        ar_eg: يبعت
        ar: يرسل
        en: send
      - text: menyapu
        ar_eg: يكنس
        ar: يكنس
        en: sweep
    words: [menulis, memasak, mencuci, mengirim, menyapu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه جذر menonton؟
      ar: ما جذر menonton؟
      en: What's the root of menonton?
    options: [onton, nonton, tonton]
    answer: 2
    explain:
      ar_eg: men- + حرف متحرك؟ جرّب t، الجذر tonton. (nonton هي الصيغة العامية)
      ar: men- + صائت يدل على t، فالجذر tonton. (وnonton صيغة عامية)
      en: men- + vowel → try t; the root is tonton. (nonton is the casual form.)
    words: [menonton]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: meN- + baca تبقى إيه؟
      ar: ما ناتج meN- + baca؟
      en: What does meN- + baca become?
    options: [membaca, mebaca, menbaca]
    answer: 0
    explain:
      ar_eg: قبل b بتبقى mem-، والـ b مابتقعش.
      ar: قبل b تصير mem- ولا تسقط b.
      en: Before b it's mem-, and b stays.
    words: [membaca]
  - id: e04
    type: multiple_choice
    question: Sudah menikah?
    question_meaning:
      ar_eg: إنت مش متجوز. الرد الطبيعي؟
      ar: لست متزوجًا. ما الجواب الطبيعي؟
      en: You're not married. What's the natural reply?
    options: [Tidak., Belum., Sudah.]
    answer: 1
    explain:
      ar_eg: belum = لسه، وده الرد المؤدب المعتاد.
      ar: belum = ليس بعد، وهو الجواب المهذب المعتاد.
      en: belum (not yet) is the usual polite reply.
    words: [belum]
  - id: e05
    type: listen
    text: Dia sedang memasak.
    options: [Dia sedang memasak., Dia sudah memasak., Dia akan memasak.]
    answer: 0
    words: [sedang, memasak]
  - id: e06
    type: fill_blank
    sentence: Saya ___ minum kopi setiap pagi.
    meaning:
      ar_eg: أنا دايمًا بشرب قهوة كل صبح.
      ar: أشرب القهوة دائمًا كل صباح.
      en: I always drink coffee every morning.
    options: [selalu, jarang, tidak pernah]
    answers: [selalu]
    words: [selalu, kopi]
    explain:
      ar_eg: كل صبح = selalu (دايمًا). jarang = نادرًا، وtidak pernah = أبدًا.
      ar: كل صباح selalu أي دائمًا.
      en: "Every morning: selalu (always)."
  - id: e07
    type: fill_blank
    sentence: Masjidnya di ___.
    meaning:
      ar_eg: الجامع هناك (بعيد عننا إحنا الاتنين).
      ar: المسجد هناك (بعيدًا عنا).
      en: The mosque is over there (far from both of us).
    options: [sini, sana, situ]
    answers: [sana]
    words: [sana]
    explain:
      ar_eg: بعيد عن الاتنين = sana (هناك). sini = هنا، وsitu = عندك (قريب منك).
      ar: البعيد عنّا الاثنين sana. sini هنا وsitu قربك.
      en: "Far from both of you: sana."
  - id: e08
    type: build_sentence
    source:
      ar_eg: ماما بتقلي سمك دلوقتي.
      ar: الأم تقلي السمك الآن.
      en: Mother is frying fish right now.
    answer: Ibu sedang menggoreng ikan.
    distractors: [minum, sudah]
    words: [sedang, menggoreng, ikan]
    explain:
      ar_eg: Ibu (ماما) + sedang menggoreng (بتقلي دلوقتي) + ikan. minum وsudah زيادة.
      ar: Ibu sedang menggoreng ikan. minum وsudah زائدتان.
      en: Ibu + sedang menggoreng + ikan. minum and sudah are extra.
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: رينا لسه نايمة.
      ar: ما زالت رينا نائمة.
      en: Rina is still asleep.
    answers: [Rina masih tidur., Rina masih tidur]
    words: [masih, tidur]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا نادرًا لما بطبخ.
      ar: نادرًا ما أطبخ.
      en: I rarely cook.
    answers: [Saya jarang memasak., Saya jarang memasak, Aku jarang memasak., Saya jarang masak., Aku jarang masak.]
    words: [jarang, memasak]
  - id: e11
    type: match_pairs
    pairs:
      - text: roti
        ar_eg: عيش، توست
        ar: خبز
        en: bread
      - text: tugas
        ar_eg: مهمة، واجب
        ar: مهمّة، واجب
        en: task, assignment
      - text: kelas
        ar_eg: فصل، حصة
        ar: صفّ، حصّة
        en: class, classroom
      - text: pensil
        ar_eg: قلم رصاص
        ar: قلم رصاص
        en: pencil
    words: [roti, tugas, kelas, pensil]
  - id: e12
    type: speaking
    text: Kami akan ke Blok M nanti malam.
    meaning:
      ar_eg: هنروح بلوك إم بالليل.
      ar: سنذهب إلى بلوك إم الليلة.
      en: We'll go to Blok M tonight.
    words: [akan, nanti]
dialogue:
  title: Sudah makan, Mohamed?
  lines:
    - speaker: Bu Yanti
      text: Pagi, Mohamed! Udah makan?
      ar_eg: صباح الخير يا محمد! فطرت؟
      ar: صباح الخير يا محمد! هل أكلت؟
      en: Morning, Mohamed! Have you eaten?
    - speaker: Mohamed
      text: Belum, Bu. Saya baru bangun.
      ar_eg: لسه يا مدام. لسه صاحي حالًا.
      ar: ليس بعد يا سيدتي. استيقظت للتو.
      en: Not yet, ma'am. I've just woken up.
    - speaker: Bu Yanti
      text: Ibu udah memasak nasi uduk. Silakan!
      ar_eg: أنا طبخت ناسي أودوك خلاص. اتفضل!
      ar: لقد طبخت ناسي أودوك. تفضل!
      en: I've already cooked nasi uduk. Help yourself!
    - speaker: Mohamed
      text: Terima kasih, Bu! Biasanya saya sarapan di Blok M.
      ar_eg: شكرًا يا مدام! عادةً بفطر في بلوك إم.
      ar: شكرًا يا سيدتي! عادةً أفطر في بلوك إم.
      en: Thank you! I usually have breakfast at Blok M.
    - speaker: Bu Yanti
      text: Hari ini makan di sini, ya.
      ar_eg: النهارده كُل هنا بقى.
      ar: كُل هنا اليوم إذن.
      en: Today, eat here, OK?
    - speaker: Mohamed
      text: Baik, Bu. Sesudah sarapan, saya akan menyapu lantai.
      ar_eg: حاضر يا مدام. بعد الفطار هكنس الأرضية.
      ar: حسنًا يا سيدتي. بعد الفطور سأكنس الأرض.
      en: All right. After breakfast, I'll sweep the floor.
souvenir:
  id: bipa1.u06.souvenir
  title: Warung makan Blok M
  note:
    ar_eg: كتير من أهل جاكرتا بيصحوا الساعة ٥ الصبح عشان يسبقوا الزحمة، ويفطروا على الماشي من عربيات وأكشاك بلوك إم. ولو حد سألك «Sudah makan?» ماتستغربش، دي تحية زي «عامل إيه»، مش عزومة. ردّ بابتسامة، قول «Sudah!» أو «Belum!».
    ar: يستيقظ كثير من أهل جاكرتا في الخامسة صباحًا ليسبقوا الزحام، ويتناولون فطورهم من أكشاك الطعام في بلوك إم. وإذا سألك أحد «Sudah makan?» فهي تحية مثل «كيف حالك»، لا دعوة إلى الطعام. أجب بابتسامة بـ «Sudah!» أو «Belum!».
    en: Many Jakartans start the day at 5 a.m. to beat the traffic, grabbing breakfast from Blok M's food stalls on the way. If someone asks "Sudah makan?", it's a greeting like "how are you", not an invitation. Just smile and answer "Sudah!" or "Belum!".
