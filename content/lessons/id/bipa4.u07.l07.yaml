schema: kabar.lesson/v1
id: bipa4.u07.l07
language: id
title: Diet sehat atau bahaya?
can_do:
  ar_eg: تتكلم عن رجيم ومكملات غذائية وتحذّر من حاجات ممكن تأذي الجسم.
  ar: أن تتحدث عن الحمية والمكمّلات وتحذّر مما قد يؤذي الجسم.
  en: Talk about diets and supplements and warn about things that can harm the body.
slides:
  - title: Hati-hati dengan pil diet
    body:
      ar_eg: |
        suplemen = مكمّل غذائي (suplemen vitamin)، protein = بروتين، pil = حباية (pil vitamin).
        cairan = سوايل، سائل (minum banyak cairan)، beracun = سام (buah beracun).
        organ = عضو في الجسم (ginjal adalah organ)، lidah = لسان، kuku = ضافر.
      ar: |
        suplemen = مكمّل غذائي، protein = بروتين، pil = حبّة دواء (pil vitamin).
        cairan = سوائل، سائل (minum banyak cairan)، beracun = سامّ (buah beracun).
        organ = عضو من أعضاء الجسم، lidah = لسان، kuku = ظفر.
      en: |
        suplemen = (food) supplement, protein = protein, pil = pill (pil vitamin).
        cairan = fluid, liquid (minum banyak cairan); beracun = poisonous (buah beracun).
        organ = (body) organ; lidah = tongue; kuku = nail.
    examples:
      - text: Daging dan ikan banyak mengandung protein.
        ar_eg: اللحمة والسمك فيهم بروتين كتير.
        ar: يحتوي اللحم والسمك على بروتين كثير.
        en: Meat and fish contain lots of protein.
      - text: Kalau diare, minum banyak cairan.
        ar_eg: لو عندك إسهال، اشرب سوايل كتير.
        ar: إذا أصابك الإسهال فاشرب سوائل كثيرة.
        en: If you have diarrhoea, drink lots of fluids.
      - text: Pil diet itu bisa merusak organ tubuh.
        ar_eg: حبوب الرجيم دي ممكن تبوّظ أعضاء الجسم.
        ar: قد تضرّ حبوب الحمية تلك بأعضاء الجسم.
        en: Those diet pills can damage the body's organs.
