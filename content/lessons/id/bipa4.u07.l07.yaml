  - id: e03
    type: listen
    text: Jangan makan buah itu. Buahnya beracun!
    question:
      ar_eg: الفاكهة مالها؟
      ar: ما مشكلة الفاكهة؟
      en: What's wrong with the fruit?
    options: [سام, مستوي, غالي]
    answer: 0
    meaning:
      ar_eg: ما تاكلش الفاكهة دي. دي سامة!
      ar: لا تأكل تلك الفاكهة. إنها سامّة!
      en: Don't eat that fruit. It's poisonous!
    words: [beracun]
  - id: e04
    type: fill_blank
    sentence: Dokter melihat ___ saya. Warnanya putih karena sakit.
    meaning:
      ar_eg: الدكتور بص على ___ي. لونه أبيض عشان أنا عيان.
      ar: نظر الطبيب إلى ___ي. لونه أبيض بسبب المرض.
      en: The doctor looked at my ___. It's white because I'm ill.
    options: [lidah, kuku, suplemen]
    answers: [lidah]
    words: [lidah, kuku, suplemen]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بتقصّه كل أسبوع في إيدك ورجلك. ده إيه؟
      ar: تقصّه كل أسبوع في يديك وقدميك. ما هو؟
      en: You cut it every week on your hands and feet. What is it?
    options: [organ, kuku, pil]
    answer: 1
    explain:
      ar_eg: kuku = ضافر.
      ar: kuku = ظفر.
      en: kuku = nail.
    words: [organ, kuku, pil]
  - id: e06
    type: fill_blank
    sentence: Pemain bola itu minum ___ protein setiap pagi.
    meaning:
      ar_eg: لاعب الكورة ده بيشرب ___ بروتين كل يوم الصبح.
      ar: يشرب ذلك اللاعب ___ بروتين كل صباح.
      en: That footballer drinks a protein ___ every morning.
    options: [suplemen, cairan, beracun]
    answers: [suplemen]
    words: [suplemen, cairan, beracun, protein]
  - id: e07
    type: multiple_choice
    question: Minum satu ___ setelah makan malam.
    options: [protein, lidah, pil]
    answer: 2
    explain:
      ar_eg: pil = حباية دوا.
      ar: pil = حبّة دواء.
      en: pil = pill.
    words: [protein, lidah, pil]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الكلى عضو مهم جدًا.
      ar: الكليتان عضو مهمّ جدًا.
      en: The kidneys are a very important organ.
    answer: Ginjal adalah organ yang sangat penting.
    distractors: [protein, cairan]
    words: [organ, protein, cairan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Pemain bola perlu banyak protein dan cairan.
    answers_meaning:
      ar_eg: [لاعب الكورة محتاج بروتين وسوايل كتير, اللعيب محتاج بروتين كتير ويشرب كتير]
      ar: [يحتاج لاعب الكرة إلى كثير من البروتين والسوائل, لاعبو الكرة بحاجة إلى بروتين وسوائل كثيرة]
      en: [Footballers need lots of protein and fluids, A football player needs plenty of protein and liquids]
    words: [protein, cairan]
  - id: e10
    type: speaking
    text: Suplemen dan pil diet ini beracun untuk organ tubuh.
    meaning:
      ar_eg: المكمّلات وحبوب الرجيم دي سامة لأعضاء الجسم.
      ar: هذه المكمّلات وحبوب الحمية سامّة لأعضاء الجسم.
      en: These supplements and diet pills are poisonous to the body's organs.
    words: [suplemen, pil, beracun, organ, kuku]
dialogue:
  lines:
    - speaker: Andi
      text: Mohamed, lihat! Pil diet ini bisa nurunin berat lima kilo seminggu.
      ar_eg: يا محمد، بص! حبوب الرجيم دي بتنزّل خمسة كيلو في أسبوع.
      ar: يا محمد، انظر! حبوب الحمية هذه تُنقص الوزن خمسة كيلوغرامات في أسبوع.
      en: Mohamed, look! These diet pills can take off five kilos a week.
    - speaker: Mohamed
      text: Hati-hati, Andi. Ada pil diet yang beracun dan merusak organ.
      ar_eg: خلي بالك يا أندي. فيه حبوب رجيم سامة وبتبوّظ الأعضاء.
      ar: احذر يا أندي. بعض حبوب الحمية سامّة وتضرّ الأعضاء.
      en: Careful, Andi. Some diet pills are poisonous and damage your organs.
    - speaker: Andi
      text: Masa sih? Temanku minum pil ini, terus kuku dan rambutnya rusak.
      ar_eg: بجد؟ صاحبي خد الحبوب دي، وبعدين ضوافره وشعره باظوا.
      ar: حقًّا؟ صديقي تناول هذه الحبوب ثم تلفت أظافره وشعره.
      en: Really? My friend took these pills and then his nails and hair got damaged.
    - speaker: Mohamed
      text: 'Nah, itu tanda bahaya. Diet sehat lebih baik: protein, sayur, dan banyak cairan.'
      ar_eg: 'أهو، دي علامة خطر. الرجيم الصحي أحسن: بروتين وخضار وسوايل كتير.'
      ar: 'هذه علامة خطر. الحمية الصحية أفضل: بروتين وخضار وسوائل كثيرة.'
      en: 'See, that''s a warning sign. A healthy diet is better: protein, vegetables and plenty of fluids.'
    - speaker: Andi
      text: Oke deh, aku buang aja pil ini.
      ar_eg: ماشي، هرمي الحبوب دي وخلاص.
      ar: حسنًا، سأرمي هذه الحبوب.
      en: OK, I'll just throw these pills away.
