schema: kabar.lesson/v1
id: bipa1.u03.l02
language: id
title: Suami, istri, anak
can_do:
  ar_eg: تعرّف بجوزك/مراتك وولادك وتقول الشخص ولد ولا بنت.
  ar: أن تعرّف بزوجك وأولادك وتحدد إن كان الشخص ذكرًا أو أنثى.
  en: Introduce your spouse and children and say if someone is male or female.
slides:
  - title: Suami, istri, anak
    body:
      ar_eg: |
        suami = جوز، istri = زوجة (مرات فلان)، anak = ابن أو بنت (طفل).
        الكلمات دي مش بتقول ولد ولا بنت. عشان تحدد، حط laki-laki (ذكر) أو perempuan (أنثى) بعد الاسم:
        anak laki-laki = ابن، anak perempuan = بنت، kakak perempuan = أخت كبيرة.
      ar: |
        suami = الزوج، istri = الزوجة، anak = الابن أو البنت (الولد).
        هذه الكلمات لا تحدد الجنس، فإن أردت التحديد فضع laki-laki (ذكر) أو perempuan (أنثى) بعد الاسم:
        anak laki-laki = ابن، anak perempuan = ابنة، kakak perempuan = أخت كبرى.
      en: |
        suami = husband, istri = wife, anak = child (son or daughter).
        These words don't say male or female. To be specific, put laki-laki (male) or perempuan (female) after the noun:
        anak laki-laki = son, anak perempuan = daughter, kakak perempuan = older sister.
    examples:
      - text: Ini suami saya.
        ar_eg: ده جوزي.
        ar: هذا زوجي.
        en: This is my husband.
      - text: Anak perempuan saya dokter.
        ar_eg: بنتي دكتورة.
        ar: ابنتي طبيبة.
        en: My daughter is a doctor.
      - text: Itu adik laki-laki saya.
        ar_eg: ده أخويا الصغير.
        ar: ذاك أخي الأصغر.
        en: That's my younger brother.
exercises:
  - id: e01
    type: build_sentence
    source:
      ar_eg: ده أخويا الصغير، بايو.
      ar: هذا أخي الأصغر، بايو.
      en: This is my younger brother, Bayu.
    answer: Ini adik laki-laki saya, Bayu.
    distractors: [itu, kakak]
    words: [ini, adik, laki-laki]
  - id: e02
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: دي مراتي.
      ar: هذه زوجتي.
      en: This is my wife.
    answers: [Ini istri saya., Ini istri saya, Ini istriku., Ini istri aku.]
    words: [ini, istri]
  - id: e03
    type: translate
    direction: from_target
    source_text: Itu kakak perempuan saya. Dia dokter.
    answers_meaning:
      ar_eg: [دي أختي الكبيرة. هي دكتورة., دي أختي الكبيرة، دكتورة]
      ar: [تلك أختي الكبرى. هي طبيبة., هذه أختي الكبرى، وهي طبيبة]
      en: [That's my older sister. She's a doctor., That is my older sister; she is a doctor]
    words: [itu, kakak, perempuan]
  - id: e04
    type: match_pairs
    pairs:
      - text: suami
        ar_eg: الجوز
        ar: الزوج
        en: husband
      - text: istri
        ar_eg: الزوجة
        ar: الزوجة
        en: wife
      - text: anak
        ar_eg: الابن / البنت
        ar: الولد
        en: child
      - text: laki-laki
        ar_eg: ذكر
        ar: ذكر
        en: male
      - text: perempuan
        ar_eg: أنثى
        ar: أنثى
        en: female
    words: [suami, istri, anak, laki-laki, perempuan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «بنتي»؟
      ar: كيف تقول «ابنتي»؟
      en: How do you say "my daughter"?
    options: [perempuan anak saya, anak perempuan saya, saya anak perempuan]
    answer: 1
    explain:
      ar_eg: الاسم الأول (anak)، بعده الوصف (perempuan)، وفي الآخر صاحبه (saya).
      ar: الاسم أولًا (anak)، ثم الوصف (perempuan)، ثم المضاف إليه (saya).
      en: Noun first (anak), then the describer (perempuan), then the owner (saya).
    words: [anak, perempuan]
  - id: e06
    type: listen
    text: Ini suami saya.
    options: [Ini istri saya., Itu suami saya., Ini suami saya.]
    answer: 2
    meaning:
      ar_eg: ده جوزي.
      ar: هذا زوجي.
      en: This is my husband.
    words: [suami]
  - id: e07
    type: speaking
    text: Ini istri saya, dan itu anak kami.
    meaning:
      ar_eg: دي مراتي، وده (هناك) ابننا.
      ar: هذه زوجتي، وذاك ولدنا.
      en: This is my wife, and that's our child.
    words: [istri, anak]
dialogue:
  lines:
    - speaker: Bu Sari
      text: Mohamed, ini suami saya, Pak Hendra.
      ar_eg: محمد، ده جوزي، الأستاذ هندرا.
      ar: محمد، هذا زوجي، الأستاذ هندرا.
      en: Mohamed, this is my husband, Pak Hendra.
    - speaker: Mohamed
      text: Selamat siang, Pak. Salam kenal.
      ar_eg: نهارك سعيد يا أستاذ. فرصة سعيدة.
      ar: طاب نهارك يا أستاذ. تشرفنا.
      en: Good afternoon, sir. Nice to meet you.
    - speaker: Pak Hendra
      text: Salam kenal. Itu anak kami, Putri.
      ar_eg: فرصة سعيدة. دي بنتنا، بوتري.
      ar: تشرفنا. تلك ابنتنا، بوتري.
      en: Nice to meet you. That's our child, Putri.
    - speaker: Mohamed
      text: Anak perempuan Bapak? Hai, Putri!
      ar_eg: بنت حضرتك؟ أهلًا يا بوتري!
      ar: ابنتك؟ مرحبًا يا بوتري!
      en: Your daughter? Hi, Putri!
