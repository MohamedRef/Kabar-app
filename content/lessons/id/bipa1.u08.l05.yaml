schema: kabar.lesson/v1
id: bipa1.u08.l05
language: id
title: Foto kelas Rina
can_do:
  ar_eg: 'توصف ناس في صورة: الوش والعينين والمناخير، صغير أو رفيع أو مليان، خجول أو مبتسم.'
  ar: 'أن تصف أشخاصًا في صورة: الوجه والعينين والأنف، شابّ أو نحيف أو ممتلئ، خجول أو مبتسم.'
  en: 'Describe people in a photo: face, eyes and nose, young, thin or plump, shy or smiling.'
slides:
  - title: Wajah di foto
    body:
      ar_eg: |
        wajah = وش. mata = عين (افتكر matahari: عين النهار!)، hidung = مناخير.
        muda = صغير في السن. kurus = رفيع، gemuk = تخين أو مليان. للبيبي gemuk مدح (Bayinya gemuk!)، بس مع الكبار قولها بلطف.
        pemalu = خجول (malu = كسوف، وpe- = الشخص اللي كده). tersenyum = يبتسم.
      ar: |
        wajah = وجه. mata = عين (تذكّر matahari: عين النهار!)، hidung = أنف.
        muda = صغير السنّ. kurus = نحيف، gemuk = سمين أو ممتلئ، وهي مديح للرضيع (Bayinya gemuk!)، أما مع الكبار فقلها بلطف.
        pemalu = خجول (malu = الخجل، وpe- = صاحب الصفة). tersenyum = يبتسم.
      en: |
        wajah = face. mata = eye (remember matahari, the eye of the day!), hidung = nose.
        muda = young. kurus = thin, gemuk = plump. For a baby gemuk is praise (Bayinya gemuk!); with adults, use it gently.
        pemalu = shy (malu = shame, pe- = a person who is). tersenyum = smile.
    examples:
      - text: Matanya besar dan hidungnya kecil.
        ar_eg: عينيه كبيرة ومناخيره صغيرة.
        ar: عيناه واسعتان وأنفه صغير.
        en: His eyes are big and his nose is small.
      - text: Di foto ini saya kurus dan pemalu.
        ar_eg: في الصورة دي أنا رفيعة وخجولة.
        ar: في هذه الصورة أنا نحيفة وخجولة.
        en: In this photo I'm thin and shy.
      - text: Bayinya gemuk dan lucu.
        ar_eg: البيبي مليان وعسول.
        ar: الرضيع ممتلئ ولطيف.
        en: The baby is chubby and cute.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wajah
        ar_eg: وش
        ar: وجه
        en: face
      - text: mata
        ar_eg: عين
        ar: عين
        en: eye
      - text: hidung
        ar_eg: مناخير
        ar: أنف
        en: nose
      - text: tersenyum
        ar_eg: يبتسم
        ar: يبتسم
        en: smile
    words: [wajah, mata, hidung, tersenyum]
  - id: e02
    type: match_pairs
    pairs:
      - text: muda
        ar_eg: صغير في السن
        ar: شابّ
        en: young
      - text: kurus
        ar_eg: رفيع
        ar: نحيف
        en: thin
      - text: gemuk
        ar_eg: تخين، مليان
        ar: سمين
        en: fat, plump
      - text: pemalu
        ar_eg: خجول
        ar: خجول
        en: shy
    words: [muda, kurus, gemuk, pemalu]
  - id: e03
    type: listen
    text: Di foto ini, Raka gemuk dan selalu tersenyum.
    question:
      ar_eg: رَكا شكله إيه في الصورة؟
      ar: كيف يبدو راكا في الصورة؟
      en: What does Raka look like in the photo?
    options: [مليان, رفيع, زعلان]
    answer: 0
    meaning:
      ar_eg: في الصورة دي، رَكا مليان ودايمًا مبتسم.
      ar: في هذه الصورة راكا ممتلئ ودائم الابتسام.
      en: In this photo, Raka is plump and always smiling.
    words: [gemuk, tersenyum]
  - id: e04
    type: fill_blank
    sentence: Bayi itu ___ dan lucu.
    meaning:
      ar_eg: البيبي ده ___ وعسول.
      ar: ذلك الرضيع ___ ولطيف.
      en: That baby is ___ and cute.
    options: [gemuk, kurus, muda]
    answers: [gemuk]
    words: [gemuk, kurus, muda]
    explain:
      ar_eg: بيبي لذيذ و gemuk = تخين/مربرب. kurus = رفيع، وmuda = صغير في السن.
      ar: الرضيع gemuk أي ممتلئ. kurus نحيف.
      en: A chubby baby is gemuk.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حد بيتكسف يتكلم قدام الناس. هو…؟
      ar: شخص يخجل من الكلام أمام الناس. هو…؟
      en: Someone is too bashful to talk in front of people. They're…?
    options: [pemalu, muda, gemuk]
    answer: 0
    explain:
      ar_eg: pemalu = خجول. muda صغير في السن، وgemuk مليان.
      ar: pemalu خجول، أما muda فشابّ وgemuk ممتلئ.
      en: pemalu = shy; muda is young and gemuk plump.
    words: [pemalu, muda]
  - id: e06
    type: fill_blank
    sentence: Di foto ini Pak guru masih ___. Umurnya dua puluh lima tahun.
    meaning:
      ar_eg: في الصورة دي الأستاذ لسه ___. عنده ٢٥ سنة.
      ar: في هذه الصورة ما زال الأستاذ ___، عمره خمس وعشرون سنة.
      en: In this photo the teacher is still ___. He's twenty-five.
    options: [muda, kurus, pemalu]
    answers: [muda]
    words: [muda, kurus, pemalu]
    explain:
      ar_eg: عنده ٢٥ سنة يعني muda = شاب. kurus = رفيع، وpemalu = خجول.
      ar: في الخامسة والعشرين فهو muda أي شاب.
      en: At 25 he's muda (young).
  - id: e07
    type: build_sentence
    source:
      ar_eg: وشها حلو وعينيها كبيرة.
      ar: وجهها جميل وعيناها واسعتان.
      en: Her face is pretty and her eyes are big.
    answer: Wajahnya cantik dan matanya besar.
    distractors: [hidung, kurus]
    words: [wajah, mata]
    explain:
      ar_eg: Wajahnya cantik (وشها حلو) + dan matanya besar (وعينيها كبار). hidung وkurus زيادة.
      ar: Wajahnya cantik dan matanya besar. hidung وkurus زائدتان.
      en: Wajahnya cantik + dan matanya besar. hidung and kurus are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Rina tidak tersenyum di foto itu.
    answers_meaning:
      ar_eg: [رينا مش مبتسمة في الصورة دي, رينا مابتبتسمش في الصورة دي]
      ar: [رينا لا تبتسم في تلك الصورة, لا تبتسم رينا في تلك الصورة]
      en: ['Rina isn''t smiling in that photo', 'Rina doesn''t smile in that photo']
    words: [tersenyum]
  - id: e09
    type: speaking
    text: Hidungnya kecil dan wajahnya ramah.
    meaning:
      ar_eg: مناخيره صغيرة ووشه بشوش.
      ar: أنفه صغير ووجهه بشوش.
      en: He has a small nose and a friendly face.
    words: [hidung, wajah]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: بنشم الريحة بأنهي حتة في الوش؟
      ar: بأيّ جزء من الوجه نشمّ الرائحة؟
      en: Which part of the face do you smell with?
    options: [hidung, mata, wajah]
    answer: 0
    explain:
      ar_eg: hidung = مناخير. mata عين، وwajah الوش كله.
      ar: hidung أنف، أما mata فعين وwajah الوجه كلّه.
      en: hidung = nose; mata is an eye and wajah the whole face.
    words: [hidung, mata, wajah]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, ini foto kelasku.
      ar_eg: يا محمد، دي صورة فصلي.
      ar: يا محمد، هذه صورة صفّي.
      en: Mohamed, this is my class photo.
    - speaker: Mohamed
      text: Yang mana kamu? Yang kurus itu?
      ar_eg: أنهي واحدة إنتي؟ الرفيعة دي؟
      ar: أيّهم أنتِ؟ تلك النحيفة؟
      en: Which one is you? The thin one?
    - speaker: Rina
      text: Ya! Aku pemalu, jadi aku nggak tersenyum.
      ar_eg: أيوه! كنت خجولة، عشان كده مش مبتسمة.
      ar: نعم! كنت خجولة، لذلك لا أبتسم.
      en: Yes! I was shy, so I'm not smiling.
    - speaker: Mohamed
      text: Dan anak gemuk ini? Dia selalu tersenyum.
      ar_eg: والولد المليان ده؟ دايمًا مبتسم.
      ar: وهذا الولد الممتلئ؟ دائم الابتسام.
      en: And this plump boy? He's always smiling.
    - speaker: Rina
      text: Itu Raka! Dan ini Pak guru. Dia masih muda.
      ar_eg: دا رَكا! ودا الأستاذ. لسه صغير.
      ar: ذاك راكا! وهذا الأستاذ، ما زال شابًّا.
      en: That's Raka! And this is our teacher. He's still young.
    - speaker: Mohamed
      text: Matanya besar dan wajahnya ramah.
      ar_eg: عينيه كبيرة ووشه بشوش.
      ar: عيناه واسعتان ووجهه بشوش.
      en: He has big eyes and a friendly face.
