  - id: e03
    type: listen
    text: 'Wajahnya cantik: matanya besar dan hidungnya kecil.'
    question:
      ar_eg: عينيها شكلها إيه؟
      ar: كيف عيناها؟
      en: What are her eyes like?
    options: [كبيرة, صغيرة, مقفولة]
    answer: 0
    meaning:
      ar_eg: 'وشها حلو: عينيها كبيرة ومناخيرها صغيرة.'
      ar: 'وجهها جميل: عيناها واسعتان وأنفها صغير.'
      en: 'Her face is pretty: big eyes and a small nose.'
    words: [wajah, mata, hidung]
  - id: e04
    type: fill_blank
    sentence: Bayi itu ___ dan lucu.
    meaning:
      ar_eg: البيبي ده ___ وعسول.
      ar: ذلك الرضيع ___ ولطيف.
      en: That baby is ___ and cute.
    options: [gemuk, jelek, leher]
    answers: [gemuk]
    words: [gemuk, jelek, leher]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ganteng في الكلام العادي. والكلمة الأرسمي؟
      ar: ganteng في الكلام اليومي، فما الكلمة الأرسم؟
      en: ganteng in everyday talk. The more formal word?
    options: [tampan, cantik, jelek]
    answer: 0
    explain:
      ar_eg: tampan = وسيم (للراجل). cantik للست، وjelek عكسهم.
      ar: tampan للرجل الوسيم، وcantik للمرأة، وjelek ضدّهما.
      en: tampan for a handsome man; cantik for a woman; jelek is the opposite.
    words: [tampan, jelek]
  - id: e06
    type: fill_blank
    sentence: Gadis Bali itu pakai bunga di ___.
    meaning:
      ar_eg: البنت البالية دي حاطّة وردة على ___.
      ar: تضع الفتاة البالية زهرة على ___.
      en: The Balinese girl wears a flower on her ___.
    options: [telinga, leher, mata]
    answers: [telinga]
    words: [telinga, leher, mata]
  - id: e07
    type: build_sentence
    source:
      ar_eg: وشها حلو وشعرها طويل.
      ar: وجهها جميل وشعرها طويل.
      en: Her face is pretty and her hair is long.
    answer: Wajahnya cantik dan rambutnya panjang.
    distractors: [leher, gemuk]
    words: [wajah]
  - id: e08
    type: translate
    direction: from_target
    source_text: Fotonya tidak jelek!
    answers_meaning:
      ar_eg: [الصورة مش وحشة!, الصورة مش وحشة خالص!]
      ar: [الصورة ليست سيئة!, ليست الصورة قبيحة!]
      en: ['The photo isn''t bad!', 'The photo''s not ugly!']
    words: [jelek]
  - id: e09
    type: speaking
    text: Pria itu tampan dan agak gemuk.
    meaning:
      ar_eg: الراجل ده وسيم ومليان شوية.
      ar: ذلك الرجل وسيم وممتلئ قليلًا.
      en: That man is handsome and a bit plump.
    words: [tampan, gemuk]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: الكوفية بتتلبس فين؟
      ar: أين يُلبس الوشاح؟
      en: Where do you wear a scarf?
    options: [leher, telinga, hidung]
    answer: 0
    explain:
      ar_eg: 'على الرقبة: leher. telinga ودن وhidung مناخير.'
      ar: 'على الرقبة: leher، أما telinga فأذن وhidung أنف.'
      en: 'On your neck: leher. telinga is an ear and hidung a nose.'
    words: [leher, telinga, hidung]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, ini foto teman baru saya, Bima.
      ar_eg: يا محمد، دي صورة صاحبي الجديد بيما.
      ar: يا محمد، هذه صورة صديقي الجديد بيما.
      en: Mohamed, this is a photo of my new friend, Bima.
    - speaker: Mohamed
      text: Wajahnya ramah! Dia tampan.
      ar_eg: وشه بشوش! ووسيم.
      ar: وجهه بشوش! وهو وسيم.
      en: He has a friendly face! He's handsome.
    - speaker: Rina
      text: Ya! Matanya besar, rambutnya pendek.
      ar_eg: أيوه! عينيه كبيرة وشعره قصير.
      ar: نعم! عيناه واسعتان وشعره قصير.
      en: Yes! Big eyes, short hair.
    - speaker: Mohamed
      text: Dan ini bayi siapa? Gemuk dan lucu!
      ar_eg: والبيبي ده مين؟ مليان وعسول!
      ar: ورضيع مَن هذا؟ ممتلئ ولطيف!
      en: And whose baby is this? Chubby and cute!
    - speaker: Rina
      text: Itu adik Bima. Telinganya kecil sekali!
      ar_eg: دي أخت بيما الصغيرة. ودانها صغننين!
      ar: تلك أخت بيما الصغرى. أذناها صغيرتان جدًا!
      en: That's Bima's little sister. Her ears are so tiny!
    - speaker: Mohamed
      text: Lucu banget!
      ar_eg: عسولة أوي!
      ar: لطيفة جدًا!
      en: So cute!
