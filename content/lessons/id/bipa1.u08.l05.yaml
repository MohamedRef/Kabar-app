schema: kabar.lesson/v1
id: bipa1.u08.l05
language: id
title: Siapa dia?
can_do:
  ar_eg: تخمّن مين الشخص من وصفه.
  ar: أن تخمّن الشخص من وصفه.
  en: Guess a person from a description.
slides:
  - title: Tebak, siapa dia?
    body:
      ar_eg: |-
        لعبة النهارده: حد يوصف، والتاني يخمّن (tebak = خمّن).
        كل اللي محتاجه من الوحدة دي:
        - الصفة على طول: Dia tinggi. Orangnya sabar.
        - tidak مع الصفة، وbukan مع الاسم: Dia tidak pendek. Dia bukan Dimas.
        - yang عشان تميّز: Dia yang pakai kacamata.
        لو التخمين صح قول Betul! (صح!). ولو غلط: Bukan! أو Salah! (غلط!).
      ar: |-
        لعبة اليوم: يصف أحدهم شخصًا ويخمّن الآخر (tebak = خمِّن).
        وكل ما تحتاجه من الوحدة:
        - الصفة مباشرة: Dia tinggi. Orangnya sabar.
        - tidak مع الصفة وbukan مع الاسم: Dia tidak pendek. Dia bukan Dimas.
        - yang للتمييز: Dia yang pakai kacamata.
        إن أصاب التخمين فقل Betul! (صحيح!)، وإن أخطأ فقل Bukan! أو Salah! (خطأ!).
      en: |-
        Today's game: one person describes, the other guesses (tebak = guess).
        Everything you need from this unit:
        - Adjective straight after the person: Dia tinggi. Orangnya sabar.
        - tidak with adjectives, bukan with nouns: Dia tidak pendek. Dia bukan Dimas.
        - yang to single someone out: Dia yang pakai kacamata.
        If the guess is right, say Betul! (Right!). If not, Bukan! or Salah! (Wrong!).
    grammar: id.negation.tidak-bukan
    examples:
      - text: Dia bukan Dimas. Dia yang pakai kacamata.
        ar_eg: هو مش ديماس. هو اللي لابس نضارة.
        ar: ليس ديماس، بل الذي يلبس نظارة.
        en: He's not Dimas. He's the one wearing glasses.
      - text: Ni Luh yang rambutnya panjang? — Betul!
        ar_eg: ني لوه اللي شعرها طويل؟ — صح!
        ar: ني لوه ذات الشعر الطويل؟ — صحيح!
        en: Ni Luh, the one with long hair? — Right!
exercises:
  - id: e01
    type: multiple_choice
    question: Dia guru. Orangnya sabar, dan dia pakai kacamata. Siapa dia?
    options: [Ni Luh, Pak Budi, Dimas]
    answer: 1
    explain:
      ar_eg: مدرس صبور ولابس نضارة، يبقى الأستاذ بودي.
      ar: 'معلم صبور يلبس نظارة: إنه الأستاذ بودي.'
      en: 'A patient teacher in glasses: Pak Budi.'
    words: [sabar, kacamata, guru]
  - id: e02
    type: listen
    text: Dia bukan Dimas.
    options: [Dia tidak Dimas., Dia bukan Dimas., 'Dia Dimas, bukan?']
    answer: 1
    words: [bukan]
  - id: e03
    type: fill_blank
    sentence: Dimas lucu, tapi dia ___ sabar.
    meaning:
      ar_eg: ديماس دمه خفيف، بس مش صبور.
      ar: ديماس ظريف، لكنه ليس صبورًا.
      en: Dimas is funny, but he isn't patient.
    answers: [tidak, nggak, gak]
    explain:
      ar_eg: sabar صفة، يبقى tidak.
      ar: sabar صفة، فتُنفى بـ tidak.
      en: sabar is an adjective → tidak.
    words: [tidak, sabar, lucu]
  - id: e04
    type: fill_blank
    sentence: Dia ___ guru. Dia dokter.
    meaning:
      ar_eg: هي مش مدرسة. هي دكتورة.
      ar: ليست معلمة، إنها طبيبة.
      en: She isn't a teacher. She's a doctor.
    answers: [bukan]
    explain:
      ar_eg: guru اسم، يبقى bukan.
      ar: guru اسم، فيُنفى بـ bukan.
      en: guru is a noun → bukan.
    words: [bukan, guru]
  - id: e05
    type: build_sentence
    source:
      ar_eg: هو إنسان صبور وشاطر.
      ar: إنه شخص صبور وذكي.
      en: He's a patient and smart person.
    answer: Orangnya sabar dan pintar.
    alternatives: [Orangnya pintar dan sabar.]
    distractors: [tidak, yang]
    words: [sabar, pintar]
  - id: e06
    type: build_sentence
    source:
      ar_eg: هو اللي لابس نضارة.
      ar: هو الذي يلبس نظارة.
      en: He's the one wearing glasses.
    answer: Dia yang pakai kacamata.
    distractors: [mana, bukan]
    words: [yang, pakai, kacamata]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنهي واحد الأستاذ بودي؟
      ar: أيّهم الأستاذ بودي؟
      en: Which one is Pak Budi?
    answers: ['Pak Budi yang mana?', Pak Budi yang mana, 'Yang mana Pak Budi?', Yang mana Pak Budi]
    words: [yang mana]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هي مش ني لوه. شعر ني لوه طويل.
      ar: ليست ني لوه. شعر ني لوه طويل.
      en: She's not Ni Luh. Ni Luh's hair is long.
    answers: [Dia bukan Ni Luh. Rambut Ni Luh panjang., Dia bukan Ni Luh. Rambut Ni Luh panjang, 'Dia bukan Ni Luh, rambut Ni Luh panjang.', Itu bukan Ni Luh. Rambut Ni Luh panjang., Bukan Ni Luh. Rambut Ni Luh panjang.]
    explain:
      ar_eg: Ni Luh اسم، يبقى bukan. وrambut Ni Luh = شعر ني لوه (الصاحب بعد الحاجة).
      ar: Ni Luh اسم فيُنفى بـ bukan، وrambut Ni Luh = شعر ني لوه.
      en: Ni Luh is a noun → bukan; rambut Ni Luh = Ni Luh's hair (owner after the thing).
    words: [bukan, rambut, panjang]
  - id: e09
    type: dictation
    text: Dia bukan guru saya.
    meaning:
      ar_eg: هو مش المدرس بتاعي.
      ar: ليس معلمي.
      en: He's not my teacher.
    words: [bukan, guru]
  - id: e10
    type: speaking
    text: Dia tinggi, rambutnya pendek, dan orangnya lucu.
    meaning:
      ar_eg: هو طويل، شعره قصير، ودمه خفيف.
      ar: هو طويل، شعره قصير، وظريف.
      en: He's tall, his hair is short, and he's funny.
    words: [tinggi, rambut, pendek, lucu]
dialogue:
  title: Tebak-tebakan di Petak Sembilan
  lines:
    - speaker: Rina
      text: Mohamed, coba tebak. Siapa dia? Orangnya sabar dan pintar.
      ar_eg: محمد، جرّب تخمّن. مين ده؟ إنسان صبور وشاطر.
      ar: 'يا محمد، حاول أن تخمّن: من هو؟ إنه صبور وذكي.'
      en: Mohamed, try to guess. Who is it? He's patient and smart.
    - speaker: Mohamed
      text: Hmm… Dimas, bukan?
      ar_eg: امم… ديماس، مش كده؟
      ar: همم… ديماس، أليس كذلك؟
      en: Hmm… Dimas, isn't it?
    - speaker: Rina
      text: Bukan! Dimas lucu, tapi dia tidak sabar.
      ar_eg: لأ! ديماس دمه خفيف، بس مش صبور خالص.
      ar: لا! ديماس ظريف، لكنه ليس صبورًا.
      en: No! Dimas is funny, but he isn't patient.
    - speaker: Mohamed
      text: Dia guru?
      ar_eg: هو مدرس؟
      ar: هل هو معلم؟
      en: Is he a teacher?
    - speaker: Rina
      text: Ya, dia guru. Dia yang pakai kacamata.
      ar_eg: أيوه، مدرس. هو اللي لابس نضارة.
      ar: نعم، معلم. هو الذي يلبس نظارة.
      en: Yes, he's a teacher. He's the one wearing glasses.
    - speaker: Mohamed
      text: Oh, Pak Budi!
      ar_eg: آه، الأستاذ بودي!
      ar: آه، الأستاذ بودي!
      en: Oh, Pak Budi!
new_words:
  - word: tebak
    pos: verb
    ar_eg: يخمّن
    ar: يخمّن
    en: to guess
  - word: salah
    pos: adjective
    ar_eg: غلط
    ar: خطأ
    en: wrong
review:
  status: draft
  verified: false
