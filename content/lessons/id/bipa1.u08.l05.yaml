schema: kabar.lesson/v1
id: bipa1.u08.l05
language: id
title: Wajahnya ramah
can_do:
  ar_eg: 'توصف وش حد: العينين والمناخير والودان، وتقول وسيم أو مش حلو.'
  ar: 'أن تصف وجه شخص: العينين والأنف والأذنين، وتقول وسيم أو قبيح.'
  en: 'Describe a face: eyes, nose, ears, and say handsome or not so nice.'
slides:
  - title: Wajah
    body:
      ar_eg: |
        wajah = وش (وفيه كمان muka). mata = عين (افتكر matahari: عين النهار!)، hidung = مناخير، telinga = ودن، leher = رقبة.
        tampan = وسيم، أرسمي من ganteng. jelek = وحش (في الشكل أو الجودة).
        gemuk = تخين أو مليان. للبيبي بتبقى مدح: Bayinya gemuk! بس مع الكبار قولها بلطف.
      ar: |
        wajah = وجه (ويقال أيضًا muka). mata = عين (تذكّر matahari: عين النهار!)، hidung = أنف، telinga = أذن، leher = رقبة.
        tampan = وسيم، أرسم من ganteng. jelek = قبيح أو رديء.
        gemuk = سمين أو ممتلئ، وهي مديح للرضيع: Bayinya gemuk! أما مع الكبار فقلها بلطف.
      en: |
        wajah = face (muka also works). mata = eye (remember matahari, the eye of the day!), hidung = nose, telinga = ear, leher = neck.
        tampan = handsome, more formal than ganteng. jelek = ugly, bad.
        gemuk = plump, fat. For a baby it's praise (Bayinya gemuk!); with adults, use it gently.
    examples:
      - text: Matanya besar dan rambutnya panjang.
        ar_eg: عينيها كبيرة وشعرها طويل.
        ar: عيناها واسعتان وشعرها طويل.
        en: Her eyes are big and her hair is long.
      - text: Bayinya gemuk dan lucu.
        ar_eg: البيبي مليان وعسول.
        ar: الرضيع ممتلئ ولطيف.
        en: The baby is chubby and cute.
      - text: Gadis Bali itu pakai bunga di telinga.
        ar_eg: البنت البالية دي حاطّة وردة على ودنها.
        ar: تلك الفتاة البالية تضع زهرة على أذنها.
        en: That Balinese girl wears a flower on her ear.
