  - id: e04
    type: fill_blank
    sentence: Ada ___ besar di depan kantor bupati. Ada apa?
    meaning:
      ar_eg: فيه ___ كبير قدام مكتب البوباتي. فيه إيه؟
      ar: هناك ___ كبير أمام مكتب رئيس المقاطعة. ماذا يحدث؟
      en: There's a big ___ outside the regent's office. What's going on?
    options: [kerumunan, penginapan, rintangan]
    answers: [kerumunan]
    words: [kerumunan, penginapan, rintangan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ناس سابوا بيوتهم بسبب الفيضان. اسمهم إيه؟
      ar: أناس تركوا بيوتهم بسبب الفيضان. ما اسمهم؟
      en: People who left their homes because of a flood. What are they called?
    options: [pengamat, keramaian, pengungsi]
    answer: 2
    explain:
      ar_eg: pengungsi = نازح أو لاجئ.
      ar: pengungsi = نازح، لاجئ.
      en: pengungsi = refugee, displaced person.
    words: [pengamat, keramaian, pengungsi]
  - id: e06
    type: fill_blank
    sentence: Bahasa Jawa dan Bugis ___ percakapan di pasar itu.
    meaning:
      ar_eg: الجاوي والبوجيسي ___ على الكلام في السوق ده.
      ar: تـ___ الجاوية والبوغيسية على الأحاديث في تلك السوق.
      en: Javanese and Buginese ___ conversation at that market.
    options: [mendominasi, penampungan, pengamat]
