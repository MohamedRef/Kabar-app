schema: kabar.lesson/v1
id: bipa5.u02.l09
language: id
title: Pendatang, pengungsi, keramaian
can_do:
  ar_eg: 'تتكلم عن ناس جاية تعيش في المدينة: النازحين والملاجئ والزحمة واللوكاندات، ورأي المراقبين.'
  ar: 'أن تتحدث عن القادمين إلى المدينة: النازحين والملاجئ والزحام والنُّزُل، ورأي المراقبين.'
  en: 'Talk about people coming to the city: displaced people, shelters, crowds, lodgings and what observers say.'
slides:
  - title: Kota yang cepat berubah
    body:
      ar_eg: |
        pengungsi = لاجئ أو نازح (من حرب أو فيضان)، penampungan = ملجأ أو مكان إيوا.
        kerumunan = زحمة ناس متجمعين في حتة (تجمّع)، keramaian = دوشة وزحمة وحركة (جو حيوي).
        penginapan = مكان مبيت (لوكاندة صغيرة، نُزُل)، pengamat = مراقب أو محلل (pengamat politik).
        rintangan = عقبة في الطريق، mendominasi = يسيطر أو يغلب على.
      ar: |
        pengungsi = لاجئ، نازح (من حرب أو فيضان)، penampungan = ملجأ، مأوى.
        kerumunan = حشد متجمّع في مكان، keramaian = صخب وزحام، حيوية.
        penginapan = نُزُل، مكان للمبيت، pengamat = مراقب، محلّل (pengamat politik).
        rintangan = عقبة، عائق، mendominasi = يهيمن على.
      en: |
        pengungsi = refugee, displaced person, penampungan = shelter.
        kerumunan = crowd (gathered in one spot), keramaian = bustle, hustle and noise.
        penginapan = lodging, guesthouse, pengamat = observer, commentator (pengamat politik).
        rintangan = obstacle, hurdle, mendominasi = to dominate.
    examples:
      - text: Pengungsi banjir tinggal di penampungan sementara.
        ar_eg: النازحين من الفيضان قاعدين في ملجأ مؤقت.
        ar: يقيم نازحو الفيضان في مأوى مؤقت.
        en: Flood refugees are staying in a temporary shelter.
      - text: Saya kurang suka keramaian kota besar.
        ar_eg: أنا مش بحب أوي دوشة المدن الكبيرة.
        ar: لا أحبّ كثيرًا صخب المدن الكبيرة.
        en: I don't much like the bustle of big cities.
      - text: Menurut pengamat, pendatang akan mendominasi kota baru.
        ar_eg: حسب المراقبين، الوافدين هيبقوا الأغلبية في المدينة الجديدة.
        ar: يرى المراقبون أن الوافدين سيهيمنون على المدينة الجديدة.
        en: Observers say newcomers will dominate the new city.
