    question:
      ar_eg: إيه اللي اتملى؟
      ar: ما الذي امتلأ؟
      en: What is full?
    options: [اللوكاندات, المطاعم, المدارس]
    answer: 0
    meaning:
      ar_eg: اللوكاندات اللي جنب الميناء كلها اتملت.
      ar: امتلأت النُّزُل القريبة من الميناء.
      en: The guesthouses near the port are full.
