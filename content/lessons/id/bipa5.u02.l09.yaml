  - id: e08
    type: build_sentence
    source:
      ar_eg: الملجأ ده فيه مكان لميت نازح.
      ar: يتّسع هذا المأوى لمئة نازح.
      en: This shelter has room for a hundred refugees.
    answer: Penampungan ini muat untuk seratus pengungsi.
    distractors: [pengamat, kerumunan]
    words: [penampungan, pengungsi, kerumunan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Menurut pengamat, rintangan terbesar adalah biaya.
    answers_meaning:
      ar_eg: [حسب المراقبين، أكبر عقبة هي التكلفة, المراقبين بيقولوا إن أكبر عقبة هي الفلوس]
      ar: [يرى المراقبون أن أكبر عقبة هي التكلفة, بحسب المراقبين، فإن التكلفة أكبر عائق]
      en: ['According to observers, the biggest hurdle is cost', Observers say the biggest obstacle is the cost]
    words: [pengamat, rintangan]
  - id: e10
    type: speaking
    text: Menurut pengamat, pendatang akan mendominasi kota ini.
    meaning:
      ar_eg: المراقب بيقول إن الوافدين هيسيطروا على المدينة دي.
      ar: يقول المراقب إن الوافدين سيهيمنون على هذه المدينة.
      en: The observer says newcomers will dominate this city.
    words: [pengamat, mendominasi]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, kenapa penginapan di Balikpapan penuh semua?
      ar_eg: يا ماس، ليه اللوكاندات في بالكبابان كلها مليانة؟
      ar: يا أخي، لماذا امتلأت كل النُّزُل في باليكبابان؟
      en: Why are all the guesthouses in Balikpapan full?
    - speaker: Mas Rizal
      text: Banyak pekerja proyek datang. Ada juga pengungsi banjir dari hulu sungai.
      ar_eg: عمال مشروعات كتير جم. وكمان فيه نازحين من الفيضان من أعلى النهر.
      ar: جاء كثير من عمّال المشاريع، وهناك أيضًا نازحون من فيضان أعالي النهر.
      en: Lots of project workers have come. There are also flood refugees from upriver.
    - speaker: Mohamed
      text: Mereka tinggal di mana?
      ar_eg: هم قاعدين فين؟
      ar: أين يقيمون؟
      en: Where are they staying?
    - speaker: Mas Rizal
      text: Di penampungan dekat masjid. Kalau sore, kerumunan orang mengantre makanan.
      ar_eg: في ملجأ جنب الجامع. العصر بيبقى فيه تجمع ناس واقفين طابور على الأكل.
      ar: في مأوى قرب المسجد. وفي المساء يصطفّ حشد من الناس للطعام.
      en: In a shelter near the mosque. In the afternoon a crowd queues for food.
    - speaker: Mohamed
      text: Kota ini berubah cepat. Keramaiannya sudah seperti Jakarta.
      ar_eg: المدينة دي بتتغير بسرعة. الدوشة بقت زي جاكرتا.
      ar: تتغيّر هذه المدينة بسرعة. صار صخبها كجاكرتا.
      en: This city is changing fast. The bustle is like Jakarta's now.
    - speaker: Mas Rizal
      text: Para pengamat juga bilang begitu.
      ar_eg: المراقبين كمان بيقولوا كده.
      ar: يقول المراقبون ذلك أيضًا.
      en: The observers say so too.
