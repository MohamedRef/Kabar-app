dialogue:
  title: Kos Bu Sari
  lines:
    - speaker: Mohamed
      text: Permisi, Bu. Di sini ada kamar kosong?
      ar_eg: لو سمحتي يا مدام. فيه هنا أوضة فاضية؟
      ar: عفوًا يا سيدتي، هل توجد غرفة شاغرة هنا؟
      en: Excuse me, ma'am. Is there a free room here?
    - speaker: Bu Sari
      text: Ada, Pak. Ada sebuah kamar di lantai dua.
      ar_eg: أيوه يا أستاذ. فيه أوضة في الدور التاني.
      ar: نعم يا سيدي، توجد غرفة في الطابق الثاني.
      en: Yes, sir. There's a room on the second floor.
    - speaker: Mohamed
      text: Berapa sewanya sebulan?
      ar_eg: الإيجار كام في الشهر؟
      ar: كم الإيجار في الشهر؟
      en: How much is the rent a month?
    - speaker: Bu Sari
      text: Satu juta lima ratus ribu rupiah, sudah termasuk listrik dan air.
      ar_eg: مليون وخمسمية ألف روبية، شامل الكهربا والمية.
      ar: مليون وخمسمئة ألف روبية، شاملة الكهرباء والماء.
      en: One and a half million rupiah, electricity and water included.
    - speaker: Mohamed
      text: Kamar mandinya di dalam atau di luar?
      ar_eg: الحمّام جوّه ولا بره؟
      ar: هل الحمّام في الداخل أم في الخارج؟
      en: Is the bathroom inside or outside?
    - speaker: Bu Sari
      text: Di dalam, Pak. Ada meja dan lemari juga.
      ar_eg: جوّه يا أستاذ. وفيه ترابيزة ودولاب كمان.
      ar: في الداخل يا سيدي، وفيها طاولة وخزانة أيضًا.
      en: Inside, sir. There's a desk and a wardrobe too.
    - speaker: Mohamed
      text: Boleh saya lihat kamarnya?
      ar_eg: ممكن أشوف الأوضة؟
      ar: هل يمكنني رؤية الغرفة؟
      en: May I see the room?
    - speaker: Bu Sari
      text: Silakan, Pak. Mari ke atas.
      ar_eg: اتفضل يا أستاذ. تعالى نطلع فوق.
      ar: تفضّل يا سيدي، هيّا إلى الأعلى.
      en: Please do, sir. Let's go upstairs.
    - speaker: Mohamed
      text: Kamarnya bersih dan besar. Masjid dekat dari sini, Bu?
      ar_eg: الأوضة نضيفة وكبيرة. الجامع قريب من هنا يا مدام؟
      ar: الغرفة نظيفة وواسعة. هل المسجد قريب من هنا يا سيدتي؟
      en: The room is clean and big. Is there a mosque near here, ma'am?
    - speaker: Bu Sari
      text: Dekat sekali. Masjidnya di seberang warung, di ujung gang.
      ar_eg: قريب قوي. الجامع قصاد الوارونج، في آخر الحارة.
      ar: قريب جدًّا. المسجد مقابل المطعم الصغير، في آخر الزقاق.
      en: Very close. The mosque is across from the warung, at the end of the alley.
