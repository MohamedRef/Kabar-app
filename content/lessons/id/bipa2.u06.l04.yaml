schema: kabar.lesson/v1
id: bipa2.u06.l04
language: id
title: Sofa, karpet, bantal
can_do:
  ar_eg: 'توصف شقتك وأوضها وعفشها: الكنبة والسجادة والمخدة والبطانية.'
  ar: 'أن تصف شقتك وغرفها وأثاثها: الأريكة والسجادة والوسادة والبطانية.'
  en: 'Describe your flat, its rooms and furnishings: sofa, carpet, pillow and blanket.'
slides:
  - title: Di apartemen
    body:
      ar_eg: |
        apartemen = شقة في عمارة، garasi = جراج، ruangan = أوضة أو قاعة، tembok = حيطة.
        sofa = كنبة، karpet = سجادة.
        bantal = مخدة، selimut = بطانية (أو لحاف).
      ar: |
        apartemen = شقة في بناية، garasi = مرآب، ruangan = غرفة أو قاعة، tembok = جدار.
        sofa = أريكة، karpet = سجادة.
        bantal = وسادة، selimut = بطانية (لحاف).
      en: |
        apartemen = flat, apartment, garasi = garage, ruangan = room, hall, tembok = wall.
        sofa = sofa, karpet = carpet, rug.
        bantal = pillow, selimut = blanket.
    examples:
      - text: Apartemen saya kecil, tapi ada garasi.
        ar_eg: شقتي صغيرة، بس فيها جراج.
        ar: شقتي صغيرة لكن فيها مرآب.
        en: My flat is small, but it has a garage.
      - text: Ada foto keluarga di tembok.
        ar_eg: فيه صورة العيلة على الحيطة.
        ar: على الجدار صورة العائلة.
        en: There's a family photo on the wall.
      - text: Malam ini dingin. Mana selimut saya?
        ar_eg: الليلة برد. فين البطانية بتاعتي؟
        ar: الليلة باردة. أين بطانيتي؟
        en: It's cold tonight. Where's my blanket?
