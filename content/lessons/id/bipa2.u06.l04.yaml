dialogue:
  lines:
    - speaker: Raka
      text: Wah, apartemenmu bagus! Ruangannya besar.
      ar_eg: الله، شقتك حلوة! الأوضة واسعة.
      ar: شقتك جميلة! الغرفة كبيرة.
      en: Wow, your flat is nice! The room's big.
    - speaker: Mohamed
      text: Terima kasih. Duduk di sofa, Raka.
      ar_eg: شكرًا. اقعد على الكنبة يا راكا.
      ar: شكرًا. اجلس على الأريكة يا راكا.
      en: Thanks. Have a seat on the sofa, Raka.
    - speaker: Raka
      text: Karpetnya dari mana? Bagus sekali.
      ar_eg: السجادة دي منين؟ حلوة أوي.
      ar: من أين السجادة؟ جميلة جدًا.
      en: Where's the carpet from? It's lovely.
    - speaker: Mohamed
      text: Dari pasar di Ubud. Murah!
      ar_eg: من سوق في أوبود. رخيصة!
      ar: من سوق في أوبود. رخيصة!
      en: From a market in Ubud. Cheap!
    - speaker: Raka
      text: Di tembok itu ada foto siapa?
      ar_eg: مين اللي في الصورة اللي على الحيطة؟
      ar: صورة من على ذلك الجدار؟
      en: Whose photo is on that wall?
    - speaker: Mohamed
      text: Keluarga saya di Kairo.
      ar_eg: عيلتي في القاهرة.
      ar: عائلتي في القاهرة.
      en: My family in Cairo.
