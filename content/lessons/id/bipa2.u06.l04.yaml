    type: multiple_choice
    question_meaning:
      ar_eg: عايز تعرف الإيجار كام في الشهر. تسأل إيه؟
      ar: تريد أن تعرف الإيجار الشهري. ماذا تسأل؟
      en: You want to know the monthly rent. What do you ask?
    options: ["Berapa sewanya sebulan?", "Kamar mandinya di mana?", "Ada kamar kosong?"]
    answer: 0
    words: [sewa]
  - id: e02
    type: listen
    text: Sudah termasuk listrik dan air.
    options: ["Belum termasuk listrik dan air.", "Sudah termasuk listrik, tetapi air belum.", "Sudah termasuk listrik dan air."]
    answer: 2
    words: [termasuk, listrik]
  - id: e03
    type: fill_blank
    sentence: Permisi, Bu. Ada kamar ___?
    meaning:
      ar_eg: لو سمحتي يا مدام. فيه أوضة فاضية؟
      ar: عفوًا يا سيدتي، هل توجد غرفة شاغرة؟
      en: Excuse me, ma'am. Is there a free room?
    options: ["termasuk", "sewa", "kosong"]
    answers: [kosong]
    words: [kosong]
  - id: e04
    type: fill_blank
    sentence: Boleh saya ___ kamarnya?
    meaning:
      ar_eg: ممكن أشوف الأوضة؟
      ar: هل يمكنني رؤية الغرفة؟
      en: May I see the room?
    answers: [lihat, melihat]
    explain:
