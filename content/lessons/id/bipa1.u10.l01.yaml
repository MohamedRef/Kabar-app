schema: kabar.lesson/v1
id: bipa1.u10.l01
language: id
title: Kemarin saya…
can_do:
  ar_eg: تتكلم عن اللي فات بكلمات الوقت.
  ar: أن تتحدث عن الماضي بظروف الزمان.
  en: Talk about the past with time words.
slides:
  - title: Tidak ada past tense
    body:
      ar_eg: |
        الفعل الإندونيسي مابيتغيرش أبدًا: pergi = راح / بيروح / هيروح.
        طب نعرف الزمن إزاي؟ من كلمة الوقت! حطها في الأول أو في الآخر:
        - Kemarin saya ke pasar = امبارح رحت السوق.
        - Saya ke pasar kemarin = نفس المعنى.
      ar: |
        لا يتصرف الفعل الإندونيسي أبدًا: pergi = ذهب / يذهب / سيذهب.
        فكيف نعرف الزمن؟ من ظرف الزمان، في أول الجملة أو آخرها:
        - Kemarin saya ke pasar = أمس ذهبت إلى السوق.
        - Saya ke pasar kemarin = بالمعنى نفسه.
      en: |
        The Indonesian verb never changes: pergi = went / go / will go.
        So how do you know when? From the time word, at the start or the end:
        - Kemarin saya ke pasar = Yesterday I went to the market.
        - Saya ke pasar kemarin = same meaning.
    grammar: id.time.sequence
    examples:
      - text: Kemarin saya naik kapal ke Pulau Seribu.
        ar_eg: امبارح ركبت مركب لجزر الألف.
        ar: أمس ركبت قاربًا إلى جزر الألف.
        en: Yesterday I took a boat to the Thousand Islands.
  - title: Kemarin dulu, minggu lalu
    body:
      ar_eg: |
        انت عارف من الوحدة 6: kemarin وtadi وsekarang وnanti، وsebelum وsesudah. الجديد هنا:
        - kemarin dulu = أول امبارح
        lalu بعد كلمة الوقت = «اللي فات»:
        - minggu lalu = الأسبوع اللي فات
        - bulan lalu = الشهر اللي فات
        - tahun lalu = السنة اللي فاتت
        (افتكر إن lalu بين جملتين معناها «وبعدين»: مكانها بيفرق.)
      ar: |
        تعرف من الوحدة 6: kemarin وtadi وsekarang وnanti، وsebelum وsesudah. والجديد هنا:
        - kemarin dulu = أول أمس
        lalu بعد كلمة الزمن = «الماضي»:
        - minggu lalu = الأسبوع الماضي
        - bulan lalu = الشهر الماضي
        - tahun lalu = العام الماضي
        (وتذكّر أن lalu بين جملتين تعني «ثم»؛ فموضعها يحدد معناها.)
      en: |
        You know kemarin, tadi, sekarang, nanti, sebelum and sesudah from Unit 6. New here:
        - kemarin dulu = the day before yesterday
        lalu after a time word = "last":
        - minggu lalu = last week
        - bulan lalu = last month
        - tahun lalu = last year
        (Remember: between two clauses lalu means "then" — position decides.)
    grammar: id.time.sequence
    examples:
      - text: Tahun lalu saya di Kairo. Sekarang saya di Jakarta.
        ar_eg: السنة اللي فاتت كنت في القاهرة. دلوقتي أنا في جاكرتا.
        ar: العام الماضي كنت في القاهرة، والآن أنا في جاكرتا.
        en: Last year I was in Cairo. Now I'm in Jakarta.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kemarin dulu
        ar_eg: أول امبارح
        ar: أول أمس
        en: the day before yesterday
      - text: minggu lalu
        ar_eg: الأسبوع اللي فات
        ar: الأسبوع الماضي
        en: last week
      - text: bulan lalu
        ar_eg: الشهر اللي فات
        ar: الشهر الماضي
        en: last month
      - text: tahun lalu
        ar_eg: السنة اللي فاتت
        ar: العام الماضي
        en: last year
      - text: kepulauan
        ar_eg: جزر (أرخبيل)
        ar: أرخبيل
        en: islands, archipelago
      - text: laut
        ar_eg: بحر
        ar: بحر
        en: sea
    words: [kemarin dulu, minggu lalu, bulan lalu, tahun lalu, kepulauan, laut]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: النهارده السبت. الحاجة حصلت يوم الجمعة. تقول إيه؟
      ar: اليوم السبت، والحدث كان يوم الجمعة. ماذا تقول؟
      en: Today is Saturday. It happened on Friday. Which word?
    options: [tadi, kemarin dulu, kemarin]
    answer: 2
    explain:
      ar_eg: الجمعة امبارح، يعني kemarin. tadi للنهارده بس.
      ar: الجمعة هي أمس، أي kemarin، وtadi لليوم نفسه.
      en: Friday is yesterday → kemarin; tadi is only for today.
    words: [kemarin, tadi, kemarin dulu]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: (افتكر من الوحدة 6) «النهارده الصبح، بدري» تبقى إيه؟
      ar: (تذكّر من الوحدة 6) كيف تقول «هذا الصباح، قبل قليل»؟
      en: (Recall from Unit 6) How do you say "this morning, earlier"?
    options: [kemarin pagi, tadi pagi, nanti pagi]
    answer: 1
    explain:
      ar_eg: tadi = من شوية، النهارده بس. nanti للي جاي، وkemarin لامبارح.
      ar: tadi = قبل قليل من اليوم نفسه؛ nanti للآتي، وkemarin لأمس.
      en: tadi = earlier today only; nanti is still to come, kemarin is yesterday.
    words: [tadi, nanti, kemarin]
  - id: e04
    type: listen
    text: Minggu lalu saya ke Bandung.
    options: [Minggu lalu saya ke Bandung., Minggu depan saya ke Bandung., Kemarin saya ke Bandung.]
    answer: 0
    words: [minggu lalu]
  - id: e05
    type: fill_blank
    sentence: ___ saya di Kairo. Sekarang saya di Jakarta.
    meaning:
      ar_eg: السنة اللي فاتت كنت في القاهرة. دلوقتي أنا في جاكرتا.
      ar: العام الماضي كنت في القاهرة، والآن أنا في جاكرتا.
      en: Last year I was in Cairo. Now I'm in Jakarta.
    options: [Besok, Nanti, Tahun lalu]
    answers: [Tahun lalu]
    words: [tahun lalu, sekarang]
    explain:
      ar_eg: الجملة عن الماضي (ودلوقتي في جاكرتا)، فـ Tahun lalu = السنة اللي فاتت. Besok وNanti للمستقبل.
      ar: "الحديث عن الماضي: Tahun lalu أي العام الماضي. Besok وNanti للمستقبل."
      en: The past needs Tahun lalu (last year); Besok and Nanti are future.
  - id: e06
    type: fill_blank
    sentence: ___ naik kapal ke Kepulauan Seribu, kami makan.
    meaning:
      ar_eg: قبل ما نركب المركب لجزر سريبو، كلنا.
      ar: قبل أن نركب القارب إلى جزر سريبو، أكلنا.
      en: Before boarding the boat to the Thousand Islands, we ate.
    options: [Sesudah, Sebelum, Lalu]
    answers: [Sebelum]
    explain:
      ar_eg: '(من الوحدة 6) sebelum = قبل، sesudah / setelah = بعد.'
      ar: '(من الوحدة 6) sebelum = قبل، وsesudah / setelah = بعد.'
      en: '(From Unit 6) sebelum = before, sesudah / setelah = after.'
    words: [sebelum, sesudah, kapal, kepulauan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الشهر اللي فات رحت جزر سريبو.
      ar: ذهبت الشهر الماضي إلى جزر سريبو.
      en: Last month I went to the Thousand Islands.
    answer: Bulan lalu saya ke Kepulauan Seribu.
    alternatives: [Saya ke Kepulauan Seribu bulan lalu.]
    distractors: [tadi, di]
    words: [bulan lalu, kepulauan]
    explain:
      ar_eg: Bulan lalu (الشهر اللي فات) + saya ke + Kepulauan Seribu. tadi وdi زيادة.
      ar: Bulan lalu saya ke Kepulauan Seribu. tadi وdi زائدتان.
      en: Bulan lalu + saya ke + Kepulauan Seribu. tadi and di are extra.
  - id: e08
    type: dictation
    text: Kemarin dulu saya ke pulau.
    meaning:
      ar_eg: أول امبارح رحت الجزيرة.
      ar: ذهبت أول أمس إلى الجزيرة.
      en: The day before yesterday I went to the island.
    words: [kemarin dulu, pulau]
  - id: e09
    type: speaking
    text: Kemarin saya naik kapal ke pulau. Setelah itu, saya berenang di laut.
    meaning:
      ar_eg: امبارح ركبت مركب للجزيرة. بعد كده، عُمت في البحر.
      ar: أمس ركبت قاربًا إلى الجزيرة، وبعد ذلك سبحت في البحر.
      en: Yesterday I took a boat to the island. After that, I swam in the sea.
    words: [kemarin, kapal, pulau, setelah, laut]
  - id: e10
    type: listen
    text: Bulan lalu kami naik kapal ke pulau.
    options: ['Bulan lalu kami naik kapal ke pulau.', 'Minggu lalu kami naik kapal ke pulau.', 'Tahun lalu kami naik kapal ke pulau.', 'Bulan lalu kami berenang di laut.']
    answer: 0
    meaning:
      ar_eg: الشهر اللي فات ركبنا مركب للجزيرة.
      ar: الشهر الماضي ركبنا السفينة إلى الجزيرة.
      en: Last month we took a boat to the island.
    words: [bulan lalu, minggu lalu, tahun lalu, kapal, pulau, laut]
dialogue:
  title: Hari Senin pagi
  lines:
    - speaker: Pak Irwan
      text: Selamat pagi, Mohamed! Kemarin kamu ke mana?
      ar_eg: صباح الخير يا محمد! امبارح رحت فين؟
      ar: صباح الخير يا محمد! إلى أين ذهبت أمس؟
      en: Good morning, Mohamed! Where did you go yesterday?
    - speaker: Mohamed
      text: Kemarin saya ke Kepulauan Seribu, Pak. Saya naik kapal.
      ar_eg: امبارح رحت جزر الألف يا أستاذ. ركبت مركب.
      ar: أمس ذهبت إلى جزر الألف يا أستاذ، وركبت قاربًا.
      en: Yesterday I went to the Thousand Islands, sir. I took a boat.
    - speaker: Pak Irwan
      text: Wah, bagus! Kamu berenang?
      ar_eg: الله، حلو! عُمت؟
      ar: رائع! هل سبحت؟
      en: Wow, great! Did you swim?
    - speaker: Mohamed
      text: Ya. Setelah makan siang, kami berenang di laut.
      ar_eg: أيوه. بعد الغدا عُمنا في البحر.
      ar: نعم، بعد الغداء سبحنا في البحر.
      en: Yes. After lunch we swam in the sea.
    - speaker: Pak Irwan
      text: Sekarang kamu capek, ya?
      ar_eg: دلوقتي إنت تعبان، صح؟
      ar: أنت متعب الآن، أليس كذلك؟
      en: You're tired now, aren't you?
    - speaker: Mohamed
      text: Sedikit, Pak. Tadi pagi saya bangun jam sembilan!
      ar_eg: شوية يا أستاذ. النهارده الصبح صحيت الساعة تسعة!
      ar: قليلًا يا أستاذ. استيقظت هذا الصباح في التاسعة!
      en: A little, sir. This morning I woke up at nine!
