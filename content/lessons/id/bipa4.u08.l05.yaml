schema: kabar.lesson/v1
id: bipa4.u08.l05
language: id
title: Kalung mutiara sang janda
can_do:
  ar_eg: 'تحكي حكاية شعبية عن أرملة وابنها اليتيم: الغيرة والتضحية والنصيحة.'
  ar: 'أن تروي حكاية شعبية عن أرملة وابنها اليتيم: الحسد والتضحية والنصيحة.'
  en: 'Tell a folk tale about a widow and her orphan son: envy, sacrifice and advice.'
slides:
  - title: Dahulu kala di pinggir hutan
    body:
      ar_eg: |
        janda = أرملة (أو مطلّقة)، yatim = يتيم (anak yatim)، nasihat = نصيحة.
        kalung = عقد، سلسلة، mutiara = لولي (kalung mutiara = عقد لولي).
        iri = غيران، حسود (iri pada = غيران من)، pengorbanan = تضحية، harimau = نمر.
      ar: |
        janda = أرملة (أو مطلّقة)، yatim = يتيم (anak yatim)، nasihat = نصيحة.
        kalung = قلادة، mutiara = لؤلؤ (kalung mutiara = قلادة لؤلؤ).
        iri = حاسد، غيور (iri pada = يحسد)، pengorbanan = تضحية، harimau = نمر.
      en: |
        janda = widow (or divorcee), yatim = orphan (anak yatim), nasihat = advice.
        kalung = necklace, mutiara = pearl (kalung mutiara = pearl necklace).
        iri = envious, jealous (iri pada = envious of); pengorbanan = sacrifice; harimau = tiger.
    examples:
      - text: Dahulu kala, seorang janda tinggal dengan anak yatimnya.
        ar_eg: زمان أوي، كان فيه أرملة عايشة مع ابنها اليتيم.
        ar: في قديم الزمان عاشت أرملة مع ابنها اليتيم.
        en: Long ago, a widow lived with her orphaned son.
      - text: Dia hanya punya satu kalung mutiara.
        ar_eg: ما كانش عندها غير عقد لولي واحد.
        ar: لم تكن تملك إلا قلادة لؤلؤ واحدة.
        en: She owned only one pearl necklace.
      - text: Tetangganya iri pada kalung itu.
        ar_eg: جارتها كانت غيرانة من العقد ده.
        ar: كانت جارتها تحسدها على تلك القلادة.
        en: Her neighbour envied that necklace.
