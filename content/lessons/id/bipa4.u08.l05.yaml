  - id: e03
    type: listen
    text: Ibunya selalu memberi nasihat yang baik.
    question:
      ar_eg: أمه بتديله إيه؟
      ar: ماذا تعطيه أمه؟
      en: What does his mother give him?
    options: [نصيحة, عقد, فلوس]
    answer: 0
    meaning:
      ar_eg: أمه دايمًا بتديله نصايح كويسة.
      ar: كانت أمه تقدّم له دائمًا نصائح طيبة.
      en: His mother always gave good advice.
    words: [nasihat]
  - id: e04
    type: fill_blank
    sentence: Sejak ayahnya wafat, dia menjadi anak ___.
    meaning:
      ar_eg: من ساعة ما أبوه مات، بقى ___.
      ar: منذ وفاة أبيه صار ___.
      en: Since his father died, he has been an ___.
    options: [yatim, janda, iri]
    answers: [yatim]
    words: [yatim, janda, iri]
    explain:
      ar_eg: yatim = يتيم، والأب مات. janda = أرملة (للست)، وiri = غيران.
      ar: yatim = اليتيم، فقد مات أبوه. أما janda فالأرملة، وiri حاسد.
      en: yatim means fatherless, since his father died. janda is a widow, and iri is envious.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حيوان كبير مخطط بيعيش في الغابة. ده إيه؟
      ar: حيوان كبير مخطّط يعيش في الغابة. ما هو؟
      en: A big striped animal that lives in the forest. What is it?
    options: [kalung, harimau, mutiara]
    answer: 1
    explain:
      ar_eg: harimau = نمر.
      ar: harimau = نمر.
      en: harimau = tiger.
    words: [kalung, harimau, mutiara]
  - id: e06
    type: fill_blank
    sentence: Ibu itu menjual ___ emasnya untuk membayar sekolah anaknya.
    meaning:
      ar_eg: الأم دي باعت ___ الدهب بتاعها عشان تدفع مدرسة ابنها.
      ar: باعت الأم ___ ها الذهبية لتدفع رسوم مدرسة ابنها.
      en: The mother sold her gold ___ to pay for her son's school.
    options: [kalung, nasihat, harimau]
    answers: [kalung]
    words: [kalung, nasihat, harimau, pengorbanan]
    explain:
      ar_eg: kalung emas = سلسلة دهب، وده اللي بيتباع. nasihat = نصيحة، وharimau = نمر.
      ar: kalung emas = قلادة ذهب، وهي ما يُباع. أما nasihat فالنصيحة، وharimau النمر.
      en: kalung emas is a gold necklace, something you can sell. nasihat is advice, and harimau is a tiger.
  - id: e07
    type: multiple_choice
    question: Itu adalah ___ seorang ibu untuk anaknya.
    options: [janda, iri, pengorbanan]
    answer: 2
    explain:
      ar_eg: pengorbanan = تضحية.
      ar: pengorbanan = تضحية.
      en: pengorbanan = sacrifice.
    words: [janda, iri, pengorbanan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الجيران كانوا غيرانين من الأرملة الطيبة دي.
      ar: كان الجيران يحسدون تلك الأرملة الطيبة.
      en: The neighbours envied that kind widow.
    answer: Tetangga iri pada janda yang baik itu.
    distractors: [mutiara, yatim]
    words: [iri, janda, mutiara, yatim]
    explain:
      ar_eg: iri pada = غيران من، وjanda = أرملة. mutiara = لولي، وyatim = يتيم، ومش في الجملة.
      ar: iri pada = يحسد، وjanda = الأرملة. أما mutiara فاللؤلؤ، وyatim اليتيم، وليسا في الجملة.
      en: iri pada means envious of, and janda is a widow. mutiara (pearl) and yatim (orphan) aren't in the sentence.
  - id: e09
    type: translate
    direction: from_target
    source_text: Kalung mutiara itu hadiah dari suaminya.
    answers_meaning:
      ar_eg: [عقد اللولي ده هدية من جوزها, العقد اللولي ده جوزها كان جايبهولها هدية]
      ar: [قلادة اللؤلؤ تلك هدية من زوجها, كانت تلك القلادة اللؤلؤية هدية من زوجها]
      en: [That pearl necklace was a gift from her husband, 'The pearl necklace was her husband''s present']
    words: [kalung, mutiara]
  - id: e10
    type: speaking
    text: Janda itu memberi nasihat kepada anak yatimnya.
    meaning:
      ar_eg: الأرملة دي نصحت ابنها اليتيم.
      ar: نصحت تلك الأرملة ابنها اليتيم.
      en: The widow gave advice to her orphaned son.
    words: [janda, nasihat, yatim, harimau, pengorbanan]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Mohamed, mau dengar cerita rakyat dari Bone?
      ar_eg: يا محمد، عايز تسمع حكاية شعبية من بوني؟
      ar: يا محمد، هل تريد أن تسمع حكاية شعبية من بوني؟
      en: Mohamed, want to hear a folk tale from Bone?
    - speaker: Mohamed
      text: Mau! Tentang apa?
      ar_eg: آه! عن إيه؟
      ar: نعم! عن ماذا؟
      en: Yes! What's it about?
    - speaker: Mas Rizal
      text: Tentang seorang janda miskin dan anak yatimnya. Dia hanya punya kalung mutiara.
      ar_eg: عن أرملة فقيرة وابنها اليتيم. ما كانش عندها غير عقد لولي.
      ar: عن أرملة فقيرة وابنها اليتيم، لا تملك إلا قلادة لؤلؤ.
      en: About a poor widow and her orphaned son. All she had was a pearl necklace.
    - speaker: Mohamed
      text: Terus? Ada yang iri?
      ar_eg: وبعدين؟ حد غار منها؟
      ar: ثم؟ هل حسدها أحد؟
      en: And then? Was someone jealous?
    - speaker: Mas Rizal
      text: Iya. Tapi pas harimau datang ke desa, dia jual kalungnya buat nolong semua orang. Itu pengorbanan besar.
      ar_eg: أيوه. بس لما النمر جه القرية، باعت العقد عشان تنقذ الكل. دي تضحية كبيرة.
      ar: نعم. لكن حين جاء النمر إلى القرية باعت قلادتها لتنقذ الجميع. تلك تضحية عظيمة.
      en: Yes. But when a tiger came to the village, she sold her necklace to save everyone. That's a big sacrifice.
