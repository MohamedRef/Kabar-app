schema: kabar.lesson/v1
id: bipa7.u09.l06
language: id
title: Ulangan Unit 9
can_do:
  ar_eg: تتكلّم عن العيشة مع الاختلاف، بالمفردات الصح والتعبيرات الاصطلاحية.
  ar: أن تتحدّث عن العيش مع الاختلاف، بالمفردات المناسبة والتعابير الاصطلاحية.
  en: Talk about living with difference, with the right vocabulary and idioms.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kepala batu
        ar_eg: دماغه ناشفة
        ar: عنيد
        en: stubborn
      - text: sila
        ar_eg: مبدأ (من الخمسة)
        ar: مبدأ (من الخمسة)
        en: principle (one of the five)
      - text: kerukunan
        ar_eg: وئام
        ar: وئام
        en: harmony
      - text: tenggang rasa
        ar_eg: مراعاة شعور الغير
        ar: مراعاة مشاعر الآخرين
        en: consideration for others
      - text: prasangka
        ar_eg: حكم مسبق
        ar: حكم مسبق
        en: prejudice
    words: [kepala batu, sila, kerukunan, tenggang rasa, prasangka]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Bhinneka Tunggal Ika» مكتوب على أنهي رمز؟
      ar: على أيّ رمز يُكتب «Bhinneka Tunggal Ika»؟
      en: Which symbol carries "Bhinneka Tunggal Ika"?
    options:
      - العلم الأحمر والأبيض.
      - نسر الجارودا، شعار الدولة.
      - العملة الورق.
    answer: 1
    words: [Bhinneka Tunggal Ika, lambang negara]
  - id: e03
    type: fill_blank
    sentence: Penyanyi muda dari Biak itu sedang ___. Lagunya diputar di mana-mana.
    meaning:
      ar_eg: المغنّي الشاب من بياك مكسّر الدنيا. أغنيته شغّالة في كل حتة.
      ar: ذاع صيت المغنّي الشاب من بياك، وأغنيته تُذاع في كلّ مكان.
      en: That young singer from Biak is all the rage. His song is playing everywhere.
    options: [naik daun, bermuka dua, besar kepala]
    answers: [naik daun]
    words: [naik daun, bermuka dua, besar kepala]
  - id: e04
    type: listen
    text: Di Sentani, warga dari berbagai suku bangsa hidup berdampingan dengan harmonis.
    question:
      ar_eg: الناس في سينتاني عايشين إزاي؟
      ar: كيف يعيش الأهالي في سينتاني؟
      en: How do people in Sentani live?
    options:
      - كل عِرق في حتة لوحده.
      - في خناق دايم.
      - جنب بعض في تناغم.
    answer: 2
    words: [suku bangsa, hidup berdampingan, harmonis]
  - id: e05
    type: build_sentence
    source:
      ar_eg: البانتشاسيلا فيها خمس مبادئ.
      ar: تتضمّن البانتشاسيلا خمسة مبادئ.
      en: Pancasila has five principles.
    answer: Pancasila terdiri atas lima sila.
    distractors: [semboyan, kerukunan]
    words: [Pancasila, sila, semboyan]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيه أحسن رد على تعليق فيه خطاب كراهية؟
      ar: ما أفضل ردّ على تعليق فيه خطاب كراهية؟
      en: What's the best response to a hate-speech comment?
    options:
      - تبلّغ عنه وماتشيّروش.
      - تشيّره علشان الناس تشوفه.
      - تردّ بإهانة.
    answer: 0
    words: [ujaran kebencian]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المدرسة الشاملة بتعلّم الأطفال يحترموا بعض.
      ar: تعلّم المدرسة الجامعة الأطفال احترام بعضهم بعضًا.
      en: An inclusive school teaches children to respect one another.
    answers:
      - Sekolah yang inklusif mengajari anak-anak untuk saling menghargai.
      - Sekolah inklusif mengajari anak-anak saling menghargai.
      - Sekolah yang inklusif mengajar anak-anak untuk saling menghargai.
      - Sekolah yang inklusif mengajarkan anak-anak untuk saling menghargai.
    words: [inklusif, saling menghargai]
  - id: e08
    type: speaking
    text: Keadilan sosial berarti tidak ada diskriminasi bagi siapa pun.
    meaning:
      ar_eg: العدالة الاجتماعية معناها مافيش تمييز ضد أي حد.
      ar: العدالة الاجتماعية تعني ألّا تمييز ضدّ أحد.
      en: Social justice means no discrimination against anyone.
    words: [keadilan sosial, diskriminasi]
  - id: e09
    type: dictation
    text: Pancasila adalah dasar negara, dan ketuhanan adalah sila pertamanya.
    meaning:
      ar_eg: البانتشاسيلا أساس الدولة، والإيمان بالله هو أول مبدأ فيها.
      ar: البانتشاسيلا أساس الدولة، والإيمان بالإله مبدؤها الأول.
      en: Pancasila is the state foundation, and belief in God is its first principle.
    words: [dasar negara, ketuhanan]
  - id: e10
    type: translate
    direction: from_target
    source_text: Jangan besar kepala karena mayoritas, dan jangan angkat tangan karena minoritas.
    answers_meaning:
      ar_eg:
        - ماتبقاش شايف نفسك علشان إنت من الأغلبية، وماتستسلمش علشان إنت من الأقلية.
        - لو إنت أغلبية ماتتكبّرش، ولو أقلية ماترفعش الراية البيضا.
      ar:
        - لا تغترّ لأنّك من الأغلبية، ولا تستسلم لأنّك من الأقلّية.
        - لا يُغرّك أنّك من الأكثرية، ولا يُيئسك أنّك من الأقلّية.
      en:
        - Don't be conceited for being in the majority, and don't give up for being in the minority.
        - Being the majority is no reason for arrogance; being the minority is no reason to give up.
    words: [besar kepala, angkat tangan]
dialogue:
  title: Perahu di Danau Sentani
  lines:
    - speaker: Kak Yosua
      text: Festival tahun ini ramai sekali. Penari perahu datang dari banyak kampung.
      ar_eg: مهرجان السنة دي زحمة قوي. راقصين المراكب جايين من قرى كتير.
      ar: مهرجان هذا العام مزدحم جدًّا، وجاء راقصو القوارب من قرى كثيرة.
      en: This year's festival is packed. Boat dancers came from many villages.
    - speaker: Mohamed
      text: Dan penontonnya juga beragam. Ada turis, ada warga Bugis, ada mama-mama Sentani.
      ar_eg: والمتفرّجين كمان متنوّعين. فيه سيّاح، وبوجيس، وستّات من سينتاني.
      ar: والمتفرّجون متنوّعون أيضًا، سيّاح وبوغيس ونساء سينتاني.
      en: And the crowd is varied too. Tourists, Bugis residents, Sentani mamas.
    - speaker: Kak Yosua
      text: Itulah kerukunan. Kamu sudah melihatnya sendiri, bukan hanya membacanya.
      ar_eg: هو ده الوئام. إنت شفته بعينك، مش بس قريت عنه.
      ar: هذا هو الوئام، رأيته بعينك لا في الكتب فقط.
      en: That's harmony. You've seen it yourself, not just read about it.
    - speaker: Mohamed
      text: Terima kasih, Kak. Perhentian terakhir saya Lembah Baliem, di Wamena.
      ar_eg: شكرًا يا كاك. آخر محطّة ليّا وادي باليم، في وامينا.
      ar: شكرًا يا كاك. محطّتي الأخيرة وادي باليم في وامينا.
      en: Thank you, Kak. My last stop is the Baliem valley, in Wamena.
souvenir:
  id: bipa7.u09.souvenir
  title: Festival Danau Sentani
  note:
    ar_eg: بحيرة سينتاني جنب جايابورا، وحواليها قرى كتير بيوتها على أعمدة فوق المية. في مهرجان البحيرة السنوي، الرقّاصين بيرقصوا وهم واقفين على مراكب، وفيه كمان رسومات تقليدية على قشر الشجر. وبمناسبة الوحدة دي، شعار «Bhinneka Tunggal Ika»، يعني الوحدة في التنوّع، هو الشعار الوطني، وأصله باللغة الجاوية القديمة.
    ar: تقع بحيرة سينتاني قرب جايابورا، وتحيط بها قرى كثيرة بيوتها على أعمدة فوق الماء. وفي مهرجانها السنوي يرقص الراقصون وقوفًا على القوارب، وتُعرض رسوم تقليدية على لحاء الشجر. وشعار «Bhinneka Tunggal Ika»، أي الوحدة في التنوّع، هو الشعار الوطني، وأصله باللغة الجاوية القديمة.
    en: Lake Sentani lies near Jayapura, ringed by villages of houses on stilts over the water. At its yearly festival dancers perform standing on boats, and traditional bark paintings are on show. "Bhinneka Tunggal Ika", unity in diversity, is the national motto, in Old Javanese.
