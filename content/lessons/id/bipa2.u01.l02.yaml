schema: kabar.lesson/v1
id: bipa2.u01.l02
language: id
title: Paling indah, terbesar
can_do:
  ar_eg: تقول «الأكبر» و«الأحلى» و«الأحسن».
  ar: أن تعبّر عن التفضيل المطلق («الأكبر»، «الأجمل»).
  en: Say "the most".
slides:
  - title: Paling + sifat
    body:
      ar_eg: |
        عشان تقول «الأكبر» أو «الأحلى» حط paling قبل الصفة:
        besar → paling besar = الأكبر
        indah → paling indah = الأجمل
        دي الطريقة اللي تنفع مع أي صفة، في أي وقت.
      ar: |
        للتفضيل المطلق ضع paling قبل الصفة:
        besar → paling besar = الأكبر
        indah → paling indah = الأجمل
        وهذه الطريقة تصلح مع كل الصفات.
      en: |
        To say "the biggest" or "the most beautiful", put paling before the adjective:
        besar → paling besar = biggest
        indah → paling indah = most beautiful
        This works with every adjective.
    grammar: id.comparison.ter-paling
    examples:
      - text: Gong adalah alat musik paling besar dalam gamelan.
        ar_eg: الجونج أكبر آلة في الجاميلان.
        ar: الغونغ أكبر آلة في الغاميلان.
        en: The gong is the biggest instrument in a gamelan.
      - text: Mana yang paling enak?
        ar_eg: أنهي أحلى واحد؟
        ar: أيها ألذ؟
        en: Which is the tastiest?
  - title: Ter- + sifat
    body:
      ar_eg: |
        طريقة تانية: ter- + الصفة. نفس المعنى بس أرسمي شوية، وبتشوفها كتير في الإعلانات والأخبار:
        besar → terbesar (الأكبر)، baik → terbaik (الأحسن)، mahal → termahal (الأغلى)، murah → termurah (الأرخص).
        terbaik قريبة أوي من «الأفضل».
      ar: |
        وطريقة ثانية: ter- + الصفة، بالمعنى نفسه لكنها أكثر رسمية، وتكثر في الإعلانات والأخبار:
        terbesar (الأكبر)، terbaik (الأفضل)، termahal (الأغلى)، termurah (الأرخص).
      en: |
        Second way: ter- + adjective. Same meaning, a bit more formal; you'll see it in ads and the news:
        terbesar (biggest), terbaik (best), termahal (most expensive), termurah (cheapest).
    grammar: id.comparison.ter-paling
    examples:
      - text: Ini restoran terbaik di Ubud.
        ar_eg: ده أحسن مطعم في أوبود.
        ar: هذا أفضل مطعم في أوبود.
        en: This is the best restaurant in Ubud.
      - text: Harga termurah!
        ar_eg: أرخص سعر!
        ar: أرخص سعر!
        en: Lowest price!
  - title: Paling … di / dari …
    body:
      ar_eg: |
        «الأكبر في…» = paling … di + مكان. «الأحسن من…» = paling … dari + مجموعة.
        Pura ini paling indah di Ubud = المعبد ده أجمل واحد في أوبود.
        وللسؤال: Mana yang paling …? = أنهي الأكتر…؟
      ar: |
        «الأكبر في…» = paling … di + مكان، و«الأفضل من…» = paling … dari + مجموعة.
        Pura ini paling indah di Ubud = هذا المعبد أجمل معبد في أوبود.
        وللسؤال: Mana yang paling …؟ = أيها الأكثر…؟
      en: |
        "The most … in …" = paling … di + place; "of …" = dari + group.
        Pura ini paling indah di Ubud = This temple is the most beautiful in Ubud.
        Ask: Mana yang paling …? = Which is the most …?
    grammar: id.comparison.ter-paling
    examples:
      - text: Pura ini paling indah di Ubud.
        ar_eg: المعبد ده أجمل معبد في أوبود.
        ar: هذا المعبد أجمل معبد في أوبود.
        en: This temple is the most beautiful in Ubud.
      - text: Gitar ini paling murah dari semua.
        ar_eg: الجيتار ده أرخص واحد فيهم كلهم.
        ar: هذه القيثارة أرخصها جميعًا.
        en: This guitar is the cheapest of all.
  - title: Hati-hati dengan ter-
    body:
      ar_eg: |
        - واحدة بس: paling besar أو terbesar، مش paling terbesar.
        - ter- مش دايمًا «الأكتر»! terkenal يعني «مشهور» بس، مش «الأشهر».
        Gamelan Bali terkenal di dunia = الجاميلان البالي مشهور في العالم. (dunia جاية من العربي «دنيا».)
      ar: |
        - استعمل إحداهما فقط: paling besar أو terbesar، لا paling terbesar.
        - وليست ter- دائمًا للتفضيل: terkenal تعني «مشهور» لا «الأشهر».
        Gamelan Bali terkenal di dunia = الغاميلان البالي مشهور في العالم. (وdunia من العربية «دنيا».)
      en: |
        - Use one: paling besar or terbesar, never paling terbesar.
        - ter- isn't always "most": terkenal just means "famous".
        Gamelan Bali terkenal di dunia = Balinese gamelan is famous around the world. (dunia comes from Arabic «دنيا».)
    grammar: id.comparison.ter-paling
    examples:
      - text: Gamelan Bali terkenal di dunia.
        ar_eg: الجاميلان البالي مشهور في العالم.
        ar: الغاميلان البالي مشهور في العالم.
        en: Balinese gamelan is famous around the world.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: paling besar
        ar_eg: الأكبر
        ar: الأكبر
        en: the biggest
      - text: terbaik
        ar_eg: الأحسن
        ar: الأفضل
        en: the best
      - text: termahal
        ar_eg: الأغلى
        ar: الأغلى
        en: the most expensive
      - text: termurah
        ar_eg: الأرخص
        ar: الأرخص
        en: the cheapest
      - text: dunia
        ar_eg: الدنيا، العالم
        ar: العالم
        en: world
      - text: pura
        ar_eg: معبد هندوسي (بالي)
        ar: معبد هندوسي
        en: Balinese temple
    words: [paling, terbaik, termahal, termurah, dunia, pura]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options: [Gong ini paling besar., Gong ini paling terbesar., Gong ini besar paling.]
    answer: 0
    explain:
      ar_eg: paling قبل الصفة، ومتجمعش paling وter- مع بعض.
      ar: paling تسبق الصفة، ولا تُجمع مع ter-.
      en: paling goes before the adjective, and never together with ter-.
    words: [paling, besar]
  - id: e03
    type: listen
    text: Ini restoran terbaik di Ubud.
    options: [Ini restoran terbesar di Ubud., Ini restoran terbaik di Ubud., Ini restoran termurah di Ubud.]
    answer: 1
    words: [terbaik]
  - id: e04
    type: fill_blank
    sentence: Pura ini ___ indah di desa ini.
    meaning:
      ar_eg: المعبد ده أجمل معبد في القرية دي.
      ar: هذا المعبد أجمل معبد في هذه القرية.
      en: This temple is the most beautiful in this village.
    options: [daripada, paling, lebih]
    answers: [paling]
    explain:
      ar_eg: «الأجمل في…» = paling indah di… . lebih محتاجة حاجتين نقارن بينهم.
      ar: «الأجمل في…» = paling indah di…، أما lebih فللمقارنة بين اثنين.
      en: '"The most … in …" = paling … di …; lebih compares two things.'
    words: [paling, indah, pura]
  - id: e05
    type: build_sentence
    source:
      ar_eg: ده أحسن معبد في بالي.
      ar: هذا أفضل معبد في بالي.
      en: This is the best temple in Bali.
    answer: Ini pura terbaik di Bali.
    distractors: [lebih, daripada]
    words: [pura, terbaik]
  - id: e06
    type: speaking
    text: Gamelan Bali terkenal di dunia.
    meaning:
      ar_eg: الجاميلان البالي مشهور في العالم.
      ar: الغاميلان البالي مشهور في العالم.
      en: Balinese gamelan is famous around the world.
    words: [terkenal, dunia]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «أحسن قهوة في الدنيا»؟
      ar: كيف تقول «أفضل قهوة في العالم»؟
      en: How do you say "The best coffee in the world"?
    options: ['Kopi terbaik di dunia.', 'Kopi paling terbaik di dunia.', 'Kopi baik ter di dunia.']
    answer: 0
    explain:
      ar_eg: ter- لوحدها معناها «الأكتر»، فمتحطش paling معاها.
      ar: ter- وحدها تعني «الأكثر»، فلا تجمعها مع paling.
      en: ter- already means "most", so don't add paling.
    words: [terbaik, dunia]
dialogue:
  title: Jalan-jalan di Ubud
  lines:
    - speaker: Mas Rizal
      text: Selamat datang di Ubud! Ini pura paling tua di desa ini.
      ar_eg: أهلًا بيك في أوبود! ده أقدم معبد في القرية دي.
      ar: أهلًا بك في أوبود! هذا أقدم معبد في هذه القرية.
      en: Welcome to Ubud! This is the oldest temple in this village.
    - speaker: Mohamed
      text: Indah sekali! Pura mana yang paling terkenal di Ubud?
      ar_eg: جميل أوي! أنهي معبد أشهر واحد في أوبود؟
      ar: جميل جدًا! أيّ معبد هو الأشهر في أوبود؟
      en: Very beautiful! Which temple is the most famous in Ubud?
    - speaker: Mas Rizal
      text: Pura Taman Saraswati. Di sana ada gamelan setiap malam.
      ar_eg: معبد تامان ساراسواتي. هناك فيه جاميلان كل ليلة.
      ar: معبد تامان ساراسواتي، وفيه عزف غاميلان كل ليلة.
      en: Pura Taman Saraswati. There's gamelan there every night.
    - speaker: Mohamed
      text: Gamelan Bali paling cepat, ya?
      ar_eg: الجاميلان البالي هو الأسرع، صح؟
      ar: الغاميلان البالي هو الأسرع، أليس كذلك؟
      en: Balinese gamelan is the fastest, right?
    - speaker: Mas Rizal
      text: Betul! Gamelan Bali lebih cepat daripada gamelan Jawa.
      ar_eg: صح! الجاميلان البالي أسرع من الجاميلان الجاوي.
      ar: صحيح! الغاميلان البالي أسرع من الغاميلان الجاوي.
      en: Right! Balinese gamelan is faster than Javanese gamelan.
new_words:
  - word: paling
    pos: adverb
    ar_eg: الأكتر (قبل الصفة = الأفعل)
    ar: الأكثر (قبل الصفة = التفضيل المطلق)
    en: most (before an adjective = -est)
  - word: terbaik
    pos: adjective
    ar_eg: الأحسن
    ar: الأفضل
    en: best
  - word: dunia
    pos: noun
    ar_eg: الدنيا / العالم
    ar: العالم
    en: world
    arabic: دنيا
  - word: pura
    pos: noun
    ar_eg: معبد هندوسي بالي
    ar: معبد هندوسي بالي
    en: Balinese Hindu temple
