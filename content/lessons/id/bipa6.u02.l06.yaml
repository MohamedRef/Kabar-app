schema: kabar.lesson/v1
id: bipa6.u02.l06
language: id
title: Deklamasi
can_do:
  ar_eg: تلقي قصيدة قدام الناس بإحساس وصوت واضح وتتكلم عن الإلقاء.
  ar: أن تُلقي قصيدة أمام الناس بإحساس وصوت واضح، وتتحدّث عن الإلقاء.
  en: Recite a poem to an audience with feeling and a clear voice, and talk about reciting.
slides:
  - title: Membaca dengan jiwa
    body:
      ar_eg: |
        في إندونيسيا، الأطفال والكبار بيشاركوا في مسابقات إلقاء الشعر. الكلمات المهمة:
        - deklamasi = إلقاء الشعر قدام جمهور
        - menghayati = يحس بالمعنى من جوه ويعيشه
        - penjiwaan = الإحساس اللي بتحطه في الإلقاء (من jiwa = روح)
        - lantang = بصوت عالي وواضح
        - ekspresi = تعبير الوش والصوت
        القاعدة: Hayati dulu, baru bacakan. = حس بالقصيدة الأول، وبعدين اقراها.
        - في الشارع: udah = sudah (خلاص / بالفعل)، tapi = tetapi (بس / لكن).
      ar: |
        يشارك الصغار والكبار في إندونيسيا في مسابقات إلقاء الشعر. أهمّ الكلمات:
        - deklamasi = إلقاء الشعر أمام جمهور
        - menghayati = يتمثّل المعنى ويعيشه من الداخل
        - penjiwaan = الإحساس الذي تضعه في الإلقاء (من jiwa = روح)
        - lantang = بصوت عالٍ واضح
        - ekspresi = تعبير الوجه والصوت
        والقاعدة: Hayati dulu, baru bacakan. = عِش القصيدة أوّلًا ثم اقرأها.
        - في كلام الشارع: udah = sudah (قد / بالفعل)، tapi = tetapi (لكن).
      en: |
        Children and adults across Indonesia enter poetry-recital contests. Key words:
        - deklamasi = reciting a poem to an audience
        - menghayati = to feel a meaning from the inside, to live it
        - penjiwaan = the feeling you put into a recital (from jiwa = soul)
        - lantang = loud and clear
        - ekspresi = expression, of face and voice
        The rule: Hayati dulu, baru bacakan. = Feel the poem first, then read it out.
        - On the street: udah = sudah (already), tapi = tetapi (but).
    examples:
      - text: Penjiwaannya bagus sekali, sehingga penonton ikut menangis.
        ar_eg: إحساسه في الإلقاء كان حلو جدًا لدرجة إن الجمهور عيّط معاه.
        ar: كان إحساسه في الإلقاء رائعًا حتى بكى الجمهور معه.
        en: His feeling was so good that the audience cried along.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: deklamasi
        ar_eg: إلقاء الشعر
        ar: إلقاء الشعر
        en: poetry recital
      - text: menghayati
        ar_eg: يعيش المعنى
        ar: يتمثّل المعنى
        en: to feel deeply
      - text: penjiwaan
        ar_eg: الإحساس في الأداء
        ar: الإحساس في الأداء
        en: feeling, soul in a performance
      - text: lantang
        ar_eg: عالي وواضح
        ar: عالٍ واضح
        en: loud and clear
      - text: ekspresi
        ar_eg: تعبير
        ar: تعبير
        en: expression
    words: [deklamasi, menghayati, penjiwaan, lantang, ekspresi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Hayati dulu, baru bacakan.» يعني إيه؟
      ar: ما معنى «Hayati dulu, baru bacakan.»؟
      en: What does "Hayati dulu, baru bacakan." mean?
    options:
      - اقرا بسرعة وخلّص.
      - حس بالقصيدة الأول، وبعدين اقراها.
      - احفظ القصيدة من غير ما تفهمها.
    answer: 1
    words: [menghayati]
  - id: e03
    type: listen
    text: Suaranya lantang, tetapi ekspresi wajahnya datar.
    question:
      ar_eg: إيه المشكلة في إلقائه؟
      ar: ما مشكلة إلقائه؟
      en: What's wrong with his recital?
    options:
      - صوته واطي أوي.
      - نسي القصيدة.
      - وشه مافيهوش تعبير.
    answer: 2
    words: [lantang, ekspresi]
  - id: e04
    type: fill_blank
    sentence: Sebelum ___, dia membaca puisi itu sepuluh kali di kamarnya.
    meaning:
      ar_eg: قبل الإلقاء، قرا القصيدة عشر مرات في أوضته.
      ar: قبل الإلقاء قرأ القصيدة عشر مرّات في غرفته.
      en: Before the recital, he read the poem ten times in his room.
    options: [deklamasi, penjiwaan, lantang]
    answers: [deklamasi]
    words: [deklamasi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «penjiwaan» جاية من أنهي كلمة؟
      ar: من أيّ كلمة اشتُقّت «penjiwaan»؟
      en: Which word does "penjiwaan" come from?
    options: [jiwa, jauh, jawab]
    answer: 0
    explain:
      ar_eg: peN- + jiwa + -an = إنك تحط روحك في الحاجة.
      ar: peN- + jiwa + -an = أن تضع روحك في الشيء.
      en: peN- + jiwa + -an = putting your soul into something.
    words: [penjiwaan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: لازم تعيش معنى كل سطر.
      ar: عليك أن تتمثّل معنى كلّ سطر.
      en: You have to feel the meaning of every line.
    answer: Kamu harus menghayati makna setiap larik.
    distractors: [lantang, deklamasi]
    words: [menghayati, larik]
  - id: e07
    type: translate
    direction: from_target
    source_text: Penonton memuji penjiwaan dan ekspresinya.
    answers_meaning:
      ar_eg:
        - الجمهور شكر في إحساسه وتعبيره.
        - الناس اللي بيتفرجوا مدحوا الإحساس والتعبير بتاعه.
      ar:
        - أثنى الجمهور على إحساسه وتعبيره.
        - امتدح المشاهدون إحساسه وتعبيره.
      en:
        - The audience praised his feeling and expression.
        - The spectators admired the soul and expression he put in.
    words: [penjiwaan, ekspresi]
  - id: e08
    type: speaking
    text: Bacalah dengan lantang dan hayati setiap kata.
    meaning:
      ar_eg: اقرا بصوت عالي وواضح وحس بكل كلمة.
      ar: اقرأ بصوت عالٍ واضح وتمثّل كلّ كلمة.
      en: Read loud and clear and feel every word.
    words: [lantang, menghayati]
  - id: e09
    type: dictation
    text: Deklamasi puisi Chairil Anwar membutuhkan penjiwaan yang kuat.
    meaning:
      ar_eg: إلقاء شعر تشايريل أنوار محتاج إحساس قوي.
      ar: يحتاج إلقاء شعر تشايريل أنوار إلى إحساس قويّ.
      en: Reciting Chairil Anwar's poetry needs strong feeling.
    words: [deklamasi, penjiwaan]
  - id: e10
    type: fill_blank
    sentence: Wajahnya sedih, ___ itu cocok dengan sajak tentang kehilangan.
    meaning:
      ar_eg: وشه كان حزين، والتعبير ده مناسب لقصيدة عن الفقد.
      ar: كان وجهه حزينًا، وهذا التعبير يلائم قصيدة عن الفقد.
      en: His face was sad, an expression that fit a poem about loss.
    options: [ekspresi, lantang, angkatan]
    answers: [ekspresi]
    words: [ekspresi, sajak]
dialogue:
  title: Latihan di balai desa
  lines:
    - speaker: Mak Cik Rohana
      text: Mohamed, cobalah baca sajak ini. Minggu depan ada lomba deklamasi.
      ar_eg: يا محمد، جرّب تقرا القصيدة دي. الأسبوع الجاي فيه مسابقة إلقاء.
      ar: يا محمد، جرّب أن تقرأ هذه القصيدة، ففي الأسبوع المقبل مسابقة إلقاء.
      en: Mohamed, try reading this poem. There's a recital contest next week.
    - speaker: Mohamed
      text: Suara saya udah lantang, tapi saya belum menghayatinya.
      ar_eg: صوتي عالي وواضح، بس لسه مش حاسس بيها.
      ar: صوتي عالٍ واضح، لكنّي لم أتمثّلها بعد.
      en: My voice is loud enough, but I don't feel it yet.
    - speaker: Mak Cik Rohana
      text: Pikirkan kampungmu di Mesir. Penjiwaan datang dari kenangan sendiri.
      ar_eg: فكّر في بلدك في مصر. الإحساس بييجي من ذكرياتك إنت.
      ar: فكّر في بلدتك في مصر، فالإحساس ينبع من ذكرياتك أنت.
      en: Think of your home town in Egypt. Feeling comes from your own memories.
    - speaker: Mohamed
      text: Baik, Mak Cik. Saya coba lagi dengan ekspresi yang lebih jujur.
      ar_eg: حاضر يا خالتي. هجرّب تاني بتعبير أصدق.
      ar: حسنًا يا خالة، سأجرّب مجدّدًا بتعبير أصدق.
      en: All right, Mak Cik. I'll try again with a more honest expression.
