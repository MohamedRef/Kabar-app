dialogue:
  title: Akhirnya mekar
  lines:
    - speaker: Bu Laila
      text: Rafflesia yang kita amati mekar pagi ini. Kamu beruntung!
      ar_eg: الرافليزيا اللي كنا بنلاحظها فتّحت النهارده الصبح. إنت محظوظ!
      ar: تفتّحت الرافليزيا التي نلاحظها هذا الصباح. أنت محظوظ!
      en: The Rafflesia we've been watching bloomed this morning. You're lucky!
    - speaker: Mohamed
      text: Akhirnya! Setelah semua pengamatan itu, saya melihatnya sendiri.
      ar_eg: أخيرًا! بعد كل الملاحظات دي، شفتها بعيني.
      ar: أخيرًا! بعد كلّ تلك الملاحظات، رأيتها بعيني.
      en: At last! After all that observing, I've seen it with my own eyes.
    - speaker: Bu Laila
      text: Besok kamu ke Padang, kan? Jangan lupa tulis penjelasannya untuk blogmu.
      ar_eg: بكرة رايح بادانج، صح؟ ماتنساش تكتب الشرح للبلوج بتاعك.
      ar: غدًا تذهب إلى بادانغ، أليس كذلك؟ لا تنسَ كتابة الشرح لمدوّنتك.
      en: You're off to Padang tomorrow, right? Don't forget to write the explainer for your blog.
    - speaker: Mohamed
      text: Pasti. Dengan bahasa sederhana, supaya Aisyah juga bisa membacanya.
      ar_eg: أكيد. بكلام بسيط، علشان عائشة كمان تقدر تقراه.
      ar: بالتأكيد، وبلغة بسيطة كي تقرأه عائشة أيضًا.
      en: Definitely. In simple language, so Aisyah can read it too.
souvenir:
  id: bipa6.u08.souvenir
  title: Rafflesia arnoldii
  note:
    ar_eg: الرافليزيا أرنولدي أكبر وردة مفردة في الدنيا، عرضها ممكن يوصل لحوالي متر ووزنها لحوالي 10 كيلو. مالهاش ورق ولا ساق ولا جذور، وعايشة طفيلي على نبات متسلّق. البرعم بياخد شهور، والوردة بتفضل مفتّحة حوالي أسبوع بس، وريحتها زي اللحمة البايظة علشان تجذب الدبّان. العلم الغربي سجّلها سنة 1818 في بنجكولو، واتسمّت على اسم رافلز وأرنولد. وهي واحدة من التلات ورود الوطنية لإندونيسيا، وعلشان كده بنجكولو اسمها «أرض الرافليزيا».
    ar: الرافليزيا أرنولدي أكبر زهرة مفردة في العالم، قد يبلغ قطرها نحو متر ووزنها نحو عشرة كيلوغرامات. لا أوراق لها ولا ساق ولا جذور، وتعيش متطفّلة على نبات متسلّق. يستغرق برعمها شهورًا، ولا تبقى متفتّحة إلّا نحو أسبوع، ورائحتها كاللحم الفاسد لتجذب الذباب. سجّلها العلم الغربي عام 1818 في بنغكولو، وسُمّيت باسمَي رافلز وأرنولد. وهي إحدى الأزهار الوطنية الثلاث لإندونيسيا، ولذلك تُلقّب بنغكولو «أرض الرافليزيا».
    en: Rafflesia arnoldii is the world's largest single flower, up to about a metre across and around 10 kg. It has no leaves, stem or roots and lives as a parasite on a climbing vine. Its bud takes months to develop, the flower stays open only about a week, and it smells of rotting meat to attract flies. Western science recorded it in 1818 in Bengkulu, naming it after Raffles and Arnold. It is one of Indonesia's three national flowers, which is why Bengkulu is called "Bumi Rafflesia".
