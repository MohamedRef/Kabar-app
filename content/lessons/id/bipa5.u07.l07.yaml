schema: kabar.lesson/v1
id: bipa5.u07.l07
language: id
title: Gudang di pelabuhan
can_do:
  ar_eg: 'تشرح سلسلة توريد أكل في ميناء: الشحن والتوزيع والاستهلاك والبورصة، والدقيق والقمح والمعلبات والسجق.'
  ar: 'أن تشرح سلسلة إمداد غذائي في ميناء: الشحن والتوزيع والاستهلاك والبورصة، والدقيق والقمح والمعلّبات والنقانق.'
  en: 'Explain a port food supply chain: cargo, distribution, consumption and the exchange, flour, wheat, tins and sausages.'
slides:
  - title: Dari kapal ke dapur
    body:
      ar_eg: |
        kargo = شحنة، بضايع على مركب أو طيارة، distribusi = توزيع.
        konsumsi = استهلاك (konsumsi beras = استهلاك الرز)، bursa = بورصة (bursa saham، bursa komoditas).
        gandum = قمح، tepung = دقيق (tepung terigu = دقيق القمح).
        kaleng = علبة صفيح (ikan kaleng = سمك معلب)، sosis = سجق، سوسيس.
      ar: |
        kargo = شحنة (بحرية أو جوية)، distribusi = توزيع.
        konsumsi = استهلاك (konsumsi beras = استهلاك الأرز)، bursa = بورصة (bursa saham، bursa komoditas).
        gandum = قمح، tepung = دقيق (tepung terigu = دقيق القمح).
        kaleng = علبة معدنية (ikan kaleng = سمك معلّب)، sosis = نقانق.
      en: |
        kargo = cargo, distribusi = distribution.
        konsumsi = consumption (konsumsi beras = rice consumption), bursa = exchange (bursa saham = stock exchange, bursa komoditas).
        gandum = wheat, tepung = flour (tepung terigu = wheat flour).
        kaleng = tin, can (ikan kaleng = tinned fish), sosis = sausage.
    examples:
      - text: Indonesia mengimpor hampir semua gandumnya.
        ar_eg: إندونيسيا بتستورد تقريبًا كل القمح بتاعها.
        ar: تستورد إندونيسيا كل قمحها تقريبًا.
        en: Indonesia imports almost all its wheat.
      - text: Kargo tepung itu didistribusikan ke seluruh Kalimantan.
        ar_eg: شحنة الدقيق دي بتتوزع على كاليمانتان كلها.
        ar: تُوزَّع شحنة الدقيق تلك على كل كاليمانتان.
        en: That cargo of flour is distributed across Kalimantan.
      - text: Konsumsi mi instan naik ketika harga beras naik.
        ar_eg: استهلاك الإندومي بيزيد لما سعر الرز يغلى.
        ar: يرتفع استهلاك المعكرونة سريعة التحضير عند غلاء الأرز.
        en: Instant-noodle consumption rises when rice gets dearer.
