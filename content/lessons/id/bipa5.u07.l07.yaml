  - id: e03
    type: listen
    text: Kapal kargo itu membawa gandum dari Australia.
    question:
      ar_eg: المركب شايلة إيه؟
      ar: ماذا تحمل السفينة؟
      en: What is the ship carrying?
    options: [قمح, رز, بترول]
    answer: 0
    meaning:
      ar_eg: مركب الشحن ده شايل قمح من أستراليا.
      ar: تحمل سفينة الشحن قمحًا من أستراليا.
      en: That cargo ship carries wheat from Australia.
    words: [kargo, gandum]
  - id: e04
    type: fill_blank
    sentence: Untuk membuat roti, kita butuh ___ terigu.
    meaning:
      ar_eg: عشان نعمل عيش محتاجين ___ قمح.
      ar: لصنع الخبز نحتاج إلى ___ القمح.
      en: To make bread we need wheat ___.
    options: [tepung, kaleng, bursa]
    answers: [tepung]
    words: [tepung, kaleng, bursa]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: المكان اللي بيتباع ويتشرى فيه الأسهم اسمه إيه؟
      ar: ما اسم المكان الذي تُباع فيه الأسهم وتُشترى؟
      en: Where are shares bought and sold?
    options: [sosis, distribusi, bursa]
    answer: 2
    explain:
      ar_eg: bursa saham = البورصة.
      ar: bursa saham = بورصة الأسهم.
      en: bursa saham = stock exchange.
    words: [sosis, distribusi, bursa]
  - id: e06
    type: fill_blank
    sentence: Ikan ___ ini bisa disimpan dua tahun.
    meaning:
      ar_eg: السمك ___ ده ممكن يتخزن سنتين.
      ar: يمكن حفظ هذا السمك ___ عامين.
      en: This ___ fish keeps for two years.
    options: [kaleng, gandum, konsumsi]
    answers: [kaleng]
    words: [kaleng, gandum, konsumsi]
  - id: e07
    type: multiple_choice
    question: Anak-anak suka ___ ayam goreng untuk sarapan.
    options: [kargo, sosis, tepung]
    answer: 1
    explain:
      ar_eg: sosis = سجق.
      ar: sosis = نقانق.
      en: sosis = sausage.
    words: [kargo, sosis, tepung]
  - id: e08
    type: build_sentence
    source:
      ar_eg: توزيع الأكل بيتأخر عشان الطرق.
      ar: يتأخّر توزيع الطعام بسبب الطرق.
      en: Food distribution is delayed because of the roads.
    answer: Distribusi makanan terlambat karena jalannya rusak.
    distractors: [bursa, kargo]
    words: [distribusi]
  - id: e09
    type: translate
    direction: from_target
    source_text: Konsumsi gandum di Indonesia terus naik.
    answers_meaning:
      ar_eg: [استهلاك القمح في إندونيسيا بيزيد على طول, إندونيسيا بتستهلك قمح أكتر وأكتر]
      ar: [يستمر استهلاك القمح في إندونيسيا في الارتفاع, يتزايد استهلاك القمح في إندونيسيا]
      en: [Wheat consumption in Indonesia keeps rising, 'Indonesia''s wheat consumption continues to grow']
    words: [konsumsi, gandum]
  - id: e10
    type: speaking
    text: Kargo tepung dan sosis kaleng sudah tiba.
    meaning:
      ar_eg: شحنة الدقيق والسجق المعلب وصلت.
      ar: وصلت شحنة الدقيق والنقانق المعلّبة.
      en: The cargo of flour and tinned sausages has arrived.
    words: [kargo, tepung, sosis, kaleng]
dialogue:
  lines:
    - speaker: Pak Hendra
      text: Pak Mohamed, besok ada tamu dari perusahaan distribusi Mesir.
      ar_eg: يا أستاذ محمد، بكرة جايلنا ضيوف من شركة توزيع مصرية.
      ar: يا أستاذ محمد، يأتينا غدًا ضيوف من شركة توزيع مصرية.
      en: Mohamed, tomorrow we have guests from an Egyptian distribution company.
    - speaker: Mohamed
      text: Mereka mau melihat gudang di pelabuhan?
      ar_eg: عايزين يشوفوا المخزن اللي في الميناء؟
      ar: هل يريدون رؤية المستودع في الميناء؟
      en: Do they want to see the warehouse at the port?
    - speaker: Pak Hendra
      text: Ya. Kargo gandum dan tepung dari kapal masuk ke sana, lalu dikirim ke toko-toko.
      ar_eg: أيوه. شحنات القمح والدقيق بتدخل هناك من المراكب، وبعدين تتبعت للمحلات.
      ar: نعم. تدخل شحنات القمح والدقيق من السفن إليه، ثم تُرسل إلى المتاجر.
      en: Yes. Wheat and flour cargo comes in there from ships, then goes out to shops.
    - speaker: Mohamed
      text: Apakah mereka juga tertarik pada makanan kaleng?
      ar_eg: هم مهتمين كمان بالمعلبات؟
      ar: هل يهتمون أيضًا بالأطعمة المعلّبة؟
      en: Are they interested in tinned food too?
    - speaker: Pak Hendra
      text: Ya, ikan kaleng dan sosis halal. Konsumsinya besar di Mesir.
      ar_eg: أيوه، السمك المعلب والسجق الحلال. استهلاكهم كبير في مصر.
      ar: نعم، السمك المعلّب والنقانق الحلال. استهلاكها كبير في مصر.
      en: Yes, tinned fish and halal sausages. Consumption is high in Egypt.
    - speaker: Mohamed
      text: Kalau begitu, saya siapkan juga data harga di bursa komoditas.
      ar_eg: يبقى هجهز كمان داتا الأسعار في بورصة السلع.
      ar: إذن سأجهّز أيضًا بيانات الأسعار في بورصة السلع.
      en: Then I'll also prepare price data from the commodity exchange.
