schema: kabar.lesson/v1
id: bipa7.u06.l11
language: id
title: Debat media sosial
can_do:
  ar_eg: تناقش مزايا وعيوب السوشيال ميديا من الناحيتين.
  ar: أن تناقش مزايا وسائل التواصل وعيوبها من الجانبين.
  en: Debate the upsides and downsides of social media from both sides.
slides:
  - title: Dua tim, satu mosi
    grammar: id.cohesion.lexical
    body:
      ar_eg: |
        موضوع المناظرة: Media sosial lebih banyak manfaatnya daripada dampak negatifnya.
        - الفريق المؤيد: Media sosial menghubungkan keluarga yang jauh dan membantu UMKM berjualan.
        - الفريق المعارض: Dampak negatif (الآثار السلبية) seperti kecanduan (الإدمان) dan bocornya privasi (الخصوصية) lebih besar.
        - الحل الوسط: Kuncinya adalah literasi digital (الثقافة الرقمية).
        خلّي المناظرة متماسكة بالكلمات: manfaat ↔ dampak negatif (ضدّين)، وكرّر «literasi digital» في الختام.
      ar: |
        موضوع المناظرة: Media sosial lebih banyak manfaatnya daripada dampak negatifnya.
        - الفريق المؤيّد: Media sosial menghubungkan keluarga yang jauh dan membantu UMKM berjualan.
        - الفريق المعارض: Dampak negatif (الآثار السلبية) seperti kecanduan (الإدمان) dan bocornya privasi (الخصوصية) lebih besar.
        - الموقف الوسط: Kuncinya adalah literasi digital (الثقافة الرقمية).
        واربط المناظرة لفظيًّا: manfaat ↔ dampak negatif (ضدّان)، وكرّر «literasi digital» في الختام.
      en: |
        The motion: Media sosial lebih banyak manfaatnya daripada dampak negatifnya.
        - For: Media sosial menghubungkan keluarga yang jauh dan membantu UMKM berjualan.
        - Against: Dampak negatif (negative effects) seperti kecanduan (addiction) dan bocornya privasi (privacy) lebih besar.
        - Middle ground: Kuncinya adalah literasi digital (digital literacy).
        Keep the debate cohesive through vocabulary: manfaat ↔ dampak negatif (antonyms), and repeat "literasi digital" at the close.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dampak negatif
        ar_eg: آثار سلبية
        ar: آثار سلبية
        en: negative effects
      - text: kecanduan
        ar_eg: إدمان
        ar: إدمان
        en: addiction
      - text: privasi
        ar_eg: خصوصية
        ar: خصوصية
        en: privacy
      - text: literasi digital
        ar_eg: الثقافة الرقمية
        ar: الثقافة الرقمية
        en: digital literacy
    words: [dampak negatif, kecanduan, privasi, literasi digital]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي حجّة بتاعة الفريق المعارض؟
      ar: أيّ حجّة للفريق المعارض؟
      en: Which argument belongs to the team against?
    options:
      - Media sosial membantu UMKM berjualan.
      - Media sosial menghubungkan keluarga.
      - Banyak remaja mengalami kecanduan media sosial.
    answer: 2
    words: [kecanduan]
  - id: e03
    type: fill_blank
    sentence: Jangan mengunggah alamat rumahmu. Jaga ___ kamu.
    meaning:
      ar_eg: ماترفعش عنوان بيتك. حافظ على خصوصيتك.
      ar: لا تنشر عنوان بيتك، وصُن خصوصيّتك.
      en: Don't post your home address. Protect your privacy.
    options: [privasi, kecanduan, dampak negatif]
    answers: [privasi]
    words: [privasi]
  - id: e04
    type: listen
    text: Menurut saya, kuncinya bukan larangan, tetapi literasi digital.
    question:
      ar_eg: المتكلم شايف إيه الحل؟
      ar: ما الحلّ في رأي المتحدّث؟
      en: What does the speaker see as the answer?
    options:
      - المنع الكامل.
      - الثقافة الرقمية.
      - تليفونات أغلى.
    answer: 1
    words: [literasi digital]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الآثار السلبية للسوشيال ميديا كبيرة.
      ar: الآثار السلبية لوسائل التواصل كبيرة.
      en: Social media's negative effects are big.
    answer: Dampak negatif media sosial cukup besar.
    distractors: [privasi, literasi]
    words: [dampak negatif]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيه أحسن جملة تقفل بيها مناظرة متوازنة؟
      ar: ما أفضل خاتمة لمناظرة متوازنة؟
      en: What's the best closing line for a balanced debate?
    options:
      - Jadi, kuncinya adalah literasi digital, bukan larangan.
      - Pokoknya media sosial jelek!
      - Saya tidak peduli.
    answer: 0
    words: [literasi digital]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إدمان الألعاب ليه آثار سلبية على الدراسة.
      ar: لإدمان الألعاب آثار سلبية على الدراسة.
      en: Gaming addiction has negative effects on studying.
    answers:
      - Kecanduan gim punya dampak negatif terhadap belajar.
      - Kecanduan game punya dampak negatif terhadap belajar.
      - Kecanduan gim memiliki dampak negatif bagi belajar.
      - Kecanduan gim berdampak negatif terhadap belajar.
    words: [kecanduan, dampak negatif]
  - id: e08
    type: speaking
    text: Literasi digital melindungi privasi kita dan keluarga kita.
    meaning:
      ar_eg: الثقافة الرقمية بتحمي خصوصيتنا وخصوصية عيلتنا.
      ar: تحمي الثقافة الرقمية خصوصيّتنا وخصوصيّة أسرنا.
      en: Digital literacy protects our privacy and our family's.
    words: [literasi digital, privasi]
  - id: e09
    type: dictation
    text: Kecanduan media sosial bisa mengganggu tidur.
    meaning:
      ar_eg: إدمان السوشيال ميديا ممكن يبوّظ النوم.
      ar: قد يُفسد إدمان وسائل التواصل النوم.
      en: Social media addiction can disrupt sleep.
    words: [kecanduan]
  - id: e10
    type: translate
    direction: from_target
    source_text: Bocornya privasi adalah dampak negatif yang sering diabaikan.
    answers_meaning:
      ar_eg:
        - تسريب الخصوصية أثر سلبي الناس كتير بتتجاهله.
        - إن خصوصيتك تتسرّب ده عيب ناس كتير مش واخدة بالها منه.
      ar:
        - تسرّب الخصوصية أثر سلبي كثيرًا ما يُتجاهَل.
        - انكشاف الخصوصية من الآثار السلبية المغفول عنها غالبًا.
      en:
        - Privacy leaks are a negative effect that's often ignored.
        - Losing your privacy is an often-overlooked downside.
    words: [privasi, dampak negatif]
dialogue:
  title: Debat di aula sekolah
  lines:
    - speaker: Kak Selvi
      text: Tim pro sudah bicara. Sekarang giliran tim kontra, Mohamed.
      ar_eg: الفريق المؤيد اتكلم. دلوقتي دور الفريق المعارض يا محمد.
      ar: تكلّم الفريق المؤيّد، والآن دور الفريق المعارض يا محمد.
      en: The team for has spoken. Now it's the team against, Mohamed.
    - speaker: Mohamed
      text: Terima kasih. Kami tidak menolak manfaatnya, tetapi dampak negatifnya nyata, yaitu kecanduan.
      ar_eg: شكرًا. إحنا مش بننكر المزايا، بس الآثار السلبية حقيقية، زي الإدمان.
      ar: شكرًا. لا ننكر المنافع، لكنّ الآثار السلبية حقيقية، ومنها الإدمان.
      en: Thank you. We don't deny the benefits, but the negative effects are real, namely addiction.
    - speaker: Mohamed
      text: Selain itu, privasi anak-anak sering bocor tanpa mereka sadari.
      ar_eg: وكمان، خصوصية العيال كتير بتتسرّب من غير ما ياخدوا بالهم.
      ar: وفضلًا عن ذلك، كثيرًا ما تتسرّب خصوصيّة الأطفال دون أن يشعروا.
      en: Besides, children's privacy often leaks without them realising.
    - speaker: Kak Selvi
      text: Argumen yang seimbang. Apa solusinya?
      ar_eg: حجّة متوازنة. طب إيه الحل؟
      ar: حجّة متوازنة. فما الحلّ؟
      en: A balanced argument. What's the solution?
    - speaker: Mohamed
      text: Literasi digital, sejak sekolah dasar.
      ar_eg: الثقافة الرقمية، من ابتدائي.
      ar: الثقافة الرقمية منذ المرحلة الابتدائية.
      en: Digital literacy, from primary school on.
