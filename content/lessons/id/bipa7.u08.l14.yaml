      - text: inflasi
        ar_eg: تضخّم
        ar: تضخّم
        en: inflation
      - text: UMKM
        ar_eg: المشاريع الصغيرة والمتوسطة
        ar: المشاريع الصغرى والمتوسّطة
        en: small and medium enterprises
      - text: daya beli
        ar_eg: القوة الشرائية
        ar: القدرة الشرائية
        en: purchasing power
      - text: kendala
        ar_eg: عقبة
        ar: عقبة
