title: Ulangan Unit 8
can_do:
  ar_eg: تشرح اتجاهات الاقتصاد وتربط جملك ببعض بوضوح.
  ar: أن تشرح اتّجاهات الاقتصاد وتربط جملك بوضوح.
  en: Explain economic trends and link your sentences clearly.
exercises:
