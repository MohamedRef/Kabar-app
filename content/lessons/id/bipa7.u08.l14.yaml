    words: [meskipun demikian, inflasi, UMKM, daya beli, kendala]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Ekspor naik. ___, impor turun.» بتقارن بين حاجتين في نفس الوقت. تحطّ إيه؟
      ar: «Ekspor naik. ___, impor turun.» تقارن بين أمرين في الوقت نفسه، فماذا تضع؟
      en: '"Ekspor naik. ___, impor turun." It contrasts two things at once. What goes in?'
    options: [Oleh sebab itu, Sementara itu, Bahkan]
    answer: 1
    words: [sementara itu, ekspor, impor, oleh sebab itu, bahkan]
  - id: e03
    type: fill_blank
    sentence: Untuk merintis usaha, kamu butuh ___ dan ide yang baik.
    meaning:
      ar_eg: علشان تبدأ مشروع من الصفر، محتاج رأس مال وفكرة كويسة.
      ar: لتأسيس مشروع تحتاج إلى رأس مال وفكرة جيّدة.
      en: To start a business, you need capital and a good idea.
    options: [modal, laba, omzet]
    answers: [modal]
    words: [modal, merintis, laba, omzet]
  - id: e04
    type: listen
    text: Bank sentral menurunkan suku bunga. Akan tetapi, investasi belum naik.
    question:
      ar_eg: إيه اللي ماحصلش رغم نزول الفايدة؟
      ar: ما الذي لم يحدث رغم خفض الفائدة؟
      en: What hasn't happened despite the rate cut?
    options:
      - التضخّم ماوقفش.
      - المحلات ماقفلتش.
      - الاستثمار لسّه مازادش.
    answer: 2
    words: [suku bunga, akan tetapi, investasi]
