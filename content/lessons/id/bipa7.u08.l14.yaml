  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: النمو الاقتصادي ثابت. ومع ذلك، الأسعار بتطلع.
      ar: النموّ الاقتصادي مستقرّ، ومع ذلك ترتفع الأسعار.
      en: Economic growth is stable. Even so, prices are rising.
    answers:
      - Pertumbuhan ekonomi stabil. Meskipun demikian, harga naik.
      - Pertumbuhan ekonomi stabil. Meskipun demikian, harga-harga naik.
      - Pertumbuhan ekonomi stabil. Meskipun demikian, harga terus naik.
      - Pertumbuhan ekonomi relatif stabil. Meskipun demikian, harga naik.
    words: [pertumbuhan ekonomi, meskipun demikian]
  - id: e08
