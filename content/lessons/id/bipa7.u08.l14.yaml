    text: Pengusaha kecil itu merintis usahanya tanpa pinjaman.
    meaning:
      ar_eg: صاحب المشروع الصغير ده بدأ من الصفر من غير قرض.
      ar: أسّس رائد الأعمال الصغير مشروعه دون قرض.
      en: That small business owner built up his business without a loan.
    words: [pengusaha, merintis, pinjaman]
