schema: kabar.lesson/v1
id: bipa2.u06.l05
language: id
title: Kampung yang damai
can_do:
  ar_eg: 'توصف قريتك أو حتتك: هادية ولا زحمة، والبوسطة والطريق الرئيسي، والمطافي والحراسة بالليل.'
  ar: 'أن تصف قريتك أو حيّك: هادئ أم مزدحم، والبريد والطريق الرئيسي، والإطفاء والحراسة الليلية.'
  en: 'Describe your village or neighbourhood: quiet or busy, the post office and main road, the fire brigade and the night watch.'
slides:
  - title: Kampung saya
    body:
      ar_eg: |
        kampung = قرية أو حتة شعبية. jalan raya = الطريق الرئيسي. kantor pos = البوسطة.
        sepi = هادي ومفيهوش ناس (عكس ramai)، damai = في سلام وأمان.
        kebakaran = حريقة (bakar = يحرق)، وpemadam kebakaran = المطافي.
        ronda = الحراسة بالليل: رجالة الحتة بيلفوا على البيوت.
        في الشارع بيقولوا:
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
        - sama = dengan (مع)، وكمان بمعنى dan (و)
      ar: |
        kampung = قرية أو حيّ شعبي. jalan raya = الطريق الرئيسي. kantor pos = مكتب البريد.
        sepi = هادئ خالٍ من الناس (عكس ramai)، damai = في سلام.
        kebakaran = حريق (bakar = يحرق)، وpemadam kebakaran = الإطفاء.
        ronda = الحراسة الليلية: يطوف رجال الحيّ على البيوت ليلًا.
        في كلام الشارع:
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
        - sama = dengan (مع)، وتأتي أيضًا بمعنى dan (و)
      en: |
        kampung = village, neighbourhood. jalan raya = main road. kantor pos = post office.
        sepi = quiet, empty (opposite of ramai), damai = peaceful.
        kebakaran = a fire (bakar = burn); pemadam kebakaran = fire brigade.
        ronda = night watch: the men of the neighbourhood walk round the houses at night.
        On the street:
        - banget = sekali (very), after the adjective just like sekali
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
        - sama = dengan (with), and also dan (and)
    examples:
      - text: Kampung saya sepi dan damai.
        ar_eg: قريتي هادية ومسالمة.
        ar: قريتي هادئة وآمنة.
        en: My village is quiet and peaceful.
      - text: Kantor pos ada di jalan raya.
        ar_eg: البوسطة على الطريق الرئيسي.
        ar: مكتب البريد على الطريق الرئيسي.
        en: The post office is on the main road.
      - text: Ada kebakaran! Telepon pemadam kebakaran!
        ar_eg: فيه حريقة! كلّم المطافي!
        ar: هناك حريق! اتصل بالإطفاء!
        en: Fire! Call the fire brigade!
