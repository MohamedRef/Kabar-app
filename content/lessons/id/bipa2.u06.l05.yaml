    options: ["Rumah sakitnya di seberang rumah makan.", "Rumah sakitnya di sebelah rumah makan.", "Rumah makannya di seberang rumah sakit."]
    answer: 0
    words: [rumah sakit, rumah makan, seberang]
  - id: e05
