      ar: كيف تقول «غرفة نومي»؟
      en: How do you say "my bedroom"?
    options: ["kamar tidur saya", "kamar saya tidur", "saya kamar tidur"]
    answer: 0
    explain:
      ar_eg: ماتقطعش kamar tidur، وsaya في الآخر.
      ar: لا يُفصل المركّب، وsaya في آخره.
      en: Keep kamar tidur together; saya goes last.
