  - id: e03
    type: listen
    text: Ada kebakaran di pasar! Panggil pemadam kebakaran!
    question:
      ar_eg: إيه اللي حصل؟
      ar: ماذا حدث؟
      en: What happened?
    options: [حريقة, حادثة, مطر]
    answer: 0
    meaning:
      ar_eg: فيه حريقة في السوق! نادوا المطافي!
      ar: حريق في السوق! استدعوا الإطفاء!
      en: There's a fire at the market! Call the fire brigade!
    words: [kebakaran, pemadam kebakaran]
  - id: e04
    type: fill_blank
    sentence: Saya kirim surat dari ___.
    meaning:
      ar_eg: ببعت جواب من ___.
      ar: أرسل رسالة من ___.
      en: I send a letter from the ___.
    options: [kantor pos, jalan raya, kampung]
    answers: [kantor pos]
    words: [kantor pos, jalan raya, kampung]
    explain:
      ar_eg: الجوابات بتتبعت من kantor pos (البوستة). jalan raya = طريق رئيسي، وkampung = قرية.
      ar: تُرسل الرسائل من kantor pos. أما jalan raya فطريق رئيسي وkampung قرية.
      en: Letters go from the kantor pos (post office). jalan raya is a main road, kampung a village.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عكس ramai؟
      ar: ما عكس ramai؟
      en: The opposite of ramai?
    options: [sepi, damai, ronda]
    answer: 0
    explain:
      ar_eg: ramai = زحمة، sepi = هادي.
      ar: ramai = مزدحم، sepi = هادئ.
      en: ramai = busy, sepi = quiet.
    words: [sepi, damai, ronda]
  - id: e06
    type: fill_blank
    sentence: Setiap malam ada ___ di kampung kami.
    meaning:
      ar_eg: كل ليلة فيه ___ في حتتنا.
      ar: كل ليلة هناك ___ في حيّنا.
      en: Every night there's a ___ in our village.
    options: [ronda, kebakaran, kantor pos]
    answers: [ronda]
    words: [ronda, kebakaran, kampung]
    explain:
      ar_eg: ronda = دورية حراسة بالليل بيعملها أهل الحتة. kebakaran = حريقة، ومش بتحصل «كل ليلة».
      ar: ronda = حراسة ليلية يتناوب عليها أهل الحي. أما kebakaran فحريق لا يتكرر كل ليلة.
      en: ronda is the neighbourhood night watch. kebakaran (a fire) doesn't happen every night.
  - id: e07
    type: build_sentence
    source:
      ar_eg: قريتي هادية ومسالمة.
      ar: قريتي هادئة ومسالمة.
      en: My village is quiet and peaceful.
    answer: Kampung saya sepi dan damai.
    distractors: [ramai, besar]
    words: [kampung, sepi, damai]
    explain:
      ar_eg: sepi = هادي (مفيش دوشة)، وdamai = مسالم. ramai = زحمة، وده عكس sepi.
      ar: sepi = هادئ، وdamai = مسالم. أما ramai فمزدحم، عكس sepi.
      en: sepi = quiet, damai = peaceful. ramai (busy) is the opposite of sepi.
  - id: e08
    type: translate
    direction: from_target
    source_text: Kantor pos ada di jalan raya.
    answers_meaning:
      ar_eg: [البوسطة على الطريق الرئيسي, مكتب البريد في الشارع الرئيسي]
      ar: [مكتب البريد على الطريق الرئيسي]
      en: [The post office is on the main road, The post office is on the high street]
    words: [kantor pos, jalan raya]
  - id: e09
    type: speaking
    text: Pemadam kebakaran datang cepat sekali.
    meaning:
      ar_eg: المطافي جت بسرعة أوي.
      ar: جاء الإطفاء بسرعة كبيرة.
      en: The fire brigade came really fast.
    words: [pemadam kebakaran]
  - id: e10
    type: multiple_choice
    question: Ada api besar di rumah itu. Ini ___.
    options: [kebakaran, ronda, kampung]
    answer: 0
    explain:
      ar_eg: نار كبيرة في بيت = حريقة.
      ar: نار كبيرة في بيت = حريق.
      en: A big fire in a house = kebakaran.
    words: [kebakaran, ronda, kampung]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Ini kampungku. Sepi, ya?
      ar_eg: دي قريتي. هادية، صح؟
      ar: هذه قريتي. هادئة، أليس كذلك؟
      en: This is my village. Quiet, isn't it?
    - speaker: Mohamed
      text: Iya, damai banget. Beda sama Jakarta!
      ar_eg: أيوه، هادية خالص. غير جاكرتا خالص!
      ar: نعم، هادئة جدًا. تختلف عن جاكرتا!
      en: Yes, so peaceful. Not like Jakarta!
    - speaker: Ni Luh
      text: Kantor pos dan pasar ada di jalan raya.
      ar_eg: البوسطة والسوق على الطريق الرئيسي.
      ar: مكتب البريد والسوق على الطريق الرئيسي.
      en: The post office and market are on the main road.
    - speaker: Mohamed
      text: Kalau malam, aman?
      ar_eg: وبالليل، أمان؟
      ar: وفي الليل، هل هي آمنة؟
      en: Is it safe at night?
    - speaker: Ni Luh
      text: Aman. Ada ronda setiap malam.
      ar_eg: أمان. الرجالة بيعملوا حراسة كل ليلة.
      ar: آمنة. يحرسها الرجال كل ليلة.
      en: Safe. The men do the night watch every night.
    - speaker: Mohamed
      text: Wah, bagus banget!
      ar_eg: الله، حلو أوي!
      ar: رائع جدًا!
      en: Oh, that's great!
