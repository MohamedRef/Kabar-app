  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مدام ساري عاملة أكل وعايزة تعزم عليك. تقول إيه؟
      ar: أعدّت السيدة ساري طعامًا وتريد أن تدعوك إليه. ماذا تقول؟
      en: Bu Sari has made food and wants to offer you some. What does she say?
    options: ["Tolong makan, Pak.", "Minta makan, Pak.", "Silakan makan, Pak."]
    answer: 2
    explain:
      ar_eg: عزومة = silakan.
      ar: الدعوة بـ silakan.
      en: An offer = silakan.
    words: [silakan]
  - id: e03
    type: multiple_choice
    question: Pak Wayan punya tiga ___ ayam.
    options: ["ekor", "orang", "buah"]
    answer: 0
    explain:
      ar_eg: الفراخ حيوانات، يبقى ekor.
      ar: الدجاج حيوان فيُعدّ بـ ekor.
      en: Chickens are animals, so ekor.
    words: [ekor]
  - id: e04
    type: listen
