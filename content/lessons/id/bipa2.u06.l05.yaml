schema: kabar.lesson/v1
id: bipa2.u06.l05
language: id
title: Ulangan Unit 6
can_do:
  ar_eg: توصف الشارع اللي ساكن فيه.
  ar: أن تصف شارعك.
  en: Describe your street.
slides:
  - title: Kamar mandi saya, silakan masuk
    body:
      ar_eg: |
        فكّر نفسك:
        - المركّب كلمة واحدة، وصاحبه في الآخر: kamar tidur saya، rumah sakit itu، kamar mandinya.
        - tolong = اعملّي خدمة، silakan = اتفضل (عزومة)، minta = عايز آخد حاجة، mohon = برجاء (رسمي).
      ar: |
        تذكير:
        - المركّب كلمة واحدة والمالك في آخره: kamar tidur saya، rumah sakit itu، kamar mandinya.
        - tolong لطلب خدمة، وsilakan للدعوة، وminta لطلب شيء، وmohon للرجاء الرسمي.
      en: |
        Recap:
        - A compound is one word; the owner goes last: kamar tidur saya, rumah sakit itu, kamar mandinya.
        - tolong = do me a favour, silakan = go ahead (offer), minta = may I have, mohon = kindly (formal).
    grammar: id.request.tolong-silakan
    examples:
      - text: Silakan masuk. Kamar mandinya di sebelah dapur.
        ar_eg: اتفضل ادخل. الحمّام جنب المطبخ.
        ar: تفضّل بالدخول. الحمّام بجانب المطبخ.
        en: Please come in. The bathroom is next to the kitchen.
  - title: Di seberang ada sebuah pura
    body:
      ar_eg: |
        - كلمات المكان قبل الحاجة: di seberang warung، di ujung gang، di antara masjid dan apotek.
        - ومع ada استعمل كلمات العدّ: sebuah (حاجات ومباني)، seorang (ناس)، seekor (حيوانات).
      ar: |
        - ظرف المكان قبل الاسم: di seberang warung، di ujung gang، di antara masjid dan apotek.
        - ومع ada استعمل ألفاظ العدّ: sebuah للأشياء والمباني، وseorang للبشر، وseekor للحيوان.
      en: |
        - Position word before the noun: di seberang warung, di ujung gang, di antara masjid dan apotek.
        - With ada, use counters: sebuah (things, buildings), seorang (people), seekor (animals).
    grammar: id.location.words
    examples:
      - text: Di ujung gang ada sebuah pura.
        ar_eg: في آخر الحارة فيه معبد.
        ar: في آخر الزقاق معبد.
        en: At the end of the alley there's a temple.
