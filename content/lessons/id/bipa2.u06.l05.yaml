dialogue:
  title: Kos baru Mohamed
  lines:
    - speaker: Rina
      text: Mohamed, bagaimana kos barumu di Sanur?
      ar_eg: يا محمد، إيه أخبار السكن الجديد بتاعك في سانور؟
      ar: يا محمد، كيف سكنك الجديد في سانور؟
      en: Mohamed, how's your new place in Sanur?
    - speaker: Mohamed
      text: Bagus! Kamar tidur saya besar, dan kamar mandinya di dalam.
      ar_eg: حلو! أوضة نومي كبيرة، والحمّام جوّه.
      ar: جميل! غرفة نومي كبيرة، والحمّام في الداخل.
      en: Great! My bedroom is big, and the bathroom is inside.
    - speaker: Rina
      text: Jalannya bagaimana? Ramai?
      ar_eg: والشارع عامل إزاي؟ زحمة؟
      ar: وكيف الشارع؟ هل هو مزدحم؟
      en: What's the street like? Busy?
    - speaker: Mohamed
      text: Tidak terlalu ramai. Di ujung gang ada sebuah pura, dan di seberang pura ada warung.
      ar_eg: مش زحمة قوي. في آخر الحارة فيه معبد، وقصاد المعبد فيه وارونج.
      ar: ليس مزدحمًا جدًّا. في آخر الزقاق معبد، ومقابل المعبد مطعم صغير.
      en: Not too busy. At the end of the alley there's a temple, and across from the temple there's a warung.
    - speaker: Rina
      text: Tetanggamu ramah?
      ar_eg: جيرانك لطاف؟
      ar: هل جيرانك لطفاء؟
      en: Are your neighbours friendly?
    - speaker: Mohamed
      text: Ramah sekali! Setiap sore Bu Sari bilang, "Silakan makan, Pak!"
      ar_eg: لطاف جدًّا! كل يوم العصر مدام ساري تقولّي «اتفضل كُل يا أستاذ!»
      ar: لطفاء جدًّا! كل مساء تقول لي السيدة ساري «تفضّل كُل يا سيدي!»
      en: Very friendly! Every afternoon Bu Sari says, "Please eat, sir!"
souvenir:
  id: bipa2.u06.souvenir
  title: Rumah keluarga Bali
  note:
    ar_eg: البيت البالي مش مبنى واحد، ده سور كبير جوّاه كذا «bale» (جناح صغير)، واحد للنوم، وواحد للمطبخ، وواحد للمناسبات. وفي الركن الأقدس، ناحية الجبل، بيبنوا معبد العيلة. زي «بيت العيلة» عندنا في مصر بالظبط، أجيال كتير عايشين مع بعض حوالين حوش واحد.
    ar: البيت البالي ليس بناءً واحدًا، بل سور يضمّ أجنحة صغيرة تُسمّى «bale»، للنوم والطبخ والمناسبات. وفي الركن الأقدس، المواجه للجبل، يقوم معبد العائلة. وهو يشبه «بيت العائلة» في مصر، حيث تعيش أجيال عدة حول فناء واحد.
    en: A Balinese home isn't one building but a walled compound of small pavilions (bale) for sleeping, cooking and ceremonies. In the holiest corner, facing the mountain, stands the family temple. Much like an Egyptian «بيت العيلة», several generations live together around one courtyard.
