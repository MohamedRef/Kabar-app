schema: kabar.lesson/v1
id: bipa5.u04.l05
language: id
title: Kuliah di luar negeri
can_do:
  ar_eg: 'تتكلم عن الدراسة برا بلدك: المعيشة والسكن والصدمة الثقافية.'
  ar: 'أن تتحدّث عن الدراسة في الخارج: المعيشة والسكن والصدمة الثقافية.'
  en: Talk about studying abroad, from living costs and housing to culture shock.
slides:
  - title: Masisir, mahasiswa Indonesia di Mesir
    body:
      ar_eg: |
        آلاف الطلبة الإندونيسيين بيدرسوا في الأزهر، وبيسمّوا نفسهم Masisir (Mahasiswa Indonesia di Mesir). كلامهم عن الغربة فيه الكلمات دي:
        - mahasiswa asing = طالب أجنبي
        - biaya hidup = مصاريف المعيشة
        - asrama = سكن الطلبة / المدينة الجامعية
        - gegar budaya = صدمة ثقافية (gegar = هزّة)
        - beradaptasi = يتأقلم: beradaptasi dengan cuaca, beradaptasi dengan makanan
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: banget = sekali، ngomong = berbicara، cepet = cepat، udah = sudah، bareng = bersama، nggak = tidak.
      ar: |
        يدرس آلاف الطلبة الإندونيسيين في الأزهر، ويسمّون أنفسهم Masisir (Mahasiswa Indonesia di Mesir). وفي حديثهم عن الغربة تتكرّر هذه الكلمات:
        - mahasiswa asing = طالب أجنبي
        - biaya hidup = تكاليف المعيشة
        - asrama = سكن الطلبة، المدينة الجامعية
        - gegar budaya = صدمة ثقافية (gegar = ارتجاج)
        - beradaptasi = يتكيّف: beradaptasi dengan cuaca وberadaptasi dengan makanan
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: banget = sekali، ngomong = berbicara، cepet = cepat، udah = sudah، bareng = bersama، nggak = tidak.
      en: |
        Thousands of Indonesian students study at Al-Azhar and call themselves Masisir (Mahasiswa Indonesia di Mesir). When they talk about life abroad you hear:
        - mahasiswa asing = foreign student
        - biaya hidup = cost of living
        - asrama = student hall, dormitory
        - gegar budaya = culture shock (gegar = a jolt)
        - beradaptasi = to adapt: beradaptasi dengan cuaca, beradaptasi dengan makanan
        The dialogue uses street forms; the formal ones are beside them: banget = sekali, ngomong = berbicara, cepet = cepat, udah = sudah, bareng = bersama, nggak = tidak.
    examples:
      - text: Tahun pertama, banyak mahasiswa asing mengalami gegar budaya.
        ar_eg: في أول سنة، طلبة أجانب كتير بيتعرضوا لصدمة ثقافية.
        ar: في السنة الأولى يمرّ كثير من الطلبة الأجانب بصدمة ثقافية.
        en: In the first year, many foreign students go through culture shock.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mahasiswa asing
        ar_eg: طالب أجنبي
        ar: طالب أجنبي
        en: foreign student
      - text: biaya hidup
        ar_eg: مصاريف المعيشة
        ar: تكاليف المعيشة
        en: cost of living
      - text: asrama
        ar_eg: سكن الطلبة
        ar: سكن الطلبة
        en: dormitory
      - text: gegar budaya
        ar_eg: صدمة ثقافية
        ar: صدمة ثقافية
        en: culture shock
      - text: beradaptasi
        ar_eg: يتأقلم
        ar: يتكيّف
        en: to adapt
    words: [mahasiswa asing, biaya hidup, asrama, gegar budaya, beradaptasi]
  - id: e02
    type: multiple_choice
    question: gegar budaya
    question_meaning:
      ar_eg: أنهي جملة بتوصف ده؟
      ar: أيّ جملة تصف هذا؟
      en: Which sentence describes this?
    options:
      - festival budaya di kampus
      - rasa bingung dan kaget saat tinggal di negara dengan budaya yang berbeda
      - pengetahuan umum tentang budaya
    answer: 1
    words: [gegar budaya]
    explain:
      ar_eg: "gegar = هزّة/صدمة، فـ gegar budaya = صدمة ثقافية: لخبطة واستغراب لما تعيش في ثقافة مختلفة."
      ar: "gegar = اهتزاز أو صدمة، فـ gegar budaya صدمة ثقافية: حيرة ودهشة عند العيش في ثقافة مختلفة."
      en: "gegar is a shock, so gegar budaya is culture shock: confusion and surprise living in a different culture."
  - id: e03
    type: listen
    text: Menurut banyak mahasiswa, biaya hidup di Kairo lebih murah daripada di Jakarta. Akan tetapi, mencari tempat tinggal yang dekat kampus tidak selalu mudah.
    question:
      ar_eg: الطلبة بيقولوا إيه عن المعيشة في القاهرة؟
      ar: ماذا يقول الطلبة عن المعيشة في القاهرة؟
      en: What do the students say about living in Cairo?
    options:
      - Hidup di Kairo murah, tetapi sulit mencari tempat tinggal dekat kampus.
      - Hidup di Kairo lebih mahal daripada di Jakarta.
      - Tempat tinggal di dekat kampus sangat mudah dicari.
    answer: 0
    explain:
      ar_eg: lebih murah daripada di Jakarta = أرخص من جاكرتا، وakan tetapi = لكن، السكن جنب الجامعة مش سهل دايمًا.
      ar: lebih murah daripada di Jakarta = أرخص من جاكرتا، وakan tetapi = لكن، والسكن قرب الجامعة ليس سهلًا دائمًا.
      en: lebih murah daripada di Jakarta = cheaper than Jakarta; akan tetapi = however, housing near campus isn't always easy.
    words: [biaya hidup]
  - id: e04
    type: fill_blank
    sentence: Mahasiswa baru tinggal di ___ kampus selama tahun pertama.
    meaning:
      ar_eg: الطلبة الجداد بيسكنوا في المدينة الجامعية أول سنة.
      ar: يسكن الطلبة الجدد في السكن الجامعي خلال السنة الأولى.
      en: New students live in the campus dormitory in their first year.
    options: [asrama, gegar budaya, biaya hidup]
    answers: [asrama]
    words: [asrama]
    explain:
      ar_eg: الطلبة «بيسكنوا» في asrama (سكن جامعي). gegar budaya = صدمة ثقافية وbiaya hidup = تكلفة المعيشة، ومش أماكن.
      ar: يسكن الطلّاب في asrama (السكن الجامعي). أما gegar budaya فالصدمة الثقافية، وbiaya hidup تكلفة المعيشة.
      en: Students live in an asrama (dorm). gegar budaya (culture shock) and biaya hidup (cost of living) aren't places.
  - id: e05
    type: build_sentence
    source:
      ar_eg: الطلبة الأجانب لازم يتأقلموا مع الجو.
      ar: على الطلبة الأجانب أن يتكيّفوا مع الطقس.
      en: Foreign students have to adapt to the weather.
    answer: Mahasiswa asing harus beradaptasi dengan cuaca.
    distractors: [asrama, biaya]
    words: [mahasiswa asing, beradaptasi]
    explain:
      ar_eg: «يتأقلموا مع» = beradaptasi dengan. asrama = سكن وbiaya = تكلفة، مش في الجملة.
      ar: «يتكيّفوا مع» = beradaptasi dengan. أما asrama فالسكن، وbiaya التكلفة.
      en: "\"Adapt to\" is beradaptasi dengan. asrama (dorm) and biaya (cost) aren't in it."
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مصاريف المعيشة في القاهرة مش غالية.
      ar: تكاليف المعيشة في القاهرة ليست مرتفعة.
      en: The cost of living in Cairo isn't high.
    answers:
      - Biaya hidup di Kairo tidak mahal.
      - Biaya hidup di Kairo tidak tinggi.
      - Biaya hidup di Kairo tidak terlalu mahal.
      - Biaya hidup di Kairo nggak mahal.
      - Biaya hidup di Kairo nggak tinggi.
      - Biaya hidup di Kairo nggak terlalu mahal.
    words: [biaya hidup]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة مثال على gegar budaya؟
      ar: أيّها مثال على gegar budaya؟
      en: Which one is an example of gegar budaya?
    options:
      - Membeli buku di toko.
      - Tidur jam sepuluh malam.
      - Bingung karena orang di sekitar berbicara sangat keras dan cepat.
    answer: 2
    explain:
      ar_eg: الصدمة الثقافية إنك تتلخبط من عادات جديدة عليك، زي الطالب الإندونيسي اللي متعود على الكلام الهادي.
      ar: الصدمة الثقافية ارتباكك أمام عادات غريبة عليك، كالطالب الإندونيسي المعتاد على الكلام الهادئ.
      en: Culture shock is being thrown by unfamiliar habits, like an Indonesian student used to soft speech.
    words: [gegar budaya]
  - id: e08
    type: speaking
    text: Awalnya saya mengalami gegar budaya, tetapi sekarang saya sudah beradaptasi.
    meaning:
      ar_eg: في الأول اتصدمت ثقافيًا، بس دلوقتي اتأقلمت.
      ar: في البداية مررت بصدمة ثقافية، لكنّي تكيّفت الآن.
      en: At first I had culture shock, but now I've adapted.
    words: [gegar budaya, beradaptasi]
  - id: e09
    type: dictation
    text: Ribuan mahasiswa asing belajar di Al-Azhar, dan banyak dari mereka berasal dari Asia Tenggara.
    meaning:
      ar_eg: آلاف الطلبة الأجانب بيدرسوا في الأزهر، وكتير منهم من جنوب شرق آسيا.
      ar: يدرس آلاف الطلبة الأجانب في الأزهر، وكثير منهم من جنوب شرق آسيا.
      en: Thousands of foreign students study at Al-Azhar, and many of them come from Southeast Asia.
    words: [mahasiswa asing]
  - id: e10
    type: fill_blank
    sentence: Kamar di ___ ini kecil, tetapi biaya hidupnya murah.
    meaning:
      ar_eg: الأوضة في السكن ده صغيرة، بس المعيشة فيه رخيصة.
      ar: الغرفة في هذا السكن صغيرة، لكنّ المعيشة فيه رخيصة.
      en: The rooms in this dormitory are small, but living there is cheap.
    options: [asrama, jurusan, rapor]
    answers: [asrama]
    words: [asrama, biaya hidup]
    explain:
      ar_eg: مكان فيه أوض = asrama. jurusan = قسم وrapor = شهادة درجات، مافيهمش أوض.
      ar: المكان ذو الغرف = asrama. أما jurusan فالقسم، وrapor كشف الدرجات، ولا غرف فيهما.
      en: A place with rooms is an asrama. A jurusan (department) or rapor (report card) has no rooms.
dialogue:
  title: Sepupu Rina di Kairo
  lines:
    - speaker: Rina
      text: Sepupuku kuliah di Al-Azhar. Katanya tahun pertama berat banget.
      ar_eg: ابن عمي بيدرس في الأزهر، وبيقول إن أول سنة كانت صعبة أوي.
      ar: ابن عمّي يدرس في الأزهر، ويقول إنّ السنة الأولى كانت شاقّة جدًا.
      en: My cousin studies at Al-Azhar. He says the first year was really hard.
    - speaker: Mohamed
      text: Pasti gegar budaya, deh. Orang Kairo ngomongnya keras dan cepet!
      ar_eg: أكيد صدمة ثقافية. أهل القاهرة بيتكلموا بصوت عالي وبسرعة!
      ar: لا بدّ أنها الصدمة الثقافية، فأهل القاهرة يتكلّمون بصوت عالٍ وبسرعة!
      en: Culture shock, surely. Cairenes talk loud and fast!
    - speaker: Rina
      text: Iya. Tapi sekarang dia udah beradaptasi. Dia tinggal di asrama bareng mahasiswa asing lain.
      ar_eg: مظبوط. بس دلوقتي اتأقلم، وساكن في سكن الطلبة مع طلبة أجانب تانيين.
      ar: صحيح، لكنه تكيّف الآن، ويسكن في سكن الطلبة مع طلبة أجانب آخرين.
      en: True. But he's adapted now. He lives in a dorm with other foreign students.
    - speaker: Mohamed
      text: Bagus, deh. Biaya hidup di Kairo juga nggak terlalu mahal, kok.
      ar_eg: حلو. والمعيشة في القاهرة كمان مش غالية أوي.
      ar: جيّد، وتكاليف المعيشة في القاهرة ليست مرتفعة جدًا كذلك.
      en: Good. Living costs in Cairo aren't too high either.
