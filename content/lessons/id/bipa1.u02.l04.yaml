schema: kabar.lesson/v1
id: bipa1.u02.l04
language: id
title: Bapak dan Ibu
can_do:
  ar_eg: تنادي الكبار بـ Bapak وIbu وتعزم عليهم بحاجة.
  ar: أن تخاطب الأكبر سنًّا بـ Bapak وIbu وتعرض عليهم شيئًا.
  en: Address older people as Bapak and Ibu and offer them something.
slides:
  - title: Bapak dan Ibu
    body:
      ar_eg: |
        الإندونيسيين بيستخدموا ألقاب العيلة مع كل الناس، زي ما بنقول في مصر «يا حاج» و«يا أبلة».
        - Bapak (مختصرة Pak): لراجل أكبر منك أو محترم — مدرّس، موظف، صاحب محل.
        - Ibu (مختصرة Bu): لست أكبر منك أو محترمة.
        وقبل الاسم: Pak Irwan، Bu Yanti.
      ar: |
        يستعمل الإندونيسيون ألفاظ القرابة مع جميع الناس، كما ننادي في مصر «يا حاج» و«يا أبلة».
        - Bapak (اختصارها Pak): للرجل الأكبر سنًّا أو المحترم — معلم، موظف، صاحب متجر.
        - Ibu (اختصارها Bu): للمرأة الأكبر سنًّا أو المحترمة.
        وتسبق الاسم: Pak Irwan، Bu Yanti.
      en: |
        Indonesians use family words for everyone, like Egyptian «يا حاج» or «يا أبلة».
        - Bapak (short: Pak): an older or respected man — teacher, official, shop owner.
        - Ibu (short: Bu): an older or respected woman.
        Before names: Pak Irwan, Bu Yanti.
    grammar: id.address.terms
    examples:
      - text: Selamat pagi, Bu Yanti!
        ar_eg: صباح الخير يا مدام يانتي!
        ar: صباح الخير يا سيدة يانتي!
        en: Good morning, Bu Yanti!
      - text: Permisi, Pak. Pak Irwan di mana?
        ar_eg: بعد إذنك يا أستاذ. الأستاذ إروان فين؟
        ar: بعد إذنك يا سيدي. أين الأستاذ إروان؟
        en: Excuse me, sir. Where is Pak Irwan?
  - title: Bapak mau apa?
    body:
      ar_eg: |
        أهم حاجة: اللقب هو نفسه «إنت». بدل «إنت عايز إيه؟» تقول «Bapak mau apa?» زي «حضرتك عايز إيه؟».
        وماتجمعش kamu مع اللقب: «Kamu mau apa, Pak?» غلط؛ قول «Bapak mau apa?».
      ar: |
        الأهم أن اللقب نفسه يقوم مقام «أنت». فبدل «ماذا تريد؟» تقول «Bapak mau apa?» كقولنا «حضرتك تريد ماذا؟».
        ولا تجمع kamu مع اللقب: «Kamu mau apa, Pak?» خطأ، والصواب «Bapak mau apa?».
      en: |
        Key point: the title is the "you". Instead of "What do you want?" say "Bapak mau apa?" — like «حضرتك عايز إيه؟».
        Don't add kamu to a title: "Kamu mau apa, Pak?" is wrong; say "Bapak mau apa?".
    grammar: id.address.terms
    examples:
      - text: Bapak mau apa?
        ar_eg: حضرتك عايز إيه؟
        ar: ماذا تريد يا سيدي؟
        en: What would you like, sir?
      - text: Ibu mau kopi?
        ar_eg: حضرتك عايزة قهوة؟
        ar: هل تريدين قهوة يا سيدتي؟
        en: Would you like coffee, ma'am?
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تسأل الأستاذ إروان بأدب «حضرتك عايز إيه؟».
      ar: تريد أن تسأل الأستاذ إروان بأدب «ماذا تريد يا سيدي؟».
      en: You want to ask Pak Irwan politely, "What would you like?"
    options: ['Kamu mau apa, Pak?', 'Bapak mau apa?', 'Dia mau apa?']
    answer: 1
    explain:
      ar_eg: اللقب هو «إنت». ماتحطش kamu معاه. وdia يعني «هو».
      ar: اللقب هو الضمير نفسه، فلا تضف kamu، وdia تعني «هو».
      en: The title is the "you"; don't add kamu. dia means "he".
    words: [Bapak, mau]
  - id: e02
    type: fill_blank
    sentence: Pak, ___ mau kopi?
    meaning:
      ar_eg: حضرتك عايز قهوة يا أستاذ؟
      ar: هل تريد قهوة يا سيدي؟
      en: Would you like coffee, sir?
    options: [Bapak, Kamu, Aku]
    answers: [Bapak]
    explain:
      ar_eg: مع Pak اللقب نفسه هو «إنت»، يبقى Bapak.
      ar: مع Pak يكون اللقب هو الضمير، فالصواب Bapak.
      en: With Pak, the title itself is the "you", so it is Bapak.
    words: [Bapak, mau, kopi]
  - id: e03
    type: build_sentence
    source:
      ar_eg: حضرتك عايزة قهوة يا مدام؟
      ar: هل تريدين قهوة يا سيدتي؟
      en: Would you like coffee, ma'am?
    answer: Ibu mau kopi?
    distractors: [kamu, teh]
    words: [Ibu, mau, kopi]
  - id: e04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بعد إذنك يا أستاذ. الأستاذ إروان فين؟
      ar: بعد إذنك يا سيدي. أين الأستاذ إروان؟
      en: Excuse me, sir. Where is Pak Irwan?
    answers: ['Permisi, Pak. Pak Irwan di mana?', 'Permisi, Pak. Pak Irwan di mana', 'Permisi Pak, Pak Irwan di mana?', 'Permisi, Pak. Di mana Pak Irwan?', 'Permisi Pak, di mana Pak Irwan?', 'Permisi, Bapak. Pak Irwan di mana?']
    words: [permisi, Bapak, di mana]
  - id: e05
    type: speaking
    text: Ibu mau apa?
    meaning:
      ar_eg: حضرتك عايزة إيه؟
      ar: ماذا تريدين يا سيدتي؟
      en: What would you like, ma'am?
    words: [Ibu, mau]
  - id: e06
    type: listen
    text: Ibu mau kopi?
    options: ['Ibu mau teh?', 'Bapak mau kopi?', 'Ibu mau kopi?']
    answer: 2
    meaning:
      ar_eg: حضرتك عايزة قهوة؟
      ar: هل تريدين قهوة يا سيدتي؟
      en: Would you like coffee, ma'am?
    words: [Ibu, mau, kopi]
dialogue:
  lines:
    - speaker: Pak Irwan
      text: Selamat pagi, Bu Yanti!
      ar_eg: صباح الخير يا مدام يانتي!
      ar: صباح الخير يا سيدة يانتي!
      en: Good morning, Bu Yanti!
    - speaker: Bu Yanti
      text: Pagi, Pak Irwan! Bapak mau kopi?
      ar_eg: صباح النور يا أستاذ إروان! حضرتك عايز قهوة؟
      ar: صباح النور يا أستاذ إروان! هل تريد قهوة؟
      en: Morning, Pak Irwan! Would you like a coffee?
    - speaker: Pak Irwan
      text: Ya, terima kasih, Bu. Ibu juga mau kopi?
      ar_eg: أيوه، شكرًا يا مدام. وحضرتك كمان عايزة قهوة؟
      ar: نعم، شكرًا يا سيدتي. وهل تريدين قهوة أيضًا؟
      en: Yes, thank you, ma'am. Would you like a coffee too?
    - speaker: Bu Yanti
      text: Ya, saya juga mau kopi.
      ar_eg: أيوه، أنا كمان عايزة قهوة.
      ar: نعم، أريد قهوة أيضًا.
      en: Yes, I'd like a coffee too.
new_words:
  - word: Bapak
    pos: noun
    ar_eg: أستاذ، حضرتك (لراجل أكبر)؛ أب
    ar: سيدي، حضرتك (لرجل أكبر)؛ أب
    en: sir, Mr; you (to an older man); father
  - word: Ibu
    pos: noun
    ar_eg: مدام، حضرتك (لست أكبر)؛ أم
    ar: سيدتي، حضرتك (لامرأة أكبر)؛ أم
    en: ma'am, Mrs; you (to an older woman); mother
  - word: mau
    pos: verb
    ar_eg: عايز
    ar: يريد
    en: to want
  - word: kopi
    pos: noun
    ar_eg: قهوة
    ar: قهوة
    en: coffee
