schema: kabar.lesson/v1
id: bipa4.u09.l03
language: id
title: Menimbang untung-rugi
can_do:
  ar_eg: توزن المكسب والخسارة في قضية بيئية وتربط الأسباب بالنتايج.
  ar: أن تزن المكاسب والخسائر في قضية بيئية وتربط الأسباب بالنتائج.
  en: Weigh the pros and cons of an environmental issue, linking causes and effects.
slides:
  - title: Sebab dan akibat
    body:
      ar_eg: |
        افتكر روابط السبب والنتيجة:
        Karena … , … · … sehingga … (في نفس الجملة)
        جملة جديدة: Akibatnya, … (نتيجة وحشة) / Oleh karena itu, …
        والفعل: X menyebabkan Y = X بيسبّب Y.
        وخلي بالك: Karena … , maka … غلط، استعمل واحدة بس.
      ar: |
        تذكّر روابط السبب والنتيجة:
        Karena … , … · … sehingga … (في الجملة نفسها)
        في جملة جديدة: Akibatnya, … (نتيجة سيئة) / Oleh karena itu, …
        والفعل: X menyebabkan Y = X يسبّب Y.
        وانتبه: Karena … , maka … خطأ، فاستعمل إحداهما فقط.
      en: |
        Remember the cause-effect links:
        Karena … , … · … sehingga … (inside one sentence)
        New sentence: Akibatnya, … (a bad result) / Oleh karena itu, …
        Verb: X menyebabkan Y = X causes Y.
        Careful: Karena … , maka … is wrong; use one or the other.
    grammar: id.conjunction.cause-effect
    examples:
      - text: Perubahan iklim menyebabkan kenaikan suhu laut.
        ar_eg: تغيّر المناخ بيسبّب ارتفاع حرارة البحر.
        ar: يسبّب تغيّرُ المناخ ارتفاعَ حرارة البحر.
        en: Climate change causes a rise in sea temperature.
      - text: Suhu laut naik sehingga karang memutih.
        ar_eg: حرارة البحر بتعلى فالمرجان بيبيض.
        ar: ترتفع حرارة البحر فيبيضّ المرجان.
        en: The sea temperature rises, so the coral turns white.
  - title: Untung-rugi
    body:
      ar_eg: |
        untung-rugi = المكسب والخسارة (الإيجابيات والسلبيات). menimbang = يوزن.
        berkat + سبب حلو (بفضل)، وakibat + سبب وحش (بسبب). وiklim (مناخ) جاية من العربي «إقليم».
      ar: |
        untung-rugi = المكاسب والخسائر. menimbang = يزن.
        berkat + سبب جيد (بفضل)، وakibat + سبب سيئ (نتيجةً لـ). وiklim (مناخ) من العربية «إقليم».
      en: |
        untung-rugi = pros and cons (literally profit-loss). menimbang = weigh.
        berkat + a good cause (thanks to); akibat + a bad cause (as a result of). iklim (climate) comes from Arabic «إقليم».
    grammar: id.conjunction.cause-effect
    examples:
      - text: Berkat larangan itu, laut Bunaken lebih bersih.
        ar_eg: بفضل المنع ده، بحر بوناكين بقى أنضف.
        ar: بفضل ذلك الحظر صار بحر بوناكن أنظف.
        en: Thanks to the ban, the sea at Bunaken is cleaner.
      - text: Akibatnya, nelayan kehilangan mata pencaharian.
        ar_eg: والنتيجة إن الصيادين خسروا مصدر رزقهم.
        ar: ونتيجة لذلك فقد الصيادون مصدر رزقهم.
        en: As a result, fishermen lost their livelihood.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: untung-rugi
        ar_eg: المكسب والخسارة
        ar: المكاسب والخسائر
        en: pros and cons
      - text: iklim
        ar_eg: مناخ
        ar: مناخ
        en: climate
      - text: suhu
        ar_eg: درجة الحرارة
        ar: درجة الحرارة
        en: temperature
      - text: kenaikan
        ar_eg: ارتفاع / زيادة
        ar: ارتفاع، زيادة
        en: rise, increase
      - text: mata pencaharian
        ar_eg: مصدر الرزق / أكل العيش
        ar: مصدر الرزق
        en: livelihood
    words: [untung-rugi, iklim, suhu, kenaikan, mata pencaharian]
  - id: e02
    type: multiple_choice
    question: ___ warga, pantai itu bersih kembali.
    question_meaning:
      ar_eg: بفضل الأهالي، الشط رجع نضيف. أنهي كلمة؟
      ar: بفضل السكان عاد الشاطئ نظيفًا. أيّ كلمة تناسب؟
      en: Thanks to the residents, the beach is clean again. Which word fits?
    options: [Akibat, Berkat, Gara-gara]
    answer: 1
    explain:
      ar_eg: berkat للسبب الحلو بس. akibat وgara-gara للحاجات الوحشة.
      ar: berkat للسبب الجيد فقط، أما akibat وgara-gara فللسيئ.
      en: berkat is only for good causes; akibat and gara-gara are for bad ones.
  - id: e03
    type: listen
    text: Perubahan iklim menyebabkan kenaikan suhu laut.
    options: ["Perubahan iklim menyebabkan kenaikan suhu laut.", "Perubahan iklim menyebabkan penurunan suhu laut.", "Perubahan cuaca menyebabkan kenaikan suhu laut."]
    answer: 0
    meaning:
      ar_eg: تغيّر المناخ بيسبّب ارتفاع حرارة البحر.
      ar: يسبّب تغيّرُ المناخ ارتفاعَ حرارة البحر.
      en: Climate change causes a rise in sea temperature.
    words: [iklim, kenaikan, suhu]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح في الإندونيسي الفصيح؟
      ar: أيّ جملة صحيحة في الإندونيسية المعيارية؟
      en: Which sentence is correct standard Indonesian?
    options: ["Karena suhu laut naik, maka karang memutih.", "Suhu laut naik, sehingga maka karang memutih.", "Karena suhu laut naik, karang memutih."]
    answer: 2
    explain:
      ar_eg: karena وmaka مع بعض غلط في الفصحى. واحدة بس تكفي.
      ar: لا تُجمع karena وmaka في الفصحى، فواحدة تكفي.
      en: Standard Indonesian doesn't combine karena and maka; one is enough.
    words: [suhu]
  - id: e05
    type: fill_blank
    sentence: Karang di sini rusak. ___, nelayan kehilangan mata pencaharian.
    meaning:
      ar_eg: المرجان هنا باظ. والنتيجة إن الصيادين خسروا رزقهم.
      ar: تضرّر المرجان هنا، ونتيجة لذلك فقد الصيادون مصدر رزقهم.
      en: The coral here is damaged. As a result, fishermen have lost their livelihood.
    options: [Berkat, Sehingga, Akibatnya]
    answers: [Akibatnya]
    explain:
      ar_eg: في أول جملة جديدة بنقول Akibatnya, … . sehingga بتربط جوه نفس الجملة.
      ar: في أول جملة جديدة نقول Akibatnya, … ، أما sehingga فتربط داخل الجملة نفسها.
      en: At the start of a new sentence use Akibatnya, … ; sehingga links inside one sentence.
    words: [mata pencaharian, kehilangan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: تغيّر المناخ بيسبّب ارتفاع حرارة البحر.
      ar: يسبّب تغيّرُ المناخ ارتفاعَ حرارة البحر.
      en: Climate change causes a rise in sea temperature.
    answer: Perubahan iklim menyebabkan kenaikan suhu laut.
    distractors: [berkat, sehingga]
    words: [iklim, kenaikan, suhu]
    explain:
      ar_eg: menyebabkan = يسبّب، وkenaikan suhu = ارتفاع الحرارة. berkat للحاجات الكويسة، وsehingga بتربط جملتين كاملتين.
      ar: menyebabkan = يسبّب، وkenaikan suhu = ارتفاع الحرارة. أما berkat فللخير، وsehingga تربط جملتين تامّتين.
      en: menyebabkan means causes, and kenaikan suhu is a rise in temperature. berkat is for good outcomes, and sehingga links two full clauses.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لازم نوزن المكسب والخسارة بتاعة المنع ده.
      ar: يجب أن نزن مكاسب هذا الحظر وخسائره.
      en: We must weigh the pros and cons of this ban.
    answers:
      - Kita harus menimbang untung-rugi larangan ini.
      - Kita harus menimbang untung-rugi larangan ini
      - Kita harus menimbang untung rugi larangan ini.
      - Kita harus menimbang untung dan rugi larangan ini.
      - Kita harus menimbang untung-rugi dari larangan ini.
      - Kita perlu menimbang untung-rugi larangan ini.
    words: [untung-rugi]
  - id: e08
    type: speaking
    text: Kita harus menimbang untung-rugi, karena banyak nelayan bisa kehilangan mata pencaharian.
    meaning:
      ar_eg: لازم نوزن المكسب والخسارة، عشان صيادين كتير ممكن يخسروا رزقهم.
      ar: يجب أن نزن المكاسب والخسائر، لأن كثيرًا من الصيادين قد يفقدون مصدر رزقهم.
      en: We must weigh the pros and cons, because many fishermen could lose their livelihood.
    words: [untung-rugi, mata pencaharian, kehilangan]
  - id: e09
    type: multiple_choice
    question: Banyak warga kehilangan pekerjaan karena banjir.
    question_meaning:
      ar_eg: حصل إيه لناس كتير؟
      ar: ماذا حدث لكثير من السكان؟
      en: What happened to many residents?
    options: ['Mereka tidak punya pekerjaan lagi.', 'Mereka mendapat pekerjaan baru.', 'Mereka pindah ke kota.']
    answer: 0
    explain:
      ar_eg: kehilangan = يخسر / يفقد.
      ar: kehilangan = يفقد.
      en: kehilangan = lose.
    words: [kehilangan]
dialogue:
  title: Karang yang memutih
  lines:
    - speaker: Mohamed
      text: Mas, kok ada karang di sini yang warnanya putih?
      ar_eg: يا رزال، ليه فيه مرجان هنا لونه أبيض؟
      ar: يا رزال، لماذا بعض المرجان هنا أبيض اللون؟
      en: Rizal, why is there white coral here?
    - speaker: Mas Rizal
      text: Karena suhu laut naik. Itu akibat perubahan iklim.
      ar_eg: عشان حرارة البحر بتعلى. ودي نتيجة تغيّر المناخ.
      ar: لأن حرارة البحر ترتفع، وذلك نتيجة تغيّر المناخ.
      en: Because the sea temperature is rising. That's the result of climate change.
    - speaker: Mohamed
      text: Terus, nelayan di sini gimana?
      ar_eg: طب والصيادين اللي هنا؟
      ar: وماذا عن الصيادين هنا؟
      en: So what about the fishermen here?
    - speaker: Mas Rizal
      text: Banyak yang kehilangan mata pencaharian. Oleh karena itu, pemerintah harus menimbang untung-rugi setiap kebijakan.
      ar_eg: كتير منهم خسروا رزقهم. عشان كده الحكومة لازم توزن المكسب والخسارة في كل سياسة.
      ar: فقد كثيرون منهم مصدر رزقهم، لذلك يجب على الحكومة أن تزن مكاسب كل سياسة وخسائرها.
      en: Many have lost their livelihood. That's why the government must weigh the pros and cons of every policy.
