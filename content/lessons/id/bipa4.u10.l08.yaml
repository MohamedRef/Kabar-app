schema: kabar.lesson/v1
id: bipa4.u10.l08
language: id
title: Ulangan Unit 10
can_do:
  ar_eg: تحكي سيرة شخصية وطنية بتعبيرات اصطلاحية وبأسلوب الخطبة.
  ar: أن تروي سيرة شخصية وطنية بتعابير اصطلاحية وبأسلوب الخطاب.
  en: Recount a national figure's life with idioms, in speech style.
slides:
  - title: Tokoh, ungkapan, pidato
    body:
      ar_eg: |
        افتكر:
        التعبيرات: buah tangan، buah bibir، kambing hitam، rendah hati، tinggi hati، keras kepala، banting tulang، makan garam.
        السيرة: lahir، menjabat sebagai، mendapat gelar، wafat، dimakamkan.
        الخطبة: Yang terhormat … ، Puji syukur … ، Pada kesempatan ini … ، Akhir kata … .
      ar: |
        تذكّر:
        التعابير: buah tangan، buah bibir، kambing hitam، rendah hati، tinggi hati، keras kepala، banting tulang، makan garam.
        السيرة: lahir، menjabat sebagai، mendapat gelar، wafat، dimakamkan.
        الخطاب: Yang terhormat … ، Puji syukur … ، Pada kesempatan ini … ، Akhir kata … .
      en: |
        Remember:
        Idioms: buah tangan, buah bibir, kambing hitam, rendah hati, tinggi hati, keras kepala, banting tulang, makan garam.
        Biography: lahir, menjabat sebagai, mendapat gelar, wafat, dimakamkan.
        Speech: Yang terhormat … , Puji syukur … , Pada kesempatan ini … , Akhir kata … .
    grammar: id.idiom.basic
    examples:
      - text: Sam Ratulangi lahir di Tondano dan wafat pada tahun 1949.
        ar_eg: سام راتولانجي اتولد في توندانو واتوفّى سنة 1949.
        ar: وُلد سام راتولانغي في توندانو وتُوفّي عام 1949.
        en: Sam Ratulangi was born in Tondano and passed away in 1949.
      - text: Beliau rendah hati dan membanting tulang untuk rakyat.
        ar_eg: كان متواضع وبيشتغل جامد عشان الناس.
        ar: كان متواضعًا وكدح من أجل الشعب.
        en: He was humble and worked himself to the bone for the people.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kambing hitam
        ar_eg: كبش فدا
        ar: كبش فداء
        en: scapegoat
      - text: buah bibir
        ar_eg: حديث الناس
        ar: حديث الناس
        en: talk of the town
      - text: rendah hati
        ar_eg: متواضع
        ar: متواضع
        en: humble
      - text: makan garam
        ar_eg: عنده خبرة
        ar: ذو خبرة
        en: be experienced
      - text: keras kepala
        ar_eg: عنيد
        ar: عنيد
        en: stubborn
    words: [kambing hitam, buah bibir, rendah hati, makan garam, keras kepala]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: ابن عمك دايمًا بيتلام على أي حاجة بتبوظ في العيلة. هو…
      ar: ابن عمك يُلام دائمًا على كل ما يفسد في العائلة. إنه…
      en: Your cousin always gets blamed for whatever goes wrong in the family. He's the…
    options: [buah bibir, kambing hitam, buah tangan]
    answer: 1
    explain:
      ar_eg: kambing hitam = اللي بيشيل غلط غيره (كبش فدا).
      ar: kambing hitam = من يُحمَّل خطأ غيره (كبش الفداء).
      en: kambing hitam is the one who takes the blame for others (scapegoat).
    words: [kambing hitam]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: بتكتب سيرة بطل قومي. أنهي جملة مناسبة؟
      ar: تكتب سيرة بطل وطني. أيّ جملة مناسبة؟
      en: You're writing a national hero's biography. Which sentence fits?
    options: ["Beliau mati pada tahun 1949.", "Dia hilang pada tahun 1949.", "Beliau wafat pada tahun 1949."]
    answer: 2
    explain:
      ar_eg: wafat (من «وفاة») هي الكلمة المحترمة. mati جافة على الإنسان، وغالبًا للحيوانات.
      ar: wafat (من «وفاة») هي الكلمة المحترمة، أما mati فجافة عن الإنسان وتُستعمل غالبًا للحيوان.
      en: wafat (from «وفاة») is the respectful word; mati sounds blunt for a person and is mostly used for animals.
    words: [wafat]
  - id: e04
    type: listen
    text: Beliau menjabat sebagai gubernur dan dimakamkan di Tondano.
    options: ["Beliau menjabat sebagai gubernur dan dimakamkan di Tondano.", "Beliau menjabat sebagai gubernur dan dilahirkan di Tondano.", "Beliau bekerja sebagai guru dan dimakamkan di Tondano."]
    answer: 0
    meaning:
      ar_eg: كان محافظ واتدفن في توندانو.
      ar: تولّى منصب الحاكم ودُفن في توندانو.
      en: He served as governor and was buried in Tondano.
    words: [menjabat, gubernur, dimakamkan]
  - id: e05
    type: listen
    text: Kakek saya rendah hati dan sudah banyak makan garam.
    options: ["Kakek saya tinggi hati dan sudah banyak makan garam.", "Kakek saya rendah hati dan sudah banyak makan garam.", "Kakek saya rendah hati dan suka makan garam."]
    answer: 1
    meaning:
      ar_eg: جدي متواضع وعنده خبرة كبيرة في الحياة.
      ar: جدي متواضع وذو خبرة كبيرة في الحياة.
      en: My grandfather is humble and has seen a lot of life.
    words: [rendah hati, makan garam]
  - id: e06
    type: fill_blank
    sentence: Beliau mendapat ___ Pahlawan Nasional pada tahun 1961.
    meaning:
      ar_eg: أخد لقب بطل قومي سنة 1961.
      ar: نال لقب البطل الوطني عام 1961.
      en: He received the title of National Hero in 1961.
    options: [riwayat, gelar, sambutan]
    answers: [gelar]
    words: [gelar]
  - id: e07
    type: fill_blank
    sentence: ___ kata, terima kasih atas perhatian Anda.
    meaning:
      ar_eg: (اكتب الكلمة) وفي الختام، شكرًا على حسن استماعكم.
      ar: (اكتب الكلمة) وفي الختام، شكرًا لحسن إصغائكم.
      en: (Type the word.) In closing, thank you for your attention.
    answers: [Akhir, akhir]
    words: [akhir kata]
  - id: e08
    type: build_sentence
    source:
      ar_eg: كان شخصية متواضعة بتشتغل جامد عشان الناس.
      ar: كان شخصية متواضعة تكدح من أجل الشعب.
      en: He was a humble figure who worked himself to the bone for the people.
    answer: Beliau tokoh rendah hati yang membanting tulang untuk rakyat.
    distractors: [tinggi, kepala]
    words: [rendah hati, banting tulang, tokoh]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: سام راتولانجي اتولد في توندانو سنة 1890.
      ar: وُلد سام راتولانغي في توندانو عام 1890.
      en: Sam Ratulangi was born in Tondano in 1890.
    answers:
      - Sam Ratulangi lahir di Tondano pada tahun 1890.
      - Sam Ratulangi lahir di Tondano pada tahun 1890
      - Sam Ratulangi lahir di Tondano tahun 1890.
      - Sam Ratulangi dilahirkan di Tondano pada tahun 1890.
      - Pada tahun 1890, Sam Ratulangi lahir di Tondano.
      - Sam Ratulangi lahir pada tahun 1890 di Tondano.
  - id: e10
    type: speaking
    text: Hadirin yang terhormat, hari ini saya akan menceritakan riwayat hidup Sam Ratulangi.
    meaning:
      ar_eg: أيها الحضور المحترمين، النهارده هحكي لكم سيرة حياة سام راتولانجي.
      ar: أيها الحضور المحترمون، سأروي لكم اليوم سيرة حياة سام راتولانغي.
      en: Honoured guests, today I will tell you the life story of Sam Ratulangi.
    words: [hadirin, terhormat, riwayat hidup]
dialogue:
  title: Makam Sam Ratulangi
  lines:
    - speaker: Mohamed
      text: Mas, ini makam Sam Ratulangi, ya?
      ar_eg: يا رزال، ده قبر سام راتولانجي، صح؟
      ar: يا رزال، هذا قبر سام راتولانغي، أليس كذلك؟
      en: Rizal, this is Sam Ratulangi's grave, isn't it?
    - speaker: Mas Rizal
      text: Ya. Beliau wafat di Jakarta, tetapi dimakamkan di sini, di kota kelahirannya.
      ar_eg: أيوه. اتوفّى في جاكرتا، بس اتدفن هنا في البلد اللي اتولد فيها.
      ar: نعم. تُوفّي في جاكرتا، لكنه دُفن هنا في مسقط رأسه.
      en: Yes. He passed away in Jakarta, but he was buried here, in his hometown.
    - speaker: Mohamed
      text: Riwayat hidup beliau luar biasa. Beliau belajar di Eropa dan menjabat sebagai gubernur.
      ar_eg: سيرة حياته مدهشة. اتعلّم في أوروبا وبقى محافظ.
      ar: سيرة حياته مذهلة؛ درس في أوروبا وتولّى منصب الحاكم.
      en: His life story is remarkable. He studied in Europe and served as governor.
    - speaker: Mas Rizal
      text: Dan beliau tetap rendah hati. Namanya menjadi buah bibir sampai sekarang.
      ar_eg: وفضل متواضع. واسمه لسه على لسان الناس لحد النهارده.
      ar: وظلّ متواضعًا، وما زال اسمه على ألسنة الناس حتى اليوم.
      en: And he stayed humble. His name is still on everyone's lips today.
    - speaker: Mohamed
      text: Saya akan menulis riwayat hidup beliau untuk blog saya.
      ar_eg: هكتب سيرة حياته في المدونة بتاعتي.
      ar: سأكتب سيرة حياته في مدونتي.
      en: I'll write his life story for my blog.
souvenir:
  id: bipa4.u10.souvenir
  title: Festival Bunga Tomohon
  note:
    ar_eg: توموهون اسمها «مدينة الورد»، وفي مهرجانها الدولي للورد بتمشي في الشوارع عربيات متغطية بآلاف الورد. بس قبل الاستعراض لازم الخطب، وكل خطبة بتبدأ بتحية طويلة لكل واحد حسب مقامه — Yang terhormat Bapak Gubernur، Yang terhormat Bapak Wali Kota… — وبعدين بس يبدأ الكلام. دلوقتي إنت كمان تقدر تقف وتقول خطبتك بنفس الطريقة.
    ar: تُلقَّب توموهون بـ«مدينة الزهور»، وفي مهرجانها الدولي للزهور تجوب الشوارع عربات مكسوّة بآلاف الأزهار. لكن قبل الاستعراض تأتي الخطب، وكل خطاب يبدأ بتحية طويلة لكل حاضر بحسب مقامه — Yang terhormat Bapak Gubernur، Yang terhormat Bapak Wali Kota… — ثم يبدأ المضمون. والآن تستطيع أنت أيضًا أن تقف وتلقي خطابك على هذا النحو.
    en: Tomohon is known as the City of Flowers, and at its international flower festival, floats covered in thousands of blooms parade through the streets. But first come the speeches, and each one opens with a long greeting to everyone present by rank (Yang terhormat Bapak Gubernur, Yang terhormat Bapak Wali Kota…) before the content begins. Now you can stand up and give your speech the same way.
