schema: kabar.lesson/v1
id: bipa4.u10.l08
language: id
title: Mampu mencapai cita-cita
can_do:
  ar_eg: 'تحكي عن إنجازات شخص: قدر يوصل لهدفه، رغم الصعوبات، وخصوصًا في الدراسة.'
  ar: 'أن تروي إنجازات شخص: استطاع بلوغ هدفه رغم الصعوبات، وخاصة في الدراسة.'
  en: 'Talk about someone''s achievements: they managed to reach a goal, despite difficulties, especially in study.'
slides:
  - title: Kata untuk riwayat hidup
    body:
      ar_eg: |
        mampu = يقدر (mampu membaca = يقدر يقرا)، mencapai = يوصل لـ، يحقق (capai = وصل)، maksud = المقصود، المعنى (apa maksudnya? = قصده إيه؟).
        terutama = خصوصًا، serta = وكمان (أرسمي من dan)، pula = برضه، كمان (بييجي بعد الكلمة: pintar pula).
        meski = رغم إن (meski hujan = رغم إن الدنيا بتمطر)، bila = لما، لو (bila ada waktu = لو فيه وقت).
      ar: |
        mampu = يستطيع (mampu membaca = يستطيع القراءة)، mencapai = يبلغ، يحقق (capai = بلغ)، maksud = المقصود، المعنى (apa maksudnya? = ما المقصود؟).
        terutama = خاصةً، serta = وكذلك (أكثر رسمية من dan)، pula = أيضًا (تأتي بعد الكلمة: pintar pula).
        meski = رغم أنّ (meski hujan = رغم المطر)، bila = إذا، عندما (bila ada waktu = إذا كان هناك وقت).
      en: |
        mampu = able to (mampu membaca = able to read), mencapai = to reach, achieve (capai = reach), maksud = meaning, intention (apa maksudnya? = what does it mean?).
        terutama = especially, serta = as well as (more formal than dan), pula = also, too (comes after the word: pintar pula).
        meski = although (meski hujan = although it's raining), bila = when, if (bila ada waktu = if there's time).
    examples:
      - text: Meski jauh dari keluarga, dia mampu belajar di Swiss.
        ar_eg: رغم إنه بعيد عن أهله، قدر يدرس في سويسرا.
        ar: رغم بعده عن أسرته، استطاع أن يدرس في سويسرا.
        en: Although far from his family, he was able to study in Switzerland.
      - text: Dia suka semua pelajaran, terutama matematika.
        ar_eg: بيحب كل المواد، خصوصًا الرياضيات.
        ar: يحب كل المواد، خاصةً الرياضيات.
        en: He likes every subject, especially maths.
      - text: Bila ada waktu, kita ke Tondano serta Manado.
        ar_eg: لو فيه وقت، نروح توندانو وكمان مانادو.
        ar: إذا كان هناك وقت، نذهب إلى توندانو وكذلك مانادو.
        en: If there's time, we'll go to Tondano as well as Manado.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mampu
        ar_eg: يقدر
        ar: يستطيع
        en: able to
      - text: maksud
        ar_eg: المقصود
        ar: المعنى، المقصود
        en: meaning
      - text: mencapai
        ar_eg: يوصل لـ
        ar: يبلغ، يحقق
        en: to reach
      - text: terutama
        ar_eg: خصوصًا
        ar: خاصةً
        en: especially
    words: [mampu, maksud, mencapai, terutama]
  - id: e02
    type: match_pairs
    pairs:
      - text: serta
        ar_eg: وكمان
        ar: وكذلك
        en: as well as
      - text: pula
        ar_eg: برضه
        ar: أيضًا
        en: also, too
      - text: meski
        ar_eg: رغم إن
        ar: رغم أنّ
        en: although
      - text: bila
        ar_eg: لو، لما
        ar: إذا، عندما
        en: if, when
    words: [serta, pula, meski, bila]
  - id: e03
    type: listen
    text: Meski sakit, nenek saya mampu berjalan ke pasar.
    question:
      ar_eg: الجدة تقدر تعمل إيه؟
      ar: ماذا تستطيع الجدة أن تفعل؟
      en: What is the grandmother able to do?
    options: [تمشي, تطبخ, تنام]
    answer: 0
    meaning:
      ar_eg: رغم إنها عيانة، جدتي تقدر تمشي للسوق.
      ar: رغم مرضها، تستطيع جدتي المشي إلى السوق.
      en: Although she's ill, my grandmother is able to walk to the market.
    words: [meski, mampu]
  - id: e04
    type: fill_blank
    sentence: ___ ada waktu, saya mau mengunjungi makam Sam Ratulangi.
    meaning:
      ar_eg: ___ فيه وقت، عايز أزور قبر سام راتولانجي.
      ar: ___ كان هناك وقت، أريد زيارة قبر سام راتولانغي.
      en: ___ there's time, I want to visit Sam Ratulangi's grave.
    options: [Bila, Meski, Serta]
    answers: [Bila]
    words: [bila, meski, serta]
    explain:
      ar_eg: bila ada waktu = لو فيه وقت. meski = رغم إن، وserta = وكمان، ومايبدأوش شرط.
      ar: bila ada waktu = إذا كان هناك وقت. أما meski فرغم أنّ، وserta وكذلك، ولا يبدآن شرطًا.
      en: bila ada waktu means if there's time. meski is although and serta is as well as; neither starts a condition.
  - id: e05
    type: multiple_choice
    question: Dia belajar keras dan akhirnya ___ cita-citanya.
    options: [mencapai, terutama, pula]
    answer: 0
    explain:
      ar_eg: mencapai cita-cita = يحقق حلمه. terutama = خصوصًا، وpula = برضه، ومايمشوش هنا.
      ar: mencapai cita-cita = يحقق حلمه. أما terutama فخاصةً، وpula أيضًا، ولا يناسبان هنا.
      en: mencapai cita-cita means to achieve your dream. terutama is especially and pula is also; neither fits here.
    words: [mencapai, terutama, pula]
  - id: e06
    type: fill_blank
    sentence: Ratulangi seorang guru ___ pejuang kemerdekaan.
    meaning:
      ar_eg: راتولانجي كان مدرس ___ مناضل من أجل الاستقلال.
      ar: كان راتولانغي معلّمًا ___ مناضلًا من أجل الاستقلال.
      en: Ratulangi was a teacher ___ a fighter for independence.
    options: [serta, bila, maksud]
    answers: [serta]
    words: [serta, bila, maksud]
    explain:
      ar_eg: guru serta pejuang = مدرس وكمان مناضل، وserta بتوصل اسمين. bila = لو، وmaksud = المعنى.
      ar: guru serta pejuang = معلّم وكذلك مناضل، فـ serta تربط اسمين. أما bila فإذا، وmaksud المعنى.
      en: "guru serta pejuang means a teacher as well as a fighter: serta joins two nouns. bila is if and maksud is meaning."
  - id: e07
    type: multiple_choice
    question: '"Makan garam" itu ungkapan. Apa ___ ungkapan itu?'
    options: [maksud, mampu, bila]
    answer: 0
    explain:
      ar_eg: apa maksud...? = يعني إيه...؟ mampu = يقدر، وbila = لو.
      ar: apa maksud...؟ = ما معنى...؟ أما mampu فيستطيع، وbila إذا.
      en: apa maksud...? means what does ... mean? mampu is able and bila is if.
    words: [maksud, mampu, bila]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا بحب كل الفاكهة، خصوصًا المانجا.
      ar: أحب كل الفواكه، خاصةً المانجو.
      en: I like all fruit, especially mangoes.
    answer: Saya suka semua buah, terutama mangga.
    distractors: [meski, pula]
    words: [terutama, meski, pula]
    explain:
      ar_eg: terutama mangga = خصوصًا المانجا. meski = رغم إن، وpula = برضه، ومالهمش مكان هنا.
      ar: terutama mangga = خاصةً المانجو. أما meski فرغم أنّ، وpula أيضًا، ولا مكان لهما هنا.
      en: terutama mangga means especially mangoes. meski is although and pula is too; they don't belong here.
  - id: e09
    type: translate
    direction: from_target
    source_text: Kakaknya pintar, adiknya pintar pula.
    answers_meaning:
      ar_eg: [أخوه الكبير شاطر، وأخوه الصغير شاطر برضه, الكبير ذكي والصغير ذكي كمان]
      ar: [أخوه الأكبر ذكي، وأخوه الأصغر ذكي أيضًا, الأكبر ذكي والأصغر ذكي كذلك]
      en: ['The older sibling is clever, and the younger one is clever too', The elder is smart and the younger is smart as well]
    words: [pula]
  - id: e10
    type: speaking
    text: Dia mampu mencapai gelar doktor di Swiss.
    meaning:
      ar_eg: قدر ياخد الدكتوراه في سويسرا.
      ar: استطاع أن يحصل على الدكتوراه في سويسرا.
      en: He was able to earn a doctorate in Switzerland.
    words: [mampu, mencapai, maksud]
dialogue:
  lines:
    - speaker: Ibu Meity
      text: Sam Ratulangi lahir di Tondano. Dia suka belajar, terutama matematika.
      ar_eg: سام راتولانجي اتولد في توندانو. كان بيحب يتعلم، خصوصًا الرياضيات.
      ar: وُلد سام راتولانغي في توندانو، وكان يحب التعلّم، خاصةً الرياضيات.
      en: Sam Ratulangi was born in Tondano. He loved learning, especially maths.
    - speaker: Mohamed
      text: Dia sekolah di mana, Bu?
      ar_eg: درس فين يا مدام؟
      ar: أين درس يا سيدتي؟
      en: Where did he study, ma'am?
    - speaker: Ibu Meity
      text: Di Jawa, lalu di Belanda serta Swiss. Meski jauh dari rumah, dia mampu mencapai gelar doktor.
      ar_eg: في جاوة، وبعدين في هولندا وكمان سويسرا. ورغم إنه بعيد عن بيته، قدر ياخد الدكتوراه.
      ar: في جاوة، ثم في هولندا وكذلك سويسرا. ورغم بعده عن بيته، استطاع أن يحصل على الدكتوراه.
      en: In Java, then in the Netherlands as well as Switzerland. Although far from home, he managed to earn a doctorate.
    - speaker: Mohamed
      text: Hebat! Lalu apa maksud kata-katanya yang terkenal itu?
      ar_eg: جامد! طب كلمته المشهورة دي معناها إيه؟
      ar: رائع! وما معنى كلماته المشهورة؟
      en: Amazing! So what do his famous words mean?
    - speaker: Ibu Meity
      text: Artinya, manusia harus menolong orang lain. Bila kamu mampu, tolonglah orang lain pula.
      ar_eg: معناها إن الإنسان لازم يساعد غيره. لو تقدر، ساعد الناس انت كمان.
      ar: معناها أن على الإنسان أن يساعد الآخرين. وإذا استطعت، فساعد الآخرين أنت أيضًا.
      en: It means people must help others. If you're able, help others too.
