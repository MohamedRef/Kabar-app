schema: kabar.lesson/v1
id: bipa7.u09.l05
language: id
title: Hari raya bersama
can_do:
  ar_eg: تعرف أعياد الأديان المختلفة في إندونيسيا وتهنّي جيرانك صح.
  ar: أن تعرف أعياد الأديان المختلفة في إندونيسيا وتهنّئ جيرانك كما ينبغي.
  en: Know Indonesia's holidays across faiths and greet your neighbours properly.
slides:
  - title: Kalender yang penuh warna
    body:
      ar_eg: |
        إندونيسيا بتعترف بست أديان، وفيه hari libur nasional (إجازة رسمية) لأعياد كتير:
        - Idulfitri وIduladha (المسلمين)، Natal (الكريسماس)
        - Nyepi = رأس السنة الهندوسية في بالي: «يوم الصمت»، الجزيرة كلها بتسكت والمطار بيقفل يوم كامل.
        - Waisak = عيد البوذيين، فيه موكب مشهور في معبد بوروبودور.
        - Imlek = رأس السنة الصينية، بقى إجازة رسمية من ٢٠٠٣.
        mengucapkan selamat (تهنّي) كده:
        Selamat Hari Raya Nyepi! · Selamat Hari Waisak! · Selamat Tahun Baru Imlek!
        - في الكلام: terus = lalu.
        - kok = استغراب (إزاي؟ ليه كده؟). كلمات صغيرة بتدّي الجملة إحساس، ومن غيرها الجملة صح برضه.
      ar: |
        تعترف إندونيسيا بستّة أديان، ولأعياد كثيرة hari libur nasional (عطلة رسمية):
        - عيدا الفطر والأضحى (Idulfitri وIduladha)، وNatal (الميلاد)
        - Nyepi = رأس السنة الهندوسية في بالي، «يوم الصمت»، تسكن فيه الجزيرة كلّها ويُغلق المطار يومًا كاملًا.
        - Waisak = عيد البوذيين، وفيه موكب شهير في معبد بوروبودور.
        - Imlek = رأس السنة الصينية، وصار عطلة رسمية منذ ٢٠٠٣.
        ولـ mengucapkan selamat (التهنئة) قل:
        Selamat Hari Raya Nyepi! · Selamat Hari Waisak! · Selamat Tahun Baru Imlek!
        - في الكلام اليومي: terus = lalu.
        - kok = تعجّب (كيف؟ لماذا هكذا؟). أدوات صغيرة تلوّن الجملة، والجملة صحيحة بدونها.
      en: |
        Indonesia recognises six religions, and many holidays are a hari libur nasional (national holiday):
        - Idulfitri and Iduladha (Muslim), Natal (Christmas)
        - Nyepi = the Hindu New Year in Bali, the "Day of Silence": the whole island goes quiet and the airport closes for a full day.
        - Waisak = the Buddhist holy day, with a famous procession at Borobudur.
        - Imlek = Chinese New Year, a national holiday since 2003.
        To mengucapkan selamat (offer greetings):
        Selamat Hari Raya Nyepi! · Selamat Hari Waisak! · Selamat Tahun Baru Imlek!
        - In speech: terus = lalu.
        - kok = surprise (how come?). Small particles that add feeling; the sentence is correct without them.
    examples:
      - text: Saat Nyepi, Bandara Ngurah Rai di Bali tutup selama dua puluh empat jam.
        ar_eg: في الـ Nyepi، مطار نجوراه راي في بالي بيقفل ٢٤ ساعة.
        ar: في يوم Nyepi يُغلق مطار نغوراه راي في بالي أربعًا وعشرين ساعة.
        en: During Nyepi, Bali's Ngurah Rai Airport closes for twenty-four hours.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: hari libur nasional
        ar_eg: إجازة رسمية
        ar: عطلة رسمية
        en: national holiday
      - text: Nyepi
        ar_eg: يوم الصمت (بالي)
        ar: يوم الصمت (بالي)
        en: Day of Silence (Bali)
      - text: Waisak
        ar_eg: عيد البوذيين
        ar: عيد فيساك البوذيّ
        en: Vesak
      - text: Imlek
        ar_eg: رأس السنة الصينية
        ar: رأس السنة الصينية
        en: Chinese New Year
      - text: mengucapkan selamat
        ar_eg: يهنّي
        ar: يهنّئ
        en: to offer greetings
    words: [hari libur nasional, Nyepi, Waisak, Imlek, mengucapkan selamat]
  - id: e02
    type: listen
    text: Pada hari Nyepi, tidak ada yang boleh menyalakan lampu atau bepergian.
    question:
      ar_eg: إيه اللي بيحصل في يوم الـ Nyepi؟
      ar: ماذا يحدث في يوم Nyepi؟
      en: What happens on Nyepi?
    options:
      - الناس بتعمل حفلات في الشارع.
      - ممنوع حد يولّع نور أو يسافر.
      - المحلّات بتعمل تخفيضات.
    answer: 1
    words: [Nyepi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: عيد الـ Waisak بتاع مين؟
      ar: لمن عيد Waisak؟
      en: Whose holy day is Waisak?
    options:
      - الهندوس.
      - المسيحيين.
      - البوذيين.
    answer: 2
    words: [Waisak]
    explain:
      ar_eg: Waisak عيد البوذيين، ذكرى ميلاد بوذا واستنارته. نيبي للهندوس.
      ar: Waisak عيد البوذيين. Nyepi للهندوس.
      en: Waisak is the Buddhist holy day.
  - id: e04
    type: fill_blank
    sentence: Tetangga saya orang Tionghoa. Saya ___ Tahun Baru Imlek kepadanya.
    meaning:
      ar_eg: جاري صيني الأصل. هنّيته برأس السنة الصينية.
      ar: جاري من أصل صينيّ، فهنّأته برأس السنة الصينية.
      en: My neighbour is Chinese-Indonesian. I wished him a happy Chinese New Year.
    options: [mengucapkan selamat, bersumpah, memindai]
    answers: [mengucapkan selamat]
    words: [mengucapkan selamat, Imlek]
    explain:
      ar_eg: mengucapkan selamat = يهنّي، وده اللي بتعمله لجارك في Imlek. bersumpah = حلف وmemindai = عمل سكان.
      ar: mengucapkan selamat = يهنّئ بالعيد. bersumpah أقسم وmemindai مسح.
      en: You mengucapkan selamat (wish someone happy) for Imlek.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الـ Imlek بقى إجازة رسمية من سنة كام؟
      ar: منذ أيّ سنة صار Imlek عطلة رسمية؟
      en: Since which year has Imlek been a national holiday?
    options: ['2003', '1945', '2020']
    answer: 0
    words: [Imlek, hari libur nasional]
    explain:
      ar_eg: Imlek بقى إجازة رسمية من 2003، بعد ما كان ممنوع أيام النظام الجديد.
      ar: صار Imlek عطلة رسمية منذ 2003.
      en: Imlek became a national holiday in 2003.
  - id: e06
    type: build_sentence
    source:
      ar_eg: بكرة إجازة رسمية.
      ar: غدًا عطلة رسمية.
      en: Tomorrow is a national holiday.
    answer: Besok hari libur nasional.
    distractors: [Nyepi, selamat]
    words: [hari libur nasional]
    explain:
      ar_eg: Besok (بكرة) + hari libur nasional (إجازة رسمية). Nyepi وselamat زيادة.
      ar: Besok hari libur nasional. Nyepi وselamat زائدتان.
      en: Besok + hari libur nasional. Nyepi and selamat are extra.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كل سنة العيلة بتاعتي بتهنّي جيرانها الهندوس بالـ Nyepi.
      ar: تهنّئ أسرتي جيرانها الهندوس بيوم Nyepi كلّ عام.
      en: Every year my family greets our Hindu neighbours on Nyepi.
    answers:
      - Setiap tahun keluarga saya mengucapkan selamat Hari Raya Nyepi kepada tetangga Hindu.
      - Setiap tahun keluarga saya mengucapkan selamat Nyepi kepada tetangga yang beragama Hindu.
      - Tiap tahun keluarga saya mengucapkan selamat Nyepi kepada tetangga Hindu kami.
      - Setiap tahun, keluarga saya mengucapkan selamat Hari Raya Nyepi kepada tetangga kami yang Hindu.
    words: [mengucapkan selamat, Nyepi]
  - id: e08
    type: speaking
    text: Selamat Hari Waisak! Semoga damai selalu.
    meaning:
      ar_eg: عيد فيساك سعيد! ربنا يديم السلام.
      ar: عيد فيساك سعيد! دام السلام.
      en: Happy Vesak! May peace always be with you.
    words: [Waisak, mengucapkan selamat]
  - id: e09
    type: dictation
    text: Indonesia punya banyak hari libur nasional dari berbagai agama.
    meaning:
      ar_eg: إندونيسيا عندها إجازات رسمية كتير من أديان مختلفة.
      ar: لإندونيسيا عطلات رسمية كثيرة من أديان شتّى.
      en: Indonesia has many national holidays from different religions.
    words: [hari libur nasional]
  - id: e10
    type: speaking
    text: Waktu Imlek, kota Singkawang penuh lampion merah.
    meaning:
      ar_eg: في الـ Imlek، مدينة سينكاوانج بتتملي فوانيس حمرا.
      ar: في Imlek تمتلئ مدينة سينكاوانغ بالفوانيس الحمراء.
      en: At Imlek, the town of Singkawang fills with red lanterns.
    words: [Imlek]
dialogue:
  title: Kalender di dapur
  lines:
    - speaker: Mohamed
      text: Kak Yosua, kok banyak tanggal merah di kalender ini?
      ar_eg: يا كاك يوسوا، ليه فيه تواريخ حمرا كتير في النتيجة دي؟
      ar: يا كاك يوسوا، لماذا في هذا التقويم تواريخ حمراء كثيرة؟
      en: Kak Yosua, why are there so many red dates on this calendar?
    - speaker: Kak Yosua
      text: Itu hari libur nasional. Ada Idulfitri, Natal, Nyepi, Waisak, dan Imlek.
      ar_eg: دي إجازات رسمية. فيه عيد الفطر، والكريسماس، والـ Nyepi، والـ Waisak، والـ Imlek.
      ar: 'تلك عطلات رسمية: عيد الفطر والميلاد وNyepi وWaisak وImlek.'
      en: Those are national holidays. Idulfitri, Christmas, Nyepi, Waisak and Imlek.
    - speaker: Mohamed
      text: Di Mesir, kami juga mengucapkan selamat Natal ke tetangga Kristen.
      ar_eg: في مصر كمان بنهنّي جيرانّا المسيحيين بالكريسماس.
      ar: ونحن في مصر نهنّئ جيراننا المسيحيين بعيد الميلاد أيضًا.
      en: In Egypt we also wish our Christian neighbours a merry Christmas.
    - speaker: Kak Yosua
      text: Sama! Terus waktu Idulfitri, aku yang datang ke rumah Pak Daeng.
      ar_eg: زينا! وفي عيد الفطر، أنا اللي بروح بيت عمّو داينج.
      ar: مثلنا! وفي عيد الفطر أكون أنا من يزور بيت السيّد داينغ.
      en: Same here! And at Idulfitri, I'm the one visiting Pak Daeng's house.
