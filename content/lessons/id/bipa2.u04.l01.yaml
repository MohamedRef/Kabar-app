schema: kabar.lesson/v1
id: bipa2.u04.l01
language: id
title: Seekor, sebuah, selembar
can_do:
  ar_eg: تعد الحيوانات والحاجات والورق بالمصنِّفات.
  ar: أن تعدّ الحيوانات والأشياء والأوراق بالمصنِّفات.
  en: Count animals, things and sheets with classifiers.
slides:
  - title: Dua orang, tiga ekor
    body:
      ar_eg: |
        زي ما بنقول «رغيف عيش» و«حبة طماطم»، الإندونيسي بيحط كلمة بين الرقم والاسم حسب نوع الحاجة:
        رقم + كلمة العدّ + اسم
        - orang للناس: dua orang mahasiswa = طالبين
        - ekor (ديل) للحيوانات: tiga ekor ayam = تلات فراخ
        وse- = واحد: seorang guru = مدرس واحد، seekor kucing = قطة.
      ar: |
        كما نقول «رغيف خبز» و«حبة طماطم»، تضع الإندونيسية لفظًا بين العدد والمعدود بحسب نوعه:
        العدد + لفظ العدّ + الاسم
        - orang للبشر: dua orang mahasiswa
        - ekor (ذيل) للحيوان: tiga ekor ayam
        وse- = واحد: seorang guru، seekor kucing.
      en: |
        Like Egyptian «رغيف عيش» or «حبة طماطم», Indonesian puts a counter between number and noun:
        number + classifier + noun
        - orang for people: dua orang mahasiswa = two students
        - ekor ("tail") for animals: tiga ekor ayam = three chickens
        se- = one: seorang guru = a teacher, seekor kucing = a cat.
    grammar: id.classifier.basic
    examples:
      - text: Pak Irwan punya seekor kucing.
        ar_eg: الأستاذ إروان عنده قطة.
        ar: يملك السيد إروان قطة.
        en: Mr Irwan has a cat.
      - text: Di kelas ada dua puluh orang mahasiswa.
        ar_eg: فيه عشرين طالب في الفصل.
        ar: في الصف عشرون طالبًا.
        en: There are twenty students in the class.
  - title: Buah, lembar, potong, biji
    body:
      ar_eg: |
        - buah (أصلها «فاكهة») لمعظم الحاجات: sebuah tas = شنطة، dua buah patung = تمثالين
        - lembar للورق والقماش: selembar kain = حتة قماش، dua lembar kertas = ورقتين
        - potong للحتت: sepotong kue = حتة كيك
        - biji للحبوب والحاجات الصغيرة: dua biji telur = بيضتين (وللبيض كمان butir)
      ar: |
        - buah (أصلها «ثمرة») لأكثر الأشياء: sebuah tas، dua buah patung
        - lembar للورق والقماش: selembar kain، dua lembar kertas
        - potong للقطع: sepotong kue
        - biji للحبوب والأشياء الصغيرة: dua biji telur (وللبيض أيضًا butir)
      en: |
        - buah ("fruit") for most things: sebuah tas = a bag, dua buah patung = two statues
        - lembar for sheets: selembar kain = a piece of cloth, dua lembar kertas = two sheets of paper
        - potong for pieces: sepotong kue = a piece of cake
        - biji for grains and small items: dua biji telur = two eggs (eggs also take butir)
    grammar: id.classifier.basic
    examples:
      - text: Saya beli sebuah patung kayu.
        ar_eg: اشتريت تمثال خشب.
        ar: اشتريت تمثالًا خشبيًا.
        en: I bought a wooden statue.
      - text: Ni Luh minta selembar kain batik.
        ar_eg: ني لوه طلبت حتة قماش باتيك.
        ar: طلبت ني لوه قطعة قماش باتيك.
        en: Ni Luh asked for a piece of batik cloth.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: seekor kucing
        ar_eg: قطة
        ar: قطة
        en: a cat
      - text: seorang guru
        ar_eg: مدرس
        ar: معلم
        en: a teacher
      - text: sepotong kue
        ar_eg: حتة كيك
        ar: قطعة كعك
        en: a piece of cake
      - text: segelas teh
        ar_eg: كوباية شاي
        ar: كوب شاي
        en: a glass of tea
      - text: sekilo jeruk
        ar_eg: كيلو برتقال
        ar: كيلو برتقال
        en: a kilo of oranges
    words: [ekor, orang, potong, gelas, seorang]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «تلات فراخ» إزاي؟
      ar: كيف تقول «ثلاث دجاجات»؟
      en: How do you say "three chickens"?
    options: [tiga lembar ayam, tiga orang ayam, tiga ekor ayam]
    answer: 2
    explain:
      ar_eg: الحيوانات بـ ekor. orang للبشر بس.
      ar: الحيوان يُعدّ بـ ekor، وorang للبشر وحدهم.
      en: Animals take ekor; orang is only for people.
    words: [ekor]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «ورقتين» إزاي؟
      ar: كيف تقول «ورقتان»؟
      en: How do you say "two sheets of paper"?
    options: [dua potong kertas, dua ekor kertas, dua lembar kertas]
    answer: 2
    explain:
      ar_eg: الورق بـ lembar. وعلى فكرة kertas جاية من العربي «قرطاس».
      ar: الورق يُعدّ بـ lembar، وkertas مأخوذة من العربية «قرطاس».
      en: Paper takes lembar. By the way, kertas comes from Arabic «قرطاس».
    words: [lembar, kertas]
  - id: e04
    type: fill_blank
    sentence: Pak Irwan punya se___ kucing.
    meaning:
      ar_eg: الأستاذ إروان عنده قطة.
      ar: يملك السيد إروان قطة.
      en: Mr Irwan has a cat.
    options: [orang, ekor, buah]
    answers: [ekor]
    words: [ekor]
  - id: e05
    type: fill_blank
    sentence: Saya beli dua ___ kertas.
    meaning:
      ar_eg: (اختار كلمة العدّ) اشتريت ورقتين.
      ar: (اختر لفظ العدّ) اشتريت ورقتين.
      en: (Pick the classifier.) I bought two sheets of paper.
    options: [lembar, ekor, buah]
    answers: [lembar]
    words: [lembar, kertas]
  - id: e06
    type: build_sentence
    source:
      ar_eg: اشتريت تمثال خشب.
      ar: اشتريت تمثالًا خشبيًا.
      en: I bought a wooden statue.
    answer: Saya beli sebuah patung kayu.
    distractors: [seekor, seorang]
    words: [buah, patung, kayu, sebuah]
  - id: e07
    type: listen
    text: Saya beli sebuah patung dan sepotong kue.
    options: ['Saya beli sebuah patung dan sepotong kue.', 'Saya beli seekor patung dan sepotong kue.', 'Saya beli sebuah patung dan selembar kertas.']
    answer: 0
    meaning:
      ar_eg: اشتريت تمثال وحتة كيكة.
      ar: اشتريت تمثالًا وقطعة كعك.
      en: I bought a statue and a slice of cake.
    words: [buah, patung, potong, kertas, lembar, sebuah]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «تمثالين»؟
      ar: كيف تقول «تمثالان»؟
      en: How do you say "two statues"?
    options: ['dua buah patung', 'dua ekor patung', 'dua lembar patung']
    answer: 0
    explain:
      ar_eg: buah لمعظم الحاجات، ekor للحيوانات، lembar للورق والقماش.
      ar: buah لأكثر الأشياء، وekor للحيوان، وlembar للورق والقماش.
      en: buah is for most things, ekor for animals, lembar for paper and cloth.
    words: [buah, patung, ekor, lembar]
  - id: e09
    type: speaking
    text: Ada seorang guru. Dia minta selembar kertas dan sepotong kue.
    meaning:
      ar_eg: فيه مدرّس. طلب ورقة وحتة كيكة.
      ar: هناك معلّم. طلب ورقة وقطعة كعك.
      en: There's a teacher. He asks for a sheet of paper and a slice of cake.
    words: [seorang, lembar, kertas, potong]
  - id: e10
    type: multiple_choice
    question: Dia ___ guru.
    question_meaning:
      ar_eg: «هو مدرّس.» أنهي كلمة تكمّلها؟
      ar: «هو معلّم.» أيّ كلمة تكملها؟
      en: '"He is a teacher." Which word completes it?'
    options: [seorang, sebuah, seekor]
    answer: 0
    explain:
      ar_eg: seorang للناس، sebuah للحاجات، seekor للحيوانات.
      ar: seorang للأشخاص، وsebuah للأشياء، وseekor للحيوانات.
      en: seorang for people, sebuah for things, seekor for animals.
    words: [seorang, sebuah]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, kamu beli apa di Ubud?
      ar_eg: محمد، اشتريت إيه من أوبود؟
      ar: محمد، ماذا اشتريت في أوبود؟
      en: Mohamed, what did you buy in Ubud?
    - speaker: Mohamed
      text: Saya beli sebuah patung dan dua lembar kain.
      ar_eg: اشتريت تمثال وقطعتين قماش.
      ar: اشتريت تمثالًا وقطعتين من القماش.
      en: I bought a carving and two pieces of cloth.
    - speaker: Ni Luh
      text: Patung apa? Patung kucing?
      ar_eg: تمثال إيه؟ تمثال قطة؟
      ar: أي تمثال؟ تمثال قطة؟
      en: What carving? A cat?
    - speaker: Mohamed
      text: Bukan, patung gajah! Untuk ibu saya.
      ar_eg: لأ، فيل! لأمي.
      ar: لا، فيل! لأمي.
      en: No, an elephant! For my mother.
