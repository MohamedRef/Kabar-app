schema: kabar.lesson/v1
id: bipa2.u04.l01
language: id
title: Sebuah, seekor, sepotong
can_do:
  ar_eg: تعدّ الحاجات بكلمات العدّ (حبة، رغيف، كيلو…).
  ar: أن تعدّ الأشياء باستعمال ألفاظ العدّ.
  en: Count with classifiers.
slides:
  - title: Dua orang, tiga ekor
    body:
      ar_eg: |
        زي ما بنقول «رغيف عيش» و«حبة طماطم»، الإندونيسي بيحط كلمة بين الرقم والاسم حسب نوع الحاجة:
        رقم + كلمة العدّ + اسم
        - orang للناس: dua orang mahasiswa = طالبين
        - ekor (ديل) للحيوانات: tiga ekor ayam = تلات فراخ
        وse- = واحد: seorang guru = مدرس واحد، seekor kucing = قطة.
      ar: |
        كما نقول «رغيف خبز» و«حبة طماطم»، تضع الإندونيسية لفظًا بين العدد والمعدود بحسب نوعه:
        العدد + لفظ العدّ + الاسم
        - orang للبشر: dua orang mahasiswa
        - ekor (ذيل) للحيوان: tiga ekor ayam
        وse- = واحد: seorang guru، seekor kucing.
      en: |
        Like Egyptian «رغيف عيش» or «حبة طماطم», Indonesian puts a counter between number and noun:
        number + classifier + noun
        - orang for people: dua orang mahasiswa = two students
        - ekor ("tail") for animals: tiga ekor ayam = three chickens
        se- = one: seorang guru = a teacher, seekor kucing = a cat.
    grammar: id.classifier.basic
    examples:
      - text: Pak Budi punya seekor kucing.
        ar_eg: الأستاذ بودي عنده قطة.
        ar: يملك السيد بودي قطة.
        en: Mr Budi has a cat.
      - text: Di kelas ada dua puluh orang mahasiswa.
        ar_eg: فيه عشرين طالب في الفصل.
        ar: في الصف عشرون طالبًا.
        en: There are twenty students in the class.
  - title: Buah, lembar, potong, biji
    body:
      ar_eg: |
        - buah (أصلها «فاكهة») لمعظم الحاجات: sebuah tas = شنطة، dua buah patung = تمثالين
        - lembar للورق والقماش: selembar kain = حتة قماش، dua lembar kertas = ورقتين
        - potong للحتت: sepotong kue = حتة كيك
        - biji للحبوب والحاجات الصغيرة: dua biji telur = بيضتين
      ar: |
        - buah (أصلها «ثمرة») لأكثر الأشياء: sebuah tas، dua buah patung
        - lembar للورق والقماش: selembar kain، dua lembar kertas
        - potong للقطع: sepotong kue
        - biji للحبوب والأشياء الصغيرة: dua biji telur
      en: |
        - buah ("fruit") for most things: sebuah tas = a bag, dua buah patung = two statues
        - lembar for sheets: selembar kain = a piece of cloth, dua lembar kertas = two sheets of paper
        - potong for pieces: sepotong kue = a piece of cake
        - biji for grains and small items: dua biji telur = two eggs
    grammar: id.classifier.basic
    examples:
      - text: Saya beli sebuah patung kayu.
        ar_eg: اشتريت تمثال خشب.
        ar: اشتريت تمثالًا خشبيًا.
        en: I bought a wooden statue.
      - text: Ni Luh minta selembar kain batik.
        ar_eg: ني لوه طلبت حتة قماش باتيك.
        ar: طلبت ني لوه قطعة قماش باتيك.
        en: Ni Luh asked for a piece of batik cloth.
  - title: Segelas, sebotol, sekilo
    body:
      ar_eg: |
        الأوعية والمقاييس بتشتغل بنفس الطريقة:
        segelas teh = كوباية شاي، sepiring nasi = طبق رز، sebotol air = إزازة مية،
        sebungkus nasi = لفّة رز (تيك أواي)، seikat sayur = حزمة خضار، sekilo jeruk = كيلو برتقال.
      ar: |
        والأوعية والمقاييس تعمل بالطريقة نفسها:
        segelas teh = كوب شاي، sepiring nasi = طبق أرز، sebotol air = زجاجة ماء،
        sebungkus nasi = لفافة أرز، seikat sayur = حزمة خضار، sekilo jeruk = كيلو برتقال.
      en: |
        Containers and measures work the same way:
        segelas teh = a glass of tea, sepiring nasi = a plate of rice, sebotol air = a bottle of water,
        sebungkus nasi = a wrapped pack of rice, seikat sayur = a bunch of vegetables, sekilo jeruk = a kilo of oranges.
    grammar: id.classifier.basic
    examples:
      - text: Saya beli dua ikat sayur dan sekilo jeruk.
        ar_eg: اشتريت حزمتين خضار وكيلو برتقال.
        ar: اشتريت حزمتين من الخضار وكيلو برتقال.
        en: I bought two bunches of vegetables and a kilo of oranges.
      - text: Minta segelas teh manis, Mbak.
        ar_eg: كوباية شاي بسكر لو سمحتي.
        ar: كوب شاي محلّى من فضلكِ.
        en: A glass of sweet tea, please.
  - title: Berapa ekor? Berapa kilo?
    body:
      ar_eg: |
        في السؤال حط كلمة العدّ بعد berapa: Berapa ekor? (كام واحدة؟ للحيوانات)، Berapa kilo? (كام كيلو؟).
        في الكلام العادي ساعات بيشيلوها: dua kopi = اتنين قهوة. بس في السوق هتسمعها كتير.
        خلي بالك: orang للبشر بس! dua ekor kucing، مش dua orang kucing.
      ar: |
        في السؤال يأتي لفظ العدّ بعد berapa: Berapa ekor؟ Berapa kilo؟
        وفي العامية قد يُحذف: dua kopi، لكنك ستسمعه كثيرًا في السوق.
        وانتبه: orang للبشر وحدهم، فنقول dua ekor kucing لا dua orang kucing.
      en: |
        In questions the classifier follows berapa: Berapa ekor? (how many — animals), Berapa kilo? (how many kilos?).
        Casual speech often drops it (dua kopi), but at the market you'll hear it all the time.
        Careful: orang is only for people — dua ekor kucing, not dua orang kucing.
    grammar: id.classifier.basic
    examples:
      - text: Jeruknya mau berapa kilo, Pak?
        ar_eg: عايز كام كيلو برتقال يا أستاذ؟
        ar: كم كيلو من البرتقال تريد يا سيدي؟
        en: How many kilos of oranges, sir?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: seekor kucing
        ar_eg: قطة
        ar: قطة
        en: a cat
      - text: seorang guru
        ar_eg: مدرس
        ar: معلم
        en: a teacher
      - text: sepotong kue
        ar_eg: حتة كيك
        ar: قطعة كعك
        en: a piece of cake
      - text: segelas teh
        ar_eg: كوباية شاي
        ar: كوب شاي
        en: a glass of tea
      - text: sekilo jeruk
        ar_eg: كيلو برتقال
        ar: كيلو برتقال
        en: a kilo of oranges
    words: [ekor, orang, potong, gelas, kilo]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «تلات فراخ» إزاي؟
      ar: كيف تقول «ثلاث دجاجات»؟
      en: How do you say "three chickens"?
    options: ["tiga lembar ayam", "tiga orang ayam", "tiga ekor ayam"]
    answer: 2
    explain:
      ar_eg: الحيوانات بـ ekor. orang للبشر بس.
      ar: الحيوان يُعدّ بـ ekor، وorang للبشر وحدهم.
      en: Animals take ekor; orang is only for people.
    words: [ekor]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «ورقتين» إزاي؟
      ar: كيف تقول «ورقتان»؟
      en: How do you say "two sheets of paper"?
    options: ["dua potong kertas", "dua ekor kertas", "dua lembar kertas"]
    answer: 2
    explain:
      ar_eg: الورق بـ lembar. وعلى فكرة kertas جاية من العربي «قرطاس».
      ar: الورق يُعدّ بـ lembar، وkertas مأخوذة من العربية «قرطاس».
      en: Paper takes lembar. By the way, kertas comes from Arabic «قرطاس».
    words: [lembar, kertas]
  - id: e04
    type: listen
    text: Saya beli dua ikat sayur.
    options: ["Saya beli dua biji sayur.", "Saya beli dua kilo sayur.", "Saya beli dua ikat sayur."]
    answer: 2
    words: [ikat, sayur]
  - id: e05
    type: fill_blank
    sentence: Pak Budi punya se___ kucing.
    meaning:
      ar_eg: الأستاذ بودي عنده قطة.
      ar: يملك السيد بودي قطة.
      en: Mr Budi has a cat.
    options: ["orang", "ekor", "buah"]
    answers: [ekor]
    words: [ekor]
  - id: e06
    type: fill_blank
    sentence: Minta se___ air, Mbak.
    meaning:
      ar_eg: إزازة مية لو سمحتي.
      ar: زجاجة ماء من فضلكِ.
      en: A bottle of water, please.
    options: ["botol", "ekor", "lembar"]
    answers: [botol]
    words: [botol]
  - id: e07
    type: fill_blank
    sentence: Di kelas ada sepuluh ___ mahasiswa.
    meaning:
      ar_eg: (اكتب كلمة العدّ) فيه عشرة طلبة في الفصل.
      ar: (اكتب لفظ العدّ) في الصف عشرة طلاب.
      en: (Type the classifier.) There are ten students in the class.
    answers: [orang]
    words: [orang]
  - id: e08
    type: build_sentence
    source:
      ar_eg: اشتريت تمثال خشب.
      ar: اشتريت تمثالًا خشبيًا.
      en: I bought a wooden statue.
    answer: Saya beli sebuah patung kayu.
    distractors: [seekor, seorang]
    words: [sebuah, patung, kayu]
  - id: e09
    type: build_sentence
    source:
      ar_eg: كوباية شاي بسكر لو سمحتي.
      ar: كوب شاي محلّى من فضلكِ.
      en: A glass of sweet tea, please.
    answer: Minta segelas teh manis, Mbak.
    distractors: [sepiring, sebotol]
    words: [gelas, teh]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عايز كيلو برتقال وحتة كيك.
      ar: أريد كيلو برتقال وقطعة كعك.
      en: I'd like a kilo of oranges and a piece of cake.
    answers:
      - Saya mau sekilo jeruk dan sepotong kue.
      - Saya mau sekilo jeruk dan sepotong kue
      - Saya mau satu kilo jeruk dan sepotong kue.
      - Saya minta sekilo jeruk dan sepotong kue.
      - Saya ingin sekilo jeruk dan sepotong kue.
      - Aku mau sekilo jeruk dan sepotong kue.
    words: [kilo, potong]
  - id: e11
    type: translate
    direction: from_target
    source_text: Ibu itu membeli dua biji kelapa dan selembar kain.
    answers_meaning:
      ar_eg: ["الست دي اشترت جوزتين هند وحتة قماش", "الست دي بتشتري جوزتين هند وحتة قماش"]
      ar: ["اشترت تلك السيدة جوزتي هند وقطعة قماش", "تلك السيدة تشتري جوزتي هند وقطعة قماش"]
      en: ["That woman bought two coconuts and a piece of cloth.", "That lady buys two coconuts and a piece of cloth."]
    explain:
      ar_eg: biji للحاجات المدورة الصغيرة/الحبوب، وlembar للقماش.
      ar: biji للحبوب والأشياء المستديرة، وlembar للقماش.
      en: biji for round items and grains; lembar for cloth.
    words: [biji, lembar, kain]
  - id: e12
    type: dictation
    text: Saya beli sebungkus nasi dan sebotol air.
    meaning:
      ar_eg: اشتريت لفّة رز وإزازة مية.
      ar: اشتريت لفافة أرز وزجاجة ماء.
      en: I bought a pack of rice and a bottle of water.
    words: [bungkus, botol]
  - id: e13
    type: speaking
    text: Jeruknya dua kilo, dan sayurnya tiga ikat, Bu.
    meaning:
      ar_eg: البرتقال كيلوين، والخضار تلات حزم يا ست.
      ar: البرتقال كيلوان، والخضار ثلاث حزم يا سيدتي.
      en: Two kilos of oranges and three bunches of vegetables, ma'am.
    words: [kilo, ikat]
dialogue:
  title: Belanja pagi di Sukawati
  lines:
    - speaker: Bu Ketut
      text: Selamat pagi! Mau beli apa?
      ar_eg: صباح الخير! عايز تشتري إيه؟
      ar: صباح الخير! ماذا تريد أن تشتري؟
      en: Good morning! What would you like?
    - speaker: Mohamed
      text: Saya mau sekilo jeruk dan dua ikat sayur, Bu.
      ar_eg: عايز كيلو برتقال وحزمتين خضار يا ست.
      ar: أريد كيلو برتقال وحزمتين من الخضار يا سيدتي.
      en: I'd like a kilo of oranges and two bunches of vegetables, ma'am.
    - speaker: Bu Ketut
      text: Ini. Kelapanya juga mau? Satu biji sepuluh ribu.
      ar_eg: اتفضل. عايز جوز هند كمان؟ الواحدة بعشرة آلاف.
      ar: تفضل. هل تريد جوز الهند أيضًا؟ الواحدة بعشرة آلاف.
      en: Here you go. Want a coconut too? Ten thousand each.
    - speaker: Mohamed
      text: Boleh, dua biji. Dan sebotol air, ya.
      ar_eg: ماشي، اتنين. وإزازة مية كمان.
      ar: حسنًا، اثنتان. وزجاجة ماء أيضًا.
      en: Sure, two. And a bottle of water, please.
    - speaker: Bu Ketut
      text: Semuanya lima puluh ribu. Terima kasih!
      ar_eg: الكل خمسين ألف. شكرًا!
      ar: المجموع خمسون ألفًا. شكرًا!
      en: Altogether fifty thousand. Thank you!
