    pos: noun
    ar_eg: السبت
    ar: السبت
    en: Saturday
    arabic: السبت
  - word: Minggu
    pos: noun
    ar_eg: الحد
    ar: الأحد
    en: Sunday
  - word: Ahad
    pos: noun
    ar_eg: الحد (أقل استعمالًا)
    ar: الأحد (أقل شيوعًا)
    en: Sunday (less common)
    arabic: الأحد
  - word: minggu
    pos: noun
    ar_eg: أسبوع
    ar: أسبوع
    en: week
  - word: ulang tahun
    pos: noun
    ar_eg: عيد ميلاد
    ar: عيد ميلاد
    en: birthday
  - word: pertama
    pos: number
    ar_eg: الأول
    ar: الأول
    en: first
  - word: ke-
    pos: particle
    ar_eg: بادئة الترتيب (kedua = التاني)
    ar: سابقة العدد الترتيبي (kedua = الثاني)
    en: ordinal prefix (kedua = second)
