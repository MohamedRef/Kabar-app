schema: kabar.lesson/v1
id: bipa1.u04.l08
language: id
title: Hari pertama
can_do:
  ar_eg: تتكلم عن الويك إند وأعياد الميلاد وأول وتاني وتالت.
  ar: أن تتحدث عن عطلة الأسبوع وأعياد الميلاد والأول والثاني والثالث.
  en: Talk about the weekend, birthdays, and first, second, third.
slides:
  - title: Pertama, kedua, ketiga
    body:
      ar_eg: |
        الترتيب = ke- + الرقم: kedua = التاني، ketiga = التالت، kesepuluh = العاشر.
        بس «الأول» ليه كلمة لوحده: pertama.
        وبيجي بعد الاسم زي العربي: hari pertama = اليوم الأول، anak kedua = الابن التاني.
        خلي بالك: لو جه قبل الاسم معناه «الاتنين / التلاتة»: kedua anak itu = العيلين دول الاتنين.
      ar: |
        العدد الترتيبي = ke- + العدد: kedua = الثاني، ketiga = الثالث، kesepuluh = العاشر.
        أما «الأول» فله كلمة خاصة: pertama.
        ويأتي بعد الاسم كالعربية: hari pertama = اليوم الأول، anak kedua = الابن الثاني.
        وانتبه: إذا سبق الاسم صار بمعنى «كلا / الثلاثة»: kedua anak itu = كلا الطفلين.
      en: |
        Ordinals = ke- + number: kedua = second, ketiga = third, kesepuluh = tenth.
        "First" has its own word: pertama.
        They follow the noun, as in Arabic: hari pertama = the first day, anak kedua = the second child.
        Careful: before a noun it means "both / all three": kedua anak itu = both children.
    grammar: id.number.ordinal
    examples:
      - text: Ini hari pertama saya di Jakarta.
        ar_eg: ده أول يوم ليا في جاكرتا.
        ar: هذا يومي الأول في جاكرتا.
        en: This is my first day in Jakarta.
      - text: Saya anak kedua.
        ar_eg: أنا الابن التاني.
        ar: أنا الابن الثاني.
        en: I'm the second child.
  - title: Selamat ulang tahun!
    body:
      ar_eg: |
        ulang tahun = عيد الميلاد (حرفيًا «السنة بتتكرر»). و«Selamat ulang tahun!» = «كل سنة وإنت طيب!» — نفس selamat بتاعة أول درس.
        والسؤال: «Kapan ulang tahunmu?» = «عيد ميلادك إمتى؟»
      ar: |
        ulang tahun = عيد الميلاد (حرفيًا «تكرار السنة»). و«Selamat ulang tahun!» = «عيد ميلاد سعيد!» بكلمة selamat نفسها من الدرس الأول.
        والسؤال: «Kapan ulang tahunmu?» = «متى عيد ميلادك؟»
      en: |
        ulang tahun = birthday (literally "the year repeats"). "Selamat ulang tahun!" = "Happy birthday!" — the same selamat from lesson one.
        Ask: "Kapan ulang tahunmu?" = "When is your birthday?"
    grammar: id.time.calendar
    examples:
      - text: Selamat ulang tahun, Rina!
        ar_eg: كل سنة وإنتي طيبة يا رينا!
        ar: عيد ميلاد سعيد يا رينا!
        en: Happy birthday, Rina!
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: يوم السبت اسمه إيه بالإندونيسي؟
      ar: ما اسم يوم السبت بالإندونيسية؟
      en: What is Saturday in Indonesian?
    options: [Ahad, Sabtu, Minggu]
    answer: 1
    explain:
      ar_eg: Sabtu ← السبت. وMinggu وAhad الاتنين يعني الحد.
      ar: Sabtu ← السبت، وMinggu وAhad كلاهما الأحد.
      en: Sabtu ← «السبت»; Minggu and Ahad both mean Sunday.
    words: [Sabtu, Minggu, Ahad]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «اليوم الأول»؟
      ar: كيف تقول «اليوم الأول»؟
      en: How do you say "the first day"?
    options: [hari pertama, hari kedua, pertama hari]
    answer: 0
    explain:
      ar_eg: الترتيب بعد الاسم، و«الأول» = pertama.
      ar: العدد الترتيبي بعد الاسم، و«الأول» = pertama.
      en: The ordinal follows the noun, and "first" = pertama.
    words: [hari, pertama, ke-]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «الابن التاني»؟
      ar: كيف تقول «الابن الثاني»؟
      en: How do you say "the second child"?
    options: [dua anak, anak kedua, kedua anak]
    answer: 1
    explain:
      ar_eg: kedua بعد الاسم = التاني. قبل الاسم = الاتنين (كلاهما). وdua anak = عيلين.
      ar: kedua بعد الاسم = الثاني، وقبله = كلاهما، وdua anak = طفلان.
      en: kedua after the noun = second; before it = both; dua anak = two children.
    words: [kedua, ke-, anak]
  - id: e04
    type: fill_blank
    sentence: Selamat ___ tahun, Raka!
    meaning:
      ar_eg: كل سنة وإنت طيب يا راكا!
      ar: عيد ميلاد سعيد يا راكا!
      en: Happy birthday, Raka!
    answers: [ulang]
    words: [ulang tahun]
  - id: e05
    type: build_sentence
    source:
      ar_eg: ده أول يوم ليا في جاكرتا.
      ar: هذا يومي الأول في جاكرتا.
      en: This is my first day in Jakarta.
    answer: Ini hari pertama saya di Jakarta.
    distractors: [satu, Minggu]
    explain:
      ar_eg: «الأول» = pertama مش satu.
      ar: «الأول» = pertama لا satu.
      en: '"First" is pertama, not satu.'
    words: [hari, pertama]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لصاحبك) عيد ميلادك إمتى؟
      ar: (لصديقك) متى عيد ميلادك؟
      en: (to a friend) When is your birthday?
    answers: ['Kapan ulang tahunmu?', Kapan ulang tahunmu, 'Kapan ulang tahun kamu?', 'Ulang tahunmu kapan?', 'Ulang tahun kamu kapan?']
    words: [kapan, ulang tahun]
  - id: e07
    type: translate
    direction: from_target
    source_text: Toko itu tutup hari Minggu.
    answers_meaning:
      ar_eg: [المحل ده بيقفل يوم الحد., المحل ده قافل يوم الأحد]
      ar: [ذلك المتجر مغلق يوم الأحد., يغلق ذلك المتجر يوم الأحد]
      en: [That shop is closed on Sunday., That shop is closed on Sundays, That store closes on Sunday]
    words: [tutup, Minggu]
  - id: e08
    type: speaking
    text: Selamat ulang tahun, Rina!
    meaning:
      ar_eg: كل سنة وإنتي طيبة يا رينا!
      ar: عيد ميلاد سعيد يا رينا!
      en: Happy birthday, Rina!
    words: [ulang tahun]
  - id: e09
    type: match_pairs
    pairs:
      - text: Sabtu
        ar_eg: السبت
        ar: السبت
        en: Saturday
      - text: Ahad
        ar_eg: الحد (من العربي)
        ar: الأحد (من العربية)
        en: Sunday (from Arabic)
      - text: minggu
        ar_eg: أسبوع
        ar: أسبوع
        en: week
      - text: pertama
        ar_eg: أول
        ar: أول
        en: first
      - text: kedua
        ar_eg: تاني
        ar: ثانٍ
        en: second
      - text: ketiga
        ar_eg: تالت
        ar: ثالث
        en: third
    words: [Sabtu, Ahad, minggu, pertama, ke-]
  - id: e10
    type: fill_blank
    sentence: Toko itu tutup hari Sabtu dan hari ___.
    meaning:
      ar_eg: المحل ده بيقفل يوم السبت ويوم الحد.
      ar: ذلك المتجر يغلق يومي السبت والأحد.
      en: That shop is closed on Saturday and Sunday.
    options: [Ahad, pertama, kedua]
    answers: [Ahad]
    explain:
      ar_eg: Ahad (من العربي «الأحد») = Minggu، والاتنين بيتقالوا.
      ar: Ahad (من العربية «الأحد») = Minggu، وكلاهما مستعمل.
      en: Ahad (from Arabic) = Minggu; both are used.
    words: [Sabtu, Ahad, tutup]
dialogue:
  lines:
    - speaker: Raka
      text: Mohamed, ini minggu pertama kamu di Jakarta?
      ar_eg: محمد، دا أول أسبوع ليك في جاكرتا؟
      ar: محمد، هل هذا أسبوعك الأول في جاكرتا؟
      en: Mohamed, is this your first week in Jakarta?
    - speaker: Mohamed
      text: Ini minggu kedua, Raka.
      ar_eg: دا الأسبوع التاني يا راكا.
      ar: هذا الأسبوع الثاني يا راكا.
      en: This is the second week, Raka.
    - speaker: Raka
      text: Hari Sabtu ulang tahun saya!
      ar_eg: يوم السبت عيد ميلادي!
      ar: يوم السبت عيد ميلادي!
      en: Saturday is my birthday!
    - speaker: Mohamed
      text: Wah! Selamat ulang tahun, Raka!
      ar_eg: واو! كل سنة وإنت طيب يا راكا!
      ar: رائع! عيد ميلاد سعيد يا راكا!
      en: Wow! Happy birthday, Raka!
new_words:
