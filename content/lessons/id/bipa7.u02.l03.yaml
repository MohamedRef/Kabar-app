schema: kabar.lesson/v1
id: bipa7.u02.l03
language: id
title: Pemutihan karang
can_do:
  ar_eg: تشرح عملية فيها سبب ونتيجة خطوة بخطوة.
  ar: أن تشرح عملية سببية خطوةً خطوة.
  en: Explain a cause-and-effect process step by step.
slides:
  - title: Mengapa karang memutih?
    body:
      ar_eg: |
        اقرا (مكتوب للدرس):
        Karang hidup bersama alga kecil di dalam tubuhnya. Alga itu memberi karang makanan dan warna. Penyebab utama pemutihan adalah air laut yang terlalu panas akibat pemanasan global. Ketika suhu naik, karang mengeluarkan alganya, sehingga tubuhnya menjadi putih. Jika air cepat mendingin, karang dapat memulihkan diri. Namun, jika panas berlangsung lama, karang akan kelaparan dan mati.
        - alga = طحالب، pemutihan = ابيضاض، penyebab = سبب
        - pemanasan global = الاحتباس الحراري، memulihkan (diri) = يتعافى
        روابط العملية: ketika (لما)، sehingga (فـ / لدرجة إن)، jika (لو)، namun (لكن).
        - في الكلام: udah = sudah، aja = saja، balik = kembali.
      ar: |
        اقرأ (نصّ مكتوب للدرس):
        Karang hidup bersama alga kecil di dalam tubuhnya. Alga itu memberi karang makanan dan warna. Penyebab utama pemutihan adalah air laut yang terlalu panas akibat pemanasan global. Ketika suhu naik, karang mengeluarkan alganya, sehingga tubuhnya menjadi putih. Jika air cepat mendingin, karang dapat memulihkan diri. Namun, jika panas berlangsung lama, karang akan kelaparan dan mati.
        - alga = الطحالب، pemutihan = الابيضاض، penyebab = السبب
        - pemanasan global = الاحترار العالمي، memulihkan (diri) = يتعافى
        وروابط العملية: ketika (حين)، sehingga (فـ)، jika (إن)، namun (لكنّ).
        - في الكلام اليومي: udah = sudah، aja = saja، balik = kembali.
      en: |
        Read (written for the lesson):
        Karang hidup bersama alga kecil di dalam tubuhnya. Alga itu memberi karang makanan dan warna. Penyebab utama pemutihan adalah air laut yang terlalu panas akibat pemanasan global. Ketika suhu naik, karang mengeluarkan alganya, sehingga tubuhnya menjadi putih. Jika air cepat mendingin, karang dapat memulihkan diri. Namun, jika panas berlangsung lama, karang akan kelaparan dan mati.
        - alga = algae, pemutihan = bleaching, penyebab = cause
        - pemanasan global = global warming, memulihkan (diri) = to recover
        Process links: ketika (when), sehingga (so that), jika (if), namun (however).
        - In speech: udah = sudah, aja = saja, balik = kembali.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pemutihan
        ar_eg: ابيضاض
        ar: ابيضاض
        en: bleaching
      - text: alga
        ar_eg: طحالب
        ar: طحالب
        en: algae
      - text: pemanasan global
        ar_eg: الاحتباس الحراري
        ar: الاحترار العالمي
        en: global warming
      - text: memulihkan
        ar_eg: يعافي / يرجّع لحالته
        ar: يُعيد إلى العافية
        en: to restore, to recover
      - text: penyebab
        ar_eg: سبب
        ar: سبب
        en: cause
    words: [pemutihan, alga, pemanasan global, memulihkan, penyebab]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه السبب الرئيسي للابيضاض على حسب النص؟
      ar: ما السبب الرئيسي للابيضاض بحسب النصّ؟
      en: What is the main cause of bleaching according to the text?
    options:
      - Air laut terlalu panas karena pemanasan global.
      - Penyelam sering menyentuh karang.
      - Air laut menjadi lebih asin.
    answer: 0
    words: [penyebab, pemanasan global]
    explain:
      ar_eg: السبب الأساسي (penyebab utama) إن المية سخنة زيادة بسبب الاحتباس الحراري (pemanasan global). لمس الغطّاسين والملوحة مش السبب الأساسي في النص.
      ar: السبب الرئيس أنّ الماء شديد الحرارة بسبب الاحترار العالمي، وليس لمس الغوّاصين ولا الملوحة.
      en: The main cause is overheated water from global warming, not divers' touch or saltier water.
  - id: e03
    type: fill_blank
    sentence: Ketika suhu naik, karang mengeluarkan ___ dari tubuhnya.
    meaning:
      ar_eg: لما الحرارة تعلى، المرجان بيطرد الطحالب من جسمه.
      ar: حين ترتفع الحرارة يطرد المرجان الطحالب من جسده.
      en: When the temperature rises, coral expels the algae from its body.
    options: [alga, arus, penyebab]
    answers: [alga]
    words: [alga]
    explain:
      ar_eg: المرجان بيطرد الـ alga (الطحالب) لما الحرارة تعلى. arus تيار، وpenyebab سبب.
      ar: يطرد المرجان الطحالب (alga) حين ترتفع الحرارة. أما arus فتيار وpenyebab سبب.
      en: Coral expels its alga when it heats up. arus is a current, penyebab a cause.
  - id: e04
    type: listen
    text: Ketika air laut terlalu panas, karang mengeluarkan alganya dan menjadi putih. Karang itu belum mati. Jika air cepat mendingin, karang dapat memulihkan diri, tetapi jika panasnya lama, karang akan mati.
    question:
      ar_eg: إمتى المرجان يقدر يتعافى؟
      ar: متى يستطيع المرجان أن يتعافى؟
      en: When can coral recover?
    options:
      - Karang langsung mati begitu warnanya putih.
      - Karang bisa pulih kalau air cepat dingin lagi.
      - Karang pulih kalau air tetap panas lama.
    answer: 1
    words: [memulihkan]
    explain:
      ar_eg: belum mati = لسه ماماتش، وjika air cepat mendingin = لو المية بردت بسرعة يقدر يتعافى. لو السخونة طوّلت (lama) بيموت، فمش بيموت على طول ومش بيتعافى في السخونة.
      ar: belum mati = لم يمت بعد، وإن برد الماء سريعًا تعافى، أمّا إن طال الحرّ فيموت؛ فلا يموت فورًا ولا يتعافى مع استمرار الحرارة.
      en: belum mati = not dead yet; it recovers if water cools fast, dies if the heat lasts. So not instant death, no recovery in lasting heat.
  - id: e05
    type: build_sentence
    source:
      ar_eg: الاحتباس الحراري بيسخّن البحر.
      ar: يُسخّن الاحترارُ العالمي البحر.
      en: Global warming heats up the sea.
    answer: Pemanasan global membuat laut makin panas.
    distractors: [alga, pemutihan]
    words: [pemanasan global]
    explain:
      ar_eg: Pemanasan global = الاحتباس الحراري، وهو اللي بيسخّن البحر. alga وpemutihan نتايج مش السبب.
      ar: Pemanasan global = الاحتباس الحراري الذي يسخّن البحر. أما alga وpemutihan فليسا الفاعل هنا.
      en: Pemanasan global (global warming) heats the sea.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: المرجان بيبقى أبيض ليه؟
      ar: لماذا يصير المرجان أبيض؟
      en: Why does the coral turn white?
    options:
      - Karena warnanya tertutup pasir.
      - Karena karangnya sedang tumbuh.
      - Karena alga yang memberi warna keluar dari karang.
    answer: 2
    words: [pemutihan, alga]
    explain:
      ar_eg: المرجان بيبيض عشان الطحالب (alga) اللي بتديله لونه خرجت منه. مش رمل ولا عشان بيكبر.
      ar: يبيضّ المرجان لأنّ الطحالب التي تمنحه لونه خرجت منه، لا بسبب الرمل ولا النموّ.
      en: Coral turns white because the colour-giving algae leave it, not sand or growth.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الابيضاض ده ممكن يموّت المرجان.
      ar: قد يقتل هذا الابيضاضُ المرجان.
      en: This bleaching can kill the coral.
    answers:
      - Pemutihan ini dapat membunuh karang.
      - Pemutihan ini bisa membunuh karang.
      - Pemutihan itu dapat membunuh karang.
      - Pemutihan ini dapat mematikan karang.
    words: [pemutihan]
  - id: e08
    type: speaking
    text: Penyebab utama pemutihan karang adalah air laut yang terlalu panas.
    meaning:
      ar_eg: السبب الرئيسي لابيضاض المرجان هو إن مية البحر سخنة زيادة.
      ar: السبب الرئيسي لابيضاض المرجان هو فرط سخونة مياه البحر.
      en: The main cause of coral bleaching is sea water that is too hot.
    words: [penyebab]
  - id: e09
    type: dictation
    text: Para ilmuwan berusaha memulihkan terumbu karang yang rusak.
    meaning:
      ar_eg: العلماء بيحاولوا يرجّعوا الشعاب المرجانية اللي اتضرّت.
      ar: يسعى العلماء إلى إصلاح الشعاب المرجانية المتضرّرة.
      en: Scientists are trying to restore the damaged coral reefs.
    words: [memulihkan]
  - id: e10
    type: translate
    direction: from_target
    source_text: Alga memberi karang makanan, sehingga tanpa alga karang kelaparan walaupun airnya masih bersih.
    answers_meaning:
      ar_eg:
        - الطحالب بتدّي المرجان أكل، فمن غير طحالب المرجان بيجوع حتى لو المية لسه نضيفة.
        - الألجي بتأكّل المرجان، وعشان كده من غيرها بيجوع مع إن المية نضيفة.
      ar:
        - تمنح الطحالبُ المرجانَ الغذاء، فيجوع المرجان من دونها وإن بقي الماء نظيفًا.
        - تغذّي الطحالب المرجان، ولذلك يتضوّر جوعًا بدونها مع أنّ الماء ما زال نقيًّا.
      en:
        - Algae give coral food, so without algae the coral starves even though the water is still clean.
        - Algae feed the coral, so without them it goes hungry although the water stays clean.
    words: [alga]
    explain:
      ar_eg: 'sehingga = فـ (النتيجة)، وwalaupun = حتى لو / مع إن: المية النضيفة مش كفاية.'
      ar: 'sehingga = فـ (النتيجة)، وwalaupun = وإن / مع أنّ: الماء النظيف لا يكفي.'
      en: 'sehingga gives the result; walaupun = even though: clean water isn''t enough.'
dialogue:
  title: Karang yang putih
  lines:
    - speaker: Mohamed
      text: Pak, karang di sebelah sana putih semua. Udah mati, ya?
      ar_eg: يا عمّ، المرجان اللي هناك أبيض كله. هو مات؟
      ar: يا سيّدي، المرجان هناك أبيض كلّه. أهو ميّت؟
      en: Sir, the coral over there is all white. Is it dead?
    - speaker: Pak Yance
      text: Belum tentu. Itu pemutihan. Penyebabnya air yang terlalu panas tahun lalu.
      ar_eg: مش أكيد. ده ابيضاض. سببه إن المية كانت سخنة قوي السنة اللي فاتت.
      ar: ليس بالضرورة. هذا ابيضاض، وسببه مياه شديدة الحرارة في العام الماضي.
      en: Not necessarily. That's bleaching. The cause was overly hot water last year.
    - speaker: Mohamed
      text: Bisakah karang itu memulihkan diri?
      ar_eg: المرجان ده يقدر يتعافى؟
      ar: أيستطيع ذلك المرجان أن يتعافى؟
      en: Can that coral recover?
    - speaker: Pak Yance
      text: Bisa, kalau alganya balik dan airnya tetap sejuk. Kita tunggu dan pantau aja.
      ar_eg: يقدر، لو الطحالب رجعت والمية فضلت باردة. هنستنى ونراقب.
      ar: نعم، إن عادت طحالبه وبقيت المياه معتدلة. سننتظر ونراقب.
      en: It can, if its algae come back and the water stays cool. We wait and monitor.
