  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك عيان. تقوله إيه؟
      ar: صديقك مريض. ماذا تقول له؟
      en: Your friend is ill. What do you say?
    options: ["Semoga sukses, ya!", "Selamat datang!", "Semoga cepat sembuh, ya!"]
    answer: 2
    words: [semoga, sembuh]
  - id: e03
    type: multiple_choice
    question: Semoga cepat sembuh!
    question_meaning:
      ar_eg: حد قالك كده. ترد بإيه؟
      ar: قال لك أحدهم هذا. بماذا تردّ؟
      en: Someone says this to you. How do you reply?
    options: ["Amin, terima kasih.", "Sama-sama.", "Tidak apa-apa."]
    answer: 0
    explain:
      ar_eg: على الدعاء بنرد «آمين» وشكرًا. sama-sama رد على «شكرًا»، مش على الدعاء.
      ar: يُرد على الدعاء بـ «آمين» والشكر، أما sama-sama فرد على الشكر.
      en: Answer a wish with amin and thanks; sama-sama answers "thank you", not a wish.
    words: [amin]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ الجملتين صحيحة؟
      en: Which sentence is correct?
    options: ["Saya semoga lulus.", "Semoga saya lulus."]
    answer: 1
    explain:
      ar_eg: semoga لازم في أول الجملة.
      ar: semoga تتصدر الجملة.
      en: semoga opens the sentence.
    words: [semoga]
  - id: e05
    type: listen
    text: Mudah-mudahan besok tidak hujan.
    options: ["Mudah-mudahan besok hujan.", "Mudah-mudahan besok tidak panas.", "Mudah-mudahan besok tidak hujan."]
