schema: kabar.lesson/v1
id: bipa2.u10.l03
language: id
title: Di apotek
can_do:
  ar_eg: تقرا تعليمات الجرعة على علبة الدوا وتفهمها.
  ar: أن تقرأ تعليمات الجرعة على الدواء.
  en: Read dosage instructions.
slides:
  - title: Di apotek
    body:
      ar_eg: |
        apotek = صيدلية، وobat = دوا.
        - obat + المرض = دوا لـ…: obat batuk = دوا كحة، obat sakit kepala = دوا صداع.
        - tablet = أقراص، sirup = شراب.
        - resep (dokter) = روشتة.
        وتسأل: «Ada obat batuk?» = عندكم دوا كحة؟
      ar: |
        apotek = صيدلية، وobat = دواء.
        - obat + المرض = دواء لـ…: obat batuk = دواء السعال، obat sakit kepala = دواء الصداع.
        - tablet = أقراص، sirup = شراب.
        - resep (dokter) = وصفة الطبيب.
        وتسأل: «Ada obat batuk?» = هل عندكم دواء للسعال؟
      en: |
        apotek = pharmacy, obat = medicine.
        - obat + illness = medicine for it: obat batuk (cough medicine), obat sakit kepala (headache medicine).
        - tablet = tablet, sirup = syrup.
        - resep (dokter) = (doctor's) prescription.
        Ask: "Ada obat batuk?" = Do you have cough medicine?
    examples:
      - text: Saya mau beli obat sakit kepala.
        ar_eg: عايز أشتري دوا صداع.
        ar: أريد شراء دواء للصداع.
        en: I'd like to buy some headache medicine.
      - text: Ada obat batuk?
        ar_eg: عندكم دوا كحة؟
        ar: هل يوجد دواء للسعال؟
        en: Do you have cough medicine?
  - title: Tiga kali sehari
    body:
      ar_eg: |
        على العلبة هتلاقي كام مرة في اليوم:
        - sehari = في اليوم (se- = واحد + hari).
        - tiga kali sehari = ٣ مرات في اليوم. ومكتوبة كتير كده: 3 x sehari.
        - satu tablet = قرص واحد، satu sendok teh = معلقة صغيرة.
      ar: |
        على العبوة تجد عدد المرات في اليوم:
        - sehari = في اليوم (se- = واحد + hari).
        - tiga kali sehari = ثلاث مرات يوميًا، وتُكتب غالبًا: 3 x sehari.
        - satu tablet = قرص واحد، satu sendok teh = ملعقة صغيرة.
      en: |
        The label tells you how often:
        - sehari = a day, per day (se- "one" + hari).
        - tiga kali sehari = three times a day, often printed 3 x sehari.
        - satu tablet = one tablet, satu sendok teh = one teaspoon.
    examples:
      - text: 3 x sehari 1 tablet
        ar_eg: ٣ مرات في اليوم، قرص واحد.
        ar: ثلاث مرات يوميًا، قرص واحد.
        en: Three times a day, one tablet.
      - text: Minum obat ini dua kali sehari.
        ar_eg: خد الدوا ده مرتين في اليوم.
        ar: تناول هذا الدواء مرتين يوميًا.
        en: Take this medicine twice a day.
  - title: Sebelum atau sesudah makan?
    body:
      ar_eg: |
        إنت عارف sebelum (قبل) وsesudah / setelah (بعد). على الدوا:
        - sebelum makan = قبل الأكل، sesudah makan = بعد الأكل.
        - على العلبة بيكتبوا «diminum» بدل «minum» (يعني «يُشرب»، صيغة هتتعلمها بعدين). احفظها كده: Diminum 3 x sehari = يتاخد ٣ مرات في اليوم.
        - aturan pakai = طريقة الاستعمال.
      ar: |
        تعرف sebelum (قبل) وsesudah / setelah (بعد). وعلى الدواء:
        - sebelum makan = قبل الطعام، sesudah makan = بعد الطعام.
        - وتُكتب على العبوة «diminum» بدل «minum» أي «يُشرب» (صيغة المبني للمجهول ستأتي لاحقًا): Diminum 3 x sehari.
        - aturan pakai = طريقة الاستعمال.
      en: |
        You know sebelum (before) and sesudah / setelah (after). On medicine:
        - sebelum makan = before meals, sesudah makan = after meals.
        - Labels say "diminum" instead of "minum" ("is to be taken" — a form you'll learn later). Learn it as a phrase: Diminum 3 x sehari.
        - aturan pakai = directions for use.
    examples:
      - text: Diminum tiga kali sehari sesudah makan.
        ar_eg: يتاخد ٣ مرات في اليوم بعد الأكل.
        ar: يؤخذ ثلاث مرات يوميًا بعد الطعام.
        en: To be taken three times a day after meals.
  - title: Kocok dahulu
    body:
      ar_eg: |
        كلمات تانية على العلب:
        - Kocok dahulu sebelum diminum = رجّ الزجاجة قبل الاستعمال. (dahulu = dulu بس أرسمي)
        - Simpan di tempat sejuk = يُحفظ في مكان بارد.
        - Obat luar = للاستعمال الخارجي، ماتشربوش!
      ar: |
        عبارات أخرى على العبوات:
        - Kocok dahulu sebelum diminum = رُجّ قبل الاستعمال (dahulu = dulu لكنها أرسمي).
        - Simpan di tempat sejuk = يُحفظ في مكان بارد.
        - Obat luar = للاستعمال الخارجي، لا يُشرب.
      en: |
        More label words:
        - Kocok dahulu sebelum diminum = shake well before use (dahulu = formal dulu).
        - Simpan di tempat sejuk = store in a cool place.
        - Obat luar = for external use — don't drink it!
    examples:
      - text: Kocok dahulu sebelum diminum.
        ar_eg: رجّ الزجاجة قبل ما تشربه.
        ar: رُجّ العبوة قبل الشرب.
        en: Shake well before use.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: apotek
        ar_eg: صيدلية
        ar: صيدلية
        en: pharmacy
      - text: obat
        ar_eg: دوا
        ar: دواء
        en: medicine
      - text: sirup
        ar_eg: شراب (دوا)
        ar: شراب دوائي
        en: syrup
      - text: sendok teh
        ar_eg: معلقة صغيرة
        ar: ملعقة صغيرة
        en: teaspoon
      - text: aturan pakai
        ar_eg: طريقة الاستعمال
        ar: طريقة الاستعمال
        en: directions for use
      - text: kocok
        ar_eg: رُجّ
        ar: رُجّ
        en: shake
    words: [apotek, obat, sirup, sendok teh, aturan pakai, kocok]
  - id: e02
    type: multiple_choice
    question: 3 x sehari 1 tablet
    question_meaning:
      ar_eg: على العلبة مكتوب كده. تاخد الدوا كام مرة؟
      ar: هذا مكتوب على العبوة. كم مرة تتناول الدواء؟
      en: This is on the box. How often do you take it?
    options: [Tiga kali sehari, Tiga hari sekali, Satu kali sehari]
    answer: 0
    explain:
      ar_eg: «3 x» = tiga kali (٣ مرات)، وsehari = في اليوم.
      ar: «3 x» = tiga kali، وsehari = في اليوم.
      en: '"3 x" = tiga kali (three times); sehari = a day.'
    words: [kali, sehari, tablet]
  - id: e03
    type: listen
    text: Obat ini diminum dua kali sehari.
    options: [Obat ini diminum dua hari sekali., Obat ini diminum tiga kali sehari., Obat ini diminum dua kali sehari.]
    answer: 2
    words: [obat, diminum, kali, sehari]
  - id: e04
    type: fill_blank
    sentence: Sirup dari apotek ini diminum tiga ___ sehari, satu sendok teh.
    meaning:
      ar_eg: شراب الصيدلية ده يتاخد ٣ مرات في اليوم، معلقة صغيرة.
      ar: يؤخذ شراب الصيدلية هذا ثلاث مرات يوميًا، ملعقة صغيرة.
      en: This pharmacy syrup is taken three times a day, one teaspoon.
    options: [hari, jam, kali]
    answers: [kali]
    words: [kali, sirup, apotek, diminum, sendok teh]
    explain:
      ar_eg: "عدد + kali = مرّات: tiga kali sehari = ٣ مرات في اليوم. hari يوم وjam ساعة."
      ar: "عدد + kali = مرّات: tiga kali sehari. أما hari فيوم وjam ساعة."
      en: "Number + kali = times: tiga kali sehari. hari is day, jam hour."
  - id: e05
    type: fill_blank
    sentence: 'Aturan pakai: ___ dahulu sebelum diminum.'
    meaning:
      ar_eg: رجّ الزجاجة قبل الاستعمال.
      ar: رُجّ العبوة قبل الاستعمال.
      en: Shake well before use.
    options: [Makan, Simpan, Kocok]
    answers: [Kocok]
    words: [aturan pakai, kocok, diminum]
    explain:
      ar_eg: Kocok = رجّ، وده المكتوب على الشراب قبل الاستعمال. Simpan = احفظ، وMakan = كُل.
      ar: Kocok = رُجّ، كما يُكتب على الشراب. أما Simpan فـ«احفظ» وMakan «كُل».
      en: Kocok = shake, as syrup labels say. Simpan is store, Makan is eat.
  - id: e06
    type: speaking
    text: Di apotek, saya beli sirup obat batuk.
    meaning:
      ar_eg: اشتريت شراب كحة من الصيدلية.
      ar: اشتريت من الصيدلية شرابًا للسعال.
      en: At the pharmacy, I bought cough syrup.
    words: [apotek, sirup, obat, batuk]
  - id: e07
    type: multiple_choice
    question: 'Aturan pakai: kocok dahulu, diminum 3 x sehari 1 sendok teh.'
    question_meaning:
      ar_eg: ده مكتوب على علبة الشراب. تعمل إيه الأول؟
      ar: هذا مكتوب على علبة الشراب. ماذا تفعل أولًا؟
      en: This is on the syrup box. What do you do first?
    options: [Kocok dahulu., Makan dahulu., Tidur dahulu.]
    answer: 0
    words: [aturan pakai, kocok, diminum, sendok teh]
    explain:
      ar_eg: «kocok dahulu» = رجّ الأول، وده أول خطوة في التعليمات.
      ar: «kocok dahulu» = رُجّ أولًا، وهي الخطوة الأولى.
      en: "\"kocok dahulu\" = shake first, the first step."
dialogue:
  title: Apotek di Amed
  lines:
    - speaker: Mbak Ketut
      text: Selamat siang. Ada yang bisa saya bantu?
      ar_eg: نهارك سعيد. أقدر أساعدك في حاجة؟
      ar: طاب نهارك. هل أستطيع مساعدتك؟
      en: Good afternoon. Can I help you?
    - speaker: Mohamed
      text: Siang, Mbak. Saya batuk dan pilek. Ada obat batuk?
      ar_eg: نهارك سعيد. عندي كحة ورشح. عندكم دوا كحة؟
      ar: طاب نهارك. عندي سعال وزكام. هل لديكم دواء للسعال؟
      en: Afternoon. I have a cough and a runny nose. Do you have cough medicine?
    - speaker: Mbak Ketut
      text: Ada. Ini sirup. Diminum tiga kali sehari, satu sendok teh.
      ar_eg: أيوه. ده شراب. يتاخد ٣ مرات في اليوم، معلقة صغيرة.
      ar: نعم. هذا شراب يؤخذ ثلاث مرات يوميًا، ملعقة صغيرة.
      en: Yes. Here's a syrup. Three times a day, one teaspoon.
    - speaker: Mohamed
      text: Sebelum atau sesudah makan?
      ar_eg: قبل الأكل ولا بعده؟
      ar: قبل الطعام أم بعده؟
      en: Before or after meals?
    - speaker: Mbak Ketut
      text: Sesudah makan. Kocok dahulu, ya.
      ar_eg: بعد الأكل. ورجّ الزجاجة الأول.
      ar: بعد الطعام. ورُجّ العبوة أولًا.
      en: After meals. Shake it first.
    - speaker: Mohamed
      text: Baik. Terima kasih, Mbak!
      ar_eg: تمام. شكرًا!
      ar: حسنًا. شكرًا!
      en: OK. Thank you!
