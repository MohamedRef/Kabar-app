dialogue:
  title: Jamu dari Ni Luh
  lines:
    - speaker: Ni Luh
      text: Mohamed, masih pusing?
      ar_eg: يا محمد، لسه دايخ؟
      ar: يا محمد، هل ما زلت تشعر بالدوار؟
      en: Mohamed, still dizzy?
    - speaker: Mohamed
      text: Sudah lebih baik, alhamdulillah.
      ar_eg: أحسن شوية، الحمد لله.
      ar: صرت أفضل، الحمد لله.
      en: Better now, alhamdulillah.
    - speaker: Ni Luh
      text: Ini jamu dari ibu saya. Ayo, minum dulu!
      ar_eg: ده جامو من ماما. يلا اشربه!
      ar: هذا جامو من أمي. هيّا اشربه!
      en: This is jamu from my mum. Come on, drink it!
    - speaker: Mohamed
      text: Terima kasih. Wah, pahit sekali!
      ar_eg: شكرًا. ياه، مر أوي!
      ar: شكرًا. يا إلهي، إنه مرّ جدًا!
      en: Thanks. Whoa, it's so bitter!
    - speaker: Ni Luh
      text: Pahit, tapi bagus untuk badan. Semoga cepat sembuh, ya!
      ar_eg: مر، بس مفيد للجسم. ألف سلامة عليك!
      ar: مرّ، لكنه مفيد للجسم. شفاك الله سريعًا!
      en: Bitter, but good for you. Get well soon!
    - speaker: Mohamed
      text: Amin. Mudah-mudahan besok kita bisa berenang lagi.
      ar_eg: آمين. يا رب نعرف نعوم تاني بكرة.
      ar: آمين. عسى أن نستطيع السباحة مرة أخرى غدًا.
      en: Amen. Hopefully we can go swimming again tomorrow.
