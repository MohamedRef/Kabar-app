schema: kabar.lesson/v1
id: bipa2.u10.l03
language: id
title: Semoga cepat sembuh
can_do:
  ar_eg: تتمنى لحد الشفا وتنصحه يرتاح.
  ar: أن تتمنى الشفاء لغيرك وتقترح عليه الراحة.
  en: Wish well and suggest rest.
slides:
  - title: Semoga cepat sembuh
    body:
      ar_eg: |
        semoga = يا رب / إن شاء الله (في الأمنية). بتيجي في أول الجملة.
        Semoga cepat sembuh = ألف سلامة / ربنا يشفيك (حرفيًا: يا رب تخف بسرعة). sembuh = يخف، يشفى.
        خلي بالك: «Saya semoga lulus» غلط، الصح «Semoga saya lulus».
      ar: |
        semoga = عسى / أرجو أن، وتتصدر الجملة.
        Semoga cepat sembuh = شفاك الله سريعًا (حرفيًا: عسى أن تُشفى سريعًا)، وsembuh = يُشفى.
        وانتبه: «Saya semoga lulus» خطأ، والصواب «Semoga saya lulus».
      en: |
        semoga = may… / I hope — it opens the sentence.
        Semoga cepat sembuh = get well soon (literally "may you heal quickly"); sembuh = recover.
        Careful: "Saya semoga lulus" is wrong; say "Semoga saya lulus".
    grammar: id.hope.semoga
    examples:
      - text: Semoga cepat sembuh, ya!
        ar_eg: ألف سلامة عليك!
        ar: شفاك الله سريعًا!
        en: Get well soon!
      - text: Semoga saya lulus.
        ar_eg: يا رب أنجح.
        ar: أرجو أن أنجح.
        en: I hope I pass.
  - title: Mudah-mudahan, insya Allah, amin
    body:
      ar_eg: |
        - mudah-mudahan = نفس معنى semoga، وأكتر في الكلام: Mudah-mudahan besok tidak hujan = يا رب بكرة ماتمطرش.
        - insya Allah = إن شاء الله، بنفس المعنى (وأحيانًا بنفس التهرّب المصري!).
        - الرد على الدعاء: Amin / Aamiin = آمين. وAlhamdulillah = الحمد لله، زي عندنا بالظبط.
        هتحس إنك في البيت!
      ar: |
        - mudah-mudahan بمعنى semoga، وأشيع في الحديث: Mudah-mudahan besok tidak hujan.
        - insya Allah = إن شاء الله.
        - ويُرد على الدعاء بـ Amin / Aamiin = آمين، وتقال Alhamdulillah = الحمد لله كما في العربية.
      en: |
        - mudah-mudahan = same as semoga, very common in speech: Mudah-mudahan besok tidak hujan.
        - insya Allah = God willing (with the same range of meanings as in Egypt!).
        - Reply to a wish with Amin / Aamiin; Alhamdulillah works exactly as in Arabic.
    grammar: id.hope.semoga
    examples:
      - text: Mudah-mudahan kita bisa bertemu lagi.
        ar_eg: يا رب نتقابل تاني.
        ar: عسى أن نلتقي مرة أخرى.
        en: Hopefully we can meet again.
      - text: Besok kamu datang? — Insya Allah.
        ar_eg: جاي بكرة؟ — إن شاء الله.
        ar: هل ستأتي غدًا؟ — إن شاء الله.
        en: Are you coming tomorrow? — God willing.
  - title: Semoga sukses! Semoga lancar!
    body:
      ar_eg: |
        أمنيات جاهزة:
        - Semoga sukses! = بالتوفيق!
        - Semoga lancar! = ربنا يسهّل!
        - Semoga betah! = يا رب تتبسط هنا (في مكان جديد).
      ar: |
        عبارات جاهزة:
        - Semoga sukses! = بالتوفيق!
        - Semoga lancar! = يسّر الله أمرك!
        - Semoga betah! = أرجو أن ترتاح في مكانك الجديد.
      en: |
        Ready-made wishes:
        - Semoga sukses! = good luck!
        - Semoga lancar! = hope it goes smoothly!
        - Semoga betah! = hope you feel at home (in a new place).
    grammar: id.hope.semoga
    examples:
      - text: Semoga sukses ujiannya! — Aamiin, terima kasih.
        ar_eg: بالتوفيق في الامتحان! — يا رب، شكرًا.
        ar: بالتوفيق في الامتحان! — آمين، شكرًا.
        en: Good luck with the exam! — Amen, thank you.
  - title: Ayo, istirahat dulu!
    body:
      ar_eg: |
        عشان تنصح حد عيان، استخدم ayo (يلا) أو yuk (ألطف) أو mari (رسمية):
        - Ayo, istirahat dulu! = يلا ارتاح شوية!
        - Minum jamu, yuk! = يلا نشرب جامو!
        - Mari kita hidup sehat. = هيا نعيش حياة صحية (رسمي، زي الإعلانات).
        istirahat جاية من العربي «استراحة».
      ar: |
        لتنصح مريضًا استعمل ayo (هيّا) أو yuk (ألطف) أو mari (رسمية):
        - Ayo, istirahat dulu! = هيّا استرح قليلًا!
        - Minum jamu, yuk! = هيا نشرب الجامو!
        - Mari kita hidup sehat. = لنعش حياة صحية (رسمية كالإعلانات).
        وistirahat من العربية «استراحة».
      en: |
        To nudge someone who's ill, use ayo (come on), yuk (softer) or mari (formal):
        - Ayo, istirahat dulu! = Come on, get some rest!
        - Minum jamu, yuk! = Let's have some jamu!
        - Mari kita hidup sehat. = Let us live healthily (formal, like an ad).
        istirahat comes from Arabic «استراحة».
    grammar: id.invitation.ayo-mari
    examples:
      - text: Ayo, istirahat dulu supaya cepat sembuh.
        ar_eg: يلا ارتاح شوية عشان تخف بسرعة.
        ar: هيّا استرح قليلًا لتشفى سريعًا.
        en: Come on, get some rest so you get well soon.
