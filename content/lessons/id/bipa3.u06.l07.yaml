schema: kabar.lesson/v1
id: bipa3.u06.l07
language: id
title: Ulangan Unit 6
can_do:
  ar_eg: تشتكي بأدب، في الكلام وفي جواب رسمي.
  ar: أن تشكو بلباقة، شفهيًّا وفي رسالة رسمية.
  en: Complain politely, in speech and in a formal letter.
slides:
  - title: Empat wajah se-
    body:
      ar_eg: |
        في الوحدة دي se- ظهرت بأربع معاني:
        1) واحد: sebuah kamar، seorang tamu، seminggu
        2) كله: sekeluarga، se-Indonesia
        3) قد / زي: tidak sebersih foto، sesuai dengan
        4) ظرف بـ -nya: secepatnya، sebaiknya، sebenarnya، sebelumnya
      ar: |
        ظهرت se- في هذه الوحدة بأربعة معانٍ:
        1) الواحد: sebuah kamar، seorang tamu، seminggu
        2) الشمول: sekeluarga، se-Indonesia
        3) المساواة: tidak sebersih foto، sesuai dengan
        4) الظرف مع -nya: secepatnya، sebaiknya، sebenarnya، sebelumnya
      en: |
        In this unit se- had four faces:
        1) one: sebuah kamar, seorang tamu, seminggu
        2) the whole: sekeluarga, se-Indonesia
        3) as … as: tidak sebersih foto, sesuai dengan
        4) adverb with -nya: secepatnya, sebaiknya, sebenarnya, sebelumnya
    grammar: id.prefix.se
    examples:
      - text: Mohon maaf sebelumnya, kamar saya tidak sebersih foto.
        ar_eg: آسف مقدمًا، أوضتي مش نضيفة زي الصورة.
        ar: أعتذر مسبقًا، غرفتي ليست بنظافة الصورة.
        en: Sorry in advance, but my room isn't as clean as the photo.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: seorang tamu
        ar_eg: ضيف واحد
        ar: ضيف واحد
        en: a guest
      - text: sekeluarga
        ar_eg: العيلة كلها
        ar: الأسرة كلها
        en: the whole family
      - text: secepatnya
        ar_eg: في أسرع وقت
        ar: في أسرع وقت
        en: as soon as possible
      - text: keluhan
        ar_eg: شكوى
        ar: شكوى
        en: complaint
      - text: kecewa
        ar_eg: زعلان / مخذول
        ar: خائب الأمل
        en: disappointed
      - text: berisik
        ar_eg: دوشة
        ar: صاخب
        en: noisy
    words: [seorang, tamu, sekeluarga, secepatnya, keluhan, kecewa, berisik]
  - id: e02
    type: multiple_choice
    question: Saya memesan ___ kamar untuk tiga malam.
    options: [seorang, sekeluarga, sebuah]
    answer: 2
    explain:
      ar_eg: kamar حاجة، فبتاخد sebuah. seorang للأشخاص.
      ar: kamar شيء فيأخذ sebuah، وseorang للأشخاص.
      en: A room is a thing, so sebuah; seorang is for people.
    words: [sebuah]
  - id: e03
    type: listen
    text: Kamarnya tidak sesuai dengan pesanan saya.
    options:
      - Kamarnya tidak sesuai dengan pesanan saya.
      - Kamarnya tidak sebersih pesanan saya.
      - Kamarnya sudah sesuai dengan pesanan saya.
    answer: 0
    meaning:
      ar_eg: الأوضة مش زي اللي حجزته.
      ar: الغرفة لا تطابق حجزي.
      en: The room doesn't match my booking.
    words: [sesuai]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كتابة صح لـ «في إندونيسيا كلها»؟
      ar: أيّ كتابة صحيحة لعبارة «في إندونيسيا كلها»؟
      en: Which is the correct spelling of "all over Indonesia"?
    options: [se Indonesia, se-Indonesia, seIndonesia]
    answer: 1
    explain:
      ar_eg: قبل اسم علم بتحط شَرطة وتسيب الحرف الكابيتال.
      ar: قبل اسم العلم تُكتب se- بشرطة ويبقى الحرف الكبير.
      en: Before a proper noun, se- takes a hyphen and the capital stays.
    words: [se-Indonesia]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: في آخر جواب رسمي، بتكتب إيه قبل اسمك على طول؟
      ar: ماذا تكتب مباشرةً قبل اسمك في آخر الرسالة الرسمية؟
      en: What do you write right before your name at the end of a formal letter?
    options: [Dengan hormat, Perihal, Hormat saya]
    answer: 2
    words: [hormat]
  - id: e06
    type: fill_blank
    sentence: Mohon maaf ___, kamar saya berisik sekali.
    meaning:
      ar_eg: آسف مقدمًا، أوضتي دوشة جدًا.
      ar: أعتذر مسبقًا، غرفتي صاخبة جدًا.
      en: Sorry in advance, but my room is very noisy.
    options: [sebenarnya, sebelumnya, sebaiknya]
    answers: [sebelumnya]
    words: [sebelumnya, berisik]
  - id: e07
    type: fill_blank
    sentence: Saya minta pihak hotel ___ uang saya.
    meaning:
      ar_eg: بطلب من إدارة الفندق ترجّعلي فلوسي.
      ar: أطلب من إدارة الفندق أن تردّ مالي.
      en: I'm asking the hotel to give my money back.
    answers: [mengembalikan]
    words: [mengembalikan, pihak]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الأحسن حضرتك تنقل لأوضة تانية.
      ar: الأفضل أن تنتقل إلى غرفة أخرى يا سيدي.
      en: You'd better move to another room, sir.
    answer: Sebaiknya Bapak pindah ke kamar lain.
    distractors: [sebenarnya, sebuah]
    words: [sebaiknya]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الحمام مش نضيف زي الصورة، والتكييف بايظ.
      ar: الحمّام ليس بنظافة الصورة، والمكيّف معطّل.
      en: The bathroom isn't as clean as the photo, and the AC is broken.
    answers:
      - Kamar mandinya tidak sebersih foto, dan AC-nya rusak.
      - Kamar mandinya tidak sebersih foto, dan AC-nya rusak
      - Kamar mandinya tidak sebersih foto dan AC-nya rusak.
      - Kamar mandinya tidak sebersih foto dan AC-nya rusak
      - Kamar mandinya tidak sebersih fotonya, dan AC-nya rusak.
      - Kamar mandinya tidak sebersih di foto, dan AC-nya rusak.
      - Kamar mandinya tidak sebersih foto, dan AC rusak.
      - Kamar mandi tidak sebersih foto, dan AC-nya rusak.
      - Kamar mandinya tidak sebersih foto, juga AC-nya rusak.
    words: [bersih, rusak]
  - id: e10
    type: dictation
    text: Mohon maklum, petugas kami akan memperbaikinya secepatnya.
    meaning:
      ar_eg: اعذرنا، الموظف بتاعنا هيصلّحها في أسرع وقت.
      ar: نرجو تفهّمكم، سيُصلحها موظفنا في أسرع وقت.
      en: Please bear with us; our staff will fix it as soon as possible.
    words: [maklum, memperbaiki, secepatnya]
  - id: e11
    type: speaking
    text: Dengan hormat, saya ingin menyampaikan keluhan tentang kamar saya.
    meaning:
      ar_eg: تحية طيبة وبعد، حابب أقدّم شكوى بخصوص أوضتي.
      ar: تحية طيبة وبعد، أودّ تقديم شكوى بشأن غرفتي.
      en: Dear Sir or Madam, I would like to make a complaint about my room.
    words: [hormat, menyampaikan, keluhan]
dialogue:
  title: Di Sirkuit Mandalika
  lines:
    - speaker: Mas Rizal
      text: Bagaimana hotelnya, Mohamed?
      ar_eg: الفندق عامل إيه يا محمد؟
      ar: كيف الفندق يا محمد؟
      en: How's the hotel, Mohamed?
    - speaker: Mohamed
      text: Sebenarnya, ada masalah. Kamarnya tidak sebersih foto, dan AC-nya rusak.
      ar_eg: الحقيقة فيه مشكلة. الأوضة مش نضيفة زي الصورة، والتكييف بايظ.
      ar: في الحقيقة، هناك مشكلة. الغرفة ليست بنظافة الصورة، والمكيّف معطّل.
      en: Actually, there's a problem. The room isn't as clean as the photo, and the AC is broken.
    - speaker: Mas Rizal
      text: Wah! Sudah menulis surat keluhan?
      ar_eg: يا خبر! كتبت جواب شكوى؟
      ar: يا للعجب! هل كتبتَ رسالة شكوى؟
      en: Oh no! Have you written a complaint letter?
    - speaker: Mohamed
      text: Sudah, dengan “Mohon maaf sebelumnya”. Pihak hotel mengembalikan uang untuk satu malam.
      ar_eg: أيوه، وبدأت بـ «آسف مقدمًا». والفندق رجّعلي فلوس ليلة.
      ar: نعم، وبدأتُها بـ«أعتذر مسبقًا». وقد ردّت إدارة الفندق ثمن ليلة واحدة.
      en: Yes, starting with "Sorry in advance". The hotel refunded one night.
    - speaker: Mas Rizal
      text: Bagus! Sekarang kita jalan-jalan di Sirkuit Mandalika. Sirkuit ini terkenal se-Indonesia!
      ar_eg: حلو! يلا نتمشى في حلبة مانداليكا. الحلبة دي مشهورة في إندونيسيا كلها!
      ar: رائع! لنتجوّل الآن في حلبة مانداليكا، فهي مشهورة في أنحاء إندونيسيا!
      en: Great! Now let's look around the Mandalika circuit. It's famous all over Indonesia!
souvenir:
  id: bipa3.u06.souvenir
  title: Sirkuit Mandalika
  note:
    ar_eg: حلبة مانداليكا جنب شط كوتا، وبقت بتستضيف سباقات الموتوسيكلات العالمية (MotoGP) من 2022، والناس بتيجي من إندونيسيا كلها. ولو حصلت مشكلة في الفندق وقت السباق، افتكر إن الشكوى الإندونيسية هادية ومش مباشرة. «Mohon maaf sebelumnya» في الأول بتفتح كل الأبواب.
    ar: تقع حلبة مانداليكا قرب شاطئ كوتا، وتستضيف منذ عام 2022 سباقات الدراجات النارية العالمية (MotoGP)، فيقصدها الناس من أنحاء إندونيسيا. وإن واجهتك مشكلة في الفندق أيام السباق فتذكّر أن الشكوى الإندونيسية هادئة غير مباشرة، وأن عبارة «Mohon maaf sebelumnya» في أولها تفتح الأبواب.
    en: The Mandalika circuit beside Kuta beach has hosted MotoGP races since 2022, and fans come from all over Indonesia. If something goes wrong at your hotel on race weekend, remember that Indonesian complaints stay calm and indirect, and a "Mohon maaf sebelumnya" at the start opens every door.
