schema: kabar.lesson/v1
id: bipa3.u06.l07
language: id
title: Staf yang kasar
can_do:
  ar_eg: تشتكي للمدير من موظف مش مؤدب ومن الفوضى، وتطالب بحقك بأدب.
  ar: أن تشتكي للمدير من موظف غير مهذّب ومن الفوضى، وتطالب بحقك بأدب.
  en: Complain to the manager about rude staff and a mess, and politely demand what you're owed.
slides:
  - title: Bertemu manajer
    body:
      ar_eg: |
        staf = الموظفين، طاقم العمل. melayani = يخدم (الزباين).
        sopan = مؤدب، kesal = متضايق، زهقان.
        kacau = مكركب، فوضى (الأمور ملخبطة). berantakan = متبهدل، مش مترتب (الأوضة).
        menuntut = يطالب بـ. ketat = صارم (aturan ketat = قواعد صارمة)؛ وكمان ضيق (هدوم).
      ar: |
        staf = الموظفون، الطاقم. melayani = يخدم (الزبائن).
        sopan = مهذّب، kesal = منزعج، متضايق.
        kacau = فوضوي، مضطرب (الأمور). berantakan = غير مرتّب، مبعثر (الغرفة).
        menuntut = يطالب بـ. ketat = صارم (aturan ketat = قواعد صارمة)؛ وأيضًا ضيّق (ملابس).
      en: |
        staf = staff. melayani = serve (customers).
        sopan = polite, kesal = annoyed, fed up.
        kacau = chaotic, a mess (of a situation). berantakan = messy, untidy (of a room).
        menuntut = demand. ketat = strict (aturan ketat = strict rules); also tight (clothes).
    examples:
      - text: Staf hotel itu sangat sopan dan ramah.
        ar_eg: موظفين الفندق ده مؤدبين ولطاف جدًا.
        ar: موظفو ذلك الفندق مهذّبون ولطفاء جدًا.
        en: The staff at that hotel are very polite and friendly.
      - text: Kamar saya masih berantakan dan kotor.
        ar_eg: أوضتي لسه متبهدلة ووسخة.
        ar: غرفتي ما زالت غير مرتّبة ومتّسخة.
        en: My room is still messy and dirty.
      - text: Saya menuntut kamar yang bersih.
        ar_eg: أنا بطالب بأوضة نضيفة.
        ar: أطالب بغرفة نظيفة.
        en: I demand a clean room.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: staf
        ar_eg: موظفين
        ar: الطاقم
        en: staff
      - text: melayani
        ar_eg: يخدم
        ar: يخدم
        en: serve
      - text: sopan
        ar_eg: مؤدب
        ar: مهذّب
        en: polite
      - text: kesal
        ar_eg: متضايق
        ar: منزعج
        en: annoyed
    words: [staf, melayani, sopan, kesal]
  - id: e02
    type: match_pairs
    pairs:
      - text: kacau
        ar_eg: فوضى، ملخبط
        ar: فوضوي
        en: chaotic
      - text: berantakan
        ar_eg: متبهدل
        ar: غير مرتّب
        en: messy
      - text: menuntut
        ar_eg: يطالب بـ
        ar: يطالب بـ
        en: demand
      - text: ketat
        ar_eg: صارم؛ ضيق
        ar: صارم؛ ضيّق
        en: strict; tight
    words: [kacau, berantakan, menuntut, ketat]
  - id: e03
    type: listen
    text: Saya kesal sekali. Sarapan terlambat satu jam!
    question:
      ar_eg: هو حاسس بإيه؟
      ar: بماذا يشعر؟
      en: How does he feel?
    options: [مبسوط, متضايق, جعان بس]
    answer: 1
    meaning:
      ar_eg: أنا متضايق جدًا. الفطار اتأخر ساعة!
      ar: أنا منزعج جدًا. تأخّر الفطور ساعة!
      en: I'm really annoyed. Breakfast is an hour late!
    words: [kesal]
  - id: e04
    type: fill_blank
    sentence: Staf restoran ini ___ tamu dengan cepat.
    meaning:
      ar_eg: موظفين المطعم ده بـ ___ الضيوف بسرعة.
      ar: يـ ___ موظفو هذا المطعم الضيوف بسرعة.
      en: The staff in this restaurant ___ guests quickly.
    options: [melayani, menuntut, berantakan]
    answers: [melayani]
    words: [melayani, menuntut, berantakan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الأوضة مش مترتبة والهدوم في كل حتة. الأوضة …؟
      ar: الغرفة غير مرتّبة والملابس في كل مكان. الغرفة …؟
      en: Clothes everywhere, nothing tidy. The room is …?
    options: [sopan, berantakan, staf]
    answer: 1
    explain:
      ar_eg: berantakan = متبهدل، مش مترتب.
      ar: berantakan = غير مرتّب.
      en: berantakan = messy.
    words: [berantakan, sopan, staf]
  - id: e06
    type: fill_blank
    sentence: 'Aturan di sini sangat ___: tamu tidak boleh merokok.'
    meaning:
      ar_eg: 'القواعد هنا ___ جدًا: ممنوع الضيوف يدخّنوا.'
      ar: 'القواعد هنا ___ جدًا: لا يُسمح للضيوف بالتدخين.'
      en: 'The rules here are very ___: guests may not smoke.'
    options: [kesal, kacau, ketat]
    answers: [ketat]
    words: [ketat, kesal, kacau]
  - id: e07
    type: build_sentence
    source:
      ar_eg: كل الموظفين لازم يبقوا مؤدبين مع الزباين.
      ar: يجب أن يكون كل الموظفين مهذّبين مع الزبائن.
      en: All staff must be polite to customers.
    answer: Semua staf harus sopan kepada pelanggan.
    distractors: [kesal, melayani]
    words: [staf, sopan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Pagi ini hotel kacau. Sarapan terlambat satu jam.
    answers_meaning:
      ar_eg: [الصبح ده كله كان فوضى. الفطار اتأخر ساعة, النهارده الصبح كانت الدنيا ملخبطة. الفطار اتأخر ساعة]
      ar: [كان كل شيء فوضويًا هذا الصباح. تأخر الفطور ساعة]
      en: [Everything was chaos this morning. Breakfast was an hour late, It was a mess this morning. Breakfast was an hour late]
    words: [kacau]
  - id: e09
    type: speaking
    text: Saya menuntut kamar yang lain atau uang saya.
    meaning:
      ar_eg: أنا بطالب بأوضة تانية أو فلوسي ترجع.
      ar: أطالب بغرفة أخرى أو باسترداد أموالي.
      en: I demand another room or my money back.
    words: [menuntut]
  - id: e10
    type: multiple_choice
    question: Maaf, Bu, celana ini terlalu ___. Ada ukuran yang lebih besar?
    options: [ketat, melayani, kacau]
    answer: 0
    explain:
      ar_eg: ketat = ضيق (للهدوم) أو صارم.
      ar: ketat = ضيّق (للملابس) أو صارم.
      en: ketat = tight (of clothes) or strict.
    words: [ketat, melayani, kacau]
dialogue:
  lines:
    - speaker: Manajer
      text: Selamat siang, Pak. Saya manajer hotel. Ada masalah?
      ar_eg: مساء الخير يا فندم. أنا مدير الفندق. فيه مشكلة؟
      ar: مساء الخير يا سيدي. أنا مدير الفندق. هل من مشكلة؟
      en: Good afternoon, sir. I'm the hotel manager. Is there a problem?
    - speaker: Mohamed
      text: Ya, Pak. Mohon maaf sebelumnya. Salah satu staf Bapak kasar kepada saya, dan saya kesal.
      ar_eg: أيوه يا فندم. معلش مقدّمًا. واحد من الموظفين كان قليل الذوق معايا، وأنا متضايق.
      ar: نعم يا سيدي. أعتذر مسبقًا. أحد موظفيك كان فظًّا معي، وأنا منزعج.
      en: Yes. I'm sorry to say this, but one of your staff was rude to me, and I'm annoyed.
    - speaker: Manajer
      text: Kami mohon maaf. Ada apa, Pak?
      ar_eg: إحنا آسفين جدًا. إيه اللي حصل؟
      ar: نعتذر. ماذا حدث؟
      en: We apologise. What happened?
    - speaker: Mohamed
      text: Kamar saya berantakan, dan waktu saya minta tolong, dia marah.
      ar_eg: أوضتي كانت متبهدلة، ولما طلبت مساعدة، اتعصّب.
      ar: كانت غرفتي غير مرتّبة، وحين طلبت المساعدة غضب.
      en: My room was a mess, and when I asked for help, he got angry.
    - speaker: Manajer
      text: Itu tidak sopan. Aturan kami ketat. Kami akan membersihkan kamar Bapak sekarang.
      ar_eg: ده مش أدب. قواعدنا صارمة. هننضّف أوضة حضرتك دلوقتي.
      ar: هذا غير مهذّب. قواعدنا صارمة. سننظّف غرفتك الآن.
      en: That's not polite. Our rules are strict. We'll clean your room right now.
