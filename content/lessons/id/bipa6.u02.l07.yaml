schema: kabar.lesson/v1
id: bipa6.u02.l07
language: id
title: Puisi senja di Siak
can_do:
  ar_eg: 'تقرا قصيدة عن الغروب على نهر سياك وتفهم صورها: الشمس والأفق والفراشة.'
  ar: 'أن تقرأ قصيدة عن الغروب على نهر سياك وتفهم صورها: الشمس والأفق والفراشة.'
  en: 'Read a sunset poem on the Siak river and get its images: sun, horizon, butterfly.'
slides:
  - title: Kata-kata puisi
    body:
      ar_eg: |
        الشعر بيحب كلمات أرقى من الكلام العادي:
        mentari = الشمس (بدل matahari). petang = العصرية، آخر النهار. cakrawala = الأفق.
        berkilau = بيلمع. bertiup = (الريح) بتهب.
        kelopak = بتلة الوردة (kelopak bunga)، وكمان جفن العين (kelopak mata). layu = دبلان.
        kupu-kupu = فراشة.
      ar: |
        يحبّ الشعر كلماتٍ أرقى من لغة الحديث:
        mentari = الشمس (بدل matahari). petang = العصر، آخر النهار. cakrawala = الأفق.
        berkilau = يتلألأ. bertiup = تهبّ (الريح).
        kelopak = بتلة الزهرة (kelopak bunga)، وجفن العين أيضًا (kelopak mata). layu = ذابل.
        kupu-kupu = فراشة.
      en: |
        Poetry likes words a step above everyday speech:
        mentari = sun (instead of matahari). petang = late afternoon. cakrawala = horizon.
        berkilau = to glitter. bertiup = (wind) to blow.
        kelopak = petal (kelopak bunga), also eyelid (kelopak mata). layu = withered.
        kupu-kupu = butterfly.
    examples:
      - text: Mentari petang tenggelam di cakrawala.
        ar_eg: شمس العصرية بتغرق في الأفق.
        ar: تغرب شمس العصر في الأفق.
        en: The late sun sinks into the horizon.
      - text: Sungai Siak berkilau, angin bertiup pelan.
        ar_eg: نهر سياك بيلمع، والريح بتهب بالراحة.
        ar: يتلألأ نهر سياك، وتهبّ الريح بهدوء.
        en: The Siak river glitters; the wind blows softly.
      - text: Seekor kupu-kupu hinggap di kelopak yang layu.
        ar_eg: فراشة وقفت على بتلة دبلانة.
        ar: حطّت فراشة على بتلة ذابلة.
        en: A butterfly lands on a withered petal.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mentari
        ar_eg: الشمس (في الشعر)
        ar: الشمس
        en: sun (poetic)
      - text: petang
        ar_eg: العصرية
        ar: العصر
        en: late afternoon
      - text: cakrawala
        ar_eg: الأفق
        ar: الأفق
        en: horizon
      - text: berkilau
        ar_eg: بيلمع
        ar: يتلألأ
        en: to glitter
    words: [mentari, petang, cakrawala, berkilau]
  - id: e02
    type: match_pairs
    pairs:
      - text: bertiup
        ar_eg: بتهب
        ar: تهبّ
        en: to blow (wind)
      - text: kelopak
        ar_eg: بتلة؛ جفن
        ar: بتلة؛ جفن
        en: petal; eyelid
      - text: layu
        ar_eg: دبلان
        ar: ذابل
        en: withered
      - text: kupu-kupu
        ar_eg: فراشة
        ar: فراشة
        en: butterfly
    words: [bertiup, kelopak, layu, kupu-kupu]
  - id: e03
    type: listen
    text: Bunga di meja itu sudah layu karena lupa disiram.
    question:
      ar_eg: الوردة مالها؟
      ar: ما حال الزهرة؟
      en: What's wrong with the flower?
    options: [دبلانة, بتلمع, فراشة]
    answer: 0
    meaning:
      ar_eg: الوردة اللي على الترابيزة دبلت عشان نسينا نسقيها.
      ar: ذبلت الزهرة على الطاولة لأننا نسينا سقيها.
      en: The flower on the table has withered; we forgot to water it.
    words: [layu]
  - id: e04
    type: fill_blank
    sentence: Angin laut ___ kencang sore ini.
    meaning:
      ar_eg: ريح البحر ___ جامد العصر ده.
      ar: ___ ريح البحر بقوة هذا المساء.
      en: The sea wind is ___ hard this afternoon.
    options: [bertiup, berkilau, layu]
    answers: [bertiup]
    words: [bertiup, berkilau, layu]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الخط اللي السما بتقابل فيه الأرض أو البحر اسمه إيه؟
      ar: ما اسم الخط الذي تلتقي فيه السماء بالأرض أو البحر؟
      en: What's the line where the sky meets land or sea?
    options: [kelopak, cakrawala, petang]
    answer: 1
    explain:
      ar_eg: cakrawala = الأفق، كلمة أصلها سنسكريتي.
      ar: cakrawala = الأفق، وأصلها سنسكريتي.
      en: cakrawala = horizon, a Sanskrit-origin word.
    words: [cakrawala, kelopak, petang]
  - id: e06
    type: fill_blank
    sentence: Dalam puisi, matahari sering disebut ___.
    meaning:
      ar_eg: في الشعر، الشمس كتير بيسموها ___.
      ar: في الشعر كثيرًا ما تُسمّى الشمس ___.
      en: In poetry the sun is often called ___.
    options: [mentari, kupu-kupu, cakrawala]
    answers: [mentari]
    words: [mentari, kupu-kupu, cakrawala]
  - id: e07
    type: multiple_choice
    question: Mawar itu punya lima ___ merah.
    options: [kupu-kupu, petang, kelopak]
    answer: 2
    explain:
      ar_eg: 'الوردة ليها بتلات: kelopak.'
      ar: 'للوردة بتلات: kelopak.'
      en: 'A rose has petals: kelopak.'
    words: [kelopak, kupu-kupu, petang]
  - id: e08
    type: build_sentence
    source:
      ar_eg: شمس العصرية بتلمع زي الدهب على النهر.
      ar: تتلألأ شمس العصر كالذهب على النهر.
      en: The late sun glitters like gold on the river.
    answer: Mentari petang berkilau seperti emas di sungai.
    distractors: [layu, bertiup]
    words: [mentari, petang, berkilau]
  - id: e09
    type: translate
    direction: from_target
    source_text: Pada waktu petang, kupu-kupu terbang ke cakrawala.
    answers_meaning:
      ar_eg: [العصرية، الفراشات بتطير ناحية الأفق, وقت العصر الفراشة طارت للأفق]
      ar: [في العصر تطير الفراشات نحو الأفق, عند المساء طارت الفراشة إلى الأفق]
      en: ['In the late afternoon, butterflies fly to the horizon', At dusk a butterfly flew towards the horizon]
    words: [petang, kupu-kupu, cakrawala]
  - id: e10
    type: speaking
    text: Angin bertiup, dan kelopak bunga yang layu jatuh ke sungai.
    meaning:
      ar_eg: الريح بتهب، وبتلات الوردة الدبلانة بتقع في النهر.
      ar: تهبّ الريح فتسقط بتلات الزهرة الذابلة في النهر.
      en: The wind blows, and the withered petals fall into the river.
    words: [bertiup, kelopak, layu]
dialogue:
  lines:
    - speaker: Encik Zul
      text: 'Mohamed, dengar bait ini: ''Mentari petang jatuh ke cakrawala.'''
      ar_eg: 'يا محمد، اسمع البيت ده: ''شمس العصرية وقعت في الأفق.'''
      ar: 'يا محمد، اسمع هذا البيت: ''سقطت شمس العصر في الأفق.'''
      en: 'Mohamed, listen to this verse: ''The late sun falls into the horizon.'''
    - speaker: Mohamed
      text: Indah, Encik. Kenapa bukan 'matahari'?
      ar_eg: حلو يا أستاذ. ليه مش 'matahari'؟
      ar: جميل يا أستاذ. لماذا لا يقول 'matahari'؟
      en: Lovely, Encik. Why not 'matahari'?
    - speaker: Encik Zul
      text: '''Mentari'' lebih puitis. Lalu: ''Sungai berkilau, angin bertiup.'''
      ar_eg: '''Mentari'' أشعر. وبعدين: ''النهر بيلمع، والريح بتهب.'''
      ar: '''Mentari'' أكثر شاعرية. ثم: ''يتلألأ النهر، وتهبّ الريح.'''
      en: '''Mentari'' is more poetic. Then: ''The river glitters, the wind blows.'''
    - speaker: Mohamed
      text: Dan bunga yang layu itu tentang umur, ya?
      ar_eg: والوردة الدبلانة دي عن العمر، صح؟
      ar: والزهرة الذابلة تعني العمر، أليس كذلك؟
      en: And the withered flower is about age, right?
    - speaker: Encik Zul
      text: Tepat. Tapi kupu-kupu masih datang. Harapan tetap ada.
      ar_eg: بالظبط. بس الفراشة لسه بتيجي. لسه فيه أمل.
      ar: تمامًا. لكن الفراشة ما زالت تأتي. ما زال هناك أمل.
      en: Exactly. But the butterfly still comes. There's still hope.
