        ar: ٥ خمسة
        en: 5 five
      - text: tujuh
        ar_eg: ٧ سبعة
        ar: ٧ سبعة
        en: 7 seven
      - text: sepuluh
        ar_eg: ١٠ عشرة
        ar: ١٠ عشرة
        en: 10 ten
    words: [satu, empat, lima, tujuh, sepuluh]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول ٨؟
      ar: كيف تقول ٨؟
      en: How do you say 8?
    options: [enam, delapan, sembilan]
