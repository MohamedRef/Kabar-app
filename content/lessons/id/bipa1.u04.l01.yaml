schema: kabar.lesson/v1
id: bipa1.u04.l01
language: id
title: Satu, dua, tiga
can_do:
  ar_eg: تعدّ وتقول الأسعار.
  ar: أن تعدّ وتذكر الأسعار.
  en: Count and say prices.
slides:
  - title: Nol sampai sepuluh
    body:
      ar_eg: |
        احفظ دول بس، والباقي كله بيتبني منهم:
        0 nol · 1 satu · 2 dua · 3 tiga · 4 empat · 5 lima
        6 enam · 7 tujuh · 8 delapan · 9 sembilan · 10 sepuluh
      ar: |
        احفظ هذه فقط، فكل ما بعدها يُبنى منها:
        0 nol · 1 satu · 2 dua · 3 tiga · 4 empat · 5 lima
        6 enam · 7 tujuh · 8 delapan · 9 sembilan · 10 sepuluh
      en: |
        Learn just these; everything else is built from them:
        0 nol · 1 satu · 2 dua · 3 tiga · 4 empat · 5 lima
        6 enam · 7 tujuh · 8 delapan · 9 sembilan · 10 sepuluh
    grammar: id.number.cardinal
    examples:
      - text: satu, dua, tiga, empat, lima
        ar_eg: واحد، اتنين، تلاتة، أربعة، خمسة
        ar: واحد، اثنان، ثلاثة، أربعة، خمسة
        en: one, two, three, four, five
  - title: Belas dan puluh
    body:
      ar_eg: |
        - من ١١ لـ ١٩: الرقم + belas (زي «عشر» في «اتناشر»): dua belas = 12، tujuh belas = 17.
        - العشرات: الرقم + puluh: dua puluh = 20، dua puluh lima = 25.
        - «واحد» قبلهم بتبقى se-: sebelas = 11، sepuluh = 10.
      ar: |
        - من ١١ إلى ١٩: العدد + belas (كـ«عشر» في «اثنا عشر»): dua belas = 12، tujuh belas = 17.
        - العشرات: العدد + puluh: dua puluh = 20، dua puluh lima = 25.
        - و«واحد» قبلها يصير se-: sebelas = 11، sepuluh = 10.
      en: |
        - 11–19: number + belas (like Arabic «عشر» in «اثنا عشر»): dua belas = 12, tujuh belas = 17.
        - Tens: number + puluh: dua puluh = 20, dua puluh lima = 25.
        - "One" before them becomes se-: sebelas = 11, sepuluh = 10.
    grammar: id.number.cardinal
    examples:
      - text: lima belas
        ar_eg: خمستاشر (15)
        ar: خمسة عشر (15)
        en: fifteen (15)
      - text: tiga puluh delapan
        ar_eg: تمانية وتلاتين (38)
        ar: ثمانية وثلاثون (38)
        en: thirty-eight (38)
  - title: Ratus, ribu, juta
    body:
      ar_eg: |
        - ratus = مية، ribu = ألف، juta = مليون.
        - ومع «واحد» برضه se-: seratus = 100، seribu = 1000، sejuta = مليون. («satu ratus» غلط.)
        - الترتيب من الكبير للصغير زي العربي: dua ratus lima puluh ribu = 250,000.
      ar: |
        - ratus = مئة، ribu = ألف، juta = مليون.
        - ومع «واحد» تُستعمل se- أيضًا: seratus = 100، seribu = 1000، sejuta = مليون. («satu ratus» خطأ.)
        - ويُقرأ العدد من الأكبر إلى الأصغر: dua ratus lima puluh ribu = 250,000.
      en: |
        - ratus = hundred, ribu = thousand, juta = million.
        - With "one", se- again: seratus = 100, seribu = 1,000, sejuta = 1,000,000. ("satu ratus" is wrong.)
        - Big to small, as in Arabic: dua ratus lima puluh ribu = 250,000.
    grammar: id.number.cardinal
    examples:
      - text: seratus dua puluh ribu
        ar_eg: مية وعشرين ألف (120,000)
        ar: مئة وعشرون ألفًا (120,000)
        en: one hundred twenty thousand (120,000)
  - title: Berapa harganya?
    body:
      ar_eg: |
        في السوق: «Berapa harganya?» = «بكام؟».
        في الكتابة الإندونيسية النقطة بتفصل الآلاف: Rp25.000 = dua puluh lima ribu rupiah (٢٥ ألف).
        وفي السوق كتير بيشيلوا «ribu»: «lima belas» يعني ١٥ ألف.
        ورقم الموبايل بيتقال رقم رقم: 0812 = nol delapan satu dua.
      ar: |
        في السوق: «Berapa harganya?» = «بكم هذا؟».
        وفي الكتابة الإندونيسية تفصل النقطة بين الآلاف: Rp25.000 = dua puluh lima ribu rupiah (خمسة وعشرون ألفًا).
        وكثيرًا ما تُحذف «ribu» في السوق: «lima belas» تعني خمسة عشر ألفًا.
        ورقم الهاتف يُقرأ رقمًا رقمًا: 0812 = nol delapan satu dua.
      en: |
        At the market: "Berapa harganya?" = "How much is it?"
        In writing, a dot separates thousands: Rp25.000 = dua puluh lima ribu rupiah (25,000).
        Market talk often drops ribu: "lima belas" means 15,000.
        Phone numbers are read digit by digit: 0812 = nol delapan satu dua.
    grammar: id.number.cardinal
    examples:
      - text: Berapa harganya, Bu? — Dua puluh lima ribu.
        ar_eg: بكام يا حاجة؟ — خمسة وعشرين ألف.
        ar: بكم هذا يا سيدتي؟ — خمسة وعشرون ألفًا.
        en: How much is it, ma'am? — Twenty-five thousand.
      - text: Kain ini murah!
        ar_eg: القماش ده رخيص!
        ar: هذا القماش رخيص!
        en: This fabric is cheap!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: lima
        ar_eg: خمسة
        ar: خمسة
        en: five
      - text: sepuluh
        ar_eg: عشرة
        ar: عشرة
        en: ten
      - text: sebelas
        ar_eg: حداشر
        ar: أحد عشر
        en: eleven
      - text: dua puluh
        ar_eg: عشرين
        ar: عشرون
        en: twenty
      - text: seratus
        ar_eg: مية
        ar: مئة
        en: one hundred
    words: [lima, sepuluh, sebelas, puluh, seratus]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول ١٢؟
      ar: كيف تقول ١٢؟
      en: How do you say 12?
    options: ["dua belas", "dua puluh", "sebelas"]
    answer: 0
    explain:
      ar_eg: ١١–١٩ = رقم + belas. dua puluh = ٢٠.
      ar: من ١١ إلى ١٩ = عدد + belas، وdua puluh = ٢٠.
      en: 11–19 = number + belas; dua puluh = 20.
    words: [dua, belas]
  - id: e03
    type: multiple_choice
    question: Rp50.000
    question_meaning:
      ar_eg: إزاي تقرا السعر ده؟
      ar: كيف تقرأ هذا السعر؟
      en: How do you read this price?
    options: ["lima ribu", "lima ratus ribu", "lima puluh ribu"]
    answer: 2
    explain:
      ar_eg: النقطة بتفصل الآلاف، يعني ٥٠ ألف.
      ar: النقطة تفصل الآلاف، فهو خمسون ألفًا.
      en: The dot separates thousands, so it's 50,000.
    words: [lima, puluh, ribu]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول ١٠٠؟
      ar: كيف تقول ١٠٠؟
      en: How do you say 100?
    options: ["satu ratus", "seratus", "sepuluh"]
    answer: 1
    explain:
      ar_eg: «واحد» قبل ratus بتبقى se-، يعني seratus. وsepuluh = ١٠.
      ar: «واحد» قبل ratus يصير se-، فهي seratus، وsepuluh = ١٠.
      en: '"One" before ratus becomes se-, so seratus; sepuluh is 10.'
    words: [seratus]
  - id: e05
    type: listen
    text: tiga puluh lima ribu
    options: ["tiga puluh ribu", "tiga puluh lima ribu", "tiga ratus lima ribu"]
    answer: 1
    words: [tiga, puluh, lima, ribu]
  - id: e06
    type: fill_blank
    sentence: Rp15.000 = lima ___ ribu
    meaning:
      ar_eg: ١٥ ألف روبية
      ar: خمسة عشر ألف روبية
      en: 15,000 rupiah
    options: ["puluh", "ratus", "belas"]
    answers: [belas]
    words: [belas]
  - id: e07
    type: fill_blank
    sentence: Rp1.000 = ___ rupiah
    meaning:
      ar_eg: ألف روبية
      ar: ألف روبية
      en: one thousand rupiah
    answers: [seribu]
    explain:
      ar_eg: «ألف واحد» = seribu، مش satu ribu.
      ar: الألف الواحد = seribu لا satu ribu.
      en: One thousand = seribu, not satu ribu.
    words: [seribu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: القميص ده بكام؟
      ar: بكم هذا القميص؟
      en: How much is this shirt?
    answer: Berapa harga baju ini?
    distractors: [apa, itu]
    explain:
      ar_eg: السعر رقم، فبنسأل بـ berapa مش apa.
      ar: السعر عدد، فيُسأل عنه بـ berapa لا apa.
      en: A price is a number, so you ask with berapa, not apa.
    words: [berapa, harga, baju]
  - id: e09
    type: build_sentence
    source:
      ar_eg: خمسة وعشرين ألف روبية.
      ar: خمسة وعشرون ألف روبية.
      en: Twenty-five thousand rupiah.
    answer: Dua puluh lima ribu rupiah.
    distractors: [belas, ratus]
    words: [puluh, ribu, rupiah]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اكتب بالحروف — ٧٥٬٠٠٠ روبية
      ar: اكتب بالحروف — ٧٥٬٠٠٠ روبية
      en: Write in words — Rp75.000
    answers: ["tujuh puluh lima ribu rupiah", "Tujuh puluh lima ribu rupiah.", "tujuh puluh lima ribu", "Tujuh puluh lima ribu."]
    words: [tujuh, puluh, lima, ribu]
  - id: e11
    type: translate
    direction: from_target
    source_text: Harganya seratus dua puluh ribu.
    answers_meaning:
      ar_eg: ["سعره مية وعشرين ألف.", "بمية وعشرين ألف", "تمنه ١٢٠ ألف"]
      ar: ["سعره مئة وعشرون ألفًا.", "ثمنه ١٢٠ ألفًا"]
      en: ["It costs 120,000.", "The price is one hundred twenty thousand", "It's 120,000"]
    words: [harga, seratus, puluh, ribu]
  - id: e12
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: القماش ده رخيص!
      ar: هذا القماش رخيص!
      en: This fabric is cheap!
    answers: ["Kain ini murah!", "Kain ini murah", "Kain ini murah."]
    words: [kain, murah]
  - id: e13
    type: dictation
    text: dua belas ribu lima ratus
    meaning:
      ar_eg: ١٢٬٥٠٠
      ar: ١٢٬٥٠٠
      en: 12,500
    words: [belas, ribu, ratus]
  - id: e14
    type: speaking
    text: Berapa harganya, Bu? — Lima puluh ribu.
    meaning:
      ar_eg: بكام يا حاجة؟ — خمسين ألف.
      ar: بكم هذا يا سيدتي؟ — خمسون ألفًا.
      en: How much is it, ma'am? — Fifty thousand.
    words: [berapa, harga, puluh, ribu]
dialogue:
  title: Di Pasar Tanah Abang
  lines:
    - speaker: Mohamed
      text: Permisi, Bu. Baju batik ini berapa harganya?
      ar_eg: لو سمحتي يا حاجة. قميص الباتيك ده بكام؟
      ar: من فضلكِ يا سيدتي. بكم قميص الباتيك هذا؟
      en: Excuse me, ma'am. How much is this batik shirt?
    - speaker: Bu Ani
      text: Seratus lima puluh ribu, Mas.
      ar_eg: مية وخمسين ألف.
      ar: مئة وخمسون ألفًا.
      en: A hundred and fifty thousand.
    - speaker: Mohamed
      text: Seratus lima puluh? Mahal, Bu!
      ar_eg: مية وخمسين؟ غالي يا حاجة!
      ar: مئة وخمسون؟ إنه غالٍ يا سيدتي!
      en: A hundred and fifty? That's expensive, ma'am!
    - speaker: Bu Ani
      text: Seratus dua puluh, ya?
      ar_eg: خلاص، مية وعشرين؟
      ar: مئة وعشرون، حسنًا؟
      en: A hundred and twenty, OK?
    - speaker: Mohamed
      text: Seratus ribu, Bu?
      ar_eg: مية ألف يا حاجة؟
      ar: مئة ألف يا سيدتي؟
      en: A hundred thousand, ma'am?
    - speaker: Bu Ani
      text: Baik, seratus ribu. Terima kasih, Mas!
      ar_eg: ماشي، مية ألف. شكرًا!
      ar: حسنًا، مئة ألف. شكرًا!
      en: All right, a hundred thousand. Thank you!
