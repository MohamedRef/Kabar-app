schema: kabar.lesson/v1
id: bipa1.u04.l01
language: id
title: Satu, dua, tiga
can_do:
  ar_eg: تعد من واحد لعشرة.
  ar: أن تعدّ من واحد إلى عشرة.
  en: Count from one to ten.
slides:
  - title: Nol sampai sepuluh
    body:
      ar_eg: |
        احفظ دول بس، والباقي كله بيتبني منهم:
        0 nol · 1 satu · 2 dua · 3 tiga · 4 empat · 5 lima
        6 enam · 7 tujuh · 8 delapan · 9 sembilan · 10 sepuluh
      ar: |
        احفظ هذه فقط، فكل ما بعدها يُبنى منها:
        0 nol · 1 satu · 2 dua · 3 tiga · 4 empat · 5 lima
        6 enam · 7 tujuh · 8 delapan · 9 sembilan · 10 sepuluh
      en: |
        Learn just these; everything else is built from them:
        0 nol · 1 satu · 2 dua · 3 tiga · 4 empat · 5 lima
        6 enam · 7 tujuh · 8 delapan · 9 sembilan · 10 sepuluh
    grammar: id.number.cardinal
    examples:
      - text: satu, dua, tiga, empat, lima
        ar_eg: واحد، اتنين، تلاتة، أربعة، خمسة
        ar: واحد، اثنان، ثلاثة، أربعة، خمسة
        en: one, two, three, four, five
