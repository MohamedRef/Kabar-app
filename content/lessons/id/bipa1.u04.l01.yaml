dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kamu punya adik?
      ar_eg: محمد، عندك إخوات صغيرين؟
      ar: محمد، هل لديك إخوة أصغر منك؟
      en: Mohamed, do you have younger siblings?
    - speaker: Mohamed
      text: Ya, saya punya empat adik!
      ar_eg: أيوه، عندي أربعة!
      ar: نعم، لديّ أربعة!
      en: Yes, I have four younger siblings!
    - speaker: Rina
      text: Empat? Wah! Saya punya satu kakak.
      ar_eg: أربعة؟ واو! أنا عندي أخت كبيرة واحدة.
      ar: أربعة؟ رائع! لديّ أخت كبرى واحدة.
      en: Four? Wow! I have one older sister.
    - speaker: Mohamed
      text: 'Keluarga saya besar: delapan orang!'
      ar_eg: 'عيلتي كبيرة: تمانية أفراد!'
      ar: 'عائلتي كبيرة: ثمانية أشخاص!'
      en: 'My family is big: eight people!'
