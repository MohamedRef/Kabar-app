id: bipa5.u05.l04
language: id
title: Gambut dan kabut asap
can_do:
  ar_eg: تشرح ليه أرض الخث في كاليمانتان بتولع وإزاي الدخان بيأذي الناس.
  ar: أن تشرح لماذا تحترق أراضي الخثّ في كاليمانتان وكيف يؤذي الدخان الناس.
  en: Explain why Borneo's peatland burns and how the haze harms people.
slides:
  - title: Kabut asap
    body:
      ar_eg: |
        الخث (gambut) أرض مليانة مية وبقايا شجر. لما بيصرفوا منها المية بقنوات عشان الزراعة، بتنشف وتولع بسهولة.
        - membuka lahan = يجهّز أرض جديدة للزراعة. والحرق ممنوع قانونًا، إلا لقطع صغيرة للعيلة حسب العرف (لحد ٢ هكتار).
        - pembakaran = الحرق (اسم من membakar)
        - kabut asap = ضباب الدخان، وفي ٢٠١٥ وصل لسنغافورة وماليزيا
        - gangguan pernapasan = مشاكل في التنفس
        - sekat kanal = سد في القناة بيحجز المية، فالخث يفضل مبلول ومايولعش
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: kayaknya = sepertinya، aja = saja، nyebabin = menyebabkan، makanya = karena itu، bikin = membuat، nggak = tidak.
      ar: |
        الخثّ (gambut) أرض مشبعة بالماء وبقايا الأشجار. فإذا جُفّفت بقنوات للزراعة، يبست وسهل اشتعالها.
        - membuka lahan = يستصلح أرضًا جديدة للزراعة، والاستصلاح بالحرق ممنوع قانونًا، إلا في قطع عائلية صغيرة وفق العرف المحلي (حتى هكتارين).
        - pembakaran = الحرق (اسم من membakar)
        - kabut asap = ضباب الدخان، وقد بلغ سنغافورة وماليزيا عام ٢٠١٥
        - gangguan pernapasan = اضطرابات التنفّس
        - sekat kanal = سدّ في القناة يحبس الماء، فيبقى الخثّ رطبًا عصيًّا على الاشتعال
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: kayaknya = sepertinya، aja = saja، nyebabin = menyebabkan، makanya = karena itu، bikin = membuat، nggak = tidak.
      en: |
        Peat (gambut) is waterlogged ground full of old plant matter. Drain it with canals for farming and it dries out and catches fire easily.
        - membuka lahan = to clear new land for farming; clearing by fire is banned, except small family plots under local custom (max 2 ha).
        - pembakaran = burning (noun from membakar)
        - kabut asap = haze; in 2015 it reached Singapore and Malaysia
        - gangguan pernapasan = breathing problems
        - sekat kanal = a canal block that holds the water in, so the peat stays wet and won't burn
        The dialogue uses street forms; the formal ones are beside them: kayaknya = sepertinya, aja = saja, nyebabin = menyebabkan, makanya = karena itu, bikin = membuat, nggak = tidak.
    examples:
      - text: Kabut asap menyebabkan sekolah-sekolah ditutup.
        ar_eg: الدخان خلّى المدارس تقفل.
        ar: تسبّب ضباب الدخان في إغلاق المدارس.
        en: The haze caused schools to close.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kabut asap
        ar_eg: ضباب الدخان
        ar: ضباب الدخان
        en: haze
      - text: pembakaran
        ar_eg: الحرق
        ar: الحرق
        en: burning
      - text: gangguan pernapasan
        ar_eg: مشاكل في التنفس
        ar: اضطرابات التنفّس
        en: breathing problems
      - text: sekat kanal
        ar_eg: سد في القناة
        ar: سدّ القناة
        en: canal block
      - text: membuka lahan
        ar_eg: يجهّز أرض للزراعة
        ar: يستصلح أرضًا
        en: to clear land
    words: [kabut asap, pembakaran, gangguan pernapasan, sekat kanal, membuka lahan, lahan]
  - id: e02
    type: listen
    text: Pada tahun 2015, kabut asap dari Kalimantan sampai ke Singapura dan Malaysia.
    question:
      ar_eg: الدخان وصل لحد فين؟
      ar: إلى أين وصل الدخان؟
      en: How far did the haze reach?
    options:
      - جاوة بس.
      - سنغافورة وماليزيا.
      - أستراليا.
    answer: 1
    words: [kabut asap]
  - id: e03
    type: fill_blank
    sentence: Dilarang membuka lahan dengan ___ hutan.
    meaning:
      ar_eg: ممنوع تجهيز أرض بحرق الغابة.
      ar: يُمنع استصلاح الأرض بحرق الغابة.
      en: Clearing land by burning forest is forbidden.
    options: [pembakaran, sekat kanal, kabut asap]
    answers: [pembakaran]
    words: [pembakaran, membuka lahan, lahan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الـ sekat kanal فايدته إيه؟
      ar: ما فائدة sekat kanal؟
      en: What is a sekat kanal for?
    options:
      - بيصرف المية من الخث.
      - بيبني طريق جديد.
      - بيحجز المية فالخث يفضل مبلول وصعب يولع.
    answer: 2
    explain:
      ar_eg: sekat = حاجز، kanal = قناة. القنوات بتنشّف الخث، والسد بيرجّع المية.
      ar: sekat = حاجز، وkanal = قناة. القنوات تجفّف الخثّ، والسدّ يعيد إليه الماء.
      en: sekat = barrier, kanal = canal. Canals drain peat; the block keeps the water in.
    words: [sekat kanal, gambut]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الدخان بيعمل مشاكل في التنفس للأطفال.
      ar: يسبّب ضباب الدخان اضطرابات تنفّسية لدى الأطفال.
      en: The haze causes breathing problems in children.
    answer: Kabut asap menyebabkan gangguan pernapasan pada anak-anak.
    distractors: [sekat, lahan]
    words: [kabut asap, gangguan pernapasan]
  - id: e06
    type: translate
    direction: from_target
    source_text: Perusahaan itu membuka lahan baru untuk kebun sawit.
    answers_meaning:
      ar_eg:
        - الشركة دي جهّزت أرض جديدة لمزرعة نخل زيت.
        - الشركة فتحت أرض جديدة عشان تزرع نخيل زيت.
      ar:
        - استصلحت تلك الشركة أرضًا جديدة لمزرعة نخيل الزيت.
        - فتحت الشركة أرضًا جديدة لزراعة نخيل الزيت.
      en:
        - That company cleared new land for an oil-palm plantation.
        - The company opened up new land for oil palm.
    words: [membuka lahan, sawit, lahan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «Banyak warga terkena gangguan pernapasan.» معناها إيه؟
      ar: ما معنى «Banyak warga terkena gangguan pernapasan.»؟
      en: What does "Banyak warga terkena gangguan pernapasan." mean?
    options:
      - ناس كتير جالها مشاكل في التنفس.
      - ناس كتير نقلت من المنطقة.
      - ناس كتير خسرت شغلها.
    answer: 0
    words: [gangguan pernapasan]
  - id: e08
    type: speaking
    text: Sekat kanal membuat lahan gambut tetap basah.
    meaning:
      ar_eg: سد القناة بيخلي أرض الخث تفضل مبلولة.
      ar: يُبقي سدُّ القناة أرضَ الخثّ رطبة.
      en: Canal blocks keep peatland wet.
    words: [sekat kanal, gambut]
  - id: e09
    type: dictation
    text: Pembakaran hutan menyebabkan kabut asap yang tebal.
    meaning:
      ar_eg: حرق الغابات بيعمل دخان تقيل.
      ar: يسبّب حرق الغابات ضباب دخان كثيفًا.
      en: Forest burning causes thick haze.
    words: [pembakaran, kabut asap]
  - id: e10
    type: fill_blank
    sentence: Pada musim kemarau, banyak sekolah ditutup karena ___.
    meaning:
      ar_eg: في موسم الجفاف، مدارس كتير بتقفل بسبب الدخان.
      ar: في موسم الجفاف تُغلق مدارس كثيرة بسبب ضباب الدخان.
      en: In the dry season, many schools close because of the haze.
    options: [kabut asap, sekat kanal, membuka lahan]
    answers: [kabut asap]
    words: [kabut asap, kemarau]
dialogue:
  title: Di atas perahu klotok
  lines:
    - speaker: Mohamed
      text: Mas, udaranya bau asap. Ada pembakaran lagi, ya?
      ar_eg: يا ريزال، الجو ريحته دخان. فيه حرق تاني؟
      ar: يا ريزال، في الهواء رائحة دخان. هل هناك حرق من جديد؟
      en: Mas, the air smells of smoke. Is there burning again?
    - speaker: Mas Rizal
      text: Kayaknya ada yang buka lahan di seberang sungai. Itu dilarang, tapi masih aja terjadi.
      ar_eg: يمكن حد بيجهّز أرض الناحية التانية من النهر. ده ممنوع، بس لسه بيحصل.
      ar: ربما يستصلح أحدهم أرضًا على الضفّة الأخرى. هذا ممنوع، لكنه ما زال يحدث.
      en: Maybe someone's clearing land across the river. It's illegal, but it still happens.
    - speaker: Mohamed
      text: Kasihan anak-anak di desa. Kabut asap bisa nyebabin gangguan pernapasan.
      ar_eg: يا حرام ولاد القرية. الدخان ممكن يعملهم مشاكل في التنفس.
      ar: مساكين أطفال القرية، فضباب الدخان قد يسبّب لهم اضطرابات تنفّسية.
      en: Poor village kids. The haze can cause breathing problems.
    - speaker: Mas Rizal
      text: Makanya warga bikin sekat kanal. Gambut yang basah nggak gampang terbakar.
      ar_eg: عشان كده الأهالي بيبنوا سدود في القنوات. الخث المبلول مش بيولع بسهولة.
      ar: لذلك يبني الأهالي سدودًا في القنوات، فالخثّ الرطب لا يحترق بسهولة.
      en: That's why villagers build canal blocks. Wet peat doesn't burn easily.
