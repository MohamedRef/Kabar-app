schema: kabar.lesson/v1
id: bipa2.u10.l04
language: id
title: Semoga cepat sembuh
can_do:
  ar_eg: تتمنى لحد الشفا وتنصحه يرتاح.
  ar: أن تتمنى الشفاء لغيرك وتقترح عليه الراحة.
  en: Wish well and suggest rest.
slides:
  - title: Semoga cepat sembuh
    body:
      ar_eg: |
        semoga = يا رب / إن شاء الله (في الأمنية). بتيجي في أول الجملة.
        Semoga cepat sembuh = ألف سلامة / ربنا يشفيك (حرفيًا: يا رب تخف بسرعة). sembuh = يخف، يشفى.
        خلي بالك: «Saya semoga lulus» غلط، الصح «Semoga saya lulus».
        في الشارع بيقولوا:
        - udah = sudah (خلاص، بقى)
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
        - makasih = terima kasih (متشكر)
      ar: |
        semoga = عسى / أرجو أن، وتتصدر الجملة.
        Semoga cepat sembuh = شفاك الله سريعًا (حرفيًا: عسى أن تُشفى سريعًا)، وsembuh = يُشفى.
        وانتبه: «Saya semoga lulus» خطأ، والصواب «Semoga saya lulus».
        في كلام الشارع:
        - udah = sudah (قد، بالفعل)
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
        - makasih = terima kasih (شكرًا)
      en: |
        semoga = may… / I hope — it opens the sentence.
        Semoga cepat sembuh = get well soon (literally "may you heal quickly"); sembuh = recover.
        Careful: "Saya semoga lulus" is wrong; say "Semoga saya lulus".
        On the street:
        - udah = sudah (already)
        - banget = sekali (very), after the adjective just like sekali
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
        - makasih = terima kasih (thanks)
    grammar: id.hope.semoga
    examples:
      - text: Semoga cepat sembuh, ya!
        ar_eg: ألف سلامة عليك!
        ar: شفاك الله سريعًا!
        en: Get well soon!
      - text: Semoga saya lulus.
        ar_eg: يا رب أنجح.
        ar: أرجو أن أنجح.
        en: I hope I pass.
  - title: Mudah-mudahan, insya Allah, amin
    body:
      ar_eg: |
        - mudah-mudahan = نفس معنى semoga، وأكتر في الكلام: Mudah-mudahan besok tidak hujan = يا رب بكرة ماتمطرش.
        - insya Allah = إن شاء الله، بنفس المعنى (وأحيانًا بنفس التهرّب المصري!).
        - الرد على الدعاء: Amin / Aamiin = آمين. وAlhamdulillah = الحمد لله، زي عندنا بالظبط.
        هتحس إنك في البيت!
      ar: |
        - mudah-mudahan بمعنى semoga، وأشيع في الحديث: Mudah-mudahan besok tidak hujan.
        - insya Allah = إن شاء الله.
        - ويُرد على الدعاء بـ Amin / Aamiin = آمين، وتقال Alhamdulillah = الحمد لله كما في العربية.
      en: |
        - mudah-mudahan = same as semoga, very common in speech: Mudah-mudahan besok tidak hujan.
        - insya Allah = God willing (with the same range of meanings as in Egypt!).
        - Reply to a wish with Amin / Aamiin; Alhamdulillah works exactly as in Arabic.
    grammar: id.hope.semoga
    examples:
      - text: Mudah-mudahan kita bisa bertemu lagi.
        ar_eg: يا رب نتقابل تاني.
        ar: عسى أن نلتقي مرة أخرى.
        en: Hopefully we can meet again.
      - text: Besok kamu datang? — Insya Allah.
        ar_eg: جاي بكرة؟ — إن شاء الله.
        ar: هل ستأتي غدًا؟ — إن شاء الله.
        en: Are you coming tomorrow? — God willing.
  - title: Semoga sukses! Semoga lancar!
    body:
      ar_eg: |
        أمنيات جاهزة:
        - Semoga sukses! = بالتوفيق!
        - Semoga lancar! = ربنا يسهّل!
        - Semoga betah! = يا رب تتبسط هنا (في مكان جديد).
      ar: |
        عبارات جاهزة:
        - Semoga sukses! = بالتوفيق!
        - Semoga lancar! = يسّر الله أمرك!
        - Semoga betah! = أرجو أن ترتاح في مكانك الجديد.
      en: |
        Ready-made wishes:
        - Semoga sukses! = good luck!
        - Semoga lancar! = hope it goes smoothly!
        - Semoga betah! = hope you feel at home (in a new place).
    grammar: id.hope.semoga
    examples:
      - text: Semoga sukses ujiannya! — Aamiin, terima kasih.
        ar_eg: بالتوفيق في الامتحان! — يا رب، شكرًا.
        ar: بالتوفيق في الامتحان! — آمين، شكرًا.
        en: Good luck with the exam! — Amen, thank you.
  - title: Ayo, istirahat dulu!
    body:
      ar_eg: |
        عشان تنصح حد عيان، استخدم ayo (يلا) أو yuk (ألطف) أو mari (رسمية):
        - Ayo, istirahat dulu! = يلا ارتاح شوية!
        - Minum jamu, yuk! = يلا نشرب جامو!
        - Mari kita hidup sehat. = هيا نعيش حياة صحية (رسمي، زي الإعلانات).
        istirahat جاية من العربي «استراحة».
      ar: |
        لتنصح مريضًا استعمل ayo (هيّا) أو yuk (ألطف) أو mari (رسمية):
        - Ayo, istirahat dulu! = هيّا استرح قليلًا!
        - Minum jamu, yuk! = هيا نشرب الجامو!
        - Mari kita hidup sehat. = لنعش حياة صحية (رسمية كالإعلانات).
        وistirahat من العربية «استراحة».
      en: |
        To nudge someone who's ill, use ayo (come on), yuk (softer) or mari (formal):
        - Ayo, istirahat dulu! = Come on, get some rest!
        - Minum jamu, yuk! = Let's have some jamu!
        - Mari kita hidup sehat. = Let us live healthily (formal, like an ad).
        istirahat comes from Arabic «استراحة».
    grammar: id.invitation.ayo-mari
    examples:
      - text: Ayo, istirahat dulu supaya cepat sembuh.
        ar_eg: يلا ارتاح شوية عشان تخف بسرعة.
        ar: هيّا استرح قليلًا لتشفى سريعًا.
        en: Come on, get some rest so you get well soon.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mudah-mudahan
        ar_eg: يا رب / ياريت
        ar: عسى
        en: hopefully
      - text: insya Allah
        ar_eg: إن شاء الله
        ar: إن شاء الله
        en: God willing
      - text: amin
        ar_eg: آمين
        ar: آمين
        en: amen
      - text: alhamdulillah
        ar_eg: الحمد لله
        ar: الحمد لله
        en: praise God
      - text: lancar
        ar_eg: ماشي كويس، من غير مشاكل
        ar: بسلاسة
        en: smooth(ly)
      - text: jamu
        ar_eg: جامو (مشروب أعشاب)
        ar: جامو (شراب أعشاب)
        en: jamu (herbal tonic)
    words: [mudah-mudahan, insya Allah, amin, alhamdulillah, lancar, jamu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك عيان. تقوله إيه؟
      ar: صديقك مريض. ماذا تقول له؟
      en: Your friend is ill. What do you say?
    options: ['Semoga sukses, ya!', Selamat datang!, 'Semoga cepat sembuh, ya!']
    answer: 2
    words: [semoga, sembuh]
  - id: e03
    type: listen
    text: Mudah-mudahan besok tidak hujan.
    options: [Mudah-mudahan besok hujan., 'Alhamdulillah, besok tidak hujan.', Mudah-mudahan besok tidak hujan.]
    answer: 2
    words: [mudah-mudahan, alhamdulillah]
  - id: e04
    type: fill_blank
    sentence: Minum jamu, ___!
    meaning:
      ar_eg: يلا نشرب جامو!
      ar: هيا نشرب الجامو!
      en: Let's have some jamu!
    options: [amin, semoga, yuk]
    answers: [yuk]
    words: [yuk, jamu]
  - id: e05
    type: listen
    text: Alhamdulillah, perjalanannya lancar.
    options: ['Alhamdulillah, perjalanannya lancar.', 'Insya Allah, perjalanannya lancar.', 'Amin, perjalanannya lancar.']
    answer: 0
    meaning:
      ar_eg: الحمد لله، الرحلة عدّت على خير.
      ar: الحمد لله، مرّت الرحلة بسلاسة.
      en: Thank God, the trip went smoothly.
    words: [alhamdulillah, perjalanan, lancar, insya Allah, amin]
  - id: e06
    type: speaking
    text: Ayo, minum jamu dulu. Semoga cepat sembuh!
    meaning:
      ar_eg: يلا اشرب جامو الأول. ألف سلامة!
      ar: هيّا اشرب الجامو أولًا. أتمنى لك الشفاء العاجل!
      en: Come on, drink some jamu first. Get well soon!
    words: [ayo, jamu, semoga, sembuh]
  - id: e07
    type: multiple_choice
    question: Semoga cepat sembuh, ya!
    question_meaning:
      ar_eg: صاحبك قالك كده وإنت عيان. ترد بإيه؟
      ar: قال لك صديقك هذا وأنت مريض. بماذا تردّ؟
      en: Your friend says this while you're ill. How do you reply?
    options: ['Amin, terima kasih.', 'Mudah-mudahan lancar.', 'Insya Allah, sama-sama.']
    answer: 0
    explain:
      ar_eg: زي عندنا بالظبط، على الدعوة بترد «آمين».
      ar: كما عندنا تمامًا، يُردّ على الدعاء بـ«آمين».
      en: Just like in Arabic, you answer a good wish with "amin".
    words: [semoga, sembuh, amin, mudah-mudahan, lancar, insya Allah]
dialogue:
  title: Jamu dari Ni Luh
  lines:
    - speaker: Ni Luh
      text: Mohamed, masih pusing?
      ar_eg: يا محمد، لسه دايخ؟
      ar: يا محمد، هل ما زلت تشعر بالدوار؟
      en: Mohamed, still dizzy?
    - speaker: Mohamed
      text: Udah lebih baik, alhamdulillah.
      ar_eg: أحسن شوية، الحمد لله.
      ar: صرت أفضل، الحمد لله.
      en: Better now, alhamdulillah.
    - speaker: Ni Luh
      text: Ini jamu dari ibuku. Ayo, minum dulu!
      ar_eg: ده جامو من ماما. يلا اشربه!
      ar: هذا جامو من أمي. هيّا اشربه!
      en: This is jamu from my mum. Come on, drink it!
    - speaker: Mohamed
      text: Makasih. Wah, pahit banget!
      ar_eg: شكرًا. ياه، مر أوي!
      ar: شكرًا. يا إلهي، إنه مرّ جدًا!
      en: Thanks. Whoa, it's so bitter!
    - speaker: Ni Luh
      text: Pahit, tapi bagus untuk badan. Semoga cepat sembuh, ya!
      ar_eg: مر، بس مفيد للجسم. ألف سلامة عليك!
      ar: مرّ، لكنه مفيد للجسم. شفاك الله سريعًا!
      en: Bitter, but good for you. Get well soon!
    - speaker: Mohamed
      text: Amin. Mudah-mudahan besok kita bisa berenang lagi.
      ar_eg: آمين. يا رب نعرف نعوم تاني بكرة.
      ar: آمين. عسى أن نستطيع السباحة مرة أخرى غدًا.
      en: Amen. Hopefully we can go swimming again tomorrow.
