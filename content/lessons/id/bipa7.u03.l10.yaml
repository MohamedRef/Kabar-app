id: bipa7.u03.l10
language: id
title: Ulangan Unit 3
can_do:
  ar_eg: تكتب وتحكي حكاية فيها صور بلاغية ورسالة مستخبية.
  ar: أن تكتب حكاية وترويها بصور بلاغية ورسالة ضمنية.
  en: Write and tell a tale with figures of speech and a hidden message.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: paradoks
        ar_eg: تناقض ظاهري
        ar: مفارقة
        en: paradox
      - text: pendongeng
        ar_eg: حكّاء
        ar: حكّاء
        en: storyteller
      - text: mitos
        ar_eg: أسطورة
        ar: أسطورة
        en: myth
      - text: klimaks
        ar_eg: ذروة
        ar: ذروة
        en: climax
      - text: pesan moral
        ar_eg: العبرة
        ar: العبرة
        en: moral of the story
    words: [paradoks, pendongeng, mitos, klimaks, pesan moral]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Kaya miskin, tua muda, semua menangis.» ده أنهي مجاز؟
      ar: «Kaya miskin, tua muda, semua menangis.» أيّ مجاز هذا؟
      en: '"Kaya miskin, tua muda, semua menangis." Which figure is this?'
    options: [litotes, antitesis, metonimia]
    answer: 1
    words: [antitesis, litotes, metonimia]
  - id: e03
    type: fill_blank
    sentence: ___, pada zaman dahulu kala, hiduplah seorang putri di tepi sungai.
    meaning:
      ar_eg: يُحكى إنّ في قديم الزمان كانت فيه أميرة عايشة على شط النهر.
      ar: يُحكى أنّه في قديم الزمان عاشت أميرة على ضفّة النهر.
      en: Once, long, long ago, there lived a princess by the river.
    options: [Alkisah, Konteks, Keturunan]
    answers: [Alkisah]
    words: [alkisah, zaman dahulu kala, konteks, keturunan]
  - id: e04
    type: listen
    text: Telur ketujuh tidak menetas, dan itulah asal-usul batu keramat di Kali Raja.
    question:
      ar_eg: الحجر اللي في كالي راجا جه منين؟
      ar: من أين جاء الحجر في كالي راجا؟
      en: Where did the stone at Kali Raja come from?
    options:
      - من البيضة السابعة اللي ما فقستش.
      - من جبل بركاني.
      - من مركب غرقان.
    answer: 0
    words: [telur, menetas, asal-usul]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الحكّاء بنى التوتر لحد الذروة.
      ar: بنى الحكّاء التوتّر حتّى الذروة.
      en: The storyteller built the tension up to the climax.
    answer: Pendongeng itu membangun ketegangan sampai klimaks.
    distractors: [alegori, mitos]
    words: [ketegangan, klimaks]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: «Batang hidungnya tidak kelihatan» مثال على إيه؟
      ar: «Batang hidungnya tidak kelihatan» مثالٌ على ماذا؟
      en: '"Batang hidungnya tidak kelihatan" is an example of what?'
    options: [alegori, paradoks, sinekdoke]
    answer: 2
    words: [sinekdoke, alegori, kiasan, paradoks]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: جدّتي كانت بتحكي حواديت بترمز للصبر.
      ar: كانت جدّتي تروي حكايات ترمز إلى الصبر.
      en: My grandmother told tales that symbolised patience.
    answers:
      - Nenek saya mendongeng cerita yang menyimbolkan kesabaran.
      - Nenek saya dulu mendongeng cerita yang menyimbolkan kesabaran.
      - Nenekku mendongeng cerita yang menyimbolkan kesabaran.
    words: [mendongeng, menyimbolkan]
  - id: e08
    type: speaking
    text: Dongeng ini adalah alegori, dan pesan moralnya sederhana.
    meaning:
      ar_eg: الحدّوتة دي قصة رمزية، وعبرتها بسيطة.
      ar: هذه الحكاية قصّة رمزية، وعبرتها بسيطة.
      en: This tale is an allegory, and its moral is simple.
    words: [dongeng, alegori, pesan moral]
  - id: e09
    type: dictation
    text: Mitos itu diwariskan kepada keturunan para raja.
    meaning:
      ar_eg: الأسطورة دي اتورّثت لنسل الملوك.
      ar: ورثت ذرّيةُ الملوك تلك الأسطورة.
      en: That myth was handed down to the kings' descendants.
    words: [mitos, keturunan]
  - id: e10
    type: translate
    direction: from_target
    source_text: Dalam konteks dongeng, kiasan dan paradoks membuat cerita lebih hidup.
    answers_meaning:
      ar_eg:
        - في سياق الحواديت، التعبيرات المجازية والتناقض الظاهري بيخلّوا الحكاية عايشة أكتر.
        - في الحدّوتة، المجاز والمفارقة بيدّوا الحكاية روح.
      ar:
        - في سياق الحكايات، يجعل المجاز والمفارقة القصّة أكثر حيوية.
        - يبثّ المجاز والمفارقة الحياة في الحكاية الشعبية.
      en:
        - In a folk tale, figurative language and paradox make the story more alive.
        - In the context of a tale, figures of speech and paradox bring the story to life.
    words: [konteks, kiasan, paradoks]
  - id: e11
    type: match_pairs
    pairs:
      - text: arwah
        ar_eg: أرواح الميتين
        ar: أرواح الموتى
        en: spirits of the dead
      - text: tipu daya
        ar_eg: خدعة
        ar: خديعة
        en: trick
      - text: pengembara
        ar_eg: رحّالة
        ar: رحّالة
        en: wanderer
      - text: menirukan
        ar_eg: يقلّد
        ar: يقلّد
        en: to imitate
      - text: penasaran
        ar_eg: متشوّق يعرف
        ar: متشوّق
        en: curious
    words: [arwah, tipu daya, pengembara, menirukan, penasaran]
  - id: e12
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي حكاية فيها tokoh hewan بيستعمل akal؟
      ar: أيّ حكاية فيها tokoh hewan يستعمل akal؟
      en: Which tale has an animal character who uses his wits?
    options:
      - Hikayat Hang Tuah.
      - Danau Kelimutu.
      - Kancil dan buaya.
    answer: 2
    explain:
      ar_eg: الكانشيل والتماسيح fabel، والكانشيل كسب بعقله.
      ar: الكانشيل والتماسيح fabel، فاز فيها الكانشيل بعقله.
      en: Kancil and the crocodiles is a fabel; Kancil wins by his wits.
    words: [tokoh hewan, akal, fabel, hikayat]
dialogue:
  title: Pamit dari Arborek
  lines:
    - speaker: Mama Ruth
      text: Dongeng Mesirmu kemarin membuat anak-anak tidak bisa tidur. Mereka minta lanjutannya!
      ar_eg: حدّوتتك المصرية امبارح خلّت العيال مش عارفين يناموا. عايزين التكملة!
      ar: أسهرت حكايتك المصرية أمس الأطفال، وهم يطلبون تتمّتها!
      en: Your Egyptian tale last night kept the children awake. They want the rest!
    - speaker: Mohamed
      text: Klimaksnya terlalu tegang, ya? Saya kirim lanjutannya lewat Kaka Yohana di radio.
      ar_eg: الذروة كانت مشدودة زيادة، صح؟ هبعت التكملة مع كاكا يوهانا في الراديو.
      ar: كانت الذروة مشدودة أكثر من اللازم، أليس كذلك؟ سأرسل التتمّة عبر كاكا يوهانا في الإذاعة.
      en: The climax was too tense, wasn't it? I'll send the rest through Kaka Yohana on the radio.
    - speaker: Mama Ruth
      text: Ke mana kamu sekarang?
      ar_eg: رايح فين دلوقتي؟
      ar: إلى أين الآن؟
      en: Where are you off to now?
    - speaker: Mohamed
      text: Ke Piaynemo. Kata orang, di sana saya akan mendengar banyak logat.
      ar_eg: على بيانيمو. بيقولوا إني هسمع هناك لهجات كتير.
      ar: إلى بيانيمو، ويُقال إنّني سأسمع هناك لهجات كثيرة.
      en: To Piaynemo. People say I'll hear lots of accents there.
souvenir:
  id: bipa7.u03.souvenir
  title: Mitos asal-usul Papua
  note:
    ar_eg: في بابوا أكتر من 250 لغة، ولكل شعب تقريبًا أساطيره عن أصل الناس والأرض. أسطورة راجا أمبات بتحكي عن سبع بيضات لقوهم على نهر وايكيو، أربعة منهم بقوا ملوك الجزر الأربع الكبيرة، وبيضة ما فقستش بقت حجر لسه الناس بتحترمه في كالي راجا. والروايات بتختلف من قرية لقرية. الإندونيسي هي اللغة المشتركة اللي بتخلّي الحكايات دي تتنقل بين الشعوب، من غير ما تلغي لغاتها الأصلية.
    ar: في بابوا أكثر من 250 لغة، ولكلّ شعب تقريبًا أساطيره عن أصل البشر والأرض. تروي أسطورة راجا أمبات خبر سبع بيضات وُجدت على نهر وايكيو، صار أربع منها ملوك الجزر الأربع الكبرى، وبقيت بيضة لم تفقس فصارت حجرًا ما زال يُحترم في كالي راجا. وتختلف الروايات من قرية إلى أخرى. والإندونيسية هي الجسر المشترك الذي تنتقل عليه هذه الحكايات بين الشعوب دون أن تُلغي لغاتها الأصلية.
    en: Papua has more than 250 languages, and nearly every people has its own myths about the origin of humans and the land. Raja Ampat's legend tells of seven eggs found by the Waikeo river; four became the kings of the four large islands, and one that never hatched became a stone still honoured at Kali Raja. Versions differ from village to village. Indonesian is the shared bridge that carries these tales between peoples without replacing their own languages.
