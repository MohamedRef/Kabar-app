schema: kabar.lesson/v1
id: bipa7.u03.l10
language: id
title: Sastra lisan
can_do:
  ar_eg: 'تتكلّم عن الأدب الشفهي: مين بيحكيه، وإزاي اتنقل واتكتب.'
  ar: 'أن تتحدّث عن الأدب الشفاهي: من يرويه وكيف انتقل ودُوّن.'
  en: 'Talk about oral literature: who tells it and how it was passed on and written down.'
slides:
  - title: Dari mulut ke naskah
    body:
      ar_eg: |
        sastra lisan = الأدب الشفهي، اللي اتنقل من بُق لبُق قبل الكتابة.
        juru cerita = الحكواتي. sesepuh = كبير البلد المحترم، وغالبًا هو اللي حافظ الحكايات.
        prosa = نثر (عكس الشعر). epos = ملحمة طويلة زي الماهابهاراتا والرامايانا.
        في الوايانج الـ lakon = حكاية العرض الليلة دي.
        babad = حوليات تاريخية جاوية زي Babad Tanah Jawi، فيها تاريخ وأسطورة مع بعض.
        pujangga = شاعر البلاط، زي رونججوارسيتو في سوراكارتا.
        - في الكلام: cerita = bercerita.
      ar: |
        sastra lisan = الأدب الشفاهي الذي انتقل من فم إلى فم قبل التدوين.
        juru cerita = الراوي. sesepuh = الكبير المحترم في القرية، وكثيرًا ما يحفظ الحكايات.
        prosa = النثر (مقابل الشعر). epos = ملحمة طويلة كالمهابهاراتا والرامايانا.
        وفي الوايانغ يكون lakon قصّة عرض تلك الليلة.
        babad = حوليّات جاوية مثل Babad Tanah Jawi تمزج التاريخ بالأسطورة.
        pujangga = شاعر البلاط، مثل رونغغوارسيتو في سوراكارتا.
        - في الكلام اليومي: cerita = bercerita.
      en: |
        sastra lisan = oral literature, passed from mouth to mouth before writing.
        juru cerita = storyteller. sesepuh = the respected village elder, often the keeper of the tales.
        prosa = prose (as opposed to verse). epos = a long epic such as the Mahabharata and Ramayana.
        In wayang, the lakon is the story performed that night.
        babad = Javanese chronicles like the Babad Tanah Jawi, mixing history and legend.
        pujangga = a court poet, such as Ronggowarsito of Surakarta.
        - In speech: cerita = bercerita.
    examples:
      - text: Cerita ini adalah sastra lisan dari Biak.
        ar_eg: الحكاية دي أدب شفهي من بياك.
        ar: هذه الحكاية أدب شفاهي من بياك.
        en: This story is oral literature from Biak.
      - text: Dalang memilih lakon dari epos Mahabharata.
        ar_eg: الدالانج اختار حكاية العرض من ملحمة المهابهاراتا.
        ar: اختار محرّك الدمى قصّة العرض من ملحمة المهابهاراتا.
        en: The puppeteer picked a story from the Mahabharata epic.
      - text: Sesepuh kampung adalah juru cerita terbaik.
        ar_eg: كبير البلد هو أحسن حكواتي.
        ar: كبير القرية هو أفضل راوٍ.
        en: The village elder is the best storyteller.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sastra lisan
        ar_eg: أدب شفهي
        ar: أدب شفاهي
        en: oral literature
      - text: prosa
        ar_eg: نثر
        ar: نثر
        en: prose
      - text: epos
        ar_eg: ملحمة
        ar: ملحمة
        en: epic
      - text: babad
        ar_eg: حوليات / تاريخ منظوم قديم
        ar: حوليّة تاريخية (جاوية)
        en: chronicle (Javanese historical text)
    words: [sastra lisan, prosa, epos, babad]
  - id: e02
    type: match_pairs
    pairs:
      - text: pujangga
        ar_eg: شاعر البلاط / أديب كبير
        ar: شاعر البلاط، أديب
        en: court poet, man of letters
      - text: sesepuh
        ar_eg: كبير العيلة أو البلد
        ar: شيخ القوم، الكبير المُحترم
        en: respected elder
      - text: juru cerita
        ar_eg: حكواتي / راوي
        ar: راوٍ، حكواتي
        en: storyteller
      - text: lakon
        ar_eg: حكاية العرض (في الوايانج)
        ar: قصة العرض المسرحي
        en: story of a play (wayang)
    words: [pujangga, sesepuh, juru cerita, lakon]
  - id: e03
    type: listen
    text: Babad itu ditulis oleh seorang pujangga keraton.
    question:
      ar_eg: مين كتب الحوليات؟
      ar: مَن كتب الحوليّة؟
      en: Who wrote the chronicle?
    options: [شاعر البلاط, الحكواتي, كبير البلد]
    answer: 0
    meaning:
      ar_eg: الحوليات دي كتبها شاعر من شعراء البلاط.
      ar: كتب تلك الحوليّة شاعر من شعراء البلاط.
      en: That chronicle was written by a court poet.
    words: [babad, pujangga]
  - id: e04
    type: fill_blank
    sentence: Hikayat ditulis dalam bentuk ___, bukan puisi.
    meaning:
      ar_eg: الحكايات اتكتبت في شكل ___، مش شعر.
      ar: كُتبت الحكايات ___ لا شعرًا.
      en: Hikayat are written in ___, not verse.
    options: [prosa, epos, lakon]
    answers: [prosa]
    words: [prosa, epos, lakon]
    explain:
      ar_eg: prosa = نثر، عكس الشعر. epos = ملحمة، وlakon = قصة عرض الواينج.
      ar: prosa = نثر لا شعر. أما epos فملحمة وlakon قصة عرض.
      en: prosa is prose. epos is an epic, lakon a play's story.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الـ «sastra lisan» ممكن تضيع؟
      ar: لماذا قد يضيع «sastra lisan»؟
      en: Why can 'sastra lisan' be lost?
    options: [Karena terlalu banyak dicetak., Karena hanya hidup di ingatan para penutur., Karena dilarang di sekolah.]
    answer: 1
    explain:
      ar_eg: الأدب الشفهي عايش في ذاكرة الناس بس.
      ar: يعيش الأدب الشفاهي في ذاكرة رواته فقط.
      en: Oral literature lives only in people's memory.
    words: [sastra lisan, sesepuh]
  - id: e06
    type: fill_blank
    sentence: Malam ini dalang membawakan ___ "Arjuna Wiwaha".
    meaning:
      ar_eg: الليلة الدالانج هيقدّم ___ «أرجونا ويواها».
      ar: يقدّم محرّك الدمى الليلة ___ «أرجونا ويواها».
      en: Tonight the puppeteer performs the ___ 'Arjuna Wiwaha'.
    options: [lakon, babad, juru cerita]
    answers: [lakon]
    words: [lakon, babad, juru cerita]
    explain:
      ar_eg: lakon = قصة العرض اللي الدالانج بيقدّمها. babad = تاريخ مكتوب، وjuru cerita = حكّاء.
      ar: lakon = قصة العرض. أما babad فحولية تاريخية وjuru cerita حكّاء.
      en: A dalang performs a lakon. babad is a chronicle, juru cerita a storyteller.
  - id: e07
    type: build_sentence
    source:
      ar_eg: الحكواتي ده بيحكي بصوت واطي.
      ar: يروي ذلك الراوي بصوت خفيض.
      en: That storyteller tells in a low voice.
    answer: Juru cerita itu bercerita dengan suara pelan.
    distractors: [pujangga, sesepuh]
    words: [juru cerita]
    explain:
      ar_eg: Juru cerita = الحكّاء. pujangga = شاعر/أديب كبير، وsesepuh = كبير القوم.
      ar: Juru cerita = الحكّاء. أما pujangga فأديب كبير وsesepuh شيخ القوم.
      en: Juru cerita = storyteller. pujangga is a court poet, sesepuh an elder.
  - id: e08
    type: translate
    direction: from_target
    source_text: Ramayana adalah epos yang sangat panjang.
    answers_meaning:
      ar_eg: [الرامايانا ملحمة طويلة جدًا, الرامايانا دي ملحمة طويلة أوي]
      ar: [الرامايانا ملحمة طويلة جدًا, الرامايانا ملحمة بالغة الطول]
      en: [The Ramayana is a very long epic, Ramayana is an extremely long epic]
    words: [epos]
  - id: e09
    type: speaking
    text: Kami merekam sastra lisan dari para sesepuh.
    meaning:
      ar_eg: إحنا بنسجّل الأدب الشفهي من كبار البلد.
      ar: نسجّل الأدب الشفاهي من الشيوخ.
      en: We record oral literature from the elders.
    words: [sastra lisan, sesepuh]
  - id: e10
    type: multiple_choice
    question: Teks mana yang mencampur sejarah dan legenda?
    options: [Babad Tanah Jawi, Kamus bahasa, Berita cuaca]
    answer: 0
    explain:
      ar_eg: الـ babad بتخلط التاريخ بالأسطورة.
      ar: تمزج الـ babad التاريخ بالأسطورة.
      en: A babad mixes history and legend.
    words: [babad, prosa, epos, pujangga, juru cerita, lakon]
dialogue:
  lines:
    - speaker: Mama Ruth
      text: Mohamed, besok sesepuh kampung mau cerita. Bawa alat rekammu, ya.
      ar_eg: يا محمد، بكرة كبير البلد هيحكي. هات جهاز التسجيل بتاعك.
      ar: يا محمد، سيروي كبير القرية غدًا، فأحضر جهاز تسجيلك.
      en: Mohamed, the village elder will tell stories tomorrow. Bring your recorder.
    - speaker: Mohamed
      text: Tentu, Mama. Sastra lisan seperti itu harus disimpan.
      ar_eg: أكيد يا ماما. الأدب الشفهي ده لازم يتحفظ.
      ar: بالتأكيد يا أمّي، فمثل هذا الأدب الشفاهي يجب أن يُحفظ.
      en: Of course, Mama. Oral literature like that must be kept.
    - speaker: Mama Ruth
      text: Dia juru cerita terakhir yang hafal kisah asal-usul marga kami.
      ar_eg: هو آخر حكواتي حافظ حكاية أصل عشيرتنا.
      ar: هو آخر راوٍ يحفظ حكاية أصل عشيرتنا.
      en: He's the last storyteller who knows our clan's origin story by heart.
    - speaker: Mohamed
      text: Ceritanya bentuk prosa atau nyanyian?
      ar_eg: الحكاية نثر ولا غُنا؟
      ar: هل الحكاية نثر أم غناء؟
      en: Is the story told in prose or sung?
    - speaker: Mama Ruth
      text: Dua-duanya. Seperti epos kecil, ada bagian yang dinyanyikan.
      ar_eg: الاتنين. زي ملحمة صغيّرة، فيه أجزاء بتتغنّى.
      ar: كلاهما، كملحمة صغيرة فيها أجزاء تُغنّى.
      en: Both. Like a little epic, some parts are sung.
