schema: kabar.lesson/v1
id: bipa3.u04.l08
language: id
title: Teks eksplanasi
can_do:
  ar_eg: تشرح ليه أكلة معيّنة صحية، في نص قصير مترتّب.
  ar: أن تشرح لماذا يكون طعام ما صحيًا في نص قصير مرتّب.
  en: Explain why a food is healthy.
slides:
  - title: Teks eksplanasi dalam tiga langkah
    grammar: id.definition.adalah-merupakan
    body:
      ar_eg: |
        النص التفسيري (teks eksplanasi) بيمشي كده:
        ١) التعريف: Stroberi merupakan buah yang kaya vitamin C.
        ٢) الشرح: فيها إيه (mengandung = فيها / بتحتوي على) وفايدتها إيه (manfaat، من العربي «منفعة»): … menyehatkan tubuh.
        ٣) الخلاصة: Jadi, …
      ar: |
        يسير النص التفسيري (teks eksplanasi) هكذا:
        ١) التعريف: Stroberi merupakan buah yang kaya vitamin C.
        ٢) الشرح: ما يحتويه (mengandung = يحتوي على) وما فائدته (manfaat، من العربية «منفعة»): … menyehatkan tubuh.
        ٣) الخلاصة: Jadi, …
      en: |
        An explanation text goes like this:
        1) Definition: Stroberi merupakan buah yang kaya vitamin C.
        2) Explanation: what it contains (mengandung) and its benefits (manfaat, from Arabic «منفعة»): … menyehatkan tubuh.
        3) Conclusion: Jadi, …
    examples:
      - text: Stroberi mengandung serat dan sedikit lemak.
        ar_eg: الفراولة فيها ألياف ودهون قليلة.
        ar: تحتوي الفراولة على الألياف وقليل من الدهون.
        en: Strawberries contain fibre and little fat.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: manfaat
        ar_eg: فايدة، منفعة
        ar: فائدة، منفعة
        en: benefit
      - text: mengandung
        ar_eg: فيه، بيحتوي على
        ar: يحتوي على
        en: to contain
      - text: lemak
        ar_eg: دهون
        ar: دهون
        en: fat
      - text: seimbang
        ar_eg: متوازن
        ar: متوازن
        en: balanced
    words: [manfaat, mengandung, lemak, seimbang]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة تنفع تعريف في أول النص التفسيري؟
      ar: أيّ جملة تصلح تعريفًا في بداية النص التفسيري؟
      en: Which sentence works as the definition at the start of an explanation text?
    options: ["Jadi, makanlah stroberi setiap hari.", "Stroberi merupakan buah yang kaya vitamin C.", "Wah, stroberinya manis sekali!"]
    answer: 1
    words: [kaya]
  - id: e03
    type: listen
    text: Tempe mengandung banyak protein dan sedikit lemak. Manfaatnya, tempe menguatkan tubuh.
    question:
      ar_eg: التمبيه فيه شوية قليلين من إيه؟
      ar: ممّ يحتوي التمبيه على القليل؟
      en: What does tempeh contain only a little of?
    options: [protein, serat, lemak]
    answer: 2
    meaning:
      ar_eg: التمبيه فيه بروتين كتير ودهون قليلة. وفايدته إنه بيقوّي الجسم.
      ar: يحتوي التمبيه على كثير من البروتين وقليل من الدهون، ومن فوائده أنه يقوّي الجسم.
      en: Tempeh contains a lot of protein and little fat. Its benefit is that it strengthens the body.
    words: [mengandung, lemak, manfaat]
  - id: e04
    type: fill_blank
    sentence: Stroberi ___ vitamin C.
    meaning:
      ar_eg: الفراولة فيها فيتامين سي.
      ar: تحتوي الفراولة على فيتامين C.
      en: Strawberries contain vitamin C.
    options: [merupakan, mengandung, menaikkan]
    answers: [mengandung]
    words: [mengandung]
  - id: e05
    type: fill_blank
    sentence: Apa ___ sayur bagi tubuh?
    meaning:
      ar_eg: إيه فايدة الخضار للجسم؟
      ar: ما فائدة الخضار للجسم؟
      en: What are the benefits of vegetables for the body?
    options: [lemak, manfaat, panen]
    answers: [manfaat]
    words: [manfaat]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الأكل المقلي فيه دهون كتير.
      ar: يحتوي الطعام المقلي على كثير من الدهون.
      en: Fried food contains a lot of fat.
    answer: Makanan goreng mengandung banyak lemak.
    distractors: [merupakan, sedikit]
    words: [mengandung, lemak]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الفراولة تعتبر فاكهة غنية بفيتامين سي.
      ar: تُعدّ الفراولة فاكهة غنية بفيتامين C.
      en: Strawberries are a fruit rich in vitamin C.
    answers:
      - Stroberi merupakan buah yang kaya vitamin C.
      - Stroberi merupakan buah yang kaya vitamin C
      - Stroberi adalah buah yang kaya vitamin C.
      - Stroberi merupakan buah yang kaya akan vitamin C.
      - Stroberi adalah buah yang kaya akan vitamin C.
      - Stroberi merupakan buah kaya vitamin C.
      - Stroberi adalah buah kaya vitamin C.
    words: [kaya]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الخضار ليه فوايد كتير للجسم.
      ar: للخضار فوائد كثيرة للجسم.
      en: Vegetables have many benefits for the body.
    answers:
      - Sayur punya banyak manfaat bagi tubuh.
      - Sayur punya banyak manfaat bagi tubuh
      - Sayur punya banyak manfaat untuk tubuh.
      - Sayur memiliki banyak manfaat bagi tubuh.
      - Sayur memiliki banyak manfaat untuk tubuh.
      - Sayuran punya banyak manfaat bagi tubuh.
      - Sayuran memiliki banyak manfaat bagi tubuh.
      - Sayuran punya banyak manfaat untuk tubuh.
      - Sayuran memiliki banyak manfaat untuk tubuh.
    words: [manfaat]
  - id: e09
    type: speaking
    text: Ikan mengandung lemak yang sehat.
    meaning:
      ar_eg: السمك فيه دهون صحية.
      ar: يحتوي السمك على دهون صحية.
      en: Fish contains healthy fat.
    words: [mengandung, lemak]
dialogue:
  title: Teks tentang stroberi
  lines:
    - speaker: Rina
      text: Mohamed, tulisanmu udah selesai?
      ar_eg: محمد، خلّصت الموضوع بتاعك؟
      ar: يا محمد، هل أنهيت نصّك؟
      en: Mohamed, have you finished your piece?
    - speaker: Mohamed
      text: "Udah. Dengerin, ya: \"Stroberi merupakan buah yang kaya vitamin C.\""
      ar_eg: "أيوه. اسمعي: «الفراولة تعتبر فاكهة غنية بفيتامين سي»."
      ar: "نعم. اسمعي: «تُعدّ الفراولة فاكهة غنية بفيتامين C»."
      en: 'Yes. Listen: "Strawberries are a fruit rich in vitamin C."'
    - speaker: Rina
      text: Bagus! Terus, manfaatnya apa?
      ar_eg: حلو! وبعدين، فايدتها إيه؟
      ar: جميل! وما فائدتها؟
      en: Good! And what are their benefits?
    - speaker: Mohamed
      text: "\"Buah ini mengandung serat dan sedikit lemak, jadi buah ini menyehatkan tubuh.\""
      ar_eg: «الفاكهة دي فيها ألياف ودهون قليلة، فبتفيد الجسم.»
      ar: «تحتوي هذه الفاكهة على ألياف ودهون قليلة، فهي مفيدة للجسم.»
      en: "\"This fruit contains fibre and little fat, so it keeps the body healthy.\""
    - speaker: Rina
      text: Kesimpulannya?
      ar_eg: والخلاصة؟
      ar: والخلاصة؟
      en: And the conclusion?
    - speaker: Mohamed
      text: '"Jadi, makanlah stroberi dari Sembalun!"'
      ar_eg: «يبقى كُلوا فراولة سمبالون!»
      ar: «إذن، كُلوا فراولة سمبالون!»
      en: '"So, eat strawberries from Sembalun!"'
