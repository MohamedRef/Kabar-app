schema: kabar.lesson/v1
id: bipa5.u03.l06
language: id
title: Akun kantor dibobol
can_do:
  ar_eg: 'تحكي عن اختراق حساب في الشغل: الهاكر والباسورد والأدمن وتسريب البيانات والتحديث، وتفكر بمنطق.'
  ar: 'أن تروي اختراق حساب في العمل: المخترق وكلمة المرور والمسؤول وتسريب البيانات والتحديث، وتفكّر بمنطق.'
  en: 'Describe a hacked work account: the hacker, password, admin, data leak and update, and reason it through.'
slides:
  - title: Keamanan digital
    body:
      ar_eg: |
        hacker = هاكر، password = باسورد (بالإندونيسي الرسمي kata sandi)، admin = أدمن، المسؤول عن النظام.
        software = برنامج (بالرسمي perangkat lunak)، update = تحديث: update software-nya dulu!
        kebocoran = تسريب (kebocoran data = تسريب بيانات، وأصلها bocor = بيخر).
        logis = منطقي، asumsi = افتراض: Itu baru asumsi = ده لسه افتراض.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: ngirim = mengirim، kayaknya = sepertinya، cuma = hanya، aja = saja.
      ar: |
        hacker = مخترق، password = كلمة المرور (الرسمية: kata sandi)، admin = المسؤول عن النظام.
        software = برمجيات (الرسمية: perangkat lunak)، update = تحديث: update software-nya dulu!
        kebocoran = تسرّب (kebocoran data = تسريب البيانات، من bocor = يتسرّب).
        logis = منطقي، asumsi = افتراض: Itu baru asumsi = ما زال ذلك افتراضًا.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: ngirim = mengirim، kayaknya = sepertinya، cuma = hanya، aja = saja.
      en: |
        hacker = hacker, password = password (formal: kata sandi), admin = admin, system administrator.
        software = software (formal: perangkat lunak), update = update: update software-nya dulu!
        kebocoran = leak (kebocoran data = data leak, from bocor = to leak).
        logis = logical, asumsi = assumption: Itu baru asumsi = that's only an assumption.
        The dialogue uses street forms; the formal ones are beside them: ngirim = mengirim, kayaknya = sepertinya, cuma = hanya, aja = saja.
    examples:
      - text: Hacker itu mencuri password dua puluh karyawan.
        ar_eg: الهاكر ده سرق باسوردات عشرين موظف.
        ar: سرق ذلك المخترق كلمات مرور عشرين موظفًا.
        en: That hacker stole twenty employees' passwords.
      - text: Admin meminta semua orang meng-update software.
        ar_eg: الأدمن طلب من الكل يعملوا أبديت للبرامج.
        ar: طلب المسؤول من الجميع تحديث البرمجيات.
        en: The admin asked everyone to update their software.
      - text: Kebocoran data ini bukan asumsi, tetapi fakta.
        ar_eg: تسريب الداتا ده مش افتراض، ده حقيقة.
        ar: ليس تسريب البيانات هذا افتراضًا بل حقيقة.
        en: This data leak isn't an assumption; it's a fact.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: hacker
        ar_eg: هاكر
        ar: مخترق
        en: hacker
      - text: password
        ar_eg: باسورد
        ar: كلمة مرور
        en: password
      - text: admin
        ar_eg: أدمن
        ar: مسؤول النظام
        en: admin
      - text: kebocoran
        ar_eg: تسريب
        ar: تسرّب
        en: leak
    words: [hacker, password, admin, kebocoran]
  - id: e02
    type: match_pairs
    pairs:
      - text: software
        ar_eg: برنامج
        ar: برمجيات
        en: software
      - text: update
        ar_eg: تحديث
        ar: تحديث
        en: update
      - text: logis
        ar_eg: منطقي
        ar: منطقي
        en: logical
      - text: asumsi
        ar_eg: افتراض
        ar: افتراض
        en: assumption
    words: [software, update, logis, asumsi]
  - id: e03
    type: listen
    text: Ganti password Anda sekarang juga.
    question:
      ar_eg: المطلوب إيه؟
      ar: ما المطلوب؟
      en: What is he told to do?
    options: [يغيّر الباسورد, يقفل الموبايل, يكلم الأدمن]
    answer: 0
    meaning:
      ar_eg: غيّر الباسورد بتاعك دلوقتي حالًا.
      ar: غيّر كلمة مرورك الآن فورًا.
      en: Change your password right now.
    words: [password]
  - id: e04
    type: fill_blank
    sentence: Laptop saya lambat karena ___ terbaru belum dipasang.
    meaning:
      ar_eg: اللابتوب بتاعي بطيء عشان آخر ___ لسه ما اتنزلش.
      ar: حاسوبي بطيء لأن آخر ___ لم يُثبَّت بعد.
      en: My laptop is slow because the latest ___ isn't installed yet.
    options: [update, asumsi, hacker]
    answers: [update]
    words: [update, asumsi, hacker]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيدير نظام الكمبيوتر في الشركة؟
      ar: من يدير نظام الحاسوب في الشركة؟
      en: Who runs the company's computer system?
    options: [kebocoran, admin, logis]
    answer: 1
    explain:
      ar_eg: admin = مسؤول النظام.
      ar: admin = مسؤول النظام.
      en: admin = system administrator.
    words: [kebocoran, admin, logis]
  - id: e06
    type: fill_blank
    sentence: Penjelasanmu masuk akal dan ___.
    meaning:
      ar_eg: شرحك معقول و___.
      ar: شرحك معقول و___.
      en: Your explanation makes sense and is ___.
    options: [logis, software, password]
    answers: [logis]
    words: [logis, software, password]
  - id: e07
    type: multiple_choice
    question: Jangan dulu menuduh orang. Itu baru ___.
    options: [update, kebocoran, asumsi]
    answer: 2
    explain:
      ar_eg: asumsi = افتراض، لسه مش متأكدين.
      ar: asumsi = افتراض، لم يتأكّد بعد.
      en: asumsi = an assumption, not proven yet.
    words: [update, kebocoran, asumsi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الهاكر دخل من برنامج قديم.
      ar: دخل المخترق عبر برمجيات قديمة.
      en: The hacker got in through old software.
    answer: Hacker itu masuk lewat software lama.
    distractors: [admin, update]
    words: [hacker, software]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kebocoran data itu sudah dilaporkan ke polisi.
    answers_meaning:
      ar_eg: [تسريب الداتا ده اتبلغ عنه البوليس, بلّغوا البوليس عن تسريب البيانات]
      ar: [أُبلغت الشرطة بتسريب البيانات, تم الإبلاغ عن تسريب البيانات للشرطة]
      en: [The data leak has been reported to the police, The data leak was reported to the police]
    words: [kebocoran]
  - id: e10
    type: speaking
    text: Menurut admin, hacker itu tidak tahu password baru kita.
    meaning:
      ar_eg: الأدمن بيقول الهاكر ما يعرفش الباسورد الجديد بتاعنا.
      ar: يقول المسؤول إن المخترق لا يعرف كلمة مرورنا الجديدة.
      en: The admin says the hacker doesn't know our new password.
    words: [admin, hacker, password]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, email kantorku ngirim pesan aneh ke semua klien!
      ar_eg: يا محمد، إيميل الشغل بتاعي بعت رسايل غريبة لكل العملا!
      ar: يا محمد، بريد عملي أرسل رسائل غريبة إلى كل العملاء!
      en: Mohamed, my work email sent strange messages to all our clients!
    - speaker: Mohamed
      text: Kayaknya akunmu dibobol hacker. Passwordmu apa? Jangan bilang tanggal lahir, ya.
      ar_eg: يمكن حسابك اتهكر. الباسورد بتاعك إيه؟ ما تقوليش تاريخ ميلادك.
      ar: ربما اخترق أحدهم حسابك. ما كلمة مرورك؟ لا تقولي إنها تاريخ ميلادك.
      en: Maybe a hacker got into your account. What's your password? Don't say your birthday.
    - speaker: Rina
      text: Iya... tanggal lahir. Tapi itu cuma asumsi, kan?
      ar_eg: أيوه... تاريخ ميلادي. بس ده مجرد افتراض، صح؟
      ar: نعم... تاريخ ميلادي. لكن هذا مجرد افتراض، أليس كذلك؟
      en: Yes... my birthday. But that's just an assumption, right?
    - speaker: Mohamed
      text: Asumsi yang logis, sih. Kita lapor ke admin sekarang aja.
      ar_eg: افتراض منطقي. يلا نبلّغ الأدمن دلوقتي.
      ar: افتراض منطقي. لنبلّغ المسؤول الآن.
      en: A logical one. Let's report it to the admin now.
    - speaker: Pak Hendra
      text: Ada kebocoran data? Semua harus update software dan ganti password hari ini.
      ar_eg: فيه تسريب داتا؟ الكل لازم يحدّث البرامج ويغيّر الباسورد النهارده.
      ar: هل هناك تسريب بيانات؟ على الجميع تحديث البرمجيات وتغيير كلمات المرور اليوم.
      en: A data leak? Everyone must update their software and change passwords today.
