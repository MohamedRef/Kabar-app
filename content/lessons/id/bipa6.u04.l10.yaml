can_do:
  ar_eg: تقرا نثر تاريخي وتكتب ملخص قصير مرتّب بالزمن.
  ar: أن تقرأ نثرًا تاريخيًّا وتكتب ملخّصًا قصيرًا مرتّبًا زمنيًّا.
  en: Read historical prose and write a short summary in time order.
