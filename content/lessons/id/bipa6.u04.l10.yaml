    meaning:
      ar_eg: بيقولوا إن من القرن السابع، مراكب من العرب كانت بتوقف هنا.
      ar: يُروى أنّ سفنًا من بلاد العرب كانت ترسو هنا منذ القرن السابع.
      en: It is said that since the seventh century, ships from Arabia have called here.
