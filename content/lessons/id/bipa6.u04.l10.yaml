        - أسطول تشنج هو كان مستني رياح الموسم عشان يقف في باليمبانج.
      ar:
        - انتظر أسطول تشنغ هو الرياح الموسمية قبل أن يتوقّف في باليمبانغ.
        - كان أسطول تشنغ هو ينتظر الرياح الموسمية ليتوقّف في باليمبانغ.
      en:
