dialogue:
  title: Malam di Jembatan Ampera
  lines:
    - speaker: Kak Dewi
      text: Dari jembatan ini, kita bisa melihat seluruh Sungai Musi.
      ar_eg: من الكوبري ده، نقدر نشوف نهر موسي كله.
      ar: من هذا الجسر نرى نهر موسي كلّه.
      en: From this bridge, we can see the whole Musi River.
    - speaker: Mohamed
      text: Sulit dibayangkan. Dulu di sini berdiri pusat salah satu kerajaan maritim terbesar.
      ar_eg: صعب أتخيّل. زمان هنا كان مركز واحدة من أكبر الممالك البحرية.
      ar: يصعب التخيّل. هنا قام قديمًا مركز إحدى أعظم الممالك البحرية.
      en: Hard to imagine. The centre of one of the greatest maritime kingdoms once stood here.
    - speaker: Kak Dewi
      text: Dan biksu, pedagang, juga pelaut dari seluruh dunia datang ke sini.
      ar_eg: والرهبان والتجار والبحّارة من الدنيا كلها كانوا بييجوا هنا.
      ar: وجاء إليه الرهبان والتجّار والبحّارة من أرجاء العالم.
      en: And monks, traders and sailors from all over the world came here.
    - speaker: Mohamed
      text: Sekarang datanglah seorang pelajar dari Mesir. Sejarahnya belum selesai!
      ar_eg: ودلوقتي جه طالب من مصر. التاريخ لسه ماخلصش!
      ar: والآن جاء طالب من مصر. لم ينتهِ التاريخ بعد!
      en: And now there came a student from Egypt. The story isn't over!
souvenir:
  id: bipa6.u04.souvenir
  title: Sriwijaya di Sungai Musi
  note:
    ar_eg: سريويجايا كانت مملكة بحرية مركزها حوالين باليمبانج من القرن السابع، وسيطرت قرون على مضيق ملقا بين الهند والصين. الراهب الصيني I-Tsing وقف فيها سنة 671 يتعلّم السنسكريتي. ونقش كيدوكان بوكيت (683) اللي اتلقى في باليمبانج من أقدم النصوص المكتوبة بالملايو، أجداد الإندونيسي.
    ar: كانت سريويجايا مملكة بحرية مركزها حول باليمبانغ منذ القرن السابع، وسيطرت قرونًا على مضيق ملقا بين الهند والصين. وتوقّف فيها الراهب الصيني I-Tsing عام 671 ليتعلّم السنسكريتية. ونقش كيدوكان بوكيت (683) المكتشف في باليمبانغ من أقدم النصوص المكتوبة بالملايوية، جدّة الإندونيسية.
    en: Srivijaya was a maritime kingdom centred around Palembang from the seventh century, controlling the Strait of Malacca between India and China for centuries. The Chinese monk I-Tsing stopped there in 671 to study Sanskrit. The Kedukan Bukit inscription (683), found in Palembang, is among the oldest texts written in Malay, the ancestor of Indonesian.
