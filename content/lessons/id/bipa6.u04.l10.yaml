  - id: e07
    type: translate
    direction: from_target
    source_text: Pada masa jayanya, Sriwijaya menjadi pusat ilmu agama Buddha.
    answers_meaning:
      ar_eg:
        - في عصر عزّها، سريويجايا بقت مركز لعلوم البوذية.
        - أيام مجدها كانت سريويجايا مركز لتعليم البوذية.
      ar:
        - صارت سريويجايا في عصر ازدهارها مركزًا للعلوم البوذية.
        - كانت سريويجايا في أوجها مركزًا لتعلّم البوذية.
      en:
        - In its heyday, Srivijaya became a centre of Buddhist learning.
        - At its peak, Srivijaya was a hub of Buddhist scholarship.
