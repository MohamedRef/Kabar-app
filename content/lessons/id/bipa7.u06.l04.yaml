schema: kabar.lesson/v1
id: bipa7.u06.l04
language: id
title: Pemengaruh
can_do:
  ar_eg: تفرّق بين رأي المؤثّر الحقيقي والإعلان المدفوع.
  ar: أن تميّز بين رأي المؤثّر الصادق والإعلان المدفوع.
  en: Tell an influencer's honest opinion from paid content.
slides:
  - title: Ini iklan atau bukan?
    body:
      ar_eg: |
        الـ pemengaruh (المؤثّر، influencer) شخص عنده pengikut (متابعين) كتير على السوشيال ميديا. وهي الكلمة الإندونيسية الرسمية بدل «influencer».
        - konten berbayar = محتوى مدفوع: شركة دفعت فلوس علشان يتكلّم عن منتجها.
        - kerja sama = تعاون / شراكة: «kerja sama dengan merek X»
        - membujuk = يقنع / يغري حد يعمل حاجة
        المؤثّر الأمين بيكتب بوضوح: #iklan أو «kerja sama berbayar».
        اسأل نفسك: هو بيمدح المنتج علشان عجبه، ولا علشان قبض؟
        - في الكلام: nggak = tidak.
        - nih = أهو / دي (بتشاور على حاجة). كلمات صغيرة بتدّي الجملة إحساس، ومن غيرها الجملة صح برضه.
      ar: |
        الـ pemengaruh (المؤثّر) شخص له pengikut (متابعون) كثيرون على وسائل التواصل، وهي اللفظة الإندونيسية الرسمية بدل «influencer».
        - konten berbayar = محتوى مدفوع: دفعت شركة مالًا ليتحدّث عن منتجها.
        - kerja sama = تعاون، شراكة: «kerja sama dengan merek X»
        - membujuk = يُغري، يستميل
        والمؤثّر الأمين يكتب بوضوح: #iklan أو «kerja sama berbayar».
        واسأل نفسك: أيمدح المنتج لأنّه أعجبه، أم لأنّه قبض ثمنه؟
        - في الكلام اليومي: nggak = tidak.
        - nih = ها هو / هذا (إشارة). أدوات صغيرة تلوّن الجملة، والجملة صحيحة بدونها.
      en: |
        A pemengaruh (influencer) is someone with lots of pengikut (followers) on social media. It's the official Indonesian word for "influencer".
        - konten berbayar = paid content: a company paid them to talk about its product.
        - kerja sama = collaboration, partnership: "kerja sama dengan merek X"
        - membujuk = to coax, persuade someone into something
        An honest influencer labels it clearly: #iklan or "kerja sama berbayar".
        Ask yourself: are they praising it because they like it, or because they were paid?
        - In speech: nggak = tidak.
        - nih = here, this (pointing). Small particles that add feeling; the sentence is correct without them.
    examples:
      - text: Pemengaruh itu punya dua juta pengikut, dan videonya selalu konten berbayar.
        ar_eg: المؤثّر ده عنده اتنين مليون متابع، وفيديوهاته كلها محتوى مدفوع.
        ar: لذلك المؤثّر مليونا متابع، وكلّ فيديوهاته محتوى مدفوع.
        en: That influencer has two million followers, and every video is paid content.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pemengaruh
        ar_eg: مؤثّر
        ar: مؤثّر
        en: influencer
      - text: konten berbayar
        ar_eg: محتوى مدفوع
        ar: محتوى مدفوع
        en: paid content
      - text: membujuk
        ar_eg: يقنع / يغري
        ar: يستميل
        en: to coax, persuade
      - text: pengikut
        ar_eg: متابعين
        ar: متابعون
        en: followers
      - text: kerja sama
        ar_eg: تعاون
        ar: شراكة
        en: collaboration
    words: [pemengaruh, konten berbayar, membujuk, pengikut, kerja sama]
  - id: e02
    type: listen
    text: Video ini adalah kerja sama berbayar dengan sebuah merek kopi.
    question:
      ar_eg: الفيديو ده إيه؟
      ar: ما هذا الفيديو؟
      en: What is this video?
    options:
      - رأي شخصي من غير فلوس.
      - إعلان مدفوع بالشراكة مع ماركة بنّ.
      - نشرة أخبار.
    answer: 1
    words: [kerja sama, konten berbayar]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: المؤثّر الأمين يعمل إيه لما ياخد فلوس من شركة؟
      ar: ماذا يفعل المؤثّر الأمين حين يتقاضى مالًا من شركة؟
      en: What does an honest influencer do when a company pays them?
    options:
      - يخبّي ده.
      - يمسح التعليقات.
      - يكتب بوضوح إنه إعلان.
    answer: 2
    words: [pemengaruh, konten berbayar]
    explain:
      ar_eg: المؤثر الأمين بيكتب بوضوح إن البوست إعلان مدفوع. الإخفاء ومسح التعليقات عكس الأمانة.
      ar: المؤثر الأمين يصرّح بوضوح بأن المنشور إعلان مدفوع.
      en: An honest influencer clearly labels paid posts as ads.
  - id: e04
    type: fill_blank
    sentence: Iklan itu mencoba ___ anak muda supaya membeli sepatu mahal.
    meaning:
      ar_eg: الإعلان ده بيحاول يغري الشباب يشتروا جزم غالية.
      ar: يحاول ذلك الإعلان استمالة الشباب لشراء أحذية غالية.
      en: That ad tries to coax young people into buying expensive shoes.
    options: [membujuk, menanam, merajut]
    answers: [membujuk]
    words: [membujuk]
    explain:
      ar_eg: membujuk = يقنع/يستدرج، وده اللي الإعلان بيعمله. menanam = يزرع وmerajut = يغزل.
      ar: membujuk = يستميل ويقنع. menanam يزرع وmerajut يحيك.
      en: membujuk (coax) is what ads do. menanam is to plant; merajut to knit.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «pengikut» في السوشيال ميديا يبقوا مين؟
      ar: من هم «pengikut» في وسائل التواصل؟
      en: Who are "pengikut" on social media?
    options:
      - الناس اللي بيتابعوا الحساب.
      - الشركات اللي بتدفع.
      - الحراس الشخصيين.
    answer: 0
    words: [pengikut]
    explain:
      ar_eg: pengikut = متابعين (من ikut = يتبع)، الناس اللي بتتابع الحساب.
      ar: pengikut = المتابعون (من ikut = تبع).
      en: pengikut (from ikut, follow) are followers.
  - id: e06
    type: build_sentence
    source:
      ar_eg: عدد متابعينها زاد بسرعة.
      ar: ازداد عدد متابعيها بسرعة.
      en: Her follower count grew fast.
    answer: Jumlah pengikutnya bertambah dengan cepat.
    distractors: [membujuk, kerja]
    words: [pengikut]
    explain:
      ar_eg: Jumlah pengikutnya (عدد متابعينها) + bertambah (زاد) + dengan cepat. membujuk وkerja زيادة.
      ar: Jumlah pengikutnya bertambah dengan cepat. membujuk وkerja زائدتان.
      en: Jumlah pengikutnya + bertambah + dengan cepat. membujuk and kerja are extra.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المؤثّر ده لازم يقول إن الفيديو محتوى مدفوع.
      ar: على هذا المؤثّر أن يذكر أنّ الفيديو محتوى مدفوع.
      en: This influencer must say the video is paid content.
    answers:
      - Pemengaruh ini harus mengatakan bahwa video itu konten berbayar.
      - Pemengaruh ini harus bilang bahwa videonya konten berbayar.
      - Pemengaruh ini wajib mengatakan bahwa video itu adalah konten berbayar.
      - Pemengaruh itu harus menyebutkan bahwa video ini konten berbayar.
    words: [pemengaruh, konten berbayar]
  - id: e08
    type: speaking
    text: Saya mau kerja sama, tetapi hanya dengan produk yang saya suka.
    meaning:
      ar_eg: أنا موافق أتعاون، بس مع منتجات بحبّها.
      ar: أقبل التعاون، لكن مع منتجات أحبّها فقط.
      en: I'm open to collaborations, but only with products I like.
    words: [kerja sama]
  - id: e09
    type: dictation
    text: Pemengaruh itu membujuk pengikutnya dengan kata "diskon".
    meaning:
      ar_eg: المؤثّر ده بيغري متابعينه بكلمة «خصم».
      ar: يستميل ذلك المؤثّر متابعيه بكلمة «تخفيض».
      en: That influencer coaxes their followers with the word "discount".
    words: [pemengaruh, membujuk, pengikut]
  - id: e10
    type: speaking
    text: Kalau tidak ada tanda iklan, saya ragu apakah itu konten berbayar atau bukan.
    meaning:
      ar_eg: لو مافيش علامة إعلان، بشكّ هو محتوى مدفوع ولا لأ.
      ar: إن غابت علامة الإعلان، شككت أهو محتوى مدفوع أم لا.
      en: If there's no ad label, I'm unsure whether it's paid content or not.
    words: [konten berbayar, membujuk]
dialogue:
  title: Krim ajaib
  lines:
    - speaker: Kak Selvi
      text: Mohamed, lihat nih. Pemengaruh ini bilang krimnya bisa memutihkan kulit dalam tiga hari.
      ar_eg: يا محمد، بص على ده. المؤثّرة دي بتقول إن الكريم بتاعها بيبيّض البشرة في تلات أيام.
      ar: يا محمد، انظر. تقول هذه المؤثّرة إنّ كريمها يبيّض البشرة في ثلاثة أيام.
      en: Mohamed, look at this. This influencer says her cream whitens skin in three days.
    - speaker: Mohamed
      text: Tiga hari? Ini konten berbayar, ya?
      ar_eg: تلات أيام؟ ده محتوى مدفوع؟
      ar: ثلاثة أيام؟ أهذا محتوى مدفوع؟
      en: Three days? Is this paid content?
    - speaker: Kak Selvi
      text: 'Nggak ada tanda #iklan. Tapi di keterangan ada diskon dari merek itu.'
      ar_eg: 'مافيش علامة #iklan. بس في الوصف فيه خصم من الماركة دي.'
      ar: 'لا علامة #iklan، لكنّ في الوصف تخفيض من تلك العلامة.'
      en: 'There''s no #iklan tag. But the caption has a discount from that brand.'
    - speaker: Mohamed
      text: Jadi ada kerja sama. Dia membujuk pengikutnya tanpa jujur.
      ar_eg: يبقى فيه تعاون. هي بتغري متابعينها من غير ما تبقى صريحة.
      ar: إذن ثمّة شراكة، وهي تستميل متابعيها دون صراحة.
      en: So there's a collaboration. She's coaxing her followers without being honest.
