schema: kabar.lesson/v1
id: bipa5.u05.l13
language: id
title: Ulangan Unit 5
can_do:
  ar_eg: تناقش الغابات وزيت النخيل من أكتر من زاوية، وبكلام دقيق.
  ar: أن تناقش الغابات وزيت النخيل من أكثر من زاوية وبعبارة دقيقة.
  en: Discuss forests and palm oil from more than one side, with careful wording.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: terbakar
        ar_eg: ولّع / اتحرق
        ar: احترق
        en: caught fire
      - text: punah
        ar_eg: ينقرض
        ar: ينقرض
        en: to go extinct
      - text: petani
        ar_eg: فلاح
        ar: مزارع
        en: farmer
      - text: sudut pandang
        ar_eg: وجهة نظر
        ar: وجهة نظر
        en: point of view
      - text: terancam
        ar_eg: مهدَّد
        ar: مهدَّد
        en: threatened
    words: [terbakar, punah, petani, sudut pandang, terancam]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الحريقة حصلت من غير قصد بسبب الجفاف. تقول إيه؟
      ar: شبّ الحريق بلا قصد بسبب الجفاف. ماذا تقول؟
      en: The fire started by accident because of the drought. What do you say?
    options:
      - Lahan itu dibakar.
      - Lahan itu terbakar.
      - Lahan itu membakar.
    answer: 1
    words: [terbakar]
    explain:
      ar_eg: من غير قصد = terbakar (ter- = حصل لوحده). dibakar = حد حرقها، وmembakar = هي اللي بتحرق.
      ar: بلا قصد = terbakar (ter- للحدوث العفوي). أما dibakar فأحرقها أحد، وmembakar أنها هي التي تحرق.
      en: By accident is terbakar (ter- for unintended). dibakar means someone burnt it, and membakar that it burns something.
  - id: e03
    type: fill_blank
    sentence: Warga desa ___ karena hujan turun tiga hari.
    meaning:
      ar_eg: أهل القرية غرقوا في الفيضان عشان المطر نزل تلات أيام.
      ar: غمر الفيضان أهل القرية بعد مطر دام ثلاثة أيام.
      en: The villagers got flooded because it rained for three days.
    options: [kebanjiran, terbakar, punah]
    answers: [kebanjiran]
    words: [kebanjiran]
    explain:
      ar_eg: الناس «جالهم فيضان» = kebanjiran. terbakar = ولّعوا وpunah = انقرضوا، والسبب مطر.
      ar: أصابهم الفيضان = kebanjiran. أما terbakar فـ«احترقوا»، وpunah «انقرضوا»، والسبب مطر.
      en: Rain means they got kebanjiran (flooded). terbakar (burnt) and punah (extinct) don't follow rain.
  - id: e04
    type: listen
    text: Menurut aktivis, pemerintah seharusnya melindungi hutan adat.
    question:
      ar_eg: ده رأي ولا حقيقة؟ وبيقول إيه؟
      ar: أهذا رأي أم حقيقة؟ وماذا يقول؟
      en: Opinion or fact, and what does it say?
    options:
      - حقيقة، الحكومة حمت الغابة.
      - رأي، الناشطين شايفين إن الحكومة المفروض تحمي غابة الأعراف.
      - حقيقة، مفيش غابات عرفية.
    answer: 1
    words: [seharusnya, hutan adat]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أغلب الفلاحين محتاجين دخل ثابت.
      ar: يحتاج معظم المزارعين إلى دخل ثابت.
      en: Most farmers need a steady income.
    answer: Sebagian besar petani membutuhkan penghasilan yang tetap.
    distractors: [semua, punah]
    words: [sebagian besar, petani, penghasilan]
    explain:
      ar_eg: «أغلب» = Sebagian besar، و«دخل ثابت» = penghasilan yang tetap. semua = كل (أكتر من «أغلب»)، وpunah = انقرض.
      ar: «معظم» = Sebagian besar، و«دخل ثابت» = penghasilan yang tetap. أما semua فـ«كلّ» وهي أوسع، وpunah «انقرض».
      en: "\"Most\" is sebagian besar and \"steady income\" penghasilan yang tetap. semua (all) is too strong, and punah is unrelated."
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لو الغابة اختفت، الأورانجوتان ممكن ينقرض.
      ar: إن اختفت الغابة قد ينقرض إنسان الغاب.
      en: If the forest disappears, orangutans could go extinct.
    answers:
      - Kalau hutan hilang, orangutan bisa punah.
      - Jika hutan hilang, orangutan bisa punah.
      - Kalau hutannya hilang, orangutan bisa punah.
      - Jika hutan hilang, orangutan dapat punah.
    words: [punah]
  - id: e07
    type: match_pairs
    pairs:
      - text: rawa
        ar_eg: مستنقع
        ar: مستنقع
        en: swamp
      - text: limbah
        ar_eg: مخلفات
        ar: مخلّفات
        en: waste
      - text: bara
        ar_eg: جمر
        ar: جمر
        en: embers
      - text: gugatan
        ar_eg: دعوى
        ar: دعوى
        en: lawsuit
      - text: subur
        ar_eg: خصب
        ar: خصب
        en: fertile
    words: [rawa, limbah, bara, gugatan, subur]
  - id: e08
    type: listen
    text: Gawat! Limbah pabrik masuk ke rawa dan banyak katak mati.
    question:
      ar_eg: حصل إيه؟
      ar: ماذا حدث؟
      en: What happened?
    options: [ضفادع كتير ماتت, الشجر اتحرق, النهر نشف]
    answer: 0
    meaning:
      ar_eg: يا نهار! مخلفات المصنع دخلت المستنقع وضفادع كتير ماتت.
      ar: يا للكارثة! دخلت مخلّفات المصنع المستنقع ومات كثير من الضفادع.
      en: This is bad! Factory waste got into the swamp and lots of frogs died.
    words: [gawat, limbah, rawa, katak]
  - id: e09
    type: dictation
    text: Kedua pihak harus mencari solusi bersama.
    meaning:
      ar_eg: الطرفين لازم يدوّروا على حل مع بعض.
      ar: على الطرفين أن يبحثا عن حلّ معًا.
      en: Both sides must look for a solution together.
    words: [pihak, solusi]
  - id: e10
    type: speaking
    text: Situasinya cukup serius, tetapi masyarakat adat membantu melestarikan hutan.
    meaning:
      ar_eg: الوضع خطير لحد ما، بس المجتمعات الأصلية بتساعد تحافظ على الغابة.
      ar: الوضع خطير إلى حدّ ما، لكنّ الشعوب الأصلية تساعد على صون الغابة.
      en: The situation is fairly serious, but indigenous communities help conserve the forest.
    words: [masyarakat adat, melestarikan]
  - id: e11
    type: fill_blank
    sentence: Api sudah ___, tetapi bara gambut masih menyala dan kabut asap belum hilang.
    meaning:
      ar_eg: النار ___، بس جمر الخث لسه والع والضباب الدخاني لسه ما راحش.
      ar: ___ت النار، لكن جمر الخث ما زال مشتعلًا والضباب الدخاني لم يزُل.
      en: The fire has ___, but the peat embers still glow and the haze hasn't cleared.
    options: [padam, lebat, dangkal]
    answers: [padam]
    words: [padam, lebat, dangkal, bara, kabut asap]
    explain:
      ar_eg: النار «انطفت» = padam، بس الجمر لسه والع. lebat = كثيف وdangkal = ضحل، مش للنار.
      ar: انطفأت النار = padam، مع أنّ الجمر ما زال مشتعلًا. أما lebat فـ«كثيف»، وdangkal «ضحل».
      en: The fire has padam (gone out), though the embers glow. lebat (dense) and dangkal (shallow) don't fit fire.
  - id: e12
    type: multiple_choice
    question: 'Hakim membacakan ___: perusahaan harus membayar ganti rugi.'
    options: [putusan, musibah, benih]
    answer: 0
    explain:
      ar_eg: putusan = حكم المحكمة.
      ar: putusan = حكم المحكمة.
      en: putusan = the ruling.
    words: [putusan, musibah, benih]
dialogue:
  title: Perpisahan di Tanjung Puting
  lines:
    - speaker: Mas Rizal
      text: Gimana, Mohamed? Yang paling kamu inget dari Tanjung Puting apa?
      ar_eg: إيه يا محمد؟ إيه أكتر حاجة هتفتكرها من تانجونج بوتينج؟
      ar: ما رأيك يا محمد؟ ما أكثر ما ستذكره من تانجونغ بوتينغ؟
      en: So, Mohamed? What will you remember most from Tanjung Puting?
    - speaker: Mohamed
      text: Orangutan muda yang dirawat di Camp Leakey. Mereka terancam, tapi masih ada harapan.
      ar_eg: الأورانجوتان الصغيرين اللي بيتربّوا في كامب ليكي. هما مهدّدين، بس لسه فيه أمل.
      ar: صغار إنسان الغاب في كامب ليكي؛ إنها مهدَّدة لكنّ الأمل باقٍ.
      en: The young orangutans being cared for at Camp Leakey. They're threatened, but there's still hope.
    - speaker: Mas Rizal
      text: Terus soal sawit?
      ar_eg: وموضوع النخيل؟
      ar: وماذا عن مسألة النخيل؟
      en: And the palm oil issue?
    - speaker: Mohamed
      text: Menurutku, petani sama hutan sama-sama harus dilindungi.
      ar_eg: في رأيي، الفلاحين والغابة الاتنين لازم يتحموا.
      ar: في رأيي، يجب أن يُحمى المزارعون والغابة معًا.
      en: In my view, both the farmers and the forest must be protected.
souvenir:
  id: bipa5.u05.souvenir
  title: Orangutan di Camp Leakey
  note:
    ar_eg: كامب ليكي في محمية تانجونج بوتينج مركز اتأسس سنة 1971 لدراسة الأورانجوتان ورعاية اليتامى منهم. بتوصله بمركب خشب اسمه klotok، بتنام فيه على النهر. الاسم نفسه ملايو، orang hutan يعني «إنسان الغابة»، وده سبب إن العربي بيسمّيه «إنسان الغاب».
    ar: كامب ليكي في منتزه تانجونغ بوتينغ مركز أُسّس سنة 1971 لدراسة إنسان الغاب ورعاية أيتامه، ويُبلَغ بمركب خشبي يسمّى klotok يُبات فيه على النهر. والاسم ملايوي، فـ orang hutan تعني «إنسان الغابة»، ومنه جاءت تسميته العربية «إنسان الغاب».
    en: Camp Leakey in Tanjung Puting National Park was founded in 1971 to study orangutans and care for orphans. You reach it by a wooden boat called a klotok and sleep aboard on the river. The name itself is Malay, orang hutan meaning "person of the forest", which is why Arabic calls it "insan al-ghab".
