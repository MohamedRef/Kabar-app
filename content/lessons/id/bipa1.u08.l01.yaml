schema: kabar.lesson/v1
id: bipa1.u08.l01
language: id
title: Dia ramah
can_do:
  ar_eg: توصف شخصية حد.
  ar: أن تصف شخصية أحدهم.
  en: Describe what someone is like as a person.
slides:
  - title: Sifat = صفة
    body:
      ar_eg: |
        كلمة sifat جاية من العربي «صفة»، ومعناها طبع الإنسان وشخصيته. Sifat-sifat يعني «الصفات».
        والوصف سهل جدًا: الشخص + الصفة على طول، من غير «يكون»، زي ما بنقول بالظبط «هي لطيفة».
      ar: |
        كلمة sifat مأخوذة من العربية «صفة»، وتعني طبع الإنسان. وSifat-sifat جمعها.
        والوصف بسيط: الشخص ثم الصفة مباشرة دون فعل كينونة، كما نقول «هي لطيفة».
      en: |
        sifat comes from Arabic «صفة»: a person's character. Sifat-sifat = qualities.
        Describing is simple: person + adjective, with no "is" — just like Arabic «هي لطيفة».
    examples:
      - text: Dia ramah.
        ar_eg: هي لطيفة وبشوشة.
        ar: هي ودودة.
        en: She's friendly.
      - text: Pak Budi sabar sekali.
        ar_eg: الأستاذ بودي صبور جدًا.
        ar: الأستاذ بودي صبور جدًا.
        en: Mr Budi is very patient.
  - title: Ramah, sabar, rajin…
    body:
      ar_eg: |
        صفات الشخصية بتيجي أزواج عكس بعض، احفظهم مع بعض:
        - ramah (بشوش ولطيف) ↔ pendiam (هادي، قليل الكلام)
        - rajin (مجتهد) ↔ malas (كسلان)
        - sabar (صبور) — من العربي «صبر»
        - pintar (شاطر، ذكي)، lucu (دمه خفيف، وكمان «كيوت» للأطفال والحاجات)
      ar: |
        تأتي صفات الطبع غالبًا أزواجًا متضادة:
        - ramah (ودود) ↔ pendiam (قليل الكلام)
        - rajin (مجتهد) ↔ malas (كسول)
        - sabar (صبور) — من العربية «صبر»
        - pintar (ذكي)، lucu (ظريف، ويقال للطفل والشيء اللطيف أيضًا)
      en: |
        Character words often come in opposite pairs; learn them together:
        - ramah (friendly) ↔ pendiam (quiet, reserved)
        - rajin (hard-working) ↔ malas (lazy)
        - sabar (patient) — from Arabic «صبر»
        - pintar (smart), lucu (funny; also "cute" for children and things)
    examples:
      - text: Rina rajin. Dimas agak malas!
        ar_eg: رينا مجتهدة. ديماس كسلان شوية!
        ar: رينا مجتهدة، وديماس كسول قليلًا!
        en: Rina is hard-working. Dimas is a bit lazy!
      - text: Teman saya pintar dan lucu.
        ar_eg: صاحبي شاطر ودمه خفيف.
        ar: صديقي ذكي وظريف.
        en: My friend is smart and funny.
  - title: Orangnya bagaimana?
    body:
      ar_eg: |
        عشان تسأل عن شخصية حد: Orangnya bagaimana? = هو إنسان عامل إزاي؟
        والرد: Orangnya ramah = هو إنسان لطيف.
        الإندونيسيين بيوصفوا بأدب، وكتير بيلطّفوا الكلام بـ agak (شوية): Dia agak pendiam = هو هادي شوية. ده أحسن من إنك تقول صفة وحشة على طول.
      ar: |
        للسؤال عن طبع شخص: Orangnya bagaimana؟ = كيف هو شخصيًّا؟
        والجواب: Orangnya ramah = إنه شخص ودود.
        ويصف الإندونيسيون الناس بلطف، فيخففون الوصف بـ agak (قليلًا): Dia agak pendiam = هو هادئ قليلًا.
      en: |
        To ask what someone is like: Orangnya bagaimana? = What is he / she like?
        Answer: Orangnya ramah = He's a friendly person.
        Indonesians describe people gently and often soften with agak (a bit): Dia agak pendiam = He's a bit quiet.
    examples:
      - text: Orangnya bagaimana? — Orangnya sabar.
        ar_eg: هو عامل إزاي كإنسان؟ — هو صبور.
        ar: كيف هو؟ — إنه صبور.
        en: What's he like? — He's patient.
      - text: Dia agak malas.
        ar_eg: هو كسلان شوية.
        ar: هو كسول قليلًا.
        en: He's a bit lazy.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ramah
        ar_eg: بشوش ولطيف
        ar: ودود
        en: friendly
      - text: rajin
        ar_eg: مجتهد
        ar: مجتهد
        en: hard-working
      - text: malas
        ar_eg: كسلان
        ar: كسول
        en: lazy
      - text: sabar
        ar_eg: صبور
        ar: صبور
        en: patient
      - text: lucu
        ar_eg: دمه خفيف
        ar: ظريف
        en: funny
    words: [ramah, rajin, malas, sabar, lucu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: ني لوه بتسلّم على كل الناس وبتتكلم مع الكل بابتسامة. هي…
      ar: ني لوه تحيّي الجميع وتتحدث مع كل أحد مبتسمة. هي…
      en: Ni Luh greets everyone and chats with everybody with a smile. She is…
    options: [malas, ramah, pendiam]
    answer: 1
    explain:
      ar_eg: اللي بيتكلم مع الكل ببشاشة يبقى ramah. pendiam عكسها.
      ar: من يحادث الجميع ببشاشة ramah، وpendiam ضدها.
      en: Someone warm and chatty with everyone is ramah; pendiam is the opposite.
    words: [ramah, pendiam]
  - id: e03
    type: fill_blank
    sentence: Kakak saya ___ sekali. Dia belajar setiap hari.
    meaning:
      ar_eg: أخويا الكبير مجتهد جدًا. بيذاكر كل يوم.
      ar: أخي الأكبر مجتهد جدًا، يدرس كل يوم.
      en: My older brother is very hard-working. He studies every day.
    options: [pendek, rajin, malas]
    answers: [rajin]
    explain:
      ar_eg: اللي بيذاكر كل يوم مجتهد، يعني rajin.
      ar: من يدرس كل يوم مجتهد، أي rajin.
      en: Someone who studies every day is rajin.
    words: [rajin]
  - id: e04
    type: build_sentence
    source:
      ar_eg: صاحبي لطيف جدًا.
      ar: صديقي ودود جدًا.
      en: My friend is very friendly.
    answer: Teman saya sangat ramah.
    distractors: [malas, rambut]
    words: [teman, ramah]
  - id: e05
    type: translate
    direction: from_target
    source_text: Pak Budi sabar sekali.
    answers_meaning:
      ar_eg: [الأستاذ بودي صبور جدًا., الأستاذ بودي صبور قوي, أستاذ بودي صبور أوي]
      ar: [الأستاذ بودي صبور جدًا., السيد بودي صبور جدًا]
      en: [Mr Budi is very patient., Pak Budi is very patient, Mr. Budi is very patient]
    words: [sabar]
  - id: e06
    type: dictation
    text: Orangnya ramah.
    meaning:
      ar_eg: هو إنسان لطيف.
      ar: إنه شخص ودود.
      en: He's a friendly person.
    words: [ramah]
  - id: e07
    type: speaking
    text: Teman saya pintar dan lucu.
    meaning:
      ar_eg: صاحبي شاطر ودمه خفيف.
      ar: صديقي ذكي وظريف.
      en: My friend is smart and funny.
    words: [pintar, lucu]
dialogue:
  title: Teman baru di Glodok
  lines:
    - speaker: Dimas
      text: Rina, siapa itu?
      ar_eg: يا رينا، مين دي؟
      ar: يا رينا، من تلك؟
      en: Rina, who's that?
    - speaker: Rina
      text: Itu Ni Luh, teman saya dari Bali.
      ar_eg: دي ني لوه، صاحبتي من بالي.
      ar: تلك ني لوه، صديقتي من بالي.
      en: That's Ni Luh, my friend from Bali.
    - speaker: Dimas
      text: Orangnya bagaimana?
      ar_eg: هي عاملة إزاي كإنسانة؟
      ar: كيف هي شخصيًّا؟
      en: What's she like?
    - speaker: Rina
      text: Dia ramah sekali dan lucu. Dia juga pintar!
      ar_eg: لطيفة جدًا ودمها خفيف. وكمان شاطرة!
      ar: ودودة جدًا وظريفة، وذكية أيضًا!
      en: She's really friendly and funny. She's smart too!
