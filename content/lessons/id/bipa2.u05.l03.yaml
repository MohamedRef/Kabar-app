schema: kabar.lesson/v1
id: bipa2.u05.l03
language: id
title: Masukkan, tambahkan
can_do:
  ar_eg: تمشي على وصفة وتدّي تعليماتها.
  ar: أن تتبع تعليمات وصفة وتعطيها.
  en: Follow and give recipe instructions.
slides:
  - title: Duduk! Berhenti! Coba cicipi!
    body:
      ar_eg: |
        - الكلمات اللي من غير بادئة بتفضل زي ما هي: Duduk! = اقعد! Masuk! = ادخل!
        - أفعال ber- غالبًا بتفضل بالبادئة: Berhenti! = اقف! Berdiri! = قوم اقف!
        وعشان تبقى ألطف:
        - coba + فعل = جرّب / بص كده: Coba cicipi! = دوق كده!
        - الفعل + lah = أرق وأرسمي شوية: Duduklah = اتفضل اقعد.
      ar: |
        - الأفعال المجردة تبقى كما هي: Duduk! = اجلس! Masuk! = ادخل!
        - وأفعال ber- تحتفظ غالبًا بسابقتها: Berhenti! = قف!
        وللتلطيف:
        - coba + فعل = جرّب: Coba cicipi! = تذوّق!
        - الفعل + lah أرقّ وأرسم: Duduklah = تفضّل بالجلوس.
      en: |
        - Bare roots stay as they are: Duduk! = Sit! Masuk! = Come in!
        - ber- verbs usually keep ber-: Berhenti! = Stop! Berdiri! = Stand up!
        To sound softer:
        - coba + verb = try: Coba cicipi! = Have a taste!
        - verb + -lah = gentler, a bit formal: Duduklah = Do sit down.
    grammar: id.imperative.basic
    examples:
      - text: Coba cicipi sambalnya!
        ar_eg: دوق الشطة كده!
        ar: تذوّق الصلصة الحارّة!
        en: Have a taste of the sambal!
      - text: Berhenti! Minyaknya terlalu panas.
        ar_eg: اقف! الزيت سخن زيادة.
        ar: توقّف! الزيت ساخن أكثر من اللازم.
        en: Stop! The oil is too hot.
  - title: Masukkan, tambahkan
    body:
      ar_eg: |
        في الوصفات هتلاقي أوامر آخرها -kan، يعني «حط / خلّي الحاجة دي…»:
        - Masukkan nasi = حط الرز (دخّله).
        - Tambahkan garam = زوّد ملح.
        ورتّب الخطوات بـ lalu (وبعدين)، وsampai = لحد ما: goreng sampai harum = اقلي لحد ما ريحته تطلع.
        aduk rata = قلّب كويس لحد ما يبقى متساوي.
      ar: |
        في الوصفات تكثر أوامر تنتهي بـ -kan بمعنى «اجعل الشيء…»:
        - Masukkan nasi = أدخِل الأرز / ضعه.
        - Tambahkan garam = أضِف الملح.
        وتُرتّب الخطوات بـ lalu (ثم)، وsampai = حتى: goreng sampai harum = اقلِ حتى تفوح الرائحة.
        وaduk rata = قلّب جيدًا حتى يتجانس.
      en: |
        Recipes use commands ending in -kan, meaning "put / make it …":
        - Masukkan nasi = Put in the rice.
        - Tambahkan garam = Add salt.
        Chain steps with lalu (then); sampai = until: goreng sampai harum = fry until fragrant.
        aduk rata = stir until evenly mixed.
    grammar: id.imperative.basic
    examples:
      - text: Masukkan nasi dan aduk rata.
        ar_eg: حط الرز وقلّب كويس.
        ar: أضف الأرز وقلّبه جيدًا.
        en: Add the rice and stir well.
      - text: Tambahkan sedikit garam.
        ar_eg: زوّد شوية ملح.
        ar: أضف قليلًا من الملح.
        en: Add a little salt.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تقول لحد «اقف!» من berhenti. تقول إيه؟
      ar: تريد أن تقول «قف!» من الفعل berhenti. ماذا تقول؟
      en: You want to say "Stop!" from berhenti. What do you say?
    options: [Henti!, Menghenti!, Berhenti!]
    answer: 2
    explain:
      ar_eg: أفعال ber- غالبًا بتفضل زي ما هي في الأمر.
      ar: أفعال ber- تحتفظ غالبًا بسابقتها في الأمر.
      en: ber- verbs usually keep ber- in commands.
    words: [berhenti]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك داق الشوربة وقال إنها مش مالحة كفاية. أنهي تعليمة تنفع؟
      ar: تذوّق صديقك الحساء وقال إنه ينقصه ملح. أيّ تعليمة تناسب؟
      en: Your friend tasted the soup and says it needs salt. Which instruction fits?
    options: [Rebus garam., Tambahkan garam., Cuci garam.]
    answer: 1
    words: [tambahkan, garam]
    explain:
      ar_eg: ناقصها ملح يبقى Tambahkan garam (زوّد ملح). Rebus = اسلق وCuci = اغسل، ودول مالهمش معنى مع الملح.
      ar: ينقصها ملح، فـ Tambahkan garam. أما Rebus فـ«اسلق» وCuci «اغسل».
      en: "Needs salt: Tambahkan garam (add salt). Rebus (boil) and Cuci (wash) make no sense with salt."
  - id: e03
    type: fill_blank
    sentence: Masukkan nasi, lalu ___ rata.
    meaning:
      ar_eg: حط الرز، وبعدين قلّب كويس.
      ar: أضف الأرز ثم قلّبه جيدًا.
      en: Put in the rice, then stir well.
    options: [mengaduk, aduk, cuci]
    answers: [aduk]
    words: [aduk, rata, masukkan]
    explain:
      ar_eg: "تعليمات الوصفة بالجذر: aduk (قلّب). mengaduk للوصف («بيقلّب»)، وcuci = اغسل."
      ar: "تعليمات الوصفة بالجذر: aduk. أما mengaduk فللوصف وcuci «اغسل»."
      en: "Recipe steps use the root: aduk (stir). mengaduk describes; cuci means wash."
  - id: e04
    type: build_sentence
    source:
      ar_eg: دوق الشطة كده!
      ar: تذوّق الصلصة الحارّة!
      en: Have a taste of the sambal!
    answer: Coba cicipi sambalnya!
    distractors: [mencicipi, jangan]
    words: [coba, cicipi]
    explain:
      ar_eg: Coba + أمر = «جرّب…»، وcicipi = دوق. mencicipi مش أمر، وjangan عكس المعنى.
      ar: Coba + أمر = «جرّب»، وcicipi = تذوّق. أما mencicipi فليس أمرًا وjangan تعكس المعنى.
      en: Coba + command = "have a…", cicipi = taste. mencicipi isn't a command; jangan flips the meaning.
  - id: e05
    type: match_pairs
    pairs:
      - text: cicipi
        ar_eg: دوق
        ar: تذوّق
        en: taste
      - text: masukkan
        ar_eg: حط، دخّل
        ar: ضَع
        en: put in
      - text: tambahkan
        ar_eg: زوّد، ضيف
        ar: أضِف
        en: add
      - text: rata
        ar_eg: متساوي، كويس
        ar: متساوٍ
        en: even
      - text: berhenti
        ar_eg: يقف، يبطّل
        ar: يتوقف
        en: stop
      - text: garam
        ar_eg: ملح
        ar: ملح
        en: salt
    words: [cicipi, masukkan, tambahkan, rata, berhenti, garam]
  - id: e06
    type: translate
    direction: from_target
    source_text: Tambahkan sedikit garam, lalu aduk.
    answers_meaning:
      ar_eg: [زوّد شوية ملح، وبعدين قلّب., حط شوية ملح وقلّب]
      ar: [أضف قليلًا من الملح ثم قلّب., أضف قليلًا من الملح وقلّب]
      en: ['Add a little salt, then stir.', Add some salt and stir, Add a little salt and stir]
    words: [tambahkan, garam, aduk]
  - id: e07
    type: speaking
    text: Duduklah, Bu. Coba cicipi nasi gorengnya!
    meaning:
      ar_eg: اتفضلي اقعدي يا مدام. دوقي الرز المقلي كده!
      ar: تفضّلي بالجلوس يا سيدتي، وتذوّقي الأرز المقلي!
      en: Do sit down, ma'am. Have a taste of the fried rice!
    words: [duduk, coba, cicipi]
  - id: e08
    type: listen
    text: Berhenti! Jangan tambahkan garam lagi.
    options: ['Berhenti! Jangan tambahkan garam lagi.', 'Berhenti! Jangan masukkan garam lagi.', 'Cicipi! Jangan tambahkan garam lagi.']
    answer: 0
    meaning:
      ar_eg: بس! ماتزوّدش ملح تاني.
      ar: توقّف! لا تُضِف ملحًا بعد الآن.
      en: Stop! Don't add any more salt.
    words: [berhenti, tambahkan, masukkan, cicipi]
  - id: e09
    type: fill_blank
    sentence: Aduk sampai ___.
    meaning:
      ar_eg: قلّب لحد ما يتساوى كويس.
      ar: قلّب حتى يتجانس.
      en: Stir until even.
    options: [rata, berhenti, cicipi]
    answers: [rata]
    words: [aduk, rata]
    explain:
      ar_eg: sampai rata = لحد ما يتساوى. berhenti = يقف، وcicipi = دوق.
      ar: sampai rata = حتى يتجانس. أما berhenti فـ«يتوقف» وcicipi «تذوّق».
      en: sampai rata = until even. berhenti is stop, cicipi is taste.
dialogue:
  title: Dapur Ni Luh
  lines:
    - speaker: Ni Luh
      text: Ayo, kita masak! Cuci bawang merah dan bawang putih dulu.
      ar_eg: يلا نطبخ! اغسل البصل الأحمر والتوم الأول.
      ar: هيا نطبخ! اغسل البصل الأحمر والثوم أولًا.
      en: Come on, let's cook! Wash the shallots and garlic first.
    - speaker: Mohamed
      text: Sudah. Lalu?
      ar_eg: خلاص. وبعدين؟
      ar: انتهيت. ثم ماذا؟
      en: Done. Then?
    - speaker: Ni Luh
      text: Potong bawangnya, lalu goreng dengan sedikit minyak.
      ar_eg: قطّع البصل، وبعدين اقليه بشوية زيت.
      ar: قطّع البصل ثم اقلِه بقليل من الزيت.
      en: Cut the onions, then fry them in a little oil.
    - speaker: Mohamed
      text: Wah, harum sekali!
      ar_eg: الله، ريحته حلوة قوي!
      ar: يا للروعة، رائحته زكية جدًّا!
      en: Wow, it smells so good!
    - speaker: Ni Luh
      text: Sekarang masukkan nasi dan aduk rata. Coba cicipi!
      ar_eg: دلوقتي حط الرز وقلّب كويس. دوق كده!
      ar: الآن أضف الأرز وقلّبه جيدًا. تذوّقه!
      en: Now put in the rice and stir well. Have a taste!
    - speaker: Mohamed
      text: Lezat! Tapi tambahkan sedikit garam, ya.
      ar_eg: لذيذ! بس زوّدي شوية ملح.
      ar: لذيذ! لكن أضيفي قليلًا من الملح.
      en: Delicious! But add a little salt.
new_words:
  - word: cicipi
    pos: verb
    ar_eg: دوق (mencicipi = يدوق)
    ar: تذوّق (mencicipi = يتذوّق)
    en: taste (mencicipi = to taste)
  - word: masukkan
    pos: verb
    ar_eg: حط / دخّل (في الوصفة)
    ar: أدخِل / ضَع
    en: put in, add
  - word: tambahkan
    pos: verb
    ar_eg: زوّد / ضيف
    ar: أضِف
    en: add
  - word: rata
    pos: adjective
    ar_eg: متساوي (aduk rata = قلّب كويس)
    ar: متساوٍ (aduk rata = قلّب جيدًا)
    en: even (aduk rata = stir well)
  - word: berhenti
    pos: verb
    ar_eg: يقف / يبطّل
    ar: يتوقّف
    en: to stop
