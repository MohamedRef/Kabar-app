schema: kabar.lesson/v1
id: bipa6.u08.l06
language: id
title: Metode ilmiah
can_do:
  ar_eg: توصف تجربة علمية بسيطة خطوة بخطوة وتفهم ليه محتاجين مجموعة ضابطة.
  ar: أن تصف تجربة علمية بسيطة خطوة خطوة وتفهم الحاجة إلى مجموعة ضابطة.
  en: Describe a simple experiment step by step and see why you need a control group.
slides:
  - title: Kacang hijau di jendela
    body:
      ar_eg: |
        Bu Laila بتعمل تجربة: هل النور بيأثر على طول نبات الفول الأخضر (kacang hijau)؟
        - metode ilmiah = المنهج العلمي: سؤال، تجربة، نتيجة
        - variabel = المتغيّر: هنا كمية النور
        - kelompok kontrol = المجموعة الضابطة: نباتات في ظروف عادية عشان نقارن
        - mengukur = يقيس: Kami mengukur tinggi tanaman setiap hari.
        - mengulang = يعيد: العالِم بيعيد التجربة كذا مرة عشان يتأكد.
        - في الشارع: nggak = tidak (لأ / مش)، terus = lalu (وبعدين).
        - kok كلمة صغيرة بتدّي الجملة إحساس (استغراب)، ومن غيرها الجملة صح برضه.
      ar: |
        تجري Bu Laila تجربة: هل يؤثّر الضوء في طول نبات الماش (kacang hijau)؟
        - metode ilmiah = المنهج العلمي: سؤال فتجربة فنتيجة
        - variabel = المتغيّر، وهو هنا مقدار الضوء
        - kelompok kontrol = المجموعة الضابطة: نباتات في ظروف عادية للمقارنة
        - mengukur = يقيس: Kami mengukur tinggi tanaman setiap hari.
        - mengulang = يكرّر: يكرّر العالِم التجربة مرّات ليتأكّد.
        - في كلام الشارع: nggak = tidak (لا / ليس)، terus = lalu (ثمّ).
        - kok أداة صغيرة تلوّن الجملة (استغراب)، والجملة صحيحة بدونها.
      en: |
        Bu Laila runs an experiment: does light affect how tall mung bean (kacang hijau) sprouts grow?
        - metode ilmiah = the scientific method: question, experiment, result
        - variabel = variable; here, the amount of light
        - kelompok kontrol = control group: plants in normal conditions to compare against
        - mengukur = to measure: Kami mengukur tinggi tanaman setiap hari.
        - mengulang = to repeat: a scientist repeats an experiment several times to be sure.
        - On the street: nggak = tidak (no, not), terus = lalu (then).
        - kok is a small particle that adds feeling (surprise); the sentence is correct without it.
    examples:
      - text: Kelompok kontrol diletakkan di dekat jendela, sedangkan kelompok lain di dalam lemari.
        ar_eg: المجموعة الضابطة اتحطت جنب الشباك، والمجموعة التانية جوه الدولاب.
        ar: وُضعت المجموعة الضابطة قرب النافذة، والمجموعة الأخرى داخل الخزانة.
        en: The control group was placed by the window, the other group inside a cupboard.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: metode ilmiah
        ar_eg: المنهج العلمي
        ar: المنهج العلمي
        en: scientific method
      - text: variabel
        ar_eg: متغيّر
        ar: متغيّر
        en: variable
      - text: kelompok kontrol
        ar_eg: مجموعة ضابطة
        ar: مجموعة ضابطة
        en: control group
      - text: mengukur
        ar_eg: يقيس
        ar: يقيس
        en: to measure
      - text: mengulang
        ar_eg: يعيد
        ar: يكرّر
        en: to repeat
    words: [metode ilmiah, variabel, kelompok kontrol, mengukur, mengulang]
  - id: e02
    type: listen
    text: Setiap pagi kami mengukur tinggi tanaman dengan penggaris.
    question:
      ar_eg: بيقيسوا إيه كل يوم الصبح؟
      ar: ماذا يقيسون كلّ صباح؟
      en: What do they measure every morning?
    options:
      - وزن الميه.
      - طول النبات.
      - حرارة الأوضة.
    answer: 1
    words: [mengukur]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه محتاجين kelompok kontrol؟
      ar: لماذا نحتاج إلى kelompok kontrol؟
      en: Why do we need a kelompok kontrol?
    options:
      - عشان التجربة تبقى أسرع.
      - عشان نوفر فلوس.
      - عشان نقارن بيها النتيجة.
    answer: 2
    words: [kelompok kontrol]
    explain:
      ar_eg: المجموعة الضابطة kelompok kontrol عشان نقارن بيها النتيجة. مش للسرعة ولا التوفير.
      ar: المجموعة الضابطة kelompok kontrol للمقارنة بالنتيجة، لا للسرعة ولا للتوفير.
      en: The control group lets us compare results. It isn't about speed or saving money.
  - id: e04
    type: fill_blank
    sentence: Dalam percobaan ini, ___ yang diubah hanya jumlah cahaya.
    meaning:
      ar_eg: في التجربة دي، المتغيّر الوحيد اللي اتغيّر هو كمية النور.
      ar: في هذه التجربة، المتغيّر الوحيد الذي يُغيَّر هو مقدار الضوء.
      en: In this experiment, the only variable changed is the amount of light.
    options: [variabel, kelompok kontrol, metode ilmiah]
    answers: [variabel]
    words: [variabel, percobaan]
    explain:
      ar_eg: الحاجة اللي بنغيّرها في التجربة variabel (متغيّر). kelompok kontrol مجموعة، وmetode ilmiah المنهج كله.
      ar: ما نغيّره في التجربة variabel (متغيّر)؛ أمّا kelompok kontrol فمجموعة، وmetode ilmiah المنهج كلّه.
      en: What you change is the variabel. kelompok kontrol is a group, and metode ilmiah the whole method.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: النتيجة غريبة. العالِم المفروض يعمل إيه؟
      ar: جاءت النتيجة غريبة. ماذا ينبغي للعالِم أن يفعل؟
      en: The result is odd. What should the scientist do?
    options:
      - يعيد التجربة.
      - يرمي النتيجة.
      - يغيّر الأرقام.
    answer: 0
    explain:
      ar_eg: 'mengulang جزء من الـ metode ilmiah: التجربة الكويسة لازم تدي نفس النتيجة تاني.'
      ar: mengulang جزء من الـ metode ilmiah، فالتجربة الجيّدة تعطي النتيجة نفسها مجدّدًا.
      en: mengulang is part of the metode ilmiah; a good experiment gives the same result again.
    words: [mengulang, metode ilmiah]
  - id: e06
    type: build_sentence
    source:
      ar_eg: العلماء بيستخدموا المنهج العلمي.
      ar: يستعمل العلماء المنهج العلمي.
      en: Scientists use the scientific method.
    answer: Para ilmuwan memakai metode ilmiah.
    distractors: [variabel, mengukur]
    words: [metode ilmiah, ilmuwan]
    explain:
      ar_eg: «المنهج العلمي» = metode ilmiah و«بيستخدموا» = memakai. variabel وmengukur مش في المعنى.
      ar: «المنهج العلمي» metode ilmiah و«يستعملون» memakai؛ أمّا variabel وmengukur فليستا في المعنى.
      en: "\"Scientific method\" is metode ilmiah and \"use\" is memakai. variabel and mengukur aren't in the meaning."
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لازم نعيد التجربة تلات مرات.
      ar: علينا أن نكرّر التجربة ثلاث مرّات.
      en: We have to repeat the experiment three times.
    answers:
      - Kita harus mengulang percobaan tiga kali.
      - Kami harus mengulang percobaan tiga kali.
      - Kita harus mengulang percobaan itu tiga kali.
      - Kita harus mengulangi percobaan tiga kali.
    words: [mengulang]
  - id: e08
    type: speaking
    text: Tanaman di kelompok kontrol tumbuh hijau dan kuat.
    meaning:
      ar_eg: النباتات اللي في المجموعة الضابطة طلعت خضرا وقوية.
      ar: نمت نباتات المجموعة الضابطة خضراء قويّة.
      en: The plants in the control group grew green and strong.
    words: [kelompok kontrol]
  - id: e09
    type: dictation
    text: Peneliti mengukur variabel yang sama setiap hari.
    meaning:
      ar_eg: الباحث بيقيس نفس المتغيّر كل يوم.
      ar: يقيس الباحث المتغيّر نفسه كلّ يوم.
      en: The researcher measures the same variable every day.
    words: [mengukur, variabel]
  - id: e10
    type: fill_blank
    sentence: Langkah pertama dalam ___ adalah bertanya.
    meaning:
      ar_eg: أول خطوة في المنهج العلمي إنك تسأل.
      ar: الخطوة الأولى في المنهج العلمي هي السؤال.
      en: The first step in the scientific method is asking a question.
    options: [metode ilmiah, kelompok kontrol, variabel]
    answers: [metode ilmiah]
    words: [metode ilmiah]
    explain:
      ar_eg: أول خطوة في المنهج العلمي metode ilmiah إنك تسأل. kelompok kontrol وvariabel أجزاء من التجربة.
      ar: أوّل خطوة في metode ilmiah السؤال؛ أمّا kelompok kontrol وvariabel فجزءان من التجربة.
      en: Asking is step one of the metode ilmiah. kelompok kontrol and variabel are parts of an experiment.
dialogue:
  title: Percobaan di dapur
  lines:
    - speaker: Aisyah
      text: Om, kok kacang hijau di lemari tumbuh tinggi tapi kuning?
      ar_eg: يا عمو، ليه الفول اللي في الدولاب طويل بس أصفر؟
      ar: يا عمّو، لماذا نما الماش في الخزانة طويلًا لكنه أصفر؟
      en: Uncle, why did the beans in the cupboard grow tall but yellow?
    - speaker: Mohamed
      text: Karena nggak ada cahaya. Cahaya itu variabelnya.
      ar_eg: عشان مافيش نور. النور هو المتغيّر.
      ar: لأنه لا ضوء هناك، والضوء هو المتغيّر.
      en: Because there's no light. Light is the variable.
    - speaker: Bu Laila
      text: Dan kacang di jendela adalah kelompok kontrol. Kita bandingkan keduanya.
      ar_eg: والفول اللي عند الشباك هو المجموعة الضابطة. هنقارن الاتنين.
      ar: والماش عند النافذة هو المجموعة الضابطة، وسنقارن بينهما.
      en: And the beans at the window are the control group. We compare the two.
    - speaker: Aisyah
      text: Besok aku mengukur lagi, terus kita ulang percobaannya, ya!
      ar_eg: بكرة هقيس تاني، وبعدين نعيد التجربة، ماشي!
      ar: سأقيس غدًا مجدّدًا، ثم نعيد التجربة، اتفقنا!
      en: Tomorrow I'll measure again, then we'll repeat the experiment, okay!
