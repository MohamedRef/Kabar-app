    type: match_pairs
    pairs:
      - text: reformasi
        ar_eg: إصلاح
        ar: إصلاح
        en: reform
      - text: demonstrasi
        ar_eg: مظاهرة
        ar: مظاهرة
        en: demonstration
      - text: krisis moneter
        ar_eg: أزمة مالية
        ar: أزمة نقدية
        en: financial crisis
      - text: mundur
        ar_eg: يستقيل / يتنحّى
        ar: يتنحّى
        en: to step down, to withdraw
      - text: tuntutan
        ar_eg: مطلب
        ar: مطلب
        en: demand
    words: [reformasi, demonstrasi, krisis moneter, mundur, tuntutan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي بدأ الأزمة على حسب النص؟
      ar: ما الذي بدأ الأزمة بحسب النصّ؟
      en: According to the text, what started the crisis?
    options:
      - انتخابات جديدة.
      - أزمة مالية في آسيا وقعت الروبية.
      - زلزال كبير.
    answer: 1
    words: [krisis moneter]
  - id: e03
    type: fill_blank
    sentence: ___ para mahasiswa hanya satu, yaitu reformasi.
    meaning:
      ar_eg: مطلب الطلبة كان واحد بس، وهو الإصلاح.
      ar: كان مطلب الطلّاب واحدًا، هو الإصلاح.
      en: The students had only one demand, reform.
    options: [Tuntutan, Demonstrasi, Mundur]
    answers: [Tuntutan]
    words: [tuntutan, reformasi]
  - id: e04
    type: listen
    text: Pada 21 Mei 1998, Presiden Soeharto mundur dari jabatannya.
    question:
      ar_eg: إيه اللي حصل يوم 21 مايو 1998؟
      ar: ماذا حدث في 21 مايو 1998؟
      en: What happened on 21 May 1998?
    options:
      - سوهارتو تنحّى عن منصبه.
      - سوهارتو اتنتخب من جديد.
      - الطلبة رجعوا الجامعة.
    answer: 0
    words: [mundur]
  - id: e05
    type: build_sentence
    source:
      ar_eg: المظاهرات انتشرت في مدن كتير.
      ar: انتشرت المظاهرات في مدن كثيرة.
      en: The demonstrations spread to many cities.
    answer: Demonstrasi menyebar ke banyak kota.
    distractors: [tuntutan, mundur]
    words: [demonstrasi]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: في «Peristiwa itu memicu kemarahan besar»، «Peristiwa itu» راجعة على إيه؟
      ar: على ماذا تعود «Peristiwa itu» في «Peristiwa itu memicu kemarahan besar»؟
      en: In "Peristiwa itu memicu kemarahan besar", what does "Peristiwa itu" refer to?
    options:
      - الأزمة المالية.
      - تنحّي سوهارتو.
      - مقتل الطلبة الأربعة في جامعة تريساكتي.
    answer: 2
    words: [demonstrasi]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الإصلاح فتح الباب للانتخابات الحرّة.
      ar: فتح الإصلاحُ الباب للانتخابات الحرّة.
      en: Reform opened the door to free elections.
    answers:
      - Reformasi membuka pintu bagi pemilu yang bebas.
      - Reformasi membuka jalan bagi pemilu yang bebas.
      - Reformasi membuka pintu untuk pemilihan umum yang bebas.
      - Reformasi membuka pintu bagi pemilihan umum yang bebas.
    words: [reformasi]
  - id: e08
    type: speaking
    text: Krisis moneter tahun 1997 membuat harga-harga naik tajam.
    meaning:
      ar_eg: الأزمة المالية سنة 1997 خلّت الأسعار تطلع جامد.
      ar: رفعت الأزمة النقدية عام 1997 الأسعار بحدّة.
      en: The 1997 financial crisis made prices shoot up.
    words: [krisis moneter]
  - id: e09
    type: dictation
    text: Tuntutan mahasiswa akhirnya didengar, dan presiden mundur.
    meaning:
      ar_eg: مطالب الطلبة اتسمعت في الآخر، والرئيس تنحّى.
      ar: سُمعت مطالب الطلّاب أخيرًا، وتنحّى الرئيس.
      en: The students' demands were finally heard, and the president stepped down.
    words: [tuntutan, mundur]
  - id: e10
    type: translate
    direction: from_target
    source_text: Era Reformasi dimulai setelah demonstrasi besar tahun 1998.
    answers_meaning:
      ar_eg:
        - عصر الإصلاح بدأ بعد المظاهرات الكبيرة سنة 1998.
        - فترة الإصلاح ابتدت بعد مظاهرات 1998 الكبيرة.
      ar:
        - بدأ عصر الإصلاح بعد المظاهرات الكبرى عام 1998.
        - انطلق عهد الإصلاح إثر مظاهرات 1998 الكبرى.
      en:
        - The Reform era began after the mass demonstrations of 1998.
        - The Reformasi era started after the big protests of 1998.
    words: [reformasi, demonstrasi]
dialogue:
  title: Kenangan Pak Hasan
  lines:
    - speaker: Pak Hasan
      text: Tahun 1998 saya masih mahasiswa di Makassar. Kami ikut demonstrasi setiap hari.
      ar_eg: سنة 1998 كنت لسه طالب في ماكاسار. كنا بنشارك في المظاهرات كل يوم.
      ar: كنتُ عام 1998 طالبًا في ماكاسار، وكنّا نشارك في المظاهرات كلّ يوم.
      en: In 1998 I was still a student in Makassar. We joined demonstrations every day.
    - speaker: Mohamed
      text: Apa tuntutan Bapak dan teman-teman waktu itu?
      ar_eg: إيه كانت مطالبك إنت وصحابك ساعتها؟
      ar: ما مطالبك ومطالب أصدقائك يومها؟
      en: What were you and your friends demanding back then?
    - speaker: Pak Hasan
      text: Reformasi. Harga beras naik berlipat-lipat karena krisis moneter.
      ar_eg: الإصلاح. سعر الرز كان طلع أضعاف بسبب الأزمة المالية.
      ar: الإصلاح. فقد تضاعف سعر الأرز أضعافًا بسبب الأزمة النقدية.
      en: Reform. The price of rice had multiplied because of the financial crisis.
    - speaker: Mohamed
      text: Dan ketika Soeharto mundur, bagaimana perasaan Bapak?
      ar_eg: ولما سوهارتو تنحّى، كان إحساسك إيه؟
      ar: وحين تنحّى سوهارتو، بمَ شعرت؟
      en: And when Soeharto stepped down, how did you feel?
