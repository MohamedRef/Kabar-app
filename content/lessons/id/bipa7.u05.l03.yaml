schema: kabar.lesson/v1
id: bipa7.u05.l03
language: id
title: Reformasi 1998
can_do:
  ar_eg: تقرا عن نقطة تحوّل في تاريخ إندونيسيا وتفهم أسبابها ونتايجها.
  ar: أن تقرأ عن منعطف في تاريخ إندونيسيا وتفهم أسبابه ونتائجه.
  en: Read about a turning point in Indonesian history and follow its causes and results.
slides:
  - title: Mei 1998
    body:
      ar_eg: |
        اقرا (ملخّص للدرس):
        Pada tahun 1997, krisis moneter melanda Asia. Nilai rupiah jatuh dan harga-harga naik. Mahasiswa di berbagai kota mengadakan demonstrasi. Tuntutan mereka satu, yaitu reformasi. Pada 12 Mei 1998, empat mahasiswa Universitas Trisakti tewas ditembak. Peristiwa itu memicu kemarahan besar. Akhirnya, pada 21 Mei 1998, Presiden Soeharto mundur setelah 32 tahun berkuasa.
        - krisis moneter = أزمة مالية / نقدية، demonstrasi = مظاهرات
        - tuntutan = مطلب، reformasi = إصلاح، mundur = يستقيل / يتنحّى
      ar: |
        اقرأ (ملخّص للدرس):
        Pada tahun 1997, krisis moneter melanda Asia. Nilai rupiah jatuh dan harga-harga naik. Mahasiswa di berbagai kota mengadakan demonstrasi. Tuntutan mereka satu, yaitu reformasi. Pada 12 Mei 1998, empat mahasiswa Universitas Trisakti tewas ditembak. Peristiwa itu memicu kemarahan besar. Akhirnya, pada 21 Mei 1998, Presiden Soeharto mundur setelah 32 tahun berkuasa.
        - krisis moneter = الأزمة النقدية، demonstrasi = المظاهرات
        - tuntutan = المطلب، reformasi = الإصلاح، mundur = يتنحّى
      en: |
        Read (a summary for the lesson):
        Pada tahun 1997, krisis moneter melanda Asia. Nilai rupiah jatuh dan harga-harga naik. Mahasiswa di berbagai kota mengadakan demonstrasi. Tuntutan mereka satu, yaitu reformasi. Pada 12 Mei 1998, empat mahasiswa Universitas Trisakti tewas ditembak. Peristiwa itu memicu kemarahan besar. Akhirnya, pada 21 Mei 1998, Presiden Soeharto mundur setelah 32 tahun berkuasa.
        - krisis moneter = financial (currency) crisis, demonstrasi = demonstrations
        - tuntutan = demand, reformasi = reform, mundur = to step down
