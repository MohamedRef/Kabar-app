schema: kabar.lesson/v1
id: bipa2.u03.l05
language: id
title: Kedatangan
can_do:
  ar_eg: 'تفهم إعلانات الوصول في المطار: البوابة والجوازات والفيزا والشنط.'
  ar: 'أن تفهم إعلانات الوصول في المطار: البوابة والجوازات والتأشيرة والأمتعة.'
  en: 'Follow airport arrival announcements: gate, immigration, visa and baggage.'
slides:
  - title: Di bandara
    body:
      ar_eg: |
        pengumuman = إعلان (من umum = عام). gerbang = بوابة: Gerbang 5.
        mendarat = تهبط (darat = أرض). kedatangan = الوصول (ke-datang-an)، والباب اللي بيستناك فيه صحابك: pintu kedatangan.
        imigrasi = الجوازات، وvisa = فيزا. وبعدها ambil bagasi: تاخد شنطك (ambil = ياخد).
      ar: |
        pengumuman = إعلان (من umum = عامّ). gerbang = بوابة: Gerbang 5.
        mendarat = تهبط (darat = البرّ). kedatangan = الوصول (ke-datang-an)، وpintu kedatangan حيث ينتظرك أصدقاؤك.
        imigrasi = الجوازات، وvisa = التأشيرة، ثم ambil bagasi: تأخذ أمتعتك (ambil = يأخذ).
      en: |
        pengumuman = announcement (umum = public). gerbang = gate: Gerbang 5.
        mendarat = land (darat = land). kedatangan = arrival (ke-datang-an); pintu kedatangan is where friends wait.
        imigrasi = immigration, visa = visa, then ambil bagasi: collect your baggage (ambil = take).
    examples:
      - text: Perhatian! Ini pengumuman untuk penumpang ke Bali.
        ar_eg: انتباه! ده إعلان لركاب بالي.
        ar: انتباه! هذا إعلان للمسافرين إلى بالي.
        en: Attention! This is an announcement for passengers to Bali.
      - text: Pesawat dari Kairo sudah mendarat.
        ar_eg: الطيارة اللي جاية من القاهرة نزلت.
        ar: هبطت الطائرة القادمة من القاهرة.
        en: The plane from Cairo has landed.
      - text: Saya ambil bagasi, lalu ke pintu kedatangan.
        ar_eg: باخد شنطي، وبعدين أروح باب الوصول.
        ar: آخذ أمتعتي ثم أتوجّه إلى بوابة الوصول.
        en: I collect my bags, then go to the arrivals door.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pengumuman
        ar_eg: إعلان
        ar: إعلان
        en: announcement
      - text: gerbang
        ar_eg: بوابة
        ar: بوابة
        en: gate
      - text: bagasi
        ar_eg: شنط السفر
        ar: أمتعة
        en: baggage
      - text: imigrasi
        ar_eg: الجوازات
        ar: الجوازات
        en: immigration
    words: [pengumuman, gerbang, bagasi, imigrasi]
  - id: e02
    type: match_pairs
    pairs:
      - text: visa
        ar_eg: فيزا
        ar: تأشيرة
        en: visa
      - text: ambil
        ar_eg: ياخد
        ar: يأخذ
        en: take
      - text: mendarat
        ar_eg: تهبط
        ar: تهبط
