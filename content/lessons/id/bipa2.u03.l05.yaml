    words: [visa, ambil, mendarat, kedatangan]
  - id: e03
    type: listen
    text: Penumpang ke Bali, harap ke gerbang lima sekarang.
    question:
      ar_eg: يروحوا فين؟
      ar: إلى أين يتوجّهون؟
      en: Where should they go?
    options: [البوابة ٥, الجوازات, الشنط]
    answer: 0
    meaning:
      ar_eg: ركاب بالي، يا ريت تروحوا البوابة ٥ حالًا.
      ar: على المسافرين إلى بالي التوجّه فورًا إلى البوابة الخامسة.
      en: Passengers to Bali, please go to gate five now.
    words: [gerbang]
  - id: e04
    type: fill_blank
    sentence: Pesawat dari Kairo sudah ___ di Jakarta.
    meaning:
      ar_eg: الطيارة اللي من القاهرة ___ في جاكرتا.
      ar: الطائرة القادمة من القاهرة ___ في جاكرتا.
      en: The plane from Cairo has ___ in Jakarta.
    options: [mendarat, ambil, menunggu]
    answers: [mendarat]
    words: [mendarat, ambil]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الشنط اللي بتشحنها في الطيارة اسمها…؟
      ar: ما اسم الحقائب التي تشحنها في الطائرة؟
      en: The bags you check in on a plane are called…?
    options: [bagasi, visa, gerbang]
    answer: 0
    explain:
      ar_eg: bagasi = شنط السفر المشحونة.
      ar: bagasi = الأمتعة.
      en: bagasi = checked baggage.
    words: [bagasi, visa, gerbang]
  - id: e06
    type: fill_blank
    sentence: Di ___, petugas periksa paspor dan visa.
    meaning:
      ar_eg: في ___، الموظف بيكشف على الباسبور والفيزا.
      ar: في ___ يفحص الموظّف الجواز والتأشيرة.
      en: At ___, the officer checks passports and visas.
    options: [imigrasi, kedatangan, pengumuman]
    answers: [imigrasi]
    words: [imigrasi, visa, kedatangan, pengumuman]
  - id: e07
    type: build_sentence
    source:
      ar_eg: هاخد شنطي من هناك.
      ar: سآخذ أمتعتي من هناك.
      en: I'll collect my baggage over there.
    answer: Saya ambil bagasi saya di sana.
    distractors: [gerbang, visa]
    words: [ambil, bagasi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Dengar pengumuman itu! Pesawat kita terlambat.
    answers_meaning:
      ar_eg: [اسمع الإعلان ده! طيارتنا متأخرة, اسمع الإعلان! الطيارة بتاعتنا اتأخرت]
      ar: [اسمع ذلك الإعلان! طائرتنا متأخّرة]
      en: [Listen to that announcement! Our plane is late, Listen to the announcement! Our flight is delayed]
    words: [pengumuman]
  - id: e09
    type: speaking
    text: Pesawatnya sudah mendarat. Saya ada di pintu kedatangan.
    meaning:
      ar_eg: الطيارة نزلت. أنا عند باب الوصول.
      ar: هبطت الطائرة، وأنا عند بوابة الوصول.
      en: The plane has landed. I'm at the arrivals door.
    words: [mendarat, kedatangan]
  - id: e10
    type: multiple_choice
    question: Saya orang Mesir. Untuk masuk Indonesia, saya perlu paspor dan ___.
    options: [visa, imigrasi, bagasi]
    answer: 0
    explain:
      ar_eg: المصري محتاج فيزا لإندونيسيا.
      ar: يحتاج المصري إلى تأشيرة لدخول إندونيسيا.
      en: An Egyptian needs a visa for Indonesia.
    words: [visa, imigrasi, bagasi]
dialogue:
  lines:
    - speaker: Mohamed
      text: Halo, Rina! Pesawat saya sudah mendarat.
      ar_eg: ألو يا رينا! طيارتي نزلت.
      ar: مرحبًا يا رينا! هبطت طائرتي.
      en: Hi, Rina! My plane has landed.
    - speaker: Rina
      text: Selamat datang! Saya di pintu kedatangan.
      ar_eg: أهلًا بيك! أنا عند باب الوصول.
      ar: أهلًا بك! أنا عند بوابة الوصول.
      en: Welcome! I'm at the arrivals door.
    - speaker: Mohamed
      text: Saya masih di imigrasi. Antrenya panjang.
      ar_eg: أنا لسه في الجوازات. الطابور طويل.
      ar: ما زلت في الجوازات، والطابور طويل.
      en: I'm still at immigration. The queue is long.
    - speaker: Rina
      text: Tidak apa-apa. Visamu sudah ada?
      ar_eg: مش مشكلة. الفيزا معاك؟
      ar: لا بأس. هل معك تأشيرتك؟
      en: No problem. Have you got your visa?
    - speaker: Mohamed
      text: Sudah. Sesudah imigrasi, saya ambil bagasi.
      ar_eg: أيوه. بعد الجوازات هاخد الشنط.
      ar: نعم. بعد الجوازات آخذ أمتعتي.
      en: Yes. After immigration, I'll get my bags.
    - speaker: Rina
      text: Baik! Saya menunggu di sini.
      ar_eg: تمام! أنا مستنياك هنا.
      ar: حسنًا! أنتظرك هنا.
      en: OK! I'll wait here.
