schema: kabar.lesson/v1
id: bipa2.u03.l05
language: id
title: Ulangan Unit 3
can_do:
  ar_eg: تعمل إعلان قصير بنفسك.
  ar: أن تُلقي إعلانًا قصيرًا.
  en: Make a short announcement.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: beberapa
        ar_eg: كام، بعض
        ar: بضعة
        en: several
      - text: seluruh
        ar_eg: كل (الحاجة كلها)
        ar: كامل
        en: whole
      - text: penumpang
        ar_eg: راكب
        ar: راكب
        en: passenger
      - text: jadwal
        ar_eg: جدول مواعيد
        ar: جدول مواعيد
        en: timetable
      - text: segera
        ar_eg: فورًا
        ar: فورًا
        en: immediately
    words: [beberapa, seluruh, penumpang, jadwal, segera]
  - id: e02
    type: match_pairs
    pairs:
      - text: Dilarang parkir
        ar_eg: ممنوع الركن
        ar: يُمنع الوقوف
        en: No parking
      - text: Harap antre
        ar_eg: برجاء الوقوف في الطابور
        ar: يُرجى الوقوف في الصف
        en: Please queue
      - text: Awas
        ar_eg: احترس
        ar: احذر
        en: Beware
      - text: tepat waktu
        ar_eg: في المعاد
        ar: في الموعد
        en: on time
    words: [dilarang, harap, awas, tepat waktu]
  - id: e03
    type: listen
    text: Para penumpang yang terhormat, mohon perhatian.
    options: ["Semua penumpang, harap tenang.", "Para penumpang yang terhormat, mohon maaf.", "Para penumpang yang terhormat, mohon perhatian."]
    answer: 2
    words: [para, penumpang, mohon, perhatian]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options: ["Semua penumpang sudah naik.", "Semua penumpang-penumpang sudah naik.", "Penumpang semua-semua sudah naik."]
    answer: 0
    explain:
      ar_eg: semua كفاية تقول إنهم كتير، متكررش الاسم.
      ar: semua تغني عن تكرار الاسم.
      en: semua already shows plural; don't reduplicate.
    words: [semua, penumpang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: لافتة عند باب المعبد بتقول إن الدخول ممنوع. مكتوب إيه؟
      ar: لافتة عند باب المعبد تمنع الدخول. ماذا كُتب عليها؟
      en: A sign at the temple door forbids entry. What does it say?
    options: ["Larang masuk.", "Dilarang masuk.", "Harap masuk."]
    answer: 1
    words: [dilarang, masuk]
  - id: e06
    type: fill_blank
    sentence: ___ hari ada tiga penerbangan ke Jakarta.
    meaning:
      ar_eg: كل يوم فيه تلات رحلات لجاكرتا.
      ar: كل يوم توجد ثلاث رحلات إلى جاكرتا.
      en: Every day there are three flights to Jakarta.
    options: ["Semua", "Para", "Setiap"]
    answers: [Setiap]
    words: [setiap, penerbangan]
  - id: e07
    type: fill_blank
    sentence: Kereta ini ___ terlambat, hanya sekali sebulan.
    meaning:
      ar_eg: القطر ده نادرًا لما بيتأخر، مرة واحدة بس في الشهر.
      ar: نادرًا ما يتأخر هذا القطار، مرة واحدة فقط في الشهر.
      en: This train is rarely late, only once a month.
    options: ["jarang", "sering", "selalu"]
    answers: [jarang]
    words: [jarang, terlambat]
  - id: e08
    type: fill_blank
    sentence: Mohon maaf atas ___ ini.
    meaning:
      ar_eg: بنعتذر عن التأخير ده.
      ar: نعتذر عن هذا التأخير.
      en: We apologise for this delay.
    answers: [keterlambatan]
    words: [keterlambatan]
  - id: e09
    type: build_sentence
    source:
      ar_eg: ممنوع التدخين في المطار.
      ar: يُمنع التدخين في المطار.
      en: No smoking in the airport.
    answer: Dilarang merokok di bandara.
    distractors: [harap, larang]
    words: [dilarang, merokok, bandara]
  - id: e10
    type: build_sentence
    source:
      ar_eg: كام طيارة متأخرين النهارده.
      ar: تأخرت عدة طائرات اليوم.
      en: Several planes are late today.
    answer: Beberapa pesawat terlambat hari ini.
    distractors: [para, tepat]
    words: [beberapa, terlambat]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (إعلان) انتباه من فضلكم. رحلة بالي متأخرة ساعة.
      ar: (إعلان) انتباه من فضلكم. رحلة بالي متأخرة ساعة.
      en: (announcement) Attention please. The flight to Bali is one hour late.
    answers:
      - Mohon perhatian. Penerbangan ke Bali terlambat satu jam.
      - Mohon perhatian. Penerbangan ke Bali terlambat satu jam
      - Mohon perhatian, penerbangan ke Bali terlambat satu jam.
      - Mohon perhatian. Penerbangan tujuan Bali terlambat satu jam.
      - Mohon perhatian. Penerbangan ke Bali terlambat sejam.
    words: [mohon, perhatian, penerbangan, terlambat]
  - id: e12
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (إعلان) حضرات الركاب، برجاء التوجه فورًا لبوابة اتنين.
      ar: (إعلان) السادة الركاب، يُرجى التوجه فورًا إلى البوابة الثانية.
      en: (announcement) Passengers, please go to gate two immediately.
    answers:
      - Para penumpang, harap segera menuju pintu dua.
      - Para penumpang, harap segera menuju pintu dua
      - Para penumpang, mohon segera menuju pintu dua.
      - Para penumpang, harap segera ke pintu dua.
      - Para penumpang yang terhormat, harap segera menuju pintu dua.
    words: [para, penumpang, harap, segera, menuju]
  - id: e13
    type: translate
    direction: from_target
    source_text: Awas, lantai licin! Hati-hati.
    answers_meaning:
      ar_eg: ["احترس، الأرض بتزحلق! خلي بالك", "حاسب، الأرض بتزحلق! خد بالك"]
      ar: ["احذر، الأرض زلقة! انتبه", "احذر، الأرضية زلقة! كن حذرًا"]
      en: ["Caution, slippery floor! Be careful.", "Watch out, the floor is slippery! Careful."]
    words: [awas, licin, hati-hati]
  - id: e14
    type: dictation
    text: Pesawat ke Kairo biasanya tepat waktu.
    meaning:
      ar_eg: الطيارة للقاهرة عادةً بتبقى في معادها.
      ar: الطائرة إلى القاهرة في موعدها عادةً.
      en: The plane to Cairo is usually on time.
    words: [biasanya, tepat waktu]
  - id: e15
    type: speaking
    text: Mohon perhatian. Para penumpang tujuan Jakarta, harap segera menuju pintu lima. Terima kasih.
    meaning:
      ar_eg: انتباه من فضلكم. حضرات الركاب المتجهين لجاكرتا، برجاء التوجه فورًا لبوابة خمسة. شكرًا.
      ar: انتباه من فضلكم. السادة الركاب المتجهون إلى جاكرتا، يُرجى التوجه فورًا إلى البوابة الخامسة. شكرًا.
      en: Attention please. Passengers to Jakarta, please go to gate five immediately. Thank you.
    words: [mohon, perhatian, para, harap, segera]
dialogue:
  title: Mohamed membuat pengumuman
  lines:
    - speaker: Mas Ardi
      text: Mohamed, coba baca pengumuman ini untuk teman-teman kita.
      ar_eg: يا محمد، جرّب تقرا الإعلان ده لصحابنا.
      ar: يا محمد، حاول أن تقرأ هذا الإعلان لأصدقائنا.
      en: Mohamed, try reading this announcement to our friends.
    - speaker: Mohamed
      text: Mohon perhatian. Bus kita terlambat dua puluh menit.
      ar_eg: انتباه من فضلكم. الأتوبيس بتاعنا متأخر عشرين دقيقة.
      ar: انتباه من فضلكم. حافلتنا متأخرة عشرين دقيقة.
      en: Attention please. Our bus is twenty minutes late.
    - speaker: Mohamed
      text: Harap tunggu di sini. Dilarang merokok di dalam.
      ar_eg: برجاء الانتظار هنا. ممنوع التدخين جوه.
      ar: يُرجى الانتظار هنا. يُمنع التدخين في الداخل.
      en: Please wait here. No smoking inside.
    - speaker: Mas Ardi
      text: Bagus sekali! Semua orang mengerti.
      ar_eg: حلو جدًا! كل الناس فهمت.
      ar: ممتاز! فهم الجميع.
      en: Excellent! Everyone understood.
    - speaker: Mohamed
      text: Terima kasih. Bus di Bali sering terlambat, ya?
      ar_eg: شكرًا. الأتوبيسات في بالي بتتأخر كتير، صح؟
      ar: شكرًا. الحافلات في بالي تتأخر كثيرًا، أليس كذلك؟
      en: Thanks. Buses in Bali are often late, aren't they?
    - speaker: Mas Ardi
      text: Kadang-kadang. Jalannya sering macet!
      ar_eg: ساعات. الطريق بيبقى زحمة كتير!
      ar: أحيانًا. فالطريق مزدحم كثيرًا!
      en: Sometimes. The roads are often jammed!
souvenir:
  id: bipa2.u03.souvenir
  title: Tiba di Bandara Ngurah Rai
  note:
    ar_eg: أول ما تنزل في مطار نجوراه راي في بالي هتسمع إعلانات بالإندونيسي الرسمي، وأغلبها بيبدأ بالجملة المشهورة «Para penumpang yang terhormat…» يعني «حضرات الركاب الكرام». دلوقتي إنت فاهم الجملة دي وفاهم اللي بعدها كمان. أهلًا بيك في بالي!
    ar: حين تهبط في مطار نغوراه راي في بالي تسمع إعلانات بالإندونيسية الرسمية، يبدأ أكثرها بالعبارة الشهيرة «Para penumpang yang terhormat…» أي «السادة الركاب الكرام». وأنت الآن تفهم هذه العبارة وما بعدها. أهلًا بك في بالي!
    en: Land at Bali's Ngurah Rai airport and you'll hear announcements in formal Indonesian, most opening with the classic "Para penumpang yang terhormat…" — dear passengers. Now you understand that line and what comes after it. Welcome to Bali!
review:
  status: draft
  verified: false
