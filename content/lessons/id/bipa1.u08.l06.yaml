schema: kabar.lesson/v1
id: bipa1.u08.l06
language: id
title: Sepupu yang nakal
can_do:
  ar_eg: 'توصف عيل شقي: زهقان وعطشان، رسم على ودنه ورقبته، وتقول وسيم أو وحش، وحنين.'
  ar: 'أن تصف طفلًا مشاغبًا: ضجِر وعطشان، رسم على أذنه ورقبته، وتقول وسيم أو قبيح، ورقيق.'
  en: 'Describe a naughty child: bored and thirsty, drawing on his ears and neck; say handsome or ugly, and gentle.'
slides:
  - title: Anak nakal
    body:
      ar_eg: |
        nakal = شقي، للعيال غالبًا. bosan = زهقان، والعيل الزهقان بيبقى nakal!
        haus = عطشان (زي lapar للجوع). telinga = ودن، leher = رقبة.
        tampan = وسيم، أرسمي من ganteng. jelek = وحش (في الشكل أو الجودة).
        lembut = ناعم أو حنين: Rina orangnya lembut.
      ar: |
        nakal = مشاغب، للأطفال غالبًا. bosan = ضجِر، والطفل الضجِر يصير nakal!
        haus = عطشان (مثل lapar للجوع). telinga = أذن، leher = رقبة.
        tampan = وسيم، أرسم من ganteng. jelek = قبيح أو رديء.
        lembut = ناعم أو رقيق: Rina orangnya lembut.
      en: |
        nakal = naughty, mostly of kids. bosan = bored, and a bored kid turns nakal!
        haus = thirsty (like lapar for hunger). telinga = ear, leher = neck.
        tampan = handsome, more formal than ganteng. jelek = ugly, bad.
        lembut = soft, gentle: Rina orangnya lembut.
    examples:
      - text: Sepupu saya bosan, jadi dia nakal.
        ar_eg: ابن خالتي زهقان، عشان كده بقى شقي.
        ar: ابن خالتي ضجِر، لذلك صار مشاغبًا.
        en: My cousin is bored, so he's being naughty.
      - text: Ada gambar di leher dan telinganya!
        ar_eg: فيه رسمة على رقبته وودنه!
        ar: هناك رسمة على رقبته وأذنه!
        en: There's a drawing on his neck and ear!
      - text: Saya haus. Minta air, ya!
        ar_eg: أنا عطشان. مية لو سمحت!
        ar: أنا عطشان. ماءً من فضلك!
        en: I'm thirsty. Water, please!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: telinga
        ar_eg: ودن
        ar: أذن
        en: ear
      - text: leher
        ar_eg: رقبة
        ar: رقبة
        en: neck
      - text: haus
        ar_eg: عطشان
        ar: عطشان
        en: thirsty
      - text: bosan
        ar_eg: زهقان
        ar: ضجِر
        en: bored
    words: [telinga, leher, haus, bosan]
  - id: e02
    type: match_pairs
    pairs:
      - text: nakal
        ar_eg: شقي
        ar: مشاغب
        en: naughty
      - text: lembut
        ar_eg: حنين، ناعم
        ar: رقيق
        en: gentle
      - text: tampan
        ar_eg: وسيم
        ar: وسيم
        en: handsome
      - text: jelek
        ar_eg: وحش
        ar: قبيح
        en: ugly
    words: [nakal, lembut, tampan, jelek]
  - id: e03
    type: listen
    text: Saya haus. Minta air putih, ya!
    question:
      ar_eg: هو عايز إيه؟
      ar: ماذا يريد؟
      en: What does he want?
    options: [مية, أكل, ينام]
    answer: 0
    meaning:
      ar_eg: أنا عطشان. مية لو سمحت!
      ar: أنا عطشان. ماءً من فضلك!
      en: I'm thirsty. Water, please!
    words: [haus]
  - id: e04
    type: fill_blank
    sentence: Anak itu ___! Dia menggambar di baju saya.
    meaning:
      ar_eg: العيل ده ___! بيرسم على هدومي.
      ar: ذلك الطفل ___! يرسم على ثيابي.
      en: That child is ___! He's drawing on my clothes.
    options: [nakal, bosan, lembut]
    answers: [nakal]
    words: [nakal, bosan, lembut]
    explain:
      ar_eg: بيرسم على هدومك = nakal (شقي). bosan = زهقان، وlembut = ناعم.
      ar: يرسم على ثيابك فهو nakal أي شقي.
      en: Drawing on your clothes is nakal (naughty).
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ganteng في الكلام العادي. والكلمة الأرسمي؟
      ar: ganteng في الكلام اليومي، فما الكلمة الأرسم؟
      en: ganteng in everyday talk. The more formal word?
    options: [tampan, cantik, jelek]
    answer: 0
    explain:
      ar_eg: tampan = وسيم (للراجل). cantik للست، وjelek عكسهم.
      ar: tampan للرجل الوسيم، وcantik للمرأة، وjelek ضدّهما.
      en: tampan for a handsome man; cantik for a woman; jelek is the opposite.
    words: [tampan, jelek]
  - id: e06
    type: fill_blank
    sentence: Gadis Bali itu pakai bunga di ___.
    meaning:
      ar_eg: البنت البالية دي حاطّة وردة على ___.
      ar: تضع الفتاة البالية زهرة على ___.
      en: The Balinese girl wears a flower on her ___.
    options: [telinga, leher, mata]
    answers: [telinga]
    words: [telinga, leher]
    explain:
      ar_eg: الورد البالي بيتحط على telinga = الودن. leher = رقبة، وmata = عين.
      ar: الوردة على telinga أي الأذن.
      en: The flower goes on the telinga (ear).
  - id: e07
    type: build_sentence
    source:
      ar_eg: الولد ده زهقان وعطشان.
      ar: ذلك الولد ضجِر وعطشان.
      en: That boy is bored and thirsty.
    answer: Anak itu bosan dan haus.
    distractors: [leher, jelek]
    words: [bosan, haus]
    explain:
      ar_eg: Anak itu + bosan dan haus (زهقان وعطشان). leher وjelek زيادة.
      ar: Anak itu bosan dan haus. leher وjelek زائدتان.
      en: Anak itu + bosan dan haus. leher and jelek are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Rina orangnya lembut.
    answers_meaning:
      ar_eg: [رينا إنسانة حنينة, رينا حنينة]
      ar: [رينا شخص رقيق, رينا رقيقة]
      en: [Rina is a gentle person, Rina is gentle]
    words: [lembut]
  - id: e09
    type: speaking
    text: Saya tidak nakal dan tidak jelek. Saya tampan!
    meaning:
      ar_eg: أنا مش شقي ومش وحش. أنا وسيم!
      ar: لست مشاغبًا ولا قبيحًا. أنا وسيم!
      en: I'm not naughty and I'm not ugly. I'm handsome!
    words: [nakal, jelek, tampan]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: الكوفية بتتلبس فين؟
      ar: أين يُلبس الوشاح؟
      en: Where do you wear a scarf?
    options: [leher, telinga, mata]
    answer: 0
    explain:
      ar_eg: 'على الرقبة: leher. telinga ودن وmata عين.'
      ar: 'على الرقبة: leher، أما telinga فأذن وmata عين.'
      en: 'On your neck: leher. telinga is an ear and mata an eye.'
    words: [leher, telinga]
dialogue:
  lines:
    - speaker: Mohamed
      text: Rina, siapa anak kecil itu?
      ar_eg: يا رينا، مين العيل الصغير ده؟
      ar: يا رينا، من ذلك الطفل الصغير؟
      en: Rina, who's that little kid?
    - speaker: Rina
      text: Itu sepupuku, Dodi. Dia bosan, jadi dia nakal.
      ar_eg: دا ابن خالتي، دودي. زهقان، فبقى شقي.
      ar: ذاك ابن خالتي دودي. إنه ضجِر، لذلك صار مشاغبًا.
      en: That's my cousin Dodi. He's bored, so he's being naughty.
    - speaker: Mohamed
      text: Ada gambar di leher dan telinganya!
      ar_eg: فيه رسمة على رقبته وودنه!
      ar: هناك رسمة على رقبته وأذنه!
      en: There's a drawing on his neck and ear!
    - speaker: Rina
      text: Dodi, wajahmu jelek sekarang!
      ar_eg: يا دودي، وشك بقى وحش دلوقتي!
      ar: يا دودي، صار وجهك قبيحًا الآن!
      en: Dodi, your face looks awful now!
    - speaker: Mohamed
      text: Tapi dia tersenyum. Kamu lembut banget, Rina.
      ar_eg: بس هو مبتسم. إنتي حنينة أوي يا رينا.
      ar: لكنه يبتسم. أنتِ رقيقة جدًا يا رينا.
      en: But he's smiling. You're so gentle, Rina.
    - speaker: Rina
      text: Sekarang dia haus. Ini air, Dodi!
      ar_eg: دلوقتي هو عطشان. خد المية يا دودي!
      ar: الآن هو عطشان. هذا ماء يا دودي!
      en: Now he's thirsty. Here's some water, Dodi!
