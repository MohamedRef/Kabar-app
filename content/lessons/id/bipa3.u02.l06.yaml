  - id: e03
    type: listen
    text: Di sini menjual telur penyu itu ilegal.
    question:
      ar_eg: بيع بيض السلاحف عامل إزاي؟
      ar: ما حكم بيع بيض السلاحف؟
      en: What about selling turtle eggs?
    options: [مسموح, ممنوع بالقانون, رخيص]
    answer: 1
    meaning:
      ar_eg: هنا بيع بيض السلاحف ممنوع بالقانون.
      ar: بيع بيض السلاحف هنا غير قانوني.
      en: Selling turtle eggs is illegal here.
    words: [ilegal]
  - id: e04
    type: fill_blank
    sentence: Jangan ___ sampah plastik. Itu berbahaya.
    meaning:
      ar_eg: ما ___ زبالة البلاستيك. ده خطر.
      ar: لا ___ نفايات البلاستيك. هذا خطر.
      en: Don't ___ plastic rubbish. It's dangerous.
    options: [lautan, membakar, planet]
    answers: [membakar]
    words: [membakar, lautan, planet]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إحنا عايشين على أنهي كوكب؟
      ar: على أي كوكب نعيش؟
      en: Which planet do we live on?
    options: [lautan, gas, bumi]
    answer: 2
    explain:
      ar_eg: bumi = الأرض، كوكبنا.
      ar: bumi = الأرض، كوكبنا.
      en: bumi = the earth, our planet.
    words: [bumi, lautan, gas]
  - id: e06
    type: fill_blank
    sentence: Rumah ini memakai ___ matahari.
    meaning:
      ar_eg: البيت ده بيستخدم ___ الشمس.
      ar: يستخدم هذا البيت ___ الشمس.
      en: This house uses solar ___.
    options: [ilegal, energi, permukaan]
    answers: [energi]
    words: [energi, ilegal, permukaan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الطاقة اللي من الغاز مش نضيفة.
      ar: الطاقة من الغاز ليست نظيفة.
      en: Energy from gas isn't clean.
    answer: Energi dari gas tidak bersih.
    distractors: [bumi, lautan]
    words: [energi, gas]
  - id: e08
    type: translate
    direction: from_target
    source_text: Bumi adalah planet yang indah.
    answers_meaning:
      ar_eg: [الأرض كوكب جميل, الأرض كوكب حلو]
      ar: [الأرض كوكب جميل]
      en: [The earth is a beautiful planet, Earth is a beautiful planet]
    words: [bumi, planet]
  - id: e09
    type: speaking
    text: Jangan membakar sampah di pantai.
    meaning:
      ar_eg: ما تحرقش زبالة على الشط.
      ar: لا تحرق النفايات على الشاطئ.
      en: Don't burn rubbish on the beach.
    words: [membakar]
  - id: e10
    type: multiple_choice
    question: Banyak sampah plastik ada di ___ laut.
    options: [planet, permukaan, lautan]
    answer: 1
    explain:
      ar_eg: permukaan laut = سطح البحر.
      ar: permukaan laut = سطح البحر.
      en: permukaan laut = the sea surface.
    words: [permukaan, lautan, planet]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Lihat tuh, Mohamed! Ada asap di sana. Orang membakar sampah.
      ar_eg: بص يا محمد! فيه دخان هناك. الناس بتحرق زبالة.
      ar: انظر يا محمد! هناك دخان. الناس يحرقون النفايات.
      en: Look, Mohamed! There's smoke over there. People are burning rubbish.
    - speaker: Mohamed
      text: Wah, itu nggak baik buat bumi.
      ar_eg: ياه، ده مش كويس للأرض.
      ar: هذا ليس جيدًا للأرض.
      en: Oh, that's bad for the earth.
    - speaker: Mas Rizal
      text: Betul. Di permukaan laut juga banyak plastik.
      ar_eg: صح. وعلى سطح البحر كمان فيه بلاستيك كتير.
      ar: صحيح. وعلى سطح البحر أيضًا بلاستيك كثير.
      en: Right. There's a lot of plastic on the sea surface too.
    - speaker: Mohamed
      text: Di Mesir juga sama. Kita harus menjaga lautan.
      ar_eg: في مصر نفس الحكاية. لازم نحافظ على البحور.
      ar: وفي مصر كذلك. علينا أن نحافظ على البحار.
      en: Same in Egypt. We have to look after the oceans.
    - speaker: Mas Rizal
      text: Iya. Jual telur penyu juga ilegal, tapi masih ada aja orang yang jual.
      ar_eg: أيوه. وبيع بيض السلاحف ممنوع، بس لسه فيه ناس بتبيعه.
      ar: نعم. وبيع بيض السلاحف ممنوع قانونًا، لكن ما زال البعض يبيعه.
      en: Yes. Selling turtle eggs is illegal too, but some people still sell them.
