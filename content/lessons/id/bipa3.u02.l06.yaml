language: id
title: Diskusi sampah plastik
can_do:
  ar_eg: "تشارك في نقاش عن البلاستيك: تقول رأيك، توافق، وتعترض بأدب."
  ar: "أن تشارك في نقاش عن البلاستيك: تعبّر عن رأيك وتوافق وتعترض بأدب."
  en: Agree and disagree in a discussion.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: رينا قالت «Menurut saya, sedotan plastik harus dilarang» وانت موافق. ترد بإيه؟
      ar: قالت رينا «Menurut saya, sedotan plastik harus dilarang» وأنت توافقها. بمَ تردّ؟
      en: 'Rina says "Menurut saya, sedotan plastik harus dilarang", and you agree. What do you answer?'
    options: ["Saya sependapat. Sedotan plastik berbahaya bagi penyu.", "Kamu salah!", "Benarkah? Siapa pun tidak tahu."]
    answer: 0
    words: [sependapat, berbahaya]
  - id: e02
    type: listen
    text: Saya kurang setuju. Menurut saya, dendanya terlalu berat untuk pedagang kecil.
    question:
      ar_eg: راكا مش موافق ليه؟
      ar: لماذا لا يوافق راكا؟
      en: Why doesn't Raka agree?
    options: ["Plastik tidak berbahaya.", "Dendanya terlalu berat untuk pedagang kecil.", "Dia suka sedotan plastik."]
    answer: 1
    meaning:
      ar_eg: أنا مش موافق أوي. في رأيي الغرامة تقيلة أوي على التجار الصغيرين.
      ar: لا أوافق تمامًا؛ في رأيي الغرامة ثقيلة جدًا على صغار التجار.
      en: I don't quite agree. In my opinion the fine is too heavy for small traders.
    words: [denda, kurang setuju]
  - id: e03
    type: match_pairs
    pairs:
      - text: melarang
        ar_eg: يمنع
        ar: يمنع
        en: to ban, forbid
      - text: solusi
        ar_eg: حل
        ar: حلّ
        en: solution
      - text: denda
        ar_eg: غرامة
        ar: غرامة
        en: fine (penalty)
      - text: ada benarnya
        ar_eg: عندك حق شوية
        ar: فيه شيء من الصواب
        en: that's partly true
    words: [melarang, solusi, denda]
  - id: e04
    type: fill_blank
    sentence: Gili Trawangan ___ mobil dan sepeda motor.
    meaning:
      ar_eg: جيلي تراوانجان بتمنع العربيات والموتوسيكلات.
      ar: تمنع جيلي تراوانغان السيارات والدراجات النارية.
      en: Gili Trawangan bans cars and motorbikes.
    options: [mengurangi, melarang, membuang]
    answers: [melarang]
    words: [melarang]
  - id: e05
    type: build_sentence
    source:
      ar_eg: في رأيك، إيه الحل؟
      ar: في رأيك، ما الحل؟
      en: In your opinion, what's the solution?
    answer: Menurut Anda, apa solusinya?
    alternatives: ["Apa solusinya, menurut Anda?"]
    distractors: [dengan, setuju]
    words: [solusi]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عندك حق شوية، بس الغرامة تقيلة أوي.
      ar: في كلامك شيء من الصواب، لكنّ الغرامة ثقيلة جدًا.
      en: That's partly true, but the fine is too heavy.
    answers:
      - Ada benarnya, tetapi dendanya terlalu berat.
      - Ada benarnya, tetapi dendanya terlalu berat
      - Ada benarnya, tapi dendanya terlalu berat.
      - Ada benarnya, tapi dendanya terlalu berat
      - Ada benarnya, tetapi denda itu terlalu berat.
      - Ada benarnya, tapi denda itu terlalu berat.
      - Ada benarnya, tetapi dendanya terlalu mahal.
    words: [denda]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: في رأيي، سنجيجي لازم تمنع الشفاطات البلاستيك.
      ar: في رأيي، يجب أن تمنع سنغيغي المصّاصات البلاستيكية.
      en: In my opinion, Senggigi should ban plastic straws.
    answers:
      - Menurut saya, Senggigi harus melarang sedotan plastik.
      - Menurut saya, Senggigi harus melarang sedotan plastik
      - Menurut saya, Senggigi sebaiknya melarang sedotan plastik.
      - Menurut saya, sebaiknya Senggigi melarang sedotan plastik.
      - Menurut aku, Senggigi harus melarang sedotan plastik.
      - Menurut saya Senggigi harus melarang sedotan plastik.
    words: [melarang, sedotan]
  - id: e08
    type: dictation
    text: Jadi, kesimpulannya, tas kain adalah solusi yang baik.
    meaning:
      ar_eg: يعني في الآخر، الشنطة القماش حل كويس.
      ar: إذن، الخلاصة أنّ حقيبة القماش حلّ جيّد.
      en: So, to conclude, cloth bags are a good solution.
    words: [solusi, kesimpulannya]
  - id: e09
    type: speaking
    text: Saya kurang setuju. Menurut saya, denda bukan solusi.
    meaning:
      ar_eg: أنا مش موافق أوي. في رأيي، الغرامة مش حل.
      ar: لا أوافق تمامًا؛ في رأيي، الغرامة ليست حلًّا.
      en: I don't quite agree. In my opinion, a fine isn't the solution.
    words: [denda, solusi, kurang setuju]
dialogue:
  title: Diskusi di kafe
  lines:
    - speaker: Rina
      text: Katanya, di Gili ada denda untuk sampah plastik. Bagaimana pendapatmu, Raka?
      ar_eg: بيقولوا إن في جيلي فيه غرامة على الزبالة البلاستيك. إيه رأيك يا راكا؟
      ar: يقولون إنّ في جيلي غرامة على النفايات البلاستيكية. ما رأيك يا راكا؟
      en: They say there's a fine for plastic rubbish on the Gilis. What do you think, Raka?
    - speaker: Raka
      text: Saya kurang setuju. Dendanya terlalu berat untuk pedagang kecil.
      ar_eg: أنا مش موافق أوي. الغرامة تقيلة أوي على التجار الصغيرين.
      ar: لا أوافق تمامًا؛ الغرامة ثقيلة جدًا على صغار التجار.
      en: I don't quite agree. The fine is too heavy for small traders.
    - speaker: Mohamed
      text: Ada benarnya. Tapi bukankah plastik berbahaya bagi penyu?
      ar_eg: عندك حق شوية. بس مش البلاستيك خطر على السلاحف؟
      ar: في كلامك شيء من الصواب، لكن أليس البلاستيك خطرًا على السلاحف؟
      en: That's partly true. But isn't plastic dangerous for turtles?
    - speaker: Raka
      text: Betul. Jadi, apa solusinya?
      ar_eg: صح. طب إيه الحل؟
      ar: صحيح. فما الحل إذن؟
      en: True. So what's the solution?
    - speaker: Mohamed
      text: Menurut saya, sebaiknya kita melarang sedotan dan kantong plastik dulu.
      ar_eg: في رأيي، الأحسن نمنع الشفاطات والأكياس البلاستيك الأول.
      ar: في رأيي، الأفضل أن نمنع المصّاصات والأكياس البلاستيكية أولًا.
      en: In my opinion, we'd better ban straws and plastic bags first.
    - speaker: Rina
      text: Saya sependapat. Siapa pun bisa membawa tas kain!
      ar_eg: رأيي زي رأيك. أي حد يقدر يجيب شنطة قماش!
      ar: أشاركك الرأي. يستطيع أيّ أحد أن يحمل حقيبة قماش!
      en: I agree. Anyone can bring a cloth bag!
