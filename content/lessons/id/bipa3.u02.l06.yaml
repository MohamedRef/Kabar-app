schema: kabar.lesson/v1
id: bipa3.u02.l06
language: id
title: Asap di pantai
can_do:
  ar_eg: 'تتكلم عن الأرض والبحر: الطاقة، الحرق، سطح البحر وإيه اللي ممنوع قانونًا.'
  ar: 'أن تتحدث عن الأرض والبحر: الطاقة والحرق وسطح البحر وما يمنعه القانون.'
  en: 'Talk about the earth and the sea: energy, burning, the sea surface and what''s against the law.'
slides:
  - title: Bumi kita
    body:
      ar_eg: |
        bumi = الأرض (الكوكب)، planet = كوكب. lautan = بحور ومحيطات واسعة، permukaan = سطح (permukaan laut).
        energi = طاقة (energi matahari = طاقة شمسية). gas = غاز.
        membakar = يحرق (من bakar). ilegal = ممنوع بالقانون.
      ar: |
        bumi = الأرض (الكوكب)، planet = كوكب. lautan = محيط، بحار واسعة، permukaan = سطح (permukaan laut).
        energi = طاقة (energi matahari = طاقة شمسية). gas = غاز.
        membakar = يحرق (من bakar). ilegal = غير قانوني.
      en: |
        bumi = the earth, planet = planet. lautan = ocean, the open sea, permukaan = surface (permukaan laut).
        energi = energy (energi matahari = solar energy). gas = gas.
        membakar = burn (from bakar). ilegal = illegal.
    examples:
      - text: Bumi adalah planet kita.
        ar_eg: الأرض هي كوكبنا.
        ar: الأرض كوكبنا.
        en: The earth is our planet.
      - text: Jangan membakar sampah plastik!
        ar_eg: ما تحرقش زبالة البلاستيك!
        ar: لا تحرق نفايات البلاستيك!
        en: Don't burn plastic rubbish!
      - text: Menjual telur penyu itu ilegal.
        ar_eg: بيع بيض السلاحف ممنوع بالقانون.
        ar: بيع بيض السلاحف غير قانوني.
        en: Selling turtle eggs is illegal.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bumi
        ar_eg: الأرض
        ar: الأرض
        en: the earth
      - text: planet
        ar_eg: كوكب
        ar: كوكب
        en: planet
      - text: energi
        ar_eg: طاقة
        ar: طاقة
        en: energy
      - text: gas
        ar_eg: غاز
        ar: غاز
        en: gas
    words: [bumi, planet, energi, gas]
  - id: e02
    type: match_pairs
    pairs:
      - text: membakar
        ar_eg: يحرق
        ar: يحرق
        en: burn
      - text: permukaan
        ar_eg: سطح
        ar: سطح
        en: surface
      - text: lautan
        ar_eg: محيط، بحور
        ar: محيط
        en: ocean
      - text: ilegal
        ar_eg: ممنوع بالقانون
        ar: غير قانوني
        en: illegal
