      - Larangan kantong plastik adalah kebijakan yang tepat.
      - Larangan kantong plastik merugikan semua warga.
      - Kantong plastik mudah didaur ulang.
    answer: 0
    words: [larangan, kantong plastik, berpendapat]
  - id: e02
