schema: kabar.lesson/v1
id: bipa4.u09.l07
language: id
title: Opini warga Manado
can_do:
  ar_eg: تقرا مقال رأي قصير وتعرف رأي الكاتب وحججه والحل اللي بيقترحه.
  ar: أن تقرأ مقال رأي قصيرًا وتعرف موقف الكاتب وحججه والحلّ الذي يقترحه.
  en: Read a short opinion piece and identify the writer's view, arguments and proposed solution.
slides:
  - title: Kolom opini
    body:
      ar_eg: |
        مقال رأي كتبته مدرّسة من مانادو في جرنال محلي. ده نص عرضي (eksposisi).
        دوّر على: الرأي، الحجج (Pertama، Kedua)، والحل (solusi).
      ar: |
        مقال رأي كتبته معلّمة من مانادو في صحيفة محلية، وهو نص عرضي (eksposisi).
        ابحث عن: الرأي، والحجج (Pertama، Kedua)، والحلّ (solusi).
      en: |
        An opinion piece by a Manado teacher in a local paper. It's an exposition (eksposisi).
        Look for the thesis, the arguments (Pertama, Kedua) and the solution (solusi).
    examples:
      - text: Saya berpendapat bahwa larangan kantong plastik di Manado adalah kebijakan yang tepat.
        ar_eg: أنا شايفة إن منع الأكياس البلاستيك في مانادو قرار صح.
        ar: أرى أن حظر الأكياس البلاستيكية في مانادو سياسة صائبة.
        en: I believe the plastic-bag ban in Manado is the right policy.
      - text: Pertama, plastik sekali pakai sulit didaur ulang. Kedua, banyak sampah plastik masuk ke laut Bunaken dan merusak terumbu karang.
        ar_eg: أولًا، البلاستيك اللي بيتستعمل مرة واحدة صعب يتعاد تدويره. تانيًا، زبالة بلاستيك كتير بتوصل لبحر بوناكين وبتبوّظ الشعاب المرجانية.
        ar: أولًا، يصعب إعادة تدوير البلاستيك أحادي الاستخدام. ثانيًا، تصل نفايات بلاستيكية كثيرة إلى بحر بوناكين وتُتلف الشعاب المرجانية.
        en: First, single-use plastic is hard to recycle. Second, a lot of plastic waste ends up in the sea at Bunaken and damages the coral reefs.
      - text: Memang, sebagian pedagang menolak. Namun, solusinya mudah, yaitu kita membawa tas belanja sendiri.
        ar_eg: صحيح إن بعض التجار معترضين. بس الحل سهل، وهو إننا نجيب شنط الشوبنج بتاعتنا معانا.
        ar: صحيح أن بعض التجار يرفضون، غير أن الحل سهل، وهو أن نحمل حقائب تسوّقنا الخاصة.
        en: Admittedly, some traders are against it. But the solution is easy - we bring our own shopping bags.
exercises:
