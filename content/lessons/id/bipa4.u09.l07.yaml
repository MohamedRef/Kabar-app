schema: kabar.lesson/v1
id: bipa4.u09.l07
language: id
title: Jenis dan hubungan
can_do:
  ar_eg: تتكلم عن أنواع الكائنات والعلاقة بينها وبين البيئة.
  ar: أن تتحدث عن أنواع الكائنات وعلاقتها بالبيئة.
  en: Talk about kinds of living things and how they relate to the environment.
slides:
  - title: Alam dan manusia
    body:
      ar_eg: |
        jenis = نوع (jenis ikan = نوع سمك)، tertentu = معيّن (ikan tertentu = سمك معيّن)، kebanyakan = معظم، أغلب.
        hubungan = علاقة (hubungan antara A dan B = العلاقة بين...)، menciptakan = يخلق، يعمل حاجة جديدة.
        program = برنامج، kecuali = ماعدا، alami = طبيعي (من الطبيعة: pupuk alami = سماد طبيعي).
      ar: |
        jenis = النوع (jenis ikan = نوع من السمك)، tertentu = معيّن (ikan tertentu)، kebanyakan = معظم، أغلب.
        hubungan = العلاقة (hubungan antara A dan B)، menciptakan = يخلق، يبتكر.
        program = البرنامج، kecuali = إلا، باستثناء، alami = طبيعي (من الطبيعة: pupuk alami = سماد طبيعي).
      en: |
        jenis = kind, type (jenis ikan = kind of fish), tertentu = certain, particular (ikan tertentu), kebanyakan = most.
        hubungan = relationship (hubungan antara A dan B = the link between A and B), menciptakan = to create.
        program = programme, kecuali = except, alami = natural (from nature: pupuk alami = natural fertiliser).
    examples:
      - text: Di Bunaken ada ratusan jenis ikan.
        ar_eg: في بوناكين فيه مئات الأنواع من السمك.
        ar: في بوناكين مئات الأنواع من السمك.
        en: There are hundreds of kinds of fish at Bunaken.
      - text: Kebanyakan petani di sini memakai pupuk alami.
        ar_eg: معظم الفلاحين هنا بيستعملوا سماد طبيعي.
        ar: يستعمل معظم المزارعين هنا سمادًا طبيعيًا.
        en: Most farmers here use natural fertiliser.
      - text: Semua toko ikut program ini, kecuali dua.
        ar_eg: كل المحلات مشتركة في البرنامج ده ماعدا اتنين.
        ar: تشارك كل المتاجر في هذا البرنامج إلا اثنين.
        en: All the shops take part in this programme except two.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jenis
        ar_eg: نوع
        ar: نوع
        en: kind, type
      - text: tertentu
        ar_eg: معيّن
        ar: معيّن
        en: certain
      - text: kebanyakan
        ar_eg: معظم
        ar: معظم
        en: most
      - text: hubungan
        ar_eg: علاقة
        ar: علاقة
        en: relationship
    words: [jenis, tertentu, kebanyakan, hubungan]
  - id: e02
    type: match_pairs
    pairs:
      - text: menciptakan
        ar_eg: يخلق، يعمل
        ar: يخلق
        en: to create
      - text: program
        ar_eg: برنامج
        ar: برنامج
        en: programme
      - text: kecuali
        ar_eg: ماعدا
        ar: إلا
        en: except
      - text: alami
        ar_eg: طبيعي
        ar: طبيعي
        en: natural
    words: [menciptakan, program, kecuali, alami]
  - id: e03
    type: listen
    text: Ada hubungan antara sampah plastik dan karang yang rusak.
    question:
      ar_eg: بين البلاستيك والمرجان فيه إيه؟
      ar: ما الذي بين البلاستيك والمرجان؟
      en: What is there between plastic and coral?
    options: [علاقة, مسافة, مشكلة]
    answer: 0
    meaning:
      ar_eg: فيه علاقة بين زبالة البلاستيك والمرجان اللي باظ.
      ar: هناك علاقة بين نفايات البلاستيك والمرجان التالف.
      en: There's a link between plastic waste and damaged coral.
    words: [hubungan]
  - id: e04
    type: fill_blank
    sentence: Di kebun ini ada lima ___ sayur.
    meaning:
      ar_eg: في الجنينة دي فيه خمس ___ خضار.
      ar: في هذه الحديقة خمسة ___ من الخضار.
      en: There are five ___ of vegetable in this garden.
    options: [jenis, program, hubungan]
    answers: [jenis]
    words: [jenis, program, hubungan]
    explain:
      ar_eg: lima jenis sayur = خمس أنواع خضار. program = برنامج، وhubungan = علاقة.
      ar: lima jenis sayur = خمسة أنواع من الخضار. أما program فبرنامج، وhubungan علاقة.
      en: lima jenis sayur means five kinds of vegetable. program is a programme and hubungan a relationship.
  - id: e05
    type: multiple_choice
    question: Semua warga datang ke kerja bakti, ___ Pak Johan. Dia sakit.
    options: [kecuali, kebanyakan, tertentu]
    answer: 0
    explain:
      ar_eg: kecuali = ماعدا، والأستاذ يوهان ماجاش. kebanyakan = معظم، وtertentu = معيّن.
      ar: kecuali = إلا، فالأستاذ يوهان لم يأتِ. أما kebanyakan فمعظم، وtertentu معيّن.
      en: 'kecuali means except: Pak Johan didn''t come. kebanyakan is most, and tertentu is certain.'
    words: [kecuali, kebanyakan, tertentu]
  - id: e06
    type: fill_blank
    sentence: Kota ini membuat ___ daur ulang untuk sekolah.
    meaning:
      ar_eg: المدينة دي عملت ___ إعادة تدوير للمدارس.
      ar: أطلقت هذه المدينة ___ لإعادة التدوير في المدارس.
      en: This city set up a recycling ___ for schools.
    options: [program, alami, jenis]
    answers: [program]
    words: [program, alami, jenis]
    explain:
      ar_eg: program daur ulang = برنامج إعادة تدوير. alami = طبيعي، وjenis = نوع، ومايمشوش مع membuat هنا.
      ar: program daur ulang = برنامج لإعادة التدوير. أما alami فطبيعي، وjenis نوع، ولا يناسبان هنا.
      en: program daur ulang is a recycling programme. alami is natural and jenis is a kind; neither fits here.
  - id: e07
    type: multiple_choice
    question: Petani ini tidak pakai pupuk kimia. Pupuknya ___.
    options: [alami, tertentu, kecuali]
    answer: 0
    explain:
      ar_eg: alami = طبيعي، عكس الكيماوي. tertentu = معيّن، وkecuali = ماعدا.
      ar: alami = طبيعي، عكس الكيميائي. أما tertentu فمعيّن، وkecuali إلا.
      en: alami means natural, the opposite of chemical. tertentu is certain, and kecuali is except.
    words: [alami, tertentu, kecuali]
  - id: e08
    type: build_sentence
    source:
      ar_eg: البرنامج ده عمل شغل جديد للصيادين.
      ar: أوجد هذا البرنامج فرص عمل جديدة للصيادين.
      en: This programme created new jobs for fishermen.
    answer: Program ini menciptakan lapangan kerja baru bagi nelayan.
    distractors: [jenis, kecuali]
    words: [menciptakan, program, jenis, kecuali]
    explain:
      ar_eg: menciptakan lapangan kerja = يعمل فرص شغل جديدة. jenis = نوع، وkecuali = ماعدا، ومالهمش مكان هنا.
      ar: menciptakan lapangan kerja = يوجد فرص عمل. أما jenis فنوع، وkecuali إلا، ولا مكان لهما هنا.
      en: menciptakan lapangan kerja means to create jobs. jenis is a kind and kecuali is except; they don't belong here.
  - id: e09
    type: translate
    direction: from_target
    source_text: Kebanyakan ikan hanya ada di tempat tertentu.
    answers_meaning:
      ar_eg: [معظم السمك موجود في أماكن معيّنة بس, أغلب السمك بيتلاقي في مكان معيّن بس]
      ar: [يوجد معظم السمك في أماكن معيّنة فقط, لا يوجد أغلب السمك إلا في أماكن معيّنة]
      en: [Most fish are only found in certain places, Most fish are found only in particular places]
    words: [kebanyakan, tertentu]
  - id: e10
    type: speaking
    text: Hubungan manusia dan alam harus seimbang.
    meaning:
      ar_eg: العلاقة بين الإنسان والطبيعة لازم تبقى متوازنة.
      ar: يجب أن تكون العلاقة بين الإنسان والطبيعة متوازنة.
      en: The relationship between people and nature must be balanced.
    words: [hubungan, alami, menciptakan]
dialogue:
  lines:
    - speaker: Bu Grace
      text: Mohamed, kamu tahu berapa jenis karang di Bunaken?
      ar_eg: يا محمد، عارف فيه كام نوع مرجان في بوناكين؟
      ar: يا محمد، أتعرف كم نوعًا من المرجان في بوناكين؟
      en: Mohamed, do you know how many kinds of coral there are at Bunaken?
    - speaker: Mohamed
      text: Belum, Bu. Kebanyakan karangnya masih alami?
      ar_eg: لأ يا مدام. معظم المرجان لسه طبيعي؟
      ar: لا يا سيدتي. هل معظم المرجان ما زال طبيعيًا؟
      en: No, ma'am. Is most of the coral still natural?
    - speaker: Bu Grace
      text: Iya, kecuali di dekat pelabuhan. Di sana airnya kotor.
      ar_eg: أيوه، ماعدا جنب الميناء. هناك المية وسخة.
      ar: نعم، إلا قرب الميناء، فالماء هناك متّسخ.
      en: Yes, except near the harbour. The water is dirty there.
    - speaker: Mohamed
      text: Jadi ada hubungan antara sampah dan karang yang mati?
      ar_eg: يعني فيه علاقة بين الزبالة والمرجان اللي بيموت؟
      ar: إذن هناك علاقة بين النفايات والمرجان الميت؟
      en: So there's a link between rubbish and dead coral?
    - speaker: Bu Grace
      text: Betul. Karena itu kami menciptakan program bersih laut untuk anak sekolah.
      ar_eg: بالظبط. عشان كده عملنا برنامج تنضيف البحر لطلبة المدارس.
      ar: صحيح. لذلك أطلقنا برنامج تنظيف البحر لطلاب المدارس.
      en: Right. That's why we created a clean-sea programme for schoolchildren.
