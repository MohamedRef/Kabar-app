schema: kabar.lesson/v1
id: bipa3.u09.l02
language: id
title: Berhari-hari
can_do:
  ar_eg: تقول «أيام وأيام» و«سامحوا بعض» بـ ber- والتكرار (berhari-hari، bermaaf-maafan).
  ar: أن تعبّر عن طول المدة والتبادل بـ ber- والتكرار (berhari-hari، bermaaf-maafan).
  en: Say "for days on end" and "forgive each other" with ber- + doubling (berhari-hari, bermaaf-maafan).
slides:
  - title: Berjam-jam, berhari-hari
    body:
      ar_eg: |
        ber- + وحدة وقت مكررة = مدة طويلة، زي ما بنقول «ساعات وساعات / أيام وأيام»:
        berjam-jam = ساعات، berhari-hari = أيام، bertahun-tahun = سنين.
        من غير تكرار ما تنفعش: bertahun لوحدها مش بالمعنى ده.
      ar: |
        ber- + وحدة الزمن مكررةً = مدة طويلة، كقولنا «ساعاتٍ وساعات / أيامًا وأيامًا»:
        berjam-jam = ساعاتٍ طويلة، berhari-hari = أيامًا، bertahun-tahun = سنوات.
        ولا يصح ذلك بلا تكرار.
      en: |
        ber- + a doubled time unit = for a long time, like saying "hours and hours":
        berjam-jam = for hours, berhari-hari = for days, bertahun-tahun = for years.
        It needs the doubling: bertahun alone doesn't mean this.
    grammar: id.reduplication.ber-an
    examples:
      - text: Putri Mandalika berpikir berhari-hari.
        ar_eg: الأميرة مانداليكا فضلت تفكر أيام وأيام.
        ar: فكّرت الأميرة مانداليكا أيامًا طويلة.
        en: Princess Mandalika thought for days on end.
      - text: Para pangeran menunggu berjam-jam di istana.
        ar_eg: الأمرا استنوا ساعات في القصر.
        ar: انتظر الأمراء ساعاتٍ في القصر.
        en: The princes waited for hours at the palace.
  - title: Bermaaf-maafan
    body:
      ar_eg: |
        ber- + تكرار + -an ممكن تبقى «تبادل»، بالظبط وزن «تفاعَل» عندنا:
        bermaaf-maafan = سامحوا بعض (تسامحوا)، bersalam-salaman = سلّموا على بعض (تصافحوا).
        وsaling (بعض) لوحدها بتعمل نفس الشغل، فما تجمعش الاتنين: مش saling bermaaf-maafan.
      ar: |
        وقد تفيد ber- مع التكرار و-an التبادل، كصيغة «تفاعَل»:
        bermaaf-maafan = تسامحوا، bersalam-salaman = تصافحوا.
        وsaling تؤدي المعنى وحدها، فلا تُجمع معها.
      en: |
        ber- + doubling + -an can be reciprocal, exactly like Arabic تفاعَل:
        bermaaf-maafan = forgive each other (تسامحوا), bersalam-salaman = shake hands with each other (تصافحوا).
        saling (each other) does the same job alone, so don't combine them: not saling bermaaf-maafan.
    grammar: id.reduplication.ber-an
    examples:
      - text: Pada hari Lebaran, kami bermaaf-maafan.
        ar_eg: يوم العيد بنسامح بعض.
        ar: في يوم العيد يسامح بعضنا بعضًا.
        en: On Lebaran day we ask each other's forgiveness.
      - text: Setelah salat Id, semua orang bersalam-salaman.
        ar_eg: بعد صلاة العيد كل الناس بتسلّم على بعض.
        ar: بعد صلاة العيد يتصافح الناس جميعًا.
        en: After the Eid prayer everyone shakes hands with each other.
