      ar: أيّ جملة تعني «عاش في لومبوك سنواتٍ طويلة»؟
      en: Which sentence means "He lived on Lombok for years"?
    options:
      - Dia tinggal di Lombok bertahun.
      - Dia tinggal di Lombok tahun-tahun.
      - Dia tinggal di Lombok bertahun-tahun.
    answer: 2
    explain:
      ar_eg: 'لازم ber- والتكرار مع بعض: bertahun-tahun.'
      ar: 'لا بد من ber- والتكرار معًا: bertahun-tahun.'
      en: 'You need both ber- and the doubling: bertahun-tahun.'
