  - id: e02
    type: multiple_choice
    question: Pada hari Lebaran, kami ___.
    options: [saling bermaaf-maafan, bermaaf-maafan, bermaafan-maafan]
    answer: 1
    explain:
      ar_eg: saling ومعنى التبادل نفس الحاجة، فاستعمل واحد بس. والجذر maaf هو اللي بيتكرر.
      ar: saling وصيغة التبادل بمعنى واحد فلا يُجمع بينهما، والمكرر هو الجذر maaf.
      en: saling and the reciprocal form mean the same, so use one; and the root maaf is what doubles.
