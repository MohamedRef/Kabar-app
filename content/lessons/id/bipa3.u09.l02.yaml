dialogue:
  title: Cerita untuk besok
  lines:
    - speaker: Mohamed
      text: Mas, ceritakan tentang Putri Mandalika, dong!
      ar_eg: يا ماس، احكيلي عن الأميرة مانداليكا بقى!
      ar: يا ماس، احكِ لي عن الأميرة مانداليكا!
      en: Mas, tell me about Princess Mandalika!
    - speaker: Mas Rizal
      text: Dulu, banyak pangeran datang ke istana. Mereka menunggu berhari-hari karena semua ingin menikah dengan putri itu.
      ar_eg: زمان، أمرا كتير جم القصر. استنوا أيام وأيام لأن كلهم كانوا عايزين يتجوزوا الأميرة.
      ar: قديمًا جاء أمراء كثيرون إلى القصر، وانتظروا أيامًا لأن كلًّا منهم أراد الزواج من الأميرة.
      en: Long ago, many princes came to the palace. They waited for days, because they all wanted to marry the princess.
    - speaker: Mohamed
      text: Wah! Lalu putri itu memilih siapa?
      ar_eg: واو! وبعدين الأميرة اختارت مين؟
      ar: عجيب! ومَن اختارت الأميرة؟
      en: Wow! So who did the princess choose?
    - speaker: Mas Rizal
      text: Itu cerita untuk besok!
      ar_eg: دي حدوتة بكرة!
      ar: تلك حكاية الغد!
      en: That's a story for tomorrow!
