schema: kabar.lesson/v1
id: bipa6.u10.l09
language: id
title: Diskusi filsafat
can_do:
  ar_eg: تشارك في نقاش فلسفي عن الإدراك والتحيز والأيديولوجيا وتفكر بدقة.
  ar: أن تشارك في نقاش فلسفي عن الإدراك والتحيّز والأيديولوجيا وتفكّر بدقة.
  en: Join a philosophy discussion on perception, bias and ideology, and think carefully.
slides:
  - title: Berpikir kritis
    body:
      ar_eg: |
        نقاش في كافيه جنب الجامعة في ميدان:
        filsafat = فلسفة (من فلسفة). persepsi = إدراك، طريقة الشوف. wawasan = سعة الأفق، معرفة واسعة.
        bias = تحيز. ideologi = أيديولوجيا. konvensional = تقليدي، متعارف عليه.
        mendasar = جوهري، أساسي (من dasar). cermat = دقيق، واخد باله من التفاصيل.
      ar: |
        نقاش في مقهى قرب الجامعة في ميدان:
        filsafat = فلسفة. persepsi = إدراك، تصوّر. wawasan = سعة الأفق، اطّلاع.
        bias = تحيّز. ideologi = أيديولوجيا. konvensional = تقليدي.
        mendasar = جوهري (من dasar). cermat = دقيق، متأنٍّ.
      en: |
        A discussion in a café near the university in Medan:
        filsafat = philosophy (from Arabic فلسفة). persepsi = perception. wawasan = insight, broad knowledge.
        bias = bias. ideologi = ideology. konvensional = conventional.
        mendasar = fundamental (from dasar). cermat = careful, meticulous.
    examples:
      - text: Filsafat mengajukan pertanyaan yang mendasar.
        ar_eg: الفلسفة بتسأل أسئلة جوهرية.
        ar: تطرح الفلسفة أسئلة جوهرية.
        en: Philosophy asks fundamental questions.
      - text: Persepsi kita bisa dipengaruhi bias.
        ar_eg: إدراكنا ممكن يتأثر بالتحيز.
        ar: قد يتأثّر إدراكنا بالتحيّز.
        en: Our perception can be shaped by bias.
      - text: Membaca dengan cermat menambah wawasan.
        ar_eg: القراية بدقة بتوسّع الأفق.
        ar: القراءة المتأنّية توسّع الأفق.
        en: Reading carefully broadens your horizons.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: filsafat
        ar_eg: فلسفة
        ar: فلسفة
        en: philosophy
      - text: persepsi
        ar_eg: إدراك
        ar: إدراك
        en: perception
      - text: wawasan
        ar_eg: سعة الأفق
        ar: اطّلاع، بصيرة
        en: insight, breadth of knowledge
      - text: bias
        ar_eg: تحيز
        ar: تحيّز
        en: bias
    words: [filsafat, persepsi, wawasan, bias]
  - id: e02
    type: match_pairs
    pairs:
      - text: ideologi
        ar_eg: أيديولوجيا
        ar: أيديولوجيا
        en: ideology
      - text: konvensional
        ar_eg: تقليدي
        ar: تقليدي
        en: conventional
      - text: mendasar
        ar_eg: جوهري
        ar: جوهري
        en: fundamental
      - text: cermat
        ar_eg: دقيق
        ar: دقيق، متأنٍّ
        en: careful
    words: [ideologi, konvensional, mendasar, cermat]
  - id: e03
    type: listen
    text: Bacalah pertanyaan ini dengan cermat sebelum menjawab.
    question:
      ar_eg: نقرا السؤال إزاي؟
      ar: كيف نقرأ السؤال؟
      en: How should we read the question?
    options: [بدقة, بسرعة, بصوت عالي]
    answer: 0
    meaning:
      ar_eg: اقرا السؤال ده بدقة قبل ما تجاوب.
      ar: اقرأ هذا السؤال بتأنٍّ قبل أن تجيب.
      en: Read this question carefully before answering.
    words: [cermat]
  - id: e04
    type: fill_blank
    sentence: Pancasila adalah ___ negara Indonesia.
    meaning:
      ar_eg: البانتشاسيلا هي ___ الدولة الإندونيسية.
      ar: البانتشاسيلا ___ الدولة الإندونيسية.
      en: Pancasila is the Indonesian state's ___.
    options: [ideologi, persepsi, wawasan]
    answers: [ideologi]
    words: [ideologi, persepsi, wawasan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الباحث اللي بيختار البيانات اللي تعجبه بس، عنده إيه؟
      ar: الباحث الذي ينتقي البيانات التي تعجبه فقط لديه…
      en: A researcher who picks only the data he likes has…
    options: [filsafat, bias, cermat]
    answer: 1
    explain:
      ar_eg: bias = تحيز.
      ar: bias = تحيّز.
      en: bias = bias.
    words: [bias, filsafat, cermat]
  - id: e06
    type: fill_blank
    sentence: Bank ___ berbeda dengan bank syariah.
    meaning:
      ar_eg: البنك ___ غير البنك الإسلامي.
      ar: يختلف البنك ___ عن البنك الإسلامي.
      en: A ___ bank differs from an Islamic bank.
    options: [konvensional, mendasar, bias]
    answers: [konvensional]
    words: [konvensional, mendasar, bias]
  - id: e07
    type: multiple_choice
    question: Perbedaan antara keduanya sangat ___, bukan kecil.
    options: [persepsi, ideologi, mendasar]
    answer: 2
    explain:
      ar_eg: mendasar = جوهري، من dasar (أساس).
      ar: mendasar = جوهري، من dasar (أساس).
      en: mendasar = fundamental, from dasar (basis).
    words: [mendasar, persepsi, ideologi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: السفر بيوسّع أفقنا.
      ar: السفر يوسّع أفقنا.
      en: Travel broadens our horizons.
    answer: Perjalanan menambah wawasan kita.
    distractors: [bias, cermat]
    words: [wawasan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Ibnu Rusyd menulis tentang filsafat dan agama.
    answers_meaning:
      ar_eg: [ابن رشد كتب عن الفلسفة والدين, ابن رشد ألّف في الفلسفة والدين]
      ar: [كتب ابن رشد عن الفلسفة والدين]
      en: [Ibn Rushd wrote about philosophy and religion, Averroes wrote on philosophy and religion]
    words: [filsafat]
  - id: e10
    type: speaking
    text: Cara berpikir yang konvensional sering penuh bias.
    meaning:
      ar_eg: طريقة التفكير التقليدية كتير بتبقى مليانة تحيز.
      ar: كثيرًا ما تمتلئ طريقة التفكير التقليدية بالتحيّز.
      en: Conventional thinking is often full of bias.
    words: [konvensional, bias]
dialogue:
  lines:
    - speaker: Rani
      text: 'Pertanyaan malam ini mendasar: apakah kita bisa berpikir tanpa bias?'
      ar_eg: 'سؤال الليلة جوهري: هل نقدر نفكر من غير تحيز؟'
      ar: 'سؤال الليلة جوهري: هل يمكننا التفكير بلا تحيّز؟'
      en: 'Tonight''s question is fundamental: can we think without bias?'
    - speaker: Mohamed
      text: Sulit. Persepsi kita dibentuk oleh keluarga, agama, dan ideologi.
      ar_eg: صعب. إدراكنا بيتشكّل من العيلة والدين والأيديولوجيا.
      ar: صعب. يتشكّل إدراكنا بالأسرة والدين والأيديولوجيا.
      en: Hard. Our perception is shaped by family, religion and ideology.
    - speaker: Rani
      text: Jadi apa yang bisa kita lakukan?
      ar_eg: طب نعمل إيه؟
      ar: فماذا نستطيع أن نفعل؟
      en: So what can we do?
    - speaker: Mohamed
      text: Membaca dengan cermat dan menambah wawasan. Ibnu Rusyd juga berkata begitu.
      ar_eg: نقرا بدقة ونوسّع أفقنا. ابن رشد قال كده برضه.
      ar: أن نقرأ بتأنٍّ ونوسّع أفقنا. وهذا ما قاله ابن رشد أيضًا.
      en: Read carefully and broaden our horizons. Ibn Rushd said as much.
    - speaker: Rani
      text: Wah, filsafat Arab di kafe Medan! Ini tidak konvensional.
      ar_eg: الله، فلسفة عربي في كافيه في ميدان! ده مش تقليدي خالص.
      ar: يا للروعة، فلسفة عربية في مقهى في ميدان! هذا غير تقليدي.
      en: Wow, Arab philosophy in a Medan café! That's unconventional.
