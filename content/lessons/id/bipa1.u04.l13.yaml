schema: kabar.lesson/v1
id: bipa1.u04.l13
language: id
title: Awal dan akhir
can_do:
  ar_eg: تقول أول وآخر الشهر والسنة، وتسأل عن السن، وتستخدم «فاكر» و«مثلًا».
  ar: أن تذكر أول الشهر والسنة وآخرهما، وتسأل عن العمر، وتستعمل «أتذكّر» و«مثال».
  en: Say the beginning and end of a month or year, ask someone's age, and use "remember" and "example".
slides:
  - title: Awal bulan, akhir tahun
    body:
      ar_eg: |
        awal = أول، وakhir = آخر: awal bulan (أول الشهر)، akhir tahun (آخر السنة).
        setahun = سنة واحدة (se- معناها «واحد»). والسنة بتبقى على kalender (نتيجة).
        usia = umur بس أرسمي: هتلاقيها في الاستمارات والأخبار.
        ingat = يفتكر: «Saya ingat!» = أنا فاكر!
        angka = رقم مكتوب (7)، أما nomor فرقم حاجة (رقم الموبايل). وcontoh = مثال.
      ar: |
        awal = أوّل، وakhir = آخِر: awal bulan (أوّل الشهر)، akhir tahun (آخر السنة).
        setahun = سنة واحدة (فالمقطع se- يعني «واحد»)، والسنة مدوّنة في الـ kalender (التقويم).
        usia مثل umur لكنها أرسم، وتراها في الاستمارات والأخبار.
        ingat = يتذكّر: «Saya ingat!» = أتذكّر!
        angka = الرقم المكتوب (7)، أما nomor فرقم الشيء (رقم الهاتف). وcontoh = مثال.
      en: |
        awal = beginning and akhir = end: awal bulan (the start of the month), akhir tahun (the end of the year).
        setahun = one year (se- means "one"). The year is on the kalender.
        usia = age, a more formal umur: you'll see it on forms and in the news.
        ingat = remember: "Saya ingat!" = I remember!
        angka = a written digit (7), while nomor is the number of something (a phone number). contoh = example.
    examples:
      - text: Usia nenek saya delapan puluh tahun.
        ar_eg: جدتي عندها ٨٠ سنة.
        ar: عمر جدّتي ثمانون سنة.
        en: My grandmother is eighty years old.
      - text: Ulang tahun saya awal bulan Juni, tanggal dua.
        ar_eg: عيد ميلادي أول شهر يونيو، يوم ٢.
        ar: عيد ميلادي في أوّل يونيو، يوم الثاني.
        en: My birthday is at the start of June, on the second.
      - text: Setahun itu dua belas bulan.
        ar_eg: السنة ١٢ شهر.
        ar: السنة اثنا عشر شهرًا.
        en: A year is twelve months.
