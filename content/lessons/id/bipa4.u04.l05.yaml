schema: kabar.lesson/v1
id: bipa4.u04.l05
language: id
title: Rumor di grup WhatsApp
can_do:
  ar_eg: تفرّق بين الإشاعة والحقيقة وتسأل الخبر ده اتأكد ولا لأ.
  ar: أن تميّز الإشاعة من الحقيقة وتسأل هل تأكّد الخبر.
  en: Tell rumour from fact and ask whether a story has been confirmed.
slides:
  - title: Benar atau hoaks?
    body:
      ar_eg: |
        rumor = إشاعة، gosip = نميمة، كلام عن الناس، dugaan = شك أو اشتباه (dugaan korupsi = اشتباه في فساد).
        tuduhan = اتهام، beredar = منتشر، رايح جاي بين الناس، tersebar = اتنشر في كل حتة.
        dikonfirmasi = اتأكد رسميًا، faktanya = الحقيقة إن...
      ar: |
        rumor = إشاعة، gosip = نميمة، dugaan = شبهة، اشتباه (dugaan korupsi = شبهة فساد).
        tuduhan = اتهام، beredar = متداول بين الناس، tersebar = انتشر في كل مكان.
        dikonfirmasi = تأكّد رسميًا، faktanya = في الحقيقة...
      en: |
        rumor = rumour, gosip = gossip, dugaan = suspicion, alleged (dugaan korupsi = alleged corruption).
        tuduhan = accusation, beredar = circulating, tersebar = spread everywhere.
        dikonfirmasi = confirmed, faktanya = in fact, the fact is...
    examples:
      - text: Rumor itu beredar di grup WhatsApp keluarga.
        ar_eg: الإشاعة دي رايحة جاية في جروب العيلة على الواتساب.
        ar: تتداول تلك الإشاعة في مجموعة العائلة على واتساب.
        en: That rumour is going round the family WhatsApp group.
      - text: Berita itu belum dikonfirmasi oleh polisi.
        ar_eg: الخبر ده لسه ما اتأكدش من البوليس.
        ar: لم تؤكد الشرطة ذلك الخبر بعد.
        en: The police haven't confirmed that story yet.
      - text: Faktanya, tidak ada gempa kemarin.
        ar_eg: الحقيقة إن مفيش زلزال حصل امبارح.
        ar: في الحقيقة، لم يقع زلزال أمس.
        en: In fact, there was no earthquake yesterday.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rumor
        ar_eg: إشاعة
        ar: إشاعة
        en: rumour
      - text: gosip
        ar_eg: نميمة
        ar: نميمة
        en: gossip
      - text: dugaan
        ar_eg: اشتباه
        ar: شبهة
        en: suspicion
      - text: tuduhan
        ar_eg: اتهام
        ar: اتهام
        en: accusation
    words: [rumor, gosip, dugaan, tuduhan]
  - id: e02
    type: match_pairs
    pairs:
      - text: beredar
        ar_eg: منتشر بين الناس
        ar: متداول
        en: circulating
      - text: tersebar
        ar_eg: اتنشر
        ar: انتشر
        en: spread
      - text: dikonfirmasi
        ar_eg: اتأكد
        ar: تأكّد
        en: confirmed
      - text: faktanya
        ar_eg: الحقيقة إن
        ar: في الحقيقة
        en: in fact
    words: [beredar, tersebar, dikonfirmasi, faktanya]
  - id: e03
    type: listen
    text: Kabar itu sudah dikonfirmasi oleh sekolah.
    question:
      ar_eg: حصل إيه للخبر؟
      ar: ماذا حدث للخبر؟
      en: What happened to the news?
    options: [اتأكد, إشاعة, اتهام]
    answer: 0
    meaning:
      ar_eg: الخبر ده المدرسة أكدته خلاص.
      ar: أكّدت المدرسة ذلك الخبر.
      en: The school has confirmed that news.
    words: [dikonfirmasi]
  - id: e04
    type: fill_blank
    sentence: Videonya ___ ke seluruh Indonesia dalam satu jam.
    meaning:
      ar_eg: الفيديو ___ في إندونيسيا كلها في ساعة.
      ar: ___ الفيديو في كل إندونيسيا خلال ساعة.
      en: The video ___ all over Indonesia in an hour.
    options: [tersebar, faktanya, dugaan]
    answers: [tersebar]
    words: [tersebar, faktanya, dugaan]
    explain:
      ar_eg: tersebar = اتنشر، والفيديو اتنشر في كل حتة. faktanya = الحقيقة إن، وdugaan = اشتباه.
      ar: tersebar = انتشر، فقد انتشر الفيديو في كل مكان. أما faktanya فالحقيقة أن، وdugaan الاشتباه.
      en: "tersebar means spread: the video spread everywhere. faktanya is \"in fact\", and dugaan is suspicion."
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كلام الجيران عن جواز بنت الجيران. ده إيه؟
      ar: حديث الجيران عن زواج ابنة الجيران. ما هذا؟
      en: Neighbours chatting about the neighbour's daughter's wedding. What's that?
    options: [tuduhan, gosip, dikonfirmasi]
    answer: 1
    explain:
      ar_eg: gosip = نميمة، كلام عن حياة الناس.
      ar: gosip = نميمة وحديث عن حياة الناس.
      en: gosip = gossip.
    words: [tuduhan, gosip, dikonfirmasi]
  - id: e06
    type: fill_blank
    sentence: Orang itu dibawa polisi karena ___ mencuri motor.
    meaning:
      ar_eg: البوليس خد الراجل ده بسبب ___ إنه سرق موتوسيكل.
      ar: اقتادت الشرطة ذلك الرجل بسبب ___ بسرقة دراجة نارية.
      en: Police took that man away on ___ of stealing a motorbike.
    options: [dugaan, gosip, beredar]
    answers: [dugaan]
    words: [dugaan, gosip, beredar]
    explain:
      ar_eg: karena dugaan = بتهمة أو اشتباه. gosip = نميمة، وberedar = منتشر، ومش بيجوا قبل فعل السرقة.
      ar: karena dugaan = بتهمة أو اشتباه. أما gosip فالنميمة، وberedar منتشر، ولا يسبقان فعل السرقة.
      en: karena dugaan means "on suspicion of". gosip (gossip) and beredar (circulating) can't come before the verb mencuri.
  - id: e07
    type: multiple_choice
    question: Dia menolak ___ itu. Katanya dia tidak mencuri.
    options: [rumor, faktanya, tuduhan]
    answer: 2
    explain:
      ar_eg: tuduhan = اتهام.
      ar: tuduhan = اتهام.
      en: tuduhan = accusation.
    words: [rumor, faktanya, tuduhan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الإشاعة دي متداولة على السوشيال ميديا.
      ar: هذه الإشاعة متداولة على وسائل التواصل.
      en: This rumour is circulating on social media.
    answer: Rumor ini beredar di media sosial.
    distractors: [tersebar, gosip]
    words: [rumor, beredar, tersebar, gosip]
    explain:
      ar_eg: beredar = منتشر وبيلفّ، وrumor = إشاعة. tersebar قريبة بس مش هي الكلمة، وgosip = نميمة.
      ar: beredar = متداول، وrumor = الإشاعة. أما tersebar فقريبة لكنها ليست الكلمة المطلوبة، وgosip النميمة.
      en: beredar means circulating, and rumor is a rumour. tersebar is close but isn't the word used, and gosip is gossip.
  - id: e09
    type: translate
    direction: from_target
    source_text: Faktanya, berita itu belum dikonfirmasi.
    answers_meaning:
      ar_eg: [الحقيقة إن الخبر ده لسه ما اتأكدش, في الحقيقة الخبر ده لسه مش مؤكد]
      ar: [في الحقيقة، لم يُؤكَّد ذلك الخبر بعد, الحقيقة أن ذلك الخبر لم يتأكّد بعد]
      en: ['In fact, that news hasn''t been confirmed yet', 'The fact is the story isn''t confirmed yet']
    words: [faktanya, dikonfirmasi]
  - id: e10
    type: speaking
    text: Jangan cepat percaya rumor dan tuduhan di internet.
    meaning:
      ar_eg: ما تصدّقش بسرعة الإشاعات والاتهامات اللي على النت.
      ar: لا تصدّق سريعًا الإشاعات والاتهامات على الإنترنت.
      en: Don't be quick to believe rumours and accusations online.
    words: [rumor, tuduhan, dugaan, beredar]
dialogue:
  lines:
    - speaker: Andi
      text: Mohamed, katanya sekolah di Makassar libur seminggu. Rumornya beredar di grup.
      ar_eg: يا محمد، بيقولوا المدارس في ماكاسار أجازة أسبوع. الإشاعة منتشرة في الجروب.
      ar: يا محمد، يُقال إن مدارس ماكاسار في عطلة أسبوعًا. الإشاعة متداولة في المجموعة.
      en: Mohamed, they say Makassar schools are off for a week. The rumour's going round the group.
    - speaker: Mohamed
      text: Udah dikonfirmasi sama dinas pendidikan?
      ar_eg: اتأكد من مديرية التعليم؟
      ar: هل أكّدت ذلك مديرية التعليم؟
      en: Has the education office confirmed it?
    - speaker: Andi
      text: Belum. Tapi pesannya udah tersebar ke mana-mana.
      ar_eg: لسه. بس الرسالة اتنشرت في كل حتة.
      ar: ليس بعد. لكن الرسالة انتشرت في كل مكان.
      en: Not yet. But the message has spread everywhere.
    - speaker: Kak Nirmala
      text: Aku wartawan. Faktanya, sekolah masih buka. Itu cuma gosip.
      ar_eg: أنا صحفية. الحقيقة إن المدارس شغالة عادي. ده كلام وبس.
      ar: أنا صحفية. في الحقيقة المدارس مفتوحة، وهذه مجرد نميمة.
      en: I'm a journalist. In fact, schools are open. It's just gossip.
    - speaker: Mohamed
      text: Nah, jangan cepet percaya dugaan kayak gitu!
      ar_eg: أهو، ما تصدّقش كلام زي ده بسرعة!
      ar: أرأيت؟ لا تتسرّع في تصديق ظنون كهذه!
      en: See, don't be quick to believe guesses like that!
