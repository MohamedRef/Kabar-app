  - id: e09
    type: multiple_choice
    question: Saya hanya minum air putih.
    question_meaning:
      ar_eg: هو بيشرب إيه؟
      ar: ماذا يشرب؟
      en: What does he drink?
    options: ['Air putih saja.', 'Kopi dan air putih.', 'Teh manis.']
    answer: 0
    explain:
      ar_eg: hanya = بس / فقط، زي saja بس قبل الفعل.
      ar: hanya = فقط، مثل saja لكنها تأتي قبل الفعل.
      en: hanya = only, like saja but placed before the verb.
    words: [hanya]
dialogue:
  title: Pagi di Tetebatu
  lines:
    - speaker: Mohamed
      text: Lihat, Mas! Ada asap di puncak Rinjani!
      ar_eg: بص يا ماس! فيه دخان على قمة رينجاني!
      ar: انظر يا ماس! هناك دخان على قمة رينجاني!
      en: Look, Mas! There's smoke on Rinjani's summit!
    - speaker: Mas Rizal
      text: Itu bukan asap, melainkan awan.
      ar_eg: ده مش دخان، ده سحاب.
      ar: ليس ذلك دخانًا، بل سحاب.
      en: That isn't smoke, it's cloud.
    - speaker: Mohamed
      text: Oh, syukurlah. Apakah gempa tahun 2018 juga merusak desa ini?
      ar_eg: آه، الحمد لله. وهو زلزال 2018 بوّظ القرية دي كمان؟
      ar: الحمد لله. وهل دمّر زلزال 2018 هذه القرية أيضًا؟
      en: Oh, thank goodness. Did the 2018 earthquake damage this village too?
    - speaker: Mas Rizal
      text: Ya. Gempa itu tidak hanya merusak rumah, tetapi juga jembatan dan masjid.
      ar_eg: أيوه. الزلزال ده مش بس بوّظ البيوت، لأ والكباري والجوامع كمان.
      ar: نعم. لم يدمّر البيوت فحسب، بل الجسور والمساجد أيضًا.
      en: Yes. It damaged not only houses but also bridges and mosques.
    - speaker: Mas Rizal
      text: Baik warga Lombok maupun orang dari luar Lombok ikut membantu.
      ar_eg: وأهل لومبوك والناس اللي من برّه لومبوك، الكل ساعد.
      ar: وقد ساعد كلٌّ من أهل لومبوك والقادمين من خارجها.
      en: Both Lombok people and people from outside Lombok came to help.
