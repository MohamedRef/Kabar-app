    source:
      ar_eg: في يوم من الأيام، الأميرة مانداليكا نطّت في البحر.
      ar: وفي يوم من الأيام ألقت الأميرة مانداليكا بنفسها في البحر.
      en: One day, Princess Mandalika leapt into the sea.
    answer: Suatu hari, Putri Mandalika terjun ke laut.
