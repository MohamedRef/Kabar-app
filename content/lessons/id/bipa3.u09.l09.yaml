    type: match_pairs
    pairs:
      - text: berlari-larian
        ar_eg: بيجروا هنا وهناك
        ar: يتراكضون
        en: to run about
      - text: bermaaf-maafan
        ar_eg: يسامحوا بعض
        ar: يتسامحون
        en: to forgive each other
      - text: berhari-hari
        ar_eg: أيام وأيام
        ar: أيامًا طويلة
        en: for days
      - text: raja
        ar_eg: ملك
        ar: ملك
        en: king
      - text: keledai
        ar_eg: حمار
        ar: حمار
        en: donkey
      - text: amanat
        ar_eg: العبرة
        ar: العبرة
        en: moral
    words: [berlari-larian, bermaaf-maafan, berhari-hari, raja, keledai, amanat]
  - id: e02
    type: multiple_choice
    question: Setelah salat Id, semua orang ___.
    options: [bersalam-salaman, bersalaman-salaman, saling bersalam-salaman]
    answer: 0
    explain:
      ar_eg: الجذر salam هو اللي بيتكرر، و-an مرة واحدة، ومن غير saling.
      ar: يُكرَّر الجذر salam وتأتي -an مرة واحدة، بلا saling.
      en: Double the root salam, add -an once, and leave out saling.
    words: [bersalam-salaman]
  - id: e03
    type: multiple_choice
    question: ___, hiduplah seorang raja yang sombong.
    options: [Akhirnya, Suatu hari, Pada zaman dahulu]
    answer: 2
    words: [zaman, hiduplah, sombong]
  - id: e04
    type: listen
    text: Anak-anak berkejar-kejaran di Pantai Pink.
    options:
      - Anak-anak berlari-larian di Pantai Pink.
      - Anak-anak berkejar-kejaran di Pantai Pink.
      - Anak-anak berkejar-kejaran di pasar.
    answer: 1
    meaning:
      ar_eg: العيال بيجروا ورا بعض على البينك بيتش.
      ar: يتطارد الأطفال على الشاطئ الوردي.
      en: The children are chasing each other on Pink Beach.
    words: [berkejar-kejaran]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «سنين»؟
      ar: أيّ كلمة تعني «سنواتٍ طويلة»؟
      en: Which word means "for years"?
    options: [bertahun-tahun, bertahun, tahun-tahunan]
    answer: 0
    words: [bertahun-tahun]
  - id: e06
    type: fill_blank
    sentence: Para pangeran datang ke istana untuk ___ putri itu.
    meaning:
      ar_eg: الأمرا جم القصر عشان يطلبوا إيد الأميرة.
      ar: جاء الأمراء إلى القصر ليخطبوا الأميرة.
      en: The princes came to the palace to propose to the princess.
    options: [menuntun, melamar, menunggang]
    answers: [melamar]
    words: [melamar, pangeran, istana]
  - id: e07
    type: fill_blank
    sentence: Kami menunggu kapal ___ di pelabuhan.
    meaning:
      ar_eg: (ساعات وساعات) استنينا المركب ساعات في الميناء.
      ar: (ساعاتٍ طويلة) انتظرنا السفينة ساعاتٍ في الميناء.
      en: (for hours) We waited for the boat for hours at the port.
    answers: [berjam-jam]
    words: [berjam-jam]
  - id: e08
