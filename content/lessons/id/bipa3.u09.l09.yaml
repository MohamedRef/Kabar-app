dialogue:
  title: Cerita dari Lombok
  lines:
    - speaker: Rina
      text: Mohamed, kamu sudah dengar legenda Putri Mandalika?
      ar_eg: يا محمد، سمعت أسطورة الأميرة مانداليكا؟
      ar: يا محمد، هل سمعتَ أسطورة الأميرة مانداليكا؟
      en: Mohamed, have you heard the legend of Princess Mandalika?
    - speaker: Mohamed
      text: Sudah! Para pangeran menunggu berhari-hari, tetapi putri itu tidak memilih.
      ar_eg: أيوه! الأمرا استنوا أيام وأيام، بس الأميرة ما اختارتش.
      ar: نعم! انتظر الأمراء أيامًا، لكن الأميرة لم تختر.
      en: Yes! The princes waited for days, but the princess didn't choose.
    - speaker: Rina
      text: Lalu?
      ar_eg: وبعدين؟
      ar: ثم ماذا؟
      en: And then?
    - speaker: Mohamed
      text: Dia terjun ke laut. Sekarang warga datang berbondong-bondong untuk mencari nyale.
      ar_eg: نطّت في البحر. ودلوقتي الأهالي بييجوا أفواج يدوّروا على النيالي.
      ar: ألقت بنفسها في البحر، والآن يأتي الأهالي أفواجًا للبحث عن النيالي.
      en: She leapt into the sea. Now villagers come in droves to look for nyale.
    - speaker: Rina
      text: Menurutmu, apa amanatnya?
      ar_eg: في رأيك، إيه العبرة؟
      ar: في رأيك، ما العبرة؟
      en: What do you think the moral is?
    - speaker: Mohamed
      text: Putri yang baik sayang kepada rakyatnya.
      ar_eg: الأميرة الطيبة بتحب شعبها.
      ar: الأميرة الصالحة تحب شعبها.
      en: A good princess loves her people.
souvenir:
  id: bipa3.u09.souvenir
  title: Legenda Putri Mandalika
  note:
    ar_eg: كل سنة، في شهر فبراير أو مارس، آلاف الناس بيروحوا شط سيجر جنب كوتا قبل الفجر في مهرجان «باو نيالي»، يصطادوا ديدان النيالي الملونة. بيقولوا إن الأميرة مانداليكا رمت نفسها في البحر عشان ما يحصلش حرب بين الأمرا، ورجعت على شكل النيالي عشان تفضل مع شعبها. حدوتة عن الحب والتضحية بتعيش على الشط لحد النهارده.
    ar: في كل عام، في فبراير أو مارس، يقصد آلاف الناس شاطئ سيغر قرب كوتا قبل الفجر في مهرجان «باو نيالي» لصيد ديدان النيالي الملونة. ويُروى أن الأميرة مانداليكا ألقت بنفسها في البحر كي لا تقع حرب بين الأمراء، ثم عادت في صورة النيالي لتبقى مع شعبها. حكاية حبٍّ وتضحية ما زالت تحيا على الشاطئ.
    en: Every year, in February or March, thousands of people go to Seger beach near Kuta before dawn for the Bau Nyale festival, to catch the colourful nyale worms. The story goes that Princess Mandalika threw herself into the sea so the princes would not go to war over her, and came back as the nyale to stay with her people. A tale of love and sacrifice that still lives on the beach.
