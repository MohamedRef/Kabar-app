schema: kabar.lesson/v1
id: bipa3.u09.l09
language: id
title: Ulangan Unit 9
can_do:
  ar_eg: تحكي حدوتة شعبية بالترتيب ومعاها العبرة.
  ar: أن تروي حكاية شعبية مرتبة مع عبرتها.
  en: Retell a folk tale in order, with its moral.
slides:
  - title: Dongeng yang hidup
    body:
      ar_eg: |
        حدوتة حلوة = قالب + صورة حية:
        القالب: Pada zaman dahulu, hiduplah … ← Suatu hari … ← Akhirnya … ← Amanat …
        الصورة: berlari-larian (حركة كتير)، bermaaf-maafan (تبادل)، berhari-hari (مدة طويلة)، berbondong-bondong (أفواج).
      ar: |
        الحكاية الجميلة = قالب + صورة حية:
        القالب: Pada zaman dahulu, hiduplah … ← Suatu hari … ← Akhirnya … ← Amanat …
        الصورة: berlari-larian (حركة كثيرة)، bermaaf-maafan (تبادل)، berhari-hari (مدة طويلة)، berbondong-bondong (أفواجًا).
      en: |
        A good tale = a frame + a vivid picture:
        Frame: Pada zaman dahulu, hiduplah … → Suatu hari … → Akhirnya … → Amanat …
        Picture: berlari-larian (lots of movement), bermaaf-maafan (each other), berhari-hari (a long time), berbondong-bondong (in droves).
    grammar: id.reduplication.ber-an
    examples:
      - text: Pada zaman dahulu, para pangeran menunggu berhari-hari di istana.
        ar_eg: زمان أوي، الأمرا استنوا أيام وأيام في القصر.
        ar: في قديم الزمان انتظر الأمراء أيامًا طويلة في القصر.
        en: Long ago, the princes waited for days on end at the palace.
exercises:
