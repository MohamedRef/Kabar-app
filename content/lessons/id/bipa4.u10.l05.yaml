  - id: e03
    type: listen
    text: Pada tahun 1945 terjadi revolusi di Indonesia.
    question:
      ar_eg: حصل إيه سنة ١٩٤٥؟
      ar: ماذا حدث عام ١٩٤٥؟
      en: What happened in 1945?
    options: [ثورة, زلزال, انتخابات]
    answer: 0
    meaning:
      ar_eg: سنة ١٩٤٥ حصلت ثورة في إندونيسيا.
      ar: عام ١٩٤٥ قامت ثورة في إندونيسيا.
      en: In 1945 a revolution took place in Indonesia.
    words: [revolusi]
  - id: e04
    type: fill_blank
    sentence: Belanda ___ Indonesia selama ratusan tahun.
    meaning:
      ar_eg: الهولنديين ___ إندونيسيا مئات السنين.
      ar: ___ الهولنديون إندونيسيا مئات السنين.
      en: The Dutch ___ Indonesia for hundreds of years.
    options: [memerintah, dipenjara, sekutu]
    answers: [memerintah]
    words: [memerintah, dipenjara, sekutu]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: واحد من عيلة غنية ونبيلة من زمان. ده إيه؟
      ar: شخص من أسرة نبيلة عريقة. ما هو؟
      en: Someone from an old noble family. What is that?
    options: [pemberontak, bangsawan, kepemimpinan]
    answer: 1
    explain:
      ar_eg: bangsawan = نبيل، من الأعيان.
      ar: bangsawan = نبيل.
      en: bangsawan = noble.
    words: [pemberontak, bangsawan, kepemimpinan]
  - id: e06
    type: fill_blank
    sentence: Karena menulis buku itu, dia ___ selama sepuluh tahun.
    meaning:
      ar_eg: عشان كتب الكتاب ده، ___ عشر سنين.
      ar: بسبب تأليفه ذلك الكتاب ___ عشر سنوات.
      en: Because he wrote that book, he was ___ for ten years.
    options: [dipenjara, memerintah, revolusi]
    answers: [dipenjara]
    words: [dipenjara, memerintah, revolusi]
  - id: e07
    type: multiple_choice
    question: Pada tanggal 10 November 1945 rakyat Surabaya melawan tentara ___.
    options: [Bangsawan, Pemberontakan, Sekutu]
    answer: 2
    explain:
      ar_eg: Sekutu = قوات الحلفاء.
      ar: Sekutu = قوات الحلفاء.
      en: Sekutu = the Allied forces.
    words: [bangsawan, pemberontakan, sekutu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: قيادته خلّت الشعب قوي.
      ar: جعلت قيادتُه الشعبَ قويًا.
      en: His leadership made the people strong.
    answer: Kepemimpinannya membuat rakyat kuat.
    distractors: [pemberontak, sekutu]
    words: [kepemimpinan, pemberontak, sekutu]
  - id: e09
    type: translate
    direction: from_target
    source_text: Para pemberontak itu ingin Indonesia merdeka.
    answers_meaning:
      ar_eg: [الثوار دول كانوا عايزين إندونيسيا تستقل, المتمردين كانوا عايزين استقلال إندونيسيا]
      ar: [أراد أولئك الثوّار أن تستقلّ إندونيسيا, كان المتمرّدون يريدون استقلال إندونيسيا]
      en: [Those rebels wanted Indonesia to be independent, The rebels wanted an independent Indonesia]
    words: [pemberontak]
  - id: e10
    type: speaking
    text: Bangsawan itu memimpin pemberontakan dan akhirnya dipenjara.
    meaning:
      ar_eg: النبيل ده قاد انتفاضة وفي الآخر اتسجن.
      ar: قاد ذلك النبيل تمرّدًا وسُجن في النهاية.
      en: That noble led an uprising and was finally imprisoned.
    words: [bangsawan, pemberontakan, dipenjara, revolusi, kepemimpinan]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Mohamed, siapa pahlawan Mesir yang kamu kagumi?
      ar_eg: يا محمد، مين البطل المصري اللي بتحبه؟
      ar: يا محمد، من البطل المصري الذي تُعجب به؟
      en: Mohamed, which Egyptian hero do you admire?
    - speaker: Mohamed
      text: Ahmad Urabi. Dia memimpin pemberontakan pada tahun 1881. Di sini ada tokoh seperti itu?
      ar_eg: أحمد عرابي. قاد ثورة سنة ١٨٨١. هنا فيه حد زيه؟
      ar: أحمد عرابي، قاد ثورة عام ١٨٨١. هل هنا شخصية مثله؟
      en: Ahmed Urabi. He led an uprising in 1881. Is there someone like that here?
    - speaker: Mas Rizal
      text: Ada. Pangeran Diponegoro, seorang bangsawan Jawa. Dia melawan Belanda yang memerintah Jawa.
      ar_eg: أيوه. الأمير ديبونيجورو، نبيل من جاوة. حارب الهولنديين اللي كانوا بيحكموا جاوة.
      ar: نعم. الأمير ديبونيغورو، نبيل جاوي قاوم الهولنديين الذين حكموا جاوة.
      en: Yes. Prince Diponegoro, a Javanese noble. He fought the Dutch who ruled Java.
    - speaker: Mohamed
      text: Apa yang terjadi padanya?
      ar_eg: حصله إيه؟
      ar: ماذا حدث له؟
      en: What happened to him?
    - speaker: Mas Rizal
      text: Dia ditangkap dan dibuang ke Makassar. Makamnya ada di kota ini.
      ar_eg: اتقبض عليه واتنفى لماكاسار. ومقامه في المدينة دي.
      ar: قُبض عليه ونُفي إلى ماكاسار، وقبره في هذه المدينة.
      en: He was captured and exiled to Makassar. His tomb is in this city.
