schema: kabar.lesson/v1
id: bipa4.u10.l05
language: id
title: Pangeran dan pemberontakan
can_do:
  ar_eg: 'تحكي عن أبطال قاوموا الاستعمار: أمير قاد ثورة، وزعيم اتسجن.'
  ar: 'أن تروي سيرة أبطال قاوموا الاستعمار: أمير قاد تمرّدًا وزعيم سُجن.'
  en: 'Tell about heroes who resisted colonial rule: a prince who led an uprising and a leader who was jailed.'
slides:
  - title: Melawan penjajah
    body:
      ar_eg: |
        revolusi = ثورة، pemberontakan = تمرّد، انتفاضة، pemberontak = متمرّد، ثائر.
        bangsawan = من الأعيان، من عيلة نبيلة، memerintah = يحكم (Belanda memerintah Jawa).
        dipenjara = اتسجن، kepemimpinan = القيادة، sekutu = حليف (Sekutu = قوات الحلفاء).
      ar: |
        revolusi = ثورة، pemberontakan = تمرّد، انتفاضة، pemberontak = متمرّد، ثائر.
        bangsawan = نبيل، من الأشراف، memerintah = يحكم (Belanda memerintah Jawa).
        dipenjara = سُجن، kepemimpinan = القيادة، sekutu = حليف (Sekutu = قوات الحلفاء).
      en: |
        revolusi = revolution, pemberontakan = uprising, rebellion; pemberontak = rebel.
        bangsawan = noble, aristocrat; memerintah = to rule, govern (Belanda memerintah Jawa).
        dipenjara = to be imprisoned, kepemimpinan = leadership, sekutu = ally (Sekutu = the Allies).
    examples:
      - text: Pangeran Diponegoro adalah seorang bangsawan dari Yogyakarta.
        ar_eg: الأمير ديبونيجورو كان من الأعيان في يوجياكارتا.
        ar: كان الأمير ديبونيغورو نبيلًا من يوجياكرتا.
        en: Prince Diponegoro was a noble from Yogyakarta.
      - text: Dia memimpin pemberontakan melawan Belanda pada tahun 1825.
        ar_eg: قاد انتفاضة ضد الهولنديين سنة ١٨٢٥.
        ar: قاد تمرّدًا ضد الهولنديين عام ١٨٢٥.
        en: He led an uprising against the Dutch in 1825.
      - text: Sukarno pernah dipenjara oleh Belanda.
        ar_eg: سوكارنو اتسجن قبل كده على إيد الهولنديين.
        ar: سُجن سوكارنو على يد الهولنديين.
        en: Sukarno was once imprisoned by the Dutch.
