schema: kabar.lesson/v1
id: bipa1.u10.l04
language: id
title: Mimpi dan cita-cita
can_do:
  ar_eg: 'تتكلم عن أحلامك وطموحك: تتمنى، متأكد، تنجح أو تفشل، فخور، وتدعي.'
  ar: 'أن تتحدث عن أحلامك وطموحك: تأمل، متأكد، تنجح أو تفشل، فخور، وتدعو.'
  en: 'Talk about dreams and ambitions: hope, be sure, succeed or fail, be proud, and pray.'
slides:
  - title: Cita-cita
    body:
      ar_eg: |
        mimpi = حلم (وإنت نايم أو حلم في حياتك). cita-cita = طموح، الحلم الكبير: «Cita-cita saya jadi dokter.»
        berharap = يتمنى ويأمل. yakin = متأكد: «Saya yakin!»
        sukses = نجاح أو ناجح، وgagal = يفشل. bangga = فخور.
        berdoa = يدعي (من doa = دعاء، من العربي). أما salat فهي الصلاة نفسها.
      ar: |
        mimpi = حلم (في النوم أو في الحياة). cita-cita = الطموح، الحلم الكبير: «Cita-cita saya jadi dokter.»
        berharap = يأمل. yakin = متأكد: «Saya yakin!»
        sukses = النجاح أو ناجح، وgagal = يفشل. bangga = فخور.
        berdoa = يدعو (من doa = دعاء، من العربية)، أما salat فالصلاة نفسها.
      en: |
        mimpi = dream (asleep or in life). cita-cita = ambition, your big dream: "Cita-cita saya jadi dokter."
        berharap = hope. yakin = sure: "Saya yakin!"
        sukses = success, successful; gagal = fail. bangga = proud.
        berdoa = pray, make du'a (doa, from Arabic دعاء); salat is ritual prayer.
    examples:
      - text: Cita-cita saya jadi dokter.
        ar_eg: حلمي أبقى دكتور.
        ar: طموحي أن أصبح طبيبًا.
        en: My ambition is to be a doctor.
      - text: Saya yakin kamu sukses!
        ar_eg: أنا متأكد إنك هتنجح!
        ar: أنا متأكد أنك ستنجح!
        en: I'm sure you'll succeed!
      - text: Sebelum ujian, saya berdoa.
        ar_eg: قبل الامتحان بدعي ربنا.
        ar: قبل الامتحان أدعو الله.
        en: Before an exam, I pray.
