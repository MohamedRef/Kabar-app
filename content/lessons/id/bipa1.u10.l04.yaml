  - id: e03
    type: listen
    text: Tadi malam saya mimpi pergi ke Bali.
    question:
      ar_eg: حلم بإيه؟
      ar: بمَ حلم؟
      en: What did he dream about?
    options: [إنه راح بالي, إنه فشل, إنه نجح]
    answer: 0
    meaning:
      ar_eg: امبارح بالليل حلمت إني رحت بالي.
      ar: حلمت الليلة الماضية أني ذهبت إلى بالي.
      en: Last night I dreamt I went to Bali.
    words: [mimpi]
  - id: e04
    type: fill_blank
    sentence: Cita-cita saya jadi dokter. Saya ___ sukses!
    meaning:
      ar_eg: حلمي أبقى دكتور. ___ أنجح!
      ar: طموحي أن أصبح طبيبًا، و___ أن أنجح!
      en: My ambition is to be a doctor. I ___ I succeed!
    options: [berharap, gagal, bangga]
    answers: [berharap]
    words: [berharap, sukses, gagal, bangga, cita-cita]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: قبل الامتحان بتطلب من ربنا يوفقك. بالإندونيسي؟
      ar: قبل الامتحان تسأل الله التوفيق. بالإندونيسية؟
      en: Before an exam you ask God for help. In Indonesian?
    options: [berdoa, gagal, mimpi]
    answer: 0
    explain:
      ar_eg: berdoa = يدعي. gagal يفشل وmimpi حلم.
      ar: berdoa يدعو، أما gagal فيفشل وmimpi حلم.
      en: berdoa = pray; gagal is fail and mimpi dream.
    words: [berdoa, gagal, mimpi]
  - id: e06
    type: fill_blank
    sentence: Anak saya pintar dan rajin. Saya ___!
    meaning:
      ar_eg: ابني شاطر ومجتهد. أنا ___!
      ar: ابني ذكي ومجتهد. أنا ___!
      en: My child is clever and hard-working. I'm ___!
    options: [bangga, gagal, yakin]
    answers: [bangga]
    words: [bangga, yakin]
  - id: e07
    type: build_sentence
    source:
      ar_eg: أنا متأكد إنك هتنجح!
      ar: أنا متأكد أنك ستنجح!
      en: I'm sure you'll succeed!
    answer: Saya yakin kamu sukses!
    distractors: [gagal, mimpi]
    words: [yakin, sukses]
  - id: e08
    type: translate
    direction: from_target
    source_text: Tidak apa-apa gagal. Coba lagi!
    answers_meaning:
      ar_eg: [مش مشكلة لو فشلت. جرّب تاني!, عادي تفشل. حاول تاني!]
      ar: [لا بأس بالفشل. حاول مرة أخرى!, لا بأس أن تفشل. جرّب ثانية!]
      en: ['It''s OK to fail. Try again!', Failing is fine. Try again!]
    words: [gagal]
  - id: e09
    type: speaking
    text: Cita-cita saya jadi guru. Saya berharap sukses.
    meaning:
      ar_eg: حلمي أبقى مدرس. وبتمنى أنجح.
      ar: طموحي أن أصبح معلّمًا، وآمل أن أنجح.
      en: My ambition is to be a teacher. I hope I succeed.
    words: [cita-cita, berharap]
  - id: e10
    type: multiple_choice
    question: Setiap malam, sebelum tidur, saya ___.
    options: [berdoa, sukses, cita-cita]
    answer: 0
    explain:
      ar_eg: 'قبل النوم بيدعي: berdoa.'
      ar: 'قبل النوم يدعو: berdoa.'
      en: 'Before sleep, he prays: berdoa.'
    words: [berdoa, sukses, cita-cita]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, apa cita-cita kamu?
      ar_eg: يا محمد، إيه حلمك الكبير؟
      ar: يا محمد، ما طموحك؟
      en: Mohamed, what's your big dream?
    - speaker: Mohamed
      text: Aku berharap bisa berbicara bahasa Indonesia setiap hari.
      ar_eg: بتمنى أقدر أتكلم إندونيسي كل يوم.
      ar: آمل أن أتحدّث الإندونيسية كل يوم.
      en: I hope to speak Indonesian every day.
    - speaker: Rina
      text: Aku yakin kamu sukses! Kamu rajin.
      ar_eg: أنا متأكدة إنك هتنجح! إنت مجتهد.
      ar: أنا متأكدة أنك ستنجح! أنت مجتهد.
      en: I'm sure you'll make it! You work hard.
    - speaker: Mohamed
      text: Makasih. Kadang-kadang aku gagal…
      ar_eg: شكرًا. ساعات بفشل…
      ar: شكرًا. أحيانًا أفشل…
      en: Thanks. Sometimes I fail…
    - speaker: Rina
      text: Nggak apa-apa. Aku bangga, kamu udah banyak belajar!
      ar_eg: عادي. أنا فخورة بيك، إنت اتعلمت كتير!
      ar: لا بأس. أنا فخورة، فقد تعلّمت الكثير!
      en: 'That''s OK. I''m proud: you''ve learnt so much!'
    - speaker: Mohamed
      text: Aku juga berdoa setiap hari.
      ar_eg: وأنا كمان بدعي كل يوم.
      ar: وأنا أيضًا أدعو كل يوم.
      en: I pray every day too.
