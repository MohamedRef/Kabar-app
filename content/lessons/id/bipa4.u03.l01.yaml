schema: kabar.lesson/v1
id: bipa4.u03.l01
language: id
title: Membelikan, membuatkan
can_do:
  ar_eg: تقول إنك عملت حاجة عشان حد (اشتريتله، عملتله) بـ -kan.
  ar: أن تعبّر عن فعل شيء لأجل شخص آخر بـ -kan.
  en: Say you did something for someone with -kan.
slides:
  - title: Membelikan = اشترى لـ
    body:
      ar_eg: |
        -kan ليها شغلانة جديدة: تعمل الحاجة «لحد».
        beli → membelikan = يشتري لـ
        buat → membuatkan = يعمل لـ
        ambil → mengambilkan = يجيب لـ
        الترتيب: الفعل + الشخص + الحاجة. زي المصري بالظبط: «اشتريتلك قهوة».
      ar: |
        لـ-kan وظيفة جديدة: الفعل لأجل شخص.
        beli → membelikan = يشتري لـ
        buat → membuatkan = يصنع لـ
        ambil → mengambilkan = يُحضر لـ
        والترتيب: الفعل + المستفيد + الشيء، كقولنا «اشتريتُ لك قهوة».
      en: |
        -kan has a new job: doing something for someone.
        beli → membelikan = buy for
        buat → membuatkan = make for
        ambil → mengambilkan = fetch for
        Order: verb + person + thing — just like Egyptian «اشتريتلك قهوة».
    grammar: id.confix.men-kan
    examples:
      - text: Mas Rizal membelikan saya kopi Toraja.
        ar_eg: مَس رزال اشترالي قهوة توراجا.
        ar: اشترى لي ماس رزال قهوة توراجا.
        en: Mas Rizal bought me some Toraja coffee.
      - text: Pengrajin itu membuatkan kami ukiran kecil.
        ar_eg: الصنايعي ده عملّنا نحتة صغيرة.
        ar: صنع لنا ذلك الحرفي نقشًا صغيرًا.
        en: That craftsman made us a small carving.
  - title: Atau membeli … untuk …
    body:
      ar_eg: |
        ممكن تقول نفس المعنى من غير -kan، بـ untuk:
        Mas Rizal membeli kopi Toraja untuk saya.
        بس مع -kan الشخص لازم ييجي الأول: membelikan adik buku، مش membelikan buku adik.
        وفي الطلب بنشيل meN-: Tolong ambilkan … = من فضلك هات لي …
      ar: |
        ويمكن التعبير بلا -kan مع untuk:
        Mas Rizal membeli kopi Toraja untuk saya.
        لكن مع -kan يتقدّم المستفيد: membelikan adik buku لا membelikan buku adik.
        وفي الطلب تُحذف meN-: Tolong ambilkan … = أحضر لي من فضلك …
      en: |
        Same meaning without -kan, using untuk:
        Mas Rizal membeli kopi Toraja untuk saya.
        But with -kan the person comes first: membelikan adik buku, not membelikan buku adik.
        In requests meN- drops: Tolong ambilkan … = please fetch me …
    grammar: id.confix.men-kan
    examples:
      - text: Tolong ambilkan saya kain tenun itu.
        ar_eg: من فضلك هاتلي القماشة المنسوجة دي.
        ar: أحضر لي ذلك القماش المنسوج من فضلك.
        en: Please fetch me that woven cloth.
  - title: Bikinin = membuatkan
    body:
      ar_eg: |
        في الكلام بيقولوا -in بدل -kan أو -i:
        bikinin = membuatkan، beliin = membelikan، ceritain = menceritakan، ambilin = mengambilkan
        وكمان kayak = seperti، pantes = pantas، buat = untuk.
        اكتب membelikan وmembuatkan في الامتحان والجوابات، وقول beliin وbikinin مع صحابك.
      ar: |
        في الكلام تحلّ -in محلّ -kan أو -i:
        bikinin = membuatkan، beliin = membelikan، ceritain = menceritakan، ambilin = mengambilkan
        وأيضًا kayak = seperti، pantes = pantas، buat = untuk.
        اكتب membelikan وmembuatkan في الامتحان والرسائل، وقل beliin وbikinin مع الأصدقاء.
      en: |
        In speech, -in replaces -kan or -i:
        bikinin = membuatkan, beliin = membelikan, ceritain = menceritakan, ambilin = mengambilkan
        Also kayak = seperti, pantes = pantas, buat = untuk.
        Write membelikan and membuatkan in tests and letters; say beliin and bikinin with friends.
    examples:
      - text: Jangan lupa beliin aku kopi Toraja!
        ar_eg: 'ما تنساش تجيبلي بن توراجا! (بالرسمي: Jangan lupa membelikan saya kopi Toraja!)'
        ar: 'لا تنسَ أن تشتري لي قهوة توراجا! (بالفصحى: Jangan lupa membelikan saya kopi Toraja!)'
        en: 'Don''t forget to buy me Toraja coffee! (Standard: Jangan lupa membelikan saya kopi Toraja!)'
      - text: Gimana Toraja? Ceritain dong!
        ar_eg: 'توراجا عاملة إيه؟ احكي بقى! (بالرسمي: Bagaimana Toraja? Tolong ceritakan!)'
        ar: 'كيف كانت توراجا؟ احكِ لي! (بالفصحى: Bagaimana Toraja? Tolong ceritakan!)'
        en: 'How was Toraja? Tell me! (Standard: Bagaimana Toraja? Tolong ceritakan!)'
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: membelikan
        ar_eg: يشتري لـ
        ar: يشتري لـ
        en: buy for
      - text: membuatkan
        ar_eg: يعمل لـ
        ar: يصنع لـ
        en: make for
      - text: mengambilkan
        ar_eg: يجيب لـ
        ar: يُحضر لـ
        en: fetch for
      - text: ukiran
        ar_eg: نحت / نقش على خشب
        ar: نقش / منحوتة
        en: carving
      - text: pengrajin
        ar_eg: صنايعي / حِرَفي
        ar: حِرَفي
        en: craftsman
      - text: kain tenun
        ar_eg: قماش منسوج يدوي
        ar: قماش منسوج يدويًا
        en: handwoven cloth
    words: [membelikan, membuatkan, mengambilkan, ukiran, pengrajin, kain tenun]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «مَس رزال اشترالي قهوة توراجا»؟
      ar: أيّ جملة تعني «اشترى لي ماس رزال قهوة توراجا»؟
      en: Which sentence means "Mas Rizal bought me Toraja coffee"?
    options: ["Mas Rizal membelikan kopi Toraja saya.", "Mas Rizal membelikan saya kopi Toraja.", "Mas Rizal membeli saya kopi Toraja."]
    answer: 1
    explain:
      ar_eg: مع -kan الشخص الأول وبعدين الحاجة. membeli saya يعني «اشتراني» أنا!
      ar: مع -kan يتقدّم المستفيد ثم الشيء، وmembeli saya تعني «اشتراني».
      en: With -kan the person comes first, then the thing. membeli saya would mean "bought me" as the item!
    words: [membelikan]
  - id: e03
    type: listen
    text: Pengrajin itu membuatkan kami ukiran kecil.
    options: ["Pengrajin itu membuatkan kami ukiran kecil.", "Pengrajin itu membuat ukiran kecil kami.", "Pengrajin itu membelikan kami ukiran kecil."]
    answer: 0
    meaning:
      ar_eg: الصنايعي ده عملّنا نحتة صغيرة.
      ar: صنع لنا ذلك الحرفي نقشًا صغيرًا.
      en: That craftsman made us a small carving.
    words: [pengrajin, membuatkan, ukiran]
  - id: e04
    type: multiple_choice
    question: Tolong ___ saya kain tenun itu.
    question_meaning:
      ar_eg: من فضلك … لي القماشة المنسوجة دي.
      ar: من فضلك … لي ذلك القماش المنسوج.
      en: Please … me that woven cloth.
    options: ["ambil", "diambil", "ambilkan"]
    answer: 2
    explain:
      ar_eg: فيه شخص بيستفيد (saya)، يبقى لازم -kan. وفي الطلب من غير meN-.
      ar: وُجد مستفيد (saya) فلزمت -kan، وفي الطلب تُحذف meN-.
      en: There's a beneficiary (saya), so -kan is needed; requests drop meN-.
    words: [mengambilkan, kain tenun]
  - id: e05
    type: fill_blank
    sentence: Ibu ___ adik baju baru.
    meaning:
      ar_eg: ماما اشترت لأخويا الصغير هدوم جديدة.
      ar: اشترت الأم لأخي الصغير ثيابًا جديدة.
      en: Mum bought my little brother new clothes.
    options: [membelikan, membeli, dibelikan]
    answers: [membelikan]
    words: [membelikan]
  - id: e06
    type: build_sentence
    source:
