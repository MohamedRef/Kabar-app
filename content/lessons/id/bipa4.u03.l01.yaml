      en: That craftsman made me a small carving.
    answer: Pengrajin itu membuatkan saya ukiran kecil.
    distractors: [dibuat, kain]
    words: [pengrajin, membuatkan, ukiran]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اشتريت لماما قماش منسوج.
      ar: اشتريتُ لأمي قماشًا منسوجًا.
