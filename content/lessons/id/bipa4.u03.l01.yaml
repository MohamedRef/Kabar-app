    meaning:
      ar_eg: يا أخ، من فضلك هاتلي النحتة الصغيرة دي.
      ar: من فضلك أحضر لي ذلك النقش الصغير.
      en: Excuse me, could you fetch me that small carving?
    words: [mengambilkan, ukiran]
dialogue:
  title: Di Ke'te' Kesu'
  lines:
    - speaker: Mas Rizal
      text: Di Ke'te' Kesu' ini banyak pengrajin ukiran.
      ar_eg: في كيتي كيسو هنا فيه صنايعية نحت كتير.
      ar: في كيتي كيسو كثير من حِرَفيي النقش.
      en: There are lots of woodcarvers here in Ke'te' Kesu'.
    - speaker: Mohamed
      text: Indah sekali! Pak, tolong ambilkan saya kain tenun itu. Saya mau membelikan ibu saya oleh-oleh.
      ar_eg: جميل أوي! يا أستاذ، من فضلك هاتلي القماشة المنسوجة دي. عايز أشتري لماما هدية.
      ar: جميل جدًا! يا سيدي، أحضر لي ذلك القماش المنسوج من فضلك، أريد أن أشتري لأمي هدية تذكارية.
      en: Beautiful! Sir, could you fetch me that woven cloth? I want to buy my mother a souvenir.
    - speaker: Pak Yohanis
      text: Mau saya buatkan ukiran dengan nama ibu Anda?
      ar_eg: تحب أعملّك نحتة عليها اسم مامتك؟
      ar: هل تريد أن أصنع لك نقشًا يحمل اسم والدتك؟
      en: Would you like me to make you a carving with your mother's name?
    - speaker: Mohamed
      text: Wah, boleh! Berapa lama, Pak?
      ar_eg: يا سلام، ياريت! هتاخد قد إيه يا أستاذ؟
      ar: رائع، نعم! كم يستغرق ذلك يا سيدي؟
      en: Oh, yes please! How long will it take, sir?
    - speaker: Pak Yohanis
      text: Satu jam saja. Sambil menunggu, Mas Rizal bisa membelikan Anda kopi Toraja.
      ar_eg: ساعة بس. ولحد ما تستنى، مَس رزال ممكن يشتريلك قهوة توراجا.
      ar: ساعة واحدة فقط. وريثما تنتظر يمكن لماس رزال أن يشتري لك قهوة توراجا.
      en: Just an hour. While you wait, Mas Rizal can buy you a Toraja coffee.
