schema: kabar.lesson/v1
id: bipa7.u09.l02
language: id
title: Pancasila
can_do:
  ar_eg: تقرا عن البانتشاسيلا، المبادئ الخمسة اللي قايمة عليها الدولة.
  ar: أن تقرأ عن البانتشاسيلا، المبادئ الخمسة التي تقوم عليها الدولة.
  en: Read about Pancasila, the five principles the state rests on.
slides:
  - title: Lima sila
    body:
      ar_eg: |
        الـ Pancasila (من السنسكريتية: خمسة مبادئ) هي dasar negara (أساس الدولة). كل مبدأ اسمه sila:
        1. Ketuhanan Yang Maha Esa (الإيمان بالإله الواحد)
        2. Kemanusiaan yang adil dan beradab (إنسانية عادلة ومتحضّرة)
        3. Persatuan Indonesia (وحدة إندونيسيا)
        4. Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan (ديمقراطية بالتشاور والتمثيل)
        5. Keadilan sosial bagi seluruh rakyat Indonesia (عدالة اجتماعية لكل الشعب)
        سوكارنو عرضها في خطبة يوم 1 يونيو 1945، واليوم ده بقى «يوم ميلاد البانتشاسيلا» وإجازة رسمية.
        - في الكلام: tapi = tetapi، buat = untuk، baca = membaca.
      ar: |
        الـ Pancasila (من السنسكريتية: المبادئ الخمسة) هي dasar negara (أساس الدولة)، وكلّ مبدأ يسمّى sila:
        1. Ketuhanan Yang Maha Esa (الإيمان بالإله الواحد)
        2. Kemanusiaan yang adil dan beradab (إنسانية عادلة متحضّرة)
        3. Persatuan Indonesia (وحدة إندونيسيا)
        4. Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan (شعبية تقودها الحكمة في التشاور والتمثيل)
        5. Keadilan sosial bagi seluruh rakyat Indonesia (عدالة اجتماعية لجميع الشعب)
        عرضها سوكارنو في خطاب يوم 1 يونيو 1945، فصار هذا اليوم «يوم مولد البانتشاسيلا» وعطلة رسمية.
        - في الكلام اليومي: tapi = tetapi، buat = untuk، baca = membaca.
      en: |
        Pancasila (Sanskrit for "five principles") is the dasar negara (foundation of the state). Each principle is a sila:
        1. Ketuhanan Yang Maha Esa (belief in the One God)
        2. Kemanusiaan yang adil dan beradab (just and civilised humanity)
        3. Persatuan Indonesia (the unity of Indonesia)
        4. Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan (democracy led by wisdom through deliberation and representation)
        5. Keadilan sosial bagi seluruh rakyat Indonesia (social justice for all Indonesians)
        Sukarno set it out in a speech on 1 June 1945; that day is now "Pancasila's birthday", a public holiday.
        - In speech: tapi = tetapi, buat = untuk, baca = membaca.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Pancasila
        ar_eg: المبادئ الخمسة
        ar: المبادئ الخمسة
        en: the five principles
      - text: sila
        ar_eg: مبدأ (من الخمسة)
        ar: مبدأ (من الخمسة)
        en: principle (one of the five)
      - text: dasar negara
        ar_eg: أساس الدولة
        ar: أساس الدولة
        en: foundation of the state
      - text: ketuhanan
        ar_eg: الإيمان بالله
        ar: الإيمان بالإله
        en: belief in God
      - text: keadilan sosial
        ar_eg: عدالة اجتماعية
        ar: عدالة اجتماعية
        en: social justice
    words: [Pancasila, sila, dasar negara, ketuhanan, keadilan sosial]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: البانتشاسيلا فيها كام مبدأ؟
      ar: كم مبدأً في البانتشاسيلا؟
      en: How many principles does Pancasila have?
    options: [tiga sila, lima sila, tujuh sila]
    answer: 1
    words: [sila, Pancasila]
    explain:
      ar_eg: Pancasila = panca (خمسة) + sila (مبدأ)، يعني خمس مبادئ.
      ar: Pancasila = panca (خمسة) + sila (مبدأ)، أي خمسة مبادئ.
      en: panca means five, so five sila.
  - id: e03
    type: fill_blank
    sentence: Sila kelima berbunyi, "___ bagi seluruh rakyat Indonesia."
    meaning:
      ar_eg: المبدأ الخامس بيقول «عدالة اجتماعية لكل الشعب الإندونيسي».
      ar: ينصّ المبدأ الخامس على «عدالة اجتماعية لجميع الشعب الإندونيسي».
      en: The fifth principle reads, "Social justice for all the people of Indonesia."
    options: [Keadilan sosial, Ketuhanan, Dasar negara]
    answers: [Keadilan sosial]
    words: [keadilan sosial]
    explain:
      ar_eg: "المبدأ الخامس: Keadilan sosial (العدالة الاجتماعية) لكل الشعب. Ketuhanan هو الأول، وdasar negara وصف Pancasila كلها."
      ar: المبدأ الخامس Keadilan sosial. Ketuhanan هو الأول وdasar negara وصف للمبادئ كلها.
      en: The fifth sila is Keadilan sosial; Ketuhanan is the first.
  - id: e04
    type: listen
    text: Sila pertama Pancasila adalah Ketuhanan Yang Maha Esa.
    question:
      ar_eg: أول مبدأ بيتكلّم عن إيه؟
      ar: عمَّ يتحدّث المبدأ الأول؟
      en: What is the first principle about?
    options:
      - الإيمان بالإله الواحد.
      - الوحدة الوطنية.
      - الاقتصاد.
    answer: 0
    words: [ketuhanan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: البانتشاسيلا هي أساس الدولة.
      ar: البانتشاسيلا أساس الدولة.
      en: Pancasila is the foundation of the state.
    answer: Pancasila adalah dasar negara.
    distractors: [sila, sosial]
    words: [Pancasila, dasar negara]
    explain:
      ar_eg: Pancasila adalah (هي) + dasar negara (أساس الدولة). sila وsosial زيادة.
      ar: Pancasila adalah dasar negara. sila وsosial زائدتان.
      en: Pancasila + adalah + dasar negara. sila and sosial are extra.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إمتى بيحتفلوا بيوم ميلاد البانتشاسيلا؟
      ar: متى يُحتفل بيوم مولد البانتشاسيلا؟
      en: When is Pancasila's birthday celebrated?
    options:
      - 17 أغسطس.
      - 28 أكتوبر.
      - 1 يونيو.
    answer: 2
    words: [Pancasila]
    explain:
      ar_eg: عيد ميلاد Pancasila يوم 1 يونيو، يوم خطاب سوكارنو 1945. 17 أغسطس الاستقلال، و28 أكتوبر قسم الشباب.
      ar: يُحتفل بميلاد Pancasila في 1 يونيو، يوم خطاب سوكارنو 1945.
      en: Pancasila Day is 1 June; 17 August is independence.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كل مبدأ ليه معنى مهمّ.
      ar: لكلّ مبدأ معنى مهمّ.
      en: Every principle has an important meaning.
    answers:
      - Setiap sila punya makna yang penting.
      - Setiap sila memiliki makna yang penting.
      - Tiap sila punya makna penting.
      - Setiap sila mempunyai arti yang penting.
    words: [sila]
  - id: e08
    type: speaking
    text: Keadilan sosial adalah cita-cita sila kelima.
    meaning:
      ar_eg: العدالة الاجتماعية هي حلم المبدأ الخامس.
      ar: العدالة الاجتماعية غاية المبدأ الخامس.
      en: Social justice is the ideal of the fifth principle.
    words: [keadilan sosial, sila]
  - id: e09
    type: dictation
    text: Dasar negara Indonesia adalah Pancasila.
    meaning:
      ar_eg: أساس دولة إندونيسيا هو البانتشاسيلا.
      ar: أساس الدولة الإندونيسية البانتشاسيلا.
      en: Indonesia's state foundation is Pancasila.
    words: [dasar negara]
  - id: e10
    type: translate
    direction: from_target
    source_text: Sila ketuhanan menjamin setiap warga bebas beribadah menurut agamanya.
    answers_meaning:
      ar_eg:
        - مبدأ الإيمان بالله بيضمن إن كل مواطن حرّ يتعبّد على حسب دينه.
        - مبدأ الإيمان بيضمن لكل واحد حرّية العبادة حسب دينه.
      ar:
        - يكفل مبدأ الإيمان بالإله لكلّ مواطن حرّية العبادة وفق دينه.
        - يضمن مبدأ الإيمان حرّية كلّ مواطن في عبادته بحسب دينه.
      en:
        - The principle of belief in God guarantees every citizen the freedom to worship by their religion.
        - The first principle guarantees each citizen's freedom to worship according to their faith.
    words: [ketuhanan]
dialogue:
  title: Hafalan di sekolah
  lines:
    - speaker: Kak Yosua
      text: Di sekolah dulu, tiap Senin kami baca Pancasila waktu upacara.
      ar_eg: في المدرسة زمان، كل يوم اتنين كنا بنقرا البانتشاسيلا في الطابور.
      ar: في المدرسة كنّا نتلو البانتشاسيلا كلّ يوم اثنين في الطابور.
      en: Back at school, every Monday we recited Pancasila at the flag ceremony.
    - speaker: Mohamed
      text: Kakak masih hafal kelima sila?
      ar_eg: لسّه حافظ المبادئ الخمسة؟
      ar: أما زلتَ تحفظ المبادئ الخمسة؟
      en: Do you still know all five principles by heart?
    - speaker: Kak Yosua
      text: Tentu. Yang paling aku suka sila kelima, keadilan sosial.
      ar_eg: طبعًا. أكتر واحد بحبّه المبدأ الخامس، العدالة الاجتماعية.
      ar: طبعًا، وأحبّها إليّ المبدأ الخامس، العدالة الاجتماعية.
      en: Of course. My favourite is the fifth, social justice.
    - speaker: Mohamed
      text: Menarik. Jadi Pancasila bukan agama, tapi dasar negara buat semua agama.
      ar_eg: حلو. يعني البانتشاسيلا مش دين، دي أساس الدولة لكل الأديان.
      ar: مثير. فالبانتشاسيلا ليست دينًا، بل أساس الدولة لكلّ الأديان.
      en: Interesting. So Pancasila isn't a religion but the state foundation for every faith.
