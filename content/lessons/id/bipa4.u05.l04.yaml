schema: kabar.lesson/v1
id: bipa4.u05.l04
language: id
title: Menjelang tujuh belasan
can_do:
  ar_eg: 'تحكي الحارة بتستعد إزاي لعيد الاستقلال: أعلام ومسابقات وكشافة.'
  ar: 'أن تصف استعداد الحيّ لعيد الاستقلال: أعلام ومسابقات وكشّافة.'
  en: 'Describe how a neighbourhood gets ready for Independence Day: flags, contests and scouts.'
slides:
  - title: Agustus di kampung
    body:
      ar_eg: |
        menjelang = قبل ما ييجي (menjelang 17 Agustus)، menyambut = يستقبل، يحتفل بقدوم حاجة.
        bendera = علم، merdeka = مستقل، حر (Indonesia merdeka pada tahun 1945).
        pramuka = الكشافة، perlombaan = المسابقات (زي lomba بس أشمل)، kostum = زي، كوستيوم، diadakan = اتعمل، اتنظّم.
      ar: |
        menjelang = قُبيل (menjelang 17 Agustus)، menyambut = يستقبل، يحتفل بقدوم أمر.
        bendera = علم، merdeka = مستقلّ، حرّ (Indonesia merdeka pada tahun 1945).
        pramuka = الكشّافة، perlombaan = المسابقات (أشمل من lomba)، kostum = زيّ تنكّري، diadakan = أُقيم، نُظّم.
      en: |
        menjelang = just before (menjelang 17 Agustus), menyambut = to welcome, greet (an occasion).
        bendera = flag, merdeka = independent, free (Indonesia merdeka pada tahun 1945).
        pramuka = scouts, perlombaan = competitions (wider than lomba), kostum = costume, diadakan = held, organised.
    examples:
      - text: Menjelang 17 Agustus, bendera ada di depan setiap rumah.
        ar_eg: قبل ١٧ أغسطس، العلم بيبقى قدام كل بيت.
        ar: قُبيل ١٧ أغسطس يكون العلم أمام كل بيت.
        en: Just before 17 August, there's a flag in front of every house.
      - text: Indonesia merdeka pada tahun 1945.
        ar_eg: إندونيسيا استقلت سنة ١٩٤٥.
        ar: استقلّت إندونيسيا عام ١٩٤٥.
        en: Indonesia became independent in 1945.
      - text: Perlombaan diadakan di lapangan kampung.
        ar_eg: المسابقات بتتعمل في ملعب الحارة.
        ar: تُقام المسابقات في ساحة الحيّ.
        en: The competitions are held on the village field.
