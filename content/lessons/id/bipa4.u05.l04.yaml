  - id: e03
    type: listen
    text: Anak-anak pramuka membawa bendera Merah Putih.
    question:
      ar_eg: مين شايل العلم؟
      ar: من يحمل العلم؟
      en: Who is carrying the flag?
    options: [الكشافة, التجار, العيال الصغيرين]
    answer: 0
    meaning:
      ar_eg: ولاد الكشافة شايلين علم الأحمر والأبيض.
      ar: يحمل أطفال الكشّافة علم الأحمر والأبيض.
      en: The scout children carry the red-and-white flag.
    words: [pramuka, bendera]
  - id: e04
    type: fill_blank
    sentence: ___ Lebaran, pasar selalu ramai.
    meaning:
      ar_eg: ___ العيد، السوق دايمًا زحمة.
      ar: ___ العيد يكون السوق مزدحمًا دائمًا.
      en: ___ Eid, the market is always busy.
    options: [Menjelang, Merdeka, Diadakan]
    answers: [Menjelang]
    words: [menjelang, merdeka, diadakan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللبس اللي العيال بيلبسوه في مسابقة الأبطال. ده إيه؟
      ar: الثياب التي يرتديها الأطفال في مسابقة الأبطال. ما هي؟
      en: What the children wear in the heroes contest. What is it?
    options: [bendera, kostum, pramuka]
    answer: 1
    explain:
      ar_eg: kostum = كوستيوم، زي.
      ar: kostum = زيّ تنكّري.
      en: kostum = costume.
    words: [bendera, kostum, pramuka]
  - id: e06
    type: fill_blank
    sentence: Rapat warga ___ di rumah Pak RT malam ini.
    meaning:
      ar_eg: اجتماع السكان ___ في بيت رئيس الحارة الليلة.
      ar: ___ اجتماع السكان في بيت رئيس الحيّ الليلة.
      en: The residents' meeting is ___ at the RT head's house tonight.
    options: [diadakan, menyambut, kostum]
    answers: [diadakan]
    words: [diadakan, menyambut, kostum]
  - id: e07
    type: multiple_choice
    question: 'Ada banyak ___: balap karung, panjat pinang, dan makan kerupuk.'
    options: [perlombaan, merdeka, menjelang]
    answer: 0
    explain:
      ar_eg: perlombaan = مسابقات كتير.
      ar: perlombaan = مسابقات.
      en: perlombaan = competitions.
    words: [perlombaan, merdeka, menjelang]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أهل الحارة بيحتفلوا بعيد الاستقلال بالمسابقات.
      ar: يحتفل أهل الحيّ بعيد الاستقلال بالمسابقات.
      en: The villagers welcome Independence Day with competitions.
    answer: Warga menyambut Hari Kemerdekaan dengan perlombaan.
    distractors: [kostum, pramuka]
    words: [menyambut, perlombaan, kostum, pramuka]
  - id: e09
    type: translate
    direction: from_target
    source_text: Tujuh puluh tahun lalu kakek saya berteriak, "Merdeka!"
    answers_meaning:
      ar_eg: ['من سبعين سنة جدي صرخ: «حرية!»', 'جدي زعق من سبعين سنة: «استقلال!»']
      ar: ['قبل سبعين عامًا صاح جدّي: «الحرية!»', 'صرخ جدي قبل سبعين سنة: «استقلال!»']
      en: ['Seventy years ago my grandfather shouted, "Freedom!"', 'My grandfather shouted "Independence!" seventy years ago']
    words: [merdeka]
  - id: e10
    type: speaking
    text: Menjelang tujuh belasan, kami memasang bendera dan menyiapkan kostum.
    meaning:
      ar_eg: قبل عيد ١٧، بنعلّق العلم ونجهّز الكوستيومات.
      ar: قُبيل عيد السابع عشر نعلّق العلم ونجهّز الأزياء.
      en: Before the 17th, we put up the flag and get the costumes ready.
    words: [menjelang, bendera, kostum, diadakan, menyambut]
dialogue:
  lines:
    - speaker: Andi Tenri
      text: Mohamed, minggu depan ada perlombaan tujuh belasan di kampung kami.
      ar_eg: يا محمد، الأسبوع الجاي فيه مسابقات ١٧ أغسطس في حارتنا.
      ar: يا محمد، الأسبوع القادم تُقام مسابقات السابع عشر من أغسطس في حيّنا.
      en: Mohamed, next week there are Independence Day competitions in our village.
    - speaker: Mohamed
      text: Diadakan di mana?
      ar_eg: هتتعمل فين؟
      ar: أين ستُقام؟
      en: Where are they held?
    - speaker: Andi Tenri
      text: Di lapangan dekat masjid. Anak-anak pramuka juga ikut.
      ar_eg: في الملعب اللي جنب الجامع. وولاد الكشافة كمان هيشاركوا.
      ar: في الساحة قرب المسجد، ويشارك أطفال الكشّافة أيضًا.
      en: On the field near the mosque. The scouts are taking part too.
    - speaker: Mohamed
      text: Menyenangkan! Apa saya perlu kostum?
      ar_eg: حلو أوي! محتاج كوستيوم؟
      ar: رائع! هل أحتاج إلى زيّ؟
      en: Fun! Do I need a costume?
    - speaker: Andi Tenri
      text: Pakai baju merah putih saja. Kita sama-sama menyambut hari merdeka!
      ar_eg: البس هدوم أحمر وأبيض وخلاص. هنحتفل كلنا بيوم الاستقلال!
      ar: البس ثيابًا حمراء وبيضاء فقط. سنستقبل يوم الاستقلال معًا!
      en: Just wear red and white. Let's welcome Independence Day together!
