schema: kabar.lesson/v1
id: bipa6.u01.l08
language: id
title: Malam di rumah tua
can_do:
  ar_eg: 'تقرا مشهد مرعب وتفهم الجو من الصمت والحركة: يقشعر، يلتفت، يتسمّر.'
  ar: 'أن تقرأ مشهدًا مخيفًا وتفهم الجو من الصمت والحركة: يقشعر، يلتفت، يتسمّر.'
  en: 'Read a spooky scene and get its mood from silence and movement: shivers, turning, freezing.'
slides:
  - title: Suasana malam
    body:
      ar_eg: |
        مشهد: راجل لوحده بالليل في بيت قديم في ميدان.
        kelam = غامق، كئيب (langit kelam). keheningan = سكون تام. kekosongan = فراغ (من kosong).
        bisikan = همس، وشوشة (من berbisik). merinding = جسمه يقشعر.
        menoleh = يلف راسه ويبص. terdiam = يسكت فجأة. terpaku = يتسمّر مكانه.
      ar: |
        مشهد: رجل وحيد ليلًا في بيت قديم في ميدان.
        kelam = قاتم، كئيب (langit kelam). keheningan = سكون تام. kekosongan = فراغ (من kosong).
        bisikan = همس (من berbisik). merinding = يقشعرّ بدنه.
        menoleh = يلتفت. terdiam = يصمت فجأة. terpaku = يتسمّر في مكانه.
      en: |
        Scene: a man alone at night in an old house in Medan.
        kelam = dark, gloomy (langit kelam). keheningan = stillness. kekosongan = emptiness (from kosong).
        bisikan = whisper (from berbisik). merinding = to get goosebumps.
        menoleh = to turn one's head. terdiam = to fall silent. terpaku = to stand rooted.
    examples:
      - text: Keheningan malam pecah oleh sebuah bisikan.
        ar_eg: سكون الليل اتكسر بهمسة.
        ar: كسر همسٌ سكونَ الليل.
        en: The stillness of the night was broken by a whisper.
      - text: Dia menoleh, lalu terpaku di depan pintu.
        ar_eg: لف راسه، وبعدين اتسمّر قدام الباب.
        ar: التفت ثم تسمّر أمام الباب.
        en: He turned, then froze at the door.
      - text: Langit kelam membuatnya merinding.
        ar_eg: السما الغامقة خلّت جسمه يقشعر.
        ar: جعلته السماء القاتمة يقشعرّ.
        en: The dark sky gave him goosebumps.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kelam
        ar_eg: غامق، كئيب
        ar: قاتم
        en: dark, gloomy
      - text: keheningan
        ar_eg: سكون
        ar: سكون، صمت
        en: stillness
      - text: kekosongan
        ar_eg: فراغ
        ar: فراغ
        en: emptiness
      - text: bisikan
        ar_eg: همس
        ar: همس
        en: whisper
    words: [kelam, keheningan, kekosongan, bisikan]
  - id: e02
    type: match_pairs
    pairs:
      - text: merinding
        ar_eg: يقشعر
        ar: يقشعرّ
        en: to get goosebumps
      - text: menoleh
        ar_eg: يلف راسه
        ar: يلتفت
        en: to turn one's head
      - text: terdiam
        ar_eg: سكت فجأة
        ar: صمت فجأة
        en: to fall silent
      - text: terpaku
        ar_eg: اتسمّر
        ar: تسمّر
        en: to stand rooted
    words: [merinding, menoleh, terdiam, terpaku]
  - id: e03
    type: listen
    text: Ada yang memanggil namanya, tetapi dia tidak menoleh.
    question:
      ar_eg: عمل إيه لما ندهوه؟
      ar: ماذا فعل حين نودي؟
      en: What did he do when called?
    options: [ما لفّش, عيّط, جري]
    answer: 0
    meaning:
      ar_eg: حد نادى اسمه، بس ما لفّش.
      ar: ناداه أحدهم باسمه، لكنه لم يلتفت.
      en: Someone called his name, but he didn't turn round.
    words: [menoleh]
  - id: e04
    type: fill_blank
    sentence: Mendengar suara itu, dia ___ di tangga; kakinya tidak bisa bergerak.
    meaning:
      ar_eg: لما سمع الصوت ده، ___ على السلم؛ رجليه مش قادرة تتحرك.
      ar: حين سمع ذلك الصوت ___ على الدرج؛ لم تتحرك قدماه.
      en: Hearing the sound, he ___ on the stairs; his legs wouldn't move.
    options: [terpaku, menoleh, kelam]
    answers: [terpaku]
    words: [terpaku, menoleh, kelam]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الكلمة اللي معناها إن جسمك قشعر من الخوف؟
      ar: ما الكلمة التي تعني اقشعرار البدن من الخوف؟
      en: Which word means your skin crawls with fear?
    options: [terdiam, keheningan, merinding]
    answer: 2
    explain:
      ar_eg: merinding = جسمك يقشعر.
      ar: merinding = اقشعرار البدن.
      en: merinding = to get goosebumps.
    words: [merinding, terdiam, keheningan]
  - id: e06
    type: fill_blank
    sentence: Semua orang ___ ketika lampu tiba-tiba mati.
    meaning:
      ar_eg: كل الناس ___ لما النور قطع فجأة.
      ar: ___ الجميع حين انطفأ النور فجأة.
      en: Everyone ___ when the lights suddenly went out.
    options: [terdiam, merinding, bisikan]
    answers: [terdiam]
    words: [terdiam, merinding, bisikan]
  - id: e07
    type: multiple_choice
    question: Tidak ada suara sama sekali. Hanya ada ___.
    options: [bisikan, keheningan, kekosongan]
    answer: 1
    explain:
      ar_eg: 'مفيش أي صوت = سكون تام: keheningan.'
      ar: 'لا صوت البتة = سكون: keheningan.'
      en: 'No sound at all = stillness: keheningan.'
    words: [keheningan, bisikan, kekosongan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: حس بفراغ كبير في البيت ده.
      ar: شعر بفراغ كبير في ذلك البيت.
      en: He felt a great emptiness in that house.
    answer: Dia merasakan kekosongan yang besar di rumah itu.
    distractors: [kelam, bisikan]
    words: [kekosongan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Langit kelam, dan dari jauh terdengar bisikan angin.
    answers_meaning:
      ar_eg: [السما غامقة، ومن بعيد سامعين همس الريح, السما كانت كئيبة وفيه همس ريح من بعيد]
      ar: [السماء قاتمة، ومن بعيد يُسمع همس الريح]
      en: ['The sky was dark, and from afar came the whisper of the wind', The sky was gloomy and the wind whispered in the distance]
    words: [kelam, bisikan]
  - id: e10
    type: speaking
    text: Dalam keheningan, dia menoleh, lalu terpaku.
    meaning:
      ar_eg: في السكون، لف راسه، وبعدين اتسمّر مكانه.
      ar: في السكون التفت ثم تسمّر في مكانه.
      en: In the silence, he turned, then froze.
    words: [keheningan, menoleh, terpaku]
dialogue:
  lines:
    - speaker: Mohamed
      text: Cerpen ini dibuka dengan langit kelam dan keheningan. Seram!
      ar_eg: القصة دي بتبدأ بسما غامقة وسكون. مرعب!
      ar: تُفتتح هذه القصة بسماء قاتمة وسكون. مخيف!
      en: This story opens with a dark sky and silence. Creepy!
    - speaker: Bang Togar
      text: Lalu ada bisikan dari dapur. Tokohnya menoleh...
      ar_eg: وبعدين فيه همس من المطبخ. البطل بيلف راسه...
      ar: ثم يأتي همس من المطبخ. يلتفت البطل...
      en: Then a whisper from the kitchen. The hero turns...
    - speaker: Mohamed
      text: ...dan terpaku. Saya ikut merinding!
      ar_eg: ...ويتسمّر. أنا كمان جسمي قشعر!
      ar: ...ويتسمّر. اقشعرّ بدني معه!
      en: ...and freezes. I got goosebumps too!
    - speaker: Bang Togar
      text: Tapi ternyata dapurnya kosong. Itu bukan hantu, itu kekosongan setelah istrinya meninggal.
      ar_eg: بس طلع المطبخ فاضي. ده مش عفريت، ده الفراغ بعد ما مراته ماتت.
      ar: لكن المطبخ كان خاليًا. ليس شبحًا، بل الفراغ بعد وفاة زوجته.
      en: But the kitchen is empty. It's no ghost; it's the emptiness after his wife died.
    - speaker: Mohamed
      text: Wah. Saya terdiam membaca akhirnya.
      ar_eg: يا ساتر. سكتّ لما قريت النهاية.
      ar: يا إلهي. صمتُّ حين قرأت النهاية.
      en: Wow. The ending left me speechless.
