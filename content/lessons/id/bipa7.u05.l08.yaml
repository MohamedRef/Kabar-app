schema: kabar.lesson/v1
id: bipa7.u05.l08
language: id
title: Revolusi dan diplomasi
can_do:
  ar_eg: تحكي إزاي إندونيسيا دافعت عن استقلالها بين 1945 و1949 بالسلاح والتفاوض.
  ar: أن تروي كيف دافعت إندونيسيا عن استقلالها بين 1945 و1949 بالسلاح والتفاوض.
  en: Tell how Indonesia defended its independence in 1945–1949, by arms and by negotiation.
slides:
  - title: Empat tahun revolusi
    body:
      ar_eg: |
        بعد إعلان الاستقلال 1945، هولندا رجعت. الكفاح مشي في طريقين:
        1. السلاح: الجنرال سوديرمان قاد gerilya (حرب عصابات) وهو عيّان.
        2. diplomasi و perundingan (مفاوضات): لينجارجاتي (1946)، رينفيل (1948).
        هولندا عملت agresi militer مرتين (1947 و1948). في التانية سوكارنو وحتّا اتقبض عليهم وdiasingkan (اتنفوا) لجزيرة بانجكا.
        يوم 1 مارس 1949: Serangan Umum في يوجياكارتا ورّى العالم إن الجمهورية لسه عايشة.
        بعد gencatan senjata ومؤتمر لاهاي، هولندا اعترفت بـ kedaulatan (سيادة) إندونيسيا في 27 ديسمبر 1949.
        - في الكلام: bantu = membantu.
      ar: |
        بعد إعلان الاستقلال عام 1945 عادت هولندا، فسار الكفاح في طريقين:
        1. السلاح: قاد الجنرال سوديرمان gerilya (حرب العصابات) وهو مريض.
        2. diplomasi وperundingan (المفاوضات): لينغارجاتي (1946) ورينفيل (1948).
        شنّت هولندا agresi militer مرّتين (1947 و1948)، وفي الثانية اعتُقل سوكارنو وحتّا ثم diasingkan (نُفيا) إلى جزيرة بانغكا.
        وفي 1 مارس 1949 أظهر Serangan Umum في يوغياكارتا للعالم أنّ الجمهورية حيّة.
        وبعد gencatan senjata ومؤتمر لاهاي اعترفت هولندا بـ kedaulatan (سيادة) إندونيسيا في 27 ديسمبر 1949.
        - في الكلام اليومي: bantu = membantu.
      en: |
        After the 1945 proclamation, the Dutch returned. The struggle ran on two tracks:
        1. Arms: General Sudirman led a gerilya campaign while seriously ill.
        2. diplomasi and perundingan (negotiations): Linggarjati (1946), Renville (1948).
        The Dutch launched two agresi militer (1947 and 1948). In the second, Sukarno and Hatta were arrested and diasingkan (exiled) to Bangka.
        On 1 March 1949 the Serangan Umum on Yogyakarta showed the world the Republic was alive.
        After a gencatan senjata (ceasefire) and the Hague conference, the Dutch recognised Indonesia's kedaulatan (sovereignty) on 27 December 1949.
        - In speech: bantu = membantu.
    examples:
      - text: Jenderal Sudirman memimpin perang gerilya dari hutan ke hutan.
        ar_eg: الجنرال سوديرمان قاد حرب العصابات من غابة لغابة.
        ar: قاد الجنرال سوديرمان حرب العصابات من غابة إلى أخرى.
        en: General Sudirman led the guerrilla war from forest to forest.
      - text: Perundingan itu berakhir dengan gencatan senjata.
        ar_eg: المفاوضات دي خلصت بوقف إطلاق النار.
        ar: انتهت تلك المفاوضات بوقف لإطلاق النار.
        en: Those negotiations ended in a ceasefire.
      - text: Belanda mengakui kedaulatan Indonesia pada tahun 1949.
        ar_eg: هولندا اعترفت بسيادة إندونيسيا سنة 1949.
        ar: اعترفت هولندا بسيادة إندونيسيا عام 1949.
        en: The Netherlands recognised Indonesian sovereignty in 1949.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gerilya
        ar_eg: حرب عصابات
        ar: حرب العصابات
        en: guerrilla warfare
      - text: agresi militer
        ar_eg: عدوان عسكري
        ar: عدوان عسكري
        en: military aggression
      - text: gencatan senjata
        ar_eg: وقف إطلاق النار / هدنة
        ar: وقف إطلاق النار
        en: ceasefire
      - text: perundingan
        ar_eg: مفاوضات
        ar: مفاوضات
        en: negotiations
    words: [gerilya, agresi militer, gencatan senjata, perundingan]
  - id: e02
    type: match_pairs
    pairs:
      - text: diplomasi
        ar_eg: دبلوماسية
        ar: دبلوماسية
        en: diplomacy
      - text: kedaulatan
        ar_eg: سيادة
        ar: سيادة
        en: sovereignty
      - text: serangan umum
        ar_eg: هجوم شامل
        ar: هجوم عامّ
        en: general offensive
      - text: diasingkan
        ar_eg: اتنفى
        ar: نُفي
        en: to be exiled
    words: [diplomasi, kedaulatan, serangan umum, diasingkan]
  - id: e03
    type: listen
    text: Pada Agresi Militer Kedua, Yogyakarta diduduki Belanda.
    question:
      ar_eg: يوجياكارتا اتحتلّت في إيه؟
      ar: متى احتُلّت يوغياكارتا؟
      en: When was Yogyakarta occupied?
    options: [العدوان العسكري التاني, وقف إطلاق النار, الهجوم الشامل]
    answer: 0
    meaning:
      ar_eg: في العدوان العسكري التاني، هولندا احتلّت يوجياكارتا.
      ar: في العدوان العسكري الثاني احتلّت هولندا يوغياكارتا.
      en: In the Second Military Aggression, the Dutch occupied Yogyakarta.
    words: [agresi militer]
  - id: e04
    type: fill_blank
    sentence: Sukarno dan Hatta ___ ke Pulau Bangka.
    meaning:
      ar_eg: سوكارنو وحتّا ___ لجزيرة بانجكا.
      ar: ___ سوكارنو وحتّا إلى جزيرة بانغكا.
      en: Sukarno and Hatta were ___ to Bangka Island.
    options: [diasingkan, gerilya, kedaulatan]
    answers: [diasingkan]
    words: [diasingkan, gerilya, kedaulatan]
    explain:
      ar_eg: diasingkan = اتنفوا (مبني للمجهول من asing). gerilya = حرب عصابات وkedaulatan = سيادة، مش أفعال.
      ar: diasingkan = نُفيا (مبني للمجهول). gerilya حرب عصابات وkedaulatan سيادة.
      en: diasingkan (were exiled) is the passive verb needed. The others are nouns.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الـ «Serangan Umum» يوم 1 مارس 1949 كان مهم ليه؟
      ar: لماذا كان «Serangan Umum» في 1 مارس 1949 مهمًّا؟
      en: Why did the 1 March 1949 'Serangan Umum' matter?
    options: [Karena mengakhiri tanam paksa., Karena membuktikan kepada dunia bahwa Republik masih ada., Karena Belanda menang.]
    answer: 1
    explain:
      ar_eg: الهجوم ورّى العالم إن الجمهورية لسه موجودة.
      ar: أثبت الهجوم للعالم أنّ الجمهورية قائمة.
      en: The offensive proved the Republic still existed.
    words: [serangan umum, agresi militer]
  - id: e06
    type: fill_blank
    sentence: Selain perang, Indonesia berjuang lewat ___ di forum internasional.
    meaning:
      ar_eg: غير الحرب، إندونيسيا كافحت بـ ___ في المحافل الدولية.
      ar: إلى جانب الحرب كافحت إندونيسيا عبر ___ في المحافل الدولية.
      en: Besides war, Indonesia fought through ___ in international forums.
    options: [diplomasi, gencatan senjata, serangan umum]
    answers: [diplomasi]
    words: [diplomasi, gencatan senjata, serangan umum]
    explain:
      ar_eg: جنب الحرب، الكفاح في المحافل الدولية اسمه diplomasi. gencatan senjata = هدنة وserangan umum = هجوم شامل.
      ar: الكفاح في المحافل الدولية هو diplomasi. gencatan senjata هدنة وserangan umum هجوم عام.
      en: In international forums the struggle is diplomasi.
  - id: e07
    type: build_sentence
    source:
      ar_eg: المفاوضات اتعملت على مركب حربي.
      ar: جرت المفاوضات على متن سفينة حربية.
      en: The negotiations took place on a warship.
    answer: Perundingan itu diadakan di atas kapal perang.
    distractors: [kedaulatan, diplomasi]
    words: [perundingan]
    explain:
      ar_eg: Perundingan itu (المفاوضات) + diadakan (اتعملت) + di atas kapal perang. kedaulatan وdiplomasi زيادة.
      ar: Perundingan itu diadakan di atas kapal perang. kedaulatan وdiplomasi زائدتان.
      en: Perundingan itu + diadakan + di atas kapal perang. kedaulatan and diplomasi are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Gencatan senjata tidak selalu dihormati kedua pihak.
    answers_meaning:
      ar_eg: [وقف إطلاق النار ما كانش دايمًا الطرفين بيحترموه, الهدنة ماكانتش دايمًا متحترمة من الطرفين]
      ar: [لم يحترم الطرفان وقف إطلاق النار دائمًا, لم يكن وقف إطلاق النار محترمًا من الجانبين دائمًا]
      en: ['The ceasefire wasn''t always respected by both sides', 'Both sides didn''t always honour the ceasefire']
    words: [gencatan senjata]
  - id: e09
    type: speaking
    text: Gerilya dan diplomasi berjalan bersama.
    meaning:
      ar_eg: حرب العصابات والدبلوماسية مشيوا مع بعض.
      ar: سارت حرب العصابات والدبلوماسية جنبًا إلى جنب.
      en: Guerrilla war and diplomacy went hand in hand.
    words: [gerilya, diplomasi]
  - id: e10
    type: multiple_choice
    question: Apa hasil akhir tahun 1949?
    options: [Agresi militer ketiga., Para pemimpin diasingkan lagi., Pengakuan kedaulatan Indonesia.]
    answer: 2
    explain:
      ar_eg: آخر 1949 هولندا اعترفت بسيادة إندونيسيا.
      ar: في نهاية 1949 اعترفت هولندا بسيادة إندونيسيا.
      en: At the end of 1949 the Dutch recognised Indonesian sovereignty.
    words: [kedaulatan, agresi militer, diasingkan, perundingan]
dialogue:
  lines:
    - speaker: Pak Hasan
      text: Kemerdekaan tidak selesai pada 17 Agustus 1945, Mohamed.
      ar_eg: الاستقلال ما خلصش يوم 17 أغسطس 1945 يا محمد.
      ar: لم ينتهِ الاستقلال في 17 أغسطس 1945 يا محمد.
      en: Independence didn't end on 17 August 1945, Mohamed.
    - speaker: Mohamed
      text: Ya, Pak. Masih ada empat tahun revolusi.
      ar_eg: أيوه يا أستاذ. كان لسه فيه أربع سنين ثورة.
      ar: نعم يا أستاذ، تبعتها أربع سنوات من الثورة.
      en: Yes, sir. Four more years of revolution followed.
    - speaker: Pak Hasan
      text: Di hutan ada gerilya, di meja ada perundingan.
      ar_eg: في الغابة حرب عصابات، وعلى الترابيزة مفاوضات.
      ar: في الغابة حرب عصابات، وعلى الطاولة مفاوضات.
      en: Guerrilla war in the forest, negotiations at the table.
    - speaker: Mohamed
      text: Dan Mesir bantu lewat diplomasi, kan? Termasuk yang pertama mengakui kita.
      ar_eg: ومصر ساعدت بالدبلوماسية، صح؟ كانت من أوائل اللي اعترفوا بيكم.
      ar: وساعدت مصر بالدبلوماسية، أليس كذلك؟ فقد كانت من أوائل المعترفين.
      en: And Egypt helped through diplomacy, right? Among the first to recognise you.
    - speaker: Pak Hasan
      text: Betul. Pengakuan itu penting sebelum kedaulatan penuh tahun 1949.
      ar_eg: مظبوط. الاعتراف ده كان مهم قبل السيادة الكاملة سنة 1949.
      ar: صحيح، وكان ذلك الاعتراف مهمًّا قبل السيادة الكاملة عام 1949.
      en: Right. That recognition mattered before full sovereignty in 1949.
