        ar: تقليد
        en: tradition
      - text: berkumpul
        ar_eg: يتجمّع
        ar: يجتمع
        en: to gather
      - text: menukar
        ar_eg: يبدّل / يقايض
        ar: يقايض
        en: to swap, barter
      - text: perahu
        ar_eg: مركب
        ar: قارب
        en: boat
    words: [terapung, tradisi, berkumpul, menukar, perahu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «pasar terapung» معناها إيه؟
      ar: ما معنى «pasar terapung»؟
      en: What does "pasar terapung" mean?
    options:
      - سوق السمك.
      - السوق العايم.
      - سوق بالليل.
    answer: 1
    words: [terapung]
  - id: e03
    type: fill_blank
    sentence: Para pedagang ___ di sungai sebelum matahari terbit.
    meaning:
      ar_eg: التجار بيتجمعوا في النهر قبل الشمس ما تطلع.
      ar: يجتمع التجّار في النهر قبل طلوع الشمس.
      en: The traders gather on the river before sunrise.
    options: [berkumpul, menukar, terapung]
    answers: [berkumpul]
    words: [berkumpul]
  - id: e04
    type: listen
    text: Dulu orang menukar sayur dengan ikan, tanpa uang.
    question:
      ar_eg: زمان الناس كانوا بيشتروا إزاي؟
      ar: كيف كان الناس يتبادلون قديمًا؟
      en: How did people trade in the past?
    options:
      - بالفلوس بس.
      - بالكارت.
      - بيبدّلوا خضار بسمك، من غير فلوس.
    answer: 2
    words: [menukar]
  - id: e05
    type: build_sentence
    source:
      ar_eg: العادة دي موجودة من مئات السنين.
      ar: هذا التقليد قائم منذ مئات السنين.
      en: This tradition has existed for hundreds of years.
    answer: Tradisi ini sudah ada sejak ratusan tahun lalu.
    distractors: [perahu, berkumpul]
    words: [tradisi]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: البياعات بيبيعوا الفاكهة من على مراكب صغيرة.
      ar: تبيع البائعات الفاكهة من قوارب صغيرة.
      en: The women sellers sell fruit from small boats.
    answers:
      - Para pedagang perempuan menjual buah dari perahu kecil.
      - Pedagang perempuan menjual buah dari perahu kecil.
      - Para pedagang wanita menjual buah dari perahu kecil.
      - Para pedagang perempuan menjual buah-buahan dari perahu kecil.
    words: [perahu]
  - id: e07
    type: multiple_choice
    question: "Petani itu ___ beras dengan ikan dari nelayan."
    question_meaning:
      ar_eg: كمّل الجملة. «الفلاح … الرز بسمك من الصياد.»
      ar: أكمل الجملة. «… المزارع الأرزّ بسمك من الصيّاد.»
      en: Complete the sentence. "The farmer … rice for fish from the fisherman."
    options: [menukar, berkumpul, terapung]
    answer: 0
    words: [menukar]
  - id: e08
    type: speaking
    text: Tradisi pasar terapung penting karena menyatukan warga sungai.
    meaning:
      ar_eg: عادة السوق العايم مهمة عشان بتجمع أهل النهر.
      ar: تقليد السوق العائم مهمّ لأنّه يجمع أهل النهر.
      en: The floating market tradition matters because it brings river people together.
    words: [terapung, tradisi]
  - id: e09
    type: dictation
    text: Pagi-pagi, perahu kecil berkumpul di tengah sungai.
    meaning:
      ar_eg: الصبح بدري، المراكب الصغيرة بتتجمع في نص النهر.
      ar: في الصباح الباكر تجتمع القوارب الصغيرة وسط النهر.
      en: Early in the morning, small boats gather in the middle of the river.
    words: [perahu, berkumpul]
dialogue:
  title: Di Lok Baintan, jam lima pagi
  lines:
    - speaker: Mohamed
      text: Masya Allah, perahunya banyak banget! Penjualnya ibu-ibu semua?
      ar_eg: ما شاء الله، مراكب كتير قوي! كل البياعين ستات؟
      ar: ما شاء الله، ما أكثر القوارب! أكلّ البائعين نساء؟
      en: Masha'Allah, so many boats! Are all the sellers women?
    - speaker: Mas Rizal
      text: Kebanyakan, iya. Tradisi ini udah ada dari zaman Kesultanan Banjar.
      ar_eg: أغلبهم أيوه. العادة دي موجودة من أيام سلطنة بانجار.
      ar: معظمهنّ نعم، وهذا التقليد قائم منذ عهد سلطنة بانجار.
      en: Mostly, yes. This tradition dates back to the Banjar Sultanate.
    - speaker: Mohamed
      text: Orang masih tukeran barang nggak?
      ar_eg: لسه الناس بتبدّل حاجات ببعض؟
      ar: هل ما زال الناس يتقايضون؟
      en: Do people still barter?
    - speaker: Mas Rizal
      text: Kadang-kadang. Kebanyakan pake uang, tapi semangat kumpulnya tetep sama.
      ar_eg: ساعات. أغلبهم بالفلوس، بس روح التجمّع لسه زي ما هي.
      ar: أحيانًا. يستعمل أكثرهم المال، لكنّ روح الاجتماع باقية.
      en: Sometimes. Most use money, but the spirit of gathering is the same.
