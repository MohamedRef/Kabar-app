schema: kabar.lesson/v1
id: bipa5.u07.l03
language: id
title: Pasar terapung
can_do:
  ar_eg: توصف عادة أو تقليد بالترتيب، إمتى وفين وإزاي وليه.
  ar: أن تصف عادة أو تقليدًا بترتيب، متى وأين وكيف ولماذا.
  en: Describe a tradition in order, when, where, how and why.
slides:
  - title: Menggambarkan tradisi
    body:
      ar_eg: |
        عشان توصف عادة:
        - Tradisi ini sudah ada sejak … = العادة دي موجودة من …
        - Biasanya, … = عادةً …
        - Pertama … kemudian … akhirnya … = الأول … بعدين … في الآخر …
        - Tradisi ini penting karena … = العادة دي مهمة عشان …
        السوق العايم في لوك بايتان بيبدأ قبل الفجر، والبياعات بيقعدوا في مراكب صغيرة اسمها jukung.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: banget = sekali، udah = sudah، tukeran = bertukar، nggak = tidak، pake = pakai، kumpul = berkumpul، tetep = tetap.
      ar: |
        لتصف عادة:
        - Tradisi ini sudah ada sejak … = هذه العادة قائمة منذ …
        - Biasanya, … = في العادة …
        - Pertama … kemudian … akhirnya … = أوّلًا … ثم … وأخيرًا …
        - Tradisi ini penting karena … = هذه العادة مهمّة لأنّ …
        وسوق لوك بايتان العائم يبدأ قبل الفجر، والبائعات في قوارب صغيرة تسمّى jukung.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: banget = sekali، udah = sudah، tukeran = bertukar، nggak = tidak، pake = pakai، kumpul = berkumpul، tetep = tetap.
      en: |
        To describe a tradition:
        - Tradisi ini sudah ada sejak … = This tradition dates back to …
        - Biasanya, … = Usually, …
        - Pertama … kemudian … akhirnya … = First … then … finally …
        - Tradisi ini penting karena … = This tradition matters because …
        The Lok Baintan floating market starts before dawn; the sellers sit in small boats called jukung.
        The dialogue uses street forms; the formal ones are beside them: banget = sekali, udah = sudah, tukeran = bertukar, nggak = tidak, pake = pakai, kumpul = berkumpul, tetep = tetap.
    examples:
      - text: Biasanya, para pedagang sudah berkumpul sebelum subuh.
        ar_eg: عادةً، التجار بيتجمعوا قبل الفجر.
        ar: في العادة يجتمع التجّار قبل الفجر.
        en: Usually, the traders have gathered before dawn prayer.
