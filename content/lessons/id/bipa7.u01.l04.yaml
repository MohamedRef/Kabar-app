schema: kabar.lesson/v1
id: bipa7.u01.l04
language: id
title: PON di Papua
can_do:
  ar_eg: تفهم وتحكي خبر رياضي عن الدورة الوطنية اللي اتعملت في بابوا.
  ar: أن تفهم خبرًا رياضيًّا عن الألعاب الوطنية التي أُقيمت في بابوا وترويه.
  en: Follow and retell a sports story about the national games held in Papua.
slides:
  - title: Pesta olahraga di Tanah Papua
    body:
      ar_eg: |
        الـ PON (Pekan Olahraga Nasional) هي الألعاب الوطنية: كل المحافظات بتتنافس فيها.
        - PON XX اتعملت في بابوا في أكتوبر ٢٠٢١، وكانت أول مرة بابوا تبقى tuan rumah.
        - tuan rumah = البلد المضيفة (حرفيًا: صاحب البيت)
        - atlet = رياضي / لاعب
        - cabang olahraga = نوع رياضة (زي السباحة أو الملاكمة)، واختصارها cabor
        الاتأجّلت سنة بسبب كورونا، واتوزعت على جايابورا وميميكا وميراوكي.
        - في الكلام: pengen = ingin، liput = meliput، iya = ya.
      ar: |
        الـ PON (Pekan Olahraga Nasional) هي الألعاب الوطنية التي تتنافس فيها المحافظات كلّها.
        - أُقيمت PON XX في بابوا في أكتوبر ٢٠٢١، وكانت أوّل مرّة تكون فيها بابوا tuan rumah.
        - tuan rumah = الجهة المضيفة (حرفيًّا: صاحب البيت)
        - atlet = رياضيّ
        - cabang olahraga = نوع من الرياضة (كالسباحة والملاكمة)، واختصاره cabor
        وقد أُجّلت سنة بسبب كورونا، وتوزّعت على جايابورا وميميكا وميراوكي.
        - في الكلام اليومي: pengen = ingin، liput = meliput، iya = ya.
      en: |
        PON (Pekan Olahraga Nasional) is the national games, where every province competes.
        - PON XX was held in Papua in October 2021, the first time Papua was tuan rumah.
        - tuan rumah = host (literally, master of the house)
        - atlet = athlete
        - cabang olahraga = a sport (swimming, boxing…), shortened to cabor
        It was postponed a year by COVID and spread across Jayapura, Mimika and Merauke.
        - In speech: pengen = ingin, liput = meliput, iya = ya.
    examples:
      - text: Ribuan atlet dari seluruh provinsi bertanding di PON XX Papua.
        ar_eg: آلاف الرياضيين من كل المحافظات اتنافسوا في دورة PON العشرين في بابوا.
        ar: تنافس آلاف الرياضيين من المحافظات كلّها في PON العشرين في بابوا.
        en: Thousands of athletes from every province competed at PON XX in Papua.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: PON
        ar_eg: الألعاب الوطنية
        ar: الألعاب الوطنية
        en: national games
      - text: atlet
        ar_eg: رياضي
        ar: رياضيّ
        en: athlete
      - text: tuan rumah
        ar_eg: المضيف
        ar: المضيف
        en: host
      - text: cabang olahraga
        ar_eg: نوع رياضة
        ar: نوع رياضة
        en: sport (event)
      - text: medali
        ar_eg: ميدالية
        ar: ميدالية
        en: medal
    words: [PON, atlet, tuan rumah, cabang olahraga, medali]
  - id: e02
    type: listen
    text: Untuk pertama kalinya, Papua menjadi tuan rumah PON pada tahun 2021.
    question:
      ar_eg: إيه الجديد سنة ٢٠٢١؟
      ar: ما الجديد في سنة ٢٠٢١؟
      en: What was new in 2021?
    options:
      - بابوا كسبت كل الميداليات.
      - أول مرة بابوا تستضيف الـ PON.
      - الـ PON اتلغت.
    answer: 1
    words: [tuan rumah, PON]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «cabor» اختصار لإيه؟
      ar: ما الذي تختصره «cabor»؟
      en: What is "cabor" short for?
    options: [cabai bor, cabang korban, cabang olahraga]
    answer: 2
    words: [cabang olahraga]
    explain:
      ar_eg: cabor اختصار cabang olahraga = نوع/فرع رياضة. الاختيارين التانيين كلام مالوش معنى هنا.
      ar: cabor اختصار cabang olahraga = فرع رياضي. والخياران الآخران لا معنى لهما هنا.
      en: cabor is short for cabang olahraga (a sport). The other two make no sense here.
  - id: e04
    type: fill_blank
    sentence: ___ muda dari Merauke itu meraih medali emas renang.
    meaning:
      ar_eg: الرياضي الشاب اللي من ميراوكي كسب دهبية السباحة.
      ar: فاز الرياضي الشابّ من ميراوكي بذهبية السباحة.
      en: The young athlete from Merauke won gold in swimming.
    options: [Atlet, Tuan rumah, Cabang]
    answers: [Atlet]
    words: [atlet, meraih]
    explain:
      ar_eg: Atlet = رياضي، وهو اللي ياخد ميدالية. tuan rumah = البلد المضيفة، وcabang = فرع.
      ar: Atlet = رياضي، وهو من ينال الميدالية. أما tuan rumah فالمضيف وcabang الفرع.
      en: An atlet (athlete) wins medals. tuan rumah is the host, cabang a branch.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «tuan rumah» حرفيًا يعني إيه؟
      ar: ما المعنى الحرفيّ لـ «tuan rumah»؟
      en: What does "tuan rumah" literally mean?
    options:
      - صاحب البيت.
      - ضيف البيت.
      - باب البيت.
    answer: 0
    explain:
      ar_eg: tuan = سيد / صاحب، rumah = بيت. اللي بيستقبل الضيوف.
      ar: tuan = سيّد، rumah = بيت؛ أي من يستقبل الضيوف.
      en: tuan = master, rumah = house; the one who receives guests.
    words: [tuan rumah]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الرياضيين اتنافسوا في سبعة وتلاتين نوع رياضة.
      ar: تنافس الرياضيون في سبعة وثلاثين نوعًا من الرياضة.
      en: The athletes competed in thirty-seven sports.
    answer: Para atlet bertanding dalam tiga puluh tujuh cabang olahraga.
    distractors: [tuan, rumah]
    words: [atlet, cabang olahraga]
    explain:
      ar_eg: cabang olahraga = نوع رياضة، والرياضيين bertanding (يتنافسوا) فيها. tuan rumah = المضيف، ومش مكانها هنا.
      ar: cabang olahraga = فرع رياضي يتنافس فيه الرياضيون. أما tuan rumah فالمضيف، ولا موضع له.
      en: Athletes compete in cabang olahraga (sports). tuan rumah means host and doesn't fit.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مين هيستضيف الـ PON الجاية؟
      ar: من سيستضيف PON القادمة؟
      en: Who will host the next PON?
    answers:
      - Siapa tuan rumah PON berikutnya?
      - Siapa yang akan menjadi tuan rumah PON berikutnya?
      - Siapa tuan rumah PON yang berikutnya?
      - Siapa yang menjadi tuan rumah PON berikutnya?
    words: [tuan rumah, PON]
  - id: e08
    type: speaking
    text: Atlet Papua bertanding di depan keluarga mereka sendiri.
    meaning:
      ar_eg: رياضيين بابوا اتنافسوا قدام عيلاتهم.
      ar: تنافس رياضيّو بابوا أمام عائلاتهم.
      en: Papua's athletes competed in front of their own families.
    words: [atlet]
  - id: e09
    type: dictation
    text: PON XX diadakan di Jayapura, Mimika, dan Merauke.
    meaning:
      ar_eg: دورة PON العشرين اتعملت في جايابورا وميميكا وميراوكي.
      ar: أُقيمت PON العشرون في جايابورا وميميكا وميراوكي.
      en: PON XX was held in Jayapura, Mimika and Merauke.
    words: [PON]
  - id: e10
    type: fill_blank
    sentence: Dayung adalah ___ yang populer di daerah pesisir.
    meaning:
      ar_eg: التجديف رياضة مشهورة في المناطق الساحلية.
      ar: التجديف رياضة شائعة في المناطق الساحلية.
      en: Rowing is a popular sport in coastal areas.
    options: [cabang olahraga, tuan rumah, atlet]
    answers: [cabang olahraga]
    words: [cabang olahraga]
    explain:
      ar_eg: التجديف (dayung) نوع رياضة = cabang olahraga. tuan rumah مضيف، وatlet شخص مش رياضة.
      ar: التجديف (dayung) فرع رياضي = cabang olahraga. أما tuan rumah فمضيف، وatlet شخص لا رياضة.
      en: Rowing (dayung) is a cabang olahraga. tuan rumah is a host, atlet a person.
dialogue:
  title: Liputan dari stadion
  lines:
    - speaker: Kaka Yohana
      text: Mohamed, hari ini kita liput final tinju di PON. Siap?
      ar_eg: يا محمد، النهارده هنغطّي نهائي الملاكمة في الـ PON. جاهز؟
      ar: يا محمد، سنغطّي اليوم نهائي الملاكمة في PON. أأنت مستعدّ؟
      en: Mohamed, today we're covering the boxing final at PON. Ready?
    - speaker: Mohamed
      text: Siap, Kaka. Ada atlet dari Papua juga, kan?
      ar_eg: جاهز يا كاكا. فيه رياضي من بابوا كمان، صح؟
      ar: جاهز يا كاكا. هناك رياضي من بابوا أيضًا، صحيح؟
      en: Ready, Kaka. There's a Papuan athlete too, right?
    - speaker: Kaka Yohana
      text: Iya. Sebagai tuan rumah, Papua pengen juara di cabang olahraga ini.
      ar_eg: أيوه. وبما إن بابوا هي المضيفة، عايزة تكسب في الرياضة دي.
      ar: نعم، وبصفتها المضيفة تريد بابوا الفوز في هذه الرياضة.
      en: Yes. As host, Papua wants to win in this sport.
    - speaker: Mohamed
      text: Kalau dia menang, judul berita kita "Atlet Tuan Rumah Raih Emas"!
      ar_eg: لو كسب، عنوان خبرنا هيبقى «رياضي المضيف يحصد الدهب»!
      ar: 'إن فاز فعنوان خبرنا: «رياضيّ المضيف يحصد الذهب»!'
      en: If he wins, our headline is "Host Athlete Takes Gold"!
