schema: kabar.lesson/v1
id: bipa7.u07.l11
language: id
title: Artikel opini
can_do:
  ar_eg: تكتب مقال رأي قصير للشباب يقنعهم يروحوا يصوّتوا.
  ar: أن تكتب مقال رأي قصيرًا يقنع الشباب بالتصويت.
  en: Write a short op-ed persuading young people to vote.
slides:
  - title: Untuk pembaca muda
    grammar: id.register.audience
    body:
      ar_eg: |
        مقال رأي متألّف للدرس، القارئ المستهدف شباب:
        «Jangan golput! Menurut hemat saya, suara anak muda menentukan masa depan. Partisipasi kita bukan hanya hak, tetapi juga tanggung jawab.»
        - artikel opini = مقال رأي، اسم الكاتب عليه وهو المسؤول عن رأيه.
        - golput (golongan putih) = اللي بيقاطع الانتخابات ومابيصوّتش.
        - menurut hemat saya = في تقديري المتواضع، أسلوب مهذّب لتقديم الرأي.
        - partisipasi = مشاركة.
        للشباب، خلّي الجمل قصيرة وlugas، وابدأ بسؤال أو نداء.
      ar: |
        مقال رأي مؤلَّف للدرس، قارئه المستهدف من الشباب:
        «Jangan golput! Menurut hemat saya, suara anak muda menentukan masa depan. Partisipasi kita bukan hanya hak, tetapi juga tanggung jawab.»
        - artikel opini = مقال رأي يحمل اسم كاتبه، وهو المسؤول عن رأيه.
        - golput (golongan putih) = من يقاطع الانتخابات ولا يصوّت.
        - menurut hemat saya = في تقديري المتواضع، صيغة مهذّبة لعرض الرأي.
        - partisipasi = مشاركة.
        وللشباب اجعل الجمل قصيرة lugas، وابدأ بسؤال أو نداء.
      en: |
        An op-ed invented for the lesson, aimed at young readers:
        «Jangan golput! Menurut hemat saya, suara anak muda menentukan masa depan. Partisipasi kita bukan hanya hak, tetapi juga tanggung jawab.»
        - artikel opini = an op-ed, signed by its writer, who owns the view.
        - golput (golongan putih) = someone who abstains and doesn't vote.
        - menurut hemat saya = in my humble view, a courteous way to give an opinion.
        - partisipasi = participation.
        For young readers keep sentences short and lugas, and open with a question or a call.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: artikel opini
        ar_eg: مقال رأي
        ar: مقال رأي
        en: op-ed
      - text: golput
        ar_eg: مقاطعة التصويت
        ar: الامتناع عن التصويت
        en: abstaining (not voting)
      - text: menurut hemat saya
        ar_eg: في تقديري المتواضع
        ar: في تقديري المتواضع
        en: in my humble view
      - text: partisipasi
        ar_eg: مشاركة
        ar: مشاركة
        en: participation
    words: [artikel opini, golput, menurut hemat saya, partisipasi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي بداية مناسبة لمقال رأي للشباب؟
      ar: أيّ افتتاحية تناسب مقال رأي للشباب؟
      en: Which opening suits an op-ed for young readers?
    options:
      - Berdasarkan Pasal 1 ayat 2, kedaulatan berada di tangan rakyat.
      - Pernah merasa suaramu tidak didengar? Pemilu adalah jawabannya.
      - Dengan segala hormat, kami sampaikan laporan tahunan.
    answer: 1
    words: [artikel opini]
  - id: e03
    type: fill_blank
    sentence: ___, anak muda harus ikut memilih.
    meaning:
      ar_eg: في تقديري المتواضع، الشباب لازم يشاركوا في التصويت.
      ar: في تقديري المتواضع، على الشباب أن يشاركوا في التصويت.
      en: In my humble view, young people should take part in voting.
    options: [Menurut hemat saya, Golput, Partisipasi]
    answers: [Menurut hemat saya]
    words: [menurut hemat saya]
  - id: e04
    type: listen
    text: Angka golput di kalangan anak muda masih cukup tinggi.
    question:
      ar_eg: إيه اللي لسّه عالي عند الشباب؟
      ar: ما الذي ما زال مرتفعًا بين الشباب؟
      en: What is still fairly high among young people?
    options:
      - نسبة اللي مابيصوّتوش.
      - أسعار التليفونات.
      - عدد المذيعين.
    answer: 0
    words: [golput]
  - id: e05
    type: build_sentence
    source:
      ar_eg: مشاركة الشباب بتقوّي الديمقراطية.
      ar: مشاركة الشباب تقوّي الديمقراطية.
      en: Youth participation strengthens democracy.
    answer: Partisipasi anak muda memperkuat demokrasi.
    distractors: [golput, opini]
    words: [partisipasi]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: مقال الرأي بيختلف عن الخبر في إيه؟
      ar: بمَ يختلف مقال الرأي عن الخبر؟
      en: How is an op-ed different from a news report?
    options:
      - مالوش كاتب.
      - لازم يكون للأطفال بس.
      - فيه رأي الكاتب، واسمه عليه.
    answer: 2
    words: [artikel opini]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ماتقاطعش الانتخابات، صوتك مهمّ.
      ar: لا تمتنع عن التصويت، فصوتك مهمّ.
      en: Don't abstain, your vote matters.
    answers:
      - Jangan golput, suaramu penting.
      - Jangan golput, suara kamu penting.
      - Jangan golput karena suaramu penting.
      - Jangan golput. Suaramu penting.
    words: [golput]
  - id: e08
    type: speaking
    text: Menurut hemat saya, partisipasi anak muda menentukan masa depan bangsa.
    meaning:
      ar_eg: في تقديري، مشاركة الشباب بتحدّد مستقبل البلد.
      ar: في تقديري، مشاركة الشباب تحدّد مستقبل الأمّة.
      en: In my humble view, young people's participation shapes the nation's future.
    words: [menurut hemat saya, partisipasi]
  - id: e09
    type: dictation
    text: Artikel opini ini ditulis untuk mahasiswa.
    meaning:
      ar_eg: مقال الرأي ده متكتب لطلبة الجامعة.
      ar: كُتب مقال الرأي هذا لطلّاب الجامعة.
      en: This op-ed is written for university students.
    words: [artikel opini]
  - id: e10
    type: translate
    direction: from_target
    source_text: Partisipasi yang tinggi membuat angka golput turun.
    answers_meaning:
      ar_eg:
        - المشاركة العالية بتخلّي نسبة المقاطعة تقلّ.
        - لما المشاركة تبقى عالية، عدد اللي مابيصوّتوش بيقلّ.
      ar:
        - المشاركة المرتفعة تُخفض نسبة الممتنعين عن التصويت.
        - كلّما ارتفعت المشاركة قلّ الممتنعون عن التصويت.
      en:
        - High participation brings the abstention rate down.
        - When turnout is high, fewer people abstain.
    words: [partisipasi, golput]
dialogue:
  title: Naskah untuk kolom anak muda
  lines:
    - speaker: Bu Debora
      text: Artikel opinimu untuk kolom anak muda sudah selesai?
      ar_eg: مقال الرأي بتاعك لعمود الشباب خلص؟
      ar: هل أنهيت مقال رأيك لعمود الشباب؟
      en: Is your op-ed for the youth column finished?
    - speaker: Mohamed
      text: Hampir. Judulnya "Jangan Golput, Suaramu Berharga".
      ar_eg: قرّب. عنوانه «ماتقاطعش، صوتك غالي».
      ar: أوشك. عنوانه «لا تمتنع، فصوتك ثمين».
      en: Almost. The title is "Don't Abstain, Your Vote Counts".
    - speaker: Bu Debora
      text: Bagus. Tapi kalimat pertamamu terlalu panjang untuk pembaca muda.
      ar_eg: حلو. بس أول جملة طويلة قوي على القرّاء الشباب.
      ar: جيّد، لكنّ جملتك الأولى طويلة جدًّا على القرّاء الشباب.
      en: Good. But your first sentence is too long for young readers.
    - speaker: Mohamed
      text: Saya ganti dengan pertanyaan, lalu "menurut hemat saya" di paragraf kedua.
      ar_eg: هبدّلها بسؤال، وبعدين «في تقديري» في الفقرة التانية.
      ar: سأستبدلها بسؤال، ثمّ «في تقديري» في الفقرة الثانية.
      en: I'll swap it for a question, then "in my humble view" in the second paragraph.
