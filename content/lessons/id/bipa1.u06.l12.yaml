  - id: e03
    type: listen
    text: Dengar, ya! Besok ada tes.
    question:
      ar_eg: بكرة فيه إيه؟
      ar: ماذا هناك غدًا؟
      en: What's on tomorrow?
    options: [اختبار قصير, حفلة, إجازة]
    answer: 0
    meaning:
      ar_eg: اسمعوا! بكرة فيه اختبار.
      ar: أنصتوا! غدًا اختبار.
      en: Listen! There's a quiz tomorrow.
    words: [dengar, tes]
  - id: e04
    type: fill_blank
    sentence: Pak guru menulis di ___.
    meaning:
      ar_eg: الأستاذ بيكتب على ___.
      ar: يكتب الأستاذ على ___.
      en: The teacher writes on the ___.
    options: [papan tulis, pensil, arti]
    answers: [papan tulis]
    words: [papan tulis, pensil, arti]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تكتب حاجة وتقدر تمسحها بالأستيكة. تستخدم…؟
      ar: تريد أن تكتب شيئًا يمكن محوه بالممحاة. ماذا تستعمل؟
      en: You want to write something you can rub out. What do you use?
    options: [pensil, pulpen, papan tulis]
    answer: 0
    explain:
      ar_eg: pensil بيتمسح بالأستيكة، pulpen لأ.
      ar: يُمحى الـ pensil بالممحاة، أما الـ pulpen فلا.
      en: A pensil rubs out; a pulpen doesn't.
    words: [pensil, pulpen, papan tulis]
  - id: e06
    type: fill_blank
    sentence: Apa ___ «kamus»? — Kamus = قاموس.
    meaning:
      ar_eg: إيه ___ «kamus»؟ — kamus = قاموس.
      ar: ما ___ «kamus»؟ — kamus = قاموس.
      en: What's the ___ of "kamus"? — kamus = dictionary.
    options: [arti, tes, pulpen]
    answers: [arti]
    words: [arti, tes, pulpen]
  - id: e07
    type: build_sentence
    source:
      ar_eg: عندك قلم جاف؟
      ar: هل عندك قلم حبر؟
      en: Do you have a pen?
    answer: Kamu punya pulpen?
    distractors: [tes, arti]
    words: [pulpen]
  - id: e08
    type: translate
    direction: from_target
    source_text: Untuk tes, kita memakai pensil.
    answers_meaning:
      ar_eg: [في الاختبار بنستخدم قلم رصاص, للاختبار بنكتب بالقلم الرصاص]
      ar: [في الاختبار نستعمل قلم رصاص, نكتب الاختبار بقلم رصاص]
      en: ['For the quiz, we use a pencil', We use a pencil for the test]
    words: [tes, pensil]
  - id: e09
    type: speaking
    text: Dengar, ya! Apa artinya?
    meaning:
      ar_eg: اسمعوا! معناها إيه؟
      ar: أنصتوا! ما معناه؟
      en: Listen! What does it mean?
    words: [dengar, arti]
  - id: e10
    type: multiple_choice
    question: 'Bu guru: «___, ya! Saya mau membaca.»'
    options: [Dengar, Papan tulis, Pensil]
    answer: 0
    explain:
      ar_eg: 'المدرسة عايزاهم يسمعوا: Dengar!'
      ar: 'تريد المعلّمة أن ينصتوا: Dengar!'
      en: 'The teacher wants them to listen: Dengar!'
    words: [dengar, papan tulis]
dialogue:
  lines:
    - speaker: Bu Yanti
      text: Selamat pagi! Dengar, ya. Hari ini ada tes.
      ar_eg: صباح الخير! اسمعوا. النهارده فيه اختبار.
      ar: صباح الخير! أنصتوا، اليوم اختبار.
      en: Good morning! Listen up. There's a quiz today.
    - speaker: Mohamed
      text: Tes, Bu? Boleh memakai kamus?
      ar_eg: اختبار يا أستاذة؟ ينفع نستخدم القاموس؟
      ar: اختبار يا أستاذة؟ هل نستعمل القاموس؟
      en: A quiz? Can we use a dictionary?
    - speaker: Bu Yanti
      text: Tidak boleh. Kalian memakai pensil, ya.
      ar_eg: لأ، ممنوع. واكتبوا بالقلم الرصاص.
      ar: لا، ممنوع. واكتبوا بقلم الرصاص.
      en: No. And use a pencil, please.
    - speaker: Rina
      text: Bu, apa artinya ini, di papan tulis?
      ar_eg: يا أستاذة، معنى دي إيه، اللي على السبورة؟
      ar: يا أستاذة، ما معنى هذا على السبّورة؟
      en: Miss, what does this on the whiteboard mean?
    - speaker: Bu Yanti
      text: Artinya «tes». Silakan, sekarang!
      ar_eg: معناها «اختبار». يلّا، اتفضلوا دلوقتي!
      ar: معناه «اختبار». تفضّلوا، ابدؤوا الآن!
      en: It means "quiz". Go ahead, now!
