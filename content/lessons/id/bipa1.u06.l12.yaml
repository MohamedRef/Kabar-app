schema: kabar.lesson/v1
id: bipa1.u06.l12
language: id
title: Pensil dan pulpen
can_do:
  ar_eg: تتكلم عن أدوات الفصل والاختبار، وتسأل عن معنى حاجة.
  ar: أن تتحدث عن أدوات الصفّ والاختبار، وتسأل عن معنى شيء.
  en: Talk about classroom things and quizzes, and ask what something means.
slides:
  - title: Di kelas
    body:
      ar_eg: |
        pensil = قلم رصاص، pulpen = قلم جاف، papan tulis = سبورة (papan = لوح).
        tes = اختبار قصير (أصغر من ujian).
        arti = معنى. إنت عارف «Apa artinya?»: معناها إيه؟
        dengar = اسمع. المدرس بيقول: «Dengar, ya!» = اسمعوا كويس! (وفي الكتابة mendengar، اللي اتعلمتها.)
      ar: |
        pensil = قلم رصاص، pulpen = قلم حبر جاف، papan tulis = سبّورة (papan = لوح).
        tes = اختبار قصير (أصغر من ujian).
        arti = معنى، وأنت تعرف «Apa artinya?»: ما معناه؟
        dengar = اسمع. يقول المعلّم: «Dengar, ya!» = أنصتوا! (والفعل الكامل mendengar الذي تعلّمته.)
      en: |
        pensil = pencil, pulpen = pen, papan tulis = whiteboard (papan = board).
        tes = a quiz, smaller than ujian.
        arti = meaning; you know "Apa artinya?": what does it mean?
        dengar = listen. Teachers say "Dengar, ya!" = Listen up! (The full verb is mendengar, which you've learnt.)
    examples:
      - text: Pak guru menulis di papan tulis.
        ar_eg: الأستاذ بيكتب على السبورة.
        ar: يكتب الأستاذ على السبّورة.
        en: The teacher is writing on the whiteboard.
      - text: Untuk tes, kita memakai pensil.
        ar_eg: في الاختبار بنستخدم قلم رصاص.
        ar: في الاختبار نستعمل قلم رصاص.
        en: For the quiz, we use a pencil.
      - text: Dengar, ya! Apa artinya?
        ar_eg: اسمعوا! معناها إيه؟
        ar: أنصتوا! ما معناه؟
        en: Listen! What does it mean?
