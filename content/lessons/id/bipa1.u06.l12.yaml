schema: kabar.lesson/v1
id: bipa1.u06.l12
language: id
title: Satu hari di Jakarta
can_do:
  ar_eg: تحكي يومك في ٦ جمل.
  ar: أن تروي يومك في ست جمل.
  en: Narrate your day in 6 sentences.
slides:
  - title: Cerita satu hari
    body:
      ar_eg: |
        عشان تحكي يومك محتاج ٣ حاجات بس:
        - وقت: jam lima، tadi pagi، nanti malam.
        - ترتيب: lalu (وبعدين)، sesudah itu / setelah itu (بعد كده)، sebelum (قبل).
        - حالة الفعل: sudah، belum، sedang، akan.
        والفعل نفسه مابيتغيرش أبدًا. سهلة!
        كلمات التكرار بتخلي الحكاية حقيقية: Biasanya saya…، Kadang-kadang saya…، Setiap malam saya…
        ركز إنها قبل الفعل (biasanya بس ممكن تيجي في الأول).
      ar: |
        لتروي يومك تحتاج ثلاثة أشياء:
        - الوقت: jam lima، tadi pagi، nanti malam.
        - الترتيب: lalu (ثم)، sesudah itu / setelah itu (بعد ذلك)، sebelum (قبل).
        - حال الفعل: sudah، belum، sedang، akan.
        والفعل نفسه لا يتغير أبدًا.
        ظروف التكرار تجعل الحكاية واقعية: Biasanya saya…، Kadang-kadang saya…، Setiap malam saya…
        وموضعها قبل الفعل (ويجوز تصدير biasanya).
      en: |
        To tell your day you need just three things:
        - Time: jam lima, tadi pagi, nanti malam.
        - Order: lalu (then), sesudah itu / setelah itu (after that), sebelum (before).
        - Aspect: sudah, belum, sedang, akan.
        The verb itself never changes. Easy!
        Frequency words make your story real: Biasanya saya…, Kadang-kadang saya…, Setiap malam saya…
        Keep them before the verb (biasanya may also come first).
    grammar: id.time.sequence
    examples:
      - text: Saya bangun jam lima, lalu salat subuh.
        ar_eg: بصحى الساعة خمسة، وبعدين بصلي الفجر.
        ar: أستيقظ في الخامسة ثم أصلي الفجر.
        en: I wake up at five, then I pray the dawn prayer.
      - text: Sesudah itu, saya sarapan.
        ar_eg: بعد كده بفطر.
        ar: بعد ذلك أتناول الفطور.
        en: After that, I have breakfast.
      - text: Setiap malam saya belajar bahasa Indonesia.
        ar_eg: كل ليلة بذاكر إندونيسي.
        ar: أدرس الإندونيسية كل ليلة.
        en: Every night I study Indonesian.
exercises:
  - id: e01
    type: multiple_choice
    question: Sesudah mandi, saya sarapan.
    question_meaning:
      ar_eg: إيه اللي حصل الأول؟
      ar: ماذا حدث أولًا؟
      en: What happened first?
    options: [mandi, sarapan]
    answer: 0
    explain:
      ar_eg: sesudah mandi = بعد الاستحمام، يعني الاستحمام الأول.
      ar: sesudah mandi = بعد الاستحمام، فالاستحمام أولًا.
      en: sesudah mandi = after showering, so the shower came first.
    words: [sesudah, mandi, sarapan]
  - id: e02
    type: listen
    text: Sesudah itu, saya makan nasi uduk.
    options: ['Sesudah itu, saya makan nasi uduk.', 'Sesudah itu, saya makan siang.', 'Sebelum itu, saya makan nasi uduk.']
    answer: 0
    meaning:
      ar_eg: بعد كده بكل نَسي أودوك.
      ar: بعد ذلك آكل «نَسي أودوك».
      en: After that, I eat nasi uduk.
    words: [sesudah itu, nasi uduk, makan siang]
  - id: e03
    type: fill_blank
    sentence: Saya rajin. Saya bekerja ___ jam lima sore.
    meaning:
      ar_eg: أنا مجتهد. بشتغل لحد الساعة خمسة العصر.
      ar: أنا مجتهد. أعمل حتى الخامسة عصرًا.
      en: I'm hard-working. I work until five p.m.
    options: [sampai, rajin, sesudah]
    answers: [sampai]
    words: [rajin, sampai]
  - id: e04
    type: fill_blank
    sentence: Saya ___ makan siang.
    meaning:
      ar_eg: لسه ماتغديتش.
      ar: لم أتناول الغداء بعد.
      en: I haven't had lunch yet.
    answers: [belum]
    explain:
      ar_eg: «لسه ماحصلش» = belum.
      ar: «لم … بعد» = belum.
      en: '"Not yet" = belum.'
    words: [belum, makan siang]
  - id: e05
    type: build_sentence
    source:
      ar_eg: راكا بيشتغل بجد لحد العصر.
      ar: يعمل راكا بجد حتى العصر.
      en: Raka works hard until the afternoon.
    answer: Raka rajin bekerja sampai sore.
    distractors: [sebelum, nasi]
    words: [rajin, sampai]
  - id: e06
    type: build_sentence
    source:
      ar_eg: وبعدين برُوح المكتب الساعة سبعة.
      ar: ثم أذهب إلى المكتب في السابعة.
      en: Then I go to the office at seven.
    answer: Lalu saya pergi ke kantor jam tujuh.
    alternatives: [Lalu jam tujuh saya pergi ke kantor.]
    distractors: [sebelum, pulang]
    words: [lalu, pergi, kantor]
  - id: e07
    type: match_pairs
    pairs:
      - text: sesudah itu
        ar_eg: بعد كده
        ar: بعد ذلك
        en: after that
      - text: rajin
        ar_eg: مجتهد
        ar: مجتهد
        en: diligent, hard-working
      - text: sampai
        ar_eg: لحد
        ar: حتى
        en: until
      - text: makan siang
        ar_eg: غدا
        ar: الغداء
        en: lunch
      - text: nasi uduk
        ar_eg: رز بلبن جوز الهند
        ar: أرز بحليب جوز الهند
        en: coconut rice
      - text: sarapan
        ar_eg: فطار
        ar: الفطور
        en: breakfast
    words: [sesudah itu, rajin, sampai, makan siang, nasi uduk, sarapan]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بعد كده بفطر.
      ar: بعد ذلك أتناول الفطور.
      en: After that, I have breakfast.
    answers: ['Sesudah itu, saya sarapan.', Sesudah itu saya sarapan., 'Setelah itu, saya sarapan.', Setelah itu saya sarapan., Lalu saya sarapan., 'Sesudah itu, aku sarapan.', 'Setelah itu, aku sarapan.']
    words: [sesudah, sarapan]
  - id: e09
    type: dictation
    text: Saya bekerja sampai jam lima sore.
    meaning:
      ar_eg: بشتغل لحد الساعة خمسة العصر.
      ar: أعمل حتى الساعة الخامسة مساءً.
      en: I work until five in the afternoon.
    words: [bekerja, sampai]
  - id: e10
    type: speaking
    text: Sesudah itu, kami makan siang. Saya makan nasi uduk.
    meaning:
      ar_eg: بعد كده اتغدينا. أنا كلت نَسي أودوك.
      ar: بعد ذلك تغدّينا. أكلت «نَسي أودوك».
      en: After that, we had lunch. I had nasi uduk.
    words: [sesudah itu, makan siang, nasi uduk]
dialogue:
  title: Di kelas Pak Irwan
  lines:
    - speaker: Pak Irwan
      text: Mohamed, biasanya kamu bangun jam berapa?
      ar_eg: محمد، عادةً بتصحى الساعة كام؟
      ar: يا محمد، في أيّ ساعة تستيقظ عادةً؟
      en: Mohamed, what time do you usually wake up?
    - speaker: Mohamed
      text: Saya selalu bangun jam lima, Pak. Lalu saya salat subuh.
      ar_eg: دايمًا بصحى الساعة خمسة يا أستاذ. وبعدين بصلي الفجر.
      ar: أستيقظ دائمًا في الخامسة يا أستاذ، ثم أصلي الفجر.
      en: I always wake up at five, sir. Then I pray the dawn prayer.
    - speaker: Pak Irwan
      text: Wah, rajin! Sesudah itu?
      ar_eg: يا سلام، شاطر! وبعد كده؟
      ar: ما شاء الله، مجتهد! وبعد ذلك؟
      en: Wow, so diligent! And after that?
    - speaker: Mohamed
      text: Sesudah mandi, saya sarapan. Biasanya saya makan nasi uduk.
      ar_eg: بعد ما أستحمى بفطر. عادةً باكل ناسي أودوك.
      ar: بعد الاستحمام أتناول الفطور، وعادةً آكل ناسي أودوك.
      en: After showering, I have breakfast. I usually eat nasi uduk.
    - speaker: Pak Irwan
      text: Jam berapa kamu ke kantor?
      ar_eg: بتروح المكتب الساعة كام؟
      ar: متى تذهب إلى المكتب؟
      en: What time do you go to the office?
    - speaker: Mohamed
      text: Jam tujuh. Saya bekerja sampai jam lima sore.
      ar_eg: الساعة سبعة. بشتغل لحد خمسة العصر.
      ar: في السابعة. أعمل حتى الخامسة مساءً.
      en: At seven. I work until five in the afternoon.
