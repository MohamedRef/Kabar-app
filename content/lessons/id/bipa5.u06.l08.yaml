schema: kabar.lesson/v1
id: bipa5.u06.l08
language: id
title: Pena seorang kritikus
can_do:
  ar_eg: 'تكتب نقد لعرض: درامي ولا مأساوي، فيه فكاهة وأناقة وعبقرية، والخيال، وبالحبر.'
  ar: 'أن تكتب نقدًا لعرض: درامي أم مأساوي، وفيه الفكاهة والأناقة والعبقرية، والخيال، وبالحبر.'
  en: 'Write a critique of a show: dramatic or tragic, with humour, elegance and brilliance, fantasy and ink.'
slides:
  - title: Kata-kata ulasan
    body:
      ar_eg: |
        kritik = نقد (kritik seni = نقد فني)، والناقد kritikus.
        dramatis = درامي، مثير، tragis = مأساوي، humor = فكاهة، دم خفيف.
        elegan = أنيق، brilian = عبقري، رائع جدًا.
        fantasi = خيال، فانتازيا (cerita fantasi)، tinta = حبر.
      ar: |
        kritik = نقد (kritik seni = نقد فني)، والناقد kritikus.
        dramatis = درامي، مثير، tragis = مأساوي، humor = فكاهة.
        elegan = أنيق، brilian = بارع، عبقري.
        fantasi = خيال، فانتازيا (cerita fantasi)، tinta = حبر.
      en: |
        kritik = criticism, critique (kritik seni = art criticism); a critic is kritikus.
        dramatis = dramatic, tragis = tragic, humor = humour.
        elegan = elegant, brilian = brilliant.
        fantasi = fantasy (cerita fantasi), tinta = ink.
    examples:
      - text: Akhir ceritanya tragis, tapi ada banyak humor di tengahnya.
        ar_eg: نهاية القصة مأساوية، بس فيه فكاهة كتير في النص.
        ar: نهاية القصة مأساوية، لكن في وسطها كثير من الفكاهة.
        en: The ending is tragic, but there's lots of humour along the way.
      - text: Tarian itu elegan dan musiknya brilian.
        ar_eg: الرقصة دي أنيقة والمزيكا عبقرية.
        ar: تلك الرقصة أنيقة وموسيقاها بارعة.
        en: The dance was elegant and the music brilliant.
      - text: Kritiknya tajam, seperti tinta merah guru.
        ar_eg: نقده حاد، زي حبر المدرس الأحمر.
        ar: نقده لاذع كحبر المعلّم الأحمر.
        en: His critique is sharp, like a teacher's red ink.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kritik
        ar_eg: نقد
        ar: نقد
        en: criticism
      - text: dramatis
        ar_eg: درامي
        ar: درامي
        en: dramatic
      - text: tragis
        ar_eg: مأساوي
        ar: مأساوي
        en: tragic
      - text: humor
        ar_eg: فكاهة
        ar: فكاهة
        en: humour
    words: [kritik, dramatis, tragis, humor]
  - id: e02
    type: match_pairs
    pairs:
      - text: elegan
        ar_eg: أنيق
        ar: أنيق
        en: elegant
      - text: brilian
        ar_eg: عبقري
        ar: بارع
        en: brilliant
      - text: fantasi
        ar_eg: فانتازيا، خيال
        ar: خيال
        en: fantasy
      - text: tinta
        ar_eg: حبر
        ar: حبر
        en: ink
    words: [elegan, brilian, fantasi, tinta]
  - id: e03
    type: listen
    text: Akhir ceritanya tragis sekali.
    question:
      ar_eg: النهاية عاملة إزاي؟
      ar: كيف النهاية؟
      en: What is the ending like?
    options: [مأساوية, مضحكة, مملة]
    answer: 0
    meaning:
      ar_eg: نهاية القصة مأساوية أوي.
      ar: نهاية القصة مأساوية جدًا.
      en: The ending is very tragic.
    words: [tragis]
  - id: e04
    type: fill_blank
    sentence: Penonton tertawa terus. ___-nya segar sekali.
    meaning:
      ar_eg: الجمهور فضل يضحك. الـ ___ بتاعته خفيفة أوي.
      ar: ظلّ الجمهور يضحك. ___ه منعشة جدًا.
      en: The audience kept laughing. The ___ was so fresh.
    options: [Humor, Tinta, Kritik]
    answers: [Humor]
    words: [humor, tinta, kritik]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: قصة فيها تنانين وسحر وعوالم مش حقيقية. نوعها إيه؟
      ar: قصة فيها تنانين وسحر وعوالم غير حقيقية. ما نوعها؟
      en: A story with dragons, magic and unreal worlds. What genre is it?
    options: [fantasi, tragis, elegan]
    answer: 0
    explain:
      ar_eg: fantasi = خيال، فانتازيا.
      ar: fantasi = فانتازيا.
      en: fantasi = fantasy.
    words: [fantasi, tragis, elegan]
  - id: e06
    type: fill_blank
    sentence: Gaun penari itu sederhana tapi ___.
    meaning:
      ar_eg: فستان الراقصة بسيط بس ___.
      ar: فستان الراقصة بسيط لكنه ___.
      en: The dancer's dress was simple but ___.
    options: [elegan, dramatis, fantasi]
    answers: [elegan]
    words: [elegan, dramatis, fantasi]
  - id: e07
    type: multiple_choice
    question: Ide sutradara itu ___! Belum pernah ada yang seperti itu.
    options: [tragis, humor, brilian]
    answer: 2
    explain:
      ar_eg: brilian = عبقري، رائع جدًا.
      ar: brilian = عبقري، بارع.
      en: brilian = brilliant.
    words: [tragis, humor, brilian]
  - id: e08
    type: build_sentence
    source:
      ar_eg: النقد ده كان حاد بس مفيد.
      ar: كان هذا النقد لاذعًا لكنه مفيد.
      en: That critique was sharp but useful.
    answer: Kritik itu tajam tapi berguna.
    distractors: [humor, tinta]
    words: [kritik, tinta]
  - id: e09
    type: translate
    direction: from_target
    source_text: Adegan terakhirnya sangat dramatis.
    answers_meaning:
      ar_eg: [المشهد الأخير كان درامي جدًا, آخر مشهد كان مثير أوي]
      ar: [كان المشهد الأخير دراميًا جدًا, المشهد الأخير مثير للغاية]
      en: [The last scene was very dramatic, The final scene is highly dramatic]
    words: [dramatis]
  - id: e10
    type: speaking
    text: Musiknya brilian dan tariannya elegan.
    meaning:
      ar_eg: المزيكا عبقرية والرقصة أنيقة.
      ar: الموسيقى بارعة والرقصة أنيقة.
      en: The music was brilliant and the dance elegant.
    words: [brilian, elegan]
dialogue:
  lines:
    - speaker: Rina
      text: Bagaimana sandiwara semalam? Kamu harus menulis ulasan, kan?
      ar_eg: المسرحية امبارح كانت عاملة إزاي؟ مش لازم تكتب نقد؟
      ar: كيف كانت مسرحية البارحة؟ عليك أن تكتب مراجعة، أليس كذلك؟
      en: How was last night's play? You have to write a review, right?
    - speaker: Mohamed
      text: Ya. Ceritanya fantasi, tapi akhirnya tragis.
      ar_eg: أيوه. القصة فانتازيا، بس النهاية مأساوية.
      ar: نعم. القصة خيالية لكن نهايتها مأساوية.
      en: Yes. It's a fantasy, but the ending is tragic.
    - speaker: Rina
      text: Ada humornya?
      ar_eg: كان فيها فكاهة؟
      ar: هل فيها فكاهة؟
      en: Was there any humour?
    - speaker: Mohamed
      text: Banyak! Dan tarian enggangnya elegan sekali. Musiknya brilian.
      ar_eg: كتير! ورقصة الإنجانج كانت أنيقة جدًا. والمزيكا عبقرية.
      ar: كثير! ورقصة الإنغانغ أنيقة جدًا، والموسيقى بارعة.
      en: Loads! And the hornbill dance was so elegant. The music was brilliant.
    - speaker: Rina
      text: Jadi kritikmu positif semua?
      ar_eg: يعني نقدك كله إيجابي؟
      ar: إذن نقدك إيجابي كله؟
      en: So your critique is all positive?
    - speaker: Mohamed
      text: Hampir. Adegan perangnya terlalu dramatis dan terlalu panjang.
      ar_eg: تقريبًا. مشهد الحرب كان درامي زيادة وطويل زيادة.
      ar: تقريبًا. كان مشهد الحرب مفرطًا في الدراما وطويلًا جدًا.
      en: Almost. The battle scene was too dramatic and too long.
