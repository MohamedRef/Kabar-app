schema: kabar.lesson/v1
id: bipa5.u04.l04
language: id
title: Sekolah dan kampus
can_do:
  ar_eg: توصف نظام التعليم في إندونيسيا من المدرسة للجامعة وتقارنه بمصر.
  ar: أن تصف نظام التعليم في إندونيسيا من المدرسة إلى الجامعة وتقارنه بمصر.
  en: Describe Indonesia's school system from primary school to university and compare it with Egypt.
slides:
  - title: Dari SD sampai kampus
    body:
      ar_eg: |
        السلم التعليمي في إندونيسيا:
        - SD (Sekolah Dasar) ٦ سنين ← SMP ٣ سنين ← SMA أو SMK (فني) ٣ سنين ← الجامعة (kampus)
        - وموازي ليهم مدارس دينية تبع وزارة الشؤون الدينية: MI وMTs وMA، زي الأزهري عندنا.
        - sekolah negeri = مدرسة حكومية، وsekolah swasta = مدرسة خاصة
        - rapor = الشهادة / كشف الدرجات آخر الترم
        - kelulusan = النجاح والتخرج، وupacara kelulusan = حفلة التخرج
        - jurusan = القسم أو التخصص في الجامعة: jurusan Sastra Arab
      ar: |
        السلّم التعليمي في إندونيسيا:
        - SD (Sekolah Dasar) ستّ سنوات ← SMP ثلاث سنوات ← SMA أو SMK (مهنية) ثلاث سنوات ← الجامعة (kampus)
        - ويوازيها تعليم ديني تابع لوزارة الشؤون الدينية: MI وMTs وMA، كالتعليم الأزهري عندنا.
        - sekolah negeri = مدرسة حكومية، وsekolah swasta = مدرسة خاصة
        - rapor = الشهادة الفصلية، كشف الدرجات
        - kelulusan = النجاح والتخرّج، وupacara kelulusan = حفل التخرّج
        - jurusan = القسم أو التخصّص الجامعي: jurusan Sastra Arab
      en: |
        Indonesia's school ladder:
        - SD (Sekolah Dasar) 6 years → SMP 3 years → SMA or SMK (vocational) 3 years → university (kampus)
        - Alongside runs a religious track under the Ministry of Religious Affairs: MI, MTs and MA, much like Egypt's Azhari schools.
        - sekolah negeri = state school; sekolah swasta = private school
        - rapor = school report card
        - kelulusan = passing, graduation; upacara kelulusan = graduation ceremony
        - jurusan = university department or major: jurusan Sastra Arab
    examples:
      - text: Setelah lulus SMA, dia masuk jurusan Sastra Arab.
        ar_eg: بعد ما خلص الثانوي، دخل قسم أدب عربي.
        ar: بعد تخرّجه في الثانوية، التحق بقسم الأدب العربي.
        en: After finishing high school, he entered the Arabic literature department.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sekolah negeri
        ar_eg: مدرسة حكومية
        ar: مدرسة حكومية
        en: state school
      - text: sekolah swasta
        ar_eg: مدرسة خاصة
        ar: مدرسة خاصة
        en: private school
      - text: rapor
        ar_eg: كشف الدرجات
        ar: الشهادة الفصلية
        en: report card
      - text: kelulusan
        ar_eg: النجاح / التخرج
        ar: النجاح، التخرّج
        en: graduation
      - text: jurusan
        ar_eg: قسم / تخصص
        ar: قسم، تخصّص
        en: major, department
    words: [sekolah negeri, sekolah swasta, rapor, kelulusan, jurusan]
  - id: e02
    type: listen
    text: Anak saya belajar di sekolah swasta karena dekat dengan rumah.
    question:
      ar_eg: الابن بيدرس في مدرسة إيه؟
      ar: في أيّ مدرسة يدرس الابن؟
      en: What kind of school does the child attend?
    options:
      - حكومية.
      - خاصة.
      - دولية في جاكرتا.
    answer: 1
    words: [sekolah swasta]
  - id: e03
    type: fill_blank
    sentence: Biaya ___ biasanya lebih murah karena dibantu pemerintah.
    meaning:
      ar_eg: مصاريف المدرسة الحكومية عادةً أرخص عشان الحكومة بتدعمها.
      ar: رسوم المدرسة الحكومية أقلّ عادةً لأنّ الحكومة تدعمها.
      en: State schools are usually cheaper because the government supports them.
    options: [sekolah negeri, sekolah swasta, rapor]
    answers: [sekolah negeri]
    words: [sekolah negeri]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: «rapor» يعني إيه؟
      ar: ما معنى «rapor»؟
      en: What is a "rapor"?
    options:
      - شهادة الميلاد.
      - جدول الحصص.
      - كشف الدرجات آخر الترم.
    answer: 2
    explain:
      ar_eg: rapor جاية من الهولندي rapport، يعني تقرير عن مستوى الطالب.
      ar: rapor من الهولندية rapport، أي تقرير عن مستوى الطالب.
      en: rapor comes from Dutch rapport, a report on the pupil's progress.
    words: [rapor]
  - id: e05
    type: build_sentence
    source:
      ar_eg: اخترت قسم أدب عربي في الجامعة.
      ar: اخترت قسم الأدب العربي في الجامعة.
      en: I chose the Arabic literature department at university.
    answer: Saya memilih jurusan Sastra Arab di universitas.
    distractors: [rapor, negeri]
    words: [jurusan]
  - id: e06
    type: translate
    direction: from_target
    source_text: Upacara kelulusan diadakan pada bulan Juni.
    answers_meaning:
      ar_eg:
        - حفلة التخرج بتتعمل في شهر يونيو.
        - حفل التخرج هيبقى في يونيو.
      ar:
        - يُقام حفل التخرّج في شهر يونيو.
        - حفل التخرّج يكون في يونيو.
      en:
        - The graduation ceremony is held in June.
        - Graduation takes place in June.
    words: [kelulusan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «Apa yang ditulis di rapor?» الإجابة الصح إيه؟
      ar: ما الإجابة الصحيحة عن «Apa yang ditulis di rapor?»؟
      en: Which answers "Apa yang ditulis di rapor?"
    options:
      - Nilai dan catatan guru.
      - Jadwal bus sekolah.
      - Menu kantin.
    answer: 0
    words: [rapor]
  - id: e08
    type: speaking
    text: Setelah kelulusan, saya ingin kuliah di jurusan hukum.
    meaning:
      ar_eg: بعد التخرج، عايز أدرس في قسم حقوق.
      ar: بعد التخرّج، أريد الدراسة في قسم الحقوق.
      en: After graduating, I want to study law.
    words: [kelulusan, jurusan]
  - id: e09
    type: dictation
    text: Sekolah swasta itu lebih mahal daripada sekolah negeri.
    meaning:
      ar_eg: المدرسة الخاصة دي أغلى من المدرسة الحكومية.
      ar: تلك المدرسة الخاصة أغلى من المدرسة الحكومية.
      en: That private school costs more than a state school.
    words: [sekolah swasta, sekolah negeri]
  - id: e10
    type: fill_blank
    sentence: Orang tua mengambil ___ anak mereka di akhir semester.
    meaning:
      ar_eg: الأهالي بيستلموا شهادة ولادهم آخر الترم.
      ar: يتسلّم الآباء الشهادة الفصلية لأبنائهم في نهاية الفصل.
      en: Parents collect their children's report cards at the end of term.
    options: [rapor, jurusan, kelulusan]
    answers: [rapor]
    words: [rapor]
dialogue:
  title: Keponakan Mas Rizal
  lines:
    - speaker: Mas Rizal
      text: Keponakan saya baru lulus SD. Sekarang dia masuk SMP negeri di Tenggarong.
      ar_eg: بنت أختي لسه مخلصة ابتدائي، ودلوقتي دخلت إعدادي حكومي في تنجارونج.
      ar: ابنة أختي أنهت الابتدائية للتوّ، وقد التحقت الآن بإعدادية حكومية في تنغارونغ.
      en: My niece just finished primary school. Now she's starting a state junior high in Tenggarong.
    - speaker: Mohamed
      text: Bagaimana rapornya? Di Mesir, nilai sangat penting untuk masuk sekolah negeri.
      ar_eg: شهادتها عاملة إيه؟ في مصر الدرجات مهمة جدًا عشان تدخل مدرسة حكومية.
      ar: كيف شهادتها؟ في مصر الدرجات مهمّة جدًا لدخول المدارس الحكومية.
      en: How was her report card? In Egypt, marks matter a lot for state schools.
    - speaker: Mas Rizal
      text: Di sini juga. Nanti setelah SMA, dia mau memilih jurusan kedokteran.
      ar_eg: هنا كمان. وبعد الثانوي، عايزة تختار كلية طب.
      ar: وهنا كذلك. وبعد الثانوية تريد أن تختار تخصّص الطب.
      en: Here too. Later, after high school, she wants to study medicine.
    - speaker: Mohamed
      text: Semoga saya bisa datang ke upacara kelulusannya!
      ar_eg: يا رب أقدر أحضر حفلة تخرجها!
      ar: أرجو أن أتمكّن من حضور حفل تخرّجها!
      en: I hope I can come to her graduation!
