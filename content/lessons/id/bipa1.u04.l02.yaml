schema: kabar.lesson/v1
id: bipa1.u04.l02
language: id
title: Jam berapa?
can_do:
  ar_eg: تقول الساعة كام وتسأل عنها.
  ar: أن تخبر بالوقت وتسأل عنه.
  en: Tell and ask the time.
slides:
  - title: Jam berapa?
    body:
      ar_eg: |
        «الساعة كام؟» = «Jam berapa?» أو «Pukul berapa?» (pukul أرسمى شوية).
        والرد: jam + الرقم + وقت اليوم: jam tujuh pagi = ٧ الصبح، jam tujuh malam = ٧ بالليل.
        خلي بالك من الترتيب: jam tujuh = الساعة ٧، لكن tujuh jam = سبع ساعات (مدة).
      ar: |
        «كم الساعة؟» = «Jam berapa?» أو «Pukul berapa?» (وpukul أكثر رسمية).
        والجواب: jam + العدد + جزء اليوم: jam tujuh pagi = السابعة صباحًا، jam tujuh malam = السابعة مساءً.
        وانتبه للترتيب: jam tujuh = الساعة السابعة، أما tujuh jam = سبع ساعات (مدة).
      en: |
        "What time is it?" = "Jam berapa?" or "Pukul berapa?" (pukul is more formal).
        Answer: jam + number + part of day: jam tujuh pagi = 7 a.m., jam tujuh malam = 7 p.m.
        Watch the order: jam tujuh = seven o'clock, but tujuh jam = seven hours (a duration).
    grammar: id.time.clock
    examples:
      - text: Sekarang jam berapa? — Jam tujuh pagi.
        ar_eg: الساعة كام دلوقتي؟ — سبعة الصبح.
        ar: كم الساعة الآن؟ — السابعة صباحًا.
        en: What time is it now? — Seven a.m.
  - title: Lewat, kurang, seperempat
    body:
      ar_eg: |
        - lewat = و (بعد الساعة): jam tujuh lewat sepuluh = ٧ وعشرة
        - kurang = إلا: jam delapan kurang sepuluh = ٨ إلا عشرة
        - seperempat = ربع: jam tujuh lewat seperempat = ٧ وربع
        وفي الكتابة بيحطوا نقطة: 07.15.
      ar: |
        - lewat = و (بعد الساعة): jam tujuh lewat sepuluh = السابعة وعشر دقائق
        - kurang = إلا: jam delapan kurang sepuluh = الثامنة إلا عشر دقائق
        - seperempat = ربع: jam tujuh lewat seperempat = السابعة والربع
        وتُكتب بنقطة: 07.15.
      en: |
        - lewat = past: jam tujuh lewat sepuluh = 7:10
        - kurang = to: jam delapan kurang sepuluh = 7:50
        - seperempat = a quarter: jam tujuh lewat seperempat = 7:15
        Written with a dot: 07.15.
    grammar: id.time.clock
    examples:
      - text: Jam delapan kurang seperempat.
        ar_eg: تمانية إلا ربع.
        ar: الثامنة إلا ربعًا.
        en: A quarter to eight.
  - title: Setengah delapan = ٧:٣٠!
    body:
      ar_eg: |
        أكبر فخ: setengah (نص) بتاخد الساعة الجاية. setengah delapan = «نص على تمانية» = ٧ ونص، مش ٨ ونص!
        فـ ٨:٣٠ = setengah sembilan.
      ar: |
        أكبر فخ: setengah (نصف) تأخذ الساعة التالية. setengah delapan = «نصف نحو الثامنة» = السابعة والنصف، لا الثامنة والنصف!
        فالثامنة والنصف = setengah sembilan.
      en: |
        The big trap: setengah (half) takes the NEXT hour. setengah delapan = "half to eight" = 7:30, not 8:30!
        So 8:30 = setengah sembilan.
    grammar: id.time.clock
    examples:
      - text: Saya datang jam setengah delapan.
        ar_eg: هاجي الساعة سبعة ونص.
        ar: سآتي في السابعة والنصف.
        en: I'll come at half past seven.
  - title: Kapan? Berapa?
    body:
      ar_eg: |
        - kapan = إمتى: «Kapan kamu datang?» = «هتيجي إمتى؟»
        - berapa = كام، لأي رقم: السعر، السن، رقم التليفون، الساعة.
          «Umurmu berapa?» = «عندك كام سنة؟» — «Nomor HP-mu berapa?» = «رقمك كام؟»
        وكلمة waktu جاية من العربي «وقت»، وumur (السن) من «عمر». وتوقيت جاكرتا اسمه WIB = Waktu Indonesia Barat.
      ar: |
        - kapan = متى: «Kapan kamu datang?» = «متى تأتي؟»
        - berapa = كم، لكل عدد: السعر والعمر ورقم الهاتف والساعة.
          «Umurmu berapa?» = «كم عمرك؟» — «Nomor HP-mu berapa?» = «ما رقم هاتفك؟»
        وكلمة waktu من العربية «وقت»، وumur من «عمر». وتوقيت جاكرتا WIB = Waktu Indonesia Barat.
      en: |
        - kapan = when: "Kapan kamu datang?" = "When are you coming?"
        - berapa = how much / how many / what number: price, age, phone number, time.
          "Umurmu berapa?" = "How old are you?" — "Nomor HP-mu berapa?" = "What's your phone number?"
        waktu (time) comes from Arabic «وقت», and umur (age) from «عمر». Jakarta time is WIB = Waktu Indonesia Barat.
    grammar: id.question.kapan-berapa
    examples:
      - text: Umur saya dua puluh lima tahun.
        ar_eg: عندي خمسة وعشرين سنة.
        ar: عمري خمسة وعشرون عامًا.
        en: I'm twenty-five years old.
      - text: Jam berapa toko itu buka?
        ar_eg: المحل ده بيفتح الساعة كام؟
        ar: متى يفتح ذلك المتجر؟
        en: What time does that shop open?
exercises:
