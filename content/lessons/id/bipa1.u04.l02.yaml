schema: kabar.lesson/v1
id: bipa1.u04.l02
language: id
title: Belas, puluh, ribu
can_do:
  ar_eg: تقول الأرقام الكبيرة والمبالغ بالروبية.
  ar: أن تقول الأعداد الكبيرة والمبالغ بالروبية.
  en: Say big numbers and amounts in rupiah.
slides:
  - title: Belas dan puluh
    body:
      ar_eg: |
        - من ١١ لـ ١٩: الرقم + belas (زي «عشر» في «اتناشر»): dua belas = 12، tujuh belas = 17.
        - العشرات: الرقم + puluh: dua puluh = 20، dua puluh lima = 25.
        - «واحد» قبلهم بتبقى se-: sebelas = 11، sepuluh = 10. والصفر = nol.
      ar: |
        - من ١١ إلى ١٩: العدد + belas (كـ«عشر» في «اثنا عشر»): dua belas = 12، tujuh belas = 17.
        - العشرات: العدد + puluh: dua puluh = 20، dua puluh lima = 25.
        - و«واحد» قبلها يصير se-: sebelas = 11، sepuluh = 10. والصفر = nol.
      en: |
        - 11–19: number + belas (like Arabic «عشر» in «اثنا عشر»): dua belas = 12, tujuh belas = 17.
        - Tens: number + puluh: dua puluh = 20, dua puluh lima = 25.
        - "One" before them becomes se-: sebelas = 11, sepuluh = 10. Zero is nol.
    grammar: id.number.cardinal
    examples:
      - text: lima belas
        ar_eg: خمستاشر (15)
        ar: خمسة عشر (15)
        en: fifteen (15)
      - text: tiga puluh delapan
        ar_eg: تمانية وتلاتين (38)
        ar: ثمانية وثلاثون (38)
        en: thirty-eight (38)
  - title: Ratus, ribu, juta
    body:
      ar_eg: |
        - ratus = مية، ribu = ألف، juta = مليون.
        - ومع «واحد» برضه se-: seratus = 100، seribu = 1000، sejuta = مليون. («satu ratus» غلط.)
        - الترتيب من الكبير للصغير زي العربي: dua ratus lima puluh ribu = 250,000.
      ar: |
        - ratus = مئة، ribu = ألف، juta = مليون.
        - ومع «واحد» تُستعمل se- أيضًا: seratus = 100، seribu = 1000، sejuta = مليون. («satu ratus» خطأ.)
        - ويُقرأ العدد من الأكبر إلى الأصغر: dua ratus lima puluh ribu = 250,000.
      en: |
        - ratus = hundred, ribu = thousand, juta = million.
        - With "one", se- again: seratus = 100, seribu = 1,000, sejuta = 1,000,000. ("satu ratus" is wrong.)
        - Big to small, as in Arabic: dua ratus lima puluh ribu = 250,000.
    grammar: id.number.cardinal
    examples:
      - text: seratus dua puluh ribu
        ar_eg: مية وعشرين ألف (120,000)
        ar: مئة وعشرون ألفًا (120,000)
        en: one hundred twenty thousand (120,000)
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nol
        ar_eg: صفر
        ar: صفر
        en: zero
      - text: sepuluh
        ar_eg: عشرة
        ar: عشرة
        en: ten
      - text: sebelas
        ar_eg: حداشر
        ar: أحد عشر
        en: eleven
      - text: dua puluh
        ar_eg: عشرين
        ar: عشرون
        en: twenty
      - text: seratus
        ar_eg: مية
        ar: مئة
        en: one hundred
      - text: dua juta
        ar_eg: اتنين مليون
        ar: مليونان
        en: two million
    words: [nol, sepuluh, sebelas, puluh, seratus, juta]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول ١٢؟
      ar: كيف تقول ١٢؟
      en: How do you say 12?
    options: [dua belas, dua puluh, sebelas]
    answer: 0
    explain:
      ar_eg: ١١–١٩ = رقم + belas. dua puluh = ٢٠.
      ar: من ١١ إلى ١٩ = عدد + belas، وdua puluh = ٢٠.
      en: 11–19 = number + belas; dua puluh = 20.
    words: [dua, belas]
  - id: e03
    type: multiple_choice
    question: Rp50.000
    question_meaning:
      ar_eg: إزاي تقرا السعر ده؟
      ar: كيف تقرأ هذا السعر؟
      en: How do you read this price?
    options: [lima ribu, lima ratus ribu, lima puluh ribu]
    answer: 2
    explain:
      ar_eg: النقطة بتفصل الآلاف، يعني ٥٠ ألف.
      ar: النقطة تفصل الآلاف، فهو خمسون ألفًا.
      en: The dot separates thousands, so it's 50,000.
    words: [lima, puluh, ribu]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول مليون (١٬٠٠٠٬٠٠٠)؟
      ar: كيف تقول مليونًا (١٬٠٠٠٬٠٠٠)؟
      en: How do you say 1,000,000?
    options: [satu juta, sejuta, seratus]
    answer: 1
    explain:
      ar_eg: «واحد» قبل juta بتبقى se- زي seratus وseribu، يعني sejuta. وseratus = ١٠٠.
      ar: «واحد» قبل juta يصير se- كما في seratus وseribu، فهي sejuta، وseratus = ١٠٠.
      en: '"One" before juta becomes se-, as in seratus and seribu, so sejuta; seratus is 100.'
    words: [juta]
  - id: e05
    type: listen
    text: tiga belas ribu rupiah
    options: [tiga belas ribu rupiah, tiga puluh ribu rupiah, tiga ratus ribu rupiah]
    answer: 0
    meaning:
      ar_eg: ١٣٬٠٠٠ روبية
      ar: ١٣٬٠٠٠ روبية
      en: Rp13.000
    words: [tiga, belas, ribu, rupiah]
  - id: e06
    type: fill_blank
    sentence: Rp15.000 = lima ___ ribu
    meaning:
      ar_eg: ١٥ ألف روبية
      ar: خمسة عشر ألف روبية
      en: 15,000 rupiah
    options: [puluh, ratus, belas]
    answers: [belas]
    words: [belas]
  - id: e07
    type: fill_blank
    sentence: Rp2.000.000 = dua ___ rupiah
    meaning:
      ar_eg: اتنين مليون روبية
      ar: مليونا روبية
      en: two million rupiah
    options: [juta, ribu, ratus]
    answers: [juta]
    words: [juta, rupiah]
  - id: e08
    type: build_sentence
    source:
      ar_eg: خمسة وعشرين ألف روبية.
      ar: خمسة وعشرون ألف روبية.
      en: Twenty-five thousand rupiah.
    answer: Dua puluh lima ribu rupiah.
    distractors: [belas, ratus]
    words: [puluh, ribu, rupiah]
  - id: e09
    type: listen
    text: dua nol lima
    options: [dua nol lima, dua puluh lima, dua ratus lima ribu]
    answer: 0
    meaning:
      ar_eg: اتنين صفر خمسة (رقم بيتقري رقم رقم، زي رقم أوضة أو تليفون)
      ar: اثنان صفر خمسة (يُقرأ رقمًا رقمًا، كرقم غرفة أو هاتف)
      en: two-zero-five (read digit by digit, like a room or phone number)
    explain:
      ar_eg: أرقام الأوض والتليفونات بتتقري رقم رقم، والصفر = nol.
      ar: أرقام الغرف والهواتف تُقرأ رقمًا رقمًا، والصفر = nol.
      en: Room and phone numbers are read digit by digit, and 0 = nol.
    words: [nol, puluh, ratus]
  - id: e10
    type: dictation
    text: nol, sepuluh, seratus, seribu
    meaning:
      ar_eg: ٠، ١٠، ١٠٠، ١٠٠٠
      ar: ٠، ١٠، ١٠٠، ١٠٠٠
      en: 0, 10, 100, 1,000
    words: [nol, ratus, ribu]
dialogue:
  lines:
    - speaker: Kasir
      text: Seratus dua puluh ribu rupiah, Pak.
      ar_eg: مية وعشرين ألف روبية يا أستاذ.
      ar: مئة وعشرون ألف روبية يا سيدي.
      en: That's 120,000 rupiah, sir.
    - speaker: Mohamed
      text: Seratus dua puluh ribu?
      ar_eg: مية وعشرين ألف؟
      ar: مئة وعشرون ألفًا؟
      en: 120,000?
    - speaker: Kasir
      text: Ya, Pak. Seratus dua puluh ribu.
      ar_eg: أيوه يا أستاذ. مية وعشرين ألف.
      ar: نعم يا سيدي. مئة وعشرون ألفًا.
      en: Yes, sir. 120,000.
    - speaker: Mohamed
      text: Ini dua ratus ribu, Mbak.
      ar_eg: اتفضلي ميتين ألف.
      ar: تفضلي، مئتا ألف.
      en: Here's 200,000.
    - speaker: Kasir
      text: Terima kasih. Ini delapan puluh ribu, Pak.
      ar_eg: شكرًا. اتفضل الباقي تمانين ألف.
      ar: شكرًا. تفضل الباقي ثمانون ألفًا.
      en: Thank you. Here's 80,000 change, sir.
