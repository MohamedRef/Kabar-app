schema: kabar.lesson/v1
id: bipa7.u10.l07
language: id
title: Menyusun proposal
can_do:
  ar_eg: تكتب الأجزاء الأولى من مقترح بحث وتتقدّم لمنحة.
  ar: أن تكتب الأجزاء الأولى من مقترح بحث وتتقدّم لمنحة.
  en: Draft the opening parts of a research proposal and apply for a grant.
slides:
  - title: Bab satu dan dua
    body:
      ar_eg: |
        مقترح البحث بيبدأ بـ latar belakang (الخلفية): ليه الموضوع مهم؟
        بعدها rumusan masalah (أسئلة البحث)، غالبًا في شكل سؤال: Bagaimana…? Mengapa…?
        tinjauan pustaka = مراجعة الدراسات السابقة. kerangka teori = الإطار النظري اللي هتفسّر بيه النتائج.
        paradigma = النموذج الفكري (كمّي ولا كيفي مثلًا). konseptual = مفاهيمي (kerangka konseptual).
        تحت الملخّص بتكتب 3–5 kata kunci (كلمات مفتاحية).
        ولو المقترح حلو ممكن تاخد hibah penelitian (منحة بحثية).
      ar: |
        يبدأ مقترح البحث بـ latar belakang (الخلفية): لماذا الموضوع مهمّ؟
        ثمّ rumusan masalah (أسئلة البحث)، غالبًا بصيغة سؤال: Bagaimana…? Mengapa…?
        tinjauan pustaka = مراجعة الأدبيات. kerangka teori = الإطار النظري الذي تفسّر به النتائج.
        paradigma = النموذج الفكري (كمّي أو نوعي مثلًا). konseptual = مفاهيمي (kerangka konseptual).
        وتحت الملخّص تكتب من 3 إلى 5 kata kunci (كلمات مفتاحية).
        وإن كان المقترح جيّدًا فقد تنال hibah penelitian (منحة بحثية).
      en: |
        A proposal opens with the latar belakang (background): why does the topic matter?
        Then the rumusan masalah (research questions), usually as questions: Bagaimana…? Mengapa…?
        tinjauan pustaka = literature review. kerangka teori = the theoretical framework you'll interpret results with.
        paradigma = the research paradigm (e.g. quantitative or qualitative). konseptual = conceptual (kerangka konseptual).
        Under the abstract you write 3–5 kata kunci (keywords).
        And a good proposal may win a hibah penelitian (research grant).
    examples:
      - text: Latar belakang penelitian ini adalah hilangnya bahasa daerah.
        ar_eg: خلفية البحث ده هي اختفاء اللغات المحلية.
        ar: خلفية هذا البحث اندثار اللغات المحلية.
        en: This study's background is the loss of local languages.
      - text: Rumusan masalahnya terdiri atas dua pertanyaan.
        ar_eg: أسئلة البحث عبارة عن سؤالين.
        ar: تتكوّن صياغة الإشكالية من سؤالين.
        en: The problem statement consists of two questions.
      - text: Tinjauan pustaka saya mencakup tiga puluh artikel.
        ar_eg: مراجعة الدراسات السابقة عندي فيها تلاتين مقالة.
        ar: تشمل مراجعتي للأدبيات ثلاثين مقالة.
        en: My literature review covers thirty articles.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: latar belakang
        ar_eg: خلفية (البحث)
        ar: الخلفية
        en: background
      - text: rumusan masalah
        ar_eg: صياغة مشكلة البحث / أسئلة البحث
        ar: صياغة الإشكالية
        en: problem statement, research questions
      - text: tinjauan pustaka
        ar_eg: مراجعة الدراسات السابقة
        ar: مراجعة الأدبيات
        en: literature review
      - text: kerangka teori
        ar_eg: الإطار النظري
        ar: الإطار النظري
        en: theoretical framework
    words: [latar belakang, rumusan masalah, tinjauan pustaka, kerangka teori]
  - id: e02
    type: match_pairs
    pairs:
      - text: kata kunci
        ar_eg: كلمات مفتاحية
        ar: الكلمات المفتاحية
        en: keywords
      - text: paradigma
        ar_eg: نموذج فكري / براديم
        ar: نموذج فكري
        en: paradigm
      - text: konseptual
        ar_eg: مفاهيمي
        ar: مفاهيمي
        en: conceptual
      - text: hibah penelitian
        ar_eg: منحة بحثية
        ar: منحة بحثية
        en: research grant
    words: [kata kunci, paradigma, konseptual, hibah penelitian]
  - id: e03
    type: listen
    text: Proposal kami mendapat hibah penelitian dari universitas.
    question:
      ar_eg: المقترح خد إيه؟
      ar: على ماذا حصل المقترح؟
      en: What did the proposal get?
    options: [منحة بحثية, إطار نظري, كلمات مفتاحية]
    answer: 0
    meaning:
      ar_eg: مقترحنا خد منحة بحثية من الجامعة.
      ar: نال مقترحنا منحة بحثية من الجامعة.
      en: Our proposal won a research grant from the university.
    words: [hibah penelitian]
  - id: e04
    type: fill_blank
    sentence: Tulis tiga sampai lima ___ di bawah abstrak.
    meaning:
      ar_eg: اكتب من تلاتة لخمسة ___ تحت الملخّص.
      ar: اكتب من ثلاث إلى خمس ___ تحت الملخّص.
      en: Write three to five ___ under the abstract.
    options: [kata kunci, latar belakang, paradigma]
    answers: [kata kunci]
    words: [kata kunci, latar belakang, paradigma]
    explain:
      ar_eg: تحت الملخص بتكتب kata kunci = كلمات مفتاحية. latar belakang = خلفية وparadigma = منظور.
      ar: تحت الملخص تُكتب kata kunci أي الكلمات المفتاحية.
      en: Under an abstract go kata kunci (keywords).
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي بيتكتب في «tinjauan pustaka»؟
      ar: ماذا يُكتب في «tinjauan pustaka»؟
      en: What goes in a 'tinjauan pustaka'?
    options: [Daftar harga buku., Ucapan terima kasih., Ringkasan dan kritik terhadap penelitian sebelumnya.]
    answer: 2
    explain:
      ar_eg: مراجعة الدراسات = تلخيص ونقد البحوث اللي قبلك.
      ar: مراجعة الأدبيات = تلخيص البحوث السابقة ونقدها.
      en: Literature review = summarising and critiquing earlier studies.
    words: [tinjauan pustaka]
  - id: e06
    type: fill_blank
    sentence: Teori Fishman menjadi ___ penelitian saya.
    meaning:
      ar_eg: نظرية فيشمان بقت ___ بتاع بحثي.
      ar: صارت نظرية فيشمان ___ لبحثي.
      en: Fishman's theory is my study's ___.
    options: [kerangka teori, hibah penelitian, rumusan masalah]
    answers: [kerangka teori]
    words: [kerangka teori, hibah penelitian, rumusan masalah]
    explain:
      ar_eg: نظرية فيشمان هي kerangka teori = الإطار النظري. hibah = منحة وrumusan masalah = صياغة المشكلة.
      ar: نظرية فيشمان kerangka teori أي الإطار النظري.
      en: A guiding theory is the kerangka teori.
  - id: e07
    type: build_sentence
    source:
      ar_eg: البحث ده بيستعمل النموذج الكيفي.
      ar: يعتمد هذا البحث النموذج النوعي.
      en: This study uses the qualitative paradigm.
    answer: Penelitian ini memakai paradigma kualitatif.
    distractors: [konseptual, kata kunci]
    words: [paradigma]
    explain:
      ar_eg: Penelitian ini + memakai (بيستعمل) + paradigma kualitatif (المنظور النوعي). konseptual وkata kunci زيادة.
      ar: Penelitian ini memakai paradigma kualitatif. konseptual وkata kunci زائدتان.
      en: Penelitian ini + memakai + paradigma kualitatif. konseptual and kata kunci are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Kerangka konseptual menghubungkan semua variabel penelitian.
    answers_meaning:
      ar_eg: [الإطار المفاهيمي بيربط كل متغيّرات البحث, الإطار المفاهيمي بيوصّل كل متغيّرات البحث ببعض]
      ar: [يربط الإطار المفاهيمي جميع متغيّرات البحث, يصل الإطار المفاهيمي بين متغيّرات البحث كلّها]
      en: ['The conceptual framework links all the study''s variables', A conceptual framework connects every research variable]
    words: [konseptual]
  - id: e09
    type: speaking
    text: Latar belakang menjelaskan mengapa rumusan masalah ini penting.
    meaning:
      ar_eg: الخلفية بتشرح ليه أسئلة البحث دي مهمّة.
      ar: تشرح الخلفية سبب أهمّية هذه الإشكالية.
      en: The background explains why this problem matters.
    words: [latar belakang, rumusan masalah]
  - id: e10
    type: multiple_choice
    question: Bagian mana yang biasanya berbentuk pertanyaan?
    options: [Rumusan masalah., Kata kunci., Hibah penelitian.]
    answer: 0
    explain:
      ar_eg: أسئلة البحث بتتكتب في شكل سؤال.
      ar: تُصاغ الإشكالية عادةً في صورة سؤال.
      en: The problem statement is usually phrased as questions.
    words: [rumusan masalah, kata kunci, hibah penelitian, tinjauan pustaka, kerangka teori, latar belakang, paradigma, konseptual]
dialogue:
  lines:
    - speaker: Pak Elias
      text: Mohamed, proposalmu tentang Melayu Papua sudah saya baca.
      ar_eg: يا محمد، قريت مقترحك عن الملايو البابوي.
      ar: يا محمد، قرأت مقترحك عن الملايوية البابوية.
      en: Mohamed, I've read your proposal on Papuan Malay.
    - speaker: Mohamed
      text: Bagaimana latar belakangnya, Pak?
      ar_eg: إيه رأيك في الخلفية يا دكتور؟
      ar: ما رأيك في الخلفية يا دكتور؟
      en: How's the background, sir?
    - speaker: Pak Elias
      text: Kuat. Tetapi rumusan masalahnya masih terlalu luas.
      ar_eg: قوية. بس أسئلة البحث لسه واسعة أوي.
      ar: قويّة، لكنّ الإشكالية ما زالت واسعة جدًّا.
      en: Strong. But the problem statement is still too broad.
    - speaker: Mohamed
      text: Saya akan mempersempitnya. Apakah tinjauan pustakanya cukup?
      ar_eg: هضيّقها. ومراجعة الدراسات كفاية؟
      ar: سأضيّقها. وهل مراجعة الأدبيات كافية؟
      en: I'll narrow it. Is the literature review enough?
    - speaker: Pak Elias
      text: Tambahkan kerangka teori yang jelas. Lalu kita ajukan untuk hibah penelitian.
      ar_eg: زوّد إطار نظري واضح. وبعدين نقدّم على منحة بحثية.
      ar: أضف إطارًا نظريًّا واضحًا، ثمّ نتقدّم لمنحة بحثية.
      en: Add a clear theoretical framework. Then we'll apply for a research grant.
