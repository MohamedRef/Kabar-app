schema: kabar.lesson/v1
id: bipa1.u01.l05
language: id
title: Dia, kami, kita
can_do:
  ar_eg: تقول «هو/هي» ونوعين «إحنا»، وتستأذن أو تعتذر.
  ar: أن تقول «هو/هي» ونوعَي «نحن»، وتستأذن أو تعتذر.
  en: Say he/she and both kinds of "we", and excuse yourself.
slides:
  - title: Dia, kami, kita
    body:
      ar_eg: |
        - dia: «هو» و«هي» الاتنين! مافيش مذكر ومؤنث.
        - و«إحنا» ليها نوعين: kita = إحنا وإنت معانا، kami = إحنا من غيرك.
        - mereka = هما، وkalian = إنتو (لأكتر من واحد).
        لو بتكلم صاحبك وإنتو الاتنين في كوتا توا، تقول «Kita di Kota Tua!».
      ar: |
        - dia: «هو» و«هي» معًا، فلا تمييز بين المذكر والمؤنث.
        - و«نحن» نوعان: kita = نحن ومعنا المخاطَب، kami = نحن من دون المخاطَب.
        - mereka = هم، وkalian = أنتم (لأكثر من واحد).
        فإذا كنت مع صديقك في كوتا توا قلت له: «Kita di Kota Tua!».
      en: |
        - dia: both "he" and "she" — no gender at all.
        - "We" comes in two kinds: kita = we, including you; kami = we, not including you.
        - mereka = they; kalian = you (more than one).
        Standing in Kota Tua with your friend, you tell him "Kita di Kota Tua!".
    grammar: id.pronoun.personal
    examples:
      - text: Dia Rina.
        ar_eg: دي رينا.
        ar: هذه رينا. (حرفيًا «هي رينا»)
        en: She's Rina.
      - text: Kita di Jakarta!
        ar_eg: إحنا (أنا وإنت) في جاكرتا!
        ar: نحن (أنا وأنت) في جاكرتا!
        en: We're (you and I) in Jakarta!
      - text: Kami di Kota Tua, Bu.
        ar_eg: إحنا (من غيرك) في كوتا توا يا مدام.
        ar: نحن (دونكِ) في كوتا توا يا سيدتي.
        en: We (not you) are in Kota Tua, ma'am.
  - title: Maaf, permisi, salam kenal
    body:
      ar_eg: |
        - maaf: «آسف / لا مؤاخذة»، جاية من العربي «مُعافى» (جذر ع ف و، زي «العفو»).
        - permisi: «بعد إذنك»، لما تعدّي أو تنادي حد.
        - salam kenal: «فرصة سعيدة / اتشرفنا»، أول مرة تقابل حد. salam جاية من «سلام».
      ar: |
        - maaf: «آسف / عفوًا»، من العربية «مُعافى» (الجذر ع ف و، كـ«العفو»).
        - permisi: «بعد إذنك»، عند المرور أو النداء.
        - salam kenal: «تشرّفنا»، عند أول لقاء. وsalam من «سلام».
      en: |
        - maaf: "sorry / excuse me", from Arabic «مُعافى» (root ع ف و, as in «العفو»).
        - permisi: "excuse me" when passing by or getting someone's attention.
        - salam kenal: "nice to meet you", at a first meeting. salam ← «سلام».
    examples:
      - text: Maaf, Pak!
        ar_eg: آسف يا أستاذ!
        ar: عفوًا يا سيدي!
        en: Sorry, sir!
      - text: Salam kenal, saya Mohamed.
        ar_eg: اتشرفنا، أنا محمد.
        ar: تشرّفنا، أنا محمد.
        en: Nice to meet you, I'm Mohamed.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «هو» و«هي» في نفس الوقت؟
      ar: أيّ كلمة تعني «هو» و«هي» معًا؟
      en: Which word means both "he" and "she"?
    options: [dia, kamu, mereka]
    answer: 0
    words: [dia, mereka]
    explain:
      ar_eg: dia = هو وهي مع بعض، الإندونيسي مابيفرقش. kamu = إنت، وmereka = هم.
      ar: dia = هو وهي معًا، فالإندونيسية لا تفرّق. kamu أنت وmereka هم.
      en: dia means both he and she.
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إنت وRaka سوا في جاكرتا. عايز تقوله «إحنا في جاكرتا!» (إنت وهو).
      ar: أنت وRaka معًا في جاكرتا، وتريد أن تقول له «نحن في جاكرتا!» (أنت وهو).
      en: You and Raka are both in Jakarta. You tell him "We're in Jakarta!" (you and him).
    options: [Kita di Jakarta!, Dia di Jakarta!, Kami di Jakarta!]
    answer: 0
    explain:
      ar_eg: Raka معاك، يبقى kita. kami معناها «إحنا من غيرك».
      ar: Raka داخل في «نحن»، فتلزم kita، أما kami فتخرجه.
      en: Raka is included, so it's kita; kami would leave him out.
    words: [kita, kami, di]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: خبطت في حد من غير قصد في السوق. تقول إيه؟
      ar: اصطدمت بأحدهم دون قصد في السوق. ماذا تقول؟
      en: You bump into someone by accident at the market. What do you say?
    options: [Selamat pagi!, Maaf!, Sama-sama!]
    answer: 1
    explain:
      ar_eg: maaf = آسف، وجاية من العربي «مُعافى»، زي «العفو».
      ar: maaf = عفوًا، من العربية «مُعافى».
      en: maaf = sorry, from Arabic «مُعافى».
    words: [maaf]
  - id: e04
    type: fill_blank
    sentence: ___, Bu. Saya Mohamed.
    meaning:
      ar_eg: بعد إذنك يا مدام. أنا محمد.
      ar: بعد إذنكِ يا سيدتي. أنا محمد.
      en: Excuse me, ma'am. I'm Mohamed.
    options: [Sama-sama, Selamat jalan, Permisi]
    answers: [Permisi]
    explain:
      ar_eg: permisi بتتقال لما تنادي حد أو تستأذن. Sama-sama رد على الشكر، وSelamat jalan وداع.
      ar: permisi تقال عند النداء أو الاستئذان، وSama-sama جواب الشكر، وSelamat jalan للوداع.
      en: permisi gets someone's attention politely; Sama-sama answers thanks and Selamat jalan is a goodbye.
    words: [permisi]
  - id: e05
    type: build_sentence
    source:
      ar_eg: لا مؤاخذة، حضرتك الأستاذ إروان؟
      ar: عفوًا، هل أنت الأستاذ إروان؟
      en: Excuse me, are you Pak Irwan?
    answer: Maaf, Anda Pak Irwan?
    distractors: [kamu, saya]
    explain:
      ar_eg: مع حد غريب ومحترم Anda تنفع، kamu للصحاب بس.
      ar: مع الغريب المحترم تصلح Anda، أما kamu فللأصدقاء.
      en: With a respected stranger Anda works; kamu is only for friends.
    words: [maaf, Anda]
  - id: e06
    type: dictation
    text: Permisi, Pak.
    meaning:
      ar_eg: بعد إذنك يا أستاذ.
      ar: بعد إذنك يا سيدي.
      en: Excuse me, sir.
    words: [permisi]
  - id: e07
    type: match_pairs
    pairs:
      - text: dia
        ar_eg: هو / هي
        ar: هو / هي
        en: he / she
      - text: kami
        ar_eg: إحنا (من غيرك)
        ar: نحن (دونك)
        en: we (not you)
      - text: kita
        ar_eg: إحنا (وإنت معانا)
        ar: نحن (ومعنا أنت)
        en: we (with you)
      - text: mereka
        ar_eg: هما
        ar: هم
        en: they
      - text: kalian
        ar_eg: إنتو
        ar: أنتم
        en: you (plural)
      - text: permisi
        ar_eg: بعد إذنك
        ar: بعد إذنك
        en: excuse me
    words: [dia, kami, kita, mereka, kalian, permisi]
  - id: e08
    type: fill_blank
    sentence: Hai, Rina dan Raka! Apa kabar ___?
    meaning:
      ar_eg: أهلًا يا رينا وراكا! عاملين إيه؟
      ar: مرحبًا يا رينا وراكا! كيف حالكما؟
      en: Hi, Rina and Raka! How are you (both)?
    options: [kalian, mereka, kami]
    answers: [kalian]
    explain:
      ar_eg: بتكلّم اتنين، يبقى kalian (إنتو). mereka معناها «هما» وانت بتتكلم عنهم مش معاهم.
      ar: تخاطب اثنين، فتلزم kalian (أنتم)؛ أما mereka فتعني «هم» حين تتحدث عنهم.
      en: You're talking to two people, so kalian ("you all"); mereka means "they", for people you talk about.
    words: [kalian]
  - id: e09
    type: speaking
    text: Hai! Kami di Jakarta. Kalian juga?
    meaning:
      ar_eg: أهلًا! إحنا في جاكرتا. وإنتو كمان؟
      ar: مرحبًا! نحن في جاكرتا. وأنتم أيضًا؟
      en: Hi! We're in Jakarta. You too?
    words: [kami, di, kalian]
  - id: e10
    type: listen
    text: Maaf, mereka di Jakarta.
    options: ['Maaf, mereka di Jakarta.', 'Maaf, kami di Jakarta.', 'Maaf, kita di Jakarta.']
    answer: 0
    meaning:
      ar_eg: لا مؤاخذة، هما في جاكرتا.
      ar: عفوًا، هم في جاكرتا.
      en: Sorry, they're in Jakarta.
    words: [maaf, mereka, di]

dialogue:
  title: Di depan museum
  lines:
    - speaker: Mohamed
      text: Permisi, Pak. Maaf, Anda Pak Irwan?
      ar_eg: بعد إذنك يا أستاذ. لا مؤاخذة، حضرتك الأستاذ إروان؟
      ar: بعد إذنك يا سيدي. عفوًا، هل أنت الأستاذ إروان؟
      en: Excuse me, sir. Sorry, are you Pak Irwan?
    - speaker: Pak Irwan
      text: Ya, saya Irwan. Selamat siang!
      ar_eg: أيوه، أنا إروان. نهارك سعيد!
      ar: نعم، أنا إروان. طاب نهارك!
      en: Yes, I'm Irwan. Good afternoon!
    - speaker: Mohamed
      text: Selamat siang, Pak. Saya Mohamed. Salam kenal.
      ar_eg: نهارك سعيد يا أستاذ. أنا محمد. اتشرفنا.
      ar: طاب نهارك يا سيدي. أنا محمد. تشرّفنا.
      en: Good afternoon, sir. I'm Mohamed. Nice to meet you.
    - speaker: Pak Irwan
      text: Salam kenal juga, Mohamed!
      ar_eg: وأنا اتشرفت بيك كمان يا محمد!
      ar: وأنا تشرّفت بك أيضًا يا محمد!
      en: Nice to meet you too, Mohamed!
    - speaker: Raka
      text: Hai, Mohamed! Aku Raka.
      ar_eg: أهلًا يا محمد! أنا راكا.
      ar: مرحبًا يا محمد! أنا راكا.
      en: Hi, Mohamed! I'm Raka.
    - speaker: Mohamed
      text: Hai, Raka! Salam kenal.
      ar_eg: أهلًا يا راكا! اتشرفنا.
      ar: مرحبًا يا راكا! تشرّفنا.
      en: Hi, Raka! Nice to meet you.
