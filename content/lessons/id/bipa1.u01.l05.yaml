schema: kabar.lesson/v1
id: bipa1.u01.l05
language: id
title: Dia, kami, kita
can_do:
  ar_eg: تقول «هو/هي» ونوعين «إحنا»، وتستأذن أو تعتذر.
  ar: أن تقول «هو/هي» ونوعَي «نحن»، وتستأذن أو تعتذر.
  en: Say he/she and both kinds of "we", and excuse yourself.
slides:
  - title: Dia, kami, kita
    body:
      ar_eg: |
        - dia: «هو» و«هي» الاتنين! مافيش مذكر ومؤنث.
        - و«إحنا» ليها نوعين: kita = إحنا وإنت معانا، kami = إحنا من غيرك.
        لو بتكلم صاحبك وإنتو الاتنين في كوتا توا، تقول «Kita di Kota Tua!».
      ar: |
        - dia: «هو» و«هي» معًا، فلا تمييز بين المذكر والمؤنث.
        - و«نحن» نوعان: kita = نحن ومعنا المخاطَب، kami = نحن من دون المخاطَب.
        فإذا كنت مع صديقك في كوتا توا قلت له: «Kita di Kota Tua!».
      en: |
        - dia: both "he" and "she" — no gender at all.
        - "We" comes in two kinds: kita = we, including you; kami = we, not including you.
        Standing in Kota Tua with your friend, you tell him "Kita di Kota Tua!".
    grammar: id.pronoun.personal
    examples:
      - text: Dia Rina.
        ar_eg: دي رينا.
        ar: هذه رينا. (حرفيًا «هي رينا»)
        en: She's Rina.
      - text: Kita di Jakarta!
        ar_eg: إحنا (أنا وإنت) في جاكرتا!
        ar: نحن (أنا وأنت) في جاكرتا!
        en: We're (you and I) in Jakarta!
      - text: Kami di Kota Tua, Bu.
        ar_eg: إحنا (من غيرك) في كوتا توا يا مدام.
        ar: نحن (دونكِ) في كوتا توا يا سيدتي.
        en: We (not you) are in Kota Tua, ma'am.
  - title: Maaf, permisi, salam kenal
    body:
      ar_eg: |
        - maaf: «آسف / لا مؤاخذة»، جاية من العربي «معافاة» (جذر ع ف و، زي «العفو»).
        - permisi: «بعد إذنك»، لما تعدّي أو تنادي حد.
        - salam kenal: «فرصة سعيدة / اتشرفنا»، أول مرة تقابل حد. salam جاية من «سلام».
      ar: |
        - maaf: «آسف / عفوًا»، من العربية «معافاة» (الجذر ع ف و، كـ«العفو»).
        - permisi: «بعد إذنك»، عند المرور أو النداء.
        - salam kenal: «تشرّفنا»، عند أول لقاء. وsalam من «سلام».
      en: |
        - maaf: "sorry / excuse me", from Arabic «معافاة» (root ع ف و, as in «العفو»).
        - permisi: "excuse me" when passing by or getting someone's attention.
        - salam kenal: "nice to meet you", at a first meeting. salam ← «سلام».
    examples:
      - text: Maaf, Pak!
        ar_eg: آسف يا أستاذ!
        ar: عفوًا يا سيدي!
        en: Sorry, sir!
      - text: Salam kenal, saya Mohamed.
        ar_eg: اتشرفنا، أنا محمد.
        ar: تشرّفنا، أنا محمد.
        en: Nice to meet you, I'm Mohamed.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «هو» و«هي» في نفس الوقت؟
      ar: أيّ كلمة تعني «هو» و«هي» معًا؟
      en: Which word means both "he" and "she"?
    options: [dia, kamu, kami]
    answer: 0
    words: [dia]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إنت وDimas سوا في كوتا توا. عايز تقوله «إحنا في كوتا توا!» (إنت وهو).
      ar: أنت وDimas معًا في كوتا توا، وتريد أن تقول له «نحن في كوتا توا!» (أنت وهو).
      en: You and Dimas are both in Kota Tua. You tell him "We're in Kota Tua!" (you and him).
    options: [Kita di Kota Tua!, Dia di Kota Tua!, Kami di Kota Tua!]
    answer: 0
    explain:
      ar_eg: Dimas معاك، يبقى kita. kami معناها «إحنا من غيرك».
      ar: Dimas داخل في «نحن»، فتلزم kita، أما kami فتخرجه.
      en: Dimas is included, so it's kita; kami would leave him out.
    words: [kita, kami]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: خبطت في حد من غير قصد في السوق. تقول إيه؟
      ar: اصطدمت بأحدهم دون قصد في السوق. ماذا تقول؟
      en: You bump into someone by accident at the market. What do you say?
    options: [Selamat datang!, Maaf!, Sama-sama!]
    answer: 1
    explain:
      ar_eg: maaf = آسف، وجاية من العربي «معافاة»، زي «العفو».
      ar: maaf = عفوًا، من العربية «معافاة».
      en: maaf = sorry, from Arabic «معافاة».
    words: [maaf]
  - id: e04
    type: fill_blank
    sentence: ___, Bu. Saya Mohamed.
    meaning:
      ar_eg: بعد إذنك يا مدام. أنا محمد.
      ar: بعد إذنكِ يا سيدتي. أنا محمد.
      en: Excuse me, ma'am. I'm Mohamed.
    options: [Sama-sama, Selamat jalan, Permisi]
    answers: [Permisi]
    explain:
      ar_eg: permisi بتتقال لما تنادي حد أو تستأذن. Sama-sama رد على الشكر، وSelamat jalan وداع.
      ar: permisi تقال عند النداء أو الاستئذان، وSama-sama جواب الشكر، وSelamat jalan للوداع.
      en: permisi gets someone's attention politely; Sama-sama answers thanks and Selamat jalan is a goodbye.
    words: [permisi]
  - id: e05
    type: build_sentence
    source:
      ar_eg: لا مؤاخذة، حضرتك الأستاذ بودي؟
      ar: عفوًا، هل أنت الأستاذ بودي؟
      en: Excuse me, are you Pak Budi?
    answer: Maaf, Anda Pak Budi?
    distractors: [kamu, saya]
    explain:
      ar_eg: مع حد غريب ومحترم Anda تنفع، kamu للصحاب بس.
      ar: مع الغريب المحترم تصلح Anda، أما kamu فللأصدقاء.
      en: With a respected stranger Anda works; kamu is only for friends.
    words: [maaf, Anda]
  - id: e06
    type: dictation
    text: Permisi, Pak.
    meaning:
      ar_eg: بعد إذنك يا أستاذ.
      ar: بعد إذنك يا سيدي.
      en: Excuse me, sir.
    words: [permisi]
dialogue:
  title: Di depan museum
  lines:
    - speaker: Mohamed
      text: Permisi, Pak. Maaf, Anda Pak Budi?
      ar_eg: بعد إذنك يا أستاذ. لا مؤاخذة، حضرتك الأستاذ بودي؟
      ar: بعد إذنك يا سيدي. عفوًا، هل أنت الأستاذ بودي؟
      en: Excuse me, sir. Sorry, are you Pak Budi?
    - speaker: Pak Budi
      text: Ya, saya Budi. Selamat siang!
      ar_eg: أيوه، أنا بودي. نهارك سعيد!
      ar: نعم، أنا بودي. طاب نهارك!
      en: Yes, I'm Budi. Good afternoon!
    - speaker: Mohamed
      text: Selamat siang, Pak. Saya Mohamed. Salam kenal.
      ar_eg: نهارك سعيد يا أستاذ. أنا محمد. اتشرفنا.
      ar: طاب نهارك يا سيدي. أنا محمد. تشرّفنا.
      en: Good afternoon, sir. I'm Mohamed. Nice to meet you.
    - speaker: Pak Budi
      text: Salam kenal, Mohamed. Selamat datang di Kota Tua!
      ar_eg: اتشرفنا يا محمد. أهلًا بيك في كوتا توا!
      ar: تشرّفنا يا محمد. أهلًا بك في كوتا توا!
      en: Nice to meet you, Mohamed. Welcome to Kota Tua!
    - speaker: Dimas
      text: Hai, Mohamed! Aku Dimas.
      ar_eg: أهلًا يا محمد! أنا ديماس.
      ar: مرحبًا يا محمد! أنا ديماس.
      en: Hi, Mohamed! I'm Dimas.
    - speaker: Mohamed
      text: Hai, Dimas! Salam kenal.
      ar_eg: أهلًا يا ديماس! اتشرفنا.
      ar: مرحبًا يا ديماس! تشرّفنا.
      en: Hi, Dimas! Nice to meet you.
new_words:
  - word: dia
    pos: pronoun
    ar_eg: هو / هي
    ar: هو / هي
    en: he, she
  - word: kami
    pos: pronoun
    ar_eg: إحنا (من غيرك)
    ar: نحن (دون المخاطَب)
    en: we (not including you)
  - word: kita
    pos: pronoun
    ar_eg: إحنا (وإنت معانا)
    ar: نحن (مع المخاطَب)
    en: we (including you)
  - word: maaf
    pos: interjection
    ar_eg: آسف، لا مؤاخذة
    ar: عفوًا، آسف
    en: sorry, excuse me
    arabic: معافاة
  - word: permisi
    pos: interjection
    ar_eg: بعد إذنك
    ar: بعد إذنك
    en: excuse me (to pass or get attention)
