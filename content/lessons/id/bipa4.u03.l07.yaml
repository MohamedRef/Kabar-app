schema: kabar.lesson/v1
id: bipa4.u03.l07
language: id
title: Dari Mesir ke Makassar
can_do:
  ar_eg: 'تقارن تاريخ مصر وماكاسار: حضارات قديمة، أماكن اتهدمت، ومين سنين.'
  ar: 'أن تقارن تاريخ مصر وماكاسار: حضارات قديمة وأماكن هُدمت وحقب زمنية.'
  en: 'Compare Egypt''s and Makassar''s history: old civilisations, places destroyed, decades and eras.'
slides:
  - title: Sejarah di dua kota
    body:
      ar_eg: |
        peradaban = حضارة (peradaban Mesir kuno)، Romawi = الرومان، الروماني.
        permulaan = البداية، pertengahan = النص، الوسط (pertengahan tahun 1600-an)، dekade = عقد (عشر سنين).
        dihancurkan = اتهدّ، اتدمّر، dibakar = اتحرق، dermaga = رصيف المينا.
      ar: |
        peradaban = حضارة (peradaban Mesir kuno)، Romawi = الروم، روماني.
        permulaan = البداية، pertengahan = المنتصف (pertengahan tahun 1600-an)، dekade = عقد (عشر سنوات).
        dihancurkan = دُمّر، هُدم، dibakar = أُحرق، dermaga = رصيف الميناء.
      en: |
        peradaban = civilisation (peradaban Mesir kuno); Romawi = Roman, the Romans.
        permulaan = beginning, pertengahan = middle (pertengahan tahun 1600-an), dekade = decade.
        dihancurkan = destroyed, dibakar = burned, dermaga = pier, wharf.
    examples:
      - text: Mesir punya peradaban yang sangat tua.
        ar_eg: مصر عندها حضارة قديمة جدًا.
        ar: لمصر حضارة عريقة جدًا.
        en: Egypt has a very old civilisation.
      - text: Benteng Somba Opu dihancurkan pada tahun 1669.
        ar_eg: قلعة سومبا أوبو اتهدّت سنة ١٦٦٩.
        ar: دُمّرت قلعة سومبا أوبو عام ١٦٦٩.
        en: Somba Opu fort was destroyed in 1669.
      - text: Kapal pinisi masih bersandar di dermaga Paotere.
        ar_eg: مراكب البينيسي لسه راسية على رصيف بائوتيري.
        ar: ما زالت سفن البينيسي راسية على رصيف باوتيري.
        en: Pinisi boats still moor at Paotere wharf.
