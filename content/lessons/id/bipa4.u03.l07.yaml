    answer: 0
    meaning:
      ar_eg: حصن بابليون في القاهرة اتبنى في زمن الرومان.
      ar: بُني حصن بابليون في القاهرة في العصر الروماني.
      en: Babylon Fortress in Cairo was built in Roman times.
    words: [romawi]
