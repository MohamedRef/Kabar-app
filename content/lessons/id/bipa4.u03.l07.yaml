  - id: e09
    type: translate
    direction: from_target
    source_text: Peradaban Mesir dan Romawi bertemu di Aleksandria.
    answers_meaning:
      ar_eg: [الحضارة المصرية والرومانية اتقابلوا في إسكندرية, حضارة مصر وحضارة الرومان اتلاقوا في إسكندرية]
      ar: [التقت الحضارتان المصرية والرومانية في الإسكندرية, التقت حضارة مصر بحضارة الروم في الإسكندرية]
      en: [Egyptian and Roman civilisation met in Alexandria, The Egyptian and Roman civilisations met in Alexandria]
