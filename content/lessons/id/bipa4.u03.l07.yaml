    meaning:
      ar_eg: في عشر سنين، الرصيف ده اتبنى تاني.
      ar: خلال عقد واحد أُعيد بناء هذا الرصيف.
      en: Within a decade, this wharf was rebuilt.
    words: [dekade, dermaga, dihancurkan, peradaban]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, sejarah Makassar mengingatkan saya pada Mesir.
      ar_eg: يا أستاذ، تاريخ ماكاسار بيفكّرني بمصر.
      ar: يا أخي، تاريخ ماكاسار يذكّرني بمصر.
      en: Mas, Makassar's history reminds me of Egypt.
    - speaker: Mas Rizal
      text: Kenapa? Peradaban Mesir jauh lebih tua.
      ar_eg: ليه؟ الحضارة المصرية أقدم بكتير.
      ar: لماذا؟ الحضارة المصرية أقدم بكثير.
      en: Why? Egypt's civilisation is much older.
    - speaker: Mohamed
      text: Betul. Tapi dua-duanya kota pelabuhan. Ada benteng Romawi di Kairo, ada benteng Gowa di sini.
      ar_eg: صح. بس الاتنين مدن موانئ. فيه حصن روماني في القاهرة، وفيه قلعة جووا هنا.
      ar: صحيح، لكن كلتيهما مدينتا ميناء. في القاهرة حصن روماني، وهنا قلعة غوا.
      en: True. But both are port cities. There's a Roman fort in Cairo and a Gowa fort here.
    - speaker: Mas Rizal
      text: Betul. Sayang, Benteng Somba Opu dihancurkan pada pertengahan tahun 1600-an.
      ar_eg: صح. خسارة إن قلعة سومبا أوبو اتهدّت في نص القرن السابع عشر.
      ar: صحيح. للأسف دُمّرت قلعة سومبا أوبو في منتصف القرن السابع عشر.
      en: Right. Sadly, Somba Opu fort was destroyed in the mid-1600s.
    - speaker: Mohamed
      text: Tapi dermaga Paotere masih ramai seperti dulu.
      ar_eg: بس رصيف بائوتيري لسه زحمة زي زمان.
      ar: لكن رصيف باوتيري ما زال مزدحمًا كما كان.
      en: But Paotere wharf is still as busy as ever.
