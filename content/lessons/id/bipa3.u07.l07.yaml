      ar_eg: الصورة دي أنا صورتها في قرية ساديه.
      ar: التقطتُ هذه الصورة في قرية سادي.
      en: I took this photo in Sade village.
    answer: Foto ini saya ambil di Desa Sade.
    distractors: [mengambil, diambil]
