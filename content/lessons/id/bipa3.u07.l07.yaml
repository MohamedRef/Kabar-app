  - id: e10
    type: dictation
    text: Beliau berjuang untuk kemerdekaan Indonesia.
    meaning:
      ar_eg: حضرته كافح عشان استقلال إندونيسيا.
      ar: كافح من أجل استقلال إندونيسيا.
      en: He fought for Indonesia's independence.
