schema: kabar.lesson/v1
id: bipa3.u07.l07
language: id
title: Presiden pertama
can_do:
  ar_eg: 'تحكي عن قادة إندونيسيا الأوائل: الرئيس والوزير والحزب والسياسة والسلطة.'
  ar: 'أن تحكي عن أوائل قادة إندونيسيا: الرئيس والوزير والحزب والسياسة والسلطة.'
  en: 'Talk about Indonesia''s first leaders: president, minister, party, politics and power.'
slides:
  - title: Pemimpin bangsa
    body:
      ar_eg: |
        presiden = رئيس (دولة). menteri = وزير (perdana menteri = رئيس وزرا).
        pemimpin = قائد، زعيم. memimpin = يقود.
        politik = سياسة. partai = حزب. republik = جمهورية. kekuasaan = سلطة، حكم (من kuasa).
      ar: |
        presiden = رئيس (دولة). menteri = وزير (perdana menteri = رئيس الوزراء).
        pemimpin = قائد، زعيم. memimpin = يقود.
        politik = سياسة. partai = حزب. republik = جمهورية. kekuasaan = سلطة (من kuasa).
      en: |
        presiden = president. menteri = minister (perdana menteri = prime minister).
        pemimpin = leader. memimpin = lead.
        politik = politics. partai = (political) party. republik = republic. kekuasaan = power (from kuasa).
    examples:
      - text: Soekarno adalah presiden pertama Republik Indonesia.
        ar_eg: سوكارنو هو أول رئيس لجمهورية إندونيسيا.
        ar: سوكارنو هو أول رئيس لجمهورية إندونيسيا.
        en: Soekarno was the first president of the Republic of Indonesia.
      - text: Pada tahun 1927, Soekarno mendirikan sebuah partai.
        ar_eg: سنة ١٩٢٧ سوكارنو أسّس حزب.
        ar: في عام ١٩٢٧ أسّس سوكارنو حزبًا.
        en: In 1927, Soekarno founded a party.
      - text: Hatta juga pernah menjadi perdana menteri.
        ar_eg: حتا كمان كان رئيس وزرا في وقت من الأوقات.
        ar: كان حتا أيضًا رئيسًا للوزراء في فترة ما.
        en: Hatta was also prime minister for a time.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: presiden
        ar_eg: رئيس
        ar: رئيس
        en: president
      - text: menteri
        ar_eg: وزير
        ar: وزير
        en: minister
      - text: pemimpin
        ar_eg: قائد
        ar: قائد، زعيم
        en: leader
      - text: memimpin
        ar_eg: يقود
        ar: يقود
        en: lead
    words: [presiden, menteri, pemimpin, memimpin]
  - id: e02
    type: match_pairs
    pairs:
      - text: politik
        ar_eg: سياسة
        ar: سياسة
        en: politics
      - text: partai
        ar_eg: حزب
        ar: حزب
        en: party
      - text: republik
        ar_eg: جمهورية
        ar: جمهورية
        en: republic
      - text: kekuasaan
        ar_eg: سلطة
        ar: سلطة
        en: power
    words: [politik, partai, republik, kekuasaan]
  - id: e03
    type: listen
    text: Presiden pertama Indonesia adalah Soekarno.
    question:
      ar_eg: مين أول رئيس؟
      ar: من أول رئيس؟
      en: Who was the first president?
    options: [حتا, سوكارنو, ديبونيجورو]
    answer: 1
    meaning:
      ar_eg: أول رئيس لإندونيسيا هو سوكارنو.
      ar: أول رئيس لإندونيسيا هو سوكارنو.
      en: Indonesia's first president was Soekarno.
    words: [presiden]
  - id: e04
    type: fill_blank
    sentence: Ayah saya suka membaca berita ___ di koran.
    meaning:
      ar_eg: أبويا بيحب يقرا أخبار ___ في الجرنال.
      ar: يحب أبي قراءة أخبار ___ في الصحيفة.
      en: My father likes reading ___ news in the paper.
    options: [politik, republik, memimpin]
    answers: [politik]
    words: [politik, republik, memimpin]
    explain:
      ar_eg: «أخبار سياسية» = berita politik. republik = جمهورية، وmemimpin = يقود وده فعل.
      ar: «أخبار سياسية» berita politik. أما republik فجمهورية، وmemimpin «يقود» وهو فعل.
      en: Political news is berita politik. republik is a republic and memimpin, to lead, is a verb.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي بيرأس وزارة في الحكومة اسمه إيه؟
      ar: ما اسم من يرأس وزارة في الحكومة؟
      en: What's the person who heads a government ministry called?
    options: [partai, menteri, kekuasaan]
    answer: 1
    explain:
      ar_eg: menteri = وزير.
      ar: menteri = وزير.
      en: menteri = minister.
    words: [menteri, partai, kekuasaan]
  - id: e06
    type: fill_blank
    sentence: Sultan itu punya ___ yang sangat besar.
    meaning:
      ar_eg: الملك ده كان عنده ___ كبيرة جدًا.
      ar: كانت لذلك الملك ___ كبيرة جدًا.
      en: That king had enormous ___.
    options: [pemimpin, partai, kekuasaan]
    answers: [kekuasaan]
    words: [kekuasaan, pemimpin, partai]
    explain:
      ar_eg: السلطان عنده kekuasaan (سلطة، نفوذ). pemimpin = قائد، وpartai = حزب.
      ar: للسلطان kekuasaan «سلطة». أما pemimpin فقائد، وpartai حزب.
      en: A sultan has kekuasaan, power. pemimpin is a leader and partai a party.
  - id: e07
    type: build_sentence
    source:
      ar_eg: مين اللي بيقود الحزب ده؟
      ar: من يقود هذا الحزب؟
      en: Who leads this party?
    answer: Siapa yang memimpin partai ini?
    distractors: [republik, menteri]
    words: [memimpin, partai]
    explain:
      ar_eg: "«بيقود» = memimpin: Siapa yang memimpin partai ini? republik = جمهورية، وmenteri = وزير."
      ar: "«يقود» memimpin: Siapa yang memimpin partai ini? أما republik فجمهورية، وmenteri وزير."
      en: "\"Leads\" is memimpin. republik is a republic and menteri a minister."
  - id: e08
    type: translate
    direction: from_target
    source_text: Hatta juga pernah menjadi perdana menteri.
    answers_meaning:
      ar_eg: [حتا كمان كان رئيس وزرا قبل كده, حتا برضه بقى رئيس وزرا في وقت]
      ar: [كان حتا أيضًا رئيسًا للوزراء من قبل, شغل حتا أيضًا منصب رئيس الوزراء]
      en: [Hatta was also once prime minister, Hatta also served as prime minister]
    words: [menteri]
  - id: e09
    type: speaking
    text: Pemimpin yang baik mendengarkan warganya.
    meaning:
      ar_eg: القائد الكويس بيسمع للشعب.
      ar: القائد الجيد يستمع إلى الشعب.
      en: A good leader listens to the people.
    words: [pemimpin]
  - id: e10
    type: multiple_choice
    question: Bung Hatta adalah wakil ___ pertama Republik Indonesia.
    options: [presiden, politik, memimpin]
    answer: 0
    explain:
      ar_eg: wakil presiden = نايب الرئيس.
      ar: wakil presiden = نائب الرئيس.
      en: wakil presiden = vice-president.
    words: [presiden, politik, memimpin, republik]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, dua orang di foto ini siapa?
      ar_eg: مين الاتنين اللي في الصورة دي؟
      ar: من الرجلان في هذه الصورة؟
      en: Who are the two men in this photo?
    - speaker: Mas Rizal
      text: Soekarno sama Hatta, pemimpin Indonesia.
      ar_eg: سوكارنو وحتّا، قادة إندونيسيا.
      ar: سوكارنو وحتّا، قائدا إندونيسيا.
      en: Soekarno and Hatta, Indonesia's leaders.
    - speaker: Mohamed
      text: Yang kiri presiden pertama, kan? Terus Hatta?
      ar_eg: اللي على الشمال ده أول رئيس، صح؟ وحتّا؟
      ar: الذي على اليسار هو أول رئيس، أليس كذلك؟ وحتّا؟
      en: The one on the left was the first president, right? And Hatta?
    - speaker: Mas Rizal
      text: Wakil presiden. Dia juga pernah jadi perdana menteri.
      ar_eg: نايب الرئيس. وكمان كان رئيس وزرا فترة.
      ar: نائب الرئيس. وكان أيضًا رئيسًا للوزراء فترة.
      en: Vice-president. He was also prime minister for a while.
    - speaker: Mohamed
      text: Di Mesir, Gamal Abdel Nasser juga pemimpin yang terkenal banget.
      ar_eg: في مصر، جمال عبد الناصر كمان زعيم مشهور.
      ar: وفي مصر، جمال عبد الناصر أيضًا زعيم مشهور.
      en: In Egypt, Gamal Abdel Nasser is a famous leader too.
