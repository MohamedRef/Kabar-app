schema: kabar.lesson/v1
id: bipa1.u06.l10
language: id
title: Kuliah di kampus
can_do:
  ar_eg: 'تتكلم عن الجامعة: المحاضرات والفصل والامتحان والإجابة والقاموس.'
  ar: 'أن تتحدث عن الجامعة: المحاضرات والفصل والامتحان والإجابة والقاموس.'
  en: 'Talk about university: lectures, class, exams, answers and the dictionary.'
slides:
  - title: Di kampus
    body:
      ar_eg: |
        kuliah = يدرس في الجامعة أو يحضر محاضرة: «Rina kuliah di UI.»
        kampus = حرم الجامعة، وuniversitas = جامعة.
        kelas = فصل أو حصة، وpelajaran = درس أو مادة.
        ujian = امتحان، وjawaban = إجابة.
        kamus = قاموس، من العربي «قاموس» زي ما هي.
      ar: |
        kuliah = يدرس في الجامعة أو يحضر محاضرة: «Rina kuliah di UI.»
        kampus = الحرم الجامعي، وuniversitas = جامعة.
        kelas = صفّ أو حصّة، وpelajaran = درس أو مادة.
        ujian = امتحان، وjawaban = إجابة.
        kamus = قاموس، من العربية كما هي.
      en: |
        kuliah = study at university, attend lectures: "Rina kuliah di UI."
        kampus = campus, universitas = university.
        kelas = class (room or session), pelajaran = lesson, subject.
        ujian = exam, jawaban = answer.
        kamus = dictionary, straight from Arabic قاموس.
    examples:
      - text: Rina kuliah di Universitas Indonesia.
        ar_eg: رينا بتدرس في جامعة إندونيسيا.
        ar: تدرس رينا في جامعة إندونيسيا.
        en: Rina studies at the University of Indonesia.
      - text: Hari ini ada ujian bahasa Inggris.
        ar_eg: النهارده فيه امتحان إنجليزي.
        ar: اليوم امتحان اللغة الإنجليزية.
        en: There's an English exam today.
      - text: Kamus saya selalu di tas.
        ar_eg: القاموس بتاعي دايمًا في الشنطة.
        ar: قاموسي دائمًا في الحقيبة.
        en: My dictionary is always in my bag.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kelas
        ar_eg: فصل، حصة
        ar: صفّ، حصّة
        en: class
      - text: ujian
        ar_eg: امتحان
        ar: امتحان
        en: exam
      - text: kuliah
        ar_eg: يدرس في الجامعة
        ar: يدرس في الجامعة
        en: study at university
      - text: kampus
        ar_eg: حرم الجامعة
        ar: حرم جامعي
        en: campus
    words: [kelas, ujian, kuliah, kampus]
  - id: e02
    type: match_pairs
    pairs:
      - text: universitas
        ar_eg: جامعة
        ar: جامعة
        en: university
      - text: pelajaran
        ar_eg: درس، مادة
        ar: درس، مادة
        en: lesson
      - text: jawaban
        ar_eg: إجابة
        ar: إجابة
        en: answer
      - text: kamus
        ar_eg: قاموس
        ar: قاموس
        en: dictionary
    words: [universitas, pelajaran, jawaban, kamus]
  - id: e03
    type: listen
    text: Besok ada ujian. Saya belajar di kampus.
    question:
      ar_eg: بكرة فيه إيه؟
      ar: ماذا هناك غدًا؟
      en: What's on tomorrow?
    options: [امتحان, حفلة, إجازة]
    answer: 0
    meaning:
      ar_eg: بكرة فيه امتحان. أنا بذاكر في الجامعة.
      ar: غدًا امتحان، وأنا أذاكر في الحرم الجامعي.
      en: There's an exam tomorrow. I'm studying on campus.
    words: [ujian, kampus]
  - id: e04
    type: fill_blank
    sentence: Rina ___ di Universitas Indonesia.
    meaning:
      ar_eg: رينا ___ في جامعة إندونيسيا.
      ar: رينا ___ في جامعة إندونيسيا.
      en: Rina ___ at the University of Indonesia.
    options: [kuliah, kamus, kelas]
    answers: [kuliah]
    words: [kuliah, universitas]
    explain:
      ar_eg: kuliah = بتدرس في الجامعة (فعل). kamus = قاموس، وkelas = فصل.
      ar: kuliah = تدرس في الجامعة. kamus قاموس وkelas فصل.
      en: kuliah = study at university.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تعرف معنى كلمة جديدة. تستخدم إيه؟
      ar: تريد معرفة معنى كلمة جديدة. ماذا تستعمل؟
      en: You want the meaning of a new word. What do you use?
    options: [kamus, ujian, kampus]
    answer: 0
    explain:
      ar_eg: kamus = قاموس. ujian امتحان وkampus حرم الجامعة.
      ar: kamus قاموس، أما ujian فامتحان وkampus الحرم الجامعي.
      en: kamus = dictionary; ujian is an exam and kampus a campus.
    words: [kamus, ujian, kampus]
  - id: e06
    type: fill_blank
    sentence: Ada dua puluh mahasiswa di ___ ini.
    meaning:
      ar_eg: فيه ٢٠ طالب في ___ ده.
      ar: في هذا ___ عشرون طالبًا.
      en: There are twenty students in this ___.
    options: [kelas, jawaban, pelajaran]
    answers: [kelas]
    words: [kelas, pelajaran]
    explain:
      ar_eg: الطلبة في kelas = فصل. jawaban = إجابة، وpelajaran = درس.
      ar: الطلاب في kelas أي الفصل.
      en: Students sit in a kelas (class).
  - id: e07
    type: build_sentence
    source:
      ar_eg: إجابتك إيه؟
      ar: ما إجابتك؟
      en: What's your answer?
    answer: Apa jawaban kamu?
    distractors: [kelas, kamus]
    words: [jawaban]
    explain:
      ar_eg: Apa (إيه) + jawaban kamu (إجابتك)؟ kelas وkamus زيادة.
      ar: Apa jawaban kamu؟ kelas وkamus زائدتان.
      en: Apa + jawaban kamu? kelas and kamus are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Pelajaran di kelas hari ini sudah selesai.
    answers_meaning:
      ar_eg: [درس النهارده في الفصل خلص, حصة النهارده خلصت]
      ar: [انتهى درس اليوم في الصفّ, انتهت حصّة اليوم]
      en: ['Today''s lesson in class is over', 'Today''s class lesson has finished', 'Today''s lesson is finished']
    words: [pelajaran, kelas]
  - id: e09
    type: speaking
    text: Saya mau kuliah di universitas ini.
    meaning:
      ar_eg: عايز أدرس في الجامعة دي.
      ar: أريد أن أدرس في هذه الجامعة.
      en: I want to study at this university.
    words: [kuliah, universitas]
  - id: e10
    type: multiple_choice
    question: Ujian sudah selesai! ___ saya bagus.
    options: [Jawaban, Kamus, Kampus]
    answer: 0
    explain:
      ar_eg: 'بعد الامتحان بنتكلم عن الإجابات: jawaban.'
      ar: 'بعد الامتحان نتحدّث عن الإجابات: jawaban.'
      en: 'After an exam you talk about your answers: jawaban.'
    words: [ujian, jawaban, kamus, kampus]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, ini kampusku!
      ar_eg: يا محمد، دي جامعتي!
      ar: يا محمد، هذا حرم جامعتي!
      en: Mohamed, this is my campus!
    - speaker: Mohamed
      text: Besar! Kamu kuliah di universitas ini?
      ar_eg: كبيرة! إنتي بتدرسي في الجامعة دي؟
      ar: كبير! هل تدرسين في هذه الجامعة؟
      en: It's big! You study at this university?
    - speaker: Rina
      text: Ya. Hari ini ada ujian bahasa Arab!
      ar_eg: أيوه. والنهارده عندي امتحان عربي!
      ar: نعم، واليوم امتحان العربية!
      en: Yes. There's an Arabic exam today!
    - speaker: Mohamed
      text: Bahasa Arab? Ini kamusku.
      ar_eg: عربي؟ خدي القاموس بتاعي.
      ar: العربية؟ هذا قاموسي.
      en: Arabic? Here's my dictionary.
    - speaker: Rina
      text: Makasih! Tapi di kelas nggak boleh memakai kamus.
      ar_eg: شكرًا! بس ممنوع القاموس في الفصل.
      ar: شكرًا! لكن القاموس ممنوع في الصفّ.
      en: Thanks! But dictionaries aren't allowed in class.
    - speaker: Mohamed
      text: Oh, gitu. Sampai jumpa, Rina!
      ar_eg: آه، كده. أشوفك بعدين يا رينا!
      ar: آه، فهمت. إلى اللقاء يا رينا!
      en: Oh, I see. See you later, Rina!
