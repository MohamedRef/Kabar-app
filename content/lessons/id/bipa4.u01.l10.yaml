schema: kabar.lesson/v1
id: bipa4.u01.l10
language: id
title: Pesan dari Kak Nurul
can_do:
  ar_eg: تفهم رسالة من صاحبك عن يوم شغل صعب وتحكي اللي حصل بالغلط.
  ar: أن تفهم رسالة شخصية عن يوم عمل صعب وتروي ما حدث دون قصد.
  en: Read a friend's message about a hard day at work and retell what went wrong.
slides:
  - title: Pesan WhatsApp
    body:
      ar_eg: |
        Nurul، الممرضة صاحبة Mohamed، بعتتله رسالة الصبح. اقراها بالراحة.
        خد بالك من ter- (حاجة حصلت من غير قصد) و ke-…-an (حاجة وحشة حصلتلك).
      ar: |
        أرسلت Nurul، الممرضة وصديقة Mohamed، رسالة إليه صباحًا. اقرأها بتمهّل.
        لاحظ ter- (ما حدث دون قصد) و ke-…-an (ما أصابك من أمر سيئ).
      en: |
        Nurul, the nurse who is Mohamed's friend, sent him a message this morning. Read it slowly.
        Notice ter- (something that happened by accident) and ke-…-an (something bad that happened to you).
    examples:
      - text: Mohamed, maaf, tadi pagi saya tidak datang ke Pantai Losari. Semalam saya lembur di rumah sakit.
        ar_eg: يا Mohamed، معلش، الصبح ماجيتش شاطئ لوساري. امبارح بالليل كنت شغالة أوفرتايم في المستشفى.
        ar: يا Mohamed، عذرًا، لم آتِ صباح اليوم إلى شاطئ لوساري. فقد عملت ساعات إضافية في المستشفى ليلة أمس.
        en: Mohamed, sorry, I didn't come to Losari Beach this morning. Last night I worked overtime at the hospital.
      - text: Saya tertidur di pete-pete dan baru bangun di terminal. Payung saya tertinggal, jadi saya kehujanan.
        ar_eg: نمت في الميكروباص من غير ما أحس وماصحيتش غير في الموقف. والشمسية اتنسيت، فالمطرة نزلت عليّا.
        ar: غلبني النوم في الحافلة الصغيرة ولم أستيقظ إلا في المحطة. ونسيت مظلتي، فأصابني المطر.
        en: I dozed off on the pete-pete and only woke up at the terminal. I'd left my umbrella behind, so I got caught in the rain.
      - text: Profesi perawat memang membutuhkan kesabaran. Besok sore kita ke Losari, ya?
        ar_eg: مهنة التمريض فعلًا محتاجة صبر. نروح لوساري بكرة العصر؟
        ar: مهنة التمريض تحتاج فعلًا إلى الصبر. هل نذهب إلى لوساري غدًا عصرًا؟
        en: Nursing really does take patience. Shall we go to Losari tomorrow afternoon?
exercises:
  - id: e01
    type: listen
    text: Saya tertidur di pete-pete dan baru bangun di terminal.
    options:
      - Saya tertinggal di pete-pete dan baru bangun di terminal.
      - Saya tertidur di pete-pete dan baru bangun di terminal.
      - Saya tertidur di pete-pete dan baru pulang ke terminal.
    answer: 1
    meaning:
      ar_eg: نمت في الميكروباص من غير ما أحس وماصحيتش غير في الموقف.
      ar: غلبني النوم في الحافلة الصغيرة ولم أستيقظ إلا في المحطة.
      en: I dozed off on the pete-pete and only woke up at the terminal.
    words: [tertidur]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: ليه Nurul ماجاتش لوساري الصبح؟
      ar: لماذا لم تأتِ Nurul إلى لوساري صباحًا؟
      en: Why didn't Nurul come to Losari this morning?
    options:
      - Karena dia kecopetan di pete-pete.
      - Karena dia bangun kesiangan di rumah.
      - Karena semalam dia lembur di rumah sakit.
    answer: 2
    explain:
      ar_eg: هي كاتبة «Semalam saya lembur di rumah sakit» يعني كانت شغالة أوفرتايم، فتعبت ونامت.
      ar: كتبت «Semalam saya lembur di rumah sakit»، أي عملت ساعات إضافية فتعبت ونامت.
      en: "She wrote \"Semalam saya lembur di rumah sakit\": she worked overtime, got tired and fell asleep."
    words: [lembur]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: ليه Nurul اتبلّت من المطرة؟
      ar: لماذا أصاب المطرُ Nurul؟
      en: Why did Nurul get caught in the rain?
    options:
      - Karena payungnya tertinggal.
      - Karena dia tertidur di pantai.
      - Karena pete-pete-nya rusak.
    answer: 0
    explain:
      ar_eg: «Payung saya tertinggal, jadi saya kehujanan» = الشمسية اتنسيت، فالمطرة جت عليها.
      ar: «Payung saya tertinggal, jadi saya kehujanan» أي نسيت المظلة فأصابها المطر.
      en: "“Payung saya tertinggal, jadi saya kehujanan”: the umbrella got left behind, so the rain caught her."
    words: [tertinggal, kehujanan]
  - id: e04
    type: match_pairs
    pairs:
      - text: tertidur
        ar_eg: نام من غير ما يحس
        ar: غلبه النوم
        en: doze off
      - text: tertinggal
        ar_eg: اتنسى / فضل ورا
        ar: تُرك سهوًا
        en: be left behind
      - text: kehujanan
        ar_eg: المطرة نزلت عليه
        ar: أصابه المطر
        en: get caught in the rain
      - text: lembur
        ar_eg: يشتغل أوفرتايم
        ar: يعمل ساعات إضافية
        en: work overtime
      - text: kesabaran
        ar_eg: صبر
        ar: صبر
        en: patience
    words: [tertidur, tertinggal, kehujanan, lembur, kesabaran]
  - id: e05
    type: listen
    text: Besok sore kita ke Losari, ya?
    question:
      ar_eg: Nurul عايزة تروح لوساري إمتى؟
      ar: متى تريد Nurul الذهاب إلى لوساري؟
      en: When does Nurul want to go to Losari?
    options: [Tadi pagi, Besok sore, Malam ini]
    answer: 1
    meaning:
      ar_eg: نروح لوساري بكرة العصر؟
      ar: هل نذهب إلى لوساري غدًا عصرًا؟
      en: Shall we go to Losari tomorrow afternoon?
  - id: e06
    type: fill_blank
    sentence: Karena payung saya ___, saya kehujanan.
    meaning:
      ar_eg: عشان الشمسية اتنسيت، المطرة نزلت عليّا.
      ar: لأنني نسيت مظلتي، أصابني المطر.
      en: Because I'd left my umbrella behind, I got caught in the rain.
    options: [tertutup, tertinggal, terletak]
    answers: [tertinggal]
    words: [tertinggal, kehujanan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الميكروباص فاتني عشان صحيت متأخر.
      ar: فاتتني الحافلة الصغيرة لأنني استيقظت متأخرًا.
      en: I missed the pete-pete because I overslept.
    answer: Saya ketinggalan pete-pete karena bangun kesiangan.
    alternatives:
      - Karena bangun kesiangan, saya ketinggalan pete-pete.
    distractors: [tertinggal, tertidur]
    explain:
      ar_eg: ketinggalan + مواصلة = فاتتك. kesiangan = صحيت متأخر (مش بمزاجك).
      ar: ketinggalan مع وسيلة نقل = فاتتك. kesiangan = استيقظت متأخرًا دون قصد.
      en: ketinggalan + a vehicle = you missed it. kesiangan = you overslept.
    words: [kesiangan]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: معلش، الموبايل بتاعي اتنسى في المستشفى.
      ar: عذرًا، نسيت هاتفي في المستشفى.
      en: Sorry, my phone got left at the hospital.
    answers:
      - Maaf, HP saya tertinggal di rumah sakit.
      - Maaf, ponsel saya tertinggal di rumah sakit.
      - Maaf, HP-ku tertinggal di rumah sakit.
      - Maaf, telepon saya tertinggal di rumah sakit.
      - Maaf, HP saya ketinggalan di rumah sakit.
    words: [tertinggal]
  - id: e09
    type: dictation
    text: Semalam saya lembur di rumah sakit.
    meaning:
      ar_eg: امبارح بالليل كنت شغالة أوفرتايم في المستشفى.
      ar: عملت ساعات إضافية في المستشفى ليلة أمس.
      en: Last night I worked overtime at the hospital.
    words: [lembur]
  - id: e10
    type: match_pairs
    pairs:
      - text: mendaftar
        ar_eg: يقدّم / يسجّل
        ar: يتقدّم / يسجّل
        en: to apply, sign up
      - text: pengawas
        ar_eg: مشرف
        ar: مشرف
        en: supervisor
      - text: skenario
        ar_eg: سيناريو
        ar: سيناريو
        en: script
      - text: pemula
        ar_eg: مبتدئ
        ar: مبتدئ
        en: beginner
      - text: buruh
        ar_eg: عامل
        ar: عامل
        en: labourer
      - text: karir
        ar_eg: مشوار شغل
        ar: مسيرة مهنية
        en: career
    words: [mendaftar, pengawas, skenario, pemula, buruh, karir]
dialogue:
  title: Telepon keesokan harinya
  lines:
    - speaker: Mohamed
      text: Kak Nurul, saya sudah baca pesanmu. Kakak tidak apa-apa?
      ar_eg: يا Nurul، قريت رسالتك. إنتي كويسة؟
      ar: يا Nurul، قرأت رسالتك. هل أنتِ بخير؟
      en: Nurul, I read your message. Are you okay?
    - speaker: Nurul
      text: Tidak apa-apa, cuma capek. Saya tertidur sampai terminal!
      ar_eg: كويسة، بس تعبانة. نمت لحد الموقف!
      ar: بخير، متعبة فقط. غلبني النوم حتى المحطة!
      en: I'm fine, just tired. I slept all the way to the terminal!
    - speaker: Mohamed
      text: Lalu HP-mu bagaimana?
      ar_eg: وطب الموبايل بتاعك؟
      ar: وماذا عن هاتفك؟
      en: And what about your phone?
    - speaker: Nurul
      text: Untung masih ada di ruang perawat. Teman saya menyimpannya.
      ar_eg: الحمد لله لسه في أوضة الممرضات. زميلتي شالتهولي.
      ar: لحسن الحظ ما زال في غرفة الممرضين. احتفظت به زميلتي.
      en: Luckily it's still in the nurses' room. My colleague kept it for me.
    - speaker: Mohamed
      text: Syukurlah. Jadi besok sore kita jadi ke Losari?
      ar_eg: الحمد لله. يبقى رايحين لوساري بكرة العصر؟
      ar: الحمد لله. إذن هل سنذهب إلى لوساري غدًا عصرًا؟
      en: Thank goodness. So are we still going to Losari tomorrow afternoon?
