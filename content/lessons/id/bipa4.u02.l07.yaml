schema: kabar.lesson/v1
id: bipa4.u02.l07
language: id
title: Komentar dan pujian
can_do:
  ar_eg: 'ترد على تعليقات القرّاء: تشكر على المدح وتصحّح الغلط وتقترح بديل.'
  ar: 'أن تردّ على تعليقات القرّاء: تشكر على الثناء وتصحّح الخطأ وتقترح بديلًا.'
  en: 'Respond to readers'' comments: thank them for praise, correct a mistake and suggest an alternative.'
slides:
  - title: Kolom komentar
    body:
      ar_eg: |
        komentar = تعليق، pujian = مدح، respon = ردّ أو تفاعل (respon cepat = ردّ سريع).
        keliru = غلطان (informasinya keliru = المعلومة غلط).
        permasalahan = المشكلة بكل جوانبها، perbaikan = تصليح أو تحسين، alternatif = بديل، mengabaikan = يطنّش، يتجاهل.
      ar: |
        komentar = تعليق، pujian = ثناء، respon = ردّ أو استجابة (respon cepat = ردّ سريع).
        keliru = خاطئ (informasinya keliru = المعلومة خاطئة).
        permasalahan = المسألة أو المشكلة، perbaikan = إصلاح أو تحسين، alternatif = بديل، mengabaikan = يتجاهل.
      en: |
        komentar = comment, pujian = praise, respon = response (respon cepat = quick reply).
        keliru = mistaken, wrong (informasinya keliru = the information is wrong).
        permasalahan = problem, issue; perbaikan = repair, improvement; alternatif = alternative; mengabaikan = to ignore.
    examples:
      - text: Terima kasih atas pujian dan komentar Anda.
        ar_eg: شكرًا على مدحك وتعليقك.
        ar: شكرًا على ثنائك وتعليقك.
        en: Thank you for your praise and comment.
      - text: Maaf, angka dalam berita kemarin keliru.
        ar_eg: آسفين، الأرقام في خبر امبارح كانت غلط.
        ar: نعتذر، البيانات في خبر الأمس خاطئة.
        en: Sorry, the figures in yesterday's report were wrong.
      - text: Jangan mengabaikan keluhan pelanggan.
        ar_eg: ما تطنّشش شكاوى الزباين.
        ar: لا تتجاهل شكاوى العملاء.
        en: Don't ignore customers' complaints.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: komentar
        ar_eg: تعليق
        ar: تعليق
        en: comment
      - text: pujian
        ar_eg: مدح
        ar: ثناء
        en: praise
      - text: respon
        ar_eg: رد
        ar: ردّ
        en: response
      - text: keliru
        ar_eg: غلط
        ar: خاطئ
        en: mistaken
    words: [komentar, pujian, respon, keliru]
  - id: e02
    type: match_pairs
    pairs:
      - text: permasalahan
        ar_eg: مشكلة
        ar: مسألة، مشكلة
        en: issue
      - text: perbaikan
        ar_eg: تصليح
        ar: إصلاح
        en: repair, improvement
      - text: alternatif
        ar_eg: بديل
        ar: بديل
        en: alternative
      - text: mengabaikan
        ar_eg: يطنّش
        ar: يتجاهل
        en: to ignore
    words: [permasalahan, perbaikan, alternatif, mengabaikan]
  - id: e03
    type: listen
    text: Jalan ini ditutup untuk perbaikan sampai Jumat.
    question:
      ar_eg: الطريق مقفول ليه؟
      ar: لماذا الطريق مغلق؟
      en: Why is the road closed?
    options: [تصليح, احتجاج, مدح]
    answer: 0
    meaning:
      ar_eg: الطريق ده مقفول للتصليح لحد الجمعة.
      ar: هذا الطريق مغلق للإصلاح حتى الجمعة.
      en: This road is closed for repairs until Friday.
    words: [perbaikan]
  - id: e04
    type: fill_blank
    sentence: Jembatan ditutup. Ada jalan ___ lewat Maros.
    meaning:
      ar_eg: الكوبري مقفول. فيه طريق ___ من ماروس.
      ar: الجسر مغلق. هناك طريق ___ عبر ماروس.
      en: The bridge is closed. There's an ___ route via Maros.
    options: [alternatif, keliru, pujian]
    answers: [alternatif]
    words: [alternatif, keliru, pujian]
    explain:
      ar_eg: jalan alternatif = طريق بديل، والكوبري مقفول. keliru = غلط، وpujian = مدح.
      ar: jalan alternatif = طريق بديل لأن الجسر مغلق. أما keliru فخطأ، وpujian مديح.
      en: jalan alternatif is an alternative route, since the bridge is closed. keliru means mistaken, and pujian is praise.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: 'حد كتب تحت الخبر: «مقال حلو جدًا!» ده إيه؟'
      ar: 'كتب أحدهم تحت الخبر: «مقال رائع!» ما هذا؟'
      en: 'Someone wrote under the story: "Great article!" What is it?'
    options: [pujian, perbaikan, permasalahan]
    answer: 0
    explain:
      ar_eg: pujian = مدح. ده تعليق فيه مدح.
      ar: pujian = ثناء، وهذا تعليق فيه ثناء.
      en: pujian = praise; it's a comment that praises.
    words: [pujian, perbaikan, permasalahan, komentar]
  - id: e06
    type: fill_blank
    sentence: Pemerintah tidak boleh ___ suara rakyat.
    meaning:
      ar_eg: الحكومة ما ينفعش ___ صوت الشعب.
      ar: لا يجوز للحكومة أن ___ صوت الشعب.
      en: The government must not ___ the people's voice.
    options: [mengabaikan, alternatif, respon]
    answers: [mengabaikan]
    words: [mengabaikan, alternatif, respon]
    explain:
      ar_eg: mengabaikan = يتجاهل، وده الفعل اللي الجملة محتاجاه. alternatif = بديل، وrespon = رد، ودول أسماء أو صفات.
      ar: mengabaikan = يتجاهل، وهو الفعل الذي تحتاجه الجملة. أما alternatif فبديل، وrespon رد، وليسا فعلين.
      en: mengabaikan means ignore, the verb the sentence needs. alternatif (alternative) and respon (response) aren't verbs.
  - id: e07
    type: multiple_choice
    question: Terima kasih atas ___ yang cepat dari redaksi.
    options: [keliru, respon, mengabaikan]
    answer: 1
    explain:
      ar_eg: respon = رد. respon yang cepat = رد سريع.
      ar: respon = ردّ، وrespon yang cepat = ردّ سريع.
      en: respon = response; respon yang cepat = a quick reply.
    words: [keliru, respon, mengabaikan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المشكلة دي محتاجة حل بسرعة.
      ar: هذه المشكلة تحتاج إلى حلّ سريع.
      en: This issue needs a solution quickly.
    answer: Permasalahan ini perlu solusi segera.
    distractors: [perbaikan, komentar]
    words: [permasalahan, perbaikan, komentar]
    explain:
      ar_eg: permasalahan = المشكلة، وsolusi segera = حل سريع. perbaikan = تصليح، وkomentar = تعليق، ومش في الجملة.
      ar: permasalahan = المسألة، وsolusi segera = حل عاجل. أما perbaikan فالإصلاح، وkomentar التعليق، وليسا في الجملة.
      en: permasalahan is the issue, and solusi segera a quick solution. perbaikan (repair) and komentar (comment) aren't in the sentence.
  - id: e09
    type: translate
    direction: from_target
    source_text: Komentar pembaca itu keliru, tapi sopan.
    answers_meaning:
      ar_eg: [تعليق القارئ ده غلط، بس مؤدب, تعليق القارئ غلطان بس فيه أدب]
      ar: [تعليق ذلك القارئ خاطئ، لكنه مهذب, تعليق القارئ خاطئ غير أنه مؤدّب]
      en: ['That reader''s comment is wrong, but polite', 'The reader''s comment is mistaken but polite']
    words: [komentar, keliru]
  - id: e10
    type: speaking
    text: Kami menerima pujian dan menyiapkan perbaikan.
    meaning:
      ar_eg: إحنا استقبلنا المدح وبنجهّز التحسينات.
      ar: تلقّينا الثناء ونُعدّ التحسينات.
      en: We received the praise and are preparing improvements.
    words: [pujian, perbaikan, respon, alternatif, permasalahan]
dialogue:
  lines:
    - speaker: Pak Amir
      text: Mohamed, surat pembaca saya udah dimuat. Lihat deh komentarnya!
      ar_eg: يا محمد، رسالتي اتنشرت في الجرنال. بص على التعليقات!
      ar: يا محمد، نُشرت رسالتي في الصحيفة. انظر إلى التعليقات!
      en: Mohamed, my letter to the editor was published. Look at the comments!
    - speaker: Mohamed
      text: Banyak pujian, Pak. Tapi ada yang nulis angkanya keliru.
      ar_eg: فيه مدح كتير يا أستاذ. بس فيه حد بيقول الأرقام غلط.
      ar: فيها ثناء كثير يا سيدي، لكن أحدهم يقول إن البيانات خاطئة.
      en: Lots of praise, sir. But someone says the figures are wrong.
    - speaker: Pak Amir
      text: Iya, saya salah tulis. Saya nggak mau mengabaikan komentar itu.
      ar_eg: أيوه، أنا كتبت غلط. مش عايز أطنّش التعليق ده.
      ar: نعم، أخطأت في الكتابة. ولا أريد أن أتجاهل ذلك التعليق.
      en: Yes, I wrote it wrong. I don't want to ignore that comment.
    - speaker: Mohamed
      text: Ada respon dari pemerintah daerah?
      ar_eg: فيه رد من الحكومة المحلية؟
      ar: هل هناك ردّ من الحكومة المحلية؟
      en: Any response from the local government?
    - speaker: Pak Amir
      text: Ada. Mereka menyiapkan perbaikan jalan dan jalan alternatif.
      ar_eg: أيوه. بيجهّزوا تصليح الطريق وطريق بديل.
      ar: نعم. يُعدّون لإصلاح الطريق وطريق بديل.
      en: Yes. They're preparing road repairs and an alternative route.
