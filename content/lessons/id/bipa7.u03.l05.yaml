language: id
title: Fabel
can_do:
  ar_eg: تقرا حكاية على لسان الحيوانات زي «الكانشيل والتماسيح» وتحكيها.
  ar: أن تقرأ حكاية على ألسنة الحيوان مثل «الكانشيل والتماسيح» وترويها.
  en: Read and retell an animal fable such as "Kancil and the Crocodiles".
slides:
  - title: Kancil yang cerdik
    body:
      ar_eg: |
        الـ fabel حكاية الـ tokoh hewan (الشخصيات فيها حيوانات) بيتكلّموا ويفكّروا زي البني آدمين، زي «كليلة ودمنة» عندنا.
        أشهر بطل في إندونيسيا: الـ kancil (غزال الفار الصغير). صغير وضعيف، بس عنده akal (عقل / حيلة).
        الحكاية: الكانشيل عايز يعدّي النهر، والنهر مليان تماسيح. قالّهم: «الملك عايز يعدّكم. اصطفّوا!» اصطفّوا، ونطّ على ضهورهم واحد واحد لحد ما عدّى.
        الـ tipu daya (الخدعة) دي بتنجّي الضعيف من القوي.
      ar: |
        الـ fabel حكاية تكون فيها الـ tokoh hewan (الشخصيات حيوانات) تتكلّم وتفكّر كالبشر، مثل «كليلة ودمنة».
        وأشهر أبطالها في إندونيسيا الـ kancil (غزال الفأر)، صغير ضعيف لكنّ له akal (عقلًا وحيلة).
        الحكاية: أراد الكانشيل عبور نهر مليء بالتماسيح، فقال لها: «يريد الملك أن يعدّكم، فاصطفّوا!» فاصطفّت، فقفز على ظهورها واحدًا واحدًا حتى عبر.
        وهذه الـ tipu daya (الخدعة) تنجّي الضعيف من القويّ.
      en: |
        A fabel is a tale whose tokoh hewan (animal characters) talk and think like humans, like Kalila and Dimna.
        Indonesia's most famous hero is the kancil (mouse-deer): small and weak, but full of akal (wit, cunning).
        The story: Kancil wants to cross a river full of crocodiles. He tells them, "The king wants to count you. Line up!" They line up, and he hops across their backs one by one.
        That tipu daya (trick) saves the weak from the strong.
    examples:
      - text: Dengan akalnya, Kancil menipu buaya-buaya dan menyeberang sungai.
        ar_eg: بعقله، الكانشيل ضحك على التماسيح وعدّى النهر.
        ar: بحيلته خدع الكانشيل التماسيح وعبر النهر.
        en: With his wits, Kancil tricked the crocodiles and crossed the river.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: fabel
        ar_eg: حكاية على لسان الحيوانات
        ar: حكاية على ألسنة الحيوان
        en: fable
      - text: tokoh hewan
        ar_eg: شخصية حيوان
        ar: شخصية حيوانية
        en: animal character
      - text: akal
        ar_eg: عقل / حيلة
        ar: عقل، حيلة
        en: wit, cunning
      - text: tipu daya
        ar_eg: خدعة
        ar: خديعة
        en: trick, ruse
      - text: kawah
        ar_eg: فوّهة بركان
        ar: فوّهة
        en: crater
    words: [fabel, tokoh hewan, akal, tipu daya, kawah]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كتاب عربي فيه fabel؟
      ar: أيّ كتاب عربيّ فيه fabel؟
      en: Which Arabic book is full of fables?
    options:
      - كليلة ودمنة.
      - ديوان المتنبي.
      - مقدّمة ابن خلدون.
    answer: 0
    words: [fabel]
  - id: e03
    type: listen
    text: Kancil berkata, "Raja ingin menghitung kalian. Berbarislah!"
    question:
      ar_eg: الكانشيل قال للتماسيح إيه؟
      ar: ماذا قال الكانشيل للتماسيح؟
      en: What did Kancil tell the crocodiles?
    options:
      - إنه جعان.
      - إن الملك عايز يعدّهم، فيصطفّوا.
      - إن النهر هينشف.
    answer: 1
    words: [tipu daya]
  - id: e04
    type: fill_blank
    sentence: Kancil kecil dan lemah, tetapi ___ nya sangat panjang.
    meaning:
      ar_eg: 'الكانشيل صغير وضعيف، بس عقله كبير أوي (حرفيًا: طويل).'
      ar: الكانشيل صغير ضعيف، لكنّ حيلته واسعة جدًّا.
      en: Kancil is small and weak, but his wits are very sharp (lit. long).
    options: [akal, fabel, kawah]
    answers: [akal]
    explain:
      ar_eg: «panjang akal» يعني ذكي وعنده حلول، زي «دماغه توزن بلد».
      ar: «panjang akal» تعني واسع الحيلة.
      en: '"panjang akal" means resourceful, quick-witted.'
    words: [akal]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: في الـ fabel، الـ tokoh hewan بيعملوا إيه؟
      ar: ماذا تفعل الـ tokoh hewan في الـ fabel؟
      en: In a fable, what do the animal characters do?
    options:
      - بيفضلوا ساكتين.
      - بيعيشوا في حديقة حيوان.
      - بيتكلّموا ويفكّروا زي البني آدمين.
    answer: 2
    words: [tokoh hewan, fabel]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الخدعة دي نجّت الكانشيل من التماسيح.
      ar: أنقذت هذه الخديعة الكانشيل من التماسيح.
      en: That trick saved Kancil from the crocodiles.
    answer: Tipu daya itu menyelamatkan Kancil dari buaya.
    distractors: [akal, fabel]
    words: [tipu daya]
  - id: e07
    type: translate
    direction: from_target
    source_text: Dalam fabel ini, tokoh hewan yang kecil mengalahkan tokoh hewan yang besar.
    answers_meaning:
      ar_eg:
        - في الحكاية دي، الحيوان الصغير بيغلب الحيوان الكبير.
        - في الـ fabel ده، الشخصية الصغيرة بتهزم الشخصية الكبيرة.
      ar:
        - في هذه الحكاية تغلب الشخصيةُ الحيوانيةُ الصغيرةُ الكبيرةَ.
        - في هذه الخرافة يهزم الحيوان الصغير الحيوان الكبير.
      en:
        - In this fable, the small animal character beats the big one.
        - In this fable, the little animal defeats the big animal.
    words: [fabel, tokoh hewan]
  - id: e08
    type: speaking
    text: Buaya itu kuat, tetapi Kancil menang karena akal dan tipu dayanya.
    meaning:
      ar_eg: التمساح قوي، بس الكانشيل كسب بعقله وخدعته.
      ar: التمساح قويّ، لكنّ الكانشيل فاز بعقله وخديعته.
      en: The crocodile is strong, but Kancil wins with his wits and his trick.
    words: [akal, tipu daya]
  - id: e09
    type: dictation
    text: Kancil adalah tokoh hewan paling terkenal dalam fabel Indonesia.
    meaning:
      ar_eg: الكانشيل أشهر شخصية حيوان في حكايات إندونيسيا.
      ar: الكانشيل أشهر شخصية حيوانية في الحكايات الإندونيسية.
      en: Kancil is the most famous animal character in Indonesian fables.
    words: [tokoh hewan, fabel]
dialogue:
  title: Kancil versi Mama Ruth
  lines:
    - speaker: Mama Ruth
      text: Anak-anak di sini suka fabel Kancil. Tetapi saya suka menggantinya dengan ikan kecil dari laut kami.
      ar_eg: العيال هنا بيحبّوا حكاية الكانشيل. بس أنا بحب أبدّله بسمكة صغيرة من بحرنا.
      ar: يحبّ الأطفال هنا حكاية الكانشيل، لكنّني أحبّ أن أجعله سمكة صغيرة من بحرنا.
      en: Kids here love the Kancil fable. But I like to swap him for a little fish from our sea.
    - speaker: Mohamed
      text: Dan buayanya jadi hiu? Tipu dayanya sama?
      ar_eg: والتماسيح بقت أسماك قرش؟ والخدعة هي هي؟
      ar: والتماسيح صارت أسماك قرش؟ والخديعة نفسها؟
      en: And the crocodiles become sharks? Same trick?
    - speaker: Mama Ruth
      text: Sama. Ikan kecil bilang raja laut mau menghitung hiu. Mereka berbaris, dan ikan itu lewat.
      ar_eg: هي هي. السمكة الصغيرة قالت إن ملك البحر عايز يعدّ القروش. اصطفّوا، وعدّت.
      ar: نفسها. قالت السمكة إنّ ملك البحر يريد عدّ القروش، فاصطفّت فمرّت.
      en: Same. The little fish says the sea king wants to count the sharks. They line up, and it passes.
    - speaker: Mohamed
      text: Tokoh hewannya berubah, tetapi pesannya tetap. Akal lebih kuat dari otot.
      ar_eg: الشخصيات اتغيّرت، بس الرسالة هي هي. العقل أقوى من العضلات.
      ar: 'تغيّرت الشخصيات وبقيت الرسالة: العقل أقوى من العضلات.'
      en: The animal characters change, but the message stays. Wits beat muscle.
