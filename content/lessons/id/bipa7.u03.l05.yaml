    answers_meaning:
      ar_eg:
        - القصة الرمزية دي بترمز لكفاح الناس البسيطة.
        - الحكاية الرمزية دي عن نضال الغلابة.
      ar:
        - ترمز هذه القصّة الرمزية إلى كفاح عامّة الناس.
        - تجسّد هذه القصّة الرمزية نضال البسطاء.
      en:
        - This allegory symbolises the struggle of ordinary people.
        - This allegory stands for the little people's struggle.
    words: [alegori, menyimbolkan]
dialogue:
  title: Apa artinya?
  lines:
    - speaker: Mohamed
      text: Mama, mengapa dongeng penyu itu diceritakan berulang-ulang?
      ar_eg: يا ماما، ليه حدّوتة السلحفاة دي بتتحكي كل شوية؟
      ar: يا ماما، لماذا تُروى حكاية السلحفاة مرّة بعد مرّة؟
      en: Mama, why is the turtle tale told again and again?
    - speaker: Mama Ruth
      text: Karena pesan moralnya penting. Penyu itu menyimbolkan laut yang memberi kita hidup.
      ar_eg: علشان العبرة بتاعتها مهمة. السلحفاة بترمز للبحر اللي بيدّينا عيشتنا.
      ar: لأنّ عبرتها مهمّة، فالسلحفاة ترمز إلى البحر الذي يمنحنا الحياة.
      en: Because its moral matters. The turtle stands for the sea that gives us life.
    - speaker: Mohamed
      text: Jadi ini alegori, dan sasi adalah cara menjalankan pesannya.
      ar_eg: يعني دي قصة رمزية، والـ sasi هي طريقة تطبيق رسالتها.
      ar: إذن هي قصّة رمزية، والـ sasi طريقة لتطبيق رسالتها.
      en: So it's an allegory, and sasi is how its message is put into practice.
    - speaker: Mama Ruth
      text: Pintar! Dongeng dan adat saling menjaga.
      ar_eg: شاطر! الحواديت والعادات بيحموا بعض.
      ar: أحسنت! الحكايات والأعراف تحرس بعضها بعضًا.
      en: Clever! Tales and customs protect each other.
