schema: kabar.lesson/v1
id: bipa7.u03.l05
language: id
title: Pesan tersirat
can_do:
  ar_eg: تفسّر الرسالة المستخبية في حكاية شعبية وتشرح رموزها.
  ar: أن تفسّر الرسالة الضمنية في حكاية شعبية وتشرح رموزها.
  en: Interpret the hidden message of a folk tale and explain its symbols.
slides:
  - title: Penyu sebagai lambang
    grammar: id.figurative.majas
    body:
      ar_eg: |
        حدّوتة مامبري والسلحفاة مش بس حكاية، دي alegori (قصة رمزية):
        - السلحفاة menyimbolkan (بترمز لـ) كرم البحر.
        - إن الأهالي بطّلوا يصطادوا السلاحف = kiasan (كناية / تعبير مجازي) عن احترام الطبيعة.
        - الـ pesan moral (العبرة): خد من البحر على قد حاجتك بس.
        العبرة دي عايشة في الحقيقة: في راجا أمبات فيه عادة اسمها sasi، بيقفلوا فيها الصيد في حتة معيّنة لفترة عشان السمك يرجع.
      ar: |
        حكاية مامبري والسلحفاة ليست حكاية فحسب، بل alegori (قصّة رمزية):
        - السلحفاة menyimbolkan (ترمز إلى) كرم البحر.
        - كفّ الأهالي عن صيد السلاحف kiasan (تعبير مجازي) عن احترام الطبيعة.
        - الـ pesan moral (العبرة): خذ من البحر قدر حاجتك فقط.
        وللعبرة صدى في الواقع: في راجا أمبات عادة تسمّى sasi، يُغلق فيها الصيد في موضع ما مدّةً لتتجدّد الأسماك.
      en: |
        The tale of Mambri and the turtle isn't just a story; it's an alegori (allegory):
        - The turtle menyimbolkan (symbolises) the sea's generosity.
        - The villagers giving up turtle hunting is a kiasan (figure of speech) for respecting nature.
        - The pesan moral (moral): take from the sea only what you need.
        The moral lives on in real life: Raja Ampat has a custom called sasi, which closes fishing in an area for a while so the fish can come back.
