  - id: e08
    type: speaking
    text: Warna putih dalam cerita ini menyimbolkan kejujuran.
    meaning:
      ar_eg: اللون الأبيض في الحكاية دي بيرمز للأمانة.
      ar: يرمز اللون الأبيض في هذه القصّة إلى الصدق.
