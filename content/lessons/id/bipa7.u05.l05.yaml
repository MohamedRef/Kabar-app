dialogue:
  title: Di Benteng Somba Opu
  lines:
    - speaker: Pak Hasan
      text: Di sini dulu benteng Kerajaan Gowa, Mohamed. Nama saya dari sultan itu.
      ar_eg: هنا كانت قلعة مملكة جووا زمان يا محمد. اسمي جاي من السلطان ده.
      ar: هنا كانت قلعة مملكة غووا يا محمد، واسمي مأخوذ من ذلك السلطان.
      en: This was the Gowa kingdom's fort, Mohamed. My name comes from that sultan.
    - speaker: Mohamed
      text: Sultan Hasanuddin! Yang julukannya Ayam Jantan dari Timur, kan?
      ar_eg: السلطان حسن الدين! اللي لقبه ديك الشرق، صح؟
      ar: السلطان حسن الدين! صاحب لقب ديك الشرق، أليس كذلك؟
      en: Sultan Hasanuddin! The one nicknamed Rooster of the East, right?
    - speaker: Pak Hasan
      text: Betul. VOC punya kapal dan sekutu, tapi perlawanan Gowa bertahan bertahun-tahun.
      ar_eg: صح. الـ VOC كان عندها مراكب وحلفا، بس مقاومة جووا صمدت سنين.
      ar: صحيح. كانت للـ VOC سفن وحلفاء، لكنّ مقاومة غووا صمدت سنوات.
      en: Right. The VOC had ships and allies, but Gowa's resistance held out for years.
    - speaker: Mohamed
      text: Musuh pun memberinya julukan. Itu tanda hormat yang besar.
      ar_eg: حتى العدو ادّاله لقب. ده احترام كبير.
      ar: حتى العدوّ منحه لقبًا، وتلك علامة احترام كبير.
      en: Even the enemy gave him a nickname. That's a great mark of respect.
