title: Sultan Hasanuddin
can_do:
  ar_eg: تحكي حكاية السلطان حسن الدين ومقاومته لشركة الهند الشرقية الهولندية.
  ar: أن تروي قصّة السلطان حسن الدين ومقاومته لشركة الهند الشرقية الهولندية.
  en: Tell the story of Sultan Hasanuddin and his resistance to the Dutch East India Company.
slides:
  - title: Ayam Jantan dari Timur
    body:
      ar_eg: |
        السلطان حسن الدين كان سلطان مملكة جووا (Gowa) في ماكاسار من ١٦٥٣ لـ ١٦٦٩.
        - الـ VOC (شركة الهند الشرقية الهولندية) كانت عايزة تحتكر تجارة التوابل.
        - حسن الدين قاد perlawanan (مقاومة) جامدة ضدّها.
        - الهولنديين نفسهم ادّوله julukan (لقب): «de Haantjes van het Oosten» = Ayam Jantan dari Timur (ديك الشرق)، علشان كان شجاع زي الـ ayam jantan (الديك).
        - سنة ١٦٦٧ اضطر يمضي معاهدة بونجايا (Perjanjian Bongaya)، بس الحرب رجعت لحد ما قلعة سومبا أوبو وقعت سنة ١٦٦٩.
        النهارده هو بطل قومي، ومطار ماكاسار على اسمه.
        - في الكلام: tapi = tetapi.
      ar: |
        كان السلطان حسن الدين سلطان مملكة غووا (Gowa) في ماكاسار من ١٦٥٣ إلى ١٦٦٩.
        - أرادت الـ VOC (شركة الهند الشرقية الهولندية) احتكار تجارة التوابل.
        - فقاد حسن الدين perlawanan (مقاومة) شديدة لها.
        - ومنحه الهولنديون أنفسهم julukan (لقبًا): «de Haantjes van het Oosten» أي Ayam Jantan dari Timur (ديك الشرق)، لشجاعته كالـ ayam jantan (الديك).
        - وفي ١٦٦٧ اضطرّ إلى توقيع معاهدة بونغايا (Perjanjian Bongaya)، ثمّ تجدّدت الحرب حتى سقطت قلعة سومبا أوبو سنة ١٦٦٩.
        وهو اليوم بطل وطنيّ، ويحمل مطار ماكاسار اسمه.
        - في الكلام اليومي: tapi = tetapi.
      en: |
        Sultan Hasanuddin ruled the kingdom of Gowa in Makassar from 1653 to 1669.
        - The VOC (Dutch East India Company) wanted a monopoly on the spice trade.
        - Hasanuddin led a fierce perlawanan (resistance) against it.
        - The Dutch themselves gave him a julukan (nickname): "de Haantjes van het Oosten", Ayam Jantan dari Timur (Rooster of the East), for being as brave as an ayam jantan (rooster).
        - In 1667 he was forced to sign the Treaty of Bongaya, but war broke out again until Somba Opu fort fell in 1669.
        Today he is a national hero, and Makassar's airport bears his name.
        - In speech: tapi = tetapi.
    examples:
      - text: Julukan "Ayam Jantan dari Timur" diberikan oleh musuhnya sendiri.
        ar_eg: لقب «ديك الشرق» إدّاهوله أعداؤه نفسهم.
        ar: منحه أعداؤه أنفسهم لقب «ديك الشرق».
        en: The nickname "Rooster of the East" was given by his own enemies.
