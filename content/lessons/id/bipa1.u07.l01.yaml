schema: kabar.lesson/v1
id: bipa1.u07.l01
language: id
title: Saya suka membaca
can_do:
  ar_eg: تقول بتحب إيه، وعايز إيه، وتقدر تعمل إيه.
  ar: أن تقول ما تحب وما تريد وما تستطيع.
  en: Say likes, wants and abilities.
slides:
  - title: Saya mau makan
    body:
      ar_eg: |
        زي المصري بالظبط: «عايز آكل»، مش «عايز أن آكل». الكلمة دي بتيجي قبل الفعل على طول:
        Saya mau makan = عايز آكل.
        مفيش «untuk» ولا «أن» في النص.
      ar: |
        كما في العامية المصرية «عايز آكل»: تأتي هذه الألفاظ قبل الفعل مباشرة بلا «أن»:
        Saya mau makan = أريد أن آكل.
        ولا تُوضع untuk بينهما.
      en: |
        Just like Egyptian «عايز آكل» — the word goes straight before the verb, no "to":
        Saya mau makan = I want to eat.
        Never put untuk in between.
    grammar: id.verb.modal
    examples:
      - text: Saya mau pulang.
        ar_eg: عايز أروّح.
        ar: أريد أن أعود إلى البيت.
        en: I want to go home.
  - title: suka, mau, ingin
    body:
      ar_eg: |
        - suka = بحب (أعمل حاجة): Saya suka membaca = بحب القراية.
        - mau = عايز (عادية): Saya mau minum = عايز أشرب.
        - ingin = نفسي / أتمنى (أرسمي شوية): Saya ingin ke Mekkah = نفسي أروح مكة.
        وhobi = هواية: Hobi saya membaca = هوايتي القراية.
      ar: |
        - suka = يحب أن: Saya suka membaca = أحب القراءة.
        - mau = يريد (عادية): Saya mau minum = أريد أن أشرب.
        - ingin = يرغب / يتمنى (أكثر رسمية): Saya ingin ke Mekkah = أتمنى الذهاب إلى مكة.
        وhobi = هواية: Hobi saya membaca = هوايتي القراءة.
      en: |
        - suka = like (to): Saya suka membaca = I like reading.
        - mau = want (everyday): Saya mau minum = I want a drink.
        - ingin = wish, would like (a bit more formal): Saya ingin ke Mekkah = I'd love to go to Mecca.
        hobi = hobby: Hobi saya membaca = My hobby is reading.
    grammar: id.verb.modal
    examples:
      - text: Saya suka minum teh manis.
        ar_eg: بحب أشرب شاي بسكر.
        ar: أحب شرب الشاي المحلّى.
        en: I like drinking sweet tea.
      - text: Dimas suka bermain bulu tangkis.
        ar_eg: ديماس بيحب يلعب ريشة.
        ar: يحب ديماس لعب الريشة الطائرة.
        en: Dimas likes playing badminton.
  - title: bisa
    body:
      ar_eg: |
        bisa = أقدر / بعرف (قدرة):
        Saya bisa berenang = بعرف أعوم.
        Bisa bahasa Indonesia? = بتعرف إندونيسي؟
        ولو لسه مابتعرفش بس بتتعلم، قول «Belum bisa» = لسه مابعرفش. أحلى من «Tidak bisa»!
      ar: |
        bisa = يستطيع / يُحسن (القدرة):
        Saya bisa berenang = أستطيع السباحة.
        Bisa bahasa Indonesia? = هل تتكلم الإندونيسية؟
        ومن لا يُحسن الشيء بعدُ يقول «Belum bisa» = لا أستطيع بعد، وهي ألطف من «Tidak bisa».
      en: |
        bisa = can, know how to (ability):
        Saya bisa berenang = I can swim.
        Bisa bahasa Indonesia? = Do you speak Indonesian?
        Still learning? Say "Belum bisa" = I can't yet. Much nicer than "Tidak bisa"!
    grammar: id.verb.modal
    examples:
      - text: Maaf, saya tidak bisa datang besok.
        ar_eg: معلش، مش هقدر آجي بكرة.
        ar: عذرًا، لا أستطيع المجيء غدًا.
        en: Sorry, I can't come tomorrow.
  - title: boleh, harus, perlu
    body:
      ar_eg: |
        - boleh = مسموح (إذن). فاكرها من «Boleh saya foto?»
        خلي بالك: bisa = قدرة، boleh = إذن. «ممكن أدخل؟» = Boleh saya masuk?
        - harus = لازم: Saya harus bekerja = لازم أشتغل.
        - perlu = محتاج: Kamu tidak perlu datang = مش محتاج تيجي.
        النفي بـ tidak قبلها: tidak bisa (مقدرش)، tidak boleh (ممنوع)، وفي الكلام العادي tidak usah = مالوش لزوم.
      ar: |
        - boleh = يجوز / مسموح (الإذن)، كما في «Boleh saya foto?»
        وانتبه: bisa للقدرة وboleh للإذن: «هل يمكنني الدخول؟» = Boleh saya masuk?
        - harus = يجب: Saya harus bekerja = يجب أن أعمل.
        - perlu = يحتاج: Kamu tidak perlu datang = لا تحتاج إلى المجيء.
        والنفي بـ tidak قبلها: tidak bisa، tidak boleh (ممنوع)، وفي العامية tidak usah = لا داعي.
      en: |
        - boleh = may (permission) — remember "Boleh saya foto?"
        Careful: bisa = ability, boleh = permission. "May I come in?" = Boleh saya masuk?
        - harus = must: Saya harus bekerja = I must work.
        - perlu = need: Kamu tidak perlu datang = You don't need to come.
        Negate with tidak: tidak bisa (can't), tidak boleh (not allowed); casual tidak usah = no need.
    grammar: id.verb.modal
    examples:
      - text: Di masjid tidak boleh pakai sepatu.
        ar_eg: ممنوع تلبس جزمة في الجامع.
        ar: لا يجوز لبس الأحذية في المسجد.
        en: You may not wear shoes in the mosque.
      - text: Kamu harus coba rendang!
        ar_eg: لازم تجرب الرندانج!
        ar: يجب أن تجرّب الرندانغ!
        en: You must try rendang!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: suka
        ar_eg: بيحب
        ar: يحب
        en: like
      - text: mau
        ar_eg: عايز
        ar: يريد
        en: want
      - text: bisa
        ar_eg: يقدر / بيعرف
        ar: يستطيع
        en: can
      - text: harus
        ar_eg: لازم
        ar: يجب
        en: must
      - text: perlu
        ar_eg: محتاج
        ar: يحتاج
        en: need
    words: [suka, mau, bisa, harus, perlu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح بمعنى «عايز آكل»؟
      ar: أيّ جملة صحيحة بمعنى «أريد أن آكل»؟
      en: Which sentence correctly says "I want to eat"?
    options: ["Saya mau makan.", "Saya mau untuk makan.", "Saya makan mau."]
    answer: 0
    explain:
      ar_eg: الفعل بييجي بعد mau على طول، زي «عايز آكل».
      ar: يأتي الفعل بعد mau مباشرة.
      en: The verb follows mau directly, like «عايز آكل».
    words: [mau]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: واقف على باب مكتب أستاذ بودي. عايز تستأذن تدخل.
      ar: تقف على باب مكتب الأستاذ بودي وتريد أن تستأذن في الدخول.
      en: You're at Pak Budi's office door and want permission to come in.
    options: ["Bisa saya masuk?", "Harus saya masuk?", "Boleh saya masuk?"]
    answer: 2
    explain:
      ar_eg: الإذن = boleh. bisa للقدرة.
      ar: الإذن بـ boleh، وbisa للقدرة.
      en: Permission = boleh; bisa is ability.
    words: [boleh, masuk]
  - id: e04
    type: listen
    text: Saya bisa berenang.
    options: ["Saya suka berenang.", "Saya mau berenang.", "Saya bisa berenang."]
    answer: 2
    words: [bisa, berenang]
  - id: e05
    type: fill_blank
    sentence: Maaf, saya tidak ___ datang besok.
    meaning:
      ar_eg: معلش، مش هقدر آجي بكرة.
      ar: عذرًا، لا أستطيع المجيء غدًا.
      en: Sorry, I can't come tomorrow.
    options: ["bisa", "suka", "boleh"]
    answers: [bisa]
    explain:
      ar_eg: «مقدرش» = tidak bisa. tidak boleh معناها «ممنوع».
      ar: «لا أستطيع» = tidak bisa، أما tidak boleh فـ «ممنوع».
      en: '"Can''t" = tidak bisa; tidak boleh means "not allowed".'
    words: [bisa]
  - id: e06
    type: fill_blank
    sentence: Di masjid tidak ___ pakai sepatu.
    meaning:
      ar_eg: ممنوع تلبس جزمة في الجامع.
      ar: لا يجوز لبس الأحذية في المسجد.
      en: You may not wear shoes in the mosque.
    options: ["perlu", "boleh", "bisa"]
    answers: [boleh]
    words: [boleh, sepatu]
  - id: e07
    type: fill_blank
    sentence: Kamu ___ coba rendang!
    meaning:
      ar_eg: لازم تجرب الرندانج!
      ar: يجب أن تجرّب الرندانغ!
      en: You must try rendang!
    options: ["boleh", "ingin", "harus"]
    answers: [harus]
    words: [harus, coba]
  - id: e08
    type: build_sentence
    source:
