schema: kabar.lesson/v1
id: bipa1.u07.l01
language: id
title: Saya suka membaca
can_do:
  ar_eg: تقول بتحب تعمل إيه ونفسك تعمل إيه.
  ar: أن تقول ما تحب أن تفعله وما تتمنى فعله.
  en: Say what you like and would like to do.
slides:
  - title: Saya mau makan
    body:
      ar_eg: |
        زي المصري بالظبط: «عايز آكل»، مش «عايز أن آكل». الكلمة دي بتيجي قبل الفعل على طول:
        Saya mau makan = عايز آكل.
        مفيش «untuk» ولا «أن» في النص.
      ar: |
        كما في العامية المصرية «عايز آكل»: تأتي هذه الألفاظ قبل الفعل مباشرة بلا «أن»:
        Saya mau makan = أريد أن آكل.
        ولا تُوضع untuk بينهما.
      en: |
        Just like Egyptian «عايز آكل» — the word goes straight before the verb, no "to":
        Saya mau makan = I want to eat.
        Never put untuk in between.
    grammar: id.verb.modal
    examples:
      - text: Saya mau pulang.
        ar_eg: عايز أروّح.
        ar: أريد أن أعود إلى البيت.
        en: I want to go home.
  - title: suka, mau, ingin
    body:
      ar_eg: |
        - suka = بحب (أعمل حاجة): Saya suka membaca = بحب القراية.
        - mau = عايز (عادية): Saya mau minum = عايز أشرب.
        - ingin = نفسي / أتمنى (أرسمي شوية): Saya ingin ke Mekkah = نفسي أروح مكة.
        وhobi = هواية: Hobi saya membaca = هوايتي القراية.
      ar: |
        - suka = يحب أن: Saya suka membaca = أحب القراءة.
        - mau = يريد (عادية): Saya mau minum = أريد أن أشرب.
        - ingin = يرغب / يتمنى (أكثر رسمية): Saya ingin ke Mekkah = أتمنى الذهاب إلى مكة.
        وhobi = هواية: Hobi saya membaca = هوايتي القراءة.
      en: |
        - suka = like (to): Saya suka membaca = I like reading.
        - mau = want (everyday): Saya mau minum = I want a drink.
        - ingin = wish, would like (a bit more formal): Saya ingin ke Mekkah = I'd love to go to Mecca.
        hobi = hobby: Hobi saya membaca = My hobby is reading.
    grammar: id.verb.modal
    examples:
      - text: Saya suka minum teh manis.
        ar_eg: بحب أشرب شاي بسكر.
        ar: أحب شرب الشاي المحلّى.
        en: I like drinking sweet tea.
      - text: Raka suka bermain bulu tangkis.
        ar_eg: راكا بيحب يلعب ريشة.
        ar: يحب راكا لعب الريشة الطائرة.
        en: Raka likes playing badminton.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح بمعنى «عايز آكل»؟
      ar: أيّ جملة صحيحة بمعنى «أريد أن آكل»؟
      en: Which sentence correctly says "I want to eat"?
    options: [Saya mau makan., Saya mau untuk makan., Saya makan mau.]
    answer: 0
    explain:
      ar_eg: الفعل بييجي بعد mau على طول، زي «عايز آكل».
      ar: يأتي الفعل بعد mau مباشرة.
      en: The verb follows mau directly, like «عايز آكل».
    words: [mau]
  - id: e02
    type: build_sentence
    source:
      ar_eg: بحب ألعب ريشة.
      ar: أحب لعب الريشة الطائرة.
      en: I like playing badminton.
    answer: Saya suka bermain bulu tangkis.
    distractors: [harus, sepak]
    words: [suka, bermain, bulu tangkis]
  - id: e03
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بحب القراية.
      ar: أحب القراءة.
      en: I like reading.
    answers: [Saya suka membaca., Saya suka membaca, Aku suka membaca., Aku suka membaca, Saya suka baca., Aku suka baca.]
    words: [suka, membaca]
  - id: e04
    type: dictation
    text: Saya ingin ke Mekkah.
    meaning:
      ar_eg: نفسي أروح مكة.
      ar: أتمنى الذهاب إلى مكة.
      en: I'd love to go to Mecca.
    words: [ingin]
  - id: e05
    type: speaking
    text: Hobi saya bermain sepak bola.
    meaning:
      ar_eg: هوايتي لعب الكورة.
      ar: هوايتي لعب كرة القدم.
      en: My hobby is playing football.
    words: [hobi, sepak bola]
  - id: e06
    type: match_pairs
    pairs:
      - text: suka
        ar_eg: يحب
        ar: يحب
        en: to like
      - text: ingin
        ar_eg: نفسه / يتمنى
        ar: يتمنى / يرغب
        en: to wish, would like
      - text: hobi
        ar_eg: هواية
        ar: هواية
        en: hobby
      - text: sepak bola
        ar_eg: كورة قدم
        ar: كرة القدم
        en: football
      - text: bulu tangkis
        ar_eg: ريشة طايرة
        ar: الريشة الطائرة
        en: badminton
    words: [suka, ingin, hobi, sepak bola, bulu tangkis]
  - id: e07
    type: listen
    text: Saya suka minum teh manis.
    options: [Saya suka minum kopi., Saya suka minum teh manis., Saya ingin minum teh.]
    answer: 1
    meaning:
      ar_eg: بحب أشرب شاي بسكر.
      ar: أحب شرب الشاي المحلّى.
      en: I like drinking sweet tea.
    words: [suka, manis]
dialogue:
  title: Hobimu apa?
  lines:
    - speaker: Raka
      text: Mohamed, hobimu apa?
      ar_eg: محمد، إيه هوايتك؟
      ar: يا محمد، ما هوايتك؟
      en: Mohamed, what's your hobby?
    - speaker: Mohamed
      text: Saya suka membaca dan berenang. Kamu?
      ar_eg: بحب القراية والعوم. وإنت؟
      ar: أحب القراءة والسباحة. وأنت؟
      en: I like reading and swimming. You?
    - speaker: Raka
      text: Saya suka bermain bulu tangkis. Kamu bisa main bulu tangkis?
      ar_eg: أنا بحب ألعب ريشة. إنت بتعرف تلعب ريشة؟
      ar: أحب لعب الريشة الطائرة. هل تجيد لعبها؟
      en: I like playing badminton. Can you play badminton?
    - speaker: Mohamed
      text: Belum bisa. Tapi saya mau belajar!
      ar_eg: لسه مابعرفش. بس عايز أتعلم!
      ar: لا أجيدها بعد، لكني أريد أن أتعلم!
      en: Not yet. But I want to learn!
    - speaker: Raka
      text: Oke! Hari Sabtu kita main, ya!
      ar_eg: تمام! يوم السبت نلعب سوا!
      ar: حسنًا! لنلعب يوم السبت!
      en: OK! Let's play on Saturday!
