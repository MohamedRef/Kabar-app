dialogue:
  title: Hobimu apa?
  lines:
    - speaker: Dimas
      text: Mohamed, hobimu apa?
      ar_eg: محمد، إيه هوايتك؟
      ar: يا محمد، ما هوايتك؟
      en: Mohamed, what's your hobby?
    - speaker: Mohamed
      text: Saya suka membaca dan berenang. Kamu?
      ar_eg: بحب القراية والعوم. وإنت؟
      ar: أحب القراءة والسباحة. وأنت؟
      en: I like reading and swimming. You?
    - speaker: Dimas
      text: Saya suka bermain bulu tangkis. Kamu bisa main bulu tangkis?
      ar_eg: أنا بحب ألعب ريشة. إنت بتعرف تلعب ريشة؟
      ar: أحب لعب الريشة الطائرة. هل تجيد لعبها؟
      en: I like playing badminton. Can you play badminton?
    - speaker: Mohamed
      text: Belum bisa. Tapi saya mau belajar!
      ar_eg: لسه مابعرفش. بس عايز أتعلم!
      ar: لا أجيدها بعد، لكني أريد أن أتعلم!
      en: Not yet. But I want to learn!
    - speaker: Dimas
      text: Oke! Hari Sabtu kita main, ya!
      ar_eg: تمام! يوم السبت نلعب سوا!
      ar: حسنًا! لنلعب يوم السبت!
      en: OK! Let's play on Saturday!
