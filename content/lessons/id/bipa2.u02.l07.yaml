  - id: e03
    type: listen
    text: Kakak saya koki di hotel.
    question:
      ar_eg: أخوه بيشتغل إيه؟
      ar: ما عمل أخيه؟
      en: What does his brother do?
    options: [طباخ, طيار, محامي]
    answer: 0
    meaning:
      ar_eg: أخويا الكبير شيف في أوتيل.
      ar: أخي الأكبر طاهٍ في فندق.
      en: My older brother is a chef at a hotel.
    words: [koki]
  - id: e04
    type: fill_blank
    sentence: Dia terbang setiap hari. Dia ___.
    meaning:
      ar_eg: بيطير كل يوم. هو ___.
      ar: يطير كل يوم، فهو ___.
      en: He flies every day. He's a ___.
    options: [pilot, hakim, aktor]
    answers: [pilot]
    words: [pilot, hakim, aktor]
  - id: e05
    type: multiple_choice
    question: artis
    question_meaning:
      ar_eg: artis في إندونيسيا معناها إيه غالبًا؟
      ar: ما معنى artis في إندونيسيا غالبًا؟
      en: What does artis usually mean in Indonesia?
    options: [نجم مشهور (تلفزيون أو غنا), رسام, طباخ]
    answer: 0
    explain:
      ar_eg: artis = نجم. والرسام pelukis.
      ar: artis نجم مشهور، والرسّام pelukis.
      en: artis = celebrity; a painter is pelukis.
    words: [artis]
  - id: e06
    type: fill_blank
    sentence: ___ itu mengajar di universitas.
    meaning:
      ar_eg: ___ ده بيدرّس في الجامعة.
      ar: ذلك ___ يدرّس في الجامعة.
      en: That ___ teaches at the university.
    options: [Profesor, Tentara, Koki]
    answers: [Profesor]
    words: [profesor, tentara, koki]
  - id: e07
    type: build_sentence
    source:
      ar_eg: المحامي بيتكلم مع القاضي.
      ar: المحامي يتحدّث مع القاضي.
      en: The lawyer is talking to the judge.
    answer: Pengacara berbicara dengan hakim.
    distractors: [pilot, koki]
    words: [pengacara, hakim]
  - id: e08
    type: translate
    direction: from_target
    source_text: Aktor itu juga artis terkenal.
    answers_meaning:
      ar_eg: [الممثل ده كمان نجم مشهور, الممثل ده نجم مشهور كمان]
      ar: [ذلك الممثّل نجم مشهور أيضًا]
      en: [That actor is also a famous celebrity, That actor is a famous star too]
    words: [aktor, artis]
  - id: e09
    type: speaking
    text: Kakek saya tentara, dan paman saya pilot.
    meaning:
      ar_eg: جدي كان جندي، وخالي طيار.
      ar: جدّي جندي، وخالي طيّار.
      en: My grandfather is a soldier, and my uncle is a pilot.
    words: [tentara, pilot]
  - id: e10
    type: multiple_choice
    question: Dia bermain di film. Dia ___.
    options: [aktor, pengacara, profesor]
    answer: 0
    explain:
      ar_eg: اللي بيمثل في الأفلام aktor.
      ar: من يمثّل في الأفلام aktor.
      en: Someone who acts in films is an aktor.
    words: [aktor, pengacara, profesor]
dialogue:
  lines:
    - speaker: Raka
      text: Rina, ini foto keluargamu? Siapa ini?
      ar_eg: يا رينا، دي صورة عيلتك؟ مين ده؟
      ar: يا رينا، أهذه صورة عائلتك؟ من هذا؟
      en: Rina, is this your family photo? Who's this?
    - speaker: Rina
      text: Itu paman saya. Dia pilot.
      ar_eg: ده خالي. طيار.
      ar: هذا خالي، إنه طيّار.
      en: That's my uncle. He's a pilot.
    - speaker: Raka
      text: Hebat! Dan wanita ini?
      ar_eg: جامد! والست دي؟
      ar: رائع! وهذه السيدة؟
      en: Great! And this woman?
    - speaker: Rina
      text: Itu bibi saya. Dia hakim, dan suaminya pengacara.
      ar_eg: دي خالتي. قاضية، وجوزها محامي.
      ar: هذه خالتي، قاضية، وزوجها محامٍ.
      en: That's my aunt. She's a judge, and her husband is a lawyer.
    - speaker: Raka
      text: Keluarga yang pintar!
      ar_eg: عيلة شاطرة!
      ar: يا لها من عائلة ذكية!
      en: What a clever family!
    - speaker: Rina
      text: Dan sepupu saya aktor. Dia artis terkenal!
      ar_eg: وابن خالي ممثل. نجم مشهور!
      ar: وابن خالي ممثّل، نجم مشهور!
      en: And my cousin is an actor. He's a famous star!
