schema: kabar.lesson/v1
id: bipa2.u02.l07
language: id
title: Pengacara dan hakim
can_do:
  ar_eg: 'تسمّي مهن أكتر: المحامي والقاضي والجندي والطيار والطباخ والممثل والأستاذ الجامعي.'
  ar: 'أن تسمّي مهنًا أخرى: المحامي والقاضي والجندي والطيّار والطاهي والممثّل والأستاذ الجامعي.'
  en: 'Name more jobs: lawyer, judge, soldier, pilot, chef, actor and professor.'
slides:
  - title: Pekerjaan lain
    body:
      ar_eg: |
        pengacara = محامي، hakim = قاضي (من العربي «حاكم»)، tentara = جندي أو الجيش.
        pilot = طيار، koki = طباخ أو شيف، profesor = أستاذ جامعة.
        خلي بالك: artis في إندونيسيا = نجم مشهور (ممثل أو مطرب في التلفزيون)، مش «رسام». الرسام pelukis.
        aktor = ممثل.
      ar: |
        pengacara = محامٍ، hakim = قاضٍ (من العربية «حاكم»)، tentara = جندي أو الجيش.
        pilot = طيّار، koki = طاهٍ، profesor = أستاذ جامعي.
        انتبه: artis في إندونيسيا = النجم المشهور (ممثّل أو مغنٍّ على التلفاز)، لا «الرسّام»؛ فالرسّام pelukis.
        aktor = ممثّل.
      en: |
        pengacara = lawyer, hakim = judge (Arabic حاكم), tentara = soldier, army.
        pilot = pilot, koki = cook, chef, profesor = professor.
        Careful: artis in Indonesia means a celebrity (a TV actor or singer), not a painter; a painter is pelukis.
        aktor = actor.
    examples:
      - text: Paman saya pilot. Dia sering terbang ke Kairo.
        ar_eg: خالي طيار. بيطير لمصر كتير.
        ar: خالي طيّار، يطير إلى القاهرة كثيرًا.
        en: My uncle is a pilot. He often flies to Cairo.
      - text: Koki di restoran itu orang Padang.
        ar_eg: الشيف في المطعم ده من بادانج.
        ar: طاهي ذلك المطعم من بادانج.
        en: The chef at that restaurant is from Padang.
      - text: Artis itu terkenal di Indonesia.
        ar_eg: النجم ده مشهور في إندونيسيا.
        ar: ذلك النجم مشهور في إندونيسيا.
        en: That celebrity is famous in Indonesia.
