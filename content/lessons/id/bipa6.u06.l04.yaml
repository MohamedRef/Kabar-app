schema: kabar.lesson/v1
id: bipa6.u06.l04
language: id
title: Kartun editorial
can_do:
  ar_eg: تقرا كاريكاتير في جرنال وتشرح الرسالة اللي ورا الضحك.
  ar: أن تقرأ رسمًا كاريكاتيريًّا في صحيفة وتشرح الرسالة وراء الضحكة.
  en: Read a newspaper cartoon and explain the message behind the laugh.
slides:
  - title: Om Pasikom dan kawan-kawan
    body:
      ar_eg: |
        الـ kartun editorial بيعلّق على الأخبار من غير ما يقول الكلام صريح.
        - karikatur = كاريكاتير: رسم بيكبّر الأنف أو البطن أو الكرسي عشان يضحّك وينقد
        - kartunis = رسام الكاريكاتير
        - gelembung kata = البالونة اللي فيها كلام الشخصية
        - menggelitik = بيزغزغ: يضحّكك ويخلّيك تفكر في نفس الوقت
        أشهر شخصية: Om Pasikom في جريدة Kompas، راجل غلبان ببالطو مرقّع، ظهر من سنة ١٩٦٧ بريشة G.M. Sudarta.
        - في الشارع: banget = sekali (أوي).
      ar: |
        يعلّق الـ kartun editorial على الأخبار دون تصريح.
        - karikatur = كاريكاتير: رسم يضخّم الأنف أو البطن أو الكرسي ليُضحك وينتقد
        - kartunis = رسّام الكاريكاتير
        - gelembung kata = الفقاعة التي فيها كلام الشخصية
        - menggelitik = يدغدغ: يُضحكك ويدفعك إلى التفكير معًا
        وأشهر شخصية Om Pasikom في صحيفة Kompas، رجل بسيط بمعطف مرقّع، ظهر منذ ١٩٦٧ بريشة G.M. Sudarta.
        - في كلام الشارع: banget = sekali (جدًّا).
      en: |
        A kartun editorial comments on the news without saying it outright.
        - karikatur = caricature: a drawing that blows up a nose, a belly or a chair to amuse and criticise
        - kartunis = cartoonist
        - gelembung kata = speech bubble
        - menggelitik = tickling: it makes you laugh and think at once
        The best-known figure is Om Pasikom in Kompas, an ordinary man in a patched coat, drawn from 1967 by G.M. Sudarta.
        - On the street: banget = sekali (very).
    examples:
      - text: Dalam karikatur itu, kursi pejabat digambarkan sangat besar.
        ar_eg: في الكاريكاتير ده، كرسي المسؤول مترسوم كبير جدًا.
        ar: رُسم كرسيّ المسؤول في ذلك الكاريكاتير ضخمًا جدًّا.
        en: In that cartoon, the official's chair is drawn enormous.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kartun editorial
        ar_eg: كاريكاتير الجرنال
        ar: كاريكاتير صحفي
        en: editorial cartoon
      - text: karikatur
        ar_eg: كاريكاتير
        ar: كاريكاتير
        en: caricature
      - text: kartunis
        ar_eg: رسام كاريكاتير
        ar: رسّام كاريكاتير
        en: cartoonist
      - text: gelembung kata
        ar_eg: بالونة الكلام
        ar: فقاعة الكلام
        en: speech bubble
      - text: menggelitik
        ar_eg: بيزغزغ
        ar: يدغدغ
        en: tickling, thought-provoking
    words: [kartun editorial, karikatur, kartunis, gelembung kata, menggelitik]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الكاريكاتير بيرسم كرسي المسؤول ضخم؟
      ar: لماذا يرسم الكاريكاتير كرسيّ المسؤول ضخمًا؟
      en: Why does the cartoon draw the official's chair huge?
    options:
      - عشان الكرسي غالي.
      - عشان ينقد حبه للسلطة.
      - عشان الرسام مايعرفش يرسم.
    answer: 1
    explain:
      ar_eg: التكبير في الـ karikatur بيورّي النقد من غير كلام.
      ar: يُظهر التضخيم في الـ karikatur النقد دون كلام.
      en: Exaggeration in a karikatur shows the criticism without words.
    words: [karikatur]
  - id: e03
    type: listen
    text: Kartunis itu sudah menggambar untuk koran yang sama selama empat puluh tahun.
    question:
      ar_eg: الرسام شغال في الجرنال ده بقاله قد إيه؟
      ar: منذ متى يرسم ذلك الرسّام للصحيفة نفسها؟
      en: How long has the cartoonist drawn for the same paper?
    options:
      - أربع سنين.
      - أربعتاشر سنة.
      - أربعين سنة.
    answer: 2
    words: [kartunis]
  - id: e04
    type: fill_blank
    sentence: Kalimat di dalam ___ itu hanya tiga kata, tetapi semua orang tertawa.
    meaning:
      ar_eg: الجملة اللي في البالونة تلات كلمات بس، بس الكل ضحك.
      ar: الجملة داخل الفقاعة ثلاث كلمات فقط، لكنّ الجميع ضحكوا.
      en: The line in the speech bubble is only three words, but everyone laughed.
    options: [gelembung kata, kartunis, karikatur]
    answers: [gelembung kata]
    words: [gelembung kata]
    explain:
      ar_eg: الكلام في الكاريكاتير بيبقى في فقاعة gelembung kata. kartunis = رسام وkarikatur = الرسمة نفسها.
      ar: الكلام في الرسم داخل الفقاعة gelembung kata؛ أمّا kartunis فالرسّام، وkarikatur الرسم نفسه.
      en: The words sit in a speech bubble, gelembung kata. kartunis is the cartoonist, and karikatur the drawing.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «Kartun ini menggelitik.» يعني إيه؟
      ar: ما معنى «Kartun ini menggelitik.»؟
      en: What does "Kartun ini menggelitik." mean?
    options:
      - بيضحّك وبيخلّيك تفكر.
      - بيخوّف الأطفال.
      - ممل ومافيهوش معنى.
    answer: 0
    words: [menggelitik]
    explain:
      ar_eg: "menggelitik = بيزغزغ: بيضحّك وبيخلّيك تفكر. مش مخيف ولا ممل."
      ar: "menggelitik أي يدغدغ: يضحك ويدعو إلى التفكير، لا مخيف ولا مملّ."
      en: "menggelitik means it tickles: funny and thought-provoking. Not scary or dull."
  - id: e06
    type: build_sentence
    source:
      ar_eg: كاريكاتير الجرنال بينقد الحكومة بالضحك.
      ar: ينتقد الكاريكاتير الصحفي الحكومة بالضحك.
      en: The editorial cartoon criticises the government with humour.
    answer: Kartun editorial mengkritik pemerintah dengan humor.
    distractors: [gelembung, kartunis]
    words: [kartun editorial]
    explain:
      ar_eg: «بينتقد بالهزار» = mengkritik … dengan humor. gelembung وkartunis مش في المعنى.
      ar: «ينتقد بالفكاهة» mengkritik … dengan humor؛ أمّا gelembung وkartunis فليستا في المعنى.
      en: "\"Criticises with humour\" is mengkritik … dengan humor. gelembung and kartunis aren't in the meaning."
  - id: e07
    type: translate
    direction: from_target
    source_text: Om Pasikom memakai jas penuh tambalan, simbol rakyat kecil.
    answers_meaning:
      ar_eg:
        - أوم باسيكوم لابس بالطو كله رقع، رمز للناس الغلابة.
        - أوم باسيكوم بالبالطو المرقّع بتاعه رمز للشعب البسيط.
      ar:
        - يرتدي أوم باسيكوم معطفًا مليئًا بالرقع، رمزًا لعامّة الشعب.
        - معطف أوم باسيكوم المرقّع رمز للبسطاء.
      en:
        - Om Pasikom wears a coat full of patches, a symbol of ordinary people.
        - Om Pasikom's patched coat stands for the little people.
    words: [simbol]
  - id: e08
    type: speaking
    text: Karikatur ini lucu, dan kalimat di gelembung katanya menggelitik.
    meaning:
      ar_eg: الكاريكاتير ده بيضحّك، والجملة اللي في البالونة بتخلّيك تفكر.
      ar: هذا الكاريكاتير مضحك، والجملة في فقاعته تدفع إلى التفكير.
      en: This cartoon is funny, and the line in its speech bubble makes you think.
    words: [karikatur, gelembung kata, menggelitik]
  - id: e09
    type: dictation
    text: Setiap Sabtu, kartunis itu membuat kartun editorial baru.
    meaning:
      ar_eg: كل سبت، الرسام ده بيعمل كاريكاتير جديد للجرنال.
      ar: يرسم ذلك الرسّام كاريكاتيرًا صحفيًّا جديدًا كلّ سبت.
      en: Every Saturday, that cartoonist makes a new editorial cartoon.
    words: [kartunis, kartun editorial]
  - id: e10
    type: fill_blank
    sentence: Hidung tokoh dalam ___ itu dibuat panjang sekali.
    meaning:
      ar_eg: مناخير الشخصية في الكاريكاتير ده مترسومة طويلة أوي.
      ar: رُسم أنف الشخصية في ذلك الكاريكاتير طويلًا جدًّا.
      en: The figure's nose in that caricature is drawn very long.
    options: [karikatur, gelembung kata, kartunis]
    answers: [karikatur]
    words: [karikatur]
    explain:
      ar_eg: المناخير الطويلة مبالغة في الكاريكاتير karikatur. gelembung kata = فقاعة الكلام وkartunis = الرسام.
      ar: الأنف الطويل مبالغة في karikatur؛ أمّا gelembung kata ففقاعة الكلام، وkartunis الرسّام.
      en: An exaggerated nose belongs to a karikatur. gelembung kata is a speech bubble, and kartunis the artist.
dialogue:
  title: Koran Minggu di warung kopi
  lines:
    - speaker: Bang Togar
      text: Lihat kartun editorial ini, Mohamed. Apa pendapatmu?
      ar_eg: بص على الكاريكاتير ده يا محمد. رأيك إيه؟
      ar: انظر إلى هذا الكاريكاتير يا محمد. ما رأيك؟
      en: Look at this editorial cartoon, Mohamed. What do you think?
    - speaker: Mohamed
      text: Pejabatnya duduk di kursi raksasa, dan rakyatnya kecil banget.
      ar_eg: المسؤول قاعد على كرسي عملاق، والناس صغيرين أوي.
      ar: يجلس المسؤول على كرسيّ عملاق، والشعب صغير جدًّا.
      en: The official sits on a giant chair, and the people are tiny.
    - speaker: Bang Togar
      text: Betul. Lalu di gelembung kata dia bilang, "Saya dekat dengan rakyat."
      ar_eg: 'مظبوط. وفي البالونة بيقول: «أنا قريب من الشعب».'
      ar: 'صحيح، وفي الفقاعة يقول: «أنا قريب من الشعب».'
      en: Right. And in the speech bubble he says, "I'm close to the people."
    - speaker: Mohamed
      text: Ha! Itu ironi. Kartunisnya pintar, lucu tapi menggelitik.
      ar_eg: ها! دي سخرية. الرسام شاطر، بيضحّك بس بيخلّيك تفكر.
      ar: ها! هذه مفارقة. الرسّام بارع، مضحك لكنه يحرّك التفكير.
      en: Ha! That's irony. The cartoonist is clever, funny but thought-provoking.
