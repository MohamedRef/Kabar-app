schema: kabar.lesson/v1
id: bipa4.u02.l11
language: id
title: Tanggapan pemerintah daerah
can_do:
  ar_eg: تفهم رد الحكومة المحلية على شكوى الأهالي وتقول هيحصل إيه.
  ar: أن تفهم ردّ الحكومة المحلية على شكوى السكان وتذكر ما سيحدث.
  en: Follow the local government's spoken response to a complaint and say what will happen.
slides:
  - title: Pengumuman di balai desa
    body:
      ar_eg: |
        موظف من الحكومة المحلية بيرد على رسايل الأهالي في اجتماع القرية.
        اسمع الأول من غير ما تقرا، وبعدين ارجع للنص.
      ar: |
        يردّ موظف من الحكومة المحلية على رسائل السكان في اجتماع القرية.
        استمع أولًا دون قراءة، ثم عُد إلى النص.
      en: |
        An official from the local government answers the residents' letters at a village meeting.
        Listen first without reading, then come back to the text.
    examples:
      - text: Kami sudah membaca surat pembaca dari warga Desa Salenrang. Terima kasih atas laporannya.
        ar_eg: قرينا رسايل القرّاء اللي بعتها أهالي قرية سالنرانج. شكرًا على البلاغ.
        ar: قرأنا رسائل القرّاء من سكان قرية سالنرانج. شكرًا على البلاغ.
        en: We have read the letters to the editor from Salenrang residents. Thank you for reporting this.
      - text: Minggu depan, jalan desa yang berlubang akan diperbaiki. Selama jalan diperbaiki, truk tambang tidak boleh lewat.
        ar_eg: الأسبوع الجاي، شارع القرية اللي مليان حفر هيتصلّح. وطول ما الشارع بيتصلّح، عربيات المحجر ممنوع تعدّي.
        ar: في الأسبوع القادم سيُصلح طريق القرية المليء بالحفر. وطوال مدة الإصلاح لا يُسمح لشاحنات المحجر بالمرور.
        en: Next week the potholed village road will be repaired. While it's being repaired, quarry trucks may not pass.
      - text: Kami juga akan membersihkan saluran air. Kami mohon warga membantu menjaga kebersihan.
        ar_eg: وكمان هننضّف مجاري المية. وبنرجو من الأهالي يساعدوا يحافظوا على النضافة.
        ar: وسننظّف أيضًا قنوات الصرف. ونرجو من السكان المساعدة في الحفاظ على النظافة.
        en: We will also clean the drains. We ask residents to help keep things clean.
exercises:
  - id: e01
    type: listen
    text: Minggu depan, jalan desa yang berlubang akan diperbaiki.
    question:
      ar_eg: الشارع هيتصلّح إمتى؟
      ar: متى سيُصلح الطريق؟
      en: When will the road be repaired?
    options: [Hari ini, Minggu depan, Bulan depan]
    answer: 1
    meaning:
      ar_eg: الأسبوع الجاي، شارع القرية اللي مليان حفر هيتصلّح.
      ar: في الأسبوع القادم سيُصلح طريق القرية المليء بالحفر.
      en: Next week the potholed village road will be repaired.
    words: [berlubang]
  - id: e02
    type: listen
    text: Selama jalan diperbaiki, truk tambang tidak boleh lewat.
    question:
      ar_eg: إيه اللي هيتغيّر لعربيات المحجر؟
      ar: ما الذي سيتغيّر بالنسبة إلى شاحنات المحجر؟
      en: What changes for the quarry trucks?
    options:
      - Truk tidak boleh lewat selama jalan diperbaiki.
      - Truk hanya boleh lewat pada malam hari.
      - Truk harus berjalan pelan-pelan.
    answer: 0
    meaning:
      ar_eg: طول ما الشارع بيتصلّح، عربيات المحجر ممنوع تعدّي.
      ar: طوال مدة إصلاح الطريق لا يُسمح لشاحنات المحجر بالمرور.
      en: While the road is being repaired, quarry trucks may not pass.
    words: [tambang]
  - id: e03
    type: listen
    text: Kami mohon warga membantu menjaga kebersihan.
    options:
      - Kami mohon warga membantu menjaga keselamatan.
      - Kami mohon warga segera menjaga kebersihan.
      - Kami mohon warga membantu menjaga kebersihan.
    answer: 2
    meaning:
      ar_eg: بنرجو من الأهالي يساعدوا يحافظوا على النضافة.
      ar: نرجو من السكان المساعدة في الحفاظ على النظافة.
      en: We ask residents to help keep things clean.
    words: [warga, membantu]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الموظف بيتكلم النهارده؟ إيه اللي خلّى الحكومة ترد؟
      ar: لماذا يتحدث الموظف اليوم؟ ما الذي دفع الحكومة إلى الرد؟
      en: Why is the official speaking? What made the government respond?
    options:
      - Karena ada kecelakaan di jalan desa.
      - Karena warga menulis surat pembaca.
      - Karena ada kerja bakti minggu ini.
    answer: 1
    explain:
      ar_eg: «Kami sudah membaca surat pembaca dari warga» = قرينا رسايل الأهالي في الجرنال.
      ar: «Kami sudah membaca surat pembaca dari warga» أي قرأنا رسائل السكان في الصحيفة.
      en: "“Kami sudah membaca surat pembaca dari warga”: they read the residents' letters in the paper."
    words: [surat pembaca]
  - id: e05
    type: match_pairs
    pairs:
      - text: tanggapan
        ar_eg: رد
        ar: ردّ / استجابة
        en: response
      - text: berlubang
        ar_eg: مليان حفر
        ar: مليء بالحفر
        en: potholed
      - text: truk tambang
        ar_eg: عربية نقل المحجر
        ar: شاحنة المحجر
        en: quarry truck
      - text: warga
        ar_eg: الأهالي / السكان
        ar: السكان / المواطنون
        en: residents
      - text: surat pembaca
        ar_eg: رسالة قارئ للجرنال
        ar: رسالة قارئ إلى الصحيفة
        en: letter to the editor
    words: [tanggapan, berlubang, tambang, warga, surat pembaca]
  - id: e06
    type: dictation
    text: Jalan desa yang berlubang akan diperbaiki.
    meaning:
      ar_eg: شارع القرية اللي مليان حفر هيتصلّح.
      ar: سيُصلح طريق القرية المليء بالحفر.
      en: The potholed village road will be repaired.
    words: [berlubang]
  - id: e07
    type: fill_blank
    sentence: Pemerintah daerah sudah memberi ___ atas surat pembaca warga.
    meaning:
      ar_eg: الحكومة المحلية ردّت على رسايل الأهالي.
      ar: قدّمت الحكومة المحلية ردًّا على رسائل السكان.
      en: The local government has responded to the residents' letters.
    options: [debu, tanggapan, kecelakaan]
    answers: [tanggapan]
    words: [tanggapan]
    explain:
      ar_eg: memberi tanggapan = يرد. debu = تراب، وkecelakaan = حادثة.
      ar: memberi tanggapan = يردّ. أما debu فالغبار، وkecelakaan حادث.
      en: memberi tanggapan means to respond. debu is dust, and kecelakaan is an accident.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هنصلّح الشارع ده على أحسن وجه.
      ar: سنُصلح هذا الطريق على أفضل وجه.
      en: We will repair this road as well as possible.
    answers:
      - Kami akan memperbaiki jalan ini sebaik-baiknya.
      - Kami akan memperbaiki jalan ini dengan sebaik-baiknya.
      - Jalan ini akan kami perbaiki sebaik-baiknya.
      - Kita akan memperbaiki jalan ini sebaik-baiknya.
    words: [sebaik-baiknya]
  - id: e09
    type: multiple_choice
    question: Warga membantu memperbaiki jalan desa.
    question_meaning:
      ar_eg: الأهالي بيعملوا إيه؟
      ar: ماذا يفعل السكان؟
      en: What are the residents doing?
    options: ['Mereka ikut memperbaiki jalan.', 'Mereka menulis surat pembaca.', 'Mereka menunggu truk tambang.']
    answer: 0
    explain:
      ar_eg: membantu = يساعد. bantu اتعلمناها قبل كده.
      ar: membantu = يساعد، من bantu.
      en: membantu = help (from bantu).
    words: [membantu]
  - id: e10
    type: fill_blank
    sentence: Terima kasih sudah ___ kami, Pak.
    meaning:
      ar_eg: شكرًا إنك ساعدتنا يا أستاذ.
      ar: شكرًا لمساعدتنا يا سيدي.
      en: Thank you for helping us, sir.
    options: [membantu, tanggapan, berlubang]
    answers: [membantu]
    words: [membantu]
    explain:
      ar_eg: "بعد sudah لازم فعل: membantu = يساعد. tanggapan = رد (اسم)، وberlubang = محفّر."
      ar: "بعد sudah يلزم فعل: membantu = يساعد. أما tanggapan فاسم (الرد)، وberlubang محفّر."
      en: "sudah needs a verb: membantu, \"help\". tanggapan (response) is a noun, and berlubang means potholed."
dialogue:
  title: Kabar baik
  lines:
    - speaker: Bu Hasnah
      text: Mohamed, tadi kamu dengar tanggapan pemerintah daerah?
      ar_eg: يا Mohamed، سمعت رد الحكومة المحلية من شوية؟
      ar: يا Mohamed، هل سمعت ردّ الحكومة المحلية قبل قليل؟
      en: Mohamed, did you hear the local government's response just now?
    - speaker: Mohamed
      text: Dengar, Bu. Minggu depan jalan desa akan diperbaiki.
      ar_eg: سمعت يا طنط. الأسبوع الجاي شارع القرية هيتصلّح.
      ar: سمعته يا سيدتي. سيُصلح طريق القرية في الأسبوع القادم.
      en: I did, ma'am. Next week the village road will be repaired.
    - speaker: Bu Hasnah
      text: Alhamdulillah! Ternyata surat pembaca kita dibaca.
      ar_eg: الحمد لله! طلع حد قرا رسالتنا.
      ar: الحمد لله! تبيّن أن رسالتنا قُرئت.
      en: Thank God! So our letter was actually read.
    - speaker: Mohamed
      text: Terus selama jalan diperbaiki, truk tambang nggak boleh lewat.
      ar_eg: وطول ما الشارع بيتصلّح، عربيات المحجر ممنوع تعدّي.
      ar: وطوال مدة إصلاح الطريق لا يُسمح لشاحنات المحجر بالمرور.
      en: And while the road is being repaired, the quarry trucks can't pass.
    - speaker: Bu Hasnah
      text: Bagus. Anak-anak bisa belajar dengan tenang, nggak ada debu dan suara bising.
      ar_eg: حلو. العيال يقدروا يذاكروا من غير تراب ودوشة.
      ar: جميل. يستطيع الأطفال الدراسة بلا غبار ولا ضجيج.
      en: Good. The children can study without dust and noise.
new_words:
  - word: membantu
    pos: verb
    ar_eg: يساعد
    ar: يساعد
    en: to help
review:
  status: draft
  verified: false
