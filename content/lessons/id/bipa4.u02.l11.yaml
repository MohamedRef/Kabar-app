  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options: ["Ada banyak truk-truk di jalan.", "Kerjakan sebaik-baik mungkin.", "Warga desa selalu tolong-menolong."]
    answer: 2
    explain:
      ar_eg: بعد banyak ما تكررش، وما تخلطش sebaik-baiknya مع sebaik mungkin.
      ar: لا تكرار بعد banyak، ولا خلط بين sebaik-baiknya وsebaik mungkin.
      en: No doubling after banyak, and don't mix sebaik-baiknya with sebaik mungkin.
    words: [tolong-menolong]
  - id: e03
    type: fill_blank
    sentence: Pelayanan hotel itu sangat ___. Kamarnya kotor dan AC-nya rusak.
    meaning:
      ar_eg: خدمة الفندق ده ___ خالص. الأوضة وسخة والتكييف بايظ.
      ar: خدمة ذلك الفندق ___ جدًا. الغرفة متّسخة والمكيّف معطّل.
      en: That hotel's service is very ___. The room is dirty and the AC is broken.
    options: [mengecewakan, memuaskan, tegas]
    answers: [mengecewakan]
    words: [mengecewakan, memuaskan, tegas]
  - id: e04
    type: listen
    text: Kendaraan lalu-lalang dan suaranya bising sekali.
    options: ["Kendaraan bolak-balik dan suaranya bising sekali.", "Kendaraan lalu-lalang dan suaranya bising sekali.", "Kendaraan lalu-lalang dan jalannya berdebu sekali."]
    answer: 1
    meaning:
      ar_eg: العربيات رايحة جاية وصوتها مزعج جدًا.
      ar: تغدو السيارات وتروح وصوتها صاخب جدًا.
      en: Vehicles come and go and they're very noisy.
    words: [lalu-lalang, bising]
  - id: e05
