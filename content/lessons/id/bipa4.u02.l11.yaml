dialogue:
  title: Dua pendapat
  lines:
    - speaker: Daeng Rahman
      text: Kenapa sih kalian nulis surat pembaca? Truk kami kan cuma kerja.
      ar_eg: إنتو كتبتوا رسالة قرّاء ليه؟ عربياتنا بتشتغل وبس.
      ar: لماذا كتبتم رسالة إلى الصحيفة؟ شاحناتنا تعمل فقط.
      en: Why did you write to the paper? Our trucks are just doing their job.
    - speaker: Mohamed
      text: Kami nggak melarang truk, Daeng. Tapi jalan desa jadi berlubang dan bahaya buat anak-anak.
      ar_eg: إحنا مش بنمنع العربيات يا داينج. بس طريق القرية بقى مليان حفر وبيعرّض العيال للخطر.
      ar: لسنا نمنع الشاحنات يا داينغ، لكن طريق القرية امتلأ بالحفر وصار خطرًا على الأطفال.
      en: We're not banning the trucks, Daeng. But the village road is full of potholes and it endangers the children.
    - speaker: Daeng Rahman
      text: Terus, maunya warga apa?
      ar_eg: طب، السكان عايزين إيه؟
      ar: وماذا يريد السكان إذن؟
      en: So what do the residents want?
    - speaker: Mohamed
      text: Menurut kami, jalan ini harus diperbaiki sebaik-baiknya, dan truk harus pelan-pelan.
      ar_eg: في رأينا، الطريق لازم يتصلح على أحسن وجه، والعربيات لازم تمشي بالراحة.
      ar: نرى أن يُصلَح الطريق على أحسن وجه، وأن تسير الشاحنات ببطء.
      en: In our view, this road must be repaired properly, and the trucks must slow down.
    - speaker: Daeng Rahman
      text: Ya udah, itu masuk akal. Kita emang harus tolong-menolong.
      ar_eg: ماشي، كلامك معقول. لازم فعلًا نساعد بعض.
      ar: حسنًا، هذا معقول. ينبغي فعلًا أن نتعاون.
      en: All right, that makes sense. We really should help one another.
souvenir:
  id: bipa4.u02.souvenir
  title: Menara Karst Rammang-Rammang
  note:
    ar_eg: في ماروس، أبراج حجر جيري سودا طالعة من وسط غيطان الرز والنهر، ومن أكبر مناطق الكارست في الدنيا. أهل رامانج رامانج وقفوا قدام مشاريع المحاجر عشان يحافظوا عليها، ودلوقتي بيستقبلوا الزوار بالقوارب الصغيرة. وفي إندونيسيا، رسالة القرّاء في الجرنال من زمان صوت الناس العاديين لما يحبوا يشتكوا بأدب ويطالبوا بحقهم.
    ar: في ماروس تنتصب أبراج كلسية داكنة وسط حقول الأرز والنهر، وهي من أوسع مناطق الكارست في العالم. وقد وقف أهل رامّانغ رامّانغ في وجه مشاريع المحاجر حفاظًا عليها، وصاروا اليوم يستقبلون الزوار بالقوارب الصغيرة. وفي إندونيسيا ظلت رسائل القرّاء في الصحف منبرًا قديمًا يرفع فيه الناس شكواهم بأدب ويطالبون بحقوقهم.
    en: In Maros, dark limestone towers rise from the rice fields and the river — one of the largest karst areas in the world. Rammang-Rammang villagers stood up to quarry plans to protect them, and now welcome visitors by small boat. In Indonesia, the newspaper reader's letter has long been where ordinary people complain politely and ask for their rights.
