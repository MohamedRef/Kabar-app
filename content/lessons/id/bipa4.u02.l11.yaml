id: bipa4.u02.l11
language: id
title: Ulangan Unit 2
can_do:
  ar_eg: تدافع عن رأيك في مشكلة عامة بأدب ووضوح.
  ar: أن تدافع عن رأيك في مشكلة عامة بأدب ووضوح.
  en: Defend your view.
slides:
  - title: Empat macam kata ulang
    body:
      ar_eg: |
        مراجعة سريعة للتكرار في الوحدة دي:
        بتغيير الصوت = حركة / تنوع: bolak-balik، lalu-lalang
        متبادل = لبعض: tolong-menolong
        جزئي = كتير ومتنوع: pepohonan، dedaunan
        se-…-nya = على قد ما يمكن: secepat-cepatnya، sebaik-baiknya
      ar: |
        مراجعة سريعة للتكرار في هذه الوحدة:
        مع تغيّر الصوت = حركة أو تنوع: bolak-balik، lalu-lalang
        التبادل: tolong-menolong
        الجزئي = كثرة وتنوع: pepohonan، dedaunan
        se-…-nya = أقصى ما يمكن: secepat-cepatnya، sebaik-baiknya
      en: |
        Quick review of this unit's doubling:
        sound change = movement / variety: bolak-balik, lalu-lalang
        mutual = each other: tolong-menolong
        partial = many and varied: pepohonan, dedaunan
        se-…-nya = as … as possible: secepat-cepatnya, sebaik-baiknya
    grammar: id.reduplication.advanced
    examples:
      - text: Truk tambang bolak-balik di depan pepohonan.
        ar_eg: عربيات المحجر رايحة جاية قدام الأشجار.
        ar: تذهب شاحنات المحجر وتجيء أمام الأشجار.
        en: Quarry trucks go back and forth past the trees.
      - text: Mohon saluran air ini diperbaiki secepat-cepatnya.
        ar_eg: نرجو إن مجرى المية ده يتصلح بأسرع ما يمكن.
        ar: نرجو إصلاح مجرى الماء هذا بأسرع ما يمكن.
        en: Please have this drain repaired as quickly as possible.
