schema: kabar.lesson/v1
id: bipa6.u06.l06
language: id
title: Batas humor
can_do:
  ar_eg: تعرف المواضيع اللي الإندونيسيين بيتجنبوا الهزار فيها، وتهزر من غير ما تجرح حد.
  ar: أن تعرف الموضوعات التي يتجنّب الإندونيسيون المزاح فيها، وتمزح دون أن تجرح أحدًا.
  en: Know which topics Indonesians avoid joking about, and joke without hurting anyone.
slides:
  - title: Lucu tanpa melukai
    body:
      ar_eg: |
        في إندونيسيا، فيه مواضيع حساسة اسمها SARA:
        - SARA = Suku, Agama, Ras, Antargolongan = القبيلة والدين والعرق والجماعات
        - sensitif = حساس
        - menyinggung = يجرح / يضايق حد بكلامه (والشخص يبقى tersinggung)
        - batas = حد. Humor juga punya batas. = الهزار كمان ليه حدود.
        - menertawakan diri sendiri = تضحك على نفسك: أأمن نوع هزار
        كوميديان كتير اتعرضوا لمشاكل قانونية بسبب نكت عن الدين، فالجمهور بقى حساس جدًا للموضوع ده.
      ar: |
        في إندونيسيا موضوعات حسّاسة تُسمّى SARA:
        - SARA = Suku, Agama, Ras, Antargolongan = القبيلة والدين والعرق والفئات
        - sensitif = حسّاس
        - menyinggung = يجرح أحدًا أو يسيء إليه بكلامه (فيصبح tersinggung)
        - batas = حدّ: Humor juga punya batas. = للمزاح أيضًا حدود.
        - menertawakan diri sendiri = أن تضحك على نفسك، وهو أسلم أنواع المزاح
        وقد واجه كوميديون كثيرون مشكلات قانونية بسبب نكات عن الدين، فصار الجمهور شديد الحساسية لهذا.
      en: |
        Indonesia has a set of sensitive topics called SARA:
        - SARA = Suku, Agama, Ras, Antargolongan = ethnicity, religion, race and group
        - sensitif = sensitive
        - menyinggung = to offend someone (who then feels tersinggung)
        - batas = limit. Humor juga punya batas. = Humour has limits too.
        - menertawakan diri sendiri = laughing at yourself, the safest kind of joke
        Several comedians have faced legal trouble over jokes about religion, so audiences are very alert to this.
    examples:
      - text: Komika itu memilih menertawakan diri sendiri supaya tidak menyinggung siapa pun.
        ar_eg: الكوميديان ده اختار يضحك على نفسه عشان مايجرحش حد.
        ar: اختار ذلك الكوميدي أن يضحك على نفسه كي لا يسيء إلى أحد.
        en: That comic chose to laugh at himself so as not to offend anyone.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: SARA
        ar_eg: القبيلة والدين والعرق والجماعات
        ar: القبيلة والدين والعرق والفئات
        en: ethnicity, religion, race, group
      - text: sensitif
        ar_eg: حساس
        ar: حسّاس
        en: sensitive
      - text: menyinggung
        ar_eg: يجرح بكلامه
        ar: يسيء إلى
        en: to offend
      - text: batas
        ar_eg: حد
        ar: حدّ
        en: limit
      - text: menertawakan diri sendiri
        ar_eg: يضحك على نفسه
        ar: يضحك على نفسه
        en: to laugh at oneself
    words: [SARA, sensitif, menyinggung, batas, menertawakan diri sendiri]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي موضوع مش من SARA؟
      ar: أيّ موضوع ليس من SARA؟
      en: Which topic is not part of SARA?
    options: [agama, cuaca, suku]
    answer: 1
    words: [SARA]
  - id: e03
    type: listen
    text: Lelucon tentang agama sangat sensitif, jadi komika itu tidak memakainya.
    question:
      ar_eg: ليه الكوميديان مااستخدمش النكتة؟
      ar: لماذا لم يستعمل الكوميدي النكتة؟
      en: Why didn't the comic use the joke?
    options:
      - عشان قديمة.
      - عشان طويلة أوي.
      - عشان موضوع الدين حساس.
    answer: 2
    words: [sensitif]
  - id: e04
    type: fill_blank
    sentence: Maaf, saya tidak bermaksud ___ Anda.
    meaning:
      ar_eg: آسف، ماكنتش أقصد أضايقك.
      ar: عذرًا، لم أقصد الإساءة إليك.
      en: Sorry, I didn't mean to offend you.
    options: [menyinggung, menghibur, menggelitik]
    answers: [menyinggung]
    words: [menyinggung]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي نكتة أأمن؟
      ar: أيّ نكتة أسلم؟
      en: Which joke is safest?
    options:
      - نكتة عن غلطة عملتها إنت.
      - نكتة عن دين جارك.
      - نكتة عن قبيلة صاحبك.
    answer: 0
    explain:
      ar_eg: menertawakan diri sendiri ماتجرحش حد.
      ar: menertawakan diri sendiri لا يجرح أحدًا.
      en: menertawakan diri sendiri hurts no one.
    words: [menertawakan diri sendiri]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الهزار كمان ليه حدود.
      ar: للمزاح أيضًا حدود.
      en: Humour has limits too.
    answer: Humor juga punya batas.
    distractors: [sensitif, SARA]
    words: [batas]
  - id: e07
    type: translate
    direction: from_target
    source_text: Orang Indonesia biasanya menghindari lelucon tentang SARA.
    answers_meaning:
      ar_eg:
        - الإندونيسيين عادةً بيتجنبوا النكت عن القبيلة والدين والعرق والجماعات.
        - الإندونيسيين غالبًا مابيهزروش في مواضيع SARA.
      ar:
        - يتجنّب الإندونيسيون عادةً النكات عن القبيلة والدين والعرق والفئات.
        - لا يمزح الإندونيسيون غالبًا في موضوعات SARA.
      en:
        - Indonesians usually avoid jokes about ethnicity, religion, race and group.
        - Indonesians generally steer clear of SARA jokes.
    words: [SARA]
  - id: e08
    type: speaking
    text: Saya lebih suka menertawakan diri sendiri supaya tidak menyinggung orang lain.
    meaning:
      ar_eg: أنا أحب أضحك على نفسي عشان ماجرحش غيري.
      ar: أفضّل أن أضحك على نفسي كي لا أسيء إلى غيري.
      en: I'd rather laugh at myself so I don't offend other people.
    words: [menertawakan diri sendiri, menyinggung]
  - id: e09
    type: dictation
    text: Batas antara kritik dan hinaan kadang-kadang sangat tipis.
    meaning:
      ar_eg: الحد بين النقد والإهانة ساعات بيبقى رفيع جدًا.
      ar: الحدّ بين النقد والإهانة رقيق جدًّا أحيانًا.
      en: The line between criticism and insult is sometimes very thin.
    words: [batas]
  - id: e10
    type: fill_blank
    sentence: Topik ini ___, jadi bicaralah dengan hati-hati.
    meaning:
      ar_eg: الموضوع ده حساس، فاتكلم بحذر.
      ar: هذا الموضوع حسّاس، فتكلّم بحذر.
      en: This topic is sensitive, so speak carefully.
    options: [sensitif, konyol, lantang]
    answers: [sensitif]
    words: [sensitif]
dialogue:
  title: Lelucon yang salah
  lines:
    - speaker: Mohamed
      text: Bang, tadi saya bercanda tentang suku teman saya. Dia diam saja.
      ar_eg: يا بانج، من شوية هزرت عن قبيلة صاحبي. سكت خالص.
      ar: يا بانغ، مازحت قبل قليل في قبيلة صديقي، فسكت تمامًا.
      en: Bang, earlier I joked about my friend's ethnic group. He just went quiet.
    - speaker: Bang Togar
      text: Hati-hati, Mohamed. Suku itu bagian dari SARA. Banyak orang tersinggung.
      ar_eg: خد بالك يا محمد. القبيلة من SARA. ناس كتير بتزعل.
      ar: احذر يا محمد، فالقبيلة من SARA، وكثيرون يُستاؤون من ذلك.
      en: Careful, Mohamed. Ethnicity is part of SARA. Lots of people take offence.
    - speaker: Mohamed
      text: Saya tidak bermaksud menyinggung. Sebaiknya saya minta maaf.
      ar_eg: ماكنتش أقصد أجرحه. الأحسن أعتذر.
      ar: لم أقصد الإساءة، والأفضل أن أعتذر.
      en: I didn't mean to offend. I'd better apologise.
    - speaker: Bang Togar
      text: Ya. Lain kali, tertawakan dirimu sendiri saja. Itu paling aman.
      ar_eg: أيوه. المرة الجاية اضحك على نفسك وبس. ده أأمن حاجة.
      ar: نعم، وفي المرّة القادمة اضحك على نفسك، فذلك أسلم.
      en: Yes. Next time, just laugh at yourself. That's safest.
