schema: kabar.lesson/v1
id: bipa4.u09.l02
language: id
title: Taman laut Bunaken
can_do:
  ar_eg: تتكلم عن حماية محمية بحرية وتمويلها بأفعال meN-…-kan.
  ar: أن تتحدث عن حماية محمية بحرية وتمويلها بأفعال meN-…-kan.
  en: Talk about protecting and funding a marine park with meN-…-kan verbs.
slides:
  - title: Menyelamatkan terumbu karang
    body:
      ar_eg: |
        -kan بتخلّي الحاجة «تبقى» كده (سببية):
        bersih (نضيف) → membersihkan (ينضّف)
        selamat (سليم، من العربي «سلامة») → menyelamatkan (ينقذ).
      ar: |
        -kan تجعل الشيء يصير كذلك (سببية):
        bersih (نظيف) → membersihkan (ينظّف)
        selamat (سالم، من العربية «سلامة») → menyelamatkan (ينقذ).
      en: |
        -kan makes something become that way (causative):
        bersih (clean) → membersihkan (to clean)
        selamat (safe, from Arabic «سلامة») → menyelamatkan (to rescue, save).
    grammar: id.confix.men-kan
    examples:
      - text: Para penyelam membersihkan sampah di kawasan Bunaken.
        ar_eg: الغطاسين بينضّفوا الزبالة في منطقة بوناكين.
        ar: ينظّف الغواصون النفايات في منطقة بوناكن.
        en: Divers clean up rubbish in the Bunaken area.
      - text: Kita harus menyelamatkan terumbu karang.
        ar_eg: لازم ننقذ الشعاب المرجانية.
        ar: يجب أن ننقذ الشعاب المرجانية.
        en: We must save the coral reefs.
  - title: Mengumpulkan dana
    body:
      ar_eg: |
        kumpul = يتجمّع → mengumpulkan = يجمع (حاجة): mengumpulkan dana = يجمع فلوس / تمويل.
        taman laut = محمية بحرية (حرفيًا «جنينة بحر»)، وkawasan = منطقة.
      ar: |
        kumpul = يتجمّع → mengumpulkan = يجمع (شيئًا): mengumpulkan dana = يجمع الأموال.
        taman laut = محمية بحرية (حرفيًا «حديقة البحر»)، وkawasan = منطقة.
      en: |
        kumpul = gather → mengumpulkan = collect (something): mengumpulkan dana = raise funds.
        taman laut = marine park (literally "sea garden"); kawasan = area, zone.
    grammar: id.confix.men-kan
    examples:
      - text: Taman laut ini mengumpulkan dana dari biaya masuk penyelam.
        ar_eg: المحمية البحرية دي بتجمع فلوس من رسوم دخول الغطاسين.
        ar: تجمع هذه المحمية البحرية الأموال من رسوم دخول الغواصين.
        en: This marine park raises funds from divers' entrance fees.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: taman laut
        ar_eg: محمية بحرية
        ar: محمية بحرية
        en: marine park
      - text: penyelam
        ar_eg: غطّاس
        ar: غوّاص
        en: diver
      - text: kawasan
        ar_eg: منطقة
        ar: منطقة
        en: area, zone
      - text: dana
        ar_eg: فلوس / تمويل
        ar: أموال، تمويل
        en: funds
      - text: mengumpulkan
        ar_eg: يجمع
        ar: يجمع
        en: to collect
    words: [taman laut, penyelam, kawasan, dana, mengumpulkan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي فعل معناه «ينقذ» (من selamat)؟
      ar: أيّ فعل يعني «ينقذ» (من selamat)؟
      en: Which verb means "to rescue, save" (from selamat)?
    options: [menyelamatkan, menyelamati, keselamatan]
    answer: 0
    explain:
      ar_eg: -kan هنا سببية (يخلّيه سليم). keselamatan اسم = السلامة.
      ar: -kan هنا سببية (يجعله سالمًا)، وkeselamatan اسم بمعنى السلامة.
      en: -kan is causative here (make safe); keselamatan is a noun, "safety".
    words: [menyelamatkan]
  - id: e03
    type: listen
    text: Para penyelam membersihkan sampah di kawasan Bunaken.
    options: ["Para nelayan membersihkan sampah di kawasan Bunaken.", "Para penyelam membuang sampah di kawasan Bunaken.", "Para penyelam membersihkan sampah di kawasan Bunaken."]
    answer: 2
    meaning:
      ar_eg: الغطاسين بينضّفوا الزبالة في منطقة بوناكين.
      ar: ينظّف الغواصون النفايات في منطقة بوناكن.
      en: Divers clean up rubbish in the Bunaken area.
    words: [penyelam, kawasan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «المحمية بتجمع فلوس من الغطاسين»؟
      ar: أيّ جملة تعني «تجمع المحمية الأموال من الغواصين»؟
      en: Which sentence means "The marine park raises funds from divers"?
    options: ["Taman laut mengumpuli dana dari penyelam.", "Taman laut mengumpulkan dana dari penyelam.", "Taman laut berkumpul dana dari penyelam."]
    answer: 1
    explain:
      ar_eg: الحاجة اللي بتتجمع (dana) هي المفعول، فالفعل بـ -kan.
      ar: الشيء المجموع (dana) هو المفعول، فيأتي الفعل بـ -kan.
      en: The thing collected (dana) is the object, so the verb takes -kan.
    words: [mengumpulkan, dana, taman laut]
  - id: e05
    type: fill_blank
    sentence: Kita harus ___ terumbu karang sebelum terlambat.
    meaning:
      ar_eg: لازم ننقذ الشعاب المرجانية قبل فوات الأوان.
      ar: يجب أن ننقذ الشعاب المرجانية قبل فوات الأوان.
      en: We must save the coral reefs before it's too late.
    options: [mengumpulkan, menerapkan, menyelamatkan]
    answers: [menyelamatkan]
    words: [menyelamatkan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الغطاسين بيدفعوا رسوم عشان يدخلوا المحمية البحرية.
      ar: يدفع الغواصون رسومًا لدخول المحمية البحرية.
      en: Divers pay a fee to enter the marine park.
    answer: Penyelam membayar biaya untuk masuk ke taman laut.
    distractors: [dana, kawasan]
    words: [penyelam, taman laut]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الفلوس دي بتتصرف على إنقاذ الشعاب المرجانية.
      ar: تُستخدم هذه الأموال لإنقاذ الشعاب المرجانية.
      en: These funds are used to save the coral reefs.
    answers:
      - Dana ini digunakan untuk menyelamatkan terumbu karang.
      - Dana ini digunakan untuk menyelamatkan terumbu karang
      - Dana ini dipakai untuk menyelamatkan terumbu karang.
      - Dana ini digunakan untuk menyelamatkan terumbu-terumbu karang.
      - Dana tersebut digunakan untuk menyelamatkan terumbu karang.
    words: [dana, menyelamatkan]
  - id: e08
    type: speaking
    text: Kawasan taman laut ini mengumpulkan dana untuk membersihkan pantai.
    meaning:
      ar_eg: منطقة المحمية البحرية دي بتجمع فلوس عشان تنضّف الشط.
      ar: تجمع منطقة المحمية البحرية هذه الأموال لتنظيف الشاطئ.
      en: This marine park area raises funds to clean the beach.
    words: [kawasan, taman laut, mengumpulkan]
dialogue:
  title: Sebelum menyelam
  lines:
    - speaker: Kak Steven
      text: Sebelum menyelam, setiap penyelam membayar biaya masuk taman laut.
      ar_eg: قبل الغطس، كل غطّاس بيدفع رسوم دخول المحمية.
      ar: قبل الغوص يدفع كل غوّاص رسوم دخول المحمية البحرية.
      en: Before diving, every diver pays the marine park entrance fee.
    - speaker: Mohamed
      text: Untuk apa dana itu, Kak?
      ar_eg: والفلوس دي بتروح فين؟
      ar: وفيمَ تُستخدم هذه الأموال؟
      en: What are those funds for?
    - speaker: Kak Steven
      text: Untuk menjaga kawasan ini dan menyelamatkan terumbu karang.
      ar_eg: عشان نحمي المنطقة دي وننقذ الشعاب المرجانية.
      ar: لحماية هذه المنطقة وإنقاذ الشعاب المرجانية.
      en: To look after this area and save the coral reefs.
    - speaker: Mohamed
      text: Bagus sekali. Saya senang membayarnya.
      ar_eg: حلو أوي. أنا مبسوط إني بدفعها.
      ar: رائع جدًا. يسعدني أن أدفعها.
      en: That's great. I'm happy to pay it.
