schema: kabar.lesson/v1
id: bipa7.u06.l10
language: id
title: Hidup sebagai kreator konten
can_do:
  ar_eg: 'تتكلّم عن شغل صانع المحتوى: فلوسه، الإعلانات، وتعبه من النت.'
  ar: 'أن تتحدّث عن عمل صانع المحتوى: دخله وإعلاناته وإرهاقه من الإنترنت.'
  en: 'Talk about a content creator''s work: income, ads and online fatigue.'
slides:
  - title: Di balik layar
    body:
      ar_eg: |
        kreator konten = صانع محتوى. الدخل بييجي من monetisasi (أرباح المشاهدات) ومن konten bersponsor (محتوى مموّل).
        القانون والأخلاق بيقولوا: لازم تكتب إن المحتوى مموّل.
        swafoto = سيلفي (swa = ذاتي). notifikasi = الإشعارات اللي ما بتقفش.
        kolom komentar = خانة التعليقات، أحيانًا لطيفة وأحيانًا قاسية.
        dunia maya = العالم الافتراضي. detoks digital = تبعد عن الموبايل شوية علشان صحتك النفسية.
      ar: |
        kreator konten = صانع المحتوى، ويأتي دخله من monetisasi (أرباح المشاهدات) ومن konten bersponsor.
        وتقتضي الأمانة التصريح بأنّ المحتوى مموّل.
        swafoto = صورة ذاتية (swa = ذاتيّ). notifikasi = الإشعارات التي لا تتوقّف.
        kolom komentar = قسم التعليقات، لطيف أحيانًا وقاسٍ أحيانًا.
        dunia maya = العالم الافتراضي. detoks digital = الابتعاد عن الهاتف مدّة حفاظًا على الصحّة النفسية.
      en: |
        kreator konten = content creator. Income comes from monetisasi (views revenue) and konten bersponsor.
        Honesty requires labelling sponsored content.
        swafoto = selfie (swa = self). notifikasi = the notifications that never stop.
        kolom komentar = the comments section, sometimes kind, sometimes harsh.
        dunia maya = the online world. detoks digital = time away from your phone for your mental health.
    examples:
      - text: Kreator konten itu membuat video tentang kuliner Papua.
        ar_eg: صانعة المحتوى دي بتعمل فيديوهات عن أكل بابوا.
        ar: تصنع صانعة المحتوى تلك مقاطع عن مطبخ بابوا.
        en: That content creator makes videos about Papuan food.
      - text: Video ini konten bersponsor, jadi harus diberi label.
        ar_eg: الفيديو ده مموّل، فلازم يتكتب عليه كده.
        ar: هذا المقطع مموّل فيجب وسمه بذلك.
        en: This video is sponsored, so it must be labelled.
      - text: Saya mematikan notifikasi selama detoks digital.
        ar_eg: قفلت الإشعارات طول فترة الراحة من النت.
        ar: أوقفتُ الإشعارات طوال صيامي الرقمي.
        en: I turned off notifications during my digital detox.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kreator konten
        ar_eg: صانع محتوى
        ar: صانع محتوى
        en: content creator
      - text: monetisasi
        ar_eg: تحقيق أرباح من المحتوى
        ar: تحقيق الدخل
        en: monetisation
      - text: konten bersponsor
        ar_eg: محتوى مموّل / إعلان
        ar: محتوى مموَّل
        en: sponsored content
      - text: swafoto
        ar_eg: سيلفي
        ar: صورة ذاتية
        en: selfie
    words: [kreator konten, monetisasi, konten bersponsor, swafoto]
  - id: e02
    type: match_pairs
    pairs:
      - text: notifikasi
        ar_eg: إشعار / نوتيفيكيشن
        ar: إشعار
        en: notification
      - text: detoks digital
        ar_eg: راحة من الموبايل والنت
        ar: صيام رقمي
        en: digital detox
      - text: kolom komentar
        ar_eg: خانة التعليقات
        ar: قسم التعليقات
        en: comments section
      - text: dunia maya
        ar_eg: العالم الافتراضي
        ar: العالم الافتراضي
        en: cyberspace, the online world
    words: [notifikasi, detoks digital, kolom komentar, dunia maya]
  - id: e03
    type: listen
    text: Kolom komentar videonya penuh pujian dan beberapa hinaan.
    question:
      ar_eg: إيه اللي مليان مدح؟
      ar: ما الممتلئ بالمديح؟
      en: What's full of praise?
    options: [خانة التعليقات, الإشعارات, السيلفي]
    answer: 0
    meaning:
      ar_eg: خانة التعليقات على الفيديو مليانة مدح وشوية شتايم.
      ar: امتلأ قسم التعليقات بالمديح وبعض الإهانات.
      en: His video's comments section is full of praise and a few insults.
    words: [kolom komentar]
  - id: e04
    type: fill_blank
    sentence: Kanal itu belum lolos ___, jadi belum dapat uang dari iklan.
    meaning:
      ar_eg: القناة دي لسه ما اتقبلتش في ___، فلسه ما بتكسبش من الإعلانات.
      ar: لم تجتز القناة شروط ___ بعد، فلا تكسب من الإعلانات.
      en: That channel hasn't qualified for ___ yet, so no ad money.
    options: [monetisasi, swafoto, dunia maya]
    answers: [monetisasi]
    words: [monetisasi, swafoto, dunia maya]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه لازم يكتب إن الفيديو «konten bersponsor»؟
      ar: لماذا يجب وسم الفيديو بأنه «konten bersponsor»؟
      en: Why must a video be labelled 'konten bersponsor'?
    options: [Supaya lebih banyak notifikasi., Supaya penonton tahu bahwa dia dibayar., Supaya swafotonya bagus.]
    answer: 1
    explain:
      ar_eg: 'الأمانة: المشاهد من حقّه يعرف إن فيه فلوس.'
      ar: الأمانة تقتضي أن يعرف المشاهد أنّه مدفوع.
      en: 'Honesty: viewers have a right to know it''s paid.'
    words: [konten bersponsor, notifikasi, swafoto]
  - id: e06
    type: fill_blank
    sentence: Setiap libur, dia melakukan ___ selama tiga hari.
    meaning:
      ar_eg: كل أجازة، بيعمل ___ تلات أيام.
      ar: يقوم في كلّ عطلة بـ ___ لثلاثة أيّام.
      en: Every holiday, she does a three-day ___.
    options: [detoks digital, kolom komentar, kreator konten]
    answers: [detoks digital]
    words: [detoks digital, kolom komentar, kreator konten]
  - id: e07
    type: build_sentence
    source:
      ar_eg: أخدنا سيلفي قدّام راجا أمبات.
      ar: التقطنا صورة ذاتية أمام راجا أمبات.
      en: We took a selfie in front of Raja Ampat.
    answer: Kami membuat swafoto di depan Raja Ampat.
    distractors: [notifikasi, monetisasi]
    words: [swafoto]
  - id: e08
    type: translate
    direction: from_target
    source_text: Di dunia maya, orang lebih berani berkata kasar.
    answers_meaning:
      ar_eg: [في العالم الافتراضي الناس بتتجرّأ تقول كلام وحش أكتر, على النت الناس بتبقى أجرأ في قلّة الأدب]
      ar: [في العالم الافتراضي يجرؤ الناس أكثر على الكلام الفظّ, على الإنترنت يكون الناس أجرأ على الألفاظ القاسية]
      en: ['Online, people are bolder about being rude', In cyberspace people dare to say harsher things]
    words: [dunia maya]
  - id: e09
    type: speaking
    text: Kreator konten harus memberi label pada konten bersponsor.
    meaning:
      ar_eg: صانع المحتوى لازم يكتب إن المحتوى مموّل.
      ar: على صانع المحتوى أن يَسِم المحتوى المموّل.
      en: Content creators must label sponsored content.
    words: [kreator konten, konten bersponsor]
  - id: e10
    type: multiple_choice
    question: Apa yang paling membantu kesehatan mental kreator konten?
    options: ['Detoks digital: mematikan notifikasi dan tidak membaca kolom komentar sepanjang malam.', Membaca semua komentar jam dua pagi., Membuat seratus swafoto sehari demi monetisasi.]
    answer: 0
    explain:
      ar_eg: قفل الإشعارات والبعد عن التعليقات بالليل بيريّح الدماغ.
      ar: إطفاء الإشعارات وترك التعليقات ليلًا يريح النفس.
      en: Silencing notifications and skipping comments at night helps.
    words: [notifikasi, kolom komentar, kreator konten, swafoto, detoks digital, monetisasi]
dialogue:
  lines:
    - speaker: Kak Selvi
      text: Mohamed, kita wawancara Lince, kreator konten dari Biak, sore ini.
      ar_eg: يا محمد، هنعمل مقابلة مع لينسي، صانعة محتوى من بياك، العصر.
      ar: يا محمد، سنحاور لينسي، صانعة المحتوى من بياك، عصر اليوم.
      en: Mohamed, we're interviewing Lince, a content creator from Biak, this afternoon.
    - speaker: Mohamed
      text: Videonya tentang apa, Kak?
      ar_eg: فيديوهاتها عن إيه؟
      ar: عمّ تتحدّث مقاطعها؟
      en: What are her videos about?
    - speaker: Kak Selvi
      text: Masakan Papua. Kanalnya sudah lolos monetisasi.
      ar_eg: الأكل البابوي. وقناتها اتقبلت في الأرباح خلاص.
      ar: عن المطبخ البابوي، وقد اجتازت قناتها شروط تحقيق الدخل.
      en: Papuan cooking. Her channel is already monetised.
    - speaker: Mohamed
      text: Apakah dia juga membuat konten bersponsor?
      ar_eg: بتعمل محتوى مموّل كمان؟
      ar: هل تصنع محتوى مموّلًا أيضًا؟
      en: Does she make sponsored content too?
    - speaker: Kak Selvi
      text: Ya, tapi selalu jujur memberi label. Tanya juga soal kolom komentar yang kasar.
      ar_eg: أيوه، بس دايمًا بتكتب بأمانة إنه مموّل. واسألها كمان عن التعليقات القاسية.
      ar: نعم، لكنها تَسِمه بصدق دائمًا. واسألها أيضًا عن التعليقات القاسية.
      en: Yes, but she always labels it honestly. Ask her about the harsh comments too.
    - speaker: Mohamed
      text: Dan apakah dia pernah melakukan detoks digital.
      ar_eg: وهل عملت راحة من النت قبل كده.
      ar: وهل جرّبت الصيام الرقمي.
      en: And whether she's ever done a digital detox.
