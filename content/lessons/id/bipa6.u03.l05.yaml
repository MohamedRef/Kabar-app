schema: kabar.lesson/v1
id: bipa6.u03.l05
language: id
title: Gelar dan penghulu
can_do:
  ar_eg: تشرح إزاي الراجل المينانجكاباوي بياخد لقبه، وإزاي زعيم العشيرة بيتعيّن.
  ar: أن تشرح كيف ينال الرجل المينانغكاباوي لقبه، وكيف يُنصَّب زعيم العشيرة.
  en: Explain how a Minang man gets his title and how a clan chief is installed.
slides:
  - title: Kecil bernama, besar bergelar
    body:
      ar_eg: |
        مثل مينانجي: Ketek banamo, gadang bagala = وهو صغير ليه اسم، ولما يكبر ويتجوز ياخد لقب.
        - penghulu = زعيم العشيرة (kaum)، ولقبه Datuk
        - datuk = لقب الـ penghulu (وفي الكلام العادي كمان = جد)
        - kemenakan = ابن الأخت أو بنتها. اللقب بيتنقل من الـ mamak لابن أخته، مش لابنه.
        - dilantik = يتعيّن رسميًا
        - kenduri = وليمة كبيرة لكل البلد، بتتعمل لما penghulu جديد يتعيّن
        - في الشارع: manggil = memanggil (ينادي)، aku / -ku = saya (أنا)، udah = sudah (خلاص / بالفعل)، nikah = menikah (يتجوّز)، dapat = mendapat (ياخد / يحصل على).
      ar: |
        مثل مينانغي: Ketek banamo, gadang bagala = يُسمّى صغيرًا، ويُلقَّب كبيرًا حين يتزوّج.
        - penghulu = زعيم العشيرة (kaum)، ولقبه Datuk
        - datuk = لقب الـ penghulu (وفي الكلام العامّ أيضًا = الجدّ)
        - kemenakan = ابن الأخت أو ابنتها؛ فاللقب ينتقل من الـ mamak إلى ابن أخته لا إلى ابنه.
        - dilantik = يُنصَّب رسميًّا
        - kenduri = وليمة كبيرة لأهل البلدة تُقام عند تنصيب penghulu جديد
        - في كلام الشارع: manggil = memanggil (ينادي)، aku / -ku = saya (أنا)، udah = sudah (قد / بالفعل)، nikah = menikah (يتزوّج)، dapat = mendapat (يحصل على).
      en: |
        A Minang saying: Ketek banamo, gadang bagala = small, you have a name; grown and married, you get a title.
        - penghulu = the clan (kaum) chief, titled Datuk
        - datuk = the penghulu's title (in everyday speech also = grandfather)
        - kemenakan = a sister's child. The title passes from the mamak to his sister's son, not his own.
        - dilantik = to be formally installed
        - kenduri = a big feast for the village, held when a new penghulu is installed
        - On the street: manggil = memanggil (to call), aku / -ku = saya (I), udah = sudah (already), nikah = menikah (to marry), dapat = mendapat (to get).
    examples:
      - text: Kemenakan Datuk Rajo itu dilantik menjadi penghulu yang baru.
        ar_eg: ابن أخت داتوك راجو اتعيّن زعيم العشيرة الجديد.
        ar: نُصِّب ابن أخت داتوك راجو زعيمًا جديدًا للعشيرة.
        en: Datuk Rajo's nephew was installed as the new clan chief.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: penghulu
        ar_eg: زعيم العشيرة
        ar: زعيم العشيرة
        en: clan chief
      - text: datuk
        ar_eg: لقب الزعيم
        ar: لقب الزعيم
        en: chief's title
      - text: kemenakan
        ar_eg: ابن الأخت
        ar: ابن الأخت
        en: sister's child
      - text: dilantik
        ar_eg: يتعيّن رسميًا
        ar: يُنصَّب
        en: to be installed
      - text: kenduri
        ar_eg: وليمة كبيرة
        ar: وليمة
        en: communal feast
    words: [penghulu, datuk, kemenakan, dilantik, kenduri]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: لقب الـ penghulu بيروح لمين بعده؟
      ar: إلى من ينتقل لقب الـ penghulu بعده؟
      en: Who inherits the penghulu's title after him?
    options:
      - لابنه الكبير.
      - لابن أخته.
      - لمراته.
    answer: 1
    explain:
      ar_eg: العيلة matrilineal، فاللقب بيفضل في عيلة الأم، ويروح للـ kemenakan.
      ar: العائلة matrilineal، فيبقى اللقب في عشيرة الأمّ وينتقل إلى الـ kemenakan.
      en: The family is matrilineal, so the title stays in the mother's clan and goes to the kemenakan.
    words: [penghulu, kemenakan]
  - id: e03
    type: listen
    text: Seluruh kampung datang ke kenduri pelantikan penghulu baru.
    question:
      ar_eg: البلد كلها جت ليه؟
      ar: لماذا جاءت البلدة كلّها؟
      en: Why did the whole village come?
    options:
      - عشان فرح.
      - عشان السوق.
      - عشان وليمة تعيين الزعيم الجديد.
    answer: 2
    words: [kenduri, penghulu]
  - id: e04
    type: fill_blank
    sentence: Setelah menikah, laki-laki Minang mendapat ___.
    meaning:
      ar_eg: بعد الجواز، الراجل المينانجي بياخد لقب.
      ar: بعد الزواج ينال الرجل المينانغي لقبًا.
      en: After marrying, a Minang man receives a title.
    options: [gelar, kenduri, kemenakan]
    answers: [gelar]
    words: [gelar]
    explain:
      ar_eg: بعد الجواز الراجل بياخد لقب gelar. kenduri = وليمة وkemenakan = ابن الأخت.
      ar: بعد الزواج ينال الرجل لقبًا gelar؛ أمّا kenduri فوليمة، وkemenakan ابن الأخت.
      en: After marrying, a man gets a title, gelar. kenduri is a feast, and kemenakan a nephew.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «Ketek banamo, gadang bagala» معناها إيه؟
      ar: ما معنى «Ketek banamo, gadang bagala»؟
      en: What does "Ketek banamo, gadang bagala" mean?
    options:
      - وهو صغير ليه اسم، ولما يكبر ياخد لقب.
      - الكبير لازم يحترم الصغير.
      - البيت الكبير للصغيرين.
    answer: 0
    words: [penghulu]
    explain:
      ar_eg: "«صغير ليه اسم، كبير ليه لقب»: الراجل بياخد لقب لما يكبر ويتجوز. مش عن الاحترام ولا البيت."
      ar: "«يُسمّى صغيرًا ويُلقَّب كبيرًا»: ينال الرجل لقبًا إذا كبر وتزوّج؛ لا عن الاحترام ولا البيت."
      en: "\"Small, a name; grown, a title\": a man earns a title when he grows up and marries. Not about respect or houses."
  - id: e06
    type: build_sentence
    source:
      ar_eg: ابن أخت الداتوك اتعيّن النهارده.
      ar: نُصِّب ابن أخت الداتوك اليوم.
      en: The Datuk's nephew was installed today.
    answer: Kemenakan Datuk itu dilantik hari ini.
    distractors: [kenduri, mamak]
    words: [kemenakan, datuk, dilantik]
    explain:
      ar_eg: «ابن أخت الداتوك» = Kemenakan Datuk و«اتعيّن» = dilantik. kenduri وmamak مش في المعنى.
      ar: «ابن أخت الداتوك» Kemenakan Datuk و«نُصِّب» dilantik؛ أمّا kenduri وmamak فليستا في المعنى.
      en: "\"The Datuk's nephew\" is Kemenakan Datuk and \"was installed\" is dilantik. kenduri and mamak aren't in the meaning."
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الزعيم الجديد هيتعيّن الأسبوع الجاي.
      ar: سيُنصَّب الزعيم الجديد الأسبوع المقبل.
      en: The new chief will be installed next week.
    answers:
      - Penghulu baru akan dilantik minggu depan.
      - Penghulu yang baru akan dilantik minggu depan.
      - Penghulu baru itu akan dilantik minggu depan.
    words: [penghulu, dilantik]
  - id: e08
    type: speaking
    text: Gelar datuk diwariskan dari mamak kepada kemenakan.
    meaning:
      ar_eg: لقب الداتوك بيتورث من الخال لابن أخته.
      ar: يُورَث لقب الداتوك من الخال إلى ابن أخته.
      en: The datuk title passes from uncle to nephew.
    words: [datuk, kemenakan]
  - id: e09
    type: dictation
    text: Kenduri itu dimasak bersama oleh perempuan dari seluruh kaum.
    meaning:
      ar_eg: الوليمة دي طبختها ستات العشيرة كلها مع بعض.
      ar: طهت نساء العشيرة كلّها تلك الوليمة معًا.
      en: The feast was cooked together by the women of the whole clan.
    words: [kenduri, kaum]
  - id: e10
    type: fill_blank
    sentence: Di Minangkabau, gelar ___ dipakai oleh penghulu.
    meaning:
      ar_eg: في مينانجكاباو، لقب داتوك بيستخدمه زعيم العشيرة.
      ar: في مينانغكاباو يحمل زعيم العشيرة لقب داتوك.
      en: In Minangkabau, the title datuk is held by the clan chief.
    options: [datuk, kemenakan, rangkiang]
    answers: [datuk]
    words: [datuk, penghulu]
    explain:
      ar_eg: لقب زعيم العشيرة datuk. kemenakan = ابن الأخت وrangkiang = شونة.
      ar: لقب زعيم العشيرة datuk؛ أمّا kemenakan فابن الأخت، وrangkiang مخزن الحبوب.
      en: The clan chief's title is datuk. kemenakan is a nephew, and rangkiang a rice barn.
dialogue:
  title: Gelar baru Uda Rafi
  lines:
    - speaker: Mohamed
      text: Kenapa orang kampung sekarang punya nama lain buat Uda?
      ar_eg: ليه الناس في البلد بقى ليهم اسم تاني ليك يا أودا؟
      ar: لماذا صار لأهل البلدة اسم آخر لك يا أودا؟
      en: Why do the villagers have a different name for you now, Uda?
    - speaker: Uda Rafi
      text: Karena aku udah nikah, jadi aku dapat gelar. Kecil bernama, besar bergelar.
      ar_eg: عشان اتجوزت، فخدت لقب. صغير ليك اسم، كبير ليك لقب.
      ar: 'لأنّي تزوّجت فنلت لقبًا: يُسمّى صغيرًا ويُلقَّب كبيرًا.'
      en: Because I've married, so I got a title. Small, a name; grown, a title.
    - speaker: Mohamed
      text: Suatu hari nanti Uda akan dilantik jadi penghulu?
      ar_eg: وهل في يوم هتتعيّن زعيم العشيرة؟
      ar: وهل ستُنصَّب يومًا زعيمًا للعشيرة؟
      en: Will you be installed as clan chief one day?
    - speaker: Uda Rafi
      text: Mungkin. Mamakku sekarang Datuk, dan aku kemenakannya.
      ar_eg: يمكن. خالي هو الداتوك دلوقتي، وأنا ابن أخته.
      ar: ربّما، فخالي هو الداتوك الآن، وأنا ابن أخته.
      en: Maybe. My mamak is the Datuk now, and I'm his nephew.
