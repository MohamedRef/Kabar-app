schema: kabar.lesson/v1
id: bipa6.u03.l08
language: id
title: Baralek di rumah gadang
can_do:
  ar_eg: تحضر فرح مينانج وتتكلم عن العادات والكرامة واللي الناس متعودة عليه.
  ar: أن تحضر عرسًا مينانغيًا وتتحدث عن العادات والكرامة والمألوف عند الناس.
  en: Attend a Minang wedding and talk about custom, dignity and what people consider normal.
slides:
  - title: Baralek
    body:
      ar_eg: |
        baralek = الفرح بلهجة المينانج (بالإندونيسي pesta pernikahan).
        resepsi = حفلة الفرح، الاستقبال. bungsu = الصغير في الإخوات (anak bungsu). lajang = سنجل، مش متجوز.
        mengasuh = يربّي، يرعى (عيال). martabat = كرامة، مكانة (من مرتبة).
        lazim = عادي، متعارف عليه (من لازم). anggapan = اعتقاد الناس، فكرة (من anggap). tatanan = نظام (tatanan adat).
        - في الشارع: banget = sekali (أوي)، aku / -ku = saya (أنا)، nggak = tidak (لأ / مش).
      ar: |
        baralek = العرس بلهجة المينانغ (بالإندونيسية pesta pernikahan).
        resepsi = حفل الاستقبال. bungsu = أصغر الإخوة (anak bungsu). lajang = أعزب.
        mengasuh = يربّي، يرعى. martabat = كرامة، منزلة (من مرتبة).
        lazim = مألوف، متعارف عليه (من لازم). anggapan = تصوّر، ظنّ (من anggap). tatanan = نظام (tatanan adat).
        - في كلام الشارع: banget = sekali (جدًّا)، aku / -ku = saya (أنا)، nggak = tidak (لا / ليس).
      en: |
        baralek = wedding feast in Minang (Indonesian: pesta pernikahan).
        resepsi = wedding reception. bungsu = youngest child (anak bungsu). lajang = single, unmarried.
        mengasuh = to bring up, look after (children). martabat = dignity, standing (from Arabic مرتبة).
        lazim = customary, usual (from Arabic لازم). anggapan = assumption, view (from anggap). tatanan = order, system (tatanan adat).
        - On the street: banget = sekali (very), aku / -ku = saya (I), nggak = tidak (no, not).
    examples:
      - text: Resepsinya di rumah gadang, tamunya ratusan.
        ar_eg: الفرح في الرومة جادانج، والمعازيم بالمية.
        ar: الحفل في الرومة غادانغ، والضيوف بالمئات.
        en: The reception is at the rumah gadang, with hundreds of guests.
      - text: Anak bungsu itu masih lajang.
        ar_eg: الابن الصغير لسه سنجل.
        ar: ما زال الابن الأصغر أعزب.
        en: The youngest is still single.
      - text: Tatanan adat menjaga martabat keluarga.
        ar_eg: نظام العادات بيحافظ على كرامة العيلة.
        ar: يحفظ نظام العُرف كرامة الأسرة.
        en: Customary order protects the family's dignity.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: resepsi
        ar_eg: حفلة الفرح
        ar: حفل الاستقبال
        en: reception
      - text: bungsu
        ar_eg: الصغير
        ar: الأصغر
        en: youngest
      - text: lajang
        ar_eg: سنجل
        ar: أعزب
        en: single
      - text: mengasuh
        ar_eg: يربّي
        ar: يربّي، يرعى
        en: to bring up
    words: [resepsi, bungsu, lajang, mengasuh]
  - id: e02
    type: match_pairs
    pairs:
      - text: martabat
        ar_eg: كرامة
        ar: كرامة، منزلة
        en: dignity
      - text: lazim
        ar_eg: متعارف عليه
        ar: مألوف
        en: customary
      - text: anggapan
        ar_eg: فكرة الناس
        ar: تصوّر، ظنّ
        en: assumption
      - text: tatanan
        ar_eg: نظام
        ar: نظام
        en: order, system
    words: [martabat, lazim, anggapan, tatanan]
  - id: e03
    type: listen
    text: Neneknya yang mengasuh dia sejak kecil.
    question:
      ar_eg: الجدة عملت إيه؟
      ar: ماذا فعلت الجدة؟
      en: What did the grandmother do?
    options: [ربّته, اتجوزته, طلبته]
    answer: 0
    meaning:
      ar_eg: جدته هي اللي ربّته من وهو صغير.
      ar: جدّته هي من ربّته منذ صغره.
      en: His grandmother brought him up from childhood.
    words: [mengasuh]
  - id: e04
    type: fill_blank
    sentence: Umurnya sudah tiga puluh lima, tapi dia masih ___.
    meaning:
      ar_eg: عنده خمسة وتلاتين سنة، بس لسه ___.
      ar: عمره خمسة وثلاثون، لكنه ما زال ___.
      en: He's thirty-five, but still ___.
    options: [lajang, lazim, bungsu]
    answers: [lajang]
    words: [lajang, lazim, bungsu]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الحاجة اللي كل الناس متعودة عليها توصفها بإيه؟
      ar: بمَ تصف شيئًا اعتاده الناس جميعًا؟
      en: How do you describe something everyone is used to?
    options: [anggapan, martabat, lazim]
    answer: 2
    explain:
      ar_eg: lazim = متعارف عليه، من الكلمة العربي لازم.
      ar: lazim = مألوف، من العربية لازم.
      en: lazim = customary, from Arabic لازم.
    words: [lazim, anggapan, martabat]
  - id: e06
    type: fill_blank
    sentence: Ada ___ bahwa laki-laki Minang tidak punya hak apa-apa. Itu salah.
    meaning:
      ar_eg: فيه ___ إن راجل المينانج ملوش أي حق. ده غلط.
      ar: هناك ___ بأن رجل المينانغ بلا حقوق. وهذا خطأ.
      en: There's an ___ that Minang men have no rights. That's wrong.
    options: [anggapan, resepsi, tatanan]
    answers: [anggapan]
    words: [anggapan, resepsi, tatanan]
  - id: e07
    type: multiple_choice
    question: Adik paling kecil dalam keluarga disebut anak ___.
    options: [bungsu, lajang, sulung]
    answer: 0
    explain:
      ar_eg: الأصغر = bungsu، والأكبر = sulung.
      ar: الأصغر = bungsu، والأكبر = sulung.
      en: Youngest = bungsu; eldest = sulung.
    words: [bungsu, lajang, sulung]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الرجالة في المينانج بيحافظوا على كرامة العشيرة.
      ar: يحفظ رجال المينانغ كرامة العشيرة.
      en: Minang men protect the clan's dignity.
    answer: Laki-laki Minang menjaga martabat suku.
    distractors: [lazim, anggapan]
    words: [martabat]
  - id: e09
    type: translate
    direction: from_target
    source_text: Resepsi itu mengikuti tatanan adat yang lama.
    answers_meaning:
      ar_eg: [الفرح ده ماشي على نظام العادات القديم, حفلة الفرح اتعملت على العادات القديمة]
      ar: [اتّبع ذلك الحفل نظام العُرف القديم]
      en: [The reception followed the old customary order, That reception followed the old customs]
    words: [resepsi, tatanan]
  - id: e10
    type: speaking
    text: Di sini lazim mengasuh anak bersama keluarga besar.
    meaning:
      ar_eg: هنا العادي إن العيلة الكبيرة كلها تربّي العيال مع بعض.
      ar: من المألوف هنا أن تربّي العائلة الكبيرة الأطفال معًا.
      en: Here it's usual to raise children together with the extended family.
    words: [lazim, mengasuh]
dialogue:
  lines:
    - speaker: Uda Rafi
      text: Selamat datang di baralek! Resepsinya sampai malam.
      ar_eg: أهلًا بيك في الفرح! الحفلة لحد بالليل.
      ar: مرحبًا بك في العرس! يستمر الحفل حتى الليل.
      en: Welcome to the baralek! The reception goes on till night.
    - speaker: Mohamed
      text: Ramai banget. Pengantinnya anak bungsu, ya?
      ar_eg: زحمة أوي. العروسة هي الصغيرة، صح؟
      ar: مزدحم جدًا. العروس هي الصغرى، أليس كذلك؟
      en: So lively. The bride is the youngest, right?
    - speaker: Uda Rafi
      text: Iya. Aku mamaknya; aku ikut mengasuh dia dari kecil.
      ar_eg: أيوه. أنا خالها؛ وشاركت في تربيتها من صغرها.
      ar: نعم. أنا خالها؛ شاركت في تربيتها منذ صغرها.
      en: Yes. I'm her mamak; I helped raise her since she was little.
    - speaker: Mohamed
      text: Jadi mamak penting banget. Ada anggapan kalau ayah nggak penting.
      ar_eg: يبقى الخال مهم أوي. فيه فكرة إن الأب مش مهم.
      ar: إذن الخال مهم جدًا. ثمة ظن بأن الأب غير مهم.
      en: So the mamak matters a lot. Some think the father doesn't matter.
    - speaker: Uda Rafi
      text: Itu keliru. Dalam tatanan adat, dua-duanya menjaga martabat keluarga.
      ar_eg: ده غلط. في نظام العادات، الاتنين بيحافظوا على كرامة العيلة.
      ar: هذا خطأ. في نظام العُرف يحفظ كلاهما كرامة الأسرة.
      en: That's wrong. In customary order, both protect the family's dignity.
