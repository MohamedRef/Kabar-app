      - text: lajang
        ar_eg: سنجل
        ar: أعزب
        en: single
      - text: mengasuh
        ar_eg: يربّي
        ar: يربّي، يرعى
        en: to bring up
    words: [resepsi, bungsu, lajang, mengasuh]
  - id: e02
    type: match_pairs
    pairs:
      - text: martabat
        ar_eg: كرامة
        ar: كرامة، منزلة
        en: dignity
      - text: lazim
        ar_eg: متعارف عليه
        ar: مألوف
        en: customary
      - text: anggapan
        ar_eg: فكرة الناس
        ar: تصوّر، ظنّ
        en: assumption
      - text: tatanan
        ar_eg: نظام
        ar: نظام
        en: order, system
    words: [martabat, lazim, anggapan, tatanan]
  - id: e03
    type: listen
    text: Neneknya yang mengasuh dia sejak kecil. Orang tuanya bekerja di Jakarta. Karena itu, di pesta pernikahannya, nenek duduk di tempat yang paling terhormat.
    question:
      ar_eg: الجدة عملت إيه، وليه قعدت في أحسن مكان؟
      ar: ماذا فعلت الجدة، ولماذا جلست في أشرف مكان؟
      en: What did the grandmother do, and why did she sit in the place of honour?
    options:
      - Neneknya merawat dan membesarkan dia.
      - Neneknya melamar dia untuk cucu temannya.
      - Neneknya tinggal di Jakarta bersama orang tuanya.
    answer: 0
    meaning:
      ar_eg: جدته هي اللي ربّته من وهو صغير. أهله بيشتغلوا في جاكرتا. علشان كده، في فرحه، الجدة قعدت في أشرف مكان.
      ar: جدّته هي من ربّته منذ صغره، فوالداه يعملان في جاكرتا؛ لذلك جلست الجدّة في أشرف مكان في عرسه.
      en: His grandmother brought him up from childhood. His parents work in Jakarta. So at his wedding, she sat in the place of honour.
    explain:
      ar_eg: mengasuh = ربّى، وده سبب تكريمها. الأهل هما اللي في جاكرتا مش الجدة، ومافيش خطوبة.
      ar: mengasuh ربّى، وهذا سبب تكريمها؛ الوالدان في جاكرتا لا الجدّة، ولا خطبة هنا.
      en: mengasuh is to raise, which is why she's honoured. The parents are in Jakarta, not her; no proposal here.
    words: [mengasuh]
  - id: e04
    type: fill_blank
    sentence: Umurnya sudah tiga puluh lima, tapi dia masih ___.
    meaning:
      ar_eg: عنده خمسة وتلاتين سنة، بس لسه ___.
      ar: عمره خمسة وثلاثون، لكنه ما زال ___.
      en: He's thirty-five, but still ___.
    options: [lajang, lazim, bungsu]
    answers: [lajang]
    words: [lajang, lazim, bungsu]
    explain:
      ar_eg: "عنده 35 ولسه مش متجوز: lajang. lazim = عادي/شائع وbungsu = آخر العنقود."
      ar: في الخامسة والثلاثين وما زال أعزب lajang؛ أمّا lazim فمألوف، وbungsu أصغر الإخوة.
      en: Thirty-five and still single, lajang. lazim is customary, and bungsu the youngest child.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الحاجة اللي كل الناس متعودة عليها توصفها بإيه؟
      ar: بمَ تصف شيئًا اعتاده الناس جميعًا؟
      en: How do you describe something everyone is used to?
    options: [anggapan, martabat, lazim]
    answer: 2
    explain:
      ar_eg: lazim = متعارف عليه، من الكلمة العربي لازم.
      ar: lazim = مألوف، من العربية لازم.
      en: lazim = customary, from Arabic لازم.
    words: [lazim, anggapan, martabat]
  - id: e06
    type: fill_blank
    sentence: Ada ___ bahwa laki-laki Minang tidak punya hak apa-apa. Itu salah.
    meaning:
      ar_eg: فيه ___ إن راجل المينانج ملوش أي حق. ده غلط.
      ar: هناك ___ بأن رجل المينانغ بلا حقوق. وهذا خطأ.
      en: There's an ___ that Minang men have no rights. That's wrong.
    options: [anggapan, resepsi, tatanan]
    answers: [anggapan]
    words: [anggapan, resepsi, tatanan]
    explain:
      ar_eg: «فيه فكرة غلط إن…» = Ada anggapan bahwa. resepsi = حفلة وtatanan = نظام.
      ar: «ثمّة ظنّ أنّ…» Ada anggapan bahwa؛ أمّا resepsi (حفل) وtatanan (نظام) فلا تؤدّيان المعنى.
      en: "\"There's a belief that…\" is Ada anggapan bahwa. resepsi (reception) and tatanan (order) don't fit."
  - id: e07
    type: multiple_choice
    question: Adik paling kecil dalam keluarga disebut anak ___.
    options: [bungsu, lajang, sulung]
    answer: 0
    explain:
      ar_eg: الأصغر = bungsu، والأكبر = sulung.
      ar: الأصغر = bungsu، والأكبر = sulung.
      en: Youngest = bungsu; eldest = sulung.
    words: [bungsu, lajang, sulung]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الرجالة في المينانج بيحافظوا على كرامة العشيرة.
      ar: يحفظ رجال المينانغ كرامة العشيرة.
      en: Minang men protect the clan's dignity.
    answer: Laki-laki Minang menjaga martabat suku.
    distractors: [lazim, anggapan]
    words: [martabat]
    explain:
      ar_eg: «بيحموا كرامة العشيرة» = menjaga martabat suku. lazim وanggapan مش في المعنى.
      ar: «يصونون كرامة العشيرة» menjaga martabat suku؛ أمّا lazim وanggapan فليستا في المعنى.
      en: "\"Protect the clan's dignity\" is menjaga martabat suku. lazim and anggapan aren't in the meaning."
  - id: e09
    type: translate
    direction: from_target
    source_text: Resepsi itu mengikuti tatanan adat yang lama, sehingga para tamu duduk menurut umur dan gelar mereka.
    answers_meaning:
      ar_eg: [الفرح ده ماشي على نظام العادات القديم، فالضيوف قعدوا على حسب سنهم وألقابهم, حفلة الفرح اتعملت على العادات القديمة، علشان كده الضيوف اتقعدوا حسب العمر واللقب]
      ar: [اتّبع ذلك الحفل نظام العُرف القديم، فجلس الضيوف بحسب أعمارهم وألقابهم]
      en: [The reception followed the old customary order, so the guests sat by age and title, 'That reception followed the old customs, so guests were seated according to their age and titles']
    explain:
      ar_eg: sehingga بتجيب النتيجة، وmenurut = على حسب.
      ar: sehingga تأتي بالنتيجة، وmenurut بحسب.
      en: sehingga brings the result; menurut is according to.
    words: [resepsi, tatanan]
  - id: e10
    type: speaking
    text: Di sini lazim mengasuh anak bersama keluarga besar.
    meaning:
      ar_eg: هنا العادي إن العيلة الكبيرة كلها تربّي العيال مع بعض.
      ar: من المألوف هنا أن تربّي العائلة الكبيرة الأطفال معًا.
      en: Here it's usual to raise children together with the extended family.
    words: [lazim, mengasuh]
dialogue:
  lines:
    - speaker: Uda Rafi
      text: Selamat datang di baralek! Resepsinya sampai malam.
      ar_eg: أهلًا بيك في الفرح! الحفلة لحد بالليل.
      ar: مرحبًا بك في العرس! يستمر الحفل حتى الليل.
      en: Welcome to the baralek! The reception goes on till night.
    - speaker: Mohamed
      text: Ramai banget. Pengantinnya anak bungsu, ya?
      ar_eg: زحمة أوي. العروسة هي الصغيرة، صح؟
      ar: مزدحم جدًا. العروس هي الصغرى، أليس كذلك؟
      en: So lively. The bride is the youngest, right?
    - speaker: Uda Rafi
      text: Iya. Aku mamaknya; aku ikut mengasuh dia dari kecil.
      ar_eg: أيوه. أنا خالها؛ وشاركت في تربيتها من صغرها.
      ar: نعم. أنا خالها؛ شاركت في تربيتها منذ صغرها.
      en: Yes. I'm her mamak; I helped raise her since she was little.
    - speaker: Mohamed
      text: Jadi mamak penting banget. Ada anggapan kalau ayah nggak penting.
      ar_eg: يبقى الخال مهم أوي. فيه فكرة إن الأب مش مهم.
      ar: إذن الخال مهم جدًا. ثمة ظن بأن الأب غير مهم.
      en: So the mamak matters a lot. Some think the father doesn't matter.
    - speaker: Uda Rafi
      text: Itu keliru. Dalam tatanan adat, dua-duanya menjaga martabat keluarga.
      ar_eg: ده غلط. في نظام العادات، الاتنين بيحافظوا على كرامة العيلة.
      ar: هذا خطأ. في نظام العُرف يحفظ كلاهما كرامة الأسرة.
      en: That's wrong. In customary order, both protect the family's dignity.
