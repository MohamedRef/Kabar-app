schema: kabar.lesson/v1
id: bipa4.u05.l09
language: id
title: Pengumuman lomba
can_do:
  ar_eg: "تفهم إعلان في الميكروفون عن مسابقات ١٧ أغسطس: فين وإمتى والجوايز."
  ar: "أن تفهم إعلانًا بمكبّر الصوت عن مسابقات ١٧ أغسطس: المكان والموعد والجوائز."
  en: Follow a loudspeaker announcement about 17 August games - where, when and the prizes.
slides:
  - title: Suara dari pengeras suara
    body:
      ar_eg: |
        الصبح بدري، Pak RT (كبير الحتة) بيعلن عن المسابقات في الميكروفون. اسمع الأول.
        «Perhatian, perhatian!» = انتباه، انتباه!
      ar: |
        في الصباح الباكر يعلن Pak RT (رئيس الحي) عن المسابقات بمكبّر الصوت. استمع أولًا.
        «Perhatian, perhatian!» = انتباه، انتباه!
      en: |
        Early in the morning, Pak RT, the neighbourhood head, announces the games over the loudspeaker. Listen first.
        "Perhatian, perhatian!" = Attention, attention!
    examples:
      - text: Perhatian, perhatian! Lomba balap karung untuk anak-anak dimulai pukul sembilan di depan masjid.
        ar_eg: انتباه، انتباه! سباق الشوال للأطفال هيبدأ الساعة تسعة قدام الجامع.
        ar: انتباه، انتباه! يبدأ سباق الأكياس للأطفال في التاسعة أمام المسجد.
        en: Attention, attention! The children's sack race starts at nine in front of the mosque.
      - text: Peserta panjat pinang harap berkumpul di lapangan. Hadiahnya sepeda, kipas angin, dan tas sekolah!
        ar_eg: المشاركين في تسلّق العمود يتجمّعوا في الساحة. الجوايز عجلة ومروحة وشنطة مدرسة!
        ar: على المشاركين في تسلّق العمود التجمّع في الساحة. الجوائز درّاجة ومروحة وحقيبة مدرسية!
        en: Greased-pole climbers, please gather at the field. The prizes are a bicycle, a fan and a school bag!
      - text: Ayo, Bapak-Ibu, kita menyemangati para peserta. Semoga lomba tahun ini meriah!
        ar_eg: يلّا يا جماعة، نشجّع المشاركين. ويا رب مسابقات السنة دي تبقى مبهجة!
        ar: هيا أيها السادة والسيدات، لنشجّع المشاركين. نرجو أن تكون مسابقات هذا العام بهيجة!
        en: Come on, everyone, let's cheer the participants on. May this year's games be lively!
exercises:
  - id: e01
    type: listen
    text: Lomba balap karung untuk anak-anak dimulai pukul sembilan di depan masjid.
    question:
      ar_eg: سباق الشوال فين؟
      ar: أين يُقام سباق الأكياس؟
      en: Where is the sack race?
    options: [Di lapangan, Di depan masjid, Di depan sekolah]
    answer: 1
    meaning:
      ar_eg: سباق الشوال للأطفال هيبدأ الساعة تسعة قدام الجامع.
      ar: يبدأ سباق الأكياس للأطفال في التاسعة أمام المسجد.
      en: The children's sack race starts at nine in front of the mosque.
    words: [balap karung]
  - id: e02
    type: listen
    text: Peserta panjat pinang harap berkumpul di lapangan.
    question:
      ar_eg: المشاركين في تسلّق العمود يتجمّعوا فين؟
      ar: أين يتجمّع المشاركون في تسلّق العمود؟
      en: Where should the greased-pole climbers gather?
    options: [Di lapangan, Di depan masjid, Di rumah Pak RT]
    answer: 0
    meaning:
      ar_eg: المشاركين في تسلّق العمود يتجمّعوا في الساحة.
      ar: على المشاركين في تسلّق العمود التجمّع في الساحة.
      en: Greased-pole climbers, please gather at the field.
    words: [peserta, panjat pinang]
  - id: e03
    type: listen
    text: Hadiahnya sepeda, kipas angin, dan tas sekolah!
    question:
      ar_eg: أنهي حاجة من دول «مش» من الجوايز؟
      ar: أيّ هذه الأشياء «ليس» من الجوائز؟
      en: Which of these is NOT one of the prizes?
    options: [Sepeda, Tas sekolah, Televisi]
    answer: 2
    meaning:
      ar_eg: الجوايز عجلة ومروحة وشنطة مدرسة!
      ar: الجوائز درّاجة ومروحة وحقيبة مدرسية!
      en: The prizes are a bicycle, a fan and a school bag!
    words: [hadiah]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: المذيع بيطلب من الأهالي يعملوا إيه؟
      ar: ماذا يطلب المذيع من السكان؟
      en: What does the announcer ask residents to do?
    options:
      - Ikut lomba balap karung
      - Menyemangati para peserta
      - Pulang sebelum malam
    answer: 1
    words: [menyemangati]
  - id: e05
    type: match_pairs
    pairs:
      - text: balap karung
        ar_eg: سباق الشوال
        ar: سباق الأكياس
        en: sack race
      - text: panjat pinang
        ar_eg: تسلّق العمود المدهون
        ar: تسلّق العمود المدهون
        en: greased-pole climbing
      - text: hadiah
        ar_eg: جايزة / هدية
        ar: جائزة / هدية
        en: prize
      - text: menyemangati
        ar_eg: يشجّع
        ar: يشجّع
        en: cheer on
      - text: meriah
        ar_eg: مبهج / زحمة وفرحة
        ar: بهيج / حافل
        en: festive, lively
    words: [balap karung, panjat pinang, hadiah, menyemangati, meriah]
  - id: e06
    type: dictation
    text: Lomba balap karung dimulai pukul sembilan.
    meaning:
      ar_eg: سباق الشوال بيبدأ الساعة تسعة.
      ar: يبدأ سباق الأكياس في التاسعة.
      en: The sack race starts at nine.
    words: [balap karung]
  - id: e07
    type: fill_blank
    sentence: Ayo, kita ___ para peserta!
    meaning:
      ar_eg: يلّا نشجّع المشاركين!
      ar: هيا نشجّع المشاركين!
      en: Come on, let's cheer the participants on!
    options: [memperingati, menyemangati, menghadiri]
    answers: [menyemangati]
    words: [menyemangati]
  - id: e08
    type: build_sentence
    source:
      ar_eg: جايزة تسلّق العمود عجلة.
      ar: جائزة تسلّق العمود درّاجة.
      en: The prize for the greased-pole climb is a bicycle.
    answer: Hadiah lomba panjat pinang adalah sepeda.
    distractors: [karung, peserta]
    words: [hadiah, panjat pinang]
dialogue:
  title: Sebelum lomba
  lines:
    - speaker: Andi Tenri
      text: Mohamed, kamu dengar pengumumannya? Hadiah panjat pinang ada sepeda!
      ar_eg: يا Mohamed، سمعت الإعلان؟ جايزة تسلّق العمود فيها عجلة!
      ar: يا Mohamed، هل سمعت الإعلان؟ من جوائز تسلّق العمود درّاجة!
      en: Mohamed, did you hear the announcement? One of the greased-pole prizes is a bicycle!
    - speaker: Mohamed
      text: Dengar! Tapi panjat pinang itu susah banget, kan?
      ar_eg: سمعت! بس تسلّق العمود ده صعب جدًا، مش كده؟
      ar: سمعت! لكن تسلّق العمود صعب جدًا، أليس كذلك؟
      en: I did! But greased-pole climbing is really hard, isn't it?
    - speaker: Andi Tenri
      text: Iya, ha-ha. Para peserta harus bekerja sama.
      ar_eg: أيوه، هههه. المشاركين لازم يشتغلوا مع بعض.
      ar: نعم. على المشاركين أن يتعاونوا.
      en: Yes, ha ha. The participants have to work together.
    - speaker: Mohamed
      text: Kalau gitu, aku menyemangati dari bawah aja.
      ar_eg: خلاص، أنا هشجّع من تحت وبس.
      ar: إذن سأشجّع من الأسفل فقط.
      en: In that case, I'll just cheer from down below.
    - speaker: Andi Tenri
      text: Boleh. Suasananya pasti meriah!
      ar_eg: ماشي. الجو أكيد هيبقى مبهج!
      ar: لا بأس. ستكون الأجواء بهيجة بالتأكيد!
      en: Fine. It's bound to be a lively atmosphere!
