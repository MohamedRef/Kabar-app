schema: kabar.lesson/v1
id: bipa6.u06.l03
language: id
title: Humor Batak
can_do:
  ar_eg: تفهم الهزار الصريح ومتزعلش منه، وترد عليه بهزار.
  ar: أن تفهم الدعابة الصريحة دون أن تنزعج منها، وتردّ عليها بدعابة.
  en: Understand blunt humour without taking offence, and answer it with a joke.
slides:
  - title: Terus terang ala Toba
    body:
      ar_eg: |
        حوالين بحيرة توبا هتسمع كلام blak-blakan (على المكشوف) وبصوت عالي، والباتاك نفسهم بيهزروا على ده. الصوت العالي مش زعل.
        - التحية: Horas! (أهلًا / سلامات)
        - kali = sekali في لهجة شمال سومطرة: Kurus kali kau! = إنت رفيع قوي!
        - الـ nada (النبرة) عالية، بس الكلام غالبًا bercanda (هزار).
        لو حد قال لك كلمة صريحة، ماتبقاش tersinggung (زعلان). اضحك ورد بهزار: Namanya juga lapar!
        - في الشارع: aku / -ku = saya (أنا)، biar = supaya (عشان)، nggak = tidak (لأ / مش)، kayak = seperti (زي)، gini = begini (كده (زي ده)).
      ar: |
        حول بحيرة توبا ستسمع كلامًا blak-blakan (صريحًا) بصوت عالٍ، ويمزح الباتاك أنفسهم بشأن ذلك. وارتفاع الصوت ليس غضبًا.
        - التحية: Horas! (مرحبًا / سلامات)
        - kali = sekali في لهجة شمال سومطرة: Kurus kali kau! = ما أنحفك!
        - الـ nada (النبرة) عالية، لكنّ الكلام غالبًا bercanda (مزاح).
        وإن قيل لك كلام صريح فلا تكن tersinggung (منزعجًا). اضحك وردّ بدعابة: Namanya juga lapar!
        - في كلام الشارع: aku / -ku = saya (أنا)، biar = supaya (لكي)، nggak = tidak (لا / ليس)، kayak = seperti (مثل)، gini = begini (هكذا).
      en: |
        Around Lake Toba you'll hear blak-blakan (blunt) talk at full volume, and Batak people joke about it themselves. Loud doesn't mean angry.
        - The greeting: Horas! (hello, cheers)
        - kali = sekali in North Sumatran speech: Kurus kali kau! = You're so skinny!
        - The nada (tone) is loud, but the words are often bercanda (joking).
        If someone says something blunt, don't be tersinggung (offended). Laugh and joke back: Namanya juga lapar! (Well, I'm hungry!)
        - On the street: aku / -ku = saya (I), biar = supaya (so that), nggak = tidak (no, not), kayak = seperti (like), gini = begini (like this).
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: blak-blakan
        ar_eg: على المكشوف
        ar: صريح بلا مواربة
        en: blunt, outspoken
      - text: terus terang
        ar_eg: بصراحة
        ar: بصراحة
        en: frankly, candid
      - text: tersinggung
        ar_eg: زعلان / متضايق من كلمة
        ar: منزعج من كلام
        en: offended
      - text: bercanda
        ar_eg: يهزّر
        ar: يمزح
        en: to joke
      - text: nada
        ar_eg: نبرة
        ar: نبرة
        en: tone (of voice)
    words: [blak-blakan, terus terang, tersinggung, bercanda, nada]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: توغار بيتكلم بصوت عالي في المطعم. هو زعلان؟
      ar: يتكلّم توغار بصوت عالٍ في المطعم. أهو غاضب؟
      en: Togar is talking loudly in the eatery. Is he angry?
    options:
      - أيوه، زعلان جدًا.
      - لأ، دي طريقته الصريحة في الكلام.
      - لأ، هو عيّان.
    answer: 1
    words: [blak-blakan]
  - id: e03
    type: fill_blank
    sentence: Jangan ___, dia cuma bercanda.
    meaning:
      ar_eg: ماتزعلش، هو بيهزر بس.
      ar: لا تنزعج، إنّه يمزح فقط.
      en: Don't be offended, he's only joking.
    options: [tersinggung, logat, terus terang]
    answers: [tersinggung]
    words: [tersinggung, bercanda]
  - id: e04
    type: listen
    text: Nada bicara orang Batak terdengar keras, tetapi orangnya ramah.
    question:
      ar_eg: المتكلم بيقول إيه؟
      ar: ماذا يقول المتكلّم؟
      en: What does the speaker say?
    options:
      - النبرة عالية، بس الناس ودودين.
      - الناس قليلين الذوق.
      - النبرة هادية جدًا.
    answer: 0
    words: [nada, bicara]
  - id: e05
    type: build_sentence
    source:
      ar_eg: بصراحة، أكلك مالح زيادة.
      ar: بصراحة، طعامك مالح أكثر من اللازم.
      en: Frankly, your cooking is too salty.
    answer: Terus terang, masakanmu terlalu asin.
    distractors: [nada, bercanda]
    words: [terus terang]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك الباتاكي قال وهو بيضحك «Kau ini, makan terus!». أحسن رد إيه؟
      ar: قال صديقك الباتاكي ضاحكًا «Kau ini, makan terus!». ما أفضل ردّ؟
      en: Your Batak friend laughs and says "Kau ini, makan terus!". What's the best reply?
    options:
      - Saya tersinggung sekali!
      - Saya tidak mau bicara lagi.
      - Namanya juga lapar, Lae!
    answer: 2
    words: [tersinggung, bicara]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هو بيهزر بس، ماتزعلش.
      ar: إنّه يمزح فقط، فلا تنزعج.
      en: He's only joking; don't be offended.
    answers:
      - Dia cuma bercanda, jangan tersinggung.
      - Dia hanya bercanda, jangan tersinggung.
      - Dia cuma bercanda; jangan tersinggung, ya.
      - Dia hanya bercanda, jadi jangan tersinggung.
      - Dia cuma bercanda, jadi jangan tersinggung.
    words: [bercanda, tersinggung]
  - id: e08
    type: speaking
    text: Saya suka teman yang blak-blakan dan terus terang.
    meaning:
      ar_eg: بحب الصاحب اللي بيتكلم على المكشوف وبصراحة.
      ar: أحبّ الصديق الصريح الذي يقول ما في نفسه.
      en: I like friends who are blunt and candid.
    words: [blak-blakan, terus terang]
  - id: e09
    type: dictation
    text: Nada bicaranya keras, tetapi dia sedang bercanda.
    meaning:
      ar_eg: نبرته عالية، بس هو بيهزر.
      ar: نبرته عالية، لكنّه يمزح.
      en: His tone is loud, but he's joking.
    words: [nada, bercanda, bicara]
dialogue:
  title: Di lapo
  lines:
    - speaker: Inang Tiur
      text: Horas, anak Mesir! Kurus kali kau, makanlah dulu!
      ar_eg: هوراس يا ابن مصر! إنت رفيع قوي، كُل الأول!
      ar: هوراس يا ابن مصر! ما أنحفك، كُل أوّلًا!
      en: Horas, Egyptian boy! You're so skinny, eat something first!
    - speaker: Mohamed
      text: Horas, Inang! Aku kurus? Di Mesir orang bilang aku gemuk.
      ar_eg: هوراس يا إينانج! أنا رفيع؟ في مصر بيقولوا عليّ تخين.
      ar: هوراس يا إينانغ! أأنا نحيف؟ في مصر يقولون إنّي سمين.
      en: Horas, Inang! Me, skinny? In Egypt people say I'm chubby.
    - speaker: Bang Togar
      text: Jangan tersinggung, Lae. Di sini semua tamu dibilang kurus biar makan lagi.
      ar_eg: ماتزعلش يا لاي. هنا كل الضيوف بيتقال عليهم رُفاع علشان ياكلوا تاني.
      ar: لا تنزعج يا لاي. هنا يقال لكلّ ضيف إنّه نحيف ليأكل مجدّدًا.
      en: Don't be offended, Lae. Here every guest is called skinny so they'll eat more.
    - speaker: Mohamed
      text: Aku nggak tersinggung. Terus terang, aku suka cara bercanda kayak gini.
      ar_eg: أنا مش زعلان. بصراحة، بحب طريقة الهزار دي.
      ar: لست منزعجًا. بصراحة، أحبّ هذا النوع من المزاح.
      en: I'm not offended. Frankly, I love this way of joking.
