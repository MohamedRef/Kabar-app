schema: kabar.lesson/v1
id: bipa4.u06.l04
language: id
title: Dampak pariwisata
can_do:
  ar_eg: توزن آثار السياحة الحلوة والوحشة وتتكلم عن التحديات والحلول.
  ar: أن تزن آثار السياحة الإيجابية والسلبية وتتحدث عن التحديات والحلول.
  en: Weigh tourism's good and bad effects and talk about challenges and solutions.
slides:
  - title: Berdampak positif atau negatif
    body:
      ar_eg: |
        dampak = أثر. وفيه طريقتين ثابتين:
        berdampak positif / negatif bagi … = ليه أثر إيجابي / سلبي على …
        memberikan dampak … pada … = يعمل أثر … على …
      ar: |
        dampak = أثر، وله تركيبان ثابتان:
        berdampak positif / negatif bagi … = له أثر إيجابي / سلبي على …
        memberikan dampak … pada … = يُحدث أثرًا … في …
      en: |
        dampak = impact. Two fixed patterns:
        berdampak positif / negatif bagi … = have a positive / negative impact on …
        memberikan dampak … pada … = make an … impact on …
    grammar: id.collocation
    examples:
      - text: Pariwisata berdampak positif bagi ekonomi Palu.
        ar_eg: السياحة ليها أثر إيجابي على اقتصاد بالو.
        ar: للسياحة أثر إيجابي على اقتصاد بالو.
        en: Tourism has a positive impact on Palu's economy.
  - title: Menghadapi tantangan
    body:
      ar_eg: |
        يواجه تحديات = menghadapi tantangan.
        يحل مشكلة = memecahkan masalah (حرفيًا «يكسر» المشكلة!).
        والسياحة المستدامة = pariwisata berkelanjutan (من lanjut = يكمّل).
      ar: |
        يواجه التحديات = menghadapi tantangan.
        يحل مشكلة = memecahkan masalah (حرفيًا «يكسر» المشكلة).
        والسياحة المستدامة = pariwisata berkelanjutan (من lanjut = يستمر).
      en: |
        face challenges = menghadapi tantangan.
        solve a problem = memecahkan masalah (literally "break" the problem!).
        sustainable tourism = pariwisata berkelanjutan (from lanjut, "continue").
    grammar: id.collocation
    examples:
      - text: Desa wisata menghadapi tantangan baru.
        ar_eg: القرى السياحية بتواجه تحديات جديدة.
        ar: تواجه القرى السياحية تحديات جديدة.
        en: Tourist villages are facing new challenges.
      - text: Kita harus memecahkan masalah sampah di pantai.
        ar_eg: لازم نحل مشكلة الزبالة على الشط.
        ar: يجب أن نحل مشكلة النفايات على الشاطئ.
        en: We must solve the rubbish problem on the beach.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dampak
        ar_eg: أثر
        ar: أثر
        en: impact, effect
      - text: tantangan
        ar_eg: تحدّي
        ar: تحدٍّ
        en: challenge
      - text: menghadapi
        ar_eg: يواجه
        ar: يواجه
        en: to face
      - text: memecahkan
        ar_eg: يحل (مشكلة)
        ar: يحل (مشكلة)
        en: to solve
      - text: berkelanjutan
        ar_eg: مستدام
        ar: مستدام
        en: sustainable
    words: [dampak, tantangan, menghadapi, memecahkan, berkelanjutan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي تعبير معناه «يحل مشكلة»؟
      ar: أيّ تعبير يعني «يحل مشكلة»؟
      en: Which phrase means "solve a problem"?
    options: [menghadapi masalah, memecahkan masalah, membuka masalah]
    answer: 1
    explain:
      ar_eg: menghadapi masalah = يواجه مشكلة (لسه ماتحلتش). الحل = memecahkan.
      ar: menghadapi masalah = يواجه مشكلة (لم تُحل بعد)، أما الحل فهو memecahkan.
      en: menghadapi masalah means facing a problem (not solved yet); solving is memecahkan.
    words: [memecahkan]
  - id: e03
    type: listen
    text: Pariwisata berdampak positif bagi warga.
    options: ["Pariwisata berdampak positif bagi warga.", "Pariwisata berdampak negatif bagi warga.", "Pariwisata berdampak positif bagi wisatawan."]
    answer: 0
    meaning:
      ar_eg: السياحة ليها أثر إيجابي على السكان.
      ar: للسياحة أثر إيجابي على السكان.
      en: Tourism has a positive impact on residents.
    words: [dampak]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «القرى السياحية بتواجه تحديات جديدة»؟
      ar: أيّ جملة تعني «تواجه القرى السياحية تحديات جديدة»؟
      en: Which sentence means "Tourist villages are facing new challenges"?
    options: ["Desa wisata memecahkan tantangan baru.", "Desa wisata menarik tantangan baru.", "Desa wisata menghadapi tantangan baru."]
    answer: 2
    words: [menghadapi, tantangan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: لازم نحل مشكلة الزبالة على الشط.
      ar: يجب أن نحل مشكلة النفايات على الشاطئ.
      en: We must solve the rubbish problem on the beach.
    answer: Kita harus memecahkan masalah sampah di pantai.
    distractors: [membuka, dampak]
    words: [memecahkan]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بالو عايزة تطوّر سياحة مستدامة.
      ar: تريد بالو تطوير سياحة مستدامة.
      en: Palu wants to develop sustainable tourism.
    answers:
      - Palu ingin mengembangkan pariwisata berkelanjutan.
      - Palu ingin mengembangkan pariwisata berkelanjutan
      - Palu mau mengembangkan pariwisata berkelanjutan.
      - Kota Palu ingin mengembangkan pariwisata berkelanjutan.
      - Palu ingin mengembangkan pariwisata yang berkelanjutan.
    words: [berkelanjutan]
  - id: e07
    type: speaking
    text: Pariwisata berdampak positif, tetapi kita juga menghadapi tantangan.
    meaning:
      ar_eg: السياحة ليها أثر إيجابي، بس إحنا كمان بنواجه تحديات.
      ar: للسياحة أثر إيجابي، لكننا نواجه تحديات أيضًا.
      en: Tourism has a positive impact, but we also face challenges.
    words: [dampak, menghadapi, tantangan]
  - id: e08
    type: dictation
    text: Pariwisata berkelanjutan memberikan dampak positif bagi warga.
    meaning:
      ar_eg: السياحة المستدامة بتعمل أثر إيجابي للسكان.
      ar: تُحدث السياحة المستدامة أثرًا إيجابيًا للسكان.
      en: Sustainable tourism has a positive impact on residents.
    words: [berkelanjutan, dampak]
dialogue:
  title: Untung dan rugi
  lines:
    - speaker: Mohamed
      text: Menurut Mas, apa dampak pariwisata bagi Palu?
      ar_eg: في رأيك يا رزال، إيه أثر السياحة على بالو؟
      ar: برأيك يا رزال، ما أثر السياحة على بالو؟
      en: In your view, Rizal, what impact does tourism have on Palu?
    - speaker: Mas Rizal
      text: Dampak ekonominya positif, tetapi sampah di pantai bertambah.
      ar_eg: أثرها على الاقتصاد إيجابي، بس الزبالة على الشطوط زادت.
      ar: أثرها الاقتصادي إيجابي، لكن النفايات على الشواطئ ازدادت.
      en: The economic impact is positive, but there's more rubbish on the beaches.
    - speaker: Mohamed
      text: Jadi kota ini menghadapi tantangan baru, ya?
      ar_eg: يعني المدينة دي بتواجه تحدي جديد، صح؟
      ar: إذن تواجه هذه المدينة تحديًا جديدًا، أليس كذلك؟
      en: So the city is facing a new challenge?
    - speaker: Mas Rizal
      text: Ya. Pariwisata berkelanjutan bisa memecahkan masalah itu.
      ar_eg: أيوه. السياحة المستدامة ممكن تحل المشكلة دي.
      ar: نعم. يمكن للسياحة المستدامة أن تحل تلك المشكلة.
      en: Yes. Sustainable tourism can solve that problem.
new_words:
  - word: tantangan
    pos: noun
    ar_eg: تحدّي
    ar: تحدٍّ
    en: challenge
  - word: menghadapi
    pos: verb
    ar_eg: يواجه
    ar: يواجه
    en: to face
  - word: memecahkan
    pos: verb
    ar_eg: يحل (مشكلة) / يكسر
    ar: يحل (مشكلة)، يكسر
    en: to solve (a problem); to break
  - word: berkelanjutan
    pos: adjective
    ar_eg: مستدام
    ar: مستدام
    en: sustainable
review:
