schema: kabar.lesson/v1
id: bipa5.u06.l06
language: id
title: Latihan di sanggar
can_do:
  ar_eg: 'تتكلم في بروفة مسرحية: التمثيل والراوي وأول عرض، والملابس والاسكتش، والآلات، والحماس.'
  ar: 'أن تتحدث في بروفة مسرحية: التمثيل والراوي والعرض الأول، والأزياء والرسم الأوّلي، والآلات، والحماس.'
  en: 'Talk at a play rehearsal: acting, the narrator and a debut, costumes and sketches, instruments and enthusiasm.'
slides:
  - title: Menjelang pentas
    body:
      ar_eg: |
        sandiwara = مسرحية، تمثيلية (وكمان "تمثيل" بمعنى كدب: Itu cuma sandiwara!).
        akting = تمثيل، أدا الممثل، narator = راوي، debut = أول ظهور (debut di panggung).
        busana = لبس، أزيا (busana adat = اللبس التقليدي)، sketsa = اسكتش، رسم أولي.
        instrumen = آلة موسيقية، antusias = متحمس.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: banget = sekali، nggak = tidak، aja = saja، udah = sudah.
      ar: |
        sandiwara = مسرحية (وأيضًا "تمثيل" بمعنى خداع: Itu cuma sandiwara!).
        akting = تمثيل، أداء الممثّل، narator = راوٍ، debut = الظهور الأول (debut di panggung).
        busana = أزياء، لباس (busana adat = اللباس التقليدي)، sketsa = رسم أوّلي، مسودّة.
        instrumen = آلة موسيقية، antusias = متحمّس.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: banget = sekali، nggak = tidak، aja = saja، udah = sudah.
      en: |
        sandiwara = play, drama (also "an act", a pretence: Itu cuma sandiwara!).
        akting = acting, narator = narrator, debut = debut (debut di panggung).
        busana = clothing, costume (busana adat = traditional dress), sketsa = sketch.
        instrumen = musical instrument, antusias = enthusiastic.
        The dialogue uses street forms; the formal ones are beside them: banget = sekali, nggak = tidak, aja = saja, udah = sudah.
    examples:
      - text: Sanggar kami mementaskan sandiwara tentang Tjilik Riwut.
        ar_eg: السانجار بتاعنا بيعرض مسرحية عن تشيليك ريووت.
        ar: يعرض مرسمنا مسرحية عن تشيليك ريووت.
        en: Our studio is staging a play about Tjilik Riwut.
      - text: Ini debut saya sebagai narator.
        ar_eg: دي أول مرة أطلع فيها راوي.
        ar: هذا ظهوري الأول راويًا.
        en: This is my debut as narrator.
      - text: Desainer membuat sketsa busana adat Dayak.
        ar_eg: المصممة عملت اسكتش للبس الداياك التقليدي.
        ar: رسمت المصمّمة مسودّات للأزياء التقليدية لشعب الداياك.
        en: The designer sketched traditional Dayak costumes.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sandiwara
        ar_eg: مسرحية
        ar: مسرحية
        en: play, drama
      - text: akting
        ar_eg: تمثيل
        ar: تمثيل
        en: acting
      - text: narator
        ar_eg: راوي
        ar: راوٍ
        en: narrator
      - text: debut
        ar_eg: أول ظهور
        ar: الظهور الأول
        en: debut
    words: [sandiwara, akting, narator, debut]
  - id: e02
    type: match_pairs
    pairs:
      - text: busana
        ar_eg: لبس، أزيا
        ar: أزياء
        en: costume, clothing
      - text: sketsa
        ar_eg: اسكتش
        ar: رسم أوّلي
        en: sketch
      - text: instrumen
        ar_eg: آلة موسيقية
        ar: آلة موسيقية
        en: instrument
      - text: antusias
        ar_eg: متحمس
        ar: متحمّس
        en: enthusiastic
    words: [busana, sketsa, instrumen, antusias]
  - id: e03
    type: listen
    text: Aktingnya bagus, tapi suaranya terlalu pelan.
    question:
      ar_eg: إيه اللي حلو؟
      ar: ما الجيد؟
      en: What is good?
    options: [التمثيل, اللبس, المزيكا]
    answer: 0
    meaning:
      ar_eg: التمثيل بتاعه حلو، بس صوته واطي أوي.
      ar: تمثيله جيد لكن صوته منخفض جدًا.
      en: His acting is good, but his voice is too quiet.
    words: [akting]
  - id: e04
    type: fill_blank
    sentence: Sebelum menjahit, desainer menggambar ___ dulu.
    meaning:
      ar_eg: قبل الخياطة، المصممة بترسم ___ الأول.
      ar: قبل الخياطة ترسم المصمّمة ___ أولًا.
      en: Before sewing, the designer draws a ___ first.
    options: [sketsa, debut, instrumen]
    answers: [sketsa]
    words: [sketsa, debut, instrumen]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي بيحكي القصة للجمهور بين المشاهد اسمه إيه؟
      ar: من يروي القصة للجمهور بين المشاهد؟
      en: Who tells the story to the audience between scenes?
    options: [busana, akting, narator]
    answer: 2
    explain:
      ar_eg: narator = راوي.
      ar: narator = راوٍ.
      en: narator = narrator.
    words: [busana, akting, narator]
  - id: e06
    type: fill_blank
    sentence: 'Penonton sangat ___: mereka bertepuk tangan lama sekali.'
    meaning:
      ar_eg: 'الجمهور كان ___ جدًا: فضلوا يسقفوا كتير.'
      ar: 'كان الجمهور ___ جدًا: صفّقوا طويلًا.'
      en: 'The audience was very ___: they clapped for ages.'
    options: [antusias, sandiwara, sketsa]
    answers: [antusias]
    words: [antusias, sandiwara, sketsa]
  - id: e07
    type: multiple_choice
    question: Gong, kendang, dan sape adalah ___ musik tradisional.
    options: [debut, instrumen, antusias]
    answer: 1
    explain:
      ar_eg: instrumen = آلة موسيقية.
      ar: instrumen = آلة موسيقية.
      en: instrumen = instrument.
    words: [debut, instrumen, antusias]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الأزياء التقليدية للمسرحية دي حلوة أوي.
      ar: أزياء هذه المسرحية التقليدية جميلة جدًا.
      en: This play's traditional costumes are beautiful.
    answer: Busana adat sandiwara ini indah sekali.
    distractors: [narator, instrumen]
    words: [busana, sandiwara]
  - id: e09
    type: translate
    direction: from_target
    source_text: Ini debut saya sebagai narator.
    answers_meaning:
      ar_eg: [دي أول مرة أطلع فيها راوي, ده أول ظهور ليا كراوي]
      ar: [هذا ظهوري الأول راويًا, هذه أول مرة أكون فيها الراوي]
      en: [This is my debut as narrator, This is my first time as the narrator]
    words: [debut, narator]
  - id: e10
    type: speaking
    text: Aktingnya bagus dan penontonnya antusias.
    meaning:
      ar_eg: التمثيل حلو والجمهور متحمس.
      ar: التمثيل جيّد والجمهور متحمّس.
      en: The acting is good and the audience is enthusiastic.
    words: [akting, antusias]
dialogue:
  lines:
    - speaker: Bu Lestari
      text: Pak Mohamed, sanggar saya butuh narator untuk sandiwara minggu depan.
      ar_eg: يا أستاذ محمد، السانجار بتاعي محتاج راوي لمسرحية الأسبوع الجاي.
      ar: يا أستاذ محمد، يحتاج مرسمي إلى راوٍ لمسرحية الأسبوع القادم.
      en: Mohamed, my studio needs a narrator for next week's play.
    - speaker: Mohamed
      text: Saya? Akting saya jelek banget, Bu!
      ar_eg: أنا؟ تمثيلي وحش يا هانم!
      ar: أنا؟ تمثيلي سيئ يا سيّدتي!
      en: Me? My acting is terrible!
    - speaker: Bu Lestari
      text: Narator nggak perlu banyak akting. Cukup baca yang jelas aja.
      ar_eg: الراوي مش محتاج يمثل كتير. يكفي يقرا بوضوح.
      ar: لا يحتاج الراوي إلى تمثيل كثير، يكفي أن يقرأ بوضوح.
      en: A narrator doesn't need much acting. Just read clearly.
    - speaker: Mohamed
      text: Ya udah, deh. Ini debut saya! Saya pakai busana apa, Bu?
      ar_eg: خلاص ماشي. دي أول مرة ليا! ألبس إيه؟
      ar: حسنًا. هذا ظهوري الأول! ماذا أرتدي؟
      en: All right. It's my debut! What do I wear?
    - speaker: Bu Lestari
      text: Desainer kami sudah membuat sketsanya. Para pemain instrumen juga sangat antusias.
      ar_eg: المصممة بتاعتنا عملت الاسكتش. واللي بيعزفوا على الآلات متحمسين جدًا كمان.
      ar: رسمت مصمّمتنا المسودّات. والعازفون أيضًا متحمّسون جدًا.
      en: Our designer has made the sketches. The musicians are very excited too.
