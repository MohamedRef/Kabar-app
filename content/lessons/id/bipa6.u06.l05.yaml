schema: kabar.lesson/v1
id: bipa6.u06.l05
language: id
title: Grup lawak
can_do:
  ar_eg: تتكلم عن فرق الكوميديا الإندونيسية القديمة وتوصف نوع الضحك بتاعها.
  ar: أن تتحدّث عن فرق الكوميديا الإندونيسية القديمة وتصف نوع ضحكها.
  en: Talk about classic Indonesian comedy troupes and describe their kind of humour.
slides:
  - title: Dari radio ke layar lebar
    body:
      ar_eg: |
        قبل الـ stand-up، الإندونيسيين كانوا بيضحكوا مع فرق كوميدية:
        - grup lawak = فرقة كوميدية
        - pelawak = الكوميديان (من lawak = هزار، تهريج)
        - lawakan = النكتة أو الإفيه اللي بيتقال على المسرح
        - konyol = أهبل بشكل يضحّك
        - menghibur = يسلّي، يفرّح الناس
        أشهرهم Warkop DKI (دونو وكاسينو وإندرو): بدأوا في الراديو في السبعينات، وبعدين عملوا أفلام كتير. وSrimulat من شرق جاوة كانت بتضحّك الناس على المسرح.
        - في الشارع: kayak = seperti (زي)، tapi = tetapi (بس / لكن).
        - kan كلمة صغيرة بتدّي الجملة إحساس (مش كده؟)، ومن غيرها الجملة صح برضه.
      ar: |
        قبل الـ stand-up كان الإندونيسيون يضحكون مع فرق كوميدية:
        - grup lawak = فرقة كوميدية
        - pelawak = الممثّل الكوميدي (من lawak = هزل، تهريج)
        - lawakan = النكتة أو المقلب الذي يُقدَّم على المسرح
        - konyol = أحمق على نحو مضحك
        - menghibur = يسلّي، يُبهج الناس
        وأشهرها Warkop DKI (دونو وكاسينو وإندرو): بدأت في الإذاعة في السبعينيات ثم قدّمت أفلامًا كثيرة. وكانت Srimulat من جاوة الشرقية تُضحك الناس على المسرح.
        - في كلام الشارع: kayak = seperti (مثل)، tapi = tetapi (لكن).
        - kan أداة صغيرة تلوّن الجملة (أليس كذلك؟)، والجملة صحيحة بدونها.
      en: |
        Before stand-up, Indonesians laughed with comedy troupes:
        - grup lawak = comedy troupe
        - pelawak = comedian (from lawak = clowning)
        - lawakan = a joke or gag performed on stage
        - konyol = silly in a funny way
        - menghibur = to entertain, to cheer people up
        The most famous is Warkop DKI (Dono, Kasino and Indro): they started on radio in the 1970s, then made many films. And Srimulat from East Java made audiences laugh on stage.
        - On the street: kayak = seperti (like), tapi = tetapi (but).
        - kan is a small particle that adds feeling (right?); the sentence is correct without it.
    examples:
      - text: Lawakan Warkop DKI konyol, tetapi sering menyindir keadaan sosial.
        ar_eg: إفيهات وركوب دي كي آي هبلة، بس ساعات بتلقّح على أحوال المجتمع.
        ar: نكات وركوب دي كي آي حمقاء، لكنها كثيرًا ما تُعرّض بأحوال المجتمع.
        en: Warkop DKI's gags were silly, but they often poked at social conditions.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: grup lawak
        ar_eg: فرقة كوميدية
        ar: فرقة كوميدية
        en: comedy troupe
      - text: pelawak
        ar_eg: كوميديان
        ar: ممثّل كوميدي
        en: comedian
      - text: lawakan
        ar_eg: إفيه
        ar: نكتة
        en: gag, joke
      - text: konyol
        ar_eg: أهبل بشكل يضحّك
        ar: أحمق مضحك
        en: silly
      - text: menghibur
        ar_eg: يسلّي
        ar: يسلّي
        en: to entertain
    words: [grup lawak, pelawak, lawakan, konyol, menghibur]
  - id: e02
    type: listen
    text: Warkop DKI mulai terkenal lewat siaran radio pada tahun 1970-an.
    question:
      ar_eg: وركوب دي كي آي اشتهروا الأول منين؟
      ar: كيف اشتهرت وركوب دي كي آي أوّلًا؟
      en: How did Warkop DKI first become famous?
    options:
      - من التلفزيون.
      - من الراديو.
      - من الإنترنت.
    answer: 1
    words: [grup lawak]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «Adegan itu konyol sekali.» المشهد كان عامل إزاي؟
      ar: «Adegan itu konyol sekali.» كيف كان المشهد؟
      en: '"Adegan itu konyol sekali." What was the scene like?'
    options:
      - حزين جدًا.
      - مخيف جدًا.
      - أهبل ويضحّك جدًا.
    answer: 2
    words: [konyol]
    explain:
      ar_eg: konyol = أهبل ويضحّك. مش حزين ولا مخيف.
      ar: konyol سخيف مضحك، لا حزين ولا مخيف.
      en: konyol means silly and funny, not sad or scary.
  - id: e04
    type: fill_blank
    sentence: Film komedi itu ___ penonton setelah minggu yang berat.
    meaning:
      ar_eg: فيلم الكوميديا ده سلّى الجمهور بعد أسبوع تقيل.
      ar: سلّى الفيلم الكوميدي الجمهور بعد أسبوع شاقّ.
      en: That comedy film cheered the audience up after a hard week.
    options: [menghibur, konyol, lawakan]
    answers: [menghibur]
    words: [menghibur]
    explain:
      ar_eg: "الفيلم «بسط» الناس: menghibur. konyol صفة وlawakan = نكتة، ومش أفعال."
      ar: الفيلم «سلّى» الجمهور menghibur؛ أمّا konyol فصفة، وlawakan نكتة، وليسا فعلين.
      en: The film cheered people up, menghibur. konyol is an adjective, and lawakan a joke.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «pelawak» جاية من أنهي كلمة؟
      ar: من أيّ كلمة جاءت «pelawak»؟
      en: Which word does "pelawak" come from?
    options: [lawak, lawan, lawat]
    answer: 0
    explain:
      ar_eg: pe- + lawak = اللي بيهرّج. وlawak + -an = lawakan، الإفيه نفسه.
      ar: pe- + lawak = المهرّج، وlawak + -an = lawakan، أي النكتة نفسها.
      en: pe- + lawak = the clown; lawak + -an = lawakan, the gag itself.
    words: [pelawak, lawakan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الكوميديان ده بيقلّد صوت المدير.
      ar: يقلّد هذا الممثّل الكوميدي صوت المدير.
      en: That comedian imitates the boss's voice.
    answer: Pelawak itu menirukan suara bos.
    distractors: [konyol, lawakan]
    words: [pelawak]
    explain:
      ar_eg: «الكوميديان» = Pelawak و«بيقلّد» = menirukan. konyol وlawakan مش في المعنى.
      ar: «الفكاهي» Pelawak و«يقلّد» menirukan؛ أمّا konyol وlawakan فليستا في المعنى.
      en: "\"Comedian\" is Pelawak and \"imitates\" is menirukan. konyol and lawakan aren't in the meaning."
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الإفيه ده قديم بس لسه بيضحّك.
      ar: هذه النكتة قديمة لكنها ما زالت مضحكة.
      en: That gag is old but it's still funny.
    answers:
      - Lawakan itu lama, tetapi masih lucu.
      - Lawakan itu sudah lama, tetapi masih lucu.
      - Lawakan itu lama tapi masih lucu.
      - Lawakan itu kuno, tetapi masih lucu.
      - Lawakan itu lama, tapi masih lucu.
      - Lawakan itu udah lama, tapi masih lucu.
      - Lawakan itu kuno, tapi masih lucu.
    words: [lawakan]
  - id: e08
    type: speaking
    text: Grup lawak itu menghibur tiga generasi penonton Indonesia.
    meaning:
      ar_eg: الفرقة الكوميدية دي سلّت تلات أجيال من الجمهور الإندونيسي.
      ar: سلّت تلك الفرقة الكوميدية ثلاثة أجيال من الجمهور الإندونيسي.
      en: That comedy troupe entertained three generations of Indonesian viewers.
    words: [grup lawak, menghibur]
  - id: e09
    type: dictation
    text: Pelawak yang baik bisa membuat lawakan konyol menjadi kritik.
    meaning:
      ar_eg: الكوميديان الشاطر يقدر يحوّل الإفيه الأهبل لنقد.
      ar: يستطيع الكوميدي البارع أن يجعل النكتة الحمقاء نقدًا.
      en: A good comedian can turn a silly gag into criticism.
    words: [pelawak, lawakan, konyol]
  - id: e10
    type: fill_blank
    sentence: Dia jatuh dari kursi dengan cara yang ___, dan semua orang tertawa.
    meaning:
      ar_eg: وقع من على الكرسي بطريقة هبلة، والكل ضحك.
      ar: سقط عن الكرسيّ بطريقة حمقاء، فضحك الجميع.
      en: He fell off the chair in a silly way, and everyone laughed.
    options: [konyol, menghibur, pelawak]
    answers: [konyol]
    words: [konyol]
    explain:
      ar_eg: "dengan cara yang + صفة: konyol (بشكل أهبل). menghibur فعل وpelawak شخص."
      ar: "dengan cara yang تحتاج صفة: konyol؛ أمّا menghibur ففعل، وpelawak شخص."
      en: "dengan cara yang needs an adjective: konyol, silly. menghibur is a verb, and pelawak a person."
dialogue:
  title: Film lama di televisi
  lines:
    - speaker: Bang Togar
      text: Mohamed, malam ini ada film Warkop DKI di TV. Kau harus nonton!
      ar_eg: يا محمد، الليلة فيه فيلم لوركوب دي كي آي في التلفزيون. لازم تتفرج!
      ar: يا محمد، الليلة فيلم لوركوب دي كي آي على التلفاز، عليك أن تشاهده!
      en: Mohamed, there's a Warkop DKI film on TV tonight. You have to watch!
    - speaker: Mohamed
      text: Warkop itu grup lawak, kan? Kayak Tsulatsi Adwa al-Masrah di Mesir?
      ar_eg: وركوب دي فرقة كوميدية، صح؟ زي ثلاثي أضواء المسرح في مصر؟
      ar: وركوب فرقة كوميدية، أليس كذلك؟ مثل ثلاثي أضواء المسرح في مصر؟
      en: Warkop is a comedy troupe, right? Like Egypt's Tholathy Adwa'a El Masrah?
    - speaker: Bang Togar
      text: Mirip. Lawakannya konyol, tapi kadang-kadang menyindir pemerintah.
      ar_eg: شبهه. إفيهاتهم هبلة، بس ساعات بتلقّح على الحكومة.
      ar: يشبهه؛ نكاتهم حمقاء، لكنها تُعرّض بالحكومة أحيانًا.
      en: Similar. Their gags are silly, but sometimes they jab at the government.
    - speaker: Mohamed
      text: Pelawak yang baik memang menghibur sambil berpikir.
      ar_eg: الكوميديان الكويس فعلًا بيسلّي وبيخلّيك تفكر.
      ar: الكوميدي الجيّد يسلّي ويُفكّر في آن.
      en: A good comedian really entertains and makes you think.
