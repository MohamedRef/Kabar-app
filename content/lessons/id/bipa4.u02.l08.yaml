schema: kabar.lesson/v1
id: bipa4.u02.l08
language: id
title: Barang dan keputusan
can_do:
  ar_eg: 'تشتكي من حاجة اشتريتها: البياع، الرد، والقرار.'
  ar: 'أن تشكو من سلعة اشتريتها: البائع والرد والقرار.'
  en: 'Complain about something you bought: the seller, the answer and the decision.'
slides:
  - title: Barangnya tidak cocok
    body:
      ar_eg: |
        barang = حاجة، سلعة (barang elektronik). menjual = يبيع (jual = بيع)، menjawab = يرد على (jawab = رد).
        mengganggu = يزعج أو يعطّل. cocok = مناسب، ماشي مع (cocok untuk = مناسب لـ).
        sistem = نظام، keputusan = قرار (membuat keputusan = ياخد قرار)، informasi = معلومات.
      ar: |
        barang = الشيء أو السلعة (barang elektronik). menjual = يبيع (jual = بيع)، menjawab = يجيب (jawab = جواب).
        mengganggu = يزعج أو يعطّل. cocok = مناسب (cocok untuk = مناسب لـ).
        sistem = النظام، keputusan = القرار (membuat keputusan = يتخذ قرارًا)، informasi = المعلومات.
      en: |
        barang = thing, goods (barang elektronik). menjual = to sell (jual = sell), menjawab = to answer (jawab = answer).
        mengganggu = to disturb, disrupt. cocok = suitable, a good fit (cocok untuk = suitable for).
        sistem = system, keputusan = decision (membuat keputusan = make a decision), informasi = information.
    examples:
      - text: Toko itu menjual barang elektronik.
        ar_eg: المحل ده بيبيع أجهزة كهربائية.
        ar: يبيع ذلك المتجر أجهزة إلكترونية.
        en: That shop sells electronic goods.
      - text: Ukurannya tidak cocok untuk saya.
        ar_eg: المقاس مش مناسب ليّا.
        ar: المقاس لا يناسبني.
        en: The size doesn't suit me.
      - text: Kami menunggu keputusan dari toko.
        ar_eg: إحنا مستنيين قرار المحل.
        ar: ننتظر قرار المتجر.
        en: We're waiting for the shop's decision.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: barang
        ar_eg: حاجة، سلعة
        ar: سلعة
        en: goods, thing
      - text: menjual
        ar_eg: يبيع
        ar: يبيع
        en: to sell
      - text: menjawab
        ar_eg: يرد
        ar: يجيب
        en: to answer
      - text: mengganggu
        ar_eg: يزعج
        ar: يزعج
        en: to disturb
    words: [barang, menjual, menjawab, mengganggu]
  - id: e02
    type: match_pairs
    pairs:
      - text: cocok
        ar_eg: مناسب
        ar: مناسب
        en: suitable
      - text: sistem
        ar_eg: نظام
        ar: نظام
        en: system
      - text: keputusan
        ar_eg: قرار
        ar: قرار
        en: decision
      - text: informasi
        ar_eg: معلومات
        ar: معلومات
        en: information
    words: [cocok, sistem, keputusan, informasi]
  - id: e03
    type: listen
    text: Maaf, sistem kami sedang rusak.
    question:
      ar_eg: إيه المشكلة؟
      ar: ما المشكلة؟
      en: What's the problem?
    options: [النظام بايظ, المحل مقفول, مفيش بضاعة]
    answer: 0
    meaning:
      ar_eg: آسفين، النظام عندنا بايظ دلوقتي.
      ar: عذرًا، نظامنا معطّل حاليًا.
      en: Sorry, our system is down at the moment.
    words: [sistem]
  - id: e04
    type: fill_blank
    sentence: Toko online itu ___ jaket dan sepatu.
    meaning:
      ar_eg: المحل الأونلاين ده ___ جواكت وجزم.
      ar: ذلك المتجر الإلكتروني ___ السترات والأحذية.
      en: That online shop ___ jackets and shoes.
    options: [menjual, menjawab, mengganggu]
    answers: [menjual]
    words: [menjual, menjawab, mengganggu, barang]
    explain:
      ar_eg: menjual = يبيع، والمحل بيبيع جواكت وجزم. menjawab = يرد، وmengganggu = يزعج.
      ar: menjual = يبيع، فالمتجر يبيع السترات والأحذية. أما menjawab فيجيب، وmengganggu يزعج.
      en: "menjual is to sell: the shop sells jackets and shoes. menjawab is to answer and mengganggu is to disturb."
  - id: e05
    type: multiple_choice
    question: Saya sudah kirim email tiga kali, tapi tokonya belum ___.
    options: [menjual, menjawab, cocok]
    answer: 1
    explain:
      ar_eg: menjawab = يرد، والمحل مارد على الإيميلات. menjual = يبيع، وcocok = مناسب.
      ar: menjawab = يردّ، فالمتجر لم يرد على الرسائل. أما menjual فيبيع، وcocok مناسب.
      en: 'menjawab means answer: the shop hasn''t replied. menjual is sell, and cocok is suitable.'
    words: [menjawab, menjual, cocok]
  - id: e06
    type: fill_blank
    sentence: Suara truk itu ___ tidur saya.
    meaning:
      ar_eg: صوت التراك ده ___ نومي.
      ar: صوت تلك الشاحنة ___ نومي.
      en: The noise of that truck ___ my sleep.
    options: [mengganggu, menjawab, cocok]
    answers: [mengganggu]
    words: [mengganggu, menjawab, cocok]
    explain:
      ar_eg: mengganggu tidur = يزعج النوم. menjawab = يرد، وcocok = مناسب.
      ar: mengganggu tidur = يُقلق النوم. أما menjawab فيجيب، وcocok مناسب.
      en: mengganggu tidur means disturbs sleep. menjawab is to answer and cocok is suitable.
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تعرف تفاصيل المنتج. بتطلب إيه؟
      ar: تريد معرفة تفاصيل المنتج. ماذا تطلب؟
      en: You want the product details. What do you ask for?
    options: [keputusan, informasi, sistem]
    answer: 1
    explain:
      ar_eg: informasi = معلومات، ودي اللي بتطلبها. keputusan = قرار، وsistem = نظام.
      ar: informasi = المعلومات، وهي ما تطلبه. أما keputusan فالقرار، وsistem النظام.
      en: informasi is information, what you ask for. keputusan is a decision, and sistem is a system.
    words: [informasi, keputusan, sistem]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الجاكيت ده مش مناسب ليّا.
      ar: هذه السترة لا تناسبني.
      en: This jacket doesn't suit me.
    answer: Jaket ini tidak cocok untuk saya.
    distractors: [barang, sistem]
    words: [cocok, barang, sistem]
    explain:
      ar_eg: tidak cocok untuk saya = مش مناسب ليّا. barang = حاجة، وsistem = نظام، ومالهمش مكان هنا.
      ar: tidak cocok untuk saya = لا يناسبني. أما barang فسلعة، وsistem نظام، ولا مكان لهما هنا.
      en: tidak cocok untuk saya means doesn't suit me. barang is goods and sistem is a system; they don't belong here.
  - id: e09
    type: translate
    direction: from_target
    source_text: 'Toko itu membuat keputusan: barangnya dikembalikan.'
    answers_meaning:
      ar_eg: ['المحل خد قرار: الحاجة هترجع', المحل قرّر إن البضاعة ترجع]
      ar: ['اتخذ المتجر قرارًا: تُعاد السلعة', قرّر المتجر إعادة السلعة]
      en: ['The shop made a decision: the item will be returned', The shop decided the goods would be taken back]
    words: [keputusan, barang]
  - id: e10
    type: speaking
    text: Tolong beri saya informasi tentang barang ini.
    meaning:
      ar_eg: لو سمحت إدّيني معلومات عن الحاجة دي.
      ar: من فضلك أعطني معلومات عن هذه السلعة.
      en: Please give me information about this item.
    words: [informasi, barang, keputusan]
dialogue:
  lines:
    - speaker: Bu Hasnah
      text: Mohamed, tokonya sudah menjawab emailmu?
      ar_eg: يا محمد، المحل رد على الإيميل بتاعك؟
      ar: يا محمد، هل ردّ المتجر على رسالتك؟
      en: Mohamed, has the shop answered your email?
    - speaker: Mohamed
      text: Sudah, Bu. Katanya sistem mereka rusak minggu lalu.
      ar_eg: أيوه يا طنط. بيقولوا النظام عندهم كان بايظ الأسبوع اللي فات.
      ar: نعم. يقولون إن نظامهم تعطّل الأسبوع الماضي.
      en: Yes. They say their system broke down last week.
    - speaker: Bu Hasnah
      text: Terus, keputusannya apa?
      ar_eg: وبعدين، القرار إيه؟
      ar: وما القرار؟
      en: So what's the decision?
    - speaker: Mohamed
      text: Barangnya boleh dikembalikan. Ukurannya memang tidak cocok.
      ar_eg: الحاجة ينفع ترجع. المقاس فعلًا مش مناسب.
      ar: يمكن إعادة السلعة، فالمقاس لا يناسب فعلًا.
      en: I can send the item back. The size really doesn't fit.
    - speaker: Bu Hasnah
      text: Bagus. Lain kali, baca informasi ukurannya dulu, ya.
      ar_eg: كويس. المرة الجاية اقرا معلومات المقاس الأول.
      ar: جيد. في المرة القادمة اقرأ معلومات المقاس أولًا.
      en: Good. Next time, read the size information first.
