schema: kabar.lesson/v1
id: bipa3.u06.l02
language: id
title: Setinggi, sebersih
can_do:
  ar_eg: تشتكي بأدب من مشكلة في أوضتك (tidak sebersih, tidak sesuai).
  ar: أن تشكو بلباقة من مشكلة في غرفتك (tidak sebersih، tidak sesuai).
  en: Politely describe a problem with your room (tidak sebersih, tidak sesuai).
slides:
  - title: Tidak sebersih foto
    body:
      ar_eg: |
        انت عارف من المستوى التاني setinggi وsemahal: se- + صفة = «قد / زي … في».
        في الشكوى بنستعملها منفية، وده أدب جدًا: tidak sebersih foto = مش نضيفة زي الصورة.
        بدل ما تقول «الأوضة وسخة» على طول، بتقارن بالصورة أو بالإعلان.
      ar: |
        تعرف من المستوى الثاني setinggi وsemahal: se- مع الصفة تفيد المساواة.
        وفي الشكوى تُستعمل منفية، وهو أسلوب مهذب: tidak sebersih foto = ليست بنظافة الصورة.
        فبدل أن تقول «الغرفة متسخة» صراحةً تقارنها بالصورة.
      en: |
        You know setinggi and semahal from BIPA 2: se- + adjective = as … as.
        Complaints use it negated, which sounds polite: tidak sebersih foto = not as clean as the photo.
        Instead of saying "the room is dirty" outright, you compare it with the photo.
    grammar: id.prefix.se
    examples:
      - text: Kamar saya tidak sebersih foto di internet.
        ar_eg: أوضتي مش نضيفة زي الصورة اللي على النت.
        ar: غرفتي ليست بنظافة الصورة على الإنترنت.
        en: My room isn't as clean as the photo online.
      - text: Kolam renangnya tidak sebesar di foto.
        ar_eg: حمام السباحة مش كبير قد اللي في الصورة.
        ar: المسبح ليس بالحجم الذي في الصورة.
        en: The pool isn't as big as in the photo.
  - title: Sesuai dengan · masalah
    body:
      ar_eg: |
        sesuai هي كمان se- (se + suai) ومعناها «مطابق / زي ما اتفقنا»:
        tidak sesuai dengan pesanan saya = مش زي الحجز بتاعي.
        وmasalah (مشكلة) جاية من العربي «مسألة». Masalahnya, … = المشكلة إن…
      ar: |
        sesuai أيضًا من se- (se + suai) وتعني «مطابق»:
        tidak sesuai dengan pesanan saya = غير مطابق لحجزي.
        وmasalah (مشكلة) من العربية «مسألة»، وMasalahnya, … = المشكلةُ أنّ…
      en: |
        sesuai is also a se- word (se + suai): "matching, in line with".
        tidak sesuai dengan pesanan saya = not what I booked.
        masalah (problem) comes from Arabic «مسألة». Masalahnya, … = The problem is, …
    grammar: id.prefix.se
    examples:
      - text: Kamarnya tidak sesuai dengan pesanan saya.
        ar_eg: الأوضة مش زي اللي حجزته.
        ar: الغرفة غير مطابقة لحجزي.
        en: The room doesn't match my booking.
      - text: Masalahnya, AC-nya rusak dan kamarnya berisik.
        ar_eg: المشكلة إن التكييف بايظ والأوضة دوشة.
        ar: المشكلة أن المكيّف معطّل والغرفة صاخبة.
        en: The problem is, the AC is broken and the room is noisy.
  - title: "Resepsionis vs. teman"
    body:
      ar_eg: |
        في الفندق: Selamat siang, Pak. Ada yang bisa saya bantu? وانت تقول: Mohon maaf, AC di kamar saya tidak berfungsi.
        لصاحبك في التليفون: AC-nya rusak, kamarnya berisik banget!
        اختار المستوى حسب اللي قدامك: موظف أو مدير = رسمي، صاحب = عامي.
      ar: |
        في الفندق: Selamat siang, Pak. Ada yang bisa saya bantu? وتقول أنت: Mohon maaf, AC di kamar saya tidak berfungsi.
        لصديقك على الهاتف: AC-nya rusak, kamarnya berisik banget!
        اختر المستوى حسب من أمامك: موظف أو مدير = فصحى، صديق = عامية.
      en: |
        At the hotel: Selamat siang, Pak. Ada yang bisa saya bantu? and you say: Mohon maaf, AC di kamar saya tidak berfungsi.
        To a friend on the phone: AC-nya rusak, kamarnya berisik banget!
        Pick the register for the person in front of you: staff or manager = formal, friend = casual.
    examples:
      - text: "Mohon maaf, kamar saya tidak bersih. (رسمي)"
        ar_eg: "لو سمحت، أوضتي مش نضيفة. (رسمي)"
        ar: "عذرًا، غرفتي ليست نظيفة. (فصحى)"
        en: "Excuse me, my room isn't clean. (formal)"
      - text: "Kamarku kotor banget, nih! (santai)"
        ar_eg: "أوضتي وسخة أوي! (عامي)"
        ar: "غرفتي متسخة جدًا! (عامية)"
        en: "My room's filthy! (casual)"
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bersih
        ar_eg: نضيف
        ar: نظيف
        en: clean
      - text: kotor
        ar_eg: وسخ
        ar: متّسخ
        en: dirty
      - text: berisik
        ar_eg: دوشة / فيه زيطة
        ar: صاخب
        en: noisy
      - text: rusak
        ar_eg: بايظ / عطلان
        ar: معطّل / تالف
        en: broken
      - text: masalah
        ar_eg: مشكلة
        ar: مشكلة
        en: problem
      - text: sesuai dengan
        ar_eg: زي / مطابق لـ
        ar: مطابق لـ
        en: in line with, matching
    words: [bersih, kotor, berisik, rusak, masalah, sesuai]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «أوضتي مش نضيفة زي الصورة»؟
      ar: أيّ جملة تعني «غرفتي ليست بنظافة الصورة»؟
      en: Which sentence means "My room isn't as clean as the photo"?
    options:
      - Kamar saya sama sebersih foto.
      - Kamar saya tidak lebih bersih foto.
      - Kamar saya tidak sebersih foto.
    answer: 2
    explain:
      ar_eg: se- لوحدها معناها «قد / زي»، فمش محتاج sama ولا lebih.
      ar: تكفي se- لمعنى المساواة، فلا حاجة إلى sama أو lebih.
      en: se- alone means "as … as", so no sama or lebih.
    words: [bersih]
  - id: e03
    type: listen
    text: Masalahnya, AC-nya rusak dan kamarnya berisik.
    options:
      - Masalahnya, AC-nya rusak dan kamarnya berisik.
      - Masalahnya, AC-nya bersih dan kamarnya berisik.
      - Masalahnya, AC-nya rusak dan kamarnya kecil.
    answer: 0
    meaning:
      ar_eg: المشكلة إن التكييف بايظ والأوضة دوشة.
      ar: المشكلة أن المكيّف معطّل والغرفة صاخبة.
      en: The problem is, the AC is broken and the room is noisy.
    words: [masalah, rusak, berisik]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «الحمام وسخ ومش زي الصورة»؟
      ar: أيّ جملة تعني «الحمّام متّسخ وغير مطابق للصورة»؟
      en: Which sentence means "The bathroom is dirty and doesn't match the photo"?
    options:
      - Kamar mandinya bersih dan sesuai dengan foto.
      - Kamar mandinya kotor dan tidak sesuai dengan foto.
      - Kamar mandinya lebih kotor daripada kamarnya.
    answer: 1
    words: [kotor, sesuai]
  - id: e05
    type: fill_blank
    sentence: Kamar saya dekat jalan besar, jadi ___ sekali.
    meaning:
      ar_eg: أوضتي جنب الشارع الكبير، عشان كده دوشة جدًا.
      ar: غرفتي قرب الشارع الكبير، لذلك هي صاخبة جدًا.
      en: My room is next to the main road, so it's very noisy.
    options: [bersih, berisik, sesuai]
    answers: [berisik]
    words: [berisik]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الأوضة مش زي اللي حجزته.
      ar: الغرفة غير مطابقة لحجزي.
      en: The room doesn't match my booking.
    answer: Kamarnya tidak sesuai dengan pesanan saya.
    distractors: [sebersih, lebih]
    words: [sesuai]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الحمام مش نضيف زي الصورة.
      ar: الحمّام ليس بنظافة الصورة.
      en: The bathroom isn't as clean as the photo.
    answers:
      - Kamar mandinya tidak sebersih foto.
      - Kamar mandinya tidak sebersih foto
      - Kamar mandinya tidak sebersih fotonya.
      - Kamar mandinya tidak sebersih fotonya
      - Kamar mandinya tidak sebersih di foto.
      - Kamar mandinya tidak sebersih di foto
      - Kamar mandi tidak sebersih foto.
      - Kamar mandi tidak sebersih foto
      - Kamar mandi ini tidak sebersih foto.
      - Kamar mandi ini tidak sebersih foto
      - Kamar mandinya tidak sebersih yang di foto.
      - Kamar mandinya tidak sebersih yang di foto
      - "Kamar mandinya nggak sebersih foto."
      - "Kamar mandinya nggak sebersih foto"
      - "Kamar mandinya nggak sebersih fotonya."
      - "Kamar mandinya nggak sebersih fotonya"
      - "Kamar mandinya nggak sebersih di foto."
      - "Kamar mandinya nggak sebersih di foto"
      - "Kamar mandi nggak sebersih foto."
      - "Kamar mandi nggak sebersih foto"
      - "Kamar mandi ini nggak sebersih foto."
      - "Kamar mandi ini nggak sebersih foto"
      - "Kamar mandinya nggak sebersih yang di foto."
      - "Kamar mandinya nggak sebersih yang di foto"
    explain:
      ar_eg: «مش … زي» = tidak se- + الصفة. فاكر؟ bersih → sebersih.
      ar: «ليس بـ… كـ» = tidak مع se- والصفة، فـbersih تصير sebersih.
      en: Not as … as = tidak + se- + adjective, so bersih becomes sebersih.
    words: [bersih]
  - id: e08
    type: speaking
    text: Masalahnya, AC-nya rusak dan kamar mandinya kotor.
    meaning:
      ar_eg: المشكلة إن التكييف بايظ والحمام وسخ.
      ar: المشكلة أن المكيّف معطّل والحمّام متّسخ.
      en: The problem is, the AC is broken and the bathroom is dirty.
    words: [masalah, rusak, kotor]
dialogue:
  title: Telepon ke resepsionis
  lines:
    - speaker: Mohamed
      text: Selamat malam, Mbak. Saya tamu di kamar 12. Mohon maaf, ada masalah.
      ar_eg: مساء الخير يا آنسة. أنا النزيل اللي في أوضة 12. معلش، فيه مشكلة.
      ar: مساء الخير يا آنسة. أنا النزيل في الغرفة 12. عذرًا، هناك مشكلة.
      en: Good evening. I'm the guest in room 12. Sorry, there's a problem.
    - speaker: Resepsionis
      text: Selamat malam, Pak. Masalahnya apa?
      ar_eg: مساء النور يا فندم. إيه المشكلة؟
      ar: مساء النور يا سيدي. ما المشكلة؟
      en: Good evening, sir. What's the problem?
    - speaker: Mohamed
      text: Kamar saya tidak sebersih foto di internet. Kamar mandinya kotor.
      ar_eg: أوضتي مش نضيفة زي الصورة اللي على النت. الحمام وسخ.
      ar: غرفتي ليست بنظافة الصورة على الإنترنت. الحمّام متّسخ.
      en: My room isn't as clean as the photo online. The bathroom is dirty.
    - speaker: Mohamed
      text: AC-nya juga rusak, dan kamarnya berisik. Tidak sesuai dengan pesanan saya.
      ar_eg: والتكييف كمان بايظ، والأوضة دوشة. مش زي ما حجزت خالص.
      ar: والمكيّف معطّل أيضًا، والغرفة صاخبة. هذا لا يطابق حجزي.
      en: The AC is broken too, and the room is noisy. It doesn't match my booking.
    - speaker: Resepsionis
      text: Aduh, maaf sekali, Pak. Petugas kami akan segera datang.
      ar_eg: يا خبر! آسفين جدًا يا فندم. الموظف بتاعنا جاي حالًا.
      ar: نعتذر جدًا يا سيدي. سيأتي موظفنا حالًا.
      en: Oh dear, we're very sorry, sir. Our staff member will come right away.
