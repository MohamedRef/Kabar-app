    pos: pronoun
    ar_eg: أنا (بابوا)
    ar: أنا (ملايو بابوا)
    en: I (Papuan Malay)
  - word: ko
    pos: pronoun
    ar_eg: إنت (بابوا)
    ar: أنت (ملايو بابوا)
    en: you (Papuan Malay)
  - word: kitong
    pos: pronoun
    ar_eg: إحنا (بابوا)
    ar: نحن (ملايو بابوا)
    en: we (Papuan Malay)
  - word: tra
    pos: adverb
    ar_eg: مش (بابوا)
    ar: لا / ليس (ملايو بابوا)
    en: not (Papuan Malay)
  - word: gue
    pos: pronoun
    ar_eg: أنا (جاكرتا)
    ar: أنا (عامّية جاكرتا)
    en: I (Jakarta slang)
