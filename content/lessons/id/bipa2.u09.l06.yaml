schema: kabar.lesson/v1
id: bipa2.u09.l06
language: id
title: Ulangan Unit 9
can_do:
  ar_eg: تحكي حكاية أجازتك بالكلام وفي الشات.
  ar: أن تروي قصة عطلتك شفهيًا وفي المحادثات المكتوبة.
  en: Tell a holiday story in speech and chat.
slides:
  - title: Wah, seru sekali!
    body:
      ar_eg: |
        حكاية حلوة = ترتيب + صفات + إحساس:
        - pertama → lalu → setelah itu → akhirnya.
        - indah، sejuk، tenang، seru، menyenangkan، melelahkan.
        - wah (إعجاب)، aduh (وجع / مشكلة)، lho (مفاجأة)، kok (استغراب)، dong، sih، deh، kan، ya.
        في الشات: yg = yang، gk = nggak، udh = sudah، blm = belum، bgt = banget، tp = tapi، aja = saja، brp = berapa، 2 = تكرار (lumba2)، otw = في السكة، wkwk = هههه.
        للصحاب بس، مش للمدرس.
      ar: |
        السرد الحي = ترتيب + صفات + مشاعر:
        - pertama ← lalu ← setelah itu ← akhirnya.
        - indah، sejuk، tenang، seru، menyenangkan، melelahkan.
        - wah للإعجاب، aduh للألم، lho للمفاجأة، kok للاستغراب، ثم dong وsih وdeh وkan وya.
        في المحادثات: yg = yang، gk = nggak، udh = sudah، blm = belum، bgt = banget، tp = tapi، aja = saja، brp = berapa، و2 للتكرار، وotw = في الطريق، وwkwk = ضحك.
        وهي للأصدقاء فقط.
      en: |
        A lively story = order + adjectives + feeling:
        - pertama → lalu → setelah itu → akhirnya.
        - indah, sejuk, tenang, seru, menyenangkan, melelahkan.
        - wah (wow), aduh (ouch / oh no), lho (surprise), kok (how come), plus dong, sih, deh, kan, ya.
        In chat: yg = yang, gk = nggak, udh = sudah, blm = belum, bgt = banget, tp = tapi, aja = saja, brp = berapa, 2 = repeat (lumba2), otw = on the way, wkwk = haha.
        Friends only — not your teacher.
    grammar: id.interjection.particles
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wah
        ar_eg: ياه! / واو!
        ar: يا للروعة!
        en: wow!
      - text: aduh
        ar_eg: آه! / يا خبر!
        ar: آه! / يا للمصيبة!
        en: ouch! / oh no!
      - text: kok
        ar_eg: إزاي يعني؟
        ar: كيف ذلك؟
        en: how come?
      - text: deh
        ar_eg: خلاص، ماشي
        ar: حسنًا إذن
        en: OK then
    words: [wah, aduh, kok, deh]
  - id: e02
    type: match_pairs
    pairs:
      - text: yg
        ar_eg: yang (اللي)
        ar: yang (الذي)
        en: yang (who / which)
      - text: udh
        ar_eg: sudah (خلاص)
        ar: sudah (قد)
        en: sudah (already)
      - text: bgt
        ar_eg: banget (أوي)
        ar: banget (جدًا)
        en: banget (really)
      - text: tp
        ar_eg: tapi (بس)
        ar: tapi (لكن)
        en: tapi (but)
    words: [yang, sudah, banget, tapi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: اكتشفت إن الموبايل اتنسى في الفندق. تقول إيه؟
      ar: اكتشفت أنك نسيت هاتفك في الفندق. ماذا تقول؟
      en: You realise you left your phone at the hotel. What do you say?
    options: ['Deh, HP saya ketinggalan!', 'Aduh, HP saya ketinggalan!', 'Wah, HP saya ketinggalan!']
    answer: 1
    words: [aduh, ketinggalan]
  - id: e04
    type: listen
    text: Wah, seru sekali!
    options: ['Wah, seru sekali!', 'Aduh, mahal sekali!', 'Wah, sepi sekali!']
    answer: 0
    words: [wah, seru]
  - id: e05
    type: multiple_choice
    question: udh smp blm?
    question_meaning:
      ar_eg: إيه الكتابة الكاملة؟
      ar: ما الصيغة الكاملة؟
      en: What is it in full?
    options: ['Belum sampai, ya?', 'Sudah sampai belum?', 'Sudah sampai di mana?']
    answer: 1
    words: [sudah, sampai, belum]
  - id: e06
    type: fill_blank
    sentence: Udara pagi di Lovina ___ dan lautnya tenang.
    meaning:
      ar_eg: هوا الصبح في لوفينا منعش والبحر هادي.
      ar: هواء الصباح في لوفينا منعش والبحر هادئ.
      en: The morning air in Lovina is cool and the sea is calm.
    options: [ramai, sejuk, melelahkan]
    answers: [sejuk]
    words: [sejuk, tenang]
  - id: e07
    type: fill_blank
    sentence: Pertama, kami naik perahu. ___, kami melihat lumba-lumba.
    meaning:
      ar_eg: الأول ركبنا مركب، وبعدين شفنا الدلافين.
      ar: أولًا ركبنا قاربًا، ثم رأينا الدلافين.
      en: First we got on a boat. Then we saw dolphins.
    options: [Pertama, Mula-mula, Lalu]
    answers: [Lalu]
    words: [lalu, perahu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ياه، الدلافين كتير أوي!
      ar: يا للروعة، الدلافين كثيرة جدًا!
      en: Wow, there are so many dolphins!
    answer: Wah, lumba-lumbanya banyak sekali!
    distractors: [aduh, kok]
    words: [wah, lumba-lumba]
  - id: e09
    type: build_sentence
    source:
      ar_eg: (شات) أنا لسه ماكلتش، وإنت أكلت؟
      ar: (محادثة) لم آكل بعد، هل أكلت أنت؟
      en: (chat) I haven't eaten yet, have you?
    answer: aku blm makan, km udh?
    distractors: [yg, bgt]
    words: [belum, kamu, sudah]
  - id: e10
    type: translate
    direction: from_target
    source_text: Akhirnya kami pulang. Capek, tapi senang!
    answers_meaning:
      ar_eg: [وفي الآخر روّحنا. تعبانين بس مبسوطين!, في الآخر رجعنا، تعبنا بس انبسطنا!]
      ar: [وأخيرًا عدنا، متعبين لكن سعداء!, في النهاية رجعنا. كنا متعبين لكن سعداء!]
      en: [Finally we went home. Tired but happy!, 'In the end we went back. Tired, but happy!']
    words: [akhirnya, capek, senang]
  - id: e11
    type: dictation
    text: Setelah itu, kami melihat matahari terbit.
    meaning:
      ar_eg: بعد كده شفنا الشروق.
      ar: بعد ذلك شاهدنا شروق الشمس.
      en: After that, we watched the sunrise.
    words: [setelah itu, matahari terbit]
  - id: e12
    type: speaking
    text: Wah, liburan di Lovina seru sekali! Pertama, kami naik perahu. Akhirnya, kami melihat lumba-lumba.
    meaning:
      ar_eg: ياه، الأجازة في لوفينا كانت جامدة! الأول ركبنا مركب، وفي الآخر شفنا الدلافين.
      ar: كانت العطلة في لوفينا مثيرة جدًا! أولًا ركبنا قاربًا، وأخيرًا رأينا الدلافين.
      en: Wow, the holiday in Lovina was so exciting! First we got on a boat. Finally, we saw the dolphins.
    words: [wah, seru, pertama, akhirnya]
dialogue:
  title: Bercerita kepada Pak Irwan
  lines:
    - speaker: Pak Irwan
      text: Selamat pagi, Pak Mohamed. Bagaimana liburan Anda di Lovina?
      ar_eg: صباح الخير يا أستاذ محمد. إيه أخبار أجازتك في لوفينا؟
      ar: صباح الخير يا أستاذ محمد. كيف كانت عطلتك في لوفينا؟
      en: Good morning, Mohamed. How was your holiday in Lovina?
    - speaker: Mohamed
      text: Pagi, Pak. Liburannya sangat menyenangkan.
      ar_eg: صباح النور يا أستاذ. الأجازة كانت ممتعة جدًا.
      ar: صباح النور يا أستاذ. كانت العطلة ممتعة جدًا.
      en: Morning, sir. The holiday was really enjoyable.
    - speaker: Pak Irwan
      text: Di sana Anda melakukan apa saja?
      ar_eg: عملت إيه هناك؟
      ar: ماذا فعلت هناك؟
      en: What did you do?
    - speaker: Mohamed
      text: Pertama, kami bangun jam empat pagi. Lalu, kami naik perahu dan melihat matahari terbit.
      ar_eg: الأول صحينا الساعة ٤ الصبح، وبعدين ركبنا مركب وشفنا الشروق.
      ar: أولًا استيقظنا في الرابعة صباحًا، ثم ركبنا قاربًا وشاهدنا الشروق.
      en: First, we got up at four in the morning. Then we took a boat and watched the sunrise.
    - speaker: Pak Irwan
      text: Anda melihat lumba-lumba?
      ar_eg: شفت دلافين؟
      ar: هل رأيت الدلافين؟
      en: Did you see dolphins?
    - speaker: Mohamed
      text: Ya, banyak sekali! Akhirnya kami pulang ke hotel. Capek, tetapi senang.
      ar_eg: أيوه، كتير جدًا! وفي الآخر رجعنا الفندق. تعبانين بس مبسوطين.
      ar: نعم، كثيرة جدًا! وأخيرًا عدنا إلى الفندق، متعبين لكن سعداء.
      en: Yes, lots! Finally we went back to the hotel. Tired, but happy.
souvenir:
  id: bipa2.u09.souvenir
  title: Lumba-lumba di Lovina saat fajar
  note:
    ar_eg: في لوفينا المراكب بتطلع قبل الشروق عشان تشوف الدلافين بتنط في البحر الهادي. وبعدها على طول الصور بتنزل في الجروبات، والإندونيسيين من أكتر شعوب العالم دردشة، وشاتاتهم مليانة yg وgk وbgt وwkwk. دلوقتي إنت كمان بتعرف تحكي الحكاية بالكلام وتقرا الشات وترد عليه!
    ar: تخرج القوارب في لوفينا قبل الشروق لرؤية الدلافين تقفز فوق البحر الهادئ، ثم تنتشر الصور في مجموعات المحادثة. فالإندونيسيون من أكثر شعوب العالم دردشةً، ورسائلهم مليئة بـ yg وgk وbgt وwkwk. وأنت الآن تستطيع أن تروي القصة وتقرأ المحادثة وتردّ عليها!
    en: In Lovina the boats head out before sunrise to watch dolphins leap across the calm sea — and the photos land in the group chats minutes later. Indonesians are some of the world's busiest chatters, and their messages are full of yg, gk, bgt and wkwk. Now you can tell the story out loud, and read and answer the chat too!
review:
