schema: kabar.lesson/v1
id: bipa2.u09.l06
language: id
title: Grup WhatsApp liburan
can_do:
  ar_eg: تقرا جروب شات بتاع رحلة وترد عليه زي أصحابك.
  ar: أن تقرأ محادثة جماعية عن رحلة وتردّ عليها.
  en: Read and reply to a holiday group chat.
slides:
  - title: Membaca grup chat
    body:
      ar_eg: |
        في جروب الرحلة هتلاقي الاختصارات وحروف الكلام مع بعض:
        - brp = berapa، yg = yang، aja = saja، gk papa = مفيش مشكلة، hati2 = خلي بالك، wkwk = هههه.
        - jadi؟ = لسه الخطة قايمة؟ والرد: Jadi dong! = أكيد قايمة!
        - aduh، dong، deh بيدّوا الإحساس.
        - nyetir = menyetir (عامية)، ngantuk = نعسان، gaes = يا جماعة (من guys).
      ar: |
        في محادثة الرحلة تجتمع الاختصارات وأدوات الكلام:
        - brp = berapa، yg = yang، aja = saja، gk papa = لا بأس، hati2 = انتبهوا، wkwk = ضحك.
        - jadi؟ = هل الخطة قائمة؟ والرد: Jadi dong! = طبعًا قائمة!
        - aduh وdong وdeh تضيف الشعور.
        - nyetir = menyetir (عامية)، ngantuk = نعسان، gaes = يا جماعة (من guys).
      en: |
        A trip group chat mixes chat spelling and spoken particles:
        - brp = berapa, yg = yang, aja = saja, gk papa = no problem, hati2 = take care, wkwk = haha.
        - jadi? = is it still on? Reply: Jadi dong! = Of course it's on!
        - aduh, dong, deh add feeling.
        - nyetir = menyetir (casual), ngantuk = sleepy, gaes = guys.
    grammar: id.chat.abbreviations
    examples:
      - text: gaes, besok jadi ke Lovina?
        ar_eg: يا جماعة، لسه رايحين لوفينا بكرة؟
        ar: يا جماعة، هل ما زلنا ذاهبين إلى لوفينا غدًا؟
        en: Guys, is Lovina still on for tomorrow?
exercises:
  - id: e01
    type: multiple_choice
    question: berangkat jam brp?
    question_meaning:
      ar_eg: راكا كتب كده في الجروب. هو عايز يعرف إيه؟ اختار الكتابة الكاملة.
      ar: كتب راكا هذا في المجموعة. ماذا يريد أن يعرف؟ اختر الصيغة الكاملة.
      en: Raka wrote this in the group. What does he want to know? Pick the full form.
    options: ['Berangkat dengan siapa?', 'Berangkat jam berapa?', 'Berangkat dari mana?']
    answer: 1
    words: [berapa]
    explain:
      ar_eg: jam brp = jam berapa (الساعة كام؟). التانيين بيسألوا «مع مين؟» و«منين؟».
      ar: jam brp = jam berapa. والخياران الآخران «مع من؟» و«من أين؟».
      en: jam brp is jam berapa (what time?). The others ask "with whom?" and "from where?".
  - id: e02
    type: multiple_choice
    question: aku yg nyetir
    question_meaning:
      ar_eg: إيه معنى الرسالة دي بالإندونيسي الكامل؟
      ar: ما صيغة هذه الرسالة الكاملة؟
      en: What is this message in full Indonesian?
    options: [Aku yang menyanyi., Aku yang menyetir., Aku tidak menyetir.]
    answer: 1
    explain:
      ar_eg: yg = yang، وnyetir = menyetir (يسوق). يعني «أنا اللي هسوق».
      ar: yg = yang، وnyetir = menyetir، أي «أنا من سيقود».
      en: yg = yang, nyetir = menyetir — "I'll be the one driving".
    words: [yang, menyetir]
  - id: e03
    type: fill_blank
    sentence: ___ papa, nanti tidur di mobil aja
    meaning:
      ar_eg: (شات) ولا يهمك، ابقى نام في العربية.
      ar: (محادثة) لا بأس، نَم في السيارة لاحقًا.
      en: (chat) No problem, you can sleep in the car.
    options: [bgt, udh, gk]
    answers: [gk]
    words: [nggak, saja]
    explain:
      ar_eg: gk papa = gak apa-apa (ولا يهمك). bgt = أوي، وudh = خلاص.
      ar: gk papa = gak apa-apa (لا بأس). أما bgt فـ«جدًا» وudh «قد».
      en: gk papa = gak apa-apa (no problem). bgt is "really", udh is "already".
  - id: e04
    type: fill_blank
    sentence: Ayo ___, bangun! Sudah jam empat.
    meaning:
      ar_eg: يلا بقى، اصحى! الساعة بقت أربعة.
      ar: هيّا، استيقظ! صارت الساعة الرابعة.
      en: Come on, get up! It's already four.
    options: [sih, dong, kan]
    answers: [dong]
    words: [dong]
    explain:
      ar_eg: Ayo dong = يلا بقى (زقّة). sih بتليّن السؤال، وkan = «مش كده؟».
      ar: Ayo dong = هيّا إذن. أما sih فتليّن السؤال وkan «أليس كذلك؟».
      en: Ayo dong = come on then. sih softens questions, kan is "right?".
  - id: e05
    type: build_sentence
    source:
      ar_eg: (شات) ماشي، أنا هجيب أكل.
      ar: (محادثة) حسنًا، سأحضر طعامًا.
      en: (chat) OK, I'll bring food.
    answer: oke aku bawa makanan ya
    distractors: [yg, gk]
    words: [bawa, makanan, oke]
    explain:
      ar_eg: "في الشات: oke aku bawa makanan ya. yg وgk مالهمش مكان هنا."
      ar: "في المحادثة: oke aku bawa makanan ya. أما yg وgk فزائدتان."
      en: "In chat: oke aku bawa makanan ya. yg and gk don't fit."
  - id: e06
    type: translate
    direction: from_target
    source_text: hah jam 4?? aduh, ngantuk bgt wkwk
    answers_meaning:
      ar_eg: [إيه؟ الساعة ٤؟؟ يا خبر، أنا نعسان أوي هههه, الساعة ٤؟! يا نهار، هموت من النوم هههه]
      ar: [ماذا؟ الساعة الرابعة؟! يا للهول، أنا نعسان جدًا هههه, الرابعة؟! آه، أنا نعسان جدًا]
      en: ['What, 4 o''clock?? Oh no, I''m so sleepy haha', '4 a.m.?! Ugh, I''m so sleepy lol']
    words: [aduh, ngantuk, banget]
  - id: e07
    type: match_pairs
    pairs:
      - text: gaes
        ar_eg: يا جماعة
        ar: يا جماعة
        en: guys
      - text: ngantuk
        ar_eg: نعسان
        ar: نعسان
        en: sleepy
      - text: nyetir
        ar_eg: يسوق (عامية)
        ar: يقود (عامية)
        en: drive (casual)
      - text: setuju
        ar_eg: موافق
        ar: موافق
        en: agree
      - text: otw
        ar_eg: في السكة
        ar: في الطريق
        en: on the way
      - text: wkwk
        ar_eg: هههه
        ar: هههه
        en: haha
    words: [gaes, ngantuk, nyetir, setuju, otw, wkwk]
  - id: e08
    type: listen
    text: Gaes, aku ngantuk banget. Kamu aja yang nyetir, oke?
    options: ['Gaes, aku ngantuk banget. Kamu aja yang nyetir, oke?', 'Gaes, aku ngantuk banget. Aku aja yang nyetir, oke?', 'Gaes, aku setuju. Kamu aja yang nyetir, oke?']
    answer: 0
    meaning:
      ar_eg: يا جماعة، أنا نعسان أوي. إنت اللي سوق، ماشي؟
      ar: يا جماعة، أنا نعسان جدًا. قُد أنت، اتفقنا؟
      en: Guys, I'm so sleepy. You drive, OK?
    words: [gaes, ngantuk, nyetir, setuju, oke]
  - id: e09
    type: speaking
    text: Oke, aku bawa makanan, ya. Sampai besok!
    meaning:
      ar_eg: ماشي، أنا هجيب أكل. أشوفكم بكرة!
      ar: حسنًا، سأحضر الطعام. إلى اللقاء غدًا!
      en: OK, I'll bring food. See you tomorrow!
    words: [bawa, sampai besok, oke]
  - id: e10
    type: multiple_choice
    question: gaes, setuju gk?
    question_meaning:
      ar_eg: راكا بيسأل الجروب إيه؟ اختار الكتابة الكاملة.
      ar: ماذا يسأل راكا المجموعة؟ اختر الصيغة الكاملة.
      en: What is Raka asking the group? Pick the full form.
    options: ['Teman-teman, kalian setuju?', 'Teman-teman, kalian ngantuk?', 'Teman-teman, kalian sudah sampai?']
    answer: 0
    explain:
      ar_eg: gaes = guys (يا جماعة)، وsetuju = موافق.
      ar: gaes = يا جماعة، وsetuju = موافق.
      en: gaes = guys, setuju = agree.
    words: [gaes, setuju, ngantuk]
dialogue:
  title: Grup "Liburan Lovina"
  lines:
    - speaker: Ni Luh
      text: gaes, besok jadi ke Lovina?
      ar_eg: يا جماعة، لسه رايحين لوفينا بكرة؟
      ar: يا جماعة، هل ما زلنا ذاهبين إلى لوفينا غدًا؟
      en: Guys, is Lovina still on for tomorrow?
    - speaker: Raka
      text: jadi dong! berangkat jam brp?
      ar_eg: أكيد! هنمشي الساعة كام؟
      ar: طبعًا! متى ننطلق؟
      en: Of course! What time do we leave?
    - speaker: Ni Luh
      text: jam 4 pagi ya, supaya bisa lihat lumba2
      ar_eg: الساعة ٤ الصبح، عشان نلحق نشوف الدلافين.
      ar: في الرابعة صباحًا، لكي نرى الدلافين.
      en: 4 a.m., so we can see the dolphins.
    - speaker: Rina
      text: hah jam 4?? aduh, ngantuk bgt wkwk
      ar_eg: إيه؟ الساعة ٤؟؟ يا خبر، هموت من النوم هههه
      ar: ماذا؟ الرابعة؟! آه، سأكون نعسانة جدًا هههه
      en: What, 4?? Oh no, I'll be so sleepy haha
    - speaker: Mohamed
      text: gk papa Rina, nanti tidur di mobil aja
      ar_eg: ولا يهمك يا رينا، ابقي نامي في العربية.
      ar: لا بأس يا رينا، نامي في السيارة.
      en: No problem, Rina, just sleep in the car.
    - speaker: Raka
      text: setuju. aku yg nyetir
      ar_eg: موافق. أنا اللي هسوق.
      ar: موافق، أنا من سيقود.
      en: Agreed. I'll drive.
new_words:
  - word: gaes
    pos: interjection
    ar_eg: يا جماعة (من guys، عامية)
    ar: يا جماعة (من guys، عامية)
    en: guys (casual)
  - word: ngantuk
    pos: adjective
    ar_eg: نعسان
    ar: نعسان
    en: sleepy
  - word: nyetir
    pos: verb
    ar_eg: يسوق (عامية menyetir)
    ar: يقود (عامية menyetir)
    en: to drive (casual menyetir)
  - word: setuju
    pos: verb
    ar_eg: موافق
    ar: يوافق
    en: to agree
  - word: oke
    pos: interjection
    ar_eg: ماشي / أوكيه
    ar: حسنًا
    en: OK
review:
  status: draft
  verified: false
