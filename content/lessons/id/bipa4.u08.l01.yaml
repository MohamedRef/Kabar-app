    ar_eg: ملك / بتاع (milik X = بتاع X)
    ar: ملك (milik X = يملكه X)
    en: property; belonging to
    arabic: ملك
  - word: pinggir
    pos: noun
    ar_eg: حافة / طرف
    ar: حافة، طرف
    en: edge, side
