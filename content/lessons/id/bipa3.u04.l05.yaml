schema: kabar.lesson/v1
id: bipa3.u04.l05
language: id
title: Rokok dan stres
can_do:
  ar_eg: تتكلم مع دكتور عن السجاير والكحول والتوتر وصحة الجسم والنفس.
  ar: أن تتحدث مع طبيب عن التدخين والكحول والتوتر وصحة الجسد والنفس.
  en: Talk with a doctor about smoking, alcohol, stress and physical and mental health.
slides:
  - title: Kata dokter
    body:
      ar_eg: |
        penyakit = مرض (من sakit). kanker = سرطان. otak = مخ.
        rokok = سيجارة، سجاير (merokok = يدخّن). alkohol = كحول.
        stres = توتر، ضغط عصبي. mental = نفسي، fisik = بدني: kesehatan mental dan fisik.
      ar: |
        penyakit = مرض (من sakit). kanker = سرطان. otak = دماغ.
        rokok = سيجارة (merokok = يدخّن). alkohol = كحول.
        stres = توتر، إجهاد نفسي. mental = نفسي، fisik = جسدي: kesehatan mental dan fisik.
      en: |
        penyakit = illness, disease (from sakit). kanker = cancer. otak = brain.
        rokok = cigarette (merokok = smoke). alkohol = alcohol.
        stres = stress. mental = mental, fisik = physical: kesehatan mental dan fisik.
    examples:
      - text: Rokok bisa membuat penyakit kanker.
        ar_eg: السجاير ممكن تعمل سرطان.
        ar: قد يسبّب التدخين مرض السرطان.
        en: Cigarettes can cause cancer.
      - text: Tidur yang cukup baik untuk otak.
        ar_eg: النوم الكفاية كويس للمخ.
        ar: النوم الكافي مفيد للدماغ.
        en: Enough sleep is good for the brain.
      - text: Olahraga baik untuk tubuh dan mental.
        ar_eg: الرياضة كويسة للجسم وللنفسية.
        ar: الرياضة مفيدة للجسد والنفس.
        en: Exercise is good for body and mind.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: penyakit
        ar_eg: مرض
        ar: مرض
        en: illness
      - text: kanker
        ar_eg: سرطان
        ar: سرطان
        en: cancer
      - text: otak
        ar_eg: مخ
        ar: دماغ
        en: brain
      - text: rokok
        ar_eg: سيجارة
        ar: سيجارة
        en: cigarette
    words: [penyakit, kanker, otak, rokok]
  - id: e02
    type: match_pairs
    pairs:
      - text: alkohol
        ar_eg: كحول
        ar: كحول
        en: alcohol
      - text: stres
        ar_eg: توتر
        ar: توتر
        en: stress
      - text: mental
        ar_eg: نفسي
        ar: نفسي
        en: mental
      - text: fisik
        ar_eg: بدني
        ar: جسدي
        en: physical
    words: [alkohol, stres, mental, fisik]
  - id: e03
    type: listen
    text: Pekerjaan saya berat. Saya sering stres.
    question:
      ar_eg: هو حاسس بإيه؟
      ar: بماذا يشعر؟
      en: How does he feel?
    options: [تعبان من رجله, متوتر, جعان]
    answer: 1
    meaning:
      ar_eg: شغلي تقيل. أنا كتير ببقى متوتر.
      ar: عملي شاق. كثيرًا ما أشعر بالتوتر.
      en: My job is hard. I'm often stressed.
    words: [stres]
  - id: e04
    type: fill_blank
    sentence: Ayah saya berhenti merokok. Sekarang dia tidak membeli ___ lagi.
    meaning:
      ar_eg: أبويا بطّل تدخين. دلوقتي مابقاش بيشتري ___.
      ar: توقف أبي عن التدخين. لم يعد يشتري ___.
      en: My father quit smoking. He doesn't buy ___ any more.
    options: [otak, rokok, mental]
    answers: [rokok]
    words: [rokok, otak, mental]
    explain:
      ar_eg: اللي بيبطّله المدخّن rokok (سجاير). otak = مخ، وmental = نفسي.
      ar: ما يتركه المدخّن rokok «السجائر». أما otak فالدماغ، وmental «نفسي».
      en: What a smoker stops buying is rokok, cigarettes. otak is the brain and mental means mental.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مرض خطير جدًا بنقول عليه بالعربي «سرطان»؟
      ar: ما الكلمة التي تعني «سرطان»؟
      en: Which word means 'cancer'?
    options: [penyakit, alkohol, kanker]
    answer: 2
    explain:
      ar_eg: kanker = سرطان. وpenyakit = مرض بشكل عام.
      ar: kanker = سرطان، وpenyakit = مرض عمومًا.
      en: kanker = cancer; penyakit = illness in general.
    words: [kanker, penyakit, alkohol]
  - id: e06
    type: fill_blank
    sentence: Lari dan berenang adalah olahraga ___.
    meaning:
      ar_eg: الجري والعوم رياضة ___.
      ar: الجري والسباحة رياضة ___.
      en: Running and swimming are ___ exercise.
    options: [fisik, stres, kanker]
    answers: [fisik]
    words: [fisik, stres, kanker]
    explain:
      ar_eg: الجري والعوم رياضة بدنية = fisik. stres = توتر، وkanker = سرطان.
      ar: الجري والسباحة رياضة بدنية fisik. أما stres فتوتر، وkanker سرطان.
      en: Running and swimming are fisik, physical, exercise. stres is stress and kanker cancer.
  - id: e07
    type: build_sentence
    source:
      ar_eg: الكحول مش كويس للمخ.
      ar: الكحول ليس جيدًا للدماغ.
      en: Alcohol is not good for the brain.
    answer: Alkohol tidak baik untuk otak.
    distractors: [rokok, mental]
    words: [alkohol, otak]
    explain:
      ar_eg: "«للمخ» = untuk otak: Alkohol tidak baik untuk otak. rokok (سجاير) وmental مش في الجملة."
      ar: "«للدماغ» untuk otak: Alkohol tidak baik untuk otak. أما rokok (السجائر) وmental فليستا في الجملة."
      en: "\"For the brain\" is untuk otak. rokok (cigarettes) and mental aren't in the sentence."
  - id: e08
    type: translate
    direction: from_target
    source_text: Mental dan fisik yang sehat sama-sama perlu.
    answers_meaning:
      ar_eg: [الصحة النفسية والصحة البدنية الاتنين مهمين, محتاجين الصحة النفسية والبدنية مع بعض]
      ar: [الصحة النفسية والصحة الجسدية كلتاهما ضرورية, نحتاج إلى الصحة النفسية والجسدية معًا]
      en: [Mental health and physical health are both needed, We need both mental and physical health]
    words: [mental, fisik]
  - id: e09
    type: speaking
    text: Rokok dan alkohol membuat banyak penyakit.
    meaning:
      ar_eg: السجاير والكحول بيعملوا أمراض كتير.
      ar: التدخين والكحول يسبّبان أمراضًا كثيرة.
      en: Cigarettes and alcohol cause many illnesses.
    words: [rokok, alkohol, penyakit]
  - id: e10
    type: multiple_choice
    question: Menurut dokter, ___ jantung bisa datang karena stres.
    options: [penyakit, otak, fisik]
    answer: 0
    explain:
      ar_eg: penyakit jantung = مرض القلب.
      ar: penyakit jantung = مرض القلب.
      en: penyakit jantung = heart disease.
    words: [penyakit, otak, stres]
dialogue:
  lines:
    - speaker: Dokter
      text: Pak Mohamed, tekanan darah Anda agak tinggi. Apakah Anda merokok?
      ar_eg: يا أستاذ محمد، ضغطك عالي شوية. بتدخّن؟
      ar: يا سيد محمد، ضغط دمك مرتفع قليلًا. هل تدخّن؟
      en: Mr Mohamed, your blood pressure is a bit high. Do you smoke?
    - speaker: Mohamed
      text: Tidak, Dok. Saya juga tidak minum alkohol.
      ar_eg: لأ يا دكتور. ولا بشرب كحول.
      ar: لا يا دكتور. ولا أشرب الكحول.
      en: No, doctor. And I don't drink alcohol.
    - speaker: Dokter
      text: Bagus. Apakah Anda sering stres?
      ar_eg: كويس. بتتوتر كتير؟
      ar: جيد. هل تشعر بالتوتر كثيرًا؟
      en: Good. Are you often stressed?
    - speaker: Mohamed
      text: Ya, pekerjaan saya berat dan saya kurang tidur.
      ar_eg: أيوه، شغلي تقيل ومش بنام كفاية.
      ar: نعم، عملي شاق ولا أنام كفاية.
      en: Yes, my work is hard and I don't sleep enough.
    - speaker: Dokter
      text: Stres tidak baik untuk tubuh. Jaga tubuh dan mental Anda, ya.
      ar_eg: التوتر مش كويس للجسم. خلّي بالك من صحتك البدنية والنفسية.
      ar: التوتر ليس جيدًا للجسد. اعتنِ بصحتك الجسدية والنفسية.
      en: Stress isn't good for the body. Look after your physical and mental health.
