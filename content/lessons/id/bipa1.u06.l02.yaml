schema: kabar.lesson/v1
id: bipa1.u06.l02
language: id
title: Sudah, belum, sedang, akan
can_do:
  ar_eg: توضّح الفعل حصل إمتى من غير أزمنة.
  ar: أن تبيّن زمن الفعل بلا تصريف للأزمنة.
  en: Show when an action happens without tenses.
slides:
  - title: Kata kerja tidak berubah
    body:
      ar_eg: |
        خبر حلو: الفعل الإندونيسي عمره ما بيتغير! makan = كل / بياكل / هياكل.
        عشان توضح الزمن بتحط كلمة صغيرة قبل الفعل، بالظبط زي ما المصري بيحط «بـ» و«هـ» قدام الفعل:
        sudah (خلاص)، belum (لسه ماحصلش)، sedang (دلوقتي)، akan (هـ).
      ar: |
        الفعل الإندونيسي لا يتغير أبدًا: makan = أكل / يأكل / سيأكل.
        ويتحدد الزمن بكلمة قبل الفعل، كما تسبق «قد» و«سـ» الفعل العربي:
        sudah (قد)، belum (لمّا / ليس بعد)، sedang (الآن)، akan (سـ / سوف).
      en: |
        Good news — Indonesian verbs never change: makan = ate / eat / will eat.
        To show time, put a small word before the verb, just like Egyptian «بـ» and «هـ»:
        sudah (already), belum (not yet), sedang (in the middle of), akan (will).
    grammar: id.aspect.markers
    examples:
      - text: Saya makan.
        ar_eg: أنا باكل / كلت. (حسب السياق)
        ar: آكل / أكلت. (بحسب السياق)
        en: I eat / I ate. (context decides)
  - title: Sudah? — Belum.
    body:
      ar_eg: |
        - sudah = خلاص / بالفعل: Saya sudah makan = كلت خلاص.
        - belum = لسه (ماحصلش): Saya belum makan = لسه ماكلتش.
        belum هي الرد المؤدب بدل tidak. لو حد سألك «Sudah menikah?» (اتجوزت؟) وإنت لأ، قول «Belum» (لسه)، مش «Tidak».
        و«Sudah makan?» في إندونيسيا تحية زي «عامل إيه»، مش عزومة!
        في الشات: sudah = sdh / udah، belum = blm.
      ar: |
        - sudah = قد: Saya sudah makan = قد أكلت.
        - belum = لمّا / ليس بعد: Saya belum makan = لم آكل بعد.
        وbelum هو الجواب المهذب بدل tidak: «Sudah menikah?» (هل تزوجت؟) — «Belum».
        و«Sudah makan?» تحية شائعة كـ«كيف حالك»، لا دعوة إلى طعام.
        وفي المحادثات: sdh / udah، وblm.
      en: |
        - sudah = already: Saya sudah makan = I've eaten.
        - belum = not yet: Saya belum makan = I haven't eaten yet.
        belum is the polite answer instead of tidak: "Sudah menikah?" (Are you married?) — "Belum" (not yet), never a flat "Tidak".
        "Sudah makan?" is a greeting in Indonesia, like "how are you" — not an invitation!
        In chats: sdh / udah, blm.
    grammar: id.aspect.markers
    examples:
      - text: Kamu sudah makan? — Belum.
        ar_eg: كلت؟ — لسه.
        ar: هل أكلت؟ — ليس بعد.
        en: Have you eaten? — Not yet.
      - text: Sudah menikah? — Belum.
        ar_eg: إنت متجوز؟ — لسه.
        ar: هل أنت متزوج؟ — ليس بعد.
        en: Are you married? — Not yet.
  - title: Sedang / lagi
    body:
      ar_eg: |
        sedang = «في النص»، بيعمل الحاجة دلوقتي، زي «بـ» في «بقرا».
        في الكلام العادي بيقولوا lagi بدلها.
      ar: |
        sedang = يفعل الآن، في أثناء الفعل.
        وفي العامية تُقال lagi بدلًا منها.
      en: |
        sedang = in the middle of doing it, right now — like Egyptian «بـ» in «بقرا».
        Casual speech uses lagi instead.
    grammar: id.aspect.markers
    examples:
      - text: Saya sedang membaca buku.
        ar_eg: أنا بقرا كتاب دلوقتي.
        ar: أنا أقرأ كتابًا الآن.
        en: I'm reading a book.
      - text: Aku lagi makan.
        ar_eg: أنا باكل دلوقتي. (عامية)
        ar: آكل الآن. (عامية)
        en: I'm eating. (casual)
  - title: Akan / mau
    body:
      ar_eg: |
        akan = «هـ» (المستقبل): Saya akan pergi besok = هسافر بكرة.
        في الكلام العادي بيقولوا mau، زي «ناوي».
      ar: |
        akan = سـ / سوف: Saya akan pergi besok = سأذهب غدًا.
        وفي العامية تُستعمل mau.
      en: |
        akan = will / going to: Saya akan pergi besok = I'll leave tomorrow.
        Everyday speech often uses mau instead.
    grammar: id.aspect.markers
    examples:
      - text: Saya akan pergi besok.
        ar_eg: همشي بكرة.
        ar: سأذهب غدًا.
        en: I'll leave tomorrow.
      - text: Kami akan ke Bali bulan depan.
        ar_eg: هنروح بالي الشهر الجاي.
        ar: سنذهب إلى بالي الشهر القادم.
        en: We'll go to Bali next month.
  - title: Masih, baru
    body:
      ar_eg: |
        - masih = لسه (مستمر): Dia masih tidur = لسه نايم.
        - baru = لسه حالًا: Saya baru datang = لسه جاي حالًا.
        خلي بالك: «لسه» المصرية ليها ٣ ترجمات! لسه ماكلتش = belum، لسه نايم = masih، لسه جاي = baru.
      ar: |
        - masih = ما زال: Dia masih tidur = ما زال نائمًا.
        - baru = للتو: Saya baru datang = وصلت للتو.
        انتبه: «لسه» المصرية تقابل ثلاث كلمات: belum (لم … بعد)، masih (ما زال)، baru (للتو).
      en: |
        - masih = still: Dia masih tidur = He's still asleep.
        - baru = just: Saya baru datang = I've just arrived.
        Heads-up: Egyptian «لسه» has three translations — not yet = belum, still = masih, just now = baru.
    grammar: id.aspect.markers
    examples:
      - text: Dia masih di kantor.
        ar_eg: لسه في المكتب.
        ar: ما زال في المكتب.
        en: He/She is still at the office.
      - text: Saya baru datang dari Kairo.
        ar_eg: لسه جاي من القاهرة.
        ar: وصلت للتو من القاهرة.
        en: I've just come from Cairo.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sudah
        ar_eg: خلاص (حصل)
        ar: قد (تمّ)
        en: already
      - text: belum
        ar_eg: لسه ماحصلش
        ar: ليس بعد
        en: not yet
      - text: sedang
        ar_eg: دلوقتي (في النص)
        ar: الآن (في أثناء الفعل)
        en: in the middle of
      - text: akan
        ar_eg: هـ (مستقبل)
        ar: سـ / سوف
        en: will
      - text: masih
        ar_eg: لسه (مستمر)
        ar: ما زال
        en: still
    words: [sudah, belum, sedang, akan, masih]
  - id: e02
    type: multiple_choice
    question: Sudah menikah?
    question_meaning:
      ar_eg: إنت مش متجوز. أنهي رد طبيعي ومؤدب؟
      ar: لست متزوجًا. ما الجواب الطبيعي المهذب؟
      en: You're not married. What's the natural, polite reply?
    options: ["Belum.", "Tidak.", "Bukan."]
    answer: 0
    explain:
      ar_eg: belum = لسه، وده الرد اللي الكل بيقوله. tidak بتبان زي «لأ ومش ناوي».
      ar: belum = ليس بعد، وهو الجواب المعتاد؛ أما tidak فتوحي بالنفي القاطع.
      en: belum (not yet) is what everyone says; tidak sounds like "never".
    words: [belum, menikah]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «أنا بقرا كتاب دلوقتي»؟
      ar: أيّ جملة تعني «أنا أقرأ كتابًا الآن»؟
      en: Which sentence means "I'm reading a book right now"?
    options: ["Saya sudah membaca buku.", "Saya sedang membaca buku.", "Saya akan membaca buku."]
    answer: 1
    explain:
      ar_eg: sedang = دلوقتي، في النص.
      ar: sedang = الآن، في أثناء الفعل.
      en: sedang = in the middle of it, now.
    words: [sedang]
  - id: e04
    type: listen
    text: Dia masih tidur.
    options: ["Dia sudah tidur.", "Dia akan tidur.", "Dia masih tidur."]
    answer: 2
    words: [masih, tidur]
  - id: e05
    type: fill_blank
    sentence: Kami ___ ke Bali bulan depan.
    meaning:
      ar_eg: هنروح بالي الشهر الجاي.
      ar: سنذهب إلى بالي الشهر القادم.
      en: We'll go to Bali next month.
    options: ["sedang", "sudah", "akan"]
    answers: [akan]
    words: [akan]
  - id: e06
    type: fill_blank
    sentence: Saya ___ makan. Saya lapar.
    meaning:
      ar_eg: لسه ماكلتش. أنا جعان.
      ar: لم آكل بعد. أنا جائع.
      en: I haven't eaten yet. I'm hungry.
    options: ["belum", "sedang", "sudah"]
    answers: [belum]
    words: [belum, lapar]
  - id: e07
    type: fill_blank
    sentence: Saya ___ datang dari Kairo.
    meaning:
      ar_eg: لسه جاي من القاهرة حالًا.
      ar: وصلت للتو من القاهرة.
      en: I've just arrived from Cairo.
    options: ["akan", "baru", "masih"]
    answers: [baru]
    explain:
      ar_eg: «لسه حالًا» = baru. masih = لسه مستمر.
      ar: «للتو» = baru، أما masih فـ «ما زال».
      en: '"Just now" = baru; masih = still.'
    words: [baru, datang]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا بقرا كتاب دلوقتي.
      ar: أنا أقرأ كتابًا الآن.
      en: I'm reading a book (right now).
    answer: Saya sedang membaca buku.
    distractors: [sudah, menulis]
    words: [sedang, membaca, buku]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إنت كلت؟
      ar: هل أكلت؟
      en: Have you eaten?
    answers:
      - Kamu sudah makan?
      - Kamu sudah makan
      - Sudah makan?
      - Sudah makan
      - Anda sudah makan?
      - Apakah kamu sudah makan?
      - Kamu udah makan?
      - Udah makan?
    words: [sudah, makan]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لسه ماكلتش.
      ar: لم آكل بعد.
      en: I haven't eaten yet.
    answers:
      - Saya belum makan.
      - Saya belum makan
      - Aku belum makan.
      - Aku belum makan
      - Belum makan.
    words: [belum, makan]
  - id: e11
    type: translate
    direction: from_target
    source_text: Dia masih di kantor.
    answers_meaning:
      ar_eg: ["لسه في المكتب.", "هو لسه في المكتب", "هي لسه في المكتب"]
      ar: ["ما زال في المكتب.", "ما زالت في المكتب", "لا يزال في المكتب"]
      en: ["He's still at the office.", "She's still at the office", "He is still in the office"]
    words: [masih, kantor]
  - id: e12
    type: dictation
    text: Rina sudah pergi.
    meaning:
      ar_eg: رينا مشيت خلاص.
      ar: رينا قد ذهبت.
      en: Rina has already left.
    words: [sudah, pergi]
  - id: e13
    type: speaking
    text: Saya sedang membaca buku.
    meaning:
      ar_eg: أنا بقرا كتاب دلوقتي.
      ar: أنا أقرأ كتابًا الآن.
      en: I'm reading a book.
    words: [sedang, membaca]
dialogue:
  title: Sudah makan?
  lines:
    - speaker: Dimas
      text: Mohamed, kamu sudah makan?
      ar_eg: محمد، كلت؟
      ar: يا محمد، هل أكلت؟
      en: Mohamed, have you eaten?
    - speaker: Mohamed
      text: Belum. Saya masih di kantor.
      ar_eg: لسه. أنا لسه في المكتب.
      ar: ليس بعد. ما زلت في المكتب.
      en: Not yet. I'm still at the office.
    - speaker: Dimas
      text: Aku lagi di Blok M. Aku mau makan sate.
      ar_eg: أنا في بلوك إم دلوقتي. هاكل ساتيه.
      ar: أنا الآن في بلوك إم. سآكل الساتيه.
      en: I'm at Blok M right now. I'm going to eat satay. (casual)
    - speaker: Mohamed
      text: Wah! Saya akan datang jam tujuh.
      ar_eg: الله! هاجي الساعة سبعة.
      ar: رائع! سآتي في السابعة.
      en: Oh! I'll come at seven.
    - speaker: Dimas
      text: Oke, sampai jumpa!
      ar_eg: ماشي، أشوفك!
      ar: حسنًا، إلى اللقاء!
      en: OK, see you!
new_words:
  - word: sudah
    pos: adverb
    ar_eg: خلاص / بالفعل
    ar: قد
    en: already
  - word: belum
    pos: adverb
    ar_eg: لسه (ماحصلش)
    ar: ليس بعد / لمّا
    en: not yet
  - word: sedang
    pos: adverb
    ar_eg: دلوقتي (في النص)
    ar: الآن (في أثناء الفعل)
    en: in the middle of (-ing)
  - word: lagi
    pos: adverb
    ar_eg: دلوقتي (عامية لـ sedang)
    ar: الآن (عامية)
    en: in the middle of (casual)
  - word: akan
    pos: adverb
    ar_eg: هـ (مستقبل)
    ar: سـ / سوف
    en: will, going to
  - word: masih
    pos: adverb
    ar_eg: لسه (مستمر)
    ar: ما زال
    en: still
  - word: baru
    pos: adverb
    ar_eg: لسه حالًا
    ar: للتو
    en: just (now)
  - word: datang
    pos: verb
    ar_eg: ييجي
    ar: يأتي
    en: to come, to arrive
  - word: pergi
    pos: verb
    ar_eg: يروح / يمشي
    ar: يذهب
    en: to go, to leave
  - word: menikah
    pos: verb
    ar_eg: يتجوز
    ar: يتزوج
    en: to marry, to be married
    arabic: نكاح
  - word: lapar
    pos: adjective
    ar_eg: جعان
    ar: جائع
    en: hungry
  - word: kantor
    pos: noun
    ar_eg: مكتب (شغل)
    ar: مكتب
    en: office
  - word: sate
    pos: noun
    ar_eg: ساتيه (أسياخ لحمة مشوية)
    ar: ساتيه (أسياخ لحم مشوي)
    en: satay
