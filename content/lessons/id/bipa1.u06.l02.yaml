schema: kabar.lesson/v1
id: bipa1.u06.l02
language: id
title: Menonton dan mengajar
can_do:
  ar_eg: تستعمل أفعال meN- اللي بتبقى men- وmeny- وmeng-.
  ar: أن تستعمل أفعال meN- بصيغ men- وmeny- وmeng-.
  en: Use meN- verbs with men-, meny- and meng-.
slides:
  - title: men- dan meny-
    body:
      ar_eg: |
        - men- قبل d و t و c و j: dengar → mendengar (يسمع)، cuci → mencuci (يغسل).
        الـ t بتقع: tulis → menulis (يكتب)، tonton → menonton (يتفرج).
        - meny- مع s، والـ s بتقع: sapu → menyapu (يكنس).
      ar: |
        - men- قبل d وt وc وj: dengar → mendengar (يسمع)، cuci → mencuci (يغسل).
        وتسقط t: tulis → menulis (يكتب)، tonton → menonton (يشاهد).
        - meny- مع s مع سقوطها: sapu → menyapu (يكنس).
      en: |
        - men- before d, t, c, j: dengar → mendengar (hear), cuci → mencuci (wash).
        t drops: tulis → menulis (write), tonton → menonton (watch).
        - meny- for s, and s drops: sapu → menyapu (sweep).
    grammar: id.prefix.men.basic
    examples:
      - text: Dimas menonton TV.
        ar_eg: ديماس بيتفرج على التلفزيون.
        ar: ديماس يشاهد التلفاز.
        en: Dimas is watching TV.
      - text: Bu Sari menyapu lantai.
        ar_eg: مدام ساري بتكنس الأرضية.
        ar: السيدة ساري تكنس الأرض.
        en: Bu Sari is sweeping the floor.
  - title: meng-
    body:
      ar_eg: |
        meng- قبل الحروف المتحركة وg وh وk، والـ k بتقع:
        - ajar → mengajar (يدرّس)
        - goreng → menggoreng (يقلي) — اتنين g!
        - kirim → mengirim (يبعت)
        حيلة الجذر: men- + حرف متحرك؟ جرّب t. meny- + متحرك؟ جرّب s. mem- + متحرك؟ جرّب p. meng- + متحرك؟ جرّب k أو متحرك. زي ما بنطلّع الجذر «ك ت ب» من «يكتب».
      ar: |
        meng- قبل الصوائت وg وh وk، مع سقوط k:
        - ajar → mengajar (يُدرّس)
        - goreng → menggoreng (يقلي) — بحرفي g.
        - kirim → mengirim (يرسل)
        ولاستخراج الجذر: men- + صائت → t، meny- + صائت → s، mem- + صائت → p، meng- + صائت → k أو صائت؛ كما نستخرج «ك ت ب» من «يكتب».
      en: |
        meng- before vowels, g, h, k — and k drops:
        - ajar → mengajar (teach)
        - goreng → menggoreng (fry) — double g!
        - kirim → mengirim (send)
        Root trick: men- + vowel → try t; meny- + vowel → s; mem- + vowel → p; meng- + vowel → k or a vowel. Like finding «ك ت ب» inside «يكتب».
    grammar: id.prefix.men.basic
    examples:
      - text: Pak Budi mengajar bahasa Indonesia.
        ar_eg: أستاذ بودي بيدرّس إندونيسي.
        ar: الأستاذ بودي يدرّس الإندونيسية.
        en: Pak Budi teaches Indonesian.
      - text: Saya mengirim pesan.
        ar_eg: أنا ببعت رسالة.
        ar: أرسل رسالة.
        en: I'm sending a message.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: membaca
        ar_eg: يقرا
        ar: يقرأ
        en: read
      - text: menulis
        ar_eg: يكتب
        ar: يكتب
        en: write
      - text: memasak
        ar_eg: يطبخ
        ar: يطبخ
        en: cook
      - text: menonton
        ar_eg: يتفرج
        ar: يشاهد
        en: watch
      - text: mencuci
        ar_eg: يغسل
        ar: يغسل
        en: wash
    words: [membaca, menulis, memasak, menonton, mencuci]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه جذر menyapu؟
      ar: ما جذر menyapu؟
      en: What's the root of menyapu?
    options: [nyapu, sapu, apu]
    answer: 1
    explain:
      ar_eg: meny- + حرف متحرك معناها إن الجذر بيبدأ بـ s.
      ar: meny- + صائت تعني أن الجذر يبدأ بـ s.
      en: meny- + vowel means the root starts with s.
    words: [menyapu]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: meN- + kirim تبقى إيه؟
      ar: ما ناتج meN- + kirim؟
      en: What does meN- + kirim become?
    options: [mengirim, mengkirim, menkirim]
    answer: 0
    explain:
      ar_eg: قبل k بتبقى meng-، والـ k بتقع.
      ar: قبل k تصير meng- وتسقط k.
      en: Before k it's meng-, and the k drops.
    words: [mengirim]
  - id: e04
    type: fill_blank
    sentence: Pak Budi ___ bahasa Indonesia.
    meaning:
      ar_eg: أستاذ بودي بيدرّس إندونيسي.
      ar: الأستاذ بودي يدرّس الإندونيسية.
      en: Pak Budi teaches Indonesian.
    answers: [mengajar, mengajarkan]
    explain:
      ar_eg: meng + ajar = mengajar (يدرّس). belajar = يتعلم، mengajar = يعلّم.
      ar: meng + ajar = mengajar (يُعلّم)، أما belajar فـ «يتعلم».
      en: meng + ajar = mengajar (teach); belajar = learn.
    words: [mengajar]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا بتفرج على التلفزيون في البيت.
      ar: أشاهد التلفاز في البيت.
      en: I watch TV at home.
    answer: Saya menonton TV di rumah.
    distractors: [tonton, membaca]
    words: [menonton]
  - id: e06
    type: translate
    direction: from_target
    source_text: Dimas mengirim pesan.
    answers_meaning:
      ar_eg: [ديماس بيبعت رسالة., ديماس بعت رسالة, ديماس بيبعت مسج]
      ar: [ديماس يرسل رسالة., أرسل ديماس رسالة, ديماس يُرسل رسالة]
      en: [Dimas is sending a message., Dimas sends a message, Dimas sent a message]
    words: [mengirim, pesan]
dialogue:
  lines:
    - speaker: Dimas
      text: Mohamed, kamu menonton apa?
      ar_eg: محمد، بتتفرج على إيه؟
      ar: محمد، ماذا تشاهد؟
      en: Mohamed, what are you watching?
    - speaker: Mohamed
      text: Saya menonton film Mesir. Kamu?
      ar_eg: بتفرج على فيلم مصري. وإنت؟
      ar: أشاهد فيلمًا مصريًّا. وأنت؟
      en: I'm watching an Egyptian film. You?
    - speaker: Dimas
      text: Saya mencuci baju, lalu saya mengirim pesan ke Rina.
      ar_eg: بغسل هدوم، وبعدين هبعت رسالة لرينا.
      ar: أغسل الملابس، ثم أرسل رسالة إلى رينا.
      en: I'm washing clothes, then I'm sending Rina a message.
    - speaker: Mohamed
      text: Rina mengajar bahasa Indonesia hari ini?
      ar_eg: رينا بتدرّس إندونيسي النهارده؟
      ar: هل تدرّس رينا الإندونيسية اليوم؟
      en: Is Rina teaching Indonesian today?
    - speaker: Dimas
      text: Ya, jam empat sore.
      ar_eg: أيوه، الساعة أربعة العصر.
      ar: نعم، في الرابعة عصرًا.
      en: Yes, at four p.m.
new_words:
  - word: mendengar
    pos: verb
    ar_eg: يسمع
    ar: يسمع
    en: to hear
  - word: mencuci
    pos: verb
    ar_eg: يغسل
    ar: يغسل
    en: to wash
  - word: menonton
    pos: verb
    ar_eg: يتفرج
    ar: يشاهد
    en: to watch
  - word: menyapu
    pos: verb
    ar_eg: يكنس
    ar: يكنس
    en: to sweep
  - word: mengajar
    pos: verb
    ar_eg: يدرّس / يعلّم
    ar: يُدرّس / يُعلّم
    en: to teach
  - word: menggoreng
    pos: verb
    ar_eg: يقلي
    ar: يقلي
    en: to fry
  - word: mengirim
    pos: verb
    ar_eg: يبعت
    ar: يرسل
    en: to send
  - word: pesan
    pos: noun
    ar_eg: رسالة / مسج
    ar: رسالة
    en: message
review:
  status: draft
  verified: false
