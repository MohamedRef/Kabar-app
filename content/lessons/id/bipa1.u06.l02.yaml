schema: kabar.lesson/v1
id: bipa1.u06.l02
language: id
title: Menonton dan mengajar
can_do:
  ar_eg: تستعمل أفعال meN- اللي بتبقى men- وmeny- وmeng-.
  ar: أن تستعمل أفعال meN- بصيغ men- وmeny- وmeng-.
  en: Use meN- verbs with men-, meny- and meng-.
slides:
  - title: men- dan meny-
    body:
      ar_eg: |
        - men- قبل d و t و c و j: dengar → mendengar (يسمع)، cuci → mencuci (يغسل).
        الـ t بتقع: tulis → menulis (يكتب)، tonton → menonton (يتفرج).
        - meny- مع s، والـ s بتقع: sapu → menyapu (يكنس).
      ar: |
        - men- قبل d وt وc وj: dengar → mendengar (يسمع)، cuci → mencuci (يغسل).
        وتسقط t: tulis → menulis (يكتب)، tonton → menonton (يشاهد).
        - meny- مع s مع سقوطها: sapu → menyapu (يكنس).
      en: |
        - men- before d, t, c, j: dengar → mendengar (hear), cuci → mencuci (wash).
        t drops: tulis → menulis (write), tonton → menonton (watch).
        - meny- for s, and s drops: sapu → menyapu (sweep).
    grammar: id.prefix.men.basic
    examples:
      - text: Raka menonton TV.
        ar_eg: راكا بيتفرج على التلفزيون.
        ar: راكا يشاهد التلفاز.
        en: Raka is watching TV.
      - text: Bu Yanti menyapu lantai.
        ar_eg: مدام يانتي بتكنس الأرضية.
        ar: السيدة يانتي تكنس الأرض.
        en: Bu Yanti is sweeping the floor.
  - title: meng-
    body:
      ar_eg: |
        meng- قبل الحروف المتحركة وg وh وk، والـ k بتقع:
        - ajar → mengajar (يدرّس)
        - goreng → menggoreng (يقلي) — اتنين g!
        - kirim → mengirim (يبعت)
        حيلة الجذر: men- + حرف متحرك؟ جرّب t. meny- + متحرك؟ جرّب s. mem- + متحرك؟ جرّب p. meng- + متحرك؟ جرّب k أو متحرك. زي ما بنطلّع الجذر «ك ت ب» من «يكتب».
      ar: |
        meng- قبل الصوائت وg وh وk، مع سقوط k:
        - ajar → mengajar (يُدرّس)
        - goreng → menggoreng (يقلي) — بحرفي g.
        - kirim → mengirim (يرسل)
        ولاستخراج الجذر: men- + صائت → t، meny- + صائت → s، mem- + صائت → p، meng- + صائت → k أو صائت؛ كما نستخرج «ك ت ب» من «يكتب».
      en: |
        meng- before vowels, g, h, k — and k drops:
        - ajar → mengajar (teach)
        - goreng → menggoreng (fry) — double g!
        - kirim → mengirim (send)
        Root trick: men- + vowel → try t; meny- + vowel → s; mem- + vowel → p; meng- + vowel → k or a vowel. Like finding «ك ت ب» inside «يكتب».
    grammar: id.prefix.men.basic
    examples:
      - text: Pak Irwan mengajar bahasa Indonesia.
        ar_eg: أستاذ إروان بيدرّس إندونيسي.
        ar: الأستاذ إروان يدرّس الإندونيسية.
        en: Pak Irwan teaches Indonesian.
      - text: Saya mengirim pesan.
        ar_eg: أنا ببعت رسالة.
        ar: أرسل رسالة.
        en: I'm sending a message.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mendengar
        ar_eg: يسمع
        ar: يسمع
        en: hear, listen
      - text: mencuci
        ar_eg: يغسل
        ar: يغسل
        en: wash
      - text: menonton
        ar_eg: يتفرج
        ar: يشاهد
        en: watch
      - text: menyapu
        ar_eg: يكنس
        ar: يكنس
        en: sweep
      - text: mengajar
        ar_eg: يدرّس
        ar: يدرّس
        en: teach
      - text: menggoreng
        ar_eg: يقلي
        ar: يقلي
        en: fry
    words: [mendengar, mencuci, menonton, menyapu, mengajar, menggoreng]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه جذر menyapu؟
      ar: ما جذر menyapu؟
      en: What's the root of menyapu?
    options: [nyapu, sapu, apu]
    answer: 1
    explain:
      ar_eg: meny- + حرف متحرك معناها إن الجذر بيبدأ بـ s.
      ar: meny- + صائت تعني أن الجذر يبدأ بـ s.
      en: meny- + vowel means the root starts with s.
    words: [menyapu]
  - id: e03
    type: multiple_choice
    question: Raka ___ pesan.
    question_meaning:
      ar_eg: meN- + kirim تبقى إيه؟
      ar: ما ناتج meN- + kirim؟
      en: What does meN- + kirim become?
    options: [mengirim, mengkirim, menkirim]
    answer: 0
    explain:
      ar_eg: قبل k بتبقى meng-، والـ k بتقع.
      ar: قبل k تصير meng- وتسقط k.
      en: Before k it's meng-, and the k drops.
    words: [mengirim, pesan]
  - id: e04
    type: fill_blank
    sentence: Pak Irwan ___ bahasa Indonesia.
    meaning:
      ar_eg: أستاذ إروان بيدرّس إندونيسي.
      ar: الأستاذ إروان يدرّس الإندونيسية.
      en: Pak Irwan teaches Indonesian.
    answers: [mengajar, mengajarkan]
    explain:
      ar_eg: meng + ajar = mengajar (يدرّس). belajar = يتعلم، mengajar = يعلّم.
      ar: meng + ajar = mengajar (يُعلّم)، أما belajar فـ «يتعلم».
      en: meng + ajar = mengajar (teach); belajar = learn.
    words: [mengajar]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا بتفرج على التلفزيون في البيت.
      ar: أشاهد التلفاز في البيت.
      en: I watch TV at home.
    answer: Saya menonton TV di rumah.
    distractors: [tonton, membaca]
    words: [menonton]
  - id: e06
    type: translate
    direction: from_target
    source_text: Raka mengirim pesan.
    answers_meaning:
      ar_eg: [راكا بيبعت رسالة., راكا بعت رسالة, راكا بيبعت مسج]
      ar: [راكا يرسل رسالة., أرسل راكا رسالة, راكا يُرسل رسالة]
      en: [Raka is sending a message., Raka sends a message, Raka sent a message]
    words: [mengirim, pesan]
  - id: e07
    type: listen
    text: Ibu mencuci baju dan menyapu rumah.
    options: ['Ibu mencuci baju dan menyapu rumah.', 'Ibu mencuci baju dan menggoreng nasi.', 'Ibu menonton TV dan menyapu rumah.']
    answer: 0
    meaning:
      ar_eg: ماما بتغسل الهدوم وبتكنس البيت.
      ar: أمي تغسل الملابس وتكنس البيت.
      en: Mum is washing clothes and sweeping the house.
    words: [mencuci, menyapu, menggoreng, menonton]
  - id: e08
    type: fill_blank
    sentence: Saya ___ Pak Irwan mengajar.
    meaning:
      ar_eg: أنا سامع أستاذ إيروان وهو بيدرّس.
      ar: أسمع الأستاذ إيروان وهو يدرّس.
      en: I can hear Pak Irwan teaching.
    options: [mendengar, mencuci, menggoreng]
    answers: [mendengar]
    words: [mendengar, mengajar]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «ماما بتقلي رز»؟
      ar: كيف تقول «أمي تقلي الأرز»؟
      en: How do you say "Mum is frying rice"?
    options: ['Ibu menggoreng nasi.', 'Ibu mencuci nasi.', 'Ibu mendengar nasi.']
    answer: 0
    words: [menggoreng, mencuci, mendengar]
  - id: e10
    type: speaking
    text: Saya mengirim pesan ke Pak Irwan.
    meaning:
      ar_eg: أنا ببعت رسالة لأستاذ إيروان.
      ar: أرسل رسالة إلى الأستاذ إيروان.
      en: I'm sending a message to Pak Irwan.
    words: [mengirim, pesan]
dialogue:
  lines:
    - speaker: Raka
      text: Mohamed, kamu menonton apa?
      ar_eg: محمد، بتتفرج على إيه؟
      ar: محمد، ماذا تشاهد؟
      en: Mohamed, what are you watching?
    - speaker: Mohamed
      text: Aku menonton film Mesir. Kamu?
      ar_eg: بتفرج على فيلم مصري. وإنت؟
      ar: أشاهد فيلمًا مصريًّا. وأنت؟
      en: I'm watching an Egyptian film. You?
    - speaker: Raka
      text: Aku mencuci baju, lalu aku mengirim pesan ke Rina.
      ar_eg: بغسل هدوم، وبعدين هبعت رسالة لرينا.
      ar: أغسل الملابس، ثم أرسل رسالة إلى رينا.
      en: I'm washing clothes, then I'm sending Rina a message.
    - speaker: Mohamed
      text: Rina mengajar bahasa Indonesia hari ini?
      ar_eg: رينا بتدرّس إندونيسي النهارده؟
      ar: هل تدرّس رينا الإندونيسية اليوم؟
      en: Is Rina teaching Indonesian today?
    - speaker: Raka
      text: Ya, jam empat sore.
      ar_eg: أيوه، الساعة أربعة العصر.
      ar: نعم، في الرابعة عصرًا.
      en: Yes, at four p.m.
