schema: kabar.lesson/v1
id: bipa5.u05.l07
language: id
title: Kebun di hulu sungai
can_do:
  ar_eg: 'تتكلم عن الزراعة جنب منابع النهر: الأرض الخصبة والسماد والبذور والمخلفات، وتأثيرها على الضفادع والسحالي والفريسة.'
  ar: 'أن تتحدث عن الزراعة عند منابع النهر: الأرض الخصبة والسماد والبذور والمخلّفات، وأثرها في الضفادع والسحالي والفرائس.'
  en: 'Talk about farming upriver: fertile soil, fertiliser, seeds and waste, and their effect on frogs, lizards and prey.'
slides:
  - title: Dari hulu ke hilir
    body:
      ar_eg: |
        hulu = منبع النهر، أعلاه (عكسها hilir = المصب).
        subur = خصب، pupuk = سماد، benih = بذرة، تقاوي.
        limbah = مخلفات، نفايات (limbah pabrik = مخلفات مصانع).
        katak = ضفدعة، kadal = سحلية، mangsa = فريسة: Katak menjadi mangsa ular.
      ar: |
        hulu = منبع النهر، أعاليه (وعكسها hilir = المصبّ).
        subur = خصب، pupuk = سماد، benih = بذرة.
        limbah = مخلّفات، نفايات (limbah pabrik = مخلّفات المصانع).
        katak = ضفدع، kadal = سحلية، mangsa = فريسة: Katak menjadi mangsa ular.
      en: |
        hulu = upper course, upriver (opposite: hilir = downstream).
        subur = fertile, pupuk = fertiliser, benih = seed.
        limbah = waste (limbah pabrik = factory waste).
        katak = frog, kadal = lizard, mangsa = prey: Katak menjadi mangsa ular.
    examples:
      - text: Tanah di hulu sungai sangat subur.
        ar_eg: الأرض عند منبع النهر خصبة جدًا.
        ar: التربة في أعالي النهر خصبة جدًا.
        en: The soil upriver is very fertile.
      - text: Limbah pupuk mengalir ke sungai dan membunuh katak.
        ar_eg: مخلفات السماد بتنزل النهر وبتموّت الضفادع.
        ar: تتدفّق مخلّفات السماد إلى النهر وتقتل الضفادع.
        en: Fertiliser waste flows into the river and kills frogs.
      - text: Kadal kecil itu menunggu mangsanya di bawah daun.
        ar_eg: السحلية الصغيرة دي مستنية فريستها تحت الورقة.
        ar: تنتظر تلك السحلية الصغيرة فريستها تحت الورقة.
        en: That little lizard waits for its prey under a leaf.
