dialogue:
  lines:
    - speaker: Bu Lestari
      text: Ini kebun keluarga saya di hulu sungai. Tanahnya subur sekali.
      ar_eg: ده جنينة عيلتي عند منبع النهر. الأرض خصبة جدًا.
      ar: هذا بستان عائلتي في أعالي النهر. تربته خصبة جدًا.
      en: This is my family's garden upriver. The soil is very fertile.
    - speaker: Mohamed
      text: Ibu pakai pupuk kimia?
      ar_eg: حضرتك بتستعملي سماد كيماوي؟
      ar: هل تستخدمين سمادًا كيميائيًا؟
      en: Do you use chemical fertiliser?
    - speaker: Bu Lestari
      text: Sedikit saja. Kebun sawit di sebelah memakai banyak, dan limbahnya masuk ke sungai.
      ar_eg: شوية بس. مزرعة النخيل اللي جنبنا بتستعمل كتير، والمخلفات بتنزل النهر.
      ar: قليلًا فقط. مزرعة النخيل المجاورة تستخدم الكثير، وتصبّ مخلّفاتها في النهر.
      en: Just a little. The oil-palm estate next door uses a lot, and its waste goes into the river.
    - speaker: Mohamed
      text: Pantas saya jarang mendengar katak di sini.
      ar_eg: عشان كده نادرًا لما بسمع ضفادع هنا.
      ar: لهذا نادرًا ما أسمع الضفادع هنا.
      en: No wonder I rarely hear frogs here.
    - speaker: Bu Lestari
      text: Ya. Kalau katak hilang, ular dan burung kehilangan mangsa. Semuanya berhubungan.
      ar_eg: أيوه. لو الضفادع اختفت، التعابين والطيور تخسر فريستها. كله مربوط ببعضه.
      ar: نعم. إن اختفت الضفادع فقدت الأفاعي والطيور فرائسها. كل شيء مترابط.
      en: Yes. If the frogs vanish, snakes and birds lose their prey. It's all connected.
    - speaker: Mohamed
      text: Boleh saya bawa benih sayur dari kebun ini?
      ar_eg: ممكن آخد بذور خضار من الجنينة دي؟
      ar: هل يمكنني أخذ بذور خضار من هذا البستان؟
      en: May I take some vegetable seeds from this garden?
