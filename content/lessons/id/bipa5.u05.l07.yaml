schema: kabar.lesson/v1
id: bipa5.u05.l07
language: id
title: Esai sudut pandang
can_do:
  ar_eg: تكتب مقال قصير بتعرض فيه وجهتين نظر وبعدين رأيك إنت.
  ar: أن تكتب مقالة قصيرة تعرض وجهتي نظر ثم رأيك.
  en: Write a short essay that presents two viewpoints, then your own.
slides:
  - title: Menimbang lalu memutuskan
    grammar: id.passive.ter-ke-an
    body:
      ar_eg: |
        مقال وجهة النظر بيمشي كده:
        1. المشكلة: Hutan Kalimantan terancam. (مهدّدة، ter- = حالة)
        2. الرأي الأول، وبعده الرأي التاني.
        3. Setelah menimbang kedua pendapat, penulis berpendapat bahwa … = بعد ما وزن الرأيين، الكاتب شايف إن …
        menimbang = يوزن (زي الميزان).
      ar: |
        تسير مقالة وجهة النظر هكذا:
        1. المشكلة: Hutan Kalimantan terancam. (ter- للحالة)
        2. الرأي الأوّل ثم الثاني.
        3. Setelah menimbang kedua pendapat, penulis berpendapat bahwa … = بعد الموازنة بين الرأيين يرى الكاتب أنّ …
        وmenimbang = يزن.
      en: |
        A viewpoint essay goes:
        1. The problem: Hutan Kalimantan terancam. (ter- for a state)
        2. The first view, then the second.
        3. Setelah menimbang kedua pendapat, penulis berpendapat bahwa … = Having weighed both views, the writer believes that …
        menimbang = to weigh up.
    examples:
      - text: Setelah menimbang kedua pendapat, penulis berpendapat bahwa hutan adat harus dilindungi.
        ar_eg: بعد ما وزن الرأيين، الكاتب شايف إن غابة الأعراف لازم تتحمي.
        ar: بعد الموازنة بين الرأيين، يرى الكاتب وجوب حماية الغابة العرفية.
        en: Having weighed both views, the writer believes the customary forest must be protected.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: terancam
        ar_eg: مهدَّد
        ar: مهدَّد
        en: threatened
      - text: menimbang
        ar_eg: يوزن
        ar: يزن، يوازن
        en: to weigh up
      - text: berpendapat
        ar_eg: يرى / رأيه إن
        ar: يرى
        en: to be of the opinion
      - text: solusi
        ar_eg: حل
        ar: حلّ
        en: solution
    words: [terancam, menimbang, berpendapat, solusi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه أول جزء في مقال وجهة النظر؟
      ar: ما أوّل جزء في مقالة وجهة النظر؟
      en: What comes first in a viewpoint essay?
    options:
      - رأي الكاتب.
      - الخاتمة.
      - المشكلة.
    answer: 2
    words: [terancam]
  - id: e03
    type: fill_blank
    sentence: Setelah ___ kedua pendapat, saya memilih jalan tengah.
    meaning:
      ar_eg: بعد ما وزنت الرأيين، اخترت حل وسط.
      ar: بعد الموازنة بين الرأيين، اخترت حلًّا وسطًا.
      en: Having weighed both views, I chose a middle way.
    options: [menimbang, terancam, solusi]
    answers: [menimbang]
    words: [menimbang, jalan tengah]
  - id: e04
    type: listen
    text: Penulis berpendapat bahwa solusinya harus melibatkan masyarakat adat.
    question:
      ar_eg: الكاتب شايف إيه؟
      ar: ماذا يرى الكاتب؟
      en: What does the writer believe?
    options:
      - إن مفيش حل.
      - إن الحل لازم يشارك فيه المجتمع الأصلي.
      - إن الشركات بس تقرر.
    answer: 1
    words: [berpendapat, solusi]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الأورانجوتان مهدّد بسبب حرايق الغابات.
      ar: إنسان الغاب مهدَّد بسبب حرائق الغابات.
      en: Orangutans are threatened by forest fires.
    answer: Orangutan terancam karena kebakaran hutan.
    distractors: [menimbang, solusi]
    words: [terancam]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا شايف إن الحل لازم يكون عادل للطرفين.
      ar: أرى أنّ الحلّ يجب أن يكون عادلًا للطرفين.
      en: I believe the solution must be fair to both sides.
    answers:
      - Saya berpendapat bahwa solusinya harus adil bagi kedua pihak.
      - Saya berpendapat solusinya harus adil bagi kedua pihak.
      - Saya berpendapat bahwa solusi itu harus adil bagi kedua pihak.
      - Saya berpendapat bahwa solusinya harus adil untuk kedua pihak.
    words: [berpendapat, solusi]
  - id: e07
    type: dictation
    text: Hutan hujan Kalimantan terancam oleh kebakaran.
    meaning:
      ar_eg: الغابة المطيرة في كاليمانتان مهدّدة بالحرايق.
      ar: الغابة المطيرة في كاليمانتان مهدَّدة بالحرائق.
      en: Kalimantan's rainforest is threatened by fire.
    words: [terancam]
  - id: e08
    type: speaking
    text: Setelah menimbang kedua pendapat, saya berpendapat bahwa kita butuh jalan tengah.
    meaning:
      ar_eg: بعد ما وزنت الرأيين، أنا شايف إننا محتاجين حل وسط.
      ar: بعد الموازنة بين الرأيين، أرى أنّنا بحاجة إلى حلّ وسط.
      en: Having weighed both views, I believe we need a middle way.
    words: [menimbang, berpendapat, butuh, jalan tengah]
  - id: e09
    type: multiple_choice
    question: Petani butuh penghasilan, dan hutan butuh perlindungan. Kita butuh jalan tengah.
    question_meaning:
      ar_eg: الكاتب بيقترح إيه؟
      ar: ماذا يقترح الكاتب؟
      en: What does the writer suggest?
    options: ['Solusi yang adil bagi kedua pihak.', 'Menutup semua kebun sawit.', 'Menebang hutan untuk kebun.']
    answer: 0
    explain:
      ar_eg: jalan tengah = حل وسط، وbutuh = محتاج.
      ar: jalan tengah = حلّ وسط، وbutuh = يحتاج.
      en: jalan tengah = a compromise; butuh = need.
    words: [butuh, jalan tengah]
  - id: e10
    type: fill_blank
    sentence: Kedua pihak ___ jalan tengah.
    meaning:
      ar_eg: الطرفين محتاجين حل وسط.
      ar: يحتاج الطرفان إلى حلّ وسط.
      en: Both sides need a compromise.
    options: [butuh, menolak, membakar]
    answers: [butuh]
    words: [butuh, jalan tengah]
dialogue:
  title: Draf esai Mohamed
  lines:
    - speaker: Bu Lestari
      text: Esaimu sudah menimbang dua pendapat. Bagus.
      ar_eg: مقالك وزن رأيين. حلو.
      ar: وازنت مقالتك بين رأيين. أحسنت.
      en: Your essay weighs two views. Good.
    - speaker: Mohamed
      text: Tetapi saya ragu, Bu. Apakah saya boleh berpendapat sendiri?
      ar_eg: بس أنا متردد يا أستاذة. ينفع أقول رأيي أنا؟
      ar: لكنّي متردّد يا أستاذة. هل يجوز أن أبدي رأيي؟
      en: But I'm unsure, ma'am. Am I allowed to give my own opinion?
    - speaker: Bu Lestari
      text: Tentu. Di bagian akhir, tulis solusimu dengan jelas dan sopan.
      ar_eg: طبعًا. في الآخر، اكتب الحل بتاعك بوضوح وأدب.
      ar: بالطبع. اكتب حلّك في الختام بوضوح وأدب.
      en: Of course. At the end, write your solution clearly and politely.
    - speaker: Mohamed
      text: Baik. Saya akan menulis bahwa hutan adat perlu dilindungi bersama.
      ar_eg: ماشي. هكتب إن غابة الأعراف محتاجة تتحمي بمشاركة الكل.
      ar: حسنًا. سأكتب أنّ الغابة العرفية تحتاج إلى حماية مشتركة.
      en: All right. I'll write that the customary forest needs protecting together.
new_words:
  - word: menimbang
    pos: verb
    ar_eg: يوزن
    ar: يزن، يوازن
    en: to weigh up
  - word: butuh
    pos: verb
    ar_eg: محتاج (= membutuhkan، أقل رسمية)
    ar: يحتاج (= membutuhkan، أقل رسمية)
    en: to need (less formal membutuhkan)
  - word: jalan tengah
    pos: noun
    ar_eg: حل وسط
    ar: حلّ وسط
    en: middle way, compromise
review:
  status: draft
  verified: false
