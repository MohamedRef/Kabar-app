  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تسأل «رقم تليفونك كام؟»
      ar: كيف تسأل «ما رقم هاتفك؟»
      en: How do you ask "What's your phone number?"
    options: ['Nomor HP-mu berapa?', 'Kapan toko itu tutup?', 'Umurmu berapa tahun?']
    answer: 0
    words: [nomor, HP]
  - id: e10
    type: speaking
    text: Nomor HP saya nol delapan satu dua. Umur saya dua puluh tahun.
    meaning:
      ar_eg: رقم تليفوني صفر تمانية واحد اتنين. عندي عشرين سنة.
      ar: رقم هاتفي صفر ثمانية واحد اثنان. عمري عشرون عامًا.
      en: My phone number is zero-eight-one-two. I'm twenty years old.
    words: [nomor, HP, umur, tahun]
dialogue:
  title: Pagi di Tanah Abang
  lines:
    - speaker: Mohamed
      text: Permisi, Mas. Sekarang jam berapa?
      ar_eg: لو سمحت، الساعة كام دلوقتي؟
      ar: من فضلك، كم الساعة الآن؟
      en: Excuse me. What time is it now?
    - speaker: Mas Eko
      text: Jam delapan kurang seperempat.
      ar_eg: تمانية إلا ربع.
      ar: الثامنة إلا ربعًا.
      en: A quarter to eight.
    - speaker: Mohamed
      text: Kapan toko batik itu buka?
      ar_eg: محل الباتيك ده بيفتح إمتى؟
      ar: متى يفتح متجر الباتيك ذاك؟
      en: When does that batik shop open?
    - speaker: Mas Eko
      text: Jam delapan. Tutup jam lima sore.
      ar_eg: الساعة تمانية. وبيقفل خمسة العصر.
      ar: في الثامنة، ويغلق في الخامسة مساءً.
      en: At eight. It closes at five p.m.
    - speaker: Mohamed
      text: Terima kasih, Mas!
      ar_eg: شكرًا!
      ar: شكرًا!
      en: Thank you!
    - speaker: Mas Eko
      text: Sama-sama.
      ar_eg: العفو.
      ar: العفو.
      en: You're welcome.
