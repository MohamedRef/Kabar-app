      ar: يفتح ذلك المتجر في الثامنة صباحًا.
      en: That shop opens at 8 a.m.
    options: [malam, sore, pagi]
    answers: [pagi]
    words: [toko, buka, pagi]
  - id: e04
    type: build_sentence
    source:
      ar_eg: المحل ده بيفتح الساعة كام؟
      ar: في أيّ ساعة يفتح ذلك المتجر؟
      en: What time does that shop open?
    answer: Jam berapa toko itu buka?
    alternatives: ['Toko itu buka jam berapa?']
    distractors: [siapa, tutup]
    words: [jam, berapa, toko, buka]
  - id: e05
    type: build_sentence
    source:
      ar_eg: عندي خمسة وعشرين سنة.
      ar: عمري خمسة وعشرون عامًا.
      en: I'm twenty-five years old.
    answer: Umur saya dua puluh lima tahun.
    distractors: [jam, belas]
    words: [umur, tahun]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لصاحبك) رقم موبايلك كام؟
      ar: (لصديقك) ما رقم هاتفك؟
      en: (to a friend) What's your phone number?
    answers: ['Nomor HP-mu berapa?', 'Nomor HP kamu berapa?', 'Berapa nomor HP-mu?', 'Berapa nomor HP kamu?', 'Nomor HPmu berapa?', 'Nomor teleponmu berapa?', Nomor HP-mu berapa]
    words: [nomor, berapa]
  - id: e07
    type: translate
    direction: from_target
    source_text: Toko ini buka jam sembilan pagi dan tutup jam sembilan malam.
    answers_meaning:
      ar_eg: [المحل ده بيفتح ٩ الصبح وبيقفل ٩ بالليل., المحل بيفتح الساعة تسعة الصبح ويقفل الساعة تسعة بالليل]
      ar: [يفتح هذا المتجر في التاسعة صباحًا ويغلق في التاسعة مساءً., هذا المتجر يفتح التاسعة صباحًا ويغلق التاسعة ليلًا]
      en: [This shop opens at 9 a.m. and closes at 9 p.m., This shop opens at nine in the morning and closes at nine at night]
    words: [toko, buka, tutup]
  - id: e08
    type: listen
    text: Toko itu tutup jam sembilan malam.
    options: ['Toko itu tutup jam sembilan malam.', 'Toko itu buka jam sembilan malam.', 'Toko itu tutup jam sembilan pagi.']
    answer: 0
    meaning:
      ar_eg: المحل ده بيقفل الساعة ٩ بالليل.
      ar: ذلك المتجر يغلق في التاسعة مساءً.
      en: That shop closes at nine p.m.
