schema: kabar.lesson/v1
id: bipa7.u07.l10
language: id
title: Ulangan Unit 7
can_do:
  ar_eg: تتكلّم عن مؤسسات الدولة والانتخابات، وتظبط كلامك على اللي بيسمعك.
  ar: أن تتحدّث عن مؤسسات الدولة والانتخابات، وتكيّف كلامك مع سامعك.
  en: Discuss state institutions and elections, tuning your words to your audience.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: khalayak
        ar_eg: الجمهور
        ar: الجمهور
        en: the public, audience
      - text: DPR
        ar_eg: البرلمان
        ar: البرلمان
        en: parliament (DPR)
      - text: pemilu
        ar_eg: الانتخابات
        ar: الانتخابات العامة
        en: general election
      - text: golput
        ar_eg: مقاطعة التصويت
        ar: الامتناع عن التصويت
        en: abstaining (not voting)
      - text: aspirasi
        ar_eg: مطالب الناس
        ar: تطلّعات الناس ومطالبهم
        en: aspirations, demands
    words: [khalayak, DPR, pemilu, golput, aspirasi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة مكتوبة بأسلوب مؤدّب لمسؤول؟
      ar: أيّ جملة مكتوبة بأسلوب مهذّب لمسؤول؟
      en: Which sentence is written courteously for an official?
    options:
      - Pak, jalannya kapan dibenerin sih?
      - Kami mohon Bapak berkenan meninjau pelayanan publik di desa kami.
      - Buruan perbaiki!
    answer: 1
    words: [santun, pelayanan publik]
  - id: e03
    type: fill_blank
    sentence: Pada hari pemilu, pemilih ___ surat suara dengan paku.
    meaning:
      ar_eg: يوم الانتخابات، الناخب بيخرّم ورقة التصويت بمسمار.
      ar: يوم الانتخابات يثقب الناخب ورقة الاقتراع بمسمار.
      en: On election day, voters punch the ballot with a nail.
    options: [mencoblos, mengesahkan, menyesuaikan]
    answers: [mencoblos]
    words: [mencoblos, pemilih, surat suara, mengesahkan, menyesuaikan]
  - id: e04
    type: listen
    text: Pembawa berita mengumumkan bahwa DPR telah mengesahkan undang-undang itu.
    question:
      ar_eg: المذيع أعلن إيه؟
      ar: ماذا أعلن مقدّم الأخبار؟
      en: What did the anchor announce?
    options:
      - إن الانتخابات اتأجّلت.
      - إن الجيش وصل.
      - إن البرلمان أقرّ القانون.
    answer: 2
    words: [pembawa berita, DPR, mengesahkan, undang-undang]
  - id: e05
    type: build_sentence
    source:
      ar_eg: كل مواطن ليه حق التصويت.
      ar: لكلّ مواطن حقّ الاقتراع.
      en: Every citizen has the right to vote.
    answer: Setiap warga negara punya hak pilih.
    distractors: [golput, lugas]
    words: [hak pilih]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الـ «lembaga negara» اللي بيساعد في الكوارث في الخبر؟
      ar: ما الـ «lembaga negara» التي تساعد في الكوارث في الخبر؟
      en: Which "lembaga negara" helps in disasters in the news story?
    options: [TNI, pembaca sasaran, artikel opini]
    answer: 0
    words: [TNI, lembaga negara, pembaca sasaran]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: في تقديري، المشاركة في الانتخابات مسؤولية.
      ar: في تقديري، المشاركة في الانتخابات مسؤولية.
      en: In my humble view, taking part in elections is a responsibility.
    answers:
      - Menurut hemat saya, partisipasi dalam pemilu adalah tanggung jawab.
      - Menurut hemat saya, partisipasi dalam pemilu merupakan tanggung jawab.
      - Menurut hemat saya, partisipasi di pemilu adalah tanggung jawab.
    words: [menurut hemat saya, partisipasi, pemilu]
  - id: e08
    type: speaking
    text: Wakil rakyat menerima pengaduan warga tentang lampu jalan.
    meaning:
      ar_eg: نايب الشعب استلم شكوى الأهالي عن نور الشارع.
      ar: تسلّم نائب الشعب شكوى الأهالي بشأن إنارة الطريق.
      en: The representative received residents' complaint about the street lights.
    words: [wakil rakyat, pengaduan]
  - id: e09
    type: dictation
    text: Artikel opini itu ditulis dengan bahasa yang lugas.
    meaning:
      ar_eg: مقال الرأي ده متكتب بلغة مباشرة وواضحة.
      ar: كُتب مقال الرأي ذاك بلغة مباشرة واضحة.
      en: That op-ed is written in plain language.
    words: [artikel opini, lugas]
  - id: e10
    type: translate
    direction: from_target
    source_text: Berita untuk khalayak harus lugas, sedangkan surat kepada pejabat harus santun.
    answers_meaning:
      ar_eg:
        - الخبر للجمهور لازم يبقى مباشر، أما الجواب للمسؤول لازم يبقى مؤدّب.
        - للناس اكتب ببساطة، وللمسؤول اكتب بأدب.
      ar:
        - يجب أن يكون الخبر للجمهور مباشرًا، أمّا الرسالة إلى المسؤول فمهذّبة.
        - الخبر للعامّة مباشر، والرسالة للمسؤول مهذّبة.
      en:
        - News for the public should be plain, whereas a letter to an official should be courteous.
        - Write plainly for the public and courteously to officials.
    words: [khalayak, lugas, santun]
  - id: e11
    type: match_pairs
    pairs:
      - text: pemekaran
        ar_eg: تقسيم منطقة
        ar: تقسيم إداريّ
        en: splitting a region
      - text: dana desa
        ar_eg: فلوس القرية
        ar: أموال القرية
        en: village funds
      - text: sensor
        ar_eg: رقابة
        ar: رقابة
        en: censorship
      - text: hak jawab
        ar_eg: حق الردّ
        ar: حقّ الردّ
        en: right of reply
      - text: kandidat
        ar_eg: مرشّح
        ar: مرشّح
        en: candidate
    words: [pemekaran, dana desa, sensor, hak jawab, kandidat]
  - id: e12
    type: multiple_choice
    question_meaning:
      ar_eg: أهل القرية عايزين يختاروا بين طريق ومية نضيفة. ده بيحصل فين؟
      ar: يريد أهل القرية الاختيار بين طريق وماء نظيف. أين يحدث ذلك؟
      en: Villagers want to choose between a road and clean water. Where does that happen?
    options:
      - في Dewan Pers.
      - في الـ musrenbang.
      - في الـ DPR بس.
    answer: 1
    explain:
      ar_eg: في الـ musrenbang الـ warga desa بيحدّدوا الـ prioritas لفلوس القرية.
      ar: في الـ musrenbang يحدّد الـ warga desa الـ prioritas لأموال القرية.
      en: At the musrenbang the warga desa set the prioritas for village funds.
    words: [musrenbang, warga desa, prioritas]
dialogue:
  title: Perahu ke Pulau Mansinam
  lines:
    - speaker: Bu Debora
      text: Hari libur kita ke Mansinam. Pulau kecil ini penting bagi sejarah Papua.
      ar_eg: في الإجازة هنروح مانسينام. الجزيرة الصغيرة دي مهمّة لتاريخ بابوا.
      ar: سنذهب في العطلة إلى مانسينام، فهذه الجزيرة الصغيرة مهمّة لتاريخ بابوا.
      en: On our day off we're going to Mansinam. This little island matters to Papua's history.
    - speaker: Mohamed
      text: Saya baca tentang dua misionaris yang datang pada tahun 1855.
      ar_eg: قريت عن اتنين مبشّرين جم سنة 1855.
      ar: قرأتُ عن مبشّرَين وصلا عام 1855.
      en: I read about two missionaries who arrived in 1855.
    - speaker: Bu Debora
      text: Betul. Sekarang tanggal 5 Februari diperingati setiap tahun di Tanah Papua.
      ar_eg: صح. ودلوقتي يوم 5 فبراير بيتحتفل بيه كل سنة في بابوا.
      ar: صحيح، ويُحتفى بالخامس من فبراير كلّ عام في أرض بابوا.
      en: Right. Now the 5th of February is commemorated every year across Papua.
    - speaker: Mohamed
      text: Terima kasih untuk semuanya, Bu. Minggu depan saya ke Jayapura.
      ar_eg: شكرًا على كل حاجة يا مدام. الأسبوع الجاي رايح جايابورا.
      ar: شكرًا على كلّ شيء يا سيّدتي. الأسبوع القادم إلى جايابورا.
      en: Thank you for everything, Bu. Next week I'm off to Jayapura.
souvenir:
  id: bipa7.u07.souvenir
  title: Pulau Mansinam
  note:
    ar_eg: مانسينام جزيرة صغيرة قصاد مانوكواري. في 5 فبراير 1855 نزل عليها مبشّرين ألمان، أوتّو وجايسلر، ويوم 5 فبراير بقى عطلة في أقاليم بابوا للاحتفال بدخول الإنجيل. وبمناسبة الوحدة دي، إندونيسيا جمهورية رئاسية، والشعب بينتخب الرئيس مباشرة، والـ DPR (البرلمان) والـ TNI (الجيش) بيظهروا كل يوم في الأخبار.
    ar: مانسينام جزيرة صغيرة قبالة مانوكواري، نزل عليها في 5 فبراير 1855 مبشّران ألمانيّان هما أوتّو وغايسلر، وصار هذا اليوم عطلة في أقاليم بابوا احتفاءً بوصول الإنجيل. وإندونيسيا جمهورية رئاسية ينتخب الشعب رئيسها مباشرة، ويظهر الـ DPR (البرلمان) والـ TNI (الجيش) في الأخبار يوميًّا.
    en: Mansinam is a small island off Manokwari. On 5 February 1855 two German missionaries, Ottow and Geissler, landed there, and the date is now a holiday in Papua marking the arrival of the Gospel. Indonesia is a presidential republic with direct elections; the DPR (parliament) and TNI (armed forces) feature in the news every day.
