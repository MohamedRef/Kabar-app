schema: kabar.lesson/v1
id: bipa7.u07.l10
language: id
title: Pasal karet
can_do:
  ar_eg: تتكلّم عن قانون بيتقال إنه بيقيّد حرية الكلام، وعن خطوات القضية.
  ar: أن تتحدّث عن قانون يُقال إنه يقيّد حرّية الكلام، وعن مراحل القضية.
  en: Discuss a law said to limit free speech, and the steps of a court case.
slides:
  - title: Kritik dan hukum
    body:
      ar_eg: |
        UU ITE (قانون المعلومات والمعاملات الإلكترونية) اتعدّل سنة 2016 و2024.
        النقّاد بيسمّوا بعض مواده «pasal karet» (مواد مطّاطة) لأنها بتتفسّر بأشكال كتير.
        القضايا غالبًا عن pencemaran nama baik (التشهير). قبل القضية ممكن ييجي somasi (إنذار رسمي).
        لو المحكمة أصدرت vonis (حكم) ضد حد انتقد بأدب، الناس بتسمّي ده kriminalisasi.
        الخوف ده بيعمل swasensor (رقابة ذاتية) وبيضرّ kebebasan berekspresi (حرية التعبير).
        advokat = محامي.
      ar: |
        عُدّل UU ITE (قانون المعلومات والمعاملات الإلكترونية) عامي 2016 و2024.
        ويسمّي المنتقدون بعض موادّه «pasal karet» (موادّ مطّاطة) لأنها تقبل تأويلات كثيرة.
        وكثير من القضايا عن pencemaran nama baik (التشهير)، وقد يسبقها somasi (إنذار قانوني).
        فإن أصدرت المحكمة vonis (حكمًا) على منتقد مهذّب سمّى الناس ذلك kriminalisasi.
        ويولّد هذا الخوف swasensor (رقابة ذاتية) ويضرّ kebebasan berekspresi.
        advokat = محامٍ.
      en: |
        The UU ITE (Electronic Information and Transactions Law) was amended in 2016 and 2024.
        Critics call some articles "pasal karet" (rubber articles) because they stretch to many readings.
        Many cases are about pencemaran nama baik (defamation). A somasi (formal warning) may come first.
        When a court hands down a vonis against a polite critic, people call it kriminalisasi.
        The fear causes swasensor (self-censorship) and harms kebebasan berekspresi.
        advokat = lawyer.
    examples:
      - text: Dia dilaporkan dengan UU ITE karena ulasan di internet.
        ar_eg: اتعمل فيها بلاغ بقانون المعلومات علشان ريفيو على النت.
        ar: أُبلغ عنها بموجب قانون المعلومات بسبب مراجعة على الإنترنت.
        en: She was reported under the ITE Law over an online review.
      - text: Pengacara itu mengirim somasi sebelum menggugat.
        ar_eg: المحامي بعت إنذار رسمي قبل ما يرفع القضية.
        ar: أرسل المحامي إنذارًا قانونيًّا قبل رفع الدعوى.
        en: The lawyer sent a formal warning before suing.
      - text: Banyak wartawan melakukan swasensor karena takut.
        ar_eg: صحفيين كتير بيراقبوا نفسهم من الخوف.
        ar: يمارس صحفيون كثيرون رقابة ذاتية خوفًا.
        en: Many journalists self-censor out of fear.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: UU ITE
        ar_eg: قانون المعلومات والمعاملات الإلكترونية
        ar: قانون المعلومات والمعاملات الإلكترونية
        en: Electronic Information and Transactions Law
      - text: pencemaran nama baik
        ar_eg: تشهير / إساءة للسمعة
        ar: التشهير
        en: defamation
      - text: somasi
        ar_eg: إنذار رسمي قبل القضية
        ar: إنذار قانوني
        en: formal legal warning (cease-and-desist)
      - text: kriminalisasi
        ar_eg: تجريم (معاملة حد كأنه مجرم من غير وجه حق)
        ar: التجريم
        en: criminalisation
    words: [UU ITE, pencemaran nama baik, somasi, kriminalisasi]
  - id: e02
    type: match_pairs
    pairs:
      - text: kebebasan berekspresi
        ar_eg: حرية التعبير
        ar: حرّية التعبير
        en: freedom of expression
      - text: swasensor
        ar_eg: رقابة ذاتية
        ar: الرقابة الذاتية
        en: self-censorship
      - text: vonis
        ar_eg: حكم المحكمة
        ar: حكم قضائي
        en: verdict, sentence
      - text: advokat
        ar_eg: محامي
        ar: محامٍ
        en: advocate, lawyer
    words: [kebebasan berekspresi, swasensor, vonis, advokat]
  - id: e03
    type: listen
    text: Hakim menjatuhkan vonis tiga bulan penjara.
    question:
      ar_eg: القاضي عمل إيه؟
      ar: ماذا فعل القاضي؟
      en: What did the judge do?
    options: [حكم, إنذار, تشهير]
    answer: 0
    meaning:
      ar_eg: القاضي حكم بتلات شهور سجن.
      ar: أصدر القاضي حكمًا بالسجن ثلاثة أشهر.
      en: The judge handed down a three-month prison sentence.
    words: [vonis]
  - id: e04
    type: fill_blank
    sentence: Sebelum ke pengadilan, perusahaan itu mengirim ___ kepada penulis blog.
    meaning:
      ar_eg: قبل المحكمة، الشركة دي بعتت ___ لصاحب المدوّنة.
      ar: قبل المحكمة أرسلت الشركة ___ إلى صاحب المدوّنة.
      en: Before going to court, the company sent the blogger a ___.
    options: [somasi, swasensor, advokat]
    answers: [somasi]
    words: [somasi, swasensor, advokat]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الصحفيين بيعملوا «swasensor»؟
      ar: لماذا يمارس الصحفيون «swasensor»؟
      en: Why do journalists practise 'swasensor'?
    options: [Karena takut dilaporkan dengan pasal pencemaran nama baik., Karena tidak suka menulis., Karena ada libur nasional.]
    answer: 0
    explain:
      ar_eg: الخوف من قضايا التشهير بيخلّيهم يراقبوا نفسهم.
      ar: الخوف من قضايا التشهير يدفعهم إلى الرقابة الذاتية.
      en: Fear of defamation cases makes them censor themselves.
    words: [swasensor, pencemaran nama baik]
  - id: e06
    type: fill_blank
    sentence: Para aktivis menyebut kasus guru itu sebagai ___.
    meaning:
      ar_eg: النشطاء بيسمّوا قضية المدرّسة دي ___.
      ar: يصف الناشطون قضية تلك المعلّمة بأنها ___.
      en: Activists call that teacher's case ___.
    options: [kriminalisasi, vonis, UU ITE]
    answers: [kriminalisasi]
    words: [kriminalisasi, vonis, UU ITE]
  - id: e07
    type: build_sentence
    source:
      ar_eg: المحامي دافع عن الطالب مجانًا.
      ar: دافع المحامي عن الطالب مجّانًا.
      en: The lawyer defended the student for free.
    answer: Advokat itu membela mahasiswa itu secara gratis.
    distractors: [somasi, vonis]
    words: [advokat]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kebebasan berekspresi dilindungi oleh konstitusi.
    answers_meaning:
      ar_eg: [حرية التعبير محمية بالدستور, الدستور بيحمي حرية التعبير]
      ar: [حرّية التعبير يحميها الدستور, يكفل الدستور حرّية التعبير]
      en: [Freedom of expression is protected by the constitution, The constitution protects freedom of expression]
    words: [kebebasan berekspresi]
  - id: e09
    type: speaking
    text: Kritik yang sopan bukan pencemaran nama baik, jadi somasi itu tidak adil.
    meaning:
      ar_eg: النقد المؤدّب مش تشهير، فالإنذار ده ظالم.
      ar: النقد المهذّب ليس تشهيرًا، فذلك الإنذار غير عادل.
      en: Polite criticism isn't defamation, so that warning is unfair.
    words: [pencemaran nama baik, somasi]
  - id: e10
    type: multiple_choice
    question: Mengapa beberapa pasal UU ITE disebut "pasal karet"?
    options: [Karena dicetak di atas karet., Karena bisa ditafsirkan dengan banyak cara., Karena hanya berlaku untuk advokat.]
    answer: 1
    explain:
      ar_eg: «مطّاطة» يعني ممكن تتفسّر بأشكال كتير.
      ar: «مطّاطة» أي قابلة لتأويلات كثيرة.
      en: '''Rubber'' means it stretches to many readings.'
    words: [UU ITE, advokat, kriminalisasi, kebebasan berekspresi, swasensor]
dialogue:
  lines:
    - speaker: Bu Debora
      text: Mohamed, pendengar kita yang mengkritik jalan rusak menerima somasi.
      ar_eg: يا محمد، المستمع بتاعنا اللي انتقد الطريق المكسّر جاله إنذار رسمي.
      ar: يا محمد، تلقّى مستمعنا الذي انتقد الطريق المتهالك إنذارًا قانونيًّا.
      en: Mohamed, our listener who criticised the broken road got a formal warning.
    - speaker: Mohamed
      text: Dengan tuduhan pencemaran nama baik, Bu?
      ar_eg: بتهمة التشهير يا أستاذة؟
      ar: بتهمة التشهير يا سيّدتي؟
      en: On a defamation charge, ma'am?
    - speaker: Bu Debora
      text: Ya, memakai UU ITE. Sekarang dia sudah punya advokat.
      ar_eg: أيوه، بقانون المعلومات. ودلوقتي معاه محامي.
      ar: نعم، بموجب قانون المعلومات، وقد وكّل محاميًا.
      en: Yes, under the ITE Law. He has a lawyer now.
    - speaker: Mohamed
      text: Kalau begini, orang lain akan takut bicara. Itu swasensor.
      ar_eg: لو كده، الناس التانية هتخاف تتكلّم. ودي رقابة ذاتية.
      ar: بهذا سيخاف الآخرون من الكلام، وهذه رقابة ذاتية.
      en: Like this, others will be scared to speak. That's self-censorship.
    - speaker: Bu Debora
      text: Karena itu kita liput dengan berimbang, demi kebebasan berekspresi.
      ar_eg: علشان كده هنغطّيها بتوازن، علشان حرية التعبير.
      ar: لذلك سنغطّيها بتوازن، صونًا لحرّية التعبير.
      en: That's why we'll cover it fairly, for freedom of expression.
