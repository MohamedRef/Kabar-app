schema: kabar.lesson/v1
id: bipa5.u01.l04
language: id
title: Riwayat hidup
can_do:
  ar_eg: تكتب خبرتك ودراستك في سي في إندونيسي بعبارات رسمية مظبوطة.
  ar: أن تكتب خبرتك ودراستك في سيرة ذاتية إندونيسية بعبارات رسمية دقيقة.
  en: Describe your studies and experience in an Indonesian CV with the right formal phrases.
slides:
  - title: Isi riwayat hidup
    body:
      ar_eg: |
        السي في الإندونيسي (riwayat hidup أو CV) ليه أقسام ثابتة:
        - Data pribadi = البيانات الشخصية
        - Pendidikan terakhir = آخر مؤهل دراسي: S1 = بكالوريوس، S2 = ماجستير
        - Pengalaman kerja = الخبرة، وفيها magang = تدريب في شركة
        - Bahasa = اللغات: Fasih berbahasa Arab = بيتكلم عربي بطلاقة
        - Sertifikat = الشهادات (TOEFL، BIPA…)
        وفي الخبرة استخدم أفعال قوية من غير «saya»:
        - Bertanggung jawab atas … = مسؤول عن …
        - Menangani … = اتعامل مع / تولّى …
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: cuma = hanya، terus = lalu، aku = saya.
      ar: |
        للسيرة الذاتية الإندونيسية (riwayat hidup أو CV) أقسام ثابتة:
        - Data pribadi = البيانات الشخصية
        - Pendidikan terakhir = آخر مؤهل دراسي: S1 = بكالوريوس، وS2 = ماجستير
        - Pengalaman kerja = الخبرة، ومنها magang = التدريب في مؤسسة
        - Bahasa = اللغات: Fasih berbahasa Arab = يتحدّث العربية بطلاقة
        - Sertifikat = الشهادات (TOEFL وBIPA وغيرهما)
        وفي قسم الخبرة استعمل أفعالًا قوية دون «saya»:
        - Bertanggung jawab atas … = مسؤول عن …
        - Menangani … = تولّى …، عالج …
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: cuma = hanya، terus = lalu، aku = saya.
      en: |
        An Indonesian CV (riwayat hidup or CV) has fixed sections:
        - Data pribadi = personal details
        - Pendidikan terakhir = highest education: S1 = bachelor's, S2 = master's
        - Pengalaman kerja = work experience, including magang = an internship
        - Bahasa = languages: Fasih berbahasa Arab = fluent in Arabic
        - Sertifikat = certificates (TOEFL, BIPA…)
        Under experience, use strong verbs without «saya»:
        - Bertanggung jawab atas … = responsible for …
        - Menangani … = handled …
        The dialogue uses street forms; the formal ones are beside them: cuma = hanya, terus = lalu, aku = saya.
    examples:
      - text: Bertanggung jawab atas terjemahan kontrak dari bahasa Arab.
        ar_eg: مسؤول عن ترجمة العقود من العربي.
        ar: مسؤول عن ترجمة العقود من العربية.
        en: Responsible for translating contracts from Arabic.
      - text: Fasih berbahasa Arab dan Inggris, lisan dan tulisan.
        ar_eg: بطلاقة في العربي والإنجليزي، كلام وكتابة.
        ar: يجيد العربية والإنجليزية بطلاقة، تحدّثًا وكتابة.
        en: Fluent in Arabic and English, spoken and written.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pendidikan terakhir
        ar_eg: آخر مؤهل دراسي
        ar: آخر مؤهل دراسي
        en: highest education
      - text: fasih
        ar_eg: بطلاقة
        ar: بطلاقة
        en: fluent
      - text: magang
        ar_eg: تدريب في شركة
        ar: تدريب في مؤسسة
        en: internship
      - text: sertifikat
        ar_eg: شهادة
        ar: شهادة
        en: certificate
      - text: menangani
        ar_eg: يتعامل مع / يتولّى
        ar: يتولّى، يعالج
        en: to handle
    words: [pendidikan terakhir, fasih, magang, sertifikat, menangani]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: في سي في مكتوب «Bertanggung jawab atas keuangan kantor». يعني إيه؟
      ar: في سيرة ذاتية عبارة «Bertanggung jawab atas keuangan kantor». ما معناها؟
      en: A CV says "Bertanggung jawab atas keuangan kantor". What does it mean?
    options:
      - اشتغل في مكتب بنك.
      - طلب سلفة من المكتب.
      - مسؤول عن حسابات المكتب.
    answer: 2
    explain:
      ar_eg: bertanggung jawab atas = مسؤول عن، وkeuangan = الماليات / الحسابات.
      ar: bertanggung jawab atas = مسؤول عن، وkeuangan = الشؤون المالية.
      en: bertanggung jawab atas = responsible for; keuangan = finances.
    words: [bertanggung jawab]
  - id: e03
    type: fill_blank
    sentence: Saya ___ berbahasa Arab, Inggris, dan Indonesia.
    meaning:
      ar_eg: أنا بتكلم عربي وإنجليزي وإندونيسي بطلاقة.
      ar: أتحدّث العربية والإنجليزية والإندونيسية بطلاقة.
      en: I'm fluent in Arabic, English and Indonesian.
    options: [fasih, magang, sertifikat]
    answers: [fasih]
    words: [fasih]
    explain:
      ar_eg: fasih = بطلاقة، وبتيجي قبل berbahasa. magang = تدريب وsertifikat = شهادة، مش وصف للكلام.
      ar: fasih = بطلاقة، وتأتي قبل berbahasa. أما magang فالتدريب، وsertifikat الشهادة، وليسا وصفًا للتحدّث.
      en: fasih means fluent and goes before berbahasa. magang (internship) and sertifikat (certificate) don't describe speaking.
  - id: e04
    type: listen
    text: Saya pernah magang selama enam bulan di sebuah bank dan menangani arsip nasabah.
    question:
      ar_eg: هو اتدرب فين؟
      ar: أين تدرّب؟
      en: Where did he do his internship?
    options:
      - في شركة بترول.
      - في بنك.
      - في مدرسة.
    answer: 1
    words: [magang, menangani]
  - id: e05
    type: build_sentence
    source:
      ar_eg: كمترجم، كنت بتولى المستندات القانونية والعقود.
      ar: بصفتي مترجمًا، تولّيت الوثائق القانونية والعقود.
      en: As a translator, I handled legal documents and contracts.
    answer: Sebagai penerjemah, saya menangani dokumen hukum dan kontrak.
    distractors: [fasih, magang]
    words: [menangani]
    explain:
      ar_eg: «بتولّى» = menangani. fasih = بطلاقة وmagang = تدريب، ومش أفعال تاخد «مستندات».
      ar: «تولّى» = menangani. أما fasih فـ«بطلاقة»، وmagang التدريب، وليسا فعلين يتعدّيان إلى الوثائق.
      en: "\"Handled\" is menangani. fasih (fluent) and magang (internship) aren't verbs that take \"documents\"."
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: آخر مؤهل ليا بكالوريوس أدب عربي من جامعة القاهرة.
      ar: آخر مؤهل دراسي لي بكالوريوس في الأدب العربي من جامعة القاهرة.
      en: My highest qualification is a bachelor's in Arabic literature from Cairo University.
    answers:
      - Pendidikan terakhir saya S1 Sastra Arab dari Universitas Kairo.
      - Pendidikan terakhir saya adalah S1 Sastra Arab dari Universitas Kairo.
      - Pendidikan terakhir saya S1 sastra Arab di Universitas Kairo.
      - Pendidikan terakhir saya adalah S1 Sastra Arab di Universitas Kairo.
    explain:
      ar_eg: S1 هي البكالوريوس، وأسماء الأقسام بتتكتب بحرف كبير في السي في.
      ar: S1 هي البكالوريوس، وتُكتب أسماء التخصّصات بحرف كبير في السيرة الذاتية.
      en: S1 is the bachelor's level; subject names take capitals on a CV.
    words: [pendidikan terakhir]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي سطر ينفع يتكتب في سي في رسمي؟
      ar: أيّ سطر يصلح لسيرة ذاتية رسمية؟
      en: Which line belongs in a formal CV?
    options:
      - Fasih berbahasa Arab (lisan dan tulisan).
      - Aku jago banget bahasa Arab.
      - Bisa bahasa Arab dikit-dikit, sih.
    answer: 0
    explain:
      ar_eg: 'السي في رسمي: من غير aku ولا banget ولا sih.'
      ar: السيرة الذاتية رسمية، فلا مكان فيها لـ aku وbanget وsih.
      en: A CV is formal, so no aku, banget or sih.
    words: [fasih]
  - id: e08
    type: speaking
    text: Saya bertanggung jawab atas semua sertifikat dan dokumen karyawan.
    meaning:
      ar_eg: أنا مسؤول عن كل شهادات ومستندات الموظفين.
      ar: أنا مسؤول عن جميع شهادات الموظفين ووثائقهم.
      en: I'm responsible for all the staff's certificates and documents.
    words: [bertanggung jawab, sertifikat]
  - id: e09
    type: dictation
    text: Pendidikan terakhir saya S1, dan saya punya sertifikat BIPA.
    meaning:
      ar_eg: آخر مؤهل ليا بكالوريوس، وعندي شهادة BIPA.
      ar: آخر مؤهل لي البكالوريوس، ولديّ شهادة BIPA.
      en: My highest qualification is a bachelor's, and I have a BIPA certificate.
    words: [pendidikan terakhir, sertifikat]
  - id: e10
    type: fill_blank
    sentence: Selama ___ di Pertamina, saya bertanggung jawab atas laporan harian.
    meaning:
      ar_eg: وقت التدريب في برتامينا، كنت مسؤول عن التقارير اليومية.
      ar: خلال التدريب في برتامينا، كنت مسؤولًا عن التقارير اليومية.
      en: During my internship at Pertamina, I was responsible for the daily reports.
    options: [magang, fasih, menangani]
    answers: [magang]
    words: [magang, bertanggung jawab]
    explain:
      ar_eg: Selama magang = «وقت التدريب». fasih صفة للكلام، وmenangani فعل «يتولّى»، والاتنين مايجوش بعد selama هنا.
      ar: Selama magang = «خلال التدريب». أما fasih فصفة للتحدّث، وmenangani فعل «يتولّى»، ولا يناسبان ما بعد selama هنا.
      en: Selama magang is "during the internship". fasih describes speaking and menangani is "to handle"; neither fits after selama here.
dialogue:
  title: Memperbaiki CV
  lines:
    - speaker: Rina
      text: Mohamed, di CV-mu kok cuma tertulis "saya bisa bahasa Arab"? Kurang kuat, tuh!
      ar_eg: يا محمد، في السي في بتاعك مكتوب «بعرف عربي». ضعيفة!
      ar: يا محمد، في سيرتك الذاتية «أعرف العربية». هذا ضعيف!
      en: Mohamed, your CV says "I can speak Arabic". That's weak!
    - speaker: Mohamed
      text: Terus aku tulis apa, dong? "Fasih berbahasa Arab"?
      ar_eg: أكتب إيه بقى؟ «بطلاقة في العربي»؟
      ar: فماذا أكتب؟ «يجيد العربية بطلاقة»؟
      en: So what do I write? "Fluent in Arabic"?
    - speaker: Rina
      text: Nah, betul. Terus tulis pengalamanmu, misalnya "menangani klien dari Timur Tengah".
      ar_eg: مظبوط. وبعدين اكتب خبرتك، مثلًا «تولّيت عملا من الشرق الأوسط».
      ar: صحيح. ثم اكتب خبرتك، مثل «تولّيت عملاء من الشرق الأوسط».
      en: Right. Then add your experience, like "handled clients from the Middle East".
    - speaker: Mohamed
      text: Oke. Aku tulis juga magangku di Kedutaan Indonesia di Kairo.
      ar_eg: ماشي. وهكتب كمان التدريب بتاعي في السفارة الإندونيسية في القاهرة.
      ar: حسنًا. وسأكتب أيضًا تدريبي في السفارة الإندونيسية بالقاهرة.
      en: OK. I'll also write in my internship at the Indonesian Embassy in Cairo.
