schema: kabar.lesson/v1
id: bipa4.u03.l05
language: id
title: Museum
can_do:
  ar_eg: تكتب وصف حي لمتحف أو مكان تاريخي.
  ar: أن تكتب وصفًا حيًّا لمتحف أو مكان تاريخي.
  en: Write a vivid description.
slides:
  - title: Deskripsi yang hidup
    body:
      ar_eg: |
        الوصف الحي محتاج حاجتين من الوحدة دي:
        1) أفعال -kan دقيقة: menceritakan، membelikan، menyampaikan.
        2) صورة: seperti / bagaikan، ومبالغة صغيرة لو بتحكي (مش في تقرير).
        بدل «Museum itu besar» قول: Museum itu megah bagaikan istana raja.
      ar: |
        يحتاج الوصف الحي إلى أمرين من هذه الوحدة:
        1) أفعال -kan دقيقة: menceritakan، membelikan، menyampaikan.
        2) صورة بلاغية: seperti / bagaikan، ومبالغة يسيرة في الحكي لا في التقرير.
        فبدل «Museum itu besar» قل: Museum itu megah bagaikan istana raja.
      en: |
        A vivid description needs two things from this unit:
        1) Precise -kan verbs: menceritakan, membelikan, menyampaikan.
        2) An image: seperti / bagaikan, and a little hyperbole when telling a story (not in a report).
        Instead of "Museum itu besar", say: Museum itu megah bagaikan istana raja.
    grammar: id.figurative.simile-hyperbole
    examples:
      - text: Museum itu megah bagaikan istana raja.
        ar_eg: المتحف ده فخم كأنه قصر ملك.
        ar: ذلك المتحف فخم كأنه قصر ملك.
        en: The museum is as grand as a king's palace.
      - text: Pemandu menceritakan sejarah setiap koleksi.
        ar_eg: المرشد حكى تاريخ كل قطعة في المجموعة.
        ar: روى المرشد تاريخ كل قطعة في المجموعة.
        en: The guide told the history of every item in the collection.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kuno
        ar_eg: قديم أوي / أثري
        ar: قديم / أثري
        en: ancient
      - text: koleksi
        ar_eg: مجموعة (مقتنيات)
        ar: مجموعة مقتنيات
        en: collection
      - text: dipamerkan
        ar_eg: معروض
        ar: معروض
        en: be exhibited
      - text: megah
        ar_eg: فخم / عظيم
        ar: فخم
        en: grand, magnificent
      - text: bagaikan
        ar_eg: كأنه
        ar: كأنّ
        en: like, as
    words: [kuno, koleksi, dipamerkan, megah, bagaikan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي وصف أكتر حيوية؟
      ar: أيّ وصف أكثر حيوية؟
      en: Which description is the most vivid?
    options: ["Museum itu besar.", "Museum itu megah bagaikan istana raja.", "Museum itu ada di Rantepao."]
    answer: 1
    words: [megah]
  - id: e03
    type: listen
    text: Museum ini menyimpan koleksi kain kuno.
    options: ["Museum ini menyimpan koleksi kain kuno.", "Museum ini menyimpan koleksi kayu kuno.", "Museum ini memamerkan kain baru."]
    answer: 0
    meaning:
      ar_eg: المتحف ده فيه مجموعة أقمشة أثرية.
      ar: يحفظ هذا المتحف مجموعة من الأقمشة الأثرية.
      en: This museum keeps a collection of ancient cloth.
    words: [koleksi, kuno]
  - id: e04
    type: fill_blank
    sentence: Ukiran-ukiran itu ___ di ruang utama.
    meaning:
      ar_eg: النحت ده معروض في القاعة الرئيسية.
      ar: تلك المنحوتات معروضة في القاعة الرئيسية.
      en: Those carvings are exhibited in the main hall.
    options: [dipamerkan, memamerkan, pameran]
    answers: [dipamerkan]
    words: [dipamerkan]
  - id: e05
    type: fill_blank
    sentence: Pemandu museum ___ sejarah koleksi itu kepada kami.
    meaning:
      ar_eg: (اكتب الفعل من cerita) مرشد المتحف حكالنا تاريخ المجموعة دي.
      ar: (اكتب الفعل من cerita) روى لنا مرشد المتحف تاريخ تلك المجموعة.
      en: (Type the verb from cerita.) The museum guide told us the history of that collection.
    answers: [menceritakan]
    words: [menceritakan, koleksi]
  - id: e06
    type: build_sentence
    source:
      ar_eg: المبنى ده فخم زي قصر ملك.
      ar: ذلك المبنى فخم كقصر ملك.
      en: That building is as grand as a king's palace.
    answer: Gedung itu megah seperti istana raja.
    distractors: [adalah, kuno]
    words: [megah]
  - id: e07
    type: dictation
    text: Di museum ini dipamerkan kain tenun kuno dari Toraja.
    meaning:
      ar_eg: في المتحف ده معروض أقمشة منسوجة أثرية من توراجا.
      ar: يُعرض في هذا المتحف قماش منسوج أثري من توراجا.
      en: Ancient handwoven cloth from Toraja is exhibited in this museum.
    words: [dipamerkan, kuno]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المرشد اشترالنا تذاكر.
      ar: اشترى لنا المرشد تذاكر.
      en: The guide bought us tickets.
    answers:
      - Pemandu membelikan kami tiket.
      - Pemandu membelikan kami tiket
      - Pemandu itu membelikan kami tiket.
      - Pemandu membeli tiket untuk kami.
      - Pemandu itu membeli tiket untuk kami.
      - Pemandu membelikan kita tiket.
    words: [membelikan]
  - id: e09
    type: speaking
    text: Koleksi museum ini indah bagaikan harta karun.
    meaning:
      ar_eg: مجموعة المتحف ده جميلة كأنها كنز.
      ar: مجموعة هذا المتحف جميلة كأنها كنز.
      en: This museum's collection is as beautiful as a treasure.
    words: [koleksi, bagaikan]
dialogue:
  title: Di museum Toraja
  lines:
    - speaker: Kak Debora
      text: Selamat datang! Koleksi museum kami sangat kuno.
      ar_eg: أهلًا بيك! مجموعة متحفنا أثرية جدًا.
      ar: أهلًا بك! مقتنيات متحفنا أثرية جدًا.
      en: Welcome! Our museum's collection is very old.
    - speaker: Mohamed
      text: Kain yang dipamerkan di sana indah sekali, warnanya seperti matahari terbenam.
      ar_eg: القماش المعروض هناك جميل أوي، لونه زي الشمس وهي بتغرب.
      ar: القماش المعروض هناك جميل جدًا، لونه كلون الغروب.
      en: The cloth displayed over there is beautiful — its colour is like a sunset.
    - speaker: Kak Debora
      text: Kain itu berumur ratusan tahun, warisan para bangsawan Toraja.
      ar_eg: القماش ده عمره مئات السنين، ورث من أعيان توراجا.
      ar: عمر ذلك القماش مئات السنين، وهو إرث من أعيان توراجا.
      en: That cloth is hundreds of years old, a heritage of the Toraja nobility.
    - speaker: Mohamed
      text: Boleh Kakak menceritakan sejarahnya?
      ar_eg: ممكن تحكيلي تاريخه؟
      ar: هل يمكنك أن تروي لي تاريخه؟
      en: Could you tell me its history?
    - speaker: Kak Debora
      text: Tentu. Mari, saya tunjukkan juga ukiran yang paling megah.
      ar_eg: طبعًا. تعالى كمان أوريك أفخم نحتة.
      ar: بالطبع. تعالَ، سأريك أيضًا أفخم منحوتة.
      en: Of course. Come, I'll also show you the grandest carving.
