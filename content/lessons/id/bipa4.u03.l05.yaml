schema: kabar.lesson/v1
id: bipa4.u03.l05
language: id
title: Benteng Ujung Pandang
can_do:
  ar_eg: 'تحكي تاريخ قلعة: مين بناها وإمتى ومين حكم وقتها.'
  ar: 'أن تروي تاريخ قلعة: من بناها ومتى ومن حكم آنذاك.'
  en: 'Tell a fort''s history: who built it, when, and who ruled at the time.'
slides:
  - title: Fort Rotterdam, Makassar
    body:
      ar_eg: |
        benteng = قلعة، tertua = الأقدم (salah satu yang tertua = من أقدم...).
        didirikan = اتأسس، اتبنى (didirikan pada tahun 1545)، dipimpin oleh = تحت قيادة.
        sultan = سلطان، penguasa = الحاكم، berkuasa = يحكم، ماسك السلطة، naik tahta = يطلع على العرش.
      ar: |
        benteng = قلعة، tertua = الأقدم (salah satu yang tertua = من أقدم...).
        didirikan = أُسّس، بُني (didirikan pada tahun 1545)، dipimpin oleh = بقيادة.
        sultan = سلطان، penguasa = الحاكم، berkuasa = يحكم، يتولّى السلطة، naik tahta = يعتلي العرش.
      en: |
        benteng = fort, tertua = oldest (salah satu yang tertua = one of the oldest).
        didirikan = founded, built (didirikan pada tahun 1545); dipimpin oleh = led by.
        sultan = sultan, penguasa = ruler, berkuasa = to be in power, naik tahta = to ascend the throne.
    examples:
      - text: Benteng ini didirikan oleh raja Gowa pada tahun 1545.
        ar_eg: القلعة دي بناها ملك جووا سنة ١٥٤٥.
        ar: أسّس ملكُ غوا هذه القلعة عام ١٥٤٥.
        en: This fort was built by a king of Gowa in 1545.
      - text: Sultan Hasanuddin naik tahta pada tahun 1653.
        ar_eg: السلطان حسن الدين طلع على العرش سنة ١٦٥٣.
        ar: اعتلى السلطان حسن الدين العرش عام ١٦٥٣.
        en: Sultan Hasanuddin came to the throne in 1653.
      - text: Dulu Gowa dipimpin oleh penguasa yang berani.
        ar_eg: زمان جووا كانت تحت حكم حاكم شجاع.
        ar: كانت غوا قديمًا بقيادة حاكم شجاع.
        en: Gowa was once led by brave rulers.
