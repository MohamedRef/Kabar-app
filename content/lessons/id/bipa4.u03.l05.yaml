  - id: e03
    type: listen
    text: Benteng ini salah satu yang tertua di Sulawesi.
    question:
      ar_eg: قالوا إيه عن القلعة؟
      ar: ماذا قيل عن القلعة؟
      en: What was said about the fort?
    options: [من أقدم القلاع, أحدث قلعة, أكبر قصر]
    answer: 0
    meaning:
      ar_eg: القلعة دي من أقدم القلاع في سولاويزي.
      ar: هذه القلعة من أقدم القلاع في سولاويسي.
      en: This fort is one of the oldest in Sulawesi.
    words: [benteng, tertua]
  - id: e04
    type: fill_blank
    sentence: Sekolah ini ___ pada tahun 1950 oleh seorang guru.
    meaning:
      ar_eg: المدرسة دي ___ سنة ١٩٥٠ على إيد مدرّس.
      ar: ___ هذه المدرسة عام ١٩٥٠ على يد معلّم.
      en: This school was ___ in 1950 by a teacher.
    options: [didirikan, dipimpin, berkuasa]
    answers: [didirikan]
    words: [didirikan, dipimpin, berkuasa]
  - id: e05
    type: multiple_choice
    question: Raja muda itu naik ___ pada umur dua puluh tahun.
    options: [benteng, tahta, sultan]
    answer: 1
    explain:
      ar_eg: naik tahta = يطلع على العرش ويبقى ملك.
      ar: naik tahta = يعتلي العرش ويصبح ملكًا.
      en: naik tahta = to become king.
    words: [benteng, tahta, sultan]
  - id: e06
    type: fill_blank
    sentence: Selama tiga puluh tahun dia ___ di daerah ini.
    meaning:
      ar_eg: لمدة تلاتين سنة هو ___ في المنطقة دي.
      ar: ظلّ ___ في هذه المنطقة ثلاثين عامًا.
      en: For thirty years he ___ this region.
    options: [berkuasa, tertua, didirikan]
    answers: [berkuasa]
    words: [berkuasa, tertua, didirikan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيحكم البلد؟
      ar: من يحكم البلاد؟
      en: Who rules the land?
    options: [penguasa, pengunjung, benteng]
    answer: 0
    explain:
      ar_eg: penguasa = الحاكم. pengunjung = الزوار.
      ar: penguasa = الحاكم، وpengunjung = الزوّار.
      en: penguasa = ruler; pengunjung = visitors.
    words: [penguasa, benteng]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أهل جووا كانوا تحت قيادة السلطان حسن الدين.
      ar: كان أهل غوا بقيادة السلطان حسن الدين.
      en: The people of Gowa were led by Sultan Hasanuddin.
    answer: Rakyat Gowa dipimpin oleh Sultan Hasanuddin.
    distractors: [penguasa, tahta]
    words: [dipimpin, sultan, penguasa, tahta]
  - id: e09
    type: translate
    direction: from_target
    source_text: Penguasa itu berkuasa selama dua puluh tahun.
    answers_meaning:
      ar_eg: [الحاكم ده حكم عشرين سنة, الحاكم ده فضل في السلطة عشرين سنة]
      ar: [حكم ذلك الحاكم عشرين عامًا, بقي ذلك الحاكم في السلطة عشرين سنة]
      en: [That ruler was in power for twenty years, The ruler ruled for twenty years]
    words: [penguasa, berkuasa]
  - id: e10
    type: speaking
    text: Benteng tertua ini didirikan oleh seorang sultan.
    meaning:
      ar_eg: القلعة القديمة دي بناها سلطان.
      ar: أسّس هذه القلعة العريقة سلطانٌ.
      en: This oldest fort was founded by a sultan.
    words: [benteng, tertua, didirikan, sultan, tahta]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Mohamed, ini Fort Rotterdam. Dulu namanya Benteng Ujung Pandang.
      ar_eg: يا محمد، دي فورت روتردام. زمان كان اسمها قلعة أوجونج باندانج.
      ar: يا محمد، هذه قلعة روتردام. كان اسمها قديمًا قلعة أوجونغ باندانغ.
      en: Mohamed, this is Fort Rotterdam. It used to be called Benteng Ujung Pandang.
    - speaker: Mohamed
      text: Siapa yang mendirikannya?
      ar_eg: مين اللي بناها؟
      ar: من الذي أسّسها؟
      en: Who founded it?
    - speaker: Mas Rizal
      text: Raja Gowa, pada tahun 1545. Ini salah satu benteng tertua di Sulawesi.
      ar_eg: ملك جووا، سنة ١٥٤٥. دي من أقدم القلاع في سولاويزي.
      ar: ملك غوا عام ١٥٤٥. وهي من أقدم القلاع في سولاويسي.
      en: A king of Gowa, in 1545. It's one of the oldest forts in Sulawesi.
    - speaker: Mohamed
      text: Sultan Hasanuddin juga berkuasa di sini?
      ar_eg: والسلطان حسن الدين كمان حكم هنا؟
      ar: وهل حكم السلطان حسن الدين هنا أيضًا؟
      en: Did Sultan Hasanuddin rule here too?
    - speaker: Mas Rizal
      text: Ya. Dia naik tahta pada tahun 1653 dan memimpin Gowa melawan Belanda.
      ar_eg: أيوه. طلع على العرش سنة ١٦٥٣ وقاد جووا ضد الهولنديين.
      ar: نعم. اعتلى العرش عام ١٦٥٣ وقاد غوا ضد الهولنديين.
      en: Yes. He came to the throne in 1653 and led Gowa against the Dutch.
