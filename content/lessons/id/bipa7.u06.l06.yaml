id: bipa7.u06.l06
language: id
title: Jurnalisme warga
can_do:
  ar_eg: تبلّغ عن حدث شفته بعينك بأمانة، وتعرف إمتى تنزّل الفيديو وإمتى لأ.
  ar: أن تنقل حدثًا شهدته بأمانة، وتعرف متى تنشر التسجيل ومتى تمتنع.
  en: Report something you witnessed honestly, and know when to post the footage and when not to.
slides:
  - title: Semua orang bisa jadi reporter
    body:
      ar_eg: |
        الـ jurnalisme warga (صحافة المواطن) يعني إنت، مش صحفي، بتنقل الخبر.
        - saksi mata = شاهد عيان: شاف الـ kejadian (الحدث) بنفسه
        - rekaman = تسجيل (فيديو أو صوت)
        - mengunggah = ينزّل / يرفع على النت (upload)
        مثال حقيقي: في مارس ٢٠١٧ مركب سياحي كبير اسمه Caledonian Sky شحط على شعاب راجا أمبات. غطّاسين وأهالي صوّروا الضرر، والصور وصلت الإعلام بسرعة.
        قبل ما تنزّل: متأكّد من المكان والوقت؟ فيه وشوش ناس متعوّرة؟ (ماتنزّلهاش!)
      ar: |
        الـ jurnalisme warga (صحافة المواطن) أن تنقل أنت الخبر وإن لم تكن صحفيًّا.
        - saksi mata = شاهد عيان رأى الـ kejadian (الحادث) بنفسه
        - rekaman = تسجيل (مرئيّ أو صوتيّ)
        - mengunggah = يرفع إلى الإنترنت
        مثال واقعيّ: في مارس ٢٠١٧ جنحت سفينة سياحية كبيرة اسمها Caledonian Sky على مرجان راجا أمبات، فصوّر غوّاصون وأهالٍ الضرر، وبلغت الصور وسائل الإعلام سريعًا.
        وقبل أن ترفع: أأنت متأكّد من المكان والزمان؟ أفي التسجيل وجوه مصابين؟ (فلا تنشره!)
      en: |
        Jurnalisme warga (citizen journalism) means you, not a professional, carry the news.
        - saksi mata = eyewitness who saw the kejadian (incident) firsthand
        - rekaman = recording (video or audio)
        - mengunggah = to upload
        A real example: in March 2017 a big cruise ship, the Caledonian Sky, ran aground on a Raja Ampat reef. Divers and locals filmed the damage, and the images reached the media fast.
        Before you upload: are you sure of the place and time? Are injured people's faces visible? (Don't post them!)
    examples:
      - text: Seorang saksi mata merekam kejadian itu dengan ponselnya.
        ar_eg: شاهد عيان صوّر الحدث ده بموبايله.
        ar: صوّر شاهد عيان الحادث بهاتفه.
        en: An eyewitness recorded the incident on their phone.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jurnalisme warga
        ar_eg: صحافة المواطن
        ar: صحافة المواطن
        en: citizen journalism
      - text: saksi mata
        ar_eg: شاهد عيان
        ar: شاهد عيان
        en: eyewitness
      - text: rekaman
        ar_eg: تسجيل
        ar: تسجيل
        en: recording
      - text: mengunggah
        ar_eg: ينزّل على النت
        ar: يرفع إلى الإنترنت
        en: to upload
      - text: kejadian
        ar_eg: حدث / حادثة
        ar: حادث
        en: incident
    words: [jurnalisme warga, saksi mata, rekaman, mengunggah, kejadian]
  - id: e02
    type: listen
    text: Saya saksi mata. Saya melihat kapal itu menabrak karang pukul sembilan pagi.
    question:
      ar_eg: المتكلّم شاف إيه؟
      ar: ماذا رأى المتكلّم؟
      en: What did the speaker see?
    options:
      - مركب بيخبط في الشعاب الساعة تسعة الصبح.
      - حفلة على الشط.
      - سمكة مانتا.
    answer: 0
    words: [saksi mata]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: قبل ما تنزّل فيديو لحادثة، لازم تعمل إيه؟
      ar: ماذا ينبغي قبل رفع تسجيل لحادث؟
      en: Before uploading footage of an incident, what should you do?
    options:
      - تزوّد عليه موسيقى درامية.
      - تنزّله في أسرع وقت من غير ما تبص.
      - تتأكّد من المكان والوقت وتخبّي وشوش المتعوّرين.
    answer: 2
    words: [mengunggah, rekaman]
  - id: e04
    type: fill_blank
    sentence: Polisi meminta ___ dari ponsel warga sebagai bukti.
    meaning:
      ar_eg: البوليس طلب التسجيل من موبايل المواطن كدليل.
      ar: طلبت الشرطة التسجيل من هاتف المواطن دليلًا.
      en: The police asked for the recording from a resident's phone as evidence.
    options: [rekaman, tautan, kejadian]
    answers: [rekaman]
    words: [rekaman]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي حصل في راجا أمبات في مارس ٢٠١٧؟
      ar: ماذا حدث في راجا أمبات في مارس ٢٠١٧؟
      en: What happened in Raja Ampat in March 2017?
    options:
      - اتعمل فيها مهرجان مزيكا.
      - مركب سياحي شحط على الشعاب.
      - اتبنى فيها مطار جديد.
    answer: 1
    words: [kejadian]
  - id: e06
    type: build_sentence
    source:
      ar_eg: نزّلت الفيديو بعد ما اتأكّدت من المكان.
      ar: رفعت الفيديو بعد أن تحقّقت من المكان.
      en: I uploaded the video after checking the location.
    answer: Saya mengunggah video itu setelah memeriksa lokasinya.
    distractors: [saksi, mata]
    words: [mengunggah]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: صحافة المواطن بتساعد الأخبار توصل بسرعة.
      ar: تساعد صحافة المواطن على وصول الأخبار بسرعة.
      en: Citizen journalism helps news travel fast.
    answers:
      - Jurnalisme warga membantu berita sampai dengan cepat.
      - Jurnalisme warga membantu berita tersebar dengan cepat.
      - Jurnalisme warga membuat berita cepat sampai.
      - Jurnalisme warga membantu berita sampai lebih cepat.
    words: [jurnalisme warga]
  - id: e08
    type: speaking
    text: Jangan mengunggah rekaman yang memperlihatkan wajah korban.
    meaning:
      ar_eg: ماتنزّلش تسجيل باين فيه وش الضحية.
      ar: لا ترفع تسجيلًا يُظهر وجه الضحيّة.
      en: Don't upload footage that shows a victim's face.
    words: [mengunggah, rekaman]
  - id: e09
    type: dictation
    text: Saksi mata menceritakan kejadian itu kepada reporter.
    meaning:
      ar_eg: شاهد العيان حكى الحدث للمراسل.
      ar: روى شاهد العيان الحادث للمراسل.
      en: The eyewitness told the reporter about the incident.
    words: [saksi mata, kejadian, reporter]
  - id: e10
    type: speaking
    text: Dalam jurnalisme warga, kejujuran lebih penting daripada kecepatan.
    meaning:
      ar_eg: في صحافة المواطن، الأمانة أهمّ من السرعة.
      ar: في صحافة المواطن، الصدق أهمّ من السرعة.
      en: In citizen journalism, honesty matters more than speed.
    words: [jurnalisme warga]
dialogue:
  title: Video dari dermaga
  lines:
    - speaker: Mohamed
      text: Kak Selvi, saya punya rekaman perahu terbalik di dermaga tadi pagi.
      ar_eg: يا كاك سيلفي، معايا تسجيل لمركب اتقلب عند الرصيف الصبح.
      ar: يا كاك سيلفي، لديّ تسجيل لقارب انقلب عند الرصيف صباح اليوم.
      en: Kak Selvi, I've got footage of a boat that capsized at the pier this morning.
    - speaker: Kak Selvi
      text: Kamu saksi mata? Semua penumpangnya selamat?
      ar_eg: إنت شاهد عيان؟ كل الركّاب سليمين؟
      ar: أأنت شاهد عيان؟ هل نجا الركّاب كلّهم؟
      en: You're an eyewitness? Were all the passengers safe?
    - speaker: Mohamed
      text: Selamat semua. Tapi ada satu ibu yang menangis di video. Boleh saya unggah?
      ar_eg: كلهم سليمين. بس فيه ست بتعيّط في الفيديو. ينفع أنزّله؟
      ar: نجوا جميعًا، لكنّ في الفيديو امرأة تبكي. هل أرفعه؟
      en: All safe. But there's a woman crying in the video. Can I upload it?
    - speaker: Kak Selvi
      text: Boleh, tetapi tutupi wajahnya dulu. Jurnalisme warga juga punya etika.
      ar_eg: ينفع، بس غطّي وشها الأول. صحافة المواطن ليها أخلاقيات هي كمان.
      ar: نعم، لكن أخفِ وجهها أوّلًا، فلصحافة المواطن أخلاقيّاتها أيضًا.
      en: Yes, but blur her face first. Citizen journalism has ethics too.
