schema: kabar.lesson/v1
id: bipa6.u02.l04
language: id
title: Syair dan gurindam
can_do:
  ar_eg: تفرّق بين الشعر الملايوي القديم، الـ syair والـ gurindam، وتفهم النصيحة اللي فيه.
  ar: أن تميّز بين صنفين من الشعر الملايوي القديم، الـ syair والـ gurindam، وتفهم ما فيهما من نصح.
  en: Tell two classic Malay verse forms apart, syair and gurindam, and grasp the advice they carry.
slides:
  - title: Dari Pulau Penyengat
    body:
      ar_eg: |
        البانتون مش الشكل الوحيد في شعر الملايو:
        - syair = أربع larik (أسطر) بنفس القافية aaaa، وكلها معنى، من غير sampiran. بيحكي حكاية أو نصيحة.
        - gurindam = سطرين بنفس القافية: الأول sebab (السبب أو الشرط)، والتاني akibat (النتيجة). يعني sebab akibat.
        - petuah = نصيحة حكيمة من الكبار
        أشهرها Gurindam Dua Belas، كتبه Raja Ali Haji سنة ١٨٤٧ في جزيرة بنيينجات في رياو:
        Apabila terpelihara mata,
        sedikitlah cita-cita.
        (لو حافظت على عينك، طمعك هيقل.)
      ar: |
        ليس البانتون الشكلَ الوحيد في الشعر الملايوي:
        - syair = أربعة larik (أسطر) على قافية واحدة aaaa، كلّها معنى بلا sampiran، يروي حكاية أو نصيحة.
        - gurindam = سطران على قافية واحدة: الأول sebab (السبب أو الشرط) والثاني akibat (النتيجة)، أي sebab akibat.
        - petuah = نصيحة حكيمة من الكبار
        وأشهرها Gurindam Dua Belas، كتبه Raja Ali Haji سنة ١٨٤٧ في جزيرة بنيينغات في رياو:
        Apabila terpelihara mata,
        sedikitlah cita-cita.
        (إذا صُنتَ عينك قلّت مطامعك.)
      en: |
        The pantun isn't the only Malay verse form:
        - syair = four larik (lines) on one rhyme, aaaa, all meaning and no sampiran; it tells a story or gives advice.
        - gurindam = two rhyming lines: the first is the sebab (cause or condition), the second the akibat (result), so sebab akibat.
        - petuah = wise advice from elders
        The best known is Gurindam Dua Belas, written by Raja Ali Haji in 1847 on Penyengat Island, Riau:
        Apabila terpelihara mata,
        sedikitlah cita-cita.
        (Guard your eyes and your cravings shrink.)
    examples:
      - text: Gurindam Dua Belas penuh petuah tentang agama dan budi pekerti.
        ar_eg: Gurindam Dua Belas مليان نصايح عن الدين والأخلاق.
        ar: يزخر Gurindam Dua Belas بالنصائح في الدين والأخلاق.
        en: Gurindam Dua Belas is full of advice on faith and good conduct.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: syair
        ar_eg: شعر أربع أسطر بقافية واحدة
        ar: شعر رباعي بقافية واحدة
        en: four-line verse on one rhyme
      - text: gurindam
        ar_eg: شعر سطرين، سبب ونتيجة
        ar: بيتان، سبب ونتيجة
        en: two-line verse, cause and result
      - text: petuah
        ar_eg: نصيحة حكيمة
        ar: نصيحة حكيمة
        en: wise advice
      - text: larik
        ar_eg: سطر شعر
        ar: سطر شعري
        en: line of verse
      - text: sebab akibat
        ar_eg: سبب ونتيجة
        ar: السبب والنتيجة
        en: cause and effect
    words: [syair, gurindam, petuah, larik, sebab akibat]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: شعر فيه أربع أسطر، كلها بنفس القافية ومن غير sampiran. ده إيه؟
      ar: شعر من أربعة أسطر على قافية واحدة بلا sampiran. ما هو؟
      en: A poem of four lines, all on one rhyme, with no sampiran. What is it?
    options: [gurindam, syair, pantun]
    answer: 1
    explain:
      ar_eg: البانتون فيه sampiran، والـ gurindam سطرين بس. يبقى syair.
      ar: في البانتون sampiran، والـ gurindam سطران فقط، فهو syair.
      en: A pantun has a sampiran and a gurindam has only two lines, so it's a syair.
    words: [syair, larik]
  - id: e03
    type: listen
    text: Gurindam Dua Belas ditulis oleh Raja Ali Haji di Pulau Penyengat.
    question:
      ar_eg: Gurindam Dua Belas اتكتب فين؟
      ar: أين كُتب Gurindam Dua Belas؟
      en: Where was Gurindam Dua Belas written?
    options:
      - في جاكرتا.
      - في جزيرة بالي.
      - في جزيرة بنيينجات.
    answer: 2
    words: [gurindam]
  - id: e04
    type: fill_blank
    sentence: Dalam gurindam, larik pertama adalah sebab dan larik kedua adalah ___.
    meaning:
      ar_eg: في الـ gurindam، السطر الأول هو السبب والتاني هو النتيجة.
      ar: في الـ gurindam السطر الأول سبب والثاني نتيجة.
      en: In a gurindam, the first line is the cause and the second is the result.
    options: [akibat, sampiran, petuah]
    answers: [akibat]
    words: [gurindam, sebab akibat, larik]
    explain:
      ar_eg: "في الجوريندام السطر الأول سبب والتاني نتيجة: akibat. sampiran جزء من البانتون، وpetuah = نصيحة."
      ar: في الغوريندام الأوّل سبب والثاني نتيجة akibat؛ أمّا sampiran فجزء من البانتون، وpetuah النصيحة.
      en: In a gurindam, line 1 is the cause and line 2 the result, akibat. sampiran belongs to the pantun, and petuah is advice.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «petuah» تيجي من مين عادةً؟
      ar: ممّن تأتي «petuah» عادةً؟
      en: Who does a "petuah" usually come from?
    options:
      - من الكبار والحكما.
      - من الإعلانات.
      - من الأطفال الصغيرين.
    answer: 0
    words: [petuah]
    explain:
      ar_eg: petuah = نصيحة الكبار والحكما. مش من إعلانات ولا من أطفال.
      ar: petuah نصيحة الكبار والحكماء، لا الإعلانات ولا الأطفال.
      en: A petuah is advice from elders and the wise, not from ads or small children.
  - id: e06
    type: build_sentence
    source:
      ar_eg: الـ syair بيحكي حكاية طويلة في مقاطع كتير.
      ar: يروي الـ syair حكاية طويلة في مقاطع كثيرة.
      en: A syair tells a long story over many stanzas.
    answer: Syair menceritakan kisah panjang dalam banyak bait.
    distractors: [gurindam, akibat]
    words: [syair]
    explain:
      ar_eg: الجملة عن Syair اللي بيحكي حكاية طويلة. gurindam نوع تاني من سطرين، وakibat = نتيجة.
      ar: الجملة عن Syair الذي يروي قصّة طويلة؛ أمّا gurindam فنوع آخر من سطرين، وakibat النتيجة.
      en: The sentence is about the Syair, which tells a long story. gurindam is a two-line form, and akibat means result.
  - id: e07
    type: translate
    direction: from_target
    source_text: Nenek saya suka memberi petuah dengan gurindam.
    answers_meaning:
      ar_eg:
        - جدتي بتحب تدي نصايح بالـ gurindam.
        - ستي بتحب تنصح بأبيات gurindam.
      ar:
        - تحبّ جدّتي أن تنصح بالـ gurindam.
        - تحبّ جدّتي إسداء النصائح بأبيات الـ gurindam.
      en:
        - My grandmother likes to give advice in gurindam.
        - My grandmother loves passing on wisdom through gurindam.
    words: [petuah, gurindam]
  - id: e08
    type: speaking
    text: Jika hendak mengenal orang berbangsa, lihat kepada budi dan bahasa.
    meaning:
      ar_eg: لو عايز تعرف الإنسان الأصيل، بص على أخلاقه وكلامه.
      ar: إذا أردت أن تعرف الأصيل فانظر إلى خُلُقه ولسانه.
      en: To know a person of good breeding, look at their character and their speech.
    words: [gurindam, sebab akibat]
  - id: e09
    type: dictation
    text: Setiap larik dalam syair berakhir dengan bunyi yang sama.
    meaning:
      ar_eg: كل سطر في الـ syair بيخلص بنفس الصوت.
      ar: ينتهي كلّ سطر في الـ syair بالصوت نفسه.
      en: Every line of a syair ends with the same sound.
    words: [larik, syair]
  - id: e10
    type: fill_blank
    sentence: Orang tua di kampung memberi ___ kepada pengantin baru.
    meaning:
      ar_eg: الكبار في القرية بيدوا نصايح للعرسان الجداد.
      ar: يُسدي كبار القرية النصائح للعروسين.
      en: The village elders give advice to the newlyweds.
    options: [petuah, larik, syair]
    answers: [petuah]
    words: [petuah]
    explain:
      ar_eg: الكبار بيدّوا العرسان petuah (نصيحة). larik = سطر وsyair = نوع شعر، ومش بيتدّوا كهدية كلام.
      ar: يعطي الكبار العروسين petuah (نصيحة)؛ أمّا larik (سطر) وsyair (نوع شعري) فليسا ما يُعطى.
      en: Elders give newlyweds petuah, advice. larik (a line) and syair (a verse form) aren't what's given.
dialogue:
  title: Di makam Raja Ali Haji
  lines:
    - speaker: Encik Zul
      text: Mohamed, di dinding ini tertulis Gurindam Dua Belas.
      ar_eg: يا محمد، على الحيطة دي مكتوب Gurindam Dua Belas.
      ar: يا محمد، على هذا الجدار نُقش Gurindam Dua Belas.
      en: Mohamed, Gurindam Dua Belas is written on this wall.
    - speaker: Mohamed
      text: Setiap pasal hanya dua larik, ya? Pendek sekali.
      ar_eg: كل فصل سطرين بس، صح؟ قصير جدًا.
      ar: كلّ فصل سطران فقط، أليس كذلك؟ قصير جدًا.
      en: Each verse is only two lines, right? So short.
    - speaker: Encik Zul
      text: Pendek, tetapi petuahnya dalam. Larik pertama sebab, larik kedua akibat.
      ar_eg: قصير، بس النصيحة عميقة. السطر الأول السبب، والتاني النتيجة.
      ar: 'قصير، لكنّ نصيحته عميقة: السطر الأول سبب والثاني نتيجة.'
      en: Short, but the advice runs deep. The first line is the cause, the second the result.
    - speaker: Mohamed
      text: Kalau syair, berapa larik dalam satu bait?
      ar_eg: والـ syair، كام سطر في المقطع الواحد؟
      ar: وكم سطرًا في المقطع الواحد من الـ syair؟
      en: And a syair, how many lines in one stanza?
    - speaker: Encik Zul
      text: Empat, dan semuanya berima sama. Tidak ada sampiran seperti pantun.
      ar_eg: أربعة، وكلهم بنفس القافية. مافيش sampiran زي البانتون.
      ar: أربعة، كلّها على قافية واحدة، ولا sampiran فيها كالبانتون.
      en: Four, all on the same rhyme. No sampiran like a pantun.
