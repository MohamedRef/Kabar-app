    en: applicant
  - word: dokumen
    pos: noun
    ar_eg: 'ورق / مستندات'
    ar: 'وثيقة، مستندات'
    en: 'document'
  - word: dilampirkan
    pos: verb
    ar_eg: 'يتبعت مرفق (lampiran = مرفق)'
    ar: 'يُرفَق (lampiran = مُرفَق)'
    en: 'to be attached (lampiran = attachment)'
