schema: kabar.lesson/v1
id: bipa5.u04.l03
language: id
title: Beasiswa
can_do:
  ar_eg: تقرا شروط منحة دراسية وتفهم المطلوب والمواعيد.
  ar: أن تقرأ شروط منحة دراسية وتفهم متطلّباتها ومواعيدها.
  en: Read scholarship terms and understand the requirements and deadlines.
slides:
  - title: Membaca pengumuman beasiswa
    body:
      ar_eg: |
        اقرا الإعلان ده:
        Beasiswa Darmasiswa dibuka untuk mahasiswa asing yang ingin belajar bahasa dan budaya Indonesia selama satu tahun. Pelamar wajib berusia di bawah 35 tahun dan melampirkan surat rekomendasi. Batas akhir pendaftaran adalah 31 Januari.
        الكلمات المهمة: wajib (إلزامي)، batas akhir (آخر ميعاد)، pendaftaran (التسجيل).
        ودي منحة حقيقية من الحكومة الإندونيسية للأجانب، ومفتوحة لطلاب من دول كتير، منها مصر. (الشروط والمواعيد بتتغير كل سنة، فراجعها في الإعلان الرسمي.)
      ar: |
        اقرأ هذا الإعلان:
        Beasiswa Darmasiswa dibuka untuk mahasiswa asing yang ingin belajar bahasa dan budaya Indonesia selama satu tahun. Pelamar wajib berusia di bawah 35 tahun dan melampirkan surat rekomendasi. Batas akhir pendaftaran adalah 31 Januari.
        الكلمات المهمّة: wajib (واجب، إلزامي)، batas akhir (الموعد النهائي)، pendaftaran (التسجيل).
        وهي منحة حقيقية تقدّمها الحكومة الإندونيسية للأجانب من دول كثيرة منها مصر. (تتغيّر الشروط والمواعيد كلّ عام، فراجعها في الإعلان الرسمي.)
      en: |
        Read this announcement:
        Beasiswa Darmasiswa dibuka untuk mahasiswa asing yang ingin belajar bahasa dan budaya Indonesia selama satu tahun. Pelamar wajib berusia di bawah 35 tahun dan melampirkan surat rekomendasi. Batas akhir pendaftaran adalah 31 Januari.
        Key words: wajib (compulsory), batas akhir (deadline), pendaftaran (registration).
        Darmasiswa is a real Indonesian government scholarship for foreigners from many countries, Egypt included. (Terms and dates change every year, so check the official call.)
    examples:
      - text: Pelamar wajib melampirkan surat rekomendasi.
        ar_eg: المتقدم لازم يرفق جواب توصية.
        ar: يجب على المتقدّم إرفاق خطاب توصية.
        en: Applicants must attach a recommendation letter.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: beasiswa
        ar_eg: منحة دراسية
        ar: منحة دراسية
        en: scholarship
      - text: wajib
        ar_eg: لازم / إلزامي
        ar: واجب، إلزامي
        en: compulsory
      - text: batas akhir
        ar_eg: آخر ميعاد
        ar: الموعد النهائي
        en: deadline
      - text: pendaftaran
        ar_eg: تسجيل
        ar: تسجيل
        en: registration
      - text: pelamar
        ar_eg: متقدم
        ar: متقدّم
        en: applicant
    words: [beasiswa, wajib, batas akhir, pendaftaran, pelamar]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مين يقدر يقدّم على المنحة دي؟
      ar: من يحقّ له التقدّم لهذه المنحة؟
      en: Who can apply for this scholarship?
    options:
      - أي حد عنده 40 سنة.
      - الطلاب الأجانب اللي تحت 35 سنة.
      - الطلاب الإندونيسيين بس.
    answer: 1
    words: [beasiswa, pelamar]
    explain:
      ar_eg: الإعلان للطلاب الأجانب تحت 35. سن 40 كبير، والمنحة مش للإندونيسيين بس.
      ar: الإعلان للطلّاب الأجانب دون 35 عامًا؛ فسنّ الأربعين يتجاوز الحدّ، وليست للإندونيسيين وحدهم.
      en: It's for foreign students under 35. Forty is too old, and it isn't only for Indonesians.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: آخر ميعاد للتسجيل إمتى؟
      ar: ما الموعد النهائي للتسجيل؟
      en: When is the registration deadline?
    options: [31 Januari, 1 Januari, 31 Juli]
    answer: 0
    words: [batas akhir, pendaftaran]
    explain:
      ar_eg: الإعلان بيقول آخر ميعاد 31 Januari. 1 Januari و31 Juli مش التاريخ اللي اتقال.
      ar: يذكر الإعلان أنّ الموعد النهائي 31 Januari، لا 1 Januari ولا 31 Juli.
      en: The notice says 31 Januari. 1 Januari and 31 Juli aren't the date given.
  - id: e04
    type: fill_blank
    sentence: Semua dokumen ___ dilampirkan.
    meaning:
      ar_eg: كل المستندات لازم تتبعت مرفقة.
      ar: يجب إرفاق جميع المستندات.
      en: All documents must be attached.
    options: [wajib, beasiswa, batas]
    answers: [wajib]
    words: [wajib, dokumen, dilampirkan]
    explain:
      ar_eg: «لازم» في الكلام الرسمي = wajib. beasiswa = منحة وbatas = حد، ومايجوش قبل dilampirkan.
      ar: «يجب» في الأسلوب الرسمي = wajib. أما beasiswa فالمنحة، وbatas الحدّ، ولا يأتيان قبل dilampirkan.
      en: Formal "must" is wajib. beasiswa (scholarship) and batas (limit) can't go before dilampirkan.
  - id: e05
    type: listen
    text: Pendaftaran beasiswa ditutup minggu depan.
    question:
      ar_eg: إيه الخبر؟
      ar: ما الخبر؟
      en: What is the news?
    options:
      - المنحة اتلغت.
      - النتيجة طالعة الأسبوع الجاي.
      - التسجيل للمنحة بيقفل الأسبوع الجاي.
    answer: 2
    words: [pendaftaran, beasiswa]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: آخر ميعاد للتسجيل هو آخر الشهر.
      ar: الموعد النهائي للتسجيل نهاية الشهر.
      en: The registration deadline is the end of the month.
    answers:
      - Batas akhir pendaftaran adalah akhir bulan.
      - Batas akhir pendaftarannya adalah akhir bulan.
      - Batas akhir pendaftaran akhir bulan ini.
      - Batas akhir pendaftaran adalah akhir bulan ini.
    words: [batas akhir, pendaftaran]
  - id: e07
    type: build_sentence
    source:
      ar_eg: المتقدم لازم يكون تحت 35 سنة.
      ar: يجب أن يكون المتقدّم دون الخامسة والثلاثين.
      en: The applicant must be under 35.
    answer: Pelamar wajib berusia di bawah 35 tahun.
    distractors: [beasiswa, atas]
    words: [pelamar, wajib]
    explain:
      ar_eg: «لازم يكون تحت 35» = wajib berusia di bawah 35. beasiswa = منحة، وatas = فوق (عكس di bawah).
      ar: «يجب أن يكون دون 35» = wajib berusia di bawah 35. أما beasiswa فالمنحة، وatas «فوق» عكس di bawah.
      en: "\"Must be under 35\" is wajib berusia di bawah 35. beasiswa is a scholarship, and atas (above) is the opposite of di bawah."
  - id: e08
    type: speaking
    text: Semua dokumen beasiswa sudah dilampirkan.
    meaning:
      ar_eg: كل ورق المنحة اتبعت مرفق خلاص.
      ar: أُرفقت جميع مستندات المنحة.
      en: All the scholarship documents have been attached.
    words: [dokumen, beasiswa, dilampirkan]
  - id: e09
    type: dictation
    text: Jangan lupa batas akhir pendaftaran, ya!
    meaning:
      ar_eg: ماتنساش آخر ميعاد للتسجيل!
      ar: لا تنسَ الموعد النهائي للتسجيل!
      en: Don't forget the registration deadline!
    words: [batas akhir]
  - id: e10
    type: multiple_choice
    question: Dokumen apa yang harus dilampirkan?
    question_meaning:
      ar_eg: السؤال ده معناه إيه؟
      ar: ما معنى هذا السؤال؟
      en: What does this question mean?
    options:
      - إيه المستندات اللي لازم تتبعت مرفقة؟
      - إمتى آخر ميعاد للتسجيل؟
      - مين المتقدمين للمنحة؟
    answer: 0
    explain:
      ar_eg: dokumen = مستندات، dilampirkan = يتبعت مرفق (من lampir).
      ar: dokumen = مستندات، وdilampirkan = يُرفَق (من lampir).
      en: dokumen = documents; dilampirkan = be attached (from lampir).
    words: [dokumen, dilampirkan]
dialogue:
  title: Kantor beasiswa
  lines:
    - speaker: Mohamed
      text: Permisi, Bu. Apakah beasiswa ini terbuka untuk orang Mesir?
      ar_eg: لو سمحتي يا مدام. المنحة دي متاحة للمصريين؟
      ar: عذرًا يا سيدتي، هل هذه المنحة متاحة للمصريين؟
      en: Excuse me, ma'am. Is this scholarship open to Egyptians?
    - speaker: Bu Lestari
      text: Terbuka, Pak. Pelamar dari Mesir cukup banyak setiap tahun.
      ar_eg: متاحة يا أستاذ. فيه متقدمين مصريين كتير كل سنة.
      ar: نعم يا سيدي، ويتقدّم كثير من المصريين كلّ عام.
      en: It is, sir. There are quite a few applicants from Egypt every year.
    - speaker: Mohamed
      text: Dokumen apa saja yang wajib dilampirkan?
      ar_eg: إيه الورق اللي لازم يترفق؟
      ar: ما الوثائق الواجب إرفاقها؟
      en: Which documents must be attached?
    - speaker: Bu Lestari
      text: Paspor, ijazah, dan surat rekomendasi. Batas akhirnya 31 Januari.
      ar_eg: الباسبور والشهادة وجواب توصية. وآخر ميعاد 31 يناير.
      ar: جواز السفر والشهادة وخطاب التوصية، والموعد النهائي 31 يناير.
      en: Passport, diploma and a recommendation letter. The deadline is 31 January.
