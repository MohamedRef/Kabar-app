  - id: e07
    type: build_sentence
    source:
      ar_eg: المتقدم لازم يكون تحت 35 سنة.
      ar: يجب أن يكون المتقدّم دون الخامسة والثلاثين.
      en: The applicant must be under 35.
    answer: Pelamar wajib berusia di bawah 35 tahun.
    distractors: [beasiswa, atas]
    words: [pelamar, wajib]
  - id: e08
    type: speaking
    text: Saya ingin mendaftar beasiswa Darmasiswa tahun ini.
    meaning:
      ar_eg: أنا عايز أقدّم على منحة دارماسيسوا السنة دي.
      ar: أريد التقدّم لمنحة دارماسيسوا هذا العام.
      en: I want to apply for the Darmasiswa scholarship this year.
