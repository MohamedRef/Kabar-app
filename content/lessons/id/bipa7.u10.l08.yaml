schema: kabar.lesson/v1
id: bipa7.u10.l08
language: id
title: Membaca data survei
can_do:
  ar_eg: تقرا أرقام استبيان صح وما تخلطش بين الارتباط والسببية.
  ar: أن تقرأ أرقام استبيان قراءة صحيحة ولا تخلط بين الارتباط والسببية.
  en: Read survey numbers correctly without confusing correlation and causation.
slides:
  - title: Angka yang jujur
    body:
      ar_eg: |
        استبيان (متألّف للدرس) لـ 200 صياد في سورونج عن الدخل الشهري:
        rerata (المتوسّط) = 3,1 مليون. median (الوسيط) = 2,4 مليون.
        ليه الفرق؟ فيه pencilan (قيمة شاذّة): صاحب مركب كبير بيكسب 40 مليون، وده بيشدّ المتوسّط لفوق.
        korelasi (ارتباط): اللي عندهم موبايل دخلهم أعلى. بس ده مش kausalitas (سببية)!
        ما تعملش generalisasi (تعميم) على بابوا كلها من 200 واحد.
        anomali = حاجة غريبة في البيانات. empiris = مبني على بيانات وملاحظة مش على الرأي.
      ar: |
        استبيان (مؤلَّف للدرس) لـ200 صيّاد في سورونغ عن الدخل الشهري:
        rerata (المتوسّط) = 3,1 مليون، وmedian (الوسيط) = 2,4 مليون.
        لماذا الفرق؟ هناك pencilan (قيمة متطرّفة): صاحب قارب كبير يكسب 40 مليونًا فيرفع المتوسّط.
        korelasi (ارتباط): أصحاب الهواتف دخلهم أعلى، لكنّ ذلك ليس kausalitas (سببية)!
        ولا تقم بـ generalisasi (تعميم) على بابوا كلّها من 200 شخص.
        anomali = شذوذ في البيانات. empiris = قائم على البيانات والملاحظة لا على الرأي.
      en: |
        A survey (invented for the lesson) of 200 Sorong fishermen's monthly income:
        rerata (mean) = 3.1 million. median = 2.4 million.
        Why the gap? A pencilan (outlier): one big-boat owner earns 40 million and pulls the mean up.
        korelasi: those with phones earn more. But that's not kausalitas!
        Don't make a generalisasi about all Papua from 200 people.
        anomali = something odd in the data. empiris = based on data and observation, not opinion.
    examples:
      - text: Median lebih tepat daripada rerata jika ada pencilan.
        ar_eg: الوسيط أدقّ من المتوسّط لو فيه قيمة شاذّة.
        ar: الوسيط أدقّ من المتوسّط إذا وُجدت قيمة متطرّفة.
        en: The median is more accurate than the mean when there's an outlier.
      - text: Korelasi tidak sama dengan kausalitas.
        ar_eg: الارتباط مش هو السببية.
        ar: الارتباط ليس السببية.
        en: Correlation is not causation.
      - text: Kesimpulan itu harus didukung bukti empiris.
        ar_eg: الاستنتاج ده لازم يكون عليه دليل تجريبي.
        ar: يجب أن تدعم الاستنتاجَ أدلّةٌ تجريبية.
        en: That conclusion must be backed by empirical evidence.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rerata
        ar_eg: المتوسّط
        ar: المتوسّط الحسابي
        en: mean, average
      - text: median
        ar_eg: الوسيط (الرقم اللي في النص)
        ar: الوسيط
        en: median
      - text: pencilan
        ar_eg: قيمة شاذّة بعيدة عن الباقي
        ar: قيمة متطرّفة
        en: outlier
      - text: korelasi
        ar_eg: ارتباط
        ar: ارتباط
        en: correlation
    words: [rerata, median, pencilan, korelasi]
  - id: e02
    type: match_pairs
    pairs:
      - text: kausalitas
        ar_eg: سببية
        ar: السببية
        en: causality
      - text: generalisasi
        ar_eg: تعميم
        ar: تعميم
        en: generalisation
      - text: anomali
        ar_eg: شذوذ / حاجة غريبة عن المعتاد
        ar: شذوذ عن المألوف
        en: anomaly
      - text: empiris
        ar_eg: تجريبي / مبني على الملاحظة
        ar: تجريبي
        en: empirical
    words: [kausalitas, generalisasi, anomali, empiris]
  - id: e03
    type: listen
    text: 'Ada anomali pada data bulan Maret: penjualan naik sepuluh kali lipat.'
    question:
      ar_eg: إيه اللي في بيانات مارس؟
      ar: ماذا في بيانات مارس؟
      en: What's in the March data?
    options: [شذوذ, متوسّط, تعميم]
    answer: 0
    meaning:
      ar_eg: 'فيه حاجة شاذّة في بيانات مارس: المبيعات زادت عشر أضعاف.'
      ar: 'في بيانات مارس شذوذ: تضاعفت المبيعات عشر مرّات.'
      en: 'There''s an anomaly in March''s data: sales rose tenfold.'
    words: [anomali]
  - id: e04
    type: fill_blank
    sentence: Nilai tengah dari data yang diurutkan disebut ___.
    meaning:
      ar_eg: القيمة اللي في النص بعد ترتيب البيانات اسمها ___.
      ar: تُسمّى القيمة الوسطى في البيانات المرتّبة ___.
      en: The middle value of ordered data is the ___.
    options: [median, rerata, korelasi]
    answers: [median]
    words: [median, rerata, korelasi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه «generalisasi» من 200 صياد غلط؟
      ar: لماذا يُعدّ «generalisasi» من 200 صيّاد خطأً؟
      en: Why is a 'generalisasi' from 200 fishermen wrong?
    options: ['Karena sampelnya hanya dari satu kota, bukan seluruh Papua.', Karena 200 terlalu banyak., Karena nelayan tidak punya telepon.]
    answer: 0
    explain:
      ar_eg: العيّنة من مدينة واحدة، ما تنفعش لبابوا كلها.
      ar: العيّنة من مدينة واحدة فلا تمثّل بابوا كلّها.
      en: The sample is from one city, not all Papua.
    words: [generalisasi]
  - id: e06
    type: fill_blank
    sentence: Satu kapal besar menjadi ___ yang menaikkan rerata.
    meaning:
      ar_eg: مركب كبير واحد بقى ___ رفع المتوسّط.
      ar: صار قارب كبير واحد ___ رفع المتوسّط.
      en: One big boat became an ___ that raised the mean.
    options: [pencilan, kausalitas, empiris]
    answers: [pencilan]
    words: [pencilan, kausalitas, empiris, rerata]
  - id: e07
    type: build_sentence
    source:
      ar_eg: مفيش ارتباط بين المتغيّرين دول.
      ar: لا ارتباط بين هذين المتغيّرين.
      en: There's no correlation between these two variables.
    answer: Tidak ada korelasi antara kedua variabel itu.
    distractors: [pencilan, median]
    words: [korelasi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Untuk membuktikan kausalitas, kita butuh eksperimen.
    answers_meaning:
      ar_eg: [علشان نثبت السببية، محتاجين تجربة, لو عايزين نثبت إن ده سبب ده، لازم تجربة]
      ar: [لإثبات السببية نحتاج إلى تجربة, يتطلّب إثبات السببية إجراء تجربة]
      en: ['To prove causality, we need an experiment', Proving causation requires an experiment]
    words: [kausalitas]
  - id: e09
    type: speaking
    text: Median dan data empiris mencegah generalisasi yang keliru.
    meaning:
      ar_eg: الوسيط والبيانات التجريبية بيمنعوا التعميم الغلط.
      ar: يمنع الوسيط والبيانات التجريبية التعميم الخاطئ.
      en: The median and empirical data prevent false generalisations.
    words: [median, empiris, generalisasi]
  - id: e10
    type: multiple_choice
    question: '"Orang yang punya telepon lebih kaya, jadi telepon membuat orang kaya." Apa kesalahannya?'
    options: [Rerata naik karena pencilan., Tidak ada anomali., Menganggap korelasi sebagai kausalitas.]
    answer: 2
    explain:
      ar_eg: ده خلط بين الارتباط والسببية.
      ar: هذا خلط بين الارتباط والسببية.
      en: That mistakes correlation for causation.
    words: [korelasi, kausalitas, rerata, anomali, pencilan]
dialogue:
  lines:
    - speaker: Pak Elias
      text: Lihat tabelmu. Rerata pendapatan nelayan tiga koma satu juta.
      ar_eg: بص على الجدول بتاعك. متوسّط دخل الصيادين تلاتة وواحد من عشرة مليون.
      ar: 'انظر إلى جدولك: متوسّط دخل الصيّادين ثلاثة فاصل واحد مليون.'
      en: Look at your table. The fishermen's mean income is 3.1 million.
    - speaker: Mohamed
      text: Tetapi kebanyakan nelayan bilang mereka dapat jauh lebih sedikit.
      ar_eg: بس معظم الصيادين بيقولوا إنهم بياخدوا أقل من كده بكتير.
      ar: لكنّ معظم الصيّادين يقولون إنهم يكسبون أقلّ بكثير.
      en: But most fishermen say they earn much less.
    - speaker: Pak Elias
      text: Karena ada pencilan. Coba lihat median-nya.
      ar_eg: علشان فيه قيمة شاذّة. بص على الوسيط.
      ar: لوجود قيمة متطرّفة. انظر إلى الوسيط.
      en: Because there's an outlier. Look at the median.
    - speaker: Mohamed
      text: Dua koma empat juta. Itu lebih jujur.
      ar_eg: اتنين وأربعة من عشرة مليون. ده أصدق.
      ar: اثنان فاصل أربعة مليون، وهذا أصدق.
      en: 2.4 million. That's more honest.
    - speaker: Pak Elias
      text: Bagus. Dan jangan buat generalisasi untuk seluruh Papua.
      ar_eg: حلو. وما تعمّمش على بابوا كلها.
      ar: جيّد، ولا تعمّم على بابوا كلّها.
      en: Good. And don't generalise to all of Papua.
