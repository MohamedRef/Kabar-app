schema: kabar.lesson/v1
id: bipa2.u04.l12
language: id
title: Ulangan Unit 4
can_do:
  ar_eg: تشتري تلات حاجات بسعر معقول.
  ar: أن تشتري ثلاثة أشياء بسعر مناسب.
  en: Buy three things at a fair price.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: seekor ayam
        ar_eg: فرخة
        ar: دجاجة
        en: a chicken
      - text: selembar kain
        ar_eg: حتة قماش
        ar: قطعة قماش
        en: a piece of cloth
      - text: sebuah patung
        ar_eg: تمثال
        ar: تمثال
        en: a statue
      - text: seikat sayur
        ar_eg: حزمة خضار
        ar: حزمة خضار
        en: a bunch of vegetables
      - text: sebotol air
        ar_eg: إزازة مية
        ar: زجاجة ماء
        en: a bottle of water
    words: [ekor, lembar, buah, ikat, botol]
  - id: e02
    type: match_pairs
    pairs:
      - text: Boleh kurang?
        ar_eg: ممكن تنزل شوية؟
        ar: هل يمكن التخفيض؟
        en: Can you go lower?
      - text: harga pas
        ar_eg: آخر سعر
        ar: السعر النهائي
        en: final price
      - text: sama saja
        ar_eg: كله واحد
        ar: سيّان
        en: it's all the same
      - text: Jangan khawatir.
        ar_eg: ماتقلقش.
        ar: لا تقلق.
        en: Don't worry.
    words: [boleh kurang, harga pas, sama saja, khawatir]
  - id: e03
    type: listen
    text: Saya beli tiga buah patung.
    options: [Saya beli dua buah patung., Saya beli tiga ekor patung., Saya beli tiga buah patung.]
    answer: 2
    words: [buah, patung]
  - id: e04
    type: match_pairs
    pairs:
      - text: tomat
        ar_eg: طماطم
        ar: طماطم
        en: tomato
      - text: gram
        ar_eg: جرام
        ar: غرام
        en: gram
      - text: abu-abu
        ar_eg: رمادي
        ar: رمادي
        en: grey
      - text: pisang
        ar_eg: موز
        ar: موز
        en: banana
    words: [tomat, gram, abu-abu, pisang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك هيدفع السعر الأولاني علطول. تقوله إيه؟
      ar: صديقك سيدفع السعر الأول مباشرةً. ماذا تقول له؟
      en: Your friend is about to pay the first price straight away. What do you tell him?
    options: [Ayo langsung bayar!, 'Jangan langsung bayar, tawar dulu!', 'Tidak langsung bayar, tawar dulu!']
    answer: 1
    explain:
      ar_eg: النهي بـ jangan، مش tidak.
      ar: النهي يكون بـ jangan لا tidak.
      en: Telling someone "don't" needs jangan, not tidak.
    words: [jangan, langsung]
  - id: e06
    type: fill_blank
    sentence: ___ kita ke Pasar Seni Sukawati!
    meaning:
      ar_eg: يلا نروح سوق الفن في سوكاواتي!
      ar: هيّا نذهب إلى سوق الفن في سوكاواتي!
      en: Let's go to Sukawati Art Market!
    options: [Ayo, Jangan, Sama]
    answers: [Ayo]
    words: [ayo]
    explain:
      ar_eg: دعوة = Ayo kita…. Jangan للنهي، وSama = زي/مع.
      ar: الدعوة = Ayo kita…. أما Jangan فللنهي وSama «مثل».
      en: An invitation is Ayo kita…. Jangan forbids, Sama means "same/with".
  - id: e07
    type: fill_blank
    sentence: Minta dua ___ teh manis, Mbak.
    meaning:
      ar_eg: كوبايتين شاي بسكر لو سمحتي.
      ar: كوبان من الشاي المحلّى من فضلكِ.
      en: Two glasses of sweet tea, please.
    options: [lembar, ekor, gelas]
    answers: [gelas]
    words: [gelas]
    explain:
      ar_eg: الشاي بيتعدّ بالـ gelas (كوباية). lembar للورق، وekor للحيوانات.
      ar: يُعدّ الشاي بالـ gelas (كوب). أما lembar فللورق وekor للحيوانات.
      en: Tea is counted in gelas (glasses). lembar is for paper, ekor for animals.
  - id: e08
    type: build_sentence
    source:
      ar_eg: ماتغليهاش علينا يا حاجة! ممكن تنزلي شوية؟
      ar: لا تبالغي في السعر يا سيدتي! هل يمكن التخفيض؟
      en: Don't make it so expensive, ma'am! Can you go lower?
    answer: Jangan mahal-mahal, Bu! Boleh kurang?
    distractors: [tidak, lebih]
    words: [jangan, boleh kurang]
    explain:
      ar_eg: "Jangan + صفة مكررة = «ماتعمليهاش…»: Jangan mahal-mahal. Boleh kurang? = ممكن تنزّلي؟"
      ar: "Jangan + صفة مكرّرة = «لا تبالغي في…»: Jangan mahal-mahal، وBoleh kurang? = هل تخفّضين؟"
      en: "Jangan + doubled adjective = \"don't make it so…\": Jangan mahal-mahal. Boleh kurang? = can you go lower?"
  - id: e09
    type: build_sentence
    source:
      ar_eg: الأسعار هنا مش غالية قد كوتا.
      ar: الأسعار هنا ليست مرتفعة كما في كوتا.
      en: Prices here aren't as high as in Kuta.
    answer: Harga di sini tidak semahal di Kuta.
    distractors: [lebih, daripada]
    words: [semahal, harga]
    explain:
      ar_eg: tidak semahal = «مش غالية قد». lebih وdaripada للمقارنة العادية («أغلى من»)، مش «مش قد».
      ar: tidak semahal = «ليست بغلاء». أما lebih وdaripada فلـ«أكثر من».
      en: tidak semahal = "not as expensive as". lebih and daripada are for "more than".
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عايز كيلو برتقال وحزمتين خضار.
      ar: أريد كيلو برتقال وحزمتين من الخضار.
      en: I'd like a kilo of oranges and two bunches of vegetables.
    answers: [Saya mau sekilo jeruk dan dua ikat sayur., Saya mau sekilo jeruk dan dua ikat sayur, Saya mau satu kilo jeruk dan dua ikat sayur., Saya minta sekilo jeruk dan dua ikat sayur., Saya ingin sekilo jeruk dan dua ikat sayur., Saya mau beli sekilo jeruk dan dua ikat sayur., Aku mau sekilo jeruk dan dua ikat sayur.]
    words: [kilo, ikat]
  - id: e11
    type: dictation
    text: Ya sudah, saya beli dua lembar.
    meaning:
      ar_eg: خلاص ماشي، هشتري حتتين.
      ar: حسنًا إذن، سأشتري قطعتين.
      en: OK then, I'll buy two pieces.
    words: [ya sudah, lembar]
  - id: e12
    type: speaking
    text: Saya beli sebuah patung, dua lembar kain, dan sekilo kopi. Boleh kurang, Bu?
    meaning:
      ar_eg: هشتري تمثال، وحتتين قماش، وكيلو بن. ممكن تنزلي شوية يا مدام؟
      ar: سأشتري تمثالًا وقطعتي قماش وكيلو قهوة. هل يمكن التخفيض يا سيدتي؟
      en: I'll buy a statue, two pieces of cloth and a kilo of coffee. Can you go lower, ma'am?
    words: [buah, lembar, kilo, boleh kurang]
dialogue:
  title: Tiga oleh-oleh
  lines:
    - speaker: Mohamed
      text: Bu, saya mau sebuah patung, dua lembar kain, dan sekilo kopi Bali.
      ar_eg: يا مدام، عايز تمثال، وحتتين قماش، وكيلو بن بالي.
      ar: يا سيدتي، أريد تمثالًا وقطعتي قماش وكيلو من قهوة بالي.
      en: Ma'am, I'd like a statue, two pieces of cloth and a kilo of Balinese coffee.
    - speaker: Bu Nyoman
      text: Semuanya empat ratus ribu, Pak.
      ar_eg: الكل بأربعمية ألف يا أستاذ.
      ar: المجموع أربعمئة ألف يا سيدي.
      en: Altogether four hundred thousand, sir.
    - speaker: Mohamed
      text: Jangan mahal-mahal, Bu! Dua ratus lima puluh, boleh?
      ar_eg: ماتغليهاش علينا يا حاجة! ميتين وخمسين، ينفع؟
      ar: لا تبالغي في السعر يا سيدتي! مئتان وخمسون، هل يمكن؟
      en: Don't make it so expensive, ma'am! Two hundred and fifty, OK?
    - speaker: Bu Nyoman
      text: Aduh, saya rugi. Tiga ratus, harga pas.
      ar_eg: يا لهوي، كده هخسر. تلتمية، آخر سعر.
      ar: آه، سأخسر. ثلاثمئة، وهذا السعر النهائي.
      en: Oh no, I'll lose money. Three hundred, final price.
    - speaker: Mohamed
      text: Ya sudah, boleh. Terima kasih, Bu!
      ar_eg: خلاص ماشي. شكرًا يا مدام!
      ar: حسنًا، موافق. شكرًا يا سيدتي!
      en: OK then, fine. Thank you, ma'am!
    - speaker: Bu Nyoman
      text: Sama-sama. Mari, Pak!
      ar_eg: العفو. مع السلامة يا أستاذ!
      ar: عفوًا. مع السلامة يا سيدي!
      en: You're welcome. Goodbye, sir!
souvenir:
  id: bipa2.u04.souvenir
  title: Pasar Seni Sukawati
  note:
    ar_eg: سوق الفن في سوكاواتي مليان قماش وتماثيل خشب ولوحات بالي، والفصال هناك متوقع، بس بابتسامة. الناس عادةً بتبدأ بنص السعر وتتقابل في النص، وده طبيعي خالص. بس في السوبر ماركت الأسعار ثابتة، فمتفاصلش هناك!
    ar: سوق الفن في سوكاواتي عامر بالأقمشة والتماثيل الخشبية واللوحات البالية، والمساومة فيه متوقعة لكن بابتسامة. يبدأ الناس عادةً بنصف السعر ويلتقون في المنتصف، وهذا أمر طبيعي تمامًا. أما في المتاجر الكبرى فالأسعار ثابتة فلا مساومة.
    en: Sukawati Art Market is full of cloth, wooden carvings and Balinese paintings, and bargaining is expected — with a smile. Starting at half the price and meeting in the middle is completely normal. Supermarkets have fixed prices, though, so save your haggling for the market!
