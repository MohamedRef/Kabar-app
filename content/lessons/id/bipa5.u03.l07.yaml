schema: kabar.lesson/v1
id: bipa5.u03.l07
language: id
title: Siaran dari Sungai Mahakam
can_do:
  ar_eg: 'تتكلم عن بث مباشر لمشهور على النت: المتابعين والراعي والبوست والرفع، والدرون والصوت والشهرة.'
  ar: 'أن تتحدث عن بثّ مباشر لمشهور على الإنترنت: المشاهدين والراعي والمنشور والرفع، والطائرة المسيّرة والصوت والشهرة.'
  en: 'Talk about a celebrity''s live stream: viewers, sponsor, posting and uploading, the drone, the audio and popularity.'
slides:
  - title: Konten dari tepi sungai
    body:
      ar_eg: |
        selebriti = مشهور، popularitas = شهرة (popularitasnya naik = شهرته زادت).
        pemirsa = المشاهدين (Pemirsa sekalian = أعزائي المشاهدين، في التلفزيون واللايف).
        posting = بوست أو ينزّل بوست، upload = يرفع (فيديو أو صورة): Videonya sudah di-upload.
        sponsor = راعي، drone = درون، audio = الصوت (audionya jelek = الصوت وحش).
      ar: |
        selebriti = مشهور، popularitas = شهرة (popularitasnya naik = زادت شهرته).
        pemirsa = المشاهدون (Pemirsa sekalian = أعزائي المشاهدين، في التلفاز والبث).
        posting = منشور، ينشر، upload = يرفع (فيديو أو صورة): Videonya sudah di-upload.
        sponsor = راعٍ، drone = طائرة مسيّرة، audio = الصوت (audionya jelek = الصوت سيئ).
      en: |
        selebriti = celebrity, popularitas = popularity (popularitasnya naik = his popularity rose).
        pemirsa = viewers, audience (Pemirsa sekalian = dear viewers, on TV and live streams).
        posting = a post, to post, upload = to upload: Videonya sudah di-upload.
        sponsor = sponsor, drone = drone, audio = audio, sound (audionya jelek = bad sound).
    examples:
      - text: Selebriti itu siaran langsung dari perahu di Sungai Mahakam.
        ar_eg: المشهور ده عامل لايف من مركب في نهر ماهاكام.
        ar: يبثّ ذلك المشهور مباشرة من قارب على نهر ماهاكام.
        en: That celebrity is live-streaming from a boat on the Mahakam.
      - text: Videonya diambil dengan drone, tapi audionya kurang jelas.
        ar_eg: الفيديو متصور بدرون، بس الصوت مش واضح أوي.
        ar: صُوّر الفيديو بطائرة مسيّرة، لكن الصوت غير واضح.
        en: The video was shot with a drone, but the audio isn't clear.
      - text: Popularitasnya naik setelah dia posting video itu.
        ar_eg: شهرته زادت بعد ما نزّل الفيديو ده.
        ar: زادت شهرته بعد أن نشر ذلك الفيديو.
        en: His popularity rose after he posted that video.
