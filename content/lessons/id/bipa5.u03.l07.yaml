  - id: e03
    type: listen
    text: Pemirsa, kita sekarang di tengah Sungai Mahakam!
    question:
      ar_eg: بيكلم مين؟
      ar: يخاطب مَن؟
      en: Who is he talking to?
    options: [المشاهدين, الركاب, الطلبة]
    answer: 0
    meaning:
      ar_eg: يا مشاهدين، إحنا دلوقتي في نص نهر ماهاكام!
      ar: أعزائي المشاهدين، نحن الآن في وسط نهر ماهاكام!
      en: Viewers, we're now in the middle of the Mahakam River!
    words: [pemirsa]
  - id: e04
    type: fill_blank
    sentence: Acara ini dibiayai oleh ___ dari perusahaan kopi.
    meaning:
      ar_eg: البرنامج ده ممول من ___ من شركة بن.
      ar: يموّل هذا البرنامج ___ من شركة قهوة.
      en: This show is funded by a ___ from a coffee company.
    options: [sponsor, drone, posting]
    answers: [sponsor]
    words: [sponsor, drone, posting]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الطيارة الصغيرة اللي من غير طيار وبتصور من فوق اسمها إيه؟
      ar: ما اسم الطائرة الصغيرة بلا طيار التي تصوّر من الأعلى؟
      en: What's the small pilotless aircraft that films from above called?
    options: [audio, selebriti, drone]
    answer: 2
    explain:
      ar_eg: drone = درون.
      ar: drone = طائرة مسيّرة.
      en: drone = drone.
    words: [audio, selebriti, drone]
  - id: e06
    type: fill_blank
    sentence: Fotonya belum bisa di-___ karena sinyal lemah.
    meaning:
      ar_eg: الصورة لسه ما اترفعتش (___) عشان الشبكة ضعيفة.
      ar: لم يمكن ___ الصورة بعد لضعف الإشارة.
      en: The photo can't be ___ed yet because the signal is weak.
    options: [upload, pemirsa, popularitas]
    answers: [upload]
    words: [upload, pemirsa, popularitas]
  - id: e07
    type: multiple_choice
    question: Suaranya putus-putus. ___-nya bermasalah.
    options: [Audio, Sponsor, Posting]
    answer: 0
    explain:
      ar_eg: audio = الصوت.
      ar: audio = الصوت.
      en: audio = the sound.
    words: [audio, sponsor, posting]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المشهور ده رفع فيديو جديد.
      ar: رفع ذلك المشهور فيديو جديدًا.
      en: That celebrity uploaded a new video.
    answer: Selebriti itu meng-upload video baru.
    distractors: [sponsor, audio]
    words: [selebriti, upload]
  - id: e09
    type: translate
    direction: from_target
    source_text: Popularitasnya naik setelah posting itu.
    answers_meaning:
      ar_eg: [شهرته زادت بعد البوست ده, بعد البوست ده بقى مشهور أكتر]
      ar: [زادت شهرته بعد ذلك المنشور, ارتفعت شهرتها بعد ذلك المنشور]
      en: [His popularity rose after that post, She became more popular after that post]
    words: [popularitas, posting]
  - id: e10
    type: speaking
    text: Terima kasih, pemirsa, dan terima kasih untuk sponsor kami.
    meaning:
      ar_eg: شكرًا يا مشاهدين، وشكرًا للراعي بتاعنا.
      ar: شكرًا أعزائي المشاهدين، وشكرًا لراعينا.
      en: Thank you, viewers, and thanks to our sponsor.
    words: [pemirsa, sponsor]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Lihat perahu itu, Mohamed. Ada selebriti yang sedang siaran langsung.
      ar_eg: بص على المركب ده يا محمد. فيه واحد مشهور عامل لايف.
      ar: انظر إلى ذلك القارب يا محمد. هناك مشهور يبثّ مباشرة.
      en: Look at that boat, Mohamed. There's a celebrity live-streaming.
    - speaker: Mohamed
      text: Dan drone di atasnya itu punya dia juga?
      ar_eg: والدرون اللي فوقه ده بتاعه هو كمان؟
      ar: وهل الطائرة المسيّرة فوقه له أيضًا؟
      en: And is that drone above him his too?
    - speaker: Mas Rizal
      text: Ya. Pemirsanya ratusan ribu. Sponsornya perusahaan kopi dari Samarinda.
      ar_eg: أيوه. المتابعين بتوعه مئات الآلاف. والراعي شركة بن من ساماريندا.
      ar: نعم. مشاهدوه بمئات الآلاف، وراعيه شركة قهوة من ساماريندا.
      en: Yes. He has hundreds of thousands of viewers. The sponsor is a Samarinda coffee firm.
    - speaker: Mohamed
      text: Tapi anginnya kencang. Audionya pasti jelek.
      ar_eg: بس الهوا جامد. الصوت أكيد وحش.
      ar: لكن الريح قوية. لا بدّ أن الصوت سيئ.
      en: But it's windy. The audio must be bad.
    - speaker: Mas Rizal
      text: Tidak apa-apa. Nanti malam dia upload versi yang lebih bagus. Itu rahasia popularitasnya.
      ar_eg: مش مهم. بالليل هيرفع نسخة أحسن. ده سر شهرته.
      ar: لا بأس. سيرفع الليلة نسخة أفضل. هذا سرّ شهرته.
      en: No matter. Tonight he'll upload a better version. That's the secret of his popularity.
    - speaker: Mohamed
      text: Saya juga mau posting foto sungai ini!
      ar_eg: وأنا كمان عايز أنزّل بوست بصورة النهر ده!
      ar: وأنا أيضًا أريد نشر صورة هذا النهر!
      en: I want to post a photo of this river too!
