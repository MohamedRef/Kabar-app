schema: kabar.lesson/v1
id: bipa4.u06.l06
language: id
title: Ulangan Unit 6
can_do:
  ar_eg: تناقش السياحة وتدافع عن رأيك بتعبيرات طبيعية.
  ar: أن تناقش السياحة وتدافع عن رأيك بتعابير طبيعية.
  en: Debate tourism using natural word partners.
slides:
  - title: Kolokasi pariwisata
    body:
      ar_eg: |
        افتكر «الأصحاب» اللي اتعلمناهم في الوحدة:
        menarik wisatawan، meningkatkan pendapatan، membuka lapangan kerja، mengadakan festival، melestarikan budaya، menghadapi tantangan، memecahkan masalah، berdampak positif / negatif.
        hujan deras، angin kencang، kopi kental، rusak parah.
      ar: |
        تذكّر المتلازمات التي تعلمناها في هذه الوحدة:
        menarik wisatawan، meningkatkan pendapatan، membuka lapangan kerja، mengadakan festival، melestarikan budaya، menghadapi tantangan، memecahkan masalah، berdampak positif / negatif.
        hujan deras، angin kencang، kopi kental، rusak parah.
      en: |
        Remember this unit's word partners:
        menarik wisatawan, meningkatkan pendapatan, membuka lapangan kerja, mengadakan festival, melestarikan budaya, menghadapi tantangan, memecahkan masalah, berdampak positif / negatif.
        hujan deras, angin kencang, kopi kental, rusak parah.
    grammar: id.collocation
    examples:
      - text: Festival budaya menarik wisatawan dan meningkatkan pendapatan warga.
        ar_eg: المهرجان الثقافي بيجذب السياح وبيزوّد دخل السكان.
        ar: يجذب المهرجان الثقافي السياح ويزيد دخل السكان.
        en: The cultural festival attracts tourists and increases residents' income.
      - text: Kemarin hujan deras, jadi pertunjukannya batal.
        ar_eg: امبارح المطر كان غزير، فالعرض اتلغى.
        ar: هطل مطر غزير أمس، فأُلغي العرض.
        en: It rained heavily yesterday, so the performance was cancelled.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mengadakan festival
        ar_eg: يقيم مهرجان
        ar: يقيم مهرجانًا
        en: hold a festival
      - text: membuka lapangan kerja
        ar_eg: يوفّر فرص شغل
        ar: يوفّر فرص العمل
        en: create jobs
      - text: hujan deras
        ar_eg: مطر غزير
        ar: مطر غزير
        en: heavy rain
      - text: kopi kental
        ar_eg: قهوة تقيلة
        ar: قهوة ثقيلة
        en: strong coffee
      - text: berdampak negatif
        ar_eg: ليه أثر سلبي
        ar: له أثر سلبي
        en: have a negative impact
    words: [mengadakan, lapangan kerja, deras, kental, dampak]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي تعبير مش طبيعي بالإندونيسي؟
      ar: أيّ تعبير غير طبيعي بالإندونيسية؟
      en: Which phrase is NOT natural Indonesian?
    options: [angin kencang, hujan berat, menarik perhatian]
    answer: 1
    explain:
      ar_eg: المطر الغزير = hujan deras أو hujan lebat. berat ترجمة حرفية من heavy.
      ar: المطر الغزير = hujan deras أو hujan lebat، وberat ترجمة حرفية لـ heavy.
      en: Heavy rain is hujan deras or hujan lebat; berat is a word-for-word copy of "heavy".
    words: [deras]
  - id: e03
    type: listen
    text: Panitia mengadakan pertunjukan untuk melestarikan budaya Kaili.
    options: ["Panitia mengadakan pertunjukan untuk menarik wisatawan Kaili.", "Panitia membuka pertunjukan untuk melestarikan budaya Kaili.", "Panitia mengadakan pertunjukan untuk melestarikan budaya Kaili."]
    answer: 2
    meaning:
      ar_eg: اللجنة عاملة عرض عشان تحافظ على ثقافة الكايلي.
      ar: تقيم اللجنة عرضًا للحفاظ على ثقافة الكايلي.
      en: The committee is holding a performance to preserve Kaili culture.
    words: [panitia, mengadakan, pertunjukan, melestarikan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: في المناظرة عايز تقول إن للسياحة كمان آثار سلبية. تقول إيه؟
      ar: تريد في المناظرة أن تقول إن للسياحة آثارًا سلبية أيضًا. ماذا تقول؟
      en: In the debate you want to say tourism has negative effects too. What do you say?
    options: ["Pariwisata juga berdampak negatif bagi lingkungan.", "Pariwisata juga memecahkan negatif bagi lingkungan.", "Pariwisata juga menghadapi negatif bagi lingkungan."]
    answer: 0
    words: [dampak]
  - id: e05
    type: fill_blank
    sentence: Desa wisata ___ tantangan baru.
    meaning:
      ar_eg: القرى السياحية بتواجه تحديات جديدة.
      ar: تواجه القرى السياحية تحديات جديدة.
      en: Tourist villages are facing new challenges.
    options: [mengadakan, menghadapi, meningkatkan]
    answers: [menghadapi]
    words: [menghadapi, tantangan]
  - id: e06
    type: fill_blank
    sentence: Kita harus ___ masalah sampah di pantai.
    meaning:
      ar_eg: (اكتب الفعل) لازم نحل مشكلة الزبالة على الشط.
      ar: (اكتب الفعل) يجب أن نحل مشكلة النفايات على الشاطئ.
      en: (Type the verb.) We must solve the rubbish problem on the beach.
    answers: [memecahkan, mengatasi, menyelesaikan]
    explain:
      ar_eg: الكولوكيشن اللي أخدناه memecahkan masalah. mengatasi وmenyelesaikan صح كمان.
      ar: المتلازمة التي تعلمناها memecahkan masalah، وmengatasi وmenyelesaikan صحيحتان أيضًا.
      en: The collocation we learned is memecahkan masalah; mengatasi and menyelesaikan are also correct.
    words: [memecahkan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: السياحة المستدامة بتحافظ على تراث بالو الثقافي.
      ar: تحافظ السياحة المستدامة على التراث الثقافي لبالو.
      en: Sustainable tourism preserves Palu's cultural heritage.
    answer: Pariwisata berkelanjutan melestarikan warisan budaya Palu.
    distractors: [meningkatkan, deras]
    words: [berkelanjutan, melestarikan, warisan]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: رأيي إن السياحة ليها أثر إيجابي على السكان.
      ar: أرى أنّ للسياحة أثرًا إيجابيًا على السكان.
      en: I believe that tourism has a positive impact on residents.
    answers:
      - Saya berpendapat bahwa pariwisata berdampak positif bagi warga.
      - Saya berpendapat bahwa pariwisata berdampak positif bagi warga
      - Saya berpendapat pariwisata berdampak positif bagi warga.
      - Saya berpendapat bahwa pariwisata berdampak positif pada warga.
      - Saya berpendapat bahwa pariwisata memberikan dampak positif bagi warga.
      - Saya berpendapat bahwa pariwisata memberi dampak positif bagi warga.
      - Menurut saya, pariwisata berdampak positif bagi warga.
      - Saya berpendapat bahwa pariwisata berdampak positif bagi penduduk.
    words: [berpendapat, dampak, warga]
  - id: e09
    type: dictation
    text: Anginnya kencang dan ombaknya tinggi, jadi kapal tidak berangkat.
    meaning:
      ar_eg: الريح شديدة والموج عالي، فالمركب مامشيش.
      ar: الريح شديدة والموج عالٍ، فلم يُبحر القارب.
      en: The wind is strong and the waves are high, so the boat isn't leaving.
    words: [kencang, ombak]
  - id: e10
    type: speaking
    text: Dengan demikian, pariwisata harus memberi manfaat bagi warga dan alam.
    meaning:
      ar_eg: وبكده، السياحة لازم تفيد السكان والطبيعة.
      ar: وبذلك، يجب أن تنفع السياحة السكان والطبيعة.
      en: Thus, tourism must benefit both residents and nature.
    words: [dengan demikian, manfaat]
dialogue:
  title: Debat di Universitas Tadulako
  lines:
    - speaker: Andi
      text: Menurut saya, wisatawan hanya membawa sampah ke pantai.
      ar_eg: في رأيي، السياح مش بيجيبوا غير زبالة للشط.
      ar: في رأيي، لا يجلب السياح إلى الشاطئ إلا النفايات.
      en: In my view, tourists only bring rubbish to the beach.
    - speaker: Mohamed
      text: Saya kurang setuju. Pariwisata membuka lapangan kerja dan meningkatkan pendapatan warga.
      ar_eg: أنا مش موافق أوي. السياحة بتوفّر فرص شغل وبتزوّد دخل الناس.
      ar: لا أوافق تمامًا. توفّر السياحة فرص العمل وتزيد دخل السكان.
      en: I don't quite agree. Tourism creates jobs and increases residents' income.
    - speaker: Andi
      text: Tetapi dampak negatifnya juga besar.
      ar_eg: بس أثرها السلبي كمان كبير.
      ar: لكن أثرها السلبي كبير أيضًا.
      en: But its negative impact is big too.
    - speaker: Mohamed
      text: Betul. Karena itu, kita perlu pariwisata berkelanjutan untuk memecahkan masalah itu.
      ar_eg: صح. عشان كده محتاجين سياحة مستدامة تحل المشكلة دي.
      ar: صحيح. لذلك نحتاج إلى سياحة مستدامة لحل تلك المشكلة.
      en: True. That's why we need sustainable tourism to solve that problem.
    - speaker: Andi
      text: Setuju. Dengan begitu, warga dan alam sama-sama mendapat manfaat.
      ar_eg: موافق. كده السكان والطبيعة الاتنين يستفيدوا.
      ar: أوافق. وبذلك يستفيد السكان والطبيعة معًا.
      en: Agreed. That way, residents and nature both benefit.
souvenir:
  id: bipa4.u06.souvenir
  title: Megalit Lore Lindu
  note:
    ar_eg: في وادي بادا جوه حديقة لوري ليندو الوطنية في وسط سولاويزي، فيه تماثيل حجر بوشوش مدوّرة كبيرة واقفة في وسط الزرع. أشهرهم اسمه بالِندو وطوله أكتر من أربعة متر. محدش يعرف بالظبط مين نحتهم ولا إمتى، بس هما أقدم من أي تاريخ مكتوب في المنطقة. والناس هناك لسه بيحكوا عنهم حكايات، وده نوع من السياحة اللي محتاج نحافظ عليه بهدوء.
    ar: في وادي بادا داخل حديقة لوري ليندو الوطنية في وسط سولاويسي تقف تماثيل حجرية ذات وجوه مستديرة كبيرة بين الحقول، وأشهرها تمثال بالِندو الذي يزيد طوله على أربعة أمتار. لا يعرف أحد على وجه الدقة من نحتها ولا متى، لكنها أقدم من كل تاريخ مكتوب في المنطقة. وما زال أهلها يروون عنها الحكايات، وهي من التراث الذي يستحق سياحة تحافظ عليه.
    en: In the Bada valley, inside Lore Lindu National Park in Central Sulawesi, stone statues with big round faces stand among the fields. The best known, Palindo, is more than four metres tall. Nobody knows exactly who carved them or when, but they are older than any written history of the region. Local people still tell stories about them, and they are just the kind of heritage that sustainable tourism should protect.
