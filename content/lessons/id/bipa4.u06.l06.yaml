schema: kabar.lesson/v1
id: bipa4.u06.l06
language: id
title: Berkendara ke dataran tinggi
can_do:
  ar_eg: 'تتكلم عن رحلة بالعربية: البنزين والطريق السريع والمسافة ولو تهت.'
  ar: 'أن تتحدث عن رحلة بالسيارة: الوقود والطريق السريع والمسافة والضياع.'
  en: 'Talk about a road trip: petrol, toll road, distance and getting lost.'
slides:
  - title: Perjalanan delapan jam
    body:
      ar_eg: |
        mengemudi = يسوق (أرسم من menyetir)، berkendara = يسافر بعربية أو موتوسيكل.
        bensin = بنزين، tol = طريق سريع بفلوس (jalan tol)، rem = فرامل.
        kilometer = كيلومتر، ketinggian = ارتفاع، tersesat = تاه، ضاع الطريق.
      ar: |
        mengemudi = يقود (أكثر رسمية من menyetir)، berkendara = يسافر بسيارة أو دراجة نارية.
        bensin = بنزين، tol = طريق سريع برسوم (jalan tol)، rem = مكابح.
        kilometer = كيلومتر، ketinggian = ارتفاع، tersesat = ضلّ الطريق.
      en: |
        mengemudi = to drive (more formal than menyetir), berkendara = to ride, drive (as a trip).
        bensin = petrol, tol = toll road (jalan tol), rem = brakes.
        kilometer = kilometre, ketinggian = altitude, height; tersesat = lost (on the way).
    examples:
      - text: Toraja hampir tiga ratus kilometer dari Makassar.
        ar_eg: توراجا تقريبًا تلتمية كيلو من ماكاسار.
        ar: تبعد توراجا نحو ثلاثمئة كيلومتر عن ماكاسار.
        en: Toraja is nearly three hundred kilometres from Makassar.
      - text: Kami lewat jalan tol supaya cepat.
        ar_eg: مشينا من الطريق السريع عشان نوصل بسرعة.
        ar: سلكنا الطريق السريع لنصل بسرعة.
        en: We took the toll road to be quick.
      - text: Tanpa peta, kami tersesat di jalan desa.
        ar_eg: من غير خريطة، توهنا في طريق القرية.
        ar: بلا خريطة ضللنا الطريق في القرية.
        en: Without a map, we got lost on the village road.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mengemudi
        ar_eg: يسوق
        ar: يقود
        en: to drive
      - text: berkendara
        ar_eg: يسافر بعربية
        ar: يسافر بسيارة
        en: to ride, drive
      - text: bensin
        ar_eg: بنزين
        ar: بنزين
        en: petrol
      - text: tol
        ar_eg: طريق سريع بفلوس
        ar: طريق برسوم
        en: toll road
    words: [mengemudi, berkendara, bensin, tol]
  - id: e02
    type: match_pairs
    pairs:
      - text: rem
        ar_eg: فرامل
        ar: مكابح
        en: brakes
      - text: kilometer
        ar_eg: كيلو
        ar: كيلومتر
        en: kilometre
      - text: ketinggian
        ar_eg: ارتفاع
        ar: ارتفاع
        en: altitude
      - text: tersesat
        ar_eg: تاه
        ar: ضلّ الطريق
        en: lost
    words: [rem, kilometer, ketinggian, tersesat]
  - id: e03
    type: listen
    text: Bensin hampir habis. Kita berhenti di pom bensin dulu.
    question:
      ar_eg: إيه اللي قرّب يخلص؟
      ar: ما الذي يكاد ينفد؟
      en: What's running out?
    options: [البنزين, الفرامل, الخريطة]
    answer: 0
    meaning:
      ar_eg: البنزين قرّب يخلص. نقف في البنزينة الأول.
      ar: الوقود يكاد ينفد. لنتوقّف عند محطة الوقود أولًا.
      en: We're nearly out of petrol. Let's stop at the petrol station first.
    words: [bensin]
  - id: e04
    type: fill_blank
    sentence: Hati-hati! ___ mobil ini tidak bagus.
    meaning:
      ar_eg: خلي بالك! ___ العربية دي مش كويسة.
      ar: انتبه! ___ هذه السيارة ليست جيدة.
      en: Careful! This car's ___ aren't good.
    options: [Rem, Tol, Ketinggian]
    answers: [Rem]
    words: [rem, tol, ketinggian]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مش عارف أنا فين، تهت! بالإندونيسي؟
      ar: لا أعرف أين أنا، لقد ضللت! بالإندونيسية؟
      en: I don't know where I am, I'm lost! In Indonesian?
    options: [Saya mengemudi!, Saya berkendara!, Saya tersesat!]
    answer: 2
    explain:
      ar_eg: tersesat = تاه.
      ar: tersesat = ضلّ الطريق.
      en: tersesat = lost.
    words: [mengemudi, berkendara, tersesat]
  - id: e06
    type: fill_blank
    sentence: Kota ini ada di ___ seribu meter. Udaranya dingin.
    meaning:
      ar_eg: المدينة دي على ___ ألف متر. الجو فيها برد.
      ar: تقع هذه المدينة على ___ ألف متر. جوّها بارد.
      en: This town is at an ___ of a thousand metres. The air is cold.
    options: [ketinggian, kilometer, bensin]
    answers: [ketinggian]
    words: [ketinggian, kilometer, bensin]
  - id: e07
    type: multiple_choice
    question: Dia belum bisa ___ mobil. Dia masih belajar.
    options: [mengemudi, tersesat, tol]
    answer: 0
    explain:
      ar_eg: mengemudi = يسوق.
      ar: mengemudi = يقود السيارة.
      en: mengemudi = to drive.
    words: [mengemudi, tersesat, tol]
  - id: e08
    type: build_sentence
    source:
      ar_eg: سافرنا بالعربية تمن ساعات للجبل.
      ar: سافرنا بالسيارة ثماني ساعات إلى الجبل.
      en: We drove for eight hours to the mountains.
    answer: Kami berkendara delapan jam ke gunung.
    distractors: [rem, kilometer]
    words: [berkendara, rem, kilometer]
  - id: e09
    type: translate
    direction: from_target
    source_text: Jalan tol itu panjangnya dua puluh kilometer.
    answers_meaning:
      ar_eg: [الطريق السريع ده طوله عشرين كيلو, طول الطريق السريع ده عشرين كيلومتر]
      ar: [طول ذلك الطريق السريع عشرون كيلومترًا, يبلغ طول الطريق السريع عشرين كيلومترًا]
      en: [That toll road is twenty kilometres long, The toll road is 20 km long]
    words: [tol, kilometer]
  - id: e10
    type: speaking
    text: Kalau mengemudi jauh, beli bensin dan periksa rem.
    meaning:
      ar_eg: لو هتسوق مسافة طويلة، فوّل بنزين واكشف على الفرامل.
      ar: إذا قدت مسافة طويلة فاملأ الوقود وافحص المكابح.
      en: If you're driving far, fill up and check the brakes.
    words: [mengemudi, bensin, rem, ketinggian, tersesat]
dialogue:
  lines:
    - speaker: Andi
      text: Mohamed, besok kita berkendara ke Toraja. Kamu bisa mengemudi?
      ar_eg: يا محمد، بكرة هنسافر بالعربية لتوراجا. بتعرف تسوق؟
      ar: يا محمد، غدًا نسافر بالسيارة إلى توراجا. هل تجيد القيادة؟
      en: Mohamed, tomorrow we drive to Toraja. Can you drive?
    - speaker: Mohamed
      text: Bisa, tapi di Indonesia mobil di sebelah kiri. Saya takut.
      ar_eg: أيوه، بس في إندونيسيا العربيات على الشمال. خايف.
      ar: نعم، لكن السيارات في إندونيسيا تسير على اليسار. أخاف.
      en: Yes, but in Indonesia cars drive on the left. I'm scared.
    - speaker: Andi
      text: Tidak apa-apa, saya saja. Kita lewat tol dulu, lalu jalan gunung.
      ar_eg: ولا يهمك، أنا هسوق. هنمشي من الطريق السريع الأول، وبعدين طريق الجبل.
      ar: لا بأس، سأقود أنا. نسلك الطريق السريع أولًا ثم طريق الجبل.
      en: No problem, I'll do it. We'll take the toll road first, then the mountain road.
    - speaker: Mohamed
      text: Berapa kilometer? Bensinnya cukup?
      ar_eg: كام كيلو؟ البنزين يكفي؟
      ar: كم كيلومترًا؟ هل يكفي الوقود؟
      en: How many kilometres? Is there enough petrol?
    - speaker: Andi
      text: Hampir tiga ratus. Kita beli di jalan. Yang penting kita tidak tersesat!
      ar_eg: تقريبًا تلتمية. هنفوّل في السكة. المهم ما نتوهش!
      ar: نحو ثلاثمئة. سنملأ الوقود في الطريق. المهم ألّا نضلّ!
      en: Nearly three hundred. We'll fill up on the way. The main thing is not getting lost!
