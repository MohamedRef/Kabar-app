schema: kabar.lesson/v1
id: bipa1.u03.l06
language: id
title: Foto di rumah Nenek
can_do:
  ar_eg: 'توصف صورة عيلة: الجد والجدة والأحفاد، ومين الراجل ومين الست في الصورة.'
  ar: 'أن تصف صورة عائلية: الجدّين والأحفاد، ومَن الرجل ومَن المرأة في الصورة.'
  en: 'Describe a family photo: grandparents, grandchildren, and who''s who in it.'
slides:
  - title: Foto keluarga
    body:
      ar_eg: |
        nenek = جدة، kakek = جد، وولاد ولادهم cucu (حفيد أو حفيدة).
        bayi = بيبي، gadis = بنت أو صبية، siswa = تلميذ في المدرسة (mahasiswa = طالب جامعة).
        pria = راجل، wanita = ست: كلمتين رسميين، هتلاقيهم تحت الصور وعلى باب التواليت وفي الاستمارات. في الكلام العادي laki-laki وperempuan.
      ar: |
        nenek = جدّة، kakek = جدّ، وأولاد أولادهما cucu (حفيد أو حفيدة).
        bayi = رضيع، gadis = فتاة، siswa = تلميذ المدرسة (mahasiswa = طالب الجامعة).
        pria = رجل، wanita = امرأة: كلمتان رسميتان تجدهما تحت الصور وعلى أبواب دورات المياه وفي الاستمارات، أما في الكلام العادي فـ laki-laki وperempuan.
      en: |
        nenek = grandmother, kakek = grandfather, and their grandchildren are cucu.
        bayi = baby, gadis = girl, siswa = school pupil (mahasiswa = university student).
        pria = man and wanita = woman: formal words you'll see under photos, on toilet doors and on forms. Everyday speech uses laki-laki and perempuan.
    examples:
      - text: Ini nenek dan kakek saya.
        ar_eg: دي جدتي ودا جدي.
        ar: هذه جدّتي وهذا جدّي.
        en: These are my grandmother and grandfather.
      - text: Pria di foto ini kakek saya.
        ar_eg: الراجل اللي في الصورة دي جدي.
        ar: الرجل في هذه الصورة جدّي.
        en: The man in this photo is my grandfather.
      - text: Gadis ini cucu Nenek. Dia siswa.
        ar_eg: البنت دي حفيدة تيتا. هي تلميذة.
        ar: هذه الفتاة حفيدة الجدّة، وهي تلميذة.
        en: This girl is Grandma's granddaughter. She's a pupil.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nenek
        ar_eg: جدة
        ar: جدّة
        en: grandmother
      - text: kakek
        ar_eg: جد
        ar: جدّ
        en: grandfather
      - text: cucu
        ar_eg: حفيد
        ar: حفيد
        en: grandchild
      - text: bayi
        ar_eg: بيبي
        ar: رضيع
        en: baby
    words: [nenek, kakek, cucu, bayi]
  - id: e02
    type: match_pairs
    pairs:
      - text: gadis
        ar_eg: بنت، صبية
        ar: فتاة
        en: girl
      - text: siswa
        ar_eg: تلميذ
        ar: تلميذ
        en: pupil
      - text: pria
        ar_eg: راجل
        ar: رجل
        en: man
      - text: wanita
        ar_eg: ست
        ar: امرأة
        en: woman
    words: [gadis, siswa, pria, wanita]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أبو مامتك تقوله إيه بالإندونيسي؟
      ar: بماذا تسمّي أبا أمك بالإندونيسية؟
      en: What do you call your mother's father in Indonesian?
    options: [kakek, cucu, gadis]
    answer: 0
    explain:
      ar_eg: kakek = الجد من أي ناحية. cucu = حفيد، وgadis = بنت.
      ar: kakek هو الجدّ من أي جهة، وcucu حفيد، وgadis فتاة.
      en: kakek is a grandfather on either side; cucu is a grandchild and gadis a girl.
    words: [kakek, cucu, gadis]
  - id: e04
    type: listen
    text: Nenek saya punya tiga cucu.
    question:
      ar_eg: الجدة عندها إيه؟
      ar: ماذا لدى الجدّة؟
      en: What does Grandma have?
    options: [٣ أحفاد, ٣ عيال صغيرين, ٣ تلاميذ]
    answer: 0
    meaning:
      ar_eg: جدتي عندها ٣ أحفاد.
      ar: لجدّتي ثلاثة أحفاد.
      en: My grandmother has three grandchildren.
    words: [nenek, cucu]
  - id: e05
    type: fill_blank
    sentence: Adik saya ___. Kakak saya mahasiswa.
    meaning:
      ar_eg: أخويا الصغير ___، وأخويا الكبير طالب جامعة.
      ar: أخي الأصغر ___، وأخي الأكبر طالب جامعي.
      en: My younger brother is a ___. My older brother is a university student.
    options: [siswa, bayi, kakek]
    answers: [siswa]
    words: [siswa, bayi, kakek]
    explain:
      ar_eg: الأخ الكبير في الجامعة، والصغير siswa = تلميذ في المدرسة. bayi = رضيع، وkakek = جد.
      ar: الأصغر siswa أي تلميذ مدرسة. bayi رضيع وkakek جد.
      en: A younger brother at school is a siswa.
  - id: e06
    type: fill_blank
    sentence: ___ itu kecil dan lucu.
    meaning:
      ar_eg: الـ ___ ده صغير وعسول.
      ar: ذلك ___ صغير ولطيف.
      en: That ___ is small and cute.
    options: [Bayi, Wanita, Pria]
    answers: [Bayi]
    words: [bayi, wanita, pria]
    explain:
      ar_eg: صغير ولطيف = Bayi (بيبي). wanita = ست، وpria = راجل.
      ar: الصغير اللطيف Bayi أي رضيع. wanita امرأة وpria رجل.
      en: "Small and cute: a bayi (baby)."
  - id: e07
    type: build_sentence
    source:
      ar_eg: الراجل اللي في الصورة دي جدي.
      ar: الرجل في هذه الصورة جدّي.
      en: The man in this photo is my grandfather.
    answer: Pria di foto ini kakek saya.
    distractors: [nenek, cucu]
    words: [pria, kakek]
    explain:
      ar_eg: Pria (الراجل) + di foto ini + kakek saya (جدي). nenek وcucu زيادة.
      ar: Pria di foto ini kakek saya. nenek وcucu زائدتان.
      en: Pria + di foto ini + kakek saya. nenek and cucu are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Wanita itu nenek saya.
    answers_meaning:
      ar_eg: [الست دي جدتي, الست ديه تيتا]
      ar: [تلك المرأة جدّتي]
      en: [That woman is my grandmother, That lady is my grandma]
    words: [wanita, nenek]
  - id: e09
    type: speaking
    text: Gadis ini cucu Bu Yanti. Dia siswa.
    meaning:
      ar_eg: البنت دي حفيدة مدام يانتي. هي تلميذة.
      ar: هذه الفتاة حفيدة السيدة يانتي، وهي تلميذة.
      en: This girl is Mrs Yanti's granddaughter. She's a pupil.
    words: [gadis, cucu, siswa]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: 'على باب التواليت مكتوب كلمتين. إنتي ست: تدخلي أنهي باب؟'
      ar: 'على بابَي دورة المياه كلمتان، وأنتِ امرأة: أيّ باب تدخلين؟'
      en: 'Two words on the toilet doors. You''re a woman: which door is yours?'
    options: [Wanita, Pria, Bayi]
    answer: 0
    explain:
      ar_eg: Wanita للستات وPria للرجالة.
      ar: Wanita للنساء وPria للرجال.
      en: Wanita is for women, Pria for men.
    words: [wanita, pria, bayi]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, ini foto di rumah nenekku.
      ar_eg: يا محمد، دي صورة في بيت جدتي.
      ar: يا محمد، هذه صورة في بيت جدّتي.
      en: Mohamed, this is a photo at my grandmother's house.
    - speaker: Mohamed
      text: Pria ini siapa? Kakek kamu?
      ar_eg: مين الراجل ده؟ جدك؟
      ar: من هذا الرجل؟ جدّك؟
      en: Who's this man? Your grandfather?
    - speaker: Rina
      text: Ya. Dan wanita ini nenekku.
      ar_eg: أيوه. والست دي جدتي.
      ar: نعم، وهذه المرأة جدّتي.
      en: Yes. And this woman is my grandmother.
    - speaker: Mohamed
      text: Bayi kecil ini siapa?
      ar_eg: والبيبي الصغير ده مين؟
      ar: ومن هذا الرضيع الصغير؟
      en: Who's this little baby?
    - speaker: Rina
      text: Itu aku! Aku bayi di foto ini.
      ar_eg: دي أنا! أنا البيبي اللي في الصورة.
      ar: هذه أنا! أنا الرضيعة في هذه الصورة.
      en: That's me! I'm the baby in this photo.
    - speaker: Mohamed
      text: Wah! Nenek kamu punya banyak cucu?
      ar_eg: يا سلام! جدتك عندها أحفاد كتير؟
      ar: ما شاء الله! هل لجدتك أحفاد كثيرون؟
      en: Aww! Does your grandma have lots of grandchildren?
