schema: kabar.lesson/v1
id: bipa7.u10.l13
language: id
title: Poster ilmiah
can_do:
  ar_eg: تعمل بوستر علمي مرتّب وتشرحه لزوّار المؤتمر في دقيقتين.
  ar: أن تُعدّ ملصقًا علميًّا منظّمًا وتشرحه لزوّار المؤتمر في دقيقتين.
  en: Make a tidy research poster and explain it to conference visitors in two minutes.
slides:
  - title: Dua menit di depan poster
    body:
      ar_eg: |
        الـ poster (بوستر علمي) بيتعلّق في المؤتمر، والزوّار بيعدّوا عليه.
        الـ tata letak (تنسيق الصفحة) الكويس:
        - العنوان كبير فوق، وتحته اسمك وجامعتك.
        - أعمدة: Pendahuluan ← Metode ← Hasil ← Kesimpulan.
        - صور وdiagram batang أكتر من الكلام.
        لما زائر يقف: «Selamat siang. Penelitian saya tentang… Temuan utamanya…» في دقيقتين بس.
      ar: |
        يُعلَّق الـ poster (الملصق العلميّ) في المؤتمر ويمرّ به الزوّار.
        والـ tata letak (التنسيق) الجيّد:
        - العنوان كبير في الأعلى، وتحته اسمك وجامعتك.
        - أعمدة: Pendahuluan ← Metode ← Hasil ← Kesimpulan.
        - صور وdiagram batang أكثر من النصّ.
        وحين يقف زائر: «Selamat siang. Penelitian saya tentang… Temuan utamanya…» في دقيقتين فقط.
      en: |
        A poster hangs at the conference while visitors walk past.
        Good tata letak (layout):
        - A big title at the top, your name and university below it.
        - Columns: Pendahuluan → Metode → Hasil → Kesimpulan.
        - More pictures and diagram batang than text.
        When a visitor stops: "Selamat siang. Penelitian saya tentang… Temuan utamanya…" in just two minutes.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الـ «tata letak» في البوستر يعني إيه؟
      ar: ما الـ «tata letak» في الملصق؟
      en: What is the "tata letak" of a poster?
    options:
      - لون الحبر.
      - تنسيق وترتيب الأجزاء على الصفحة.
      - اسم المطبعة.
    answer: 1
    words: [tata letak]
    explain:
      ar_eg: tata letak = تنسيق وترتيب الأجزاء على الصفحة (layout).
      ar: tata letak = تخطيط الصفحة وترتيب عناصرها.
      en: tata letak is the layout.
  - id: e02
    type: listen
    text: Poster saya punya empat kolom, dari pendahuluan sampai kesimpulan.
    question:
      ar_eg: البوستر فيه كام عمود؟
      ar: كم عمودًا في الملصق؟
      en: How many columns does the poster have?
    options:
      - أربعة.
      - اتنين.
      - عشرة.
    answer: 0
    words: [poster]
  - id: e03
    type: fill_blank
    sentence: ___ poster ini rapi. Judulnya besar dan gambarnya jelas.
    meaning:
      ar_eg: تنسيق البوستر ده مرتّب. العنوان كبير والصور واضحة.
      ar: تنسيق هذا الملصق مرتّب، فعنوانه كبير وصوره واضحة.
      en: This poster's layout is tidy. The title is big and the pictures are clear.
    options: [Tata letak, Sumbu, Skripsi]
    answers: [Tata letak]
    words: [tata letak, poster]
    explain:
      ar_eg: العنوان كبير والصور واضحة = Tata letak (التنسيق) مرتب. sumbu محور وskripsi رسالة.
      ar: Tata letak الملصق مرتب. sumbu محور وskripsi رسالة تخرج.
      en: A tidy poster has good tata letak.
  - id: e04
    type: build_sentence
    source:
      ar_eg: أهم نتيجة في بحثي في العمود التالت.
      ar: أهمّ نتيجة في بحثي في العمود الثالث.
      en: My main finding is in the third column.
    answer: Temuan utama saya ada di kolom ketiga.
    distractors: [poster, tata]
    words: [temuan]
    explain:
      ar_eg: Temuan utama saya (نتيجتي الأساسية) + ada di + kolom ketiga (العمود التالت). poster وtata زيادة.
      ar: Temuan utama saya ada di kolom ketiga. poster وtata زائدتان.
      en: Temuan utama saya + ada di + kolom ketiga. poster and tata are extra.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أحسن بوستر فيه إيه أكتر؟
      ar: ما الذي ينبغي أن يكثر في الملصق الجيّد؟
      en: What should a good poster have more of?
    options:
      - كلام طويل بخط صغير.
      - جداول من غير عناوين.
      - صور ورسومات أكتر من الكلام.
    answer: 2
    words: [poster, diagram batang]
    explain:
      ar_eg: البوستر الكويس فيه صور ورسومات أكتر من الكلام، علشان يتقري من بعيد.
      ar: الملصق الجيد يكثر من الصور والرسوم ويقلّل النص.
      en: A good poster has more visuals than text.
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ممكن أشرحلك البوستر بتاعي في دقيقتين؟
      ar: أتسمح لي أن أشرح لك ملصقي في دقيقتين؟
      en: May I explain my poster to you in two minutes?
    answers:
      - Boleh saya jelaskan poster saya dalam dua menit?
      - Bolehkah saya menjelaskan poster saya dalam dua menit?
      - Boleh saya menjelaskan poster saya selama dua menit?
      - Apakah saya boleh menjelaskan poster saya dalam dua menit?
    words: [poster]
  - id: e07
    type: speaking
    text: Selamat siang. Penelitian saya tentang ubi jalar di Lembah Baliem.
    meaning:
      ar_eg: نهارك سعيد. بحثي عن البطاطا الحلوة في وادي باليم.
      ar: طاب يومك. بحثي عن البطاطا الحلوة في وادي باليم.
      en: Good afternoon. My research is on sweet potato in the Baliem Valley.
    words: [poster]
  - id: e08
    type: dictation
    text: Tata letak yang baik membuat poster mudah dibaca dari jauh.
    meaning:
      ar_eg: التنسيق الكويس بيخلّي البوستر سهل يتقري من بعيد.
      ar: يجعل التنسيق الجيّد الملصق سهل القراءة من بعيد.
      en: A good layout makes a poster easy to read from afar.
    words: [tata letak, poster]
  - id: e09
    type: speaking
    text: Saya pindahkan diagram batangnya ke tengah supaya tata letaknya seimbang.
    meaning:
      ar_eg: هنقل الرسم بالأعمدة للنص علشان التنسيق يبقى متوازن.
      ar: سأنقل مخطّط الأعمدة إلى الوسط ليتوازن التنسيق.
      en: I'll move the bar chart to the middle so the layout is balanced.
    words: [tata letak, diagram batang]
  - id: e10
    type: match_pairs
    pairs:
      - text: tinjauan pustaka
        ar_eg: مراجعة الدراسات السابقة
        ar: مراجعة الأدبيات
        en: literature review
      - text: pencilan
        ar_eg: قيمة شاذّة بعيدة عن الباقي
        ar: قيمة متطرّفة
        en: outlier
      - text: validitas
        ar_eg: صدق (البيانات بتقيس اللي المفروض تقيسه)
        ar: الصدق
        en: validity
      - text: disertasi
        ar_eg: رسالة دكتوراه
        ar: أطروحة الدكتوراه
        en: doctoral dissertation
    words: [tinjauan pustaka, pencilan, validitas, disertasi]
dialogue:
  title: Malam sebelum konferensi
  lines:
    - speaker: Pak Elias
      text: Postermu terlalu penuh tulisan, Mohamed. Pengunjung hanya berhenti dua menit.
      ar_eg: البوستر بتاعك مليان كلام أوي يا محمد. الزوّار بيقفوا دقيقتين بس.
      ar: ملصقك مزدحم بالنصّ يا محمد، والزائر لا يقف إلا دقيقتين.
      en: Your poster has too much text, Mohamed. Visitors only stop for two minutes.
    - speaker: Mohamed
      text: Jadi saya ganti paragraf hasil dengan diagram batang?
      ar_eg: يعني أبدّل فقرة النتايج برسم بالأعمدة؟
      ar: أأستبدل فقرة النتائج بمخطّط أعمدة؟
      en: So I swap the results paragraph for a bar chart?
    - speaker: Pak Elias
      text: Ya. Dan perbaiki tata letaknya. Judul di atas, kesimpulan di kanan bawah.
      ar_eg: أيوه. وظبّط التنسيق. العنوان فوق، والخلاصة تحت على اليمين.
      ar: 'نعم، وأصلح التنسيق: العنوان في الأعلى، والخلاصة أسفل اليمين.'
      en: Yes. And fix the layout. Title at the top, conclusion bottom right.
    - speaker: Mohamed
      text: Siap, Pak. Besok poster ini akan bercerita sendiri.
      ar_eg: حاضر يا أستاذ. بكرة البوستر ده هيحكي لوحده.
      ar: حسنًا يا أستاذ، وغدًا سيروي هذا الملصق قصّته بنفسه.
      en: Will do, sir. Tomorrow this poster will tell its own story.
new_words:
  - word: poster
    pos: noun
    ar_eg: بوستر علمي
    ar: ملصق علميّ
    en: (research) poster
  - word: tata letak
    pos: noun
    ar_eg: تنسيق الصفحة
    ar: التنسيق، المخطّط
    en: layout
review:
  status: draft
