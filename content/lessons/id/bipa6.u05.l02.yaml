schema: kabar.lesson/v1
id: bipa6.u05.l02
language: id
title: Museum Tsunami
can_do:
  ar_eg: تقرا نص تذكاري عن كارثة وتفهمه وتتكلم عنه باحترام.
  ar: أن تقرأ نصًّا تذكاريًّا عن كارثة وتفهمه وتتحدّث عنه باحترام.
  en: Read a memorial text about a disaster and talk about it with respect.
slides:
  - title: Lorong yang gelap
    body:
      ar_eg: |
        اقرا (مكتوب للدرس):
        Pada pagi hari 26 Desember 2004, gelombang tsunami menghantam pesisir Aceh. Lebih dari seratus ribu orang menjadi korban. Kini Museum Tsunami Aceh berdiri untuk mengenang mereka. Pengunjung berjalan melalui lorong gelap yang basah, lalu tiba di ruang tempat nama-nama korban tertulis di dinding. Setelah bencana itu, ribuan relawan datang dari seluruh dunia.
        - gelombang = موجة، korban = ضحية
        - mengenang = يفتكر / يحيي ذكرى، bencana = كارثة
        - relawan = متطوّع
      ar: |
        اقرأ (نصّ مكتوب للدرس):
        Pada pagi hari 26 Desember 2004, gelombang tsunami menghantam pesisir Aceh. Lebih dari seratus ribu orang menjadi korban. Kini Museum Tsunami Aceh berdiri untuk mengenang mereka. Pengunjung berjalan melalui lorong gelap yang basah, lalu tiba di ruang tempat nama-nama korban tertulis di dinding. Setelah bencana itu, ribuan relawan datang dari seluruh dunia.
        - gelombang = موجة، korban = ضحيّة
        - mengenang = يُحيي ذكرى، bencana = كارثة
        - relawan = متطوّع
      en: |
        Read (written for the lesson):
        Pada pagi hari 26 Desember 2004, gelombang tsunami menghantam pesisir Aceh. Lebih dari seratus ribu orang menjadi korban. Kini Museum Tsunami Aceh berdiri untuk mengenang mereka. Pengunjung berjalan melalui lorong gelap yang basah, lalu tiba di ruang tempat nama-nama korban tertulis di dinding. Setelah bencana itu, ribuan relawan datang dari seluruh dunia.
        - gelombang = wave, korban = victim
        - mengenang = to remember, to commemorate, bencana = disaster
        - relawan = volunteer
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gelombang
        ar_eg: موجة
        ar: موجة
        en: wave
      - text: korban
        ar_eg: ضحية
        ar: ضحيّة
        en: victim
      - text: mengenang
        ar_eg: يحيي ذكرى
        ar: يُحيي ذكرى
        en: to commemorate
      - text: bencana
        ar_eg: كارثة
        ar: كارثة
        en: disaster
      - text: relawan
        ar_eg: متطوّع
        ar: متطوّع
        en: volunteer
    words: [gelombang, korban, mengenang, bencana, relawan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أسامي الضحايا مكتوبة فين في المتحف؟
      ar: أين كُتبت أسماء الضحايا في المتحف؟
      en: Where are the victims' names written in the museum?
    options:
      - في كتاب عند الباب.
      - على حيطان أوضة.
      - على شاشة برّه.
    answer: 1
    words: [korban]
  - id: e03
    type: fill_blank
    sentence: Museum ini dibangun untuk ___ para korban tsunami.
    meaning:
      ar_eg: المتحف ده اتبنى علشان يحيي ذكرى ضحايا التسونامي.
      ar: بُني هذا المتحف لإحياء ذكرى ضحايا التسونامي.
      en: This museum was built to commemorate the tsunami's victims.
    options: [mengenang, gelombang, relawan]
    answers: [mengenang]
    words: [mengenang, korban]
  - id: e04
    type: listen
    text: Ribuan relawan datang membantu setelah bencana itu.
    question:
      ar_eg: إيه اللي حصل بعد الكارثة؟
      ar: ماذا حدث بعد الكارثة؟
      en: What happened after the disaster?
    options:
      - الناس سابت البلد.
      - المتحف قفل.
      - آلاف المتطوّعين جم يساعدوا.
    answer: 2
    words: [relawan, bencana]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الموجة كانت أعلى من البيوت.
      ar: كانت الموجة أعلى من البيوت.
      en: The wave was higher than the houses.
    answer: Gelombang itu lebih tinggi daripada rumah-rumah.
    distractors: [korban, mengenang]
    words: [gelombang]
  - id: e06
    type: translate
    direction: from_target
    source_text: Bencana itu mengubah hidup banyak keluarga di Aceh.
    answers_meaning:
      ar_eg:
        - الكارثة دي غيّرت حياة عيلات كتير في آتشيه.
        - عيلات كتير في آتشيه حياتها اتغيرت بسبب الكارثة دي.
      ar:
        - غيّرت تلك الكارثة حياة أسر كثيرة في آتشيه.
        - تبدّلت حياة أسر كثيرة في آتشيه بسبب تلك الكارثة.
      en:
        - That disaster changed the lives of many families in Aceh.
        - Many families in Aceh had their lives changed by that disaster.
    words: [bencana]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة أنسب في كتاب الزوار بتاع المتحف؟
      ar: أيّ جملة أنسب لسجلّ زوّار المتحف؟
      en: Which line suits the museum's guest book best?
    options:
      - Kami mengenang para korban dengan doa.
      - Museumnya seru sekali, keren!
      - Gelombangnya besar, ya.
    answer: 0
    words: [mengenang, korban, gelombang]
  - id: e08
    type: speaking
    text: Saya ingin menjadi relawan kalau ada bencana lagi.
    meaning:
      ar_eg: نفسي أبقى متطوّع لو حصلت كارثة تاني.
      ar: أودّ أن أكون متطوّعًا إن وقعت كارثة أخرى.
      en: I'd like to be a volunteer if there's another disaster.
    words: [relawan, bencana]
  - id: e09
    type: dictation
    text: Gelombang besar itu datang pada pagi hari.
    meaning:
      ar_eg: الموجة الكبيرة دي جت الصبح.
      ar: جاءت تلك الموجة العظيمة في الصباح.
      en: That great wave came in the morning.
    words: [gelombang]
dialogue:
  title: Di depan dinding nama
  lines:
    - speaker: Mohamed
      text: Kak, ada nama keluarga Kakak di dinding ini?
      ar_eg: يا كاك، فيه اسم حد من عيلتك على الحيطة دي؟
      ar: هل على هذا الجدار اسم أحد من عائلتك؟
      en: Kak, is anyone from your family named on this wall?
    - speaker: Kak Rahmah
      text: Ada. Almarhumah nenek saya. Waktu itu saya masih kecil.
      ar_eg: أيوه. ستي المرحومة. ساعتها كنت لسه صغيرة.
      ar: نعم، جدّتي المرحومة. كنت صغيرة حينها.
      en: Yes. My late grandmother. I was still small then.
    - speaker: Mohamed
      text: Saya ikut berduka. Semoga beliau mendapat rahmat-Nya.
      ar_eg: البقية في حياتك. ربنا يرحمها.
      ar: أعزّيك. رحمها الله.
      en: I'm so sorry. May she receive His mercy.
    - speaker: Kak Rahmah
      text: Amin. Kami datang ke sini bukan untuk sedih saja, tetapi untuk mengenang.
      ar_eg: آمين. إحنا بنيجي هنا مش علشان نزعل وبس، علشان نفتكر.
      ar: آمين. لا نأتي إلى هنا لنحزن فقط، بل لنتذكّر.
      en: Amen. We don't come here only to grieve, but to remember.
