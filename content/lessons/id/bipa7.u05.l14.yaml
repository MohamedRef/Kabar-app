dialogue:
  title: Di puncak Wayag
  lines:
    - speaker: Pak Hasan
      text: Dari sini kita lihat ratusan pulau karst. Indah, kan?
      ar_eg: من هنا بنشوف مئات الجزر الجيرية. حلوة، مش كده؟
      ar: من هنا نرى مئات الجزر الكلسية. جميلة، أليس كذلك؟
      en: From here we see hundreds of karst islands. Beautiful, isn't it?
    - speaker: Mohamed
      text: Indah banget. Kayak linimasa, tiap pulau punya ceritanya sendiri.
      ar_eg: حلوة قوي. زي الخط الزمني، كل جزيرة ليها حكايتها.
      ar: جميلة جدًّا. وكالخطّ الزمني، لكلّ جزيرة حكايتها.
      en: Very. Like a timeline, every island has its own story.
    - speaker: Pak Hasan
      text: Kamu udah jadi sejarawan kecil. Habis ini ke mana?
      ar_eg: إنت بقيت مؤرّخ صغير. رايح فين بعد كده؟
      ar: صرتَ مؤرّخًا صغيرًا. إلى أين بعد هذا؟
      en: You've become a little historian. Where to after this?
    - speaker: Mohamed
      text: Ke Misool. Saya mau belajar tentang media sosial dan hoaks.
      ar_eg: على ميسول. عايز أتعلّم عن السوشيال ميديا والأخبار الكدب.
      ar: إلى ميسول، أريد أن أتعلّم عن وسائل التواصل والأخبار الكاذبة.
      en: To Misool. I want to learn about social media and hoaxes.
souvenir:
  id: bipa7.u05.souvenir
  title: Pulau-pulau karst Wayag
  note:
    ar_eg: وايّاج مجموعة جزر جيرية (karst) في شمال راجا أمبات، شكلها زي قِباب خضرا طالعة من مية فيروزي، وغالبًا مفيهاش سكان. ومن فوق التل بتتشاف واحدة من أشهر المناظر في إندونيسيا. وبمناسبة الوحدة دي، تاريخ إندونيسيا بيمشي من محطات تجارة الشركة الهولندية (VOC) لاستقلال 1945 لإصلاح 1998. ومصر من أوائل الدول اللي اعترفت بإندونيسيا، بحكم الأمر الواقع سنة 1946 على حسب مصادر إندونيسية كتير، وبمعاهدة صداقة اتمضت في القاهرة سنة 1947.
    ar: وايّاغ مجموعة جزر كلسية (karst) في شمال راجا أمبات، تبدو كقِباب خضراء تنبثق من ماء فيروزي، وهي غير مأهولة في الغالب، ومن أعلى تلّها يُرى أحد أشهر المشاهد في إندونيسيا. ويمتدّ تاريخ إندونيسيا من مراكز تجارة الشركة الهولندية (VOC) إلى استقلال 1945 فإصلاح 1998. وكانت مصر من أوائل الدول المعترفة بإندونيسيا، اعترافًا واقعيًّا عام 1946 بحسب مصادر إندونيسية كثيرة، ثمّ بمعاهدة صداقة وُقّعت في القاهرة عام 1947.
    en: Wayag is a cluster of karst islands in northern Raja Ampat, green domes rising from turquoise water, mostly uninhabited; the view from its summit is one of Indonesia's most famous. Indonesia's history runs from the VOC trading posts to independence in 1945 and Reformasi in 1998. Egypt was among the first countries to recognise Indonesia, de facto in 1946 according to many Indonesian sources, then through a friendship treaty signed in Cairo in 1947.
