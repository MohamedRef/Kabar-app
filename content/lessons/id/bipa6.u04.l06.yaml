id: bipa6.u04.l06
language: id
title: Samudera Pasai
can_do:
  ar_eg: تحكي عن أول سلطنة إسلامية في إندونيسيا وعن زيارة ابن بطوطة ليها.
  ar: أن تروي خبر أولى السلطنات الإسلامية في إندونيسيا وزيارة ابن بطوطة لها.
  en: Tell about one of Indonesia's first Islamic sultanates and Ibn Battuta's visit.
slides:
  - title: Ibnu Battutah di Sumatra
    body:
      ar_eg: |
        Samudera Pasai في شمال آتشيه من أقدم الـ kesultanan (السلطنات) الإسلامية في إندونيسيا.
        - kesultanan = سلطنة
        - batu nisan = شاهد القبر. شاهد قبر السلطان مالك الصالح عليه سنة ٦٩٦ هجري (١٢٩٧ م).
        - memeluk Islam = يدخل الإسلام (حرفيًا: يحضن الإسلام)
        - saudagar = تاجر كبير، من الفارسي سوداگر. التجار هما اللي جابوا الإسلام هنا.
        - musafir = مسافر، زي العربي. ابن بطوطة زار Pasai حوالي سنة ١٣٤٥ وهو رايح الصين، وكتب عنها في الرحلة.
        - في الشارع: nggak = tidak (لأ / مش)، aku / -ku = saya (أنا)، baca = membaca (يقرا).
      ar: |
        Samudera Pasai في شمال آتشيه من أقدم الـ kesultanan (السلطنات) الإسلامية في إندونيسيا.
        - kesultanan = سلطنة
        - batu nisan = شاهد القبر؛ وعلى شاهد قبر السلطان الملك الصالح سنة ٦٩٦ هـ (١٢٩٧ م).
        - memeluk Islam = يعتنق الإسلام (حرفيًّا: يعانقه)
        - saudagar = تاجر كبير، من الفارسية سوداگر؛ والتجّار هم من حملوا الإسلام إلى هنا.
        - musafir = مسافر، كما في العربية؛ وقد زار ابن بطوطة Pasai نحو سنة ١٣٤٥ في طريقه إلى الصين ووصفها في رحلته.
        - في كلام الشارع: nggak = tidak (لا / ليس)، aku / -ku = saya (أنا)، baca = membaca (يقرأ).
      en: |
        Samudera Pasai, in northern Aceh, is one of Indonesia's oldest Islamic kesultanan (sultanates).
        - kesultanan = sultanate
        - batu nisan = gravestone. Sultan Malik as-Saleh's gravestone is dated 696 AH (1297 CE).
        - memeluk Islam = to embrace Islam (literally, to hug it)
        - saudagar = wealthy merchant, from Persian saudāgar. Merchants brought Islam here.
        - musafir = traveller, as in Arabic. Ibn Battuta visited Pasai around 1345 on his way to China and wrote about it in his Rihla.
        - On the street: nggak = tidak (no, not), aku / -ku = saya (I), baca = membaca (to read).
    examples:
      - text: Raja Samudera Pasai memeluk Islam setelah bertemu saudagar dari seberang laut.
        ar_eg: ملك ساموديرا باساي دخل الإسلام بعد ما قابل تجار من ورا البحر.
        ar: اعتنق ملك ساموديرا باساي الإسلام بعد لقائه تجّارًا من وراء البحر.
        en: The king of Samudera Pasai embraced Islam after meeting merchants from overseas.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kesultanan
        ar_eg: سلطنة
        ar: سلطنة
        en: sultanate
      - text: batu nisan
        ar_eg: شاهد قبر
        ar: شاهد قبر
        en: gravestone
      - text: memeluk Islam
        ar_eg: يدخل الإسلام
        ar: يعتنق الإسلام
        en: to embrace Islam
      - text: saudagar
        ar_eg: تاجر كبير
        ar: تاجر
        en: merchant
      - text: musafir
        ar_eg: مسافر
        ar: مسافر
        en: traveller
    words: [kesultanan, batu nisan, memeluk Islam, saudagar, musafir]
  - id: e02
    type: listen
    text: Batu nisan Sultan Malik as-Saleh bertuliskan tahun 696 Hijriah.
    question:
      ar_eg: شاهد القبر مكتوب عليه سنة كام؟
      ar: أيّ سنة كُتبت على شاهد القبر؟
      en: Which year is written on the gravestone?
    options:
      - ١٤٠٥ ميلادي.
      - ٦٩٦ هجري.
      - ١٩٤٥ ميلادي.
    answer: 1
    words: [batu nisan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي جاب الإسلام لساموديرا باساي؟
      ar: من حمل الإسلام إلى ساموديرا باساي؟
      en: Who brought Islam to Samudera Pasai?
    options:
      - جيش أجنبي.
      - البعثات الأوروبية.
      - التجار اللي جم بالبحر.
    answer: 2
    words: [saudagar]
  - id: e04
    type: fill_blank
    sentence: Ibnu Battutah adalah ___ dari Maroko yang pernah singgah di Pasai.
    meaning:
      ar_eg: ابن بطوطة رحالة من المغرب عدّى على باساي.
      ar: ابن بطوطة رحّالة مغربي توقّف في باساي.
      en: Ibn Battuta was a traveller from Morocco who stopped over in Pasai.
    options: [musafir, saudagar, laksamana]
    answers: [musafir]
    words: [musafir, singgah]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «memeluk Islam» معناها الحرفي إيه؟
      ar: ما المعنى الحرفيّ لـ «memeluk Islam»؟
      en: What is the literal meaning of "memeluk Islam"?
    options:
      - يحضن الإسلام.
      - يقرا عن الإسلام.
      - يسيب الإسلام.
    answer: 0
    explain:
      ar_eg: peluk = حضن، ودي الطريقة العادية لقول «دخل الإسلام».
      ar: peluk = عناق، وهي الطريقة المألوفة لقول «اعتنق الإسلام».
      en: peluk = hug; it's the usual way to say "became Muslim".
    words: [memeluk Islam]
  - id: e06
    type: build_sentence
    source:
      ar_eg: ساموديرا باساي سلطنة إسلامية قديمة في آتشيه.
      ar: ساموديرا باساي سلطنة إسلامية قديمة في آتشيه.
      en: Samudera Pasai is an old Islamic sultanate in Aceh.
    answer: Samudera Pasai adalah kesultanan Islam kuno di Aceh.
    distractors: [musafir, saudagar]
    words: [kesultanan, kuno]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: التجار جابوا الإسلام لسومطرة.
      ar: حمل التجّار الإسلام إلى سومطرة.
      en: Merchants brought Islam to Sumatra.
    answers:
      - Saudagar membawa Islam ke Sumatra.
      - Para saudagar membawa Islam ke Sumatra.
      - Saudagar-saudagar membawa Islam ke Sumatra.
      - Islam dibawa oleh saudagar ke Sumatra.
    words: [saudagar]
  - id: e08
    type: speaking
    text: Menurut musafir itu, banyak penduduk pesisir sudah memeluk Islam.
    meaning:
      ar_eg: حسب الرحالة ده، ناس كتير من أهل الساحل كانوا دخلوا الإسلام.
      ar: بحسب ذلك الرحّالة، كان كثير من سكّان الساحل قد اعتنقوا الإسلام.
      en: According to that traveller, many coastal people had already embraced Islam.
    words: [musafir, memeluk Islam]
  - id: e09
    type: dictation
    text: Batu nisan itu ditulis dengan huruf Arab yang indah.
    meaning:
      ar_eg: شاهد القبر ده مكتوب بخط عربي حلو.
      ar: كُتب شاهد القبر ذاك بخطّ عربيّ جميل.
      en: That gravestone is carved in beautiful Arabic script.
    words: [batu nisan]
  - id: e10
    type: fill_blank
    sentence: Pasai menjadi ___ yang kaya karena perdagangan lada.
    meaning:
      ar_eg: باساي بقت سلطنة غنية بسبب تجارة الفلفل.
      ar: صارت باساي سلطنة غنيّة بفضل تجارة الفلفل.
      en: Pasai became a rich sultanate thanks to the pepper trade.
    options: [kesultanan, musafir, batu nisan]
    answers: [kesultanan]
    words: [kesultanan]
dialogue:
  title: Jejak Ibnu Battutah
  lines:
    - speaker: Kak Dewi
      text: Mohamed, kamu tahu nggak, Ibnu Battutah pernah datang ke Aceh?
      ar_eg: يا محمد، تعرف إن ابن بطوطة جه آتشيه؟
      ar: يا محمد، أتعرف أنّ ابن بطوطة جاء إلى آتشيه؟
      en: Mohamed, did you know Ibn Battuta once came to Aceh?
    - speaker: Mohamed
      text: Musafir dari Maroko itu? Aku pernah baca bukunya dalam bahasa Arab.
      ar_eg: الرحالة المغربي ده؟ أنا قريت كتابه بالعربي.
      ar: ذاك الرحّالة المغربي؟ قرأت كتابه بالعربية.
      en: The traveller from Morocco? I've read his book in Arabic.
    - speaker: Kak Dewi
      text: Dia singgah di Kesultanan Samudera Pasai dalam perjalanan ke Tiongkok.
      ar_eg: عدّى على سلطنة ساموديرا باساي وهو رايح الصين.
      ar: توقّف في سلطنة ساموديرا باساي في طريقه إلى الصين.
      en: He stopped at the Sultanate of Samudera Pasai on the way to China.
    - speaker: Mohamed
      text: Luar biasa. Dari Tangier sampai Sumatra, semuanya naik kapal saudagar.
      ar_eg: حاجة مدهشة. من طنجة لسومطرة، كله بمراكب التجار.
      ar: مدهش! من طنجة إلى سومطرة، وكلّه على سفن التجّار.
      en: Amazing. From Tangier to Sumatra, all on merchants' ships.
