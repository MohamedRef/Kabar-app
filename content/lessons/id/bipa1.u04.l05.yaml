schema: kabar.lesson/v1
id: bipa1.u04.l05
language: id
title: Setengah delapan
can_do:
  ar_eg: تقول الوقت بـ «و» و«إلا» و«نص» و«ربع».
  ar: 'أن تقول الوقت بالدقائق: «و» و«إلا» والنصف والربع.'
  en: Say times with past, to, half and quarter.
slides:
  - title: Lewat, kurang, seperempat
    body:
      ar_eg: |
        - lewat = و (بعد الساعة): jam tujuh lewat sepuluh = ٧ وعشرة
        - kurang = إلا: jam delapan kurang sepuluh = ٨ إلا عشرة
        - seperempat = ربع: jam tujuh lewat seperempat = ٧ وربع
        وفي الكتابة بيحطوا نقطة: 07.15.
      ar: |
        - lewat = و (بعد الساعة): jam tujuh lewat sepuluh = السابعة وعشر دقائق
        - kurang = إلا: jam delapan kurang sepuluh = الثامنة إلا عشر دقائق
        - seperempat = ربع: jam tujuh lewat seperempat = السابعة والربع
        وتُكتب بنقطة: 07.15.
      en: |
        - lewat = past: jam tujuh lewat sepuluh = 7:10
        - kurang = to: jam delapan kurang sepuluh = 7:50
        - seperempat = a quarter: jam tujuh lewat seperempat = 7:15
        Written with a dot: 07.15.
    grammar: id.time.clock
    examples:
      - text: Jam delapan kurang seperempat.
        ar_eg: تمانية إلا ربع.
        ar: الثامنة إلا ربعًا.
        en: A quarter to eight.
  - title: Setengah delapan = ٧:٣٠!
    body:
      ar_eg: |
        أكبر فخ: setengah (نص) بتاخد الساعة الجاية. setengah delapan = «نص على تمانية» = ٧ ونص، مش ٨ ونص!
        فـ ٨:٣٠ = setengah sembilan.
      ar: |
        أكبر فخ: setengah (نصف) تأخذ الساعة التالية. setengah delapan = «نصف نحو الثامنة» = السابعة والنصف، لا الثامنة والنصف!
        فالثامنة والنصف = setengah sembilan.
      en: |
        The big trap: setengah (half) takes the NEXT hour. setengah delapan = "half to eight" = 7:30, not 8:30!
        So 8:30 = setengah sembilan.
    grammar: id.time.clock
    examples:
      - text: Saya datang jam setengah delapan.
        ar_eg: هاجي الساعة سبعة ونص.
        ar: سآتي في السابعة والنصف.
        en: I'll come at half past seven.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jam tujuh pagi
        ar_eg: ٧ الصبح
        ar: السابعة صباحًا
        en: 7 a.m.
      - text: jam tujuh malam
        ar_eg: ٧ بالليل
        ar: السابعة مساءً
        en: 7 p.m.
      - text: setengah delapan
        ar_eg: ٧ ونص
        ar: السابعة والنصف
        en: '7:30'
      - text: jam tujuh lewat seperempat
        ar_eg: ٧ وربع
        ar: السابعة والربع
        en: '7:15'
    words: [jam, setengah, lewat, seperempat]
  - id: e02
    type: multiple_choice
    question: '08.30'
    question_meaning:
      ar_eg: الساعة ٨ ونص. تقولها إزاي؟
      ar: الساعة الثامنة والنصف. كيف تقولها؟
      en: It's 8:30. How do you say it?
    options: [jam setengah delapan, jam setengah sembilan, jam delapan kurang setengah]
    answer: 1
    explain:
      ar_eg: setengah بتاخد الساعة الجاية، يعني ٨ ونص = setengah sembilan.
      ar: setengah تأخذ الساعة التالية، فالثامنة والنصف = setengah sembilan.
      en: setengah takes the next hour, so 8:30 = setengah sembilan.
    words: [setengah, sembilan]
  - id: e03
    type: multiple_choice
    question: '09.50'
    question_meaning:
      ar_eg: الساعة ١٠ إلا عشرة. تقولها إزاي؟
      ar: الساعة العاشرة إلا عشر دقائق. كيف تقولها؟
      en: It's 9:50. How do you say it?
    options: [jam sepuluh kurang sepuluh, jam sepuluh lewat sepuluh, jam sembilan kurang sepuluh]
    answer: 0
    explain:
      ar_eg: kurang = إلا، يعني ١٠ إلا ١٠.
      ar: kurang = إلا، أي العاشرة إلا عشرًا.
      en: kurang = "to", so ten to ten.
    words: [kurang]
  - id: e04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الساعة سبعة ونص دلوقتي.
      ar: الساعة الآن السابعة والنصف.
      en: It's half past seven now.
    answers: [Sekarang jam setengah delapan., Sekarang jam setengah delapan, Sekarang pukul setengah delapan., Jam setengah delapan sekarang., Sekarang setengah delapan.]
    explain:
      ar_eg: ٧ ونص = setengah delapan (نص على تمانية).
      ar: السابعة والنصف = setengah delapan.
      en: 7:30 = setengah delapan ("half to eight").
    words: [sekarang, setengah]
  - id: e05
    type: listen
    text: jam setengah tujuh
    options: ['٧:٣٠', '٦:٣٠', '٧:١٥']
    answer: 1
    question:
      ar_eg: الساعة كام؟
      ar: كم الساعة؟
      en: What time is it?
    meaning:
      ar_eg: الساعة ستة ونص (نص قبل سبعة)
      ar: الساعة السادسة والنصف
      en: half past six (half to seven)
    words: [setengah]
  - id: e06
    type: fill_blank
    sentence: ٥:١٥ = jam lima ___ seperempat
    meaning:
      ar_eg: الساعة خمسة وربع
      ar: الساعة الخامسة والربع
      en: a quarter past five
    options: [kurang, lewat, setengah]
    answers: [lewat]
    words: [lewat, seperempat]
  - id: e07
    type: speaking
    text: Saya datang jam setengah delapan.
    meaning:
      ar_eg: هاجي الساعة سبعة ونص.
      ar: سآتي في السابعة والنصف.
      en: I'll come at half past seven.
    words: [datang, setengah]
  - id: e08
    type: listen
    text: Saya datang jam delapan kurang seperempat.
    options: ['Saya datang jam delapan kurang seperempat.', 'Saya datang jam delapan lewat seperempat.', 'Saya datang jam setengah delapan.']
    answer: 0
    meaning:
      ar_eg: أنا جاي الساعة تمانية إلا ربع.
      ar: سآتي في الثامنة إلا ربعًا.
      en: I'm coming at a quarter to eight.
    words: [datang, kurang, seperempat]
  - id: e09
    type: build_sentence
    source:
      ar_eg: هو جاي الساعة سبعة إلا عشرة.
      ar: هو قادم في السابعة إلا عشر دقائق.
      en: He's coming at ten to seven.
    answer: Dia datang jam tujuh kurang sepuluh.
    distractors: [lewat, setengah]
    words: [datang, kurang]
dialogue:
  lines:
    - speaker: Pak Irwan
      text: Mohamed, kamu datang jam berapa besok?
      ar_eg: محمد، هتيجي بكرة الساعة كام؟
      ar: محمد، متى ستأتي غدًا؟
      en: Mohamed, what time are you coming tomorrow?
    - speaker: Mohamed
      text: Jam setengah delapan, Pak.
      ar_eg: سبعة ونص يا أستاذ.
      ar: في السابعة والنصف يا أستاذ.
      en: At half past seven, sir.
    - speaker: Pak Irwan
      text: Setengah delapan? Bagus. Kursus jam delapan kurang seperempat.
      ar_eg: سبعة ونص؟ حلو. الكورس الساعة تمانية إلا ربع.
      ar: السابعة والنصف؟ جيد. الدورة في الثامنة إلا ربعًا.
      en: Half past seven? Good. The course is at a quarter to eight.
    - speaker: Mohamed
      text: Baik, Pak. Sampai jumpa besok!
      ar_eg: تمام يا أستاذ. أشوفك بكرة!
      ar: حسنًا يا أستاذ. أراك غدًا!
      en: OK, sir. See you tomorrow!
