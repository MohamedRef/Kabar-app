    ar_eg: إلا
    ar: إلا
    en: to (the hour); less
  - word: setengah
    pos: number
    ar_eg: نص
    ar: نصف
    en: half
  - word: seperempat
    pos: number
    ar_eg: ربع
    ar: ربع
    en: a quarter
  - word: datang
    pos: verb
    ar_eg: ييجي
    ar: يأتي
    en: to come
