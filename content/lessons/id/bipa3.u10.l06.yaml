    ar: ذهاب فقط
    en: one-way
  - word: penuh
    pos: adjective
    ar_eg: مليان / كامل العدد
    ar: ممتلئ
    en: full
  - word: keberangkatan
    pos: noun
    ar_eg: القيام / ميعاد الطلوع
    ar: المغادرة
    en: departure
  - word: kembali
    pos: verb
    ar_eg: يرجع
    ar: يعود
    en: to return, come back
