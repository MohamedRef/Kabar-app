schema: kabar.lesson/v1
id: bipa3.u04.l07
language: id
title: Dari kebun ke pabrik
can_do:
  ar_eg: تشرح الزرعة بتطلع إزاي وتروح المصنع، والإنتاج والمكسب بالنسبة المئوية.
  ar: أن تشرح كيف تنمو المحاصيل وتذهب إلى المصنع، والإنتاج والربح بالنسب المئوية.
  en: 'Explain how crops grow and go to the factory: production, profit and percentages.'
slides:
  - title: Pertanian di Sembalun
    body:
      ar_eg: |
        pertanian = زراعة (من tani). tumbuh = يطلع، يكبر (النبات). menghasilkan = ينتج، يطلّع.
        pabrik = مصنع. industri = صناعة. produksi = إنتاج.
        keuntungan = مكسب (من untung). persen = في المية: 20 persen = ٢٠٪.
      ar: |
        pertanian = زراعة (من tani). tumbuh = ينمو. menghasilkan = يُنتج، يُثمر.
        pabrik = مصنع. industri = صناعة. produksi = إنتاج.
        keuntungan = ربح (من untung). persen = بالمئة: 20 persen = ٢٠٪.
      en: |
        pertanian = farming, agriculture (from tani). tumbuh = grow. menghasilkan = produce, yield.
        pabrik = factory. industri = industry. produksi = production.
        keuntungan = profit (from untung). persen = per cent: 20 persen = 20%.
    examples:
      - text: Stroberi tumbuh dengan baik di Sembalun.
        ar_eg: الفراولة بتطلع كويس في سمبالون.
        ar: تنمو الفراولة جيدًا في سمبالون.
        en: Strawberries grow well in Sembalun.
      - text: Kebun ini menghasilkan banyak sayur.
        ar_eg: الجنينة دي بتطلّع خضار كتير.
        ar: يُنتج هذا البستان خضارًا كثيرة.
        en: This farm produces a lot of vegetables.
      - text: Pabrik itu membuat jus dari buah petani.
        ar_eg: المصنع ده بيعمل عصير من فاكهة الفلاحين.
        ar: يصنع ذلك المصنع العصير من فاكهة المزارعين.
        en: That factory makes juice from the farmers' fruit.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pertanian
        ar_eg: زراعة
        ar: زراعة
        en: farming
      - text: tumbuh
        ar_eg: يطلع، يكبر
        ar: ينمو
        en: grow
      - text: menghasilkan
        ar_eg: ينتج
        ar: يُنتج
        en: produce
      - text: pabrik
        ar_eg: مصنع
        ar: مصنع
        en: factory
    words: [pertanian, tumbuh, menghasilkan, pabrik]
  - id: e02
    type: match_pairs
    pairs:
      - text: industri
        ar_eg: صناعة
        ar: صناعة
        en: industry
      - text: produksi
        ar_eg: إنتاج
        ar: إنتاج
        en: production
      - text: keuntungan
        ar_eg: مكسب
        ar: ربح
        en: profit
