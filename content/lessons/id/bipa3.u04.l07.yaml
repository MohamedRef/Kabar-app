  - id: e03
    type: listen
    text: Tahun ini produksi stroberi naik dua puluh persen.
    question:
      ar_eg: الإنتاج زاد قد إيه؟
      ar: بكم ارتفع الإنتاج؟
      en: By how much did production rise?
    options: [٢٠٪, ١٢٪, ٢٪]
    answer: 0
    meaning:
      ar_eg: السنة دي إنتاج الفراولة زاد ٢٠٪.
      ar: ارتفع إنتاج الفراولة هذا العام بنسبة ٢٠٪.
      en: This year strawberry production rose by twenty per cent.
    words: [produksi, persen]
  - id: e04
    type: fill_blank
    sentence: Petani di sini memakai ___ modern untuk menanam sayur.
    meaning:
      ar_eg: الفلاحين هنا بيستخدموا ___ حديثة عشان يزرعوا الخضار.
      ar: يستخدم المزارعون هنا ___ حديثة لزراعة الخضار.
      en: Farmers here use modern ___ to grow vegetables.
    options: [teknologi, penjualan, tumbuh]
    answers: [teknologi]
    words: [teknologi, penjualan, tumbuh]
    explain:
      ar_eg: «حديثة» بتوصف teknologi (تكنولوجيا). penjualan = البيع، وtumbuh = ينمو، وده فعل.
      ar: «حديثة» تصف teknologi «تقنية». أما penjualan فالبيع، وtumbuh «ينمو» وهو فعل.
      en: Modern describes teknologi. penjualan is sales, and tumbuh, to grow, is a verb.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الشغل في الأرض والزرع اسمه إيه؟
      ar: ما اسم العمل في الأرض والزرع؟
      en: What's working the land and growing crops called?
    options: [industri, keuntungan, pertanian]
    answer: 2
    explain:
      ar_eg: pertanian = زراعة (من tani، زي petani).
      ar: pertanian = زراعة (من tani، مثل petani).
      en: pertanian = farming (from tani, as in petani).
    words: [pertanian, industri, keuntungan]
  - id: e06
    type: fill_blank
    sentence: Jagung ini ___ cepat karena banyak hujan.
    meaning:
      ar_eg: الدرة دي ___ بسرعة عشان المطر كتير.
      ar: هذه الذرة ___ بسرعة لكثرة المطر.
      en: This corn ___ fast because there's lots of rain.
    options: [tumbuh, produksi, keuntungan]
    answers: [tumbuh]
    words: [tumbuh, produksi, keuntungan]
    explain:
      ar_eg: الدرة «بتطلع» بسرعة = tumbuh. produksi = إنتاج، وkeuntungan = مكسب، ودول أسماء.
      ar: الذرة «تنمو» بسرعة tumbuh. أما produksi فإنتاج، وkeuntungan ربح، وهما اسمان.
      en: Corn that grows fast is tumbuh. produksi is production and keuntungan profit; both are nouns.
  - id: e07
    type: build_sentence
    source:
      ar_eg: الفلاح عايز مكسب أكتر.
      ar: يريد المزارع ربحًا أكبر.
      en: The farmer wants more profit.
    answer: Petani ingin keuntungan yang lebih besar.
    distractors: [pabrik, industri]
    words: [keuntungan]
    explain:
      ar_eg: «مكسب أكبر» = keuntungan yang lebih besar. pabrik = مصنع، وindustri = صناعة.
      ar: «ربح أكبر» keuntungan yang lebih besar. أما pabrik فمصنع، وindustri صناعة.
      en: More profit is keuntungan yang lebih besar. pabrik is a factory and industri industry.
  - id: e08
    type: translate
    direction: from_target
    source_text: Industri kopi menghasilkan banyak uang.
    answers_meaning:
      ar_eg: [صناعة البن بتجيب فلوس كتير, صناعة القهوة بتطلّع فلوس كتير]
      ar: [تُدرّ صناعة القهوة أموالًا كثيرة, صناعة البن تنتج أموالًا كثيرة]
      en: [The coffee industry makes a lot of money, The coffee industry earns a lot of money]
    words: [industri, menghasilkan]
  - id: e09
    type: speaking
    text: Kebun ini menghasilkan banyak sayur segar.
    meaning:
      ar_eg: الجنينة دي بتطلّع خضار فريش كتير.
      ar: يُنتج هذا البستان خضارًا طازجة كثيرة.
      en: This farm produces lots of fresh vegetables.
    words: [menghasilkan]
  - id: e10
    type: multiple_choice
    question: ___ stroberi naik dua puluh persen tahun ini.
    options: [Penjualan, Teknologi, Pertanian]
    answer: 0
    explain:
      ar_eg: penjualan = مبيعات (من jual).
      ar: penjualan = مبيعات (من jual).
      en: penjualan = sales (from jual).
    words: [penjualan, teknologi, pertanian]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Lihat deh, Mohamed. Hampir semua orang di sini kerja di pertanian.
      ar_eg: بص يا محمد. تقريبًا كل الناس هنا شغالين في الزراعة.
      ar: انظر يا محمد. يعمل معظم الناس هنا في الزراعة.
      en: Look, Mohamed. Almost everyone here works in farming.
    - speaker: Mohamed
      text: Yang tumbuh di sini apa aja?
      ar_eg: إيه اللي بيطلع هنا؟
      ar: ماذا ينمو هنا؟
      en: What grows here?
    - speaker: Mas Rizal
      text: Stroberi, kentang, bawang. Kebun ini menghasilkan banyak banget.
      ar_eg: فراولة، بطاطس، بصل. الجنينة دي بتطلّع كتير أوي.
      ar: فراولة وبطاطس وبصل. هذا البستان يُنتج الكثير.
      en: Strawberries, potatoes, onions. This farm produces loads.
    - speaker: Mohamed
      text: Terus stroberinya ke mana?
      ar_eg: وبعدين الفراولة بتروح فين؟
      ar: ثم إلى أين تذهب الفراولة؟
      en: And where do the strawberries go?
    - speaker: Mas Rizal
      text: Ke pasar, ada juga yang ke pabrik selai. Keuntungannya lumayan, kok.
      ar_eg: للسوق، وشوية لمصنع المربى. والمكسب معقول.
      ar: إلى السوق، وجزء منها إلى مصنع المربى. والربح لا بأس به.
      en: To the market, and some to a jam factory. The profit's decent.
