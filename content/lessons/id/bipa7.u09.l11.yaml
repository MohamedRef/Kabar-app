schema: kabar.lesson/v1
id: bipa7.u09.l11
language: id
title: Laporan keberagaman
can_do:
  ar_eg: تكتب تقرير عن مجتمع متنوّع بدقّة ومن غير أحكام مسبقة.
  ar: أن تكتب تقريرًا عن مجتمع متنوّع بدقّة ودون أحكام مسبقة.
  en: Report on a diverse community accurately and without prejudging it.
slides:
  - title: Satu kampung, banyak asal
    grammar: id.idiom.advanced
    body:
      ar_eg: |
        تقرير متألّف للدرس عن حي في سينتاني:
        «Di kompleks ini, warga Sentani, Bugis, Jawa, dan Toraja hidup berdampingan (عايشين جنب بعض). Mereka saling menghargai (بيحترموا بعض): tetangga Muslim mengantar kue saat Natal. Tenggang rasa (مراعاة شعور الغير) juga terlihat waktu Ramadan. Memang pernah ada diskriminasi (تمييز) dalam penyewaan rumah, tetapi warga tidak angkat tangan. Mereka mengadukannya ke ketua RT.»
        خد بالك: التقرير الكويس بيذكر المشاكل بأمانة، مش بس الحاجات الحلوة، وبيستعمل التعبيرات الاصطلاحية بالراحة.
      ar: |
        تقرير مؤلَّف للدرس عن حيّ في سينتاني:
        «Di kompleks ini, warga Sentani, Bugis, Jawa, dan Toraja hidup berdampingan (يتعايشون). Mereka saling menghargai (يحترم بعضهم بعضًا): tetangga Muslim mengantar kue saat Natal. Tenggang rasa (مراعاة مشاعر الآخرين) juga terlihat waktu Ramadan. Memang pernah ada diskriminasi (تمييز) dalam penyewaan rumah, tetapi warga tidak angkat tangan. Mereka mengadukannya ke ketua RT.»
        تنبيه: التقرير الجيّد يذكر المشكلات بأمانة لا المحاسن وحدها، ويستعمل التعابير الاصطلاحية باعتدال.
      en: |
        A report invented for the lesson about a neighbourhood in Sentani:
        «Di kompleks ini, warga Sentani, Bugis, Jawa, dan Toraja hidup berdampingan (live side by side). Mereka saling menghargai (respect one another): tetangga Muslim mengantar kue saat Natal. Tenggang rasa (consideration for others) juga terlihat waktu Ramadan. Memang pernah ada diskriminasi (discrimination) dalam penyewaan rumah, tetapi warga tidak angkat tangan. Mereka mengadukannya ke ketua RT.»
        Note: a good report names the problems honestly, not just the nice parts, and uses idioms sparingly.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: hidup berdampingan
        ar_eg: يعيشوا جنب بعض
        ar: يتعايشون
        en: live side by side
      - text: saling menghargai
        ar_eg: يحترموا بعض
        ar: يحترم بعضهم بعضًا
        en: respect one another
      - text: tenggang rasa
        ar_eg: مراعاة شعور الغير
        ar: مراعاة مشاعر الآخرين
        en: consideration for others
      - text: diskriminasi
        ar_eg: تمييز
        ar: تمييز
        en: discrimination
    words: [hidup berdampingan, saling menghargai, tenggang rasa, diskriminasi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة بتوصف «tenggang rasa»؟
      ar: أيّ جملة تصف «tenggang rasa»؟
      en: Which sentence describes "tenggang rasa"?
    options:
      - Ia makan di depan teman yang berpuasa tanpa peduli.
      - Ia tidak makan di depan teman yang sedang berpuasa.
      - Ia menolak berbicara dengan tetangganya.
    answer: 1
    words: [tenggang rasa]
  - id: e03
    type: fill_blank
    sentence: Pemilik rumah menolak penyewa karena sukunya. Itu namanya ___.
    meaning:
      ar_eg: صاحب البيت رفض المستأجر علشان أصله. ده اسمه تمييز.
      ar: رفض المالك المستأجر بسبب أصله العرقي، وهذا تمييز.
      en: The landlord turned a tenant away because of his ethnicity. That's called discrimination.
    options: [diskriminasi, tenggang rasa, kerukunan]
    answers: [diskriminasi]
    words: [diskriminasi]
  - id: e04
    type: listen
    text: Empat suku hidup berdampingan di kompleks itu sejak tahun sembilan puluhan.
    question:
      ar_eg: الأعراق الأربعة عايشين جنب بعض من إمتى؟
      ar: منذ متى تتعايش الجماعات الأربع؟
      en: Since when have the four groups lived side by side?
    options:
      - من التسعينيات.
      - من الشهر اللي فات.
      - من 1945.
    answer: 0
    words: [hidup berdampingan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الجيران بيحترموا بعض.
      ar: يحترم الجيران بعضهم بعضًا.
      en: The neighbours respect one another.
    answer: Para tetangga saling menghargai.
    distractors: [diskriminasi, rasa]
    words: [saling menghargai]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: ليه التقرير بيذكر حكاية التمييز في الإيجار؟
      ar: لماذا يذكر التقرير حادثة التمييز في الإيجار؟
      en: Why does the report mention the rental discrimination?
    options:
      - علشان يخوّف القرّاء.
      - علشان يقول إن الحي وحش.
      - علشان التقرير الأمين بيذكر المشاكل كمان.
    answer: 2
    words: [diskriminasi]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الناس من أديان مختلفة عايشين جنب بعض في سلام.
      ar: يتعايش أتباع الأديان المختلفة بسلام.
      en: People of different faiths live side by side in peace.
    answers:
      - Orang dari agama yang berbeda hidup berdampingan dengan damai.
      - Orang yang berbeda agama hidup berdampingan dengan damai.
      - Umat yang berbeda agama hidup berdampingan secara damai.
      - Orang-orang dari agama berbeda hidup berdampingan dengan damai.
    words: [hidup berdampingan]
  - id: e08
    type: speaking
    text: Tenggang rasa dan saling menghargai adalah kunci kerukunan.
    meaning:
      ar_eg: مراعاة شعور الغير والاحترام المتبادل هم مفتاح الوئام.
      ar: مراعاة الآخرين والاحترام المتبادل مفتاح الوئام.
      en: Consideration and mutual respect are the key to harmony.
    words: [tenggang rasa, saling menghargai]
  - id: e09
    type: dictation
    text: Warga melaporkan diskriminasi itu kepada ketua RT.
    meaning:
      ar_eg: الأهالي بلّغوا عن التمييز ده لرئيس الحي.
      ar: أبلغ الأهالي رئيس الحيّ بذلك التمييز.
      en: Residents reported the discrimination to the neighbourhood head.
    words: [diskriminasi]
  - id: e10
    type: translate
    direction: from_target
    source_text: Di kampung ini, warga saling menghargai walaupun bahasa ibu mereka berbeda.
    answers_meaning:
      ar_eg:
        - في القرية دي، الناس بيحترموا بعض رغم إن لغاتهم الأم مختلفة.
        - الأهالي هنا بيحترموا بعض مع إن كل واحد لغته الأصلية غير التاني.
      ar:
        - في هذه القرية يحترم الأهالي بعضهم بعضًا مع اختلاف لغاتهم الأمّ.
        - يتبادل أهل القرية الاحترام وإن اختلفت لغاتهم الأصلية.
      en:
        - In this village, people respect one another though their mother tongues differ.
        - Residents here respect each other even with different first languages.
    words: [saling menghargai]
dialogue:
  title: Wawancara di kompleks
  lines:
    - speaker: Mohamed
      text: Bapak sudah tiga puluh tahun tinggal di sini. Bagaimana rasanya hidup berdampingan?
      ar_eg: حضرتك بقالك تلاتين سنة هنا. إزاي العيشة جنب بعض؟
      ar: تسكن هنا منذ ثلاثين عامًا. كيف هي الحياة جنبًا إلى جنب؟
      en: You've lived here thirty years. What's it like living side by side?
    - speaker: Pak Daeng
      text: Kami saling menghargai. Saya orang Bugis, tetapi anak saya fasih bahasa Sentani.
      ar_eg: بنحترم بعض. أنا من البوجيس، بس ابني بيتكلّم لغة سينتاني بطلاقة.
      ar: نحترم بعضنا. أنا من البوغيس، لكنّ ابني يتقن لغة سينتاني.
      en: We respect one another. I'm Bugis, but my son speaks Sentani fluently.
    - speaker: Mohamed
      text: Pernah ada masalah?
      ar_eg: حصلت مشاكل قبل كده؟
      ar: هل حدثت مشكلات؟
      en: Have there ever been problems?
    - speaker: Pak Daeng
      text: Pernah, soal diskriminasi sewa rumah. Tetapi dengan tenggang rasa, kami selesaikan bersama.
      ar_eg: حصل، في موضوع تمييز في إيجار البيوت. بس بمراعاة بعض، حلّيناها سوا.
      ar: نعم، في مسألة تمييز في الإيجار، لكنّنا حللناها معًا بمراعاة بعضنا.
      en: Yes, rental discrimination. But with consideration for each other, we sorted it out together.
