    words: [institusi, perekonomian, kesejahteraan, persoalan]
  - id: e03
    type: listen
    text: Perekonomian desa ini bergantung pada kebun karet. Kalau harga karet turun, banyak keluarga tidak bisa membayar sekolah anaknya.
    question:
      ar_eg: ليه سعر المطاط مهم للقرية؟
      ar: لماذا يهمّ سعر المطاط القرية؟
      en: Why does the rubber price matter to the village?
    options:
      - Karena desa itu hidup dari pariwisata.
      - Karena penghasilan keluarga di sana datang dari karet.
      - Karena sekolahnya dibangun dari karet.
    answer: 1
    meaning:
      ar_eg: اقتصاد القرية دي معتمد على جناين المطاط. لو سعر المطاط نزل، عيلات كتير مش هتقدر تدفع مصاريف مدارس ولادها.
      ar: يعتمد اقتصاد هذه القرية على مزارع المطاط، فإن انخفض سعره عجزت أسر كثيرة عن دفع رسوم مدارس أبنائها.
      en: This village's economy depends on rubber gardens. If the rubber price falls, many families can't pay their children's school fees.
    explain:
      ar_eg: bergantung pada = معتمد على، يعني دخل العيلات من المطاط، ولما السعر ينزل الفلوس تقل.
      ar: bergantung pada = يعتمد على، أي أن دخل الأسر من المطاط، فإن نزل السعر قلّ المال.
      en: "bergantung pada = depends on: families' income comes from rubber, so a lower price means less money."
    words: [perekonomian]
  - id: e04
    type: fill_blank
    sentence: Anak-anak berjalan jauh karena tidak ada ___ ke sekolah.
    meaning:
      ar_eg: العيال بيمشوا مسافة طويلة عشان مافيش ___ للمدرسة.
      ar: يمشي الأطفال مسافة طويلة لعدم وجود ___ إلى المدرسة.
      en: Children walk far because there's no ___ to school.
    options: [angkutan, institusi, regional]
    answers: [angkutan]
    words: [angkutan, institusi, regional]
    explain:
      ar_eg: مافيش «مواصلات» = angkutan، عشان كده بيمشوا. institusi = مؤسسة وregional = إقليمي، مايوصلوش للمدرسة.
      ar: لا توجد angkutan (وسيلة نقل) فيمشون. أما institusi فالمؤسسة، وregional «إقليمي».
      en: There's no angkutan (transport), so they walk. institusi (institution) and regional don't get you to school.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيحكم الـ kabupaten؟
      ar: من يرأس الـ kabupaten؟
      en: Who heads a kabupaten?
    options: [persoalan, bupati, pedesaan]
    answer: 1
    explain:
      ar_eg: bupati = رئيس الكابوباتن.
      ar: bupati = رئيس المقاطعة.
      en: bupati = regent.
    words: [persoalan, bupati, pedesaan]
  - id: e06
    type: fill_blank
    sentence: Universitas dan rumah sakit adalah ___ penting di kota itu.
    meaning:
      ar_eg: الجامعة والمستشفى ___ مهمة في المدينة دي.
      ar: الجامعة والمستشفى ___ مهمة في تلك المدينة.
      en: The university and the hospital are important ___ in that town.
    options: [institusi, kesejahteraan, angkutan]
    answers: [institusi]
    words: [institusi, kesejahteraan, angkutan]
    explain:
      ar_eg: الجامعة والمستشفى institusi (مؤسسات). kesejahteraan = رفاهية وangkutan = مواصلات، ومش وصف ليهم.
      ar: الجامعة والمستشفى institusi (مؤسّسات). أما kesejahteraan فالرفاه، وangkutan النقل.
      en: A university and a hospital are institusi. kesejahteraan (welfare) and angkutan (transport) don't describe them.
  - id: e07
    type: multiple_choice
    question: Bandara baru itu diharapkan memperkuat ekonomi ___ Kalimantan Timur.
    options: [persoalan, pedesaan, regional]
    answer: 2
    explain:
      ar_eg: regional = إقليمي.
      ar: regional = إقليمي.
      en: regional = regional.
    words: [persoalan, pedesaan, regional]
  - id: e08
    type: build_sentence
    source:
      ar_eg: رفاهية الناس في الريف لسه قليلة.
      ar: ما زال رفاه سكان الريف منخفضًا.
      en: Welfare in the countryside is still low.
    answer: Kesejahteraan warga pedesaan masih rendah.
    distractors: [institusi, bupati]
    words: [kesejahteraan, pedesaan]
    explain:
      ar_eg: «رفاهية» = Kesejahteraan. institusi = مؤسسة وbupati = رئيس المقاطعة، مش «الرفاهية».
      ar: «الرفاه» = Kesejahteraan. أما institusi فالمؤسّسة، وbupati رئيس المقاطعة.
      en: "\"Welfare\" is kesejahteraan. institusi (institution) and bupati (regent) aren't it."
  - id: e09
    type: translate
    direction: from_target
    source_text: Persoalan ini harus segera diselesaikan, karena kesejahteraan warga desa sedang terancam.
    answers_meaning:
      ar_eg:
        - المشكلة دي لازم تتحل بسرعة، عشان رفاهية أهل القرية في خطر.
        - القضية دي لازم تتحل حالًا، لإن معيشة أهل القرية مهددة.
      ar:
        - يجب حلّ هذه المسألة سريعًا، لأنّ رفاهية أهل القرية مهدّدة.
        - ينبغي حلّ هذه القضية فورًا، إذ إنّ رفاه سكّان القرية في خطر.
      en:
        - This issue must be solved quickly, because the villagers' welfare is under threat.
        - This problem has to be resolved soon, since the villagers' well-being is at risk.
    explain:
      ar_eg: karena = عشان (سبب)، وsedang terancam = في خطر دلوقتي.
      ar: karena = لأنّ (سبب)، وsedang terancam = مهدّد الآن.
      en: karena = because; sedang terancam = currently under threat.
    words: [persoalan]
  - id: e10
    type: speaking
    text: Bupati ingin memperkuat perekonomian dan angkutan desa.
    meaning:
      ar_eg: البوباتي عايز يقوّي اقتصاد القرى ومواصلاتها.
      ar: يريد رئيس المقاطعة تقوية اقتصاد القرى ونقلها.
      en: The regent wants to strengthen the villages' economy and transport.
    words: [bupati, perekonomian, angkutan]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Hari ini Bupati Penajam turun ke desa-desa. Kita ikut, ya.
      ar_eg: النهارده بوباتي بيناجام نازل للقرى. تعالى نروح.
      ar: اليوم ينزل رئيس مقاطعة بيناجام إلى القرى. لنرافقه.
      en: Today the regent of Penajam is visiting the villages. Let's go along.
    - speaker: Mohamed
      text: Apa persoalan utama di daerah pedesaan sini?
      ar_eg: إيه المشكلة الأساسية في الريف هنا؟
      ar: ما القضية الرئيسية في ريف هذه المنطقة؟
      en: What's the main issue in the countryside here?
    - speaker: Kepala desa
      text: Angkutan, Pak. Ke rumah sakit kami harus naik perahu dua jam.
      ar_eg: المواصلات يا أستاذ. عشان نروح المستشفى لازم نركب مركب ساعتين.
      ar: النقل يا سيّدي. نركب قاربًا ساعتين لنصل إلى المستشفى.
      en: Transport, sir. We take a boat for two hours to reach the hospital.
    - speaker: Mohamed
      text: Apakah perekonomian desa ikut tumbuh karena ibu kota baru?
      ar_eg: اقتصاد القرية بيكبر بسبب العاصمة الجديدة؟
      ar: هل ينمو اقتصاد القرية بسبب العاصمة الجديدة؟
      en: Is the village economy growing because of the new capital?
    - speaker: Kepala desa
      text: Sedikit. Tapi kesejahteraan kami bergantung pada institusi yang dekat dengan warga.
      ar_eg: شوية. بس رفاهيتنا معتمدة على مؤسسات قريبة من الناس.
      ar: قليلًا. لكن رفاهنا يعتمد على مؤسسات قريبة من السكان.
      en: A little. But our welfare depends on institutions close to the people.
