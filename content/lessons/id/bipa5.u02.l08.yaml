schema: kabar.lesson/v1
id: bipa5.u02.l08
language: id
title: Suara warga
can_do:
  ar_eg: تسأل الناس عن رأيهم في العاصمة الجديدة وتلخّص الرأيين بجمل مترابطة.
  ar: أن تسأل الناس عن رأيهم في العاصمة الجديدة وتلخّص الرأيين بجمل مترابطة.
  en: Ask people what they think of the new capital and sum up both sides in connected sentences.
slides:
  - title: Merangkum dua suara
    grammar: id.conjunction.concessive
    body:
      ar_eg: |
        لما تلخّص آراء الناس، اربط الكلام:
        - Menurut Pak Yusuf, … = حسب كلام الأستاذ يوسف …
        - Meskipun / Walaupun …, … tetap … = مع إن …، برضه …
        - Di satu sisi … Di sisi lain … = من ناحية … ومن ناحية تانية …
        كلمتين جداد: penduduk asli = أهل البلد الأصليين، وkemacetan = زحمة المرور.
      ar: |
        حين تلخّص آراء الناس، اربط الكلام:
        - Menurut Pak Yusuf, … = بحسب الأستاذ يوسف …
        - Meskipun / Walaupun …, … tetap … = مع أنّ …، يظلّ …
        - Di satu sisi … Di sisi lain … = من جهة … ومن جهة أخرى …
        وكلمتان جديدتان: penduduk asli = السكّان الأصليون، وkemacetan = الازدحام المروري.
      en: |
        When you sum up people's views, connect them:
        - Menurut Pak Yusuf, … = according to Pak Yusuf, …
        - Meskipun / Walaupun …, … tetap … = although …, … still …
        - Di satu sisi … Di sisi lain … = on one hand … on the other …
        Two new words: penduduk asli = indigenous people, kemacetan = traffic jams.
exercises:
  - id: e01
    type: listen
    text: Menurut Pak Yusuf, penduduk asli Paser sudah tinggal di sini sejak ratusan tahun lalu.
    question:
      ar_eg: الأستاذ يوسف بيتكلم عن مين؟
      ar: عمّن يتحدّث الأستاذ يوسف؟
      en: Who is Pak Yusuf talking about?
    options:
      - أهل البلد الأصليين من قبيلة باسر.
      - الناس الجاية من جاوة.
      - موظفين الحكومة الجداد.
    answer: 0
    words: [penduduk asli]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «kemacetan» معناها إيه؟
      ar: ما معنى «kemacetan»؟
      en: What does "kemacetan" mean?
    options:
      - هدوء.
      - زحمة مرور.
      - بنزين.
    answer: 1
    explain:
      ar_eg: من macet (واقف / زحمة) + ke-…-an = حالة الزحمة.
      ar: من macet (متوقّف، مزدحم) مع ke-…-an، أي حالة الازدحام.
      en: From macet (stuck) with ke-…-an, the state of being jammed.
    words: [kemacetan]
  - id: e03
    type: fill_blank
    sentence: Jakarta terkenal dengan ___ yang parah setiap pagi.
    meaning:
      ar_eg: جاكرتا مشهورة بالزحمة الفظيعة كل صبح.
      ar: تشتهر جاكرتا بازدحام مروري شديد كلّ صباح.
      en: Jakarta is known for terrible traffic every morning.
    options: [kemacetan, pemerataan, ganti rugi]
    answers: [kemacetan]
    words: [kemacetan]
  - id: e04
    type: build_sentence
    source:
      ar_eg: مع إن المشروع بيجيب شغل، أهل المنطقة برضه قلقانين.
      ar: مع أنّ المشروع يوفّر فرص عمل، يظلّ أهل المنطقة قلقين.
      en: Although the project brings jobs, local people are still worried.
    answer: Meskipun proyek ini membawa lapangan kerja, warga setempat tetap khawatir.
    distractors: [pendatang, digusur]
    words: [warga setempat]
  - id: e05
    type: translate
    direction: from_target
    source_text: Penduduk asli meminta agar tanah adat mereka dihormati.
    answers_meaning:
      ar_eg:
        - أهل البلد الأصليين طالبين إن أرض أجدادهم تتحترم.
        - السكان الأصليين بيطلبوا احترام أراضيهم العرفية.
      ar:
        - يطالب السكّان الأصليون باحترام أراضيهم العرفية.
        - يطلب أهل البلاد الأصليون أن تُحترم أراضي أجدادهم.
      en:
        - The indigenous people ask that their customary land be respected.
        - Indigenous residents are asking for their ancestral land to be respected.
    words: [penduduk asli]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: «Kemacetan di Jakarta parah. ___, banjir sering terjadi.» تحط إيه؟
      ar: ماذا تضع في «Kemacetan di Jakarta parah. ___, banjir sering terjadi.»؟
      en: Which fits "Kemacetan di Jakarta parah. ___, banjir sering terjadi."?
    options: [Meskipun, Dengan demikian, Selain itu]
    answer: 2
    explain:
      ar_eg: بتضيف مشكلة تانية على الأولى، يبقى Selain itu (وكمان).
      ar: تضيف مشكلة ثانية إلى الأولى، فالمناسب Selain itu (فضلًا عن ذلك).
      en: You're adding a second problem, so Selain itu (besides that).
    words: [kemacetan, selain itu]
  - id: e07
    type: speaking
    text: Di satu sisi ada manfaatnya. Di sisi lain, penduduk asli bisa digusur.
    meaning:
      ar_eg: من ناحية ليه فايدة. ومن ناحية تانية، أهل البلد الأصليين ممكن يتطردوا.
      ar: من جهة له فوائده، ومن جهة أخرى قد يُخلى السكّان الأصليون من أراضيهم.
      en: On one hand there are benefits. On the other, indigenous people could be evicted.
    words: [penduduk asli, di sisi lain, menggusur]
  - id: e08
    type: dictation
    text: Pemindahan ibu kota diharapkan mengurangi kemacetan di Jakarta.
    meaning:
      ar_eg: نقل العاصمة المفروض يقلل الزحمة في جاكرتا.
      ar: يُرجى أن يخفّف نقلُ العاصمة الازدحامَ في جاكرتا.
      en: Moving the capital is meant to ease Jakarta's traffic.
    words: [kemacetan, pemindahan]
  - id: e09
    type: match_pairs
    pairs:
      - text: pendatang
        ar_eg: ناس جاية من برا
        ar: وافد
        en: newcomer
      - text: pemerataan
        ar_eg: توزيع بالعدل
        ar: توزيع عادل
        en: fair distribution
      - text: ganti rugi
        ar_eg: تعويض
        ar: تعويض
        en: compensation
      - text: tata ruang
        ar_eg: تخطيط المساحات
        ar: تخطيط المساحات
        en: spatial planning
      - text: khawatir
        ar_eg: قلقان
        ar: قلق
        en: worried
    words: [pendatang, pemerataan, ganti rugi, tata ruang, khawatir]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مع إن الطرق جديدة، لسه فيه زحمة الصبح.
      ar: مع أنّ الطرق جديدة، ما زال هناك ازدحام في الصباح.
      en: Even though the roads are new, there are still jams in the morning.
    answers:
      - Walaupun jalannya baru, masih ada kemacetan pada pagi hari.
      - Meskipun jalannya baru, masih ada kemacetan pada pagi hari.
      - Walaupun jalannya baru, masih ada kemacetan di pagi hari.
      - Meskipun jalannya baru, pagi hari masih ada kemacetan.
      - Walaupun jalan-jalannya baru, masih ada kemacetan pada pagi hari.
    words: [kemacetan]
dialogue:
  title: Dua suara dari Penajam
  lines:
    - speaker: Mohamed
      text: Pak Yusuf, sebagai penduduk asli Paser, bagaimana pendapat Bapak tentang IKN?
      ar_eg: يا أستاذ يوسف، بصفتك من أهل باسر الأصليين، إيه رأيك في العاصمة الجديدة؟
      ar: يا أستاذ يوسف، بصفتك من سكّان باسر الأصليين، ما رأيك في العاصمة الجديدة؟
      en: Pak Yusuf, as a native Paser man, what's your view of IKN?
    - speaker: Pak Yusuf
      text: Jalannya bagus sekarang. Meskipun begitu, kami takut kehilangan tanah adat.
      ar_eg: الطرق بقت حلوة دلوقتي. ومع كده، إحنا خايفين نخسر أرض أجدادنا.
      ar: الطرق صارت جيّدة، ومع ذلك نخشى أن نفقد أراضينا العرفية.
      en: The roads are good now. Even so, we're afraid of losing our customary land.
    - speaker: Rina
      text: Saya pendatang dari Jakarta. Di sini tidak ada kemacetan, jadi saya senang.
      ar_eg: أنا جاية من جاكرتا. هنا مفيش زحمة، فأنا مبسوطة.
      ar: أنا وافدة من جاكرتا، وهنا لا ازدحام، لذا أنا سعيدة.
      en: I'm a newcomer from Jakarta. There are no jams here, so I'm happy.
    - speaker: Mohamed
      text: Jadi, di satu sisi pendatang senang. Di sisi lain, penduduk asli khawatir.
      ar_eg: يعني، من ناحية الناس الجاية مبسوطة، ومن ناحية تانية أهل البلد قلقانين.
      ar: إذن، من جهة الوافدون سعداء، ومن جهة أخرى السكّان الأصليون قلقون.
      en: So, on one hand the newcomers are happy. On the other, the indigenous people are worried.
    - speaker: Pak Yusuf
      text: Betul. Kami tidak menolak pembangunan, tetapi kami ingin didengar.
      ar_eg: مظبوط. إحنا مش رافضين التنمية، بس عايزين حد يسمعنا.
      ar: صحيح. لسنا ضدّ التنمية، لكنّنا نريد أن يُسمع صوتنا.
      en: Right. We're not against development, but we want to be heard.
new_words:
