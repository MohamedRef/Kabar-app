schema: kabar.lesson/v1
id: bipa1.u07.l02
language: id
title: Harus, perlu, boleh
can_do:
  ar_eg: تقول تقدر وتلزمك ومحتاج ومسموح لك تعمل إيه.
  ar: أن تقول ما تستطيع وما يجب وما تحتاج وما يُسمح لك فعله.
  en: Say what you can, must, need and may do.
slides:
  - title: bisa
    body:
      ar_eg: |
        bisa = أقدر / بعرف (قدرة):
        Saya bisa berenang = بعرف أعوم.
        Bisa bahasa Indonesia? = بتعرف إندونيسي؟
        ولو لسه مابتعرفش بس بتتعلم، قول «Belum bisa» = لسه مابعرفش. أحلى من «Tidak bisa»!
      ar: |
        bisa = يستطيع / يُحسن (القدرة):
        Saya bisa berenang = أستطيع السباحة.
        Bisa bahasa Indonesia? = هل تتكلم الإندونيسية؟
        ومن لا يُحسن الشيء بعدُ يقول «Belum bisa» = لا أستطيع بعد، وهي ألطف من «Tidak bisa».
      en: |
        bisa = can, know how to (ability):
        Saya bisa berenang = I can swim.
        Bisa bahasa Indonesia? = Do you speak Indonesian?
        Still learning? Say "Belum bisa" = I can't yet. Much nicer than "Tidak bisa"!
    grammar: id.verb.modal
    examples:
      - text: Maaf, saya tidak bisa datang besok.
        ar_eg: معلش، مش هقدر آجي بكرة.
        ar: عذرًا، لا أستطيع المجيء غدًا.
        en: Sorry, I can't come tomorrow.
  - title: boleh, harus, perlu
    body:
      ar_eg: |
        - boleh = مسموح (إذن). فاكرها من «Boleh saya foto?»
        خلي بالك: bisa = قدرة، boleh = إذن. «ممكن أدخل؟» = Boleh saya masuk?
        - harus = لازم: Saya harus bekerja = لازم أشتغل.
        - perlu = محتاج: Kamu tidak perlu datang = مش محتاج تيجي.
        النفي بـ tidak قبلها: tidak bisa (مقدرش)، tidak boleh (ممنوع)، وفي الكلام العادي tidak usah = مالوش لزوم.
      ar: |
        - boleh = يجوز / مسموح (الإذن)، كما في «Boleh saya foto?»
        وانتبه: bisa للقدرة وboleh للإذن: «هل يمكنني الدخول؟» = Boleh saya masuk?
        - harus = يجب: Saya harus bekerja = يجب أن أعمل.
        - perlu = يحتاج: Kamu tidak perlu datang = لا تحتاج إلى المجيء.
        والنفي بـ tidak قبلها: tidak bisa، tidak boleh (ممنوع)، وفي العامية tidak usah = لا داعي.
      en: |
        - boleh = may (permission) — remember "Boleh saya foto?"
        Careful: bisa = ability, boleh = permission. "May I come in?" = Boleh saya masuk?
        - harus = must: Saya harus bekerja = I must work.
        - perlu = need: Kamu tidak perlu datang = You don't need to come.
        Negate with tidak: tidak bisa (can't), tidak boleh (not allowed); casual tidak usah = no need.
    grammar: id.verb.modal
    examples:
      - text: Di masjid tidak boleh pakai sepatu.
        ar_eg: ممنوع تلبس جزمة في الجامع.
        ar: لا يجوز لبس الأحذية في المسجد.
        en: You may not wear shoes in the mosque.
      - text: Kamu harus coba rendang!
        ar_eg: لازم تجرب الرندانج!
        ar: يجب أن تجرّب الرندانغ!
        en: You must try rendang!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: harus
        ar_eg: لازم
        ar: يجب
        en: must
      - text: perlu
        ar_eg: محتاج
        ar: يحتاج
        en: need
      - text: tidak usah
        ar_eg: مش لازم
        ar: لا داعي
        en: no need to
      - text: masuk
        ar_eg: يدخل
        ar: يدخل
        en: enter
      - text: pulang
        ar_eg: يروّح
        ar: يعود إلى البيت
        en: go home
      - text: sepatu
        ar_eg: جزمة
        ar: حذاء
        en: shoes
    words: [harus, perlu, tidak usah, masuk, pulang, sepatu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: واقف على باب مكتب أستاذ إروان. عايز تستأذن تدخل.
      ar: تقف على باب مكتب الأستاذ إروان وتريد أن تستأذن في الدخول.
      en: You're at Pak Irwan's office door and want permission to come in.
    options: ['Bisa saya masuk?', 'Harus saya masuk?', 'Boleh saya masuk?']
    answer: 2
    explain:
      ar_eg: الإذن = boleh. bisa للقدرة.
      ar: الإذن بـ boleh، وbisa للقدرة.
      en: Permission = boleh; bisa is ability.
    words: [boleh, masuk]
  - id: e03
    type: listen
    text: Tidak usah pulang sekarang.
    options: ['Tidak usah pulang sekarang.', 'Kamu harus pulang sekarang.', 'Kamu perlu pulang sekarang.']
    answer: 0
    meaning:
      ar_eg: مش لازم تروّح دلوقتي.
      ar: لا داعي للعودة إلى البيت الآن.
      en: No need to go home now.
    words: [tidak usah, pulang, harus, perlu]
  - id: e04
    type: fill_blank
    sentence: Sudah malam. Saya harus ___.
    meaning:
      ar_eg: الوقت اتأخر. لازم أروّح.
      ar: حلّ الليل. يجب أن أعود إلى البيت.
      en: It's late. I have to go home.
    options: [pulang, masuk, coba]
    answers: [pulang]
    words: [harus, pulang]
    explain:
      ar_eg: الوقت اتأخر، فلازم pulang = أروّح. masuk = يدخل، وcoba = يجرّب.
      ar: تأخّر الوقت فيجب pulang أي العودة للبيت.
      en: It's late, so pulang (go home).
  - id: e05
    type: fill_blank
    sentence: Di masjid tidak ___ pakai sepatu.
    meaning:
      ar_eg: ممنوع تلبس جزمة في الجامع.
      ar: لا يجوز لبس الأحذية في المسجد.
      en: You may not wear shoes in the mosque.
    options: [perlu, boleh, bisa]
    answers: [boleh]
    words: [boleh, sepatu]
    explain:
      ar_eg: tidak boleh = ممنوع. perlu = محتاج، وbisa = يقدر.
      ar: tidak boleh = ممنوع.
      en: tidak boleh = not allowed.
  - id: e06
    type: fill_blank
    sentence: Kamu ___ coba rendang!
    meaning:
      ar_eg: لازم تجرب الرندانج!
      ar: يجب أن تجرّب الرندانغ!
      en: You must try rendang!
    options: [boleh, ingin, harus]
    answers: [harus]
    words: [harus, coba]
    explain:
      ar_eg: "harus = لازم: Kamu harus coba! boleh = مسموح، وingin = عايز."
      ar: harus = يجب. boleh مسموح وingin يرغب.
      en: harus = must.
  - id: e07
    type: listen
    text: Silakan masuk. Tidak usah buka sepatu.
    options: ['Silakan masuk. Tidak usah buka sepatu.', 'Silakan masuk. Kamu harus buka sepatu.', 'Silakan pulang. Tidak usah buka sepatu.']
    answer: 0
    meaning:
      ar_eg: اتفضل ادخل. مش لازم تقلع الجزمة.
      ar: تفضل بالدخول. لا داعي لخلع الحذاء.
      en: Please come in. No need to take your shoes off.
    words: [masuk, tidak usah, sepatu, harus, pulang]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kamu tidak perlu datang.
    answers_meaning:
      ar_eg: [مش محتاج تيجي., مش لازم تيجي, إنت مش محتاج تيجي]
      ar: [لا تحتاج إلى المجيء., لا داعي لأن تأتي, ليس عليك أن تأتي]
      en: [You don't need to come., You don't have to come, No need for you to come]
    words: [perlu]
  - id: e09
    type: speaking
    text: Boleh saya coba sepatu ini?
    meaning:
      ar_eg: ممكن أجرّب الجزمة دي؟
      ar: هل يمكنني تجربة هذا الحذاء؟
      en: May I try these shoes on?
    words: [coba, sepatu]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «مش لازم تيجي»؟
      ar: كيف تقول «لا داعي لأن تأتي»؟
      en: How do you say "No need to come"?
    options: ['Tidak usah datang.', 'Tidak boleh datang.', 'Coba datang.']
    answer: 0
    explain:
      ar_eg: tidak usah = مش لازم (بلطف). tidak boleh = ممنوع.
      ar: tidak usah = لا داعي (بلطف)، وtidak boleh = ممنوع.
      en: tidak usah = no need (gently); tidak boleh = not allowed.
    words: [tidak usah, coba]
dialogue:
  lines:
    - speaker: Pak Irwan
      text: Mohamed, besok kamu harus datang jam tujuh.
      ar_eg: محمد، بكرة لازم تيجي الساعة سبعة.
      ar: محمد، غدًا يجب أن تأتي في السابعة.
      en: Mohamed, tomorrow you have to come at seven.
    - speaker: Mohamed
      text: Maaf, Pak, saya tidak bisa. Saya perlu ke kantor imigrasi.
      ar_eg: آسف يا أستاذ، مش هقدر. محتاج أروح مكتب الهجرة.
      ar: آسف يا أستاذ، لا أستطيع. أحتاج إلى الذهاب إلى مكتب الهجرة.
      en: Sorry, sir, I can't. I need to go to the immigration office.
    - speaker: Pak Irwan
      text: Tidak apa-apa. Kamu boleh datang jam sembilan.
      ar_eg: مفيش مشكلة. ممكن تيجي الساعة تسعة.
      ar: لا بأس. يمكنك أن تأتي في التاسعة.
      en: No problem. You may come at nine.
    - speaker: Mohamed
      text: Terima kasih, Pak. Boleh saya pulang sekarang?
      ar_eg: شكرًا يا أستاذ. ممكن أروّح دلوقتي؟
      ar: شكرًا يا أستاذ. هل يمكنني العودة إلى البيت الآن؟
      en: Thank you, sir. May I go home now?
    - speaker: Pak Irwan
      text: Boleh. Silakan!
      ar_eg: ماشي. اتفضل!
      ar: نعم. تفضل!
      en: Yes. Go ahead!
