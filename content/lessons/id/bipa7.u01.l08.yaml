schema: kabar.lesson/v1
id: bipa7.u01.l08
language: id
title: Tekun dan ulet
can_do:
  ar_eg: 'توصف شخصية شاب ناجح: مثابر، صلب، وقدوة للناس.'
  ar: 'أن تصف شخصية شابّ ناجح: مثابر، صلب، وقدوة للآخرين.'
  en: 'Describe a successful young person''s character: diligent, resilient, a role model.'
slides:
  - title: Watak juara
    body:
      ar_eg: |
        صفات بتتقال في البروفايلات:
        tekun = بيذاكر ويشتغل كل يوم من غير ملل. ulet = لو وقع يقوم تاني، نفَسه طويل.
        berprestasi = عنده إنجازات (siswa berprestasi). dedikasi = التفاني (dedikasinya tinggi).
        panutan = قدوة. ketangguhan = الصلابة. pantang menyerah = عمره ما يستسلم.
        unjuk gigi = «يورّي سنانه»، يعني يثبت إنه قدّها قدّام الناس.
        - في الكلام: udah = sudah، gitu = begitu، kayak = seperti، tapi = tetapi.
      ar: |
        صفات تتكرّر في مقالات السِّيَر:
        tekun = يعمل كلّ يوم دون ملل. ulet = إذا سقط قام، طويل النَّفَس.
        berprestasi = صاحب إنجازات (siswa berprestasi). dedikasi = التفاني (dedikasinya tinggi).
        panutan = قدوة. ketangguhan = الصلابة. pantang menyerah = لا يستسلم أبدًا.
        unjuk gigi = حرفيًّا «يُري أسنانه»، أي يُثبت جدارته أمام الناس.
        - في الكلام اليومي: udah = sudah، gitu = begitu، kayak = seperti، tapi = tetapi.
      en: |
        Words that keep showing up in profiles:
        tekun = works at it every day without tiring. ulet = gets back up after falling, in it for the long haul.
        berprestasi = high-achieving (siswa berprestasi). dedikasi = dedication (dedikasinya tinggi).
        panutan = role model. ketangguhan = toughness. pantang menyerah = never gives up.
        unjuk gigi = literally "show one's teeth": prove yourself in public.
        - In speech: udah = sudah, gitu = begitu, kayak = seperti, tapi = tetapi.
    examples:
      - text: Dia tekun belajar setiap malam.
        ar_eg: هو بيذاكر بإجتهاد كل ليلة.
        ar: يدرس بمثابرة كلّ ليلة.
        en: He studies diligently every night.
      - text: Atlet muda itu ulet dan pantang menyerah.
        ar_eg: الرياضي الصغير ده نفَسه طويل وما بيستسلمش.
        ar: ذلك الرياضي الشابّ صبور لا يستسلم أبدًا.
        en: That young athlete is tenacious and never gives up.
      - text: Guru itu menjadi panutan bagi murid-muridnya.
        ar_eg: المدرّس ده بقى قدوة لتلامذته.
        ar: صار ذلك المعلّم قدوة لتلاميذه.
        en: That teacher became a role model for his pupils.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tekun
        ar_eg: مجتهد ومثابر
        ar: مثابر، دؤوب
        en: diligent, persevering
      - text: ulet
        ar_eg: نَفَسه طويل / ما بيستسلمش
        ar: صبور عنيد لا يستسلم
        en: tenacious, resilient
      - text: berprestasi
        ar_eg: متفوّق / عنده إنجازات
        ar: متفوّق، صاحب إنجازات
        en: high-achieving
      - text: dedikasi
        ar_eg: تفاني / إخلاص في الشغل
        ar: تفانٍ، إخلاص
        en: dedication
    words: [tekun, ulet, berprestasi, dedikasi]
  - id: e02
    type: match_pairs
    pairs:
      - text: panutan
        ar_eg: قدوة
        ar: قدوة
        en: role model
      - text: ketangguhan
        ar_eg: صلابة / قوة تحمّل
        ar: صلابة، قدرة على الصمود
        en: toughness, resilience
      - text: pantang menyerah
        ar_eg: ما بيستسلمش أبدًا
        ar: لا يستسلم أبدًا
        en: never giving up
      - text: unjuk gigi
        ar_eg: يورّي اللي عنده / يثبت نفسه
        ar: يُظهر قدرته، يثبت جدارته
        en: to show what one can do
    words: [panutan, ketangguhan, pantang menyerah, unjuk gigi]
  - id: e03
    type: listen
    text: Dedikasinya kepada anak-anak kampung membuat semua orang kagum.
    question:
      ar_eg: إيه اللي أبهر الناس؟
      ar: ما الذي أدهش الناس؟
      en: What amazed people?
    options: [تفانيها, صلابتها, قدوتها]
    answer: 0
    meaning:
      ar_eg: تفانيها مع عيال القرية خلّى الكل منبهر.
      ar: تفانيها مع أطفال القرية أدهش الجميع.
      en: Her dedication to the village children amazed everyone.
    words: [dedikasi]
  - id: e04
    type: fill_blank
    sentence: Walaupun gagal tiga kali, dia tetap ___.
    meaning:
      ar_eg: رغم إنه فشل تلات مرات، فضل ___.
      ar: رغم أنه فشل ثلاث مرّات بقي ___.
      en: Even after failing three times, he stayed ___.
    options: [pantang menyerah, panutan, dedikasi]
    answers: [pantang menyerah]
    words: [pantang menyerah, panutan, dedikasi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «unjuk gigi» يعني إيه؟
      ar: ما معنى «unjuk gigi»؟
      en: What does 'unjuk gigi' mean?
    options: [Pergi ke dokter gigi., Menunjukkan kemampuan di depan orang banyak., Tersenyum kepada juri.]
    answer: 1
    explain:
      ar_eg: unjuk gigi = يثبت إنه قدّها، مش ليه علاقة بالسنان.
      ar: unjuk gigi = يُثبت جدارته، لا علاقة له بالأسنان.
      en: unjuk gigi = prove yourself; nothing to do with teeth.
    words: [unjuk gigi]
  - id: e06
    type: fill_blank
    sentence: Sekolah memberi beasiswa kepada siswa ___.
    meaning:
      ar_eg: المدرسة بتدّي منحة للطلبة الـ ___.
      ar: تمنح المدرسة منحة للطلّاب ___.
      en: The school gives scholarships to ___ students.
    options: [berprestasi, ketangguhan, unjuk gigi]
    answers: [berprestasi]
    words: [berprestasi, ketangguhan, unjuk gigi]
  - id: e07
    type: build_sentence
    source:
      ar_eg: صلابتها اتختبرت في الجبل.
      ar: اختُبرت صلابتها في الجبل.
      en: Her toughness was tested on the mountain.
    answer: Ketangguhannya diuji di gunung.
    distractors: [tekun, ulet]
    words: [ketangguhan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Nelayan muda itu tekun dan ulet.
    answers_meaning:
      ar_eg: [الصياد الشاب ده مجتهد ونفَسه طويل, الصياد الصغير ده مثابر وما بيستسلمش]
      ar: [ذلك الصيّاد الشابّ مثابر وصبور, الصيّاد الشابّ دؤوب لا يستسلم]
      en: [That young fisherman is diligent and tenacious, The young fisherman is hard-working and resilient]
    words: [tekun, ulet]
  - id: e09
    type: speaking
    text: Dia panutan saya karena dia pantang menyerah.
    meaning:
      ar_eg: هي قدوتي علشان عمرها ما بتستسلم.
      ar: هي قدوتي لأنها لا تستسلم أبدًا.
      en: She's my role model because she never gives up.
    words: [panutan, pantang menyerah]
  - id: e10
    type: multiple_choice
    question: Kata mana yang paling cocok untuk orang yang bangun lagi setelah jatuh?
    options: [berprestasi, panutan, ulet]
    answer: 2
    explain:
      ar_eg: ulet = اللي يقوم تاني بعد ما يقع.
      ar: ulet = من ينهض بعد كلّ سقطة.
      en: ulet = someone who gets up again after a fall.
    words: [ulet, tekun, berprestasi, ketangguhan, unjuk gigi, panutan]
dialogue:
  lines:
    - speaker: Kak Yosua
      text: Kamu udah baca profil Maria, pemanjat tebing dari Wamena?
      ar_eg: قريت البروفايل بتاع ماريا، متسلّقة الصخور اللي من وامينا؟
      ar: هل قرأت سيرة ماريا، متسلّقة الصخور من وامينا؟
      en: Have you read the profile of Maria, the climber from Wamena?
    - speaker: Mohamed
      text: Udah. Dia tekun latihan dari umur sepuluh tahun.
      ar_eg: أيوه. بتتمرّن بإجتهاد من وهي عندها عشر سنين.
      ar: نعم. تتدرّب بمثابرة منذ العاشرة.
      en: Yes. She's trained hard since she was ten.
    - speaker: Kak Yosua
      text: Dua kali cedera, tapi dia tetap pantang menyerah.
      ar_eg: اتصابت مرتين، بس فضلت ما بتستسلمش.
      ar: أصيبت مرّتين لكنها لم تستسلم.
      en: Injured twice, and she still never gave up.
    - speaker: Mohamed
      text: Ketangguhan kayak gitu jarang. Tahun ini dia unjuk gigi di Jakarta.
      ar_eg: صلابة زي دي نادرة. السنة دي ورّت اللي عندها في جاكرتا.
      ar: صلابة كهذه نادرة، وقد أثبتت جدارتها في جاكرتا هذا العام.
      en: Toughness like that is rare. This year she proved herself in Jakarta.
    - speaker: Kak Yosua
      text: Sekarang dia jadi panutan anak-anak perempuan di kampungnya.
      ar_eg: دلوقتي بقت قدوة للبنات في قريتها.
      ar: صارت الآن قدوة لفتيات قريتها.
      en: Now she's a role model for the girls in her village.
