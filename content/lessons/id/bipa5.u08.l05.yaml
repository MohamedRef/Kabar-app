schema: kabar.lesson/v1
id: bipa5.u08.l05
language: id
title: Sikap penulis
can_do:
  ar_eg: 'تعرف موقف الكاتب ونبرته: ناقد ولا ساخر ولا ذاتي.'
  ar: 'أن تتعرّف على موقف الكاتب ونبرته: ناقد أم ساخر أم ذاتي.'
  en: Recognise a writer's stance and tone, whether critical, cynical or subjective.
slides:
  - title: Membaca di antara baris
    body:
      ar_eg: |
        مقال الرأي مش بس معلومات، فيه موقف:
        - sikap = موقف: bersikap kritis = ياخد موقف ناقد
        - kritis = ناقد بعقل، بيسأل ويحلل (حاجة كويسة!)
        - mengkritik = ينتقد
        - sinis = ساخر ومش مصدق حاجة: «Hebat, jalannya rusak lagi!»
        - subjektif = ذاتي، مبني على إحساس أو تجربة شخصية (وعكسها objektif)
        والكلمات اللي بتكشف الموقف: sayangnya (للأسف)، patut dihargai (يستاهل التقدير)، seolah-olah (كأن، وكتير بتبقى سخرية).
      ar: |
        ليس مقال الرأي معلومات فحسب، بل موقف أيضًا:
        - sikap = موقف: bersikap kritis = يتّخذ موقفًا نقديًا
        - kritis = ناقد بعقل، يسأل ويحلّل (وهذا حسن!)
        - mengkritik = ينتقد
        - sinis = ساخر متشكّك: «Hebat, jalannya rusak lagi!»
        - subjektif = ذاتي، قائم على شعور أو تجربة شخصية (وعكسه objektif)
        والكلمات الكاشفة للموقف: sayangnya (للأسف) وpatut dihargai (جدير بالتقدير) وseolah-olah (كأنّ، وكثيرًا ما تحمل سخرية).
      en: |
        An op-ed isn't just information; it takes a stance:
        - sikap = stance: bersikap kritis = to take a critical stance
        - kritis = critical in the thinking sense, questioning and analysing (a good thing!)
        - mengkritik = to criticise
        - sinis = cynical, sneering: «Hebat, jalannya rusak lagi!»
        - subjektif = subjective, based on feeling or personal experience (opposite: objektif)
        Words that give the stance away: sayangnya (unfortunately), patut dihargai (deserves credit), seolah-olah (as if, often sarcastic).
    examples:
      - text: Penulis bersikap kritis, tetapi tetap menghargai usaha pemerintah.
        ar_eg: الكاتب موقفه ناقد، بس برضه مقدّر مجهود الحكومة.
        ar: يتّخذ الكاتب موقفًا نقديًا، لكنه يقدّر جهود الحكومة.
        en: The writer is critical but still credits the government's efforts.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sikap
        ar_eg: موقف
        ar: موقف
        en: stance, attitude
      - text: sinis
        ar_eg: ساخر
        ar: ساخر متشكّك
        en: cynical
      - text: subjektif
        ar_eg: ذاتي
        ar: ذاتي
        en: subjective
      - text: kritis
        ar_eg: ناقد بعقل
        ar: نقدي
        en: critical
      - text: mengkritik
        ar_eg: ينتقد
        ar: ينتقد
        en: to criticise
    words: [sikap, sinis, subjektif, kritis, mengkritik]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Penulis bersikap kritis terhadap kebijakan itu.» معناها إيه؟
      ar: ما معنى «Penulis bersikap kritis terhadap kebijakan itu.»؟
      en: What does "Penulis bersikap kritis terhadap kebijakan itu." mean?
    options:
      - الكاتب مؤيد للسياسة دي تمامًا.
      - الكاتب بيحلل السياسة دي وبينتقدها.
      - الكاتب مش فاهم السياسة دي.
    answer: 1
    words: [kritis, kebijakan]
  - id: e03
    type: listen
    text: Tulisan ini subjektif karena penulis hanya menceritakan pengalamannya sendiri.
    question:
      ar_eg: ليه المقال ده ذاتي؟
      ar: لماذا هذا المقال ذاتي؟
      en: Why is this piece subjective?
    options:
      - عشان فيه أرقام كتير.
      - عشان الكاتب صحفي مشهور.
      - عشان الكاتب بيحكي تجربته هو بس.
    answer: 2
    words: [subjektif]
  - id: e04
    type: fill_blank
    sentence: Banyak warga ___ harga bahan pokok yang terus naik.
    meaning:
      ar_eg: ناس كتير بتنتقد أسعار السلع الأساسية اللي مش بتبطل تزيد.
      ar: ينتقد كثير من السكّان أسعار السلع الأساسية المتصاعدة.
      en: Many residents criticise the ever-rising price of staples.
    options: [mengkritik, sinis, subjektif]
    answers: [mengkritik]
    words: [mengkritik, bahan pokok]
  - id: e05
    type: build_sentence
    source:
      ar_eg: موقف الكاتب واضح من أول فقرة.
      ar: موقف الكاتب واضح منذ الفقرة الأولى.
      en: The writer's stance is clear from the first paragraph.
    answer: Sikap penulis sudah jelas sejak paragraf pertama.
    distractors: [sinis, kritis]
    words: [sikap]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الكاتب انتقد السياسة الجديدة دي.
      ar: انتقد الكاتب تلك السياسة الجديدة.
      en: The writer criticised that new policy.
    answers:
      - Penulis mengkritik kebijakan baru itu.
      - Penulis itu mengkritik kebijakan baru.
      - Penulis mengkritik kebijakan yang baru itu.
      - Penulis telah mengkritik kebijakan baru itu.
    words: [mengkritik, kebijakan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها سخرية (sinis)؟
      ar: أيّ جملة ساخرة (sinis)؟
      en: Which sentence is cynical (sinis)?
    options:
      - Hebat sekali, jalannya rusak lagi untuk ketiga kalinya tahun ini.
      - Jalan itu rusak karena hujan deras.
      - Pemerintah akan memperbaiki jalan bulan depan.
    answer: 0
    explain:
      ar_eg: «Hebat sekali» هنا معناها العكس، الكاتب بيتريق.
      ar: «Hebat sekali» هنا تعني عكسها، فالكاتب يتهكّم.
      en: «Hebat sekali» means the opposite here; the writer is mocking.
    words: [sinis]
  - id: e08
    type: speaking
    text: Saya bersikap kritis, tetapi saya tidak mau menjadi sinis.
    meaning:
      ar_eg: أنا موقفي ناقد، بس مش عايز أبقى ساخر.
      ar: موقفي نقدي، لكنّي لا أريد أن أكون ساخرًا.
      en: I take a critical stance, but I don't want to become cynical.
    words: [kritis, sinis, sikap]
  - id: e09
    type: dictation
    text: Opini memang subjektif, tetapi harus didukung bukti.
    meaning:
      ar_eg: الرأي ذاتي فعلًا، بس لازم يبقى عليه دليل.
      ar: الرأي ذاتي حقًا، لكن يجب أن تدعمه الأدلّة.
      en: Opinion is subjective, but it must be backed by evidence.
    words: [subjektif, bukti]
  - id: e10
    type: fill_blank
    sentence: Pembaca yang ___ selalu memeriksa sumber dan bukti.
    meaning:
      ar_eg: القارئ الناقد دايمًا بيراجع المصدر والدليل.
      ar: القارئ الناقد يتحقّق دائمًا من المصدر والدليل.
      en: A critical reader always checks the source and the evidence.
    options: [kritis, sinis, subjektif]
    answers: [kritis]
    words: [kritis]
dialogue:
  title: Opini tentang pasar intan
  lines:
    - speaker: Pak Hendra
      text: Apakah Anda sudah membaca opini tentang pasar intan Martapura?
      ar_eg: قريت مقال الرأي عن سوق الألماظ في مارتابورا؟
      ar: هل قرأت مقال الرأي عن سوق الألماس في مارتابورا؟
      en: Have you read the op-ed about Martapura's diamond market?
    - speaker: Mohamed
      text: Sudah, Pak. Sikap penulisnya kritis. Dia mengkritik penambangan liar.
      ar_eg: أيوه يا أستاذ. موقف الكاتب ناقد، وبينتقد التعدين العشوائي.
      ar: نعم يا أستاذ. موقف كاتبه نقدي، فهو ينتقد التعدين غير المرخّص.
      en: Yes, sir. The writer is critical. He criticises illegal mining.
    - speaker: Pak Hendra
      text: Tetapi di akhir tulisan dia agak sinis, ya?
      ar_eg: بس في آخر المقال كان ساخر شوية، صح؟
      ar: لكنه في آخر المقال ساخر بعض الشيء، أليس كذلك؟
      en: But at the end he's a bit cynical, isn't he?
    - speaker: Mohamed
      text: Betul. Dan bagian tentang keluarganya terasa subjektif, karena tidak ada data.
      ar_eg: مظبوط. والجزء اللي عن عيلته حاسس إنه ذاتي، عشان مفيش أرقام.
      ar: صحيح، والجزء المتعلّق بعائلته يبدو ذاتيًا لغياب البيانات.
      en: Right. And the part about his family feels subjective, because there's no data.
