schema: kabar.lesson/v1
id: bipa1.u08.l04
language: id
title: Yang mana?
can_do:
  ar_eg: تحدد «الطويل» أو «اللي…» من وسط ناس أو حاجات.
  ar: أن تُعيِّن «الطويل» أو «الذي…» من بين أشخاص أو أشياء.
  en: Identify "the tall one", "the one who…".
slides:
  - title: Yang = اللي
    body:
      ar_eg: |
        هدية للمصري: yang = «اللي» بالظبط. ومابتتغيرش أبدًا: لا مذكر ولا مؤنث ولا جمع.
        حطها بين الاسم والوصف:
        - teman yang ramah = الصاحب اللي لطيف
        - orang yang tinggal di sini = الراجل اللي ساكن هنا
      ar: |
        yang اسم موصول بمعنى «الذي / التي / الذين»، ولا يتغير أبدًا بالجنس ولا بالعدد، تمامًا كـ«اللي» في العامية.
        يأتي بين الاسم وصفته:
        - teman yang ramah = الصديق الودود
        - orang yang tinggal di sini = الشخص الذي يسكن هنا
      en: |
        yang = Egyptian «اللي» (who / which / that) and it never changes.
        Put it between a noun and its description:
        - teman yang ramah = the friend who is friendly
        - orang yang tinggal di sini = the person who lives here
    grammar: id.yang.basic
    examples:
      - text: Teman saya yang dari Bandung sangat ramah.
        ar_eg: صاحبي اللي من باندونج لطيف جدًا.
        ar: صديقي الذي من باندونغ ودود جدًا.
        en: My friend from Bandung is very friendly.
  - title: Yang merah, yang besar
    body:
      ar_eg: |
        yang ممكن تيجي لوحدها من غير اسم، زي «عايز اللي أحمر»:
        - Saya mau yang merah = عايز الأحمر.
        - Yang besar berapa? = الكبير بكام؟
        مفيدة جدًا في محلات جلودوك لما تشاور على حاجة.
      ar: |
        وتأتي yang وحدها دون اسم، بمعنى «الأحمر منها / الكبير منها»:
        - Saya mau yang merah = أريد الأحمر.
        - Yang besar berapa؟ = بكم الكبير؟
        وهذا مفيد جدًا في متاجر غلودوك.
      en: |
        yang can stand alone: "the … one".
        - Saya mau yang merah = I want the red one.
        - Yang besar berapa? = How much is the big one?
        Very handy when pointing at things in Glodok's shops.
    grammar: id.yang.basic
    examples:
      - text: Saya mau yang merah.
        ar_eg: عايز الأحمر.
        ar: أريد الأحمر.
        en: I want the red one.
      - text: Lampion yang kecil murah.
        ar_eg: الفانوس الصغير رخيص.
        ar: الفانوس الصغير رخيص.
        en: The small lantern is cheap.
  - title: Yang mana?
    body:
      ar_eg: |
        Yang mana? = أنهي واحد؟ والرد بـ yang + الوصف:
        - Kakak kamu yang mana? — Yang tinggi. = أخوك أنهي واحد؟ — الطويل.
        - Yang pakai kacamata. = اللي لابس نضارة.
        كده بتميّز واحد عن الباقيين: Kakak saya yang tinggi = أخويا الطويل (مش التاني).
        في الشات بيكتبوها yg.
      ar: |
        Yang mana؟ = أيّها / أيّهم؟ والجواب بـ yang + الوصف:
        - Kakak kamu yang mana؟ — Yang tinggi = أيّهم أخوك؟ — الطويل.
        - Yang pakai kacamata = الذي يلبس نظارة.
        وبهذا تميّز واحدًا من غيره: Kakak saya yang tinggi = أخي الطويل (لا الآخر).
        وتُكتب في المحادثات yg.
      en: |
        Yang mana? = Which one? Answer with yang + description:
        - Kakak kamu yang mana? — Yang tinggi. = Which one is your brother? — The tall one.
        - Yang pakai kacamata. = The one wearing glasses.
        This singles one out: Kakak saya yang tinggi = my tall brother (not the other one).
        Chat spelling: yg.
    grammar: id.yang.basic
    examples:
      - text: Dimas yang mana? — Yang pakai kacamata.
        ar_eg: أنهي واحد ديماس؟ — اللي لابس نضارة.
        ar: أيّهم ديماس؟ — الذي يلبس نظارة.
        en: Which one is Dimas? — The one wearing glasses.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: yang merah
        ar_eg: الأحمر
        ar: الأحمر
        en: the red one
      - text: yang besar
        ar_eg: الكبير
        ar: الكبير
        en: the big one
      - text: yang mana?
        ar_eg: أنهي واحد؟
        ar: أيّها؟
        en: which one?
      - text: yang pakai kacamata
        ar_eg: اللي لابس نضارة
        ar: الذي يلبس نظارة
        en: the one wearing glasses
    words: [yang, merah, kacamata]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «عايز الأحمر»؟
      ar: كيف تقول «أريد الأحمر»؟
      en: How do you say "I want the red one"?
    options: [Saya yang mau merah., Saya mau yang merah., Saya mau merah yang.]
    answer: 1
    explain:
      ar_eg: 'yang بتيجي قبل الوصف: yang merah = اللي أحمر.'
      ar: 'تسبق yang الصفة: yang merah.'
      en: 'yang comes before the description: yang merah.'
    words: [yang, merah]
  - id: e03
    type: listen
    text: Kakak saya yang tinggi.
    options: [Adik saya yang tinggi., Kakak saya tinggi., Kakak saya yang tinggi.]
    answer: 2
    words: [yang, tinggi]
  - id: e04
    type: fill_blank
    sentence: Lampion yang ___ murah, tapi yang besar mahal.
    meaning:
      ar_eg: الفانوس الصغير رخيص، بس الكبير غالي.
      ar: الفانوس الصغير رخيص، لكن الكبير غالٍ.
      en: The small lantern is cheap, but the big one is expensive.
    options: [kecil, besar, merah]
    answers: [kecil]
    explain:
      ar_eg: الكبير غالي، يبقى الرخيص هو الصغير، kecil.
      ar: الكبير غالٍ، فالرخيص هو الصغير kecil.
      en: The big one is expensive, so the cheap one is the small one, kecil.
    words: [kecil, lampion]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أخويا الكبير هو الطويل.
      ar: أخي الأكبر هو الطويل.
      en: My older brother is the tall one.
    answer: Kakak saya yang tinggi.
    distractors: [mana, pendek]
    words: [yang, tinggi, kakak]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عايز الأبيض.
      ar: أريد الأبيض.
      en: I want the white one.
    answers: [Saya mau yang putih., Saya mau yang putih, Aku mau yang putih., Aku mau yang putih, Saya ingin yang putih., Saya ingin yang putih]
    explain:
      ar_eg: 'زي «عايز اللي أبيض» بالظبط: yang + putih.'
      ar: 'كما تقول «أريد الأبيض»: yang + putih.'
      en: 'Just like «عايز اللي أبيض»: yang + putih.'
    words: [yang, putih]
  - id: e07
    type: dictation
    text: Yang besar berapa?
    meaning:
      ar_eg: الكبير بكام؟
      ar: بكم الكبير؟
      en: How much is the big one?
    words: [yang, berapa]
  - id: e08
    type: speaking
    text: Saya mau yang merah.
    meaning:
      ar_eg: عايز الأحمر.
      ar: أريد الأحمر.
      en: I want the red one.
    words: [yang, merah]
dialogue:
  title: Lampion di Glodok
  lines:
    - speaker: Penjual
      text: Mau lampion, Mbak?
      ar_eg: عايزة فانوس يا آنسة؟
      ar: أتريدين فانوسًا يا آنسة؟
      en: Would you like a lantern, miss?
    - speaker: Rina
      text: Ya, Bu. Yang merah berapa?
      ar_eg: أيوه يا طنط. الأحمر بكام؟
      ar: نعم يا سيدتي. بكم الأحمر؟
      en: Yes, ma'am. How much is the red one?
    - speaker: Penjual
      text: Yang mana? Ada yang besar, ada yang kecil.
      ar_eg: أنهي واحد؟ فيه الكبير وفيه الصغير.
      ar: أيّها؟ هناك الكبير وهناك الصغير.
      en: Which one? There's a big one and a small one.
    - speaker: Rina
      text: Yang kecil, Bu.
      ar_eg: الصغير يا طنط.
      ar: الصغير يا سيدتي.
      en: The small one, ma'am.
    - speaker: Penjual
      text: Yang kecil dua puluh ribu.
      ar_eg: الصغير بعشرين ألف.
      ar: الصغير بعشرين ألفًا.
      en: The small one is twenty thousand.
    - speaker: Rina
      text: Saya mau yang itu. Terima kasih, Bu!
      ar_eg: عايزة ده. شكرًا يا طنط!
      ar: أريد ذلك. شكرًا يا سيدتي!
      en: I'll take that one. Thank you, ma'am!
new_words:
  - word: merah
    pos: adjective
    ar_eg: أحمر
    ar: أحمر
    en: red
  - word: putih
    pos: adjective
    ar_eg: أبيض
    ar: أبيض
    en: white
  - word: lampion
    pos: noun
    ar_eg: فانوس ورق (الأحمر الصيني)
    ar: فانوس ورقي
    en: paper lantern
  - word: pakai
    pos: verb
    ar_eg: يلبس؛ يستعمل
    ar: يلبس؛ يستعمل
    en: to wear; to use
  - word: kacamata
    pos: noun
    ar_eg: نضارة
    ar: نظّارة
    en: glasses
