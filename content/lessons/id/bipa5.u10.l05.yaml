schema: kabar.lesson/v1
id: bipa5.u10.l05
language: id
title: Tampil percaya diri
can_do:
  ar_eg: تتكلم عن التوتر قبل العرض وإزاي تقف قدام الناس بثقة.
  ar: أن تتحدّث عن التوتّر قبل العرض وكيف تقف أمام الناس بثقة.
  en: Talk about nerves before a talk and how to stand in front of people with confidence.
slides:
  - title: Bukan hanya kata-kata
    body:
      ar_eg: |
        العرض الناجح مش بس كلام:
        - gugup = متوتر / مرعوب شوية
        - percaya diri = واثق من نفسه
        - kontak mata = تبص في عيون الحاضرين
        - bahasa tubuh = لغة الجسد: الوقفة والإيدين والوش
        - jeda = وقفة قصيرة: سكتة صغيرة بعد النقطة المهمة بتخلي الناس تستوعب
        نصيحة: Tarik napas panjang = خد نفس عميق.
      ar: |
        ليس العرض الناجح كلامًا فقط:
        - gugup = متوتّر، قلق
        - percaya diri = واثق بنفسه
        - kontak mata = التواصل البصري مع الحاضرين
        - bahasa tubuh = لغة الجسد: الوقفة واليدان والوجه
        - jeda = وقفة قصيرة: سكتة بعد النقطة المهمّة تتيح للناس الاستيعاب
        ونصيحة: Tarik napas panjang = خذ نفسًا عميقًا.
      en: |
        A good talk isn't only words:
        - gugup = nervous
        - percaya diri = confident
        - kontak mata = eye contact
        - bahasa tubuh = body language: posture, hands, face
        - jeda = a short pause; silence after a key point lets people take it in
        Tip: Tarik napas panjang = take a deep breath.
    examples:
      - text: Saya gugup, tetapi saya menjaga kontak mata dengan hadirin.
        ar_eg: كنت متوتر، بس فضلت باصص في عيون الحاضرين.
        ar: كنت متوتّرًا، لكنّي حافظت على التواصل البصري مع الحاضرين.
        en: I was nervous, but I kept eye contact with the audience.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gugup
        ar_eg: متوتر
        ar: متوتّر
        en: nervous
      - text: percaya diri
        ar_eg: واثق من نفسه
        ar: واثق بنفسه
        en: confident
      - text: kontak mata
        ar_eg: تبص في العين
        ar: تواصل بصري
        en: eye contact
      - text: bahasa tubuh
        ar_eg: لغة الجسد
        ar: لغة الجسد
        en: body language
      - text: jeda
        ar_eg: وقفة قصيرة
        ar: وقفة قصيرة
        en: pause
    words: [gugup, percaya diri, kontak mata, bahasa tubuh, jeda]
  - id: e02
    type: listen
    text: Sebelum presentasi saya selalu gugup, jadi saya menarik napas panjang.
    question:
      ar_eg: بيعمل إيه لما يتوتر؟
      ar: ماذا يفعل حين يتوتّر؟
      en: What does he do when he's nervous?
    options:
      - بيشرب قهوة.
      - بياخد نفس عميق.
      - بيلغي العرض.
    answer: 1
    words: [gugup]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «kontak mata» يعني إيه؟
      ar: ما معنى «kontak mata»؟
      en: What does "kontak mata" mean?
    options:
      - تبص في عيون الحاضرين.
      - تقفل عينيك.
      - تبص في الورق.
    answer: 0
    words: [kontak mata]
  - id: e04
    type: fill_blank
    sentence: Beri ___ sebentar setelah poin penting.
    meaning:
      ar_eg: اسكت شوية بعد النقطة المهمة.
      ar: قف قليلًا بعد النقطة المهمّة.
      en: Pause briefly after a key point.
    options: [jeda, gugup, kontak mata]
    answers: [jeda]
    words: [jeda, poin penting]
  - id: e05
    type: build_sentence
    source:
      ar_eg: لغة الجسد بتقول أكتر من الكلام.
      ar: تقول لغة الجسد أكثر من الكلمات.
      en: Body language says more than words.
    answer: Bahasa tubuh berbicara lebih banyak daripada kata-kata.
    distractors: [gugup, jeda]
    words: [bahasa tubuh]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا واثق من نفسي.
      ar: أنا واثق بنفسي.
      en: I'm confident.
    answers:
      - Saya percaya diri.
      - Saya merasa percaya diri.
      - Aku percaya diri.
      - Saya sudah percaya diri.
    words: [percaya diri]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي حاجة بتبيّن إنك واثق من نفسك؟
      ar: أيّها يدلّ على الثقة بالنفس؟
      en: Which one shows confidence?
    options:
      - Berbicara sambil melihat lantai.
      - Membaca semua teks dari tayangan.
      - Berdiri tegak dan menjaga kontak mata.
    answer: 2
    words: [percaya diri, kontak mata]
  - id: e08
    type: speaking
    text: Jangan gugup. Jaga kontak mata dan beri jeda.
    meaning:
      ar_eg: ماتتوترش. بص في عيون الناس واسكت شوية بين النقط.
      ar: لا تتوتّر. حافظ على التواصل البصري وتوقّف قليلًا.
      en: Don't be nervous. Keep eye contact and pause.
    words: [gugup, kontak mata, jeda]
  - id: e09
    type: dictation
    text: Bahasa tubuh yang terbuka membuat pembicara terlihat percaya diri.
    meaning:
      ar_eg: لغة الجسد المنفتحة بتخلي المتكلم يبان واثق من نفسه.
      ar: تجعل لغة الجسد المنفتحة المتحدّث يبدو واثقًا بنفسه.
      en: Open body language makes a speaker look confident.
    words: [bahasa tubuh, percaya diri]
  - id: e10
    type: fill_blank
    sentence: Tangannya gemetar karena dia ___.
    meaning:
      ar_eg: إيديه بتترعش عشان هو متوتر.
      ar: ترتجف يداه لأنه متوتّر.
      en: His hands are shaking because he's nervous.
    options: [gugup, percaya diri, jeda]
    answers: [gugup]
    words: [gugup]
dialogue:
  title: Lima menit sebelum tampil
  lines:
    - speaker: Mohamed
      text: Mas, saya gugup sekali. Hadirinnya banyak!
      ar_eg: يا ريزال، أنا متوتر جدًا. الحاضرين كتير!
      ar: يا ريزال، أنا متوتّر جدًا، فالحاضرون كثيرون!
      en: Mas, I'm so nervous. There are so many people!
    - speaker: Mas Rizal
      text: Tarik napas panjang. Kamu sudah latihan tiga kali, jadi kamu bisa percaya diri.
      ar_eg: خد نفس عميق. إنت عملت بروفة تلات مرات، فتقدر تبقى واثق من نفسك.
      ar: خذ نفسًا عميقًا. لقد تدرّبت ثلاث مرّات، فبإمكانك أن تثق بنفسك.
      en: Take a deep breath. You've rehearsed three times, so you can be confident.
    - speaker: Mohamed
      text: Bagaimana dengan bahasa tubuh saya? Apa yang harus saya lakukan dengan tangan saya?
      ar_eg: طب ولغة جسمي؟ أعمل إيه بإيديا؟
      ar: وماذا عن لغة جسدي؟ ماذا أفعل بيديّ؟
      en: What about my body language? What do I do with my hands?
    - speaker: Mas Rizal
      text: Berdiri tegak, jaga kontak mata, dan beri jeda setelah setiap poin penting.
      ar_eg: اقف مفرود، وبص في عيون الناس، واسكت شوية بعد كل نقطة مهمة.
      ar: قف منتصبًا، وحافظ على التواصل البصري، وتوقّف بعد كلّ نقطة مهمّة.
      en: Stand up straight, keep eye contact, and pause after each key point.
