schema: kabar.lesson/v1
id: bipa6.u01.l05
language: id
title: Cerpen koran Minggu
can_do:
  ar_eg: 'تتكلم عن عالم القصة القصيرة في إندونيسيا: الكتّاب والجرايد والمجموعات القصصية.'
  ar: 'أن تتحدّث عن عالم القصة القصيرة في إندونيسيا: الكتّاب والصحف والمجموعات القصصية.'
  en: Talk about the Indonesian short-story world, from writers to newspapers and collections.
slides:
  - title: Sastra di halaman koran
    body:
      ar_eg: |
        في إندونيسيا، جرايد كتير بتنشر قصة قصيرة كل يوم حد، وجريدة Kompas بتجمع أحسن قصص السنة في كتاب كل سنة.
        - pengarang = المؤلف، وcerpenis = كاتب القصص القصيرة (زي Seno Gumira Ajidarma)
        - redaktur = المحرر اللي بيختار القصص
        - diterbitkan = اتنشر (من terbit = يطلع)
        - kumpulan cerpen = مجموعة قصصية
        - في الشارع: nulis = menulis (يكتب).
      ar: |
        تنشر صحف إندونيسية كثيرة قصة قصيرة كلّ يوم أحد، وتجمع صحيفة Kompas أفضل قصص العام في كتاب سنوي.
        - pengarang = المؤلّف، وcerpenis = كاتب القصة القصيرة (مثل Seno Gumira Ajidarma)
        - redaktur = المحرّر الذي يختار القصص
        - diterbitkan = نُشر (من terbit = يصدر)
        - kumpulan cerpen = مجموعة قصصية
        - في كلام الشارع: nulis = menulis (يكتب).
      en: |
        Many Indonesian papers print a short story every Sunday, and Kompas gathers the year's best into an annual book.
        - pengarang = author; cerpenis = short-story writer (such as Seno Gumira Ajidarma)
        - redaktur = the editor who picks the stories
        - diterbitkan = published (from terbit = to come out)
        - kumpulan cerpen = short-story collection
        - On the street: nulis = menulis (to write).
    examples:
      - text: Cerpen itu diterbitkan di koran Minggu, lalu masuk kumpulan cerpen terbaik.
        ar_eg: القصة دي اتنشرت في جرنال الحد، وبعدين دخلت مجموعة أحسن القصص.
        ar: نُشرت القصة في صحيفة الأحد، ثم دخلت مجموعة أفضل القصص.
        en: The story was published in a Sunday paper, then made it into a best-of collection.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pengarang
        ar_eg: مؤلف
        ar: مؤلّف
        en: author
      - text: cerpenis
        ar_eg: كاتب قصص قصيرة
        ar: قاصّ
        en: short-story writer
      - text: kumpulan cerpen
        ar_eg: مجموعة قصصية
        ar: مجموعة قصصية
        en: story collection
      - text: diterbitkan
        ar_eg: اتنشر
        ar: نُشر
        en: published
      - text: redaktur
        ar_eg: محرر
        ar: محرّر
        en: editor
    words: [pengarang, cerpenis, kumpulan cerpen, diterbitkan, redaktur]
  - id: e02
    type: listen
    text: Setiap hari Minggu, satu cerpen diterbitkan di koran itu.
    question:
      ar_eg: الجرنال بينشر قصة إمتى؟
      ar: متى تنشر الصحيفة قصة؟
      en: When does the paper publish a story?
    options:
      - كل يوم.
      - كل يوم حد.
      - مرة في الشهر.
    answer: 1
    words: [diterbitkan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «cerpenis» يعني مين؟
      ar: من «cerpenis»؟
      en: Who is a "cerpenis"?
    options:
      - كاتب قصص قصيرة.
      - بياع جرايد.
      - ناقد أفلام.
    answer: 0
    explain:
      ar_eg: cerpen + -is، زي pianis وjurnalis.
      ar: cerpen مع اللاحقة -is، مثل pianis وjurnalis.
      en: cerpen plus -is, like pianis and jurnalis.
    words: [cerpenis]
  - id: e04
    type: fill_blank
    sentence: Cerpen Bang Togar dikirim ke ___ koran, tetapi belum dibalas.
    meaning:
      ar_eg: قصة الأستاذ توجار اتبعتت لمحرر الجرنال، بس لسه مارّدش.
      ar: أُرسلت قصة توغار إلى محرّر الصحيفة، لكنه لم يردّ بعد.
      en: Bang Togar's story went to the paper's editor, but there's no reply yet.
    options: [redaktur, kumpulan cerpen, pencerita]
    answers: [redaktur]
    words: [redaktur]
  - id: e05
    type: build_sentence
    source:
      ar_eg: قصص المؤلف ده اتجمعت في كتاب واحد.
      ar: جُمعت قصص ذلك المؤلّف في كتاب واحد.
      en: That author's stories were collected in one book.
    answer: Cerpen-cerpen pengarang itu dikumpulkan dalam satu buku.
    distractors: [redaktur, diterbitkan]
    words: [pengarang]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المجموعة القصصية دي اتنشرت سنة ٢٠٢٠.
      ar: نُشرت هذه المجموعة القصصية عام ٢٠٢٠.
      en: This story collection was published in 2020.
    answers:
      - Kumpulan cerpen ini diterbitkan pada tahun 2020.
      - Kumpulan cerpen ini diterbitkan tahun 2020.
      - Kumpulan cerpen ini diterbitkan pada 2020.
    words: [kumpulan cerpen, diterbitkan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيقرر أنهي قصة تتنشر في الجرنال؟
      ar: من يقرّر أيّ قصة تُنشر في الصحيفة؟
      en: Who decides which story the paper publishes?
    options: [pembaca, pencerita, redaktur]
    answer: 2
    words: [redaktur]
  - id: e08
    type: speaking
    text: Seno Gumira Ajidarma adalah cerpenis yang terkenal.
    meaning:
      ar_eg: سينو جوميرا أجيدارما كاتب قصص قصيرة مشهور.
      ar: سينو غوميرا أجيدارما قاصّ مشهور.
      en: Seno Gumira Ajidarma is a well-known short-story writer.
    words: [cerpenis]
  - id: e09
    type: dictation
    text: Pengarang muda itu mengirim cerpennya ke koran Minggu.
    meaning:
      ar_eg: المؤلف الشاب ده بعت قصته لجرنال الحد.
      ar: أرسل المؤلّف الشاب قصته إلى صحيفة الأحد.
      en: The young author sent his story to the Sunday paper.
    words: [pengarang]
  - id: e10
    type: fill_blank
    sentence: Saya membeli ___ karya cerpenis Medan.
    meaning:
      ar_eg: اشتريت مجموعة قصصية لكاتب من ميدان.
      ar: اشتريت مجموعة قصصية لقاصّ من ميدان.
      en: I bought a story collection by a Medan writer.
    options: [kumpulan cerpen, redaktur, kilas balik]
    answers: [kumpulan cerpen]
    words: [kumpulan cerpen]
dialogue:
  title: Kabar dari redaktur
  lines:
    - speaker: Kak Mei
      text: Mohamed, cerpen Bang Togar mau diterbitkan hari Minggu ini!
      ar_eg: يا محمد، قصة توجار هتتنشر يوم الحد ده!
      ar: يا محمد، ستُنشر قصة توغار يوم الأحد هذا!
      en: Mohamed, Bang Togar's story is being published this Sunday!
    - speaker: Mohamed
      text: Hebat! Redakturnya suka cerpen tentang kursi kosong itu?
      ar_eg: برافو! المحرر عجبته القصة بتاعة الكرسي الفاضي؟
      ar: رائع! هل أعجبت المحرّرَ قصةُ الكرسي الفارغ؟
      en: Great! The editor liked the story about the empty chair?
    - speaker: Kak Mei
      text: Iya. Katanya, pengarang muda jarang nulis makna tersirat sebagus itu.
      ar_eg: أيوه. بيقول إن الكتّاب الشباب نادرًا ما بيكتبوا المعنى الضمني حلو كده.
      ar: نعم، ويقول إنّ الكتّاب الشباب قلّما يكتبون المعنى الضمني بهذه البراعة.
      en: Yes. He said young authors rarely handle implied meaning that well.
    - speaker: Mohamed
      text: Semoga suatu hari cerpennya masuk kumpulan cerpen terbaik.
      ar_eg: يا رب في يوم قصته تدخل مجموعة أحسن القصص.
      ar: عسى أن تدخل قصته يومًا مجموعة أفضل القصص.
      en: I hope one day his story makes it into a best-of collection.
