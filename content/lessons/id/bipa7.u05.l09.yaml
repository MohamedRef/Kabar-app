        ar_eg: النهضة الوطنية
        ar: النهضة الوطنية
        en: national awakening
      - text: nasionalisme
        ar_eg: القومية / الوطنية
        ar: القومية
        en: nationalism
      - text: imperialisme
        ar_eg: الإمبريالية
        ar: الإمبريالية
        en: imperialism
      - text: dekrit
        ar_eg: مرسوم
        ar: مرسوم
        en: decree
    words: [kebangkitan nasional, nasionalisme, imperialisme, dekrit]
  - id: e02
    type: match_pairs
    pairs:
      - text: demokrasi terpimpin
        ar_eg: الديمقراطية الموجّهة
        ar: الديمقراطية الموجَّهة
        en: Guided Democracy
      - text: Orde Lama
        ar_eg: العهد القديم (أيام سوكارنو)
        ar: العهد القديم (عهد سوكارنو)
        en: the Old Order (Sukarno era)
      - text: otoriter
        ar_eg: سلطوي / استبدادي
        ar: سلطوي
        en: authoritarian
      - text: historiografi
        ar_eg: كتابة التاريخ / التأريخ
        ar: علم التأريخ
        en: historiography
    words: [demokrasi terpimpin, Orde Lama, otoriter, historiografi]
  - id: e03
    type: listen
    text: Banyak sejarawan menilai pemerintahan itu otoriter.
    question:
      ar_eg: المؤرخين شايفين الحكومة إزاي؟
      ar: كيف يرى المؤرّخون الحكومة؟
      en: How do historians see the government?
    options: [سلطوي, ديمقراطي, ضعيف]
    answer: 0
    meaning:
      ar_eg: مؤرخين كتير شايفين إن الحكومة دي كانت سلطوية.
      ar: يرى مؤرّخون كثيرون أنّ تلك الحكومة كانت سلطوية.
      en: Many historians judge that government authoritarian.
    words: [otoriter]
  - id: e04
    type: fill_blank
    sentence: Budi Utomo menjadi tonggak ___ Indonesia.
    meaning:
      ar_eg: بودي أوتومو بقت علامة في ___ إندونيسيا.
      ar: صارت بودي أوتومو معلمًا في ___ إندونيسيا.
      en: Budi Utomo became a milestone of Indonesia's ___.
    options: [kebangkitan nasional, demokrasi terpimpin, dekrit]
    answers: [kebangkitan nasional]
    words: [kebangkitan nasional, demokrasi terpimpin, dekrit]
    explain:
      ar_eg: بودي أوتومو (1908) علامة kebangkitan nasional = النهضة القومية. demokrasi terpimpin وdekrit من أيام سوكارنو بعد كده.
      ar: بودي أوتومو 1908 علامة kebangkitan nasional أي النهضة الوطنية. الخياران الآخران من عهد سوكارنو.
      en: Budi Utomo (1908) marks the national awakening. The others belong to Sukarno's era.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه نقول إن اسم «Orde Lama» مش محايد؟
      ar: لماذا لا يُعدّ اسم «Orde Lama» محايدًا؟
      en: Why isn't the name 'Orde Lama' neutral?
    options: [Karena nama itu dibuat oleh rezim sesudahnya., Karena ditulis dalam bahasa Belanda., Karena tidak ada di buku.]
    answer: 0
    explain:
      ar_eg: الاسم اتعمل من العهد اللي بعده علشان يبيّن نفسه جديد.
      ar: صاغ الاسمَ العهدُ التالي ليظهر جديدًا.
      en: The next regime coined it to look new by contrast.
    words: [Orde Lama, historiografi]
  - id: e06
    type: fill_blank
    sentence: Para pemuda melawan ___ dan penjajahan.
    meaning:
      ar_eg: الشباب قاوموا ___ والاستعمار.
      ar: قاوم الشباب ___ والاستعمار.
      en: The young people fought ___ and colonial rule.
    options: [imperialisme, historiografi, nasionalisme]
    answers: [imperialisme]
    words: [imperialisme, historiografi, nasionalisme]
    explain:
      ar_eg: الشباب حاربوا imperialisme = الإمبريالية. historiografi = كتابة التاريخ، وnasionalisme هو اللي كانوا مؤمنين بيه.
      ar: قاوم الشباب imperialisme. historiografi تدوين التاريخ وnasionalisme ما آمنوا به.
      en: They fought imperialisme. nasionalisme was their cause, not their enemy.
  - id: e07
    type: build_sentence
    source:
      ar_eg: المرسوم ده رجّع دستور 1945.
      ar: أعاد هذا المرسوم دستور 1945.
      en: That decree restored the 1945 Constitution.
    answer: Dekrit itu mengembalikan UUD 1945.
    distractors: [Orde Lama, imperialisme]
    words: [dekrit]
    explain:
      ar_eg: Dekrit itu (المرسوم ده) + mengembalikan (رجّع) + UUD 1945. Orde Lama وimperialisme زيادة.
      ar: Dekrit itu mengembalikan UUD 1945. Orde Lama وimperialisme زائدتان.
      en: Dekrit itu + mengembalikan + UUD 1945. Orde Lama and imperialisme are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Demokrasi terpimpin dimulai pada tahun 1959.
    answers_meaning:
      ar_eg: [الديمقراطية الموجّهة بدأت سنة 1959, الديمقراطية الموجّهة ابتدت سنة 1959]
      ar: [بدأت الديمقراطية الموجَّهة عام 1959, انطلقت الديمقراطية الموجّهة سنة 1959]
      en: [Guided Democracy began in 1959, Guided Democracy started in 1959]
    words: [demokrasi terpimpin]
  - id: e09
    type: speaking
    text: Nasionalisme Indonesia lahir dari perlawanan terhadap imperialisme.
    meaning:
      ar_eg: القومية الإندونيسية اتولدت من مقاومة الإمبريالية.
      ar: وُلدت القومية الإندونيسية من مقاومة الإمبريالية.
      en: Indonesian nationalism was born from resisting imperialism.
    words: [nasionalisme, imperialisme]
  - id: e10
    type: multiple_choice
    question: Siapa yang mempopulerkan istilah "Orde Lama"?
    options: [Para tokoh kebangkitan nasional tahun 1908., Belanda pada zaman VOC., Pemerintah Orde Baru.]
    answer: 2
    explain:
      ar_eg: أوردي بارو هو اللي نشر الاسم ده.
      ar: العهد الجديد هو من أشاع هذا الاسم.
      en: The New Order spread that name.
    words: [Orde Lama, historiografi, kebangkitan nasional, otoriter, demokrasi terpimpin]
dialogue:
  lines:
    - speaker: Pak Hasan
      text: Kalau menulis sejarah, hati-hati dengan istilah, Mohamed.
      ar_eg: لو هتكتب تاريخ، خلّي بالك من المصطلحات يا محمد.
      ar: إذا كتبت التاريخ فاحذر من المصطلحات يا محمد.
      en: When you write history, be careful with terms, Mohamed.
    - speaker: Mohamed
      text: Maksud Bapak seperti "Orde Lama"?
      ar_eg: قصدك زي «أوردي لاما»؟
      ar: تقصد مثل «Orde Lama»؟
      en: You mean like 'Orde Lama'?
    - speaker: Pak Hasan
      text: Ya. Itu nama dari lawan politiknya. Itu soal historiografi.
      ar_eg: أيوه. ده اسم من خصومه السياسيين. دي مسألة كتابة تاريخ.
      ar: نعم، إنه اسم من خصومه السياسيين، وهذه مسألة تأريخ.
      en: Yes. That name came from its political opponents. It's a question of historiography.
    - speaker: Mohamed
      text: Jadi lebih netral menulis "masa demokrasi terpimpin"?
      ar_eg: يبقى أحسن أكتب «فترة الديمقراطية الموجّهة»؟
      ar: إذن الأكثر حيادًا أن أكتب «فترة الديمقراطية الموجّهة»؟
      en: So it's more neutral to write 'the Guided Democracy period'?
    - speaker: Pak Hasan
      text: Tepat. Lalu biarkan pembaca menilai apakah zaman itu otoriter.
      ar_eg: بالظبط. وبعدين سيب القارئ يحكم إذا كان العهد ده سلطوي.
      ar: تمامًا، ثمّ دع القارئ يحكم إن كان ذلك العهد سلطويًّا.
      en: Exactly. Then let the reader judge whether that era was authoritarian.
