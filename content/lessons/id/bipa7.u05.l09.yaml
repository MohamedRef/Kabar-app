schema: kabar.lesson/v1
id: bipa7.u05.l09
language: id
title: Dari Budi Utomo ke Orde Lama
can_do:
  ar_eg: تقرا عن مراحل التاريخ الحديث وتفهم إن أسامي العهود نفسها ليها وجهة نظر.
  ar: أن تقرأ عن مراحل التاريخ الحديث وتفهم أنّ أسماء العهود ذاتها تحمل وجهة نظر.
  en: Read about modern periods and see that the names of eras carry a point of view.
slides:
  - title: Nama-nama zaman
    body:
      ar_eg: |
        20 مايو 1908 اتأسّست Budi Utomo، والتاريخ ده بقى Hari Kebangkitan Nasional (يوم النهضة الوطنية).
        nasionalisme الإندونيسي اتولد ضد imperialisme (الإمبريالية) والاستعمار.
        5 يوليو 1959: سوكارنو أصدر dekrit (مرسوم) رجّع دستور 1945، وبدأت demokrasi terpimpin (الديمقراطية الموجّهة).
        سؤال historiografi (كتابة التاريخ): كلمة Orde Lama اخترعها العهد اللي بعده، Orde Baru، علشان يقول إنه «الجديد».
        مؤرخين كتير بيقولوا إن العهدين كانوا otoriter (سلطويين) بطرق مختلفة.
      ar: |
        في 20 مايو 1908 تأسّست Budi Utomo، فصار ذلك اليوم Hari Kebangkitan Nasional (يوم النهضة الوطنية).
        وُلد nasionalisme الإندونيسي في مواجهة imperialisme والاستعمار.
        5 يوليو 1959: أصدر سوكارنو dekrit (مرسومًا) أعاد دستور 1945، فبدأت demokrasi terpimpin.
        وفي historiografi (التأريخ) سؤال: لفظ Orde Lama صاغه العهد التالي، Orde Baru، ليقدّم نفسه بوصفه «الجديد».
        ويرى مؤرّخون كثيرون أنّ العهدين كانا otoriter (سلطويّين) بطرق مختلفة.
      en: |
        On 20 May 1908 Budi Utomo was founded; that date became Hari Kebangkitan Nasional (National Awakening Day).
        Indonesian nasionalisme grew up against imperialisme and colonial rule.
        5 July 1959: Sukarno issued a dekrit restoring the 1945 Constitution, and demokrasi terpimpin (Guided Democracy) began.
        A historiografi question: the name Orde Lama was coined by the next regime, the Orde Baru, to cast itself as "new".
        Many historians judge both regimes otoriter (authoritarian) in different ways.
    examples:
      - text: Hari Kebangkitan Nasional diperingati setiap 20 Mei.
        ar_eg: يوم النهضة الوطنية بيتحتفل بيه كل 20 مايو.
        ar: يُحتفى بيوم النهضة الوطنية في 20 مايو من كلّ عام.
        en: National Awakening Day is marked every 20 May.
      - text: Dekrit Presiden 1959 mengakhiri Konstituante.
        ar_eg: مرسوم الرئيس سنة 1959 أنهى الجمعية التأسيسية.
        ar: أنهى المرسوم الرئاسي عام 1959 الجمعيّة التأسيسية.
        en: The 1959 Presidential Decree ended the Constituent Assembly.
      - text: Istilah "Orde Lama" lahir dari historiografi Orde Baru.
        ar_eg: كلمة «أوردي لاما» طالعة من كتابة التاريخ بتاعة أوردي بارو.
        ar: وُلد مصطلح «Orde Lama» من تأريخ العهد الجديد.
        en: The term 'Old Order' was born in New Order historiography.
exercises:
  - id: e01
    type: match_pairs
    pairs:
