schema: kabar.lesson/v1
id: bipa7.u04.l06
language: id
title: Bahasa isyarat
can_do:
  ar_eg: تتكلّم باحترام عن لغة الإشارة الإندونيسية ومجتمع الصمّ.
  ar: أن تتحدّث باحترام عن لغة الإشارة الإندونيسية ومجتمع الصمّ.
  en: Talk respectfully about Indonesian Sign Language and the Deaf community.
slides:
  - title: Bahasa dengan tangan
    body:
      ar_eg: |
        مش كل اللهجات بتتسمع: فيه لهجات بتتشاف! الـ bahasa isyarat (لغة الإشارة) لغة كاملة بالإيدين والوش.
        - BISINDO = Bahasa Isyarat Indonesia: اللغة اللي مجتمع الـ Tuli (الصمّ) نفسه طلّعها، وفيها لهجات من منطقة لمنطقة كمان.
        - مجتمع الصمّ بيفضّل كلمة Tuli بحرف كبير (هوية وثقافة)، أكتر من الكلمة الطبية «tunarungu».
        - abjad jari = الحروف بالصوابع: في BISINDO أغلبها بالإيدين الاتنين.
        - juru bahasa isyarat = مترجم لغة الإشارة: بتشوفه في ركن الشاشة في نشرة الأخبار.
        ٢٣ سبتمبر هو اليوم العالمي للغات الإشارة.
        - في الكلام: nggak = tidak، gimana = bagaimana، gitu = begitu، kalo = kalau، bareng = bersama.
      ar: |
        ليست كلّ اللهجات مسموعة، فبعضها يُرى! الـ bahasa isyarat (لغة الإشارة) لغة تامّة باليدين والوجه.
        - BISINDO = Bahasa Isyarat Indonesia: لغة نشأت في مجتمع الـ Tuli (الصمّ) نفسه، ولها لهجات تختلف من منطقة إلى أخرى.
        - ويفضّل مجتمع الصمّ كلمة Tuli بحرف كبير (هويةً وثقافةً) على اللفظ الطبّيّ «tunarungu».
        - abjad jari = التهجئة بالأصابع، وأكثرها في BISINDO باليدين معًا.
        - juru bahasa isyarat = مترجم لغة الإشارة، تراه في ركن الشاشة في نشرة الأخبار.
        و٢٣ سبتمبر هو اليوم الدوليّ للغات الإشارة.
        - في الكلام اليومي: nggak = tidak، gimana = bagaimana، gitu = begitu، kalo = kalau، bareng = bersama.
      en: |
        Not every dialect is heard; some are seen! Bahasa isyarat (sign language) is a full language of hands and face.
        - BISINDO = Bahasa Isyarat Indonesia: the language that grew within the Tuli (Deaf) community itself, with its own regional dialects.
        - The Deaf community prefers Tuli with a capital T (identity and culture) over the medical word "tunarungu".
        - abjad jari = fingerspelling; in BISINDO most letters use both hands.
        - juru bahasa isyarat = sign language interpreter, the one you see in the corner of the TV news.
        23 September is the International Day of Sign Languages.
        - In speech: nggak = tidak, gimana = bagaimana, gitu = begitu, kalo = kalau, bareng = bersama.
    examples:
      - text: Teman saya Tuli. Kami mengobrol dengan BISINDO.
        ar_eg: صاحبي أصمّ. بنتكلّم مع بعض بالـ BISINDO.
        ar: صديقي أصمّ، ونتحادث بلغة BISINDO.
        en: My friend is Deaf. We chat in BISINDO.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bahasa isyarat
        ar_eg: لغة الإشارة
        ar: لغة الإشارة
        en: sign language
      - text: Tuli
        ar_eg: أصمّ (هوية)
        ar: أصمّ
        en: Deaf
      - text: juru bahasa isyarat
        ar_eg: مترجم إشارة
        ar: مترجم لغة الإشارة
        en: sign language interpreter
      - text: abjad jari
        ar_eg: الحروف بالصوابع
        ar: التهجئة بالأصابع
        en: fingerspelling
      - text: BISINDO
        ar_eg: لغة الإشارة الإندونيسية
        ar: لغة الإشارة الإندونيسية
        en: Indonesian Sign Language
    words: [bahasa isyarat, Tuli, juru bahasa isyarat, abjad jari, BISINDO]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مجتمع الصمّ في إندونيسيا بيفضّل يتسمّى إزاي؟
      ar: بأيّ اسم يفضّل مجتمع الصمّ في إندونيسيا أن يُسمّى؟
      en: What does Indonesia's Deaf community prefer to be called?
    options:
      - tunarungu
      - Tuli
      - bisu
    answer: 1
    explain:
      ar_eg: Tuli بحرف كبير بتعبّر عن هوية وثقافة ولغة، مش عن «عيب» طبي.
      ar: تعبّر Tuli بالحرف الكبير عن هوية وثقافة ولغة، لا عن «علّة» طبّية.
      en: Capital-T Tuli speaks of identity, culture and language, not a medical "defect".
    words: [Tuli]
  - id: e03
    type: listen
    text: Di pojok layar ada juru bahasa isyarat yang menerjemahkan berita.
    question:
      ar_eg: مين اللي في ركن الشاشة؟
      ar: من في ركن الشاشة؟
      en: Who is in the corner of the screen?
    options:
      - المذيع الأساسي.
      - مراسل في الشارع.
      - مترجم لغة الإشارة.
    answer: 2
    words: [juru bahasa isyarat]
  - id: e04
    type: fill_blank
    sentence: Saya belajar ___ supaya bisa mengeja nama saya dengan tangan.
    meaning:
      ar_eg: بتعلّم الحروف بالصوابع علشان أقدر أتهجّى اسمي بإيديّا.
      ar: أتعلّم التهجئة بالأصابع لأتمكّن من تهجئة اسمي بيديّ.
      en: I'm learning fingerspelling so I can spell my name with my hands.
    options: [abjad jari, BISINDO, Tuli]
    answers: [abjad jari]
    words: [abjad jari]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: BISINDO مين اللي طلّعها؟
      ar: من الذي أنشأ BISINDO؟
      en: Who created BISINDO?
    options:
      - مجتمع الصمّ نفسه.
      - وزارة التعليم في مصر.
      - شركة تليفونات.
    answer: 0
    words: [BISINDO, Tuli]
  - id: e06
    type: build_sentence
    source:
      ar_eg: لغة الإشارة فيها لهجات كمان.
      ar: للغة الإشارة لهجات أيضًا.
      en: Sign language has dialects too.
    answer: Bahasa isyarat juga punya dialek.
    distractors: [abjad, jari]
    words: [bahasa isyarat, dialek]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عايز أتعلّم لغة الإشارة الإندونيسية.
      ar: أريد أن أتعلّم لغة الإشارة الإندونيسية.
      en: I want to learn Indonesian Sign Language.
    answers:
      - Saya ingin belajar BISINDO.
      - Saya mau belajar BISINDO.
      - Saya ingin belajar bahasa isyarat Indonesia.
      - Saya mau belajar Bahasa Isyarat Indonesia.
    words: [BISINDO, bahasa isyarat]
  - id: e08
    type: speaking
    text: Juru bahasa isyarat itu membantu teman-teman Tuli mengikuti seminar.
    meaning:
      ar_eg: مترجم الإشارة ده بيساعد الصحاب الصمّ يتابعوا الندوة.
      ar: يساعد مترجم الإشارة الأصدقاءَ الصمّ على متابعة الندوة.
      en: The interpreter helps Deaf friends follow the seminar.
    words: [juru bahasa isyarat, Tuli]
  - id: e09
    type: dictation
    text: Dalam BISINDO, abjad jari memakai dua tangan.
    meaning:
      ar_eg: في الـ BISINDO، الحروف بالصوابع بتستعمل الإيدين الاتنين.
      ar: في BISINDO تُستعمل اليدان في التهجئة بالأصابع.
      en: In BISINDO, fingerspelling uses two hands.
    words: [BISINDO, abjad jari]
  - id: e10
    type: speaking
    text: Bahasa isyarat bukan bahasa tubuh biasa. Bahasa isyarat punya tata bahasa sendiri.
    meaning:
      ar_eg: لغة الإشارة مش مجرّد حركات جسم. ليها قواعدها الخاصة.
      ar: ليست لغة الإشارة مجرّد إيماءات، بل لها نحوها الخاصّ.
      en: Sign language isn't just body language. It has its own grammar.
    words: [bahasa isyarat, abjad jari]
dialogue:
  title: Tetangga Om Nus
  lines:
    - speaker: Om Nus
      text: Mohamed, ini Lince, tetangga saya. Dia Tuli. Coba sapa dia dengan abjad jari.
      ar_eg: يا محمد، دي لينسي جارتي. هي صمّا. جرّب تسلّم عليها بالحروف بالصوابع.
      ar: يا محمد، هذه لينسي جارتي، وهي صمّاء. جرّب أن تحيّيها بالتهجئة بالأصابع.
      en: Mohamed, this is Lince, my neighbour. She's Deaf. Try greeting her with fingerspelling.
    - speaker: Mohamed
      text: Saya baru tahu dua huruf, Om. Gimana kalau saya salah?
      ar_eg: أنا لسه عارف حرفين بس يا عمّو. ولو غلطت؟
      ar: لا أعرف إلا حرفين يا عمّ، فماذا لو أخطأت؟
      en: I only know two letters, Om. What if I get it wrong?
    - speaker: Om Nus
      text: Nggak apa-apa. Lince bilang, dia senang ada orang yang mau belajar BISINDO.
      ar_eg: ولا يهمّك. لينسي بتقول إنها مبسوطة إن فيه حد عايز يتعلّم BISINDO.
      ar: لا بأس، تقول لينسي إنّها تسعد بمن يريد تعلّم BISINDO.
      en: It's fine. Lince says she's happy someone wants to learn BISINDO.
    - speaker: Mohamed
      text: Kalo gitu, besok saya ikut kelas bahasa isyarat bareng Lince.
      ar_eg: يبقى بكرة هحضر حصة لغة إشارة مع لينسي.
      ar: إذن سأحضر غدًا درسًا في لغة الإشارة مع لينسي.
      en: Then tomorrow I'll join a sign language class with Lince.
