schema: kabar.lesson/v1
id: bipa7.u02.l13
language: id
title: Presentasi kelompok
can_do:
  ar_eg: تقدّم عرض مع فريقك وتسلّم الكلمة لزميلك بشكل رسمي.
  ar: أن تقدّم عرضًا مع فريقك وتسلّم الكلمة لزميلك بأسلوب رسميّ.
  en: Give a presentation as a team and hand over to a teammate formally.
slides:
  - title: Sekarang giliran rekan saya
    body:
      ar_eg: |
        في العرض الجماعي كل pembicara (متكلّم) بياخد جزء. لما تخلّص، سلّم الكلمة لـ rekan satu tim (زميلك في الفريق):
        - Bagian pertama akan saya paparkan. ← أنا هعرض الجزء الأول.
        - Selanjutnya, rekan saya, Sinta, akan memaparkan penyebabnya. ← بعد كده زميلتي سينتا هتعرض الأسباب.
        - Terima kasih, Mohamed. Saya akan beralih ke solusi. ← شكرًا يا محمد. هنقل للحلول.
        وفي الآخر pembicara الأخير بيلخّص: Perlu digarisbawahi bahwa...
      ar: |
        في العرض الجماعيّ يتولّى كلّ pembicara (متحدّث) جزءًا. وحين تفرغ سلّم الكلمة إلى rekan satu tim (زميلك في الفريق):
        - Bagian pertama akan saya paparkan. ← سأعرض الجزء الأوّل.
        - Selanjutnya, rekan saya, Sinta, akan memaparkan penyebabnya. ← ثمّ تعرض زميلتي سينتا الأسباب.
        - Terima kasih, Mohamed. Saya akan beralih ke solusi. ← شكرًا يا محمد، أنتقل إلى الحلول.
        وفي الختام يلخّص آخر pembicara: Perlu digarisbawahi bahwa...
      en: |
        In a team presentation each pembicara (speaker) takes a part. When you finish, hand over to your rekan satu tim (teammate):
        - Bagian pertama akan saya paparkan. → I'll present the first part.
        - Selanjutnya, rekan saya, Sinta, akan memaparkan penyebabnya. → Next, my colleague Sinta will present the causes.
        - Terima kasih, Mohamed. Saya akan beralih ke solusi. → Thank you, Mohamed. I'll move on to solutions.
        At the end the last pembicara sums up: Perlu digarisbawahi bahwa...
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الـ «rekan satu tim» يبقى مين؟
      ar: من هو «rekan satu tim»؟
      en: Who is a "rekan satu tim"?
    options:
      - المدرّس اللي بيدّي الدرجة.
      - واحد من الجمهور.
      - زميلك في نفس الفريق.
    answer: 2
    words: [rekan satu tim]
  - id: e02
    type: listen
    text: Terima kasih, Sinta. Sekarang saya akan beralih ke bagian solusi.
    question:
      ar_eg: المتكلّم هيعمل إيه دلوقتي؟
      ar: ماذا سيفعل المتحدّث الآن؟
      en: What will the speaker do now?
    options:
      - هينقل لجزء الحلول.
      - هيرجع للمقدّمة.
      - هيخلّص العرض.
    answer: 0
    words: [beralih]
  - id: e03
    type: fill_blank
    sentence: Setiap ___ mendapat waktu lima menit di depan kelas.
    meaning:
      ar_eg: كل متكلّم بياخد خمس دقايق قدّام الفصل.
      ar: يحصل كلّ متحدّث على خمس دقائق أمام الصفّ.
      en: Each speaker gets five minutes in front of the class.
    options: [pembicara, pembawa acara, pesisir]
    answers: [pembicara]
    words: [pembicara]
  - id: e04
    type: build_sentence
    source:
      ar_eg: زميلي في الفريق هيعرض الأسباب.
      ar: سيعرض زميلي في الفريق الأسباب.
      en: My teammate will present the causes.
    answer: Rekan satu tim saya akan memaparkan penyebabnya.
    distractors: [pembicara, beralih]
    words: [rekan satu tim, memaparkan, penyebab]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: آخر pembicara بيقول إيه علشان يلخّص النقطة المهمة؟
      ar: ماذا يقول آخر pembicara ليبرز النقطة الأهمّ؟
      en: What does the last pembicara say to stress the key point?
    options:
      - Saya lapar.
      - Perlu digarisbawahi bahwa bakau melindungi pesisir.
      - Mana mikrofonnya?
    answer: 1
    words: [pembicara, perlu digarisbawahi]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا أول متكلّم، وزميلتي في الفريق هتكمّل.
      ar: أنا المتحدّث الأوّل، وستكمل زميلتي في الفريق.
      en: I'm the first speaker, and my teammate will continue.
    answers:
      - Saya pembicara pertama, dan rekan satu tim saya akan melanjutkan.
      - Saya pembicara pertama, lalu rekan satu tim saya akan melanjutkan.
      - Saya pembicara pertama dan rekan satu tim saya akan meneruskan.
      - Saya adalah pembicara pertama, dan rekan satu tim saya akan melanjutkan.
    words: [pembicara, rekan satu tim]
  - id: e07
    type: speaking
    text: Yang saya hormati Bapak Yance dan teman-teman, kami akan memaparkan tentang hutan bakau.
    meaning:
      ar_eg: حضرة الأستاذ يانسي والزملاء المحترمين، هنعرض عن غابات المانجروف.
      ar: حضرةَ الأستاذ يانسي والزملاء الكرام، سنعرض موضوع غابات المانغروف.
      en: Respected Pak Yance and friends, we will present on mangrove forests.
    words: [yang saya hormati, memaparkan, bakau]
  - id: e08
    type: dictation
    text: Pembicara kedua menjelaskan penyebab abrasi.
    meaning:
      ar_eg: المتكلّم التاني شرح سبب تآكل الشط.
      ar: شرح المتحدّث الثاني سبب تآكل الساحل.
      en: The second speaker explained the cause of erosion.
    words: [pembicara, penyebab, abrasi]
  - id: e09
    type: speaking
    text: Terima kasih kepada rekan satu tim saya. Sekarang saya beralih ke kesimpulan.
    meaning:
      ar_eg: شكرًا لزميلي في الفريق. دلوقتي هنقل للخلاصة.
      ar: شكرًا لزميلي في الفريق، وأنتقل الآن إلى الخلاصة.
      en: Thanks to my teammate. Now I'll move on to the conclusion.
    words: [rekan satu tim, beralih]
  - id: e10
    type: match_pairs
    pairs:
      - text: lahar
        ar_eg: سيل طين بركاني
        ar: سيل طيني بركاني
        en: lahar, volcanic mudflow
      - text: lempeng
        ar_eg: لوح (تكتوني)
        ar: صفيحة (تكتونية)
        en: (tectonic) plate
      - text: siklon
        ar_eg: إعصار
        ar: إعصار مداري
        en: (tropical) cyclone
      - text: bioluminesensi
        ar_eg: توهّج حيوي (كائنات بتنوّر)
        ar: تلألؤ حيوي
        en: bioluminescence
    words: [lahar, lempeng, siklon, bioluminesensi]
dialogue:
  title: Latihan sebelum kelas
  lines:
    - speaker: Pak Yance
      text: Kelompok kalian ada tiga pembicara, ya. Siapa yang mulai?
      ar_eg: مجموعتكم فيها تلات متكلّمين، صح؟ مين هيبدأ؟
      ar: في مجموعتكم ثلاثة متحدّثين، صحيح؟ من سيبدأ؟
      en: Your group has three speakers, right? Who's starting?
    - speaker: Mohamed
      text: Saya, Pak. Saya memaparkan fenomenanya, lalu rekan satu tim saya, Sinta, menjelaskan penyebabnya.
      ar_eg: أنا يا أستاذ. هعرض الظاهرة، وبعدين زميلتي سينتا تشرح الأسباب.
      ar: أنا يا أستاذ. أعرض الظاهرة، ثمّ تشرح زميلتي سينتا أسبابها.
      en: Me, sir. I'll present the phenomenon, then my teammate Sinta explains the causes.
    - speaker: Pak Yance
      text: Bagus. Jangan lupa menyebut nama rekanmu saat beralih.
      ar_eg: حلو. ماتنساش تقول اسم زميلك وإنت بتسلّمله.
      ar: جيّد، ولا تنسَ ذكر اسم زميلك عند الانتقال.
      en: Good. Don't forget to say your teammate's name when you hand over.
    - speaker: Mohamed
      text: Baik. "Selanjutnya, rekan saya, Sinta, akan memaparkan penyebabnya."
      ar_eg: تمام. «بعد كده، زميلتي سينتا هتعرض الأسباب.»
      ar: حسنًا. «وبعد ذلك تعرض زميلتي سينتا الأسباب.»
      en: Okay. "Next, my colleague Sinta will present the causes."
