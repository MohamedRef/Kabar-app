  - id: e10
    type: speaking
    text: Setelah piknik sehat, kita tetap makan bakso!
    meaning:
      ar_eg: بعد الرحلة الصحية، برضه هناكل بكسو!
      ar: بعد النزهة الصحية، سنأكل الباكسو رغم ذلك!
      en: After a healthy picnic, we're still having bakso!
    words: [piknik, bakso]
dialogue:
  lines:
    - speaker: Bu Lestari
      text: Hari Minggu kita piknik di tepi sungai, ya. Saya bawa salad buah.
      ar_eg: يوم الحد هنعمل رحلة على النهر. أنا هجيب سلطة فواكه.
      ar: يوم الأحد نتنزّه على ضفة النهر. سأحضر سلطة فواكه.
      en: On Sunday let's picnic by the river. I'll bring fruit salad.
    - speaker: Mohamed
      text: Saya bawa jamu herbal sama air lemon, Bu. Vitaminnya banyak!
      ar_eg: وأنا هجيب جامو أعشاب ومية بالليمون. فيتامينات كتير!
      ar: وسأحضر مشروب أعشاب وماء بالليمون. فيهما فيتامينات كثيرة!
      en: I'll bring herbal jamu and lemon water. Lots of vitamins!
    - speaker: Rina
      text: Wah, sehat banget. Aku lagi ngitung kalori, nih.
      ar_eg: الله، صحي أوي. أنا بعد السعرات اليومين دول.
      ar: رائع، صحي جدًا. أنا أحسب السعرات هذه الأيام.
      en: Wow, so healthy. I'm counting calories at the moment.
    - speaker: Bu Lestari
      text: Tapi di dekat sungai ada penjual bakso terkenal...
      ar_eg: بس جنب النهر فيه بياع بكسو مشهور...
      ar: لكن قرب النهر بائع باكسو مشهور...
      en: But there's a famous bakso seller near the river...
    - speaker: Rina
      text: Ya udah, deh, kalori dihitung mulai Senin aja!
      ar_eg: خلاص، السعرات نعدها من يوم الاتنين!
      ar: حسنًا، نحسب السعرات ابتداءً من الاثنين!
      en: Fine, calorie counting starts on Monday!
