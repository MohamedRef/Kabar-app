      ar: ما اسم كرات اللحم في الحساء التي تُباع على العربات في كل مكان؟
      en: What are the meatballs in broth sold from carts everywhere?
    options: [salad, piknik, bakso]
    answer: 2
    explain:
      ar_eg: bakso = كور لحمة في شوربة.
      ar: bakso = كرات لحم في حساء.
      en: bakso = meatballs in broth.
