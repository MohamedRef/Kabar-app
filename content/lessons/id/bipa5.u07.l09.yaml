language: id
title: Ulangan Unit 7
can_do:
  ar_eg: تتكلم عن الأكل كهوية وعن عادات الأكل والتجارة على النهر.
  ar: أن تتحدّث عن الطعام بوصفه هويّة، وعن آداب الأكل وتجارة النهر.
  en: Talk about food as identity, eating customs and river trade.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: perdagangan
        ar_eg: تجارة
        ar: تجارة
        en: trade
      - text: rempah
        ar_eg: بهارات
        ar: توابل
        en: spices
      - text: terapung
        ar_eg: عايم
        ar: عائم
        en: floating
      - text: identitas
        ar_eg: هوية
        ar: هويّة
        en: identity
      - text: kebiasaan
        ar_eg: عادة
        ar: عادة
        en: custom
    words: [perdagangan, rempah, terapung, identitas, kebiasaan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الاسم من rumah اللي معناه «مجمّع سكني»؟
      ar: ما الاسم من rumah بمعنى «مجمّع سكني»؟
      en: Which noun from rumah means "housing estate"?
    options: [rumahan, perumahan, kerumahan]
    answer: 1
    words: [perumahan]
  - id: e03
    type: fill_blank
    sentence: Soto Banjar ___ sejarah perdagangan di kota ini.
    meaning:
      ar_eg: سوتو بانجار بتعكس تاريخ التجارة في المدينة دي.
      ar: تعكس سوتو بانجار تاريخ التجارة في هذه المدينة.
      en: Soto Banjar reflects the history of trade in this city.
    options: [mencerminkan, menukar, berkumpul]
    answers: [mencerminkan]
    words: [mencerminkan]
  - id: e04
    type: listen
    text: Soto Banjar memakai kayu manis karena pengaruh pedagang Arab.
    question:
      ar_eg: ليه سوتو بانجار فيها قرفة؟
      ar: لماذا في سوتو بانجار قرفة؟
      en: Why does soto Banjar have cinnamon?
    options:
      - عشان رخيصة.
      - عشان الأطفال بيحبوها.
      - بسبب تأثير التجار العرب.
    answer: 2
    words: [pedagang, kayu manis]
  - id: e05
    type: build_sentence
    source:
      ar_eg: التجار بيتجمعوا على المراكب قبل الفجر.
      ar: يجتمع التجّار على القوارب قبل الفجر.
      en: The traders gather on boats before dawn.
    answer: Para pedagang berkumpul di perahu sebelum subuh.
    distractors: [menukar, terapung]
    words: [berkumpul, perahu, pedagang]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الأكل مش مجرد أكل، ده جزء من هويتنا.
      ar: ليس الطعام مجرّد طعام، بل جزء من هويّتنا.
      en: Food is more than food; it's part of our identity.
    answers:
      - Makanan bukan sekadar makanan, tetapi bagian dari identitas kita.
      - Makanan bukan sekadar makanan, melainkan bagian dari identitas kita.
      - Makanan bukan sekadar makanan, tapi bagian dari identitas kita.
      - Makanan bukan sekadar makanan. Makanan adalah bagian dari identitas kita.
    words: [bukan sekadar, identitas]
  - id: e07
    type: translate
    direction: from_target
    source_text: Makan dengan tangan kiri dianggap tidak sopan.
    answers_meaning:
      ar_eg:
        - الأكل بالإيد الشمال بيتعتبر قلة ذوق.
        - إنك تاكل بالشمال ده بيتعتبر مش مؤدب.
      ar:
        - يُعدّ الأكل باليد اليسرى قلّة أدب.
        - الأكل باليسرى يُعتبر غير لائق.
      en:
        - Eating with the left hand is considered impolite.
        - Eating with your left hand is seen as rude.
    words: [dianggap]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: «pengaruh» معناها إيه؟
      ar: ما معنى «pengaruh»؟
      en: What does "pengaruh" mean?
    options: [تأثير, بهارات, تاجر]
    answer: 0
    words: [pengaruh]
  - id: e09
    type: dictation
    text: Tradisi pasar terapung sudah ada sejak zaman kesultanan.
    meaning:
      ar_eg: عادة السوق العايم موجودة من أيام السلطنة.
      ar: تقليد السوق العائم قائم منذ عهد السلطنة.
      en: The floating market tradition dates back to the sultanate.
    words: [tradisi, terapung]
  - id: e10
    type: speaking
    text: Adab makan di Mesir dan Indonesia punya banyak persamaan.
    meaning:
      ar_eg: آداب الأكل في مصر وإندونيسيا فيها حاجات مشتركة كتير.
      ar: لآداب الطعام في مصر وإندونيسيا أوجه شبه كثيرة.
      en: Table manners in Egypt and Indonesia have a lot in common.
    words: [adab]
  - id: e11
    type: fill_blank
    sentence: Kuah ketupat Kandangan kental dan gurih karena ___.
    meaning:
      ar_eg: مرقة كتوبات كاندانجان تقيلة ومسبّكة بسبب لبن جوز الهند.
      ar: مرق كتوبات كاندانغان كثيف غنيّ بفضل حليب جوز الهند.
      en: Ketupat Kandangan's broth is thick and rich because of the coconut milk.
    options: [santan, resep, label halal]
    answers: [santan]
    words: [santan]
  - id: e12
    type: multiple_choice
    question_meaning:
      ar_eg: «Dalam selamatan itu, tuan rumah menghidangkan masakan turun-temurun.» معناها إيه؟
      ar: ما معنى «Dalam selamatan itu, tuan rumah menghidangkan masakan turun-temurun.»؟
      en: What does "Dalam selamatan itu, tuan rumah menghidangkan masakan turun-temurun." mean?
    options:
      - في العزومة، صاحب البيت قدّم أكل متوارث في العيلة.
      - في العزومة، صاحب البيت طلب أكل من برا.
      - في العزومة، الضيوف هما اللي طبخوا.
    answer: 0
    words: [selamatan, menghidangkan, turun-temurun]
dialogue:
  title: Perahu terakhir di Lok Baintan
  lines:
    - speaker: Mohamed
      text: Bu, saya mau beli kue ini. Namanya apa?
      ar_eg: يا حاجة، عايز أشتري الكيكة دي. اسمها إيه؟
      ar: يا خالة، أريد شراء هذه الحلوى. ما اسمها؟
      en: Ma'am, I'd like to buy this cake. What's it called?
    - speaker: Bu Hamidah
      text: Ini kue bingka, kue khas Banjar. Biasanya dimakan waktu buka puasa.
      ar_eg: دي كيكة بينجكا، كيكة بانجارية. عادةً بتتاكل على الفطار في رمضان.
      ar: هذه حلوى بينغكا البانجارية، وتؤكل عادة عند الإفطار في رمضان.
      en: This is bingka, a Banjar speciality. It's usually eaten when breaking the fast.
    - speaker: Mohamed
      text: Wah, seperti kunafa di Mesir. Kue ini bagian dari identitas Ramadan di sini, ya?
      ar_eg: يا سلام، زي الكنافة في مصر. الكيكة دي جزء من هوية رمضان هنا، صح؟
      ar: مثل الكنافة في مصر! هذه الحلوى جزء من هويّة رمضان هنا، أليس كذلك؟
      en: Oh, like kunafa in Egypt. This cake is part of Ramadan's identity here, right?
    - speaker: Bu Hamidah
      text: Betul sekali. Makanan memang bukan sekadar makanan.
      ar_eg: بالظبط. الأكل فعلًا مش مجرد أكل.
      ar: تمامًا. الطعام حقًّا ليس مجرّد طعام.
      en: Exactly. Food really is more than food.
souvenir:
  id: bipa5.u07.souvenir
  title: Pasar Terapung Lok Baintan
  note:
    ar_eg: في لوك بايتان، على نهر مارتابورا جنب بانجارماسين، الستات البياعين بيقعدوا في مراكب خشب صغيرة اسمها jukung من قبل الفجر، وبيبيعوا خضار وفاكهة وكيك. السوق ده بقاله قرون، من أيام سلطنة بانجار. وسوتو بانجار بتحكي نفس الحكاية، ففيها طريقة في البهارات اتعلموها من التجار العرب والهنود، وحاجات صيني وهولندي كمان.
    ar: في لوك بايتان، على نهر مارتابورا قرب بانجارماسين، تجلس البائعات منذ ما قبل الفجر في قوارب خشبية صغيرة تسمّى jukung، يبعن الخضر والفاكهة والحلوى. ويرجع هذا السوق إلى قرون، منذ عهد سلطنة بانجار. وتروي سوتو بانجار الحكاية نفسها، ففيها طريقة في التوابل أخذوها عن التجّار العرب والهنود ولمسات صينية وهولندية.
    en: At Lok Baintan, on the Martapura river near Banjarmasin, women sellers sit in small wooden boats called jukung from before dawn, selling vegetables, fruit and cakes. The market goes back centuries, to the Banjar Sultanate. Soto Banjar tells the same story, with a way of spicing learned from Arab and Indian traders and Chinese and Dutch touches.
