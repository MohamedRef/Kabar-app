  - id: e09
    type: translate
    direction: from_target
    source_text: Salad ini banyak vitamin dan rendah kalori.
    answers_meaning:
      ar_eg: [السلطة دي فيها فيتامينات كتير وسعرات قليلة, السلطة دي مليانة فيتامينات وقليلة السعرات]
