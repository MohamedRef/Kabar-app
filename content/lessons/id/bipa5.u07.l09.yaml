schema: kabar.lesson/v1
id: bipa5.u07.l09
language: id
title: Piknik sehat di tepi sungai
can_do:
  ar_eg: 'تتكلم عن رحلة أكل صحي: الأعشاب والكبسولات والليمون والسلطة والسعرات، ووسط ده كله البكسو، والأمن الغذائي.'
  ar: 'أن تتحدث عن نزهة بطعام صحي: الأعشاب والكبسولات والليمون والسلطة والسعرات، والباكسو أيضًا، والأمن الغذائي.'
  en: 'Talk on a healthy picnic: herbs, capsules, lemon, salad and calories, bakso anyway, and food security.'
slides:
  - title: Makan sehat
    body:
      ar_eg: |
        piknik = رحلة، نزهة بأكل في الهوا الطلق.
        herbal = بالأعشاب (jamu herbal = مشروب أعشاب تقليدي)، kapsul = كبسولة (kapsul vitamin = كبسولة فيتامين)، kalori = سعرات.
        lemon = ليمون أصفر (jeruk nipis = ليمون أخضر صغير)، salad = سلطة.
        bakso = كور لحمة في شوربة (أكلة شعبية جدًا).
        pangan = الغذا كموضوع رسمي: ketahanan pangan = الأمن الغذائي.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: banget = sekali، aku = saya، ngitung = menghitung، udah = sudah، aja = saja.
      ar: |
        piknik = نزهة مع طعام في الهواء الطلق.
        herbal = عشبي (jamu herbal = مشروب أعشاب تقليدي)، kapsul = كبسولة (kapsul vitamin = كبسولة فيتامينات)، kalori = سعرات حرارية.
        lemon = ليمون أصفر (jeruk nipis = ليمون أخضر صغير)، salad = سلطة.
        bakso = كرات لحم في حساء (طبق شعبي جدًا).
        pangan = الغذاء (مصطلح رسمي): ketahanan pangan = الأمن الغذائي.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: banget = sekali، aku = saya، ngitung = menghitung، udah = sudah، aja = saja.
      en: |
        piknik = picnic.
        herbal = herbal (jamu herbal = traditional herbal drink), kapsul = capsule (kapsul vitamin = vitamin capsule), kalori = calories.
        lemon = lemon (jeruk nipis = lime), salad = salad.
        bakso = meatballs in broth (a hugely popular dish).
        pangan = food (formal, policy word): ketahanan pangan = food security.
        The dialogue uses street forms; the formal ones are beside them: banget = sekali, aku = saya, ngitung = menghitung, udah = sudah, aja = saja.
    examples:
      - text: Hari Minggu kami piknik di tepi Sungai Martapura.
        ar_eg: يوم الحد عملنا رحلة على ضفة نهر مارتابورا.
        ar: يوم الأحد تنزّهنا على ضفة نهر مارتابورا.
        en: On Sunday we had a picnic by the Martapura River.
      - text: Salad buah ini banyak vitamin dan rendah kalori.
        ar_eg: سلطة الفاكهة دي فيها فيتامينات كتير وسعرات قليلة.
        ar: سلطة الفاكهة هذه غنية بالفيتامينات قليلة السعرات.
        en: This fruit salad is high in vitamins and low in calories.
      - text: Pemerintah membicarakan ketahanan pangan di Kalimantan.
        ar_eg: الحكومة بتتكلم عن الأمن الغذائي في كاليمانتان.
        ar: تناقش الحكومة الأمن الغذائي في كاليمانتان.
        en: The government is discussing food security in Kalimantan.
