schema: kabar.lesson/v1
id: bipa7.u03.l04
language: id
title: Danau Kelimutu
can_do:
  ar_eg: تحكي الأسطورة اللي ورا بحيرات كيليموتو وتشرح العلم اللي بيغيّر لونها.
  ar: أن تروي الأسطورة الكامنة وراء بحيرات كيليموتو وتشرح العلم الذي يغيّر ألوانها.
  en: Retell the legend behind the Kelimutu lakes and explain the science of their colours.
slides:
  - title: Tiga danau, tiga warna
    body:
      ar_eg: |
        فوق جبل كيليموتو البركاني في جزيرة فلوريس فيه تلات kawah (فوّهة بركان) فيها تلات بحيرات. اسمهم «Danau tiga warna» (بحيرة الـ tiga warna = التلات ألوان).
        - شعب الليو بيقول إن الـ arwah (أرواح الميتين) بتروح هناك: بحيرة للعواجيز، بحيرة للشباب والبنات، وبحيرة للناس الوحشين.
        - العلم بيقول: المية فيها mineral (معادن) وغازات من البركان، فلونها berubah warna (بيتغيّر): أخضر، أزرق، أحمر، بني، وأوقات أسود.
        صورة البحيرات كانت على ورقة الـ ٥٠٠٠ روبية القديمة.
        - في الكلام: tapi = tetapi، gara-gara = karena.
        - kok = استغراب (إزاي؟ ليه كده؟). كلمات صغيرة بتدّي الجملة إحساس، ومن غيرها الجملة صح برضه.
      ar: |
        على قمّة بركان كيليموتو في جزيرة فلوريس ثلاث kawah (فوّهات) فيها ثلاث بحيرات، تُسمّى «Danau tiga warna» (بحيرة الـ tiga warna = الألوان الثلاثة).
        - يعتقد شعب الليو أنّ الـ arwah (أرواح الموتى) تذهب إليها: بحيرة للشيوخ، وبحيرة للشبّان والفتيات، وبحيرة للأشرار.
        - ويقول العلم إنّ في الماء mineral (معادن) وغازات بركانية، فيـ berubah warna (يتغيّر لونه): أخضر وأزرق وأحمر وبنّيّ، وأسود أحيانًا.
        وقد ظهرت البحيرات على ورقة الخمسة آلاف روبية القديمة.
        - في الكلام اليومي: tapi = tetapi، gara-gara = karena.
        - kok = تعجّب (كيف؟ لماذا هكذا؟). أدوات صغيرة تلوّن الجملة، والجملة صحيحة بدونها.
      en: |
        On top of Kelimutu volcano on Flores there are three kawah (craters) holding three lakes, called "Danau tiga warna" (tiga warna = three colours).
        - The Lio people say the arwah (spirits of the dead) go there: one lake for the old, one for young men and women, one for wicked people.
        - Science says the water holds mineral (minerals) and volcanic gas, so it berubah warna (changes colour): green, blue, red, brown, sometimes black.
        The lakes appeared on the old 5,000-rupiah note.
        - In speech: tapi = tetapi, gara-gara = karena.
        - kok = surprise (how come?). Small particles that add feeling; the sentence is correct without them.
    examples:
      - text: Menurut orang Lio, arwah orang tua beristirahat di danau ini.
        ar_eg: على حسب شعب الليو، أرواح العواجيز بترتاح في البحيرة دي.
        ar: بحسب شعب الليو، تستريح أرواح الشيوخ في هذه البحيرة.
        en: According to the Lio, the spirits of the elderly rest in this lake.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kawah
        ar_eg: فوّهة بركان
        ar: فوّهة
        en: crater
      - text: arwah
        ar_eg: أرواح الميتين
        ar: أرواح الموتى
        en: spirits of the dead
      - text: berubah warna
        ar_eg: لونه بيتغيّر
        ar: يتغيّر لونه
        en: to change colour
      - text: mineral
        ar_eg: معادن
        ar: معادن
        en: minerals
      - text: tiga warna
        ar_eg: تلات ألوان
        ar: ثلاثة ألوان
        en: three colours
    words: [kawah, arwah, berubah warna, mineral, tiga warna]
  - id: e02
    type: listen
    text: Di puncak Kelimutu ada tiga kawah, dan setiap kawah berisi danau.
    question:
      ar_eg: إيه اللي فوق جبل كيليموتو؟
      ar: ما الذي على قمّة كيليموتو؟
      en: What is at the top of Kelimutu?
    options:
      - مدينة صغيرة.
      - تلات فوّهات، في كل واحدة بحيرة.
      - شلّال كبير.
    answer: 1
    words: [kawah]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: على حسب العلم، ليه مية البحيرات لونها بيتغيّر؟
      ar: لماذا يتغيّر لون ماء البحيرات بحسب العلم؟
      en: According to science, why does the lakes' water change colour?
    options:
      - علشان السيّاح بيرموا فيها ألوان.
      - علشان القمر.
      - علشان المعادن والغازات اللي طالعة من البركان.
    answer: 2
    words: [berubah warna, mineral]
  - id: e04
    type: fill_blank
    sentence: Orang Lio percaya ___ leluhur tinggal di danau itu.
    meaning:
      ar_eg: شعب الليو بيآمن إن أرواح الأجداد عايشة في البحيرة دي.
      ar: يؤمن شعب الليو بأنّ أرواح الأسلاف تسكن تلك البحيرة.
      en: The Lio believe the spirits of their ancestors live in that lake.
    options: [arwah, kawah, mineral]
    answers: [arwah]
    words: [arwah]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: البحيرات دي كانت مرسومة على إيه؟
      ar: على أيّ شيء رُسمت هذه البحيرات؟
      en: What were these lakes printed on?
    options:
      - ورقة ٥٠٠٠ روبية قديمة.
      - علم إندونيسيا.
      - طابع بريد مصري.
    answer: 0
    words: [tiga warna]
  - id: e06
    type: build_sentence
    source:
      ar_eg: لون البحيرة اتغيّر من أزرق لأخضر.
      ar: تغيّر لون البحيرة من الأزرق إلى الأخضر.
      en: The lake changed colour from blue to green.
    answer: Danau itu berubah warna dari biru menjadi hijau.
    distractors: [kawah, arwah]
    words: [berubah warna]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المية فيها معادن كتير من البركان.
      ar: في الماء معادن كثيرة من البركان.
      en: The water holds a lot of minerals from the volcano.
    answers:
      - Airnya mengandung banyak mineral dari gunung berapi.
      - Air itu mengandung banyak mineral dari gunung api.
      - Airnya berisi banyak mineral dari gunung berapi.
      - Di dalam air itu ada banyak mineral dari gunung berapi.
    words: [mineral]
  - id: e08
    type: speaking
    text: Danau tiga warna itu ada di dalam kawah Gunung Kelimutu.
    meaning:
      ar_eg: بحيرة التلات ألوان جوّه فوّهة جبل كيليموتو.
      ar: بحيرة الألوان الثلاثة داخل فوّهة جبل كيليموتو.
      en: The three-coloured lake lies inside Mount Kelimutu's crater.
    words: [tiga warna, kawah]
  - id: e09
    type: dictation
    text: Setiap danau bisa berubah warna karena mineral di dalam air.
    meaning:
      ar_eg: كل بحيرة ممكن لونها يتغيّر بسبب المعادن اللي في المية.
      ar: قد يتغيّر لون كلّ بحيرة بسبب المعادن في مائها.
      en: Each lake can change colour because of minerals in the water.
    words: [berubah warna, mineral]
  - id: e10
    type: speaking
    text: Ada danau untuk arwah orang tua, dan ada danau untuk arwah anak muda.
    meaning:
      ar_eg: فيه بحيرة لأرواح العواجيز، وفيه بحيرة لأرواح الشباب.
      ar: هناك بحيرة لأرواح الشيوخ، وأخرى لأرواح الشباب.
      en: There's a lake for the spirits of the old, and one for the spirits of the young.
    words: [arwah, tiga warna]
dialogue:
  title: Foto dari Flores
  lines:
    - speaker: Mama Ruth
      text: Lihat foto ini, Mohamed. Adik saya kirim dari Ende. Danau Kelimutu.
      ar_eg: بص على الصورة دي يا محمد. أختي بعتتها من إندي. بحيرة كيليموتو.
      ar: انظر إلى هذه الصورة يا محمد، أرسلتها أختي من إندي. بحيرة كيليموتو.
      en: Look at this photo, Mohamed. My sister sent it from Ende. Lake Kelimutu.
    - speaker: Mohamed
      text: Kok warnanya beda-beda, Mama? Yang satu hijau, yang satu hampir hitam.
      ar_eg: ليه ألوانها مختلفة يا ماما؟ واحدة خضرا، وواحدة تقريبًا سودا.
      ar: لماذا تختلف ألوانها يا ماما؟ واحدة خضراء والأخرى تكاد تكون سوداء.
      en: Why are the colours different, Mama? One's green, one's almost black.
    - speaker: Mama Ruth
      text: Orang Lio bilang, itu rumah arwah. Tapi guru IPA bilang, itu gara-gara mineral.
      ar_eg: شعب الليو بيقولوا إنها بيت الأرواح. بس مدرّس العلوم بيقول إنها بسبب المعادن.
      ar: يقول شعب الليو إنّها مسكن الأرواح، أمّا معلّم العلوم فيقول إنّ السبب المعادن.
      en: The Lio say it's the home of spirits. But the science teacher says it's minerals.
    - speaker: Mohamed
      text: Jadi ada dua cerita, mitos dan ilmu. Dua-duanya menarik!
      ar_eg: يبقى فيه حكايتين، أسطورة وعلم. الاتنين حلوين!
      ar: إذن هناك روايتان، الأسطورة والعلم، وكلتاهما شائقة!
      en: So there are two stories, myth and science. Both are fascinating!
