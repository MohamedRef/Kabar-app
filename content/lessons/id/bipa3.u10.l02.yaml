schema: kabar.lesson/v1
id: bipa3.u10.l02
language: id
title: Rencananya …
can_do:
  ar_eg: تحكي خططك ونيتك (rencananya، berencana، berniat).
  ar: أن تعبّر عن خططك ونيّتك (rencananya، berencana، berniat).
  en: Describe your plans and intentions (rencananya, berencana, berniat).
slides:
  - title: Rencana, berencana, rencananya
    body:
      ar_eg: |
        rencana اسم (خطة). الفعل berencana (بيخطط إنه). وRencananya, … = الخطة إن…
        غلط مشهور: «Saya rencana pergi». الصح Saya berencana pergi.
      ar: |
        rencana اسم (خطة)، والفعل berencana (يعتزم / يخطط)، وRencananya, … = الخطةُ أنّ…
        ولا يقال «Saya rencana pergi»، بل Saya berencana pergi.
      en: |
        rencana is a noun (plan). The verb is berencana (to plan to). Rencananya, … = The plan is …
        Common mistake: «Saya rencana pergi». Say Saya berencana pergi.
    grammar: id.time.future-plans
    examples:
      - text: Rencananya, kami naik feri ke Sumbawa besok pagi.
        ar_eg: الخطة إننا ناخد العبّارة لسومباوا بكرة الصبح.
        ar: نعتزم ركوب العبّارة إلى سومباوا صباح الغد.
        en: The plan is to take the ferry to Sumbawa tomorrow morning.
      - text: Tahun depan saya berencana belajar di Yogyakarta.
        ar_eg: السنة الجاية بخطط أدرس في يوجياكارتا.
        ar: أخطط للدراسة في يوجياكرتا العام القادم.
        en: Next year I'm planning to study in Yogyakarta.
  - title: Berniat, cuti
    body:
      ar_eg: |
        berniat جاية من niat = «نيّة»، يعني «ناوي» بالظبط! وطبعًا insya Allah بتيجي مع الخطط زينا.
        وcuti = إجازة من الشغل (أجازة سنوية مثلًا).
      ar: |
        berniat من niat ← «نيّة»، أي «ينوي». وتُقال insya Allah مع الخطط كما نقول.
        وcuti = إجازة من العمل.
      en: |
        berniat comes from niat ← Arabic «نيّة» (intention): "to intend to". And insya Allah goes with plans, just as in Arabic.
        cuti = leave, time off work.
    grammar: id.time.future-plans
    examples:
      - text: Saya berniat mendaki Gunung Rinjani.
        ar_eg: أنا ناوي أطلع جبل رينجاني.
        ar: أنوي تسلّق جبل رينجاني.
        en: I intend to climb Mount Rinjani.
      - text: Bulan depan saya cuti seminggu.
        ar_eg: الشهر الجاي واخد أجازة أسبوع.
        ar: سآخذ إجازة أسبوعًا الشهر القادم.
        en: Next month I'm taking a week off.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rencana
        ar_eg: خطة
        ar: خطة
        en: plan
      - text: berencana
        ar_eg: يخطط إنه
        ar: يعتزم / يخطط لـ
        en: to plan to
      - text: berniat
        ar_eg: ينوي
        ar: ينوي
        en: to intend to
      - text: cuti
        ar_eg: أجازة (من الشغل)
        ar: إجازة من العمل
        en: leave, time off work
      - text: mendaki
        ar_eg: يطلع جبل
        ar: يتسلّق (جبلًا)
        en: to climb, to hike up
    words: [rencana, berencana, berniat, cuti, mendaki]
  - id: e02
    type: multiple_choice
    question: Saya ___ pergi ke Sumbawa.
    options: [rencana, berencana, rencananya]
    answer: 1
    explain:
      ar_eg: rencana اسم؛ بعد saya محتاج فعل، يعني berencana.
      ar: rencana اسم، والموضع يحتاج فعلًا فنقول berencana.
      en: rencana is a noun; after saya you need the verb berencana.
    words: [berencana, rencana]
  - id: e03
    type: listen
    text: Rencananya, kami mendaki Rinjani minggu depan.
    options:
      - Rencananya, kami mendaki Rinjani minggu depan.
      - Rencananya, kami mendaki Rinjani minggu lalu.
      - Rencananya, kami mandi di Rinjani minggu depan.
    answer: 0
    meaning:
      ar_eg: الخطة إننا نطلع رينجاني الأسبوع الجاي.
      ar: نعتزم تسلّق رينجاني الأسبوع القادم.
      en: The plan is to climb Rinjani next week.
    words: [rencana, mendaki, minggu depan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «أنا ناوي أطلع رينجاني»؟
      ar: أيّ جملة تعني «أنوي تسلّق رينجاني»؟
      en: Which sentence means "I intend to climb Rinjani"?
    options:
      - Saya sudah mendaki Rinjani.
      - Saya tidak mau mendaki Rinjani.
      - Saya berniat mendaki Rinjani.
    answer: 2
    words: [berniat, mendaki]
  - id: e05
    type: fill_blank
    sentence: Bulan depan saya ___ seminggu dari kantor.
    meaning:
      ar_eg: الشهر الجاي واخد أجازة أسبوع من الشغل.
      ar: سآخذ إجازة أسبوعًا من العمل الشهر القادم.
      en: Next month I'm taking a week off work.
    options: [mendaki, cuti, berniat]
    answers: [cuti]
    words: [cuti]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الخطة إننا ناخد العبّارة بكرة الصبح.
      ar: نعتزم ركوب العبّارة صباح الغد.
      en: The plan is to take the ferry tomorrow morning.
    answer: Rencananya, kami naik feri besok pagi.
    distractors: [berencana, tadi]
    words: [rencana, feri]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: السنة الجاية بخطط أدرس في يوجياكارتا.
      ar: أخطط للدراسة في يوجياكرتا العام القادم.
      en: Next year I'm planning to study in Yogyakarta.
    answers:
      - Tahun depan saya berencana belajar di Yogyakarta.
      - Tahun depan saya berencana belajar di Yogyakarta
      - Tahun depan, saya berencana belajar di Yogyakarta.
      - Saya berencana belajar di Yogyakarta tahun depan.
      - Saya berencana belajar di Yogyakarta tahun depan
      - Tahun depan aku berencana belajar di Yogyakarta.
      - Aku berencana belajar di Yogyakarta tahun depan.
      - Tahun depan saya berencana belajar di Jogja.
      - Tahun depan saya berencana belajar di Yogya.
      - Tahun depan saya berencana untuk belajar di Yogyakarta.
      - Saya berencana untuk belajar di Yogyakarta tahun depan.
    words: [berencana]
  - id: e08
    type: speaking
    text: Insya Allah, saya berniat cuti dan mendaki Rinjani.
    meaning:
      ar_eg: إن شاء الله، ناوي آخد أجازة وأطلع رينجاني.
      ar: إن شاء الله، أنوي أن آخذ إجازة وأتسلّق رينجاني.
      en: God willing, I intend to take time off and climb Rinjani.
    words: [berniat, cuti, mendaki]
dialogue:
  title: Rencana minggu depan
  lines:
    - speaker: Raka
      text: Mohamed, apa rencanamu minggu depan?
      ar_eg: يا محمد، إيه خطتك الأسبوع الجاي؟
      ar: يا محمد، ما خطتك للأسبوع القادم؟
      en: Mohamed, what are your plans for next week?
    - speaker: Mohamed
      text: Rencananya, saya ke Sumbawa. Lalu saya berniat mendaki Rinjani lagi.
      ar_eg: الخطة إني أروح سومباوا. وبعدين ناوي أطلع رينجاني تاني.
      ar: أعتزم الذهاب إلى سومباوا، ثم أنوي تسلّق رينجاني مرة أخرى.
      en: The plan is to go to Sumbawa. Then I intend to climb Rinjani again.
    - speaker: Raka
      text: Wah, seru! Aku juga berencana ke Lombok lagi, tapi aku belum dapat cuti.
      ar_eg: الله، حلو! أنا كمان بخطط آجي لومبوك تاني، بس لسه ما خدتش أجازة.
      ar: رائع! أنا أيضًا أخطط للمجيء إلى لومبوك مرة أخرى، لكني لم أحصل على إجازة بعد.
      en: Wow, fun! I'm planning to come back to Lombok too, but I haven't got time off yet.
    - speaker: Mohamed
      text: Semoga kamu dapat cuti, ya!
      ar_eg: يا رب تاخد الأجازة!
      ar: أرجو أن تحصل على الإجازة!
      en: I hope you get the time off!
    - speaker: Raka
      text: Amin! Kalau dapat, aku ikut mendaki!
      ar_eg: آمين! لو خدتها، هطلع معاك!
      ar: آمين! إن حصلت عليها فسأتسلّق معك!
      en: Amen! If I get it, I'll come climbing with you!
