schema: kabar.lesson/v1
id: bipa5.u06.l05
language: id
title: Sanggar seni
can_do:
  ar_eg: تتكلم عن بروفات فرقة فنية وتحضيرها لعرض.
  ar: أن تتحدّث عن تدريبات فرقة فنية واستعدادها لعرض.
  en: Talk about an arts group's rehearsals and how it prepares a show.
slides:
  - title: Di balik pentas
    body:
      ar_eg: |
        في إندونيسيا الرقص والمسرح التقليدي بيتعلموا في sanggar:
        - sanggar = فرقة / ورشة فنية بيتدرب فيها الناس، وغالبًا للأطفال والشباب
        - latihan = بروفة / تمرين
        - pentas = عرض على المسرح، وكمان فعل: Sanggar kami pentas hari Sabtu. = فرقتنا هتعرض السبت.
        - naskah = النص (السكريبت)
        - pemeran = اللي بيمثل دور، وpemeran utama = البطل
      ar: |
        يُتعلَّم الرقص والمسرح التقليدي في إندونيسيا في sanggar:
        - sanggar = فرقة أو ورشة فنية يتدرّب فيها الناس، وكثيرًا ما تكون للأطفال والشباب
        - latihan = تدريب، بروفة
        - pentas = عرض مسرحي، ويأتي فعلًا أيضًا: Sanggar kami pentas hari Sabtu. = تعرض فرقتنا يوم السبت.
        - naskah = النصّ
        - pemeran = من يؤدّي دورًا، وpemeran utama = البطل
      en: |
        In Indonesia, traditional dance and theatre are learned in a sanggar:
        - sanggar = arts studio or troupe where people train, often children and young people
        - latihan = rehearsal, practice
        - pentas = stage show, also a verb: Sanggar kami pentas hari Sabtu. = Our troupe performs on Saturday.
        - naskah = script
        - pemeran = cast member; pemeran utama = lead
    examples:
      - text: Para pemeran membaca naskah sebelum latihan.
        ar_eg: الممثلين بيقروا النص قبل البروفة.
        ar: يقرأ الممثّلون النصّ قبل البروفة.
        en: The cast read the script before rehearsal.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sanggar
        ar_eg: فرقة / ورشة فنية
        ar: فرقة فنية
        en: arts troupe, studio
      - text: pentas
        ar_eg: عرض على المسرح
        ar: عرض مسرحي
        en: stage show
      - text: latihan
        ar_eg: بروفة
        ar: تدريب
        en: rehearsal
      - text: naskah
        ar_eg: النص
        ar: النصّ
        en: script
      - text: pemeran
        ar_eg: ممثل دور
        ar: مؤدٍّ لدور
        en: cast member
    words: [sanggar, pentas, latihan, naskah, pemeran]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «sanggar» يعني إيه؟
      ar: ما معنى «sanggar»؟
      en: What is a "sanggar"?
    options:
      - فرقة أو ورشة فنية بيتدربوا فيها.
      - مسرح كبير في العاصمة.
      - محل بيبيع آلات موسيقية.
    answer: 0
    words: [sanggar]
  - id: e03
    type: listen
    text: Latihan untuk pentas hari Sabtu dimulai pukul tujuh malam.
    question:
      ar_eg: البروفة بتبدأ إمتى؟
      ar: متى تبدأ البروفة؟
      en: When does the rehearsal start?
    options:
      - سبعة الصبح.
      - سبعة بالليل.
      - السبت الضهر.
    answer: 1
    words: [latihan, pentas]
  - id: e04
    type: fill_blank
    sentence: Sutradara membagikan ___ kepada semua pemeran.
    meaning:
      ar_eg: المخرج وزّع النص على كل الممثلين.
      ar: وزّع المخرج النصّ على جميع الممثّلين.
      en: The director hands the script out to the whole cast.
    options: [naskah, sanggar, pentas]
    answers: [naskah]
    words: [naskah, pemeran]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الفرقة دي هتعرض في متحف بالانجا.
      ar: ستقدّم هذه الفرقة عرضها في متحف بالانغا.
      en: That troupe will perform at the Balanga Museum.
    answer: Sanggar itu akan pentas di Museum Balanga.
    distractors: [naskah, latihan]
    words: [sanggar, pentas]
  - id: e06
    type: translate
    direction: from_target
    source_text: Para pemeran berlatih setiap hari selama sebulan.
    answers_meaning:
      ar_eg:
        - الممثلين بيتدربوا كل يوم لمدة شهر.
        - الممثلين عملوا بروفات كل يوم شهر كامل.
      ar:
        - يتدرّب الممثّلون كلّ يوم مدّة شهر.
        - تدرّب الممثّلون يوميًا طوال شهر.
      en:
        - The cast rehearse every day for a month.
        - The actors trained daily for a whole month.
    words: [pemeran]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: مين الـ «pemeran»؟
      ar: من «pemeran»؟
      en: Who is a "pemeran"?
    options:
      - اللي بيكتب النص.
      - اللي بيبيع التذاكر.
      - اللي بيمثل دور في العرض.
    answer: 2
    explain:
      ar_eg: 'pemeran من peran (دور): الشخص اللي بياخد دور.'
      ar: pemeran من peran (دور)، أي من يؤدّي الدور.
      en: pemeran comes from peran (role), the person who takes a role.
    words: [pemeran]
  - id: e08
    type: speaking
    text: Kami latihan tiga kali seminggu sebelum pentas.
    meaning:
      ar_eg: إحنا بنعمل بروفة تلات مرات في الأسبوع قبل العرض.
      ar: نتدرّب ثلاث مرّات في الأسبوع قبل العرض.
      en: We rehearse three times a week before the show.
    words: [latihan, pentas]
  - id: e09
    type: dictation
    text: Naskah drama ini ditulis oleh anak-anak sanggar.
    meaning:
      ar_eg: نص المسرحية دي كتبوه ولاد الفرقة.
      ar: كتب نصَّ هذه المسرحية أطفالُ الفرقة.
      en: The children of the troupe wrote this play's script.
    words: [naskah, sanggar]
  - id: e10
    type: fill_blank
    sentence: Setiap Sabtu sore ada ___ tari di sanggar.
    meaning:
      ar_eg: كل سبت العصر فيه بروفة رقص في الفرقة.
      ar: كلّ سبت عصرًا هناك تدريب على الرقص في الفرقة.
      en: Every Saturday afternoon there's dance rehearsal at the studio.
    options: [latihan, naskah, pemeran]
    answers: [latihan]
    words: [latihan]
dialogue:
  title: Undangan dari Bu Lestari
  lines:
    - speaker: Bu Lestari
      text: Pak Mohamed, anak saya ikut sanggar tari. Mereka akan pentas bulan depan.
      ar_eg: يا أستاذ محمد، بنتي في فرقة رقص، وهيعرضوا الشهر الجاي.
      ar: يا أستاذ محمد، ابنتي في فرقة رقص، وسيقدّمون عرضهم الشهر المقبل.
      en: Pak Mohamed, my daughter is in a dance troupe. They're performing next month.
    - speaker: Mohamed
      text: Wah, hebat! Apakah dia pemeran utama?
      ar_eg: الله، برافو! هي البطلة؟
      ar: رائع! هل هي البطلة؟
      en: Wow, great! Is she the lead?
    - speaker: Bu Lestari
      text: Ya. Dia latihan setiap sore dan sudah menghafal seluruh naskahnya.
      ar_eg: أيوه. بتعمل بروفة كل يوم العصر، وحفظت النص كله.
      ar: نعم، تتدرّب كلّ عصر، وقد حفظت النصّ كاملًا.
      en: Yes. She rehearses every afternoon and has learned the whole script.
    - speaker: Mohamed
      text: Kalau boleh, saya ingin datang ke latihannya dan menulis ulasan untuk pentasnya.
      ar_eg: لو ينفع، نفسي أحضر البروفة وأكتب نقد للعرض.
      ar: إن سمحتِ، أودّ حضور تدريبها وكتابة مراجعة لعرضها.
      en: If I may, I'd like to come to a rehearsal and write a review of the show.
