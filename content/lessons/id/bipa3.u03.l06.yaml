  - id: e03
    type: listen
    text: Saya suka film aksi, tapi Rina suka drama.
    question:
      ar_eg: رينا بتحب إيه؟
      ar: ماذا تحب رينا؟
      en: What does Rina like?
    options: [دراما, أكشن, رعب]
    answer: 0
    meaning:
      ar_eg: أنا بحب أفلام الأكشن، بس رينا بتحب الدراما.
      ar: أحب أفلام الحركة، لكن رينا تحب الدراما.
      en: I like action films, but Rina likes drama.
    words: [aksi, drama]
  - id: e04
    type: fill_blank
    sentence: ___ itu masuk ke rumah dan membawa uang.
    meaning:
      ar_eg: الـ ___ دخل البيت وخد الفلوس معاه.
      ar: دخل ___ البيت وحمل المال معه.
      en: The ___ got into the house and made off with the money.
    options: [Penjahat, Detektif, Drama]
    answers: [Penjahat]
    words: [penjahat, detektif, drama]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيدوّر على الحقيقة في فيلم الغموض؟
      ar: من يبحث عن الحقيقة في فيلم الغموض؟
      en: Who looks for the truth in a mystery film?
    options: [penjahat, kejahatan, detektif]
    answer: 2
    explain:
      ar_eg: detektif = محقق.
      ar: detektif = محقق.
      en: detektif = detective.
    words: [detektif, penjahat, kejahatan]
  - id: e06
    type: fill_blank
    sentence: Akhir filmnya sangat ___! Saya tidak tahu dia penjahatnya.
    meaning:
      ar_eg: نهاية الفيلم ___ جدًا! ما كنتش عارف إنه هو المجرم.
      ar: نهاية الفيلم ___ جدًا! لم أكن أعرف أنه المجرم.
      en: The ending is so ___! I didn't know he was the villain.
    options: [mengejutkan, misteri, aksi]
    answers: [mengejutkan]
    words: [mengejutkan, misteri, aksi]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الجريمة دي فظيعة.
      ar: هذه الجريمة مرعبة.
      en: This crime is horrifying.
    answer: Kejahatan ini sangat mengerikan.
    distractors: [detektif, drama]
    words: [kejahatan, mengerikan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Saya suka film misteri dengan detektif yang pintar.
    answers_meaning:
      ar_eg: [بحب أفلام الغموض اللي فيها محقق شاطر, بحب أفلام الغموض مع محقق ذكي]
      ar: [أحب أفلام الغموض التي فيها محقق ذكي]
      en: [I like mystery films with a clever detective, I love mystery films with a smart detective]
    words: [misteri, detektif]
  - id: e09
    type: speaking
    text: Film aksi ini mengerikan, tapi menarik.
    meaning:
      ar_eg: فيلم الأكشن ده مرعب، بس حلو.
      ar: فيلم الحركة هذا مرعب لكنه مثير.
      en: This action film is horrifying, but gripping.
    words: [aksi, mengerikan]
  - id: e10
    type: multiple_choice
    question: Polisi ingin menghentikan ___ di Mataram.
    options: [drama, kejahatan, mengejutkan]
    answer: 1
    explain:
      ar_eg: kejahatan = جريمة (من jahat).
      ar: kejahatan = جريمة (من jahat).
      en: kejahatan = crime (from jahat).
    words: [kejahatan, drama, mengejutkan]
dialogue:
  lines:
    - speaker: Mohamed
      text: Rina, film tadi bagus sekali! Saya suka misterinya.
      ar_eg: يا رينا، الفيلم اللي فات حلو أوي! عجبني الغموض.
      ar: يا رينا، كان الفيلم رائعًا! أعجبني الغموض.
      en: Rina, that film was great! I loved the mystery.
    - speaker: Rina
      text: Saya juga. Detektifnya pintar sekali.
      ar_eg: وأنا كمان. المحقق شاطر جدًا.
      ar: وأنا أيضًا. المحقق ذكي جدًا.
      en: Me too. The detective was so clever.
    - speaker: Mohamed
      text: Tapi adegan kejahatannya mengerikan.
      ar_eg: بس مشهد الجريمة كان فظيع.
      ar: لكن مشهد الجريمة كان مرعبًا.
      en: But the crime scene was horrifying.
    - speaker: Rina
      text: Ya, dan akhirnya mengejutkan! Penjahatnya teman detektif itu.
      ar_eg: أيوه، والنهاية خضّتني! المجرم طلع صاحب المحقق نفسه.
      ar: نعم، والنهاية صادمة! المجرم صديق المحقق نفسه.
      en: Yes, and the ending was a shock! The villain was the detective's own friend.
    - speaker: Mohamed
      text: Besok kita menonton film drama saja, ya.
      ar_eg: بكرة نتفرج على دراما أحسن.
      ar: غدًا لنشاهد فيلم دراما فقط.
      en: Tomorrow let's just watch a drama.
