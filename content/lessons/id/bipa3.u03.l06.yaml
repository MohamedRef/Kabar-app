schema: kabar.lesson/v1
id: bipa3.u03.l06
language: id
title: Detektif dan penjahat
can_do:
  ar_eg: 'تحكي عن فيلم غموض أو أكشن: المحقق والمجرم والجريمة والنهاية المفاجئة.'
  ar: 'أن تحكي عن فيلم غموض أو حركة: المحقق والمجرم والجريمة والنهاية المفاجئة.'
  en: 'Talk about a mystery or action film: the detective, the villain, the crime and the twist.'
slides:
  - title: Film misteri
    body:
      ar_eg: |
        film aksi = فيلم أكشن، drama = دراما، misteri = غموض (film misteri).
        detektif = محقق، مخبر. penjahat = مجرم، الشرير (من jahat = شرير). kejahatan = جريمة.
        mengerikan = مرعب، فظيع. mengejutkan = يخض، مفاجئ (من kejut).
      ar: |
        film aksi = فيلم حركة، drama = دراما، misteri = غموض (film misteri).
        detektif = محقق. penjahat = مجرم، الشرير (من jahat = شرير). kejahatan = جريمة.
        mengerikan = مرعب، فظيع. mengejutkan = مفاجئ، صادم (من kejut).
      en: |
        film aksi = action film, drama = drama, misteri = mystery (film misteri).
        detektif = detective. penjahat = criminal, villain (from jahat = evil). kejahatan = crime.
        mengerikan = horrifying, terrible. mengejutkan = surprising, shocking (from kejut).
    examples:
      - text: Detektif itu tahu siapa penjahatnya.
        ar_eg: المحقق عارف مين المجرم.
        ar: يعرف المحقق من المجرم.
        en: The detective knows who the villain is.
      - text: Akhir film misteri ini sangat mengejutkan.
        ar_eg: نهاية فيلم الغموض ده مفاجأة جامدة.
        ar: نهاية فيلم الغموض هذا مفاجئة جدًا.
        en: The ending of this mystery film is a real shock.
      - text: Kejahatan di film itu mengerikan.
        ar_eg: الجريمة في الفيلم ده فظيعة.
        ar: الجريمة في ذلك الفيلم مرعبة.
        en: The crime in that film is horrifying.
