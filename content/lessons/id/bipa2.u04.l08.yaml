schema: kabar.lesson/v1
id: bipa2.u04.l08
language: id
title: Belanja dan bayar
can_do:
  ar_eg: 'تتسوق في سوبر ماركت: السلة والكيس والكاشير والخصم والدفع والباقي.'
  ar: 'أن تتسوّق في متجر كبير: السلة والكيس والمحاسب والخصم والدفع والباقي.'
  en: 'Shop at a supermarket: basket, bag, cashier, discount, paying and change.'
slides:
  - title: Di kasir
    body:
      ar_eg: |
        belanja = يتسوق (والرسمي berbelanja). keranjang = سلة، kantong = كيس (kantong plastik).
        timbangan = ميزان (timbang = يوزن).
        bayar = يدفع: Bayar di kasir. وkasir = الكاشير.
        kembalian = الباقي (من kembali = يرجع). وdiskon = خصم.
      ar: |
        belanja = يتسوّق (والفصيح berbelanja). keranjang = سلّة، kantong = كيس (kantong plastik).
        timbangan = ميزان (timbang = يزن).
        bayar = يدفع: Bayar di kasir، وkasir = المحاسب.
        kembalian = الباقي (من kembali = يعود). وdiskon = خصم.
      en: |
        belanja = shop (formal berbelanja). keranjang = basket, kantong = bag (kantong plastik).
        timbangan = scales (timbang = weigh).
        bayar = pay: Bayar di kasir; kasir = cashier.
        kembalian = change (from kembali, return). diskon = discount.
    examples:
      - text: Ibu belanja di pasar setiap pagi.
        ar_eg: ماما بتتسوق في السوق كل يوم الصبح.
        ar: تتسوّق أمي في السوق كل صباح.
        en: Mum shops at the market every morning.
      - text: Bayar di kasir, ya.
        ar_eg: ادفع عند الكاشير.
        ar: ادفع عند المحاسب.
        en: Pay at the till, please.
      - text: Ini kembaliannya, Pak. Terima kasih!
        ar_eg: اتفضل الباقي يا أستاذ. شكرًا!
        ar: تفضّل الباقي يا سيدي. شكرًا!
        en: Here's your change, sir. Thank you!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: belanja
        ar_eg: يتسوق
        ar: يتسوّق
        en: shop
      - text: kasir
        ar_eg: كاشير
        ar: محاسب
        en: cashier
      - text: kembalian
        ar_eg: الباقي
        ar: الباقي
        en: change
      - text: keranjang
        ar_eg: سلة
        ar: سلّة
        en: basket
    words: [belanja, kasir, kembalian, keranjang]
  - id: e02
    type: match_pairs
    pairs:
      - text: kantong
        ar_eg: كيس
        ar: كيس
        en: bag
      - text: timbangan
        ar_eg: ميزان
        ar: ميزان
        en: scales
      - text: diskon
        ar_eg: خصم
        ar: خصم
        en: discount
      - text: bayar
        ar_eg: يدفع
        ar: يدفع
        en: pay
    words: [kantong, timbangan, diskon, bayar]
  - id: e03
    type: listen
    text: Ini kembaliannya, lima ribu. Terima kasih!
    question:
      ar_eg: الكاشير بيدّيه إيه؟
      ar: ماذا يعطيه المحاسب؟
      en: What is the cashier giving him?
    options: [الباقي, كيس, سلة]
    answer: 0
    meaning:
      ar_eg: اتفضل الباقي، خمس تلاف. شكرًا!
      ar: تفضّل الباقي، خمسة آلاف. شكرًا!
      en: Here's your change, five thousand. Thank you!
    words: [kembalian]
  - id: e04
    type: fill_blank
    sentence: Silakan ke ___ di depan.
    meaning:
      ar_eg: اتفضل على ___ اللي قدام.
      ar: تفضّل إلى ___ في الأمام.
      en: Please go to the ___ at the front.
    options: [kasir, timbangan, diskon]
    answers: [kasir]
    words: [kasir, timbangan, diskon]
    explain:
      ar_eg: kasir = الكاشير، اللي بتروحله تدفع. timbangan = ميزان، وdiskon = خصم.
      ar: kasir = أمين الصندوق. أما timbangan فميزان وdiskon خصم.
      en: You go to the kasir (checkout) to pay. timbangan is the scales, diskon a discount.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: البياع بيوزن الفاكهة بإيه؟
      ar: بمَ يزن البائع الفاكهة؟
      en: What does the seller weigh fruit on?
    options: [timbangan, keranjang, kantong]
    answer: 0
    explain:
      ar_eg: timbangan = ميزان.
      ar: timbangan = ميزان.
      en: timbangan = scales.
    words: [timbangan, keranjang, kantong]
  - id: e06
    type: fill_blank
    sentence: 'Hari ini ada ___: semua baju lebih murah!'
    meaning:
      ar_eg: 'النهارده فيه ___: كل الهدوم أرخص!'
      ar: 'اليوم ___: كل الملابس أرخص!'
      en: 'Today there''s a ___: all clothes are cheaper!'
    options: [diskon, kembalian, belanja]
    answers: [diskon]
    words: [diskon, kembalian, belanja]
    explain:
      ar_eg: «كله أرخص» = diskon (خصم). kembalian = الباقي، وbelanja = التسوق.
      ar: «كل شيء أرخص» = diskon. أما kembalian فالباقي وbelanja التسوّق.
      en: "\"Everything's cheaper\" means a diskon. kembalian is change, belanja is shopping."
  - id: e07
    type: build_sentence
    source:
      ar_eg: مش محتاج كيس بلاستيك، معايا سلة.
      ar: لا أحتاج كيسًا بلاستيكيًا، معي سلّة.
      en: No plastic bag, thanks; I've brought a basket.
    answer: Tidak usah kantong plastik, saya bawa keranjang.
    distractors: [kasir, bayar]
    words: [kantong, keranjang, kasir, bayar]
    explain:
      ar_eg: Tidak usah = «مش لازم/مش محتاج». kasir وbayar (يدفع) مش في الجملة.
      ar: Tidak usah = «لا داعي». أما kasir وbayar فليستا في الجملة.
      en: Tidak usah = "no need for". kasir and bayar aren't in this sentence.
  - id: e08
    type: translate
    direction: from_target
    source_text: Ada diskon hari ini. Bayar di kasir, ya!
    answers_meaning:
      ar_eg: [فيه خصم النهارده. ادفع عند الكاشير!, النهارده فيه خصم. الدفع عند الكاشير!]
      ar: [هناك خصم اليوم. ادفع عند المحاسب!]
      en: ['There''s a discount today. Pay at the till!', Discount today. Please pay at the cashier!]
    words: [diskon, bayar, kasir]
  - id: e09
    type: speaking
    text: Saya mau belanja di pasar.
    meaning:
      ar_eg: عايز أتسوق في السوق.
      ar: أريد التسوّق في السوق.
      en: I want to go shopping at the market.
    words: [belanja]
  - id: e10
    type: multiple_choice
    question: Harganya delapan ribu, uang saya sepuluh ribu. Kembaliannya ___.
    options: [dua ribu, delapan ribu, sepuluh ribu]
    answer: 0
    explain:
      ar_eg: '١٠ - ٨ = ٢: dua ribu.'
      ar: 'عشرة ناقص ثمانية يساوي اثنين: dua ribu.'
      en: '10 − 8 = 2: dua ribu.'
    words: [kembalian, bayar]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, ayo belanja! Ada diskon di toko itu.
      ar_eg: يلّا يا محمد نتسوق! فيه خصم في المحل ده.
      ar: هيّا يا محمد نتسوّق! هناك خصم في ذلك المتجر.
      en: Mohamed, let's go shopping! That shop has a sale.
    - speaker: Mohamed
      text: Ayo! Ini keranjangnya.
      ar_eg: يلّا! دي السلة.
      ar: هيّا! هذه السلّة.
      en: Let's go! Here's a basket.
    - speaker: Kasir
      text: Semuanya delapan puluh ribu. Pakai kantong plastik?
      ar_eg: الحساب تمانين ألف. عايز كيس بلاستيك؟
      ar: المجموع ثمانون ألفًا. أتريد كيسًا بلاستيكيًا؟
      en: That's eighty thousand altogether. Plastic bag?
    - speaker: Mohamed
      text: Tidak usah, terima kasih. Saya bayar seratus ribu.
      ar_eg: لأ، شكرًا. هدفع مية ألف.
      ar: لا داعي، شكرًا. أدفع مئة ألف.
      en: No need, thanks. I'll pay with a hundred thousand.
    - speaker: Kasir
      text: Ini kembaliannya, dua puluh ribu.
      ar_eg: اتفضل الباقي، عشرين ألف.
      ar: تفضّل الباقي، عشرون ألفًا.
      en: Here's your change, twenty thousand.
