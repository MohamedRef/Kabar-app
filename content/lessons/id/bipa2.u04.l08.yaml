dialogue:
  lines:
    - speaker: Bu Yanti
      text: Mohamed, kita ke pasar, yuk! Saya mau memasak untuk makan malam.
      ar_eg: يلّا يا محمد نروح السوق! عايزة أطبخ للعشا.
      ar: هيّا يا محمد إلى السوق! أريد أن أطبخ العشاء.
      en: Mohamed, let's go to the market! I want to cook dinner.
    - speaker: Mohamed
      text: Mau beli apa, Bu?
      ar_eg: هتشتري إيه يا طنط؟
      ar: ماذا ستشترين يا سيدتي؟
      en: What are you going to buy?
    - speaker: Bu Yanti
      text: Tomat, kentang, wortel, dan kubis.
      ar_eg: طماطم وبطاطس وجزر وكرنب.
      ar: طماطم وبطاطس وجزرًا وملفوفًا.
      en: Tomatoes, potatoes, carrots and cabbage.
    - speaker: Penjual
      text: Semua segar, Bu! Baru datang pagi ini.
      ar_eg: كله طازة يا ست! لسه جاي الصبح.
      ar: كلّها طازجة يا سيدتي! وصلت هذا الصباح.
      en: It's all fresh! It came in this morning.
    - speaker: Bu Yanti
      text: Timunnya berapa sekilo?
      ar_eg: الخيار بكام الكيلو؟
      ar: بكم كيلو الخيار؟
      en: How much a kilo are the cucumbers?
    - speaker: Penjual
      text: Delapan ribu. Terongnya juga murah!
      ar_eg: بتمن تلاف. والباذنجان رخيص كمان!
      ar: بثمانية آلاف، والباذنجان رخيص أيضًا!
      en: Eight thousand. The aubergines are cheap too!
