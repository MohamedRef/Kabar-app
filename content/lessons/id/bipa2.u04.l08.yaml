schema: kabar.lesson/v1
id: bipa2.u04.l08
language: id
title: Tomat dan kentang
can_do:
  ar_eg: تسمّي الخضار وتسأل إذا كانت طازة.
  ar: أن تسمّي الخضروات وتسأل إن كانت طازجة.
  en: Name vegetables and ask whether they're fresh.
slides:
  - title: Di pasar sayur
    body:
      ar_eg: |
        tomat = طماطم، kentang = بطاطس، wortel = جزر (من الهولندي)، kubis = كرنب، timun = خيار، terong = باذنجان.
        kacang = فول سوداني أو أي بقول: kacang tanah، kacang panjang (لوبيا).
        segar = طازة ومنعشة: Sayurnya segar! وكمان الجو: udaranya segar.
      ar: |
        tomat = طماطم، kentang = بطاطس، wortel = جزر (من الهولندية)، kubis = ملفوف، timun = خيار، terong = باذنجان.
        kacang = فول سوداني أو أي بقول: kacang tanah، وkacang panjang (لوبيا).
        segar = طازج ومنعش: Sayurnya segar! والهواء أيضًا: udaranya segar.
      en: |
        tomat = tomato, kentang = potato, wortel = carrot (from Dutch), kubis = cabbage, timun = cucumber, terong = aubergine.
        kacang = peanut or any bean: kacang tanah, kacang panjang (long beans).
        segar = fresh, refreshing: Sayurnya segar! The air too: udaranya segar.
    examples:
      - text: Tomat ini segar dan merah.
        ar_eg: الطماطم دي طازة وحمرا.
        ar: هذه الطماطم طازجة وحمراء.
        en: These tomatoes are fresh and red.
      - text: Ibu membeli kentang dan wortel untuk makan malam.
        ar_eg: ماما اشترت بطاطس وجزر للعشا.
        ar: اشترت أمي بطاطس وجزرًا للعشاء.
        en: Mum bought potatoes and carrots for dinner.
      - text: Kacang ini enak.
        ar_eg: الفول السوداني ده حلو.
        ar: هذا الفول السوداني لذيذ.
        en: These peanuts are good.
