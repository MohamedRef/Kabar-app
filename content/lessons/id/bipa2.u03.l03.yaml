      ar: (لافتة) يُمنع الوقوف.
      en: (sign) No parking.
    answers: [Dilarang parkir., Dilarang parkir, Dilarang parkir!, Dilarang parkir di sini.]
    words: [dilarang, parkir]
  - id: e06
