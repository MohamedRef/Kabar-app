schema: kabar.lesson/v1
id: bipa2.u03.l03
language: id
title: Dilarang merokok
can_do:
  ar_eg: تقرا اليافطات اللي بتمنع أو بتحذّر.
  ar: أن تقرأ لافتات المنع والتحذير.
  en: Read signs that forbid or warn.
slides:
  - title: Dilarang …
    body:
      ar_eg: |
        Dilarang + فعل = «ممنوع…»:
        Dilarang merokok = ممنوع التدخين. Dilarang masuk = ممنوع الدخول. Dilarang parkir = ممنوع الركن.
        dilarang أصلها di- + larang (يمنع) = «ممنوع». دي أول مرة تشوف di- للمبني للمجهول، وهتتعلمها كويس في BIPA 3.
      ar: |
        Dilarang + فعل = «يُمنع…»:
        Dilarang merokok = يُمنع التدخين. Dilarang masuk = يُمنع الدخول. Dilarang parkir = يُمنع الوقوف.
        وdilarang = di- + larang (منع)، أي «ممنوع»، وهي لمحة أولى عن المبني للمجهول قبل BIPA 3.
      en: |
        Dilarang + verb = "… prohibited":
        Dilarang merokok = No smoking. Dilarang masuk = No entry. Dilarang parkir = No parking.
        dilarang = di- + larang (forbid) = "is forbidden" — your first look at the di- passive, coming properly in BIPA 3.
    grammar: id.notice.harap-dilarang
    examples:
      - text: Dilarang merokok di area ini.
        ar_eg: ممنوع التدخين هنا.
        ar: يُمنع التدخين في هذه المنطقة.
        en: No smoking in this area.
      - text: Dilarang masuk!
        ar_eg: ممنوع الدخول!
        ar: يُمنع الدخول!
        en: No entry!
  - title: Awas! Hati-hati!
    body:
      ar_eg: |
        للتحذير:
        - Awas + حاجة = «احترس / حاسب»: Awas anjing galak! = احترس كلب شرس!
        - Hati-hati = خلي بالك (أهدى شوية): Hati-hati di jalan = خلي بالك على الطريق.
      ar: |
        للتحذير:
        - Awas + الشيء = «احذر»: Awas anjing galak! = احذر كلبًا شرسًا!
        - Hati-hati = انتبه: Hati-hati di jalan = انتبه في الطريق.
      en: |
        Warnings:
        - Awas + thing = "Beware of …": Awas anjing galak! = Beware of the dog!
        - Hati-hati = Careful: Hati-hati di jalan = Take care on the road.
    grammar: id.notice.harap-dilarang
    examples:
      - text: Awas, lantai licin!
        ar_eg: حاسب، الأرض بتزحلق!
        ar: احذر، الأرض زلقة!
        en: Caution, slippery floor!
      - text: Hati-hati di jalan!
        ar_eg: خلي بالك على الطريق!
        ar: انتبه في الطريق!
        en: Take care on the road!
