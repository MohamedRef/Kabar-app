  - id: e02
    type: fill_blank
    sentence: ___ merokok di dalam pesawat.
    meaning:
      ar_eg: ممنوع التدخين جوه الطيارة.
      ar: يُمنع التدخين داخل الطائرة.
      en: No smoking on the plane.
    options: [Dilarang, Larang, Harap]
    answers: [Dilarang]
    explain:
      ar_eg: اللافتة بتقول «ممنوع» = Dilarang، مش «امنع» (larang).
      ar: اللافتة بصيغة المبني للمجهول Dilarang، لا larang.
      en: Signs use the passive form Dilarang, not larang.
    words: [dilarang, merokok]
  - id: e03
