  - id: e08
    type: speaking
    text: Walaupun berbeda suku bangsa, kami hidup dalam kerukunan.
    meaning:
      ar_eg: رغم إن أعراقنا مختلفة، عايشين في وئام.
      ar: مع اختلاف أعراقنا نعيش في وئام.
      en: Though we're from different ethnic groups, we live in harmony.
    words: [suku bangsa, kerukunan]
  - id: e09
    type: dictation
    text: Bhinneka Tunggal Ika berarti berbeda-beda tetapi tetap satu.
    meaning:
      ar_eg: «Bhinneka Tunggal Ika» معناها مختلفين بس فاضلين واحد.
      ar: «Bhinneka Tunggal Ika» تعني متنوّعين لكنّنا واحد.
      en: Bhinneka Tunggal Ika means different, yet still one.
    words: [Bhinneka Tunggal Ika]
  - id: e10
    type: translate
    direction: from_target
    source_text: Semboyan itu mengingatkan kita bahwa kerukunan lebih penting daripada perbedaan.
    answers_meaning:
      ar_eg:
        - الشعار ده بيفكّرنا إن الوئام أهمّ من الاختلاف.
        - الشعار بيقولّنا إن العيشة في سلام أهمّ من إننا مختلفين.
      ar:
        - يذكّرنا هذا الشعار بأنّ الوئام أهمّ من الاختلاف.
        - يُذكّر الشعار بأنّ الوفاق مقدَّم على الاختلاف.
      en:
        - That motto reminds us that harmony matters more than difference.
        - The motto reminds us harmony counts for more than our differences.
    words: [semboyan, kerukunan]
dialogue:
  title: Gereja dan masjid di Sentani
  lines:
    - speaker: Kak Yosua
      text: Lihat, gereja dan masjid itu berdiri bersebelahan.
      ar_eg: بص، الكنيسة والجامع دول جنب بعض.
      ar: انظر، الكنيسة والمسجد متجاوران.
      en: Look, that church and mosque stand side by side.
    - speaker: Mohamed
      text: Waktu Natal, apa yang terjadi?
      ar_eg: في الكريسماس بيحصل إيه؟
      ar: وماذا يحدث في عيد الميلاد؟
      en: What happens at Christmas?
    - speaker: Kak Yosua
      text: Pemuda masjid ikut menjaga keamanan. Waktu Idulfitri, pemuda gereja yang membantu.
      ar_eg: شباب الجامع بيساعدوا في التأمين. وفي عيد الفطر، شباب الكنيسة هم اللي بيساعدوا.
      ar: يشارك شباب المسجد في الحراسة، وفي عيد الفطر يساعد شباب الكنيسة.
      en: The mosque youth help with security. At Eid al-Fitr, the church youth help out.
    - speaker: Mohamed
      text: Itulah Bhinneka Tunggal Ika yang hidup, bukan hanya semboyan.
      ar_eg: هي دي «Bhinneka Tunggal Ika» الحيّة، مش مجرّد شعار.
      ar: هذه «Bhinneka Tunggal Ika» حيّةً، لا مجرّد شعار.
      en: That's Bhinneka Tunggal Ika alive, not just a motto.
