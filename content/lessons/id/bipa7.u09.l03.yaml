      ar: شعار إندونيسيا «Bhinneka Tunggal Ika».
      en: Indonesia's motto is "Bhinneka Tunggal Ika".
    answers:
      - Semboyan Indonesia adalah Bhinneka Tunggal Ika.
      - Semboyan bangsa Indonesia adalah Bhinneka Tunggal Ika.
      - Semboyan negara Indonesia adalah Bhinneka Tunggal Ika.
