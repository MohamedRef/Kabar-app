language: id
title: Bhinneka Tunggal Ika
can_do:
  ar_eg: تتكلّم عن الوحدة في التنوّع في إندونيسيا.
  ar: أن تتحدّث عن الوحدة في التنوّع في إندونيسيا.
  en: Talk about unity in diversity in Indonesia.
slides:
  - title: Berbeda-beda tetapi tetap satu
    body:
      ar_eg: |
        الـ semboyan (الشعار) الوطني هو Bhinneka Tunggal Ika، يعني «مختلفين بس واحد».
        - أصله باللغة الجاوية القديمة، من قصيدة Sutasoma اللي كتبها مبو تانتولار أيام مملكة ماجاباهيت (القرن 14).
        - مكتوب على شريط في lambang negara (شعار الدولة)، نسر الـ Garuda Pancasila.
        - في إندونيسيا أكتر من 1300 suku bangsa (عِرق/جماعة إثنية) على حسب تعداد 2010، وست أديان معترف بيها رسميًّا.
        - الـ kerukunan (الوئام) بين الناس دي هو اللي بيخلّي البلد ماشية.
      ar: |
        الـ semboyan (الشعار) الوطني هو Bhinneka Tunggal Ika، أي «متنوّعون لكنّنا واحد».
        - أصله باللغة الجاوية القديمة، من ملحمة Sutasoma التي نظمها مبو تانتولار في عهد مملكة ماجاباهيت (القرن الرابع عشر).
        - يُكتب على شريط في lambang negara (شعار الدولة)، نسر الـ Garuda Pancasila.
        - في إندونيسيا أكثر من 1300 suku bangsa (جماعة إثنية) بحسب تعداد 2010، وستّة أديان معترف بها رسميًّا.
        - والـ kerukunan (الوئام) بين هؤلاء هو ما يحفظ البلاد.
      en: |
        The national semboyan (motto) is Bhinneka Tunggal Ika, "different, yet one".
        - It is Old Javanese, from the poem Sutasoma by Mpu Tantular in the Majapahit era (14th century).
        - It is written on a scroll in the lambang negara (national emblem), the Garuda Pancasila.
        - Indonesia has more than 1,300 suku bangsa (ethnic groups) by the 2010 census, and six officially recognised religions.
        - The kerukunan (harmony) between them is what holds the country together.
