schema: kabar.lesson/v1
id: bipa6.u03.l07
language: id
title: Lamaran ala Minang
can_do:
  ar_eg: 'تفهم إزاي الخطوبة بتمشي عند المينانجكاباو: أهل العروسة هما اللي بيطلبوا، وبركة الكبار.'
  ar: 'أن تفهم الخطبة عند المينانغكاباو: أهل العروس هم من يتقدّمون، وبمباركة الكبار.'
  en: 'Understand a Minang proposal: the bride''s family proposes, with the elders'' blessing.'
slides:
  - title: Perempuan yang melamar
    body:
      ar_eg: |
        عند المينانجكاباو، أهل البنت هما اللي بيروحوا يطلبوا الولد.
        lamaran = طلب الإيد، خطوبة (من lamar). pertunangan = الخطوبة الرسمية (من tunang). restu = بركة، موافقة الكبار.
        sulung = الكبير في الإخوات (anak sulung). pamit = يستأذن ويمشي.
        segan = مكسوف ومحترم (segan kepada mamak). pantang = عيب، ممنوع بالعادة. beradab = مؤدب، متحضر (من adab ← أدب).
        - في الشارع: aku / -ku = saya (أنا)، kebalik = terbalik (بالعكس)، ketemu = bertemu (يقابل).
      ar: |
        عند المينانغكاباو يتقدّم أهل الفتاة لخطبة الشاب.
        lamaran = طلب اليد (من lamar). pertunangan = الخطوبة الرسمية (من tunang). restu = مباركة، رضا الكبار.
        sulung = البِكر (anak sulung). pamit = يستأذن في الانصراف.
        segan = يهاب ويحترم (segan kepada mamak). pantang = محظور عُرفًا، عيب. beradab = مهذّب، متحضّر (من adab ← أدب).
        - في كلام الشارع: aku / -ku = saya (أنا)، kebalik = terbalik (معكوس)، ketemu = bertemu (يلتقي).
      en: |
        Among the Minangkabau, the girl's family goes to ask for the young man.
        lamaran = proposal (from lamar). pertunangan = formal engagement (from tunang). restu = blessing, the elders' approval.
        sulung = eldest child (anak sulung). pamit = to take one's leave.
        segan = to feel respectful reserve (segan kepada mamak). pantang = taboo, not done. beradab = civilised, well-mannered (from adab ← أدب).
        - On the street: aku / -ku = saya (I), kebalik = terbalik (the other way round), ketemu = bertemu (to meet).
    examples:
      - text: Di Minangkabau, keluarga perempuan yang datang melamar.
        ar_eg: في المينانجكاباو، أهل البنت هما اللي بييجوا يطلبوا.
        ar: في مينانغكاباو يأتي أهل الفتاة للخطبة.
        en: In Minangkabau, the woman's family comes to propose.
      - text: Tanpa restu mamak, pertunangan tidak bisa dilanjutkan.
        ar_eg: من غير بركة الخال، الخطوبة ما تكملش.
        ar: بلا مباركة الخال لا تمضي الخطوبة.
        en: Without the uncle's blessing, the engagement can't go ahead.
      - text: Pantang pulang sebelum pamit kepada tuan rumah.
        ar_eg: عيب تمشي قبل ما تستأذن من صاحب البيت.
        ar: من العيب الانصراف قبل الاستئذان من المضيف.
        en: It's not done to leave before taking leave of the host.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: lamaran
        ar_eg: طلب الإيد
        ar: طلب اليد
        en: proposal
      - text: pertunangan
        ar_eg: خطوبة
        ar: خطوبة
        en: engagement
      - text: restu
        ar_eg: بركة، موافقة
        ar: مباركة
        en: blessing
      - text: sulung
        ar_eg: الكبير
        ar: البِكر
        en: eldest
    words: [lamaran, pertunangan, restu, sulung]
  - id: e02
    type: match_pairs
    pairs:
      - text: pamit
        ar_eg: يستأذن ويمشي
        ar: يستأذن في الانصراف
        en: to take leave
      - text: segan
        ar_eg: مكسوف ومحترم
        ar: يهاب ويحترم
        en: respectfully shy
      - text: pantang
        ar_eg: عيب
        ar: محظور عُرفًا
        en: taboo
      - text: beradab
        ar_eg: مؤدب
        ar: مهذّب
        en: civilised
    words: [pamit, segan, pantang, beradab]
  - id: e03
    type: listen
    text: Dia anak sulung, jadi dia yang menikah lebih dulu.
    question:
      ar_eg: ترتيبه إيه في إخواته؟
      ar: ما ترتيبه بين إخوته؟
      en: Where is he among his siblings?
    options: [الكبير, الصغير, الوحيد]
    answer: 0
    meaning:
      ar_eg: هو الابن الكبير، عشان كده هو اللي هيتجوز الأول.
      ar: إنه الابن البِكر، لذا يتزوج أولًا.
      en: He's the eldest, so he marries first.
    words: [sulung]
  - id: e04
    type: fill_blank
    sentence: Keluarga Uni Nita datang membawa ___ ke rumah keluarga laki-laki.
    meaning:
      ar_eg: أهل أوني نيتا جم بـ ___ لبيت أهل الولد.
      ar: جاء أهل أوني نيتا بـ ___ إلى بيت أهل الشاب.
      en: Uni Nita's family came with a ___ to the young man's family home.
    options: [lamaran, restu, pantang]
    answers: [lamaran]
    words: [lamaran, restu, pantang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: لما تكون محترم حد كبير ومكسوف تكلمه بحرية، ده إيه؟
      ar: حين تحترم كبيرًا وتتحرّج من مخاطبته بحرية، فهذا…
      en: Feeling respect for an elder and too shy to speak freely is…
    options: [beradab, segan, sulung]
    answer: 1
    explain:
      ar_eg: segan = احترام فيه كسوف.
      ar: segan = مهابة واحترام فيهما حياء.
      en: segan = respect mixed with reserve.
    words: [segan, beradab, sulung]
  - id: e06
    type: fill_blank
    sentence: Kami sudah lama di sini. Mari kita ___ dulu.
    meaning:
      ar_eg: بقالنا كتير هنا. يلا ___.
      ar: مكثنا طويلًا. هيّا ___.
      en: We've been here a long time. Let's ___.
    options: [pamit, segan, lamaran]
    answers: [pamit]
    words: [pamit, segan, lamaran]
  - id: e07
    type: multiple_choice
    question: Bagi orang Minang, makan sambil berdiri itu ___.
    options: [restu, pertunangan, pantang]
    answer: 2
    explain:
      ar_eg: حاجة العادة بتمنعها = pantang.
      ar: ما يمنعه العُرف = pantang.
      en: Something custom forbids = pantang.
    words: [pantang, restu, pertunangan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الخطوبة محتاجة بركة الكبار.
      ar: تحتاج الخطوبة إلى مباركة الكبار.
      en: The engagement needs the elders' blessing.
    answer: Pertunangan itu memerlukan restu orang tua.
    distractors: [pamit, segan]
    words: [pertunangan, restu]
  - id: e09
    type: translate
    direction: from_target
    source_text: Masyarakat yang beradab menghormati tamu.
    answers_meaning:
      ar_eg: [المجتمع المتحضر بيحترم الضيف, الناس المؤدبة بتكرم الضيوف]
      ar: [المجتمع المتحضّر يكرم الضيف, يحترم المجتمع المهذّب الضيوف]
      en: [A civilised society respects its guests, Well-mannered people honour guests]
    words: [beradab]
  - id: e10
    type: speaking
    text: Saya segan kepada mamak, jadi saya pamit dengan sopan.
    meaning:
      ar_eg: أنا محترم الخال ومكسوف منه، فاستأذنت بأدب.
      ar: أهاب الخال، فاستأذنت بأدب.
      en: I hold the uncle in respect, so I took my leave politely.
    words: [segan, pamit]
dialogue:
  lines:
    - speaker: Uda Rafi
      text: Minggu depan keluarga adikku datang melamar.
      ar_eg: الأسبوع الجاي أهل أختي جايين يطلبوا.
      ar: الأسبوع القادم يأتي أهل أختي للخطبة.
      en: Next week my sister's family is coming to propose.
    - speaker: Mohamed
      text: Melamar? Bukannya laki-laki yang melamar?
      ar_eg: يطلبوا؟ مش الراجل هو اللي بيطلب؟
      ar: يتقدّمون للخطبة؟ أليس الرجل من يخطب؟
      en: Propose? Isn't it the man who proposes?
    - speaker: Uda Rafi
      text: Di Minang kebalik. Perempuan yang melamar, dengan restu mamak.
      ar_eg: عندنا في المينانج بالعكس. البنت هي اللي بتطلب، ببركة الخال.
      ar: في مينانغ العكس. المرأة هي التي تخطب بمباركة الخال.
      en: In Minang it's the other way round. The woman proposes, with her uncle's blessing.
    - speaker: Mohamed
      text: Menarik! Calon suaminya anak sulung?
      ar_eg: حلو! العريس هو الابن الكبير؟
      ar: مثير! هل العريس هو الابن البِكر؟
      en: Interesting! Is the groom the eldest son?
    - speaker: Uda Rafi
      text: Iya. Dia orang beradab, tapi agak segan ketemu keluarga kami.
      ar_eg: أيوه. هو راجل مؤدب، بس مكسوف شوية يقابل عيلتنا.
      ar: نعم. إنه مهذّب، لكنه يتهيّب لقاء أسرتنا قليلًا.
      en: Yes. He's well-mannered, but a bit shy of meeting our family.
