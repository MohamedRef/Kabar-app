        ar_eg: تلج
        ar: ثلج
        en: ice
    words: [piring, garpu, pisau, es]
  - id: e02
    type: match_pairs
    pairs:
      - text: tugas
        ar_eg: مهمة، واجب
        ar: مهمّة، واجب
        en: task
