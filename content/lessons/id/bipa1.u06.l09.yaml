schema: kabar.lesson/v1
id: bipa1.u06.l09
language: id
title: Tugas di kantor
can_do:
  ar_eg: 'تتكلم عن يوم شغل: المهام والتليفون والكمبيوتر والنت، والغدا على المكتب.'
  ar: 'أن تتحدث عن يوم عمل: المهامّ والهاتف والحاسوب والإنترنت، والغداء على المكتب.'
  en: 'Talk about a working day: tasks, phone, computer and internet, and lunch at your desk.'
slides:
  - title: Hari kerja
    body:
      ar_eg: |
        tugas = مهمة أو واجب. telepon = تليفون أو مكالمة: Ada telepon untuk Anda.
        komputer = كمبيوتر، internet = نت.
        وفي الغدا: piring = طبق، garpu = شوكة، pisau = سكينة. الإندونيسيين بياكلوا بالمعلقة والشوكة، والسكينة قليلة على السفرة.
        es = تلج: es teh = شاي بالتلج، مشروب كل يوم.
      ar: |
        tugas = مهمّة أو واجب. telepon = هاتف أو مكالمة: Ada telepon untuk Anda.
        komputer = حاسوب، internet = إنترنت.
        وعلى الغداء: piring = طبق، garpu = شوكة، pisau = سكين. يأكل الإندونيسيون بالملعقة والشوكة، ونادرًا ما يظهر السكين على المائدة.
        es = ثلج: es teh = شاي مثلّج، مشروب يومي.
      en: |
        tugas = task, assignment. telepon = phone, phone call: Ada telepon untuk Anda.
        komputer = computer, internet = internet.
        At lunch: piring = plate, garpu = fork, pisau = knife. Indonesians eat with spoon and fork; knives rarely come to the table.
        es = ice: es teh = iced tea, an everyday drink.
    examples:
      - text: Tugas saya banyak hari ini.
        ar_eg: عندي شغل كتير النهارده.
        ar: لديّ مهامّ كثيرة اليوم.
        en: I've got lots of tasks today.
      - text: Komputer ada, tapi internet tidak ada.
        ar_eg: فيه كمبيوتر، بس مفيش نت.
        ar: يوجد حاسوب، لكن لا إنترنت.
        en: There's a computer, but no internet.
      - text: Mau es teh?
        ar_eg: تشرب شاي بالتلج؟
        ar: أتريد شايًا مثلّجًا؟
        en: Want some iced tea?
exercises:
  - id: e01
    type: match_pairs
    pairs:
