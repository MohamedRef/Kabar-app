  - id: e03
    type: listen
    text: Komputer ada, tapi internet tidak ada.
    question:
      ar_eg: إيه اللي مش موجود؟
      ar: ما الذي لا يوجد؟
      en: What's missing?
    options: [مفيش نت, مفيش كمبيوتر, مفيش تليفون]
    answer: 0
    meaning:
      ar_eg: فيه كمبيوتر، بس مفيش نت.
      ar: يوجد حاسوب لكن لا إنترنت.
      en: There's a computer, but no internet.
    words: [komputer, internet]
  - id: e04
    type: fill_blank
    sentence: Sendok dan ___ untuk makan nasi.
    meaning:
      ar_eg: المعلقة والـ ___ عشان أكل الرز.
      ar: الملعقة و___ لأكل الأرز.
      en: A spoon and a ___ for eating rice.
    options: [garpu, pisau, piring]
    answers: [garpu]
    words: [garpu, pisau, piring]
    explain:
      ar_eg: "المعلقة والشوكة: sendok dan garpu. pisau = سكينة، وpiring = طبق."
      ar: sendok dan garpu = ملعقة وشوكة.
      en: Spoon and garpu (fork) for rice.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بتقطع اللحمة بإيه؟
      ar: بمَ تقطع اللحم؟
      en: What do you cut meat with?
    options: [pisau, garpu, es]
    answer: 0
    explain:
      ar_eg: pisau = سكينة.
      ar: pisau = سكين.
      en: pisau = knife.
    words: [pisau, garpu, es]
  - id: e06
    type: fill_blank
    sentence: Saya membaca email di ___.
    meaning:
      ar_eg: بقرا الإيميل على الـ ___.
      ar: أقرأ البريد على ___.
      en: I read email on the ___.
    options: [komputer, piring, es]
    answers: [komputer]
    words: [komputer, piring, es]
    explain:
      ar_eg: الإيميل بيتقري على komputer. piring = طبق، وes = تلج.
      ar: يُقرأ البريد على komputer.
      en: Email is read on a komputer.
  - id: e07
    type: build_sentence
    source:
      ar_eg: عايز شاي بالتلج لو سمحت.
      ar: أريد شايًا مثلّجًا من فضلك.
      en: An iced tea, please.
    answer: Saya mau es teh, ya.
    distractors: [piring, garpu]
    words: [es]
    explain:
      ar_eg: Saya mau (عايز) + es teh (شاي بتلج) + ya. piring وgarpu زيادة.
      ar: Saya mau es teh، ya. piring وgarpu زائدتان.
      en: Saya mau + es teh, + ya. piring and garpu are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Ada telepon untuk Anda, Pak.
    answers_meaning:
      ar_eg: [فيه تليفون لحضرتك يا أستاذ, فيه مكالمة لحضرتك يا أستاذ]
      ar: [هناك مكالمة لك يا سيدي, لديك مكالمة يا سيدي]
      en: ['There''s a phone call for you, sir', 'There''s a call for you, sir']
    words: [telepon]
  - id: e09
    type: speaking
    text: Tugas saya sudah selesai. Saya mau telepon ibu saya.
    meaning:
      ar_eg: خلصت شغلي. عايز أكلّم ماما.
      ar: أنهيت مهامّي، وأريد أن أتصل بأمي.
      en: My tasks are done. I want to call my mum.
    words: [tugas, telepon]
  - id: e10
    type: multiple_choice
    question: Nasi dan ayam ada di ___.
    options: [piring, internet, tugas]
    answer: 0
    explain:
      ar_eg: 'الرز والفراخ في الطبق: piring.'
      ar: 'الأرز والدجاج في الطبق: piring.'
      en: 'Rice and chicken go on a plate: piring.'
    words: [piring, internet, tugas]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kamu makan di mana?
      ar_eg: يا محمد، هتاكل فين؟
      ar: يا محمد، أين ستأكل؟
      en: Mohamed, where are you eating?
    - speaker: Mohamed
      text: Di sini aja. Tugasku banyak.
      ar_eg: هنا وخلاص. عندي شغل كتير.
      ar: هنا. لديّ مهامّ كثيرة.
      en: Right here. I've got lots to do.
    - speaker: Rina
      text: Ini nasi untuk kamu. Ada piring dan garpu?
      ar_eg: ده رز ليك. معاك طبق وشوكة؟
      ar: هذا أرز لك. هل معك طبق وشوكة؟
      en: Here's some rice for you. Got a plate and fork?
    - speaker: Mohamed
      text: Ada. Makasih! Mau es teh juga?
      ar_eg: معايا. شكرًا! تشربي شاي بالتلج كمان؟
      ar: نعم، شكرًا! أتريدين شايًا مثلّجًا أيضًا؟
      en: Yes. Thanks! Want an iced tea too?
    - speaker: Rina
      text: Mau! Eh, internetnya nggak ada?
      ar_eg: آه! إيه ده، النت مش شغال؟
      ar: نعم! هل الإنترنت مقطوع؟
      en: Yes please! Hey, is the internet down?
    - speaker: Mohamed
      text: Nggak ada. Tugasku nggak bisa selesai!
      ar_eg: مفيش. شغلي مش هيخلص!
      ar: مقطوع. لن أنهي مهامّي!
      en: It's down. I can't finish my work!
