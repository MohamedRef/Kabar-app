schema: kabar.lesson/v1
id: bipa1.u06.l09
language: id
title: Roti, susu, sendok
can_do:
  ar_eg: تطلب الفطار وتسمّي الكوباية والطبق والمعلقة والشوكة والسكينة.
  ar: أن تطلب الفطور وتسمّي الكوب والطبق والملعقة والشوكة والسكين.
  en: Order breakfast and name the glass, plate, spoon, fork and knife.
slides:
  - title: Sarapan
    body:
      ar_eg: |
        على الفطار: roti (عيش أو توست)، susu (لبن)، es (تلج: es teh = شاي بالتلج).
        gelas = كوباية، piring = طبق، sendok = معلقة، garpu = شوكة، pisau = سكينة.
        الإندونيسيين بياكلوا الرز بالمعلقة في اليمين والشوكة في الشمال، والسكينة قليل. وكتير بياكلوا بإيدهم اليمين.
      ar: |
        على الفطور: roti (خبز)، وsusu (حليب)، وes (ثلج: es teh = شاي مثلّج).
        gelas = كوب، piring = طبق، sendok = ملعقة، garpu = شوكة، pisau = سكين.
        يأكل الإندونيسيون الأرز بالملعقة في اليمنى والشوكة في اليسرى، ونادرًا ما يستعملون السكين، وكثيرون يأكلون باليد اليمنى.
      en: |
        At breakfast: roti (bread), susu (milk), es (ice: es teh = iced tea).
        gelas = glass, piring = plate, sendok = spoon, garpu = fork, pisau = knife.
        Indonesians eat rice with a spoon in the right hand and a fork in the left, rarely a knife, and many eat with the right hand.
    examples:
      - text: Saya sarapan roti dan susu.
        ar_eg: بفطر عيش ولبن.
        ar: أفطر خبزًا وحليبًا.
        en: I have bread and milk for breakfast.
      - text: Orang Indonesia makan nasi memakai sendok dan garpu.
        ar_eg: الإندونيسيين بياكلوا الرز بالمعلقة والشوكة.
        ar: يأكل الإندونيسيون الأرز بالملعقة والشوكة.
        en: Indonesians eat rice with a spoon and fork.
      - text: Minta es teh satu gelas!
        ar_eg: واحد شاي بالتلج لو سمحت!
        ar: كوب شاي مثلّج من فضلك!
        en: One glass of iced tea, please!
