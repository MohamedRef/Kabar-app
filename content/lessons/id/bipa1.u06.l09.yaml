  - id: e03
    type: listen
    text: Setiap pagi saya minum susu dan makan roti.
    question:
      ar_eg: بيفطر إيه؟
      ar: ماذا يفطر؟
      en: What does he have for breakfast?
    options: [عيش ولبن, رز وسمك, شاي وكيك]
    answer: 0
    meaning:
      ar_eg: كل يوم الصبح بشرب لبن وباكل عيش.
      ar: كل صباح أشرب الحليب وآكل الخبز.
      en: Every morning I drink milk and eat bread.
    words: [susu, roti]
  - id: e04
    type: fill_blank
    sentence: Minta es teh satu ___!
    meaning:
      ar_eg: واحد شاي بالتلج، ___ لو سمحت!
      ar: ___ شاي مثلّج من فضلك!
      en: One ___ of iced tea, please!
    options: [gelas, piring, pisau]
    answers: [gelas]
    words: [es, gelas, piring, pisau]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الإندونيسيين غالبًا بياكلوا الرز بإيه؟
      ar: بمَ يأكل الإندونيسيون الأرز غالبًا؟
      en: What do Indonesians usually eat rice with?
    options: [sendok dan garpu, pisau dan garpu, gelas dan piring]
    answer: 0
    explain:
      ar_eg: معلقة في اليمين وشوكة في الشمال. السكينة قليل.
      ar: ملعقة في اليمنى وشوكة في اليسرى، والسكين نادر.
      en: A spoon in the right hand and a fork in the left; knives are rare.
    words: [sendok, garpu, pisau, gelas, piring]
  - id: e06
    type: fill_blank
    sentence: Nasi uduk di ___ itu enak.
    meaning:
      ar_eg: الناسي أودوك اللي في ___ ده حلو.
      ar: الناسي أودوك في ذلك ___ لذيذ.
      en: The nasi uduk on that ___ is good.
    options: [piring, gelas, susu]
    answers: [piring]
    words: [piring]
  - id: e07
    type: build_sentence
    source:
      ar_eg: عايز سكينة وشوكة لو سمحت.
      ar: أريد سكينًا وشوكة من فضلك.
      en: I'd like a knife and fork, please.
    answer: Saya minta pisau dan garpu.
    distractors: [roti, es]
    words: [pisau, garpu]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kopi susunya enak, esnya banyak.
    answers_meaning:
      ar_eg: [القهوة باللبن حلوة، والتلج كتير, القهوة باللبن طعمها حلو وفيها تلج كتير]
      ar: [القهوة بالحليب لذيذة، والثلج كثير, قهوة الحليب لذيذة وفيها ثلج كثير]
      en: ['The milk coffee is good, and there''s lots of ice', 'The coffee with milk is tasty, with lots of ice']
    words: [susu, es]
  - id: e09
    type: speaking
    text: Roti ini enak. Minta satu piring lagi!
    meaning:
      ar_eg: العيش ده حلو. عايز طبق كمان لو سمحت!
      ar: هذا الخبز لذيذ. طبقًا آخر من فضلك!
      en: This bread is good. One more plate, please!
    words: [roti, piring]
  - id: e10
    type: multiple_choice
    question: Saya makan nasi memakai ___.
    options: [sendok, gelas, susu]
    answer: 0
    explain:
      ar_eg: 'الرز بيتاكل بالمعلقة: sendok. gelas كوباية وsusu لبن.'
      ar: 'يؤكل الأرز بالملعقة: sendok، أما gelas فكوب وsusu حليب.'
      en: 'Rice is eaten with a spoon: sendok. gelas is a glass and susu milk.'
    words: [sendok, gelas, susu]
dialogue:
  lines:
    - speaker: Pelayan
      text: Selamat pagi, Pak. Mau sarapan apa?
      ar_eg: صباح الخير يا أستاذ. تحب تفطر إيه؟
      ar: صباح الخير يا سيدي. ماذا تريد للفطور؟
      en: Good morning, sir. What would you like for breakfast?
    - speaker: Mohamed
      text: Saya mau roti dan susu.
      ar_eg: عايز عيش ولبن.
      ar: أريد خبزًا وحليبًا.
      en: I'd like bread and milk.
    - speaker: Pelayan
      text: Mau es, Pak?
      ar_eg: تحب تلج يا أستاذ؟
      ar: هل تريد ثلجًا يا سيدي؟
      en: Would you like ice, sir?
    - speaker: Mohamed
      text: Tidak, terima kasih. Minta satu gelas air putih juga.
      ar_eg: لأ، شكرًا. وكوباية مية كمان لو سمحت.
      ar: لا، شكرًا. وكوب ماء أيضًا من فضلك.
      en: No, thanks. And a glass of water too, please.
    - speaker: Pelayan
      text: Baik. Ini piring, sendok, dan garpu.
      ar_eg: حاضر. دا الطبق والمعلقة والشوكة.
      ar: حسنًا. هذا الطبق والملعقة والشوكة.
      en: Sure. Here's a plate, a spoon and a fork.
    - speaker: Mohamed
      text: Terima kasih. Pisaunya di mana?
      ar_eg: شكرًا. والسكينة فين؟
      ar: شكرًا. وأين السكين؟
      en: Thanks. Where's the knife?
