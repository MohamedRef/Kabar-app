      ar: كيف الطقس؟
      en: What's the weather like?
    options: [مشمس وحر, فيه مطر, فيه تلج]
    answer: 0
    meaning:
      ar_eg: السما صافية. والشمس حامية.
      ar: السماء صافية، والشمس حارّة.
      en: The sky is clear. The sun is hot.
    words: [langit, matahari]
  - id: e04
    type: fill_blank
    sentence: Di Indonesia tidak ada ___, tapi ada banyak hujan.
    meaning:
      ar_eg: مفيش ___ في إندونيسيا، بس فيه مطر كتير.
      ar: لا ___ في إندونيسيا، لكن فيها مطر كثير.
      en: There's no ___ in Indonesia, but there's lots of rain.
    options: [salju, burung, pohon]
    answers: [salju]
    words: [salju, burung, pohon]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: air بالإندونيسي معناها مية. طب الهوا اللي بنتنفسه؟
      ar: air بالإندونيسية تعني ماء. فما الهواء الذي نتنفّسه؟
      en: air in Indonesian means water. So what's the air we breathe?
    options: [udara, angin, air]
    answer: 0
    explain:
      ar_eg: udara = الهوا اللي بنتنفسه، angin = ريح، air = مية.
      ar: udara الهواء، وangin الريح، وair الماء.
      en: udara = air, angin = wind, air = water.
    words: [udara, angin]
  - id: e06
    type: fill_blank
    sentence: Ada banyak ___ di pohon itu.
    meaning:
      ar_eg: فيه ___ كتير على الشجرة دي.
      ar: على تلك الشجرة ___ كثيرة.
      en: There are lots of ___ in that tree.
    options: [burung, sungai, angin]
    answers: [burung]
    words: [burung, pohon, sungai]
  - id: e07
    type: build_sentence
    source:
      ar_eg: بنعوم في النهر.
      ar: نسبح في النهر.
      en: We swim in the river.
    answer: Kami berenang di sungai.
    distractors: [pohon, langit]
    words: [sungai]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ada angin di pantai.
    answers_meaning:
      ar_eg: [فيه هوا على البحر, فيه ريح على الشط, فيه هوا على الشط]
      ar: [هناك ريح على الشاطئ, توجد رياح على الشاطئ]
      en: ['There''s wind at the beach', 'It''s windy at the beach', There is wind on the beach]
    words: [angin]
  - id: e09
    type: speaking
    text: Udaranya bagus, langitnya cerah.
    meaning:
      ar_eg: الهوا حلو والسما صافية.
      ar: الهواء جميل والسماء صافية.
      en: The air is nice and the sky is clear.
    words: [udara, langit]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: حاجة بيضا وساقعة بتنزل من السما في الشتا في أوروبا. اسمها إيه؟
      ar: شيء أبيض بارد ينزل من السماء في شتاء أوروبا. ما اسمه؟
      en: Something white and cold falls from the sky in a European winter. What is it?
    options: [salju, matahari, sungai]
    answer: 0
    explain:
      ar_eg: salju = تلج، زي الكلمة العربية.
      ar: salju = ثلج، كالكلمة العربية.
      en: salju = snow, like the Arabic word.
    words: [salju, matahari, sungai]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, bagaimana liburanmu di Bali?
      ar_eg: يا محمد، إجازتك في بالي عاملة إيه؟
      ar: يا محمد، كيف عطلتك في بالي؟
      en: Mohamed, how's your holiday in Bali?
    - speaker: Mohamed
      text: Seru! Cuacanya cerah, mataharinya panas.
      ar_eg: تحفة! الجو صحو والشمس حامية.
      ar: رائعة! الطقس صحو والشمس حارّة.
      en: Great! The weather's clear and the sun is hot.
    - speaker: Ni Luh
      text: Kamu berenang di pantai?
      ar_eg: عمت في البحر؟
      ar: هل سبحت في البحر؟
      en: Did you swim at the beach?
    - speaker: Mohamed
      text: Ya, dan di sungai juga. Ada banyak pohon dan burung.
      ar_eg: أيوه، وفي النهر كمان. فيه شجر وعصافير كتير.
      ar: نعم، وفي النهر أيضًا. هناك أشجار وطيور كثيرة.
      en: Yes, and in the river too. There are lots of trees and birds.
    - speaker: Ni Luh
      text: Di Mesir ada salju?
      ar_eg: في مصر فيه تلج؟
      ar: هل في مصر ثلج؟
      en: Is there snow in Egypt?
    - speaker: Mohamed
      text: Tidak ada! Di Mesir mataharinya panas.
      ar_eg: لأ خالص! في مصر الشمس حامية.
      ar: لا! في مصر الشمس حارّة.
      en: No! In Egypt the sun is hot.
