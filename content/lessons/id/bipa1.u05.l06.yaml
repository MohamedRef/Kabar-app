schema: kabar.lesson/v1
id: bipa1.u05.l06
language: id
title: Langit dan matahari
can_do:
  ar_eg: 'توصف الطبيعة في الإجازة: السما والشمس والهوا والشجر والطيور والنهر.'
  ar: 'أن تصف الطبيعة في العطلة: السماء والشمس والهواء والأشجار والطيور والنهر.'
  en: 'Describe nature on holiday: sky, sun, air, trees, birds and rivers.'
slides:
  - title: Air bukan udara
    body:
      ar_eg: |
        خلي بالك: air بالإندونيسي = مية! أما الهوا اللي بنتنفسه فـ udara، والريح angin.
        matahari = الشمس، وحرفيًا «عين النهار» (mata = عين، hari = يوم).
        langit = السما، pohon = شجرة، burung = عصفورة أو طير، sungai = نهر.
        salju = تلج، من العربي «ثلج». في إندونيسيا مفيش تلج غير على قمة جبل في بابوا.
      ar: |
        انتبه: air في الإندونيسية = ماء! أما الهواء الذي نتنفّسه فـ udara، والريح angin.
        matahari = الشمس، وحرفيًا «عين النهار» (mata = عين، hari = يوم).
        langit = السماء، pohon = شجرة، burung = طائر، sungai = نهر.
        salju = الثلج، من العربية «ثلج»، ولا ثلج في إندونيسيا إلا على قمّة جبل في بابوا.
      en: |
        Careful: air in Indonesian = water! The air you breathe is udara, and wind is angin.
        matahari = the sun, literally "eye of the day" (mata = eye, hari = day).
        langit = sky, pohon = tree, burung = bird, sungai = river.
        salju = snow, from Arabic ثلج. Indonesia has none, except on one mountain top in Papua.
    examples:
      - text: Langitnya cerah, mataharinya panas.
        ar_eg: السما صافية والشمس حامية.
        ar: السماء صافية والشمس حارّة.
        en: The sky is clear and the sun is hot.
      - text: Ada banyak burung di pohon itu.
        ar_eg: فيه عصافير كتير على الشجرة دي.
        ar: على تلك الشجرة طيور كثيرة.
        en: There are lots of birds in that tree.
      - text: Di Indonesia tidak ada salju.
        ar_eg: مفيش تلج في إندونيسيا.
        ar: لا ثلج في إندونيسيا.
        en: There's no snow in Indonesia.
