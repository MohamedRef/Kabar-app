  - id: e03
    type: listen
    text: Dompet saya hilang! Ada kartu dan tiket di dompet itu.
    question:
      ar_eg: إيه اللي ضاع؟
      ar: ما الذي ضاع؟
      en: What's been lost?
    options: [المحفظة, الكاميرا, الشنطة]
    answer: 0
    meaning:
      ar_eg: محفظتي ضاعت! كان فيها كروت وتذكرة.
      ar: ضاعت محفظتي! فيها بطاقات وتذكرة.
      en: My wallet's gone! It had cards and a ticket in it.
    words: [dompet, hilang]
  - id: e04
    type: fill_blank
    sentence: Saya beli ___ baru untuk foto liburan.
    meaning:
      ar_eg: اشتريت ___ جديدة لصور الإجازة.
      ar: اشتريت ___ جديدة لصور العطلة.
      en: I bought a new ___ for holiday photos.
    options: [kamera, rok, celana]
    answers: [kamera]
    words: [kamera]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تشتري حاجة تحط فيها فلوسك. تشتري…؟
      ar: تريد شيئًا تضع فيه نقودك. ماذا تشتري؟
      en: You want something to keep your money in. What do you buy?
    options: [dompet, kaos, video]
    answer: 0
    explain:
      ar_eg: dompet = محفظة. kaos تي شيرت، وvideo فيديو.
      ar: dompet محفظة، أما kaos فقميص وvideo فيديو.
      en: dompet = wallet; kaos is a T-shirt and video a video.
    words: [dompet, kaos, video]
  - id: e06
    type: fill_blank
    sentence: Rina beli ___ batik. Saya beli kaos.
    meaning:
      ar_eg: رينا اشترت ___ باتيك، وأنا اشتريت تي شيرت.
      ar: اشترت رينا ___ باتيك، واشتريت قميصًا.
      en: Rina bought a batik ___. I bought a T-shirt.
    options: [rok, hotel, kamera]
    answers: [rok]
    words: [rok, kaos]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الأوتيل ده جديد وكبير.
      ar: هذا الفندق جديد وكبير.
      en: This hotel is new and big.
    answer: Hotel ini baru dan besar.
    distractors: [video, celana]
    words: [hotel]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kamera saya hilang di hotel.
    answers_meaning:
      ar_eg: [الكاميرا بتاعتي ضاعت في الأوتيل, كاميرتي ضاعت في الأوتيل]
      ar: [ضاعت كاميرتي في الفندق, كاميرتي ضاعت في الفندق]
      en: [My camera got lost at the hotel, I lost my camera at the hotel, My camera went missing at the hotel]
    words: [kamera, hilang, hotel]
  - id: e09
    type: speaking
    text: Di tas saya ada kaos dan celana.
    meaning:
      ar_eg: في شنطتي تي شيرت وبنطلون.
      ar: في حقيبتي قميص وبنطال.
      en: In my bag there's a T-shirt and trousers.
    words: [kaos, celana]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تصوّر حاجة بتتحرك وبالصوت، مش صورة بس. تعمل…؟
      ar: تريد أن تصوّر شيئًا يتحرّك مع الصوت، لا صورة فقط. ماذا تصنع؟
      en: You want to film something moving, with sound, not just a photo. What do you make?
    options: [video, celana, rok]
    answer: 0
    explain:
      ar_eg: video = فيديو. celana بنطلون وrok جيبة.
      ar: video فيديو، أما celana فبنطال وrok تنّورة.
      en: video; celana is trousers and rok a skirt.
    words: [video, celana, rok]
dialogue:
  lines:
    - speaker: Mohamed
      text: Permisi, Mbak. Dompet saya hilang!
      ar_eg: لو سمحتي يا آنسة. محفظتي ضاعت!
      ar: عفوًا يا آنسة. ضاعت محفظتي!
      en: Excuse me, miss. My wallet's gone!
    - speaker: Petugas
      text: Hilang di mana, Pak?
      ar_eg: ضاعت فين يا أستاذ؟
      ar: أين ضاعت يا سيدي؟
      en: Where did you lose it, sir?
    - speaker: Mohamed
      text: Di kolam renang hotel. Ada kartu dan tiket di dompet itu.
      ar_eg: عند حمام السباحة بتاع الأوتيل. كان فيها فلوس وكروت.
      ar: عند مسبح الفندق، وفيها نقود وبطاقات.
      en: At the hotel pool. It's got money and cards in it.
    - speaker: Petugas
      text: Dompetnya besar, Pak?
      ar_eg: المحفظة كبيرة يا أستاذ؟
      ar: هل المحفظة كبيرة يا سيدي؟
      en: Is the wallet big, sir?
    - speaker: Mohamed
      text: Tidak, kecil. Ada foto keluarga saya juga.
      ar_eg: لأ، صغيرة. وفيها صورة عيلتي كمان.
      ar: لا، صغيرة، وفيها صورة عائلتي أيضًا.
      en: No, small. There's a photo of my family in it too.
    - speaker: Petugas
      text: Ini dompetnya, Pak? Ada di loket kami.
      ar_eg: هي دي المحفظة يا أستاذ؟ كانت عندنا في الشباك.
      ar: أهذه محفظتك يا سيدي؟ كانت عندنا عند الشبّاك.
      en: Is this the wallet, sir? It was at our desk.
