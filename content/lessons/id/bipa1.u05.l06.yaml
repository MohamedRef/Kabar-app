schema: kabar.lesson/v1
id: bipa1.u05.l06
language: id
title: Dompet saya hilang!
can_do:
  ar_eg: تتكلم عن شنطة السفر والأوتيل، وتقول إن حاجة ضاعت منك.
  ar: أن تتحدث عن حقيبة السفر والفندق، وتبلّغ عن شيء ضاع منك.
  en: Talk about your holiday bag and hotel, and report something lost.
slides:
  - title: Di tas saya ada…
    body:
      ar_eg: |
        في شنطة الإجازة: kaos (تي شيرت، ومكتوبة كمان kaus)، celana (بنطلون)، rok (جيبة)، dompet (محفظة)، kamera.
        وبتعمل video، وبتنزل في hotel.
        hilang = ضاع أو اختفى: «Dompet saya hilang!» = محفظتي ضاعت!
        ولو ضاعت منك حاجة في الأوتيل، روح للـ petugas واحكي.
      ar: |
        في حقيبة العطلة: kaos (قميص قطني، وتُكتب kaus أيضًا)، وcelana (بنطال)، وrok (تنّورة)، وdompet (محفظة)، وkamera.
        وتصوّر video، وتنزل في hotel.
        hilang = ضاع أو اختفى: «Dompet saya hilang!» = ضاعت محفظتي!
        وإن ضاع منك شيء في الفندق فأخبر الـ petugas.
      en: |
        In your holiday bag: kaos (T-shirt, also spelt kaus), celana (trousers), rok (skirt), dompet (wallet) and a kamera.
        You make a video and stay at a hotel.
        hilang = lost, gone: "Dompet saya hilang!" = My wallet's gone!
        If you lose something at the hotel, tell the petugas.
    examples:
      - text: Di tas saya ada kaos, celana, dan kamera.
        ar_eg: في شنطتي تي شيرت وبنطلون وكاميرا.
        ar: في حقيبتي قميص وبنطال وكاميرا.
        en: In my bag there's a T-shirt, trousers and a camera.
      - text: Dompet saya hilang di hotel!
        ar_eg: محفظتي ضاعت في الأوتيل!
        ar: ضاعت محفظتي في الفندق!
        en: My wallet got lost at the hotel!
      - text: Rina beli rok batik untuk liburan.
        ar_eg: رينا اشترت جيبة باتيك للإجازة.
        ar: اشترت رينا تنّورة باتيك للعطلة.
        en: Rina bought a batik skirt for the holiday.
