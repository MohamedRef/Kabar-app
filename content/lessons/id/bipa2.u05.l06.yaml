      ar: هذا الخبز مع ___ وطماطم.
      en: This bread comes with ___ and tomato.
    options: [keju, permen, madu]
    answers: [keju]
    words: [keju, permen, madu]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: النحل بيعمل إيه؟
      ar: ماذا يصنع النحل؟
      en: What do bees make?
    options: [madu, keju, sayur]
    answer: 0
    explain:
      ar_eg: madu = عسل.
      ar: madu = عسل.
      en: madu = honey.
    words: [madu, keju, sayur]
  - id: e06
    type: fill_blank
    sentence: Dagingnya masih ___, belum matang.
    meaning:
      ar_eg: اللحمة لسه ___، لسه ما استوتش.
      ar: اللحم ما زال ___، لم ينضج بعد.
      en: The meat is still ___, not cooked yet.
    options: [mentah, basi, kompor]
    answers: [mentah]
    words: [mentah, basi, kompor]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الحلة اللي على البوتاجاز لسه سخنة.
      ar: القدر فوق الموقد ما زال ساخنًا.
      en: The pot on the stove is still hot.
    answer: Panci di atas kompor masih panas.
    distractors: [kulkas, sayur]
    words: [kompor]
  - id: e08
    type: translate
    direction: from_target
    source_text: Saya suka sayur mentah. Rasanya segar.
    answers_meaning:
      ar_eg: [بحب الخضار ني. طعمه فريش, بحب الخضار النية. طعمها منعش]
      ar: [أحبّ الخضار نيئة. طعمها منعش]
      en: [I like raw vegetables. They taste fresh, I like vegetables raw. They taste fresh]
    words: [sayur, mentah]
  - id: e09
    type: speaking
    text: Adik saya suka permen dan teh madu.
    meaning:
      ar_eg: أخويا الصغير بيحب البونبوني والشاي بالعسل.
      ar: يحبّ أخي الصغير الحلوى والشاي بالعسل.
      en: My little brother likes sweets and tea with honey.
    words: [permen, madu]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: فين بنحط اللبن عشان يفضل ساقع؟
      ar: أين نضع الحليب ليبقى باردًا؟
      en: Where do we keep milk cold?
    options: [kulkas, kompor, keju]
    answer: 0
    explain:
      ar_eg: kulkas = تلاجة.
      ar: kulkas = ثلاجة.
      en: kulkas = fridge.
    words: [kulkas, kompor]
dialogue:
  lines:
    - speaker: Bu Yanti
      text: Mohamed, ada keju di kulkas?
      ar_eg: يا محمد، فيه جبنة في التلاجة؟
      ar: يا محمد، هل في الثلاجة جبن؟
      en: Mohamed, is there cheese in the fridge?
    - speaker: Mohamed
      text: Ada, Bu. Ada sayur dan madu juga.
      ar_eg: أيوه يا طنط. وفيه خضار وعسل كمان.
      ar: نعم يا سيدتي، وفيها خضار وعسل أيضًا.
      en: Yes. There are vegetables and honey too.
    - speaker: Bu Yanti
      text: Dan nasi kemarin? Sudah basi?
      ar_eg: ورز امبارح؟ باظ؟
      ar: وأرز الأمس؟ هل فسد؟
      en: And yesterday's rice? Has it gone off?
    - speaker: Mohamed
      text: Ya, sudah basi, Bu.
      ar_eg: أيوه، باظ يا طنط.
      ar: نعم، فسد يا سيدتي.
      en: Yes, it's gone off.
    - speaker: Bu Yanti
      text: Tidak apa-apa. Dagingnya masih mentah. Saya memasak di kompor.
      ar_eg: مش مشكلة. اللحمة لسه نية. هطبخها على البوتاجاز.
      ar: لا بأس. اللحم ما زال نيئًا، سأطبخه على الموقد.
      en: Never mind. The meat's still raw. I'll cook it on the stove.
    - speaker: Mohamed
      text: Boleh saya makan permen dulu?
      ar_eg: ينفع آكل بونبوناية الأول؟
      ar: هل يمكنني أن آكل حلوى أولًا؟
      en: Can I have a sweet first?
