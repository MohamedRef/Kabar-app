schema: kabar.lesson/v1
id: bipa2.u05.l06
language: id
title: Kulkas Bu Yanti
can_do:
  ar_eg: 'تتكلم في المطبخ: إيه اللي في التلاجة (جبنة وعسل وخضار)، والبوتاجاز، والأكل ني ولا بايت.'
  ar: 'أن تتحدث في المطبخ: ما في الثلاجة (جبن وعسل وخضار)، والموقد، والطعام نيّء أو فاسد.'
  en: 'Talk in the kitchen: what''s in the fridge (cheese, honey, vegetables), the stove, and whether food is raw or off.'
slides:
  - title: Di dapur
    body:
      ar_eg: |
        kompor = بوتاجاز، kulkas = تلاجة.
        sayur = خضار. keju = جبنة، madu = عسل (teh madu)، permen = بونبوني.
        mentah = ني (عكس matang). basi = بايت وريحته وحشة.
      ar: |
        kompor = موقد، kulkas = ثلاجة.
        sayur = خضار. keju = جبن، madu = عسل (teh madu)، permen = حلوى (سكاكر).
        mentah = نيّء (ضدّ matang). basi = فاسد (بائت).
      en: |
        kompor = stove, kulkas = fridge.
        sayur = vegetables. keju = cheese, madu = honey (teh madu), permen = sweets, candy.
        mentah = raw (the opposite of matang). basi = stale, gone off.
    examples:
      - text: Keju dan sayur ada di kulkas.
        ar_eg: الجبنة والخضار في التلاجة.
        ar: الجبن والخضار في الثلاجة.
        en: The cheese and vegetables are in the fridge.
      - text: Dagingnya masih mentah.
        ar_eg: اللحمة لسه نية.
        ar: اللحم ما زال نيئًا.
        en: The meat is still raw.
      - text: Nasinya sudah basi.
        ar_eg: الرز باظ.
        ar: فسد الأرز.
        en: The rice has gone off.
