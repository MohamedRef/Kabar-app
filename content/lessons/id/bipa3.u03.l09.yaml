schema: kabar.lesson/v1
id: bipa3.u03.l09
language: id
title: Ulasan di internet
can_do:
  ar_eg: تقرا مراجعة فيلم قصيرة على النت وتفهم القصة ورأي الكاتب.
  ar: أن تقرأ مراجعة قصيرة لفيلم على الإنترنت وتفهم القصة ورأي الكاتب.
  en: Read a short online film review and get the plot and the verdict.
slides:
  - title: Ulasan film "Anak Laut"
    grammar: id.confix.men-i
    body:
      ar_eg: |
        نيلوه لقت مراجعة على النت لفيلم «Anak Laut» (ابن البحر). اقراها بالراحة.
        دوّر على: البطل بيحب إيه؟ الصراع بين مين ومين؟ وإيه العيب، وكام نجمة؟
        وخد بالك من menyukai: فعل meN-…-i اللي اتعلمته.
      ar: |
        وجدت نيلوه على الإنترنت مراجعة لفيلم «Anak Laut» (ابن البحر). اقرأها بتمهّل.
        ابحث عن: ماذا يحبّ البطل؟ بين مَن الصراع؟ وما العيب، وكم نجمة؟
        ولاحظ menyukai، وهو فعل على وزن meN-…-i الذي تعلّمته.
      en: |
        Ni Luh found an online review of the film "Anak Laut" (Child of the Sea). Read it slowly.
        Look for: what does the hero love? Who is the conflict between? What's the weak point, and how many stars?
        Notice menyukai, a meN-…-i verb you've learned.
    examples:
      - text: Film Anak Laut bercerita tentang Ari, seorang anak nelayan di Gili Trawangan. Ari sangat menyukai laut.
        ar_eg: فيلم «ابن البحر» بيحكي عن آري، ابن صياد في جيلي تراوانجان. آري بيحب البحر جدًا.
        ar: يحكي فيلم «ابن البحر» عن آري، ابن صيّاد في جيلي تراوانغان. آري يحبّ البحر كثيرًا.
        en: Anak Laut is about Ari, a fisherman's son on Gili Trawangan. Ari really loves the sea.
      - text: Konfliknya antara Ari dan ayahnya, karena ayahnya ingin Ari sekolah di Mataram.
        ar_eg: الصراع بين آري وأبوه، عشان أبوه عايز آري يدرس في ماتارام.
        ar: الصراع بين آري وأبيه، لأنّ أباه يريده أن يدرس في ماتارام.
        en: The conflict is between Ari and his father, because his father wants Ari to go to school in Mataram.
      - text: Alurnya agak pelan, tetapi akhir ceritanya sangat mengharukan. Dari saya, empat bintang!
        ar_eg: الأحداث بطيئة شوية، بس النهاية مؤثرة جدًا. منّي، أربع نجوم!
        ar: الحبكة بطيئة قليلًا، لكنّ النهاية مؤثّرة جدًا. منّي أربع نجوم!
        en: The plot is a bit slow, but the ending is very moving. From me, four stars!
exercises:
  - id: e01
    type: listen
    text: Ari sangat menyukai laut.
    options: ["Ari sangat menyukai laut.", "Ari sangat mencintai ayahnya.", "Ari sangat menakuti laut."]
    answer: 0
    meaning:
      ar_eg: آري بيحب البحر جدًا.
      ar: آري يحبّ البحر كثيرًا.
      en: Ari really loves the sea.
    words: [menyukai]
  - id: e02
    type: listen
    text: Konfliknya antara Ari dan ayahnya, karena ayahnya ingin Ari sekolah di Mataram.
    question:
      ar_eg: أبو آري عايز إيه؟
      ar: ماذا يريد أبو آري؟
      en: What does Ari's father want?
    options: ["Ari menjadi nelayan.", "Ari sekolah di Mataram.", "Ari menonton film."]
    answer: 1
    meaning:
      ar_eg: الصراع بين آري وأبوه، عشان أبوه عايز آري يدرس في ماتارام.
      ar: الصراع بين آري وأبيه، لأنّ أباه يريده أن يدرس في ماتارام.
      en: The conflict is between Ari and his father, because his father wants Ari to go to school in Mataram.
    words: [konflik, sekolah]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: حسب المراجعة، إيه العيب في الفيلم؟
      ar: بحسب المراجعة، ما عيب الفيلم؟
      en: According to the review, what's the film's weak point?
    options: ["Akhir ceritanya.", "Latarnya.", "Alurnya agak pelan."]
    answer: 2
    explain:
      ar_eg: الكاتب قال «Alurnya agak pelan, tetapi…»؛ اللي بعد tetapi (النهاية) هو الحاجة الحلوة.
      ar: قال الكاتب «Alurnya agak pelan, tetapi…»؛ وما بعد tetapi (النهاية) هو الجانب الجيّد.
      en: The writer says "Alurnya agak pelan, tetapi…"; what comes after tetapi (the ending) is the good part.
    words: [alur]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: مين بطل الفيلم؟
      ar: مَن بطل الفيلم؟
      en: Who is the main character?
    options: ["Ayah Ari, seorang nelayan.", "Ari, seorang anak nelayan.", "Seorang guru di kota."]
    answer: 1
    words: [tokoh utama]
    explain:
      ar_eg: النص بيقول البطل آري، ابن صياد. أبوه شخصية تانية، ومفيش مدرس في المدينة هو البطل.
      ar: يذكر النص أن البطل آري، ابن صياد. أما أبوه فشخصية أخرى، وليس البطل معلّمًا في المدينة.
      en: The text says the main character is Ari, a fisherman's son. His father is another character, and no city teacher is the lead.
  - id: e05
    type: match_pairs
    pairs:
      - text: ulasan
        ar_eg: مراجعة، ريفيو
        ar: مراجعة
        en: review
      - text: alur
        ar_eg: أحداث القصة، الحبكة
        ar: الحبكة
        en: plot
      - text: konflik
        ar_eg: صراع، مشكلة
        ar: صراع
        en: conflict
      - text: mengharukan
        ar_eg: مؤثر
        ar: مؤثّر
        en: moving, touching
      - text: menyukai
        ar_eg: يحب
        ar: يحبّ
        en: to like, love
    words: [ulasan, alur, konflik, mengharukan, menyukai]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: الكاتب إدّى الفيلم كام نجمة؟
      ar: كم نجمة أعطى الكاتب الفيلم؟
      en: How many stars does the writer give the film?
    options: [dua, tiga, empat, lima]
    answer: 2
    words: [bintang]
    explain:
      ar_eg: "الكاتب إدّى الفيلم أربع نجوم: empat. dua وtiga وlima مش الرقم اللي في النص."
      ar: "أعطى الكاتب الفيلم أربع نجوم: empat. أما dua وtiga وlima فليست الرقم المذكور."
      en: "The writer gives four stars: empat. dua, tiga and lima aren't the number in the text."
  - id: e07
    type: fill_blank
    sentence: Ari sangat ___ laut, tetapi ayahnya ingin dia sekolah di kota.
    meaning:
      ar_eg: آري بيحب البحر جدًا، بس أبوه عايزه يدرس في المدينة.
      ar: آري يحبّ البحر كثيرًا، لكنّ أباه يريده أن يدرس في المدينة.
      en: Ari really loves the sea, but his father wants him to go to school in the city.
    options: [menyukai, menakuti, menghadiri]
    answers: [menyukai]
    explain:
      ar_eg: menyukai = يحب. menakuti = يخوّف، وmenghadiri = يحضر (حفلة أو اجتماع).
      ar: menyukai = يحبّ. أمّا menakuti فتعني يُخيف، وmenghadiri تعني يحضر (حفلًا أو اجتماعًا).
      en: menyukai = to like. menakuti = to frighten; menghadiri = to attend.
    words: [menyukai, sekolah, kota]
  - id: e08
    type: build_sentence
    source:
      ar_eg: النهاية مؤثرة جدًا.
      ar: النهاية مؤثّرة جدًا.
      en: The ending of the story is very moving.
    answer: Akhir ceritanya sangat mengharukan.
    distractors: [seram, alurnya]
    words: [mengharukan]
    explain:
      ar_eg: «النهاية» = Akhir ceritanya، و«مؤثّرة» = mengharukan. seram = مرعب، وalurnya = أحداثها.
      ar: «النهاية» Akhir ceritanya، و«مؤثّرة» mengharukan. أما seram فـ«مرعب»، وalurnya «حبكتها».
      en: "\"The ending\" is Akhir ceritanya and \"moving\" is mengharukan. seram means scary and alurnya its plot."
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الأحداث بطيئة شوية، بس الفيلم مؤثر جدًا.
      ar: الحبكة بطيئة قليلًا، لكنّ الفيلم مؤثّر جدًا.
      en: The plot is a bit slow, but the film is very moving.
    answers:
      - Alurnya agak pelan, tetapi filmnya sangat mengharukan.
      - Alurnya agak pelan, tetapi filmnya sangat mengharukan
      - Alurnya agak pelan, tapi filmnya sangat mengharukan.
      - Alurnya agak pelan, tapi filmnya sangat mengharukan
      - Alurnya agak pelan, tetapi film ini sangat mengharukan.
      - Alurnya agak pelan, tapi film ini sangat mengharukan.
      - Alurnya agak lambat, tetapi filmnya sangat mengharukan.
      - Alurnya agak lambat, tapi filmnya sangat mengharukan.
    words: [alur, mengharukan]
  - id: e10
    type: multiple_choice
    question: Ayah Ari ingin Ari sekolah di kota.
    question_meaning:
      ar_eg: أبو آري عايزه يدرس فين؟
      ar: أين يريد أبو آري أن يدرس ابنه؟
      en: Where does Ari's father want him to study?
    options: ['Di sekolah di kota.', 'Di laut, menjadi nelayan.', 'Di rumah.']
    answer: 0
    explain:
      ar_eg: sekolah di kota = يدرس في مدرسة في المدينة. kota = مدينة.
      ar: sekolah di kota = يدرس في مدرسة بالمدينة، وkota = مدينة.
      en: sekolah di kota = go to school in the city. kota = city.
    words: [sekolah, kota]
dialogue:
  title: Di kafe Gili Trawangan
  lines:
    - speaker: Ni Luh
      text: Mohamed, aku baca ulasan film Anak Laut di internet.
      ar_eg: محمد، أنا قريت مراجعة فيلم «ابن البحر» على النت.
      ar: يا محمد، قرأت مراجعة فيلم «ابن البحر» على الإنترنت.
      en: Mohamed, I read a review of Anak Laut online.
    - speaker: Mohamed
      text: Oh ya? Film itu cerita tentang apa?
      ar_eg: بجد؟ الفيلم بيحكي عن إيه؟
      ar: حقًّا؟ عمَّ يحكي الفيلم؟
      en: Oh really? What's it about?
    - speaker: Ni Luh
      text: Tentang Ari, anak nelayan yang suka banget sama laut. Ayahnya pengin dia sekolah di Mataram.
      ar_eg: عن آري، ابن صياد بيحب البحر جدًا. وأبوه عايزه يدرس في ماتارام.
      ar: عن آري، ابن صيّاد يحبّ البحر كثيرًا، وأبوه يريده أن يدرس في ماتارام.
      en: About Ari, a fisherman's son who loves the sea. His father wants him to study in Mataram.
    - speaker: Mohamed
      text: Menarik! Ulasannya bagus?
      ar_eg: حلو! المراجعة كويسة؟
      ar: مثير للاهتمام! هل المراجعة جيّدة؟
      en: Interesting! Is the review good?
    - speaker: Ni Luh
      text: Empat bintang. Alurnya agak pelan, tapi akhirnya mengharukan. Nanti malam kita tonton, yuk!
      ar_eg: أربع نجوم. الأحداث بطيئة شوية، بس النهاية مؤثرة. يلا نتفرج عليه النهارده بالليل!
      ar: أربع نجوم. الحبكة بطيئة قليلًا، لكنّ النهاية مؤثّرة. هيّا نشاهده الليلة!
      en: Four stars. The plot is a bit slow, but the ending is moving. Let's watch it tonight!
new_words:
  - word: sekolah
    pos: noun
    ar_eg: مدرسة؛ sekolah di = يدرس في
    ar: مدرسة؛ sekolah di = يدرس في
    en: school; sekolah di = study at
  - word: kota
    pos: noun
    ar_eg: مدينة
    ar: مدينة
    en: city, town
