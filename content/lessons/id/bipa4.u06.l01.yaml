schema: kabar.lesson/v1
id: bipa4.u06.l01
language: id
title: Menarik wisatawan
can_do:
  ar_eg: تتكلم عن فايدة السياحة للاقتصاد بكلمات بتيجي مع بعض.
  ar: أن تتحدث عن فوائد السياحة الاقتصادية بمتلازمات لفظية شائعة.
  en: Talk about tourism's economic benefits with common word partners.
slides:
  - title: Kolokasi = kata yang berteman
    body:
      ar_eg: |
        فيه كلمات بتمشي مع بعض على طول، وده اسمه kolokasi. احفظها حتة واحدة:
        menarik wisatawan = يجذب السياح (menarik من tarik = يشد).
        meningkatkan pendapatan = يزوّد الدخل.
        لو ترجمت حرفي من العربي ساعات تطلع غلط، فخد الحتة كاملة.
      ar: |
        بعض الكلمات تتلازم دائمًا، وهذا يسمى kolokasi. احفظها قطعة واحدة:
        menarik wisatawan = يجذب السياح (menarik من tarik = يسحب).
        meningkatkan pendapatan = يزيد الدخل.
        الترجمة الحرفية من العربية قد تخطئ، فاحفظ التركيب كاملًا.
      en: |
        Some words always travel together: a kolokasi (collocation). Learn them as one chunk:
        menarik wisatawan = attract tourists (menarik comes from tarik, "pull").
        meningkatkan pendapatan = increase income.
        Translating word by word often goes wrong, so keep the whole chunk.
    grammar: id.collocation
    examples:
      - text: Festival budaya menarik banyak wisatawan ke Palu.
        ar_eg: المهرجان الثقافي بيجذب سياح كتير لبالو.
        ar: يجذب المهرجان الثقافي كثيرًا من السياح إلى بالو.
        en: The cultural festival attracts many tourists to Palu.
      - text: Pariwisata dapat meningkatkan pendapatan warga.
        ar_eg: السياحة ممكن تزوّد دخل السكان.
        ar: يمكن للسياحة أن تزيد دخل السكان.
        en: Tourism can increase residents' income.
  - title: Membuka lapangan kerja
    body:
      ar_eg: |
        «يوفّر فرص شغل» بالإندونيسي = membuka lapangan kerja (حرفيًا «يفتح ميادين شغل»).
        و«يفيد» = memberi manfaat bagi … . كلمة manfaat جاية من العربي «منفعة».
      ar: |
        «يوفّر فرص العمل» بالإندونيسية = membuka lapangan kerja (حرفيًا «يفتح ميادين العمل»).
        و«ينفع» = memberi manfaat bagi … . وكلمة manfaat مأخوذة من العربية «منفعة».
      en: |
        "Create jobs" is membuka lapangan kerja (literally "open fields of work").
        "Benefit someone" is memberi manfaat bagi … . manfaat comes from Arabic «منفعة».
    grammar: id.collocation
    examples:
      - text: Hotel baru itu membuka lapangan kerja bagi warga desa.
        ar_eg: الفندق الجديد ده وفّر فرص شغل لأهل القرية.
        ar: وفّر ذلك الفندق الجديد فرص عمل لأهل القرية.
        en: That new hotel created jobs for the village residents.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wisatawan
        ar_eg: سايح
        ar: سائح
        en: tourist
      - text: pendapatan
        ar_eg: دخل (فلوس)
        ar: دخل
        en: income
      - text: lapangan kerja
        ar_eg: فرص شغل
        ar: فرص العمل
        en: jobs
      - text: warga
        ar_eg: السكان / أهل البلد
        ar: السكان
        en: residents
      - text: manfaat
        ar_eg: فايدة
        ar: منفعة
        en: benefit
    words: [wisatawan, pendapatan, lapangan kerja, warga, manfaat]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي تعبير معناه «يجذب السياح»؟
      ar: أيّ تعبير يعني «يجذب السياح»؟
      en: Which phrase means "attract tourists"?
    options: [membuka wisatawan, menarik wisatawan, mengambil wisatawan]
    answer: 1
    explain:
      ar_eg: menarik (يشد) هو اللي بيمشي مع wisatawan وperhatian.
      ar: menarik (يجذب) هو الفعل المتلازم مع wisatawan وperhatian.
      en: menarik (pull, attract) is the verb that goes with wisatawan and perhatian.
    words: [menarik, wisatawan]
  - id: e03
    type: listen
    text: Pariwisata meningkatkan pendapatan warga.
    options: ["Pariwisata menurunkan pendapatan warga.", "Pariwisata meningkatkan pendapatan negara.", "Pariwisata meningkatkan pendapatan warga."]
    answer: 2
    meaning:
      ar_eg: السياحة بتزوّد دخل السكان.
      ar: السياحة تزيد دخل السكان.
      en: Tourism increases residents' income.
    words: [meningkatkan, pendapatan, warga]
  - id: e04
    type: fill_blank
    sentence: Hotel baru itu ___ lapangan kerja bagi warga desa.
    meaning:
      ar_eg: الفندق الجديد ده وفّر فرص شغل لأهل القرية.
      ar: وفّر ذلك الفندق الجديد فرص عمل لأهل القرية.
      en: That new hotel created jobs for the village residents.
    options: [menarik, membuka, meningkatkan]
    answers: [membuka]
    explain:
      ar_eg: lapangan kerja صاحبها membuka (يفتح)، مش menarik.
      ar: lapangan kerja تتلازم مع membuka (يفتح)، لا مع menarik.
      en: lapangan kerja partners with membuka (open), not menarik.
    words: [lapangan kerja, warga]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك بيقول إن السياح مش بيفيدوا بالو بحاجة. إنت مش موافق. تقول إيه؟
      ar: يقول صديقك إن السياح لا ينفعون بالو بشيء، وأنت لا توافقه. ماذا تقول؟
      en: Your friend says tourists bring nothing good to Palu. You disagree. What do you say?
    options: ["Wisatawan memberi manfaat bagi warga.", "Wisatawan membuka manfaat bagi warga.", "Wisatawan menarik manfaat bagi warga."]
    answer: 0
    explain:
      ar_eg: الفعل اللي بيمشي مع manfaat هنا هو memberi (يدي).
      ar: الفعل المتلازم مع manfaat هنا هو memberi (يعطي).
      en: The verb partner of manfaat here is memberi (give).
    words: [manfaat, wisatawan, warga]
  - id: e06
    type: build_sentence
    source:
      ar_eg: السياحة بتوفّر فرص شغل وبتزوّد دخل السكان.
      ar: توفّر السياحة فرص العمل وتزيد دخل السكان.
      en: Tourism creates jobs and increases residents' income.
    answer: Pariwisata membuka lapangan kerja dan meningkatkan pendapatan warga.
    distractors: [menarik, memberi]
    words: [lapangan kerja, meningkatkan, pendapatan, warga]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المهرجان ده بيجذب سياح كتير وبيزوّد دخل السكان.
      ar: يجذب هذا المهرجان كثيرًا من السياح ويزيد دخل السكان.
      en: This festival attracts many tourists and increases residents' income.
    answers:
      - Festival ini menarik banyak wisatawan dan meningkatkan pendapatan warga.
      - Festival ini menarik banyak wisatawan dan meningkatkan pendapatan warga
      - Festival ini menarik banyak turis dan meningkatkan pendapatan warga.
      - Festival ini menarik banyak wisatawan dan menaikkan pendapatan warga.
      - Festival ini menarik banyak wisatawan serta meningkatkan pendapatan warga.
      - Festival ini menarik banyak wisatawan dan meningkatkan pendapatan penduduk.
    words: [menarik, wisatawan, meningkatkan]
  - id: e08
    type: speaking
    text: Festival budaya menarik wisatawan dan memberi manfaat bagi warga.
    meaning:
      ar_eg: المهرجان الثقافي بيجذب السياح وبيفيد السكان.
      ar: يجذب المهرجان الثقافي السياح وينفع السكان.
      en: The cultural festival attracts tourists and benefits residents.
    words: [menarik, wisatawan, manfaat, warga]
dialogue:
  title: Hotel baru di Palu
  lines:
    - speaker: Mohamed
      text: Mas Rizal, kenapa banyak hotel baru di Palu?
      ar_eg: يا رزال، ليه فيه فنادق جديدة كتير في بالو؟
      ar: يا رزال، لماذا توجد فنادق جديدة كثيرة في بالو؟
      en: Rizal, why are there so many new hotels in Palu?
    - speaker: Mas Rizal
      text: Karena festival dan pantai di sini menarik banyak wisatawan.
      ar_eg: عشان المهرجانات والشطوط هنا بتجذب سياح كتير.
      ar: لأن المهرجانات والشواطئ هنا تجذب كثيرًا من السياح.
      en: Because the festivals and beaches here attract a lot of tourists.
    - speaker: Mohamed
      text: Apakah warga juga mendapat manfaat?
      ar_eg: وهل السكان كمان بيستفيدوا؟
      ar: وهل يستفيد السكان أيضًا؟
      en: Do the residents benefit too?
    - speaker: Mas Rizal
      text: Tentu. Pariwisata membuka lapangan kerja dan meningkatkan pendapatan warga.
      ar_eg: أكيد. السياحة بتوفّر فرص شغل وبتزوّد دخل الناس.
      ar: بالتأكيد. توفّر السياحة فرص العمل وتزيد دخل السكان.
      en: Of course. Tourism creates jobs and increases residents' income.
new_words:
  - word: wisatawan
    pos: noun
    ar_eg: سايح
    ar: سائح
    en: tourist
  - word: menarik
    pos: verb
    ar_eg: يجذب (وكمان «ممتع» كصفة)
    ar: "يجذب (وكصفة: ممتع)"
    en: to attract (as an adjective, interesting)
  - word: meningkatkan
    pos: verb
    ar_eg: يزوّد / يرفع
    ar: يزيد / يرفع
    en: to increase, to raise
  - word: pendapatan
    pos: noun
    ar_eg: دخل
    ar: دخل
    en: income
  - word: lapangan kerja
    pos: noun
    ar_eg: فرص شغل
    ar: فرص العمل
    en: jobs, employment
  - word: warga
    pos: noun
    ar_eg: سكان / مواطنين
    ar: سكان / مواطنون
    en: residents, citizens
  - word: manfaat
    pos: noun
    ar_eg: فايدة
    ar: منفعة، فائدة
    en: benefit
    arabic: منفعة
