schema: kabar.lesson/v1
id: bipa5.u04.l06
language: id
title: Sehari di kampus
can_do:
  ar_eg: 'تتكلم عن يوم في الجامعة: الندوة والكانتين واللوكر، الطالبات والقراية والقوانين، والكلام عن موضوع معين.'
  ar: 'أن تتحدث عن يوم في الجامعة: الندوة والمقصف والخزانة، والطالبات والقراءات والصيغ، والحديث حول موضوع.'
  en: 'Talk about a day on campus: the seminar, canteen and locker, students, readings and formulas, and topics.'
slides:
  - title: Kehidupan mahasiswa
    body:
      ar_eg: |
        seminar = ندوة، kantin = كانتين (مطعم الكلية)، loker = لوكر (دولاب صغير بقفل).
        mahasiswi = طالبة جامعة (mahasiswa للولد أو للكل)، bacaan = قراية، حاجة للقراية (bacaan wajib = قراية إجبارية).
        rumus = قانون رياضي أو معادلة (rumus matematika)، intelektual = مثقف، فكري.
        seputar = حوالين، عن: seputar pendidikan = عن التعليم.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: nggak = tidak، banget = sekali، udah = sudah، aku = saya، siapin = menyiapkan، terus = lalu، ketemu = bertemu.
      ar: |
        seminar = ندوة، kantin = مقصف، loker = خزانة صغيرة بقفل.
        mahasiswi = طالبة جامعية (mahasiswa للذكر أو للجميع)، bacaan = مادة للقراءة (bacaan wajib = قراءة إلزامية).
        rumus = صيغة، معادلة (rumus matematika)، intelektual = مثقّف، فكري.
        seputar = حول، عن: seputar pendidikan = حول التعليم.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: nggak = tidak، banget = sekali، udah = sudah، aku = saya، siapin = menyiapkan، terus = lalu، ketemu = bertemu.
      en: |
        seminar = seminar, kantin = canteen, loker = locker.
        mahasiswi = female university student (mahasiswa for a male or anyone), bacaan = reading, reading material (bacaan wajib = required reading).
        rumus = formula (rumus matematika), intelektual = intellectual.
        seputar = around, about: seputar pendidikan = on education.
        The dialogue uses street forms; the formal ones are beside them: nggak = tidak, banget = sekali, udah = sudah, aku = saya, siapin = menyiapkan, terus = lalu, ketemu = bertemu.
    examples:
      - text: Ada seminar seputar pendidikan pesantren di aula.
        ar_eg: فيه ندوة عن تعليم البيسانترين في القاعة.
        ar: هناك ندوة حول التعليم في المعاهد الإسلامية في القاعة.
        en: There's a seminar on pesantren education in the hall.
      - text: Mahasiswi itu menyimpan buku di loker.
        ar_eg: الطالبة دي بتحط كتبها في اللوكر.
        ar: تحفظ تلك الطالبة كتبها في الخزانة.
        en: That student keeps her books in a locker.
      - text: Bacaan minggu ini banyak sekali rumusnya.
        ar_eg: قراية الأسبوع ده مليانة قوانين.
        ar: قراءة هذا الأسبوع مليئة بالصيغ.
        en: This week's reading is full of formulas.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: seminar
        ar_eg: ندوة
        ar: ندوة
        en: seminar
      - text: kantin
        ar_eg: كانتين
        ar: مقصف
        en: canteen
      - text: loker
        ar_eg: لوكر
        ar: خزانة
        en: locker
      - text: mahasiswi
        ar_eg: طالبة جامعة
        ar: طالبة جامعية
        en: female student
    words: [seminar, kantin, loker, mahasiswi]
  - id: e02
    type: match_pairs
    pairs:
      - text: bacaan
        ar_eg: قراية
        ar: مادة للقراءة
        en: reading
      - text: rumus
        ar_eg: قانون رياضي
        ar: صيغة، معادلة
        en: formula
      - text: intelektual
        ar_eg: مثقف
        ar: مثقّف
        en: intellectual
      - text: seputar
        ar_eg: حوالين، عن
        ar: حول
        en: around, about
    words: [bacaan, rumus, intelektual, seputar]
  - id: e03
    type: listen
    text: Kita makan siang di kantin saja, ya.
    question:
      ar_eg: هيتغدوا فين؟
      ar: أين سيتغدّون؟
      en: Where will they have lunch?
    options: [في الكانتين, في البيت, في المطعم الغالي]
    answer: 0
    meaning:
      ar_eg: خلينا نتغدى في الكانتين وخلاص.
      ar: لنتغدَّ في المقصف فحسب.
      en: Let's just have lunch in the canteen.
    words: [kantin]
  - id: e04
    type: fill_blank
    sentence: Kunci ___ saya hilang, jadi buku saya tidak bisa diambil.
    meaning:
      ar_eg: مفتاح ___ ضاع، فمش عارف أطلّع كتبي.
      ar: ضاع مفتاح ___ي، فلا أستطيع أخذ كتبي.
      en: I've lost my ___ key, so I can't get my books.
    options: [loker, rumus, seminar]
    answers: [loker]
    words: [loker, rumus, seminar]
    explain:
      ar_eg: المفتاح لـ loker (دولاب بقفل) والكتب جواه. rumus = معادلة وseminar = ندوة، مالهمش مفتاح.
      ar: المفتاح لـ loker (خزانة) والكتب بداخلها. أما rumus فالمعادلة، وseminar الندوة، ولا مفاتيح لهما.
      en: The key is for a loker with the books inside. A rumus (formula) or seminar has no key.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي بيحب الأفكار والكتب والنقاش العميق نقول عليه إيه؟
      ar: ماذا نسمّي من يحبّ الأفكار والكتب والنقاش العميق؟
      en: What do we call someone who loves ideas, books and deep discussion?
    options: [mahasiswi, intelektual, kantin]
    answer: 1
    explain:
      ar_eg: intelektual = مثقف.
      ar: intelektual = مثقّف.
      en: intelektual = intellectual.
    words: [mahasiswi, intelektual, kantin]
  - id: e06
    type: fill_blank
    sentence: Dosen memberi daftar ___ wajib untuk ujian.
    meaning:
      ar_eg: الدكتور إدّانا لستة ___ إجبارية للامتحان.
      ar: أعطى الأستاذ قائمة ___ إلزامية للامتحان.
      en: The lecturer gave a list of required ___ for the exam.
    options: [bacaan, seputar, loker]
    answers: [bacaan]
    words: [bacaan, seputar, loker]
    explain:
      ar_eg: لستة «قراءات» = bacaan. seputar = «حوالين/عن» وloker = دولاب، ومش حاجة بتتقري.
      ar: قائمة «قراءات» = bacaan. أما seputar فـ«حول»، وloker الخزانة.
      en: A list of readings is bacaan. seputar ("about") and loker (locker) aren't readings.
  - id: e07
    type: multiple_choice
    question: Luas lingkaran dihitung dengan ___ πr².
    options: [seputar, bacaan, rumus]
    answer: 2
    explain:
      ar_eg: rumus = قانون أو معادلة.
      ar: rumus = صيغة، معادلة.
      en: rumus = formula.
    words: [seputar, bacaan, rumus]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الندوة دي عن التعليم في كاليمانتان.
      ar: تدور هذه الندوة حول التعليم في كاليمانتان.
      en: This seminar is about education in Kalimantan.
    answer: Seminar ini seputar pendidikan di Kalimantan.
    distractors: [kantin, rumus]
    words: [seminar, seputar]
    explain:
      ar_eg: «عن» = seputar. kantin = كافيتريا وrumus = معادلة، مش في الجملة.
      ar: «حول» = seputar. أما kantin فالمقصف، وrumus المعادلة.
      en: "\"About\" here is seputar. kantin (canteen) and rumus (formula) aren't in it."
  - id: e09
    type: translate
    direction: from_target
    source_text: Mahasiswi itu sangat intelektual.
    answers_meaning:
      ar_eg: [الطالبة دي مثقفة جدًا, البنت دي في الجامعة ومثقفة أوي]
      ar: [تلك الطالبة مثقّفة جدًا, هذه الطالبة الجامعية مثقّفة للغاية]
      en: [That student is very intellectual, That university student is highly intellectual]
    words: [mahasiswi, intelektual]
  - id: e10
    type: speaking
    text: Sesudah seminar, kita ke kantin.
    meaning:
      ar_eg: بعد الندوة نروح الكانتين.
      ar: بعد الندوة نذهب إلى المقصف.
      en: After the seminar, we'll go to the canteen.
    words: [seminar, kantin]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kamu ikut seminar di Universitas Kutai pagi ini, nggak?
      ar_eg: يا محمد، هتحضر الندوة في جامعة كوتاي الصبح ده؟
      ar: يا محمد، هل ستحضر الندوة في جامعة كوتاي هذا الصباح؟
      en: Mohamed, are you going to the seminar at Kutai University this morning?
    - speaker: Mohamed
      text: Ikut. Temanya seputar pesantren sama Al-Azhar.
      ar_eg: أيوه. الموضوع عن البيسانترين والأزهر.
      ar: نعم. موضوعها حول المعاهد الإسلامية والأزهر.
      en: Yes. The theme is pesantren and Al-Azhar.
    - speaker: Rina
      text: Pembicaranya mahasiswi S3. Katanya intelektual banget.
      ar_eg: المتحدثة طالبة دكتوراه. بيقولوا عليها مثقفة أوي.
      ar: المتحدثة طالبة دكتوراه، ويُقال إنها مثقّفة جدًا.
      en: The speaker is a PhD student. People say she's very intellectual.
    - speaker: Mohamed
      text: Bacaannya udah aku siapin. Untungnya nggak ada rumus!
      ar_eg: أنا جهزت القراية. ومافيهاش قوانين رياضة، الحمد لله!
      ar: جهّزت القراءات. ولا توجد صيغ رياضية، لحسن الحظ!
      en: I've prepared the reading. No formulas, luckily!
    - speaker: Rina
      text: Taruh tasmu di loker, terus kita ketemu di kantin jam dua belas, ya.
      ar_eg: حط شنطتك في اللوكر، وبعدين نتقابل في الكانتين الساعة اتناشر.
      ar: ضع حقيبتك في الخزانة، ثم نلتقي في المقصف الساعة الثانية عشرة.
      en: Put your bag in a locker, then we'll meet in the canteen at twelve.
