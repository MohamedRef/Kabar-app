  - id: e03
    type: listen
    text: Suster datang setiap pagi untuk melihat pasien.
    question:
      ar_eg: مين بييجي كل يوم الصبح؟
      ar: من يأتي كل صباح؟
      en: Who comes every morning?
    options: [الممرضة, الدكتور, أندي]
    answer: 0
    meaning:
      ar_eg: الممرضة بتيجي كل يوم الصبح تكشف على العيانين.
      ar: تأتي الممرّضة كل صباح لتفحص المرضى.
      en: The nurse comes every morning to check the patients.
    words: [suster]
  - id: e04
    type: fill_blank
    sentence: Kakinya patah. Dia perlu operasi ___.
    meaning:
      ar_eg: رجله اتكسرت. محتاج عملية ___.
      ar: انكسرت ساقه. يحتاج إلى عملية ___.
      en: His leg is broken. He needs ___.
    options: [bedah, saraf, suster]
    answers: [bedah]
    words: [bedah, saraf, suster]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الحالة بقت أوحش من امبارح. بالإندونيسي؟
      ar: صارت الحالة أسوأ من الأمس. بالإندونيسية؟
      en: The condition is worse than yesterday. In Indonesian?
    options: [Keadaannya membaik., Keadaannya memburuk., Keadaannya pulih.]
    answer: 1
    explain:
      ar_eg: memburuk = بيسوء. membaik = بيتحسّن.
      ar: memburuk = يسوء، وmembaik = يتحسّن.
      en: memburuk = gets worse; membaik = improves.
    words: [membaik, memburuk, pulih]
  - id: e06
    type: fill_blank
    sentence: Setelah dua bulan, cederanya sudah ___.
    meaning:
      ar_eg: بعد شهرين، الإصابة ___ خلاص.
      ar: بعد شهرين ___ من إصابته.
      en: After two months, the injury has ___.
    options: [pulih, dirawat, cedera]
    answers: [pulih]
    words: [pulih, dirawat, cedera]
  - id: e07
    type: multiple_choice
    question: Tangannya terasa mati karena ada masalah ___.
    question_meaning:
      ar_eg: إيده مش حاسس بيها عشان فيه مشكلة في ___.
      ar: لا يشعر بيده بسبب مشكلة في ___.
      en: His hand feels numb because of a ___ problem.
    options: [suster, bedah, saraf]
    answer: 2
    explain:
      ar_eg: saraf = أعصاب.
      ar: saraf = الأعصاب.
      en: saraf = nerves.
    words: [suster, bedah, saraf]
  - id: e08
    type: build_sentence
    source:
      ar_eg: هو اتعالج في المستشفى بعد الإصابة.
      ar: عولج في المستشفى بعد الإصابة.
      en: He was treated in hospital after the injury.
    answer: Dia dirawat di rumah sakit setelah cedera.
    distractors: [memburuk, suster]
    words: [dirawat, cedera, memburuk, suster]
  - id: e09
    type: translate
    direction: from_target
    source_text: Keadaan pasien itu membaik setelah operasi bedah.
    answers_meaning:
      ar_eg: [حالة العيان ده اتحسنت بعد العملية, العيان حالته بقت أحسن بعد الجراحة]
      ar: [تحسّنت حالة ذلك المريض بعد العملية الجراحية, تحسّن المريض بعد الجراحة]
      en: ['That patient''s condition improved after surgery', The patient got better after the operation]
    words: [membaik, bedah]
  - id: e10
    type: speaking
    text: Semoga cederamu cepat pulih dan tidak memburuk.
    meaning:
      ar_eg: ربنا يخليك تخف من الإصابة بسرعة وما تسوءش.
      ar: أتمنى أن تتعافى من إصابتك سريعًا ولا تسوء.
      en: I hope your injury heals quickly and doesn't get worse.
    words: [cedera, pulih, memburuk, saraf, dirawat]
dialogue:
  lines:
    - speaker: Mohamed
      text: Andi! Saya dengar kamu cedera waktu main bola.
      ar_eg: أندي! سمعت إنك اتصبت وإنت بتلعب كورة.
      ar: أندي! سمعت أنك أُصبت أثناء لعب الكرة.
      en: Andi! I heard you got injured playing football.
    - speaker: Andi
      text: Ya, lutut saya. Saya dirawat di sini sejak Senin.
      ar_eg: أيوه، ركبتي. أنا محجوز هنا من يوم الاتنين.
      ar: نعم، ركبتي. أنا أُعالَج هنا منذ الإثنين.
      en: Yes, my knee. I've been in here since Monday.
    - speaker: Mohamed
      text: Perlu operasi bedah?
      ar_eg: محتاج عملية؟
      ar: هل تحتاج إلى عملية جراحية؟
      en: Do you need surgery?
    - speaker: Andi
      text: Sudah, kemarin. Untung sarafnya tidak kena. Sekarang sudah membaik.
      ar_eg: عملتها امبارح. الحمد لله الأعصاب ما اتأثرتش. ودلوقتي أحسن.
      ar: أُجريت أمس. لحسن الحظ الأعصاب سليمة، والآن أنا أفضل.
      en: I had it yesterday. Luckily the nerves weren't hit. I'm better now.
    - speaker: Mohamed
      text: Syukurlah. Semoga cepat pulih! Suster di sini baik?
      ar_eg: الحمد لله. ربنا يشفيك بسرعة! الممرضات هنا كويسين؟
      ar: الحمد لله. أتمنى لك شفاءً عاجلًا! هل الممرضات هنا لطيفات؟
      en: Thank God. Get well soon! Are the nurses nice here?
