schema: kabar.lesson/v1
id: bipa4.u07.l05
language: id
title: Cedera di lapangan
can_do:
  ar_eg: 'تحكي عن إصابة في الماتش: العملية، الحجز في المستشفى، والتحسّن.'
  ar: 'أن تروي إصابة في مباراة: الجراحة والعلاج في المستشفى والتعافي.'
  en: 'Tell about a sports injury: surgery, a hospital stay and recovery.'
slides:
  - title: Di rumah sakit
    body:
      ar_eg: |
        cedera = إصابة (cedera lutut = إصابة في الركبة)، bedah = جراحة (operasi bedah، dokter bedah).
        dirawat = اتحجز واتعالج (dirawat di rumah sakit)، suster = ممرضة (كلمة يومية لـ perawat).
        saraf = أعصاب، عصب، membaik = بيتحسّن، memburuk = بيسوء، pulih = خف ورجع زي الأول.
      ar: |
        cedera = إصابة (cedera lutut = إصابة في الركبة)، bedah = جراحة (operasi bedah، dokter bedah).
        dirawat = يُعالَج في المستشفى (dirawat di rumah sakit)، suster = ممرّضة (كلمة يومية بمعنى perawat).
        saraf = عصب، membaik = يتحسّن، memburuk = يسوء، pulih = تعافى.
      en: |
        cedera = injury (cedera lutut = knee injury), bedah = surgery (operasi bedah, dokter bedah).
        dirawat = to be treated, hospitalised (dirawat di rumah sakit); suster = nurse (everyday word for perawat).
        saraf = nerve, membaik = to improve, memburuk = to get worse, pulih = to recover.
    examples:
      - text: Andi mengalami cedera lutut saat bermain bola.
        ar_eg: أندي اتصاب في ركبته وهو بيلعب كورة.
        ar: أُصيب أندي في ركبته أثناء لعب الكرة.
        en: Andi injured his knee playing football.
      - text: Dia dirawat di rumah sakit selama tiga hari.
        ar_eg: اتحجز في المستشفى تلات أيام.
        ar: عولج في المستشفى ثلاثة أيام.
        en: He was in hospital for three days.
      - text: Keadaannya makin membaik.
        ar_eg: حالته بتتحسن.
        ar: حالته تتحسّن أكثر فأكثر.
        en: His condition is getting better and better.
