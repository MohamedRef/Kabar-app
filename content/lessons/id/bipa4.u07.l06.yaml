schema: kabar.lesson/v1
id: bipa4.u07.l06
language: id
title: Musim flu di kampus
can_do:
  ar_eg: تفرّق بين الفيروس والبكتيريا والحساسية وتنصح حد يلبس كمامة.
  ar: أن تميّز بين الإنفلونزا والعدوى البكتيرية والحساسية وتنصح بارتداء الكمامة.
  en: Tell flu, bacterial infection and allergy apart, and advise someone to wear a mask.
slides:
  - title: Kuliah dokter Fitri
    body:
      ar_eg: |
        vaksin = لقاح، تطعيم، wabah = وباء (wabah flu)، masker = كمامة.
        infeksi = عدوى، التهاب (infeksi telinga)، terinfeksi = اتعدى، bakteri = بكتيريا.
        jarum = إبرة (jarum suntik)، kedokteran = الطب (fakultas kedokteran = كلية الطب).
      ar: |
        vaksin = لقاح، تطعيم، wabah = وباء (wabah flu)، masker = كمامة.
        infeksi = عدوى، التهاب (infeksi telinga)، terinfeksi = أُصيب بالعدوى، bakteri = بكتيريا.
        jarum = إبرة (jarum suntik)، kedokteran = الطب (fakultas kedokteran = كلية الطب).
      en: |
        vaksin = vaccine, wabah = epidemic, outbreak (wabah flu), masker = face mask.
        infeksi = infection (infeksi telinga), terinfeksi = infected, bakteri = bacteria.
        jarum = needle (jarum suntik), kedokteran = medicine (fakultas kedokteran = medical school).
    examples:
      - text: Banyak mahasiswa kena flu minggu ini.
        ar_eg: طلبة كتير جالهم إنفلونزا الأسبوع ده.
        ar: أصيب طلاب كثيرون بالإنفلونزا هذا الأسبوع.
        en: Many students have caught the flu this week.
      - text: Antibiotik untuk bakteri, bukan untuk flu.
        ar_eg: المضاد الحيوي للبكتيريا، مش للإنفلونزا.
        ar: المضاد الحيوي للبكتيريا لا للإنفلونزا.
        en: Antibiotics are for bacteria, not for flu.
      - text: Pakai masker kalau kamu batuk.
        ar_eg: البس كمامة لو بتكح.
        ar: ارتدِ كمامة إذا كنت تسعل.
        en: Wear a mask if you're coughing.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: vaksin
        ar_eg: تطعيم
        ar: لقاح
        en: vaccine
      - text: wabah
        ar_eg: وباء
        ar: وباء
        en: epidemic
      - text: masker
        ar_eg: كمامة
        ar: كمامة
        en: face mask
      - text: jarum
        ar_eg: إبرة
        ar: إبرة
        en: needle
    words: [vaksin, wabah, masker, jarum]
  - id: e02
    type: match_pairs
    pairs:
      - text: infeksi
        ar_eg: عدوى، التهاب
        ar: عدوى
        en: infection
      - text: terinfeksi
        ar_eg: اتعدى
        ar: أُصيب بالعدوى
        en: infected
      - text: bakteri
        ar_eg: بكتيريا
        ar: بكتيريا
        en: bacteria
      - text: kedokteran
        ar_eg: الطب
        ar: الطب
        en: medicine
    words: [infeksi, terinfeksi, bakteri, kedokteran]
  - id: e03
    type: listen
    text: Adik saya kuliah di fakultas kedokteran.
    question:
      ar_eg: أخوه بيدرس فين؟
      ar: أين يدرس أخوه؟
      en: Where does his brother study?
    options: [كلية الطب, كلية التجارة, مدرسة]
    answer: 0
    meaning:
      ar_eg: أخويا الصغير بيدرس في كلية الطب.
      ar: يدرس أخي الأصغر في كلية الطب.
      en: My younger brother studies at medical school.
    words: [kedokteran]
  - id: e04
    type: fill_blank
    sentence: Anak-anak mendapat ___ di puskesmas supaya tidak sakit.
    meaning:
      ar_eg: العيال بياخدوا ___ في الوحدة الصحية عشان ما يعيوش.
      ar: يتلقّى الأطفال ___ في المركز الصحي كي لا يمرضوا.
      en: The children get a ___ at the health centre so they don't get ill.
    options: [vaksin, jarum, masker]
    answers: [vaksin]
    words: [vaksin, jarum, masker]
    explain:
      ar_eg: vaksin = تطعيم، وده عشان مايعيّوش. jarum = إبرة، وmasker = كمامة.
      ar: vaksin = اللقاح، وهو ما يقيهم المرض. أما jarum فالإبرة، وmasker الكمامة.
      en: A vaksin (vaccine) keeps them from getting ill. jarum is a needle, and masker is a mask.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حاجة بتلبسها على بقك ومناخيرك. ده إيه؟
      ar: شيء تضعه على فمك وأنفك. ما هو؟
      en: Something you wear over your mouth and nose. What is it?
    options: [bakteri, masker, infeksi]
    answer: 1
    explain:
      ar_eg: masker = كمامة.
      ar: masker = كمامة.
      en: masker = face mask.
    words: [bakteri, masker, infeksi]
  - id: e06
    type: fill_blank
    sentence: Lukanya merah dan panas. Mungkin ada ___.
    meaning:
      ar_eg: الجرح أحمر وسخن. يمكن فيه ___.
      ar: الجرح أحمر وساخن. ربما هناك ___.
      en: The wound is red and hot. Maybe there's an ___.
    options: [infeksi, flu, kedokteran]
    answers: [infeksi]
    words: [infeksi, flu, kedokteran]
    explain:
      ar_eg: infeksi = التهاب أو عدوى، والجرح الأحمر السخن علامته. flu = برد، وkedokteran = طب.
      ar: infeksi = العدوى، والجرح الأحمر الساخن علامتها. أما flu فالإنفلونزا، وkedokteran الطب.
      en: infeksi is an infection; a red, hot wound is the sign. flu is flu, and kedokteran is medicine as a field.
  - id: e07
    type: multiple_choice
    question: Tahun itu ada ___ kolera di banyak kota.
    options: [masker, jarum, wabah]
    answer: 2
    explain:
      ar_eg: wabah = وباء.
      ar: wabah = وباء.
      en: wabah = epidemic.
    words: [masker, jarum, wabah]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ناس كتير اتعدوا بالفيروس ده.
      ar: أُصيب كثيرون بهذا الفيروس.
      en: Many people were infected with this virus.
    answer: Banyak orang terinfeksi virus ini.
    distractors: [bakteri, wabah]
    words: [terinfeksi, bakteri, wabah]
    explain:
      ar_eg: terinfeksi = اتعدى، والفيروس هو السبب. bakteri = بكتيريا، وwabah = وباء، ومش في الجملة.
      ar: terinfeksi = أُصيب بالعدوى، والفيروس هو السبب. أما bakteri فالبكتيريا، وwabah الوباء، وليسا في الجملة.
      en: terinfeksi means infected, by the virus. bakteri and wabah (epidemic) aren't in the sentence.
  - id: e09
    type: translate
    direction: from_target
    source_text: Flu disebabkan virus, bukan bakteri.
    answers_meaning:
      ar_eg: [الإنفلونزا سببها فيروس، مش بكتيريا, اللي بيعمل الإنفلونزا فيروس مش بكتيريا]
      ar: [تسبب الإنفلونزا فيروسات لا بكتيريا, سبب الإنفلونزا فيروس وليس بكتيريا]
      en: ['Flu is caused by a virus, not bacteria', 'A virus, not bacteria, causes flu']
    words: [flu, bakteri]
  - id: e10
    type: speaking
    text: Kalau terinfeksi flu, pakai masker dan istirahat.
    meaning:
      ar_eg: لو جالك إنفلونزا، البس كمامة وارتاح.
      ar: إذا أُصبت بالإنفلونزا فارتدِ كمامة واسترح.
      en: If you catch the flu, wear a mask and rest.
    words: [terinfeksi, masker, infeksi, vaksin, jarum]
dialogue:
  lines:
    - speaker: Dokter Fitri
      text: Mohamed, batukmu sudah berapa hari?
      ar_eg: يا محمد، الكحة دي بقالها كام يوم؟
      ar: يا محمد، منذ كم يومًا وأنت تسعل؟
      en: Mohamed, how many days have you been coughing?
    - speaker: Mohamed
      text: Tiga hari, Dok. Di kampus sedang musim flu.
      ar_eg: تلات أيام يا دكتورة. في الجامعة دلوقتي موسم إنفلونزا.
      ar: ثلاثة أيام يا دكتورة. إنه موسم الإنفلونزا في الجامعة.
      en: Three days, doctor. It's flu season on campus.
    - speaker: Dokter Fitri
      text: Kamu tidak demam. Mungkin ini alergi debu, bukan infeksi.
      ar_eg: إنت ما عندكش سخونية. يمكن دي حساسية من التراب، مش عدوى.
      ar: ليست لديك حمّى. ربما هي حساسية من الغبار وليست عدوى.
      en: You don't have a fever. Maybe it's a dust allergy, not an infection.
    - speaker: Mohamed
      text: Perlu antibiotik?
      ar_eg: محتاج مضاد حيوي؟
      ar: هل أحتاج إلى مضاد حيوي؟
      en: Do I need antibiotics?
    - speaker: Dokter Fitri
      text: Tidak. Antibiotik hanya untuk bakteri. Pakai masker saja supaya tidak terinfeksi flu.
      ar_eg: لأ. المضاد الحيوي للبكتيريا بس. البس كمامة وخلاص عشان ما تتعداش بالإنفلونزا.
      ar: لا. المضاد الحيوي للبكتيريا فقط. ارتدِ كمامة كي لا تُصاب بالإنفلونزا.
      en: No. Antibiotics are only for bacteria. Just wear a mask so you don't catch the flu.
