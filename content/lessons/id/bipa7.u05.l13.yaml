schema: kabar.lesson/v1
id: bipa7.u05.l13
language: id
title: Diskusi sejarah
can_do:
  ar_eg: تناقش إن الحدث التاريخي الواحد ممكن يتحكي بأكتر من رواية، باحترام.
  ar: أن تناقش باحترام أنّ للحدث التاريخيّ الواحد أكثر من رواية.
  en: Discuss, respectfully, how one historical event can have more than one version.
slides:
  - title: Pahlawan bagi siapa?
    body:
      ar_eg: |
        الـ sejarawan (المؤرّخ) بيسأل: الحكاية دي versi (رواية / نسخة) مين؟
        مثال من سولاويسي: Arung Palakka أمير من مملكة بوني. اتحالف مع الـ VOC ضد جووا وحسن الدين.
        - في versi بوني: بطل حرّر شعبه من حكم جووا.
        - في versi جووا: اتحالف مع الأجانب.
        عبارات مفيدة للنقاش:
        - Menurut versi lain, … (على حسب رواية تانية…)
        - Para sejarawan berbeda pendapat tentang … (المؤرّخين مختلفين في…)
        - Kedua versi itu perlu didengar. (الروايتين لازم يتسمعوا.)
        - في الكلام: terus = lalu، bener = benar.
      ar: |
        يسأل الـ sejarawan (المؤرّخ): رواية مَن هذه الـ versi؟
        مثال من سولاويسي: Arung Palakka أمير من مملكة بوني، تحالف مع الـ VOC ضدّ غووا وحسن الدين.
        - في versi بوني: بطل حرّر قومه من حكم غووا.
        - وفي versi غووا: حليف للأجانب.
        عبارات نافعة في النقاش:
        - Menurut versi lain, … (بحسب رواية أخرى…)
        - Para sejarawan berbeda pendapat tentang … (يختلف المؤرّخون في…)
        - Kedua versi itu perlu didengar. (ينبغي سماع الروايتين.)
        - في الكلام اليومي: terus = lalu، bener = benar.
      en: |
        A sejarawan (historian) asks: whose versi (version) is this story?
        An example from Sulawesi: Arung Palakka, a prince of Bone, allied with the VOC against Gowa and Hasanuddin.
        - In Bone's versi: a hero who freed his people from Gowa's rule.
        - In Gowa's versi: an ally of the foreigners.
        Handy phrases for discussion:
        - Menurut versi lain, … (According to another version…)
        - Para sejarawan berbeda pendapat tentang … (Historians disagree about…)
        - Kedua versi itu perlu didengar. (Both versions deserve a hearing.)
        - In speech: terus = lalu, bener = benar.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الـ «sejarawan» بيشتغل إيه؟
      ar: ما عمل الـ «sejarawan»؟
      en: What does a "sejarawan" do?
    options:
      - Orang yang meneliti dan menulis tentang sejarah.
      - Orang yang memperbaiki jam.
      - Orang yang menggambar peta laut.
    answer: 0
    words: [sejarawan]
    explain:
      ar_eg: 'sejarawan = مؤرّخ: بيدرس التاريخ ويكتب عنه. مش ساعاتي ولا رسام خرايط.'
      ar: sejarawan = المؤرّخ الذي يدرس التاريخ ويكتب عنه، لا مصلح الساعات ولا راسم الخرائط.
      en: sejarawan = historian.
  - id: e02
    type: listen
    text: Pada tahun 1669, Arung Palakka dari Bone membantu VOC mengalahkan Gowa. Menurut versi Bone, Arung Palakka adalah pahlawan yang membebaskan rakyatnya. Namun, orang Gowa melihatnya sebagai pengkhianat.
    question:
      ar_eg: على حسب رواية بوني، أرونج بالاكا كان إيه؟
      ar: ما كان أرونغ بالاكا بحسب رواية بوني؟
      en: In Bone's version, what was Arung Palakka?
    options:
      - Bone menganggapnya pahlawan, tetapi Gowa menganggapnya pengkhianat.
      - Semua orang menganggapnya pedagang rempah.
      - Gowa dan Bone sama-sama menganggapnya pahlawan.
    answer: 0
    words: [versi]
    explain:
      ar_eg: في رواية (versi) بوني هو بطل حرّر شعبه، بس namun = لكن أهل جووا شايفينه خاين (pengkhianat). ده مثال على حدث واحد بروايتين.
      ar: في رواية بوني هو بطل محرّر، لكنّ أهل غوا يرونه خائنًا، فهذا حدث واحد بروايتين.
      en: 'Bone calls him a hero; Gowa calls him a traitor: one event, two versions.'
  - id: e03
    type: fill_blank
    sentence: Para ___ berbeda pendapat tentang peran Arung Palakka.
    meaning:
      ar_eg: المؤرّخين مختلفين في دور أرونج بالاكا.
      ar: يختلف المؤرّخون في دور أرونغ بالاكا.
      en: Historians disagree about Arung Palakka's role.
    options: [sejarawan, pembicara, pengembara]
    answers: [sejarawan]
    words: [sejarawan]
    explain:
      ar_eg: اللي بيختلفوا على دور أرونج بالاكا هم sejarawan = المؤرخين. pembicara = متحدث وpengembara = رحّالة.
      ar: المختلفون حول دور أرونغ بالاكا هم sejarawan أي المؤرخون.
      en: Historians (sejarawan) debate Arung Palakka's role.
  - id: e04
    type: build_sentence
    source:
      ar_eg: الروايتين لازم يتسمعوا.
      ar: ينبغي سماع الروايتين.
      en: Both versions deserve a hearing.
    answer: Kedua versi itu perlu didengar.
    distractors: [sejarawan, lain]
    words: [versi]
    explain:
      ar_eg: Kedua versi itu (الروايتين دول) + perlu (محتاجين) + didengar (يتسمعوا). sejarawan وlain زيادة.
      ar: Kedua versi itu perlu didengar. sejarawan وlain زائدتان.
      en: Kedua versi itu + perlu + didengar. sejarawan and lain are extra.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الحدث الواحد ممكن يبقى ليه روايتين؟
      ar: لماذا قد تكون للحدث الواحد روايتان؟
      en: Why can one event have two versions?
    options:
      - Karena satu pihak selalu berbohong.
      - Karena sejarah tidak penting.
      - Karena setiap pihak melihat peristiwa itu dari posisinya sendiri.
    answer: 2
    words: [versi, sejarawan]
    explain:
      ar_eg: كل طرف شاف الحدث من مكانه هو (dari posisinya sendiri)، فطلعت روايتين. مش لازم حد كدّاب، والتاريخ مهم.
      ar: يرى كلّ طرف الحدث من موقعه فتتعدّد الروايات، وليس بالضرورة أنّ أحدًا يكذب، والتاريخ مهمّ.
      en: Each side sees the event from its own position.
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: على حسب رواية تانية، الحرب بدأت سنة ١٦٦٦.
      ar: بحسب رواية أخرى، بدأت الحرب سنة ١٦٦٦.
      en: According to another version, the war began in 1666.
    answers:
      - Menurut versi lain, perang dimulai pada tahun 1666.
      - Menurut versi lain, perang itu dimulai tahun 1666.
      - Menurut versi yang lain, perang dimulai pada tahun 1666.
      - Menurut versi lain, perangnya mulai pada tahun 1666.
    words: [versi]
  - id: e07
    type: speaking
    text: Sebagai sejarawan, saya membaca sumber dari Gowa, Bone, dan VOC.
    meaning:
      ar_eg: بصفتي مؤرّخ، بقرا مصادر من جووا وبوني والـ VOC.
      ar: بصفتي مؤرّخًا أقرأ مصادر من غووا وبوني والـ VOC.
      en: As a historian, I read sources from Gowa, Bone and the VOC.
    words: [sejarawan, VOC]
  - id: e08
    type: dictation
    text: Setiap versi sejarah punya sudut pandangnya sendiri, jadi sejarawan harus membandingkan sumber dari Gowa dan Bone.
    meaning:
      ar_eg: كل رواية للتاريخ ليها وجهة نظرها، فلازم المؤرّخ يقارن المصادر اللي من جووا وبوني.
      ar: لكلّ رواية تاريخيّة زاوية نظرها، لذا على المؤرّخ أن يقارن مصادر غوا وبوني.
      en: Every version of history has its own point of view, so historians must compare sources from Gowa and Bone.
    words: [versi]
  - id: e09
    type: speaking
    text: Perlawanan Gowa dan versi Bone sama-sama bagian dari linimasa Sulawesi.
    meaning:
      ar_eg: مقاومة جووا ورواية بوني الاتنين جزء من تاريخ سولاويسي.
      ar: مقاومة غووا ورواية بوني كلتاهما جزء من تاريخ سولاويسي.
      en: Gowa's resistance and Bone's version are both part of Sulawesi's timeline.
    words: [perlawanan, versi, linimasa]
  - id: e10
    type: match_pairs
    pairs:
      - text: niaga
        ar_eg: تجارة
        ar: تجارة
        en: trade, commerce
      - text: perundingan
        ar_eg: مفاوضات
        ar: مفاوضات
        en: negotiations
      - text: nasionalisme
        ar_eg: القومية / الوطنية
        ar: القومية
        en: nationalism
      - text: manusia purba
        ar_eg: الإنسان البدائي
        ar: الإنسان القديم
        en: early human, hominin
    words: [niaga, perundingan, nasionalisme, manusia purba]
dialogue:
  title: Dua kakek, dua cerita
  lines:
    - speaker: Mohamed
      text: Pak, kakek teman saya dari Bone bilang Arung Palakka itu pahlawan.
      ar_eg: يا أستاذ، جدّ صاحبي اللي من بوني بيقول إن أرونج بالاكا بطل.
      ar: يا أستاذ، يقول جدّ صديقي من بوني إنّ أرونغ بالاكا بطل.
      en: Sir, my friend's grandfather from Bone says Arung Palakka was a hero.
    - speaker: Pak Hasan
      text: Itu versi Bone. Kakek saya dari Gowa punya versi lain.
      ar_eg: دي رواية بوني. جدّي اللي من جووا عنده رواية تانية.
      ar: تلك رواية بوني، ولجدّي من غووا رواية أخرى.
      en: That's Bone's version. My grandfather from Gowa had another.
    - speaker: Mohamed
      text: Terus siapa yang bener?
      ar_eg: طب مين اللي صح؟
      ar: فمن المحقّ؟
      en: So who's right?
    - speaker: Pak Hasan
      text: Sejarawan yang baik mendengar kedua versi, lalu membaca sumbernya.
      ar_eg: المؤرّخ الشاطر بيسمع الروايتين، وبعدين يقرا المصادر.
      ar: المؤرّخ الجيّد يسمع الروايتين ثمّ يقرأ المصادر.
      en: A good historian hears both versions, then reads the sources.
