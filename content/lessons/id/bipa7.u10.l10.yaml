schema: kabar.lesson/v1
id: bipa7.u10.l10
language: id
title: Menerbitkan artikel
can_do:
  ar_eg: تشرح رحلة مقالة علمية من التقديم للنشر، وعلاقتها برسالة الدكتوراه.
  ar: أن تشرح مسار مقالة علمية من التقديم إلى النشر وصلتها بأطروحة الدكتوراه.
  en: Explain a paper's path from submission to publication, and its link to a PhD.
slides:
  - title: Dari naskah ke terbitan
    body:
      ar_eg: |
        طلبة دكتوراه كتير في إندونيسيا لازم ينشروا في jurnal bereputasi (مجلّة مصنّفة) قبل مناقشة disertasi (رسالة الدكتوراه).
        promotor = المشرف الرئيسي، وبيساعد في المقالة.
        خطوات النشر:
        1. ممكن تنزّل pracetak (نسخة قبل النشر) على موقع مفتوح.
        2. المجلّة تبعتها لـ tinjauan sejawat (تحكيم الأقران): 2 أو 3 penelaah (محكّمين) بيقروها.
        3. بعد التعديلات تتنشر، ولو akses terbuka (وصول مفتوح) أي حد يقراها ببلاش.
        4. كل ما بحوث تانية تستشهد بيها، عدد sitasi (الاستشهادات) بيزيد.
      ar: |
        يُطلب من كثير من طلّاب الدكتوراه في إندونيسيا النشر في jurnal bereputasi (مجلّة رصينة) قبل مناقشة disertasi (الأطروحة).
        promotor = المشرف الرئيس، ويعين في كتابة المقالة.
        مراحل النشر:
        1. قد ترفع pracetak (نسخة ما قبل النشر) على موقع مفتوح.
        2. ترسلها المجلّة إلى tinjauan sejawat (تحكيم الأقران)، فيقرؤها 2 أو 3 penelaah (محكّمين).
        3. بعد التعديلات تُنشر، وإن كانت akses terbuka (وصولًا مفتوحًا) قرأها أيّ أحد مجّانًا.
        4. وكلّما استشهدت بها بحوث أخرى زاد عدد sitasi (الاستشهادات).
      en: |
        Many Indonesian PhD students must publish in a jurnal bereputasi (reputable journal) before defending their disertasi.
        promotor = the main supervisor, who helps with the paper.
        The steps:
        1. You may post a pracetak (preprint) on an open server.
        2. The journal sends it for tinjauan sejawat (peer review): 2 or 3 penelaah (reviewers) read it.
        3. After revisions it's published; if akses terbuka (open access), anyone can read it free.
        4. As other studies cite it, its sitasi (citation) count grows.
    examples:
      - text: Artikel saya sedang dalam tinjauan sejawat.
        ar_eg: مقالتي دلوقتي في مرحلة تحكيم الأقران.
        ar: مقالتي قيد تحكيم الأقران.
        en: My article is under peer review.
      - text: Penelaah kedua meminta data tambahan.
        ar_eg: المحكّم التاني طلب بيانات زيادة.
        ar: طلب المحكّم الثاني بيانات إضافية.
        en: The second reviewer asked for more data.
      - text: Promotor saya membaca setiap bab disertasi.
        ar_eg: المشرف بتاعي بيقرا كل فصل في الرسالة.
        ar: يقرأ مشرفي كلّ فصل من الأطروحة.
        en: My supervisor reads every chapter of the dissertation.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tinjauan sejawat
        ar_eg: تحكيم الأقران
        ar: تحكيم الأقران
        en: peer review
      - text: penelaah
        ar_eg: مُحكّم / مراجع
        ar: المحكّم
        en: reviewer, referee
      - text: jurnal bereputasi
        ar_eg: مجلّة علمية محترمة / مصنّفة
        ar: مجلّة علمية رصينة
        en: reputable (indexed) journal
      - text: akses terbuka
        ar_eg: وصول مفتوح (ببلاش للكل)
        ar: الوصول المفتوح
        en: open access
    words: [tinjauan sejawat, penelaah, jurnal bereputasi, akses terbuka]
  - id: e02
    type: match_pairs
    pairs:
      - text: pracetak
        ar_eg: نسخة قبل النشر (preprint)
        ar: نسخة ما قبل النشر
        en: preprint
      - text: sitasi
        ar_eg: استشهاد / اقتباس من بحث (citation)
        ar: الإحالة، الاستشهاد
        en: citation
      - text: disertasi
        ar_eg: رسالة دكتوراه
        ar: أطروحة الدكتوراه
        en: doctoral dissertation
      - text: promotor
        ar_eg: المشرف الرئيسي على الدكتوراه
        ar: المشرف الرئيس على الدكتوراه
        en: doctoral supervisor (promotor)
    words: [pracetak, sitasi, disertasi, promotor]
  - id: e03
    type: listen
    text: Artikel itu sudah mendapat seratus sitasi dalam dua tahun.
    question:
      ar_eg: المقالة خدت مية إيه؟
      ar: مئة ماذا نالت المقالة؟
      en: A hundred what did the article get?
    options: [استشهاد, محكّم, نسخة قبل النشر]
    answer: 0
    meaning:
      ar_eg: المقالة دي خدت مية استشهاد في سنتين.
      ar: نالت تلك المقالة مئة استشهاد في عامين.
      en: That article has been cited a hundred times in two years.
    words: [sitasi]
  - id: e04
    type: fill_blank
    sentence: Saya mengunggah ___ supaya peneliti lain bisa membaca lebih awal.
    meaning:
      ar_eg: رفعت ___ علشان باحثين تانيين يقدروا يقروا بدري.
      ar: رفعتُ ___ ليتمكّن باحثون آخرون من القراءة مبكّرًا.
      en: I uploaded a ___ so other researchers can read it early.
    options: [pracetak, promotor, penelaah]
    answers: [pracetak]
    words: [pracetak, promotor, penelaah]
    explain:
      ar_eg: رفع نسخة بدري قبل النشر = pracetak (preprint). promotor = المشرف على الدكتوراه وpenelaah = المحكِّم.
      ar: النسخة المبكرة قبل النشر pracetak. promotor مشرف الدكتوراه وpenelaah محكّم.
      en: An early upload is a pracetak (preprint).
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ميزة «akses terbuka» إيه؟
      ar: ما ميزة «akses terbuka»؟
      en: What's the advantage of 'akses terbuka'?
    options: [Hanya profesor yang boleh membaca., Artikel tidak perlu tinjauan sejawat., Siapa pun bisa membaca artikel tanpa membayar.]
    answer: 2
    explain:
      ar_eg: الوصول المفتوح = أي حد يقرا ببلاش.
      ar: الوصول المفتوح = القراءة مجّانًا للجميع.
      en: Open access = anyone reads free.
    words: [akses terbuka, tinjauan sejawat]
  - id: e06
    type: fill_blank
    sentence: Sebelum ujian, mahasiswa doktor harus terbit di ___.
    meaning:
      ar_eg: قبل المناقشة، طالب الدكتوراه لازم ينشر في ___.
      ar: قبل المناقشة يجب أن ينشر طالب الدكتوراه في ___.
      en: Before the defence, a PhD student must publish in a ___.
    options: [jurnal bereputasi, akses terbuka, sitasi]
    answers: [jurnal bereputasi]
    words: [jurnal bereputasi, akses terbuka, sitasi]
    explain:
      ar_eg: طالب الدكتوراه لازم ينشر في jurnal bereputasi = مجلة محترمة. akses terbuka = وصول مفتوح وsitasi = استشهاد.
      ar: يجب النشر في jurnal bereputasi أي مجلة محكّمة مرموقة.
      en: PhD students publish in a jurnal bereputasi (reputable journal).
  - id: e07
    type: build_sentence
    source:
      ar_eg: رسالة الدكتوراه بتاعته عن اللغات في بابوا.
      ar: أطروحته عن اللغات في بابوا.
      en: His dissertation is about languages in Papua.
    answer: Disertasinya tentang bahasa-bahasa di Papua.
    distractors: [promotor, pracetak]
    words: [disertasi]
    explain:
      ar_eg: Disertasinya (رسالة الدكتوراه بتاعته) + tentang + bahasa-bahasa di Papua. promotor وpracetak زيادة.
      ar: Disertasinya tentang bahasa-bahasa di Papua. promotor وpracetak زائدتان.
      en: Disertasinya + tentang + bahasa-bahasa di Papua. promotor and pracetak are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Penelaah pertama menerima artikel itu dengan revisi kecil.
    answers_meaning:
      ar_eg: [المحكّم الأول قبل المقالة بتعديلات بسيطة, أول محكّم وافق على المقالة بشوية تعديلات صغيّرة]
      ar: [قبل المحكّم الأوّل المقالة بتعديلات طفيفة, وافق المحكّم الأول على المقالة مع تعديلات صغيرة]
      en: [The first reviewer accepted the article with minor revisions, Reviewer one accepted the paper with small revisions]
    words: [penelaah]
  - id: e09
    type: speaking
    text: Promotor saya ingin disertasi saya selesai tahun ini.
    meaning:
      ar_eg: المشرف بتاعي عايز رسالتي تخلص السنة دي.
      ar: يريد مشرفي أن أنهي أطروحتي هذا العام.
      en: My supervisor wants my dissertation finished this year.
    words: [promotor, disertasi]
  - id: e10
    type: multiple_choice
    question: Siapa yang membaca artikel dalam tinjauan sejawat?
    options: [Para penelaah yang ahli di bidang itu., Wartawan televisi., Semua pembaca akses terbuka.]
    answer: 0
    explain:
      ar_eg: المحكّمين خبرا في نفس المجال.
      ar: المحكّمون خبراء في المجال نفسه.
      en: Reviewers are experts in the same field.
    words: [penelaah, tinjauan sejawat, akses terbuka, jurnal bereputasi, sitasi, pracetak]
dialogue:
  lines:
    - speaker: Penanya
      text: Pak, apakah artikel ini sudah melewati tinjauan sejawat?
      ar_eg: يا دكتور، المقالة دي عدّت على تحكيم الأقران؟
      ar: يا دكتور، هل مرّت هذه المقالة بتحكيم الأقران؟
      en: Sir, has this article been through peer review?
    - speaker: Pak Elias
      text: Belum. Ini masih pracetak, jadi hasilnya harus dibaca dengan hati-hati.
      ar_eg: لسه. دي لسه نسخة قبل النشر، فالنتايج لازم تتقرا بحذر.
      ar: ليس بعد، فهي نسخة ما قبل النشر، فاقرؤوا نتائجها بحذر.
      en: Not yet. It's still a preprint, so read its results with care.
    - speaker: Mohamed
      text: Kapan akan terbit, Pak?
      ar_eg: هتتنشر إمتى يا دكتور؟
      ar: متى تُنشر يا دكتور؟
      en: When will it be published, sir?
    - speaker: Pak Elias
      text: Dua penelaah sudah setuju. Jurnalnya bereputasi dan akses terbuka.
      ar_eg: اتنين محكّمين وافقوا. والمجلّة محترمة ووصولها مفتوح.
      ar: وافق محكّمان، والمجلّة رصينة ومفتوحة الوصول.
      en: Two reviewers have agreed. The journal is reputable and open access.
    - speaker: Mohamed
      text: Artikel ini akan jadi bab penting dalam disertasi saya.
      ar_eg: المقالة دي هتبقى فصل مهم في رسالة الدكتوراه بتاعتي.
      ar: ستكون هذه المقالة فصلًا مهمًّا في أطروحتي.
      en: This article will be an important chapter of my dissertation.
