dialogue:
  title: Pasar Tomohon
  lines:
    - speaker: Mas Rizal
      text: Kamu beli apa di pasar tadi?
      ar_eg: اشتريت إيه من السوق من شوية؟
      ar: ماذا اشتريت من السوق قبل قليل؟
      en: What did you buy at the market earlier?
    - speaker: Mohamed
      text: Buah tangan untuk teman-teman di Jakarta.
      ar_eg: هدايا من السفر لصحابي في جاكرتا.
      ar: هدايا لأصدقائي في جاكرتا.
      en: Gifts for my friends in Jakarta.
    - speaker: Mas Rizal
      text: Wah, nanti kamu jadi buah bibir di kantor!
      ar_eg: الله، هتبقى على لسان الكل في الشغل!
      ar: رائع، ستصبح حديث الجميع في المكتب!
      en: Wow, you'll be the talk of the office!
    - speaker: Mohamed
      text: Asal jangan jadi kambing hitam kalau bunganya layu, ya!
      ar_eg: بس المهم ماابقاش كبش الفدا لو الورد دبل!
      ar: المهم ألّا أصير كبش الفداء إن ذبلت الأزهار!
      en: As long as I'm not the scapegoat if the flowers wilt!
