schema: kabar.lesson/v1
id: bipa4.u10.l01
language: id
title: Buah tangan, buah bibir
can_do:
  ar_eg: تستعمل تعبيرات اصطلاحية مشهورة زي buah tangan وkambing hitam.
  ar: أن تستعمل تعابير اصطلاحية شائعة مثل buah tangan وkambing hitam.
  en: Use common idioms such as buah tangan and kambing hitam.
slides:
  - title: Ungkapan = arti kiasan
    body:
      ar_eg: |
        ungkapan (تعبير اصطلاحي) معناه مش حرفي، فاحفظه حتة واحدة:
        buah tangan («فاكهة الإيد») = هدية بتجيبها من السفر، زي oleh-oleh.
        buah bibir («فاكهة الشفايف») = حديث الناس / اللي الكل بيتكلم عنه.
      ar: |
        المعنى في ungkapan (التعبير الاصطلاحي) مجازي لا حرفي، فاحفظه قطعة واحدة:
        buah tangan («ثمرة اليد») = هدية تجلبها من السفر، مثل oleh-oleh.
        buah bibir («ثمرة الشفاه») = حديث الناس.
      en: |
        An ungkapan (idiom) means something figurative, so learn it as one chunk:
        buah tangan ("fruit of the hand") = a gift you bring back from a trip, like oleh-oleh.
        buah bibir ("fruit of the lips") = the talk of the town.
    grammar: id.idiom.basic
    examples:
      - text: Saya membawa buah tangan dari Tomohon untuk keluarga.
        ar_eg: جبت هدية من توموهون للعيلة.
        ar: أحضرت هدية من توموهون للعائلة.
        en: I brought a gift back from Tomohon for my family.
      - text: Kisah tokoh itu menjadi buah bibir di seluruh negeri.
        ar_eg: حكاية الشخصية دي بقت على لسان الناس في البلد كلها.
        ar: صارت قصة تلك الشخصية حديث الناس في البلاد كلها.
        en: That figure's story became the talk of the whole country.
  - title: Kambing hitam
    body:
      ar_eg: |
        kambing hitam («معزة سودة») = كبش فدا، يعني اللي بيشيل غلط غيره.
        خلي بالك: مش زي black sheep بالإنجليزي (الشخص الغريب في العيلة)!
        menyalahkan = يلوم (من salah = غلط).
      ar: |
        kambing hitam («الماعز الأسود») = كبش الفداء، أي من يُحمَّل خطأ غيره.
        وانتبه: ليس كـ black sheep بالإنجليزية (الشاذّ في العائلة).
        menyalahkan = يلوم (من salah = خطأ).
      en: |
        kambing hitam ("black goat") = scapegoat, the one blamed for others' mistakes.
        Careful: it is not the English "black sheep" (the family misfit)!
        menyalahkan = to blame (from salah, "wrong").
    grammar: id.idiom.basic
    examples:
      - text: Jangan jadikan dia kambing hitam atas kesalahan tim.
        ar_eg: ماتخلّيهوش كبش فدا لغلط الفريق.
        ar: لا تجعله كبش فداء لخطأ الفريق.
        en: Don't make him the scapegoat for the team's mistake.
      - text: Pemimpin yang baik tidak menyalahkan orang lain.
        ar_eg: القائد الكويس مابيلومش غيره.
        ar: القائد الجيد لا يلوم الآخرين.
        en: A good leader doesn't blame others.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: buah tangan
        ar_eg: هدية من السفر
        ar: هدية من السفر
        en: gift brought back from a trip
      - text: buah bibir
        ar_eg: حديث الناس
        ar: حديث الناس
        en: talk of the town
      - text: kambing hitam
        ar_eg: كبش فدا
        ar: كبش فداء
        en: scapegoat
      - text: menyalahkan
        ar_eg: يلوم
        ar: يلوم
        en: to blame
      - text: tokoh
        ar_eg: شخصية (مشهورة)
        ar: شخصية بارزة
        en: figure, public figure
    words: [buah tangan, buah bibir, kambing hitam, menyalahkan, tokoh]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة مستعملة فيها kambing hitam صح؟
      ar: في أيّ جملة استُعمل kambing hitam استعمالًا صحيحًا؟
      en: Which sentence uses kambing hitam correctly?
    options: ["Saya membawa kambing hitam dari Tomohon untuk Ibu.", "Dia selalu menjadi kambing hitam kalau timnya kalah.", "Kambing hitam itu rendah sekali."]
    answer: 1
    explain:
      ar_eg: kambing hitam = اللي بيتلام على غلط غيره. الهدية من السفر اسمها buah tangan.
      ar: kambing hitam = من يُلام على خطأ غيره، أما هدية السفر فهي buah tangan.
      en: kambing hitam is the one blamed for others' faults; a travel gift is buah tangan.
    words: [kambing hitam]
  - id: e03
    type: listen
    text: Saya membawa buah tangan dari Tomohon untuk keluarga.
    options: ["Saya membeli buah tangan di Tomohon untuk teman.", "Saya membawa buah segar dari Tomohon untuk keluarga.", "Saya membawa buah tangan dari Tomohon untuk keluarga."]
    answer: 2
    meaning:
      ar_eg: جبت هدية من توموهون للعيلة.
      ar: أحضرت هدية من توموهون للعائلة.
      en: I brought a gift back from Tomohon for my family.
    words: [buah tangan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الناس كلها بتتكلم عن خطبة الشخصية دي. تقول إيه؟
      ar: الجميع يتحدثون عن خطاب تلك الشخصية. ماذا تقول؟
      en: Everyone is talking about that figure's speech. What do you say?
    options: ["Pidato tokoh itu menjadi buah bibir.", "Pidato tokoh itu menjadi buah tangan.", "Pidato tokoh itu menjadi kambing hitam."]
    answer: 0
    words: [buah bibir, tokoh]
  - id: e05
    type: fill_blank
    sentence: Mereka selalu ___ dia, jadi dia menjadi kambing hitam.
    meaning:
      ar_eg: هما دايمًا بيلوموه، فبقى كبش الفدا.
      ar: إنهم يلومونه دائمًا، فصار كبش الفداء.
      en: They always blame him, so he has become the scapegoat.
    options: [membawa, menyalahkan, merawat]
    answers: [menyalahkan]
    words: [menyalahkan, kambing hitam]
  - id: e06
