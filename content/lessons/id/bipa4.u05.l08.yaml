schema: kabar.lesson/v1
id: bipa4.u05.l08
language: id
title: Undangan upacara
can_do:
  ar_eg: تقرا دعوة رسمية لحفلة وطنية وتعرف المعاد والمكان والمطلوب منك.
  ar: أن تقرأ دعوة رسمية إلى احتفال وطني وتعرف الموعد والمكان والمطلوب منك.
  en: Read a formal invitation to a national ceremony and find the time, place and what to do.
slides:
  - title: Surat undangan
    body:
      ar_eg: |
        Mohamed جاتله دعوة من مكتب العمدة في بالوبو. الدعوات الرسمية ليها شكل ثابت.
        عبارة جديدة: dalam rangka = بمناسبة (في إطار).
      ar: |
        تلقّى Mohamed دعوة من مكتب رئيس البلدية في بالوبو. للدعوات الرسمية صيغة ثابتة.
        عبارة جديدة: dalam rangka = بمناسبة (في إطار).
      en: |
        Mohamed got an invitation from the mayor's office in Palopo. Formal invitations follow a fixed pattern.
        New phrase: dalam rangka = on the occasion of, as part of.
    examples:
      - text: Dalam rangka memperingati Hari Kemerdekaan, kami mengundang Bapak/Ibu menghadiri upacara bendera.
        ar_eg: بمناسبة الاحتفال بعيد الاستقلال، بنعزم حضرتك تحضر تحية العلم.
        ar: بمناسبة إحياء ذكرى عيد الاستقلال، ندعو حضرتكم لحضور مراسم رفع العلم.
        en: On the occasion of commemorating Independence Day, we invite you to attend the flag ceremony.
      - text: "Tanggal: 17 Agustus. Pukul: 07.00 WITA. Tempat: lapangan di jantung Kota Palopo."
        ar_eg: "التاريخ: ١٧ أغسطس. الساعة: ٧ الصبح بتوقيت وسط إندونيسيا. المكان: الساحة اللي في قلب مدينة بالوبو."
        ar: "التاريخ: ١٧ أغسطس. الساعة: السابعة صباحًا بتوقيت وسط إندونيسيا. المكان: الساحة في قلب مدينة بالوبو."
        en: "Date: 17 August. Time: 7:00 a.m. Central Indonesia Time. Place: the square in the heart of Palopo."
      - text: Peserta upacara diharapkan memakai baju putih dan datang tepat waktu.
        ar_eg: المشاركين في الحفل يُرجى منهم يلبسوا أبيض وييجوا في المعاد.
        ar: يُرجى من المشاركين في المراسم ارتداء ملابس بيضاء والحضور في الموعد.
        en: Participants are asked to wear white and to arrive on time.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الحفل بيبدأ الساعة كام؟
      ar: متى تبدأ المراسم؟
      en: What time does the ceremony start?
    options: ["Pukul 09.00 WITA", "Pukul 07.00 WITA", "Pukul 17.00 WITA"]
    answer: 1
    explain:
      ar_eg: WITA = توقيت وسط إندونيسيا، وده توقيت سولاويسي.
      ar: WITA = توقيت وسط إندونيسيا، وهو توقيت سولاويسي.
      en: WITA = Central Indonesia Time, the time zone of Sulawesi.
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: المشاركين يلبسوا إيه؟
      ar: ماذا يرتدي المشاركون؟
      en: What should participants wear?
    options: [Kebaya, Baju merah, Baju putih]
    answer: 2
    words: [peserta]
    explain:
      ar_eg: الدعوة بتقول إن المشاركين يلبسوا أبيض (baju putih)، مش كباية ولا أحمر.
      ar: تقول الدعوة إن على المشاركين ارتداء الأبيض (baju putih)، لا الكبايا ولا الأحمر.
      en: The invitation says participants wear white (baju putih), not kebaya or red.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الحفل ده معمول بمناسبة إيه؟
      ar: بأيّ مناسبة تُقام المراسم؟
      en: What is the ceremony for?
    options:
      - Untuk memperingati Hari Kemerdekaan
      - Untuk memperingati Hari Kartini
      - Untuk lomba balap karung
    answer: 0
    words: [dalam rangka, memperingati]
    explain:
      ar_eg: الاحتفال dalam rangka memperingati Hari Kemerdekaan = بمناسبة عيد الاستقلال، مش يوم كارتيني ولا سباق.
      ar: الحفل dalam rangka memperingati Hari Kemerdekaan = بمناسبة عيد الاستقلال، لا يوم كارتيني ولا السباق.
      en: The ceremony is dalam rangka memperingati Hari Kemerdekaan, for Independence Day, not Kartini Day or a race.
  - id: e04
    type: listen
    text: Peserta upacara diharapkan datang tepat waktu.
    options:
      - Peserta upacara diharapkan datang tepat waktu.
      - Peserta lomba diharapkan datang tepat waktu.
      - Peserta upacara diharapkan datang pagi-pagi.
    answer: 0
    meaning:
      ar_eg: المشاركين في الحفل يُرجى منهم ييجوا في المعاد.
      ar: يُرجى من المشاركين في المراسم الحضور في الموعد.
      en: Participants are asked to arrive on time.
    words: [peserta]
  - id: e05
    type: match_pairs
    pairs:
      - text: dalam rangka
        ar_eg: بمناسبة
        ar: بمناسبة / في إطار
        en: on the occasion of
      - text: memperingati
        ar_eg: يحتفل بذكرى
        ar: يُحيي ذكرى
        en: commemorate
      - text: menghadiri
        ar_eg: يحضر
        ar: يحضر
        en: attend
      - text: upacara bendera
        ar_eg: تحية العلم
        ar: مراسم رفع العلم
        en: flag ceremony
      - text: peserta
        ar_eg: مشارك
        ar: مشارك
        en: participant
    words: [dalam rangka, memperingati, menghadiri, upacara bendera, peserta]
  - id: e06
    type: fill_blank
    sentence: ___ memperingati Hari Kemerdekaan, warga membuat lomba balap karung.
    meaning:
      ar_eg: بمناسبة عيد الاستقلال، الأهالي عملوا سباق الشوال.
      ar: بمناسبة ذكرى عيد الاستقلال، نظّم السكان سباق الأكياس.
      en: To mark Independence Day, residents put on a sack race.
    options: [Berkat, Dalam rangka, Akibatnya]
    answers: [Dalam rangka]
    words: [dalam rangka]
    explain:
      ar_eg: dalam rangka = بمناسبة، وبعدها المناسبة. berkat = بفضل، وakibatnya = ونتيجة لكده.
      ar: dalam rangka = بمناسبة، وتليها المناسبة. أما berkat فبفضل، وakibatnya فنتيجةً لذلك.
      en: dalam rangka means "on the occasion of", followed by the occasion. berkat is "thanks to", and akibatnya is "as a result".
  - id: e07
    type: build_sentence
    source:
      ar_eg: بمناسبة يوم كارتيني، الطالبات لابسين كبايا.
      ar: بمناسبة يوم كارتيني ترتدي الطالبات الكبايا.
      en: On the occasion of Kartini Day, the schoolgirls wear kebaya.
    answer: Dalam rangka Hari Kartini, para siswi memakai kebaya.
    distractors: [menghadiri, merah]
    words: [dalam rangka]
    explain:
      ar_eg: dalam rangka Hari Kartini = بمناسبة يوم كارتيني، والطالبات لابسين كباية. menghadiri = يحضر، وmerah = أحمر، ومش في الجملة.
      ar: dalam rangka Hari Kartini = بمناسبة يوم كارتيني، فترتدي الطالبات الكبايا. أما menghadiri فيحضر، وmerah أحمر، وليسا في الجملة.
      en: dalam rangka Hari Kartini means "for Kartini Day". menghadiri (attend) and merah (red) aren't in the sentence.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بنعزم حضرتك تحضر تحية العلم.
      ar: ندعوكم لحضور مراسم رفع العلم.
      en: We invite you to attend the flag ceremony.
    answers:
      - Kami mengundang Anda menghadiri upacara bendera.
      - Kami mengundang Anda untuk menghadiri upacara bendera.
      - Kami mengundang Bapak/Ibu menghadiri upacara bendera.
      - Kami mengundang Bapak/Ibu untuk menghadiri upacara bendera.
      - Kami mengundang Bapak menghadiri upacara bendera.
      - Kami mengundang Ibu menghadiri upacara bendera.
      - Kami mengundang kamu menghadiri upacara bendera.
      - Kami mengundang Anda buat menghadiri upacara bendera.
    words: [menghadiri, upacara bendera]
  - id: e09
    type: match_pairs
    pairs:
      - text: menyambut
        ar_eg: يستقبل / يحتفل بقدوم
        ar: يستقبل / يحتفي بقدوم
        en: to welcome
      - text: pramuka
        ar_eg: كشافة
        ar: كشّافة
        en: scouts
      - text: perlombaan
        ar_eg: مسابقة
        ar: مسابقة
        en: competition
      - text: ritual
        ar_eg: طقس
        ar: طقس
        en: ritual
      - text: menyalakan
        ar_eg: يولّع
        ar: يُشعل
        en: to light
      - text: berpartisipasi
        ar_eg: يشارك
        ar: يشارك
        en: to take part
    words: [menyambut, pramuka, perlombaan, ritual, menyalakan, berpartisipasi]
dialogue:
  title: Undangan dari kantor wali kota
  lines:
    - speaker: Mohamed
      text: Tenri, aku dapat surat dari kantor kota buat menghadiri upacara. Mulainya jam tujuh, ya?
      ar_eg: يا Tenri، جالي جواب من مكتب المدينة عشان أحضر الحفل. بيبدأ الساعة سبعة، صح؟
      ar: يا Tenri، وصلتني رسالة من مكتب المدينة لحضور الحفل. يبدأ في السابعة، أليس كذلك؟
      en: Tenri, I got a letter from the city office to attend the ceremony. It starts at seven, right?
    - speaker: Andi Tenri
      text: Betul. Dalam rangka Hari Kemerdekaan, semua warga boleh datang.
      ar_eg: مظبوط. بمناسبة عيد الاستقلال، كل الأهالي يقدروا ييجوا.
      ar: صحيح. بمناسبة عيد الاستقلال، يحق لجميع السكان الحضور.
      en: Right. For Independence Day, all residents may come.
    - speaker: Mohamed
      text: Di surat itu, peserta harus pakai baju putih.
      ar_eg: في الجواب ده، المشاركين لازم يلبسوا أبيض.
      ar: في تلك الرسالة، على المشاركين ارتداء الأبيض.
      en: In that letter, participants have to wear white.
    - speaker: Andi Tenri
      text: Iya. Dan jangan kesiangan, upacara nggak nunggu!
      ar_eg: أيوه. وما تصحاش متأخر، الحفل مش هيستناك!
      ar: نعم. ولا تستيقظ متأخرًا، فالمراسم لن تنتظر!
      en: Yes. And don't oversleep, the ceremony won't wait!
    - speaker: Mohamed
      text: Siap! Aku bakal berdiri dengan tenang waktu Merah Putih naik.
      ar_eg: تمام! هقف هادي لما العلم الأحمر والأبيض يطلع.
      ar: حاضر! سأقف بهدوء عندما يُرفع العلم الأحمر والأبيض.
      en: Will do! I'll stand calmly when the Red-and-White goes up.
new_words:
