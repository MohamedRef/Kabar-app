schema: kabar.lesson/v1
id: bipa2.u01.l06
language: id
title: Tebal dan tipis
can_do:
  ar_eg: تقارن الحاجات بالسُمك والعرض والمساحة والملمس والخامة.
  ar: أن تقارن الأشياء بالسُّمك والعرض والمساحة والملمس والمادة.
  en: Compare things by thickness, width, space, texture and material.
slides:
  - title: Tebal, lebar, luas
    body:
      ar_eg: |
        أزواج مفيدة مع lebih … daripada:
        tebal ↔ tipis: تخين ↔ رفيع (كتاب، قماش).
        lebar ↔ sempit: عريض ↔ ضيق (شارع، باب).
        luas = واسع، كبير في المساحة (بيت، أوضة). وkasar = خشن، عكس lembut.
        الخامات: besi = حديد، plastik = بلاستيك، وإنت عارف kayu وbambu وlogam.
      ar: |
        أزواج مفيدة مع lebih … daripada:
        tebal ↔ tipis: سميك ↔ رقيق (كتاب، قماش).
        lebar ↔ sempit: عريض ↔ ضيّق (شارع، باب).
        luas = واسع المساحة (بيت، غرفة). وkasar = خشن، ضدّ lembut.
        المواد: besi = حديد، plastik = بلاستيك، وأنت تعرف kayu وbambu وlogam.
      en: |
        Useful pairs with lebih … daripada:
        tebal ↔ tipis: thick ↔ thin (books, cloth).
        lebar ↔ sempit: wide ↔ narrow (roads, doors).
        luas = spacious (a house, a room). kasar = rough, the opposite of lembut.
        Materials: besi = iron, plastik = plastic; you know kayu, bambu and logam.
    examples:
      - text: Buku ini lebih tebal daripada buku itu.
        ar_eg: الكتاب ده أتخن من الكتاب ده.
        ar: هذا الكتاب أسمك من ذاك.
        en: This book is thicker than that one.
      - text: Jalan ini sempit, tapi jalan itu lebar.
        ar_eg: الشارع ده ضيق، بس الشارع ده عريض.
        ar: هذا الشارع ضيّق، أما ذاك فعريض.
        en: This road is narrow, but that one is wide.
      - text: Pintu itu dari besi, jadi berat.
        ar_eg: الباب ده حديد، عشان كده تقيل.
        ar: ذلك الباب من حديد، لذا هو ثقيل.
        en: That door is iron, so it's heavy.
exercises:
