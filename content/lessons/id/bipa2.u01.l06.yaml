  - id: e03
    type: listen
    text: Suling ini dari plastik, bukan dari bambu.
    question:
      ar_eg: الناي ده معمول من إيه؟
      ar: مِمَّ صُنع هذا الناي؟
      en: What is the flute made of?
    options: [بلاستيك, خشب, حديد]
    answer: 0
    meaning:
      ar_eg: الناي ده بلاستيك، مش بامبو.
      ar: هذا الناي من البلاستيك لا من الخيزران.
      en: This flute is plastic, not bamboo.
    words: [plastik]
  - id: e04
    type: fill_blank
    sentence: Kamus ini lebih ___ daripada buku cerita.
    meaning:
      ar_eg: القاموس ده ___ من كتاب الحكايات.
      ar: هذا القاموس ___ من كتاب القصص.
      en: This dictionary is ___ than the storybook.
    options: [tebal, sempit, kasar]
    answers: [tebal]
    words: [tebal, sempit, kasar]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه عكس lebar؟
      ar: ما ضدّ lebar؟
      en: What's the opposite of lebar?
    options: [sempit, luas, tebal]
    answer: 0
    explain:
      ar_eg: lebar = عريض، وعكسها sempit = ضيق.
      ar: lebar عريض وضدّها sempit ضيّق.
      en: lebar = wide; its opposite is sempit, narrow.
    words: [sempit, lebar, luas, tebal]
  - id: e06
    type: fill_blank
    sentence: Rumah nenek ___ sekali. Ada lima kamar.
    meaning:
      ar_eg: بيت تيتا ___ أوي. فيه خمس أوض.
      ar: بيت جدّتي ___ جدًا، فيه خمس غرف.
      en: Grandma's house is very ___. It has five rooms.
    options: [luas, tipis, besi]
    answers: [luas]
    words: [luas, tipis, besi]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الهدوم دي رقيقة، مش تقيلة.
      ar: هذه الملابس رقيقة، ليست ثقيلة.
      en: These clothes are thin, not heavy.
    answer: Baju ini tipis, tidak berat.
    distractors: [besi, lebar]
    words: [tipis]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kain ini kasar, tidak lembut.
    answers_meaning:
      ar_eg: [القماش ده خشن، مش ناعم, القماشة دي خشنة مش ناعمة]
      ar: [هذا القماش خشن، ليس ناعمًا, هذا القماش خشن لا ناعم]
      en: ['This cloth is rough, not soft', 'This fabric is rough, not soft']
    words: [kasar]
  - id: e09
    type: speaking
    text: Jalan ini sempit, tapi jalan itu lebar.
    meaning:
      ar_eg: الشارع ده ضيق، بس ده عريض.
      ar: هذا الشارع ضيّق وذاك عريض.
      en: This road is narrow, but that one is wide.
    words: [sempit, lebar]
  - id: e10
    type: multiple_choice
    question: Pintu itu dari ___, jadi berat sekali.
    options: [besi, plastik, bambu]
    answer: 0
    explain:
      ar_eg: 'الحديد تقيل: besi.'
      ar: 'الحديد ثقيل: besi.'
      en: 'Iron is heavy: besi.'
    words: [besi, plastik]
dialogue:
  lines:
    - speaker: Mohamed
      text: Gendang ini lebih besar daripada gendang itu.
      ar_eg: الطبلة دي أكبر من الطبلة دي.
      ar: هذا الطبل أكبر من ذاك.
      en: This drum is bigger than that one.
    - speaker: Penjual
      text: Ya, Pak. Yang ini dari kayu, tidak dari plastik.
      ar_eg: أيوه يا أستاذ. دي خشب، مش بلاستيك.
      ar: نعم يا سيدي، هذا من الخشب لا البلاستيك.
      en: Yes, sir. This one's wood, not plastic.
    - speaker: Mohamed
      text: Yang plastik lebih murah?
      ar_eg: والبلاستيك أرخص؟
      ar: وهل البلاستيكي أرخص؟
      en: Is the plastic one cheaper?
    - speaker: Penjual
      text: Lebih murah, tapi suaranya kurang bagus.
      ar_eg: أرخص، بس صوته مش حلو قوي.
      ar: أرخص، لكن صوته أقلّ جودة.
      en: Cheaper, but it doesn't sound as good.
    - speaker: Mohamed
      text: Tokonya luas sekali!
      ar_eg: المحل واسع أوي!
      ar: المتجر واسع جدًا!
      en: The shop is so spacious!
    - speaker: Penjual
      text: Pintunya sempit, tapi di dalam luas!
      ar_eg: الباب ضيق، بس جوه واسع!
      ar: بابه ضيّق، لكنه واسع من الداخل!
      en: The door's narrow, but inside it's roomy!
