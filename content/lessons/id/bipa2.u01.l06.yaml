schema: kabar.lesson/v1
id: bipa2.u01.l06
language: id
title: Toko alat musik
can_do:
  ar_eg: تختار بين آلات موسيقية في محل وتقارن بينها.
  ar: أن تختار بين الآلات الموسيقية في متجر.
  en: Choose between instruments in a shop.
slides:
  - title: Lebih, paling
    body:
      ar_eg: |
        فكّر بسرعة قبل ما تدخل المحل:
        - بين اتنين: lebih + صفة + daripada → Yang ini lebih murah daripada yang itu.
        - الأكتر في الكل: paling + صفة أو ter- → Mana yang paling bagus? / Ini yang terbaik.
        - Ada yang lebih …? = فيه حاجة … أكتر؟
        وانت بتشتري: agak (شوية)، cukup (برضه / كفاية)، terlalu (زيادة)، lumayan (مش بطال).
        Terlalu mahal untuk saya = غالي عليّا زيادة. جملة مؤدبة ومش بتجرح البياع.
        في الشارع بيقولوا:
        - aja = saja (بس، وخلاص)
      ar: |
        تذكير سريع قبل دخول المتجر:
        - بين اثنين: lebih + الصفة + daripada.
        - الأكثر بين الجميع: paling + الصفة أو ter-.
        - Ada yang lebih …؟ = هل يوجد ما هو … أكثر؟
        عند الشراء: agak (قليلًا)، cukup (إلى حد ما)، terlalu (أكثر من اللازم)، lumayan (لا بأس).
        Terlalu mahal untuk saya = غالٍ جدًا بالنسبة لي، وهي عبارة مهذبة.
        في كلام الشارع:
        - aja = saja (فقط)
      en: |
        Quick reminder before you walk in:
        - Between two: lebih + adjective + daripada.
        - The most of all: paling + adjective, or ter-.
        - Ada yang lebih …? = Is there a more … one?
        While shopping: agak (a bit), cukup (fairly), terlalu (too), lumayan (not bad).
        Terlalu mahal untuk saya = too expensive for me — polite and easy on the seller.
        On the street:
        - aja = saja (just, only)
    grammar: id.comparison.lebih
    examples:
      - text: Ada yang lebih murah?
        ar_eg: فيه حاجة أرخص؟
        ar: هل يوجد ما هو أرخص؟
        en: Is there a cheaper one?
      - text: Terlalu mahal untuk saya.
        ar_eg: غالي عليّا زيادة.
        ar: إنه غالٍ جدًا بالنسبة لي.
        en: It's too expensive for me.
exercises:
  - id: e01
    type: listen
    text: Ada yang lebih murah?
    options: ['Ada yang lebih murah?', 'Ada yang paling murah?', 'Ada yang lebih mahal?']
    answer: 0
    words: [lebih, murah]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بو كومانج بتقول «Yang ini terbaik». قصدها إيه؟ اختار الجملة اللي بنفس المعنى.
      ar: تقول بو كومانغ «Yang ini terbaik». اختر الجملة التي بالمعنى نفسه.
      en: Bu Komang says "Yang ini terbaik". Pick the sentence with the same meaning.
    options: [Yang ini cukup baik., Yang ini paling baik., Yang ini lebih baik.]
    answer: 1
    explain:
      ar_eg: terbaik = paling baik = الأحسن في الكل.
      ar: terbaik = paling baik = الأفضل على الإطلاق.
      en: terbaik = paling baik = the best of all.
    words: [terbaik, paling]
  - id: e03
    type: fill_blank
    sentence: Ada banyak ___ di toko ini.
    meaning:
      ar_eg: فيه اختيارات كتير في المحل ده.
      ar: في هذا المتجر خيارات كثيرة.
      en: There's lots of choice in this shop.
    options: [pilihan, bambu, kuat]
    answers: [pilihan]
    words: [pilihan]
  - id: e04
    type: build_sentence
    source:
      ar_eg: أنهي أحسن واحد؟
      ar: أيها الأفضل؟
      en: Which one is the best?
    answer: Mana yang paling bagus?
    distractors: [lebih, daripada]
    words: [mana, paling, bagus]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز ناي أمتن. تسأل البياعة إزاي؟
      ar: تريد نايًا أمتن. كيف تسأل البائعة؟
      en: You want a sturdier flute. How do you ask the seller?
    options: ['Ada suling bambu yang lebih kuat?', 'Ada suling bambu yang lebih berat?', 'Ada bambu suling yang lebih kuat?']
    answer: 0
    words: [bambu, kuat]
  - id: e06
    type: build_sentence
    source:
      ar_eg: البامبو ده متين، بس خفيف.
      ar: هذا الخيزران متين، لكنه خفيف.
      en: This bamboo is strong, but light.
    answer: Bambu ini kuat, tapi ringan.
    distractors: [lebih, paling]
    words: [bambu, kuat, ringan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: البامبو بتاعه قوي وصوته جميل.
      ar: خيزرانه متين وصوته جميل.
      en: Its bamboo is strong and it sounds beautiful.
    answers: [Bambunya kuat dan suaranya indah., Bambunya kuat dan suaranya indah, 'Bambunya kuat, suaranya indah.', Bambunya kuat dan suaranya bagus.]
    words: [kuat, bambu, indah]
  - id: e08
    type: fill_blank
    sentence: Gitar ini bagus, tapi ___ berat untuk saya.
    meaning:
      ar_eg: الجيتار ده حلو، بس تقيل عليّا زيادة.
      ar: هذه القيثارة جيدة، لكنها ثقيلة جدًا بالنسبة لي.
      en: This guitar is nice, but too heavy for me.
    answers: [terlalu]
    words: [terlalu, berat]
  - id: e09
    type: dictation
    text: Pilihannya banyak sekali!
    meaning:
      ar_eg: الاختيارات كتير أوي!
      ar: الخيارات كثيرة جدًا!
      en: There's so much to choose from!
    words: [pilihan, banyak]
  - id: e10
    type: speaking
    text: Wah, terlalu mahal untuk saya. Ada pilihan yang lebih murah?
    meaning:
      ar_eg: يا خبر، غالي عليّا زيادة. فيه اختيار أرخص؟
      ar: آه، إنه غالٍ جدًا بالنسبة لي. هل يوجد خيار أرخص؟
      en: Oh, that's too expensive for me. Is there a cheaper choice?
    words: [terlalu, pilihan, lebih, murah]
dialogue:
  title: Di toko Bu Komang, Ubud
  lines:
    - speaker: Mohamed
      text: Berapa harganya?
      ar_eg: بكام؟
      ar: كم ثمنه؟
      en: How much is it?
    - speaker: Bu Komang
      text: Tiga ratus ribu.
      ar_eg: تلتمية ألف.
      ar: ثلاثمئة ألف.
      en: Three hundred thousand.
    - speaker: Mohamed
      text: Wah, terlalu mahal untuk saya. Ada yang lebih murah?
      ar_eg: يا خبر، غالي عليّا زيادة. فيه حاجة أرخص؟
      ar: آه، إنه غالٍ جدًا بالنسبة لي. هل يوجد ما هو أرخص؟
      en: Oh, that's too expensive for me. Is there a cheaper one?
    - speaker: Bu Komang
      text: Ada. Yang ini seratus lima puluh ribu. Agak kecil, tapi suaranya lumayan.
      ar_eg: فيه. ده بمية وخمسين ألف. صغير شوية، بس صوته مش بطال.
      ar: نعم. هذا بمئة وخمسين ألفًا. صغير قليلًا، لكن صوته لا بأس به.
      en: Yes. This one is a hundred and fifty thousand. It's a bit small, but it sounds not bad.
    - speaker: Mohamed
      text: Yang kecil lebih ringan. Saya beli yang ini aja.
      ar_eg: الصغير أخف. هشتري ده بس.
      ar: الصغير أخف. سأشتري هذا فقط.
      en: The small one is lighter. I'll just take this one.
    - speaker: Bu Komang
      text: Pilihan yang bagus! Terima kasih, Pak.
      ar_eg: اختيار حلو! شكرًا يا أستاذ.
      ar: اختيار جيد! شكرًا يا سيدي.
      en: Good choice! Thank you, sir.
