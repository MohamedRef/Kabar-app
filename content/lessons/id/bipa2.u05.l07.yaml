language: id
title: Resep nasi goreng
can_do:
  ar_eg: تكتب وصفة من ٦ خطوات.
  ar: أن تكتب وصفة من ست خطوات.
  en: Write a 6-step recipe.
slides:
  - title: Enam langkah
    body:
      ar_eg: |
        فكّر نفسك: الوصفة = أوامر ورا بعض. كل خطوة (langkah) بتبدأ بالجذر من غير meN-، وتربطها بـ lalu (وبعدين) وsampai (لحد ما).
        دي وصفة الرز المقلي في ٦ خطوات، هتحتاجها في الدرس كله:
        ١. Cuci dan potong bawang dan cabai.
        ٢. Panaskan minyak di wajan.
        ٣. Goreng bawang dan cabai sampai harum.
        ٤. Masukkan telur, lalu aduk.
        ٥. Masukkan nasi dan kecap manis, lalu aduk rata.
        ٦. Tambahkan garam, lalu cicipi.
        في الشارع بيقولوا:
        - aja = saja (بس، وخلاص)
        - gimana = bagaimana (إزاي، عامل إيه)
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
      ar: |
        تذكير: الوصفة أوامر متتالية، كل خطوة (langkah) تبدأ بالجذر بلا meN-، وتُربط بـ lalu (ثم) وsampai (حتى).
        هذه وصفة الأرز المقلي في ست خطوات:
        ١. Cuci dan potong bawang dan cabai.
        ٢. Panaskan minyak di wajan.
        ٣. Goreng bawang dan cabai sampai harum.
        ٤. Masukkan telur, lalu aduk.
        ٥. Masukkan nasi dan kecap manis, lalu aduk rata.
        ٦. Tambahkan garam, lalu cicipi.
        في كلام الشارع:
        - aja = saja (فقط)
        - gimana = bagaimana (كيف)
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
      en: |
        Reminder: a recipe is a chain of commands. Each step (langkah) starts with the bare root, linked with lalu (then) and sampai (until).
        Here is fried rice in six steps:
        1. Cuci dan potong bawang dan cabai.
        2. Panaskan minyak di wajan.
        3. Goreng bawang dan cabai sampai harum.
        4. Masukkan telur, lalu aduk.
        5. Masukkan nasi dan kecap manis, lalu aduk rata.
        6. Tambahkan garam, lalu cicipi.
        On the street:
        - aja = saja (just, only)
        - gimana = bagaimana (how)
        - banget = sekali (very), after the adjective just like sekali
    grammar: id.imperative.basic
    examples:
      - text: Panaskan minyak di wajan.
        ar_eg: سخّن الزيت في الطاسة.
        ar: سخّن الزيت في المقلاة.
        en: Heat the oil in the wok.
      - text: Masukkan nasi dan kecap manis, lalu aduk rata.
        ar_eg: حط الرز والصويا الحلوة، وبعدين قلّب كويس.
        ar: أضف الأرز وصلصة الصويا الحلوة ثم قلّب جيدًا.
        en: Add the rice and sweet soy sauce, then stir well.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: في الوصفة، بتعمل إيه قبل ما تقلي البصل؟
      ar: في الوصفة، ماذا تفعل قبل قلي البصل؟
      en: In the recipe, what do you do before frying the onions?
    options: [Panaskan minyak., Masukkan nasi., Tambahkan garam.]
    answer: 0
    explain:
      ar_eg: لازم الزيت يسخن الأول (خطوة ٢)، وبعدين تقلي البصل (خطوة ٣).
      ar: يُسخَّن الزيت أولًا (الخطوة ٢) ثم يُقلى البصل (الخطوة ٣).
      en: The oil is heated first (step 2), then the onions are fried (step 3).
    words: [panaskan, minyak]
  - id: e02
    type: listen
    text: Panaskan minyak di wajan.
    options: [Panaskan minyak di wajan., Masukkan minyak di wajan., Panaskan nasi di wajan.]
