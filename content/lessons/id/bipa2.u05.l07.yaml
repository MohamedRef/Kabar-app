dialogue:
  title: Resep dari Mohamed
  lines:
    - speaker: Rina
      text: Mohamed, nasi gorengmu enak banget! Gimana cara membuatnya?
      ar_eg: يا محمد، الرز المقلي بتاعك حلو قوي! بتعمله إزاي؟
      ar: يا محمد، أرزك المقلي لذيذ جدًّا! كيف تصنعه؟
      en: Mohamed, your fried rice is so good! How do you make it?
    - speaker: Mohamed
      text: Mudah! Pertama, cuci dan potong bawang dan cabai.
      ar_eg: سهلة! الأول اغسلي وقطّعي البصل والفلفل الحرّاق.
      ar: سهل! أولًا اغسلي البصل والفلفل الحار وقطّعيهما.
      en: Easy! First, wash and cut the onions and chillies.
    - speaker: Rina
      text: Cabainya berapa?
      ar_eg: كام فلفل حرّاق؟
      ar: كم حبة فلفل حار؟
      en: How many chillies?
    - speaker: Mohamed
      text: Tiga aja. Jangan terlalu pedas! Lalu panaskan minyak di wajan.
      ar_eg: تلاتة بس. ماتخليهوش حرّاق قوي! وبعدين سخّني الزيت في الطاسة.
      ar: ثلاث فقط، لا تجعليه حارًّا جدًّا! ثم سخّني الزيت في المقلاة.
      en: Just three. Not too spicy! Then heat the oil in the wok.
    - speaker: Rina
      text: Lalu goreng bawang dan cabainya?
      ar_eg: وبعدين أقلي البصل والفلفل؟
      ar: ثم أقلي البصل والفلفل؟
      en: Then I fry the onions and chillies?
    - speaker: Mohamed
      text: Ya, goreng sampai harum. Lalu masukkan telur dan aduk.
      ar_eg: أيوه، اقليهم لحد ما ريحتهم تطلع. وبعدين حطي البيض وقلّبي.
      ar: نعم، اقليهما حتى تفوح الرائحة، ثم أضيفي البيض وقلّبي.
      en: Yes, fry until fragrant. Then add the egg and stir.
