schema: kabar.lesson/v1
id: bipa3.u03.l01
language: id
title: Mendatangi, menghadiri
can_do:
  ar_eg: تستعمل meN-…-i بدل حرف الجر (mendatangi = يروح لـ).
  ar: أن تستعمل meN-…-i بدل حرف الجر (mendatangi = يقصد المكان).
  en: Use meN-…-i instead of a preposition.
slides:
  - title: -i "makan" preposisi
    grammar: id.confix.men-i
    body:
      ar_eg: |
        -i بتخلّي المكان أو الشخص مفعول على طول، وبتشيل حرف الجر:
        datang ke Gili → mendatangi Gili = يروح جيلي / يقصدها.
        hadir di acara → menghadiri acara = يحضر الحفلة. hadir من العربي «حاضر»، وزي العربي بالظبط: «حضرنا الحفلة» من غير حرف جر!
        bertemu dengan Pak Irwan → menemui Pak Irwan = يروح يقابل أستاذ إروان.
      ar: |
        تجعل -i المكان أو الشخص مفعولًا مباشرًا وتحذف حرف الجر:
        datang ke Gili → mendatangi Gili = يقصد جيلي.
        hadir di acara → menghadiri acara = يحضر الحفل. وhadir من العربية «حاضر»، وكما في العربية: «حضرنا الحفل» بلا حرف جر!
        bertemu dengan Pak Irwan → menemui Pak Irwan = يذهب لمقابلة الأستاذ إروان.
      en: |
        -i makes the place or person a direct object and swallows the preposition:
        datang ke Gili → mendatangi Gili = come to / visit Gili.
        hadir di acara → menghadiri acara = attend the event. hadir is from Arabic «حاضر», and just like Arabic حضرنا الحفل, no preposition!
        bertemu dengan Pak Irwan → menemui Pak Irwan = go and meet Pak Irwan.
    examples:
      - text: Banyak turis mendatangi Gili Trawangan setiap tahun.
        ar_eg: سياح كتير بييجوا جيلي تراوانجان كل سنة.
        ar: يقصد كثير من السياح جيلي تراوانغان كل عام.
        en: Many tourists come to Gili Trawangan every year.
      - text: Kami menghadiri pemutaran film di pantai.
        ar_eg: حضرنا عرض فيلم على الشط.
        ar: حضرنا عرض فيلم على الشاطئ.
        en: We attended a film screening on the beach.
  - title: Tanpa ke, di, dengan!
    grammar: id.confix.men-i
    body:
      ar_eg: |
        بعد فعل -i مفيش حرف جر خالص: menghadiri acara، مش menghadiri ke acara.
        وخلي بالك: mendatangi (يروح لمكان) غير mendatangkan (يجيب / يستورد حاجة).
      ar: |
        لا يأتي بعد فعل -i حرف جر: menghadiri acara لا menghadiri ke acara.
        وانتبه: mendatangi (يقصد مكانًا) غير mendatangkan (يجلب / يستورد).
      en: |
        No preposition after an -i verb: menghadiri acara, never menghadiri ke acara.
        Careful: mendatangi (come to a place) is not mendatangkan (bring in, import).
    examples:
      - text: Rina menemui Pak Irwan di kafe.
        ar_eg: رينا راحت قابلت أستاذ إروان في الكافيه.
        ar: ذهبت رينا لمقابلة الأستاذ إروان في المقهى.
        en: Rina goes to meet Pak Irwan at the café.
      - text: Para penonton duduk di pasir di depan layar.
        ar_eg: المتفرجين قاعدين على الرملة قدام الشاشة.
        ar: يجلس المشاهدون على الرمل أمام الشاشة.
        en: The audience sits on the sand in front of the screen.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mendatangi
        ar_eg: يروح لـ، يقصد (مكان)
        ar: يقصد (مكانًا)
        en: to come to, visit (a place)
      - text: menghadiri
        ar_eg: يحضر (حفلة، اجتماع)
        ar: يحضر (حفلًا، اجتماعًا)
        en: to attend
      - text: menemui
        ar_eg: يروح يقابل
        ar: يذهب لمقابلة
        en: to go and meet
      - text: pemutaran film
        ar_eg: عرض فيلم
        ar: عرض فيلم
        en: film screening
      - text: layar
        ar_eg: شاشة
        ar: شاشة
        en: screen
      - text: penonton
        ar_eg: متفرّج
        ar: مشاهد
        en: viewer, audience
    words: [mendatangi, menghadiri, menemui, pemutaran film, layar, penonton]
  - id: e02
    type: multiple_choice
    question: Kami ___ acara itu.
    options: [menghadiri ke, menghadiri, hadir]
    answer: 1
    explain:
      ar_eg: menghadiri بتاخد المفعول على طول من غير ke. و hadir لوحدها محتاجة di (hadir di acara).
      ar: يأخذ menghadiri المفعول مباشرة بلا ke، أما hadir وحدها فتحتاج إلى di.
      en: menghadiri takes its object directly, no ke; bare hadir would need di (hadir di acara).
    words: [menghadiri]
  - id: e03
    type: listen
    text: Banyak turis mendatangi Gili Trawangan setiap tahun.
    options: ["Banyak turis mendatangi Gili Trawangan setiap tahun.", "Banyak turis mendatangkan Gili Trawangan setiap tahun.", "Banyak turis mendatangi Gili Trawangan setiap bulan."]
    answer: 0
    meaning:
      ar_eg: سياح كتير بييجوا جيلي تراوانجان كل سنة.
      ar: يقصد كثير من السياح جيلي تراوانغان كل عام.
      en: Many tourists come to Gili Trawangan every year.
    words: [mendatangi]
  - id: e04
    type: multiple_choice
    question: Saya mau ___ Pak Irwan di kantornya.
    options: [menemui dengan, menemui ke, menemui]
    answer: 2
    explain:
      ar_eg: menemui فعل -i، يعني مفيش dengan ولا ke بعده.
      ar: menemui فعل -i، فلا يليه dengan ولا ke.
      en: menemui is an -i verb, so no dengan or ke after it.
    words: [menemui]
  - id: e05
    type: fill_blank
    sentence: Malam ini ada ___ film di layar besar di pantai.
    meaning:
      ar_eg: النهارده بالليل فيه عرض فيلم على شاشة كبيرة على الشط.
      ar: الليلة عرض فيلم على شاشة كبيرة على الشاطئ.
      en: Tonight there's a film screening on a big screen on the beach.
    options: [penonton, pemutaran, layar]
    answers: [pemutaran]
    words: [pemutaran film, layar]
  - id: e06
    type: fill_blank
    sentence: Para ___ duduk di pasir di depan layar.
    meaning:
      ar_eg: المتفرجين قاعدين على الرملة قدام الشاشة.
      ar: يجلس المشاهدون على الرمل أمام الشاشة.
      en: The audience sits on the sand in front of the screen.
    options: [penonton, layar, pemutaran]
    answers: [penonton]
    words: [penonton, layar]
  - id: e07
    type: build_sentence
    source:
      ar_eg: رينا راحت قابلت أستاذ إروان في الكافيه.
      ar: ذهبت رينا لمقابلة الأستاذ إروان في المقهى.
      en: Rina goes to meet Pak Irwan at the café.
    answer: Rina menemui Pak Irwan di kafe.
    distractors: [dengan, ke]
    words: [menemui]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: حضرنا عرض الفيلم على الشط.
      ar: حضرنا عرض الفيلم على الشاطئ.
      en: We attended the film screening on the beach.
    answers:
      - Kami menghadiri pemutaran film di pantai.
      - Kami menghadiri pemutaran film di pantai
      - Kita menghadiri pemutaran film di pantai.
      - Kami menghadiri pemutaran filmnya di pantai.
      - Kami sudah menghadiri pemutaran film di pantai.
      - "Kami udah menghadiri pemutaran film di pantai."
    words: [menghadiri, pemutaran film]
  - id: e09
    type: speaking
    text: Malam ini banyak penonton mendatangi pantai.
    meaning:
      ar_eg: النهارده بالليل متفرجين كتير جايين الشط.
      ar: الليلة يقصد مشاهدون كثيرون الشاطئ.
      en: Tonight lots of viewers are coming to the beach.
    words: [penonton, mendatangi]
dialogue:
  title: Bioskop di pantai
  lines:
    - speaker: Ni Luh
      text: Mohamed, malam ini ada pemutaran film di pantai. Mau ikut?
      ar_eg: يا محمد، النهارده بالليل فيه عرض فيلم على الشط. تيجي؟
      ar: يا محمد، الليلة عرض فيلم على الشاطئ. أتأتي؟
      en: Mohamed, there's a film screening on the beach tonight. Want to come?
    - speaker: Mohamed
      text: Mau! Yang datang banyak nggak?
      ar_eg: أيوه! بييجي ناس كتير؟
      ar: نعم! هل يأتي كثير من الناس؟
      en: Yes! Do many people come?
    - speaker: Ni Luh
      text: Banyak! Tiap malam banyak turis mendatangi bioskop pantai itu.
      ar_eg: أيوه، كل ليلة سياح كتير بيروحوا السينما اللي على الشط دي.
      ar: نعم، كل ليلة يقصد كثير من السياح تلك السينما الشاطئية.
      en: Yes, every night lots of tourists come to that beach cinema.
    - speaker: Mohamed
      text: Layarnya di mana?
      ar_eg: الشاشة فين؟
      ar: أين الشاشة؟
      en: Where's the screen?
    - speaker: Ni Luh
      text: Di depan kafe. Penontonnya duduk di pasir. Aku tungguin di sana jam delapan, ya!
      ar_eg: قدام الكافيه. المتفرجين بيقعدوا على الرملة. هستناك هناك الساعة تمانية!
      ar: أمام المقهى، ويجلس المشاهدون على الرمل. سأنتظرك هناك في الثامنة!
      en: In front of the café. The audience sits on the sand. I'll wait for you there at eight!
