schema: kabar.lesson/v1
id: bipa2.u03.l04
language: id
title: Sering terlambat
can_do:
  ar_eg: تفهم إعلان عن تأخير رحلة.
  ar: أن تفهم إعلانًا عن تأخر رحلة.
  en: Understand a delay announcement.
slides:
  - title: Selalu … tidak pernah
    body:
      ar_eg: |
        فاكر كلمات التكرار من BIPA 1؟ من الأكتر للأقل:
        selalu (دايمًا) — biasanya (عادةً) — sering (كتير) — kadang-kadang (ساعات) — jarang (نادرًا) — tidak pernah (عمره ما).
        مكانها قبل الفعل أو الصفة: Pesawat ini sering terlambat = الطيارة دي بتتأخر كتير.
        في الشارع بيقولوا:
        - nggak = tidak (مش، لأ)
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
      ar: |
        أتذكر ظروف التكرار من BIPA 1؟ من الأكثر إلى الأقل:
        selalu (دائمًا) — biasanya (عادةً) — sering (كثيرًا) — kadang-kadang (أحيانًا) — jarang (نادرًا) — tidak pernah (أبدًا).
        وموضعها قبل الفعل أو الصفة: Pesawat ini sering terlambat.
        في كلام الشارع:
        - nggak = tidak (لا، ليس)
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
      en: |
        Remember the frequency words from BIPA 1? Most to least:
        selalu (always) — biasanya (usually) — sering (often) — kadang-kadang (sometimes) — jarang (rarely) — tidak pernah (never).
        They go before the verb or adjective: Pesawat ini sering terlambat = This plane is often late.
        On the street:
        - nggak = tidak (not, no)
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
    grammar: id.frequency.adverbs
    examples:
      - text: Kereta ini sering terlambat.
        ar_eg: القطر ده بيتأخر كتير.
        ar: هذا القطار يتأخر كثيرًا.
        en: This train is often late.
      - text: Pesawat ke Kairo jarang terlambat.
        ar_eg: طيارة القاهرة نادرًا لما بتتأخر.
        ar: نادرًا ما تتأخر الطائرة المتجهة إلى القاهرة.
        en: The plane to Cairo is rarely late.
  - title: Tepat waktu, terlambat
    body:
      ar_eg: |
        - terlambat = متأخر (وعلى فكرة ter- هنا مش «الأكتر»، زي terkenal).
        - tepat waktu = في المعاد بالظبط. waktu جاية من العربي «وقت».
        - jadwal = جدول المواعيد، من العربي «جدول».
        وعدد المرات: tiga kali sehari = تلات مرات في اليوم، sekali seminggu = مرة في الأسبوع.
      ar: |
        - terlambat = متأخر (وter- هنا ليست للتفضيل، مثل terkenal).
        - tepat waktu = في الموعد تمامًا، وwaktu من العربية «وقت».
        - jadwal = جدول المواعيد، من العربية «جدول».
        ولعدد المرات: tiga kali sehari = ثلاث مرات في اليوم، sekali seminggu = مرة في الأسبوع.
      en: |
        - terlambat = late (this ter- isn't "most" either, like terkenal).
        - tepat waktu = on time; waktu comes from Arabic «وقت».
        - jadwal = timetable, from Arabic «جدول».
        Counting: tiga kali sehari = three times a day, sekali seminggu = once a week.
    grammar: id.frequency.adverbs
    examples:
      - text: Pesawat ke Jakarta berangkat tiga kali sehari.
        ar_eg: الطيارة لجاكرتا بتطلع تلات مرات في اليوم.
        ar: تقلع الطائرة إلى جاكرتا ثلاث مرات يوميًا.
        en: The plane to Jakarta leaves three times a day.
      - text: Kereta ini selalu tepat waktu.
        ar_eg: القطر ده دايمًا في معاده.
        ar: هذا القطار دائمًا في موعده.
        en: This train is always on time.
  - title: Mohon maaf atas keterlambatan
    body:
      ar_eg: |
        إعلان التأخير شكله كده:
        Mohon perhatian. Penerbangan GA 402 tujuan Jakarta terlambat tiga puluh menit. Mohon maaf atas keterlambatan ini.
        - penerbangan = رحلة طيران، tujuan = متجهة لـ
        - keterlambatan = التأخير (احفظها كده جملة جاهزة)
      ar: |
        هكذا يبدو إعلان التأخير:
        Mohon perhatian. Penerbangan GA 402 tujuan Jakarta terlambat tiga puluh menit. Mohon maaf atas keterlambatan ini.
        - penerbangan = رحلة جوية، tujuan = المتجهة إلى
        - keterlambatan = التأخير (احفظها عبارةً جاهزة)
      en: |
        A delay announcement looks like this:
        Mohon perhatian. Penerbangan GA 402 tujuan Jakarta terlambat tiga puluh menit. Mohon maaf atas keterlambatan ini.
        - penerbangan = flight, tujuan = bound for
        - keterlambatan = the delay (learn it as a set phrase)
    grammar: id.frequency.adverbs
    examples:
      - text: Mohon maaf atas keterlambatan ini.
        ar_eg: بنعتذر عن التأخير ده.
        ar: نعتذر عن هذا التأخير.
        en: We apologise for this delay.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tepat waktu
        ar_eg: في المعاد
        ar: في الموعد
        en: on time
      - text: terlambat
        ar_eg: متأخر
        ar: متأخر
        en: late
      - text: jadwal
        ar_eg: جدول مواعيد
        ar: جدول مواعيد
        en: timetable
      - text: penerbangan
        ar_eg: رحلة طيران
        ar: رحلة جوية
        en: flight
      - text: tujuan
        ar_eg: وجهة، متجهة لـ
        ar: وجهة
        en: destination
      - text: keterlambatan
        ar_eg: تأخير
        ar: تأخير
        en: delay
    words: [tepat waktu, terlambat, jadwal, penerbangan, tujuan, keterlambatan]
  - id: e02
    type: listen
    text: Penerbangan ke Jakarta terlambat tiga puluh menit.
    options: [Penerbangan ke Jakarta terlambat tiga puluh menit., Penerbangan ke Jakarta terlambat tiga belas menit., Penerbangan ke Jakarta tepat waktu.]
    answer: 0
    words: [penerbangan, terlambat, menit]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إمتى تسمع «Mohon maaf atas keterlambatan ini»؟
      ar: متى تسمع «Mohon maaf atas keterlambatan ini»؟
      en: When do you hear "Mohon maaf atas keterlambatan ini"?
    options: [Pesawat tepat waktu., Pesawat sudah datang., Pesawat terlambat.]
    answer: 2
    explain:
      ar_eg: keterlambatan = التأخير، فالإعلان بيعتذر عن تأخير.
      ar: keterlambatan = التأخير، فالإعلان اعتذار عن تأخر.
      en: keterlambatan = delay, so they're apologising for a late flight.
    words: [keterlambatan]
  - id: e04
    type: fill_blank
    sentence: Kereta ini ___ tepat waktu. Tidak pernah terlambat!
    meaning:
      ar_eg: القطر ده دايمًا في معاده. عمره ما بيتأخر!
      ar: هذا القطار دائمًا في موعده، ولا يتأخر أبدًا!
      en: This train is always on time. It's never late!
    options: [selalu, kadang-kadang, jarang]
    answers: [selalu]
    words: [selalu, tepat waktu]
    explain:
      ar_eg: «عمره ما بيتأخر» يبقى selalu tepat waktu (دايمًا في ميعاده). kadang-kadang = ساعات، وjarang = نادرًا.
      ar: «لا يتأخر أبدًا» أي selalu tepat waktu. أما kadang-kadang فـ«أحيانًا» وjarang «نادرًا».
      en: "\"Never late\" means selalu (always) on time. kadang-kadang is sometimes, jarang is rarely."
  - id: e05
    type: build_sentence
    source:
      ar_eg: القطر ده بيتأخر كتير.
      ar: هذا القطار يتأخر كثيرًا.
      en: This train is often late.
    answer: Kereta ini sering terlambat.
    distractors: [selalu, waktu]
    words: [sering, terlambat]
    explain:
      ar_eg: "«كتير» = sering، وبتيجي قبل الفعل: sering terlambat. selalu = دايمًا، وده أقوى من «كتير»."
      ar: "«كثيرًا» = sering قبل الفعل: sering terlambat. أما selalu فـ«دائمًا»، وهي أقوى."
      en: "\"Often\" is sering, before the verb: sering terlambat. selalu (always) is stronger."
  - id: e06
    type: listen
    text: Jadwal penerbangan tujuan Kairo ada di sana.
    options: ['Jadwal penerbangan tujuan Kairo ada di sana.', 'Jadwal penerbangan tujuan Jakarta ada di sana.', 'Jadwal kereta tujuan Kairo ada di sana.']
    answer: 0
    meaning:
      ar_eg: جدول رحلات القاهرة هناك.
      ar: جدول الرحلات المتجهة إلى القاهرة هناك.
      en: The schedule for flights to Cairo is over there.
    words: [jadwal, penerbangan, tujuan]
  - id: e07
    type: listen
    text: Jadwal pesawat ada di sana.
    options: [Jadwal pesawat ada di sana., Jadwal kereta ada di sana., Jadwal pesawat ada di sini.]
    answer: 0
    words: [jadwal]
  - id: e08
    type: speaking
    text: Mohon perhatian. Penerbangan tujuan Jakarta terlambat tiga puluh menit.
    meaning:
      ar_eg: انتباه من فضلكم. رحلة جاكرتا متأخرة تلاتين دقيقة.
      ar: انتباه من فضلكم. رحلة جاكرتا متأخرة ثلاثين دقيقة.
      en: Attention please. The flight to Jakarta is thirty minutes late.
    words: [penerbangan, tujuan, terlambat, menit]
  - id: e09
    type: fill_blank
    sentence: Mohon maaf atas ___ tiga puluh menit ini.
    meaning:
      ar_eg: نعتذر عن التأخير ده نص الساعة.
      ar: نعتذر عن هذا التأخير لمدة ثلاثين دقيقة.
      en: We apologise for this thirty-minute delay.
    options: [keterlambatan, jadwal, tujuan]
    answers: [keterlambatan]
    words: [keterlambatan, menit]
    explain:
      ar_eg: "atas + اسم: keterlambatan = التأخير (ke-…-an + terlambat). jadwal = جدول، وtujuan = وجهة."
      ar: "بعد atas يأتي اسم: keterlambatan = التأخير (ke-…-an + terlambat). أما jadwal فجدول وtujuan وجهة."
      en: "atas needs a noun: keterlambatan = the delay (ke-…-an + terlambat). jadwal is a timetable, tujuan a destination."
dialogue:
  title: Di ruang tunggu
  lines:
    - speaker: Pengumuman
      text: Mohon perhatian. Penerbangan GA 402 tujuan Jakarta terlambat tiga puluh menit. Mohon maaf atas keterlambatan ini.
      ar_eg: انتباه من فضلكم. رحلة GA 402 المتجهة لجاكرتا متأخرة تلاتين دقيقة. بنعتذر عن التأخير ده.
      ar: انتباه من فضلكم. رحلة GA 402 المتجهة إلى جاكرتا متأخرة ثلاثين دقيقة. نعتذر عن هذا التأخير.
      en: Attention please. Flight GA 402 to Jakarta is delayed by thirty minutes. We apologise for this delay.
    - speaker: Mohamed
      text: Wah, terlambat lagi! Pesawat ini sering terlambat, ya?
      ar_eg: يا خبر، متأخرة تاني! الطيارة دي بتتأخر كتير، مش كده؟
      ar: يا للأسف، تأخرت مرة أخرى! هذه الطائرة تتأخر كثيرًا، أليس كذلك؟
      en: Oh no, late again! This plane is often late, isn't it?
    - speaker: Mas Rizal
      text: Kadang-kadang. Biasanya tepat waktu.
      ar_eg: ساعات. عادةً بتبقى في معادها.
      ar: أحيانًا. عادةً تكون في موعدها.
      en: Sometimes. It's usually on time.
    - speaker: Mohamed
      text: Nggak apa-apa. Kita minum kopi dulu aja.
      ar_eg: مش مشكلة. نشرب قهوة الأول.
      ar: لا بأس. لنشرب القهوة أولًا.
      en: No problem. Let's have a coffee first.
    - speaker: Mas Rizal
      text: Ide bagus! Aku selalu minum kopi di bandara.
      ar_eg: فكرة حلوة! أنا دايمًا بشرب قهوة في المطار.
      ar: فكرة جيدة! أنا أشرب القهوة دائمًا في المطار.
      en: Good idea! I always have coffee at the airport.
