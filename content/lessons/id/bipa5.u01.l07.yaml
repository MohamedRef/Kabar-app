schema: kabar.lesson/v1
id: bipa5.u01.l07
language: id
title: Hari pertama di kantor
can_do:
  ar_eg: 'تتعرف على زمايلك في أول يوم: المرشد اللي معاك، الخبير والمقاول والمصمم والمحاسب، وتوري التزامك ومبادرتك.'
  ar: 'أن تتعرّف على زملائك في اليوم الأول: مرافقك، والخبير والمقاول والمصمّم والمحاسب، وتُظهر التزامك ومبادرتك.'
  en: 'Meet your colleagues on day one: your mentor, the expert, contractor, designer and accountant, and show commitment and initiative.'
slides:
  - title: Kenalan dengan tim
    body:
      ar_eg: |
        pendamping = مرافق أو مرشد جنبك، bimbingan = توجيه وإرشاد.
        pakar = خبير كبير، kontraktor = مقاول، desainer = مصمم، akuntan = محاسب.
        inisiatif = مبادرة: punya inisiatif = بيبادر من غير ما حد يقوله.
        berkomitmen = ملتزم: berkomitmen pada pekerjaan = ملتزم بشغله.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: kasih = beri.
      ar: |
        pendamping = مرافق، مرشد، bimbingan = توجيه وإرشاد.
        pakar = خبير بارز، kontraktor = مقاول، desainer = مصمّم، akuntan = محاسب.
        inisiatif = مبادرة: punya inisiatif = يبادر دون أن يُطلب منه.
        berkomitmen = ملتزم: berkomitmen pada pekerjaan = ملتزم بعمله.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: kasih = beri.
      en: |
        pendamping = companion, mentor, bimbingan = guidance.
        pakar = leading expert, kontraktor = contractor, desainer = designer, akuntan = accountant.
        inisiatif = initiative: punya inisiatif = acts without being told.
        berkomitmen = committed: berkomitmen pada pekerjaan = committed to the job.
        The dialogue uses street forms; the formal ones are beside them: kasih = beri.
    examples:
      - text: Karyawan baru mendapat pendamping selama sebulan.
        ar_eg: الموظف الجديد بياخد مرشد معاه لمدة شهر.
        ar: يحصل الموظف الجديد على مرافق لمدة شهر.
        en: New staff get a mentor for a month.
      - text: Beliau pakar energi, bukan sekadar akuntan.
        ar_eg: حضرته خبير طاقة، مش مجرد محاسب.
        ar: إنه خبير في الطاقة، لا مجرد محاسب.
        en: He's an energy expert, not just an accountant.
      - text: Kami mencari orang yang berkomitmen dan punya inisiatif.
        ar_eg: بندور على حد ملتزم وعنده مبادرة.
        ar: نبحث عن شخص ملتزم وصاحب مبادرة.
        en: We're looking for someone committed with initiative.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pendamping
        ar_eg: مرافق، مرشد
        ar: مرافق
        en: companion, mentor
      - text: bimbingan
        ar_eg: توجيه
        ar: إرشاد
        en: guidance
      - text: inisiatif
        ar_eg: مبادرة
        ar: مبادرة
        en: initiative
      - text: berkomitmen
        ar_eg: ملتزم
        ar: ملتزم
        en: committed
    words: [pendamping, bimbingan, inisiatif, berkomitmen]
  - id: e02
    type: match_pairs
    pairs:
      - text: pakar
        ar_eg: خبير
        ar: خبير
        en: expert
      - text: kontraktor
        ar_eg: مقاول
        ar: مقاول
        en: contractor
      - text: desainer
        ar_eg: مصمم
        ar: مصمّم
        en: designer
      - text: akuntan
        ar_eg: محاسب
        ar: محاسب
        en: accountant
    words: [pakar, kontraktor, desainer, akuntan]
  - id: e03
    type: listen
    text: Akuntan kami sedang memeriksa laporan pajak.
    question:
      ar_eg: مين بيراجع التقرير؟
      ar: من يراجع التقرير؟
      en: Who is checking the report?
    options: [المصمم, المقاول, المحاسب]
    answer: 2
    meaning:
      ar_eg: المحاسب بتاعنا بيراجع تقرير الضرايب.
      ar: محاسبنا يراجع تقرير الضرائب.
      en: Our accountant is checking the tax report.
    words: [akuntan]
  - id: e04
    type: fill_blank
    sentence: Gedung kantor baru itu dibangun oleh ___ dari Samarinda.
    meaning:
      ar_eg: مبنى المكتب الجديد بناه ___ من ساماريندا.
      ar: بنى مبنى المكتب الجديد ___ من ساماريندا.
      en: The new office building was built by a ___ from Samarinda.
    options: [desainer, kontraktor, pendamping]
    answers: [kontraktor]
    words: [desainer, kontraktor, pendamping]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيرسم شكل اللوجو والموقع؟
      ar: من يرسم شكل الشعار والموقع؟
      en: Who draws the logo and the website?
    options: [akuntan, pakar, desainer]
    answer: 2
    explain:
      ar_eg: desainer = مصمم.
      ar: desainer = مصمّم.
      en: desainer = designer.
    words: [akuntan, pakar, desainer]
  - id: e06
    type: fill_blank
    sentence: Dengan ___ dari Bu Lestari, saya cepat paham sistem kantor.
    meaning:
      ar_eg: بـ___ مدام ليستاري فهمت نظام المكتب بسرعة.
      ar: بـ___ من السيدة ليستاري فهمت نظام المكتب بسرعة.
      en: With Bu Lestari's ___, I quickly understood how the office works.
    options: [bimbingan, inisiatif, kontraktor]
    answers: [bimbingan]
    words: [bimbingan, inisiatif, kontraktor]
  - id: e07
    type: multiple_choice
    question: Dia membuat jadwal rapat tanpa disuruh. Dia punya ___.
    options: [inisiatif, pendamping, berkomitmen]
    answer: 0
    explain:
      ar_eg: 'inisiatif = مبادرة: عمل كده من نفسه.'
      ar: 'inisiatif = مبادرة: فعل ذلك من تلقاء نفسه.'
      en: 'inisiatif = initiative: she did it on her own.'
    words: [inisiatif, pendamping, berkomitmen]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الخبير ده بيدي توجيه للموظفين الجداد.
      ar: يقدّم هذا الخبير التوجيه للموظفين الجدد.
      en: This expert gives guidance to new staff.
    answer: Pakar ini memberi bimbingan kepada karyawan baru.
    distractors: [akuntan, desainer]
    words: [pakar, bimbingan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Saya berkomitmen pada pekerjaan ini.
    answers_meaning:
      ar_eg: [أنا ملتزم بالشغل ده, أنا ملتزم في الشغلانة دي]
      ar: [أنا ملتزم بهذا العمل, ألتزم بهذا العمل]
      en: ['I''m committed to this job', I am committed to this work]
    words: [berkomitmen]
  - id: e10
    type: speaking
    text: Pendamping saya seorang pakar dan dulu kontraktor.
    meaning:
      ar_eg: المرشد بتاعي خبير وكان مقاول زمان.
      ar: مرافقي خبير وكان مقاولًا سابقًا.
      en: My mentor is an expert and used to be a contractor.
    words: [pendamping, pakar, kontraktor]
dialogue:
  lines:
    - speaker: Bu Lestari
      text: Selamat datang, Pak Mohamed. Saya pendamping Anda bulan ini.
      ar_eg: أهلًا يا أستاذ محمد. أنا المرشدة بتاعتك الشهر ده.
      ar: أهلًا بك يا أستاذ محمد. أنا مرافقتك هذا الشهر.
      en: Welcome, Mohamed. I'm your mentor this month.
    - speaker: Mohamed
      text: Terima kasih, Bu. Saya butuh bimbingan Ibu.
      ar_eg: شكرًا يا فندم. أنا محتاج توجيه حضرتك.
      ar: شكرًا يا سيّدتي. أحتاج إلى إرشادك.
      en: Thank you. I'll need your guidance.
    - speaker: Bu Lestari
      text: Itu Pak Yusuf, akuntan kami. Di sebelahnya Mbak Wati, desainer.
      ar_eg: ده أستاذ يوسف، المحاسب بتاعنا. وجنبه مدام واتي، المصممة.
      ar: هذا الأستاذ يوسف، محاسبنا. وبجانبه واتي، المصمّمة.
      en: That's Pak Yusuf, our accountant. Next to him is Wati, the designer.
    - speaker: Mohamed
      text: Dan bapak di ruang rapat itu?
      ar_eg: والأستاذ اللي في أوضة الاجتماعات؟
      ar: والسيد في قاعة الاجتماعات؟
      en: And the man in the meeting room?
    - speaker: Bu Lestari
      text: Pakar geologi. Dia rapat dengan kontraktor dari Jakarta.
      ar_eg: خبير جيولوجيا. عنده اجتماع مع مقاول من جاكرتا.
      ar: خبير جيولوجيا، يجتمع بمقاول من جاكرتا.
      en: A geology expert. He's meeting a contractor from Jakarta.
    - speaker: Mohamed
      text: Baik. Saya berkomitmen belajar cepat, Bu.
      ar_eg: تمام. أنا ملتزم إني أتعلم بسرعة.
      ar: حسنًا. ألتزم بأن أتعلّم بسرعة.
      en: All right. I'm committed to learning fast.
