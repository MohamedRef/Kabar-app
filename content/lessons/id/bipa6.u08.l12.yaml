schema: kabar.lesson/v1
id: bipa6.u08.l12
language: id
title: Siniar sains
can_do:
  ar_eg: تقدّم حلقة بودكاست علمي قصيرة وتشرح ظاهرة طبيعية بكلام سهل.
  ar: أن تقدّم حلقة قصيرة من بودكاست علمي وتشرح ظاهرة طبيعية بلغة سهلة.
  en: Host a short science podcast episode and explain a natural phenomenon in plain words.
slides:
  - title: Halo, pendengar!
    body:
      ar_eg: |
        الـ siniar = بودكاست (الكلمة الرسمية في القاموس، من siaran + internet).
        - episode = حلقة: Di episode kali ini, kita membahas …
        خطوات الحلقة:
        1. افتح بسؤال: Pernahkah Anda bertanya-tanya kenapa …?
        2. اشرح بـ perumpamaan (تشبيه): Lempeng tektonik itu seperti kerupuk yang retak.
        3. لخّص: Pada dasarnya, …
        4. اختم: Sampai jumpa di episode berikutnya!
        - في الشارع: udah = sudah (خلاص / بالفعل).
        - dong كلمة صغيرة بتدّي الجملة إحساس (تأكيد ودّي)، ومن غيرها الجملة صح برضه.
      ar: |
        الـ siniar = بودكاست (الكلمة المعجمية، من siaran + internet).
        - episode = حلقة: Di episode kali ini, kita membahas …
        خطوات الحلقة:
        ١. افتتح بسؤال: Pernahkah Anda bertanya-tanya kenapa …?
        ٢. اشرح بـ perumpamaan (تشبيه): Lempeng tektonik itu seperti kerupuk yang retak.
        ٣. لخّص: Pada dasarnya, …
        ٤. اختم: Sampai jumpa di episode berikutnya!
        - في كلام الشارع: udah = sudah (قد / بالفعل).
        - dong أداة صغيرة تلوّن الجملة (تأكيد ودّي)، والجملة صحيحة بدونها.
      en: |
        siniar = podcast (the dictionary word, from siaran + internet).
        - episode = episode: Di episode kali ini, kita membahas …
        Steps:
        1. Open with a question: Pernahkah Anda bertanya-tanya kenapa …?
        2. Explain with a perumpamaan (comparison): Lempeng tektonik itu seperti kerupuk yang retak.
        3. Sum up: Pada dasarnya, …
        4. Sign off: Sampai jumpa di episode berikutnya!
        - On the street: udah = sudah (already).
        - dong is a small particle that adds feeling (friendly emphasis); the sentence is correct without it.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: "«siniar» يعني إيه؟"
      ar: ما «siniar»؟
      en: What is a "siniar"?
    options:
      - Acara televisi.
      - Acara audio yang bisa didengarkan kapan saja, seperti podcast.
      - Koran.
    answer: 1
    explain:
      ar_eg: "siniar هي الكلمة الإندونيسي للبودكاست: برنامج صوتي تسمعه وقت ما تحب. مش برنامج تلفزيون ولا جرنال."
      ar: "siniar هي الكلمة الإندونيسية للبودكاست: برنامج صوتي يُسمع متى شئت؛ لا برنامج تلفاز ولا صحيفة."
      en: "siniar is the Indonesian word for podcast: audio you can hear any time. Not a TV show or a newspaper."
    words: [siniar]
  - id: e02
    type: listen
    text: Halo, pendengar setia! Di episode kali ini, kita membahas kenapa penyu selalu kembali ke pantai yang sama. Tamu kita seorang peneliti dari Bengkulu.
    question:
      ar_eg: الحلقة دي عن إيه؟
      ar: عمّ هذه الحلقة؟
      en: What is this episode about?
    options:
      - Tentang gunung api.
      - Tentang kacang hijau.
      - Tentang penyu yang pulang ke pantai yang sama.
    answer: 2
    explain:
      ar_eg: kenapa penyu selalu kembali ke pantai yang sama = ليه السلاحف بترجع دايمًا لنفس الشط، والضيف باحث. البراكين والفول مش موضوعها.
      ar: لماذا تعود السلاحف دائمًا إلى الشاطئ نفسه، والضيف باحث؛ لا البراكين ولا الفول.
      en: Why turtles always return to the same beach, with a researcher as guest. Not volcanoes or beans.
    words: [episode]
  - id: e03
    type: fill_blank
    sentence: Terima kasih sudah mendengarkan. Sampai jumpa di ___ berikutnya!
    meaning:
      ar_eg: شكرًا إنكم سمعتونا. نشوفكم في الحلقة الجاية!
      ar: شكرًا على الاستماع، إلى اللقاء في الحلقة القادمة!
      en: Thanks for listening. See you in the next episode!
    options: [episode, siniar, sarang]
    answers: [episode]
    words: [episode]
    explain:
      ar_eg: «نتقابل في الحلقة الجاية» = di episode berikutnya. siniar البرنامج كله، وsarang = عش.
      ar: «نلتقي في الحلقة القادمة» di episode berikutnya؛ أمّا siniar فالبرنامج كلّه، وsarang عشّ.
      en: "\"See you in the next episode\" is di episode berikutnya. siniar is the whole podcast, and sarang a nest."
  - id: e04
    type: build_sentence
    source:
      ar_eg: الصفايح دي زي البسكوت المكسور.
      ar: هذه الصفائح كالبسكويت المكسور.
      en: These plates are like a cracked cracker.
    answer: Lempeng itu seperti kerupuk yang retak.
    distractors: [episode, siniar]
    words: [perumpamaan, lempeng tektonik]
    explain:
      ar_eg: «الألواح زي كرونة متشرخة» = Lempeng itu seperti kerupuk yang retak. episode وsiniar مش في المعنى.
      ar: «الصفائح كرقاقة متشقّقة» Lempeng itu seperti kerupuk yang retak؛ أمّا episode وsiniar فليستا في المعنى.
      en: "\"The plates are like a cracked cracker\" is Lempeng itu seperti kerupuk yang retak. episode and siniar aren't in the meaning."
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: البودكاست بتاعي بيتكلم عن العلوم بطريقة بسيطة.
      ar: يتناول البودكاست الخاصّ بي العلوم بأسلوب بسيط.
      en: My podcast talks about science in a simple way.
    answers:
      - Siniar saya membahas sains dengan cara yang sederhana.
      - Siniar saya membahas sains dengan cara sederhana.
      - Siniar saya berbicara tentang sains dengan cara yang sederhana.
      - Siniar saya membahas ilmu pengetahuan dengan cara yang sederhana.
      - Siniar aku membahas sains dengan cara yang sederhana.
      - Siniar aku membahas sains dengan cara sederhana.
      - Siniar aku berbicara tentang sains dengan cara yang sederhana.
      - Siniar aku membahas ilmu pengetahuan dengan cara yang sederhana.
    words: [siniar, sederhana]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي بداية أحسن لحلقة بودكاست؟
      ar: أيّ افتتاحية أفضل لحلقة بودكاست؟
      en: Which is the best opening for a podcast episode?
    options:
      - Pernahkah Anda bertanya-tanya kenapa gunung bisa meletus?
      - Bab tiga, halaman empat puluh dua.
      - Dengan hormat, bersama surat ini …
    answer: 0
    words: [episode]
    explain:
      ar_eg: البودكاست يبدأ بسؤال يشدّ السامع. «الفصل التالت» للكتاب، و«Dengan hormat» للخطابات الرسمية.
      ar: تبدأ الحلقة بسؤال يشدّ المستمع؛ أمّا «الفصل الثالث» فللكتب، و«Dengan hormat» للرسائل الرسمية.
      en: A podcast opens with a hook question. "Chapter three" is for books, and "Dengan hormat" for formal letters.
  - id: e07
    type: speaking
    text: Halo, pendengar! Selamat datang di siniar Sains Santai.
    meaning:
      ar_eg: أهلًا يا مستمعين! أهلًا بيكم في بودكاست «علوم على راحتنا».
      ar: مرحبًا أيّها المستمعون! أهلًا بكم في بودكاست «علوم بهدوء».
      en: Hello, listeners! Welcome to the Relaxed Science podcast.
    words: [siniar]
  - id: e08
    type: dictation
    text: Episode tentang gempa susulan didengarkan oleh ribuan orang, karena gempa besar baru saja terjadi.
    meaning:
      ar_eg: حلقة الهزات الارتدادية سمعها آلاف الناس، علشان لسه كان فيه زلزال كبير.
      ar: استمع آلاف الناس إلى حلقة الهزّات الارتدادية، لأنّ زلزالًا كبيرًا وقع للتوّ.
      en: The episode about aftershocks was heard by thousands, because a big earthquake had just happened.
    words: [episode, gempa susulan]
  - id: e09
    type: fill_blank
    sentence: Pada dasarnya, ___ adalah cara bertanya, mencoba, dan mengulang.
    meaning:
      ar_eg: في الأساس، المنهج العلمي هو إنك تسأل وتجرّب وتعيد.
      ar: في الأساس، المنهج العلمي طريقة للسؤال والتجربة والتكرار.
      en: Basically, the scientific method is a way of asking, trying and repeating.
    options: [metode ilmiah, siniar, konservasi]
    answers: [metode ilmiah]
    words: [pada dasarnya, metode ilmiah]
    explain:
      ar_eg: نسأل ونجرّب ونعيد = metode ilmiah. siniar = بودكاست وkonservasi = حماية الطبيعة.
      ar: السؤال والتجربة والتكرار metode ilmiah؛ أمّا siniar فبودكاست، وkonservasi صون الطبيعة.
      en: Asking, trying and repeating is the metode ilmiah. siniar is a podcast, and konservasi conservation.
  - id: e10
    type: speaking
    text: Di episode kali ini, kita belajar tentang tukik dan konservasi penyu.
    meaning:
      ar_eg: في الحلقة دي، هنتعلم عن السلاحف الصغيرة والحفاظ على السلاحف.
      ar: نتعلّم في هذه الحلقة عن صغار السلاحف وصون السلاحف البحرية.
      en: In this episode, we learn about hatchlings and turtle conservation.
    words: [episode, tukik, konservasi]
dialogue:
  title: Rekaman pertama
  lines:
    - speaker: Bu Laila
      text: Mohamed, mikrofonnya sudah siap. Kamu mau membahas apa di episode pertama?
      ar_eg: يا محمد، الميكروفون جاهز. عايز تتكلم عن إيه في أول حلقة؟
      ar: يا محمد، الميكروفون جاهز. عمّ تريد أن تتحدّث في الحلقة الأولى؟
      en: Mohamed, the mic's ready. What do you want to cover in the first episode?
    - speaker: Mohamed
      text: Kenapa Indonesia sering gempa. Saya pakai perumpamaan kerupuk yang retak.
      ar_eg: ليه إندونيسيا فيها زلازل كتير. هستخدم تشبيه البسكوت المكسور.
      ar: لماذا تكثر الزلازل في إندونيسيا، وسأستعمل تشبيه البسكويت المتشقّق.
      en: Why Indonesia has so many earthquakes. I'll use the cracked-cracker comparison.
    - speaker: Aisyah
      text: Aku boleh jadi pendengar pertama?
      ar_eg: ممكن أبقى أول مستمعة؟
      ar: أيمكنني أن أكون أوّل مستمعة؟
      en: Can I be the first listener?
    - speaker: Mohamed
      text: Boleh dong! Kalau kamu paham, berarti siniar kita udah cukup sederhana.
      ar_eg: أكيد! لو إنتي فهمتي، يبقى البودكاست بتاعنا بسيط كفاية.
      ar: طبعًا! إن فهمتِ فبودكاستنا بسيط بما يكفي.
      en: Of course! If you understand it, our podcast is simple enough.
