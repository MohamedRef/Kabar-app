schema: kabar.lesson/v1
id: bipa2.u09.l07
language: id
title: Tulisan Rina tentang Lovina
can_do:
  ar_eg: تقرا بوست قصير عن أجازة وتفهم حصل إيه وبالترتيب، وترد عليه.
  ar: أن تقرأ منشورًا قصيرًا عن عطلة وتفهم أحداثه بالترتيب وتتحدث عنه.
  en: Read a short holiday post and talk about it.
slides:
  - title: Tulisan Rina tentang Lovina
    body:
      ar_eg: |
        رينا كتبت بوست قصير عن أجازتها في لوفينا، بالإندونيسي العادي مش بلغة الشات. اقراه ودوّر على: wah و aduh، وكلمات الترتيب pertama و lalu.
        كلمتين جداد: pasir (رملة) و hitam (أسود). شط لوفينا رملته سودا عشان هي رملة بركانية.
        في الشارع بيقولوا:
        - udah = sudah (خلاص، بقى)
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
      ar: |
        كتبت رينا منشورًا قصيرًا عن عطلتها في لوفينا، بالإندونيسية العادية لا بلغة المحادثة. اقرأه وابحث عن: wah و aduh، وكلمتي الترتيب pertama و lalu.
        كلمتان جديدتان: pasir (رمل) و hitam (أسود). رمل شاطئ لوفينا أسود لأنه رمل بركاني.
        في كلام الشارع:
        - udah = sudah (قد، بالفعل)
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
      en: |
        Rina wrote a short post about her holiday in Lovina, in normal Indonesian, not chat spelling. Read it and spot wah and aduh, and the order words pertama and lalu.
        Two new words: pasir (sand) and hitam (black). Lovina's beach has black volcanic sand.
        On the street:
        - udah = sudah (already)
        - banget = sekali (very), after the adjective just like sekali
    examples:
      - text: Wah, liburan di Lovina menyenangkan sekali! Pasir pantainya hitam, dan lautnya tenang.
        ar_eg: ياه، الأجازة في لوفينا كانت حلوة أوي! رملة الشط سودا، والبحر هادي.
        ar: يا للروعة، كانت العطلة في لوفينا ممتعة جدًا! رمل الشاطئ أسود، والبحر هادئ.
        en: Wow, the holiday in Lovina was so much fun! The beach sand is black and the sea is calm.
      - text: Pertama, kami naik perahu jam enam pagi. Lalu, kami melihat banyak lumba-lumba.
        ar_eg: الأول، ركبنا مركب الساعة ستة الصبح. بعدين، شفنا دلافين كتير.
        ar: أولًا، ركبنا قاربًا في السادسة صباحًا. ثم رأينا دلافين كثيرة.
        en: First, we took a boat at six in the morning. Then we saw lots of dolphins.
      - text: Aduh, kamera saya ketinggalan di hotel! Jadi, saya memotret pakai HP. Capek, tapi seru!
        ar_eg: يا خبر، الكاميرا بتاعتي اتنسيت في الفندق! فصوّرت بالموبايل. تعبت، بس كانت تجنن!
        ar: آه، نسيت الكاميرا في الفندق! فصوّرت بالهاتف. كنت متعبة، لكنها كانت مثيرة!
        en: Oh no, I left my camera at the hotel! So I took photos with my phone. Tiring, but exciting!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pasir
        ar_eg: رملة
        ar: رمل
        en: sand
      - text: hitam
        ar_eg: أسود
        ar: أسود
        en: black
      - text: perahu
        ar_eg: مركب
        ar: قارب
        en: boat
      - text: tenang
        ar_eg: هادي
        ar: هادئ
        en: calm
      - text: ketinggalan
        ar_eg: اتنسى (ورا)
        ar: نُسي (في مكانه)
        en: left behind
    words: [pasir, hitam, perahu, tenang, ketinggalan]
  - id: e02
    type: multiple_choice
    question: Soal pantai Lovina, bagaimana pasir dan lautnya?
    question_meaning:
      ar_eg: حسب البوست، شط لوفينا شكله إيه؟
      ar: بحسب المنشور، كيف يبدو شاطئ لوفينا؟
      en: According to the post, what is Lovina's beach like?
    options:
      - Pasirnya putih dan lautnya ramai.
      - Pasirnya hitam dan lautnya tenang.
      - Pasirnya hitam dan lautnya ramai.
    answer: 1
    words: [soal, pasir, hitam, tenang]
    explain:
      ar_eg: "البوست بيقول «Pasir pantainya hitam, dan lautnya tenang»: الرملة سودا (بركانية) والبحر هادي."
      ar: "يقول المنشور «Pasir pantainya hitam, dan lautnya tenang»: رمل أسود بركاني وبحر هادئ."
      en: "The post says \"Pasir pantainya hitam, dan lautnya tenang\": black volcanic sand, calm sea."
  - id: e03
    type: multiple_choice
    question: Soal perahu, jam berapa mereka naik perahu?
    question_meaning:
      ar_eg: بالنسبة للمركب، ركبوه الساعة كام؟
      ar: بشأن القارب، في أي ساعة ركبوه؟
      en: About the boat, what time did they get on it?
    options: [jam enam pagi, jam empat pagi, jam enam sore]
    answer: 0
    words: [soal, perahu]
    explain:
      ar_eg: البوست بيقول «kami naik perahu jam enam pagi».
      ar: يقول المنشور «kami naik perahu jam enam pagi».
      en: The post says "kami naik perahu jam enam pagi".
  - id: e04
    type: listen
    text: Aduh, kamera saya ketinggalan di hotel! Berarti saya memotret pakai HP.
    question:
      ar_eg: رينا صوّرت بإيه؟
      ar: بماذا صوّرت رينا؟
      en: What did Rina take photos with?
    options: [pakai kamera, pakai HP Raka, pakai HP-nya]
    answer: 2
    meaning:
      ar_eg: يا خبر، الكاميرا بتاعتي اتنسيت في الفندق! يعني هصوّر بالموبايل.
      ar: آه، نسيت الكاميرا في الفندق! إذن سأصوّر بالهاتف.
      en: Oh no, I left my camera at the hotel! That means I'll take photos with my phone.
    words: [aduh, ketinggalan, berarti]
  - id: e05
    type: listen
    text: Pasir pantainya hitam, dan lautnya tenang.
    options:
      - Pasir pantainya putih, dan lautnya tenang.
      - Pasir pantainya hitam, dan lautnya tenang.
      - Pasir pantainya hitam, dan lautnya ramai.
    answer: 1
    meaning:
      ar_eg: رملة الشط سودا، والبحر هادي.
      ar: رمل الشاطئ أسود، والبحر هادئ.
      en: The beach sand is black and the sea is calm.
    words: [pasir, hitam]
  - id: e06
    type: fill_blank
    sentence: Pasirnya ___, bukan putih. Berarti fotonya bagus!
    meaning:
      ar_eg: الرملة سودا، مش بيضا. يعني الصور هتطلع حلوة!
      ar: الرمل أسود، لا أبيض. إذن ستكون الصور جميلة!
      en: The sand is black, not white. That means great photos!
    answers: [hitam]
    words: [hitam, pasir, berarti]
    explain:
      ar_eg: hitam = أسود، عكس putih (أبيض).
      ar: hitam = أسود، عكس putih.
      en: hitam = black, the opposite of putih.
  - id: e07
    type: build_sentence
    source:
      ar_eg: الأول، ركبنا مركب الساعة ستة الصبح.
      ar: أولًا، ركبنا قاربًا في السادسة صباحًا.
      en: First, we took a boat at six in the morning.
    answer: Pertama, kami naik perahu jam enam pagi.
    distractors: [akhirnya, sambil]
    words: [pertama, perahu]
    explain:
      ar_eg: Pertama = الأول، وjam enam pagi = الساعة ستة الصبح. akhirnya للآخر، وsambil = وأنا بـ….
      ar: Pertama = أولًا. أما akhirnya فللنهاية وsambil «في أثناء».
      en: Pertama = first. akhirnya is for the end, sambil "while".
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: رملة الشط سودا.
      ar: رمل الشاطئ أسود.
      en: The beach sand is black.
    answers:
      - Pasir pantainya hitam.
      - Pasir pantainya hitam
      - Pasir pantai itu hitam.
      - Pasir pantai itu hitam
      - Pasir pantai hitam.
      - Pasir di pantai hitam.
      - Pasir di pantai itu hitam.
      - Pasir di pantainya hitam.
      - Pasirnya hitam.
      - Pantainya berpasir hitam.
    words: [pasir, hitam]
  - id: e09
    type: speaking
    text: Wah, tulisan Rina soal Lovina bagus sekali!
    meaning:
      ar_eg: الله، كلام رينا عن لوفينا حلو أوي!
      ar: رائع، ما كتبته رينا عن لوفينا جميل جدًا!
      en: Wow, Rina's piece about Lovina is really good!
    words: [wah, soal]
  - id: e10
    type: fill_blank
    sentence: Kameranya ketinggalan? ___ Rina memotret pakai HP.
    meaning:
      ar_eg: الكاميرا اتنسيت؟ يعني رينا صوّرت بالموبايل.
      ar: نُسيت الكاميرا؟ إذن صوّرت رينا بالهاتف.
      en: The camera got left behind? That means Rina took photos with her phone.
    options: [Berarti, Soal, Pertama]
    answers: [Berarti]
    explain:
      ar_eg: berarti = يعني / معنى كده (نتيجة). soal = بخصوص، وpertama = أولًا.
      ar: berarti = إذن / هذا يعني. أما soal فـ«بشأن» وpertama «أولًا».
      en: berarti = that means, so. soal is "about", pertama "first".
    words: [berarti, ketinggalan]
dialogue:
  title: Di kos Bu Yanti, setelah liburan
  lines:
    - speaker: Bu Yanti
      text: Rina, Ibu udah membaca tulisanmu soal Lovina. Seru banget!
      ar_eg: يا رينا، أنا قريت البوست بتاعك عن لوفينا. يجنن!
      ar: يا رينا، قرأتُ ما كتبتِه عن لوفينا. مثير جدًا!
      en: Rina, I read your post about Lovina. So exciting!
    - speaker: Rina
      text: Terima kasih, Bu! Pasirnya hitam, lho. Bagus untuk foto.
      ar_eg: شكرًا يا طنط! على فكرة الرملة سودا. حلوة للتصوير.
      ar: شكرًا يا سيدتي! الرمل أسود، صدّقيني. جميل للتصوير.
      en: Thank you! The sand is black, you know. Great for photos.
    - speaker: Mohamed
      text: Lho, kameramu ketinggalan, kan?
      ar_eg: إيه ده، مش الكاميرا بتاعتك اتنسيت؟
      ar: مهلًا، ألم تنسي الكاميرا؟
      en: Hang on, didn't you leave your camera behind?
    - speaker: Rina
      text: Iya, aduh! Tapi foto pakai HP juga bagus.
      ar_eg: أيوه، يا خسارة! بس صور الموبايل حلوة برضه.
      ar: نعم، للأسف! لكن صور الهاتف جميلة أيضًا.
      en: Yes, ugh! But the phone photos are nice too.
    - speaker: Bu Yanti
      text: Pak Mohamed, Bapak melihat lumba-lumba?
      ar_eg: يا أستاذ محمد، شفت دلافين؟
      ar: يا أستاذ محمد، هل رأيت دلافين؟
      en: Mohamed, did you see dolphins?
    - speaker: Mohamed
      text: Banyak banget, Bu! Pertama kami naik perahu, lalu lumba-lumbanya datang.
      ar_eg: كتير أوي يا طنط! الأول ركبنا مركب، وبعدين الدلافين جت.
      ar: كثيرة جدًا يا سيدتي! أولًا ركبنا القارب، ثم جاءت الدلافين.
      en: Loads! First we took a boat, then the dolphins came.
new_words:
  - word: pasir
    pos: noun
    ar_eg: رملة
    ar: رمل
    en: sand
  - word: hitam
    pos: adjective
    ar_eg: أسود
    ar: أسود
    en: black
  - word: soal
    pos: preposition
    ar_eg: بخصوص، عن (في الكلام؛ زي tentang)؛ وكمان سؤال امتحان
    ar: بشأن، عن (في الكلام؛ مثل tentang)؛ وأيضًا سؤال امتحان
    en: about, regarding (spoken, like tentang); also an exam question
  - word: berarti
    pos: verb
    ar_eg: يعني، معنى كده (من arti)
    ar: يعني، إذن (من arti)
    en: means; so, that means (from arti)
