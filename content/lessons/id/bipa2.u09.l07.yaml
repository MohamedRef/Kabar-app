dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, Sabtu ini ada pesta teman saya di Ubud.
      ar_eg: يا محمد، السبت ده فيه حفلة لصاحبتي في أوبود.
      ar: يا محمد، يوم السبت حفل لصديقتي في أوبود.
      en: Mohamed, my friend's having a party in Ubud this Saturday.
    - speaker: Mohamed
      text: Saya pakai apa? Jas dan dasi?
      ar_eg: ألبس إيه؟ بدلة وكرافتة؟
      ar: ماذا ألبس؟ سترة وربطة عنق؟
      en: What should I wear? Jacket and tie?
    - speaker: Rina
      text: Kemeja batik saja. Di Bali tidak perlu jas.
      ar_eg: قميص باتيك وخلاص. في بالي مش محتاج جاكت.
      ar: قميص باتيك يكفي. لا حاجة للسترة في بالي.
      en: Just a batik shirt. You don't need a jacket in Bali.
    - speaker: Mohamed
      text: Kamu pakai gaun?
      ar_eg: وإنتي هتلبسي فستان؟
      ar: وأنتِ، ستلبسين فستانًا؟
      en: Are you wearing a dress?
    - speaker: Rina
      text: Ya, gaun sutra dari ibu saya.
      ar_eg: أيوه، فستان حرير من ماما.
      ar: نعم، فستان حرير من أمي.
      en: Yes, a silk dress from my mum.
    - speaker: Mohamed
      text: Bagus! Saya mau beli perak di Celuk untuk mereka.
      ar_eg: حلو! أنا عايز أشتري لهم فضة من تشيلوك.
      ar: جميل! أريد شراء فضّة لهم من تشيلوك.
      en: Lovely! I want to buy them some silver in Celuk.
