schema: kabar.lesson/v1
id: bipa2.u09.l07
language: id
title: Kemeja, dasi, perak
can_do:
  ar_eg: تختار لبس لفرح أو حفلة، وتتكلم عن الحرير والفضة والإزاز.
  ar: أن تختار ملابس لحفل أو عرس، وتتحدث عن الحرير والفضة والزجاج.
  en: Choose clothes for a party or wedding and talk about silk, silver and glass.
slides:
  - title: Ke pesta
    body:
      ar_eg: |
        gaun = فستان سهرة، jas = جاكت بدلة، kemeja = قميص بزراير، dasi = كرافتة، sandal = صندل.
        sutra = حرير، perak = فضة (Celuk في بالي = قرية الفضة).
        kaca = إزاز، وفاكر kacamata؟ = نضارة («إزاز العين»).
      ar: |
        gaun = فستان سهرة، jas = سترة البدلة، kemeja = قميص بأزرار، dasi = ربطة عنق، sandal = صندل.
        sutra = حرير، perak = فضّة (قرية Celuk في بالي مشهورة بالفضّة).
        kaca = زجاج، وتذكّر kacamata = نظارة («زجاج العين»).
      en: |
        gaun = gown, dress, jas = suit jacket, kemeja = shirt (with buttons), dasi = tie, sandal = sandals.
        sutra = silk, perak = silver (Celuk in Bali is the silver village).
        kaca = glass; remember kacamata = glasses ("eye glass").
    examples:
      - text: Ke pesta, saya pakai kemeja putih dan dasi.
        ar_eg: في الحفلة هلبس قميص أبيض وكرافتة.
        ar: ألبس في الحفل قميصًا أبيض وربطة عنق.
        en: For the party I'll wear a white shirt and tie.
      - text: Gaun Rina dari sutra.
        ar_eg: فستان رينا حرير.
        ar: فستان رينا من الحرير.
        en: Rina's dress is silk.
      - text: Di Celuk ada banyak toko perak.
        ar_eg: في تشيلوك فيه محلات فضة كتير.
        ar: في تشيلوك متاجر فضة كثيرة.
        en: Celuk has lots of silver shops.
