schema: kabar.lesson/v1
id: bipa2.u10.l02
language: id
title: Di apotek
can_do:
  ar_eg: تقرا تعليمات الجرعة على علبة الدوا وتفهمها.
  ar: أن تقرأ تعليمات الجرعة على الدواء.
  en: Read dosage instructions.
slides:
  - title: Di apotek
    body:
      ar_eg: |
        apotek = صيدلية، وobat = دوا.
        - obat + المرض = دوا لـ…: obat batuk = دوا كحة، obat sakit kepala = دوا صداع.
        - tablet = أقراص، sirup = شراب.
        - resep (dokter) = روشتة.
        وتسأل: «Ada obat batuk?» = عندكم دوا كحة؟
      ar: |
        apotek = صيدلية، وobat = دواء.
        - obat + المرض = دواء لـ…: obat batuk = دواء السعال، obat sakit kepala = دواء الصداع.
        - tablet = أقراص، sirup = شراب.
        - resep (dokter) = وصفة الطبيب.
        وتسأل: «Ada obat batuk?» = هل عندكم دواء للسعال؟
      en: |
        apotek = pharmacy, obat = medicine.
        - obat + illness = medicine for it: obat batuk (cough medicine), obat sakit kepala (headache medicine).
        - tablet = tablet, sirup = syrup.
        - resep (dokter) = (doctor's) prescription.
        Ask: "Ada obat batuk?" = Do you have cough medicine?
    examples:
      - text: Saya mau beli obat sakit kepala.
        ar_eg: عايز أشتري دوا صداع.
        ar: أريد شراء دواء للصداع.
        en: I'd like to buy some headache medicine.
      - text: Ada obat batuk?
        ar_eg: عندكم دوا كحة؟
        ar: هل يوجد دواء للسعال؟
        en: Do you have cough medicine?
  - title: Tiga kali sehari
    body:
      ar_eg: |
        على العلبة هتلاقي كام مرة في اليوم:
        - sehari = في اليوم (se- = واحد + hari).
        - tiga kali sehari = ٣ مرات في اليوم. ومكتوبة كتير كده: 3 x sehari.
        - satu tablet = قرص واحد، satu sendok teh = معلقة صغيرة.
      ar: |
        على العبوة تجد عدد المرات في اليوم:
        - sehari = في اليوم (se- = واحد + hari).
        - tiga kali sehari = ثلاث مرات يوميًا، وتُكتب غالبًا: 3 x sehari.
        - satu tablet = قرص واحد، satu sendok teh = ملعقة صغيرة.
      en: |
        The label tells you how often:
        - sehari = a day, per day (se- "one" + hari).
        - tiga kali sehari = three times a day, often printed 3 x sehari.
        - satu tablet = one tablet, satu sendok teh = one teaspoon.
    examples:
      - text: 3 x sehari 1 tablet
        ar_eg: ٣ مرات في اليوم، قرص واحد.
        ar: ثلاث مرات يوميًا، قرص واحد.
        en: Three times a day, one tablet.
      - text: Minum obat ini dua kali sehari.
        ar_eg: خد الدوا ده مرتين في اليوم.
        ar: تناول هذا الدواء مرتين يوميًا.
        en: Take this medicine twice a day.
  - title: Sebelum atau sesudah makan?
    body:
      ar_eg: |
        إنت عارف sebelum (قبل) وsesudah / setelah (بعد). على الدوا:
        - sebelum makan = قبل الأكل، sesudah makan = بعد الأكل.
        - على العلبة بيكتبوا «diminum» بدل «minum» (يعني «يُشرب»، صيغة هتتعلمها بعدين). احفظها كده: Diminum 3 x sehari = يتاخد ٣ مرات في اليوم.
        - aturan pakai = طريقة الاستعمال.
      ar: |
        تعرف sebelum (قبل) وsesudah / setelah (بعد). وعلى الدواء:
        - sebelum makan = قبل الطعام، sesudah makan = بعد الطعام.
        - وتُكتب على العبوة «diminum» بدل «minum» أي «يُشرب» (صيغة المبني للمجهول ستأتي لاحقًا): Diminum 3 x sehari.
        - aturan pakai = طريقة الاستعمال.
      en: |
        You know sebelum (before) and sesudah / setelah (after). On medicine:
        - sebelum makan = before meals, sesudah makan = after meals.
        - Labels say "diminum" instead of "minum" ("is to be taken" — a form you'll learn later). Learn it as a phrase: Diminum 3 x sehari.
        - aturan pakai = directions for use.
    examples:
      - text: Diminum tiga kali sehari sesudah makan.
        ar_eg: يتاخد ٣ مرات في اليوم بعد الأكل.
        ar: يؤخذ ثلاث مرات يوميًا بعد الطعام.
        en: To be taken three times a day after meals.
  - title: Kocok dahulu
    body:
      ar_eg: |
        كلمات تانية على العلب:
        - Kocok dahulu sebelum diminum = رجّ الزجاجة قبل الاستعمال. (dahulu = dulu بس أرسمي)
        - Simpan di tempat sejuk = يُحفظ في مكان بارد.
        - Obat luar = للاستعمال الخارجي، ماتشربوش!
      ar: |
        عبارات أخرى على العبوات:
        - Kocok dahulu sebelum diminum = رُجّ قبل الاستعمال (dahulu = dulu لكنها أرسمي).
        - Simpan di tempat sejuk = يُحفظ في مكان بارد.
        - Obat luar = للاستعمال الخارجي، لا يُشرب.
      en: |
        More label words:
        - Kocok dahulu sebelum diminum = shake well before use (dahulu = formal dulu).
        - Simpan di tempat sejuk = store in a cool place.
        - Obat luar = for external use — don't drink it!
    examples:
      - text: Kocok dahulu sebelum diminum.
        ar_eg: رجّ الزجاجة قبل ما تشربه.
        ar: رُجّ العبوة قبل الشرب.
        en: Shake well before use.
