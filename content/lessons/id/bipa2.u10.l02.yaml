schema: kabar.lesson/v1
id: bipa2.u10.l02
language: id
title: Pusing, demam, batuk
can_do:
  ar_eg: توصف حاسس بإيه والأعراض المعروفة.
  ar: أن تصف شعورك والأعراض الشائعة.
  en: Describe how you feel and common symptoms.
slides:
  - title: Merasa pusing, mual, lemas
    body:
      ar_eg: |
        merasa = حاسس: Saya merasa pusing = حاسس بدوخة، mual = نفسي غامّة، lemas = جسمي هبطان.
        أمراض شائعة: demam = سخونية، batuk = كحة، pilek = رشح، masuk angin = برد (حرفيًا «دخل فيه هوا»، فكرة شعبية إندونيسية).
        ومن غير merasa كمان صح: Saya demam = أنا سخن.
        في الشارع بيقولوا:
        - nggak = tidak (مش، لأ)
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
      ar: |
        merasa = يشعر: Saya merasa pusing = أشعر بدوار، mual = غثيان، lemas = وهن.
        أمراض شائعة: demam = حمّى، batuk = سعال، pilek = زكام، masuk angin = نزلة برد (حرفيًا «دخلته الريح»، مفهوم شعبي).
        ويصح بلا merasa: Saya demam = عندي حمّى.
        في كلام الشارع:
        - nggak = tidak (لا، ليس)
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
      en: |
        merasa = feel: Saya merasa pusing (dizzy), mual (nauseous), lemas (weak).
        Common ailments: demam (fever), batuk (cough), pilek (runny nose), masuk angin (a chill — literally "wind got in", a folk notion).
        Without merasa is fine too: Saya demam = I have a fever.
        On the street:
        - nggak = tidak (not, no)
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
    grammar: id.pattern.sakit
    examples:
      - text: Kepala saya pusing dan badan saya lemas.
        ar_eg: راسي دايخة وجسمي هبطان.
        ar: أشعر بالدوار والوهن.
        en: I feel dizzy and weak.
      - text: Kamu sakit apa? — Cuma masuk angin.
        ar_eg: عندك إيه؟ — شوية برد بس.
        ar: ما بك؟ — مجرد نزلة برد.
        en: What's wrong? — Just a chill.
  - title: Sehat = صحة
    body:
      ar_eg: |
        sehat (سليم / بصحة كويسة) جاية من العربي «صحة». عكسها sakit.
        عند الدكتور هيسألك:
        - Sakit apa? = عندك إيه؟
        - Sudah berapa lama? = بقالك قد إيه؟ — Sejak kemarin = من امبارح.
      ar: |
        sehat (سليم معافى) من العربية «صحة»، وضدها sakit.
        وسيسألك الطبيب:
        - Sakit apa؟ = ما بك؟
        - Sudah berapa lama؟ = منذ متى؟ — Sejak kemarin = منذ أمس.
      en: |
        sehat (healthy) comes from Arabic «صحة»; its opposite is sakit.
        The doctor will ask:
        - Sakit apa? = What's wrong?
        - Sudah berapa lama? = How long has it been? — Sejak kemarin = Since yesterday.
    grammar: id.pattern.sakit
    examples:
      - text: Sekarang saya sudah sehat.
        ar_eg: دلوقتي أنا بقيت كويس.
        ar: الآن صرت معافى.
        en: Now I'm healthy again.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: demam
        ar_eg: سخونية
        ar: حُمّى
        en: fever
      - text: batuk
        ar_eg: كحة
        ar: سعال
        en: cough
      - text: pilek
        ar_eg: رشح
        ar: زكام
        en: runny nose
      - text: mual
        ar_eg: نفسي غامّة
        ar: غثيان
        en: nauseous
      - text: lemas
        ar_eg: هبطان، مفيش طاقة
        ar: واهن
        en: weak, drained
      - text: masuk angin
        ar_eg: دور برد خفيف (حرفيًا «الهوا دخل»)
        ar: نزلة برد خفيفة
        en: a chill (lit. wind got in)
    words: [demam, batuk, pilek, mual, lemas, masuk angin]
  - id: e02
    type: fill_blank
    sentence: Saya merasa ___.
    meaning:
      ar_eg: حاسس بدوخة.
      ar: أشعر بالدوار.
      en: I feel dizzy.
    options: [mual, lemas, pusing]
    answers: [pusing]
    words: [merasa, pusing]
    explain:
      ar_eg: pusing = دايخ أو راسي بتلف. mual = نفسي غامّة، وlemas = مهدود.
      ar: pusing = دوار. أما mual فغثيان وlemas وهن.
      en: pusing = dizzy. mual is nauseous, lemas weak.
  - id: e03
    type: multiple_choice
    question: Sakit apa, Pak?
    question_meaning:
      ar_eg: الدكتور بيسألك. أنهي رد مناسب؟
      ar: يسألك الطبيب. أيّ جواب يناسب؟
      en: The doctor asks you. Which answer fits?
    options: [Sejak kemarin., Saya demam dan batuk., Saya dari Mesir.]
    answer: 1
    words: [demam, batuk]
    explain:
      ar_eg: "Sakit apa? = عندك إيه؟ فالرد بالأعراض: demam dan batuk. Sejak kemarin رد على «بقالك قد إيه؟»."
      ar: Sakit apa? يُجاب بالأعراض. أما Sejak kemarin فجواب «منذ متى؟».
      en: Sakit apa? is answered with symptoms. Sejak kemarin answers "how long?".
  - id: e04
    type: multiple_choice
    question: Sudah berapa lama?
    question_meaning:
      ar_eg: الدكتور بيسأل بقالك قد إيه. ترد بإيه؟
      ar: يسأل الطبيب منذ متى. بماذا تجيب؟
      en: The doctor asks how long. Your answer?
    options: ['Kepala saya, Dok.', 'Sejak kemarin, Dok.', 'Saya sehat, Dok.']
    answer: 1
    words: [sejak]
    explain:
      ar_eg: "Sudah berapa lama? = بقالك قد إيه؟ فالرد بالمدة: Sejak kemarin = من امبارح."
      ar: "Sudah berapa lama? يُجاب بالمدة: Sejak kemarin."
      en: "Sudah berapa lama? needs a time: Sejak kemarin."
  - id: e05
    type: listen
    text: Saya merasa mual dan lemas.
    options: [Saya merasa mual dan lemas., Saya merasa pusing dan lemas., Saya masuk angin dan pilek.]
    answer: 0
    meaning:
      ar_eg: حاسس إن نفسي غامّة وجسمي هبطان.
      ar: أشعر بالغثيان والوهن.
      en: I feel nauseous and weak.
    words: [merasa, mual, lemas, pusing, masuk angin, pilek]
  - id: e06
    type: translate
    direction: from_target
    source_text: Kepala saya pusing dan badan saya lemas.
    answers_meaning:
      ar_eg: [راسي دايخة وجسمي هبطان., أنا دايخ وجسمي تعبان, حاسس بدوخة وهبوط]
      ar: [أشعر بالدوار والوهن., رأسي يدور وجسمي واهن]
      en: [I feel dizzy and weak., My head is spinning and my body feels weak.]
    words: [pusing, badan, lemas]
  - id: e07
    type: speaking
    text: Dok, saya demam dan sakit kepala sejak kemarin.
    meaning:
      ar_eg: يا دكتور، عندي سخونية وصداع من امبارح.
      ar: يا دكتور، عندي حمّى وصداع منذ أمس.
      en: Doctor, I've had a fever and a headache since yesterday.
    words: [demam, sakit kepala, sejak]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «رشح» (مناخيرك بتنقّط)؟
      ar: أيّ كلمة تعني «زكام» (سيلان الأنف)؟
      en: Which word means "runny nose"?
    options: [batuk, pilek, masuk angin]
    answer: 1
    explain:
      ar_eg: batuk = كحة، وmasuk angin = دور برد خفيف بتسمعه كتير في إندونيسيا.
      ar: batuk = سعال، وmasuk angin = نزلة برد خفيفة تُذكر كثيرًا في إندونيسيا.
      en: batuk = cough; masuk angin = a mild chill, a very common Indonesian complaint.
    words: [pilek, batuk, masuk angin]
  - id: e09
    type: fill_blank
    sentence: Saya ___ mual sejak pagi.
    meaning:
      ar_eg: حاسس إن نفسي غامّة من الصبح.
      ar: أشعر بالغثيان منذ الصباح.
      en: I've been feeling nauseous since the morning.
    options: [merasa, batuk, sakit]
    answers: [merasa]
    words: [merasa, mual]
    explain:
      ar_eg: "merasa + الإحساس = حاسس بـ: merasa mual. batuk = كحة، وsakit mual مش تركيب صح."
      ar: "merasa + الشعور: merasa mual. أما batuk فسعال، و«sakit mual» تركيب خاطئ."
      en: "merasa + feeling: merasa mual. batuk is a cough; \"sakit mual\" isn't a phrase."
dialogue:
  title: Setelah berenang di Amed
  lines:
    - speaker: Ni Luh
      text: Mohamed, kamu kenapa? Sakit?
      ar_eg: يا محمد، مالك؟ إنت عيان؟
      ar: يا محمد، ما بك؟ هل أنت مريض؟
      en: Mohamed, what's wrong? Are you ill?
    - speaker: Mohamed
      text: Iya. Kepalaku sakit dan aku merasa pusing.
      ar_eg: أيوه. راسي بتوجعني وحاسس بدوخة.
      ar: نعم. رأسي يؤلمني وأشعر بالدوار.
      en: Yes. My head hurts and I feel dizzy.
    - speaker: Ni Luh
      text: Aduh! Sejak kapan?
      ar_eg: يا خبر! من إمتى؟
      ar: يا للأسف! منذ متى؟
      en: Oh no! Since when?
    - speaker: Mohamed
      text: Sejak tadi pagi. Mungkin aku terlalu lama berenang di laut.
      ar_eg: من الصبح. يمكن عشان عمت في البحر وقت طويل أوي.
      ar: منذ الصباح. ربما سبحت في البحر وقتًا طويلًا جدًا.
      en: Since this morning. Maybe I swam in the sea too long.
    - speaker: Ni Luh
      text: Kamu demam?
      ar_eg: عندك سخونية؟
      ar: هل عندك حمّى؟
      en: Do you have a fever?
    - speaker: Mohamed
      text: Nggak, cuma lemas. Mungkin masuk angin.
      ar_eg: لأ، جسمي هبطان بس. يمكن واخد برد.
      ar: لا، أشعر بالوهن فقط. ربما هي نزلة برد.
      en: No, just weak. Maybe it's a chill.
