schema: kabar.lesson/v1
id: bipa4.u09.l01
language: id
title: Larangan kantong plastik
can_do:
  ar_eg: تتابع عرض تقديمي عن منع الأكياس البلاستيك وتستعمل meN-…-kan للموضوع.
  ar: أن تتابع عرضًا تقديميًا عن حظر الأكياس البلاستيكية وتستعمل meN-…-kan للموضوع.
  en: Follow a presentation on plastic-bag bans, using meN-…-kan for the topic.
slides:
  - title: Membicarakan, menjelaskan
    body:
      ar_eg: |
        في العروض التقديمية الموضوع بيبقى مفعول به لفعل meN-…-kan، ومن غير tentang:
        berbicara tentang larangan → membicarakan larangan (يتكلم عن / يناقش المنع).
        menjelaskan kebijakan = يشرح السياسة، menyampaikan informasi = يقدّم معلومات.
      ar: |
        في العروض التقديمية يصير الموضوع مفعولًا لفعل meN-…-kan، بلا tentang:
        berbicara tentang larangan → membicarakan larangan (يناقش الحظر).
        menjelaskan kebijakan = يشرح السياسة، menyampaikan informasi = يقدّم المعلومات.
      en: |
        In presentations the topic becomes the object of a meN-…-kan verb, with no tentang:
        berbicara tentang larangan → membicarakan larangan (discuss the ban).
        menjelaskan kebijakan = explain the policy; menyampaikan informasi = present information.
    grammar: id.confix.men-kan
    examples:
      - text: Hari ini saya akan membicarakan larangan kantong plastik.
        ar_eg: النهارده هتكلم عن منع الأكياس البلاستيك.
        ar: سأتحدث اليوم عن حظر الأكياس البلاستيكية.
        en: Today I'll discuss the plastic-bag ban.
      - text: Pembicara menjelaskan kebijakan baru pemerintah kota.
        ar_eg: المتكلم شرح السياسة الجديدة بتاعة حكومة المدينة.
        ar: شرح المتحدث السياسة الجديدة لحكومة المدينة.
        en: The speaker explained the city government's new policy.
  - title: Menerapkan larangan
    body:
      ar_eg: |
        menerapkan (من terap) = يطبّق: menerapkan kebijakan / larangan.
        plastik sekali pakai = بلاستيك بيتستعمل مرة واحدة.
        mendaur ulang = يعيد التدوير، والمبني للمجهول didaur ulang.
      ar: |
        menerapkan (من terap) = يطبّق: menerapkan kebijakan / larangan.
        plastik sekali pakai = بلاستيك أحادي الاستخدام.
        mendaur ulang = يعيد التدوير، والمبني للمجهول didaur ulang.
      en: |
        menerapkan (from terap) = apply, implement: menerapkan kebijakan / larangan.
        plastik sekali pakai = single-use plastic.
        mendaur ulang = recycle; passive didaur ulang.
    grammar: id.confix.men-kan
    examples:
      - text: Banyak kota sudah menerapkan larangan kantong plastik.
        ar_eg: مدن كتير طبّقت خلاص منع الأكياس البلاستيك.
        ar: طبّقت مدن كثيرة حظر الأكياس البلاستيكية.
        en: Many cities have already brought in a plastic-bag ban.
      - text: Plastik sekali pakai sulit didaur ulang.
        ar_eg: البلاستيك اللي بيتستعمل مرة واحدة صعب يتعاد تدويره.
        ar: يصعب إعادة تدوير البلاستيك أحادي الاستخدام.
        en: Single-use plastic is hard to recycle.
  - title: Presentasi atau ngobrol?
    body:
      ar_eg: |
        في العرض والمقال: mengapa، oleh karena itu، tidak boleh
        في الكلام: kok / kenapa، makanya، nggak boleh، gara-gara (بسبب حاجة وحشة)، awas = خلي بالك
      ar: |
        في العرض والمقال: mengapa، oleh karena itu، tidak boleh
        وفي الكلام: kok / kenapa، makanya، nggak boleh، gara-gara (بسبب أمر سيئ)، awas = احذر
      en: |
        In a presentation or essay: mengapa, oleh karena itu, tidak boleh
        In conversation: kok / kenapa, makanya, nggak boleh, gara-gara (because of something bad), awas = watch out
    examples:
      - text: Makanya kita harus peduli.
        ar_eg: 'عشان كده لازم نهتم. (بالرسمي: Oleh karena itu, kita harus peduli.)'
        ar: 'لذلك يجب أن نهتمّ. (بالفصحى: Oleh karena itu, kita harus peduli.)'
        en: 'That''s why we have to care. (Standard: Oleh karena itu, kita harus peduli.)'
      - text: Aku nggak boleh pegang karang, ya?
        ar_eg: 'ممنوع ألمس المرجان، صح؟ (بالرسمي: Saya tidak boleh memegang karang, ya?)'
        ar: 'لا يجوز لي لمس المرجان، أليس كذلك؟ (بالفصحى: Saya tidak boleh memegang karang, ya?)'
        en: 'I can''t touch the coral, right? (Standard: Saya tidak boleh memegang karang, ya?)'
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: larangan
        ar_eg: منع
        ar: حظر
        en: ban
      - text: kantong plastik
        ar_eg: كيس بلاستيك
        ar: كيس بلاستيكي
        en: plastic bag
      - text: sekali pakai
        ar_eg: استعمال مرة واحدة
        ar: أحادي الاستخدام
        en: single-use
      - text: kebijakan
        ar_eg: سياسة (قرار حكومي)
        ar: سياسة
        en: policy
      - text: menerapkan
        ar_eg: يطبّق
        ar: يطبّق
        en: to implement, apply
      - text: mendaur ulang
        ar_eg: يعيد تدوير
        ar: يعيد التدوير
        en: to recycle
    words: [larangan, kantong plastik, sekali pakai, kebijakan, menerapkan, mendaur ulang]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options: ["Kita akan membicarakan tentang larangan itu.", "Kita akan membicarakan larangan itu.", "Kita akan berbicara larangan itu."]
    answer: 1
    explain:
      ar_eg: membicarakan بياخد الموضوع على طول من غير tentang. berbicara محتاج tentang.
      ar: membicarakan يأخذ الموضوع مباشرة بلا tentang، أما berbicara فيحتاج tentang.
      en: membicarakan takes the topic directly, with no tentang; berbicara needs tentang.
    words: [larangan]
  - id: e03
    type: listen
    text: Banyak kota sudah menerapkan larangan kantong plastik.
    options: ["Banyak kota sudah menerapkan larangan kantong plastik.", "Banyak kota belum menerapkan larangan kantong plastik.", "Banyak desa sudah menerapkan larangan kantong plastik."]
    answer: 0
    meaning:
      ar_eg: مدن كتير طبّقت خلاص منع الأكياس البلاستيك.
      ar: طبّقت مدن كثيرة حظر الأكياس البلاستيكية.
      en: Many cities have already brought in a plastic-bag ban.
    words: [menerapkan, larangan, kantong plastik]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي تعبير معناه «بلاستيك بيتستعمل مرة واحدة»؟
      ar: أيّ تعبير يعني «بلاستيك أحادي الاستخدام»؟
      en: Which phrase means "single-use plastic"?
    options: [plastik pakai sekali, plastik sekali jalan, plastik sekali pakai]
    answer: 2
    words: [sekali pakai]
  - id: e05
    type: fill_blank
    sentence: Pemerintah kota menjelaskan ___ baru tentang sampah.
    meaning:
      ar_eg: حكومة المدينة شرحت سياسة جديدة عن الزبالة.
      ar: شرحت حكومة المدينة سياسة جديدة بشأن النفايات.
      en: The city government explained a new policy on rubbish.
    options: [sekali pakai, kebijakan, mendaur ulang]
    answers: [kebijakan]
    words: [kebijakan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: البلاستيك اللي بيتستعمل مرة واحدة صعب يتعاد تدويره.
      ar: يصعب إعادة تدوير البلاستيك أحادي الاستخدام.
      en: Single-use plastic is hard to recycle.
    answer: Plastik sekali pakai sulit didaur ulang.
    distractors: [mendaur, kebijakan]
    words: [sekali pakai, mendaur ulang]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: النهارده هتكلم عن منع الأكياس البلاستيك.
      ar: سأتحدث اليوم عن حظر الأكياس البلاستيكية.
      en: Today I'll discuss the plastic-bag ban.
    answers:
      - Hari ini saya akan membicarakan larangan kantong plastik.
      - Hari ini saya akan membicarakan larangan kantong plastik
      - Hari ini saya mau membicarakan larangan kantong plastik.
      - Saya akan membicarakan larangan kantong plastik hari ini.
      - Hari ini saya akan berbicara tentang larangan kantong plastik.
      - Hari ini saya akan membicarakan larangan penggunaan kantong plastik.
    words: [larangan, kantong plastik]
  - id: e08
    type: speaking
    text: Kota ini menerapkan kebijakan baru, dan warga mulai mendaur ulang sampah.
    meaning:
      ar_eg: المدينة دي طبّقت سياسة جديدة، والناس بدأوا يعيدوا تدوير الزبالة.
      ar: طبّقت هذه المدينة سياسة جديدة، وبدأ السكان يعيدون تدوير النفايات.
      en: This city has brought in a new policy, and residents have started recycling.
    words: [menerapkan, kebijakan, mendaur ulang]
dialogue:
  title: Presentasi di Manado
  lines:
    - speaker: Bu Grace
      text: Selamat pagi. Hari ini saya akan membicarakan larangan kantong plastik.
      ar_eg: صباح الخير. النهارده هتكلم عن منع الأكياس البلاستيك.
      ar: صباح الخير. سأتحدث اليوم عن حظر الأكياس البلاستيكية.
      en: Good morning. Today I'll discuss the plastic-bag ban.
    - speaker: Mohamed
      text: Bu, mengapa plastik sekali pakai dilarang?
      ar_eg: يا مدام، ليه البلاستيك اللي بيتستعمل مرة واحدة ممنوع؟
      ar: يا سيدتي، لماذا يُحظر البلاستيك أحادي الاستخدام؟
      en: Ma'am, why is single-use plastic banned?
    - speaker: Bu Grace
      text: Karena plastik itu sulit didaur ulang, dan banyak yang masuk ke laut Bunaken.
      ar_eg: عشان صعب يتعاد تدويره، وكتير منه بيوصل لبحر بوناكين.
      ar: لأنه يصعب إعادة تدويره، وكثير منه يصل إلى بحر بوناكن.
      en: Because it's hard to recycle, and a lot of it ends up in the sea at Bunaken.
    - speaker: Mohamed
      text: Jadi kota ini akan menerapkan kebijakan baru?
      ar_eg: يعني المدينة هتطبّق سياسة جديدة؟
      ar: إذن ستطبّق المدينة سياسة جديدة؟
      en: So the city will bring in a new policy?
