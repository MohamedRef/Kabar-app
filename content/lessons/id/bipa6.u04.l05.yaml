schema: kabar.lesson/v1
id: bipa6.u04.l05
language: id
title: Laksamana Cheng Ho
can_do:
  ar_eg: تحكي عن رحلات الأدميرال الصيني المسلم تشنج هو لإندونيسيا.
  ar: أن تروي رحلات الأميرال الصيني المسلم تشنغ هو إلى إندونيسيا.
  en: Tell the story of the Chinese Muslim admiral Cheng Ho's voyages to Indonesia.
slides:
  - title: Armada dari Tiongkok
    body:
      ar_eg: |
        Cheng Ho (Zheng He) كان أدميرال مسلم في أسرة مينج الصينية. ما بين ١٤٠٥ و١٤٣٣ قاد سبع رحلات كبيرة لحد أفريقيا.
        - laksamana = أدميرال، قائد الأسطول
        - armada = أسطول، مراكب كتير مع بعض
        - ekspedisi = بعثة / رحلة استكشاف كبيرة
        - singgah = يعدّي ويقعد شوية في مكان قبل ما يكمل
        - bajak laut = قرصان. سنة ١٤٠٧ هزم قراصنة في باليمبانج.
        ولسه في سيمارانج معبد Sam Poo Kong على اسمه.
        - kok كلمة صغيرة بتدّي الجملة إحساس (استغراب)، ومن غيرها الجملة صح برضه.
      ar: |
        كان Cheng Ho (Zheng He) أميرالًا مسلمًا في أسرة مينغ الصينية، وقاد بين ١٤٠٥ و١٤٣٣ سبع رحلات كبرى بلغت أفريقيا.
        - laksamana = أميرال، قائد الأسطول
        - armada = أسطول، سفن كثيرة معًا
        - ekspedisi = بعثة، رحلة استكشافية كبرى
        - singgah = يتوقّف في مكان مدّة قصيرة ثم يواصل
        - bajak laut = قرصان؛ وقد هزم قراصنة في باليمبانغ سنة ١٤٠٧.
        وما زال في سيمارانغ معبد Sam Poo Kong المسمّى باسمه.
        - kok أداة صغيرة تلوّن الجملة (استغراب)، والجملة صحيحة بدونها.
      en: |
        Cheng Ho (Zheng He) was a Muslim admiral of China's Ming dynasty. Between 1405 and 1433 he led seven great voyages, as far as Africa.
        - laksamana = admiral
        - armada = fleet
        - ekspedisi = expedition
        - singgah = to stop over somewhere before moving on
        - bajak laut = pirate. In 1407 he defeated pirates at Palembang.
        Semarang still has the Sam Poo Kong temple named after him.
        - kok is a small particle that adds feeling (surprise); the sentence is correct without it.
    examples:
      - text: Armada Laksamana Cheng Ho singgah di Palembang dan Semarang.
        ar_eg: أسطول الأدميرال تشنج هو عدّى على باليمبانج وسيمارانج.
        ar: توقّف أسطول الأميرال تشنغ هو في باليمبانغ وسيمارانغ.
        en: Admiral Cheng Ho's fleet stopped at Palembang and Semarang.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: laksamana
        ar_eg: أدميرال
        ar: أميرال
        en: admiral
      - text: armada
        ar_eg: أسطول
        ar: أسطول
        en: fleet
      - text: ekspedisi
        ar_eg: بعثة
        ar: بعثة
        en: expedition
      - text: singgah
        ar_eg: يعدّي ويقعد شوية
        ar: يتوقّف مؤقّتًا
        en: to stop over
      - text: bajak laut
        ar_eg: قرصان
        ar: قرصان
        en: pirate
    words: [laksamana, armada, ekspedisi, singgah, bajak laut]
  - id: e02
    type: listen
    text: Cheng Ho memimpin tujuh ekspedisi besar antara tahun 1405 dan 1433.
    question:
      ar_eg: تشنج هو قاد كام رحلة؟
      ar: كم رحلة قاد تشنغ هو؟
      en: How many voyages did Cheng Ho lead?
    options:
      - رحلتين.
      - سبعة.
      - عشرين.
    answer: 1
    words: [ekspedisi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «singgah» يعني إيه؟
      ar: ما معنى «singgah»؟
      en: What does "singgah" mean?
    options:
      - يغرق في البحر.
      - يرجع بلده على طول.
      - يقف شوية في مكان وبعدين يكمل.
    answer: 2
    words: [singgah]
  - id: e04
    type: fill_blank
    sentence: Pada tahun 1407, Cheng Ho mengalahkan ___ di Palembang.
    meaning:
      ar_eg: سنة ١٤٠٧، تشنج هو هزم القراصنة في باليمبانج.
      ar: هزم تشنغ هو القراصنة في باليمبانغ سنة ١٤٠٧.
      en: In 1407, Cheng Ho defeated the pirates at Palembang.
    options: [bajak laut, laksamana, armada]
    answers: [bajak laut]
    words: [bajak laut]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: تشنج هو كان دينه إيه؟
      ar: ما كان دين تشنغ هو؟
      en: What was Cheng Ho's religion?
    options: [Islam, Hindu, Buddha]
    answer: 0
    explain:
      ar_eg: كان مسلم، وعشان كده فيه مساجد على اسمه في سورابايا وباليمبانج.
      ar: كان مسلمًا، ولذلك تحمل مساجد في سورابايا وباليمبانغ اسمه.
      en: He was Muslim, which is why mosques in Surabaya and Palembang bear his name.
    words: [laksamana]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الأسطول كان فيه مراكب كبيرة كتير.
      ar: ضمّ الأسطول سفنًا كبيرة كثيرة.
      en: The fleet had many large ships.
    answer: Armada itu terdiri atas banyak kapal besar.
    distractors: [singgah, laksamana]
    words: [armada]
  - id: e07
    type: translate
    direction: from_target
    source_text: Dalam perjalanan ke Afrika, armada itu singgah di Sumatra.
    answers_meaning:
      ar_eg:
        - وهو رايح أفريقيا، الأسطول عدّى على سومطرة.
        - في السكة لأفريقيا، الأسطول وقف شوية في سومطرة.
      ar:
        - في طريقه إلى أفريقيا، توقّف الأسطول في سومطرة.
        - توقّف الأسطول في سومطرة أثناء رحلته إلى أفريقيا.
      en:
        - On the way to Africa, the fleet stopped over in Sumatra.
        - The fleet made a stop in Sumatra on its way to Africa.
    words: [armada, singgah]
  - id: e08
    type: speaking
    text: Laksamana Cheng Ho datang dengan damai, bukan untuk menjajah.
    meaning:
      ar_eg: الأدميرال تشنج هو جه بسلام، مش عشان يحتل.
      ar: جاء الأميرال تشنغ هو بسلام، لا ليستعمر.
      en: Admiral Cheng Ho came in peace, not to colonise.
    words: [laksamana]
  - id: e09
    type: dictation
    text: Ekspedisi pertama berangkat dari Tiongkok pada tahun 1405.
    meaning:
      ar_eg: أول بعثة طلعت من الصين سنة ١٤٠٥.
      ar: انطلقت البعثة الأولى من الصين سنة ١٤٠٥.
      en: The first expedition left China in 1405.
    words: [ekspedisi]
  - id: e10
    type: fill_blank
    sentence: Kapal-kapal dagang takut pada ___ di Selat Malaka.
    meaning:
      ar_eg: مراكب التجارة كانت خايفة من القراصنة في مضيق ملقا.
      ar: كانت السفن التجارية تخشى القراصنة في مضيق ملقا.
      en: Trading ships feared the pirates in the Strait of Malacca.
    options: [bajak laut, ekspedisi, singgah]
    answers: [bajak laut]
    words: [bajak laut, selat]
dialogue:
  title: Masjid bergaya Tiongkok
  lines:
    - speaker: Kak Dewi
      text: Mohamed, masjid di Palembang ini namanya Masjid Cheng Ho.
      ar_eg: يا محمد، الجامع ده في باليمبانج اسمه جامع تشنج هو.
      ar: يا محمد، هذا المسجد في باليمبانغ اسمه مسجد تشنغ هو.
      en: Mohamed, this mosque in Palembang is called the Cheng Ho Mosque.
    - speaker: Mohamed
      text: Cheng Ho itu laksamana Tiongkok, kan? Kok ada masjidnya?
      ar_eg: تشنج هو ده أدميرال صيني، صح؟ ليه فيه جامع باسمه؟
      ar: تشنغ هو أميرال صيني، أليس كذلك؟ فلماذا يحمل مسجد اسمه؟
      en: Cheng Ho was a Chinese admiral, right? Why is there a mosque for him?
    - speaker: Kak Dewi
      text: Dia seorang Muslim. Armadanya beberapa kali singgah di sini.
      ar_eg: كان مسلم. وأسطوله عدّى على هنا كذا مرة.
      ar: كان مسلمًا، وتوقّف أسطوله هنا مرّات عدّة.
      en: He was a Muslim. His fleet stopped here several times.
    - speaker: Mohamed
      text: Jadi ekspedisinya membawa perdagangan dan persahabatan, bukan perang.
      ar_eg: يعني بعثاته جابت تجارة وصداقة، مش حرب.
      ar: إذن حملت بعثاته التجارة والصداقة لا الحرب.
      en: So his expeditions brought trade and friendship, not war.
