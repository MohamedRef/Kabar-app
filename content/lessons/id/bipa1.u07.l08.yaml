  - id: e03
    type: listen
    text: Kakek suka memancing di sungai.
    question:
      ar_eg: جدو بيحب يعمل إيه؟
      ar: ماذا يحبّ الجدّ أن يفعل؟
      en: What does Grandpa like doing?
    options: [يصطاد سمك, يخيّط, يرسم]
    answer: 0
    meaning:
      ar_eg: جدو بيحب يصطاد سمك في النهر.
      ar: يحبّ جدّي صيد السمك في النهر.
      en: Grandpa likes fishing in the river.
    words: [memancing]
  - id: e04
    type: fill_blank
    sentence: Nenek suka ___. Tanamannya banyak.
    meaning:
      ar_eg: تيتا بتحب ___. عندها زرع كتير.
      ar: تحبّ جدّتي ___، ونباتاتها كثيرة.
      en: Grandma likes ___. She has lots of plants.
    options: [berkebun, menjahit, memancing]
    answers: [berkebun]
    words: [berkebun, tanaman, menjahit, memancing]
    explain:
      ar_eg: عندها نباتات كتير، فهوايتها berkebun = زراعة الجنينة. menjahit = خياطة، وmemancing = صيد.
      ar: لديها نباتات كثيرة فهي تحب berkebun أي البستنة.
      en: "Lots of plants: berkebun (gardening)."
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بتحب تعمل هدومك بإيدك بالإبرة والخيط. هوايتك…؟
      ar: تحبّ أن تصنع ملابسك بالإبرة والخيط. هوايتك…؟
      en: You like making your own clothes with needle and thread. Your hobby is…?
    options: [menjahit, memancing, berkebun]
    answer: 0
    explain:
      ar_eg: menjahit = يخيّط. memancing صيد، وberkebun زراعة.
      ar: menjahit الخياطة، أما memancing فالصيد وberkebun الزراعة.
      en: menjahit = sewing; memancing is fishing and berkebun gardening.
    words: [menjahit, memancing, berkebun]
  - id: e06
    type: fill_blank
    sentence: Ini ___ ikan emas. Adik saya menggambar.
    meaning:
      ar_eg: دي ___ سمكة دهبي. أخويا الصغير رسمها.
      ar: هذه ___ سمكة ذهبية، رسمها أخي الصغير.
      en: This is a ___ of a goldfish. My little brother drew it.
    options: [gambar, tanaman, emas]
    answers: [gambar]
    words: [gambar, emas, tanaman]
    explain:
      ar_eg: أخويا رسمها، فهي gambar = رسمة. tanaman = نبات، وemas = دهب.
      ar: رسمها أخي فهي gambar أي رسمة.
      en: He drew it, so it's a gambar (picture).
  - id: e07
    type: build_sentence
    source:
      ar_eg: مامتي بتخيّط هدوم.
      ar: أمّي تخيط ملابس.
      en: My mother sews clothes.
    answer: Ibu saya menjahit pakaian.
    distractors: [emas, gambar]
    words: [menjahit]
    explain:
      ar_eg: Ibu saya + menjahit (بتخيّط) + pakaian. emas وgambar زيادة.
      ar: Ibu saya menjahit pakaian. emas وgambar زائدتان.
      en: Ibu saya + menjahit + pakaian. emas and gambar are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Saya punya ikan emas di rumah.
    answers_meaning:
      ar_eg: [عندي سمكة دهبي في البيت, عندي سمك زينة دهبي في البيت]
      ar: [لديّ سمكة ذهبية في البيت, عندي سمكة ذهبية في المنزل]
      en: [I have a goldfish at home, 'I''ve got a goldfish at home']
    words: [emas]
  - id: e09
    type: speaking
    text: Hobi saya berkebun dan memancing.
    meaning:
      ar_eg: هوايتي الزراعة وصيد السمك.
      ar: هوايتي الزراعة وصيد السمك.
      en: My hobbies are gardening and fishing.
    words: [berkebun, memancing]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: معدن غالي لونه أصفر. اسمه إيه؟
      ar: معدن ثمين لونه أصفر. ما اسمه؟
      en: A precious yellow metal. What is it?
    options: [emas, tanaman, gambar]
    answer: 0
    explain:
      ar_eg: emas = دهب.
      ar: emas = ذهب.
      en: emas = gold.
    words: [emas, tanaman, gambar]
dialogue:
  lines:
    - speaker: Mohamed
      text: Ni Luh, kamu punya hobi?
      ar_eg: يا ني لوه، عندك هواية؟
      ar: يا ني لوه، هل لديك هواية؟
      en: Ni Luh, do you have a hobby?
    - speaker: Ni Luh
      text: Ya. Aku suka menjahit dan menggambar.
      ar_eg: أيوه. بحب الخياطة والرسم.
      ar: نعم، أحبّ الخياطة والرسم.
      en: Yes. I like sewing and drawing.
    - speaker: Mohamed
      text: Hebat! Temanku Raka suka memancing.
      ar_eg: جامد! وصاحبي رَكا بيحب صيد السمك.
      ar: رائع! وصديقي راكا يحبّ صيد السمك.
      en: Great! My friend Raka likes fishing.
    - speaker: Ni Luh
      text: Ayahku suka berkebun. Di rumah kami ada banyak tanaman.
      ar_eg: بابا بيحب الزراعة. عندنا زرع كتير في البيت.
      ar: أبي يحبّ الزراعة، وفي بيتنا نباتات كثيرة.
      en: My dad likes gardening. We have lots of plants at home.
    - speaker: Mohamed
      text: Ada ikan emas juga?
      ar_eg: وعندكم سمك دهبي كمان؟
      ar: وهل عندكم سمك ذهبي أيضًا؟
      en: Do you have goldfish too?
    - speaker: Ni Luh
      text: Ada! Lima ikan emas.
      ar_eg: أيوه! خمس سمكات دهبي.
      ar: نعم! خمس سمكات ذهبية.
      en: Yes! Five goldfish.
