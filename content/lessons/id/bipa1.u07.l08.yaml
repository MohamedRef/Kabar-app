schema: kabar.lesson/v1
id: bipa1.u07.l08
language: id
title: Hobi di rumah
can_do:
  ar_eg: 'تتكلم عن هوايات هادية: صيد السمك والزراعة والخياطة والرسم.'
  ar: 'أن تتحدث عن هوايات هادئة: صيد السمك والزراعة والخياطة والرسم.'
  en: 'Talk about quiet hobbies: fishing, gardening, sewing and pictures.'
slides:
  - title: Memancing dan berkebun
    body:
      ar_eg: |
        memancing = يصطاد سمك بالسنارة، وberkebun = يزرع في الجنينة (kebun = جنينة، هتيجي بعدين).
        tanaman = نبات أو زرعة. menjahit = يخيّط.
        gambar = صورة أو رسمة، ومنها menggambar (يرسم).
        emas = دهب. وikan emas = سمكة زينة دهبي.
      ar: |
        memancing = يصطاد السمك بالصنّارة، وberkebun = يزرع في البستان (kebun = بستان، ستأتي لاحقًا).
        tanaman = نبات. menjahit = يخيط.
        gambar = صورة أو رسم، ومنها menggambar (يرسم).
        emas = ذهب، وikan emas = السمكة الذهبية.
      en: |
        memancing = go fishing; berkebun = do gardening (kebun = garden, coming later).
        tanaman = plant. menjahit = sew.
        gambar = picture, drawing, the root of menggambar (draw).
        emas = gold, and ikan emas = goldfish.
    examples:
      - text: Kakek suka memancing di sungai.
        ar_eg: جدو بيحب يصطاد سمك في النهر.
        ar: يحبّ جدّي صيد السمك في النهر.
        en: Grandpa likes fishing in the river.
      - text: Nenek suka berkebun. Tanamannya banyak.
        ar_eg: تيتا بتحب الزراعة. عندها زرع كتير.
        ar: تحبّ جدّتي الزراعة، ونباتاتها كثيرة.
        en: Grandma likes gardening. She has lots of plants.
      - text: Ini gambar ikan emas.
        ar_eg: دي رسمة سمكة دهبي.
        ar: هذه صورة سمكة ذهبية.
        en: This is a picture of a goldfish.
