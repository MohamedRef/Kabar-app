schema: kabar.lesson/v1
id: bipa7.u05.l04
language: id
title: KAA 1955
can_do:
  ar_eg: تحكي عن مؤتمر باندونج سنة ١٩٥٥ وليه كان مهم لمصر وإندونيسيا.
  ar: أن تروي خبر مؤتمر باندونغ سنة ١٩٥٥ وسبب أهمّيته لمصر وإندونيسيا.
  en: Tell the story of the 1955 Bandung Conference and why it mattered to Egypt and Indonesia.
slides:
  - title: Bandung, April 1955
    body:
      ar_eg: |
        الـ KAA = Konferensi Asia Afrika: konferensi (مؤتمر) في باندونج من ١٨ لـ ٢٤ أبريل ١٩٥٥.
        - ٢٩ دولة من آسيا وأفريقيا حضروا، أغلبهم negara berkembang (دول نامية) لسه خارجين من الاستعمار.
        - من مصر جه جمال عبد الناصر، ومن الهند نهرو، والمضيف كان سوكارنو.
        - الفكرة: solidaritas (تضامن) ضد الـ kolonialisme (الاستعمار).
        - في الآخر طلّعوا Dasasila Bandung: عشر مبادئ للسلام والتعاون.
        المؤتمر اتعمل في مبنى اسمه Gedung Merdeka، ولسه موجود ومتحف لحد النهارده.
        - في الكلام: soal = tentang.
      ar: |
        الـ KAA = Konferensi Asia Afrika، وهو konferensi (مؤتمر) عُقد في باندونغ من ١٨ إلى ٢٤ أبريل ١٩٥٥.
        - حضرته ٢٩ دولة من آسيا وأفريقيا، أكثرها negara berkembang (دول نامية) خرجت لتوّها من الاستعمار.
        - جاء من مصر جمال عبد الناصر، ومن الهند نهرو، وكان سوكارنو المضيف.
        - والفكرة solidaritas (التضامن) في وجه الـ kolonialisme (الاستعمار).
        - وخرج المؤتمر بـ Dasasila Bandung: عشرة مبادئ للسلم والتعاون.
        وعُقد في مبنى Gedung Merdeka، وهو اليوم متحف.
        - في الكلام اليومي: soal = tentang.
      en: |
        KAA = Konferensi Asia Afrika, a konferensi (conference) in Bandung from 18 to 24 April 1955.
        - 29 countries from Asia and Africa attended, most of them negara berkembang (developing countries) just out of colonial rule.
        - Gamal Abdel Nasser came from Egypt, Nehru from India, and Sukarno was host.
        - The idea: solidaritas (solidarity) against kolonialisme (colonialism).
        - It ended with the Dasasila Bandung: ten principles for peace and cooperation.
        It was held in the Gedung Merdeka, which is a museum today.
        - In speech: soal = tentang.
    examples:
      - text: Presiden Nasser dari Mesir hadir di Konferensi Asia Afrika.
        ar_eg: الرئيس عبد الناصر من مصر حضر مؤتمر آسيا وأفريقيا.
        ar: حضر الرئيس عبد الناصر من مصر مؤتمر آسيا وأفريقيا.
        en: President Nasser of Egypt attended the Asia-Africa Conference.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: konferensi
        ar_eg: مؤتمر
        ar: مؤتمر
        en: conference
      - text: solidaritas
        ar_eg: تضامن
        ar: تضامن
        en: solidarity
      - text: kolonialisme
        ar_eg: استعمار
        ar: استعمار
        en: colonialism
      - text: Dasasila
        ar_eg: المبادئ العشرة
        ar: المبادئ العشرة
        en: the Ten Principles
      - text: negara berkembang
        ar_eg: دولة نامية
        ar: دولة نامية
        en: developing country
    words: [konferensi, solidaritas, kolonialisme, Dasasila, negara berkembang]
  - id: e02
    type: listen
    text: Konferensi Asia Afrika diadakan di Bandung pada bulan April 1955. Wakil dari dua puluh sembilan negara datang, kebanyakan dari negara yang baru merdeka. Gedung Merdeka sekarang menjadi museum konferensi itu.
    question:
      ar_eg: المؤتمر اتعمل فين وإمتى؟
      ar: أين ومتى عُقد المؤتمر؟
      en: Where and when was the conference held?
    options:
      - Di Jakarta pada tahun 1945, hanya untuk negara Asia.
      - Di Bandung pada April 1955, dengan wakil dari dua puluh sembilan negara.
      - Di Kairo pada tahun 1956.
    answer: 1
    words: [konferensi]
    explain:
      ar_eg: المؤتمر في باندونج في أبريل ١٩٥٥، وحضرته ٢٩ دولة أغلبها لسه مستقلة. جاكرتا ١٩٤٥ سنة الاستقلال، والقاهرة مش مكانه.
      ar: عُقد المؤتمر في باندونغ في أبريل ١٩٥٥ بحضور ٢٩ دولة معظمها حديث الاستقلال، أمّا ١٩٤٥ فسنة الاستقلال والقاهرة ليست مكانه.
      en: Bandung, April 1955, 29 countries. 1945 is independence; Cairo isn't the venue.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «Dasasila Bandung» يبقى إيه؟
      ar: ما «Dasasila Bandung»؟
      en: What is the "Dasasila Bandung"?
    options:
      - Nama hotel di Bandung.
      - Lagu kebangsaan.
      - Sepuluh prinsip yang lahir dari konferensi itu.
    answer: 2
    words: [Dasasila]
    explain:
      ar_eg: Dasasila = عشر مبادئ (dasa = عشرة، sila = مبدأ) طلعت من المؤتمر. مش فندق ولا أغنية.
      ar: Dasasila = المبادئ العشرة (dasa = عشرة، sila = مبدأ) الصادرة عن المؤتمر، لا فندق ولا نشيد.
      en: Dasasila = the ten principles (dasa = ten, sila = principle).
  - id: e04
    type: fill_blank
    sentence: Negara-negara itu menunjukkan ___ satu sama lain melawan penjajahan.
    meaning:
      ar_eg: الدول دي ورّت تضامن مع بعض ضد الاستعمار.
      ar: أبدت تلك الدول تضامنًا فيما بينها في وجه الاستعمار.
      en: Those countries showed solidarity with one another against colonial rule.
    options: [solidaritas, kolonialisme, konferensi]
    answers: [solidaritas]
    words: [solidaritas]
    explain:
      ar_eg: solidaritas = تضامن، والجملة فيها satu sama lain (مع بعض). kolonialisme هو اللي بيحاربوه، وkonferensi = مؤتمر.
      ar: solidaritas = تضامن مع بعضهم. kolonialisme هو ما يقاومونه وkonferensi مؤتمر.
      en: solidaritas fits "with one another". kolonialisme is what they opposed; konferensi is the meeting.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي حضر من مصر؟
      ar: من حضر من مصر؟
      en: Who came from Egypt?
    options:
      - Gamal Abdul Nasser.
      - Taha Husain.
      - Ummu Kultsum.
    answer: 0
    words: [konferensi]
    explain:
      ar_eg: من مصر جه جمال عبد الناصر، وكان من أهم وجوه المؤتمر. طه حسين وأم كلثوم مارحوش.
      ar: جاء من مصر جمال عبد الناصر وكان من أبرز وجوه المؤتمر، ولم يحضر طه حسين ولا أمّ كلثوم.
      en: Nasser came from Egypt; Taha Hussein and Umm Kulthum didn't attend.
  - id: e06
    type: build_sentence
    source:
      ar_eg: أغلب الدول دي كانت دول نامية.
      ar: كانت أكثر هذه الدول دولًا نامية.
      en: Most of these countries were developing countries.
    answer: Sebagian besar negara itu adalah negara berkembang.
    distractors: [solidaritas, Dasasila]
    words: [negara berkembang]
    explain:
      ar_eg: Sebagian besar (أغلب) + negara itu + adalah + negara berkembang (نامية). solidaritas وDasasila زيادة.
      ar: Sebagian besar negara itu adalah negara berkembang. solidaritas وDasasila زائدتان.
      en: Sebagian besar + negara itu + adalah + negara berkembang. solidaritas and Dasasila are extra.
  - id: e07
    type: translate
    direction: from_target
    source_text: Konferensi ini menolak kolonialisme dalam segala bentuknya, karena banyak negara peserta baru saja lepas dari penjajahan.
    answers_meaning:
      ar_eg:
        - المؤتمر ده رفض الاستعمار بكل أشكاله، عشان دول كتير مشاركة كانت لسه خارجة من الاحتلال.
        - المؤتمر رفض الاستعمار في كل صوره، لأن كتير من الدول اللي حضرت لسه متحرّرة.
      ar:
        - رفض هذا المؤتمر الاستعمار بكلّ أشكاله، لأنّ كثيرًا من الدول المشاركة تحرّرت للتوّ من الاحتلال.
        - نبذ المؤتمر الاستعمار في صوره كافّة، إذ كانت دول مشاركة كثيرة قد تخلّصت لتوّها من الاستعمار.
      en:
        - This conference rejected colonialism in all its forms, because many participating countries had only just freed themselves from colonial rule.
        - The conference rejected every form of colonialism since many of the countries there had just escaped colonial rule.
    words: [konferensi, kolonialisme]
    explain:
      ar_eg: 'karena بتجيب السبب: الدول دي baru saja lepas = لسه متحرّرة.'
      ar: 'karena تأتي بالسبب: تحرّرت هذه الدول للتوّ.'
      en: 'karena gives the reason: these countries had just been freed.'
  - id: e08
    type: speaking
    text: Dasasila Bandung lahir dari solidaritas bangsa Asia dan Afrika.
    meaning:
      ar_eg: مبادئ باندونج العشرة اتولدت من تضامن شعوب آسيا وأفريقيا.
      ar: وُلدت مبادئ باندونغ العشرة من تضامن شعوب آسيا وأفريقيا.
      en: The Bandung Ten Principles were born of Asian and African solidarity.
    words: [Dasasila, solidaritas]
  - id: e09
    type: dictation
    text: Dua puluh sembilan negara berkembang datang ke Bandung.
    meaning:
      ar_eg: تسعة وعشرين دولة نامية جم باندونج.
      ar: جاءت تسع وعشرون دولة نامية إلى باندونغ.
      en: Twenty-nine developing countries came to Bandung.
    words: [negara berkembang]
  - id: e10
    type: fill_blank
    sentence: Banyak negara di Afrika masih hidup di bawah ___ pada tahun 1955.
    meaning:
      ar_eg: دول كتير في أفريقيا كانت لسه عايشة تحت الاستعمار سنة ١٩٥٥.
      ar: كانت دول أفريقية كثيرة لا تزال تحت الاستعمار سنة ١٩٥٥.
      en: Many African countries still lived under colonialism in 1955.
    options: [kolonialisme, solidaritas, Dasasila]
    answers: [kolonialisme]
    words: [kolonialisme]
    explain:
      ar_eg: "hidup di bawah ___ = عايشين تحت... والمعنى استعمار: kolonialisme. solidaritas تضامن، وDasasila المبادئ العشرة بتاعة المؤتمر."
      ar: العيش تحت kolonialisme أي الاستعمار. solidaritas تضامن وDasasila المبادئ العشرة.
      en: "\"Living under\" takes kolonialisme. Dasasila is the conference's Ten Principles."
dialogue:
  title: Foto tua di Gedung Merdeka
  lines:
    - speaker: Pak Hasan
      text: Lihat foto ini, Mohamed. Ini Bung Karno, dan di sebelahnya Presiden Nasser.
      ar_eg: بص على الصورة دي يا محمد. ده بونج كارنو، وجنبه الرئيس عبد الناصر.
      ar: انظر إلى هذه الصورة يا محمد. هذا بونغ كارنو، وإلى جانبه الرئيس عبد الناصر.
      en: Look at this photo, Mohamed. That's Bung Karno, and next to him President Nasser.
    - speaker: Mohamed
      text: Wah, Mesir juga ada di konferensi ini! Mereka bicara soal apa?
      ar_eg: واو، مصر كانت في المؤتمر ده كمان! كانوا بيتكلّموا في إيه؟
      ar: رائع، كانت مصر في هذا المؤتمر أيضًا! عمّ تحدّثوا؟
      en: Wow, Egypt was at this conference too! What did they talk about?
    - speaker: Pak Hasan
      text: Soal solidaritas negara berkembang dan cara mengakhiri kolonialisme.
      ar_eg: عن تضامن الدول النامية وإزاي يخلّصوا من الاستعمار.
      ar: عن تضامن الدول النامية وسبل إنهاء الاستعمار.
      en: About solidarity among developing countries and how to end colonialism.
    - speaker: Mohamed
      text: Setahun kemudian, Mesir menasionalisasi Terusan Suez. Semangat Bandung sampai ke Kairo!
      ar_eg: بعدها بسنة، مصر أمّمت قناة السويس. روح باندونج وصلت القاهرة!
      ar: وبعد عام أمّمت مصر قناة السويس، فقد بلغت روح باندونغ القاهرة!
      en: A year later, Egypt nationalised the Suez Canal. The Bandung spirit reached Cairo!
