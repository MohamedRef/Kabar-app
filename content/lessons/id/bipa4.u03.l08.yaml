schema: kabar.lesson/v1
id: bipa4.u03.l08
language: id
title: Sang raja dan perintahnya
can_do:
  ar_eg: 'تحكي حدث تاريخي: الملك، أوامره، الهجوم، واللي ماتوا.'
  ar: 'أن تروي حدثًا تاريخيًا: الملك وأوامره والهجوم والضحايا.'
  en: 'Tell a historical event: the king, his orders, the attack and those who died.'
slides:
  - title: Kisah benteng
    body:
      ar_eg: |
        sang = أداة احترام قبل لقب أو اسم في الحكايات والتاريخ: sang raja = الملك، sang pahlawan = البطل.
        perintah = أمر (perintah raja)، menyerang = يهاجم (serangan = هجوم)، tewas = اتقتل أو مات في حرب أو حادثة.
        kematian = موت (mati + ke-…-an)، jiwa = روح، نفس، وكمان «شخص» في العدد: seribu jiwa = ألف نفس.
        segala = كل حاجة من كل نوع (segala hal)، berbagai = أنواع مختلفة (berbagai negara = دول مختلفة).
      ar: |
        sang = أداة تبجيل قبل اللقب أو الاسم في الحكايات والتاريخ: sang raja = الملك، sang pahlawan = البطل.
        perintah = الأمر (perintah raja)، menyerang = يهاجم (serangan = هجوم)، tewas = قُتل أو لقي حتفه في حرب أو حادث.
        kematian = الموت (mati مع ke-…-an)، jiwa = الروح والنفس، وتُعدّ بها الناس: seribu jiwa = ألف نسمة.
        segala = كل شيء من كل نوع (segala hal)، berbagai = شتّى الأنواع (berbagai negara = دول شتى).
      en: |
        sang = a respectful article before a title or name in stories and history: sang raja = the king, sang pahlawan = the hero.
        perintah = order, command (perintah raja), menyerang = to attack (serangan = attack), tewas = killed (in war or an accident).
        kematian = death (mati + ke-…-an), jiwa = soul, life, and a counter for people: seribu jiwa = a thousand people.
        segala = every kind of (segala hal = everything), berbagai = various (berbagai negara = various countries).
    examples:
      - text: Sang raja memberi perintah untuk menjaga benteng.
        ar_eg: الملك إدّى أمر بحماية القلعة.
        ar: أصدر الملك أمرًا بحراسة القلعة.
        en: The king gave an order to guard the fort.
      - text: Pasukan Belanda menyerang benteng itu pada malam hari.
        ar_eg: الجيش الهولندي هاجم القلعة دي بالليل.
        ar: هاجم الجيش الهولندي تلك القلعة ليلًا.
        en: Dutch troops attacked that fort at night.
      - text: Ratusan jiwa tewas dalam perang itu.
        ar_eg: مئات الناس ماتوا في الحرب دي.
        ar: لقي مئات الأشخاص حتفهم في تلك الحرب.
        en: Hundreds of people were killed in that war.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sang
        ar_eg: الـ (احترام)
        ar: أداة تبجيل
        en: the (respectful)
      - text: perintah
        ar_eg: أمر
        ar: أمر
        en: order
      - text: menyerang
        ar_eg: يهاجم
        ar: يهاجم
        en: to attack
      - text: tewas
        ar_eg: اتقتل
        ar: قُتل
        en: killed
    words: [sang, perintah, menyerang, tewas]
  - id: e02
    type: match_pairs
    pairs:
      - text: kematian
        ar_eg: موت
        ar: موت
        en: death
      - text: jiwa
        ar_eg: روح، نفس
        ar: روح، نسمة
        en: soul, life
      - text: segala
        ar_eg: كل حاجة
        ar: كل شيء
        en: every kind of
      - text: berbagai
        ar_eg: أنواع مختلفة
        ar: شتّى
        en: various
    words: [kematian, jiwa, segala, berbagai]
  - id: e03
    type: listen
    text: Sang raja tidak mau menyerah.
    question:
      ar_eg: مين مش عايز يستسلم؟
      ar: من لا يريد الاستسلام؟
      en: Who won't surrender?
    options: [الملك, الجندي, الصياد]
    answer: 0
    meaning:
      ar_eg: الملك مش عايز يستسلم.
      ar: لا يريد الملك أن يستسلم.
      en: The king refuses to surrender.
    words: [sang]
  - id: e04
    type: fill_blank
    sentence: Pasukan itu ___ kota pada pagi hari.
    meaning:
      ar_eg: الجيش ده ___ المدينة الصبح.
      ar: ___ ذلك الجيش المدينة صباحًا.
      en: The troops ___ the city in the morning.
    options: [menyerang, tewas, berbagai]
    answers: [menyerang]
    words: [menyerang, tewas, berbagai]
    explain:
      ar_eg: menyerang kota = يهاجم المدينة، وده فعل الجيش. tewas = مات، وberbagai = متنوع.
      ar: menyerang kota = يهاجم المدينة، وهو فعل الجيش. أما tewas فلقي حتفه، وberbagai متنوّع.
      en: menyerang kota is to attack the city, what troops do. tewas is to be killed and berbagai is various.
  - id: e05
    type: multiple_choice
    question: Dua orang ___ dalam kecelakaan kapal itu.
    options: [tewas, menyerang, perintah]
    answer: 0
    explain:
      ar_eg: tewas = مات في حادثة أو حرب. menyerang = يهاجم، وperintah = أمر.
      ar: tewas = لقي حتفه في حادث أو حرب. أما menyerang فيهاجم، وperintah الأمر.
      en: tewas means were killed, in an accident or war. menyerang is to attack, and perintah is an order.
    words: [tewas, menyerang, perintah]
  - id: e06
    type: fill_blank
    sentence: Para tentara menjalankan ___ sang raja.
    meaning:
      ar_eg: العساكر نفّذوا ___ الملك.
      ar: نفّذ الجنود ___ الملك.
      en: The soldiers carried out the king's ___.
    options: [perintah, kematian, jiwa]
    answers: [perintah]
    words: [perintah, kematian, jiwa, sang]
    explain:
      ar_eg: menjalankan perintah = ينفّذ الأمر. kematian = موت، وjiwa = روح، ومايتنفّذوش.
      ar: menjalankan perintah = ينفّذ الأمر. أما kematian فموت، وjiwa روح، ولا يُنفَّذان.
      en: menjalankan perintah is to carry out an order. kematian is death and jiwa is soul; you can't carry those out.
  - id: e07
    type: multiple_choice
    question: Di museum ini ada barang dari ___ daerah.
    options: [segala, berbagai, sang]
    answer: 1
    explain:
      ar_eg: berbagai daerah = مناطق مختلفة. segala = كل حاجة من كل نوع ومش بمعنى «مختلفة»، وsang للألقاب.
      ar: berbagai daerah = مناطق شتى. أما segala فكل شيء من كل نوع لا «شتى»، وsang للألقاب.
      en: berbagai daerah means various regions. segala is every kind of, not various, and sang is for titles.
    words: [berbagai, segala, sang]
  - id: e08
    type: build_sentence
    source:
      ar_eg: موت الملك خلّى الناس كلها حزينة.
      ar: أحزن موت الملك الشعب كله.
      en: The king's death made all the people sad.
    answer: Kematian sang raja membuat semua rakyat sedih.
    distractors: [tewas, jiwa]
    words: [kematian, sang, tewas, jiwa]
    explain:
      ar_eg: kematian = موت (اسم)، وهو الفاعل هنا. tewas فعل (مات)، وjiwa = روح، فمايمشوش مكانه.
      ar: kematian اسم بمعنى الموت، وهو الفاعل هنا. أما tewas ففعل (لقي حتفه)، وjiwa روح، فلا يحلّان محلّه.
      en: kematian is the noun death, the subject here. tewas is a verb (to be killed) and jiwa is soul, so neither fits.
  - id: e09
    type: translate
    direction: from_target
    source_text: Perang itu mengambil ribuan jiwa.
    answers_meaning:
      ar_eg: [الحرب دي خدت آلاف الأرواح, الحرب دي موّتت آلاف الناس]
      ar: [أودت تلك الحرب بآلاف الأرواح, حصدت تلك الحرب آلاف الأرواح]
      en: [That war took thousands of lives, That war cost thousands of lives]
    words: [jiwa]
  - id: e10
    type: speaking
    text: Pemandu itu tahu segala cerita tentang benteng ini.
    meaning:
      ar_eg: المرشد ده عارف كل الحكايات عن القلعة دي.
      ar: يعرف ذلك المرشد كل الحكايات عن هذه القلعة.
      en: That guide knows every story about this fort.
    words: [segala, berbagai, kematian]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, benteng ini pernah diserang?
      ar_eg: يا رزال، القلعة دي اتهاجمت قبل كده؟
      ar: يا رزال، هل هوجمت هذه القلعة من قبل؟
      en: Rizal, was this fort ever attacked?
    - speaker: Mas Rizal
      text: Pernah. Pasukan Belanda menyerang dari laut.
      ar_eg: أيوه. الجيش الهولندي هاجم من البحر.
      ar: نعم. هاجمها الجيش الهولندي من البحر.
      en: Yes. Dutch troops attacked from the sea.
    - speaker: Mohamed
      text: Sang raja di mana waktu itu?
      ar_eg: والملك كان فين ساعتها؟
      ar: وأين كان الملك حينها؟
      en: Where was the king at the time?
    - speaker: Mas Rizal
      text: Di dalam benteng. Dia memberi perintah kepada semua pasukannya untuk bertahan.
      ar_eg: جوّه القلعة. إدّى أمر لكل عساكره إنهم يصمدوا.
      ar: داخل القلعة. أمر جنوده جميعًا بالصمود.
      en: Inside the fort. He ordered all his troops to hold out.
    - speaker: Mohamed
      text: Banyak yang tewas?
      ar_eg: ناس كتير ماتت؟
      ar: هل قُتل كثيرون؟
      en: Were many killed?
    - speaker: Mas Rizal
      text: Iya, ratusan jiwa. Kematian mereka kita ingat sampai sekarang.
      ar_eg: أيوه، مئات الأرواح. ولسه فاكرين موتهم لحد دلوقتي.
      ar: نعم، مئات الأرواح. وما زلنا نذكر موتهم حتى اليوم.
      en: Yes, hundreds of lives. We still remember their deaths today.
