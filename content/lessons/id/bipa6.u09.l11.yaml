schema: kabar.lesson/v1
id: bipa6.u09.l11
language: id
title: Presentasi ke investor
can_do:
  ar_eg: تعرض فكرة مشروع قدام مستثمر في دقيقتين وترد على أسئلته.
  ar: أن تعرض فكرة مشروع على مستثمر في دقيقتين وتجيب عن أسئلته.
  en: Pitch a business idea to an investor in two minutes and answer their questions.
slides:
  - title: Dua menit untuk meyakinkan
    body:
      ar_eg: |
        الـ investor (المستثمر) مشغول، فالـ proposal (المقترح) لازم يبقى قصير وواضح:
        1. المشكلة: Banyak orang Indonesia ingin kurma berkualitas, tetapi harganya mahal.
        2. الحل: Kami mengimpor langsung dari Mesir.
        3. الأرقام: pelanggan setia، cabang، اللي محتاجه من فلوس.
        4. الطلب: Kami mencari investor untuk membuka tiga cabang baru.
        وفي الأسئلة استخدم الأدب: Pertanyaan yang bagus, Pak. = سؤال حلو يا أستاذ.
      ar: |
        الـ investor (المستثمر) مشغول، فيجب أن يكون الـ proposal (المقترح) قصيرًا واضحًا:
        ١. المشكلة: Banyak orang Indonesia ingin kurma berkualitas, tetapi harganya mahal.
        ٢. الحلّ: Kami mengimpor langsung dari Mesir.
        ٣. الأرقام: pelanggan setia وcabang وما تحتاجه من مال.
        ٤. الطلب: Kami mencari investor untuk membuka tiga cabang baru.
        وفي الأسئلة تأدّب: Pertanyaan yang bagus, Pak. = سؤال وجيه يا سيّدي.
      en: |
        An investor is busy, so the proposal must be short and clear:
        1. The problem: Banyak orang Indonesia ingin kurma berkualitas, tetapi harganya mahal.
        2. The solution: Kami mengimpor langsung dari Mesir.
        3. The numbers: pelanggan setia, cabang, how much money you need.
        4. The ask: Kami mencari investor untuk membuka tiga cabang baru.
        In the Q&A, stay polite: Pertanyaan yang bagus, Pak. = Good question, sir.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: «investor» بيعمل إيه؟
      ar: ماذا يفعل «investor»؟
      en: What does an "investor" do?
    options:
      - بيشتري تمر كل يوم.
      - بيحط فلوس في مشروع عشان يكسب.
      - بيكتب محضر الاجتماع.
    answer: 1
    words: [investor]
  - id: e02
    type: listen
    text: Proposal kami hanya lima halaman, tetapi datanya lengkap.
    question:
      ar_eg: المقترح عامل إزاي؟
      ar: كيف هو المقترح؟
      en: What's the proposal like?
    options:
      - طويل وناقص.
      - مافيهوش أرقام.
      - قصير بس كامل.
    answer: 2
    words: [proposal]
  - id: e03
    type: fill_blank
    sentence: Kami mencari ___ untuk membuka tiga cabang baru.
    meaning:
      ar_eg: بندوّر على مستثمر عشان نفتح تلات فروع جديدة.
      ar: نبحث عن مستثمر لافتتاح ثلاثة فروع جديدة.
      en: We're looking for an investor to open three new branches.
    options: [investor, notulen, kupon]
    answers: [investor]
    words: [investor, cabang]
  - id: e04
    type: build_sentence
    source:
      ar_eg: إحنا بنستورد التمر من مصر على طول.
      ar: نستورد التمر مباشرةً من مصر.
      en: We import dates directly from Egypt.
    answer: Kami mengimpor kurma langsung dari Mesir.
    distractors: [proposal, merek]
    words: [kurma]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ممكن أبعتلك المقترح النهارده بالليل.
      ar: يمكنني أن أرسل إليك المقترح الليلة.
      en: I can send you the proposal tonight.
    answers:
      - Saya bisa mengirim proposal kepada Bapak malam ini.
      - Saya bisa mengirimkan proposal malam ini.
      - Saya dapat mengirim proposalnya malam ini.
      - Saya bisa kirim proposalnya malam ini.
    words: [proposal]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: المستثمر سأل سؤال صعب. ترد تقول إيه الأول؟
      ar: طرح المستثمر سؤالًا صعبًا. بمَ تبدأ ردّك؟
      en: The investor asks a hard question. How do you start your answer?
    options:
      - Pertanyaan yang bagus, Pak.
      - Itu bukan urusan Bapak.
      - Saya tidak mau menjawab.
    answer: 0
    words: [investor]
  - id: e07
    type: speaking
    text: Merek kami sudah punya dua ratus pelanggan setia di Padang.
    meaning:
      ar_eg: الماركة بتاعتنا عندها ميتين زبون دايم في بادانج.
      ar: لعلامتنا التجارية مئتا زبون وفيّ في بادانغ.
      en: Our brand already has two hundred loyal customers in Padang.
    words: [merek, pelanggan setia]
  - id: e08
    type: dictation
    text: Investor itu membaca proposal kami dengan teliti.
    meaning:
      ar_eg: المستثمر ده قرا المقترح بتاعنا بتركيز.
      ar: قرأ ذلك المستثمر مقترحنا بعناية.
      en: The investor read our proposal carefully.
    words: [investor, proposal]
  - id: e09
    type: fill_blank
    sentence: Di halaman terakhir ___, ada rencana keuangan untuk tiga tahun.
    meaning:
      ar_eg: في آخر صفحة في المقترح، فيه خطة مالية لتلات سنين.
      ar: في الصفحة الأخيرة من المقترح خطّة مالية لثلاث سنوات.
      en: On the last page of the proposal there's a three-year financial plan.
    options: [proposal, kupon, agenda]
    answers: [proposal]
    words: [proposal]
  - id: e10
    type: speaking
    text: Dengan waralaba, setiap mitra memakai resep dan seragam yang sama.
    meaning:
      ar_eg: بالفرانشايز، كل شريك بيستخدم نفس الوصفة والزي.
      ar: في الامتياز يستعمل كلّ شريك الوصفة والزيّ نفسيهما.
      en: With a franchise, every partner uses the same recipe and uniform.
    words: [waralaba, mitra, seragam]
dialogue:
  title: Dua menit di depan investor
  lines:
    - speaker: Uda Fadli
      text: Mohamed, investor dari Jakarta datang besok. Proposalnya sudah siap?
      ar_eg: يا محمد، المستثمر اللي من جاكرتا جاي بكرة. المقترح جاهز؟
      ar: يا محمد، المستثمر القادم من جاكرتا يصل غدًا. هل المقترح جاهز؟
      en: Mohamed, the investor from Jakarta comes tomorrow. Is the proposal ready?
    - speaker: Mohamed
      text: Sudah, Uda. Masalah, solusi, angka, lalu permintaan kita. Dua menit saja.
      ar_eg: جاهز يا أودا. المشكلة، الحل، الأرقام، وبعدين طلبنا. دقيقتين بس.
      ar: 'جاهز يا أودا: المشكلة، الحلّ، الأرقام، ثم طلبنا. دقيقتان فقط.'
      en: It is, Uda. Problem, solution, numbers, then our ask. Just two minutes.
    - speaker: Uda Fadli
      text: Kalau dia bertanya tentang risiko?
      ar_eg: ولو سأل عن المخاطر؟
      ar: وإن سأل عن المخاطر؟
      en: What if he asks about the risks?
    - speaker: Mohamed
      text: Saya bilang, "Pertanyaan yang bagus, Pak," lalu saya jelaskan dengan data.
      ar_eg: هقوله «سؤال حلو يا أستاذ»، وبعدين أشرح بالأرقام.
      ar: 'سأقول: «سؤال وجيه يا سيّدي»، ثم أشرح بالبيانات.'
      en: I'll say, "Good question, sir," then explain with data.
new_words:
  - word: investor
    pos: noun
    ar_eg: مستثمر
    ar: مستثمر
    en: investor
  - word: proposal
    pos: noun
    ar_eg: مقترح مكتوب
    ar: مقترح، عرض مكتوب
    en: proposal, pitch document
