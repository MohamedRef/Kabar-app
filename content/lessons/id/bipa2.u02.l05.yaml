schema: kabar.lesson/v1
id: bipa2.u02.l05
language: id
title: Di perusahaan
can_do:
  ar_eg: 'تتكلم عن الشغل في شركة أو مصنع: المدير والسكرتيرة والمساعد والمعاش.'
  ar: 'أن تتحدث عن العمل في شركة أو مصنع: المدير والسكرتيرة والمساعد والتقاعد.'
  en: 'Talk about working in a company or factory: manager, secretary, assistant, retirement.'
slides:
  - title: Perusahaan dan pabrik
    body:
      ar_eg: |
        perusahaan = شركة (من usaha = مجهود، مشروع). pabrik = مصنع.
        pekerja = عامل (kerja + pe-، زي penulis وpenari).
        manajer، sekretaris، asisten: زي العربي والإنجليزي تقريبًا.
        pensiun = يطلع معاش. karier = مسيرة مهنية (وبتتكتب كمان karir).
      ar: |
        perusahaan = شركة (من usaha = جهد، مشروع). pabrik = مصنع.
        pekerja = عامل (kerja + pe-، مثل penulis وpenari).
        manajer وsekretaris وasisten قريبة من العربية والإنجليزية.
        pensiun = يتقاعد. karier = مسيرة مهنية (وتُكتب أيضًا karir).
      en: |
        perusahaan = company (from usaha, effort, business). pabrik = factory.
        pekerja = worker (kerja + pe-, like penulis and penari).
        manajer, sekretaris, asisten: as in English.
        pensiun = retire, retired. karier = career (also spelt karir).
    examples:
      - text: Ayah saya kerja di perusahaan besar.
        ar_eg: بابا بيشتغل في شركة كبيرة.
        ar: يعمل أبي في شركة كبيرة.
        en: My father works at a big company.
      - text: Pekerja pabrik itu sering lembur.
        ar_eg: عمال المصنع ده بيشتغلوا أوفرتايم كتير.
        ar: عمّال ذلك المصنع يعملون ساعات إضافية كثيرًا.
        en: That factory's workers often do overtime.
      - text: Kakek sudah pensiun. Sekarang dia berkebun.
        ar_eg: جدو طلع معاش. دلوقتي بيزرع.
        ar: تقاعد جدّي، وهو الآن يزرع.
        en: Grandpa has retired. Now he gardens.
