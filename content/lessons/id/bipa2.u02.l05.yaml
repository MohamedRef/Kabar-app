schema: kabar.lesson/v1
id: bipa2.u02.l05
language: id
title: Wawancara singkat
can_do:
  ar_eg: ترد على أسئلة بسيطة في مقابلة شغل.
  ar: أن تجيب عن أسئلة بسيطة في مقابلة.
  en: Answer simple interview questions.
slides:
  - title: Mengapa Anda …? — Karena …
    body:
      ar_eg: |
        في المقابلة الكلام رسمي: Anda بدل kamu، وmengapa بدل kenapa.
        أسئلة هتسمعها:
        - Apa pekerjaan Anda sekarang? = بتشتغل إيه دلوقتي؟
        - Mengapa Anda mau bekerja di sini? = عايز تشتغل هنا ليه؟
        وابدأ ردك بـ Karena … علطول.
        كلمة جديدة بـ peN-: terjemah (من العربي «ترجمة») → penerjemah = مترجم.
        وpemandu wisata = مرشد سياحي. Saya mau menjadi … = عايز أبقى …
      ar: |
        الكلام في المقابلة رسمي: Anda بدل kamu، وmengapa بدل kenapa.
        أسئلة متوقعة:
        - Apa pekerjaan Anda sekarang؟ = ما عملك الآن؟
        - Mengapa Anda mau bekerja di sini؟ = لماذا تريد العمل هنا؟
        وابدأ جوابك بـ Karena …
        كلمة جديدة بـ peN-: terjemah (من العربية «ترجمة») → penerjemah = مترجم.
        وpemandu wisata = مرشد سياحي، وSaya mau menjadi … = أريد أن أصبح …
      en: |
        Interviews are formal: Anda instead of kamu, mengapa instead of kenapa.
        Questions you'll hear:
        - Apa pekerjaan Anda sekarang? = What do you do now?
        - Mengapa Anda mau bekerja di sini? = Why do you want to work here?
        Start your answer with Karena …
        A new peN- word: terjemah (from Arabic «ترجمة», translation) → penerjemah = translator.
        pemandu wisata = tour guide. Saya mau menjadi … = I want to become …
    grammar: id.question.mengapa
    examples:
      - text: Mengapa Anda mau bekerja di sini?
        ar_eg: عايز تشتغل هنا ليه؟
        ar: لماذا تريد العمل هنا؟
        en: Why do you want to work here?
      - text: Saya mau menjadi pemandu wisata.
        ar_eg: عايز أبقى مرشد سياحي.
        ar: أريد أن أصبح مرشدًا سياحيًا.
        en: I want to become a tour guide.
exercises:
  - id: e01
    type: listen
    text: Mengapa Anda mau menjadi pemandu wisata?
    options: ['Mengapa Anda mau menjadi pemandu wisata?', 'Kapan Anda mau menjadi pemandu wisata?', 'Apa Anda mau menjadi penulis?']
    answer: 0
    words: [mengapa, menjadi, pemandu wisata]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بو ماديه سألتك «Apa pekerjaan Anda sekarang?». أنهي رد مناسب؟
      ar: سألتك بو ماديه «Apa pekerjaan Anda sekarang؟». أيّ جواب يناسب؟
      en: Bu Made asks "Apa pekerjaan Anda sekarang?". Which answer fits?
    options: [Saya penerjemah di Kairo., Saya pulang jam lima., Karena saya suka Bali.]
    answer: 0
    words: [pekerjaan, penerjemah]
  - id: e03
    type: fill_blank
    sentence: Saya mau bekerja di sini ___ saya suka bertemu orang baru.
    meaning:
      ar_eg: عايز أشتغل هنا عشان بحب أقابل ناس جديدة.
      ar: أريد العمل هنا لأنني أحب لقاء أناس جدد.
      en: I want to work here because I like meeting new people.
    answers: [karena, sebab]
    words: [karena, bertemu]
  - id: e04
    type: fill_blank
    sentence: Saya bekerja di biro ___ di Kairo.
    meaning:
      ar_eg: أنا بشتغل في شركة سياحة في القاهرة.
      ar: أعمل في وكالة سفر في القاهرة.
      en: I work at a travel agency in Cairo.
    options: [perjalanan, wawancara, penerjemah]
    answers: [perjalanan]
    words: [biro perjalanan]
  - id: e05
    type: match_pairs
    pairs:
      - text: wawancara
        ar_eg: مقابلة شغل
        ar: مقابلة عمل
        en: interview
      - text: penerjemah
        ar_eg: مترجم
        ar: مترجم
        en: translator
      - text: menjadi
        ar_eg: يبقى، يصبح
        ar: يصبح
        en: become
      - text: Timur Tengah
        ar_eg: الشرق الأوسط
        ar: الشرق الأوسط
        en: the Middle East
      - text: biro perjalanan
        ar_eg: شركة سياحة
        ar: وكالة سفر
        en: travel agency
      - text: pemandu wisata
        ar_eg: مرشد سياحي
        ar: مرشد سياحي
        en: tour guide
    words: [wawancara, penerjemah, menjadi, Timur Tengah, biro perjalanan, pemandu wisata]
  - id: e06
    type: build_sentence
    source:
      ar_eg: أنا مبسوط إني أقابل ناس جديدة.
      ar: يسعدني أن ألتقي أناسًا جددًا.
      en: I'm happy to meet new people.
    answer: Saya senang bertemu orang baru.
    distractors: [penerjemah, menjadi]
    words: [senang, bertemu]
  - id: e07
    type: translate
    direction: from_target
    source_text: Kami perlu pemandu untuk turis dari Timur Tengah.
    answers_meaning:
      ar_eg: [إحنا محتاجين مرشد للسياح اللي جايين من الشرق الأوسط, محتاجين مرشد سياحي لسياح الشرق الأوسط]
      ar: [نحتاج إلى مرشد للسياح القادمين من الشرق الأوسط, نحتاج مرشدًا لسياح الشرق الأوسط]
      en: [We need a guide for tourists from the Middle East., We need guides for tourists from the Middle East.]
    words: [pemandu wisata, turis, perlu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المقابلة بتاعتي في شركة السياحة يوم الاتنين.
      ar: مقابلتي في وكالة السفر يوم الاثنين.
      en: My interview at the travel agency is on Monday.
    answer: Wawancara saya di biro perjalanan hari Senin.
    distractors: [menjadi, karena]
    words: [wawancara, biro perjalanan]
  - id: e09
    type: dictation
    text: Wawancara ini untuk penerjemah dari Timur Tengah.
    meaning:
      ar_eg: المقابلة دي لمترجمين من الشرق الأوسط.
      ar: هذه المقابلة لمترجمين من الشرق الأوسط.
      en: This interview is for translators from the Middle East.
    words: [wawancara, penerjemah, Timur Tengah]
  - id: e10
    type: speaking
    text: Saya mau menjadi pemandu wisata karena saya suka bertemu orang baru.
    meaning:
      ar_eg: عايز أبقى مرشد سياحي عشان بحب أقابل ناس جديدة.
      ar: أريد أن أصبح مرشدًا سياحيًا لأنني أحب لقاء أناس جدد.
      en: I want to become a tour guide because I like meeting new people.
    words: [menjadi, pemandu wisata, karena, bertemu]
dialogue:
  title: Wawancara di biro perjalanan
  lines:
    - speaker: Bu Made
      text: Apa pekerjaan Anda sekarang?
      ar_eg: حضرتك بتشتغل إيه دلوقتي؟
      ar: ما عملك الآن؟
      en: What do you do now?
    - speaker: Mohamed
      text: Di Kairo saya penerjemah. Sekarang saya belajar bahasa Indonesia di Bali.
      ar_eg: في القاهرة أنا مترجم. ودلوقتي بتعلم إندونيسي في بالي.
      ar: أنا مترجم في القاهرة، وأتعلم الآن الإندونيسية في بالي.
      en: In Cairo I'm a translator. Now I'm learning Indonesian in Bali.
    - speaker: Bu Made
      text: Mengapa Anda mau menjadi pemandu wisata?
      ar_eg: حضرتك عايز تبقى مرشد سياحي ليه؟
      ar: لماذا تريد أن تصبح مرشدًا سياحيًا؟
      en: Why do you want to become a tour guide?
    - speaker: Mohamed
      text: Karena saya suka bertemu orang baru, dan saya bisa berbahasa Arab dan Inggris.
      ar_eg: عشان بحب أقابل ناس جديدة، وبعرف أتكلم عربي وإنجليزي.
      ar: لأنني أحب لقاء أناس جدد، وأتحدث العربية والإنجليزية.
      en: Because I like meeting new people, and I can speak Arabic and English.
    - speaker: Bu Made
      text: Bagus! Kami perlu pemandu untuk turis dari Timur Tengah. Apakah Anda bisa bekerja hari Sabtu?
      ar_eg: حلو! إحنا محتاجين مرشد للسياح اللي من الشرق الأوسط. تقدر تشتغل يوم السبت؟
      ar: جيد! نحتاج إلى مرشد لسياح الشرق الأوسط. هل تستطيع العمل يوم السبت؟
      en: Great! We need a guide for tourists from the Middle East. Can you work on Saturdays?
    - speaker: Mohamed
      text: Bisa, Bu. Tapi hari Jumat siang saya tidak bisa, karena saya salat Jumat.
      ar_eg: أقدر يا مدام. بس يوم الجمعة الضهر مش هقدر، عشان بصلي الجمعة.
      ar: نعم يا سيدتي، لكنني لا أستطيع ظهر الجمعة لأنني أصلي الجمعة.
      en: Yes, ma'am. But not Friday midday, because I go to Friday prayers.
