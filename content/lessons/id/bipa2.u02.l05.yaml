    words: [sekretaris, asisten, pensiun, karier]
  - id: e03
    type: listen
    text: Ada rapat jam sembilan dengan manajer.
    question:
      ar_eg: الاجتماع مع مين؟
      ar: الاجتماع مع مَن؟
      en: Who is the meeting with?
    options: [المدير, السكرتيرة, العمال]
    answer: 0
    meaning:
      ar_eg: فيه اجتماع الساعة تسعة مع المدير.
      ar: هناك اجتماع في التاسعة مع المدير.
      en: There's a meeting at nine with the manager.
    words: [manajer]
  - id: e04
    type: fill_blank
    sentence: Kakek sudah ___. Dia tidak bekerja lagi.
    meaning:
      ar_eg: جدو ___ خلاص. مبقاش بيشتغل.
      ar: جدّي ___، ولم يعد يعمل.
      en: Grandpa has ___. He doesn't work any more.
    options: [pensiun, pabrik, asisten]
    answers: [pensiun]
    words: [pensiun, pabrik, asisten]
    explain:
      ar_eg: pensiun = طلع معاش، وعشان كده «مبقاش بيشتغل». pabrik مصنع، وasisten مساعد.
      ar: pensiun = تقاعد، ولذلك «لم يعد يعمل». أما pabrik فمصنع وasisten مساعد.
      en: pensiun = retired, hence "doesn't work any more". pabrik is a factory, asisten an assistant.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بترد على تليفونات المدير وبتنظم مواعيده. شغلانتها؟
      ar: تجيب هاتف المدير وتنظّم مواعيده. ما عملها؟
      en: She answers the manager's phone and keeps his diary. Her job?
    options: [sekretaris, pekerja, manajer]
    answer: 0
    explain:
      ar_eg: sekretaris = سكرتيرة.
      ar: sekretaris = سكرتيرة.
      en: sekretaris = secretary.
    words: [sekretaris, pekerja, manajer]
  - id: e06
    type: fill_blank
    sentence: Ada lima ratus ___ di pabrik sepatu itu.
    meaning:
      ar_eg: فيه خمسمية ___ في مصنع الجزم ده.
      ar: في مصنع الأحذية ذلك خمسمئة ___.
      en: There are five hundred ___ at that shoe factory.
    options: [pekerja, karier, perusahaan]
    answers: [pekerja]
    words: [pekerja, karier, perusahaan, pabrik]
    explain:
      ar_eg: "بعد العدد ييجي ناس: pekerja = عامل (من kerja). karier = مسيرة شغل، وperusahaan = شركة."
      ar: "بعد العدد يأتي أشخاص: pekerja = عامل. أما karier فمسيرة مهنية وperusahaan شركة."
      en: "After the number come people: pekerja = worker. karier is a career, perusahaan a company."
  - id: e07
    type: build_sentence
    source:
      ar_eg: أنا بشتغل في شركة كبيرة.
      ar: أعمل في شركة كبيرة.
      en: I work at a big company.
    answer: Saya bekerja di perusahaan besar.
    distractors: [pabrik, asisten]
    words: [perusahaan]
    explain:
      ar_eg: perusahaan = شركة (من usaha). pabrik = مصنع، وasisten = مساعد.
      ar: perusahaan = شركة (من usaha). أما pabrik فمصنع وasisten مساعد.
      en: perusahaan = company (from usaha). pabrik is a factory, asisten an assistant.
  - id: e08
    type: translate
    direction: from_target
    source_text: Dia asisten manajer. Kariernya bagus.
    answers_meaning:
      ar_eg: [هو مساعد المدير. ومستقبله المهني حلو, هي مساعدة المدير، وشغلها ماشي كويس]
      ar: [إنه مساعد المدير، ومسيرته المهنية جيدة, هي مساعدة المدير، ومسيرتها جيدة]
      en: ['He''s the manager''s assistant. His career is going well', 'She''s an assistant manager. Her career is good']
    words: [asisten, manajer, karier]
  - id: e09
    type: speaking
    text: Saya ingin karier yang bagus.
    meaning:
      ar_eg: عايز مستقبل مهني كويس.
      ar: أريد مسيرة مهنية جيدة.
      en: I want a good career.
    words: [karier]
  - id: e10
    type: multiple_choice
    question: Sepatu ini dari ___ di Bandung.
    options: [pabrik, pensiun, sekretaris]
    answer: 0
    explain:
      ar_eg: 'الجزم بتتعمل في مصنع: pabrik.'
      ar: 'تُصنع الأحذية في مصنع: pabrik.'
      en: 'Shoes are made in a factory: pabrik.'
    words: [pabrik, pensiun, sekretaris]
dialogue:
  lines:
    - speaker: Bu Hana
      text: Selamat pagi. Silakan duduk. Saya manajer di perusahaan ini.
      ar_eg: صباح الخير. اتفضل اقعد. أنا المديرة في الشركة دي.
      ar: صباح الخير، تفضّل بالجلوس. أنا مديرة هذه الشركة.
      en: Good morning. Please sit down. I'm the manager at this company.
    - speaker: Mohamed
      text: Selamat pagi, Bu. Saya Mohamed, penerjemah.
      ar_eg: صباح النور يا فندم. أنا محمد، مترجم.
      ar: صباح الخير يا سيدتي. أنا محمد، مترجم.
      en: Good morning. I'm Mohamed, a translator.
    - speaker: Bu Hana
      text: Kami perlu asisten yang bisa bahasa Arab.
      ar_eg: إحنا محتاجين مساعد بيعرف عربي.
      ar: نحتاج إلى مساعد يتقن العربية.
      en: We need an assistant who speaks Arabic.
    - speaker: Mohamed
      text: Saya bisa bahasa Arab dan Inggris.
      ar_eg: أنا بعرف عربي وإنجليزي.
      ar: أتقن العربية والإنجليزية.
      en: I speak Arabic and English.
    - speaker: Bu Hana
      text: Bagus. Nanti sekretaris saya mengirim email.
      ar_eg: كويس. السكرتيرة بتاعتي هتبعتلك إيميل بعدين.
      ar: جيد. سترسل لك سكرتيرتي بريدًا لاحقًا.
      en: Good. My secretary will send you an email later.
    - speaker: Mohamed
      text: Terima kasih, Bu. Ini awal karier yang bagus!
      ar_eg: شكرًا يا فندم. دي بداية حلوة لمستقبلي!
      ar: شكرًا يا سيدتي. إنها بداية جيدة لمسيرتي!
      en: Thank you. This is a good start to my career!
