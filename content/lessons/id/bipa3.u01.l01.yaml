schema: kabar.lesson/v1
id: bipa3.u01.l01
language: id
title: Selamat dan semoga
can_do:
  ar_eg: تهنّي الناس في مناسباتهم (جواز، تخرّج، مولود) وتدعيلهم.
  ar: أن تهنّئ الناس في مناسباتهم (زواج، تخرّج، مولود) وتدعو لهم.
  en: Congratulate people on life events and wish them well.
slides:
  - title: Selamat + acara
    body:
      ar_eg: |
        انت عارف selamat من BIPA 1 (من العربي «سلامة»). في المناسبات بتحط بعدها المناسبة على طول:
        Selamat menikah! = ألف مبروك على الجواز!
        Selamat wisuda! = مبروك التخرّج!
        ولو بعدها اسم طويل بتقدر تزوّد atas: Selamat atas kelahiran … = مبروك على مولود …
      ar: |
        تعرف selamat منذ BIPA 1 (من العربية «سلامة»). في المناسبات تأتي بعدها المناسبة مباشرة:
        Selamat menikah! = مبارك الزواج!
        Selamat wisuda! = مبارك التخرّج!
        ومع الاسم الطويل يمكن إضافة atas: Selamat atas kelahiran … = مبارك مولد …
      en: |
        You know selamat since BIPA 1 (from Arabic «سلامة»). For a life event, put the event right after it:
        Selamat menikah! = Congratulations on your wedding!
        Selamat wisuda! = Congratulations on graduating!
        Before a longer noun you can add atas: Selamat atas kelahiran … = Congratulations on the birth of …
    examples:
      - text: Selamat wisuda, Rina!
        ar_eg: مبروك التخرّج يا رينا!
        ar: مبارك تخرّجك يا رينا!
        en: Congratulations on graduating, Rina!
      - text: Selamat atas kelahiran anak Ibu!
        ar_eg: مبروك المولود يا مدام!
        ar: مبارك المولود يا سيدتي!
        en: Congratulations on the birth of your child!
  - title: Semoga … untuk hidup baru
    grammar: id.hope.semoga
    body:
      ar_eg: |
        بعد التهنئة بييجي الدعاء بـ semoga (يا رب / إن شاء الله) اللي اتعلمتها في BIPA 2:
        للعرسان: Semoga langgeng = ربنا يخليكم لبعض (langgeng = يدوم).
        لبيت جديد أو شغل جديد: Semoga membawa berkah = ربنا يجعله فيه البركة. berkah من العربي «بركة».
        والرد دايمًا: Amin, terima kasih!
      ar: |
        بعد التهنئة يأتي الدعاء بـsemoga (عسى / نرجو) الذي تعلمته في BIPA 2:
        للعروسين: Semoga langgeng = دام الودّ بينكما (langgeng = دائم).
        لبيت جديد أو عمل جديد: Semoga membawa berkah = جعله الله مباركًا. وberkah من العربية «بركة».
        والرد: Amin, terima kasih!
      en: |
        After congratulating, add a wish with semoga (may … / I hope), which you met in BIPA 2:
        For a couple: Semoga langgeng = may your marriage last (langgeng = lasting).
        For a new home or job: Semoga membawa berkah = may it bring blessings. berkah comes from Arabic «بركة».
        The reply is always: Amin, terima kasih!
    examples:
      - text: Semoga langgeng dan bahagia selalu!
        ar_eg: ربنا يخليكم لبعض وتعيشوا مبسوطين على طول!
        ar: دامت سعادتكما ودام ودّكما!
        en: May your marriage last and may you always be happy!
      - text: Semoga rumah baru Bu Yanti membawa berkah.
        ar_eg: ربنا يبارك لك في البيت الجديد يا مدام يانتي.
        ar: بارك الله لكِ في بيتك الجديد يا سيدة يانتي.
        en: May your new house bring you blessings, Bu Yanti.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wisuda
        ar_eg: تخرّج (حفلة التخرّج)
        ar: حفل التخرّج
        en: graduation
      - text: pengantin
        ar_eg: عريس / عروسة
        ar: عريس / عروس
        en: bride / groom
      - text: kelahiran
        ar_eg: ولادة، مولود
        ar: ولادة
        en: birth
      - text: bahagia
        ar_eg: سعيد، مبسوط
        ar: سعيد
        en: happy
      - text: berkah
        ar_eg: بركة
        ar: بركة
        en: blessing
      - text: langgeng
        ar_eg: يدوم، دايم
        ar: دائم
        en: lasting
    words: [wisuda, pengantin, kelahiran, bahagia, berkah, langgeng]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: رينا خلّصت الجامعة النهارده وفيه حفلة. تقولها إيه؟
      ar: أنهت رينا دراستها الجامعية واليوم حفل تخرّجها. ماذا تقول لها؟
      en: Rina finished university and today is her ceremony. What do you say?
    options: ["Semoga cepat sembuh!", "Selamat wisuda!", "Selamat menikah!"]
    answer: 1
    words: [wisuda]
  - id: e03
    type: listen
    text: Semoga pengantin baru langgeng sampai tua!
    options: ["Semoga pengantin baru senang sampai tua!", "Selamat pengantin baru datang!", "Semoga pengantin baru langgeng sampai tua!"]
    answer: 2
    meaning:
      ar_eg: ربنا يخلّي العرسان الجداد لبعض لحد ما يكبروا!
      ar: دام الودّ بين العروسين حتى الشيخوخة!
      en: May the newlyweds' marriage last until they're old!
    words: [pengantin, langgeng, tua]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: مدام يانتي نقلت في بيت جديد. أنهي دعوة مناسبة؟
      ar: انتقلت السيدة يانتي إلى بيت جديد. أيّ دعاء يناسب؟
      en: Bu Yanti has moved into a new house. Which wish fits?
    options: ["Semoga cepat sembuh.", "Selamat atas kelahiran anak Ibu.", "Semoga membawa berkah."]
    answer: 2
    explain:
      ar_eg: "Semoga membawa berkah تنفع لأي حاجة جديدة: بيت، شغل، عربية."
      ar: "تصلح Semoga membawa berkah لكل شيء جديد: بيت أو عمل أو سيارة."
      en: Semoga membawa berkah fits anything new — a house, a job, a car.
    words: [berkah, membawa]
  - id: e05
    type: fill_blank
    sentence: Selamat atas ___ anak pertama Ibu!
    meaning:
      ar_eg: مبروك على مولودك الأول!
      ar: مبارك مولدُ طفلكِ الأول!
      en: Congratulations on the birth of your first child!
    options: [kelahiran, pengantin, wisuda]
    answers: [kelahiran]
    words: [kelahiran]
  - id: e06
    type: build_sentence
    source:
      ar_eg: يا رب العرسان الجداد يفضلوا مبسوطين لحد ما يكبروا.
      ar: نرجو أن يبقى العروسان سعيدين حتى الشيخوخة.
      en: May the newlyweds be happy until they're old.
    answer: Semoga pengantin baru bahagia sampai tua.
    alternatives: ["Semoga pengantin baru bahagia sampai tua!"]
    distractors: [wisuda, sembuh]
    words: [pengantin, bahagia, tua]
  - id: e07
    type: fill_blank
    sentence: Selamat menikah! Semoga ___ sampai tua.
    meaning:
      ar_eg: ألف مبروك! ربنا يخليكم لبعض لحد ما تكبروا.
      ar: مبارك الزواج! دام ودّكما حتى الشيخوخة.
      en: Congratulations on your wedding! May it last until you're old.
    options: [langgeng, kelahiran, wisuda]
    answers: [langgeng]
    words: [langgeng, tua]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مبروك التخرّج يا رينا! ربنا يسعدك على طول.
      ar: مبارك تخرّجك يا رينا! دمتِ سعيدة.
      en: Congratulations on graduating, Rina! May you always be happy.
    answers:
      - Selamat wisuda, Rina! Semoga bahagia selalu!
      - Selamat wisuda, Rina! Semoga bahagia selalu.
      - Selamat wisuda, Rina! Semoga selalu bahagia!
      - Selamat wisuda, Rina! Semoga selalu bahagia.
      - Selamat wisuda, Rina. Semoga bahagia selalu.
      - Selamat wisuda, Rina. Semoga selalu bahagia.
      - Selamat wisuda, Rina, semoga bahagia selalu!
      - Selamat wisuda, Rina, semoga selalu bahagia!
      - Selamat atas wisudanya, Rina! Semoga bahagia selalu!
      - Selamat wisuda Rina, semoga bahagia selalu
      - Selamat wisuda Rina, semoga selalu bahagia
    words: [wisuda, bahagia]
  - id: e09
    type: speaking
    text: Selamat atas kelahiran anak Ibu. Semoga membawa berkah!
    meaning:
      ar_eg: مبروك المولود يا مدام. ربنا يجعله بركة!
      ar: مبارك المولود يا سيدتي. جعله الله بركة!
      en: Congratulations on the birth of your child. May the baby bring blessings!
    words: [kelahiran, berkah, membawa]
  - id: e10
    type: listen
    text: Semoga rumah baru membawa berkah.
    options: ['Semoga rumah baru membawa berkah.', 'Semoga rumah baru cepat selesai.', 'Selamat atas rumah baru Ibu.']
    answer: 0
    meaning:
      ar_eg: يا رب البيت الجديد يجيب البركة.
      ar: عسى أن يجلب البيت الجديد البركة.
      en: May the new house bring blessings.
    words: [membawa, berkah]
dialogue:
  title: Nyongkolan di Mataram
  lines:
    - speaker: Rina
      text: Mohamed, lihat! Itu pengantin baru. Ini namanya nyongkolan.
      ar_eg: يا محمد، بص! دول العرسان الجداد. ده اسمه «نيونجكولان» (زفّة ساساك).
      ar: انظر يا محمد! هذان العروسان الجديدان. هذه تُسمّى «نيونغكولان» (زفّة شعب الساساك).
      en: Look, Mohamed! That's the new bride and groom. This is called nyongkolan (a Sasak wedding procession).
    - speaker: Mohamed
      text: Wah, ramai sekali! Saya harus bilang apa?
      ar_eg: واو، زحمة أوي! أقول لهم إيه؟
      ar: يا للزحام! ماذا أقول لهما؟
      en: Wow, it's so lively! What should I say?
    - speaker: Rina
      text: Bilang saja, "Selamat menikah, semoga langgeng!"
      ar_eg: "قول بس: «ألف مبروك، ربنا يخليكم لبعض!»"
      ar: "قل فقط: «مبارك الزواج، دام ودّكما!»"
      en: 'Just say: "Congratulations, may your marriage last!"'
    - speaker: Mohamed
      text: Selamat menikah! Semoga langgeng dan bahagia selalu.
      ar_eg: ألف مبروك! ربنا يخليكم لبعض وتفضلوا مبسوطين على طول.
      ar: مبارك الزواج! دام ودّكما ودامت سعادتكما.
      en: Congratulations! May your marriage last and may you always be happy.
    - speaker: Pengantin
      text: Amin, terima kasih banyak!
      ar_eg: آمين، متشكرين أوي!
      ar: آمين، شكرًا جزيلًا!
      en: Amen, thank you so much!
new_words:
  - word: wisuda
    pos: noun
    ar_eg: التخرّج (حفلة التخرّج)
    ar: حفل التخرّج
    en: graduation (ceremony)
  - word: pengantin
    pos: noun
    ar_eg: عريس أو عروسة (pengantin baru = العرسان الجداد)
    ar: العريس أو العروس (pengantin baru = العروسان الجديدان)
    en: bride or groom (pengantin baru = newlyweds)
  - word: kelahiran
    pos: noun
    ar_eg: ولادة، مولود
    ar: ولادة
    en: birth
  - word: bahagia
    pos: adjective
    ar_eg: سعيد
    ar: سعيد
    en: happy
  - word: berkah
    pos: noun
    ar_eg: بركة
    ar: بركة
    en: blessing
    arabic: بركة
  - word: langgeng
    pos: adjective
    ar_eg: دايم، بيدوم (بيتقال للعرسان)
    ar: دائم (يُقال للعروسين)
    en: lasting (said to couples)
  - word: membawa
    pos: verb
    ar_eg: يجيب / يشيل معاه (semoga membawa berkah = يا رب يجيب البركة)
    ar: يحمل / يجلب
    en: to bring, carry
  - word: tua
    pos: adjective
    ar_eg: عجوز / كبير في السن (sampai tua = لحد ما نكبر)
    ar: مسنّ / كبير في السن
    en: old (of people)
