schema: kabar.lesson/v1
id: bipa6.u03.l04
language: id
title: Rumah gadang
can_do:
  ar_eg: توصف البيت التقليدي بتاع المينانجكاباو وتشرح هو ملك مين وليه.
  ar: أن تصف البيت التقليدي لدى المينانغكاباو وتشرح لمن يعود ولماذا.
  en: Describe the Minangkabau great house and explain who owns it and why.
slides:
  - title: Atap seperti tanduk
    body:
      ar_eg: |
        الـ rumah gadang (البيت الكبير) هو بيت العيلة عند المينانجكاباو في سومطرة الغربية.
        - gonjong = طرف السقف اللي طالع لفوق زي قرون الجاموس
        - rangkiang = مخزن رز صغير قدام البيت، يعني lumbung padi
        - kaum = العيلة الكبيرة من ناحية الأم
        - pemilik = المالك. البيت ملك ستات الـ kaum، وبيتورث من الأم لبنتها.
        والبيت مبني على عواميد خشب عالية، ومنقوش بـ ukiran من برّه.
        - في الشارع: banget = sekali (أوي)، aku / -ku = saya (أنا)، cuma = hanya (بس)، terus = lalu (وبعدين)، nyimpan = menyimpan (يخزّن).
      ar: |
        الـ rumah gadang (البيت الكبير) بيت العائلة عند المينانغكاباو في سومطرة الغربية.
        - gonjong = طرف السقف المرتفع كقرني الجاموس
        - rangkiang = مخزن أرزّ صغير أمام البيت، أي lumbung padi
        - kaum = العائلة الممتدّة من جهة الأمّ
        - pemilik = المالك؛ فالبيت ملك نساء الـ kaum، ويُورَث من الأمّ إلى ابنتها.
        والبيت قائم على أعمدة خشبية عالية، وتزيّنه ukiran من الخارج.
        - في كلام الشارع: banget = sekali (جدًّا)، aku / -ku = saya (أنا)، cuma = hanya (فقط)، terus = lalu (ثمّ)، nyimpan = menyimpan (يخزّن).
      en: |
        The rumah gadang (great house) is the family home of the Minangkabau in West Sumatra.
        - gonjong = the upswept roof peak, shaped like buffalo horns
        - rangkiang = a small rice barn in front of the house, a lumbung padi
        - kaum = the extended family on the mother's side
        - pemilik = owner. The house belongs to the women of the kaum and passes from mother to daughter.
        It stands on tall wooden posts, and its outside is covered in ukiran.
        - On the street: banget = sekali (very), aku / -ku = saya (I), cuma = hanya (only), terus = lalu (then), nyimpan = menyimpan (to store).
    examples:
      - text: Rumah gadang ini mempunyai enam gonjong dan dua rangkiang.
        ar_eg: البيت الكبير ده ليه ست أطراف سقف ومخزنين رز.
        ar: لهذا البيت الكبير ستّة أطراف سقف مرتفعة ومخزنا أرزّ.
        en: This great house has six roof peaks and two rice barns.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rumah gadang
        ar_eg: البيت الكبير بتاع المينانج
        ar: البيت الكبير لدى المينانغ
        en: Minang great house
      - text: gonjong
        ar_eg: طرف السقف المرفوع
        ar: طرف السقف المرتفع
        en: upswept roof peak
      - text: rangkiang
        ar_eg: مخزن رز
        ar: مخزن أرزّ
        en: rice barn
      - text: kaum
        ar_eg: العيلة الكبيرة
        ar: العشيرة الأمومية
        en: maternal clan
      - text: pemilik
        ar_eg: المالك
        ar: المالك
        en: owner
    words: [rumah gadang, gonjong, rangkiang, kaum, pemilik]
  - id: e02
    type: listen
    text: Atap rumah gadang berbentuk gonjong, seperti tanduk kerbau.
    question:
      ar_eg: سقف البيت شكله عامل زي إيه؟
      ar: بمَ يشبه سقف البيت؟
      en: What does the roof look like?
    options:
      - زي القبة.
      - زي قرون الجاموس.
      - زي المركب.
    answer: 1
    words: [rumah gadang, gonjong]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الـ rumah gadang ملك مين؟
      ar: لمن يعود الـ rumah gadang؟
      en: Who owns the rumah gadang?
    options:
      - الابن الكبير.
      - الحكومة.
      - ستات العيلة من ناحية الأم.
    answer: 2
    explain:
      ar_eg: المينانج matrilineal، فالبيت بيتورث من الأم لبنتها.
      ar: المينانغ matrilineal، فيُورَث البيت من الأمّ إلى ابنتها.
      en: The Minang are matrilineal, so the house passes from mother to daughter.
    words: [rumah gadang, pemilik]
  - id: e04
    type: fill_blank
    sentence: Padi hasil panen disimpan di ___ di depan rumah.
    meaning:
      ar_eg: رز الحصاد بيتخزن في المخزن اللي قدام البيت.
      ar: يُخزَّن أرزّ الحصاد في المخزن أمام البيت.
      en: The harvested rice is stored in the barn in front of the house.
    options: [rangkiang, gonjong, surau]
    answers: [rangkiang]
    words: [rangkiang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «kaum» عند المينانج يعني إيه؟
      ar: ما معنى «kaum» عند المينانغ؟
      en: What is a "kaum" among the Minang?
    options:
      - العيلة الكبيرة من ناحية الأم.
      - الجيران في الشارع.
      - صحاب المدرسة.
    answer: 0
    words: [kaum]
  - id: e06
    type: build_sentence
    source:
      ar_eg: البيت ده ملك ستات العيلة.
      ar: يعود هذا البيت إلى نساء العائلة.
      en: This house belongs to the women of the family.
    answer: Pemilik rumah ini adalah perempuan dalam kaum.
    distractors: [gonjong, mamak]
    words: [pemilik, kaum]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: البيت الكبير ليه أربع أطراف سقف مرفوعة.
      ar: للبيت الكبير أربعة أطراف سقف مرتفعة.
      en: The great house has four roof peaks.
    answers:
      - Rumah gadang itu mempunyai empat gonjong.
      - Rumah gadang itu punya empat gonjong.
      - Rumah gadang ini mempunyai empat gonjong.
      - Rumah gadang ini punya empat gonjong.
    words: [rumah gadang, gonjong]
  - id: e08
    type: speaking
    text: Setiap kaum mempunyai rumah gadang dan rangkiangnya sendiri.
    meaning:
      ar_eg: كل عيلة كبيرة ليها بيتها الكبير ومخزن الرز بتاعها.
      ar: لكلّ عشيرة بيتها الكبير ومخزن أرزّها.
      en: Every clan has its own great house and rice barn.
    words: [kaum, rangkiang]
  - id: e09
    type: dictation
    text: Rumah gadang diwariskan dari ibu kepada anak perempuannya.
    meaning:
      ar_eg: البيت الكبير بيتورث من الأم لبنتها.
      ar: يُورَّث البيت الكبير من الأمّ إلى ابنتها.
      en: The great house is handed down from mother to daughter.
    words: [rumah gadang]
  - id: e10
    type: fill_blank
    sentence: Siapa ___ rumah gadang ini? Nenek Uni Lisa.
    meaning:
      ar_eg: مين صاحب البيت الكبير ده؟ جدة أوني ليزا.
      ar: من مالك هذا البيت الكبير؟ جدّة ليزا.
      en: Who owns this great house? Uni Lisa's grandmother.
    options: [pemilik, rangkiang, kaum]
    answers: [pemilik]
    words: [pemilik]
dialogue:
  title: Rumah nenek di Batusangkar
  lines:
    - speaker: Uda Rafi
      text: Ini rumah gadang kaum kami. Umurnya hampir seratus tahun.
      ar_eg: ده البيت الكبير بتاع عيلتنا. عمره تقريبًا مية سنة.
      ar: هذا البيت الكبير لعشيرتنا، وعمره قرابة مئة عام.
      en: This is our clan's great house. It's almost a hundred years old.
    - speaker: Mohamed
      text: Gonjongnya indah banget. Siapa pemiliknya, Uda?
      ar_eg: أطراف السقف حلوة جدًا. مين صاحبه يا أودا؟
      ar: أطراف سقفه رائعة. ومن مالكه يا أودا؟
      en: The roof peaks are beautiful. Who owns it, Uda?
    - speaker: Uda Rafi
      text: Ibu dan adik perempuanku. Kata orang Minang, aku cuma tamu di sini.
      ar_eg: أمي وأختي. الرجالة عند المينانج بيقولوا إنهم ضيوف هنا.
      ar: أمّي وأختي. ويقول المينانغ إنّ الرجل ضيف في هذا البيت.
      en: My mother and sister. Minang people say a man is only a guest here.
    - speaker: Mohamed
      text: Terus dua bangunan kecil di depan itu rangkiang, tempat nyimpan padi?
      ar_eg: والمبنيين الصغيرين اللي قدام دول مخازن الرز؟
      ar: والمبنيان الصغيران أمامه مخزنا الأرزّ؟
      en: And those two small buildings in front are the rice barns?
