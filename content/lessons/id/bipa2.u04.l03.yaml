schema: kabar.lesson/v1
id: bipa2.u04.l03
language: id
title: Ayo! Yuk! Mari!
can_do:
  ar_eg: تعزم الناس يعملوا حاجة سوا.
  ar: أن تدعو الناس لفعل شيء معًا.
  en: Invite people to do things together.
slides:
  - title: Ayo! Yuk!
    body:
      ar_eg: |
        ayo = «يلا» بالظبط: Ayo makan! = يلا ناكل!
        yuk = يلا بس ألطف، وبتيجي في الأول أو الآخر: Ngopi, yuk! / Yuk, ke pasar!
        ولو بتعزم اللي قدامك معاك قول kita (مش kami): Ayo kita ke pasar!
      ar: |
        ayo = «هيّا»: Ayo makan!
        yuk = هيّا بلطف، في أول الجملة أو آخرها: Ngopi, yuk!
        وإذا كانت الدعوة تشمل المخاطب فاستعمل kita لا kami: Ayo kita ke pasar!
      en: |
        ayo = "come on, let's": Ayo makan! = Let's eat!
        yuk = a softer "let's", at the start or the end: Ngopi, yuk! / Yuk, ke pasar!
        When the invitation includes the listener, use kita (not kami): Ayo kita ke pasar!
    grammar: id.invitation.ayo-mari
    examples:
      - text: Ayo, kita ke pasar!
        ar_eg: يلا نروح السوق!
        ar: هيّا نذهب إلى السوق!
        en: Come on, let's go to the market!
      - text: Ngopi, yuk!
        ar_eg: يلا نشرب قهوة!
        ar: هيا نشرب القهوة!
        en: Let's grab a coffee!
  - title: Mari kita …
    body:
      ar_eg: |
        mari = «هيا بنا» بس رسمية، في الخطب والإعلانات واللافتات:
        Mari kita mulai = هيا نبدأ. Mari kita jaga kebersihan = هيا نحافظ على النضافة.
        وMari! لوحدها لما تمشي = «سلام / عن إذنك».
        الرد على العزومة: Ayo! = يلا!، Boleh = ماشي، Nanti dulu = بعدين.
      ar: |
        mari = «هلمّ / لِنَفعل»، وهي رسمية، في الخطب والإعلانات:
        Mari kita mulai = لنبدأ. Mari kita jaga kebersihan = لنحافظ على النظافة.
        و«Mari!» وحدها عند الانصراف = «أستأذن».
        والرد: Ayo! = هيّا!، Boleh = حسنًا، Nanti dulu = لاحقًا.
      en: |
        mari = "let us" — formal: speeches, announcements, signs:
        Mari kita mulai = Let's begin. Mari kita jaga kebersihan = Let's keep things clean.
        "Mari!" alone when leaving = "I'll be off then".
        Replies: Ayo! = Let's!, Boleh = Sure, Nanti dulu = Later.
    grammar: id.invitation.ayo-mari
    examples:
      - text: Mari kita mulai.
        ar_eg: هيا نبدأ.
        ar: لنبدأ.
        en: Let's begin.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تعزم ني لوه تروحوا السوق سوا. تقول إيه؟
      ar: تريد أن تدعو ني لوه للذهاب معًا إلى السوق. ماذا تقول؟
      en: You want to invite Ni Luh to go to the market together. What do you say?
    options: [Ayo kita ke pasar!, Ayo kami ke pasar!, Yuk kami ke pasar!]
    answer: 0
    explain:
      ar_eg: العزومة فيها اللي قدامك، يبقى kita مش kami.
      ar: الدعوة تشمل المخاطب، فتأتي kita لا kami.
      en: The invitation includes the listener, so kita, not kami.
    words: [ayo, kita]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة رسمية (زي في خطبة أو إعلان)؟
      ar: أيّ جملة رسمية (كما في خطبة أو إعلان)؟
      en: Which sentence is formal (as in a speech or notice)?
    options: ['Ngopi, yuk!', Ayo makan!, Mari kita jaga kebersihan.]
    answer: 2
    words: [mari]
    explain:
      ar_eg: Mari kita = يلا بينا بشكل رسمي، تسمعها في خطبة أو لافتة. Ayo وyuk للكلام العادي مع الناس.
      ar: Mari kita دعوة رسمية تُسمع في الخطب واللافتات. أما Ayo وyuk فللكلام اليومي.
      en: Mari kita is the formal "let us", for speeches and notices. Ayo and yuk are everyday.
  - id: e03
    type: fill_blank
    sentence: Ngopi, ___!
    meaning:
      ar_eg: يلا نشرب قهوة!
      ar: هيا نشرب القهوة!
      en: Let's grab a coffee!
    options: [jangan, mari, yuk]
    answers: [yuk]
    explain:
      ar_eg: yuk بس اللي تيجي في آخر الجملة كده.
      ar: yuk وحدها تأتي في آخر الجملة هكذا.
      en: Only yuk goes at the end like this.
    words: [yuk]
  - id: e04
    type: build_sentence
    source:
      ar_eg: يلا نروح السوق!
      ar: هيّا نذهب إلى السوق!
      en: Come on, let's go to the market!
    answer: Ayo, kita ke pasar!
    alternatives: [Ayo kita ke pasar!]
    distractors: [kami, jangan]
    words: [ayo, kita]
    explain:
      ar_eg: Ayo, kita… = يلا نـ…. kami مش بتشمل اللي بتكلمه، فما ينفعش في دعوة، وjangan = ماتعملش.
      ar: Ayo, kita… = هيّا نـ…. أما kami فلا تشمل المخاطَب فلا تصلح للدعوة، وjangan للنهي.
      en: Ayo, kita… = come on, let's…. kami excludes the listener, so it can't invite; jangan means "don't".
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: يلا ناكل!
      ar: هيّا نأكل!
      en: Let's eat!
    answers: [Ayo makan!, Ayo makan, Ayo kita makan!, 'Makan, yuk!', 'Yuk, makan!', Yuk makan!, Mari makan!, Mari kita makan!]
    words: [ayo, yuk, mari]
  - id: e06
    type: dictation
    text: Mari kita mulai.
    meaning:
      ar_eg: يلا نبتدي.
      ar: لنبدأ.
      en: Let us begin.
    words: [mari, mulai]
  - id: e07
    type: listen
    text: Nanti dulu, saya masih capek.
    options: ['Nanti dulu, saya masih capek.', 'Ayo, saya masih capek.', 'Yuk, saya masih capek.']
    answer: 0
    meaning:
      ar_eg: بعدين، أنا لسه تعبان.
      ar: ليس الآن، ما زلت متعبًا.
      en: Not now, I'm still tired.
    words: [nanti dulu]
  - id: e08
    type: fill_blank
    sentence: Ngopi, yuk! — ___ dulu, ya.
    meaning:
      ar_eg: يلا نشرب قهوة! — بعدين، ماشي؟
      ar: هيّا نشرب القهوة! — لاحقًا، حسنًا؟
      en: Coffee? — Later, OK?
    options: [Nanti, Ayo, Mari]
    answers: [Nanti]
    words: [nanti dulu, yuk]
    explain:
      ar_eg: Nanti dulu = بعدين، الطريقة اللطيفة إنك تأجّل. Ayo وMari معناهم «يلا» يعني موافقة.
      ar: Nanti dulu = لاحقًا، رفض مهذب. أما Ayo وMari فقبول للدعوة.
      en: Nanti dulu (later) politely puts it off. Ayo and Mari would mean yes.
  - id: e09
    type: multiple_choice
    question: Ayo kita ke pasar!
    question_meaning:
      ar_eg: صاحبك قال «يلا نروح السوق!» وإنت مش عايز دلوقتي. تقول إيه؟
      ar: قال صديقك «هيّا إلى السوق!» ولا تريد الآن. ماذا تقول؟
      en: Your friend says "Let's go to the market!" and you don't want to now. What do you say?
    options: ['Nanti dulu, ya.', 'Ayo!', 'Mari kita mulai.']
    answer: 0
    words: [nanti dulu, ayo, mari, mulai]
    explain:
      ar_eg: Nanti dulu, ya = «بعدين، ماشي؟»، تأجيل لطيف. Ayo! موافقة، وMari kita mulai = «يلا نبدأ» رسمي.
      ar: Nanti dulu, ya تأجيل مهذب. أما Ayo! فموافقة، وMari kita mulai «لنبدأ» رسميًا.
      en: Nanti dulu, ya is a gentle "later". Ayo! says yes; Mari kita mulai is a formal "let's begin".
  - id: e10
    type: fill_blank
    sentence: Semua sudah datang. Ayo, kita ___!
    meaning:
      ar_eg: الكل وصل. يلا نبدأ!
      ar: وصل الجميع. هيا نبدأ!
      en: Everyone's here. Come on, let's start!
    options: [mulai, lupa, pulang]
    answers: [mulai]
    words: [ayo, mulai]
    explain:
      ar_eg: الكل وصل، يبقى «يلا نبدأ» = mulai. lupa = ينسى، وpulang = يروّح.
      ar: وصل الجميع، فـ«هيّا نبدأ» = mulai. أما lupa فـ«ينسى» وpulang «يعود».
      en: "Everyone's here, so \"let's start\": mulai. lupa is forget, pulang is go home."
dialogue:
  lines:
    - speaker: Raka
      text: Mohamed, ngopi, yuk!
      ar_eg: محمد، يلا نشرب قهوة!
      ar: محمد، هيا نشرب القهوة!
      en: Mohamed, let's grab a coffee!
    - speaker: Mohamed
      text: Nanti dulu, Raka. Saya masih belajar.
      ar_eg: مش دلوقتي يا راكا. لسه بذاكر.
      ar: ليس الآن يا راكا. ما زلت أدرس.
      en: Not now, Raka. I'm still studying.
    - speaker: Raka
      text: Ayo, sebentar saja!
      ar_eg: يلا، شوية صغيرين بس!
      ar: هيا، قليلًا فقط!
      en: Come on, just for a bit!
    - speaker: Mohamed
      text: Oke, ayo! Mari kita ke kafe.
      ar_eg: ماشي، يلا! يلا بينا على الكافيه.
      ar: حسنًا، هيا! لنذهب إلى المقهى.
      en: OK, let's go! Let us go to the café.
new_words:
  - word: ayo
    pos: interjection
    ar_eg: يلا
    ar: هيّا
    en: come on, let's
  - word: yuk
    pos: interjection
    ar_eg: يلا (ألطف)
    ar: هيّا (بلطف)
    en: let's (soft, casual)
  - word: mari
    pos: interjection
    ar_eg: هيا بنا (رسمية)
    ar: هلمّ، لِنَفعل (رسمية)
    en: let us (formal)
  - word: nanti dulu
    pos: phrase
    ar_eg: بعدين
    ar: لاحقًا، ليس الآن
    en: later, not now
  - word: mulai
    pos: verb
    ar_eg: يبدأ
    ar: يبدأ
    en: to start, begin
review:
  status: draft
  verified: false
