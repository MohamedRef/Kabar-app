schema: kabar.lesson/v1
id: bipa2.u04.l03
language: id
title: Sama mahalnya
can_do:
  ar_eg: تقول «قد…» و«زي… بالظبط» وانت بتقارن.
  ar: أن تعبّر عن المساواة في المقارنة.
  en: Compare equally.
slides:
  - title: se- + sifat
    body:
      ar_eg: |
        se- قبل الصفة = «قد / زي … في»:
        tinggi → setinggi: Adik saya setinggi saya = أخويا طولي (قدي في الطول).
        mahal → semahal: Tas ini semahal tas itu = الشنطة دي غالية قد دي.
        وSemahal itu? = غالية للدرجة دي؟
      ar: |
        se- قبل الصفة = «بقدر / مثل … في»:
        tinggi → setinggi: Adik saya setinggi saya = أخي بطولي.
        mahal → semahal: Tas ini semahal tas itu = هذه الحقيبة غالية كتلك.
        وSemahal itu؟ = أهي غالية إلى هذا الحد؟
      en: |
        se- before an adjective = "as … as":
        tinggi → setinggi: Adik saya setinggi saya = My sibling is as tall as me.
        mahal → semahal: Tas ini semahal tas itu = This bag is as expensive as that one.
        Semahal itu? = That expensive?
    grammar: id.comparison.equative
    examples:
      - text: Adik saya setinggi saya.
        ar_eg: أخويا الصغير طولي.
        ar: أخي الأصغر بطولي.
        en: My younger brother is as tall as me.
      - text: Patung ini semahal patung itu.
        ar_eg: التمثال ده غالي قد التمثال ده.
        ar: هذا التمثال غالٍ كذاك التمثال.
        en: This statue is as expensive as that one.
  - title: Sama … -nya dengan
    body:
      ar_eg: |
        طريقة تانية: sama + صفة + nya + dengan:
        Kain ini sama bagusnya dengan kain itu = القماشة دي حلوة زي دي بالظبط.
        Tas ini sama mahalnya dengan tas itu = الشنطة دي غالية زي دي.
        وخلي بالك: sama بتمشي مع dengan، مش seperti.
      ar: |
        وطريقة ثانية: sama + الصفة + nya + dengan:
        Kain ini sama bagusnya dengan kain itu = هذا القماش جميل كذاك تمامًا.
        وانتبه: sama تقترن بـ dengan لا seperti.
      en: |
        Second way: sama + adjective + -nya + dengan:
        Kain ini sama bagusnya dengan kain itu = This cloth is just as nice as that one.
        Careful: sama pairs with dengan, not seperti.
    grammar: id.comparison.equative
    examples:
      - text: Kain ini sama bagusnya dengan kain itu.
        ar_eg: القماشة دي حلوة زي دي بالظبط.
        ar: هذا القماش جميل كذاك القماش.
        en: This cloth is just as nice as that one.
      - text: Dua tas ini sama mahalnya.
        ar_eg: الشنطتين دول غاليين زي بعض.
        ar: هاتان الحقيبتان غاليتان بالقدر نفسه.
        en: These two bags are equally expensive.
  - title: Sama dengan, sama saja
    body:
      ar_eg: |
        - sama dengan = زي / نفس: Ukurannya sama dengan yang kemarin = المقاس نفس بتاع امبارح.
        - sama saja = كله واحد: Mau yang mana? — Sama saja. = عايز أنهي؟ — كله واحد.
      ar: |
        - sama dengan = مثل / نفس: Ukurannya sama dengan yang kemarin.
        - sama saja = سيّان: Mau yang mana؟ — Sama saja.
      en: |
        - sama dengan = the same as: Ukurannya sama dengan yang kemarin = The size is the same as yesterday's.
        - sama saja = it's all the same: Mau yang mana? — Sama saja.
    grammar: id.comparison.equative
    examples:
      - text: Warnanya sama dengan baju saya.
        ar_eg: لونها نفس لون هدومي.
        ar: لونها مثل لون ثوبي.
        en: The colour is the same as my clothes.
      - text: Mau yang merah atau yang biru? — Sama saja.
        ar_eg: عايز الأحمر ولا الأزرق؟ — كله واحد.
        ar: أتريد الأحمر أم الأزرق؟ — سيّان.
        en: The red one or the blue one? — Doesn't matter.
  - title: Tidak se…
    body:
      ar_eg: |
        النفي: tidak + se- + صفة = «مش … قد»:
        Harga di sini tidak semahal di Kuta = الأسعار هنا مش غالية قد كوتا.
        مفيدة أوي في السوق!
      ar: |
        النفي: tidak + se- + الصفة = «ليس … بقدر»:
        Harga di sini tidak semahal di Kuta = الأسعار هنا ليست مرتفعة كما في كوتا.
      en: |
        Negative: tidak + se- + adjective = "not as … as":
        Harga di sini tidak semahal di Kuta = Prices here aren't as high as in Kuta.
        Very handy at the market!
    grammar: id.comparison.equative
    examples:
      - text: Harga di sini tidak semahal di Kuta.
        ar_eg: الأسعار هنا مش غالية قد كوتا.
        ar: الأسعار هنا ليست مرتفعة كما في كوتا.
        en: Prices here aren't as high as in Kuta.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: setinggi
        ar_eg: طوله قد
        ar: بطول
        en: as tall as
      - text: semahal
        ar_eg: غالي قد
        ar: غالٍ بقدر
        en: as expensive as
      - text: sama dengan
        ar_eg: زي / نفس
        ar: مثل
        en: the same as
      - text: sama saja
        ar_eg: كله واحد
        ar: سيّان
        en: it's all the same
      - text: ukuran
        ar_eg: مقاس
        ar: مقاس
        en: size
    words: [setinggi, semahal, sama, sama saja, ukuran]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options: ["Tas ini sama mahalnya daripada tas itu.", "Tas ini sama mahalnya dengan tas itu.", "Tas ini sama mahal seperti tas itu."]
    answer: 1
    explain:
      ar_eg: sama بتمشي مع dengan. daripada للمقارنة بـ lebih.
      ar: sama تقترن بـ dengan، وdaripada للمقارنة مع lebih.
      en: sama pairs with dengan; daripada goes with lebih.
    words: [sama, dengan]
  - id: e03
    type: listen
    text: Adik saya setinggi saya.
    options: ["Adik saya tidak setinggi saya.", "Adik saya lebih tinggi daripada saya.", "Adik saya setinggi saya."]
    answer: 2
    words: [setinggi]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: البياع بيسألك عايز الأحمر ولا الأزرق، وإنت مش فارق معاك. ترد بإيه؟
      ar: يسألك البائع أتريد الأحمر أم الأزرق، ولا فرق عندك. بماذا تردّ؟
      en: The seller asks red or blue, and you don't mind. What do you answer?
    options: ["Tidak sama.", "Sama dengan.", "Sama saja."]
    answer: 2
    words: [sama saja]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «الأسعار هنا مش غالية قد كوتا» — أنهي جملة؟
      ar: «الأسعار هنا ليست مرتفعة كما في كوتا» — أيّ جملة؟
      en: '"Prices here aren''t as high as in Kuta" — which sentence?'
    options: ["Harga di sini tidak semahal di Kuta.", "Harga di sini semahal di Kuta.", "Harga di sini lebih mahal daripada di Kuta."]
    answer: 0
    words: [semahal, harga]
  - id: e06
    type: fill_blank
    sentence: Kain ini sama bagusnya ___ kain itu.
    meaning:
      ar_eg: القماشة دي حلوة زي دي بالظبط.
      ar: هذا القماش جميل كذاك القماش.
      en: This cloth is just as nice as that one.
    options: ["daripada", "seperti", "dengan"]
    answers: [dengan]
    words: [sama, dengan, kain]
  - id: e07
    type: fill_blank
    sentence: Patung ini ___ patung itu, dua ratus ribu.
    meaning:
      ar_eg: (اكتب كلمة واحدة بـ se-) التمثال ده غالي قد التمثال ده، ميتين ألف.
      ar: (اكتب كلمة واحدة بـ se-) هذا التمثال غالٍ كذاك، مئتا ألف.
      en: (Type one se- word.) This statue is as expensive as that one, two hundred thousand.
    answers: [semahal]
    words: [semahal]
  - id: e08
    type: fill_blank
    sentence: Ukurannya ___ dengan yang kemarin.
    meaning:
      ar_eg: المقاس نفس بتاع امبارح.
      ar: المقاس نفسه كالذي أمس.
      en: The size is the same as yesterday's.
    answers: [sama]
    words: [sama, ukuran]
  - id: e09
    type: build_sentence
    source:
      ar_eg: أخويا الصغير طولي.
      ar: أخي الأصغر بطولي.
      en: My younger brother is as tall as me.
    answer: Adik saya setinggi saya.
    distractors: [lebih, daripada]
    words: [setinggi]
  - id: e10
    type: build_sentence
    source:
      ar_eg: الشنطتين دول غاليين زي بعض.
      ar: هاتان الحقيبتان غاليتان بالقدر نفسه.
      en: These two bags are equally expensive.
    answer: Dua tas ini sama mahalnya.
    distractors: [paling, lebih]
    words: [sama, tas]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لونها نفس لون الشنطة بتاعتي.
      ar: لونها مثل لون حقيبتي.
      en: The colour is the same as my bag.
    answers:
      - Warnanya sama dengan tas saya.
      - Warnanya sama dengan tas saya
      - Warnanya sama dengan warna tas saya.
      - Warnanya sama dengan tasku.
    words: [warna, sama]
  - id: e12
    type: translate
    direction: from_target
    source_text: Harga di Sukawati tidak semahal di Kuta.
    answers_meaning:
      ar_eg: ["الأسعار في سوكاواتي مش غالية قد كوتا", "الأسعار في سوكاواتي أرخص من كوتا"]
      ar: ["الأسعار في سوكاواتي ليست مرتفعة كما في كوتا", "الأسعار في سوكاواتي ليست غالية مثل كوتا"]
      en: ["Prices in Sukawati aren't as high as in Kuta.", "Sukawati isn't as expensive as Kuta.", "Prices in Sukawati are not as expensive as in Kuta."]
    words: [semahal]
  - id: e13
    type: dictation
    text: Mau yang mana? Sama saja.
    meaning:
      ar_eg: عايز أنهي؟ كله واحد.
      ar: أيها تريد؟ سيّان.
      en: Which one do you want? It's all the same.
    words: [sama saja]
  - id: e14
    type: speaking
    text: Kain ini sama bagusnya dengan kain itu, tapi lebih murah.
    meaning:
      ar_eg: القماشة دي حلوة زي دي بالظبط، بس أرخص.
      ar: هذا القماش جميل كذاك تمامًا، لكنه أرخص.
      en: This cloth is just as nice as that one, but cheaper.
    words: [sama, dengan, lebih]
dialogue:
  title: Dua kain batik
  lines:
    - speaker: Mohamed
      text: Ni Luh, mana yang lebih bagus, kain merah atau kain biru?
      ar_eg: يا ني لوه، أنهي أحلى، القماشة الحمرا ولا الزرقا؟
      ar: يا ني لوه، أيهما أجمل، القماش الأحمر أم الأزرق؟
      en: Ni Luh, which is nicer, the red cloth or the blue one?
    - speaker: Ni Luh
      text: Hmm, sama saja. Kain merah sama bagusnya dengan kain biru.
      ar_eg: همم، كله واحد. الحمرا حلوة زي الزرقا بالظبط.
      ar: همم، سيّان. الأحمر جميل كالأزرق تمامًا.
      en: Hmm, they're the same. The red one is just as nice as the blue one.
    - speaker: Mohamed
      text: Harganya juga sama?
      ar_eg: وسعرهم كمان زي بعض؟
      ar: وهل سعرهما واحد أيضًا؟
      en: Is the price the same too?
    - speaker: Ni Luh
      text: Ya, dua-duanya seratus ribu. Tapi ukurannya tidak sama.
      ar_eg: أيوه، الاتنين بمية ألف. بس المقاس مش زي بعض.
      ar: نعم، كلاهما بمئة ألف، لكن المقاس مختلف.
      en: Yes, both are a hundred thousand. But the size isn't the same.
    - speaker: Mohamed
      text: Yang biru lebih besar. Saya beli yang biru!
      ar_eg: الزرقا أكبر. هشتري الزرقا!
      ar: الأزرق أكبر. سأشتري الأزرق!
      en: The blue one is bigger. I'll take the blue one!
