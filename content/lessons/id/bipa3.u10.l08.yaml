schema: kabar.lesson/v1
id: bipa3.u10.l08
language: id
title: Pengumuman di pelabuhan
can_do:
  ar_eg: تسمع إعلان في الميناء وتفهم المعدّية طالعة إمتى وتعمل إيه.
  ar: أن تستمع إلى إعلان في الميناء وتفهم موعد إقلاع العبّارة وما عليك فعله.
  en: Catch the times and instructions in a ferry-port announcement.
slides:
  - title: Di Pelabuhan Kayangan
    grammar: id.time.future-plans
    body:
      ar_eg: |
        محمد ومَس ريزال في ميناء كايانجان في لابوهان لومبوك، والسماعات بتعلن عن المعدّيات. الدرس ده للسمع الأول.
        دوّر على: المعدّية لپوتوتانو طالعة الساعة كام؟ الركاب يعملوا إيه؟ وإيه اللي اتملى، والجاية إمتى؟
        وخد بالك من akan وsebentar lagi للمستقبل.
      ar: |
        محمد والأخ ريزال في ميناء كايانغان في لابوهان لومبوك، ومكبّرات الصوت تعلن عن العبّارات. هذا الدرس للاستماع أولًا.
        ابحث عن: متى تُقلع العبّارة إلى بوتوتانو؟ ماذا يفعل الركّاب؟ وما الرحلة الممتلئة، ومتى التالية؟
        ولاحظ akan وsebentar lagi للمستقبل.
      en: |
        Mohamed and Mas Rizal are at Kayangan port in Labuhan Lombok, and the loudspeakers are announcing ferries. This lesson is listening first.
        Listen for: when does the ferry to Pototano leave? What should passengers do? Which one is full, and when is the next?
        Notice akan and sebentar lagi for the future.
    examples:
      - text: Perhatian, perhatian! Kapal feri tujuan Pototano akan berangkat sebentar lagi, pukul dua belas siang.
        ar_eg: انتباه، انتباه! المعدّية المتجهة لپوتوتانو هتطلع كمان شوية، الساعة اتناشر الضهر.
        ar: انتباه، انتباه! ستُقلع العبّارة المتّجهة إلى بوتوتانو بعد قليل، الساعة الثانية عشرة ظهرًا.
        en: Attention, attention! The ferry to Pototano will depart shortly, at twelve noon.
      - text: Para penumpang harap segera naik ke kapal dan siapkan tiket Anda.
        ar_eg: نرجو من السادة الركاب يطلعوا المركب حالًا ويجهّزوا التذاكر.
        ar: نرجو من الركّاب الصعود إلى العبّارة فورًا وتجهيز تذاكرهم.
        en: Passengers, please board the ship now and have your tickets ready.
      - text: Feri pukul dua siang sudah penuh. Keberangkatan selanjutnya pukul empat sore.
        ar_eg: معدّية الساعة اتنين الضهر اتملت. الرحلة اللي بعدها الساعة أربعة العصر.
        ar: عبّارة الساعة الثانية ظهرًا ممتلئة. الرحلة التالية في الساعة الرابعة عصرًا.
        en: The two o'clock ferry is full. The next departure is at four in the afternoon.
exercises:
  - id: e01
    type: listen
    text: Perhatian, perhatian! Kapal feri tujuan Pototano akan berangkat sebentar lagi, pukul dua belas siang.
    question:
      ar_eg: المعدّية لپوتوتانو طالعة الساعة كام؟
      ar: متى تُقلع العبّارة إلى بوتوتانو؟
      en: When does the ferry to Pototano leave?
    options: ["Pukul dua belas siang.", "Pukul dua siang.", "Pukul empat sore."]
    answer: 0
    meaning:
      ar_eg: انتباه، انتباه! المعدّية المتجهة لپوتوتانو هتطلع كمان شوية، الساعة اتناشر الضهر.
      ar: انتباه، انتباه! ستُقلع العبّارة المتّجهة إلى بوتوتانو بعد قليل، الساعة الثانية عشرة ظهرًا.
      en: Attention, attention! The ferry to Pototano will depart shortly, at twelve noon.
    words: [berangkat, sebentar lagi, feri]
  - id: e02
    type: listen
    text: Para penumpang harap segera naik ke kapal dan siapkan tiket Anda.
    question:
      ar_eg: الركاب المفروض يعملوا إيه؟
      ar: ماذا ينبغي أن يفعل الركّاب؟
      en: What should the passengers do?
    options: ["Membeli tiket di loket.", "Naik ke kapal dan menyiapkan tiket.", "Menunggu sampai sore."]
    answer: 1
    meaning:
      ar_eg: نرجو من السادة الركاب يطلعوا المركب حالًا ويجهّزوا التذاكر.
      ar: نرجو من الركّاب الصعود إلى العبّارة فورًا وتجهيز تذاكرهم.
      en: Passengers, please board the ship now and have your tickets ready.
    words: [penumpang]
  - id: e03
    type: listen
    text: Feri pukul dua siang sudah penuh.
    options: ["Feri pukul dua belas sudah penuh.", "Feri pukul dua siang masih ada.", "Feri pukul dua siang sudah penuh."]
    answer: 2
    meaning:
      ar_eg: معدّية الساعة اتنين الضهر اتملت.
      ar: عبّارة الساعة الثانية ظهرًا ممتلئة.
      en: The two o'clock ferry is full.
    words: [penuh]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: محمد فاتته معدّية الساعة اتناشر. يقدر ياخد معدّية الساعة كام؟
      ar: فاتت محمدًا عبّارة الثانية عشرة. في أيّ ساعة يستطيع أن يركب؟
      en: Mohamed missed the twelve o'clock ferry. Which one can he still take?
    options: ["Pukul dua siang.", "Pukul dua belas malam.", "Pukul empat sore."]
    answer: 2
    explain:
      ar_eg: معدّية الساعة اتنين «sudah penuh» (اتملت)، فالجاية هي «pukul empat sore».
      ar: عبّارة الثانية «sudah penuh» (ممتلئة)، فالتالية هي «pukul empat sore».
      en: The two o'clock ferry is "sudah penuh" (full), so the next is "pukul empat sore".
    words: [penuh, keberangkatan]
  - id: e05
    type: match_pairs
    pairs:
      - text: tujuan
        ar_eg: متجه لـ، وجهة
        ar: الوجهة
        en: destination, bound for
      - text: penumpang
        ar_eg: راكب
        ar: راكب
        en: passenger
      - text: keberangkatan
        ar_eg: قيام الرحلة
        ar: المغادرة
        en: departure
      - text: penuh
        ar_eg: مليان، اتملى
        ar: ممتلئ
        en: full
      - text: sebentar lagi
        ar_eg: كمان شوية
        ar: بعد قليل
        en: soon, shortly
    words: [penumpang, keberangkatan, penuh, sebentar lagi]
  - id: e06
    type: multiple_choice
    question: Kapal feri ___ Pototano akan berangkat pukul dua belas.
    options: [tujuan, keberangkatan, penumpang]
    answer: 0
    explain:
      ar_eg: feri tujuan Pototano = المعدّية المتجهة لپوتوتانو. ده التعبير اللي بتسمعه في الإعلانات.
      ar: feri tujuan Pototano أي العبّارة المتّجهة إلى بوتوتانو، وهي العبارة المعتادة في الإعلانات.
      en: feri tujuan Pototano = the ferry bound for Pototano, the usual wording in announcements.
    words: [feri]
  - id: e07
    type: fill_blank
    sentence: Sebentar lagi kapal feri ___ berangkat.
    meaning:
      ar_eg: كمان شوية المعدّية هتطلع.
      ar: بعد قليل ستُقلع العبّارة.
      en: The ferry will leave shortly.
    options: [akan, tadi, sedang]
    answers: [akan]
    explain:
      ar_eg: sebentar lagi = في المستقبل القريب، فبنستعمل akan. tadi للي فات من شوية، وsedang للي بيحصل دلوقتي.
      ar: sebentar lagi تدلّ على المستقبل القريب، لذلك akan. أمّا tadi فلما مضى قبل قليل، وsedang لما يحدث الآن.
      en: sebentar lagi points to the near future, so akan. tadi is for earlier today, sedang for what's happening now.
    words: [sebentar lagi, berangkat]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الرحلة اللي بعدها الساعة أربعة العصر.
      ar: الرحلة التالية في الساعة الرابعة عصرًا.
      en: The next departure is at four in the afternoon.
    answer: Keberangkatan selanjutnya pukul empat sore.
    distractors: [penuh, tujuan]
    words: [keberangkatan]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المعدّية لپوتوتانو هتطلع كمان شوية.
      ar: ستُقلع العبّارة إلى بوتوتانو بعد قليل.
      en: The ferry to Pototano will leave shortly.
    answers:
      - Feri ke Pototano akan berangkat sebentar lagi.
      - Feri ke Pototano akan berangkat sebentar lagi
      - Kapal feri ke Pototano akan berangkat sebentar lagi.
      - Kapal feri ke Pototano akan berangkat sebentar lagi
      - Feri tujuan Pototano akan berangkat sebentar lagi.
      - Kapal feri tujuan Pototano akan berangkat sebentar lagi.
      - Sebentar lagi feri ke Pototano akan berangkat.
      - Sebentar lagi kapal feri ke Pototano akan berangkat.
      - Sebentar lagi feri tujuan Pototano akan berangkat.
      - Sebentar lagi kapal feri tujuan Pototano akan berangkat.
      - Feri ke Pototano sebentar lagi berangkat.
      - Sebentar lagi feri ke Pototano berangkat.
    words: [feri, berangkat, sebentar lagi]
dialogue:
  title: Terlambat sedikit
  lines:
    - speaker: Mas Rizal
      text: Dengar! Feri tujuan Pototano akan berangkat sebentar lagi.
      ar_eg: اسمع! المعدّية لپوتوتانو هتطلع كمان شوية.
      ar: اسمع! ستُقلع العبّارة إلى بوتوتانو بعد قليل.
      en: Listen! The ferry to Pototano leaves shortly.
    - speaker: Mohamed
      text: Tapi kita belum punya tiket! Ayo, cepat ke loket.
      ar_eg: بس إحنا لسه ما معناش تذاكر! يلا بسرعة على الشباك.
      ar: لكن ليست معنا تذاكر بعد! هيّا بسرعة إلى الشبّاك.
      en: But we don't have tickets yet! Quick, to the ticket window.
    - speaker: Petugas
      text: Maaf, Pak. Feri jam dua belas dan jam dua sudah penuh.
      ar_eg: آسف يا فندم. معدّية اتناشر ومعدّية اتنين اتملوا.
      ar: آسف يا سيدي. عبّارتا الثانية عشرة والثانية ممتلئتان.
      en: Sorry, sir. The twelve o'clock and two o'clock ferries are full.
    - speaker: Mohamed
      text: Jadi, keberangkatan selanjutnya jam empat sore? Dua tiket, ya.
      ar_eg: يعني الرحلة الجاية الساعة أربعة العصر؟ تذكرتين لو سمحت.
      ar: إذن الرحلة التالية في الرابعة عصرًا؟ تذكرتان من فضلك.
      en: So the next departure is at four? Two tickets, please.
    - speaker: Mas Rizal
      text: Tidak apa-apa. Nanti siang kita makan ikan bakar dulu!
      ar_eg: ولا يهمك. الضهر ناكل سمك مشوي الأول!
      ar: لا بأس. سنأكل سمكًا مشويًّا عند الظهر أولًا!
      en: No problem. We'll have grilled fish at lunchtime first!
