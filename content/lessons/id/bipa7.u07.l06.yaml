schema: kabar.lesson/v1
id: bipa7.u07.l06
language: id
title: Kebebasan pers
can_do:
  ar_eg: تتكلّم عن حرية الصحافة في إندونيسيا وتعرف حقّك في الردّ على خبر غلط.
  ar: أن تتحدّث عن حرّية الصحافة في إندونيسيا وتعرف حقّك في الردّ على خبر خاطئ.
  en: Discuss press freedom in Indonesia and know your right of reply to a wrong story.
slides:
  - title: Dari bredel ke Dewan Pers
    body:
      ar_eg: |
        في عصر الـ Orde Baru الحكومة كانت بتعمل sensor (رقابة) وكانت بتقفل الجرايد: مجلة Tempo اتقفلت سنة ١٩٩٤.
        بعد الإصلاح جه قانون الصحافة رقم ٤٠ لسنة ١٩٩٩، وضمن الـ kebebasan pers (حرية الصحافة).
        - Dewan Pers = مجلس الصحافة: هيئة مستقلّة بتحمي حرية الصحافة وبتحكم في الشكاوى.
        - hak jawab = حق الردّ: لو جرنال كتب عنك حاجة غلط، من حقّك يطلع ردّك.
        الحرية جاية معاها مسؤولية: الصحفي لازم يتأكّد ويسمع الطرفين.
      ar: |
        في عهد الـ Orde Baru مارست الحكومة الـ sensor (الرقابة) وأغلقت الصحف، فقد أُغلقت مجلّة Tempo سنة ١٩٩٤.
        وبعد الإصلاح صدر قانون الصحافة رقم ٤٠ لسنة ١٩٩٩ فكفل الـ kebebasan pers (حرّية الصحافة).
        - Dewan Pers = مجلس الصحافة، هيئة مستقلّة تحمي حرّية الصحافة وتفصل في الشكاوى.
        - hak jawab = حقّ الردّ: إن نشرت صحيفة عنك خطأً فمن حقّك نشر ردّك.
        والحرّية تقترن بالمسؤولية: على الصحفيّ أن يتحقّق ويسمع الطرفين.
      en: |
        Under the Orde Baru the government used sensor (censorship) and shut papers down: Tempo magazine was banned in 1994.
        After the reforms came Press Law No. 40 of 1999, which guaranteed kebebasan pers (press freedom).
        - Dewan Pers = the Press Council, an independent body that protects press freedom and handles complaints.
        - hak jawab = right of reply: if a paper writes something wrong about you, you have the right to have your reply published.
        Freedom comes with responsibility: a journalist must verify and hear both sides.
    examples:
      - text: Kepala dinas itu memakai hak jawab untuk membantah berita kemarin.
        ar_eg: رئيس المصلحة استعمل حق الردّ علشان ينفي خبر امبارح.
        ar: استعمل رئيس الدائرة حقّ الردّ لنفي خبر الأمس.
        en: The department head used the right of reply to rebut yesterday's story.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kebebasan pers
        ar_eg: حرية الصحافة
        ar: حرّية الصحافة
        en: press freedom
      - text: sensor
        ar_eg: رقابة
        ar: رقابة
        en: censorship
      - text: Dewan Pers
        ar_eg: مجلس الصحافة
        ar: مجلس الصحافة
        en: Press Council
      - text: hak jawab
        ar_eg: حق الردّ
        ar: حقّ الردّ
        en: right of reply
      - text: Orde Baru
        ar_eg: النظام الجديد (سوهارتو)
        ar: النظام الجديد
        en: New Order
    words: [kebebasan pers, sensor, Dewan Pers, hak jawab, Orde Baru]
  - id: e02
    type: listen
    text: Majalah Tempo pernah dibredel pada tahun 1994.
    question:
      ar_eg: إيه اللي حصل لمجلة تمبو سنة ١٩٩٤؟
      ar: ماذا حدث لمجلّة تمبو سنة ١٩٩٤؟
      en: What happened to Tempo magazine in 1994?
    options:
      - كسبت جايزة.
      - اتقفلت بأمر الحكومة.
      - فتحت مكتب في مصر.
    answer: 1
    words: [sensor]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: جرنال كتب عنك معلومة غلط. تستعمل إيه؟
      ar: نشرت صحيفة عنك معلومة خاطئة. بمَ تستعين؟
      en: A paper printed false information about you. What do you use?
    options:
      - الـ sensor.
      - الـ tagar.
      - الـ hak jawab.
    answer: 2
    words: [hak jawab]
  - id: e04
    type: fill_blank
    sentence: Wartawan boleh mengadu ke ___ jika kebebasannya dilanggar.
    meaning:
      ar_eg: الصحفي يقدر يشتكي لمجلس الصحافة لو حريته اتنتهكت.
      ar: يحقّ للصحفيّ الشكوى إلى مجلس الصحافة إن انتُهكت حرّيته.
      en: A journalist may complain to the Press Council if their freedom is violated.
    options: [Dewan Pers, Orde Baru, hak jawab]
    answers: [Dewan Pers]
    words: [Dewan Pers]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي قانون ضمن حرية الصحافة؟
      ar: أيّ قانون كفل حرّية الصحافة؟
      en: Which law guaranteed press freedom?
    options:
      - القانون رقم ٤٠ لسنة ١٩٩٩.
      - قانون الـ VOC.
      - إعلان الاستقلال ١٩٤٥.
    answer: 0
    words: [kebebasan pers]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الرقابة بتسكّت الصحفيين.
      ar: الرقابة تُخرس الصحفيين.
      en: Censorship silences journalists.
    answer: Sensor membungkam para wartawan.
    distractors: [hak, jawab]
    words: [sensor]
  - id: e07
    type: translate
    direction: from_target
    source_text: Kebebasan pers bukan kebebasan untuk menyebarkan hoaks.
    answers_meaning:
      ar_eg:
        - حرية الصحافة مش حرية إنك تنشر إشاعات.
        - حرية الصحافة ماتعنيش إنك تنشر أخبار كدب.
      ar:
        - ليست حرّية الصحافة حرّيةً لنشر الشائعات.
        - حرّية الصحافة لا تعني حرّية نشر الأكاذيب.
      en:
        - Press freedom is not freedom to spread hoaxes.
        - Freedom of the press doesn't mean freedom to spread fake news.
    words: [kebebasan pers, hoaks]
  - id: e08
    type: speaking
    text: Setelah reformasi, Dewan Pers menjadi lembaga yang independen.
    meaning:
      ar_eg: بعد الإصلاح، مجلس الصحافة بقى هيئة مستقلّة.
      ar: بعد الإصلاح صار مجلس الصحافة هيئة مستقلّة.
      en: After the reforms, the Press Council became an independent body.
    words: [Dewan Pers]
  - id: e09
    type: dictation
    text: Setiap orang punya hak jawab atas berita tentang dirinya.
    meaning:
      ar_eg: كل واحد ليه حق الردّ على أي خبر عنه.
      ar: لكلّ شخص حقّ الردّ على ما يُنشر عنه.
      en: Everyone has a right of reply to news about themselves.
    words: [hak jawab]
  - id: e10
    type: speaking
    text: Pada masa Orde Baru, sensor membuat banyak berita tidak pernah terbit.
    meaning:
      ar_eg: في عصر النظام الجديد، الرقابة خلّت أخبار كتير ماتطلعش خالص.
      ar: في عهد النظام الجديد حالت الرقابة دون نشر أخبار كثيرة.
      en: Under the New Order, censorship meant many stories were never published.
    words: [Orde Baru, sensor, kebebasan pers]
dialogue:
  title: Telepon yang marah
  lines:
    - speaker: Bu Debora
      text: Mohamed, kepala dinas menelepon. Dia marah dengan beritamu tentang jalan rusak.
      ar_eg: يا محمد، رئيس المصلحة اتّصل. زعلان من خبرك عن الطريق البايظ.
      ar: يا محمد، اتّصل رئيس الدائرة، وهو غاضب من خبرك عن الطريق المتضرّر.
      en: Mohamed, the department head called. He's angry about your broken-road story.
    - speaker: Mohamed
      text: Apakah beritanya salah, Bu? Saya sudah wawancara warga dan melihat sendiri.
      ar_eg: الخبر غلط يا أبلة؟ أنا عملت مقابلات مع الأهالي وشفت بنفسي.
      ar: أكان الخبر خاطئًا؟ لقد قابلت السكّان ورأيت بنفسي.
      en: Was the story wrong, Bu? I interviewed residents and saw it myself.
    - speaker: Bu Debora
      text: Faktanya benar. Tapi kita lupa meminta tanggapan dinas. Berikan dia hak jawab besok.
      ar_eg: الحقايق صح. بس نسينا ناخد رأي المصلحة. اديله حق الردّ بكرة.
      ar: الوقائع صحيحة، لكنّنا نسينا أخذ ردّ الدائرة، فامنحه حقّ الردّ غدًا.
      en: The facts are right. But we forgot to ask the department to respond. Give him his right of reply tomorrow.
    - speaker: Mohamed
      text: Baik. Kebebasan pers juga berarti adil kepada semua pihak.
      ar_eg: حاضر. حرية الصحافة معناها كمان العدل مع كل الأطراف.
      ar: حسنًا. فحرّية الصحافة تعني أيضًا الإنصاف لكلّ الأطراف.
      en: Okay. Press freedom also means being fair to every side.
