schema: kabar.lesson/v1
id: bipa5.u08.l12
language: id
title: Ulangan Unit 8
can_do:
  ar_eg: تقرا مقال رأي وتردّ عليه بأدب وبكلام متوازن.
  ar: أن تقرأ مقالة رأي وتردّ عليها بأدب وتوازن.
  en: Read an opinion piece and answer it politely and in a balanced way.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tampaknya
        ar_eg: يبدو إن
        ar: يبدو أنّ
        en: it seems
      - text: bukti
        ar_eg: دليل
        ar: دليل
        en: evidence
      - text: responden
        ar_eg: المشاركين في الاستطلاع
        ar: المستجيبون
        en: respondents
      - text: tanggapan
        ar_eg: ردّ / تعليق
        ar: ردّ
        en: response
      - text: keberatan
        ar_eg: اعتراض
        ar: اعتراض
        en: objection
    words: [tampaknya, bukti, responden, tanggapan, keberatan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة ألطف؟
      ar: أيّ جملة ألطف؟
      en: Which sentence is gentler?
    options:
      - Data Anda salah.
      - Data itu barangkali kurang lengkap.
      - Data itu bohong.
    answer: 1
    words: [barangkali, kurang tepat]
  - id: e03
    type: fill_blank
    sentence: Anak muda ___ membaca berita di ponsel.
    meaning:
      ar_eg: الشباب بيميلوا يقروا الأخبار على الموبايل.
      ar: يميل الشباب إلى قراءة الأخبار على الهاتف.
      en: Young people tend to read the news on their phones.
    options: [cenderung, sependapat, berimbang]
    answers: [cenderung]
    words: [cenderung]
  - id: e04
    type: listen
    text: Separuh responden mengeluh tentang harga bahan pokok.
    question:
      ar_eg: كام واحد من المشاركين بيشتكوا؟
      ar: كم من المستجيبين يشكون؟
      en: How many respondents are complaining?
    options:
      - التلت.
      - النص.
      - الأغلبية الكبيرة.
    answer: 1
    words: [separuh, mengeluh, bahan pokok]
  - id: e05
    type: build_sentence
    source:
      ar_eg: يبدو إن الكاتب منحاز لطرف واحد.
      ar: يبدو أنّ الكاتب ينحاز إلى طرف واحد.
      en: The writer seems to take one side.
    answer: Tampaknya penulis berpihak pada satu kelompok.
    distractors: [sepakat, sumber]
    words: [tampaknya, berpihak]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا متفق في جزء، بس محتاجين مصدر تاني.
      ar: أتّفق جزئيًّا، لكنّنا نحتاج إلى مصدر آخر.
      en: I partly agree, but we need another source.
    answers:
      - Saya sependapat sebagian, tetapi kita perlu sumber lain.
      - Saya sependapat sebagian, namun kita membutuhkan sumber lain.
      - Saya sependapat sebagian, tapi kita perlu sumber yang lain.
      - Sebagian saya sependapat, tetapi kita perlu sumber lain.
    words: [sependapat, sebagian, sumber]
  - id: e07
    type: match_pairs
    pairs:
      - text: statistik
        ar_eg: إحصائيات
        ar: إحصاءات
        en: statistics
      - text: jurnalis
        ar_eg: صحفي
        ar: صحفي
        en: journalist
      - text: perspektif
        ar_eg: منظور
        ar: منظور
        en: perspective
      - text: sensasi
        ar_eg: إثارة
        ar: إثارة
        en: sensation
      - text: realistis
        ar_eg: واقعي
        ar: واقعي
        en: realistic
    words: [statistik, jurnalis, perspektif, sensasi, realistis]
  - id: e08
    type: listen
    text: Barangkali editor itu enggan memuat skandal tanpa bukti.
    question:
      ar_eg: مش عايز ينشر ليه؟
      ar: لماذا يتردّد في النشر؟
      en: Why is he reluctant to publish?
    options: [من غير دليل, عشان الفلوس, عشان الوقت]
    answer: 0
    meaning:
      ar_eg: يمكن المحرر ده مش عايز ينشر الفضيحة من غير دليل.
      ar: ربما يتردّد ذلك المحرّر في نشر الفضيحة دون دليل.
      en: Perhaps that editor is reluctant to run the scandal without proof.
    words: [editor, enggan, skandal]
  - id: e09
    type: dictation
    text: Hasil survei itu tampaknya kurang berimbang.
    meaning:
      ar_eg: نتيجة الاستطلاع ده يبدو إنها مش متوازنة قوي.
      ar: يبدو أنّ نتيجة ذلك الاستطلاع غير متوازنة تمامًا.
      en: That survey's results seem not quite balanced.
    words: [hasil, berimbang]
  - id: e10
    type: speaking
    text: Itu fakta, tetapi pada umumnya debat seperti ini tidak ada pemenangnya.
    meaning:
      ar_eg: دي حقيقة، بس في الغالب النقاش اللي زي ده مافيهوش حد كسبان.
      ar: هذه حقيقة، لكنّ مثل هذه المناظرة لا فائز فيها في الغالب.
      en: That's a fact, but generally a debate like this has no winner.
    words: [fakta, pada umumnya, debat]
  - id: e11
    type: fill_blank
    sentence: 'Penulis itu tidak ___: dia tahu politik itu rumit.'
    meaning:
      ar_eg: 'الكاتب ده مش ___: عارف إن السياسة معقدة.'
      ar: 'ليس ذلك الكاتب ___: يعلم أن السياسة معقّدة.'
      en: 'That writer isn''t ___: he knows politics is complicated.'
    options: [naif, minimum, tayang]
    answers: [naif]
    words: [naif, minimum, tayang]
  - id: e12
    type: multiple_choice
    question: Anggaran itu berjumlah dua ___ rupiah, bukan dua juta.
    options: [kadar, triliun, forum]
    answer: 1
    explain:
      ar_eg: triliun = تريليون.
      ar: triliun = تريليون.
      en: triliun = trillion.
    words: [kadar, triliun, forum, berjumlah]
dialogue:
  title: Batu yang terakhir
  lines:
    - speaker: Pak Hendra
      text: Jadi, Mohamed, menurut koran, harga permata Martapura terlalu mahal. Bagaimana pendapatmu?
      ar_eg: ها يا محمد، الجرنال بيقول أسعار أحجار مارتابورا غالية قوي. إيه رأيك؟
      ar: إذن يا محمد، تقول الصحيفة إنّ أحجار مارتابورا غالية جدًّا. ما رأيك؟
      en: So, Mohamed, the paper says Martapura gems are too expensive. What do you think?
    - speaker: Mohamed
      text: Saya sependapat sebagian, Pak. Tetapi penulisnya hanya bertanya kepada dua puluh responden.
      ar_eg: أنا متفق في جزء يا أستاذ. بس الكاتب سأل عشرين واحد بس.
      ar: أتّفق جزئيًّا يا سيّدي، لكنّ الكاتب لم يسأل إلا عشرين مستجيبًا.
      en: I partly agree, sir. But the writer only asked twenty respondents.
    - speaker: Pak Hendra
      text: Betul. Barangkali harga di sini malah lebih murah daripada di Jakarta.
      ar_eg: مظبوط. يمكن السعر هنا أرخص من جاكرتا كمان.
      ar: صحيح. ربّما الأسعار هنا أرخص من جاكرتا أصلًا.
      en: True. Perhaps prices here are actually cheaper than in Jakarta.
    - speaker: Mohamed
      text: Kalau begitu, saya beli batu ini saja, sebagai kenang-kenangan.
      ar_eg: يبقى خلاص، هاشتري الحجر ده، كتذكار.
      ar: إذن سأشتري هذا الحجر تذكارًا.
      en: In that case, I'll just buy this stone, as a keepsake.
souvenir:
  id: bipa5.u08.souvenir
  title: Pasar Permata Martapura
  note:
    ar_eg: مارتابورا، جنب بانجارماسين، اسمها «مدينة الماس». الناس بيدوّروا على الماس والأحجار في الطين جنب الأنهار بإيديهم، والسوق مليان أحجار كريمة وعقيق وخواتم. وخد بالك، مقالات الرأي الإندونيسي بتلطّف كتير (tampaknya، barangkali)، لأن الهجوم المباشر بيبان قلة ذوق.
    ar: مارتابورا، قرب بانجارماسين، تُلقّب «مدينة الماس». ينقّب الناس بأيديهم عن الماس والأحجار في طين ضفاف الأنهار، وتمتلئ سوقها بالأحجار الكريمة والعقيق والخواتم. ولاحظ أنّ مقالات الرأي الإندونيسية تكثر من التلطيف (tampaknya، barangkali)، فالمواجهة المباشرة تُعدّ فظاظة.
    en: Martapura, near Banjarmasin, is called the "diamond town". People pan by hand for diamonds and gems in the riverside mud, and the market is full of gemstones, agates and rings. Note, too, that Indonesian op-eds hedge a lot (tampaknya, barangkali), because direct confrontation reads as rude.
