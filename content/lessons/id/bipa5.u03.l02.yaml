schema: kabar.lesson/v1
id: bipa5.u03.l02
language: id
title: Ekonomi digital
can_do:
  ar_eg: تقرا مقال طويل عن الاقتصاد الرقمي في إندونيسيا وتطلع منه الفكرة الأساسية.
  ar: أن تقرأ مقالة مطوّلة عن الاقتصاد الرقمي في إندونيسيا وتستخرج فكرتها الرئيسة.
  en: Read a long feature on Indonesia's digital economy and pick out its main idea.
slides:
  - title: Membaca artikel fitur
    body:
      ar_eg: |
        اقرا الفقرة دي:
        Dalam sepuluh tahun terakhir, ekonomi digital Indonesia tumbuh sangat pesat. Ojek daring, dompet digital, dan siaran belanja langsung kini menjadi bagian dari kehidupan sehari-hari. Pertumbuhan ini membuka lapangan kerja baru bagi jutaan anak muda. Namun, para ahli mengingatkan bahwa pekerja aplikasi sering tidak memiliki jaminan kerja.
        الفكرة الأساسية (gagasan utama) غالبًا في أول جملة أو تانيها. والكلمة Namun بتعلن إن فيه جانب تاني.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: pake = pakai، seneng = senang، nggak = tidak.
      ar: |
        اقرأ هذه الفقرة:
        Dalam sepuluh tahun terakhir, ekonomi digital Indonesia tumbuh sangat pesat. Ojek daring, dompet digital, dan siaran belanja langsung kini menjadi bagian dari kehidupan sehari-hari. Pertumbuhan ini membuka lapangan kerja baru bagi jutaan anak muda. Namun, para ahli mengingatkan bahwa pekerja aplikasi sering tidak memiliki jaminan kerja.
        تقع الفكرة الرئيسة (gagasan utama) غالبًا في الجملة الأولى أو الثانية، وتُنبئ Namun بجانب آخر.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: pake = pakai، seneng = senang، nggak = tidak.
      en: |
        Read this paragraph:
        Dalam sepuluh tahun terakhir, ekonomi digital Indonesia tumbuh sangat pesat. Ojek daring, dompet digital, dan siaran belanja langsung kini menjadi bagian dari kehidupan sehari-hari. Pertumbuhan ini membuka lapangan kerja baru bagi jutaan anak muda. Namun, para ahli mengingatkan bahwa pekerja aplikasi sering tidak memiliki jaminan kerja.
        The main idea (gagasan utama) is usually in the first or second sentence; Namun signals the other side.
        The dialogue uses street forms; the formal ones are beside them: pake = pakai, seneng = senang, nggak = tidak.
    examples:
      - text: Pertumbuhan ekonomi digital membuka lapangan kerja baru.
        ar_eg: نمو الاقتصاد الرقمي بيفتح فرص شغل جديدة.
        ar: يفتح نموّ الاقتصاد الرقمي فرص عمل جديدة.
        en: The growth of the digital economy creates new jobs.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pertumbuhan
        ar_eg: نمو
        ar: نموّ
        en: growth
      - text: daring
        ar_eg: أونلاين
        ar: عبر الإنترنت
        en: online
      - text: dompet digital
        ar_eg: محفظة إلكترونية
        ar: محفظة رقمية
        en: e-wallet
      - text: pesat
        ar_eg: سريع جدًا
        ar: سريع جدًّا
        en: rapid
      - text: jaminan
        ar_eg: ضمان
        ar: ضمان
        en: guarantee, security
    words: [pertumbuhan, daring, dompet digital, pesat, jaminan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الفكرة الأساسية للفقرة؟
      ar: ما الفكرة الرئيسة للفقرة؟
      en: What is the paragraph's main idea?
    options:
      - إن المحافظ الإلكترونية خطر.
      - إن الاقتصاد الرقمي في إندونيسيا بينمو بسرعة، بس فيه مشاكل للعمال.
      - إن الشباب مش لاقيين شغل.
    answer: 1
    words: [pertumbuhan, pesat]
    explain:
      ar_eg: الفقرة بتقول الاقتصاد الرقمي بينمو بسرعة وفيه مشاكل للعمال. خطر المحافظ وبطالة الشباب تفاصيل مش الفكرة الأساسية.
      ar: تذكر الفقرة نموّ الاقتصاد الرقمي السريع ومشكلات العمّال. أما خطر المحافظ وبطالة الشباب فليسا الفكرة الرئيسة.
      en: The paragraph is about fast digital growth with problems for workers. Wallet risks and youth unemployment aren't its main idea.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الخبرا بيحذروا من إيه؟
      ar: مِمّ يحذّر الخبراء؟
      en: What do the experts warn about?
    options:
      - إن عمال التطبيقات غالبًا مالهمش ضمان شغل.
      - إن الموتوسيكلات كتير.
      - إن البيع المباشر بطيء.
    answer: 0
    words: [jaminan]
    explain:
      ar_eg: الخبرا بيحذروا إن عمال التطبيقات مالهمش jaminan (ضمان). كتر الموتوسيكلات وبطء البيع مااتقالوش.
      ar: يحذّر الخبراء من أنّ عمّال التطبيقات بلا jaminan (ضمان)، ولم يُذكر كثرة الدرّاجات ولا بطء البيع.
      en: The experts warn app workers lack jaminan (security). Too many motorbikes or slow live selling aren't mentioned.
  - id: e04
    type: fill_blank
    sentence: Banyak orang membayar ojek dengan ___ digital.
    meaning:
      ar_eg: ناس كتير بتدفع للأوجيك بالمحفظة الإلكترونية.
      ar: يدفع كثيرون أجرة الدراجة بالمحفظة الرقمية.
      en: Many people pay for their ride with an e-wallet.
    options: [dompet, jaminan, pertumbuhan]
    answers: [dompet]
    words: [dompet digital]
    explain:
      ar_eg: dompet digital = محفظة إلكترونية. jaminan = ضمان وpertumbuhan = نمو، ومحدش بيدفع بيهم.
      ar: dompet digital = المحفظة الرقمية. أما jaminan فالضمان، وpertumbuhan النموّ، ولا يُدفع بهما.
      en: dompet digital is an e-wallet. jaminan (security) and pertumbuhan (growth) aren't ways to pay.
  - id: e05
    type: listen
    text: Saya selalu belanja daring karena lebih mudah.
    question:
      ar_eg: المتكلم بيشتري إزاي؟
      ar: كيف يتسوّق المتكلّم؟
      en: How does the speaker shop?
    options:
      - في السوق بس.
      - بالتليفون مع البياع.
      - أونلاين، عشان أسهل.
    answer: 2
    words: [daring]
  - id: e06
    type: translate
    direction: from_target
    source_text: Ekonomi digital Indonesia tumbuh dengan pesat.
    answers_meaning:
      ar_eg:
        - الاقتصاد الرقمي في إندونيسيا بينمو بسرعة كبيرة.
        - الاقتصاد الرقمي الإندونيسي بيكبر بسرعة.
      ar:
        - ينمو الاقتصاد الرقمي الإندونيسي بسرعة كبيرة.
        - ينمو الاقتصاد الرقمي في إندونيسيا نموًّا سريعًا.
      en:
        - Indonesia's digital economy is growing rapidly.
        - Indonesia's digital economy is growing fast.
    words: [pesat]
  - id: e07
    type: build_sentence
    source:
      ar_eg: عمال التطبيقات محتاجين ضمانات.
      ar: يحتاج عمّال التطبيقات إلى ضمانات.
      en: App workers need protection.
    answer: Pekerja aplikasi membutuhkan jaminan.
    distractors: [daring, pesat]
    words: [jaminan]
    explain:
      ar_eg: «محتاجين ضمانات» = membutuhkan jaminan. daring = أونلاين وpesat = سريع، مالهمش مكان.
      ar: «يحتاجون إلى ضمانات» = membutuhkan jaminan. أما daring فـ«عبر الإنترنت»، وpesat «سريع»، ولا موضع لهما.
      en: "\"Need protection\" is membutuhkan jaminan. daring (online) and pesat (rapid) don't fit."
  - id: e08
    type: dictation
    text: Pertumbuhan belanja daring sangat pesat.
    meaning:
      ar_eg: نمو الشرا أونلاين سريع جدًا.
      ar: نموّ التسوّق الإلكتروني سريع جدًّا.
      en: The growth of online shopping is very rapid.
    words: [pertumbuhan, daring, pesat]
  - id: e09
    type: speaking
    text: Saya membayar dengan dompet digital.
    meaning:
      ar_eg: أنا بدفع بالمحفظة الإلكترونية.
      ar: أدفع بالمحفظة الرقمية.
      en: I pay with an e-wallet.
    words: [dompet digital]
dialogue:
  title: Naik ojek daring di Samarinda
  lines:
    - speaker: Mohamed
      text: Pak, saya bayar pake dompet digital, ya.
      ar_eg: يا عم، هدفع بالمحفظة الإلكترونية.
      ar: يا أخي، سأدفع بالمحفظة الرقمية.
      en: I'll pay with an e-wallet, okay?
    - speaker: Pak Hendra
      text: Boleh, Mas. Sekarang hampir semua penumpang bayarnya daring.
      ar_eg: ماشي. دلوقتي تقريبًا كل الركاب بيدفعوا أونلاين.
      ar: لا بأس. يدفع كلّ الركّاب تقريبًا عبر الإنترنت الآن.
      en: Sure. Nowadays almost every passenger pays online.
    - speaker: Mohamed
      text: Bapak seneng kerja di aplikasi?
      ar_eg: حضرتك مبسوط بالشغل على التطبيق؟
      ar: هل تحبّ العمل عبر التطبيق؟
      en: Do you like working through the app?
    - speaker: Pak Hendra
      text: Penghasilannya lumayan, tapi nggak ada jaminan kalau saya sakit.
      ar_eg: الدخل كويس، بس مفيش ضمان لو عيّيت.
      ar: الدخل لا بأس به، لكن لا ضمان إن مرضت.
      en: The income is decent, but there's no security if I get sick.
new_words:
  - word: pertumbuhan
    pos: noun
    ar_eg: نمو
    ar: نموّ
    en: growth
  - word: dompet digital
    ar_eg: محفظة إلكترونية
    ar: محفظة رقمية
    en: e-wallet
  - word: pesat
    pos: adjective
    ar_eg: سريع جدًا (للنمو)
    ar: سريع جدًّا (للنموّ)
    en: rapid (of growth)
  - word: jaminan
    pos: noun
    ar_eg: ضمان
    ar: ضمان
    en: guarantee, security
review:
  status: draft
  verified: false
