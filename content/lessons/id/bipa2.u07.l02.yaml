schema: kabar.lesson/v1
id: bipa2.u07.l02
language: id
title: Berkacamata, bertopi
can_do:
  ar_eg: تستعمل ber- للبس والامتلاك والمشاعر.
  ar: أن تستعمل ber- للارتداء والامتلاك والمشاعر.
  en: Use ber- for wearing, having and feeling.
slides:
  - title: Berkacamata, bertopi
    body:
      ar_eg: |
        ber- + حاجة بتلبسها أو عندك = «لابس / عنده»، زي «أبو نضارة» بالمصري:
        - kacamata → berkacamata = لابس نضارة
        - topi → bertopi = لابس كاب / برنيطة
        - baju → berbaju merah = لابس أحمر
        وبتيجي كتير مع yang عشان تحدد شخص: orang yang berkacamata itu = اللي لابس نضارة ده.
      ar: |
        ber- + ملبوس أو مملوك = «يلبس / ذو»:
        - kacamata → berkacamata = يلبس نظارة
        - topi → bertopi = يلبس قبعة
        - baju → berbaju merah = يلبس الأحمر
        وتكثر مع yang لتعيين شخص: orang yang berkacamata itu = صاحب النظارة ذاك.
      en: |
        ber- + something you wear or have = "wearing / with", like Arabic «ذو» (Egyptians say «أبو نضارة»):
        - kacamata → berkacamata = wearing glasses
        - topi → bertopi = wearing a cap / hat
        - baju → berbaju merah = wearing red
        Often with yang to pick someone out: orang yang berkacamata itu = the person in glasses.
    grammar: id.prefix.ber.meanings
    examples:
      - text: Orang yang berkacamata itu pelatih kami.
        ar_eg: اللي لابس نضارة ده المدرّب بتاعنا.
        ar: صاحب النظارة ذاك مدرّبنا.
        en: The person wearing glasses is our coach.
  - title: Bersuara, bersedih
    body:
      ar_eg: |
        ber- كمان بتعني:
        - بيطلّع / بينتج: suara (صوت) → bersuara = بيطلّع صوت، telur (بيضة) → bertelur = بتبيض.
        - حالة / إحساس: sedih → bersedih = زعلان، gembira → bergembira = فرحان.
        القاعدة الذهبية: ber- + اسم ≈ «صاحب الحاجة دي / معاه الحاجة دي».
      ar: |
        وتفيد ber- أيضًا:
        - الإصدار والإنتاج: suara → bersuara = يُصدر صوتًا، telur → bertelur = تبيض.
        - الحال والشعور: sedih → bersedih = يحزن، gembira → bergembira = يفرح.
        والقاعدة: ber- + اسم ≈ «ذو كذا».
      en: |
        ber- can also mean:
        - Produce: suara (sound) → bersuara = make a sound; telur (egg) → bertelur = lay eggs.
        - Be in a state: sedih → bersedih = be sad; gembira → bergembira = be happy.
        Golden rule: ber- + noun ≈ "having / with that thing".
    grammar: id.prefix.ber.meanings
    examples:
      - text: Jangan bersedih, besok kita main lagi.
        ar_eg: ماتزعلش، بكرة نلعب تاني.
        ar: لا تحزن، سنلعب غدًا مرة أخرى.
        en: Don't be sad, we'll play again tomorrow.
      - text: Anak-anak bergembira di pantai.
        ar_eg: العيال فرحانين على البحر.
        ar: الأطفال فرحون على الشاطئ.
        en: The children are having a happy time on the beach.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: topi
        ar_eg: كاب، برنيطة
        ar: قبعة
        en: cap, hat
      - text: bertopi
        ar_eg: لابس كاب
        ar: يلبس قبعة
        en: wearing a cap
      - text: berbaju
        ar_eg: لابس (هدوم)
        ar: يلبس ثوبًا
        en: wearing (clothes)
      - text: bersuara
        ar_eg: يطلّع صوت
        ar: يُصدر صوتًا
        en: make a sound
      - text: bertelur
        ar_eg: تبيض
        ar: تبيض
        en: lay eggs
      - text: bergembira
        ar_eg: فرحان
        ar: يفرح
        en: be happy
    words: [topi, bertopi, berbaju, bersuara, bertelur, bergembira]
  - id: e02
    type: multiple_choice
    question: Raka dan Rina pergi ke pantai ___.
    question_meaning:
      ar_eg: راكا ورينا راحوا البحر هما الاتنين بس.
      ar: ذهب راكا ورينا إلى الشاطئ وحدهما.
      en: Raka and Rina go to the beach, just the two of them.
    options: [bersedih, bertiga, berdua]
    answer: 2
    words: [berdua]
    explain:
      ar_eg: "ber- + عدد = بالعدد ده مع بعض: berdua = هما الاتنين. bertiga = تلاتة، وbersedih = زعلان."
      ar: "ber- + عدد = معًا بهذا العدد: berdua = اثنان. أما bertiga فثلاثة وbersedih حزين."
      en: "ber- + number = together as that many: berdua = the two of them. bertiga is three, bersedih sad."
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «لابس كاب»؟
      ar: أيّ كلمة تعني «يلبس قبعة»؟
      en: Which word means "wearing a cap"?
    options: [bersuara, bertopi, berkacamata, bergembira]
    answer: 1
    words: [bertopi, bersuara, berkacamata, bergembira]
    explain:
      ar_eg: "ber- + حاجة بتلبسها = لابسها: bertopi = لابس كاب. berkacamata = لابس نضارة، bersuara = عامل صوت، bergembira = فرحان."
      ar: "ber- + ملبوس = يلبسه: bertopi. أما berkacamata فنظارة، bersuara صوت، bergembira فرح."
      en: "ber- + something worn = wearing it: bertopi. berkacamata is glasses, bersuara sound, bergembira joy."
  - id: e04
    type: fill_blank
    sentence: Orang yang ___ itu pelatih kami.
    meaning:
      ar_eg: اللي لابس نضارة ده المدرّب بتاعنا.
      ar: صاحب النظارة ذاك مدرّبنا.
      en: The person wearing glasses is our coach.
    options: [berkacamata, bersuara, bersepeda]
    answers: [berkacamata]
    words: [berkacamata, pelatih]
    explain:
      ar_eg: berkacamata = لابس نضارة (ber- + kacamata). bersuara = عامل صوت، وbersepeda = بيركب عجلة.
      ar: berkacamata = يلبس نظارة. أما bersuara فيُصدر صوتًا وbersepeda يركب دراجة.
      en: berkacamata = wearing glasses. bersuara is making a sound, bersepeda cycling.
  - id: e05
    type: fill_blank
    sentence: Jangan ___, besok kita main lagi.
    meaning:
      ar_eg: ماتزعلش، بكرة نلعب تاني.
      ar: لا تحزن، سنلعب غدًا مرة أخرى.
      en: Don't be sad, we'll play again tomorrow.
    options: [berdua, bergembira, bersedih]
    answers: [bersedih]
    words: [bersedih]
    explain:
      ar_eg: Jangan bersedih = ماتزعلش. bergembira = فرحان، وده عكس المعنى، وberdua = الاتنين.
      ar: Jangan bersedih = لا تحزن. أما bergembira فعكس المعنى وberdua «اثنان».
      en: Jangan bersedih = don't be sad. bergembira is the opposite; berdua means two together.
  - id: e06
    type: fill_blank
    sentence: Ayam itu ___ setiap hari.
    meaning:
      ar_eg: الفرخة دي بتبيض كل يوم.
      ar: تلك الدجاجة تبيض كل يوم.
      en: That hen lays an egg every day.
    options: [berbaju, bertelur, bersepeda]
    answers: [bertelur]
    explain:
      ar_eg: ber- + telur (بيضة) = بتطلّع بيض.
      ar: ber- + telur = تُنتج البيض.
      en: ber- + telur (egg) = produce eggs.
    words: [bertelur]
  - id: e07
    type: build_sentence
    source:
      ar_eg: اللي لابس أحمر ده بيركب الأمواج.
      ar: ذلك الشخص الذي يلبس الأحمر يركب الأمواج.
      en: The person wearing red is surfing.
    answer: Orang yang berbaju merah itu sedang berselancar.
    distractors: [bertopi, naik]
    words: [berbaju, berselancar]
    explain:
      ar_eg: berbaju merah = لابس أحمر، وsedang berselancar = بيركب الموج دلوقتي. bertopi وnaik زيادة.
      ar: berbaju merah = يلبس الأحمر، وsedang berselancar = يركب الأمواج الآن. أما bertopi وnaik فزائدتان.
      en: berbaju merah = wearing red, sedang berselancar = surfing now. bertopi and naik don't fit.
  - id: e08
    type: listen
    text: Anak yang berbaju biru itu bergembira.
    options: [Anak yang berbaju biru itu bergembira., Anak yang berbaju biru itu bersedih., Anak yang berkacamata itu bergembira.]
    answer: 0
    meaning:
      ar_eg: الولد اللي لابس أزرق ده فرحان.
      ar: ذلك الطفل الذي يلبس الأزرق فرحان.
      en: The child in blue is happy.
    words: [berbaju, bergembira, bersedih, berkacamata]
  - id: e09
    type: dictation
    text: Pelatih kami bertopi. Topinya merah.
    meaning:
      ar_eg: المدرّب بتاعنا لابس كاب. الكاب بتاعه أحمر.
      ar: مدرّبنا يلبس قبعة. قبعته حمراء.
      en: Our coach wears a cap. His cap is red.
    words: [pelatih, bertopi, topi]
  - id: e10
    type: fill_blank
    sentence: Ssst, jangan ___! Ayam itu sedang bertelur di topi saya.
    meaning:
      ar_eg: هسس، ماتعملش صوت! الفرخة دي بتبيض في الكاب بتاعي.
      ar: صه، لا تُصدر صوتًا! تلك الدجاجة تبيض في قبعتي.
      en: Shh, don't make a sound! That hen is laying an egg in my cap.
    options: [bersuara, bersedih, berbaju]
    answers: [bersuara]
    words: [bersuara, bertelur, topi]
    explain:
      ar_eg: jangan bersuara = ماتعملش صوت (ber- + suara). bersedih = يزعل، وberbaju = لابس هدوم.
      ar: jangan bersuara = لا تُصدر صوتًا. أما bersedih فحزن وberbaju لبس.
      en: jangan bersuara = don't make a sound. bersedih is be sad, berbaju wear clothes.
dialogue:
  title: Pantai Kuta
  lines:
    - speaker: Raka
      text: Mohamed, kamu suka berselancar?
      ar_eg: يا محمد، بتحب ركوب الأمواج؟
      ar: يا محمد، هل تحب ركوب الأمواج؟
      en: Mohamed, do you like surfing?
    - speaker: Mohamed
      text: Belum pernah. Saya biasanya bersepeda.
      ar_eg: عمري ما جربت. أنا عادةً بركب عجلة.
      ar: لم أجرّب قط. عادةً أركب الدراجة.
      en: I've never tried. I usually cycle.
    - speaker: Raka
      text: Lihat orang yang berkacamata itu. Itu Mas Rizal! Dia juga pelatih selancar.
      ar_eg: بص على اللي لابس نضارة ده. ده ماس ريزال! هو كمان مدرّب سيرف.
      ar: انظر إلى صاحب النظارة ذاك. إنه ماس ريزال! وهو مدرّب ركوب أمواج أيضًا.
      en: Look at the man in glasses. That's Mas Rizal! He's a surf coach too.
    - speaker: Mohamed
      text: Yang bertopi merah?
      ar_eg: اللي لابس كاب أحمر؟
      ar: صاحب القبعة الحمراء؟
      en: The one in the red cap?
    - speaker: Raka
      text: Ya! Besok kita berdua belajar berselancar dengan dia.
      ar_eg: أيوه! بكرة إحنا الاتنين هنتعلّم السيرف معاه.
      ar: نعم! غدًا سنتعلّم نحن الاثنان ركوب الأمواج معه.
      en: Yes! Tomorrow the two of us will learn to surf with him.
    - speaker: Mohamed
      text: Wah, saya senang sekali!
      ar_eg: الله، أنا مبسوط جدًّا!
      ar: رائع، أنا سعيد جدًّا!
      en: Wow, I'm so happy!
