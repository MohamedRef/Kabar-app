schema: kabar.lesson/v1
id: bipa6.u08.l07
language: id
title: Malam teleskop
can_do:
  ar_eg: تحضر ليلة رصد نجوم وتفهم شرح الفلكي عن الكويكبات والقياس والتلوث الضوئي.
  ar: أن تحضر أمسية رصد وتفهم شرح الفلكيّ عن الكويكبات والقياس والتلوث الضوئي.
  en: Join a stargazing night and follow an astronomer on asteroids, measurement and light pollution.
slides:
  - title: Langit Bengkulu
    body:
      ar_eg: |
        ليلة رصد على شاطئ في بنجكولو، بعيد عن نور المدينة:
        astronom = عالم فلك. teleskop = تلسكوب (وفي الكلام teropong). observasi = رصد، ملاحظة علمية.
        asteroid = كويكب. diameter = قطر. pengukuran = قياس (من ukur).
        hidrogen = هيدروجين. polusi = تلوث (polusi cahaya = التلوث الضوئي).
      ar: |
        أمسية رصد على شاطئ في بنغكولو، بعيدًا عن أضواء المدينة:
        astronom = عالم فلك. teleskop = مِقراب (وفي الحديث teropong). observasi = رصد علمي.
        asteroid = كويكب. diameter = قُطر. pengukuran = قياس (من ukur).
        hidrogen = هيدروجين. polusi = تلوّث (polusi cahaya = التلوث الضوئي).
      en: |
        A stargazing night on a Bengkulu beach, away from city lights:
        astronom = astronomer. teleskop = telescope (in speech: teropong). observasi = (scientific) observation.
        asteroid = asteroid. diameter = diameter. pengukuran = measurement (from ukur).
        hidrogen = hydrogen. polusi = pollution (polusi cahaya = light pollution).
    examples:
      - text: Astronom itu memasang teleskop di pantai.
        ar_eg: عالم الفلك ده ركّب التلسكوب على الشط.
        ar: نصب الفلكيّ المقراب على الشاطئ.
        en: The astronomer set up the telescope on the beach.
      - text: Diameter asteroid itu sekitar satu kilometer.
        ar_eg: قطر الكويكب ده حوالي كيلو.
        ar: قطر ذلك الكويكب نحو كيلومتر.
        en: That asteroid is about a kilometre across.
      - text: Matahari sebagian besar terdiri atas hidrogen.
        ar_eg: الشمس معظمها هيدروجين.
        ar: تتكوّن الشمس في معظمها من الهيدروجين.
        en: The sun is mostly hydrogen.
