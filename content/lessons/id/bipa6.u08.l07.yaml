  - id: e03
    type: listen
    text: Di kota, polusi cahaya membuat bintang tidak terlihat.
    question:
      ar_eg: إيه اللي بيخبّي النجوم في المدينة؟
      ar: ما الذي يحجب النجوم في المدينة؟
      en: What hides the stars in the city?
    options: [التلوث الضوئي, السحاب, المطر]
    answer: 0
    meaning:
      ar_eg: في المدينة، التلوث الضوئي بيخلي النجوم مش باينة.
      ar: في المدينة يحجب التلوث الضوئي النجوم.
      en: In the city, light pollution hides the stars.
    words: [polusi]
  - id: e04
    type: fill_blank
    sentence: Dengan ___ ini, kita bisa melihat cincin Saturnus.
    meaning:
      ar_eg: بالـ ___ ده، نقدر نشوف حلقات زحل.
      ar: بهذا ___ نستطيع رؤية حلقات زحل.
      en: With this ___, we can see Saturn's rings.
    options: [teleskop, asteroid, hidrogen]
    answers: [teleskop]
    words: [teleskop, asteroid, hidrogen]
    explain:
      ar_eg: بنشوف حلقات زحل بالتلسكوب teleskop. asteroid = كويكب وhidrogen = هيدروجين، مش أدوات.
      ar: تُرى حلقات زحل بالمقراب teleskop؛ أمّا asteroid فكويكب، وhidrogen عنصر.
      en: You see Saturn's rings through a teleskop. asteroid and hidrogen aren't instruments.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الخط اللي بيعدّي في نص الدايرة من ناحية للناحية التانية اسمه إيه؟
      ar: ما اسم الخط المارّ بمركز الدائرة من طرف إلى طرف؟
      en: What's the line through a circle's centre from side to side?
    options: [pengukuran, diameter, observasi]
    answer: 1
    explain:
      ar_eg: diameter = قطر.
      ar: diameter = قُطر.
      en: diameter = diameter.
    words: [diameter, pengukuran, observasi]
  - id: e06
    type: fill_blank
    sentence: ___ yang tepat sangat penting dalam sains.
    meaning:
      ar_eg: الـ ___ المظبوط مهم أوي في العلوم.
      ar: الـ ___ الدقيق بالغ الأهمية في العلم.
      en: Accurate ___ is vital in science.
    options: [Pengukuran, Polusi, Asteroid]
    answers: [Pengukuran]
    words: [pengukuran, polusi, asteroid]
    explain:
      ar_eg: «القياس الدقيق» = Pengukuran yang tepat. Polusi = تلوث وAsteroid = كويكب، مش في المعنى.
      ar: «القياس الدقيق» Pengukuran yang tepat؛ أمّا Polusi وAsteroid فليستا في المعنى.
      en: "\"Accurate measurement\" is Pengukuran yang tepat. Polusi and Asteroid don't fit."
  - id: e07
    type: multiple_choice
    question: Seorang ___ mempelajari bintang dan planet.
    options: [teleskop, hidrogen, astronom]
    answer: 2
    explain:
      ar_eg: astronom = عالم فلك (وعلم الفلك astronomi).
      ar: astronom = فلكيّ (وعلم الفلك astronomi).
      en: astronom = astronomer (the field is astronomi).
    words: [astronom, teleskop, hidrogen]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الرصد بيبدأ الساعة تسعة بالليل.
      ar: يبدأ الرصد الساعة التاسعة ليلًا.
      en: Observation starts at nine at night.
    answer: Observasi dimulai pukul sembilan malam.
    distractors: [diameter, polusi]
    words: [observasi]
    explain:
      ar_eg: «الرصد» = Observasi و«بيبدأ» = dimulai. diameter وpolusi مش في المعنى.
      ar: «الرصد» Observasi و«يبدأ» dimulai؛ أمّا diameter وpolusi فليستا في المعنى.
      en: "\"Observation\" is Observasi and \"starts\" is dimulai. diameter and polusi aren't in the meaning."
  - id: e09
    type: translate
    direction: from_target
    source_text: Asteroid itu lewat dekat Bumi, tetapi tidak berbahaya.
    answers_meaning:
      ar_eg: [الكويكب ده عدّى قريب من الأرض، بس مش خطير, كويكب عدّى جنب الأرض ومفيش خطر]
      ar: [مرّ ذلك الكويكب قرب الأرض، لكنه غير خطير]
      en: ['The asteroid passed close to Earth, but it isn''t dangerous', That asteroid flew near Earth but posed no danger]
    words: [asteroid]
  - id: e10
    type: speaking
    text: Astronom itu mengukur diameter bintang yang terbuat dari hidrogen.
    meaning:
      ar_eg: عالم الفلك ده بيقيس قطر نجم معمول من هيدروجين.
      ar: يقيس ذلك الفلكيّ قطر نجم مكوّن من الهيدروجين.
      en: The astronomer measures the diameter of a star made of hydrogen.
    words: [astronom, diameter, hidrogen]
dialogue:
  lines:
    - speaker: Bu Laila
      text: Malam ini cerah. Teleskopnya sudah siap.
      ar_eg: الليلة صافية. التلسكوب جاهز.
      ar: الليلة صافية. المقراب جاهز.
      en: It's clear tonight. The telescope is ready.
    - speaker: Mohamed
      text: Kenapa observasi harus di pantai, Bu?
      ar_eg: ليه الرصد لازم يبقى على الشط يا أبلة؟
      ar: لماذا يجب أن يكون الرصد على الشاطئ يا أستاذة؟
      en: Why does the observation have to be on the beach?
    - speaker: Bu Laila
      text: Di kota ada polusi cahaya. Di sini langit gelap, cocok untuk astronom amatir.
      ar_eg: في المدينة فيه تلوث ضوئي. هنا السما ضلمة، مناسبة لهواة الفلك.
      ar: في المدينة تلوّث ضوئي. هنا السماء مظلمة، مناسبة لهواة الفلك.
      en: The city has light pollution. Here the sky is dark, good for amateur astronomers.
    - speaker: Mohamed
      text: Apa kita bisa melihat asteroid?
      ar_eg: هنقدر نشوف كويكب؟
      ar: هل سنرى كويكبًا؟
      en: Can we see an asteroid?
    - speaker: Bu Laila
      text: Yang besar saja. Pengukuran diameternya perlu teleskop yang lebih besar.
      ar_eg: الكبار بس. وقياس قطرهم محتاج تلسكوب أكبر.
      ar: الكبيرة فقط. أمّا قياس أقطارها فيحتاج إلى مقراب أكبر.
      en: Only the big ones. Measuring their diameter needs a bigger telescope.
