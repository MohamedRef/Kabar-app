schema: kabar.lesson/v1
id: bipa4.u04.l11
language: id
title: Siaran radio pagi
can_do:
  ar_eg: تفهم خبر قصير في الراديو عن سياسة جديدة وتقول مين هيستفيد.
  ar: أن تفهم خبرًا إذاعيًا قصيرًا عن سياسة جديدة وتذكر من سيستفيد منها.
  en: Follow a short radio news item about a new policy and say who benefits.
slides:
  - title: Berita pagi di radio
    body:
      ar_eg: |
        نشرة الصبح في راديو باريباري. اسمع الجمل الأول من غير ما تبص.
        pendengar = المستمعين (من dengar = يسمع).
      ar: |
        نشرة الصباح في إذاعة باريباري. استمع إلى الجمل أولًا دون أن تنظر.
        pendengar = المستمعون (من dengar = يسمع).
      en: |
        The morning news on a Parepare radio station. Listen to the sentences first without looking.
        pendengar = listeners (from dengar, to hear).
    examples:
      - text: Selamat pagi, pendengar. Mulai tahun depan, pemerintah daerah akan memberikan beasiswa kepada seribu siswa.
        ar_eg: صباح الخير يا مستمعين. من السنة الجاية، الحكومة المحلية هتدي منح دراسية لألف طالب.
        ar: صباح الخير أيها المستمعون. ابتداءً من العام القادم ستمنح الحكومة المحلية منحًا دراسية لألف طالب.
        en: Good morning, listeners. Starting next year, the local government will give scholarships to a thousand students.
      - text: Menurut pemerintah daerah, setiap tahun ratusan anak putus sekolah karena biaya.
        ar_eg: الحكومة المحلية بتقول إن كل سنة مئات العيال بيسيبوا المدرسة بسبب المصاريف.
        ar: بحسب الحكومة المحلية، يترك مئات الأطفال الدراسة كل عام بسبب التكاليف.
        en: According to the local government, hundreds of children drop out of school every year because of the cost.
      - text: Berkat kebijakan ini, anak dari keluarga miskin diharapkan bisa terus sekolah.
        ar_eg: بفضل السياسة دي، بيتمنّوا إن عيال العيلات الفقيرة يقدروا يكمّلوا تعليمهم.
        ar: بفضل هذه السياسة، يُؤمَل أن يتمكّن أبناء الأسر الفقيرة من مواصلة الدراسة.
        en: Thanks to this policy, children from poor families are expected to stay in school.
exercises:
  - id: e01
    type: listen
    text: Mulai tahun depan, pemerintah daerah akan memberikan beasiswa kepada seribu siswa.
    question:
      ar_eg: كام طالب هياخد منحة؟
      ar: كم طالبًا سيحصل على منحة؟
      en: How many students will get a scholarship?
    options: [Seratus siswa, Seribu siswa, Sepuluh ribu siswa]
    answer: 1
    meaning:
      ar_eg: من السنة الجاية، الحكومة المحلية هتدي منح دراسية لألف طالب.
      ar: ابتداءً من العام القادم ستمنح الحكومة المحلية منحًا دراسية لألف طالب.
      en: Starting next year, the local government will give scholarships to a thousand students.
    words: [beasiswa]
  - id: e02
    type: listen
    text: Menurut pemerintah daerah, setiap tahun ratusan anak putus sekolah karena biaya.
    question:
      ar_eg: العيال بيسيبوا المدرسة ليه؟
      ar: لماذا يترك الأطفال المدرسة؟
      en: Why do children drop out of school?
    options: [Karena biaya, Karena banjir, Karena sekolahnya jauh]
    answer: 0
    meaning:
      ar_eg: كل سنة مئات العيال بيسيبوا المدرسة بسبب المصاريف.
      ar: يترك مئات الأطفال الدراسة كل عام بسبب التكاليف.
      en: Hundreds of children drop out every year because of the cost.
    words: [putus sekolah]
  - id: e03
    type: listen
    text: Berkat kebijakan ini, anak dari keluarga miskin diharapkan bisa terus sekolah.
    question:
      ar_eg: مين اللي هيستفيد من السياسة دي؟
      ar: من المستفيد من هذه السياسة؟
      en: Who benefits from this policy?
    options: [Guru-guru di Parepare, Wartawan radio, Anak dari keluarga miskin]
    answer: 2
    meaning:
      ar_eg: بفضل السياسة دي، بيتمنّوا إن عيال العيلات الفقيرة يكمّلوا تعليمهم.
      ar: بفضل هذه السياسة يُؤمَل أن يواصل أبناء الأسر الفقيرة الدراسة.
      en: Thanks to this policy, children from poor families are expected to stay in school.
    words: [berkat, kebijakan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة في الخبر بتقدّم سبب «كويس»؟
      ar: أيّ كلمة في الخبر تقدّم سببًا «إيجابيًا»؟
      en: Which word in the report introduces a good cause?
    options: [gara-gara, berkat, akibatnya]
    answer: 1
    explain:
      ar_eg: berkat = بفضل (سبب حلو). gara-gara = بسبب (سبب وحش، عامية). akibatnya = النتيجة، مش السبب.
      ar: berkat = بفضل (سبب إيجابي)، وgara-gara = بسبب (سبب سلبي، عامية)، وakibatnya للنتيجة لا للسبب.
      en: berkat = thanks to (good cause); gara-gara = because of (bad cause, casual); akibatnya gives the result, not the cause.
    words: [berkat, gara-gara]
  - id: e05
    type: match_pairs
    pairs:
      - text: beasiswa
        ar_eg: منحة دراسية
        ar: منحة دراسية
        en: scholarship
      - text: kebijakan
        ar_eg: سياسة / قرار
        ar: سياسة
        en: policy
      - text: putus sekolah
        ar_eg: يسيب المدرسة
        ar: يترك الدراسة
        en: drop out of school
      - text: berkat
        ar_eg: بفضل
        ar: بفضل
        en: thanks to
      - text: menyebabkan
        ar_eg: يسبّب
        ar: يسبّب
        en: cause
    words: [beasiswa, kebijakan, putus sekolah, berkat, menyebabkan]
  - id: e06
    type: dictation
    text: Banyak anak putus sekolah karena biaya.
    meaning:
      ar_eg: عيال كتير بيسيبوا المدرسة بسبب المصاريف.
      ar: كثير من الأطفال يتركون الدراسة بسبب التكاليف.
      en: Many children drop out of school because of the cost.
    words: [putus sekolah]
  - id: e07
    type: fill_blank
    sentence: Biaya sekolah yang mahal ___ banyak anak putus sekolah.
    meaning:
      ar_eg: مصاريف المدرسة الغالية بتخلّي عيال كتير يسيبوا المدرسة.
      ar: تكاليف المدرسة المرتفعة تتسبّب في ترك كثير من الأطفال للدراسة.
      en: Expensive school fees cause many children to drop out.
    options: [mendukung, melaporkan, menyebabkan]
    answers: [menyebabkan]
    words: [menyebabkan, putus sekolah]
    explain:
      ar_eg: menyebabkan = يسبّب، والمصاريف الغالية بتخلّي العيال تسيب المدرسة. mendukung = يؤيد، وmelaporkan = يبلّغ.
      ar: menyebabkan = يسبّب، فالرسوم الغالية تُخرج الأطفال من المدرسة. أما mendukung فيؤيد، وmelaporkan يُبلغ.
      en: "menyebabkan means \"causes\": high fees make children drop out. mendukung is support, and melaporkan is report."
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بفضل المنحة، Andi يقدر يكمّل تعليمه.
      ar: بفضل المنحة يستطيع Andi مواصلة الدراسة.
      en: Thanks to the scholarship, Andi can stay in school.
    answers:
      - Berkat beasiswa, Andi bisa terus sekolah.
      - Berkat beasiswa itu, Andi bisa terus sekolah.
      - Berkat beasiswa, Andi bisa terus bersekolah.
      - Berkat beasiswa, Andi dapat terus sekolah.
      - Andi bisa terus sekolah berkat beasiswa.
      - Andi bisa terus bersekolah berkat beasiswa.
    words: [berkat, beasiswa]
dialogue:
  title: Kabar baik untuk adik Andi
  lines:
    - speaker: Andi
      text: Mohamed, kamu dengar siaran radio tadi pagi?
      ar_eg: يا Mohamed، سمعت نشرة الراديو الصبح؟
      ar: يا Mohamed، هل سمعت نشرة الإذاعة صباح اليوم؟
      en: Mohamed, did you hear the radio news this morning?
    - speaker: Mohamed
      text: Dengar. Pemerintah daerah mau kasih beasiswa ke seribu siswa.
      ar_eg: سمعتها. الحكومة المحلية هتدي منح لألف طالب.
      ar: سمعتها. ستمنح الحكومة المحلية منحًا لألف طالب.
      en: I did. The local government is giving scholarships to a thousand students.
    - speaker: Andi
      text: Wah, adikku bisa daftar! Dulu temannya putus sekolah gara-gara biaya.
      ar_eg: ياه، أختي الصغيرة تقدر تقدّم! زمان صاحبتها سابت المدرسة بسبب المصاريف.
      ar: رائع، يمكن لأختي الصغرى أن تتقدّم! فقد تركت صديقتها الدراسة سابقًا بسبب التكاليف.
      en: Great, my little sister can apply! Her friend dropped out because of the cost.
    - speaker: Mohamed
      text: Semoga kebijakan ini berhasil.
      ar_eg: يا رب السياسة دي تنجح.
      ar: نرجو أن تنجح هذه السياسة.
      en: Let's hope this policy works.
    - speaker: Andi
      text: Amin. Berkat beasiswa, aku sendiri bisa kuliah di Makassar.
      ar_eg: آمين. أنا نفسي بفضل منحة قدرت أدرس في الجامعة في ماكاسار.
      ar: آمين. فأنا نفسي تمكّنت بفضل منحة من الدراسة الجامعية في ماكاسار.
      en: Amen. Thanks to a scholarship, I was able to go to university in Makassar myself.
new_words: []
