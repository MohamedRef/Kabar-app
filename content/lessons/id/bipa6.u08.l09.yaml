schema: kabar.lesson/v1
id: bipa6.u08.l09
language: id
title: Badak dan evolusi
can_do:
  ar_eg: تقرا مقالة علمية مبسطة عن الانقراض والهجرة والتطور والوراثة.
  ar: أن تقرأ مقالة علمية مبسطة عن الانقراض والهجرة والتطور والوراثة.
  en: Read a popular-science piece on extinction, migration, evolution and genetics.
slides:
  - title: Sains populer
    body:
      ar_eg: |
        مقالة (مكتوبة للدرس) عن حيوانات سومطرة والبحر:
        mamalia = ثدييات. badak = خرتيت، وحيد القرن (badak Sumatra). sirip = زعنفة. gurita = أخطبوط.
        kepunahan = انقراض (من punah). migrasi = هجرة (الحيوانات والطيور).
        berevolusi = يتطوّر بالتطور الأحيائي (من evolusi). genetika = علم الوراثة؛ الجينات.
      ar: |
        مقالة (مكتوبة للدرس) عن حيوانات سومطرة والبحر:
        mamalia = ثدييات. badak = وحيد القرن (badak Sumatra). sirip = زعنفة. gurita = أخطبوط.
        kepunahan = انقراض (من punah). migrasi = هجرة (الحيوانات والطيور).
        berevolusi = يتطوّر (تطوّرًا أحيائيًا، من evolusi). genetika = علم الوراثة.
      en: |
        An article (written for the lesson) on the animals of Sumatra and the sea:
        mamalia = mammals. badak = rhinoceros (badak Sumatra). sirip = fin. gurita = octopus.
        kepunahan = extinction (from punah). migrasi = migration.
        berevolusi = to evolve (from evolusi). genetika = genetics.
    examples:
      - text: Badak Sumatra terancam kepunahan.
        ar_eg: خرتيت سومطرة مهدد بالانقراض.
        ar: وحيد القرن السومطري مهدد بالانقراض.
        en: The Sumatran rhino is threatened with extinction.
      - text: Paus bukan ikan; ia mamalia, walaupun punya sirip.
        ar_eg: الحوت مش سمكة؛ ده من الثدييات، مع إن عنده زعانف.
        ar: الحوت ليس سمكة؛ إنه من الثدييات وإن كانت له زعانف.
        en: A whale isn't a fish; it's a mammal, even though it has fins.
      - text: Gurita punya tiga jantung.
        ar_eg: الأخطبوط عنده تلات قلوب.
        ar: للأخطبوط ثلاثة قلوب.
        en: An octopus has three hearts.
