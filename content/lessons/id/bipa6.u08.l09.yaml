      - text: gurita
        ar_eg: أخطبوط
        ar: أخطبوط
        en: octopus
    words: [mamalia, badak, sirip, gurita]
  - id: e02
    type: match_pairs
    pairs:
      - text: kepunahan
        ar_eg: انقراض
        ar: انقراض
        en: extinction
      - text: migrasi
        ar_eg: هجرة
        ar: هجرة
