  - id: e03
    type: listen
    text: Setiap tahun, burung-burung melakukan migrasi ke selatan.
    question:
      ar_eg: الطيور بتعمل إيه كل سنة؟
      ar: ماذا تفعل الطيور كل عام؟
      en: What do the birds do every year?
    options: [هجرة, انقراض, صيد]
    answer: 0
    meaning:
      ar_eg: كل سنة، الطيور بتهاجر ناحية الجنوب.
      ar: تهاجر الطيور كل عام نحو الجنوب.
      en: Every year, birds migrate south.
    words: [migrasi]
  - id: e04
    type: fill_blank
    sentence: Ikan paus dan manusia sama-sama ___.
    meaning:
      ar_eg: الحوت والإنسان الاتنين ___.
      ar: الحوت والإنسان كلاهما من ___.
      en: Whales and humans are both ___.
    options: [mamalia, gurita, genetika]
    answers: [mamalia]
    words: [mamalia, gurita, genetika]
    explain:
      ar_eg: الحوت والإنسان التنين ثدييات mamalia. gurita = أخطبوط، وgenetika = علم الوراثة.
      ar: الحوت والإنسان من الثدييات mamalia؛ أمّا gurita فأخطبوط، وgenetika علم الوراثة.
      en: Whales and humans are mammals, mamalia. gurita is an octopus, and genetika genetics.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الحيوان اللي عنده تمن دراعات في البحر؟
      ar: ما الحيوان البحري ذو الأذرع الثماني؟
      en: Which sea animal has eight arms?
    options: [badak, gurita, sirip]
    answer: 1
    explain:
      ar_eg: gurita = أخطبوط.
      ar: gurita = أخطبوط.
      en: gurita = octopus.
    words: [gurita, badak, sirip]
  - id: e06
    type: fill_blank
    sentence: Darwin menjelaskan bagaimana makhluk hidup ___ selama jutaan tahun.
    meaning:
      ar_eg: داروين شرح إزاي الكائنات الحية ___ على مدى ملايين السنين.
      ar: شرح داروين كيف ___ الكائنات الحية عبر ملايين السنين.
      en: Darwin explained how living things ___ over millions of years.
    options: [berevolusi, migrasi, kepunahan]
    answers: [berevolusi]
    words: [berevolusi, migrasi, kepunahan]
    explain:
      ar_eg: "بعد bagaimana + فاعل محتاجين فعل: berevolusi (تطوّروا). migrasi وkepunahan أسماء."
      ar: بعد bagaimana والفاعل نحتاج فعلًا berevolusi (تطوّرت)؛ أمّا migrasi وkepunahan فاسمان.
      en: "After bagaimana + subject we need a verb: berevolusi. migrasi and kepunahan are nouns."
  - id: e07
    type: multiple_choice
    question: Warna mata kita ditentukan oleh ___.
    options: [mamalia, badak, genetika]
    answer: 2
    explain:
      ar_eg: 'لون العين بيتحدد بالجينات: genetika.'
      ar: 'يحدّد لونَ العين الوراثةُ: genetika.'
      en: 'Eye colour is set by genetics: genetika.'
    words: [genetika, mamalia, badak]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الخرتيت السومطري مهدد بالانقراض.
      ar: وحيد القرن السومطري مهدد بالانقراض.
      en: The Sumatran rhino faces extinction.
    answer: Badak Sumatra terancam kepunahan.
    distractors: [genetika, migrasi]
    words: [badak, kepunahan]
    explain:
      ar_eg: «مهدد بالانقراض» = terancam kepunahan. genetika وmigrasi مش في المعنى.
      ar: «مهدّد بالانقراض» terancam kepunahan؛ أمّا genetika وmigrasi فليستا في المعنى.
      en: "\"Faces extinction\" is terancam kepunahan. genetika and migrasi aren't in the meaning."
  - id: e09
    type: translate
    direction: from_target
    source_text: Paus bernapas dengan paru-paru, tetapi punya sirip seperti ikan.
    answers_meaning:
      ar_eg: [الحوت بيتنفس برئة، بس عنده زعانف زي السمك, الحوت بيتنفس بالرئة وعنده زعانف زي السمك]
      ar: [يتنفّس الحوت برئتين، لكن له زعانف كالسمك]
      en: ['Whales breathe with lungs, but have fins like fish', A whale breathes through lungs but has fins like a fish]
    words: [sirip]
  - id: e10
    type: speaking
    text: Makhluk hidup terus berevolusi, dan kepunahan adalah bagian dari alam.
    meaning:
      ar_eg: الكائنات الحية بتتطور على طول، والانقراض جزء من الطبيعة.
      ar: تتطوّر الكائنات الحية باستمرار، والانقراض جزء من الطبيعة.
      en: Living things keep evolving, and extinction is part of nature.
    words: [berevolusi, kepunahan]
dialogue:
  lines:
    - speaker: Bu Laila
      text: Tahukah kamu? Badak Sumatra tinggal kurang dari seratus ekor.
      ar_eg: تعرف؟ خرتيت سومطرة فاضل منه أقل من مية.
      ar: أتعلم؟ بقي من وحيد القرن السومطري أقل من مئة.
      en: Did you know? Fewer than a hundred Sumatran rhinos remain.
    - speaker: Mohamed
      text: Sedikit sekali! Apakah kepunahan bisa dicegah?
      ar_eg: قليل أوي! ينفع نمنع الانقراض؟
      ar: قليل جدًا! هل يمكن منع الانقراض؟
      en: So few! Can extinction be prevented?
    - speaker: Bu Laila
      text: Para ilmuwan memakai genetika untuk membantu perkembangbiakannya.
      ar_eg: العلما بيستخدموا علم الوراثة عشان يساعدوه يتكاثر.
      ar: يستخدم العلماء علم الوراثة لمساعدته على التكاثر.
      en: Scientists use genetics to help it breed.
    - speaker: Mohamed
      text: Di Laut Merah, saya pernah melihat penyu yang bermigrasi jauh.
      ar_eg: في البحر الأحمر، شفت سلاحف بحرية بتهاجر مسافات بعيدة.
      ar: في البحر الأحمر رأيت سلاحف بحرية تهاجر بعيدًا.
      en: In the Red Sea, I once saw sea turtles that migrate far.
    - speaker: Bu Laila
      text: Ya, migrasi penyu bisa ribuan kilometer. Alam selalu berevolusi.
      ar_eg: أيوه، هجرة السلاحف ممكن تبقى آلاف الكيلومترات. الطبيعة دايمًا بتتطور.
      ar: نعم، قد تمتد هجرة السلاحف آلاف الكيلومترات. الطبيعة في تطوّر دائم.
      en: Yes, turtle migrations can span thousands of kilometres. Nature is always evolving.
