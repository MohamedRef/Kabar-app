        ar_eg: جامع
        ar: مسجد
        en: mosque
      - text: kolam renang
        ar_eg: حمام سباحة
        ar: مسبح
        en: swimming pool
      - text: air
        ar_eg: مية
        ar: ماء
        en: water
      - text: restoran
        ar_eg: مطعم
        ar: مطعم
