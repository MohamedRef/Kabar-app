schema: kabar.lesson/v1
id: bipa1.u05.l02
language: id
title: Ada pantai?
can_do:
  ar_eg: تقول «فيه» و«مفيش».
  ar: أن تقول «يوجد» و«لا يوجد».
  en: Say there is / there isn't.
slides:
  - title: ada = فيه
    body:
      ar_eg: |
        ada دي أسهل كلمة على المصري، لأنها بالظبط «فيه»:
        - Ada pantai? = فيه بحر؟
        - Ada. = فيه.
        - Tidak ada. = مفيش.
        مفيش تصريف ولا مذكر ومؤنث، ada واحدة لكل حاجة.
      ar: |
        ada تقابل «يوجد / هناك» تمامًا:
        - Ada pantai? = هل يوجد شاطئ؟
        - Ada. = يوجد.
        - Tidak ada. = لا يوجد.
        ولا تتصرف ولا تتغير بتذكير أو تأنيث.
      en: |
        ada is Egyptian «فيه» exactly:
        - Ada pantai? = Is there a beach?
        - Ada. = There is.
        - Tidak ada. = There isn't.
        It never changes form.
    grammar: id.ada
    examples:
      - text: Ada kolam renang?
        ar_eg: فيه حمام سباحة؟
        ar: هل يوجد مسبح؟
        en: Is there a swimming pool?
      - text: Maaf, tidak ada.
        ar_eg: آسف، مفيش.
        ar: عذرًا، لا يوجد.
        en: Sorry, there isn't.
  - title: Di Ancol ada pantai
    body:
      ar_eg: |
        عشان تقول «فيه … في مكان كذا»، ابدأ بالمكان أو خليه في الآخر، الاتنين صح:
        - Di Ancol ada pantai. = في أنكول فيه بحر.
        - Ada pantai di Ancol. = فيه بحر في أنكول.
        وada كمان معناها «موجود» للناس: Pak Irwan ada? = أستاذ إروان موجود؟
      ar: |
        لتقول «يوجد … في مكان ما» ابدأ بالمكان أو أخّره، فكلاهما صحيح:
        - Di Ancol ada pantai. = في أنكول شاطئ.
        - Ada pantai di Ancol. = يوجد شاطئ في أنكول.
        وتأتي ada بمعنى «حاضر / موجود» للأشخاص: Pak Irwan ada? = هل الأستاذ إروان موجود؟
      en: |
        To say "there is … somewhere", put the place first or last — both are right:
        - Di Ancol ada pantai. = In Ancol there's a beach.
        - Ada pantai di Ancol. = There's a beach in Ancol.
        ada also means "is in / is present" for people: Pak Irwan ada? = Is Pak Irwan in?
    grammar: id.ada
    examples:
      - text: Di Ancol ada masjid?
        ar_eg: فيه جامع في أنكول؟
        ar: هل يوجد مسجد في أنكول؟
        en: Is there a mosque in Ancol?
      - text: Ibu ada di rumah?
        ar_eg: ماما موجودة في البيت؟
        ar: هل أمك في البيت؟
        en: Is your mother at home?
  - title: Ada apa?
    body:
      ar_eg: |
        Ada apa? = «فيه إيه؟» بالحرف، لما تحس إن فيه حاجة.
        خلي بالك: ada مش «يكون». «أنا طالب» = Saya mahasiswa، من غير ada خالص (فاكر إن الإندونيسي مافيهوش فعل «يكون»؟).
        وmasjid جاية من العربي «مسجد»، ركّز فيها هتلاقيها في كل حتة.
      ar: |
        Ada apa? = «ماذا هناك؟ / ما الأمر؟» حرفيًا.
        انتبه: ada ليست فعل كينونة؛ «أنا طالب» = Saya mahasiswa بلا ada.
        وكلمة masjid من العربية «مسجد».
      en: |
        Ada apa? = literally «فيه إيه؟» — "What's up? / What's wrong?"
        Careful: ada is not "to be". "I'm a student" = Saya mahasiswa, no ada at all.
        masjid comes from Arabic «مسجد».
    grammar: id.ada
    examples:
      - text: Ada apa, Rina?
        ar_eg: فيه إيه يا رينا؟
        ar: ما الأمر يا رينا؟
        en: What's up, Rina?
      - text: Saya mahasiswa.
        ar_eg: أنا طالب.
        ar: أنا طالب جامعي.
        en: I'm a student.
