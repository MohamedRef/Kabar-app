  - id: e02
    type: multiple_choice
    question: Ada kolam renang?
    question_meaning:
      ar_eg: مفيش حمام سباحة. ترد تقول إيه؟
      ar: لا يوجد مسبح. بماذا تجيب؟
      en: There's no pool. How do you answer?
    options: [Tidak ada., Belum., Ada.]
    answer: 0
    explain:
      ar_eg: الرد على سؤال بـ ada بيبقى ada (فيه) أو tidak ada (مفيش).
      ar: يُجاب عن سؤال ada بـ ada أو tidak ada.
      en: A question with ada is answered ada or tidak ada.
    words: [tidak ada]
  - id: e03
    type: listen
    text: Di Ancol ada pantai.
    options: [Di Ancol ada pantai., Di Ancol tidak ada pantai., Di Ancol ada restoran.]
    answer: 0
    words: [ada, pantai, restoran]
  - id: e04
    type: fill_blank
    sentence: Di Ancol ___ kolam renang.
    meaning:
      ar_eg: في أنشول فيه حمام سباحة.
      ar: في أنشول مسبح.
      en: There's a swimming pool in Ancol.
    options: [adalah, ada, apa]
    answers: [ada]
    words: [ada, kolam renang]
  - id: e05
    type: listen
    text: Di Ancol ada masjid dan restoran.
    options: ['Di Ancol ada masjid dan restoran.', 'Di Ancol ada masjid, tapi tidak ada restoran.', 'Di Ancol ada toilet dan restoran.']
    answer: 0
    meaning:
      ar_eg: في أنكول فيه جامع ومطعم.
      ar: في أنكول مسجد ومطعم.
      en: In Ancol there's a mosque and a restaurant.
    words: [ada, masjid, restoran, tidak ada, toilet]
  - id: e06
    type: fill_blank
    sentence: ___ apa, Rina?
    meaning:
      ar_eg: فيه إيه يا رينا؟
      ar: ما الأمر يا رينا؟
      en: What's up, Rina?
    options: [Ada, Air, Tidak]
    answers: [Ada]
    words: ['Ada apa?']
  - id: e07
    type: speaking
    text: Maaf, Bu, ada air? Ada toilet?
    meaning:
      ar_eg: لو سمحتي يا مدام، فيه مية؟ فيه حمام؟
      ar: عذرًا يا سيدتي، هل يوجد ماء؟ هل يوجد حمّام؟
      en: Excuse me, ma'am, is there water? Is there a toilet?
    words: [ada, air, toilet]
  - id: e08
    type: speaking
    text: Ada apa? Tidak ada air di toilet!
    meaning:
      ar_eg: فيه إيه؟ مفيش مية في الحمام!
      ar: ما الأمر؟ لا يوجد ماء في الحمّام!
      en: What's wrong? There's no water in the toilet!
    words: ['Ada apa?', tidak ada, air, toilet]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: حد بيزعّق برّه. تسأل «فيه إيه؟» إزاي؟
      ar: أحدهم يصيح في الخارج. كيف تسأل «ما الأمر؟»
      en: Someone's shouting outside. How do you ask "What's going on?"
    options: ['Ada apa?', 'Ada masjid?', 'Apa kabar?']
    answer: 0
    words: ['Ada apa?', masjid]
dialogue:
  title: Ada apa di Ancol?
  lines:
    - speaker: Mohamed
      text: Mas Rizal, di Ancol ada pantai?
      ar_eg: يا أستاذ ريزال، فيه بحر في أنكول؟
      ar: يا ريزال، هل يوجد شاطئ في أنكول؟
      en: Mas Rizal, is there a beach in Ancol?
    - speaker: Mas Rizal
      text: Ada! Ada pantai dan taman.
      ar_eg: فيه! فيه بحر وجنينة.
      ar: نعم! يوجد شاطئ وحديقة.
      en: There is! There's a beach and a park.
    - speaker: Mohamed
      text: Ada masjid juga?
      ar_eg: فيه جامع كمان؟
      ar: وهل يوجد مسجد أيضًا؟
      en: Is there a mosque too?
    - speaker: Mas Rizal
      text: Ada. Ada kolam renang juga.
      ar_eg: فيه. وفيه حمام سباحة كمان.
      ar: يوجد. ويوجد مسبح أيضًا.
      en: There is. There's a swimming pool too.
    - speaker: Mohamed
      text: Ada restoran Mesir?
      ar_eg: فيه مطعم مصري؟
      ar: هل يوجد مطعم مصري؟
      en: Is there an Egyptian restaurant?
    - speaker: Mas Rizal
      text: Wah, maaf, nggak ada!
      ar_eg: يا خبر، آسف، مفيش!
      ar: آه، عذرًا، لا يوجد!
      en: Oh, sorry, there isn't!
