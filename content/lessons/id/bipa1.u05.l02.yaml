  - id: e02
    type: multiple_choice
    question: Ada kolam renang?
    question_meaning:
      ar_eg: مفيش حمام سباحة. ترد تقول إيه؟
      ar: لا يوجد مسبح. بماذا تجيب؟
      en: There's no pool. How do you answer?
    options: ["Tidak ada.", "Bukan.", "Ada."]
    answer: 0
    explain:
      ar_eg: الرد على سؤال بـ ada بيبقى ada (فيه) أو tidak ada (مفيش).
      ar: يُجاب عن سؤال ada بـ ada أو tidak ada.
      en: A question with ada is answered ada or tidak ada.
    words: [tidak ada]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح بمعنى «أنا طالب»؟
      ar: أيّ جملة صحيحة بمعنى «أنا طالب»؟
      en: Which sentence correctly says "I'm a student"?
    options: ["Saya mahasiswa.", "Ada saya mahasiswa.", "Saya ada mahasiswa."]
    answer: 0
    explain:
      ar_eg: ada معناها «فيه / موجود»، مش «يكون». الإندونيسي مش محتاج فعل «يكون» هنا.
      ar: ada بمعنى «يوجد»، لا فعل كينونة، والإندونيسية لا تحتاجه هنا.
      en: ada means "there is", not "to be"; Indonesian needs no "be" here.
    words: [ada]
