dialogue:
  title: Ada apa di Ancol?
  lines:
    - speaker: Mohamed
      text: Mas Ardi, di Ancol ada pantai?
      ar_eg: يا أستاذ أردي، فيه بحر في أنكول؟
      ar: يا أردي، هل يوجد شاطئ في أنكول؟
      en: Mas Ardi, is there a beach in Ancol?
    - speaker: Mas Ardi
      text: Ada! Ada pantai dan taman.
      ar_eg: فيه! فيه بحر وجنينة.
      ar: نعم! يوجد شاطئ وحديقة.
      en: There is! There's a beach and a park.
    - speaker: Mohamed
      text: Ada masjid juga?
      ar_eg: فيه جامع كمان؟
      ar: وهل يوجد مسجد أيضًا؟
      en: Is there a mosque too?
    - speaker: Mas Ardi
      text: Ada. Ada kolam renang juga.
      ar_eg: فيه. وفيه حمام سباحة كمان.
      ar: يوجد. ويوجد مسبح أيضًا.
      en: There is. There's a swimming pool too.
    - speaker: Mohamed
      text: Ada restoran Mesir?
      ar_eg: فيه مطعم مصري؟
      ar: هل يوجد مطعم مصري؟
      en: Is there an Egyptian restaurant?
    - speaker: Mas Ardi
      text: Wah, maaf, tidak ada!
      ar_eg: يا خبر، آسف، مفيش!
      ar: آه، عذرًا، لا يوجد!
      en: Oh, sorry, there isn't!
