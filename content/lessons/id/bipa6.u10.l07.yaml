schema: kabar.lesson/v1
id: bipa6.u10.l07
language: id
title: Bahasa penelitian
can_do:
  ar_eg: 'تكتب وتقرا جمل البحث العلمي: المعايير والإحالة والتحليل والمؤشرات والتخمين.'
  ar: 'أن تقرأ وتكتب جمل البحث العلمي: المعايير والإحالة والتحليل والمؤشرات والتخمين.'
  en: 'Read and write research sentences: criteria, referring, analysing, indications and speculation.'
slides:
  - title: Kalimat penelitian
    body:
      ar_eg: |
        جمل بتتكرر في أي بحث:
        kajian = دراسة، بحث (kajian pustaka = مراجعة الأدبيات). pembahasan = مناقشة (فصل في البحث). kriteria = معايير.
        menganalisis = يحلّل. merujuk pada = يحيل إلى، يرجع لـ. menekankan = يأكد على، يشدد على (من tekan).
        indikasi = مؤشر، دلالة. spekulasi = تخمين، كلام من غير دليل.
        - في الشارع: udah = sudah (خلاص / بالفعل)، cuma = hanya (بس)، aku / -ku = saya (أنا)، nulis = menulis (يكتب)، buat = untuk (عشان / لـ)، milih = memilih (يختار)، terus = lalu (وبعدين).
      ar: |
        عبارات تتكرر في كل بحث:
        kajian = دراسة (kajian pustaka = مراجعة الأدبيات). pembahasan = مناقشة (فصل في البحث). kriteria = معايير.
        menganalisis = يحلّل. merujuk pada = يحيل إلى. menekankan = يؤكّد، يشدّد على (من tekan).
        indikasi = مؤشّر، دلالة. spekulasi = تخمين بلا دليل.
        - في كلام الشارع: udah = sudah (قد / بالفعل)، cuma = hanya (فقط)، aku / -ku = saya (أنا)، nulis = menulis (يكتب)، buat = untuk (لـ / من أجل)، milih = memilih (يختار)، terus = lalu (ثمّ).
      en: |
        Phrases every paper uses:
        kajian = study (kajian pustaka = literature review). pembahasan = discussion (a chapter). kriteria = criteria.
        menganalisis = to analyse. merujuk pada = to refer to. menekankan = to emphasise (from tekan).
        indikasi = indication, sign. spekulasi = speculation.
        - On the street: udah = sudah (already), cuma = hanya (only), aku / -ku = saya (I), nulis = menulis (to write), buat = untuk (for), milih = memilih (to choose), terus = lalu (then).
    examples:
      - text: Kajian ini menganalisis bahasa iklan di Medan.
        ar_eg: الدراسة دي بتحلل لغة الإعلانات في ميدان.
        ar: تحلّل هذه الدراسة لغة الإعلانات في ميدان.
        en: This study analyses advertising language in Medan.
      - text: Penulis merujuk pada data BPS tahun 2020.
        ar_eg: الكاتب بيرجع لبيانات هيئة الإحصاء سنة 2020.
        ar: يحيل الكاتب إلى بيانات هيئة الإحصاء لعام 2020.
        en: The author refers to 2020 Statistics Indonesia data.
      - text: Tidak ada indikasi kuat; itu hanya spekulasi.
        ar_eg: مفيش مؤشر قوي؛ ده مجرد تخمين.
        ar: لا مؤشّر قويًّا؛ ذلك مجرد تخمين.
        en: There's no strong indication; it's just speculation.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kajian
        ar_eg: دراسة
        ar: دراسة
        en: study
      - text: pembahasan
        ar_eg: مناقشة
        ar: مناقشة
        en: discussion
      - text: kriteria
        ar_eg: معايير
        ar: معايير
        en: criteria
      - text: menganalisis
        ar_eg: يحلّل
        ar: يحلّل
        en: to analyse
    words: [kajian, pembahasan, kriteria, menganalisis]
  - id: e02
    type: match_pairs
    pairs:
      - text: merujuk
        ar_eg: يرجع لـ
        ar: يحيل إلى
        en: to refer (to)
      - text: menekankan
        ar_eg: يأكد على
        ar: يؤكّد
        en: to emphasise
      - text: indikasi
        ar_eg: مؤشر
        ar: مؤشّر
        en: indication
      - text: spekulasi
        ar_eg: تخمين
        ar: تخمين
        en: speculation
    words: [merujuk, menekankan, indikasi, spekulasi]
  - id: e03
    type: listen
    text: Bab empat berisi hasil dan pembahasan.
    question:
      ar_eg: الفصل الرابع فيه إيه غير النتايج؟
      ar: ماذا يتضمّن الفصل الرابع غير النتائج؟
      en: Besides results, what's in chapter four?
    options: [المناقشة, المقدمة, المراجع]
    answer: 0
    meaning:
      ar_eg: الفصل الرابع فيه النتايج والمناقشة.
      ar: يتضمّن الفصل الرابع النتائج والمناقشة.
      en: Chapter four contains the results and discussion.
    words: [pembahasan]
  - id: e04
    type: fill_blank
    sentence: 'Ada tiga ___ untuk memilih responden: umur, kota, dan pekerjaan.'
    meaning:
      ar_eg: 'فيه تلات ___ لاختيار المشاركين: السن والمدينة والشغل.'
      ar: 'هناك ثلاثة ___ لاختيار المشاركين: العمر والمدينة والمهنة.'
      en: 'There are three ___ for choosing respondents: age, city and job.'
    options: [kriteria, spekulasi, kajian]
    answers: [kriteria]
    words: [kriteria, spekulasi, kajian]
    explain:
      ar_eg: السن والمدينة والشغل معايير kriteria لاختيار المشاركين. spekulasi = تخمين، وkajian = دراسة.
      ar: السنّ والمدينة والعمل معايير kriteria للاختيار؛ أمّا spekulasi فتخمين، وkajian دراسة.
      en: Age, city and job are kriteria for choosing respondents. spekulasi is speculation, and kajian a study.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الكاتب بيقول 'الأهم هو…' ويكررها. هو بيعمل إيه؟
      ar: يقول الكاتب 'الأهمّ هو…' ويكرّرها. ماذا يفعل؟
      en: The writer keeps saying 'what matters most is…'. What is he doing?
    options: [merujuk, menekankan, menganalisis]
    answer: 1
    explain:
      ar_eg: menekankan = يشدد على، من tekan (يضغط).
      ar: menekankan = يشدّد على، من tekan (يضغط).
      en: menekankan = to emphasise, from tekan (to press).
    words: [menekankan, merujuk, menganalisis]
  - id: e06
    type: fill_blank
    sentence: Pendapat tanpa data hanyalah ___.
    meaning:
      ar_eg: الرأي من غير بيانات مجرد ___.
      ar: الرأي بلا بيانات مجرد ___.
      en: An opinion without data is mere ___.
    options: [spekulasi, indikasi, pembahasan]
    answers: [spekulasi]
    words: [spekulasi, indikasi, pembahasan]
    explain:
      ar_eg: "رأي من غير بيانات تخمين بس: spekulasi. indikasi = مؤشر (بيعتمد على بيانات)، وpembahasan = مناقشة."
      ar: رأي بلا بيانات spekulasi (تخمين)؛ أمّا indikasi فمؤشّر قائم على بيانات، وpembahasan مناقشة.
      en: An opinion without data is spekulasi. indikasi is an indication from data, and pembahasan a discussion.
  - id: e07
    type: multiple_choice
    question: Kenaikan harga beras adalah ___ bahwa panen gagal.
    options: [kriteria, kajian, indikasi]
    answer: 2
    explain:
      ar_eg: indikasi = مؤشر، علامة.
      ar: indikasi = مؤشّر، دلالة.
      en: indikasi = indication, sign.
    words: [indikasi, kriteria, kajian]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الدراسة دي بتحلل بيانات من عشر مدن.
      ar: تحلّل هذه الدراسة بيانات من عشر مدن.
      en: This study analyses data from ten cities.
    answer: Kajian ini menganalisis data dari sepuluh kota.
    distractors: [merujuk, spekulasi]
    words: [kajian, menganalisis]
    explain:
      ar_eg: «الدراسة دي بتحلل» = Kajian ini menganalisis. merujuk وspekulasi زيادة.
      ar: «تحلّل هذه الدراسة» Kajian ini menganalisis؛ أمّا merujuk وspekulasi فزائدتان.
      en: "\"This study analyses\" is Kajian ini menganalisis. merujuk and spekulasi aren't needed."
  - id: e09
    type: translate
    direction: from_target
    source_text: Penulis merujuk pada tiga sumber dan menekankan sumber pertama.
    answers_meaning:
      ar_eg: [الكاتب بيرجع لتلات مصادر وبيأكد على أول مصدر, الكاتب استند لتلات مراجع وركّز على الأول]
      ar: [يحيل الكاتب إلى ثلاثة مصادر ويؤكّد المصدر الأول]
      en: [The author refers to three sources and emphasises the first, 'The writer cites three sources, stressing the first one']
    words: [merujuk, menekankan]
  - id: e10
    type: speaking
    text: Pembahasan harus menganalisis data, bukan spekulasi.
    meaning:
      ar_eg: المناقشة لازم تحلل البيانات، مش تخمين.
      ar: على المناقشة أن تحلّل البيانات، لا أن تخمّن.
      en: The discussion must analyse the data, not speculate.
    words: [pembahasan, menganalisis, spekulasi]
dialogue:
  lines:
    - speaker: Rani
      text: Bab dua udah selesai?
      ar_eg: الفصل التاني خلص؟
      ar: هل انتهى الفصل الثاني؟
      en: Is chapter two done?
    - speaker: Mohamed
      text: Hampir. Kajian pustakanya merujuk ke dua puluh sumber.
      ar_eg: تقريبًا. مراجعة الأدبيات بترجع لعشرين مصدر.
      ar: تقريبًا. تحيل مراجعة الأدبيات إلى عشرين مصدرًا.
      en: Almost. The literature review refers to twenty sources.
    - speaker: Rani
      text: 'Bagus. Tapi dosen menekankan: jangan cuma meringkas, harus menganalisis.'
      ar_eg: 'حلو. بس الدكتور بيأكد: ما تلخصش وبس، لازم تحلل.'
      ar: 'جيد. لكن الأستاذ يشدّد: لا تلخّص فقط، بل حلّل.'
      en: 'Good. But the lecturer stresses: don''t just summarise, analyse.'
    - speaker: Mohamed
      text: Betul. Aku juga nulis kriteria buat memilih sumber.
      ar_eg: مظبوط. وكتبت كمان معايير لاختيار المصادر.
      ar: صحيح. وكتبت أيضًا معايير لاختيار المصادر.
      en: Right. I also wrote criteria for choosing sources.
    - speaker: Rani
      text: Terus di bab pembahasan, jangan pakai spekulasi. Tulis 'ada indikasi', bukan 'pasti'.
      ar_eg: وفي فصل المناقشة، ما تستعملش التخمين. اكتب 'فيه مؤشر'، مش 'أكيد'.
      ar: وفي فصل المناقشة لا تلجأ إلى التخمين. اكتب 'ثمّة مؤشّر'، لا 'حتمًا'.
      en: And in the discussion, don't use speculation. Write 'there is an indication', not 'certainly'.
