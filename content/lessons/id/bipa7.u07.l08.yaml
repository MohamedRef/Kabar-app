schema: kabar.lesson/v1
id: bipa7.u07.l08
language: id
title: Dari RUU ke undang-undang
can_do:
  ar_eg: تتابع رحلة القانون في البرلمان وعلاقة النايب بالناس اللي انتخبوه.
  ar: أن تتابع مسار القانون في البرلمان وصلة النائب بناخبيه.
  en: Follow a bill through parliament and an MP's ties to their voters.
slides:
  - title: Perjalanan sebuah RUU
    body:
      ar_eg: |
        rancangan undang-undang (RUU) = مشروع قانون. بيتناقش في لجان، وبعدين في sidang paripurna (الجلسة العامة).
        pengesahan = إقرار القانون. بعد كده الرئيس بيوقّعه.
        interpelasi = البرلمان بيستجوب الحكومة عن سياسة مهمّة.
        وقت reses (إجازة البرلمان) النوّاب بيرجعوا daerah pemilihan (الدايرة) يسمعوا konstituen (ناخبيهم).
        ambang batas parlemen = الحد الأدنى من الأصوات علشان الحزب يدخل البرلمان؛ في انتخابات 2024 كان 4%.
        - في الكلام: udah = sudah، aja = saja.
      ar: |
        rancangan undang-undang (RUU) = مشروع قانون، يُناقش في اللجان ثمّ في sidang paripurna (الجلسة العامّة).
        pengesahan = إقرار القانون، ثمّ يوقّعه الرئيس.
        interpelasi = استجواب البرلمان للحكومة عن سياسة مهمّة.
        وفي reses (العطلة البرلمانية) يعود النوّاب إلى daerah pemilihan (دوائرهم) ليسمعوا konstituen (ناخبيهم).
        ambang batas parlemen = الحدّ الأدنى من الأصوات لدخول الحزب البرلمان، وكان 4% في انتخابات 2024.
        - في الكلام اليومي: udah = sudah، aja = saja.
      en: |
        rancangan undang-undang (RUU) = a bill. It's debated in committees, then in a sidang paripurna (plenary).
        pengesahan = passing the law; then the president signs it.
        interpelasi = parliament formally questioning the government on a major policy.
        During reses (recess), MPs go back to their daerah pemilihan to hear their konstituen.
        ambang batas parlemen = the minimum vote share for a party to enter parliament; 4% in the 2024 election.
        - In speech: udah = sudah, aja = saja.
    examples:
      - text: RUU itu akan dibahas dalam sidang paripurna besok.
        ar_eg: مشروع القانون ده هيتناقش في الجلسة العامة بكرة.
        ar: سيُناقش مشروع القانون في الجلسة العامّة غدًا.
        en: The bill will be discussed in plenary tomorrow.
      - text: Selama reses, anggota DPR bertemu konstituennya.
        ar_eg: في إجازة البرلمان، النوّاب بيقابلوا ناخبيهم.
        ar: خلال العطلة البرلمانية يلتقي النوّاب ناخبيهم.
        en: During recess, MPs meet their constituents.
      - text: Partai kecil itu tidak lolos ambang batas.
        ar_eg: الحزب الصغيّر ده ما عدّاش العتبة.
        ar: لم يتجاوز ذلك الحزب الصغير العتبة.
        en: That small party didn't pass the threshold.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rancangan undang-undang
        ar_eg: مشروع قانون
        ar: مشروع قانون
        en: draft law, bill
      - text: sidang paripurna
        ar_eg: جلسة عامة (للبرلمان كله)
        ar: جلسة عامّة
        en: plenary session
      - text: pengesahan
        ar_eg: إقرار / تصديق
        ar: إقرار، مصادقة
        en: ratification, passing (of a law)
      - text: interpelasi
        ar_eg: استجواب (البرلمان للحكومة)
        ar: استجواب
        en: interpellation (parliament questioning government)
    words: [rancangan undang-undang, sidang paripurna, pengesahan, interpelasi]
  - id: e02
    type: match_pairs
    pairs:
      - text: reses
        ar_eg: إجازة البرلمان (النوّاب بيرجعوا دوايرهم)
        ar: عطلة برلمانية
        en: parliamentary recess
      - text: konstituen
        ar_eg: الناخبين في الدايرة
        ar: الناخبون في الدائرة
        en: constituents
      - text: daerah pemilihan
        ar_eg: دايرة انتخابية
        ar: دائرة انتخابية
        en: electoral district
      - text: ambang batas
        ar_eg: العتبة / الحد الأدنى
        ar: العتبة، الحدّ الأدنى
        en: threshold
    words: [reses, konstituen, daerah pemilihan, ambang batas]
  - id: e03
    type: listen
    text: Beberapa fraksi mengajukan hak interpelasi tentang harga BBM.
    question:
      ar_eg: الكتل قدّمت إيه؟
      ar: بمَ تقدّمت الكتل؟
      en: What did the factions file?
    options: [استجواب, إجازة البرلمان, إقرار]
    answer: 0
    meaning:
      ar_eg: كام كتلة قدّموا طلب استجواب عن أسعار البنزين.
      ar: تقدّمت كتل عدّة بحقّ الاستجواب بشأن أسعار الوقود.
      en: Several factions filed an interpellation over fuel prices.
    words: [interpelasi]
  - id: e04
    type: fill_blank
    sentence: Wartawan menunggu ___ RUU itu sampai tengah malam.
    meaning:
      ar_eg: الصحفيين استنّوا ___ مشروع القانون لحد نص الليل.
      ar: انتظر الصحفيون ___ مشروع القانون حتى منتصف الليل.
      en: Reporters waited for the bill's ___ until midnight.
    options: [pengesahan, reses, konstituen]
    answers: [pengesahan]
    words: [pengesahan, reses, konstituen]
    explain:
      ar_eg: الصحفيين مستنيين pengesahan RUU = إقرار مشروع القانون. reses = إجازة البرلمان وkonstituen = الناخبين.
      ar: ينتظر الصحفيون pengesahan أي إقرار مشروع القانون. reses عطلة برلمانية.
      en: Reporters wait for the bill's pengesahan (passage).
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: النوّاب بيعملوا إيه وقت «reses»؟
      ar: ماذا يفعل النوّاب في «reses»؟
      en: What do MPs do during 'reses'?
    options: [Liburan ke luar negeri bersama keluarga., Kembali ke daerah pemilihan untuk mendengar warga., Membuat RUU baru sendirian.]
    answer: 1
    explain:
      ar_eg: بيرجعوا دوايرهم يسمعوا الناس.
      ar: يعودون إلى دوائرهم لسماع الناس.
      en: They return to their districts to listen to people.
    words: [reses, daerah pemilihan, rancangan undang-undang]
  - id: e06
    type: fill_blank
    sentence: Papua Barat Daya menjadi ___ baru pada Pemilu 2024.
    meaning:
      ar_eg: بابوا الغربية الجنوبية بقت ___ جديدة في انتخابات 2024.
      ar: صارت بابوا الجنوبية الغربية ___ جديدة في انتخابات 2024.
      en: Southwest Papua became a new ___ in the 2024 election.
    options: [daerah pemilihan, ambang batas, sidang paripurna]
    answers: [daerah pemilihan]
    words: [daerah pemilihan, ambang batas, sidang paripurna]
    explain:
      ar_eg: Papua Barat Daya بقت daerah pemilihan = دايرة انتخابية جديدة. ambang batas = العتبة، وsidang paripurna = جلسة عامة.
      ar: صارت Papua Barat Daya daerah pemilihan أي دائرة انتخابية جديدة.
      en: It became a new daerah pemilihan (electoral district).
  - id: e07
    type: build_sentence
    source:
      ar_eg: النايب لازم يسمع ناخبيه.
      ar: على النائب أن يسمع ناخبيه.
      en: An MP must listen to their constituents.
    answer: Anggota DPR harus mendengar konstituennya.
    distractors: [reses, interpelasi]
    words: [konstituen]
    explain:
      ar_eg: Anggota DPR (النايب) + harus mendengar (لازم يسمع) + konstituennya (ناخبيه). reses وinterpelasi زيادة.
      ar: Anggota DPR harus mendengar konstituennya. reses وinterpelasi زائدتان.
      en: Anggota DPR + harus mendengar + konstituennya. reses and interpelasi are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Rancangan undang-undang itu ditolak oleh banyak mahasiswa.
    answers_meaning:
      ar_eg: [مشروع القانون ده طلبة كتير رفضوه, طلبة كتير اعترضوا على مشروع القانون ده]
      ar: [رفض كثير من الطلّاب ذلك المشروع, عارض طلّاب كثيرون مشروع القانون ذاك]
      en: [Many students rejected that bill, That draft law was opposed by many students]
    words: [rancangan undang-undang]
  - id: e09
    type: speaking
    text: Sidang paripurna menyetujui pengesahan RUU itu.
    meaning:
      ar_eg: الجلسة العامة وافقت على إقرار المشروع.
      ar: وافقت الجلسة العامّة على إقرار المشروع.
      en: The plenary approved passing the bill.
    words: [sidang paripurna, pengesahan]
  - id: e10
    type: multiple_choice
    question: Apa arti "ambang batas parlemen 4 persen"?
    options: [Partai harus mendapat minimal 4 persen suara untuk masuk DPR., Hanya 4 persen warga boleh memilih., DPR reses 4 persen setahun.]
    answer: 0
    explain:
      ar_eg: الحزب لازم ياخد 4% على الأقل علشان يدخل البرلمان.
      ar: يجب أن ينال الحزب 4% على الأقلّ ليدخل البرلمان.
      en: A party needs at least 4% to enter parliament.
    words: [ambang batas, reses, interpelasi, sidang paripurna, konstituen]
dialogue:
  lines:
    - speaker: Bu Debora
      text: Malam ini ada sidang paripurna. RUU penyiaran mungkin disahkan.
      ar_eg: الليلة فيه جلسة عامة. ممكن قانون البث يتقر.
      ar: الليلة جلسة عامّة، وقد يُقرّ مشروع قانون البثّ.
      en: There's a plenary tonight. The broadcasting bill may pass.
    - speaker: Mohamed
      text: Banyak radio komunitas khawatir dengan RUU itu.
      ar_eg: إذاعات مجتمعية كتير قلقانة من المشروع ده.
      ar: تخشى إذاعات مجتمعية كثيرة ذلك المشروع.
      en: Lots of community radios are worried about that bill.
    - speaker: Bu Debora
      text: Karena itu kita wawancara anggota DPR dari daerah pemilihan Papua Barat Daya.
      ar_eg: علشان كده هنعمل مقابلة مع نايب من دايرة بابوا الغربية الجنوبية.
      ar: لذلك سنحاور نائبًا عن دائرة بابوا الجنوبية الغربية.
      en: That's why we're interviewing an MP for the Southwest Papua district.
    - speaker: Mohamed
      text: Dia baru aja reses di Sorong, kan? Pasti udah dengar suara konstituen.
      ar_eg: هو لسه راجع من إجازة البرلمان في سورونج، صح؟ أكيد سمع رأي ناخبيه.
      ar: كان في عطلته البرلمانية في سورونغ للتوّ، أليس كذلك؟ لا بدّ أنه سمع ناخبيه.
      en: He was just in Sorong for recess, wasn't he? He must have heard his constituents.
    - speaker: Bu Debora
      text: Ya. Tanyakan apakah dia akan menolak pengesahannya.
      ar_eg: أيوه. اسأله هيرفض إقراره ولا لأ.
      ar: نعم، اسأله إن كان سيرفض إقراره.
      en: Yes. Ask whether he'll vote against passing it.
