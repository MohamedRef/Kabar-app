schema: kabar.lesson/v1
id: bipa3.u06.l01
language: id
title: Sebuah, seorang, seminggu
can_do:
  ar_eg: تستعمل se- بمعنى «واحد» وبمعنى «كله» (sebuah، seminggu، sekeluarga).
  ar: أن تستعمل se- بمعنى «واحد» وبمعنى «كلّه» (sebuah، seminggu، sekeluarga).
  en: Use se- to mean "one" and "the whole" (sebuah, seminggu, sekeluarga).
slides:
  - title: se- = satu
    body:
      ar_eg: |
        se- جاية من satu (واحد). بتلزقها في المميِّز أو في وحدة الوقت:
        buah → sebuah (حاجة واحدة)، orang → seorang (شخص واحد)، minggu → seminggu (أسبوع).
        انت عارف أصلًا sehari وsebulan — دي نفس الفكرة.
        وخلي بالك: se- بادئة لازقة، ما تكتبهاش منفصلة (sebuah مش se buah).
      ar: |
        se- مأخوذة من satu (واحد)، وتتصل بالمميِّز أو بوحدة الزمن:
        buah → sebuah (شيء واحد)، orang → seorang (شخص واحد)، minggu → seminggu (أسبوع).
        وأنت تعرف sehari وsebulan، وهما على القياس نفسه.
        وهي سابقة متصلة: sebuah لا se buah.
      en: |
        se- comes from satu (one). Join it to a classifier or a time unit:
        buah → sebuah (one thing, a), orang → seorang (one person, a), minggu → seminggu (a week).
        You already know sehari and sebulan: same idea.
        It's a prefix, so write it joined: sebuah, not se buah.
    grammar: id.prefix.se
    examples:
      - text: Saya memesan sebuah kamar untuk seminggu.
        ar_eg: حجزت أوضة لمدة أسبوع.
        ar: حجزت غرفة لمدة أسبوع.
        en: I booked a room for a week.
      - text: Seorang tamu menunggu di resepsionis.
        ar_eg: فيه ضيف مستني عند الاستقبال.
        ar: ضيفٌ ينتظر عند الاستقبال.
        en: A guest is waiting at reception.
  - title: se- = seluruh
    body:
      ar_eg: |
        مع العيلة أو المكان، se- معناها «كله / بحاله»:
        keluarga → sekeluarga (العيلة كلها)، kota → sekota (المدينة كلها).
        قبل اسم علم بتحط شَرطة وحرف كابيتال: se-Indonesia (إندونيسيا كلها)، se-Lombok.
      ar: |
        مع الأسرة أو المكان تفيد se- الشمول:
        keluarga → sekeluarga (الأسرة كلها)، kota → sekota (المدينة كلها).
        وقبل اسم العلم تُكتب بشرطة: se-Indonesia (في إندونيسيا كلها)، se-Lombok.
      en: |
        With a family or a place, se- means "the whole":
        keluarga → sekeluarga (the whole family), kota → sekota (the whole city).
        Before a proper noun, add a hyphen and keep the capital: se-Indonesia, se-Lombok.
    grammar: id.prefix.se
    examples:
      - text: Kami sekeluarga menginap di Kuta Mandalika.
        ar_eg: إحنا العيلة كلها نازلين في كوتا مانداليكا.
        ar: نقيم نحن والأسرة كلها في كوتا مانداليكا.
        en: Our whole family is staying in Kuta Mandalika.
      - text: Sirkuit Mandalika terkenal se-Indonesia.
        ar_eg: حلبة مانداليكا مشهورة في إندونيسيا كلها.
        ar: حلبة مانداليكا مشهورة في أنحاء إندونيسيا.
        en: The Mandalika circuit is famous all over Indonesia.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sebuah
        ar_eg: واحد / -ة (لحاجة)
        ar: واحد (لشيء)
        en: one, a (thing)
      - text: seorang
        ar_eg: واحد (لشخص)
        ar: واحد (لشخص)
        en: one, a (person)
      - text: seminggu
        ar_eg: أسبوع (واحد)
        ar: أسبوع واحد
        en: a week
      - text: sekeluarga
        ar_eg: العيلة كلها
        ar: الأسرة كلها
        en: the whole family
      - text: tamu
        ar_eg: ضيف / نزيل
        ar: ضيف / نزيل
        en: guest
    words: [sebuah, seorang, seminggu, sekeluarga, tamu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: "أنهي كلمة تنفع هنا: «___ tamu datang ke resepsionis.» (ضيف جه الاستقبال)"
      ar: "أيّ كلمة تناسب: «___ tamu datang ke resepsionis.» (جاء ضيف إلى الاستقبال)"
      en: "Which word fits: «___ tamu datang ke resepsionis.» (A guest came to reception.)"
    options: [Sebuah, Seorang, Sekeluarga]
    answer: 1
    explain:
      ar_eg: tamu شخص، والمميِّز بتاع الأشخاص orang، فبتبقى seorang.
      ar: tamu إنسان، ومميِّز الأشخاص orang، فنقول seorang.
      en: A guest is a person, and the classifier for people is orang, so seorang.
    words: [seorang, tamu]
  - id: e03
    type: listen
    text: Kami sekeluarga menginap di sini selama seminggu.
    options:
      - Kami sekeluarga menginap di sini selama sebulan.
      - Kami sekeluarga makan di sini selama seminggu.
      - Kami sekeluarga menginap di sini selama seminggu.
    answer: 2
    meaning:
      ar_eg: إحنا العيلة كلها نازلين هنا أسبوع.
      ar: نقيم هنا نحن والأسرة كلها مدة أسبوع.
      en: Our whole family is staying here for a week.
    words: [sekeluarga, menginap, seminggu]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تسأل «حضرتك هتبات كام ليلة في الفندق ده؟»
      ar: كيف تسأل «كم ليلة ستقيم في هذا الفندق؟»
      en: How do you ask "How many nights are you staying at this hotel?"
    options:
      - Berapa malam Bapak makan di hotel ini?
      - Berapa malam Bapak menginap di hotel ini?
      - Berapa kamar Bapak di hotel ini?
    answer: 1
    explain:
      ar_eg: menginap = يبات / ينزل في مكان بالليل (فندق، بيت حد).
      ar: menginap = يبيت / يقيم ليلًا في مكان.
      en: menginap = to stay overnight somewhere.
    words: [menginap]
  - id: e05
    type: fill_blank
    sentence: Saya memesan ___ kamar untuk dua malam.
    meaning:
      ar_eg: حجزت أوضة لليلتين.
      ar: حجزت غرفة لليلتين.
      en: I booked a room for two nights.
    options: [seorang, sebuah, seminggu]
    answers: [sebuah]
    explain:
      ar_eg: kamar حاجة مش شخص، فبنقول sebuah.
      ar: kamar شيء لا شخص، فنقول sebuah.
      en: A room is a thing, not a person, so sebuah.
    words: [sebuah]
  - id: e06
    type: build_sentence
    source:
      ar_eg: فيه ضيف مستني عند الاستقبال.
      ar: ضيفٌ ينتظر عند الاستقبال.
      en: A guest is waiting at reception.
    answer: Seorang tamu menunggu di resepsionis.
    distractors: [sebuah, ke]
    words: [seorang, tamu]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إحنا العيلة كلها نازلين في كوتا أسبوع.
      ar: نقيم نحن والأسرة كلها في كوتا مدة أسبوع.
      en: Our whole family is staying in Kuta for a week.
    answers:
      - Kami sekeluarga menginap di Kuta selama seminggu.
      - Kami sekeluarga menginap di Kuta selama seminggu
      - Kami sekeluarga menginap di Kuta seminggu.
      - Kami sekeluarga menginap di Kuta seminggu
      - Kami sekeluarga menginap seminggu di Kuta.
      - Kami sekeluarga menginap seminggu di Kuta
      - Kami sekeluarga menginap selama seminggu di Kuta.
      - Kami sekeluarga menginap selama seminggu di Kuta
    words: [sekeluarga, menginap, seminggu]
  - id: e08
    type: speaking
    text: Saya memesan sebuah kamar untuk seminggu.
    meaning:
      ar_eg: حجزت أوضة لمدة أسبوع.
      ar: حجزت غرفة لمدة أسبوع.
      en: I booked a room for a week.
    words: [sebuah, seminggu]
dialogue:
  title: Di resepsionis hotel
  lines:
    - speaker: Resepsionis
      text: Selamat siang, Pak. Ada yang bisa saya bantu?
      ar_eg: نهارك سعيد يا فندم. أقدر أساعدك في إيه؟
      ar: طاب يومك يا سيدي. كيف أستطيع مساعدتك؟
      en: Good afternoon, sir. How can I help you?
    - speaker: Mohamed
      text: Saya memesan sebuah kamar untuk seminggu. Nama saya Mohamed.
      ar_eg: أنا حاجز أوضة لمدة أسبوع. اسمي محمد.
      ar: حجزتُ غرفة لمدة أسبوع. اسمي محمد.
      en: I booked a room for a week. My name is Mohamed.
    - speaker: Resepsionis
      text: Baik, Pak Mohamed. Bapak menginap sendiri?
      ar_eg: تمام يا أستاذ محمد. حضرتك نازل لوحدك؟
      ar: حسنًا يا سيد محمد. هل تقيم وحدك؟
      en: Very good, Mr Mohamed. Are you staying alone?
    - speaker: Mohamed
      text: Ya, tapi besok seorang teman saya datang.
      ar_eg: أيوه، بس بكرة واحد صاحبي جاي.
      ar: نعم، لكن صديقًا لي سيأتي غدًا.
      en: Yes, but a friend of mine is coming tomorrow.
    - speaker: Resepsionis
      text: Selamat datang di Mandalika! Sirkuitnya terkenal se-Indonesia, lho.
      ar_eg: أهلًا بيك في مانداليكا! على فكرة الحلبة بتاعتها مشهورة في إندونيسيا كلها.
      ar: مرحبًا بك في مانداليكا! حلبتها مشهورة في أنحاء إندونيسيا.
      en: Welcome to Mandalika! Its circuit is famous all over Indonesia, you know.
