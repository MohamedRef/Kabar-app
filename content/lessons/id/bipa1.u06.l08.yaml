schema: kabar.lesson/v1
id: bipa1.u06.l08
language: id
title: Sarapan dan koran
can_do:
  ar_eg: تتكلم عن الفطار وإنت بتقرا الجرنال والإيميل على الموبايل.
  ar: أن تتحدث عن الفطور وأنت تقرأ الجريدة والبريد على الهاتف.
  en: Talk about breakfast while you read the paper and your email on your phone.
slides:
  - title: Pagi di rumah
    body:
      ar_eg: |
        roti = عيش أو توست، susu = لبن، gelas = كوباية (segelas susu = كوباية لبن)، sendok = معلقة.
        koran = جرنال. ponsel = موبايل (من telepon seluler)، وemail = إيميل.
        selesai = خلص: Sarapan sudah selesai = الفطار خلص.
      ar: |
        roti = خبز أو توست، susu = حليب، gelas = كوب (segelas susu = كوب حليب)، sendok = ملعقة.
        koran = جريدة. ponsel = هاتف محمول (من telepon seluler)، وemail = بريد إلكتروني.
        selesai = انتهى: Sarapan sudah selesai = انتهى الفطور.
      en: |
        roti = bread, toast, susu = milk, gelas = glass (segelas susu = a glass of milk), sendok = spoon.
        koran = newspaper. ponsel = mobile phone (from telepon seluler), email = email.
        selesai = finished: Sarapan sudah selesai = breakfast is over.
    examples:
      - text: Saya sarapan roti dan satu gelas susu.
        ar_eg: بفطر عيش وكوباية لبن.
        ar: أفطر خبزًا وكوب حليب.
        en: I have bread and a glass of milk for breakfast.
      - text: Ayah membaca koran, saya membaca email di ponsel.
        ar_eg: بابا بيقرا الجرنال، وأنا بقرا الإيميل على الموبايل.
        ar: يقرأ أبي الجريدة، وأقرأ بريدي على الهاتف.
        en: Dad reads the paper; I read email on my phone.
      - text: Sarapan sudah selesai.
        ar_eg: الفطار خلص.
        ar: انتهى الفطور.
        en: Breakfast is over.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: roti
        ar_eg: عيش، توست
        ar: خبز
        en: bread
      - text: susu
        ar_eg: لبن
        ar: حليب
        en: milk
      - text: gelas
        ar_eg: كوباية
        ar: كوب
        en: glass
      - text: sendok
        ar_eg: معلقة
        ar: ملعقة
        en: spoon
    words: [roti, susu, gelas, sendok]
  - id: e02
    type: match_pairs
    pairs:
      - text: koran
        ar_eg: جرنال
        ar: جريدة
        en: newspaper
      - text: ponsel
        ar_eg: موبايل
        ar: هاتف محمول
        en: mobile phone
      - text: email
        ar_eg: إيميل
        ar: بريد إلكتروني
        en: email
