  - id: e03
    type: listen
    text: Saya minum satu gelas susu.
    question:
      ar_eg: بيشرب إيه؟
      ar: ماذا يشرب؟
      en: What is he drinking?
    options: [كوباية لبن, طبق عيش, معلقة]
    answer: 0
    meaning:
      ar_eg: بشرب كوباية لبن.
      ar: أشرب كوب حليب.
      en: I drink a glass of milk.
    words: [gelas, susu]
  - id: e04
    type: fill_blank
    sentence: Pagi ini saya makan ___ dan minum susu.
    meaning:
      ar_eg: النهارده الصبح كلت ___ وشربت لبن.
      ar: هذا الصباح أكلت ___ وشربت حليبًا.
      en: This morning I ate ___ and drank milk.
    options: [roti, koran, sendok]
    answers: [roti]
    words: [roti, koran, sendok, susu]
    explain:
      ar_eg: "للفطار: roti = عيش. koran = جرنال، وsendok = معلقة."
      ar: roti = خبز للفطور. koran جريدة وsendok ملعقة.
      en: "Breakfast with milk: roti (bread)."
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بتاكل الشوربة بإيه؟
      ar: بمَ تأكل الحساء؟
      en: What do you eat soup with?
    options: [sendok, gelas, ponsel]
    answer: 0
    explain:
      ar_eg: sendok = معلقة.
      ar: sendok = ملعقة.
      en: sendok = spoon.
    words: [sendok, gelas, ponsel]
  - id: e06
    type: fill_blank
    sentence: Ayah membaca ___ setiap pagi.
    meaning:
      ar_eg: بابا بيقرا ___ كل يوم الصبح.
      ar: يقرأ أبي ___ كل صباح.
      en: Dad reads the ___ every morning.
    options: [koran, susu, gelas]
    answers: [koran]
    words: [koran, susu, gelas]
    explain:
      ar_eg: بيقرا koran = جرنال. susu = لبن، وgelas = كوباية.
      ar: يقرأ koran أي الجريدة.
      en: You read a koran (newspaper).
  - id: e07
    type: build_sentence
    source:
      ar_eg: فيه إيميل من المدرس بتاعي.
      ar: هناك بريد من معلّمي.
      en: There's an email from my teacher.
    answer: Ada email dari guru saya.
    distractors: [koran, ponsel]
    words: [email]
    explain:
      ar_eg: Ada (فيه) + email + dari guru saya (من مدرسي). koran وponsel زيادة.
      ar: Ada email dari guru saya. koran وponsel زائدتان.
      en: Ada email + dari guru saya. koran and ponsel are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Sarapan sudah selesai.
    answers_meaning:
      ar_eg: [الفطار خلص, خلصنا الفطار]
      ar: [انتهى الفطور, انتهينا من الفطور]
      en: [Breakfast is over, Breakfast is finished, 'We''ve finished breakfast']
    words: [selesai]
  - id: e09
    type: speaking
    text: Saya membaca email di ponsel.
    meaning:
      ar_eg: بقرا الإيميل على الموبايل.
      ar: أقرأ البريد على هاتفي.
      en: I read email on my phone.
    words: [email, ponsel]
  - id: e10
    type: multiple_choice
    question: Sarapan saya sudah ___. Sekarang saya kerja.
    options: [selesai, roti, gelas]
    answer: 0
    explain:
      ar_eg: selesai = خلص.
      ar: selesai = انتهى.
      en: selesai = finished.
    words: [selesai, roti, gelas]
dialogue:
  lines:
    - speaker: Bu Yanti
      text: Mohamed, sarapan! Ada roti dan susu.
      ar_eg: يا محمد، الفطار! فيه عيش ولبن.
      ar: يا محمد، الفطور! هناك خبز وحليب.
      en: Mohamed, breakfast! There's bread and milk.
    - speaker: Mohamed
      text: Terima kasih, Bu. Boleh minta sendok?
      ar_eg: شكرًا يا طنط. ممكن معلقة؟
      ar: شكرًا يا سيدتي. هل لي بملعقة؟
      en: Thank you. Could I have a spoon?
    - speaker: Bu Yanti
      text: Ini sendok dan gelasnya.
      ar_eg: اتفضل المعلقة والكوباية.
      ar: تفضّل الملعقة والكوب.
      en: Here's a spoon and a glass.
    - speaker: Mohamed
      text: Wah, ada email dari guru saya di ponsel.
      ar_eg: الله، فيه إيميل من المدرس على الموبايل.
      ar: آه، وصلني بريد من معلّمي على الهاتف.
      en: Oh, there's an email from my teacher on my phone.
    - speaker: Bu Yanti
      text: Nanti aja. Sarapan, ya!
      ar_eg: بعدين. افطر الأول!
      ar: لاحقًا. افطر أولًا!
      en: Later. Eat your breakfast!
    - speaker: Mohamed
      text: Baik, Bu. Sarapan selesai, lalu saya baca korannya.
      ar_eg: حاضر. أخلص فطار وبعدين أقرا الجرنال.
      ar: حسنًا. أنهي الفطور ثم أقرأ الجريدة.
      en: OK. Breakfast first, then I'll read the paper.
