schema: kabar.lesson/v1
id: bipa3.u06.l08
language: id
title: Keluhan hotel
can_do:
  ar_eg: تكتب شكوى مؤدبة لفندق وتفهم ردّهم.
  ar: أن تكتب شكوى مهذبة إلى فندق وتفهم ردّه.
  en: Write a polite complaint to a hotel and understand the reply.
slides:
  - title: Surat keluhan yang sopan
    body:
      ar_eg: |
        شكوى إندونيسية مؤدبة ماشية بالترتيب ده:
        Yth. … → Dengan hormat, → Mohon maaf sebelumnya → المشكلة (tidak sebersih / tidak sesuai) → الطلب (secepatnya / mengembalikan uang) → شكرًا → Hormat saya,
        والفندق غالبًا هيرد بـ Mohon maklum (أرجو تفهّمك). وmaklum جاية من العربي «معلوم».
      ar: |
        للشكوى الإندونيسية المهذبة ترتيب ثابت:
        Yth. … ← Dengan hormat, ← Mohon maaf sebelumnya ← المشكلة (tidak sebersih / tidak sesuai) ← الطلب (secepatnya / mengembalikan uang) ← الشكر ← Hormat saya,
        وغالبًا يردّ الفندق بـ Mohon maklum (نرجو تفهّمكم)، وmaklum من العربية «معلوم».
      en: |
        A polite Indonesian complaint follows this order:
        Yth. … → Dengan hormat, → Mohon maaf sebelumnya → the problem (tidak sebersih / tidak sesuai) → the request (secepatnya / mengembalikan uang) → thanks → Hormat saya,
        The hotel will often reply Mohon maklum (please understand). maklum comes from Arabic «معلوم».
    grammar: id.prefix.se
    examples:
      - text: Saya kecewa karena kamar saya tidak sesuai dengan pesanan.
        ar_eg: أنا زعلان (مخذول) عشان الأوضة مش زي اللي حجزته.
        ar: أنا خائب الأمل لأن غرفتي لا تطابق الحجز.
        en: I'm disappointed because my room doesn't match my booking.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «أنا زعلان عشان أوضتي مش نضيفة زي الصورة»؟
      ar: أيّ جملة تعني «أنا خائب الأمل لأن غرفتي ليست بنظافة الصورة»؟
      en: Which sentence means "I'm disappointed because my room isn't as clean as the photo"?
    options:
      - Saya senang karena kamar saya sebersih foto.
      - Saya capek karena kamar saya tidak bersih.
      - Saya kecewa karena kamar saya tidak sebersih foto.
    answer: 2
    explain:
      ar_eg: kecewa = زعلان / مخذول (لما حاجة ما تطلعش زي ما كنت مستني).
      ar: kecewa = خائب الأمل (حين لا يأتي الشيء كما توقعت).
      en: kecewa = disappointed (when something isn't what you expected).
    words: [kecewa, bersih]
  - id: e02
    type: listen
    text: Mohon maaf sebelumnya, air panas di kamar saya mati sehari penuh.
    options:
      - Mohon maaf sebelumnya, air panas di kamar saya mati seminggu penuh.
      - Mohon maaf sebelumnya, air panas di kamar saya mati sehari penuh.
      - Mohon maaf sebelumnya, AC di kamar saya mati sehari penuh.
    answer: 1
    meaning:
      ar_eg: آسف مقدمًا، المية السخنة في أوضتي كانت مقطوعة يوم بحاله.
      ar: أعتذر مسبقًا، انقطع الماء الساخن في غرفتي يومًا كاملًا.
      en: Sorry in advance, but the hot water in my room was off for a whole day.
    words: [sebelumnya]
  - id: e03
    type: match_pairs
    pairs:
      - text: kecewa
        ar_eg: زعلان / مخذول
        ar: خائب الأمل
        en: disappointed
      - text: pihak hotel
        ar_eg: إدارة الفندق
        ar: إدارة الفندق
        en: the hotel (management)
      - text: mohon maklum
        ar_eg: أرجو تفهّمك
        ar: نرجو تفهّمكم
        en: please understand
      - text: secepatnya
        ar_eg: في أسرع وقت
        ar: في أسرع وقت
        en: as soon as possible
      - text: tidak sesuai dengan
        ar_eg: مش زي / مش مطابق لـ
        ar: غير مطابق لـ
        en: not in line with
    words: [kecewa, pihak, maklum, secepatnya, sesuai]
  - id: e04
    type: fill_blank
    sentence: Kamar saya tidak ___ foto di situs web hotel.
    meaning:
      ar_eg: (اكتب se- + bersih) أوضتي مش نضيفة زي الصورة اللي على موقع الفندق.
      ar: (اكتب se- مع bersih) غرفتي ليست بنظافة الصورة على موقع الفندق.
      en: (Write se- + bersih.) My room isn't as clean as the photo on the hotel website.
    answers: [sebersih]
    words: [bersih]
  - id: e05
    type: build_sentence
    source:
      ar_eg: بطلب من إدارة الفندق تصلّح التكييف في أسرع وقت.
      ar: أطلب من إدارة الفندق إصلاح المكيّف في أسرع وقت.
      en: I'm asking the hotel to repair the AC as soon as possible.
    answer: Saya minta pihak hotel memperbaiki AC-nya secepatnya.
    alternatives:
      - Saya minta pihak hotel secepatnya memperbaiki AC-nya.
    distractors: [sebaiknya, sebuah]
    words: [pihak, memperbaiki, secepatnya]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا زعلان عشان الأوضة مش زي اللي حجزته.
      ar: أنا خائب الأمل لأن الغرفة لا تطابق حجزي.
      en: I'm disappointed because the room doesn't match my booking.
    answers:
      - Saya kecewa karena kamarnya tidak sesuai dengan pesanan saya.
      - Saya kecewa karena kamarnya tidak sesuai dengan pesanan saya
      - Saya kecewa karena kamar saya tidak sesuai dengan pesanan saya.
      - Saya kecewa karena kamar saya tidak sesuai dengan pesanan saya
      - Saya kecewa karena kamarnya tidak sesuai dengan pesanan.
      - Saya kecewa karena kamarnya tidak sesuai dengan pesanan
      - Saya kecewa karena kamar ini tidak sesuai dengan pesanan saya.
      - Saya kecewa sebab kamarnya tidak sesuai dengan pesanan saya.
      - Saya kecewa karena kamarnya tidak sesuai pesanan saya.
      - Aku kecewa karena kamarnya tidak sesuai dengan pesananku.
      - "Saya kecewa karena kamarnya nggak sesuai dengan pesanan saya."
      - "Saya kecewa karena kamarnya nggak sesuai dengan pesanan saya"
      - "Saya kecewa karena kamar saya nggak sesuai dengan pesanan saya."
      - "Saya kecewa karena kamar saya nggak sesuai dengan pesanan saya"
      - "Saya kecewa karena kamarnya nggak sesuai dengan pesanan."
      - "Saya kecewa karena kamarnya nggak sesuai dengan pesanan"
      - "Saya kecewa karena kamar ini nggak sesuai dengan pesanan saya."
      - "Saya kecewa sebab kamarnya nggak sesuai dengan pesanan saya."
      - "Saya kecewa karena kamarnya nggak sesuai pesanan saya."
      - "Aku kecewa karena kamarnya nggak sesuai dengan pesananku."
    words: [kecewa, sesuai]
  - id: e07
    type: dictation
    text: Mohon maklum, pihak hotel akan memperbaiki AC-nya secepatnya.
    meaning:
      ar_eg: أرجو تفهّمك، إدارة الفندق هتصلّح التكييف في أسرع وقت.
      ar: نرجو تفهّمكم، ستُصلح إدارة الفندق المكيّف في أسرع وقت.
      en: Please understand; the hotel will repair the AC as soon as possible.
    words: [maklum, pihak, memperbaiki, secepatnya]
  - id: e08
    type: speaking
    text: Dengan hormat, saya ingin menyampaikan keluhan tentang kamar 12.
    meaning:
      ar_eg: تحية طيبة وبعد، حابب أقدّم شكوى بخصوص أوضة 12.
      ar: تحية طيبة وبعد، أودّ تقديم شكوى بشأن الغرفة 12.
      en: Dear Sir or Madam, I would like to make a complaint about room 12.
    words: [hormat, menyampaikan, keluhan]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: الفندق عايز يقولك «اعذرنا / افهم ظروفنا». يقول إيه؟
      ar: يريد الفندق أن يقول «نرجو تفهّمكم». ماذا يقول؟
      en: The hotel wants to say "please bear with us". Which phrase?
    options:
      - Mohon maklum, Pak.
      - Hormat saya, Pak.
      - Sebaiknya, Pak.
    answer: 0
    explain:
      ar_eg: maklum من «معلوم»، يعني «مفهوم». Mohon maklum = اعذرنا / افهم ظروفنا.
      ar: maklum من «معلوم»، وMohon maklum = نرجو أن تعذرنا وتتفهّم.
      en: maklum comes from «معلوم» (known, understood). Mohon maklum = please bear with us.
    words: [maklum]
dialogue:
  title: Jawaban manajer
  lines:
    - speaker: Manajer
      text: Selamat pagi, Pak Mohamed. Saya manajer hotel. Saya sudah membaca email Bapak.
      ar_eg: صباح الخير يا أستاذ محمد. أنا مديرة الفندق. قريت الإيميل بتاعك.
      ar: صباح الخير يا سيد محمد. أنا مديرة الفندق، وقد قرأتُ رسالتك.
      en: Good morning, Mr Mohamed. I'm the hotel manager. I've read your email.
    - speaker: Mohamed
      text: Terima kasih, Bu. Sebenarnya, saya kecewa. Air panasnya mati sehari penuh.
      ar_eg: شكرًا يا مدام. الحقيقة إني زعلان. المية السخنة كانت مقطوعة يوم بحاله.
      ar: شكرًا يا سيدتي. في الحقيقة أنا خائب الأمل، فقد انقطع الماء الساخن يومًا كاملًا.
      en: Thank you. Actually, I'm disappointed. The hot water was off for a whole day.
    - speaker: Manajer
      text: Mohon maaf dan mohon maklum, Pak. Petugas kami sudah memperbaikinya.
      ar_eg: آسفين جدًا واعذرنا يا فندم. الموظف بتاعنا صلّحها خلاص.
      ar: نعتذر ونرجو تفهّمك يا سيدي. لقد أصلحها موظفنا.
      en: We apologise and ask for your understanding, sir. Our staff have fixed it.
    - speaker: Mohamed
      text: Baik. Tapi kamar saya juga tidak sebersih foto di situs web.
      ar_eg: ماشي. بس أوضتي كمان مش نضيفة زي الصورة اللي على الموقع.
      ar: حسنًا. لكن غرفتي أيضًا ليست بنظافة الصورة على الموقع.
      en: All right. But my room also isn't as clean as the photo on the website.
    - speaker: Manajer
      text: Kami minta maaf. Pihak hotel akan mengembalikan uang Bapak untuk satu malam.
      ar_eg: إحنا آسفين. الفندق هيرجّعلك فلوس ليلة.
      ar: نعتذر إليك. ستردّ إدارة الفندق إليك ثمن ليلة واحدة.
      en: We apologise. The hotel will refund you for one night.
new_words:
  - word: kecewa
    pos: adjective
    ar_eg: زعلان / مخذول
    ar: خائب الأمل
    en: disappointed
  - word: pihak
    pos: noun
    ar_eg: طرف / جهة (pihak hotel = إدارة الفندق)
    ar: طرف / جهة (pihak hotel = إدارة الفندق)
    en: party, side (pihak hotel = the hotel management)
  - word: maklum
    pos: adjective
    ar_eg: مفهوم (mohon maklum = اعذرنا)
    ar: معلوم (mohon maklum = نرجو التفهّم)
    en: understood (mohon maklum = please understand)
    arabic: معلوم
