schema: kabar.lesson/v1
id: bipa5.u02.l07
language: id
title: Berita dari parlemen
can_do:
  ar_eg: 'تفهم خبر سياسي: الوزارة والبرلمان والمجلس، الصلاحيات، والجدل وعواقبه.'
  ar: 'أن تفهم خبرًا سياسيًا: الحكومة والبرلمان والمجلس، والصلاحيات، والجدل وعواقبه.'
  en: 'Follow political news: cabinet, parliament and assembly, powers, and the controversy and its consequences.'
slides:
  - title: Bahasa berita politik
    body:
      ar_eg: |
        kabinet = مجلس الوزرا (الحكومة)، parlemen = برلمان (DPR في إندونيسيا)، majelis = مجلس (MPR = Majelis Permusyawaratan Rakyat).
        wewenang = صلاحية أو سلطة: punya wewenang = ليه صلاحية، deputi = نايب (deputi menteri).
        kontroversi = جدل، perdebatan = نقاش حامي، konsekuensi = عاقبة أو نتيجة.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: udah = sudah، mindahin = memindahkan، terus = lalu.
      ar: |
        kabinet = مجلس الوزراء، parlemen = برلمان (DPR في إندونيسيا)، majelis = مجلس (MPR = Majelis Permusyawaratan Rakyat).
        wewenang = صلاحية، سلطة: punya wewenang = له صلاحية، deputi = نائب (deputi menteri).
        kontroversi = جدل، perdebatan = مناظرة، نقاش حادّ، konsekuensi = عاقبة، نتيجة.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: udah = sudah، mindahin = memindahkan، terus = lalu.
      en: |
        kabinet = cabinet, parlemen = parliament (the DPR in Indonesia), majelis = assembly (MPR = People's Consultative Assembly).
        wewenang = authority, power: punya wewenang = to have the authority, deputi = deputy (deputi menteri).
        kontroversi = controversy, perdebatan = debate, argument, konsekuensi = consequence.
        The dialogue uses street forms; the formal ones are beside them: udah = sudah, mindahin = memindahkan, terus = lalu.
    examples:
      - text: Rencana itu menimbulkan kontroversi di parlemen.
        ar_eg: الخطة دي عملت جدل في البرلمان.
        ar: أثارت تلك الخطة جدلًا في البرلمان.
        en: The plan caused controversy in parliament.
      - text: Presiden mengumumkan susunan kabinet baru.
        ar_eg: الرئيس أعلن تشكيل الوزارة الجديدة.
        ar: أعلن الرئيس تشكيلة الحكومة الجديدة.
        en: The president announced the new cabinet line-up.
      - text: Siapa yang punya wewenang untuk memutuskan?
        ar_eg: مين اللي ليه صلاحية ياخد القرار؟
        ar: من له صلاحية اتخاذ القرار؟
        en: Who has the authority to decide?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kabinet
        ar_eg: الوزارة
        ar: مجلس الوزراء
        en: cabinet
      - text: parlemen
        ar_eg: برلمان
        ar: برلمان
        en: parliament
      - text: majelis
        ar_eg: مجلس
        ar: مجلس
        en: assembly
      - text: wewenang
        ar_eg: صلاحية
        ar: صلاحية، سلطة
        en: authority
    words: [kabinet, parlemen, majelis, wewenang]
  - id: e02
    type: match_pairs
    pairs:
      - text: deputi
        ar_eg: نايب
        ar: نائب
        en: deputy
      - text: kontroversi
        ar_eg: جدل
        ar: جدل
        en: controversy
      - text: perdebatan
        ar_eg: نقاش حامي
        ar: مناظرة
        en: debate
      - text: konsekuensi
        ar_eg: عاقبة
        ar: عاقبة
        en: consequence
    words: [deputi, kontroversi, perdebatan, konsekuensi]
  - id: e03
    type: listen
    text: Perdebatan di parlemen berlangsung sampai tengah malam.
    question:
      ar_eg: النقاش فضل لحد إمتى؟
      ar: إلى متى استمرت المناظرة؟
      en: How long did the debate last?
    options: [لنص الليل, ساعة واحدة, للصبح بس]
    answer: 0
    meaning:
      ar_eg: النقاش في البرلمان فضل لنص الليل.
      ar: استمرت المناظرة في البرلمان حتى منتصف الليل.
      en: The debate in parliament went on until midnight.
    words: [perdebatan, parlemen]
  - id: e04
    type: fill_blank
    sentence: Menteri dan ___-nya hadir dalam rapat itu.
    meaning:
      ar_eg: الوزير و___ ـه حضروا الاجتماع.
      ar: حضر الوزير و___ ـه الاجتماع.
      en: The minister and his ___ attended the meeting.
    options: [deputi, majelis, konsekuensi]
    answers: [deputi]
    words: [deputi, majelis, konsekuensi]
    explain:
      ar_eg: اللي بيحضر مع الوزير deputi (نائب). majelis = مجلس وkonsekuensi = عاقبة، ومايتقالش «الوزير ومجلسه» هنا.
      ar: الذي يحضر مع الوزير هو deputi (النائب). أما majelis فالمجلس، وkonsekuensi العاقبة.
      en: The person with the minister is his deputi (deputy). majelis is an assembly and konsekuensi a consequence.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الناس مختلفين جامد على قرار والكل بيتكلم عنه. ده إيه؟
      ar: الناس منقسمون بشدّة حول قرار والجميع يتحدث عنه. ما هذا؟
      en: People are sharply divided over a decision and everyone talks about it. What is it?
    options: [wewenang, kabinet, kontroversi]
    answer: 2
    explain:
      ar_eg: kontroversi = جدل.
      ar: kontroversi = جدل.
      en: kontroversi = controversy.
    words: [wewenang, kabinet, kontroversi]
  - id: e06
    type: fill_blank
    sentence: Setiap keputusan punya ___, baik maupun buruk.
    meaning:
      ar_eg: كل قرار ليه ___، كويسة أو وحشة.
      ar: لكل قرار ___، حسنة أو سيئة.
      en: Every decision has ___, good or bad.
    options: [konsekuensi, parlemen, wewenang]
    answers: [konsekuensi]
    words: [konsekuensi, parlemen, wewenang]
    explain:
      ar_eg: «ليه نتايج كويسة أو وحشة» = konsekuensi. parlemen = برلمان وwewenang = صلاحية، والقرار مش «ليه برلمان».
      ar: للقرار عواقب حسنة أو سيئة = konsekuensi. أما parlemen فالبرلمان، وwewenang الصلاحية.
      en: A decision has konsekuensi, good or bad. parlemen (parliament) and wewenang (authority) don't fit.
  - id: e07
    type: multiple_choice
    question: MPR adalah singkatan dari ___ Permusyawaratan Rakyat.
    options: [Deputi, Majelis, Kabinet]
    answer: 1
    explain:
      ar_eg: MPR = Majelis Permusyawaratan Rakyat (مجلس الشورى الشعبي).
      ar: MPR = Majelis Permusyawaratan Rakyat (مجلس الشورى الشعبي).
      en: MPR = People's Consultative Assembly.
    words: [deputi, majelis, kabinet]
  - id: e08
    type: build_sentence
    source:
      ar_eg: البرلمان ما عندوش صلاحية في الموضوع ده.
      ar: ليس للبرلمان صلاحية في هذا الأمر.
      en: Parliament has no authority on this matter.
    answer: Parlemen tidak punya wewenang untuk masalah ini.
    distractors: [kabinet, deputi]
    words: [parlemen, wewenang]
    explain:
      ar_eg: «صلاحية» = wewenang، والفاعل Parlemen. kabinet = مجلس الوزرا وdeputi = نايب، مش في الجملة.
      ar: «صلاحية» = wewenang، والفاعل Parlemen. أما kabinet فمجلس الوزراء، وdeputi النائب، وليسا في الجملة.
      en: "\"Authority\" is wewenang, and the subject is Parlemen. kabinet (cabinet) and deputi (deputy) aren't in the sentence."
  - id: e09
    type: translate
    direction: from_target
    source_text: Presiden mengumumkan kabinet baru kemarin.
    answers_meaning:
      ar_eg: [الرئيس أعلن الوزارة الجديدة امبارح, امبارح الرئيس أعلن الحكومة الجديدة]
      ar: [أعلن الرئيس الحكومة الجديدة أمس, أعلن الرئيس أمس مجلس الوزراء الجديد]
      en: [The president announced the new cabinet yesterday, Yesterday the president announced a new cabinet]
    words: [kabinet]
  - id: e10
    type: speaking
    text: Perdebatan dan kontroversi ini membawa konsekuensi politik.
    meaning:
      ar_eg: النقاش والجدل ده جابوا عواقب سياسية.
      ar: جلبت هذه المناظرة وهذا الجدل عواقب سياسية.
      en: This debate and controversy have political consequences.
    words: [perdebatan, kontroversi, konsekuensi]
dialogue:
  lines:
    - speaker: Rina
      text: Kamu udah baca berita pagi ini? Ada perdebatan panas di parlemen, lho.
      ar_eg: قريت أخبار النهارده الصبح؟ فيه نقاش سخن في البرلمان.
      ar: هل قرأت أخبار هذا الصباح؟ هناك نقاش حامٍ في البرلمان.
      en: Did you read this morning's news? There's a heated debate in parliament.
    - speaker: Mohamed
      text: Soal ibu kota baru lagi, ya?
      ar_eg: عن العاصمة الجديدة تاني؟
      ar: حول العاصمة الجديدة مرة أخرى؟
      en: About the new capital again?
    - speaker: Rina
      text: Iya. Ada kontroversi soal siapa yang punya wewenang mindahin kantor-kantor kabinet.
      ar_eg: أيوه. فيه جدل عن مين ليه صلاحية ينقل مكاتب الوزارة.
      ar: نعم. هناك جدل حول من يملك صلاحية نقل مكاتب الحكومة.
      en: Yes. There's controversy over who has the authority to move the cabinet offices.
    - speaker: Mohamed
      text: Terus deputi menteri bilang apa?
      ar_eg: نايب الوزير قال إيه؟
      ar: ماذا قال نائب الوزير؟
      en: What did the deputy minister say?
    - speaker: Rina
      text: Katanya semua konsekuensinya udah dihitung. Tapi banyak orang belum yakin, sih.
      ar_eg: قال إن كل العواقب اتحسبت. بس ناس كتير لسه مش مقتنعة.
      ar: قال إن كل العواقب محسوبة، لكن كثيرين غير مقتنعين.
      en: He said all the consequences have been weighed. But many people aren't convinced.
