schema: kabar.lesson/v1
id: bipa1.u07.l04
language: id
title: Indah sekali!
can_do:
  ar_eg: تقول «قوي» بـ sekali وsangat.
  ar: أن تقول «جدًّا» بـ sekali وsangat.
  en: Say very with sekali and sangat.
slides:
  - title: enak sekali
    body:
      ar_eg: |
        أسهل طريقة تقول «أوي»: حط sekali بعد الصفة، زي «حلو أوي» بالظبط:
        enak sekali = حلو أوي، indah sekali = جميل جدًا.
        دي العادية والمؤدبة، تنفع مع أي حد.
        (sekali كمان معناها «مرة واحدة» زي ما شفنا في sekali seminggu، السياق بيفرّق.)
      ar: |
        أسهل طريقة للتعبير عن «جدًا» أن تضع sekali بعد الصفة:
        enak sekali = لذيذ جدًا، indah sekali = جميل جدًا.
        وهي محايدة مهذبة تصلح مع الجميع.
        (وsekali تعني أيضًا «مرة واحدة» كما في sekali seminggu، والسياق يفرّق.)
      en: |
        The easiest "very": put sekali after the adjective, just like «حلو أوي»:
        enak sekali = really tasty, indah sekali = very beautiful.
        Neutral and polite — fine with anyone.
        (sekali also means "once", as in sekali seminggu; context tells you which.)
    grammar: id.intensifier.basic
    examples:
      - text: Pemandangannya indah sekali.
        ar_eg: المنظر جميل أوي.
        ar: المنظر جميل جدًا.
        en: The view is very beautiful.
  - title: sangat enak
    body:
      ar_eg: |
        sangat بتيجي قبل الصفة، وهي أرسمي شوية (كتابة، أخبار، كلام مؤدب):
        sangat enak = لذيذ جدًا، sangat terkenal = مشهور جدًا.
        ماتقولش «enak sangat»: sangat دايمًا قبل.
      ar: |
        sangat تأتي قبل الصفة، وهي أكثر رسمية (في الكتابة والأخبار):
        sangat enak = لذيذ جدًا، sangat terkenal = مشهور جدًا.
        ولا يُقال «enak sangat»؛ فـ sangat تتقدم دائمًا.
      en: |
        sangat goes before the adjective and is a bit more formal (writing, news):
        sangat enak = very tasty, sangat terkenal = very famous.
        Never "enak sangat" — sangat always comes first.
    grammar: id.intensifier.basic
    examples:
      - text: Bali sangat terkenal.
        ar_eg: بالي مشهورة جدًا.
        ar: بالي مشهورة جدًا.
        en: Bali is very famous.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة صح؟
      ar: أيّها صحيح؟
      en: Which one is correct?
    options: [Enak sangat!, Sekali enak!, Sangat enak!]
    answer: 2
    explain:
      ar_eg: sangat قبل الصفة، وsekali بعدها.
      ar: sangat قبل الصفة، وsekali بعدها.
      en: sangat goes before the adjective; sekali goes after.
    words: [sangat]
  - id: e02
    type: listen
    text: Pemandangannya indah sekali.
    options: [Makanannya enak sekali., Pemandangannya indah sekali., Pemandangannya sangat indah.]
    answer: 1
    words: [pemandangan, indah, sekali]
  - id: e03
    type: fill_blank
    sentence: Bali ___ terkenal.
    meaning:
      ar_eg: بالي مشهورة جدًا.
      ar: بالي مشهورة جدًا.
      en: Bali is very famous.
    options: [sangat, banget, sekali]
    answers: [sangat]
    explain:
      ar_eg: الفراغ قبل الصفة، والوحيدة اللي بتيجي قبل هي sangat.
      ar: الفراغ قبل الصفة، ولا يتقدمها إلا sangat.
      en: The gap is before the adjective — only sangat goes there.
    words: [sangat, terkenal]
  - id: e04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: صح، المنظر جميل جدًا.
      ar: صحيح، المنظر جميل جدًا.
      en: True, the view is very beautiful.
    answers: ['Benar, pemandangannya indah sekali.', 'Betul, pemandangannya indah sekali.', 'Bener, pemandangannya indah banget.', 'Benar, pemandangannya sangat indah.', 'Betul, pemandangannya sangat indah.', 'Bener, pemandangannya indah sekali.', 'Betul, pemandangannya indah banget.', 'Benar, pemandangannya indah banget.']
    explain:
      ar_eg: صح = benar أو betul، وفي الشارع bener.
      ar: صحيح = benar أو betul، وفي العامية bener.
      en: True = benar or betul; on the street, bener.
    words: [pemandangan, indah, benar, betul]
  - id: e05
    type: match_pairs
    pairs:
      - text: indah
        ar_eg: جميل
        ar: جميل
        en: beautiful
      - text: pemandangan
        ar_eg: منظر
        ar: منظر
        en: view
      - text: terkenal
        ar_eg: مشهور
        ar: مشهور
        en: famous
      - text: betul
        ar_eg: صح
        ar: صحيح
        en: right, true
    words: [indah, pemandangan, terkenal, betul]
  - id: e06
    type: build_sentence
    source:
      ar_eg: بالي مشهورة جدًا.
      ar: بالي مشهورة جدًّا.
      en: Bali is very famous.
    answer: Bali sangat terkenal.
    distractors: [indah, kecil]
    words: [sangat, terkenal]
    explain:
      ar_eg: Bali + sangat terkenal (مشهورة جدًا). indah وkecil زيادة.
      ar: Bali sangat terkenal. indah وkecil زائدتان.
      en: Bali + sangat terkenal. indah and kecil are extra.
  - id: e07
    type: speaking
    text: Pemandangannya indah sekali!
    meaning:
      ar_eg: المنظر حلو قوي!
      ar: المنظر جميل جدًّا!
      en: The view is so beautiful!
    words: [pemandangan, indah, sekali]
  - id: e08
    type: multiple_choice
    question: Bali sangat terkenal, ya?
    question_meaning:
      ar_eg: «بالي مشهورة جدًا، مش كده؟» — توافق إزاي؟
      ar: «بالي مشهورة جدًا، أليس كذلك؟» — كيف توافق؟
      en: '"Bali is very famous, isn''t it?" — how do you agree?'
    options: ['Betul!', 'Sekali!', 'Sangat!']
    answer: 0
    words: [betul]
    explain:
      ar_eg: "علشان توافق: Betul! = صح! Sekali وSangat معناهم «جدًا» ومش رد."
      ar: "للموافقة: Betul! أي صحيح."
      en: Betul! = right!
  - id: e09
    type: speaking
    text: Bener banget, pemandangannya sangat indah.
    meaning:
      ar_eg: عندك حق والله، المنظر جميل جدًا.
      ar: صحيح تمامًا، المنظر جميل جدًا.
      en: So true, the view is very beautiful.
    words: [benar, pemandangan, sangat, indah]
  - id: e10
    type: fill_blank
    sentence: Pantai Kuta sangat terkenal. Itu ___!
    meaning:
      ar_eg: شاطئ كوتا مشهور جدًا. ده صح!
      ar: شاطئ كوتا مشهور جدًا. هذا صحيح!
      en: Kuta Beach is very famous. That's true!
    options: [benar, sangat, sekali]
    answers: [benar]
    explain:
      ar_eg: itu benar = ده صح. sangat وsekali محتاجين صفة جنبهم.
      ar: itu benar = هذا صحيح، أما sangat وsekali فتحتاجان صفة.
      en: itu benar = that's true; sangat and sekali need an adjective next to them.
    words: [benar]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, ini foto Bali.
      ar_eg: محمد، دي صورة بالي.
      ar: محمد، هذه صورة من بالي.
      en: Mohamed, this is a photo of Bali.
    - speaker: Mohamed
      text: Wah, pemandangannya indah sekali!
      ar_eg: الله، المنظر حلو قوي!
      ar: رائع، المنظر جميل جدًّا!
      en: Wow, the view is so beautiful!
    - speaker: Ni Luh
      text: Betul. Pantai Kuta sangat terkenal.
      ar_eg: صح. شاطئ كوتا مشهور جدًا.
      ar: صحيح. شاطئ كوتا مشهور جدًّا.
      en: True. Kuta Beach is very famous.
    - speaker: Mohamed
      text: Aku ingin ke Bali!
      ar_eg: نفسي أروح بالي!
      ar: أتمنى الذهاب إلى بالي!
      en: I'd love to go to Bali!
new_words:
  - word: sekali
    pos: adverb
    ar_eg: "أوي (بعد الصفة)؛ في الشارع: banget (enak banget)"
    ar: "جدًا (بعد الصفة)؛ في الشارع: banget (enak banget)"
    en: "very (after the adjective); on the street: banget (enak banget)"
  - word: sangat
    pos: adverb
    ar_eg: جدًا (قبل الصفة، أرسمي)
    ar: جدًا (قبل الصفة)
    en: very (before the adjective, more formal)
  - word: indah
    pos: adjective
    ar_eg: جميل
    ar: جميل
    en: beautiful
  - word: pemandangan
    pos: noun
    ar_eg: منظر
    ar: منظر
    en: view, scenery
  - word: terkenal
    pos: adjective
    ar_eg: مشهور
    ar: مشهور
    en: famous
  - word: betul
    pos: adjective
    ar_eg: صح
    ar: صحيح
    en: right, true
  - word: benar / bener
    pos: adjective
    ar_eg: صح، حقيقي (زي betul)؛ في الشارع bener (bener banget = عندك حق والله)
    ar: صحيح، حقيقي (مثل betul)؛ في العامية bener
    en: true, right (like betul); on the street bener (bener banget = so true)
review:
  status: draft
  verified: false
