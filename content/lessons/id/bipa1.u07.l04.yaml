schema: kabar.lesson/v1
id: bipa1.u07.l04
language: id
title: Hobi teman baru
can_do:
  ar_eg: تدردش عن الهوايات مع صاحب جديد.
  ar: أن تتحدث عن الهوايات مع صديق جديد.
  en: Chat about hobbies with a new friend.
slides:
  - title: Hobimu apa?
    body:
      ar_eg: |
        عشان تدردش عن الهوايات:
        - Hobimu apa? / Apa hobimu? = إيه هوايتك؟
        - Hobi saya … / Saya suka … = هوايتي … / بحب …
        - Kamu bisa …? = بتعرف …؟ — Bisa! / Belum bisa.
        - Kamu sering …? = بتعمل … كتير؟
        - Bagaimana kalau kita …? = إيه رأيك نـ …؟
        وأول ما تتعرف على حد جديد قول: Salam kenal! = اتشرفنا! (salam من العربي «سلام»)
      ar: |
        للحديث عن الهوايات:
        - Hobimu apa? / Apa hobimu? = ما هوايتك؟
        - Hobi saya … / Saya suka … = هوايتي … / أحب …
        - Kamu bisa …? = هل تُحسن …؟ — Bisa! / Belum bisa.
        - Kamu sering …? = هل تفعل … كثيرًا؟
        - Bagaimana kalau kita …? = ما رأيك أن …؟
        وعند التعارف قل: Salam kenal! = تشرّفنا! (وsalam من «سلام»)
      en: |
        To chat about hobbies:
        - Hobimu apa? / Apa hobimu? = What's your hobby?
        - Hobi saya … / Saya suka … = My hobby is … / I like …
        - Kamu bisa …? = Can you …? — Bisa! / Belum bisa.
        - Kamu sering …? = Do you often …?
        - Bagaimana kalau kita …? = How about we …?
        When you meet someone new: Salam kenal! = Nice to meet you! (salam ← Arabic «سلام»)
    grammar: id.verb.modal
    examples:
      - text: Hobi saya membaca dan bermain sepak bola.
        ar_eg: هوايتي القراية ولعب الكورة.
        ar: هوايتي القراءة ولعب كرة القدم.
        en: My hobbies are reading and playing football.
  - title: Seru sekali!
    body:
      ar_eg: |
        وعشان تبيّن حماسك، قوّي الصفة: Seru sekali! (ممتع أوي)، Hebat banget! (جامد أوي، مع صحابك).
        والـ nongkrong (القعدة في كافيه أو قهوة مع الصحاب) هواية لوحدها في جاكرتا! الكلمة عامية.
      ar: |
        ولتُظهر حماسك قوِّ الصفة: Seru sekali! (ممتع جدًا)، Hebat banget! (رائع جدًا، مع الأصدقاء).
        والـ nongkrong (الجلوس مع الأصحاب في مقهى) هواية قائمة بذاتها في جاكرتا، والكلمة عامية.
      en: |
        Show enthusiasm by intensifying: Seru sekali! (so fun), Hebat banget! (awesome — with friends).
        nongkrong (hanging out at a café or warung) is a hobby in itself in Jakarta. The word is casual.
    grammar: id.intensifier.basic
    examples:
      - text: Tari Bali indah sekali!
        ar_eg: الرقص البالي جميل أوي!
        ar: الرقص البالي جميل جدًا!
        en: Balinese dance is so beautiful!
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تسأل صاحبك الجديد عن هوايته.
      ar: تريد أن تسأل صديقك الجديد عن هوايته.
      en: You want to ask your new friend about their hobby.
    options: ["Siapa hobimu?", "Bagaimana hobimu?", "Apa hobimu?"]
    answer: 2
    explain:
      ar_eg: «إيه هوايتك؟» = Apa hobimu? (أو Hobimu apa?).
      ar: «ما هوايتك؟» = Apa hobimu? (أو Hobimu apa?).
      en: '"What''s your hobby?" = Apa hobimu? (or Hobimu apa?).'
    words: [hobi]
  - id: e02
    type: listen
    text: Saya suka menari.
    options: ["Saya suka menari.", "Saya suka menulis.", "Saya suka makan."]
    answer: 0
    words: [suka, menari]
  - id: e03
    type: fill_blank
    sentence: Saya tidak ___ menari.
    meaning:
      ar_eg: مابعرفش أرقص.
      ar: لا أُحسن الرقص.
      en: I can't dance.
    answers: [bisa]
    words: [bisa, menari]
  - id: e04
    type: fill_blank
    sentence: Kamu ___ coba!
    meaning:
      ar_eg: لازم تجرب!
      ar: يجب أن تجرّب!
      en: You must try (it)!
    answers: [harus]
    words: [harus, coba]
  - id: e05
    type: build_sentence
    source:
      ar_eg: بحب القراية ولعب الكورة.
      ar: أحب القراءة ولعب كرة القدم.
      en: I like reading and playing football.
    answer: Saya suka membaca dan bermain sepak bola.
    distractors: [harus, berenang]
    words: [suka, membaca, sepak bola]
  - id: e06
    type: build_sentence
    source:
      ar_eg: إيه رأيك نقعد في كافيه في كيمانج؟
      ar: ما رأيك أن نجلس في مقهى في كيمانغ؟
      en: How about we hang out in Kemang?
    answer: Bagaimana kalau kita nongkrong di Kemang?
    distractors: [berapa, sana]
    words: [bagaimana kalau, nongkrong]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هوايتي العوم.
      ar: هوايتي السباحة.
      en: My hobby is swimming.
    answers:
      - Hobi saya berenang.
      - Hobi saya berenang
      - Hobiku berenang.
      - Hobi aku berenang.
      - Hobi saya adalah berenang.
      - Saya suka berenang.
    words: [hobi, berenang]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: نفسي أشوف الرقص البالي.
      ar: أتمنى أن أشاهد الرقص البالي.
      en: I'd love to see a Balinese dance.
    answers:
      - Saya ingin melihat tari Bali.
      - Saya ingin menonton tari Bali.
      - Saya mau melihat tari Bali.
      - Saya mau menonton tari Bali.
      - Aku ingin melihat tari Bali.
      - Aku ingin menonton tari Bali.
      - Aku mau lihat tari Bali.
      - Saya ingin lihat tari Bali.
    words: [ingin, tari]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إنت بتلعب كورة كتير؟
      ar: هل تلعب كرة القدم كثيرًا؟
      en: Do you often play football?
    answers:
      - Kamu sering bermain sepak bola?
      - Kamu sering main sepak bola?
      - Anda sering bermain sepak bola?
      - Apakah kamu sering bermain sepak bola?
      - Apakah Anda sering bermain sepak bola?
      - Kamu sering bermain sepak bola
    words: [sering, sepak bola]
  - id: e10
    type: translate
    direction: from_target
    source_text: Tari Bali indah sekali!
    answers_meaning:
      ar_eg: ["الرقص البالي جميل أوي!", "الرقص البالي حلو أوي", "رقص بالي جميل جدًا"]
      ar: ["الرقص البالي جميل جدًا!", "رقص بالي جميل جدًا", "الرقصة البالية جميلة جدًا"]
      en: ["Balinese dance is so beautiful!", "Balinese dance is very beautiful", "The Balinese dance is really beautiful"]
    words: [tari, indah, sekali]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اتشرفنا! (لما تتعرف على حد)
      ar: تشرّفنا! (عند التعارف)
      en: Nice to meet you!
    answers:
      - Salam kenal!
      - Salam kenal
      - Salam kenal, ya!
      - Senang berkenalan!
      - Senang berkenalan dengan Anda.
      - Senang bertemu dengan Anda.
    words: [salam kenal]
  - id: e12
    type: speaking
    text: Boleh! Sampai jumpa hari Sabtu!
    meaning:
      ar_eg: ماشي! أشوفك يوم السبت!
      ar: موافق! إلى اللقاء يوم السبت!
      en: Sure! See you on Saturday!
dialogue:
  title: Teman baru di Kemang
  lines:
    - speaker: Ni Luh
      text: Halo! Saya Ni Luh, dari Bali.
      ar_eg: أهلًا! أنا ني لوه، من بالي.
      ar: مرحبًا! أنا ني لوه، من بالي.
      en: Hi! I'm Ni Luh, from Bali.
    - speaker: Mohamed
      text: Halo, Ni Luh! Nama saya Mohamed. Saya orang Mesir.
      ar_eg: أهلًا يا ني لوه! اسمي محمد. أنا مصري.
      ar: مرحبًا يا ني لوه! اسمي محمد، وأنا مصري.
      en: Hi, Ni Luh! My name is Mohamed. I'm Egyptian.
    - speaker: Ni Luh
      text: Salam kenal! Apa hobimu, Mohamed?
      ar_eg: اتشرفنا! إيه هوايتك يا محمد؟
      ar: تشرّفنا! ما هوايتك يا محمد؟
      en: Nice to meet you! What's your hobby, Mohamed?
    - speaker: Mohamed
      text: Saya suka membaca dan bermain sepak bola. Kamu?
      ar_eg: بحب القراية ولعب الكورة. وإنتي؟
      ar: أحب القراءة ولعب كرة القدم. وأنتِ؟
      en: I like reading and playing football. You?
    - speaker: Ni Luh
      text: Saya suka menari. Tari Bali indah sekali!
      ar_eg: بحب الرقص. الرقص البالي جميل أوي!
      ar: أحب الرقص. الرقص البالي جميل جدًا!
      en: I like dancing. Balinese dance is so beautiful!
    - speaker: Mohamed
      text: Saya ingin melihat tari Bali! Kamu sering menari?
      ar_eg: نفسي أشوف الرقص البالي! بترقصي كتير؟
      ar: أتمنى أن أشاهد الرقص البالي! هل ترقصين كثيرًا؟
      en: I'd love to see Balinese dance! Do you dance often?
    - speaker: Ni Luh
      text: Ya, setiap hari Minggu.
      ar_eg: أيوه، كل يوم حد.
      ar: نعم، كل يوم أحد.
      en: Yes, every Sunday.
    - speaker: Mohamed
      text: Wah, hebat! Saya tidak bisa menari.
      ar_eg: يا سلام، جامد! أنا مابعرفش أرقص.
      ar: رائع! أنا لا أُحسن الرقص.
      en: Wow, awesome! I can't dance.
    - speaker: Ni Luh
      text: Tidak apa-apa! Bagaimana kalau kita nongkrong di Kemang hari Sabtu?
      ar_eg: ولا يهمك! إيه رأيك نقعد في كافيه في كيمانج يوم السبت؟
      ar: لا بأس! ما رأيك أن نلتقي في كيمانغ يوم السبت؟
      en: No problem! How about we hang out in Kemang on Saturday?
    - speaker: Mohamed
      text: Boleh! Sampai jumpa hari Sabtu!
      ar_eg: ماشي! أشوفك يوم السبت!
      ar: موافق! إلى اللقاء يوم السبت!
      en: Sure! See you on Saturday!
new_words:
  - word: salam kenal
