    ar_eg: اتشرفنا
    ar: تشرّفنا
    en: nice to meet you
    arabic: سلام
  - word: menari
    pos: verb
    ar_eg: يرقص
    ar: يرقص
    en: to dance
  - word: tari
    pos: noun
    ar_eg: رقص / رقصة
    ar: رقص / رقصة
    en: dance
  - word: hebat
    pos: adjective
    ar_eg: جامد / رائع
    ar: رائع
    en: great, awesome
  - word: tidak apa-apa
    pos: phrase
    ar_eg: ولا يهمك / مفيش مشكلة
    ar: لا بأس
    en: no problem, it's OK
  - word: nongkrong
    pos: verb
    ar_eg: يقعد مع الصحاب في كافيه أو قهوة (عامية)
    ar: يجلس مع الأصحاب في مقهى (عامية)
    en: to hang out (casual)
