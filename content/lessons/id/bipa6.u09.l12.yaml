schema: kabar.lesson/v1
id: bipa6.u09.l12
language: id
title: Ulangan Unit 9
can_do:
  ar_eg: ترفض وتتفاوض وتكتب إيميل شغل رسمي من غير ما تكسر العلاقة.
  ar: أن ترفض وتفاوض وتكتب رسالة عمل رسمية دون أن تُفسد العلاقة.
  en: Decline, negotiate and write a formal business email while keeping the relationship warm.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tawaran
        ar_eg: عرض
        ar: عرض
        en: offer
      - text: lampiran
        ar_eg: مرفق
        ar: مرفق
        en: attachment, enclosure
      - text: uang muka
        ar_eg: عربون / مقدّم
        ar: عربون
        en: deposit, down payment
      - text: kesepakatan
        ar_eg: اتفاق
        ar: اتّفاق
        en: agreement, deal
      - text: harga satuan
        ar_eg: سعر الوحدة
        ar: سعر الوحدة
        en: unit price
    words: [tawaran, lampiran, uang muka, kesepakatan, harga satuan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة بترفض بأدب وبتسيب الباب مفتوح؟
      ar: أيّ جملة ترفض بلطف وتترك الباب مفتوحًا؟
      en: Which sentence declines gently and leaves the door open?
    options:
      - Kami tidak mau tawaran Anda.
      - Sepertinya untuk sementara kami belum bisa.
      - Tawaran Anda jelek sekali.
    answer: 1
    words: [sepertinya, sementara, belum bisa, tawaran, halus]
  - id: e03
    type: fill_blank
    sentence: Kedua pihak akan ___ perjanjian itu hari Senin.
    meaning:
      ar_eg: الطرفين هيمضوا على الاتفاقية يوم الاتنين.
      ar: سيوقّع الطرفان الاتّفاقية يوم الإثنين.
      en: Both parties will sign the agreement on Monday.
    options: [menandatangani, menindaklanjuti, menawarkan]
    answers: [menandatangani]
    words: [menandatangani, perjanjian]
  - id: e04
    type: listen
    text: Pemasok itu menawarkan potongan harga lima persen untuk pesanan pertama.
    question:
      ar_eg: المورّد عرض إيه؟
      ar: ماذا عرض المورّد؟
      en: What did the supplier offer?
    options:
      - خصم خمسة في المية على أول طلبية.
      - خمسة كيلو ببلاش.
      - شحن مجاني لمدة خمس شهور.
    answer: 0
    words: [pemasok, menawarkan, potongan harga, pesanan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: لو سمحت أكّد ميعاد الدفع.
      ar: يُرجى تأكيد موعد الدفع.
      en: Please confirm the payment date.
    answer: Mohon konfirmasi tanggal pembayaran.
    distractors: [lampiran, pesanan]
    words: [konfirmasi, pembayaran]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيميل بيبدأ بـ «Dengan hormat». يقفل بإيه لو مبعوت من شركة؟
      ar: رسالة تبدأ بـ «Dengan hormat». بمَ تُختم إن كانت من شركة؟
      en: An email opens with "Dengan hormat". How does it close if it comes from a company?
    options:
      - Makasih ya, bye!
      - Salam kenal dari aku.
      - Atas perhatiannya, kami ucapkan terima kasih. Hormat kami.
    answer: 2
    words: [dengan hormat, atas perhatiannya, hormat kami]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: متابعةً لعرضنا، مرفق العقد.
      ar: إلحاقًا بعرضنا، نرفق العقد.
      en: Following up on our offer, the contract is attached.
    answers:
      - Menindaklanjuti penawaran kami, bersama ini kami kirimkan kontrak sebagai lampiran.
      - Menindaklanjuti penawaran kami, kontraknya ada di lampiran.
      - Menindaklanjuti penawaran kami, kontrak terlampir.
      - Menindaklanjuti penawaran kami, kami lampirkan kontraknya.
    words: [menindaklanjuti, penawaran, lampiran]
  - id: e08
    type: speaking
    text: Jangka waktu perjanjian ini satu tahun, dan uang mukanya tiga puluh persen.
    meaning:
      ar_eg: مدة الاتفاقية دي سنة، والعربون تلاتين في المية.
      ar: مدّة هذه الاتّفاقية سنة، والعربون ثلاثون في المئة.
      en: The term of this agreement is one year, and the deposit is thirty per cent.
    words: [jangka waktu, perjanjian, uang muka]
  - id: e09
    type: dictation
    text: Direksi berunding tentang promo untuk kuartal depan.
    meaning:
      ar_eg: مجلس الإدارة بيتفاوض على العروض للربع الجاي.
      ar: يتشاور مجلس الإدارة في العروض للربع القادم.
      en: The board is discussing promotions for next quarter.
    words: [direksi, berunding, promo, kuartal]
  - id: e10
    type: speaking
    text: Kemasan baru membuat rendang laris, dan harganya terjangkau.
    meaning:
      ar_eg: التغليف الجديد خلّى الرندانج عليه طلب، وسعره معقول.
      ar: جعل التغليف الجديد الرندانغ رائجًا، وسعره في المتناول.
      en: The new packaging made the rendang sell well, and it's affordable.
    words: [kemasan, laris, terjangkau]
  - id: e11
    type: match_pairs
    pairs:
      - text: waralaba
        ar_eg: فرانشايز
        ar: امتياز تجاري
        en: franchise
      - text: pelanggan setia
        ar_eg: زبون دايم
        ar: زبون وفيّ
        en: loyal customer
      - text: usulan
        ar_eg: اقتراح
        ar: اقتراح
        en: proposal
      - text: kemitraan
        ar_eg: شراكة
        ar: شراكة
        en: partnership
      - text: kompromi
        ar_eg: حل وسط
        ar: حلّ وسط
        en: compromise
      - text: grosir
        ar_eg: جملة
        ar: جملة
        en: wholesale
    words: [waralaba, pelanggan setia, usulan, kemitraan, kompromi, grosir]
  - id: e12
    type: listen
    text: Pembahasan cabang baru ditunda, tetapi promosi Ramadan disetujui hari ini.
    question:
      ar_eg: إيه اللي اتوافق عليه النهارده؟
      ar: ما الذي أُقرّ اليوم؟
      en: What was approved today?
    options:
      - الفرع الجديد.
      - عرض رمضان.
      - المستثمر الجديد.
    answer: 1
    words: [ditunda, cabang, promosi]
dialogue:
  title: Makan rendang bersama
  lines:
    - speaker: Uda Fadli
      text: Kesepakatan udah ditandatangani. Yuk, kita rayakan pakai rendang!
      ar_eg: الاتفاق اتمضى. يلا نحتفل بالرندانج!
      ar: وُقِّع الاتّفاق، فلنحتفل بالرندانغ!
      en: The deal is signed. Let's celebrate with rendang!
    - speaker: Mohamed
      text: Makasih, Uda. Saya belajar banyak, apalagi cara menolak dengan halus.
      ar_eg: شكرًا يا أودا. اتعلمت كتير، خصوصًا إزاي أرفض بأدب.
      ar: شكرًا يا أودا. تعلّمت كثيرًا، خصوصًا الرفض بلطف.
      en: Thank you, Uda. I learned a lot, especially how to say no gently.
    - speaker: Uda Fadli
      text: Habis ini kamu ke mana?
      ar_eg: هتروح فين بعد كده؟
      ar: إلى أين بعد هذا؟
      en: Where are you off to next?
    - speaker: Mohamed
      text: Ke Berastagi, dekat Gunung Sinabung. Saya mau belajar nulis esai.
      ar_eg: على برستاجي، جنب جبل سينابونج. عايز أتعلم أكتب مقال.
      ar: إلى برستاغي قرب جبل سينابونغ، أريد أن أتعلّم كتابة المقال.
      en: To Berastagi, near Mount Sinabung. I want to learn to write essays.
souvenir:
  id: bipa6.u09.souvenir
  title: Rendang
  note:
    ar_eg: الرندانج أكلة مينانج، لحمة بتتطبخ على نار هادية في لبن جوز الهند وتوابل لساعات طويلة لحد ما الصلصة تنشف وتلزق على اللحمة. بيتقدّم في الأفراح والمناسبات، ولأنه ناشف بيعيش أسابيع من غير تلاجة، وده كان مناسب لعادة الـ merantau (إن الشباب يسافروا يشتغلوا بعيد). في 2011 جه الأول في استطلاع قرّاء CNN Travel لـ«أحسن 50 أكلة في العالم». ومطاعم Padang (rumah makan Padang) موجودة في كل حتة في إندونيسيا.
    ar: الرندانغ طبق مينانغي، لحم يُطهى على نار هادئة في حليب جوز الهند والتوابل ساعاتٍ طويلة حتّى تجفّ الصلصة وتلتصق باللحم. يُقدَّم في الأعراس والمناسبات، ولجفافه يبقى صالحًا أسابيع بلا تبريد، وهذا ما ناسب عادة الـ merantau (هجرة الشباب للعمل بعيدًا). وفي عام 2011 حلّ أوّلًا في استطلاع قرّاء CNN Travel لـ«أفضل 50 طعامًا في العالم». ومطاعم بادانغ (rumah makan Padang) منتشرة في أرجاء إندونيسيا.
    en: Rendang is a Minang dish of beef slow-cooked in coconut milk and spices for hours, until the sauce dries and clings to the meat. It is served at weddings and ceremonies, and because it is dry it keeps for weeks without a fridge, which suited the Minang custom of merantau (young people leaving home to work far away). In 2011 it came first in CNN Travel's readers' poll of the "World's 50 Best Foods". Padang restaurants (rumah makan Padang) are found all over Indonesia.
