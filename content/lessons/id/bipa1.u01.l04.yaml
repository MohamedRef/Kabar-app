schema: kabar.lesson/v1
id: bipa1.u01.l04
language: id
title: Saya dan aku
can_do:
  ar_eg: تقول «أنا» بأدب أو بشكل عادي مع الصحاب.
  ar: أن تقول «أنا» بأسلوب مهذب أو بأسلوب ودّي غير رسمي.
  en: Say "I" politely or casually.
slides:
  - title: Saya atau aku?
    body:
      ar_eg: |
        في الإندونيسي فيه كلمتين لـ«أنا»:
        - saya: المؤدبة والآمنة، مع أي حد (أستاذ، موظف، حد ماتعرفوش).
        - aku: مع الصحاب والعيلة واللي أصغر منك.
        لو مش متأكد، قول saya. ومافيش «فعل كان» هنا: «Saya Mohamed» = «أنا محمد» على طول، زي العربي.
      ar: |
        للمتكلم في الإندونيسية كلمتان:
        - saya: المهذبة الآمنة، تصلح مع الجميع (معلم، موظف، غريب).
        - aku: مع الأصدقاء والأهل ومن هو أصغر سنًّا.
        وعند الشك استعمل saya. ولا حاجة إلى فعل كينونة: «Saya Mohamed» = «أنا محمد» كما في العربية.
      en: |
        Indonesian has two words for "I":
        - saya: polite and safe with anyone (teachers, officials, strangers).
        - aku: with friends, family and younger people.
        When in doubt, say saya. No "am" is needed: "Saya Mohamed" = "I'm Mohamed", just like Arabic.
    grammar: id.pronoun.personal
    examples:
      - text: Selamat pagi, Pak. Saya Mohamed.
        ar_eg: صباح الخير يا أستاذ. أنا محمد.
        ar: صباح الخير يا سيدي. أنا محمد.
        en: Good morning, sir. I'm Mohamed.
      - text: Hai, aku Dimas!
        ar_eg: أهلًا، أنا ديماس!
        ar: مرحبًا، أنا ديماس!
        en: Hi, I'm Dimas!
  - title: Kamu, Anda, Bapak, Ibu
    body:
      ar_eg: |
        و«إنت»؟ برضه حسب الأدب، ومن غير فرق بين راجل وست:
        - kamu: للصحاب واللي أصغر منك.
        - Anda: رسمية ومحايدة، تنفع مع حد غريب أو في الكتابة.
        - Bapak / Ibu: مع حد أكبر منك أو محترم، بتقوم مقام «إنت» بالظبط زي «حضرتك».
      ar: |
        وللمخاطَب أيضًا كلمات بحسب درجة التأدب، ولا فرق بين مذكر ومؤنث:
        - kamu: للأصدقاء ومن هو أصغر.
        - Anda: رسمية محايدة، للغريب وفي الكتابة.
        - Bapak / Ibu: للأكبر سنًّا أو المحترم، وتقوم مقام «أنت» كقولنا «حضرتك».
      en: |
        "You" also depends on politeness, and never on gender:
        - kamu: for friends and younger people.
        - Anda: formal and neutral, for strangers and in writing.
        - Bapak / Ibu: for anyone older or respected; they replace "you", like Egyptian «حضرتك».
    grammar: id.pronoun.personal
    examples:
      - text: Maaf, Anda Pak Budi?
        ar_eg: لا مؤاخذة، حضرتك الأستاذ بودي؟
        ar: عفوًا، هل أنت الأستاذ بودي؟
        en: Excuse me, are you Pak Budi?
      - text: Kamu Dimas?
        ar_eg: إنت ديماس؟
        ar: أأنت ديماس؟
        en: Are you Dimas?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: saya
        ar_eg: أنا (بأدب)
        ar: أنا (مهذبة)
        en: I (polite)
      - text: aku
        ar_eg: أنا (مع الصحاب)
        ar: أنا (ودّية)
        en: I (casual)
      - text: kamu
        ar_eg: إنت (مع الصحاب)
        ar: أنت (ودّية)
        en: you (casual)
      - text: dia
        ar_eg: هو / هي
        ar: هو / هي
        en: he / she
    words: [saya, aku, kamu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أول مرة تقابل Pak Budi، الأستاذ. تعرّف نفسك إزاي؟
      ar: تقابل الأستاذ Budi لأول مرة. كيف تعرّف بنفسك؟
      en: You meet Pak Budi, the teacher, for the first time. How do you introduce yourself?
    options: ['Selamat pagi, Pak. Saya Mohamed.', 'Hai, aku Mohamed!', 'Hai, kamu Mohamed!']
    answer: 0
    explain:
      ar_eg: مع حد أكبر ومحترم saya هي الأنسب. aku للصحاب، و«kamu Mohamed» يعني «إنت محمد».
      ar: مع الأكبر المحترم تناسب saya، أما aku فللأصدقاء، و«kamu Mohamed» معناها «أنت محمد».
      en: With an older, respected person saya fits; aku is for friends, and "kamu Mohamed" means "you are Mohamed".
    words: [saya]
  - id: e03
    type: listen
    text: Salam kenal
    options: [Selamat malam, Salam kenal, Sampai jumpa]
    answer: 1
    words: [salam kenal]
  - id: e04
    type: fill_blank
    sentence: Selamat siang, Bu. ___ Mohamed.
    meaning:
      ar_eg: نهارك سعيد يا مدام. أنا محمد.
      ar: طاب نهارك يا سيدتي. أنا محمد.
      en: Good afternoon, ma'am. I'm Mohamed.
    options: [Saya, Dia, Kamu]
    answers: [Saya]
    explain:
      ar_eg: بتعرّف نفسك يبقى «أنا»، ومع Bu الأحسن saya.
      ar: أنت تعرّف بنفسك فتحتاج «أنا»، ومع Bu الأنسب saya.
      en: You're introducing yourself, so you need "I"; with Bu, saya is the right one.
    words: [saya]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اتشرفنا، أنا محمد.
      ar: تشرّفنا، أنا محمد.
      en: Nice to meet you, I'm Mohamed.
    answers: ['Salam kenal, saya Mohamed.', 'Salam kenal, saya Mohamed', Salam kenal. Saya Mohamed., 'Salam kenal, aku Mohamed.', 'Salam kenal, aku Mohamed', Salam kenal. Aku Mohamed., Saya Mohamed. Salam kenal., 'Saya Mohamed, salam kenal.', Aku Mohamed. Salam kenal., 'Aku Mohamed, salam kenal.']
    words: [salam kenal, saya]
  - id: e06
    type: translate
    direction: from_target
    source_text: Hai, aku Dimas!
    answers_meaning:
      ar_eg: [أهلًا، أنا ديماس!, هاي، أنا ديماس, أهلًا، أنا Dimas]
      ar: [مرحبًا، أنا ديماس!, أهلًا، أنا ديماس, مرحبًا، أنا Dimas]
      en: ['Hi, I''m Dimas!', 'Hi, I am Dimas', 'Hello, I''m Dimas']
    words: [aku]
  - id: e07
    type: speaking
    text: Selamat pagi, Bu. Saya Mohamed. Salam kenal.
    meaning:
      ar_eg: صباح الخير يا مدام. أنا محمد. اتشرفنا.
      ar: صباح الخير يا سيدتي. أنا محمد. تشرّفنا.
      en: Good morning, ma'am. I'm Mohamed. Nice to meet you.
    words: [saya, salam kenal]
dialogue:
  lines:
    - speaker: Dimas
      text: Hai! Aku Dimas. Kamu?
      ar_eg: أهلًا! أنا ديماس. وإنت؟
      ar: مرحبًا! أنا ديماس. وأنت؟
      en: Hi! I'm Dimas. You?
    - speaker: Mohamed
      text: Hai, Dimas! Aku Mohamed. Salam kenal!
      ar_eg: أهلًا يا ديماس! أنا محمد. فرصة سعيدة!
      ar: مرحبًا يا ديماس! أنا محمد. تشرفنا!
      en: Hi, Dimas! I'm Mohamed. Nice to meet you!
    - speaker: Bu Sari
      text: Selamat pagi. Anda Mohamed?
      ar_eg: صباح الخير. حضرتك محمد؟
      ar: صباح الخير. هل أنت محمد؟
      en: Good morning. Are you Mohamed?
    - speaker: Mohamed
      text: Ya, Bu. Saya Mohamed. Salam kenal.
      ar_eg: أيوه يا مدام. أنا محمد. فرصة سعيدة.
      ar: نعم يا سيدتي. أنا محمد. تشرفنا.
      en: Yes, ma'am. I'm Mohamed. Nice to meet you.
