schema: kabar.lesson/v1
id: bipa1.u01.l04
language: id
title: Saya dan aku
can_do:
  ar_eg: تقول «أنا» بأدب أو بشكل عادي مع الصحاب.
  ar: أن تقول «أنا» بأسلوب مهذب أو بأسلوب ودّي غير رسمي.
  en: Say "I" politely or casually.
slides:
  - title: Saya atau aku?
    body:
      ar_eg: |
        في الإندونيسي فيه كلمتين لـ«أنا»:
        - saya: المؤدبة والآمنة، مع أي حد (أستاذ، موظف، حد ماتعرفوش).
        - aku: مع الصحاب والعيلة واللي أصغر منك.
        لو مش متأكد، قول saya. ومافيش «فعل كان» هنا: «Saya Mohamed» = «أنا محمد» على طول، زي العربي.
      ar: |
        للمتكلم في الإندونيسية كلمتان:
        - saya: المهذبة الآمنة، تصلح مع الجميع (معلم، موظف، غريب).
        - aku: مع الأصدقاء والأهل ومن هو أصغر سنًّا.
        وعند الشك استعمل saya. ولا حاجة إلى فعل كينونة: «Saya Mohamed» = «أنا محمد» كما في العربية.
      en: |
        Indonesian has two words for "I":
        - saya: polite and safe with anyone (teachers, officials, strangers).
        - aku: with friends, family and younger people.
        When in doubt, say saya. No "am" is needed: "Saya Mohamed" = "I'm Mohamed", just like Arabic.
    grammar: id.pronoun.personal
    examples:
      - text: Selamat pagi, Pak. Saya Mohamed.
        ar_eg: صباح الخير يا أستاذ. أنا محمد.
        ar: صباح الخير يا سيدي. أنا محمد.
        en: Good morning, sir. I'm Mohamed.
      - text: Hai, aku Raka!
        ar_eg: أهلًا، أنا راكا!
        ar: مرحبًا، أنا راكا!
        en: Hi, I'm Raka!
  - title: Kamu, Anda, Bapak, Ibu
    body:
      ar_eg: |
        و«إنت»؟ برضه حسب الأدب، ومن غير فرق بين راجل وست:
        - kamu: للصحاب واللي أصغر منك.
        - Anda: رسمية ومحايدة، تنفع مع حد غريب أو في الكتابة.
        - Bapak / Ibu: مع حد أكبر منك أو محترم، بتقوم مقام «إنت» بالظبط زي «حضرتك».
      ar: |
        وللمخاطَب أيضًا كلمات بحسب درجة التأدب، ولا فرق بين مذكر ومؤنث:
        - kamu: للأصدقاء ومن هو أصغر.
        - Anda: رسمية محايدة، للغريب وفي الكتابة.
        - Bapak / Ibu: للأكبر سنًّا أو المحترم، وتقوم مقام «أنت» كقولنا «حضرتك».
      en: |
        "You" also depends on politeness, and never on gender:
        - kamu: for friends and younger people.
        - Anda: formal and neutral, for strangers and in writing.
        - Bapak / Ibu: for anyone older or respected; they replace "you", like Egyptian «حضرتك».
    grammar: id.pronoun.personal
    examples:
      - text: Maaf, Anda Pak Irwan?
        ar_eg: لا مؤاخذة، حضرتك الأستاذ إروان؟
        ar: عفوًا، هل أنت الأستاذ إروان؟
        en: Excuse me, are you Pak Irwan?
      - text: Kamu Raka?
        ar_eg: إنت راكا؟
        ar: أأنت راكا؟
        en: Are you Raka?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: saya
        ar_eg: أنا (بأدب)
        ar: أنا (مهذبة)
        en: I (polite)
      - text: aku
        ar_eg: أنا (مع الصحاب)
        ar: أنا (ودّية)
        en: I (casual)
      - text: kamu
        ar_eg: إنت (مع الصحاب)
        ar: أنت (ودّية)
        en: you (casual)
      - text: Anda
        ar_eg: حضرتك (رسمي)
        ar: حضرتك (رسمية)
        en: you (formal)
      - text: hai
        ar_eg: هاي، أهلًا
        ar: مرحبًا
        en: hi
    words: [saya, aku, kamu, Anda, hai]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أول مرة تقابل Pak Irwan، الأستاذ. تعرّف نفسك إزاي؟
      ar: تقابل الأستاذ Irwan لأول مرة. كيف تعرّف بنفسك؟
      en: You meet Pak Irwan, the teacher, for the first time. How do you introduce yourself?
    options: ['Selamat pagi, Pak. Saya Mohamed.', 'Hai, aku Mohamed!', 'Hai, kamu Mohamed!']
    answer: 0
    explain:
      ar_eg: مع حد أكبر ومحترم saya هي الأنسب. aku للصحاب، و«kamu Mohamed» يعني «إنت محمد».
      ar: مع الأكبر المحترم تناسب saya، أما aku فللأصدقاء، و«kamu Mohamed» معناها «أنت محمد».
      en: With an older, respected person saya fits; aku is for friends, and "kamu Mohamed" means "you are Mohamed".
    words: [saya]
  - id: e03
    type: listen
    text: Salam kenal
    options: [Selamat malam, Salam kenal, Sampai jumpa]
    answer: 1
    words: [salam kenal]
  - id: e04
    type: fill_blank
    sentence: Selamat pagi, Pak. ___ Pak Irwan?
    meaning:
      ar_eg: صباح الخير يا أستاذ. حضرتك الأستاذ إروان؟
      ar: صباح الخير يا سيدي. هل أنت الأستاذ إروان؟
      en: Good morning, sir. Are you Pak Irwan?
    options: [Anda, Aku, Kamu]
    answers: [Anda]
    explain:
      ar_eg: بتكلّم أستاذ مش عارفه، يبقى Anda (حضرتك). kamu للصحاب، وaku معناها «أنا».
      ar: تخاطب أستاذًا لا تعرفه، فتناسب Anda (حضرتك)؛ kamu للأصدقاء، وaku تعني «أنا».
      en: You're addressing a teacher you don't know, so Anda (formal "you"); kamu is for friends, and aku means "I".
    words: [Anda]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اتشرفنا، أنا محمد.
      ar: تشرّفنا، أنا محمد.
      en: Nice to meet you, I'm Mohamed.
    answers: ['Salam kenal, saya Mohamed.', 'Salam kenal, saya Mohamed', Salam kenal. Saya Mohamed., 'Salam kenal, aku Mohamed.', 'Salam kenal, aku Mohamed', Salam kenal. Aku Mohamed., Saya Mohamed. Salam kenal., 'Saya Mohamed, salam kenal.', Aku Mohamed. Salam kenal., 'Aku Mohamed, salam kenal.']
    words: [salam kenal, saya]
  - id: e06
    type: translate
    direction: from_target
    source_text: Hai, aku Raka! Kamu Mohamed?
    answers_meaning:
      ar_eg: [أهلًا، أنا راكا! إنت محمد؟, هاي، أنا راكا. إنت محمد؟, أهلًا، أنا Raka! إنت Mohamed؟]
      ar: [مرحبًا، أنا راكا! أأنت محمد؟, أهلًا، أنا راكا. هل أنت محمد؟, مرحبًا، أنا Raka! أنت Mohamed؟]
      en: ['Hi, I''m Raka! Are you Mohamed?', 'Hi, I am Raka. Are you Mohamed?', 'Hello, I''m Raka! You''re Mohamed?']
    words: [hai, aku, kamu]
  - id: e07
    type: speaking
    text: Selamat pagi, Pak. Anda Pak Irwan? Saya Mohamed, salam kenal.
    meaning:
      ar_eg: صباح الخير يا أستاذ. حضرتك الأستاذ إروان؟ أنا محمد، اتشرفنا.
      ar: صباح الخير يا سيدي. هل أنت الأستاذ إروان؟ أنا محمد، تشرّفنا.
      en: Good morning, sir. Are you Pak Irwan? I'm Mohamed, nice to meet you.
    words: [Anda, saya, salam kenal]
dialogue:
  lines:
    - speaker: Raka
      text: Hai! Aku Raka. Kamu?
      ar_eg: أهلًا! أنا راكا. وإنت؟
      ar: مرحبًا! أنا راكا. وأنت؟
      en: Hi! I'm Raka. You?
    - speaker: Mohamed
      text: Hai, Raka! Aku Mohamed. Salam kenal!
      ar_eg: أهلًا يا راكا! أنا محمد. فرصة سعيدة!
      ar: مرحبًا يا راكا! أنا محمد. تشرفنا!
      en: Hi, Raka! I'm Mohamed. Nice to meet you!
    - speaker: Bu Yanti
      text: Selamat pagi. Anda Mohamed?
      ar_eg: صباح الخير. حضرتك محمد؟
      ar: صباح الخير. هل أنت محمد؟
      en: Good morning. Are you Mohamed?
    - speaker: Mohamed
      text: Ya, Bu. Saya Mohamed. Salam kenal.
      ar_eg: أيوه يا مدام. أنا محمد. فرصة سعيدة.
      ar: نعم يا سيدتي. أنا محمد. تشرفنا.
      en: Yes, ma'am. I'm Mohamed. Nice to meet you.
