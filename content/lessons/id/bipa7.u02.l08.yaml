schema: kabar.lesson/v1
id: bipa7.u02.l08
language: id
title: Pertemuan tiga lempeng
can_do:
  ar_eg: تشرح ليه إندونيسيا فيها زلازل كتير وإزاي الناس بتستعدّ.
  ar: أن تشرح سبب كثرة الزلازل في إندونيسيا وكيف يستعدّ الناس لها.
  en: Explain why Indonesia has so many earthquakes and how people prepare.
slides:
  - title: Di atas tiga lempeng
    body:
      ar_eg: |
        إندونيسيا قاعدة على تلات lempeng: أوراسيا والهندي الأسترالي والهادي.
        لما لوح بيغطس تحت لوح تاني، ده اسمه subduksi. جنوب جاوة فيه Palung Jawa (خندق جاوة).
        sesar = فالق على البر، زي Sesar Palu-Koro.
        في زلزال بالو 2018 حصل likuefaksi: الأرض بقت زي الطين وبلعت بيوت في بيتوبو.
        seismograf بيسجّل الهزّة. mitigasi = كل اللي بنعمله قبل الكارثة علشان نقلّل الضرر.
        - في الكلام: nggak = tidak، kayak = seperti، deket = dekat، kerasa = terasa، kebangun = terbangun، iya = ya.
      ar: |
        تقع إندونيسيا على ثلاث lempeng: الأوراسية والهندية الأسترالية والهادئة.
        وانغماس صفيحة تحت أخرى يسمّى subduksi، وجنوب جاوة يقع Palung Jawa (خندق جاوة).
        sesar = صدع على اليابسة، مثل Sesar Palu-Koro.
        في زلزال بالو عام 2018 حدث likuefaksi: صارت الأرض كالطين وابتلعت بيوتًا في بيتوبو.
        يسجّل seismograf الهزّة. mitigasi = كلّ ما نفعله قبل الكارثة لتقليل الضرر.
        - في الكلام اليومي: nggak = tidak، kayak = seperti، deket = dekat، kerasa = terasa، kebangun = terbangun، iya = ya.
      en: |
        Indonesia sits on three lempeng (plates): Eurasian, Indo-Australian and Pacific.
        When one plate dives under another, that's subduksi. South of Java lies the Palung Jawa (Java Trench).
        sesar = a fault on land, like the Palu-Koro fault.
        In the 2018 Palu earthquake, likuefaksi turned the ground to mud and swallowed houses in Petobo.
        A seismograf records the shaking. mitigasi = everything we do before a disaster to reduce harm.
        - In speech: nggak = tidak, kayak = seperti, deket = dekat, kerasa = terasa, kebangun = terbangun, iya = ya.
    examples:
      - text: Gempa itu disebabkan oleh subduksi lempeng.
        ar_eg: الزلزال ده سببه انزلاق الألواح تحت بعض.
        ar: سبب ذلك الزلزال اندساس الصفائح.
        en: That quake was caused by plate subduction.
      - text: Seismograf mencatat getaran sejak subuh.
        ar_eg: جهاز الرصد سجّل الهزّة من الفجر.
        ar: سجّلت مرسمة الزلازل الاهتزاز منذ الفجر.
        en: The seismograph has recorded tremors since dawn.
      - text: Mitigasi bencana harus dimulai di sekolah.
        ar_eg: الاستعداد للكوارث لازم يبدأ من المدرسة.
        ar: يجب أن يبدأ التخفيف من الكوارث في المدرسة.
        en: Disaster mitigation should start at school.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: lempeng
        ar_eg: لوح (تكتوني)
        ar: صفيحة (تكتونية)
        en: (tectonic) plate
      - text: tektonik
        ar_eg: تكتوني
        ar: تكتوني
        en: tectonic
      - text: subduksi
        ar_eg: انزلاق لوح تحت لوح
        ar: اندساس صفيحة تحت أخرى
        en: subduction
      - text: sesar
        ar_eg: فالق / شق في القشرة
        ar: صدع، فالق
        en: geological fault
    words: [lempeng, tektonik, subduksi, sesar]
  - id: e02
    type: match_pairs
    pairs:
      - text: palung
        ar_eg: خندق محيطي عميق
        ar: خندق محيطي
        en: ocean trench
      - text: likuefaksi
        ar_eg: تميّع التربة (الأرض بتبقى زي الطين)
        ar: تميّع التربة
        en: soil liquefaction
      - text: seismograf
        ar_eg: جهاز رصد الزلازل
        ar: مِرسمة الزلازل
        en: seismograph
      - text: mitigasi
        ar_eg: تخفيف الأضرار / الاستعداد للكوارث
        ar: التخفيف من آثار الكوارث
        en: (disaster) mitigation
    words: [palung, likuefaksi, seismograf, mitigasi]
  - id: e03
    type: listen
    text: Di Petobo, likuefaksi membuat rumah-rumah tenggelam ke dalam tanah.
    question:
      ar_eg: حصل إيه في بيتوبو؟
      ar: ماذا حدث في بيتوبو؟
      en: What happened in Petobo?
    options: [الأرض بقت زي الطين, البحر طلع, البركان ثار]
    answer: 0
    meaning:
      ar_eg: في بيتوبو، تميّع الأرض خلّى البيوت تغرق جوّه التراب.
      ar: في بيتوبو جعل تميّع التربة البيوت تغوص في الأرض.
      en: In Petobo, liquefaction made houses sink into the ground.
    words: [likuefaksi]
  - id: e04
    type: fill_blank
    sentence: Palu dilewati oleh ___ Palu-Koro yang aktif.
    meaning:
      ar_eg: بالو بيعدّي فيها ___ بالو-كورو النشط.
      ar: يمرّ بمدينة بالو ___ بالو-كورو النشط.
      en: Palu sits on the active Palu-Koro ___.
    options: [sesar, palung, seismograf]
    answers: [sesar]
    words: [sesar, palung, seismograf]
    explain:
      ar_eg: sesar = فالق (شق في القشرة)، وPalu-Koro اسم فالق. palung = خندق بحري، وseismograf = جهاز قياس.
      ar: sesar = فالق، وPalu-Koro اسم فالق. أما palung فخندق بحري وseismograf جهاز رصد.
      en: sesar is a fault line. palung is a trench, seismograf an instrument.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «subduksi» معناها إيه؟
      ar: ما معنى «subduksi»؟
      en: What is 'subduksi'?
    options: [Gunung api yang tidur., Alat pencatat gempa., Satu lempeng masuk ke bawah lempeng lain.]
    answer: 2
    explain:
      ar_eg: subduksi = لوح بيغطس تحت لوح تاني.
      ar: subduksi = انغماس صفيحة تحت أخرى.
      en: subduksi = one plate sliding beneath another.
    words: [subduksi, lempeng, seismograf]
  - id: e06
    type: fill_blank
    sentence: Indonesia rawan gempa karena aktivitas ___.
    meaning:
      ar_eg: إندونيسيا معرّضة للزلازل بسبب النشاط الـ ___.
      ar: إندونيسيا عرضة للزلازل بسبب النشاط ___.
      en: Indonesia is quake-prone because of ___ activity.
    options: [tektonik, mitigasi, likuefaksi]
    answers: [tektonik]
    words: [tektonik, mitigasi, likuefaksi]
    explain:
      ar_eg: aktivitas tektonik = نشاط الصفايح التكتونية. mitigasi = تقليل المخاطر، وlikuefaksi = تميّع التربة.
      ar: aktivitas tektonik = النشاط التكتوني. أما mitigasi فتخفيف الأخطار وlikuefaksi تميّع التربة.
      en: aktivitas tektonik = tectonic activity.
  - id: e07
    type: build_sentence
    source:
      ar_eg: خندق جاوة عميق أوي.
      ar: خندق جاوة عميق جدًا.
      en: The Java Trench is very deep.
    answer: Palung Jawa sangat dalam.
    distractors: [sesar, lempeng]
    words: [palung]
    explain:
      ar_eg: Palung Jawa = خندق جاوة، وهو عميق جدًا. sesar وlempeng حاجات تانية.
      ar: Palung Jawa = خندق جاوة العميق، ولا مكان لـ sesar ولا lempeng.
      en: Palung Jawa = the Java Trench.
  - id: e08
    type: translate
    direction: from_target
    source_text: Tiga lempeng tektonik bertemu di bawah Indonesia.
    answers_meaning:
      ar_eg: [تلات ألواح تكتونية بيتقابلوا تحت إندونيسيا, فيه تلات ألواح تكتونية بتتلاقى تحت إندونيسيا]
      ar: [تلتقي ثلاث صفائح تكتونية تحت إندونيسيا, ثلاث صفائح تكتونية تتلاقى أسفل إندونيسيا]
      en: [Three tectonic plates meet beneath Indonesia, Three tectonic plates come together under Indonesia]
    words: [lempeng, tektonik]
  - id: e09
    type: speaking
    text: Mitigasi lebih murah daripada membangun kembali.
    meaning:
      ar_eg: الاستعداد أرخص من إنك تبني من الأول.
      ar: التخفيف أرخص من إعادة البناء.
      en: Mitigation is cheaper than rebuilding.
    words: [mitigasi]
  - id: e10
    type: multiple_choice
    question: Alat apa yang dipakai BMKG untuk mencatat gempa?
    options: [seismograf, palung, sesar]
    answer: 0
    explain:
      ar_eg: seismograf = الجهاز اللي بيسجّل الزلازل.
      ar: seismograf = جهاز تسجيل الزلازل.
      en: seismograf = the instrument that records earthquakes.
    words: [seismograf, palung, sesar, subduksi, likuefaksi, mitigasi]
dialogue:
  lines:
    - speaker: Kaka Yohana
      text: Mohamed, gempa tadi malam terasa sampai Sorong. Kamu bangun?
      ar_eg: يا محمد، زلزال امبارح بالليل اتحسّ لحد سورونج. صحيت؟
      ar: يا محمد، شُعر بزلزال الليلة الماضية حتى سورونغ. هل استيقظت؟
      en: Mohamed, last night's quake was felt as far as Sorong. Did you wake up?
    - speaker: Mohamed
      text: Iya, lampunya goyang. Penyebabnya apa?
      ar_eg: أيوه، النجفة كانت بتتهزّ. إيه السبب؟
      ar: نعم، تأرجح المصباح. ما سببه؟
      en: Yes, the lamp swayed. What caused it?
    - speaker: Kaka Yohana
      text: Kata BMKG, gempa tektonik di laut, deket zona subduksi.
      ar_eg: البي إم كي جي بيقولوا زلزال تكتوني في البحر، قريب من منطقة الانزلاق.
      ar: تقول هيئة الأرصاد إنه زلزال تكتوني في البحر قرب منطقة الاندساس.
      en: BMKG says a tectonic quake at sea, near the subduction zone.
    - speaker: Mohamed
      text: Seismograf mereka mencatat berapa?
      ar_eg: جهاز الرصد عندهم سجّل كام؟
      ar: كم سجّلت مرسمة الزلازل لديهم؟
      en: What did their seismograph record?
    - speaker: Kaka Yohana
      text: Lima koma dua. Untung nggak ada likuefaksi kayak di Palu.
      ar_eg: خمسة وتنين من عشرة. الحمد لله ما حصلش تميّع أرض زي بالو.
      ar: خمس فاصل اثنين، ولحسن الحظ لم يحدث تميّع للتربة كما في بالو.
      en: Five point two. Luckily no liquefaction like in Palu.
    - speaker: Mohamed
      text: Jadi mitigasi di sekolah harus terus dilatih.
      ar_eg: يبقى تدريب الاستعداد في المدارس لازم يستمر.
      ar: إذن يجب أن يستمرّ التدريب على التخفيف من الكوارث في المدارس.
      en: So schools must keep practising mitigation.
