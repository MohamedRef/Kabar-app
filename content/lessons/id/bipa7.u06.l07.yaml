schema: kabar.lesson/v1
id: bipa7.u06.l07
language: id
title: Misinformasi dan disinformasi
can_do:
  ar_eg: تفرّق بين المعلومة الغلط والتضليل المتعمّد وتشرح إزاي بيقسّموا الناس.
  ar: أن تميّز بين الخطأ والتضليل المتعمّد وتشرح كيف يقسّمان الناس.
  en: Tell misinformation from disinformation and explain how they divide people.
slides:
  - title: Salah atau sengaja?
    body:
      ar_eg: |
        misinformasi = معلومة غلط، اللي نشرها مش قاصد. disinformasi = كدب متعمّد علشان يضلّل.
        propaganda = دعاية منظّمة بتخدم مصلحة. narasi = الرواية اللي بتتكرّر لحد ما الناس تصدّقها.
        pembingkaian = إزاي الخبر بيتعرض: نفس الحدث ممكن يتقال «مظاهرة» أو «شغب».
        umpan klik = عنوان طُعم: «Kamu tidak akan percaya apa yang terjadi!»
        ruang gema = غرفة صدى: الخوارزمية بتورّيك بس اللي شبهك، فيزيد polarisasi (الاستقطاب).
      ar: |
        misinformasi = معلومة خاطئة لم يقصد ناشرها الخطأ. disinformasi = كذب متعمّد للتضليل.
        propaganda = دعاية منظّمة تخدم مصلحة. narasi = السردية التي تتكرّر حتى يصدّقها الناس.
        pembingkaian = طريقة تقديم الخبر: الحدث نفسه قد يسمّى «مظاهرة» أو «شغبًا».
        umpan klik = عنوان طُعم: «Kamu tidak akan percaya apa yang terjadi!»
        ruang gema = غرفة الصدى: تعرض لك الخوارزمية من يشبهونك فقط، فيزداد polarisasi (الاستقطاب).
      en: |
        misinformasi = false information spread without intent. disinformasi = a deliberate lie meant to mislead.
        propaganda = organised persuasion serving an interest. narasi = a narrative repeated until people believe it.
        pembingkaian = framing: the same event can be called a "protest" or a "riot".
        umpan klik = clickbait: «Kamu tidak akan percaya apa yang terjadi!»
        ruang gema = an echo chamber: the algorithm shows you only people like you, and polarisasi grows.
    examples:
      - text: Nenek saya menyebarkan misinformasi tanpa sadar.
        ar_eg: جدّتي نشرت معلومة غلط من غير ما تاخد بالها.
        ar: نشرت جدّتي معلومات خاطئة دون أن تدري.
        en: My grandmother spread misinformation without realising.
      - text: Disinformasi itu sengaja dibuat untuk memecah belah warga.
        ar_eg: التضليل ده اتعمل بقصد علشان يفرّق الناس.
        ar: صُنع ذلك التضليل عمدًا لتفريق الناس.
        en: That disinformation was made on purpose to divide people.
      - text: Judul umpan klik membuat orang marah sebelum membaca.
        ar_eg: العنوان الطُعم بيخلّي الناس تتعصّب قبل ما تقرا.
        ar: يُغضب العنوانُ الطُّعم الناسَ قبل أن يقرؤوا.
        en: Clickbait headlines make people angry before they read.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: misinformasi
        ar_eg: معلومة غلط (من غير قصد)
        ar: معلومات خاطئة (دون قصد)
        en: misinformation
      - text: disinformasi
        ar_eg: تضليل متعمّد
        ar: تضليل متعمّد
        en: disinformation
      - text: propaganda
        ar_eg: دعاية
        ar: دعاية
        en: propaganda
      - text: narasi
        ar_eg: رواية / الحكاية اللي بتتروّج
        ar: سردية
        en: narrative
    words: [misinformasi, disinformasi, propaganda, narasi]
  - id: e02
    type: match_pairs
    pairs:
      - text: pembingkaian
        ar_eg: تأطير الخبر / زاوية العرض
        ar: التأطير
        en: framing
      - text: polarisasi
        ar_eg: استقطاب
        ar: استقطاب
        en: polarisation
      - text: ruang gema
        ar_eg: غرفة صدى (بتسمع اللي زيّك بس)
        ar: غرفة الصدى
        en: echo chamber
      - text: umpan klik
        ar_eg: عنوان طُعم للكليكات
        ar: طُعم النقرات
        en: clickbait
    words: [pembingkaian, polarisasi, ruang gema, umpan klik]
  - id: e03
    type: listen
    text: Di ruang gema, kita hanya mendengar pendapat yang sama dengan kita.
    question:
      ar_eg: بنسمع إيه بس؟
      ar: ماذا نسمع فقط؟
      en: What do we only hear?
    options: [غرفة صدى, طُعم كليكات, دعاية]
    answer: 0
    meaning:
      ar_eg: في غرفة الصدى، بنسمع بس الآراء اللي زيّنا.
      ar: في غرفة الصدى لا نسمع إلا آراء تشبه آراءنا.
      en: In an echo chamber, we only hear opinions like our own.
    words: [ruang gema]
  - id: e04
    type: fill_blank
    sentence: Media itu memakai ___ yang membuat nelayan terlihat bersalah.
    meaning:
      ar_eg: الوسيلة الإعلامية دي استخدمت ___ بيبيّن الصيادين إنهم غلطانين.
      ar: استعملت تلك الوسيلة ___ يظهر الصيّادين مذنبين.
      en: That outlet used a ___ that makes the fishermen look guilty.
    options: [pembingkaian, polarisasi, umpan klik]
    answers: [pembingkaian]
    words: [pembingkaian, polarisasi, umpan klik]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الفرق بين «misinformasi» و«disinformasi»؟
      ar: ما الفرق بين «misinformasi» و«disinformasi»؟
      en: What's the difference between 'misinformasi' and 'disinformasi'?
    options: [Tidak ada bedanya., Misinformasi selalu dari pemerintah., 'Disinformasi disebarkan dengan sengaja, misinformasi tidak.']
    answer: 2
    explain:
      ar_eg: 'الفرق في النية: التضليل مقصود.'
      ar: 'الفرق في النيّة: التضليل متعمّد.'
      en: 'The difference is intent: disinformation is deliberate.'
    words: [misinformasi, disinformasi]
  - id: e06
    type: fill_blank
    sentence: Setelah pemilu, ___ di media sosial makin tajam.
    meaning:
      ar_eg: بعد الانتخابات، ___ على السوشيال ميديا زاد.
      ar: بعد الانتخابات اشتدّ ___ على وسائل التواصل.
      en: After the election, ___ on social media grew sharper.
    options: [polarisasi, narasi, propaganda]
    answers: [polarisasi]
    words: [polarisasi, narasi, propaganda]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الرواية دي بتتكرّر في جروبات كتير.
      ar: تتكرّر هذه السردية في مجموعات كثيرة.
      en: This narrative is repeated in many groups.
    answer: Narasi ini diulang di banyak grup.
    distractors: [propaganda, disinformasi]
    words: [narasi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Propaganda perang sering memakai foto lama.
    answers_meaning:
      ar_eg: [دعاية الحرب كتير بتستعمل صور قديمة, الدعاية وقت الحرب غالبًا بتستخدم صور قديمة]
      ar: [كثيرًا ما تستعمل دعاية الحرب صورًا قديمة, تلجأ دعاية الحرب غالبًا إلى صور قديمة]
      en: [War propaganda often uses old photos, Wartime propaganda frequently relies on old pictures]
    words: [propaganda]
  - id: e09
    type: speaking
    text: Jangan klik umpan klik, dan jangan sebar disinformasi.
    meaning:
      ar_eg: ما تدوسش على العناوين الطُعم، وما تنشرش التضليل.
      ar: لا تنقر على الطُّعم ولا تنشر التضليل.
      en: Don't click clickbait, and don't spread disinformation.
    words: [umpan klik, disinformasi]
  - id: e10
    type: multiple_choice
    question: Apa yang memperkuat polarisasi?
    options: [Ruang gema dan narasi yang memecah belah., Membaca dari banyak sumber., Bertanya kepada ahli.]
    answer: 0
    explain:
      ar_eg: غرفة الصدى والروايات اللي بتفرّق بتزوّد الاستقطاب.
      ar: تزيد غرف الصدى والسرديات المفرّقة من الاستقطاب.
      en: Echo chambers and divisive narratives deepen polarisation.
    words: [polarisasi, ruang gema, narasi, misinformasi, pembingkaian, umpan klik]
dialogue:
  lines:
    - speaker: Kak Selvi
      text: Mohamed, pesan ini sudah dibagikan seribu kali. Isinya salah.
      ar_eg: يا محمد، الرسالة دي اتشيّرت ألف مرة. ومحتواها غلط.
      ar: يا محمد، نُشرت هذه الرسالة ألف مرّة، ومضمونها خاطئ.
      en: Mohamed, this message has been shared a thousand times. It's wrong.
    - speaker: Mohamed
      text: Apakah ini misinformasi atau disinformasi?
      ar_eg: ده معلومة غلط ولا تضليل متعمّد؟
      ar: أهي معلومات خاطئة أم تضليل متعمّد؟
      en: Is it misinformation or disinformation?
    - speaker: Kak Selvi
      text: Akun pertama yang menyebarkannya punya kepentingan politik. Jadi disinformasi.
      ar_eg: أول حساب نشرها ليه مصلحة سياسية. يبقى تضليل متعمّد.
      ar: الحساب الأول الذي نشرها له مصلحة سياسية، فهو تضليل متعمّد.
      en: The first account to spread it has a political interest. So disinformation.
    - speaker: Mohamed
      text: Tetapi kebanyakan orang membaginya karena percaya.
      ar_eg: بس معظم الناس شيّروها علشان مصدّقين.
      ar: لكنّ معظم الناس نشروها لأنهم صدّقوها.
      en: But most people shared it because they believed it.
    - speaker: Kak Selvi
      text: Betul. Bagi mereka itu misinformasi. Ruang gema membuatnya cepat menyebar.
      ar_eg: مظبوط. بالنسبة لهم دي معلومة غلط. وغرفة الصدى خلّتها تنتشر بسرعة.
      ar: صحيح، فهي عندهم معلومة خاطئة، وغرف الصدى سرّعت انتشارها.
      en: Right. For them it's misinformation. Echo chambers made it spread fast.
