schema: kabar.lesson/v1
id: bipa7.u02.l04
language: id
title: Raja Ampat
can_do:
  ar_eg: توصف جزر راجا أمبات وتشرح ليه الغطّاسين بيحبّوها.
  ar: أن تصف جزر راجا أمبات وتشرح سبب إقبال الغوّاصين عليها.
  en: Describe the Raja Ampat islands and explain why divers love them.
slides:
  - title: Empat raja di ujung Papua
    body:
      ar_eg: |
        راجا أمبات (Raja Ampat = «الأربع ملوك») gugusan (مجموعة جزر) فيها أكتر من ١٥٠٠ جزيرة في بابوا الجنوبية الغربية. أكبر أربع جزر: Waigeo وBatanta وSalawati وMisool.
        - menyelam = يغطس تحت المية
        - pari manta = سمكة الراي المانتا الكبيرة
        - pesona = سحر / جمال بيشدّ
        - endemik = متوطّن: مالوش وجود غير هنا
        فيها حوالي ٧٥٪ من أنواع الشعاب المرجانية المعروفة في العالم، وفيها hiu berjalan (القرش الماشي) اللي بيمشي على زعانفه في المية القليلة.
        - في الكلام: emang = memang، pake = pakai، bener = benar.
      ar: |
        راجا أمبات (Raja Ampat = «الملوك الأربعة») gugusan (أرخبيل) يضمّ أكثر من ١٥٠٠ جزيرة في بابوا الجنوبية الغربية، وأكبر جزره الأربع: Waigeo وBatanta وSalawati وMisool.
        - menyelam = يغوص
        - pari manta = سمكة شيطان البحر (المانتا)
        - pesona = سحر وجاذبية
        - endemik = مستوطن، لا يوجد إلا هنا
        وفيها نحو ٧٥٪ من أنواع المرجان المعروفة في العالم، ومنها hiu berjalan (القرش الماشي) الذي يمشي بزعانفه في المياه الضحلة.
        - في الكلام اليومي: emang = memang، pake = pakai، bener = benar.
      en: |
        Raja Ampat ("four kings") is a gugusan (cluster) of more than 1,500 islands in Southwest Papua. The four biggest are Waigeo, Batanta, Salawati and Misool.
        - menyelam = to dive
        - pari manta = manta ray
        - pesona = charm, allure
        - endemik = endemic, found only here
        It holds about 75% of the world's known coral species, and the hiu berjalan (walking shark), which "walks" on its fins in shallow water.
        - In speech: emang = memang, pake = pakai, bener = benar.
    examples:
      - text: Hiu berjalan adalah ikan endemik di perairan Raja Ampat.
        ar_eg: القرش الماشي سمكة متوطّنة في مية راجا أمبات.
        ar: القرش الماشي سمكة مستوطنة في مياه راجا أمبات.
        en: The walking shark is a fish endemic to Raja Ampat's waters.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: menyelam
        ar_eg: يغطس
        ar: يغوص
        en: to dive
      - text: pari manta
        ar_eg: سمكة المانتا
        ar: شيطان البحر
        en: manta ray
      - text: pesona
        ar_eg: سحر
        ar: جاذبية
        en: charm, allure
      - text: gugusan
        ar_eg: مجموعة جزر
        ar: أرخبيل
        en: cluster of islands
      - text: endemik
        ar_eg: متوطّن
        ar: مستوطن
        en: endemic
    words: [menyelam, pari manta, pesona, gugusan, endemik]
  - id: e02
    type: listen
    text: Raja Ampat adalah gugusan lebih dari seribu lima ratus pulau. Hanya sebagian kecil pulaunya yang dihuni manusia. Sisanya hutan, tebing kapur, dan pantai kosong yang hanya bisa dicapai dengan perahu.
    question:
      ar_eg: راجا أمبات فيها كام جزيرة تقريبًا؟
      ar: كم جزيرة تقريبًا في راجا أمبات؟
      en: About how many islands make up Raja Ampat?
    options:
      - Raja Ampat hanya terdiri dari empat pulau besar.
      - Ada lebih dari 1.500 pulau, tetapi kebanyakan tidak berpenghuni.
      - Semua pulau di Raja Ampat padat penduduk.
    answer: 1
    words: [gugusan]
    explain:
      ar_eg: gugusan lebih dari 1500 pulau = مجموعة أكتر من ١٥٠٠ جزيرة، وhanya sebagian kecil = جزء صغير بس اللي ساكنينه ناس، فأغلبها فاضي. الأربعة دول معنى الاسم مش عدد الجزر.
      ar: gugusan = أرخبيل يزيد على ١٥٠٠ جزيرة، ولا يسكن إلّا جزءًا صغيرًا منها، فأكثرها خالٍ. والأربعة معنى الاسم لا عدد الجزر.
      en: Over 1,500 islands, only a small part inhabited, so most are empty. Four is the name's meaning, not the island count.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: لو حيوان «endemik» في راجا أمبات، يبقى معناه إيه؟
      ar: إن كان حيوان «endemik» في راجا أمبات، فما معنى ذلك؟
      en: If an animal is "endemik" to Raja Ampat, what does that mean?
    options:
      - Hewan itu hanya datang ke sini pada musim dingin.
      - Hewan itu sudah lama punah.
      - Hewan itu tidak ada di tempat lain di dunia.
    answer: 2
    words: [endemik]
    explain:
      ar_eg: endemik = مالوش وجود غير هنا (tidak ada di tempat lain). مش زائر موسمي ولا منقرض.
      ar: endemik = مستوطن لا يوجد في مكان آخر، لا زائر موسميّ ولا منقرض.
      en: endemik = found nowhere else; not a seasonal visitor, not extinct.
  - id: e04
    type: fill_blank
    sentence: Wisatawan datang dari jauh untuk ___ di antara karang Misool.
    meaning:
      ar_eg: السيّاح بييجوا من بعيد علشان يغطسوا وسط شعاب ميسول.
      ar: يأتي السيّاح من بعيد ليغوصوا بين مرجان ميسول.
      en: Tourists come from far away to dive among Misool's reefs.
    options: [menyelam, merajut, membacakan]
    answers: [menyelam]
    words: [menyelam]
    explain:
      ar_eg: menyelam = يغطس، وده اللي السيّاح بييجوا عشانه بين الشعاب. merajut يحيك، وmembacakan يقرا لحد.
      ar: menyelam = يغوص، وهو ما يأتي السياح من أجله. أما merajut فيحيك وmembacakan يقرأ على غيره.
      en: menyelam (to dive) is why tourists come. merajut and membacakan don't fit.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «Raja Ampat» يعني إيه حرفيًا؟
      ar: ما المعنى الحرفيّ لـ «Raja Ampat»؟
      en: What does "Raja Ampat" literally mean?
    options:
      - الأربع ملوك.
      - الملك الكبير.
      - جزيرة الملك.
    answer: 0
    explain:
      ar_eg: raja = ملك، empat = أربعة. والأسطورة بتقول إن أربع ملوك طلعوا من أربع بيضات.
      ar: raja = ملك، وempat = أربعة. وتروي الأسطورة أنّ أربعة ملوك خرجوا من أربع بيضات.
      en: raja = king, empat = four. Legend says four kings hatched from four eggs.
    words: [gugusan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: سمكة المانتا عرضها ممكن يوصل سبعة متر.
      ar: قد يبلغ عرض شيطان البحر سبعة أمتار.
      en: A manta ray can be up to seven metres wide.
    answer: Lebar pari manta bisa mencapai tujuh meter.
    distractors: [pesona, menyelam]
    words: [pari manta]
    explain:
      ar_eg: Lebar pari manta = عرض سمكة المانتا، ويوصل سبعة متر. pesona وmenyelam مش جزء من الجملة.
      ar: Lebar pari manta = عرض الراي اللاسع (المانتا)، ويبلغ سبعة أمتار.
      en: Lebar pari manta = a manta ray's width.
  - id: e07
    type: translate
    direction: from_target
    source_text: Pesona bawah laut Raja Ampat membuat banyak orang ingin menyelam di sana, padahal perjalanan ke sana mahal dan lama.
    answers_meaning:
      ar_eg:
        - جمال راجا أمبات تحت المية بيخلّي ناس كتير عايزين يغطسوا هناك، مع إن السفر ليها غالي وطويل.
        - سحر راجا أمبات تحت البحر بيشدّ ناس كتير للغطس، رغم إن الرحلة مكلّفة وطويلة.
      ar:
        - تجعل فتنة راجا أمبات تحت الماء كثيرين يرغبون في الغوص هناك، مع أنّ الرحلة إليها مكلفة وطويلة.
        - يغري جمال أعماق راجا أمبات كثيرًا من الناس بالغوص فيها، رغم غلاء الرحلة وطولها.
      en:
        - Raja Ampat's underwater charm makes many people want to dive there, even though the trip is expensive and long.
        - The beauty under Raja Ampat's sea draws many divers, although getting there is costly and slow.
    words: [pesona, menyelam]
    explain:
      ar_eg: 'padahal = مع إن: الرحلة غالية وطويلة ومع ذلك الناس عايزة تروح. pesona = سحر / جاذبية.'
      ar: 'padahal = مع أنّ: الرحلة مكلفة وطويلة ومع ذلك يرغب الناس فيها. pesona = فتنة.'
      en: padahal = even though the trip is costly and long; pesona = charm.
  - id: e08
    type: speaking
    text: Saya pernah melihat pari manta saat menyelam di dekat Waigeo.
    meaning:
      ar_eg: أنا شفت سمكة مانتا مرة وأنا بغطس جنب وايجيو.
      ar: رأيت مرّةً شيطان بحر وأنا أغوص قرب وايجيو.
      en: I once saw a manta ray while diving near Waigeo.
    words: [pari manta, menyelam]
  - id: e09
    type: dictation
    text: Ikan endemik itu hanya hidup di gugusan pulau ini.
    meaning:
      ar_eg: السمكة المتوطّنة دي عايشة بس في مجموعة الجزر دي.
      ar: لا تعيش تلك السمكة المستوطنة إلا في هذا الأرخبيل.
      en: That endemic fish lives only in this island cluster.
    words: [endemik, gugusan]
  - id: e10
    type: fill_blank
    sentence: Turis itu langsung terpikat pada ___ Raja Ampat sejak hari pertama.
    meaning:
      ar_eg: السايح ده اتشدّ على طول لسحر راجا أمبات من أول يوم.
      ar: افتُتن ذلك السائح فورًا بسحر راجا أمبات منذ اليوم الأول.
      en: That tourist was taken with Raja Ampat's charm from the first day.
    options: [pesona, pari manta, gugusan]
    answers: [pesona]
    words: [pesona]
    explain:
      ar_eg: terpikat pada pesona = اتشد لسحر المكان. pari manta حيوان، وgugusan = مجموعة جزر.
      ar: terpikat pada pesona = انجذب إلى سحر المكان. أما pari manta فحيوان وgugusan مجموعة جزر.
      en: terpikat pada pesona = charmed by its beauty. pari manta is an animal, gugusan a cluster of islands.
dialogue:
  title: Di atas perahu ke Misool
  lines:
    - speaker: Pak Yance
      text: Besok pagi kita menyelam di Manta Sandy. Di sana pari manta datang untuk dibersihkan ikan kecil.
      ar_eg: بكرة الصبح هنغطس في مانتا ساندي. هناك سمك المانتا بييجي علشان السمك الصغير ينضّفه.
      ar: سنغوص صباح الغد في مانتا ساندي، حيث تأتي أسماك المانتا لتنظّفها الأسماك الصغيرة.
      en: Tomorrow morning we dive at Manta Sandy. Manta rays come there to be cleaned by small fish.
    - speaker: Mohamed
      text: Wah! Emang bener ada hiu yang jalan di sini, Pak?
      ar_eg: واو! صحيح فيه قرش بيمشي هنا يا أستاذ؟
      ar: رائع! أصحيح أنّ هنا قرشًا يمشي يا أستاذ؟
      en: Wow! Is it true there's a shark that walks here, sir?
    - speaker: Pak Yance
      text: Bener. Hiu berjalan itu endemik. Dia jalan pake siripnya di air dangkal.
      ar_eg: صح. القرش الماشي ده متوطّن هنا. بيمشي بزعانفه في المية القليلة.
      ar: صحيح، القرش الماشي مستوطن هنا، يمشي بزعانفه في المياه الضحلة.
      en: True. The walking shark is endemic. It walks on its fins in shallow water.
    - speaker: Mohamed
      text: Pantas pesona gugusan pulau ini terkenal di seluruh dunia.
      ar_eg: علشان كده سحر الجزر دي مشهور في العالم كله.
      ar: لا عجب أنّ فتنة هذا الأرخبيل ذائعة في العالم كلّه.
      en: No wonder the charm of these islands is famous worldwide.
