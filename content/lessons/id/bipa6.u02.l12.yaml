schema: kabar.lesson/v1
id: bipa6.u02.l12
language: id
title: Ulangan Unit 2
can_do:
  ar_eg: تفهم البانتون والشعر الحديث، وتألّف بانتون بنفسك.
  ar: أن تفهم البانتون والشعر الحديث، وتنظم بانتونًا بنفسك.
  en: Understand pantun and modern poetry, and compose a pantun yourself.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sampiran
        ar_eg: أول سطرين (الصورة)
        ar: السطران الأوّلان
        en: the opening image lines
      - text: majas
        ar_eg: مجاز / صورة بلاغية
        ar: مجاز
        en: figure of speech
      - text: penyair
        ar_eg: شاعر
        ar: شاعر
        en: poet
      - text: rombongan
        ar_eg: وفد / جماعة
        ar: وفد
        en: group, party
      - text: suku kata
        ar_eg: مقطع صوتي
        ar: مقطع صوتي
        en: syllable
    words: [sampiran, majas, penyair, rombongan, suku kata]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Kakeknya sudah berpulang» ده أنهي مجاز؟
      ar: أيّ مجاز في «Kakeknya sudah berpulang»؟
      en: Which figure is "Kakeknya sudah berpulang"?
    options: [paradoks, eufemisme, personifikasi]
    answer: 1
    words: [eufemisme, berpulang]
    explain:
      ar_eg: berpulang بدل meninggal تلطيف، يعني eufemisme. paradoks = تناقض، وpersonifikasi = تشخيص.
      ar: berpulang بدل meninggal تلطيف eufemisme؛ أمّا paradoks فتناقض، وpersonifikasi تشخيص.
      en: berpulang instead of meninggal is a softening, eufemisme. paradoks is a contradiction, and personifikasi is personification.
  - id: e03
    type: fill_blank
    sentence: Isi pantun ada di dua ___ terakhir.
    meaning:
      ar_eg: رسالة البانتون في آخر سطرين.
      ar: مضمون البانتون في السطرين الأخيرين.
      en: A pantun's message is in the last two lines.
    options: [baris, bait, rima]
    answers: [baris]
    words: [isi, baris]
    explain:
      ar_eg: الرسالة في آخر سطرين، والسطر = baris. bait = مقطع كامل، وrima = قافية.
      ar: المضمون في السطرين الأخيرين، والسطر baris؛ أمّا bait فمقطع كامل، وrima القافية.
      en: The message is in the last two lines, baris. bait is a whole stanza, and rima is rhyme.
  - id: e04
    type: listen
    text: Pantun jenaka dari rombongan pengantin laki-laki membuat tamu tertawa. Rombongan pengantin perempuan membalasnya dengan cepat. Setelah empat pantun, pintu dibuka dan pengantin boleh masuk.
    question:
      ar_eg: مين اللي ضحّك الضيوف، وحصل إيه في الآخر؟
      ar: مَن أضحك الضيوف، وماذا حدث في النهاية؟
      en: Who made the guests laugh, and what happened in the end?
    options:
      - Rombongan pengantin perempuan membuat tamu menangis.
      - Seorang penyair membaca puisi sedih.
      - Rombongan pengantin laki-laki membuat tamu tertawa, lalu pintu dibuka.
    answer: 2
    explain:
      ar_eg: وفد العريس (pengantin laki-laki) ضحّك الناس ببانتون هزار، وبعد أربع بانتونات الباب اتفتح. وفد العروسة ردّ بس، ومافيش قصيدة حزينة.
      ar: أضحك وفدُ العريس (pengantin laki-laki) الناسَ ببانتون فكاهي، وبعد أربعة أبيات فُتح الباب؛ وفد العروس ردّ فقط، ولا قصيدة حزينة.
      en: The groom's party made everyone laugh, and after four pantun the door opened. The bride's side only replied; no sad poem.
    words: [jenaka, rombongan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: المقطع ده ساكت وحزين.
      ar: هذا المقطع صامت وحزين.
      en: This stanza is silent and sad.
    answer: Bait ini sunyi dan sedih.
    distractors: [rima, gubuk]
    words: [bait, sunyi]
    explain:
      ar_eg: «المقطع» = Bait و«ساكت وحزين» = sunyi dan sedih. rima وgubuk مش في المعنى.
      ar: «المقطع» Bait و«ساكن حزين» sunyi dan sedih؛ أمّا rima وgubuk فليستا في المعنى.
      en: "\"Stanza\" is Bait and \"silent and sad\" is sunyi dan sedih. rima and gubuk aren't in the meaning."
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة بتقفّي مع «hati»؟
      ar: أيّ كلمة تُقافي «hati»؟
      en: Which word rhymes with "hati"?
    options: [mati, hujan, kota]
    answer: 0
    words: [berima, rima]
    explain:
      ar_eg: hati وmati بيخلصوا بـ -ati، فبيقفّوا. hujan وkota نهايتهم مختلفة.
      ar: hati وmati تنتهيان بـ -ati فتتقافيان؛ أمّا hujan وkota فمختلفتان.
      en: hati and mati end in -ati, so they rhyme. hujan and kota end differently.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عليّ دين جميل لعيلتي في رياو.
      ar: لعائلتي في رياو عليّ فضل لا يُنسى.
      en: I owe a debt of gratitude to my family in Riau.
    answers:
      - Saya punya utang budi kepada keluarga saya di Riau.
      - Saya berutang budi kepada keluarga saya di Riau.
      - Saya punya utang budi pada keluarga di Riau.
      - Aku punya utang budi kepada keluargaku di Riau.
      - Aku punya utang budi kepada keluarga aku di Riau.
      - Aku berutang budi kepada keluarga aku di Riau.
      - Aku punya utang budi pada keluarga di Riau.
    words: [utang budi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Penyair itu menyusun puisi tentang angin yang berbisik, karena dia rindu kampungnya di tepi laut.
    answers_meaning:
      ar_eg:
        - الشاعر ده ألّف قصيدة عن الهوا اللي بيوشوش، علشان هو مشتاق لقريته اللي على البحر.
        - الشاعر كتب قصيدة عن ريح بتهمس، لأنه وحشته قريته اللي على شط البحر.
      ar:
        - نظم ذلك الشاعر قصيدة عن ريح تهمس، لأنّه يشتاق إلى قريته على شاطئ البحر.
        - كتب الشاعر قصيدة عن الريح الهامسة، إذ يحنّ إلى قريته الساحلية.
      en:
        - That poet composed a poem about a whispering wind, because he misses his village by the sea.
        - The poet wrote a poem about the wind that whispers, since he longs for his seaside village.
    explain:
      ar_eg: angin yang berbisik تشخيص (personifikasi)، وkarena بتجيب السبب.
      ar: angin yang berbisik تشخيص (personifikasi)، وkarena تأتي بالسبب.
      en: angin yang berbisik is personification; karena gives the reason.
    words: [penyair, menyusun, puisi, personifikasi]
  - id: e09
    type: dictation
    text: Hidup ibarat bahtera; angin bertiup dari cakrawala.
    meaning:
      ar_eg: الحياة زي سفينة؛ والريح بتهب من الأفق.
      ar: الحياة كسفينة؛ والريح تهبّ من الأفق.
      en: Life is like a ship; the wind blows from the horizon.
    words: [ibarat, bahtera, bertiup, cakrawala]
  - id: e10
    type: speaking
    text: Kupu-kupu hinggap di kelopak bunga, penuh sukacita.
    meaning:
      ar_eg: فراشة وقفت على بتلة وردة، مليانة فرحة.
      ar: حطّت فراشة على بتلة زهرة، ملأى بالبهجة.
      en: A butterfly lands on a petal, full of joy.
    words: [kupu-kupu, kelopak, sukacita]
  - id: e11
    type: match_pairs
    pairs:
      - text: gurindam
        ar_eg: شعر سطرين، سبب ونتيجة
        ar: بيتان، سبب ونتيجة
        en: two-line verse, cause and result
      - text: pelopor
        ar_eg: رائد
        ar: رائد
        en: pioneer
      - text: menghayati
        ar_eg: يعيش المعنى
        ar: يتمثّل المعنى
        en: to feel deeply
      - text: mentari
        ar_eg: الشمس (في الشعر)
        ar: الشمس
        en: sun (poetic)
      - text: layu
        ar_eg: دبلان
        ar: ذابل
        en: withered
      - text: fana
        ar_eg: فاني
        ar: فانٍ، زائل
        en: transient
    words: [gurindam, pelopor, menghayati, mentari, layu, fana]
  - id: e12
    type: fill_blank
    sentence: Setiap bait ___ terdiri atas empat larik yang berima sama.
    meaning:
      ar_eg: كل مقطع في الـ syair فيه أربع أسطر بنفس القافية.
      ar: يتألّف كلّ مقطع من الـ syair من أربعة أسطر على قافية واحدة.
      en: Every stanza of a syair has four lines on the same rhyme.
    options: [syair, gurindam, deklamasi]
    answers: [syair]
    words: [syair, larik]
    explain:
      ar_eg: أربع سطور على نفس القافية دي صفة الـ syair. gurindam سطرين، وdeklamasi = إلقاء.
      ar: أربعة أسطر على قافية واحدة صفة syair؛ أمّا gurindam فسطران، وdeklamasi الإلقاء.
      en: Four lines on one rhyme marks a syair. gurindam has two lines, and deklamasi is recital.
dialogue:
  title: Pantun perpisahan
  lines:
    - speaker: Encik Zul
      text: Besok kamu ke Bukittinggi, Mohamed. Tutuplah dengan pantun.
      ar_eg: بكرة رايح بوكيتينجي يا محمد. اختم ببانتون.
      ar: غدًا تسافر إلى بوكيتينغي يا محمد، فاختم ببانتون.
      en: Tomorrow you're off to Bukittinggi, Mohamed. Close with a pantun.
    - speaker: Mohamed
      text: Perahu kecil di Sungai Siak, membawa ikan ke kota baru.
      ar_eg: مركب صغير في نهر سياك، شايل سمك للمدينة الجديدة.
      ar: قارب صغير في نهر سياك، يحمل السمك إلى المدينة الجديدة.
      en: A small boat on the Siak River, carrying fish to the new town.
    - speaker: Mohamed
      text: Terima kasih, Encik dan Mak Cik, budi baik kalian kuingat selalu.
      ar_eg: شكرًا يا إنشيك ويا ماك تشيك، والجميل ده عمري ما هنساه.
      ar: شكرًا لكما، ولن أنسى معروفكما أبدًا.
      en: Thank you, Encik and Mak Cik; your kindness I'll never forget.
    - speaker: Encik Zul
      text: Rimanya agak bebas, tetapi isinya sampai ke hati. Selamat jalan!
      ar_eg: القافية متساهلة شوية، بس الرسالة وصلت للقلب. مع السلامة!
      ar: القافية متحرّرة قليلًا، لكنّ المضمون بلغ القلب. في أمان الله!
      en: The rhyme is a bit loose, but the message reaches the heart. Safe travels!
souvenir:
  id: bipa6.u02.souvenir
  title: Pantun di pesta pernikahan Melayu
  note:
    ar_eg: في رياو والملايو عمومًا، البانتون بيفتح الخطب والأفراح، ووفد العريس ووفد العروسة بيتبادلوه على الباب قبل ما يدخلوا. أربع سطور بقافية a-b-a-b، أول سطرين صورة وآخر سطرين الرسالة. وفي 2020 اليونسكو سجّلت البانتون تراث ثقافي غير مادي، بترشيح مشترك من إندونيسيا وماليزيا.
    ar: في رياو وبلاد الملايو عامّةً يفتتح البانتون الخطب والأعراس، ويتبادله وفدا العريس والعروس عند الباب قبل الدخول. أربعة أسطر بقافية a-b-a-b، السطران الأوّلان صورة والأخيران رسالة. وفي 2020 أدرجت اليونسكو البانتون في قائمة التراث الثقافي غير المادّي بترشيح مشترك من إندونيسيا وماليزيا.
    en: In Riau and across the Malay world, pantun open speeches and weddings, and the groom's and bride's parties trade them at the door before entering. Four lines rhyming a-b-a-b, the first two an image and the last two the message. In 2020 UNESCO inscribed pantun as Intangible Cultural Heritage, on a joint nomination by Indonesia and Malaysia.
