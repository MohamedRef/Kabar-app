schema: kabar.lesson/v1
id: bipa2.u05.l05
language: id
title: Sup, keju, madu
can_do:
  ar_eg: تطلب شوربة ونودلز وعصير وحلويات في الوارونج.
  ar: أن تطلب الحساء والمعكرونة والعصير والحلويات في المطعم الشعبي.
  en: Order soup, noodles, juice and sweets at a warung.
slides:
  - title: Di warung
    body:
      ar_eg: |
        sup = شوربة، mi = نودلز (mi ayam، mi goreng)، sayur = خضار (sup sayur).
        keju = جبنة، madu = عسل (teh madu).
        jus = عصير: jus jeruk. es krim = آيس كريم، permen = بونبوني.
      ar: |
        sup = حساء، mi = معكرونة النودلز (mi ayam، mi goreng)، sayur = خضار (sup sayur).
        keju = جبن، madu = عسل (teh madu).
        jus = عصير: jus jeruk. es krim = بوظة (آيس كريم)، permen = حلوى (سكاكر).
      en: |
        sup = soup, mi = noodles (mi ayam, mi goreng), sayur = vegetables (sup sayur).
        keju = cheese, madu = honey (teh madu).
        jus = juice: jus jeruk. es krim = ice cream, permen = sweets, candy.
    examples:
      - text: Saya pesan mi ayam dan jus jeruk.
        ar_eg: أنا طالب نودلز بالفراخ وعصير برتقان.
        ar: طلبت نودلز بالدجاج وعصير برتقال.
        en: I'll have chicken noodles and orange juice.
      - text: Anak-anak suka es krim dan permen.
        ar_eg: العيال بيحبوا الآيس كريم والبونبوني.
        ar: يحبّ الأطفال البوظة والحلوى.
        en: Children love ice cream and sweets.
      - text: Teh dengan madu enak sekali.
        ar_eg: الشاي بالعسل حلو أوي.
        ar: الشاي بالعسل لذيذ جدًا.
        en: Tea with honey is delicious.
