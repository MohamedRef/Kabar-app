dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, mau makan apa? Di warung ini ada mi dan sup.
      ar_eg: يا محمد، تاكل إيه؟ الوارونج ده فيه نودلز وشوربة.
      ar: ماذا تريد أن تأكل يا محمد؟ في هذا المطعم نودلز وحساء.
      en: Mohamed, what do you want? This warung has noodles and soup.
    - speaker: Mohamed
      text: Saya mau mi ayam. Ada sayurnya?
      ar_eg: عايز نودلز بالفراخ. فيها خضار؟
      ar: أريد نودلز بالدجاج. هل فيها خضار؟
      en: Chicken noodles for me. Do they come with vegetables?
    - speaker: Ni Luh
      text: Ada. Minumnya apa? Jus atau teh?
      ar_eg: أيوه. تشرب إيه؟ عصير ولا شاي؟
      ar: نعم. وماذا تشرب؟ عصيرًا أم شايًا؟
      en: Yes. What to drink? Juice or tea?
    - speaker: Mohamed
      text: Jus jeruk, tidak pakai gula. Kamu?
      ar_eg: عصير برتقان من غير سكر. وإنتي؟
      ar: عصير برتقال بلا سكّر. وأنتِ؟
      en: Orange juice, no sugar. You?
    - speaker: Ni Luh
      text: Teh panas dengan madu. Nanti kita beli es krim, ya!
      ar_eg: شاي سخن بالعسل. وبعدين نشتري آيس كريم!
      ar: شاي ساخن بالعسل. وبعدها نشتري البوظة!
      en: Hot tea with honey. Then we'll get ice cream!
    - speaker: Mohamed
      text: Wah, ide bagus!
      ar_eg: الله، فكرة حلوة!
      ar: رائع، فكرة جميلة!
      en: Ooh, good idea!
