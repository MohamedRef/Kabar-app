schema: kabar.lesson/v1
id: bipa2.u05.l05
language: id
title: Semangkuk mi ayam
can_do:
  ar_eg: 'تطلب في وارونج: سلطانية نودلز أو شوربة من الحلة، وتسأل مستوية ولا لأ، وتقول طعمها.'
  ar: 'أن تطلب في مطعم شعبي: وعاء نودلز أو حساء من القدر، وتسأل هل نضج، وتصف طعمه.'
  en: 'Order at a warung: a bowl of noodles or soup from the pot, ask if it''s cooked, and say how it tastes.'
slides:
  - title: Di warung mi
    body:
      ar_eg: |
        mi = نودلز (mi ayam، mi goreng)، sup = شوربة. mangkuk = سلطانية: semangkuk mi.
        panci = حلة: الشوربة بتستوي في حلة كبيرة.
        matang = مستوي (والفاكهة matang = مستوية). rasa = طعم: Rasanya enak!
        jus = عصير: jus jeruk. es krim = آيس كريم.
        في الشارع بيقولوا:
        - udah = sudah (خلاص، بقى)
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
      ar: |
        mi = نودلز (mi ayam، mi goreng)، sup = حساء. mangkuk = وعاء عميق: semangkuk mi.
        panci = قدر: ينضج الحساء في قدر كبير.
        matang = ناضج، مطهو (والفاكهة matang = ناضجة). rasa = طعم: Rasanya enak!
        jus = عصير: jus jeruk. es krim = بوظة (آيس كريم).
        في كلام الشارع:
        - udah = sudah (قد، بالفعل)
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
      en: |
        mi = noodles (mi ayam, mi goreng), sup = soup. mangkuk = bowl: semangkuk mi.
        panci = pot: the soup cooks in a big pot.
        matang = cooked, ripe. rasa = taste: Rasanya enak!
        jus = juice: jus jeruk. es krim = ice cream.
        On the street:
        - udah = sudah (already)
        - banget = sekali (very), after the adjective just like sekali
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
    examples:
      - text: Saya pesan semangkuk mi ayam dan jus jeruk.
        ar_eg: أنا طالب سلطانية نودلز بالفراخ وعصير برتقان.
        ar: طلبت وعاء نودلز بالدجاج وعصير برتقال.
        en: I'll have a bowl of chicken noodles and an orange juice.
      - text: Supnya di panci besar, sudah matang.
        ar_eg: الشوربة في الحلة الكبيرة، استوت خلاص.
        ar: الحساء في القدر الكبير، وقد نضج.
        en: The soup is in the big pot; it's ready.
      - text: Rasanya enak sekali!
        ar_eg: طعمه حلو أوي!
        ar: طعمه لذيذ جدًا!
        en: It tastes great!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sup
        ar_eg: شوربة
        ar: حساء
        en: soup
      - text: mi
        ar_eg: نودلز
        ar: نودلز
        en: noodles
      - text: mangkuk
        ar_eg: سلطانية
        ar: وعاء
        en: bowl
      - text: panci
        ar_eg: حلة
        ar: قدر
        en: pot
    words: [sup, mi, mangkuk, panci]
  - id: e02
    type: match_pairs
    pairs:
      - text: jus
        ar_eg: عصير
        ar: عصير
        en: juice
      - text: es krim
        ar_eg: آيس كريم
        ar: بوظة
        en: ice cream
      - text: matang
        ar_eg: مستوي
        ar: ناضج
        en: cooked, ripe
      - text: rasa
        ar_eg: طعم
        ar: طعم
        en: taste
    words: [jus, es krim, matang, rasa]
  - id: e03
    type: listen
    text: Saya mau semangkuk sup dan jus jeruk.
    question:
      ar_eg: طالب إيه؟
      ar: ماذا يطلب؟
      en: What is he ordering?
    options: [شوربة وعصير برتقان, آيس كريم, نودلز]
    answer: 0
    meaning:
      ar_eg: عايز سلطانية شوربة وعصير برتقان.
      ar: أريد وعاء حساء وعصير برتقال.
      en: A bowl of soup and an orange juice, please.
    words: [mangkuk, sup, jus]
  - id: e04
    type: fill_blank
    sentence: Hari ini panas sekali. Ayo makan ___!
    meaning:
      ar_eg: النهارده حر أوي. يلا ناكل ___!
      ar: اليوم حارّ جدًا. هيّا نأكل ___!
      en: It's so hot today. Let's have ___!
    options: [es krim, sup, mi]
    answers: [es krim]
    words: [es krim, sup, mi]
    explain:
      ar_eg: في الحر بناكل es krim (آيس كريم). sup وmi أكل سخن.
      ar: في الحر يُؤكل es krim. أما sup وmi فطعامان ساخنان.
      en: On a hot day it's es krim. sup and mi are hot dishes.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الشوربة بتستوي في إيه؟
      ar: في أيّ شيء ينضج الحساء؟
      en: What does the soup cook in?
    options: [panci, mangkuk, jus]
    answer: 0
    explain:
      ar_eg: 'في الحلة: panci. وmangkuk السلطانية اللي بناكل فيها.'
      ar: 'في القدر: panci، أما mangkuk فالوعاء الذي نأكل فيه.'
      en: 'In the pot: panci. A mangkuk is the bowl you eat from.'
    words: [panci, mangkuk]
  - id: e06
    type: fill_blank
    sentence: Ayamnya belum ___, masih merah di dalam.
    meaning:
      ar_eg: الفرخة لسه ما ___، لسه حمرا من جوه.
      ar: الدجاج لم ___ بعد، ما زال أحمر من الداخل.
      en: The chicken isn't ___ yet; it's still red inside.
    options: [matang, rasa, panci]
    answers: [matang]
    words: [matang, rasa, panci]
    explain:
      ar_eg: belum matang = لسه ما استواش. rasa = طعم، وpanci = حلّة.
      ar: belum matang = لم ينضج بعد. أما rasa فطعم وpanci قدر.
      en: belum matang = not cooked yet. rasa is taste, panci a pot.
  - id: e07
    type: build_sentence
    source:
      ar_eg: عايز عصير مانجة من غير سكر.
      ar: أريد عصير مانجو بلا سكّر.
      en: I'd like mango juice without sugar.
    answer: Saya mau jus mangga, tidak pakai gula.
    distractors: [mi, es krim]
    words: [jus]
    explain:
      ar_eg: jus mangga = عصير مانجة، وtidak pakai gula = من غير سكر. mi وes krim زيادة.
      ar: jus mangga = عصير مانجو، وtidak pakai gula = بلا سكّر. أما mi وes krim فزائدتان.
      en: jus mangga = mango juice, tidak pakai gula = no sugar. mi and es krim don't fit.
  - id: e08
    type: translate
    direction: from_target
    source_text: Rasanya enak! Supnya sudah matang.
    answers_meaning:
      ar_eg: [طعمها حلو! الشوربة استوت, طعمها حلو! الشوربة استوت خلاص]
      ar: [طعمه لذيذ! نضج الحساء, إنه لذيذ! لقد نضج الحساء]
      en: [It tastes good! The soup is cooked, 'Delicious! The soup''s ready']
    words: [rasa, matang, sup]
  - id: e09
    type: speaking
    text: Semangkuk mi ayam dan es krim cokelat, ya.
    meaning:
      ar_eg: سلطانية نودلز بالفراخ وآيس كريم شوكولاتة لو سمحت.
      ar: وعاء نودلز بالدجاج وبوظة بالشوكولاتة من فضلك.
      en: A bowl of chicken noodles and a chocolate ice cream, please.
    words: [mangkuk, mi, es krim]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: «طعم» بالإندونيسي؟
      ar: ما كلمة «طعم» بالإندونيسية؟
      en: What's the word for taste?
    options: [rasa, matang, mi]
    answer: 0
    explain:
      ar_eg: 'rasa = طعم: Rasanya enak!'
      ar: 'rasa = طعم: Rasanya enak!'
      en: 'rasa = taste: Rasanya enak!'
    words: [rasa, matang]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, mau makan apa? Di warung ini ada mi dan sup.
      ar_eg: يا محمد، تاكل إيه؟ الوارونج ده فيه نودلز وشوربة.
      ar: ماذا تريد أن تأكل يا محمد؟ في هذا المطعم نودلز وحساء.
      en: Mohamed, what do you want? This warung has noodles and soup.
    - speaker: Mohamed
      text: Aku mau semangkuk mi ayam.
      ar_eg: عايز سلطانية نودلز بالفراخ.
      ar: أريد وعاء نودلز بالدجاج.
      en: A bowl of chicken noodles for me.
    - speaker: Ni Luh
      text: Supnya juga enak. Ada di panci besar itu.
      ar_eg: الشوربة حلوة كمان. في الحلة الكبيرة دي.
      ar: الحساء لذيذ أيضًا، في ذلك القدر الكبير.
      en: The soup's good too. It's in that big pot.
    - speaker: Mohamed
      text: Udah matang?
      ar_eg: استوت؟
      ar: هل نضج؟
      en: Is it ready?
    - speaker: Ni Luh
      text: Udah. Rasanya enak banget! Minumnya jus atau teh?
      ar_eg: أيوه. طعمها حلو أوي! تشرب عصير ولا شاي؟
      ar: نعم، طعمه لذيذ جدًا! وتشرب عصيرًا أم شايًا؟
      en: Yes. It tastes great! Juice or tea to drink?
    - speaker: Mohamed
      text: Jus jeruk. Nanti kita makan es krim, ya!
      ar_eg: عصير برتقان. وبعدين ناكل آيس كريم!
      ar: عصير برتقال، وبعدها نأكل البوظة!
      en: Orange juice. Then let's have ice cream!
