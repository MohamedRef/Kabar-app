schema: kabar.lesson/v1
id: bipa7.u09.l08
language: id
title: Lintas iman
can_do:
  ar_eg: تحكي عن زيارة بين الأديان وتسمّي أماكن العبادة ورجال الدين.
  ar: أن تروي زيارة بين الأديان وتسمّي دور العبادة ورجال الدين.
  en: Describe an interfaith visit and name places of worship and religious leaders.
slides:
  - title: Kunjungan lintas iman
    body:
      ar_eg: |
        kegiatan lintas iman = نشاط بين ناس من أديان مختلفة.
        في dialog antaragama (حوار الأديان) بيقعد pemuka agama (زعماء دينيين) مع بعض.
        rohaniwan = رجل دين بشكل عام: قسيس، شيخ، راهب.
        أماكن: klenteng = معبد صيني (الكونفوشية والطاوية). vihara = معبد بوذي.
        pesantren = معهد إسلامي داخلي، والطلبة اسمهم santri. kiai = الشيخ الكبير اللي ماسك البيسانترين.
        في سورونج وجاوة فيه شباب بيعملوا زيارات: من البيسانترين للكنيسة للكلينتينج.
        - في الكلام: aja = saja، bikin = membuat، pengen = ingin، soal = tentang، nanya = bertanya.
      ar: |
        kegiatan lintas iman = نشاط يجمع أتباع أديان مختلفة.
        وفي dialog antaragama (الحوار بين الأديان) يجتمع pemuka agama (الزعماء الدينيون).
        rohaniwan = رجل الدين عمومًا: قسّ أو شيخ أو راهب.
        الأماكن: klenteng = معبد صيني (الكونفوشية والطاوية). vihara = معبد بوذي.
        pesantren = معهد إسلامي داخلي، وطلّابه santri. kiai = الشيخ الذي يقود المعهد.
        وفي سورونغ وجاوة شباب ينظّمون زيارات: من المعهد إلى الكنيسة إلى المعبد الصيني.
        - في الكلام اليومي: aja = saja، bikin = membuat، pengen = ingin، soal = tentang، nanya = bertanya.
      en: |
        kegiatan lintas iman = an interfaith activity.
        In dialog antaragama (interreligious dialogue), pemuka agama (religious leaders) sit together.
        rohaniwan = a cleric in general: priest, sheikh, monk.
        Places: klenteng = Chinese temple (Confucian/Taoist). vihara = Buddhist temple.
        pesantren = an Islamic boarding school; its students are santri. kiai = the senior scholar who leads it.
        In Sorong and Java, young people organise visits: from the pesantren to the church to the klenteng.
        - In speech: aja = saja, bikin = membuat, pengen = ingin, soal = tentang, nanya = bertanya.
    examples:
      - text: Para pemuka agama bertemu dalam dialog antaragama.
        ar_eg: زعماء الأديان اتقابلوا في حوار بين الأديان.
        ar: التقى الزعماء الدينيون في حوار بين الأديان.
        en: Religious leaders met in an interreligious dialogue.
      - text: Kiai itu mengajak santrinya mengunjungi klenteng.
        ar_eg: الشيخ خد طلبة المعهد يزوروا المعبد الصيني.
        ar: دعا الشيخ طلّابه لزيارة المعبد الصيني.
        en: The kiai took his students to visit the Chinese temple.
      - text: Biksu menyambut kami di vihara.
        ar_eg: الراهب البوذي استقبلنا في المعبد.
        ar: استقبلنا الراهب في المعبد البوذي.
        en: A monk welcomed us at the vihara.
