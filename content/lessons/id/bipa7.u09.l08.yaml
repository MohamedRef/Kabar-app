  - id: e03
    type: listen
    text: Saat Imlek, klenteng itu penuh lampion merah.
    question:
      ar_eg: إيه اللي مليان فوانيس؟
      ar: ما الممتلئ بالفوانيس؟
      en: What's full of lanterns?
    options: [معبد صيني, معهد ديني, معبد بوذي]
    answer: 0
    meaning:
      ar_eg: في رأس السنة الصينية، المعبد الصيني ده بيبقى مليان فوانيس حمرا.
      ar: في رأس السنة الصينية يمتلئ المعبد الصيني بالفوانيس الحمراء.
      en: At Chinese New Year, that klenteng is full of red lanterns.
    words: [klenteng]
  - id: e04
    type: fill_blank
    sentence: Pendeta, pastor, dan ustaz semuanya ___.
    meaning:
      ar_eg: القسيس والكاهن والشيخ كلهم ___.
      ar: القسّ والكاهن والشيخ كلّهم ___.
      en: Ministers, priests and ustaz are all ___.
    options: [rohaniwan, vihara, lintas iman]
    answers: [rohaniwan]
    words: [rohaniwan, vihara, lintas iman]
    explain:
      ar_eg: القسيس والراهب والشيخ كلهم rohaniwan = رجال دين. vihara = معبد بوذي، وlintas iman = بين الأديان.
      ar: القس والكاهن والشيخ كلهم rohaniwan أي رجال دين.
      en: Clergy of all faiths are rohaniwan.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيقود الـ «pesantren» عادةً؟
      ar: مَن يقود «pesantren» عادةً؟
      en: Who usually leads a 'pesantren'?
    options: [Seorang kiai., Seorang biksu., Kepala klenteng.]
    answer: 0
    explain:
      ar_eg: الكياي هو الشيخ الكبير في المعهد.
      ar: الكياي هو كبير شيوخ المعهد.
      en: The kiai is the senior scholar of the school.
    words: [kiai, pesantren, klenteng]
  - id: e06
    type: fill_blank
    sentence: Umat Buddha beribadah di ___.
    meaning:
      ar_eg: البوذيين بيتعبّدوا في الـ ___.
      ar: يتعبّد البوذيّون في ___.
      en: Buddhists worship at the ___.
    options: [vihara, pesantren, rohaniwan]
    answers: [vihara]
    words: [vihara, pesantren, rohaniwan]
    explain:
      ar_eg: البوذيين بيصلّوا في vihara = معبد بوذي. pesantren = مدرسة إسلامية داخلية، وrohaniwan شخص.
      ar: يتعبد البوذيون في vihara. pesantren مدرسة دينية إسلامية.
      en: Buddhists worship at a vihara.
  - id: e07
    type: build_sentence
    source:
      ar_eg: طلبة المعهد بيدرسوا العربي كل يوم.
      ar: يدرس طلّاب المعهد العربية كلّ يوم.
      en: The pesantren students study Arabic every day.
    answer: Santri di pesantren belajar bahasa Arab setiap hari.
    distractors: [vihara, kiai]
    words: [pesantren]
    explain:
      ar_eg: Santri (الطلبة) + di pesantren + belajar bahasa Arab + setiap hari. vihara وkiai زيادة.
      ar: Santri di pesantren belajar bahasa Arab setiap hari. vihara وkiai زائدتان.
      en: Santri di pesantren + belajar bahasa Arab + setiap hari. vihara and kiai are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Dialog antaragama membuat orang saling mengenal.
    answers_meaning:
      ar_eg: [الحوار بين الأديان بيخلّي الناس تعرف بعض, حوار الأديان بيقرّب الناس من بعض]
      ar: [يجعل الحوار بين الأديان الناس يتعارفون, يقرّب الحوار بين الأديان الناس بعضهم من بعض]
      en: [Interreligious dialogue helps people get to know each other, Dialogue between religions makes people acquainted]
    words: [dialog antaragama]
  - id: e09
    type: speaking
    text: Para pemuka agama memimpin kegiatan lintas iman.
    meaning:
      ar_eg: زعماء الأديان بيقودوا نشاط بين الأديان.
      ar: يقود الزعماء الدينيون نشاطًا بين الأديان.
      en: Religious leaders lead an interfaith activity.
    words: [pemuka agama, lintas iman]
  - id: e10
    type: multiple_choice
    question: Siapa yang biasanya duduk bersama dalam dialog antaragama?
    options: [Hanya mahasiswa ekonomi., Pemuka agama dari berbagai agama., Pemain sepak bola.]
    answer: 1
    explain:
      ar_eg: في الحوار بيقعد زعماء الأديان المختلفة.
      ar: يجتمع في الحوار زعماء الأديان المختلفة.
      en: Leaders of different faiths sit together.
    words: [pemuka agama, dialog antaragama, lintas iman, rohaniwan, kiai, klenteng]
dialogue:
  lines:
    - speaker: Kak Yosua
      text: Mohamed, Sabtu ini komunitas kami bikin tur lintas iman di Sorong.
      ar_eg: يا محمد، السبت ده جماعتنا عاملة جولة بين الأديان في سورونج.
      ar: يا محمد، تنظّم جماعتنا هذا السبت جولة بين الأديان في سورونغ.
      en: Mohamed, this Saturday our group is running an interfaith tour of Sorong.
    - speaker: Mohamed
      text: Kita ke mana aja, Kak?
      ar_eg: هنروح فين يا كاك؟
      ar: إلى أين سنذهب؟
      en: Where are we going?
    - speaker: Kak Yosua
      text: Masjid, gereja, klenteng, lalu vihara. Ada rohaniwan yang menjelaskan di setiap tempat.
      ar_eg: جامع، وكنيسة، ومعبد صيني، وبعدين معبد بوذي. وفي كل مكان فيه رجل دين بيشرح.
      ar: مسجد وكنيسة ومعبد صيني ثمّ معبد بوذي، وفي كلّ مكان رجل دين يشرح.
      en: A mosque, a church, a klenteng, then a vihara. A cleric explains at each place.
    - speaker: Mohamed
      text: Aku pengen nanya ke kiai di masjid soal pesantren di Papua.
      ar_eg: عايز أسأل الشيخ في الجامع عن المعاهد الدينية في بابوا.
      ar: أريد أن أسأل الشيخ في المسجد عن المعاهد في بابوا.
      en: I'd like to ask the kiai at the mosque about pesantren in Papua.
    - speaker: Kak Yosua
      text: Boleh. Di akhir tur ada dialog antaragama. Semua boleh bertanya.
      ar_eg: ينفع. في آخر الجولة فيه حوار بين الأديان. الكل يقدر يسأل.
      ar: بالتأكيد، وفي ختام الجولة حوار بين الأديان، ويحقّ للجميع السؤال.
      en: Sure. At the end there's an interreligious dialogue. Anyone can ask.
