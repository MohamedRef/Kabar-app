schema: kabar.lesson/v1
id: bipa7.u09.l08
language: id
title: Presentasi toleransi
can_do:
  ar_eg: تقدّم عرض قصير عن التسامح وإزاي نبعد عن الكراهية.
  ar: أن تقدّم عرضًا قصيرًا عن التسامح وتجنّب الكراهية.
  en: Give a short presentation on tolerance and avoiding hatred.
slides:
  - title: Dari prasangka ke persahabatan
    grammar: id.idiom.advanced
    body:
      ar_eg: |
        عرض متألّف للدرس، بأربع نقط:
        1. Prasangka (حكم مسبق) muncul karena kita tidak saling kenal.
        2. Ujaran kebencian (خطاب كراهية) di media sosial membuat prasangka makin besar.
        3. Sekolah yang inklusif (بتشمل الكل) mempertemukan anak dari berbagai suku.
        4. Hasilnya, masyarakat yang harmonis (متناغم).
        ختام بتعبير اصطلاحي: Jangan besar kepala karena mayoritas, dan jangan angkat tangan karena minoritas.
        التعبير الاصطلاحي في الختام بيخلّي الجمهور يفتكر الرسالة، بس واحد أو اتنين كفاية.
      ar: |
        عرض مؤلَّف للدرس في أربع نقاط:
        1. Prasangka (الحكم المسبق) muncul karena kita tidak saling kenal.
        2. Ujaran kebencian (خطاب الكراهية) di media sosial membuat prasangka makin besar.
        3. Sekolah yang inklusif (الجامعة للكلّ) mempertemukan anak dari berbagai suku.
        4. Hasilnya, masyarakat yang harmonis (متناغم).
        ختام بتعبير اصطلاحي: Jangan besar kepala karena mayoritas, dan jangan angkat tangan karena minoritas.
        التعبير الاصطلاحي في الختام يثبّت الرسالة في الأذهان، ويكفي واحد أو اثنان.
      en: |
        A talk invented for the lesson, in four points:
        1. Prasangka (prejudice) muncul karena kita tidak saling kenal.
        2. Ujaran kebencian (hate speech) di media sosial membuat prasangka makin besar.
        3. Sekolah yang inklusif (inclusive) mempertemukan anak dari berbagai suku.
        4. Hasilnya, masyarakat yang harmonis (harmonious).
        An idiomatic close: Jangan besar kepala karena mayoritas, dan jangan angkat tangan karena minoritas.
        An idiom at the close makes the message stick, but one or two is enough.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: prasangka
        ar_eg: حكم مسبق
        ar: حكم مسبق
        en: prejudice
      - text: ujaran kebencian
        ar_eg: خطاب كراهية
        ar: خطاب الكراهية
        en: hate speech
      - text: inklusif
        ar_eg: بيشمل الكل
        ar: جامع للكلّ
        en: inclusive
      - text: harmonis
        ar_eg: متناغم
        ar: متناغم
        en: harmonious
    words: [prasangka, ujaran kebencian, inklusif, harmonis]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: على حسب العرض، الحكم المسبق بييجي منين؟
      ar: من أين ينشأ الحكم المسبق بحسب العرض؟
      en: According to the talk, where does prejudice come from?
    options:
      - من كتر السفر.
      - من إننا مانعرفش بعض.
      - من المدارس الشاملة.
    answer: 1
    words: [prasangka]
  - id: e03
    type: fill_blank
    sentence: Komentar yang menghina suku lain termasuk ___.
    meaning:
      ar_eg: التعليق اللي بيهين عِرق تاني يعتبر خطاب كراهية.
      ar: التعليق المسيء إلى جماعة أخرى من خطاب الكراهية.
      en: Comments insulting another ethnic group count as hate speech.
    options: [ujaran kebencian, inklusif, harmonis]
    answers: [ujaran kebencian]
    words: [ujaran kebencian]
  - id: e04
    type: listen
    text: Sekolah yang inklusif menerima semua anak tanpa melihat agama atau sukunya.
    question:
      ar_eg: المدرسة الشاملة بتقبل مين؟
      ar: مَن تقبل المدرسة الجامعة؟
      en: Whom does an inclusive school accept?
    options:
      - كل الأطفال من غير ما تبصّ لدينهم أو عرقهم.
      - أولاد دين واحد بس.
      - الشاطرين بس.
    answer: 0
    words: [inklusif]
  - id: e05
    type: build_sentence
    source:
      ar_eg: إحنا عايزين مجتمع متناغم.
      ar: نريد مجتمعًا متناغمًا.
      en: We want a harmonious society.
    answer: Kami ingin masyarakat yang harmonis.
    distractors: [prasangka, inklusif]
    words: [harmonis]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة ختام فيها تعبير اصطلاحي مناسب؟
      ar: أيّ خاتمة فيها تعبير اصطلاحي مناسب؟
      en: Which closing line uses a fitting idiom?
    options:
      - Terima kasih, selesai.
      - Toleransi itu penting sekali sekali sekali.
      - Jangan besar kepala karena mayoritas, dan jangan angkat tangan karena minoritas.
    answer: 2
    words: [harmonis]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: خطاب الكراهية بيكبّر الأحكام المسبقة.
      ar: يُضخّم خطاب الكراهية الأحكام المسبقة.
      en: Hate speech makes prejudice grow.
    answers:
      - Ujaran kebencian membuat prasangka makin besar.
      - Ujaran kebencian membuat prasangka semakin besar.
      - Ujaran kebencian memperbesar prasangka.
      - Ujaran kebencian menambah prasangka.
    words: [ujaran kebencian, prasangka]
  - id: e08
    type: speaking
    text: Sekolah yang inklusif menciptakan masyarakat yang harmonis.
    meaning:
      ar_eg: المدرسة الشاملة بتعمل مجتمع متناغم.
      ar: تصنع المدرسة الجامعة مجتمعًا متناغمًا.
      en: Inclusive schools create a harmonious society.
    words: [inklusif, harmonis]
  - id: e09
    type: dictation
    text: Prasangka hilang ketika kita saling mengenal.
    meaning:
      ar_eg: الحكم المسبق بيختفي لما نعرف بعض.
      ar: يزول الحكم المسبق حين نتعارف.
      en: Prejudice fades when we get to know each other.
    words: [prasangka]
  - id: e10
    type: translate
    direction: from_target
    source_text: Laporkan ujaran kebencian, jangan ikut menyebarkannya.
    answers_meaning:
      ar_eg:
        - بلّغ عن خطاب الكراهية، وماتشاركش في نشره.
        - لو شفت كلام كراهية بلّغ عنه، ماتشيّروش.
      ar:
        - أبلغ عن خطاب الكراهية، ولا تشارك في نشره.
        - بلِّغ عن الكلام الباعث على الكراهية ولا تنشره.
      en:
        - Report hate speech; don't help spread it.
        - Flag hate speech instead of sharing it.
    words: [ujaran kebencian]
dialogue:
  title: Latihan presentasi
  lines:
    - speaker: Kak Yosua
      text: Presentasimu besok di aula festival. Coba bagian penutupnya.
      ar_eg: العرض بتاعك بكرة في قاعة المهرجان. جرّب الختام.
      ar: عرضك غدًا في قاعة المهرجان. جرّب الخاتمة.
      en: Your talk is tomorrow in the festival hall. Try the closing part.
    - speaker: Mohamed
      text: Prasangka lahir dari jarak. Sekolah yang inklusif menghapus jarak itu.
      ar_eg: الحكم المسبق بيتولد من البُعد. والمدرسة الشاملة بتمسح البُعد ده.
      ar: الحكم المسبق يولد من البُعد، والمدرسة الجامعة تمحو ذلك البُعد.
      en: Prejudice is born of distance. Inclusive schools erase that distance.
    - speaker: Kak Yosua
      text: Bagus sekali. Tambahkan satu contoh dari Sentani supaya lebih hidup.
      ar_eg: حلو قوي. زوّد مثال من سينتاني علشان يبقى حيّ أكتر.
      ar: ممتاز. أضف مثالًا من سينتاني ليصير أكثر حياة.
      en: Very good. Add one example from Sentani to bring it alive.
    - speaker: Mohamed
      text: Gereja dan masjid yang bersebelahan. Itu bukti masyarakat yang harmonis.
      ar_eg: الكنيسة والجامع اللي جنب بعض. ده دليل على مجتمع متناغم.
      ar: الكنيسة والمسجد المتجاوران، دليل على مجتمع متناغم.
      en: The church and mosque side by side. That's proof of a harmonious society.
