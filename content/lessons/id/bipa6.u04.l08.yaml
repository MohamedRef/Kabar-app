schema: kabar.lesson/v1
id: bipa6.u04.l08
language: id
title: Jejak yang terkubur
can_do:
  ar_eg: 'تقرا عن حفرية أثرية في باليمبانج: آثار مدفونة من زمن فات وعرش ورخاء.'
  ar: 'أن تقرأ عن تنقيب أثري في باليمبانغ: آثار مدفونة من زمن غابر، وعرش ورخاء.'
  en: 'Read about a dig in Palembang: buried artefacts from long ago, a throne and prosperity.'
slides:
  - title: Penggalian
    body:
      ar_eg: |
        نص (مكتوب للدرس): Di bawah kota Palembang terkubur jejak Sriwijaya. Dalam penggalian, ditemukan artefak dari abad ketujuh Masehi.
        terkubur = مدفون. penggalian = حفر، تنقيب (من gali). artefak = قطعة أثرية.
        purba = قديم أوي، من زمن ما قبل التاريخ (manusia purba). silam = اللي فات (masa silam، tahun silam).
        Masehi = ميلادي (من «مسيحي»). takhta = عرش (من تخت). kemakmuran = رخا، ازدهار.
      ar: |
        نص (مكتوب للدرس): Di bawah kota Palembang terkubur jejak Sriwijaya. Dalam penggalian, ditemukan artefak dari abad ketujuh Masehi.
        terkubur = مدفون. penggalian = حفر، تنقيب (من gali). artefak = قطعة أثرية.
        purba = قديم جدًا، سحيق (manusia purba). silam = غابر، ماضٍ (masa silam، tahun silam).
        Masehi = ميلادي (من «مسيحي»). takhta = عرش (من تخت). kemakmuran = رخاء، ازدهار.
      en: |
        Text (written for the lesson): Di bawah kota Palembang terkubur jejak Sriwijaya. Dalam penggalian, ditemukan artefak dari abad ketujuh Masehi.
        terkubur = buried. penggalian = excavation (from gali). artefak = artefact.
        purba = ancient, prehistoric (manusia purba). silam = past, bygone (masa silam, tahun silam).
        Masehi = AD, of the Christian era (from Arabic مسيحي, Christian). takhta = throne (from Persian-Arabic تخت). kemakmuran = prosperity.
    examples:
      - text: Dalam penggalian itu ditemukan artefak dari abad ketujuh Masehi.
        ar_eg: الحفرية دي لقت آثار من القرن السابع الميلادي.
        ar: عثر التنقيب على قطع أثرية من القرن السابع الميلادي.
        en: The dig found artefacts from the seventh century AD.
      - text: Pada masa silam, raja Sriwijaya duduk di atas takhta emas.
        ar_eg: زمان، ملك سريويجايا كان بيقعد على عرش دهب.
        ar: في الزمن الغابر جلس ملك سريويجايا على عرش من ذهب.
        en: In bygone days, Srivijaya's king sat on a golden throne.
      - text: Perdagangan membawa kemakmuran.
        ar_eg: التجارة جابت الرخا.
        ar: جلبت التجارة الرخاء.
        en: Trade brought prosperity.
