  - id: e03
    type: listen
    text: Prasasti Kedukan Bukit berasal dari abad ketujuh Masehi.
    question:
      ar_eg: النقش من أنهي تقويم؟
      ar: النقش بأيّ تقويم؟
      en: Which calendar dates the inscription?
    options: [ميلادي, هجري, قبل الميلاد]
    answer: 0
    meaning:
      ar_eg: نقش كيدوكان بوكيت من القرن السابع الميلادي.
      ar: يعود نقش كيدوكان بوكيت إلى القرن السابع الميلادي.
      en: The Kedukan Bukit inscription dates from the seventh century AD.
    words: [Masehi]
  - id: e04
    type: fill_blank
    sentence: Arca Buddha itu ___ di lumpur selama ratusan tahun.
    meaning:
      ar_eg: تمثال بوذا ده كان ___ في الطين مئات السنين.
      ar: ظلّ تمثال بوذا ___ في الطين مئات السنين.
      en: The Buddha statue lay ___ in the mud for hundreds of years.
    options: [terkubur, purba, silam]
    answers: [terkubur]
    words: [terkubur, purba, silam]
    explain:
      ar_eg: التمثال كان مدفون terkubur في الطين. purba وsilam معناهم «قديم/فات»، صفات للزمن.
      ar: كان التمثال مدفونًا terkubur في الطين؛ أمّا purba وsilam فبمعنى قديم وغابر، صفتان للزمن.
      en: The statue lay buried, terkubur, in the mud. purba and silam mean ancient and bygone.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الفترة اللي الناس فيها عايشة كويس والفلوس كتير اسمها إيه؟
      ar: ما اسم الفترة التي يعيش فيها الناس في رغد ووفرة؟
      en: What's a time when people live well and have plenty?
    options: [takhta, artefak, kemakmuran]
    answer: 2
    explain:
      ar_eg: 'kemakmuran = رخا، من makmur (عربي: معمور).'
      ar: kemakmuran = رخاء، من makmur (من العربية معمور).
      en: kemakmuran = prosperity, from makmur (Arabic معمور).
    words: [kemakmuran, takhta, artefak]
  - id: e06
    type: fill_blank
    sentence: Para arkeolog memulai ___ di tepi Sungai Musi.
    meaning:
      ar_eg: علما الآثار بدأوا ___ على ضفة نهر موسي.
      ar: بدأ علماء الآثار ___ على ضفة نهر موسي.
      en: The archaeologists began the ___ on the bank of the Musi.
    options: [penggalian, takhta, kemakmuran]
    answers: [penggalian]
    words: [penggalian, takhta, kemakmuran]
    explain:
      ar_eg: الأثريين بدأوا الحفر penggalian. takhta = عرش وkemakmuran = رخاء، ومش شغل بيتبدأ.
      ar: بدأ الأثريّون الحفر penggalian؛ أمّا takhta فعرش، وkemakmuran رخاء، وليسا عملًا يُبدأ.
      en: Archaeologists began the dig, penggalian. takhta is a throne, and kemakmuran prosperity.
  - id: e07
    type: multiple_choice
    question: Putra mahkota naik ___ setelah ayahnya wafat.
    options: [takhta, artefak, penggalian]
    answer: 0
    explain:
      ar_eg: يطلع على العرش = naik takhta.
      ar: يعتلي العرش = naik takhta.
      en: To ascend the throne = naik takhta.
    words: [takhta, artefak, penggalian]
  - id: e08
    type: build_sentence
    source:
      ar_eg: دي حكاية من زمن غابر.
      ar: هذه حكاية من زمن غابر.
      en: This is a story from bygone days.
    answer: Ini cerita dari masa silam.
    distractors: [purba, Masehi]
    words: [silam]
    explain:
      ar_eg: «الأيام اللي فاتت» = masa silam. purba = قديم جدًا (عصور ما قبل التاريخ)، وMasehi = ميلادي.
      ar: «الزمن الغابر» masa silam؛ أمّا purba فسحيق القدم، وMasehi ميلادي.
      en: "\"Bygone days\" is masa silam. purba is prehistoric-old, and Masehi means AD."
  - id: e09
    type: translate
    direction: from_target
    source_text: Di museum itu ada artefak manusia purba.
    answers_meaning:
      ar_eg: [في المتحف ده فيه آثار من الإنسان القديم, المتحف ده فيه قطع أثرية للإنسان البدائي]
      ar: [في ذلك المتحف قطع أثرية للإنسان القديم, يضمّ المتحف آثارًا لإنسان ما قبل التاريخ]
      en: [That museum has artefacts of ancient humans, The museum holds prehistoric human artefacts]
    words: [artefak, purba]
  - id: e10
    type: speaking
    text: Kemakmuran abad ketujuh Masehi kini terkubur di bawah kota.
    meaning:
      ar_eg: رخا القرن السابع الميلادي دلوقتي مدفون تحت المدينة.
      ar: رخاء القرن السابع الميلادي اليوم مدفون تحت المدينة.
      en: The prosperity of the seventh century AD now lies buried under the city.
    words: [kemakmuran, Masehi, terkubur]
dialogue:
  lines:
    - speaker: Kak Dewi
      text: Di situs ini, orang menggali dan dapat manik-manik dan keramik Tiongkok.
      ar_eg: في الموقع ده، الناس حفرت ولقت خرز وفخار صيني.
      ar: في هذا الموقع حفر الناس فوجدوا خرزًا وخزفًا صينيًا.
      en: At this site, people dug and found beads and Chinese ceramics.
    - speaker: Mohamed
      text: Dari abad berapa artefaknya?
      ar_eg: الآثار دي من أنهي قرن؟
      ar: من أيّ قرن هذه القطع؟
      en: Which century are the artefacts from?
    - speaker: Kak Dewi
      text: Banyak dari abad ke-7 sampai ke-11 Masehi.
      ar_eg: كتير منها من القرن السابع للحداشر الميلادي.
      ar: كثير منها من القرن السابع إلى الحادي عشر الميلادي.
      en: Many from the seventh to the eleventh century AD.
    - speaker: Mohamed
      text: Jadi kota sebesar itu terkubur di bawah Palembang?
      ar_eg: يعني مدينة بالحجم ده مدفونة تحت باليمبانج؟
      ar: أيعني هذا أن مدينة بهذا الحجم مدفونة تحت باليمبانغ؟
      en: So a city that big is buried under Palembang?
    - speaker: Kak Dewi
      text: Sebagian. Takhtanya sudah hilang, tapi jejak kemakmurannya masih ada.
      ar_eg: جزء منها. العرش راح، بس آثار الرخا لسه موجودة.
      ar: جزء منها. ضاع العرش، لكن آثار الرخاء باقية.
      en: Partly. The throne is gone, but traces of its prosperity remain.
