schema: kabar.lesson/v1
id: bipa5.u09.l11
language: id
title: Diskusi bahasa
can_do:
  ar_eg: 'تناقش استخدام اللغة بمرونة: إمتى الخلط مقبول، وإزاي نحافظ على اللغات المحلية.'
  ar: 'أن تناقش استعمال اللغة بمرونة: متى يُقبل الخلط، وكيف نحافظ على اللغات المحلية.'
  en: Discuss language use with nuance, from when mixing is fine to how to keep regional languages alive.
slides:
  - title: Bahasa dan kebanggaan
    grammar: id.register.formal-informal
    body:
      ar_eg: |
        في النقاش ده هتحتاج تمسك العصاية من النص:
        - Dalam percakapan santai … wajar, tetapi dalam tulisan resmi … kurang tepat. = في الكلام العادي … طبيعي، بس في الكتابة الرسمية … مش مناسب.
        كلمتين جداد:
        - pelestarian = الحفاظ على حاجة عشان ماتختفيش (من lestari = دايم)
        - kebanggaan = فخر (من bangga = فخور)
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: ngomong = berbicara، nggak = tidak، ilang = hilang، emang = memang، bikin = membuat، ngerasa = merasa، bener = benar، aku = saya.
      ar: |
        في هذا النقاش تحتاج إلى التوسّط:
        - Dalam percakapan santai … wajar, tetapi dalam tulisan resmi … kurang tepat. = في الحديث اليومي … طبيعي، لكنه في الكتابة الرسمية … غير مناسب.
        وكلمتان جديدتان:
        - pelestarian = الحفاظ على الشيء من الاندثار (من lestari = دائم)
        - kebanggaan = فخر، مدعاة للاعتزاز (من bangga = فخور)
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: ngomong = berbicara، nggak = tidak، ilang = hilang، emang = memang، bikin = membuat، ngerasa = merasa، bener = benar، aku = saya.
      en: |
        This discussion needs a balanced line:
        - Dalam percakapan santai … wajar, tetapi dalam tulisan resmi … kurang tepat. = In casual talk … is normal, but in formal writing … isn't appropriate.
        Two new words:
        - pelestarian = preservation (from lestari = lasting)
        - kebanggaan = pride, a source of pride (from bangga = proud)
        The dialogue uses street forms; the formal ones are beside them: ngomong = berbicara, nggak = tidak, ilang = hilang, emang = memang, bikin = membuat, ngerasa = merasa, bener = benar, aku = saya.
exercises:
  - id: e01
    type: listen
    text: Pelestarian bahasa daerah dimulai dari rumah.
    question:
      ar_eg: الحفاظ على اللغات المحلية بيبدأ منين؟
      ar: من أين يبدأ الحفاظ على اللغات المحلية؟
      en: Where does preserving regional languages start?
    options:
      - من المدرسة.
      - من البيت.
      - من الحكومة.
    answer: 1
    words: [pelestarian, bahasa daerah]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «kebanggaan» معناها إيه؟
      ar: ما معنى «kebanggaan»؟
      en: What does "kebanggaan" mean?
    options:
      - فخر.
      - كسوف.
      - زهق.
    answer: 0
    words: [kebanggaan]
  - id: e03
    type: fill_blank
    sentence: Bahasa Indonesia adalah ___ bangsa Indonesia.
    meaning:
      ar_eg: الإندونيسي هي فخر الشعب الإندونيسي.
      ar: الإندونيسية مفخرة الشعب الإندونيسي.
      en: Indonesian is the pride of the Indonesian nation.
    options: [kebanggaan, pelestarian, campur kode]
    answers: [kebanggaan]
    words: [kebanggaan]
  - id: e04
    type: build_sentence
    source:
      ar_eg: الحفاظ على الجاوي مسؤوليتنا كلنا.
      ar: الحفاظ على الجاوية مسؤوليّتنا جميعًا.
      en: Preserving Javanese is our shared responsibility.
    answer: Pelestarian bahasa Jawa adalah tanggung jawab kita bersama.
    distractors: [gengsi, alih]
    words: [pelestarian]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي رد مناسب في نقاش رسمي عن الخلط بين اللغات؟
      ar: أيّ ردّ يناسب نقاشًا رسميًا عن الخلط اللغوي؟
      en: Which reply fits a formal discussion on code-mixing?
    options:
      - Gue sih bodo amat.
      - Ya gitu deh.
      - Menurut saya, campur kode wajar dalam percakapan santai, tetapi kurang tepat dalam tulisan resmi.
    answer: 2
    words: [campur kode, kurang tepat]
  - id: e06
    type: translate
    direction: from_target
    source_text: Banyak penutur muda tidak lagi memakai bahasa ibu mereka.
    answers_meaning:
      ar_eg:
        - شباب كتير بقوا مش بيتكلموا لغتهم الأم.
        - ناس صغيرة كتير بطّلت تستخدم لغة أهلها.
      ar:
        - كثير من المتحدّثين الشباب لم يعودوا يستعملون لغتهم الأمّ.
        - لم يعد كثير من الناطقين الشباب يستخدمون لغتهم الأمّ.
      en:
        - Many young speakers no longer use their mother tongue.
        - Lots of young speakers have stopped using their first language.
    words: [penutur, bahasa ibu]
  - id: e07
    type: speaking
    text: Bahasa Arab adalah kebanggaan saya, dan bahasa Indonesia adalah jembatan saya.
    meaning:
      ar_eg: العربي فخري، والإندونيسي جسري.
      ar: العربية مفخرتي، والإندونيسية جسري.
      en: Arabic is my pride, and Indonesian is my bridge.
    words: [kebanggaan]
  - id: e08
    type: dictation
    text: Kata serapan dari bahasa Arab terdengar akrab bagi saya.
    meaning:
      ar_eg: الكلمات اللي جاية من العربي بتبان مألوفة ليا.
      ar: تبدو لي الكلمات المقترضة من العربية مألوفة.
      en: Loanwords from Arabic sound familiar to me.
    words: [kata serapan, terdengar]
  - id: e09
    type: match_pairs
    pairs:
      - text: logat
        ar_eg: لهجة / لكنة
        ar: لهجة، لكنة
        en: accent
      - text: bahasa baku
        ar_eg: اللغة الفصحى
        ar: اللغة المعيارية
        en: standard language
      - text: huruf Jawi
        ar_eg: الحروف العربية للملايو
        ar: الخطّ الجاوي
        en: Jawi script
      - text: alih kode
        ar_eg: تنقل من لغة لتانية
        ar: تحوّل لغوي
        en: code-switching
      - text: gengsi
        ar_eg: برستيج
        ar: وجاهة
        en: prestige
    words: [logat, bahasa baku, huruf Jawi, alih kode, gengsi]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الحفاظ على اللغات المحلية مهم.
      ar: الحفاظ على اللغات المحلية مهمّ.
      en: Preserving regional languages is important.
    answers:
      - Pelestarian bahasa daerah itu penting.
      - Pelestarian bahasa daerah penting.
      - Pelestarian bahasa-bahasa daerah itu penting.
      - Pelestarian bahasa daerah sangat penting.
    words: [pelestarian, bahasa daerah]
dialogue:
  title: Diskusi di warung kopi
  lines:
    - speaker: Mas Rizal
      text: Rina, keluargamu masih ngomong bahasa Melayu Pontianak nggak?
      ar_eg: يا رينا، عيلتك لسه بتتكلم ملايو بونتياناك؟
      ar: يا رينا، أما زالت عائلتك تتكلّم ملايوية بونتياناك؟
      en: Rina, does your family still speak Pontianak Malay?
    - speaker: Rina
      text: Orang tuaku iya. Tapi adik-adikku lebih sering campur kode sama bahasa Inggris.
      ar_eg: أهلي أيوه. بس إخواتي الصغيرين بيخلطوا إنجليزي أكتر.
      ar: والداي نعم، أمّا إخوتي الصغار فيخلطون بالإنجليزية أكثر.
      en: My parents do. But my younger siblings mix in English more often.
    - speaker: Mohamed
      text: Menurutku, campur kode itu wajar. Yang penting bahasa ibu nggak ilang.
      ar_eg: في رأيي، الخلط ده طبيعي. المهم اللغة الأم ماتضيعش.
      ar: في رأيي، الخلط طبيعي، والمهمّ ألّا تضيع اللغة الأمّ.
      en: In my view, code-mixing is normal. What matters is that the mother tongue isn't lost.
    - speaker: Mas Rizal
      text: Setuju. Pelestarian bahasa daerah emang harus mulai dari rumah.
      ar_eg: موافق. الحفاظ على اللغات المحلية لازم يبدأ من البيت.
      ar: أوافق، فالحفاظ على اللغات المحلية يبدأ من البيت.
      en: Agreed. Preserving regional languages has to start at home.
    - speaker: Rina
      text: Mungkin kita perlu bikin anak muda ngerasa bahasa daerah itu kebanggaan, bukan barang kuno.
      ar_eg: يمكن محتاجين نخلي الشباب يحسوا إن اللغة المحلية فخر، مش حاجة قديمة.
      ar: لعلّنا نحتاج إلى أن نُشعر الشباب بأنّ اللغة المحلية مفخرة لا شيء بالٍ.
      en: Maybe we need young people to feel their regional language is a source of pride, not something old-fashioned.
    - speaker: Mohamed
      text: Bener. Aku juga bangga sama bahasa Arab Mesir-ku!
      ar_eg: مظبوط. وأنا كمان فخور بلهجتي المصري!
      ar: صحيح، وأنا أيضًا فخور بعاميّتي المصرية!
      en: Right. I'm proud of my Egyptian Arabic too!
