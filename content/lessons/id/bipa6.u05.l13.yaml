schema: kabar.lesson/v1
id: bipa6.u05.l13
language: id
title: Ulangan Unit 5
can_do:
  ar_eg: تكتب عن الإيمان والمجتمع بلغة محترمة ودقيقة.
  ar: أن تكتب عن الإيمان والمجتمع بلغة محترمة ودقيقة.
  en: Write about faith and community in respectful, precise language.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: umat
        ar_eg: أتباع / أمّة
        ar: أتباع / أمّة
        en: followers, community of faith
      - text: korban
        ar_eg: ضحية
        ar: ضحيّة
        en: victim
      - text: ulama
        ar_eg: عالم دين
        ar: عالم دين
        en: religious scholar
      - text: keyakinan
        ar_eg: عقيدة / إيمان
        ar: عقيدة
        en: belief, faith
      - text: harapan
        ar_eg: أمل
        ar: أمل
        en: hope
    words: [umat, korban, ulama, keyakinan, harapan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: تكتب إيه قبل اسم ست مسلمة متوفية؟
      ar: ماذا تكتب قبل اسم امرأة مسلمة متوفّاة؟
      en: What goes before a deceased Muslim woman's name?
    options: [mendiang, almarhum, almarhumah]
    answer: 2
    words: [almarhum, mendiang]
    explain:
      ar_eg: للمتوفاة المسلمة بنقول almarhumah (بالتاء). almarhum للراجل، وmendiang لغير المسلم.
      ar: للمسلمة المتوفّاة almarhumah بالتأنيث؛ أمّا almarhum فللرجل، وmendiang لغير المسلم.
      en: For a Muslim woman it's almarhumah, feminine. almarhum is for a man, and mendiang for a non-Muslim.
  - id: e03
    type: fill_blank
    sentence: Setiap tahun, warga Aceh ___ para korban tsunami pada 26 Desember.
    meaning:
      ar_eg: كل سنة، أهل آتشيه بيحيوا ذكرى ضحايا التسونامي يوم 26 ديسمبر.
      ar: يُحيي أهل آتشيه كلّ عام ذكرى ضحايا التسونامي في 26 ديسمبر.
      en: Every year, the people of Aceh commemorate the tsunami's victims on 26 December.
    options: [mengenang, menghormati, bangkit]
    answers: [mengenang]
    words: [mengenang, korban]
    explain:
      ar_eg: إحياء ذكرى الضحايا = mengenang. menghormati = يحترم (عام)، وbangkit = يقوم.
      ar: إحياء ذكرى الضحايا mengenang؛ أمّا menghormati فالاحترام عمومًا، وbangkit النهوض.
      en: Commemorating victims is mengenang. menghormati is respecting in general, and bangkit is rising.
  - id: e04
    type: listen
    text: Para relawan bergotong royong membangun kembali rumah ibadah itu. Ada warga Muslim, Kristen, dan Buddha. Dalam dua bulan, bangunannya berdiri lagi.
    question:
      ar_eg: المتطوّعين عملوا إيه، ومين كانوا؟
      ar: ماذا فعل المتطوّعون، ومن هم؟
      en: What did the volunteers do, and who were they?
    options:
      - Mereka salat bersama di masjid.
      - Warga dari berbagai agama membangun kembali rumah ibadah itu bersama-sama.
      - Mereka mengumpulkan zakat.
    answer: 1
    explain:
      ar_eg: bergotong royong = اشتغلوا مع بعض، مسلمين ومسيحيين وبوذيين، وبنوا دار العبادة من تاني في شهرين. ماكانوش بيصلّوا ولا بيجمعوا زكاة.
      ar: bergotong royong عملوا معًا، مسلمين ومسيحيين وبوذيين، وأعادوا بناء دار العبادة في شهرين؛ لا صلاة ولا جمع زكاة.
      en: They worked together, Muslims, Christians and Buddhists, and rebuilt the house of worship in two months.
    words: [relawan, gotong royong, rumah ibadah]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الزكاة عبادة وكمان مساعدة للمحتاجين.
      ar: الزكاة عبادة ومساعدة للمحتاجين أيضًا.
      en: Zakat is an act of worship and also help for those in need.
    answer: Zakat adalah ibadah dan juga bantuan bagi yang membutuhkan.
    distractors: [hukum, syariah]
    words: [zakat, ibadah, bantuan]
    explain:
      ar_eg: «عبادة» = ibadah و«مساعدة للمحتاج» = bantuan bagi yang membutuhkan. hukum وsyariah مش في المعنى.
      ar: «عبادة» ibadah و«عون للمحتاج» bantuan bagi yang membutuhkan؛ أمّا hukum وsyariah فليستا في المعنى.
      en: "\"Act of worship\" is ibadah and \"help for those in need\" is bantuan bagi yang membutuhkan. hukum and syariah aren't in the meaning."
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لازم نحترم عقيدة غيرنا.
      ar: علينا أن نحترم عقائد الآخرين.
      en: We must respect other people's beliefs.
    answers:
      - Kita harus menghormati keyakinan orang lain.
      - Kita wajib menghormati keyakinan orang lain.
      - Kita perlu menghormati keyakinan orang lain.
      - Keyakinan orang lain harus kita hormati.
    words: [menghormati, keyakinan]
  - id: e07
    type: translate
    direction: from_target
    source_text: Di Aceh, sebagian hukum daerah didasarkan pada syariah, tetapi aturan itu terutama berlaku untuk warga Muslim.
    answers_meaning:
      ar_eg:
        - في آتشيه، جزء من القوانين المحلية مبني على الشريعة، بس القواعد دي بتطبّق أساسًا على المسلمين.
        - آتشيه فيها قوانين محلية مبنية على الشريعة، لكنها في الأساس للمسلمين.
      ar:
        - في آتشيه، يقوم جزء من القوانين المحلّية على الشريعة، لكنّها تسري أساسًا على المسلمين.
        - بعض القوانين المحلّية في آتشيه مستمدّ من الشريعة، غير أنّها تُطبَّق خصوصًا على السكّان المسلمين.
      en:
        - In Aceh, some local laws are based on sharia, but those rules apply mainly to Muslim residents.
        - Part of Aceh's regional law is based on sharia, though it applies chiefly to Muslims.
    explain:
      ar_eg: tetapi بتجيب الاستدراك، وterutama = أساسًا، وberlaku untuk = بيطبّق على.
      ar: tetapi تأتي بالاستدراك، وterutama خصوصًا، وberlaku untuk يسري على.
      en: tetapi adds the qualification; terutama is mainly; berlaku untuk is applies to.
    words: [hukum, syariah]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي بداية أنسب لخطاب قدّام ناس من أديان مختلفة؟
      ar: أيّ افتتاح أنسب لخطاب أمام جمهور من أديان مختلفة؟
      en: Which opening best suits a speech to a mixed-faith audience?
    options:
      - Assalamualaikum, salam sejahtera bagi kita semua.
      - Hai, semuanya!
      - Assalamualaikum saja.
    answer: 0
    words: [salam sejahtera]
    explain:
      ar_eg: "لجمهور من أديان مختلفة: السلام عليكم وبعدها salam sejahtera للكل. «Hai» مش رسمي، و«Assalamualaikum» لوحدها بتسيب ناس."
      ar: "لجمهور متعدّد الأديان: السلام عليكم ثمّ salam sejahtera للجميع؛ أمّا «Hai» فغير رسمية، و«Assalamualaikum» وحدها تُغفل بعضهم."
      en: "For a mixed audience: Assalamualaikum plus salam sejahtera for all. \"Hai\" is too casual, and Assalamualaikum alone leaves people out."
  - id: e09
    type: dictation
    text: Jemaat masjid dan gereja kerap berbaur dalam kegiatan sosial.
    meaning:
      ar_eg: المصلّين في الجامع والكنيسة كتير بيختلطوا في الأنشطة الاجتماعية.
      ar: كثيرًا ما يختلط روّاد المسجد والكنيسة في الأنشطة الاجتماعية.
      en: Mosque and church congregations often mix in social activities.
    words: [jemaat, kerap, berbaur]
  - id: e10
    type: speaking
    text: Relawan sedunia datang, dan warga memberi sedekah dengan ikhlas.
    meaning:
      ar_eg: متطوعين من العالم كله جم، والناس اتصدقت بإخلاص.
      ar: جاء متطوعون من أنحاء العالم، وتصدّق الناس بإخلاص.
      en: Volunteers came from around the world, and people gave charity sincerely.
    words: [sedunia, sedekah, ikhlas]
  - id: e11
    type: match_pairs
    pairs:
      - text: tradisi lisan
        ar_eg: تقليد شفهي
        ar: تقليد شفهي
        en: oral tradition
      - text: peringatan dini
        ar_eg: إنذار مبكر
        ar: إنذار مبكّر
        en: early warning
      - text: kompak
        ar_eg: متناسقين
        ar: متناسق
        en: in sync
      - text: minoritas
        ar_eg: أقلية
        ar: أقلية
        en: minority
      - text: rohani
        ar_eg: روحي
        ar: روحي
        en: spiritual
      - text: puing
        ar_eg: ردم، أنقاض
        ar: أنقاض
        en: rubble
    words: [tradisi lisan, peringatan dini, kompak, minoritas, rohani, puing]
  - id: e12
    type: listen
    text: Ketika air surut, warga Simeulue tidak menunggu sirene. Mereka langsung lari ke bukit. Hanya tujuh orang yang meninggal di pulau itu.
    question:
      ar_eg: أهل سيميولوي عملوا إيه لما البحر رجع لورا؟
      ar: ماذا فعل أهل سيميولوي حين انحسر البحر؟
      en: What did Simeulue's people do when the sea drew back?
    options:
      - Mereka menunggu sirene.
      - Mereka langsung lari ke bukit tanpa menunggu sirene.
      - Mereka turun ke laut.
    answer: 1
    explain:
      ar_eg: ماستنوش السرينة وجريوا على التل على طول، علشان كده مات سبعة بس. ماستنوش ومانزلوش البحر.
      ar: لم ينتظروا الصفّارة وجروا إلى التلّ فورًا، ولذا لم يمت إلّا سبعة؛ لم ينتظروا ولم ينزلوا إلى البحر.
      en: They didn't wait for the siren and ran straight uphill, so only seven died. They neither waited nor went to the sea.
    words: [air surut, sirene, bukit]
dialogue:
  title: Azan di Masjid Raya
  lines:
    - speaker: Kak Rahmah
      text: Waktu tsunami, banyak orang berlindung di masjid ini.
      ar_eg: وقت التسونامي، ناس كتير استخبّوا في الجامع ده.
      ar: احتمى كثيرون بهذا المسجد وقت التسونامي.
      en: During the tsunami, many people took shelter in this mosque.
    - speaker: Mohamed
      text: Masjidnya tetap berdiri, ya. Pantas Aceh dapat nama Serambi Mekkah.
      ar_eg: الجامع فضل واقف. مش غريبة إن آتشيه خدت اسم «شرفة مكة».
      ar: بقي المسجد قائمًا. لا عجب أن نالت آتشيه اسم «شرفة مكة».
      en: The mosque stayed standing. No wonder Aceh got the name Serambi Mekkah, the Veranda of Mecca.
    - speaker: Kak Rahmah
      text: Dulu dari pelabuhan Aceh, jemaah haji berlayar ke Mekkah.
      ar_eg: زمان، الحجّاج كانوا بيبحروا لمكة من ميناء آتشيه.
      ar: كان الحجّاج قديمًا يبحرون إلى مكّة من ميناء آتشيه.
      en: Long ago, pilgrims sailed to Mecca from Aceh's harbour.
    - speaker: Mohamed
      text: Dan sekarang seorang mahasiswa dari Mesir salat di sini. Alhamdulillah.
      ar_eg: ودلوقتي طالب من مصر بيصلّي هنا. الحمد لله.
      ar: والآن يصلّي هنا طالب من مصر. الحمد لله.
      en: And now a student from Egypt prays here. Alhamdulillah.
souvenir:
  id: bipa6.u05.souvenir
  title: Masjid Raya Baiturrahman
  note:
    ar_eg: آتشيه اتسمّت «شرفة مكة» لأنها من أوائل الأماكن اللي الإسلام ثبت فيها في الأرخبيل، ولأن الحجاج كانوا بيبحروا منها. جامع بيت الرحمن الكبير في باندا آتشيه اتحرق في الحرب مع الهولنديين سنة 1873، والهولنديين بنوه من تاني. وفي تسونامي 2004 فضل واقف وسط الدمار، وبقى ملجأ للناس ورمز لقيام آتشيه من تاني.
    ar: سُمّيت آتشيه «شرفة مكّة» لأنّها من أوائل البقاع التي رسخ فيها الإسلام في الأرخبيل، ولأنّ الحجّاج كانوا يبحرون منها. احترق مسجد بيت الرحمن الكبير في باندا آتشيه خلال الحرب مع الهولنديين عام 1873، ثمّ أعاد الهولنديون بناءه. وفي تسونامي 2004 بقي قائمًا وسط الخراب، فصار ملجأً للناس ورمزًا لنهوض آتشيه.
    en: Aceh is called the "Veranda of Mecca" because it was one of the first places Islam took hold in the archipelago, and pilgrims sailed from there. Banda Aceh's Baiturrahman Grand Mosque burned in the war with the Dutch in 1873 and was rebuilt by the Dutch. In the 2004 tsunami it stayed standing amid the destruction, becoming a shelter and a symbol of Aceh rising again.
