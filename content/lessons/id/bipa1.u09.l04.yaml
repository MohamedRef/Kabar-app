schema: kabar.lesson/v1
id: bipa1.u09.l04
language: id
title: Sebelah kiri, sebelah kanan
can_do:
  ar_eg: تقول على الشمال وعلى اليمين.
  ar: أن تقول على اليسار وعلى اليمين.
  en: Say on the left and on the right.
slides:
  - title: Sebelah kiri, sebelah kanan
    body:
      ar_eg: |
        sebelah بتيجي كمان مع اليمين والشمال: di sebelah kanan = على اليمين، di sebelah kiri = على الشمال.
        Masjid Istiqlal di sebelah kiri = جامع الاستقلال على الشمال.
        ومع الحركة غيّر di بـ ke أو dari: masuk ke dalam = يدخل جوه، dari belakang = من ورا.
      ar: |
        وتأتي sebelah مع اليمين واليسار: di sebelah kanan = على اليمين، di sebelah kiri = على اليسار.
        ومع الحركة تُستبدل di بـ ke أو dari: masuk ke dalam = يدخل إلى الداخل، dari belakang = من الخلف.
      en: |
        sebelah also goes with left and right: di sebelah kanan = on the right, di sebelah kiri = on the left.
        With movement, swap di for ke or dari: masuk ke dalam = go inside, dari belakang = from behind.
    grammar: id.location.words
    examples:
      - text: Kamar mandinya di sebelah kanan.
        ar_eg: الحمّام على اليمين.
        ar: الحمّام على اليمين.
        en: The bathroom is on the right.
