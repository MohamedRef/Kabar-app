dialogue:
  lines:
    - speaker: Mohamed
      text: Permisi, Mbak. Kamar mandinya di mana?
      ar_eg: لو سمحتي، الحمام فين؟
      ar: عفوًا يا آنسة، أين الحمّام؟
      en: Excuse me. Where's the bathroom?
    - speaker: Mbak Wulan
      text: Di sebelah kiri, Pak, di samping dapur.
      ar_eg: على الشمال يا أستاذ، جنب المطبخ.
      ar: على اليسار يا سيدي، بجانب المطبخ.
      en: On the left, sir, next to the kitchen.
    - speaker: Mohamed
      text: Sebelah kiri? Dan musala?
      ar_eg: على الشمال؟ والمصلّى؟
      ar: على اليسار؟ والمصلّى؟
      en: On the left? And the prayer room?
    - speaker: Mbak Wulan
      text: Musala di sebelah kanan, Pak.
      ar_eg: المصلّى على اليمين يا أستاذ.
      ar: المصلّى على اليمين يا سيدي.
      en: The prayer room is on the right, sir.
