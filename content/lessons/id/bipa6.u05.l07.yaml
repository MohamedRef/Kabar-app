        ar: سنّة
        en: sunnah
      - text: pahala
        ar_eg: ثواب
        ar: ثواب، أجر
        en: divine reward
      - text: sedekah
        ar_eg: صدقة
        ar: صدقة
        en: charity
    words: [rasul, sunnah, pahala, sedekah]
  - id: e02
    type: match_pairs
    pairs:
      - text: ikhlas
        ar_eg: إخلاص؛ راضي
        ar: إخلاص
        en: sincere
      - text: mendoakan
        ar_eg: يدعي لـ
        ar: يدعو لـ
        en: to pray for
      - text: dermawan
        ar_eg: كريم
        ar: كريم
        en: generous
      - text: kerap
        ar_eg: كتير، غالبًا
        ar: كثيرًا
