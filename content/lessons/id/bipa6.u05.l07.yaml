    words: [ikhlas, mendoakan, dermawan, kerap]
  - id: e03
    type: listen
    text: Jangan lupa mendoakan orang tua setiap selesai salat.
    question:
      ar_eg: المفروض تعمل إيه بعد الصلاة؟
      ar: ماذا ينبغي أن تفعل بعد الصلاة؟
      en: What should you do after prayers?
    options: [تدعي لأهلك, تزور أهلك, تكلم أهلك]
    answer: 0
    meaning:
      ar_eg: ما تنساش تدعي لأبوك وأمك بعد كل صلاة.
      ar: لا تنسَ الدعاء لوالديك بعد كل صلاة.
      en: Don't forget to pray for your parents after every prayer.
    words: [mendoakan]
  - id: e04
    type: fill_blank
    sentence: Salat dua rakaat sebelum Subuh hukumnya ___.
    meaning:
      ar_eg: ركعتين قبل الصبح حكمهم ___.
      ar: ركعتا الفجر حكمهما ___.
      en: Two rak'ahs before Subuh are ___.
    options: [sunnah, pahala, kerap]
    answers: [sunnah]
    words: [sunnah, pahala, kerap]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين بيدّي فلوس كتير للمحتاجين؟
      ar: من يعطي المحتاجين بسخاء؟
      en: Who gives generously to people in need?
    options: [dermawan, ikhlas, kerap]
    answer: 0
    explain:
      ar_eg: dermawan = كريم، بيدّي كتير.
      ar: dermawan = كريم، كثير العطاء.
      en: dermawan = generous, a giver.
    words: [dermawan, ikhlas, kerap]
  - id: e06
    type: fill_blank
    sentence: Dia memberi tanpa berharap apa pun. Dia ___.
    meaning:
      ar_eg: بيدّي من غير ما يستنى حاجة. هو ___.
      ar: يعطي دون أن ينتظر شيئًا. إنه ___.
      en: He gives without expecting anything. He is ___.
    options: [ikhlas, rasul, sedekah]
    answers: [ikhlas]
    words: [ikhlas, rasul, sedekah]
  - id: e07
    type: multiple_choice
    question: Setiap kebaikan, sekecil apa pun, ada ___-nya.
    options: [sunnah, rasul, pahala]
    answer: 2
    explain:
      ar_eg: pahala = الثواب؛ أصلها سنسكريتي مش عربي.
      ar: pahala = الثواب؛ أصلها سنسكريتي لا عربي.
      en: pahala = reward; it's Sanskrit, not Arabic.
    words: [pahala, sunnah, rasul]
  - id: e08
    type: build_sentence
    source:
      ar_eg: هو كتير بيتصدق بعد صلاة الجمعة.
      ar: كثيرًا ما يتصدّق بعد صلاة الجمعة.
      en: He often gives charity after Friday prayers.
    answer: Dia kerap memberi sedekah setelah salat Jumat.
    distractors: [pahala, dermawan]
    words: [kerap, sedekah]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kita mengikuti sunnah Rasul dengan ikhlas.
    answers_meaning:
      ar_eg: [إحنا بنتبع سُنة الرسول بإخلاص, بنمشي على سُنة النبي بإخلاص]
      ar: [نتّبع سنّة الرسول بإخلاص]
      en: ['We follow the Prophet''s sunnah sincerely', 'We follow the Messenger''s way with sincerity']
    words: [sunnah, rasul, ikhlas]
  - id: e10
    type: speaking
    text: Terima kasih, Pak Haji yang dermawan. Saya akan mendoakan Bapak.
    meaning:
      ar_eg: شكرًا يا حاج يا كريم. هدعيلك.
      ar: شكرًا أيها الحاج الكريم. سأدعو لك.
      en: Thank you, generous Pak Haji. I'll pray for you.
    words: [dermawan, mendoakan]
dialogue:
  lines:
    - speaker: Kak Rahmah
      text: Habis Jumatan, banyak jemaah memberi sedekah di depan masjid.
      ar_eg: بعد الجمعة، ناس كتير بتتصدق قدام الجامع.
      ar: بعد صلاة الجمعة يتصدّق كثير من المصلّين أمام المسجد.
      en: After Friday prayers, many worshippers give charity outside the mosque.
    - speaker: Mohamed
      text: Di Kairo juga. Orang Mesir kerap memberi tanpa banyak kata.
      ar_eg: في القاهرة كمان. المصريين كتير بيدّوا من غير كلام كتير.
      ar: في القاهرة أيضًا. كثيرًا ما يعطي المصريون دون كلام كثير.
      en: In Cairo too. Egyptians often give without fuss.
    - speaker: Kak Rahmah
      text: Itu namanya ikhlas. Pahalanya lebih besar.
      ar_eg: ده اسمه إخلاص. وثوابه أكبر.
      ar: هذا هو الإخلاص. وثوابه أعظم.
      en: That's ikhlas. The reward is greater.
    - speaker: Mohamed
      text: Tadi seorang bapak dermawan mendoakan saya juga.
      ar_eg: من شوية راجل كريم دعالي كمان.
      ar: قبل قليل دعا لي رجل كريم أيضًا.
      en: Just now a generous man prayed for me too.
    - speaker: Kak Rahmah
      text: Di Aceh, tamu itu dimuliakan. Itu juga sunnah Rasul.
      ar_eg: في آتشيه، الضيف بيتكرّم. ودي كمان سُنة الرسول.
      ar: في آتشيه يُكرَم الضيف. وهذه أيضًا سنّة الرسول.
      en: In Aceh, guests are honoured. That's the Prophet's sunnah too.
