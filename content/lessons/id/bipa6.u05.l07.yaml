schema: kabar.lesson/v1
id: bipa6.u05.l07
language: id
title: Jumat di Baiturrahman
can_do:
  ar_eg: تتكلم بعد صلاة الجمعة عن الصدقة والثواب والإخلاص بكلمات عربية الأصل.
  ar: أن تتحدث بعد صلاة الجمعة عن الصدقة والثواب والإخلاص بكلمات عربية الأصل.
  en: Talk after Friday prayers about charity, reward and sincerity, using Arabic-origin words.
slides:
  - title: Kata dari bahasa Arab
    body:
      ar_eg: |
        كلمات هتعرفها على طول، بس انتبه للنطق والمعنى:
        rasul = رسول (Rasulullah ﷺ). sunnah = سُنة؛ وكمان "مستحب" (salat sunnah).
        pahala = ثواب، أجر (مش عربي، أصلها سنسكريتي). sedekah = صدقة. ikhlas = إخلاص، وكمان "راضي من قلبه": Saya ikhlas.
        mendoakan = يدعي لحد (من doa). dermawan = كريم، بيتبرع كتير. kerap = كتير، غالبًا (kerap kali).
      ar: |
        كلمات ستعرفها فورًا، لكن انتبه للنطق والمعنى:
        rasul = رسول (Rasulullah ﷺ). sunnah = سنّة؛ وتعني "مستحبّ" أيضًا (salat sunnah).
        pahala = ثواب، أجر (ليست عربية، أصلها سنسكريتي). sedekah = صدقة. ikhlas = إخلاص، وتعني الرضا من القلب: Saya ikhlas.
        mendoakan = يدعو لأحد (من doa). dermawan = كريم، كثير العطاء. kerap = كثيرًا، غالبًا (kerap kali).
      en: |
        Words you'll recognise at once; mind the sound and the meaning:
        rasul = messenger, prophet (Rasulullah ﷺ). sunnah = the Prophet's practice; also "recommended" (salat sunnah).
        pahala = divine reward (Sanskrit, not Arabic). sedekah = voluntary charity. ikhlas = sincerity; also "I give it gladly": Saya ikhlas.
        mendoakan = to pray for someone (from doa). dermawan = generous, a giver. kerap = often (kerap kali).
    examples:
      - text: Bersedekah pada hari Jumat itu sunnah.
        ar_eg: الصدقة يوم الجمعة سُنة.
        ar: الصدقة يوم الجمعة سنّة.
        en: Giving charity on Friday is sunnah.
      - text: Semoga Allah memberi pahala atas sedekahmu.
        ar_eg: ربنا يجعل صدقتك في ميزان حسناتك.
        ar: جعل الله صدقتك في ميزان حسناتك.
        en: May God reward your charity.
      - text: Pak Haji itu dermawan; dia kerap membantu anak yatim.
        ar_eg: الحاج ده كريم؛ دايمًا بيساعد اليتامى.
        ar: ذلك الحاج كريم؛ كثيرًا ما يساعد الأيتام.
        en: That Pak Haji is generous; he often helps orphans.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rasul
