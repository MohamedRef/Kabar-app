schema: kabar.lesson/v1
id: bipa2.u06.l08
language: id
title: Ulangan Unit 6
can_do:
  ar_eg: توصف الشارع اللي ساكن فيه.
  ar: أن تصف شارعك.
  en: Describe your street.
slides:
  - title: Kamar mandi saya, silakan masuk
    body:
      ar_eg: |
        فكّر نفسك:
        - المركّب كلمة واحدة، وصاحبه في الآخر: kamar tidur saya، rumah sakit itu، kamar mandinya.
        - tolong = اعملّي خدمة، silakan = اتفضل (عزومة)، minta = عايز آخد حاجة، mohon = برجاء (رسمي).
        - كلمات المكان قبل الحاجة: di seberang warung، di ujung gang، di antara masjid dan apotek.
        - ومع ada استعمل كلمات العدّ: sebuah (حاجات ومباني)، seorang (ناس)، seekor (حيوانات).
      ar: |
        تذكير:
        - المركّب كلمة واحدة والمالك في آخره: kamar tidur saya، rumah sakit itu، kamar mandinya.
        - tolong لطلب خدمة، وsilakan للدعوة، وminta لطلب شيء، وmohon للرجاء الرسمي.
        - ظرف المكان قبل الاسم: di seberang warung، di ujung gang، di antara masjid dan apotek.
        - ومع ada استعمل ألفاظ العدّ: sebuah للأشياء والمباني، وseorang للبشر، وseekor للحيوان.
      en: |
        Recap:
        - A compound is one word; the owner goes last: kamar tidur saya, rumah sakit itu, kamar mandinya.
        - tolong = do me a favour, silakan = go ahead (offer), minta = may I have, mohon = kindly (formal).
        - Position word before the noun: di seberang warung, di ujung gang, di antara masjid dan apotek.
        - With ada, use counters: sebuah (things, buildings), seorang (people), seekor (animals).
    grammar: id.request.tolong-silakan
    examples:
      - text: Silakan masuk. Kamar mandinya di sebelah dapur.
        ar_eg: اتفضل ادخل. الحمّام جنب المطبخ.
        ar: تفضّل بالدخول. الحمّام بجانب المطبخ.
        en: Please come in. The bathroom is next to the kitchen.
      - text: Di ujung gang ada sebuah pura.
        ar_eg: في آخر الحارة فيه معبد.
        ar: في آخر الزقاق معبد.
        en: At the end of the alley there's a temple.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ruang tamu
        ar_eg: صالون
        ar: غرفة الضيوف
        en: living room
      - text: rumah makan
        ar_eg: مطعم
        ar: مطعم
        en: restaurant
      - text: tetangga
        ar_eg: جار
        ar: جار
        en: neighbour
      - text: seberang
        ar_eg: الناحية التانية
        ar: الجهة المقابلة
        en: the other side
      - text: sewa
        ar_eg: إيجار
        ar: إيجار
        en: rent
    words: [ruang tamu, rumah makan, tetangga, seberang, sewa]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مدام يانتي عاملة أكل وعايزة تعزم عليك. تقول إيه؟
      ar: أعدّت السيدة يانتي طعامًا وتريد أن تدعوك إليه. ماذا تقول؟
      en: Bu Yanti has made food and wants to offer you some. What does she say?
    options: ['Tolong makan, Pak.', 'Minta makan, Pak.', 'Silakan makan, Pak.']
    answer: 2
    explain:
      ar_eg: عزومة = silakan.
      ar: الدعوة بـ silakan.
      en: An offer = silakan.
    words: [silakan]
  - id: e03
    type: multiple_choice
    question: Pak Wayan punya tiga ___ ayam.
    options: [ekor, orang, buah]
    answer: 0
    explain:
      ar_eg: الفراخ حيوانات، يبقى ekor.
      ar: الدجاج حيوان فيُعدّ بـ ekor.
      en: Chickens are animals, so ekor.
    words: [ekor]
  - id: e04
    type: listen
    text: Rumah sakitnya di seberang rumah makan.
    options: [Rumah sakitnya di seberang rumah makan., Rumah sakitnya di sebelah rumah makan., Rumah makannya di seberang rumah sakit.]
    answer: 0
    words: [rumah sakit, rumah makan, seberang]
  - id: e05
    type: fill_blank
    sentence: ___ bantu saya, Mbak. Saya tidak tahu jalan ke pantai.
    meaning:
      ar_eg: لو سمحتي ساعديني. أنا مش عارف الطريق للبحر.
      ar: ساعديني من فضلكِ، فأنا لا أعرف الطريق إلى الشاطئ.
      en: Please help me, miss. I don't know the way to the beach.
    options: [Silakan, Minta, Tolong]
    answers: [Tolong]
    words: [tolong, bantu]
  - id: e06
    type: fill_blank
    sentence: Di jalan saya ada ___ masjid dan dua buah warung.
    meaning:
      ar_eg: في شارعي فيه جامع ووارونجين.
      ar: في شارعي مسجد ومطعمان صغيران.
      en: On my street there's a mosque and two warungs.
    options: [seekor, seorang, sebuah]
    answers: [sebuah]
    words: [buah]
  - id: e07
    type: build_sentence
    source:
      ar_eg: فيه أوضة فاضية قريبة من المستشفى؟
      ar: هل توجد غرفة شاغرة قرب المستشفى؟
      en: Is there a free room near the hospital?
    answer: Ada kamar kosong dekat rumah sakit?
    distractors: [makan, seorang]
    words: [kosong, rumah sakit]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ممكن شوية مية يا مدام؟
      ar: هل لي بقليل من الماء يا سيدتي؟
      en: Could I have some water, ma'am?
    answer: Boleh minta air putih, Bu?
    distractors: [tolong, silakan]
    words: [minta, air putih]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: السكن بتاعي في آخر الحارة.
      ar: سكني في آخر الزقاق.
      en: My boarding house is at the end of the alley.
    answers: [Kos saya di ujung gang., Kos saya di ujung gang, Kosku di ujung gang., Kosku di ujung gang, Kos saya ada di ujung gang.]
    words: [kos, ujung, gang]
  - id: e10
    type: dictation
    text: Tetangga saya punya seekor anjing.
    meaning:
      ar_eg: جاري عنده كلب.
      ar: لدى جاري كلب.
      en: My neighbour has a dog.
    words: [tetangga, seekor]
  - id: e11
    type: speaking
    text: Di jalan saya ada sebuah pura, sebuah warung, dan sebuah apotek.
    meaning:
      ar_eg: في شارعي فيه معبد ووارونج وصيدلية.
      ar: في شارعي معبد ومطعم صغير وصيدلية.
      en: On my street there's a temple, a warung and a pharmacy.
    words: [buah, pura]
dialogue:
  title: Kos baru Mohamed
  lines:
    - speaker: Rina
      text: Mohamed, bagaimana kos barumu di Sanur?
      ar_eg: يا محمد، إيه أخبار السكن الجديد بتاعك في سانور؟
      ar: يا محمد، كيف سكنك الجديد في سانور؟
      en: Mohamed, how's your new place in Sanur?
    - speaker: Mohamed
      text: Bagus! Kamar tidur saya besar, dan kamar mandinya di dalam.
      ar_eg: حلو! أوضة نومي كبيرة، والحمّام جوّه.
      ar: جميل! غرفة نومي كبيرة، والحمّام في الداخل.
      en: Great! My bedroom is big, and the bathroom is inside.
    - speaker: Rina
      text: Jalannya bagaimana? Ramai?
      ar_eg: والشارع عامل إزاي؟ زحمة؟
      ar: وكيف الشارع؟ هل هو مزدحم؟
      en: What's the street like? Busy?
    - speaker: Mohamed
      text: Tidak terlalu ramai. Di ujung gang ada sebuah pura, dan di seberang pura ada warung.
      ar_eg: مش زحمة قوي. في آخر الحارة فيه معبد، وقصاد المعبد فيه وارونج.
      ar: ليس مزدحمًا جدًّا. في آخر الزقاق معبد، ومقابل المعبد مطعم صغير.
      en: Not too busy. At the end of the alley there's a temple, and across from the temple there's a warung.
    - speaker: Rina
      text: Tetanggamu ramah?
      ar_eg: جيرانك لطاف؟
      ar: هل جيرانك لطفاء؟
      en: Are your neighbours friendly?
    - speaker: Mohamed
      text: Ramah sekali! Setiap sore Bu Yanti bilang, "Silakan makan, Pak!"
      ar_eg: لطاف جدًّا! كل يوم العصر مدام يانتي تقولّي «اتفضل كُل يا أستاذ!»
      ar: لطفاء جدًّا! كل مساء تقول لي السيدة يانتي «تفضّل كُل يا سيدي!»
      en: Very friendly! Every afternoon Bu Yanti says, "Please eat, sir!"
souvenir:
  id: bipa2.u06.souvenir
  title: Rumah keluarga Bali
  note:
    ar_eg: البيت البالي مش مبنى واحد، ده سور كبير جوّاه كذا «bale» (جناح صغير)، واحد للنوم، وواحد للمطبخ، وواحد للمناسبات. وفي الركن الأقدس، ناحية الجبل، بيبنوا معبد العيلة. زي «بيت العيلة» عندنا في مصر بالظبط، أجيال كتير عايشين مع بعض حوالين حوش واحد.
    ar: البيت البالي ليس بناءً واحدًا، بل سور يضمّ أجنحة صغيرة تُسمّى «bale»، للنوم والطبخ والمناسبات. وفي الركن الأقدس، المواجه للجبل، يقوم معبد العائلة. وهو يشبه «بيت العائلة» في مصر، حيث تعيش أجيال عدة حول فناء واحد.
    en: A Balinese home isn't one building but a walled compound of small pavilions (bale) for sleeping, cooking and ceremonies. In the holiest corner, facing the mountain, stands the family temple. Much like an Egyptian «بيت العيلة», several generations live together around one courtyard.
