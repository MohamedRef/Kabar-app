schema: kabar.lesson/v1
id: bipa5.u02.l04
language: id
title: Tata kota
can_do:
  ar_eg: 'توصف مدينة متخططة: الحكومة فين، والسكن فين، والمواصلات عاملة إزاي.'
  ar: 'أن تصف مدينة مخطّطة: أين مقرّ الحكومة وأين السكن وكيف تعمل المواصلات.'
  en: Describe a planned city, where government sits, where people live and how they get around.
slides:
  - title: Kota yang direncanakan
    body:
      ar_eg: |
        نوسانتارا (IKN) مدينة اتخططت من الصفر، فكلامها كله عن التخطيط:
        - tata ruang = تخطيط المساحات (فين يتبني إيه)
        - pusat pemerintahan = مركز الحكومة: قصر الرئاسة والوزارات
        - permukiman = مناطق سكنية
        - ruang terbuka hijau (RTH) = مساحات خضرا مفتوحة: حدايق وغابات جوه المدينة
        - transportasi umum = المواصلات العامة: أتوبيس، قطر
        ولاحظ إن الخطط بتتكتب بالمبني للمجهول: direncanakan، dibangun، dipisahkan.
      ar: |
        نوسانتارا (IKN) مدينة خُطّطت من الصفر، فمعجمها معجم التخطيط:
        - tata ruang = تخطيط المساحات (ما يُبنى وأين)
        - pusat pemerintahan = مركز الحكم: القصر الرئاسي والوزارات
        - permukiman = أحياء سكنية
        - ruang terbuka hijau (RTH) = مساحات خضراء مفتوحة: حدائق وغابات داخل المدينة
        - transportasi umum = النقل العام: حافلات وقطارات
        ولاحظ أنّ الخطط تُكتب بالمبني للمجهول: direncanakan وdibangun وdipisahkan.
      en: |
        Nusantara (IKN) is a city planned from scratch, so its vocabulary is planning vocabulary:
        - tata ruang = spatial planning (what gets built where)
        - pusat pemerintahan = seat of government: the palace and ministries
        - permukiman = residential areas
        - ruang terbuka hijau (RTH) = open green space: parks and forest inside the city
        - transportasi umum = public transport: buses, trains
        Plans are written in the passive: direncanakan, dibangun, dipisahkan.
    examples:
      - text: Sebagian besar wilayah kota direncanakan menjadi ruang terbuka hijau.
        ar_eg: معظم مساحة المدينة متخطط تبقى مساحات خضرا.
        ar: خُطِّط لمعظم مساحة المدينة أن تكون مساحات خضراء.
        en: Most of the city's area is planned as open green space.
      - text: Pusat pemerintahan dibangun di atas bukit.
        ar_eg: مركز الحكومة اتبنى فوق تل.
        ar: بُني مركز الحكم فوق تلّ.
        en: The seat of government is built on a hill.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tata ruang
        ar_eg: تخطيط المساحات
        ar: تخطيط المساحات
        en: spatial planning
      - text: ruang terbuka hijau
        ar_eg: مساحات خضرا مفتوحة
        ar: مساحات خضراء مفتوحة
        en: open green space
      - text: transportasi umum
        ar_eg: مواصلات عامة
        ar: نقل عام
        en: public transport
      - text: permukiman
        ar_eg: منطقة سكنية
        ar: حيّ سكني
        en: residential area
      - text: pusat pemerintahan
        ar_eg: مركز الحكومة
        ar: مركز الحكم
        en: seat of government
    words: [tata ruang, ruang terbuka hijau, transportasi umum, permukiman, pusat pemerintahan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «ruang terbuka hijau» معناها إيه؟
      ar: ما معنى «ruang terbuka hijau»؟
      en: What does "ruang terbuka hijau" mean?
    options:
      - مساحات خضرا مفتوحة زي الحدايق.
      - أوضة لونها أخضر.
      - سوق خضار مفتوح.
    answer: 0
    explain:
      ar_eg: ruang = مساحة، terbuka = مفتوحة، hijau = خضرا.
      ar: ruang = مساحة، وterbuka = مفتوحة، وhijau = خضراء.
      en: ruang = space, terbuka = open, hijau = green.
    words: [ruang terbuka hijau]
  - id: e03
    type: fill_blank
    sentence: Kantor presiden dan kementerian ada di ___.
    meaning:
      ar_eg: مكتب الرئيس والوزارات في مركز الحكومة.
      ar: مكتب الرئيس والوزارات في مركز الحكم.
      en: The president's office and the ministries are in the seat of government.
    options: [pusat pemerintahan, permukiman, ruang terbuka hijau]
    answers: [pusat pemerintahan]
    words: [pusat pemerintahan]
  - id: e04
    type: listen
    text: Di Nusantara, warga diharapkan memakai transportasi umum, bukan mobil pribadi.
    question:
      ar_eg: الخطة عايزة الناس تتنقل بإيه؟
      ar: بأيّ وسيلة تريد الخطة أن يتنقّل السكّان؟
      en: How does the plan want people to get around?
    options:
      - بعربياتهم الخاصة.
      - بالمواصلات العامة.
      - بالموتوسيكلات.
    answer: 1
    words: [transportasi umum]
  - id: e05
    type: build_sentence
    source:
      ar_eg: تخطيط المدينة بيفصل بين المكاتب والمناطق السكنية.
      ar: يفصل تخطيط المدينة بين المكاتب والأحياء السكنية.
      en: The city's planning separates offices from residential areas.
    answer: Tata ruang kota memisahkan perkantoran dan permukiman.
    distractors: [hijau, umum]
    words: [tata ruang, permukiman]
  - id: e06
    type: translate
    direction: from_target
    source_text: Permukiman baru dibangun dekat pusat pemerintahan.
    answers_meaning:
      ar_eg:
        - اتبنت منطقة سكنية جديدة قريب من مركز الحكومة.
        - فيه سكن جديد بيتبني جنب مركز الحكومة.
      ar:
        - بُنيت أحياء سكنية جديدة قرب مركز الحكم.
        - يُبنى حيّ سكني جديد بالقرب من مقرّ الحكومة.
      en:
        - New housing is being built near the seat of government.
        - A new residential area was built close to the government centre.
    words: [permukiman, pusat pemerintahan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحد مش ruang terbuka hijau؟
      ar: أيّها ليس ruang terbuka hijau؟
      en: Which one is not ruang terbuka hijau?
    options: [taman kota, hutan kota, pusat perbelanjaan]
    answer: 2
    explain:
      ar_eg: pusat perbelanjaan = مول، مبنى مقفول مش مساحة خضرا.
      ar: pusat perbelanjaan = مركز تسوّق، وهو مبنى مغلق لا مساحة خضراء.
      en: pusat perbelanjaan is a shopping mall, a closed building, not green space.
    words: [ruang terbuka hijau]
  - id: e08
    type: speaking
    text: Tata ruang yang baik membuat transportasi umum mudah dipakai.
    meaning:
      ar_eg: التخطيط الكويس بيخلي المواصلات العامة سهلة الاستخدام.
      ar: التخطيط الجيّد يجعل النقل العام سهل الاستعمال.
      en: Good planning makes public transport easy to use.
    words: [tata ruang, transportasi umum]
  - id: e09
    type: dictation
    text: Pusat pemerintahan dikelilingi ruang terbuka hijau.
    meaning:
      ar_eg: مركز الحكومة حواليه مساحات خضرا.
      ar: تحيط المساحاتُ الخضراء بمركز الحكم.
      en: The seat of government is surrounded by green space.
    words: [pusat pemerintahan, ruang terbuka hijau]
  - id: e10
    type: fill_blank
    sentence: Saya naik ___ setiap hari, bus atau kereta.
    meaning:
      ar_eg: أنا بركب مواصلات عامة كل يوم، أتوبيس أو قطر.
      ar: أركب النقل العام كل يوم، حافلةً أو قطارًا.
      en: I take public transport every day, bus or train.
    options: [transportasi umum, permukiman, tata ruang]
    answers: [transportasi umum]
    words: [transportasi umum]
dialogue:
  title: Di menara pandang IKN
  lines:
    - speaker: Mas Rizal
      text: Lihat ke sana, Mohamed. Itu pusat pemerintahan, Istana Garuda.
      ar_eg: بص هناك يا محمد. ده مركز الحكومة، قصر جارودا.
      ar: انظر هناك يا محمد، ذاك مركز الحكم، قصر غارودا.
      en: Look over there, Mohamed. That's the seat of government, the Garuda Palace.
    - speaker: Mohamed
      text: Lalu permukimannya di mana? Saya hanya melihat hutan.
      ar_eg: طب المناطق السكنية فين؟ أنا شايف غابة بس.
      ar: وأين الأحياء السكنية؟ لا أرى إلا الغابة.
      en: Then where's the housing? I can only see forest.
    - speaker: Mas Rizal
      text: Menurut tata ruangnya, hutan itu ruang terbuka hijau. Permukiman ada di balik bukit.
      ar_eg: حسب التخطيط، الغابة دي مساحة خضرا. والسكن ورا التل.
      ar: بحسب التخطيط، تلك الغابة مساحة خضراء، والأحياء السكنية خلف التلّ.
      en: According to the plan, that forest is green space. The housing is behind the hill.
    - speaker: Mohamed
      text: Kalau begitu, transportasi umumnya harus bagus sekali.
      ar_eg: يبقى المواصلات العامة لازم تكون ممتازة.
      ar: إذن لا بدّ أن يكون النقل العام ممتازًا.
      en: Then the public transport has to be really good.
