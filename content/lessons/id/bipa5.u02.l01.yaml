schema: kabar.lesson/v1
id: bipa5.u02.l01
language: id
title: Meskipun, walaupun
can_do:
  ar_eg: تعترف بنقطة وترد عليها بـ meskipun وwalaupun.
  ar: أن تُقرّ بفكرة ثم تردّ عليها بـ meskipun وwalaupun.
  en: Concede a point and counter it with meskipun and walaupun.
slides:
  - title: Meskipun …, tetap …
    grammar: id.conjunction.concessive
    body:
      ar_eg: |
        meskipun وwalaupun = «بالرغم من إن / مع إن». بيدخلوا على الجملة اللي بتعترف بيها، والجملة التانية فيها رأيك:
        - Meskipun biayanya besar, pemerintah tetap membangun ibu kota baru.
        وخد بالك من غلطة مشهورة: ماتحطش tetapi بعد meskipun! بالعربي كمان مانقولش «مع إنه غالي لكن …». في الإندونيسي بتستخدم tetap (= برضه / مع ذلك) أو masih.
        - غلط: Meskipun mahal, tetapi banyak orang mendukung.
        - صح: Meskipun mahal, banyak orang tetap mendukung.
      ar: |
        meskipun وwalaupun = «على الرغم من أنّ». تدخلان على الجملة التي تُقرّ بها، وتحمل الجملة الأخرى رأيك:
        - Meskipun biayanya besar, pemerintah tetap membangun ibu kota baru.
        واحذر خطأً شائعًا: لا تضع tetapi بعد meskipun، كما لا نقول في العربية «مع أنه غالٍ لكن …». استعمل tetap (= مع ذلك) أو masih.
        - خطأ: Meskipun mahal, tetapi banyak orang mendukung.
        - صواب: Meskipun mahal, banyak orang tetap mendukung.
      en: |
        meskipun and walaupun = although. They introduce the point you concede; the other clause carries your view:
        - Meskipun biayanya besar, pemerintah tetap membangun ibu kota baru.
        A classic mistake: no tetapi after meskipun (English doesn't say "although it's expensive, but …" either). Use tetap (still, nevertheless) or masih.
        - Wrong: Meskipun mahal, tetapi banyak orang mendukung.
        - Right: Meskipun mahal, banyak orang tetap mendukung.
    examples:
      - text: Walaupun banyak orang menolak, kebijakan itu tetap berjalan.
        ar_eg: مع إن ناس كتير رافضة، السياسة دي ماشية برضه.
        ar: على الرغم من رفض كثيرين، تمضي تلك السياسة.
        en: Although many people object, the policy is still going ahead.
      - text: Jakarta tetap ramai meskipun sebagian kotanya tenggelam.
        ar_eg: جاكرتا لسه زحمة مع إن حتة منها بتغرق.
        ar: ما زالت جاكرتا مزدحمة رغم أن جزءًا منها يغرق.
        en: Jakarta is still busy even though part of the city is sinking.
  - title: Padahal dan Meskipun demikian
    body:
      ar_eg: |
        حاجتين كمان:
        - padahal = «مع إن (والمفروض العكس)»، وبتيجي بعد الجملة: Biayanya naik terus, padahal anggarannya terbatas. = التكلفة بتزيد، مع إن الميزانية محدودة.
        - بين جملتين منفصلتين قول Meskipun demikian, أو Namun, (= ومع ذلك): Proyek ini mahal. Meskipun demikian, banyak orang mendukung.
      ar: |
        أمران آخران:
        - padahal = «مع أنّ (والمتوقّع خلافه)»، وتأتي بعد الجملة: Biayanya naik terus, padahal anggarannya terbatas.
        - وبين جملتين منفصلتين: Meskipun demikian, أو Namun, (= ومع ذلك): Proyek ini mahal. Meskipun demikian, banyak orang mendukung.
      en: |
        Two more:
        - padahal = even though (against expectation), after the main clause: Biayanya naik terus, padahal anggarannya terbatas. = Costs keep rising, even though the budget is limited.
        - Across two sentences: Meskipun demikian, or Namun, (= nevertheless): Proyek ini mahal. Meskipun demikian, banyak orang mendukung.
    examples:
      - text: Proyek ini mahal. Meskipun demikian, banyak orang mendukungnya.
        ar_eg: المشروع ده غالي. ومع ذلك ناس كتير بتأيده.
        ar: هذا المشروع مكلف. ومع ذلك يؤيّده كثيرون.
        en: This project is expensive. Nevertheless, many people support it.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kebijakan
        ar_eg: سياسة / قرار حكومي
        ar: سياسة
        en: policy
      - text: biaya
        ar_eg: تكلفة
        ar: تكلفة
        en: cost
      - text: tenggelam
        ar_eg: يغرق
        ar: يغرق
        en: to sink
      - text: mendukung
        ar_eg: يأيّد / يدعم
        ar: يؤيّد، يدعم
        en: to support
      - text: menolak
        ar_eg: يرفض
        ar: يرفض
        en: to reject, to oppose
    words: [kebijakan, biaya, tenggelam, mendukung, menolak]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options:
      - Meskipun biayanya besar, tetapi warga mendukung.
      - Meskipun biayanya besar, warga tetap mendukung.
      - Biayanya besar meskipun, warga mendukung.
    answer: 1
    explain:
      ar_eg: بعد meskipun مفيش tetapi. استخدم tetap.
      ar: لا تأتي tetapi بعد meskipun، بل tetap.
      en: No tetapi after meskipun; use tetap.
    words: [biaya, mendukung]
  - id: e03
    type: fill_blank
    sentence: ___ banyak warga menolak, pemerintah tetap memindahkan ibu kota.
    meaning:
      ar_eg: مع إن سكان كتير رافضين، الحكومة برضه بتنقل العاصمة.
      ar: على الرغم من رفض كثير من السكان، تمضي الحكومة في نقل العاصمة.
      en: Although many residents object, the government is still moving the capital.
    options: [Walaupun, Sehingga, Padahal]
    answers: [Walaupun]
    explain:
      ar_eg: إعتراف في أول الجملة وبعده tetap، فدي walaupun.
      ar: إقرار في مطلع الجملة يليه tetap، فالأداة walaupun.
      en: A concession at the start followed by tetap calls for walaupun.
    words: [menolak]
  - id: e04
    type: listen
    text: Sebagian Jakarta tenggelam, padahal jutaan orang tinggal di sana.
    question:
      ar_eg: إيه المشكلة اللي في الجملة؟
      ar: ما المشكلة المذكورة؟
      en: What problem does the sentence describe?
    options:
      - جزء من جاكرتا بيغرق، مع إن ملايين ساكنين فيه.
      - جاكرتا فاضية من السكان.
      - ملايين ناس بيعزّلوا لجاكرتا.
    answer: 0
    words: [tenggelam]
  - id: e05
    type: build_sentence
    source:
      ar_eg: السياسة دي غالية. ومع ذلك ناس كتير بتأيدها.
      ar: هذه السياسة مكلفة. ومع ذلك يؤيّدها كثيرون.
      en: This policy is expensive. Nevertheless, many people support it.
    answer: Kebijakan ini mahal. Meskipun demikian, banyak orang mendukungnya.
    distractors: [tetapi, padahal]
    words: [kebijakan, mendukung]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: التكلفة بتزيد، مع إن الميزانية محدودة.
      ar: التكلفة في ازدياد، مع أنّ الميزانية محدودة.
      en: The cost keeps rising, even though the budget is limited.
    answers:
      - Biayanya naik terus, padahal anggarannya terbatas.
      - Biaya terus naik, padahal anggarannya terbatas.
      - Biayanya terus naik, padahal anggarannya terbatas.
      - Biayanya naik terus, padahal anggaran terbatas.
    explain:
      ar_eg: «مع إن والمفروض العكس» بعد الجملة = padahal.
      ar: «مع أنّ» المخالِفة للمتوقّع بعد الجملة = padahal.
      en: An against-expectation "even though" after the clause is padahal.
    words: [biaya]
  - id: e07
    type: multiple_choice
    question: "Proyek ini penting. ___, biayanya terlalu besar."
    question_meaning:
      ar_eg: «المشروع ده مهم. …، تكلفته كبيرة قوي.» إيه اللي يكمّلها؟
      ar: «هذا المشروع مهمّ. …، تكلفته كبيرة جدًّا.» ماذا يكمّلها؟
      en: What completes "This project is important. …, its cost is too high."?
    options: [Meskipun, Namun, Padahal]
    answer: 1
    explain:
      ar_eg: بين جملتين منفصلتين بنقول Namun, أو Meskipun demikian, (مش Meskipun لوحدها).
      ar: بين جملتين منفصلتين نقول Namun, أو Meskipun demikian, لا Meskipun وحدها.
      en: Between two separate sentences use Namun, or Meskipun demikian, not a bare Meskipun.
    words: [biaya]
  - id: e08
    type: speaking
    text: Walaupun banyak orang menolak, saya tetap mendukung kebijakan itu.
    meaning:
      ar_eg: مع إن ناس كتير رافضة، أنا برضه مأيّد السياسة دي.
      ar: مع أنّ كثيرين يرفضون، فأنا ما زلت أؤيّد تلك السياسة.
      en: Although many people oppose it, I still support that policy.
    words: [menolak, tetap, mendukung, kebijakan]
  - id: e09
    type: multiple_choice
    question: "Jakarta ___ pelan-pelan karena air tanahnya diambil terus."
    question_meaning:
      ar_eg: كمّل الجملة. «جاكرتا … بالراحة عشان المياه الجوفية بتتسحب على طول.»
      ar: أكمل الجملة. «جاكرتا … ببطء لأنّ مياهها الجوفية تُسحب باستمرار.»
      en: Complete the sentence. "Jakarta is … slowly because its groundwater keeps being pumped out."
    options: [mendukung, menolak, tenggelam]
    answer: 2
    words: [tenggelam]
dialogue:
  title: Di perahu ke Penajam
  lines:
    - speaker: Mohamed
      text: Mas Rizal, kenapa ibu kota pindah ke sini? Jakarta kan sudah besar.
      ar_eg: يا ريزال، ليه العاصمة بتتنقل هنا؟ ما جاكرتا كبيرة أصلًا.
      ar: يا ريزال، لماذا تنتقل العاصمة إلى هنا، وجاكرتا كبيرة أصلًا؟
      en: Mas Rizal, why is the capital moving here? Jakarta is already big.
    - speaker: Mas Rizal
      text: Meskipun Jakarta besar, kotanya macet dan sebagian tenggelam.
      ar_eg: مع إن جاكرتا كبيرة، المدينة زحمة وحتة منها بتغرق.
      ar: مع أن جاكرتا كبيرة، فهي مزدحمة وجزء منها يغرق.
      en: Although Jakarta is big, it's congested and part of it is sinking.
    - speaker: Mohamed
      text: Tapi biayanya pasti besar sekali, ya?
      ar_eg: بس التكلفة أكيد كبيرة قوي، صح؟
      ar: لكن التكلفة كبيرة جدًّا بالتأكيد، أليس كذلك؟
      en: But the cost must be huge, right?
    - speaker: Mas Rizal
      text: Betul. Banyak orang menolak, tetapi banyak juga yang mendukung. Kebijakan ini masih jadi debat.
      ar_eg: مظبوط. ناس كتير رافضة، وناس كتير برضه مأيّدة. السياسة دي لسه موضوع نقاش.
      ar: صحيح. كثيرون يرفضون وكثيرون يؤيّدون، وما زالت هذه السياسة موضع جدل.
      en: True. Many people oppose it, and many support it too. The policy is still being debated.
new_words:
  - word: biaya
    pos: noun
    ar_eg: تكلفة
    ar: تكلفة
    en: cost
  - word: tenggelam
    pos: verb
    ar_eg: يغرق
    ar: يغرق
    en: to sink
  - word: meskipun
    pos: conjunction
    ar_eg: رغم إن (وبعدها tetap مش tetapi)
    ar: رغم أنّ (وبعدها tetap لا tetapi)
    en: although (followed by tetap, never tetapi)
