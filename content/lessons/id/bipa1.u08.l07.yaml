  - id: e03
    type: listen
    text: Gadis di film itu menangis. Dia sedih.
    question:
      ar_eg: البنت بتعمل إيه؟
      ar: ماذا تفعل الفتاة؟
      en: What is the girl doing?
    options: [بتعيط, بتضحك, نايمة]
    answer: 0
    meaning:
      ar_eg: البنت اللي في الفيلم بتعيط. هي حزينة.
      ar: الفتاة في الفيلم تبكي، إنها حزينة.
      en: The girl in the film is crying. She's sad.
    words: [menangis, sedih]
  - id: e04
    type: fill_blank
    sentence: Filmnya lucu sekali! Kami ___.
    meaning:
      ar_eg: الفيلم مضحك جدًا! إحنا ___.
      ar: الفيلم مضحك جدًا! نحن ___.
      en: The film's so funny! We're ___.
    options: [tertawa, menangis, marah]
    answers: [tertawa]
    words: [tertawa, menangis, marah]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حد بيقول الحقيقة دايمًا. هو…؟
      ar: شخص يقول الحقيقة دائمًا. هو…؟
      en: Someone always tells the truth. They're…?
    options: [jujur, jahat, aneh]
    answer: 0
    explain:
      ar_eg: jujur = أمين وصادق. jahat شرير، وaneh غريب.
      ar: jujur أمين صادق، أما jahat فشرّير وaneh غريب.
      en: jujur = honest; jahat is wicked and aneh strange.
    words: [jujur, jahat, aneh]
  - id: e06
    type: fill_blank
    sentence: Ayah ___. Saya terlambat.
    meaning:
      ar_eg: بابا ___. أنا اتأخرت.
      ar: أبي ___، فقد تأخّرت.
      en: Dad is ___. I was late.
    options: [marah, cerdas, sedih]
    answers: [marah]
    words: [marah, cerdas, sedih]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الراجل ده غريب شوية.
      ar: ذلك الرجل غريب قليلًا.
      en: That man is a bit strange.
    answer: Orang itu agak aneh.
    distractors: [jahat, cerdas]
    words: [aneh]
  - id: e08
    type: translate
    direction: from_target
    source_text: Di film itu, ada orang jahat.
    answers_meaning:
      ar_eg: [في الفيلم ده فيه واحد شرير, فيه شرير في الفيلم ده]
      ar: [في ذلك الفيلم شخص شرّير, هناك رجل شرّير في ذلك الفيلم]
      en: ['There''s a bad guy in that film', 'In that film there''s a wicked person']
    words: [jahat]
  - id: e09
    type: speaking
    text: Polisinya cerdas dan jujur.
    meaning:
      ar_eg: الظابط ذكي وأمين.
      ar: الشرطي ذكي وأمين.
      en: The policeman is clever and honest.
    words: [cerdas, jujur]
  - id: e10
    type: multiple_choice
    question: Bayi itu ___. Dia lapar.
    options: [menangis, tertawa, jujur]
    answer: 0
    explain:
      ar_eg: 'البيبي جعان، فبيعيط: menangis.'
      ar: 'الرضيع جائع فهو يبكي: menangis.'
      en: 'The baby is hungry, so he''s crying: menangis.'
    words: [menangis, tertawa]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, filmnya aneh, ya?
      ar_eg: يا محمد، الفيلم غريب، صح؟
      ar: يا محمد، الفيلم غريب، أليس كذلك؟
      en: Mohamed, the film's odd, isn't it?
    - speaker: Mohamed
      text: Agak aneh. Gadis itu menangis. Dia sedih?
      ar_eg: غريب شوية. البنت دي بتعيط. هي حزينة؟
      ar: غريب قليلًا. تلك الفتاة تبكي، هل هي حزينة؟
      en: A bit odd. That girl is crying. Is she sad?
    - speaker: Ni Luh
      text: Ya. Ayahnya marah. Dia orang jahat!
      ar_eg: أيوه. أبوها متعصب. دا راجل شرير!
      ar: نعم. أبوها غاضب، إنه رجل شرّير!
      en: Yes. Her father is angry. He's a wicked man!
    - speaker: Mohamed
      text: Tapi polisinya cerdas dan jujur.
      ar_eg: بس الظابط ذكي وأمين.
      ar: لكن الشرطي ذكي وأمين.
      en: But the policeman is clever and honest.
    - speaker: Ni Luh
      text: Sekarang gadis itu tersenyum!
      ar_eg: دلوقتي البنت بتبتسم!
      ar: الآن تبتسم الفتاة!
      en: Now the girl is smiling!
    - speaker: Mohamed
      text: Dan semua tertawa. Filmnya bagus!
      ar_eg: وكله بيضحك. الفيلم حلو!
      ar: والجميع يضحك. الفيلم جميل!
      en: And everyone's laughing. It's a good film!
