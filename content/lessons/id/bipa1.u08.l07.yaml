    meaning:
      ar_eg: أنا حزين، بس بابتسم.
      ar: أنا حزين، لكنّي أبتسم.
      en: I'm sad, but I'm smiling.
    words: [sedih, tersenyum]
  - id: e10
    type: multiple_choice
    question: Rina tidak suka filmnya. Dia ___.
    options: [bosan, haus, tertawa]
    answer: 0
    explain:
      ar_eg: 'ما بتحبش الفيلم، فهي زهقانة: bosan.'
      ar: 'لا تحبّ الفيلم فهي ضجِرة: bosan.'
      en: 'She doesn''t like the film, so she''s bored: bosan.'
    words: [bosan, haus, tertawa]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, kamu bosan?
      ar_eg: يا محمد، إنت زهقت؟
      ar: يا محمد، هل ضجرت؟
      en: Mohamed, are you bored?
    - speaker: Mohamed
      text: Tidak. Tapi saya haus! Ada air?
      ar_eg: لأ. بس أنا عطشان! فيه مية؟
      ar: لا، لكنّي عطشان! أعندك ماء؟
      en: No. But I'm thirsty! Is there water?
    - speaker: Ni Luh
      text: Ada. Gadis di film itu menangis.
      ar_eg: فيه. البنت اللي في الفيلم بتعيط.
      ar: نعم. الفتاة في الفيلم تبكي.
      en: Yes. The girl in the film is crying.
    - speaker: Mohamed
      text: Dia sedih. Ayahnya marah.
      ar_eg: هي حزينة. أبوها زعلان.
      ar: إنها حزينة، وأبوها غاضب.
      en: She's sad. Her father is angry.
    - speaker: Ni Luh
      text: Tapi ibunya lembut. Sekarang dia tersenyum!
      ar_eg: بس مامتها حنينة. ودلوقتي بتبتسم!
      ar: لكن أمها رقيقة، والآن تبتسم!
      en: But her mother is gentle. Now she's smiling!
    - speaker: Mohamed
      text: Dan sekarang semua tertawa. Filmnya bagus!
      ar_eg: ودلوقتي كله بيضحك. الفيلم حلو!
      ar: والآن يضحك الجميع. الفيلم جميل!
      en: And now everyone's laughing. It's a good film!
