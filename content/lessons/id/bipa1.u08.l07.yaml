  - id: e08
    type: translate
    direction: from_target
    source_text: Ibu saya orangnya lembut dan selalu tersenyum.
    answers_meaning:
      ar_eg: [مامتي حنينة ودايمًا بتبتسم, أمي إنسانة حنينة ودايمًا مبتسمة]
      ar: [أمي رقيقة ودائمًا تبتسم, أمي شخص رقيق ودائم الابتسام]
      en: [My mother is gentle and always smiling, My mum is a gentle person who always smiles]
    words: [lembut, tersenyum]
  - id: e09
