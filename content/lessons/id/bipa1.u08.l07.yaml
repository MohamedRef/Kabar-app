      ar: الفيلم طويل ولا يحدث فيه شيء. بمَ تشعر؟
      en: The film is long and nothing happens. How do you feel?
    options: [bosan, haus, lembut]
    answer: 0
    explain:
      ar_eg: bosan = زهقان. haus عطشان، وlembut حنين.
      ar: bosan ضجِر، أما haus فعطشان وlembut رقيق.
      en: bosan = bored; haus is thirsty and lembut gentle.
