schema: kabar.lesson/v1
id: bipa1.u08.l07
language: id
title: Film yang aneh
can_do:
  ar_eg: 'تحكي عن فيلم: مين حزين ومين زعلان، مين بيعيط ومين بيضحك، ومين شرير أو أمين أو ذكي.'
  ar: 'أن تحكي عن فيلم: من الحزين ومن الغاضب، من يبكي ومن يضحك، ومن الشرّير أو الأمين أو الذكي.'
  en: 'Talk about a film: who''s sad or angry, who cries or laughs, and who''s wicked, honest or clever.'
slides:
  - title: Di film
    body:
      ar_eg: |
        sedih = حزين، marah = زعلان قوي، متعصب. menangis = يعيط، tertawa = يضحك.
        jahat = شرير. jujur = أمين وصادق. cerdas = ذكي (أرسمي من pintar). aneh = غريب.
        الإندونيسيين بيحبوا الهدوء: الزعل بصوت عالي مش مقبول قوي، حتى في الأفلام بيبان على الشرير بس!
      ar: |
        sedih = حزين، marah = غاضب. menangis = يبكي، tertawa = يضحك.
        jahat = شرّير. jujur = أمين صادق. cerdas = ذكي (أرسم من pintar). aneh = غريب.
        ويقدّر الإندونيسيون الهدوء، فالغضب بصوت عالٍ غير مستحسن، وفي الأفلام لا يصرخ غالبًا إلا الشرّير!
      en: |
        sedih = sad, marah = angry. menangis = cry, tertawa = laugh.
        jahat = wicked. jujur = honest. cerdas = intelligent (more formal than pintar). aneh = strange.
        Indonesians value calm: loud anger goes down badly. In films, usually only the villain shouts!
    examples:
      - text: Gadis itu menangis. Dia sedih.
        ar_eg: البنت دي بتعيط. هي حزينة.
        ar: تلك الفتاة تبكي، إنها حزينة.
        en: That girl is crying. She's sad.
      - text: Polisinya cerdas dan jujur.
        ar_eg: الظابط ذكي وأمين.
        ar: الشرطي ذكي وأمين.
        en: The policeman is clever and honest.
      - text: Filmnya aneh, tapi kami tertawa.
        ar_eg: الفيلم غريب، بس ضحكنا.
        ar: الفيلم غريب، لكننا ضحكنا.
        en: The film's odd, but we laughed.
