schema: kabar.lesson/v1
id: bipa1.u08.l07
language: id
title: Marah, sedih, bosan
can_do:
  ar_eg: 'تقول إنت حاسس بإيه: زعلان، متضايق، زهقان، عطشان، وتوصف الضحك والعياط.'
  ar: 'أن تعبّر عن مشاعرك: غاضب، حزين، ضجِر، عطشان، وتصف الضحك والبكاء.'
  en: Say how you feel (angry, sad, bored, thirsty) and describe laughing and crying.
slides:
  - title: Perasaan
    body:
      ar_eg: |
        marah = زعلان قوي، متعصب. sedih = حزين. bosan = زهقان. haus = عطشان (زي lapar للجوع).
        tertawa = يضحك، tersenyum = يبتسم، menangis = يعيط.
        lembut = ناعم أو حنين: Ibu saya orangnya lembut.
        ولو عايز تبيّن مشاعرك بأدب، الإندونيسيين بيحبوا الهدوء: الزعل بصوت عالي مش مقبول قوي.
      ar: |
        marah = غاضب. sedih = حزين. bosan = ضجِر. haus = عطشان (مثل lapar للجوع).
        tertawa = يضحك، tersenyum = يبتسم، menangis = يبكي.
        lembut = ناعم أو رقيق: Ibu saya orangnya lembut.
        ويقدّر الإندونيسيون الهدوء، فالغضب بصوت عالٍ غير مستحسن.
      en: |
        marah = angry. sedih = sad. bosan = bored. haus = thirsty (like lapar for hunger).
        tertawa = laugh, tersenyum = smile, menangis = cry.
        lembut = soft, gentle: Ibu saya orangnya lembut.
        Indonesians value calm: loud anger goes down badly.
    examples:
      - text: Bayi itu menangis. Dia lapar.
        ar_eg: البيبي بيعيط. جعان.
        ar: الرضيع يبكي، إنه جائع.
        en: The baby is crying. He's hungry.
      - text: Saya haus. Minta air putih!
        ar_eg: أنا عطشان. مية لو سمحت!
        ar: أنا عطشان. ماءً من فضلك!
        en: I'm thirsty. Water, please!
      - text: Rina tersenyum, Raka tertawa.
        ar_eg: رينا بتبتسم، ورَكا بيضحك.
        ar: رينا تبتسم وراكا يضحك.
        en: Rina smiles and Raka laughs.
