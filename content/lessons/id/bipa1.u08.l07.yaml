schema: kabar.lesson/v1
id: bipa1.u08.l07
language: id
title: Jujur dan cerdas
can_do:
  ar_eg: 'توصف شخصية حد: صغير في السن، أمين، ذكي، خجول، شقي أو غريب.'
  ar: 'أن تصف شخصية أحد: شاب، أمين، ذكي، خجول، مشاغب أو غريب.'
  en: 'Describe someone''s character: young, honest, clever, shy, naughty or odd.'
slides:
  - title: Orangnya…
    body:
      ar_eg: |
        muda = صغير في السن، شاب. jujur = أمين وصادق. cerdas = ذكي (أرسمي من pintar).
        pemalu = خجول (من malu = كسوف، وpe- = الشخص اللي كده).
        nakal = شقي، للعيال غالبًا. jahat = شرير. aneh = غريب. kurus = رفيع.
      ar: |
        muda = صغير السنّ، شابّ. jujur = أمين صادق. cerdas = ذكي (أرسم من pintar).
        pemalu = خجول (من malu = الخجل، وpe- = صاحب الصفة).
        nakal = مشاغب، للأطفال غالبًا. jahat = شرّير. aneh = غريب. kurus = نحيف.
      en: |
        muda = young. jujur = honest. cerdas = intelligent (more formal than pintar).
        pemalu = shy (malu = shame, pe- = a person who is).
        nakal = naughty, mostly of kids. jahat = wicked. aneh = strange. kurus = thin.
    examples:
      - text: Guru saya masih muda.
        ar_eg: المدرس بتاعي لسه صغير في السن.
        ar: معلّمي ما زال شابًّا.
        en: My teacher is still young.
      - text: Anak itu nakal, tapi lucu.
        ar_eg: العيل ده شقي، بس عسول.
        ar: ذلك الطفل مشاغب لكنه لطيف.
        en: That child is naughty, but cute.
      - text: Dia orangnya jujur dan cerdas.
        ar_eg: هو شخص أمين وذكي.
        ar: إنه شخص أمين وذكي.
        en: He's honest and clever.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: muda
        ar_eg: صغير في السن
        ar: شابّ
