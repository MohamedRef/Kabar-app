  - id: e03
    type: listen
    text: Adik saya pemalu. Dia pendiam di kelas.
    question:
      ar_eg: أخوه الصغير شكله إيه؟
      ar: كيف أخوه الصغير؟
      en: What is his little brother like?
    options: [خجول, شقي, شرير]
    answer: 0
    meaning:
      ar_eg: أخويا الصغير خجول. ساكت في الفصل.
      ar: أخي الصغير خجول، صامت في الصفّ.
      en: My little brother is shy. He's quiet in class.
    words: [pemalu]
  - id: e04
    type: fill_blank
    sentence: Anak itu ___! Dia tidak mau tidur.
    meaning:
      ar_eg: العيل ده ___! مش عايز ينام.
      ar: ذلك الطفل ___! لا يريد النوم.
      en: That child is ___! He won't go to sleep.
    options: [nakal, kurus, muda]
    answers: [nakal]
    words: [nakal, kurus, muda]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حد بيقول الحقيقة دايمًا. هو…؟
      ar: شخص يقول الحقيقة دائمًا. هو…؟
      en: Someone always tells the truth. They're…?
    options: [jujur, jahat, aneh]
    answer: 0
    explain:
      ar_eg: jujur = أمين وصادق. jahat شرير، وaneh غريب.
      ar: jujur أمين صادق، أما jahat فشرّير وaneh غريب.
      en: jujur = honest; jahat is wicked and aneh strange.
    words: [jujur, jahat, aneh]
  - id: e06
    type: fill_blank
    sentence: Ibu guru masih ___. Umurnya dua puluh lima tahun.
    meaning:
      ar_eg: المدرسة لسه ___. عندها ٢٥ سنة.
      ar: ما زالت المعلّمة ___، عمرها خمس وعشرون سنة.
      en: The teacher is still ___. She's twenty-five.
    options: [muda, cerdas, pemalu]
    answers: [muda]
    words: [muda, cerdas, pemalu]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الراجل ده غريب شوية.
      ar: ذلك الرجل غريب قليلًا.
      en: That man is a bit strange.
    answer: Orang itu agak aneh.
    distractors: [jahat, kurus]
    words: [aneh]
  - id: e08
    type: translate
    direction: from_target
    source_text: Di film itu, ada orang jahat.
    answers_meaning:
      ar_eg: [في الفيلم ده فيه واحد شرير, فيه شرير في الفيلم ده]
      ar: [في ذلك الفيلم شخص شرّير, هناك رجل شرّير في ذلك الفيلم]
      en: ['There''s a bad guy in that film', 'In that film there''s a wicked person']
    words: [jahat]
  - id: e09
    type: speaking
    text: Dia cerdas dan jujur.
    meaning:
      ar_eg: هو ذكي وأمين.
      ar: إنه ذكي وأمين.
      en: He's clever and honest.
    words: [cerdas, jujur]
  - id: e10
    type: multiple_choice
    question: Rina makan sedikit. Dia ___.
    options: [kurus, gemuk, nakal]
    answer: 0
    explain:
      ar_eg: 'بتاكل قليل، فهي رفيعة: kurus.'
      ar: 'تأكل قليلًا فهي نحيفة: kurus.'
      en: 'She eats little, so she''s thin: kurus.'
    words: [kurus, nakal]
dialogue:
  lines:
    - speaker: Mohamed
      text: Rina, siapa guru baru itu?
      ar_eg: يا رينا، مين المدرسة الجديدة دي؟
      ar: يا رينا، من تلك المعلّمة الجديدة؟
      en: Rina, who's that new teacher?
    - speaker: Rina
      text: Itu Bu Sinta. Dia masih muda, tapi cerdas sekali.
      ar_eg: دي الأستاذة سينتا. لسه صغيرة، بس ذكية جدًا.
      ar: تلك الأستاذة سينتا، شابّة لكنها ذكية جدًا.
      en: That's Mrs Sinta. She's young, but very clever.
    - speaker: Mohamed
      text: Dan anak kurus itu? Dia pendiam.
      ar_eg: والولد الرفيع ده؟ ساكت خالص.
      ar: وذلك الولد النحيف؟ إنه صامت.
      en: And that thin boy? He's quiet.
    - speaker: Rina
      text: Itu Dodi. Dia pemalu, tapi jujur.
      ar_eg: دا دودي. خجول بس أمين.
      ar: ذاك دودي، خجول لكنه أمين.
      en: That's Dodi. He's shy, but honest.
    - speaker: Mohamed
      text: Dan anak itu? Dia agak aneh.
      ar_eg: والولد ده؟ غريب شوية.
      ar: وذلك الولد؟ غريب قليلًا.
      en: And that kid? He's a bit odd.
    - speaker: Rina
      text: Bukan aneh, dia lucu! Dia tidak jahat.
      ar_eg: مش غريب، دا دمه خفيف! ومش شرير.
      ar: ليس غريبًا، إنه ظريف! وليس شرّيرًا.
      en: Not odd, he's funny! He isn't mean.
