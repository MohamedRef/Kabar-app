schema: kabar.lesson/v1
id: bipa5.u03.l09
language: id
title: Rapat pemasaran
can_do:
  ar_eg: 'تشارك في اجتماع تسويق: التريند والمنصات والعالم الافتراضي، والإعلان التجاري الحصري، والنجم المحبوب والعدسة.'
  ar: 'أن تشارك في اجتماع تسويق: الاتجاهات والمنصّات والعالم الافتراضي، والإعلان التجاري الحصري، والنجم المحبوب والعدسة.'
  en: 'Take part in a marketing meeting: trends, platforms, virtual events, an exclusive commercial deal, an idol and the lens.'
slides:
  - title: Menjual lewat layar
    body:
      ar_eg: |
        tren = تريند، موضة (sedang tren = عامل تريند)، platform = منصة (platform digital).
        virtual = افتراضي (pameran virtual = معرض أونلاين)، instan = فوري، سريع التحضير (mi instan، pesan instan).
        komersial = تجاري (iklan komersial)، eksklusif = حصري.
        idola = نجم الناس بتحبه (idola remaja)، lensa = عدسة (lensa kamera).
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: pake = pakai، aja = saja، buat = untuk، kayak = seperti.
      ar: |
        tren = اتجاه رائج، موضة (sedang tren = رائج الآن)، platform = منصّة (platform digital).
        virtual = افتراضي (pameran virtual = معرض افتراضي)، instan = فوري، سريع التحضير (mi instan، pesan instan).
        komersial = تجاري (iklan komersial)، eksklusif = حصري.
        idola = نجم محبوب، معبود الجماهير (idola remaja)، lensa = عدسة (lensa kamera).
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: pake = pakai، aja = saja، buat = untuk، kayak = seperti.
      en: |
        tren = trend (sedang tren = trending), platform = platform (platform digital).
        virtual = virtual (pameran virtual = online fair), instan = instant (mi instan, pesan instan).
        komersial = commercial (iklan komersial), eksklusif = exclusive.
        idola = idol, star (idola remaja = teen idol), lensa = lens (lensa kamera).
        The dialogue uses street forms; the formal ones are beside them: pake = pakai, aja = saja, buat = untuk, kayak = seperti.
    examples:
      - text: Video pendek sedang menjadi tren di semua platform.
        ar_eg: الفيديوهات القصيرة عاملة تريند على كل المنصات.
        ar: الفيديوهات القصيرة رائجة على كل المنصّات.
        en: Short videos are trending on every platform.
      - text: Kami punya kontrak eksklusif dengan idola remaja itu.
        ar_eg: عندنا عقد حصري مع النجم اللي المراهقين بيحبوه ده.
        ar: لدينا عقد حصري مع نجم المراهقين ذاك.
        en: We have an exclusive contract with that teen idol.
      - text: Pameran virtual itu gratis, tetapi tujuannya komersial.
        ar_eg: المعرض الافتراضي ده ببلاش، بس هدفه تجاري.
        ar: المعرض الافتراضي مجاني، لكن هدفه تجاري.
        en: The virtual fair is free, but its aim is commercial.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tren
        ar_eg: تريند
        ar: اتجاه رائج
        en: trend
      - text: platform
        ar_eg: منصة
        ar: منصّة
        en: platform
      - text: virtual
        ar_eg: افتراضي
        ar: افتراضي
        en: virtual
      - text: instan
        ar_eg: فوري
        ar: فوري
        en: instant
    words: [tren, platform, virtual, instan]
  - id: e02
    type: match_pairs
    pairs:
      - text: komersial
        ar_eg: تجاري
        ar: تجاري
        en: commercial
      - text: eksklusif
        ar_eg: حصري
        ar: حصري
        en: exclusive
      - text: idola
        ar_eg: نجم محبوب
        ar: معبود الجماهير
        en: idol
      - text: lensa
        ar_eg: عدسة
        ar: عدسة
        en: lens
    words: [komersial, eksklusif, idola, lensa]
  - id: e03
    type: listen
    text: Wawancara eksklusif ini hanya ada di kanal kami.
    question:
      ar_eg: الحوار ده نوعه إيه؟
      ar: ما نوع هذه المقابلة؟
      en: What kind of interview is it?
    options: [حصري, قديم, ممنوع]
    answer: 0
    meaning:
      ar_eg: الحوار الحصري ده موجود على قناتنا بس.
      ar: هذه المقابلة الحصرية متاحة على قناتنا فقط.
      en: This exclusive interview is only on our channel.
    words: [eksklusif]
  - id: e04
    type: fill_blank
    sentence: 'Sekarang orang bekerja dengan pesan ___: semuanya harus cepat.'
    meaning:
      ar_eg: 'الناس دلوقتي بتشتغل برسايل ___: كل حاجة لازم تبقى بسرعة.'
      ar: 'يعمل الناس الآن بالرسائل ___: كل شيء يجب أن يكون سريعًا.'
      en: 'People now work by ___ messaging: everything must be fast.'
    options: [instan, komersial, lensa]
    answers: [instan]
    words: [instan, komersial, lensa]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: يوتيوب وتيك توك وإنستجرام، كل واحد فيهم إيه؟
      ar: 'يوتيوب وتيك توك وإنستغرام: ما كلٌّ منها؟'
      en: 'YouTube, TikTok and Instagram: what is each one?'
    options: [idola, virtual, platform]
    answer: 2
    explain:
      ar_eg: platform = منصة.
      ar: platform = منصّة.
      en: platform = platform.
    words: [idola, virtual, platform]
  - id: e06
    type: fill_blank
    sentence: Fotonya buram. Mungkin ___ kameranya kotor.
    meaning:
      ar_eg: الصورة مش واضحة. يمكن ___ الكاميرا وسخة.
      ar: الصورة مشوّشة. ربما ___ الكاميرا متّسخة.
      en: The photo is blurry. Maybe the camera ___ is dirty.
    options: [lensa, tren, eksklusif]
    answers: [lensa]
    words: [lensa, tren, eksklusif]
  - id: e07
    type: multiple_choice
    question: Penyanyi itu ___ jutaan remaja di Asia.
    options: [idola, instan, platform]
    answer: 0
    explain:
      ar_eg: idola = نجم بيحبوه الناس.
      ar: idola = نجم محبوب.
      en: idola = idol.
    words: [idola, instan, platform]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الإعلان ده تجاري، مش تعليمي.
      ar: هذا الإعلان تجاري، لا تعليمي.
      en: This ad is commercial, not educational.
    answer: Iklan ini komersial, bukan pendidikan.
    distractors: [virtual, tren]
    words: [komersial]
  - id: e09
    type: translate
    direction: from_target
    source_text: Rapat virtual ini dimulai jam sembilan.
    answers_meaning:
      ar_eg: [الاجتماع الأونلاين ده هيبدأ الساعة تسعة, الاجتماع الافتراضي بيبدأ تسعة]
      ar: [يبدأ هذا الاجتماع الافتراضي في التاسعة, يبدأ الاجتماع الافتراضي الساعة التاسعة]
      en: [This virtual meeting starts at nine, 'The online meeting begins at nine o''clock']
    words: [virtual]
  - id: e10
    type: speaking
    text: Tren ini datang dari platform video pendek.
    meaning:
      ar_eg: التريند ده جاي من منصة الفيديوهات القصيرة.
      ar: جاء هذا الاتجاه من منصّة الفيديوهات القصيرة.
      en: This trend comes from a short-video platform.
    words: [tren, platform]
dialogue:
  lines:
    - speaker: Bu Lestari
      text: Kita mau mempromosikan kopi Kalimantan. Ada ide?
      ar_eg: عايزين نعمل دعاية لقهوة كاليمانتان. حد عنده فكرة؟
      ar: نريد الترويج لقهوة كاليمانتان. هل من أفكار؟
      en: We want to promote Kalimantan coffee. Any ideas?
    - speaker: Rina
      text: Video pendek lagi tren, Bu. Kita pake platform yang disukai anak muda aja.
      ar_eg: الفيديوهات القصيرة عاملة تريند. نستخدم المنصة اللي الشباب بيحبوها.
      ar: الفيديوهات القصيرة رائجة. لنستخدم المنصّة التي يحبّها الشباب.
      en: Short videos are trending. Let's use the platform young people like.
    - speaker: Mohamed
      text: Bagaimana kalau kita kerja sama dengan idola lokal? Kontraknya eksklusif.
      ar_eg: إيه رأيكم نشتغل مع نجم محلي الناس بتحبه؟ بعقد حصري.
      ar: ما رأيكم أن نتعاون مع نجم محلي؟ بعقد حصري.
      en: How about working with a local idol? An exclusive contract.
    - speaker: Bu Lestari
      text: Mahal, tapi nilai komersialnya tinggi. Kita juga bisa buat pameran virtual.
      ar_eg: غالي، بس قيمته التجارية عالية. وممكن كمان نعمل معرض أونلاين.
      ar: مكلف، لكن قيمته التجارية عالية. ويمكننا أيضًا إقامة معرض افتراضي.
      en: Expensive, but high commercial value. We could also run a virtual fair.
    - speaker: Rina
      text: Asal jangan kayak kopi instan, ya. Ini kopi asli, harus difoto pake lensa yang bagus!
      ar_eg: بس من غير ما يبان زي النسكافيه. دي قهوة أصلية، لازم تتصور بعدسة حلوة!
      ar: بشرط ألّا تبدو كقهوة سريعة التحضير. هذه قهوة أصيلة يجب تصويرها بعدسة جيدة!
      en: As long as it doesn't look like instant coffee. This is the real thing; shoot it with a good lens!
