schema: kabar.lesson/v1
id: bipa7.u08.l07
language: id
title: Hilirisasi nikel
can_do:
  ar_eg: تشرح ليه إندونيسيا وقفت تصدير خام النيكل وأثر ده على الميزان التجاري.
  ar: أن تشرح لماذا أوقفت إندونيسيا تصدير خام النيكل وأثر ذلك في الميزان التجاري.
  en: Explain why Indonesia stopped exporting raw nickel ore and how it affects the trade balance.
slides:
  - title: Dari tanah ke baterai
    body:
      ar_eg: |
        إندونيسيا عندها من أكبر احتياطيات nikel في العالم، وده بيدخل في بطاريات العربيات الكهربا.
        من يناير 2020 الحكومة منعت تصدير الخام علشان hilirisasi: الخام يتصنّع جوّه البلد في smelter (مصهر) زي اللي في موروالي.
        الفكرة: nilai tambah (القيمة المضافة) تفضل في البلد، وتدخل devisa (عملة صعبة) أكتر.
        neraca perdagangan = الميزان التجاري: لو التصدير أكتر من الاستيراد يبقى surplus (فايض)، ولو أقل يبقى defisit (عجز).
        النقّاد بيسألوا عن البيئة وعن حقوق العمّال في المصاهر.
        - في الكلام: tapi = tetapi.
      ar: |
        لدى إندونيسيا من أكبر احتياطيات nikel في العالم، وهو يدخل في بطاريات السيّارات الكهربائية.
        ومنذ يناير 2020 منعت الحكومة تصدير الخام سعيًا إلى hilirisasi: تصنيعه محليًّا في smelter (مصهر) كمصاهر موروالي.
        والغاية أن تبقى nilai tambah (القيمة المضافة) في البلد وتزداد devisa (العملة الصعبة).
        neraca perdagangan = الميزان التجاري: إن زادت الصادرات على الواردات كان surplus (فائضًا)، وإن نقصت كان defisit (عجزًا).
        ويسأل المنتقدون عن البيئة وحقوق العمّال في المصاهر.
        - في الكلام اليومي: tapi = tetapi.
      en: |
        Indonesia has some of the world's largest nikel reserves, a key metal in electric-car batteries.
        Since January 2020 the government has banned raw ore exports for hilirisasi: processing at home in smelters such as those at Morowali.
        The idea: the nilai tambah (added value) stays in the country and brings in more devisa (foreign exchange).
        neraca perdagangan = trade balance: exports above imports is a surplus, below is a defisit.
        Critics ask about the environment and workers' rights at the smelters.
        - In speech: tapi = tetapi.
    examples:
      - text: Neraca perdagangan Indonesia mencatat surplus bulan ini.
        ar_eg: الميزان التجاري لإندونيسيا سجّل فايض الشهر ده.
        ar: سجّل الميزان التجاري لإندونيسيا فائضًا هذا الشهر.
        en: Indonesia's trade balance recorded a surplus this month.
      - text: Smelter itu mengolah bijih nikel menjadi bahan baterai.
        ar_eg: المصهر ده بيحوّل خام النيكل لمادّة للبطاريات.
        ar: يحوّل ذلك المصهر خام النيكل إلى مادّة للبطاريات.
        en: That smelter turns nickel ore into battery material.
      - text: Hilirisasi bertujuan meningkatkan nilai tambah.
        ar_eg: التصنيع المحلّي هدفه يزوّد القيمة المضافة.
        ar: يهدف التصنيع المحلّي إلى زيادة القيمة المضافة.
        en: Downstreaming aims to raise added value.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: neraca perdagangan
        ar_eg: الميزان التجاري
        ar: الميزان التجاري
        en: balance of trade
      - text: defisit
        ar_eg: عجز
        ar: عجز
        en: deficit
      - text: surplus
        ar_eg: فايض
        ar: فائض
        en: surplus
      - text: devisa
        ar_eg: عملة صعبة
        ar: العملة الصعبة، النقد الأجنبي
        en: foreign exchange
    words: [neraca perdagangan, defisit, surplus, devisa]
  - id: e02
    type: match_pairs
    pairs:
      - text: hilirisasi
        ar_eg: تصنيع المادة الخام جوّه البلد
        ar: تصنيع المواد الخام محليًا
        en: downstreaming (processing raw materials at home)
      - text: nikel
        ar_eg: نيكل
        ar: نيكل
        en: nickel
      - text: smelter
        ar_eg: مصهر (مصنع صهر المعادن)
        ar: مصهر
        en: smelter
      - text: nilai tambah
        ar_eg: قيمة مضافة
        ar: قيمة مضافة
        en: added value
    words: [hilirisasi, nikel, smelter, nilai tambah]
  - id: e03
    type: listen
    text: Ekspor nikel olahan membawa devisa yang besar.
    question:
      ar_eg: التصدير بيجيب إيه؟
      ar: ماذا يجلب التصدير؟
      en: What do the exports bring in?
    options: [عملة صعبة, عجز, مصهر]
    answer: 0
    meaning:
      ar_eg: تصدير النيكل المصنّع بيدخّل عملة صعبة كتير.
      ar: يجلب تصدير النيكل المصنّع عملة صعبة كبيرة.
      en: Exports of processed nickel bring in a lot of foreign exchange.
    words: [devisa, nikel]
  - id: e04
    type: fill_blank
    sentence: Jika impor lebih besar daripada ekspor, neraca perdagangan ___.
    meaning:
      ar_eg: لو الاستيراد أكبر من التصدير، الميزان التجاري يبقى فيه ___.
      ar: إن زادت الواردات على الصادرات كان في الميزان التجاري ___.
      en: If imports exceed exports, the trade balance is in ___.
    options: [defisit, surplus, hilirisasi]
    answers: [defisit]
    words: [defisit, surplus, hilirisasi, neraca perdagangan]
    explain:
      ar_eg: الاستيراد أكتر من التصدير = عجز تجاري (defisit). surplus العكس، وhilirisasi = تصنيع محلي للخام.
      ar: الاستيراد أكبر من التصدير defisit أي عجز. surplus فائض وhilirisasi تصنيع محلي.
      en: More imports than exports is a defisit.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: هدف «hilirisasi» إيه؟
      ar: ما هدف «hilirisasi»؟
      en: What is the aim of 'hilirisasi'?
    options: [Mengekspor lebih banyak tanah mentah., Mengolah bahan mentah di dalam negeri supaya nilainya naik., Menutup semua smelter.]
    answer: 1
    explain:
      ar_eg: نصنّع الخام هنا علشان القيمة المضافة تفضل في البلد.
      ar: تصنيع الخام محليًّا لتبقى القيمة المضافة في البلد.
      en: Process raw materials at home to keep the added value.
    words: [hilirisasi, smelter, nilai tambah]
  - id: e06
    type: fill_blank
    sentence: Bulan lalu ada ___ karena ekspor batu bara naik.
    meaning:
      ar_eg: الشهر اللي فات كان فيه ___ علشان تصدير الفحم زاد.
      ar: كان هناك ___ الشهر الماضي لارتفاع صادرات الفحم.
      en: Last month there was a ___ because coal exports rose.
    options: [surplus, devisa, nikel]
    answers: [surplus]
    words: [surplus, devisa, nikel]
    explain:
      ar_eg: التصدير زاد فبقى فيه surplus = فايض. devisa = عملة صعبة وnikel = نيكل (معدن).
      ar: زيادة الصادرات تعطي surplus أي فائضًا. devisa عملة صعبة وnikel معدن.
      en: Rising exports bring a surplus.
  - id: e07
    type: build_sentence
    source:
      ar_eg: المصهر الجديد ده في موروالي.
      ar: يقع المصهر الجديد في موروالي.
      en: The new smelter is in Morowali.
    answer: Smelter baru itu berada di Morowali.
    distractors: [nikel, devisa]
    words: [smelter]
    explain:
      ar_eg: Smelter baru itu (المصهر الجديد) + berada (موجود) + di Morowali. nikel وdevisa زيادة.
      ar: Smelter baru itu berada di Morowali. nikel وdevisa زائدتان.
      en: Smelter baru itu + berada + di Morowali. nikel and devisa are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Pemerintah melarang ekspor bijih nikel sejak 2020.
    answers_meaning:
      ar_eg: [الحكومة منعت تصدير خام النيكل من 2020, من سنة 2020 الحكومة وقّفت تصدير خام النيكل]
      ar: [منعت الحكومة تصدير خام النيكل منذ 2020, تحظر الحكومة تصدير خام النيكل منذ عام 2020]
      en: [The government has banned nickel ore exports since 2020, Since 2020 the government has prohibited exporting nickel ore]
    words: [nikel]
  - id: e09
    type: speaking
    text: Nilai tambah harus dinikmati juga oleh warga sekitar tambang.
    meaning:
      ar_eg: القيمة المضافة لازم أهل المنطقة اللي حوالين المنجم كمان يستفيدوا منها.
      ar: ينبغي أن يستفيد سكّان محيط المنجم أيضًا من القيمة المضافة.
      en: Local people near the mine should benefit from the added value too.
    words: [nilai tambah]
  - id: e10
    type: multiple_choice
    question: Apa yang dicatat oleh neraca perdagangan?
    options: [Jumlah smelter di Sulawesi., Harga baterai mobil., Selisih nilai ekspor dan impor.]
    answer: 2
    explain:
      ar_eg: الميزان التجاري = الفرق بين التصدير والاستيراد.
      ar: الميزان التجاري = الفرق بين الصادرات والواردات.
      en: Trade balance = the gap between exports and imports.
    words: [neraca perdagangan, smelter, defisit, surplus, devisa, hilirisasi]
dialogue:
  lines:
    - speaker: Bu Frida
      text: 'Mohamed, coba jelaskan berita ini: "Neraca perdagangan surplus lagi."'
      ar_eg: 'يا محمد، اشرح الخبر ده: «الميزان التجاري فيه فايض تاني».'
      ar: 'يا محمد، اشرح هذا الخبر: «الميزان التجاري في فائض مجدّدًا».'
      en: 'Mohamed, explain this headline: ''Trade balance in surplus again.'''
    - speaker: Mohamed
      text: Artinya ekspor lebih besar daripada impor, Bu.
      ar_eg: معناه إن التصدير أكبر من الاستيراد يا أستاذة.
      ar: معناه أنّ الصادرات أكبر من الواردات يا أستاذة.
      en: It means exports are bigger than imports, ma'am.
    - speaker: Bu Frida
      text: Betul. Salah satu sebabnya hilirisasi nikel.
      ar_eg: مظبوط. وواحد من الأسباب التصنيع المحلّي للنيكل.
      ar: صحيح، ومن أسبابه تصنيع النيكل محليًّا.
      en: Right. One reason is nickel downstreaming.
    - speaker: Mohamed
      text: Tapi Kaka Yohana bilang ada masalah lingkungan di sekitar smelter.
      ar_eg: بس كاكا يوهانا قالت إن فيه مشاكل بيئية حوالين المصاهر.
      ar: لكنّ كاكا يوهانا قالت إنّ هناك مشكلات بيئية حول المصاهر.
      en: But Kaka Yohana says there are environmental problems around the smelters.
    - speaker: Bu Frida
      text: Itu benar juga. Nilai tambah ekonomi harus ditimbang dengan biaya lingkungan.
      ar_eg: ده صحيح برضه. القيمة المضافة لازم تتوزن قصاد تمن البيئة.
      ar: وهذا صحيح أيضًا، فيجب موازنة القيمة المضافة بالكلفة البيئية.
      en: That's true too. Economic added value has to be weighed against environmental cost.
