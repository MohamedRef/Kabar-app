schema: kabar.lesson/v1
id: bipa1.u03.l08
language: id
title: Lebaran di rumah Paman
can_do:
  ar_eg: 'تتعرّف على قرايبك في العيد: العم والخال وولادهم، وتسأل بيشتغلوا إيه.'
  ar: 'أن تتعرّف على أقاربك في العيد: الأعمام والأخوال وأبناءهم، وتسأل عن أعمالهم.'
  en: 'Meet relatives at Lebaran: uncles, aunts and cousins, and ask what they do.'
slides:
  - title: Paman dan bibi
    body:
      ar_eg: |
        paman = عم أو خال، bibi = عمة أو خالة (في الكلام: Om وTante). مفيش فرق بين ناحية الأب والأم.
        ولادهم sepupu (ولاد العم والخال). saudara = أخ أو أخت، ومرات قريب بشكل عام.
        polisi = ظابط بوليس، pegawai = موظف، bos = المدير.
        kerja = شغل. «Kerja di mana?» = «بتشتغل فين؟» بالعامية.
      ar: |
        paman = عمّ أو خال، bibi = عمّة أو خالة (وفي الكلام Om وTante)، بلا تفريق بين جهة الأب والأم.
        وأبناؤهم sepupu، وsaudara = أخ أو أخت، وقد تعني القريب عمومًا.
        polisi = شرطي، pegawai = موظّف، bos = المدير.
        kerja = عمل. «Kerja di mana?» = «أين تعمل؟» بالعامية.
      en: |
        paman = uncle and bibi = aunt (in speech, Om and Tante), on either side of the family.
        Their children are sepupu (cousins). saudara = brother or sister, sometimes any relative.
        polisi = police officer, pegawai = employee, bos = boss.
        kerja = work. "Kerja di mana?" is the casual "Where do you work?"
    examples:
      - text: Paman saya polisi. Dia kerja di Bandung.
        ar_eg: عمي ظابط بوليس. بيشتغل في باندونج.
        ar: عمّي شرطي، يعمل في باندونغ.
        en: My uncle is a police officer. He works in Bandung.
      - text: Bibi saya pegawai. Bosnya baik.
        ar_eg: خالتي موظفة، ومديرها كويس.
        ar: خالتي موظّفة، ومديرها طيّب.
        en: My aunt is an employee. Her boss is nice.
      - text: Rafi sepupu saya. Dia anak paman saya.
        ar_eg: رافي ابن عمي، يعني ابن أخو بابا.
        ar: رافي ابن عمّي، أي ابن أخي أبي.
        en: Rafi is my cousin. He's my uncle's son.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: paman
        ar_eg: عم / خال
        ar: عمّ / خال
        en: uncle
      - text: bibi
        ar_eg: عمة / خالة
        ar: عمّة / خالة
        en: aunt
      - text: sepupu
        ar_eg: ابن العم / الخال
        ar: ابن العم / الخال
        en: cousin
      - text: saudara
        ar_eg: أخ / أخت
        ar: أخ / أخت
        en: sibling
    words: [paman, bibi, sepupu, saudara]
  - id: e02
    type: match_pairs
    pairs:
      - text: polisi
        ar_eg: بوليس
        ar: شرطي
        en: police officer
      - text: pegawai
        ar_eg: موظف
        ar: موظّف
        en: employee
      - text: bos
        ar_eg: مدير
        ar: مدير
        en: boss
      - text: kerja
        ar_eg: شغل
        ar: عمل
        en: work
    words: [polisi, pegawai, bos, kerja]
  - id: e03
    type: listen
    text: Paman saya polisi di Jakarta.
    question:
      ar_eg: عمه بيشتغل إيه؟
      ar: ما عمل عمّه؟
      en: What does his uncle do?
    options: [ظابط بوليس, موظف, مدير]
    answer: 0
    meaning:
      ar_eg: عمي ظابط بوليس في جاكرتا.
      ar: عمّي شرطي في جاكرتا.
      en: My uncle is a police officer in Jakarta.
    words: [paman, polisi]
  - id: e04
    type: fill_blank
    sentence: Anak paman saya adalah ___ saya.
    meaning:
      ar_eg: ابن عمي يبقى ___ بتاعي.
      ar: ابن عمّي هو ___ ـي.
      en: My uncle's child is my ___.
    options: [sepupu, saudara, bos]
    answers: [sepupu]
    words: [paman, sepupu, saudara, bos]
    explain:
      ar_eg: ابن عمك أو خالك = sepupu. saudara = قريب/أخ، وbos = مدير.
      ar: ابن العم أو الخال sepupu. saudara قريب أو أخ.
      en: Your uncle's child is your sepupu (cousin).
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أخوك أو أختك بالإندونيسي؟
      ar: ما كلمة الأخ أو الأخت بالإندونيسية؟
      en: Your brother or sister in Indonesian?
    options: [saudara, sepupu, bibi]
    answer: 0
    explain:
      ar_eg: saudara = أخ أو أخت. sepupu = ابن عم، وbibi = عمة.
      ar: saudara أخ أو أخت، وsepupu ابن عمّ، وbibi عمّة.
      en: saudara = sibling; sepupu = cousin, bibi = aunt.
    words: [saudara, sepupu, bibi]
  - id: e06
    type: fill_blank
    sentence: Bibi saya ___. Bosnya orang Mesir.
    meaning:
      ar_eg: خالتي ___، ومديرها مصري.
      ar: خالتي ___، ومديرها مصري.
      en: My aunt is an ___. Her boss is Egyptian.
    options: [pegawai, polisi, sepupu]
    answers: [pegawai]
    words: [pegawai, polisi, bos]
    explain:
      ar_eg: عندها bos (مدير)، فهي pegawai = موظفة. polisi = شرطي، وsepupu = ابن عم.
      ar: لها مدير فهي pegawai أي موظفة.
      en: Someone with a boss is a pegawai (employee).
  - id: e07
    type: build_sentence
    source:
      ar_eg: خالتي بتشتغل في جاكرتا.
      ar: تعمل خالتي في جاكرتا.
      en: My aunt works in Jakarta.
    answer: Bibi saya kerja di Jakarta.
    distractors: [paman, bos]
    words: [bibi, kerja]
    explain:
      ar_eg: Bibi saya (خالتي/عمتي) + kerja (بتشتغل) + di Jakarta. paman وbos زيادة.
      ar: Bibi saya kerja di Jakarta. paman وbos زائدتان.
      en: Bibi saya + kerja + di Jakarta. paman and bos are extra.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إنت بتشتغل فين؟ (بالعامية)
      ar: أين تعمل؟ (بالعامية)
      en: Where do you work? (casual)
    answers:
      - Kamu kerja di mana?
      - Kerja di mana?
      - Anda kerja di mana?
    words: [kerja]
  - id: e09
    type: speaking
    text: Paman saya polisi, dan bibi saya pegawai.
    meaning:
      ar_eg: عمي ظابط بوليس، وخالتي موظفة.
      ar: عمّي شرطي، وخالتي موظّفة.
      en: My uncle is a police officer, and my aunt is an employee.
    words: [paman, polisi, bibi, pegawai]
  - id: e10
    type: multiple_choice
    question: Ayah Tono adalah ayah Tuti juga. Tono dan Tuti …
    options: [saudara, sepupu, bos]
    answer: 0
    explain:
      ar_eg: 'ليهم نفس الأب، يبقوا إخوات: saudara.'
      ar: 'لهما الأب نفسه، فهما أخوان: saudara.'
      en: 'Same father, so they''re siblings: saudara.'
    words: [saudara, sepupu, bos]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, ini paman saya, Om Hasan.
      ar_eg: يا محمد، ده عمي، عمو حسن.
      ar: يا محمد، هذا عمّي حسن.
      en: Mohamed, this is my uncle, Om Hasan.
    - speaker: Paman
      text: Selamat datang! Kamu kerja di mana, Mohamed?
      ar_eg: أهلًا بيك! إنت بتشتغل فين يا محمد؟
      ar: أهلًا بك! أين تعمل يا محمد؟
      en: Welcome! Where do you work, Mohamed?
    - speaker: Mohamed
      text: Saya mahasiswa, Om. Om kerja di mana?
      ar_eg: أنا طالب جامعة يا عمو. وحضرتك بتشتغل فين؟
      ar: أنا طالب جامعي يا عمّ. وأين تعمل أنت؟
      en: I'm a university student, Om. Where do you work?
    - speaker: Paman
      text: Saya polisi. Itu bibi Rina, istri saya. Dia pegawai.
      ar_eg: أنا ظابط بوليس. ودي خالة رينا، مراتي. هي موظفة.
      ar: أنا شرطي، وتلك عمّة رينا، زوجتي، وهي موظّفة.
      en: I'm a police officer. That's Rina's aunt, my wife. She's an office worker.
    - speaker: Mohamed
      text: Dan anak-anak itu?
      ar_eg: والعيال دول؟
      ar: وأولئك الأطفال؟
      en: And those children?
    - speaker: Rina
      text: Mereka anak Om Hasan, sepupu saya.
      ar_eg: دول ولاد عمو حسن، ولاد عمي.
      ar: هم أبناء عمّي حسن، أبناء عمّي.
      en: They're Om Hasan's kids, my cousins.
