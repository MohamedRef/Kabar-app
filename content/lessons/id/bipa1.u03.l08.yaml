  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: 'قدامك بابين للتواليت: Pria وWanita. إنت راجل. تدخل أنهي باب؟'
      ar: 'أمامك بابان لدورة المياه: Pria وWanita، وأنت رجل. أيّهما تدخل؟'
      en: 'Two toilet doors: Pria and Wanita. You''re a man. Which do you go through?'
    options: [Pria, Wanita, Gadis]
    answer: 0
    explain:
      ar_eg: Pria للرجالة وWanita للستات.
      ar: Pria للرجال وWanita للنساء.
      en: Pria is for men, Wanita for women.
    words: [pria, wanita]
  - id: e04
    type: listen
    text: Saya pegawai. Bos saya orang Mesir.
    question:
      ar_eg: مين المصري؟
      ar: مَن المصري؟
      en: Who is Egyptian?
    options: [المدير بتاعه, هو نفسه, أبوه]
    answer: 0
    meaning:
      ar_eg: أنا موظف، ومديري مصري.
      ar: أنا موظّف، ومديري مصري.
      en: I'm an employee. My boss is Egyptian.
    words: [pegawai, bos]
  - id: e05
    type: fill_blank
    sentence: Kakak saya ___. Adik saya siswa.
    meaning:
      ar_eg: أخويا الكبير ___، وأخويا الصغير تلميذ.
      ar: أخي الأكبر ___، وأخي الأصغر تلميذ.
      en: My older brother is an ___. My younger brother is a pupil.
    options: [pegawai, gadis, wanita]
    answers: [pegawai]
    words: [pegawai, siswa]
  - id: e06
    type: fill_blank
    sentence: Wanita itu ___ saya.
    meaning:
      ar_eg: الست دي ___ بتاعتي.
      ar: تلك المرأة ___ ـتي.
      en: That woman is my ___.
    options: [bos, siswa, gadis]
    answers: [bos]
    words: [wanita, bos]
  - id: e07
    type: build_sentence
    source:
      ar_eg: البنت دي بنت الظابط.
      ar: تلك الفتاة ابنة الشرطي.
      en: That girl is the police officer's daughter.
    answer: Gadis itu anak polisi.
    distractors: [pria, bos]
    words: [gadis, polisi]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إنت بتشتغل فين؟ (بالعامية)
      ar: أين تعمل؟ (بالعامية)
      en: Where do you work? (casual)
    answers:
      - Kamu kerja di mana?
      - Kerja di mana?
      - Anda kerja di mana?
    words: [kerja]
  - id: e09
    type: speaking
    text: Gadis itu siswa, dan pria itu polisi.
    meaning:
      ar_eg: البنت دي تلميذة، والراجل دا ظابط.
      ar: تلك الفتاة تلميذة، وذلك الرجل شرطي.
      en: That girl is a pupil, and that man is a police officer.
    words: [gadis, siswa, pria, polisi]
  - id: e10
    type: multiple_choice
    question: Ayah Rina ___ di Jakarta. Dia polisi.
    options: [kerja, siswa, bos]
    answer: 0
    explain:
      ar_eg: 'kerja = بيشتغل: أبو رينا بيشتغل في جاكرتا.'
      ar: 'kerja = يعمل: أبو رينا يعمل في جاكرتا.'
      en: 'kerja = works: Rina''s father works in Jakarta.'
    words: [kerja, polisi]
dialogue:
  lines:
    - speaker: Petugas
      text: Selamat pagi. Nama Anda siapa?
      ar_eg: صباح الخير. اسم حضرتك إيه؟
      ar: صباح الخير. ما اسمك؟
      en: Good morning. What's your name?
    - speaker: Agus
      text: Nama saya Agus.
      ar_eg: اسمي أجوس.
      ar: اسمي أجوس.
      en: My name is Agus.
    - speaker: Petugas
      text: Pekerjaan Anda apa, Mas Agus?
      ar_eg: بتشتغل إيه يا أستاذ أجوس؟
      ar: ما عملك يا سيد أجوس؟
      en: What's your job, Agus?
    - speaker: Agus
      text: Saya polisi. Saya kerja di Jakarta.
      ar_eg: أنا ظابط بوليس. بشتغل في جاكرتا.
      ar: أنا شرطي، أعمل في جاكرتا.
      en: I'm a police officer. I work in Jakarta.
    - speaker: Petugas
      text: Dan gadis ini? Adik Anda?
      ar_eg: والبنت دي؟ أختك الصغيرة؟
      ar: وهذه الفتاة؟ أختك الصغرى؟
      en: And this girl? Your younger sister?
    - speaker: Agus
      text: Ya. Dia siswa. Dia mau daftar kursus bahasa Inggris.
      ar_eg: أيوه. هي تلميذة، وعايزة تسجّل في كورس إنجليزي.
      ar: نعم، هي تلميذة وتريد التسجيل في دورة إنجليزية.
      en: Yes. She's a pupil. She wants to sign up for an English course.
