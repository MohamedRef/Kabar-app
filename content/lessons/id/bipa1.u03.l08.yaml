schema: kabar.lesson/v1
id: bipa1.u03.l08
language: id
title: Pria dan wanita
can_do:
  ar_eg: تقرا Pria / Wanita على الأبواب والاستمارات، وتقول شغلانة حد بكلمات بسيطة.
  ar: أن تقرأ Pria / Wanita على الأبواب والاستمارات، وتذكر عمل شخص بكلمات بسيطة.
  en: Read Pria / Wanita on doors and forms, and say what someone does in simple words.
slides:
  - title: Pria, wanita, gadis
    body:
      ar_eg: |
        pria = راجل، وwanita = ست. دول الكلمتين الرسميين اللي هتلاقيهم على باب التواليت وفي الاستمارات. في الكلام العادي laki-laki وperempuan.
        gadis = بنت أو صبية.
        siswa = تلميذ في المدرسة، أما mahasiswa فطالب جامعة.
        pegawai = موظف، وbos = المدير (كلمة عامية).
        kerja = شغل. «Kerja di mana?» يعني «بتشتغل فين؟» بالعامية. في الكتابة بتبقى bekerja (هتيجي في الوحدة ٥).
      ar: |
        pria = رجل، وwanita = امرأة، وهما الكلمتان الرسميتان على أبواب دورات المياه وفي الاستمارات. أما في الكلام العادي فـ laki-laki وperempuan.
        gadis = فتاة.
        siswa = تلميذ المدرسة، أما mahasiswa فطالب الجامعة.
        pegawai = موظّف، وbos = المدير (كلمة دارجة).
        kerja = عمل. «Kerja di mana?» = «أين تعمل؟» بالعامية، وفي الكتابة bekerja (في الوحدة الخامسة).
      en: |
        pria = man and wanita = woman: the formal words on toilet doors and forms. In everyday talk people say laki-laki and perempuan.
        gadis = girl, young woman.
        siswa = school pupil; mahasiswa = university student.
        pegawai = employee; bos = boss (casual).
        kerja = work. "Kerja di mana?" is the casual "Where do you work?"; in writing it's bekerja (unit 5).
    examples:
      - text: Ayah saya polisi. Dia kerja di Jakarta.
        ar_eg: بابا ظابط بوليس. بيشتغل في جاكرتا.
        ar: أبي شرطي، يعمل في جاكرتا.
        en: My father is a police officer. He works in Jakarta.
      - text: Gadis itu siswa. Kakaknya mahasiswa.
        ar_eg: البنت دي تلميذة، وأخوها الكبير طالب جامعة.
        ar: تلك الفتاة تلميذة، وأخوها الأكبر طالب جامعي.
        en: That girl is a pupil. Her older brother is a university student.
      - text: Kak Yoga pegawai baru. Bosnya orang Mesir.
        ar_eg: يوجا موظف جديد، ومديره مصري.
        ar: يوجا موظّف جديد، ومديره مصري.
        en: Yoga is a new employee. His boss is Egyptian.
