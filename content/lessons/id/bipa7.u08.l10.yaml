    type: match_pairs
    pairs:
      - text: pinjol
        ar_eg: قروض أونلاين (أبلكيشن)
        ar: قروض عبر التطبيقات
        en: online lending app (pinjaman online)
      - text: literasi keuangan
        ar_eg: الثقافة المالية
        ar: الثقافة المالية
        en: financial literacy
      - text: inklusi keuangan
        ar_eg: الشمول المالي
        ar: الشمول المالي
        en: financial inclusion
      - text: agunan
        ar_eg: ضمان (رهن قصاد القرض)
        ar: ضمان، رهن
        en: collateral
    words: [pinjol, literasi keuangan, inklusi keuangan, agunan]
  - id: e02
    type: match_pairs
    pairs:
      - text: bunga majemuk
        ar_eg: فايدة مركّبة
        ar: فائدة مركّبة
        en: compound interest
      - text: deposito
        ar_eg: وديعة
        ar: وديعة لأجل
        en: time deposit
      - text: premi
        ar_eg: قسط التأمين
        ar: قسط التأمين
        en: insurance premium
      - text: pembukuan
        ar_eg: مسك الدفاتر / حسابات
        ar: مسك الدفاتر
        en: bookkeeping
    words: [bunga majemuk, deposito, premi, pembukuan]
  - id: e03
    type: listen
    text: Mama Ester menaruh uangnya di deposito selama satu tahun.
    question:
      ar_eg: حطّت فلوسها فين؟
      ar: أين وضعت مالها؟
      en: Where did she put her money?
    options: [وديعة, ضمان, قسط تأمين]
    answer: 0
    meaning:
      ar_eg: ماما إستر حطّت فلوسها وديعة لمدة سنة.
      ar: أودعت ماما إستر مالها وديعةً لمدّة سنة.
      en: Mama Ester put her money in a one-year time deposit.
    words: [deposito]
  - id: e04
    type: fill_blank
    sentence: Setiap bulan saya membayar ___ asuransi kesehatan.
    meaning:
      ar_eg: كل شهر بدفع ___ التأمين الصحي.
      ar: أدفع كلّ شهر ___ التأمين الصحّي.
      en: Every month I pay my health insurance ___.
    options: [premi, agunan, pinjol]
    answers: [premi]
    words: [premi, agunan, pinjol]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه «bunga majemuk» خطر في القروض؟
      ar: لماذا تُعدّ «bunga majemuk» خطيرة في القروض؟
      en: Why is 'bunga majemuk' dangerous on loans?
    options: ['Karena bunganya dihitung lagi dari bunga, jadi utang cepat membesar.', Karena bank tutup pada hari Minggu., Karena tidak perlu agunan.]
    answer: 0
    explain:
      ar_eg: الفايدة على الفايدة بتكبّر الدين بسرعة.
      ar: الفائدة على الفائدة تضخّم الدَّين بسرعة.
      en: Interest on interest makes debt balloon.
    words: [bunga majemuk, agunan]
  - id: e06
    type: fill_blank
    sentence: Tanpa ___, pedagang tidak tahu untung atau rugi.
    meaning:
      ar_eg: من غير ___، التاجر مش هيعرف كسب ولا خسر.
      ar: من دون ___ لا يعرف التاجر أربح أم خسر.
      en: Without ___, a trader doesn't know if they made a profit.
    options: [pembukuan, deposito, inklusi keuangan]
    answers: [pembukuan]
    words: [pembukuan, deposito, inklusi keuangan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الثقافة المالية لازم تتدرّس في المدرسة.
      ar: يجب تدريس الثقافة المالية في المدرسة.
      en: Financial literacy should be taught at school.
    answer: Literasi keuangan harus diajarkan di sekolah.
    distractors: [pinjol, premi]
    words: [literasi keuangan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Dengan inklusi keuangan, semua warga bisa memakai layanan bank.
    answers_meaning:
      ar_eg: [بالشمول المالي، كل الناس تقدر تستعمل خدمات البنوك, مع الشمول المالي كل المواطنين يقدروا يوصلوا للبنك]
      ar: [بالشمول المالي يستطيع كلّ المواطنين استعمال خدمات المصارف, مع الشمول المالي تتاح الخدمات المصرفية لجميع المواطنين]
      en: ['With financial inclusion, every citizen can use bank services', 'Through financial inclusion, all citizens can use banks']
    words: [inklusi keuangan]
  - id: e09
    type: speaking
    text: Jangan pakai pinjol ilegal, apalagi tanpa literasi keuangan.
    meaning:
      ar_eg: ما تستعملش قروض الأبلكيشنات غير القانونية، خصوصًا من غير ثقافة مالية.
      ar: لا تستعمل تطبيقات الإقراض غير القانونية، ولا سيّما دون ثقافة مالية.
      en: Don't use illegal lending apps, least of all without financial literacy.
    words: [pinjol, literasi keuangan]
  - id: e10
    type: multiple_choice
    question: Apa tanda pinjol ilegal?
    options: [Terdaftar di OJK dan bunganya jelas., Mengancam akan menyebar data dan foto peminjam., Meminta agunan resmi.]
    answer: 1
    explain:
      ar_eg: التهديد بنشر البيانات = علامة قرض غير قانوني.
      ar: التهديد بنشر البيانات علامة على الإقراض غير القانوني.
      en: Threatening to leak data = sign of an illegal lender.
    words: [pinjol, agunan, deposito, premi, bunga majemuk, pembukuan, inklusi keuangan]
dialogue:
  lines:
    - speaker: Mama Ester
      text: Mohamed, keponakan saya pinjam uang di aplikasi. Sekarang utangnya tiga kali lipat!
      ar_eg: يا محمد، ابن أختي استلف فلوس من أبلكيشن. دلوقتي الدين بقى تلات أضعاف!
      ar: يا محمد، اقترض ابن أختي من تطبيق، والآن تضاعف دَينه ثلاث مرّات!
      en: Mohamed, my nephew borrowed from an app. Now his debt has tripled!
    - speaker: Mohamed
      text: Itu pinjol ilegal, Mama? Terdaftar di OJK atau nggak?
      ar_eg: ده أبلكيشن غير قانوني يا ماما؟ متسجّل في الـ OJK ولا لأ؟
      ar: أهو تطبيق غير قانوني يا أمّي؟ هل هو مسجّل لدى OJK؟
      en: Is it an illegal lending app, Mama? Registered with the OJK or not?
    - speaker: Mama Ester
      text: Nggak tahu. Mereka juga kirim pesan ke semua temannya.
      ar_eg: مش عارفة. وكمان بيبعتوا رسايل لكل صحابه.
      ar: لا أعرف، وهم يرسلون رسائل إلى كلّ أصدقائه أيضًا.
      en: I don't know. They also message all his friends.
    - speaker: Mohamed
      text: Itu ciri pinjol ilegal. Bunga majemuknya juga nggak jelas. Dia harus lapor.
      ar_eg: دي علامة القروض غير القانونية. والفايدة المركّبة كمان مش واضحة. لازم يبلّغ.
      ar: هذه علامة الإقراض غير القانوني، وفائدته المركّبة غامضة أيضًا، فعليه أن يبلّغ.
      en: That's a sign of an illegal lender. The compound interest is unclear too. He must report it.
    - speaker: Mama Ester
      text: Kami butuh literasi keuangan di kampung ini.
      ar_eg: إحنا محتاجين ثقافة مالية في البلد دي.
      ar: نحن بحاجة إلى ثقافة مالية في هذه القرية.
      en: We need financial literacy in this village.
