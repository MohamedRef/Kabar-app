schema: kabar.lesson/v1
id: bipa7.u08.l10
language: id
title: Pinjol dan literasi keuangan
can_do:
  ar_eg: تنصح حد يحذر من قروض الأبلكيشنات وتشرح كلام البنوك الأساسي.
  ar: أن تنصح شخصًا بالحذر من قروض التطبيقات وتشرح مصطلحات المصارف الأساسية.
  en: Warn someone about lending apps and explain basic banking terms.
slides:
  - title: Uang pinjaman, uang tabungan
    body:
      ar_eg: |
        pinjol = pinjaman online: قرض سريع من أبلكيشن من غير agunan (ضمان).
        فيه pinjol مسجّلة في OJK، وفيه pinjol ilegal بتهدّد الناس وتفضحهم قدّام معارفهم.
        bunga majemuk = فايدة مركّبة: الفايدة بتتحسب على الفايدة، والدين بيكبر بسرعة.
        literasi keuangan = الثقافة المالية. inklusi keuangan = إن كل الناس يوصلوا للبنوك والخدمات المالية.
        في الادّخار: deposito = وديعة. في التأمين: premi = القسط الشهري.
        pembukuan = مسك الدفاتر، مهم لأي مشروع صغيّر.
        - في الكلام: nggak = tidak، kirim = mengirim.
      ar: |
        pinjol = pinjaman online: قرض سريع من تطبيق بلا agunan (ضمان).
        بعضها مسجّل لدى هيئة OJK، وبعضها pinjol ilegal يهدّد المقترضين ويفضحهم أمام معارفهم.
        bunga majemuk = الفائدة المركّبة: فائدة على الفائدة، فيتضخّم الدَّين سريعًا.
        literasi keuangan = الثقافة المالية. inklusi keuangan = وصول الجميع إلى المصارف والخدمات المالية.
        وفي الادّخار: deposito = وديعة لأجل. وفي التأمين: premi = القسط.
        pembukuan = مسك الدفاتر، وهو مهمّ لكلّ مشروع صغير.
        - في الكلام اليومي: nggak = tidak، kirim = mengirim.
      en: |
        pinjol = pinjaman online: a quick loan from an app, no agunan (collateral) needed.
        Some are registered with the OJK; illegal pinjol threaten borrowers and shame them to their contacts.
        bunga majemuk = compound interest: interest on interest, so debt grows fast.
        literasi keuangan = financial literacy. inklusi keuangan = everyone having access to banks and financial services.
        For saving: deposito = time deposit. For insurance: premi = the premium.
        pembukuan = bookkeeping, vital for any small business.
        - In speech: nggak = tidak, kirim = mengirim.
    examples:
      - text: Pinjol ilegal itu mengancam akan menyebar data peminjam.
        ar_eg: أبلكيشن القروض غير القانوني ده بيهدّد إنه ينشر بيانات المقترضين.
        ar: يهدّد تطبيق الإقراض غير القانوني بنشر بيانات المقترضين.
        en: That illegal lending app threatens to spread borrowers' data.
      - text: Bank meminta sertifikat tanah sebagai agunan.
        ar_eg: البنك طلب عقد الأرض كضمان.
        ar: طلب المصرف سند الأرض ضمانًا.
        en: The bank asked for the land title as collateral.
      - text: Dengan bunga majemuk, utang kecil bisa menjadi besar.
        ar_eg: بالفايدة المركّبة، الدين الصغيّر ممكن يكبر.
        ar: بالفائدة المركّبة قد يتضخّم الدَّين الصغير.
        en: With compound interest, a small debt can become huge.
exercises:
