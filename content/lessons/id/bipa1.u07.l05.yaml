schema: kabar.lesson/v1
id: bipa1.u07.l05
language: id
title: Enak banget!
can_do:
  ar_eg: تقول «قوي» بالعامية بـ banget وتختار الكلمة المناسبة.
  ar: أن تقول «جدًّا» بالعامية بـ banget وتختار المكثِّف المناسب.
  en: Say very casually with banget and pick the right intensifier.
slides:
  - title: enak banget!
    body:
      ar_eg: |
        banget بعد الصفة، وهي العامية بتاعة الشباب في جاكرتا، زي «أوووي»:
        enak banget = حلو أوي أوي، mahal banget = غالي أوي.
        في الشات بيكتبوها bgt: «mahal bgt».
        استخدمها مع صحابك، مش في الإيميل الرسمي.
      ar: |
        banget تأتي بعد الصفة، وهي عامية شائعة بين الشباب:
        enak banget = لذيذ جدًا، mahal banget = غالٍ جدًا.
        وتُكتب في المحادثات bgt: «mahal bgt».
        استعملها مع الأصدقاء لا في الرسائل الرسمية.
      en: |
        banget goes after the adjective — casual, everywhere in Jakarta:
        enak banget = sooo good, mahal banget = so expensive.
        Chats write it bgt: "mahal bgt".
        Use it with friends, not in a formal email.
    grammar: id.intensifier.basic
    examples:
      - text: Kopinya enak banget!
        ar_eg: القهوة حلوة أوي!
        ar: القهوة لذيذة جدًا!
        en: The coffee is so good!
      - text: mahal bgt sih
        ar_eg: غالي أوي بقى. (شات)
        ar: غالٍ جدًا. (محادثة)
        en: That's so expensive. (chat)
  - title: sangat atau sekali?
    body:
      ar_eg: |
        اختار واحدة بس: sangat enak أو enak sekali.
        «sangat enak sekali» الناس بتقولها، بس في الكتابة الرسمية بتتحسب غلط.
        ملخص: sangat قبل، sekali وbanget بعد.
      ar: |
        اختر واحدة فقط: sangat enak أو enak sekali.
        وعبارة «sangat enak sekali» شائعة في الكلام لكنها تُعدّ خطأً في الكتابة الرسمية.
        الخلاصة: sangat قبل الصفة، وsekali وbanget بعدها.
      en: |
        Pick one: sangat enak or enak sekali.
        People do say "sangat enak sekali", but formal writing counts it as wrong.
        Summary: sangat before; sekali and banget after.
    grammar: id.intensifier.basic
    examples:
      - text: Kemang ramai sekali.
        ar_eg: كيمانج زحمة أوي.
        ar: كيمانغ مزدحمة جدًا.
        en: Kemang is really busy.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: capek
        ar_eg: تعبان
        ar: متعب
        en: tired
      - text: ramai
        ar_eg: زحمة
        ar: مزدحم
        en: crowded, lively
      - text: sibuk
        ar_eg: مشغول
        ar: مشغول
        en: busy
      - text: kafe
        ar_eg: كافيه
        ar: مقهى
        en: café
      - text: musik
        ar_eg: مزيكا
        ar: موسيقى
        en: music
      - text: banget
        ar_eg: أوي
        ar: جدًا (عامية)
        en: really, so (casual)
    words: [capek, ramai, sibuk, kafe, musik, banget]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بتشات مع صاحبك. أنهي واحدة الأكثر عامية؟
      ar: تحادث صديقك. أيّها الأكثر عامية؟
      en: You're chatting with a friend. Which is the most casual?
    options: [Enak sekali!, Enak banget!, Sangat enak!]
    answer: 1
    explain:
      ar_eg: banget عامية الشباب، sangat أرسمي، sekali في النص.
      ar: banget عامية، وsangat رسمية، وsekali محايدة.
      en: banget is casual, sangat formal, sekali in between.
    words: [banget]
  - id: e03
    type: fill_blank
    sentence: Kafe ini ramai ___!
    meaning:
      ar_eg: الكافيه ده زحمة أوي!
      ar: هذا المقهى مزدحم جدًا!
      en: This café is so busy!
    options: [banget, sibuk, capek]
    answers: [banget]
    words: [kafe, ramai, banget]
    explain:
      ar_eg: "banget = أوي (عامي)، وبتيجي بعد الصفة: ramai banget. sibuk وcapek صفات."
      ar: banget = جدًا (عامية) بعد الصفة.
      en: banget = really, after the adjective.
  - id: e04
    type: build_sentence
    source:
      ar_eg: أنا مشغول أوي النهارده.
      ar: أنا مشغول جدًا اليوم.
      en: I'm really busy today.
    answer: Saya sibuk banget hari ini.
    distractors: [capek, kafe]
    words: [sibuk, banget]
    explain:
      ar_eg: Saya + sibuk banget (مشغول أوي) + hari ini. capek وkafe زيادة.
      ar: Saya sibuk banget hari ini. capek وkafe زائدتان.
      en: Saya + sibuk banget + hari ini. capek and kafe are extra.
  - id: e05
    type: listen
    text: Musik di kafe itu bagus banget.
    options: ['Musik di kafe itu bagus banget.', 'Musik di kafe itu ramai banget.', 'Makanan di kafe itu bagus banget.']
    answer: 0
    meaning:
      ar_eg: المزيكا في الكافيه ده حلوة أوي.
      ar: الموسيقى في ذلك المقهى رائعة.
      en: The music at that café is really good.
    words: [musik, kafe, ramai, banget]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا تعبان أوي.
      ar: أنا متعب جدًا.
      en: I'm very tired.
    answers: [Saya capek sekali., Saya sangat capek., Saya capek banget., Aku capek sekali., Aku capek banget., Aku sangat capek., Saya lelah sekali., Saya sangat lelah.]
    words: [capek]
  - id: e07
    type: dictation
    text: Kemang ramai sekali.
    meaning:
      ar_eg: كيمانج زحمة أوي.
      ar: كيمانغ مزدحمة جدًا.
      en: Kemang is really busy.
    words: [ramai, sekali]
  - id: e08
    type: speaking
    text: Saya sibuk dan capek. Saya mau ke kafe.
    meaning:
      ar_eg: أنا مشغول وتعبان. عايز أروح الكافيه.
      ar: أنا مشغول ومتعب. أريد الذهاب إلى المقهى.
      en: I'm busy and tired. I want to go to a café.
    words: [sibuk, capek, kafe]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول بالعامية «المزيكا حلوة أوي!»؟
      ar: كيف تقول بالعامية «الموسيقى رائعة جدًا!»؟
      en: How do you say casually "The music is so good!"?
    options: ['Musiknya bagus banget!', 'Musiknya sibuk banget!', 'Musiknya capek banget!']
    answer: 0
    words: [musik, banget, sibuk, capek]
    explain:
      ar_eg: المزيكا bagus banget = حلوة أوي. المزيكا مابتبقاش مشغولة ولا تعبانة.
      ar: Musiknya bagus banget = الموسيقى رائعة.
      en: Music is bagus (good), not sibuk or capek.
dialogue:
  title: Kopi di Kemang
  lines:
    - speaker: Rina
      text: Mohamed, gimana kopinya?
      ar_eg: محمد، القهوة عاملة إيه؟
      ar: يا محمد، كيف القهوة؟
      en: Mohamed, how's the coffee?
    - speaker: Mohamed
      text: Enak banget! Tapi mahal.
      ar_eg: حلوة أوي! بس غالية.
      ar: لذيذة جدًا! لكنها غالية.
      en: Really good! But expensive.
    - speaker: Rina
      text: Ya, kafe di Kemang mahal banget. Tapi tempatnya bagus.
      ar_eg: أيوه، الكافيهات في كيمانج غالية أوي. بس المكان حلو.
      ar: نعم، المقاهي في كيمانغ غالية جدًا، لكن المكان جميل.
      en: Yeah, cafés in Kemang are so expensive. But the place is nice.
    - speaker: Mohamed
      text: Betul. Musiknya juga bagus.
      ar_eg: صح. والمزيكا كمان حلوة.
      ar: صحيح. والموسيقى جميلة أيضًا.
      en: True. The music is good too.
    - speaker: Rina
      text: Kamu capek?
      ar_eg: إنت تعبان؟
      ar: هل أنت متعب؟
      en: Are you tired?
    - speaker: Mohamed
      text: Ya, hari ini aku sangat sibuk.
      ar_eg: أيوه، النهارده كنت مشغول جدًا.
      ar: نعم، كنت مشغولًا جدًا اليوم.
      en: Yes, I was very busy today.
