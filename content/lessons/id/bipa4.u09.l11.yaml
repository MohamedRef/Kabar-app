schema: kabar.lesson/v1
id: bipa4.u09.l11
language: id
title: Opini warga Manado
can_do:
  ar_eg: تقرا مقال رأي قصير وتعرف رأي الكاتب وحججه والحل اللي بيقترحه.
  ar: أن تقرأ مقال رأي قصيرًا وتعرف موقف الكاتب وحججه والحلّ الذي يقترحه.
  en: Read a short opinion piece and identify the writer's view, arguments and proposed solution.
slides:
  - title: Kolom opini
    body:
      ar_eg: |
        مقال رأي كتبته مدرّسة من مانادو في جرنال محلي. ده نص عرضي (eksposisi).
        دوّر على: الرأي، الحجج (Pertama، Kedua)، والحل (solusi).
      ar: |
        مقال رأي كتبته معلّمة من مانادو في صحيفة محلية، وهو نص عرضي (eksposisi).
        ابحث عن: الرأي، والحجج (Pertama، Kedua)، والحلّ (solusi).
      en: |
        An opinion piece by a Manado teacher in a local paper. It's an exposition (eksposisi).
        Look for the thesis, the arguments (Pertama, Kedua) and the solution (solusi).
    examples:
      - text: Saya berpendapat bahwa larangan kantong plastik adalah kebijakan yang tepat untuk Manado.
        ar_eg: أنا شايفة إن منع الأكياس البلاستيك هو القرار الصح لمانادو.
        ar: أرى أن حظر الأكياس البلاستيكية هو السياسة الصائبة لمانادو.
        en: I believe a plastic-bag ban is the right policy for Manado.
      - text: Pertama, plastik sekali pakai sulit didaur ulang. Kedua, banyak sampah plastik masuk ke laut Bunaken dan merusak terumbu karang.
        ar_eg: أولًا، البلاستيك اللي بيتستعمل مرة واحدة صعب يتعاد تدويره. تانيًا، زبالة بلاستيك كتير بتوصل لبحر بوناكين وبتبوّظ الشعاب المرجانية.
        ar: أولًا، يصعب إعادة تدوير البلاستيك أحادي الاستخدام. ثانيًا، تصل نفايات بلاستيكية كثيرة إلى بحر بوناكين وتُتلف الشعاب المرجانية.
        en: First, single-use plastic is hard to recycle. Second, a lot of plastic waste ends up in the sea at Bunaken and damages the coral reefs.
      - text: Memang, sebagian pedagang menolak. Namun, solusinya mudah, yaitu kita membawa tas belanja sendiri.
        ar_eg: صحيح إن بعض التجار معترضين. بس الحل سهل، وهو إننا نجيب شنط الشوبنج بتاعتنا معانا.
        ar: صحيح أن بعض التجار يرفضون، غير أن الحل سهل، وهو أن نحمل حقائب تسوّقنا الخاصة.
        en: Admittedly, some traders are against it. But the solution is easy - we bring our own shopping bags.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: رأي الكاتبة إيه؟
      ar: ما موقف الكاتبة؟
      en: What is the writer's view?
    options:
      - Larangan kantong plastik adalah kebijakan yang tepat.
      - Larangan kantong plastik merugikan semua warga.
      - Kantong plastik mudah didaur ulang.
    answer: 0
    words: [larangan, kantong plastik, berpendapat, tepat, mudah]
    explain:
      ar_eg: الكاتب شايف إن منع الأكياس kebijakan yang tepat = سياسة صح. ماقالش إنها بتضر الكل، وقال إن البلاستيك صعب يتعاد تدويره.
      ar: يرى الكاتب أن المنع kebijakan yang tepat = سياسة صائبة، ولم يقل إنها تضر الجميع، بل إن البلاستيك صعب التدوير.
      en: The writer calls the ban kebijakan yang tepat, the right policy. The writer doesn't say it harms everyone, and notes that plastic is hard to recycle.
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مين المعترض على المنع، على حسب الكاتبة؟
      ar: من يعارض الحظر بحسب الكاتبة؟
      en: According to the writer, who is against the ban?
    options: [Para penyelam, Sebagian pedagang, Pemerintah kota]
    answer: 1
    explain:
      ar_eg: النص بيقول sebagian pedagang menolak = شوية تجار رافضين. الغطاسين والحكومة مش معترضين.
      ar: يقول النص sebagian pedagang menolak = بعض التجار يرفضون، لا الغواصون ولا حكومة المدينة.
      en: "The text says sebagian pedagang menolak: some traders object. Not divers or the city government."
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الكاتبة بتقترح حل إيه؟
      ar: ما الحلّ الذي تقترحه الكاتبة؟
      en: What solution does the writer propose?
    options:
      - Menutup pasar tradisional
      - Membeli kantong plastik yang lebih kuat
      - Membawa tas belanja sendiri
    answer: 2
    words: [solusi]
    explain:
      ar_eg: "الحل اللي اقترحه: نجيب شنطنا (membawa tas belanja sendiri). قفل السوق وأكياس أقوى مش في النص."
      ar: "الحل المقترح: أن نحمل أكياسنا (membawa tas belanja sendiri)، لا إغلاق السوق ولا أكياس أقوى."
      en: The proposed solution is bringing our own bags (membawa tas belanja sendiri), not closing markets or stronger plastic bags.
  - id: e04
    type: listen
    text: Plastik sekali pakai sulit didaur ulang.
    options:
      - Plastik sekali pakai mudah didaur ulang.
      - Plastik sekali pakai sulit didaur ulang.
      - Plastik sekali pakai sulit dibuang.
    answer: 1
    meaning:
      ar_eg: البلاستيك اللي بيتستعمل مرة واحدة صعب يتعاد تدويره.
      ar: يصعب إعادة تدوير البلاستيك أحادي الاستخدام.
      en: Single-use plastic is hard to recycle.
    words: [sekali pakai, mendaur ulang, mudah]
  - id: e05
    type: match_pairs
    pairs:
      - text: larangan
        ar_eg: منع
        ar: حظر
        en: ban
      - text: sekali pakai
        ar_eg: بيتستعمل مرة واحدة
        ar: أحادي الاستخدام
        en: single-use
      - text: mendaur ulang
        ar_eg: يعيد التدوير
        ar: يعيد التدوير
        en: recycle
      - text: solusi
        ar_eg: حل
        ar: حلّ
        en: solution
      - text: kesadaran
        ar_eg: وعي
        ar: وعي
        en: awareness
    words: [larangan, sekali pakai, mendaur ulang, solusi, kesadaran]
  - id: e06
    type: fill_blank
    sentence: Banyak sampah plastik masuk ke laut. ___, terumbu karang rusak.
    meaning:
      ar_eg: زبالة بلاستيك كتير بتوصل للبحر. والنتيجة إن الشعاب المرجانية بتبوظ.
      ar: تصل نفايات بلاستيكية كثيرة إلى البحر، فتتلف الشعاب المرجانية.
      en: A lot of plastic waste ends up in the sea. As a result, the coral reefs are damaged.
    options: [Berkat itu, Akibatnya, Namun]
    answers: [Akibatnya]
    words: [akibatnya]
    explain:
      ar_eg: akibatnya = ونتيجة لكده، والبلاستيك سبب ضرر الشعاب. berkat itu للحاجات الكويسة، وnamun = لكن.
      ar: akibatnya = ونتيجةً لذلك، فالبلاستيك سبب تلف الشعاب. أما berkat itu فللخير، وnamun = لكن.
      en: "akibatnya means \"as a result\": the plastic damages the reefs. berkat itu is for good outcomes, and namun means \"however\"."
  - id: e07
    type: build_sentence
    source:
      ar_eg: أنا شايف إن السياسة دي صح.
      ar: أرى أن هذه السياسة صائبة.
      en: I believe this policy is the right one.
    answer: Saya berpendapat bahwa kebijakan ini sudah tepat.
    distractors: [solusi, menolak]
    words: [berpendapat, kebijakan, tepat]
    explain:
      ar_eg: saya berpendapat bahwa = رأيي إن، وsudah tepat = صح. solusi = حل، وmenolak = يرفض، ومش في الجملة.
      ar: saya berpendapat bahwa = أرى أنّ، وsudah tepat = صائبة. أما solusi فالحل، وmenolak يرفض، وليسا في الجملة.
      en: saya berpendapat bahwa means "I believe that", and sudah tepat "is right". solusi and menolak (reject) aren't in the sentence.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الحل سهل، وهو إننا نجيب شنط الشوبنج بتاعتنا.
      ar: الحل سهل، وهو أن نحمل حقائب تسوّقنا الخاصة.
      en: The solution is easy - we bring our own shopping bags.
    answers:
      - Solusinya mudah, yaitu kita membawa tas belanja sendiri.
      - Solusinya mudah, kita membawa tas belanja sendiri.
      - "Solusinya mudah: kita membawa tas belanja sendiri."
      - Solusinya mudah, yaitu membawa tas belanja sendiri.
      - "Solusinya mudah: membawa tas belanja sendiri."
      - Solusinya gampang, yaitu kita membawa tas belanja sendiri.
      - Solusinya mudah, yaitu kita bawa tas belanja sendiri.
    words: [solusi, mudah]
  - id: e09
    type: multiple_choice
    question: Menurut saya, larangan ini kebijakan yang tepat.
    question_meaning:
      ar_eg: الكاتب موافق على المنع؟
      ar: هل يوافق الكاتب على المنع؟
      en: Does the writer agree with the ban?
    options: ['Ya, dia setuju.', 'Tidak, dia tidak setuju.', 'Dia belum tahu.']
    answer: 0
    explain:
      ar_eg: tepat = صح / في محلّه.
      ar: tepat = صائب.
      en: tepat = right, appropriate.
    words: [tepat, larangan]
dialogue:
  title: Membahas opini
  lines:
    - speaker: Bu Grace
      text: Mohamed, kamu sudah baca opini warga di koran hari ini?
      ar_eg: يا Mohamed، قريت مقال الرأي في جرنال النهارده؟
      ar: يا Mohamed، هل قرأت مقال الرأي في صحيفة اليوم؟
      en: Mohamed, have you read the opinion piece in today's paper?
    - speaker: Mohamed
      text: Sudah, Bu. Penulisnya mendukung larangan kantong plastik.
      ar_eg: قريته يا أستاذة. الكاتبة مؤيدة منع الأكياس البلاستيك.
      ar: نعم يا أستاذة. الكاتبة تؤيد حظر الأكياس البلاستيكية.
      en: Yes, ma'am. The writer supports the plastic-bag ban.
    - speaker: Bu Grace
      text: Argumennya kuat?
      ar_eg: حججها قوية؟
      ar: هل حججها قوية؟
      en: Are her arguments strong?
    - speaker: Mohamed
      text: Cukup kuat. Dia juga menulis bahwa sebagian pedagang menolak, lalu memberi solusi.
      ar_eg: قوية لحد كبير. وكمان كتبت إن بعض التجار معترضين، وبعدين قدّمت حل.
      ar: قوية إلى حدّ ما. وكتبت أيضًا أن بعض التجار يرفضون، ثم قدّمت حلًّا.
      en: Fairly strong. She also writes that some traders are against it, and then offers a solution.
    - speaker: Bu Grace
      text: Bagus. Eksposisi yang baik memang melihat dua sisi.
      ar_eg: حلو. النص العرضي الكويس فعلًا بيشوف الناحيتين.
      ar: جميل. النص العرضي الجيد ينظر فعلًا إلى الجانبين.
      en: Good. A good exposition does look at both sides.
new_words:
