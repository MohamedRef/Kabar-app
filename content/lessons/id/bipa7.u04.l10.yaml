schema: kabar.lesson/v1
id: bipa7.u04.l10
language: id
title: Sapaan dan cengkok
can_do:
  ar_eg: تختار طريقة المناداة المناسبة وتوصف نطق ولحن اللهجات.
  ar: أن تختار صيغة النداء المناسبة وتصف نطق اللهجات ونبرتها.
  en: Choose the right form of address and describe how dialects sound.
slides:
  - title: Cara memanggil, cara berbunyi
    body:
      ar_eg: |
        sapaan = اللقب اللي بتنادي بيه: Bapak, Ibu, Kakak, Om, Tante، وفي بابوا Kaka وMama.
        فيه ألقاب honorifik (للتبجيل) زي Yang Mulia. اللغات اللي ليها tingkat tutur (مستويات كلام) زي الجاوي، الكلمة نفسها بتتغيّر حسب اللي بتكلّمه.
        kesantunan = الأدب في الكلام.
        وفي النطق: كل لهجة ليها cengkok (لحن مميّز). صوت sengau = خنّاف. pelafalan = طريقة النطق.
        prokem = عامية شباب جاكرتا في السبعينات والتمانينات: bokap (أبويا)، nyokap (أمّي).
        - في الكلام: gimana = bagaimana.
      ar: |
        sapaan = لقب المخاطبة: Bapak وIbu وKakak وOm وTante، وفي بابوا Kaka وMama.
        وهناك ألقاب honorifik (تشريفية) مثل Yang Mulia. وفي اللغات ذات tingkat tutur (مستويات الخطاب) كالجاوية تتبدّل الكلمة نفسها بحسب المخاطَب.
        kesantunan = التأدّب في الكلام.
        وفي النطق: لكلّ لهجة cengkok (نبرة لحنية). صوت sengau = أغنّ. pelafalan = طريقة النطق.
        prokem = عامية شباب جاكرتا في السبعينيات والثمانينيات: bokap (أبي)، nyokap (أمّي).
        - في الكلام اليومي: gimana = bagaimana.
      en: |
        sapaan = a form of address: Bapak, Ibu, Kakak, Om, Tante; in Papua also Kaka and Mama.
        Some titles are honorifik, like Yang Mulia. In languages with tingkat tutur (speech levels) such as Javanese, the word itself changes with the listener.
        kesantunan = politeness in speech.
        And sound: every dialect has its cengkok (lilt). A sengau voice is nasal. pelafalan = pronunciation.
        prokem = Jakarta youth slang of the 1970s–80s: bokap (my dad), nyokap (my mum).
        - In speech: gimana = bagaimana.
    examples:
      - text: Di Papua, sapaan "Mama" dipakai untuk perempuan yang lebih tua.
        ar_eg: في بابوا، كلمة «ماما» بتتقال لأي ست أكبر منك.
        ar: في بابوا تُستعمل صيغة «Mama» لمخاطبة المرأة الأكبر سنًّا.
        en: In Papua, 'Mama' is used to address older women.
      - text: Cengkok orang Makassar mudah dikenali.
        ar_eg: لحن كلام أهل ماكاسار سهل تعرفه.
        ar: نبرة أهل ماكاسار سهلة التمييز.
        en: The Makassar lilt is easy to recognise.
      - text: '"Bokap" adalah kata prokem untuk ayah.'
        ar_eg: «بوكاب» كلمة عامية قديمة معناها أبويا.
        ar: «bokap» كلمة عامية قديمة تعني الأب.
        en: '''Bokap'' is prokem slang for father.'
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sapaan
        ar_eg: طريقة المناداة / اللقب اللي بتنادي بيه
        ar: صيغة النداء، لقب المخاطبة
        en: form of address
      - text: honorifik
        ar_eg: تشريفي / للتبجيل
        ar: تشريفيّ
        en: honorific
      - text: tingkat tutur
        ar_eg: مستوى الكلام (رسمي أو عادي)
        ar: مستوى الخطاب
        en: speech level
      - text: kesantunan
        ar_eg: أدب في الكلام
        ar: اللباقة، التأدّب
        en: politeness
    words: [sapaan, honorifik, tingkat tutur, kesantunan]
  - id: e02
    type: match_pairs
    pairs:
      - text: cengkok
        ar_eg: لحن الكلام / النغمة المميّزة
        ar: نبرة مميّزة، تلوين صوتي
        en: lilt, melodic accent
      - text: sengau
        ar_eg: خنّاف / من مناخيره
        ar: أغنّ، أخنّ
        en: nasal (of a voice)
      - text: pelafalan
        ar_eg: طريقة النطق
        ar: النطق، اللفظ
        en: pronunciation
      - text: prokem
        ar_eg: عامية شباب جاكرتا القديمة
        ar: عامية شباب جاكرتا القديمة
        en: old Jakarta youth slang
    words: [cengkok, sengau, pelafalan, prokem]
  - id: e03
    type: listen
    text: Suaranya agak sengau karena ia sedang pilek.
    question:
      ar_eg: صوته عامل إزاي؟
      ar: كيف صوته؟
      en: What's his voice like?
    options: [خنّاف, عالي, مبحوح]
    answer: 0
    meaning:
      ar_eg: صوته خنّاف شوية علشان عنده برد.
      ar: صوته أغنّ قليلًا لأنه مصاب بالزكام.
      en: His voice is a bit nasal because he has a cold.
    words: [sengau]
  - id: e04
    type: fill_blank
    sentence: Dalam bahasa Jawa, ___ krama dipakai kepada orang tua.
    meaning:
      ar_eg: في الجاوي، ___ الكراما بيتقال للكبار.
      ar: في الجاوية يُستعمل ___ «كراما» مع الكبار.
      en: In Javanese, the krama ___ is used with elders.
    options: [tingkat tutur, prokem, cengkok]
    answers: [tingkat tutur]
    words: [tingkat tutur, prokem, cengkok]
    explain:
      ar_eg: tingkat tutur = مستوى الكلام (ngoko/krama). prokem = عامية شبابية، وcengkok = طريقة النغم.
      ar: tingkat tutur = مستوى الكلام كالـ krama. أما prokem فعامية شبابية وcengkok نغمة الأداء.
      en: tingkat tutur = speech level, like krama.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «Yang Mulia» نوعه إيه؟
      ar: ما نوع «Yang Mulia»؟
      en: What kind of term is 'Yang Mulia'?
    options: [Kata prokem., Sapaan honorifik untuk raja atau hakim., Pelafalan yang salah.]
    answer: 1
    explain:
      ar_eg: Yang Mulia لقب تبجيل للملك أو القاضي.
      ar: Yang Mulia لقب تشريفي للملك أو القاضي.
      en: Yang Mulia is an honorific for a king or judge.
    words: [honorifik, sapaan, prokem]
  - id: e06
    type: fill_blank
    sentence: Guru itu memperbaiki ___ huruf "r" saya.
    meaning:
      ar_eg: المدرّس صحّح ___ حرف الـ «ر» عندي.
      ar: صحّح المعلّم ___ حرف «r» عندي.
      en: The teacher corrected my ___ of the letter 'r'.
    options: [pelafalan, kesantunan, sengau]
    answers: [pelafalan]
    words: [pelafalan, kesantunan, sengau]
    explain:
      ar_eg: pelafalan = نطق. kesantunan = أدب/لباقة، وsengau = خنّة.
      ar: pelafalan = النطق. أما kesantunan فلباقة وsengau غنّة.
      en: pelafalan = pronunciation. kesantunan is politeness, sengau nasal.
  - id: e07
    type: build_sentence
    source:
      ar_eg: الأدب في الكلام مهم في كل الثقافات.
      ar: التأدّب في الكلام مهمّ في كلّ الثقافات.
      en: Politeness matters in every culture.
    answer: Kesantunan berbahasa penting di semua budaya.
    distractors: [cengkok, honorifik]
    words: [kesantunan]
    explain:
      ar_eg: Kesantunan berbahasa = أدب الكلام. cengkok وhonorifik مش داخلين.
      ar: Kesantunan berbahasa = آداب الكلام.
      en: Kesantunan berbahasa = politeness in speech.
  - id: e08
    type: translate
    direction: from_target
    source_text: Sapaan yang salah bisa terdengar tidak sopan.
    answers_meaning:
      ar_eg: [لو ناديت حد غلط ممكن يبان إنك قليل الأدب, اللقب الغلط ممكن يبان قلّة ذوق]
      ar: [قد تبدو صيغة النداء الخاطئة غير مهذّبة, يمكن أن يُفهم لقب المخاطبة الخاطئ على أنه قلّة أدب]
      en: [The wrong form of address can sound rude, Addressing someone wrongly can come across as impolite]
    words: [sapaan]
  - id: e09
    type: speaking
    text: Cengkok dan pelafalannya khas Manado.
    meaning:
      ar_eg: لحن كلامه ونطقه منادوي أصلي.
      ar: نبرته ونطقه من خصائص مانادو.
      en: His lilt and pronunciation are typical of Manado.
    words: [cengkok, pelafalan]
  - id: e10
    type: multiple_choice
    question: Kata "nyokap" berasal dari ragam apa?
    options: [Bahasa prokem Jakarta., Tingkat tutur krama., Sapaan honorifik.]
    answer: 0
    explain:
      ar_eg: nyokap كلمة من عامية جاكرتا القديمة.
      ar: nyokap من عامية جاكرتا القديمة.
      en: nyokap comes from old Jakarta slang.
    words: [prokem, tingkat tutur, honorifik, kesantunan, sengau]
dialogue:
  lines:
    - speaker: Kaka Yohana
      text: Mohamed, di radio kau panggil pendengar tua dengan "Mama" atau "Bapa", ya.
      ar_eg: يا محمد، في الراديو نادي المستمعين الكبار «ماما» أو «بابا».
      ar: يا محمد، نادِ المستمعين الكبار في الإذاعة بـ«Mama» أو «Bapa».
      en: Mohamed, on air call older listeners 'Mama' or 'Bapa'.
    - speaker: Mohamed
      text: Baik, Kaka. Sapaan itu terdengar hangat.
      ar_eg: حاضر يا كاكا. الألقاب دي دافية.
      ar: حسنًا يا كاكا، هذه الصيغة دافئة.
      en: OK, Kaka. Those forms of address sound warm.
    - speaker: Kaka Yohana
      text: Dan jangan pakai prokem Jakarta. Pendengar kita bisa bingung.
      ar_eg: وما تستعملش عامية جاكرتا. مستمعينا ممكن يتلخبطوا.
      ar: ولا تستعمل عامية جاكرتا، فقد يرتبك مستمعونا.
      en: And don't use Jakarta slang. Our listeners might get confused.
    - speaker: Mohamed
      text: Gimana dengan pelafalan saya? Masih ada cengkok Arab?
      ar_eg: طب ونطقي؟ لسه فيه لحن عربي؟
      ar: وماذا عن نطقي؟ أما زالت فيه نبرة عربية؟
      en: What about my pronunciation? Still an Arabic lilt?
    - speaker: Kaka Yohana
      text: Sedikit, tapi justru enak didengar. Yang penting kesantunannya.
      ar_eg: شوية، بس بالعكس حلو في الودن. المهم الأدب.
      ar: قليلًا، لكنها مستحبّة على السمع، والمهمّ التأدّب.
      en: A little, but it's actually nice to hear. Politeness is what matters.
