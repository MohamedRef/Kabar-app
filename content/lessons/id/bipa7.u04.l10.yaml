schema: kabar.lesson/v1
id: bipa7.u04.l10
language: id
title: Ulangan Unit 4
can_do:
  ar_eg: تعرف المتكلم من أنهي منطقة وتكتب عن لهجته.
  ar: أن تعرف منطقة المتكلّم وتكتب عن لهجته.
  en: Identify a speaker's region and write about their dialect.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kitong
        ar_eg: إحنا (بابوا)
        ar: نحن (ملايو بابوا)
        en: we (Papuan Malay)
      - text: dialek
        ar_eg: لهجة
        ar: لهجة
        en: dialect
      - text: intonasi
        ar_eg: تنغيم
        ar: تنغيم
        en: intonation
      - text: penanda
        ar_eg: علامة
        ar: علامة
        en: marker
      - text: petunjuk
        ar_eg: دليل / قرينة
        ar: قرينة
        en: clue, hint
    words: [kitong, dialek, intonasi, penanda, petunjuk]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Gue nggak tahu, lu tahu?» المتكلم غالبًا منين؟
      ar: «Gue nggak tahu, lu tahu?» من أين المتكلّم غالبًا؟
      en: '"Gue nggak tahu, lu tahu?" Where is the speaker probably from?'
    options: [Papua, Jakarta, Medan]
    answer: 1
    words: [gue, menebak]
  - id: e03
    type: fill_blank
    sentence: Sa ___ pi pasar tadi pagi.
    meaning:
      ar_eg: أنا رحت السوق خلاص الصبح.
      ar: ذهبتُ إلى السوق صباح اليوم.
      en: I already went to the market this morning.
    options: [su, bah, tra]
    answers: [su]
    words: [su, pi, sa, bah, tra]
  - id: e04
    type: listen
    text: Dari aksennya, saya menebak daerah asalnya Sumatra Utara.
    question:
      ar_eg: المتكلم خمّن إيه؟
      ar: ماذا خمّن المتحدّث؟
      en: What did the speaker guess?
    options:
      - إن الشخص أصله من شمال سومطرة.
      - إن الشخص من بابوا.
      - إن الشخص مالوش لكنة.
    answer: 0
    words: [aksen, daerah asal]
  - id: e05
    type: build_sentence
    source:
      ar_eg: إنت رايح فين؟ (بلهجة بابوا)
      ar: إلى أين تذهب؟ (بملايو بابوا)
      en: Where are you going? (Papuan Malay)
    answer: Ko mau pi mana?
    distractors: [gue, bah]
    words: [ko, pi]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: في تقرير لهجة، جزء «sebaran» بيتكلم عن إيه؟
      ar: عمَّ يتحدّث جزء «sebaran» في تقرير اللهجة؟
      en: In a dialect report, what does the "sebaran" part cover?
    options:
      - الضماير.
      - النغمة.
      - الأماكن اللي اللهجة منتشرة فيها.
    answer: 2
    words: [sebaran, kata ganti]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كل منطقة ليها شكل من اللغة بسمة مميزة.
      ar: لكلّ منطقة ضرب من اللغة له سمته المميّزة.
      en: Every region has a variety with its own distinctive feature.
    answers:
      - Setiap wilayah punya ragam bahasa dengan ciri khasnya sendiri.
      - Setiap wilayah memiliki ragam bahasa dengan ciri khasnya sendiri.
      - Tiap wilayah punya ragam bahasa dengan ciri khas sendiri.
    words: [wilayah, ragam, ciri khas]
  - id: e08
    type: speaking
    text: Saya bisa membedakan variasi dialek, tetapi saya tetap berbicara netral.
    meaning:
      ar_eg: أقدر أفرّق بين تنوّع اللهجات، بس بفضل أتكلم محايد.
      ar: أستطيع التمييز بين تنوّع اللهجات، لكنّني أتكلّم بلغة محايدة.
      en: I can tell dialect variations apart, but I still speak neutrally.
    words: [membedakan, variasi, netral]
  - id: e09
    type: dictation
    text: Bah, kitong su sampai di puncak!
    meaning:
      ar_eg: ياه، إحنا وصلنا القمّة خلاص!
      ar: يا للعجب، وصلنا إلى القمّة!
      en: Wow, we've made it to the top!
    words: [bah, kitong, su]
  - id: e10
    type: translate
    direction: from_target
    source_text: Kata ganti dan intonasi adalah penanda dialek yang paling mudah didengar.
    answers_meaning:
      ar_eg:
        - الضماير والتنغيم هما أسهل علامات اللهجة اللي تتسمع.
        - أسهل حاجة تسمعها في اللهجة هي الضماير والنغمة.
      ar:
        - الضمائر والتنغيم أسهل علامات اللهجة سماعًا.
        - أيسر ما يُسمع من علامات اللهجة ضمائرها وتنغيمها.
      en:
        - Pronouns and intonation are the easiest dialect markers to hear.
        - The easiest dialect markers to pick up are pronouns and intonation.
    words: [kata ganti, intonasi, penanda]
  - id: e11
    type: match_pairs
    pairs:
      - text: beta
        ar_eg: أنا (أمبون)
        ar: أنا (أمبون)
        en: I (Ambon)
      - text: ngana
        ar_eg: إنت (مانادو)
        ar: أنت (مانادو)
        en: you (Manado)
      - text: dorang
        ar_eg: هم (مانادو)
        ar: هم (مانادو)
        en: they (Manado)
      - text: abjad jari
        ar_eg: الحروف بالصوابع
        ar: التهجئة بالأصابع
        en: fingerspelling
      - text: kedengarannya
        ar_eg: من صوته شكله
        ar: يبدو من الصوت
        en: it sounds like
    words: [beta, ngana, dorang, abjad jari, kedengarannya]
  - id: e12
    type: multiple_choice
    question_meaning:
      ar_eg: '«Katong seng pi.» المتكلّم منين، والجملة معناها إيه؟'
      ar: '«Katong seng pi.» من أين المتكلّم، وما معنى الجملة؟'
      en: '«Katong seng pi.» Where is the speaker from, and what does it mean?'
    options:
      - مانادو، «هم مش جايين».
      - أمبون، «إحنا مش رايحين».
      - جاكرتا، «أنا رايح».
    answer: 1
    explain:
      ar_eg: katong (إحنا) وseng (مش) دلايل أمبون.
      ar: katong (نحن) وseng (لا) من قرائن أمبون.
      en: katong (we) and seng (not) are Ambon clues.
    words: [katong, seng, petunjuk]
dialogue:
  title: Turun dari Piaynemo
  lines:
    - speaker: Om Nus
      text: Ko su pintar, e. Sekarang ko bisa tebak orang dari mana saja.
      ar_eg: إنت بقيت شاطر أهو. دلوقتي تقدر تخمّن الناس منين بالظبط.
      ar: صرت ماهرًا، تستطيع الآن تخمين منشأ أيّ أحد.
      en: You've got clever, eh. Now you can guess where anyone's from.
    - speaker: Mohamed
      text: Belum semua, Om. Tapi sa tra takut lagi dengar logat yang beda.
      ar_eg: لسه مش كله يا عمّ. بس أنا مابقتش أخاف أسمع لهجة مختلفة.
      ar: ليس كلّهم بعد يا عمّ، لكنّني لم أعد أخشى سماع لهجة مختلفة.
      en: Not everyone yet, Om. But I'm not scared of hearing different accents any more.
    - speaker: Om Nus
      text: Hahaha, ko pakai "sa" dan "tra"! Besok ko ke Wayag?
      ar_eg: هههه، إنت قلت «sa» و«tra»! بكرة رايح وايّاج؟
      ar: هاها، استعملتَ «sa» و«tra»! هل تذهب غدًا إلى وايّاغ؟
      en: Ha, you used "sa" and "tra"! Off to Wayag tomorrow?
    - speaker: Mohamed
      text: Iya, Om. Di sana saya mau belajar sejarah Indonesia.
      ar_eg: أيوه يا عمّ. هناك عايز أتعلّم تاريخ إندونيسيا.
      ar: نعم يا عمّ، أريد هناك أن أتعلّم تاريخ إندونيسيا.
      en: Yes, Om. There I want to learn Indonesian history.
souvenir:
  id: bipa7.u04.souvenir
  title: Melayu Papua
  note:
    ar_eg: ملايو بابوا هي اللغة اللي بيتفاهم بيها الناس في بابوا بين الشعوب المختلفة. بيقولوا sa بدل saya، وko بدل kamu، وkitong يعني إحنا، وdong يعني هم، وtra يعني مش، وsu يعني خلاص، وpi يعني يروح. وفي جاكرتا هتسمع gue وlu، وفي ميدان bah وkali، وعند الجاويين kok وto. افهمهم كلهم، واتكلم إنت بالإندونيسي المحايد، إلا لو أهل المكان نفسهم عزموك تتكلم زيهم.
    ar: ملايو بابوا لغة التفاهم بين شعوب بابوا المختلفة. يقولون sa بدل saya، وko بدل kamu، وkitong بمعنى نحن، وdong بمعنى هم، وtra بمعنى لا، وsu بمعنى قد، وpi بمعنى يذهب. وفي جاكرتا تسمع gue وlu، وفي ميدان bah وkali، وعند الجاويين kok وto. افهمها كلّها، وتكلّم أنت بالإندونيسية المحايدة، إلّا إن دعاك أهل المكان أنفسهم إلى مجاراتهم.
    en: Papuan Malay is the language Papua's many peoples use to talk to one another. People say sa for saya, ko for kamu, kitong for "we", dong for "they", tra for "not", su for "already" and pi for "go". In Jakarta you'll hear gue and lu, in Medan bah and kali, and among Javanese speakers kok and to. Understand them all, and speak neutral Indonesian yourself, unless the locals themselves invite you to talk like them.
