schema: kabar.lesson/v1
id: bipa6.u07.l09
language: id
title: Syarat dan ketentuan
can_do:
  ar_eg: تقرا الشروط والأحكام في تطبيق أو عقد وتلاقي النقط المهمة قبل ما توافق.
  ar: أن تقرأ الشروط والأحكام في تطبيق أو عقد وتلتقط النقاط المهمّة قبل الموافقة.
  en: Read the terms and conditions of an app or contract and spot what matters before agreeing.
slides:
  - title: Sebelum mengklik "Setuju"
    body:
      ar_eg: |
        كل تطبيق بيطلب منك menyetujui (توافق على) الـ syarat dan ketentuan (الشروط والأحكام). اقرا وانت بتدوّر على:
        - pasal عن الـ denda أو الإلغاء
        - كلمات زي wajib وdilarang وberhak
        - dalam hal … = في حالة …: Dalam hal pembatalan, uang muka tidak dikembalikan.
        - البيانات الشخصية: مين هيشوفها؟
        نصيحة: لو مش فاهم، اسأل قبل ما تدوس Setuju.
      ar: |
        يطلب منك كلّ تطبيق أن menyetujui (توافق على) الـ syarat dan ketentuan (الشروط والأحكام). فاقرأ باحثًا عن:
        - pasal عن الـ denda أو الإلغاء
        - كلمات مثل wajib وdilarang وberhak
        - dalam hal … = في حال …: Dalam hal pembatalan, uang muka tidak dikembalikan.
        - البيانات الشخصية: من سيطّلع عليها؟
        ونصيحة: إن لم تفهم فاسأل قبل أن تضغط Setuju.
      en: |
        Every app asks you to menyetujui (agree to) its syarat dan ketentuan (terms and conditions). Read looking for:
        - a pasal on denda or cancellation
        - words like wajib, dilarang and berhak
        - dalam hal … = in the event of …: Dalam hal pembatalan, uang muka tidak dikembalikan.
        - personal data: who gets to see it?
        Tip: if you don't understand, ask before you tap Setuju.
exercises:
  - id: e01
    type: listen
    text: Dengan mengklik tombol ini, Anda menyetujui syarat dan ketentuan kami.
    question:
      ar_eg: لو دوست على الزرار، إيه اللي بيحصل؟
      ar: ماذا يحدث إذا ضغطت الزرّ؟
      en: What happens if you tap the button?
    options:
      - التطبيق بيتمسح.
      - بتوافق على الشروط والأحكام.
      - بتدفع غرامة.
    answer: 1
    words: [menyetujui, syarat dan ketentuan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Dalam hal pembatalan, uang muka tidak dikembalikan.» يعني إيه؟
      ar: ما معنى «Dalam hal pembatalan, uang muka tidak dikembalikan.»؟
      en: What does "Dalam hal pembatalan, uang muka tidak dikembalikan." mean?
    options:
      - العربون بيرجع دايمًا.
      - مافيش عربون.
      - لو لغيت، العربون مش هيرجع.
    answer: 2
    words: [dalam hal]
  - id: e03
    type: fill_blank
    sentence: Saya belum ___ kontrak itu karena pasal tentang denda tidak jelas.
    meaning:
      ar_eg: لسه ماوافقتش على العقد عشان البند بتاع الغرامة مش واضح.
      ar: لم أوافق على العقد بعد، لأنّ البند المتعلّق بالغرامة غير واضح.
      en: I haven't agreed to the contract yet because the clause on fines is unclear.
    options: [menyetujui, mematuhi, melindungi]
    answers: [menyetujui]
    words: [menyetujui, denda]
  - id: e04
    type: build_sentence
    source:
      ar_eg: اقرا الشروط والأحكام قبل ما تسجّل.
      ar: اقرأ الشروط والأحكام قبل التسجيل.
      en: Read the terms and conditions before you sign up.
    answer: Bacalah syarat dan ketentuan sebelum mendaftar.
    distractors: [menyetujui, pasal]
    words: [syarat dan ketentuan]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المستخدم من حقه يمسح بياناته.
      ar: يحقّ للمستخدم حذف بياناته.
      en: The user has the right to delete their data.
    answers:
      - Pengguna berhak menghapus datanya.
      - Pengguna berhak menghapus data mereka.
      - Pengguna berhak untuk menghapus datanya.
    words: [berhak]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي بند لازم تخاف منه؟
      ar: أيّ بند ينبغي الحذر منه؟
      en: Which clause should worry you?
    options:
      - Data Anda dapat dibagikan kepada pihak ketiga.
      - Anda berhak membatalkan dalam 7 hari.
      - Layanan ini gratis untuk pelajar.
    answer: 0
    explain:
      ar_eg: pihak ketiga = طرف تالت. بياناتك ممكن تروح لشركات تانية.
      ar: pihak ketiga = طرف ثالث، فقد تصل بياناتك إلى شركات أخرى.
      en: pihak ketiga = third party; your data could go to other companies.
    words: [syarat dan ketentuan]
  - id: e07
    type: speaking
    text: Maaf, sebelum saya menyetujui, boleh saya bertanya tentang pasal lima?
    meaning:
      ar_eg: لو سمحت، قبل ما أوافق، ممكن أسأل عن البند خمسة؟
      ar: عذرًا، قبل أن أوافق، أيمكنني السؤال عن المادّة الخامسة؟
      en: Excuse me, before I agree, may I ask about clause five?
    words: [menyetujui, pasal]
  - id: e08
    type: dictation
    text: Syarat dan ketentuan berlaku sejak tanggal pendaftaran.
    meaning:
      ar_eg: الشروط والأحكام سارية من يوم التسجيل.
      ar: تسري الشروط والأحكام منذ تاريخ التسجيل.
      en: The terms and conditions apply from the date of registration.
    words: [syarat dan ketentuan, berlaku]
  - id: e09
    type: fill_blank
    sentence: Menjaga kata sandi adalah ___ pengguna.
    meaning:
      ar_eg: المحافظة على كلمة السر واجب على المستخدم.
      ar: حفظ كلمة المرور واجب على المستخدم.
      en: Keeping the password safe is the user's duty.
    options: [kewajiban, hak, denda]
    answers: [kewajiban]
    words: [kewajiban]
  - id: e10
    type: speaking
    text: Saya tidak menyetujui pasal ini, karena data saya akan dibagikan.
    meaning:
      ar_eg: أنا مش موافق على البند ده، عشان بياناتي هتتوزّع.
      ar: لا أوافق على هذا البند، لأنّ بياناتي ستُشارَك.
      en: I don't agree to this clause, because my data will be shared.
    words: [menyetujui, pasal]
dialogue:
  title: Aplikasi sewa motor
  lines:
    - speaker: Dimas
      text: Mohamed, cepat klik "Setuju". Motornya sudah menunggu!
      ar_eg: يا محمد، دوس «موافق» بسرعة. الموتوسيكل مستنينا!
      ar: يا محمد، اضغط «موافق» بسرعة، فالدرّاجة تنتظرنا!
      en: Mohamed, hurry and tap "Agree". The scooter's waiting!
    - speaker: Mohamed
      text: Sebentar. Saya baca syarat dan ketentuannya dulu.
      ar_eg: ثانية. هقرا الشروط والأحكام الأول.
      ar: لحظة، سأقرأ الشروط والأحكام أوّلًا.
      en: Hang on. I'm reading the terms and conditions first.
    - speaker: Dimas
      text: Ah, semua orang langsung menyetujui. Tidak ada yang membaca.
      ar_eg: يا عم، الناس كلها بتوافق على طول. محدش بيقرا.
      ar: يا رجل، الجميع يوافقون فورًا، ولا أحد يقرأ.
      en: Oh, everyone just agrees. Nobody reads it.
    - speaker: Mohamed
      text: Lihat pasal tujuh. Dalam hal motor rusak, kita wajib membayar semua biaya perbaikan.
      ar_eg: بص على البند سبعة. في حالة إن الموتوسيكل باظ، إحنا لازم ندفع كل تكاليف التصليح.
      ar: 'انظر إلى المادّة السابعة: في حال تعطّل الدرّاجة، علينا دفع تكاليف الإصلاح كلّها.'
      en: Look at clause seven. If the scooter breaks, we have to pay all the repair costs.
