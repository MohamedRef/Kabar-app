schema: kabar.lesson/v1
id: bipa6.u07.l09
language: id
title: Mahkamah dan hak asasi
can_do:
  ar_eg: تتكلم عن حقوق الإنسان والمحكمة الدستورية والعرايض ضد الظلم.
  ar: أن تتحدث عن حقوق الإنسان والمحكمة الدستورية والعرائض ضد الظلم.
  en: Talk about human rights, the Constitutional Court and petitions against injustice.
slides:
  - title: Mencari keadilan
    body:
      ar_eg: |
        Mahkamah Konstitusi (المحكمة الدستورية) بتراجع القوانين قدام الدستور.
        mahkamah = محكمة عليا (من محكمة). peradilan = القضاء، المحاكم (sistem peradilan). menggugat = يرفع قضية.
        sengketa = نزاع (sengketa tanah). asasi = أساسي (hak asasi manusia = حقوق الإنسان؛ من أساسي).
        ketidakadilan = ظلم (من adil). petisi = عريضة. penegakan = تطبيق، إنفاذ (penegakan hukum = تطبيق القانون).
        - في الشارع: aku / -ku = saya (أنا)، lagi = sedang (بـ (دلوقتي))، sama = dengan / oleh (مع / من)، terus = lalu (وبعدين).
      ar: |
        تراجع Mahkamah Konstitusi (المحكمة الدستورية) القوانين في ضوء الدستور.
        mahkamah = محكمة عليا (من محكمة). peradilan = القضاء (sistem peradilan). menggugat = يقاضي، يرفع دعوى.
        sengketa = نزاع (sengketa tanah). asasi = أساسي (hak asasi manusia = حقوق الإنسان).
        ketidakadilan = ظلم (من adil). petisi = عريضة. penegakan = إنفاذ (penegakan hukum = إنفاذ القانون).
        - في كلام الشارع: aku / -ku = saya (أنا)، lagi = sedang (يفعل الآن)، sama = dengan / oleh (مع / مِن قِبَل)، terus = lalu (ثمّ).
      en: |
        The Mahkamah Konstitusi (Constitutional Court) reviews laws against the constitution.
        mahkamah = high court (from Arabic محكمة). peradilan = judiciary (sistem peradilan). menggugat = to sue.
        sengketa = dispute (sengketa tanah). asasi = basic (hak asasi manusia = human rights; from Arabic أساسي).
        ketidakadilan = injustice (from adil). petisi = petition. penegakan = enforcement (penegakan hukum = law enforcement).
        - On the street: aku / -ku = saya (I), lagi = sedang (in the middle of), sama = dengan / oleh (with, by), terus = lalu (then).
    examples:
      - text: Warga desa menggugat perusahaan itu karena sengketa tanah.
        ar_eg: أهل القرية رفعوا قضية على الشركة دي بسبب نزاع على أرض.
        ar: قاضى أهل القرية الشركة بسبب نزاع على أرض.
        en: The villagers sued the company over a land dispute.
      - text: Mahkamah Konstitusi menguji undang-undang terhadap UUD 1945.
        ar_eg: المحكمة الدستورية بتراجع القوانين قدام دستور 1945.
        ar: تراجع المحكمة الدستورية القوانين في ضوء دستور 1945.
        en: The Constitutional Court tests laws against the 1945 Constitution.
      - text: Ribuan orang menandatangani petisi melawan ketidakadilan.
        ar_eg: آلاف الناس مضوا على عريضة ضد الظلم.
        ar: وقّع الآلاف عريضة ضد الظلم.
        en: Thousands signed a petition against injustice.
