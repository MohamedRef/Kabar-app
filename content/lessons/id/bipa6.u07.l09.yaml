  - id: e03
    type: listen
    text: Hak asasi manusia berlaku untuk semua orang.
    question:
      ar_eg: إيه الحقوق اللي بتنطبق على الكل؟
      ar: ما الحقوق التي تسري على الجميع؟
      en: Which rights apply to everyone?
    options: [حقوق الإنسان, حقوق المستهلك, حقوق العمال]
    answer: 0
    meaning:
      ar_eg: حقوق الإنسان بتنطبق على كل الناس.
      ar: تسري حقوق الإنسان على الجميع.
      en: Human rights apply to everyone.
    words: [asasi]
  - id: e04
    type: fill_blank
    sentence: Kedua desa itu sudah sepuluh tahun dalam ___ tanah.
    meaning:
      ar_eg: القريتين دول في ___ على أرض بقالهم عشر سنين.
      ar: القريتان في ___ على الأرض منذ عشر سنوات.
      en: The two villages have been in a land ___ for ten years.
    options: [sengketa, petisi, asasi]
    answers: [sengketa]
    words: [sengketa, petisi, asasi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الكلمة اللي جاية من كلمة عربية معناها مكان القضاء؟
      ar: ما الكلمة المأخوذة من العربية بمعنى مكان القضاء؟
      en: Which word comes from the Arabic for a court of law?
    options: [penegakan, mahkamah, sengketa]
    answer: 1
    explain:
      ar_eg: 'mahkamah من محكمة: Mahkamah Agung = المحكمة العليا.'
      ar: 'mahkamah من محكمة: Mahkamah Agung = المحكمة العليا.'
      en: 'mahkamah from Arabic محكمة: Mahkamah Agung = Supreme Court.'
    words: [mahkamah, penegakan, sengketa]
  - id: e06
    type: fill_blank
    sentence: Tanpa ___ hukum, aturan hanya tinggal kertas.
    meaning:
      ar_eg: من غير ___ القانون، القواعد بتفضل ورق وبس.
      ar: بلا ___ القانون تبقى القواعد حبرًا على ورق.
      en: Without law ___, rules are just paper.
    options: [penegakan, ketidakadilan, peradilan]
    answers: [penegakan]
    words: [penegakan, ketidakadilan, peradilan]
  - id: e07
    type: multiple_choice
    question: Mereka mengumpulkan sepuluh ribu tanda tangan untuk sebuah ___.
    options: [mahkamah, ketidakadilan, petisi]
    answer: 2
    explain:
      ar_eg: 'لمّوا إمضاءات = عريضة: petisi.'
      ar: 'جمع التواقيع = عريضة: petisi.'
      en: 'Collecting signatures = a petition: petisi.'
    words: [petisi, mahkamah, ketidakadilan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أهل القرية رفعوا قضية على الشركة.
      ar: قاضى أهل القرية الشركة.
      en: The villagers sued the company.
    answer: Warga desa menggugat perusahaan itu.
    distractors: [sengketa, petisi]
    words: [menggugat]
  - id: e09
    type: translate
    direction: from_target
    source_text: Sistem peradilan harus melawan ketidakadilan.
    answers_meaning:
      ar_eg: [نظام القضاء لازم يحارب الظلم, القضاء المفروض يقف ضد الظلم]
      ar: [على النظام القضائي أن يحارب الظلم]
      en: [The judicial system must fight injustice, The justice system has to stand against injustice]
    words: [peradilan, ketidakadilan]
  - id: e10
    type: speaking
    text: Mereka menggugat ke mahkamah demi hak asasi.
    meaning:
      ar_eg: رفعوا قضية للمحكمة عشان حقوق الإنسان.
      ar: رفعوا دعوى إلى المحكمة دفاعًا عن حقوق الإنسان.
      en: They took it to court for human rights.
    words: [menggugat, mahkamah, asasi]
dialogue:
  lines:
    - speaker: Kak Intan
      text: Desa nenekku lagi dalam sengketa sama perusahaan sawit.
      ar_eg: قرية جدتي في نزاع مع شركة نخيل زيت.
      ar: قرية جدّتي في نزاع مع شركة نخيل زيت.
      en: My grandmother's village is in a dispute with a palm-oil company.
    - speaker: Mohamed
      text: Terus warganya ngapain?
      ar_eg: الناس عملوا إيه؟
      ar: ماذا فعل الأهالي؟
      en: What did the villagers do?
    - speaker: Kak Intan
      text: Mereka membuat petisi, lalu menggugat perusahaan itu.
      ar_eg: عملوا عريضة، وبعدين رفعوا قضية على الشركة.
      ar: أعدّوا عريضة ثم قاضوا الشركة.
      en: They made a petition, then sued the company.
    - speaker: Mohamed
      text: Semoga peradilan berpihak pada yang benar.
      ar_eg: ربنا يخلّي القضاء يقف مع الحق.
      ar: عسى أن ينحاز القضاء إلى الحق.
      en: I hope the courts side with what's right.
    - speaker: Kak Intan
      text: Amin. Ketidakadilan seperti ini sering terjadi kalau penegakan hukum lemah.
      ar_eg: آمين. الظلم ده بيحصل كتير لما تطبيق القانون يبقى ضعيف.
      ar: آمين. يكثر هذا الظلم حين يضعف إنفاذ القانون.
      en: Amen. This kind of injustice is common when law enforcement is weak.
