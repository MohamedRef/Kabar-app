schema: kabar.lesson/v1
id: bipa7.u01.l07
language: id
title: Juara umum
can_do:
  ar_eg: تقرا وتكتب خبر عن فريق شباب كسب بطولة كبيرة.
  ar: أن تقرأ وتكتب خبرًا عن فريق شبابي فاز ببطولة كبرى.
  en: Read and write a news item about a young team winning a big competition.
slides:
  - title: Bahasa berita lomba
    body:
      ar_eg: |
        كلام أخبار المسابقات:
        kontingen = البعثة (Kontingen Papua). peraih medali = اللي خد ميدالية. finalis = اللي وصل للنهائي.
        trofi = الكاس. lomba bergengsi = مسابقة مرموقة.
        juara umum = الأول في الترتيب العام، مش في لعبة واحدة.
        menyabet = «خطف» الجايزة، فعل بتحبّه الجرايد. naik podium = يطلع على منصّة التتويج.
        - في الكلام: keren = hebat.
        - lho = تنبيه (على فكرة!). كلمات صغيرة بتدّي الجملة إحساس، ومن غيرها الجملة صح برضه.
      ar: |
        لغة أخبار المسابقات:
        kontingen = البعثة (Kontingen Papua). peraih medali = الحاصل على ميدالية. finalis = المتأهّل إلى النهائي.
        trofi = الكأس. lomba bergengsi = مسابقة مرموقة.
        juara umum = صاحب المركز الأول في الترتيب العام لا في لعبة واحدة.
        menyabet = «انتزع» الجائزة، فعل تحبّه الصحف. naik podium = يصعد إلى منصّة التتويج.
        - في الكلام اليومي: keren = hebat.
        - lho = تنبيه (انتبه!). أدوات صغيرة تلوّن الجملة، والجملة صحيحة بدونها.
      en: |
        Competition-news vocabulary:
        kontingen = the team delegation (Kontingen Papua). peraih medali = medal winner. finalis = finalist.
        trofi = trophy. lomba bergengsi = a prestigious competition.
        juara umum = overall champion, first in the medal table, not in one event.
        menyabet = to "snatch" a prize, a verb newspapers love. naik podium = to step onto the podium.
        - In speech: keren = hebat.
        - lho = you know! (drawing attention). Small particles that add feeling; the sentence is correct without them.
    examples:
      - text: Kontingen sekolah kami menjadi juara umum.
        ar_eg: بعثة مدرستنا طلعت البطل العام.
        ar: أصبحت بعثة مدرستنا صاحبة المركز الأول العام.
        en: Our school's team became overall champion.
      - text: Rina menyabet medali emas dalam lomba bergengsi itu.
        ar_eg: رينا خطفت الميدالية الدهب في المسابقة المرموقة دي.
        ar: انتزعت رينا الميدالية الذهبية في تلك المسابقة المرموقة.
        en: Rina snatched the gold medal at that prestigious competition.
      - text: Tiga finalis terbaik naik ke podium.
        ar_eg: أحسن تلات متأهّلين طلعوا على منصّة التتويج.
        ar: صعد أفضل ثلاثة متأهّلين إلى منصّة التتويج.
        en: The three best finalists stepped onto the podium.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kontingen
        ar_eg: بعثة / وفد رياضي
        ar: بعثة، وفد مشارك
        en: contingent, team delegation
      - text: peraih
        ar_eg: اللي خد / الحاصل على
        ar: الحاصل على، الفائز بـ
        en: winner, recipient (of)
      - text: finalis
        ar_eg: متأهّل للنهائي
        ar: متأهّل إلى النهائي
        en: finalist
      - text: trofi
        ar_eg: كاس / درع
        ar: كأس، درع
        en: trophy
    words: [kontingen, peraih, finalis, trofi]
  - id: e02
    type: match_pairs
    pairs:
      - text: bergengsi
        ar_eg: مرموق / ليه وزن
        ar: مرموق، ذو مكانة
        en: prestigious
      - text: juara umum
        ar_eg: البطل العام (الأول في الترتيب)
        ar: صاحب المركز الأول في الترتيب العام
        en: overall champion
      - text: menyabet
        ar_eg: يخطف / يكسب (جايزة)
        ar: يحصد، ينتزع (جائزة)
        en: to snatch, win (a prize)
      - text: podium
        ar_eg: منصّة التتويج
        ar: منصّة التتويج
        en: (winners') podium
    words: [bergengsi, juara umum, menyabet, podium]
  - id: e03
    type: listen
    text: Kontingen Papua pulang membawa tiga trofi.
    question:
      ar_eg: البعثة رجعت بإيه؟
      ar: بماذا عادت البعثة؟
      en: What did the team bring home?
    options: [تلات كاسات, تلات ميداليات, تلات متأهّلين]
    answer: 0
    meaning:
      ar_eg: بعثة بابوا رجعت ومعاها تلات كاسات.
      ar: عادت بعثة بابوا تحمل ثلاث كؤوس.
      en: The Papua team came home with three trophies.
    words: [kontingen, trofi]
  - id: e04
    type: fill_blank
    sentence: Dia ___ medali emas pada hari terakhir lomba.
    meaning:
      ar_eg: هي ___ الميدالية الدهب في آخر يوم في المسابقة.
      ar: ___ الميدالية الذهبية في اليوم الأخير من المسابقة.
      en: She ___ the gold medal on the last day of the competition.
    options: [menyabet, bergengsi, finalis]
    answers: [menyabet]
    words: [menyabet, bergengsi, finalis]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «juara umum» معناها إيه؟
      ar: ما معنى «juara umum»؟
      en: What does 'juara umum' mean?
    options: [Pemenang satu lomba saja., Peserta yang belum menang., Kontingen yang menyabet medali terbanyak secara keseluruhan.]
    answer: 2
    explain:
      ar_eg: juara umum = الأول في الترتيب العام لكل الألعاب.
      ar: juara umum = الأوّل في الترتيب العام لكل المسابقات.
      en: juara umum = first in the overall table across all events.
    words: [juara umum, kontingen, menyabet]
  - id: e06
    type: fill_blank
    sentence: Ada sepuluh ___ yang masuk babak akhir.
    meaning:
      ar_eg: فيه عشرة ___ دخلوا الدور النهائي.
      ar: هناك عشرة ___ دخلوا الجولة النهائية.
      en: Ten ___ made it to the final round.
    options: [finalis, trofi, peraih]
    answers: [finalis]
    words: [finalis, trofi, peraih]
  - id: e07
    type: build_sentence
    source:
      ar_eg: هي وقفت على المنصّة وهي شايلة الكاس.
      ar: وقفت على المنصّة حاملةً الكأس.
      en: She stood on the podium holding the trophy.
    answer: Dia berdiri di podium sambil memegang trofi.
    distractors: [finalis, peraih]
    words: [podium, trofi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Peraih medali emas itu baru berumur enam belas tahun.
    answers_meaning:
      ar_eg: [اللي خد الميدالية الدهب عنده ستاشر سنة بس, الفايز بالميدالية الدهب عمره ستاشر سنة بس]
      ar: [الحاصل على الميدالية الذهبية عمره ستة عشر عامًا فقط, الفائز بالذهبية لم يتجاوز السادسة عشرة]
      en: [The gold medal winner is only sixteen, The gold medallist is just sixteen years old]
    words: [peraih]
  - id: e09
    type: speaking
    text: Naik podium di lomba yang bergengsi itu mimpi saya.
    meaning:
      ar_eg: إني أطلع على المنصّة في المسابقة المرموقة دي ده حلمي.
      ar: الصعود إلى منصّة التتويج في تلك المسابقة المرموقة حلمي.
      en: Standing on the podium at that prestigious competition is my dream.
    words: [podium, bergengsi]
  - id: e10
    type: multiple_choice
    question: Siapa yang mendapat trofi juara umum?
    options: [Peraih medali terbanyak., Finalis yang tidak naik podium., Penonton di stadion.]
    answer: 0
    explain:
      ar_eg: الكاس بيروح للي جمع أكتر ميداليات.
      ar: تذهب الكأس لمن جمع أكثر الميداليات.
      en: The trophy goes to whoever collects the most medals.
    words: [trofi, juara umum, peraih, finalis, podium]
dialogue:
  lines:
    - speaker: Kaka Yohana
      text: 'Mohamed, berita utama sore ini: kontingen pelajar Sorong jadi juara umum!'
      ar_eg: 'يا محمد، الخبر الرئيسي العصر ده: بعثة طلبة سورونج طلعت البطل العام!'
      ar: 'يا محمد، خبر المساء الأهمّ: بعثة طلاب سورونغ صاحبة المركز الأول العام!'
      en: 'Mohamed, top story this afternoon: Sorong''s student team is overall champion!'
    - speaker: Mohamed
      text: Keren! Lomba apa, Kak?
      ar_eg: جامد! مسابقة إيه؟
      ar: رائع! أيّ مسابقة؟
      en: Great! Which competition?
    - speaker: Kaka Yohana
      text: Olimpiade sains tingkat provinsi. Lombanya bergengsi, lho.
      ar_eg: أوليمبياد العلوم على مستوى المحافظة. مسابقة مرموقة.
      ar: أولمبياد العلوم على مستوى المقاطعة، وهي مسابقة مرموقة.
      en: The provincial science olympiad. A prestigious one.
    - speaker: Mohamed
      text: Berapa medali yang mereka sabet?
      ar_eg: خطفوا كام ميدالية؟
      ar: كم ميدالية انتزعوا؟
      en: How many medals did they win?
    - speaker: Kaka Yohana
      text: Tujuh emas. Mereka naik podium tujuh kali!
      ar_eg: سبع دهب. طلعوا على المنصّة سبع مرات!
      ar: سبع ذهبيات، صعدوا إلى المنصّة سبع مرّات!
      en: Seven golds. They were on the podium seven times!
    - speaker: Mohamed
      text: 'Aku tulis judulnya sekarang: "Pelajar Sorong Menyabet Trofi Juara Umum".'
      ar_eg: 'هكتب العنوان دلوقتي: «طلبة سورونج يخطفوا كاس البطل العام».'
      ar: 'سأكتب العنوان الآن: «طلاب سورونغ ينتزعون كأس البطولة العامة».'
      en: 'I''ll write the headline now: "Sorong Students Snatch the Overall Champion Trophy".'
