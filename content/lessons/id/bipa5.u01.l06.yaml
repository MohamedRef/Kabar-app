schema: kabar.lesson/v1
id: bipa5.u01.l06
language: id
title: Lowongan di perusahaan tambang
can_do:
  ar_eg: 'تقرا إعلان وظيفة في شركة تعدين: مين بيعيّنوا، المؤهلات، الأجر والتعويض، والمنافسة.'
  ar: 'أن تقرأ إعلان وظيفة في شركة تعدين: من يوظّفون، والمؤهّلات، والأجر والتعويض، والمنافسة.'
  en: 'Read a mining company''s job advert: who they recruit, qualifications, pay and compensation, and the competition.'
slides:
  - title: Iklan lowongan
    body:
      ar_eg: |
        pertambangan = التعدين (البترول والغاز والفحم حوالين بالكبابان). merekrut = يعيّن موظفين.
        kualifikasi = مؤهلات، analis = محلل (analis data)، spesialis = متخصص (spesialis K3 = متخصص سلامة مهنية).
        upah = أجرة (بالساعة أو اليوم)، kompensasi = تعويض (لو اتعورت أو اتلغى عقدك).
        persaingan = منافسة: persaingan ketat = منافسة شديدة.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: aja = saja، nyari = mencari، disebutin = disebutkan، nggak = tidak، terus = lalu، dibatalin = dibatalkan، banget = sekali، aku = saya.
      ar: |
        pertambangan = التعدين (النفط والغاز والفحم حول باليكبابان). merekrut = يوظّف.
        kualifikasi = مؤهّلات، analis = محلّل (analis data)، spesialis = متخصّص (spesialis K3 = متخصّص السلامة المهنية).
        upah = أجر (بالساعة أو باليوم)، kompensasi = تعويض (عند الإصابة أو إلغاء العقد).
        persaingan = منافسة: persaingan ketat = منافسة شديدة.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: aja = saja، nyari = mencari، disebutin = disebutkan، nggak = tidak، terus = lalu، dibatalin = dibatalkan، banget = sekali، aku = saya.
      en: |
        pertambangan = mining (oil, gas and coal around Balikpapan). merekrut = to recruit.
        kualifikasi = qualifications, analis = analyst (analis data), spesialis = specialist (spesialis K3 = safety specialist).
        upah = wage (hourly or daily), kompensasi = compensation (for injury or a cancelled contract).
        persaingan = competition: persaingan ketat = fierce competition.
        The dialogue uses street forms; the formal ones are beside them: aja = saja, nyari = mencari, disebutin = disebutkan, nggak = tidak, terus = lalu, dibatalin = dibatalkan, banget = sekali, aku = saya.
    examples:
      - text: Perusahaan pertambangan itu merekrut lima puluh orang.
        ar_eg: شركة التعدين دي هتعيّن خمسين واحد.
        ar: توظّف شركة التعدين تلك خمسين شخصًا.
        en: That mining company is recruiting fifty people.
      - text: 'Kualifikasi: sarjana teknik dan pengalaman dua tahun.'
        ar_eg: 'المؤهلات: بكالوريوس هندسة وخبرة سنتين.'
        ar: 'المؤهّلات: بكالوريوس هندسة وخبرة سنتين.'
        en: 'Qualifications: an engineering degree and two years'' experience.'
      - text: Persaingan untuk posisi analis sangat ketat.
        ar_eg: المنافسة على وظيفة المحلل شديدة جدًا.
        ar: المنافسة على وظيفة المحلّل شديدة جدًا.
        en: Competition for the analyst post is very fierce.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pertambangan
        ar_eg: تعدين
        ar: تعدين
        en: mining
      - text: merekrut
        ar_eg: يعيّن موظفين
        ar: يوظّف
        en: to recruit
      - text: kualifikasi
        ar_eg: مؤهلات
        ar: مؤهّلات
        en: qualifications
      - text: analis
        ar_eg: محلل
        ar: محلّل
        en: analyst
    words: [pertambangan, merekrut, kualifikasi, analis]
  - id: e02
    type: match_pairs
    pairs:
      - text: spesialis
        ar_eg: متخصص
        ar: متخصّص
        en: specialist
      - text: kompensasi
        ar_eg: تعويض
        ar: تعويض
        en: compensation
      - text: persaingan
        ar_eg: منافسة
        ar: منافسة
        en: competition
      - text: upah
        ar_eg: أجرة
        ar: أجر
        en: wage
    words: [spesialis, kompensasi, persaingan, upah]
  - id: e03
    type: listen
    text: Kami merekrut spesialis keselamatan kerja.
    question:
      ar_eg: الشركة بتدور على مين؟
      ar: عمّن تبحث الشركة؟
      en: Who is the company looking for?
    options: [متخصص سلامة, محاسب, سواق]
    answer: 0
    meaning:
      ar_eg: بنعيّن متخصص سلامة مهنية.
      ar: نوظّف متخصّصًا في السلامة المهنية.
      en: We're recruiting a work-safety specialist.
    words: [merekrut, spesialis]
  - id: e04
    type: fill_blank
    sentence: Pekerja harian menerima ___ setiap sore.
    meaning:
      ar_eg: عامل اليومية بياخد ___ كل يوم العصر.
      ar: يتسلّم عامل اليومية ___ كل مساء.
      en: Day workers get their ___ every afternoon.
    options: [upah, kualifikasi, persaingan]
    answers: [upah]
    words: [upah, kualifikasi, persaingan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الشركة دفعت فلوس لعامل اتعور في المنجم. ده اسمه إيه؟
      ar: دفعت الشركة مالًا لعامل أصيب في المنجم. ما اسم ذلك؟
      en: The company paid a worker hurt in the mine. What is that called?
    options: [persaingan, kompensasi, analis]
    answer: 1
    explain:
      ar_eg: kompensasi = تعويض عن ضرر.
      ar: kompensasi = تعويض عن ضرر.
      en: kompensasi = compensation for harm.
    words: [persaingan, kompensasi, analis]
  - id: e06
    type: fill_blank
    sentence: Ekonomi Balikpapan bergantung pada minyak, gas, dan ___ batu bara.
    meaning:
      ar_eg: اقتصاد بالكبابان معتمد على البترول والغاز و___ الفحم.
      ar: يعتمد اقتصاد باليكبابان على النفط والغاز و___ الفحم.
      en: Balikpapan's economy depends on oil, gas and coal ___.
    options: [pertambangan, spesialis, upah]
    answers: [pertambangan]
    words: [pertambangan, spesialis, upah]
  - id: e07
    type: multiple_choice
    question: Pelamar itu tidak dipanggil karena ___-nya kurang.
    options: [merekrut, pertambangan, kualifikasi]
    answer: 2
    explain:
      ar_eg: 'kualifikasi = مؤهلات: مؤهلاته ما كانتش كفاية.'
      ar: 'kualifikasi = مؤهّلات: لم تكن مؤهّلاته كافية.'
      en: 'kualifikasi = qualifications: they weren''t enough.'
    words: [merekrut, pertambangan, kualifikasi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المحلل ده بياخد تعويض لو العقد اتلغى.
      ar: يحصل هذا المحلّل على تعويض إذا أُلغي العقد.
      en: This analyst gets compensation if the contract is cancelled.
    answer: Analis ini mendapat kompensasi kalau kontraknya batal.
    distractors: [upah, persaingan]
    words: [analis, kompensasi]
  - id: e09
    type: translate
    direction: from_target
    source_text: Persaingan di dunia pertambangan makin ketat.
    answers_meaning:
      ar_eg: [المنافسة في مجال التعدين بقت أشد, المنافسة في شغل التعدين بتزيد]
      ar: [تشتدّ المنافسة في قطاع التعدين, المنافسة في عالم التعدين تزداد شدة]
      en: [Competition in mining is getting fiercer, Competition in the mining industry is getting tougher]
    words: [persaingan, pertambangan]
  - id: e10
    type: speaking
    text: Saya punya kualifikasi sebagai analis data.
    meaning:
      ar_eg: عندي المؤهلات إني أشتغل محلل داتا.
      ar: لديّ المؤهّلات لأعمل محلّل بيانات.
      en: I'm qualified as a data analyst.
    words: [kualifikasi, analis]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, lihat iklan ini, deh. Perusahaan pertambangan di Balikpapan lagi merekrut penerjemah!
      ar_eg: يا محمد، بص على الإعلان ده. شركة تعدين في بالكبابان بتعيّن مترجمين!
      ar: يا محمد، انظر إلى هذا الإعلان. شركة تعدين في باليكبابان توظّف مترجمين!
      en: Mohamed, look at this ad. A mining company in Balikpapan is recruiting translators!
    - speaker: Mohamed
      text: Kualifikasinya apa aja?
      ar_eg: المؤهلات إيه؟
      ar: ما المؤهّلات؟
      en: What are the qualifications?
    - speaker: Rina
      text: Bahasa Arab sama Inggris. Mereka juga nyari analis sama spesialis keselamatan.
      ar_eg: عربي وإنجليزي. وبيدوروا كمان على محللين ومتخصصين سلامة.
      ar: العربية والإنجليزية. ويبحثون أيضًا عن محلّلين ومتخصّصين في السلامة.
      en: Arabic and English. They're also looking for analysts and safety specialists.
    - speaker: Mohamed
      text: Upahnya disebutin nggak? Terus ada kompensasi kalau kontraknya dibatalin?
      ar_eg: مكتوب الأجر؟ وفيه تعويض لو العقد اتلغى؟
      ar: هل ذُكر الأجر؟ وهل هناك تعويض إن أُلغي العقد؟
      en: Do they mention pay? And is there compensation if the contract is cancelled?
    - speaker: Rina
      text: Ada. Tapi hati-hati, persaingannya pasti ketat banget.
      ar_eg: أيوه. بس خلي بالك، المنافسة أكيد شديدة.
      ar: نعم. لكن انتبه، ستكون المنافسة شديدة حتمًا.
      en: Yes. But be careful, the competition will be tough.
    - speaker: Mohamed
      text: Nggak apa-apa. Aku kirim lamaran malam ini aja.
      ar_eg: مش مشكلة. هبعت الطلب الليلة.
      ar: لا بأس. سأرسل طلبي الليلة.
      en: That's fine. I'll send my application tonight.
