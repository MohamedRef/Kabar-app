schema: kabar.lesson/v1
id: bipa1.u10.l07
language: id
title: Ulangan Unit 10
can_do:
  ar_eg: تحكي تجربة عدّت عليك.
  ar: أن تعيد رواية تجربة مررت بها.
  en: Retell an experience.
slides:
  - title: Ingat!
    body:
      ar_eg: |
        - مفيش ماضي في الفعل: كلمة الوقت هي اللي بتقول (kemarin، tadi، minggu lalu).
        - pernah = قبل كده / عمرك؛ والرد Pernah أو Belum (pernah). وtidak pernah = أبدًا.
        - الترتيب S + P + O + K، والظرف بس ممكن ييجي الأول.
        - sebelum / setelah / lalu عشان ترتّب الحكاية.
      ar: |
        - لا يتصرف الفعل؛ ظرف الزمان يحدد الوقت (kemarin، tadi، minggu lalu).
        - pernah = سبق أن، والجواب Pernah أو Belum (pernah)، وtidak pernah = أبدًا.
        - الترتيب S + P + O + K، والظرف وحده يجوز تقديمه.
        - sebelum / setelah / lalu لترتيب القصة.
      en: |
        - No past tense: the time word does it (kemarin, tadi, minggu lalu).
        - pernah = ever; answer Pernah or Belum (pernah); tidak pernah = never.
        - Order S + P + O + K; only the adverbial can move to the front.
        - sebelum / setelah / lalu to order the story.
    grammar: id.aspect.pernah
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kemarin
        ar_eg: امبارح
        ar: أمس
        en: yesterday
      - text: tadi pagi
        ar_eg: النهارده الصبح (اللي فات)
        ar: هذا الصباح
        en: this morning (past)
      - text: tahun lalu
        ar_eg: السنة اللي فاتت
        ar: العام الماضي
        en: last year
      - text: pelabuhan
        ar_eg: ميناء
        ar: ميناء
        en: harbour
      - text: kapal
        ar_eg: مركب
        ar: قارب
        en: boat
    words: [kemarin, tadi, tahun lalu, pelabuhan, kapal]
  - id: e02
    type: match_pairs
    pairs:
      - text: mimpi
        ar_eg: حلم؛ يحلم
        ar: حلم؛ يحلم
        en: dream
      - text: yakin
        ar_eg: متأكد
        ar: متأكد، واثق
        en: sure, certain
      - text: tiba
        ar_eg: يوصل (رسمي)
        ar: يصل
        en: arrive
      - text: berani
        ar_eg: جريء؛ يجرؤ
        ar: جريء؛ يجرؤ
        en: brave; dare
    words: [mimpi, yakin, tiba, berani]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة ترتيبها صح؟
      ar: أيّ جملة ترتيبها صحيح؟
      en: Which sentence is in the right order?
    options: [Membeli Rina tiket kemarin di pelabuhan., Kemarin Rina membeli tiket di pelabuhan., Kemarin Rina tiket membeli di pelabuhan.]
    answer: 1
    explain:
      ar_eg: 'الترتيب: K (kemarin) + S (Rina) + P (membeli) + O (tiket) + K (di pelabuhan).'
      ar: الظرف ثم المسند إليه ثم المسند ثم المفعول ثم الظرف.
      en: K + S + P + O + K — the object right after the verb.
    words: [membeli, pelabuhan]
  - id: e04
    type: listen
    text: Saya pernah tinggal di Jakarta.
    options: [Saya pernah tinggal di Jakarta., Saya belum pernah ke Jakarta., Saya tinggal di Jakarta sekarang.]
    answer: 0
    words: [pernah, tinggal]
  - id: e05
    type: listen
    text: Setelah itu, kami makan ikan bakar.
    options: ['Setelah itu, kami makan ikan bakar.', 'Setelah itu, kami membeli ikan.', 'Sebelum itu, kami makan ikan bakar.']
    answer: 0
    words: [setelah itu, ikan bakar]
  - id: e06
    type: fill_blank
    sentence: Dia ___ pernah terlambat. Dia selalu datang pagi.
    meaning:
      ar_eg: هو عمره ما بيتأخر. دايمًا بييجي بدري.
      ar: لا يتأخر أبدًا، فهو يأتي باكرًا دائمًا.
      en: He's never late. He always comes early.
    options: [sudah, bukan, tidak]
    answers: [tidak, nggak, gak]
    words: [tidak pernah, terlambat]
  - id: e07
    type: fill_blank
    sentence: ___ naik kapal, kami membeli air.
    meaning:
      ar_eg: قبل ما نركب المركب، اشترينا مية.
      ar: قبل ركوب القارب، اشترينا ماءً.
      en: Before boarding the boat, we bought water.
    options: [Setelah, Sebelum, Lalu]
    answers: [Sebelum]
    words: [sebelum]
  - id: e08
    type: build_sentence
    source:
      ar_eg: امبارح ركبنا مركب لجزر الألف.
      ar: أمس ركبنا قاربًا إلى جزر الألف.
      en: Yesterday we took a boat to the Thousand Islands.
    answer: Kemarin kami naik kapal ke Kepulauan Seribu.
    alternatives: [Kami naik kapal ke Kepulauan Seribu kemarin.]
    distractors: [tadi, dari]
    words: [kemarin, naik, kapal]
  - id: e09
    type: build_sentence
    source:
      ar_eg: عمرك كلت دوريان؟
      ar: هل سبق أن أكلت الدوريان؟
      en: Have you ever eaten durian?
    answer: Kamu pernah makan durian?
    distractors: [belum, ke]
    words: [pernah, durian]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عمرك رحت مصر؟
      ar: هل سبق أن زرت مصر؟
      en: Have you ever been to Egypt?
    answers: ['Kamu pernah ke Mesir?', 'Pernah ke Mesir?', 'Kamu pernah pergi ke Mesir?', 'Anda pernah ke Mesir?', 'Apakah kamu pernah ke Mesir?', Kamu pernah ke Mesir]
    words: [pernah]
  - id: e11
    type: dictation
    text: Ini pertama kali saya ke pulau.
    meaning:
      ar_eg: دي أول مرة أروح جزيرة.
      ar: هذه أول مرة أذهب فيها إلى جزيرة.
      en: This is my first time going to an island.
    words: [pertama kali, pulau]
  - id: e12
    type: speaking
    text: Kemarin saya ke Kepulauan Seribu. Saya belum pernah naik kapal, jadi ini pertama kali. Saya capek, tapi senang!
    meaning:
      ar_eg: امبارح رحت جزر الألف. عمري ما كنت ركبت مركب، فدي كانت أول مرة. أنا تعبان، بس مبسوط!
      ar: أمس ذهبت إلى جزر الألف. لم أركب قاربًا من قبل، فكانت هذه أول مرة. أنا متعب لكني سعيد!
      en: Yesterday I went to the Thousand Islands. I'd never been on a boat, so it was the first time. I'm tired, but happy!
    words: [kemarin, belum pernah, pertama kali, capek, senang]
dialogue:
  title: Cerita untuk Bu Yanti
  lines:
    - speaker: Bu Yanti
      text: Mohamed, kemarin kamu ke mana?
      ar_eg: يا محمد، امبارح رحت فين؟
      ar: يا محمد، إلى أين ذهبت أمس؟
      en: Mohamed, where did you go yesterday?
    - speaker: Mohamed
      text: Kemarin saya ke Pulau Pramuka, Bu. Saya naik kapal dari Marina Ancol.
      ar_eg: امبارح رحت جزيرة برامُكا يا طنط. ركبت مركب من مارينا أنكول.
      ar: أمس ذهبت إلى جزيرة برامُكا يا سيدتي، وركبت قاربًا من مارينا أنكول.
      en: Yesterday I went to Pramuka Island, ma'am. I took a boat from Marina Ancol.
    - speaker: Bu Yanti
      text: Wah! Kamu pernah ke sana?
      ar_eg: الله! كنت رحت هناك قبل كده؟
      ar: رائع! هل سبق أن ذهبت إلى هناك؟
      en: Wow! Had you been there before?
    - speaker: Mohamed
      text: Belum pernah. Ini pertama kali. Setelah makan, kami berenang di laut.
      ar_eg: لأ، عمري ما رحت. دي كانت أول مرة. بعد الأكل عُمنا في البحر.
      ar: لم يسبق. كانت أول مرة، وبعد الأكل سبحنا في البحر.
      en: Never. It was the first time. After eating, we swam in the sea.
    - speaker: Bu Yanti
      text: Wah, saya nggak pernah berenang di laut!
      ar_eg: يا خبر، أنا عمري ما عُمت في البحر!
      ar: يا للعجب، لم أسبح في البحر قط!
      en: Wow, I've never swum in the sea!
    - speaker: Mohamed
      text: Lautnya bagus banget, Bu. Bu Yanti harus mencoba!
      ar_eg: البحر هناك حلو أوي يا طنط. لازم تجربي!
      ar: البحر جميل جدًا يا سيدتي، يجب أن تجرّبي!
      en: The sea is so beautiful, ma'am. You have to try it!
souvenir:
  id: bipa1.u10.souvenir
  title: Kapal ke Kepulauan Seribu
  note:
    ar_eg: 'اسمها «الألف جزيرة»، بس في الحقيقة هي حوالي مية وكام جزيرة صغيرة في خليج جاكرتا، والمراكب بتطلع لها من Muara Angke وMarina Ancol. وفي الرحلة هتلاحظ إن الإندونيسي مالوش ماضي: كلمة «kemarin» بتعمل الشغل كله. ولما الناس يعرفوا إنك مصري، هيقولولك بابتسامة «Saya belum pernah ke Mesir!»، وده أحلى باب للكلام.'
    ar: اسمها «الجزر الألف»، لكنها في الحقيقة نحو مئة ونيّف من الجزر الصغيرة في خليج جاكرتا، وتنطلق القوارب إليها من Muara Angke وMarina Ancol. وفي هذه الرحلة تلاحظ أن الإندونيسية بلا زمن ماضٍ، فكلمة «kemarin» تؤدي المهمة كلها. وحين يعرف الناس أنك مصري يقولون مبتسمين «Saya belum pernah ke Mesir!»، وهو أجمل مدخل للحديث.
    en: They're called the "Thousand Islands", but there are really only a hundred-odd small islands in Jakarta Bay, reached by boat from Muara Angke and Marina Ancol. On the trip you'll notice Indonesian has no past tense — "kemarin" does all the work. And when people learn you're Egyptian they'll smile and say "Saya belum pernah ke Mesir!" — the warmest way into a conversation.
