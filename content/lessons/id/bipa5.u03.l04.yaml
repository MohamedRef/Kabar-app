schema: kabar.lesson/v1
id: bipa5.u03.l04
language: id
title: Belanja daring
can_do:
  ar_eg: تشتري وتطلب أونلاين بالإندونيسي وتاخد بالك من النصب.
  ar: أن تشتري وتطلب عبر الإنترنت بالإندونيسية وتحذر من الاحتيال.
  en: Shop and order online in Indonesian, and spot a scam.
slides:
  - title: Dari siaran langsung sampai ojek daring
    body:
      ar_eg: |
        إندونيسيا من أكبر أسواق البيع بالموبايل في العالم:
        - siaran langsung (live) = بث مباشر: البياعين بيعرضوا الحاجة لايف بالليل والناس بتطلب في الكومنتات
        - ongkos kirim (ongkir) = مصاريف الشحن
        - bayar di tempat (COD) = تدفع للمندوب لما الحاجة توصل
        - ojek daring = موتوسيكل أجرة بتطلبه من أبلكيشن، وبيوصل أكل وطرود كمان
        - penipuan = نصب واحتيال: عمر ما بياع حقيقي هيطلب منك kata sandi أو كود OTP.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: banget = sekali، terus = lalu، nggak = tidak.
      ar: |
        إندونيسيا من أكبر أسواق البيع عبر الهاتف في العالم:
        - siaran langsung (live) = بثّ مباشر يعرض فيه الباعة سلعهم ليلًا ويطلب الناس في التعليقات
        - ongkos kirim (ongkir) = رسوم الشحن
        - bayar di tempat (COD) = الدفع للمندوب عند الاستلام
        - ojek daring = درّاجة نارية أجرة تُطلب من تطبيق، وتوصّل الطعام والطرود أيضًا
        - penipuan = احتيال: لن يطلب منك بائع حقيقي kata sandi أو رمز OTP.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: banget = sekali، terus = lalu، nggak = tidak.
      en: |
        Indonesia is one of the world's biggest mobile-shopping markets:
        - siaran langsung (live) = live stream: sellers show goods live at night and people order in the comments
        - ongkos kirim (ongkir) = shipping cost
        - bayar di tempat (COD) = cash on delivery
        - ojek daring = app-booked motorbike taxi, which also delivers food and parcels
        - penipuan = fraud: a real seller never asks for your kata sandi or OTP code.
        The dialogue uses street forms; the formal ones are beside them: banget = sekali, terus = lalu, nggak = tidak.
    examples:
      - text: Ongkirnya gratis kalau bayar di tempat?
        ar_eg: الشحن ببلاش لو دفعت عند الاستلام؟
        ar: هل الشحن مجاني عند الدفع عند الاستلام؟
        en: Is shipping free with cash on delivery?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: siaran langsung
        ar_eg: بث مباشر
        ar: بثّ مباشر
        en: live stream
      - text: ongkos kirim
        ar_eg: مصاريف الشحن
        ar: رسوم الشحن
        en: shipping cost
      - text: bayar di tempat
        ar_eg: الدفع عند الاستلام
        ar: الدفع عند الاستلام
        en: cash on delivery
      - text: ojek daring
        ar_eg: موتوسيكل أجرة من أبلكيشن
        ar: درّاجة أجرة عبر تطبيق
        en: app motorbike taxi
      - text: penipuan
        ar_eg: نصب
        ar: احتيال
        en: fraud, scam
    words: [siaran langsung, ongkos kirim, bayar di tempat, ojek daring, penipuan]
  - id: e02
    type: listen
    text: Penjual itu berjualan lewat siaran langsung setiap malam.
    question:
      ar_eg: البياعة دي بتبيع إزاي؟
      ar: كيف تبيع هذه البائعة؟
      en: How does that seller sell?
    options:
      - في محل في السوق.
      - في بث مباشر على النت.
      - من بيت لبيت.
    answer: 1
    words: [siaran langsung]
  - id: e03
    type: fill_blank
    sentence: Barangnya murah, tetapi ___ ke Samarinda mahal sekali.
    meaning:
      ar_eg: الحاجة رخيصة، بس الشحن لساماريندا غالي جدًا.
      ar: السلعة رخيصة، لكنّ الشحن إلى ساماريندا غالٍ جدًا.
      en: The item is cheap, but shipping to Samarinda is very expensive.
    options: [ongkos kirim, siaran langsung, penipuan]
    answers: [ongkos kirim]
    words: [ongkos kirim]
    explain:
      ar_eg: الحاجة رخيصة بس «الشحن» غالي = ongkos kirim. siaran langsung = بث مباشر وpenipuan = نصب، ومش ليهم سعر شحن.
      ar: السلعة رخيصة لكنّ «الشحن» غالٍ = ongkos kirim. أما siaran langsung فالبثّ المباشر، وpenipuan الاحتيال.
      en: "Cheap item, pricey shipping: ongkos kirim. siaran langsung (live stream) and penipuan (scam) have no shipping price."
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: «bayar di tempat» يعني إيه؟
      ar: ما معنى «bayar di tempat»؟
      en: What does "bayar di tempat" mean?
    options:
      - تدفع قبل ما الحاجة تتشحن.
      - تدفع في البنك.
      - تدفع للمندوب لما الحاجة توصلك.
    answer: 2
    explain:
      ar_eg: bayar = يدفع، di tempat = في المكان، يعني عند الاستلام.
      ar: bayar = يدفع، وdi tempat = في المكان، أي عند الاستلام.
      en: bayar = pay, di tempat = on the spot, i.e. on delivery.
    words: [bayar di tempat]
  - id: e05
    type: build_sentence
    source:
      ar_eg: طلبت أكل بأوجيك من الأبلكيشن عشان كانت بتمطر.
      ar: طلبت طعامًا عبر درّاجة أجرة من التطبيق لأنّ المطر كان يهطل.
      en: I ordered food through an app ojek because it was raining.
    answer: Saya memesan makanan lewat ojek daring karena hujan.
    distractors: [ongkos, siaran]
    words: [ojek daring]
    explain:
      ar_eg: «أوجيك من الأبلكيشن» = ojek daring. ongkos = تكلفة وsiaran = بث، كلمات من عبارات تانية.
      ar: «درّاجة الأجرة عبر التطبيق» = ojek daring. أما ongkos («تكلفة») وsiaran («بثّ») فمن عبارات أخرى.
      en: An app ojek is ojek daring. ongkos (cost) and siaran (broadcast) belong to other phrases.
  - id: e06
    type: translate
    direction: from_target
    source_text: Hati-hati, banyak penipuan di siaran langsung.
    answers_meaning:
      ar_eg:
        - خلي بالك، فيه نصب كتير في البث المباشر.
        - احترس، النصب كتير في اللايفات.
      ar:
        - احذر، فالاحتيال كثير في البثّ المباشر.
        - انتبه، هناك عمليات احتيال كثيرة في البثّ المباشر.
      en:
        - Careful, there's a lot of fraud on live streams.
        - Watch out, live streams have many scams.
    words: [penipuan, siaran langsung]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي علامة نصب؟
      ar: أيّها علامة احتيال؟
      en: Which one is a sign of fraud?
    options:
      - Penjual meminta kata sandi Anda.
      - Penjual memberi nomor resi.
      - Ongkos kirimnya gratis.
    answer: 0
    explain:
      ar_eg: nomor resi = رقم الشحنة، ده طبيعي. لكن kata sandi عمرك ما تديها لحد.
      ar: nomor resi = رقم تتبّع الشحنة، وهو أمر عادي، أمّا kata sandi فلا تعطها لأحد.
      en: nomor resi is a tracking number, which is normal; never give anyone your kata sandi.
    words: [penipuan, kata sandi]
  - id: e08
    type: speaking
    text: Saya lebih suka bayar di tempat supaya aman.
    meaning:
      ar_eg: أنا بفضل أدفع عند الاستلام عشان أبقى في الأمان.
      ar: أفضّل الدفع عند الاستلام لأكون في أمان.
      en: I prefer cash on delivery to be safe.
    words: [bayar di tempat]
  - id: e09
    type: dictation
    text: Ongkos kirim gratis untuk pembelian di atas seratus ribu.
    meaning:
      ar_eg: الشحن ببلاش لو اشتريت بأكتر من مية ألف.
      ar: الشحن مجاني للمشتريات التي تزيد على مئة ألف.
      en: Free shipping on orders over a hundred thousand.
    words: [ongkos kirim]
  - id: e10
    type: fill_blank
    sentence: Pengemudi ___ itu mengantar paket saya dalam satu jam.
    meaning:
      ar_eg: سواق الأوجيك وصّل الطرد بتاعي في ساعة.
      ar: أوصل سائق الدرّاجة الأجرة طردي خلال ساعة.
      en: The ojek driver delivered my parcel within an hour.
    options: [ojek daring, penipuan, ongkos kirim]
    answers: [ojek daring]
    words: [ojek daring]
    explain:
      ar_eg: سواق الطلبات = Pengemudi ojek daring. penipuan = نصب وongkos kirim = تمن الشحن، ومش نوع سواق.
      ar: السائق = Pengemudi ojek daring. أما penipuan فالاحتيال، وongkos kirim رسوم الشحن، وليسا نوع سائق.
      en: The driver is a pengemudi ojek daring. penipuan (scam) and ongkos kirim (shipping cost) aren't kinds of driver.
dialogue:
  title: Belanja tengah malam
  lines:
    - speaker: Rina
      text: Mohamed, lihat deh! Siaran langsung ini jual batik Samarinda murah banget.
      ar_eg: يا محمد، بص! اللايف ده بيبيع باتيك ساماريندا رخيص أوي.
      ar: يا محمد، انظر! هذا البثّ المباشر يبيع باتيك ساماريندا بسعر زهيد جدًا.
      en: Mohamed, look! This live stream is selling Samarinda batik really cheap.
    - speaker: Mohamed
      text: Ongkos kirimnya berapa? Terus bisa bayar di tempat nggak?
      ar_eg: الشحن بكام؟ وينفع ندفع عند الاستلام؟
      ar: كم رسوم الشحن؟ وهل يمكن الدفع عند الاستلام؟
      en: How much is shipping? And can we pay on delivery?
    - speaker: Rina
      text: Bisa. Tapi penjualnya minta kode OTP-ku dulu.
      ar_eg: ينفع. بس البياع عايز كود الـ OTP بتاعي الأول.
      ar: يمكن. لكنّ البائع يطلب رمز OTP الخاص بي أولًا.
      en: Yes. But the seller wants my OTP code first.
    - speaker: Mohamed
      text: Jangan! Itu pasti penipuan. Penjual asli nggak pernah minta kode itu.
      ar_eg: لأ أوعي! ده نصب أكيد. البياع الحقيقي عمره ما يطلب الكود ده.
      ar: لا تفعلي! هذا احتيال حتمًا، فالبائع الحقيقي لا يطلب هذا الرمز أبدًا.
      en: Don't! That's definitely a scam. A real seller never asks for that code.
