schema: kabar.lesson/v1
id: bipa3.u01.l05
language: id
title: Pernikahan dan cincin
can_do:
  ar_eg: 'تتكلم عن فرح: الخطيب والخطيبة، الدبلة، العزومة والاحتفال.'
  ar: 'أن تتحدث عن حفل زفاف: الخطيبان والخاتم والدعوة والاحتفال.'
  en: 'Talk about a wedding: the couple-to-be, the ring, the invitation and the celebration.'
slides:
  - title: Pesta pernikahan
    body:
      ar_eg: |
        pernikahan = جواز، فرح. pasangan = الاتنين مع بعض (عريس وعروسة)، أو شريك الحياة.
        calon = اللي هيبقى: calon suami = خطيب، calon istri = خطيبة.
        cincin = خاتم أو دبلة. mengundang = يعزم. merayakan = يحتفل بـ، perayaan = احتفال.
        kebahagiaan = سعادة (من bahagia).
      ar: |
        pernikahan = زواج، حفل زفاف. pasangan = زوجان، أو شريك الحياة.
        calon = المرتقَب: calon suami = خطيب، calon istri = خطيبة.
        cincin = خاتم. mengundang = يدعو. merayakan = يحتفل بـ، perayaan = احتفال.
        kebahagiaan = سعادة (من bahagia).
      en: |
        pernikahan = marriage, wedding. pasangan = couple, partner.
        calon = future, -to-be: calon suami = fiancé, calon istri = fiancée.
        cincin = ring. mengundang = invite. merayakan = celebrate, perayaan = celebration.
        kebahagiaan = happiness (from bahagia).
    examples:
      - text: Rina mengundang kami ke pernikahan kakaknya.
        ar_eg: رينا عزمتنا على فرح أختها.
        ar: دعتنا رينا إلى زفاف أختها.
        en: Rina invited us to her sister's wedding.
      - text: Calon suaminya membeli cincin emas.
        ar_eg: خطيبها اشترى دبلة دهب.
        ar: اشترى خطيبها خاتمًا من ذهب.
        en: Her fiancé bought a gold ring.
      - text: Semoga kalian selalu dalam kebahagiaan.
        ar_eg: ربنا يديم عليكم السعادة.
        ar: عسى أن تعيشا في سعادة دائمًا.
        en: May you always live in happiness.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pernikahan
        ar_eg: فرح، جواز
        ar: زواج، زفاف
        en: wedding
      - text: pasangan
        ar_eg: عرسان، شريك
        ar: زوجان، شريك
        en: couple, partner
      - text: calon
        ar_eg: اللي هيبقى (خطيب)
        ar: مرتقَب (خطيب)
        en: '-to-be, fiancé(e)'
      - text: cincin
        ar_eg: دبلة، خاتم
        ar: خاتم
        en: ring
    words: [pernikahan, pasangan, calon, cincin]
  - id: e02
    type: match_pairs
    pairs:
      - text: mengundang
        ar_eg: يعزم
        ar: يدعو
        en: invite
      - text: merayakan
        ar_eg: يحتفل بـ
        ar: يحتفل بـ
        en: celebrate
      - text: perayaan
        ar_eg: احتفال
        ar: احتفال
        en: celebration
      - text: kebahagiaan
        ar_eg: سعادة
        ar: سعادة
        en: happiness
    words: [mengundang, merayakan, perayaan, kebahagiaan]
  - id: e03
    type: listen
    text: Kami merayakan pernikahan Kak Wulan di rumah keluarga.
    question:
      ar_eg: بيحتفلوا بإيه؟
      ar: بماذا يحتفلون؟
      en: What are they celebrating?
    options: [عيد ميلاد, فرح, تخرّج]
    answer: 1
    meaning:
      ar_eg: بنحتفل بفرح وولان في بيت العيلة.
      ar: نحتفل بزفاف وولان في بيت العائلة.
      en: We're celebrating Wulan's wedding at the family home.
    words: [merayakan, pernikahan]
  - id: e04
    type: fill_blank
    sentence: Calon istri saya memakai ___ dari ibu saya.
    meaning:
      ar_eg: خطيبتي لابسة ___ من أمي.
      ar: خطيبتي تلبس ___ من أمي.
      en: My fiancée wears a ___ from my mother.
    options: [cincin, perayaan, pasangan]
    answers: [cincin]
    words: [cincin, perayaan, pasangan]
    explain:
      ar_eg: اللي بيتلبس هو cincin (خاتم). perayaan = احتفال، وpasangan = جوز / زوجين.
      ar: ما يُلبس هو cincin (خاتم). أما perayaan فالاحتفال، وpasangan الزوجان أو الشريك.
      en: You wear a cincin (ring). perayaan is a celebration, pasangan a couple or partner.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: لما تطلب من الناس ييجوا فرحك، بتعمل إيه؟
      ar: حين تطلب من الناس حضور زفافك، ماذا تفعل؟
      en: When you ask people to come to your wedding, what do you do?
    options: [merayakan, mengundang, calon]
    answer: 1
    explain:
      ar_eg: mengundang = يعزم الناس.
      ar: mengundang = يدعو الناس.
      en: mengundang = to invite.
    words: [mengundang, merayakan, calon]
  - id: e06
    type: fill_blank
    sentence: Semoga ___ selalu ada di rumah kalian.
    meaning:
      ar_eg: ربنا يخلّي الـ ___ دايمًا في بيتكم.
      ar: عسى أن تبقى ___ دائمًا في بيتكم.
      en: May ___ always fill your home.
    options: [perayaan, cincin, kebahagiaan]
    answers: [kebahagiaan]
    words: [kebahagiaan, cincin, perayaan]
    explain:
      ar_eg: اللي نتمناه يفضل في البيت هو kebahagiaan (السعادة). perayaan = احتفال، وcincin = خاتم.
      ar: ما نرجو بقاءه في البيت kebahagiaan (السعادة). أما perayaan فاحتفال، وcincin خاتم.
      en: What you wish to fill a home is kebahagiaan (happiness). perayaan is a celebration, cincin a ring.
  - id: e07
    type: build_sentence
    source:
      ar_eg: هنحتفل بفرحهم في مطعم.
      ar: سنحتفل بزفافهما في مطعم.
      en: We'll celebrate their wedding at a restaurant.
    answer: Kami akan merayakan pernikahan mereka di restoran.
    distractors: [cincin, calon]
    words: [merayakan, pernikahan]
    explain:
      ar_eg: "نحتفل بـ = merayakan، والجملة: Kami akan merayakan pernikahan mereka di restoran. cincin = خاتم، وcalon = خطيب / مرشّح."
      ar: "«نحتفل بـ» merayakan: Kami akan merayakan pernikahan mereka di restoran. أما cincin فخاتم، وcalon خطيب أو مرشّح."
      en: "\"Celebrate\" is merayakan: Kami akan merayakan pernikahan mereka di restoran. cincin is a ring, calon a fiancé(e) or candidate."
  - id: e08
    type: translate
    direction: from_target
    source_text: Semoga pasangan ini selalu dalam kebahagiaan.
    answers_meaning:
      ar_eg: [ربنا يخلّي العرسان دول دايمًا مبسوطين, ربنا يديم السعادة على الاتنين دول]
      ar: [عسى أن يعيش هذان الزوجان في سعادة دائمًا, أتمنى أن يبقى هذان الزوجان سعيدين دائمًا]
      en: [May this couple always be happy, May this couple always live in happiness]
    words: [pasangan, kebahagiaan]
  - id: e09
    type: speaking
    text: Terima kasih sudah mengundang kami ke perayaan ini.
    meaning:
      ar_eg: شكرًا إنكم عزمتونا على الاحتفال ده.
      ar: شكرًا لدعوتكم إيانا إلى هذا الاحتفال.
      en: Thank you for inviting us to this celebration.
    words: [mengundang, perayaan]
  - id: e10
    type: multiple_choice
    question: Dia ___ suami saya. Kami menikah bulan depan.
    options: [pasangan, perayaan, calon]
    answer: 2
    explain:
      ar_eg: calon suami = خطيبها، اللي هيبقى جوزها.
      ar: calon suami = الخطيب، زوج المستقبل.
      en: calon suami = fiancé, husband-to-be.
    words: [calon, pasangan, perayaan]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kakakku mau nikah. Aku mengundang kamu, ya!
      ar_eg: يا محمد، أختي هتتجوز. إنت معزوم!
      ar: يا محمد، أختي ستتزوج. أنت مدعو!
      en: Mohamed, my sister's getting married. You're invited!
    - speaker: Mohamed
      text: Wah, selamat! Siapa calon suaminya?
      ar_eg: الله، مبروك! مين خطيبها؟
      ar: مبارك! من خطيبها؟
      en: Congratulations! Who's the groom-to-be?
    - speaker: Rina
      text: Orang Lombok, temen kuliahnya. Mereka pasangan yang lucu banget.
      ar_eg: واحد من لومبوك، زميلها في الجامعة. لايقين على بعض أوي.
      ar: رجل من لومبوك، زميلها في الجامعة. إنهما زوجان لطيفان.
      en: A Lombok guy from her university. They're a sweet couple.
    - speaker: Mohamed
      text: Perayaannya di mana?
      ar_eg: الاحتفال فين؟
      ar: أين الاحتفال؟
      en: Where's the celebration?
    - speaker: Rina
      text: Di rumah keluarga. Semua orang merayakan sambil makan enak.
      ar_eg: في بيت العيلة. كل الناس بتحتفل بأكل حلو.
      ar: في بيت العائلة. يحتفل الجميع بالأكل معًا.
      en: At the family home. Everyone celebrates with a big meal.
    - speaker: Mohamed
      text: Aku datang, dong! Semoga mereka bahagia terus!
      ar_eg: أكيد جاي. ربنا يسعدهم!
      ar: سأحضر بالتأكيد. أتمنى لهما السعادة!
      en: Of course I'll come! Wishing them every happiness!
