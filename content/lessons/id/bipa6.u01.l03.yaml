    en: to be portrayed
  - word: pagar
    pos: noun
    ar_eg: 'سور / بوابة البيت'
    ar: 'سور'
    en: 'fence, front gate'
  - word: cangkir
    pos: noun
    ar_eg: 'فنجان'
    ar: 'فنجان'
    en: 'cup'
