  - id: e03
    type: listen
    text: Ada pameran foto Makassar tempo dulu minggu ini.
    question:
      ar_eg: فيه إيه الأسبوع ده؟
      ar: ماذا يوجد هذا الأسبوع؟
      en: What's on this week?
    options: [معرض, نفق, مقبرة]
    answer: 0
    meaning:
      ar_eg: فيه معرض صور لماكاسار زمان الأسبوع ده.
      ar: هناك معرض صور لماكاسار القديمة هذا الأسبوع.
      en: There's an exhibition of old Makassar photos this week.
    words: [pameran]
  - id: e04
    type: fill_blank
    sentence: Kereta itu masuk ___ di bawah gunung.
    meaning:
      ar_eg: القطر ده دخل ___ تحت الجبل.
      ar: دخل القطار ___ تحت الجبل.
      en: The train went into a ___ under the mountain.
    options: [terowongan, pameran, keindahan]
    answers: [terowongan]
    words: [terowongan, pameran, keindahan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الخبرا بيعملوا إيه في الأرض؟
      ar: ماذا يفعل الخبراء في الأرض؟
      en: What do the experts do in the ground?
    options: [menggali, dilindungi, arsip]
    answer: 0
    explain:
      ar_eg: menggali = يحفر.
      ar: menggali = يحفر.
      en: menggali = to dig.
    words: [menggali, dilindungi, arsip]
  - id: e06
    type: fill_blank
    sentence: Surat-surat lama itu disimpan di ___ kota.
    meaning:
      ar_eg: الجوابات القديمة دي محفوظة في ___ المدينة.
      ar: تُحفظ تلك الرسائل القديمة في ___ المدينة.
      en: Those old letters are kept in the city ___.
    options: [arsip, lorong, kuburan]
    answers: [arsip]
    words: [arsip, lorong, kuburan]
  - id: e07
    type: multiple_choice
    question: Hutan ini ___ oleh pemerintah. Orang tidak boleh menebang pohon.
    options: [digali, dilindungi, dibangun]
    answer: 1
    explain:
      ar_eg: dilindungi = محمي.
      ar: dilindungi = محميّ.
      en: dilindungi = protected.
    words: [dilindungi, menggali]
  - id: e08
    type: build_sentence
    source:
      ar_eg: جمال القلعة دي مش هيتنسي.
      ar: جمال هذه القلعة لا يُنسى.
      en: The beauty of this fort is unforgettable.
    answer: Keindahan benteng ini tidak terlupakan.
    distractors: [kuburan, lorong]
    words: [keindahan, kuburan, lorong]
  - id: e09
    type: translate
    direction: from_target
    source_text: Di ujung lorong ada kuburan tua.
    answers_meaning:
      ar_eg: [في آخر الممر فيه مقبرة قديمة, آخر الممر فيه قبر قديم]
      ar: [في نهاية الممرّ مقبرة قديمة, توجد مقبرة قديمة في آخر الممرّ]
      en: ['At the end of the passage there''s an old grave', There is an old cemetery at the end of the corridor]
    words: [lorong, kuburan]
  - id: e10
    type: speaking
    text: Benteng ini dilindungi karena keindahan dan sejarahnya.
    meaning:
      ar_eg: القلعة دي محمية عشان جمالها وتاريخها.
      ar: هذه القلعة محميّة لجمالها وتاريخها.
      en: This fort is protected for its beauty and history.
    words: [dilindungi, keindahan, terowongan, pameran, arsip]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Di dalam benteng ini ada Museum La Galigo. Yuk, masuk lewat lorong ini.
      ar_eg: جوه القلعة دي فيه متحف لا جاليجو. يلا ندخل من الممر ده.
      ar: داخل هذه القلعة متحف لا غاليغو. هيا ندخل من هذا الممرّ.
      en: Inside this fort is the La Galigo Museum. Let's go in through this corridor.
    - speaker: Mohamed
      text: Lagi ada pameran apa?
      ar_eg: فيه معرض إيه دلوقتي؟
      ar: أي معرض يُقام الآن؟
      en: What exhibition is on now?
    - speaker: Mas Rizal
      text: Pameran barang-barang yang digali para ahli di Sulawesi Selatan.
      ar_eg: معرض للحاجات اللي الخبرا حفروا عليها في جنوب سولاويزي.
      ar: معرض للقطع التي نقّب عنها الخبراء في جنوب سولاويسي.
      en: An exhibition of objects experts dug up in South Sulawesi.
    - speaker: Mohamed
      text: Barang-barang itu dilindungi, ya?
      ar_eg: الحاجات دي محمية، صح؟
      ar: تلك القطع محميّة، أليس كذلك؟
      en: Those objects are protected, right?
    - speaker: Mas Rizal
      text: Iya dong. Surat-surat lama juga disimpan di arsip museum.
      ar_eg: طبعًا. والجوابات القديمة كمان محفوظة في أرشيف المتحف.
      ar: بالطبع. والرسائل القديمة محفوظة أيضًا في أرشيف المتحف.
      en: Of course. Old letters are kept in the museum archive too.
