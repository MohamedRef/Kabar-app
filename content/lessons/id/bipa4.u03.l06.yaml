schema: kabar.lesson/v1
id: bipa4.u03.l06
language: id
title: Lorong museum di benteng
can_do:
  ar_eg: 'توصف زيارة متحف جوه قلعة: الممرات والمعرض والأرشيف وحماية الآثار.'
  ar: 'أن تصف زيارة متحف داخل قلعة: الممرات والمعرض والأرشيف وحماية الآثار.'
  en: 'Describe a visit to a museum inside a fort: corridors, the exhibition, the archive and protection.'
slides:
  - title: Museum La Galigo
    body:
      ar_eg: |
        lorong = ممر ضيق، terowongan = نفق، kuburan = مقبرة (زي makam بس كلمة عامة أكتر).
        menggali = يحفر، arsip = أرشيف، pameran = معرض (pameran foto).
        dilindungi = محمي (benteng ini dilindungi)، keindahan = الجمال.
      ar: |
        lorong = ممرّ ضيق، terowongan = نفق، kuburan = مقبرة (مثل makam لكنها أعمّ).
        menggali = يحفر، arsip = أرشيف، pameran = معرض (pameran foto).
        dilindungi = محميّ، keindahan = الجمال.
      en: |
        lorong = passage, corridor; terowongan = tunnel; kuburan = grave, cemetery (more everyday than makam).
        menggali = to dig, arsip = archive, pameran = exhibition (pameran foto).
        dilindungi = protected, keindahan = beauty.
    examples:
      - text: Lorong museum ini panjang dan sempit.
        ar_eg: ممر المتحف ده طويل وضيق.
        ar: ممرّ هذا المتحف طويل وضيّق.
        en: This museum corridor is long and narrow.
      - text: Para ahli menggali tanah di dekat benteng.
        ar_eg: الخبرا بيحفروا الأرض جنب القلعة.
        ar: يحفر الخبراء الأرض قرب القلعة.
        en: Experts are digging the ground near the fort.
      - text: Benteng ini dilindungi oleh pemerintah.
        ar_eg: القلعة دي محمية من الحكومة.
        ar: هذه القلعة تحميها الحكومة.
        en: This fort is protected by the government.
