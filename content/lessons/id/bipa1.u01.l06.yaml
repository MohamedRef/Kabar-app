      ar: وعليكم السلام! كيف حالك يا ديماس؟
      en: And peace be upon you! How are you, Dimas?
    words: [waalaikumsalam, apa, kabar]
dialogue:
  title: Sore di Taman Fatahillah
  lines:
    - speaker: Mohamed
      text: Sore, Rina! Apa kabar?
      ar_eg: مساء الخير يا رينا! إزيك؟
      ar: مساء الخير يا رينا! كيف حالكِ؟
      en: Afternoon, Rina! How are you?
    - speaker: Rina
      text: Kabar baik, terima kasih. Dan kamu?
      ar_eg: كويسة، شكرًا. وإنت؟
      ar: بخير، شكرًا. وأنت؟
      en: I'm fine, thanks. And you?
    - speaker: Mohamed
      text: Baik juga, terima kasih.
      ar_eg: وأنا كمان كويس، شكرًا.
      ar: بخير أيضًا، شكرًا.
      en: Fine too, thanks.
    - speaker: Dimas
      text: Asalamualaikum! Hai, Rina! Hai, Mohamed!
      ar_eg: السلام عليكم! أهلًا يا رينا! أهلًا يا محمد!
      ar: السلام عليكم! مرحبًا يا رينا! مرحبًا يا محمد!
      en: Peace be upon you! Hi, Rina! Hi, Mohamed!
    - speaker: Mohamed
      text: Waalaikumsalam! Apa kabar, Dimas?
      ar_eg: وعليكم السلام! إزيك يا ديماس؟
      ar: وعليكم السلام! كيف حالك يا ديماس؟
      en: And peace be upon you! How are you, Dimas?
    - speaker: Dimas
      text: Baik-baik saja, terima kasih.
      ar_eg: كله تمام، شكرًا.
      ar: كل شيء على ما يرام، شكرًا.
      en: All fine, thanks.
