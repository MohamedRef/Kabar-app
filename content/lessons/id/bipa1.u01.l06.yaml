schema: kabar.lesson/v1
id: bipa1.u01.l06
language: id
title: Bertemu di Kota Tua
can_do:
  ar_eg: تعمل حوار تحية من ٤ سطور.
  ar: أن تُجري حوار تحية من أربعة أسطر.
  en: Hold a 4-line greeting dialogue.
slides:
  - title: Empat langkah
    body:
      ar_eg: |-
        أي مقابلة قصيرة بتمشي في ٤ خطوات:
        ١) سلّم حسب الوقت: Selamat sore!
        ٢) اسأل: Apa kabar?
        ٣) رد وارجع السؤال: Baik, terima kasih. Dan kamu? (أو Dan Bapak? / Dan Ibu? مع الأكبر)
        ٤) ودّع: Sampai jumpa! / Selamat jalan!
        ومع الصحاب استخدم aku وkamu، ومع الأكبر saya وBapak / Ibu.
        أغلب الإندونيسيين مسلمين، فهتسمع كتير «Asalamualaikum» (بتتكتب كمان Assalamualaikum)، والرد «Waalaikumsalam». نفس السلام اللي إنت متعود عليه، بس بنطق إندونيسي. وكتير بيحطوا إيدهم على صدرهم بعد السلام.
      ar: |-
        يسير اللقاء القصير في أربع خطوات:
        ١) حيِّ بحسب الوقت: Selamat sore!
        ٢) اسأل: Apa kabar?
        ٣) أجب وردّ السؤال: Baik, terima kasih. Dan kamu? (أو Dan Bapak? / Dan Ibu? مع الأكبر)
        ٤) ودِّع: Sampai jumpa! / Selamat jalan!
        ومع الأصدقاء استعمل aku وkamu، ومع الأكبر saya وBapak / Ibu.
        أكثر الإندونيسيين مسلمون، فستسمع كثيرًا «Asalamualaikum» (وتُكتب أيضًا Assalamualaikum)، وجوابها «Waalaikumsalam». إنه السلام الذي تعرفه بنطق إندونيسي، وكثيرًا ما توضع اليد على الصدر بعده.
      en: |-
        A short meeting runs in four steps:
        1) greet by time of day: Selamat sore!
        2) ask: Apa kabar?
        3) answer and ask back: Baik, terima kasih. Dan kamu? (or Dan Bapak? / Dan Ibu? with elders)
        4) say goodbye: Sampai jumpa! / Selamat jalan!
        With friends use aku and kamu; with elders, saya and Bapak / Ibu.
        Most Indonesians are Muslim, so you'll often hear "Asalamualaikum" (also written Assalamualaikum), answered with "Waalaikumsalam" — the greeting you know, with Indonesian spelling. People often touch a hand to the chest afterwards.
    grammar: id.greeting.selamat
    examples:
      - text: Selamat sore, Rina! Apa kabar?
        ar_eg: مساء الخير يا رينا! إزيك؟
        ar: مساء الخير يا رينا! كيف حالكِ؟
        en: Good afternoon, Rina! How are you?
      - text: Baik, terima kasih. Dan kamu?
        ar_eg: كويسة، شكرًا. وإنت؟
        ar: بخير، شكرًا. وأنت؟
        en: Fine, thanks. And you?
      - text: Asalamualaikum, Bu! — Waalaikumsalam!
        ar_eg: السلام عليكم يا مدام! — وعليكم السلام!
        ar: السلام عليكم يا سيدتي! — وعليكم السلام!
        en: Peace be upon you, ma'am! — And upon you peace!
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الساعة ٥ العصر وقابلت Rina في كوتا توا. تسلّم إزاي؟
      ar: الساعة الخامسة عصرًا، وقابلت Rina في كوتا توا. بماذا تحيّيها؟
      en: It's 5 p.m. and you meet Rina in Kota Tua. How do you greet her?
    options: ['Selamat pagi, Rina!', 'Selamat sore, Rina!', 'Selamat tinggal, Rina!']
    answer: 1
    explain:
      ar_eg: من ٣ لحد المغرب ده sore. وselamat tinggal للوداع مش للتحية.
      ar: من الثالثة إلى المغرب هو الـ sore، وselamat tinggal للوداع لا للتحية.
      en: 3 p.m. to sunset is sore; selamat tinggal is a goodbye, not a greeting.
    words: [selamat, sore, selamat tinggal]
  - id: e02
    type: listen
    text: Waalaikumsalam
    options: [Asalamualaikum, Salam kenal, Waalaikumsalam]
    answer: 2
    words: [waalaikumsalam]
  - id: e03
    type: fill_blank
    sentence: Selamat datang, Rina! Apa ___?
    meaning:
      ar_eg: أهلًا بيكي يا رينا! إزيك؟
      ar: أهلًا وسهلًا يا رينا! كيف حالكِ؟
      en: Welcome, Rina! How are you?
    answers: [kabar]
    words: [kabar, selamat datang]
    explain:
      ar_eg: Apa kabar? = إزيك؟ الكلمة الناقصة kabar (أخبار).
      ar: Apa kabar؟ والكلمة الناقصة kabar (خبر).
      en: "The missing word is kabar: Apa kabar?"
  - id: e04
    type: fill_blank
    sentence: Kabar baik, terima kasih. ___ kamu?
    meaning:
      ar_eg: كويسة، شكرًا. وإنت؟
      ar: بخير، شكرًا. وأنت؟
      en: I'm fine, thanks. And you?
    answers: [Dan, dan]
    words: [dan]
    explain:
      ar_eg: Dan kamu? = وإنت؟ dan = و، وبنرجّع بيها السؤال.
      ar: Dan kamu؟ = وأنت؟ dan تعني «و».
      en: Dan kamu? = And you? dan means and.
  - id: e05
    type: build_sentence
    source:
      ar_eg: السلام عليكم يا رينا! إزيك؟
      ar: السلام عليكم يا رينا! كيف حالكِ؟
      en: Peace be upon you, Rina! How are you?
    answer: Asalamualaikum, Rina! Apa kabar?
    distractors: [pagi, aku]
    words: [asalamualaikum, apa, kabar]
    explain:
      ar_eg: Asalamualaikum (السلام عليكم) + اسم الشخص + Apa kabar? pagi وaku مش في الجملة.
      ar: Asalamualaikum ثم الاسم ثم Apa kabar؟ pagi وaku زائدتان.
      en: Asalamualaikum, + Rina! + Apa kabar? pagi and aku are extra.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: Raka لسه واصل كوتا توا وإنت مستنيه. تقوله إيه؟
      ar: وصل Raka للتو إلى كوتا توا وأنت تنتظره. ماذا تقول له؟
      en: Raka has just arrived at Kota Tua and you're waiting for him. What do you say?
    options: ['Selamat datang, Raka!', 'Selamat tinggal, Raka!', 'Selamat jalan, Raka!']
    answer: 0
    explain:
      ar_eg: selamat datang = أهلًا بيك للي لسه جاي. selamat tinggal وselamat jalan للوداع.
      ar: selamat datang ترحيب بالقادم، أما selamat tinggal وselamat jalan فللوداع.
      en: selamat datang welcomes someone arriving; selamat tinggal and selamat jalan are goodbyes.
    words: [selamat datang, selamat tinggal]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: Raka قالك «Asalamualaikum!». رد عليه.
      ar: قال لك Raka «Asalamualaikum!». أجبه.
      en: Raka says "Asalamualaikum!". Answer him.
    answers: [Waalaikumsalam!, Waalaikumsalam, Waalaikum salam, Wa'alaikumsalam, Wa'alaikum salam, 'Waalaikumsalam, Raka!', 'Waalaikumsalam, Raka']
    explain:
      ar_eg: نفس «وعليكم السلام» بالكتابة الإندونيسية.
      ar: هي «وعليكم السلام» بالكتابة الإندونيسية.
      en: It's «وعليكم السلام» in Indonesian spelling.
    words: [waalaikumsalam]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (إنت ماشي) مع السلامة يا رينا! أشوفك بكرة.
      ar: (وأنت مغادر) مع السلامة يا رينا! إلى اللقاء غدًا.
      en: (you're the one leaving) Goodbye, Rina! See you tomorrow.
    answers: ['Selamat tinggal, Rina! Sampai jumpa besok.', 'Selamat tinggal, Rina! Sampai jumpa besok', 'Selamat tinggal, Rina. Sampai jumpa besok.', 'Selamat tinggal, Rina. Sampai jumpa besok', Selamat tinggal Rina sampai jumpa besok, 'Selamat tinggal, Rina, sampai jumpa besok!', 'Selamat tinggal, Rina, sampai jumpa besok']
    words: [selamat tinggal, sampai jumpa, besok]
  - id: e09
    type: dictation
    text: Asalamualaikum, Rina!
    meaning:
      ar_eg: السلام عليكم يا رينا!
      ar: السلام عليكم يا رينا!
      en: Peace be upon you, Rina!
    words: [asalamualaikum]
  - id: e10
    type: speaking
    text: Waalaikumsalam! Selamat datang, Raka. Apa kabar?
    meaning:
      ar_eg: وعليكم السلام! أهلًا بيك يا راكا. إزيك؟
      ar: وعليكم السلام! أهلًا بك يا راكا. كيف حالك؟
      en: And peace be upon you! Welcome, Raka. How are you?
    words: [waalaikumsalam, selamat datang, apa, kabar]
dialogue:
  title: Sore di Taman Fatahillah
  lines:
    - speaker: Mohamed
      text: Sore, Rina! Apa kabar?
      ar_eg: مساء الخير يا رينا! إزيك؟
      ar: مساء الخير يا رينا! كيف حالكِ؟
      en: Afternoon, Rina! How are you?
    - speaker: Rina
      text: Kabar baik, terima kasih. Dan kamu?
      ar_eg: كويسة، شكرًا. وإنت؟
      ar: بخير، شكرًا. وأنت؟
      en: I'm fine, thanks. And you?
    - speaker: Mohamed
      text: Baik juga, terima kasih.
      ar_eg: وأنا كمان كويس، شكرًا.
      ar: بخير أيضًا، شكرًا.
      en: Fine too, thanks.
    - speaker: Raka
      text: Asalamualaikum! Hai, Rina! Hai, Mohamed!
      ar_eg: السلام عليكم! أهلًا يا رينا! أهلًا يا محمد!
      ar: السلام عليكم! مرحبًا يا رينا! مرحبًا يا محمد!
      en: Peace be upon you! Hi, Rina! Hi, Mohamed!
    - speaker: Mohamed
      text: Waalaikumsalam! Apa kabar, Raka?
      ar_eg: وعليكم السلام! إزيك يا راكا؟
      ar: وعليكم السلام! كيف حالك يا راكا؟
      en: And peace be upon you! How are you, Raka?
    - speaker: Raka
      text: Baik-baik saja, terima kasih.
      ar_eg: كله تمام، شكرًا.
      ar: كل شيء على ما يرام، شكرًا.
      en: All fine, thanks.
new_words:
  - word: asalamualaikum
    pos: phrase
    ar_eg: السلام عليكم
    ar: السلام عليكم
    en: peace be upon you (Muslim greeting)
    arabic: السلام عليكم
  - word: waalaikumsalam
    pos: phrase
    ar_eg: وعليكم السلام
    ar: وعليكم السلام
    en: and upon you peace (reply)
    arabic: وعليكم السلام
  - word: selamat datang
    pos: phrase
    ar_eg: أهلًا بيك / نوّرت
    ar: أهلًا وسهلًا
    en: welcome
  - word: selamat tinggal
    pos: phrase
    ar_eg: مع السلامة (بيقولها اللي ماشي)
    ar: مع السلامة (يقولها الراحل)
    en: goodbye (said by the one leaving)
