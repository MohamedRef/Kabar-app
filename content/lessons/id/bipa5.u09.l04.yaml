schema: kabar.lesson/v1
id: bipa5.u09.l04
language: id
title: Dari Melayu ke Indonesia
can_do:
  ar_eg: تحكي إزاي لغة الملايو بقت الإندونيسي، ودور الحروف العربية في الحكاية.
  ar: أن تحكي كيف صارت الملايوية لغةً إندونيسية، ودور الحرف العربي في ذلك.
  en: Tell how Malay became Indonesian, and the part Arabic script played.
slides:
  - title: Bahasa para pedagang
    body:
      ar_eg: |
        الإندونيسي أصلها لغة الملايو، لغة التجارة في الجزر من قرون:
        - bahasa Melayu = لغة الملايو، وأقدم نقوشها من مملكة سريفيجايا في القرن السابع
        - menyebar = ينتشر: انتشرت مع التجار ومع الإسلام
        - huruf Jawi = الحروف العربية لما بتتكتب بيها الملايو، من حوالي القرن ١٤
        - في ١٩٢٨ الشباب سمّوها «bahasa Indonesia»، ودستور ١٩٤٥ خلاها bahasa resmi = اللغة الرسمية للدولة
        - bahasa pengantar = لغة التدريس في المدارس والجامعات
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: aku = saya، nggak = tidak، nyebar = menyebar، bareng = bersama، banget = sekali.
      ar: |
        أصل الإندونيسية لغة الملايو، لغة التجارة في الجزر منذ قرون:
        - bahasa Melayu = لغة الملايو، وأقدم نقوشها من مملكة سريفيجايا في القرن السابع
        - menyebar = ينتشر: انتشرت مع التجّار ومع الإسلام
        - huruf Jawi = الحرف العربي حين تُكتب به الملايوية، منذ نحو القرن الرابع عشر
        - وفي ١٩٢٨ سمّاها الشباب «bahasa Indonesia»، وجعلها دستور ١٩٤٥ bahasa resmi = اللغة الرسمية للدولة
        - bahasa pengantar = لغة التدريس في المدارس والجامعات
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: aku = saya، nggak = tidak، nyebar = menyebar، bareng = bersama، banget = sekali.
      en: |
        Indonesian grew out of Malay, the islands' trade language for centuries:
        - bahasa Melayu = Malay; its oldest inscriptions come from 7th-century Srivijaya
        - menyebar = to spread: it spread with traders and with Islam
        - huruf Jawi = Arabic letters used to write Malay, from about the 14th century
        - In 1928 young nationalists named it «bahasa Indonesia», and the 1945 Constitution made it the bahasa resmi = official language
        - bahasa pengantar = language of instruction in schools and universities
        The dialogue uses street forms; the formal ones are beside them: aku = saya, nggak = tidak, nyebar = menyebar, bareng = bersama, banget = sekali.
    examples:
      - text: Dulu banyak kitab Melayu ditulis dengan huruf Jawi.
        ar_eg: زمان كتب ملايو كتير كانت بتتكتب بالحروف العربية.
        ar: قديمًا كُتبت كتب ملايوية كثيرة بالحرف العربي.
        en: Many Malay books were once written in Jawi script.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bahasa Melayu
        ar_eg: لغة الملايو
        ar: الملايوية
        en: Malay
      - text: huruf Jawi
        ar_eg: الحروف العربية للملايو
        ar: الحرف العربي الملايوي
        en: Jawi script
      - text: menyebar
        ar_eg: ينتشر
        ar: ينتشر
        en: to spread
      - text: bahasa pengantar
        ar_eg: لغة التدريس
        ar: لغة التدريس
        en: language of instruction
      - text: bahasa resmi
        ar_eg: اللغة الرسمية
        ar: اللغة الرسمية
        en: official language
    words: [bahasa Melayu, huruf Jawi, menyebar, bahasa pengantar, bahasa resmi, huruf]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «huruf Jawi» يعني إيه؟
      ar: ما «huruf Jawi»؟
      en: What is "huruf Jawi"?
    options:
      - حروف جاوية قديمة.
      - الحروف العربية لما بتتكتب بيها الملايو.
      - الحروف اللاتينية.
    answer: 1
    explain:
      ar_eg: Jawi مش Jawa! هي حروف عربية زيادة عليها حروف زي چ وڠ عشان أصوات الملايو.
      ar: Jawi ليست Jawa، بل حروف عربية أُضيفت إليها حروف مثل چ وڠ لأصوات الملايوية.
      en: Jawi isn't Javanese; it's Arabic script with extra letters such as چ and ڠ for Malay sounds.
    words: [huruf Jawi, huruf]
  - id: e03
    type: listen
    text: Bahasa Melayu menyebar ke seluruh Nusantara lewat perdagangan.
    question:
      ar_eg: لغة الملايو انتشرت إزاي؟
      ar: كيف انتشرت الملايوية؟
      en: How did Malay spread?
    options:
      - عن طريق الحروب.
      - عن طريق المدارس الهولندية.
      - عن طريق التجارة.
    answer: 2
    words: [bahasa Melayu, menyebar]
  - id: e04
    type: fill_blank
    sentence: Bahasa Indonesia adalah ___ di Indonesia, tetapi bahasa daerah tetap dilestarikan.
    meaning:
      ar_eg: الإندونيسي هي اللغة الرسمية في إندونيسيا، بس اللغات المحلية بيتحافظ عليها برضه.
      ar: الإندونيسية هي اللغة الرسمية في إندونيسيا، مع الحفاظ على اللغات المحلية.
      en: Indonesian is the official language of Indonesia, but regional languages are still preserved.
    options: [bahasa resmi, huruf Jawi, bahasa gaul]
    answers: [bahasa resmi]
    words: [bahasa resmi, bahasa daerah, huruf]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الإندونيسي بقت لغة التدريس في المدارس.
      ar: صارت الإندونيسية لغة التدريس في المدارس.
      en: Indonesian became the language of instruction in schools.
    answer: Bahasa Indonesia menjadi bahasa pengantar di sekolah.
    distractors: [Jawi, resmi]
    words: [bahasa pengantar]
  - id: e06
    type: translate
    direction: from_target
    source_text: Dulu banyak kitab Melayu ditulis dengan huruf Jawi.
    answers_meaning:
      ar_eg:
        - زمان كتب ملايو كتير كانت مكتوبة بالحروف العربية.
        - قديمًا كتب كتير بالملايو اتكتبت بحروف جاوي.
      ar:
        - قديمًا كُتبت كتب ملايوية كثيرة بالحرف العربي.
        - كانت كثير من الكتب الملايوية تُكتب قديمًا بالخطّ الجاوي.
      en:
        - Many Malay books used to be written in Jawi script.
        - In the past, many Malay texts were written in Arabic letters.
    words: [huruf Jawi, huruf]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «Bahasa Indonesia berasal dari bahasa ___.» تحط إيه؟
      ar: ماذا تضع في «Bahasa Indonesia berasal dari bahasa ___.»؟
      en: Which fits "Bahasa Indonesia berasal dari bahasa ___."?
    options: [Melayu, Jawa, Belanda]
    answer: 0
    explain:
      ar_eg: الجاوي أكبر لغة أم في إندونيسيا، بس الإندونيسي أصلها الملايو.
      ar: الجاوية أكبر لغة أمّ في إندونيسيا، لكنّ أصل الإندونيسية الملايوية.
      en: Javanese has the most native speakers, but Indonesian comes from Malay.
    words: [bahasa Melayu, berasal dari]
  - id: e08
    type: speaking
    text: Bahasa Indonesia adalah bahasa resmi, tetapi akarnya bahasa Melayu.
    meaning:
      ar_eg: الإندونيسي هي اللغة الرسمية، بس جذرها الملايو.
      ar: الإندونيسية هي اللغة الرسمية، لكنّ جذورها ملايوية.
      en: Indonesian is the official language, but its roots are Malay.
    words: [bahasa resmi, bahasa Melayu]
  - id: e09
    type: dictation
    text: Bahasa pengantar di kampus ini adalah bahasa Indonesia.
    meaning:
      ar_eg: لغة التدريس في الجامعة دي هي الإندونيسي.
      ar: لغة التدريس في هذه الجامعة هي الإندونيسية.
      en: The language of instruction at this university is Indonesian.
    words: [bahasa pengantar]
  - id: e10
    type: fill_blank
    sentence: Islam dan perdagangan membantu bahasa Melayu ___ ke banyak pulau.
    meaning:
      ar_eg: الإسلام والتجارة ساعدوا الملايو تنتشر في جزر كتير.
      ar: ساعد الإسلامُ والتجارةُ الملايويةَ على الانتشار في جزر كثيرة.
      en: Islam and trade helped Malay spread to many islands.
    options: [menyebar, berubah, mewakili]
    answers: [menyebar]
    words: [menyebar]
dialogue:
  title: Di Istana Kadriah
  lines:
    - speaker: Mas Rizal
      text: Ini Istana Kadriah. Pendiri Pontianak keturunan Arab dari Hadramaut.
      ar_eg: ده قصر القادرية. مؤسس بونتياناك أصله عربي من حضرموت.
      ar: هذا قصر القادرية، ومؤسّس بونتياناك عربيّ الأصل من حضرموت.
      en: This is the Kadriah Palace. Pontianak's founder was of Hadhrami Arab descent.
    - speaker: Mohamed
      text: Lihat, Mas! Tulisan di naskah ini huruf Arab, tapi aku nggak paham artinya.
      ar_eg: بص يا ريزال! الكتابة في المخطوطة دي حروف عربي، بس مش فاهم معناها.
      ar: انظر يا ريزال! الكتابة في هذه المخطوطة بحروف عربية، لكنّي لا أفهم معناها.
      en: Look, Mas! This manuscript is in Arabic letters, but I can't understand it.
    - speaker: Mas Rizal
      text: Itu huruf Jawi. Bahasanya Melayu, bukan Arab.
      ar_eg: دي حروف جاوي. اللغة ملايو، مش عربي.
      ar: هذا خطّ جاوي، واللغة ملايوية لا عربية.
      en: That's Jawi script. The language is Malay, not Arabic.
    - speaker: Mohamed
      text: Jadi huruf Arab ikut nyebar bareng bahasa Melayu. Menarik banget!
      ar_eg: يعني الحروف العربية انتشرت مع لغة الملايو. حاجة جميلة أوي!
      ar: إذن انتشر الحرف العربي مع الملايوية. هذا ممتع حقًا!
      en: So Arabic script spread along with Malay. Fascinating!
