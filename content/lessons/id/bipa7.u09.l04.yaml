language: id
title: Pela gandong
can_do:
  ar_eg: تشرح «بيلا جاندونج»، الأخوّة اللي بتربط قرى في مالوكو حتى لو دينهم مختلف.
  ar: أن تشرح «بيلا غاندونغ»، الأخوّة التي تربط قرى مالوكو وإن اختلفت أديانها.
  en: Explain pela gandong, the brotherhood that binds Maluku villages even across religions.
slides:
  - title: Saudara antar-negeri
    body:
      ar_eg: |
        في مالوكو القرية العُرفية اسمها negeri.
        - الـ pela gandong ikatan (رابطة) بين negeri واتنين أو أكتر. الأجداد bersumpah (حلفوا) إنهم يبقوا إخوات للأبد.
        - pela = حلف / عهد بين قرى، وgandong = إخوات من بطن واحدة (زي «kandung»).
        - كتير من الروابط دي بتجمع negeri مسلمة وnegeri مسيحية. مثال مشهور: Batu Merah (مسلمة) وPasso (مسيحية) في أمبون.
        - لو قرية بتبني جامع أو كنيسة، قرية الـ pela بتيجي تساعد.
        - كل كام سنة بيعملوا احتفال اسمه «panas pela» علشان يجدّدوا العهد.
      ar: |
        تُسمّى القرية العرفية في مالوكو negeri.
        - والـ pela gandong ikatan (رابطة) بين negeri أو أكثر، bersumpah (أقسم) فيها الأجداد على الأخوّة الدائمة.
        - pela = حلف بين القرى، وgandong = إخوة من رحم واحدة (مثل «kandung»).
        - وكثير من هذه الروابط يجمع negeri مسلمة بأخرى مسيحية، ومن أشهرها Batu Merah (مسلمة) وPasso (مسيحية) في أمبون.
        - وإن بنت قرية مسجدًا أو كنيسة جاءت قرية الـ pela تعينها.
        - وكلّ بضع سنوات يقيمون احتفالًا يُسمّى «panas pela» لتجديد العهد.
      en: |
        In Maluku a customary village is called a negeri.
        - Pela gandong is an ikatan (bond) between two or more negeri. The ancestors bersumpah (swore an oath) to be brothers forever.
        - pela = a pact between villages; gandong = siblings from one womb (like "kandung").
        - Many of these bonds join a Muslim negeri with a Christian one. A famous pair: Batu Merah (Muslim) and Passo (Christian) in Ambon.
        - When one village builds a mosque or church, its pela village comes to help.
        - Every few years they hold a "panas pela" ceremony to renew the pact.
    examples:
      - text: Ikatan pela gandong itu lebih tua daripada negara Indonesia.
        ar_eg: رابطة البيلا جاندونج دي أقدم من دولة إندونيسيا نفسها.
        ar: رابطة البيلا غاندونغ أقدم من دولة إندونيسيا ذاتها.
        en: The pela gandong bond is older than the Indonesian state.
