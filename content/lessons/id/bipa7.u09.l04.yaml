      - text: bersumpah
        ar_eg: يحلف
        ar: يُقسم
        en: to swear an oath
      - text: negeri
        ar_eg: قرية عُرفية (مالوكو)
        ar: قرية عرفية (مالوكو)
        en: customary village (Maluku)
      - text: kerukunan
        ar_eg: وئام
        ar: وئام
        en: harmony
    words: [pela gandong, ikatan, bersumpah, negeri, kerukunan]
  - id: e02
    type: listen
    text: Negeri Batu Merah dan Negeri Passo punya ikatan pela sejak dulu.
    question:
      ar_eg: إيه اللي بين باتو ميراه وباسو؟
      ar: ما الذي يجمع باتو ميراه وباسو؟
      en: What links Batu Merah and Passo?
    options:
      - خناقة قديمة.
      - رابطة بيلا من زمان.
      - طريق سريع.
    answer: 1
    words: [negeri, ikatan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: لو قرية بتبني جامع، قرية الـ pela بتاعتها بتعمل إيه؟
      ar: إن بنت قرية مسجدًا، فماذا تفعل قرية الـ pela؟
      en: If a village builds a mosque, what does its pela village do?
    options:
      - تعترض.
      - تبني جامع أكبر.
      - تيجي تساعد في البنا، حتى لو مسيحية.
    answer: 2
    words: [pela gandong]
  - id: e04
    type: fill_blank
    sentence: Leluhur kedua negeri ___ untuk saling melindungi selamanya.
    meaning:
      ar_eg: أجداد القريتين حلفوا إنهم يحموا بعض للأبد.
      ar: أقسم أجداد القريتين أن يحمي بعضهم بعضًا إلى الأبد.
      en: The ancestors of both villages swore to protect each other forever.
    options: [bersumpah, berperang, merajut]
    answers: [bersumpah]
    words: [bersumpah, negeri]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كلمة «gandong» قريبة من أنهي كلمة إندونيسية؟
      ar: من أيّ كلمة إندونيسية تقترب «gandong»؟
      en: Which Indonesian word is "gandong" close to?
    options:
      - kandung (من نفس البطن)
      - gunung (جبل)
      - gendang (طبلة)
    answer: 0
    words: [pela gandong]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الرابطة دي بتجمع مسلمين ومسيحيين.
      ar: تجمع هذه الرابطة مسلمين ومسيحيين.
      en: This bond unites Muslims and Christians.
    answer: Ikatan ini menyatukan orang Islam dan orang Kristen.
    distractors: [negeri, sumpah]
    words: [ikatan]
  - id: e07
    type: translate
    direction: from_target
    source_text: Setiap beberapa tahun, kedua negeri bertemu untuk mengulang sumpah pela.
    answers_meaning:
      ar_eg:
        - كل كام سنة، القريتين بيتقابلوا علشان يجدّدوا حلف البيلا.
        - كل شوية سنين، القريتين بيتجمّعوا ويعيدوا العهد.
      ar:
        - كلّ بضع سنوات تلتقي القريتان لتجديد قسم البيلا.
        - تجتمع القريتان كلّ بضع سنين لتعيدا عهد البيلا.
      en:
        - Every few years, the two villages meet to renew the pela oath.
        - Every few years both villages gather to repeat their pact.
    words: [negeri, bersumpah]
  - id: e08
    type: speaking
    text: Pela gandong mengajarkan bahwa beda agama tidak memutus persaudaraan.
    meaning:
      ar_eg: البيلا جاندونج بتعلّمنا إن اختلاف الدين مايقطعش الأخوّة.
      ar: تعلّمنا البيلا غاندونغ أنّ اختلاف الدين لا يقطع الأخوّة.
      en: Pela gandong teaches that different faiths don't break brotherhood.
    words: [pela gandong]
  - id: e09
    type: dictation
    text: Ikatan pela gandong menjaga kerukunan di Maluku.
    meaning:
      ar_eg: رابطة البيلا جاندونج بتحافظ على الوئام في مالوكو.
      ar: تحفظ رابطة البيلا غاندونغ الوئام في مالوكو.
      en: The pela gandong bond keeps harmony in Maluku.
    words: [ikatan, pela gandong, kerukunan]
  - id: e10
    type: speaking
    text: Orang dari negeri pela harus diperlakukan seperti saudara sendiri.
    meaning:
      ar_eg: اللي من قرية البيلا لازم يتعامل زي أخوك بالظبط.
      ar: يُعامَل ابن قرية البيلا معاملة الأخ الشقيق.
      en: Someone from a pela village must be treated like your own sibling.
    words: [negeri, bersumpah]
dialogue:
  title: Cerita mama dari Ambon
  lines:
    - speaker: Kak Yosua
      text: Mama saya orang Passo. Waktu kecil, saya ikut membangun masjid di Batu Merah.
      ar_eg: ماما من باسو. وأنا صغيّر، شاركت في بنا جامع في باتو ميراه.
      ar: أمّي من باسو، وفي صغري شاركت في بناء مسجد في باتو ميراه.
      en: My mother's from Passo. As a kid, I helped build a mosque in Batu Merah.
    - speaker: Mohamed
      text: Kakak orang Kristen, tetapi membangun masjid? Kenapa?
      ar_eg: إنت مسيحي، وبنيت جامع؟ ليه؟
      ar: أنت مسيحيّ وبنيت مسجدًا؟ لماذا؟
      en: You're Christian, but you built a mosque? Why?
    - speaker: Kak Yosua
      text: Karena pela gandong. Leluhur kami bersumpah bahwa kedua negeri itu bersaudara.
      ar_eg: علشان البيلا جاندونج. أجدادنا حلفوا إن القريتين إخوات.
      ar: بسبب البيلا غاندونغ، فقد أقسم أجدادنا أنّ القريتين أخوان.
      en: Because of pela gandong. Our ancestors swore the two villages are siblings.
    - speaker: Mohamed
      text: Ikatan yang indah sekali. Lebih kuat dari tembok mana pun.
      ar_eg: رابطة حلوة أوي. أقوى من أي حيطة.
      ar: رابطة بديعة، أمتن من أيّ جدار.
      en: What a beautiful bond. Stronger than any wall.
