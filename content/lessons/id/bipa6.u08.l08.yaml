schema: kabar.lesson/v1
id: bipa6.u08.l08
language: id
title: Penjelasan dokter
can_do:
  ar_eg: تفهم شرح الدكتور للالتهاب والمضاد الحيوي والهضم والنبض.
  ar: أن تفهم شرح الطبيب للالتهاب والمضاد الحيوي والهضم والنبض.
  en: Follow a doctor explaining inflammation, antibiotics, digestion and pulse.
slides:
  - title: Di ruang praktik
    body:
      ar_eg: |
        الدكتور بيشرح ببساطة، بس بكلمات علمية:
        radang = التهاب (radang tenggorokan). kuman = ميكروب، جرثومة. antibiotik = مضاد حيوي.
        kelenjar = غدة (الغدد بتنفخ لما يبقى فيه التهاب). nadi = نبض؛ وكمان شريان (denyut nadi).
        sendi = مفصل. pencernaan = الهضم (من cerna). sindrom = متلازمة.
      ar: |
        يشرح الطبيب ببساطة، لكن بكلمات علمية:
        radang = التهاب (radang tenggorokan). kuman = جرثومة. antibiotik = مضاد حيوي.
        kelenjar = غدّة (تتورّم الغدد مع الالتهاب). nadi = نبض؛ وشريان أيضًا (denyut nadi).
        sendi = مفصِل. pencernaan = الهضم (من cerna). sindrom = متلازمة.
      en: |
        The doctor explains simply, but with scientific words:
        radang = inflammation (radang tenggorokan). kuman = germ. antibiotik = antibiotic.
        kelenjar = gland (glands swell with inflammation). nadi = pulse; also artery (denyut nadi).
        sendi = joint. pencernaan = digestion (from cerna). sindrom = syndrome.
    examples:
      - text: Radang tenggorokan ini disebabkan kuman.
        ar_eg: التهاب الزور ده سببه ميكروب.
        ar: سبب التهاب الحلق هذا جرثومة.
        en: This sore throat is caused by germs.
      - text: Antibiotik tidak bisa membunuh virus.
        ar_eg: المضاد الحيوي ما بيقتلش الفيروس.
        ar: لا يقتل المضاد الحيوي الفيروسات.
        en: Antibiotics can't kill viruses.
      - text: Dokter memeriksa denyut nadi dan kelenjar di leher.
        ar_eg: الدكتور كشف على النبض والغدد في الرقبة.
        ar: فحص الطبيب النبض والغدد في الرقبة.
        en: The doctor checked the pulse and the glands in the neck.
