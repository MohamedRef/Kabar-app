  - id: e03
    type: listen
    text: Cuci tangan sebelum makan supaya kuman tidak masuk.
    question:
      ar_eg: بنغسل إيدينا عشان إيه؟
      ar: لماذا نغسل أيدينا؟
      en: Why do we wash our hands?
    options: [الميكروبات, الأكل, الميه]
    answer: 0
    meaning:
      ar_eg: اغسل إيدك قبل الأكل عشان الميكروبات ما تدخلش.
      ar: اغسل يديك قبل الأكل كي لا تدخل الجراثيم.
      en: Wash your hands before eating so germs don't get in.
    words: [kuman]
  - id: e04
    type: fill_blank
    sentence: Kakek sering sakit di ___ lutut kalau udara dingin.
    meaning:
      ar_eg: جدي كتير بيوجعه ___ الركبة لما الجو يبرد.
      ar: كثيرًا ما يتألّم جدّي في ___ الركبة حين يبرد الجو.
      en: Grandpa's knee ___ often hurts in cold weather.
    options: [sendi, nadi, sindrom]
    answers: [sendi]
    words: [sendi, nadi, sindrom]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الدكتور بيدّي إيه لعدوى بكتيرية؟
      ar: ماذا يصف الطبيب لعدوى بكتيرية؟
      en: What does a doctor give for a bacterial infection?
    options: [kelenjar, antibiotik, pencernaan]
    answer: 1
    explain:
      ar_eg: antibiotik = مضاد حيوي، للبكتيريا مش للفيروسات.
      ar: antibiotik = مضاد حيوي، للبكتيريا لا للفيروسات.
      en: 'antibiotik = antibiotic: for bacteria, not viruses.'
    words: [antibiotik, kelenjar, pencernaan]
  - id: e06
    type: fill_blank
    sentence: Makan sayur dan buah baik untuk ___.
    meaning:
      ar_eg: أكل الخضار والفاكهة كويس لـ ___.
      ar: أكل الخضار والفاكهة مفيد لـ ___.
      en: Eating vegetables and fruit is good for ___.
    options: [pencernaan, radang, kuman]
    answers: [pencernaan]
    words: [pencernaan, radang, kuman]
  - id: e07
    type: multiple_choice
    question: Tenggorokan merah dan sakit. Itu tanda ___.
    options: [sendi, sindrom, radang]
    answer: 2
    explain:
      ar_eg: 'زور أحمر وبيوجع = التهاب: radang.'
      ar: 'حلق أحمر مؤلم = التهاب: radang.'
      en: 'A red, sore throat = inflammation: radang.'
    words: [radang, sendi, sindrom]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الدكتور قاس النبض بتاعي.
      ar: قاس الطبيب نبضي.
      en: The doctor took my pulse.
    answer: Dokter memeriksa denyut nadi saya.
    distractors: [kelenjar, sendi]
    words: [nadi]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kelenjar di leher membengkak karena radang.
    answers_meaning:
      ar_eg: [الغدد اللي في الرقبة نفخت بسبب الالتهاب, غدد الرقبة ورمت من الالتهاب]
      ar: [تورّمت الغدد في الرقبة بسبب الالتهاب]
      en: [The glands in the neck swelled because of inflammation, Neck glands swell with inflammation]
    words: [kelenjar, radang]
  - id: e10
    type: speaking
    text: Antibiotik ini baik untuk radang, tapi bisa mengganggu pencernaan.
    meaning:
      ar_eg: المضاد الحيوي ده كويس للالتهاب، بس ممكن يتعب الهضم.
      ar: هذا المضاد الحيوي جيد للالتهاب، لكنه قد يربك الهضم.
      en: This antibiotic is good for inflammation, but it can upset digestion.
    words: [antibiotik, radang, pencernaan]
dialogue:
  lines:
    - speaker: Dokter
      text: Tenggorokan Bapak merah. Ini radang.
      ar_eg: زورك أحمر يا أستاذ. ده التهاب.
      ar: حلقك أحمر يا سيدي. هذا التهاب.
      en: Your throat is red. It's inflamed.
    - speaker: Mohamed
      text: Apa saya perlu antibiotik, Dok?
      ar_eg: محتاج مضاد حيوي يا دكتور؟
      ar: هل أحتاج مضادًا حيويًا يا دكتور؟
      en: Do I need antibiotics, doctor?
    - speaker: Dokter
      text: Belum tentu. Kalau penyebabnya virus, antibiotik tidak berguna. Kalau kuman bakteri, baru perlu.
      ar_eg: مش أكيد. لو السبب فيروس، المضاد الحيوي مالوش لازمة. لو بكتيريا، ساعتها محتاجه.
      ar: ليس بالضرورة. إن كان السبب فيروسًا فلا فائدة من المضاد الحيوي، وإن كان جرثومة بكتيرية فعندها نحتاجه.
      en: Not necessarily. If it's a virus, antibiotics won't help. If it's bacteria, then yes.
    - speaker: Mohamed
      text: Kelenjar di leher saya juga sakit.
      ar_eg: والغدد اللي في رقبتي بتوجعني كمان.
      ar: والغدد في رقبتي تؤلمني أيضًا.
      en: The glands in my neck hurt too.
    - speaker: Dokter
      text: Itu biasa. Denyut nadi Bapak bagus. Banyak minum dan istirahat, ya.
      ar_eg: ده طبيعي. نبضك كويس. اشرب كتير وارتاح.
      ar: هذا طبيعي. نبضك جيد. أكثِر من الشرب واسترح.
      en: That's normal. Your pulse is fine. Drink lots and rest.
