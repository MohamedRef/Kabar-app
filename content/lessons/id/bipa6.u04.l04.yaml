schema: kabar.lesson/v1
id: bipa6.u04.l04
language: id
title: Pelayaran kuno
can_do:
  ar_eg: تتكلم عن إزاي البحارة زمان كانوا بيعدّوا البحور بالريح والمراكب.
  ar: أن تتحدّث عن عبور البحّارة القدماء البحار بالرياح والسفن.
  en: Talk about how ancient sailors crossed the seas with wind and ships.
slides:
  - title: Menunggu angin
    body:
      ar_eg: |
        زمان مافيش مكن. المراكب كانت مستنية الـ angin muson (رياح الموسم): ست شهور بتهب في اتجاه، وست شهور في الاتجاه التاني.
        - pelayaran = رحلة بحرية / الملاحة
        - nakhoda = قبطان المركب (الكلمة جاية من الفارسي ناخدا)
        - awak kapal = طاقم المركب
        - muatan = الحمولة: توابل، حرير، خزف
        على حيطان معبد بوروبودور فيه صورة مركب منقوشة. وفي ٢٠٠٣–٢٠٠٤ اتعملت نسخة منه اسمها Samudra Raksa ووصلت لأفريقيا.
        - في الشارع: banget = sekali (أوي)، emang = memang (فعلًا).
      ar: |
        لم تكن هناك محرّكات قديمًا، فكانت السفن تنتظر الـ angin muson (الرياح الموسمية): ستّة أشهر تهبّ في اتّجاه وستّة في الاتّجاه المعاكس.
        - pelayaran = رحلة بحرية، الملاحة
        - nakhoda = ربّان السفينة (من الفارسية ناخدا)
        - awak kapal = طاقم السفينة
        - muatan = الحمولة: توابل وحرير وخزف
        وعلى جدران معبد بوروبودور نقشُ سفينة، صُنعت منها نسخة سُمّيت Samudra Raksa وأبحرت إلى أفريقيا في ٢٠٠٣–٢٠٠٤.
        - في كلام الشارع: banget = sekali (جدًّا)، emang = memang (حقًّا).
      en: |
        There were no engines. Ships waited for the angin muson (monsoon winds): six months blowing one way, six months the other.
        - pelayaran = voyage, seafaring
        - nakhoda = ship's captain (from Persian nākhudā)
        - awak kapal = crew
        - muatan = cargo: spices, silk, porcelain
        A ship is carved on the walls of Borobudur. In 2003–2004 a replica, the Samudra Raksa, sailed all the way to Africa.
        - On the street: banget = sekali (very), emang = memang (indeed).
    examples:
      - text: Nakhoda menunggu angin muson sebelum memulai pelayaran ke Tiongkok.
        ar_eg: القبطان استنى رياح الموسم قبل ما يبدأ الرحلة للصين.
        ar: انتظر الربّان الرياح الموسمية قبل أن يبدأ رحلته إلى الصين.
        en: The captain waited for the monsoon before starting the voyage to China.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pelayaran
        ar_eg: رحلة بحرية
        ar: رحلة بحرية
        en: voyage
      - text: nakhoda
        ar_eg: قبطان
        ar: ربّان
        en: ship's captain
      - text: awak kapal
        ar_eg: طاقم المركب
        ar: طاقم السفينة
        en: crew
      - text: muatan
        ar_eg: حمولة
        ar: حمولة
        en: cargo
      - text: angin muson
        ar_eg: رياح الموسم
        ar: رياح موسمية
        en: monsoon wind
    words: [pelayaran, nakhoda, awak kapal, muatan, angin muson]
  - id: e02
    type: listen
    text: Muatan kapal itu adalah lada, kain sutra, dan piring dari Tiongkok.
    question:
      ar_eg: المركب كانت شايلة إيه؟
      ar: ماذا كانت السفينة تحمل؟
      en: What was the ship carrying?
    options:
      - عربيات وموتوسيكلات.
      - شطة وحرير وأطباق من الصين.
      - رز وسمك بس.
    answer: 1
    words: [muatan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: المراكب القديمة كانت بتستنى إيه قبل ما تسافر؟
      ar: ماذا كانت السفن القديمة تنتظر قبل الإبحار؟
      en: What did old ships wait for before setting off?
    options:
      - إذن من الحكومة.
      - البترول.
      - رياح الموسم.
    answer: 2
    words: [angin muson]
  - id: e04
    type: fill_blank
    sentence: Semua ___ harus naik ke kapal sebelum matahari terbit.
    meaning:
      ar_eg: كل الطاقم لازم يطلع المركب قبل الشمس ما تطلع.
      ar: على الطاقم كلّه أن يصعد إلى السفينة قبل شروق الشمس.
      en: The whole crew must board before sunrise.
    options: [awak kapal, muatan, angin muson]
    answers: [awak kapal]
    words: [awak kapal]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «nakhoda» جاية منين؟
      ar: من أين أتت كلمة «nakhoda»؟
      en: Where does "nakhoda" come from?
    options:
      - من الفارسي.
      - من الإنجليزي.
      - من الياباني.
    answer: 0
    explain:
      ar_eg: ناخدا بالفارسي يعني صاحب المركب، وهي كمان معروفة في عربي الخليج «نوخذة».
      ar: ناخدا بالفارسية تعني سيّد السفينة، وتُعرف في عربية الخليج «نوخذة».
      en: Persian nākhudā means ship's master; Gulf Arabic has it too, as nōkhidha.
    words: [nakhoda]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الرحلة للهند خدت شهرين.
      ar: استغرقت الرحلة البحرية إلى الهند شهرين.
      en: The voyage to India took two months.
    answer: Pelayaran ke India memakan waktu dua bulan.
    distractors: [muatan, nakhoda]
    words: [pelayaran]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: القبطان كان عارف البحر كويس.
      ar: كان الربّان يعرف البحر جيّدًا.
      en: The captain knew the sea well.
    answers:
      - Nakhoda itu mengenal laut dengan baik.
      - Nakhoda itu tahu laut dengan baik.
      - Nakhoda itu sangat mengenal laut.
      - Nakhoda mengenal laut dengan baik.
    words: [nakhoda]
  - id: e08
    type: speaking
    text: Angin muson membawa kapal dagang dari India ke Sumatra.
    meaning:
      ar_eg: رياح الموسم كانت بتجيب مراكب التجارة من الهند لسومطرة.
      ar: كانت الرياح الموسمية تحمل السفن التجارية من الهند إلى سومطرة.
      en: The monsoon carried trading ships from India to Sumatra.
    words: [angin muson]
  - id: e09
    type: dictation
    text: Awak kapal menurunkan muatan di pelabuhan Palembang.
    meaning:
      ar_eg: الطاقم نزّل الحمولة في ميناء باليمبانج.
      ar: أنزل الطاقم الحمولة في ميناء باليمبانغ.
      en: The crew unloaded the cargo at Palembang harbour.
    words: [awak kapal, muatan]
  - id: e10
    type: fill_blank
    sentence: Replika kapal Borobudur melakukan ___ sampai ke Afrika.
    meaning:
      ar_eg: نسخة مركب بوروبودور عملت رحلة بحرية لحد أفريقيا.
      ar: قامت نسخة سفينة بوروبودور برحلة بحرية حتى أفريقيا.
      en: The Borobudur ship replica made a voyage all the way to Africa.
    options: [pelayaran, nakhoda, awak kapal]
    answers: [pelayaran]
    words: [pelayaran]
dialogue:
  title: Kapal di dinding candi
  lines:
    - speaker: Kak Dewi
      text: Lihat relief ini, Mohamed. Ini kapal dari abad ke-8.
      ar_eg: بص على النقش ده يا محمد. ده مركب من القرن التامن.
      ar: انظر إلى هذا النقش يا محمد، إنها سفينة من القرن الثامن.
      en: Look at this relief, Mohamed. It's a ship from the eighth century.
    - speaker: Mohamed
      text: Besar banget! Berapa jumlah awak kapal, Kak?
      ar_eg: كبيرة أوي! كان طاقمها كام واحد؟
      ar: ضخمة! كم كان عدد طاقمها؟
      en: It's huge! How big was the crew, Kak?
    - speaker: Kak Dewi
      text: Mungkin lima puluh orang. Nakhodanya harus tahu kapan angin muson datang.
      ar_eg: يمكن خمسين واحد. والقبطان لازم يعرف رياح الموسم هتيجي إمتى.
      ar: ربّما خمسون رجلًا. وكان على الربّان أن يعرف متى تهبّ الرياح الموسمية.
      en: Maybe fifty people. The captain had to know when the monsoon would come.
    - speaker: Mohamed
      text: Kata nakhoda mirip kata Arab Teluk, "nokhidha". Pelayaran emang menghubungkan kita.
      ar_eg: كلمة nakhoda شبه كلمة الخليج «نوخذة». البحر فعلًا رابطنا ببعض.
      ar: كلمة nakhoda تشبه «نوخذة» في الخليج، فالملاحة وصلت بيننا حقًا.
      en: The word nakhoda is like Gulf Arabic "nokhidha". Seafaring really connects us.
