schema: kabar.lesson/v1
id: bipa5.u10.l09
language: id
title: Laporan dari perjalanan
can_do:
  ar_eg: 'تكتب تقرير رحلة: الأقطاب والقارات والمحيطات، المدق والفيلا، الزينة والألعاب النارية، وتستكشف وتوصي.'
  ar: 'أن تكتب تقرير رحلة: الأقطاب والقارات والمحيطات، والممرّ الجبلي والفيلا، والزينة والألعاب النارية، والاستكشاف والتوصية.'
  en: 'Write a travel report: poles, continents and oceans, the trek and the villa, decorations and fireworks, exploring and recommending.'
slides:
  - title: Dari Kalimantan ke seluruh dunia
    body:
      ar_eg: |
        menjelajahi = يستكشف (menjelajahi hutan)، kutub = قطب (Kutub Utara = القطب الشمالي، وkompas = بوصلة)، trek = مدق، طريق مشي في الجبل أو الغابة.
        benua = قارة (Benua Asia)، samudera = محيط (Samudera Hindia = المحيط الهندي؛ والرسمي samudra).
        villa = فيلا، hiasan = زينة (hiasan lampion)، kembang api = ألعاب نارية.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: udah = sudah، aku = saya، nulis = menulis، nggak = tidak، deket = dekat، rekomendasiin = merekomendasikan، kayak = seperti.
      ar: |
        menjelajahi = يستكشف (menjelajahi hutan)، kutub = قطب (Kutub Utara = القطب الشمالي، وkompas = بوصلة)، trek = درب، مسار مشي في الجبل أو الغابة.
        benua = قارة (Benua Asia)، samudera = محيط (Samudera Hindia = المحيط الهندي؛ والمعيارية samudra).
        villa = فيلا، hiasan = زينة (hiasan lampion)، kembang api = ألعاب نارية.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: udah = sudah، aku = saya، nulis = menulis، nggak = tidak، deket = dekat، rekomendasiin = merekomendasikan، kayak = seperti.
      en: |
        menjelajahi = to explore (menjelajahi hutan), kutub = pole (Kutub Utara = North Pole; kompas = compass), trek = trek, trail.
        benua = continent (Benua Asia), samudera = ocean (Samudera Hindia = Indian Ocean; standard spelling samudra).
        villa = villa, hiasan = decoration (hiasan lampion), kembang api = fireworks.
        The dialogue uses street forms; the formal ones are beside them: udah = sudah, aku = saya, nulis = menulis, nggak = tidak, deket = dekat, rekomendasiin = merekomendasikan, kayak = seperti.
    examples:
      - text: Kalimantan adalah pulau terbesar ketiga di dunia, di Benua Asia.
        ar_eg: كاليمانتان تالت أكبر جزيرة في العالم، في قارة آسيا.
        ar: كاليمانتان ثالث أكبر جزيرة في العالم، في قارة آسيا.
        en: Borneo is the world's third-largest island, in Asia.
      - text: Kami menjelajahi hutan dengan kompas karena tidak ada sinyal.
        ar_eg: استكشفنا الغابة ببوصلة عشان مافيش شبكة.
        ar: استكشفنا الغابة ببوصلة لعدم وجود إشارة.
        en: We explored the forest with a compass because there was no signal.
      - text: Saya merekomendasikan villa di Singkawang, apalagi saat ada kembang api.
        ar_eg: بوصي بالفيلا في سينجكاوانج، خصوصًا وقت الألعاب النارية.
        ar: أوصي بالفيلا في سينغكاوانغ، خاصة وقت الألعاب النارية.
        en: I recommend the villa in Singkawang, especially when there are fireworks.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: menjelajahi
        ar_eg: يستكشف
        ar: يستكشف
        en: to explore
      - text: kutub
        ar_eg: قطب
        ar: قطب
        en: pole
      - text: trek
        ar_eg: مدق، طريق مشي
        ar: درب
        en: trek, trail
      - text: benua
        ar_eg: قارة
        ar: قارة
        en: continent
    words: [menjelajahi, kutub, trek, benua]
  - id: e02
    type: match_pairs
    pairs:
      - text: samudera
        ar_eg: محيط
        ar: محيط
        en: ocean
      - text: villa
        ar_eg: فيلا
        ar: فيلا
        en: villa
      - text: hiasan
        ar_eg: زينة
        ar: زينة
        en: decoration
      - text: kembang api
        ar_eg: ألعاب نارية
        ar: ألعاب نارية
        en: fireworks
    words: [samudera, villa, hiasan, kembang api]
  - id: e03
    type: listen
    text: Malam tahun baru ada kembang api di atas sungai.
    question:
      ar_eg: فيه إيه فوق النهر؟
      ar: ماذا فوق النهر؟
      en: What's over the river?
    options: [ألعاب نارية, مطر, مركب]
    answer: 0
    meaning:
      ar_eg: ليلة راس السنة فيه ألعاب نارية فوق النهر.
      ar: ليلة رأس السنة ألعاب نارية فوق النهر.
      en: On New Year's Eve there are fireworks over the river.
    words: [kembang api]
  - id: e04
    type: fill_blank
    sentence: Jarum kompas selalu menunjuk ke arah ___ utara.
    meaning:
      ar_eg: إبرة البوصلة دايمًا بتشاور ناحية ال___ الشمالي.
      ar: تشير إبرة البوصلة دائمًا نحو ال___ الشمالي.
      en: A compass needle always points towards the north ___.
    options: [kutub, villa, hiasan]
    answers: [kutub]
    words: [kutub, villa, hiasan, kompas]
    explain:
      ar_eg: البوصلة بتشاور على kutub utara (القطب الشمالي). villa = فيلا وhiasan = زينة، مش اتجاه.
      ar: تشير البوصلة إلى kutub utara (القطب الشمالي). أما villa فالفيلا، وhiasan الزينة.
      en: A compass points to kutub utara (the north pole). villa and hiasan aren't directions.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: آسيا وأفريقيا وأوروبا، كل واحدة فيهم إيه؟
      ar: آسيا وأفريقيا وأوروبا، ما كلٌّ منها؟
      en: 'Asia, Africa and Europe: what is each one?'
    options: [samudera, benua, trek]
    answer: 1
    explain:
      ar_eg: benua = قارة.
      ar: benua = قارة.
      en: benua = continent.
    words: [samudera, benua, trek]
  - id: e06
    type: fill_blank
    sentence: Rumah-rumah penuh ___ lampion merah menjelang Imlek.
    meaning:
      ar_eg: البيوت مليانة ___ فوانيس حمرا قبل رأس السنة الصينية.
      ar: تمتلئ البيوت بـ___ الفوانيس الحمراء قبيل رأس السنة الصينية.
      en: Houses are full of red lantern ___ before Chinese New Year.
    options: [hiasan, benua, menjelajahi]
    answers: [hiasan]
    words: [hiasan, benua, menjelajahi]
    explain:
      ar_eg: الفوانيس الحمرا hiasan (زينة). benua = قارة وmenjelajahi = يستكشف، مش زينة بيوت.
      ar: الفوانيس الحمراء hiasan (زينة). أما benua فالقارّة، وmenjelajahi «يستكشف».
      en: Red lanterns are hiasan (decorations). benua (continent) and menjelajahi (explore) aren't.
  - id: e07
    type: multiple_choice
    question: Indonesia terletak di antara Samudera Hindia dan ___ Pasifik.
    options: [Villa, Kutub, Samudera]
    answer: 2
    explain:
      ar_eg: Samudera Pasifik = المحيط الهادي.
      ar: Samudera Pasifik = المحيط الهادئ.
      en: Samudera Pasifik = the Pacific Ocean.
    words: [villa, kutub, samudera]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المدق ده طويل بس يستاهل.
      ar: هذا الدرب طويل لكنه يستحق.
      en: This trail is long but worth it.
    answer: Trek ini panjang, tetapi hasilnya sebanding.
    distractors: [kutub, kembang api]
    words: [trek, kembang api]
    explain:
      ar_eg: «المدق» = Trek و«يستاهل» = hasilnya sebanding. kutub = قطب وkembang api = صواريخ نارية، مش في الجملة.
      ar: «الدرب» = Trek و«يستحقّ» = hasilnya sebanding. أما kutub فالقطب، وkembang api الألعاب النارية.
      en: "\"Trail\" is trek and \"worth it\" hasilnya sebanding. kutub and kembang api aren't in it."
  - id: e09
    type: translate
    direction: from_target
    source_text: Kami menjelajahi hutan selama tiga hari.
    answers_meaning:
      ar_eg: [استكشفنا الغابة تلات أيام, قعدنا نستكشف الغابة لمدة تلات أيام]
      ar: [استكشفنا الغابة ثلاثة أيام, استكشفنا الغابة مدة ثلاثة أيام]
      en: [We explored the forest for three days, We spent three days exploring the forest]
    words: [menjelajahi]
  - id: e10
    type: speaking
    text: Saya merekomendasikan villa ini dan trek di belakangnya.
    meaning:
      ar_eg: بوصي بالفيلا دي والمدق اللي وراها.
      ar: أوصي بهذه الفيلا والدرب خلفها.
      en: I recommend this villa and the trail behind it.
    words: [merekomendasikan, villa, trek]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, perjalananmu di Kalimantan udah selesai. Laporanmu udah jadi?
      ar_eg: يا محمد، رحلتك في كاليمانتان خلصت. التقرير بتاعك خلص؟
      ar: يا محمد، انتهت رحلتك في كاليمانتان. هل جهز تقريرك؟
      en: Mohamed, your Kalimantan trip is over. Is your report ready?
    - speaker: Mohamed
      text: Hampir. Aku nulis soal menjelajahi hutan pakai kompas sama trek di Tanjung Puting.
      ar_eg: تقريبًا. بكتب عن استكشاف الغابة بالبوصلة والمدق في تانجونج بوتينج.
      ar: تقريبًا. أكتب عن استكشاف الغابة بالبوصلة والدرب في تانجونغ بوتينغ.
      en: Almost. I'm writing about exploring the forest with a compass and the trek at Tanjung Puting.
    - speaker: Rina
      text: Ada bagian soal Singkawang nggak?
      ar_eg: فيه جزء عن سينجكاوانج؟
      ar: هل فيه قسم عن سينغكاوانغ؟
      en: Is there a section on Singkawang?
    - speaker: Mohamed
      text: Ada. Hiasan lampion, kembang api, sama villa kecil deket pantai. Aku rekomendasiin tempat itu.
      ar_eg: أيوه. زينة الفوانيس والألعاب النارية والفيلا الصغيرة جنب البحر. وبوصي بالمكان ده.
      ar: نعم. زينة الفوانيس والألعاب النارية والفيلا الصغيرة قرب الشاطئ. وأوصي بذلك المكان.
      en: Yes. Lantern decorations, fireworks and a little villa by the beach. I recommend the place.
    - speaker: Rina
      text: Kesimpulannya?
      ar_eg: والخلاصة؟
      ar: والخلاصة؟
      en: And the conclusion?
    - speaker: Mohamed
      text: "Kalimantan tuh kayak satu benua kecil: hutan, sungai, sama samudera budaya."
      ar_eg: 'كاليمانتان زي قارة صغيرة: غابات وأنهار ومحيط من الثقافات.'
      ar: 'كاليمانتان كقارة صغيرة: غابات وأنهار ومحيط من الثقافات.'
      en: 'Kalimantan is like a small continent: forests, rivers and an ocean of cultures.'
