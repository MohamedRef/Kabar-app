schema: kabar.lesson/v1
id: bipa2.u08.l04
language: id
title: Bensin, ban, bengkel
can_do:
  ar_eg: 'تتصرف لو العربية أو الموتوسيكل عطل: البنزين والكاوتش والورشة والرخصة والمرور.'
  ar: 'أن تتصرّف إذا تعطّلت السيارة أو الدراجة النارية: الوقود والإطار والورشة والرخصة والمرور.'
  en: 'Cope when a car or scooter breaks down: fuel, tyres, the garage, your licence and traffic.'
slides:
  - title: Di jalan
    body:
      ar_eg: |
        kendaraan = عربية أو أي حاجة بتمشي على الطريق. bensin = بنزين، ban = كاوتش (ban bocor = الكاوتش مخرّم).
        bengkel = ورشة ميكانيكي. mogok = العربية عطلت ووقفت (ومعناها كمان إضراب).
        jalan tol = طريق سريع بفلوس. lalu lintas = المرور. SIM = رخصة السواقة (Surat Izin Mengemudi).
      ar: |
        kendaraan = مركبة (كل ما يسير على الطريق). bensin = وقود، ban = إطار (ban bocor = إطار مثقوب).
        bengkel = ورشة إصلاح. mogok = تعطّلت وتوقّفت (وتعني أيضًا إضرابًا).
        jalan tol = طريق سريع برسوم. lalu lintas = حركة المرور. SIM = رخصة القيادة (Surat Izin Mengemudi).
      en: |
        kendaraan = vehicle. bensin = petrol, ban = tyre (ban bocor = a flat tyre).
        bengkel = repair garage. mogok = break down, stall (also: go on strike).
        jalan tol = toll road. lalu lintas = traffic. SIM = driving licence (Surat Izin Mengemudi).
    examples:
      - text: Motor saya mogok di jalan.
        ar_eg: الموتوسيكل بتاعي عطل في الطريق.
        ar: تعطّلت دراجتي النارية في الطريق.
        en: My scooter broke down on the road.
      - text: Ban mobil ini bocor. Ayo ke bengkel.
        ar_eg: كاوتش العربية دي مخرّم. يلا على الورشة.
        ar: إطار هذه السيارة مثقوب. هيّا إلى الورشة.
        en: This car has a flat tyre. Let's go to the garage.
      - text: Jalan tol ini bayar, tapi cepat.
        ar_eg: الطريق السريع ده بفلوس، بس سريع.
        ar: هذا الطريق برسوم، لكنه سريع.
        en: This toll road costs money, but it's fast.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kendaraan
        ar_eg: عربية، مركبة
        ar: مركبة
        en: vehicle
      - text: bensin
        ar_eg: بنزين
        ar: وقود
        en: petrol
      - text: ban
        ar_eg: كاوتش
        ar: إطار
        en: tyre
      - text: jalan tol
        ar_eg: طريق سريع بفلوس
        ar: طريق برسوم
        en: toll road
    words: [kendaraan, bensin, ban, jalan tol]
  - id: e02
    type: match_pairs
    pairs:
      - text: bengkel
        ar_eg: ورشة
        ar: ورشة
        en: garage
      - text: mogok
        ar_eg: عطل
        ar: تعطّل
        en: break down
      - text: SIM
        ar_eg: رخصة سواقة
        ar: رخصة قيادة
        en: driving licence
      - text: lalu lintas
        ar_eg: المرور
        ar: المرور
        en: traffic
    words: [bengkel, mogok, SIM, lalu lintas]
  - id: e03
    type: listen
    text: Motornya mogok. Bensinnya kosong!
    question:
      ar_eg: الموتوسيكل ماله؟
      ar: ما مشكلة الدراجة؟
      en: What's wrong with the scooter?
    options: [البنزين خلص, الكاوتش مخرّم, الرخصة ضاعت]
    answer: 0
    meaning:
      ar_eg: الموتوسيكل عطل. مفيش بنزين!
      ar: تعطّلت الدراجة. لا وقود فيها!
      en: The scooter's broken down. It's out of petrol!
    words: [mogok, bensin]
  - id: e04
    type: fill_blank
    sentence: Ban motor saya bocor. Saya bawa ke ___.
    meaning:
      ar_eg: كاوتش الموتوسيكل مخرّم. هوديه الـ ___.
      ar: إطار دراجتي مثقوب. سآخذها إلى ___.
      en: My scooter has a flat. I'll take it to the ___.
    options: [bengkel, jalan tol, SIM]
    answers: [bengkel]
    words: [bengkel, ban, jalan tol, SIM]
    explain:
      ar_eg: العجلة المخرّمة بتروح bengkel (ورشة). jalan tol = طريق سريع، وSIM = رخصة سواقة.
      ar: يُصلح الإطار في bengkel (ورشة). أما jalan tol فطريق سريع وSIM رخصة قيادة.
      en: A flat goes to the bengkel (workshop). jalan tol is a toll road, SIM a licence.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: لازم يكون معاك إيه عشان تسوق؟
      ar: ماذا يجب أن يكون معك لتقود؟
      en: What must you carry to drive?
    options: [SIM, ban, bensin]
    answer: 0
    explain:
      ar_eg: SIM = رخصة السواقة.
      ar: SIM = رخصة القيادة.
      en: SIM = driving licence.
    words: [SIM, ban, bensin]
  - id: e06
    type: fill_blank
    sentence: Jam lima sore, ___ di Jakarta macet sekali.
    meaning:
      ar_eg: الساعة خمسة العصر، ___ في جاكرتا واقف خالص.
      ar: في الخامسة مساءً تكون ___ في جاكرتا مزدحمة جدًا.
      en: At five p.m. the ___ in Jakarta is jammed.
    options: [lalu lintas, bengkel, kendaraan]
    answers: [lalu lintas]
    words: [lalu lintas, bengkel, kendaraan]
    explain:
      ar_eg: lalu lintas = المرور، وهو اللي بيبقى macet (واقف). kendaraan = عربيات/مركبات، وbengkel = ورشة.
      ar: lalu lintas = حركة المرور، وهي التي تكون macet. أما kendaraan فمركبات وbengkel ورشة.
      en: lalu lintas = traffic, which is macet (jammed). kendaraan are vehicles, bengkel a workshop.
  - id: e07
    type: build_sentence
    source:
      ar_eg: الطريق السريع ده بفلوس، بس سريع.
      ar: هذا الطريق برسوم لكنه سريع.
      en: This toll road costs money, but it's fast.
    answer: Jalan tol ini bayar, tapi cepat.
    distractors: [ban, lambat]
    words: [jalan tol]
    explain:
      ar_eg: Jalan tol ini bayar = الطريق ده بفلوس، وtapi cepat = بس سريع. ban (كاوتش) وlambat (بطيء) زيادة.
      ar: Jalan tol ini bayar = هذا الطريق برسوم، وtapi cepat = لكنه سريع. أما ban وlambat فزائدتان.
      en: Jalan tol ini bayar = this toll road costs money, tapi cepat = but it's fast. ban and lambat don't fit.
  - id: e08
    type: translate
    direction: from_target
    source_text: Banyak kendaraan di jalan raya pagi ini.
    answers_meaning:
      ar_eg: [فيه عربيات كتير في الطريق الرئيسي النهارده الصبح, الطريق الرئيسي مليان عربيات الصبح ده]
      ar: [هناك مركبات كثيرة على الطريق الرئيسي هذا الصباح]
      en: [There are lots of vehicles on the main road this morning, Many vehicles on the main road this morning]
    words: [kendaraan]
  - id: e09
    type: speaking
    text: Mobil saya mogok di jalan tol.
    meaning:
      ar_eg: عربيتي عطلت على الطريق السريع.
      ar: تعطّلت سيارتي على الطريق السريع.
      en: My car broke down on the toll road.
    words: [mogok, jalan tol]
  - id: e10
    type: multiple_choice
    question: Mobil minum ___, bukan air!
    options: [bensin, ban, lalu lintas]
    answer: 0
    explain:
      ar_eg: العربية بتشرب بنزين!
      ar: السيارة تشرب الوقود!
      en: Cars drink petrol!
    words: [bensin, ban, lalu lintas]
dialogue:
  lines:
    - speaker: Mohamed
      text: Ni Luh, motor saya mogok di jalan!
      ar_eg: يا ني لوه، الموتوسيكل عطل مني في الطريق!
      ar: يا ني لوه، تعطّلت دراجتي في الطريق!
      en: Ni Luh, my scooter's broken down on the road!
    - speaker: Ni Luh
      text: Bensinnya kosong?
      ar_eg: البنزين خلص؟
      ar: هل نفد الوقود؟
      en: Out of petrol?
    - speaker: Mohamed
      text: Tidak. Bannya bocor.
      ar_eg: لأ. الكاوتش مخرّم.
      ar: لا. الإطار مثقوب.
      en: No. It's got a flat.
    - speaker: Ni Luh
      text: Ada bengkel dekat kantor pos. Bawa ke sana.
      ar_eg: فيه ورشة جنب البوسطة. وديه هناك.
      ar: هناك ورشة قرب مكتب البريد. خذها إليها.
      en: There's a garage near the post office. Take it there.
    - speaker: Mohamed
      text: Oke. Lalu lintasnya ramai sekali hari ini.
      ar_eg: ماشي. المرور زحمة أوي النهارده.
      ar: حسنًا. المرور مزدحم جدًا اليوم.
      en: OK. The traffic's really heavy today.
    - speaker: Ni Luh
      text: Hati-hati, ya! Jangan lupa SIM-mu.
      ar_eg: خلي بالك! ما تنساش رخصتك.
      ar: انتبه! ولا تنسَ رخصتك.
      en: Be careful! Don't forget your licence.
