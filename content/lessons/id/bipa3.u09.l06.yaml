dialogue:
  title: Cerita malam di Pantai Pink
  lines:
    - speaker: Mas Rizal
      text: Anak-anak, bagaimana Kancil menyeberang sungai?
      ar_eg: يا ولاد، الكنشيل عدّى النهر إزاي؟
      ar: يا أطفال، كيف عبر الكانتشيل النهر؟
      en: Kids, how did Kancil cross the river?
    - speaker: Anak
      text: Dia melompat dari punggung ke punggung buaya!
      ar_eg: نطّ من على ضهر تمساح لضهر تمساح!
      ar: قفز من ظهر تمساح إلى ظهر تمساح!
      en: He jumped from crocodile back to crocodile back!
    - speaker: Mohamed
      text: Dan dia bilang raja ingin menghitung semua buaya. Cerdik sekali!
      ar_eg: وقالّهم إن الملك عايز يعدّ كل التماسيح. شاطر أوي!
      ar: وقال إنّ الملك يريد أن يعدّ التماسيح كلّها. ما أذكاه!
      en: And he said the king wanted to count all the crocodiles. So clever!
    - speaker: Mas Rizal
      text: Betul. Jadi, apa amanat cerita ini?
      ar_eg: صح. طب إيه العبرة من الحكاية؟
      ar: صحيح. فما عبرة هذه الحكاية؟
      en: Right. So what's the moral of the story?
    - speaker: Mohamed
      text: Jangan mudah percaya, seperti buaya-buaya itu!
      ar_eg: ما تصدّقش بسهولة، زي التماسيح دي!
      ar: لا تصدّق بسهولة، كتلك التماسيح!
      en: Don't believe things too easily, like those crocodiles!
