schema: kabar.lesson/v1
id: bipa3.u09.l06
language: id
title: Kancil dan buaya
can_do:
  ar_eg: تقرا حكاية الكنشيل والتماسيح وتفهم الحيلة والعبرة.
  ar: أن تقرأ حكاية الكانتشيل والتماسيح وتفهم الحيلة والعبرة.
  en: Read the tale of the mouse deer and the crocodiles and get the trick and the moral.
slides:
  - title: Si Kancil menyeberang sungai
    grammar: id.reduplication.ber-an
    body:
      ar_eg: |
        على شط بنك بيتش، مَس ريزال بيحكي للعيال أشهر حكاية عن الكنشيل. اقراها بالراحة.
        دوّر على: الكنشيل كان عايز إيه؟ قال للتماسيح إيه؟ وعدّى إزاي؟
        كلمات جديدة: punggung = ضهر، menghitung = يعدّ، berbaris = يقفوا في صف (Berbarislah! = اقفوا صف!).
      ar: |
        على شاطئ «بينك بيتش» يحكي الأخ ريزال للأطفال أشهر حكاية عن الكانتشيل. اقرأها بتمهّل.
        ابحث عن: ماذا أراد الكانتشيل؟ ماذا قال للتماسيح؟ وكيف عبر؟
        كلمات جديدة: punggung = ظهر، menghitung = يعدّ، berbaris = يصطفّ (Berbarislah! = اصطفّوا!).
      en: |
        On Pink Beach, Mas Rizal tells the children the most famous mouse-deer tale. Read it slowly.
        Look for: what did Kancil want? What did he tell the crocodiles? How did he get across?
        New words: punggung = back, menghitung = to count, berbaris = to line up (Berbarislah! = line up!).
    examples:
      - text: Pada zaman dahulu, hiduplah seekor kancil yang cerdik. Suatu hari, dia ingin menyeberang sungai, tetapi di sungai ada banyak buaya.
        ar_eg: كان يا ما كان، كان فيه كنشيل شاطر ومكّار. في يوم من الأيام كان عايز يعدّي النهر، بس النهر كان مليان تماسيح.
        ar: كان يا ما كان، عاش كانتشيل ذكيّ. وذات يوم أراد أن يعبر النهر، لكنّ النهر كان مليئًا بالتماسيح.
        en: Long, long ago there lived a clever mouse deer. One day he wanted to cross the river, but there were many crocodiles in it.
      - text: Kata Kancil, "Raja ingin menghitung semua buaya. Berbarislah dari sini sampai ke seberang!" Buaya-buaya pun datang berbondong-bondong dan berbaris.
        ar_eg: "الكنشيل قال: «الملك عايز يعدّ كل التماسيح. اقفوا صف من هنا للناحية التانية!» والتماسيح جت بالكوم ووقفت صف."
        ar: "قال الكانتشيل: «يريد الملك أن يعدّ التماسيح كلّها. اصطفّوا من هنا إلى الضفّة الأخرى!» فجاءت التماسيح جماعاتٍ واصطفّت."
        en: 'Kancil said, "The king wants to count all the crocodiles. Line up from here to the other side!" And the crocodiles came in droves and lined up.'
      - text: Kancil melompat dari punggung ke punggung sambil menghitung, "Satu, dua, tiga…" Akhirnya, dia sampai di seberang sungai.
        ar_eg: "الكنشيل نطّ من ضهر لضهر وهو بيعدّ: «واحد، اتنين، تلاتة…» وفي الآخر وصل للناحية التانية من النهر."
        ar: "قفز الكانتشيل من ظهر إلى ظهر وهو يعدّ: «واحد، اثنان، ثلاثة…» وأخيرًا وصل إلى الضفّة الأخرى."
        en: 'Kancil jumped from back to back, counting, "One, two, three…" In the end he reached the other side of the river.'
exercises:
  - id: e01
    type: listen
    text: Suatu hari, Kancil ingin menyeberang sungai, tetapi di sungai ada banyak buaya.
    question:
      ar_eg: مشكلة الكنشيل كانت إيه؟
      ar: ما كانت مشكلة الكانتشيل؟
      en: What was Kancil's problem?
    options: ["Dia lapar.", "Ada banyak buaya di sungai.", "Raja marah kepadanya."]
    answer: 1
    meaning:
      ar_eg: في يوم من الأيام، الكنشيل كان عايز يعدّي النهر، بس النهر كان مليان تماسيح.
      ar: ذات يوم أراد الكانتشيل أن يعبر النهر، لكنّ النهر كان مليئًا بالتماسيح.
      en: One day Kancil wanted to cross the river, but there were many crocodiles in it.
    words: [suatu hari, kancil, buaya]
  - id: e02
    type: match_pairs
    pairs:
      - text: punggung
        ar_eg: ضهر
        ar: ظهر
        en: back (of the body)
      - text: menghitung
        ar_eg: يعدّ
        ar: يعدّ
        en: to count
      - text: berbaris
        ar_eg: يقف في صف
        ar: يصطفّ
        en: to line up
      - text: seberang
        ar_eg: الناحية التانية
        ar: الضفّة الأخرى
        en: the other side
      - text: cerdik
        ar_eg: شاطر ومكّار
        ar: ذكيّ داهية
        en: clever, cunning
    words: [punggung, menghitung, berbaris, cerdik]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الكنشيل قال للتماسيح إيه؟
      ar: ماذا قال الكانتشيل للتماسيح؟
      en: What did Kancil tell the crocodiles?
    options: ["Raja ingin makan buaya.", "Raja ingin menyeberang sungai.", "Raja ingin menghitung semua buaya."]
    answer: 2
    words: [menghitung, raja]
  - id: e04
    type: listen
    text: Kancil melompat dari punggung ke punggung sambil menghitung.
    options:
      - Kancil melompat dari punggung ke punggung sambil menghitung.
      - Kancil berlari dari pantai ke pantai sambil menghitung.
      - Kancil melompat dari punggung ke punggung sambil bernyanyi.
    answer: 0
    meaning:
      ar_eg: الكنشيل نطّ من ضهر لضهر وهو بيعدّ.
      ar: قفز الكانتشيل من ظهر إلى ظهر وهو يعدّ.
      en: Kancil jumped from back to back, counting.
    words: [punggung, menghitung]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه العبرة من الحكاية دي؟
      ar: ما عبرة هذه الحكاية؟
      en: What's the moral of this tale?
    options: ["Jangan sombong.", "Jangan mudah percaya kepada orang lain.", "Bermaaf-maafanlah pada hari Lebaran."]
    answer: 1
    explain:
      ar_eg: "التماسيح صدّقت كلام الكنشيل على طول، فضحك عليهم وعدّى. العبرة: ما تصدّقش أي كلام بسهولة."
      ar: "صدّقت التماسيح كلام الكانتشيل فورًا فخدعها وعبر. العبرة: لا تصدّق كلّ ما يُقال بسهولة."
      en: The crocodiles believed Kancil straight away, so he tricked them and got across. The moral, don't believe others too easily.
    words: [amanat]
