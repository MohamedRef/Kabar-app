schema: kabar.lesson/v1
id: bipa1.u01.l03
language: id
title: Apakah Ibu sehat?
can_do:
  ar_eg: تسأل بشكل رسمي حد إذا كان كويس، وتقول إنك مش أحسن حاجة، وتسأل معنى كلمة.
  ar: أن تسأل رسميًّا عن صحة شخص، وتقول إنك لست بخير تمامًا، وتسأل عن معنى كلمة.
  en: Ask formally if someone is well, say you're not so good, and ask what a word means.
slides:
  - title: Apa? Apakah?
    body:
      ar_eg: |
        apa ليها شغلتين:
        ١) لوحدها يعني «إيه؟»: «Apa artinya?» = «يعني إيه؟».
        ٢) في أول الجملة بتبقى زي «هل»: «Apa Ibu sehat?» = «حضرتك كويسة؟» والرد: «Ya, sehat.»
        في الكلام الرسمي بيقولوا apakah. وفي الكلام العادي ممكن تشيلها وتعلّي صوتك في الآخر: «Sehat?»
      ar: |
        لـ apa وظيفتان:
        ١) وحدها بمعنى «ماذا؟»: «Apa artinya?» = «ما معناه؟».
        ٢) في أول الجملة بمعنى «هل»: «Apa Ibu sehat?» = «هل أنتِ بخير؟» والجواب: «Ya, sehat.»
        وفي الأسلوب الرسمي تُستعمل apakah، وفي الكلام اليومي قد تُحذف ويُكتفى برفع النغمة: «Sehat?»
      en: |
        apa has two jobs:
        1) alone it means "what?": "Apa artinya?" = "What does it mean?"
        2) at the start of a sentence it works like a yes/no marker: "Apa Ibu sehat?" = "Are you well, ma'am?" Reply: "Ya, sehat."
        Formal speech uses apakah. Casual speech often drops it and just raises the voice: "Sehat?"
    grammar: id.question.apa
    examples:
      - text: Apakah Bapak sehat?
        ar_eg: حضرتك بخير؟ (رسمي)
        ar: هل أنت بخير يا سيدي؟
        en: Are you well, sir? (formal)
      - text: Ya, sehat. Terima kasih.
        ar_eg: أيوه، الحمد لله. شكرًا.
        ar: نعم، بخير. شكرًا.
        en: Yes, I'm well. Thank you.
exercises:
  - id: e01
    type: listen
    text: Baik-baik saja
    options: ['Baik-baik saja', 'Kurang baik', 'Apa artinya?']
    answer: 0
    words: [baik-baik saja]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تسأل أستاذ كبير بشكل رسمي، «هل حضرتك بخير؟». تختار أنهي؟
      ar: تريد أن تسأل أستاذًا كبيرًا بأسلوب رسمي، «هل أنت بخير يا سيدي؟». أيّها تختار؟
      en: You want to ask an older teacher formally, "Are you well, sir?". Which one?
    options: ['Kurang baik, Pak.', 'Apakah Bapak sehat?', 'Sama-sama, Pak.']
    answer: 1
    explain:
      ar_eg: apakah هي «هل» الرسمية، وبتيجي في أول الجملة.
      ar: apakah أداة الاستفهام «هل» في الأسلوب الرسمي، وتتصدّر الجملة.
      en: apakah is the formal yes/no marker and goes at the start.
    words: [apakah, sehat]
  - id: e03
    type: translate
    direction: from_target
    source_text: Ya, baik-baik saja, terima kasih.
    answers_meaning:
      ar_eg: [أيوه، كله تمام، شكرًا, أيوه، تمام، شكرًا, أيوه، كويس، شكرًا, أيوه، أنا كويس، شكرًا, آه، تمام، شكرًا]
      ar: [نعم، كل شيء على ما يرام، شكرًا, نعم، بخير، شكرًا, نعم، أنا بخير، شكرًا]
      en: ['Yes, all fine, thank you.', 'Yes, I''m fine, thanks', 'Yes, everything''s fine, thank you', 'Yes, I''m fine, thank you', 'Yes, fine, thanks']
    words: [ya, baik-baik saja, terima kasih]
  - id: e04
    type: match_pairs
    pairs:
      - text: baik-baik saja
        ar_eg: كله تمام
        ar: كل شيء بخير
        en: all fine
      - text: kurang baik
        ar_eg: مش أحسن حاجة
        ar: لست بخير تمامًا
        en: not so good
      - text: sehat
        ar_eg: بصحة كويسة
        ar: بصحة جيدة
        en: healthy, well
      - text: ya
        ar_eg: أيوه
        ar: نعم
        en: 'yes'
    words: [baik-baik saja, kurang baik, sehat, ya]
  - id: e05
    type: fill_blank
    sentence: ___ Bapak sehat?
    meaning:
      ar_eg: حضرتك بخير؟ (سؤال رسمي)
      ar: هل أنت بخير يا سيدي؟ (بأسلوب رسمي)
      en: Are you well, sir? (formal)
    options: [Apa, Ya, Apakah]
    answers: [Apakah]
    explain:
      ar_eg: apakah هي أداة السؤال الرسمية لسؤال إجابته أيوه أو لأ.
      ar: apakah أداة الاستفهام الرسمية لسؤال جوابه نعم أو لا.
      en: Apakah is the formal marker for a yes/no question.
    words: [apakah, sehat]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: سمعت كلمة مش فاهمها. تسأل إزاي عن معناها؟
      ar: سمعت كلمة لا تفهمها. كيف تسأل عن معناها؟
      en: You hear a word you don't know. How do you ask what it means?
    options: ['Apa kabar?', 'Apa artinya?', 'Apakah sehat?']
    answer: 1
    words: ['Apa artinya?']
    explain:
      ar_eg: "علشان تسأل عن معنى كلمة: Apa artinya? (معناها إيه؟). Apa kabar للسلام، وApakah sehat سؤال عن الصحة."
      ar: "للسؤال عن المعنى: Apa artinya؟ أما Apa kabar فتحية."
      en: Apa artinya? asks what something means.
  - id: e07
    type: build_sentence
    source:
      ar_eg: أيوه، مش أحسن حاجة، شكرًا.
      ar: نعم، لستُ بخير تمامًا، شكرًا.
      en: Yes, not so good, thanks.
    answer: Ya, kurang baik, terima kasih.
    distractors: [apakah, sehat]
    words: [ya, kurang baik]
    explain:
      ar_eg: Ya, + kurang baik (مش أوي) + terima kasih. apakah وsehat مش في الجملة.
      ar: Ya, kurang baik, terima kasih. apakah وsehat زائدتان.
      en: Ya, + kurang baik, + terima kasih. apakah and sehat are extra.
  - id: e08
    type: speaking
    text: Apa artinya, Bu?
    meaning:
      ar_eg: معناها إيه يا مدام؟
      ar: ما معناها يا سيدتي؟
      en: What does it mean, ma'am?
    words: ['Apa artinya?']
dialogue:
  lines:
    - speaker: Mohamed
      text: Selamat pagi, Bu Yanti! Apakah Bu Yanti sehat?
      ar_eg: صباح الخير يا مدام يانتي! حضرتك بخير؟
      ar: صباح الخير يا سيدة يانتي! هل أنتِ بخير؟
      en: Good morning, Bu Yanti! Are you well?
    - speaker: Bu Yanti
      text: Kurang baik, Mohamed. Dan Mohamed?
      ar_eg: مش أحسن حاجة يا محمد. وإنت؟
      ar: لستُ بخير تمامًا يا محمد. وأنت؟
      en: Not so good, Mohamed. And you?
    - speaker: Mohamed
      text: Baik-baik saja, Bu. Terima kasih.
      ar_eg: كله تمام يا مدام. شكرًا.
      ar: كل شيء بخير يا سيدتي. شكرًا.
      en: All fine, ma'am. Thank you.
    - speaker: Bu Yanti
      text: Sama-sama. Sampai jumpa besok!
      ar_eg: العفو. أشوفك بكرة!
      ar: عفوًا. أراك غدًا!
      en: You're welcome. See you tomorrow!
