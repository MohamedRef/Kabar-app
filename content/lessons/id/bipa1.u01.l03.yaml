schema: kabar.lesson/v1
id: bipa1.u01.l03
language: id
title: Saya dan aku
can_do:
  ar_eg: تقول «أنا» بأدب أو بشكل عادي مع الصحاب.
  ar: أن تقول «أنا» بأسلوب مهذب أو بأسلوب ودّي غير رسمي.
  en: Say "I" politely or casually.
slides:
  - title: Saya atau aku?
    body:
      ar_eg: |
        في الإندونيسي فيه كلمتين لـ«أنا»:
        - saya: المؤدبة والآمنة، مع أي حد (أستاذ، موظف، حد ماتعرفوش).
        - aku: مع الصحاب والعيلة واللي أصغر منك.
        لو مش متأكد، قول saya. ومافيش «فعل كان» هنا: «Saya Mohamed» = «أنا محمد» على طول، زي العربي.
      ar: |
        للمتكلم في الإندونيسية كلمتان:
        - saya: المهذبة الآمنة، تصلح مع الجميع (معلم، موظف، غريب).
        - aku: مع الأصدقاء والأهل ومن هو أصغر سنًّا.
        وعند الشك استعمل saya. ولا حاجة إلى فعل كينونة: «Saya Mohamed» = «أنا محمد» كما في العربية.
      en: |
        Indonesian has two words for "I":
        - saya: polite and safe with anyone (teachers, officials, strangers).
        - aku: with friends, family and younger people.
        When in doubt, say saya. No "am" is needed: "Saya Mohamed" = "I'm Mohamed", just like Arabic.
    grammar: id.pronoun.personal
    examples:
      - text: Selamat pagi, Pak. Saya Mohamed.
        ar_eg: صباح الخير يا أستاذ. أنا محمد.
        ar: صباح الخير يا سيدي. أنا محمد.
        en: Good morning, sir. I'm Mohamed.
      - text: Hai, aku Dimas!
        ar_eg: أهلًا، أنا ديماس!
        ar: مرحبًا، أنا ديماس!
        en: Hi, I'm Dimas!
  - title: Kamu, Anda, Bapak, Ibu
    body:
      ar_eg: |
        و«إنت»؟ برضه حسب الأدب، ومن غير فرق بين راجل وست:
        - kamu: للصحاب واللي أصغر منك.
        - Anda: رسمية ومحايدة، تنفع مع حد غريب أو في الكتابة.
        - Bapak / Ibu: مع حد أكبر منك أو محترم، بتقوم مقام «إنت» بالظبط زي «حضرتك».
      ar: |
        وللمخاطَب أيضًا كلمات بحسب درجة التأدب، ولا فرق بين مذكر ومؤنث:
        - kamu: للأصدقاء ومن هو أصغر.
        - Anda: رسمية محايدة، للغريب وفي الكتابة.
        - Bapak / Ibu: للأكبر سنًّا أو المحترم، وتقوم مقام «أنت» كقولنا «حضرتك».
      en: |
        "You" also depends on politeness, and never on gender:
        - kamu: for friends and younger people.
        - Anda: formal and neutral, for strangers and in writing.
        - Bapak / Ibu: for anyone older or respected; they replace "you", like Egyptian «حضرتك».
    grammar: id.pronoun.personal
    examples:
      - text: Maaf, Anda Pak Budi?
        ar_eg: لا مؤاخذة، حضرتك الأستاذ بودي؟
        ar: عفوًا، هل أنت الأستاذ بودي؟
        en: Excuse me, are you Pak Budi?
      - text: Kamu Dimas?
        ar_eg: إنت ديماس؟
        ar: أأنت ديماس؟
        en: Are you Dimas?
  - title: Dia, kami, kita
    body:
      ar_eg: |
        - dia: «هو» و«هي» الاتنين! مافيش مذكر ومؤنث.
        - و«إحنا» ليها نوعين: kita = إحنا وإنت معانا، kami = إحنا من غيرك.
        لو بتكلم صاحبك وإنتو الاتنين في كوتا توا، تقول «Kita di Kota Tua!».
      ar: |
        - dia: «هو» و«هي» معًا، فلا تمييز بين المذكر والمؤنث.
        - و«نحن» نوعان: kita = نحن ومعنا المخاطَب، kami = نحن من دون المخاطَب.
        فإذا كنت مع صديقك في كوتا توا قلت له: «Kita di Kota Tua!».
      en: |
        - dia: both "he" and "she" — no gender at all.
        - "We" comes in two kinds: kita = we, including you; kami = we, not including you.
        Standing in Kota Tua with your friend, you tell him "Kita di Kota Tua!".
    grammar: id.pronoun.personal
    examples:
      - text: Dia Rina.
        ar_eg: دي رينا.
        ar: هذه رينا. (حرفيًا «هي رينا»)
        en: She's Rina.
      - text: Kita di Jakarta!
        ar_eg: إحنا (أنا وإنت) في جاكرتا!
        ar: نحن (أنا وأنت) في جاكرتا!
        en: We're (you and I) in Jakarta!
      - text: Kami di Kota Tua, Bu.
        ar_eg: إحنا (من غيرك) في كوتا توا يا مدام.
        ar: نحن (دونكِ) في كوتا توا يا سيدتي.
        en: We (not you) are in Kota Tua, ma'am.
  - title: Maaf, permisi, salam kenal
    body:
      ar_eg: |
        - maaf: «آسف / لا مؤاخذة»، جاية من العربي «معافاة» (جذر ع ف و، زي «العفو»).
        - permisi: «بعد إذنك»، لما تعدّي أو تنادي حد.
        - salam kenal: «فرصة سعيدة / اتشرفنا»، أول مرة تقابل حد. salam جاية من «سلام».
      ar: |
        - maaf: «آسف / عفوًا»، من العربية «معافاة» (الجذر ع ف و، كـ«العفو»).
        - permisi: «بعد إذنك»، عند المرور أو النداء.
        - salam kenal: «تشرّفنا»، عند أول لقاء. وsalam من «سلام».
      en: |
        - maaf: "sorry / excuse me", from Arabic «معافاة» (root ع ف و, as in «العفو»).
        - permisi: "excuse me" when passing by or getting someone's attention.
        - salam kenal: "nice to meet you", at a first meeting. salam ← «سلام».
    examples:
      - text: Maaf, Pak!
        ar_eg: آسف يا أستاذ!
        ar: عفوًا يا سيدي!
        en: Sorry, sir!
      - text: Salam kenal, saya Mohamed.
        ar_eg: اتشرفنا، أنا محمد.
        ar: تشرّفنا، أنا محمد.
        en: Nice to meet you, I'm Mohamed.
exercises:
