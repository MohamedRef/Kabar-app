    type: match_pairs
    pairs:
      - text: saya
        ar_eg: أنا (بأدب)
        ar: أنا (مهذبة)
        en: I (polite)
      - text: aku
        ar_eg: أنا (مع الصحاب)
        ar: أنا (ودّية)
        en: I (casual)
      - text: kamu
        ar_eg: إنت (مع الصحاب)
        ar: أنت (ودّية)
        en: you (casual)
      - text: dia
        ar_eg: هو / هي
        ar: هو / هي
        en: he / she
    words: [saya, aku, kamu, dia]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أول مرة تقابل Pak Budi، الأستاذ. تعرّف نفسك إزاي؟
      ar: تقابل الأستاذ Budi لأول مرة. كيف تعرّف بنفسك؟
      en: You meet Pak Budi, the teacher, for the first time. How do you introduce yourself?
    options: ["Selamat pagi, Pak. Saya Mohamed.", "Hai, aku Mohamed!", "Hai, kamu Mohamed!"]
    answer: 0
    explain:
      ar_eg: مع حد أكبر ومحترم saya هي الأنسب. aku للصحاب، و«kamu Mohamed» يعني «إنت محمد».
      ar: مع الأكبر المحترم تناسب saya، أما aku فللأصدقاء، و«kamu Mohamed» معناها «أنت محمد».
      en: With an older, respected person saya fits; aku is for friends, and "kamu Mohamed" means "you are Mohamed".
    words: [saya]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «هو» و«هي» في نفس الوقت؟
      ar: أيّ كلمة تعني «هو» و«هي» معًا؟
      en: Which word means both "he" and "she"?
    options: ["dia", "kamu", "kami"]
    answer: 0
    words: [dia]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إنت وDimas سوا في كوتا توا. عايز تقوله «إحنا في كوتا توا!» (إنت وهو).
      ar: أنت وDimas معًا في كوتا توا، وتريد أن تقول له «نحن في كوتا توا!» (أنت وهو).
      en: You and Dimas are both in Kota Tua. You tell him "We're in Kota Tua!" (you and him).
    options: ["Kita di Kota Tua!", "Dia di Kota Tua!", "Kami di Kota Tua!"]
    answer: 0
    explain:
      ar_eg: Dimas معاك، يبقى kita. kami معناها «إحنا من غيرك».
      ar: Dimas داخل في «نحن»، فتلزم kita، أما kami فتخرجه.
      en: Dimas is included, so it's kita; kami would leave him out.
    words: [kita, kami]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: خبطت في حد من غير قصد في السوق. تقول إيه؟
      ar: اصطدمت بأحدهم دون قصد في السوق. ماذا تقول؟
      en: You bump into someone by accident at the market. What do you say?
    options: ["Selamat datang!", "Maaf!", "Sama-sama!"]
    answer: 1
    explain:
      ar_eg: maaf = آسف، وجاية من العربي «معافاة»، زي «العفو».
      ar: maaf = عفوًا، من العربية «معافاة».
      en: maaf = sorry, from Arabic «معافاة».
    words: [maaf]
  - id: e06
    type: listen
    text: Salam kenal
    options: ["Selamat malam", "Salam kenal", "Sampai jumpa"]
    answer: 1
    words: [salam kenal]
  - id: e07
    type: fill_blank
    sentence: Selamat siang, Bu. ___ Mohamed.
    meaning:
      ar_eg: نهارك سعيد يا مدام. أنا محمد.
      ar: طاب نهارك يا سيدتي. أنا محمد.
      en: Good afternoon, ma'am. I'm Mohamed.
    options: ["Saya", "Dia", "Kamu"]
    answers: [Saya]
    explain:
      ar_eg: بتعرّف نفسك يبقى «أنا»، ومع Bu الأحسن saya.
      ar: أنت تعرّف بنفسك فتحتاج «أنا»، ومع Bu الأنسب saya.
      en: You're introducing yourself, so you need "I"; with Bu, saya is the right one.
    words: [saya]
  - id: e08
    type: fill_blank
    sentence: ___, Bu. Saya Mohamed.
    meaning:
      ar_eg: بعد إذنك يا مدام. أنا محمد.
      ar: بعد إذنكِ يا سيدتي. أنا محمد.
      en: Excuse me, ma'am. I'm Mohamed.
    options: ["Sama-sama", "Selamat jalan", "Permisi"]
    answers: [Permisi]
    explain:
      ar_eg: permisi بتتقال لما تنادي حد أو تستأذن. Sama-sama رد على الشكر، وSelamat jalan وداع.
      ar: permisi تقال عند النداء أو الاستئذان، وSama-sama جواب الشكر، وSelamat jalan للوداع.
      en: permisi gets someone's attention politely; Sama-sama answers thanks and Selamat jalan is a goodbye.
    words: [permisi]
