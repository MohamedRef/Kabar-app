schema: kabar.lesson/v1
id: bipa6.u06.l08
language: id
title: Kartun pejabat
can_do:
  ar_eg: تفهم كاريكاتير بيتريق على مسؤول طماع ومتكبر والروتين الحكومي.
  ar: أن تفهم كاريكاتيرًا يسخر من مسؤول جشع متعالٍ ومن البيروقراطية.
  en: Read a cartoon mocking a greedy, arrogant official and red tape.
slides:
  - title: Kartun editorial
    body:
      ar_eg: |
        كاريكاتير (متخيَّل للدرس): مسؤول كرشه كبير ماسك يافطة "Melayani Rakyat"، ووراه طابور طويل.
        petinggi = مسؤول كبير (petinggi negara). korup = فاسد، مرتشي. serakah = طماع.
        angkuh = متكبر، شايف نفسه. kelakuan = تصرفات، عمايل (من laku). tampang = شكل، سحنة (عامية).
        slogan = شعار. birokrasi = البيروقراطية، الروتين.
        - في الشارع: nggak = tidak (لأ / مش)، nulis = menulis (يكتب)، udah = sudah (خلاص / بالفعل)، ngomong = berbicara (يتكلّم)، banget = sekali (أوي)، aku / -ku = saya (أنا)، ngerti = mengerti (يفهم).
      ar: |
        كاريكاتير (متخيَّل للدرس): مسؤول ضخم البطن يحمل لافتة "Melayani Rakyat"، وخلفه طابور طويل.
        petinggi = مسؤول كبير (petinggi negara). korup = فاسد، مرتشٍ. serakah = جشِع.
        angkuh = متكبّر، متعالٍ. kelakuan = تصرّفات، سلوك (من laku). tampang = هيئة، سِحنة (دارج).
        slogan = شعار. birokrasi = البيروقراطية.
        - في كلام الشارع: nggak = tidak (لا / ليس)، nulis = menulis (يكتب)، udah = sudah (قد / بالفعل)، ngomong = berbicara (يتكلّم)، banget = sekali (جدًّا)، aku / -ku = saya (أنا)، ngerti = mengerti (يفهم).
      en: |
        A cartoon (imagined for the lesson): a pot-bellied official holds a "Melayani Rakyat" banner; behind him, a long queue.
        petinggi = top official (petinggi negara). korup = corrupt. serakah = greedy.
        angkuh = arrogant. kelakuan = behaviour, antics (from laku). tampang = looks, face (informal).
        slogan = slogan. birokrasi = bureaucracy, red tape.
        - On the street: nggak = tidak (no, not), nulis = menulis (to write), udah = sudah (already), ngomong = berbicara (to talk), banget = sekali (very), aku / -ku = saya (I), ngerti = mengerti (to understand).
    examples:
      - text: Slogannya 'Melayani Rakyat', tapi antreannya tiga jam.
        ar_eg: شعاره 'خدمة الشعب'، بس الطابور تلات ساعات.
        ar: شعاره 'خدمة الشعب'، لكن الطابور ثلاث ساعات.
        en: His slogan is 'Serving the People', but the queue is three hours.
      - text: Kartunis itu menggambar petinggi yang serakah dan angkuh.
        ar_eg: رسام الكاريكاتير رسم مسؤول كبير طماع ومتكبر.
        ar: رسم رسّام الكاريكاتير مسؤولًا كبيرًا جشعًا متعاليًا.
        en: The cartoonist drew a greedy, arrogant top official.
      - text: Tampangnya polos, kelakuannya korup.
        ar_eg: شكله غلبان، وعمايله فاسدة.
        ar: هيئته بريئة، وسلوكه فاسد.
        en: He looks innocent; he acts corrupt.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: petinggi
        ar_eg: مسؤول كبير
        ar: مسؤول كبير
        en: top official
      - text: korup
        ar_eg: فاسد
        ar: فاسد
        en: corrupt
      - text: serakah
        ar_eg: طماع
        ar: جشع
        en: greedy
      - text: angkuh
        ar_eg: متكبر
        ar: متكبّر
        en: arrogant
    words: [petinggi, korup, serakah, angkuh]
  - id: e02
    type: match_pairs
    pairs:
      - text: kelakuan
        ar_eg: عمايل، تصرفات
        ar: سلوك
        en: behaviour
      - text: tampang
        ar_eg: شكل، سحنة
        ar: هيئة
        en: looks
      - text: slogan
        ar_eg: شعار
        ar: شعار
        en: slogan
      - text: birokrasi
        ar_eg: روتين
        ar: بيروقراطية
        en: bureaucracy
    words: [kelakuan, tampang, slogan, birokrasi]
  - id: e03
    type: listen
    text: Mengurus izin saja butuh tujuh tanda tangan. Birokrasi!
    question:
      ar_eg: هو بيشتكي من إيه؟
      ar: مِمَّ يشتكي؟
      en: What is he complaining about?
    options: [الروتين, الفساد, الطمع]
    answer: 0
    meaning:
      ar_eg: تصريح بسيط محتاج سبع إمضاءات. روتين!
      ar: مجرد تصريح يحتاج سبعة تواقيع. بيروقراطية!
      en: Seven signatures just for a permit. Red tape!
    words: [birokrasi]
  - id: e04
    type: fill_blank
    sentence: Pejabat ___ itu menerima suap dari pengusaha.
    meaning:
      ar_eg: المسؤول ___ ده خد رشوة من رجل أعمال.
      ar: تلقّى ذلك المسؤول ___ رشوة من رجل أعمال.
      en: That ___ official took a bribe from a businessman.
    options: [korup, angkuh, tampang]
    answers: [korup]
    words: [korup, angkuh, tampang]
    explain:
      ar_eg: اللي بياخد رشوة korup (فاسد). angkuh = متكبر وtampang = شكل الوش.
      ar: من يأخذ الرشوة korup (فاسد)؛ أمّا angkuh فمتكبّر، وtampang هيئة الوجه.
      en: Taking a bribe makes him korup, corrupt. angkuh is arrogant, and tampang a person's looks.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي عنده كتير ولسه عايز أكتر، توصفه بإيه؟
      ar: بمَ تصف من يملك الكثير ويريد المزيد؟
      en: Someone who has plenty yet wants more is…
    options: [angkuh, serakah, slogan]
    answer: 1
    explain:
      ar_eg: serakah = طماع.
      ar: serakah = جشع.
      en: serakah = greedy.
    words: [serakah, angkuh, slogan]
  - id: e06
    type: fill_blank
    sentence: Dia tidak mau menyapa orang kecil. Dia sangat ___.
    meaning:
      ar_eg: ما بيرضاش يسلّم على الناس الغلابة. هو ___ أوي.
      ar: لا يُلقي التحية على البسطاء. إنه ___ جدًا.
      en: He won't greet ordinary people. He's very ___.
    options: [angkuh, kelakuan, petinggi]
    answers: [angkuh]
    words: [angkuh, kelakuan, petinggi]
    explain:
      ar_eg: اللي مش بيسلّم على الغلابة angkuh (متكبر). kelakuan = تصرفات وpetinggi = مسؤول كبير، أسماء.
      ar: من لا يحيّي البسطاء angkuh (متكبّر)؛ أمّا kelakuan (تصرّفات) وpetinggi (مسؤول كبير) فاسمان.
      en: Snubbing ordinary people is angkuh, arrogant. kelakuan (antics) and petinggi (top official) are nouns.
  - id: e07
    type: multiple_choice
    question: Lihat ___-nya! Seperti tidak bersalah.
    options: [birokrasi, korup, tampang]
    answer: 2
    explain:
      ar_eg: tampang = الشكل والسحنة، كلمة عامية شوية.
      ar: tampang = الهيئة والسِّحنة، لفظ دارج.
      en: tampang = looks, face (informal).
    words: [tampang, birokrasi, korup]
  - id: e08
    type: build_sentence
    source:
      ar_eg: تصرفات المسؤول الكبير ده بقت مادة للكاريكاتير.
      ar: صار سلوك ذلك المسؤول مادة للكاريكاتير.
      en: That top official's antics became material for cartoons.
    answer: Kelakuan petinggi itu menjadi bahan kartun.
    distractors: [slogan, serakah]
    words: [kelakuan, petinggi]
    explain:
      ar_eg: «تصرفات المسؤول الكبير» = Kelakuan petinggi و«بقت مادة للكاريكاتير» = menjadi bahan kartun. slogan وserakah زيادة.
      ar: «تصرّفات المسؤول الكبير» Kelakuan petinggi و«صارت مادّة للرسوم» menjadi bahan kartun؛ أمّا slogan وserakah فزائدتان.
      en: "\"The top official's antics\" is Kelakuan petinggi and \"became cartoon material\" is menjadi bahan kartun. slogan and serakah aren't needed."
  - id: e09
    type: translate
    direction: from_target
    source_text: Slogan antikorupsi ditempel di kantor yang penuh birokrasi.
    answers_meaning:
      ar_eg: [شعار ضد الفساد متعلّق في مكتب مليان روتين, لزقوا شعار مكافحة الفساد في مكتب كله روتين]
      ar: [عُلّق شعار مكافحة الفساد في مكتب يعجّ بالبيروقراطية]
      en: [An anti-corruption slogan hangs in an office full of red tape, An anti-corruption slogan was stuck up in a bureaucratic office]
    words: [slogan, birokrasi]
  - id: e10
    type: speaking
    text: 'Kartun itu lucu: petinggi yang serakah itu tampangnya polos.'
    meaning:
      ar_eg: 'الكاريكاتير ده مضحك: المسؤول الطماع ده شكله غلبان.'
      ar: 'الكاريكاتير مضحك: ذلك المسؤول الجشع هيئته بريئة.'
      en: 'The cartoon is funny: the greedy official looks so innocent.'
    words: [serakah, petinggi, tampang]
dialogue:
  lines:
    - speaker: Mohamed
      text: Bang, kartun di koran ini maksudnya apa?
      ar_eg: يا بانج، الكاريكاتير اللي في الجرنال ده قصده إيه؟
      ar: يا بانغ، ما المقصود بهذا الكاريكاتير في الجريدة؟
      en: Bang, what does this cartoon in the paper mean?
    - speaker: Bang Togar
      text: Lihat petinggi gemuk itu. Slogannya 'Melayani Rakyat'.
      ar_eg: بص المسؤول التخين ده. شعاره 'خدمة الشعب'.
      ar: انظر إلى ذلك المسؤول البدين. شعاره 'خدمة الشعب'.
      en: 'Look at that fat official. His slogan: ''Serving the People''.'
    - speaker: Mohamed
      text: Tapi dia duduk di atas tumpukan uang, dan rakyatnya antre.
      ar_eg: بس هو قاعد على كومة فلوس، والناس واقفة في طابور.
      ar: لكنه جالس على كومة مال، والناس في الطابور.
      en: But he's sitting on a pile of money while the people queue.
    - speaker: Bang Togar
      text: Itu ironinya. Kartunis nggak nulis 'serakah' atau 'korup'. Gambarnya udah ngomong.
      ar_eg: دي السخرية. الرسام ما كتبش 'طماع' ولا 'فاسد'. الرسمة بتتكلم لوحدها.
      ar: تلك هي المفارقة. لم يكتب الرسام 'جشع' أو 'فاسد'. الرسم ينطق وحده.
      en: That's the irony. The cartoonist doesn't write 'greedy' or 'corrupt'. The drawing speaks.
    - speaker: Mohamed
      text: Dan tampangnya angkuh banget. Aku ngerti!
      ar_eg: وشكله متكبر أوي. فهمت!
      ar: وهيئته متعالية جدًا. فهمت!
      en: And he looks so arrogant. I get it!
