schema: kabar.lesson/v1
id: bipa5.u10.l08
language: id
title: Cap Go Meh di Singkawang
can_do:
  ar_eg: 'توصف احتفال كاب جو ميه: الموكب والباروجساي والصواريخ والمعابد الصينية والبخور، والمصور، وإيه اللي لافت للنظر.'
  ar: 'أن تصف احتفال كاب غو ميه: المسيرة ورقصة الأسد والمفرقعات والمعابد الصينية والبخور، والمصوّر، وما يلفت النظر.'
  en: 'Describe Cap Go Meh: the parade and procession, lion dance, firecrackers, Chinese temples and incense, the photographer and what stands out.'
slides:
  - title: Kota seribu kelenteng
    body:
      ar_eg: |
        Cap Go Meh = الليلة الخامسة عشر بعد رأس السنة الصينية (Imlek).
        parade = استعراض، arak-arakan = موكب ماشي في الشارع.
        barongsai = رقصة الأسد الصيني، petasan = صواريخ وبمب.
        kelenteng = معبد صيني (سينجكاوانج اسمها "مدينة الألف معبد")، dupa = بخور (عيدان البخور).
        fotografer = مصور، menonjol = لافت للنظر، بارز.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: udah = sudah، kecium = tercium.
      ar: |
        Cap Go Meh = الليلة الخامسة عشرة بعد رأس السنة الصينية (Imlek).
        parade = استعراض، arak-arakan = موكب يسير في الشوارع.
        barongsai = رقصة الأسد الصينية، petasan = مفرقعات.
        kelenteng = معبد صيني (تُلقّب سينغكاوانغ "مدينة الألف معبد")، dupa = بخور (أعواد البخور).
        fotografer = مصوّر، menonjol = بارز، لافت للنظر.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: udah = sudah، kecium = tercium.
      en: |
        Cap Go Meh = the fifteenth night after Chinese New Year (Imlek).
        parade = parade, arak-arakan = street procession.
        barongsai = Chinese lion dance, petasan = firecrackers.
        kelenteng = Chinese temple (Singkawang is called "city of a thousand temples"), dupa = incense (joss sticks).
        fotografer = photographer, menonjol = prominent, striking.
        The dialogue uses street forms; the formal ones are beside them: udah = sudah, kecium = tercium.
    examples:
      - text: Arak-arakan tatung adalah bagian paling menonjol dari Cap Go Meh di Singkawang.
        ar_eg: موكب التاتونج أبرز حاجة في كاب جو ميه في سينجكاوانج.
        ar: موكب التاتونغ أبرز ما في كاب غو ميه في سينغكاوانغ.
        en: The tatung procession is the most striking part of Cap Go Meh in Singkawang.
      - text: Bau dupa keluar dari setiap kelenteng.
        ar_eg: ريحة البخور طالعة من كل معبد.
        ar: تفوح رائحة البخور من كل معبد.
        en: The smell of incense comes from every temple.
      - text: Fotografer dari seluruh dunia datang untuk memotret barongsai.
        ar_eg: مصورين من كل حتة في العالم بييجوا يصوروا الباروجساي.
        ar: يأتي مصوّرون من أنحاء العالم لتصوير رقصة الأسد.
        en: Photographers from all over the world come to shoot the lion dance.
