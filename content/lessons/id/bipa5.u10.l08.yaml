      ar_eg: ريحة البخور طالعة من المعبد.
      ar: تفوح رائحة البخور من المعبد.
      en: The smell of incense comes from the temple.
    answer: Bau dupa keluar dari kelenteng.
    distractors: [petasan, parade]
    words: [dupa, kelenteng]
    explain:
      ar_eg: «ريحة البخور» = Bau dupa و«المعبد» = kelenteng. petasan = صواريخ وparade = موكب، مش في الجملة.
      ar: «رائحة البخور» = Bau dupa و«المعبد» = kelenteng. أما petasan فالمفرقعات، وparade الموكب.
      en: "\"Smell of incense\" is bau dupa and \"temple\" kelenteng. petasan and parade aren't in it."
  - id: e09
    type: translate
    direction: from_target
    source_text: Parade Cap Go Meh dimulai jam delapan pagi.
    answers_meaning:
      ar_eg: [استعراض كاب جو ميه بيبدأ الساعة تمانية الصبح, الاستعراض بيبدأ تمانية الصبح]
      ar: [يبدأ استعراض كاب غو ميه في الثامنة صباحًا, ينطلق الاستعراض الساعة الثامنة صباحًا]
      en: [The Cap Go Meh parade starts at eight in the morning, The parade begins at 8 a.m.]
    words: [parade]
  - id: e10
    type: speaking
    text: Barongsai dan arak-arakan tatung paling menonjol tahun ini.
    meaning:
      ar_eg: الباروجساي وموكب التاتونج كانوا أبرز حاجة السنة دي.
      ar: كانت رقصة الأسد وموكب التاتونغ الأبرز هذا العام.
      en: The lion dance and the tatung procession stood out most this year.
    words: [barongsai, arak-arakan, menonjol]
dialogue:
  lines:
    - speaker: Bu Meilin
      text: Selamat datang di Singkawang, Pak Mohamed! Besok puncak Cap Go Meh.
      ar_eg: أهلًا بيك في سينجكاوانج يا أستاذ محمد! بكرة ذروة كاب جو ميه.
      ar: أهلًا بك في سينغكاوانغ يا أستاذ محمد! غدًا ذروة كاب غو ميه.
      en: Welcome to Singkawang, Mohamed! Tomorrow is the height of Cap Go Meh.
    - speaker: Mohamed
      text: Saya udah kecium bau dupa dari kelenteng di ujung jalan, Bu.
      ar_eg: أنا شميت ريحة البخور من المعبد اللي في آخر الشارع.
      ar: شممت رائحة البخور من المعبد في آخر الشارع.
      en: I can already smell incense from the temple at the end of the street.
    - speaker: Bu Meilin
      text: Besok ada parade, barongsai, dan arak-arakan tatung. Jangan kaget dengan petasan!
      ar_eg: بكرة فيه استعراض وباروجساي وموكب التاتونج. ما تتخضش من الصواريخ!
      ar: غدًا استعراض ورقصة أسد وموكب التاتونغ. لا تفزع من المفرقعات!
      en: Tomorrow there's a parade, lion dance and the tatung procession. Don't jump at the firecrackers!
    - speaker: Mohamed
      text: Yang paling menonjol apa, Bu?
      ar_eg: إيه أبرز حاجة؟
      ar: ما الأبرز؟
      en: What stands out most?
    - speaker: Bu Meilin
      text: 'Tatung: orang Tionghoa dan Dayak berjalan bersama. Fotografer dari luar negeri datang khusus untuk itu.'
      ar_eg: 'التاتونج: صينيين وداياك ماشيين مع بعض. مصورين من بره بييجوا مخصوص عشانهم.'
      ar: 'التاتونغ: يسير التيونغهوا والداياك معًا، ويأتي مصوّرون من الخارج خصيصًا لذلك.'
      en: 'The tatung: Chinese Indonesians and Dayak walk together. Photographers come from abroad just for that.'
