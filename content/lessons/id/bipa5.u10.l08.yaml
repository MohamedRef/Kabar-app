  - id: e03
    type: listen
    text: Hati-hati, suara petasannya keras sekali!
    question:
      ar_eg: إيه اللي صوته عالي؟
      ar: ما الذي صوته عالٍ؟
      en: What is loud?
    options: [الصواريخ, المزيكا, العربيات]
    answer: 0
    meaning:
      ar_eg: خد بالك، صوت الصواريخ عالي أوي!
      ar: احذر، صوت المفرقعات عالٍ جدًا!
      en: Careful, the firecrackers are really loud!
    words: [petasan]
  - id: e04
    type: fill_blank
    sentence: Umat Buddha dan Konghucu berdoa di ___.
    meaning:
      ar_eg: البوذيين والكونفوشيين بيصلوا في ال___.
      ar: يصلّي البوذيون والكونفوشيوسيون في ال___.
      en: Buddhists and Confucians pray at the ___.
    options: [kelenteng, parade, fotografer]
    answers: [kelenteng]
    words: [kelenteng, parade, fotografer]
    explain:
      ar_eg: البوذيين والكونفوشيين بيصلوا في kelenteng (معبد صيني). parade = موكب وfotografer = مصور، مش أماكن صلاة.
      ar: يصلّي البوذيون والكونفوشيوسيون في kelenteng (المعبد الصيني). أما parade فالموكب، وfotografer المصوّر.
      en: They pray at a kelenteng (Chinese temple). parade and fotografer aren't places of worship.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الرقصة اللي فيها اتنين لابسين أسد صيني ملون وبينطوا اسمها إيه؟
      ar: ما الرقصة التي يرتدي فيها شخصان زيّ أسد صيني ملوّن ويقفزان؟
      en: What's the dance where two people in a colourful Chinese lion costume leap about?
    options: [dupa, menonjol, barongsai]
    answer: 2
    explain:
      ar_eg: barongsai = رقصة الأسد.
      ar: barongsai = رقصة الأسد.
      en: barongsai = lion dance.
    words: [dupa, menonjol, barongsai]
  - id: e06
    type: fill_blank
    sentence: Seorang ___ memotret arak-arakan dari atas gedung.
    meaning:
      ar_eg: ___ بيصور الموكب من فوق مبنى.
      ar: يصوّر ___ الموكب من أعلى مبنى.
      en: A ___ shoots the procession from a rooftop.
    options: [fotografer, dupa, petasan]
    answers: [fotografer]
    words: [fotografer, dupa, petasan, arak-arakan]
    explain:
      ar_eg: اللي بيصور fotografer. dupa = بخور وpetasan = صواريخ، مش ناس.
      ar: الذي يصوّر fotografer. أما dupa فالبخور، وpetasan المفرقعات.
      en: The one taking photos is a fotografer. dupa (incense) and petasan (firecrackers) aren't people.
  - id: e07
    type: multiple_choice
    question: Warna merah sangat ___ di kota itu saat Imlek.
    options: [arak-arakan, menonjol, kelenteng]
    answer: 1
    explain:
      ar_eg: menonjol = لافت للنظر.
      ar: menonjol = بارز.
      en: menonjol = striking, prominent.
    words: [arak-arakan, menonjol, kelenteng]
  - id: e08
