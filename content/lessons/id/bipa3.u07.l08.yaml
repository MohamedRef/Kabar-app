schema: kabar.lesson/v1
id: bipa3.u07.l08
language: id
title: Biografi pahlawan
can_do:
  ar_eg: تكتب سيرة قصيرة لبطل قومي، بالمعلوم والمجهول.
  ar: أن تكتب سيرة قصيرة لبطل قومي بالمبني للمعلوم والمجهول.
  en: Write a short biography of a national hero, mixing active and passive.
slides:
  - title: Beliau, Tuan Guru
    body:
      ar_eg: |
        لما تتكلم عن حد كبير ومحترم (عالم، أستاذ، حد متوفي) قول beliau بدل dia. هي «هو / هي» بس باحترام، زي «حضرته».
        وفي لومبوك العالم الكبير اسمه Tuan Guru (التوان جورو)، وأشهرهم Tuan Guru Zainuddin Abdul Madjid، أول بطل قومي من لومبوك.
        في السيرة: lahir → belajar → mendirikan → wafat، وdi- للحاجات اللي اتعملت له (diangkat).
      ar: |
        عند الحديث عن شخص كبير محترم (عالم، أستاذ، متوفّى) يُقال beliau بدل dia، وهي ضمير الغائب مع التوقير، كقولنا «حضرته».
        وفي لومبوك يُلقَّب العالم الكبير Tuan Guru، وأشهرهم Tuan Guru Zainuddin Abdul Madjid، أول بطل قومي من لومبوك.
        والسيرة: lahir ← belajar ← mendirikan ← wafat، مع di- لما وقع عليه (diangkat).
      en: |
        For an elder or someone highly respected (a scholar, a teacher, someone who has passed away), say beliau instead of dia: a respectful "he / she".
        On Lombok a great scholar is called Tuan Guru. The best known, Tuan Guru Zainuddin Abdul Madjid, is Lombok's first national hero.
        A biography runs lahir → belajar → mendirikan → wafat, with di- for what was done to the person (diangkat).
    grammar: id.passive.di
    examples:
      - text: Beliau lahir di Pancor, Lombok Timur.
        ar_eg: حضرته اتولد في بانتشور، شرق لومبوك.
        ar: وُلد في بانتشور، شرق لومبوك.
        en: He was born in Pancor, East Lombok.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: بتتكلم باحترام عن عالم دين كبير. تستعمل أنهي ضمير؟
      ar: تتحدث بتوقير عن عالم دين كبير. أيّ ضمير تستعمل؟
      en: You're talking respectfully about an eminent scholar. Which pronoun do you use?
    options: [dia, beliau, kamu]
    answer: 1
    explain:
      ar_eg: beliau = هو / هي باحترام، للكبار والعلماء والناس اللي توفّوا.
      ar: beliau ضمير الغائب مع التوقير، للكبار والعلماء والمتوفَّين.
      en: beliau is a respectful he / she, for elders, scholars and people who have passed away.
    words: [beliau]
  - id: e02
    type: listen
    text: Beliau mendirikan organisasi Nahdlatul Wathan pada tahun 1953.
    options:
      - Beliau mendirikan madrasah Nahdlatul Wathan pada tahun 1953.
      - Beliau mendirikan organisasi Nahdlatul Wathan pada tahun 1935.
      - Beliau mendirikan organisasi Nahdlatul Wathan pada tahun 1953.
    answer: 2
    meaning:
      ar_eg: حضرته أسس جمعية نهضة الوطن سنة 1953.
      ar: أسّس جمعية نهضة الوطن عام 1953.
      en: He founded the Nahdlatul Wathan organisation in 1953.
    words: [beliau, mendirikan, organisasi]
  - id: e03
    type: match_pairs
    pairs:
      - text: beliau
        ar_eg: هو / هي (باحترام)
        ar: هو / هي (مع التوقير)
        en: he / she (respectful)
      - text: tuan guru
        ar_eg: لقب العالم الكبير في لومبوك
        ar: لقب العالم الكبير في لومبوك
        en: title of a leading scholar on Lombok
      - text: murid
        ar_eg: تلميذ
        ar: تلميذ
        en: pupil, student
      - text: organisasi
        ar_eg: جمعية / منظمة
        ar: منظمة
        en: organisation
      - text: mendirikan
        ar_eg: يأسس
        ar: يؤسّس
        en: to found
    words: [beliau, tuan guru, murid, organisasi, mendirikan]
  - id: e04
    type: fill_blank
    sentence: Madrasah itu ___ oleh Tuan Guru Zainuddin pada tahun 1937.
    meaning:
      ar_eg: (اكتب صيغة di- من mendirikan) المدرسة دي اتأسست على إيد التوان جورو زين الدين سنة 1937.
      ar: (اكتب صيغة di- من mendirikan) أسّس التوان غورو زين الدين تلك المدرسة عام 1937.
      en: (Write the di- form of mendirikan.) That madrasah was founded by Tuan Guru Zainuddin in 1937.
    answers: [didirikan]
    words: [mendirikan, tuan guru]
    explain:
      ar_eg: "المدرسة «اتأسست على إيد» حد، فالمجهول: di- + dirikan = didirikan، وبعدها oleh."
      ar: المدرسة «أُسّست على يد» أحد، فالمجهول di- مع dirikan = didirikan، ثم oleh.
      en: "The madrasah \"was founded by\" someone, so passive: di- + dirikan = didirikan, then oleh."
  - id: e05
    type: build_sentence
    source:
      ar_eg: الجمعية دي أسسها هو (حضرته).
      ar: أسّس هذه المنظمةَ هو.
      en: That organisation was founded by him.
    answer: Organisasi itu didirikan oleh beliau.
    distractors: [mendirikan, saya]
    words: [organisasi, beliau]
    explain:
      ar_eg: "الجمعية في الأول، فالمجهول: Organisasi itu didirikan oleh beliau. mendirikan للفاعل في الأول، وsaya مش هو."
      ar: "المنظمة أولًا فالمجهول: Organisasi itu didirikan oleh beliau. أما mendirikan فحين يتقدّم الفاعل، وsaya ليس «هو»."
      en: "The organisation comes first, so passive: didirikan oleh beliau. mendirikan needs the doer first, and saya isn't \"him\"."
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: حضرته اتعلم في مكة وعلّم تلاميذ كتير في لومبوك.
      ar: درس في مكة وعلّم تلاميذ كثيرين في لومبوك.
      en: He studied in Mecca and taught many pupils on Lombok.
    answers:
      - Beliau belajar di Mekah dan mengajar banyak murid di Lombok.
      - Beliau belajar di Mekah dan mengajar banyak murid di Lombok
      - Beliau belajar di Mekkah dan mengajar banyak murid di Lombok.
      - Beliau belajar di Makkah dan mengajar banyak murid di Lombok.
      - Beliau belajar di Mekah, lalu mengajar banyak murid di Lombok.
      - Beliau belajar di Mekah dan mengajar murid yang banyak di Lombok.
      - Dia belajar di Mekah dan mengajar banyak murid di Lombok.
      - Dia belajar di Mekah dan mengajar banyak murid di Lombok
    explain:
      ar_eg: Dia صح كمان، بس beliau أحسن مع عالم كبير.
      ar: Dia صحيحة أيضًا، لكن beliau أليق بعالم كبير.
      en: Dia is also correct, but beliau suits an eminent scholar better.
    words: [beliau, murid]
  - id: e07
    type: fill_blank
    sentence: Pada tahun 2017, beliau ___ menjadi pahlawan nasional.
    meaning:
      ar_eg: سنة 2017 اتعلن بطل قومي.
      ar: أُعلن عام 2017 بطلًا قوميًّا.
      en: In 2017 he was made a national hero.
    options: [mengangkat, diangkat, angkat]
    answers: [diangkat]
    words: [beliau, pahlawan]
    explain:
      ar_eg: هو «اتعيّن» بطل، فالمجهول diangkat. mengangkat للي بيعيّن، وangkat من غير بادئة محتاجة ضمير قبلها.
      ar: هو «عُيّن» بطلًا فالمجهول diangkat. أما mengangkat فلمن يعيّن، وangkat بلا سابقة تحتاج ضميرًا قبلها.
      en: He "was made" a hero, so passive diangkat. mengangkat is for whoever appoints, and bare angkat needs a pronoun before it.
  - id: e08
    type: dictation
    text: Murid-murid beliau ada di seluruh Lombok.
    meaning:
      ar_eg: تلاميذ حضرته موجودين في لومبوك كلها.
      ar: تلاميذه منتشرون في أنحاء لومبوك.
      en: His pupils are all over Lombok.
    words: [murid, beliau]
  - id: e09
    type: speaking
    text: Tuan Guru Zainuddin adalah seorang ulama dan pahlawan nasional dari Lombok.
    meaning:
      ar_eg: التوان جورو زين الدين عالم دين وبطل قومي من لومبوك.
      ar: التوان غورو زين الدين عالمُ دين وبطلٌ قومي من لومبوك.
      en: Tuan Guru Zainuddin is an Islamic scholar and a national hero from Lombok.
    words: [tuan guru, ulama, pahlawan]
dialogue:
  title: Pahlawan dari Lombok
  lines:
    - speaker: Mohamed
      text: Mas Rizal, pahlawan Indonesia dari Lombok siapa?
      ar_eg: يا مس ريزال، مين البطل الإندونيسي اللي من لومبوك؟
      ar: يا مس ريزال، من البطل الإندونيسي من لومبوك؟
      en: Mas Rizal, who is the Indonesian hero from Lombok?
    - speaker: Mas Rizal
      text: Tuan Guru Zainuddin Abdul Madjid. Beliau lahir di Pancor, Lombok Timur.
      ar_eg: التوان جورو زين الدين عبد المجيد. حضرته اتولد في بانتشور، شرق لومبوك.
      ar: التوان غورو زين الدين عبد المجيد، وُلد في بانتشور شرق لومبوك.
      en: Tuan Guru Zainuddin Abdul Madjid. He was born in Pancor, East Lombok.
    - speaker: Mohamed
      text: Beliau ulama, ya?
      ar_eg: هو كان عالم دين، صح؟
      ar: كان عالم دين، أليس كذلك؟
      en: He was an Islamic scholar, right?
    - speaker: Mas Rizal
      text: Iya. Beliau belajar di Mekah, terus pulang dan mendirikan madrasah.
      ar_eg: أيوه. اتعلم في مكة، وبعدين رجع وأسس مدرسة.
      ar: نعم. درس في مكة، ثم عاد وأسّس مدرسة.
      en: Yes. He studied in Mecca, then came home and founded a madrasah.
    - speaker: Mohamed
      text: Masyaallah! Murid beliau banyak?
      ar_eg: ما شاء الله! وكان عنده تلاميذ كتير؟
      ar: ما شاء الله! وهل كان له تلاميذ كثيرون؟
      en: Masha'Allah! Did he have many pupils?
    - speaker: Mas Rizal
      text: Banyak banget. Tahun 2017, beliau jadi pahlawan nasional.
      ar_eg: كتير جدًا. وسنة 2017 اتعلن بطل قومي.
      ar: كثيرون جدًا. وفي عام 2017 أُعلن بطلًا قوميًّا.
      en: A great many. In 2017 he was made a national hero.
