schema: kabar.lesson/v1
id: bipa1.u07.l03
language: id
title: Enak sekali!
can_do:
  ar_eg: تقوّي الصفات (حلو أوي، جميل جدًا).
  ar: أن تقوّي الصفات (لذيذ جدًا، جميل جدًا).
  en: Intensify adjectives.
slides:
  - title: enak sekali
    body:
      ar_eg: |
        أسهل طريقة تقول «أوي»: حط sekali بعد الصفة، زي «حلو أوي» بالظبط:
        enak sekali = حلو أوي، indah sekali = جميل جدًا.
        دي العادية والمؤدبة، تنفع مع أي حد.
        (sekali كمان معناها «مرة واحدة» زي ما شفنا في sekali seminggu، السياق بيفرّق.)
      ar: |
        أسهل طريقة للتعبير عن «جدًا» أن تضع sekali بعد الصفة:
        enak sekali = لذيذ جدًا، indah sekali = جميل جدًا.
        وهي محايدة مهذبة تصلح مع الجميع.
        (وsekali تعني أيضًا «مرة واحدة» كما في sekali seminggu، والسياق يفرّق.)
      en: |
        The easiest "very": put sekali after the adjective, just like «حلو أوي»:
        enak sekali = really tasty, indah sekali = very beautiful.
        Neutral and polite — fine with anyone.
        (sekali also means "once", as in sekali seminggu; context tells you which.)
    grammar: id.intensifier.basic
    examples:
      - text: Pemandangannya indah sekali.
        ar_eg: المنظر جميل أوي.
        ar: المنظر جميل جدًا.
        en: The view is very beautiful.
  - title: sangat enak
    body:
      ar_eg: |
        sangat بتيجي قبل الصفة، وهي أرسمي شوية (كتابة، أخبار، كلام مؤدب):
        sangat enak = لذيذ جدًا، sangat terkenal = مشهور جدًا.
        ماتقولش «enak sangat»: sangat دايمًا قبل.
      ar: |
        sangat تأتي قبل الصفة، وهي أكثر رسمية (في الكتابة والأخبار):
        sangat enak = لذيذ جدًا، sangat terkenal = مشهور جدًا.
        ولا يُقال «enak sangat»؛ فـ sangat تتقدم دائمًا.
      en: |
        sangat goes before the adjective and is a bit more formal (writing, news):
        sangat enak = very tasty, sangat terkenal = very famous.
        Never "enak sangat" — sangat always comes first.
    grammar: id.intensifier.basic
    examples:
      - text: Bali sangat terkenal.
        ar_eg: بالي مشهورة جدًا.
        ar: بالي مشهورة جدًا.
        en: Bali is very famous.
  - title: enak banget!
    body:
      ar_eg: |
        banget بعد الصفة، وهي العامية بتاعة الشباب في جاكرتا، زي «أوووي»:
        enak banget = حلو أوي أوي، mahal banget = غالي أوي.
        في الشات بيكتبوها bgt: «mahal bgt».
        استخدمها مع صحابك، مش في الإيميل الرسمي.
      ar: |
        banget تأتي بعد الصفة، وهي عامية شائعة بين الشباب:
        enak banget = لذيذ جدًا، mahal banget = غالٍ جدًا.
        وتُكتب في المحادثات bgt: «mahal bgt».
        استعملها مع الأصدقاء لا في الرسائل الرسمية.
      en: |
        banget goes after the adjective — casual, everywhere in Jakarta:
        enak banget = sooo good, mahal banget = so expensive.
        Chats write it bgt: "mahal bgt".
        Use it with friends, not in a formal email.
    grammar: id.intensifier.basic
    examples:
      - text: Kopinya enak banget!
        ar_eg: القهوة حلوة أوي!
        ar: القهوة لذيذة جدًا!
        en: The coffee is so good!
      - text: mahal bgt sih
        ar_eg: غالي أوي بقى. (شات)
        ar: غالٍ جدًا. (محادثة)
        en: That's so expensive. (chat)
  - title: sangat atau sekali?
    body:
      ar_eg: |
        اختار واحدة بس: sangat enak أو enak sekali.
        «sangat enak sekali» الناس بتقولها، بس في الكتابة الرسمية بتتحسب غلط.
        ملخص: sangat قبل، sekali وbanget بعد.
      ar: |
        اختر واحدة فقط: sangat enak أو enak sekali.
        وعبارة «sangat enak sekali» شائعة في الكلام لكنها تُعدّ خطأً في الكتابة الرسمية.
        الخلاصة: sangat قبل الصفة، وsekali وbanget بعدها.
      en: |
        Pick one: sangat enak or enak sekali.
        People do say "sangat enak sekali", but formal writing counts it as wrong.
        Summary: sangat before; sekali and banget after.
    grammar: id.intensifier.basic
    examples:
      - text: Kemang ramai sekali.
        ar_eg: كيمانج زحمة أوي.
        ar: كيمانغ مزدحمة جدًا.
        en: Kemang is really busy.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: indah
        ar_eg: جميل
        ar: جميل
        en: beautiful
      - text: mahal
        ar_eg: غالي
        ar: غالٍ
        en: expensive
      - text: murah
        ar_eg: رخيص
        ar: رخيص
        en: cheap
      - text: capek
        ar_eg: تعبان
        ar: متعب
        en: tired
      - text: ramai
        ar_eg: زحمة
        ar: مزدحم
        en: busy, crowded
    words: [indah, mahal, murah, capek, ramai]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة صح؟
      ar: أيّها صحيح؟
      en: Which one is correct?
    options: ["Enak sangat!", "Sekali enak!", "Sangat enak!"]
    answer: 2
    explain:
      ar_eg: sangat قبل الصفة، وsekali بعدها.
      ar: sangat قبل الصفة، وsekali بعدها.
      en: sangat goes before the adjective; sekali goes after.
    words: [sangat]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: بتشات مع صاحبك. أنهي واحدة الأكثر عامية؟
      ar: تحادث صديقك. أيّها الأكثر عامية؟
      en: You're chatting with a friend. Which is the most casual?
    options: ["Enak sekali!", "Enak banget!", "Sangat enak!"]
    answer: 1
    explain:
      ar_eg: banget عامية الشباب، sangat أرسمي، sekali في النص.
      ar: banget عامية، وsangat رسمية، وsekali محايدة.
      en: banget is casual, sangat formal, sekali in between.
    words: [banget]
  - id: e04
    type: listen
    text: Pemandangannya indah sekali.
    options: ["Makanannya enak sekali.", "Pemandangannya indah sekali.", "Pemandangannya sangat indah."]
    answer: 1
    words: [pemandangan, indah, sekali]
  - id: e05
    type: fill_blank
    sentence: Bali ___ terkenal.
    meaning:
      ar_eg: بالي مشهورة جدًا.
      ar: بالي مشهورة جدًا.
      en: Bali is very famous.
    options: ["sangat", "banget", "sekali"]
    answers: [sangat]
    explain:
      ar_eg: الفراغ قبل الصفة، والوحيدة اللي بتيجي قبل هي sangat.
      ar: الفراغ قبل الصفة، ولا يتقدمها إلا sangat.
      en: The gap is before the adjective — only sangat goes there.
    words: [sangat, terkenal]
  - id: e06
    type: fill_blank
    sentence: Kopi ini enak ___!
    meaning:
      ar_eg: القهوة دي حلوة أوي!
      ar: هذه القهوة لذيذة جدًا!
      en: This coffee is really good!
    options: ["sering", "sekali", "sangat"]
    answers: [sekali]
    explain:
      ar_eg: بعد الصفة يبقى sekali. sering معناها «كتير» في التكرار.
      ar: بعد الصفة تأتي sekali، أما sering فللتكرار.
      en: After the adjective → sekali. sering means "often".
    words: [sekali]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الأكل في كيمانج حلو أوي.
      ar: الطعام في كيمانغ لذيذ جدًا.
      en: The food in Kemang is really tasty.
    answer: Makanan di Kemang enak sekali.
    distractors: [mahal, sering]
    words: [makanan, enak, sekali]
  - id: e08
    type: translate
    direction: from_target
    source_text: Mahal banget!
    answers_meaning:
      ar_eg: ["غالي أوي!", "غالي جدًا", "غالي قوي"]
      ar: ["غالٍ جدًا!", "باهظ جدًا", "غالي جدًا"]
      en: ["So expensive!", "Very expensive", "That's really expensive"]
    words: [mahal, banget]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المنظر جميل جدًا.
      ar: المنظر جميل جدًا.
      en: The view is very beautiful.
    answers:
      - Pemandangannya indah sekali.
      - Pemandangannya sangat indah.
      - Pemandangannya indah banget.
      - Pemandangan indah sekali.
      - Pemandangannya bagus sekali.
      - Pemandangannya sangat bagus.
    words: [pemandangan, indah]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا تعبان أوي.
      ar: أنا متعب جدًا.
      en: I'm very tired.
    answers:
      - Saya capek sekali.
      - Saya sangat capek.
      - Saya capek banget.
      - Aku capek sekali.
      - Aku capek banget.
      - Aku sangat capek.
      - Saya lelah sekali.
      - Saya sangat lelah.
    words: [capek]
  - id: e11
    type: dictation
    text: Kemang ramai sekali.
    meaning:
      ar_eg: كيمانج زحمة أوي.
      ar: كيمانغ مزدحمة جدًا.
      en: Kemang is really busy.
    words: [ramai, sekali]
  - id: e12
    type: speaking
    text: Enak banget!
    meaning:
      ar_eg: حلو أوي أوي!
      ar: لذيذ جدًا!
      en: Sooo good!
    words: [enak, banget]
dialogue:
  title: Kopi di Kemang
  lines:
    - speaker: Rina
      text: Mohamed, bagaimana kopinya?
      ar_eg: محمد، القهوة عاملة إيه؟
      ar: يا محمد، كيف القهوة؟
      en: Mohamed, how's the coffee?
    - speaker: Mohamed
      text: Enak sekali! Tapi mahal.
      ar_eg: حلوة أوي! بس غالية.
      ar: لذيذة جدًا! لكنها غالية.
      en: Really good! But expensive.
    - speaker: Rina
      text: Ya, kafe di Kemang mahal banget. Tapi tempatnya bagus.
      ar_eg: أيوه، الكافيهات في كيمانج غالية أوي. بس المكان حلو.
      ar: نعم، المقاهي في كيمانغ غالية جدًا، لكن المكان جميل.
      en: Yeah, cafés in Kemang are so expensive. But the place is nice.
    - speaker: Mohamed
      text: Betul. Musiknya juga bagus.
      ar_eg: صح. والمزيكا كمان حلوة.
      ar: صحيح. والموسيقى جميلة أيضًا.
      en: True. The music is good too.
    - speaker: Rina
      text: Kamu capek?
      ar_eg: إنت تعبان؟
      ar: هل أنت متعب؟
      en: Are you tired?
    - speaker: Mohamed
      text: Ya, hari ini saya sangat sibuk.
      ar_eg: أيوه، النهارده كنت مشغول جدًا.
      ar: نعم، كنت مشغولًا جدًا اليوم.
      en: Yes, I was very busy today.
