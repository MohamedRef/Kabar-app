schema: kabar.lesson/v1
id: bipa6.u01.l04
language: id
title: Pencerita
can_do:
  ar_eg: تعرف مين اللي بيحكي القصة، ومن أنهي زاوية، وإمتى بيرجع للماضي.
  ar: أن تعرف من يروي القصة ومن أيّ زاوية، ومتى يعود إلى الماضي.
  en: Tell who narrates a story, from which point of view, and when it flashes back.
slides:
  - title: Siapa yang bercerita?
    body:
      ar_eg: |
        في أي cerpen اسأل: مين الـ pencerita (الراوي)؟
        - orang pertama = الراوي بيقول «aku»: Aku membuka pintu pelan-pelan.
        - orang ketiga = الراوي بيقول «dia» أو اسم الشخصية: Pak Lubis membuka pintu.
        - kilas balik = فلاش باك، رجوع لأحداث فاتت
        - monolog batin = الكلام اللي جوه دماغ الشخصية، اللي محدش سامعه
        الراوي بضمير المتكلم مايعرفش اللي في قلوب الباقيين، وده بيخلي القارئ يخمّن.
        - في الشارع: cuma = hanya (بس)، terus = lalu (وبعدين)، banget = sekali (أوي).
      ar: |
        اسأل في كلّ cerpen: من الـ pencerita (الراوي)؟
        - orang pertama = الراوي يقول «aku»: Aku membuka pintu pelan-pelan.
        - orang ketiga = الراوي يقول «dia» أو اسم الشخصية: Pak Lubis membuka pintu.
        - kilas balik = الارتجاع، العودة إلى أحداث ماضية
        - monolog batin = المونولوج الداخلي، ما يدور في ذهن الشخصية دون أن يُسمع
        والراوي بضمير المتكلّم لا يعرف ما في قلوب الآخرين، فيدع القارئ يخمّن.
        - في كلام الشارع: cuma = hanya (فقط)، terus = lalu (ثمّ)، banget = sekali (جدًّا).
      en: |
        For any cerpen, ask: who is the pencerita (narrator)?
        - orang pertama = first person, the narrator says «aku»: Aku membuka pintu pelan-pelan.
        - orang ketiga = third person, «dia» or the character's name: Pak Lubis membuka pintu.
        - kilas balik = flashback
        - monolog batin = interior monologue, what goes on in a character's head unheard
        A first-person narrator can't see into others' hearts, which leaves the reader guessing.
        - On the street: cuma = hanya (only), terus = lalu (then), banget = sekali (very).
    examples:
      - text: Cerpen ini dimulai dengan kilas balik ke masa kecil Pak Lubis.
        ar_eg: القصة دي بتبدأ بفلاش باك لطفولة الأستاذ لوبيس.
        ar: تبدأ هذه القصة بارتجاع إلى طفولة الأستاذ لوبيس.
        en: This story opens with a flashback to Pak Lubis's childhood.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pencerita
        ar_eg: الراوي
        ar: الراوي
        en: narrator
      - text: orang pertama
        ar_eg: ضمير المتكلم
        ar: ضمير المتكلّم
        en: first person
      - text: orang ketiga
        ar_eg: ضمير الغايب
        ar: ضمير الغائب
        en: third person
      - text: kilas balik
        ar_eg: فلاش باك
        ar: ارتجاع
        en: flashback
      - text: monolog batin
        ar_eg: كلام جوه الدماغ
        ar: مونولوج داخلي
        en: interior monologue
    words: [pencerita, orang pertama, orang ketiga, kilas balik, monolog batin]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Aku membuka pintu pelan-pelan.» الراوي هنا إيه؟
      ar: «Aku membuka pintu pelan-pelan.» ما نوع الراوي هنا؟
      en: '"Aku membuka pintu pelan-pelan." What kind of narrator is this?'
    options: [orang ketiga, orang pertama, tanpa pencerita]
    answer: 1
    explain:
      ar_eg: «aku» يعني الراوي بيتكلم عن نفسه، يبقى orang pertama.
      ar: «aku» تعني أنّ الراوي يتحدّث عن نفسه، فهو orang pertama.
      en: «aku» means the narrator speaks about himself, so orang pertama.
    words: [orang pertama]
  - id: e03
    type: listen
    text: Cerpen ini dimulai dengan kilas balik ke masa kecil Pak Lubis.
    question:
      ar_eg: القصة بتبدأ بإيه؟
      ar: بمَ تبدأ القصة؟
      en: How does the story begin?
    options:
      - بنهاية القصة.
      - بحوار في القطر.
      - برجوع لطفولة الأستاذ لوبيس.
    answer: 2
    words: [kilas balik, masa]
  - id: e04
    type: fill_blank
    sentence: Kalau pencerita memakai kata "dia", cerpen itu memakai sudut pandang ___.
    meaning:
      ar_eg: لو الراوي بيستخدم «dia»، تبقى القصة من زاوية ضمير الغايب.
      ar: إذا استعمل الراوي «dia» فالقصة من منظور ضمير الغائب.
      en: If the narrator uses «dia», the story is told in the third person.
    options: [orang ketiga, orang pertama, monolog batin]
    answers: [orang ketiga]
    words: [orang ketiga, pencerita]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الراوي بيحكي أفكار الشخصية في مونولوج داخلي.
      ar: يروي الراوي أفكار الشخصية في مونولوج داخلي.
      en: The narrator tells the character's thoughts in an interior monologue.
    answer: Pencerita menceritakan pikiran tokoh dalam monolog batin.
    distractors: [kilas, ketiga]
    words: [pencerita, monolog batin]
  - id: e06
    type: translate
    direction: from_target
    source_text: Dalam monolog batinnya, Pak Lubis bertanya apakah anaknya akan pulang.
    answers_meaning:
      ar_eg:
        - في المونولوج اللي جواه، الأستاذ لوبيس بيسأل نفسه هل ابنه هيرجع.
        - جوه دماغه، الأستاذ لوبيس بيسأل إذا كان ابنه هيرجع.
      ar:
        - في مونولوجه الداخلي، يتساءل الأستاذ لوبيس هل سيعود ابنه.
        - يسأل الأستاذ لوبيس نفسه في سرّه إن كان ابنه سيعود.
      en:
        - In his interior monologue, Pak Lubis wonders whether his son will come home.
        - Inside his head, Pak Lubis asks whether his son will return.
    words: [monolog batin]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «kilas balik» معناها إيه؟
      ar: ما معنى «kilas balik»؟
      en: What does "kilas balik" mean?
    options:
      - رجوع لأحداث فاتت.
      - نهاية مفتوحة.
      - وصف المكان.
    answer: 0
    words: [kilas balik]
  - id: e08
    type: speaking
    text: Cerpen ini diceritakan dari sudut pandang orang pertama, tentang masa kecilnya.
    meaning:
      ar_eg: القصة دي متحكية بضمير المتكلم، عن طفولته.
      ar: تُروى هذه القصة بضمير المتكلّم عن طفولته.
      en: This story is told in the first person, about his childhood.
    words: [orang pertama, masa]
  - id: e09
    type: dictation
    text: Pencerita orang ketiga tidak selalu tahu perasaan tokoh.
    meaning:
      ar_eg: الراوي بضمير الغايب مش دايمًا عارف اللي في قلب الشخصية.
      ar: الراوي بضمير الغائب لا يعرف دائمًا ما في قلب الشخصية.
      en: A third-person narrator doesn't always know what a character feels.
    words: [pencerita, orang ketiga]
  - id: e10
    type: fill_blank
    sentence: Pengarang memakai ___ untuk menunjukkan masa lalu tokoh.
    meaning:
      ar_eg: الكاتب بيستخدم الفلاش باك عشان يورّي ماضي الشخصية.
      ar: يستعمل الكاتب الارتجاع ليُظهر ماضي الشخصية.
      en: The author uses a flashback to show the character's past.
    options: [kilas balik, orang pertama, monolog batin]
    answers: [kilas balik]
    words: [kilas balik, masa]
dialogue:
  title: Siapa "aku" itu?
  lines:
    - speaker: Bang Togar
      text: Mohamed, cerpen baru ini pakai "aku". Siapa pencerita sebenarnya?
      ar_eg: يا محمد، القصة الجديدة دي بتستخدم «aku». مين الراوي فعلًا؟
      ar: يا محمد، هذه القصة الجديدة تستعمل «aku». فمن الراوي حقًا؟
      en: Mohamed, this new story uses "aku". Who is the narrator really?
    - speaker: Mohamed
      text: Anak Pak Lubis. Jadi kita cuma tahu pikirannya, bukan pikiran ayahnya.
      ar_eg: ابن الأستاذ لوبيس. فإحنا عارفين أفكاره هو بس، مش أفكار أبوه.
      ar: ابن الأستاذ لوبيس، فنحن لا نعرف إلا أفكاره، لا أفكار أبيه.
      en: Pak Lubis's son. So we only know his thoughts, not his father's.
    - speaker: Bang Togar
      text: Betul. Terus di tengah cerita ada kilas balik ke Danau Toba.
      ar_eg: مظبوط. وفي نص القصة فيه فلاش باك لبحيرة توبا.
      ar: صحيح، وفي منتصف القصة ارتجاع إلى بحيرة توبا.
      en: Right. And halfway through there's a flashback to Lake Toba.
    - speaker: Mohamed
      text: Dan monolog batinnya penuh rindu. Pengarangnya pintar banget.
      ar_eg: والمونولوج اللي جواه مليان حنين. الكاتب شاطر جدًا.
      ar: ومونولوجه الداخلي مفعم بالحنين، والكاتب بارع حقًا.
      en: And his interior monologue is full of longing. The author is very clever.
