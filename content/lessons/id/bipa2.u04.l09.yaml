schema: kabar.lesson/v1
id: bipa2.u04.l09
language: id
title: Hujan di Kebun Raya
can_do:
  ar_eg: 'تخطط لفسحة: المسافة بالكيلومتر، الأكل اللي هتاخده (بطيخ وتفاح وعنب ودستة)، والسما الرمادي الغامق.'
  ar: 'أن تخطّط لنزهة: المسافة بالكيلومتر، والطعام الذي تأخذه (بطّيخ وتفّاح وعنب ودزينة)، والسماء الرمادية الداكنة.'
  en: 'Plan a day out: the distance in kilometres, the food you take (watermelon, apples, grapes, a dozen), and a dark grey sky.'
slides:
  - title: Ke Bogor
    body:
      ar_eg: |
        semangka = بطيخ، apel = تفاح، anggur = عنب (ومرات معناها نبيذ). kacang = فول سوداني أو أي بقول.
        lusin = دستة: selusin = ١٢. kilometer = كيلومتر.
        abu-abu = رمادي (abu = رماد). gelap = غامق أو ضلمة: Langitnya gelap, nanti hujan.
      ar: |
        semangka = بطّيخ، apel = تفّاح، anggur = عنب (وقد تعني النبيذ). kacang = فول سوداني أو أي بقول.
        lusin = دزينة: selusin = ١٢. kilometer = كيلومتر.
        abu-abu = رمادي (abu = رماد). gelap = داكن أو مظلم: Langitnya gelap, nanti hujan.
      en: |
        semangka = watermelon, apel = apple, anggur = grapes (sometimes wine). kacang = peanut or any bean.
        lusin = dozen: selusin = 12. kilometer = kilometre.
        abu-abu = grey (abu = ash). gelap = dark: Langitnya gelap, nanti hujan.
    examples:
      - text: Bogor enam puluh kilometer dari Jakarta.
        ar_eg: بوجور على بعد ستين كيلو من جاكرتا.
        ar: تبعد بوجور ستين كيلومترًا عن جاكرتا.
        en: Bogor is sixty kilometres from Jakarta.
      - text: Kami bawa semangka, apel, dan anggur.
        ar_eg: إحنا واخدين بطيخ وتفاح وعنب.
        ar: أخذنا معنا بطّيخًا وتفّاحًا وعنبًا.
        en: We've brought watermelon, apples and grapes.
      - text: Langitnya abu-abu dan gelap. Nanti hujan.
        ar_eg: السما رمادي وغامقة. هتمطر بعدين.
        ar: السماء رمادية داكنة، وستمطر لاحقًا.
        en: The sky is grey and dark. It'll rain later.
