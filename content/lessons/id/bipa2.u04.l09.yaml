schema: kabar.lesson/v1
id: bipa2.u04.l09
language: id
title: Seons, seliter, selusin
can_do:
  ar_eg: تشتري بالجرام والأوقية واللتر والدستة، وتقيس بالسنتي والكيلومتر والنسبة.
  ar: أن تشتري بالغرام والأوقية واللتر والدزينة، وتقيس بالسنتيمتر والكيلومتر والنسبة المئوية.
  en: Buy by the gram, ons, litre and dozen, and measure in centimetres, kilometres and percent.
slides:
  - title: Ukuran
    body:
      ar_eg: |
        الوزن: gram، وons، وkilo. خلي بالك: في إندونيسيا 1 ons = 100 gram!
        السوايل: liter (sebotol air satu liter).
        الطول: sentimeter، meter، kilometer.
        lusin = دستة: selusin = ١٢. وpersen = في المية: diskon 50 persen.
      ar: |
        الوزن: gram وons وkilo. وانتبه: في إندونيسيا 1 ons = 100 gram!
        السوائل: liter (sebotol air satu liter).
        الطول: sentimeter وmeter وkilometer.
        lusin = دزينة: selusin = ١٢. وpersen = بالمئة: diskon 50 persen.
      en: |
        Weight: gram, ons, kilo. Careful: in Indonesia 1 ons = 100 grams!
        Liquids: liter (sebotol air satu liter).
        Length: sentimeter, meter, kilometer.
        lusin = dozen: selusin = 12. persen = percent: diskon 50 persen.
    examples:
      - text: Satu ons sama dengan seratus gram.
        ar_eg: الأوقية = ١٠٠ جرام.
        ar: الأوقية تساوي مئة غرام.
        en: One ons equals a hundred grams.
      - text: Saya beli selusin pensil.
        ar_eg: اشتريت دستة أقلام رصاص.
        ar: اشتريت دزينة أقلام رصاص.
        en: I bought a dozen pencils.
      - text: Diskon lima puluh persen!
        ar_eg: خصم خمسين في المية!
        ar: خصم خمسين بالمئة!
        en: Fifty percent off!
