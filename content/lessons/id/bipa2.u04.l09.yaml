      - text: kacang
        ar_eg: فول سوداني
        ar: فول سوداني
        en: peanut, bean
    words: [semangka, anggur, apel, kacang]
  - id: e02
    type: match_pairs
    pairs:
      - text: lusin
        ar_eg: دستة
        ar: دزينة
        en: dozen
      - text: kilometer
        ar_eg: كيلومتر
        ar: كيلومتر
        en: kilometre
      - text: abu-abu
        ar_eg: رمادي
        ar: رمادي
        en: grey
      - text: gelap
        ar_eg: غامق، ضلمة
        ar: داكن، مظلم
        en: dark
    words: [lusin, kilometer, abu-abu, gelap]
  - id: e03
    type: listen
    text: Bogor enam puluh kilometer dari Jakarta.
    question:
      ar_eg: بوجور بعيدة قد إيه؟
      ar: كم تبعد بوجور؟
      en: How far is Bogor?
    options: [٦٠ كيلو, ١٦ كيلو, ٦ كيلو]
    answer: 0
    meaning:
      ar_eg: بوجور على بعد ستين كيلو من جاكرتا.
      ar: تبعد بوجور ستين كيلومترًا عن جاكرتا.
      en: Bogor is sixty kilometres from Jakarta.
    words: [kilometer]
  - id: e04
    type: fill_blank
    sentence: Buah ini besar dan berat, tapi merah dan manis di dalam. Ini ___.
    meaning:
      ar_eg: الفاكهة دي كبيرة وتقيلة، بس جوّاها أحمر ومسكّر. دي ___.
      ar: هذه الفاكهة كبيرة وثقيلة، لكنها حمراء حلوة من الداخل. إنها ___.
      en: This fruit is big and heavy, but red and sweet inside. It's a ___.
    options: [semangka, apel, anggur]
    answers: [semangka]
    words: [semangka, apel, anggur]
    explain:
      ar_eg: كبيرة وتقيلة وجوّاها أحمر = semangka (بطيخ). apel وanggur صغيرين.
      ar: كبيرة ثقيلة حمراء من الداخل = semangka (بطيخ). أما apel وanggur فصغيرتان.
      en: "Big, heavy and red inside: semangka (watermelon). apel and anggur are small."
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ١٢ حاجة من نفس النوع؟
      ar: اثنا عشر شيئًا من النوع نفسه؟
      en: Twelve of the same thing?
    options: [selusin, sekilo, seons]
    answer: 0
    explain:
      ar_eg: selusin = دستة = ١٢.
      ar: selusin = دزينة = ١٢.
      en: selusin = a dozen = 12.
    words: [lusin]
  - id: e06
    type: fill_blank
    sentence: Langitnya ___. Nanti hujan.
    meaning:
      ar_eg: السما ___. هتمطر بعدين.
      ar: السماء ___، وستمطر لاحقًا.
      en: The sky is ___. It'll rain later.
    options: [gelap, kilometer, semangka]
    answers: [gelap]
    words: [gelap, kilometer]
    explain:
      ar_eg: السما gelap (ضلمة) قبل المطر. kilometer مسافة، وsemangka بطيخ.
      ar: السماء gelap (مظلمة) قبل المطر. أما kilometer فمسافة وsemangka بطيخ.
      en: A gelap (dark) sky before rain. kilometer is a distance, semangka a watermelon.
  - id: e07
    type: build_sentence
    source:
      ar_eg: السما رمادي. هتمطر بعدين.
      ar: السماء رمادية، وستمطر لاحقًا.
      en: The sky is grey. It'll rain later.
    answer: Langitnya abu-abu. Nanti hujan.
    distractors: [gelap, anggur]
    words: [abu-abu, gelap]
    explain:
      ar_eg: «رمادي» = abu-abu (حرفيًا لون الرماد). gelap = ضلمة، ومش اسم لون.
      ar: «رمادية» = abu-abu، أي بلون الرماد. أما gelap فـ«مظلم» لا اسم لون.
      en: Grey is abu-abu (ash-coloured). gelap means dark, not grey.
  - id: e08
    type: translate
    direction: from_target
    source_text: Saya beli selusin apel dan sebungkus kacang.
    answers_meaning:
      ar_eg: [اشتريت دستة تفاح وكيس فول سوداني, أنا اشتريت دستة تفاح وكيس سوداني]
      ar: [اشتريت دزينة تفّاح وكيس فول سوداني]
      en: [I bought a dozen apples and a packet of peanuts, I bought twelve apples and a bag of peanuts]
    words: [lusin, apel, kacang]
  - id: e09
    type: speaking
    text: Langitnya abu-abu dan gelap. Kami makan semangka dan kacang.
    meaning:
      ar_eg: السما رمادي وغامقة. إحنا بناكل بطيخ وفول سوداني.
      ar: السماء رمادية داكنة. نأكل بطّيخًا وفولًا سودانيًا.
      en: The sky is dark grey. We're eating watermelon and peanuts.
    words: [abu-abu, gelap, semangka, kacang]
  - id: e10
    type: multiple_choice
    question: anggur
    question_meaning:
      ar_eg: anggur بالإندونيسي معناها إيه؟
      ar: ما معنى anggur بالإندونيسية؟
      en: What does anggur mean?
    options: [عنب, تفاح, بطيخ]
    answer: 0
    explain:
      ar_eg: anggur = عنب (ومرات نبيذ).
      ar: anggur = عنب (وقد تعني النبيذ).
      en: anggur = grapes (sometimes wine).
    words: [anggur]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kita ke Kebun Raya Bogor, yuk!
      ar_eg: يا محمد، يلا نروح حديقة بوجور النباتية!
      ar: هيّا يا محمد إلى حديقة بوجور النباتية!
      en: Mohamed, let's go to the Bogor Botanical Gardens!
    - speaker: Mohamed
      text: Jauh? Berapa kilometer?
      ar_eg: بعيدة؟ كام كيلو؟
      ar: هل هي بعيدة؟ كم كيلومترًا؟
      en: Is it far? How many kilometres?
    - speaker: Rina
      text: Enam puluh kilometer. Saya bawa semangka, apel, dan anggur.
      ar_eg: ستين كيلو. أنا واخدة بطيخ وتفاح وعنب.
      ar: ستون كيلومترًا. أحضرت بطّيخًا وتفّاحًا وعنبًا.
      en: Sixty kilometres. I've brought watermelon, apples and grapes.
    - speaker: Mohamed
      text: Saya beli selusin roti dan kacang.
      ar_eg: وأنا اشتريت دستة عيش وفول سوداني.
      ar: وأنا اشتريت دزينة خبز وفولًا سودانيًا.
      en: I bought a dozen bread rolls and some peanuts.
    - speaker: Rina
      text: Mohamed, langitnya abu-abu!
      ar_eg: يا محمد، السما رمادي!
      ar: يا محمد، السماء رمادية!
      en: Mohamed, the sky's grey!
    - speaker: Mohamed
      text: Ya, gelap sekali. Nanti hujan!
      ar_eg: أيوه، غامقة أوي. هتمطر!
      ar: نعم، داكنة جدًا. ستمطر!
      en: Yes, it's really dark. It's going to rain!
