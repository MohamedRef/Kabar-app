schema: kabar.lesson/v1
id: bipa5.u07.l12
language: id
title: Resep keluarga
can_do:
  ar_eg: تحكي قصة أكلة متوارثة في عيلتك وإيه اللي بتقوله عن هويتكم.
  ar: أن تروي قصة طبق متوارث في عائلتك وما يقوله عن هويّتكم.
  en: Tell the story of a family dish and what it says about who you are.
slides:
  - title: Dari dapur nenek
    body:
      ar_eg: |
        لما تحكي عن أكلة عيلتك، رتّب الكلام:
        ١. الأكلة إيه وبتتعمل إمتى (dihidangkan saat …).
        ٢. جاية منين: Resep ini turun-temurun dari nenek saya.
        ٣. بتقول إيه عنكم: Makanan ini mencerminkan identitas keluarga kami.
        كلمتين جداد: resep = وصفة، وturun-temurun = متوارث من جيل لجيل.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: banget = sekali، dikit = sedikit، nggak = tidak، nulis = menulis، kayak = seperti، cuma = hanya، gitu = begitu، nyatet = mencatat.
      ar: |
        حين تحكي عن طبق عائلتك، رتّب كلامك:
        ١. ما الطبق ومتى يُعدّ (dihidangkan saat …).
        ٢. من أين جاء: Resep ini turun-temurun dari nenek saya.
        ٣. ماذا يقول عنكم: Makanan ini mencerminkan identitas keluarga kami.
        وكلمتان جديدتان: resep = وصفة، وturun-temurun = متوارث جيلًا بعد جيل.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: banget = sekali، dikit = sedikit، nggak = tidak، nulis = menulis، kayak = seperti، cuma = hanya، gitu = begitu، nyatet = mencatat.
      en: |
        When you talk about your family's dish, order it like this:
        1. What it is and when it's served (dihidangkan saat …).
        2. Where it comes from: Resep ini turun-temurun dari nenek saya.
        3. What it says about you: Makanan ini mencerminkan identitas keluarga kami.
        Two new words: resep = recipe; turun-temurun = handed down through generations.
        The dialogue uses street forms; the formal ones are beside them: banget = sekali, dikit = sedikit, nggak = tidak, nulis = menulis, kayak = seperti, cuma = hanya, gitu = begitu, nyatet = mencatat.
exercises:
  - id: e01
    type: listen
    text: Resep kue bingka ini turun-temurun dari nenek buyut saya. Ibu saya belajar dari nenek, dan sekarang saya belajar dari ibu.
    question:
      ar_eg: الوصفة وصلت للمتكلمة إزاي؟
      ar: كيف وصلت الوصفة إلى المتكلّمة؟
      en: How did the recipe reach the speaker?
    options:
      - Dari buku resep yang dia beli.
      - Dari satu generasi ke generasi berikutnya dalam keluarganya.
      - Dari video di internet.
    answer: 1
    meaning:
      ar_eg: وصفة كيكة بينجكا دي متوارثة من جدة جدتي. أمي اتعلمتها من تيتا، ودلوقتي أنا بتعلمها من أمي.
      ar: وصفة كعكة البينغكا هذه متوارثة عن جدّة جدّتي؛ تعلّمتها أمّي من جدّتي، وأتعلّمها الآن من أمّي.
      en: This bingka cake recipe comes down from my great-grandmother. My mother learned it from grandma, and now I learn it from my mother.
    explain:
      ar_eg: turun-temurun = متوارث، والسلسلة nenek → ibu → saya بتوري إنها نزلت من جيل لجيل.
      ar: turun-temurun = متوارث، والسلسلة nenek ← ibu ← saya تبيّن انتقالها جيلًا بعد جيل.
      en: turun-temurun = handed down; the chain nenek → ibu → saya shows it passed generation to generation.
    words: [resep, turun-temurun]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «turun-temurun» معناها إيه؟
      ar: ما معنى «turun-temurun»؟
      en: What does "turun-temurun" mean?
    options:
      - Diwariskan dari orang tua kepada anak dan cucu.
      - Sangat baru.
      - Dilarang.
    answer: 0
    explain:
      ar_eg: 'من turun (ينزل): الحاجة بتنزل من الجدود للأحفاد. مش جديد ولا ممنوع.'
      ar: من turun (ينزل)، أي ما ينزل من الأجداد إلى الأحفاد، لا جديد ولا ممنوع.
      en: From turun (to descend), passed down from grandparents to grandchildren; not new, not forbidden.
    words: [turun-temurun]
  - id: e03
    type: fill_blank
    sentence: Ibu menulis ___ soto Banjar di buku kecil.
    meaning:
      ar_eg: ماما كتبت وصفة شوربة بنجر في نوتة صغيرة.
      ar: كتبت أمّي وصفة سوتو بنجر في دفتر صغير.
      en: Mum wrote the soto Banjar recipe in a small notebook.
    options: [resep, santan, pantangan]
    answers: [resep]
    words: [resep]
    explain:
      ar_eg: اللي بيتكتب في النوتة resep (وصفة). santan = لبن جوز الهند وpantangan = ممنوعات، مش بتتكتب كوصفة.
      ar: ما يُكتب في الدفتر resep (وصفة). أما santan فحليب جوز الهند، وpantangan المحظورات.
      en: What she wrote was the resep (recipe). santan and pantangan aren't recipes.
  - id: e04
    type: build_sentence
    source:
      ar_eg: الوصفة دي بتتورث جيل ورا جيل في عيلتنا.
      ar: تُتوارث هذه الوصفة جيلًا بعد جيل في عائلتنا.
      en: This recipe has been handed down through generations in our family.
    answer: Resep ini diwariskan turun-temurun dalam keluarga kami.
    distractors: [haram, lada]
    words: [resep, turun-temurun]
    explain:
      ar_eg: «بتتورث جيل ورا جيل» = diwariskan turun-temurun. haram = حرام وlada = فلفل، مش في الجملة.
      ar: «تُتوارث جيلًا بعد جيل» = diwariskan turun-temurun. أما haram فـ«حرام»، وlada الفلفل.
      en: "\"Handed down through generations\" is diwariskan turun-temurun. haram and lada aren't in it."
  - id: e05
    type: translate
    direction: from_target
    source_text: Bumbu rahasia nenek tidak pernah ditulis di resep, jadi kami harus melihat cara dia memasak.
    answers_meaning:
      ar_eg:
        - تتبيلة جدتي السرية عمرها ما اتكتبت في الوصفة، فلازم نتفرج عليها وهي بتطبخ.
        - السر بتاع تتبيلة تيتة مش مكتوب في الوصفة خالص، عشان كده لازم نشوفها بتطبخ إزاي.
      ar:
        - لم تُكتب تتبيلة الجدّة السرّية في الوصفة قطّ، لذا علينا أن نشاهد طريقة طبخها.
        - خلطة جدّتي السرّية لم تُدوَّن في الوصفة أبدًا، فلا بدّ أن نراقبها وهي تطبخ.
      en:
        - Grandma's secret seasoning was never written in the recipe, so we have to watch how she cooks.
        - The secret spice mix never made it into the recipe, so we must watch her cooking.
    explain:
      ar_eg: jadi = فـ / عشان كده، بتجيب النتيجة.
      ar: jadi = لذلك، وتأتي بالنتيجة.
      en: jadi = so, bringing the result.
    words: [bumbu, resep]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: «Makanan ini mencerminkan identitas keluarga kami.» معناها إيه؟
      ar: ما معنى «Makanan ini mencerminkan identitas keluarga kami.»؟
      en: What does "Makanan ini mencerminkan identitas keluarga kami." mean?
    options:
      - Makanan ini mahal untuk keluarga kami.
      - Keluarga kami tidak suka makanan ini.
      - Makanan ini menunjukkan siapa keluarga kami.
    answer: 2
    words: [mencerminkan, identitas]
    explain:
      ar_eg: mencerminkan identitas = بتعكس الهوية، يعني بتوري إحنا مين. مش عن السعر ولا إن العيلة مابتحبهاش.
      ar: mencerminkan identitas = تعكس الهويّة أي تُظهر من نحن، لا عن الثمن ولا عن كره العائلة لها.
      en: mencerminkan identitas means it shows who we are, not price or dislike.
  - id: e07
    type: speaking
    text: Resep ini turun-temurun, jadi rasanya tidak pernah berubah.
    meaning:
      ar_eg: الوصفة دي متوارثة، فطعمها عمره ما اتغير.
      ar: هذه الوصفة متوارثة، فلم يتغيّر طعمها قطّ.
      en: This recipe is handed down, so its taste has never changed.
    words: [resep, turun-temurun]
  - id: e08
    type: dictation
    text: Kue bingka biasanya dihidangkan saat buka puasa.
    meaning:
      ar_eg: كيكة بينجكا عادةً بتتقدم على الفطار في رمضان.
      ar: تُقدَّم كعكة بينغكا عادةً عند الإفطار.
      en: Bingka cake is usually served to break the fast.
    words: [menghidangkan]
  - id: e09
    type: match_pairs
    pairs:
      - text: cita rasa
        ar_eg: الطعم المميز
        ar: نكهة مميّزة
        en: flavour
      - text: santan
        ar_eg: لبن جوز الهند
        ar: حليب جوز الهند
        en: coconut milk
      - text: selamatan
        ar_eg: عزومة بدعاء
        ar: وليمة بدعاء
        en: communal prayer meal
      - text: rempah
        ar_eg: بهارات
        ar: توابل
        en: spices
      - text: tradisi
        ar_eg: تقليد / عادة
        ar: تقليد
        en: tradition
    words: [cita rasa, santan, selamatan, rempah, tradisi]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الملوخية أكلة مصرية متوارثة من جيل لجيل.
      ar: الملوخية طبق مصري متوارث جيلًا بعد جيل.
      en: Molokhia is an Egyptian dish handed down through generations.
    answers:
      - Mulukhiyah adalah masakan Mesir yang turun-temurun.
      - Molokhia adalah masakan Mesir yang turun-temurun.
      - Mulukhiyah adalah makanan Mesir yang turun-temurun.
      - Mulukhiyah merupakan masakan Mesir yang diwariskan turun-temurun.
    words: [turun-temurun]
dialogue:
  title: Tukar resep
  lines:
    - speaker: Rina
      text: Mohamed, ini kue bingka buatan nenekku. Resepnya turun-temurun.
      ar_eg: يا محمد، دي كيكة بينجكا من عمايل تيتة. الوصفة متوارثة.
      ar: يا محمد، هذه كعكة بينغكا من صنع جدّتي، ووصفتها متوارثة.
      en: Mohamed, this is my grandmother's bingka cake. The recipe has been handed down.
    - speaker: Mohamed
      text: Enak banget! Apa bumbunya?
      ar_eg: حلوة أوي! إيه اللي فيها؟
      ar: لذيذة جدًا! ما مكوّناتها؟
      en: Delicious! What's in it?
    - speaker: Rina
      text: Santan sama pandan dikit. Tapi nenek nggak pernah nulis takarannya.
      ar_eg: لبن جوز الهند وشوية باندان. بس تيتة عمرها ما كتبت المقادير.
      ar: حليب جوز الهند وقليل من الباندان، لكنّ جدّتي لم تكتب المقادير قطّ.
      en: Coconut milk and a little pandan. But grandma never wrote down the amounts.
    - speaker: Mohamed
      text: Sama kayak ibuku. Resep mulukhiyahnya cuma ada di kepalanya!
      ar_eg: زي ماما بالظبط. وصفة الملوخية بتاعتها في دماغها بس!
      ar: كأمّي تمامًا، فوصفة ملوخيّتها في رأسها فقط!
      en: Same as my mother. Her molokhia recipe lives only in her head!
    - speaker: Rina
      text: Kalau gitu, kita harus nyatet sebelum ilang.
      ar_eg: يبقى لازم نكتبها قبل ما تضيع.
      ar: إذن علينا أن ندوّنها قبل أن تضيع.
      en: Then we should write it down before it's lost.
    - speaker: Mohamed
      text: Setuju. Makanan keluarga mencerminkan siapa kita.
      ar_eg: موافق. أكل العيلة بيعكس إحنا مين.
      ar: موافق، فطعام العائلة يعكس هويّتنا.
      en: Agreed. Family food reflects who we are.
