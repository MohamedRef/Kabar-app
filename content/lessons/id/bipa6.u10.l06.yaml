schema: kabar.lesson/v1
id: bipa6.u10.l06
language: id
title: Sumber terpercaya
can_do:
  ar_eg: تفرّق بين مصدر يتوثق فيه ومصدر ضعيف قبل ما تستخدمه في مقالك.
  ar: أن تميّز المصدر الموثوق من الضعيف قبل استعماله في مقالك.
  en: Tell a trustworthy source from a weak one before using it in your essay.
slides:
  - title: Siapa yang menulis ini?
    body:
      ar_eg: |
        قبل ما تحط أي مصدر في الـ daftar pustaka، اسأل:
        - مين الكاتب؟ لو anonim (من غير اسم)، خلي بالك.
        - هو jurnal ilmiah (مجلة علمية محكّمة)؟ ولا situs (موقع) أي حد؟
        - memeriksa = يتأكد / يفحص: افحص التاريخ والأرقام في مصدر تاني.
        - terpercaya = يتوثق فيه، موثوق
        مثال: تقرير من هيئة البراكين terpercaya، أما بوست anonim على السوشيال ميديا لأ.
        - في الشارع: aku / -ku = saya (أنا)، nemu = menemukan (يلاقي)، nggak = tidak (لأ / مش).
      ar: |
        قبل أن تضع أيّ مصدر في الـ daftar pustaka اسأل:
        - من الكاتب؟ إن كان anonim (مجهول الاسم) فاحذر.
        - أهو jurnal ilmiah (مجلّة علمية محكّمة) أم situs (موقع) لأيّ أحد؟
        - memeriksa = يتحقّق ويفحص: افحص التاريخ والأرقام في مصدر آخر.
        - terpercaya = موثوق
        مثال: تقرير هيئة البراكين terpercaya، أمّا منشور anonim على وسائل التواصل فلا.
        - في كلام الشارع: aku / -ku = saya (أنا)، nemu = menemukan (يجد)، nggak = tidak (لا / ليس).
      en: |
        Before you put any source in the daftar pustaka, ask:
        - Who wrote it? If it's anonim (anonymous), be careful.
        - Is it a jurnal ilmiah (peer-reviewed journal), or anyone's situs (website)?
        - memeriksa = to check: check dates and numbers against another source.
        - terpercaya = trustworthy
        For example, a report from the volcanology agency is terpercaya; an anonim social media post isn't.
        - On the street: aku / -ku = saya (I), nemu = menemukan (to find), nggak = tidak (no, not).
    examples:
      - text: Artikel di jurnal ilmiah itu lebih terpercaya daripada situs tanpa nama penulis.
        ar_eg: المقال اللي في المجلة العلمية ده يتوثق فيه أكتر من موقع مافيهوش اسم كاتب.
        ar: مقال المجلّة العلمية أوثق من موقع لا يذكر اسم كاتبه.
        en: The journal article is more trustworthy than a site with no author's name.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: terpercaya
        ar_eg: يتوثق فيه
        ar: موثوق
        en: trustworthy
      - text: situs
        ar_eg: موقع
        ar: موقع إلكتروني
        en: website
      - text: anonim
        ar_eg: من غير اسم
        ar: مجهول
        en: anonymous
      - text: jurnal ilmiah
        ar_eg: مجلة علمية
        ar: مجلّة علمية
        en: scientific journal
      - text: memeriksa
        ar_eg: يتأكد / يفحص
        ar: يتحقّق
        en: to check
    words: [terpercaya, situs, anonim, jurnal ilmiah, memeriksa]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي مصدر موثوق أكتر لمقال عن سينابونج؟
      ar: أيّ مصدر أوثق لمقال عن سينابونغ؟
      en: Which source is more trustworthy for an essay on Sinabung?
    options:
      - Komentar anonim di media sosial.
      - Laporan badan vulkanologi.
      - Blog tanpa tanggal.
    answer: 1
    words: [anonim, terpercaya]
    explain:
      ar_eg: تقرير الهيئة البركانية رسمي وموثوق. التعليقات المجهولة والبلوج من غير تاريخ لأ.
      ar: تقرير هيئة البراكين رسمي موثوق؛ أمّا التعليقات المجهولة والمدوّنة بلا تاريخ فلا.
      en: The volcanology agency's report is official and reliable. Anonymous comments and undated blogs aren't.
  - id: e03
    type: listen
    text: Sebelum mengutip, saya selalu memeriksa angka itu di sumber lain.
    question:
      ar_eg: بيعمل إيه قبل ما ينقل؟
      ar: ماذا يفعل قبل الاقتباس؟
      en: What does he do before quoting?
    options:
      - بيسأل صاحبه بس.
      - بيكتب الرقم من دماغه.
      - بيتأكد من الرقم في مصدر تاني.
    answer: 2
    words: [memeriksa, mengutip]
  - id: e04
    type: fill_blank
    sentence: Penulis artikel ini ___, jadi saya tidak memakainya.
    meaning:
      ar_eg: كاتب المقال ده مجهول، فمش هستخدمه.
      ar: كاتب هذا المقال مجهول، فلن أستعمله.
      en: This article's author is anonymous, so I won't use it.
    options: [anonim, terpercaya, situs]
    answers: [anonim]
    words: [anonim]
    explain:
      ar_eg: الكاتب مجهول anonim، فمش هستخدمه. terpercaya = موثوق (عكس)، وsitus = موقع.
      ar: الكاتب مجهول anonim فلن أستعمله؛ أمّا terpercaya فموثوق (العكس)، وsitus موقع.
      en: The author is anonim, so I won't use it. terpercaya (trustworthy) is the opposite, and situs a website.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الـ jurnal ilmiah موثوق عادةً؟
      ar: لماذا تكون الـ jurnal ilmiah موثوقة عادةً؟
      en: Why is a jurnal ilmiah usually trustworthy?
    options:
      - عشان علما تانيين بيراجعوا المقالات قبل النشر.
      - عشان غالية.
      - عشان بتطلع كل يوم.
    answer: 0
    words: [jurnal ilmiah]
    explain:
      ar_eg: المجلة العلمية موثوقة لأن علما تانيين بيراجعوا المقالات قبل النشر. مش عشان غالية ولا يومية.
      ar: المجلّة العلمية موثوقة لأنّ علماء آخرين يحكّمون المقالات قبل النشر، لا لغلائها ولا لصدورها اليومي.
      en: A scientific journal is reliable because other scholars review articles first, not because it's pricey or daily.
  - id: e06
    type: build_sentence
    source:
      ar_eg: الموقع ده مش موثوق.
      ar: هذا الموقع غير موثوق.
      en: This website isn't trustworthy.
    answer: Situs ini tidak terpercaya.
    distractors: [anonim, jurnal]
    words: [situs, terpercaya]
    explain:
      ar_eg: «الموقع ده مش موثوق» = Situs ini tidak terpercaya. anonim وjurnal زيادة.
      ar: «هذا الموقع غير موثوق» Situs ini tidak terpercaya؛ أمّا anonim وjurnal فزائدتان.
      en: "\"This website isn't trustworthy\" is Situs ini tidak terpercaya. anonim and jurnal aren't needed."
  - id: e07
    type: translate
    direction: from_target
    source_text: Rani memeriksa semua rujukan di daftar pustaka saya.
    answers_meaning:
      ar_eg:
        - راني راجعت كل المراجع في قايمة المراجع بتاعتي.
        - راني اتأكدت من كل مرجع في البيبليوجرافيا بتاعتي.
      ar:
        - تحقّقت راني من جميع المراجع في قائمة مراجعي.
        - فحصت راني كلّ مرجع في ثبت مراجعي.
      en:
        - Rani checked every reference in my bibliography.
        - Rani went through all the references in my reference list.
    words: [memeriksa, rujukan, daftar pustaka]
  - id: e08
    type: speaking
    text: Saya hanya memakai sumber yang terpercaya.
    meaning:
      ar_eg: أنا بستخدم المصادر الموثوقة بس.
      ar: لا أستعمل إلا المصادر الموثوقة.
      en: I only use trustworthy sources.
    words: [terpercaya]
  - id: e09
    type: dictation
    text: Artikel itu terbit di jurnal ilmiah pada tahun 2016.
    meaning:
      ar_eg: المقال ده اتنشر في مجلة علمية سنة ٢٠١٦.
      ar: صدر ذلك المقال في مجلّة علمية سنة ٢٠١٦.
      en: That article appeared in a scientific journal in 2016.
    words: [jurnal ilmiah, terbit]
  - id: e10
    type: fill_blank
    sentence: Alamat ___ itu aneh, dan tidak ada nama penulisnya.
    meaning:
      ar_eg: عنوان الموقع ده غريب، ومافيش اسم كاتب.
      ar: عنوان ذلك الموقع غريب، ولا اسم لكاتبه.
      en: That website's address is odd, and there's no author's name.
    options: [situs, jurnal ilmiah, rujukan]
    answers: [situs]
    words: [situs]
    explain:
      ar_eg: العنوان الغريب ده بتاع موقع situs. jurnal ilmiah = مجلة علمية، وrujukan = مرجع.
      ar: العنوان الغريب لموقع situs؛ أمّا jurnal ilmiah فمجلّة علمية، وrujukan مرجع.
      en: An odd address belongs to a situs, website. jurnal ilmiah is a journal, and rujukan a reference.
dialogue:
  title: Sumber dari grup WhatsApp
  lines:
    - speaker: Mohamed
      text: Rani, aku menemukan angka korban Sinabung di grup WhatsApp.
      ar_eg: يا راني، لقيت عدد ضحايا سينابونج في جروب واتساب.
      ar: يا راني، وجدت عدد ضحايا سينابونغ في مجموعة واتساب.
      en: Rani, I found the Sinabung casualty figure in a WhatsApp group.
    - speaker: Rani
      text: Siapa penulisnya? Kalau anonim, itu nggak terpercaya.
      ar_eg: مين اللي كتبه؟ لو من غير اسم، يبقى مش موثوق.
      ar: من كاتبه؟ إن كان مجهولًا فليس موثوقًا.
      en: Who wrote it? If it's anonymous, it isn't trustworthy.
    - speaker: Mohamed
      text: Nggak ada nama. Jadi aku harus memeriksa di sumber lain?
      ar_eg: مافيش اسم. يبقى لازم أتأكد في مصدر تاني؟
      ar: لا اسم. أعليّ إذن أن أتحقّق في مصدر آخر؟
      en: There's no name. So I have to check another source?
    - speaker: Rani
      text: Ya. Cari di situs badan resmi atau di jurnal ilmiah.
      ar_eg: أيوه. دوّر في موقع جهة رسمية أو في مجلة علمية.
      ar: نعم، ابحث في موقع جهة رسمية أو في مجلّة علمية.
      en: Yes. Look on an official agency's website or in a scientific journal.
