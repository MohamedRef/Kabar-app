schema: kabar.lesson/v1
id: bipa4.u05.l03
language: id
title: Metafora
can_do:
  ar_eg: تفهم الاستعارة وتستعملها (المدرس بطل من غير وسام).
  ar: أن تفهم الاستعارة وتستعملها.
  en: Recognise and use metaphor.
slides:
  - title: Metafora = tanpa seperti
    body:
      ar_eg: |
        التشبيه بيقول «زي» (seperti). الاستعارة بتشيل «زي» وبتقول «هو هو» (adalah):
        Guru seperti pahlawan (تشبيه) → Guru adalah pahlawan tanpa tanda jasa (استعارة).
        «المدرس بطل من غير وسام» — جملة مشهورة جدًا في إندونيسيا، بتتقال كل يوم مدرس.
        ما تجمعش الاتنين: Guru adalah seperti pahlawan غلط.
      ar: |
        يذكر التشبيه الأداة (seperti)، وتحذفها الاستعارة فتقول «هو» (adalah):
        Guru seperti pahlawan (تشبيه) → Guru adalah pahlawan tanpa tanda jasa (استعارة).
        «المعلم بطل بلا وسام» عبارة شهيرة في إندونيسيا تتردد في يوم المعلم.
        ولا يُجمع بينهما: Guru adalah seperti pahlawan خطأ.
      en: |
        A simile says "like" (seperti). A metaphor drops it and says "is" (adalah):
        Guru seperti pahlawan (simile) → Guru adalah pahlawan tanpa tanda jasa (metaphor).
        "Teachers are heroes without medals" — a famous Indonesian saying, heard every Teachers' Day.
        Don't combine them: Guru adalah seperti pahlawan is wrong.
    grammar: id.figurative.metaphor
    examples:
      - text: Guru adalah pahlawan tanpa tanda jasa.
        ar_eg: المدرس بطل من غير وسام.
        ar: المعلم بطل بلا وسام.
        en: Teachers are heroes without medals.
  - title: Buah hati, jantung kota
    body:
      ar_eg: |
        استعارات بقت كلام يومي (اسم + اسم):
        buah hati = حرفيًا «تمرة الكبد» = الحبيب / الضنا — زي «فلذة كبدي» عندنا بالظبط!
        jantung kota = قلب المدينة (وسطها)
        tangan kanan = الدراع اليمين (المساعد الأساسي)
      ar: |
        استعارات صارت كلامًا يوميًا (اسم + اسم):
        buah hati = حرفيًا «ثمرة الكبد» = فلذة الكبد، كما نقول تمامًا.
        jantung kota = قلب المدينة
        tangan kanan = الساعد الأيمن
      en: |
        Metaphors that became everyday phrases (noun + noun):
        buah hati = literally "fruit of the liver" = one's darling, one's child — exactly Arabic «فلذة كبدي»!
        jantung kota = the heart of the city
        tangan kanan = right-hand man
    grammar: id.figurative.metaphor
    examples:
      - text: Anak adalah buah hati orang tua.
        ar_eg: العيال فلذة كبد أهلهم.
        ar: الأبناء فلذات أكباد آبائهم.
        en: Children are their parents' darlings.
      - text: Lapangan upacara terletak di jantung Kota Palopo.
        ar_eg: ساحة الاحتفال في قلب مدينة بالوبو.
        ar: تقع ساحة الاحتفال في قلب مدينة بالوبو.
        en: The ceremony ground is in the heart of Palopo.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: buah hati
        ar_eg: فلذة الكبد / الحبيب
        ar: فلذة الكبد
        en: darling, one's child
      - text: jantung kota
        ar_eg: قلب المدينة
        ar: قلب المدينة
        en: heart of the city
      - text: tangan kanan
        ar_eg: الدراع اليمين
        ar: الساعد الأيمن
        en: right-hand man
      - text: tanda jasa
        ar_eg: وسام / نيشان
        ar: وسام
        en: medal of honour
    words: [buah hati, jantung kota, tangan kanan, tanda jasa]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها استعارة (مش تشبيه)؟
      ar: أيّ جملة فيها استعارة لا تشبيه؟
      en: Which sentence is a metaphor (not a simile)?
    options: ["Guru seperti pahlawan.", "Guru adalah pahlawan tanpa tanda jasa.", "Guru adalah seperti pahlawan."]
    answer: 1
    explain:
      ar_eg: الاستعارة من غير seperti. والجملة التالتة غلط لأنها بتجمع adalah وseperti.
      ar: الاستعارة بلا seperti، والجملة الثالثة خطأ لجمعها adalah وseperti.
      en: A metaphor has no seperti; the third sentence wrongly combines adalah and seperti.
    words: [tanda jasa, tanpa]
  - id: e03
    type: listen
    text: Lapangan upacara terletak di jantung Kota Palopo.
    options: ["Lapangan upacara terletak di pinggir Kota Palopo.", "Lapangan upacara terletak di dekat Kota Palopo.", "Lapangan upacara terletak di jantung Kota Palopo."]
    answer: 2
    meaning:
      ar_eg: ساحة الاحتفال في قلب مدينة بالوبو.
      ar: تقع ساحة الاحتفال في قلب مدينة بالوبو.
      en: The ceremony ground is in the heart of Palopo.
    words: [jantung kota]
  - id: e04
    type: multiple_choice
    question: Anak adalah buah hati orang tua.
    question_meaning:
      ar_eg: buah hati هنا معناها إيه؟
      ar: ما معنى buah hati هنا؟
      en: What does buah hati mean here?
    options: ["anak yang sangat disayangi", "buah yang manis", "orang yang pintar"]
    answer: 0
    words: [buah hati]
  - id: e05
    type: multiple_choice
    question: Pak Irwan selalu membantu kepala sekolah. Dia adalah ___ kepala sekolah.
    question_meaning:
      ar_eg: الأستاذ إروان دايمًا بيساعد الناظر. هو … الناظر.
      ar: يساعد الأستاذ إروان المدير دائمًا. إنه … المدير.
      en: Pak Irwan always helps the head teacher. He is the head teacher's …
    options: ["buah hati", "jantung kota", "tangan kanan"]
    answer: 2
    words: [tangan kanan]
  - id: e06
    type: fill_blank
    sentence: Pasar Sentral terletak di ___ kota.
    meaning:
      ar_eg: السوق المركزي في قلب المدينة.
      ar: يقع السوق المركزي في قلب المدينة.
      en: The Central Market is in the heart of the city.
    options: [jantung, hati, kaki]
    answers: [jantung]
    explain:
      ar_eg: «قلب المدينة» = jantung kota. hati بتيجي في buah hati بس.
      ar: «قلب المدينة» = jantung kota، أما hati ففي buah hati.
      en: The heart of the city is jantung kota; hati is for buah hati.
    words: [jantung kota]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الأستاذ إروان دراع الناظر اليمين.
      ar: الأستاذ إروان هو الساعد الأيمن للمدير.
      en: Pak Irwan is the head teacher's right-hand man.
    answer: Pak Irwan adalah tangan kanan kepala sekolah.
    distractors: [seperti, kiri]
    words: [tangan kanan]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: العيال فلذة كبد أهلهم.
      ar: الأبناء فلذات أكباد آبائهم.
      en: Children are their parents' darlings.
    answers:
      - Anak adalah buah hati orang tua.
      - Anak adalah buah hati orang tua
      - Anak-anak adalah buah hati orang tua.
      - Anak-anak adalah buah hati orang tuanya.
      - Anak adalah buah hati orang tuanya.
      - Anak-anak adalah buah hati orang tua mereka.
    words: [buah hati]
  - id: e09
    type: speaking
    text: Guru adalah pahlawan tanpa tanda jasa. Kita harus menghormati mereka.
    meaning:
      ar_eg: المدرس بطل من غير وسام. لازم نحترمهم.
      ar: المعلم بطل بلا وسام، فيجب أن نكرّم المعلمين.
      en: Teachers are heroes without medals. We must honour them.
    words: [tanda jasa, menghormati, tanpa]
  - id: e10
    type: multiple_choice
    question: Dia minum kopi tanpa gula.
    question_meaning:
      ar_eg: بيشرب القهوة إزاي؟
      ar: كيف يشرب القهوة؟
      en: How does he drink his coffee?
    options: ['Tidak pakai gula.', 'Pakai banyak gula.', 'Pakai susu.']
    answer: 0
    explain:
      ar_eg: tanpa = من غير.
      ar: tanpa = بدون.
      en: tanpa = without.
    words: [tanpa]
dialogue:
  title: Menjelang Hari Guru
  lines:
    - speaker: Andi Tenri
      text: Besok Hari Guru Nasional. Di sekolah kami di jantung kota, kami akan memberi bunga kepada Bu Ratna.
      ar_eg: بكرة يوم المعلم الوطني. في مدرستنا اللي في قلب المدينة، هنجيب ورد للأستاذة راتنا.
      ar: غدًا يوم المعلم الوطني، وفي مدرستنا في قلب المدينة سنهدي الأستاذة راتنا باقة زهور.
      en: Tomorrow is National Teachers' Day. At our school in the heart of the city, we're giving Bu Ratna flowers.
    - speaker: Mohamed
      text: Bagus! Di sini orang bilang guru adalah pahlawan tanpa tanda jasa, kan?
      ar_eg: حلو! هنا الناس بتقول إن المدرس بطل من غير وسام، صح؟
      ar: رائع! يقولون هنا إن المعلم بطل بلا وسام، أليس كذلك؟
      en: Lovely! People here say teachers are heroes without medals, right?
    - speaker: Andi Tenri
      text: Betul. Bu Ratna juga tangan kanan kepala sekolah kami.
      ar_eg: صح. والأستاذة راتنا كمان الدراع اليمين لناظر مدرستنا.
      ar: صحيح، والأستاذة راتنا هي الساعد الأيمن لمدير مدرستنا.
      en: Right. Bu Ratna is also our head teacher's right-hand woman.
    - speaker: Mohamed
      text: Dan murid-muridnya adalah buah hatinya!
      ar_eg: وتلاميذها هما فلذة كبدها!
      ar: وتلاميذها فلذات كبدها!
      en: And her pupils are her darlings!
