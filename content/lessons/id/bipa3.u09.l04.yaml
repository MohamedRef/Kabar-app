schema: kabar.lesson/v1
id: bipa3.u09.l04
language: id
title: Naga dan harta
can_do:
  ar_eg: تحكي حدوتة فيها تنين وساحر وسحر وكنز، وتتكلم عن الأساطير والقدر.
  ar: أن تحكي حكاية فيها تنين وساحر وسحر وكنز، وتتحدث عن الأساطير والقدر.
  en: Tell a tale with a dragon, a sorcerer, magic and treasure, and talk about legends and fate.
slides:
  - title: Dunia dongeng
    body:
      ar_eg: |
        naga = تنين. penyihir = ساحر، ساحرة. sihir = سحر (من العربي).
        makhluk = مخلوق (من العربي). keajaiban = معجزة، حاجة عجيبة (من ajaib ← عجيب).
        legenda = أسطورة. takdir = قدر، مكتوب (من العربي «تقدير»). harta = كنز، ثروة.
      ar: |
        naga = تنّين. penyihir = ساحر، ساحرة. sihir = سحر (من العربية).
        makhluk = مخلوق (من العربية). keajaiban = معجزة، أعجوبة (من ajaib ← عجيب).
        legenda = أسطورة. takdir = قدر (من العربية «تقدير»). harta = كنز، ثروة.
      en: |
        naga = dragon. penyihir = sorcerer, witch. sihir = magic (from Arabic).
        makhluk = creature (from Arabic). keajaiban = miracle, wonder (from ajaib ← Arabic ʿajīb).
        legenda = legend. takdir = fate, destiny (from Arabic taqdīr). harta = treasure, wealth.
    examples:
      - text: Pada zaman dahulu, ada naga yang menjaga harta raja.
        ar_eg: زمان، كان فيه تنين بيحرس كنز الملك.
        ar: في قديم الزمان كان تنّين يحرس كنز الملك.
        en: Long ago, a dragon guarded the king's treasure.
      - text: Penyihir itu memakai sihir untuk membuat pangeran tidur.
        ar_eg: الساحرة استخدمت السحر عشان تنيّم الأمير.
        ar: استخدمت الساحرة السحر لتُنيم الأمير.
        en: The witch used magic to put the prince to sleep.
      - text: Legenda Putri Mandalika terkenal di Lombok.
        ar_eg: أسطورة الأميرة مانداليكا مشهورة في لومبوك.
        ar: أسطورة الأميرة ماندليكا مشهورة في لومبوك.
        en: The legend of Princess Mandalika is famous in Lombok.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: naga
        ar_eg: تنين
        ar: تنّين
        en: dragon
      - text: penyihir
        ar_eg: ساحر
        ar: ساحر
        en: sorcerer
      - text: sihir
        ar_eg: سحر
        ar: سحر
        en: magic
      - text: makhluk
        ar_eg: مخلوق
        ar: مخلوق
        en: creature
    words: [naga, penyihir, sihir, makhluk]
  - id: e02
    type: match_pairs
    pairs:
      - text: keajaiban
        ar_eg: معجزة
        ar: أعجوبة
        en: wonder
      - text: legenda
        ar_eg: أسطورة
        ar: أسطورة
        en: legend
      - text: takdir
        ar_eg: قدر، مكتوب
        ar: قدر
        en: fate
      - text: harta
        ar_eg: كنز
        ar: كنز
        en: treasure
    words: [keajaiban, legenda, takdir, harta]
  - id: e03
    type: listen
    text: Di dalam gua itu ada harta emas, tapi naga menjaganya.
    question:
      ar_eg: إيه اللي جوه المغارة؟
      ar: ماذا في المغارة؟
      en: What's in the cave?
    options: [كنز دهب, مية, أكل]
    answer: 0
    meaning:
      ar_eg: جوه المغارة دي فيه كنز دهب، بس التنين بيحرسه.
      ar: في تلك المغارة كنز من ذهب، لكن التنين يحرسه.
      en: There's golden treasure in that cave, but the dragon guards it.
    words: [harta, naga]
  - id: e04
    type: fill_blank
    sentence: ___ itu tinggal di hutan dan membuat obat aneh.
    meaning:
      ar_eg: الـ ___ دي ساكنة في الغابة وبتعمل أدوية غريبة.
      ar: يسكن ___ في الغابة ويصنع أدوية غريبة.
      en: The ___ lives in the forest and makes strange potions.
    options: [Penyihir, Legenda, Takdir]
    answers: [Penyihir]
    words: [penyihir, legenda, takdir]
    explain:
      ar_eg: اللي بيعمل أدوية غريبة في الغابة Penyihir (ساحر). Legenda = أسطورة، وTakdir = القدر، ومحدش فيهم ساكن.
      ar: صانع الأدوية الغريبة في الغابة Penyihir «ساحر». أما Legenda فأسطورة، وTakdir القدر، ولا يسكن أيٌّ منهما.
      en: Someone brewing strange potions in the forest is a Penyihir, a sorcerer. Legenda is a legend and Takdir fate.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كلمة جاية من العربي «تقدير»، معناها القدر؟
      ar: أي كلمة من العربية «تقدير» وتعني القدر؟
      en: Which word comes from Arabic taqdīr and means fate?
    options: [sihir, harta, takdir]
    answer: 2
    explain:
      ar_eg: takdir ← تقدير = قدر.
      ar: takdir ← تقدير = قدر.
      en: takdir ← taqdīr = fate.
    words: [takdir, sihir, harta]
  - id: e06
    type: fill_blank
    sentence: Dia sembuh dari sakit yang berat. Itu sebuah ___!
    meaning:
      ar_eg: خف من مرض تقيل. دي ___!
      ar: شُفي من مرض شديد. إنها ___!
      en: He recovered from a serious illness. It's a ___!
    options: [keajaiban, makhluk, naga]
    answers: [keajaiban]
    words: [keajaiban, makhluk, naga]
    explain:
      ar_eg: الشفا من مرض تقيل keajaiban (معجزة). makhluk = مخلوق، وnaga = تنين.
      ar: الشفاء من مرض شديد keajaiban «معجزة». أما makhluk فمخلوق، وnaga تنّين.
      en: Recovering from a serious illness is a keajaiban, a miracle. makhluk is a creature and naga a dragon.
  - id: e07
    type: build_sentence
    source:
      ar_eg: التنين ده مخلوق كبير وقوي.
      ar: هذا التنين مخلوق كبير وقوي.
      en: This dragon is a big, strong creature.
    answer: Naga ini makhluk yang besar dan kuat.
    distractors: [sihir, harta]
    words: [naga, makhluk]
    explain:
      ar_eg: «مخلوق كبير وقوي» = makhluk yang besar dan kuat. sihir = سحر، وharta = كنز.
      ar: «مخلوق كبير وقوي» makhluk yang besar dan kuat. أما sihir فسحر، وharta كنز.
      en: "\"A big, strong creature\" is makhluk yang besar dan kuat. sihir is magic and harta treasure."
  - id: e08
    type: translate
    direction: from_target
    source_text: Legenda itu tentang seorang putri dan seekor naga.
    answers_meaning:
      ar_eg: [الأسطورة دي عن أميرة وتنين, الحكاية الأسطورية دي عن أميرة وتنين]
      ar: [تلك الأسطورة عن أميرة وتنّين]
      en: [That legend is about a princess and a dragon, The legend is about a princess and a dragon]
    words: [legenda, naga]
  - id: e09
    type: speaking
    text: Dengan sihir, penyihir itu menjadi seekor burung.
    meaning:
      ar_eg: بالسحر، الساحر ده اتحوّل لعصفورة.
      ar: بالسحر تحوّل ذلك الساحر إلى طائر.
      en: With magic, the sorcerer turned into a bird.
    words: [sihir, penyihir]
  - id: e10
    type: multiple_choice
    question: Kami bertemu di Kairo, lalu menikah. Itu bukan keajaiban, itu ___.
    options: [harta, takdir, makhluk]
    answer: 1
    explain:
      ar_eg: takdir = قدر، نصيب.
      ar: takdir = قدر.
      en: takdir = fate.
    words: [takdir, harta, makhluk, keajaiban]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas Rizal, di Lombok ada legenda tentang naga nggak?
      ar_eg: يا مستر رزال، في لومبوك فيه أسطورة عن تنين؟
      ar: يا رزال، هل في لومبوك أسطورة عن تنّين؟
      en: Mas Rizal, is there a dragon legend in Lombok?
    - speaker: Mas Rizal
      text: Ada cerita tentang makhluk di Danau Segara Anak. Katanya dia menjaga harta.
      ar_eg: فيه حكاية عن مخلوق في بحيرة سيجارا أناك. بيقولوا بيحرس كنز.
      ar: هناك قصة عن مخلوق في بحيرة سيغارا أناك. يقولون إنه يحرس كنزًا.
      en: There's a story about a creature in Lake Segara Anak. They say it guards treasure.
    - speaker: Mohamed
      text: Di Mesir juga ada cerita tentang sihir dan penyihir.
      ar_eg: في مصر كمان فيه حكايات عن السحر والسحرة.
      ar: وفي مصر أيضًا قصص عن السحر والسحرة.
      en: In Egypt there are stories about magic and sorcerers too.
    - speaker: Mas Rizal
      text: Seribu Satu Malam, kan?
      ar_eg: زي ألف ليلة وليلة؟
      ar: مثل ألف ليلة وليلة؟
      en: Like the Thousand and One Nights?
    - speaker: Mohamed
      text: Iya! Ceritanya penuh keajaiban. Aku suka banget.
      ar_eg: أيوه! الحكايات مليانة عجايب. بحبها جدًا.
      ar: نعم! قصصها مليئة بالعجائب. أحبها كثيرًا.
      en: Yes! The stories are full of wonders. I love them.
