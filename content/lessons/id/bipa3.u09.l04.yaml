dialogue:
  title: Akhir cerita
  lines:
    - speaker: Mohamed
      text: Mas, sekarang ceritakan akhirnya! Putri Mandalika memilih siapa?
      ar_eg: يا ماس، احكيلي النهاية بقى! الأميرة اختارت مين؟
      ar: يا ماس، احكِ لي النهاية الآن! مَن اختارت الأميرة؟
      en: Mas, tell me the ending now! Who did Princess Mandalika choose?
    - speaker: Mas Rizal
      text: Dia tidak memilih. Kalau dia memilih satu pangeran, yang lain akan marah.
      ar_eg: ما اختارتش. لو اختارت أمير واحد، الباقيين هيزعلوا.
      ar: لم تختر أحدًا، فلو اختارت أميرًا لغضب الآخرون.
      en: She didn't choose. If she chose one prince, the others would be angry.
    - speaker: Mas Rizal
      text: Jadi, dia pergi ke pantai dan terjun ke laut.
      ar_eg: فراحت الشط ونطّت في البحر.
      ar: فذهبت إلى الشاطئ وألقت بنفسها في البحر.
      en: So she went to the beach and leapt into the sea.
    - speaker: Mohamed
      text: Aduh, sedih sekali!
      ar_eg: يا خسارة، حزينة أوي!
      ar: يا للحزن!
      en: Oh, how sad!
    - speaker: Mas Rizal
      text: Lalu banyak nyale datang ke pantai. Rakyat percaya nyale itu adalah Putri Mandalika.
      ar_eg: وبعدين ديدان نيالي كتير جت للشط، والناس صدّقت إن النيالي هي الأميرة.
      ar: ثم جاءت ديدان نيالي كثيرة إلى الشاطئ، فاعتقد الناس أنها الأميرة.
      en: Then lots of nyale came to the beach. The people believed the nyale were the princess.
    - speaker: Mas Rizal
      text: Sekarang, setiap tahun warga datang berbondong-bondong untuk mencari nyale.
      ar_eg: ودلوقتي كل سنة الأهالي بييجوا أفواج يدوّروا على النيالي.
      ar: والآن يأتي الأهالي كل عام أفواجًا للبحث عن النيالي.
      en: Now, every year, villagers come in droves to look for nyale.
