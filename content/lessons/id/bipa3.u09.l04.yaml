language: id
title: Putri Mandalika
can_do:
  ar_eg: تحكي أسطورة الأميرة مانداليكا بكلامك.
  ar: أن تروي أسطورة الأميرة مانداليكا بأسلوبك.
  en: Retell the legend of Princess Mandalika in your own words.
slides:
  - title: Legenda Putri Mandalika
    body:
      ar_eg: |
        أشهر حدوتة في جنوب لومبوك: أمرا كتير جم يطلبوا إيد (melamar) الأميرة مانداليكا. هي حبت شعبها (rakyat) وخافت من الحرب، ففضلت تفكر berhari-hari، وفي الآخر نطّت (terjun) في البحر.
        بعدها ظهرت ديدان بحر ملونة اسمها nyale، والناس بتصدّق إنها الأميرة. ولحد النهارده الناس بتيجي berbondong-bondong تدوّر على النيالي.
      ar: |
        أشهر حكايات جنوب لومبوك: جاء أمراء كثيرون يخطبون (melamar) الأميرة مانداليكا، فأحبّت شعبها (rakyat) وخشيت الحرب، ففكّرت berhari-hari ثم ألقت بنفسها (terjun) في البحر.
        وبعدها ظهرت ديدان بحرية ملونة تُسمّى nyale، يعتقد الناس أنها الأميرة، وما زالوا يأتون berbondong-bondong للبحث عنها.
      en: |
        South Lombok's best-loved legend: many princes came to propose to (melamar) Princess Mandalika. She loved her people (rakyat) and feared war, so she thought berhari-hari, then leapt (terjun) into the sea.
        Afterwards colourful sea worms called nyale appeared, and people believe they are the princess. To this day people come berbondong-bondong to look for nyale.
    grammar: id.reduplication.ber-an
    examples:
      - text: Setiap tahun, warga datang berbondong-bondong ke pantai untuk mencari nyale.
        ar_eg: كل سنة الأهالي بييجوا الشط أفواج عشان يدوّروا على النيالي.
        ar: يأتي الأهالي كل عام إلى الشاطئ أفواجًا للبحث عن النيالي.
        en: Every year, villagers come to the beach in droves to look for nyale.
