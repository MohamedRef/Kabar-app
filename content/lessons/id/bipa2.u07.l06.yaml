    text: Gol! Skornya sekarang dua-dua!
    question:
      ar_eg: النتيجة كام؟
      ar: كم النتيجة؟
      en: What's the score?
    options: [٢–٢, ٢–١, ١–١]
    answer: 0
    meaning:
      ar_eg: جول! النتيجة دلوقتي ٢–٢!
      ar: هدف! النتيجة الآن ٢–٢!
      en: Goal! It's two-two now!
    words: [gol, skor]
  - id: e04
    type: fill_blank
    sentence: Indonesia menang! Mereka angkat ___.
    meaning:
      ar_eg: إندونيسيا كسبت! رفعوا الـ ___.
      ar: فازت إندونيسيا! رفعوا ___.
      en: Indonesia won! They lift the ___.
    options: [piala, wasit, darah]
    answers: [piala]
    words: [piala, wasit, darah]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيصفّر في الماتش؟
      ar: من يصفّر في المباراة؟
      en: Who blows the whistle in a match?
    options: [wasit, piala, skor]
    answer: 0
    explain:
      ar_eg: wasit = حكم.
      ar: wasit = حكم.
      en: wasit = referee.
    words: [wasit, piala, skor]
  - id: e06
    type: fill_blank
    sentence: Ada ___ di kakinya. Warnanya merah.
    meaning:
      ar_eg: فيه ___ على رجله. لونه أحمر.
      ar: هناك ___ على ساقه، لونه أحمر.
      en: There's ___ on his leg. It's red.
    options: [darah, keringat, napas]
    answers: [darah]
    words: [darah, keringat, napas]
  - id: e07
    type: build_sentence
    source:
      ar_eg: خد نفس، وبعدين اجري تاني.
      ar: خذ نفَسًا، ثم اجرِ مرة أخرى.
      en: Take a breath, then run again.
    answer: Tarik napas, lalu lari lagi.
    distractors: [dada, gol]
    words: [napas]
  - id: e08
    type: translate
    direction: from_target
    source_text: Sesudah main bola, saya banyak keringat.
    answers_meaning:
      ar_eg: [بعد الكورة عرقت كتير, بعد ما لعبت كورة عرقان أوي]
      ar: [بعد لعب الكرة تعرّقت كثيرًا]
      en: ['After playing football I''m very sweaty', After football I sweat a lot]
    words: [keringat]
  - id: e09
    type: speaking
    text: Gol dengan dada! Skornya satu-nol!
    meaning:
      ar_eg: جول بالصدر! النتيجة ١–٠!
      ar: هدف بالصدر! النتيجة ١–٠!
      en: A goal off the chest! One-nil!
    words: [gol, dada, skor]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: القلب جوّه أنهي جزء من الجسم؟
      ar: في أيّ جزء من الجسم يقع القلب؟
      en: Which part of the body is the heart in?
    options: [dada, kaki, kepala]
    answer: 0
    explain:
      ar_eg: 'في الصدر: dada.'
      ar: 'في الصدر: dada.'
      en: 'In the chest: dada.'
    words: [dada]
dialogue:
  lines:
    - speaker: Raka
      text: Ayo nonton bola! Indonesia lawan Vietnam.
      ar_eg: يلا نتفرج على الكورة! إندونيسيا ضد فيتنام.
      ar: هيّا نشاهد الكرة! إندونيسيا ضد فيتنام.
      en: Let's watch the football! Indonesia against Vietnam.
    - speaker: Mohamed
      text: Skornya berapa?
      ar_eg: النتيجة كام؟
      ar: كم النتيجة؟
      en: What's the score?
    - speaker: Raka
      text: Masih nol-nol... Gol! Satu-nol! Dengan dada!
      ar_eg: لسه صفر صفر... جول! واحد صفر! بالصدر!
      ar: ما زالت صفر–صفر... هدف! واحد–صفر! بالصدر!
      en: Still nil-nil... Goal! One-nil! Off his chest!
    - speaker: Mohamed
      text: Tapi lihat, ada darah di kakinya!
      ar_eg: بس بص، فيه دم على رجله!
      ar: لكن انظر، هناك دم على ساقه!
      en: But look, there's blood on his leg!
    - speaker: Raka
      text: Nggak apa-apa. Dia tarik napas, dia banyak keringat.
      ar_eg: مفيش حاجة. بياخد نفسه، وعرقان أوي.
      ar: لا بأس، يلتقط أنفاسه وهو يتصبّب عرقًا.
      en: He's OK. He's catching his breath; he's very sweaty.
    - speaker: Mohamed
      text: Ayo, Indonesia! Ambil pialanya!
      ar_eg: يلا يا إندونيسيا! هاتوا الكاس!
      ar: هيّا إندونيسيا! خذوا الكأس!
      en: Come on, Indonesia! Win the cup!
