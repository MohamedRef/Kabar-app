schema: kabar.lesson/v1
id: bipa2.u07.l06
language: id
title: Gol! Skornya berapa?
can_do:
  ar_eg: 'تتفرج على ماتش: الجول والحكم والنتيجة والكاس، واللاعب اللي بيعرق وبياخد نفسه وعليه دم.'
  ar: 'أن تشاهد مباراة: الهدف والحكم والنتيجة والكأس، واللاعب الذي يتعرّق ويلتقط أنفاسه وعليه دم.'
  en: 'Watch a match: goals, the referee, the score and the cup, and a player who''s sweating, catching his breath and bleeding.'
slides:
  - title: Nonton bola
    body:
      ar_eg: |
        gol = جول، wasit = حكم، skor = النتيجة: Skornya dua-satu. piala = كاس (البطولة).
        dada = صدر: Gol dengan dada!
        napas = نفَس: Tarik napas! = خد نفس! keringat = عرق، darah = دم.
        في الشارع بيقولوا:
        - nggak = tidak (مش، لأ)
      ar: |
        gol = هدف، wasit = حكم، skor = النتيجة: Skornya dua-satu. piala = كأس البطولة.
        dada = صدر: Gol dengan dada!
        napas = نفَس: Tarik napas! = خذ نفَسًا! keringat = عرق، darah = دم.
        في كلام الشارع:
        - nggak = tidak (لا، ليس)
      en: |
        gol = goal, wasit = referee, skor = score: Skornya dua-satu. piala = cup, trophy.
        dada = chest: Gol dengan dada!
        napas = breath: Tarik napas! = breathe in! keringat = sweat, darah = blood.
        On the street:
        - nggak = tidak (not, no)
    examples:
      - text: Gol! Skornya dua-satu!
        ar_eg: جوووول! النتيجة ٢–١!
        ar: هدف! النتيجة ٢–١!
        en: Goal! It's two-one!
      - text: Wasit itu tidak adil!
        ar_eg: الحكم ده ظالم!
        ar: ذلك الحكم غير عادل!
        en: That referee isn't fair!
      - text: Ada darah di kakinya.
        ar_eg: فيه دم على رجله.
        ar: هناك دم على ساقه.
        en: There's blood on his leg.
