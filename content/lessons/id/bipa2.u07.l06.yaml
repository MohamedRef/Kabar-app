dialogue:
  lines:
    - speaker: Raka
      text: Ayo nonton bola! Indonesia lawan Vietnam.
      ar_eg: يلا نتفرج على الكورة! إندونيسيا ضد فيتنام.
      ar: هيّا نشاهد الكرة! إندونيسيا ضد فيتنام.
      en: Let's watch the football! Indonesia against Vietnam.
    - speaker: Mohamed
      text: Skornya berapa?
      ar_eg: النتيجة كام؟
      ar: كم النتيجة؟
      en: What's the score?
    - speaker: Raka
      text: Masih nol-nol... Gol! Satu-nol!
      ar_eg: لسه صفر صفر... جول! واحد صفر!
      ar: ما زالت صفر–صفر... هدف! واحد–صفر!
      en: Still nil-nil... Goal! One-nil!
    - speaker: Mohamed
      text: Wah! Tapi wasit bilang apa?
      ar_eg: الله! بس الحكم قال إيه؟
      ar: رائع! لكن ماذا قال الحكم؟
      en: Wow! But what did the referee say?
    - speaker: Raka
      text: Golnya bagus! Indonesia menang!
      ar_eg: الجول صح! إندونيسيا كسبت!
      ar: الهدف صحيح! إندونيسيا فازت!
      en: It's a good goal! Indonesia wins!
    - speaker: Mohamed
      text: Ayo, Indonesia! Ambil pialanya!
      ar_eg: يلا يا إندونيسيا! هاتوا الكاس!
      ar: هيّا إندونيسيا! خذوا الكأس!
      en: Come on, Indonesia! Win the cup!
