schema: kabar.lesson/v1
id: bipa2.u07.l06
language: id
title: Gol! Skornya berapa?
can_do:
  ar_eg: تتفرج على ماتش وتتكلم عن الجول والحكم والنتيجة والكاس، وعن الباسكت والفولي.
  ar: أن تشاهد مباراة وتتحدث عن الهدف والحكم والنتيجة والكأس، وعن السلة والطائرة.
  en: Watch a match and talk about goals, the referee, the score and the cup, plus basketball and volleyball.
slides:
  - title: Nonton bola
    body:
      ar_eg: |
        gol = جول، wasit = حكم، skor = النتيجة: Skornya dua-satu. piala = كاس (البطولة).
        basket = باسكت، voli = فولي (voli pantai = فولي شاطئ).
        kaos kaki = شراب (حرفيًا «تيشيرت رجل»!)، celana pendek = شورت.
      ar: |
        gol = هدف، wasit = حكم، skor = النتيجة: Skornya dua-satu. piala = كأس البطولة.
        basket = كرة السلة، voli = الكرة الطائرة (voli pantai = الطائرة الشاطئية).
        kaos kaki = جوارب (حرفيًا «قميص القدم»!)، celana pendek = سروال قصير.
      en: |
        gol = goal, wasit = referee, skor = score: Skornya dua-satu. piala = cup, trophy.
        basket = basketball, voli = volleyball (voli pantai = beach volleyball).
        kaos kaki = socks (literally "foot T-shirt"!), celana pendek = shorts.
    examples:
      - text: Gol! Skornya dua-satu!
        ar_eg: جوووول! النتيجة ٢–١!
        ar: هدف! النتيجة ٢–١!
        en: Goal! It's two-one!
      - text: Wasit itu tidak adil!
        ar_eg: الحكم ده ظالم!
        ar: ذلك الحكم غير عادل!
        en: That referee isn't fair!
      - text: Kami main voli pantai di Kuta.
        ar_eg: بنلعب فولي شاطئ في كوتا.
        ar: نلعب الكرة الطائرة الشاطئية في كوتا.
        en: We play beach volleyball in Kuta.
