schema: kabar.lesson/v1
id: bipa5.u03.l11
language: id
title: Ringkasan artikel
can_do:
  ar_eg: تلخّص مقال طويل في كام جملة بكلامك إنت.
  ar: أن تلخّص مقالة طويلة في جمل قليلة بأسلوبك.
  en: Summarise a long article in a few sentences of your own.
slides:
  - title: Cara meringkas
    grammar: id.nominalization
    body:
      ar_eg: |
        الملخص (ringkasan) فيه الفكرة الأساسية والنقط المهمة بس، من غير أمثلة ولا أرقام كتير:
        - Artikel ini membahas … = المقال ده بيتكلم عن …
        - Menurut penulis, … = حسب الكاتب …
        - Secara singkat, … = باختصار …
        والأسماء بتختصر: «الناس بيستخدموا التطبيقات أكتر» → peningkatan penggunaan aplikasi.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: aku = saya، nulis = menulis، aja = saja.
      ar: |
        يضمّ الملخّص (ringkasan) الفكرة الرئيسة والنقاط المهمّة فقط، دون أمثلة أو أرقام كثيرة:
        - Artikel ini membahas … = تتناول هذه المقالة …
        - Menurut penulis, … = بحسب الكاتب …
        - Secara singkat, … = باختصار …
        والاسم يختصر: «صار الناس يستخدمون التطبيقات أكثر» → peningkatan penggunaan aplikasi.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: aku = saya، nulis = menulis، aja = saja.
      en: |
        A summary (ringkasan) keeps only the main idea and key points, without examples or many numbers:
        - Artikel ini membahas … = This article discusses …
        - Menurut penulis, … = According to the writer, …
        - Secara singkat, … = In short, …
        Nouns compress: "people use apps more" → peningkatan penggunaan aplikasi.
        The dialogue uses street forms; the formal ones are beside them: aku = saya, nulis = menulis, aja = saja.
    examples:
      - text: Secara singkat, artikel ini membahas peningkatan penggunaan aplikasi.
        ar_eg: باختصار، المقال ده بيتكلم عن زيادة استخدام التطبيقات.
        ar: باختصار، تتناول المقالة ازدياد استخدام التطبيقات.
        en: In short, this article discusses the rise in app use.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ringkasan
        ar_eg: ملخص
        ar: ملخّص
        en: summary
      - text: secara singkat
        ar_eg: باختصار
        ar: باختصار
        en: in short
      - text: peningkatan
        ar_eg: زيادة / ارتفاع
        ar: ازدياد، ارتفاع
        en: increase
      - text: gagasan utama
        ar_eg: الفكرة الأساسية
        ar: الفكرة الرئيسة
        en: main idea
    words: [ringkasan, secara singkat, peningkatan, gagasan utama]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي مايتحطش في الملخص؟
      ar: ما الذي لا يوضع في الملخّص؟
      en: What doesn't belong in a summary?
    options:
      - gagasan utama artikel
      - semua contoh dan angka di artikel
      - pendapat penulis
    answer: 1
    words: [ringkasan, gagasan utama]
    explain:
      ar_eg: الملخص بياخد الفكرة الأساسية ورأي الكاتب، مش كل الأمثلة والأرقام.
      ar: يضمّ الملخّص الفكرة الرئيسة ورأي الكاتب، لا كلّ الأمثلة والأرقام.
      en: A summary keeps the main idea and the writer's view, not every example and figure.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة أحسن للملخص؟
      ar: أيّ جملة أنسب للملخّص؟
      en: Which sentence suits a summary better?
    options:
      - Peningkatan belanja daring membuat toko kecil tertekan.
      - Kemarin Bu Ani membeli baju di aplikasi jam tujuh malam.
      - Ada 12.345 toko yang tutup di Samarinda, Balikpapan, dan Bontang.
    answer: 0
    words: [peningkatan]
    explain:
      ar_eg: الجملة الأولى بتقول الفكرة العامة. حكاية Bu Ani وعدد المحلات بالظبط تفاصيل مكانها المقال مش الملخص.
      ar: الجملة الأولى تذكر الفكرة العامة، أما قصة Bu Ani وعدد المتاجر بدقّة فتفاصيل مكانها المقالة.
      en: The first states the general point. Bu Ani's purchase and the exact shop count are details for the article, not the summary.
  - id: e04
    type: fill_blank
    sentence: ___, ekonomi digital membawa peluang dan risiko.
    meaning:
      ar_eg: باختصار، الاقتصاد الرقمي بيجيب فرص ومخاطر.
      ar: باختصار، يحمل الاقتصاد الرقمي فرصًا ومخاطر.
      en: In short, the digital economy brings opportunities and risks.
    options: [Secara singkat, Pertama-tama, Padahal]
    answers: [Secara singkat]
    words: [secara singkat]
    explain:
      ar_eg: «باختصار» = Secara singkat. Pertama-tama = أولًا، وPadahal = مع إن، ومش للتلخيص.
      ar: «باختصار» = Secara singkat. أما Pertama-tama فـ«أولًا»، وPadahal «مع أنّ»، ولا تفيدان التلخيص.
      en: "\"In short\" is Secara singkat. Pertama-tama (first of all) and Padahal (even though) don't summarise."
  - id: e05
    type: listen
    text: Gagasan utama artikel itu ada di paragraf pertama. Paragraf berikutnya hanya memberi contoh dan angka, jadi tidak perlu masuk ringkasan.
    question:
      ar_eg: إيه اللي يدخل الملخص حسب الكلام ده؟
      ar: ما الذي يدخل الملخّص بحسب هذا الكلام؟
      en: According to this, what goes into the summary?
    options:
      - Contoh dan angka dari semua paragraf.
      - Hanya judul artikel.
      - Gagasan utama dari paragraf pertama.
    answer: 2
    explain:
      ar_eg: الفكرة الأساسية في أول فقرة، والباقي أمثلة وأرقام tidak perlu masuk = مش لازم تدخل.
      ar: الفكرة الرئيسة في الفقرة الأولى، والباقي أمثلة وأرقام tidak perlu masuk = لا يلزم إدخالها.
      en: The main idea is in paragraph one; the rest is examples and figures that needn't go in.
    words: [gagasan utama, ringkasan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: المقال ده بيتكلم عن زيادة التسوّق أونلاين.
      ar: تتناول هذه المقالة ازدياد التسوّق الإلكتروني.
      en: This article discusses the increase in online shopping.
    answer: Artikel ini membahas peningkatan belanja daring.
    distractors: [singkat, meningkat]
    words: [peningkatan]
    explain:
      ar_eg: «زيادة» اسم = peningkatan. meningkat فعل «يزيد»، وsingkat = قصير/مختصر، مش في المعنى.
      ar: «الازدياد» اسم = peningkatan. أما meningkat ففعل «يزداد»، وsingkat «مختصر».
      en: "\"Increase\" here is the noun peningkatan. meningkat is the verb, and singkat means \"brief\"."
  - id: e07
    type: translate
    direction: from_target
    source_text: Menurut penulis, ringkasan harus singkat, tetapi tidak boleh mengubah gagasan utama artikel.
    answers_meaning:
      ar_eg:
        - حسب الكاتب، الملخص لازم يكون قصير، بس مايغيّرش الفكرة الأساسية للمقال.
        - الكاتب بيقول إن الملخص لازم يبقى مختصر، لكن ممنوع يغيّر فكرة المقال الأساسية.
      ar:
        - بحسب الكاتب، يجب أن يكون الملخّص قصيرًا، لكن لا يجوز أن يغيّر الفكرة الرئيسة للمقالة.
        - يرى الكاتب أنّ الملخّص ينبغي أن يكون موجزًا دون أن يبدّل فكرة المقالة الأساسية.
      en:
        - According to the writer, a summary must be short, but it must not change the article's main idea.
        - The writer says a summary should be brief, but it can't alter the main idea of the article.
    explain:
      ar_eg: harus = لازم، وtetapi tidak boleh = بس ممنوع.
      ar: harus = يجب، وtetapi tidak boleh = لكن لا يجوز.
      en: harus = must; tetapi tidak boleh = but must not.
    words: [ringkasan, gagasan utama]
  - id: e08
    type: speaking
    text: Secara singkat, gagasan utamanya adalah perubahan cara belanja.
    meaning:
      ar_eg: باختصار، الفكرة الأساسية هي تغيّر طريقة الشرا.
      ar: باختصار، الفكرة الرئيسة هي تغيّر أسلوب التسوّق.
      en: In short, the main idea is the change in how people shop.
    words: [secara singkat, gagasan utama]
dialogue:
  title: Tugas ringkasan
  lines:
    - speaker: Rina
      text: Ringkasanmu berapa kalimat, sih, Mohamed?
      ar_eg: ملخصك كام جملة يا محمد؟
      ar: كم جملة في ملخّصك يا محمد؟
      en: How many sentences is your summary, Mohamed?
    - speaker: Mohamed
      text: Lima. Tapi aku masih nulis semua angkanya.
      ar_eg: خمسة. بس لسه كاتب كل الأرقام.
      ar: خمس. لكنني ما زلت أكتب كلّ الأرقام.
      en: Five. But I'm still writing all the numbers.
    - speaker: Rina
      text: Hapus aja. Tulis gagasan utama sama dua ide penting.
      ar_eg: امسحهم. اكتب الفكرة الأساسية وفكرتين مهمين.
      ar: احذفها. اكتب الفكرة الرئيسة وفكرتين مهمّتين.
      en: Delete them. Write the main idea and two key ideas.
    - speaker: Mohamed
      text: Oke. Secara singkat, artikelnya soal peningkatan belanja daring.
      ar_eg: ماشي. باختصار، المقال عن زيادة التسوّق أونلاين.
      ar: حسنًا. باختصار، المقالة عن ازدياد التسوّق الإلكتروني.
      en: Okay. In short, the article is about the rise of online shopping.
new_words:
  - word: secara singkat
    ar_eg: باختصار
    ar: باختصار
    en: in short
  - word: peningkatan
    pos: noun
    ar_eg: زيادة / ارتفاع
    ar: ازدياد، ارتفاع
    en: increase
  - word: gagasan utama
    pos: noun
    ar_eg: الفكرة الأساسية
    ar: الفكرة الرئيسة
    en: main idea
review:
  status: draft
  verified: false
