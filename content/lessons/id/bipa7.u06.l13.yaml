schema: kabar.lesson/v1
id: bipa7.u06.l13
language: id
title: Membuat utas
can_do:
  ar_eg: تكتب سلسلة بوستات قصيرة (ثريد) تصحّح فيها إشاعة بمصادر.
  ar: أن تكتب سلسلة منشورات قصيرة تصحّح فيها شائعة بالمصادر.
  en: Write a short thread that corrects a rumour, with sources.
slides:
  - title: Utas cek fakta
    body:
      ar_eg: |
        الـ utas (ثريد) سلسلة بوستات قصيرة ورا بعض: 1/5، 2/5…
        والـ tagar (هاشتاج) زي #CekFakta بيخلّي الناس تلاقيه.
        شكل الـ utas الكويس:
        1/ الإشاعة: «Air laut di Sorong beracun.»
        2/ الحقيقة: Menurut sumber resmi, airnya aman.
        3/ الدليل: لينك من موقع رسمي.
        4/ نصيحة: Jangan sebarkan sebelum cek fakta.
        5/ الختام: Bagikan utas ini, bukan hoaksnya!
        - في الكلام: udah = sudah، aja = saja، bikin = membuat، terus = lalu، yuk = ayo.
      ar: |
        الـ utas سلسلة منشورات قصيرة متتابعة: 1/5، 2/5…
        والـ tagar (وسم، هاشتاغ) مثل #CekFakta يسهّل العثور عليها.
        هيكل الـ utas الجيّدة:
        1/ الشائعة: «Air laut di Sorong beracun.»
        2/ الحقيقة: Menurut sumber resmi, airnya aman.
        3/ الدليل: رابط إلى موقع رسميّ.
        4/ نصيحة: Jangan sebarkan sebelum cek fakta.
        5/ الختام: Bagikan utas ini, bukan hoaksnya!
        - في الكلام اليومي: udah = sudah، aja = saja، bikin = membuat، terus = lalu، yuk = ayo.
      en: |
        An utas (thread) is a chain of short posts: 1/5, 2/5…
        A tagar (hashtag) like #CekFakta helps people find it.
        A good utas:
        1/ The rumour: "Air laut di Sorong beracun."
        2/ The truth: Menurut sumber resmi, airnya aman.
        3/ The evidence: a link from an official site.
        4/ Advice: Jangan sebarkan sebelum cek fakta.
        5/ Close: Bagikan utas ini, bukan hoaksnya!
        - In speech: udah = sudah, aja = saja, bikin = membuat, terus = lalu, yuk = ayo.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الـ «utas» يبقى إيه؟
      ar: ما الـ «utas»؟
      en: What is an "utas"?
    options:
      - فيديو طويل.
      - سلسلة بوستات قصيرة ورا بعض.
      - رسالة خاصة.
    answer: 1
    words: [utas]
  - id: e02
    type: listen
    text: Pakai tagar CekFakta supaya utasmu mudah ditemukan.
    question:
      ar_eg: ليه نستعمل الهاشتاج؟
      ar: لماذا نستعمل الوسم؟
      en: Why use the hashtag?
    options:
      - علشان الثريد يتلاقى بسهولة.
      - علشان البوست يبقى أطول.
      - علشان نخبّي الثريد.
    answer: 0
    words: [tagar, utas]
  - id: e03
    type: fill_blank
    sentence: Saya menulis ___ lima bagian untuk membantah hoaks itu.
    meaning:
      ar_eg: كتبت ثريد من خمس أجزاء علشان أردّ على الإشاعة دي.
      ar: كتبت سلسلة من خمسة أجزاء لتفنيد تلك الشائعة.
      en: I wrote a five-part thread to debunk that hoax.
    options: [utas, tagar, tautan]
    answers: [utas]
    words: [utas, hoaks]
  - id: e04
    type: build_sentence
    source:
      ar_eg: شيّر الثريد ده، مش الإشاعة!
      ar: شارك هذه السلسلة لا الشائعة!
      en: Share this thread, not the hoax!
    answer: Bagikan utas ini, bukan hoaksnya!
    distractors: [tagar, sumber]
    words: [utas, hoaks]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه أحسن حاجة تحطّها في الجزء ٣/ من الثريد؟
      ar: ما أفضل ما تضعه في الجزء ٣/ من السلسلة؟
      en: What's best to put in part 3/ of the thread?
    options:
      - نكتة.
      - صورة قطة.
      - دليل من مصدر رسمي.
    answer: 2
    words: [sumber resmi, utas]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الهاشتاج ده بقى تريند النهارده.
      ar: صار هذا الوسم رائجًا اليوم.
      en: This hashtag is trending today.
    answers:
      - Tagar ini menjadi tren hari ini.
      - Tagar ini sedang tren hari ini.
      - Tagar ini jadi trending hari ini.
      - Hari ini tagar ini menjadi tren.
    words: [tagar]
  - id: e07
    type: speaking
    text: Satu per lima. Ada pesan berantai tentang air laut beracun. Mari kita cek fakta.
    meaning:
      ar_eg: ١ من ٥. فيه رسالة بتتلفّ عن إن مية البحر مسمومة. يلا نتأكّد.
      ar: ١ من ٥. تنتشر رسالة عن مياه بحر مسمومة، فلنتحقّق.
      en: One of five. There's a chain message about poisoned seawater. Let's fact-check.
    words: [cek fakta, utas]
  - id: e08
    type: dictation
    text: Utas yang baik memakai sumber yang kredibel.
    meaning:
      ar_eg: الثريد الكويس بيستعمل مصادر موثوقة.
      ar: تعتمد السلسلة الجيّدة مصادر موثوقة.
      en: A good thread uses credible sources.
    words: [utas, kredibel]
  - id: e09
    type: speaking
    text: Jangan pakai terlalu banyak tagar. Dua atau tiga sudah cukup.
    meaning:
      ar_eg: ماتحطّش هاشتاجات كتير. اتنين أو تلاتة كفاية.
      ar: لا تكثر من الوسوم، فاثنان أو ثلاثة تكفي.
      en: Don't use too many hashtags. Two or three is enough.
    words: [tagar]
  - id: e10
    type: match_pairs
    pairs:
      - text: propaganda
        ar_eg: دعاية
        ar: دعاية
        en: propaganda
      - text: pendengung
        ar_eg: حساب مدفوع بيطبّل (بازر)
        ar: مروّج مأجور (بازر)
        en: paid amplifier, buzzer
      - text: kebocoran data
        ar_eg: تسريب بيانات
        ar: تسرّب البيانات
        en: data leak
      - text: kreator konten
        ar_eg: صانع محتوى
        ar: صانع محتوى
        en: content creator
    words: [propaganda, pendengung, kebocoran data, kreator konten]
dialogue:
  title: Lima bagian, satu kebenaran
  lines:
    - speaker: Kak Selvi
      text: Hoaks air beracun itu udah sampai ke grup ibu-ibu. Yuk, bikin utas.
      ar_eg: إشاعة المية المسمومة وصلت لجروبات الستات. يلا نعمل ثريد.
      ar: بلغت شائعة الماء المسموم مجموعات الأمّهات، فلنكتب سلسلة.
      en: The poisoned-water hoax has reached the mums' groups. Let's write a thread.
    - speaker: Mohamed
      text: Bagian pertama hoaksnya, terus fakta dari sumber resmi. Tagarnya apa?
      ar_eg: أول جزء الإشاعة، وبعدين الحقيقة من المصدر الرسمي. الهاشتاج إيه؟
      ar: الجزء الأوّل الشائعة، ثمّ الحقيقة من المصدر الرسميّ. وما الوسم؟
      en: Part one is the hoax, then the facts from the official source. What's the hashtag?
    - speaker: Kak Selvi
      text: CekFakta dan nama kotanya, Sorong. Pendek aja.
      ar_eg: CekFakta واسم المدينة، سورونج. قصيّر وخلاص.
      ar: CekFakta واسم المدينة سورونغ، باختصار.
      en: CekFakta and the city name, Sorong. Keep it short.
    - speaker: Mohamed
      text: Siap. Bagian terakhir, "Bagikan utas ini, bukan hoaksnya!"
      ar_eg: 'تمام. آخر جزء: «شيّر الثريد ده، مش الإشاعة!»'
      ar: 'حسنًا. والجزء الأخير: «شارك هذه السلسلة لا الشائعة!»'
      en: Got it. The last part, "Share this thread, not the hoax!"
new_words:
  - word: utas
    pos: noun
    ar_eg: ثريد (سلسلة بوستات)
    ar: سلسلة منشورات
    en: thread (of posts)
  - word: tagar
    pos: noun
    ar_eg: هاشتاج
    ar: وسم (هاشتاغ)
    en: hashtag
review:
  status: draft
  verified: false
