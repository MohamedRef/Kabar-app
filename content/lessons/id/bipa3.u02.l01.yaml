dialogue:
  title: Snorkeling di Senggigi
  lines:
    - speaker: Mas Rizal
      text: Selamat datang di Senggigi! Pantainya bersih, ya?
      ar_eg: أهلًا بيك في سنجيجي! الشط نضيف، صح؟
      ar: أهلًا بك في سنغيغي! الشاطئ نظيف، أليس كذلك؟
      en: Welcome to Senggigi! The beach is clean, isn't it?
    - speaker: Mohamed
      text: Ya, bersih sekali. Tidak ada sampah.
      ar_eg: أيوه، نضيف أوي. مفيش زبالة خالص.
      ar: نعم، نظيف جدًا، ولا توجد نفايات.
      en: Yes, very clean. There's no rubbish.
    - speaker: Mas Rizal
      text: Di sana ada terumbu karang. Kadang-kadang ada penyu juga.
      ar_eg: هناك فيه شعاب مرجانية. وساعات بيبقى فيه سلاحف كمان.
      ar: هناك شعاب مرجانية، وأحيانًا توجد سلاحف بحرية أيضًا.
      en: Over there is a coral reef. Sometimes there are turtles too.
    - speaker: Mohamed
      text: Wah, saya ingin melihatnya!
      ar_eg: واو، نفسي أشوفها!
      ar: رائع، أريد أن أراها!
      en: Wow, I want to see them!
    - speaker: Mas Rizal
      text: Boleh, tapi jangan pegang karangnya. Kita harus menjaga alam.
      ar_eg: ماشي، بس ماتلمسش المرجان. لازم نحافظ على الطبيعة.
      ar: حسنًا، لكن لا تلمس المرجان. يجب أن نحافظ على الطبيعة.
      en: Sure, but don't touch the coral. We have to protect nature.
