        ar: نفايات، قمامة
        en: rubbish
      - text: terumbu karang
        ar_eg: شعاب مرجانية
        ar: شعاب مرجانية
        en: coral reef
      - text: penyu
        ar_eg: سلحفاة بحرية
        ar: سلحفاة بحرية
        en: sea turtle
      - text: menjaga
        ar_eg: يحافظ على، يحرس
        ar: يحافظ على
        en: to look after, protect
    words: [alam, lingkungan, sampah, terumbu karang, penyu, menjaga]
  - id: e02
    type: multiple_choice
    question: Penyu itu lucu. Saya ingin ___ lagi.
    options: [melihat-nya, melihatnya, nya melihat]
    answer: 1
    explain:
      ar_eg: -nya بتلزق في الفعل على طول من غير شَرطة.
      ar: تتصل -nya بالفعل مباشرة بلا شرطة.
      en: -nya attaches straight to the verb, with no hyphen.
    words: [penyu]
  - id: e03
    type: listen
    text: Terumbu karangnya indah sekali.
    options: ["Terumbu karang saya indah sekali.", "Terumbu karangnya jauh sekali.", "Terumbu karangnya indah sekali."]
    answer: 2
    meaning:
      ar_eg: الشعاب المرجانية حلوة أوي.
      ar: الشعاب المرجانية جميلة جدًا.
      en: The coral reef is really beautiful.
    words: [terumbu karang]
  - id: e04
    type: multiple_choice
    question: Kita harus menjaga ___ kita. Jangan buang sampah di laut!
    options: [lingkungan, penyu, kain]
    answer: 0
    words: [lingkungan, menjaga, sampah]
