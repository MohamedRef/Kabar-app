schema: kabar.lesson/v1
id: bipa3.u02.l01
language: id
title: -nya di mana-mana
can_do:
  ar_eg: تفهم -nya بمعنى «الـ» أو «بتاعه» أو «ـه» بعد الفعل.
  ar: أن تفهم -nya بمعنى أداة التعريف أو ضمير الغائب المتصل.
  en: Read -nya as 'the', 'his / her / its' and 'it'.
slides:
  - title: -nya = بتاعه / الـ
    grammar: id.clitic.nya
    body:
      ar_eg: |
        انت عارف -nya بمعنى «بتاعه»: tasnya = شنطته. بس ليها شغلانة تانية مهمة أوي: «الـ» للحاجة المعروفة.
        على البحر تقول Pantainya bersih = الشط نضيف (الشط اللي احنا فيه).
        Ni Luh membawa tas. Tasnya dari kain = الشنطة (اللي اتكلمنا عنها) من القماش.
        وعلى فكرة: alam (الطبيعة) جاية من العربي «عالَم».
      ar: |
        تعرف -nya بمعنى ضمير الغائب: tasnya = حقيبته. ولها وظيفة أخرى مهمة: التعريف بالشيء المعلوم.
        على الشاطئ تقول: Pantainya bersih = الشاطئ نظيف (الشاطئ الذي نحن فيه).
        Ni Luh membawa tas. Tasnya dari kain = الحقيبة (المذكورة) من القماش.
        وكلمة alam (الطبيعة) من العربية «عالَم».
      en: |
        You know -nya as "his / her": tasnya = her bag. It has another big job: "the", for something already known.
        At the beach: Pantainya bersih = The beach is clean (the one we're on).
        Ni Luh membawa tas. Tasnya dari kain = She brings a bag. The bag is made of cloth.
        By the way, alam (nature) comes from Arabic «عالَم».
    examples:
      - text: Pantainya bersih sekali.
        ar_eg: الشط نضيف أوي.
        ar: الشاطئ نظيف جدًا.
        en: The beach is really clean.
      - text: Ni Luh membawa tas. Tasnya dari kain.
        ar_eg: ني لوه جايبة شنطة. الشنطة من القماش.
        ar: تحمل ني لوه حقيبة، والحقيبة من القماش.
        en: Ni Luh brings a bag. The bag is made of cloth.
  - title: -nya = ـه (بعد الفعل)
    grammar: id.clitic.nya
    body:
      ar_eg: |
        بعد الفعل أو حرف الجر، -nya = «ـه / ـها» بالظبط زي العربي: شُفته = melihatnya، معاه = dengannya.
        وبتتكتب لازقة، من غير شَرطة: melihatnya مش melihat-nya.
      ar: |
        بعد الفعل أو حرف الجر تكون -nya ضميرًا متصلًا مثل «ـه / ـها» في العربية: رأيتُه = melihatnya، معه = dengannya.
        وتُكتب متصلة بلا شرطة: melihatnya لا melihat-nya.
      en: |
        After a verb or a preposition, -nya = him / her / it, just like the Arabic attached ـه: melihatnya (saw it), dengannya (with him).
        It's written joined, with no hyphen: melihatnya, not melihat-nya.
    examples:
      - text: Penyu itu lucu. Saya ingin melihatnya lagi.
        ar_eg: السلحفاة دي لذيذة. عايز أشوفها تاني.
        ar: تلك السلحفاة لطيفة، أريد أن أراها مرة أخرى.
        en: That turtle is cute. I want to see it again.
      - text: Terumbu karang itu indah. Kita harus menjaganya.
        ar_eg: الشعاب المرجانية دي حلوة. لازم نحافظ عليها.
        ar: تلك الشعاب المرجانية جميلة، ويجب أن نحافظ عليها.
        en: That coral reef is beautiful. We must protect it.
