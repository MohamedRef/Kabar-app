    sentence: Kita harus menjaga ___ dan tidak membuang sampah di pantai.
    meaning:
      ar_eg: لازم نحافظ على الطبيعة ومانرميش زبالة على الشط.
      ar: يجب أن نحافظ على الطبيعة وألّا نرمي النفايات على الشاطئ.
      en: We must protect nature and not throw rubbish on the beach.
    options: [alam, penyu, tas]
