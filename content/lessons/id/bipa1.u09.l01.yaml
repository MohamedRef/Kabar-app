schema: kabar.lesson/v1
id: bipa1.u09.l01
language: id
title: Di, ke, dari
can_do:
  ar_eg: تقول «في» و«لـ» و«من» للأماكن.
  ar: أن تعبّر عن «في» و«إلى» و«من» للأماكن.
  en: Say at / to / from.
slides:
  - title: Di = في
    body:
      ar_eg: |
        di = في / عند، لمكان ثابت: Saya di rumah = أنا في البيت.
        وخلي بالك في الكتابة: di حرف الجر بتتكتب لوحدها: di rumah، di Monas. لو لازقة (dirumah) تبقى غلط.
      ar: |
        di = في / عند، للمكان الثابت: Saya di rumah = أنا في البيت.
        وفي الإملاء تُكتب di الجارة منفصلة: di rumah، di Monas، ولا تُوصل بما بعدها.
      en: |
        di = at / in, for a fixed place: Saya di rumah = I'm at home.
        Spelling: the preposition di is a separate word — di rumah, di Monas — never dirumah.
    grammar: id.preposition.di-ke-dari
    examples:
      - text: Anak-anak bermain di taman.
        ar_eg: العيال بيلعبوا في الجنينة.
        ar: الأطفال يلعبون في الحديقة.
        en: The children are playing in the park.
      - text: Mas Rizal di Monas.
        ar_eg: مَس ريزال عند موناس.
        ar: مَس ريزال عند موناس.
        en: Mas Rizal is at Monas.
  - title: Ke = لـ
    body:
      ar_eg: |
        ke = لـ / على، لما فيه حركة لمكان: Saya pergi ke Monas = أنا رايح موناس.
        والحلو إن الفعل مش لازم: Saya ke Monas = أنا على موناس. زي ما بنقول بالمصري بالظبط!
        pulang ke = يرجع (البيت / البلد): Saya pulang ke rumah.
      ar: |
        ke = إلى، للحركة نحو مكان: Saya pergi ke Monas = أنا ذاهب إلى موناس.
        وقد يُستغنى عن الفعل: Saya ke Monas، كقولنا بالعامية «أنا على موناس».
        وpulang ke = يعود (إلى البيت أو البلد): Saya pulang ke rumah.
      en: |
        ke = to, for movement towards a place: Saya pergi ke Monas = I'm going to Monas.
        The verb can drop: Saya ke Monas — like Egyptian «أنا على موناس».
        pulang ke = go back (home): Saya pulang ke rumah.
    grammar: id.preposition.di-ke-dari
    examples:
      - text: Besok saya ke Bandung.
        ar_eg: بكرة رايح باندونج.
        ar: غدًا أذهب إلى باندونغ.
        en: Tomorrow I'm going to Bandung.
      - text: Rina pulang ke rumah.
        ar_eg: رينا راجعة البيت.
        ar: رينا عائدة إلى البيت.
        en: Rina is going home.
  - title: Dari = من
    body:
      ar_eg: |
        dari = من: Saya dari Mesir = أنا من مصر.
        dari … sampai … = من … لحد …: dari jam delapan sampai jam lima = من ٨ لـ ٥.
        وافتكر الأسئلة: Di mana? (فين؟) — Ke mana? (على فين؟) — Dari mana? (منين؟)
      ar: |
        dari = من: Saya dari Mesir = أنا من مصر.
        dari … sampai … = من … إلى …: dari jam delapan sampai jam lima.
        وتذكّر الأسئلة: Di mana؟ (أين؟) — Ke mana؟ (إلى أين؟) — Dari mana؟ (من أين؟)
      en: |
        dari = from: Saya dari Mesir = I'm from Egypt.
        dari … sampai … = from … until …: dari jam delapan sampai jam lima = from 8 to 5.
        And the questions: Di mana? (where?) — Ke mana? (where to?) — Dari mana? (where from?)
    grammar: id.preposition.di-ke-dari
    examples:
      - text: Kereta dari Bogor sudah datang.
        ar_eg: القطر اللي جاي من بوجور وصل.
        ar: وصل القطار القادم من بوغور.
        en: The train from Bogor has arrived.
      - text: Kamu mau ke mana? — Ke masjid.
        ar_eg: إنت رايح على فين؟ — على الجامع.
        ar: إلى أين تذهب؟ — إلى المسجد.
        en: Where are you going? — To the mosque.
  - title: Masjid = مسجد
    body:
      ar_eg: 'هدية عربية: masjid جاية من «مسجد». وجنب موناس على طول فيه Masjid Istiqlal، أكبر جامع في جنوب شرق آسيا. di ≈ «في»، ke ≈ «لـ»، dari ≈ «من».'
      ar: كلمة masjid من العربية «مسجد». وبجوار موناس يقع Masjid Istiqlal، أكبر مساجد جنوب شرق آسيا. وdi ≈ في، وke ≈ إلى، وdari ≈ من.
      en: masjid comes from Arabic «مسجد». Right next to Monas stands Masjid Istiqlal, the largest mosque in Southeast Asia. di ≈ في, ke ≈ إلى / لـ, dari ≈ من.
    grammar: id.preposition.di-ke-dari
    examples:
      - text: Masjid Istiqlal dekat Monas.
        ar_eg: جامع الاستقلال قريب من موناس.
        ar: مسجد الاستقلال قريب من موناس.
        en: Istiqlal Mosque is near Monas.
exercises:
  - id: e01
    type: multiple_choice
    question: Saya pergi ___ museum.
    options: [dari, di, ke]
    answer: 2
    explain:
      ar_eg: pergi فيه حركة لمكان، يبقى ke.
      ar: pergi فعل حركة، فيأتي بعده ke.
      en: pergi is movement towards a place → ke.
    words: [pergi, ke, museum]
  - id: e02
    type: listen
    text: Halte itu dekat stasiun.
    options: ['Halte itu dekat stasiun.', 'Halte itu dekat museum.', 'Kereta itu dekat stasiun.']
    answer: 0
    meaning:
      ar_eg: المحطة (بتاعة الأتوبيس) دي قريبة من محطة القطر.
      ar: ذلك الموقف قريب من محطة القطار.
      en: That bus stop is near the station.
    words: [halte, dekat, stasiun, museum, kereta]
  - id: e03
    type: fill_blank
    sentence: Kereta ___ Bogor sudah datang.
    meaning:
      ar_eg: القطر اللي جاي من بوجور وصل.
      ar: وصل القطار القادم من بوغور.
      en: The train from Bogor has arrived.
    options: [dari, di, ke]
    answers: [dari]
    words: [dari, kereta]
  - id: e04
    type: fill_blank
    sentence: Museum buka dari jam delapan ___ jam empat.
    meaning:
      ar_eg: المتحف بيفتح من الساعة ٨ لحد الساعة ٤.
      ar: يفتح المتحف من الثامنة حتى الرابعة.
      en: The museum is open from eight until four.
    options: [dari, sampai, ke]
    answers: [sampai]
    explain:
      ar_eg: dari … sampai … = من … لحد ….
      ar: dari … sampai … = من … إلى ….
      en: dari … sampai … = from … until ….
    words: [sampai, museum]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا رايح محطة الأتوبيس اللي جنب محطة جامبير.
      ar: أنا ذاهب إلى الموقف قرب محطة غامبير.
      en: I'm going to the bus stop near Gambir Station.
    answer: Saya pergi ke halte dekat Stasiun Gambir.
    distractors: [di, dari]
    words: [pergi, ke, halte, dekat, stasiun]
  - id: e06
    type: dictation
    text: Halte itu dekat sekali.
    meaning:
      ar_eg: المحطة دي قريبة أوي.
      ar: ذلك الموقف قريب جدًا.
      en: That stop is very close.
    words: [halte, dekat]
  - id: e07
    type: speaking
    text: Museum itu dekat stasiun kereta.
    meaning:
      ar_eg: المتحف ده قريب من محطة القطر.
      ar: ذلك المتحف قريب من محطة القطار.
      en: That museum is near the train station.
    words: [museum, dekat, stasiun, kereta]
dialogue:
  title: Di halte dekat Monas
  lines:
    - speaker: Mas Rizal
      text: Mohamed, kamu dari mana?
      ar_eg: يا محمد، إنت جاي منين؟
      ar: يا محمد، من أين أتيت؟
      en: Mohamed, where are you coming from?
    - speaker: Mohamed
      text: Dari Stasiun Gambir, Mas. Mas Rizal dari mana?
      ar_eg: من محطة جامبير يا ريزال. وإنت جاي منين؟
      ar: من محطة غامبير. ومن أين أتيت أنت؟
      en: From Gambir Station. Where are you coming from, Mas Rizal?
    - speaker: Mas Rizal
      text: Aku dari Masjid Istiqlal. Sekarang kamu mau ke mana?
      ar_eg: من جامع الاستقلال. عايز تروح فين دلوقتي؟
      ar: من مسجد الاستقلال. إلى أين تريد أن تذهب الآن؟
      en: From Istiqlal Mosque. Where do you want to go now?
    - speaker: Mohamed
      text: Aku mau ke Monas. Sesudah itu, aku pulang ke rumah.
      ar_eg: عايز أروح موناس. وبعد كده أروّح البيت.
      ar: أريد الذهاب إلى موناس، وبعد ذلك أعود إلى البيت.
      en: I want to go to Monas. After that, I'm going home.
    - speaker: Mas Rizal
      text: Bagus! Monas dekat dari sini.
      ar_eg: حلو! موناس قريب من هنا.
      ar: جميل! موناس قريب من هنا.
      en: Great! Monas is close to here.
