  - word: museum
    pos: noun
    ar_eg: متحف
    ar: متحف
    en: museum
  - word: kereta
    pos: noun
    ar_eg: قطر
    ar: قطار
    en: train
  - word: dekat
    pos: adjective
    ar_eg: قريب
    ar: قريب
