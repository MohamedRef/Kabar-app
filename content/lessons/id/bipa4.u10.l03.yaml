dialogue:
  title: Bandara Sam Ratulangi
  lines:
    - speaker: Mohamed
      text: Mas, siapa Sam Ratulangi? Namanya ada di bandara Manado.
      ar_eg: يا رزال، مين سام راتولانجي؟ اسمه على مطار مانادو.
      ar: يا رزال، من سام راتولانغي؟ اسمه على مطار مانادو.
      en: Rizal, who was Sam Ratulangi? His name is on Manado's airport.
    - speaker: Mas Rizal
      text: Beliau Pahlawan Nasional dari Minahasa, lahir di Tondano pada tahun 1890.
      ar_eg: ده بطل قومي من الميناهاسا، اتولد في توندانو سنة 1890.
      ar: إنه بطل وطني من المِيناهاسا، وُلد في توندانو عام 1890.
      en: He was a National Hero from Minahasa, born in Tondano in 1890.
    - speaker: Mohamed
      text: Apa yang beliau lakukan?
      ar_eg: عمل إيه؟
      ar: وماذا فعل؟
      en: What did he do?
    - speaker: Mas Rizal
      text: Beliau menjabat sebagai gubernur pertama Sulawesi. Semboyannya, Si tou timou tumou tou, artinya manusia hidup untuk memanusiakan manusia.
      ar_eg: كان أول محافظ لسولاويزي. وشعاره «سي تو تيمو تومو تو» معناه إن الإنسان عايش عشان يخلّي غيره إنسان.
      ar: تولّى منصب أول حاكم لسولاويسي، وشعاره «سي تو تيمو تومو تو» يعني أن الإنسان يحيا ليجعل الآخرين بشرًا كرامًا.
      en: He served as Sulawesi's first governor. His motto, Si tou timou tumou tou, means people live to help others live as full human beings.
