    question_meaning:
      ar_eg: أنهي فعل هو «اتوفّى» باحترام لشخصية وطنية؟
      ar: أيّ فعل يعني «تُوفّي» باحترام لشخصية وطنية؟
      en: Which verb is the respectful "passed away" for a national figure?
    options: [mati, wafat, hilang]
    answer: 1
    explain:
      ar_eg: wafat من «وفاة» وفيها احترام. mati للحيوانات والنباتات.
      ar: wafat من «وفاة» وفيها احترام، أما mati فللحيوان والنبات.
      en: wafat (from «وفاة») is respectful; mati is for animals and plants.
