language: id
title: Riwayat hidup
can_do:
  ar_eg: تحكي سيرة حياة شخصية وطنية (اتولد، اشتغل منصب، اتوفّى).
  ar: أن تروي سيرة حياة شخصية وطنية (الميلاد، المنصب، الوفاة).
  en: Recount a national figure's life (birth, office, death).
slides:
  - title: Riwayat hidup Sam Ratulangi
    body:
      ar_eg: |
        riwayat hidup = سيرة الحياة، وriwayat جاية من العربي «رواية».
        السيرة بتمشي بالترتيب: lahir pada … ← menjabat sebagai … (كان في منصب) ← wafat pada … ← dimakamkan di … (اتدفن في).
        وللشخصيات المحترمة بنقول beliau بدل dia.
      ar: |
        riwayat hidup = سيرة الحياة، وriwayat من العربية «رواية».
        تسير السيرة بالترتيب: lahir pada … ← menjabat sebagai … (تولّى منصب) ← wafat pada … ← dimakamkan di … (دُفن في).
        وللشخصيات المحترمة نقول beliau بدل dia.
      en: |
        riwayat hidup = life story, biography; riwayat comes from Arabic «رواية».
        A biography runs in order: lahir pada … → menjabat sebagai … (held the office of) → wafat pada … → dimakamkan di … (was buried in).
        For respected people say beliau instead of dia.
    examples:
      - text: Sam Ratulangi lahir di Tondano pada tahun 1890.
        ar_eg: سام راتولانجي اتولد في توندانو سنة 1890.
        ar: وُلد سام راتولانغي في توندانو عام 1890.
        en: Sam Ratulangi was born in Tondano in 1890.
      - text: Beliau menjabat sebagai Gubernur Sulawesi yang pertama.
        ar_eg: كان أول محافظ لسولاويزي.
        ar: تولّى منصب أول حاكم لسولاويسي.
        en: He served as the first Governor of Sulawesi.
  - title: Wafat, gelar, dan ungkapan
    body:
      ar_eg: |
        wafat (من العربي «وفاة») = اتوفّى، بنقولها باحترام بدل meninggal. ومتقولش mati على إنسان، دي للحيوانات.
        gelar = لقب / شهادة: gelar doktor، gelar Pahlawan Nasional. وdimakamkan من makam (قبر)، من العربي «مقام».
        والسيرة بتحب التعبيرات: Beliau rendah hati dan membanting tulang untuk rakyat.
      ar: |
        wafat (من العربية «وفاة») = تُوفّي، تُقال احترامًا بدل meninggal. ولا تقل mati عن إنسان، فهي للحيوان.
        gelar = لقب أو درجة علمية: gelar doktor، gelar Pahlawan Nasional. وdimakamkan من makam (قبر)، من العربية «مقام».
        وتحب السيرة التعابير الاصطلاحية: Beliau rendah hati dan membanting tulang untuk rakyat.
      en: |
        wafat (from Arabic «وفاة») = passed away, the respectful word instead of meninggal. Never say mati of a person; it's for animals.
        gelar = title, degree: gelar doktor, gelar Pahlawan Nasional. dimakamkan comes from makam (grave), from Arabic «مقام».
        Biographies love idioms: Beliau rendah hati dan membanting tulang untuk rakyat.
    grammar: id.idiom.basic
    examples:
      - text: Pada tahun 1919, beliau mendapat gelar doktor di Swiss.
        ar_eg: سنة 1919 أخد الدكتوراه في سويسرا.
        ar: نال درجة الدكتوراه في سويسرا عام 1919.
        en: In 1919 he earned a doctorate in Switzerland.
      - text: Beliau wafat pada tahun 1949 dan dimakamkan di Tondano.
        ar_eg: اتوفّى سنة 1949 واتدفن في توندانو.
        ar: تُوفّي عام 1949 ودُفن في توندانو.
        en: He passed away in 1949 and was buried in Tondano.
