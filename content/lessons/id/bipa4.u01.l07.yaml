    text: Nurul ikut audisi untuk film baru.
    question:
      ar_eg: نورول عملت إيه؟
      ar: ماذا فعلت نورول؟
      en: What did Nurul do?
    options: [أوديشن, تصوير, تدريب]
    answer: 0
    meaning:
      ar_eg: نورول دخلت أوديشن لفيلم جديد.
      ar: شاركت نورول في اختبار أداء لفيلم جديد.
      en: Nurul took part in an audition for a new film.
    words: [audisi]
  - id: e04
    type: fill_blank
    sentence: Bahasa Indonesianya sudah ___. Dia bisa jadi penerjemah.
    meaning:
      ar_eg: الإندونيسي بتاعه بقى ___. يقدر يبقى مترجم.
      ar: صارت إندونيسيّته ___. يمكنه أن يصبح مترجمًا.
      en: His Indonesian is already ___. He can be a translator.
    options: [mahir, pemula, kru]
    answers: [mahir]
    words: [mahir, pemula, kru]
  - id: e05
    type: multiple_choice
    question: Pak Ilham ___ anak-anak bermain sepak bola setiap Sabtu.
    options: [melatih, syuting, audisi]
    answer: 0
    explain:
      ar_eg: melatih = يدرّب فريق أو حد.
      ar: melatih = يدرّب فريقًا أو شخصًا.
      en: melatih = to coach, train.
    words: [melatih, syuting, audisi]
  - id: e06
    type: fill_blank
    sentence: Syuting hari ini di dalam ___, bukan di pantai.
    meaning:
      ar_eg: تصوير النهارده جوه ___، مش على البحر.
      ar: تصوير اليوم داخل ___، لا على الشاطئ.
      en: Today's shoot is inside the ___, not on the beach.
    options: [studio, skenario, audisi]
    answers: [studio]
    words: [studio, skenario, audisi]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: الكلام المكتوب اللي الممثلين بيحفظوه. ده إيه؟
      ar: النص المكتوب الذي يحفظه الممثلون. ما هو؟
      en: The written lines the actors learn. What is it?
    options: [studio, skenario, kru]
    answer: 1
    explain:
      ar_eg: skenario = سيناريو.
      ar: skenario = سيناريو، نصّ الفيلم.
      en: skenario = script.
    words: [studio, skenario, kru]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الطاقم بيستنى الممثلة في موقع التصوير.
      ar: ينتظر الطاقم الممثلة في موقع التصوير.
      en: The crew is waiting for the actress at the shoot.
    answer: Kru menunggu aktris di lokasi syuting.
    distractors: [audisi, pemula]
    words: [kru, aktris, syuting, audisi, pemula]
  - id: e09
    type: translate
    direction: from_target
    source_text: Pelatih itu suka melatih pemula.
    answers_meaning:
      ar_eg: [المدرب ده بيحب يدرّب المبتدئين, المدرب ده بيحب تدريب الناس الجديدة]
      ar: [يحبّ ذلك المدرّب تدريب المبتدئين, ذلك المدرّب يحبّ أن يدرّب المبتدئين]
      en: [That coach likes training beginners, The coach enjoys training beginners]
    words: [melatih, pemula]
  - id: e10
    type: speaking
    text: Aktor itu mahir, tapi kokinya masih pemula.
    meaning:
      ar_eg: الممثل ده شاطر، بس الطباخ لسه مبتدئ.
      ar: ذلك الممثل ماهر، لكن الطاهي ما زال مبتدئًا.
      en: That actor is skilled, but the cook is still a beginner.
    words: [aktor, mahir, koki, syuting, melatih]
dialogue:
  lines:
    - speaker: Andi
      text: Mohamed, ada syuting film di Pantai Losari besok!
      ar_eg: يا محمد، فيه تصوير فيلم في شاطئ لوساري بكرة!
      ar: يا محمد، هناك تصوير فيلم على شاطئ لوساري غدًا!
      en: Mohamed, there's a film shoot at Losari Beach tomorrow!
    - speaker: Mohamed
      text: Wah! Aktor dan aktrisnya terkenal?
      ar_eg: الله! الممثلين مشهورين؟
      ar: رائع! هل الممثلون مشهورون؟
      en: Wow! Are the actors famous?
    - speaker: Andi
      text: Aktrisnya pemula, tapi krunya berpengalaman. Sepupuku kokinya.
      ar_eg: الممثلة مبتدئة، بس الطاقم عنده خبرة. وابن عمي هو الطباخ.
      ar: الممثلة مبتدئة، لكن الطاقم ذو خبرة. وابن عمي هو الطاهي.
      en: The actress is a beginner, but the crew is experienced. My cousin is the cook.
    - speaker: Mohamed
      text: Mereka perlu penerjemah bahasa Arab nggak?
      ar_eg: محتاجين مترجم عربي؟
      ar: هل يحتاجون مترجمًا للعربية؟
      en: Do they need an Arabic translator?
    - speaker: Andi
      text: Bisa jadi! Bahasa Indonesiamu udah mahir. Ikut audisi aja!
      ar_eg: يمكن! الإندونيسي بتاعك بقى شاطر. ادخل الأوديشن!
      ar: ربما! إندونيسيّتك صارت متمكّنة. شارك في اختبار الأداء!
      en: Maybe! Your Indonesian is good now. Just go to the audition!
