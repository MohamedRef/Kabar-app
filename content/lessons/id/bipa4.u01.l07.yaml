schema: kabar.lesson/v1
id: bipa4.u01.l07
language: id
title: Profil pembuat pinisi
can_do:
  ar_eg: تفهم بروفايل قصير في الراديو عن صانع مراكب وتحكي عن شغله.
  ar: أن تفهم تعريفًا إذاعيًا قصيرًا بصانع سفن وتتحدث عن عمله.
  en: Follow a short radio profile of a boat builder and talk about his work.
slides:
  - title: Profil di Kabar Radio
    body:
      ar_eg: |
        Mas Ardi في Kabar Radio بيقدّم بروفايل Daeng Basri، صانع مراكب البينيسي.
        اسمع الجمل الأول، وبعدين اقراها هنا.
      ar: |
        يقدّم Mas Ardi في Kabar Radio تعريفًا بـ Daeng Basri، صانع سفن البينيسي.
        استمع إلى الجمل أولًا، ثم اقرأها هنا.
      en: |
        On Kabar Radio, Mas Ardi presents a profile of Daeng Basri, a pinisi boat builder.
        Listen to the sentences first, then read them here.
    examples:
      - text: Daeng Basri dulu pelaut. Sekarang beliau tukang kayu yang ahli membuat kapal pinisi.
        ar_eg: Daeng Basri كان بحّار زمان. دلوقتي هو نجّار شاطر في صناعة مراكب البينيسي.
        ar: كان Daeng Basri بحّارًا في الماضي، وهو اليوم نجّار ماهر في صنع سفن البينيسي.
        en: Daeng Basri used to be a sailor. Now he is a carpenter who is expert at building pinisi boats.
      - text: Tempat kerjanya terletak di Bulukumba, dekat pantai. Satu kapal pinisi terbuat dari kayu dan dibuat selama berbulan-bulan.
        ar_eg: مكان شغله في بولوكومبا، جنب البحر. مركب البينيسي الواحد معمول من خشب وبياخد شهور عشان يتعمل.
        ar: يقع مكان عمله في بولوكومبا قرب الشاطئ. سفينة البينيسي الواحدة مصنوعة من الخشب ويستغرق صنعها شهورًا.
        en: His workplace is in Bulukumba, near the beach. One pinisi is made of wood and takes months to build.
      - text: Menurut Daeng Basri, profesi ini membutuhkan keahlian, kesabaran, dan tanggung jawab, karena keselamatan pelaut sangat penting.
        ar_eg: Daeng Basri بيقول إن المهنة دي محتاجة مهارة وصبر ومسؤولية، عشان سلامة البحّارة مهمة جدًا.
        ar: يرى Daeng Basri أن هذه المهنة تحتاج إلى المهارة والصبر والمسؤولية، لأن سلامة البحّارة مهمة جدًا.
        en: According to Daeng Basri, this profession needs skill, patience and responsibility, because sailors' safety is very important.
exercises:
  - id: e01
    type: listen
    text: Satu kapal pinisi terbuat dari kayu dan dibuat selama berbulan-bulan.
    question:
      ar_eg: مركب البينيسي الواحد بياخد قد إيه عشان يتعمل؟
      ar: كم يستغرق صنع سفينة بينيسي واحدة؟
      en: How long does it take to build one pinisi?
    options: [Beberapa hari, Berbulan-bulan, Satu minggu]
    answer: 1
    meaning:
      ar_eg: مركب البينيسي الواحد معمول من خشب وبياخد شهور عشان يتعمل.
      ar: سفينة البينيسي الواحدة مصنوعة من الخشب ويستغرق صنعها شهورًا.
      en: One pinisi is made of wood and takes months to build.
    words: [terbuat dari]
  - id: e02
    type: listen
    text: Tempat kerjanya terletak di Bulukumba, dekat pantai.
    question:
      ar_eg: مكان شغل Daeng Basri فين؟
      ar: أين يقع مكان عمل Daeng Basri؟
      en: Where is Daeng Basri's workplace?
    options: [Di pusat Kota Makassar, Di Pulau Samalona, "Di Bulukumba, dekat pantai"]
    answer: 2
    meaning:
      ar_eg: مكان شغله في بولوكومبا، جنب البحر.
      ar: يقع مكان عمله في بولوكومبا قرب الشاطئ.
      en: His workplace is in Bulukumba, near the beach.
    words: [terletak]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: Daeng Basri كان بيشتغل إيه زمان؟
      ar: ماذا كان يعمل Daeng Basri في الماضي؟
      en: What was Daeng Basri's job before?
    options: [Pelaut, Perawat, Tukang kayu]
    answer: 0
    explain:
      ar_eg: «dulu pelaut» = كان بحّار زمان. دلوقتي (sekarang) هو tukang kayu.
      ar: «dulu pelaut» أي كان بحّارًا. أما الآن (sekarang) فهو tukang kayu.
      en: “dulu pelaut” = he used to be a sailor. Now (sekarang) he is a tukang kayu.
    words: [pelaut, tukang kayu]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: ليه المهنة دي محتاجة مسؤولية، على حسب كلام Daeng Basri؟
      ar: لماذا تحتاج هذه المهنة إلى المسؤولية بحسب Daeng Basri؟
      en: According to Daeng Basri, why does this job need responsibility?
    options:
      - Karena kapal pinisi sangat mahal.
      - Karena keselamatan pelaut sangat penting.
      - Karena dia sering lembur.
    answer: 1
    words: [keselamatan, tanggung jawab]
  - id: e05
    type: match_pairs
    pairs:
      - text: pelaut
        ar_eg: بحّار
        ar: بحّار
        en: sailor
      - text: tukang kayu
        ar_eg: نجّار
        ar: نجّار
        en: carpenter
      - text: terbuat dari
        ar_eg: معمول من
        ar: مصنوع من
        en: made of
      - text: keahlian
        ar_eg: مهارة / خبرة
        ar: مهارة / خبرة
        en: expertise, skill
      - text: keselamatan
        ar_eg: سلامة
        ar: سلامة
        en: safety
    words: [pelaut, tukang kayu, terbuat dari, keahlian, keselamatan]
  - id: e06
    type: dictation
    text: Kapal pinisi terbuat dari kayu.
    meaning:
      ar_eg: مركب البينيسي معمول من خشب.
      ar: سفينة البينيسي مصنوعة من الخشب.
      en: The pinisi is made of wood.
    words: [terbuat dari]
  - id: e07
    type: fill_blank
    sentence: Profesi ini membutuhkan ___, karena satu kapal dibuat selama berbulan-bulan.
    meaning:
      ar_eg: المهنة دي محتاجة صبر، عشان المركب الواحد بياخد شهور.
      ar: هذه المهنة تحتاج إلى الصبر، لأن السفينة الواحدة تستغرق شهورًا.
      en: This profession needs patience, because one boat takes months to build.
    options: [kehujanan, kesabaran, kesiangan]
    answers: [kesabaran]
    words: [kesabaran]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مكان شغل Daeng Basri قريب من البحر.
      ar: يقع مكان عمل Daeng Basri قرب الشاطئ.
      en: Daeng Basri's workplace is located near the beach.
    answers:
      - Tempat kerja Daeng Basri terletak dekat pantai.
      - Tempat kerja Daeng Basri terletak di dekat pantai.
      - Tempat kerja Daeng Basri terletak dekat laut.
      - Tempat kerja Daeng Basri terletak di dekat laut.
    words: [terletak]
  - id: e09
    type: speaking
    text: Keselamatan pelaut adalah tanggung jawab pembuat kapal.
    meaning:
      ar_eg: سلامة البحّارة مسؤولية اللي بيصنع المركب.
      ar: سلامة البحّارة مسؤولية صانع السفينة.
      en: Sailors' safety is the boat builder's responsibility.
    words: [keselamatan, tanggung jawab]
dialogue:
  title: Setelah siaran radio
  lines:
    - speaker: Mas Rizal
      text: Tadi kamu dengar profil Daeng Basri di Kabar Radio?
      ar_eg: سمعت بروفايل Daeng Basri في Kabar Radio من شوية؟
      ar: هل سمعت التعريف بـ Daeng Basri في Kabar Radio قبل قليل؟
      en: Did you hear the profile of Daeng Basri on Kabar Radio just now?
    - speaker: Mohamed
      text: Dengar! Ternyata satu kapal dibuat selama berbulan-bulan.
      ar_eg: سمعته! طلع المركب الواحد بياخد شهور.
      ar: سمعته! تبيّن أن صنع السفينة الواحدة يستغرق شهورًا.
      en: I did! It turns out one boat takes months to build.
    - speaker: Mas Rizal
      text: Ya. Makanya beliau bilang profesi itu membutuhkan kesabaran.
      ar_eg: أيوه. عشان كده قال إن المهنة دي محتاجة صبر.
      ar: نعم، لذلك قال إن تلك المهنة تحتاج إلى الصبر.
      en: Yes. That's why he said the job needs patience.
    - speaker: Mohamed
      text: Saya ingin melihat tempat kerjanya di Bulukumba.
      ar_eg: نفسي أشوف مكان شغله في بولوكومبا.
      ar: أودّ أن أرى مكان عمله في بولوكومبا.
      en: I'd like to see his workplace in Bulukumba.
    - speaker: Mas Rizal
      text: Boleh, tapi jangan hari Minggu. Tempatnya tertutup untuk tamu.
      ar_eg: ماشي، بس مش يوم الحد. المكان بيبقى مقفول للزوار.
      ar: حسنًا، لكن ليس يوم الأحد، فالمكان مغلق أمام الزوار.
      en: Sure, but not on a Sunday. The place is closed to visitors.
