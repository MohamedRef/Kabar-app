schema: kabar.lesson/v1
id: bipa4.u01.l07
language: id
title: Syuting di Losari
can_do:
  ar_eg: توصف خبرة حد، مبتدئ ولا شاطر، وتتكلم عن شغل التصوير.
  ar: أن تصف خبرة شخص، مبتدئ أم ماهر، وتتحدث عن العمل في تصوير فيلم.
  en: Describe someone's experience, beginner or skilled, and talk about a film shoot.
slides:
  - title: Di lokasi syuting
    body:
      ar_eg: |
        syuting = تصوير فيلم أو مسلسل، audisi = تجربة أداء (أوديشن)، kru = طاقم (kru film، kru kapal).
        skenario = سيناريو (النص اللي الممثلين بيحفظوه)، studio = ستوديو.
        pemula = مبتدئ، mahir = شاطر ومتمكّن، melatih = يدرّب.
      ar: |
        syuting = تصوير فيلم أو مسلسل، audisi = اختبار أداء، kru = طاقم (kru film، kru kapal).
        skenario = سيناريو، نصّ الفيلم، studio = استوديو.
        pemula = مبتدئ، mahir = ماهر متمكّن، melatih = يدرّب.
      en: |
        syuting = filming, a shoot; audisi = audition; kru = crew (kru film, kru kapal).
        skenario = script, screenplay; studio = studio.
        pemula = beginner, mahir = skilled, fluent; melatih = to train, coach.
    examples:
      - text: Aktrisnya masih pemula, tapi belajar cepat.
        ar_eg: الممثلة لسه مبتدئة، بس بتتعلم بسرعة.
        ar: ما زالت الممثلة مبتدئة، لكنها تتعلّم بسرعة.
        en: The actress is still a beginner, but she learns fast.
      - text: Koki itu memasak untuk semua kru.
        ar_eg: الطباخ ده بيطبخ لكل الطاقم.
        ar: ذلك الطاهي يطبخ لكل الطاقم.
        en: That cook cooks for the whole crew.
      - text: Syuting dimulai jam enam pagi.
        ar_eg: التصوير بيبدأ الساعة ستة الصبح.
        ar: يبدأ التصوير في السادسة صباحًا.
        en: The shoot starts at six in the morning.
