schema: kabar.lesson/v1
id: bipa1.u02.l01
language: id
title: Nama saya…
can_do:
  ar_eg: تقول اسمك وتسأل عن اسم حد.
  ar: أن تذكر اسمك وتسأل غيرك عن اسمه.
  en: Say your name and ask someone's.
slides:
  - title: Nama saya Mohamed
    body:
      ar_eg: |
        «Nama saya Mohamed» = «اسمي محمد». حرفيًا «اسم أنا محمد»: الحاجة الأول وبعدين صاحبها، زي «اسم الواد».
        ومافيش «يكون» خالص، الجملة الاسمية زي العربي بالظبط: «Saya Mohamed» = «أنا محمد».
      ar: |
        «Nama saya Mohamed» = «اسمي محمد»، وحرفيًا «اسمُ أنا محمد»: المضاف أولًا ثم المضاف إليه كما في العربية.
        ولا فعل كينونة في الجملة، فهي جملة اسمية كالعربية تمامًا: «Saya Mohamed» = «أنا محمد».
      en: |
        "Nama saya Mohamed" = "My name is Mohamed", literally "name I Mohamed": the thing first, then the owner, as in Arabic «اسم الولد».
        There's no "is": a plain nominal sentence, exactly like Arabic «أنا محمد».
    grammar: id.sentence.no-copula
    examples:
      - text: Nama saya Mohamed.
        ar_eg: اسمي محمد.
        ar: اسمي محمد.
        en: My name is Mohamed.
  - title: Siapa nama Anda?
    body:
      ar_eg: |
        siapa = «مين». والاسم بيتسأل عنه بـ siapa مش apa: «Siapa nama Anda?» = «اسم حضرتك إيه؟» (حرفيًا «مين اسمك؟»).
        مع الصحاب: «Nama kamu siapa?». والترتيبين صح: «Siapa dia?» و«Dia siapa?» زي «مين ده؟» و«ده مين؟».
      ar: |
        siapa = «مَن». ويُسأل عن الاسم بـ siapa لا apa: «Siapa nama Anda?» = «ما اسمك؟» (حرفيًا «مَن اسمك؟»).
        ومع الأصدقاء: «Nama kamu siapa?». ويصح الترتيبان: «Siapa dia?» و«Dia siapa?».
      en: |
        siapa = "who". Names are asked with siapa, not apa: "Siapa nama Anda?" = "What is your name?" (literally "who is your name?").
        With friends: "Nama kamu siapa?". Both orders work: "Siapa dia?" and "Dia siapa?" — like Egyptian «مين ده؟» / «ده مين؟».
    grammar: id.question.siapa
    examples:
      - text: Siapa nama Anda?
        ar_eg: اسم حضرتك إيه؟
        ar: ما اسمك؟
        en: What is your name?
      - text: Nama kamu siapa?
        ar_eg: اسمك إيه؟
        ar: ما اسمك؟
        en: What's your name? (casual)
  - title: Saya mahasiswa
    body:
      ar_eg: |
        الشغلانة كمان من غير «يكون»: «Saya mahasiswa» = «أنا طالب (جامعة)». ومافيش «a» ولا مذكر ومؤنث.
        - mahasiswa: طالب جامعة
        - guru: مدرّس
        - dokter: دكتور
        - karyawan: موظف
      ar: |
        والمهنة كذلك بلا فعل كينونة: «Saya mahasiswa» = «أنا طالب جامعي»، ولا أداة تنكير ولا تذكير وتأنيث.
        - mahasiswa: طالب جامعي
        - guru: معلّم
        - dokter: طبيب
        - karyawan: موظف
      en: |
        Jobs work the same way: "Saya mahasiswa" = "I'm a (university) student" — no "is", no "a", no gender.
        - mahasiswa: university student
        - guru: teacher
        - dokter: doctor
        - karyawan: employee
    grammar: id.sentence.no-copula
    examples:
      - text: Pak Irwan guru.
        ar_eg: الأستاذ إروان مدرّس.
        ar: الأستاذ إروان معلّم.
        en: Pak Irwan is a teacher.
      - text: Rina mahasiswa, Raka karyawan.
        ar_eg: رينا طالبة، وراكا موظف.
        ar: رينا طالبة جامعية، وراكا موظف.
        en: Rina is a student; Raka is an employee.
  - title: Adalah — untuk definisi
    body:
      ar_eg: |
        هتشوف كلمة adalah في الكتب والأخبار، زي «هي» في «القاهرة هي العاصمة». بتيجي قبل اسم بس، عمرها ما تيجي قبل صفة.
        صح: «Dia baik.» — غلط: «Dia adalah baik.»
      ar: |
        سترى adalah في الكتب والأخبار، وهي تشبه ضمير الفصل في «القاهرةُ هي العاصمة». تأتي قبل الاسم فقط، ولا تأتي قبل الصفة.
        صواب: «Dia baik.» — خطأ: «Dia adalah baik.»
      en: |
        You'll see adalah in books and the news, like «هي» in «القاهرة هي العاصمة». It goes only before a noun, never before an adjective.
        Right: "Dia baik." — Wrong: "Dia adalah baik."
    grammar: id.sentence.no-copula
    examples:
      - text: Jakarta adalah ibu kota Indonesia.
        ar_eg: جاكرتا هي عاصمة إندونيسيا.
        ar: جاكرتا هي عاصمة إندونيسيا.
        en: Jakarta is the capital of Indonesia.
exercises:
