schema: kabar.lesson/v1
id: bipa1.u02.l01
language: id
title: Nama saya…
can_do:
  ar_eg: تقول اسمك وتسأل عن اسم حد.
  ar: أن تذكر اسمك وتسأل غيرك عن اسمه.
  en: Say your name and ask someone's.
slides:
  - title: Nama saya Mohamed
    body:
      ar_eg: |
        «Nama saya Mohamed» = «اسمي محمد». حرفيًا «اسم أنا محمد»: الحاجة الأول وبعدين صاحبها، زي «اسم الواد».
        ومافيش «يكون» خالص، الجملة الاسمية زي العربي بالظبط: «Saya Mohamed» = «أنا محمد».
      ar: |
        «Nama saya Mohamed» = «اسمي محمد»، وحرفيًا «اسمُ أنا محمد»: المضاف أولًا ثم المضاف إليه كما في العربية.
        ولا فعل كينونة في الجملة، فهي جملة اسمية كالعربية تمامًا: «Saya Mohamed» = «أنا محمد».
      en: |
        "Nama saya Mohamed" = "My name is Mohamed", literally "name I Mohamed": the thing first, then the owner, as in Arabic «اسم الولد».
        There's no "is": a plain nominal sentence, exactly like Arabic «أنا محمد».
    grammar: id.sentence.no-copula
    examples:
      - text: Nama saya Mohamed.
        ar_eg: اسمي محمد.
        ar: اسمي محمد.
        en: My name is Mohamed.
      - text: Saya Rina.
        ar_eg: أنا رينا.
        ar: أنا رينا.
        en: I'm Rina.
  - title: Siapa nama Anda?
    body:
      ar_eg: |
        siapa = «مين». والاسم بيتسأل عنه بـ siapa مش apa: «Siapa nama Anda?» = «اسم حضرتك إيه؟» (حرفيًا «مين اسمك؟»).
        مع الصحاب: «Nama kamu siapa?». والترتيبين صح: «Siapa dia?» و«Dia siapa?» زي «مين ده؟» و«ده مين؟».
      ar: |
        siapa = «مَن». ويُسأل عن الاسم بـ siapa لا apa: «Siapa nama Anda?» = «ما اسمك؟» (حرفيًا «مَن اسمك؟»).
        ومع الأصدقاء: «Nama kamu siapa?». ويصح الترتيبان: «Siapa dia?» و«Dia siapa?».
      en: |
        siapa = "who". Names are asked with siapa, not apa: "Siapa nama Anda?" = "What is your name?" (literally "who is your name?").
        With friends: "Nama kamu siapa?". Both orders work: "Siapa dia?" and "Dia siapa?" — like Egyptian «مين ده؟» / «ده مين؟».
    grammar: id.question.siapa
    examples:
      - text: Siapa nama Anda?
        ar_eg: اسم حضرتك إيه؟
        ar: ما اسمك؟
        en: What is your name?
      - text: Nama kamu siapa?
        ar_eg: اسمك إيه؟
        ar: ما اسمك؟
        en: What's your name? (casual)
      - text: Dia siapa? — Dia Dimas.
        ar_eg: ده مين؟ — ده ديماس.
        ar: مَن هذا؟ — هذا ديماس.
        en: Who is he? — He's Dimas.
  - title: Saya mahasiswa
    body:
      ar_eg: |
        الشغلانة كمان من غير «يكون»: «Saya mahasiswa» = «أنا طالب (جامعة)». ومافيش «a» ولا مذكر ومؤنث.
        - mahasiswa: طالب جامعة
        - guru: مدرّس
        - dokter: دكتور
        - karyawan: موظف
      ar: |
        والمهنة كذلك بلا فعل كينونة: «Saya mahasiswa» = «أنا طالب جامعي»، ولا أداة تنكير ولا تذكير وتأنيث.
        - mahasiswa: طالب جامعي
        - guru: معلّم
        - dokter: طبيب
        - karyawan: موظف
      en: |
        Jobs work the same way: "Saya mahasiswa" = "I'm a (university) student" — no "is", no "a", no gender.
        - mahasiswa: university student
        - guru: teacher
        - dokter: doctor
        - karyawan: employee
    grammar: id.sentence.no-copula
    examples:
      - text: Pak Budi guru.
        ar_eg: الأستاذ بودي مدرّس.
        ar: الأستاذ بودي معلّم.
        en: Pak Budi is a teacher.
      - text: Rina mahasiswa, Dimas karyawan.
        ar_eg: رينا طالبة، وديماس موظف.
        ar: رينا طالبة جامعية، وديماس موظف.
        en: Rina is a student; Dimas is an employee.
  - title: Adalah — untuk definisi
    body:
      ar_eg: |
        هتشوف كلمة adalah في الكتب والأخبار، زي «هي» في «القاهرة هي العاصمة». بتيجي قبل اسم بس، عمرها ما تيجي قبل صفة.
        صح: «Dia baik.» — غلط: «Dia adalah baik.»
      ar: |
        سترى adalah في الكتب والأخبار، وهي تشبه ضمير الفصل في «القاهرةُ هي العاصمة». تأتي قبل الاسم فقط، ولا تأتي قبل الصفة.
        صواب: «Dia baik.» — خطأ: «Dia adalah baik.»
      en: |
        You'll see adalah in books and the news, like «هي» in «القاهرة هي العاصمة». It goes only before a noun, never before an adjective.
        Right: "Dia baik." — Wrong: "Dia adalah baik."
    grammar: id.sentence.no-copula
    examples:
      - text: Jakarta adalah ibu kota Indonesia.
        ar_eg: جاكرتا هي عاصمة إندونيسيا.
        ar: جاكرتا هي عاصمة إندونيسيا.
        en: Jakarta is the capital of Indonesia.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nama
        ar_eg: اسم
        ar: اسم
        en: name
      - text: siapa
        ar_eg: مين
        ar: مَن
        en: who
      - text: mahasiswa
        ar_eg: طالب جامعة
        ar: طالب جامعي
        en: university student
      - text: guru
        ar_eg: مدرّس
        ar: معلّم
        en: teacher
      - text: dokter
        ar_eg: دكتور
        ar: طبيب
        en: doctor
    words: [nama, siapa, mahasiswa, guru, dokter]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تسأل حد غريب عن اسمه بالإندونيسي الصح المؤدب؟
      ar: كيف تسأل غريبًا عن اسمه بإندونيسية سليمة مهذبة؟
      en: How do you ask a stranger's name in polite, standard Indonesian?
    options: ["Nama saya siapa?", "Siapa nama Anda?", "Apa nama Anda?"]
    answer: 1
    explain:
      ar_eg: الاسم بيتسأل عنه بـ siapa. «Apa nama» بتتسمع في الشارع بس مش الصح. و«Nama saya siapa?» يعني «اسمي إيه؟».
      ar: يُسأل عن الاسم بـ siapa، و«Apa nama» عامية، و«Nama saya siapa?» معناها «ما اسمي؟».
      en: Names are asked with siapa; "Apa nama" is colloquial, and "Nama saya siapa?" means "What's my name?".
    words: [siapa, nama]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح ومعناها «هي كويسة / طيبة»؟
      ar: أيّ جملة صحيحة بمعنى «هي طيبة»؟
      en: Which sentence correctly means "She is nice"?
    options: ["Dia adalah baik.", "Dia baik.", "Adalah dia baik."]
    answer: 1
    explain:
      ar_eg: مافيش «يكون»، وadalah عمرها ما تيجي قبل صفة.
      ar: لا فعل كينونة، وadalah لا تأتي قبل الصفة.
      en: No "is" is needed, and adalah never comes before an adjective.
    words: [adalah, baik]
  - id: e04
    type: listen
    text: Siapa nama Anda?
    options: ["Apa kabar, Bu?", "Siapa nama Anda?", "Nama saya Rina."]
    answer: 1
    words: [siapa, nama]
  - id: e05
    type: fill_blank
    sentence: ___ nama Anda, Pak?
    meaning:
      ar_eg: اسم حضرتك إيه يا أستاذ؟
      ar: ما اسمك يا سيدي؟
      en: What is your name, sir?
    options: ["Dia", "Dan", "Siapa"]
    answers: [Siapa]
    words: [siapa]
  - id: e06
    type: fill_blank
    sentence: Selamat siang. Nama ___ Mohamed.
    meaning:
      ar_eg: نهارك سعيد. اسمي محمد.
      ar: طاب نهارك. اسمي محمد.
      en: Good afternoon. My name is Mohamed.
    answers: [saya]
    explain:
      ar_eg: «اسمي» = nama saya — الاسم الأول وبعدين صاحبه.
      ar: «اسمي» = nama saya — المضاف ثم المضاف إليه.
      en: '"My name" = nama saya: the thing first, then the owner.'
    words: [nama, saya]
  - id: e07
    type: build_sentence
    source:
      ar_eg: اسمي رينا. أنا طالبة جامعة.
      ar: اسمي رينا. أنا طالبة جامعية.
      en: My name is Rina. I'm a university student.
    answer: Nama saya Rina. Saya mahasiswa.
    distractors: [dia, apa]
    words: [nama, mahasiswa]
  - id: e08
    type: build_sentence
    source:
      ar_eg: لا مؤاخذة، ده مين؟
      ar: عفوًا، مَن هذا؟
      en: Excuse me, who is he?
    answer: Maaf, dia siapa?
    alternatives: ["Maaf, siapa dia?"]
    distractors: [apa, kamu]
    explain:
      ar_eg: الترتيبين صح، زي «ده مين؟» و«مين ده؟».
      ar: يصح الترتيبان، كقولنا «مَن هذا؟» و«هذا مَن؟».
      en: Both orders work, like «ده مين؟» and «مين ده؟».
    words: [siapa, dia]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الأستاذ بودي مدرّس.
      ar: الأستاذ بودي معلّم.
      en: Pak Budi is a teacher.
    answers: ["Pak Budi guru.", "Pak Budi guru", "Pak Budi adalah guru.", "Pak Budi adalah guru", "Pak Budi seorang guru.", "Pak Budi adalah seorang guru."]
    explain:
      ar_eg: مش محتاج «يكون». adalah صح برضه بس رسمي شوية.
      ar: لا حاجة إلى فعل كينونة، وadalah صحيحة لكنها أكثر رسمية.
      en: No "is" needed; adalah is also correct but more formal.
    words: [guru]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـDimas) اسمك إيه؟
      ar: (لـDimas) ما اسمك؟
      en: (to Dimas) What's your name?
    answers: ["Nama kamu siapa?", "Nama kamu siapa", "Siapa nama kamu?", "Siapa nama kamu", "Namamu siapa?", "Siapa namamu?"]
    words: [nama, siapa, kamu]
  - id: e11
    type: translate
    direction: from_target
    source_text: Jakarta adalah ibu kota Indonesia.
    answers_meaning:
      ar_eg: ["جاكرتا هي عاصمة إندونيسيا.", "جاكرتا عاصمة إندونيسيا"]
      ar: ["جاكرتا هي عاصمة إندونيسيا.", "جاكرتا عاصمة إندونيسيا"]
      en: ["Jakarta is the capital of Indonesia.", "Jakarta is Indonesia's capital"]
    words: [adalah, ibu kota]
  - id: e12
    type: dictation
    text: Nama saya Mohamed.
    meaning:
      ar_eg: اسمي محمد.
      ar: اسمي محمد.
      en: My name is Mohamed.
    words: [nama, saya]
  - id: e13
    type: speaking
    text: Selamat pagi. Nama saya Mohamed. Saya mahasiswa.
    meaning:
      ar_eg: صباح الخير. اسمي محمد. أنا طالب.
      ar: صباح الخير. اسمي محمد. أنا طالب جامعي.
      en: Good morning. My name is Mohamed. I'm a student.
    words: [nama, mahasiswa]
dialogue:
  title: Pagi di Menteng
  lines:
    - speaker: Bu Dewi
      text: Selamat pagi. Siapa nama Anda?
      ar_eg: صباح الخير. اسم حضرتك إيه؟
      ar: صباح الخير. ما اسمك؟
      en: Good morning. What is your name?
    - speaker: Mohamed
      text: Selamat pagi, Bu. Nama saya Mohamed.
      ar_eg: صباح الخير يا مدام. اسمي محمد.
      ar: صباح الخير يا سيدتي. اسمي محمد.
      en: Good morning, ma'am. My name is Mohamed.
    - speaker: Bu Dewi
      text: Salam kenal, Mohamed. Saya Dewi. Saya guru.
      ar_eg: اتشرفنا يا محمد. أنا ديوي. أنا مدرّسة.
      ar: تشرّفنا يا محمد. أنا ديوي. أنا معلّمة.
      en: Nice to meet you, Mohamed. I'm Dewi. I'm a teacher.
    - speaker: Mohamed
      text: Salam kenal, Bu. Saya mahasiswa.
      ar_eg: اتشرفنا يا مدام. أنا طالب.
      ar: تشرّفنا يا سيدتي. أنا طالب جامعي.
      en: Nice to meet you, ma'am. I'm a student.
    - speaker: Bu Dewi
      text: Dia siapa?
      ar_eg: ودي مين؟
      ar: ومَن هذه؟
      en: Who is she?
    - speaker: Mohamed
      text: Dia Rina. Rina juga mahasiswa.
      ar_eg: دي رينا. رينا كمان طالبة.
      ar: هذه رينا. رينا أيضًا طالبة جامعية.
      en: She's Rina. Rina is a student too.
