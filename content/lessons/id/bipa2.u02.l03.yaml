dialogue:
  title: Hari kerja Ni Luh
  lines:
    - speaker: Mohamed
      text: Ni Luh, kamu bekerja di mana?
      ar_eg: يا ني لوه، إنتي بتشتغلي فين؟
      ar: يا ني لوه، أين تعملين؟
      en: Ni Luh, where do you work?
    - speaker: Ni Luh
      text: Di hotel di Denpasar. Saya masuk kerja jam tujuh pagi.
      ar_eg: في فندق في دنباسار. ببدأ الشغل الساعة سبعة الصبح.
      ar: في فندق في دنباسار، وأبدأ العمل في السابعة صباحًا.
      en: At a hotel in Denpasar. I start work at seven in the morning.
    - speaker: Mohamed
      text: Pagi sekali! Setelah itu?
      ar_eg: بدري أوي! وبعد كده؟
      ar: مبكر جدًا! وبعد ذلك؟
      en: That's early! And after that?
    - speaker: Ni Luh
      text: Pertama saya membaca email, lalu rapat dengan rekan kerja.
      ar_eg: الأول بقرا الإيميلات، وبعدين اجتماع مع زمايلي.
      ar: أولًا أقرأ البريد، ثم أجتمع مع زملائي.
      en: First I read my emails, then a meeting with my colleagues.
    - speaker: Mohamed
      text: Kamu pulang jam berapa?
      ar_eg: بتروّحي الساعة كام؟
      ar: متى تعودين إلى البيت؟
      en: What time do you go home?
    - speaker: Ni Luh
      text: Biasanya jam empat. Tapi hari ini saya lembur, jadi saya lelah sekali.
      ar_eg: عادةً الساعة أربعة. بس النهارده قعدت أوفر تايم، فأنا تعبانة أوي.
      ar: عادةً في الرابعة، لكنني عملت ساعات إضافية اليوم، لذا أنا متعبة جدًا.
      en: Usually at four. But I worked overtime today, so I'm really tired.
