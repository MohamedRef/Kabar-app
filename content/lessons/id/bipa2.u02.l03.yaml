        ar: اجتماع
        en: meeting
      - text: istirahat
        ar_eg: بريك، راحة
        ar: استراحة
        en: break, rest
      - text: lembur
        ar_eg: أوفر تايم
        ar: عمل إضافي
        en: overtime
      - text: rekan kerja
        ar_eg: زميل في الشغل
        ar: زميل عمل
        en: colleague
    words: [kantor, rapat, istirahat, lembur, rekan kerja]
  - id: e02
    type: listen
    text: Saya masuk kerja jam delapan pagi.
    options: ["Saya pulang kerja jam delapan malam.", "Saya masuk kerja jam sembilan pagi.", "Saya masuk kerja jam delapan pagi."]
    answer: 2
    words: [masuk kerja]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الساعة ٥ والشغل خلص. إنت بتعمل إيه؟
      ar: الساعة الخامسة وانتهى العمل. ماذا تفعل؟
      en: It's 5 p.m. and work is over. What are you doing?
    options: ["Saya pulang kerja.", "Saya rapat.", "Saya masuk kerja."]
    answer: 0
    words: [pulang kerja]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: قعدت في الشغل لحد الساعة ١٠ بالليل. أنهي كلمة؟
      ar: بقيت في العمل حتى العاشرة ليلًا. أيّ كلمة تناسب؟
      en: You stayed at work until 10 p.m. Which word fits?
    options: ["lembur", "istirahat", "libur"]
    answer: 0
    explain:
      ar_eg: lembur = شغل زيادة بعد المواعيد. libur = أجازة.
      ar: lembur = عمل إضافي بعد الدوام، وlibur = عطلة.
      en: lembur = overtime; libur = day off.
    words: [lembur, libur]
  - id: e05
    type: fill_blank
    sentence: Jam dua belas saya ___ makan siang.
    meaning:
      ar_eg: الساعة ١٢ باخد بريك الغدا.
      ar: في الثانية عشرة آخذ استراحة الغداء.
      en: At twelve I take my lunch break.
    options: ["lembur", "rapat", "istirahat"]
    answers: [istirahat]
    words: [istirahat]
  - id: e06
    type: fill_blank
    sentence: Hari ini saya lembur, jadi saya ___.
    meaning:
      ar_eg: النهارده قعدت أوفر تايم، فأنا تعبان.
      ar: عملت ساعات إضافية اليوم، لذا أنا متعب.
      en: I worked overtime today, so I'm tired.
    options: ["lelah", "senang", "libur"]
    answers: [lelah]
    words: [lelah, lembur]
  - id: e07
    type: build_sentence
    source:
      ar_eg: مكتبي جنب السوق.
      ar: مكتبي قريب من السوق.
      en: My office is near the market.
    answer: Kantor saya dekat pasar.
    distractors: [jauh, rapat]
    words: [kantor, dekat]
  - id: e08
    type: build_sentence
