schema: kabar.lesson/v1
id: bipa2.u02.l03
language: id
title: Kantor saya
can_do:
  ar_eg: توصف يوم شغلك من أوله لآخره.
  ar: أن تصف يوم عملك.
  en: Describe your work day.
slides:
  - title: Di mana Anda bekerja?
    body:
      ar_eg: |
        أماكن الشغل: kantor (مكتب / شركة)، hotel، rumah sakit (مستشفى)، sekolah، toko، pasar.
        Saya bekerja di … = بشتغل في …
        وزميلك في الشغل = rekan kerja.
      ar: |
        أماكن العمل: kantor (مكتب)، hotel (فندق)، rumah sakit (مستشفى)، sekolah، toko، pasar.
        Saya bekerja di … = أعمل في …
        وزميل العمل = rekan kerja.
      en: |
        Workplaces: kantor (office), hotel, rumah sakit (hospital), sekolah, toko, pasar.
        Saya bekerja di … = I work at …
        A colleague = rekan kerja.
    examples:
      - text: Ni Luh bekerja di hotel di Denpasar.
        ar_eg: ني لوه بتشتغل في فندق في دنباسار.
        ar: تعمل ني لوه في فندق في دنباسار.
        en: Ni Luh works at a hotel in Denpasar.
      - text: Kantor saya dekat pasar.
        ar_eg: مكتبي جنب السوق.
        ar: مكتبي قريب من السوق.
        en: My office is near the market.
  - title: Masuk, rapat, istirahat, pulang
    body:
      ar_eg: |
        يوم الشغل بالترتيب:
        - masuk kerja = بتبدأ الشغل
        - rapat = اجتماع
        - mengirim email = تبعت إيميلات
        - istirahat = بريك / راحة (istirahat makan siang = بريك الغدا)
        - pulang kerja = تروّح من الشغل
        - lembur = تقعد ساعات زيادة (أوفر تايم)
      ar: |
        يوم العمل بالترتيب:
        - masuk kerja = بدء العمل
        - rapat = اجتماع
        - mengirim email = إرسال الرسائل الإلكترونية
        - istirahat = استراحة (istirahat makan siang = استراحة الغداء)
        - pulang kerja = العودة من العمل
        - lembur = العمل ساعات إضافية
      en: |
        A work day in order:
        - masuk kerja = start work
        - rapat = meeting
        - mengirim email = send emails
        - istirahat = break (istirahat makan siang = lunch break)
        - pulang kerja = go home from work
        - lembur = work overtime
    examples:
      - text: Saya masuk kerja jam delapan pagi.
        ar_eg: ببدأ الشغل الساعة تمانية الصبح.
        ar: أبدأ العمل في الثامنة صباحًا.
        en: I start work at eight in the morning.
      - text: Jam sepuluh ada rapat.
        ar_eg: الساعة عشرة فيه اجتماع.
        ar: في العاشرة يوجد اجتماع.
        en: There's a meeting at ten.
  - title: Lalu, setelah itu
    body:
      ar_eg: |
        اربط اليوم بكلمات الترتيب اللي عارفها: pertama (الأول)، lalu (بعدين)، setelah itu (بعد كده)، akhirnya (في الآخر).
        Pertama saya membaca email. Lalu saya rapat. Setelah itu saya istirahat makan siang.
      ar: |
        اربط مراحل اليوم بكلمات الترتيب التي تعرفها: pertama (أولًا)، lalu (ثم)، setelah itu (بعد ذلك)، akhirnya (أخيرًا).
      en: |
        Link the day with the sequence words you know: pertama (first), lalu (then), setelah itu (after that), akhirnya (finally).
        Pertama saya membaca email. Lalu saya rapat. Setelah itu saya istirahat makan siang.
    examples:
      - text: Setelah rapat, saya istirahat makan siang.
        ar_eg: بعد الاجتماع باخد بريك الغدا.
        ar: بعد الاجتماع آخذ استراحة الغداء.
        en: After the meeting I take my lunch break.
  - title: Sibuk dan lelah
    body:
      ar_eg: |
        إزاي كان يومك؟
        - sibuk = مشغول، lelah = تعبان (capek في الكلام العادي)
        - Hari ini saya lembur, jadi saya lelah. = النهارده قعدت أوفر تايم، فأنا تعبان.
        - Besok saya libur! = بكرة أجازة!
      ar: |
        كيف كان يومك؟
        - sibuk = مشغول، lelah = متعب (وعاميًّا capek)
        - Hari ini saya lembur, jadi saya lelah.
        - Besok saya libur! = غدًا عطلتي!
      en: |
        How was your day?
        - sibuk = busy, lelah = tired (casual: capek)
        - Hari ini saya lembur, jadi saya lelah. = I worked late today, so I'm tired.
        - Besok saya libur! = Tomorrow's my day off!
    examples:
      - text: Hari ini saya sibuk sekali.
        ar_eg: النهارده أنا مشغول جدًا.
        ar: اليوم أنا مشغول جدًا.
        en: I'm really busy today.
exercises:
