schema: kabar.lesson/v1
id: bipa2.u02.l03
language: id
title: Mengapa? Karena…
can_do:
  ar_eg: تسأل «ليه؟» وترد بـ «عشان…».
  ar: أن تسأل عن السبب وتجيب عنه.
  en: Ask for and give reasons.
slides:
  - title: Mengapa dan kenapa
    body:
      ar_eg: |
        «ليه؟» ليها شكلين:
        - mengapa: رسمية، في الكتابة والمقابلات والأخبار.
        - kenapa: اللي بتسمعها في الشارع ومع الصحاب.
        بتيجي في أول الجملة: Mengapa Anda belajar bahasa Indonesia?
      ar: |
        لـ «لماذا» صيغتان:
        - mengapa: فصيحة، للكتابة والمقابلات والأخبار.
        - kenapa: للكلام اليومي.
        وتأتي في أول الجملة: Mengapa Anda belajar bahasa Indonesia؟
      en: |
        "Why" comes in two flavours:
        - mengapa: formal — writing, interviews, the news.
        - kenapa: everyday speech.
        It opens the sentence: Mengapa Anda belajar bahasa Indonesia?
    grammar: id.question.mengapa
    examples:
      - text: Mengapa Anda memilih pekerjaan ini?
        ar_eg: حضرتك اخترت الشغلانة دي ليه؟
        ar: لماذا اخترت هذا العمل؟
        en: Why did you choose this job?
      - text: Kenapa kamu terlambat?
        ar_eg: اتأخرت ليه؟
        ar: لماذا تأخرت؟
        en: Why are you late?
  - title: Karena, sebab = عشان، لأن
    body:
      ar_eg: |
        الرد: karena أو sebab = عشان / لأن.
        sebab جاية من العربي «سبب» — سهلة تفتكرها!
        وفي الكلام مع الصحاب بيقولوا soalnya = أصل / عشان.
      ar: |
        الجواب: karena أو sebab = لأن.
        وsebab مأخوذة من العربية «سبب».
        وفي العامية يقال soalnya = إذ إن.
      en: |
        The answer: karena or sebab = because.
        sebab comes from Arabic «سبب» (reason) — easy to remember!
        Among friends you'll hear soalnya = 'cause.
    grammar: id.question.mengapa
    examples:
      - text: Saya belajar bahasa Indonesia karena saya suka Bali.
        ar_eg: بتعلم إندونيسي عشان بحب بالي.
        ar: أتعلم الإندونيسية لأنني أحب بالي.
        en: I'm learning Indonesian because I love Bali.
      - text: Nggak bisa, soalnya sibuk.
        ar_eg: مش هقدر، أصلي مشغول.
        ar: لا أستطيع، فأنا مشغول.
        en: Can't, 'cause I'm busy.
  - title: Karena …, …
    body:
      ar_eg: |
        ممكن تبدأ بالسبب وبعدين فاصلة:
        Karena hujan, kami di rumah. = عشان كانت بتمطر، قعدنا في البيت.
        بس في الكتابة متكتبش «Karena hujan.» لوحدها جملة كاملة.
      ar: |
        ويجوز تقديم السبب ثم الفاصلة:
        Karena hujan, kami di rumah.
        ولا تُكتب «Karena hujan.» جملةً تامة وحدها.
      en: |
        The reason can come first, followed by a comma:
        Karena hujan, kami di rumah. = Because it rained, we stayed home.
        In writing, "Karena hujan." alone isn't a full sentence.
    grammar: id.question.mengapa
    examples:
      - text: Karena hujan, kami di rumah saja.
        ar_eg: عشان كانت بتمطر، قعدنا في البيت.
        ar: بسبب المطر بقينا في البيت.
        en: Because it rained, we just stayed home.
  - title: Kamu kenapa?
    body:
      ar_eg: |
        kenapa في آخر الجملة ليها معنى تاني لطيف:
        Kamu kenapa? = مالك؟ (حرفيًا: إنت ليه؟)
        بتسألها لما حد شكله تعبان أو زعلان.
      ar: |
        وإذا جاءت kenapa في آخر الجملة فلها معنى آخر:
        Kamu kenapa؟ = ما بك؟
        وتُقال لمن يبدو متعبًا أو حزينًا.
      en: |
        kenapa at the end has a special meaning:
        Kamu kenapa? = What's wrong? (literally "you why?")
        Ask it when someone looks tired or upset.
    grammar: id.question.mengapa
    examples:
      - text: Kamu kenapa? Sakit?
        ar_eg: مالك؟ تعبان؟
        ar: ما بك؟ هل أنت مريض؟
        en: What's wrong? Are you ill?
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: إنت في مقابلة شغل رسمية. المدير بيسألك «ليه اخترت الشغلانة دي؟». أنهي جملة سمعتها؟
      ar: أنت في مقابلة عمل رسمية، وسألك المدير لماذا اخترت هذا العمل. أيّ جملة سمعت؟
      en: In a formal job interview the manager asks why you chose this job. Which sentence did you hear?
    options: ['Mengapa Anda memilih pekerjaan ini?', 'Kapan Anda memilih pekerjaan ini?', 'Kamu kenapa?']
    answer: 0
    words: [mengapa, memilih, pekerjaan]
  - id: e02
    type: listen
    text: Saya belajar bahasa Indonesia karena saya suka Bali.
    options: [Saya belajar bahasa Indonesia karena saya suka Bali., Saya belajar bahasa Indonesia karena saya tinggal di Bali., 'Saya belajar bahasa Indonesia, tapi saya suka Bali.']
    answer: 0
    words: [karena]
  - id: e03
    type: fill_blank
    sentence: Saya tidak datang ___ saya sakit.
    meaning:
      ar_eg: مجيتش عشان كنت عيان.
      ar: لم آتِ لأنني كنت مريضًا.
      en: I didn't come because I was ill.
    options: [mengapa, tetapi, karena]
    answers: [karena]
    words: [karena]
  - id: e04
    type: build_sentence
    source:
      ar_eg: ليه بتتعلم إندونيسي؟
      ar: لماذا تتعلم الإندونيسية؟
      en: Why are you learning Indonesian?
    answer: Kenapa kamu belajar bahasa Indonesia?
    alternatives: []
    distractors: [karena, kapan]
    words: [kenapa, belajar]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عشان بحب أقابل ناس جديدة.
      ar: لأنني أحب لقاء أناس جدد.
      en: Because I like meeting new people.
    answers: [Karena saya suka bertemu orang baru., Karena saya suka bertemu orang baru, Karena aku suka bertemu orang baru., Sebab saya suka bertemu orang baru., Karena saya senang bertemu orang baru., Soalnya saya suka bertemu orang baru., Karena saya suka bertemu dengan orang baru.]
    words: [karena, bertemu]
  - id: e06
    type: speaking
    text: Saya belajar bahasa Indonesia karena saya suka Bali.
    meaning:
      ar_eg: بتعلم إندونيسي عشان بحب بالي.
      ar: أتعلم الإندونيسية لأنني أحب بالي.
      en: I'm learning Indonesian because I love Bali.
    words: [karena]
dialogue:
  title: Kenapa bahasa Indonesia?
  lines:
    - speaker: Ni Luh
      text: Mohamed, kenapa kamu belajar bahasa Indonesia?
      ar_eg: يا محمد، إنت بتتعلم إندونيسي ليه؟
      ar: يا محمد، لماذا تتعلم الإندونيسية؟
      en: Mohamed, why are you learning Indonesian?
    - speaker: Mohamed
      text: Karena banyak teman saya orang Indonesia.
      ar_eg: عشان صحاب كتير ليا إندونيسيين.
      ar: لأن كثيرًا من أصدقائي إندونيسيون.
      en: Because a lot of my friends are Indonesian.
    - speaker: Ni Luh
      text: Oh ya? Kenal di mana?
      ar_eg: بجد؟ اتعرفت عليهم فين؟
      ar: حقًا؟ أين تعرّفت إليهم؟
      en: Really? Where did you meet them?
    - speaker: Mohamed
      text: Di Kairo. Mereka mahasiswa Al-Azhar.
      ar_eg: في القاهرة. هم طلبة في الأزهر.
      ar: في القاهرة؛ فهم طلاب في الأزهر.
      en: In Cairo. They're students at Al-Azhar.
    - speaker: Ni Luh
      text: Kamu kenapa? Capek?
      ar_eg: مالك؟ تعبان؟
      ar: ما بك؟ هل أنت متعب؟
      en: What's wrong? Tired?
    - speaker: Mohamed
      text: Ya, sedikit. Soalnya saya jalan kaki dari pasar.
      ar_eg: أيوه، شوية. أصلي جيت ماشي من السوق.
      ar: نعم، قليلًا؛ فقد جئت ماشيًا من السوق.
      en: Yes, a bit. 'Cause I walked from the market.
