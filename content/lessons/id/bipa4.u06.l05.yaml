schema: kabar.lesson/v1
id: bipa4.u06.l05
language: id
title: Eksposisi pariwisata
can_do:
  ar_eg: "تكتب مقال قصير (إكسبوزيسي) عن السياحة: رأي، حجج، وخلاصة."
  ar: أن تكتب نصًا عرضيًا قصيرًا عن السياحة يتضمن رأيًا وحججًا وخلاصة.
  en: Write a short exposition on tourism with a thesis, arguments and a conclusion.
slides:
  - title: Tesis, argumen, penegasan
    body:
      ar_eg: |
        المقال الإكسبوزيسي ليه 3 أجزاء:
        1) الرأي (tesis): Saya berpendapat bahwa … = رأيي إن …
        2) الحجج: Pertama, … Kedua, … Selain itu, … (واستعمل الكلمات اللي بتيجي مع بعض: meningkatkan pendapatan، membuka lapangan kerja).
        3) التأكيد في الآخر: Dengan demikian, … = وبكده / وعليه، …
      ar: |
        للنص العرضي ثلاثة أجزاء:
        1) الرأي (tesis): Saya berpendapat bahwa … = أرى أنّ …
        2) الحجج: Pertama, … Kedua, … Selain itu, … مع المتلازمات مثل meningkatkan pendapatan وmembuka lapangan kerja.
        3) إعادة التأكيد: Dengan demikian, … = وبذلك / وعليه، …
      en: |
        An exposition has three parts:
        1) Thesis: Saya berpendapat bahwa … = I believe that …
        2) Arguments: Pertama, … Kedua, … Selain itu, … using collocations like meningkatkan pendapatan, membuka lapangan kerja.
        3) Restating: Dengan demikian, … = Thus, …
    grammar: id.collocation
    examples:
      - text: Saya berpendapat bahwa pariwisata penting bagi Palu.
        ar_eg: رأيي إن السياحة مهمة لبالو.
        ar: أرى أنّ السياحة مهمة لبالو.
        en: I believe that tourism is important for Palu.
      - text: Dengan demikian, pariwisata harus dikembangkan secara berkelanjutan.
        ar_eg: وبكده، لازم السياحة تتطوّر بشكل مستدام.
        ar: وبذلك، يجب أن تُطوَّر السياحة تطويرًا مستدامًا.
        en: Thus, tourism must be developed sustainably.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة تنفع تكون أول جملة (الرأي) في المقال؟
      ar: أيّ جملة تصلح أن تكون الجملة الأولى (الرأي) في النص؟
      en: Which sentence works as the opening thesis of the essay?
    options: ["Dengan demikian, pariwisata penting bagi Palu.", "Saya berpendapat bahwa pariwisata penting bagi Palu.", "Kedua, hotel di Palu banyak."]
    answer: 1
    explain:
      ar_eg: Dengan demikian للخلاصة في الآخر، وKedua للحجة التانية. الرأي بيبدأ بـ Saya berpendapat bahwa.
      ar: Dengan demikian للخلاصة، وKedua للحجة الثانية، أما الرأي فيبدأ بـ Saya berpendapat bahwa.
      en: Dengan demikian closes the essay and Kedua opens the second argument; the thesis starts with Saya berpendapat bahwa.
    words: [berpendapat, dengan demikian]
  - id: e02
    type: listen
    text: Sektor pariwisata membuka lapangan kerja bagi anak muda.
    options: ["Sektor pariwisata membuka lapangan kerja bagi warga desa.", "Sektor pertanian membuka lapangan kerja bagi anak muda.", "Sektor pariwisata membuka lapangan kerja bagi anak muda."]
    answer: 2
    meaning:
      ar_eg: قطاع السياحة بيوفّر فرص شغل للشباب.
      ar: يوفّر قطاع السياحة فرص عمل للشباب.
      en: The tourism sector creates jobs for young people.
    words: [sektor, lapangan kerja]
  - id: e03
    type: match_pairs
    pairs:
      - text: meningkatkan pendapatan
        ar_eg: يزوّد الدخل
        ar: يزيد الدخل
        en: increase income
      - text: melestarikan budaya
        ar_eg: يحافظ على الثقافة
        ar: يحافظ على الثقافة
        en: preserve culture
      - text: memecahkan masalah
        ar_eg: يحل مشكلة
        ar: يحل مشكلة
        en: solve a problem
      - text: menghadapi tantangan
        ar_eg: يواجه تحديات
        ar: يواجه التحديات
        en: face challenges
      - text: dengan demikian
        ar_eg: وبكده / وعليه
        ar: وبذلك، وعليه
        en: thus
    words: [meningkatkan, melestarikan, memecahkan, menghadapi, dengan demikian]
  - id: e04
    type: fill_blank
    sentence: ___, pariwisata harus dikembangkan secara berkelanjutan.
    meaning:
      ar_eg: وبكده، لازم السياحة تتطوّر بشكل مستدام.
      ar: وبذلك، يجب أن تُطوَّر السياحة تطويرًا مستدامًا.
      en: Thus, tourism must be developed sustainably.
    options: [Pertama, Dengan demikian, Selain itu]
    answers: [Dengan demikian]
    words: [dengan demikian, berkelanjutan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: رأيي إن قطاع السياحة مهم جدًا لبالو.
      ar: أرى أنّ قطاع السياحة مهم جدًا لبالو.
      en: I believe that the tourism sector is very important for Palu.
    answer: Saya berpendapat bahwa sektor pariwisata sangat penting bagi Palu.
    distractors: [demikian, dampak]
    words: [berpendapat, sektor]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: وبكده، السياحة لازم تحافظ على الثقافة المحلية.
      ar: وبذلك، يجب أن تحافظ السياحة على الثقافة المحلية.
      en: Thus, tourism must preserve the local culture.
    answers:
      - Dengan demikian, pariwisata harus melestarikan budaya lokal.
      - Dengan demikian, pariwisata harus melestarikan budaya lokal
      - Dengan demikian pariwisata harus melestarikan budaya lokal.
      - Dengan demikian, pariwisata harus melestarikan budaya setempat.
      - Dengan demikian, pariwisata perlu melestarikan budaya lokal.
    words: [dengan demikian, melestarikan]
  - id: e07
    type: dictation
    text: Sektor pariwisata dapat meningkatkan pendapatan warga.
    meaning:
      ar_eg: قطاع السياحة ممكن يزوّد دخل السكان.
      ar: يمكن لقطاع السياحة أن يزيد دخل السكان.
      en: The tourism sector can increase residents' income.
    words: [sektor, meningkatkan, pendapatan]
  - id: e08
    type: speaking
    text: Saya berpendapat bahwa festival budaya berdampak positif bagi Palu.
    meaning:
      ar_eg: رأيي إن المهرجانات الثقافية ليها أثر إيجابي على بالو.
      ar: أرى أنّ المهرجانات الثقافية لها أثر إيجابي على بالو.
      en: I believe that cultural festivals have a positive impact on Palu.
    words: [berpendapat, dampak]
dialogue:
  title: Lomba blog wisata
  lines:
    - speaker: Mohamed
      text: Mas, saya menulis eksposisi untuk lomba blog wisata Palu.
      ar_eg: يا رزال، أنا بكتب مقال إكسبوزيسي لمسابقة مدونات السياحة في بالو.
      ar: يا رزال، أكتب نصًا عرضيًا لمسابقة مدونات السياحة في بالو.
      en: Rizal, I'm writing an exposition for the Palu travel blog contest.
    - speaker: Mas Rizal
      text: Bagus! Apa tesismu?
      ar_eg: حلو! إيه رأيك الأساسي؟
      ar: رائع! ما أطروحتك؟
      en: Great! What's your thesis?
    - speaker: Mohamed
      text: Saya berpendapat bahwa sektor pariwisata membuka lapangan kerja dan melestarikan budaya.
      ar_eg: رأيي إن قطاع السياحة بيوفّر فرص شغل وبيحافظ على الثقافة.
      ar: أرى أنّ قطاع السياحة يوفّر فرص العمل ويحافظ على الثقافة.
      en: I believe the tourism sector creates jobs and preserves culture.
    - speaker: Mas Rizal
      text: Lalu, bagaimana kalimat penutupnya?
      ar_eg: وبعدين، الجملة الأخيرة إيه؟
      ar: ثم ما جملة الختام؟
      en: And what's your closing sentence?
    - speaker: Mohamed
      text: Dengan demikian, Palu harus mengembangkan pariwisata berkelanjutan.
      ar_eg: وبكده، بالو لازم تطوّر سياحة مستدامة.
      ar: وبذلك، يجب أن تطوّر بالو سياحة مستدامة.
      en: Thus, Palu must develop sustainable tourism.
