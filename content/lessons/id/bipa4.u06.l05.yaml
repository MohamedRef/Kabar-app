schema: kabar.lesson/v1
id: bipa4.u06.l05
language: id
title: Paket tur ke Toraja
can_do:
  ar_eg: 'تسأل عن رحلة سياحية منظّمة: السعر والخصم والأماكن والراحة.'
  ar: 'أن تسأل عن رحلة سياحية منظّمة: السعر والخصم والأماكن ومستوى الراحة.'
  en: 'Ask about a package tour: price, discount, places and comfort.'
slides:
  - title: Di agen perjalanan
    body:
      ar_eg: |
        tur = جولة سياحية، رحلة منظمة، bonus = حاجة زيادة ببلاش، بونص، seharga = بسعر (tiket seharga 500 ribu).
        bepergian = يسافر ويتنقّل، berkunjung = يزور (berkunjung ke)، berkeliling = يلف في المكان.
        perlengkapan = الحاجات والمعدّات (perlengkapan mendaki)، kenyamanan = الراحة.
      ar: |
        tur = جولة سياحية، bonus = إضافة مجانية، مكافأة، seharga = بسعر (tiket seharga 500 ribu).
        bepergian = يسافر ويتنقّل، berkunjung = يزور (berkunjung ke)، berkeliling = يتجوّل.
        perlengkapan = المعدّات واللوازم (perlengkapan mendaki)، kenyamanan = الراحة.
      en: |
        tur = tour, bonus = bonus, free extra, seharga = priced at (tiket seharga 500 ribu).
        bepergian = to travel, go places; berkunjung = to visit (berkunjung ke); berkeliling = to go around, tour.
        perlengkapan = equipment, gear (perlengkapan mendaki); kenyamanan = comfort.
    examples:
      - text: Ada tur tiga hari ke Toraja seharga dua juta.
        ar_eg: فيه رحلة تلات أيام لتوراجا بمليونين.
        ar: هناك جولة ثلاثة أيام إلى توراجا بمليونين.
        en: There's a three-day tour to Toraja for two million.
      - text: Mahasiswa dapat diskon sepuluh persen.
        ar_eg: الطلبة بياخدوا خصم عشرة في المية.
        ar: يحصل الطلاب على خصم عشرة بالمئة.
        en: Students get a ten per cent discount.
      - text: Kami berkeliling kota dengan becak.
        ar_eg: لفّينا المدينة بالتريسيكل.
        ar: تجوّلنا في المدينة بالدرّاجة الثلاثية.
        en: We went around the city by becak.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tur
        ar_eg: رحلة سياحية
        ar: جولة سياحية
        en: tour
      - text: bonus
        ar_eg: حاجة زيادة ببلاش
        ar: إضافة مجانية
        en: bonus
      - text: seharga
        ar_eg: بسعر
        ar: بسعر
        en: priced at
      - text: bepergian
        ar_eg: يسافر
        ar: يسافر
        en: to travel
    words: [tur, bonus, seharga, bepergian]
  - id: e02
    type: match_pairs
    pairs:
      - text: berkunjung
        ar_eg: يزور
        ar: يزور
        en: to visit
      - text: berkeliling
        ar_eg: يلف
        ar: يتجوّل
        en: to go around
      - text: perlengkapan
        ar_eg: معدّات
        ar: معدّات
        en: equipment
      - text: kenyamanan
        ar_eg: الراحة
        ar: الراحة
        en: comfort
    words: [berkunjung, berkeliling, perlengkapan, kenyamanan]
  - id: e03
    type: listen
    text: Harga tur sudah termasuk makan dan hotel.
    question:
      ar_eg: السعر شامل إيه؟
      ar: ماذا يشمل السعر؟
      en: What does the price include?
    options: [الأكل والفندق, الطيارة بس, الخصم]
    answer: 0
    meaning:
      ar_eg: سعر الرحلة شامل الأكل والفندق.
      ar: سعر الجولة يشمل الطعام والفندق.
      en: The tour price includes meals and the hotel.
    words: [tur]
  - id: e04
    type: fill_blank
    sentence: Kalau ikut tur ini, Anda dapat ___ makan malam gratis.
    meaning:
      ar_eg: لو طلعت الرحلة دي، تاخد ___ عشا ببلاش.
      ar: إن شاركت في هذه الجولة تحصل على ___ عشاء مجاني.
      en: If you join this tour, you get a free dinner as a ___.
    options: [bonus, kenyamanan, tur]
    answers: [bonus]
    words: [bonus, kenyamanan, tur]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بنلف في المدينة كلها. بالإندونيسي؟
      ar: نتجوّل في المدينة كلها. بالإندونيسية؟
      en: We go all around the city. In Indonesian?
    options: [Kami berkunjung kota., Kami berkeliling kota., Kami bepergian kota.]
    answer: 1
    explain:
      ar_eg: berkeliling = يلف في المكان. berkunjung لازم بعدها ke.
      ar: berkeliling = يتجوّل، أما berkunjung فيليها ke.
      en: berkeliling = go around; berkunjung needs ke.
    words: [berkunjung, berkeliling, bepergian]
  - id: e06
    type: fill_blank
    sentence: 'Jangan lupa bawa ___ mendaki: sepatu, jaket, dan senter.'
    meaning:
      ar_eg: 'ما تنساش تاخد ___ الطلوع: جزمة وجاكيت وكشاف.'
      ar: 'لا تنسَ ___ التسلّق: حذاء وسترة ومصباح.'
      en: 'Don''t forget your hiking ___: shoes, jacket and torch.'
    options: [perlengkapan, seharga, berkunjung]
    answers: [perlengkapan]
    words: [perlengkapan, seharga, berkunjung]
  - id: e07
    type: multiple_choice
    question: Busnya mahal, tapi ___ penumpang nomor satu.
    options: [bonus, tur, kenyamanan]
    answer: 2
    explain:
      ar_eg: kenyamanan = الراحة.
      ar: kenyamanan = الراحة.
      en: kenyamanan = comfort.
    words: [bonus, tur, kenyamanan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: عايز أزور توراجا الشهر الجاي.
      ar: أريد أن أزور توراجا الشهر القادم.
      en: I want to visit Toraja next month.
    answer: Saya mau berkunjung ke Toraja bulan depan.
    distractors: [bepergian, seharga]
    words: [berkunjung, bepergian, seharga]
  - id: e09
    type: translate
    direction: from_target
    source_text: Saya suka bepergian, tapi saya juga perlu kenyamanan.
    answers_meaning:
      ar_eg: [بحب السفر، بس محتاج راحة برضه, أنا بحب أسافر، بس الراحة مهمة ليّا كمان]
      ar: [أحبّ السفر، لكنني أحتاج إلى الراحة أيضًا, أحب التنقّل، غير أني أحتاج إلى الراحة كذلك]
      en: ['I like travelling, but I need comfort too', 'I love to travel, but comfort matters to me as well']
    words: [bepergian, kenyamanan]
  - id: e10
    type: speaking
    text: Tur ini seharga satu juta, sudah termasuk perlengkapan.
    meaning:
      ar_eg: الرحلة دي بمليون، شاملة المعدّات.
      ar: هذه الجولة بمليون، وتشمل المعدّات.
      en: This tour costs one million, gear included.
    words: [tur, seharga, perlengkapan, bonus, berkeliling]
dialogue:
  lines:
    - speaker: Penjual
      text: Selamat siang. Mau bepergian ke mana, Pak?
      ar_eg: مساء الخير. عايز تسافر فين يا أستاذ؟
      ar: مساء الخير. إلى أين تريد السفر يا سيدي؟
      en: Good afternoon. Where would you like to travel, sir?
    - speaker: Mohamed
      text: Saya mau berkunjung ke Toraja. Ada paket tur?
      ar_eg: عايز أزور توراجا. فيه رحلات منظمة؟
      ar: أريد زيارة توراجا. هل لديكم جولات منظّمة؟
      en: I'd like to visit Toraja. Do you have package tours?
    - speaker: Penjual
      text: Ada. Tiga hari, seharga dua juta. Kita berkeliling desa-desa adat.
      ar_eg: أيوه. تلات أيام بمليونين. هنلف على القرى التقليدية.
      ar: نعم. ثلاثة أيام بمليونين، نتجوّل فيها في القرى التقليدية.
      en: Yes. Three days for two million. We tour the traditional villages.
    - speaker: Mohamed
      text: Ada diskon buat mahasiswa?
      ar_eg: فيه خصم للطلبة؟
      ar: هل هناك خصم للطلاب؟
      en: Is there a student discount?
    - speaker: Penjual
      text: Ada, sepuluh persen. Busnya juga nyaman. Kenyamanan tamu penting bagi kami.
      ar_eg: أيوه، عشرة في المية. والأتوبيس مريح. راحة الضيوف مهمة عندنا.
      ar: نعم، عشرة بالمئة. والحافلة مريحة، فراحة الضيوف مهمة لنا.
      en: Yes, ten per cent. The bus is comfortable too. Our guests' comfort matters to us.
