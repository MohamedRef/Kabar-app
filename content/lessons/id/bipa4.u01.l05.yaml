schema: kabar.lesson/v1
id: bipa4.u01.l05
language: id
title: Teks eksposisi
can_do:
  ar_eg: تدافع عن مهنة في نص قصير بحجج واضحة.
  ar: أن تدافع عن مهنة في نص عرضي قصير بحجج واضحة.
  en: Argue for a profession.
slides:
  - title: Tesis, argumen, kesimpulan
    body:
      ar_eg: |
        النص العرضي (teks eksposisi) ليه ٣ أجزاء:
        1) الرأي: Saya berpendapat bahwa … = أنا شايف إن …
        2) الحجج: Pertama, … Kedua, … Selain itu, … (وكمان)
        3) الخلاصة: Dengan demikian, … / Kesimpulannya, … = وبكده / الخلاصة …
        استعمل الكلمات اللي اتعلمتها: keahlian، kesabaran، tanggung jawab، terkenal.
      ar: |
        للنص العرضي (teks eksposisi) ثلاثة أجزاء:
        1) الرأي: Saya berpendapat bahwa … = أرى أنّ …
        2) الحجج: Pertama, … Kedua, … Selain itu, … (فضلًا عن ذلك)
        3) الخلاصة: Dengan demikian, … / Kesimpulannya, … = وبذلك / خلاصة القول …
        واستعمل ما تعلمته: keahlian، kesabaran، tanggung jawab، terkenal.
      en: |
        An exposition (teks eksposisi) has three parts:
        1) Thesis: Saya berpendapat bahwa … = I am of the opinion that …
        2) Arguments: Pertama, … Kedua, … Selain itu, … (moreover)
        3) Conclusion: Dengan demikian, … / Kesimpulannya, … = thus / in conclusion …
        Use what you've learned: keahlian, kesabaran, tanggung jawab, terkenal.
    examples:
      - text: Saya berpendapat bahwa profesi nelayan kurang dihargai.
        ar_eg: أنا شايف إن مهنة الصياد مش متقدّرة كفاية.
        ar: أرى أن مهنة الصيد لا تحظى بالتقدير الكافي.
        en: I believe fishing as a profession isn't valued enough.
      - text: Dengan demikian, kita harus lebih menghargai nelayan.
        ar_eg: وبكده، لازم نقدّر الصيادين أكتر.
        ar: وبذلك يجب أن نقدّر الصيادين أكثر.
        en: Thus, we should value fishermen more.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: berpendapat
        ar_eg: شايف / رأيه إن
        ar: يرى (رأيه أن)
        en: be of the opinion
      - text: argumen
        ar_eg: حجة
        ar: حجة
        en: argument
      - text: kesimpulan
        ar_eg: خلاصة / استنتاج
        ar: خلاصة / استنتاج
        en: conclusion
      - text: dengan demikian
        ar_eg: وبكده / وبالتالي
        ar: وبذلك / وعليه
        en: thus, therefore
      - text: selain itu
        ar_eg: وكمان / غير كده
        ar: فضلًا عن ذلك
        en: moreover
    words: [berpendapat, argumen, kesimpulan, dengan demikian]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة تنفع تبدأ بيها النص العرضي (الرأي)؟
      ar: أيّ جملة تصلح بداية للنص العرضي (الرأي)؟
      en: Which sentence can open an exposition (the thesis)?
    options: ["Dengan demikian, perawat sangat penting.", "Saya berpendapat bahwa profesi perawat sangat penting.", "Kedua, perawat sering lembur."]
    answer: 1
    explain:
      ar_eg: Saya berpendapat bahwa … = رأيك في الأول. Dengan demikian للآخر، وKedua للحجج.
      ar: Saya berpendapat bahwa … للرأي في البداية، وDengan demikian للخاتمة، وKedua للحجج.
      en: Saya berpendapat bahwa … states the thesis first; Dengan demikian is for the end, Kedua for arguments.
    words: [berpendapat, dengan demikian, bahwa]
  - id: e03
    type: listen
    text: Argumen kedua, perawat bekerja siang dan malam.
    options: ["Argumen kedua, perawat bekerja siang dan malam.", "Argumen kedua, perawat tertidur siang dan malam.", "Kesimpulan kedua, perawat bekerja siang dan malam."]
    answer: 0
    meaning:
      ar_eg: "الحجة التانية: الممرضين بيشتغلوا ليل ونهار."
      ar: "الحجة الثانية: يعمل الممرضون ليلًا ونهارًا."
      en: "Second argument: nurses work day and night."
    words: [argumen]
  - id: e04
    type: fill_blank
    sentence: Guru membutuhkan kesabaran dan keahlian. ___, guru adalah profesi yang sulit tetapi mulia.
    meaning:
      ar_eg: المدرس محتاج صبر وخبرة. وبكده، التدريس مهنة صعبة بس شريفة.
      ar: يحتاج المعلم إلى الصبر والخبرة، وبذلك فالتعليم مهنة صعبة لكنها نبيلة.
      en: Teachers need patience and expertise. Thus, teaching is a hard but noble profession.
    options: [Dengan demikian, Sebaliknya, Tertutup]
    answers: [Dengan demikian]
    words: [dengan demikian, sulit]
  - id: e05
    type: fill_blank
    sentence: Paragraf terakhir teks eksposisi berisi ___.
    meaning:
      ar_eg: آخر فقرة في النص العرضي فيها الخلاصة.
      ar: تتضمن الفقرة الأخيرة من النص العرضي الخلاصة.
      en: The last paragraph of an exposition contains the conclusion.
    options: [kesimpulan, argumen, kecopetan]
    answers: [kesimpulan]
    words: [kesimpulan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: أنا شايف إن التمريض أهم مهنة.
      ar: أرى أن التمريض أهم مهنة.
      en: I am of the opinion that nursing is the most important profession.
    answer: Saya berpendapat bahwa perawat adalah profesi terpenting.
    distractors: [paling, kesimpulan]
    explain:
      ar_eg: terpenting = paling penting. ما تقولش «paling terpenting».
      ar: terpenting = paling penting، فلا يُجمع بينهما.
      en: terpenting = paling penting; never "paling terpenting".
    words: [berpendapat, bahwa]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: حجتي الأولانية إن الشغلانة دي محتاجة صبر.
      ar: حجتي الأولى أن هذا العمل يحتاج إلى الصبر.
      en: My first argument is that this job requires patience.
    answers:
      - Argumen pertama saya adalah pekerjaan ini membutuhkan kesabaran.
      - Argumen pertama saya adalah bahwa pekerjaan ini membutuhkan kesabaran.
      - "Argumen pertama saya: pekerjaan ini membutuhkan kesabaran."
      - Argumen saya yang pertama adalah pekerjaan ini membutuhkan kesabaran.
      - Argumen pertama saya adalah pekerjaan ini memerlukan kesabaran.
      - Argumen pertama saya, pekerjaan ini membutuhkan kesabaran.
    words: [argumen, bahwa]
  - id: e08
    type: dictation
    text: Dengan demikian, profesi nelayan sulit tetapi sangat penting bagi Makassar.
    meaning:
      ar_eg: وبكده، مهنة الصيد صعبة بس مهمة جدًا لماكاسار.
      ar: وبذلك فمهنة الصيد صعبة لكنها مهمة جدًا لماكاسار.
      en: Thus, fishing is a hard but very important profession for Makassar.
    words: [dengan demikian, sulit]
  - id: e09
    type: speaking
    text: Kesimpulannya, keselamatan pelaut adalah tanggung jawab kita semua.
    meaning:
      ar_eg: الخلاصة، سلامة البحّارة مسؤوليتنا كلنا.
      ar: خلاصة القول أن سلامة البحّارة مسؤوليتنا جميعًا.
      en: In conclusion, sailors' safety is our shared responsibility.
    words: [kesimpulan, keselamatan, tanggung jawab]
  - id: e10
    type: multiple_choice
    question: Pekerjaan perawat sulit, tetapi penting.
    question_meaning:
      ar_eg: الكاتب بيوصف شغل التمريض إزاي؟
      ar: كيف يصف الكاتب عمل التمريض؟
      en: How does the writer describe nursing?
    options: ['Sulit tetapi penting.', 'Tidak sulit.', 'Tidak penting.']
    answer: 0
    explain:
      ar_eg: sulit = صعب، وtetapi = بس.
      ar: sulit = صعب، وtetapi = لكن.
      en: sulit = difficult; tetapi = but.
    words: [sulit, penting]
dialogue:
  title: Tugas presentasi
  lines:
    - speaker: Andi
      text: Kamu mau menulis teks eksposisi tentang profesi apa?
      ar_eg: هتكتب النص العرضي عن أنهي مهنة؟
      ar: عن أيّ مهنة ستكتب النص العرضي؟
      en: Which profession are you writing your exposition about?
    - speaker: Mohamed
      text: Nelayan. Saya berpendapat bahwa profesi nelayan kurang dihargai.
      ar_eg: الصيادين. أنا شايف إن مهنة الصيد مش متقدّرة كفاية.
      ar: الصيادون. أرى أن مهنة الصيد لا تحظى بالتقدير الكافي.
      en: Fishermen. I believe fishing isn't valued enough.
    - speaker: Andi
      text: Menarik! Apa argumenmu?
      ar_eg: حلو! وإيه حججك؟
      ar: مثير للاهتمام! وما حججك؟
      en: Interesting! What are your arguments?
    - speaker: Mohamed
      text: Pertama, pekerjaan mereka berbahaya. Kedua, tanpa nelayan, tidak ada ikan bakar di Losari!
      ar_eg: أولًا، شغلهم خطر. تانيًا، من غير صيادين مفيش سمك مشوي في لوساري!
      ar: أولًا، عملهم خطير. ثانيًا، بلا صيادين لا سمك مشويًا في لوساري!
      en: First, their work is dangerous. Second, without fishermen there's no grilled fish at Losari!
    - speaker: Andi
      text: Ha-ha, betul! Lalu kesimpulannya?
      ar_eg: هههه، صح! والخلاصة؟
      ar: صحيح! وما الخلاصة؟
      en: Ha ha, true! And your conclusion?
    - speaker: Mohamed
      text: Dengan demikian, kita harus lebih menghargai nelayan.
      ar_eg: وبكده، لازم نقدّر الصيادين أكتر.
      ar: وبذلك يجب أن نقدّر الصيادين أكثر.
      en: Thus, we should value fishermen more.
