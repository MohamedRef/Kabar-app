schema: kabar.lesson/v1
id: bipa4.u01.l05
language: id
title: Lowongan di pabrik
can_do:
  ar_eg: تقرا إعلان شغل في مصنع وتسأل عن الخبرة والأجر والتقديم.
  ar: أن تقرأ إعلان وظيفة في مصنع وتسأل عن الخبرة والأجر وطريقة التقدّم.
  en: Read a factory job ad and ask about experience, pay and how to apply.
slides:
  - title: Pabrik semen mencari pekerja
    body:
      ar_eg: |
        konstruksi = بناء، إنشاءات (perusahaan konstruksi)، teknisi = فنّي (بيصلّح المكن)، operator = اللي بيشغّل الماكينة، pengemudi = سوّاق (أرسم من sopir).
        mendaftar = يقدّم أو يسجّل اسمه، mempekerjakan = يشغّل حد عنده (يعيّنه).
        berpengalaman = عنده خبرة، bayaran = الأجر (الفلوس اللي بتاخدها على الشغل).
      ar: |
        konstruksi = البناء والإنشاءات (perusahaan konstruksi)، teknisi = فنّي (يصلح الآلات)، operator = مشغّل الآلة، pengemudi = سائق (أكثر رسمية من sopir).
        mendaftar = يتقدّم أو يسجّل، mempekerjakan = يوظّف شخصًا.
        berpengalaman = ذو خبرة، bayaran = الأجر.
      en: |
        konstruksi = construction (perusahaan konstruksi), teknisi = technician (fixes machines), operator = machine operator, pengemudi = driver (more formal than sopir).
        mendaftar = to apply, register; mempekerjakan = to employ, hire.
        berpengalaman = experienced, bayaran = pay, fee.
    examples:
      - text: Perusahaan konstruksi itu mau mempekerjakan dua insinyur.
        ar_eg: شركة المقاولات دي عايزة تشغّل اتنين مهندسين.
        ar: تريد شركة الإنشاءات تلك توظيف مهندسَين.
        en: That construction company wants to hire two engineers.
      - text: Kami mencari teknisi yang berpengalaman.
        ar_eg: بندوّر على فني عنده خبرة.
        ar: نبحث عن فنّي ذي خبرة.
        en: We're looking for an experienced technician.
      - text: Saya mendaftar lewat internet.
        ar_eg: أنا قدّمت عن طريق الإنترنت.
        ar: تقدّمت عبر الإنترنت.
        en: I applied online.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: konstruksi
        ar_eg: إنشاءات، مقاولات
        ar: إنشاءات
        en: construction
      - text: teknisi
        ar_eg: فني
        ar: فنّي
        en: technician
      - text: operator
        ar_eg: مشغّل ماكينة
        ar: مشغّل آلة
        en: operator
      - text: pengemudi
        ar_eg: سواق
        ar: سائق
        en: driver
    words: [konstruksi, teknisi, operator, pengemudi]
  - id: e02
    type: match_pairs
    pairs:
      - text: mendaftar
        ar_eg: يقدّم
        ar: يتقدّم
        en: to apply
      - text: mempekerjakan
        ar_eg: يشغّل
        ar: يوظّف
        en: to employ
      - text: berpengalaman
        ar_eg: عنده خبرة
        ar: ذو خبرة
        en: experienced
      - text: bayaran
        ar_eg: الأجر
        ar: الأجر
        en: pay
    words: [mendaftar, mempekerjakan, berpengalaman, bayaran]
  - id: e03
    type: listen
    text: Operator mesin harus datang jam enam pagi.
    question:
      ar_eg: مين لازم ييجي بدري؟
      ar: من يجب أن يأتي مبكرًا؟
      en: Who has to come early?
    options: [مشغّل الماكينة, السواق, المهندس]
    answer: 0
    meaning:
      ar_eg: مشغّل الماكينة لازم ييجي الساعة ستة الصبح.
      ar: يجب أن يأتي مشغّل الآلة في السادسة صباحًا.
      en: The machine operator must come at six in the morning.
    words: [operator]
  - id: e04
    type: fill_blank
    sentence: Mesin di pabrik rusak. Kita perlu ___.
    meaning:
      ar_eg: المكنة في المصنع بايظة. محتاجين ___.
      ar: الآلة في المصنع معطّلة. نحتاج إلى ___.
      en: The machine at the factory is broken. We need a ___.
    options: [teknisi, pengemudi, bayaran]
    answers: [teknisi]
    words: [teknisi, pengemudi, bayaran]
    explain:
      ar_eg: teknisi = فنّي، وهو اللي بيصلّح المكن. pengemudi = سوّاق، وbayaran = أجرة.
      ar: teknisi = الفنّي، وهو من يصلح الآلات. أما pengemudi فالسائق، وbayaran الأجر.
      en: A teknisi (technician) fixes machines. pengemudi is a driver, and bayaran is pay.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: يعني إيه mempekerjakan؟
      ar: ما معنى mempekerjakan؟
      en: What does mempekerjakan mean?
    options: [يقدّم على شغل, يشغّل حد عنده, يصلّح ماكينة]
    answer: 1
    explain:
      ar_eg: mempekerjakan = يشغّل حد. اللي بيقدّم = mendaftar.
      ar: mempekerjakan = يوظّف. أمّا التقدّم فهو mendaftar.
      en: mempekerjakan = to hire. Applying is mendaftar.
    words: [mempekerjakan, mendaftar]
  - id: e06
    type: fill_blank
    sentence: Kami mencari pengemudi yang ___, minimal lima tahun.
    meaning:
      ar_eg: بندوّر على سواق ___، خمس سنين على الأقل.
      ar: نبحث عن سائق ___، خمس سنوات على الأقل.
      en: We're looking for an ___ driver, at least five years.
    options: [berpengalaman, konstruksi, operator]
    answers: [berpengalaman]
    words: [berpengalaman, konstruksi, operator, pengemudi]
    explain:
      ar_eg: berpengalaman = عنده خبرة، وده اللي «خمس سنين» بتوصفه. konstruksi = مقاولات، وoperator = مشغّل مكنة.
      ar: berpengalaman = ذو خبرة، وهذا ما تصفه «خمس سنوات». أما konstruksi فالإنشاءات، وoperator مشغّل الآلة.
      en: berpengalaman means experienced, which "five years" describes. konstruksi is construction, and operator is a machine operator.
  - id: e07
    type: multiple_choice
    question: ___ untuk teknisi baru empat juta rupiah sebulan.
    options: [Pengemudinya, Bayarannya, Insinyurnya]
    answer: 1
    explain:
      ar_eg: bayaran = الأجر.
      ar: bayaran = الأجر.
      en: bayaran = pay.
    words: [bayaran, pengemudi, insinyur, teknisi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: عايز أقدّم في شركة المقاولات دي.
      ar: أريد أن أتقدّم إلى شركة الإنشاءات هذه.
      en: I want to apply to this construction company.
    answer: Saya mau mendaftar di perusahaan konstruksi ini.
    distractors: [operator, bayaran]
    words: [mendaftar, konstruksi, operator, bayaran]
    explain:
      ar_eg: mendaftar di = يقدّم في، وperusahaan konstruksi = شركة مقاولات. operator (مشغّل) وbayaran (أجرة) مش في الجملة.
      ar: mendaftar di = يتقدّم إلى، وperusahaan konstruksi = شركة إنشاءات. أما operator (مشغّل) وbayaran (أجر) فليسا في الجملة.
      en: mendaftar di is "apply to", and perusahaan konstruksi is a construction company. operator and bayaran (pay) aren't in the sentence.
  - id: e09
    type: translate
    direction: from_target
    source_text: Perusahaan itu akan mempekerjakan sepuluh operator baru.
    answers_meaning:
      ar_eg: [الشركة دي هتشغّل عشر مشغّلين جداد, الشركة هتعيّن عشرة مشغّلين جداد]
      ar: [ستوظّف تلك الشركة عشرة مشغّلين جدد, ستعيّن الشركة عشرة مشغّلين جددًا]
      en: [That company will hire ten new operators, The company is going to employ ten new operators]
    words: [mempekerjakan, operator]
  - id: e10
    type: speaking
    text: Saya teknisi yang berpengalaman. Saya mau mendaftar.
    meaning:
      ar_eg: أنا فني عنده خبرة. عايز أقدّم.
      ar: أنا فنّي ذو خبرة. أريد أن أتقدّم.
      en: I'm an experienced technician. I'd like to apply.
    words: [teknisi, berpengalaman, mendaftar, pengemudi]
dialogue:
  lines:
    - speaker: Andi
      text: Mohamed, lihat iklan ini deh. Pabrik semen di Maros lagi cari pekerja.
      ar_eg: يا محمد، بص الإعلان ده. مصنع أسمنت في ماروس بيدوّر على عمال.
      ar: يا محمد، انظر إلى هذا الإعلان. مصنع إسمنت في ماروس يبحث عن عمّال.
      en: Mohamed, look at this ad. A cement factory in Maros is looking for workers.
    - speaker: Mohamed
      text: Mereka mau mempekerjakan siapa aja?
      ar_eg: عايزين يشغّلوا مين؟
      ar: من يريدون أن يوظّفوا؟
      en: Who do they want to hire?
    - speaker: Andi
      text: Insinyur, teknisi, operator mesin, dan pengemudi truk.
      ar_eg: مهندسين وفنيين ومشغّلين مكن وسواقين تريلات.
      ar: مهندسين وفنّيين ومشغّلي آلات وسائقي شاحنات.
      en: Engineers, technicians, machine operators and truck drivers.
    - speaker: Mohamed
      text: Harus berpengalaman? Bayarannya berapa?
      ar_eg: لازم يكون عنده خبرة؟ والأجر كام؟
      ar: هل يجب أن يكون ذا خبرة؟ وكم الأجر؟
      en: Do you need experience? How much is the pay?
    - speaker: Andi
      text: Minimal dua tahun. Bayarannya lumayan. Aku mau mendaftar besok!
      ar_eg: سنتين على الأقل. والأجر معقول. أنا هقدّم بكرة!
      ar: سنتان على الأقل، والأجر لا بأس به. سأتقدّم غدًا!
      en: At least two years. The pay's decent. I'm going to apply tomorrow!
