schema: kabar.lesson/v1
id: bipa5.u08.l08
language: id
title: Membaca opini dengan kritis
can_do:
  ar_eg: 'تقرا مقال رأي بعين ناقدة: ساذج ولا متطرف، مستقل ولا لأ، من أنهي زاوية، وإيه عيوبه، وقد إيه صحيح.'
  ar: 'أن تقرأ مقال رأي بعين ناقدة: ساذج أم متطرّف، مستقلّ أم لا، ومن أي منظور، وما عيوبه، وما درجة صحته.'
  en: 'Read an op-ed critically: naive or extreme, independent or not, from which perspective, its drawbacks and how true it is.'
slides:
  - title: Menimbang sebuah opini
    body:
      ar_eg: |
        naif = ساذج، radikal = جذري، متطرف (perubahan radikal = تغيير جذري)، ekstrim = متطرف، أقصى (والرسمي ekstrem).
        independen = مستقل (media independen)، perspektif = منظور، زاوية.
        enggan = مش عايز، متردد يعمل حاجة: Dia enggan menjawab.
        minus = عيب، سلبية: plus-minusnya = مميزاته وعيوبه. kadar = درجة، نسبة (kadar gula، kadar kebenaran).
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: udah = sudah، kayaknya = sepertinya، cuma = hanya، gitu = begitu، jelasin = menjelaskan، nggak = tidak، aku = saya، bakal = akan.
      ar: |
        naif = ساذج، radikal = جذري، متطرّف (perubahan radikal = تغيير جذري)، ekstrim = متطرّف، أقصى (والمعيارية ekstrem).
        independen = مستقلّ (media independen)، perspektif = منظور.
        enggan = متردّد، غير راغب: Dia enggan menjawab.
        minus = عيب، سلبية: plus-minusnya = مزاياه وعيوبه. kadar = درجة، نسبة (kadar gula، kadar kebenaran).
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: udah = sudah، kayaknya = sepertinya، cuma = hanya، gitu = begitu، jelasin = menjelaskan، nggak = tidak، aku = saya، bakal = akan.
      en: |
        naif = naive, radikal = radical (perubahan radikal = radical change), ekstrim = extreme (standard ekstrem).
        independen = independent (media independen), perspektif = perspective.
        enggan = reluctant: Dia enggan menjawab.
        minus = minus, drawback: plus-minusnya = its pros and cons. kadar = level, degree (kadar gula, kadar kebenaran).
        The dialogue uses street forms; the formal ones are beside them: udah = sudah, kayaknya = sepertinya, cuma = hanya, gitu = begitu, jelasin = menjelaskan, nggak = tidak, aku = saya, bakal = akan.
    examples:
      - text: Barangkali penulis itu agak naif tentang politik.
        ar_eg: يمكن الكاتب ده ساذج شوية في السياسة.
        ar: ربما كان ذلك الكاتب ساذجًا بعض الشيء في السياسة.
        en: Perhaps that writer is a little naive about politics.
      - text: Setiap kebijakan punya plus-minusnya.
        ar_eg: كل سياسة ليها مميزات وعيوب.
        ar: لكل سياسة مزاياها وعيوبها.
        en: Every policy has its pros and cons.
      - text: Dari perspektif warga desa, rencana itu terlalu radikal.
        ar_eg: من منظور أهل القرية، الخطة دي جذرية زيادة.
        ar: من منظور أهل القرية، تلك الخطة جذرية أكثر من اللازم.
        en: From the villagers' perspective, the plan is too radical.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: naif
        ar_eg: ساذج
        ar: ساذج
        en: naive
      - text: radikal
        ar_eg: جذري، متطرف
        ar: جذري
        en: radical
      - text: ekstrim
        ar_eg: متطرف
        ar: متطرّف
        en: extreme
      - text: independen
        ar_eg: مستقل
        ar: مستقلّ
        en: independent
    words: [naif, radikal, ekstrim, independen]
  - id: e02
    type: match_pairs
    pairs:
      - text: perspektif
        ar_eg: منظور
        ar: منظور
        en: perspective
      - text: enggan
        ar_eg: متردد، مش عايز
        ar: متردّد
        en: reluctant
      - text: minus
        ar_eg: عيب
        ar: عيب، سلبية
        en: drawback, minus
      - text: kadar
        ar_eg: درجة، نسبة
        ar: درجة، نسبة
        en: level, degree
    words: [perspektif, enggan, minus, kadar]
  - id: e03
    type: listen
    text: Pejabat itu enggan menjawab pertanyaan wartawan.
    question:
      ar_eg: المسؤول عمل إيه؟
      ar: ماذا فعل المسؤول؟
      en: What did the official do?
    options: [مش عايز يرد, رد بسرعة, ضحك]
    answer: 0
    meaning:
      ar_eg: المسؤول ده ما كانش عايز يرد على سؤال الصحفي.
      ar: تردّد ذلك المسؤول في الإجابة عن سؤال الصحفي.
      en: That official was reluctant to answer the reporter's question.
    words: [enggan]
  - id: e04
    type: fill_blank
    sentence: Media ___ tidak dibiayai oleh partai politik.
    meaning:
      ar_eg: الإعلام ال___ مش ممول من أحزاب سياسية.
      ar: الإعلام ال___ لا تموّله الأحزاب السياسية.
      en: ___ media are not funded by political parties.
    options: [independen, naif, kadar]
    answers: [independen]
    words: [independen, naif, kadar]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حد بيصدق أي حاجة وفاكر الدنيا كلها حلوة. هو إيه؟
      ar: شخص يصدّق كل شيء ويظن العالم كله جميلًا. ما صفته؟
      en: Someone who believes everything and thinks the world is all nice. What are they?
    options: [radikal, independen, naif]
    answer: 2
    explain:
      ar_eg: naif = ساذج.
      ar: naif = ساذج.
      en: naif = naive.
    words: [radikal, independen, naif]
  - id: e06
    type: fill_blank
    sentence: Dokter memeriksa ___ gula dalam darah saya.
    meaning:
      ar_eg: الدكتور كشف على ___ السكر في دمي.
      ar: فحص الطبيب ___ السكر في دمي.
      en: The doctor checked my blood sugar ___.
    options: [kadar, minus, perspektif]
    answers: [kadar]
    words: [kadar, minus, perspektif]
  - id: e07
    type: multiple_choice
    question: 'Cuaca ___: suhu mencapai empat puluh lima derajat.'
    options: [enggan, ekstrim, minus]
    answer: 1
    explain:
      ar_eg: ekstrim = متطرف، أقصى درجة.
      ar: ekstrim = متطرّف، شديد.
      en: ekstrim = extreme.
    words: [enggan, ekstrim, minus]
  - id: e08
    type: build_sentence
    source:
      ar_eg: من منظوري، الخطة دي جذرية زيادة.
      ar: من منظوري، هذه الخطة جذرية أكثر من اللازم.
      en: From my perspective, this plan is too radical.
    answer: Dari perspektif saya, rencana ini terlalu radikal.
    distractors: [ekstrim, naif]
    words: [perspektif, radikal, ekstrim]
  - id: e09
    type: translate
    direction: from_target
    source_text: Setiap pilihan punya plus dan minus.
    answers_meaning:
      ar_eg: [كل اختيار ليه مميزات وعيوب, كل اختيار ليه الحلو والوحش]
      ar: [لكل خيار مزايا وعيوب, لكل اختيار إيجابيات وسلبيات]
      en: [Every choice has pros and cons, Every option has its pluses and minuses]
    words: [minus]
  - id: e10
    type: speaking
    text: Penulis itu tidak naif dan tidak ekstrim.
    meaning:
      ar_eg: الكاتب ده مش ساذج ومش متطرف.
      ar: ذلك الكاتب ليس ساذجًا ولا متطرّفًا.
      en: That writer is neither naive nor extreme.
    words: [naif, ekstrim]
dialogue:
  lines:
    - speaker: Rina
      text: Kamu udah baca kolom opini soal tambang itu?
      ar_eg: قريت عمود الرأي عن المنجم ده؟
      ar: هل قرأت عمود الرأي عن ذلك المنجم؟
      en: Have you read the opinion column about the mine?
    - speaker: Mohamed
      text: Udah. Kayaknya penulisnya agak naif. Dia cuma lihat dari perspektif perusahaan.
      ar_eg: أيوه. باين إن الكاتب ساذج شوية. شايف بس من منظور الشركة.
      ar: نعم. يبدو الكاتب ساذجًا بعض الشيء، فهو ينظر من منظور الشركة فقط.
      en: Yes. The writer seems a bit naive. He only sees the company's perspective.
    - speaker: Rina
      text: Media itu independen, kan?
      ar_eg: الجرنال ده مستقل، مش كده؟
      ar: تلك الصحيفة مستقلّة، أليس كذلك؟
      en: That outlet is independent, isn't it?
    - speaker: Mohamed
      text: Katanya, sih, gitu. Tapi pemiliknya enggan jelasin siapa sponsornya.
      ar_eg: بيقولوا كده. بس صاحبه مش عايز يقول مين الراعي بتاعه.
      ar: يقولون ذلك، لكن مالكها يتردّد في الإفصاح عن رعاته.
      en: So they say. But the owner is reluctant to say who the sponsors are.
    - speaker: Rina
      text: Jadi kadar kebenarannya perlu dicek, dong.
      ar_eg: يبقى لازم نتأكد قد إيه هو صحيح.
      ar: إذن ينبغي التحقّق من درجة صحته.
      en: So we need to check how true it is.
    - speaker: Mohamed
      text: "Iya. Tanggapanku nggak ekstrim: aku bakal nulis plus minusnya."
      ar_eg: 'مظبوط. ردّي مش هيبقى متطرف: هكتب مميزاته وعيوبه.'
      ar: 'صحيح. لن يكون ردّي متطرّفًا: سأكتب مزاياه وعيوبه.'
      en: 'Right. My response won''t be extreme: I''ll write its pros and cons.'
