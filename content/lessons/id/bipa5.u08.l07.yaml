schema: kabar.lesson/v1
id: bipa5.u08.l07
language: id
title: Debat bernuansa
can_do:
  ar_eg: تتناقش وتعترض بلطف، وتفرّق بين الحقيقة والرأي.
  ar: أن تناقش وتعترض بلطف، وتميّز الحقيقة من الرأي.
  en: Debate and object gently, telling fact from opinion.
slides:
  - title: Tidak setuju dengan sopan
    grammar: id.hedging
    body:
      ar_eg: |
        في النقاش (debat) الإندونيسي، الاعتراض بيبقى ناعم:
        - Maaf, saya ada sedikit keberatan. = لا مؤاخذة، عندي اعتراض صغير.
        - Itu fakta, tetapi … = دي حقيقة، بس …
        - Meskipun begitu, … = ومع ذلك، …
        - Kita sepakat bahwa … = إحنا متفقين إن …
        ابدأ باللي متفقين عليه، وبعدين قول اعتراضك.
      ar: |
        في النقاش (debat) الإندونيسي يكون الاعتراض ليّنًا:
        - Maaf, saya ada sedikit keberatan. = عذرًا، لديّ اعتراض صغير.
        - Itu fakta, tetapi … = هذه حقيقة، لكن …
        - Meskipun begitu, … = ومع ذلك، …
        - Kita sepakat bahwa … = نتّفق على أنّ …
        ابدأ بما تتّفقان عليه، ثمّ قدّم اعتراضك.
      en: |
        In an Indonesian debate (debat), objections stay soft:
        - Maaf, saya ada sedikit keberatan. = Sorry, I have a small objection.
        - Itu fakta, tetapi … = That's a fact, but …
        - Meskipun begitu, … = Even so, …
        - Kita sepakat bahwa … = We agree that …
        Start with what you agree on, then raise your objection.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: debat
        ar_eg: نقاش / مناظرة
        ar: مناظرة
        en: debate
      - text: sepakat
        ar_eg: متفقين
        ar: متّفقون
        en: to agree (together)
      - text: keberatan
        ar_eg: اعتراض
        ar: اعتراض
        en: objection
      - text: fakta
        ar_eg: حقيقة / واقعة
        ar: حقيقة
        en: fact
      - text: meskipun
        ar_eg: رغم إن
        ar: رغم أنّ
        en: although
    words: [debat, sepakat, keberatan, fakta, meskipun]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها حقيقة مش رأي؟
      ar: أيّ جملة تذكر حقيقة لا رأيًا؟
      en: Which sentence states a fact, not an opinion?
    options:
      - Martapura adalah kota terindah di Kalimantan.
      - Pasar permata Martapura buka setiap hari.
      - Batu permata itu terlalu mahal.
    answer: 1
    words: [fakta]
  - id: e03
    type: fill_blank
    sentence: Maaf, saya ada sedikit ___ tentang data itu.
    meaning:
      ar_eg: لا مؤاخذة، عندي اعتراض صغير على البيانات دي.
      ar: عذرًا، لديّ اعتراض صغير على تلك البيانات.
      en: Sorry, I have a small objection about that data.
    options: [keberatan, fakta, debat]
    answers: [keberatan]
    words: [keberatan]
  - id: e04
    type: listen
    text: Kita sepakat bahwa harga beras naik, tetapi penyebabnya belum jelas.
    question:
      ar_eg: هم متفقين على إيه؟
      ar: على أيّ شيء يتّفقون؟
      en: What do they agree on?
    options:
      - إن سعر الرز زاد.
      - إن السبب واضح.
      - إن الحكومة غلطانة.
    answer: 0
    words: [sepakat]
  - id: e05
    type: build_sentence
    source:
      ar_eg: رغم إن البيانات قليلة، الرأي ده مهم.
      ar: رغم قلّة البيانات، فهذا الرأي مهمّ.
      en: Although the data is limited, this opinion matters.
    answer: Meskipun datanya sedikit, pendapat ini penting.
    distractors: [sepakat, fakta]
    words: [meskipun, pendapat]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: في الـ debat، الأحسن تبدأ بإيه؟
      ar: بمَ يحسن أن تبدأ في الـ debat؟
      en: In a debat, what's best to start with?
    options:
      - باللي متفقين عليه.
      - بأقوى هجوم.
      - بنكتة على الطرف التاني.
    answer: 0
    words: [debat]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: دي حقيقة، بس ومع ذلك عندي اعتراض.
      ar: هذه حقيقة، ومع ذلك لديّ اعتراض.
      en: That's a fact, but even so I have an objection.
    answers:
      - Itu fakta. Meskipun begitu, saya ada keberatan.
      - Itu fakta. Meskipun begitu, saya punya keberatan.
      - Itu memang fakta, tetapi saya tetap ada keberatan.
      - Itu fakta, namun saya punya keberatan.
    words: [fakta, keberatan]
  - id: e08
    type: speaking
    text: Saya menghargai pendapat Bapak, meskipun saya kurang sepakat.
    meaning:
      ar_eg: أنا بقدّر رأي حضرتك، رغم إني مش متفق قوي.
      ar: أقدّر رأيك يا سيّدي، رغم أنّي لا أتّفق تمامًا.
      en: I respect your opinion, sir, although I don't quite agree.
    words: [meskipun, sepakat]
  - id: e09
    type: dictation
    text: Debat itu panas, tetapi semua orang tetap sopan.
    meaning:
      ar_eg: النقاش كان سخن، بس الكل فضل مؤدب.
      ar: كانت المناظرة حامية، لكنّ الجميع ظلّوا مهذّبين.
      en: The debate was heated, but everyone stayed polite.
    words: [debat]
dialogue:
  title: Debat di kampus
  lines:
    - speaker: Rina
      text: Menurut saya, media sosial merusak bahasa anak muda.
      ar_eg: في رأيي، السوشيال ميديا بتبوّظ لغة الشباب.
      ar: في رأيي، تفسد وسائل التواصل لغة الشباب.
      en: In my opinion, social media is ruining young people's language.
    - speaker: Mohamed
      text: Kita sepakat bahwa bahasa gaul makin populer. Itu fakta.
      ar_eg: إحنا متفقين إن لغة الشارع بقت منتشرة أكتر. دي حقيقة.
      ar: نتّفق على أنّ العامّية الشبابية تزداد انتشارًا. هذه حقيقة.
      en: We agree that slang is getting more popular. That's a fact.
    - speaker: Mohamed
      text: Meskipun begitu, saya ada sedikit keberatan. Barangkali bahasa hanya berubah, tidak rusak.
      ar_eg: ومع ذلك، عندي اعتراض صغير. يمكن اللغة بتتغير بس، مش بتبوظ.
      ar: ومع ذلك، لديّ اعتراض صغير. ربّما تتغيّر اللغة فقط ولا تفسد.
      en: Even so, I have a small objection. Perhaps language is just changing, not breaking.
    - speaker: Rina
      text: Hmm, itu sudut pandang yang menarik. Debat kita belum selesai!
      ar_eg: همم، دي وجهة نظر حلوة. نقاشنا لسه ماخلصش!
      ar: همم، وجهة نظر لافتة. لم تنتهِ مناظرتنا بعد!
      en: Hmm, that's an interesting point of view. Our debate isn't over!
