schema: kabar.lesson/v1
id: bipa5.u08.l07
language: id
title: Di ruang redaksi
can_do:
  ar_eg: 'تتكلم جوه غرفة الأخبار: الصحفي والمحرر والفضيحة والمنتدى، والعرض على الشاشة، والإعلان الرسمي، وانتشار الإشاعات والإثارة.'
  ar: 'أن تتحدث في غرفة الأخبار: الصحفي والمحرّر والفضيحة والمنتدى، والبثّ، والإشعار الرسمي، وانتشار الإشاعة والإثارة.'
  en: 'Talk in the newsroom: journalist, editor, scandal and forum, broadcasting, official notices, the spread of rumours and sensation.'
slides:
  - title: Berita atau sensasi?
    body:
      ar_eg: |
        jurnalis = صحفي (والكلمة الأصلية wartawan)، editor = محرر.
        skandal = فضيحة، sensasi = إثارة: berita sensasi = خبر بيدور على الإثارة.
        forum = منتدى (forum diskusi)، tayang = يتعرض (على الشاشة): Acara ini tayang jam delapan.
        pemberitahuan = إشعار، إعلان رسمي، penyebaran = انتشار، نشر (penyebaran hoaks = نشر الإشاعات).
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: kasih = beri.
      ar: |
        jurnalis = صحفي (والكلمة الأصيلة wartawan)، editor = محرّر.
        skandal = فضيحة، sensasi = إثارة: berita sensasi = خبر يبحث عن الإثارة.
        forum = منتدى (forum diskusi)، tayang = يُعرض (على الشاشة): Acara ini tayang jam delapan.
        pemberitahuan = إشعار، إعلان رسمي، penyebaran = انتشار، نشر (penyebaran hoaks = نشر الأخبار الكاذبة).
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: kasih = beri.
      en: |
        jurnalis = journalist (the native word is wartawan), editor = editor.
        skandal = scandal, sensasi = sensation: berita sensasi = sensationalist news.
        forum = forum (forum diskusi), tayang = to air, be screened: Acara ini tayang jam delapan.
        pemberitahuan = notice, announcement, penyebaran = spread, dissemination (penyebaran hoaks = spreading hoaxes).
        The dialogue uses street forms; the formal ones are beside them: kasih = beri.
    examples:
      - text: Editor itu menolak judul yang hanya mencari sensasi.
        ar_eg: المحرر ده رفض العنوان اللي بيدور على الإثارة وبس.
        ar: رفض ذلك المحرّر العنوان الذي لا يبحث إلا عن الإثارة.
        en: The editor rejected a headline that only chased sensation.
      - text: Penyebaran hoaks lebih cepat daripada berita yang benar.
        ar_eg: الإشاعات بتنتشر أسرع من الأخبار الصح.
        ar: تنتشر الأخبار الكاذبة أسرع من الصحيحة.
        en: Hoaxes spread faster than true news.
      - text: Wawancara dengan jurnalis itu tayang malam ini.
        ar_eg: الحوار مع الصحفي ده هيتعرض الليلة.
        ar: تُعرض المقابلة مع ذلك الصحفي الليلة.
        en: The interview with that journalist airs tonight.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jurnalis
        ar_eg: صحفي
        ar: صحفي
        en: journalist
      - text: editor
        ar_eg: محرر
        ar: محرّر
        en: editor
      - text: skandal
        ar_eg: فضيحة
        ar: فضيحة
        en: scandal
      - text: forum
        ar_eg: منتدى
        ar: منتدى
        en: forum
    words: [jurnalis, editor, skandal, forum]
  - id: e02
    type: match_pairs
    pairs:
      - text: tayang
        ar_eg: يتعرض (على الشاشة)
        ar: يُعرض
        en: to air
      - text: pemberitahuan
        ar_eg: إشعار
        ar: إشعار، إعلان
        en: notice
      - text: penyebaran
        ar_eg: انتشار
        ar: انتشار
        en: spread
      - text: sensasi
        ar_eg: إثارة
        ar: إثارة
        en: sensation
    words: [tayang, pemberitahuan, penyebaran, sensasi]
  - id: e03
    type: listen
    text: Film dokumenter itu tayang hari Jumat jam delapan.
    question:
      ar_eg: هيتعرض إمتى؟
      ar: متى يُعرض؟
      en: When does it air?
    options: [الجمعة الساعة تمانية, الحد الصبح, الليلة]
    answer: 0
    meaning:
      ar_eg: الفيلم الوثائقي ده هيتعرض يوم الجمعة الساعة تمانية.
      ar: يُعرض ذلك الفيلم الوثائقي يوم الجمعة الساعة الثامنة.
      en: That documentary airs on Friday at eight.
    words: [tayang]
  - id: e04
    type: fill_blank
    sentence: Seorang ___ menulis artikel tentang korupsi di dinas itu.
    meaning:
      ar_eg: ___ كتب مقال عن الفساد في المصلحة دي.
      ar: كتب ___ مقالًا عن الفساد في تلك الدائرة.
      en: A ___ wrote an article about corruption in that agency.
    options: [jurnalis, forum, sensasi]
    answers: [jurnalis]
    words: [jurnalis, forum, sensasi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيراجع المقال ويقرر ينزل ولا لأ؟
      ar: من يراجع المقال ويقرّر نشره؟
      en: Who checks an article and decides whether it runs?
    options: [pemberitahuan, editor, skandal]
    answer: 1
    explain:
      ar_eg: editor = محرر.
      ar: editor = محرّر.
      en: editor = editor.
    words: [pemberitahuan, editor, skandal]
  - id: e06
    type: fill_blank
    sentence: Media sosial mempercepat ___ berita palsu.
    meaning:
      ar_eg: السوشيال ميديا بتسرّع ___ الأخبار الكدابة.
      ar: تسرّع وسائل التواصل ___ الأخبار الكاذبة.
      en: Social media speeds up the ___ of fake news.
    options: [penyebaran, editor, tayang]
    answers: [penyebaran]
    words: [penyebaran, editor, tayang]
  - id: e07
    type: multiple_choice
    question: Menteri itu mundur karena ___ korupsi.
    options: [forum, penyebaran, skandal]
    answer: 2
    explain:
      ar_eg: skandal = فضيحة.
      ar: skandal = فضيحة.
      en: skandal = scandal.
    words: [forum, penyebaran, skandal]
  - id: e08
    type: build_sentence
    source:
      ar_eg: فيه إشعار رسمي من المدرسة.
      ar: هناك إشعار رسمي من المدرسة.
      en: There's an official notice from the school.
    answer: Ada pemberitahuan resmi dari sekolah.
    distractors: [skandal, jurnalis]
    words: [pemberitahuan, jurnalis]
  - id: e09
    type: translate
    direction: from_target
    source_text: Judul itu hanya mencari sensasi.
    answers_meaning:
      ar_eg: [العنوان ده بيدور على الإثارة وبس, العنوان ده هدفه الإثارة بس]
      ar: [لا يبحث ذلك العنوان إلا عن الإثارة, هذا العنوان يسعى إلى الإثارة فقط]
      en: [That headline is just chasing sensation, That headline only seeks sensation]
    words: [sensasi]
  - id: e10
    type: speaking
    text: Forum ini membahas penyebaran hoaks.
    meaning:
      ar_eg: المنتدى ده بيناقش انتشار الإشاعات.
      ar: يناقش هذا المنتدى انتشار الأخبار الكاذبة.
      en: This forum discusses the spread of hoaxes.
    words: [forum, penyebaran]
dialogue:
  lines:
    - speaker: Editor
      text: Pak Mohamed, terima kasih sudah membantu terjemahan kami.
      ar_eg: يا أستاذ محمد، شكرًا إنك ساعدتنا في الترجمة.
      ar: يا أستاذ محمد، شكرًا لمساعدتك في ترجماتنا.
      en: Mohamed, thanks for helping with our translations.
    - speaker: Mohamed
      text: Sama-sama. Berita besar hari ini apa?
      ar_eg: العفو. إيه الخبر الكبير النهارده؟
      ar: عفوًا. ما الخبر الكبير اليوم؟
      en: You're welcome. What's today's big story?
    - speaker: Editor
      text: Ada skandal di pasar permata. Tapi jurnalis kami belum punya bukti.
      ar_eg: فيه فضيحة في سوق الجواهر. بس الصحفي بتاعنا لسه ما عندوش دليل.
      ar: هناك فضيحة في سوق الأحجار الكريمة، لكن صحفيّنا لا يملك دليلًا بعد.
      en: There's a scandal at the gem market. But our journalist has no proof yet.
    - speaker: Mohamed
      text: Di forum online beritanya sudah menyebar.
      ar_eg: على المنتديات الأونلاين الخبر انتشر خلاص.
      ar: انتشر الخبر بالفعل في المنتديات على الإنترنت.
      en: On online forums the story has already spread.
    - speaker: Editor
      text: Justru itu. Penyebaran cepat bukan bukti. Kami tidak mau mencari sensasi.
      ar_eg: هو ده بالظبط. الانتشار السريع مش دليل. إحنا مش عايزين نجري ورا الإثارة.
      ar: بالضبط. الانتشار السريع ليس دليلًا، ولا نريد أن نلهث وراء الإثارة.
      en: Exactly. Spreading fast isn't proof. We won't chase sensation.
    - speaker: Mohamed
      text: Jadi beritanya tayang kapan?
      ar_eg: يعني الخبر هيتعرض إمتى؟
      ar: إذن متى يُبثّ الخبر؟
      en: So when does the story air?
