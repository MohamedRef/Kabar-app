schema: kabar.lesson/v1
id: bipa4.u08.l06
language: id
title: Kelinci si penipu
can_do:
  ar_eg: تحكي حكاية حيوانات فيها نصّاب ونبوءة، وتقول العبرة منها.
  ar: أن تروي حكاية حيوانات فيها محتال ونبوءة، وتذكر عبرتها.
  en: Tell an animal fable with a trickster and a prophecy, and say its moral.
slides:
  - title: Hewan yang cerdik
    body:
      ar_eg: |
        kelinci = أرنب، gajah = فيل، rusa = غزال، أيّل.
        menipu = يضحك على حد، ينصب، penipu = نصّاب، berlian = ألماظ.
        ramalan = نبوءة، تنبؤ (ramalan cuaca = النشرة الجوية)، ditakdirkan = مكتوب له، مقدّر.
      ar: |
        kelinci = أرنب، gajah = فيل، rusa = أيّل، غزال.
        menipu = يخدع، يحتال، penipu = محتال، berlian = ألماس.
        ramalan = نبوءة، تنبّؤ (ramalan cuaca = توقّعات الطقس)، ditakdirkan = مقدّر له.
      en: |
        kelinci = rabbit, gajah = elephant, rusa = deer.
        menipu = to trick, deceive; penipu = cheat, con artist; berlian = diamond.
        ramalan = prophecy, forecast (ramalan cuaca = weather forecast); ditakdirkan = destined.
    examples:
      - text: Kelinci itu menipu gajah dengan cerita bohong.
        ar_eg: الأرنب ضحك على الفيل بحكاية كدب.
        ar: خدع الأرنب الفيل بقصة كاذبة.
        en: The rabbit tricked the elephant with a made-up story.
      - text: Menurut ramalan, raja akan punya anak yang pintar.
        ar_eg: حسب النبوءة، الملك هيجيله ولد ذكي.
        ar: بحسب النبوءة سيُرزق الملك بابن ذكي.
        en: According to the prophecy, the king will have a clever child.
      - text: Hati-hati, ada penipu di pasar!
        ar_eg: خلي بالك، فيه نصّابين في السوق!
        ar: احذر، هناك محتالون في السوق!
        en: Careful, there are con artists at the market!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kelinci
        ar_eg: أرنب
        ar: أرنب
        en: rabbit
