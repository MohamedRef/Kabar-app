        ar: مقدّر له
        en: destined
    words: [menipu, penipu, ramalan, ditakdirkan]
  - id: e03
    type: listen
    text: Gajah itu besar, tapi kelinci lebih cerdik.
    question:
      ar_eg: مين الأذكى؟
      ar: من الأذكى؟
      en: Who is cleverer?
    options: [الأرنب, الفيل, الغزال]
    answer: 0
    meaning:
      ar_eg: الفيل كبير، بس الأرنب أشطر.
      ar: الفيل كبير، لكن الأرنب أذكى.
      en: The elephant is big, but the rabbit is smarter.
    words: [gajah, kelinci]
  - id: e04
    type: fill_blank
    sentence: Orang itu ___ nenek saya dan mengambil uangnya.
    meaning:
      ar_eg: الراجل ده ___ على جدتي وخد فلوسها.
      ar: ___ ذلك الرجل جدتي وأخذ مالها.
      en: That man ___ my grandmother and took her money.
    options: [menipu, ramalan, rusa]
    answers: [menipu]
    words: [menipu, ramalan, rusa, penipu]
    explain:
      ar_eg: menipu = نصب على، وبعدها خد فلوسها. ramalan = نبوءة، وrusa = غزال.
      ar: menipu = احتال على، ثم أخذ مالها. أما ramalan فالنبوءة، وrusa الغزال.
      en: menipu means cheated, then took her money. ramalan is a prophecy, and rusa is a deer.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: النشرة الجوية بالإندونيسي؟
      ar: توقّعات الطقس بالإندونيسية؟
      en: The weather forecast in Indonesian?
    options: [berlian cuaca, ramalan cuaca, penipu cuaca]
    answer: 1
    explain:
      ar_eg: ramalan cuaca = النشرة الجوية.
      ar: ramalan cuaca = توقعات الطقس.
      en: ramalan cuaca = weather forecast.
    words: [berlian, ramalan, penipu]
  - id: e06
    type: fill_blank
    sentence: Cincin ___ itu mahal sekali.
    meaning:
      ar_eg: الخاتم ___ ده غالي جدًا.
      ar: ذلك الخاتم ___ غالٍ جدًا.
      en: That ___ ring is very expensive.
    options: [berlian, kelinci, ditakdirkan]
    answers: [berlian]
    words: [berlian, kelinci, ditakdirkan]
    explain:
      ar_eg: cincin berlian = خاتم ألماظ، وده الغالي. kelinci = أرنب، وditakdirkan = مكتوب عليه.
      ar: cincin berlian = خاتم ألماس، وهو الغالي. أما kelinci فالأرنب، وditakdirkan مقدّر له.
      en: cincin berlian is a diamond ring, the expensive one. kelinci is a rabbit, and ditakdirkan means destined.
  - id: e07
    type: multiple_choice
    question: Menurut cerita, anak itu ___ menjadi raja.
    options: [menipu, penipu, ditakdirkan]
    answer: 2
    explain:
      ar_eg: ditakdirkan = مكتوب له.
      ar: ditakdirkan = مقدّر له.
      en: ditakdirkan = destined.
    words: [menipu, penipu, ditakdirkan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الغزال جري في الغابة بسرعة.
      ar: ركض الأيّل في الغابة بسرعة.
      en: The deer ran fast in the forest.
    answer: Rusa itu berlari cepat di hutan.
    distractors: [gajah, kelinci]
    words: [rusa, gajah, kelinci]
    explain:
      ar_eg: rusa = غزال، وهو اللي بيجري. gajah = فيل، وkelinci = أرنب، ومش في الجملة.
      ar: rusa = الغزال، وهو الذي يجري. أما gajah فالفيل، وkelinci الأرنب، وليسا في الجملة.
      en: rusa is the deer that runs. gajah (elephant) and kelinci (rabbit) aren't in the sentence.
  - id: e09
    type: translate
    direction: from_target
    source_text: Penipu itu menjual berlian palsu.
    answers_meaning:
      ar_eg: [النصاب ده باع ألماظ مضروب, النصّاب كان بيبيع ألماظ تقليد]
      ar: [باع ذلك المحتال ألماسًا مزيّفًا, كان المحتال يبيع ألماسًا مقلّدًا]
      en: [That con man sold fake diamonds, The cheat was selling fake diamonds]
    words: [penipu, berlian]
  - id: e10
    type: speaking
    text: Kelinci itu menipu gajah, tapi ramalan tidak bisa ditipu.
    meaning:
      ar_eg: الأرنب ضحك على الفيل، بس النبوءة ما ينفعش يتضحك عليها.
      ar: خدع الأرنب الفيل، لكن النبوءة لا تُخدع.
      en: The rabbit tricked the elephant, but a prophecy can't be fooled.
    words: [kelinci, menipu, gajah, ramalan, ditakdirkan]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, di Mesir ada cerita Juha. Di sini ada cerita hewan yang cerdik nggak?
      ar_eg: يا أستاذ، في مصر عندنا حكايات جحا. هنا فيه حكايات حيوانات شاطرة؟
      ar: يا أخي، في مصر حكايات جحا. هل هنا حكايات عن حيوانات ذكية؟
      en: Mas, in Egypt we have Juha stories. Are there stories about clever animals here?
    - speaker: Mas Rizal
      text: Banyak! Ada kelinci yang menipu gajah dan rusa.
      ar_eg: كتير! فيه أرنب ضحك على الفيل والغزال.
      ar: كثيرة! هناك أرنب خدع الفيل والأيّل.
      en: Lots! There's a rabbit who tricks an elephant and a deer.
    - speaker: Mohamed
      text: Kelinci itu penipu?
      ar_eg: الأرنب ده نصّاب؟
      ar: هل ذلك الأرنب محتال؟
      en: So the rabbit is a con artist?
    - speaker: Mas Rizal
      text: 'Iya. Dia bilang ada ramalan: gajah ditakdirkan kalah dari kelinci. Gajahnya takut terus lari!'
      ar_eg: أيوه. قال فيه نبوءة إن الفيل مكتوب عليه يخسر قدام الأرنب. الفيل خاف وجري!
      ar: نعم. قال إن هناك نبوءة بأن الفيل مقدّر له أن يُهزم أمام الأرنب، فخاف الفيل وهرب!
      en: Yes. He says there's a prophecy that the elephant is destined to lose to the rabbit. The elephant gets scared and runs!
    - speaker: Mohamed
      text: 'Ha ha! Amanatnya: jangan cepat percaya cerita orang.'
      ar_eg: 'ها ها! العبرة: ما تصدّقش كلام الناس بسرعة.'
      ar: 'ها ها! العبرة: لا تصدّق كلام الناس بسرعة.'
      en: 'Ha ha! The moral: don''t be quick to believe what people tell you.'
