        ar: أيّل
        en: deer
      - text: berlian
        ar_eg: ألماظ
        ar: ألماس
        en: diamond
    words: [kelinci, gajah, rusa, berlian]
  - id: e02
    type: match_pairs
    pairs:
      - text: menipu
        ar_eg: ينصب، يضحك على
        ar: يخدع
        en: to trick
      - text: penipu
        ar_eg: نصّاب
        ar: محتال
        en: con artist
      - text: ramalan
        ar_eg: نبوءة
        ar: نبوءة
