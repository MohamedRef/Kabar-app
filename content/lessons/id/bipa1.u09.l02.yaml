schema: kabar.lesson/v1
id: bipa1.u09.l02
language: id
title: Di atas meja
can_do:
  ar_eg: توصف مكان الحاجة (فوق، تحت، جنب، بين…).
  ar: أن تصف مواضع الأشياء (فوق، تحت، بجانب، بين…).
  en: Describe positions.
slides:
  - title: Di atas, di bawah
    body:
      ar_eg: |
        الترتيب نفس العربي بالظبط: di + كلمة المكان + الحاجة.
        - di atas meja = فوق الترابيزة
        - di bawah meja = تحت الترابيزة
        - di dalam tas = جوه الشنطة
        - di luar rumah = بره البيت
      ar: |
        الترتيب مطابق للعربية: di + ظرف المكان + الاسم.
        - di atas meja = فوق الطاولة
        - di bawah meja = تحت الطاولة
        - di dalam tas = داخل الحقيبة
        - di luar rumah = خارج البيت
      en: |
        Same order as Arabic: di + position word + noun.
        - di atas meja = on the table
        - di bawah meja = under the table
        - di dalam tas = inside the bag
        - di luar rumah = outside the house
    grammar: id.location.words
    examples:
      - text: Bukunya di atas meja.
        ar_eg: الكتاب على الترابيزة.
        ar: الكتاب على الطاولة.
        en: The book is on the table.
      - text: Kucingnya di bawah kursi.
        ar_eg: القطة تحت الكرسي.
        ar: القطة تحت الكرسي.
        en: The cat is under the chair.
  - title: Depan, belakang, samping
    body:
      ar_eg: |
        - di depan = قدّام
        - di belakang = ورا
        - di samping / di sebelah = جنب
        - di antara … dan … = بين … و…
        وkursi جاية من العربي «كرسي»، سهلة!
      ar: |
        - di depan = أمام
        - di belakang = خلف
        - di samping / di sebelah = بجانب
        - di antara … dan … = بين … و…
        وkursi من العربية «كرسي».
      en: |
        - di depan = in front of
        - di belakang = behind
        - di samping / di sebelah = next to
        - di antara … dan … = between … and …
        And kursi comes from Arabic «كرسي» (chair).
    grammar: id.location.words
    examples:
      - text: Tasnya di samping kursi.
        ar_eg: الشنطة جنب الكرسي.
        ar: الحقيبة بجانب الكرسي.
        en: The bag is next to the chair.
      - text: Kamar saya di antara dapur dan kamar mandi.
        ar_eg: أوضتي بين المطبخ والحمّام.
        ar: غرفتي بين المطبخ والحمّام.
        en: My room is between the kitchen and the bathroom.
  - title: Sebelah kiri, sebelah kanan
    body:
      ar_eg: |
        sebelah بتيجي كمان مع اليمين والشمال: di sebelah kanan = على اليمين، di sebelah kiri = على الشمال.
        Masjid Istiqlal di sebelah kiri = جامع الاستقلال على الشمال.
        ومع الحركة غيّر di بـ ke أو dari: masuk ke dalam = يدخل جوه، dari belakang = من ورا.
      ar: |
        وتأتي sebelah مع اليمين واليسار: di sebelah kanan = على اليمين، di sebelah kiri = على اليسار.
        ومع الحركة تُستبدل di بـ ke أو dari: masuk ke dalam = يدخل إلى الداخل، dari belakang = من الخلف.
      en: |
        sebelah also goes with left and right: di sebelah kanan = on the right, di sebelah kiri = on the left.
        With movement, swap di for ke or dari: masuk ke dalam = go inside, dari belakang = from behind.
    grammar: id.location.words
    examples:
      - text: Kamar mandinya di sebelah kanan.
        ar_eg: الحمّام على اليمين.
        ar: الحمّام على اليمين.
        en: The bathroom is on the right.
  - title: Di mana?
    body:
      ar_eg: |
        عشان تسأل: …-nya di mana? = … فين؟ Tiketnya di mana? = التذكرة فين؟
        وخلي بالك: كلمة المكان قبل الحاجة دايمًا. «di meja atas» غلط، والصح di atas meja.
      ar: |
        وللسؤال: …-nya di mana؟ = أين …؟ Tiketnya di mana؟ = أين التذكرة؟
        وتذكّر: الظرف يسبق الاسم دائمًا؛ «di meja atas» خطأ، والصواب di atas meja.
      en: |
        To ask: …-nya di mana? = Where is …? Tiketnya di mana? = Where's the ticket?
        Remember: the position word always comes first. Not «di meja atas» but di atas meja.
    grammar: id.location.words
    examples:
      - text: Tiketnya di mana? — Di dalam tas.
        ar_eg: التذكرة فين؟ — جوه الشنطة.
        ar: أين التذكرة؟ — داخل الحقيبة.
        en: Where's the ticket? — In the bag.
