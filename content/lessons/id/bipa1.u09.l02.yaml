      en: How do you say "on the table"?
    options: ["di atas meja", "di meja atas", "atas di meja"]
    answer: 0
    explain:
      ar_eg: di + كلمة المكان + الحاجة، زي العربي «فوق الترابيزة».
      ar: di + الظرف + الاسم، كالعربية «فوق الطاولة».
      en: di + position word + noun, just like «فوق الطاولة».
    words: [atas, meja]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الجنينة بين البيت والجامع. أنهي جملة صح؟
      ar: الحديقة بين البيت والمسجد. أيّ جملة صحيحة؟
      en: The park is between the house and the mosque. Which sentence is right?
    options: ["Tamannya di dalam rumah dan masjid.", "Tamannya di antara rumah dan masjid.", "Tamannya di belakang rumah dan masjid."]
    answer: 1
    explain:
      ar_eg: «بين … و…» = di antara … dan ….
      ar: «بين … و…» = di antara … dan ….
      en: between … and … = di antara … dan ….
    words: [antara]
