schema: kabar.lesson/v1
id: bipa1.u09.l02
language: id
title: Di atas meja
can_do:
  ar_eg: تقول فوق وتحت وجوه وبره.
  ar: أن تقول فوق وتحت وداخل وخارج.
  en: Say on, under, inside and outside.
slides:
  - title: Di atas, di bawah
    body:
      ar_eg: |
        الترتيب نفس العربي بالظبط: di + كلمة المكان + الحاجة.
        - di atas meja = فوق الترابيزة
        - di bawah meja = تحت الترابيزة
        - di dalam tas = جوه الشنطة
        - di luar rumah = بره البيت
      ar: |
        الترتيب مطابق للعربية: di + ظرف المكان + الاسم.
        - di atas meja = فوق الطاولة
        - di bawah meja = تحت الطاولة
        - di dalam tas = داخل الحقيبة
        - di luar rumah = خارج البيت
      en: |
        Same order as Arabic: di + position word + noun.
        - di atas meja = on the table
        - di bawah meja = under the table
        - di dalam tas = inside the bag
        - di luar rumah = outside the house
    grammar: id.location.words
    examples:
      - text: Bukunya di atas meja.
        ar_eg: الكتاب على الترابيزة.
        ar: الكتاب على الطاولة.
        en: The book is on the table.
      - text: Kucingnya di bawah kursi.
        ar_eg: القطة تحت الكرسي.
        ar: القطة تحت الكرسي.
        en: The cat is under the chair.
  - title: Di mana?
    body:
      ar_eg: |
        عشان تسأل: …-nya di mana? = … فين؟ Tiketnya di mana? = التذكرة فين؟
        وخلي بالك: كلمة المكان قبل الحاجة دايمًا. «di meja atas» غلط، والصح di atas meja.
      ar: |
        وللسؤال: …-nya di mana؟ = أين …؟ Tiketnya di mana؟ = أين التذكرة؟
        وتذكّر: الظرف يسبق الاسم دائمًا؛ «di meja atas» خطأ، والصواب di atas meja.
      en: |
        To ask: …-nya di mana? = Where is …? Tiketnya di mana? = Where's the ticket?
        Remember: the position word always comes first. Not «di meja atas» but di atas meja.
    grammar: id.location.words
    examples:
      - text: Tiketnya di mana? — Di dalam tas.
        ar_eg: التذكرة فين؟ — جوه الشنطة.
        ar: أين التذكرة؟ — داخل الحقيبة.
        en: Where's the ticket? — In the bag.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «فوق الترابيزة»؟
      ar: كيف تقول «فوق الطاولة»؟
      en: How do you say "on the table"?
    options: [di atas meja, di meja atas, atas di meja]
    answer: 0
    explain:
      ar_eg: di + كلمة المكان + الحاجة، زي العربي «فوق الترابيزة».
      ar: di + الظرف + الاسم، كالعربية «فوق الطاولة».
      en: di + position word + noun, just like «فوق الطاولة».
    words: [atas, meja]
  - id: e02
    type: listen
    text: Tasnya di bawah kursi.
    options: [Tasnya di bawah kursi., Tasnya di atas kursi., Tasnya di samping kursi.]
    answer: 0
    words: [bawah, kursi, tas]
  - id: e03
    type: fill_blank
    sentence: Kucingnya di ___ meja.
    meaning:
      ar_eg: القطة تحت الترابيزة.
      ar: القطة تحت الطاولة.
      en: The cat is under the table.
    options: [bawah, luar, depan, atas]
    answers: [bawah]
    words: [bawah]
  - id: e04
    type: build_sentence
    source:
      ar_eg: الكتاب على الترابيزة.
      ar: الكتاب على الطاولة.
      en: The book is on the table.
    answer: Bukunya di atas meja.
    distractors: [bawah, ke]
    words: [atas, meja]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: التذكرة فين؟
      ar: أين التذكرة؟
      en: Where is the ticket?
    answers: ['Tiketnya di mana?', Tiketnya di mana, 'Di mana tiketnya?', 'Tiket di mana?', 'Di mana tiket?']
    words: [tiket]
  - id: e06
    type: speaking
    text: Bukunya di atas meja, dan tasnya di bawah kursi.
    meaning:
      ar_eg: الكتاب على الترابيزة، والشنطة تحت الكرسي.
      ar: الكتاب على الطاولة، والحقيبة تحت الكرسي.
      en: The book is on the table, and the bag is under the chair.
    words: [atas, bawah, meja, kursi]
dialogue:
  lines:
    - speaker: Bu Yanti
      text: Mohamed, kucing saya di mana?
      ar_eg: محمد، القطة بتاعتي فين؟
      ar: محمد، أين قطتي؟
      en: Mohamed, where's my cat?
    - speaker: Mohamed
      text: Di bawah kursi, Bu?
      ar_eg: تحت الكرسي يا مدام؟
      ar: تحت الكرسي يا سيدتي؟
      en: Under the chair, ma'am?
    - speaker: Bu Yanti
      text: Tidak ada. Di luar?
      ar_eg: مش موجودة. بره؟
      ar: ليست هناك. في الخارج؟
      en: She's not there. Outside?
    - speaker: Mohamed
      text: Ah, kucingnya di atas meja!
      ar_eg: آه، القطة فوق الترابيزة!
      ar: آه، القطة فوق الطاولة!
      en: Ah, the cat's on the table!
