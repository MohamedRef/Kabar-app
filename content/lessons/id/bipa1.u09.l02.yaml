dialogue:
  title: Tiket ke Monas
  lines:
    - speaker: Mohamed
      text: Bu Sari, tiket Monas saya di mana, ya?
      ar_eg: يا طنط ساري، تذكرة موناس بتاعتي فين يا ترى؟
      ar: يا سيدة ساري، أين تذكرتي لموناس يا ترى؟
      en: Bu Sari, where's my Monas ticket, I wonder?
    - speaker: Bu Sari
      text: Di atas meja?
      ar_eg: على الترابيزة؟
      ar: على الطاولة؟
      en: On the table?
    - speaker: Mohamed
      text: Tidak ada, Bu. Di bawah meja juga tidak ada.
      ar_eg: مش موجودة يا طنط. وتحت الترابيزة كمان مفيش.
      ar: ليست هناك يا سيدتي، ولا تحت الطاولة.
      en: It's not there, ma'am. Not under the table either.
    - speaker: Bu Sari
      text: Tasmu di mana? Coba lihat di dalam tas.
      ar_eg: شنطتك فين؟ جرّب تبص جوه الشنطة.
      ar: أين حقيبتك؟ حاول أن تنظر داخل الحقيبة.
      en: Where's your bag? Try looking inside the bag.
    - speaker: Mohamed
      text: Tasnya di samping kursi… Ah, ini dia tiketnya! Terima kasih, Bu.
      ar_eg: الشنطة جنب الكرسي… آه، أهي التذكرة! شكرًا يا طنط.
      ar: الحقيبة بجانب الكرسي… آه، ها هي التذكرة! شكرًا يا سيدتي.
      en: The bag's next to the chair… Ah, here's the ticket! Thank you, ma'am.
