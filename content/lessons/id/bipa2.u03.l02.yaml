schema: kabar.lesson/v1
id: bipa2.u03.l02
language: id
title: Harap tenang
can_do:
  ar_eg: تقرا اليافطات اللي بتطلب منك تعمل حاجة.
  ar: أن تقرأ اللافتات التي تطلب منك فعل شيء.
  en: Read signs that ask you to do something.
slides:
  - title: Harap … / Mohon …
    body:
      ar_eg: |
        اللافتات في إندونيسيا ليها قوالب ثابتة، زي عندنا بالظبط:
        - Harap + فعل = «يرجى…»: Harap tenang = برجاء الهدوء. Harap antre = برجاء الوقوف في الطابور.
        - Mohon + فعل = «برجاء…» (مؤدبة أكتر): Mohon perhatian = انتباه من فضلكم (أول أي إعلان).
      ar: |
        للافتات قوالب ثابتة كما في العربية:
        - Harap + فعل = «يُرجى…»: Harap tenang، Harap antre.
        - Mohon + فعل = «نرجو…» (أكثر تأدبًا): Mohon perhatian = انتباه من فضلكم.
      en: |
        Indonesian signs use fixed templates, just like Arabic ones:
        - Harap + verb = "please …": Harap tenang = Quiet please. Harap antre = Please queue.
        - Mohon + verb = "kindly …" (more polite): Mohon perhatian = Attention please (opens every announcement).
    grammar: id.notice.harap-dilarang
    examples:
      - text: Harap tenang.
        ar_eg: برجاء الهدوء.
        ar: يُرجى الهدوء.
        en: Quiet, please.
      - text: Harap lepas alas kaki.
        ar_eg: برجاء خلع الجزمة.
        ar: يُرجى خلع الأحذية.
        en: Please remove your footwear.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: إنت في المكتبة وفيه لافتة بتطلب الهدوء. مكتوب عليها إيه؟
      ar: أنت في المكتبة وأمامك لافتة تطلب الهدوء. ماذا كُتب عليها؟
      en: You're in a library and a sign asks for quiet. What does it say?
    options: [Harap tenang., Dilarang tenang., Awas tenang.]
    answer: 0
    words: [harap, tenang]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: قدام باب المعبد فيه لافتة «Harap lepas alas kaki». لازم تعمل إيه؟ اختار الجملة اللي بنفس المعنى.
      ar: أمام باب المعبد لافتة «Harap lepas alas kaki». اختر الجملة التي بالمعنى نفسه.
      en: At the temple gate a sign says "Harap lepas alas kaki". Pick the sentence with the same meaning.
    options: [Mohon lepas sepatu dan sandal., Dilarang lepas sepatu., Awas sepatu dan sandal.]
    answer: 0
    explain:
      ar_eg: alas kaki = أي حاجة في رجلك (جزمة، صندل). Harap وMohon الاتنين = برجاء.
      ar: alas kaki = ما يُلبس في القدم، وHarap وMohon كلتاهما بمعنى «يُرجى».
      en: alas kaki = footwear (shoes, sandals); Harap and Mohon both mean "please".
    words: [harap, mohon, alas kaki]
  - id: e03
    type: listen
    text: Mohon perhatian.
    options: [Mohon maaf., Harap tenang., Mohon perhatian.]
    answer: 2
    words: [mohon, perhatian]
  - id: e04
    type: fill_blank
    sentence: Harap ___ di sini.
    meaning:
      ar_eg: برجاء الوقوف في الطابور هنا.
      ar: يُرجى الوقوف في الصف هنا.
      en: Please queue here.
    answers: [antre, antri]
    explain:
      ar_eg: الكتابة الرسمية antre، وبتشوف antri كتير برضه.
      ar: الصيغة المعيارية antre، وتشيع antri أيضًا.
      en: The standard spelling is antre; antri is very common too.
    words: [antre]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لافتة) برجاء الهدوء.
      ar: (لافتة) يُرجى الهدوء.
      en: (sign) Quiet, please.
    answers: [Harap tenang., Harap tenang, Mohon tenang., Harap tenang!]
    words: [harap, tenang]
  - id: e06
    type: speaking
    text: Mohon perhatian. Harap antre di sini.
    meaning:
      ar_eg: انتباه من فضلكم. برجاء الوقوف في الطابور هنا.
      ar: انتباه من فضلكم. يُرجى الوقوف في الصف هنا.
      en: Attention please. Please queue here.
    words: [mohon, perhatian, harap, antre]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas Ardi, apa arti "Harap lepas alas kaki"?
      ar_eg: يا أردي، يعني إيه «Harap lepas alas kaki»؟
      ar: يا أردي، ما معنى «Harap lepas alas kaki»؟
      en: Mas Ardi, what does "Harap lepas alas kaki" mean?
    - speaker: Mas Ardi
      text: Artinya kita lepas sepatu di sini.
      ar_eg: معناها نقلع الجزمة هنا.
      ar: معناها أن نخلع الأحذية هنا.
      en: It means we take our shoes off here.
    - speaker: Mohamed
      text: Oke. Dan "Harap tenang"?
      ar_eg: ماشي. و«Harap tenang»؟
      ar: حسنًا. و«Harap tenang»؟
      en: OK. And "Harap tenang"?
    - speaker: Mas Ardi
      text: Kita harus tenang. Ini pura!
      ar_eg: لازم نبقى هاديين. دا معبد!
      ar: يجب أن نهدأ. هذا معبد!
      en: We have to be quiet. This is a temple!
new_words:
  - word: harap
    pos: verb
    ar_eg: برجاء… (في اللافتات)
    ar: يُرجى (في اللافتات)
    en: please … (on signs)
  - word: mohon
    pos: verb
    ar_eg: برجاء / نرجو (مؤدبة)
    ar: نرجو (مؤدبة)
    en: kindly …; we request
  - word: tenang
    pos: adjective
    ar_eg: هادي
    ar: هادئ
    en: calm, quiet
  - word: antre
    pos: verb
    ar_eg: يقف في الطابور
    ar: يقف في الصف
    en: to queue
  - word: perhatian
    pos: noun
    ar_eg: انتباه
    ar: انتباه
    en: attention
  - word: lepas
    pos: verb
    ar_eg: يقلع / يخلع
    ar: يخلع
    en: to take off, remove
  - word: alas kaki
    pos: noun
    ar_eg: جزمة / صندل (أي حاجة في الرجل)
    ar: الحذاء أو النعل
    en: footwear
review:
  status: draft
  verified: false
