schema: kabar.lesson/v1
id: bipa2.u03.l02
language: id
title: Harap tenang
can_do:
  ar_eg: تقرا اليافطات اللي بتطلب منك تعمل حاجة.
  ar: أن تقرأ اللافتات التي تطلب منك فعل شيء.
  en: Read signs that ask you to do something.
slides:
  - title: Harap … / Mohon …
    body:
      ar_eg: |
        اللافتات في إندونيسيا ليها قوالب ثابتة، زي عندنا بالظبط:
        - Harap + فعل = «يرجى…»: Harap tenang = برجاء الهدوء. Harap antre = برجاء الوقوف في الطابور.
        - Mohon + فعل = «برجاء…» (مؤدبة أكتر): Mohon perhatian = انتباه من فضلكم (أول أي إعلان).
      ar: |
        للافتات قوالب ثابتة كما في العربية:
        - Harap + فعل = «يُرجى…»: Harap tenang، Harap antre.
        - Mohon + فعل = «نرجو…» (أكثر تأدبًا): Mohon perhatian = انتباه من فضلكم.
      en: |
        Indonesian signs use fixed templates, just like Arabic ones:
        - Harap + verb = "please …": Harap tenang = Quiet please. Harap antre = Please queue.
        - Mohon + verb = "kindly …" (more polite): Mohon perhatian = Attention please (opens every announcement).
    grammar: id.notice.harap-dilarang
    examples:
      - text: Harap tenang.
        ar_eg: برجاء الهدوء.
        ar: يُرجى الهدوء.
        en: Quiet, please.
      - text: Harap lepas alas kaki.
        ar_eg: برجاء خلع الجزمة.
        ar: يُرجى خلع الأحذية.
        en: Please remove your footwear.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: إنت في المكتبة وفيه لافتة بتطلب الهدوء. مكتوب عليها إيه؟
      ar: أنت في المكتبة وأمامك لافتة تطلب الهدوء. ماذا كُتب عليها؟
      en: You're in a library and a sign asks for quiet. What does it say?
    options: [Harap tenang., Dilarang tenang., Awas tenang.]
    answer: 0
    words: [harap, tenang]
    explain:
      ar_eg: "Harap + فعل = «برجاء»: Harap tenang = برجاء الهدوء. Dilarang = ممنوع، وAwas = احترس، وما ينفعوش مع tenang."
      ar: "Harap + فعل = «يُرجى»: Harap tenang. أما Dilarang فـ«ممنوع» وAwas «احذر»، ولا تناسبان tenang."
      en: "Harap + verb = \"please\": Harap tenang. Dilarang is \"forbidden\", Awas is \"watch out\"; neither fits tenang."
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: قدام باب المعبد فيه لافتة «Harap lepas alas kaki». لازم تعمل إيه؟ اختار الجملة اللي بنفس المعنى.
      ar: أمام باب المعبد لافتة «Harap lepas alas kaki». اختر الجملة التي بالمعنى نفسه.
      en: At the temple gate a sign says "Harap lepas alas kaki". Pick the sentence with the same meaning.
    options: [Mohon lepas sepatu dan sandal., Dilarang lepas sepatu., Awas sepatu dan sandal.]
    answer: 0
    explain:
      ar_eg: alas kaki = أي حاجة في رجلك (جزمة، صندل). Harap وMohon الاتنين = برجاء.
      ar: alas kaki = ما يُلبس في القدم، وHarap وMohon كلتاهما بمعنى «يُرجى».
      en: alas kaki = footwear (shoes, sandals); Harap and Mohon both mean "please".
    words: [harap, mohon, alas kaki]
  - id: e03
    type: listen
    text: Mohon perhatian.
    options: [Mohon maaf., Harap tenang., Mohon perhatian.]
    answer: 2
    words: [mohon, perhatian]
  - id: e04
    type: fill_blank
    sentence: Harap ___ di sini.
    meaning:
      ar_eg: برجاء الوقوف في الطابور هنا.
      ar: يُرجى الوقوف في الصف هنا.
      en: Please queue here.
    answers: [antre, antri]
    explain:
      ar_eg: الكتابة الرسمية antre، وبتشوف antri كتير برضه.
      ar: الصيغة المعيارية antre، وتشيع antri أيضًا.
      en: The standard spelling is antre; antri is very common too.
    words: [antre]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لافتة) برجاء الهدوء.
      ar: (لافتة) يُرجى الهدوء.
      en: (sign) Quiet, please.
    answers: [Harap tenang., Harap tenang, Mohon tenang., Harap tenang!]
    words: [harap, tenang]
  - id: e06
    type: speaking
    text: Bahasanya resmi. Mohon perhatian, harap antre di sini.
    meaning:
      ar_eg: (بلغة رسمية) انتباه من فضلكم، برجاء الوقوف في الطابور هنا.
      ar: (بلغة رسمية) انتباه من فضلكم، يُرجى الوقوف في الصف هنا.
      en: (In formal language) Attention please, please queue here.
    words: [resmi, mohon, perhatian, harap, antre]
  - id: e07
    type: listen
    text: Mohon lepas alas kaki di sini.
    options: ['Mohon lepas alas kaki di sini.', 'Mohon antre di sini.', 'Mohon perhatian di sini.']
    answer: 0
    meaning:
      ar_eg: برجاء قلع الجزم هنا.
      ar: نرجو خلع الأحذية هنا.
      en: Kindly remove your footwear here.
    words: [lepas, alas kaki, antre, perhatian, mohon]
  - id: e08
    type: fill_blank
    sentence: Harap ___ alas kaki.
    meaning:
      ar_eg: برجاء قلع الجزمة.
      ar: يُرجى خلع الأحذية.
      en: Please remove footwear.
    options: [lepas, antre, tenang]
    answers: [lepas]
    words: [lepas, alas kaki, harap]
    explain:
      ar_eg: "lepas = يقلع: lepas alas kaki = اقلع الجزمة، زي اللي في المساجد والمعابد. antre = يقف في طابور، وtenang = هادي."
      ar: "lepas = يخلع: lepas alas kaki. أما antre فالوقوف في الطابور وtenang الهدوء."
      en: "lepas = take off: lepas alas kaki, as at mosques and temples. antre is to queue, tenang is quiet."
  - id: e09
    type: fill_blank
    sentence: «Harap tenang» itu bahasa ___.
    meaning:
      ar_eg: «Harap tenang» دي لغة رسمية.
      ar: «Harap tenang» لغة رسمية.
      en: «Harap tenang» is formal language.
    options: [resmi, tenang, lepas]
    answers: [resmi]
    explain:
      ar_eg: resmi = رسمي. اللافتات والإعلانات بتتكتب بالرسمي (harap، mohon)، والصحاب بيقولوا لبعض «Sst, tenang!».
      ar: resmi = رسمي. تُكتب اللافتات والإعلانات بالفصيح (harap، mohon)، ويقول الأصدقاء «Sst, tenang!».
      en: resmi = official, formal. Signs and announcements use it (harap, mohon); friends just say «Sst, tenang!».
    words: [resmi, tenang]
  - id: e10
    type: multiple_choice
    question: Mana yang bahasa resmi?
    question_meaning:
      ar_eg: أنهي واحدة بالرسمي؟
      ar: أيّها باللغة الرسمية؟
      en: Which one is formal language?
    options: [Harap tenang., 'Tenang, ya!', 'Sst, tenang!']
    answer: 0
    explain:
      ar_eg: Harap + فعل هي لغة اللافتات الرسمية. التانيين كلام صحاب.
      ar: Harap + فعل لغة اللافتات الرسمية، والأخريان كلام بين الأصدقاء.
      en: Harap + verb is the language of official signs; the other two are how friends talk.
    words: [resmi, harap, tenang]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas Rizal, apa arti "Harap lepas alas kaki"?
      ar_eg: يا ريزال، يعني إيه «Harap lepas alas kaki»؟
      ar: يا ريزال، ما معنى «Harap lepas alas kaki»؟
      en: Mas Rizal, what does "Harap lepas alas kaki" mean?
    - speaker: Mas Rizal
      text: Artinya kita lepas sepatu di sini.
      ar_eg: معناها نقلع الجزمة هنا.
      ar: معناها أن نخلع الأحذية هنا.
      en: It means we take our shoes off here.
    - speaker: Mohamed
      text: Oke. Dan "Harap tenang"?
      ar_eg: ماشي. و«Harap tenang»؟
      ar: حسنًا. و«Harap tenang»؟
      en: OK. And "Harap tenang"?
    - speaker: Mas Rizal
      text: Kita harus tenang. Ini pura!
      ar_eg: لازم نبقى هاديين. دا معبد!
      ar: يجب أن نهدأ. هذا معبد!
      en: We have to be quiet. This is a temple!
new_words:
  - word: harap
    pos: verb
    ar_eg: برجاء… (في اللافتات)
    ar: يُرجى (في اللافتات)
    en: please … (on signs)
  - word: mohon
    pos: verb
    ar_eg: برجاء / نرجو (مؤدبة)
    ar: نرجو (مؤدبة)
    en: kindly …; we request
  - word: tenang
    pos: adjective
    ar_eg: هادي
    ar: هادئ
    en: calm, quiet
  - word: antre
    pos: verb
    ar_eg: يقف في الطابور
    ar: يقف في الصف
    en: to queue
  - word: perhatian
    pos: noun
    ar_eg: انتباه
    ar: انتباه
    en: attention
  - word: lepas
    pos: verb
    ar_eg: يقلع / يخلع
    ar: يخلع
    en: to take off, remove
  - word: alas kaki
    pos: noun
    ar_eg: جزمة / صندل (أي حاجة في الرجل)
    ar: الحذاء أو النعل
    en: footwear
  - word: resmi
    pos: adjective
    ar_eg: رسمي (bahasa resmi = اللغة الرسمية، لغة اللافتات والإعلانات)
    ar: رسمي (bahasa resmi = اللغة الرسمية)
    en: official, formal (bahasa resmi = formal language, as on signs and announcements)
