schema: kabar.lesson/v1
id: bipa4.u10.l02
language: id
title: Rendah hati, keras kepala
can_do:
  ar_eg: توصف طباع الناس وشغلهم بتعبيرات اصطلاحية (rendah hati، banting tulang).
  ar: أن تصف طباع الناس وعملهم بتعابير اصطلاحية (rendah hati، banting tulang).
  en: Describe people's character and work with idioms (rendah hati, banting tulang).
slides:
  - title: Sifat + hati, kepala
    body:
      ar_eg: |
        الإندونيسي بيوصف الطبع بصفة + عضو من الجسم:
        rendah hati («قلبه واطي») = متواضع، tinggi hati («قلبه عالي») = متكبّر.
        keras kepala («راسه ناشفة») = عنيد، زي ما بنقول بالمصري «دماغه ناشفة»!
      ar: |
        تصف الإندونيسية الطباع بصفة + عضو من الجسد:
        rendah hati («منخفض القلب») = متواضع، وtinggi hati («مرتفع القلب») = متكبّر.
        keras kepala («صلب الرأس») = عنيد، كقولنا «رأسه يابس».
      en: |
        Indonesian describes character with an adjective + a body part:
        rendah hati ("low heart") = humble; tinggi hati ("high heart") = arrogant.
        keras kepala ("hard head") = stubborn, just like Egyptian «دماغه ناشفة»!
    grammar: id.idiom.basic
    examples:
      - text: Beliau adalah tokoh yang rendah hati dan dekat dengan rakyat.
        ar_eg: هو شخصية متواضعة وقريبة من الناس.
        ar: إنه شخصية متواضعة وقريبة من الشعب.
        en: He was a humble figure, close to the people.
      - text: Anak itu memang keras kepala.
        ar_eg: الواد ده فعلًا دماغه ناشفة.
        ar: ذلك الولد عنيد فعلًا.
        en: That child really is stubborn.
  - title: Banting tulang, makan garam
    body:
      ar_eg: |
        تعبيرات بأفعال:
        banting tulang («يخبط العضم») = يشتغل جامد أوي، زي «بيطلع عينه في الشغل».
        makan garam («ياكل ملح») = عنده خبرة: sudah banyak makan garam = شاف كتير في حياته.
      ar: |
        تعابير بأفعال:
        banting tulang («يضرب العظم») = يكدح ويعمل بجهد شديد.
        makan garam («يأكل الملح») = ذو خبرة: sudah banyak makan garam = خبر الحياة طويلًا.
      en: |
        Verb idioms:
        banting tulang ("slam the bones") = work yourself to the bone.
        makan garam ("eat salt") = be experienced: sudah banyak makan garam = has seen a lot of life.
    grammar: id.idiom.basic
    examples:
      - text: Para petani bunga di Tomohon membanting tulang setiap hari.
        ar_eg: مزارعين الورد في توموهون بيشتغلوا جامد كل يوم.
        ar: يكدح مزارعو الزهور في توموهون كل يوم.
        en: Tomohon's flower farmers work themselves to the bone every day.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rendah hati
        ar_eg: متواضع
        ar: متواضع
        en: humble
      - text: tinggi hati
        ar_eg: متكبّر
        ar: متكبّر
        en: arrogant
      - text: keras kepala
        ar_eg: عنيد / دماغه ناشفة
        ar: عنيد
        en: stubborn
      - text: banting tulang
        ar_eg: يشتغل جامد أوي
        ar: يكدح
        en: work very hard
      - text: makan garam
        ar_eg: عنده خبرة
        ar: ذو خبرة
        en: be experienced
    words: [rendah hati, tinggi hati, keras kepala, banting tulang, makan garam]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: واحد عمره ما بيغيّر رأيه مهما قلت له. هو…
      ar: شخص لا يغيّر رأيه أبدًا مهما قلت له. إنه…
      en: Someone who never changes his mind, whatever you say. He is…
    options: [rendah hati, keras kepala, makan garam]
    answer: 1
    words: [keras kepala]
  - id: e03
    type: listen
    text: Para petani bunga membanting tulang setiap hari.
    options: ["Para petani bunga membanting tulang setiap hari.", "Para petani bunga beristirahat setiap hari.", "Para petani kopi membanting tulang setiap hari."]
    answer: 0
    meaning:
      ar_eg: مزارعين الورد بيشتغلوا جامد كل يوم.
      ar: يكدح مزارعو الزهور كل يوم.
      en: The flower farmers work themselves to the bone every day.
    words: [banting tulang]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الصياد العجوز عنده خبرة سنين طويلة. أنهي جملة؟
      ar: للصياد العجوز خبرة سنوات طويلة. أيّ جملة تناسب؟
      en: The old fisherman has decades of experience. Which sentence fits?
    options: ["Nelayan tua itu sudah banyak tinggi hati.", "Nelayan tua itu sudah banyak keras kepala.", "Nelayan tua itu sudah banyak makan garam."]
    answer: 2
    words: [makan garam]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «الأستاذ إروان متواضع، عمره ما اتكبّر»؟
      ar: أيّ جملة تعني «الأستاذ إروان متواضع، لم يتكبّر قط»؟
      en: Which sentence means "Pak Irwan is humble; he's never arrogant"?
    options: ["Pak Irwan rendah hati, tidak pernah tinggi hati.", "Pak Irwan tinggi hati, tidak pernah rendah hati.", "Pak Irwan keras kepala, tidak pernah rendah hati."]
    answer: 0
    words: [rendah hati, tinggi hati]
  - id: e06
    type: fill_blank
    sentence: Beliau sangat terkenal, tetapi tetap ___ hati.
    meaning:
      ar_eg: هو مشهور جدًا، بس فضل متواضع.
      ar: إنه مشهور جدًا، لكنه بقي متواضعًا.
      en: He's very famous, but he stays humble.
    options: [tinggi, keras, rendah]
    answers: [rendah]
    words: [rendah hati, tetap]
  - id: e07
    type: build_sentence
    source:
      ar_eg: ماتتكبّرش على الناس.
      ar: لا تتكبّر على الآخرين.
      en: Don't be arrogant towards others.
    answer: Jangan tinggi hati kepada orang lain.
    distractors: [rendah, kepala]
    words: [tinggi hati]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: جدي شاف كتير في حياته (عنده خبرة كبيرة).
      ar: جدي خبر الحياة طويلًا (ذو خبرة كبيرة).
      en: My grandfather has seen a lot of life (he's very experienced).
    answers:
      - Kakek saya sudah banyak makan garam.
      - Kakek saya sudah banyak makan garam
      - Kakekku sudah banyak makan garam.
      - Kakek saya sudah banyak makan asam garam
      - Kakek saya sudah banyak makan asam garam.
      - Kakek saya udah banyak makan garam.
      - Kakek saya udah banyak makan garam
    explain:
      ar_eg: كمان بيقولوا makan asam garam («ياكل الحامض والملح») بنفس المعنى.
      ar: ويقال أيضًا makan asam garam («يأكل الحامض والملح») بالمعنى نفسه.
      en: People also say makan asam garam ("eat sour and salt") with the same meaning.
    words: [makan garam]
  - id: e09
    type: speaking
    text: Tokoh itu keras kepala, tetapi dia tetap membanting tulang untuk rakyatnya.
    meaning:
      ar_eg: الشخصية دي دماغها ناشفة، بس كان بيشتغل جامد عشان شعبه.
      ar: كانت تلك الشخصية عنيدة، لكنها كدحت من أجل شعبها.
      en: That figure was stubborn, but he worked himself to the bone for his people.
    words: [keras kepala, banting tulang, tetap]
  - id: e10
    type: multiple_choice
    question: Walaupun sudah kaya, Pak Irwan tetap rendah hati.
    question_meaning:
      ar_eg: الأستاذ إروان اتغيّر بعد ما بقى غني؟
      ar: هل تغيّر السيد إروان بعد أن صار غنيًا؟
      en: Did Pak Irwan change after getting rich?
    options: ['Tidak, dia masih rendah hati.', 'Ya, dia menjadi tinggi hati.', 'Ya, dia menjadi keras kepala.']
    answer: 0
    explain:
      ar_eg: tetap = فضل زي ما هو / برضه.
      ar: tetap = ظلّ كما هو.
      en: tetap = still, stays the same.
    words: [tetap, rendah hati]
dialogue:
  title: Kebun bunga Kakaskasen
  lines:
    - speaker: Mas Rizal
      text: Petani bunga di Kakaskasen membanting tulang dari pagi sampai malam.
      ar_eg: مزارعين الورد في كاكاسكاسين بيشتغلوا جامد من الصبح لبالليل.
      ar: يكدح مزارعو الزهور في كاكاسكاسن من الصباح حتى الليل.
      en: The flower farmers in Kakaskasen work themselves to the bone from morning till night.
    - speaker: Mohamed
      text: Bapak tua tadi juga ramah dan rendah hati.
      ar_eg: والراجل الكبير اللي قابلناه كان لطيف ومتواضع.
      ar: والرجل المسنّ الذي قابلناه كان لطيفًا ومتواضعًا.
      en: And that old man just now was friendly and humble.
    - speaker: Mas Rizal
      text: Iya, beliau udah banyak makan garam. Udah empat puluh tahun nanam bunga.
      ar_eg: أيوه، ده عنده خبرة كبيرة. بقاله أربعين سنة بيزرع ورد.
      ar: نعم، إنه ذو خبرة كبيرة، فهو يزرع الزهور منذ أربعين عامًا.
      en: Yes, he's very experienced. He's been growing flowers for forty years.
    - speaker: Mohamed
      text: Tapi kata beliau, anaknya agak keras kepala!
      ar_eg: بس هو قال إن ابنه دماغه ناشفة شوية!
      ar: لكنه قال إن ابنه عنيد بعض الشيء!
      en: But he said his son is a bit stubborn!
