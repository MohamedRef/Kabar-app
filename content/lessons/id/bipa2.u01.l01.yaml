schema: kabar.lesson/v1
id: bipa2.u01.l01
language: id
title: Lebih besar daripada…
can_do:
  ar_eg: تقارن بين حاجتين (أكبر من، أرخص من).
  ar: أن تقارن بين شيئين.
  en: Compare two things.
slides:
  - title: Lebih + sifat
    body:
      ar_eg: |
        في الإندونيسي مفيش وزن «أفعل» زي أكبر وأصغر. بتحط lebih (أكتر) قبل الصفة وخلاص:
        besar = كبير → lebih besar = أكبر
        murah = رخيص → lebih murah = أرخص
        وعلى فكرة: alat في alat musik (آلة موسيقية) جاية من العربي «آلة».
      ar: |
        لا توجد صيغة «أفعل» في الإندونيسية، بل تُقدَّم lebih (أكثر) على الصفة:
        besar = كبير → lebih besar = أكبر
        murah = رخيص → lebih murah = أرخص
        وكلمة alat في alat musik (آلة موسيقية) مأخوذة من العربية «آلة».
      en: |
        Indonesian has no "-er" form. Just put lebih (more) before the adjective:
        besar (big) → lebih besar (bigger)
        murah (cheap) → lebih murah (cheaper)
        By the way, alat in alat musik (musical instrument) comes from Arabic «آلة».
    grammar: id.comparison.lebih
    examples:
      - text: Gong lebih besar daripada gendang.
        ar_eg: الجونج أكبر من الطبلة.
        ar: الغونغ أكبر من الطبل.
        en: The gong is bigger than the drum.
      - text: Suling lebih murah daripada gitar.
        ar_eg: الناي أرخص من الجيتار.
        ar: الناي أرخص من القيثارة.
        en: The flute is cheaper than the guitar.
  - title: daripada = من
    body:
      ar_eg: |
        «من» في المقارنة = daripada. في الكلام العادي بيقولوا dari بس.
        خلي بالك: مش dengan! dengan يعني «مع».
        A + lebih + صفة + daripada + B
      ar: |
        «من» في المقارنة هي daripada، وفي الكلام اليومي يقال dari.
        وانتبه: لا تُستعمل dengan، فمعناها «مع».
        A + lebih + الصفة + daripada + B
      en: |
        "Than" is daripada; in everyday speech people often just say dari.
        Careful: not dengan — dengan means "with".
        A + lebih + adjective + daripada + B
    grammar: id.comparison.lebih
    examples:
      - text: Suara gong lebih keras daripada suara suling.
        ar_eg: صوت الجونج أعلى من صوت الناي.
        ar: صوت الغونغ أعلى من صوت الناي.
        en: The gong's sound is louder than the flute's.
      - text: Suling lebih ringan dari gendang.
        ar_eg: الناي أخف من الطبلة.
        ar: الناي أخف من الطبل.
        en: The flute is lighter than the drum.
  - title: Kurang = أقل / مش كفاية
    body:
      ar_eg: |
        kurang عكس lebih. أكتر استعمال ليها: «مش … كفاية»:
        Kopinya kurang manis = القهوة سكرها قليل.
        ممكن كمان kurang … daripada = أقل … من، بس الناس غالبًا بتقلب الجملة وتستعمل lebih.
      ar: |
        kurang عكس lebih، وأكثر استعمالها بمعنى «غير كافٍ»:
        Kopinya kurang manis = القهوة قليلة الحلاوة.
        ويجوز kurang … daripada = أقل … من، لكن الناس يفضّلون غالبًا قلب الجملة واستعمال lebih.
      en: |
        kurang is the opposite of lebih. Most often it means "not … enough":
        Kopinya kurang manis = The coffee isn't sweet enough.
        kurang … daripada (less … than) exists, but people usually flip the sentence and use lebih.
    grammar: id.comparison.lebih
    examples:
      - text: Kopinya kurang manis.
        ar_eg: القهوة سكرها قليل.
        ar: القهوة قليلة الحلاوة.
        en: The coffee isn't sweet enough.
      - text: Gitar ini kurang bagus.
        ar_eg: الجيتار ده مش حلو أوي.
        ar: هذه القيثارة ليست جيدة بما يكفي.
        en: This guitar isn't good enough.
  - title: Mana yang lebih …?
    body:
      ar_eg: |
        عشان تسأل «أنهي أكتر؟»: Mana yang lebih …?
        وlebih baik + فعل = «الأحسن إن…»: Lebih baik kita naik taksi = الأحسن نركب تاكسي.
      ar: |
        للسؤال «أيهما أكثر؟»: Mana yang lebih …؟
        وlebih baik + فعل = «الأفضل أن…»: Lebih baik kita naik taksi = الأفضل أن نركب سيارة أجرة.
      en: |
        To ask "which is more …?": Mana yang lebih …?
        lebih baik + verb = "it's better to …": Lebih baik kita naik taksi = We'd better take a taxi.
    grammar: id.comparison.lebih
    examples:
      - text: Mana yang lebih murah, ini atau itu?
        ar_eg: أنهي أرخص، ده ولا ده؟
        ar: أيهما أرخص، هذا أم ذاك؟
        en: Which is cheaper, this or that?
      - text: Lebih baik kita naik taksi.
        ar_eg: الأحسن نركب تاكسي.
        ar: الأفضل أن نركب سيارة أجرة.
        en: We'd better take a taxi.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gendang
        ar_eg: طبلة
        ar: طبل
        en: drum
      - text: suling
        ar_eg: ناي (فلوت بامبو)
        ar: ناي (مزمار من الخيزران)
        en: bamboo flute
      - text: alat musik
        ar_eg: آلة موسيقية
        ar: آلة موسيقية
        en: musical instrument
      - text: ringan
        ar_eg: خفيف
        ar: خفيف
        en: light (not heavy)
      - text: berat
        ar_eg: تقيل
        ar: ثقيل
        en: heavy
    words: [gendang, suling, alat musik, ringan, berat]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «الجونج أكبر من الناي»؟
      ar: أيّ جملة تعني «الغونغ أكبر من الناي»؟
      en: Which sentence means "The gong is bigger than the flute"?
    options: ["Gong lebih besar daripada suling.", "Gong lebih besar dengan suling.", "Gong besar lebih daripada suling."]
    answer: 0
    explain:
      ar_eg: lebih قبل الصفة، و«من» = daripada مش dengan.
      ar: lebih تسبق الصفة، و«من» هي daripada لا dengan.
      en: lebih comes before the adjective, and "than" is daripada, not dengan.
    words: [lebih, daripada]
  - id: e03
    type: listen
    text: Suling lebih ringan daripada gendang.
    options: ["Suling lebih ringan daripada gendang.", "Gendang lebih ringan daripada suling.", "Suling lebih berat daripada gendang."]
    answer: 0
    words: [suling, ringan, gendang]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: "في محل، عايز تسأل البياعة: «أنهي أرخص، ده ولا ده؟»"
      ar: "في متجر تريد أن تسأل البائعة: «أيهما أرخص، هذا أم ذاك؟»"
      en: In a shop you want to ask, "Which is cheaper, this or that?"
    options: ["Mana yang lebih murah, ini atau itu?", "Mana yang murah lebih, ini atau itu?", "Berapa lebih murah, ini atau itu?"]
    answer: 0
    words: [mana, lebih, murah]
  - id: e05
    type: fill_blank
    sentence: Gitar ini ___ mahal daripada gitar itu.
    meaning:
      ar_eg: الجيتار ده أغلى من الجيتار ده.
      ar: هذه القيثارة أغلى من تلك.
      en: This guitar is more expensive than that guitar.
    options: ["daripada", "lebih", "kurang"]
    answers: [lebih]
    words: [lebih, mahal]
  - id: e06
    type: fill_blank
    sentence: Suara gong lebih keras ___ suara suling.
    meaning:
      ar_eg: صوت الجونج أعلى من صوت الناي.
      ar: صوت الغونغ أعلى من صوت الناي.
      en: The gong's sound is louder than the flute's.
    options: ["dan", "daripada", "dengan"]
    answers: [daripada]
    explain:
      ar_eg: «من» في المقارنة daripada (أو dari في الكلام). dengan = مع.
      ar: «من» في المقارنة daripada (أو dari عاميةً)، أما dengan فتعني «مع».
      en: '"Than" is daripada (or dari in speech); dengan means "with".'
    words: [daripada, suara, keras]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: القهوة محتاجة سكر زيادة. تقول إيه؟
      ar: القهوة تحتاج إلى مزيد من السكر. ماذا تقول؟
      en: Your coffee needs more sugar. What do you say?
    options: ["Kopinya lebih manis.", "Kopinya kurang manis.", "Kopinya manis sekali."]
    answer: 1
    explain:
      ar_eg: kurang manis = سكرها قليل / مش مسكّرة كفاية.
      ar: kurang manis = قليلة الحلاوة.
      en: kurang manis = not sweet enough.
    words: [kurang, manis]
  - id: e08
    type: build_sentence
    source:
      ar_eg: بالي أصغر من جاوة.
      ar: بالي أصغر من جاوة.
      en: Bali is smaller than Java.
    answer: Bali lebih kecil daripada Jawa.
    alternatives: []
    distractors: [dengan, besar]
    words: [lebih, kecil, daripada]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنهي أخف، الناي ولا الطبلة؟
      ar: أيهما أخف، الناي أم الطبل؟
      en: Which is lighter, the flute or the drum?
    answers:
      - Mana yang lebih ringan, suling atau gendang?
      - Mana yang lebih ringan, suling atau gendang
      - Yang mana yang lebih ringan, suling atau gendang?
      - Yang mana lebih ringan, suling atau gendang?
      - Mana lebih ringan, suling atau gendang?
    words: [mana, lebih, ringan, suling, gendang]
  - id: e10
    type: translate
    direction: from_target
    source_text: Lebih baik kita naik taksi.
    answers_meaning:
      ar_eg: ["الأحسن نركب تاكسي", "الأحسن ناخد تاكسي", "أحسن نركب تاكسي"]
      ar: ["الأفضل أن نركب سيارة أجرة", "من الأفضل أن نركب تاكسي", "الأفضل أن نأخذ سيارة أجرة"]
      en: ["We'd better take a taxi.", "It's better if we take a taxi.", "It's better to take a taxi.", "We had better take a taxi."]
    explain:
      ar_eg: lebih baik + فعل = «الأحسن إن…».
      ar: lebih baik + فعل = «الأفضل أن…».
      en: lebih baik + verb = "it's better to …".
    words: [lebih baik]
  - id: e11
    type: dictation
    text: Gendang ini lebih berat daripada gitar itu.
    meaning:
      ar_eg: الطبلة دي أتقل من الجيتار ده.
      ar: هذا الطبل أثقل من تلك القيثارة.
      en: This drum is heavier than that guitar.
    words: [gendang, berat, daripada]
  - id: e12
    type: speaking
    text: Suara gong lebih keras daripada suara suling.
    meaning:
      ar_eg: صوت الجونج أعلى من صوت الناي.
      ar: صوت الغونغ أعلى من صوت الناي.
      en: The gong's sound is louder than the flute's.
    words: [suara, keras, lebih]
dialogue:
  title: Di sanggar musik Ubud
  lines:
    - speaker: Mohamed
      text: Ni Luh, ini alat musik apa?
      ar_eg: يا ني لوه، دي آلة إيه؟
      ar: يا ني لوه، ما هذه الآلة الموسيقية؟
      en: Ni Luh, what instrument is this?
    - speaker: Ni Luh
      text: Itu gendang. Suaranya lebih keras daripada suling.
      ar_eg: دي طبلة. صوتها أعلى من الناي.
      ar: هذا طبل، وصوته أعلى من صوت الناي.
      en: That's a drum. It's louder than the flute.
    - speaker: Mohamed
      text: Mana yang lebih berat, gendang atau suling?
      ar_eg: أنهي أتقل، الطبلة ولا الناي؟
      ar: أيهما أثقل، الطبل أم الناي؟
      en: Which is heavier, the drum or the flute?
    - speaker: Ni Luh
      text: Gendang. Suling lebih kecil dan lebih ringan.
      ar_eg: الطبلة. الناي أصغر وأخف.
      ar: الطبل. الناي أصغر وأخف.
      en: The drum. The flute is smaller and lighter.
    - speaker: Mohamed
      text: Kalau begitu, lebih baik saya belajar suling dulu.
      ar_eg: يبقى الأحسن أتعلم الناي الأول.
      ar: إذن، الأفضل أن أتعلم الناي أولًا.
      en: In that case, I'd better learn the flute first.
    - speaker: Ni Luh
      text: Bagus! Suling juga lebih murah.
      ar_eg: حلو! والناي كمان أرخص.
      ar: جيد! والناي أرخص أيضًا.
      en: Great! The flute is cheaper, too.
