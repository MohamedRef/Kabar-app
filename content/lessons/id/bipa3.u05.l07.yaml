schema: kabar.lesson/v1
id: bipa3.u05.l07
language: id
title: Ternyata berhasil
can_do:
  ar_eg: 'تحكي إنك نجحت في حاجة: «كنت قد…»، «طلع إن…»، «فعلًا»، «حد» و«حاجة».'
  ar: 'أن تحكي نجاحك في أمر: «قد فعلت…»، «تبيّن أنّ…»، «فعلًا»، «أحد» و«شيء».'
  en: 'Recount a success: ''had already'', ''it turned out'', ''indeed'', ''someone'' and ''something''.'
slides:
  - title: Kata untuk bercerita
    body:
      ar_eg: |
        telah = خلاص، قد (زي sudah بس رسمي أكتر): Kami telah sampai di puncak.
        berhasil = نجح، قدر يعمل. ternyata = طلع إن (اكتشفت إن). memang = فعلًا، بالفعل.
        menggunakan = يستخدم (زي memakai). mendapatkan = يجيب، يحصل على.
        sesuatu = حاجة. seseorang = حد، شخص.
      ar: |
        telah = قد (مثل sudah لكن أكثر رسمية): Kami telah sampai di puncak.
        berhasil = نجح، تمكّن. ternyata = تبيّن أنّ. memang = فعلًا، حقًّا.
        menggunakan = يستخدم (مثل memakai). mendapatkan = يحصل على.
        sesuatu = شيء. seseorang = أحدهم، شخص ما.
      en: |
        telah = have/had (done) (like sudah, more formal): Kami telah sampai di puncak.
        berhasil = succeed, manage. ternyata = it turned out. memang = indeed, really.
        menggunakan = use (like memakai). mendapatkan = get, obtain.
        sesuatu = something. seseorang = someone.
    examples:
      - text: Akhirnya kami berhasil sampai di puncak.
        ar_eg: في الآخر قدرنا نوصل للقمة.
        ar: في النهاية نجحنا في الوصول إلى القمة.
        en: In the end we made it to the summit.
      - text: Ternyata jalurnya tidak terlalu berat.
        ar_eg: طلع إن الطريق مش صعب أوي.
        ar: تبيّن أن المسار ليس شاقًّا جدًا.
        en: It turned out the trail wasn't too hard.
      - text: Seseorang memberi saya sesuatu yang enak.
        ar_eg: حد اداني حاجة حلوة.
        ar: أعطاني أحدهم شيئًا لذيذًا.
        en: Someone gave me something tasty.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: telah
        ar_eg: خلاص، قد
        ar: قد
        en: have (done)
      - text: berhasil
        ar_eg: نجح
        ar: نجح
        en: succeed
      - text: ternyata
        ar_eg: طلع إن
        ar: تبيّن أنّ
        en: it turned out
      - text: memang
        ar_eg: فعلًا
        ar: حقًّا
        en: indeed
    words: [telah, berhasil, ternyata, memang]
  - id: e02
    type: match_pairs
    pairs:
      - text: menggunakan
        ar_eg: يستخدم
        ar: يستخدم
        en: use
      - text: mendapatkan
        ar_eg: يحصل على
        ar: يحصل على
        en: get
      - text: sesuatu
        ar_eg: حاجة
        ar: شيء
        en: something
      - text: seseorang
        ar_eg: حد
        ar: شخص ما
        en: someone
    words: [menggunakan, mendapatkan, sesuatu, seseorang]
  - id: e03
    type: listen
    text: Kemarin saya takut hujan, ternyata cerah sekali.
    question:
      ar_eg: الجو كان عامل إزاي؟
      ar: كيف كان الجو؟
      en: What was the weather like?
    options: [كان بيمطر, الجو طلع حلو, الجو كان برد]
    answer: 1
    meaning:
      ar_eg: امبارح كنت خايف تمطر، طلع الجو صحو خالص.
      ar: أمس خشيت أن تمطر، فتبيّن أن الجو صافٍ جدًا.
      en: Yesterday I was worried it would rain; it turned out lovely and clear.
    words: [ternyata]
  - id: e04
    type: fill_blank
    sentence: Kami ___ sampai di puncak sebelum matahari terbit.
    meaning:
      ar_eg: إحنا ___ وصلنا القمة قبل الشمس ما تطلع.
      ar: ___ وصلنا إلى القمة قبل شروق الشمس.
      en: We ___ reached the summit before sunrise.
    options: [sesuatu, telah, seseorang]
    answers: [telah]
    words: [telah, sesuatu, seseorang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كلمة رسمية معناها «يستخدم» زي memakai؟
      ar: أي كلمة رسمية تعني «يستخدم» مثل memakai؟
      en: Which formal word means 'use', like memakai?
    options: [mendapatkan, menggunakan, memang]
    answer: 1
    explain:
      ar_eg: menggunakan = يستخدم.
      ar: menggunakan = يستخدم.
      en: menggunakan = use.
    words: [menggunakan, mendapatkan, memang]
  - id: e06
    type: fill_blank
    sentence: Ada ___ di depan pintu. Siapa dia?
    meaning:
      ar_eg: فيه ___ قدام الباب. مين ده؟
      ar: هناك ___ أمام الباب. من هو؟
      en: There's ___ at the door. Who is it?
    options: [seseorang, sesuatu, berhasil]
    answers: [seseorang]
    words: [seseorang, sesuatu, berhasil]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الطريق ده فعلًا صعب.
      ar: ذلك المسار شاقّ حقًّا.
      en: That trail really is hard.
    answer: Jalur itu memang berat.
    distractors: [telah, ternyata]
    words: [memang]
  - id: e08
    type: translate
    direction: from_target
    source_text: Saya mendapatkan sesuatu dari porter itu.
    answers_meaning:
      ar_eg: [خدت حاجة من الشيّال ده, الشيّال اداني حاجة]
      ar: [حصلت على شيء من ذلك الحمّال, أخذت شيئًا من ذلك الحمّال]
      en: [I got something from that porter, I received something from the porter]
    words: [mendapatkan, sesuatu]
  - id: e09
    type: speaking
    text: Kami berhasil! Kami telah sampai di puncak Rinjani.
    meaning:
      ar_eg: نجحنا! وصلنا قمة رينجاني.
      ar: نجحنا! لقد وصلنا إلى قمة رينجاني.
      en: We did it! We've reached the top of Rinjani.
    words: [berhasil, telah]
  - id: e10
    type: multiple_choice
    question: Porter itu ___ senter untuk melihat jalur.
    options: [menggunakan, seseorang, ternyata]
    answer: 0
    explain:
      ar_eg: menggunakan senter = يستخدم كشاف.
      ar: menggunakan senter = يستخدم مصباحًا يدويًا.
      en: menggunakan senter = use a torch.
    words: [menggunakan, seseorang, ternyata]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed! Kamu berhasil sampai di puncak?
      ar_eg: يا محمد! قدرت توصل للقمة؟
      ar: يا محمد! هل نجحت في الوصول إلى القمة؟
      en: Mohamed! Did you make it to the summit?
    - speaker: Mohamed
      text: Ya! Kami telah sampai jam lima pagi.
      ar_eg: أيوه! وصلنا الساعة خمسة الصبح.
      ar: نعم! وصلنا في الخامسة صباحًا.
      en: Yes! We got there at five in the morning.
    - speaker: Rina
      text: Wah, memang hebat! Jalurnya berat?
      ar_eg: الله، فعلًا جامد! الطريق كان صعب؟
      ar: رائع حقًّا! هل كان المسار شاقًّا؟
      en: Wow, impressive! Was the trail hard?
    - speaker: Mohamed
      text: 'Berat, tapi ternyata porter kami membawa sesuatu yang enak: kopi panas!'
      ar_eg: 'صعب، بس طلع إن الشيّال بتاعنا جايب حاجة بتفرق: قهوة سخنة!'
      ar: 'شاقّ، لكن تبيّن أن حمّالنا أحضر شيئًا مفيدًا: قهوة ساخنة!'
      en: 'Hard, but it turned out our porter had brought something that helped: hot coffee!'
    - speaker: Rina
      text: Ha ha! Seseorang di sana sangat pintar.
      ar_eg: ها ها! فيه حد هناك ذكي جدًا.
      ar: ها ها! أحدهم هناك ذكي جدًا.
      en: Ha! Someone up there is very clever.
