schema: kabar.lesson/v1
id: bipa1.u03.l04
language: id
title: Rumah besar
can_do:
  ar_eg: تحط الصفة بعد الاسم وتحدد واحد بـ yang.
  ar: أن تضع الصفة بعد الاسم وتحدد واحدًا بـ yang.
  en: Put describers after the noun and pick one out with yang.
slides:
  - title: Rumah besar = بيت كبير
    body:
      ar_eg: |
        القاعدة الذهبية: الاسم الأول، وبعدين كل اللي بيوصفه — زي العربي بالظبط وعكس الإنجليزي.
        - rumah besar = بيت كبير
        - rumah besar saya = بيتي الكبير
        - rumah besar saya itu = بيتي الكبير ده
      ar: |
        القاعدة الذهبية: الاسم أولًا ثم كل ما يصفه، كالعربية تمامًا وعلى عكس الإنجليزية.
        - rumah besar = بيت كبير
        - rumah besar saya = بيتي الكبير
        - rumah besar saya itu = بيتي الكبير ذاك
      en: |
        The golden rule: the noun first, then everything describing it — Arabic order, the reverse of English.
        - rumah besar = big house
        - rumah besar saya = my big house
        - rumah besar saya itu = that big house of mine
    grammar: id.noun-phrase.order
    examples:
      - text: Ini rumah baru saya.
        ar_eg: ده بيتي الجديد.
        ar: هذا بيتي الجديد.
        en: This is my new house.
      - text: Adik saya kecil.
        ar_eg: أخويا (الأصغر مني) لسه صغيّر.
        ar: أخي الأصغر صغير.
        en: My younger sibling is little.
  - title: Kakak saya yang tinggi
    body:
      ar_eg: |
        yang = «اللي». بتستخدمها عشان تحدد واحد معيّن أو تزوّد وصف:
        «kakak saya yang tinggi» = «أخويا الكبير اللي طويل» (يعني مش التاني).
        والسؤال: «yang mana?» = «أنهي واحد؟».
      ar: |
        yang = «الذي / التي». تُستعمل لتعيين واحد بعينه أو لإضافة وصف:
        «kakak saya yang tinggi» = «أخي الأكبر الطويل» (لا الآخر).
        والسؤال: «yang mana?» = «أيّهم؟».
      en: |
        yang = "the one that / who". Use it to pick one out or to add a describer:
        "kakak saya yang tinggi" = "my older sibling, the tall one" (not the other).
        The question: "yang mana?" = "which one?"
    grammar: id.noun-phrase.order
    examples:
      - text: Kakak saya yang tinggi itu dokter.
        ar_eg: أخويا الكبير الطويل ده دكتور.
        ar: أخي الأكبر الطويل ذاك طبيب.
        en: My tall older sibling is a doctor.
      - text: Kakakmu yang mana?
        ar_eg: أنهي واحد فيهم أخوك الكبير؟
        ar: أيّهم أخوك الأكبر؟
        en: Which one is your older sibling?
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «بيت كبير»؟
      ar: كيف تقول «بيت كبير»؟
      en: How do you say "a big house"?
    options: [rumah besar, rumah-rumah besar, besar rumah]
    answer: 0
    explain:
      ar_eg: الاسم الأول وبعدين الصفة، زي العربي.
      ar: الاسم أولًا ثم الصفة كما في العربية.
      en: Noun first, then the adjective — Arabic order.
    words: [rumah, besar]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «أخويا الكبير اللي طويل»؟
      ar: كيف تقول «أخي الأكبر الطويل»؟
      en: How do you say "my older sibling, the tall one"?
    options: [kakak saya yang tinggi, kakak saya yang mana, tinggi kakak saya]
    answer: 0
    explain:
      ar_eg: الاسم، وبعدين صاحبه، وبعدين yang + الوصف.
      ar: الاسم ثم المضاف إليه ثم yang + الصفة.
      en: Noun, then owner, then yang + describer.
    words: [yang, tinggi]
  - id: e03
    type: fill_blank
    sentence: Rumah ___ saya di Cikini.
    meaning:
      ar_eg: بيتي الجديد في تشيكيني.
      ar: بيتي الجديد في تشيكيني.
      en: My new house is in Cikini.
    options: [tinggi, baru, kecil]
    answers: [baru]
    words: [baru, rumah]
  - id: e04
    type: build_sentence
    source:
      ar_eg: ده بيتي الكبير.
      ar: هذا بيتي الكبير.
      en: This is my big house.
    answer: Ini rumah besar saya.
    distractors: [dua, kecil]
    words: [rumah, besar]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أخويا الصغير صغيّر.
      ar: أخي الأصغر صغير.
      en: My younger brother is small.
    answer: Adik saya kecil.
    distractors: [yang, besar]
    explain:
      ar_eg: دي جملة كاملة (هو صغير)، فمش محتاجين yang.
      ar: هذه جملة تامة (هو صغير)، فلا حاجة إلى yang.
      en: This is a full sentence ("is small"), so no yang is needed.
    words: [adik, kecil]
  - id: e06
    type: translate
    direction: from_target
    source_text: Kakak saya yang tinggi itu dokter.
    answers_meaning:
      ar_eg: [أخويا الكبير الطويل ده دكتور., أختي الكبيرة الطويلة دي دكتورة, أخويا الكبير اللي طويل دكتور]
      ar: [أخي الأكبر الطويل طبيب., أختي الكبرى الطويلة طبيبة, أخي الأكبر الطويل ذاك طبيب]
      en: [My tall older brother is a doctor., My tall older sister is a doctor, 'My older sibling, the tall one, is a doctor']
    words: [kakak, yang, tinggi, dokter]
  - id: e07
    type: match_pairs
    pairs:
      - text: besar
        ar_eg: كبير
        ar: كبير
        en: big
      - text: kecil
        ar_eg: صغير
        ar: صغير
        en: small
      - text: tinggi
        ar_eg: طويل / عالي
        ar: طويل / عالٍ
        en: tall, high
      - text: baru
        ar_eg: جديد
        ar: جديد
        en: new
    words: [besar, kecil, tinggi, baru]
  - id: e08
    type: listen
    text: Kakak saya yang mana?
    options: [Kakak saya yang tinggi., 'Kakak saya yang mana?', 'Adik saya yang mana?']
    answer: 1
    meaning:
      ar_eg: أخويا الكبير أنهي واحد؟
      ar: أيّهم أخي الأكبر؟
      en: Which one is my older sibling?
    words: [yang mana]
  - id: e09
    type: listen
    text: Rumah saya kecil, tapi baru.
    options: ['Rumah saya kecil, tapi baru.', 'Rumah saya besar, tapi baru.', 'Rumah saya kecil dan tinggi.']
    answer: 0
    meaning:
      ar_eg: بيتي صغير، بس جديد.
      ar: بيتي صغير، لكنه جديد.
      en: My house is small, but new.
    words: [kecil, baru]
  - id: e10
    type: fill_blank
    sentence: Rumahmu yang ___?
    meaning:
      ar_eg: بيتك أنهي واحد؟
      ar: أيّها بيتك؟
      en: Which one is your house?
    options: [mana, apa, siapa]
    answers: [mana]
    explain:
      ar_eg: yang mana = أنهي واحد، لما تختار من كذا حاجة قدامك.
      ar: yang mana = أيّها، عند الاختيار بين أشياء أمامك.
      en: yang mana = which one, when choosing among things in front of you.
    words: [yang mana]

dialogue:
  lines:
    - speaker: Mohamed
      text: Rina, ini rumah baru kamu?
      ar_eg: رينا، ده بيتك الجديد؟
      ar: رينا، هل هذا بيتك الجديد؟
      en: Rina, is this your new house?
    - speaker: Rina
      text: Ya! Rumahku kecil, tapi baru.
      ar_eg: أيوه! بيتي صغير، بس جديد.
      ar: نعم! بيتي صغير، لكنه جديد.
      en: Yes! My house is small, but new.
    - speaker: Mohamed
      text: Kakak kamu yang mana?
      ar_eg: أختك الكبيرة أنهي واحدة؟
      ar: أيّهم أختك الكبرى؟
      en: Which one is your older sister?
    - speaker: Rina
      text: Kakakku yang tinggi itu.
      ar_eg: أختي الكبيرة اللي طويلة دي.
      ar: أختي الكبرى تلك الطويلة.
      en: My older sister is the tall one there.
