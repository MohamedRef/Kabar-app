  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الناخب الإندونيسي بيعلّم على ورقة التصويت إزاي؟
      ar: كيف يؤشّر الناخب الإندونيسي على ورقة الاقتراع؟
      en: How does an Indonesian voter mark the ballot?
    options:
      - بيكتب الاسم بالقلم.
      - بيخرّم الصورة بمسمار.
      - بيدوس على زرار في الموبايل.
    answer: 1
    words: [mencoblos, surat suara]
  - id: e03
    type: fill_blank
    sentence: Setiap warga yang berumur 17 tahun punya ___.
    meaning:
      ar_eg: كل مواطن عنده 17 سنة ليه حق التصويت.
      ar: لكلّ مواطن بلغ السابعة عشرة حقّ الاقتراع.
      en: Every citizen aged 17 has the right to vote.
    options: [hak pilih, surat suara, pemilu]
    answers: [hak pilih]
    words: [hak pilih]
  - id: e04
    type: listen
    text: Pada Pemilu 2024, jumlah pemilih lebih dari dua ratus juta orang.
    question:
      ar_eg: كان فيه كام ناخب في انتخابات 2024؟
      ar: كم كان عدد الناخبين في انتخابات 2024؟
      en: How many voters were there in the 2024 election?
    options:
      - أقل من مليون.
      - عشرين مليون.
      - أكتر من 200 مليون.
    answer: 2
    words: [pemilu, pemilih]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الناخب خرّم ورقة التصويت.
      ar: ثقب الناخب ورقة الاقتراع.
      en: The voter punched the ballot.
    answer: Pemilih itu mencoblos surat suara.
    distractors: [pemilu, hak]
    words: [pemilih, mencoblos, surat suara]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الناخبين بيغطّسوا صباعهم في الحبر؟
      ar: لماذا يغمس الناخبون أصابعهم في الحبر؟
      en: Why do voters dip a finger in ink?
    options:
      - علشان مايصوّتوش مرتين.
      - علشان يتصوّروا.
      - علشان يكتبوا اسمهم.
    answer: 0
    words: [pemilih]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الانتخابات هي عيد الديمقراطية.
      ar: الانتخابات عرس الديمقراطية.
      en: The election is a festival of democracy.
    answers:
      - Pemilu adalah pesta demokrasi.
      - Pemilu merupakan pesta demokrasi.
