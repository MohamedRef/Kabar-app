        ar: حقّ الاقتراع
        en: right to vote
      - text: mencoblos
        ar_eg: يخرّم (ورقة التصويت)
        ar: يثقب (ورقة الاقتراع)
        en: to punch (a ballot)
      - text: surat suara
        ar_eg: ورقة التصويت
