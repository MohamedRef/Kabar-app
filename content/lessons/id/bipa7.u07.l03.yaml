    words: [pemilu]
  - id: e08
    type: speaking
    text: Gunakan hak pilih Anda pada hari pemilu.
    meaning:
      ar_eg: استعمل حقك في التصويت يوم الانتخابات.
      ar: استعمل حقّك في الاقتراع يوم الانتخابات.
      en: Use your right to vote on election day.
    words: [hak pilih, pemilu]
  - id: e09
    type: dictation
    text: Surat suara itu sangat besar dan berisi banyak nama.
    meaning:
      ar_eg: ورقة التصويت دي كبيرة قوي وفيها أسامي كتير.
      ar: ورقة الاقتراع تلك كبيرة جدًّا وفيها أسماء كثيرة.
      en: That ballot is very big and full of names.
    words: [surat suara]
  - id: e10
    type: translate
    direction: from_target
    source_text: Setelah mencoblos, pemilih mencelupkan jarinya ke dalam tinta.
    answers_meaning:
      ar_eg:
        - بعد ما الناخب يخرّم الورقة، بيغطّس صباعه في الحبر.
        - الناخب بيحطّ صباعه في الحبر بعد ما يصوّت.
      ar:
        - بعد الثقب يغمس الناخب إصبعه في الحبر.
        - يغمس الناخب إصبعه في الحبر بعد أن يصوّت.
      en:
        - After punching the ballot, the voter dips a finger in ink.
        - Voters dip their finger in ink once they've voted.
    words: [mencoblos, pemilih]
dialogue:
  title: Hari pemungutan suara
  lines:
    - speaker: Bu Debora
      text: Kita liputan di TPS dekat pasar. Pemilihnya sudah antre sejak pagi.
      ar_eg: هنغطّي من لجنة جنب السوق. الناخبين واقفين في طابور من الصبح.
      ar: سنغطّي من مركز اقتراع قرب السوق، والناخبون يصطفّون منذ الصباح.
      en: We're covering the polling station near the market. Voters have queued since morning.
    - speaker: Mohamed
      text: Mama itu baru keluar. Jarinya ungu. Boleh saya wawancara?
      ar_eg: الست دي لسّه خارجة، وصباعها بنفسجي. ممكن أعمل معاها مقابلة؟
      ar: تلك السيّدة خرجت للتوّ وإصبعها بنفسجي. أيمكنني محاورتها؟
      en: That lady's just come out, her finger's purple. May I interview her?
    - speaker: Bu Debora
      text: Boleh, tapi jangan tanya pilihannya. Itu rahasia.
      ar_eg: ماشي، بس ماتسألهاش اختارت مين. ده سرّ.
      ar: نعم، لكن لا تسألها عن اختيارها، فهو سرّ.
      en: Yes, but don't ask who she chose. That's secret.
    - speaker: Mohamed
      text: Siap. Saya tanya saja kenapa hak pilih itu penting baginya.
      ar_eg: تمام. هسألها بس ليه حقّ التصويت مهمّ بالنسبالها.
      ar: حسنًا، سأسألها فقط لماذا يهمّها حقّ الاقتراع.
      en: Got it. I'll just ask why the right to vote matters to her.
