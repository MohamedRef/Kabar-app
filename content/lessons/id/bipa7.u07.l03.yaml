language: id
title: Pemilu
can_do:
  ar_eg: تقرا عن الانتخابات في إندونيسيا وتفهم الناس بتصوّت إزاي.
  ar: أن تقرأ عن الانتخابات في إندونيسيا وتفهم طريقة التصويت.
  en: Read about Indonesian elections and how people vote.
slides:
  - title: Pesta demokrasi
    body:
      ar_eg: |
        الـ pemilu (الانتخابات العامة) في إندونيسيا بيسمّوها «pesta demokrasi» (عيد الديمقراطية).
        - pemilih (الناخب) لازم يكون عنده 17 سنة على الأقل أو متجوّز، وده بيدّيله hak pilih (حق التصويت).
        - في اللجنة بياخد surat suara (ورقة التصويت) كبيرة.
        - بدل ما يعلّم بقلم، بـ mencoblos (يخرّم) الصورة أو الاسم بمسمار.
        - بعدها بيغطّس صباعه في حبر، علشان مايصوّتش مرتين.
        في انتخابات 2024، كان فيه أكتر من 200 مليون ناخب، وانتخبوا الرئيس والبرلمان في نفس اليوم.
      ar: |
        تُسمّى الـ pemilu (الانتخابات العامة) في إندونيسيا «pesta demokrasi» (عرس الديمقراطية).
        - يجب أن يكون الـ pemilih (الناخب) في السابعة عشرة على الأقلّ أو متزوّجًا، فيحقّ له hak pilih (حقّ الاقتراع).
        - يتسلّم في مركز الاقتراع surat suara (ورقة اقتراع) كبيرة.
        - وبدل التأشير بالقلم، يقوم بـ mencoblos (ثقب) الصورة أو الاسم بمسمار.
        - ثمّ يغمس إصبعه في الحبر كي لا يصوّت مرّتين.
        وفي انتخابات 2024 كان هناك أكثر من 200 مليون ناخب، واختاروا الرئيس والبرلمان في يوم واحد.
      en: |
        Indonesians call pemilu (the general election) a "pesta demokrasi" (festival of democracy).
        - A pemilih (voter) must be at least 17 or married, which gives them hak pilih (the right to vote).
        - At the polling station they get a large surat suara (ballot paper).
        - Instead of ticking with a pen, they mencoblos (punch) the photo or name with a nail.
        - Then they dip a finger in ink so they can't vote twice.
        The 2024 election had more than 200 million voters, choosing the president and parliament on the same day.
