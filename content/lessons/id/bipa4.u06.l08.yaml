schema: kabar.lesson/v1
id: bipa4.u06.l08
language: id
title: Pondok di Malino
can_do:
  ar_eg: توصف مكان هادي في الجبل تستريح فيه وتقول هو مبهر ليه.
  ar: أن تصف مكانًا هادئًا في الجبل للاستراحة وتقول لماذا هو مذهل.
  en: Describe a quiet mountain place to relax and say why it's amazing.
slides:
  - title: Udara sejuk, hati tenang
    body:
      ar_eg: |
        pondok = كوخ، بيت صغير خشب، lembah = وادي، kamp = مخيّم (kamp pramuka).
        tepi = طرف، حافة (di tepi danau = على شط البحيرة)، sekeliling = حوالين، المكان اللي حوالين.
        ketenangan = الهدوء، bersantai = يرتاح وياخدها بالراحة، mengagumkan = مبهر.
      ar: |
        pondok = كوخ، بيت خشبي صغير، lembah = وادٍ، kamp = مخيّم (kamp pramuka).
        tepi = طرف، حافة (di tepi danau = على ضفة البحيرة)، sekeliling = ما حول المكان.
        ketenangan = السكينة، bersantai = يسترخي، mengagumkan = مذهل.
      en: |
        pondok = hut, cabin; lembah = valley; kamp = camp (kamp pramuka).
        tepi = edge, bank (di tepi danau = on the lakeshore); sekeliling = surroundings, around.
        ketenangan = calm, peace; bersantai = to relax; mengagumkan = amazing.
    examples:
      - text: Kami menginap di pondok kayu di Malino.
        ar_eg: بتنا في كوخ خشب في مالينو.
        ar: أقمنا في كوخ خشبي في مالينو.
        en: We stayed in a wooden cabin in Malino.
      - text: Dari sini lembah hijau terlihat mengagumkan.
        ar_eg: من هنا الوادي الأخضر باين مبهر.
        ar: من هنا يبدو الوادي الأخضر مذهلًا.
        en: From here the green valley looks amazing.
      - text: Saya mau bersantai di tepi danau.
        ar_eg: عايز أرتاح على شط البحيرة.
        ar: أريد أن أسترخي على ضفة البحيرة.
        en: I want to relax by the lake.
