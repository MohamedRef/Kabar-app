      ar: أبحث عن السكينة بعيدًا عن المدينة.
      en: I'm looking for peace and quiet away from the city.
    answer: Saya mencari ketenangan jauh dari kota.
    distractors: [lembah, kamp]
    words: [ketenangan, lembah, kamp]
  - id: e09
    type: translate
    direction: from_target
    source_text: Di sekeliling pondok kami ada banyak pohon pinus.
    answers_meaning:
      ar_eg: [حوالين الكوخ بتاعنا فيه شجر صنوبر كتير, فيه صنوبر كتير حوالين الكوخ]
      ar: [حول كوخنا أشجار صنوبر كثيرة, تحيط بكوخنا أشجار صنوبر كثيرة]
      en: [There are lots of pine trees around our cabin, Many pine trees surround our cabin]
    words: [sekeliling, pondok]
  - id: e10
    type: speaking
    text: Pondok di tepi lembah ini memberi ketenangan.
    meaning:
      ar_eg: الكوخ اللي على طرف الوادي ده بيدّي هدوء.
      ar: هذا الكوخ على حافة الوادي يمنح السكينة.
      en: This cabin on the edge of the valley gives you peace.
    words: [pondok, tepi, lembah, ketenangan, sekeliling, mengagumkan]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Selamat datang di Malino, Mohamed. Udaranya sejuk, kan?
      ar_eg: أهلًا بيك في مالينو يا محمد. الجو حلو وطري، مش كده؟
      ar: أهلًا بك في مالينو يا محمد. الهواء منعش، أليس كذلك؟
      en: Welcome to Malino, Mohamed. The air's cool, isn't it?
    - speaker: Mohamed
      text: Sejuk banget. Pemandangan lembahnya mengagumkan!
      ar_eg: طري خالص. منظر الوادي مبهر!
      ar: منعش جدًا، ومنظر الوادي مذهل!
      en: Lovely and cool. The valley view is amazing!
    - speaker: Mas Rizal
      text: Kita menginap di pondok itu, di tepi hutan pinus.
      ar_eg: هنبات في الكوخ ده، على طرف غابة الصنوبر.
      ar: سنبيت في ذلك الكوخ، على طرف غابة الصنوبر.
      en: We're staying in that cabin, on the edge of the pine forest.
    - speaker: Mohamed
      text: Di sekelilingnya sepi. Aku suka ketenangan kayak gini.
      ar_eg: اللي حواليه هادي. أنا بحب الهدوء ده.
      ar: ما حوله هادئ، وأنا أحبّ سكينة كهذه.
      en: It's quiet all around. I love this kind of calm.
    - speaker: Mas Rizal
      text: Besok ada kamp anak sekolah di bawah. Malam ini kita bersantai aja.
      ar_eg: بكرة فيه مخيّم لعيال المدارس تحت. الليلة نرتاح وبس.
      ar: غدًا مخيّم لتلاميذ المدارس في الأسفل. الليلة نسترخي فقط.
      en: Tomorrow there's a school camp down below. Tonight we just relax.
