      ar: أين ينام الكشّافة؟
      en: Where do the scouts sleep?
    options: [مخيّم, فندق, كوخ]
    answer: 0
    meaning:
      ar_eg: ولاد الكشافة بيناموا في مخيّم جنب الغابة.
      ar: ينام أطفال الكشّافة في مخيّم قرب الغابة.
      en: The scout children sleep at a camp near the forest.
    words: [kamp]
