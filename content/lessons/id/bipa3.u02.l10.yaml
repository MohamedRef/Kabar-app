schema: kabar.lesson/v1
id: bipa3.u02.l10
language: id
title: Ulangan Unit 2
can_do:
  ar_eg: "تدافع عن الطبيعة: تقول رأيك، تسأل، وتوافق أو تعترض بأدب."
  ar: "أن تدافع عن الطبيعة: تعبّر عن رأيك وتسأل وتوافق أو تعترض بأدب."
  en: Argue for protecting nature.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: alam
        ar_eg: الطبيعة
        ar: الطبيعة
        en: nature
      - text: terumbu karang
        ar_eg: شعاب مرجانية
        ar: شعاب مرجانية
        en: coral reef
      - text: nelayan
        ar_eg: صياد سمك
        ar: صيّاد سمك
        en: fisherman
      - text: relawan
        ar_eg: متطوّع
        ar: متطوّع
        en: volunteer
      - text: denda
        ar_eg: غرامة
        ar: غرامة
        en: fine (penalty)
    words: [alam, terumbu karang, nelayan, relawan, denda]
  - id: e02
    type: multiple_choice
    question: Ni Luh membeli kopi. ___ enak sekali.
    options: [Kopinya, Kopiku, Kopi-nya]
    answer: 0
    explain:
      ar_eg: القهوة اللي اتكلمنا عنها = kopinya (الـ)، لازقة من غير شَرطة.
      ar: القهوة المذكورة = kopinya (للتعريف)، متصلة بلا شرطة.
      en: The coffee just mentioned = kopinya ("the"), joined with no hyphen.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: "عايز تسأل وانت مستني «أيوه»: «مش البلاستيك خطر؟»"
      ar: "تريد أن تسأل وأنت تنتظر «نعم»: «أليس البلاستيك خطرًا؟»"
      en: 'You ask, expecting "yes": "Isn''t plastic dangerous?"'
    options: ["Apakah plastik berbahaya?", "Bukankah plastik berbahaya?", "Plastik itu berbahaya."]
    answer: 1
    words: [bukankah, berbahaya]
    explain:
      ar_eg: السؤال اللي مستني «أيوه» بيبدأ بـBukankah. Apakah سؤال عادي، والتالتة جملة خبرية مش سؤال.
      ar: السؤال المنتظِر لـ«نعم» يبدأ بـBukankah. أما Apakah فسؤال محايد، والثالثة خبر لا سؤال.
      en: A question expecting yes starts with Bukankah. Apakah is a neutral question, and the third is a statement.
  - id: e04
    type: listen
    text: Katanya, siapa pun boleh ikut kegiatan ini.
    options: ["Katanya, siapa pun boleh ikut kegiatan ini.", "Sebaiknya siapa pun ikut kegiatan ini.", "Rupanya, siapa pun boleh ikut kegiatan ini."]
    answer: 0
    meaning:
      ar_eg: بيقولوا إن أي حد ممكن يشارك في النشاط ده.
      ar: يقولون إن أيّ أحد يمكنه المشاركة في هذا النشاط.
      en: They say anyone can join this activity.
    words: [katanya, siapa pun, kegiatan]
  - id: e05
    type: match_pairs
    pairs:
      - text: bumi
        ar_eg: الأرض
        ar: الأرض
        en: the earth
      - text: membakar
        ar_eg: يحرق
        ar: يحرق
        en: burn
      - text: komunitas
        ar_eg: جماعة، مجتمع
        ar: مجتمع، جماعة
        en: community
      - text: generasi
        ar_eg: جيل
        ar: جيل
        en: generation
      - text: pandangan
        ar_eg: وجهة نظر
        ar: وجهة نظر
        en: view, point of view
      - text: ragu
        ar_eg: شاكك، متردد
        ar: متردد، شاكّ
        en: doubtful, unsure
    words: [bumi, membakar, komunitas, generasi, pandangan, ragu]
  - id: e06
    type: fill_blank
    sentence: Saya ___ setuju karena banyak pedagang kecil memakai plastik.
    meaning:
      ar_eg: أنا مش موافق أوي عشان تجار صغيرين كتير بيستعملوا البلاستيك.
      ar: لا أوافق تمامًا لأنّ كثيرًا من صغار التجار يستعملون البلاستيك.
      en: I don't quite agree, because many small traders use plastic.
    options: [lebih, kurang, paling]
    answers: [kurang]
    words: [kurang setuju]
    explain:
      ar_eg: «مش موافق أوي» = kurang setuju. lebih وpaling للمقارنة، فيقلبوا المعنى.
      ar: «لا أوافق تمامًا» kurang setuju. أما lebih وpaling فللمقارنة وتقلبان المعنى.
      en: "\"Don't quite agree\" is kurang setuju. lebih and paling are for comparing and flip the meaning."
  - id: e07
    type: fill_blank
    sentence: ___ hujan, Rina ikut bersih pantai.
    meaning:
      ar_eg: مع إنها كانت بتمطر، رينا شاركت في تنضيف الشط.
      ar: مع أنها كانت تمطر، شاركت رينا في تنظيف الشاطئ.
      en: Although it was raining, Rina joined the beach clean-up.
    options: [Apakah, Inilah, Walaupun]
    answers: [Walaupun]
    words: [walaupun]
    explain:
      ar_eg: «مع إنها بتمطر» = Walaupun hujan. Apakah للسؤال، وInilah = أهو ده.
      ar: «مع أنها تمطر» Walaupun hujan. أما Apakah فللسؤال، وInilah «ها هو».
      en: "\"Although it rained\" is Walaupun hujan. Apakah asks a question, Inilah means \"here is\"."
  - id: e08
    type: build_sentence
    source:
      ar_eg: ارمي الزبالة في صندوق الزبالة (أمر مؤدب).
      ar: ضع النفايات في سلة المهملات (أمر مهذّب).
      en: Put the rubbish in the bin (a polite command).
    answer: Buanglah sampah di tempat sampah.
    distractors: [membuang, apakah]
    words: [membuang, tempat sampah]
    explain:
      ar_eg: "الأمر المؤدب = الفعل من غير me- + lah: Buanglah sampah di tempat sampah. membuang مش أمر، وapakah للسؤال."
      ar: "الأمر المهذّب جذر الفعل + lah: Buanglah sampah di tempat sampah. أما membuang فليس أمرًا، وapakah للسؤال."
      en: "A polite command is the bare verb + lah: Buanglah sampah di tempat sampah. membuang isn't a command, apakah asks a question."
  - id: e09
    type: fill_blank
    sentence: Plastik itu murah, ___ sangat berbahaya untuk laut.
    meaning:
      ar_eg: البلاستيك رخيص، ___ هو خطر جدًا على البحر.
      ar: البلاستيك رخيص، ___ هو خطير جدًا على البحر.
      en: Plastic is cheap, ___ it's very harmful to the sea.
    options: [energi, upaya, padahal]
    answers: [padahal]
    words: [padahal, energi, upaya]
    explain:
      ar_eg: "padahal = «مع إن الحقيقة»: رخيص بس خطر. energi = طاقة، وupaya = مجهود، ومش أدوات ربط."
      ar: "padahal = «والحقيقة أنّ»: رخيص لكنه خطير. أما energi فطاقة، وupaya جهد، وليستا أداتي ربط."
      en: "padahal means \"when in fact\": cheap, yet harmful. energi (energy) and upaya (effort) aren't linking words."
  - id: e10
    type: translate
    direction: from_target
    source_text: Sebaiknya kita mengurangi sampah plastik.
    answers_meaning:
      ar_eg:
        - الأحسن نقلّل الزبالة البلاستيك.
        - الأحسن نقلّل البلاستيك.
      ar:
        - الأفضل أن نقلّل النفايات البلاستيكية.
        - من الأفضل أن نقلّل النفايات البلاستيكية.
      en:
        - We'd better reduce plastic waste.
        - It's best to reduce plastic waste.
        - We should reduce plastic waste.
        - We had better reduce plastic rubbish.
    words: [sebaiknya, mengurangi]
  - id: e11
    type: dictation
    text: Bagaimana pendapat Anda tentang denda itu?
    meaning:
      ar_eg: إيه رأي حضرتك في الغرامة دي؟
      ar: ما رأيك في تلك الغرامة؟
      en: What's your opinion of that fine?
    words: [pendapat, denda]
  - id: e12
    type: speaking
    text: Inilah Gili Trawangan. Di sini tidak ada mobil!
    meaning:
      ar_eg: أهي جيلي تراوانجان. هنا مفيش عربيات!
      ar: ها هي جيلي تراوانغان، ولا سيارات هنا!
      en: Here's Gili Trawangan. There are no cars here!
dialogue:
  title: Penangkaran penyu
  lines:
    - speaker: Mas Rizal
      text: Inilah tempat penangkaran penyu di Gili Trawangan.
      ar_eg: أهو ده مكان تربية السلاحف في جيلي تراوانجان.
      ar: ها هو مكان تفقيس السلاحف في جيلي تراوانغان.
      en: Here's the turtle hatchery on Gili Trawangan.
    - speaker: Mohamed
      text: Wah, penyunya kecil banget! Umurnya berapa?
      ar_eg: واو، السلاحف صغيرة أوي! عندها كام يوم؟
      ar: يا للعجب، السلاحف صغيرة جدًا! كم عمرها؟
      en: Wow, the turtles are tiny! How old are they?
    - speaker: Mas Rizal
      text: Baru dua minggu. Relawan menjaganya sampai cukup besar.
      ar_eg: أسبوعين بس. المتطوعين بيرعوها لحد ما تكبر كفاية.
      ar: أسبوعان فقط، ويرعاها المتطوعون حتى تكبر بما يكفي.
      en: Just two weeks. The volunteers look after them until they're big enough.
    - speaker: Mohamed
      text: Bukannya di laut banyak plastik? Mereka bakal baik-baik aja?
      ar_eg: مش البحر فيه بلاستيك كتير؟ هي هتبقى كويسة؟
      ar: أليس في البحر بلاستيك كثير؟ هل ستكون بخير؟
      en: Isn't there a lot of plastic in the sea? Will they be all right?
    - speaker: Mas Rizal
      text: Makanya kita harus mengurangi sampah. Siapa pun bisa bantu!
      ar_eg: عشان كده لازم نقلّل الزبالة. أي حد يقدر يساعد!
      ar: لذلك يجب أن نقلّل النفايات، ويستطيع أيّ أحد أن يساعد!
      en: That's why we must reduce waste. Anyone can help!
souvenir:
  id: bipa3.u02.souvenir
  title: Penyu-penyu Gili
  note:
    ar_eg: جزر جيلي التلاتة ممنوع فيها العربيات والموتوسيكلات؛ الناس بتتنقل بالعجل أو بالـ«تشيدومو»، العربية الصغيرة اللي بيجرّها حصان. أهل الجزر عاملين أماكن لتربية السلاحف لحد ما تكبر وترجع البحر، وبيعملوا حملات لتنضيف الشعاب المرجانية. لو عُمت هناك وشُفت سلحفاة، افتكر إن ناس كتير حافظوا عليها!
    ar: تمنع جزر جيلي الثلاث السيارات والدراجات النارية، فيتنقّل الناس بالدراجات أو بالـ«تشيدومو»، وهي عربة صغيرة يجرّها حصان. وقد أقام أهل الجزر أماكن لتفقيس السلاحف ورعايتها حتى تعود إلى البحر، وينظّمون حملات لتنظيف الشعاب المرجانية. فإذا سبحتَ هناك ورأيت سلحفاة، فتذكّر أن كثيرين حافظوا عليها!
    en: The three Gili islands ban cars and motorbikes; people get around by bicycle or cidomo, a little horse-drawn cart. Islanders run turtle hatcheries that raise the young until they can return to the sea, and they organise reef clean-ups. If you snorkel there and meet a turtle, remember how many people looked after it!
