schema: kabar.lesson/v1
id: bipa4.u09.l09
language: id
title: Laporan suhu laut
can_do:
  ar_eg: تفهم تقرير إخباري عن سخونة البحر وتقول السبب والنتيجة.
  ar: أن تفهم تقريرًا إخباريًا عن ارتفاع حرارة البحر وتذكر السبب والنتيجة.
  en: Follow a news report on rising sea temperatures and give the causes and effects.
slides:
  - title: Laporan di radio
    body:
      ar_eg: |
        تقرير قصير في راديو مانادو عن الشعاب المرجانية في بوناكين. اسمع الأول.
        كلمتين جداد: peneliti = باحث، terancam = مهدّد (من ancam = يهدّد).
      ar: |
        تقرير قصير في إذاعة مانادو عن الشعاب المرجانية في بوناكين. استمع أولًا.
        كلمتان جديدتان: peneliti = باحث، وterancam = مهدَّد (من ancam = يهدّد).
      en: |
        A short report on Manado radio about the coral reefs of Bunaken. Listen first.
        Two new words: peneliti = researcher; terancam = threatened (from ancam, to threaten).
    examples:
      - text: Para peneliti melaporkan bahwa suhu laut di sekitar Bunaken lebih tinggi dari biasanya.
        ar_eg: الباحثين بيقولوا إن حرارة البحر حوالين بوناكين أعلى من العادي.
        ar: أفاد الباحثون بأن حرارة البحر حول بوناكين أعلى من المعتاد.
        en: Researchers report that the sea temperature around Bunaken is higher than usual.
      - text: Akibatnya, sebagian terumbu karang memutih. Jika suhu tidak turun, karang itu bisa mati.
        ar_eg: والنتيجة إن جزء من الشعاب المرجانية ابيضّ. ولو الحرارة ماانزلتش، المرجان ده ممكن يموت.
        ar: ونتيجةً لذلك ابيضّ جزء من الشعاب المرجانية، وإن لم تنخفض الحرارة فقد يموت ذلك المرجان.
        en: As a result, some of the coral reef has turned white. If the temperature doesn't drop, that coral may die.
      - text: Para nelayan khawatir, karena mata pencaharian mereka terancam.
        ar_eg: الصيادين قلقانين، عشان أكل عيشهم مهدّد.
        ar: الصيادون قلقون لأن مصدر رزقهم مهدَّد.
        en: Fishermen are worried, because their livelihood is threatened.
exercises:
  - id: e01
    type: listen
    text: Para peneliti melaporkan bahwa suhu laut di sekitar Bunaken lebih tinggi dari biasanya.
    question:
      ar_eg: مين اللي عمل التقرير عن حرارة البحر؟
      ar: من أفاد بارتفاع حرارة البحر؟
      en: Who reported on the sea temperature?
    options: [Para penyelam, Para peneliti, Para nelayan]
    answer: 1
    meaning:
      ar_eg: الباحثين بيقولوا إن حرارة البحر حوالين بوناكين أعلى من العادي.
      ar: أفاد الباحثون بأن حرارة البحر حول بوناكين أعلى من المعتاد.
      en: Researchers report that the sea temperature around Bunaken is higher than usual.
    words: [peneliti, suhu, sekitar]
  - id: e02
    type: listen
    text: Akibatnya, sebagian terumbu karang memutih.
    question:
      ar_eg: إيه اللي حصل للمرجان؟
      ar: ماذا حدث للمرجان؟
      en: What happened to the coral?
    options:
      - Sebagian memutih.
      - Semuanya sudah mati.
      - Warnanya lebih cerah.
    answer: 0
    meaning:
      ar_eg: والنتيجة إن جزء من الشعاب المرجانية ابيضّ.
      ar: ونتيجةً لذلك ابيضّ جزء من الشعاب المرجانية.
      en: As a result, some of the coral reef has turned white.
  - id: e03
    type: listen
    text: Para nelayan khawatir, karena mata pencaharian mereka terancam.
    question:
      ar_eg: الصيادين قلقانين ليه؟
      ar: لماذا الصيادون قلقون؟
      en: Why are the fishermen worried?
    options:
      - Karena perahu mereka rusak.
      - Karena harga ikan naik.
      - Karena mata pencaharian mereka terancam.
    answer: 2
    meaning:
      ar_eg: الصيادين قلقانين، عشان أكل عيشهم مهدّد.
      ar: الصيادون قلقون لأن مصدر رزقهم مهدَّد.
      en: Fishermen are worried, because their livelihood is threatened.
    words: [terancam, mata pencaharian]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي ممكن يحصل لو الحرارة ماانزلتش؟
      ar: ماذا قد يحدث إن لم تنخفض الحرارة؟
      en: What can happen if the temperature doesn't drop?
    options:
      - Wisatawan bertambah banyak.
      - Karang itu bisa mati.
      - Laut menjadi lebih bersih.
    answer: 1
    words: [suhu]
    explain:
      ar_eg: "التقرير بيقول: لو الحرارة مانزلتش، المرجان ممكن يموت (bisa mati). مفيش كلام عن سياح أكتر ولا بحر أنضف."
      ar: "يقول التقرير: إن لم تنخفض الحرارة فقد يموت المرجان (bisa mati)، دون ذكر سياح أكثر أو بحر أنظف."
      en: The report says if the temperature doesn't drop, the coral could die (bisa mati). Nothing about more tourists or cleaner sea.
  - id: e05
    type: match_pairs
    pairs:
      - text: peneliti
        ar_eg: باحث
        ar: باحث
        en: researcher
      - text: terancam
        ar_eg: مهدّد
        ar: مهدَّد
        en: threatened
      - text: suhu
        ar_eg: درجة الحرارة
        ar: درجة الحرارة
        en: temperature
      - text: memutih
        ar_eg: يبيضّ
        ar: يبيضّ
        en: turn white
      - text: mata pencaharian
        ar_eg: أكل العيش
        ar: مصدر الرزق
        en: livelihood
    words: [peneliti, terancam, suhu, mata pencaharian]
  - id: e06
    type: fill_blank
    sentence: Mata pencaharian nelayan ___ karena ikan berkurang.
    meaning:
      ar_eg: أكل عيش الصيادين مهدّد عشان السمك بيقلّ.
      ar: مصدر رزق الصيادين مهدَّد لأن الأسماك تتناقص.
      en: Fishermen's livelihood is threatened because there are fewer fish.
    options: [terletak, tertutup, terancam]
    answers: [terancam]
    words: [terancam]
    explain:
      ar_eg: terancam = في خطر، ورزق الصيادين في خطر. terletak = موجود في مكان، وtertutup = مقفول.
      ar: terancam = مهدَّد، فرزق الصيادين مهدّد. أما terletak فيقع في مكان، وtertutup مغلق.
      en: "terancam means threatened: the fishermen's livelihood is at risk. terletak is \"located\", and tertutup is \"closed\"."
  - id: e07
    type: dictation
    text: Para peneliti melaporkan kenaikan suhu laut.
    meaning:
      ar_eg: الباحثين بلّغوا إن حرارة البحر زادت.
      ar: أفاد الباحثون بارتفاع حرارة البحر.
      en: Researchers report a rise in sea temperature.
    words: [peneliti, kenaikan, suhu]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بسبب تغيّر المناخ، الشعاب المرجانية مهدّدة.
      ar: بسبب تغيّر المناخ، الشعاب المرجانية مهدَّدة.
      en: As a result of climate change, the coral reef is threatened.
    answers:
      - Akibat perubahan iklim, terumbu karang terancam.
      - Akibat perubahan iklim, terumbu karang itu terancam.
      - Karena perubahan iklim, terumbu karang terancam.
      - Karena perubahan iklim, terumbu karang itu terancam.
      - Terumbu karang terancam akibat perubahan iklim.
      - Terumbu karang terancam karena perubahan iklim.
    words: [terancam, iklim]
  - id: e09
    type: multiple_choice
    question: Ada sekitar seratus peneliti di Bunaken.
    question_meaning:
      ar_eg: عدد الباحثين كام؟
      ar: كم عدد الباحثين؟
      en: How many researchers are there?
    options: ['Kira-kira seratus.', 'Seratus, tidak kurang.', 'Seribu.']
    answer: 0
    explain:
      ar_eg: sekitar + رقم = حوالي.
      ar: sekitar + عدد = حوالي.
      en: sekitar + number = about.
    words: [sekitar, peneliti]
  - id: e10
    type: fill_blank
    sentence: Suhu laut di ___ Bunaken naik.
    meaning:
      ar_eg: حرارة البحر حوالين بوناكن عليت.
      ar: ارتفعت حرارة البحر حول بوناكن.
      en: The sea temperature around Bunaken has risen.
    options: [sekitar, peneliti, terancam]
    answers: [sekitar]
    words: [sekitar, suhu]
    explain:
      ar_eg: di sekitar = حوالين، يعني حوالين بوناكين. peneliti = باحث، وterancam = في خطر.
      ar: di sekitar = حول، أي حول بوناكين. أما peneliti فالباحث، وterancam مهدّد.
      en: di sekitar means around, as in around Bunaken. peneliti is a researcher, and terancam is threatened.
dialogue:
  title: Berita dari Bunaken
  lines:
    - speaker: Mohamed
      text: Mas, tadi di radio ada laporan tentang suhu laut di Bunaken.
      ar_eg: يا Mas، كان فيه تقرير في الراديو من شوية عن حرارة البحر في بوناكين.
      ar: يا Mas، كان في الإذاعة قبل قليل تقرير عن حرارة البحر في بوناكين.
      en: Mas, there was a report on the radio about the sea temperature at Bunaken.
    - speaker: Mas Rizal
      text: Iya, aku dengar. Sebagian karang memutih, kan?
      ar_eg: أيوه، سمعته. جزء من المرجان ابيضّ، صح؟
      ar: نعم، سمعته. ابيضّ جزء من المرجان، أليس كذلك؟
      en: Yes, I heard it. Some of the coral has turned white, right?
    - speaker: Mohamed
      text: Bener. Kata peneliti, kalau suhunya nggak turun, karang itu bisa mati.
      ar_eg: مظبوط. الباحثين بيقولوا لو الحرارة ماانزلتش، المرجان ده ممكن يموت.
      ar: صحيح. يقول الباحثون إنه إن لم تنخفض الحرارة فقد يموت المرجان.
      en: Right. The researchers say if the temperature doesn't drop, that coral may die.
    - speaker: Mas Rizal
      text: Kasihan nelayan di sini. Mata pencaharian mereka terancam.
      ar_eg: يا حرام على الصيادين هنا. أكل عيشهم مهدّد.
      ar: مساكين الصيادون هنا، فمصدر رزقهم مهدَّد.
      en: Poor fishermen here. Their livelihood is threatened.
    - speaker: Mohamed
      text: Makanya kita semua harus peduli sama lingkungan.
      ar_eg: وعشان كده، لازم كلنا نهتم بالبيئة.
      ar: ولذلك يجب علينا جميعًا أن نهتمّ بالبيئة.
      en: That's why we all have to care about the environment.
new_words:
  - word: peneliti
    pos: noun
    ar_eg: باحث
    ar: باحث
    en: researcher
  - word: terancam
    pos: adjective
    ar_eg: مهدّد
    ar: مهدَّد
    en: threatened
  - word: sekitar
    pos: preposition
    ar_eg: حوالين / حوالي (sekitar seratus = حوالي مية)
    ar: حول / حوالي
    en: around; about
review:
