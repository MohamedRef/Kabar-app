dialogue:
  title: Menulis dongeng
  lines:
    - speaker: Mohamed
      text: Mas, aku mau nulis dongeng. Mulainya gimana?
      ar_eg: يا ماس، عايز أكتب حدوتة. أبدأ إزاي؟
      ar: يا ماس، أريد أن أكتب حكاية. كيف أبدأ؟
      en: Mas, I want to write a folk tale. How do I start?
    - speaker: Mas Rizal
      text: Kalau nulis, mulai pakai “Pada zaman dahulu, hiduplah …”.
      ar_eg: لما تكتب، ابدأ بـ«Pada zaman dahulu, hiduplah …» (كان يا ما كان، كان فيه …).
      ar: عند الكتابة ابدأ بـ«Pada zaman dahulu, hiduplah …» (كان يا ما كان، كان هناك …).
      en: When you write, start with "Once upon a time there lived …".
    - speaker: Mohamed
      text: Terus?
      ar_eg: وبعدين؟
      ar: ثم؟
      en: And then?
    - speaker: Mas Rizal
      text: Terus “Suatu hari …”, ada masalah. Akhirnya, masalahnya selesai.
      ar_eg: وبعدين «في يوم من الأيام…» وتحصل مشكلة. وفي الآخر المشكلة تتحل.
      ar: ثم «وفي يوم من الأيام…» فتقع مشكلة، وفي النهاية تُحلّ.
      en: Then "One day …", and there's a problem. In the end, the problem is solved.
    - speaker: Mas Rizal
      text: Jangan lupa amanatnya. Misalnya, jangan sombong!
      ar_eg: 'وما تنساش العبرة. مثلًا: ما تتكبّرش!'
      ar: 'ولا تنسَ العبرة، مثل: لا تتكبّر!'
      en: Don't forget the moral. For example, don't be arrogant!
