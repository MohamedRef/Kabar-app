schema: kabar.lesson/v1
id: bipa3.u09.l03
language: id
title: Pada zaman dahulu
can_do:
  ar_eg: 'تبني حدوتة بالترتيب: البداية، المشكلة، النهاية، والعبرة.'
  ar: 'أن تبني حكاية مرتبة: البداية والعقدة والحل والعبرة.'
  en: Build a tale in order, with an opening, a problem, an ending and a moral.
slides:
  - title: Pada zaman dahulu, hiduplah …
    body:
      ar_eg: |
        الحدوتة الإندونيسية ليها قالب ثابت:
        1) البداية: Pada zaman dahulu, hiduplah seorang … = كان يا ما كان، كان فيه…
        2) المشكلة: Suatu hari, … = في يوم من الأيام…
        وzaman جاية من العربي «زمان». وhiduplah = hidup + -lah (كان عايش).
      ar: |
        للحكاية الإندونيسية قالب ثابت:
        1) الافتتاح: Pada zaman dahulu, hiduplah seorang … = كان يا ما كان، كان هناك…
        2) العقدة: Suatu hari, … = وفي يوم من الأيام…
        وzaman من العربية «زمان»، وhiduplah = hidup مع -lah (عاش).
      en: |
        Indonesian folk tales follow a fixed frame:
        1) Opening: Pada zaman dahulu, hiduplah seorang … = Once upon a time there lived a …
        2) Problem: Suatu hari, … = One day, …
        zaman comes from Arabic «زمان»; hiduplah = hidup + -lah (there lived).
    examples:
      - text: Pada zaman dahulu, hiduplah seorang raja yang sombong.
        ar_eg: كان يا ما كان، كان فيه ملك متكبّر.
        ar: كان يا ما كان، عاش ملكٌ متكبّر.
        en: Once upon a time there lived an arrogant king.
      - text: Suatu hari, datang seorang anak yang cerdik.
        ar_eg: في يوم من الأيام، جه ولد مكّار.
        ar: وفي يوم من الأيام جاء ولدٌ ذكي.
        en: One day, a clever child came.
  - title: Akhirnya … · Amanat
    body:
      ar_eg: |
        3) النهاية: Akhirnya, … = وفي الآخر…
        4) العبرة: Amanat cerita ini adalah … = العبرة من الحدوتة إن…
        وamanat جاية من العربي «أمانة»: الرسالة اللي الحدوتة شايلاها لك.
      ar: |
        3) الحل: Akhirnya, … = وفي النهاية…
        4) العبرة: Amanat cerita ini adalah … = العبرة من هذه الحكاية أنّ…
        وamanat من العربية «أمانة»: الرسالة التي تحملها الحكاية إليك.
      en: |
        3) Ending: Akhirnya, … = In the end, …
        4) Moral: Amanat cerita ini adalah … = The moral of this story is …
        amanat comes from Arabic «أمانة»: the message the story carries for you.
    examples:
      - text: Akhirnya, raja itu tidak sombong lagi.
        ar_eg: وفي الآخر، الملك بطّل يتكبّر.
        ar: وفي النهاية لم يعد الملك متكبّرًا.
        en: In the end, the king was no longer arrogant.
      - text: Amanat cerita ini adalah jangan sombong.
        ar_eg: 'العبرة من الحدوتة: ما تتكبّرش.'
        ar: 'العبرة من هذه الحكاية: لا تتكبّر.'
        en: The moral of this story is don't be arrogant.
  - title: "Cerita lisan: jadi gini, terus"
    body:
      ar_eg: |
        لما تحكي حكاية بصوتك: Jadi gini… (بص يا سيدي…)، terus (وبعدين = lalu)، soalnya (عشان = karena).
        لما تكتب الحكاية: Pada zaman dahulu, hiduplah… وSuatu hari… — رسمي.
        نفس الحكاية، لسانين.
      ar: |
        عند الحكي بصوتك: Jadi gini… (اسمع الحكاية…)، terus (ثم = lalu)، soalnya (لأن = karena).
        وعند كتابة الحكاية: Pada zaman dahulu, hiduplah… وSuatu hari… بالفصحى.
        الحكاية واحدة والأسلوب اثنان.
      en: |
        Telling a story out loud: Jadi gini… (So here's how it goes…), terus (and then = lalu), soalnya (because = karena).
        Writing the story: Pada zaman dahulu, hiduplah… and Suatu hari… in standard Indonesian.
        One story, two registers.
    examples:
      - text: "Jadi gini, terus kancilnya lompat!"
        ar_eg: "بص يا سيدي، وبعدين الكانشيل نط!"
        ar: "إليك القصة: ثم قفز الكنشيل!"
        en: "So here's the thing, then the mouse deer jumped!"
      - text: "Pada zaman dahulu, hiduplah seekor kancil yang cerdik."
        ar_eg: "كان يا ما كان، كان فيه كانشيل شاطر."
        ar: "كان يا ما كان، عاش غزال صغير ذكي."
        en: "Once upon a time there lived a clever mouse deer."
