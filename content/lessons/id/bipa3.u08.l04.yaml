schema: kabar.lesson/v1
id: bipa3.u08.l04
language: id
title: Pertama, selanjutnya, akhirnya
can_do:
  ar_eg: تفهم وتدّي تعليمات أمان بالترتيب.
  ar: أن تفهم تعليمات السلامة وتعطيها بالترتيب.
  en: Follow and give safety instructions in order.
slides:
  - title: Langkah demi langkah
    body:
      ar_eg: |
        فاكر من المستوى التاني: pertama / mula-mula (الأول)، lalu / kemudian (بعدين)، setelah itu (بعد كده)، selanjutnya (وبعد كده)، akhirnya (في الآخر).
        تعليمات الأمان بتستعملهم مع فعل أمر: jauhi = ابعد عن (أمر من menjauhi).
      ar: |
        تذكّر من المستوى الثاني: pertama / mula-mula (أولًا)، lalu / kemudian (ثم)، setelah itu (بعد ذلك)، selanjutnya (بعدئذ)، akhirnya (أخيرًا).
        وتستعملها تعليمات السلامة مع فعل الأمر: jauhi = ابتعد عن (أمر من menjauhi).
      en: |
        Remember from BIPA 2: pertama / mula-mula (first), lalu / kemudian (then), setelah itu (after that), selanjutnya (next), akhirnya (finally).
        Safety instructions use them with commands: jauhi = keep away from (command form of menjauhi).
    grammar: id.conjunction.sequence
    examples:
      - text: Pertama, berlindung di bawah meja.
        ar_eg: الأول، استخبى تحت الترابيزة.
        ar: أولًا، احتمِ تحت الطاولة.
        en: First, take shelter under a table.
      - text: Kemudian, jauhi jendela dan lemari.
        ar_eg: بعدين، ابعد عن الشبابيك والدواليب.
        ar: ثم ابتعد عن النوافذ والخزائن.
        en: Then keep away from windows and cupboards.
  - title: Tas siaga bencana
    body:
      ar_eg: |
        bencana = كارثة، وbencana alam = كارثة طبيعية.
        في إندونيسيا بينصحوا كل بيت يجهّز tas siaga bencana (شنطة طوارئ): air (مية)، senter (كشاف)، obat (دوا)، وورق مهم.
      ar: |
        bencana = كارثة، وbencana alam = كارثة طبيعية.
        ويُنصح كل بيت في إندونيسيا بتجهيز tas siaga bencana (حقيبة طوارئ): air (ماء) وsenter (مصباح يدوي) وobat (دواء) ووثائق مهمة.
      en: |
        bencana = disaster; bencana alam = natural disaster.
        Indonesian households are advised to keep a tas siaga bencana (emergency bag): air (water), senter (a torch), obat (medicine) and important papers.
    grammar: id.conjunction.sequence
    examples:
      - text: Selanjutnya, bawa tas siaga bencana.
        ar_eg: وبعد كده، خد شنطة الطوارئ.
        ar: بعد ذلك، خذ حقيبة الطوارئ.
        en: Next, take the emergency bag.
      - text: Akhirnya, tunggu di lapangan sampai gempa selesai.
        ar_eg: وفي الآخر، استنى في الساحة لحد ما الزلزال يخلص.
        ar: وأخيرًا، انتظر في الساحة حتى ينتهي الزلزال.
        en: Finally, wait in the open field until the earthquake is over.
