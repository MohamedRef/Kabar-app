      ar: الزلازل والفيضانات كوارث طبيعية.
      en: Earthquakes and floods are natural disasters.
    answers:
      - Gempa dan banjir adalah bencana alam.
      - Gempa dan banjir adalah bencana alam
      - Gempa bumi dan banjir adalah bencana alam.
      - Gempa bumi dan banjir adalah bencana alam
      - Gempa dan banjir merupakan bencana alam.
      - Gempa bumi dan banjir merupakan bencana alam.
      - Gempa dan banjir itu bencana alam.
      - Gempa dan banjir bencana alam.
    words: [bencana]
  - id: e08
    type: speaking
    text: Pertama, berlindung di bawah meja. Kemudian, jauhi jendela.
    meaning:
      ar_eg: الأول، استخبى تحت الترابيزة. بعدين، ابعد عن الشباك.
      ar: أولًا، احتمِ تحت الطاولة. ثم ابتعد عن النافذة.
