dialogue:
  title: Poster di sekolah
  lines:
    - speaker: Mohamed
      text: Mas, ini poster tentang apa?
      ar_eg: يا ماس، البوستر ده عن إيه؟
      ar: يا ماس، عمَّ هذا الملصق؟
      en: Mas, what's this poster about?
    - speaker: Mas Rizal
      text: Tentang gempa. Pertama, berlindung di bawah meja. Kemudian, jauhi jendela.
      ar_eg: عن الزلزال. الأول، استخبى تحت الترابيزة. بعدين، ابعد عن الشباك.
      ar: عن الزلزال. أولًا، احتمِ تحت الطاولة. ثم ابتعد عن النافذة.
      en: Earthquakes. First, take shelter under a table. Then keep away from the window.
    - speaker: Mohamed
      text: Setelah itu?
      ar_eg: وبعد كده؟
      ar: وبعد ذلك؟
      en: And after that?
    - speaker: Mas Rizal
      text: Setelah gempa berhenti, bawa tas siaga bencana dan keluar ke lapangan.
      ar_eg: بعد ما الزلزال يقف، خد شنطة الطوارئ واطلع على الساحة.
      ar: بعد أن يتوقف الزلزال، خذ حقيبة الطوارئ واخرج إلى الساحة.
      en: Once the earthquake stops, take the emergency bag and go out to the open field.
