    answer: 0
    words: [tas siaga]
  - id: e05
    type: fill_blank
    sentence: Setelah gempa berhenti, segera keluar ke ___.
    meaning:
      ar_eg: (الساحة المفتوحة) بعد ما الزلزال يقف، اطلع على الساحة على طول.
      ar: (الساحة المفتوحة) بعد أن يتوقف الزلزال، اخرج فورًا إلى الساحة.
      en: (the open field) After the earthquake stops, go out to the open field right away.
