      ar_eg: الأرض بتتهز. أول خطوة صح إيه؟
      ar: الأرض تهتز. ما الخطوة الأولى الصحيحة؟
      en: The ground is shaking. What's the right first step?
    options:
      - Pertama, berdiri di dekat jendela.
      - Pertama, berlindung di bawah meja.
      - Pertama, tidur lagi.
    answer: 1
    words: [berlindung, jendela]
  - id: e03
    type: listen
    text: Kemudian, jauhi jendela dan lemari.
    options:
      - Kemudian, buka jendela dan lemari.
      - Akhirnya, jauhi jendela dan lemari.
      - Kemudian, jauhi jendela dan lemari.
