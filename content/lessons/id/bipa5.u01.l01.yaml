schema: kabar.lesson/v1
id: bipa5.u01.l01
language: id
title: Ragam resmi
can_do:
  ar_eg: تختار عن قصد بين الإندونيسي الرسمي والعامي في الشغل.
  ar: أن تختار عن وعي بين المستوى الرسمي وغير الرسمي في العمل.
  en: Switch register deliberately at work.
slides:
  - title: Baku atau santai?
    grammar: id.register.formal-informal
    body:
      ar_eg: |
        إنت دلوقتي بتفهم الرسمي والعامي، والمهارة الجديدة إنك تختار بينهم عن قصد.
        - مع المدير والعميل والإيميل: saya، Anda، Bapak / Ibu، وtidak، sudah، saja.
        - مع زمايلك في الاستراحة: aku / kamu (أو gue / lu في جاكرتا)، وnggak، udah، aja.
        - السؤال الرسمي بيبدأ بـ Apakah، والفعل بياخد البادئة كاملة: mengirimkan مش ngirimin.
        الغلطة مش العامي نفسه، الغلطة إنك تخلط: إيميل للمدير فيه nggak، أو مقابلة فيها gue.
      ar: |
        أنت تفهم الآن المستويين، والمهارة الجديدة أن تختار بينهما عن وعي.
        - مع المدير والعميل وفي البريد: saya وAnda وBapak / Ibu، وtidak وsudah وsaja.
        - مع الزملاء في الاستراحة: aku / kamu (أو gue / lu في جاكرتا)، وnggak وudah وaja.
        - يبدأ السؤال الرسمي بـ Apakah، ويأخذ الفعل سوابقه كاملة: mengirimkan لا ngirimin.
        والخطأ ليس في العامية نفسها، بل في الخلط: رسالة إلى المدير فيها nggak، أو مقابلة فيها gue.
      en: |
        You understand both registers now; the new skill is choosing on purpose.
        - With your boss, clients and in email: saya, Anda, Bapak / Ibu, and tidak, sudah, saja.
        - With colleagues on a break: aku / kamu (gue / lu in Jakarta), and nggak, udah, aja.
        - Formal questions start with Apakah, and verbs keep their full affixes: mengirimkan, not ngirimin.
        The mistake isn't slang itself, it's mixing: an email to your boss with nggak, or an interview with gue.
    examples:
      - text: Apakah Bapak sudah menerima berkas saya?
        ar_eg: حضرتك استلمت ورقي يا أستاذ؟
        ar: هل استلمتَ ملفّي يا سيدي؟
        en: Have you received my documents, sir?
      - text: Kamu udah kirim berkasnya belum?
        ar_eg: إنت بعت الورق ولا لسه؟
        ar: هل أرسلتَ الملف أم ليس بعد؟
        en: Have you sent the documents yet?
  - title: Dengan hormat
    body:
      ar_eg: |
        الإيميل أو الجواب الرسمي ليه برواز ثابت:
        - Dengan hormat, = في البداية، زي «تحية طيبة وبعد».
        - Terima kasih atas perhatian Bapak/Ibu. = شكرًا لاهتمام حضرتك.
        - Hormat saya, + اسمك = في الآخر، زي «وتفضلوا بقبول فائق الاحترام».
        وhormat نفسها جاية من العربي «حُرمة»: الاحترام.
        ومع المدير (atasan) قول Bapak / Ibu + الاسم، ومتقولش الاسم لوحده.
      ar: |
        للرسالة الرسمية إطار ثابت:
        - Dengan hormat, في البداية، مثل «تحية طيبة وبعد».
        - Terima kasih atas perhatian Bapak/Ibu. = شكرًا على اهتمامكم.
        - Hormat saya, ثم الاسم في الختام، مثل «وتفضلوا بقبول الاحترام».
        وكلمة hormat من العربية «حُرمة» بمعنى الاحترام.
        ومع الرئيس (atasan) قل Bapak / Ibu مع الاسم، ولا تذكر الاسم وحده.
      en: |
        A formal email or letter has a fixed frame:
        - Dengan hormat, at the start (like "Dear Sir or Madam").
        - Terima kasih atas perhatian Bapak/Ibu. = Thank you for your attention.
        - Hormat saya, + your name at the end ("Yours faithfully").
        hormat itself comes from Arabic «حُرمة»: respect.
        With your superior (atasan), say Bapak / Ibu + name, never the bare name.
    examples:
      - text: Dengan hormat, saya ingin melamar posisi staf administrasi.
        ar_eg: تحية طيبة، حابب أقدّم على وظيفة موظف إداري.
        ar: تحية طيبة، أودّ التقدّم لوظيفة موظّف إداري.
        en: Dear Sir or Madam, I would like to apply for the administrative staff position.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: melamar
        ar_eg: يقدّم على وظيفة
        ar: يتقدّم لوظيفة
        en: to apply (for a job)
      - text: lowongan
        ar_eg: وظيفة فاضية
        ar: وظيفة شاغرة
        en: vacancy
      - text: berkas
        ar_eg: ورق / ملف
        ar: ملفّ، أوراق
        en: documents, file
      - text: atasan
        ar_eg: المدير / الرئيس في الشغل
        ar: الرئيس في العمل
        en: superior, boss
      - text: rekan kerja
        ar_eg: زميل شغل
        ar: زميل عمل
        en: colleague
    words: [melamar, lowongan, berkas, atasan, rekan kerja]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة تنفع في إيميل للمدير؟
      ar: أيّ جملة تصلح لرسالة إلى المدير؟
      en: Which sentence fits an email to your boss?
    options:
      - Pak, berkasnya udah gue kirim.
      - Pak, berkas saya nggak lengkap, ya.
      - Pak, saya sudah mengirimkan berkas saya.
    answer: 2
    explain:
      ar_eg: saya + sudah + mengirimkan كلهم رسمي. gue وudah وnggak عامي.
      ar: saya وsudah وmengirimkan كلها معيارية، أما gue وudah وnggak فعامية.
      en: saya, sudah and mengirimkan are all standard; gue, udah and nggak are casual.
    words: [berkas, atasan]
  - id: e03
    type: listen
    text: Apakah lowongan itu masih dibuka?
    options:
      - Apakah lowongan itu masih dibuka?
      - Apakah lowongan itu sudah ditutup?
      - Apakah berkas itu masih dibuka?
    answer: 0
    words: [lowongan]
  - id: e04
    type: fill_blank
    sentence: Dengan hormat, saya ingin ___ posisi staf pemasaran.
    meaning:
      ar_eg: تحية طيبة، حابب أقدّم على وظيفة موظف تسويق.
      ar: تحية طيبة، أودّ التقدّم لوظيفة موظّف تسويق.
      en: Dear Sir or Madam, I would like to apply for the marketing staff position.
    options: [melamar, ngelamar, lowongan]
    answers: [melamar]
    explain:
      ar_eg: في جواب رسمي الفعل بييجي كامل (melamar)، وngelamar عامي.
      ar: في الرسالة الرسمية يأتي الفعل تامًّا (melamar)، أما ngelamar فعامية.
      en: A formal letter takes the full verb (melamar); ngelamar is casual.
    words: [melamar, hormat]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كلمة hormat (احترام) جاية من أنهي كلمة عربي؟
      ar: من أيّ كلمة عربية جاءت hormat (احترام)؟
      en: Which Arabic word does hormat (respect) come from?
    options: [حرام, حُرمة, حرّية]
    answer: 1
    explain:
      ar_eg: hormat من «حُرمة»، يعني الاحترام والمكانة. وharam كلمة تانية خالص.
      ar: hormat من «حُرمة» أي الاحترام والمكانة، أما haram فكلمة أخرى.
      en: hormat comes from «حُرمة» (sanctity, respect); haram is a different word.
    words: [hormat]
  - id: e06
    type: build_sentence
    source:
      ar_eg: زميلي في الشغل لسه مابعتش الورق.
      ar: لم يرسل زميلي في العمل الأوراق بعد.
      en: My colleague hasn't sent the documents yet.
    answer: Rekan kerja saya belum mengirimkan berkasnya.
    distractors: [udah, gue]
    words: [rekan kerja, berkas]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هو الأستاذ (المدير) استلم الورق؟
      ar: هل استلم المديرُ الملفّ؟
      en: Has the boss (sir) received the documents?
    answers:
      - Apakah Bapak sudah menerima berkasnya?
      - Apakah Bapak sudah menerima berkas itu?
      - Apakah atasan sudah menerima berkasnya?
      - Apakah atasan sudah menerima berkas itu?
    explain:
      ar_eg: سؤال رسمي يبدأ بـ Apakah، والمدير اسمه Bapak، وsudah مش udah.
      ar: سؤال رسمي يبدأ بـ Apakah، ونخاطب المدير بـ Bapak، ونقول sudah لا udah.
      en: A formal question starts with Apakah; the boss is Bapak; sudah, not udah.
    words: [atasan, berkas]
  - id: e08
    type: speaking
    text: Dengan hormat, saya ingin melamar lowongan itu.
    meaning:
      ar_eg: تحية طيبة، حابب أقدّم على الوظيفة دي.
      ar: تحية طيبة، أودّ التقدّم لهذه الوظيفة.
      en: Dear Sir or Madam, I would like to apply for that vacancy.
    words: [hormat, melamar, lowongan]
  - id: e09
    type: multiple_choice
    question: "Aku makan siang sama ___ kerja dulu, ya."
    question_meaning:
      ar_eg: كمّل الجملة. «هتغدّى مع … الشغل الأول، ماشي.»
      ar: أكمل الجملة. «سأتغدّى مع … العمل أولًا.»
      en: Complete the sentence. "I'm having lunch with my … first, okay."
    options: [atasan, berkas, rekan]
    answer: 2
    explain:
      ar_eg: rekan kerja = زمايل الشغل. ومع الزمايل aku وsama عادي.
      ar: rekan kerja = زملاء العمل، ومعهم يصحّ aku وsama.
      en: rekan kerja = colleagues; aku and sama are fine with peers.
    words: [rekan kerja]
dialogue:
  title: Hari pertama di Balikpapan
  lines:
    - speaker: Mas Rizal
      text: Mohamed, ini Bu Lestari, atasan di kantor kami.
      ar_eg: يا محمد، دي الأستاذة ليستاري، المديرة في مكتبنا.
      ar: يا محمد، هذه السيدة ليستاري، المديرة في مكتبنا.
      en: Mohamed, this is Bu Lestari, the boss at our office.
    - speaker: Mohamed
      text: Selamat pagi, Bu Lestari. Apakah Ibu sudah menerima berkas saya?
      ar_eg: صباح الخير يا أستاذة ليستاري. حضرتك استلمتي ورقي؟
      ar: صباح الخير يا سيدة ليستاري. هل استلمتِ ملفّي؟
      en: Good morning, Bu Lestari. Have you received my documents?
    - speaker: Bu Lestari
      text: Sudah, Pak Mohamed. Terima kasih. Rekan kerja Anda menunggu di ruang rapat.
      ar_eg: أيوه يا أستاذ محمد، شكرًا. زمايلك مستنيينك في أوضة الاجتماعات.
      ar: نعم يا أستاذ محمد، شكرًا. زملاؤك ينتظرونك في قاعة الاجتماعات.
      en: Yes, Pak Mohamed, thank you. Your colleagues are waiting in the meeting room.
    - speaker: Mas Rizal
      text: Nanti siang kita makan bareng, ya. Santai aja!
      ar_eg: الضهر هناكل مع بعض. خليك رايق!
      ar: سنتغدّى معًا ظهرًا. خذ راحتك!
      en: We'll have lunch together later. Relax!
