schema: kabar.lesson/v1
id: bipa1.u02.l03
language: id
title: Kamu dari mana?
can_do:
  ar_eg: تسأل وتقول الشخص منين وساكن فين.
  ar: أن تسأل وتقول من أين الشخص وأين يسكن.
  en: Ask and say where someone is from and where they live.
slides:
  - title: Dari mana? Di mana?
    body:
      ar_eg: |
        «فين» في الإندونيسي = حرف جر + mana، زي العربي بالظبط:
        - dari mana = منين (dari ≈ من)
        - di mana = فين (di ≈ في) — بتتكتب كلمتين.
        - ke mana = على فين (ke ≈ لـ)
        وكلمة السؤال غالبًا بتيجي في الآخر: «Kamu tinggal di mana?» = «إنت ساكن فين؟».
      ar: |
        «أين» في الإندونيسية = حرف جر + mana، كما في العربية:
        - dari mana = من أين (dari ≈ من)
        - di mana = أين (di ≈ في)، وتُكتب كلمتين.
        - ke mana = إلى أين (ke ≈ إلى)
        وكثيرًا ما تأتي أداة الاستفهام في آخر الجملة: «Kamu tinggal di mana?» = «أين تسكن؟».
      en: |
        "Where" = preposition + mana, just like Arabic:
        - dari mana = where from (dari ≈ من)
        - di mana = where (di ≈ في) — written as two words.
        - ke mana = where to (ke ≈ إلى)
        The question phrase often goes last: "Kamu tinggal di mana?" = "Where do you live?"
    grammar: id.question.mana
    examples:
      - text: Anda dari mana? — Saya dari Mesir.
        ar_eg: حضرتك منين؟ — أنا من مصر.
        ar: من أين أنت؟ — أنا من مصر.
        en: Where are you from? — I'm from Egypt.
      - text: Kamu tinggal di mana? — Di Menteng.
        ar_eg: إنت ساكن فين؟ — في منتنج.
        ar: أين تسكن؟ — في منتنج.
        en: Where do you live? — In Menteng.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dari mana
        ar_eg: منين
        ar: من أين
        en: where from
      - text: di mana
        ar_eg: فين
        ar: أين
        en: where
      - text: ke mana
        ar_eg: على فين
        ar: إلى أين
        en: where to
      - text: tinggal
        ar_eg: ساكن / يسكن
        ar: يسكن
        en: to live (somewhere)
      - text: tapi
        ar_eg: بس / لكن
        ar: لكن
        en: but
    words: [dari, mana, di mana, ke mana, tinggal, tapi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تعرف Ni Luh ساكنة فين. تسأل إيه؟
      ar: تريد أن تعرف أين تسكن Ni Luh. ماذا تسأل؟
      en: You want to know where Ni Luh lives. What do you ask?
    options: ['Kamu dari mana?', 'Kamu ke mana?', 'Kamu tinggal di mana?']
    answer: 2
    explain:
      ar_eg: di mana = فين (المكان). dari mana = منين (الأصل). ke mana = على فين (رايح فين).
      ar: di mana للمكان (أين)، وdari mana للأصل (من أين)، وke mana للوجهة (إلى أين).
      en: di mana asks for the place; dari mana for the origin; ke mana for where someone is going.
    words: [tinggal, di mana]
  - id: e03
    type: listen
    text: Kamu ke mana?
    options: ['Kamu ke mana?', 'Kamu dari mana?', 'Kamu di mana?']
    answer: 0
    meaning:
      ar_eg: إنت رايح فين؟
      ar: إلى أين أنت ذاهب؟
      en: Where are you going?
    words: [ke mana]
  - id: e04
    type: fill_blank
    sentence: Anda ___ mana? — Saya dari Mesir.
    meaning:
      ar_eg: حضرتك منين؟ — أنا من مصر.
      ar: من أين أنت؟ — أنا من مصر.
      en: Where are you from? — I'm from Egypt.
    options: [dari, ke, di]
    answers: [dari]
    words: [dari, mana]
    explain:
      ar_eg: dari mana = منين، والرد dari Mesir (من مصر). ke = لـ، وdi = في.
      ar: dari mana = من أين، والجواب dari Mesir. ke إلى وdi في.
      en: "dari = from: Anda dari mana?"
  - id: e05
    type: fill_blank
    sentence: Rina orang ___. Dia tinggal di Jakarta.
    meaning:
      ar_eg: رينا إندونيسية. ساكنة في جاكرتا.
      ar: رينا إندونيسية، وتسكن في جاكرتا.
      en: Rina is Indonesian. She lives in Jakarta.
    answers: [Indonesia]
    words: [orang, Indonesia]
    explain:
      ar_eg: "orang + اسم البلد = جنسية: orang Indonesia = إندونيسية."
      ar: "orang + اسم البلد = الجنسية: orang Indonesia."
      en: "orang + country = nationality: orang Indonesia."
  - id: e06
    type: build_sentence
    source:
      ar_eg: أنا مصري، من القاهرة.
      ar: أنا مصري، من القاهرة.
      en: I'm Egyptian, from Cairo.
    answer: Saya orang Mesir, dari Kairo.
    distractors: [bahasa, di]
    words: [orang, Mesir, dari]
    explain:
      ar_eg: Saya orang Mesir (أنا مصري) + dari Kairo. bahasa وdi زيادة.
      ar: Saya orang Mesir، dari Kairo. bahasa وdi زائدتان.
      en: Saya orang Mesir, + dari Kairo. bahasa and di are extra.
  - id: e07
    type: build_sentence
    source:
      ar_eg: إنت ساكن فين؟
      ar: أين تسكن؟
      en: Where do you live?
    answer: Kamu tinggal di mana?
    alternatives: ['Di mana kamu tinggal?']
    distractors: [dari, siapa]
    words: [tinggal, di mana]
    explain:
      ar_eg: Kamu tinggal di mana? = ساكن فين؟ di mana = فين. dari وsiapa زيادة.
      ar: Kamu tinggal di mana؟ = أين تسكن؟ dari وsiapa زائدتان.
      en: Kamu + tinggal + di mana? dari and siapa are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Ni Luh orang Bali, tapi dia tinggal di Jakarta.
    answers_meaning:
      ar_eg: [ني لوه من بالي، بس ساكنة في جاكرتا., ني لوه بالينيزية بس عايشة في جاكرتا]
      ar: [ني لوه من بالي، لكنها تسكن في جاكرتا., ني لوه بالية لكنها تعيش في جاكرتا]
      en: ['Ni Luh is Balinese, but she lives in Jakarta.', 'Ni Luh is from Bali, but she lives in Jakarta']
    words: [orang, tapi, tinggal]
  - id: e09
    type: dictation
    text: Saya dari Mesir, tapi saya tinggal di Jakarta.
    meaning:
      ar_eg: أنا من مصر، بس ساكن في جاكرتا.
      ar: أنا من مصر، لكنني أسكن في جاكرتا.
      en: I'm from Egypt, but I live in Jakarta.
    words: [dari, Mesir, tapi, tinggal]
dialogue:
  title: Kopi di Menteng
  lines:
    - speaker: Ni Luh
      text: Mohamed, kamu dari mana?
      ar_eg: يا محمد، إنت منين؟
      ar: يا محمد، من أين أنت؟
      en: Mohamed, where are you from?
    - speaker: Mohamed
      text: Aku dari Mesir, dari Kairo. Kamu?
      ar_eg: أنا من مصر، من القاهرة. وإنتي؟
      ar: أنا من مصر، من القاهرة. وأنتِ؟
      en: I'm from Egypt, from Cairo. You?
    - speaker: Ni Luh
      text: Aku orang Bali, tapi aku tinggal di Jakarta.
      ar_eg: أنا من بالي، بس ساكنة في جاكرتا.
      ar: أنا من بالي، لكنني أسكن في جاكرتا.
      en: I'm Balinese, but I live in Jakarta.
    - speaker: Mohamed
      text: Kamu bisa bahasa Arab?
      ar_eg: إنتي بتعرفي عربي؟
      ar: هل تتحدثين العربية؟
      en: Do you speak Arabic?
    - speaker: Ni Luh
      text: Sedikit! Kamu bisa bahasa Indonesia?
      ar_eg: شوية! وإنت بتعرف إندونيسي؟
      ar: قليلًا! وهل تتحدث الإندونيسية؟
      en: A little! Do you speak Indonesian?
    - speaker: Mohamed
      text: Ya, sedikit. Aku juga bisa bahasa Inggris.
      ar_eg: أيوه، شوية. وكمان بعرف إنجليزي.
      ar: نعم، قليلًا. وأتحدث الإنجليزية أيضًا.
      en: Yes, a little. I speak English too.
