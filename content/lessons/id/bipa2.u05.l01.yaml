schema: kabar.lesson/v1
id: bipa2.u05.l01
language: id
title: Pedas, manis, asin
can_do:
  ar_eg: توصف طعم الأكل وتطلب أكلك في الوارونج.
  ar: أن تصف مذاق الطعام وتطلب طعامك.
  en: Describe tastes and order.
slides:
  - title: Pedas, manis, asin…
    body:
      ar_eg: |
        دي كلمات الطعم الأساسية، وكلها صفات بتيجي بعد الأكلة على طول:
        - pedas = حرّاق
        - manis = مسكّر / حلو
        - asin = مالح
        - asam = حامض
        - pahit = مُر
        - gurih = طعمه غني ومتسبّك (زي طعم المرقة)
        وزي ما اتعلمنا: sekali / banget / terlalu بيقوّوا الطعم: pedas sekali = حرّاق قوي.
      ar: |
        هذه كلمات المذاق الأساسية، وهي صفات تأتي بعد اسم الطعام:
        - pedas = حارّ
        - manis = حلو
        - asin = مالح
        - asam = حامض
        - pahit = مُرّ
        - gurih = غنيّ الطعم (كطعم المرق)
        وتقوّيها sekali وbanget وterlalu: pedas sekali = حارّ جدًّا.
      en: |
        The basic taste words. They are adjectives and come right after the food:
        - pedas = spicy (hot)
        - manis = sweet
        - asin = salty
        - asam = sour
        - pahit = bitter
        - gurih = savoury, rich (like a good broth)
        As you know, sekali / banget / terlalu make them stronger: pedas sekali = very spicy.
    examples:
      - text: Sambal ini pedas sekali!
        ar_eg: الشطة دي حرّاقة قوي!
        ar: هذه الصلصة الحارة حارّة جدًّا!
        en: This chilli sauce is very spicy!
      - text: Kopinya pahit, tetapi tehnya manis.
        ar_eg: القهوة مُرّة، بس الشاي مسكّر.
        ar: القهوة مُرّة، لكن الشاي حلو.
        en: The coffee is bitter, but the tea is sweet.
  - title: Lezat = لذّة
    body:
      ar_eg: |
        enak إنت عارفها: «حلو / طعمه جميل». وفيه كلمة أشيك منها: lezat، جاية من العربي «لذّة»! هتلاقيها في المنيو والإعلانات أكتر من الكلام العادي.
        وكمان halal (حلال) وharam (حرام) نفس الكلمتين العربي بالظبط.
      ar: |
        تعرف كلمة enak (لذيذ). وأرقى منها lezat، وهي من العربية «لذّة»، وتكثر في قوائم الطعام والإعلانات.
        وكذلك halal (حلال) وharam (حرام) مأخوذتان من العربية مباشرة.
      en: |
        You know enak (tasty). A fancier word is lezat, from Arabic «لذّة» (delight); you'll see it on menus and ads more than in chat.
        halal (حلال) and haram (حرام) are the Arabic words, unchanged.
    examples:
      - text: Sate lilit ini lezat sekali.
        ar_eg: السَّتيه ليليت ده طعمه لذيذ جدًّا.
        ar: سَتيه ليليت هذا لذيذ جدًّا.
        en: This sate lilit is delicious.
      - text: Ini warung Muslim. Semua makanannya halal.
        ar_eg: ده وارونج مسلم. كل الأكل بتاعه حلال.
        ar: هذا مطعم مسلم، وكل طعامه حلال.
        en: This is a Muslim stall. All its food is halal.
  - title: Saya mau pesan…
    body:
      ar_eg: |
        عشان تطلب أكل:
        - Saya mau pesan … = عايز أطلب …، والعدد في الآخر: nasi goreng satu = واحد رز مقلي.
        - pakai … = بـ… (معاه): teh pakai gula = شاي بسكر.
        - tidak pakai … = من غير: tidak pakai sambal = من غير شطة.
        - Jangan terlalu pedas, ya = ماتخليهوش حرّاق قوي.
        وفي بالي اسأل: «Ini halal?» عشان فيه أكل بلحم خنزير (babi).
      ar: |
        لطلب الطعام:
        - Saya mau pesan … = أريد أن أطلب …، ويأتي العدد في الآخر: nasi goreng satu.
        - pakai … = مع / بـ: teh pakai gula = شاي بسكّر.
        - tidak pakai … = بدون: tidak pakai sambal.
        - Jangan terlalu pedas, ya = لا تجعله حارًّا جدًّا.
        وفي بالي اسأل «Ini halal?» لأن بعض الأطعمة فيها لحم خنزير (babi).
      en: |
        To order:
        - Saya mau pesan … = I'd like to order …; the number goes last: nasi goreng satu = one fried rice.
        - pakai … = with: teh pakai gula = tea with sugar.
        - tidak pakai … = without: tidak pakai sambal.
        - Jangan terlalu pedas, ya = not too spicy, please.
        In Bali ask "Ini halal?", because some dishes contain pork (babi).
    examples:
      - text: Saya mau pesan nasi campur satu, tidak pakai sambal.
        ar_eg: عايز أطلب واحد ناسي تشامبور، من غير شطة.
        ar: أريد طبق ناسي تشامبور واحدًا بلا صلصة حارّة.
        en: I'd like one nasi campur, without chilli sauce.
      - text: Bu, ini halal?
        ar_eg: يا مدام، ده حلال؟
        ar: يا سيدتي، هل هذا حلال؟
        en: Excuse me, ma'am, is this halal?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: asin
        ar_eg: مالح
        ar: مالح
        en: salty
      - text: asam
        ar_eg: حامض
        ar: حامض
        en: sour
      - text: pahit
        ar_eg: مُر
        ar: مُرّ
        en: bitter
      - text: gurih
        ar_eg: طعمه غني
        ar: غنيّ الطعم
        en: savoury
      - text: sambal
        ar_eg: شطة إندونيسي
        ar: صلصة حارة
        en: chilli sauce
      - text: gula
        ar_eg: سكر
        ar: سكّر
        en: sugar
    words: [asin, asam, pahit, gurih, sambal, gula]
  - id: e02
    type: listen
    text: Kopinya pahit sekali.
    options: [Kopinya asin sekali., Kopinya manis sekali., Kopinya pahit sekali.]
    answer: 2
    words: [pahit]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة جاية من العربي «لذّة»؟
      ar: أيّ كلمة أصلها العربية «لذّة»؟
      en: Which word comes from Arabic «لذّة»?
    options: [gurih, lezat, pedas]
    answer: 1
    explain:
      ar_eg: lezat = لذيذ، من «لذّة». وgurih كلمة إندونيسية = طعمه غني.
      ar: lezat من «لذّة»، أما gurih فإندونيسية الأصل.
      en: lezat comes from «لذّة»; gurih is a native word (savoury).
    words: [lezat, gurih]
  - id: e04
    type: fill_blank
    sentence: Es teh ini terlalu ___. Gulanya banyak sekali.
    meaning:
      ar_eg: الشاي المتلج ده مسكّر زيادة. السكر فيه كتير قوي.
      ar: هذا الشاي المثلّج حلو أكثر من اللازم، فالسكّر فيه كثير جدًّا.
      en: This iced tea is too sweet. There's a lot of sugar in it.
    options: [asin, manis, pahit]
    answers: [manis]
    explain:
      ar_eg: سكر كتير = مسكّر = manis.
      ar: كثرة السكّر تجعله حلوًا (manis).
      en: Lots of sugar makes it manis.
    words: [manis, gula, terlalu]
  - id: e05
    type: listen
    text: Sate ini halal dan lezat.
    options: ['Sate ini halal dan lezat.', 'Sate ini asin dan asam.', 'Sate ini pahit dan gurih.']
    answer: 0
    meaning:
      ar_eg: السَتيه ده حلال ولذيذ.
      ar: هذا الساتيه حلال ولذيذ.
      en: This satay is halal and delicious.
    words: [halal, lezat, asin, asam, pahit, gurih]
  - id: e06
    type: dictation
    text: Makanannya halal, tidak pakai gula.
    meaning:
      ar_eg: الأكل حلال، ومن غير سكر.
      ar: الطعام حلال، وبلا سكّر.
      en: The food is halal, with no sugar.
    words: [halal, gula]
  - id: e07
    type: speaking
    text: Saya mau pesan nasi campur, tidak pakai sambal.
    meaning:
      ar_eg: عايز أطلب ناسي تشامبور، من غير شطة.
      ar: أريد أن أطلب ناسي تشامبور بدون صلصة حارّة.
      en: I'd like to order nasi campur, without sambal.
    words: [pesan, pakai, sambal]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تسأل «الأكل هنا حلال؟»
      ar: كيف تسأل «هل الطعام هنا حلال؟»
      en: How do you ask "Is the food here halal?"
    options: ['Makanan di sini halal?', 'Sambal di sini asam?', 'Makanan di sini lezat?']
    answer: 0
    words: [halal, sambal, asam, lezat]
dialogue:
  title: Malam di pasar Gianyar
  lines:
    - speaker: Bu Aminah
      text: Mau pesan apa, Pak?
      ar_eg: تحب تطلب إيه يا أستاذ؟
      ar: ماذا تريد أن تطلب يا سيدي؟
      en: What would you like to order, sir?
    - speaker: Mohamed
      text: Bu, makanan di sini halal?
      ar_eg: يا مدام، الأكل هنا حلال؟
      ar: يا سيدتي، هل الطعام هنا حلال؟
      en: Ma'am, is the food here halal?
    - speaker: Bu Aminah
      text: Halal, Pak. Ini warung Muslim. Ada ayam dan ikan.
      ar_eg: حلال يا أستاذ. ده وارونج مسلم. فيه فراخ وسمك.
      ar: حلال يا سيدي، هذا مطعم مسلم. لدينا دجاج وسمك.
      en: Halal, sir. This is a Muslim stall. We have chicken and fish.
    - speaker: Mohamed
      text: Saya mau pesan sate lilit ikan satu. Sambalnya pedas?
      ar_eg: عايز أطلب واحد ساتيه ليليت سمك. الشطة حرّاقة؟
      ar: أريد طبق ساتيه ليليت سمك واحدًا. هل الصلصة حارّة؟
      en: I'd like one fish sate lilit. Is the sambal spicy?
    - speaker: Bu Aminah
      text: Pedas sekali, tetapi lezat!
      ar_eg: حرّاقة قوي، بس لذيذة!
      ar: حارّة جدًّا، لكنها لذيذة!
      en: Very spicy, but delicious!
    - speaker: Mohamed
      text: Sedikit saja, Bu. Jangan terlalu pedas, ya.
      ar_eg: شوية صغيرين بس يا مدام. ماتخليهاش حرّاقة قوي.
      ar: قليلًا فقط يا سيدتي، ولا تجعليها حارّة جدًّا.
      en: Just a little, ma'am. Not too spicy, please.
