schema: kabar.lesson/v1
id: bipa5.u09.l07
language: id
title: Menerjemahkan ungkapan
can_do:
  ar_eg: 'تترجم تعبيرات اصطلاحية: الحرفي والمعنى، الوصف والحوار والإنشا، وإيه اللي متطابق وإيه الخصائص والمستويات.'
  ar: 'أن تترجم تعابير اصطلاحية: الحرفي والمعنى، والوصف والحوار والإنشاء، والمتطابق والخصائص والمستويات.'
  en: 'Translate idioms: literal versus meaning, description, dialogue and composition, identical forms, features and levels.'
slides:
  - title: Arti harfiah dan arti kiasan
    body:
      ar_eg: |
        ungkapan = تعبير اصطلاحي: panjang tangan = حرامي (حرفيًا: إيده طويلة!).
        harfiah = حرفي ← حرف (terjemahan harfiah = ترجمة حرفية)، identik = متطابق.
        deskripsi = وصف، dialog = حوار، karangan = إنشا، موضوع تعبير.
        karakteristik = خصائص، سمات، tingkatan = مستوى، درجة (tingkatan bahasa = مستويات اللغة).
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: aku = saya، nerjemahin = menerjemahkan، nggak = tidak، tiap = setiap، nulis = menulis.
      ar: |
        ungkapan = تعبير اصطلاحي: panjang tangan = لصّ (حرفيًا: طويل اليد!).
        harfiah = حرفي ← حرف (terjemahan harfiah = ترجمة حرفية)، identik = متطابق.
        deskripsi = وصف، dialog = حوار، karangan = إنشاء، موضوع تعبير.
        karakteristik = خصائص، سمات، tingkatan = مستوى، درجة (tingkatan bahasa = مستويات اللغة).
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: aku = saya، nerjemahin = menerjemahkan، nggak = tidak، tiap = setiap، nulis = menulis.
      en: |
        ungkapan = idiom, expression: panjang tangan = thief (literally "long hand"!).
        harfiah = literal ← Arabic حرف (terjemahan harfiah = literal translation), identik = identical.
        deskripsi = description, dialog = dialogue, karangan = composition, essay.
        karakteristik = characteristics, features, tingkatan = level, grade (tingkatan bahasa = speech levels).
        The dialogue uses street forms; the formal ones are beside them: aku = saya, nerjemahin = menerjemahkan, nggak = tidak, tiap = setiap, nulis = menulis.
    examples:
      - text: Ungkapan "panjang tangan" tidak boleh diterjemahkan secara harfiah.
        ar_eg: التعبير "panjang tangan" ما ينفعش يتترجم حرفي.
        ar: لا يجوز ترجمة تعبير "panjang tangan" ترجمة حرفية.
        en: The idiom "panjang tangan" mustn't be translated literally.
      - text: Bahasa Jawa punya tingkatan; bahasa Indonesia tidak.
        ar_eg: الجاوي فيه مستويات؛ الإندونيسي لأ.
        ar: للجاوية مستويات؛ وليست للإندونيسية.
        en: Javanese has speech levels; Indonesian doesn't.
      - text: Karangannya berisi deskripsi pasar dan dialog dengan penjual.
        ar_eg: الإنشا بتاعه فيه وصف للسوق وحوار مع بياع.
        ar: يتضمّن إنشاؤه وصفًا للسوق وحوارًا مع بائع.
        en: His essay has a description of the market and a dialogue with a seller.
exercises:
  - id: e01
    type: match_pairs
    pairs:
