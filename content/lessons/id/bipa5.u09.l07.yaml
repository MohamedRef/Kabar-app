    words: [karangan, identik, karakteristik, tingkatan]
  - id: e03
    type: listen
    text: Terjemahan harfiahnya lucu sekali.
    question:
      ar_eg: إيه اللي بيضحك؟
      ar: ما المضحك؟
      en: What is funny?
    options: [الترجمة الحرفية, الصورة, الأغنية]
    answer: 0
    meaning:
      ar_eg: الترجمة الحرفية بتاعته تضحك أوي.
      ar: ترجمته الحرفية مضحكة جدًا.
      en: The literal translation is hilarious.
    words: [harfiah]
  - id: e04
    type: fill_blank
    sentence: '"Buah tangan" adalah ___ yang artinya oleh-oleh.'
    meaning:
      ar_eg: '"Buah tangan" ___ معناه هدية السفر.'
      ar: '"Buah tangan" ___ يعني هدية العائد من السفر.'
      en: '"Buah tangan" is an ___ meaning a souvenir gift.'
    options: [ungkapan, tingkatan, dialog]
    answers: [ungkapan]
    words: [ungkapan, tingkatan, dialog]
    explain:
      ar_eg: buah tangan تعبير = ungkapan. tingkatan = مستوى وdialog = حوار، مش «تعبير معناه».
      ar: buah tangan تعبير = ungkapan. أما tingkatan فالمستوى، وdialog الحوار.
      en: buah tangan is an ungkapan (expression). tingkatan (level) and dialog aren't.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حاجتين شكلهم واحد بالظبط ومافيش أي فرق. هما إيه؟
      ar: شيئان متماثلان تمامًا بلا أي فرق. ما صفتهما؟
      en: Two things exactly alike with no difference. What are they?
    options: [identik, harfiah, deskripsi]
    answer: 0
    explain:
      ar_eg: identik = متطابق.
      ar: identik = متطابق.
      en: identik = identical.
    words: [identik, harfiah, deskripsi]
  - id: e06
    type: fill_blank
    sentence: Tulislah ___ tentang liburanmu, minimal dua ratus kata.
    meaning:
      ar_eg: اكتب ___ عن إجازتك، ميتين كلمة على الأقل.
      ar: اكتب ___ عن عطلتك، مئتي كلمة على الأقل.
      en: Write a ___ about your holiday, at least two hundred words.
    options: [karangan, identik, karakteristik]
    answers: [karangan]
    words: [karangan, identik, karakteristik]
    explain:
      ar_eg: «اكتب موضوع إنشا» = karangan. identik = متطابق وkarakteristik = خصائص، مايتكتبوش ٢٠٠ كلمة.
      ar: «اكتب إنشاءً» = karangan. أما identik فـ«مطابق»، وkarakteristik الخصائص.
      en: "\"Write a composition\" is karangan. identik and karakteristik aren't things you write."
  - id: e07
    type: multiple_choice
    question: Salah satu ___ bahasa Melayu Pontianak adalah bunyi "e" di akhir kata.
    options: [dialog, ungkapan, karakteristik]
    answer: 2
    explain:
      ar_eg: karakteristik = خاصية، سمة.
      ar: karakteristik = خاصية، سمة.
      en: karakteristik = characteristic, feature.
    words: [dialog, ungkapan, karakteristik]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الجاوي فيه تلات مستويات كلام.
      ar: للجاوية ثلاثة مستويات كلام.
      en: Javanese has three speech levels.
    answer: Bahasa Jawa punya tiga tingkatan bahasa.
    distractors: [deskripsi, karangan]
    words: [tingkatan]
    explain:
      ar_eg: «مستويات كلام» = tingkatan bahasa. deskripsi = وصف وkarangan = إنشا، مش في الجملة.
      ar: «مستويات الكلام» = tingkatan bahasa. أما deskripsi فالوصف، وkarangan الإنشاء.
      en: "\"Speech levels\" is tingkatan bahasa. deskripsi and karangan aren't in it."
  - id: e09
    type: translate
    direction: from_target
    source_text: Karangannya berisi deskripsi pasar dan dialog dengan penjual.
    answers_meaning:
      ar_eg: [الإنشا بتاعه فيه وصف للسوق وحوار مع بياع, موضوع التعبير فيه وصف السوق وحوار مع البياع]
      ar: [يتضمّن إنشاؤه وصفًا للسوق وحوارًا مع بائع, في إنشائها وصف للسوق وحوار مع البائع]
      en: [His essay has a description of the market and a dialogue with a seller, Her composition describes the market and includes a dialogue with a vendor]
    words: [karangan, deskripsi, dialog]
  - id: e10
    type: speaking
    text: Dua kata ini hampir identik, tapi tingkatannya berbeda.
    meaning:
      ar_eg: الكلمتين دول تقريبًا متطابقين، بس مستواهم مختلف.
      ar: هاتان الكلمتان شبه متطابقتين، لكن مستواهما مختلف.
      en: These two words are almost identical, but their level differs.
    words: [identik, tingkatan]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, aku nerjemahin "panjang tangan" jadi "إيده طويلة". Salah, ya?
      ar_eg: يا ماس، أنا ترجمت "panjang tangan" إيده طويلة. غلط؟
      ar: يا أخي، ترجمت "panjang tangan" بطويل اليد. هل أخطأت؟
      en: I translated "panjang tangan" as "long-handed". Wrong?
    - speaker: Mas Rizal
      text: Itu terjemahan harfiah. Ungkapan itu artinya pencuri, lho.
      ar_eg: دي ترجمة حرفية. التعبير ده معناه حرامي.
      ar: تلك ترجمة حرفية. معنى التعبير لص.
      en: That's a literal translation. The idiom means thief.
    - speaker: Mohamed
      text: Lucu! Di bahasa Arab Mesir juga ada ungkapan yang mirip.
      ar_eg: حلوة! في المصري برضه فيه تعبير شبهه.
      ar: طريف! في العامية المصرية تعبير مشابه أيضًا.
      en: Funny! Egyptian Arabic has a similar expression too.
    - speaker: Mas Rizal
      text: Mirip, tapi nggak identik. Tiap bahasa punya karakteristik sendiri.
      ar_eg: شبهه، بس مش متطابق. كل لغة ليها خصائصها.
      ar: مشابه، لكنه ليس متطابقًا. لكل لغة خصائصها.
      en: Similar, but not identical. Every language has its own features.
    - speaker: Mohamed
      text: "Aku mau nulis karangan soal ini: deskripsi ungkapan sama dialog contohnya."
      ar_eg: 'هكتب إنشا عن الموضوع ده: وصف للتعبيرات وحوار كمثال.'
      ar: 'سأكتب إنشاءً عن هذا: وصف التعابير وحوار مثالي.'
      en: 'I''ll write an essay on it: describing idioms with an example dialogue.'
