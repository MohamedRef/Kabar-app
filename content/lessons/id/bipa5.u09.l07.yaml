      - text: deskripsi
        ar_eg: وصف
        ar: وصف
        en: description
      - text: dialog
        ar_eg: حوار
        ar: حوار
        en: dialogue
    words: [ungkapan, harfiah, deskripsi, dialog]
  - id: e02
    type: match_pairs
    pairs:
      - text: karangan
        ar_eg: إنشا
        ar: إنشاء
        en: composition
      - text: identik
        ar_eg: متطابق
        ar: متطابق
