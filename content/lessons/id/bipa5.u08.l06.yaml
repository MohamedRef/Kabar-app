schema: kabar.lesson/v1
id: bipa5.u08.l06
language: id
title: Angka-angka anggaran
can_do:
  ar_eg: 'تقرا أرقام ميزانية وإحصاءات: المليار والتريليون، الحد الأقصى والأدنى، وتعلّق عليها بتفاؤل أو بواقعية.'
  ar: 'أن تقرأ أرقام الميزانية والإحصاءات: المليار والتريليون، والحد الأقصى والأدنى، وتعلّق بتفاؤل أو واقعية.'
  en: 'Read budget figures and statistics: billions and trillions, maximum and minimum, and comment optimistically or realistically.'
slides:
  - title: Membaca angka besar
    body:
      ar_eg: |
        milyar = مليار (والرسمي miliar)، triliun = تريليون: Rp 2 triliun.
        berjumlah = عدده، مجموعه: Pesertanya berjumlah 500 orang.
        statistik = إحصاء، إحصائيات، maksimum = حد أقصى، minimum = حد أدنى.
        optimis = متفائل، realistis = واقعي: Saya optimis, tapi tetap realistis.
      ar: |
        milyar = مليار (والمعيارية miliar)، triliun = تريليون: Rp 2 triliun.
        berjumlah = يبلغ عدده، مجموعه: Pesertanya berjumlah 500 orang.
        statistik = إحصاء، إحصاءات، maksimum = حدّ أقصى، minimum = حدّ أدنى.
        optimis = متفائل، realistis = واقعي: Saya optimis, tapi tetap realistis.
      en: |
        milyar = billion (standard spelling miliar), triliun = trillion: Rp 2 triliun.
        berjumlah = to number, total: Pesertanya berjumlah 500 orang.
        statistik = statistics, maksimum = maximum, minimum = minimum.
        optimis = optimistic, realistis = realistic: Saya optimis, tapi tetap realistis.
    examples:
      - text: Anggaran proyek itu berjumlah dua triliun rupiah.
        ar_eg: ميزانية المشروع ده مجموعها اتنين تريليون روبية.
        ar: تبلغ ميزانية ذلك المشروع تريليوني روبية.
        en: That project's budget totals two trillion rupiah.
      - text: Menurut statistik, harga beras naik maksimum lima persen.
        ar_eg: حسب الإحصائيات، سعر الرز زاد بحد أقصى خمسة في المية.
        ar: تفيد الإحصاءات بأن سعر الأرز ارتفع بحدّ أقصى خمسة بالمئة.
        en: According to statistics, rice prices rose by at most five percent.
      - text: Tampaknya pemerintah terlalu optimis. Kita harus realistis.
        ar_eg: باين إن الحكومة متفائلة زيادة. لازم نبقى واقعيين.
        ar: يبدو أن الحكومة متفائلة أكثر من اللازم. علينا أن نكون واقعيين.
        en: The government seems too optimistic. We have to be realistic.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: milyar
        ar_eg: مليار
        ar: مليار
        en: billion
      - text: triliun
        ar_eg: تريليون
        ar: تريليون
        en: trillion
      - text: berjumlah
        ar_eg: مجموعه، عدده
        ar: يبلغ عدده
        en: to total
      - text: statistik
        ar_eg: إحصائيات
        ar: إحصاءات
        en: statistics
    words: [milyar, triliun, berjumlah, statistik]
  - id: e02
    type: match_pairs
    pairs:
      - text: maksimum
        ar_eg: حد أقصى
        ar: حدّ أقصى
        en: maximum
      - text: minimum
        ar_eg: حد أدنى
        ar: حدّ أدنى
        en: minimum
      - text: optimis
        ar_eg: متفائل
        ar: متفائل
        en: optimistic
      - text: realistis
        ar_eg: واقعي
        ar: واقعي
        en: realistic
    words: [maksimum, minimum, optimis, realistis]
  - id: e03
    type: listen
    text: Pesertanya berjumlah lima ratus orang.
    question:
      ar_eg: المشاركين كام واحد؟
      ar: كم عدد المشاركين؟
      en: How many participants are there?
    options: [خمسمية, خمسين, خمستلاف]
    answer: 0
    meaning:
      ar_eg: المشاركين عددهم خمسمية واحد.
      ar: يبلغ عدد المشاركين خمسمئة شخص.
      en: There are five hundred participants.
    words: [berjumlah]
  - id: e04
    type: fill_blank
    sentence: Upah ___ di kota ini naik tahun depan.
    meaning:
      ar_eg: الحد ___ للأجور في المدينة دي هيزيد السنة الجاية.
      ar: سيرتفع الحدّ ___ للأجور في هذه المدينة العام القادم.
      en: The ___ wage in this city goes up next year.
    options: [minimum, triliun, optimis]
    answers: [minimum]
    words: [minimum, triliun, optimis]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ألف مليون بالإندونيسي إيه؟
      ar: ما ألف مليون بالإندونيسية؟
      en: What is a thousand million in Indonesian?
    options: [triliun, statistik, milyar]
    answer: 2
    explain:
      ar_eg: milyar = مليار = ألف مليون.
      ar: milyar = مليار = ألف مليون.
      en: milyar = a billion = a thousand million.
    words: [triliun, statistik, milyar]
  - id: e06
    type: fill_blank
    sentence: Lift ini muat ___ delapan orang.
    meaning:
      ar_eg: الأسانسير ده يشيل ___ تمن أشخاص.
      ar: يتّسع هذا المصعد لـ ___ ثمانية أشخاص.
      en: This lift holds a ___ of eight people.
    options: [maksimum, realistis, berjumlah]
    answers: [maksimum]
    words: [maksimum, realistis, berjumlah]
  - id: e07
    type: multiple_choice
    question: Target itu terlalu tinggi. Mari kita buat rencana yang lebih ___.
    options: [minimum, realistis, milyar]
    answer: 1
    explain:
      ar_eg: realistis = واقعي.
      ar: realistis = واقعي.
      en: realistis = realistic.
    words: [minimum, realistis, milyar]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الإحصائيات بتقول إن البطالة قلت.
      ar: تقول الإحصاءات إن البطالة انخفضت.
      en: The statistics say unemployment fell.
    answer: Statistik menunjukkan pengangguran turun.
    distractors: [optimis, maksimum]
    words: [statistik, maksimum]
  - id: e09
    type: translate
    direction: from_target
    source_text: Saya optimis, tapi tetap realistis.
    answers_meaning:
      ar_eg: [أنا متفائل، بس برضه واقعي, أنا متفائلة، لكن واقعية]
      ar: [أنا متفائل لكني واقعي, أنا متفائلة، ومع ذلك واقعية]
      en: ['I''m optimistic, but still realistic', 'I''m hopeful but realistic']
    words: [optimis, realistis]
  - id: e10
    type: speaking
    text: Anggarannya berjumlah dua triliun, bukan dua milyar.
    meaning:
      ar_eg: الميزانية مجموعها اتنين تريليون، مش اتنين مليار.
      ar: تبلغ الميزانية تريليونين لا مليارين.
      en: The budget totals two trillion, not two billion.
    words: [berjumlah, triliun, milyar]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, berita ini bilang anggaran ibu kota baru tiga ratus milyar.
      ar_eg: يا محمد، الخبر ده بيقول إن ميزانية العاصمة الجديدة تلتمية مليار.
      ar: يا محمد، يقول هذا الخبر إن ميزانية العاصمة الجديدة ثلاثمئة مليار.
      en: Mohamed, this article says the new capital's budget is three hundred billion.
    - speaker: Mohamed
      text: Milyar? Tampaknya salah ketik. Di statistik resmi angkanya triliun.
      ar_eg: مليار؟ باين فيه غلطة كتابة. في الإحصائيات الرسمية الرقم بالتريليون.
      ar: مليار؟ يبدو أنه خطأ مطبعي. الرقم في الإحصاءات الرسمية بالتريليون.
      en: Billion? Looks like a typo. In the official statistics it's trillions.
    - speaker: Rina
      text: Lalu berapa targetnya?
      ar_eg: طب الهدف كام؟
      ar: إذن كم الهدف؟
      en: So what's the target?
    - speaker: Mohamed
      text: Penduduknya ditargetkan berjumlah maksimum dua juta, barangkali lebih lambat.
      ar_eg: عدد السكان المستهدف حد أقصى مليونين، ويمكن ياخد وقت أطول.
      ar: يُستهدف أن يبلغ عدد السكان مليونين كحدّ أقصى، وربما ببطء أكبر.
      en: The population target is two million at most, perhaps more slowly.
    - speaker: Rina
      text: Pemerintah sangat optimis.
      ar_eg: الحكومة متفائلة أوي.
      ar: الحكومة متفائلة جدًا.
      en: The government is very optimistic.
    - speaker: Mohamed
      text: Optimis boleh, tapi harus realistis.
      ar_eg: التفاؤل مافيهوش حاجة، بس لازم نبقى واقعيين.
      ar: لا بأس بالتفاؤل، لكن يجب أن نكون واقعيين.
      en: Optimism is fine, but we must be realistic.
