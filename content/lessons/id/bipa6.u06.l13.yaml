schema: kabar.lesson/v1
id: bipa6.u06.l13
language: id
title: Ulangan Unit 6
can_do:
  ar_eg: تفهم السخرية والهزار وتشرح هما بيتريقوا على إيه.
  ar: أن تفهم الهجاء والدعابة وتشرح ما الذي يسخران منه.
  en: Interpret satire and humour and explain what they poke fun at.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ironi
        ar_eg: تريقة / سخرية خفيفة
        ar: تهكّم
        en: irony
      - text: sindiran
        ar_eg: تلقيح / غمزة بالكلام
        ar: تعريض
        en: a dig, a jibe
      - text: lelucon
        ar_eg: نكتة
        ar: نكتة
        en: joke
      - text: tersinggung
        ar_eg: زعلان / متضايق من كلمة
        ar: منزعج من كلام
        en: offended
      - text: tumpul
        ar_eg: تلم / مش سنين
        ar: كليل
        en: blunt
    words: [ironi, sindiran, lelucon, tersinggung, tumpul]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Rajin sekali, baru datang jam sebelas» نوعها إيه؟
      ar: ما نوع عبارة «Rajin sekali, baru datang jam sebelas»؟
      en: What kind of line is "Rajin sekali, baru datang jam sebelas"?
    options: [akronim, ironi, kampanye]
    answer: 1
    words: [ironi, akronim]
  - id: e03
    type: fill_blank
    sentence: Video itu ___ setelah dibagikan oleh ribuan warganet.
    meaning:
      ar_eg: الفيديو ده انتشر بعد ما آلاف من ناس النت شيّروه.
      ar: انتشر المقطع بعد أن شاركه آلاف من روّاد الإنترنت.
      en: The video went viral after thousands of netizens shared it.
    options: [viral, tumpul, premis]
    answers: [viral]
    words: [viral, warganet]
  - id: e04
    type: listen
    text: Komika itu mendapat tepuk tangan karena premisnya cerdas.
    question:
      ar_eg: الكوميديان خد تسقيف ليه؟
      ar: لماذا نال الكوميديان التصفيق؟
      en: Why did the comedian get applause?
    options:
      - علشان هو مشهور.
      - علشان لبسه حلو.
      - علشان فكرة النكتة ذكية.
    answer: 2
    words: [komika, tepuk tangan, premis]
  - id: e05
    type: build_sentence
    source:
      ar_eg: ماتزعلش، هو بيهزر بس.
      ar: لا تنزعج، إنّه يمزح فقط.
      en: Don't be offended, he's only joking.
    answer: Jangan tersinggung, dia cuma bercanda.
    distractors: [tajam, akronim]
    words: [tersinggung, bercanda]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة فيها لعب بالكلام؟
      ar: أيّها فيه تلاعب لفظي؟
      en: Which one is wordplay?
    options:
      - mager = malas gerak
      - Saya lapar sekali.
      - Hukum itu penting.
    answer: 0
    words: [plesetan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: وعود المسؤول ده حلوة وقت الحملة بس.
      ar: وعود ذلك المسؤول حلوة في الحملة فقط.
      en: That official's promises are sweet only during the campaign.
    answers:
      - Janji pejabat itu manis hanya saat kampanye.
      - Janji pejabat itu hanya manis saat kampanye.
      - Janji pejabat itu manis cuma waktu kampanye.
      - Janji-janji pejabat itu manis hanya pada masa kampanye.
    words: [janji, pejabat, kampanye]
  - id: e08
    type: translate
    direction: from_target
    source_text: Terus terang, sarkasmenya terlalu tajam.
    answers_meaning:
      ar_eg:
        - بصراحة، تريقته كانت جارحة زيادة.
        - بصراحة، سخريته كانت حادة قوي.
      ar:
        - بصراحة، كان تهكّمه حادًّا أكثر من اللازم.
        - صراحةً، تهكّمه لاذع جدًّا.
      en:
        - Frankly, his sarcasm was too sharp.
        - To be honest, the sarcasm was too cutting.
    words: [terus terang, sarkasme, tajam]
  - id: e09
    type: dictation
    text: Kelakuan politikus itu heboh, tetapi tampangnya tetap angkuh.
    meaning:
      ar_eg: عمايل السياسي ده عاملة ضجة، بس شكله لسه متكبر.
      ar: أثار سلوك ذلك السياسي ضجة، لكن هيئته بقيت متعالية.
      en: That politician's antics caused a stir, but he still looks arrogant.
    words: [kelakuan, politikus, heboh, tampang, angkuh]
  - id: e10
    type: speaking
    text: Lucunya karena dia menyindir dengan halus, bukan dengan sarkasme.
    meaning:
      ar_eg: الضحك جاي من إنه لقّح بشياكة، مش بتريقة جارحة.
      ar: مصدر الضحك أنّه عرّض بلطف لا بتهكّم لاذع.
      en: It's funny because he made his dig gently, not with sarcasm.
    words: [sarkasme]
  - id: e11
    type: match_pairs
    pairs:
      - text: bergurau
        ar_eg: يهزر
        ar: يمزح
        en: to joke
      - text: curhat
        ar_eg: يفضفض
        ar: يبوح
        en: to pour one's heart out
      - text: serakah
        ar_eg: طماع
        ar: جشع
        en: greedy
      - text: birokrasi
        ar_eg: روتين
        ar: بيروقراطية
        en: bureaucracy
      - text: koalisi
        ar_eg: ائتلاف
        ar: ائتلاف
        en: coalition
      - text: ironis
        ar_eg: فيه مفارقة
        ar: مفارِق
        en: ironic
    words: [bergurau, curhat, serakah, birokrasi, koalisi, ironis]
  - id: e12
    type: fill_blank
    sentence: Teman saya yang ___ selalu membuat tebakan lucu di kedai kopi.
    meaning:
      ar_eg: صاحبي الـ ___ دايمًا بيعمل فوازير مضحكة على القهوة.
      ar: صديقي ___ يطرح دائمًا أحاجي مضحكة في المقهى.
      en: My ___ friend always comes up with funny riddles at the coffee stall.
    options: [iseng, korup, remeh]
    answers: [iseng]
    words: [iseng, tebakan, korup, remeh]
dialogue:
  title: Kapal pulang dari Samosir
  lines:
    - speaker: Bang Togar
      text: Jadi, apa yang paling kau ingat dari Samosir, Lae?
      ar_eg: إيه أكتر حاجة هتفتكرها من ساموسير يا لاي؟
      ar: ما أكثر ما ستذكره من ساموسير يا لاي؟
      en: So what will you remember most from Samosir, Lae?
    - speaker: Mohamed
      text: Danau sebesar laut, dan orang yang bercanda tanpa takut.
      ar_eg: بحيرة قد البحر، وناس بتهزر من غير خوف.
      ar: بحيرة بحجم البحر، وناس يمزحون بلا خوف.
      en: A lake as big as a sea, and people who joke without fear.
    - speaker: Bang Togar
      text: Ah, kau sudah pintar menyindir. Besok kau ke Jambi, kan?
      ar_eg: آه، إنت بقيت شاطر في التلقيح. بكرة رايح جامبي، صح؟
      ar: آه، صرت بارعًا في التعريض. غدًا تذهب إلى جامبي، أليس كذلك؟
      en: Ah, you've got good at digs. You're off to Jambi tomorrow, right?
    - speaker: Mohamed
      text: Betul. Terus terang, saya akan rindu nada keras Bang Togar.
      ar_eg: مظبوط. بصراحة، هتوحشني نبرتك العالية يا بانج توغار.
      ar: صحيح. بصراحة، ستوحشني نبرتك العالية يا توغار.
      en: Right. Frankly, I'll miss your loud voice, Bang Togar.
souvenir:
  id: bipa6.u06.souvenir
  title: Pulau Samosir
  note:
    ar_eg: بحيرة توبا مالية فوهة بركان ضخم ثار من حوالي 74 ألف سنة، في واحد من أكبر الانفجارات البركانية المعروفة. هي أكبر بحيرة في إندونيسيا وأكبر بحيرة بركانية في العالم، ومن 2020 بقت ضمن شبكة اليونسكو للجيوبارك. في نصها جزيرة ساموسير، قد سنغافورة تقريبًا، وهي قلب بلاد الباتاك توبا. في توموك فيه توابيت حجر قديمة لملوك سيدابوتار، وفي أمباريتا كراسي حجر كان الكبار بيقعدوا عليها يتشاوروا.
    ar: تملأ بحيرة توبا فوهة بركان هائل ثار قبل نحو 74 ألف عام، في واحد من أعظم الانفجارات البركانية المعروفة. وهي أكبر بحيرة في إندونيسيا وأكبر بحيرة بركانية في العالم، وصارت منذ 2020 من الحدائق الجيولوجية العالمية لليونسكو. وفي وسطها جزيرة ساموسير، وهي بحجم سنغافورة تقريبًا، وقلب بلاد الباتاك توبا. ففي توموك توابيت حجرية قديمة لملوك سيدابوتار، وفي أمباريتا مقاعد حجرية كان الكبار يتشاورون عليها.
    en: Lake Toba fills the caldera of a huge volcano that erupted about 74,000 years ago, one of the largest eruptions known. It is Indonesia's largest lake and the world's largest volcanic lake, and since 2020 it has been a UNESCO Global Geopark. In its middle lies Samosir, an island about the size of Singapore and the heartland of the Toba Batak. Tomok has old stone sarcophagi of the Sidabutar kings, and Ambarita has stone chairs where elders once sat in council.
