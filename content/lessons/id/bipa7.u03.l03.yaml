schema: kabar.lesson/v1
id: bipa7.u03.l03
language: id
title: Mitos asal-usul
can_do:
  ar_eg: تقرا أسطورة عن أصل مكان وتفهم معناها الظاهر والخفي.
  ar: أن تقرأ أسطورة عن أصل مكان وتفهم معناها الظاهر والباطن.
  en: Read an origin myth and grasp both its plain and hidden meaning.
slides:
  - title: Tujuh butir telur
    body:
      ar_eg: |
        أسطورة أصل اسم راجا أمبات (رواية من الروايات، ومختصرة للدرس):
        Alkisah, sepasang suami istri menemukan tujuh butir telur di tepi Sungai Waikeo. Empat telur menetas menjadi empat putra. Mereka kelak menjadi raja di Waigeo, Batanta, Salawati, dan Misool. Telur kelima menetas menjadi seorang putri, dan telur keenam menjadi roh halus. Telur ketujuh tidak menetas. Telur itu menjadi batu yang sampai sekarang dihormati di Kali Raja.
        - mitos = أسطورة، asal-usul = أصل / نشأة، telur = بيضة
        - menetas = يفقس، keturunan = نسل / ذرّية
        المعنى الخفي: الجزر الأربع إخوات، من أصل واحد.
        - في الكلام: emang = memang، tapi = tetapi، buat = untuk، ngajarin = mengajarkan.
      ar: |
        أسطورة أصل اسم راجا أمبات (إحدى رواياتها، مختصرة للدرس):
        Alkisah, sepasang suami istri menemukan tujuh butir telur di tepi Sungai Waikeo. Empat telur menetas menjadi empat putra. Mereka kelak menjadi raja di Waigeo, Batanta, Salawati, dan Misool. Telur kelima menetas menjadi seorang putri, dan telur keenam menjadi roh halus. Telur ketujuh tidak menetas. Telur itu menjadi batu yang sampai sekarang dihormati di Kali Raja.
        - mitos = أسطورة، asal-usul = الأصل والنشأة، telur = بيضة
        - menetas = يفقس، keturunan = الذرّية
        والمعنى الباطن: الجزر الأربع إخوة من أصل واحد.
        - في الكلام اليومي: emang = memang، tapi = tetapi، buat = untuk، ngajarin = mengajarkan.
      en: |
        The origin myth of Raja Ampat's name (one version of several, shortened for the lesson):
        Alkisah, sepasang suami istri menemukan tujuh butir telur di tepi Sungai Waikeo. Empat telur menetas menjadi empat putra. Mereka kelak menjadi raja di Waigeo, Batanta, Salawati, dan Misool. Telur kelima menetas menjadi seorang putri, dan telur keenam menjadi roh halus. Telur ketujuh tidak menetas. Telur itu menjadi batu yang sampai sekarang dihormati di Kali Raja.
        - mitos = myth, asal-usul = origin, telur = egg
        - menetas = to hatch, keturunan = descendants
        The hidden meaning: the four islands are siblings, from one origin.
        - In speech: emang = memang, tapi = tetapi, buat = untuk, ngajarin = mengajarkan.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mitos
        ar_eg: أسطورة
        ar: أسطورة
        en: myth
      - text: asal-usul
        ar_eg: أصل / نشأة
        ar: الأصل والنشأة
        en: origin
      - text: telur
        ar_eg: بيضة
        ar: بيضة
        en: egg
      - text: menetas
        ar_eg: يفقس
        ar: يفقس
        en: to hatch
      - text: keturunan
        ar_eg: نسل / ذرّية
        ar: ذرّية
        en: descendants, offspring
    words: [mitos, asal-usul, telur, menetas, keturunan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: كام بيضة فقست وبقت ملوك؟
      ar: كم بيضة فقست فصارت ملوكًا؟
      en: How many eggs hatched into kings?
    options: [tujuh, empat, satu]
    answer: 1
    words: [telur, menetas]
    explain:
      ar_eg: من السبع بيضات، أربعة فقسوا ملوك (Raja Ampat = الملوك الأربعة).
      ar: من البيضات السبع فقست أربع عن ملوك (Raja Ampat = الملوك الأربعة).
      en: "Four eggs hatched into kings: Raja Ampat means \"four kings\"."
  - id: e03
    type: fill_blank
    sentence: Mitos ini menceritakan ___ nama Raja Ampat.
    meaning:
      ar_eg: الأسطورة دي بتحكي أصل اسم راجا أمبات.
      ar: تروي هذه الأسطورة أصل اسم راجا أمبات.
      en: This myth tells the origin of the name Raja Ampat.
    options: [asal-usul, keturunan, telur]
    answers: [asal-usul]
    words: [asal-usul, mitos]
    explain:
      ar_eg: asal-usul = أصل/منشأ الاسم. keturunan = نسل، وtelur = بيض.
      ar: asal-usul = أصل الاسم ومنشؤه. أما keturunan فنسل وtelur بيض.
      en: asal-usul is origin. keturunan means descendants, telur eggs.
  - id: e04
    type: listen
    text: Satu telur tidak menetas dan menjadi batu yang dihormati.
    question:
      ar_eg: إيه اللي حصل للبيضة اللي ما فقستش؟
      ar: ماذا حلّ بالبيضة التي لم تفقس؟
      en: What happened to the egg that didn't hatch?
    options:
      - بقت حجر الناس بتحترمه.
      - اتكسرت.
      - بقت ملك خامس.
    answer: 0
    words: [telur, menetas]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أهل الجزيرة بيقولوا إنهم من نسل الملك.
      ar: يقول أهل الجزيرة إنّهم من ذرّية الملك.
      en: The islanders say they are descendants of the king.
    answer: Warga pulau mengaku sebagai keturunan raja itu.
    distractors: [mitos, telur]
    words: [keturunan]
    explain:
      ar_eg: mengaku sebagai keturunan = بيقولوا إنهم من نسل الملك. mitos وtelur مش في الجملة.
      ar: mengaku sebagai keturunan = يقولون إنهم من نسل الملك.
      en: mengaku sebagai keturunan = say they are descendants.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيه المعنى الخفي في إن الملوك جم من بيض واحد؟
      ar: ما المعنى الباطن لخروج الملوك من بيض واحد؟
      en: What's the hidden meaning of the kings coming from one clutch of eggs?
    options:
      - إن البيض أكلة مهمة.
      - إن الملوك كانوا بيكرهوا بعض.
      - إن الجزر الأربع إخوات من أصل واحد.
    answer: 2
    words: [mitos, asal-usul]
    explain:
      ar_eg: إن الملوك من نفس البيض معناه إن الجزر الأربع إخوات من أصل واحد، مش أكل ولا عداوة.
      ar: خروج الملوك من بيض واحد يعني أن الجزر الأربع إخوة من أصل واحد.
      en: Kings from one clutch means the four islands are siblings of one origin.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كل قرية عندها أسطورة عن أصلها.
      ar: لكلّ قرية أسطورة عن أصلها.
      en: Every village has a myth about its origin.
    answers:
      - Setiap desa punya mitos tentang asal-usulnya.
      - Setiap desa memiliki mitos tentang asal-usulnya.
      - Tiap desa punya mitos tentang asal-usulnya.
      - Setiap kampung punya mitos tentang asal-usulnya.
    words: [mitos, asal-usul]
  - id: e08
    type: speaking
    text: Empat telur menetas menjadi empat raja.
    meaning:
      ar_eg: أربع بيضات فقسوا وبقوا أربع ملوك.
      ar: فقست أربع بيضات فصارت أربعة ملوك.
      en: Four eggs hatched into four kings.
    words: [telur, menetas]
  - id: e09
    type: dictation
    text: Keturunan raja itu tinggal di empat pulau besar.
    meaning:
      ar_eg: نسل الملك ده عايش في أربع جزر كبيرة.
      ar: تسكن ذرّية ذلك الملك أربع جزر كبيرة.
      en: That king's descendants live on four large islands.
    words: [keturunan]
  - id: e10
    type: translate
    direction: from_target
    source_text: Mitos tidak harus benar secara sejarah, tetapi maknanya tetap penting.
    answers_meaning:
      ar_eg:
        - الأسطورة مش لازم تكون حقيقية تاريخيًا، بس معناها برضه مهم.
        - الأسطورة ممكن ماتكونش حصلت فعلًا، لكن معناها ليه قيمة.
      ar:
        - لا يلزم أن تكون الأسطورة صحيحة تاريخيًّا، لكنّ معناها يظلّ مهمًّا.
        - ليست الأسطورة تاريخًا بالضرورة، غير أنّ لمعناها أهمّيته.
      en:
        - A myth needn't be historically true, but its meaning still matters.
        - A myth may not be history, yet its meaning remains important.
    words: [mitos]
dialogue:
  title: Malam dongeng di Arborek
  lines:
    - speaker: Mama Ruth
      text: Itulah asal-usul nama Raja Ampat. Empat raja dari empat telur.
      ar_eg: ده أصل اسم راجا أمبات. أربع ملوك من أربع بيضات.
      ar: هذا أصل اسم راجا أمبات، أربعة ملوك من أربع بيضات.
      en: That's the origin of the name Raja Ampat. Four kings from four eggs.
    - speaker: Mohamed
      text: Emang orang di sini percaya mereka keturunan raja-raja itu?
      ar_eg: هو الناس هنا مصدّقين إنهم من نسل الملوك دول؟
      ar: أيؤمن الناس هنا بأنّهم من ذرّية أولئك الملوك؟
      en: Do people here believe they're descendants of those kings?
    - speaker: Mama Ruth
      text: Sebagian percaya. Tapi buat kami, mitos ini ngajarin kalau pulau-pulau kami bersaudara.
      ar_eg: ناس بتصدّق. بس بالنسبة لنا، الأسطورة دي بتعلّمنا إن جزرنا إخوات.
      ar: بعضهم يؤمن بذلك، لكنّ الأسطورة تعلّمنا أنّ جزرنا إخوة.
      en: Some do. But for us, this myth teaches that our islands are siblings.
    - speaker: Mohamed
      text: Makna yang indah. Di Mesir juga ada mitos tentang asal-usul Sungai Nil.
      ar_eg: معنى حلو. في مصر كمان فيه أساطير عن أصل النيل.
      ar: معنى جميل. وفي مصر أيضًا أساطير عن أصل النيل.
      en: A lovely meaning. In Egypt too there are myths about the origin of the Nile.
