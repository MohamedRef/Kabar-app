  - id: e03
    type: listen
    text: Ada diskon dua puluh persen untuk nanas.
    question:
      ar_eg: الخصم كام؟
      ar: كم الخصم؟
      en: How big is the discount?
    options: [٢٠٪, ١٢٪, ٢٪]
    answer: 0
    meaning:
      ar_eg: فيه خصم عشرين في المية على الأناناس.
      ar: هناك خصم عشرين بالمئة على الأناناس.
      en: There's twenty percent off pineapples.
    words: [persen, nanas]
  - id: e04
    type: fill_blank
    sentence: Terong ini warnanya ___.
    meaning:
      ar_eg: الباذنجانة دي لونها ___.
      ar: لون هذه الباذنجانة ___.
      en: This aubergine is ___.
    options: [ungu, merah muda, kuning]
    answers: [ungu]
    words: [ungu, merah muda, terong]
    explain:
      ar_eg: الباذنجان لونه ungu (بنفسجي). merah muda بمبي، وkuning أصفر.
      ar: الباذنجان ungu (بنفسجي). أما merah muda فوردي وkuning أصفر.
      en: Aubergines are ungu (purple). merah muda is pink, kuning yellow.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أحمر + أبيض = ؟
      ar: أحمر + أبيض = ؟
      en: Red + white = ?
    options: [merah muda, ungu, cokelat]
    answer: 0
    explain:
      ar_eg: merah muda = بمبي.
      ar: merah muda = وردي.
      en: merah muda = pink.
    words: [merah muda, ungu]
  - id: e06
    type: fill_blank
    sentence: Seratus ___ sama dengan satu meter.
    meaning:
      ar_eg: مية ___ = متر.
      ar: مئة ___ تساوي مترًا.
      en: A hundred ___ make a metre.
    options: [sentimeter, persen, lusin]
    answers: [sentimeter]
    words: [sentimeter, persen]
    explain:
      ar_eg: ١٠٠ sentimeter = متر. persen في المية، وlusin = دستة.
      ar: مئة sentimeter = متر. أما persen فنسبة مئوية وlusin دزينة.
      en: 100 sentimeter make a metre. persen is percent, lusin a dozen.
  - id: e07
    type: build_sentence
    source:
      ar_eg: الموز ده حلو أوي!
      ar: هذا الموز لذيذ جدًا!
      en: This banana is so good!
    answer: Pisang ini enak sekali!
    distractors: [nanas, ungu]
    words: [pisang]
    explain:
      ar_eg: pisang = موز، وenak sekali = حلو أوي. nanas أناناس، وungu لون.
      ar: pisang = موز، وenak sekali = لذيذ جدًا. أما nanas فأناناس وungu لون.
      en: pisang = banana, enak sekali = really good. nanas is pineapple, ungu purple.
  - id: e08
