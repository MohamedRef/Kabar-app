schema: kabar.lesson/v1
id: bipa2.u04.l10
language: id
title: Belanja untuk Nenek
can_do:
  ar_eg: 'تتسوق لحد في السوق: موز وأناناس وباذنجان رومي، بالسنتي والخصم في المية، والبنفسجي والبمبي.'
  ar: 'أن تتسوّق لأحد في السوق: موز وأناناس وباذنجان، بالسنتيمتر والخصم بالمئة، والبنفسجي والوردي.'
  en: 'Shop for someone at the market: bananas, pineapple, aubergine, centimetres and percent off, purple and pink.'
slides:
  - title: Ungu dan merah muda
    body:
      ar_eg: |
        pisang = موز (pisang goreng = موز مقلي، أكلة مشهورة)، nanas = أناناس، terong = باذنجان (terong ungu = الباذنجان الرومي).
        ungu = بنفسجي. merah muda = بمبي (حرفيًا «أحمر صغير»: muda مع الألوان = فاتح).
        persen = في المية: diskon 20 persen. sentimeter = سنتي.
      ar: |
        pisang = موز (pisang goreng = موز مقلي، طعام شهير)، nanas = أناناس، terong = باذنجان (terong ungu = الباذنجان البنفسجي).
        ungu = بنفسجي. merah muda = وردي (حرفيًا «أحمر فتيّ»: muda مع الألوان = فاتح).
        persen = بالمئة: diskon 20 persen. sentimeter = سنتيمتر.
      en: |
        pisang = banana (pisang goreng, fried banana, is a classic), nanas = pineapple, terong = aubergine (terong ungu = purple aubergine).
        ungu = purple. merah muda = pink (literally "young red": muda with colours means light).
        persen = percent: diskon 20 persen. sentimeter = centimetre.
    examples:
      - text: Terong ungu ini tiga puluh sentimeter!
        ar_eg: الباذنجانة البنفسجي دي تلاتين سنتي!
        ar: هذه الباذنجانة البنفسجية ثلاثون سنتيمترًا!
        en: This purple aubergine is thirty centimetres long!
      - text: Hari ini ada diskon dua puluh persen.
        ar_eg: النهارده فيه خصم عشرين في المية.
        ar: اليوم خصم عشرين بالمئة.
        en: There's twenty percent off today.
      - text: Nenek suka pisang dan nanas.
        ar_eg: تيتا بتحب الموز والأناناس.
        ar: تحبّ جدّتي الموز والأناناس.
        en: Grandma likes bananas and pineapple.
