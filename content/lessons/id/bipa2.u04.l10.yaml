schema: kabar.lesson/v1
id: bipa2.u04.l10
language: id
title: Hijau, kuning, ungu
can_do:
  ar_eg: 'تقول ألوان أكتر وتختار لون في المحل: فاتح ولا غامق.'
  ar: 'أن تسمّي ألوانًا أكثر وتختار لونًا في المتجر: فاتح أو داكن.'
  en: Name more colours and pick one in a shop, light or dark.
slides:
  - title: Warna
    body:
      ar_eg: |
        hijau = أخضر، kuning = أصفر، cokelat = بني (وكمان شوكولاتة!)، ungu = بنفسجي، oranye = برتقاني.
        abu-abu = رمادي (abu = رماد). merah muda = بمبي (حرفيًا «أحمر صغير»).
        muda مع الألوان = فاتح: biru muda. وgelap = غامق أو ضلمة: hijau gelap.
      ar: |
        hijau = أخضر، kuning = أصفر، cokelat = بنّي (وهي الشوكولاتة أيضًا!)، ungu = بنفسجي، oranye = برتقالي.
        abu-abu = رمادي (abu = رماد). merah muda = وردي (حرفيًا «أحمر فتيّ»).
        muda مع الألوان = فاتح: biru muda. وgelap = داكن أو مظلم: hijau gelap.
      en: |
        hijau = green, kuning = yellow, cokelat = brown (and chocolate!), ungu = purple, oranye = orange.
        abu-abu = grey (abu = ash). merah muda = pink (literally "young red").
        muda with colours means light: biru muda. gelap = dark: hijau gelap.
    examples:
      - text: Mangga ini hijau, tapi manis.
        ar_eg: المانجة دي خضرا، بس مسكّرة.
        ar: هذه المانجو خضراء لكنها حلوة.
        en: This mango is green, but sweet.
      - text: Baju batik saya cokelat dan ungu.
        ar_eg: قميص الباتيك بتاعي بني وبنفسجي.
        ar: قميص الباتيك خاصّتي بنّي وبنفسجي.
        en: My batik shirt is brown and purple.
      - text: Langit malam gelap.
        ar_eg: سما الليل ضلمة.
        ar: سماء الليل مظلمة.
        en: The night sky is dark.
