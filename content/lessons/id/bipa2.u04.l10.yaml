    direction: from_target
    source_text: Kamar ini gelap sekali.
    answers_meaning:
      ar_eg: [الأوضة دي ضلمة أوي]
      ar: [هذه الغرفة مظلمة جدًا]
      en: [This room is very dark, This room is really dark]
