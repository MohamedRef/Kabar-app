dialogue:
  lines:
    - speaker: Penjual
      text: Mau kain warna apa, Mbak?
      ar_eg: عايزة قماش لونه إيه يا آنسة؟
      ar: أيّ لون من القماش تريدين يا آنسة؟
      en: What colour fabric would you like?
    - speaker: Rina
      text: Ada yang ungu?
      ar_eg: فيه بنفسجي؟
      ar: هل عندك بنفسجي؟
      en: Do you have purple?
    - speaker: Penjual
      text: Ungu tidak ada. Ada merah muda, hijau, dan oranye.
      ar_eg: البنفسجي مش موجود. فيه بمبي وأخضر وبرتقاني.
      ar: لا يوجد بنفسجي. لدينا وردي وأخضر وبرتقالي.
      en: No purple. There's pink, green and orange.
    - speaker: Rina
      text: Yang hijau gelap ada?
      ar_eg: فيه أخضر غامق؟
      ar: هل يوجد أخضر داكن؟
      en: Is there dark green?
    - speaker: Penjual
      text: Ada! Ini, hijau gelap. Atau cokelat?
      ar_eg: أيوه! اتفضلي، أخضر غامق. ولا بني؟
      ar: نعم! تفضّلي، أخضر داكن. أم بنّي؟
      en: Yes! Here, dark green. Or brown?
    - speaker: Rina
      text: Yang hijau gelap. Berapa semeter?
      ar_eg: الأخضر الغامق. بكام المتر؟
      ar: الأخضر الداكن. بكم المتر؟
      en: The dark green. How much per metre?
