    text: Saya suka cokelat, warna dan makanannya!
    meaning:
      ar_eg: بحب البني والشوكولاتة، اللون والأكل!
      ar: أحبّ cokelat، اللون والحلوى!
      en: I love cokelat, the colour and the food!
    words: [cokelat]
  - id: e10
    type: multiple_choice
    question: Pisang ini warnanya ___, sudah manis.
    options: [kuning, merah muda, oranye]
    answer: 0
    explain:
      ar_eg: 'الموز الأصفر مستوي: kuning.'
      ar: 'الموز الأصفر ناضج: kuning.'
      en: 'A yellow banana is ripe: kuning.'
