  - id: e09
    type: speaking
    text: Saya mau dua ikat pisang dan sebuah nanas.
    meaning:
      ar_eg: عايز سباطتين موز وأناناساية.
      ar: أريد عنقودين من الموز وحبّة أناناس.
      en: I'd like two bunches of bananas and a pineapple.
    words: [pisang, nanas]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: فاكهة صفرا وطويلة، والقرود بتحبها.
      ar: فاكهة صفراء طويلة تحبّها القرود.
      en: A long yellow fruit that monkeys love.
    options: [pisang, nanas, terong]
    answer: 0
    explain:
      ar_eg: pisang = موز.
      ar: pisang = موز.
      en: pisang = banana.
    words: [pisang, nanas, terong]
dialogue:
  lines:
    - speaker: Penjual
      text: Mari, Mbak! Hari ini ada diskon dua puluh persen!
      ar_eg: اتفضلي يا آنسة! النهارده فيه خصم عشرين في المية!
      ar: تفضّلي يا آنسة! اليوم خصم عشرين بالمئة!
      en: Come on in! Twenty percent off today!
    - speaker: Rina
      text: Saya mau belanja untuk nenek. Ada pisang?
      ar_eg: عايزة أتسوق لتيتا. فيه موز؟
      ar: أريد التسوّق لجدّتي. هل عندك موز؟
      en: I'm shopping for my grandma. Do you have bananas?
    - speaker: Penjual
      text: Ada. Ini pisang dan nanas, manis-manis!
      ar_eg: فيه. اتفضلي موز وأناناس، مسكّرين!
      ar: نعم، تفضّلي موزًا وأناناسًا، حلوة كلها!
      en: Yes. Here are bananas and pineapples, all sweet!
    - speaker: Rina
      text: Terong ungu ini panjang sekali!
      ar_eg: الباذنجان البنفسجي ده طويل أوي!
      ar: هذا الباذنجان البنفسجي طويل جدًا!
      en: This purple aubergine is so long!
    - speaker: Penjual
      text: Ya, tiga puluh sentimeter!
      ar_eg: أيوه، تلاتين سنتي!
      ar: نعم، ثلاثون سنتيمترًا!
      en: Yes, thirty centimetres!
    - speaker: Rina
      text: Saya beli semua. Dan kantong merah muda itu, untuk Nenek.
      ar_eg: هاخد كله. والكيس البمبي ده، عشان تيتا.
      ar: سآخذها كلها، وذلك الكيس الوردي لجدّتي.
      en: I'll take it all. And that pink bag, for Grandma.
