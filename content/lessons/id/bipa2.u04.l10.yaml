    answer: 0
    meaning:
      ar_eg: عايز التي شيرت الأخضر، مش الأصفر.
      ar: أريد القميص الأخضر لا الأصفر.
      en: I want the green T-shirt, not the yellow one.
    words: [hijau, kuning]
  - id: e04
    type: fill_blank
