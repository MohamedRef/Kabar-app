schema: kabar.lesson/v1
id: bipa6.u02.l08
language: id
title: Malam puisi di kampung
can_do:
  ar_eg: تحضر ليلة شعر في قرية وتفهم التشبيه والكلام عن الدنيا الفانية والفرح.
  ar: أن تحضر أمسية شعر في قرية وتفهم التشبيه والحديث عن الدنيا الفانية والفرح.
  en: Join a village poetry night and follow similes and talk of a passing world and joy.
slides:
  - title: Malam puisi
    body:
      ar_eg: |
        ليلة شعر في قرية في رياو، والنور من فوانيس:
        lentera = فانوس. bahtera = سفينة (كلمة أدبية؛ bahtera rumah tangga = سفينة الجواز).
        ibarat = زي، كأن (تشبيه): Hidup ibarat bahtera.
        fana = فاني، مش دايم. keabadian = الخلود. sukacita = فرحة كبيرة.
        sepatah kata = كلمة صغيرة، كلمتين (Sepatah kata dari tuan rumah). jangkrik = صرصار الغيط.
      ar: |
        أمسية شعر في قرية في رياو، والضوء من الفوانيس:
        lentera = فانوس. bahtera = سفينة (لفظ أدبي؛ bahtera rumah tangga = سفينة الزواج).
        ibarat = مثل، كأنّ (تشبيه): Hidup ibarat bahtera.
        fana = فانٍ، زائل. keabadian = الخلود. sukacita = فرح عظيم.
        sepatah kata = كلمة موجزة (Sepatah kata dari tuan rumah). jangkrik = صرصار الحقل.
      en: |
        A poetry night in a Riau village, lit by lanterns:
        lentera = lantern. bahtera = ship, ark (literary; bahtera rumah tangga = the ship of marriage).
        ibarat = like, as if (simile): Hidup ibarat bahtera.
        fana = transient, mortal. keabadian = eternity. sukacita = great joy.
        sepatah kata = a few words (Sepatah kata dari tuan rumah). jangkrik = cricket.
    examples:
      - text: Hidup ibarat bahtera di tengah laut.
        ar_eg: الحياة زي سفينة في نص البحر.
        ar: الحياة كسفينة في عرض البحر.
        en: Life is like a ship in the open sea.
      - text: Dunia ini fana; hanya Tuhan yang abadi.
        ar_eg: الدنيا دي فانية؛ ربنا بس هو الباقي.
        ar: هذه الدنيا فانية؛ وحده الله الباقي.
        en: This world is passing; only God is eternal.
      - text: Mohon sepatah kata dari tuan rumah.
        ar_eg: نطلب كلمتين من صاحب البيت.
        ar: نرجو كلمة موجزة من المضيف.
        en: A few words from our host, please.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: lentera
        ar_eg: فانوس
        ar: فانوس
        en: lantern
      - text: bahtera
        ar_eg: سفينة (أدبي)
        ar: سفينة
        en: ship, ark
      - text: ibarat
        ar_eg: زي، كأن
        ar: مثل، كأنّ
        en: like, as if
      - text: fana
        ar_eg: فاني
        ar: فانٍ، زائل
        en: transient
    words: [lentera, bahtera, ibarat, fana]
  - id: e02
    type: match_pairs
    pairs:
      - text: keabadian
        ar_eg: خلود
        ar: خلود
        en: eternity
      - text: sukacita
        ar_eg: فرحة كبيرة
        ar: فرح عظيم
        en: great joy
      - text: sepatah
        ar_eg: كلمة صغيرة (sepatah kata)
        ar: كلمة موجزة (sepatah kata)
        en: a word or two (sepatah kata)
      - text: jangkrik
        ar_eg: صرصار الغيط
        ar: صرصار الحقل
        en: cricket
    words: [keabadian, sukacita, sepatah, jangkrik]
  - id: e03
    type: listen
    text: Malam itu hanya terdengar suara jangkrik.
    question:
      ar_eg: كان فيه صوت إيه بالليل؟
      ar: ما الصوت الذي سُمع ليلًا؟
      en: What could be heard at night?
    options: [صرصار الغيط, فراشة, سفينة]
    answer: 0
    meaning:
      ar_eg: الليلة دي ما كانش فيه غير صوت صرصار الغيط.
      ar: لم يُسمع تلك الليلة إلا صوت صرصار الحقل.
      en: That night only crickets could be heard.
    words: [jangkrik]
  - id: e04
    type: fill_blank
    sentence: Rumah tangga ___ sebuah bahtera; suami dan istri harus mendayung bersama.
    meaning:
      ar_eg: البيت ___ سفينة؛ الجوز والمراتة لازم يجدفوا سوا.
      ar: الحياة الزوجية ___ سفينة؛ على الزوجين أن يجدّفا معًا.
      en: Married life is ___ a ship; husband and wife must row together.
    options: [ibarat, fana, sepatah]
    answers: [ibarat]
    words: [ibarat, fana, sepatah, bahtera]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الكلمة اللي معناها حاجة مش هتدوم؟
      ar: ما الكلمة التي تعني ما لا يدوم؟
      en: Which word means something that won't last?
    options: [fana, sukacita, keabadian]
    answer: 0
    explain:
      ar_eg: fana = فاني، وعكسها abadi (من الأبد).
      ar: fana = فانٍ، وضدّها abadi (من الأبد).
      en: fana = transient; its opposite is abadi (from Arabic أبد).
    words: [fana, sukacita, keabadian]
  - id: e06
    type: fill_blank
    sentence: Dengan penuh ___, keluarga itu menyambut kelahiran cucu pertama.
    meaning:
      ar_eg: بفرحة كبيرة، العيلة استقبلت أول حفيد.
      ar: بفرح عظيم استقبلت الأسرة ولادة أول حفيد.
      en: With great ___, the family welcomed their first grandchild.
    options: [sukacita, lentera, jangkrik]
    answers: [sukacita]
    words: [sukacita, lentera, jangkrik]
  - id: e07
    type: multiple_choice
    question: Puisi itu bercerita tentang ___, waktu yang tidak pernah berakhir.
    options: [bahtera, jangkrik, keabadian]
    answer: 2
    explain:
      ar_eg: 'حاجة عمرها ما تخلص = خلود: keabadian (من abadi = أبدي).'
      ar: 'ما لا ينتهي أبدًا = خلود: keabadian (من abadi).'
      en: 'Something that never ends = eternity: keabadian (from abadi).'
    words: [keabadian, bahtera, jangkrik]
  - id: e08
    type: build_sentence
    source:
      ar_eg: نطلب كلمتين من صاحب البيت.
      ar: نرجو كلمة موجزة من المضيف.
      en: A few words from our host, please.
    answer: Mohon sepatah kata dari tuan rumah.
    distractors: [lentera, ibarat]
    words: [sepatah]
  - id: e09
    type: translate
    direction: from_target
    source_text: Cahaya lentera menerangi bahtera kecil itu.
    answers_meaning:
      ar_eg: [نور الفانوس نوّر السفينة الصغيرة دي, الفانوس نوّر المركب الصغير]
      ar: [أضاء نور الفانوس تلك السفينة الصغيرة]
      en: ['The lantern''s light lit up that little ship', The lantern lit the small boat]
    words: [lentera, bahtera]
  - id: e10
    type: speaking
    text: Dunia ini fana; hidup ibarat bahtera kecil.
    meaning:
      ar_eg: الدنيا دي فانية؛ والحياة زي سفينة صغيرة.
      ar: هذه الدنيا فانية؛ والحياة كسفينة صغيرة.
      en: This world is passing; life is like a little ship.
    words: [fana, ibarat, bahtera]
dialogue:
  lines:
    - speaker: Encik Zul
      text: Selamat datang di malam puisi. Lenteranya sudah menyala, kita mulai.
      ar_eg: أهلًا بيك في ليلة الشعر. الفوانيس ولعت، يلا نبدأ.
      ar: مرحبًا بك في أمسية الشعر. أُضيئت الفوانيس، فلنبدأ.
      en: Welcome to poetry night. The lanterns are lit; let's begin.
    - speaker: Mohamed
      text: Encik, boleh saya mengucapkan sepatah kata dulu?
      ar_eg: يا أستاذ، ممكن أقول كلمتين الأول؟
      ar: يا أستاذ، هل لي بكلمة موجزة أولًا؟
      en: Encik, may I say a few words first?
    - speaker: Encik Zul
      text: Silakan! Kami menyambut tamu dari Mesir dengan sukacita.
      ar_eg: اتفضل! إحنا مستقبلين ضيفنا من مصر بفرحة كبيرة.
      ar: تفضّل! نستقبل ضيفنا من مصر بفرح عظيم.
      en: Please! We welcome our guest from Egypt with great joy.
    - speaker: Mohamed
      text: 'Terima kasih. Malam ini ibarat mimpi: jangkrik, lentera, dan puisi.'
      ar_eg: 'شكرًا. الليلة دي زي الحلم: صرصار الغيط والفوانيس والشعر.'
      ar: 'شكرًا. هذه الليلة كالحلم: صرصار الحقل والفوانيس والشعر.'
      en: 'Thank you. Tonight is like a dream: crickets, lanterns and poetry.'
    - speaker: Encik Zul
      text: Bagus! Kamu sudah berbicara seperti penyair.
      ar_eg: حلو! إنت بقيت بتتكلم زي الشعرا.
      ar: أحسنت! صرت تتكلم كالشعراء.
      en: Good! You already talk like a poet.
