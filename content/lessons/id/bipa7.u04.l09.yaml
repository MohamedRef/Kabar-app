schema: kabar.lesson/v1
id: bipa7.u04.l09
language: id
title: Bahasa yang terancam
can_do:
  ar_eg: تتكلّم عن لغات محلية بتموت وعن طرق إحيائها.
  ar: أن تتحدّث عن لغات محلية تحتضر وعن سبل إحيائها.
  en: Talk about dying local languages and how to revive them.
slides:
  - title: Menjaga bahasa daerah
    body:
      ar_eg: |
        إندونيسيا فيها حوالي 718 لغة محلية، وكتير منها terancam punah.
        السبب غالبًا إن pewarisan (تسليم اللغة من الأهل للعيال) بيقف، والـ generasi muda بيكلّموا الإندونيسي بس.
        العيلة الـ dwibahasa (بلغتين) بتحمي اللغة: المحلية في البيت والإندونيسي في المدرسة.
        revitalisasi = إحياء اللغة: دروس وأغاني وقواميس.
        sosiolinguistik بيدرس اللغة في المجتمع. dialektologi بيدرس اللهجات،
        وبيرسم isoglos = خط على الخريطة: من هنا الناس بتقول كلمة، ومن هناك بيقولوا تانية.
        - في الكلام: cuma = hanya.
      ar: |
        في إندونيسيا نحو 718 لغة محلية، وكثير منها terancam punah.
        والسبب غالبًا توقّف pewarisan (نقل اللغة من الأهل إلى الأبناء)، فيتكلّم generasi muda الإندونيسية وحدها.
        والأسرة dwibahasa (ثنائية اللغة) تحمي اللغة: المحلية في البيت والإندونيسية في المدرسة.
        revitalisasi = إحياء اللغة بالدروس والأغاني والمعاجم.
        يدرس sosiolinguistik اللغة في المجتمع، ويدرس dialektologi اللهجات،
        ويرسم isoglos: خطًّا على الخريطة يفصل بين من يقول كلمة ومن يقول أخرى.
        - في الكلام اليومي: cuma = hanya.
      en: |
        Indonesia has about 718 regional languages, and many are terancam punah (endangered).
        Usually pewarisan (passing the language from parents to children) stops, and the generasi muda speak only Indonesian.
        A dwibahasa (bilingual) family protects the language: the local one at home, Indonesian at school.
        revitalisasi = reviving a language with classes, songs and dictionaries.
        sosiolinguistik studies language in society. dialektologi studies dialects,
        and draws an isoglos: a line on the map where one word gives way to another.
        - In speech: cuma = hanya.
    examples:
      - text: Bahasa itu terancam punah karena penuturnya tinggal sedikit.
        ar_eg: اللغة دي مهدّدة بالانقراض علشان اللي بيتكلّموها بقوا قليلين.
        ar: تلك اللغة مهدّدة بالانقراض لقلّة متحدّثيها.
        en: That language is endangered because few speakers are left.
      - text: Anak-anak di desa ini dwibahasa sejak kecil.
        ar_eg: العيال في القرية دي بيتكلّموا لغتين من وهما صغيرين.
        ar: أطفال هذه القرية ثنائيّو اللغة منذ الصغر.
        en: Children in this village are bilingual from an early age.
      - text: Program revitalisasi mengajak generasi muda bernyanyi dalam bahasa ibu.
        ar_eg: برنامج الإحياء بيخلّي الشباب يغنّوا بلغتهم الأم.
        ar: يدعو برنامج الإحياء جيل الشباب إلى الغناء بلغتهم الأمّ.
        en: The revival programme gets young people singing in their mother tongue.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: terancam punah
        ar_eg: مهدّد بالانقراض
        ar: مهدّد بالانقراض
        en: endangered
      - text: revitalisasi
        ar_eg: إحياء
        ar: إحياء، إنعاش
        en: revitalisation
      - text: pewarisan
        ar_eg: توريث / تسليم للجيل اللي بعده
        ar: التوريث، النقل بين الأجيال
        en: passing down, inheritance
      - text: generasi muda
        ar_eg: الجيل الجديد / الشباب
        ar: جيل الشباب
        en: the younger generation
    words: [terancam punah, revitalisasi, pewarisan, generasi muda]
  - id: e02
    type: match_pairs
    pairs:
      - text: dwibahasa
        ar_eg: بيتكلّم لغتين
        ar: ثنائي اللغة
        en: bilingual
      - text: sosiolinguistik
        ar_eg: علم اللغة الاجتماعي
        ar: علم اللغة الاجتماعي
        en: sociolinguistics
      - text: dialektologi
        ar_eg: علم اللهجات
        ar: علم اللهجات
        en: dialectology
      - text: isoglos
        ar_eg: خط على الخريطة بيفصل بين لهجتين
        ar: خطّ تماثل لغوي
        en: isogloss
    words: [dwibahasa, sosiolinguistik, dialektologi, isoglos]
  - id: e03
    type: listen
    text: Garis isoglos ini memisahkan desa yang bilang "sa" dan yang bilang "sy".
    question:
      ar_eg: الخط ده بيفصل بين إيه؟
      ar: بمَ يفصل هذا الخطّ؟
      en: What does this line separate?
    options: [خط بين لهجتين, عالم اللهجات, برنامج إحياء]
    answer: 0
    meaning:
      ar_eg: الخط ده بيفصل بين القرى اللي بتقول «سا» واللي بتقول حاجة تانية.
      ar: يفصل هذا الخطّ بين قرى تقول «sa» وأخرى تقول غيرها.
      en: This isogloss separates villages that say 'sa' from the others.
    words: [isoglos]
  - id: e04
    type: fill_blank
    sentence: Tanpa ___ dari orang tua ke anak, bahasa itu akan hilang.
    meaning:
      ar_eg: من غير ___ من الأهل للعيال، اللغة دي هتختفي.
      ar: من دون ___ من الآباء إلى الأبناء ستندثر تلك اللغة.
      en: Without ___ from parents to children, the language will vanish.
    options: [pewarisan, isoglos, dialektologi]
    answers: [pewarisan]
    words: [pewarisan, isoglos, dialektologi]
    explain:
      ar_eg: pewarisan = توريث اللغة من الأهل للعيال. isoglos = خط حدود لهجة، وdialektologi = علم اللهجات.
      ar: pewarisan = توريث اللغة من الآباء للأبناء. أما isoglos فخط تساوٍ لغوي وdialektologi علم اللهجات.
      en: pewarisan = handing the language down.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «sosiolinguistik» بيدرس إيه؟
      ar: ماذا يدرس «sosiolinguistik»؟
      en: What does 'sosiolinguistik' study?
    options: [Bunyi binatang., Hubungan bahasa dengan masyarakat., Sejarah kerajaan.]
    answer: 1
    explain:
      ar_eg: علم اللغة الاجتماعي = اللغة جوّه المجتمع.
      ar: علم اللغة الاجتماعي يدرس اللغة في المجتمع.
      en: Sociolinguistics = language in society.
    words: [sosiolinguistik, dialektologi]
  - id: e06
    type: fill_blank
    sentence: Sekarang ___ lebih sering memakai bahasa Indonesia di rumah.
    meaning:
      ar_eg: دلوقتي ___ بيستعملوا الإندونيسي في البيت أكتر.
      ar: صار ___ يستعملون الإندونيسية في البيت أكثر.
      en: Now the ___ use Indonesian at home more often.
    options: [generasi muda, revitalisasi, terancam punah]
    answers: [generasi muda]
    words: [generasi muda, revitalisasi, terancam punah]
    explain:
      ar_eg: generasi muda = الجيل الجديد، وهو اللي بيتكلم إندونيسي في البيت. revitalisasi = إحياء، وterancam punah = مهدد بالانقراض.
      ar: generasi muda = الجيل الشاب. أما revitalisasi فإحياء وterancam punah مهدد بالانقراض.
      en: generasi muda = the younger generation.
  - id: e07
    type: build_sentence
    source:
      ar_eg: هي بتدرس علم اللهجات في جامعة باتيمورا.
      ar: تدرس علم اللهجات في جامعة باتيمورا.
      en: She studies dialectology at Pattimura University.
    answer: Dia belajar dialektologi di Universitas Pattimura.
    distractors: [isoglos, pewarisan]
    words: [dialektologi]
    explain:
      ar_eg: belajar dialektologi = بتدرس علم اللهجات. isoglos وpewarisan مش في الجملة.
      ar: belajar dialektologi = تدرس علم اللهجات.
      en: belajar dialektologi = studies dialectology.
  - id: e08
    type: translate
    direction: from_target
    source_text: Keluarga dwibahasa membantu revitalisasi bahasa daerah.
    answers_meaning:
      ar_eg: [العيلات اللي بتتكلّم لغتين بتساعد في إحياء اللغات المحلية, الأسر ثنائية اللغة بتساعد تحيي لغة المنطقة]
      ar: [تساعد الأسر ثنائية اللغة على إحياء اللغات المحلية, تسهم الأسرة الثنائية اللغة في إنعاش اللغة المحلية]
      en: [Bilingual families help revive regional languages, Bilingual households support the revival of the local language]
    words: [dwibahasa, revitalisasi]
  - id: e09
    type: speaking
    text: Bahasa nenek saya terancam punah.
    meaning:
      ar_eg: لغة جدّتي مهدّدة بالانقراض.
      ar: لغة جدّتي مهدّدة بالانقراض.
      en: My grandmother's language is endangered.
    words: [terancam punah]
  - id: e10
    type: multiple_choice
    question: Apa yang paling membantu bahasa yang terancam punah?
    options: [Hanya memakai bahasa asing., Membuang kamus lama., Pewarisan di rumah dan program revitalisasi.]
    answer: 2
    explain:
      ar_eg: اللغة بتعيش لما تتورّث في البيت وتتحيا بالبرامج.
      ar: تحيا اللغة بالتوريث في البيت وببرامج الإحياء.
      en: A language survives through home transmission and revival work.
    words: [pewarisan, revitalisasi, terancam punah, generasi muda, dwibahasa, sosiolinguistik, isoglos]
dialogue:
  lines:
    - speaker: Tante Grace
      text: Di kampung saya, cuma orang tua yang masih pakai bahasa daerah.
      ar_eg: في قريتي، الكبار بس اللي لسه بيتكلّموا اللغة المحلية.
      ar: في قريتي لا يتكلّم اللغة المحلية إلا الكبار.
      en: In my village, only the old people still speak the local language.
    - speaker: Mohamed
      text: Jadi bahasanya terancam punah, Tante?
      ar_eg: يبقى اللغة مهدّدة بالانقراض يا طنط؟
      ar: أي إنّ اللغة مهدّدة بالانقراض يا خالة؟
      en: So the language is endangered, Tante?
    - speaker: Tante Grace
      text: Ya. Pewarisannya putus. Generasi muda malu memakainya.
      ar_eg: أيوه. التوريث اتقطع. والشباب مكسوفين يتكلّموها.
      ar: نعم، انقطع توريثها، والشباب يخجلون من استعمالها.
      en: Yes. The passing-down has broken. Young people are embarrassed to use it.
    - speaker: Mohamed
      text: Di Mesir, banyak anak dwibahasa. Mereka bangga dengan dua bahasa.
      ar_eg: في مصر، عيال كتير بيتكلّموا لغتين وفخورين بيهم.
      ar: في مصر أطفال كثيرون ثنائيّو اللغة ويفخرون باللغتين.
      en: In Egypt many kids are bilingual and proud of both languages.
    - speaker: Tante Grace
      text: 'Itu tujuan program revitalisasi kami: bangga, bukan malu.'
      ar_eg: 'ده هدف برنامج الإحياء بتاعنا: فخر، مش كسوف.'
      ar: 'هذا هدف برنامج الإحياء لدينا: الفخر لا الخجل.'
      en: 'That''s our revival programme''s aim: pride, not shame.'
