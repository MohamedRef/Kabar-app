schema: kabar.lesson/v1
id: bipa7.u04.l08
language: id
title: Menyusun kamus dialek
can_do:
  ar_eg: 'تشارك في عمل قاموس لهجة: تسجّل، تفرّغ، وتكتب المداخل.'
  ar: 'أن تشارك في إعداد معجم لهجة: التسجيل والتفريغ وكتابة المداخل.'
  en: 'Help build a dialect dictionary: record, transcribe and write entries.'
slides:
  - title: Dari rekaman ke kamus
    body:
      ar_eg: |
        خطوات عمل قاموس لهجة:
        1. ahli bahasa بيسجّل penutur asli (المتكلّمين الأصليين) وهم بيحكوا.
        2. transkripsi = تفريغ التسجيل كتابة. كل النصوص مع بعض بتعمل korpus.
        3. من الكوربس بنطلّع leksikon اللهجة (كل مفرداتها).
        4. كل كلمة في القاموس lema، ومعاها معناها وأحيانًا etimologi (أصلها): kata «kitab» berasal dari bahasa Arab.
        5. في آخر الكتاب glosarium للمصطلحات الصعبة.
      ar: |
        خطوات إعداد معجم لهجة:
        1. يسجّل ahli bahasa أحاديث penutur asli (المتحدّثين الأصليين).
        2. transkripsi = تفريغ التسجيل كتابةً، ومجموع النصوص korpus.
        3. من المدوّنة نستخرج leksikon اللهجة (رصيدها من المفردات).
        4. كلّ كلمة في المعجم lema، يرافقها معناها وأحيانًا etimologi (أصلها): kata «kitab» berasal dari bahasa Arab.
        5. وفي آخر الكتاب glosarium للمصطلحات الصعبة.
      en: |
        Steps to build a dialect dictionary:
        1. An ahli bahasa (linguist) records penutur asli (native speakers) telling stories.
        2. transkripsi = writing the recording down; all the texts together make a korpus.
        3. From the corpus we extract the dialect's leksikon (its whole vocabulary).
        4. Each word in the dictionary is a lema, with its meaning and sometimes its etimologi: kata «kitab» berasal dari bahasa Arab.
        5. At the back there's a glosarium of difficult terms.
    examples:
      - text: Ahli bahasa itu merekam tiga puluh penutur asli.
        ar_eg: عالمة اللغة دي سجّلت تلاتين متكلّم أصلي.
        ar: سجّلت تلك اللغوية ثلاثين متحدّثًا أصليًا.
        en: That linguist recorded thirty native speakers.
      - text: Transkripsi satu jam rekaman butuh satu hari.
        ar_eg: تفريغ ساعة تسجيل بياخد يوم كامل.
        ar: يحتاج تفريغ ساعة من التسجيل يومًا كاملًا.
        en: Transcribing one hour of recording takes a day.
      - text: Etimologi kata "kursi" berasal dari bahasa Arab.
        ar_eg: أصل كلمة «كورسي» عربي.
        ar: أصل كلمة «kursi» عربيّ.
        en: The word 'kursi' comes from Arabic.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: leksikon
        ar_eg: مجموع مفردات اللغة
        ar: معجم المفردات (الرصيد اللفظي)
        en: lexicon
      - text: lema
        ar_eg: مدخل في القاموس
        ar: مدخل معجمي
        en: headword, dictionary entry
      - text: etimologi
        ar_eg: أصل الكلمة
        ar: علم أصول الكلمات
        en: etymology
      - text: glosarium
        ar_eg: قايمة مصطلحات بمعانيها
        ar: مسرد مصطلحات
        en: glossary
    words: [leksikon, lema, etimologi, glosarium]
  - id: e02
    type: match_pairs
    pairs:
      - text: korpus
        ar_eg: مدوّنة نصوص للبحث
        ar: مدوّنة لغوية
        en: corpus
      - text: transkripsi
        ar_eg: تفريغ / كتابة الكلام المسموع
        ar: تفريغ نصّي، نسخ صوتي
        en: transcription
      - text: penutur asli
        ar_eg: متكلّم أصلي (لغته الأم)
        ar: متحدّث أصلي
        en: native speaker
      - text: ahli bahasa
        ar_eg: عالم لغة
        ar: عالم لغويات
        en: linguist
    words: [korpus, transkripsi, penutur asli, ahli bahasa]
  - id: e03
    type: listen
    text: Korpus kami sudah berisi dua ratus cerita rakyat.
    question:
      ar_eg: إيه اللي فيه ميتين حكاية؟
      ar: ما الذي يضمّ مئتي حكاية؟
      en: What holds two hundred tales?
    options: [مدوّنة النصوص, قايمة المصطلحات, مدخل القاموس]
    answer: 0
    meaning:
      ar_eg: المدوّنة بتاعتنا فيها خلاص ميتين حكاية شعبية.
      ar: تضمّ مدوّنتنا الآن مئتي حكاية شعبية.
      en: Our corpus now holds two hundred folk tales.
    words: [korpus]
  - id: e04
    type: fill_blank
    sentence: Kamus ini punya lima ribu ___.
    meaning:
      ar_eg: القاموس ده فيه خمس آلاف ___.
      ar: يضمّ هذا المعجم خمسة آلاف ___.
      en: This dictionary has five thousand ___.
    options: [lema, etimologi, transkripsi]
    answers: [lema]
    words: [lema, etimologi, transkripsi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه بنسأل «penutur asli» مش الطلبة؟
      ar: لماذا نسأل «penutur asli» لا الطلّاب؟
      en: Why ask 'penutur asli' rather than students?
    options: [Karena mereka lebih muda., Karena mereka tidak bisa menulis., Karena bahasa itu adalah bahasa ibu mereka.]
    answer: 2
    explain:
      ar_eg: المتكلّم الأصلي اتربّى على اللغة دي.
      ar: المتحدّث الأصلي نشأ على تلك اللغة.
      en: A native speaker grew up with the language.
    words: [penutur asli, ahli bahasa]
  - id: e06
    type: fill_blank
    sentence: Istilah sulit dijelaskan dalam ___ di halaman belakang.
    meaning:
      ar_eg: المصطلحات الصعبة متشرحة في ___ في الصفحات الأخيرة.
      ar: تُشرح المصطلحات الصعبة في ___ في الصفحات الأخيرة.
      en: Difficult terms are explained in the ___ at the back.
    options: [glosarium, leksikon, korpus]
    answers: [glosarium]
    words: [glosarium, leksikon, korpus]
  - id: e07
    type: build_sentence
    source:
      ar_eg: هي بتكتب تفريغ للمقابلة.
      ar: إنها تكتب تفريغ المقابلة.
      en: She's writing up the interview transcription.
    answer: Dia sedang menulis transkripsi wawancara.
    distractors: [lema, glosarium]
    words: [transkripsi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Leksikon bahasa Melayu Papua banyak menyerap kata dari bahasa daerah.
    answers_meaning:
      ar_eg: [مفردات الملايو البابوي خدت كلمات كتير من اللغات المحلية, الملايو البابوي استلف كلمات كتير من لغات المناطق]
      ar: [استوعب الرصيد اللفظي للملايوية البابوية كلمات كثيرة من اللغات المحلية, أخذت مفردات الملايوية البابوية كثيرًا من اللغات المحلية]
      en: ['Papuan Malay''s lexicon absorbs many words from local languages', The Papuan Malay lexicon has borrowed many words from regional languages]
    words: [leksikon]
  - id: e09
    type: speaking
    text: Ahli bahasa itu meneliti etimologi nama-nama pulau.
    meaning:
      ar_eg: عالم اللغة ده بيدرس أصل أسامي الجزر.
      ar: يبحث ذلك اللغويّ في أصل أسماء الجزر.
      en: That linguist studies the etymology of island names.
    words: [ahli bahasa, etimologi]
  - id: e10
    type: multiple_choice
    question: Apa langkah pertama setelah merekam penutur asli?
    options: [Transkripsi rekaman., Mencetak glosarium., Menjual kamus.]
    answer: 0
    explain:
      ar_eg: بعد التسجيل بنفرّغ الكلام كتابة.
      ar: بعد التسجيل نفرّغ الكلام كتابةً.
      en: After recording, we transcribe.
    words: [transkripsi, penutur asli, glosarium, lema, korpus, leksikon, etimologi]
dialogue:
  lines:
    - speaker: Tante Grace
      text: Mohamed, bantu saya dengan kamus Melayu Papua ini, ya.
      ar_eg: يا محمد، ساعدني في قاموس الملايو البابوي ده.
      ar: يا محمد، ساعدني في معجم الملايوية البابوية هذا.
      en: Mohamed, help me with this Papuan Malay dictionary.
    - speaker: Mohamed
      text: Dengan senang hati, Tante. Rekamannya dari mana?
      ar_eg: بكل سرور يا طنط. التسجيلات منين؟
      ar: بكلّ سرور يا خالة. من أين التسجيلات؟
      en: Happily, Tante. Where are the recordings from?
    - speaker: Tante Grace
      text: Dari penutur asli di Sorong dan Fakfak. Tolong buat transkripsinya.
      ar_eg: من متكلّمين أصليين في سورونج وفاكفاك. اعمل لهم التفريغ لو سمحت.
      ar: من متحدّثين أصليين في سورونغ وفاكفاك. فرّغها من فضلك.
      en: From native speakers in Sorong and Fakfak. Please transcribe them.
    - speaker: Mohamed
      text: Baik. Lalu kata "kitong" kita jadikan lema sendiri?
      ar_eg: حاضر. وكلمة «كيتونج» نعملها مدخل لوحدها؟
      ar: حسنًا. وهل نجعل كلمة «kitong» مدخلًا مستقلًّا؟
      en: OK. And do we make 'kitong' its own headword?
    - speaker: Tante Grace
      text: 'Ya. Tulis juga etimologinya: dari "kita orang".'
      ar_eg: 'أيوه. واكتب أصلها كمان: من «كيتا أورانج».'
      ar: 'نعم، واكتب أصلها أيضًا: من «kita orang».'
      en: 'Yes. Write its etymology too: from ''kita orang''.'
    - speaker: Mohamed
      text: Menarik sekali. Ini pekerjaan seorang ahli bahasa sungguhan!
      ar_eg: حاجة ممتعة جدًا. ده شغل عالم لغة بجد!
      ar: ممتع جدًا، هذا عمل لغويّ حقيقيّ!
      en: Fascinating. This is real linguist's work!
