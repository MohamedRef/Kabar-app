schema: kabar.lesson/v1
id: bipa7.u02.l09
language: id
title: Cuaca ekstrem
can_do:
  ar_eg: تفهم نشرة طقس فيها تحذير من أعاصير وسيول وانهيارات.
  ar: أن تفهم نشرة جويّة فيها تحذير من أعاصير وسيول وانزلاقات.
  en: Understand a weather bulletin warning of cyclones, floods and landslides.
slides:
  - title: Peringatan cuaca
    body:
      ar_eg: |
        siklon = إعصار كبير جاي من البحر (سنة 2021 Siklon Seroja ضرب NTT).
        puting beliung = زوبعة صغيرة بتشيل أسقف البيوت.
        curah hujan tinggi = مطر كتير. بعده ممكن banjir bandang (سيل جارف) وtanah longsor (انهيار أرضي).
        rob = مية البحر بتدخل الشوارع وقت pasang (المد)، زي شمال جاكرتا وسمارانج.
        pasang surut = المد والجزر.
        kemarau panjang = جفاف طويل، وكلمة pasang surut كمان بتتقال مجازًا: «طلوع ونزول».
        - في الكلام: pake = pakai، oke = baik، iya = ya.
      ar: |
        siklon = إعصار كبير قادم من البحر (عام 2021 ضرب Siklon Seroja مقاطعة NTT).
        puting beliung = زوبعة صغيرة تقتلع أسقف البيوت.
        curah hujan tinggi = أمطار غزيرة، قد يعقبها banjir bandang (سيل جارف) وtanah longsor (انزلاق أرضي).
        rob = تدخل مياه البحر الشوارع وقت pasang (المدّ)، كما في شمال جاكرتا وسمارانغ.
        pasang surut = المدّ والجزر.
        kemarau panjang = جفاف طويل. وتُستعمل pasang surut مجازًا بمعنى «التقلّبات».
        - في الكلام اليومي: pake = pakai، oke = baik، iya = ya.
      en: |
        siklon = a big cyclone from the sea (Cyclone Seroja hit NTT in 2021).
        puting beliung = a small whirlwind that rips off roofs.
        curah hujan tinggi = heavy rainfall, which can bring banjir bandang (flash floods) and tanah longsor (landslides).
        rob = seawater flooding the streets at pasang (high tide), as in north Jakarta and Semarang.
        pasang surut = the tides.
        kemarau panjang = a long dry season. pasang surut is also used figuratively: "ups and downs".
        - In speech: pake = pakai, oke = baik, iya = ya.
    examples:
      - text: Curah hujan minggu ini sangat tinggi.
        ar_eg: كمية المطر الأسبوع ده عالية جدًا.
        ar: معدّل الأمطار هذا الأسبوع مرتفع جدًا.
        en: Rainfall is very high this week.
      - text: Rob masuk ke rumah warga setiap bulan purnama.
        ar_eg: مية البحر بتدخل بيوت الناس كل ما القمر يبقى بدر.
        ar: تدخل مياه المدّ بيوت السكّان كلّ بدر.
        en: Tidal floods enter homes at every full moon.
      - text: Kemarau panjang membuat sumur-sumur kering.
        ar_eg: الجفاف الطويل نشّف الآبار.
        ar: جفّف الجفاف الطويل الآبار.
        en: The long drought dried up the wells.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: siklon
        ar_eg: إعصار
        ar: إعصار مداري
        en: (tropical) cyclone
      - text: puting beliung
        ar_eg: دوّامة هوا / زوبعة
        ar: زوبعة، إعصار قمعي صغير
        en: whirlwind, small tornado
      - text: curah hujan
        ar_eg: كمية المطر
        ar: معدّل هطول الأمطار
        en: rainfall
      - text: banjir bandang
        ar_eg: سيل جارف
        ar: سيل جارف مفاجئ
        en: flash flood
    words: [siklon, puting beliung, curah hujan, banjir bandang]
  - id: e02
    type: match_pairs
    pairs:
      - text: tanah longsor
        ar_eg: انهيار أرضي
        ar: انزلاق أرضي
        en: landslide
      - text: rob
        ar_eg: فيضان مية البحر على الساحل
        ar: فيضان مياه البحر المدّي
        en: tidal flooding
      - text: pasang surut
        ar_eg: المد والجزر
        ar: المدّ والجزر
        en: tides, ebb and flow
      - text: kemarau panjang
        ar_eg: جفاف طويل
        ar: موسم جفاف طويل
        en: long dry season, drought
    words: [tanah longsor, rob, pasang surut, kemarau panjang]
  - id: e03
    type: listen
    text: Puting beliung merusak dua puluh atap rumah di Sidoarjo.
    question:
      ar_eg: إيه اللي بوّظ الأسقف؟
      ar: ما الذي خرّب السقوف؟
      en: What damaged the roofs?
    options: [زوبعة, جفاف, مد]
    answer: 0
    meaning:
      ar_eg: زوبعة بوّظت أسقف عشرين بيت في سيدوارجو.
      ar: خرّبت زوبعة سقوف عشرين بيتًا في سيدوارجو.
      en: A whirlwind damaged twenty roofs in Sidoarjo.
    words: [puting beliung]
  - id: e04
    type: fill_blank
    sentence: Jalan ke desa itu tertutup karena ___ setelah hujan semalam.
    meaning:
      ar_eg: الطريق للقرية دي اتقفل بسبب ___ بعد مطر امبارح.
      ar: أُغلق الطريق إلى القرية بسبب ___ بعد مطر الليلة الماضية.
      en: The road to that village is blocked by a ___ after last night's rain.
    options: [tanah longsor, kemarau panjang, pasang surut]
    answers: [tanah longsor]
    words: [tanah longsor, kemarau panjang, pasang surut]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «rob» بيحصل إمتى؟
      ar: متى يحدث «rob»؟
      en: When does 'rob' happen?
    options: [Saat kemarau panjang di gunung., Saat air laut pasang tinggi di pesisir., Saat ada siklon di gurun.]
    answer: 1
    explain:
      ar_eg: rob = مية البحر بتغرق الساحل وقت المد العالي.
      ar: rob = إغراق مياه البحر للساحل وقت المدّ العالي.
      en: rob = seawater flooding the coast at high tide.
    words: [rob, kemarau panjang, siklon]
  - id: e06
    type: fill_blank
    sentence: Nelayan selalu melihat jadwal ___ sebelum melaut.
    meaning:
      ar_eg: الصيادين دايمًا بيبصّوا على مواعيد ___ قبل ما ينزلوا البحر.
      ar: ينظر الصيّادون دائمًا في جدول ___ قبل الإبحار.
      en: Fishermen always check the ___ table before going to sea.
    options: [pasang surut, curah hujan, banjir bandang]
    answers: [pasang surut]
    words: [pasang surut, curah hujan, banjir bandang]
  - id: e07
    type: build_sentence
    source:
      ar_eg: سيل جارف ضرب القرية دي بالليل.
      ar: ضرب سيل جارف هذه القرية ليلًا.
      en: A flash flood hit this village at night.
    answer: Banjir bandang melanda desa ini pada malam hari.
    distractors: [rob, siklon]
    words: [banjir bandang]
  - id: e08
    type: translate
    direction: from_target
    source_text: Siklon itu membawa curah hujan yang sangat tinggi ke Kupang.
    answers_meaning:
      ar_eg: [الإعصار ده جاب مطر كتير جدًا لكوبانج, الإعصار جاب أمطار غزيرة جدًا على كوبانج]
      ar: [جلب ذلك الإعصار أمطارًا غزيرة جدًا إلى كوبانغ, حمل الإعصار معدّلات أمطار مرتفعة جدًا إلى كوبانغ]
      en: [That cyclone brought very heavy rainfall to Kupang, The cyclone brought extremely high rainfall to Kupang]
    words: [siklon, curah hujan]
  - id: e09
    type: speaking
    text: Kemarau panjang dan rob sama-sama berbahaya bagi petani.
    meaning:
      ar_eg: الجفاف الطويل والمد البحري الاتنين خطر على الفلاحين.
      ar: الجفاف الطويل وفيضان المدّ كلاهما خطر على المزارعين.
      en: Long droughts and tidal floods are both dangerous for farmers.
    words: [kemarau panjang, rob]
  - id: e10
    type: multiple_choice
    question: Setelah curah hujan tinggi di lereng gundul, apa yang paling mungkin terjadi?
    options: [Pasang surut berhenti., Siklon lahir di sungai., Tanah longsor dan banjir bandang.]
    answer: 2
    explain:
      ar_eg: المطر الكتير على جبل مافيهوش شجر بيجيب انهيارات وسيول.
      ar: الأمطار الغزيرة على سفح عارٍ تسبّب انزلاقات وسيولًا.
      en: Heavy rain on a bare slope brings landslides and flash floods.
    words: [tanah longsor, banjir bandang, curah hujan, puting beliung, siklon, pasang surut]
dialogue:
  lines:
    - speaker: Kaka Yohana
      text: Siaran jam enam dibuka pake peringatan cuaca. Kamu yang baca, ya.
      ar_eg: نشرة الساعة ستة هتبدأ بتحذير الطقس. إنت اللي هتقراه.
      ar: تبدأ نشرة السادسة بتحذير جوّي، وأنت من سيقرؤه.
      en: The six o'clock bulletin opens with the weather warning. You read it.
    - speaker: Mohamed
      text: Oke. Ada bibit siklon di selatan, curah hujan tinggi tiga hari.
      ar_eg: حاضر. فيه بداية إعصار في الجنوب، ومطر كتير تلات أيام.
      ar: حسنًا. هناك بذرة إعصار في الجنوب وأمطار غزيرة لثلاثة أيّام.
      en: OK. A cyclone is forming in the south, heavy rain for three days.
    - speaker: Kaka Yohana
      text: 'Tambahkan: warga di lereng waspada tanah longsor.'
      ar_eg: 'زوّد: الأهالي اللي على السفح يخلّوا بالهم من الانهيارات.'
      ar: 'أضف: على سكّان السفوح الحذر من الانزلاقات.'
      en: 'Add: people on the slopes should watch for landslides.'
    - speaker: Mohamed
      text: Dan di pesisir? Malam ini pasang tinggi.
      ar_eg: وعلى الساحل؟ الليلة المد عالي.
      ar: وعلى الساحل؟ المدّ عالٍ الليلة.
      en: And on the coast? High tide tonight.
    - speaker: Kaka Yohana
      text: Iya, sebut juga risiko rob di Klademak. Pendengar kita banyak di sana.
      ar_eg: أيوه، قول كمان إن فيه خطر فيضان بحر في كلاديماك. مستمعينا كتير هناك.
      ar: نعم، واذكر خطر المدّ في كلاديماك، فلنا مستمعون كثيرون هناك.
      en: Yes, mention the tidal-flood risk in Klademak too. We have lots of listeners there.
