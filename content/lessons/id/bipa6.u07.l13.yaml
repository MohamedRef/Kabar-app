language: id
title: Ulangan Unit 7
can_do:
  ar_eg: تقرا قاعدة قانونية وتشرحها بكلام بسيط.
  ar: أن تقرأ قاعدة قانونية وتشرحها بكلام بسيط.
  en: Read a legal rule and explain it in plain words.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pasal
        ar_eg: مادة (في قانون)
        ar: مادّة قانونية
        en: article (of a law)
      - text: hak
        ar_eg: حق
        ar: حقّ
        en: right
      - text: kewajiban
        ar_eg: واجب
        ar: واجب
        en: duty, obligation
      - text: denda
        ar_eg: غرامة
        ar: غرامة
        en: fine (penalty)
      - text: dampak
        ar_eg: أثر
        ar: أثر
        en: impact
    words: [pasal, hak, kewajiban, denda, dampak]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Peserta dapat membawa kamus» معناها إيه؟
      ar: ما معنى «Peserta dapat membawa kamus»؟
      en: What does "Peserta dapat membawa kamus" mean?
    options:
      - يجوز للمشارك يجيب قاموس.
      - لازم المشارك يجيب قاموس.
      - ممنوع المشارك يجيب قاموس.
    answer: 0
  - id: e03
    type: fill_blank
    sentence: Setiap warga negara wajib ___ hukum.
    meaning:
      ar_eg: كل مواطن لازم يلتزم بالقانون.
      ar: على كلّ مواطن أن يمتثل للقانون.
      en: Every citizen must obey the law.
    options: [mematuhi, melindungi, mengatur]
    answers: [mematuhi]
    words: [mematuhi, warga negara]
  - id: e04
    type: listen
    text: Peraturan ini mengatur persyaratan izin tinggal bagi orang asing.
    question:
      ar_eg: اللايحة دي بتنظّم إيه؟
      ar: ماذا تنظّم هذه اللائحة؟
      en: What does this regulation govern?
    options:
      - نسبة الضرايب.
      - شروط إقامة الأجانب.
      - مواعيد المدارس.
    answer: 1
    words: [peraturan, mengatur, persyaratan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: في حالة حصول مخالفة، يجوز إن المؤسسة تتغرّم.
      ar: في حال وقوع مخالفة، يجوز تغريم المؤسّسة.
      en: In the event of an offence, the institution may be fined.
    answer: Dalam hal terjadi pelanggaran, lembaga dapat dikenai denda.
    distractors: [hak, sasaran]
    words: [dalam hal, pelanggaran, lembaga, denda]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة بتبسّط «Setiap orang berhak atas perlindungan hukum»؟
      ar: أيّ جملة تبسّط «Setiap orang berhak atas perlindungan hukum»؟
      en: Which sentence simplifies "Setiap orang berhak atas perlindungan hukum"?
    options:
      - Hanya warga negara dilindungi hukum.
      - Tidak ada orang yang dilindungi.
      - Semua orang dilindungi oleh hukum.
    answer: 2
    words: [berhak]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أثر البند ده بيحسّه كل الخرّيجين.
      ar: يشعر كلّ الخرّيجين بأثر هذا البند.
      en: All graduates feel the impact of this provision.
    answers:
      - Dampak ketentuan ini dirasakan oleh semua lulusan.
      - Dampak ketentuan ini dirasakan semua lulusan.
      - Semua lulusan merasakan dampak ketentuan ini.
      - Seluruh lulusan merasakan dampak ketentuan ini.
    words: [dampak, ketentuan, lulusan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Rekomendasi kami, standar ini berlaku mulai tahun depan.
    answers_meaning:
      ar_eg:
        - توصيتنا إن المعيار ده يسري من السنة الجاية.
        - إحنا بنوصي إن المعيار ده يتطبّق من السنة الجاية.
      ar:
        - توصيتنا أن يسري هذا المعيار ابتداءً من العام القادم.
        - نوصي بأن يُعمل بهذا المعيار من العام المقبل.
      en:
        - Our recommendation is that this standard applies from next year.
        - We recommend this standard take effect next year.
    words: [rekomendasi, standar, berlaku]
  - id: e09
    type: dictation
    text: Pemohon diwajibkan melakukan registrasi sebelum aturan baru diberlakukan.
    meaning:
      ar_eg: المتقدمين لازم يسجلوا قبل ما القانون الجديد يتطبّق.
      ar: يُلزَم المتقدّمون بالتسجيل قبل سريان القاعدة الجديدة.
      en: Applicants must register before the new rule takes effect.
    words: [diwajibkan, registrasi, diberlakukan]
  - id: e10
    type: speaking
    text: Artinya, sasaran peraturan ini adalah semua lembaga kursus.
    meaning:
      ar_eg: يعني اللايحة دي بتستهدف كل مؤسسات الكورسات.
      ar: أي إنّ هذه اللائحة تستهدف كلّ مؤسّسات الدورات.
      en: In plain terms, this regulation targets every course institution.
    words: [sasaran, lembaga, peraturan]
  - id: e11
    type: match_pairs
    pairs:
      - text: dakwaan
        ar_eg: لايحة الاتهام
        ar: لائحة الاتهام
        en: charge
      - text: akta
        ar_eg: عقد رسمي، شهادة
        ar: وثيقة رسمية
        en: deed, certificate
      - text: perpanjangan
        ar_eg: تجديد
        ar: تمديد
        en: extension
      - text: bersyarat
        ar_eg: مشروط
        ar: مشروط
        en: conditional
      - text: sengketa
        ar_eg: نزاع
        ar: نزاع
        en: dispute
      - text: petisi
        ar_eg: عريضة
        ar: عريضة
        en: petition
    words: [dakwaan, akta, perpanjangan, bersyarat, sengketa, petisi]
  - id: e12
    type: translate
    direction: from_target
    source_text: Warga menggugat ke mahkamah karena ketidakadilan.
    answers_meaning:
      ar_eg: [الناس رفعوا قضية للمحكمة بسبب الظلم, الأهالي اشتكوا للمحكمة من الظلم]
      ar: [قاضى الأهالي أمام المحكمة بسبب الظلم]
      en: [The residents sued in court over the injustice, Citizens took the case to court because of injustice]
    words: [menggugat, mahkamah, ketidakadilan]
dialogue:
  title: Di Candi Muaro Jambi
  lines:
    - speaker: Kak Intan
      text: Ini Candi Muaro Jambi. Kompleksnya luas sekali, ribuan hektare.
      ar_eg: دي معابد مواروجامبي. المجمّع واسع قوي، آلاف الهكتارات.
      ar: هذه معابد موارو جامبي. المجمّع واسع جدًّا، آلاف الهكتارات.
      en: This is Muaro Jambi. The complex is huge, thousands of hectares.
    - speaker: Mohamed
      text: Ada peraturan untuk pengunjung juga. "Pengunjung dilarang memanjat candi."
      ar_eg: فيه لايحة للزوار كمان. «ممنوع على الزوار يتسلقوا المعبد».
      ar: ثمّة لائحة للزوّار أيضًا. «يُحظر على الزوّار تسلّق المعبد».
      en: There are rules for visitors too. "Visitors are prohibited from climbing the temple."
    - speaker: Kak Intan
      text: Betul. Artinya, kita boleh melihat dan memotret, tetapi jangan naik.
      ar_eg: مظبوط. يعني نقدر نتفرج ونصوّر، بس مانطلعش.
      ar: صحيح. أي يجوز لنا أن نرى ونصوّر، لكن لا نصعد.
      en: Right. It means we can look and take photos, but we don't climb.
    - speaker: Mohamed
      text: Hak saya memotret, kewajiban saya menjaga. Adil!
      ar_eg: حقي أصوّر، وواجبي أحافظ. عدل!
      ar: حقّي أن أصوّر، وواجبي أن أحافظ. عدل!
      en: My right is to take photos, my duty is to take care. Fair!
souvenir:
  id: bipa6.u07.souvenir
  title: Candi Muaro Jambi
  note:
    ar_eg: مجمّع معابد مواروجامبي على نهر باتانج هاري من أكبر مجمّعات المعابد البوذية القديمة في جنوب شرق آسيا، ومساحته حوالي أربع آلاف هكتار. المعابد مبنية بالطوب الأحمر، وأغلبها من القرن السابع لحد التلتاشر، أيام مملكة ملايو وسريويجايا. مؤرخين كتير شايفين إنه كان مركز كبير لتعليم البوذية، وإن الراهب الهندي أتيشا جه يتعلّم فيه. ومن 2009 هو على القائمة المبدئية لتراث اليونسكو.
    ar: مجمّع معابد موارو جامبي على نهر باتانغ هاري من أكبر مجمّعات المعابد البوذية القديمة في جنوب شرق آسيا، وتقارب مساحته أربعة آلاف هكتار. شُيّدت معابده بالآجرّ الأحمر، ويعود معظمها إلى ما بين القرنين السابع والثالث عشر، أيّام مملكة ملايو وسريويجايا. ويرى كثير من المؤرّخين أنّه كان مركزًا كبيرًا لتعليم البوذية، وأنّ الراهب الهندي أتيشا قصده للتعلّم. وهو منذ 2009 على القائمة المبدئية لتراث اليونسكو.
    en: The Muaro Jambi temple complex on the Batang Hari River is one of the largest ancient Buddhist temple sites in Southeast Asia, covering about 4,000 hectares. Its temples are built of red brick, and most date from the 7th to the 13th century, the era of the Malayu kingdom and Srivijaya. Many historians believe it was a major centre of Buddhist learning where the Indian monk Atisha came to study. It has been on UNESCO's World Heritage tentative list since 2009.
