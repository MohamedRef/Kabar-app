      ar: كم الإيجار في الشهر؟
      en: How much is the rent per month?
    answers: ['Berapa sewanya sebulan?', 'Berapa sewanya per bulan?', 'Sewanya berapa sebulan?', 'Sewanya berapa per bulan?', Berapa sewanya sebulan, Berapa sewanya per bulan, Sewanya berapa sebulan, 'Berapa harga sewanya sebulan?', 'Berapa harga sewanya per bulan?', 'Berapa sewa kamarnya sebulan?']
