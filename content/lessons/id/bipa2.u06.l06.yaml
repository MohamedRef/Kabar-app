language: id
title: Mencari kos
can_do:
  ar_eg: تسأل عن أوضة للإيجار.
  ar: أن تسأل عن غرفة للإيجار.
  en: Ask about a room for rent.
slides:
  - title: Ada kamar kosong?
    body:
      ar_eg: |
        «kos» = أوضة مأجّرة بالشهر، غالبًا في بيت فيه صاحبة البيت (ibu kos). الأسئلة اللي هتحتاجها:
        - Ada kamar kosong? = فيه أوضة فاضية؟
        - Berapa sewanya sebulan? = الإيجار كام في الشهر؟
        - Sudah termasuk listrik? = شامل الكهربا؟
        - Kamar mandinya di dalam atau di luar? = الحمّام جوّه ولا بره؟
        - Boleh saya lihat kamarnya? = ممكن أشوف الأوضة؟
        وصاحبة البيت هترد بـ silakan (اتفضل). إنت بتطلب بـ tolong / boleh، وهي بتعزم بـ silakan.
        في الشارع بيقولوا:
        - udah = sudah (خلاص، بقى)
      ar: |
        «kos» = غرفة تُستأجر شهريًا، غالبًا في بيت تقيم فيه المالكة (ibu kos). الأسئلة التي تحتاجها:
        - Ada kamar kosong? = هل توجد غرفة شاغرة؟
        - Berapa sewanya sebulan? = كم الإيجار في الشهر؟
        - Sudah termasuk listrik? = هل يشمل الكهرباء؟
        - Kamar mandinya di dalam atau di luar? = هل الحمّام داخل الغرفة أم خارجها؟
        - Boleh saya lihat kamarnya? = هل يمكنني رؤية الغرفة؟
        وستجيبك المالكة بـ silakan؛ فأنت تطلب بـ tolong / boleh، وهي تدعوك بـ silakan.
        في كلام الشارع:
        - udah = sudah (قد، بالفعل)
      en: |
        A "kos" is a room rented by the month, usually in a house where the landlady (ibu kos) lives. The questions you need:
        - Ada kamar kosong? = Is there a free room?
        - Berapa sewanya sebulan? = How much is the rent a month?
        - Sudah termasuk listrik? = Is electricity included?
        - Kamar mandinya di dalam atau di luar? = Is the bathroom inside or outside?
        - Boleh saya lihat kamarnya? = May I see the room?
        The landlady will answer with silakan: you ask with tolong / boleh, she offers with silakan.
        On the street:
        - udah = sudah (already)
    grammar: id.request.tolong-silakan
    examples:
      - text: Silakan lihat kamarnya, Pak.
        ar_eg: اتفضل شوف الأوضة يا أستاذ.
        ar: تفضّل انظر إلى الغرفة يا سيدي.
        en: Please have a look at the room, sir.
