schema: kabar.lesson/v1
id: bipa7.u08.l09
language: id
title: Kesenjangan
can_do:
  ar_eg: تقرا أرقام عن الفقر والأجور وتتكلّم عن الفجوة بين الناس.
  ar: أن تقرأ أرقامًا عن الفقر والأجور وتتحدّث عن الفجوة بين الناس.
  en: Read figures on poverty and wages and discuss inequality.
slides:
  - title: Kaya dan miskin
    body:
      ar_eg: |
        kesenjangan = الفجوة: بين الغني والفقير، أو بين جاوة وبابوا.
        garis kemiskinan = خط الفقر: اللي دخله أقل منه يتحسب فقير. kemiskinan ekstrem = فقر مدقع.
        bantuan sosial (bansos) = مساعدات الحكومة: فلوس أو رز.
        upah minimum = الحد الأدنى للأجور، كل محافظة ليها رقم.
        angkatan kerja = القوى العاملة. ناس كتير منها في sektor informal (القطاع غير الرسمي): بيّاعين الشارع وسوّاقين الأوجيك.
        pekerja lepas = شغّال حر، من غير عقد ثابت.
        - في الكلام: nggak = tidak، buat = untuk، iya = ya، online = daring.
      ar: |
        kesenjangan = الفجوة: بين الغنيّ والفقير، أو بين جاوة وبابوا.
        garis kemiskinan = خطّ الفقر، ومن دخله دونه يُعدّ فقيرًا. kemiskinan ekstrem = الفقر المدقع.
        bantuan sosial (bansos) = مساعدات الحكومة نقدًا أو أرزًّا.
        upah minimum = الحدّ الأدنى للأجور، ولكلّ مقاطعة رقمها.
        angkatan kerja = القوى العاملة، وكثير منها في sektor informal: باعة الرصيف وسائقو الأوجيك.
        pekerja lepas = عامل حرّ بلا عقد ثابت.
        - في الكلام اليومي: nggak = tidak، buat = untuk، iya = ya، online = daring.
      en: |
        kesenjangan = the gap: between rich and poor, or between Java and Papua.
        garis kemiskinan = the poverty line: earn less and you count as poor. kemiskinan ekstrem = extreme poverty.
        bantuan sosial (bansos) = government aid: cash or rice.
        upah minimum = the minimum wage; each province sets its own.
        angkatan kerja = the labour force. Many work in the sektor informal: street vendors, ojek drivers.
        pekerja lepas = a freelancer with no fixed contract.
        - In speech: nggak = tidak, buat = untuk, iya = ya, online = daring.
    examples:
      - text: Kesenjangan antara kota dan desa masih lebar.
        ar_eg: الفجوة بين المدينة والقرية لسه واسعة.
        ar: ما زالت الفجوة بين المدينة والريف واسعة.
        en: The gap between town and village is still wide.
      - text: Upah minimum di provinsi ini naik tahun depan.
        ar_eg: الحد الأدنى للأجور في المحافظة دي هيزيد السنة الجاية.
        ar: سيرتفع الحدّ الأدنى للأجور في هذه المقاطعة العام المقبل.
        en: The minimum wage in this province rises next year.
      - text: Banyak anak muda menjadi pekerja lepas.
        ar_eg: شباب كتير بقوا شغّالين فري لانس.
        ar: صار كثير من الشباب عمّالًا أحرارًا.
        en: Many young people become freelancers.
