  - id: e03
    type: listen
    text: Pedagang kaki lima dan tukang ojek bekerja di sektor informal.
    question:
      ar_eg: بيشتغلوا فين؟
      ar: أين يعملون؟
      en: Where do they work?
    options: [القطاع غير الرسمي, الحد الأدنى للأجور, خط الفقر]
    answer: 0
    meaning:
      ar_eg: بيّاعين الرصيف وسوّاقين الأوجيك بيشتغلوا في القطاع غير الرسمي.
      ar: يعمل باعة الأرصفة وسائقو الأوجيك في القطاع غير الرسمي.
      en: Street vendors and ojek drivers work in the informal sector.
    words: [sektor informal]
  - id: e04
    type: fill_blank
    sentence: Keluarga itu hidup di bawah ___.
    meaning:
      ar_eg: العيلة دي عايشة تحت ___.
      ar: تعيش تلك الأسرة تحت ___.
      en: That family lives below the ___.
    options: [garis kemiskinan, angkatan kerja, pekerja lepas]
    answers: [garis kemiskinan]
    words: [garis kemiskinan, angkatan kerja, pekerja lepas]
    explain:
      ar_eg: hidup di bawah garis kemiskinan = عايشين تحت خط الفقر. angkatan kerja = القوى العاملة وpekerja lepas = فريلانسر.
      ar: العيش تحت garis kemiskinan أي خط الفقر.
      en: Living below the garis kemiskinan (poverty line).
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بياخد «bantuan sosial»؟
      ar: مَن يتلقّى «bantuan sosial»؟
      en: Who receives 'bantuan sosial'?
    options: [Pemilik smelter., Keluarga miskin yang terdaftar., Semua turis.]
    answer: 1
    explain:
      ar_eg: المساعدات بتروح للعيلات الفقيرة المسجّلة.
      ar: تذهب المساعدات إلى الأسر الفقيرة المسجّلة.
      en: Aid goes to registered poor families.
    words: [bantuan sosial, kemiskinan ekstrem]
  - id: e06
    type: fill_blank
    sentence: Pemerintah ingin menghapus ___ sebelum tahun 2030.
    meaning:
      ar_eg: الحكومة عايزة تقضي على ___ قبل 2030.
      ar: تريد الحكومة القضاء على ___ قبل عام 2030.
      en: The government wants to end ___ before 2030.
    options: [kemiskinan ekstrem, upah minimum, kesenjangan]
    answers: [kemiskinan ekstrem]
    words: [kemiskinan ekstrem, upah minimum, kesenjangan]
    explain:
      ar_eg: الحكومة عايزة تقضي على kemiskinan ekstrem = الفقر المدقع. upah minimum = الحد الأدنى للأجور، وkesenjangan = فجوة.
      ar: تريد الحكومة القضاء على kemiskinan ekstrem أي الفقر المدقع.
      en: The target is ending kemiskinan ekstrem (extreme poverty).
  - id: e07
    type: build_sentence
    source:
      ar_eg: القوى العاملة بتزيد كل سنة.
      ar: تزداد القوى العاملة كلّ عام.
      en: The labour force grows every year.
    answer: Angkatan kerja bertambah setiap tahun.
    distractors: [sektor informal, pekerja lepas]
    words: [angkatan kerja]
    explain:
      ar_eg: Angkatan kerja (القوى العاملة) + bertambah (بتزيد) + setiap tahun. sektor informal وpekerja lepas زيادة.
      ar: Angkatan kerja bertambah setiap tahun. الآخران زائدان.
      en: Angkatan kerja + bertambah + setiap tahun. The other two are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Pekerja lepas tidak mendapat upah minimum atau asuransi.
    answers_meaning:
      ar_eg: [الشغّال الحر ما بياخدش الحد الأدنى للأجور ولا تأمين, الفري لانسر مالوش حد أدنى للأجر ولا تأمين]
      ar: [لا يحصل العامل الحرّ على الحدّ الأدنى للأجور ولا على تأمين, العامل الحرّ محروم من الحدّ الأدنى للأجور والتأمين]
      en: ['Freelancers don''t get the minimum wage or insurance', A freelance worker has no minimum wage or insurance]
    words: [pekerja lepas, upah minimum]
  - id: e09
    type: speaking
    text: Kesenjangan bisa dikurangi dengan pendidikan dan bantuan sosial.
    meaning:
      ar_eg: الفجوة ممكن تقلّ بالتعليم والمساعدات الاجتماعية.
      ar: يمكن تقليص الفجوة بالتعليم والمساعدات الاجتماعية.
      en: Inequality can be reduced with education and social aid.
    words: [kesenjangan, bantuan sosial]
  - id: e10
    type: multiple_choice
    question: Seorang penjual bakso keliling tanpa kontrak bekerja di ...
    options: [sektor informal, garis kemiskinan, upah minimum]
    answer: 0
    explain:
      ar_eg: البيّاع اللي بيلفّ من غير عقد = قطاع غير رسمي.
      ar: البائع الجوّال بلا عقد = قطاع غير رسمي.
      en: A roaming vendor with no contract = informal sector.
    words: [sektor informal, garis kemiskinan, upah minimum, angkatan kerja, kesenjangan, bantuan sosial]
dialogue:
  lines:
    - speaker: Kaka Benny
      text: Mohamed, aku ojek online. Tiap hari dapatnya beda-beda.
      ar_eg: يا محمد، أنا سوّاق أوجيك أونلاين. كل يوم باخد مبلغ شكل.
      ar: يا محمد، أنا سائق أوجيك عبر التطبيق، ويختلف دخلي كلّ يوم.
      en: Mohamed, I drive an app ojek. Every day I earn something different.
    - speaker: Mohamed
      text: Jadi Kaka termasuk pekerja lepas, ya?
      ar_eg: يبقى إنت شغّال حر يا كاكا؟
      ar: إذن أنت عامل حرّ يا كاكا؟
      en: So you're a freelancer, Kaka?
    - speaker: Kaka Benny
      text: Iya. Nggak ada upah minimum buat kami.
      ar_eg: أيوه. مفيش حد أدنى للأجر لينا.
      ar: نعم، لا حدّ أدنى للأجور لنا.
      en: Yes. There's no minimum wage for us.
    - speaker: Mohamed
      text: Banyak angkatan kerja di Sorong bekerja di sektor informal, kan?
      ar_eg: كتير من القوى العاملة في سورونج شغّالين في القطاع غير الرسمي، صح؟
      ar: كثير من القوى العاملة في سورونغ في القطاع غير الرسمي، أليس كذلك؟
      en: Much of Sorong's labour force is in the informal sector, isn't it?
    - speaker: Kaka Benny
      text: Betul. Kalau sakit, kami nggak dapat apa-apa. Itu kesenjangan yang nyata.
      ar_eg: مظبوط. لو عيّينا، ما بناخدش حاجة. دي فجوة حقيقية.
      ar: صحيح، فإن مرضنا لا نحصل على شيء، وهذه فجوة حقيقية.
      en: Right. If we get sick, we get nothing. That's real inequality.
