    ar: توصية
    en: recommendation
  - word: sasaran
    pos: noun
    ar_eg: الفئة المستهدفة / هدف
    ar: الفئة المستهدفة
    en: target (group)
  - word: ketentuan
    pos: noun
    ar_eg: بند / شرط
    ar: حكم / بند
    en: provision
