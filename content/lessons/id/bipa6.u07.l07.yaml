  - id: e03
    type: listen
    text: Dua napi kabur dari lembaga pemasyarakatan semalam.
    question:
      ar_eg: مين اللي هرب؟
      ar: من الذي فرّ؟
      en: Who escaped?
    options: [مسجونين, قضاة, محامين]
    answer: 0
    meaning:
      ar_eg: اتنين مساجين هربوا من السجن امبارح بالليل.
      ar: فرّ سجينان من السجن الليلة الماضية.
      en: Two inmates escaped from prison last night.
    words: [napi]
  - id: e04
    type: fill_blank
    sentence: Untuk mendaftar sekolah, anak harus membawa ___ kelahiran.
    meaning:
      ar_eg: عشان يتقدم للمدرسة، الطفل لازم يجيب ___ الميلاد.
      ar: للتسجيل في المدرسة يجب إحضار ___ الميلاد.
      en: To enrol at school, a child must bring a birth ___.
    options: [akta, dakwaan, borgol]
    answers: [akta]
    words: [akta, dakwaan, borgol]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيتهم المتهم في المحكمة نيابة عن الدولة؟
      ar: من يتّهم المتهم في المحكمة باسم الدولة؟
      en: Who accuses the defendant in court on behalf of the state?
    options: [napi, penuntut, stempel]
    answer: 1
    explain:
      ar_eg: penuntut umum = النيابة العامة.
      ar: penuntut umum = النيابة العامة.
      en: penuntut umum = public prosecutor.
    words: [penuntut, napi, stempel]
  - id: e06
    type: fill_blank
    sentence: Surat itu tidak sah karena tidak ada ___ kantor.
    meaning:
      ar_eg: الجواب ده مش رسمي عشان مفيهوش ___ المكتب.
      ar: الرسالة غير رسمية لعدم وجود ___ المكتب.
      en: 'The letter isn''t valid: it has no office ___.'
    options: [stempel, napi, memalsukan]
    answers: [stempel]
    words: [stempel, napi, memalsukan]
  - id: e07
    type: multiple_choice
    question: Polisi memasang ___ di tangan pencuri itu.
    options: [akta, dakwaan, borgol]
