    words: [borgol, akta, dakwaan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: النيابة قرت لايحة الاتهام في المحكمة.
      ar: تلا المدّعي لائحة الاتهام في المحكمة.
      en: The prosecutor read the charge in court.
    answer: Penuntut membacakan dakwaan di pengadilan.
    distractors: [borgol, stempel]
    words: [penuntut, dakwaan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Pegawai itu diadili karena memalsukan stempel.
    answers_meaning:
      ar_eg: [الموظف ده اتحاكم عشان زوّر ختم, الموظف اتحاكم بتهمة تزوير ختم]
      ar: [حوكم ذلك الموظف لتزويره ختمًا, حوكم الموظف بتهمة تزوير ختم]
      en: [That employee was tried for forging a stamp, The employee was tried for forging a seal]
    words: [diadili, memalsukan, stempel]
  - id: e10
    type: speaking
    text: Siapa pun yang memalsukan akta akan diadili.
    meaning:
      ar_eg: أي حد يزوّر عقد هيتحاكم.
      ar: كل من يزوّر وثيقة رسمية سيُحاكَم.
      en: Anyone who forges a deed will be tried.
    words: [memalsukan, akta, diadili]
dialogue:
  lines:
    - speaker: Kak Intan
      text: Udah baca berita ini? Pegawai kantor tanah diadili kemarin.
      ar_eg: قريت الخبر ده؟ موظف في مكتب الأراضي اتحاكم امبارح.
      ar: هل قرأت هذا الخبر؟ حوكم موظف في مكتب الأراضي أمس.
      en: Read this? A land-office employee was tried yesterday.
    - speaker: Mohamed
      text: Apa dakwaannya?
      ar_eg: إيه التهمة؟
      ar: ما التهمة؟
      en: What's the charge?
    - speaker: Kak Intan
      text: Memalsukan akta tanah dan stempel. Penuntut meminta lima tahun.
      ar_eg: تزوير عقود أراضي وختم. النيابة طالبة خمس سنين.
      ar: تزوير وثائق أراضٍ وختم. طلبت النيابة خمس سنوات.
      en: Forging land deeds and a stamp. The prosecutor wants five years.
    - speaker: Mohamed
      text: Di foto ini dia sedih.
      ar_eg: في الصورة دي هو زعلان.
      ar: يبدو حزينًا في هذه الصورة.
      en: He looks sad in this photo.
    - speaker: Kak Intan
      text: Kalau terbukti, dia jadi napi. Uangnya juga harus dikembalikan.
      ar_eg: لو اتثبت عليه، هيبقى مسجون. والفلوس كمان لازم ترجع.
      ar: إن ثبتت التهمة صار سجينًا، ووجب ردّ المال أيضًا.
      en: If it's proven, he'll be an inmate. And the money must be returned too.
