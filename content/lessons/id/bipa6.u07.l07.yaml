schema: kabar.lesson/v1
id: bipa6.u07.l07
language: id
title: Kasus akta palsu
can_do:
  ar_eg: 'تتابع خبر قضية تزوير في المحكمة: الاتهام والنيابة والكلبشات والمسجون.'
  ar: 'أن تتابع خبر قضية تزوير أمام المحكمة: الاتهام والادعاء والأصفاد والسجين.'
  en: 'Follow a news story about a forgery trial: the charge, the prosecutor, handcuffs and the inmate.'
slides:
  - title: Berita pengadilan
    body:
      ar_eg: |
        خبر (مكتوب للدرس): Seorang pegawai diadili karena memalsukan akta tanah dan stempel kantor.
        diadili = اتحاكم (من adil ← عدل). dakwaan = لايحة الاتهام. penuntut = المدّعي (penuntut umum = النيابة).
        memalsukan = يزوّر (من palsu). akta = عقد رسمي، شهادة (akta tanah، akta kelahiran). stempel = ختم.
        borgol = كلبشات. napi = مسجون (اختصار narapidana).
        - في الشارع: udah = sudah (خلاص / بالفعل).
      ar: |
        خبر (مكتوب للدرس): Seorang pegawai diadili karena memalsukan akta tanah dan stempel kantor.
        diadili = حوكم (من adil ← عدل). dakwaan = لائحة الاتهام. penuntut = المدّعي (penuntut umum = النيابة العامة).
        memalsukan = يزوّر (من palsu). akta = وثيقة رسمية، عقد (akta tanah، akta kelahiran). stempel = ختم.
        borgol = أصفاد. napi = سجين (اختصار narapidana).
        - في كلام الشارع: udah = sudah (قد / بالفعل).
      en: |
        News (written for the lesson): Seorang pegawai diadili karena memalsukan akta tanah dan stempel kantor.
        diadili = to be tried (from adil ← Arabic عدل). dakwaan = indictment, charge. penuntut = prosecutor (penuntut umum = public prosecutor).
        memalsukan = to forge (from palsu). akta = official deed, certificate (akta tanah, akta kelahiran). stempel = stamp, seal.
        borgol = handcuffs. napi = inmate (short for narapidana).
        - On the street: udah = sudah (already).
    examples:
      - text: Dia diadili karena memalsukan akta tanah.
        ar_eg: اتحاكم عشان زوّر عقد أرض.
        ar: حوكم لأنه زوّر وثيقة أرض.
        en: He was tried for forging a land deed.
      - text: Penuntut umum membacakan dakwaan.
        ar_eg: النيابة قرت لايحة الاتهام.
        ar: تلت النيابة العامة لائحة الاتهام.
        en: The public prosecutor read out the charge.
      - text: Terdakwa datang dengan tangan diborgol.
        ar_eg: المتهم جه وإيديه في الكلبشات.
        ar: جاء المتهم مكبّل اليدين بالأصفاد.
        en: The defendant arrived in handcuffs.
