dialogue:
  lines:
    - speaker: Penjual
      text: Mari, Mas! Buahnya manis-manis!
      ar_eg: اتفضل يا أستاذ! الفاكهة مسكّرة!
      ar: تفضّل يا سيدي! الفاكهة حلوة!
      en: Come on in! The fruit is sweet!
    - speaker: Mohamed
      text: Mangganya berapa sekilo, Bu?
      ar_eg: المانجة بكام الكيلو يا ست؟
      ar: بكم كيلو المانجو يا سيدتي؟
      en: How much a kilo are the mangoes?
    - speaker: Penjual
      text: Dua puluh ribu. Jeruknya lima belas ribu.
      ar_eg: بعشرين ألف. والبرتقال بخمستاشر ألف.
      ar: بعشرين ألفًا، والبرتقال بخمسة عشر ألفًا.
      en: Twenty thousand. The oranges are fifteen thousand.
    - speaker: Mohamed
      text: Boleh kurang? Saya beli dua kilo mangga.
      ar_eg: ممكن تنزلي؟ هاخد كيلوين مانجة.
      ar: هل تخفّضين؟ سأشتري كيلوين من المانجو.
      en: Can you go lower? I'll take two kilos of mangoes.
    - speaker: Penjual
      text: Boleh, tiga puluh lima ribu. Mau pisang juga?
      ar_eg: ماشي، بخمسة وتلاتين ألف. عايز موز كمان؟
      ar: حسنًا، بخمسة وثلاثين ألفًا. أتريد موزًا أيضًا؟
      en: OK, thirty-five thousand. Want bananas too?
    - speaker: Mohamed
      text: Ya, dan sebuah semangka!
      ar_eg: أيوه، وبطيخة!
      ar: نعم، وبطّيخة!
      en: Yes, and a watermelon!
