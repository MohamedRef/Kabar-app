  - id: e03
    type: listen
    text: Satu es jeruk dan sebotol air satu liter.
    question:
      ar_eg: طلب إيه؟
      ar: ماذا طلب؟
      en: What did he order?
    options: [عصير برتقان وإزازة مية لتر, مانجة وخيار, جزر وبرتقان]
    answer: 0
    meaning:
      ar_eg: واحد عصير برتقان بتلج وإزازة مية لتر.
      ar: عصير برتقال مثلّج وزجاجة ماء لتر.
      en: One iced orange and a one-litre bottle of water.
    words: [jeruk, liter]
  - id: e04
    type: fill_blank
    sentence: Mangga ini warnanya ___ dan manis.
    meaning:
      ar_eg: المانجة دي لونها ___ وطعمها مسكّر.
      ar: لون هذه المانجو ___ وطعمها حلو.
      en: This mango is ___ and tastes sweet.
    options: [kuning, oranye, segar]
    answers: [kuning]
    words: [kuning, oranye, segar]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حاجة برتقاني وطويلة والأرانب بتحبها.
      ar: شيء برتقالي طويل تحبّه الأرانب.
      en: Something long and orange that rabbits love.
    options: [wortel, timun, mangga]
    answer: 0
    explain:
      ar_eg: wortel = جزر. timun خيار، وmangga مانجة.
      ar: wortel جزر، أما timun فخيار وmangga مانجو.
      en: wortel = carrot; timun is a cucumber and mangga a mango.
    words: [wortel, timun, mangga]
  - id: e06
    type: fill_blank
    sentence: Timun ini masih ___. Baru datang pagi ini.
    meaning:
      ar_eg: الخيار ده لسه ___. لسه واصل الصبح.
      ar: هذا الخيار ما زال ___، وصل هذا الصباح.
      en: This cucumber is still ___. It came in this morning.
    options: [segar, kuning, liter]
    answers: [segar]
    words: [segar, timun, liter]
  - id: e07
    type: build_sentence
    source:
      ar_eg: عايز إزازة مية لتر ونص.
      ar: أريد زجاجة ماء لترًا ونصفًا.
      en: I'd like a one-and-a-half-litre bottle of water.
    answer: Saya minta sebotol air satu setengah liter.
    distractors: [wortel, oranye]
    words: [liter]
  - id: e08
    type: translate
    direction: from_target
    source_text: Jeruk ini oranye dan segar.
    answers_meaning:
      ar_eg: [البرتقان ده برتقاني وطازة, البرتقانة دي لونها برتقاني وطازة]
      ar: [هذا البرتقال برتقالي وطازج, هذه البرتقالة برتقالية اللون وطازجة]
      en: [This orange is orange and fresh, These oranges are orange and fresh]
    words: [jeruk, oranye, segar]
  - id: e09
    type: speaking
    text: Saya mau sekilo mangga dan setengah kilo wortel.
    meaning:
      ar_eg: عايز كيلو مانجة ونص كيلو جزر.
      ar: أريد كيلو مانجو ونصف كيلو جزر.
      en: I'd like a kilo of mangoes and half a kilo of carrots.
    words: [mangga, wortel]
  - id: e10
    type: multiple_choice
    question: Wortel warnanya ___.
    options: [oranye, kuning, segar]
    answer: 0
    explain:
      ar_eg: 'الجزر برتقاني: oranye.'
      ar: 'الجزر برتقالي: oranye.'
      en: 'Carrots are orange: oranye.'
    words: [oranye, kuning, wortel]
dialogue:
  lines:
    - speaker: Penjual
      text: Mau minum apa, Mas?
      ar_eg: تشرب إيه يا أستاذ؟
      ar: ماذا تشرب يا سيدي؟
      en: What would you like to drink?
    - speaker: Mohamed
      text: Es jeruk satu, Bu. Segar, ya?
      ar_eg: واحد عصير برتقان يا ست. منعش، صح؟
      ar: عصير برتقال واحد يا سيدتي. منعش، أليس كذلك؟
      en: One iced orange, please. Refreshing, right?
    - speaker: Penjual
      text: Segar banget! Mau air juga? Ada botol satu liter.
      ar_eg: منعش جدًا! عايز مية كمان؟ فيه إزازة لتر.
      ar: منعش جدًا! أتريد ماءً أيضًا؟ لدينا زجاجة لتر.
      en: Very! Want water too? There's a one-litre bottle.
    - speaker: Mohamed
      text: Ya. Dan mangga kuning itu berapa?
      ar_eg: أيوه. والمانجة الصفرا دي بكام؟
      ar: نعم. وبكم تلك المانجو الصفراء؟
      en: Yes. And how much is that yellow mango?
    - speaker: Penjual
      text: Sepuluh ribu. Timun dan wortel ini gratis!
      ar_eg: بعشر تلاف. والخيار والجزر دول ببلاش!
      ar: بعشرة آلاف، والخيار والجزر مجانًا!
      en: Ten thousand. The cucumber and carrots are free!
    - speaker: Mohamed
      text: Terima kasih banyak, Bu!
      ar_eg: شكرًا جزيلًا يا ست!
      ar: شكرًا جزيلًا يا سيدتي!
      en: Thank you so much!
