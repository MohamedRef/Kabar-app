schema: kabar.lesson/v1
id: bipa2.u04.l06
language: id
title: Apel, jeruk, mangga
can_do:
  ar_eg: تسمّي الفاكهة وتشتريها بالكيلو والحبّة في السوق.
  ar: أن تسمّي الفواكه وتشتريها بالكيلو والحبّة في السوق.
  en: Name fruit and buy it by the kilo or piece at the market.
slides:
  - title: Buah
    body:
      ar_eg: |
        apel = تفاح، jeruk = برتقال (وكل الموالح)، pisang = موز (pisang goreng = موز مقلي، أكلة مشهورة)، mangga = مانجة.
        semangka = بطيخ، pepaya = بابايا، nanas = أناناس.
        خلي بالك: anggur = عنب. وفي إندونيسيا anggur كمان اسم للنبيذ، فلو عايز العصير قول jus anggur.
        الحساب: sekilo mangga، sebuah semangka، dua ikat pisang.
      ar: |
        apel = تفّاح، jeruk = برتقال (وسائر الحمضيات)، pisang = موز (pisang goreng = موز مقلي، طعام شهير)، mangga = مانجو.
        semangka = بطّيخ، pepaya = بابايا، nanas = أناناس.
        انتبه: anggur = عنب، وقد تعني النبيذ أيضًا، فإن أردت العصير فقل jus anggur.
        وللعدّ: sekilo mangga، sebuah semangka، dua ikat pisang.
      en: |
        apel = apple, jeruk = orange (any citrus), pisang = banana (pisang goreng, fried banana, is a classic), mangga = mango.
        semangka = watermelon, pepaya = papaya, nanas = pineapple.
        Careful: anggur = grapes, but it can also mean wine; for juice say jus anggur.
        Counting: sekilo mangga, sebuah semangka, dua ikat pisang.
    examples:
      - text: Satu kilo mangga berapa, Bu?
        ar_eg: كيلو المانجة بكام يا ست؟
        ar: بكم كيلو المانجو يا سيدتي؟
        en: How much is a kilo of mangoes?
      - text: Pisang ini enak sekali!
        ar_eg: الموز ده حلو أوي!
        ar: هذا الموز لذيذ جدًا!
        en: This banana is so good!
      - text: Anggur di Indonesia mahal.
        ar_eg: العنب في إندونيسيا غالي.
        ar: العنب غالٍ في إندونيسيا.
        en: Grapes are expensive in Indonesia.
