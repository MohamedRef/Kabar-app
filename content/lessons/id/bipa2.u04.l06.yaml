schema: kabar.lesson/v1
id: bipa2.u04.l06
language: id
title: Es jeruk di warung
can_do:
  ar_eg: 'تطلب في وارونج: عصير برتقان وإزازة لتر، ومانجة صفرا وخيار وجزر طازة.'
  ar: 'أن تطلب في وارونج: عصير برتقال وزجاجة لتر، ومانجو صفراء وخيارًا وجزرًا طازجًا.'
  en: 'Order at a warung: iced orange and a litre bottle, a yellow mango, fresh cucumber and carrot.'
slides:
  - title: Di warung
    body:
      ar_eg: |
        jeruk = برتقان (وكل الموالح): es jeruk = عصير برتقان بتلج، أشهر مشروب في الوارونج.
        mangga = مانجة. timun = خيار، wortel = جزر (من الهولندي).
        kuning = أصفر، oranye = برتقاني. segar = طازة ومنعش: Es jeruknya segar!
        liter = لتر: sebotol air satu liter.
        في الشارع بيقولوا:
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
      ar: |
        jeruk = برتقال (وسائر الحمضيات): es jeruk = عصير برتقال مثلّج، أشهر مشروب في الوارونج.
        mangga = مانجو. timun = خيار، wortel = جزر (من الهولندية).
        kuning = أصفر، oranye = برتقالي. segar = طازج ومنعش: Es jeruknya segar!
        liter = لتر: sebotol air satu liter.
        في كلام الشارع:
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
      en: |
        jeruk = orange (any citrus): es jeruk, iced orange, is the classic warung drink.
        mangga = mango. timun = cucumber, wortel = carrot (from Dutch).
        kuning = yellow, oranye = orange (colour). segar = fresh, refreshing: Es jeruknya segar!
        liter = litre: sebotol air satu liter.
        On the street:
        - banget = sekali (very), after the adjective just like sekali
    examples:
      - text: Es jeruk ini segar sekali!
        ar_eg: عصير البرتقان ده منعش أوي!
        ar: عصير البرتقال هذا منعش جدًا!
        en: This iced orange is so refreshing!
      - text: Mangganya kuning dan manis.
        ar_eg: المانجة صفرا ومسكّرة.
        ar: المانجو صفراء وحلوة.
        en: The mango is yellow and sweet.
      - text: Saya minta sebotol air satu liter.
        ar_eg: عايز إزازة مية لتر لو سمحت.
        ar: أريد زجاجة ماء لترًا من فضلك.
        en: A one-litre bottle of water, please.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jeruk
        ar_eg: برتقان
        ar: برتقال
        en: orange
      - text: mangga
        ar_eg: مانجة
        ar: مانجو
        en: mango
      - text: timun
        ar_eg: خيار
        ar: خيار
        en: cucumber
      - text: wortel
        ar_eg: جزر
        ar: جزر
        en: carrot
    words: [jeruk, mangga, timun, wortel]
  - id: e02
    type: match_pairs
    pairs:
      - text: kuning
        ar_eg: أصفر
        ar: أصفر
        en: yellow
      - text: oranye
        ar_eg: برتقاني
        ar: برتقالي
        en: orange (colour)
      - text: segar
        ar_eg: طازة، منعش
        ar: طازج، منعش
        en: fresh
      - text: liter
        ar_eg: لتر
        ar: لتر
        en: litre
