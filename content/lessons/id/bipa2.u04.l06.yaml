      ar: مساومة؟ حسنًا إذن، لا بأس.
      en: Haggling? OK then, sure.
    words: [tawar-menawar, ya sudah, boleh]
  - id: e10
    type: speaking
    text: Aduh, terlalu mahal! Boleh kurang, Bu? — Ya sudah, boleh.
    meaning:
      ar_eg: يا لهوي، غالي زيادة! ممكن تنزلي يا حاجة؟ — خلاص ماشي، ينفع.
      ar: آه، غالٍ جدًا! هل يمكن التخفيض يا سيدتي؟ — حسنًا إذن، لا بأس.
      en: Oh no, too expensive! Can you go lower, ma'am? — OK then, sure.
    words: [aduh, terlalu, boleh kurang, ya sudah]
dialogue:
  title: Tawar-menawar di Pasar Seni Sukawati
  lines:
    - speaker: Mohamed
      text: Berapa harga kain ini, Bu?
      ar_eg: القماشة دي بكام يا مدام؟
      ar: كم ثمن هذا القماش يا سيدتي؟
      en: How much is this cloth, ma'am?
    - speaker: Bu Nyoman
      text: Dua ratus ribu, Pak.
      ar_eg: بميتين ألف يا أستاذ.
      ar: بمئتي ألف يا سيدي.
      en: Two hundred thousand, sir.
    - speaker: Mohamed
      text: Wah, terlalu mahal. Seratus ribu, boleh?
      ar_eg: يا خبر، غالي زيادة. بمية ألف، ينفع؟
      ar: آه، إنه غالٍ جدًا. بمئة ألف، هل يمكن؟
      en: Oh, too expensive. A hundred thousand, OK?
    - speaker: Bu Nyoman
      text: Seratus lima puluh. Itu harga pas.
      ar_eg: مية وخمسين. ده آخر سعر.
      ar: مئة وخمسون. هذا السعر النهائي.
      en: A hundred and fifty. That's my final price.
    - speaker: Mohamed
      text: Seratus tiga puluh ribu, dan saya beli dua lembar.
      ar_eg: مية وتلاتين ألف، وهاخد حتتين.
      ar: مئة وثلاثون ألفًا، وسأشتري قطعتين.
      en: A hundred and thirty thousand, and I'll take two pieces.
    - speaker: Bu Nyoman
      text: Aduh, saya rugi! Ya sudah, boleh. Jangan lupa datang lagi, ya!
      ar_eg: يا لهوي، كده أنا خسرانة! خلاص ماشي. ماتنساش تيجي تاني!
      ar: آه، سأخسر! حسنًا، موافقة. لا تنسَ أن تعود مرة أخرى!
      en: Oh dear, I'm losing money! OK then, fine. Don't forget to come again!
