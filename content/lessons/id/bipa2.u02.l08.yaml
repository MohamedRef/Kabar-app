schema: kabar.lesson/v1
id: bipa2.u02.l08
language: id
title: Tukang dan insinyur
can_do:
  ar_eg: تتكلم عن الصنايعية والميكانيكي والمهندس، والعدّة والمكن، وتطلب كشف على حاجة.
  ar: أن تتحدث عن الحِرفيين والميكانيكي والمهندس، والأدوات والآلات، وتطلب فحص شيء.
  en: Talk about tradespeople, mechanics and engineers, tools and machines, and ask for a check.
slides:
  - title: Tukang
    body:
      ar_eg: |
        tukang = صنايعي: tukang kayu (نجار)، tukang cukur (حلاق)، tukang ojek (سواق أوجيك).
        montir = ميكانيكي. insinyur = مهندس، وarsitek = مهندس معماري.
        mesin = ماكينة أو موتور، وalat = عدّة أو أداة. gudang = مخزن.
        periksa = يكشف على، يفحص (والرسمي memeriksa).
      ar: |
        tukang = الحِرفي: tukang kayu (نجّار)، tukang cukur (حلّاق)، tukang ojek (سائق أوجيك).
        montir = ميكانيكي. insinyur = مهندس، وarsitek = مهندس معماري.
        mesin = آلة أو محرّك، وalat = أداة. gudang = مخزن.
        periksa = يفحص (والفصيح memeriksa).
      en: |
        tukang = tradesperson: tukang kayu (carpenter), tukang cukur (barber), tukang ojek (ojek driver).
        montir = mechanic. insinyur = engineer, arsitek = architect.
        mesin = machine, engine; alat = tool. gudang = storeroom, warehouse.
        periksa = check, examine (formal memeriksa).
    examples:
      - text: Ayah Raka tukang kayu.
        ar_eg: أبو رَكا نجار.
        ar: أبو راكا نجّار.
        en: Raka's father is a carpenter.
      - text: Montir itu periksa mesin mobil.
        ar_eg: الميكانيكي بيكشف على موتور العربية.
        ar: يفحص الميكانيكي محرّك السيارة.
        en: The mechanic is checking the car's engine.
      - text: Arsitek itu orang Bali.
        ar_eg: المهندس المعماري ده من بالي.
        ar: ذلك المهندس المعماري من بالي.
        en: That architect is Balinese.
