    meaning:
      ar_eg: الكرسي ده من أبو رَكا. هو ___ خشب (نجار).
      ar: هذا الكرسي من أبي راكا، فهو ___ خشب (نجّار).
      en: This chair is from Raka's dad. He's a ___ (carpenter).
    options: [tukang, insinyur, gudang]
    answers: [tukang]
    words: [tukang, insinyur, gudang]
