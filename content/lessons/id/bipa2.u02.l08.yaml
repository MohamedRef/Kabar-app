dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, motor saya tidak bisa jalan.
      ar_eg: يا أسطى، الموتوسيكل بتاعي مش راضي يمشي.
      ar: يا سيدي، درّاجتي النارية لا تسير.
      en: My motorbike won't go.
    - speaker: Montir
      text: Saya periksa, ya.
      ar_eg: هكشف عليه.
      ar: سأفحصها.
      en: I'll check it.
    - speaker: Montir
      text: Mesinnya panas sekali.
      ar_eg: الموتور سخن أوي.
      ar: المحرّك ساخن جدًا.
      en: The engine is very hot.
    - speaker: Mohamed
      text: Bisa hari ini, Pak?
      ar_eg: ينفع النهارده يا أسطى؟
      ar: هل يمكن إصلاحها اليوم؟
      en: Can you do it today?
    - speaker: Montir
      text: Bisa. Alat saya ada di gudang.
      ar_eg: ينفع. العدّة بتاعتي في المخزن.
      ar: نعم، أدواتي في المخزن.
      en: Yes. My tools are in the storeroom.
    - speaker: Mohamed
      text: Terima kasih, Pak. Saya datang lagi jam lima.
      ar_eg: شكرًا يا أسطى. هرجع الساعة خمسة.
      ar: شكرًا، سأعود في الخامسة.
      en: Thank you. I'll come back at five.
