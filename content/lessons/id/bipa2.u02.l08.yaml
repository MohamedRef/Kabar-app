      ar: مَن يحتاج؟
      en: Who does he need?
    options: [ميكانيكي, مهندس معماري, نجار]
    answer: 0
    meaning:
      ar_eg: عربيتي مش راضية تمشي. محتاج ميكانيكي.
      ar: سيارتي لا تسير، وأحتاج إلى ميكانيكي.
      en: My car won't go. I need a mechanic.
    words: [montir]
  - id: e04
    type: fill_blank
