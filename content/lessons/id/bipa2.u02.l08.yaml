  - id: e08
    type: translate
    direction: from_target
    source_text: Kakak saya insinyur mesin.
    answers_meaning:
      ar_eg: [أخويا الكبير مهندس ميكانيكا, أختي الكبيرة مهندسة ميكانيكا]
      ar: [أخي الأكبر مهندس ميكانيكي, أختي الكبرى مهندسة ميكانيكية]
      en: [My older brother is a mechanical engineer, My older sister is a mechanical engineer]
