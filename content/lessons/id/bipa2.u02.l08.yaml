      ar: يرسم البيوت والمباني قبل بنائها. ما عمله؟
      en: He draws houses and buildings before they're built. His job?
    options: [arsitek, montir, tukang]
    answer: 0
    explain:
      ar_eg: arsitek = مهندس معماري.
      ar: arsitek = مهندس معماري.
      en: arsitek = architect.
    words: [arsitek, montir, tukang]
  - id: e06
