schema: kabar.lesson/v1
id: bipa2.u02.l08
language: id
title: Puasa di kantor
can_do:
  ar_eg: 'تتكلم عن الصيام في الشغل: السحور والمغرب والأدان والفطار على تمر.'
  ar: 'أن تتحدث عن الصيام في العمل: السحور والمغرب والأذان والإفطار على التمر.'
  en: 'Talk about fasting at work: sahur, sunset, the call to prayer and breaking the fast with dates.'
slides:
  - title: Bulan puasa
    body:
      ar_eg: |
        puasa = صيام، وكمان «صايم»: Saya puasa = أنا صايم.
        sahur = سحور، berbuka = يفطر (berbuka puasa، وفي الكلام buka puasa).
        magrib = المغرب، azan = الأدان: Azan magrib! = أدّن المغرب!
        kurma = بلح أو تمر، takjil = الحاجة الخفيفة اللي بتفطر عليها، gorengan = حاجات مقلية (زي الطعمية والبطاطس).
      ar: |
        puasa = صيام، وأيضًا «صائم»: Saya puasa = أنا صائم.
        sahur = سحور، berbuka = يُفطر (berbuka puasa، وفي الكلام اليومي buka puasa).
        magrib = المغرب، azan = الأذان: Azan magrib! = أذّن المغرب!
        kurma = تمر، takjil = ما يُفطر عليه الصائم من طعام خفيف، gorengan = مقليّات.
      en: |
        puasa = fasting, and also "fasting" as a state: Saya puasa = I'm fasting.
        sahur = the pre-dawn meal, berbuka = to break the fast (berbuka puasa; in speech, buka puasa).
        magrib = sunset (prayer), azan = call to prayer: Azan magrib! = It's the sunset call!
        kurma = dates, takjil = light snacks to break the fast, gorengan = fried snacks.
    examples:
      - text: Saya puasa, tapi saya tetap kerja.
        ar_eg: أنا صايم، بس برضه بشتغل.
        ar: أنا صائم، لكني أعمل كالعادة.
        en: I'm fasting, but I still work.
      - text: Kami makan sahur jam empat pagi.
        ar_eg: بنتسحر الساعة أربعة الفجر.
        ar: نتسحّر في الرابعة فجرًا.
        en: We eat sahur at four in the morning.
      - text: Kalau azan magrib, kita berbuka dengan kurma.
        ar_eg: لما المغرب يأدّن، بنفطر على تمر.
        ar: عندما يؤذّن المغرب نُفطر على التمر.
        en: When the sunset call comes, we break the fast with dates.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: puasa
        ar_eg: صيام
        ar: صيام
        en: fasting
      - text: sahur
        ar_eg: سحور
        ar: سحور
        en: pre-dawn meal
      - text: magrib
        ar_eg: المغرب
        ar: المغرب
        en: sunset (prayer)
      - text: azan
        ar_eg: أدان
        ar: أذان
        en: call to prayer
    words: [puasa, sahur, magrib, azan]
  - id: e02
    type: match_pairs
    pairs:
      - text: kurma
        ar_eg: تمر
        ar: تمر
        en: dates
      - text: takjil
        ar_eg: حاجة خفيفة للفطار
        ar: طعام الإفطار الخفيف
        en: iftar snacks
      - text: gorengan
        ar_eg: حاجات مقلية
        ar: مقليّات
        en: fried snacks
      - text: berbuka
        ar_eg: يفطر
        ar: يُفطر
        en: break the fast
    words: [kurma, takjil, gorengan, berbuka]
  - id: e03
    type: listen
    text: Sudah azan magrib. Kita berbuka sekarang!
    question:
      ar_eg: حصل إيه؟
      ar: ماذا حدث؟
      en: What has happened?
    options: [أدّن المغرب, لسه الضهر, وقت السحور]
    answer: 0
    meaning:
      ar_eg: أدّن المغرب. هنفطر دلوقتي!
      ar: أذّن المغرب. سنُفطر الآن!
      en: The sunset call has come. We break the fast now!
    words: [azan, magrib, berbuka]
  - id: e04
    type: fill_blank
    sentence: Jam empat pagi saya bangun untuk makan ___.
    meaning:
      ar_eg: الساعة أربعة الفجر بصحى عشان آكل ___.
      ar: في الرابعة فجرًا أستيقظ لآكل ___.
      en: At four in the morning I get up to eat ___.
    options: [sahur, takjil, magrib]
    answers: [sahur]
    words: [sahur, takjil, magrib]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أكلة خفيفة بتفطر عليها في رمضان اسمها إيه؟
      ar: ما اسم الطعام الخفيف الذي يُفطر عليه الصائم؟
      en: What do you call the light snacks you break the fast with?
    options: [takjil, sahur, azan]
    answer: 0
    explain:
      ar_eg: takjil = الحاجة الخفيفة اللي بتفطر عليها. sahur أكلة الفجر، وazan الأدان.
      ar: takjil = طعام الإفطار الخفيف. sahur وجبة الفجر وazan الأذان.
      en: takjil = snacks to break the fast. sahur is the pre-dawn meal; azan is the call.
    words: [takjil, sahur, azan]
  - id: e06
    type: fill_blank
    sentence: 'Saya mau beli ___ untuk berbuka: kurma dan es teh.'
    meaning:
      ar_eg: 'عايز أشتري ___ للفطار: تمر وشاي ساقع.'
      ar: 'أريد شراء ___ للإفطار: تمر وشاي مثلّج.'
      en: 'I want to buy ___ to break the fast: dates and iced tea.'
    options: [takjil, sahur, magrib]
    answers: [takjil]
    words: [takjil, kurma, berbuka]
  - id: e07
    type: build_sentence
    source:
      ar_eg: بنفطر على تمر ومية.
      ar: نُفطر على التمر والماء.
      en: We break the fast with dates and water.
    answer: Kami berbuka dengan kurma dan air.
    distractors: [sahur, azan]
    words: [berbuka, kurma]
  - id: e08
    type: translate
    direction: from_target
    source_text: Saya puasa, tapi teman saya makan gorengan.
    answers_meaning:
      ar_eg: [أنا صايم، بس صاحبي بياكل مقليات, أنا صايم لكن صاحبي بياكل حاجات مقلية]
      ar: [أنا صائم، لكن صديقي يأكل المقليات]
      en: ['I''m fasting, but my friend is eating fried snacks', I am fasting but my friend eats fried snacks]
    words: [puasa, gorengan]
  - id: e09
    type: speaking
    text: Selamat berbuka puasa!
    meaning:
      ar_eg: فطار سعيد! (بتتقال وقت المغرب)
      ar: إفطارًا شهيًّا! (تُقال عند المغرب)
      en: Enjoy breaking your fast! (said at sunset)
    words: [berbuka, puasa]
  - id: e10
    type: multiple_choice
    question: Kurma, gorengan, kolak... semua ini ___.
    options: [takjil, azan, magrib]
    answer: 0
    explain:
      ar_eg: 'التمر والمقليات والكولاك كلها حاجات بنفطر عليها: takjil.'
      ar: 'التمر والمقليات والكولاك كلها مما يُفطر عليه: takjil.'
      en: Dates, fried snacks and kolak are all takjil.
    words: [takjil, kurma, gorengan]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, kamu nggak makan siang?
      ar_eg: يا محمد، مش هتتغدى؟
      ar: يا محمد، ألن تتناول الغداء؟
      en: Mohamed, aren't you having lunch?
    - speaker: Mohamed
      text: Nggak, Luh. Aku puasa. Tadi aku makan sahur jam empat.
      ar_eg: لأ يا لوه. أنا صايم. اتسحرت الساعة أربعة.
      ar: لا يا لوه، أنا صائم. تسحّرت في الرابعة.
      en: No, Luh. I'm fasting. I had sahur at four.
    - speaker: Ni Luh
      text: Wah, kuat banget! Kamu buka puasa jam berapa?
      ar_eg: واو، جامد أوي! بتفطر الساعة كام؟
      ar: رائع، يا لقوّتك! متى تُفطر؟
      en: Wow, that's tough! What time do you break the fast?
    - speaker: Mohamed
      text: Pas azan magrib, kira-kira jam enam.
      ar_eg: مع أدان المغرب، حوالي الساعة ستة.
      ar: مع أذان المغرب، نحو السادسة.
      en: At the sunset call, around six.
    - speaker: Ni Luh
      text: Nanti aku beliin takjil, ya. Kurma dan gorengan?
      ar_eg: هجيبلك حاجة تفطر عليها. تمر ومقليات؟
      ar: سأشتري لك ما تُفطر عليه. تمرًا ومقليّات؟
      en: I'll get you some takjil later. Dates and fried snacks?
    - speaker: Mohamed
      text: Makasih banyak, Luh!
      ar_eg: متشكر أوي يا لوه!
      ar: شكرًا جزيلًا يا لوه!
      en: Thanks so much, Luh!
