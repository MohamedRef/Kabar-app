schema: kabar.lesson/v1
id: bipa6.u05.l06
language: id
title: Tari Saman
can_do:
  ar_eg: توصف رقصة السامان بتاعة الجايو وتشرح ليه اليونسكو حماها.
  ar: أن تصف رقصة السامان لدى الغايو وتشرح لماذا تحميها اليونسكو.
  en: Describe the Gayo people's Saman dance and explain why UNESCO protects it.
slides:
  - title: Seribu tangan, satu gerakan
    body:
      ar_eg: |
        Tari Saman من بلاد الجايو في جبال آتشيه. الراقصين رجالة، قاعدين في صف واحد على ركبهم.
        - berlutut = يقعد على ركبه
        - barisan = صف
        - tepukan = تصقيفة، ضربة بالإيد على الإيد أو الصدر
        - kompak = متناسقين، بيتحركوا كأنهم واحد
        - warisan budaya takbenda = تراث ثقافي غير مادي
        الغنا فيه بلغة الجايو وكمان كلمات عربية، وفيه مدح ونصيحة. وفي ٢٠١١ اليونسكو حطّت الرقصة في قايمة التراث غير المادي اللي محتاج حماية عاجلة.
        - في الشارع: cuma = hanya (بس)، tapi = tetapi (بس / لكن)، banget = sekali (أوي).
      ar: |
        Tari Saman من بلاد الغايو في جبال آتشيه. الراقصون رجال يجلسون جاثين على ركبهم في صفّ واحد.
        - berlutut = يجثو على ركبتيه
        - barisan = صفّ
        - tepukan = تصفيقة، ضربة باليد على اليد أو الصدر
        - kompak = متناسقون، يتحرّكون كأنهم شخص واحد
        - warisan budaya takbenda = تراث ثقافي غير مادّي
        ويُغنّى فيها بلغة الغايو وبكلمات عربية، وفيها مديح ونصح. وفي ٢٠١١ أدرجتها اليونسكو في قائمة التراث غير المادّي الذي يحتاج إلى صون عاجل.
        - في كلام الشارع: cuma = hanya (فقط)، tapi = tetapi (لكن)، banget = sekali (جدًّا).
      en: |
        Tari Saman comes from the Gayo highlands of Aceh. The dancers are men, kneeling in a single row.
        - berlutut = to kneel
        - barisan = row, line
        - tepukan = a clap, a slap of hand on hand or chest
        - kompak = in sync, moving as one
        - warisan budaya takbenda = intangible cultural heritage
        The songs are in Gayo with Arabic words too, offering praise and advice. In 2011 UNESCO listed the dance as intangible heritage in need of urgent safeguarding.
        - On the street: cuma = hanya (only), tapi = tetapi (but), banget = sekali (very).
    examples:
      - text: Para penari berlutut dalam satu barisan dan bergerak sangat kompak.
        ar_eg: الراقصين قاعدين على ركبهم في صف واحد وبيتحركوا متناسقين جدًا.
        ar: يجثو الراقصون في صفّ واحد ويتحرّكون بتناسق شديد.
        en: The dancers kneel in one row and move perfectly in sync.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: berlutut
        ar_eg: يقعد على ركبه
        ar: يجثو
        en: to kneel
      - text: barisan
        ar_eg: صف
        ar: صفّ
        en: row
      - text: tepukan
        ar_eg: تصقيفة
        ar: تصفيقة
        en: clap
      - text: kompak
        ar_eg: متناسقين
        ar: متناسق
        en: in sync
      - text: warisan budaya takbenda
        ar_eg: تراث غير مادي
        ar: تراث غير مادّي
        en: intangible heritage
    words: [berlutut, barisan, tepukan, kompak, warisan budaya takbenda]
  - id: e02
    type: listen
    text: Para penari yang berlutut itu berasal dari dataran tinggi Gayo di Aceh.
    question:
      ar_eg: الراقصين دول منين؟
      ar: من أين هؤلاء الراقصون؟
      en: Where are the dancers from?
    options:
      - من بالي.
      - من جبال الجايو في آتشيه.
      - من جاكرتا.
    answer: 1
    words: [berlutut]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «kompak» في الرقص يعني إيه؟
      ar: ما معنى «kompak» في الرقص؟
      en: What does "kompak" mean in dance?
    options:
      - كل واحد بيرقص لوحده.
      - الرقص بطيء جدًا.
      - كلهم بيتحركوا كأنهم واحد.
    answer: 2
    words: [kompak]
  - id: e04
    type: fill_blank
    sentence: Pada tahun 2011, UNESCO menetapkan Saman sebagai ___.
    meaning:
      ar_eg: سنة ٢٠١١، اليونسكو اعتمدت السامان تراث ثقافي غير مادي.
      ar: اعتمدت اليونسكو السامان تراثًا ثقافيًّا غير مادّي سنة ٢٠١١.
      en: In 2011, UNESCO recognised Saman as intangible cultural heritage.
    options: [warisan budaya takbenda, barisan, tepukan]
    answers: [warisan budaya takbenda]
    words: [warisan budaya takbenda]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الراقصين في السامان بيقعدوا إزاي؟
      ar: كيف يجلس راقصو السامان؟
      en: How do Saman dancers sit?
    options:
      - على ركبهم في صف واحد.
      - على كراسي في دايرة.
      - واقفين في صفين.
    answer: 0
    words: [berlutut, barisan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: صوت التصقيف بيعلى وبيسرع.
      ar: يعلو صوت التصفيق ويتسارع.
      en: The sound of the claps grows louder and faster.
    answer: Suara tepukan makin keras dan makin cepat.
    distractors: [barisan, berlutut]
    words: [tepukan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الراقصين متناسقين جدًا.
      ar: الراقصون متناسقون جدًا.
      en: The dancers are very much in sync.
    answers:
      - Para penari sangat kompak.
      - Penari-penari itu sangat kompak.
      - Para penari itu kompak sekali.
      - Penarinya sangat kompak.
    words: [kompak]
  - id: e08
    type: speaking
    text: Saman adalah warisan budaya takbenda, dan tepukannya terdengar seperti satu suara.
    meaning:
      ar_eg: السامان تراث غير مادي، والتصقيف فيه بيبان كأنه صوت واحد.
      ar: السامان تراث غير مادّي، وتُسمع تصفيقاته كأنها صوت واحد.
      en: Saman is intangible heritage, and its claps sound like a single voice.
    words: [warisan budaya takbenda, tepukan]
  - id: e09
    type: dictation
    text: Sepuluh penari berlutut dalam satu barisan yang rapat.
    meaning:
      ar_eg: عشر راقصين قاعدين على ركبهم في صف لازق في بعضه.
      ar: يجثو عشرة راقصين في صفّ متلاصق.
      en: Ten dancers kneel in one tight row.
    words: [berlutut, barisan]
  - id: e10
    type: fill_blank
    sentence: Kalau satu penari salah, ___ terlihat tidak rapi.
    meaning:
      ar_eg: لو راقص واحد غلط، الصف كله يبان مش منظم.
      ar: إن أخطأ راقص واحد بدا الصفّ كلّه غير منتظم.
      en: If one dancer slips, the whole row looks untidy.
    options: [barisan, tepukan, kompak]
    answers: [barisan]
    words: [barisan]
dialogue:
  title: Saman di Gayo Lues
  lines:
    - speaker: Kak Rahmah
      text: Mohamed, malam ini ada Saman. Penarinya dari Gayo Lues.
      ar_eg: يا محمد، الليلة فيه سامان. الراقصين من جايو لويس.
      ar: يا محمد، الليلة عرض سامان، وراقصوه من غايو لويس.
      en: Mohamed, there's a Saman tonight. The dancers are from Gayo Lues.
    - speaker: Mohamed
      text: Mereka cuma berlutut, tapi gerakannya cepat banget!
      ar_eg: هما قاعدين على ركبهم بس، بس حركاتهم سريعة جدًا!
      ar: إنهم جاثون فحسب، لكنّ حركاتهم سريعة جدًّا!
      en: They're only kneeling, but they move so fast!
    - speaker: Kak Rahmah
      text: Iya, dan kompak banget. Dengar syairnya, ada kata "Allah" dan "salam".
      ar_eg: أيوه، ومتناسقين جدًا. اسمع الغنا، فيه كلمة «الله» و«سلام».
      ar: نعم، ومتناسقون جدًّا. استمع إلى الشعر، ففيه «الله» و«سلام».
      en: Yes, and perfectly in sync. Listen to the verses, there's "Allah" and "salam".
    - speaker: Mohamed
      text: Pantas UNESCO menyebutnya warisan budaya takbenda.
      ar_eg: مش غريبة إن اليونسكو سمّتها تراث غير مادي.
      ar: لا عجب أن تسمّيها اليونسكو تراثًا غير مادّي.
      en: No wonder UNESCO calls it intangible heritage.
