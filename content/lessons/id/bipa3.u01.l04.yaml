  - id: e10
    type: fill_blank
    sentence: Kucing saya sudah ___. Kami sedih sekali.
    meaning:
      ar_eg: القطة بتاعتي ماتت. إحنا زعلانين أوي.
      ar: ماتت قطتي. نحن حزينون جدًا.
      en: My cat has died. We're very sad.
    options: [mati, meninggal dunia, tabah]
    answers: [mati]
    explain:
      ar_eg: للحيوان بنقول mati. meninggal dunia للإنسان بس.
      ar: يقال للحيوان mati، أما meninggal dunia فللإنسان.
      en: For an animal, say mati; meninggal dunia is for people.
    words: [mati]
dialogue:
  title: Kabar duka
  lines:
    - speaker: Rina
      text: Mohamed, ayahnya Pak Hamdi meninggal dunia hari Jumat.
      ar_eg: يا محمد، والد الأستاذ حمدي توفّى يوم الجمعة.
      ar: يا محمد، تُوفّي والد السيد حمدي يوم الجمعة.
      en: Mohamed, Pak Hamdi's father passed away on Friday.
    - speaker: Mohamed
      text: Innalillahi wa inna ilaihi raji'un. Sakit apa?
      ar_eg: إنا لله وإنا إليه راجعون. كان عنده إيه؟
      ar: إنا لله وإنا إليه راجعون. ممّ كان يشكو؟
      en: To God we belong and to Him we return. What was he ill with?
    - speaker: Rina
      text: Menurut Bu Yanti, almarhum udah sakit dari bulan lalu.
      ar_eg: على حسب كلام مدام يانتي، المرحوم كان عيان من الشهر اللي فات.
      ar: بحسب السيدة يانتي، كان المرحوم مريضًا منذ الشهر الماضي.
      en: According to Bu Yanti, he had been ill since last month.
    - speaker: Mohamed
      text: Pak Hamdi, saya turut berduka cita. Semoga Bapak dan keluarga tabah.
      ar_eg: يا أستاذ حمدي، البقية في حياتك. ربنا يصبّرك انت والعيلة.
      ar: يا سيد حمدي، أشاطرك الحزن، ألهمك الله وأسرتك الصبر.
      en: Pak Hamdi, I'm so sorry for your loss. May you and your family be strong.
    - speaker: Pak Hamdi
      text: Terima kasih, Mohamed. Mohon doanya, ya.
      ar_eg: متشكر يا محمد. ادعيله.
      ar: شكرًا يا محمد، ادعُ له.
      en: Thank you, Mohamed. Please keep him in your prayers.
