schema: kabar.lesson/v1
id: bipa3.u01.l04
language: id
title: Turut berduka cita
can_do:
  ar_eg: تعزّي حد بأدب، وتقول الحاجة حصلت إمتى وعلى حسب كلام مين.
  ar: أن تقدّم التعزية بأدب، وتذكر متى وقع الأمر ووفقًا لمن.
  en: Offer condolences and say when things happened.
slides:
  - title: Turut berduka cita
    body:
      ar_eg: |
        العزاء الأساسي: Saya turut berduka cita = البقية في حياتك (حرفيًا: أنا شريكك في الحزن).
        للبني آدم بنقول meninggal dunia (توفّى)، و mati غالبًا للحيوانات والحاجات، وعلى إنسان بتبقى جافة، فبلاش تقولها في العزا.
        المتوفي = almarhum (من العربي «المرحوم»)، والست almarhumah.
        والمسلمين بيقولوا زينا: Innalillahi wa inna ilaihi raji'un.
      ar: |
        العبارة الأساسية: Saya turut berduka cita = أشاطرك الحزن.
        للإنسان نقول meninggal dunia (تُوفّي)، أما mati فتُستعمل غالبًا للحيوان والأشياء، وهي جافة عن الإنسان، فلا تُقال في التعزية.
        المتوفّى = almarhum (من العربية «المرحوم»)، وللمرأة almarhumah.
        ويقول المسلمون كما نقول: Innalillahi wa inna ilaihi raji'un.
      en: |
        The basic condolence: Saya turut berduka cita = I share your sorrow.
        For people say meninggal dunia (pass away); mati is mostly for animals and things and sounds blunt for a person, so never use it in condolences.
        The late (man) = almarhum (from Arabic «المرحوم»); for a woman, almarhumah.
        Muslims also say, as in Arabic: Innalillahi wa inna ilaihi raji'un.
    examples:
      - text: Saya turut berduka cita, Bu. Semoga Ibu dan keluarga tabah.
        ar_eg: البقية في حياتك يا حاجة. ربنا يصبّرك انتي والعيلة.
        ar: أشاطركِ الحزن يا سيدتي، ألهمكِ الله وأسرتكِ الصبر.
        en: I'm so sorry for your loss, Bu. May you and your family be strong.
      - text: Almarhum orang yang sangat baik.
        ar_eg: المرحوم كان راجل طيب أوي.
        ar: كان المرحوم رجلًا طيبًا جدًا.
        en: The deceased was a very good man.
  - title: pada, sejak, menurut
    grammar: id.preposition.extended
    body:
      ar_eg: |
        pada = في (للوقت) في الكلام الرسمي: pada hari Jumat = يوم الجمعة. في الكلام العادي بيقولوا di، بس في الرسمي pada أحسن.
        sejak = من ساعة / منذ (انت عارفها): sejak bulan lalu.
        menurut = على حسب كلام / رأي: Menurut Bu Yanti, … = على حسب كلام مدام يانتي، …
      ar: |
        pada = في (للزمن) في الأسلوب الرسمي: pada hari Jumat = يوم الجمعة. وفي الحديث العادي يقال di، لكن pada أفصح.
        sejak = منذ (تعرفها): sejak bulan lalu.
        menurut = وفقًا لـ / حسب رأي: Menurut Bu Yanti, … = بحسب السيدة يانتي …
      en: |
        pada = on / at (time) in formal Indonesian: pada hari Jumat = on Friday. Casual speech often says di, but pada is better in formal speech.
        sejak = since (you know it): sejak bulan lalu.
        menurut = according to: Menurut Bu Yanti, … = According to Bu Yanti, …
    examples:
      - text: Ayah Pak Hamdi meninggal dunia pada hari Jumat.
        ar_eg: والد الأستاذ حمدي توفّى يوم الجمعة.
        ar: تُوفّي والد السيد حمدي يوم الجمعة.
        en: Pak Hamdi's father passed away on Friday.
      - text: Menurut Bu Yanti, almarhum sakit sejak bulan lalu.
        ar_eg: على حسب كلام مدام يانتي، المرحوم كان عيان من الشهر اللي فات.
        ar: بحسب السيدة يانتي، كان المرحوم مريضًا منذ الشهر الماضي.
        en: According to Bu Yanti, the deceased had been ill since last month.
