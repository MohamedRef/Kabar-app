    words: [turut berduka cita, meninggal dunia, almarhum, tabah, pada, menurut]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: والد صاحبك توفّى. تقوله إيه؟
      ar: تُوفّي والد صديقك. ماذا تقول له؟
      en: Your friend's father has passed away. What do you say?
    options: ["Selamat menikah!", "Saya turut berduka cita.", "Mohon maaf lahir dan batin."]
    answer: 1
    words: [turut berduka cita]
  - id: e03
    type: listen
    text: Ayah Pak Hamdi meninggal dunia pada hari Jumat.
    options: ["Ayah Pak Hamdi mati pada hari Jumat.", "Ayah Pak Hamdi meninggal dunia sejak hari Jumat.", "Ayah Pak Hamdi meninggal dunia pada hari Jumat."]
    answer: 2
    meaning:
      ar_eg: والد الأستاذ حمدي توفّى يوم الجمعة.
      ar: تُوفّي والد السيد حمدي يوم الجمعة.
      en: Pak Hamdi's father passed away on Friday.
    words: [meninggal dunia, pada, mati]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة مؤدبة للإنسان اللي مات؟
      ar: أيّ عبارة مهذّبة تُقال عن إنسان مات؟
      en: Which is the polite way to say a person died?
    options: [meninggal dunia, mati, pulang]
    answer: 0
    explain:
      ar_eg: mati للحيوانات والحاجات (HP-nya mati = الموبايل فصل). للإنسان meninggal dunia.
      ar: mati للحيوان والأشياء (HP-nya mati = نفدت بطارية الهاتف)، وللإنسان meninggal dunia.
      en: mati is for animals and things (HP-nya mati = the phone died); for people say meninggal dunia.
    words: [meninggal dunia, mati]
  - id: e05
    type: fill_blank
    sentence: ___ Pak Irwan, almarhum guru yang sangat rajin.
    meaning:
      ar_eg: على حسب كلام أستاذ إروان، المرحوم كان مدرّس مجتهد أوي.
      ar: بحسب الأستاذ إروان، كان المرحوم معلّمًا مجتهدًا جدًا.
      en: According to Pak Irwan, the deceased was a very hard-working teacher.
    options: [Pada, Menurut, Sejak]
    answers: [Menurut]
    words: [menurut, almarhum]
  - id: e06
    type: fill_blank
    sentence: Almarhum meninggal dunia ___ tanggal 5 Mei.
    meaning:
      ar_eg: المرحوم توفّى يوم ٥ مايو.
      ar: تُوفّي المرحوم في الخامس من مايو.
      en: The deceased passed away on 5 May.
    options: [menurut, sejak, pada]
    answers: [pada]
    explain:
      ar_eg: لتاريخ معيّن في الرسمي pada. sejak = من ساعة (مدة لسه مستمرة).
      ar: لتاريخ محدّد في الأسلوب الرسمي pada، أما sejak فلمدة مستمرة.
      en: A specific date in formal style takes pada; sejak means "since" (a span still going on).
    words: [pada, almarhum]
  - id: e07
    type: build_sentence
