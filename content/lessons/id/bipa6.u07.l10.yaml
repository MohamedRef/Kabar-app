schema: kabar.lesson/v1
id: bipa6.u07.l10
language: id
title: Ringkasan kebijakan
can_do:
  ar_eg: تكتب ملخّص سياسة في صفحة واحدة.
  ar: أن تكتب ملخّص سياسة في صفحة واحدة.
  en: Write a one-page policy brief.
slides:
  - title: Satu halaman saja
    grammar: id.register.legal
    body:
      ar_eg: |
        ملخّص السياسة (ringkasan kebijakan) بيمشي بالترتيب ده:
        1. Latar belakang: المشكلة في جملتين.
        2. Ketentuan utama: البند الأساسي في القرار.
        3. Sasaran: مين اللي القرار بيمسّه.
        4. Dampak: الأثر المتوقع.
        5. Rekomendasi: اقتراحك، غالبًا بـ Sebaiknya … (الأفضل …).
        مثال (مكتوب للدرس): Mulai semester depan, kantin kampus dilarang memakai plastik sekali pakai.
        - في الشارع: aja = saja (بس / وخلاص)، terus = lalu (وبعدين).
      ar: |
        يسير ملخّص السياسة (ringkasan kebijakan) بهذا الترتيب:
        1. Latar belakang: المشكلة في جملتين.
        2. Ketentuan utama: البند الأساسي في القرار.
        3. Sasaran: الفئة التي يمسّها القرار.
        4. Dampak: الأثر المتوقّع.
        5. Rekomendasi: اقتراحك، وغالبًا بـ Sebaiknya … (الأَولى …).
        مثال (مكتوب للدرس): Mulai semester depan, kantin kampus dilarang memakai plastik sekali pakai.
        - في كلام الشارع: aja = saja (فقط)، terus = lalu (ثمّ).
      en: |
        A policy brief (ringkasan kebijakan) runs in this order:
        1. Latar belakang: the problem in two sentences.
        2. Ketentuan utama: the key provision.
        3. Sasaran: who the policy targets.
        4. Dampak: the expected impact.
        5. Rekomendasi: your recommendation, often with Sebaiknya … (It would be best to …).
        Example (written for the lesson): Mulai semester depan, kantin kampus dilarang memakai plastik sekali pakai.
        - On the street: aja = saja (just, only), terus = lalu (then).
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dampak
        ar_eg: أثر
        ar: أثر
        en: impact
      - text: rekomendasi
        ar_eg: توصية
        ar: توصية
        en: recommendation
      - text: sasaran
        ar_eg: الفئة المستهدفة / هدف
        ar: الفئة المستهدفة
        en: target (group)
      - text: ketentuan
        ar_eg: بند / شرط
        ar: حكم / بند
        en: provision
    words: [dampak, rekomendasi, sasaran, ketentuan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جزء في الملخّص بيقول القرار بيمسّ مين؟
      ar: أيّ جزء من الملخّص يذكر مَن يمسّه القرار؟
      en: Which part of a brief says who the policy affects?
    options: [Sasaran, Rekomendasi, Dampak]
    answer: 0
    words: [sasaran]
    explain:
      ar_eg: مين اللي القرار بيأثّر عليه = Sasaran (الفئة المستهدفة). Rekomendasi = توصيات وDampak = أثر.
      ar: من تشمله السياسة Sasaran (الفئة المستهدفة)؛ أمّا Rekomendasi فتوصيات، وDampak أثر.
      en: Who the policy affects is the Sasaran, target group. Rekomendasi are recommendations, and Dampak the impact.
  - id: e03
    type: fill_blank
    sentence: ___ kebijakan ini, sampah plastik di kantin berkurang.
    meaning:
      ar_eg: أثر السياسة دي إن زبالة البلاستيك في الكانتين قلّت.
      ar: من أثر هذه السياسة أنّ نفايات البلاستيك في المقصف قلّت.
      en: As an impact of this policy, plastic waste in the canteen fell.
    options: [Dampak, Sasaran, Ketentuan]
    answers: [Dampak]
    words: [dampak]
    explain:
      ar_eg: "البلاستيك قلّ كنتيجة للقرار: Dampak (أثر). Sasaran = المستهدفين وKetentuan = بند."
      ar: قلّ البلاستيك أثرًا للسياسة Dampak؛ أمّا Sasaran فالمستهدفون، وKetentuan حكم أو بند.
      en: Less plastic is the policy's impact, Dampak. Sasaran is the target group, and Ketentuan a provision.
  - id: e04
    type: listen
    text: Sasaran kebijakan ini adalah semua pedagang di kantin kampus.
    question:
      ar_eg: السياسة دي بتستهدف مين؟
      ar: مَن تستهدف هذه السياسة؟
      en: Who does this policy target?
    options:
      - الطلبة بس.
      - كل البيّاعين في كانتين الجامعة.
      - المدرّسين.
    answer: 1
    words: [sasaran]
  - id: e05
    type: build_sentence
    source:
      ar_eg: البند ده بيسري من الترم الجاي.
      ar: يسري هذا البند ابتداءً من الفصل القادم.
      en: This provision applies from next semester.
    answer: Ketentuan ini berlaku mulai semester depan.
    distractors: [dampak, sasaran]
    words: [ketentuan]
    explain:
      ar_eg: «البند ده» = Ketentuan ini و«بيسري» = berlaku. dampak وsasaran مش في المعنى.
      ar: «هذا الحكم» Ketentuan ini و«يسري» berlaku؛ أمّا dampak وsasaran فليستا في المعنى.
      en: "\"This provision\" is Ketentuan ini and \"applies\" is berlaku. dampak and sasaran aren't in the meaning."
  - id: e06
    type: match_pairs
    pairs:
      - text: pedoman
        ar_eg: دليل إرشادات
        ar: دليل إرشادي
        en: guidelines, manual
      - text: perpanjangan
        ar_eg: تجديد، مدّ
        ar: تمديد، تجديد
        en: extension, renewal
      - text: pembatalan
        ar_eg: إلغاء
        ar: إلغاء
        en: cancellation
      - text: pengembalian
        ar_eg: استرجاع، رد
        ar: إرجاع، استرداد
        en: return, refund
      - text: penegakan
        ar_eg: تطبيق، إنفاذ
        ar: إنفاذ
        en: enforcement (penegakan hukum)
    words: [pedoman, perpanjangan, pembatalan, pengembalian, penegakan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أثر السياسة دي لسه صغير.
      ar: ما زال أثر هذه السياسة صغيرًا.
      en: The impact of this policy is still small.
    answers:
      - Dampak kebijakan ini masih kecil.
      - Dampak dari kebijakan ini masih kecil.
      - Dampak kebijakan ini masih sedikit.
    words: [dampak]
  - id: e08
    type: speaking
    text: Rekomendasi kami, ketentuan ini dijelaskan dengan bahasa sederhana.
    meaning:
      ar_eg: توصيتنا إن البند ده يتشرح بكلام بسيط.
      ar: توصيتنا أن يُشرح هذا البند بلغة بسيطة.
      en: Our recommendation is that this provision be explained in plain language.
    words: [rekomendasi, ketentuan]
  - id: e09
    type: dictation
    text: Sasaran utama program ini adalah mahasiswa baru.
    meaning:
      ar_eg: الفئة الأساسية اللي البرنامج ده بيستهدفها هي الطلبة الجداد.
      ar: الفئة المستهدفة أساسًا في هذا البرنامج هي الطلّاب الجدد.
      en: The main target of this programme is new students.
    words: [sasaran]
  - id: e10
    type: translate
    direction: from_target
    source_text: Laporan itu berisi tiga rekomendasi untuk pemerintah daerah.
    answers_meaning:
      ar_eg:
        - التقرير ده فيه تلات توصيات للحكومة المحلية.
        - التقرير فيه تلات توصيات لحكومة المحافظة.
      ar:
        - يتضمّن ذلك التقرير ثلاث توصيات للحكومة المحلّية.
        - في التقرير ثلاث توصيات لحكومة الإقليم.
      en:
        - The report contains three recommendations for the local government.
        - That report makes three recommendations to the regional government.
    words: [rekomendasi]
dialogue:
  title: Satu halaman
  lines:
    - speaker: Kak Intan
      text: Ringkasan kebijakanmu harus satu halaman aja, ya.
      ar_eg: ملخّص السياسة بتاعك لازم يبقى صفحة واحدة بس.
      ar: يجب أن يكون ملخّص سياستك صفحة واحدة فقط.
      en: Your policy brief has to be one page only, okay?
    - speaker: Mohamed
      text: Baik. Ketentuannya, kantin dilarang memakai plastik sekali pakai.
      ar_eg: ماشي. البند إن الكانتين ممنوع يستعمل بلاستيك بيتستعمل مرة واحدة.
      ar: حسنًا. البند هو منع المقصف من استعمال البلاستيك الأحادي الاستعمال.
      en: Fine. The provision is that the canteen may not use single-use plastic.
    - speaker: Kak Intan
      text: Terus sasarannya siapa, dan dampaknya apa?
      ar_eg: طب بيستهدف مين، وأثره إيه؟
      ar: ومَن المستهدف، وما الأثر؟
      en: Then who's the target, and what's the impact?
    - speaker: Mohamed
      text: Sasarannya pedagang kantin. Rekomendasi saya, kampus membantu mereka membeli wadah baru.
      ar_eg: بيستهدف بيّاعين الكانتين. وتوصيتي إن الجامعة تساعدهم يشتروا علب جديدة.
      ar: المستهدف باعة المقصف، وتوصيتي أن تعينهم الجامعة على شراء أوعية جديدة.
      en: The target is the canteen vendors. My recommendation is that the campus helps them buy new containers.
