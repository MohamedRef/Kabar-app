schema: kabar.lesson/v1
id: bipa4.u03.l09
language: id
title: "Brosur Ke'te' Kesu'"
can_do:
  ar_eg: تقرا بروشور سياحي عن قرية تاريخية وتطلع منه المعلومات المهمة.
  ar: أن تقرأ كتيّبًا سياحيًا عن قرية تاريخية وتستخرج منه المعلومات المهمة.
  en: Read a tourist brochure about a historic village and pick out the key facts.
slides:
  - title: Brosur wisata
    body:
      ar_eg: |
        Mohamed لقى البروشور ده في الهوتيل في رانتيباو. اقراه كأنك سايح.
        خد بالك من التشبيه (seperti) ومن الأفعال اللي بـ -kan.
      ar: |
        وجد Mohamed هذا الكتيّب في فندقه في رانتيباو. اقرأه كأنك سائح.
        لاحظ التشبيه (seperti) والأفعال المنتهية بـ -kan.
      en: |
        Mohamed found this brochure at his hotel in Rantepao. Read it like a tourist.
        Notice the simile (seperti) and the -kan verbs.
    examples:
      - text: "Ke'te' Kesu' terletak tidak jauh dari Rantepao. Desa adat ini adalah warisan leluhur orang Toraja."
        ar_eg: كيتي كيسو مش بعيدة عن رانتيباو. القرية التقليدية دي ورث من أجداد التوراجا.
        ar: تقع كيتي كيسو على مسافة غير بعيدة من رانتيباو. وهذه القرية التقليدية إرث من أجداد شعب توراجا.
        en: "Ke'te' Kesu' is not far from Rantepao. This traditional village is a heritage of the Toraja ancestors."
      - text: Atap rumah tongkonan di sana melengkung seperti perahu, dan di depan rumah ada banyak tanduk kerbau.
        ar_eg: سقف بيوت التونجكونان هناك مقوّس زي المركب، وقدام البيوت فيه قرون جاموس كتير.
        ar: أسقف بيوت التونغكونان هناك مقوّسة كالقارب، وأمام البيوت قرون جواميس كثيرة.
        en: The tongkonan roofs there curve like boats, and there are many buffalo horns in front of the houses.
      - text: Para pengrajin bisa membuatkan Anda ukiran kayu kecil sebagai oleh-oleh.
        ar_eg: الحرفيين ممكن يعملولك نحت خشب صغير تاخده هدية.
        ar: يستطيع الحرفيون أن يصنعوا لك منحوتة خشبية صغيرة هديةً تذكارية.
        en: The craftsmen can make you a small wood carving as a souvenir.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: كيتي كيسو فين؟
      ar: أين تقع كيتي كيسو؟
      en: "Where is Ke'te' Kesu'?"
    options:
      - Di tengah Kota Makassar
      - Tidak jauh dari Rantepao
      - Di tebing batu Londa
    answer: 1
    words: [warisan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الزائر ممكن ياخد إيه من الحرفيين؟
      ar: ماذا يمكن للزائر أن يحصل عليه من الحرفيين؟
      en: What can visitors get from the craftsmen?
    options:
      - Kopi Toraja gratis
      - Kain tenun dari Mesir
      - Ukiran kayu kecil
    answer: 2
    words: [pengrajin, ukiran]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: شكل سقف التونجكونان عامل إزاي؟
      ar: كيف يبدو سقف التونغكونان؟
      en: What does a tongkonan roof look like?
    options:
      - Melengkung seperti perahu
      - Datar seperti meja
      - Tinggi seperti tebing
    answer: 0
    words: [atap, melengkung, perahu]
  - id: e04
    type: match_pairs
    pairs:
      - text: warisan
        ar_eg: ورث / تراث
        ar: إرث / تراث
        en: heritage
      - text: leluhur
        ar_eg: الأجداد
        ar: الأسلاف
        en: ancestors
      - text: atap
        ar_eg: سقف
        ar: سقف
        en: roof
      - text: tanduk kerbau
        ar_eg: قرن جاموس
        ar: قرن جاموس
        en: buffalo horn
      - text: pengrajin
        ar_eg: حرفي
        ar: حِرَفي
        en: craftsman
    words: [warisan, leluhur, atap, tanduk, kerbau, pengrajin]
  - id: e05
    type: listen
    text: Atap rumah tongkonan di sana melengkung seperti perahu.
    options:
      - Atap rumah tongkonan di sana melengkung seperti tanduk.
      - Atap rumah tongkonan di sana melengkung seperti perahu.
      - Atap rumah tongkonan di sini melengkung seperti perahu.
    answer: 1
    meaning:
      ar_eg: سقف بيوت التونجكونان هناك مقوّس زي المركب.
      ar: أسقف بيوت التونغكونان هناك مقوّسة كالقارب.
      en: The tongkonan roofs there curve like boats.
    words: [atap, melengkung, perahu]
  - id: e06
    type: fill_blank
    sentence: Para pengrajin bisa ___ Anda ukiran kayu kecil.
    meaning:
      ar_eg: الحرفيين ممكن يعملولك نحت خشب صغير.
      ar: يستطيع الحرفيون أن يصنعوا لك منحوتة خشبية صغيرة.
      en: The craftsmen can make you a small wood carving.
    options: [menceritakan, membicarakan, membuatkan]
    answers: [membuatkan]
    explain:
      ar_eg: membuatkan = يعمل حاجة «لحد». هنا الحرفي بيعمل النحت ليك (Anda).
      ar: membuatkan = يصنع شيئًا لأجل شخص. هنا يصنع الحرفي المنحوتة لك (Anda).
      en: membuatkan = make something for someone; here the craftsman makes it for you (Anda).
    words: [membuatkan, pengrajin]
  - id: e07
    type: build_sentence
    source:
      ar_eg: المرشد حكالنا تاريخ القرية التقليدية دي.
      ar: روى لنا المرشد تاريخ هذه القرية التقليدية.
      en: The guide told us the history of the traditional village.
    answer: Pemandu menceritakan sejarah desa adat itu kepada kami.
    alternatives:
      - Pemandu menceritakan kepada kami sejarah desa adat itu.
    distractors: [membuatkan, tentang]
    explain:
      ar_eg: menceritakan بياخد الحاجة اللي بتتحكي على طول، من غير tentang.
      ar: menceritakan يأخذ مفعولًا مباشرًا دون tentang.
      en: menceritakan takes what is told as a direct object, with no tentang.
    words: [menceritakan, adat]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: يا Mas، ممكن تشتريلي نحت صغير؟
      ar: يا Mas، هل يمكنك أن تشتري لي منحوتة صغيرة؟
      en: Mas, could you buy me a small carving?
    answers:
      - Mas, bisa belikan saya ukiran kecil?
      - Mas, bisakah kamu membelikan saya ukiran kecil?
      - Mas, bisa membelikan saya ukiran kecil?
      - Mas, bisa kamu membelikan saya ukiran kecil?
      - Mas, bisa belikan aku ukiran kecil?
      - Mas, bisakah Mas membelikan saya ukiran kecil?
      - Mas, bisa membelikan ukiran kecil untuk saya?
    words: [membelikan, ukiran]
  - id: e09
    type: match_pairs
    pairs:
      - text: tertua
        ar_eg: الأقدم
        ar: الأقدم
        en: oldest
      - text: penguasa
        ar_eg: حاكم
        ar: حاكم
        en: ruler
      - text: terowongan
        ar_eg: نفق
        ar: نفق
        en: tunnel
      - text: arsip
        ar_eg: أرشيف
        ar: أرشيف
        en: archive
      - text: dekade
        ar_eg: عقد (عشر سنين)
        ar: عقد (عشر سنوات)
        en: decade
      - text: dihancurkan
        ar_eg: اتهدّ
        ar: دُمّر
        en: destroyed
    words: [tertua, penguasa, terowongan, arsip, dekade, dihancurkan]
dialogue:
  title: Rencana ke Ke'te' Kesu'
  lines:
    - speaker: Mohamed
      text: Mas, kata brosur ini, Ke'te' Kesu' nggak jauh dari Rantepao.
      ar_eg: يا Mas، البروشور ده بيقول إن كيتي كيسو مش بعيدة عن رانتيباو.
      ar: يا Mas، بحسب هذا الكتيّب، كيتي كيسو ليست بعيدة عن رانتيباو.
      en: "Mas, according to this brochure, Ke'te' Kesu' isn't far from Rantepao."
    - speaker: Mas Rizal
      text: Bener, kita bisa naik ojek ke sana.
      ar_eg: مظبوط، نقدر نروح بالموتوسيكل الأجرة.
      ar: صحيح، يمكننا الذهاب على درّاجة أجرة.
      en: Right, we can take an ojek there.
    - speaker: Mohamed
      text: Di sana ada pengrajin yang bisa bikinin ukiran kecil.
      ar_eg: هناك فيه حرفيين يقدروا يعملولك نحت صغير.
      ar: هناك حرفيون يستطيعون صنع منحوتة صغيرة لك.
      en: There are craftsmen there who can make you a small carving.
    - speaker: Mas Rizal
      text: Cocok buat oleh-oleh ibumu di Kairo.
      ar_eg: حلوة هدية لمامتك في القاهرة.
      ar: هدية جميلة لوالدتك في القاهرة.
      en: Nice as a souvenir for your mum in Cairo.
    - speaker: Mohamed
      text: Iya! Aku juga mau lihat atap yang melengkung kayak perahu itu.
      ar_eg: أيوه! وكمان عايز أشوف السقف اللي مقوّس زي المركب ده.
      ar: نعم! وأريد أيضًا أن أرى ذلك السقف المقوّس كالقارب.
      en: Yes! I also want to see those roofs that curve like boats.
