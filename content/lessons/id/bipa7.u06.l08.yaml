schema: kabar.lesson/v1
id: bipa7.u06.l08
language: id
title: Akun palsu dan pendengung
can_do:
  ar_eg: تكشف الحسابات المزيّفة والفيديوهات المتلعب فيها وتعرف تتصرّف.
  ar: أن تكشف الحسابات المزيّفة والمقاطع المتلاعب بها وتعرف كيف تتصرّف.
  en: Spot fake accounts and manipulated videos and know what to do.
slides:
  - title: Siapa di balik akun itu?
    body:
      ar_eg: |
        pendengung (buzzer) = حد بياخد فلوس علشان يطبّل لفكرة أو مرشّح.
        لما يبقوا كتير ومنظّمين اسمهم pasukan siber (جيش إلكتروني)، وغالبًا بيستعملوا akun palsu (حسابات فيك).
        centang biru = العلامة الزرقا. بس الحساب الـ terverifikasi مش معناه إن كلامه صح.
        pemalsuan = التزوير. deepfake = فيديو أو صوت متزيّف بالذكاء الاصطناعي.
        لو حد بيضايقك: blokir (اعمله بلوك) وبلّغ عنه.
        - في الكلام: terus = lalu، kedengaran = terdengar.
      ar: |
        pendengung (buzzer) = من يتقاضى مالًا للترويج لفكرة أو مرشّح.
        فإن كثروا وانتظموا سُمّوا pasukan siber (جيشًا إلكترونيًا)، وكثيرًا ما يستعملون akun palsu (حسابات مزيّفة).
        centang biru = علامة التوثيق الزرقاء، لكنّ الحساب terverifikasi لا يعني أنّ كلامه صحيح.
        pemalsuan = التزوير. deepfake = مقطع أو صوت مزيّف بالذكاء الاصطناعي.
        وإن ضايقك أحد: blokir (احظره) وأبلغ عنه.
        - في الكلام اليومي: terus = lalu، kedengaran = terdengar.
      en: |
        pendengung (buzzer) = someone paid to push an idea or a candidate.
        When there are many, organised, they're pasukan siber (cyber troops), often running akun palsu (fake accounts).
        centang biru = the blue tick. But a terverifikasi (verified) account isn't necessarily telling the truth.
        pemalsuan = forgery. deepfake = a video or voice faked with AI.
        If someone harasses you: blokir (block) them and report.
        - In speech: terus = lalu, kedengaran = terdengar.
    examples:
      - text: Ratusan akun palsu itu dikendalikan oleh satu orang.
        ar_eg: مية الحساب الفيك دول بيتحكّم فيهم شخص واحد.
        ar: يتحكّم شخص واحد في تلك المئات من الحسابات المزيّفة.
        en: Those hundreds of fake accounts are run by one person.
      - text: Video deepfake itu memperlihatkan menteri yang tidak pernah berbicara begitu.
        ar_eg: فيديو الديب فيك ده بيورّي وزير عمره ما قال كده.
        ar: يُظهر ذلك المقطع المزيّف وزيرًا لم يقل ذلك قط.
        en: That deepfake shows a minister who never said that.
      - text: Akun dengan centang biru belum tentu jujur.
        ar_eg: الحساب اللي عليه العلامة الزرقا مش شرط يكون صادق.
        ar: الحساب ذو العلامة الزرقاء ليس صادقًا بالضرورة.
        en: An account with a blue tick isn't necessarily honest.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pendengung
        ar_eg: حساب مدفوع بيطبّل (بازر)
        ar: مروّج مأجور (بازر)
        en: paid amplifier, buzzer
      - text: akun palsu
        ar_eg: حساب مزيّف / فيك
        ar: حساب مزيّف
        en: fake account
      - text: pasukan siber
        ar_eg: جيش إلكتروني
        ar: جيش إلكتروني
        en: cyber troops
      - text: centang biru
        ar_eg: العلامة الزرقا
        ar: علامة التوثيق الزرقاء
        en: blue tick
    words: [pendengung, akun palsu, pasukan siber, centang biru]
  - id: e02
    type: match_pairs
    pairs:
      - text: terverifikasi
        ar_eg: موثّق / متأكّد منه
        ar: موثَّق
        en: verified
      - text: pemalsuan
        ar_eg: تزوير
        ar: تزوير
        en: forgery, falsification
      - text: deepfake
        ar_eg: فيديو مزيّف بالذكاء الاصطناعي
        ar: تزييف عميق
        en: deepfake
      - text: blokir
        ar_eg: يعمل بلوك
        ar: يحظر
        en: to block
    words: [terverifikasi, pemalsuan, deepfake, blokir]
  - id: e03
    type: listen
    text: Para pendengung dibayar untuk memuji calon itu setiap hari.
    question:
      ar_eg: مين بيمدح المرشّح؟
      ar: مَن يمدح المرشّح؟
      en: Who praises the candidate?
    options: [حسابات مدفوعة بتطبّل, حسابات موثّقة, جيش حقيقي]
    answer: 0
    meaning:
      ar_eg: البازرز بياخدوا فلوس علشان يمدحوا المرشّح ده كل يوم.
      ar: يتقاضى المروّجون أجرًا ليمدحوا ذلك المرشّح يوميًا.
      en: The buzzers are paid to praise that candidate every day.
    words: [pendengung]
  - id: e04
    type: fill_blank
    sentence: Kalau ada yang terus menghina kamu, ___ saja akunnya.
    meaning:
      ar_eg: لو حد فضل يشتمك، اعمل لحسابه ___ وخلاص.
      ar: إن ظلّ أحد يشتمك ف___ حسابه وحسب.
      en: If someone keeps insulting you, just ___ their account.
    options: [blokir, pemalsuan, deepfake]
    answers: [blokir]
    words: [blokir, pemalsuan, deepfake]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه العلامة الزرقا مش كفاية؟
      ar: لماذا لا تكفي العلامة الزرقاء؟
      en: Why isn't a blue tick enough?
    options: [Karena akun terverifikasi juga bisa menyebar hoaks., Karena warnanya jelek., Karena hanya untuk artis.]
    answer: 0
    explain:
      ar_eg: حتى الحساب الموثّق ممكن ينشر كدب.
      ar: حتى الحساب الموثّق قد ينشر الكذب.
      en: Even a verified account can spread falsehoods.
    words: [centang biru, terverifikasi]
  - id: e06
    type: fill_blank
    sentence: Polisi menyelidiki ___ dokumen di media sosial.
    meaning:
      ar_eg: البوليس بيحقّق في ___ مستندات على السوشيال ميديا.
      ar: تحقّق الشرطة في ___ وثائق على وسائل التواصل.
      en: Police are investigating the ___ of documents on social media.
    options: [pemalsuan, pasukan siber, centang biru]
    answers: [pemalsuan]
    words: [pemalsuan, pasukan siber, centang biru]
  - id: e07
    type: build_sentence
    source:
      ar_eg: جيش إلكتروني هاجم الصحفية دي.
      ar: هاجم جيش إلكتروني تلك الصحفية.
      en: Cyber troops attacked that journalist.
    answer: Pasukan siber menyerang wartawan itu.
    distractors: [pendengung, akun palsu]
    words: [pasukan siber]
  - id: e08
    type: translate
    direction: from_target
    source_text: Suara dalam rekaman itu ternyata deepfake.
    answers_meaning:
      ar_eg: [الصوت اللي في التسجيل ده طلع متزيّف بالذكاء الاصطناعي, الصوت في التسجيل طلع ديب فيك]
      ar: [تبيّن أنّ الصوت في ذلك التسجيل مزيّف بالذكاء الاصطناعي, كان الصوت في التسجيل تزييفًا عميقًا]
      en: [The voice in that recording turned out to be a deepfake, 'That recording''s voice was actually a deepfake']
    words: [deepfake]
  - id: e09
    type: speaking
    text: Akun palsu tidak bisa terverifikasi dengan jujur.
    meaning:
      ar_eg: الحساب الفيك ما ينفعش يتوثّق بأمانة.
      ar: لا يمكن توثيق حساب مزيّف بصدق.
      en: A fake account can't be honestly verified.
    words: [akun palsu, terverifikasi]
  - id: e10
    type: multiple_choice
    question: Mana tanda akun palsu yang paling kuat?
    options: [Banyak foto keluarga., Akun baru tanpa foto asli yang mengunggah ratusan komentar sama., Centang biru.]
    answer: 1
    explain:
      ar_eg: حساب جديد من غير صورة وبيكرّر نفس التعليق = غالبًا فيك.
      ar: حساب جديد بلا صورة حقيقية يكرّر التعليق نفسه = غالبًا مزيّف.
      en: A new account with no real photo posting identical comments = likely fake.
    words: [akun palsu, centang biru, pendengung, pasukan siber, deepfake, blokir]
dialogue:
  lines:
    - speaker: Kak Selvi
      text: Lihat, tagar ini naik dalam satu jam. Aneh, kan?
      ar_eg: بص، الهاشتاج ده طلع في ساعة واحدة. غريبة، صح؟
      ar: انظر، صعد هذا الوسم في ساعة واحدة. غريب، أليس كذلك؟
      en: Look, this hashtag shot up in one hour. Odd, isn't it?
    - speaker: Mohamed
      text: Banyak akunnya baru dan fotonya sama. Ini akun palsu?
      ar_eg: حسابات كتير جديدة وصورها شبه بعض. دي حسابات فيك؟
      ar: حسابات كثيرة جديدة وصورها متشابهة. أهي مزيّفة؟
      en: Lots of the accounts are new with the same photo. Fake accounts?
    - speaker: Kak Selvi
      text: Kemungkinan besar. Mungkin ada pendengung yang dibayar.
      ar_eg: على الأغلب. يمكن فيه بازرز واخدين فلوس.
      ar: على الأرجح، وربما وراءها مروّجون مأجورون.
      en: Most likely. Maybe paid buzzers.
    - speaker: Mohamed
      text: Terus video menteri itu? Suaranya kedengaran aneh.
      ar_eg: وفيديو الوزير ده؟ صوته غريب.
      ar: وماذا عن مقطع الوزير؟ صوته غريب.
      en: And the minister's video? His voice sounds strange.
    - speaker: Kak Selvi
      text: Kita cek dulu. Kalau deepfake, kita tulis berita cek fakta.
      ar_eg: نتأكّد الأول. لو طلع ديب فيك، نكتب خبر تدقيق.
      ar: سنتحقّق أوّلًا، فإن كان مزيّفًا كتبنا خبر تدقيق.
      en: We check first. If it's a deepfake, we write a fact-check.
