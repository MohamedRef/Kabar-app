schema: kabar.lesson/v1
id: bipa5.u07.l04
language: id
title: Cita rasa
can_do:
  ar_eg: توصف طعم أكلة وتوابلها وطريقة تحضيرها بدقة.
  ar: أن تصف طعم طبق وتوابله وطريقة إعداده بدقّة.
  en: Describe a dish's flavour, seasoning and preparation precisely.
slides:
  - title: Lada, santan, dan bumbu
    body:
      ar_eg: |
        عشان توصف أكل زي ناقد، محتاج الكلام ده:
        - cita rasa = الطعم المميز (مش بس «rasa»)
        - bumbu = تتبيلة / خلطة توابل مطحونة
        - lada = فلفل أسود. وفي القرن ١٧ بنجرماسين كانت بتصدّره لتجار أوروبا والصين!
        - santan = لبن جوز الهند، بيخلي المرقة تقيلة وطعمها مسبّك (gurih)
        - mengolah = يحضّر / يطبخ (من olah): mengolah ikan = يجهّز السمك
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: banget = sekali، aja = saja، dikit = sedikit، terus = lalu، buat = untuk.
      ar: |
        لتصف الطعام كناقد، تحتاج إلى هذه الكلمات:
        - cita rasa = النكهة المميّزة (أدقّ من «rasa»)
        - bumbu = تتبيلة، خلطة توابل مطحونة
        - lada = الفلفل الأسود، وكانت بنجرماسين في القرن السابع عشر تصدّره إلى تجّار أوروبا والصين!
        - santan = حليب جوز الهند، يكثّف المرق ويمنحه مذاقًا غنيًّا (gurih)
        - mengolah = يُعِدّ، يطهو (من olah): mengolah ikan = يُعِدّ السمك
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: banget = sekali، aja = saja، dikit = sedikit، terus = lalu، buat = untuk.
      en: |
        To describe food like a critic, you need:
        - cita rasa = distinctive flavour (more precise than «rasa»)
        - bumbu = seasoning paste, ground spice mix
        - lada = black pepper; in the 17th century Banjarmasin exported it to European and Chinese traders!
        - santan = coconut milk, which makes broth thick and savoury (gurih)
        - mengolah = to prepare, to cook (from olah): mengolah ikan = to prepare fish
        The dialogue uses street forms; the formal ones are beside them: banget = sekali, aja = saja, dikit = sedikit, terus = lalu, buat = untuk.
    examples:
      - text: Ketupat Kandangan punya cita rasa gurih karena kuah santannya.
        ar_eg: كتوبات كاندانجان طعمه مسبّك بسبب مرقة لبن جوز الهند.
        ar: لكتوبات كاندانغان نكهة غنيّة بفضل مرقه بحليب جوز الهند.
        en: Ketupat Kandangan tastes rich thanks to its coconut-milk broth.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: cita rasa
        ar_eg: الطعم المميز
        ar: نكهة مميّزة
        en: distinctive flavour
      - text: bumbu
        ar_eg: تتبيلة
        ar: تتبيلة
        en: seasoning paste
      - text: lada
        ar_eg: فلفل أسود
        ar: فلفل أسود
        en: black pepper
      - text: mengolah
        ar_eg: يحضّر الأكل
        ar: يُعِدّ الطعام
        en: to prepare (food)
      - text: santan
        ar_eg: لبن جوز الهند
        ar: حليب جوز الهند
        en: coconut milk
    words: [cita rasa, bumbu, lada, mengolah, santan]
  - id: e02
    type: listen
    text: Ketupat Kandangan dimasak dengan kuah santan dan ikan haruan.
    question:
      ar_eg: الطبق ده بيتطبخ بإيه؟
      ar: بماذا يُطهى هذا الطبق؟
      en: What is this dish cooked with?
    options:
      - بمرقة لبن جوز الهند وسمك.
      - بلحمة وطماطم.
      - بفراخ وصويا.
    answer: 0
    words: [santan]
  - id: e03
    type: fill_blank
    sentence: Pada abad ke-17, Banjarmasin menjual ___ kepada pedagang Eropa dan Cina.
    meaning:
      ar_eg: في القرن ١٧، بنجرماسين كانت بتبيع فلفل أسود لتجار أوروبا والصين.
      ar: في القرن السابع عشر، كانت بنجرماسين تبيع الفلفل الأسود لتجّار أوروبا والصين.
      en: In the 17th century, Banjarmasin sold pepper to European and Chinese traders.
    options: [lada, santan, bumbu]
    answers: [lada]
    words: [lada, pedagang]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: «cita rasa» معناها إيه؟
      ar: ما معنى «cita rasa»؟
      en: What does "cita rasa" mean?
    options:
      - ريحة.
      - طعم ونكهة مميزة.
      - لون الأكل.
    answer: 1
    words: [cita rasa]
  - id: e05
    type: build_sentence
    source:
      ar_eg: التتبيلة دي بتخلّي الشوربة ريحتها حلوة.
      ar: هذه التتبيلة تجعل الحساء طيّب الرائحة.
      en: This seasoning makes the soup fragrant.
    answer: Bumbu ini membuat sup harum.
    distractors: [santan, mengolah]
    words: [bumbu, harum]
  - id: e06
    type: translate
    direction: from_target
    source_text: Ibu saya mengolah ikan dengan bumbu kuning.
    answers_meaning:
      ar_eg:
        - أمي بتحضّر السمك بتتبيلة صفرا.
        - ماما بتطبخ السمك بالتتبيلة الصفرا.
      ar:
        - تُعِدّ أمّي السمك بتتبيلة صفراء.
        - تطهو والدتي السمك بخلطة توابل صفراء.
      en:
        - My mother prepares fish with yellow spice paste.
        - My mum cooks fish with a yellow seasoning.
    words: [mengolah, bumbu]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «Masakan Banjar punya cita rasa manis dan gurih.» معناها إيه؟
      ar: ما معنى «Masakan Banjar punya cita rasa manis dan gurih.»؟
      en: What does "Masakan Banjar punya cita rasa manis dan gurih." mean?
    options:
      - الأكل البنجاري حادق ومر.
      - الأكل البنجاري مالوش طعم.
      - الأكل البنجاري طعمه فيه حلاوة وتسبيكة.
    answer: 2
    explain:
      ar_eg: gurih = الطعم المالح الغني (زي المرقة المسبّكة)، مش «حادق» بس.
      ar: gurih = المذاق المالح الغنيّ كالمرق المركّز.
      en: gurih is the rich, savoury taste of a good broth.
    words: [cita rasa]
  - id: e08
    type: speaking
    text: Santan membuat kuahnya kental dan gurih.
    meaning:
      ar_eg: لبن جوز الهند بيخلي المرقة تقيلة ومسبّكة.
      ar: يجعل حليب جوز الهند المرق كثيفًا غنيّ المذاق.
      en: Coconut milk makes the broth thick and savoury.
    words: [santan]
  - id: e09
    type: dictation
    text: Lada hitam memberi cita rasa pedas pada soto.
    meaning:
      ar_eg: الفلفل الأسود بيدي الشوربة طعم حراق.
      ar: يمنح الفلفل الأسود الحساءَ نكهة حارّة.
      en: Black pepper gives the soto a hot flavour.
    words: [lada, cita rasa]
  - id: e10
    type: fill_blank
    sentence: Nenek saya ___ ikan haruan menjadi masakan yang lezat.
    meaning:
      ar_eg: جدتي بتحضّر سمك الهاروان وتعمله أكلة تحفة.
      ar: تُعِدّ جدّتي سمك الهاروان طبقًا لذيذًا.
      en: My grandmother turns haruan fish into a delicious dish.
    options: [mengolah, santan, lada]
    answers: [mengolah]
    words: [mengolah]
dialogue:
  title: Ketupat Kandangan
  lines:
    - speaker: Rina
      text: Ini ketupat Kandangan, Mohamed. Kuahnya dari santan, lho.
      ar_eg: ده كتوبات كاندانجان يا محمد. المرقة بلبن جوز الهند.
      ar: هذا كتوبات كاندانغان يا محمد، ومرقه بحليب جوز الهند.
      en: This is ketupat Kandangan, Mohamed. The broth is coconut milk.
    - speaker: Mohamed
      text: Cita rasanya gurih banget. Bumbunya apa aja?
      ar_eg: طعمه مسبّك أوي. التتبيلة فيها إيه؟
      ar: نكهته غنيّة جدًا. ما مكوّنات تتبيلته؟
      en: It tastes so rich. What's in the seasoning?
    - speaker: Rina
      text: Bawang, kunyit, sama lada dikit. Ikannya dibakar dulu, terus masuk ke santan.
      ar_eg: بصل وكركم وشوية فلفل أسود. والسمك بيتشوي الأول، وبعدين يدخل في لبن جوز الهند.
      ar: بصل وكركم وقليل من الفلفل الأسود، ويُشوى السمك أولًا ثم يوضع في حليب جوز الهند.
      en: Shallots, turmeric and a little pepper. The fish is grilled first, then goes into the coconut milk.
    - speaker: Mohamed
      text: Di Mesir jarang banget pakai santan. Ini pengalaman baru buat lidahku!
      ar_eg: في مصر نادرًا ما بنستخدم لبن جوز الهند. دي تجربة جديدة للساني!
      ar: في مصر قلّما نستعمل حليب جوز الهند، فهذه تجربة جديدة على لساني!
      en: In Egypt we rarely use coconut milk. This is new for my tongue!
