schema: kabar.lesson/v1
id: bipa7.u05.l10
language: id
title: Jejak purbakala
can_do:
  ar_eg: توصف آثار وموقع حفريات وتسأل الأسئلة الصح عن مصدر قديم.
  ar: أن تصف آثارًا وموقع تنقيب وتطرح الأسئلة الصحيحة عن مصدر قديم.
  en: Describe ancient remains and a dig site, and ask the right questions about an old source.
slides:
  - title: Sumber sejarah tertua
    body:
      ar_eg: |
        قبل الكتابة كان فيه zaman prasejarah (ما قبل التاريخ).
        في ترينيل وسانجيران في جاوة لقوا عضم manusia purba (الإنسان البدائي): Homo erectus.
        رسومات الكهوف في ماروس بسولاويسي من أقدم الرسومات في العالم.
        وكلمة purbakala = العصور القديمة وآثارها.
        في بوروبودور آلاف الـ relief (نقوش بارزة) وتماثيل arca لبوذا.
        naskah kuno = مخطوطة قديمة على ورق نخل (lontar). epigrafi = علم قراءة النقوش.
        قبل ما تستخدم مصدر، اسأل: هل هو otentik (أصلي)؟
        - في الكلام: gimana = bagaimana.
      ar: |
        قبل الكتابة كان zaman prasejarah (عصر ما قبل التاريخ).
        في ترينيل وسانغيران بجاوة عُثر على عظام manusia purba: الإنسان المنتصب.
        ورسوم الكهوف في ماروس بسولاويسي من أقدم الرسوم في العالم.
        وكلمة purbakala تعني العصور القديمة وآثارها.
        في بوروبودور آلاف الـ relief (النقوش البارزة) وتماثيل arca لبوذا.
        naskah kuno = مخطوط قديم على سعف النخيل (lontar). epigrafi = علم النقوش.
        وقبل الاعتماد على مصدر اسأل: أهو otentik (أصيل)؟
        - في الكلام اليومي: gimana = bagaimana.
      en: |
        Before writing came the zaman prasejarah (prehistory).
        At Trinil and Sangiran in Java, bones of manusia purba (early humans) were found: Homo erectus.
        The cave paintings of Maros in Sulawesi are among the oldest in the world.
        purbakala means antiquity and its remains.
        Borobudur has thousands of relief panels and arca (statues) of the Buddha.
        naskah kuno = an ancient manuscript, often on palm leaf (lontar). epigrafi = the study of inscriptions.
        Before using a source, ask: is it otentik (authentic)?
        - In speech: gimana = bagaimana.
    examples:
      - text: Fosil manusia purba ditemukan di Sangiran.
        ar_eg: اتلقت حفريات إنسان بدائي في سانجيران.
        ar: عُثر على أحافير الإنسان القديم في سانغيران.
        en: Fossils of early humans were found at Sangiran.
      - text: Relief di dinding candi menceritakan kehidupan Buddha.
        ar_eg: النقوش اللي على حيطة المعبد بتحكي حياة بوذا.
        ar: تروي النقوش على جدران المعبد حياة بوذا.
        en: The reliefs on the temple walls tell the life of the Buddha.
      - text: Ahli epigrafi membaca prasasti itu huruf demi huruf.
        ar_eg: عالم النقوش قرا النقش حرف حرف.
        ar: قرأ عالم النقوش الكتابة حرفًا حرفًا.
        en: The epigraphist read the inscription letter by letter.
exercises:
  - id: e01
    type: match_pairs
    pairs:
