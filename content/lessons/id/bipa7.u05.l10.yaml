        ar_eg: العصور القديمة / الآثار
        ar: العصور القديمة، الآثار
        en: antiquity
      - text: prasejarah
        ar_eg: ما قبل التاريخ
        ar: ما قبل التاريخ
        en: prehistory
      - text: manusia purba
        ar_eg: الإنسان البدائي
        ar: الإنسان القديم
        en: early human, hominin
      - text: arca
        ar_eg: تمثال (حجر قديم)
        ar: تمثال
        en: statue (ancient)
    words: [purbakala, prasejarah, manusia purba, arca]
  - id: e02
    type: match_pairs
    pairs:
      - text: relief
        ar_eg: نقش بارز على الحجر
        ar: نقش بارز
        en: relief carving
      - text: naskah kuno
        ar_eg: مخطوطة قديمة
        ar: مخطوط قديم
        en: ancient manuscript
      - text: epigrafi
        ar_eg: علم قراءة النقوش
        ar: علم النقوش
        en: epigraphy
      - text: otentik
        ar_eg: أصلي مش مزوّر
        ar: أصيل، غير مزوّر
        en: authentic
    words: [relief, naskah kuno, epigrafi, otentik]
  - id: e03
    type: listen
    text: Naskah kuno ini ditulis di atas daun lontar.
    question:
      ar_eg: إيه اللي مكتوب على ورق النخل؟
      ar: ما المكتوب على سعف النخيل؟
      en: What's written on palm leaves?
    options: [مخطوطة قديمة, تمثال, نقش بارز]
    answer: 0
    meaning:
      ar_eg: المخطوطة القديمة دي مكتوبة على ورق نخل.
      ar: كُتب هذا المخطوط القديم على سعف النخيل.
      en: This ancient manuscript was written on palm leaves.
    words: [naskah kuno]
  - id: e04
    type: fill_blank
    sentence: Lukisan gua di Maros berasal dari zaman ___.
    meaning:
      ar_eg: رسومات كهف ماروس من عصر ___.
      ar: تعود رسوم كهف ماروس إلى عصر ___.
      en: The Maros cave paintings date from ___.
    options: [prasejarah, otentik, epigrafi]
    answers: [prasejarah]
    words: [prasejarah, otentik, epigrafi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ليه لازم نسأل إذا المصدر «otentik»؟
      ar: لماذا نسأل إن كان المصدر «otentik»؟
      en: Why ask whether a source is 'otentik'?
    options: [Karena sumber palsu bisa menyesatkan sejarah., Karena semua sumber baru., Karena arca tidak bisa dibaca.]
    answer: 0
    explain:
      ar_eg: المصدر المزوّر ممكن يضلّل التاريخ.
      ar: قد يضلّل المصدر المزوّر التاريخ.
      en: A fake source can mislead history.
    words: [otentik, arca]
  - id: e06
    type: fill_blank
    sentence: Arca dan relief itu dijaga oleh dinas ___.
    meaning:
      ar_eg: التماثيل والنقوش دي بتحميها إدارة الـ ___.
      ar: تحمي إدارة ___ تلك التماثيل والنقوش.
      en: Those statues and reliefs are protected by the ___ office.
    options: [purbakala, manusia purba, naskah kuno]
    answers: [purbakala]
    words: [purbakala, manusia purba, naskah kuno, arca, relief]
  - id: e07
    type: build_sentence
    source:
      ar_eg: عالم النقوش بيقرا الحروف القديمة.
      ar: يقرأ عالم النقوش الحروف القديمة.
      en: Epigraphy reads the old letters.
    answer: Ahli epigrafi membaca huruf-huruf kuno.
    distractors: [relief, purbakala]
    words: [epigrafi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Manusia purba hidup di Jawa jauh sebelum zaman sejarah.
    answers_meaning:
      ar_eg: [الإنسان البدائي عاش في جاوة قبل عصر التاريخ بكتير, الإنسان القديم كان عايش في جاوة قبل التاريخ المكتوب بكتير]
      ar: [عاش الإنسان القديم في جاوة قبل العصر التاريخي بزمن طويل, سكن الإنسان القديم جاوة قبل عصور التاريخ بكثير]
      en: [Early humans lived in Java long before recorded history, Hominins lived in Java long before the historical era]
    words: [manusia purba]
  - id: e09
    type: speaking
    text: Relief Borobudur adalah peninggalan purbakala yang otentik.
    meaning:
      ar_eg: نقوش بوروبودور أثر قديم أصلي.
      ar: نقوش بوروبودور أثر قديم أصيل.
      en: Borobudur's reliefs are an authentic ancient legacy.
    words: [relief, otentik, purbakala]
  - id: e10
    type: multiple_choice
    question: Apa yang ditemukan di Trinil dan Sangiran?
    options: [Naskah kuno berbahasa Arab., Fosil manusia purba., Arca emas VOC.]
    answer: 1
    explain:
      ar_eg: في ترينيل وسانجيران لقوا عضم الإنسان البدائي.
      ar: في ترينيل وسانغيران عُثر على أحافير الإنسان القديم.
      en: Early human fossils were found there.
    words: [manusia purba, naskah kuno, arca, prasejarah, epigrafi]
dialogue:
  lines:
    - speaker: Pak Hasan
      text: Minggu depan kita ke Leang-Leang di Maros. Ada lukisan prasejarah di sana.
      ar_eg: الأسبوع الجاي هنروح ليانج ليانج في ماروس. فيه رسومات ما قبل التاريخ هناك.
      ar: سنذهب الأسبوع المقبل إلى ليانغ ليانغ في ماروس، ففيها رسوم من عصور ما قبل التاريخ.
      en: Next week we're going to Leang-Leang in Maros. There are prehistoric paintings there.
    - speaker: Mohamed
      text: Siapa yang membuatnya, Pak? Manusia purba?
      ar_eg: مين اللي رسمها يا أستاذ؟ الإنسان البدائي؟
      ar: من رسمها يا أستاذ؟ الإنسان القديم؟
      en: Who made them, sir? Early humans?
    - speaker: Pak Hasan
      text: Manusia modern awal, puluhan ribu tahun lalu. Ada gambar tangan dan babi.
      ar_eg: الإنسان الحديث الأول، من عشرات آلاف السنين. فيه رسم إيدين وخنازير.
      ar: الإنسان الحديث الأوّل قبل عشرات آلاف السنين، وفيها رسوم أيدٍ وخنازير.
      en: Early modern humans, tens of thousands of years ago. There are hand stencils and pigs.
    - speaker: Mohamed
      text: Gimana kita tahu lukisannya otentik?
      ar_eg: نعرف منين إن الرسومات أصلية؟
      ar: كيف نعرف أنّ الرسوم أصيلة؟
      en: How do we know the paintings are authentic?
    - speaker: Pak Hasan
      text: Para ahli purbakala mengukur usia lapisan batu di atasnya.
      ar_eg: علماء الآثار بيقيسوا عمر طبقة الحجر اللي فوقها.
      ar: يقيس علماء الآثار عمر طبقة الصخر التي تعلوها.
      en: Archaeologists date the layer of rock on top of them.
