schema: kabar.lesson/v1
id: bipa5.u09.l10
language: id
title: Salah kaprah
can_do:
  ar_eg: تصلّح الأغلاط المنتشرة في الإندونيسي الفصيح، والعربي يساعدك.
  ar: أن تصحّح الأخطاء الشائعة في الإندونيسية الفصحى، مستعينًا بالعربية.
  en: Fix common mistakes in standard Indonesian, with Arabic as your helper.
slides:
  - title: Salah, tetapi sudah biasa
    grammar: id.register.formal-informal
    body:
      ar_eg: |
        salah kaprah = غلطة منتشرة لدرجة إن الناس فاكراها صح. في الرسمي اكتب الـ ejaan (الإملا) الصح:
        - merubah ✗ → mengubah ✓ (الأصل ubah)
        - silahkan ✗ → silakan ✓
        - dimana ✗ → di mana ✓ (di حرف جر، بينفصل)
        والعربي بيساعدك هنا: ijin ✗ → izin ✓ (إذن)، jaman ✗ → zaman ✓ (زمان)، nasehat ✗ → nasihat ✓ (نصيحة).
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: nggak = tidak، aku = saya، banget = sekali، cuma = hanya، kukira = saya kira، bener = benar، nulis = menulis، gitu = begitu.
      ar: |
        salah kaprah = خطأ شاع حتى ظنّه الناس صوابًا. واكتب في المقام الرسمي بالـ ejaan (الإملاء) الصحيح:
        - merubah ✗ → mengubah ✓ (الأصل ubah)
        - silahkan ✗ → silakan ✓
        - dimana ✗ → di mana ✓ (di حرف جرّ منفصل)
        والعربية تعينك: ijin ✗ → izin ✓ (إذن)، وjaman ✗ → zaman ✓ (زمان)، وnasehat ✗ → nasihat ✓ (نصيحة).
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: nggak = tidak، aku = saya، banget = sekali، cuma = hanya، kukira = saya kira، bener = benar، nulis = menulis، gitu = begitu.
      en: |
        salah kaprah = a mistake so common people think it's right. In formal writing use the correct ejaan (spelling):
        - merubah ✗ → mengubah ✓ (root ubah)
        - silahkan ✗ → silakan ✓
        - dimana ✗ → di mana ✓ (di is a preposition, written apart)
        Arabic helps here: ijin ✗ → izin ✓ (idhn), jaman ✗ → zaman ✓ (zamān), nasehat ✗ → nasihat ✓ (naṣīḥa).
        The dialogue uses street forms; the formal ones are beside them: nggak = tidak, aku = saya, banget = sekali, cuma = hanya, kukira = saya kira, bener = benar, nulis = menulis, gitu = begitu.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: salah kaprah
        ar_eg: غلطة منتشرة
        ar: خطأ شائع
        en: common mistake
      - text: ejaan
        ar_eg: إملا
        ar: إملاء
        en: spelling
      - text: kesalahan
        ar_eg: غلطة
        ar: خطأ
        en: mistake, error
      - text: mengubah
        ar_eg: يغيّر
        ar: يغيّر
        en: to change (something)
      - text: izin
        ar_eg: إذن
        ar: إذن
        en: permission
    words: [salah kaprah, ejaan, kesalahan, mengubah, izin]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي إملا صح؟
      ar: أيّ إملاء صحيح؟
      en: Which spelling is correct?
    options: [idzin, ijin, izin]
    answer: 2
    words: [izin, ejaan]
    explain:
      ar_eg: الإملا القياسي izin. ijin وidzin أخطاء منتشرة.
      ar: الإملاء القياسي izin، أما ijin وidzin فخطآن شائعان.
      en: The standard spelling is izin. ijin and idzin are common mistakes.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة إملاها صح؟
      ar: أيّ جملة إملاؤها صحيح؟
      en: Which sentence is spelled correctly?
    options:
      - Kita harus merubah jadwal.
      - Kita harus mengubah jadwal.
      - Kita harus mengrubah jadwal.
    answer: 1
    words: [mengubah, salah kaprah]
    explain:
      ar_eg: الصح mengubah (meng- + ubah). merubah غلط منتشر (salah kaprah)، وmengrubah مش كلمة.
      ar: الصواب mengubah (meng- + ubah). أما merubah فخطأ شائع، وmengrubah ليست كلمة.
      en: Correct is mengubah (meng- + ubah). merubah is a common error, and mengrubah isn't a word.
  - id: e04
    type: fill_blank
    sentence: Guru itu melihat tiga ___ ejaan dalam surat saya.
    meaning:
      ar_eg: المدرّس لقى 3 غلطات إملا في جوابي.
      ar: وجد المعلّم ثلاثة أخطاء إملائية في رسالتي.
      en: The teacher found three spelling mistakes in my letter.
    options: [kesalahan, izin, salah kaprah]
    answers: [kesalahan]
    words: [kesalahan, ejaan]
    explain:
      ar_eg: «غلطات» تتعد = kesalahan. izin = إذن، وsalah kaprah = غلط منتشر في الناس كلها، مش في جواب واحد.
      ar: «الأخطاء» = kesalahan. أما izin فالإذن، وsalah kaprah الخطأ الشائع بين الناس لا في رسالة واحدة.
      en: Countable "mistakes" is kesalahan. izin is permission, and salah kaprah is a widespread error, not three in a letter.
  - id: e05
    type: listen
    text: Saya minta izin pulang lebih awal hari ini. Anak saya sakit, dan saya harus membawanya ke dokter jam tiga.
    question:
      ar_eg: المتكلم عايز إيه، وليه؟
      ar: ماذا يطلب المتكلّم، ولماذا؟
      en: What does the speaker want, and why?
    options:
      - Pulang lebih cepat karena harus membawa anaknya ke dokter.
      - Libur seminggu karena dia sendiri sakit.
      - Pindah ke kantor baru jam tiga.
    answer: 0
    meaning:
      ar_eg: عايز إذن أروّح بدري النهارده. ابني عيّان، ولازم أوديه للدكتور الساعة تلاتة.
      ar: أستأذن في الانصراف مبكّرًا اليوم؛ ابني مريض وعليّ أن آخذه إلى الطبيب في الثالثة.
      en: I'd like permission to leave early today. My child is sick, and I have to take them to the doctor at three.
    explain:
      ar_eg: minta izin pulang lebih awal = بيطلب إذن يروّح بدري، والسبب anak saya sakit = ابنه عيّان. هو نفسه مش عيّان.
      ar: minta izin pulang lebih awal = يستأذن في الانصراف مبكّرًا، والسبب anak saya sakit = ابنه مريض لا هو.
      en: "minta izin pulang lebih awal = asks to leave early; the reason: anak saya sakit = his child is sick, not him."
    words: [izin]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الغلطة المنتشرة دي صعب تتغيّر.
      ar: يصعب تغيير هذا الخطأ الشائع.
      en: This common mistake is hard to change.
    answer: Salah kaprah ini sulit diubah.
    distractors: [izin, ejaan]
    words: [salah kaprah, mengubah]
    explain:
      ar_eg: «الغلطة المنتشرة» = Salah kaprah و«صعب تتغيّر» = sulit diubah. izin = إذن وejaan = إملا، مش في الجملة.
      ar: «الخطأ الشائع» = Salah kaprah و«يصعب تغييره» = sulit diubah. أما izin فالإذن، وejaan الإملاء.
      en: "\"Common mistake\" is salah kaprah and \"hard to change\" sulit diubah. izin and ejaan aren't in it."
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: العربي بيساعدني أكتب الإملا الصح.
      ar: تساعدني العربية على كتابة الإملاء الصحيح.
      en: Arabic helps me write the correct spelling.
    answers:
      - Bahasa Arab membantu saya menulis ejaan yang benar.
      - Bahasa Arab membantu saya menulis dengan ejaan yang benar.
      - Bahasa Arab menolong saya menulis ejaan yang benar.
      - Bahasa Arab membantuku menulis ejaan yang benar.
    words: [ejaan]
  - id: e08
    type: speaking
    text: Maaf, boleh saya mengubah kesalahan kecil di surat ini?
    meaning:
      ar_eg: لا مؤاخذة، ممكن أغيّر غلطة صغيرة في الجواب ده؟
      ar: عذرًا، هل يمكنني تغيير خطأ صغير في هذه الرسالة؟
      en: Excuse me, may I change a small mistake in this letter?
    words: [mengubah, kesalahan]
  - id: e09
    type: dictation
    text: Pada zaman dulu, nasihat orang tua sangat dihormati, sehingga anak muda jarang membantah.
    meaning:
      ar_eg: زمان، نصيحة الكبار كان ليها احترام كبير، فالشباب نادرًا لما كانوا بيعترضوا.
      ar: كانت نصيحة الكبار في الزمن الماضي محترمة جدًّا، حتى إنّ الشباب نادرًا ما يعترضون.
      en: In the old days, elders' advice was greatly respected, so young people rarely argued back.
    words: [ejaan]
dialogue:
  title: Surat untuk kantor imigrasi
  lines:
    - speaker: Mohamed
      text: Mas Rizal, bisa cek suratku nggak? Aku minta izin tinggal lebih lama.
      ar_eg: يا ريزال، ممكن تراجع جوابي؟ بطلب إذن أقعد مدة أطول.
      ar: هل تراجع رسالتي؟ أطلب إذنًا بالإقامة مدّة أطول.
      en: Mas Rizal, could you check my letter? I'm asking for permission to stay longer.
    - speaker: Mas Rizal
      text: Bagus banget. Cuma ada satu kesalahan, "silahkan" harusnya "silakan".
      ar_eg: حلو جدًا. فيه غلطة واحدة بس، silahkan المفروض تبقى silakan.
      ar: ممتازة. فيها خطأ واحد فقط، silahkan صوابها silakan.
      en: Very good. There's just one mistake; "silahkan" should be "silakan".
    - speaker: Mohamed
      text: Wah, kukira itu bener. Banyak orang nulis gitu, kok!
      ar_eg: يا خبر، أنا كنت فاكرها صح. ناس كتير بتكتبها كده!
      ar: عجبًا، ظننتها صحيحة، فكثيرون يكتبونها هكذا!
      en: Oh, I thought that was right. Lots of people write it that way!
    - speaker: Mas Rizal
      text: Nah, itu salah kaprah. Tapi tulisan "izin" sama "zaman" kamu udah sempurna.
      ar_eg: هي دي الغلطة المنتشرة. بس izin وzaman عندك مظبوطين تمامًا.
      ar: هذا هو الخطأ الشائع. لكنّ izin وzaman عندك صحيحتان تمامًا.
      en: That's a salah kaprah. But your "izin" and "zaman" are perfect.
