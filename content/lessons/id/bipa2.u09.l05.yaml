dialogue:
  title: Di kos Bu Sari, setelah liburan
  lines:
    - speaker: Bu Sari
      text: Rina, Ibu sudah membaca tulisanmu tentang Lovina. Seru sekali!
      ar_eg: يا رينا، أنا قريت البوست بتاعك عن لوفينا. يجنن!
      ar: يا رينا، قرأتُ ما كتبتِه عن لوفينا. مثير جدًا!
      en: Rina, I read your post about Lovina. So exciting!
    - speaker: Rina
      text: Terima kasih, Bu! Pasirnya hitam, lho. Bagus untuk foto.
      ar_eg: شكرًا يا طنط! على فكرة الرملة سودا. حلوة للتصوير.
      ar: شكرًا يا سيدتي! الرمل أسود، صدّقيني. جميل للتصوير.
      en: Thank you! The sand is black, you know. Great for photos.
    - speaker: Mohamed
      text: Lho, kameramu ketinggalan, kan?
      ar_eg: إيه ده، مش الكاميرا بتاعتك اتنسيت؟
      ar: مهلًا، ألم تنسي الكاميرا؟
      en: Hang on, didn't you leave your camera behind?
    - speaker: Rina
      text: Iya, aduh! Tapi foto pakai HP juga bagus.
      ar_eg: أيوه، يا خسارة! بس صور الموبايل حلوة برضه.
      ar: نعم، للأسف! لكن صور الهاتف جميلة أيضًا.
      en: Yes, ugh! But the phone photos are nice too.
    - speaker: Bu Sari
      text: Pak Mohamed, Bapak melihat lumba-lumba?
      ar_eg: يا أستاذ محمد، شفت دلافين؟
      ar: يا أستاذ محمد، هل رأيت دلافين؟
      en: Mohamed, did you see dolphins?
    - speaker: Mohamed
      text: Banyak sekali, Bu! Pertama kami naik perahu, lalu lumba-lumbanya datang.
      ar_eg: كتير أوي يا طنط! الأول ركبنا مركب، وبعدين الدلافين جت.
      ar: كثيرة جدًا يا سيدتي! أولًا ركبنا القارب، ثم جاءت الدلافين.
      en: Loads! First we took a boat, then the dolphins came.
