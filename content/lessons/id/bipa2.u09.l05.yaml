schema: kabar.lesson/v1
id: bipa2.u09.l05
language: id
title: Pesta di Ubud
can_do:
  ar_eg: تختار لبس لحفلة، وتتكلم عن الحرير والفضة والإزاز والحجر.
  ar: أن تختار ملابس لحفل، وتتحدث عن الحرير والفضة والزجاج والحجر.
  en: Choose clothes for a party and talk about silk, silver, glass and stone.
slides:
  - title: Ke pesta
    body:
      ar_eg: |
        gaun = فستان سهرة، jas = جاكت بدلة، kemeja = قميص بزراير، dasi = كرافتة.
        sutra = حرير، perak = فضة (Celuk في بالي = قرية الفضة)، batu = حجر: perak dengan batu biru.
        kaca = إزاز، وفاكر kacamata؟ = نضارة («إزاز العين»).
      ar: |
        gaun = فستان سهرة، jas = سترة البدلة، kemeja = قميص بأزرار، dasi = ربطة عنق.
        sutra = حرير، perak = فضّة (قرية Celuk في بالي مشهورة بالفضّة)، batu = حجر: perak dengan batu biru.
        kaca = زجاج، وتذكّر kacamata = نظارة («زجاج العين»).
      en: |
        gaun = gown, dress, jas = suit jacket, kemeja = shirt (with buttons), dasi = tie.
        sutra = silk, perak = silver (Celuk in Bali is the silver village), batu = stone: perak dengan batu biru.
        kaca = glass; remember kacamata = glasses ("eye glass").
    examples:
      - text: Ke pesta, saya pakai kemeja putih dan dasi.
        ar_eg: في الحفلة هلبس قميص أبيض وكرافتة.
        ar: ألبس في الحفل قميصًا أبيض وربطة عنق.
        en: For the party I'll wear a white shirt and tie.
      - text: Gaun Rina dari sutra.
        ar_eg: فستان رينا حرير.
        ar: فستان رينا من الحرير.
        en: Rina's dress is silk.
      - text: Di Celuk ada banyak toko perak.
        ar_eg: في تشيلوك فيه محلات فضة كتير.
        ar: في تشيلوك متاجر فضة كثيرة.
        en: Celuk has lots of silver shops.
