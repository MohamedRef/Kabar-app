schema: kabar.lesson/v1
id: bipa2.u09.l05
language: id
title: Tulisan Rina tentang Lovina
can_do:
  ar_eg: تقرا بوست قصير عن أجازة وتفهم حصل إيه وبالترتيب، وترد عليه.
  ar: أن تقرأ منشورًا قصيرًا عن عطلة وتفهم أحداثه بالترتيب وتتحدث عنه.
  en: Read a short holiday post and talk about it.
slides:
  - title: Tulisan Rina tentang Lovina
    body:
      ar_eg: |
        رينا كتبت بوست قصير عن أجازتها في لوفينا، بالإندونيسي العادي مش بلغة الشات. اقراه ودوّر على: wah و aduh، وكلمات الترتيب pertama و lalu.
        كلمتين جداد: pasir (رملة) و hitam (أسود). شط لوفينا رملته سودا عشان هي رملة بركانية.
      ar: |
        كتبت رينا منشورًا قصيرًا عن عطلتها في لوفينا، بالإندونيسية العادية لا بلغة المحادثة. اقرأه وابحث عن: wah و aduh، وكلمتي الترتيب pertama و lalu.
        كلمتان جديدتان: pasir (رمل) و hitam (أسود). رمل شاطئ لوفينا أسود لأنه رمل بركاني.
      en: |
        Rina wrote a short post about her holiday in Lovina, in normal Indonesian, not chat spelling. Read it and spot wah and aduh, and the order words pertama and lalu.
        Two new words: pasir (sand) and hitam (black). Lovina's beach has black volcanic sand.
    examples:
      - text: Wah, liburan di Lovina menyenangkan sekali! Pasir pantainya hitam, dan lautnya tenang.
        ar_eg: ياه، الأجازة في لوفينا كانت حلوة أوي! رملة الشط سودا، والبحر هادي.
        ar: يا للروعة، كانت العطلة في لوفينا ممتعة جدًا! رمل الشاطئ أسود، والبحر هادئ.
        en: Wow, the holiday in Lovina was so much fun! The beach sand is black and the sea is calm.
      - text: Pertama, kami naik perahu jam enam pagi. Lalu, kami melihat banyak lumba-lumba.
        ar_eg: الأول، ركبنا مركب الساعة ستة الصبح. بعدين، شفنا دلافين كتير.
        ar: أولًا، ركبنا قاربًا في السادسة صباحًا. ثم رأينا دلافين كثيرة.
        en: First, we took a boat at six in the morning. Then we saw lots of dolphins.
      - text: Aduh, kamera saya ketinggalan di hotel! Jadi, saya memotret pakai HP. Capek, tapi seru!
        ar_eg: يا خبر، الكاميرا بتاعتي اتنسيت في الفندق! فصوّرت بالموبايل. تعبت، بس كانت تجنن!
        ar: آه، نسيت الكاميرا في الفندق! فصوّرت بالهاتف. كنت متعبة، لكنها كانت مثيرة!
        en: Oh no, I left my camera at the hotel! So I took photos with my phone. Tiring, but exciting!
