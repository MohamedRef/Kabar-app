schema: kabar.lesson/v1
id: bipa5.u07.l05
language: id
title: Halal dan tradisi
can_do:
  ar_eg: تتكلم بأدب عن قواعد الأكل الدينية والعادات، وتحترم اختلاف الناس.
  ar: أن تتحدّث بلباقة عن قواعد الطعام الدينية والعادات، مع احترام اختلاف الناس.
  en: Talk politely about religious food rules and customs, respecting differences.
slides:
  - title: Makanan, agama, dan adat
    body:
      ar_eg: |
        إندونيسيا أغلبها مسلمين، بس فيها مسيحيين وبوذيين وهندوس وديانات محلية، فالأكل ليه قواعد واحترام:
        - label halal = علامة حلال رسمية على المنتج أو المطعم
        - haram = حرام، وhalal = حلال (الكلمتين من العربي)
        - pantangan = أكل الواحد ممتنع عنه، لأي سبب: دين أو صحة أو عادة
        - selamatan = عزومة جماعية بدعاء عشان مناسبة: بيت جديد، مولود، سفر
        - menghidangkan = يقدّم الأكل للضيوف
      ar: |
        أغلب الإندونيسيين مسلمون، وفيها مسيحيون وبوذيون وهندوس وأديان محلية، فللطعام قواعد واحترام:
        - label halal = علامة حلال رسمية على المنتج أو المطعم
        - haram = حرام، وhalal = حلال (والكلمتان من العربية)
        - pantangan = طعام يمتنع عنه المرء لسبب ما: دين أو صحة أو عرف
        - selamatan = وليمة جماعية بدعاء لمناسبة: بيت جديد، مولود، سفر
        - menghidangkan = يقدّم الطعام للضيوف
      en: |
        Indonesia is mostly Muslim but also Christian, Buddhist, Hindu and home to local faiths, so food comes with rules and respect:
        - label halal = official halal label on a product or restaurant
        - haram = forbidden; halal = permitted (both from Arabic)
        - pantangan = food someone avoids, for religion, health or custom
        - selamatan = communal meal with prayers for an occasion: a new house, a birth, a journey
        - menghidangkan = to serve food to guests
    examples:
      - text: Tuan rumah menghidangkan nasi kuning dalam selamatan rumah baru.
        ar_eg: صاحب البيت قدّم رز أصفر في عزومة البيت الجديد.
        ar: قدّم صاحب البيت الأرزّ الأصفر في وليمة البيت الجديد.
        en: The host served yellow rice at the new-house selamatan.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: label halal
        ar_eg: علامة حلال
        ar: علامة حلال
        en: halal label
      - text: haram
        ar_eg: حرام
        ar: حرام
        en: forbidden
      - text: pantangan
        ar_eg: أكل ممتنع عنه
        ar: ما يُمتنع عنه
        en: food taboo, abstention
      - text: selamatan
        ar_eg: عزومة بدعاء
        ar: وليمة بدعاء
        en: communal prayer meal
      - text: menghidangkan
        ar_eg: يقدّم الأكل
        ar: يقدّم الطعام
        en: to serve (food)
    words: [label halal, haram, pantangan, selamatan, menghidangkan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Restoran ini punya label halal.» معناها إيه؟
      ar: ما معنى «Restoran ini punya label halal.»؟
      en: What does "Restoran ini punya label halal." mean?
    options:
      - المطعم ده مقفول.
      - المطعم ده عليه علامة حلال رسمية.
      - المطعم ده بيقدم خمرة.
    answer: 1
    words: [label halal]
  - id: e03
    type: listen
    text: Kakek saya punya pantangan. Beliau tidak makan daging kambing karena darah tinggi.
    question:
      ar_eg: ليه الجد مابياكلش لحمة ضاني؟
      ar: لماذا لا يأكل الجدّ لحم الضأن؟
      en: Why doesn't the grandfather eat mutton?
    options:
      - عشان حرام.
      - عشان غالية.
      - عشان عنده ضغط عالي.
    answer: 2
    words: [pantangan]
  - id: e04
    type: fill_blank
    sentence: Bagi umat Islam, daging babi ___.
    meaning:
      ar_eg: لحم الخنزير حرام على المسلمين.
      ar: لحم الخنزير حرام على المسلمين.
      en: For Muslims, pork is forbidden.
    options: [haram, halal, gurih]
    answers: [haram]
    words: [haram]
  - id: e05
    type: build_sentence
    source:
      ar_eg: بعد ما الجامع خلص، أهل الحتة عملوا عزومة بدعاء.
      ar: بعد اكتمال بناء المسجد، أقام الأهالي وليمة بدعاء.
      en: After the mosque was finished, the residents held a selamatan.
    answer: Setelah masjid selesai dibangun, warga mengadakan selamatan.
    distractors: [haram, pantangan]
    words: [selamatan]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الستات بيقدموا الأكل للضيوف.
      ar: تقدّم السيّدات الطعام للضيوف.
      en: The women serve food to the guests.
    answers:
      - Para ibu menghidangkan makanan untuk tamu.
      - Ibu-ibu menghidangkan makanan untuk para tamu.
      - Para ibu menghidangkan makanan kepada tamu.
      - Ibu-ibu menghidangkan makanan untuk tamu.
    words: [menghidangkan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة selamatan؟
      ar: أيّها selamatan؟
      en: Which one is a selamatan?
    options:
      - Makan bersama dan berdoa untuk rumah baru.
      - Makan siang sendirian di kantor.
      - Membeli makanan lewat ojek daring.
    answer: 0
    words: [selamatan]
  - id: e08
    type: speaking
    text: Kalau tamu punya pantangan, kita menghidangkan makanan lain.
    meaning:
      ar_eg: لو الضيف ممتنع عن أكلة، بنقدّمله أكل تاني.
      ar: إن كان للضيف طعام يمتنع عنه، قدّمنا له طعامًا آخر.
      en: If a guest avoids certain food, we serve something else.
    words: [pantangan, menghidangkan]
  - id: e09
    type: dictation
    text: Sebelum membeli, saya selalu mencari label halal.
    meaning:
      ar_eg: قبل ما أشتري، دايمًا بدوّر على علامة الحلال.
      ar: قبل الشراء أبحث دائمًا عن علامة الحلال.
      en: Before buying, I always look for the halal label.
    words: [label halal]
  - id: e10
    type: fill_blank
    sentence: Bagi tamu Muslim, alkohol ___, jadi tuan rumah tidak menghidangkannya.
    meaning:
      ar_eg: الخمرة حرام على الضيف المسلم، فصاحب البيت مابيقدّمهاش.
      ar: الخمر حرام على الضيف المسلم، فلا يقدّمها صاحب البيت.
      en: Alcohol is forbidden for a Muslim guest, so the host doesn't serve it.
    options: [haram, selamatan, label halal]
    answers: [haram]
    words: [haram, menghidangkan]
dialogue:
  title: Selamatan di rumah Bu Hamidah
  lines:
    - speaker: Bu Hamidah
      text: Silakan masuk, Pak Mohamed. Hari ini kami mengadakan selamatan untuk cucu kami.
      ar_eg: اتفضل يا أستاذ محمد. النهارده عاملين عزومة بدعاء عشان حفيدنا.
      ar: تفضّل يا أستاذ محمد. نقيم اليوم وليمة بدعاء من أجل حفيدنا.
      en: Please come in, Pak Mohamed. Today we're holding a selamatan for our grandchild.
    - speaker: Mohamed
      text: Terima kasih, Bu. Semoga cucunya sehat selalu.
      ar_eg: شكرًا يا حاجة. ربنا يخليه ويديله الصحة.
      ar: شكرًا يا سيدتي، أدام الله على حفيدك الصحّة.
      en: Thank you, ma'am. May your grandchild always be healthy.
    - speaker: Bu Hamidah
      text: Ayo makan. Semua yang kami hidangkan halal. Apakah Bapak punya pantangan?
      ar_eg: يلا كُل. كل اللي بنقدّمه حلال. حضرتك ممتنع عن أكل معين؟
      ar: هيّا كُل، فكلّ ما نقدّمه حلال. هل تمتنع عن طعام ما؟
      en: Come and eat. Everything we're serving is halal. Is there anything you don't eat?
    - speaker: Mohamed
      text: Tidak ada, Bu. Saya hanya tidak kuat makan yang terlalu pedas!
      ar_eg: لأ خالص يا حاجة. بس مش بستحمل الأكل الحراق أوي!
      ar: لا شيء يا سيدتي، غير أنّي لا أحتمل الطعام الحارّ جدًا!
      en: Nothing, ma'am. I just can't handle food that's too spicy!
