  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مَس رزال اشترالي قماشة منسوجة.
      ar: اشترى لي ماس رزال قماشًا منسوجًا.
      en: Mas Rizal bought me a woven cloth.
    answers:
      - Mas Rizal membelikan saya kain tenun.
      - Mas Rizal membelikan saya kain tenun
      - Mas Rizal membelikanku kain tenun.
      - Mas Rizal membelikan aku kain tenun.
      - Mas Rizal membeli kain tenun untuk saya.
      - Mas Rizal membeli kain tenun untukku.
    words: [membelikan, kain tenun]
  - id: e10
    type: speaking
    text: Tongkonan adalah warisan leluhur yang megah. Atapnya melengkung bagaikan perahu.
    meaning:
      ar_eg: التونجكونان تراث فخم من الأجداد. سقفه معووج كأنه مركب.
      ar: التونغكونان إرث فخم من الأسلاف، وسقفه ينحني كأنه قارب.
      en: The tongkonan is a magnificent ancestral heritage. Its roof curves like a boat.
    words: [warisan, megah, bagaikan]
dialogue:
  title: Telepon dari Toraja
  lines:
    - speaker: Rina
      text: Mohamed, bagaimana Toraja? Ceritakan, dong!
      ar_eg: يا محمد، توراجا عاملة إيه؟ احكيلي بقى!
      ar: يا محمد، كيف توراجا؟ احكِ لي!
      en: Mohamed, how's Toraja? Tell me all about it!
    - speaker: Mohamed
      text: Luar biasa! Rumah tongkonan megah sekali, atapnya melengkung bagaikan perahu.
      ar_eg: خرافية! بيوت التونجكونان فخمة جدًا، وسقفها معووج كأنه مركب.
      ar: مدهشة! بيوت التونغكونان فخمة جدًا، وسقوفها تنحني كأنها قوارب.
      en: Amazing! The tongkonan houses are magnificent, with roofs that curve like boats.
    - speaker: Rina
      text: Kamu sudah ke Londa?
      ar_eg: رحت لوندا؟
      ar: هل زرت لوندا؟
      en: Have you been to Londa?
    - speaker: Mohamed
      text: Sudah. Makam leluhur ada di tebing batu, dan patung tau-tau seperti menjaga mereka.
      ar_eg: أيوه. قبور الأجداد في جرف صخري، وتماثيل التاو تاو كأنها بتحرسهم.
      ar: نعم. قبور الأسلاف في جرف صخري، وتماثيل تاو تاو كأنها تحرسهم.
      en: Yes. The ancestors' graves are in a rock cliff, and the tau-tau statues seem to guard them.
    - speaker: Rina
      text: Wah! Jangan lupa membelikan saya kopi Toraja, ya!
      ar_eg: يا سلام! ما تنساش تشتريلي قهوة توراجا!
      ar: رائع! لا تنسَ أن تشتري لي قهوة توراجا!
      en: Wow! Don't forget to buy me some Toraja coffee!
souvenir:
  id: bipa4.u03.souvenir
  title: Rumah Tongkonan
  note:
    ar_eg: "التونجكونان بيت العيلة الكبيرة عند أهل توراجا، وسقفه المعووج زي المركب بيفكّرهم بأجدادهم اللي يقال إنهم جم من البحر. وأكبر حدث في حياة المجتمع مش الفرح، لكن الجنازة: «رامبو سولو» ممكن تستمر أيام، والقرية كلها بتيجي وتساعد. حاجة تفكرك إن الاحترام للأجداد عندنا وعندهم ليه أشكال كتير."
    ar: "التونغكونان بيت العائلة الكبيرة عند أهل توراجا، وسقفه المقوّس كالقارب يذكّرهم بأسلافهم الذين يقال إنهم جاؤوا من البحر. وأعظم حدث في حياة المجتمع ليس العرس بل الجنازة: فمراسم «رامبو سولو» قد تمتد أيامًا، وتشارك فيها القرية كلها. وفي ذلك تذكير بأن لإكرام الأجداد صورًا كثيرة بين الشعوب."
    en: The tongkonan is the Toraja extended family's ancestral house; its boat-shaped roof recalls ancestors said to have come from the sea. The community's biggest event isn't a wedding but a funeral — Rambu Solo' can last for days, and the whole village comes to help. A reminder that honouring one's ancestors takes many beautiful forms.
