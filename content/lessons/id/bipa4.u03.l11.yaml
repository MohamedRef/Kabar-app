schema: kabar.lesson/v1
id: bipa4.u03.l11
language: id
title: Ulangan Unit 3
can_do:
  ar_eg: تقدّم مكان تاريخي بوصف حي وتاريخ مختصر.
  ar: أن تقدّم موقعًا تاريخيًا بوصف حيّ وتاريخ موجز.
  en: Present a historic site.
slides:
  - title: -kan dan majas
    body:
      ar_eg: |
        مراجعة سريعة:
        -kan لحد: membelikan saya kopi (الشخص الأول وبعدين الحاجة).
        -kan للموضوع: menceritakan sejarah، membicarakan adat (من غير tentang).
        تشبيه: seperti / bagaikan. مبالغة: selangit، seribu kali، tak terhitung.
      ar: |
        مراجعة سريعة:
        -kan للإفادة: membelikan saya kopi (المستفيد ثم الشيء).
        -kan للموضوع: menceritakan sejarah، membicarakan adat (بلا tentang).
        التشبيه: seperti / bagaikan، والمبالغة: selangit، seribu kali، tak terhitung.
      en: |
        Quick review:
        -kan for someone: membelikan saya kopi (person first, then the thing).
        -kan for a topic: menceritakan sejarah, membicarakan adat (no tentang).
        Simile: seperti / bagaikan. Hyperbole: selangit, seribu kali, tak terhitung.
    grammar: id.confix.men-kan
    examples:
      - text: Pemandu menceritakan sejarah tongkonan kepada kami.
        ar_eg: المرشد حكالنا تاريخ التونجكونان.
        ar: روى لنا المرشد تاريخ التونغكونان.
        en: The guide told us the history of the tongkonan.
      - text: Atapnya melengkung bagaikan perahu.
        ar_eg: سقفه معووج كأنه مركب.
        ar: ينحني سقفه كأنه قارب.
        en: Its roof curves like a boat.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: membelikan
        ar_eg: يشتري لـ
        ar: يشتري لـ
        en: buy for
      - text: menceritakan
        ar_eg: يحكي
        ar: يروي
        en: tell (about)
      - text: warisan
        ar_eg: ميراث / تراث
        ar: إرث
        en: heritage
      - text: atap
        ar_eg: سقف
        ar: سقف
        en: roof
      - text: makam
        ar_eg: قبر / ضريح
        ar: قبر
        en: grave, tomb
      - text: selangit
        ar_eg: في السما (غالي جدًا)
        ar: باهظ جدًا
        en: sky-high
    words: [membelikan, menceritakan, warisan, atap, makam, selangit]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options: ["Kami membicarakan tentang sejarah Toraja.", "Saya membelikan buku adik saya.", "Mas Rizal menceritakan sejarah Londa."]
    answer: 2
    explain:
      ar_eg: membicarakan من غير tentang، ومع membelikan الشخص الأول (membelikan adik saya buku).
      ar: membicarakan بلا tentang، ومع membelikan يتقدّم المستفيد (membelikan adik saya buku).
      en: membicarakan takes no tentang, and with membelikan the person comes first (membelikan adik saya buku).
    words: [menceritakan, membicarakan, membelikan]
  - id: e03
    type: fill_blank
    sentence: Situs ini ___ oleh pemerintah, jadi orang tidak boleh merusaknya.
    meaning:
      ar_eg: الموقع ده ___ من الحكومة، فمحدش يقدر يبوّظه.
      ar: هذا الموقع ___ من الحكومة، فلا يجوز لأحد تخريبه.
      en: This site is ___ by the government, so no one may damage it.
    options: [dilindungi, didirikan, dibakar]
    answers: [dilindungi]
    words: [dilindungi, didirikan, dibakar]
  - id: e04
    type: listen
    text: Tolong sampaikan salam saya kepada Pak Yohanis.
    options: ["Tolong ceritakan salam saya kepada Pak Yohanis.", "Tolong sampaikan salam saya kepada Pak Yohanis.", "Tolong sampaikan surat saya kepada Pak Yohanis."]
    answer: 1
    meaning:
      ar_eg: من فضلك سلّملي على الأستاذ يوهانس.
      ar: أرجو أن تبلّغ تحياتي للسيد يوهانس.
      en: Please give my regards to Pak Yohanis.
    words: [menyampaikan]
  - id: e05
    type: fill_blank
    sentence: Pengrajin itu ___ saya ukiran kecil.
    meaning:
      ar_eg: الحِرَفي ده عملّي نحتة صغيرة.
      ar: صنع لي ذلك الحرفي نقشًا صغيرًا.
      en: That craftsman made me a small carving.
    options: [membuatkan, membuat, dibuat]
    answers: [membuatkan]
    words: [membuatkan, ukiran, pengrajin]
  - id: e06
    type: fill_blank
    sentence: Tongkonan adalah ___ leluhur orang Toraja.
    meaning:
      ar_eg: (اكتب الكلمة) التونجكونان ميراث من أجداد أهل توراجا.
      ar: (اكتب الكلمة) التونغكونان إرث من أسلاف أهل توراجا.
      en: (Type the word.) The tongkonan is a heritage from the Toraja ancestors.
    answers: [warisan]
    words: [warisan, leluhur]
  - id: e07
    type: build_sentence
    source:
      ar_eg: تماثيل التاو تاو واقفة على الجرف زي الحراس.
      ar: تقف تماثيل تاو تاو على الجرف كالحرّاس.
      en: The tau-tau statues stand on the cliff like guards.
    answer: Patung tau-tau berdiri di tebing seperti penjaga.
    distractors: [adalah, selangit]
    words: [patung, tebing]
  - id: e08
    type: match_pairs
    pairs:
