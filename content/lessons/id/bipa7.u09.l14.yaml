  - id: e03
    type: fill_blank
    sentence: Penyanyi muda dari Biak itu sedang ___. Lagunya diputar di mana-mana.
    meaning:
      ar_eg: المغنّي الشاب من بياك مكسّر الدنيا. أغنيته شغّالة في كل حتة.
      ar: ذاع صيت المغنّي الشاب من بياك، وأغنيته تُذاع في كلّ مكان.
      en: That young singer from Biak is all the rage. His song is playing everywhere.
    options: [naik daun, bermuka dua, besar kepala]
    answers: [naik daun]
    words: [naik daun, bermuka dua, besar kepala]
    explain:
      ar_eg: أغانيه شغالة في كل حتة = naik daun (بقى مشهور). bermuka dua = أبو وشين وbesar kepala = متكبّر.
      ar: تُذاع أغانيه في كل مكان فهو naik daun أي ذائع الصيت.
      en: Played everywhere means naik daun.
  - id: e04
    type: listen
    text: Di Sentani, warga dari berbagai suku bangsa hidup berdampingan dengan harmonis.
    question:
      ar_eg: الناس في سينتاني عايشين إزاي؟
      ar: كيف يعيش الأهالي في سينتاني؟
      en: How do people in Sentani live?
    options:
      - كل عِرق في حتة لوحده.
      - في خناق دايم.
      - جنب بعض في تناغم.
    answer: 2
    words: [suku bangsa, hidup berdampingan, harmonis]
  - id: e05
    type: build_sentence
    source:
      ar_eg: البانتشاسيلا فيها خمس مبادئ.
      ar: تتضمّن البانتشاسيلا خمسة مبادئ.
      en: Pancasila has five principles.
    answer: Pancasila terdiri atas lima sila.
    distractors: [semboyan, kerukunan]
    words: [Pancasila, sila, semboyan]
    explain:
      ar_eg: Pancasila + terdiri atas (بتتكوّن من) + lima sila. semboyan وkerukunan زيادة.
      ar: Pancasila terdiri atas lima sila. semboyan وkerukunan زائدتان.
      en: Pancasila + terdiri atas + lima sila. semboyan and kerukunan are extra.
  - id: e06
    type: match_pairs
    pairs:
      - text: ukhuwah
        ar_eg: أخوّة
        ar: أخوّة
        en: brotherhood
      - text: pemuka agama
