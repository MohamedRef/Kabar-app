id: bipa7.u09.l14
language: id
title: Ulangan Unit 9
can_do:
  ar_eg: تتكلّم عن العيشة مع الاختلاف، بالمفردات الصح والتعبيرات الاصطلاحية.
  ar: أن تتحدّث عن العيش مع الاختلاف، بالمفردات المناسبة والتعابير الاصطلاحية.
  en: Talk about living with difference, with the right vocabulary and idioms.
