  - id: e12
    type: multiple_choice
    question_meaning:
      ar_eg: جارك البوذي عنده عيد النهارده. تقول إيه؟
      ar: جارك البوذيّ في عيده اليوم. ماذا تقول؟
      en: Your Buddhist neighbour is celebrating today. What do you say?
    options:
      - Selamat Tahun Baru Imlek!
      - Selamat Hari Raya Nyepi!
      - Selamat Hari Waisak!
    answer: 2
    explain:
      ar_eg: الـ Waisak عيد البوذيين. الـ Nyepi للهندوس، والـ Imlek رأس السنة الصينية.
      ar: Waisak عيد البوذيين، وNyepi للهندوس، وImlek رأس السنة الصينية.
      en: Waisak is the Buddhist holy day; Nyepi is Hindu; Imlek is Chinese New Year.
    words: [Waisak, mengucapkan selamat, Imlek]
dialogue:
  title: Perahu di Danau Sentani
  lines:
    - speaker: Kak Yosua
      text: Festival tahun ini ramai banget. Penari perahu datang dari banyak kampung.
      ar_eg: مهرجان السنة دي زحمة قوي. راقصين المراكب جايين من قرى كتير.
      ar: مهرجان هذا العام مزدحم جدًّا، وجاء راقصو القوارب من قرى كثيرة.
      en: This year's festival is packed. Boat dancers came from many villages.
    - speaker: Mohamed
      text: Dan penontonnya juga beragam. Ada turis, ada warga Bugis, ada mama-mama Sentani.
      ar_eg: والمتفرّجين كمان متنوّعين. فيه سيّاح، وبوجيس، وستّات من سينتاني.
      ar: والمتفرّجون متنوّعون أيضًا، سيّاح وبوغيس ونساء سينتاني.
      en: And the crowd is varied too. Tourists, Bugis residents, Sentani mamas.
    - speaker: Kak Yosua
      text: Itulah kerukunan. Kamu sudah melihatnya sendiri, bukan hanya membacanya.
      ar_eg: هو ده الوئام. إنت شفته بعينك، مش بس قريت عنه.
      ar: هذا هو الوئام، رأيته بعينك لا في الكتب فقط.
      en: That's harmony. You've seen it yourself, not just read about it.
    - speaker: Mohamed
      text: Makasih, Kak. Perhentian terakhirku Lembah Baliem, di Wamena.
      ar_eg: شكرًا يا كاك. آخر محطّة ليّا وادي باليم، في وامينا.
      ar: شكرًا يا كاك. محطّتي الأخيرة وادي باليم في وامينا.
      en: Thank you, Kak. My last stop is the Baliem valley, in Wamena.
souvenir:
  id: bipa7.u09.souvenir
  title: Festival Danau Sentani
  note:
    ar_eg: بحيرة سينتاني جنب جايابورا، وحواليها قرى كتير بيوتها على أعمدة فوق المية. في مهرجان البحيرة السنوي، الرقّاصين بيرقصوا وهم واقفين على مراكب، وفيه كمان رسومات تقليدية على قشر الشجر. وبمناسبة الوحدة دي، شعار «Bhinneka Tunggal Ika»، يعني الوحدة في التنوّع، هو الشعار الوطني، وأصله باللغة الجاوية القديمة.
    ar: تقع بحيرة سينتاني قرب جايابورا، وتحيط بها قرى كثيرة بيوتها على أعمدة فوق الماء. وفي مهرجانها السنوي يرقص الراقصون وقوفًا على القوارب، وتُعرض رسوم تقليدية على لحاء الشجر. وشعار «Bhinneka Tunggal Ika»، أي الوحدة في التنوّع، هو الشعار الوطني، وأصله باللغة الجاوية القديمة.
    en: Lake Sentani lies near Jayapura, ringed by villages of houses on stilts over the water. At its yearly festival dancers perform standing on boats, and traditional bark paintings are on show. "Bhinneka Tunggal Ika", unity in diversity, is the national motto, in Old Javanese.
