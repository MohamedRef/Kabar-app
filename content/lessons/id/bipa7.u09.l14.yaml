  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المدرسة الشاملة بتعلّم الأطفال يحترموا بعض.
      ar: تعلّم المدرسة الجامعة الأطفال احترام بعضهم بعضًا.
      en: An inclusive school teaches children to respect one another.
    answers:
      - Sekolah yang inklusif mengajari anak-anak untuk saling menghargai.
      - Sekolah inklusif mengajari anak-anak saling menghargai.
      - Sekolah yang inklusif mengajar anak-anak untuk saling menghargai.
      - Sekolah yang inklusif mengajarkan anak-anak untuk saling menghargai.
      - Sekolah yang inklusif mengajari anak-anak buat saling menghargai.
      - Sekolah yang inklusif mengajar anak-anak buat saling menghargai.
      - Sekolah yang inklusif mengajarkan anak-anak buat saling menghargai.
    words: [inklusif, saling menghargai]
  - id: e08
    type: speaking
    text: Keadilan sosial artinya tidak ada diskriminasi bagi siapa pun.
    meaning:
      ar_eg: العدالة الاجتماعية معناها مافيش تمييز ضد أي حد.
      ar: العدالة الاجتماعية تعني ألّا تمييز ضدّ أحد.
      en: Social justice means no discrimination against anyone.
    words: [keadilan sosial, diskriminasi]
  - id: e09
    type: fill_blank
    sentence: Program ___ membantu orang meninggalkan paham kekerasan.
    meaning:
      ar_eg: برنامج ___ بيساعد الناس يسيبوا فكر العنف.
      ar: يساعد برنامج ___ الناس على ترك فكر العنف.
      en: A ___ programme helps people leave violent ideas behind.
    options: [deradikalisasi, vihara, panas pela]
    answers: [deradikalisasi]
    words: [deradikalisasi, vihara, panas pela]
    explain:
      ar_eg: برنامج بيساعد الناس يسيبوا فكر العنف = deradikalisasi (نزع التطرف). vihara معبد وpanas pela احتفال.
      ar: البرنامج الذي يُبعد عن فكر العنف deradikalisasi أي نزع التطرف.
      en: Leaving violent ideas is deradikalisasi.
  - id: e10
    type: fill_blank
    sentence: Guru yang baik mengajar dengan ___ kepada setiap murid.
    meaning:
      ar_eg: المدرّس الكويس بيعلّم بـ ___ مع كل تلميذ.
      ar: يعلّم المعلّم الجيّد كلّ تلميذ بـ ___.
      en: A good teacher teaches every pupil with ___.
    options: [empati, kemajemukan, hukum adat]
    answers: [empati]
    words: [empati, kemajemukan, hukum adat]
    explain:
      ar_eg: المدرس الكويس بيعلّم بـ empati (تعاطف). kemajemukan = تنوع وhukum adat = قانون عرفي.
      ar: المعلم الجيد يعلّم بـ empati. kemajemukan تنوّع وhukum adat عرف.
      en: Teaching with empati (empathy).
  - id: e11
    type: match_pairs
    pairs:
      - text: ikatan
