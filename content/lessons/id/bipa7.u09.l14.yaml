        ar: عنيد
        en: stubborn
      - text: sila
        ar_eg: مبدأ (من الخمسة)
        ar: مبدأ (من الخمسة)
        en: principle (one of the five)
      - text: kerukunan
        ar_eg: وئام
        ar: وئام
        en: harmony
      - text: tenggang rasa
        ar_eg: مراعاة شعور الغير
        ar: مراعاة مشاعر الآخرين
        en: consideration for others
      - text: prasangka
        ar_eg: حكم مسبق
        ar: حكم مسبق
        en: prejudice
    words: [kepala batu, sila, kerukunan, tenggang rasa, prasangka]
  - id: e02
    type: match_pairs
    pairs:
      - text: intoleransi
        ar_eg: عدم التسامح
        ar: عدم التسامح
        en: intolerance
      - text: pesantren
        ar_eg: معهد ديني داخلي (بنسيونات للطلبة)
        ar: معهد إسلامي داخلي
