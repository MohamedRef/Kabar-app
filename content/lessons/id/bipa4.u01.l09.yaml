schema: kabar.lesson/v1
id: bipa4.u01.l09
language: id
title: Usaha dan bisnis
can_do:
  ar_eg: 'تتكلم عن مشروعك أو شغلك: منصبك، مهاراتك، وإزاي شغلك بيكبر.'
  ar: 'أن تتحدث عن مشروعك أو عملك: منصبك ومهاراتك وتقدّم عملك.'
  en: 'Talk about a business or job: your position, your skills and how it is growing.'
slides:
  - title: Usaha keluarga
    body:
      ar_eg: |
        usaha = مشروع أو شغل خاص (usaha kecil = مشروع صغير)، وكمان «محاولة». bisnis = بيزنس، تجارة.
        ketua = رئيس (جمعية، لجنة، فصل)، mantan = «سابق»: mantan guru = مدرس سابق.
        posisi = منصب أو مكان، kemampuan = قدرة أو مهارة، maju = يتقدّم ويكبر، fokus = تركيز أو يركّز.
      ar: |
        usaha = المشروع أو العمل الخاص (usaha kecil = مشروع صغير)، وتعني أيضًا «المحاولة». bisnis = التجارة والأعمال.
        ketua = رئيس (جمعية أو لجنة أو صف)، mantan = «سابق»: mantan guru = معلّم سابق.
        posisi = المنصب أو الموقع، kemampuan = القدرة أو المهارة، maju = يتقدّم ويزدهر، fokus = تركيز أو يركّز.
      en: |
        usaha = a business or venture (usaha kecil = small business), also "effort". bisnis = business, trade.
        ketua = head, chair (of a group, committee or class), mantan = "former": mantan guru = former teacher.
        posisi = position, kemampuan = ability, skill, maju = to move forward, do well, fokus = focus, to focus.
    examples:
      - text: Ibu Andi punya usaha kecil di dekat pasar.
        ar_eg: مامة أندي عندها مشروع صغير جنب السوق.
        ar: لأمّ أندي مشروع صغير قرب السوق.
        en: Andi's mother has a small business near the market.
      - text: Pak Halim mantan ketua koperasi nelayan.
        ar_eg: الأستاذ حليم كان رئيس جمعية الصيادين قبل كده.
        ar: السيد حليم رئيس سابق لتعاونية الصيادين.
        en: Pak Halim is a former head of the fishermen's cooperative.
      - text: Bisnisnya maju karena dia fokus pada kualitas.
        ar_eg: البيزنس بتاعه كبر عشان مركّز على الجودة.
        ar: ازدهرت تجارته لأنه يركّز على الجودة.
        en: Their business is doing well because they focus on quality.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: usaha
        ar_eg: مشروع
        ar: مشروع
        en: business, venture
      - text: bisnis
        ar_eg: بيزنس، تجارة
        ar: تجارة، أعمال
        en: business
      - text: ketua
        ar_eg: رئيس
        ar: رئيس
        en: head, chair
      - text: mantan
        ar_eg: سابق
        ar: سابق
        en: former
    words: [usaha, bisnis, ketua, mantan]
  - id: e02
    type: match_pairs
    pairs:
      - text: posisi
        ar_eg: منصب
        ar: منصب
        en: position
      - text: kemampuan
        ar_eg: قدرة، مهارة
        ar: قدرة
        en: ability
      - text: maju
        ar_eg: يتقدّم، يكبر
        ar: يتقدّم
        en: to progress
      - text: fokus
        ar_eg: تركيز
        ar: تركيز
        en: focus
    words: [posisi, kemampuan, maju, fokus]
  - id: e03
    type: listen
    text: Bisnis ikan bakar itu maju sekali.
    question:
      ar_eg: البيزنس عامل إيه؟
      ar: كيف حال التجارة؟
      en: How is the business doing?
    options: [كبر جدًا, اتقفل, خسر]
    answer: 0
    meaning:
      ar_eg: بيزنس السمك المشوي ده كبر جدًا.
      ar: ازدهرت تجارة السمك المشوي تلك كثيرًا.
      en: That grilled-fish business is doing really well.
    words: [bisnis, maju]
  - id: e04
    type: fill_blank
    sentence: Pak Halim bukan ketua lagi. Dia ___ ketua koperasi.
    meaning:
      ar_eg: الأستاذ حليم مش رئيس دلوقتي. هو رئيس الجمعية ___.
      ar: لم يعد السيد حليم رئيسًا، فهو رئيس التعاونية ___.
      en: Pak Halim isn't the head any more. He's the ___ head of the cooperative.
    options: [mantan, posisi, usaha]
    answers: [mantan]
    words: [mantan, ketua, posisi, usaha]
    explain:
      ar_eg: mantan ketua = الرئيس السابق، وده اللي يمشي مع «مابقاش رئيس». posisi = منصب، وusaha = مشروع.
      ar: mantan ketua = الرئيس السابق، وهو ما يناسب «لم يعد رئيسًا». أما posisi فمنصب، وusaha مشروع.
      en: mantan ketua is the former head, which fits "isn't the head any more". posisi is a position and usaha a business.
  - id: e05
    type: multiple_choice
    question: Dia melamar ___ manajer di perusahaan itu.
    options: [posisi, kemampuan, fokus]
    answer: 0
    explain:
      ar_eg: posisi = منصب، والوظيفة اللي بتقدّم عليها منصب. kemampuan = قدرة، وfokus = تركيز.
      ar: posisi = المنصب، وما يُتقدّم إليه منصب. أما kemampuan فالقدرة، وfokus التركيز.
      en: posisi is a position, what you apply for. kemampuan is ability, and fokus is focus.
    words: [posisi, kemampuan, fokus]
  - id: e06
    type: fill_blank
    sentence: Teknisi itu punya ___ memperbaiki semua mesin.
    meaning:
      ar_eg: الفني ده عنده ___ يصلّح كل المكن.
      ar: يملك ذلك الفنّي ___ على إصلاح كل الآلات.
      en: That technician has the ___ to fix every machine.
    options: [kemampuan, mantan, bisnis]
    answers: [kemampuan]
    words: [kemampuan, mantan, bisnis]
    explain:
      ar_eg: punya kemampuan = عنده القدرة. mantan = سابق، وbisnis = تجارة، ومايمشوش بعد punya هنا.
      ar: punya kemampuan = يملك القدرة. أما mantan فسابق، وbisnis تجارة، ولا يناسبان بعد punya هنا.
      en: punya kemampuan means has the ability. mantan is former and bisnis is business; neither fits after punya here.
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: حد اتنخب يقود جمعية الحي. هو إيه؟
      ar: شخص انتُخب لقيادة جمعية الحي. ما هو؟
      en: Someone elected to lead the neighbourhood association. What are they?
    options: [mantan, ketua, usaha]
    answer: 1
    explain:
      ar_eg: ketua = رئيس الجمعية. mantan = سابق، وusaha = مشروع.
      ar: ketua = رئيس الجمعية. أما mantan فسابق، وusaha مشروع.
      en: ketua is the head. mantan is former, and usaha is a business.
    words: [ketua, mantan, usaha]
  - id: e08
    type: build_sentence
    source:
      ar_eg: مامتي بدأت مشروع صغير في البيت.
      ar: بدأت أمي مشروعًا صغيرًا في البيت.
      en: My mother started a small business at home.
    answer: Ibu saya memulai usaha kecil di rumah.
    distractors: [bisnis, maju]
    words: [usaha, bisnis, maju]
    explain:
      ar_eg: memulai usaha = بدأت مشروع، وusaha kecil = مشروع صغير. bisnis وmaju مالهمش مكان في الجملة.
      ar: memulai usaha = بدأت مشروعًا، وusaha kecil = مشروع صغير. ولا مكان لـ bisnis وmaju في الجملة.
      en: memulai usaha is to start a business, and usaha kecil is a small one. bisnis and maju have no place in the sentence.
  - id: e09
    type: translate
    direction: from_target
    source_text: Kalau kamu fokus, usahamu akan maju.
    answers_meaning:
      ar_eg: [لو ركّزت، مشروعك هيكبر, لو إنت مركّز، شغلك هيتقدّم]
      ar: [إن ركّزت فسيزدهر مشروعك, إذا ركّزت فإن مشروعك سيتقدّم]
      en: ['If you focus, your business will do well', 'If you focus, your business will grow']
    words: [fokus, usaha, maju]
  - id: e10
    type: speaking
    text: Mantan ketua itu sekarang punya bisnis sendiri.
    meaning:
      ar_eg: الرئيس السابق ده دلوقتي عنده بيزنس بتاعه.
      ar: صار لذلك الرئيس السابق عمله الخاص الآن.
      en: That former head now has his own business.
    words: [mantan, ketua, bisnis, posisi]
dialogue:
  lines:
    - speaker: Andi
      text: Mohamed, ibu saya mau membuka usaha kue di dekat pasar.
      ar_eg: يا محمد، أمي عايزة تفتح مشروع كيك جنب السوق.
      ar: يا محمد، تريد أمي أن تفتح مشروع حلويات قرب السوق.
      en: Mohamed, my mother wants to open a cake business near the market.
    - speaker: Mohamed
      text: Keren! Dia punya kemampuan membuat kue?
      ar_eg: حلو! هي بتعرف تعمل كيك؟
      ar: رائع! هل تجيد صنع الحلويات؟
      en: Great! Is she good at baking?
    - speaker: Andi
      text: Iya. Dia mantan koki di hotel. Sekarang dia mau fokus pada bisnis sendiri.
      ar_eg: أيوه. كانت طبّاخة في فندق. دلوقتي عايزة تركّز على البيزنس بتاعها.
      ar: نعم. كانت طاهية في فندق، والآن تريد التركيز على عملها الخاص.
      en: Yes. She's a former hotel cook. Now she wants to focus on her own business.
    - speaker: Mohamed
      text: Semoga usahanya maju!
      ar_eg: ربنا يكبّر مشروعها!
      ar: أتمنى أن يزدهر مشروعها!
      en: I hope her business does well!
    - speaker: Andi
      text: Amin. Ayah saya ketua koperasi, jadi dia bisa menolong.
      ar_eg: آمين. بابا رئيس الجمعية، فيقدر يساعد.
      ar: آمين. أبي رئيس التعاونية، لذا يستطيع المساعدة.
      en: Amen. My father heads the cooperative, so he can help.
