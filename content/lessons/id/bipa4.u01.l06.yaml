schema: kabar.lesson/v1
id: bipa4.u01.l06
language: id
title: Jabatan di kantor
can_do:
  ar_eg: تتكلم عن المناصب والأقسام في شركة وعن تقييم الأداء.
  ar: أن تتحدث عن المناصب والأقسام في شركة وعن الأداء الوظيفي.
  en: Talk about positions and departments in a company, and about performance.
slides:
  - title: Di perusahaan
    body:
      ar_eg: |
        jabatan = منصب، divisi = قسم (divisi pemasaran)، manajemen = الإدارة.
        eksekutif = مدير تنفيذي، pengawas = مشرف، perwakilan = مندوب أو ممثّل (perwakilan perusahaan).
        administrasi = الشغل الإداري والورق، kinerja = الأداء في الشغل.
      ar: |
        jabatan = منصب، divisi = قسم (divisi pemasaran)، manajemen = الإدارة.
        eksekutif = مدير تنفيذي، pengawas = مشرف، perwakilan = ممثّل أو مندوب (perwakilan perusahaan).
        administrasi = الأعمال الإدارية، kinerja = الأداء الوظيفي.
      en: |
        jabatan = position, post; divisi = department (divisi pemasaran); manajemen = management.
        eksekutif = executive, pengawas = supervisor, perwakilan = representative (perwakilan perusahaan).
        administrasi = administration, paperwork; kinerja = (work) performance.
    examples:
      - text: Apa jabatan Anda di perusahaan ini?
        ar_eg: إيه منصب حضرتك في الشركة دي؟
        ar: ما منصبك في هذه الشركة؟
        en: What is your position in this company?
      - text: Kak Nurul bekerja di divisi administrasi.
        ar_eg: نورول بتشتغل في قسم الشؤون الإدارية.
        ar: تعمل نورول في قسم الشؤون الإدارية.
        en: Nurul works in the administration department.
      - text: Kinerjanya bagus, jadi dia naik jabatan.
        ar_eg: أداؤه كويس، فاترقّى.
        ar: أداؤه جيد، فرُقّي.
        en: His performance is good, so he got promoted.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jabatan
        ar_eg: منصب
        ar: منصب
        en: position
      - text: divisi
        ar_eg: قسم
        ar: قسم
        en: department
      - text: manajemen
        ar_eg: الإدارة
        ar: الإدارة
        en: management
      - text: eksekutif
        ar_eg: مدير تنفيذي
        ar: مدير تنفيذي
        en: executive
    words: [jabatan, divisi, manajemen, eksekutif]
  - id: e02
    type: match_pairs
    pairs:
      - text: pengawas
        ar_eg: مشرف
        ar: مشرف
        en: supervisor
      - text: perwakilan
        ar_eg: مندوب
        ar: ممثّل
        en: representative
      - text: administrasi
        ar_eg: شغل إداري
        ar: الأعمال الإدارية
