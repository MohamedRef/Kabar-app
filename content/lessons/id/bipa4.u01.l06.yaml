    words: [pengawas, perwakilan, administrasi, kinerja]
  - id: e03
    type: listen
    text: Pengawas datang ke pabrik setiap pagi.
    question:
      ar_eg: مين بييجي المصنع كل يوم؟
      ar: من يأتي إلى المصنع كل يوم؟
      en: Who comes to the factory every day?
    options: [المشرف, المندوب, الإدارة]
    answer: 0
    meaning:
      ar_eg: المشرف بييجي المصنع كل يوم الصبح.
      ar: يأتي المشرف إلى المصنع كل صباح.
      en: The supervisor comes to the factory every morning.
    words: [pengawas]
  - id: e04
    type: fill_blank
    sentence: Saya bekerja di ___ pemasaran, lantai tiga.
    meaning:
      ar_eg: أنا بشتغل في ___ التسويق، الدور التالت.
      ar: أعمل في ___ التسويق، الطابق الثالث.
      en: I work in the marketing ___, third floor.
    options: [divisi, jabatan, kinerja]
    answers: [divisi]
    words: [divisi, jabatan, kinerja]
  - id: e05
    type: multiple_choice
    question: Bu Lina naik ___. Sekarang dia manajer.
    question_meaning:
      ar_eg: بو لينا اترقّت. دلوقتي هي مديرة.
      ar: رُقّيت السيدة لينا. هي الآن مديرة.
      en: Bu Lina was promoted. Now she's a manager.
    options: [perwakilan, administrasi, jabatan]
    answer: 2
    explain:
      ar_eg: naik jabatan = يترقّى، ياخد منصب أعلى.
      ar: naik jabatan = يُرقّى إلى منصب أعلى.
      en: naik jabatan = to be promoted.
    words: [perwakilan, administrasi, jabatan]
  - id: e06
    type: fill_blank
    sentence: ___ Pak Halim turun karena dia sering terlambat.
    meaning:
      ar_eg: ___ أستاذ حليم نزل عشان بيتأخر كتير.
      ar: تراجع ___ السيد حليم لأنه يتأخر كثيرًا.
      en: Pak Halim's ___ dropped because he's often late.
    options: [Kinerja, Manajemen, Pengawas]
    answers: [Kinerja]
    words: [kinerja, manajemen, pengawas]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيروح الاجتماعات باسم الشركة؟
      ar: من يحضر الاجتماعات باسم الشركة؟
      en: Who goes to meetings in the company's name?
    options: [perwakilan perusahaan, pengawas pabrik, divisi administrasi]
    answer: 0
    explain:
      ar_eg: perwakilan = مندوب بيتكلم باسم حد.
      ar: perwakilan = ممثّل يتحدث باسم جهة.
      en: perwakilan = someone who speaks for others.
    words: [perwakilan, pengawas, administrasi, divisi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الإدارة اختارت مدير تنفيذي جديد.
      ar: اختارت الإدارة مديرًا تنفيذيًا جديدًا.
      en: Management chose a new executive.
    answer: Manajemen memilih seorang eksekutif baru.
    distractors: [pengawas, divisi]
    words: [manajemen, eksekutif]
  - id: e09
    type: translate
    direction: from_target
    source_text: Urusan administrasi sekarang lebih cepat karena manajemen baru.
    answers_meaning:
      ar_eg: [الشغل الإداري بقى أسرع عشان الإدارة الجديدة, الورق بقى بيخلص أسرع بسبب الإدارة الجديدة]
      ar: [أصبحت الشؤون الإدارية أسرع بسبب الإدارة الجديدة, صارت المعاملات الإدارية أسرع بفضل الإدارة الجديدة]
      en: [Administration is faster now because of the new management, Paperwork is quicker now thanks to the new management]
    words: [administrasi, manajemen]
  - id: e10
    type: speaking
    text: Jabatan saya eksekutif dan perwakilan perusahaan di Makassar.
    meaning:
      ar_eg: منصبي مدير تنفيذي ومندوب الشركة في ماكاسار.
      ar: منصبي مدير تنفيذي وممثّل الشركة في ماكاسار.
      en: My position is executive and company representative in Makassar.
    words: [jabatan, eksekutif, perwakilan, kinerja]
dialogue:
  lines:
    - speaker: Nurul
      text: Mohamed, selamat datang di kantor kami!
      ar_eg: يا محمد، أهلًا بيك في مكتبنا!
      ar: أهلًا بك في مكتبنا يا محمد!
      en: Mohamed, welcome to our office!
    - speaker: Mohamed
      text: Terima kasih. Kak Nurul di divisi apa?
      ar_eg: شكرًا. إنتي في أنهي قسم يا نورول؟
      ar: شكرًا. في أي قسم تعملين يا نورول؟
      en: Thanks. Which department are you in, Nurul?
    - speaker: Nurul
      text: Administrasi. Pak Halim pengawas kami, dan Bu Lina dari manajemen.
      ar_eg: الشؤون الإدارية. أستاذ حليم المشرف بتاعنا، وبو لينا من الإدارة.
      ar: الشؤون الإدارية. السيد حليم مشرفنا، والسيدة لينا من الإدارة.
      en: Administration. Pak Halim is our supervisor, and Bu Lina is from management.
    - speaker: Mohamed
      text: Kalau Pak Daud? Jabatannya apa?
      ar_eg: وأستاذ داود؟ منصبه إيه؟
      ar: والسيد داود؟ ما منصبه؟
      en: And Pak Daud? What's his position?
    - speaker: Nurul
      text: Dia eksekutif dan perwakilan perusahaan di Jakarta. Kinerjanya bagus sekali.
      ar_eg: هو مدير تنفيذي ومندوب الشركة في جاكرتا. أداؤه هايل.
      ar: هو مدير تنفيذي وممثّل الشركة في جاكرتا. أداؤه رائع.
      en: He's an executive and the company's representative in Jakarta. His performance is outstanding.
