schema: kabar.lesson/v1
id: bipa3.u07.l05
language: id
title: Melawan penjajah
can_do:
  ar_eg: 'تحكي في متحف عن نضال الإندونيسيين ضد الاستعمار: الحرب والسلاح والعدو والسجن.'
  ar: 'أن تحكي في متحف عن كفاح الإندونيسيين ضد الاستعمار: الحرب والسلاح والعدو والسجن.'
  en: 'Tell the story of the fight against colonial rule in a museum: war, weapons, the enemy and prison.'
slides:
  - title: Di museum sejarah
    body:
      ar_eg: |
        perang = حرب. pasukan = قوات، جيش (مجموعة عساكر). senjata = سلاح.
        melawan = يحارب، يقاوم (ضد). musuh = عدو.
        perjuangan = نضال، كفاح (من berjuang). bersatu = يتّحد. penjara = سجن.
      ar: |
        perang = حرب. pasukan = قوات، فرقة. senjata = سلاح.
        melawan = يقاوم، يحارب. musuh = عدو.
        perjuangan = نضال، كفاح (من berjuang). bersatu = يتّحد. penjara = سجن.
      en: |
        perang = war. pasukan = troops, forces. senjata = weapon.
        melawan = fight against, resist. musuh = enemy.
        perjuangan = struggle (from berjuang). bersatu = unite. penjara = prison.
    examples:
      - text: Diponegoro melawan Belanda dalam Perang Jawa.
        ar_eg: ديبونيجورو حارب الهولنديين في حرب جاوة.
        ar: قاوم ديبونيغورو الهولنديين في حرب جاوة.
        en: Diponegoro fought the Dutch in the Java War.
      - text: Semua orang bersatu melawan musuh.
        ar_eg: الشعب اتّحد ضد العدو.
        ar: اتّحد الشعب ضد العدو.
        en: The people united against the enemy.
      - text: Soekarno pernah masuk penjara Belanda.
        ar_eg: سوكارنو اتسجن قبل كده في سجن هولندي.
        ar: دخل سوكارنو سجنًا هولنديًا من قبل.
        en: Soekarno was once jailed by the Dutch.
