  - id: e03
    type: listen
    text: Perang Jawa berlangsung dari tahun 1825 sampai 1830.
    question:
      ar_eg: الحرب طوّلت قد إيه؟
      ar: كم دامت الحرب؟
      en: How long did the war last?
    options: [سنة واحدة, خمس سنين, عشر سنين]
    answer: 1
    meaning:
      ar_eg: حرب جاوة كانت من ١٨٢٥ لحد ١٨٣٠.
      ar: دارت حرب جاوة من عام ١٨٢٥ حتى ١٨٣٠.
      en: The Java War lasted from 1825 to 1830.
    words: [perang]
  - id: e04
    type: fill_blank
    sentence: Pasukan Belanda punya banyak ___ dan meriam.
    meaning:
      ar_eg: القوات الهولندية كان عندها ___ ومدافع كتير.
      ar: كان لدى القوات الهولندية ___ ومدافع كثيرة.
      en: The Dutch troops had many ___ and cannons.
    options: [senjata, penjara, bersatu]
    answers: [senjata]
    words: [senjata, penjara, bersatu, pasukan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي بتحاربه في الحرب اسمه إيه؟
      ar: ما اسم من تحاربه في الحرب؟
      en: What do you call the side you fight in a war?
    options: [perjuangan, musuh, pasukan]
    answer: 1
    explain:
      ar_eg: musuh = عدو.
      ar: musuh = عدو.
      en: musuh = enemy.
    words: [musuh, perjuangan, pasukan]
  - id: e06
    type: fill_blank
    sentence: Kalau kita ___, kita kuat.
    meaning:
      ar_eg: لو ___، هنبقى أقويا.
      ar: إذا ___ فنحن أقوياء.
      en: If we ___, we're strong.
    options: [melawan, bersatu, musuh]
    answers: [bersatu]
    words: [bersatu, melawan, musuh]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الأبطال قاوموا الاستعمار.
      ar: قاوم الأبطال المستعمر.
      en: The heroes fought against the colonisers.
    answer: Para pahlawan melawan penjajah.
    distractors: [musuh, penjara]
    words: [melawan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Perjuangan mereka sangat panjang dan berat.
    answers_meaning:
      ar_eg: [نضالهم كان طويل وصعب جدًا, كفاحهم كان طويل وتقيل أوي]
      ar: [كان كفاحهم طويلًا وشاقًّا جدًا]
      en: [Their struggle was very long and hard, Their fight was very long and difficult]
    words: [perjuangan]
  - id: e09
    type: speaking
    text: Pahlawan itu dimasukkan ke penjara oleh musuh.
    meaning:
      ar_eg: البطل ده اتحط في السجن على إيد العدو.
      ar: أدخل العدوُّ ذلك البطلَ السجن.
      en: That hero was put in prison by the enemy.
    words: [penjara, musuh]
  - id: e10
    type: multiple_choice
    question: Tahun 1945, ___ Jepang menyerah.
    options: [perjuangan, pasukan, bersatu]
    answer: 1
    explain:
      ar_eg: pasukan = قوات، جيش.
      ar: pasukan = قوات.
      en: pasukan = troops.
    words: [pasukan, perjuangan, bersatu, perang, senjata]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Mohamed, ini lukisan Perang Jawa. Itu Diponegoro di atas kuda.
      ar_eg: يا محمد، دي لوحة حرب جاوة. ده ديبونيجورو على الحصان.
      ar: يا محمد، هذه لوحة حرب جاوة. ذاك ديبونيغورو على الحصان.
      en: Mohamed, this is a painting of the Java War. That's Diponegoro on the horse.
    - speaker: Mohamed
      text: Siapa musuhnya?
      ar_eg: مين كان عدوه؟
      ar: من كان عدوّه؟
      en: Who was the enemy?
    - speaker: Mas Rizal
      text: Belanda. Pasukan Belanda punya senjata yang lebih modern.
      ar_eg: الهولنديين. القوات الهولندية كان معاها سلاح أحدث.
      ar: الهولنديون. كان لدى القوات الهولندية سلاح أحدث.
      en: The Dutch. The Dutch troops had more modern weapons.
    - speaker: Mohamed
      text: Tapi orang-orang masih melawan, ya?
      ar_eg: بس الشعب فضل يقاوم، صح؟
      ar: لكن الشعب استمر في المقاومة، أليس كذلك؟
      en: But the people kept fighting, right?
    - speaker: Mas Rizal
      text: Ya. Perjuangan itu panjang. Akhirnya Diponegoro ditangkap dan dibuang ke Manado, lalu ke Makassar.
      ar_eg: أيوه. النضال ده كان طويل. في الآخر ديبونيجورو اتقبض عليه واتنفى لمانادو وبعدين لمكاسار.
      ar: نعم. كان الكفاح طويلًا. وفي النهاية اعتُقل ديبونيغورو ونُفي إلى مانادو ثم إلى مكاسار.
      en: Yes. It was a long struggle. In the end Diponegoro was captured and exiled to Manado, then to Makassar.
