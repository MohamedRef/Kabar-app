schema: kabar.lesson/v1
id: bipa5.u06.l09
language: id
title: Galeri kerajinan Dayak
can_do:
  ar_eg: 'تتفرج على معرض حرف يدوية: الخيط والحرير والنحاس الأصفر والأحمر، الجرس والتحف القديمة.'
  ar: 'أن تزور معرض حِرف: الخيط والحرير والنحاس الأصفر والأحمر، والجرس والتحف العتيقة.'
  en: 'Visit a crafts gallery: thread, silk, brass and copper, bells and antiques.'
slides:
  - title: Tangan-tangan terampil
    body:
      ar_eg: |
        kerajinan = حرفة يدوية (kerajinan tangan)، galeri = جاليري، معرض فني.
        benang = خيط، sutra = حرير (kain sutra)، manik-manik = خرز (الداياك مشهورين بيه).
        kuningan = نحاس أصفر، tembaga = نحاس أحمر، lonceng = جرس.
        antik = أنتيكة، قديم وغالي.
      ar: |
        kerajinan = حرفة يدوية (kerajinan tangan)، galeri = معرض فني، رواق.
        benang = خيط، sutra = حرير (kain sutra)، manik-manik = خرز (يشتهر به الداياك).
        kuningan = نحاس أصفر، tembaga = نحاس أحمر، lonceng = جرس.
        antik = عتيق، أثري ثمين.
      en: |
        kerajinan = handicraft (kerajinan tangan), galeri = gallery.
        benang = thread, sutra = silk (kain sutra), manik-manik = beads (Dayak beadwork is famous).
        kuningan = brass, tembaga = copper, lonceng = bell.
        antik = antique.
    examples:
      - text: Galeri ini menjual kerajinan manik-manik Dayak.
        ar_eg: الجاليري ده بيبيع حرف خرز داياك.
        ar: يبيع هذا المعرض مشغولات الخرز لشعب الداياك.
        en: This gallery sells Dayak beadwork.
      - text: Kain ini ditenun dari benang sutra.
        ar_eg: القماش ده متنسج من خيط حرير.
        ar: نُسج هذا القماش من خيوط الحرير.
        en: This cloth is woven from silk thread.
      - text: Lonceng kuningan itu antik, umurnya seratus tahun.
        ar_eg: الجرس النحاس ده أنتيكة، عمره ميت سنة.
        ar: ذلك الجرس النحاسي عتيق، عمره مئة عام.
        en: That brass bell is an antique, a hundred years old.
