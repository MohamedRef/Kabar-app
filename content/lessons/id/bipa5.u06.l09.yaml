    meaning:
      ar_eg: الجرس النحاس الأحمر ده أنتيكة وغالي.
      ar: ذلك الجرس النحاسي عتيق وغالٍ.
      en: That copper bell is antique and expensive.
    words: [lonceng, tembaga, antik]
dialogue:
  lines:
    - speaker: Penjaga galeri
      text: Selamat datang di galeri kami. Semua kerajinan ini buatan tangan.
      ar_eg: أهلًا بيك في الجاليري بتاعنا. كل الحرف دي شغل إيد.
      ar: أهلًا بك في معرضنا. كل هذه الحِرف مصنوعة يدويًا.
      en: Welcome to our gallery. All these crafts are handmade.
    - speaker: Mohamed
      text: Kain ini halus sekali. Dari sutra?
      ar_eg: القماش ده ناعم أوي. حرير؟
      ar: هذا القماش ناعم جدًا. أهو حرير؟
      en: This cloth is so soft. Is it silk?
    - speaker: Penjaga galeri
      text: Benangnya campuran sutra dan kapas. Motifnya burung enggang.
      ar_eg: الخيط خليط حرير وقطن. والرسمة طير الإنجانج.
      ar: خيوطه مزيج من الحرير والقطن، ونقشه طائر أبو قرن.
      en: The thread is a silk-cotton mix. The motif is the hornbill.
    - speaker: Mohamed
      text: Dan lonceng kuningan itu? Kelihatannya antik.
      ar_eg: والجرس النحاس الأصفر ده؟ باين عليه أنتيكة.
      ar: وذلك الجرس النحاسي؟ يبدو عتيقًا.
      en: And that brass bell? It looks antique.
    - speaker: Penjaga galeri
      text: Betul, umurnya hampir seratus tahun. Yang tembaga di sebelahnya baru.
      ar_eg: مظبوط، عمره حوالي ميت سنة. اللي جنبه النحاس الأحمر جديد.
      ar: صحيح، عمره نحو مئة عام. أما النحاسي الأحمر بجانبه فجديد.
      en: Right, it's almost a hundred years old. The copper one next to it is new.
