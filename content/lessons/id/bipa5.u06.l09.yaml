schema: kabar.lesson/v1
id: bipa5.u06.l09
language: id
title: Galeri kerajinan Dayak
can_do:
  ar_eg: 'تتفرج على معرض حرف يدوية: الخيط والقطن والنحاس الأصفر والأحمر، الجرس والأحجبة.'
  ar: 'أن تزور معرض حِرف: الخيط والقطن والنحاس الأصفر والأحمر، والجرس والتمائم.'
  en: 'Visit a crafts gallery: thread, cotton, brass and copper, bells and amulets.'
slides:
  - title: Tangan-tangan terampil
    body:
      ar_eg: |
        kerajinan = حرفة يدوية (kerajinan tangan)، galeri = جاليري، معرض فني.
        benang = خيط، kapas = قطن (kain kapas)، manik-manik = خرز (الداياك مشهورين بيه).
        kuningan = نحاس أصفر، tembaga = نحاس أحمر، lonceng = جرس.
        jimat = حجاب، تعويذة (حاجة بيلبسوها للحماية أو الحظ)؛ وantik = أنتيكة.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: banget = sekali، kayaknya = sepertinya.
      ar: |
        kerajinan = حرفة يدوية (kerajinan tangan)، galeri = معرض فني، رواق.
        benang = خيط، kapas = قطن (kain kapas)، manik-manik = خرز (يشتهر به الداياك).
        kuningan = نحاس أصفر، tembaga = نحاس أحمر، lonceng = جرس.
        jimat = تميمة، تعويذة؛ وantik = عتيق.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: banget = sekali، kayaknya = sepertinya.
      en: |
        kerajinan = handicraft (kerajinan tangan), galeri = gallery.
        benang = thread, kapas = cotton (kain kapas), manik-manik = beads (Dayak beadwork is famous).
        kuningan = brass, tembaga = copper, lonceng = bell.
        jimat = amulet, charm; antik = antique.
        The dialogue uses street forms; the formal ones are beside them: banget = sekali, kayaknya = sepertinya.
    examples:
      - text: Galeri ini menjual kerajinan manik-manik Dayak.
        ar_eg: الجاليري ده بيبيع حرف خرز داياك.
        ar: يبيع هذا المعرض مشغولات الخرز لشعب الداياك.
        en: This gallery sells Dayak beadwork.
      - text: Kain ini ditenun dari benang kapas.
        ar_eg: القماش ده متنسج من خيط قطن.
        ar: نُسج هذا القماش من خيوط القطن.
        en: This cloth is woven from cotton thread.
      - text: Kalung manik-manik ini jimat, katanya membawa keberuntungan.
        ar_eg: العقد الخرز ده حجاب، بيقولوا إنه بيجيب الحظ.
        ar: هذه القلادة الخرزية تميمة، يقال إنها تجلب الحظ.
        en: This bead necklace is an amulet; they say it brings luck.
