  - id: e03
    type: listen
    text: Lonceng gereja berbunyi setiap hari Minggu.
    question:
      ar_eg: إيه اللي بيرن؟
      ar: ما الذي يرنّ؟
      en: What rings?
    options: [الجرس, الأدان, الطبلة]
    answer: 0
    meaning:
      ar_eg: جرس الكنيسة بيرن كل يوم حد.
      ar: يرنّ جرس الكنيسة كل يوم أحد.
      en: The church bell rings every Sunday.
    words: [lonceng]
  - id: e04
    type: fill_blank
