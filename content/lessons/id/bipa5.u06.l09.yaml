      ar: ما المعدن الأحمر الذي تُصنع منه أسلاك الكهرباء؟
      en: Which reddish metal are electric wires made of?
    options: [kuningan, sutra, tembaga]
    answer: 2
    explain:
      ar_eg: tembaga = نحاس أحمر.
      ar: tembaga = نحاس أحمر.
      en: tembaga = copper.
    words: [kuningan, sutra, tembaga]
