  - id: e09
    type: translate
    direction: from_target
    source_text: Kerajinan kuningan dari desa ini terkenal.
    answers_meaning:
      ar_eg: [حرف النحاس الأصفر من القرية دي مشهورة, مشغولات النحاس بتاعة القرية دي معروفة]
      ar: [مشغولات النحاس الأصفر من هذه القرية مشهورة, حِرف النحاس الأصفر في هذه القرية معروفة]
      en: [Brass crafts from this village are famous, 'This village''s brasswork is well known']
