  - id: e03
    type: listen
    text: Pemuda itu tampak sedih sekali.
    question:
      ar_eg: الشاب شكله عامل إزاي؟
      ar: كيف يبدو الشاب؟
      en: How does the young man look?
    options: [زعلان, مبسوط, خايف]
    answer: 0
    meaning:
      ar_eg: الشاب ده باين عليه زعلان جدًا.
      ar: يبدو ذلك الشاب حزينًا جدًا.
      en: That young man looks very sad.
    words: [tampak]
  - id: e04
    type: fill_blank
    sentence: Buaya itu ___ karena percaya kata-kata kancil.
    meaning:
      ar_eg: التمساح ده ___ عشان صدّق كلام الكانتشيل.
      ar: ذلك التمساح ___ لأنه صدّق كلام الكانتشيل.
      en: That crocodile is ___ because it believed the mouse-deer.
    options: [bodoh, benci, muncul]
    answers: [bodoh]
    words: [bodoh, benci, muncul]
    explain:
      ar_eg: اللي يصدّق الكانتشيل يبقى bodoh (غبي). benci = يكره، وmuncul = يظهر، ومايوصفوش التمساح هنا.
      ar: من يصدّق الكانتشيل bodoh (أحمق). أما benci فيكره، وmuncul يظهر، ولا يصفان التمساح هنا.
      en: Anyone who believes the mouse-deer is bodoh (foolish). benci is to hate and muncul is to appear; neither describes the crocodile.
  - id: e05
    type: multiple_choice
    question: Waktu ditanya, anak itu ___ saja. Dia takut.
    options: [diam, gila, membunuh]
    answer: 0
    explain:
      ar_eg: diam saja = فضل ساكت، وده بيحصل لما حد يخاف. gila = مجنون، وmembunuh = يقتل.
      ar: diam saja = ظلّ صامتًا، وهذا ما يفعله الخائف. أما gila فمجنون، وmembunuh يقتل.
      en: diam saja means just stayed quiet, as a scared child does. gila is crazy, and membunuh is to kill.
    words: [diam, gila, membunuh]
  - id: e06
    type: fill_blank
    sentence: Pemburu itu tidak mau ___ rusa kecil itu.
    meaning:
      ar_eg: الصياد ده مش عايز ___ الغزال الصغير.
      ar: لا يريد ذلك الصياد ___ الغزال الصغير.
      en: The hunter doesn't want to ___ the little deer.
    options: [membunuh, menjaga, tampak]
    answers: [membunuh]
    words: [membunuh, menjaga, tampak]
    explain:
      ar_eg: membunuh rusa = يقتل الغزال، وده اللي الصياد مش عايزه. menjaga = يحرس، وtampak = يبان.
      ar: membunuh rusa = يقتل الغزال، وهذا ما لا يريده الصياد. أما menjaga فيحرس، وtampak يبدو.
      en: membunuh rusa is to kill the deer, which the hunter won't do. menjaga is to guard and tampak is to seem.
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: 'الأم بتقول لابنها: «خلّي بالك من أختك».'
      ar: 'تقول الأم لابنها: «اعتنِ بأختك».'
      en: A mother tells her son, "Look after your sister."
    options: ['Jaga adikmu, ya.', 'Bunuh adikmu, ya.', 'Benci adikmu, ya.']
    answer: 0
    explain:
      ar_eg: jaga = خلّي بالك أو احرس. bunuh = اقتل، وbenci = اكره.
      ar: jaga = اعتنِ أو احرس. أما bunuh فاقتل، وbenci اكره.
      en: jaga means look after. bunuh is kill, and benci is hate.
    words: [menjaga, membunuh, benci]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الجنية ظهرت فجأة قدام الصياد.
      ar: ظهرت الجنية فجأة أمام الصياد.
      en: The fairy suddenly appeared in front of the fisherman.
    answer: Peri itu tiba-tiba muncul di depan nelayan.
    distractors: [tampak, gila]
    words: [muncul, tampak, gila]
    explain:
      ar_eg: tiba-tiba muncul = ظهر فجأة. tampak = يبان، وgila = مجنون، ومالهمش مكان هنا.
      ar: tiba-tiba muncul = ظهر فجأة. أما tampak فيبدو، وgila مجنون، ولا مكان لهما هنا.
      en: tiba-tiba muncul means suddenly appeared. tampak is to seem and gila is crazy; they don't belong here.
  - id: e09
    type: translate
    direction: from_target
    source_text: Orang-orang bilang pemuda itu gila, tapi dia sebenarnya pintar.
    answers_meaning:
      ar_eg: [الناس قالوا إن الشاب ده مجنون، بس هو في الحقيقة ذكي, الناس افتكروه مجنون، بس هو شاطر فعلًا]
      ar: [قال الناس إن ذلك الشاب مجنون، لكنه ذكي في الحقيقة, ظنّ الناس الشاب مجنونًا، وهو في الحقيقة ذكي]
      en: ['People said that young man was crazy, but he''s actually clever', 'People called him mad, but he is really smart']
    words: [gila]
  - id: e10
    type: speaking
    text: Penyihir itu benci pada sang putri.
    meaning:
      ar_eg: الساحرة دي بتكره الأميرة.
      ar: تكره تلك الساحرة الأميرة.
      en: The witch hated the princess.
    words: [benci, bodoh, diam]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Di cerita Opa Jemmy, siapa yang menjaga pohon ajaib itu?
      ar_eg: في حكاية أوبا جيمي، مين اللي بيحرس الشجرة السحرية؟
      ar: في حكاية أوبا جيمي، من يحرس الشجرة السحرية؟
      en: In Opa Jemmy's story, who guards the magic tree?
    - speaker: Mohamed
      text: Seekor naga. Dia muncul setiap malam.
      ar_eg: تنّين. بيظهر كل ليلة.
      ar: تنّين يظهر كل ليلة.
      en: A dragon. It appears every night.
    - speaker: Mas Rizal
      text: Terus, pemuda bodoh itu mau membunuh naganya?
      ar_eg: وبعدين، الشاب الغبي ده عايز يقتل التنين؟
      ar: وهل أراد ذلك الشاب الأحمق قتل التنين؟
      en: And then the foolish young man wants to kill the dragon?
    - speaker: Mohamed
      text: Iya! Orang-orang bilang dia gila. Tapi naganya tampak sedih, jadi dia diam saja.
      ar_eg: أيوه! الناس قالوا عليه مجنون. بس التنين كان باين عليه زعلان، ففضل ساكت.
      ar: نعم! قال الناس إنه مجنون، لكن التنين بدا حزينًا، فظلّ صامتًا.
      en: Yes! People said he was crazy. But the dragon looked sad, so he just stayed quiet.
    - speaker: Mas Rizal
      text: Ha ha, ternyata dia tidak bodoh. Dia tidak benci pada naga itu.
      ar_eg: ها ها، طلع مش غبي. هو مش بيكره التنين.
      ar: تبيّن أنه ليس أحمق، فهو لا يكره التنين.
      en: Ha ha, so he isn't foolish after all. He doesn't hate the dragon.
