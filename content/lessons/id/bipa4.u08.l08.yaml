schema: kabar.lesson/v1
id: bipa4.u08.l08
language: id
title: Si bodoh dan si penjaga
can_do:
  ar_eg: 'توصف شخصيات الحواديت: الغبي، المجنون، الساكت، واللي بيحرس.'
  ar: 'أن تصف شخصيات الحكايات: الأحمق والمجنون والصامت والحارس.'
  en: 'Describe folk-tale characters: the fool, the madman, the silent one and the guard.'
slides:
  - title: Tokoh dalam dongeng
    body:
      ar_eg: |
        bodoh = غبي، gila = مجنون، diam = ساكت أو ثابت (diam saja = فضل ساكت).
        benci = يكره (عكس suka)، membunuh = يقتل (bunuh = قتل).
        muncul = يظهر فجأة، tampak = يبان، شكله (tampak sedih = باين عليه زعلان)، menjaga = يحرس أو ياخد باله (jaga = حراسة).
      ar: |
        bodoh = أحمق، gila = مجنون، diam = صامت أو ساكن (diam saja = ظلّ صامتًا).
        benci = يكره (عكس suka)، membunuh = يقتل (bunuh = قتل).
        muncul = يظهر فجأة، tampak = يبدو (tampak sedih = يبدو حزينًا)، menjaga = يحرس أو يرعى (jaga = حراسة).
      en: |
        bodoh = stupid, foolish, gila = crazy, diam = silent, still (diam saja = just stayed quiet).
        benci = to hate (opposite of suka), membunuh = to kill (bunuh = kill).
        muncul = to appear, tampak = to look, seem (tampak sedih = looks sad), menjaga = to guard, look after (jaga = guard).
    examples:
      - text: Tiba-tiba seekor harimau muncul dari hutan.
        ar_eg: فجأة نمر ظهر من الغابة.
        ar: فجأة ظهر نمر من الغابة.
        en: Suddenly a tiger appeared from the forest.
      - text: Raja itu tampak marah, tapi dia diam saja.
        ar_eg: الملك باين عليه زعلان، بس فضل ساكت.
        ar: بدا الملك غاضبًا، لكنه ظلّ صامتًا.
        en: The king looked angry, but he just stayed silent.
      - text: Anjing itu menjaga rumah petani setiap malam.
        ar_eg: الكلب ده بيحرس بيت الفلاح كل ليلة.
        ar: يحرس ذلك الكلب بيت المزارع كل ليلة.
        en: That dog guards the farmer's house every night.
