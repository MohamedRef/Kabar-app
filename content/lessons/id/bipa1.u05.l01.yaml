schema: kabar.lesson/v1
id: bipa1.u05.l01
language: id
title: Berlibur dan berenang
can_do:
  ar_eg: تتكلم عن الأنشطة (زي العوم واللعب والأجازة) بأفعال ber-.
  ar: أن تتحدث عن الأنشطة (كالسباحة واللعب والعطلة) بأفعال ber-.
  en: Talk about activities with ber- verbs.
slides:
  - title: ber- = بيعمل النشاط ده
    body:
      ar_eg: |
        البادئة ber- غالبًا بتعمل فعل «لازم»، يعني مالوش مفعول به (فيه شواذ زي belajar bahasa Indonesia). بتحطها قبل الجذر وخلاص:
        - main → bermain (يلعب)
        - libur → berlibur (يقضي أجازة)
        - jalan → berjalan (يمشي)
        - bicara → berbicara (يتكلم)
      ar: |
        السابقة ber- تصوغ في الغالب فعلًا لازمًا لا مفعول له (ومن الاستثناءات belajar bahasa Indonesia)، وتوضع قبل الجذر:
        - main → bermain (يلعب)
        - libur → berlibur (يقضي عطلة)
        - jalan → berjalan (يمشي)
        - bicara → berbicara (يتكلم)
      en: |
        The prefix ber- mostly makes verbs that take no object (a few, like belajar bahasa Indonesia, do). Just put it before the root:
        - main → bermain (play)
        - libur → berlibur (go on holiday)
        - jalan → berjalan (walk)
        - bicara → berbicara (speak)
    grammar: id.prefix.ber.basic
    examples:
      - text: Anak-anak bermain di taman.
        ar_eg: العيال بيلعبوا في الجنينة.
        ar: الأطفال يلعبون في الحديقة.
        en: The children are playing in the park.
      - text: Kami berlibur di Ancol.
        ar_eg: إحنا بنقضي الأجازة في أنكول.
        ar: نقضي عطلتنا في أنكول.
        en: We're on holiday in Ancol.
  - title: berenang, bekerja, belajar
    body:
      ar_eg: |
        ber- ساعات بتتغير شوية عشان النطق يبقى أسهل:
        - لو الجذر بيبدأ بـ r، الـ r بتاعة ber بتقع: ber + renang → berenang (يعوم).
        - مع kerja بتبقى be-: kerja → bekerja (يشتغل)، مش «berkerja».
        - كلمة واحدة شاذة احفظها: ajar → belajar (يذاكر / يتعلم).
      ar: |
        تتغير ber- قليلًا تيسيرًا للنطق:
        - إذا بدأ الجذر بـ r سقطت راء ber: ber + renang → berenang (يسبح).
        - ومع kerja تصير be-: kerja → bekerja (يعمل)، لا «berkerja».
        - وشاذ واحد يُحفظ: ajar → belajar (يتعلم / يدرس).
      en: |
        ber- sometimes changes a little to stay easy to say:
        - If the root starts with r, ber's own r drops: ber + renang → berenang (swim).
        - With kerja it becomes be-: kerja → bekerja (work), never "berkerja".
        - One exception to memorise: ajar → belajar (study, learn).
    grammar: id.prefix.ber.basic
    examples:
      - text: Rina berenang di pantai.
        ar_eg: رينا بتعوم في البحر.
        ar: رينا تسبح في الشاطئ.
        en: Rina is swimming at the beach.
      - text: Saya bekerja di Jakarta.
        ar_eg: أنا بشتغل في جاكرتا.
        ar: أعمل في جاكرتا.
        en: I work in Jakarta.
      - text: Kami belajar bahasa Indonesia.
        ar_eg: إحنا بنذاكر إندونيسي.
        ar: ندرس الإندونيسية.
        en: We study Indonesian.
  - title: Jalan-jalan!
    body:
      ar_eg: |
        في الكلام العادي الإندونيسيين ساعات بيشيلوا ber-: «Lagi main» = بيلعب دلوقتي.
        وأشهر كلمة في الأجازات: jalan-jalan = نتفسح / نتمشى. دي من غير ber- خالص، وهي الرياضة القومية يوم الحد!
        وتقدر تتمنى لحد أجازة حلوة: Selamat berlibur! (نفس selamat بتاعة «سلامة»).
      ar: |
        في الكلام اليومي قد تُحذف ber-: «Lagi main» = يلعب الآن.
        وأشهر كلمة في العطلات jalan-jalan = التنزه، وهي بلا ber-، ونزهة يوم الأحد عادة شعبية.
        ولتمنّي عطلة سعيدة: Selamat berlibur! (وselamat من «سلامة»).
      en: |
        Casual speech often drops ber-: "Lagi main" = (he's) playing.
        The holiday word everyone uses is jalan-jalan = go out, stroll, have an outing — no ber- at all, and a national Sunday pastime.
        Wish someone a good holiday with Selamat berlibur! (selamat from Arabic «سلامة»).
    grammar: id.prefix.ber.basic
    examples:
      - text: Hari Minggu kami jalan-jalan ke Ancol.
        ar_eg: يوم الحد بنتفسح في أنكول.
        ar: يوم الأحد نتنزه في أنكول.
        en: On Sunday we go out to Ancol.
      - text: Selamat berlibur!
        ar_eg: أجازة سعيدة!
        ar: عطلة سعيدة!
        en: Have a good holiday!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: berenang
        ar_eg: يعوم
        ar: يسبح
        en: swim
      - text: berjalan
        ar_eg: يمشي
        ar: يمشي
        en: walk
      - text: berbicara
        ar_eg: يتكلم
        ar: يتكلم
        en: speak
      - text: bekerja
        ar_eg: يشتغل
        ar: يعمل
        en: work
      - text: belajar
        ar_eg: يذاكر / يتعلم
        ar: يتعلم / يدرس
        en: study, learn
      - text: berlibur
        ar_eg: يقضي أجازة
        ar: يقضي عطلة
        en: go on holiday
    words: [berenang, berjalan, berbicara, bekerja, belajar, berlibur]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: ber + kerja تبقى إيه؟
      ar: ما ناتج ber + kerja؟
      en: What does ber + kerja become?
    options: [bekerjar, berkerja, bekerja]
    answer: 2
    explain:
      ar_eg: مع kerja الـ r بتاعة ber بتقع، فتبقى bekerja.
      ar: تسقط راء ber مع kerja فتصير bekerja.
      en: ber loses its r before kerja, giving bekerja.
    words: [bekerja]
  - id: e03
    type: listen
    text: Raka berjalan ke pantai.
    options: ['Raka berjalan ke pantai.', 'Raka berenang di pantai.', 'Raka berbicara di pantai.']
    answer: 0
    meaning:
      ar_eg: راكا ماشي للبحر.
      ar: راكا يمشي إلى الشاطئ.
      en: Raka is walking to the beach.
    words: [berjalan, berenang, berbicara, pantai]
  - id: e04
    type: fill_blank
    sentence: Rina ___ di pantai.
    meaning:
      ar_eg: رينا بتعوم في البحر.
      ar: رينا تسبح في الشاطئ.
      en: Rina is swimming at the beach.
    options: [bekerja, berenang, belajar]
    answers: [berenang]
    words: [berenang, pantai]
  - id: e05
    type: listen
    text: Kami jalan-jalan ke Ancol.
    options: ['Kami jalan-jalan ke Ancol.', 'Kami berjalan ke Ancol.', 'Kami berlibur ke Ancol.']
    answer: 0
    meaning:
      ar_eg: إحنا بنتفسح في أنكول.
      ar: نتنزه في أنكول.
      en: We're going out to Ancol.
    explain:
      ar_eg: jalan-jalan = يتفسّح، لكن berjalan = يمشي على رجليه.
      ar: jalan-jalan = يتنزه، أما berjalan = يمشي على قدميه.
      en: jalan-jalan = go out, sightsee; berjalan = walk on foot.
    words: [jalan-jalan, berjalan, berlibur]
  - id: e06
    type: fill_blank
    sentence: Saya ___ bahasa Indonesia.
    meaning:
      ar_eg: أنا بتعلم إندونيسي.
      ar: أتعلم اللغة الإندونيسية.
      en: I'm learning Indonesian.
    options: [belajar, bekerja, berenang]
    answers: [belajar]
    words: [belajar]
  - id: e07
    type: speaking
    text: Hari Minggu kami jalan-jalan ke pantai.
    meaning:
      ar_eg: يوم الحد بنتفسح على البحر.
      ar: يوم الأحد نتنزه على الشاطئ.
      en: On Sunday we go out to the beach.
    words: [jalan-jalan, pantai]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «إحنا بنتفسح في جاكرتا»؟
      ar: كيف تقول «نتنزه في جاكرتا»؟
      en: How do you say "We're going out in Jakarta"?
    options: ['Kami jalan-jalan di Jakarta.', 'Kami berbicara di Jakarta.', 'Kami bekerja di Jakarta.']
    answer: 0
    words: [jalan-jalan, berbicara, bekerja]
  - id: e09
    type: listen
    text: Saya bekerja di Jakarta, tapi berlibur di pantai.
    options: ['Saya bekerja di Jakarta, tapi berlibur di pantai.', 'Saya berlibur di Jakarta, tapi bekerja di pantai.', 'Saya belajar di Jakarta, tapi berlibur di pantai.']
    answer: 0
    meaning:
      ar_eg: أنا بشتغل في جاكرتا، بس بقضي الأجازة على البحر.
      ar: أعمل في جاكرتا، لكن أقضي عطلتي على الشاطئ.
      en: I work in Jakarta, but I holiday at the beach.
    words: [bekerja, berlibur, belajar]
dialogue:
  title: Hari Minggu di Ancol
  lines:
    - speaker: Raka
      text: Halo, Mohamed! Kamu berlibur di Ancol?
      ar_eg: أهلًا يا محمد! إنت بتقضي الأجازة في أنكول؟
      ar: مرحبًا يا محمد! هل تقضي عطلتك في أنكول؟
      en: Hi, Mohamed! Are you on holiday in Ancol?
    - speaker: Mohamed
      text: Ya, Raka! Hari ini hari Minggu.
      ar_eg: أيوه يا راكا! النهارده الحد.
      ar: نعم يا راكا! اليوم يوم الأحد.
      en: Yes, Raka! Today is Sunday.
    - speaker: Raka
      text: Kamu berenang di pantai?
      ar_eg: إنت بتعوم في البحر؟
      ar: هل تسبح في الشاطئ؟
      en: Are you swimming at the beach?
    - speaker: Mohamed
      text: Ya, saya berenang. Anak-anak bermain di pantai juga.
      ar_eg: أيوه، أنا بعوم. والعيال بيلعبوا على البحر كمان.
      ar: نعم، أسبح. والأطفال يلعبون على الشاطئ أيضًا.
      en: Yes, I'm swimming. The children are playing on the beach too.
    - speaker: Raka
      text: Wah, asyik! Selamat berlibur!
      ar_eg: الله، حلو! أجازة سعيدة!
      ar: رائع! عطلة سعيدة!
      en: Oh, fun! Have a good holiday!
