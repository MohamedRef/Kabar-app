schema: kabar.lesson/v1
id: bipa6.u09.l04
language: id
title: Waralaba rumah makan
can_do:
  ar_eg: تتكلم عن الفرانشايز والفروع وتسأل عن شروط فتح فرع جديد.
  ar: أن تتحدّث عن الامتياز التجاري والفروع وتسأل عن شروط افتتاح فرع جديد.
  en: Talk about franchises and branches and ask what it takes to open a new outlet.
slides:
  - title: Satu resep, ratusan cabang
    body:
      ar_eg: |
        مطاعم بادانج مشهورة زي Sederhana عندها مئات الفروع في إندونيسيا، وفيه منها فروع waralaba.
        - waralaba = فرانشايز، امتياز تجاري
        - cabang = فرع
        - merek = ماركة / علامة تجارية
        - mitra = شريك: صاحب الفرع بيبقى mitra للشركة
        - seragam = موحّد / زي رسمي: الطعم والديكور والهدوم لازم يبقوا seragam في كل الفروع
      ar: |
        لمطاعم بادانغ الشهيرة مثل Sederhana مئات الفروع في إندونيسيا، وبعضها فروع waralaba.
        - waralaba = امتياز تجاري (فرانشايز)
        - cabang = فرع
        - merek = علامة تجارية
        - mitra = شريك: صاحب الفرع شريك للشركة
        - seragam = موحّد، زيّ موحّد: يجب أن يتوحّد الطعم والديكور واللباس في الفروع كلّها
      en: |
        Famous Padang restaurants like Sederhana have hundreds of branches across Indonesia, some of them waralaba outlets.
        - waralaba = franchise
        - cabang = branch
        - merek = brand
        - mitra = partner: a branch owner becomes the company's mitra
        - seragam = uniform: taste, décor and staff clothes must be seragam in every branch
    examples:
      - text: Mitra waralaba harus memakai merek, resep, dan seragam yang sama.
        ar_eg: شريك الفرانشايز لازم يستخدم نفس الماركة والوصفة والزي.
        ar: على شريك الامتياز استعمال العلامة والوصفة والزيّ نفسها.
        en: A franchise partner must use the same brand, recipe and uniform.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: waralaba
        ar_eg: فرانشايز
        ar: امتياز تجاري
        en: franchise
      - text: cabang
        ar_eg: فرع
        ar: فرع
        en: branch
      - text: merek
        ar_eg: ماركة
        ar: علامة تجارية
        en: brand
      - text: mitra
        ar_eg: شريك
        ar: شريك
        en: partner
      - text: seragam
        ar_eg: موحّد / زي رسمي
        ar: موحّد، زيّ موحّد
        en: uniform
    words: [waralaba, cabang, merek, mitra, seragam]
  - id: e02
    type: listen
    text: Rumah makan kami sudah punya dua puluh cabang di Sumatra Barat.
    question:
      ar_eg: المطعم عنده كام فرع؟
      ar: كم فرعًا للمطعم؟
      en: How many branches does the restaurant have?
    options:
      - فرعين.
      - عشرين فرع.
      - مية فرع.
    answer: 1
    words: [cabang]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي لازم يبقى seragam في كل فروع الفرانشايز؟
      ar: ما الذي يجب أن يكون seragam في كلّ فروع الامتياز؟
      en: What has to be seragam across all franchise branches?
    options:
      - أسامي الموظفين.
      - مواعيد نوم المدير.
      - الطعم والديكور والزي.
    answer: 2
    words: [seragam, waralaba]
  - id: e04
    type: fill_blank
    sentence: Kami mencari ___ yang mau membuka cabang di Bandung.
    meaning:
      ar_eg: بندوّر على شريك عايز يفتح فرع في باندونج.
      ar: نبحث عن شريك يرغب في افتتاح فرع في باندونغ.
      en: We're looking for a partner who wants to open a branch in Bandung.
    options: [mitra, merek, seragam]
    answers: [mitra]
    words: [mitra, cabang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «waralaba» جاية من إيه؟
      ar: ممّ تتكوّن «waralaba»؟
      en: What is "waralaba" made from?
    options:
      - wara (مميّز) + laba (مكسب)
      - warung + lama
      - warna + labu
    answer: 0
    explain:
      ar_eg: 'كلمة اتعملت مخصوص عشان تترجم franchise: مكسب مميّز.'
      ar: 'كلمة صيغت خصّيصًا لترجمة franchise: ربح مميّز.'
      en: 'A word coined to translate "franchise": a special profit.'
    words: [waralaba]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الماركة دي معروفة في كل إندونيسيا.
      ar: هذه العلامة التجارية معروفة في أنحاء إندونيسيا.
      en: This brand is known all over Indonesia.
    answer: Merek ini terkenal di seluruh Indonesia.
    distractors: [cabang, mitra]
    words: [merek]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عايز أفتح فرع فرانشايز في جاكرتا.
      ar: أريد افتتاح فرع امتياز في جاكرتا.
      en: I want to open a franchise branch in Jakarta.
    answers:
      - Saya ingin membuka cabang waralaba di Jakarta.
      - Saya mau membuka cabang waralaba di Jakarta.
      - Saya ingin membuka waralaba di Jakarta.
      - Saya mau membuka waralaba di Jakarta.
    words: [waralaba, cabang]
  - id: e08
    type: speaking
    text: Apa syarat untuk menjadi mitra waralaba Anda?
    meaning:
      ar_eg: إيه الشروط عشان أبقى شريك في الفرانشايز بتاعكم؟
      ar: ما شروط أن أصبح شريكًا في امتيازكم؟
      en: What does it take to become your franchise partner?
    words: [mitra, waralaba]
  - id: e09
    type: dictation
    text: Semua karyawan di setiap cabang memakai seragam merah.
    meaning:
      ar_eg: كل الموظفين في كل فرع لابسين زي أحمر.
      ar: يرتدي الموظّفون في كلّ فرع زيًّا أحمر موحّدًا.
      en: All staff in every branch wear a red uniform.
    words: [seragam, cabang]
  - id: e10
    type: fill_blank
    sentence: Logo dan nama ___ itu tidak boleh diubah oleh mitra.
    meaning:
      ar_eg: لوجو واسم الماركة مايتغيروش من الشريك.
      ar: لا يجوز للشريك تغيير شعار العلامة التجارية واسمها.
      en: The brand's logo and name may not be changed by the partner.
    options: [merek, cabang, seragam]
    answers: [merek]
    words: [merek]
dialogue:
  title: Cabang di Kairo?
  lines:
    - speaker: Mohamed
      text: Uda, bagaimana kalau rumah makan Uda membuka cabang di Kairo?
      ar_eg: يا أودا، إيه رأيك مطعمك يفتح فرع في القاهرة؟
      ar: يا أودا، ما رأيك أن يفتح مطعمك فرعًا في القاهرة؟
      en: Uda, how about your restaurant opening a branch in Cairo?
    - speaker: Uda Fadli
      text: Menarik! Tapi kami perlu mitra yang paham pasar Mesir.
      ar_eg: فكرة حلوة! بس محتاجين شريك فاهم السوق المصري.
      ar: فكرة مثيرة! لكننا نحتاج إلى شريك يفهم السوق المصرية.
      en: Interesting! But we'd need a partner who knows the Egyptian market.
    - speaker: Mohamed
      text: Saya bisa menjadi mitra waralaba. Apa syaratnya?
      ar_eg: أنا ممكن أبقى شريك الفرانشايز. إيه الشروط؟
      ar: يمكنني أن أكون شريك الامتياز. ما الشروط؟
      en: I could be the franchise partner. What are the conditions?
    - speaker: Uda Fadli
      text: Merek, resep, dan seragam harus sama. Rendang di Kairo harus seenak di Padang!
      ar_eg: الماركة والوصفة والزي لازم يبقوا زي ما هما. الرندانج في القاهرة لازم يبقى حلو زي بادانج!
      ar: يجب أن تبقى العلامة والوصفة والزيّ كما هي، وأن يكون الرندانغ في القاهرة لذيذًا كما في بادانغ!
      en: Brand, recipe and uniform must be the same. Rendang in Cairo has to taste as good as in Padang!
