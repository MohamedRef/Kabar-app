schema: kabar.lesson/v1
id: bipa6.u01.l06
language: id
title: Dialog dalam cerpen
can_do:
  ar_eg: تقرا الحوار في القصة وتفهم الشخصية بتتكلم إزاي من الفعل اللي قبل الكلام.
  ar: أن تقرأ الحوار في القصة وتفهم نبرة الشخصية من الفعل الذي يسبق كلامها.
  en: Read dialogue in a story and tell how a character speaks from the verb around it.
slides:
  - title: Bukan hanya "kata"
    body:
      ar_eg: |
        في الـ cerpen، الكاتب مش بيقول «kata Pak Lubis» وبس. الفعل بيورّيك نبرة الصوت:
        - berbisik = يوشوش، يتكلم بصوت واطي
        - membentak = يزعق في حد بعصبية
        - bergumam = يبرطم، يتكلم مع نفسه بصوت مش واضح
        - menyahut = يرد على حد نده عليه أو كلمه
        - tanda petik = علامات التنصيص "…" حوالين الكلام
      ar: |
        لا يكتفي كاتب الـ cerpen بقول «kata Pak Lubis»، فالفعل يكشف نبرة الصوت:
        - berbisik = يهمس
        - membentak = ينهر، يصرخ في أحد غاضبًا
        - bergumam = يتمتم، يكلّم نفسه بصوت غير واضح
        - menyahut = يردّ على من ناداه أو كلّمه
        - tanda petik = علامات التنصيص "…" حول الكلام
      en: |
        A cerpen writer doesn't stop at «kata Pak Lubis». The verb tells you the tone:
        - berbisik = to whisper
        - membentak = to snap at someone angrily
        - bergumam = to mutter to yourself
        - menyahut = to answer someone who called or spoke to you
        - tanda petik = quotation marks "…" around speech
    examples:
      - text: '"Jangan bangunkan Nenek," bisik Bang Togar.'
        ar_eg: «ماتصحّيش جدتك»، وشوش توجار.
        ar: «لا توقظ الجدّة»، همس توغار.
        en: '"Don''t wake Grandma," Bang Togar whispered.'
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: berbisik
        ar_eg: يوشوش
        ar: يهمس
        en: to whisper
      - text: membentak
        ar_eg: يزعق بعصبية
        ar: ينهر
        en: to snap at
      - text: bergumam
        ar_eg: يبرطم
        ar: يتمتم
        en: to mutter
      - text: menyahut
        ar_eg: يرد
        ar: يردّ
        en: to answer back
      - text: tanda petik
        ar_eg: علامات تنصيص
        ar: علامات تنصيص
        en: quotation marks
    words: [berbisik, membentak, bergumam, menyahut, tanda petik]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الشخصية زعلانة جدًا وبتزعق في ابنها. أنهي فعل؟
      ar: الشخصية غاضبة جدًا وتصرخ في ابنها. أيّ فعل يناسب؟
      en: The character is furious and shouts at her son. Which verb fits?
    options: [berbisik, membentak, bergumam]
    answer: 1
    words: [membentak]
  - id: e03
    type: listen
    text: Pak Lubis bergumam sendiri di teras, tetapi tidak ada yang mendengar.
    question:
      ar_eg: الأستاذ لوبيس كان بيعمل إيه؟
      ar: ماذا كان الأستاذ لوبيس يفعل؟
      en: What was Pak Lubis doing?
    options:
      - بيغني بصوت عالي.
      - بيزعق في جاره.
      - بيبرطم مع نفسه.
    answer: 2
    words: [bergumam]
  - id: e04
    type: fill_blank
    sentence: Di perpustakaan, kami harus ___ supaya tidak mengganggu orang lain.
    meaning:
      ar_eg: في المكتبة لازم نوشوش عشان مانضايقش حد.
      ar: في المكتبة علينا أن نهمس كي لا نزعج أحدًا.
      en: In the library we have to whisper so we don't bother anyone.
    options: [berbisik, membentak, menyahut]
    answers: [berbisik]
    words: [berbisik]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: '«"Ya, Bu!" sahut anak itu dari dapur.» الولد بيعمل إيه؟'
      ar: '«"Ya, Bu!" sahut anak itu dari dapur.» ماذا يفعل الولد؟'
      en: '«"Ya, Bu!" sahut anak itu dari dapur.» What is the boy doing?'
    options:
      - بيرد على أمه.
      - بيوشوش لأخوه.
      - بيكتب جواب.
    answer: 0
    explain:
      ar_eg: sahut هي menyahut من غير me-، زي ما بنقول bisik بدل berbisik بعد الكلام المنقول.
      ar: sahut هي menyahut بلا me-، كما تأتي bisik بدل berbisik بعد الكلام المنقول.
      en: sahut is menyahut without me-, just as bisik replaces berbisik after quoted speech.
    words: [menyahut]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الكاتب حط كلام الشخصية بين علامات تنصيص.
      ar: وضع الكاتب كلام الشخصية بين علامتي تنصيص.
      en: The writer put the character's words in quotation marks.
    answer: Pengarang menulis kata-kata tokoh di antara tanda petik.
    distractors: [bergumam, berbisik]
    words: [tanda petik]
  - id: e07
    type: translate
    direction: from_target
    source_text: '"Pergi!" bentak lelaki tua itu, lalu dia menutup pintu.'
    answers_meaning:
      ar_eg:
        - «امشي!» زعق الراجل العجوز، وبعدين قفل الباب.
        - الراجل الكبير زعق «امشي!» وقفل الباب.
      ar:
        - «اذهب!» صرخ الرجل العجوز، ثم أغلق الباب.
        - نهره الشيخ قائلًا «اذهب!» ثم أغلق الباب.
      en:
        - '"Go away!" the old man snapped, then he shut the door.'
        - The old man barked "Go away!" and closed the door.
    words: [membentak]
  - id: e08
    type: speaking
    text: Dia tidak menyahut ketika ibunya memanggil. Dia hanya berbisik kepada adiknya.
    meaning:
      ar_eg: هو مارّدش لما أمه ندهت عليه. هو بس وشوش أخوه الصغير.
      ar: لم يردّ حين نادته أمّه، بل همس لأخيه الصغير فقط.
      en: He didn't answer when his mother called. He only whispered to his little brother.
    words: [menyahut, berbisik]
  - id: e09
    type: dictation
    text: Nenek bergumam pelan sambil menjahit baju.
    meaning:
      ar_eg: الجدة كانت بتبرطم بالراحة وهي بتخيط الهدوم.
      ar: كانت الجدّة تتمتم بهدوء وهي تخيط الثوب.
      en: Grandma muttered softly as she sewed.
    words: [bergumam]
  - id: e10
    type: fill_blank
    sentence: Dalam cerpen, ucapan tokoh biasanya ditulis dengan ___.
    meaning:
      ar_eg: في القصة، كلام الشخصيات عادةً بيتكتب بين علامات تنصيص.
      ar: يُكتب كلام الشخصيات في القصة عادةً بين علامات التنصيص.
      en: In a story, characters' speech is usually written in quotation marks.
    options: [tanda petik, kilas balik, monolog batin]
    answers: [tanda petik]
    words: [tanda petik]
dialogue:
  title: Suara-suara di teras
  lines:
    - speaker: Bang Togar
      text: Dengar kalimat ini, Mohamed. "Dia pasti pulang," bisik Pak Lubis.
      ar_eg: اسمع الجملة دي يا محمد. «أكيد هيرجع»، وشوش الأستاذ لوبيس.
      ar: 'اسمع هذه الجملة يا محمد: «سيعود حتمًا»، همس الأستاذ لوبيس.'
      en: Listen to this line, Mohamed. "He'll come home," Pak Lubis whispered.
    - speaker: Mohamed
      text: Kalau dia berbisik, berarti dia tidak yakin. Dia hanya berharap.
      ar_eg: لو بيوشوش، يبقى هو مش متأكد. هو بس بيتمنى.
      ar: إن كان يهمس فهو غير واثق، بل يتمنّى فحسب.
      en: If he whispers, he isn't sure. He's only hoping.
    - speaker: Bang Togar
      text: Betul. Kalau pengarang menulis "bentak", maknanya lain sekali.
      ar_eg: مظبوط. لو الكاتب كتب «زعق»، المعنى يبقى مختلف خالص.
      ar: صحيح، ولو كتب الكاتب «صرخ» لاختلف المعنى تمامًا.
      en: Right. If the author wrote "snapped", it would mean something else entirely.
    - speaker: Mohamed
      text: Jadi kata kerja di luar tanda petik juga bercerita.
      ar_eg: يعني الفعل اللي برّه علامات التنصيص هو كمان بيحكي.
      ar: إذن فالفعل خارج علامات التنصيص يروي هو أيضًا.
      en: So the verb outside the quotation marks tells a story too.
