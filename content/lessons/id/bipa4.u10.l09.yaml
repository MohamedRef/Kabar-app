language: id
title: Riwayat Sam Ratulangi
can_do:
  ar_eg: تقرا سيرة قصيرة لشخصية وطنية وتطلع منها التواريخ والأحداث المهمة.
  ar: أن تقرأ سيرة قصيرة لشخصية وطنية وتستخرج منها التواريخ والأحداث المهمة.
  en: Read a short biography of a national figure and pick out the key dates and events.
slides:
  - title: Riwayat hidup singkat
    body:
      ar_eg: |
        النص ده من لوحة في متحف صغير في توندانو. اقراه بالراحة وخد بالك من التواريخ.
        افتكر: beliau للاحترام، وwafat = توفي (بأدب).
      ar: |
        هذا النص من لوحة في متحف صغير في توندانو. اقرأه بتمهّل ولاحظ التواريخ.
        تذكّر: beliau للاحترام، وwafat = تُوفّي (بأسلوب مهذّب).
      en: |
        This text is from a panel in a small museum in Tondano. Read it slowly and notice the dates.
        Remember: beliau shows respect; wafat = passed away (respectful).
    examples:
      - text: Gerungan Saul Samuel Jacob Ratulangi, atau Sam Ratulangi, lahir di Tondano, Minahasa, pada 5 November 1890.
        ar_eg: جيرونجان ساول صامويل ياكوب راتولانجي، أو سام راتولانجي، اتولد في توندانو في ميناهاسا يوم ٥ نوفمبر ١٨٩٠.
        ar: وُلد جيرونغان ساول صامويل ياكوب راتولانغي، المعروف بسام راتولانغي، في توندانو بميناهاسا في ٥ نوفمبر ١٨٩٠.
        en: Gerungan Saul Samuel Jacob Ratulangi, or Sam Ratulangi, was born in Tondano, Minahasa, on 5 November 1890.
      - text: Beliau belajar di Belanda dan Swiss, lalu mendapat gelar doktor dari Universitas Zurich pada tahun 1919.
        ar_eg: درس في هولندا وسويسرا، وبعدين خد الدكتوراه من جامعة زيورخ سنة ١٩١٩.
        ar: درس في هولندا وسويسرا، ثم نال درجة الدكتوراه من جامعة زيورخ عام ١٩١٩.
        en: He studied in the Netherlands and Switzerland, then earned a doctorate from the University of Zurich in 1919.
      - text: Pada tahun 1945, beliau menjabat sebagai Gubernur Sulawesi yang pertama. Beliau wafat di Jakarta pada tahun 1949.
        ar_eg: سنة ١٩٤٥ بقى أول محافظ لسولاويسي. واتوفّى في جاكرتا سنة ١٩٤٩.
        ar: في عام ١٩٤٥ تولّى منصب أول حاكم لسولاويسي، وتُوفّي في جاكرتا عام ١٩٤٩.
        en: In 1945 he served as the first Governor of Sulawesi. He passed away in Jakarta in 1949.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: سام راتولانجي اتولد فين؟
      ar: أين وُلد سام راتولانغي؟
      en: Where was Sam Ratulangi born?
    options: [Di Manado, Di Tomohon, Di Tondano]
    answer: 2
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: خد إيه من جامعة زيورخ؟
      ar: ماذا نال من جامعة زيورخ؟
      en: What did he earn at the University of Zurich?
    options: [Gelar doktor, Gelar dokter gigi, Gelar sarjana hukum]
    answer: 0
    explain:
      ar_eg: خد بالك! doktor = دكتوراه (درجة علمية)، لكن dokter = طبيب.
      ar: "انتبه: doktor = دكتوراه (درجة علمية)، أما dokter فهو الطبيب."
      en: Careful - doktor = a doctorate (a degree), but dokter = a medical doctor.
    words: [gelar]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: بقى محافظ إمتى؟
      ar: متى أصبح حاكمًا؟
      en: When did he become governor?
    options: [Tahun 1919, Tahun 1945, Tahun 1949]
    answer: 1
    words: [menjabat, gubernur]
  - id: e04
    type: listen
    text: Beliau wafat di Jakarta pada tahun 1949.
    options:
      - Beliau wafat di Tondano pada tahun 1949.
      - Beliau wafat di Jakarta pada tahun 1949.
      - Beliau lahir di Jakarta pada tahun 1949.
    answer: 1
    meaning:
      ar_eg: اتوفّى في جاكرتا سنة ١٩٤٩.
      ar: تُوفّي في جاكرتا عام ١٩٤٩.
      en: He passed away in Jakarta in 1949.
    words: [wafat]
