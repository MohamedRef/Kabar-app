schema: kabar.lesson/v1
id: bipa4.u10.l09
language: id
title: Begini maksudnya
can_do:
  ar_eg: 'تشرح معنى تعبير: «المعنى كده»، «على حد علمي»، «على الأقل».'
  ar: 'أن تشرح معنى تعبير: «المعنى هكذا»، «على حدّ علمي»، «على الأقل».'
  en: 'Explain what an expression means: "it''s like this", "as far as I know", "at least".'
slides:
  - title: Menjelaskan ungkapan
    body:
      ar_eg: |
        begini = كده (begini maksudnya = المعنى كده)، semacam = نوع من (semacam ungkapan = نوع من التعبيرات)، mengenai = بخصوص، عن.
        sejauh = على قد (sejauh saya tahu = على حد علمي)، setidaknya = على الأقل.
        menunjukkan = يوري، يبيّن (tunjuk = شاور)، tiap = كل (tiap hari = كل يوم، زي setiap)، detik = ثانية.
      ar: |
        begini = هكذا (begini maksudnya = المعنى هكذا)، semacam = نوع من (semacam ungkapan = نوع من التعابير)، mengenai = بشأن، عن.
        sejauh = بقدر (sejauh saya tahu = على حدّ علمي)، setidaknya = على الأقل.
        menunjukkan = يُظهر، يبيّن (tunjuk = أشار)، tiap = كل (tiap hari = كل يوم، مثل setiap)، detik = ثانية.
      en: |
        begini = like this (begini maksudnya = it means this), semacam = a kind of (semacam ungkapan = a kind of expression), mengenai = about, concerning.
        sejauh = as far as (sejauh saya tahu = as far as I know), setidaknya = at least.
        menunjukkan = to show (tunjuk = point), tiap = each, every (tiap hari = every day, like setiap), detik = second.
    examples:
      - text: 'Begini maksudnya: orang itu sudah banyak pengalaman.'
        ar_eg: 'المعنى كده: الشخص ده عنده خبرة كتير.'
        ar: 'المعنى هكذا: لدى ذلك الشخص خبرة كبيرة.'
        en: 'It means this: that person has a lot of experience.'
      - text: Sejauh saya tahu, ungkapan itu sudah sangat tua.
        ar_eg: على حد علمي، التعبير ده قديم جدًا.
        ar: على حدّ علمي، هذا التعبير قديم جدًا.
        en: As far as I know, that expression is very old.
      - text: Tiap hari saya belajar setidaknya lima ungkapan.
        ar_eg: كل يوم بتعلم خمس تعبيرات على الأقل.
        ar: أتعلم كل يوم خمسة تعابير على الأقل.
        en: Every day I learn at least five expressions.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: setidaknya
        ar_eg: على الأقل
        ar: على الأقل
        en: at least
