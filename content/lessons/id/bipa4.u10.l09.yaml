dialogue:
  title: Di museum Tondano
  lines:
    - speaker: Mohamed
      text: Mas, aku lagi baca riwayat hidup Sam Ratulangi.
      ar_eg: يا Mas، أنا بقرا سيرة حياة سام راتولانجي.
      ar: يا Mas، أقرأ الآن سيرة سام راتولانغي.
      en: Mas, I'm reading Sam Ratulangi's life story.
    - speaker: Mas Rizal
      text: Bagus. Kamu udah tahu beliau belajar di Swiss?
      ar_eg: حلو. كنت عارف إنه درس في سويسرا؟
      ar: جميل. هل كنت تعرف أنه درس في سويسرا؟
      en: Good. Did you know he studied in Switzerland?
    - speaker: Mohamed
      text: Udah. Beliau dapat gelar doktor tahun 1919. Luar biasa!
      ar_eg: عرفت. خد الدكتوراه سنة ١٩١٩. حاجة عظيمة!
      ar: نعم. نال الدكتوراه عام ١٩١٩. أمر مذهل!
      en: Yes. He got his doctorate in 1919. Amazing!
    - speaker: Mas Rizal
      text: Tapi beliau tetap rendah hati. Karena itu namanya jadi buah bibir sampai sekarang.
      ar_eg: بس فضل متواضع. وعشان كده اسمه على كل لسان لحد النهارده.
      ar: لكنه ظلّ متواضعًا، ولذلك ما زال اسمه على كل لسان حتى اليوم.
      en: But he stayed humble. That's why people still talk about him today.
    - speaker: Mohamed
      text: Pantes bandara di Manado pakai nama beliau.
      ar_eg: مش غريب إن مطار مانادو على اسمه.
      ar: لا عجب أن مطار مانادو يحمل اسمه.
      en: No wonder the airport in Manado bears his name.
