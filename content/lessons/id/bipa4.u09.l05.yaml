schema: kabar.lesson/v1
id: bipa4.u09.l05
language: id
title: Ulangan Unit 9
can_do:
  ar_eg: تناقش قانون بيئي وتدافع عن رأيك بالأسباب والنتايج.
  ar: أن تناقش قانونًا بيئيًا وتدافع عن رأيك بالأسباب والنتائج.
  en: Debate an environmental rule, backing your view with causes and effects.
slides:
  - title: Meng-…-kan dan sebab-akibat
    body:
      ar_eg: |
        افتكر:
        meN-…-kan: الموضوع مفعول من غير tentang (membicarakan kebijakan)، والسببية (menyelamatkan، membersihkan)، والحاجة اللي بتتنقل (mengumpulkan dana).
        السبب والنتيجة: karena، sehingga، Akibatnya, …، Oleh karena itu, …، berkat (حلو) / akibat (وحش).
      ar: |
        تذكّر:
        meN-…-kan: الموضوع مفعول بلا tentang (membicarakan kebijakan)، والسببية (menyelamatkan، membersihkan)، والشيء المنقول (mengumpulkan dana).
        السبب والنتيجة: karena، sehingga، Akibatnya, …، Oleh karena itu, …، berkat (جيد) / akibat (سيئ).
      en: |
        Remember:
        meN-…-kan: the topic as object, no tentang (membicarakan kebijakan); causative (menyelamatkan, membersihkan); the thing moved (mengumpulkan dana).
        Cause and effect: karena, sehingga, Akibatnya, …, Oleh karena itu, …, berkat (good) / akibat (bad).
    grammar: id.confix.men-kan
    examples:
      - text: Kami membicarakan kebijakan baru tentang sampah.
        ar_eg: إحنا اتناقشنا في السياسة الجديدة بتاعة الزبالة.
        ar: ناقشنا السياسة الجديدة بشأن النفايات.
        en: We discussed the new policy on rubbish.
      - text: Akibat perubahan iklim, banyak karang memutih.
        ar_eg: بسبب تغيّر المناخ، مرجان كتير ابيضّ.
        ar: نتيجةً لتغيّر المناخ ابيضّ كثير من المرجان.
        en: As a result of climate change, a lot of coral has turned white.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: larangan
        ar_eg: منع
        ar: حظر
        en: ban
      - text: kebijakan
        ar_eg: سياسة
        ar: سياسة
        en: policy
      - text: iklim
        ar_eg: مناخ
        ar: مناخ
        en: climate
      - text: mata pencaharian
        ar_eg: مصدر الرزق
        ar: مصدر الرزق
        en: livelihood
      - text: penyelam
        ar_eg: غطّاس
        ar: غوّاص
        en: diver
    words: [larangan, kebijakan, iklim, mata pencaharian, penyelam]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options: ["Kami membicarakan kebijakan itu.", "Kami membicarakan tentang kebijakan itu.", "Kami berbicara kebijakan itu."]
    answer: 0
    explain:
      ar_eg: membicarakan بياخد المفعول على طول، من غير tentang.
      ar: membicarakan يأخذ المفعول مباشرة بلا tentang.
      en: membicarakan takes its object directly, without tentang.
    words: [kebijakan]
  - id: e03
    type: multiple_choice
    question: ___ perubahan iklim, banyak karang memutih.
    question_meaning:
      ar_eg: بسبب تغيّر المناخ، مرجان كتير ابيضّ. أنهي كلمة؟
      ar: نتيجةً لتغيّر المناخ ابيضّ كثير من المرجان. أيّ كلمة تناسب؟
      en: As a result of climate change, a lot of coral has turned white. Which word fits?
    options: [Berkat, Akibat, Sehingga]
    answer: 1
    explain:
      ar_eg: النتيجة وحشة، يبقى akibat مش berkat. وsehingga مابتجيش في أول الجملة.
      ar: النتيجة سيئة فنستعمل akibat لا berkat، وsehingga لا تأتي في أول الجملة.
      en: The result is bad, so akibat, not berkat; sehingga can't open a sentence.
    words: [iklim]
  - id: e04
    type: listen
    text: Taman laut ini mengumpulkan dana untuk menyelamatkan terumbu karang.
    options: ["Taman laut ini mengumpulkan sampah untuk menyelamatkan terumbu karang.", "Taman laut ini membutuhkan dana untuk menyelamatkan terumbu karang.", "Taman laut ini mengumpulkan dana untuk menyelamatkan terumbu karang."]
    answer: 2
    meaning:
      ar_eg: المحمية البحرية دي بتجمع فلوس عشان تنقذ الشعاب المرجانية.
      ar: تجمع هذه المحمية البحرية الأموال لإنقاذ الشعاب المرجانية.
      en: This marine park raises funds to save the coral reefs.
    words: [taman laut, mengumpulkan, dana, menyelamatkan]
  - id: e05
    type: listen
    text: Plastik sekali pakai sulit didaur ulang sehingga banyak yang masuk ke laut.
    options: ["Plastik sekali pakai sulit didaur ulang sehingga banyak yang masuk ke laut.", "Plastik sekali pakai mudah didaur ulang sehingga sedikit yang masuk ke laut.", "Plastik sekali pakai sulit didaur ulang karena banyak yang masuk ke laut."]
    answer: 0
    meaning:
      ar_eg: البلاستيك اللي بيتستعمل مرة واحدة صعب يتعاد تدويره، فكتير منه بيوصل للبحر.
      ar: يصعب إعادة تدوير البلاستيك أحادي الاستخدام، فيصل كثير منه إلى البحر.
      en: Single-use plastic is hard to recycle, so a lot of it ends up in the sea.
    words: [sekali pakai, mendaur ulang]
  - id: e06
    type: fill_blank
    sentence: Pemerintah kota sudah ___ larangan kantong plastik.
    meaning:
      ar_eg: حكومة المدينة طبّقت خلاص منع الأكياس البلاستيك.
      ar: طبّقت حكومة المدينة حظر الأكياس البلاستيكية.
      en: The city government has already brought in a plastic-bag ban.
    options: [mengumpulkan, menerapkan, menyelamatkan]
    answers: [menerapkan]
    words: [menerapkan, larangan, kantong plastik]
  - id: e07
    type: fill_blank
    sentence: Suhu laut naik. ___, karang di Bunaken memutih.
    meaning:
      ar_eg: (اكتب رابط) حرارة البحر علت. والنتيجة إن المرجان في بوناكين ابيضّ.
      ar: (اكتب رابطًا) ارتفعت حرارة البحر، ونتيجة لذلك ابيضّ المرجان في بوناكن.
      en: (Type a connector.) The sea temperature rose. As a result, the coral at Bunaken turned white.
    answers: [Akibatnya, Oleh karena itu, Karena itu, Oleh sebab itu, Dampaknya]
    words: [suhu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: لازم نوزن المكسب والخسارة بتاعة السياسة دي.
      ar: يجب أن نزن مكاسب هذه السياسة وخسائرها.
      en: We must weigh the pros and cons of this policy.
    answer: Kita harus menimbang untung-rugi kebijakan ini.
    distractors: [tentang, berkat]
    words: [untung-rugi, kebijakan]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بفضل المنع ده، البحر بقى أنضف.
      ar: بفضل ذلك الحظر صار البحر أنظف.
      en: Thanks to the ban, the sea is cleaner.
    answers:
      - Berkat larangan itu, laut lebih bersih.
      - Berkat larangan itu, laut lebih bersih
      - Berkat larangan itu, laut menjadi lebih bersih.
      - Berkat larangan ini, laut menjadi lebih bersih.
      - Berkat larangan itu, lautnya lebih bersih.
      - Berkat larangan tersebut, laut lebih bersih.
      - Berkat larangan itu, laut sudah lebih bersih.
    words: [larangan]
  - id: e10
    type: speaking
    text: Saya berpendapat bahwa kebijakan ini wajib diterapkan, karena kesadaran warga masih rendah.
    meaning:
      ar_eg: رأيي إن السياسة دي لازم تتطبّق، عشان وعي الناس لسه قليل.
      ar: أرى أنّ هذه السياسة يجب أن تُطبَّق، لأن وعي السكان ما زال منخفضًا.
      en: I believe this policy must be applied, because residents' awareness is still low.
    words: [wajib, kesadaran, kebijakan]
dialogue:
  title: Debat di dermaga Bunaken
  lines:
    - speaker: Pak Johan
      text: Larangan memancing di kawasan ini merugikan nelayan.
      ar_eg: منع الصيد في المنطقة دي بيضرّ الصيادين.
      ar: حظر الصيد في هذه المنطقة يضرّ الصيادين.
      en: The fishing ban in this area hurts fishermen.
    - speaker: Mohamed
      text: Saya mengerti, Pak. Tetapi berkat larangan itu, ikan di Bunaken bertambah banyak.
      ar_eg: فاهم يا عم. بس بفضل المنع ده، السمك في بوناكين زاد.
      ar: أفهم يا سيدي، لكن بفضل ذلك الحظر ازداد السمك في بوناكن.
      en: I understand, sir. But thanks to that ban, there are more fish at Bunaken.
    - speaker: Pak Johan
      text: Lalu, bagaimana dengan mata pencaharian kami?
      ar_eg: طب وأكل عيشنا؟
      ar: وماذا عن مصدر رزقنا؟
      en: Then what about our livelihood?
    - speaker: Mohamed
      text: Dana dari penyelam bisa digunakan untuk membuka lapangan kerja baru bagi nelayan.
      ar_eg: الفلوس اللي جاية من الغطاسين ممكن تتصرف على فرص شغل جديدة للصيادين.
      ar: يمكن استخدام أموال الغواصين لتوفير فرص عمل جديدة للصيادين.
      en: The divers' fees can be used to create new jobs for fishermen.
    - speaker: Pak Johan
      text: Hmm, itu solusi yang masuk akal.
      ar_eg: همم، ده حل معقول.
      ar: همم، هذا حل معقول.
      en: Hmm, that's a sensible solution.
souvenir:
  id: bipa4.u09.souvenir
  title: Dinding karang Bunaken
  note:
    ar_eg: في بوناكين، قدام مانادو، الشعاب المرجانية نازلة زي الحيطة في عمق البحر، مليانة سمك ملوّن وسلاحف. المحمية بتصرف على نفسها جزئيًا من رسوم دخول الغطاسين، يعني كل غطّاس بيساهم في حمايتها. وفي إندونيسيا، منع الأكياس البلاستيك بيتنشر مدينة ورا مدينة، ومع كل شنطة قماش بتشيلها إنت كمان بتساعد.
    ar: في بوناكن، قبالة مانادو، تنحدر الشعاب المرجانية كالجدران نحو أعماق البحر، عامرة بالأسماك الملونة والسلاحف. وتموّل المحمية نفسها جزئيًا من رسوم دخول الغواصين، فكل غوّاص يسهم في حمايتها. وفي إندونيسيا ينتشر حظر الأكياس البلاستيكية مدينةً بعد مدينة، وكل حقيبة قماش تحملها تساعد أنت أيضًا.
    en: At Bunaken, off Manado, coral walls drop steeply into the deep, full of colourful fish and turtles. The park pays its way partly through divers' entrance fees, so every diver helps protect it. Across Indonesia, plastic-bag bans are spreading city by city, and every cloth bag you carry helps too.
