        ar_eg: قرش
        ar: قرش
        en: shark
    words: [oksigen, populasi, pengendalian, hiu]
  - id: e03
    type: listen
    text: Air di teluk ini kekurangan oksigen.
    question:
      ar_eg: الميّه ناقصها إيه؟
      ar: ما الذي ينقص الماء؟
      en: What is the water short of?
    options: [الأكسجين, الملح, السمك]
    answer: 0
    meaning:
      ar_eg: الميّه في الخليج ده ناقصها أكسجين.
      ar: يعاني الماء في هذا الخليج من نقص الأكسجين.
      en: The water in this bay is short of oxygen.
    words: [teluk, oksigen]
  - id: e04
    type: fill_blank
    sentence: Tempat ___ sampah kota ada di luar kota.
    meaning:
      ar_eg: مكان ___ زبالة المدينة برّه المدينة.
      ar: يقع مكان ___ نفايات المدينة خارجها.
      en: The city's rubbish ___ site is outside town.
    options: [pembuangan, populasi, hiu]
    answers: [pembuangan]
    words: [pembuangan, populasi, hiu]
    explain:
      ar_eg: tempat pembuangan sampah = مقلب الزبالة. populasi = عدد السكان، وhiu = قرش.
      ar: tempat pembuangan sampah = مكبّ النفايات. أما populasi فعدد السكان، وhiu القرش.
      en: tempat pembuangan sampah is a rubbish dump. populasi is population, and hiu is a shark.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: سمكة كبيرة ليها سنان حادة. ده إيه؟
      ar: سمكة كبيرة ذات أسنان حادّة. ما هي؟
      en: A big fish with sharp teeth. What is it?
    options: [zat, teluk, hiu]
    answer: 2
    explain:
      ar_eg: hiu = سمك القرش.
      ar: hiu = سمك القرش.
      en: hiu = shark.
    words: [zat, teluk, hiu]
  - id: e06
    type: fill_blank
    sentence: Setelah tiga hari di kapal, kami senang melihat ___ lagi.
    meaning:
      ar_eg: بعد تلات أيام في المركب، فرحنا لما شفنا ___ تاني.
      ar: بعد ثلاثة أيام في السفينة فرحنا برؤية ___ مجددًا.
      en: After three days on the boat, we were glad to see ___ again.
    options: [daratan, oksigen, pengendalian]
    answers: [daratan]
    words: [daratan, oksigen, pengendalian]
    explain:
      ar_eg: daratan = البر، وبعد تلات أيام في البحر بتفرح لما تشوفه. oksigen = أكسجين، وpengendalian = تحكّم.
      ar: daratan = اليابسة، وبعد ثلاثة أيام في البحر تفرح برؤيتها. أما oksigen فالأكسجين، وpengendalian التحكم.
      en: daratan is land, a welcome sight after three days at sea. oksigen is oxygen, and pengendalian is control.
  - id: e07
    type: multiple_choice
    question: Pemerintah perlu ___ sampah plastik yang lebih baik.
    options: [pengendalian, populasi, daratan]
    answer: 0
    explain:
      ar_eg: pengendalian = سيطرة وتحكم.
      ar: pengendalian = ضبط وسيطرة.
      en: pengendalian = control.
    words: [pengendalian, populasi, daratan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المواد الكيماوية دي خطر على السمك.
      ar: هذه المواد الكيميائية خطرة على الأسماك.
      en: These chemicals are dangerous for fish.
    answer: Zat kimia ini berbahaya untuk ikan.
    distractors: [oksigen, teluk]
    words: [zat, oksigen, teluk]
    explain:
      ar_eg: zat kimia = مادة كيماوية، وخطيرة على السمك. oksigen = أكسجين، وteluk = خليج، ومش في الجملة.
      ar: zat kimia = المادة الكيميائية، وهي خطرة على السمك. أما oksigen فالأكسجين، وteluk الخليج، وليسا في الجملة.
      en: zat kimia is a chemical, dangerous to fish. oksigen and teluk (bay) aren't in the sentence.
  - id: e09
    type: translate
    direction: from_target
    source_text: Populasi ikan di teluk turun karena limbah pabrik.
    answers_meaning:
      ar_eg: [عدد السمك في الخليج قلّ بسبب مخلفات المصانع, السمك في الخليج بقى أقل عشان زبالة المصنع]
      ar: [انخفض تعداد الأسماك في الخليج بسبب مخلفات المصانع, قلّت الأسماك في الخليج بسبب نفايات المصنع]
      en: [The fish population in the bay fell because of factory waste, Fish numbers in the bay dropped due to factory waste]
    words: [populasi, teluk]
  - id: e10
    type: speaking
    text: Kita perlu pengendalian pembuangan zat kimia ke teluk.
    meaning:
      ar_eg: محتاجين سيطرة على رمي المواد الكيماوية في الخليج.
      ar: نحتاج إلى ضبط إلقاء المواد الكيميائية في الخليج.
      en: We need control over dumping chemicals into the bay.
    words: [pengendalian, pembuangan, zat, teluk, hiu, daratan]
dialogue:
  lines:
    - speaker: Kak Steven
      text: Mohamed, lihat air teluk di sini. Warnanya hitam.
      ar_eg: يا محمد، بص ميّة الخليج هنا. لونها إسود.
      ar: يا محمد، انظر إلى ماء الخليج هنا. لونه أسود.
      en: Mohamed, look at the bay water here. It's black.
    - speaker: Mohamed
      text: Kok bisa? Kotorannya dari mana?
      ar_eg: ليه؟ الوساخة دي جاية منين؟
      ar: لماذا؟ من أين تأتي هذه القذارة؟
      en: Why? Where's the dirt from?
    - speaker: Kak Steven
      text: Dari pembuangan limbah di daratan. Ada zat kimia dari pabrik.
      ar_eg: من صرف المخلفات اللي على البر. فيه مواد كيماوية من المصانع.
      ar: من تصريف المخلفات على اليابسة. فيها مواد كيميائية من المصانع.
      en: From waste dumped on land. There are chemicals from factories.
    - speaker: Mohamed
      text: Ikannya bisa mati gara-gara kekurangan oksigen.
      ar_eg: السمك ممكن يموت من قلة الأكسجين.
      ar: قد تموت الأسماك من نقص الأكسجين.
      en: The fish could die from lack of oxygen.
    - speaker: Kak Steven
      text: Bener. Kata nelayan, dulu banyak hiu di sini. Sekarang populasinya kecil banget.
      ar_eg: صح. الصيادين بيحكوا إن زمان كان فيه قرش كتير هنا. دلوقتي عددهم قليل خالص.
      ar: صحيح. يروي الصيادون أن أسماك القرش كانت كثيرة هنا، والآن عددها قليل جدًا.
      en: Right. Fishermen say there used to be lots of sharks here. Now there are very few.
