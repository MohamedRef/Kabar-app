schema: kabar.lesson/v1
id: bipa4.u09.l05
language: id
title: Limbah di teluk
can_do:
  ar_eg: 'تتكلم عن التلوث في خليج: مواد سامة بتترمي، الأكسجين بيقل، والسمك بيختفي.'
  ar: 'أن تتحدث عن تلوّث خليج: مواد تُلقى فيه، ونقص الأكسجين، وتراجع أعداد الأسماك.'
  en: 'Talk about pollution in a bay: substances dumped, oxygen falling and fish disappearing.'
slides:
  - title: Teluk Manado
    body:
      ar_eg: |
        teluk = خليج، daratan = البر، اليابسة، pembuangan = رمي، تصريف (tempat pembuangan sampah).
        zat = مادة (zat kimia = مادة كيماوية)، oksigen = أكسجين.
        populasi = عدد (حيوانات أو ناس)، pengendalian = سيطرة، تحكم (pengendalian sampah)، hiu = قرش.
      ar: |
        teluk = خليج، daratan = اليابسة، pembuangan = تصريف، إلقاء (tempat pembuangan sampah).
        zat = مادة (zat kimia = مادة كيميائية)، oksigen = أكسجين.
        populasi = تعداد (حيوانات أو بشر)، pengendalian = ضبط، سيطرة (pengendalian sampah)، hiu = قرش.
      en: |
        teluk = bay, daratan = land, mainland; pembuangan = disposal, dumping (tempat pembuangan sampah).
        zat = substance (zat kimia = chemical), oksigen = oxygen.
        populasi = population, pengendalian = control (pengendalian sampah), hiu = shark.
    examples:
      - text: Pabrik itu membuang zat kimia ke teluk.
        ar_eg: المصنع ده بيرمي مواد كيماوية في الخليج.
        ar: يلقي ذلك المصنع مواد كيميائية في الخليج.
        en: That factory dumps chemicals into the bay.
      - text: Ikan perlu oksigen di dalam air.
        ar_eg: السمك محتاج أكسجين في الميّه.
        ar: تحتاج الأسماك إلى الأكسجين في الماء.
        en: Fish need oxygen in the water.
      - text: Populasi hiu di laut makin kecil.
        ar_eg: عدد أسماك القرش في البحر بيقل.
        ar: تتناقص أعداد أسماك القرش في البحر.
        en: The shark population in the sea keeps shrinking.
