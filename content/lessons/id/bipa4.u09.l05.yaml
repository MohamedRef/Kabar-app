        ar: تصريف
        en: disposal
      - text: zat
        ar_eg: مادة
        ar: مادة
        en: substance
    words: [teluk, daratan, pembuangan, zat]
  - id: e02
    type: match_pairs
    pairs:
      - text: oksigen
        ar_eg: أكسجين
        ar: أكسجين
        en: oxygen
      - text: populasi
        ar_eg: عدد
        ar: تعداد
        en: population
      - text: pengendalian
        ar_eg: سيطرة
        ar: ضبط
        en: control
