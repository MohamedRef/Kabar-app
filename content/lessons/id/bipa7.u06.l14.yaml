schema: kabar.lesson/v1
id: bipa7.u06.l14
language: id
title: Ulangan Unit 6
can_do:
  ar_eg: تحكم على الكلام اللي على الإنترنت، تتأكّد منه، وتكتب عنه بموضوعية.
  ar: أن تحكم على ما يُنشر على الإنترنت، وتتحقّق منه، وتكتب عنه بموضوعية.
  en: Judge what is true online, check it, and write about it objectively.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sinonim
        ar_eg: مرادف
        ar: مرادف
        en: synonym
      - text: hoaks
        ar_eg: خبر كدب / إشاعة
        ar: خبر كاذب
        en: hoax
      - text: verifikasi
        ar_eg: تحقّق
        ar: تحقّق
        en: verification
      - text: privasi
        ar_eg: خصوصية
        ar: خصوصية
        en: privacy
      - text: opini
        ar_eg: رأي
        ar: رأي
        en: opinion
    words: [sinonim, hoaks, verifikasi, privasi, opini]
  - id: e02
    type: match_pairs
    pairs:
      - text: disinformasi
        ar_eg: تضليل متعمّد
        ar: تضليل متعمّد
        en: disinformation
      - text: akun palsu
        ar_eg: حساب مزيّف / فيك
        ar: حساب مزيّف
        en: fake account
      - text: pengelabuan
        ar_eg: تصيّد احتيالي (فيشينج)
        ar: التصيّد الاحتيالي
        en: phishing, deception
      - text: kolom komentar
        ar_eg: خانة التعليقات
        ar: قسم التعليقات
        en: comments section
    words: [disinformasi, akun palsu, pengelabuan, kolom komentar]
  - id: e03
    type: fill_blank
    sentence: '"Menyebarkan hoaks" dan "mengunggah foto" adalah contoh ___.'
    meaning:
      ar_eg: «ينشر إشاعة» و«يرفع صورة» أمثلة لكلمات بتيجي مع بعض.
      ar: «ينشر إشاعة» و«يرفع صورة» مثالان على التلازم اللفظي.
      en: '"Spreading a hoax" and "uploading a photo" are examples of collocation.'
    options: [antonim, kolokasi, hiponim]
    answers: [kolokasi]
    words: [kolokasi, antonim, hiponim, menyebarkan]
  - id: e04
    type: listen
    text: Unggahan yang provokatif itu ternyata berita palsu.
    question:
      ar_eg: طلع إيه البوست المستفزّ ده؟
      ar: ماذا تبيّن أنّ ذلك المنشور الاستفزازي؟
      en: What did the inflammatory post turn out to be?
    options:
      - خبر حقيقي.
      - رأي متوازن.
      - خبر مزيّف.
    answer: 2
    words: [unggahan, provokatif, berita palsu]
  - id: e05
    type: match_pairs
    pairs:
      - text: ruang gema
        ar_eg: غرفة صدى (بتسمع اللي زيّك بس)
        ar: غرفة الصدى
        en: echo chamber
      - text: deepfake
        ar_eg: فيديو مزيّف بالذكاء الاصطناعي
        ar: تزييف عميق
        en: deepfake
      - text: doksing
        ar_eg: نشر بيانات حد الشخصية علشان يأذوه
        ar: كشف البيانات الشخصية للإيذاء
        en: doxxing
      - text: detoks digital
        ar_eg: راحة من الموبايل والنت
        ar: صيام رقمي
        en: digital detox
    words: [ruang gema, deepfake, doksing, detoks digital]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: في المناظرة، أنهي جملة بتستعمل «repetisi» علشان تأكّد الفكرة؟
      ar: في المناظرة، أيّ جملة تستعمل «repetisi» لتأكيد الفكرة؟
      en: In the debate, which line uses "repetisi" to drive the point home?
    options:
      - Media sosial punya manfaat dan dampak negatif.
      - Literasi digital melindungi anak. Literasi digital melindungi keluarga.
      - Kecanduan gim juga ada.
    answer: 1
    words: [repetisi, literasi digital, dampak negatif, kecanduan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الخبر ده مضلّل، ماتنشروش.
      ar: هذا الخبر مضلِّل، فلا تنشره.
      en: This story is misleading, so don't spread it.
    answers:
      - Berita ini menyesatkan, jangan disebarkan.
      - Berita ini menyesatkan, jangan menyebarkannya.
      - Berita itu menyesatkan, jangan disebarkan.
      - Kabar ini menyesatkan, jangan disebarkan.
    words: [menyesatkan, menyebarkan]
  - id: e08
    type: speaking
    text: Wartawan yang objektif memisahkan fakta dari opini.
    meaning:
      ar_eg: الصحفي الموضوعي بيفصل الحقيقة عن الرأي.
      ar: يفصل الصحفيّ الموضوعيّ الحقيقة عن الرأي.
      en: An objective journalist keeps fact apart from opinion.
    words: [objektif, opini]
  - id: e09
    type: fill_blank
    sentence: Judul ___ membuat orang mengklik tanpa membaca.
    meaning:
      ar_eg: العنوان الـ ___ بيخلّي الناس تدوس من غير ما تقرا.
      ar: يجعل عنوان ___ الناس ينقرون دون قراءة.
      en: A ___ headline makes people click without reading.
    options: [umpan klik, autentikasi, monetisasi]
    answers: [umpan klik]
    words: [umpan klik, autentikasi, monetisasi]
  - id: e10
    type: fill_blank
    sentence: Akun dengan ___ belum tentu menulis kebenaran.
    meaning:
      ar_eg: الحساب اللي عليه ___ مش شرط يكتب الحقيقة.
      ar: الحساب ذو ___ لا يكتب الحقيقة بالضرورة.
      en: An account with a ___ doesn't necessarily tell the truth.
    options: [centang biru, polarisasi, swafoto]
    answers: [centang biru]
    words: [centang biru, polarisasi, swafoto]
  - id: e11
    type: match_pairs
    pairs:
      - text: pemengaruh
        ar_eg: مؤثّر
        ar: مؤثّر
        en: influencer
      - text: peretas
        ar_eg: هاكر
        ar: مخترق
        en: hacker
      - text: saksi mata
        ar_eg: شاهد عيان
        ar: شاهد عيان
        en: eyewitness
      - text: tautan
        ar_eg: لينك
        ar: رابط
        en: link
      - text: tagar
        ar_eg: هاشتاج
        ar: وسم
        en: hashtag
    words: [pemengaruh, peretas, saksi mata, tautan, tagar]
  - id: e12
    type: multiple_choice
    question_meaning:
      ar_eg: 'مؤثّر نزّل فيديو عن كريم «سحري» من غير #iklan، ومعاه لينك خصم. ده إيه غالبًا؟'
      ar: 'نشر مؤثّر فيديو عن كريم «سحريّ» بلا #iklan ومعه رابط تخفيض. ما هذا غالبًا؟'
      en: 'An influencer posts a "magic" cream video with no #iklan, plus a discount link. What is it most likely?'
    options:
      - رأي شخصي محايد.
      - محتوى مدفوع مش مكتوب عليه، واللينك ممكن يبقى مشبوه.
      - خبر من مصدر رسمي.
    answer: 1
    explain:
      ar_eg: كود الخصم بيبيّن إن فيه kerja sama، والوعد «السحري» علامة إنك لازم تعمل cek fakta.
      ar: يدلّ رمز التخفيض على kerja sama، والوعد «السحريّ» علامة توجب cek fakta.
      en: The discount code points to a kerja sama, and the "magic" promise is a cue to cek fakta.
    words: [konten berbayar, mencurigakan, kerja sama, cek fakta]
dialogue:
  title: Lukisan di tebing Misool
  lines:
    - speaker: Kak Selvi
      text: Lihat tebing itu. Ada lukisan tangan merah yang udah tua banget.
      ar_eg: بص على الجرف ده. فيه رسومات إيدين حمرا قديمة جدًّا.
      ar: انظر إلى ذلك الجرف، عليه رسوم أيدٍ حمراء قديمة جدًّا.
      en: Look at that cliff. There are red hand paintings that are very old.
    - speaker: Mohamed
      text: Di internet ada unggahan yang bilang umurnya satu juta tahun. Emang bener?
      ar_eg: فيه بوست على النت بيقول إن عمرها مليون سنة. ده صح؟
      ar: في الإنترنت منشور يقول إنّ عمرها مليون سنة. أهذا صحيح؟
      en: There's a post online saying they're a million years old. Is that true?
    - speaker: Kak Selvi
      text: Yuk, cek fakta. Para peneliti cuma memperkirakan ribuan tahun, dan mereka masih hati-hati.
      ar_eg: يلا نتأكّد. الباحثين بيقدّروا عمرها بآلاف السنين بس، ولسّه حذرين.
      ar: هيّا نتحقّق. يقدّرها الباحثون بآلاف السنين فقط، وما زالوا حذرين.
      en: Let's fact-check. Researchers only estimate thousands of years, and they're still cautious.
    - speaker: Mohamed
      text: Jadi unggahan itu menyesatkan. Makasih, Kak. Besok aku berangkat ke Manokwari.
      ar_eg: يبقى البوست ده مضلّل. شكرًا يا كاك. بكرة مسافر مانوكواري.
      ar: إذن ذلك المنشور مضلِّل. شكرًا يا كاك، غدًا أسافر إلى مانوكواري.
      en: So that post is misleading. Thanks, Kak. Tomorrow I'm off to Manokwari.
souvenir:
  id: bipa7.u06.souvenir
  title: Misool
  note:
    ar_eg: ميسول في جنوب راجا أمبات، جزر جيرية ومغارات وبحيرات مخفية. على جروفها رسومات قديمة بالأحمر، إيدين وسمك وأشكال، والباحثين بيقدّروا إن عمرها آلاف السنين، بس العمر بالظبط لسّه مش متحدّد. وأهل القرى هناك اتّفقوا على مناطق بحرية ممنوع فيها الصيد علشان السمك يرجع يكتر. وعلى فكرة، كلمة «hoaks» كلمة رسمية في قاموس KBBI، مش بس عامّية.
    ar: ميسول في جنوب راجا أمبات، جزر كلسية وكهوف وبحيرات خفيّة. وعلى جروفها رسوم حمراء قديمة لأيدٍ وأسماك وأشكال، يقدّر الباحثون عمرها بآلاف السنين، وإن لم يُحسم عمرها بدقّة بعد. واتّفق أهل القرى هناك على مناطق بحرية يُمنع فيها الصيد لتتعافى الأسماك. وكلمة «hoaks» مدرجة رسميًّا في معجم KBBI، وليست عامّية فحسب.
    en: Misool lies in southern Raja Ampat, a world of karst islands, caves and hidden lagoons. Its cliffs carry old red paintings of hands, fish and shapes; researchers estimate them at thousands of years old, though their exact age is still unsettled. Villages there have agreed on no-fishing zones so the fish can recover. And "hoaks" is an official entry in the KBBI dictionary, not just slang.
