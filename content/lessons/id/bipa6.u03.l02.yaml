schema: kabar.lesson/v1
id: bipa6.u03.l02
language: id
title: Matrilineal
can_do:
  ar_eg: تقرا وتشرح نظام المينانجكاباو اللي النسب فيه من ناحية الأم.
  ar: أن تقرأ عن نظام المينانغكاباو الأمومي وتشرحه.
  en: Read about and explain the Minangkabau matrilineal system.
slides:
  - title: Garis ibu
    body:
      ar_eg: |
        المينانجكاباو في سومطرة الغربية matrilineal: الـ garis keturunan (النسب) من ناحية الأم.
        - الـ suku (العشيرة) بتيجي من الأم، مش من الأب.
        - الـ pusaka (الإرث العائلي)، زي البيت والأرض، بيمشي من الستات للبنات.
        - الـ mamak (الخال) هو اللي بيرشد ولاد أخته.
        - وده غير الـ warisan (الميراث) الشرعي للأملاك الشخصية، اللي بيمشي على الشريعة.
      ar: |
        المينانغكاباو في سومطرة الغربية matrilineal، فالـ garis keturunan (النسب) من جهة الأم.
        - تنتقل الـ suku (العشيرة) عن الأم لا الأب.
        - ويمضي الـ pusaka (الإرث العائلي) كالبيت والأرض من النساء إلى البنات.
        - والـ mamak (الخال) هو مرشد أبناء أخته.
        - وهذا غير الـ warisan (الميراث) الشرعي للأملاك الشخصية، الذي يتبع الشريعة.
      en: |
        The Minangkabau of West Sumatra are matrilineal: the garis keturunan (line of descent) runs through the mother.
        - Your suku (clan) comes from your mother, not your father.
        - The pusaka (family heritage), such as the house and land, passes from women to daughters.
        - The mamak (maternal uncle) guides his sister's children.
        - This differs from warisan (inheritance) of personal property, which follows Islamic law.
    examples:
      - text: Suku saya sama dengan suku ibu saya.
        ar_eg: عشيرتي هي نفس عشيرة أمي.
        ar: عشيرتي هي عشيرة أمّي.
        en: My clan is the same as my mother's.
