schema: kabar.lesson/v1
id: bipa1.u09.l08
language: id
title: Naik motor atau taksi?
can_do:
  ar_eg: تختار مواصلة وتقول إنها آمنة أو بطيئة، وتقول إنك قربت توصل.
  ar: أن تختار وسيلة نقل وتقول إنها آمنة أو بطيئة، وأنك أوشكت على الوصول.
  en: Choose transport, say whether it's safe or slow, and say you're almost there.
slides:
  - title: Naik apa?
    body:
      ar_eg: |
        naik + المواصلة: naik sepeda (عجلة)، naik motor (موتوسيكل)، naik taksi.
        jarak = مسافة: Jaraknya dekat, kita naik sepeda.
        في إندونيسيا الموتوسيكلات في كل حتة، وفيه «أوجيك»: موتوسيكل أجرة.
        cari = يدوّر على (عامية، والرسمي mencari). aman = آمن. lambat = بطيء.
        hampir = تقريبًا، قرّب: «Hampir sampai!» = قربنا نوصل!
      ar: |
        naik + وسيلة النقل: naik sepeda (درّاجة)، naik motor (درّاجة نارية)، naik taksi.
        jarak = مسافة: Jaraknya dekat, kita naik sepeda.
        تملأ الدرّاجات النارية إندونيسيا، ومنها «أوجيك»: درّاجة نارية للأجرة.
        cari = يبحث عن (بالعامية، والفصيح mencari). aman = آمن. lambat = بطيء.
        hampir = تقريبًا، كاد: «Hampir sampai!» = أوشكنا على الوصول!
      en: |
        naik + vehicle: naik sepeda (bicycle), naik motor (motorbike), naik taksi.
        jarak = distance: Jaraknya dekat, kita naik sepeda.
        Motorbikes are everywhere in Indonesia, including ojek, motorbike taxis.
        cari = look for (casual; formal mencari). aman = safe. lambat = slow.
        hampir = almost: "Hampir sampai!" = Nearly there!
    examples:
      - text: Saya naik motor ke kantor.
        ar_eg: بروح الشغل بالموتوسيكل.
        ar: أذهب إلى المكتب بالدرّاجة النارية.
        en: I ride a motorbike to the office.
      - text: Taksi itu lambat, jalannya ramai.
        ar_eg: التاكسي بطيء، الشارع زحمة.
        ar: سيارة الأجرة بطيئة، فالشارع مزدحم.
        en: The taxi is slow; the road is busy.
      - text: Kita hampir sampai!
        ar_eg: قربنا نوصل!
        ar: أوشكنا على الوصول!
        en: We're nearly there!
