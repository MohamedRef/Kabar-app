  - id: e03
    type: listen
    text: Saya cari taksi ke stasiun.
    question:
      ar_eg: بيدوّر على إيه؟
      ar: عمَّ يبحث؟
      en: What's he looking for?
    options: [تاكسي, موتوسيكل, عجلة]
    answer: 0
    meaning:
      ar_eg: بدوّر على تاكسي للمحطة.
      ar: أبحث عن سيارة أجرة إلى المحطة.
      en: I'm looking for a taxi to the station.
    words: [cari, taksi]
  - id: e04
    type: fill_blank
    sentence: Naik motor, kita ___ sampai!
    meaning:
      ar_eg: بالموتوسيكل، ___ نوصل!
      ar: بالدرّاجة النارية ___ نصل!
      en: By motorbike, we're ___ there!
    options: [hampir, aman, lambat]
    answers: [hampir]
    words: [motor, hampir, aman, lambat]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «المسافة من البيت للشغل خمسة كيلو.» كلمة «مسافة» بالإندونيسي؟
      ar: «المسافة من البيت إلى العمل خمسة كيلومترات.» ما كلمة «مسافة» بالإندونيسية؟
      en: '"It''s five kilometres from home to work." What''s the word for distance?'
    options: [jarak, sepeda, taksi]
    answer: 0
    explain:
      ar_eg: jarak = مسافة. sepeda عجلة، وtaksi تاكسي.
      ar: jarak مسافة، أما sepeda فدرّاجة وtaksi سيارة أجرة.
      en: jarak = distance; sepeda is a bicycle and taksi a taxi.
    words: [jarak, sepeda, taksi]
  - id: e06
    type: fill_blank
    sentence: Jalan ini ramai. Busnya ___, kita hampir terlambat.
    meaning:
      ar_eg: الشارع ده زحمة. الأتوبيس ___، وهنتأخر.
      ar: هذا الشارع مزدحم، والحافلة ___، فكدنا نتأخر.
      en: This road is busy. The bus is ___; we're nearly late.
    options: [lambat, aman, hampir]
    answers: [lambat]
    words: [lambat, hampir]
  - id: e07
    type: build_sentence
    source:
      ar_eg: ركوب العجلة هنا آمن.
      ar: ركوب الدرّاجة هنا آمن.
      en: Cycling here is safe.
    answer: Naik sepeda di sini aman.
    distractors: [jarak, cari]
    words: [sepeda, aman]
  - id: e08
    type: translate
    direction: from_target
    source_text: Saya naik motor ke kampus.
    answers_meaning:
      ar_eg: [بروح الجامعة بالموتوسيكل, بركب موتوسيكل للجامعة]
      ar: [أذهب إلى الجامعة بالدرّاجة النارية, أركب الدرّاجة النارية إلى الجامعة]
      en: [I ride a motorbike to campus, I go to campus by motorbike]
    words: [motor]
  - id: e09
    type: speaking
    text: Jaraknya jauh dan taksinya lambat.
    meaning:
      ar_eg: المسافة بعيدة والتاكسي بطيء.
      ar: المسافة بعيدة وسيارة الأجرة بطيئة.
      en: It's a long way and the taxi is slow.
    words: [jarak, taksi, lambat]
  - id: e10
    type: multiple_choice
    question: Dompet saya hilang! Saya ___ dompet saya.
    options: [cari, naik, turun]
    answer: 0
    explain:
      ar_eg: 'لما حاجة تضيع، بتدوّر عليها: cari.'
      ar: 'إذا ضاع شيء بحثت عنه: cari.'
      en: 'When something''s lost, you look for it: cari.'
    words: [cari]
dialogue:
  lines:
    - speaker: Raka
      text: Mohamed, kamu cari apa?
      ar_eg: يا محمد، بتدوّر على إيه؟
      ar: يا محمد، عمَّ تبحث؟
      en: Mohamed, what are you looking for?
    - speaker: Mohamed
      text: Aku cari taksi ke museum.
      ar_eg: بدوّر على تاكسي للمتحف.
      ar: أبحث عن سيارة أجرة إلى المتحف.
      en: I'm looking for a taxi to the museum.
    - speaker: Raka
      text: Taksi lambat, jalannya ramai. Jaraknya nggak jauh. Kita naik motorku!
      ar_eg: التاكسي بطيء والشارع زحمة. والمسافة مش بعيدة. تعالى نركب الموتوسيكل بتاعي!
      ar: سيارة الأجرة بطيئة والشارع مزدحم، والمسافة ليست بعيدة. لنركب درّاجتي النارية!
      en: Taxis are slow; the roads are busy. It's not far. Let's take my motorbike!
    - speaker: Mohamed
      text: Motor? Aman?
      ar_eg: موتوسيكل؟ أمان؟
      ar: درّاجة نارية؟ هل هي آمنة؟
      en: A motorbike? Is it safe?
    - speaker: Raka
      text: Aman! Aku jalan pelan-pelan.
      ar_eg: أمان! هسوق براحة.
      ar: آمنة! سأسير ببطء.
      en: Safe! I'll go slowly.
    - speaker: Mohamed
      text: Kita hampir sampai!
      ar_eg: قربنا نوصل!
      ar: أوشكنا على الوصول!
      en: We're nearly there!
