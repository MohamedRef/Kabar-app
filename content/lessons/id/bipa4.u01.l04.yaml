schema: kabar.lesson/v1
id: bipa4.u01.l04
language: id
title: Keahlian dan kesabaran
can_do:
  ar_eg: تقول الشغلانة محتاجة صفات إيه بأسماء ke-…-an.
  ar: أن تذكر صفات المهنة بأسماء معنوية على ke-…-an.
  en: Name the qualities a job needs with ke-…-an nouns.
slides:
  - title: ke-…-an = اسم معنوي
    body:
      ar_eg: |
        ke-…-an كمان بتعمل اسم معنوي (زي المصدر عندنا) من صفة:
        sabar (صابر) → kesabaran = الصبر
        jujur (أمين) → kejujuran = الأمانة / الصدق
        ahli (خبير) → keahlian = الخبرة / المهارة
        selamat (سالم) → keselamatan = السلامة
        بص: sabar من «صبر»، ahli من «أهل»، selamat من «سلامة» — جذور عربية جوه شكل إندونيسي!
      ar: |
        تصوغ ke-…-an أيضًا الاسم المعنوي (كالمصدر) من الصفة:
        sabar → kesabaran = الصبر
        jujur → kejujuran = الصدق والأمانة
        ahli → keahlian = الخبرة والمهارة
        selamat → keselamatan = السلامة
        ولاحظ أن sabar من «صبر»، وahli من «أهل»، وselamat من «سلامة».
      en: |
        ke-…-an also turns an adjective into an abstract noun:
        sabar (patient) → kesabaran = patience
        jujur (honest) → kejujuran = honesty
        ahli (expert) → keahlian = expertise, skill
        selamat (safe) → keselamatan = safety
        Notice: sabar ← صبر, ahli ← أهل, selamat ← سلامة — Arabic roots in Indonesian dress.
    grammar: id.confix.ke-an
    examples:
      - text: Profesi guru membutuhkan kesabaran.
        ar_eg: مهنة التدريس محتاجة صبر.
        ar: تحتاج مهنة التدريس إلى الصبر.
        en: Teaching requires patience.
      - text: Keselamatan pekerja harus dijaga.
        ar_eg: سلامة العمال لازم تتحافظ عليها.
        ar: يجب الحفاظ على سلامة العمال.
        en: Workers' safety must be protected.
  - title: Kesabaran atau kehujanan?
    body:
      ar_eg: |
        إزاي تفرق بين معنيين ke-…-an؟ من مكانها في الجملة:
        - فاعل أو مفعول = اسم معنوي: Kejujuran itu penting.
        - بعد الشخص مكان الفعل = حاجة حصلتله: Saya kehujanan.
        وtanggung jawab = مسؤولية (من غير ke-…-an، بس بنستعملها جنبهم كتير).
      ar: |
        يُميَّز معنيا ke-…-an بالموقع في الجملة:
        - مبتدأ أو مفعول = اسم معنوي: Kejujuran itu penting.
        - خبر بعد الشخص = إصابة: Saya kehujanan.
        وtanggung jawab = المسؤولية، وتُستعمل كثيرًا معها.
      en: |
        How to tell the two ke-…-an meanings apart? By position:
        - subject or object = abstract noun: Kejujuran itu penting.
        - in the verb slot after a person = it happened to them: Saya kehujanan.
        tanggung jawab = responsibility (no affix, but it keeps company with these nouns).
    grammar: id.confix.ke-an
    examples:
      - text: Kejujuran sangat penting bagi pedagang.
        ar_eg: الأمانة مهمة جدًا للتاجر.
        ar: الصدق مهم جدًا للتاجر.
        en: Honesty is very important for a trader.
      - text: Perawat punya tanggung jawab yang besar.
        ar_eg: الممرضة عليها مسؤولية كبيرة.
        ar: يتحمّل الممرض مسؤولية كبيرة.
        en: Nurses carry a big responsibility.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: keahlian
        ar_eg: الخبرة / المهارة
        ar: الخبرة والمهارة
        en: expertise, skill
      - text: kesabaran
        ar_eg: الصبر
        ar: الصبر
        en: patience
      - text: kejujuran
        ar_eg: الأمانة / الصدق
        ar: الصدق والأمانة
        en: honesty
      - text: keselamatan
        ar_eg: السلامة
        ar: السلامة
        en: safety
      - text: tanggung jawab
        ar_eg: مسؤولية
        ar: مسؤولية
        en: responsibility
      - text: membutuhkan
        ar_eg: محتاج / يتطلب
        ar: يحتاج إلى / يتطلب
        en: need, require
    words: [keahlian, kesabaran, kejujuran, keselamatan, tanggung jawab, membutuhkan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «الصبر»؟
      ar: أيّ كلمة تعني «الصبر»؟
      en: Which word means "patience"?
    options: ["menyabarkan", "kesabar", "kesabaran"]
    answer: 2
    explain:
      ar_eg: ke- + sabar + -an. الجزئين لازم مع بعض.
      ar: ke- + sabar + -an، ولا بد من الجزأين.
      en: ke- + sabar + -an — both parts are needed.
    words: [kesabaran]
  - id: e03
    type: listen
    text: Keselamatan pekerja harus dijaga.
    options: ["Kesehatan pekerja harus dijaga.", "Keselamatan pekerja harus dijaga.", "Keselamatan pekerja harus dijual."]
    answer: 1
    meaning:
      ar_eg: سلامة العمال لازم تتحافظ عليها.
      ar: يجب الحفاظ على سلامة العمال.
      en: Workers' safety must be protected.
    words: [keselamatan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: في أنهي جملة ke-…-an اسم معنوي (مش «حاجة حصلتلي»)؟
      ar: في أيّ جملة تكون ke-…-an اسمًا معنويًا لا معنى الإصابة؟
      en: In which sentence is ke-…-an an abstract noun (not "something happened to me")?
    options: ["Kejujuran sangat penting bagi pedagang.", "Saya kehujanan tadi pagi.", "Dia kecopetan di pasar."]
    answer: 0
    explain:
      ar_eg: kejujuran هنا الفاعل (الأمانة مهمة). kehujanan وkecopetan بعد الشخص = حاجة حصلتله.
      ar: kejujuran هنا مبتدأ، أما kehujanan وkecopetan فخبر بعد الشخص بمعنى الإصابة.
      en: kejujuran is the subject here; kehujanan and kecopetan follow a person = something happened.
    words: [kejujuran]
  - id: e05
    type: fill_blank
    sentence: Pekerjaan tukang kayu ___ keahlian khusus.
    meaning:
      ar_eg: شغل النجار محتاج مهارة خاصة.
      ar: يتطلب عمل النجار مهارة خاصة.
      en: A carpenter's work requires special skill.
    options: [membutuhkan, kesabaran, tanggung jawab]
    answers: [membutuhkan]
    words: [membutuhkan, keahlian]
  - id: e06
    type: fill_blank
    sentence: Pelaut punya ___ yang besar untuk kapalnya.
    meaning:
      ar_eg: البحّار عليه مسؤولية كبيرة عن مركبه.
      ar: يتحمّل البحّار مسؤولية كبيرة عن سفينته.
      en: A sailor carries a big responsibility for his ship.
    options: [tanggung jawab, keselamatan, kecopetan]
    answers: [tanggung jawab]
    words: [tanggung jawab]
  - id: e07
    type: build_sentence
    source:
      ar_eg: مهنة التدريس محتاجة صبر وأمانة.
      ar: تحتاج مهنة التدريس إلى الصبر والأمانة.
      en: Teaching requires patience and honesty.
    answer: Profesi guru membutuhkan kesabaran dan kejujuran.
    alternatives: ["Profesi guru membutuhkan kejujuran dan kesabaran."]
    distractors: [sabar, jujur]
    words: [membutuhkan, kesabaran, kejujuran]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الشغلانة دي محتاجة خبرة.
      ar: يتطلب هذا العمل خبرة.
      en: This job requires expertise.
    answers:
      - Pekerjaan ini membutuhkan keahlian.
      - Pekerjaan ini membutuhkan keahlian
      - Pekerjaan ini memerlukan keahlian.
      - Pekerjaan ini butuh keahlian.
      - Profesi ini membutuhkan keahlian.
      - Profesi ini memerlukan keahlian.
      - Pekerjaan ini perlu keahlian.
    words: [membutuhkan, keahlian]
  - id: e09
    type: speaking
    text: Pelaut punya tanggung jawab besar untuk keselamatan kapalnya.
    meaning:
      ar_eg: البحّار عليه مسؤولية كبيرة عن سلامة مركبه.
      ar: يتحمّل البحّار مسؤولية كبيرة عن سلامة سفينته.
      en: A sailor has a big responsibility for the safety of his ship.
    words: [tanggung jawab, keselamatan]
dialogue:
  title: Obrolan karier di kampus
  lines:
    - speaker: Andi
      text: Mohamed, menurutmu profesi apa yang paling sulit?
      ar_eg: يا محمد، في رأيك أنهي مهنة أصعب واحدة؟
      ar: يا محمد، ما أصعب مهنة في رأيك؟
      en: Mohamed, which job do you think is the hardest?
    - speaker: Mohamed
      text: Mungkin perawat. Profesi itu membutuhkan kesabaran.
      ar_eg: يمكن التمريض. المهنة دي محتاجة صبر.
      ar: ربما التمريض، فهي مهنة تحتاج إلى الصبر.
      en: Maybe nursing. That job requires patience.
    - speaker: Andi
      text: Setuju. Perawat juga butuh kejujuran, dan tanggung jawab mereka besar sekali.
      ar_eg: موافق. والممرضة كمان محتاجة أمانة، ومسؤوليتهم كبيرة جدًا.
      ar: أوافقك. والممرض يحتاج إلى الأمانة أيضًا، ومسؤوليته كبيرة جدًا.
      en: Agreed. Nurses also need honesty, and their responsibility is huge.
    - speaker: Mohamed
      text: Kalau kamu, mau jadi apa?
      ar_eg: وإنت، عايز تبقى إيه؟
      ar: وأنت، ماذا تريد أن تصبح؟
      en: And you, what do you want to be?
    - speaker: Andi
      text: Pembuat kapal, seperti Daeng Basri. Keahliannya luar biasa!
      ar_eg: صانع مراكب، زي داينج باسري. مهارته خرافية!
      ar: صانع سفن مثل داينغ باسري، فمهارته مدهشة!
      en: A shipbuilder, like Daeng Basri. His skill is amazing!
    - speaker: Mohamed
      text: Bagus! Jangan lupa keselamatan pelaut, ya.
      ar_eg: حلو! بس ما تنساش سلامة البحّارة.
      ar: رائع! ولا تنسَ سلامة البحّارة.
      en: Great! Don't forget the sailors' safety.
