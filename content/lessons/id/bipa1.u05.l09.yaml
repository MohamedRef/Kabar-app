dialogue:
  title: Liburan di Ancol
  lines:
    - speaker: Pak Irwan
      text: Selamat pagi, Mohamed. Bagaimana liburanmu?
      ar_eg: صباح الخير يا محمد. الأجازة كانت عاملة إزاي؟
      ar: صباح الخير يا محمد. كيف كانت عطلتك؟
      en: Good morning, Mohamed. How was your holiday?
    - speaker: Mohamed
      text: Seru, Pak! Saya berlibur ke Ancol.
      ar_eg: تحفة يا أستاذ! رحت أجازة في أنكول.
      ar: ممتعة يا أستاذ! قضيت عطلتي في أنكول.
      en: Fun, sir! I went on holiday to Ancol.
    - speaker: Pak Irwan
      text: Bagaimana cuacanya?
      ar_eg: والجو كان عامل إيه؟
      ar: وكيف كان الطقس؟
      en: How was the weather?
    - speaker: Mohamed
      text: Cerah dan panas. Saya berenang di pantai.
      ar_eg: صحو وحر. عُمت في البحر.
      ar: صحو وحار. سبحت في الشاطئ.
      en: Sunny and hot. I swam at the beach.
    - speaker: Pak Irwan
      text: Di Ancol ada masjid?
      ar_eg: فيه جامع في أنكول؟
      ar: هل يوجد مسجد في أنكول؟
      en: Is there a mosque in Ancol?
    - speaker: Mohamed
      text: Ada, Pak. Ada restoran juga.
      ar_eg: فيه يا أستاذ. وفيه مطاعم كمان.
      ar: يوجد يا أستاذ. وتوجد مطاعم أيضًا.
      en: There is, sir. There are restaurants too.
souvenir:
  id: bipa1.u05.souvenir
  title: Pantai Ancol
  note:
    ar_eg: كورنيش أنكول هو المكان اللي أهل جاكرتا بيهربوا له آخر الأسبوع. الـ jalan-jalan مع العيلة يوم الحد هواية قومية، زي الخروجة على الكورنيش عندنا في إسكندرية. ولو احتجت أي حاجة من حد غريب هناك، ابدأ بـ «permisi»، الكلمة دي بتفتح أي باب.
    ar: شاطئ أنكول هو المتنفس الذي يقصده أهل جاكرتا في عطلة نهاية الأسبوع. والتنزه (jalan-jalan) مع العائلة هواية وطنية، كالخروج إلى الكورنيش عندنا. وإذا احتجت شيئًا من غريب هناك فابدأ بـ «permisi»؛ فهي تفتح كل باب.
    en: Ancol's seafront is where Jakarta escapes at the weekend. A family jalan-jalan is a national pastime — think of an evening on the Alexandria Corniche. If you need anything from a stranger there, start with "permisi"; it opens almost any door.
