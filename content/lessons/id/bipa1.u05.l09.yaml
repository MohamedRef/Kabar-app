schema: kabar.lesson/v1
id: bipa1.u05.l09
language: id
title: Ulangan Unit 5
can_do:
  ar_eg: تتكلم عن رحلة نهاية الأسبوع.
  ar: أن تتحدث عن رحلة في عطلة نهاية الأسبوع.
  en: Talk about a weekend trip.
slides:
  - title: Liburanku — ringkasan
    body:
      ar_eg: |
        اللي أخدناه في الوحدة دي:
        - ber- للأنشطة: berlibur، berenang، bermain، bekerja، belajar.
        - ada / tidak ada = فيه / مفيش.
        - Bagaimana …? = عامل إيه؟ وBagaimana kalau …? = إيه رأيك لو …؟
        - permisi، maaf، Boleh …? — Silakan، Terima kasih — Sama-sama.
        يلا نراجع!
      ar: |
        ما تعلمناه في هذه الوحدة:
        - ber- للأنشطة: berlibur، berenang، bermain، bekerja، belajar.
        - ada / tidak ada = يوجد / لا يوجد.
        - Bagaimana …? = كيف …؟ وBagaimana kalau …? = ما رأيك لو …؟
        - permisi، maaf، Boleh …? — Silakan، Terima kasih — Sama-sama.
        هيا نراجع!
      en: |
        What this unit covered:
        - ber- for activities: berlibur, berenang, bermain, bekerja, belajar.
        - ada / tidak ada = there is / there isn't.
        - Bagaimana …? = How is …? and Bagaimana kalau …? = How about …?
        - permisi, maaf, Boleh …? — Silakan, Terima kasih — Sama-sama.
        Let's review!
    grammar: id.prefix.ber.basic
    examples:
      - text: Hari Minggu kami berlibur ke Ancol.
        ar_eg: يوم الحد رحنا أجازة في أنكول.
        ar: يوم الأحد قضينا عطلتنا في أنكول.
        en: On Sunday we went on holiday to Ancol.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: berlibur
        ar_eg: يقضي أجازة
        ar: يقضي عطلة
        en: go on holiday
      - text: berenang
        ar_eg: يعوم
        ar: يسبح
        en: swim
      - text: bermain
        ar_eg: يلعب
        ar: يلعب
        en: play
      - text: cuaca
        ar_eg: الجو
        ar: الطقس
        en: weather
      - text: pantai
        ar_eg: البحر / الشط
        ar: الشاطئ
        en: beach
    words: [berlibur, berenang, bermain, cuaca, pantai]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة مكتوبة صح؟
      ar: أيّ كلمة مكتوبة صحيحًا؟
      en: Which word is spelled correctly?
    options: [berajar, bekerja, berkerja]
    answer: 1
    explain:
      ar_eg: ber + kerja = bekerja، وber + ajar = belajar.
      ar: ber + kerja = bekerja، وber + ajar = belajar.
      en: ber + kerja = bekerja; ber + ajar = belajar.
    words: [bekerja, belajar]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تنادي على موظف غريب عشان تسأله. تبدأ بإيه؟
      ar: تريد أن تنادي موظفًا غريبًا لتسأله. بماذا تبدأ؟
      en: You want to get a stranger's attention to ask something. How do you start?
    options: ['Permisi, Pak.', 'Sama-sama, Pak.', 'Silakan, Pak.']
    answer: 0
    explain:
      ar_eg: permisi = لو سمحت / عن إذنك.
      ar: permisi = من فضلك / عن إذنك.
      en: permisi = excuse me.
    words: [permisi]
  - id: e04
    type: multiple_choice
    question: Ada toilet?
    question_meaning:
      ar_eg: مفيش تواليت. الرد الصح؟
      ar: لا يوجد حمّام. ما الجواب الصحيح؟
      en: There isn't one. What's the right answer?
    options: [Tidak boleh., Belum., Tidak ada.]
    answer: 2
    explain:
      ar_eg: سؤال ada بيترد عليه بـ ada أو tidak ada.
      ar: يُجاب عن سؤال ada بـ ada أو tidak ada.
      en: Answer an ada question with ada or tidak ada.
    words: [tidak ada]
  - id: e05
