  - id: e03
    type: listen
    text: Namanya tercatat dalam sejarah Indonesia.
    question:
      ar_eg: اسمه حصله إيه؟
      ar: ماذا حدث لاسمه؟
      en: What happened to his name?
    options: [اتكتب في التاريخ, اتنسى, اتغيّر]
    answer: 0
    meaning:
      ar_eg: اسمه اتكتب في تاريخ إندونيسيا.
      ar: خُلّد اسمه في تاريخ إندونيسيا.
      en: His name went down in Indonesian history.
    words: [tercatat]
  - id: e04
    type: fill_blank
    sentence: Adik saya suka ___ pemandangan dengan cat air.
    meaning:
      ar_eg: أختي الصغيرة بتحب ___ مناظر بالألوان المائية.
      ar: تحبّ أختي الصغيرة ___ المناظر بالألوان المائية.
      en: My little sister likes ___ landscapes in watercolour.
    options: [melukis, sastra, tercatat]
    answers: [melukis]
    words: [melukis, sastra, tercatat]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كتاب طويل فيه حكاية من خيال الكاتب. ده إيه؟
      ar: كتاب طويل فيه قصة من خيال الكاتب. ما هو؟
      en: A long book with a story from the writer's imagination. What is it?
    options: [demokrasi, novel, penemuan]
    answer: 1
    explain:
      ar_eg: novel = رواية.
      ar: novel = رواية.
      en: novel = novel.
    words: [demokrasi, novel, penemuan]
  - id: e06
    type: fill_blank
    sentence: Itu ___ yang bagus! Mari kita coba.
    meaning:
      ar_eg: دي ___ حلوة! يلا نجرّبها.
      ar: هذه ___ جيدة! لنجرّبها.
      en: That's a good ___! Let's try it.
    options: [gagasan, musisi, novel]
    answers: [gagasan]
    words: [gagasan, musisi, novel]
  - id: e07
    type: multiple_choice
    question: Telepon adalah ___ yang mengubah dunia.
    options: [sastra, demokrasi, penemuan]
    answer: 2
    explain:
      ar_eg: penemuan = اختراع.
      ar: penemuan = اختراع.
      en: penemuan = invention.
    words: [sastra, demokrasi, penemuan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا بحب أقرا الأدب الإندونيسي.
      ar: أحبّ قراءة الأدب الإندونيسي.
      en: I love reading Indonesian literature.
    answer: Saya suka membaca sastra Indonesia.
    distractors: [musisi, melukis]
    words: [sastra, musisi, melukis]
  - id: e09
    type: translate
    direction: from_target
    source_text: Novel itu berisi gagasan tentang demokrasi dan keadilan.
    answers_meaning:
      ar_eg: [الرواية دي فيها أفكار عن الديمقراطية والعدل, الرواية بتتكلم عن أفكار الديمقراطية والعدالة]
      ar: [تتضمّن تلك الرواية أفكارًا عن الديمقراطية والعدالة, في تلك الرواية أفكار عن الديمقراطية والعدل]
      en: [That novel contains ideas about democracy and justice, The novel is full of ideas on democracy and justice]
    words: [novel, gagasan, demokrasi]
  - id: e10
    type: speaking
    text: Penulis, pelukis, dan musisi itu tercatat dalam sejarah.
    meaning:
      ar_eg: الكاتب والرسام والموسيقي دول اتكتبوا في التاريخ.
      ar: خُلّد ذلك الكاتب والرسام والموسيقي في التاريخ.
      en: That writer, painter and musician went down in history.
    words: [musisi, tercatat, demokrasi, penemuan]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, saya mau beli novel Indonesia. Yang mana bagus?
      ar_eg: يا أستاذ، عايز أشتري رواية إندونيسية. إيه الحلو؟
      ar: يا أخي، أريد شراء رواية إندونيسية. أيّها جيّد؟
      en: Mas, I want to buy an Indonesian novel. Which one is good?
    - speaker: Mas Rizal
      text: Bumi Manusia karya Pramoedya. Itu sastra Indonesia yang terkenal di dunia.
      ar_eg: «أرض البشر» لبرامويديا. ده أدب إندونيسي مشهور في العالم.
      ar: «أرض البشر» لبرامويديا، وهي من الأدب الإندونيسي المشهور عالميًا.
      en: This Earth of Mankind by Pramoedya. It's Indonesian literature famous worldwide.
    - speaker: Mohamed
      text: Tentang apa novelnya?
      ar_eg: الرواية عن إيه؟
      ar: عمّ تتحدث الرواية؟
      en: What's the novel about?
    - speaker: Mas Rizal
      text: Tentang zaman Belanda dan gagasan kebebasan. Dia menulisnya waktu dipenjara di Pulau Buru.
      ar_eg: عن زمن الهولنديين وأفكار الحرية. كتبها وهو مسجون في جزيرة بورو.
      ar: عن زمن الهولنديين وأفكار الحرية. كتبها حين كان سجينًا في جزيرة بورو.
      en: About the Dutch era and ideas of freedom. He wrote it while imprisoned on Buru Island.
    - speaker: Mohamed
      text: Hebat. Namanya pantas tercatat dalam sejarah.
      ar_eg: حاجة عظيمة. اسمه يستاهل يتكتب في التاريخ.
      ar: مذهل. يستحق اسمه أن يُخلّد في التاريخ.
      en: Amazing. His name deserves to go down in history.
