schema: kabar.lesson/v1
id: bipa4.u10.l07
language: id
title: Penulis, pelukis, dan musisi
can_do:
  ar_eg: 'تتكلم عن فنانين وكتّاب إندونيسيين: روايات ولوحات وأغاني وأفكار.'
  ar: 'أن تتحدث عن فنانين وكتّاب إندونيسيين: روايات ولوحات وأغانٍ وأفكار.'
  en: 'Talk about Indonesian writers and artists: novels, paintings, songs and ideas.'
slides:
  - title: Tokoh seni dan sastra
    body:
      ar_eg: |
        sastra = أدب (sastra Indonesia)، novel = رواية، melukis = يرسم لوحة بالألوان.
        musisi = موسيقي، gagasan = فكرة (gagasan baru)، penemuan = اختراع أو اكتشاف.
        demokrasi = ديمقراطية، tercatat = متسجّل (namanya tercatat dalam sejarah = اسمه اتكتب في التاريخ).
      ar: |
        sastra = أدب (sastra Indonesia)، novel = رواية، melukis = يرسم لوحة.
        musisi = موسيقي، gagasan = فكرة (gagasan baru)، penemuan = اختراع أو اكتشاف.
        demokrasi = ديمقراطية، tercatat = مسجَّل (namanya tercatat dalam sejarah = خُلّد اسمه في التاريخ).
      en: |
        sastra = literature (sastra Indonesia), novel = novel, melukis = to paint.
        musisi = musician, gagasan = idea (gagasan baru), penemuan = invention, discovery.
        demokrasi = democracy, tercatat = recorded (namanya tercatat dalam sejarah = his name went down in history).
    examples:
      - text: Pramoedya Ananta Toer menulis novel Bumi Manusia.
        ar_eg: برامويديا أنانتا تور كتب رواية «أرض البشر».
        ar: كتب برامويديا أنانتا تور رواية «أرض البشر».
        en: Pramoedya Ananta Toer wrote the novel This Earth of Mankind.
      - text: Raden Saleh suka melukis binatang dan alam.
        ar_eg: رادين صالح كان بيحب يرسم الحيوانات والطبيعة.
        ar: كان رادين صالح يحبّ رسم الحيوانات والطبيعة.
        en: Raden Saleh loved painting animals and nature.
      - text: W.R. Supratman adalah musisi yang menciptakan lagu Indonesia Raya.
        ar_eg: و. ر. سوبراتمان موسيقي ألّف نشيد «إندونيسيا رايا».
        ar: و. ر. سوبراتمان موسيقيّ لحّن نشيد «إندونيسيا رايا».
        en: W.R. Supratman was the musician who composed Indonesia Raya.
