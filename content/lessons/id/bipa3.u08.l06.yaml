schema: kabar.lesson/v1
id: bipa3.u08.l06
language: id
title: Ulangan Unit 8
can_do:
  ar_eg: 'تشرح ظاهرة طبيعية: أسبابها ونتايجها وتعمل إيه وقتها.'
  ar: 'أن تشرح ظاهرة طبيعية: أسبابها ونتائجها وما تفعله حين تقع.'
  en: Explain a natural event, its causes, its effects and what to do.
slides:
  - title: Kata penghubung Unit 8
    body:
      ar_eg: |
        كل أدوات الوحدة في مكان واحد:
        هدف: supaya / agar · نتيجة: sehingga · شرط: kalau / jika · خيال: seandainya
        مزدوجة: tidak hanya … tetapi juga · bukan … melainkan · baik … maupun
        ترتيب: pertama · kemudian · setelah itu · selanjutnya · akhirnya
      ar: |
        أدوات الوحدة كلها:
        الغاية: supaya / agar · النتيجة: sehingga · الشرط: kalau / jika · الافتراض: seandainya
        المزدوجة: tidak hanya … tetapi juga · bukan … melainkan · baik … maupun
        الترتيب: pertama · kemudian · setelah itu · selanjutnya · akhirnya
      en: |
        All the unit's linking words:
        purpose: 'supaya / agar · result: sehingga · condition: kalau / jika · imagined: seandainya'
        pairs: tidak hanya … tetapi juga · bukan … melainkan · baik … maupun
        order: pertama · kemudian · setelah itu · selanjutnya · akhirnya
    grammar: id.conjunction.purpose-condition
    examples:
      - text: Kalau terjadi gempa, jangan panik supaya kamu bisa berpikir.
        ar_eg: لو حصل زلزال، ما تتخضّش عشان تعرف تفكر.
        ar: إذا وقع زلزال فلا تفزع لكي تستطيع التفكير.
        en: If there's an earthquake, don't panic so that you can think.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gempa
        ar_eg: زلزال
        ar: زلزال
        en: earthquake
      - text: gunung berapi
        ar_eg: بركان
        ar: بركان
        en: volcano
      - text: meletus
        ar_eg: يثور
        ar: يثور
        en: to erupt
      - text: banjir
        ar_eg: فيضان
        ar: فيضان
        en: flood
      - text: jembatan
        ar_eg: كوبري
        ar: جسر
        en: bridge
      - text: bencana
        ar_eg: كارثة
        ar: كارثة
        en: disaster
    words: [gempa, gunung berapi, meletus, banjir, jembatan, bencana]
  - id: e02
    type: multiple_choice
    question: Warga belajar tentang gempa ___ tidak panik.
    options: [sehingga, supaya, maupun]
    answer: 1
    explain:
      ar_eg: إنهم ما يتخضّوش ده هدف، فـ supaya.
      ar: عدم الفزع غاية مقصودة، فالأداة supaya.
      en: Not panicking is the goal, so supaya.
    words: [panik]
  - id: e03
    type: multiple_choice
    question: Baik turis ___ warga ikut membantu.
    options: [melainkan, dan, maupun]
    answer: 2
    words: [maupun]
  - id: e04
    type: listen
    text: Gempa itu tidak hanya merusak rumah, tetapi juga sekolah.
    options:
      - Gempa itu tidak hanya merusak rumah, tetapi juga jembatan.
      - Gempa itu tidak hanya merusak rumah, tetapi juga sekolah.
      - Banjir itu tidak hanya merusak rumah, tetapi juga sekolah.
    answer: 1
    meaning:
      ar_eg: الزلزال ده مش بس بوّظ البيوت، لأ والمدارس كمان.
      ar: لم يدمّر الزلزال البيوت فحسب، بل المدارس أيضًا.
      en: The earthquake damaged not only houses but also schools.
    words: [merusak]
  - id: e05
    type: multiple_choice
    question: Itu bukan asap, ___ awan.
    options: [tetapi juga, sehingga, melainkan]
    answer: 2
    words: [asap, awan]
  - id: e06
    type: fill_blank
    sentence: ___ terjadi gempa, segera keluar dari rumah.
    meaning:
      ar_eg: لو حصل زلزال، اطلع من البيت فورًا.
      ar: إذا وقع زلزال فاخرج من البيت فورًا.
      en: If there's an earthquake, get out of the house immediately.
    options: [Supaya, Kalau, Sehingga]
    answers: [Kalau]
    words: [terjadi]
  - id: e07
    type: fill_blank
    sentence: Pertama, berlindung di bawah meja. ___, jauhi jendela.
    meaning:
      ar_eg: (اكتب «بعدين») الأول، استخبى تحت الترابيزة. بعدين، ابعد عن الشباك.
      ar: (اكتب «ثم») أولًا، احتمِ تحت الطاولة. ثم ابتعد عن النافذة.
      en: (Write "then".) First, take shelter under a table. Then keep away from the window.
    answers: [Kemudian, Lalu, Setelah itu, Selanjutnya, kemudian, lalu]
    words: [berlindung, menjauhi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: النهر فاض فالكوبري باظ.
      ar: فاض النهر فتضرّر الجسر.
      en: The river overflowed, so the bridge was damaged.
    answer: Sungai meluap sehingga jembatan rusak.
    distractors: [supaya, melainkan]
    words: [meluap, jembatan]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لو البركان ثار، الأهالي لازم يخلوا المكان.
      ar: إذا ثار البركان وجب على السكان الإخلاء.
      en: If the volcano erupts, residents must evacuate.
    answers:
      - Jika gunung berapi meletus, warga harus mengungsi.
      - Jika gunung berapi meletus, warga harus mengungsi
      - Kalau gunung berapi meletus, warga harus mengungsi.
      - Kalau gunung berapi meletus, warga harus mengungsi
      - Apabila gunung berapi meletus, warga harus mengungsi.
      - Jika gunung berapi meletus, maka warga harus mengungsi.
      - Jika gunung itu meletus, warga harus mengungsi.
      - Kalau gunung itu meletus, warga harus mengungsi.
      - Jika gunung meletus, warga harus mengungsi.
      - Kalau gunung meletus, warga harus mengungsi.
    words: [gunung berapi, meletus, warga, mengungsi]
  - id: e10
    type: dictation
    text: Seandainya saya tinggal di Tetebatu, saya akan melihat Rinjani setiap pagi.
    meaning:
      ar_eg: لو كنت ساكن في تيتيباتو، كنت هشوف رينجاني كل يوم الصبح.
      ar: لو كنتُ أسكن في تيتيباتو لرأيتُ رينجاني كل صباح.
      en: If I lived in Tetebatu, I'd see Rinjani every morning.
    words: [seandainya]
  - id: e11
    type: speaking
    text: Bawa tas siaga bencana supaya kamu siap.
    meaning:
      ar_eg: خد شنطة الطوارئ عشان تبقى مستعد.
      ar: خذ حقيبة الطوارئ لكي تكون مستعدًّا.
      en: Bring the emergency bag so you're ready.
    words: [tas siaga, bencana]
dialogue:
  title: Danau di atas gunung
  lines:
    - speaker: Mohamed
      text: Mas, apa itu Segara Anak?
      ar_eg: يا ماس، يعني إيه سيجارا أناك؟
      ar: يا ماس، ما سيغارا أناك؟
      en: Mas, what is Segara Anak?
    - speaker: Mas Rizal
      text: Danau di atas Gunung Rinjani. Bukan hanya indah, tetapi juga sangat penting bagi orang Sasak.
      ar_eg: بحيرة فوق جبل رينجاني. مش بس حلوة، دي كمان مهمة جدًا عند السّاساك.
      ar: بحيرة فوق جبل رينجاني، ليست جميلة فحسب، بل مهمة جدًا لشعب الساساك أيضًا.
      en: A lake up on Mount Rinjani. It's not only beautiful but also very important to the Sasak people.
    - speaker: Mohamed
      text: Apakah Rinjani masih gunung berapi?
      ar_eg: هو رينجاني لسه بركان؟
      ar: هل ما زال رينجاني بركانًا؟
      en: Is Rinjani still a volcano?
    - speaker: Mas Rizal
      text: Ya. Gunung kecil di tengah danau itu kadang-kadang meletus.
      ar_eg: أيوه. الجبل الصغير اللي في نص البحيرة بيثور ساعات.
      ar: نعم. الجبل الصغير في وسط البحيرة يثور أحيانًا.
      en: Yes. The little mountain in the middle of the lake erupts now and then.
    - speaker: Mohamed
      text: Kalau begitu, baik turis maupun warga harus selalu mendengar petugas.
      ar_eg: يبقى السياح والأهالي، الكل لازم يسمع كلام الموظفين المسؤولين دايمًا.
      ar: إذن على السياح والسكان معًا أن يستمعوا دائمًا إلى المسؤولين.
      en: In that case, both tourists and residents should always listen to the officials.
souvenir:
  id: bipa3.u08.souvenir
  title: Danau Segara Anak
  note:
    ar_eg: سيجارا أناك بحيرة زرقا جوه فوهة رينجاني، وفي نصها بركان صغير لسه صاحي اسمه باروجاري. إندونيسيا قاعدة على «حلقة النار»، وزلازل لومبوك سنة 2018 علّمت الناس يبنوا بيوت أقوى تستحمل الزلازل. الأرض هنا بتتحرك، بس الناس اتعلمت تعيش معاها بهدوء وشجاعة.
    ar: سيغارا أناك بحيرة زرقاء داخل فوهة رينجاني، يتوسطها بركان صغير ما زال نشطًا اسمه باروجاري. تقع إندونيسيا على «حزام النار»، وقد علّمت زلازلُ لومبوك عام 2018 الناسَ بناءَ بيوت أمتن تصمد أمام الهزات. الأرض هنا تتحرك، لكن أهلها تعلّموا العيش معها بهدوء وشجاعة.
    en: Segara Anak is a blue lake inside Rinjani's caldera, with a small, still-active volcano, Barujari, rising from it. Indonesia sits on the Ring of Fire, and the 2018 Lombok earthquakes taught communities to build stronger, quake-resistant homes. The ground here moves, but people have learned to live with it calmly and bravely.
