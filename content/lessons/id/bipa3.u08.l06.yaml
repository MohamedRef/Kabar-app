schema: kabar.lesson/v1
id: bipa3.u08.l06
language: id
title: Selalu waspada
can_do:
  ar_eg: 'تفهم وتدّي تعليمات الأمان: خلّي بالك، التحذير، الخطوات، ونتايج الكارثة.'
  ar: 'أن تفهم تعليمات السلامة وتعطيها: الحذر والإنذار والخطوات وعواقب الكارثة.'
  en: 'Understand and give safety advice: stay alert, warnings, steps and the aftermath of a disaster.'
slides:
  - title: Setelah bencana
    body:
      ar_eg: |
        waspada = خلّي بالك، صاحي (حذر). menghindari = يبعد عن، يتجنّب (من hindar).
        langkah = خطوة: langkah pertama = أول خطوة. memastikan = يتأكد (وأمر: pastikan! = اتأكد!).
        terluka = اتعوّر، اتصاب. kerusakan = خراب، تلف. menghancurkan = يدمّر.
        akibat = نتيجة (وحشة) (من العربي «عاقبة»): akibat gempa = بسبب الزلزال.
      ar: |
        waspada = يقظ، حذر. menghindari = يتجنّب (من hindar).
        langkah = خطوة: langkah pertama = الخطوة الأولى. memastikan = يتأكّد (والأمر: pastikan!).
        terluka = أُصيب، جُرح. kerusakan = ضرر، تلف. menghancurkan = يدمّر.
        akibat = عاقبة، نتيجة (من العربية «عاقبة»): akibat gempa = بسبب الزلزال.
      en: |
        waspada = alert, on guard. menghindari = avoid (from hindar).
        langkah = step: langkah pertama = the first step. memastikan = make sure (command: pastikan!).
        terluka = injured, hurt. kerusakan = damage. menghancurkan = destroy.
        akibat = consequence, result (from Arabic ʿāqiba): akibat gempa = as a result of the quake.
    examples:
      - text: Selalu waspada! Ada peringatan banjir.
        ar_eg: خلّي بالك! فيه تحذير من فيضان.
        ar: ابقَ يقظًا! هناك إنذار فيضان.
        en: Stay alert! There's a flood warning.
      - text: Pastikan semua orang sudah keluar.
        ar_eg: اتأكد إن كل الناس خرجوا.
        ar: تأكّد من خروج الجميع.
        en: Make sure everyone has got out.
      - text: Akibat gempa, banyak jembatan rusak.
        ar_eg: بسبب الزلزال، كباري كتير باظت.
        ar: بسبب الزلزال تضرّرت جسور كثيرة.
        en: Because of the earthquake, many bridges were damaged.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: waspada
        ar_eg: خلّي بالك
        ar: حذر، يقظ
        en: alert
      - text: menghindari
        ar_eg: يبعد عن
        ar: يتجنّب
        en: avoid
      - text: langkah
        ar_eg: خطوة
        ar: خطوة
        en: step
      - text: memastikan / pastikan
        ar_eg: يتأكد
        ar: يتأكّد
        en: make sure
    words: [waspada, menghindari, langkah, memastikan / pastikan]
  - id: e02
    type: match_pairs
    pairs:
      - text: terluka
        ar_eg: اتعوّر
        ar: أُصيب
        en: injured
      - text: kerusakan
        ar_eg: خراب، تلف
        ar: ضرر
        en: damage
      - text: menghancurkan
        ar_eg: يدمّر
        ar: يدمّر
        en: destroy
      - text: akibat
        ar_eg: نتيجة، عاقبة
        ar: عاقبة
        en: consequence
    words: [terluka, kerusakan, menghancurkan, akibat]
  - id: e03
    type: listen
    text: Kami menghindari jalan dekat sungai karena banjir.
    question:
      ar_eg: بيبعدوا عن إيه؟
      ar: ماذا يتجنّبون؟
      en: What are they avoiding?
    options: [السوق, الطريق اللي جنب النهر, البحر]
    answer: 1
    meaning:
      ar_eg: بنبعد عن الطريق اللي جنب النهر عشان الفيضان.
      ar: نتجنّب الطريق القريب من النهر بسبب الفيضان.
      en: We're avoiding the road by the river because of the flood.
    words: [menghindari]
  - id: e04
    type: fill_blank
    sentence: Dua orang ___ dan dibawa ke rumah sakit.
    meaning:
      ar_eg: اتنين ___ واتنقلوا المستشفى.
      ar: ___ شخصان ونُقلا إلى المستشفى.
      en: Two people were ___ and taken to hospital.
    options: [terluka, langkah, waspada]
    answers: [terluka]
    words: [terluka, langkah, waspada]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: كلمة جاية من العربي «عاقبة»، معناها نتيجة؟
      ar: أي كلمة مأخوذة من العربية «عاقبة» وتعني نتيجة؟
      en: Which word comes from Arabic ʿāqiba and means consequence?
    options: [kerusakan, akibat, menghindari]
    answer: 1
    explain:
      ar_eg: akibat ← عاقبة.
      ar: akibat ← عاقبة.
      en: akibat ← Arabic ʿāqiba.
    words: [akibat, kerusakan, menghindari]
  - id: e06
    type: fill_blank
    sentence: Air banjir ___ rumah-rumah di pinggir sungai.
    meaning:
      ar_eg: مية الفيضان ___ البيوت اللي على حافة النهر.
      ar: ___ مياه الفيضان البيوت على ضفة النهر.
      en: The floodwater ___ the houses by the river.
    options: [menghancurkan, memastikan, waspada]
    answers: [menghancurkan]
    words: [menghancurkan, memastikan / pastikan, waspada]
  - id: e07
    type: build_sentence
    source:
      ar_eg: 'أول خطوة: اطفي الغاز.'
      ar: 'الخطوة الأولى: أطفئ الغاز.'
      en: 'The first step: turn off the gas.'
    answer: Langkah pertama, matikan gas.
    distractors: [akibat, terluka]
    words: [langkah]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kerusakan akibat banjir itu sangat besar.
    answers_meaning:
      ar_eg: [الخراب اللي عمله الفيضان ده كبير جدًا, التلف بسبب الفيضان كبير أوي]
      ar: [الأضرار الناتجة عن ذلك الفيضان كبيرة جدًا]
      en: [The damage from that flood is huge, The flood caused enormous damage]
    words: [kerusakan, akibat]
  - id: e09
    type: speaking
    text: Pastikan semua orang waspada.
    meaning:
      ar_eg: اتأكد إن كل الناس واخدين بالهم.
      ar: تأكّد أن الجميع متيقّظون.
      en: Make sure everyone stays alert.
    words: [memastikan / pastikan, waspada]
  - id: e10
    type: multiple_choice
    question: Badai menghancurkan banyak rumah. Petugas ___ jembatan itu masih kuat.
    options: [memastikan, terluka, kerusakan]
    answer: 0
    explain:
      ar_eg: memastikan = يتأكد.
      ar: memastikan = يتأكّد.
      en: memastikan = make sure.
    words: [memastikan / pastikan, terluka, kerusakan, menghancurkan]
dialogue:
  lines:
    - speaker: Petugas
      text: Bapak-bapak, ibu-ibu, ada peringatan gempa susulan. Selalu waspada!
      ar_eg: يا جماعة، فيه تحذير من هزّات تانية. خلّوا بالكم!
      ar: أيها السادة والسيدات، هناك إنذار بهزّات ارتدادية. ابقوا متيقّظين!
      en: Ladies and gentlemen, there's an aftershock warning. Stay alert!
    - speaker: Mohamed
      text: Pak, apa langkah pertama?
      ar_eg: يا أستاذ، أول خطوة إيه؟
      ar: يا سيدي، ما الخطوة الأولى؟
      en: Sir, what's the first step?
    - speaker: Petugas
      text: Keluar dari rumah dan pastikan gas sudah mati.
      ar_eg: اخرجوا من البيت واتأكدوا إن الغاز مقفول.
      ar: اخرجوا من البيت وتأكّدوا من إغلاق الغاز.
      en: Get out of the house and make sure the gas is off.
    - speaker: Mohamed
      text: Apakah ada yang terluka?
      ar_eg: فيه حد اتصاب؟
      ar: هل أُصيب أحد؟
      en: Is anyone hurt?
    - speaker: Petugas
      text: Ada dua orang. Kerusakan akibat gempa ini cukup besar.
      ar_eg: فيه اتنين. والخراب اللي عمله الزلزال ده كبير.
      ar: شخصان. والأضرار الناتجة عن هذا الزلزال كبيرة.
      en: Two people. The damage from this quake is quite serious.
