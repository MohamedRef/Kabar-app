schema: kabar.lesson/v1
id: bipa7.u05.l02
language: id
title: Mesir dan Indonesia 1946
can_do:
  ar_eg: تقرا حكاية تاريخية متماسكة عن اعتراف مصر بإندونيسيا.
  ar: أن تقرأ رواية تاريخية متماسكة عن اعتراف مصر بإندونيسيا.
  en: Read a cohesive historical account of Egypt's recognition of Indonesia.
slides:
  - title: Sahabat pertama
    body:
      ar_eg: |
        اقرا (ملخّص للدرس من الروايات التاريخية المعروفة):
        Setelah proklamasi 17 Agustus 1945, Indonesia membutuhkan pengakuan dari negara lain. Banyak sumber Indonesia mencatat bahwa Mesir mengakui kemerdekaan Indonesia secara de facto pada Maret 1946. Pada tahun berikutnya, Liga Arab mengirim utusan, Mohammad Abdul Mun'im, ke Yogyakarta. Ia bertemu Presiden Sukarno. Kemudian, sebuah delegasi yang dipimpin Haji Agus Salim pergi ke Kairo. Di sana, pada Juni 1947, kedua negara menandatangani perjanjian persahabatan.
        - pengakuan = اعتراف، mengakui = يعترف بـ، Liga Arab = جامعة الدول العربية
        - utusan = مبعوث، delegasi = وفد
        - في الكلام: nggak = tidak، tapi = tetapi.
      ar: |
        اقرأ (ملخّص للدرس من الروايات التاريخية المشهورة):
        Setelah proklamasi 17 Agustus 1945, Indonesia membutuhkan pengakuan dari negara lain. Banyak sumber Indonesia mencatat bahwa Mesir mengakui kemerdekaan Indonesia secara de facto pada Maret 1946. Pada tahun berikutnya, Liga Arab mengirim utusan, Mohammad Abdul Mun'im, ke Yogyakarta. Ia bertemu Presiden Sukarno. Kemudian, sebuah delegasi yang dipimpin Haji Agus Salim pergi ke Kairo. Di sana, pada Juni 1947, kedua negara menandatangani perjanjian persahabatan.
        - pengakuan = اعتراف، mengakui = يعترف بـ، Liga Arab = جامعة الدول العربية
        - utusan = مبعوث، delegasi = وفد
        - في الكلام اليومي: nggak = tidak، tapi = tetapi.
      en: |
        Read (a summary for the lesson of the well-known historical accounts):
        Setelah proklamasi 17 Agustus 1945, Indonesia membutuhkan pengakuan dari negara lain. Banyak sumber Indonesia mencatat bahwa Mesir mengakui kemerdekaan Indonesia secara de facto pada Maret 1946. Pada tahun berikutnya, Liga Arab mengirim utusan, Mohammad Abdul Mun'im, ke Yogyakarta. Ia bertemu Presiden Sukarno. Kemudian, sebuah delegasi yang dipimpin Haji Agus Salim pergi ke Kairo. Di sana, pada Juni 1947, kedua negara menandatangani perjanjian persahabatan.
        - pengakuan = recognition, mengakui = to recognise, Liga Arab = the Arab League
        - utusan = envoy, delegasi = delegation
        - In speech: nggak = tidak, tapi = tetapi.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pengakuan
        ar_eg: اعتراف
        ar: اعتراف
        en: recognition
      - text: mengakui
        ar_eg: يعترف بـ
        ar: يعترف بـ
        en: to recognise, to acknowledge
      - text: Liga Arab
        ar_eg: جامعة الدول العربية
        ar: جامعة الدول العربية
        en: the Arab League
      - text: utusan
        ar_eg: مبعوث
        ar: مبعوث
        en: envoy
      - text: delegasi
        ar_eg: وفد
        ar: وفد
        en: delegation
    words: [pengakuan, mengakui, Liga Arab, utusan, delegasi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي قاد الوفد الإندونيسي للقاهرة؟
      ar: من قاد الوفد الإندونيسي إلى القاهرة؟
      en: Who led the Indonesian delegation to Cairo?
    options:
      - Sukarno.
      - Haji Agus Salim.
      - Mohammad Abdul Mun'im.
    answer: 1
    words: [delegasi]
    explain:
      ar_eg: الوفد الإندونيسي للقاهرة كان برئاسة الحاج أجوس سالم. سوكارنو كان في يوجياكارتا، وعبد المنعم هو المبعوث المصري.
      ar: ترأّس الحاجّ أغوس سالم الوفد الإندونيسيّ إلى القاهرة، وكان سوكارنو في يوغياكرتا، وعبد المنعم هو المبعوث المصريّ.
      en: Haji Agus Salim led the delegation; Sukarno stayed in Yogyakarta and Abdul Mun'im was the Egyptian envoy.
  - id: e03
    type: fill_blank
    sentence: Indonesia membutuhkan ___ dari negara lain setelah proklamasi.
    meaning:
      ar_eg: إندونيسيا كانت محتاجة اعتراف من الدول التانية بعد إعلان الاستقلال.
      ar: احتاجت إندونيسيا إلى اعتراف الدول الأخرى بعد إعلان الاستقلال.
      en: Indonesia needed recognition from other countries after the proclamation.
    options: [pengakuan, utusan, delegasi]
    answers: [pengakuan]
    words: [pengakuan]
    explain:
      ar_eg: pengakuan = اعتراف (من mengakui). utusan = مبعوث وdelegasi = وفد، ودول ناس مش حاجة الدولة محتاجاها من غيرها.
      ar: pengakuan = اعتراف (من mengakui). utusan = مبعوث وdelegasi = وفد، وهما أشخاص لا اعتراف.
      en: pengakuan (recognition) comes from mengakui. utusan and delegasi are people, not recognition.
  - id: e04
    type: listen
    text: Pada tahun 1947, Indonesia masih berjuang melawan Belanda. Utusan Liga Arab itu bertemu Presiden Sukarno di Yogyakarta, karena Jakarta saat itu dikuasai Belanda. Ia membawa kabar pengakuan dari Mesir.
    question:
      ar_eg: مبعوث الجامعة العربية قابل مين وفين؟
      ar: من قابل مبعوث الجامعة العربية وأين؟
      en: Whom did the Arab League envoy meet, and where?
    options:
      - Dia bertemu Sukarno di Yogyakarta dan membawa kabar pengakuan.
      - Dia bertemu Agus Salim di Kairo.
      - Dia bertemu Raja Mesir di Aleksandria.
    answer: 0
    words: [utusan, Liga Arab]
    explain:
      ar_eg: المبعوث قابل سوكارنو في يوجياكارتا عشان (karena) جاكرتا كانت تحت الهولنديين، وجاب خبر الاعتراف (pengakuan). القاهرة والإسكندرية مااتقالوش.
      ar: التقى المبعوث سوكارنو في يوغياكرتا لأنّ جاكرتا كانت بيد الهولنديّين، وحمل نبأ الاعتراف، ولم تُذكر القاهرة ولا الإسكندريّة.
      en: He met Sukarno in Yogyakarta because the Dutch held Jakarta, bringing news of recognition.
  - id: e05
    type: build_sentence
    source:
      ar_eg: مصر اعترفت باستقلال إندونيسيا.
      ar: اعترفت مصر باستقلال إندونيسيا.
      en: Egypt recognised Indonesia's independence.
    answer: Mesir mengakui kemerdekaan Indonesia.
    distractors: [delegasi, utusan]
    words: [mengakui]
    explain:
      ar_eg: Mesir (فاعل) + mengakui (اعترفت) + kemerdekaan Indonesia. delegasi وutusan زيادة.
      ar: Mesir + mengakui + kemerdekaan Indonesia. delegasi وutusan زائدتان.
      en: Mesir + mengakui + kemerdekaan Indonesia. delegasi and utusan are extra.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: في النص، «Ia bertemu Presiden Sukarno»، كلمة Ia راجعة على مين؟
      ar: في النصّ، على من يعود الضمير Ia في «Ia bertemu Presiden Sukarno»؟
      en: In the text, who does "Ia" refer to in "Ia bertemu Presiden Sukarno"?
    options:
      - Agus Salim.
      - Sukarno.
      - Mohammad Abdul Mun'im, sang utusan.
    answer: 2
    words: [utusan]
    explain:
      ar_eg: Ia بترجع على المبعوث محمد عبد المنعم، لأنه الفاعل اللي قبلها. سوكارنو هو اللي اتقابل، مش اللي قابل.
      ar: Ia تعود على المبعوث محمد عبد المنعم لأنّه الفاعل السابق، أمّا سوكارنو فهو من التُقي به.
      en: Ia refers back to the envoy Abdul Mun'im, the previous subject; Sukarno is the one he met.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الوفد ده سافر القاهرة سنة 1947.
      ar: سافر ذلك الوفد إلى القاهرة عام 1947.
      en: That delegation travelled to Cairo in 1947.
    answers:
      - Delegasi itu pergi ke Kairo pada tahun 1947.
      - Delegasi tersebut pergi ke Kairo pada tahun 1947.
      - Delegasi itu berangkat ke Kairo pada tahun 1947.
      - Pada tahun 1947, delegasi itu pergi ke Kairo.
    words: [delegasi]
  - id: e08
    type: speaking
    text: Pengakuan dari Mesir sangat penting bagi bangsa Indonesia.
    meaning:
      ar_eg: اعتراف مصر كان ليه معنى كبير للشعب الإندونيسي.
      ar: كان لاعتراف مصر معنى كبير لدى الشعب الإندونيسي.
      en: Egypt's recognition meant a great deal to the Indonesian people.
    words: [pengakuan]
  - id: e09
    type: dictation
    text: Liga Arab mendorong anggotanya untuk mengakui Indonesia.
    meaning:
      ar_eg: الجامعة العربية شجّعت أعضاءها يعترفوا بإندونيسيا.
      ar: حثّت الجامعة العربية أعضاءها على الاعتراف بإندونيسيا.
      en: The Arab League urged its members to recognise Indonesia.
    words: [Liga Arab, mengakui]
  - id: e10
    type: translate
    direction: from_target
    source_text: Utusan dan delegasi itu membuka hubungan diplomatik kedua negara, sehingga Mesir menjadi negara pertama yang mengakui Indonesia.
    answers_meaning:
      ar_eg:
        - المبعوث والوفد فتحوا العلاقات الدبلوماسية بين البلدين، فمصر بقت أول دولة تعترف بإندونيسيا.
        - المبعوث والوفد بدأوا علاقات دبلوماسية بين الدولتين، وعشان كده مصر كانت أول بلد يعترف بإندونيسيا.
      ar:
        - فتح المبعوث والوفد العلاقات الدبلوماسيّة بين البلدين، فصارت مصر أوّل دولة تعترف بإندونيسيا.
        - أقام المبعوث والوفد علاقات دبلوماسيّة بين الدولتين، حتى غدت مصر أوّل بلد يعترف بإندونيسيا.
      en:
        - The envoy and the delegation opened diplomatic ties between the two countries, so Egypt became the first country to recognise Indonesia.
        - The envoy and delegation began diplomatic relations, making Egypt the first state to recognise Indonesia.
    words: [utusan, delegasi]
    explain:
      ar_eg: 'sehingga = فـ (النتيجة): العلاقات خلّت مصر أول دولة تعترف (mengakui).'
      ar: 'sehingga = فـ (النتيجة): صارت مصر أوّل دولة تعترف.'
      en: 'sehingga gives the result: Egypt became the first to recognise Indonesia.'
dialogue:
  title: Cerita Pak Hasan
  lines:
    - speaker: Pak Hasan
      text: Kamu tahu nggak? Orang Indonesia nggak lupa kalau Mesir termasuk yang pertama mengakui kita.
      ar_eg: تعرف؟ الإندونيسيين مش ناسيين إن مصر كانت من أوائل اللي اعترفوا بينا.
      ar: أتعلم؟ لا ينسى الإندونيسيون أنّ مصر كانت من أوائل من اعترف بهم.
      en: You know what? Indonesians haven't forgotten that Egypt was among the first to recognise us.
    - speaker: Mohamed
      text: Saya pernah membaca tentang Haji Agus Salim di Kairo.
      ar_eg: أنا قريت قبل كده عن الحاج أجوس سالم في القاهرة.
      ar: قرأتُ من قبل عن الحاج أجوس سالم في القاهرة.
      en: I once read about Haji Agus Salim in Cairo.
    - speaker: Pak Hasan
      text: Beliau memimpin delegasi kecil, tapi hasilnya besar. Sebuah perjanjian persahabatan.
      ar_eg: هو قاد وفد صغير، بس النتيجة كانت كبيرة. معاهدة صداقة.
      ar: قاد وفدًا صغيرًا، لكنّ ثمرته كانت كبيرة، معاهدة صداقة.
      en: He led a small delegation, but the result was big. A friendship treaty.
    - speaker: Mohamed
      text: Dan sekarang ribuan mahasiswa Indonesia belajar di Al-Azhar. Persahabatan itu masih hidup.
      ar_eg: ودلوقتي آلاف الطلبة الإندونيسيين بيدرسوا في الأزهر. الصداقة دي لسه عايشة.
      ar: واليوم يدرس آلاف الطلّاب الإندونيسيين في الأزهر، فتلك الصداقة ما زالت حيّة.
      en: And now thousands of Indonesian students study at Al-Azhar. That friendship is still alive.
