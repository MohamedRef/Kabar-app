schema: kabar.lesson/v1
id: bipa5.u03.l05
language: id
title: Kecerdasan buatan
can_do:
  ar_eg: تتكلم عن الذكاء الاصطناعي والأتمتة وأثرهم على الشغل.
  ar: أن تتحدّث عن الذكاء الاصطناعي والأتمتة وأثرهما في سوق العمل.
  en: Talk about AI and automation and what they mean for jobs.
slides:
  - title: Mesin dan pekerjaan
    body:
      ar_eg: |
        كلام المقالات عن الـ AI:
        - kecerdasan buatan (AI) = الذكاء الاصطناعي: kecerdasan = ذكاء، buatan = مصنوع
        - otomatisasi = الأتمتة، إن مكنة تعمل الشغل لوحدها
        - menggantikan = يحل محل: Apakah mesin akan menggantikan manusia?
        - tenaga kerja = العمالة، القوى العاملة
        - keterampilan = مهارة (عملية)، وkeahlian = خبرة وتخصص
        لاحظ إن المقالات بتحب الأسماء: penggunaan AI، perubahan pekerjaan.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: nerjemahin = menerjemahkan، aku = saya، bakal = akan، nggak = tidak، gantiin = menggantikan، ngecek = memeriksa.
      ar: |
        مفردات المقالات عن الذكاء الاصطناعي:
        - kecerdasan buatan (AI) = الذكاء الاصطناعي: kecerdasan = ذكاء، وbuatan = مصنوع
        - otomatisasi = الأتمتة، أي أن تؤدّي الآلة العمل وحدها
        - menggantikan = يحلّ محلّ: Apakah mesin akan menggantikan manusia?
        - tenaga kerja = اليد العاملة، القوى العاملة
        - keterampilan = مهارة عملية، أمّا keahlian فخبرة وتخصّص
        ولاحظ ميل المقالات إلى الأسماء: penggunaan AI وperubahan pekerjaan.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: nerjemahin = menerjemahkan، aku = saya، bakal = akan، nggak = tidak، gantiin = menggantikan، ngecek = memeriksa.
      en: |
        The vocabulary of AI articles:
        - kecerdasan buatan (AI) = artificial intelligence: kecerdasan = intelligence, buatan = made
        - otomatisasi = automation, a machine doing the work itself
        - menggantikan = to replace: Apakah mesin akan menggantikan manusia?
        - tenaga kerja = workforce, labour
        - keterampilan = (practical) skill; keahlian = expertise
        Articles love nouns: penggunaan AI, perubahan pekerjaan.
        The dialogue uses street forms; the formal ones are beside them: nerjemahin = menerjemahkan, aku = saya, bakal = akan, nggak = tidak, gantiin = menggantikan, ngecek = memeriksa.
    examples:
      - text: Otomatisasi mengubah kebutuhan tenaga kerja di pabrik.
        ar_eg: الأتمتة بتغيّر احتياج المصانع للعمالة.
        ar: تغيّر الأتمتة حاجة المصانع إلى اليد العاملة.
        en: Automation is changing factories' need for labour.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kecerdasan buatan
        ar_eg: الذكاء الاصطناعي
        ar: الذكاء الاصطناعي
        en: artificial intelligence
      - text: otomatisasi
        ar_eg: أتمتة
        ar: أتمتة
        en: automation
      - text: menggantikan
        ar_eg: يحل محل
        ar: يحلّ محلّ
        en: to replace
      - text: keterampilan
        ar_eg: مهارة
        ar: مهارة
        en: skill
      - text: tenaga kerja
        ar_eg: عمالة
        ar: يد عاملة
        en: workforce
    words: [kecerdasan buatan, otomatisasi, menggantikan, keterampilan, tenaga kerja]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «kecerdasan buatan» معناها إيه؟
      ar: ما معنى «kecerdasan buatan»؟
      en: What does "kecerdasan buatan" mean?
    options:
      - شغل يدوي.
      - الذكاء الاصطناعي.
      - ذكاء الطلبة.
    answer: 1
    words: [kecerdasan buatan]
  - id: e03
    type: listen
    text: Otomatisasi di pelabuhan mengurangi jumlah tenaga kerja.
    question:
      ar_eg: الأتمتة عملت إيه في الميناء؟
      ar: ماذا فعلت الأتمتة في الميناء؟
      en: What did automation do at the port?
    options:
      - قفلت الميناء.
      - زودت عدد العمال.
      - قللت عدد العمال.
    answer: 2
    words: [otomatisasi, tenaga kerja]
  - id: e04
    type: fill_blank
    sentence: Mesin tidak bisa ___ guru yang baik.
    meaning:
      ar_eg: المكنة متقدرش تاخد مكان المدرس الكويس.
      ar: لا تستطيع الآلة أن تحلّ محلّ المعلّم الجيّد.
      en: A machine can't replace a good teacher.
    options: [menggantikan, keterampilan, otomatisasi]
    answers: [menggantikan]
    words: [menggantikan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: لازم نتعلم مهارات جديدة.
      ar: علينا أن نتعلّم مهارات جديدة.
      en: We have to learn new skills.
    answer: Kita harus belajar keterampilan baru.
    distractors: [menggantikan, mesin]
    words: [keterampilan]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الذكاء الاصطناعي بيساعد المترجمين، بس مش بياخد مكانهم.
      ar: يساعد الذكاء الاصطناعي المترجمين، لكنه لا يحلّ محلّهم.
      en: AI helps translators, but it doesn't replace them.
    answers:
      - Kecerdasan buatan membantu penerjemah, tetapi tidak menggantikan mereka.
      - Kecerdasan buatan membantu para penerjemah, tetapi tidak menggantikan mereka.
      - Kecerdasan buatan membantu penerjemah, tapi tidak menggantikan mereka.
      - AI membantu penerjemah, tetapi tidak menggantikan mereka.
      - Kecerdasan buatan membantu penerjemah, tetapi nggak menggantikan mereka.
      - Kecerdasan buatan membantu para penerjemah, tetapi nggak menggantikan mereka.
      - Kecerdasan buatan membantu penerjemah, tapi nggak menggantikan mereka.
      - AI membantu penerjemah, tetapi nggak menggantikan mereka.
    words: [kecerdasan buatan, menggantikan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي مهارة صعبة على المكنة؟
      ar: أيّ مهارة صعبة على الآلة؟
      en: Which skill is hard for a machine?
    options:
      - Berempati dengan pasien.
      - Menghitung angka.
      - Menyalin data.
    answer: 0
    explain:
      ar_eg: berempati = يحس باللي قدامه. الحساب ونسخ البيانات المكنة بتعملهم أسرع مننا.
      ar: berempati = التعاطف مع الآخر، أمّا الحساب ونسخ البيانات فالآلة أسرع فيهما منّا.
      en: berempati = to empathise; machines already count and copy data faster than us.
    words: [keterampilan]
  - id: e08
    type: speaking
    text: Otomatisasi membuat pekerjaan lebih cepat, tetapi tenaga kerja harus belajar lagi.
    meaning:
      ar_eg: الأتمتة بتخلي الشغل أسرع، بس العمال لازم يتعلموا من تاني.
      ar: تجعل الأتمتة العمل أسرع، لكنّ اليد العاملة يجب أن تتعلّم من جديد.
      en: Automation makes work faster, but the workforce has to retrain.
    words: [otomatisasi, tenaga kerja]
  - id: e09
    type: dictation
    text: Kecerdasan buatan bisa menerjemahkan teks dalam beberapa detik.
    meaning:
      ar_eg: الذكاء الاصطناعي يقدر يترجم نص في ثواني.
      ar: يستطيع الذكاء الاصطناعي ترجمة نصّ في ثوانٍ.
      en: AI can translate a text in a few seconds.
    words: [kecerdasan buatan]
  - id: e10
    type: fill_blank
    sentence: Pabrik itu membutuhkan lebih sedikit ___ karena otomatisasi.
    meaning:
      ar_eg: المصنع ده محتاج عمالة أقل بسبب الأتمتة.
      ar: يحتاج ذلك المصنع إلى يد عاملة أقلّ بسبب الأتمتة.
      en: That factory needs less labour because of automation.
    options: [tenaga kerja, kecerdasan buatan, keterampilan]
    answers: [tenaga kerja]
    words: [tenaga kerja, otomatisasi]
dialogue:
  title: Penerjemah dan mesin
  lines:
    - speaker: Mohamed
      text: Mas, kalau kecerdasan buatan bisa nerjemahin, aku bakal kehilangan pekerjaan nggak?
      ar_eg: يا ريزال، لو الذكاء الاصطناعي بيترجم، هخسر شغلي؟
      ar: يا ريزال، إن كان الذكاء الاصطناعي يترجم، فهل سأفقد عملي؟
      en: Mas, if AI can translate, will I lose my job?
    - speaker: Mas Rizal
      text: Mesin bisa nerjemahin kata, tapi nggak bisa gantiin rasa bahasa.
      ar_eg: المكنة تترجم كلام، بس متقدرش تاخد مكان الإحساس باللغة.
      ar: تترجم الآلة الكلمات، لكنها لا تحلّ محلّ الحسّ اللغوي.
      en: A machine can translate words, but it can't replace a feel for language.
    - speaker: Mohamed
      text: Jadi aku harus belajar keterampilan apa, dong?
      ar_eg: يبقى أتعلم مهارات إيه؟
      ar: فما المهارات التي يجب أن أتعلّمها؟
      en: So which skills should I learn?
    - speaker: Mas Rizal
      text: Ngecek hasil mesin sama paham budaya. Itu nggak bisa diotomatisasi.
      ar_eg: إنك تراجع شغل المكنة وتفهم الثقافة. دي حاجات متتعملش أوتوماتيك.
      ar: مراجعة ناتج الآلة وفهم الثقافة، وهذا لا يمكن أتمتته.
      en: Checking machine output and understanding culture. That can't be automated.
