        ar_eg: العصرية، آخر النهار
        ar: العصر، آخر النهار
        en: late afternoon
      - text: berkilau
        ar_eg: يلمع
        ar: يتلألأ
        en: to glitter, sparkle
      - text: lentera
        ar_eg: فانوس
        ar: فانوس
        en: lantern
      - text: keabadian
        ar_eg: خلود
        ar: خلود، أبدية
        en: eternity
