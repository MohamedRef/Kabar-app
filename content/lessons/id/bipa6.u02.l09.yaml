language: id
title: Berbalas pantun
can_do:
  ar_eg: تردّ على بانتون ببانتون، زي ما بيعملوا في الأفراح الملايو.
  ar: أن تردّ على بانتون ببانتون، كما في أعراس الملايو.
  en: Answer a pantun with a pantun, as at Malay weddings.
slides:
  - title: Pantun dibalas pantun
    grammar: id.pantun.structure
    body:
      ar_eg: |
        في الأفراح الملايو، rombongan (وفد) العريس ووفد العروسة بيتبادلوا بانتون على الباب. ده اسمه berbalas pantun. الرد بيمسك نفس الصورة أو نفس القافية.
        بانتون نصيحة قديم ومشهور:
        Pisang emas dibawa berlayar,
        masak sebiji di atas peti.
        Utang emas boleh dibayar,
        utang budi dibawa mati.
        = دين الدهب بيتسدّ، لكن دين الجميل بيفضل لحد الموت.
        وفيه كمان بانتون jenaka (هزار) يضحّك الناس.
      ar: |
        في أعراس الملايو يتبادل rombongan (وفد) العريس ووفد العروس البانتون عند الباب، ويسمّى ذلك berbalas pantun. ويحافظ الردّ على الصورة نفسها أو القافية نفسها.
        بانتون حكمة قديم شهير:
        Pisang emas dibawa berlayar,
        masak sebiji di atas peti.
        Utang emas boleh dibayar,
        utang budi dibawa mati.
        = دَين الذهب يُقضى، أمّا دَين المعروف فيبقى حتى الموت.
        ومنه أيضًا البانتون jenaka (الفكاهي).
      en: |
        At Malay weddings, the groom's rombongan (party) and the bride's trade pantun at the door. This is berbalas pantun. A reply keeps the same image or the same rhyme.
        A famous old advice pantun:
        Pisang emas dibawa berlayar,
        masak sebiji di atas peti.
        Utang emas boleh dibayar,
        utang budi dibawa mati.
        = A debt of gold can be repaid, but a debt of kindness you carry to the grave.
        There are jenaka (joking) pantun too.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: berbalas
        ar_eg: يتبادلوا / يردّوا على بعض
        ar: يتبادلون
        en: to exchange, to reply in turn
      - text: rombongan
        ar_eg: وفد / جماعة
        ar: وفد
        en: group, party
      - text: jenaka
        ar_eg: هزار / بيضحّك
        ar: فكاهي
        en: humorous
      - text: utang budi
        ar_eg: دين جميل
        ar: دين المعروف
        en: debt of gratitude
    words: [berbalas, rombongan, jenaka, utang budi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Utang budi dibawa mati» معناها إيه؟
      ar: ما معنى «Utang budi dibawa mati»؟
      en: What does "Utang budi dibawa mati" mean?
    options:
      - الجميل مابيتنسيش لحد الموت.
      - الدين لازم يتسدّ بسرعة.
      - الموز غالي.
    answer: 0
    words: [utang budi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي سطر يكمّل القافية بعد «Utang emas boleh dibayar»؟
      ar: أيّ سطر يكمل القافية بعد «Utang emas boleh dibayar»؟
      en: Which line completes the rhyme after "Utang emas boleh dibayar"?
    options:
      - utang budi tidak penting.
      - utang budi dibawa pulang.
      - utang budi dibawa mati.
    answer: 2
    words: [utang budi]
  - id: e04
    type: fill_blank
    sentence: Di pesta pernikahan Melayu, dua ___ saling berbalas pantun.
    meaning:
      ar_eg: في الفرح الملايو، وفدين بيتبادلوا البانتون.
      ar: في العرس الملايوي يتبادل وفدان البانتون.
      en: At a Malay wedding, two parties exchange pantun.
    options: [rombongan, jenaka, sampiran]
    answers: [rombongan]
    words: [rombongan, berbalas]
  - id: e05
    type: listen
    text: Pantun jenaka itu membuat semua tamu tertawa.
    question:
      ar_eg: البانتون عمل إيه في الضيوف؟
      ar: ماذا فعل البانتون بالضيوف؟
      en: What did the pantun do to the guests?
    options:
      - خلّاهم يعيطوا.
      - ضحّكهم كلهم.
      - خلّاهم يمشوا.
    answer: 1
    words: [jenaka]
  - id: e06
    type: build_sentence
    source:
      ar_eg: وفد العريس ردّ ببانتون هزار.
      ar: ردّ وفد العريس ببانتون فكاهي.
      en: The groom's party replied with a joking pantun.
    answer: Rombongan pengantin laki-laki membalas dengan pantun jenaka.
    distractors: [utang, berbalas]
    words: [rombongan, jenaka]
  - id: e07
    type: translate
    direction: from_target
    source_text: Kami berbalas pantun sampai pintu rumah dibuka.
    answers_meaning:
      ar_eg:
        - فضلنا نتبادل بانتون لحد ما باب البيت اتفتح.
        - قعدنا نردّ على بعض ببانتون لغاية ما فتحوا الباب.
      ar:
        - تبادلنا البانتون حتى فُتح باب البيت.
        - ظللنا نتبادل البانتون إلى أن فُتح الباب.
      en:
        - We exchanged pantun until the door of the house was opened.
        - We kept trading pantun until they opened the door.
    words: [berbalas]
  - id: e08
    type: speaking
    text: Mari kita berbalas pantun di depan pintu.
    meaning:
      ar_eg: يلا نتبادل بانتون قدام الباب.
      ar: هيّا نتبادل البانتون أمام الباب.
      en: Let's trade pantun at the door.
    words: [berbalas]
  - id: e09
    type: dictation
    text: Saya punya utang budi kepada guru saya.
    meaning:
      ar_eg: أنا عليّ جميل لمدرّسي.
      ar: لمعلّمي عليّ فضلٌ لا يُنسى.
      en: I owe my teacher a debt of gratitude.
    words: [utang budi]
