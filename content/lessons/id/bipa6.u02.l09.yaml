dialogue:
  title: Di depan pintu pengantin
  lines:
    - speaker: Encik Zul
      text: Mohamed, kamu masuk rombongan pengantin pria. Siap berbalas pantun?
      ar_eg: يا محمد، إنت مع وفد العريس. جاهز تردّ ببانتون؟
      ar: يا محمد، أنت في وفد العريس. أمستعدّ لتبادل البانتون؟
      en: Mohamed, you're in the groom's party. Ready to trade pantun?
    - speaker: Mak Cik Rohana
      text: Burung putih terbang ke kota, hinggap sebentar di dahan jati. Siapa gerangan tamu kita, untuk apa datang kemari?
      ar_eg: (من أهل العروسة) طير أبيض طار للمدينة، وقف شوية على فرع شجرة. مين يا ترى ضيوفنا، وجايين هنا ليه؟
      ar: (من أهل العروس) طار طائر أبيض إلى المدينة، وحطّ قليلًا على غصن ساج. مَن يا تُرى ضيوفنا، ولأيّ شيء جاؤوا إلى هنا؟
      en: (from the bride's side) A white bird flies to the town, resting a while on a teak branch. Who might our guests be, and what have they come here for?
    - speaker: Mohamed
      text: Dari Kairo naik pesawat, mampir sebentar di kota Medan. Kami datang membawa hormat, tolong buka pintu, Puan.
      ar_eg: من القاهرة ركبنا الطيارة، وعدّينا شوية على مدينة ميدان. جايين بكل احترام، افتحوا الباب لو سمحتي يا ست.
      ar: من القاهرة ركبنا الطائرة، ومررنا قليلًا بميدان. جئنا بالاحترام، فافتحي الباب من فضلك يا سيّدتي.
      en: From Cairo we took a plane, dropping in a while at Medan town. We come bearing respect; please open the door, madam.
    - speaker: Mak Cik Rohana
      text: Wah, pantun dari Mesir! Silakan masuk.
      ar_eg: يا سلام، بانتون من مصر! اتفضلوا ادخلوا.
      ar: يا للروعة، بانتون من مصر! تفضّلوا بالدخول.
      en: Oh, a pantun from Egypt! Please come in.
