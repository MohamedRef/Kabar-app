schema: kabar.lesson/v1
id: bipa6.u10.l01
language: id
title: Parafrasa
can_do:
  ar_eg: تعيد صياغة فكرة من مصدر بكلامك إنت وتنسبها لصاحبها.
  ar: أن تعيد صياغة فكرة من مصدر بألفاظك وتنسبها إلى صاحبها.
  en: Paraphrase an idea from a source in your own words and credit its author.
slides:
  - title: Kata-kata sendiri, ide orang lain
    grammar: id.reported-speech
    body:
      ar_eg: |
        النص الأصلي (مكتوب للدرس):
        «Abu vulkanik merusak tanaman dalam jangka pendek, tetapi menyuburkan tanah dalam jangka panjang.» (Sitepu, 2021)
        - kutipan langsung (اقتباس حرفي): بين علامتين، بنفس الكلام بالظبط.
        - parafrasa (إعادة صياغة): نفس الفكرة، كلام وتركيب جديد، ولسه لازم تذكر المصدر:
          Sitepu (2021) menyatakan bahwa abu gunung api memang merugikan petani pada awalnya, namun lama-kelamaan membuat tanah lebih subur.
        فعل النقل بيدّي نبرة: menyatakan (صرّح)، mengungkapkan (عبّر / كشف)، menegaskan (أكّد بقوة).
      ar: |
        النصّ الأصلي (مكتوب للدرس):
        «Abu vulkanik merusak tanaman dalam jangka pendek, tetapi menyuburkan tanah dalam jangka panjang.» (Sitepu, 2021)
        - kutipan langsung (الاقتباس الحرفي): بين علامتي تنصيص وبالألفاظ نفسها.
        - parafrasa (إعادة الصياغة): الفكرة نفسها بألفاظ وتركيب جديدين، مع ذكر المصدر أيضًا:
          Sitepu (2021) menyatakan bahwa abu gunung api memang merugikan petani pada awalnya, namun lama-kelamaan membuat tanah lebih subur.
        ولفعل النقل دلالته: menyatakan (صرّح)، mengungkapkan (عبّر / كشف)، menegaskan (أكّد بقوّة).
      en: |
        The original (written for the lesson):
        "Abu vulkanik merusak tanaman dalam jangka pendek, tetapi menyuburkan tanah dalam jangka panjang." (Sitepu, 2021)
        - kutipan langsung (direct quotation): in quotation marks, word for word.
        - parafrasa (paraphrase): the same idea in new words and a new structure, and you still credit the source:
          Sitepu (2021) menyatakan bahwa abu gunung api memang merugikan petani pada awalnya, namun lama-kelamaan membuat tanah lebih subur.
        The reporting verb sets the tone: menyatakan (state), mengungkapkan (express, reveal), menegaskan (stress, insist).
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: parafrasa
        ar_eg: إعادة صياغة
        ar: إعادة صياغة
        en: paraphrase
      - text: kutipan langsung
        ar_eg: اقتباس حرفي
        ar: اقتباس حرفي
        en: direct quotation
      - text: menyatakan
        ar_eg: يصرّح / يقول (رسمي)
        ar: يصرّح
        en: to state
      - text: mengungkapkan
        ar_eg: يعبّر عن / يكشف
        ar: يعبّر عن / يكشف
        en: to express, to reveal
      - text: menegaskan
        ar_eg: يؤكّد بقوة
        ar: يؤكّد
        en: to stress, to insist
    words: [parafrasa, kutipan langsung, menyatakan, mengungkapkan, menegaskan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة parafrasa صح لـ «Air bersih adalah hak semua warga»؟
      ar: أيّها إعادة صياغة صحيحة لـ «Air bersih adalah hak semua warga»؟
      en: Which is a good paraphrase of "Air bersih adalah hak semua warga"?
    options:
      - Air bersih adalah hak semua warga.
      - Setiap warga berhak atas air yang bersih.
      - Air kotor tidak baik.
    answer: 1
    words: [parafrasa]
    explain:
      ar_eg: "إعادة الصياغة بتقول نفس المعنى بكلام مختلف: berhak atas. الأول نفس الجملة بالظبط، والتالت معنى تاني."
      ar: إعادة الصياغة تؤدّي المعنى نفسه بألفاظ أخرى berhak atas؛ فالأوّل نقل حرفي، والثالث معنى آخر.
      en: "A paraphrase keeps the meaning in new words: berhak atas. The first copies word for word, and the third changes the meaning."
  - id: e03
    type: fill_blank
    sentence: Dalam laporannya, Ginting ___ bahwa jumlah wisatawan naik dua kali lipat.
    meaning:
      ar_eg: في تقريره، جينتينج صرّح إن عدد السيّاح زاد الضعف.
      ar: صرّح غينتينغ في تقريره بأنّ عدد السيّاح تضاعف.
      en: In his report, Ginting states that the number of tourists has doubled.
    options: [menyatakan, parafrasa, kutipan langsung]
    answers: [menyatakan]
    words: [menyatakan]
    explain:
      ar_eg: «بيذكر إن» = menyatakan bahwa، فعل. parafrasa وkutipan langsung أسماء لأنواع النقل.
      ar: «يذكر أنّ» menyatakan bahwa وهو فعل؛ أمّا parafrasa وkutipan langsung فاسمان لطريقتي النقل.
      en: "\"States that\" is menyatakan bahwa, a verb. parafrasa and kutipan langsung name ways of citing."
  - id: e04
    type: listen
    text: Peneliti itu menegaskan bahwa desa di zona merah tidak boleh dihuni lagi.
    question:
      ar_eg: الباحث أكّد على إيه؟
      ar: علامَ أكّد الباحث؟
      en: What did the researcher insist on?
    options:
      - إن القرى في المنطقة الحمرا ماينفعش حد يسكنها تاني.
      - إن القرى رجعت آمنة.
      - إن السيّاح يقدروا يطلعوا الجبل.
    answer: 0
    words: [menegaskan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الكاتبة عبّرت عن قلقها على الفلاحين.
      ar: عبّرت الكاتبة عن قلقها على المزارعين.
      en: The writer expressed her concern for the farmers.
    answer: Penulis itu mengungkapkan kekhawatirannya terhadap para petani.
    distractors: [menegaskan, parafrasa]
    words: [mengungkapkan]
    explain:
      ar_eg: «عبّرت عن قلقها» = mengungkapkan kekhawatirannya. menegaskan = أكّد وparafrasa = إعادة صياغة.
      ar: «عبّرت عن قلقها» mengungkapkan kekhawatirannya؛ أمّا menegaskan فأكّد، وparafrasa إعادة صياغة.
      en: "\"Expressed her concern\" is mengungkapkan kekhawatirannya. menegaskan is \"insisted\", and parafrasa a paraphrase."
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إمتى لازم تستعمل kutipan langsung بدل parafrasa؟
      ar: متى يلزم الاقتباس الحرفي بدل إعادة الصياغة؟
      en: When should you use a direct quotation instead of a paraphrase?
    options:
      - دايمًا، علشان أسهل.
      - ولا مرة، الاقتباس ممنوع.
      - لما الكلمات نفسها مهمة، زي تعريف أو جملة مشهورة.
    answer: 2
    words: [kutipan langsung, parafrasa]
    explain:
      ar_eg: الاقتباس الحرفي لما الكلمات نفسها مهمة، زي تعريف أو جملة مشهورة. مش دايمًا، ومش ممنوع.
      ar: يُقتبس حرفيًّا حين تهمّ الألفاظ نفسها كتعريف أو قول مشهور؛ لا دائمًا، ولا هو ممنوع.
      en: Quote directly when the exact words matter, like a definition or famous line. Not always, and it isn't banned.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الوزير صرّح إن الطريق هيتفتح السنة الجاية.
      ar: صرّح الوزير بأنّ الطريق سيُفتتح العام المقبل.
      en: The minister stated that the road will open next year.
    answers:
      - Menteri menyatakan bahwa jalan itu akan dibuka tahun depan.
      - Menteri itu menyatakan bahwa jalan akan dibuka tahun depan.
      - Menteri menyatakan jalan itu akan dibuka tahun depan.
      - Menteri itu menyatakan bahwa jalan tersebut akan dibuka tahun depan.
    words: [menyatakan]
  - id: e08
    type: speaking
    text: Kutipan langsung harus ditulis di antara tanda petik.
    meaning:
      ar_eg: الاقتباس الحرفي لازم يتكتب بين علامتين تنصيص.
      ar: يجب أن يُكتب الاقتباس الحرفي بين علامتي تنصيص.
      en: A direct quotation must be written between quotation marks.
    words: [kutipan langsung]
  - id: e09
    type: dictation
    text: Ia menegaskan bahwa parafrasa tetap memerlukan sumber.
    meaning:
      ar_eg: أكّد إن إعادة الصياغة برضه محتاجة مصدر.
      ar: أكّد أنّ إعادة الصياغة تحتاج إلى مصدر أيضًا.
      en: He stressed that a paraphrase still needs a source.
    words: [menegaskan, parafrasa]
  - id: e10
    type: translate
    direction: from_target
    source_text: Warga desa mengungkapkan harapan mereka untuk pulang.
    answers_meaning:
      ar_eg:
        - أهل القرية عبّروا عن أملهم إنهم يرجعوا.
        - سكان القرية قالوا إنهم نفسهم يرجعوا بيوتهم.
      ar:
        - عبّر أهل القرية عن أملهم في العودة.
        - أبدى سكّان القرية رجاءهم بالرجوع إلى ديارهم.
      en:
        - The villagers expressed their hope of returning home.
        - The villagers voiced their hope to go back.
    words: [mengungkapkan]
dialogue:
  title: Jangan menyalin
  lines:
    - speaker: Pak Ginting
      text: Mohamed, kalimat ini sama dengan tulisan Sitepu.
      ar_eg: يا محمد، الجملة دي هي هي اللي في كتابة سيتيبو.
      ar: يا محمد، هذه الجملة هي نفسها في كتابة سيتيبو.
      en: Mohamed, this sentence is the same as Sitepu's writing.
    - speaker: Mohamed
      text: Maaf, Pak. Saya rasa itu kutipan langsung.
      ar_eg: آسف يا أستاذ. كنت حاسس إنها اقتباس حرفي.
      ar: عذرًا يا أستاذ. ظننتها اقتباسًا مباشرًا.
      en: Sorry, sir. I felt it was a direct quotation.
    - speaker: Pak Ginting
      text: Kalau begitu, pakai tanda petik. Atau buat parafrasa dengan bahasamu sendiri.
      ar_eg: يبقى حط علامات تنصيص. أو اعمل إعادة صياغة بكلامك إنت.
      ar: إذن ضع علامتي تنصيص، أو أعد صياغتها بألفاظك.
      en: Then use quotation marks. Or paraphrase it in your own words.
    - speaker: Mohamed
      text: Baik. "Sitepu menyatakan bahwa letusan gunung membuat tanah subur."
      ar_eg: ماشي. «سيتيبو بيقول إن ثوران البركان بيخلّي الأرض خصبة».
      ar: حسنًا. «يذكر سيتيبو أنّ ثوران البركان يجعل التربة خصبة».
      en: All right. "Sitepu states that eruptions make the soil fertile."
