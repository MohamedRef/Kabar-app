schema: kabar.lesson/v1
id: bipa1.u01.l01
language: id
title: Selamat pagi!
can_do:
  ar_eg: تسلّم على الناس حسب وقت اليوم وتقول مع السلامة.
  ar: أن تُحيّي الناس بحسب وقت اليوم وتودّعهم.
  en: Greet people by time of day and say goodbye.
slides:
  - title: Selamat = سلامة
    body:
      ar_eg: كلمة selamat جاية من العربي «سلامة». لما تحطها قبل وقت اليوم بتبقى تحية، زي «صباح الخير».
      ar: كلمة selamat مأخوذة من العربية «سلامة»، وإذا سبقت وقتَ اليوم صارت تحية مثل «صباح الخير».
      en: selamat comes from Arabic «سلامة» (safety). Put it before a time of day and it becomes a greeting, like "good morning".
    grammar: id.greeting.selamat
    examples:
      - text: Selamat pagi!
        ar_eg: صباح الخير!
        ar: صباح الخير!
        en: Good morning!
  - title: Pagi, siang, sore, malam
    body:
      ar_eg: |
        اليوم الإندونيسي متقسّم أربع حتت:
        - pagi: الصبح لحد حوالي ١١
        - siang: الضهر، من ١١ لحد ٣
        - sore: العصر، من ٣ لحد المغرب
        - malam: بالليل، بعد المغرب
      ar: |
        يُقسم اليوم في الإندونيسية أربعة أقسام:
        - pagi: الصباح حتى نحو الحادية عشرة
        - siang: الظهيرة، من الحادية عشرة إلى الثالثة
        - sore: العصر، من الثالثة إلى المغرب
        - malam: الليل، بعد المغرب
      en: |
        The Indonesian day has four parts:
        - pagi: morning, until about 11
        - siang: midday, 11 to 3
        - sore: afternoon, 3 to sunset
        - malam: night, after sunset
    grammar: id.greeting.selamat
    examples:
      - text: Selamat siang, Pak.
        ar_eg: نهارك سعيد يا أستاذ.
        ar: طاب نهارك يا سيدي.
        en: Good day, sir.
      - text: Selamat sore, Bu.
        ar_eg: مساء الخير يا مدام.
        ar: مساء الخير يا سيدتي.
        en: Good afternoon, ma'am.
      - text: Selamat malam!
        ar_eg: مساء الخير! / تصبح على خير!
        ar: مساء الخير! / تصبح على خير!
        en: Good evening! / Good night!
  - title: Selamat jalan, selamat tinggal
    body:
      ar_eg: في الوداع، اللي قاعد بيقول للي ماشي «selamat jalan» (يعني امشي بالسلامة)، واللي ماشي بيقول للي قاعد «selamat tinggal». في الحياة اليومية الأسهل «Sampai jumpa!» يعني «أشوفك بعدين».
      ar: عند الوداع يقول المقيم للراحل «selamat jalan» (سِرْ بسلامة)، ويقول الراحل للمقيم «selamat tinggal». وفي الحياة اليومية يُقال غالبًا «Sampai jumpa!» أي «إلى اللقاء».
      en: When parting, the one staying says "selamat jalan" (go safely) to the one leaving, and the one leaving says "selamat tinggal". In everyday life "Sampai jumpa!" (see you) is the easy choice.
    grammar: id.greeting.selamat
    examples:
      - text: Sampai jumpa besok!
        ar_eg: أشوفك بكرة!
        ar: إلى اللقاء غدًا!
        en: See you tomorrow!
      - text: Selamat datang di Jakarta!
        ar_eg: أهلًا بيك في جاكرتا!
        ar: أهلًا وسهلًا بك في جاكرتا!
        en: Welcome to Jakarta!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pagi
        ar_eg: الصبح
        ar: الصباح
        en: morning
      - text: siang
        ar_eg: الضهر
        ar: الظهيرة
        en: midday
      - text: sore
        ar_eg: العصر
        ar: العصر
        en: afternoon
      - text: malam
        ar_eg: بالليل
        ar: الليل
        en: night
    words: [pagi, siang, sore, malam]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الساعة ٨ الصبح. تقول إيه للمُدرّسة؟
      ar: الساعة الثامنة صباحًا. ماذا تقول للمعلّمة؟
      en: It's 8 a.m. What do you say to the teacher?
    options: ['Selamat sore, Bu!', 'Selamat malam, Bu!', 'Selamat pagi, Bu!', 'Selamat jalan, Bu!']
    answer: 2
    explain:
      ar_eg: الساعة ٨ لسه الصبح، يبقى pagi.
      ar: الثامنة صباحًا من الـ pagi.
      en: 8 a.m. is still pagi.
    words: [selamat, pagi, selamat jalan]
  - id: e03
    type: fill_blank
    sentence: Selamat ___, Bu! Sampai jumpa besok.
    meaning:
      ar_eg: (الساعة ٩ بالليل) تصبحي على خير يا مدام! أشوفك بكرة.
      ar: (الساعة التاسعة ليلًا) تصبحين على خير يا سيدتي! إلى اللقاء غدًا.
      en: (9 p.m.) Good night, ma'am! See you tomorrow.
    options: [malam, siang, pagi, sore]
    answers: [malam]
    words: [malam, sampai jumpa]
    explain:
      ar_eg: الساعة ٩ بالليل، فبنقول Selamat malam. pagi للصبح، siang للضهر، sore للعصر.
      ar: في التاسعة ليلًا نقول Selamat malam. pagi للصباح وsiang للظهر وsore للعصر.
      en: At 9 p.m. it's Selamat malam. pagi, siang and sore are earlier in the day.
  - id: e04
    type: listen
    text: Selamat sore
    options: [Selamat siang, Selamat sore, Selamat malam, Selamat jalan]
    answer: 1
    words: [sore, selamat jalan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: صباح الخير يا مدام!
      ar: صباح الخير يا سيدتي!
      en: Good morning, ma'am!
    answer: Selamat pagi, Bu!
    distractors: [malam, Pak]
    words: [selamat, pagi]
    explain:
      ar_eg: Selamat pagi = صباح الخير، وبعدها Bu للست. malam للّيل، وPak للراجل.
      ar: Selamat pagi = صباح الخير ثم Bu للسيدة. malam لليل وPak للرجل.
      en: Selamat pagi + Bu for a woman. malam is evening; Pak is for a man.
  - id: e06
    type: dictation
    text: Sampai jumpa besok
    meaning:
      ar_eg: نشوفك بكرة
      ar: إلى اللقاء غدًا
      en: See you tomorrow
    words: [sampai jumpa, besok]
  - id: e07
    type: speaking
    text: Selamat siang, Bu! Sampai jumpa besok.
    meaning:
      ar_eg: نهارك سعيد يا مدام! نشوفك بكرة.
      ar: طاب يومكِ يا سيدتي! إلى اللقاء غدًا.
      en: Good afternoon, ma'am! See you tomorrow.
    words: [selamat, siang, sampai jumpa, besok]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: Raka ماشي من عندك وإنت قاعد. تقوله إيه؟
      ar: يغادر Raka وأنت باقٍ. ماذا تقول له؟
      en: Raka is leaving and you are staying. What do you say to him?
    options: [Selamat pagi!, Selamat jalan!, Selamat malam!]
    answer: 1
    explain:
      ar_eg: selamat jalan = امشي بالسلامة، بنقولها للي ماشي.
      ar: selamat jalan = سِرْ بسلامة، تقال للراحل.
      en: selamat jalan = go safely, said to the one leaving.
    words: [selamat jalan]
dialogue:
  title: Pagi di Kota Tua
  lines:
    - speaker: Rina
      text: Selamat pagi!
      ar_eg: صباح الخير!
      ar: صباح الخير!
      en: Good morning!
    - speaker: Pak Irwan
      text: Pagi, Rina!
      ar_eg: صباح النور يا رينا!
      ar: صباح النور يا رينا!
      en: Morning, Rina!
    - speaker: Rina
      text: Sampai jumpa besok!
      ar_eg: أشوفك بكرة!
      ar: إلى اللقاء غدًا!
      en: See you tomorrow!
    - speaker: Pak Irwan
      text: Selamat jalan, Rina! Sampai jumpa besok!
      ar_eg: مع السلامة يا رينا! أشوفك بكرة!
      ar: في أمان الله يا رينا! إلى اللقاء غدًا!
      en: Goodbye, Rina! See you tomorrow!
