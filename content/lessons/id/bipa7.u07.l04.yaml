schema: kabar.lesson/v1
id: bipa7.u07.l04
language: id
title: Otonomi daerah
can_do:
  ar_eg: تشرح إزاي إندونيسيا مقسّمة لمحافظات ومراكز، وليه بابوا اتقسمت لمحافظات جديدة.
  ar: أن تشرح تقسيم إندونيسيا إلى محافظات ومناطق، وسبب تقسيم بابوا إلى محافظات جديدة.
  en: Explain how Indonesia is divided into provinces and regencies, and why Papua was split into new provinces.
slides:
  - title: Dari pusat ke daerah
    body:
      ar_eg: |
        إندونيسيا مقسّمة لـ provinsi (محافظة كبيرة)، وكل provinsi فيها kabupaten (مركز / إقليم ريفي) وkota (مدينة).
        - otonomi daerah (الحكم المحلي) بدأ بعد الـ reformasi: من ٢٠٠١ المناطق بقت تدير مدارسها ومستشفياتها وطرقها بنفسها.
        - pemekaran = تقسيم منطقة لمنطقتين أو أكتر علشان الخدمة تقرب من الناس.
        - سنة ٢٠٢٢ اتعملت أربع محافظات جديدة في منطقة بابوا: Papua Selatan وPapua Tengah وPapua Pegunungan من محافظة بابوا، وPapua Barat Daya (وعاصمتها سورونج) من بابوا الغربية.
        النهارده إندونيسيا فيها ٣٨ provinsi.
        - في الكلام: aja = saja.
      ar: |
        تنقسم إندونيسيا إلى provinsi (محافظات)، وفي كلّ منها kabupaten (أقاليم ريفية) وkota (مدن).
        - بدأ الـ otonomi daerah (الحكم المحلّيّ) بعد الـ reformasi، فمنذ ٢٠٠١ صارت المناطق تدير مدارسها ومستشفياتها وطرقها بنفسها.
        - pemekaran = تقسيم منطقة إلى اثنتين أو أكثر لتقريب الخدمات من الناس.
        - وفي ٢٠٢٢ أُنشئت أربع محافظات جديدة في منطقة بابوا: Papua Selatan وPapua Tengah وPapua Pegunungan من محافظة بابوا، وPapua Barat Daya (وعاصمتها سورونغ) من بابوا الغربية.
        وفي إندونيسيا اليوم ٣٨ provinsi.
        - في الكلام اليومي: aja = saja.
      en: |
        Indonesia is divided into provinsi (provinces), each with kabupaten (regencies) and kota (cities).
        - Otonomi daerah (regional autonomy) began after the reformasi: from 2001 regions ran their own schools, hospitals and roads.
        - pemekaran = splitting a region into two or more so services come closer to people.
        - In 2022 four new provinces were created in the Papua region: Papua Selatan, Papua Tengah and Papua Pegunungan from Papua, and Papua Barat Daya (capital: Sorong) from Papua Barat.
        Today Indonesia has 38 provinsi.
        - In speech: aja = saja.
    examples:
      - text: Setelah pemekaran, Sorong menjadi ibu kota provinsi baru.
        ar_eg: بعد التقسيم، سورونج بقت عاصمة محافظة جديدة.
        ar: بعد التقسيم صارت سورونغ عاصمة محافظة جديدة.
        en: After the split, Sorong became the capital of a new province.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: otonomi daerah
        ar_eg: الحكم المحلي
        ar: الحكم المحلّيّ
        en: regional autonomy
      - text: pemekaran
        ar_eg: تقسيم منطقة
        ar: تقسيم إداريّ
        en: splitting a region
      - text: kabupaten
        ar_eg: مركز ريفي
        ar: إقليم ريفيّ
        en: regency
      - text: provinsi
        ar_eg: محافظة
        ar: محافظة
        en: province
      - text: reformasi
        ar_eg: الإصلاح (١٩٩٨)
        ar: الإصلاح (١٩٩٨)
        en: Reform era (1998)
    words: [otonomi daerah, pemekaran, kabupaten, provinsi, reformasi]
  - id: e02
    type: listen
    text: Sekarang Indonesia punya tiga puluh delapan provinsi.
    question:
      ar_eg: إندونيسيا فيها كام محافظة دلوقتي؟
      ar: كم محافظة في إندونيسيا الآن؟
      en: How many provinces does Indonesia have now?
    options:
      - ٢٧
      - ٣٨
      - ٨٣
    answer: 1
    words: [provinsi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الهدف من الـ pemekaran إيه؟
      ar: ما الغاية من الـ pemekaran؟
      en: What is pemekaran for?
    options:
      - تقليل عدد الناس.
      - بيع الأرض.
      - إن الخدمات الحكومية تقرب من الناس.
    answer: 2
    words: [pemekaran]
    explain:
      ar_eg: pemekaran = تقسيم منطقة لمناطق أصغر، علشان الخدمات الحكومية تقرب من الناس.
      ar: pemekaran = تقسيم الإقليم إلى أقاليم أصغر لتقريب الخدمات من الناس.
      en: pemekaran splits regions to bring services closer to people.
  - id: e04
    type: fill_blank
    sentence: Raja Ampat adalah sebuah ___ di Provinsi Papua Barat Daya.
    meaning:
      ar_eg: راجا أمبات مركز في محافظة بابوا الجنوبية الغربية.
      ar: راجا أمبات إقليم في محافظة بابوا الجنوبية الغربية.
      en: Raja Ampat is a regency in Southwest Papua Province.
    options: [kabupaten, provinsi, pemekaran]
    answers: [kabupaten]
    words: [kabupaten, provinsi]
    explain:
      ar_eg: sebuah ___ di Provinsi = حاجة جوه محافظة، يعني kabupaten (مركز/إقليم). pemekaran اسم عملية مش مكان.
      ar: الجزء داخل provinsi هو kabupaten. pemekaran عملية لا مكان.
      en: A unit inside a province is a kabupaten (regency).
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الحكم المحلي بدأ إمتى تقريبًا؟
      ar: متى بدأ الحكم المحلّيّ تقريبًا؟
      en: Roughly when did regional autonomy begin?
    options:
      - بعد الإصلاح، حوالي ٢٠٠١.
      - سنة ١٩٤٥.
      - في عصر الـ VOC.
    answer: 0
    words: [otonomi daerah, reformasi]
    explain:
      ar_eg: الحكم الذاتي للأقاليم (otonomi daerah) بدأ بعد الإصلاح، حوالي 2001.
      ar: بدأ الحكم الذاتي الإقليمي بعد الإصلاح نحو عام 2001.
      en: Regional autonomy began after Reformasi, around 2001.
  - id: e06
    type: build_sentence
    source:
      ar_eg: الحكم المحلي بيدّي المناطق سلطة أكبر.
      ar: يمنح الحكم المحلّيّ المناطقَ سلطة أوسع.
      en: Regional autonomy gives regions more power.
    answer: Otonomi daerah memberi daerah wewenang yang lebih besar.
    distractors: [pemekaran, provinsi]
    words: [otonomi daerah]
    explain:
      ar_eg: Otonomi daerah + memberi (بتدّي) + daerah + wewenang yang lebih besar (صلاحيات أكبر). pemekaran وprovinsi زيادة.
      ar: Otonomi daerah memberi daerah wewenang yang lebih besar. pemekaran وprovinsi زائدتان.
      en: Otonomi daerah + memberi + daerah + wewenang yang lebih besar. pemekaran and provinsi are extra.
  - id: e07
    type: translate
    direction: from_target
    source_text: Pemekaran kabupaten itu membuat rumah sakit lebih dekat dengan warga.
    answers_meaning:
      ar_eg:
        - تقسيم المركز ده خلّى المستشفى أقرب للناس.
        - لما المركز اتقسم، المستشفى بقى قريّب من الأهالي.
      ar:
        - جعل تقسيم ذلك الإقليم المستشفى أقرب إلى السكّان.
        - قرّب تقسيم الإقليم المستشفى من الأهالي.
      en:
        - Splitting that regency brought the hospital closer to residents.
        - After the regency was split, the hospital became nearer to people.
    words: [pemekaran, kabupaten]
  - id: e08
    type: speaking
    text: Manokwari adalah ibu kota Provinsi Papua Barat.
    meaning:
      ar_eg: مانوكواري عاصمة محافظة بابوا الغربية.
      ar: مانوكواري عاصمة محافظة بابوا الغربية.
      en: Manokwari is the capital of West Papua Province.
    words: [provinsi]
  - id: e09
    type: dictation
    text: Pada tahun 2022, wilayah Papua mengalami pemekaran menjadi beberapa provinsi.
    meaning:
      ar_eg: سنة ٢٠٢٢، منطقة بابوا اتقسمت لكذا محافظة.
      ar: في سنة ٢٠٢٢ قُسّمت منطقة بابوا إلى عدّة محافظات.
      en: In 2022 the Papua region was split into several provinces.
    words: [pemekaran, provinsi]
  - id: e10
    type: speaking
    text: Dengan otonomi daerah, kabupaten bisa mengatur sekolahnya sendiri.
    meaning:
      ar_eg: مع الحكم المحلي، المركز يقدر يدير مدارسه بنفسه.
      ar: بالحكم المحلّيّ يستطيع الإقليم إدارة مدارسه بنفسه.
      en: With regional autonomy, a regency can run its own schools.
    words: [otonomi daerah, kabupaten]
dialogue:
  title: Peta baru di dinding
  lines:
    - speaker: Bu Debora
      text: Mohamed, tolong ganti peta di ruang redaksi. Yang lama masih dua provinsi aja di Papua.
      ar_eg: يا محمد، غيّر الخريطة اللي في غرفة التحرير. القديمة لسه فيها محافظتين بس في بابوا.
      ar: يا محمد، استبدل الخريطة في غرفة التحرير، فالقديمة لا تُظهر إلا محافظتين في بابوا.
      en: Mohamed, please replace the map in the newsroom. The old one still shows just two provinces in Papua.
    - speaker: Mohamed
      text: Sekarang ada enam, kan, Bu? Setelah pemekaran tahun 2022.
      ar_eg: دلوقتي بقوا ستة، صح يا أبلة؟ بعد التقسيم سنة ٢٠٢٢.
      ar: صارت ستًّا الآن، أليس كذلك؟ بعد تقسيم ٢٠٢٢.
      en: There are six now, right, Bu? After the 2022 split.
    - speaker: Bu Debora
      text: Betul. Manokwari tetap ibu kota Papua Barat, dan Sorong ibu kota Papua Barat Daya.
      ar_eg: صح. مانوكواري لسه عاصمة بابوا الغربية، وسورونج عاصمة بابوا الجنوبية الغربية.
      ar: صحيح. تبقى مانوكواري عاصمة بابوا الغربية، وسورونغ عاصمة بابوا الجنوبية الغربية.
      en: Right. Manokwari is still West Papua's capital, and Sorong is Southwest Papua's.
    - speaker: Mohamed
      text: Jadi kabupaten Raja Ampat sekarang ikut Papua Barat Daya.
      ar_eg: يبقى مركز راجا أمبات دلوقتي تبع بابوا الجنوبية الغربية.
      ar: إذن صار إقليم راجا أمبات تابعًا لبابوا الجنوبية الغربية.
      en: So Raja Ampat regency now belongs to Southwest Papua.
