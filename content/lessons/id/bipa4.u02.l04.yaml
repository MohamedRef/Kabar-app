schema: kabar.lesson/v1
id: bipa4.u02.l04
language: id
title: Redaksi yth.
can_do:
  ar_eg: "ترتب رسالة قرّاء للجرنال: البداية والموضوع والختام."
  ar: "أن تبني رسالة إلى بريد القرّاء: الافتتاح والمضمون والختام."
  en: Structure a reader's letter.
slides:
  - title: Struktur surat pembaca
    body:
      ar_eg: |
        رسالة القرّاء (surat pembaca) ليها شكل ثابت:
        1) Yth. Redaksi … (Yth. = yang terhormat = المحترم) — لهيئة التحرير.
        2) Dengan hormat, (اللي عرفتها في رسايل الشكوى)
        3) المشكلة، وبعدين الطلب: Mohon … / Kami berharap …
        4) Atas perhatian Redaksi, saya ucapkan terima kasih.
        5) Hormat saya, + اسمك.
      ar: |
        لرسالة القرّاء (surat pembaca) بنية ثابتة:
        1) Yth. Redaksi … (Yth. = yang terhormat = المحترم) موجهة إلى هيئة التحرير.
        2) Dengan hormat, (كما في رسائل الشكوى)
        3) المشكلة ثم الطلب: Mohon … / Kami berharap …
        4) Atas perhatian Redaksi, saya ucapkan terima kasih.
        5) Hormat saya, + الاسم.
      en: |
        A letter to the editor (surat pembaca) has a fixed shape:
        1) Yth. Redaksi … (Yth. = yang terhormat = dear / esteemed) — to the editors.
        2) Dengan hormat, (as in complaint letters)
        3) The problem, then the request: Mohon … / Kami berharap …
        4) Atas perhatian Redaksi, saya ucapkan terima kasih. (Thank you for your attention.)
        5) Hormat saya, + your name. (Yours faithfully)
    examples:
      - text: Yth. Redaksi Kabar Sulawesi
        ar_eg: إلى هيئة تحرير «كابار سولاويسي» المحترمة
        ar: إلى هيئة تحرير «كابار سولاويسي» المحترمة
        en: Dear Editors of Kabar Sulawesi
      - text: Atas perhatian Redaksi, saya ucapkan terima kasih.
        ar_eg: شكرًا لاهتمام هيئة التحرير.
        ar: أشكر هيئة التحرير على اهتمامها.
        en: Thank you, Editors, for your attention.
  - title: Masyarakat dan pelayanan
    body:
      ar_eg: |
        كلمتين هتحتاجهم في أي شكوى عامة:
        pelayanan = الخدمة (في المستشفى، البلدية، المواصلات)
        masyarakat = المجتمع / الناس — جاية من العربي «مشاركة».
        وhormat في Hormat saya جاية من «حُرمة» (احترام).
      ar: |
        كلمتان تحتاجهما في كل شكوى عامة:
        pelayanan = الخدمة (في المستشفى والبلدية والمواصلات)
        masyarakat = المجتمع / الناس، من العربية «مشاركة».
        وhormat في Hormat saya من «حُرمة».
      en: |
        Two words every public complaint needs:
        pelayanan = service (at hospitals, offices, transport)
        masyarakat = society, the public — from Arabic «مشاركة».
        And hormat in Hormat saya comes from «حُرمة» (respect).
    examples:
      - text: Masalah ini penting bagi masyarakat Maros.
        ar_eg: المشكلة دي مهمة لأهل ماروس.
        ar: هذه المشكلة مهمة لمجتمع ماروس.
        en: This problem matters to the people of Maros.
