    words: [redaksi, yang terhormat, surat pembaca, pelayanan, masyarakat, hormat saya]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بتكتب رسالة قرّاء. تبدأها إزاي؟
      ar: تكتب رسالة إلى بريد القرّاء. كيف تبدؤها؟
      en: You're writing a letter to the editor. How do you open it?
    options: ["Halo, Redaksi!", "Yth. Redaksi Kabar Sulawesi", "Hormat saya, Redaksi"]
    answer: 1
    explain:
      ar_eg: الرسالة الرسمية بتبدأ بـ Yth. (yang terhormat). Hormat saya للختام.
      ar: تبدأ الرسالة الرسمية بـ Yth.، وHormat saya للختام.
      en: A formal letter opens with Yth. (yang terhormat); Hormat saya is the closing.
    words: [yang terhormat, redaksi]
  - id: e03
    type: listen
    text: Masyarakat banyak mengeluh tentang pelayanan rumah sakit.
    options: ["Masyarakat banyak mengeluh tentang pelayanan bus kota.", "Mahasiswa banyak mengeluh tentang pelayanan rumah sakit.", "Masyarakat banyak mengeluh tentang pelayanan rumah sakit."]
    answer: 2
    meaning:
      ar_eg: الناس بيشتكوا كتير من الخدمة في المستشفى.
      ar: يشتكي الناس كثيرًا من خدمة المستشفى.
      en: Many people complain about the hospital's service.
    words: [masyarakat, pelayanan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي بتكتبه قبل اسمك في آخر الرسالة؟
      ar: ماذا تكتب قبل اسمك في آخر الرسالة؟
      en: What do you write before your name at the end of the letter?
    options: ["Hormat saya,", "Dengan hormat,", "Yth.,"]
    answer: 0
    explain:
      ar_eg: Dengan hormat في الأول بعد التحية، وHormat saya في الآخر قبل الاسم.
      ar: Dengan hormat في البداية، وHormat saya في الختام قبل الاسم.
      en: Dengan hormat comes at the start; Hormat saya at the end, before your name.
    words: [hormat saya]
