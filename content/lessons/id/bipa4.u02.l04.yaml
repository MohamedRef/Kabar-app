dialogue:
  title: Menulis surat bersama
  lines:
    - speaker: Mohamed
      text: Pak Amir, surat pembaca ini saya mulai dengan "Yth. Redaksi", ya?
      ar_eg: يا أستاذ أمير، أبدأ رسالة القرّاء دي بـ «Yth. Redaksi»، صح؟
      ar: يا سيد أمير، أأبدأ رسالة القرّاء هذه بـ «Yth. Redaksi»؟
      en: Pak Amir, I'll start this letter to the editor with "Yth. Redaksi", right?
    - speaker: Pak Amir
      text: Betul. Lalu "Dengan hormat". Jelaskan masalahnya dengan sopan.
      ar_eg: مظبوط. وبعدين «Dengan hormat». واشرح المشكلة بأدب.
      ar: صحيح. ثم «Dengan hormat»، واشرح المشكلة بأدب.
      en: Right. Then "Dengan hormat". Explain the problem politely.
    - speaker: Mohamed
      text: Saya tulis bahwa pelayanan pemerintah lambat dan jalan rusak itu berbahaya bagi masyarakat.
      ar_eg: هكتب إن خدمة الحكومة بطيئة، وإن الطريق البايظ ده خطر على الناس.
      ar: سأكتب أن خدمة الحكومة بطيئة، وأن الطريق المتضرر خطر على الناس.
      en: I'll write that the government's service is slow and the broken road is dangerous for the public.
    - speaker: Pak Amir
      text: Bagus. Jangan lupa penutupnya, "Hormat saya", lalu nama dan alamat.
      ar_eg: "حلو. وما تنساش الختام: «Hormat saya»، وبعدين الاسم والعنوان."
      ar: "جيد. ولا تنسَ الختام: «Hormat saya» ثم الاسم والعنوان."
      en: Good. Don't forget the closing, "Hormat saya", then your name and address.
