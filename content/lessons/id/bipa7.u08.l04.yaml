id: bipa7.u08.l04
language: id
title: Rumput laut
can_do:
  ar_eg: تفهم شغل زراعة الطحالب البحرية من الزرع للبيع، وتعرف مين بيكسب.
  ar: أن تفهم تجارة زراعة الطحالب البحرية من الزرع إلى البيع، ومن يربح فيها.
  en: Follow the seaweed business from planting to sale, and see who profits.
slides:
  - title: Kebun di dalam laut
    body:
      ar_eg: |
        إندونيسيا من أكبر بلاد العالم في إنتاج الـ rumput laut (الطحالب البحرية).
        - budidaya = تربية / زراعة: بيربطوا حتت طحالب في حبال في البحر، وبعد حوالي ٤٥ يوم بيحصدوا.
        - بعد ما ينشّفوها بتتباع للمصانع، وبيطلع منها carrageenan اللي بيدخل في الآيس كريم ومعجون السنان.
        - olahan = منتجات مصنّعة: dodol rumput laut، أو مشروب، أو صابون.
        - harga jual = سعر البيع
        - tengkulak = الوسيط اللي بيشتري من الفلاح رخيص ويبيع غالي.
        الفكرة: لو الفلاحين باعوا olahan بدل الطحالب الخام، الـ harga jual بيبقى أعلى.
        - في الكلام: bikin = membuat، iya = ya.
      ar: |
        إندونيسيا من أكبر منتجي الـ rumput laut (الطحالب البحرية) في العالم.
        - budidaya = استزراع: تُربط قطع الطحالب بحبال في البحر، وتُحصد بعد نحو ٤٥ يومًا.
        - وبعد تجفيفها تُباع للمصانع، ويُستخرج منها الكاراجينان الداخل في المثلّجات ومعجون الأسنان.
        - olahan = منتجات مُصنّعة: dodol rumput laut أو مشروب أو صابون.
        - harga jual = سعر البيع
        - tengkulak = الوسيط الذي يشتري من المزارع رخيصًا ويبيع غاليًا.
        والفكرة: إن باع المزارعون olahan بدل الطحالب الخام ارتفع الـ harga jual.
        - في الكلام اليومي: bikin = membuat، iya = ya.
      en: |
        Indonesia is one of the world's biggest producers of rumput laut (seaweed).
        - budidaya = farming, cultivation: pieces of seaweed are tied to ropes in the sea and harvested after about 45 days.
        - Once dried it's sold to factories, which extract carrageenan for ice cream and toothpaste.
        - olahan = processed products: dodol rumput laut (seaweed sweets), drinks, soap.
        - harga jual = selling price
        - tengkulak = middleman who buys cheap from farmers and sells dear.
        The idea: if farmers sell olahan instead of raw seaweed, the harga jual is higher.
        - In speech: bikin = membuat, iya = ya.
    examples:
      - text: Tengkulak membeli rumput laut kering dengan harga jual yang rendah.
        ar_eg: الوسيط بيشتري الطحالب الناشفة بسعر واطي.
        ar: يشتري الوسيط الطحالب المجفّفة بسعر زهيد.
        en: The middleman buys dried seaweed at a low price.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rumput laut
        ar_eg: طحالب بحرية
        ar: طحالب بحرية
        en: seaweed
      - text: budidaya
        ar_eg: زراعة / تربية
        ar: استزراع
        en: cultivation, farming
      - text: olahan
        ar_eg: منتج مصنّع
        ar: منتج مُصنّع
        en: processed product
      - text: harga jual
        ar_eg: سعر البيع
        ar: سعر البيع
        en: selling price
      - text: tengkulak
        ar_eg: وسيط
        ar: وسيط، سمسار
        en: middleman
    words: [rumput laut, budidaya, olahan, harga jual, tengkulak]
  - id: e02
    type: listen
    text: Rumput laut dipanen sekitar empat puluh lima hari setelah ditanam.
    question:
      ar_eg: الطحالب بتتحصد إمتى؟
      ar: متى تُحصد الطحالب؟
      en: When is the seaweed harvested?
    options:
      - بعد سنة.
      - بعد حوالي ٤٥ يوم.
      - بعد أسبوع.
    answer: 1
    words: [rumput laut]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الـ «tengkulak» بيعمل إيه؟
      ar: ماذا يفعل الـ «tengkulak»؟
      en: What does a "tengkulak" do?
    options:
      - بيزرع الطحالب.
      - بيعلّم الأطفال.
      - بيشتري من الفلاح رخيص ويبيع غالي.
    answer: 2
    words: [tengkulak]
    explain:
      ar_eg: tengkulak = الوسيط اللي بيشتري من الفلاح رخيص ويبيع غالي.
      ar: tengkulak = الوسيط الذي يشتري من المزارع رخيصًا ويبيع غاليًا.
      en: A tengkulak is a middleman buying cheap and selling dear.
  - id: e04
    type: fill_blank
    sentence: Warga kampung belajar ___ rumput laut dari dinas perikanan.
    meaning:
      ar_eg: أهل القرية بيتعلّموا زراعة الطحالب من مصلحة الثروة السمكية.
      ar: يتعلّم أهل القرية استزراع الطحالب من دائرة المصايد.
      en: The villagers are learning seaweed farming from the fisheries office.
    options: [budidaya, tengkulak, olahan]
    answers: [budidaya]
    words: [budidaya]
    explain:
      ar_eg: budidaya rumput laut = زراعة الطحالب البحرية. tengkulak = وسيط وolahan = منتج مصنّع.
      ar: budidaya = استزراع الطحالب. tengkulak وسيط وolahan منتج مصنّع.
      en: budidaya is farming, here seaweed farming.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي الفلاح يرفع سعر البيع؟
      ar: كيف يرفع المزارع سعر البيع؟
      en: How can a farmer raise the selling price?
    options:
      - يبيع منتجات مصنّعة بدل الخام.
      - يبيع كل حاجة للوسيط.
      - يبطّل زراعة.
    answer: 0
    words: [harga jual, olahan]
    explain:
      ar_eg: الفلاح يرفع السعر لما يبيع منتجات مصنّعة (olahan) بدل الخام. البيع للوسيط بيقلل السعر.
      ar: يرفع المزارع السعر ببيع منتجات مصنّعة (olahan) بدل الخام.
      en: Selling processed goods (olahan) raises the price.
  - id: e06
    type: build_sentence
    source:
      ar_eg: سعر البيع نزل الشهر ده.
      ar: انخفض سعر البيع هذا الشهر.
      en: The selling price fell this month.
    answer: Harga jual turun bulan ini.
    distractors: [budidaya, olahan]
    words: [harga jual]
    explain:
      ar_eg: Harga jual (سعر البيع) + turun (نزل) + bulan ini. budidaya وolahan زيادة.
      ar: Harga jual turun bulan ini. budidaya وolahan زائدتان.
      en: Harga jual + turun + bulan ini. budidaya and olahan are extra.
  - id: e07
    type: translate
    direction: from_target
    source_text: Mama-mama membuat dodol dan sabun dari olahan rumput laut.
    answers_meaning:
      ar_eg:
        - الستات بيعملوا حلاوة وصابون من الطحالب المصنّعة.
        - الستات بيصنّعوا حلويات وصابون من الطحالب البحرية.
      ar:
        - تصنع النساء حلوى وصابونًا من الطحالب المُصنّعة.
        - تصنع الأمّهات الحلوى والصابون من منتجات الطحالب.
      en:
        - The women make sweets and soap from processed seaweed.
        - The mothers turn seaweed into sweets and soap.
    words: [olahan, rumput laut]
  - id: e08
    type: speaking
    text: Kami tidak mau menjual ke tengkulak lagi. Harga jualnya terlalu rendah.
    meaning:
      ar_eg: مش عايزين نبيع للوسيط تاني. سعره واطي أوي.
      ar: لا نريد البيع للوسيط بعد اليوم، فسعره زهيد جدًّا.
      en: We don't want to sell to the middleman any more. His price is too low.
    words: [tengkulak, harga jual]
  - id: e09
    type: dictation
    text: Budidaya rumput laut tidak butuh pupuk atau air tawar.
    meaning:
      ar_eg: زراعة الطحالب مش محتاجة سماد ولا مية حلوة.
      ar: لا يحتاج استزراع الطحالب إلى سماد ولا ماء عذب.
      en: Seaweed farming needs no fertiliser or fresh water.
    words: [budidaya, rumput laut]
  - id: e10
    type: speaking
    text: Olahan rumput laut ini kami jual sendiri lewat pemasaran daring.
    meaning:
      ar_eg: منتجات الطحالب دي بنبيعها بنفسنا عن طريق التسويق أونلاين.
      ar: نبيع منتجات الطحالب هذه بأنفسنا عبر التسويق الإلكترونيّ.
      en: We sell these seaweed products ourselves through online marketing.
    words: [olahan, pemasaran daring]
dialogue:
  title: Tali-tali di teluk
  lines:
    - speaker: Mohamed
      text: Mama Ester, tali-tali panjang di laut itu untuk apa?
      ar_eg: يا ماما إستر، الحبال الطويلة اللي في البحر دي ليه؟
      ar: يا ماما إستر، ما فائدة تلك الحبال الطويلة في البحر؟
      en: Mama Ester, what are those long ropes in the sea for?
    - speaker: Mama Ester
      text: Itu budidaya rumput laut. Bulan depan kami panen.
      ar_eg: دي زراعة طحالب. الشهر الجاي هنحصد.
      ar: ذلك استزراع للطحالب، وسنحصد الشهر القادم.
      en: That's seaweed farming. We harvest next month.
    - speaker: Mohamed
      text: Mama jual ke siapa? Ke tengkulak?
      ar_eg: بتبيعي لمين يا ماما؟ للوسيط؟
      ar: لمن تبيعين يا ماما؟ للوسيط؟
      en: Who do you sell to, Mama? A middleman?
    - speaker: Mama Ester
      text: Dulu iya. Sekarang kami bikin olahan sendiri. Harga jualnya tiga kali lipat.
      ar_eg: زمان أيوه. دلوقتي بنصنّع بنفسنا. سعر البيع بقى تلات أضعاف.
      ar: في الماضي نعم، أمّا الآن فنصنع المنتجات بأنفسنا، فتضاعف سعر البيع ثلاث مرّات.
      en: We used to. Now we make our own products. The selling price is three times higher.
