schema: kabar.lesson/v1
id: bipa5.u02.l06
language: id
title: Meninjau lokasi proyek
can_do:
  ar_eg: 'تتكلم في زيارة موقع مشروع: البنية التحتية والسد والخرسانة والأسمنت والهكتارات، والعقبات والتأثير.'
  ar: 'أن تتحدث في زيارة موقع مشروع: البنية التحتية والسدّ والخرسانة والإسمنت والهكتارات، والعوائق والأثر.'
  en: 'Talk on a project-site visit: infrastructure, dams, concrete, cement and hectares, obstacles and impact.'
slides:
  - title: Di lokasi pembangunan
    body:
      ar_eg: |
        infrastruktur = بنية تحتية (طرق، كباري، مية، كهربا)، bendungan = سد.
        beton = خرسانة، semen = أسمنت، hektar = هكتار (= 10,000 متر مربع)، dataran = أرض منبسطة (dataran tinggi = هضبة).
        hambatan = عقبة، berdampak = ليه تأثير: berdampak pada hutan = بيأثر على الغابة.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: banget = sekali، terus = lalu، cuma = hanya.
      ar: |
        infrastruktur = بنية تحتية (طرق وجسور ومياه وكهرباء)، bendungan = سدّ.
        beton = خرسانة، semen = إسمنت، hektar = هكتار (= 10,000 م²)، dataran = أرض منبسطة (dataran tinggi = هضبة).
        hambatan = عائق، berdampak = يؤثّر: berdampak pada hutan = يؤثّر في الغابة.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: banget = sekali، terus = lalu، cuma = hanya.
      en: |
        infrastruktur = infrastructure (roads, bridges, water, power), bendungan = dam.
        beton = concrete, semen = cement, hektar = hectare (10,000 m²), dataran = plain, flat land (dataran tinggi = plateau).
        hambatan = obstacle, berdampak = to have an impact: berdampak pada hutan = affects the forest.
        The dialogue uses street forms; the formal ones are beside them: banget = sekali, terus = lalu, cuma = hanya.
    examples:
      - text: Infrastruktur ibu kota baru dibangun secara bertahap.
        ar_eg: البنية التحتية للعاصمة الجديدة بتتبني على مراحل.
        ar: تُبنى البنية التحتية للعاصمة الجديدة على مراحل.
        en: The new capital's infrastructure is being built in stages.
      - text: Lahan proyek ini luasnya ribuan hektar.
        ar_eg: أرض المشروع ده مساحتها آلاف الهكتارات.
        ar: تبلغ مساحة أرض هذا المشروع آلاف الهكتارات.
        en: This project's land covers thousands of hectares.
      - text: Bendungan itu berdampak pada sungai di hilir.
        ar_eg: السد ده بيأثر على النهر تحت.
        ar: يؤثّر ذلك السدّ في النهر عند المصبّ.
        en: That dam affects the river downstream.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: infrastruktur
        ar_eg: بنية تحتية
        ar: بنية تحتية
        en: infrastructure
      - text: bendungan
        ar_eg: سد
        ar: سدّ
        en: dam
      - text: beton
        ar_eg: خرسانة
        ar: خرسانة
        en: concrete
      - text: semen
        ar_eg: أسمنت
        ar: إسمنت
        en: cement
    words: [infrastruktur, bendungan, beton, semen]
  - id: e02
    type: match_pairs
    pairs:
      - text: hektar
        ar_eg: هكتار
        ar: هكتار
        en: hectare
      - text: dataran
        ar_eg: أرض منبسطة
        ar: سهل
        en: plain, flat land
      - text: hambatan
        ar_eg: عقبة
        ar: عائق
        en: obstacle
      - text: berdampak
        ar_eg: بيأثر
        ar: يؤثّر
        en: to have an impact
    words: [hektar, dataran, hambatan, berdampak]
  - id: e03
    type: listen
    text: Truk itu membawa semen untuk jembatan.
    question:
      ar_eg: العربية شايلة إيه؟
      ar: ماذا تحمل الشاحنة؟
      en: What is the truck carrying?
    options: [أسمنت, رز, بنزين]
    answer: 0
    meaning:
      ar_eg: العربية دي شايلة أسمنت للكوبري.
      ar: تحمل تلك الشاحنة إسمنتًا للجسر.
      en: That truck is carrying cement for the bridge.
    words: [semen]
  - id: e04
    type: fill_blank
    sentence: Jalan baru dan pipa air termasuk ___.
    meaning:
      ar_eg: الطرق الجديدة ومواسير المية من ضمن الـ ___.
      ar: الطرق الجديدة وأنابيب المياه من ___.
      en: New roads and water pipes count as ___.
    options: [infrastruktur, hambatan, dataran]
    answers: [infrastruktur]
    words: [infrastruktur, hambatan, dataran]
    explain:
      ar_eg: الطرق والمواسير = infrastruktur (بنية تحتية). hambatan = عائق وdataran = سهل/أرض مستوية.
      ar: الطرق والأنابيب = infrastruktur (البنية التحتية). أما hambatan فالعائق، وdataran السهل.
      en: Roads and pipes are infrastruktur. hambatan is an obstacle and dataran is a plain.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: المبنى العالي ده معمول من إيه؟ حديد و ___.
      ar: مما صُنع هذا المبنى العالي؟ من الحديد و ___.
      en: What is this tall building made of? Steel and ___.
    options: [hektar, beton, bendungan]
    answer: 1
    explain:
      ar_eg: beton = خرسانة.
      ar: beton = خرسانة.
      en: beton = concrete.
    words: [hektar, beton, bendungan]
  - id: e06
    type: fill_blank
    sentence: Hujan deras menjadi ___ utama pembangunan bulan ini.
    meaning:
      ar_eg: المطر الجامد بقى ال___ الأساسية للبنا الشهر ده.
      ar: صار المطر الغزير ___ البناء الرئيسي هذا الشهر.
      en: Heavy rain became the main ___ to construction this month.
    options: [hambatan, semen, berdampak]
    answers: [hambatan]
    words: [hambatan, semen, berdampak]
    explain:
      ar_eg: المطر عطّل البنا، فهو hambatan (عائق). semen = أسمنت، وberdampak فعل «يأثر» مش اسم بعد menjadi.
      ar: عطّل المطر البناء فهو hambatan (عائق). أما semen فالإسمنت، وberdampak فعل «يؤثّر» لا اسم بعد menjadi.
      en: The rain held up building, so it's a hambatan (obstacle). semen is cement, and berdampak is a verb, not a noun after menjadi.
  - id: e07
    type: multiple_choice
    question: Air untuk kota baru ditampung di sebuah ___ besar.
    options: [dataran, beton, bendungan]
    answer: 2
    explain:
      ar_eg: bendungan = سد بيحجز المية.
      ar: bendungan = سدّ يحجز المياه.
      en: bendungan = a dam that holds water.
    words: [dataran, beton, bendungan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المشروع ده بيأثر على الغابة.
      ar: يؤثّر هذا المشروع في الغابة.
      en: This project affects the forest.
    answer: Proyek ini berdampak pada hutan.
    distractors: [hektar, semen]
    words: [berdampak]
    explain:
      ar_eg: «بيأثر على» = berdampak pada. hektar = فدان/هكتار وsemen = أسمنت، مالهمش مكان.
      ar: «يؤثّر في» = berdampak pada. أما hektar فوحدة مساحة، وsemen الإسمنت، ولا موضع لهما.
      en: "\"Affects\" is berdampak pada. hektar (hectare) and semen (cement) don't belong."
  - id: e09
    type: translate
    direction: from_target
    source_text: Kota itu dibangun di dataran yang luasnya ribuan hektar.
    answers_meaning:
      ar_eg: [المدينة دي اتبنت على أرض منبسطة مساحتها آلاف الهكتارات, المدينة اتبنت في سهل مساحته آلاف الهكتارات]
      ar: [بُنيت تلك المدينة على سهل تبلغ مساحته آلاف الهكتارات, شُيّدت المدينة على أرض منبسطة مساحتها آلاف الهكتارات]
      en: [That city is built on a plain thousands of hectares wide, The city was built on flat land covering thousands of hectares]
    words: [dataran, hektar]
  - id: e10
    type: speaking
    text: Infrastruktur, bendungan, dan jalan beton sedang dibangun.
    meaning:
      ar_eg: البنية التحتية والسد والطرق الخرسانة بتتبني دلوقتي.
      ar: تُبنى الآن البنية التحتية والسدّ والطرق الخرسانية.
      en: The infrastructure, the dam and concrete roads are being built.
    words: [infrastruktur, bendungan, beton]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Ini lokasi proyeknya, Mohamed. Luasnya ribuan hektar.
      ar_eg: ده موقع المشروع يا محمد. مساحته آلاف الهكتارات.
      ar: هذا موقع المشروع يا محمد. مساحته آلاف الهكتارات.
      en: This is the project site, Mohamed. It covers thousands of hectares.
    - speaker: Mohamed
      text: Wah, truk semen sama betonnya banyak banget.
      ar_eg: ياه، عربيات أسمنت وخرسانة كتير أوي.
      ar: يا للعجب، شاحنات إسمنت وخرسانة كثيرة جدًا.
      en: Wow, so many cement and concrete trucks.
    - speaker: Mas Rizal
      text: "Infrastrukturnya dibangun bertahap: jalan dulu, terus air sama listrik."
      ar_eg: 'البنية التحتية بتتبني على مراحل: الطرق الأول، وبعدين المية والكهربا.'
      ar: 'تُبنى البنية التحتية على مراحل: الطرق أولًا ثم الماء والكهرباء.'
      en: 'The infrastructure goes in stages: roads first, then water and power.'
    - speaker: Mohamed
      text: Airnya dari mana?
      ar_eg: المية جاية منين؟
      ar: من أين يأتي الماء؟
      en: Where does the water come from?
    - speaker: Mas Rizal
      text: Dari bendungan di sungai itu. Tapi warga khawatir proyek ini berdampak ke hutan.
      ar_eg: من السد اللي على النهر ده. بس الأهالي قلقانين إن المشروع يأثر على الغابة.
      ar: من السدّ على ذلك النهر. لكن السكان يخشون أن يؤثّر المشروع في الغابة.
      en: From the dam on that river. But residents worry the project affects the forest.
    - speaker: Mohamed
      text: Jadi hambatannya bukan cuma hujan, ya.
      ar_eg: يعني العقبة مش المطر بس.
      ar: إذن ليس المطر وحده هو العائق.
      en: So the obstacle isn't just the rain.
