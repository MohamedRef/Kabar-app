schema: kabar.lesson/v1
id: bipa6.u04.l07
language: id
title: Kapal dagang di Musi
can_do:
  ar_eg: 'تحكي رحلة مركب تجاري قديم: الرسو والملاحة والقراصنة والبضايع.'
  ar: 'أن تروي رحلة سفينة تجارية قديمة: الرسو والملاحة والقراصنة والسلع.'
  en: 'Tell an old trading ship''s voyage: anchoring, navigation, pirates and goods.'
slides:
  - title: Kapal dagang
    body:
      ar_eg: |
        مركب تجاري جاي من الهند لنهر موسي أيام سريويجايا:
        berdagang = يتاجر (من dagang). komoditas = سلعة، بضاعة (من الإنجليزي commodity).
        samudra = محيط (Samudra Hindia = المحيط الهندي). navigasi = ملاحة.
        haluan = مقدمة المركب؛ وكمان اتجاه. berlabuh = يرسى في الميناء. jangkar = مرساة، هلب.
        perompak = قرصان (perompak laut).
        - في الشارع: bayangin = bayangkan (تخيّل)، terus = lalu (وبعدين)، gimana = bagaimana (إزاي).
      ar: |
        سفينة تجارية قادمة من الهند إلى نهر موسي أيام سريويجايا:
        berdagang = يتاجر (من dagang). komoditas = سلعة (من الإنجليزية commodity).
        samudra = محيط (Samudra Hindia = المحيط الهندي). navigasi = ملاحة.
        haluan = مقدّمة السفينة؛ واتجاه أيضًا. berlabuh = ترسو. jangkar = مرساة.
        perompak = قرصان (perompak laut).
        - في كلام الشارع: bayangin = bayangkan (تخيَّل)، terus = lalu (ثمّ)، gimana = bagaimana (كيف).
      en: |
        A trading ship from India sails up the Musi in Srivijaya's day:
        berdagang = to trade (from dagang). komoditas = commodity.
        samudra = ocean (Samudra Hindia = the Indian Ocean). navigasi = navigation.
        haluan = bow of a ship; also course, direction. berlabuh = to anchor, dock. jangkar = anchor.
        perompak = pirate (perompak laut).
        - On the street: bayangin = bayangkan (imagine), terus = lalu (then), gimana = bagaimana (how).
    examples:
      - text: Kapal dari India berlabuh di Sungai Musi.
        ar_eg: مركب من الهند رسي في نهر موسي.
        ar: رست سفينة من الهند في نهر موسي.
        en: A ship from India anchored in the Musi river.
      - text: Mereka berdagang emas, kapur barus, dan rempah.
        ar_eg: كانوا بيتاجروا في الدهب والكافور والتوابل.
        ar: كانوا يتاجرون بالذهب والكافور والتوابل.
        en: They traded gold, camphor and spices.
      - text: Navigasi di samudra lepas memakai bintang.
        ar_eg: الملاحة في المحيط المفتوح كانت بالنجوم.
        ar: كانت الملاحة في المحيط المفتوح بالنجوم.
        en: Navigation on the open ocean used the stars.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: berdagang
        ar_eg: يتاجر
        ar: يتاجر
        en: to trade
      - text: komoditas
        ar_eg: سلعة
        ar: سلعة
        en: commodity
      - text: samudra
        ar_eg: محيط
        ar: محيط
        en: ocean
      - text: navigasi
        ar_eg: ملاحة
        ar: ملاحة
        en: navigation
    words: [berdagang, komoditas, samudra, navigasi]
  - id: e02
    type: match_pairs
    pairs:
      - text: haluan
        ar_eg: مقدمة المركب
        ar: مقدّمة السفينة
        en: bow; course
      - text: berlabuh
        ar_eg: يرسى
        ar: يرسو
        en: to anchor
      - text: jangkar
        ar_eg: هلب، مرساة
        ar: مرساة
        en: anchor
      - text: perompak
        ar_eg: قرصان
        ar: قرصان
        en: pirate
    words: [haluan, berlabuh, jangkar, perompak]
  - id: e03
    type: listen
    text: Perompak menyerang kapal itu di Selat Malaka.
    question:
      ar_eg: مين هجم على المركب؟
      ar: من هاجم السفينة؟
      en: Who attacked the ship?
    options: [قراصنة, تجار, صيادين]
    answer: 0
    meaning:
      ar_eg: قراصنة هجموا على المركب ده في مضيق ملقا.
      ar: هاجم قراصنةٌ تلك السفينة في مضيق ملقا.
      en: Pirates attacked the ship in the Strait of Malacca.
    words: [perompak]
  - id: e04
    type: fill_blank
    sentence: Kapten menurunkan ___ supaya kapal tidak hanyut.
    meaning:
      ar_eg: القبطان نزّل ___ عشان المركب ما يتجرفش.
      ar: أنزل القبطان ___ كي لا تنجرف السفينة.
      en: The captain dropped the ___ so the ship wouldn't drift.
    options: [jangkar, haluan, komoditas]
    answers: [jangkar]
    words: [jangkar, haluan, komoditas]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: المركب بيعمل إيه لما يوصل الميناء ويقف؟
      ar: ماذا تفعل السفينة حين تصل الميناء وتتوقّف؟
      en: What does a ship do when it reaches port and stops?
    options: [berdagang, berlabuh, navigasi]
    answer: 1
    explain:
      ar_eg: berlabuh = يرسى، من labuh.
      ar: berlabuh = ترسو، من labuh.
      en: berlabuh = to anchor, dock, from labuh.
    words: [berlabuh, berdagang, navigasi]
  - id: e06
    type: fill_blank
    sentence: Lada dan emas adalah ___ penting Sriwijaya.
    meaning:
      ar_eg: الفلفل والدهب كانوا ___ مهمة لسريويجايا.
      ar: كان الفلفل والذهب ___ مهمة لسريويجايا.
      en: Pepper and gold were important ___ for Srivijaya.
    options: [komoditas, perompak, samudra]
    answers: [komoditas]
    words: [komoditas, perompak, samudra]
  - id: e07
    type: multiple_choice
    question: Penumpang berdiri di ___ kapal, melihat ke depan.
    options: [jangkar, samudra, haluan]
    answer: 2
    explain:
      ar_eg: مقدمة المركب = haluan، وكمان معناها اتجاه.
      ar: مقدّمة السفينة = haluan، وتعني الاتجاه أيضًا.
      en: The bow = haluan; it also means course, direction.
    words: [haluan, jangkar, samudra]
  - id: e08
    type: build_sentence
    source:
      ar_eg: التجار العرب كانوا بيتاجروا في مضيق ملقا.
      ar: كان التجار العرب يتاجرون في مضيق ملقا.
      en: Arab merchants traded in the Strait of Malacca.
    answer: Pedagang Arab berdagang di Selat Malaka.
    distractors: [berlabuh, navigasi]
    words: [berdagang]
  - id: e09
    type: translate
    direction: from_target
    source_text: Tanpa navigasi yang baik, kapal bisa tersesat di samudra.
    answers_meaning:
      ar_eg: [من غير ملاحة كويسة، المركب ممكن يتوه في المحيط, لو الملاحة مش كويسة المركب يضيع في المحيط]
      ar: [بلا ملاحة جيدة قد تضلّ السفينة في المحيط]
      en: ['Without good navigation, a ship can get lost on the ocean', Without proper navigation a ship may be lost at sea]
    words: [navigasi, samudra]
  - id: e10
    type: speaking
    text: Kapal itu berlabuh, lalu awaknya menurunkan jangkar.
    meaning:
      ar_eg: المركب رسي، وبعدين البحارة نزّلوا الهلب.
      ar: رست السفينة ثم أنزل بحّارتها المرساة.
      en: The ship docked, then the crew dropped anchor.
    words: [berlabuh, jangkar]
dialogue:
  lines:
    - speaker: Kak Dewi
      text: Dulu, tahun 700-an, kapal dari India dan Tiongkok berlabuh di sungai ini.
      ar_eg: زمان، في القرن التامن، مراكب من الهند والصين كانت بترسى في النهر ده.
      ar: في القرن الثامن كانت السفن من الهند والصين ترسو في هذا النهر.
      en: Back in the 700s, ships from India and China anchored in this river.
    - speaker: Mohamed
      text: Mereka berdagang apa?
      ar_eg: كانوا بيتاجروا في إيه؟
      ar: بماذا كانوا يتاجرون؟
      en: What did they trade?
    - speaker: Kak Dewi
      text: 'Komoditas mahal: emas, kapur barus, gading, dan rempah.'
      ar_eg: 'بضايع غالية: دهب وكافور وعاج وتوابل.'
      ar: 'سلعًا غالية: الذهب والكافور والعاج والتوابل.'
      en: 'Pricey goods: gold, camphor, ivory and spices.'
    - speaker: Mohamed
      text: Terus gimana dengan perompak di selat?
      ar_eg: طب والقراصنة اللي في المضيق؟
      ar: وماذا عن القراصنة في المضيق؟
      en: What about pirates in the strait?
    - speaker: Kak Dewi
      text: Sriwijaya menjaga selat supaya kapal dagang aman. Karena itu, kerajaannya kuat.
      ar_eg: سريويجايا كانت بتحرس المضيق عشان المراكب التجارية تبقى في أمان. وعلشان كده مملكتها كانت قوية.
      ar: كانت سريويجايا تحرس المضيق ليأمن التجّار، ولذلك كانت مملكتها قوية.
      en: Srivijaya guarded the strait so trading ships were safe. That's why its kingdom was strong.
