schema: kabar.lesson/v1
id: bipa3.u10.l01
language: id
title: Akan dan nanti
can_do:
  ar_eg: تتكلم عن خططك الجاية (akan، lusa، minggu depan، sebentar lagi).
  ar: أن تتحدث عن خططك القادمة (akan، lusa، minggu depan، sebentar lagi).
  en: Talk about upcoming plans (akan, lusa, minggu depan, sebentar lagi).
slides:
  - title: Akan atau mau?
    body:
      ar_eg: |
        الفعل الإندونيسي ما بيتغيرش، فالمستقبل بييجي من كلمة قبله:
        akan = «هـ / سوف»، أرسم وأكتر في الكتابة. mau = «ناوي / هـ» في الكلام العادي.
        akan قبل الفعل على طول، وما تجمعش الاتنين: مش mau akan.
      ar: |
        لا يتغير الفعل الإندونيسي، ويُفهم المستقبل من أداة قبله:
        akan = السين / سوف، وهي أرسم وأكثر في الكتابة. وmau للنية في الكلام اليومي.
        وتأتي akan قبل الفعل مباشرة، ولا تُجمع مع mau.
      en: |
        Indonesian verbs don't change; the future comes from a word before them:
        akan = will, more formal, common in writing. mau = going to, everyday speech.
        akan goes right before the verb, and never together with mau.
    grammar: id.time.future-plans
    examples:
      - text: Kami akan berangkat ke Sumbawa lusa.
        ar_eg: إحنا هنسافر سومباوا بعد بكرة.
        ar: سنسافر إلى سومباوا بعد غد.
        en: We will leave for Sumbawa the day after tomorrow.
      - text: Aku mau naik feri besok.
        ar_eg: أنا ناوي أركب العبّارة بكرة.
        ar: سأركب العبّارة غدًا.
        en: I'm going to take the ferry tomorrow.
  - title: Nanti, sebentar lagi, minggu depan
    body:
      ar_eg: |
        nanti = بعدين (والعكس tadi = من شوية): nanti malam = النهارده بالليل.
        sebentar lagi = كمان شوية. lusa = بعد بكرة. minggu depan = الأسبوع الجاي (وكمان bulan depan، tahun depan).
      ar: |
        nanti = لاحقًا (وضدها tadi = منذ قليل): nanti malam = الليلة.
        sebentar lagi = بعد قليل، lusa = بعد غد، minggu depan = الأسبوع القادم (وكذلك bulan depan، tahun depan).
      en: |
        nanti = later (opposite: tadi = earlier): nanti malam = tonight.
        sebentar lagi = soon, in a moment. lusa = the day after tomorrow. minggu depan = next week (also bulan depan, tahun depan).
    grammar: id.time.future-plans
    examples:
      - text: Sebentar lagi kapal feri akan berangkat.
        ar_eg: كمان شوية العبّارة هتمشي.
        ar: ستبحر العبّارة بعد قليل.
        en: The ferry will leave in a moment.
      - text: Nanti malam kita makan sate, yuk!
        ar_eg: يلا ناكل ساتيه النهارده بالليل!
        ar: هيا نأكل الساتيه الليلة!
        en: Let's have satay tonight!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: lusa
        ar_eg: بعد بكرة
        ar: بعد غد
        en: the day after tomorrow
      - text: minggu depan
        ar_eg: الأسبوع الجاي
        ar: الأسبوع القادم
        en: next week
      - text: sebentar lagi
        ar_eg: كمان شوية
        ar: بعد قليل
        en: soon, in a moment
      - text: berangkat
        ar_eg: يمشي / يسافر (يطلع)
        ar: ينطلق / يغادر
        en: to depart, to set off
      - text: feri
        ar_eg: عبّارة
        ar: عبّارة
        en: ferry
    words: [lusa, minggu depan, sebentar lagi, berangkat, feri]
  - id: e02
    type: multiple_choice
    question: Hari ini hari Senin. ___ hari Rabu.
    options: [Besok, Lusa, Kemarin]
    answer: 1
    explain:
      ar_eg: الاتنين ← الأربع بعد يومين، يعني lusa (بعد بكرة).
      ar: من الاثنين إلى الأربعاء يومان، أي lusa (بعد غد).
      en: Monday to Wednesday is two days, so lusa (the day after tomorrow).
    words: [lusa]
  - id: e03
    type: listen
    text: Sebentar lagi kapal feri akan berangkat.
    options:
      - Sebentar lagi kapal feri akan datang.
      - Tadi kapal feri sudah berangkat.
      - Sebentar lagi kapal feri akan berangkat.
    answer: 2
    meaning:
      ar_eg: كمان شوية العبّارة هتمشي.
      ar: ستبحر العبّارة بعد قليل.
      en: The ferry will leave in a moment.
    words: [sebentar lagi, feri, berangkat]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options:
      - Saya akan pergi ke Sumbawa minggu depan.
      - Saya pergi akan ke Sumbawa minggu depan.
      - Saya mau akan pergi ke Sumbawa minggu depan.
    answer: 0
    explain:
      ar_eg: akan قبل الفعل على طول، ومن غير mau.
      ar: تأتي akan قبل الفعل مباشرة وبلا mau.
      en: akan goes right before the verb, without mau.
    words: [minggu depan]
  - id: e05
    type: fill_blank
    sentence: Feri ke Sumbawa ___ jam dua siang.
    meaning:
      ar_eg: العبّارة لسومباوا بتطلع الساعة اتنين الضهر.
      ar: تغادر العبّارة إلى سومباوا في الثانية ظهرًا.
      en: The ferry to Sumbawa leaves at two in the afternoon.
    options: [lusa, berangkat, tadi]
    answers: [berangkat]
    words: [berangkat, feri]
  - id: e06
    type: build_sentence
    source:
      ar_eg: هنروح سومباوا الأسبوع الجاي.
      ar: سنذهب إلى سومباوا الأسبوع القادم.
      en: We will go to Sumbawa next week.
    answer: Kami akan ke Sumbawa minggu depan.
    alternatives:
      - Minggu depan kami akan ke Sumbawa.
    distractors: [tadi, kemarin]
    words: [minggu depan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: العبّارة هتمشي كمان شوية.
      ar: ستغادر العبّارة بعد قليل.
      en: The ferry will leave soon.
    answers:
      - Sebentar lagi feri akan berangkat.
      - Sebentar lagi feri akan berangkat
      - Feri akan berangkat sebentar lagi.
      - Feri akan berangkat sebentar lagi
      - Sebentar lagi kapal feri akan berangkat.
      - Kapal feri akan berangkat sebentar lagi.
      - Sebentar lagi feri berangkat.
      - Feri berangkat sebentar lagi.
      - Feri akan segera berangkat.
      - Kapal feri akan segera berangkat.
    words: [sebentar lagi, feri, berangkat]
  - id: e08
    type: speaking
    text: Insya Allah, kami akan berangkat lusa.
    meaning:
      ar_eg: إن شاء الله هنسافر بعد بكرة.
      ar: إن شاء الله سنسافر بعد غد.
      en: God willing, we'll set off the day after tomorrow.
    words: [lusa, berangkat]
dialogue:
  title: Di Pelabuhan Kayangan
  lines:
    - speaker: Mohamed
      text: Mas Rizal, kapan kita ke Sumbawa?
      ar_eg: يا ماس ريزال، هنروح سومباوا إمتى؟
      ar: يا ماس ريزال، متى نذهب إلى سومباوا؟
      en: Mas Rizal, when are we going to Sumbawa?
    - speaker: Mas Rizal
      text: Lusa, insya Allah. Hari ini kita lihat pelabuhan dulu.
      ar_eg: بعد بكرة إن شاء الله. النهارده نتفرج على الميناء الأول.
      ar: بعد غد إن شاء الله. اليوم نتفرّج على الميناء أولًا.
      en: The day after tomorrow, God willing. Today we'll just look at the port.
    - speaker: Mohamed
      text: Feri ke Sumbawa berangkat dari sini?
      ar_eg: العبّارة لسومباوا بتطلع من هنا؟
      ar: هل تغادر العبّارة إلى سومباوا من هنا؟
      en: Does the ferry to Sumbawa leave from here?
    - speaker: Mas Rizal
      text: Ya. Lihat, sebentar lagi feri itu akan berangkat.
      ar_eg: أيوه. بص، العبّارة دي هتمشي كمان شوية.
      ar: نعم. انظر، ستغادر تلك العبّارة بعد قليل.
      en: Yes. Look, that ferry is about to leave.
    - speaker: Mohamed
      text: Nanti malam kita makan ikan bakar, yuk!
      ar_eg: يلا ناكل سمك مشوي النهارده بالليل!
      ar: هيا نأكل السمك المشوي الليلة!
      en: Let's have grilled fish tonight!
