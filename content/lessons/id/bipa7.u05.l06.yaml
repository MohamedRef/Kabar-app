schema: kabar.lesson/v1
id: bipa7.u05.l06
language: id
title: Pahlawan perempuan
can_do:
  ar_eg: تحكي قصة بطلة قومية زي مارثا كريستينا تياهاهو.
  ar: أن تروي قصّة بطلة وطنية مثل مارثا كريستينا تياهاهو.
  en: Tell the story of a national heroine such as Martha Christina Tiahahu.
slides:
  - title: Gadis tujuh belas tahun dari Nusa Laut
    body:
      ar_eg: |
        مارثا كريستينا تياهاهو بنت من جزيرة نوسا لاوت في مالوكو.
        - سنة ١٨١٧، وهي عندها ١٧ سنة بس، berperang (حاربت) جنب أبوها وجنب البطل باتيمورا ضد الهولنديين.
        - الكل افتكر keberanian (شجاعتها): كانت بتشجّع الستات يحاربوا كمان.
        - اتمسكت واتحطّت على مركب رايحة جاوة. رفضت الأكل والدوا، وgugur (ماتت شهيدة) في ٢ يناير ١٨١٨، ورموا جثمانها في بحر باندا.
        - سنة ١٩٦٩ بقت pahlawan nasional (بطلة قومية).
        هي واحدة من tokoh perempuan (الشخصيات النسائية) زي تشوت نياك ديين من آتشيه وكارتيني من جاوة.
      ar: |
        مارثا كريستينا تياهاهو فتاة من جزيرة نوسا لاوت في مالوكو.
        - في سنة ١٨١٧، وهي في السابعة عشرة، berperang (قاتلت) إلى جانب أبيها والبطل باتيمورا ضدّ الهولنديين.
        - واشتهرت بـ keberanian (شجاعتها)، فقد كانت تحثّ النساء على القتال أيضًا.
        - ثمّ أُسرت وحُملت على سفينة إلى جاوة، فرفضت الطعام والدواء حتى gugur (استُشهدت) في ٢ يناير ١٨١٨، وأُلقي جثمانها في بحر باندا.
        - وفي ١٩٦٩ صارت pahlawan nasional (بطلة وطنية).
        وهي من tokoh perempuan (الأعلام النسائية) مثل تشوت نياك ديين من آتشيه وكارتيني من جاوة.
      en: |
        Martha Christina Tiahahu was a girl from Nusa Laut island in Maluku.
        - In 1817, aged only 17, she berperang (fought) beside her father and the hero Pattimura against the Dutch.
        - Everyone remembered her keberanian (courage): she urged women to fight too.
        - She was captured and put on a ship to Java. She refused food and medicine, and gugur (fell) on 2 January 1818; her body was committed to the Banda Sea.
        - In 1969 she became a pahlawan nasional (national hero).
        She stands among the tokoh perempuan (women figures) such as Cut Nyak Dhien of Aceh and Kartini of Java.
    examples:
      - text: Martha Christina Tiahahu gugur pada usia tujuh belas tahun.
        ar_eg: مارثا كريستينا تياهاهو استشهدت وهي عندها سبعتاشر سنة.
        ar: استُشهدت مارثا كريستينا تياهاهو في السابعة عشرة.
        en: Martha Christina Tiahahu fell at the age of seventeen.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pahlawan nasional
        ar_eg: بطل قومي
        ar: بطل وطنيّ
        en: national hero
      - text: gugur
        ar_eg: مات شهيد
        ar: استُشهد
        en: to fall (die for one's country)
      - text: keberanian
        ar_eg: شجاعة
        ar: شجاعة
        en: courage
      - text: tokoh perempuan
        ar_eg: شخصية نسائية
        ar: علَم نسائيّ
        en: woman figure
      - text: berperang
        ar_eg: يحارب
        ar: يقاتل
        en: to fight a war
    words: [pahlawan nasional, gugur, keberanian, tokoh perempuan, berperang]
  - id: e02
    type: listen
    text: Pada usia tujuh belas tahun, Martha ikut berperang bersama ayahnya.
    question:
      ar_eg: مارثا عملت إيه وهي عندها ١٧ سنة؟
      ar: ماذا فعلت مارثا في السابعة عشرة؟
      en: What did Martha do at seventeen?
    options:
      - سافرت هولندا تدرس.
      - اتجوّزت.
      - حاربت جنب أبوها.
    answer: 2
    words: [berperang]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «gugur» بتتقال على مين؟
      ar: على من تُقال «gugur»؟
      en: Who is "gugur" said of?
    options:
      - اللي مات وهو بيدافع عن بلده.
      - اللي نجح في الامتحان.
      - اللي سافر بعيد.
    answer: 0
    explain:
      ar_eg: gugur أصلها «ورق الشجر يقع»، وبتتقال باحترام على اللي مات في سبيل الوطن.
      ar: أصل gugur سقوط الورق، وتُقال إجلالًا لمن مات في سبيل الوطن.
      en: gugur literally means leaves falling; it's said with respect of those who die for their country.
    words: [gugur]
  - id: e04
    type: fill_blank
    sentence: Semua orang Maluku mengingat ___ gadis muda itu.
    meaning:
      ar_eg: كل أهل مالوكو فاكرين شجاعة البنت الصغيرة دي.
      ar: يذكر أهل مالوكو جميعًا شجاعة تلك الفتاة الشابّة.
      en: All of Maluku remembers that young girl's courage.
    options: [keberanian, perlawanan, julukan]
    answers: [keberanian]
    words: [keberanian]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مارثا بقت بطلة قومية سنة كام؟
      ar: في أيّ سنة صارت مارثا بطلة وطنية؟
      en: In which year did Martha become a national hero?
    options: ['1817', '1969', '1945']
    answer: 1
    words: [pahlawan nasional]
  - id: e06
    type: build_sentence
    source:
      ar_eg: كارتيني شخصية نسائية مهمّة.
      ar: كارتيني علَم نسائيّ مهمّ.
      en: Kartini is an important woman figure.
    answer: Kartini adalah tokoh perempuan yang penting.
    distractors: [gugur, berperang]
    words: [tokoh perempuan]
  - id: e07
    type: translate
    direction: from_target
    source_text: Banyak tokoh perempuan Indonesia menjadi pahlawan nasional karena keberanian mereka.
    answers_meaning:
      ar_eg:
        - شخصيات نسائية إندونيسية كتير بقوا أبطال قوميين بسبب شجاعتهم.
        - ستات كتير من إندونيسيا بقوا أبطال قوميين علشان شجاعتهم.
      ar:
        - صارت أعلام نسائية إندونيسية كثيرة بطلات وطنيات بفضل شجاعتهنّ.
        - نالت نساء إندونيسيات كثيرات لقب البطولة الوطنية لشجاعتهنّ.
      en:
        - Many Indonesian women figures became national heroes because of their courage.
        - Many Indonesian women were named national heroes for their bravery.
    words: [tokoh perempuan, pahlawan nasional, keberanian]
  - id: e08
    type: speaking
    text: Dia gugur di atas kapal dan dimakamkan di Laut Banda.
    meaning:
      ar_eg: استشهدت على المركب واندفنت في بحر باندا.
      ar: استُشهدت على متن السفينة ووُوريت في بحر باندا.
      en: She fell aboard the ship and was laid to rest in the Banda Sea.
    words: [gugur]
  - id: e09
    type: dictation
    text: Cut Nyak Dhien juga berperang melawan Belanda di Aceh.
    meaning:
      ar_eg: تشوت نياك ديين كمان حاربت الهولنديين في آتشيه.
      ar: قاتلت تشوت نياك ديين الهولنديين في آتشيه أيضًا.
      en: Cut Nyak Dhien also fought the Dutch in Aceh.
    words: [berperang, tokoh perempuan]
  - id: e10
    type: speaking
    text: Setiap tanggal dua Januari, orang Maluku mengenang pahlawan nasional ini.
    meaning:
      ar_eg: كل ٢ يناير، أهل مالوكو بيفتكروا البطلة القومية دي.
      ar: في الثاني من يناير من كلّ عام يُحيي أهل مالوكو ذكرى هذه البطلة.
      en: Every 2 January, the people of Maluku remember this national hero.
    words: [pahlawan nasional, keberanian]
dialogue:
  title: Gambar di buku sejarah
  lines:
    - speaker: Pak Hasan
      text: Coba lihat gambar di buku sejarah ini. Siapa perempuan berikat kepala merah itu?
      ar_eg: بص على الصورة دي في كتاب التاريخ. مين الست اللي لابسة رباط أحمر على راسها دي؟
      ar: انظر إلى هذه الصورة في كتاب التاريخ. من تلك المرأة ذات العصابة الحمراء؟
      en: Have a look at this picture in the history book. Who's the woman with the red headband?
    - speaker: Mohamed
      text: Saya tidak tahu, Pak. Apakah dia tokoh perempuan dari Jawa?
      ar_eg: مش عارف يا أستاذ. هي شخصية نسائية من جاوة؟
      ar: لا أعرف يا أستاذ. أهي علَم نسائيّ من جاوة؟
      en: I don't know, sir. Is she a woman figure from Java?
    - speaker: Pak Hasan
      text: Bukan. Itu pahlawan nasional dari Maluku, Martha Christina Tiahahu. Dia berperang waktu masih remaja.
      ar_eg: لأ. دي بطلة قومية من مالوكو، مارثا كريستينا تياهاهو. حاربت وهي لسه مراهقة.
      ar: لا، تلك بطلة وطنية من مالوكو، مارثا كريستينا تياهاهو، قاتلت وهي ما تزال مراهقة.
      en: No. That's a national hero from Maluku, Martha Christina Tiahahu. She fought while still a teenager.
    - speaker: Mohamed
      text: Masih remaja! Keberaniannya luar biasa.
      ar_eg: لسه مراهقة! شجاعتها مش طبيعية.
      ar: ما تزال مراهقة! شجاعتها مذهلة.
      en: Still a teenager! Her courage is extraordinary.
