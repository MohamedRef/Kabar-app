language: id
title: Ulangan Unit 5
can_do:
  ar_eg: تكتب تاريخ متماسك من غير تكرار وتربط المحطات ببعض.
  ar: أن تكتب تاريخًا متماسكًا بلا تكرار وتربط محطّاته.
  en: Write a cohesive history without repetition, linking each milestone.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kohesi
        ar_eg: تماسك النص
        ar: التماسك
        en: cohesion
      - text: pengakuan
        ar_eg: اعتراف
        ar: اعتراف
        en: recognition
      - text: reformasi
        ar_eg: إصلاح
        ar: إصلاح
        en: reform
      - text: penjajahan
        ar_eg: استعمار
        ar: استعمار
        en: colonial rule
      - text: linimasa
        ar_eg: خط زمني
        ar: خطّ زمني
        en: timeline
    words: [kohesi, pengakuan, reformasi, penjajahan, linimasa]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي راح القاهرة سنة 1947 ومضى معاهدة الصداقة؟
      ar: من ذهب إلى القاهرة عام 1947 ووقّع معاهدة الصداقة؟
      en: Who went to Cairo in 1947 and signed the friendship treaty?
    options:
      - مبعوث الجامعة العربية.
      - وفد بقيادة الحاج أجوس سالم.
      - طلبة جامعة تريساكتي.
    answer: 1
    words: [delegasi, utusan, Liga Arab]
  - id: e03
    type: fill_blank
    sentence: Sukarno menjadi presiden, Hatta wakil presiden. Kata "menjadi" dihilangkan karena ___.
    meaning:
      ar_eg: سوكارنو بقى رئيس، وهاتا نائب رئيس. كلمة «menjadi» اتشالت بسبب الحذف.
      ar: صار سوكارنو رئيسًا، وهاتا نائبًا له، وحُذفت «menjadi» بالحذف.
      en: Sukarno became president, Hatta vice-president. "Menjadi" is dropped because of ellipsis.
    options: [pelesapan, substitusi, tuntutan]
    answers: [pelesapan]
    words: [pelesapan, substitusi, tuntutan]
  - id: e04
    type: listen
    text: Mesir termasuk negara pertama yang mengakui kemerdekaan Indonesia.
    question:
      ar_eg: الجملة دي بتقول إيه عن مصر؟
      ar: ماذا تقول الجملة عن مصر؟
      en: What does the sentence say about Egypt?
    options:
      - إنها من أوائل الدول اللي اعترفت باستقلال إندونيسيا.
      - إنها استعمرت إندونيسيا.
      - إنها رفضت تعترف.
    answer: 0
    words: [mengakui]
  - id: e05
    type: build_sentence
    source:
      ar_eg: كل فترة ليها حكومتها.
      ar: لكلّ فترة حكومتها.
      en: Each period has its own government.
    answer: Masing-masing periode punya pemerintahannya sendiri.
    distractors: [era, tersebut]
    words: [masing-masing, periode, pemerintahan]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي خلّى الطلبة يتظاهروا سنة 1998؟
      ar: ما الذي دفع الطلّاب إلى التظاهر عام 1998؟
      en: What drove the students to protest in 1998?
    options:
      - إعلان الاستقلال.
      - الاحتلال الياباني.
      - الأزمة المالية ومطلب الإصلاح.
    answer: 2
    words: [krisis moneter, demonstrasi]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الرئيس تنحّى بعد مظاهرات كبيرة.
      ar: تنحّى الرئيس بعد مظاهرات كبرى.
      en: The president stepped down after mass demonstrations.
    answers:
      - Presiden mundur setelah demonstrasi besar.
      - Presiden itu mundur setelah demonstrasi besar.
      - Presiden mundur setelah demonstrasi besar-besaran.
      - Setelah demonstrasi besar, presiden mundur.
    words: [mundur, demonstrasi]
  - id: e08
    type: speaking
    text: Proklamasi 1945 dan Reformasi 1998 adalah dua tonggak sejarah.
    meaning:
      ar_eg: إعلان 1945 وإصلاح 1998 علامتين فارقتين في التاريخ.
      ar: إعلان 1945 وإصلاح 1998 معلمان تاريخيان فارقان.
      en: The 1945 proclamation and the 1998 Reformasi are two historic milestones.
    words: [proklamasi, tonggak sejarah]
  - id: e09
    type: dictation
    text: Era Orde Baru tersebut berlangsung lebih dari tiga puluh tahun.
    meaning:
      ar_eg: عصر النظام الجديد ده استمر أكتر من تلاتين سنة.
      ar: دام عهد النظام الجديد المذكور أكثر من ثلاثين عامًا.
      en: That New Order era lasted more than thirty years.
    words: [era, Orde Baru, tersebut]
  - id: e10
    type: translate
    direction: from_target
    source_text: Pengakuan Mesir dan Liga Arab membuka jalan bagi diplomasi Indonesia.
    answers_meaning:
      ar_eg:
        - اعتراف مصر والجامعة العربية فتح الطريق للدبلوماسية الإندونيسية.
        - اعتراف مصر والجامعة العربية مهّد للدبلوماسية الإندونيسية.
      ar:
        - فتح اعتراف مصر والجامعة العربية الطريق أمام الدبلوماسية الإندونيسية.
        - مهّد اعتراف مصر والجامعة العربية لانطلاق الدبلوماسية الإندونيسية.
      en:
        - Recognition from Egypt and the Arab League opened the way for Indonesian diplomacy.
        - Egypt's and the Arab League's recognition paved the way for Indonesia's diplomacy.
    words: [pengakuan, Liga Arab]
dialogue:
  title: Di puncak Wayag
  lines:
    - speaker: Pak Hasan
      text: Dari sini kita melihat ratusan pulau karst. Indah, bukan?
      ar_eg: من هنا بنشوف مئات الجزر الجيرية. حلوة، مش كده؟
      ar: من هنا نرى مئات الجزر الكلسية. جميلة، أليس كذلك؟
      en: From here we see hundreds of karst islands. Beautiful, isn't it?
    - speaker: Mohamed
      text: Indah sekali. Seperti linimasa, setiap pulau punya ceritanya sendiri.
      ar_eg: حلوة قوي. زي الخط الزمني، كل جزيرة ليها حكايتها.
      ar: جميلة جدًّا. وكالخطّ الزمني، لكلّ جزيرة حكايتها.
      en: Very. Like a timeline, every island has its own story.
    - speaker: Pak Hasan
      text: Kamu sudah jadi sejarawan kecil. Ke mana kamu sesudah ini?
      ar_eg: إنت بقيت مؤرّخ صغير. رايح فين بعد كده؟
      ar: صرتَ مؤرّخًا صغيرًا. إلى أين بعد هذا؟
      en: You've become a little historian. Where to after this?
    - speaker: Mohamed
      text: Ke Misool. Saya mau belajar tentang media sosial dan hoaks.
      ar_eg: على ميسول. عايز أتعلّم عن السوشيال ميديا والأخبار الكدب.
      ar: إلى ميسول، أريد أن أتعلّم عن وسائل التواصل والأخبار الكاذبة.
      en: To Misool. I want to learn about social media and hoaxes.
souvenir:
  id: bipa7.u05.souvenir
  title: Pulau-pulau karst Wayag
  note:
    ar_eg: وايّاج مجموعة جزر جيرية (karst) في شمال راجا أمبات، شكلها زي قِباب خضرا طالعة من مية فيروزي، وغالبًا مفيهاش سكان. ومن فوق التل بتتشاف واحدة من أشهر المناظر في إندونيسيا. وبمناسبة الوحدة دي، تاريخ إندونيسيا بيمشي من محطات تجارة الشركة الهولندية (VOC) لاستقلال 1945 لإصلاح 1998. ومصر من أوائل الدول اللي اعترفت بإندونيسيا، بحكم الأمر الواقع سنة 1946 على حسب مصادر إندونيسية كتير، وبمعاهدة صداقة اتمضت في القاهرة سنة 1947.
    ar: وايّاغ مجموعة جزر كلسية (karst) في شمال راجا أمبات، تبدو كقِباب خضراء تنبثق من ماء فيروزي، وهي غير مأهولة في الغالب، ومن أعلى تلّها يُرى أحد أشهر المشاهد في إندونيسيا. ويمتدّ تاريخ إندونيسيا من مراكز تجارة الشركة الهولندية (VOC) إلى استقلال 1945 فإصلاح 1998. وكانت مصر من أوائل الدول المعترفة بإندونيسيا، اعترافًا واقعيًّا عام 1946 بحسب مصادر إندونيسية كثيرة، ثمّ بمعاهدة صداقة وُقّعت في القاهرة عام 1947.
    en: Wayag is a cluster of karst islands in northern Raja Ampat, green domes rising from turquoise water, mostly uninhabited; the view from its summit is one of Indonesia's most famous. Indonesia's history runs from the VOC trading posts to independence in 1945 and Reformasi in 1998. Egypt was among the first countries to recognise Indonesia, de facto in 1946 according to many Indonesian sources, then through a friendship treaty signed in Cairo in 1947.
