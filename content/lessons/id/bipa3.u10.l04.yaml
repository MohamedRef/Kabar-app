schema: kabar.lesson/v1
id: bipa3.u10.l04
language: id
title: Mendarat di Lombok
can_do:
  ar_eg: 'تخطط لرحلة: تحجز، تأجر عربية، تختار الطريق، وتتكلم عن الوصول والسياحة.'
  ar: 'أن تخطط لرحلة: تحجز وتستأجر سيارة وتختار الطريق وتتحدث عن الوصول والسياحة.'
  en: 'Plan a trip: book, rent a car, choose a route, and talk about arrivals and tourism.'
slides:
  - title: Di bandara
    body:
      ar_eg: |
        pilot = طيار. mendarat = تنزل (الطيارة على الأرض). kedatangan = وصول (من datang).
        rute = طريق، خط سير. memesan = يحجز، يطلب. menyewa = يأجّر (ياخد بالإيجار).
        wisata = سياحة (tempat wisata = مكان سياحي). mewah = فخم، لوكس.
      ar: |
        pilot = طيّار. mendarat = تهبط (الطائرة). kedatangan = وصول (من datang).
        rute = طريق، مسار. memesan = يحجز، يطلب. menyewa = يستأجر.
        wisata = سياحة (tempat wisata = مكان سياحي). mewah = فاخر.
      en: |
        pilot = pilot. mendarat = land (of a plane). kedatangan = arrival (from datang).
        rute = route. memesan = book, order. menyewa = rent, hire.
        wisata = tourism, sightseeing (tempat wisata = tourist spot). mewah = luxurious.
    examples:
      - text: Pesawat kami mendarat di Lombok jam sepuluh.
        ar_eg: طيارتنا نزلت في لومبوك الساعة عشرة.
        ar: هبطت طائرتنا في لومبوك في العاشرة.
        en: Our plane landed in Lombok at ten.
      - text: Saya sudah memesan kamar dan menyewa motor.
        ar_eg: أنا حجزت أوضة وأجّرت موتوسيكل.
        ar: حجزت غرفة واستأجرت دراجة نارية.
        en: I've booked a room and rented a motorbike.
      - text: Hotel itu mewah, tapi mahal sekali.
        ar_eg: الفندق ده فخم، بس غالي أوي.
        ar: ذلك الفندق فاخر لكنه غالٍ جدًا.
        en: That hotel is luxurious, but very expensive.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pilot
        ar_eg: طيار
        ar: طيّار
        en: pilot
      - text: mendarat
        ar_eg: تنزل (طيارة)
        ar: تهبط
        en: land
      - text: kedatangan
        ar_eg: وصول
        ar: وصول
        en: arrival
      - text: rute
        ar_eg: طريق، خط سير
        ar: مسار
        en: route
    words: [pilot, mendarat, kedatangan, rute]
  - id: e02
    type: match_pairs
    pairs:
      - text: memesan
        ar_eg: يحجز
        ar: يحجز
        en: book
      - text: menyewa
        ar_eg: يأجّر
        ar: يستأجر
