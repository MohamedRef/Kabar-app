schema: kabar.lesson/v1
id: bipa3.u10.l04
language: id
title: Mendarat di Lombok
can_do:
  ar_eg: 'تخطط لرحلة: تحجز، تأجر عربية، تختار الطريق والمكان، وتستمتع بالأماكن السياحية.'
  ar: 'أن تخطط لرحلة: تحجز وتستأجر سيارة وتختار الطريق والموقع، وتستمتع بالأماكن السياحية.'
  en: 'Plan a trip: book, rent a car, pick a route and a location, and enjoy the sights.'
slides:
  - title: Di bandara
    body:
      ar_eg: |
        internasional = دولي (bandara internasional = مطار دولي). lokasi = مكان، موقع.
        rute = طريق، خط سير. memesan = يحجز، يطلب. menyewa = يأجّر (ياخد بالإيجار).
        wisata = سياحة (tempat wisata = مكان سياحي). menikmati = يستمتع بـ. khusus = مخصوص، خاص.
      ar: |
        internasional = دولي (bandara internasional = مطار دولي). lokasi = موقع، مكان.
        rute = طريق، مسار. memesan = يحجز، يطلب. menyewa = يستأجر.
        wisata = سياحة (tempat wisata = مكان سياحي). menikmati = يستمتع بـ. khusus = خاص، مخصّص.
      en: |
        internasional = international (bandara internasional = international airport). lokasi = location.
        rute = route. memesan = book, order. menyewa = rent, hire.
        wisata = tourism, sightseeing (tempat wisata = tourist spot). menikmati = enjoy. khusus = special, specific.
    examples:
      - text: Pesawat kami mendarat di Bandara Internasional Lombok.
        ar_eg: طيارتنا نزلت في مطار لومبوك الدولي.
        ar: هبطت طائرتنا في مطار لومبوك الدولي.
        en: Our plane landed at Lombok International Airport.
      - text: Saya sudah memesan kamar dan menyewa motor.
        ar_eg: أنا حجزت أوضة وأجّرت موتوسيكل.
        ar: حجزت غرفة واستأجرت دراجة نارية.
        en: I've booked a room and rented a motorbike.
      - text: Kami menikmati matahari terbenam di pantai.
        ar_eg: استمتعنا بالغروب على الشط.
        ar: استمتعنا بغروب الشمس على الشاطئ.
        en: We enjoyed the sunset on the beach.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: internasional
        ar_eg: دولي
        ar: دولي
        en: international
      - text: lokasi
        ar_eg: مكان، موقع
        ar: موقع
        en: location
      - text: rute
        ar_eg: طريق، خط سير
        ar: مسار
        en: route
      - text: khusus
        ar_eg: مخصوص
        ar: خاص
        en: special
    words: [internasional, lokasi, rute, khusus]
  - id: e02
    type: match_pairs
    pairs:
      - text: memesan
        ar_eg: يحجز
        ar: يحجز
        en: book
      - text: menyewa
        ar_eg: يأجّر
        ar: يستأجر
        en: rent
      - text: wisata
        ar_eg: سياحة
        ar: سياحة
        en: tourism
      - text: menikmati
        ar_eg: يستمتع بـ
        ar: يستمتع بـ
        en: enjoy
    words: [memesan, menyewa, wisata, menikmati]
  - id: e03
    type: listen
    text: Lokasi hotelnya bagus, dekat pantai dan pasar.
    question:
      ar_eg: الفندق فين؟
      ar: أين الفندق؟
      en: Where is the hotel?
    options: [بعيد عن كل حاجة, قريب من البحر والسوق, جنب المطار]
    answer: 1
    meaning:
      ar_eg: مكان الفندق حلو، قريب من البحر والسوق.
      ar: موقع الفندق جيد، قريب من الشاطئ والسوق.
      en: The hotel's location is good, near the beach and the market.
    words: [lokasi]
  - id: e04
    type: fill_blank
    sentence: Kami mau ___ mobil untuk tiga hari.
    meaning:
      ar_eg: عايزين ___ عربية تلات أيام.
      ar: نريد أن ___ سيارة لثلاثة أيام.
      en: We want to ___ a car for three days.
    options: [menyewa, internasional, khusus]
    answers: [menyewa]
    words: [menyewa, internasional, khusus]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الطيارات اللي جاية من بلاد تانية بتنزل في مطار …؟
      ar: الطائرات القادمة من دول أخرى تهبط في مطار …؟
      en: Planes from other countries land at an … airport?
    options: [internasional, rute, wisata]
    answer: 0
    explain:
      ar_eg: bandara internasional = مطار دولي.
      ar: bandara internasional = مطار دولي.
      en: bandara internasional = international airport.
    words: [internasional, rute, wisata]
  - id: e06
    type: fill_blank
    sentence: 'Lombok punya banyak tempat ___: pantai, gunung, dan air terjun.'
    meaning:
      ar_eg: 'لومبوك فيها أماكن ___ كتير: شطوط وجبال وشلالات.'
      ar: 'في لومبوك أماكن ___ كثيرة: شواطئ وجبال وشلالات.'
      en: 'Lombok has lots of ___ spots: beaches, mountains and waterfalls.'
    options: [lokasi, wisata, memesan]
    answers: [wisata]
    words: [wisata, lokasi, memesan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: حجزت تذكرة طيارة لجاكرتا.
      ar: حجزت تذكرة طائرة إلى جاكرتا.
      en: I booked a plane ticket to Jakarta.
    answer: Saya memesan tiket pesawat ke Jakarta.
    distractors: [menyewa, rute]
    words: [memesan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Rute ini lebih cepat ke Senggigi.
    answers_meaning:
      ar_eg: [الطريق ده أسرع لسنجيجي, الخط ده أسرع لحد سنجيجي]
      ar: [هذا الطريق أسرع إلى سنغيغي, هذا المسار أسرع إلى سنغيغي]
      en: [This route is quicker to Senggigi, This is the faster route to Senggigi]
    words: [rute]
  - id: e09
    type: speaking
    text: 'Saya menikmati makanan khusus Lombok: ayam taliwang!'
    meaning:
      ar_eg: 'استمتعت بأكلة لومبوك المخصوصة: فراخ تاليوانج!'
      ar: 'استمتعت بطبق لومبوك الخاص: دجاج تاليوانغ!'
      en: 'I enjoyed Lombok''s special dish: ayam taliwang!'
    words: [menikmati, khusus]
  - id: e10
    type: multiple_choice
    question: Kami menyewa kamar di hotel ini. Hotel ini punya kolam renang ___ untuk anak-anak.
    options: [lokasi, menikmati, khusus]
    answer: 2
    explain:
      ar_eg: khusus = مخصوص، خاص.
      ar: khusus = خاص، مخصّص.
      en: khusus = special, just for.
    words: [khusus, lokasi, menikmati, menyewa]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kamu udah di Lombok?
      ar_eg: يا محمد، إنت وصلت لومبوك؟
      ar: يا محمد، هل وصلت إلى لومبوك؟
      en: Mohamed, are you in Lombok yet?
    - speaker: Mohamed
      text: Udah! Pesawatnya baru mendarat di bandara internasional.
      ar_eg: أيوه! الطيارة لسه نازلة في المطار الدولي.
      ar: نعم! هبطت الطائرة للتو في المطار الدولي.
      en: Yes! The plane's just landed at the international airport.
    - speaker: Rina
      text: Sip. Kamu mau menyewa mobil di bandara?
      ar_eg: حلو. هتأجّر عربية من المطار؟
      ar: جميل. هل ستستأجر سيارة في المطار؟
      en: Great. Are you renting a car at the airport?
    - speaker: Mohamed
      text: Nggak, aku udah memesan taksi. Lokasi hotelnya dekat pantai.
      ar_eg: لأ، أنا حاجز تاكسي. الفندق مكانه قريب من البحر.
      ar: لا، حجزت سيارة أجرة. موقع الفندق قريب من الشاطئ.
      en: No, I've booked a taxi. The hotel's right by the beach.
    - speaker: Rina
      text: Besok kita jalan-jalan. Aku punya rute wisata khusus buat kamu!
      ar_eg: بكرة نتفسّح. عندي خط سير سياحي مخصوص ليك!
      ar: غدًا نتجوّل. لديّ مسار سياحي خاص لك!
      en: Tomorrow we'll go sightseeing. I've got a special tourist route for you!
