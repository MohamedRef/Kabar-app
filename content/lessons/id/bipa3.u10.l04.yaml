  - id: e03
    type: listen
    text: Pesawat dari Jakarta akan mendarat dalam sepuluh menit.
    question:
      ar_eg: الطيارة هتعمل إيه؟
      ar: ماذا ستفعل الطائرة؟
      en: What will the plane do?
    options: [هتقوم, هتنزل, اتأخرت]
    answer: 1
    meaning:
      ar_eg: الطيارة اللي جاية من جاكرتا هتنزل كمان عشر دقايق.
      ar: ستهبط الطائرة القادمة من جاكرتا بعد عشر دقائق.
      en: The plane from Jakarta will land in ten minutes.
    words: [mendarat]
  - id: e04
    type: fill_blank
    sentence: Kami mau ___ mobil untuk tiga hari.
    meaning:
      ar_eg: عايزين ___ عربية تلات أيام.
      ar: نريد أن ___ سيارة لثلاثة أيام.
      en: We want to ___ a car for three days.
    options: [menyewa, pilot, kedatangan]
    answers: [menyewa]
    words: [menyewa, pilot, kedatangan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيسوق الطيارة؟
      ar: من يقود الطائرة؟
      en: Who flies the plane?
    options: [pilot, rute, wisata]
    answer: 0
    explain:
      ar_eg: pilot = طيار.
      ar: pilot = طيّار.
      en: pilot = pilot.
    words: [pilot, rute, wisata]
  - id: e06
    type: fill_blank
    sentence: 'Lombok punya banyak tempat ___: pantai, gunung, dan air terjun.'
    meaning:
      ar_eg: 'لومبوك فيها أماكن ___ كتير: شطوط وجبال وشلالات.'
      ar: 'في لومبوك أماكن ___ كثيرة: شواطئ وجبال وشلالات.'
      en: 'Lombok has lots of ___ spots: beaches, mountains and waterfalls.'
    options: [mewah, wisata, memesan]
    answers: [wisata]
    words: [wisata, mewah, memesan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: حجزت تذكرة طيارة لجاكرتا.
      ar: حجزت تذكرة طائرة إلى جاكرتا.
      en: I booked a plane ticket to Jakarta.
    answer: Saya memesan tiket pesawat ke Jakarta.
    distractors: [menyewa, rute]
    words: [memesan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Rute ini lebih cepat ke Senggigi.
    answers_meaning:
      ar_eg: [الطريق ده أسرع لسنجيجي, الخط ده أسرع لحد سنجيجي]
      ar: [هذا الطريق أسرع إلى سنغيغي, هذا المسار أسرع إلى سنغيغي]
      en: [This route is quicker to Senggigi, This is the faster route to Senggigi]
    words: [rute]
  - id: e09
    type: speaking
    text: Selamat datang! Ruang kedatangan ada di sebelah kiri.
    meaning:
      ar_eg: أهلًا بيك! صالة الوصول على الشمال.
      ar: أهلًا بك! صالة الوصول على اليسار.
      en: Welcome! The arrivals hall is on the left.
    words: [kedatangan]
  - id: e10
    type: multiple_choice
    question: Vila itu ada kolam renang pribadi. Sangat ___!
    options: [kedatangan, pilot, mewah]
    answer: 2
    explain:
      ar_eg: mewah = فخم، لوكس.
      ar: mewah = فاخر.
      en: mewah = luxurious.
    words: [mewah, kedatangan, pilot, mendarat, menyewa, memesan]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kamu sudah di Lombok?
      ar_eg: يا محمد، إنت وصلت لومبوك؟
      ar: يا محمد، هل وصلت إلى لومبوك؟
      en: Mohamed, are you in Lombok yet?
    - speaker: Mohamed
      text: Ya! Pesawatnya baru mendarat. Pilotnya hebat, tidak ada guncangan.
      ar_eg: أيوه! الطيارة لسه نازلة. الطيار شاطر، مافيش ولا هزّة.
      ar: نعم! هبطت الطائرة للتو. الطيّار ماهر، ولا أيّ اهتزاز.
      en: Yes! The plane just landed. Great pilot, not a single bump.
    - speaker: Rina
      text: Bagus. Kamu mau menyewa mobil di bandara?
      ar_eg: حلو. هتأجّر عربية من المطار؟
      ar: جميل. هل ستستأجر سيارة في المطار؟
      en: Great. Are you renting a car at the airport?
    - speaker: Mohamed
      text: Tidak, saya sudah memesan taksi. Hotelnya tidak mewah, tapi dekat pantai.
      ar_eg: لأ، أنا حاجز تاكسي. الفندق مش فخم، بس قريب من البحر.
      ar: لا، حجزت سيارة أجرة. الفندق ليس فاخرًا لكنه قريب من الشاطئ.
      en: No, I've booked a taxi. The hotel isn't fancy, but it's near the beach.
    - speaker: Rina
      text: Besok kita jalan-jalan. Saya punya rute wisata yang bagus!
      ar_eg: بكرة نتفسّح. عندي خط سير سياحي حلو!
      ar: غدًا نتجوّل. لديّ مسار سياحي رائع!
      en: Tomorrow we'll go sightseeing. I've got a great tourist route!
