schema: kabar.lesson/v1
id: bipa5.u03.l08
language: id
title: Mesin pintar di tambang
can_do:
  ar_eg: 'تشرح تكنولوجيا جديدة في منجم: الهندسة والاختراق العلمي والمحاكاة والتوقع وطريقة الشغل، والشاشة والهوائي، وبمنطق عقلاني.'
  ar: 'أن تشرح تقنية جديدة في منجم: الهندسة والإنجاز العلمي والمحاكاة والتنبؤ والآلية، والشاشة والهوائي، بأسلوب عقلاني.'
  en: 'Explain new technology at a mine: engineering, breakthroughs, simulation, prediction and mechanism, the monitor and antenna, rationally.'
slides:
  - title: Teknologi untuk keselamatan
    body:
      ar_eg: |
        rekayasa = هندسة أو تصميم تقني (rekayasa perangkat lunak = هندسة برمجيات)، وكمان "تلاعب" (rekayasa data).
        terobosan = اختراق علمي أو خطوة كبيرة جديدة، simulasi = محاكاة، prediksi = توقع.
        mekanisme = آلية، طريقة الشغل، rasional = عقلاني.
        monitor = شاشة مراقبة، antena = هوائي، أنتين.
      ar: |
        rekayasa = هندسة، تصميم تقني (rekayasa perangkat lunak = هندسة البرمجيات)، وأيضًا "تلاعب" (rekayasa data).
        terobosan = إنجاز، اختراق علمي، simulasi = محاكاة، prediksi = تنبّؤ، توقّع.
        mekanisme = آلية، rasional = عقلاني.
        monitor = شاشة مراقبة، antena = هوائي.
      en: |
        rekayasa = engineering (rekayasa perangkat lunak = software engineering), also "manipulation" (rekayasa data).
        terobosan = breakthrough, simulasi = simulation, prediksi = prediction, forecast.
        mekanisme = mechanism, rasional = rational.
        monitor = monitor, screen, antena = antenna, aerial.
    examples:
      - text: Sensor ini adalah terobosan dalam rekayasa tambang.
        ar_eg: الحساس ده إنجاز كبير في هندسة المناجم.
        ar: هذا المستشعر إنجاز في هندسة التعدين.
        en: This sensor is a breakthrough in mining engineering.
      - text: Simulasi komputer membuat prediksi longsor lebih akurat.
        ar_eg: محاكاة الكمبيوتر بتخلي توقع الانهيارات أدق.
        ar: تجعل المحاكاة الحاسوبية التنبؤ بالانهيارات أدق.
        en: Computer simulation makes landslide prediction more accurate.
      - text: Semua data dari antena terlihat di monitor ini.
        ar_eg: كل الداتا اللي جاية من الهوائي بتبان على الشاشة دي.
        ar: تظهر كل بيانات الهوائي على هذه الشاشة.
        en: All the data from the antenna shows on this monitor.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rekayasa
        ar_eg: هندسة (تقنية)
        ar: هندسة تقنية
        en: engineering
      - text: terobosan
        ar_eg: إنجاز جديد
        ar: إنجاز علمي
        en: breakthrough
      - text: simulasi
        ar_eg: محاكاة
        ar: محاكاة
        en: simulation
      - text: prediksi
        ar_eg: توقع
        ar: تنبّؤ
        en: prediction
    words: [rekayasa, terobosan, simulasi, prediksi]
  - id: e02
    type: match_pairs
    pairs:
      - text: mekanisme
        ar_eg: آلية
        ar: آلية
        en: mechanism
      - text: rasional
        ar_eg: عقلاني
        ar: عقلاني
        en: rational
      - text: monitor
        ar_eg: شاشة
        ar: شاشة مراقبة
        en: monitor
      - text: antena
        ar_eg: أنتين
        ar: هوائي
        en: antenna
    words: [mekanisme, rasional, monitor, antena]
  - id: e03
    type: listen
    text: Menurut prediksi, hujan akan turun malam ini.
    question:
      ar_eg: مين بيقول إن المطر هينزل؟
      ar: من يقول إنها ستمطر؟
      en: What says it will rain?
    options: [التوقعات, الإشاعات, الجرايد]
    answer: 0
    meaning:
      ar_eg: حسب التوقعات، المطر هينزل الليلة.
      ar: وفق التوقّعات، ستمطر الليلة.
      en: According to the forecast, it will rain tonight.
    words: [prediksi]
  - id: e04
    type: fill_blank
    sentence: Sinyal di tambang lemah, jadi mereka memasang ___ baru.
    meaning:
      ar_eg: الشبكة في المنجم ضعيفة، فركبوا ___ جديد.
      ar: الإشارة في المنجم ضعيفة، لذا ركّبوا ___ جديدًا.
      en: The signal at the mine is weak, so they put up a new ___.
    options: [antena, prediksi, rasional]
    answers: [antena]
    words: [antena, prediksi, rasional]
    explain:
      ar_eg: الشبكة ضعيفة فركّبوا antena. prediksi = توقّع وrasional = منطقي، ومايتركّبوش.
      ar: ضعفت الإشارة فركّبوا antena (هوائيًا). أما prediksi فالتوقّع، وrasional «عقلاني»، ولا يُركَّبان.
      en: Weak signal, so they put up an antena. prediksi (prediction) and rasional (rational) can't be put up.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: قبل ما يجربوا في الحقيقة، عملوها على الكمبيوتر الأول. ده اسمه إيه؟
      ar: جرّبوها على الحاسوب قبل الواقع. ما اسم ذلك؟
      en: They tried it on a computer before real life. What is that called?
    options: [monitor, simulasi, mekanisme]
    answer: 1
    explain:
      ar_eg: simulasi = محاكاة.
      ar: simulasi = محاكاة.
      en: simulasi = simulation.
    words: [monitor, simulasi, mekanisme]
  - id: e06
    type: fill_blank
    sentence: Mari kita bahas ini dengan kepala dingin dan cara yang ___.
    meaning:
      ar_eg: خلينا نتكلم في ده بهدوء وبطريقة ___.
      ar: لنناقش هذا بهدوء وبطريقة ___.
      en: Let's discuss this calmly and in a ___ way.
    options: [rasional, terobosan, antena]
    answers: [rasional]
    words: [rasional, terobosan, antena]
    explain:
      ar_eg: «بهدوء» و«بطريقة» rasional (عقلانية). terobosan = إنجاز جديد وantena = هوائي، مش صفة لطريقة.
      ar: «بطريقة» rasional (عقلانية). أما terobosan فالاختراق الجديد، وantena الهوائي، وليسا صفة لطريقة.
      en: "\"In a rasional way\". terobosan (breakthrough) and antena aren't adjectives for a way of talking."
  - id: e07
    type: multiple_choice
    question: Bagaimana ___ kerja mesin ini? Tolong jelaskan langkah demi langkah.
    options: [rekayasa, prediksi, mekanisme]
    answer: 2
    explain:
      ar_eg: mekanisme kerja = طريقة شغل المكنة.
      ar: mekanisme kerja = آلية عمل الآلة.
      en: mekanisme kerja = how the machine works.
    words: [rekayasa, prediksi, mekanisme]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المهندسين بيتفرجوا على الداتا على الشاشة.
      ar: يراقب المهندسون البيانات على الشاشة.
      en: The engineers watch the data on the monitor.
    answer: Para insinyur melihat data di monitor.
    distractors: [antena, simulasi]
    words: [monitor]
    explain:
      ar_eg: «على الشاشة» = di monitor. antena = هوائي وsimulasi = محاكاة، ومش مكان بيبصوا فيه على الداتا.
      ar: «على الشاشة» = di monitor. أما antena فالهوائي، وsimulasi المحاكاة.
      en: "\"On the monitor\" is di monitor. antena and simulasi aren't where you watch data."
  - id: e09
    type: translate
    direction: from_target
    source_text: Ini terobosan besar dalam rekayasa tambang.
    answers_meaning:
      ar_eg: [ده إنجاز كبير في هندسة المناجم, دي نقلة كبيرة في هندسة التعدين]
      ar: [هذا إنجاز كبير في هندسة التعدين, هذه قفزة كبيرة في هندسة المناجم]
      en: [This is a big breakthrough in mining engineering, This is a major breakthrough in mine engineering]
    words: [terobosan, rekayasa]
  - id: e10
    type: speaking
    text: Simulasi ini membantu prediksi yang rasional.
    meaning:
      ar_eg: المحاكاة دي بتساعد على توقع عقلاني.
      ar: تساعد هذه المحاكاة على تنبّؤ عقلاني.
      en: This simulation helps make rational predictions.
    words: [simulasi, prediksi, rasional]
dialogue:
  lines:
    - speaker: Pak Hendra
      text: Pak Mohamed, besok ada tamu dari Mesir. Tolong terjemahkan presentasi ini.
      ar_eg: يا أستاذ محمد، بكرة جايلنا ضيوف من مصر. ترجم العرض ده لو سمحت.
      ar: يا أستاذ محمد، يصلنا غدًا ضيوف من مصر. ترجم هذا العرض من فضلك.
      en: Mohamed, guests from Egypt are coming tomorrow. Please translate this presentation.
    - speaker: Mohamed
      text: Baik, Pak. Tentang apa?
      ar_eg: حاضر يا فندم. عن إيه؟
      ar: حسنًا يا سيّدي. عمّ يتحدث؟
      en: Certainly, sir. What's it about?
    - speaker: Pak Hendra
      text: 'Terobosan kami: sensor dan antena yang mengirim data ke monitor di kantor.'
      ar_eg: 'الإنجاز بتاعنا: حساسات وهوائيات بتبعت داتا لشاشات في المكتب.'
      ar: 'إنجازنا: مستشعرات وهوائيات ترسل البيانات إلى شاشات في المكتب.'
      en: 'Our breakthrough: sensors and antennas that send data to monitors in the office.'
    - speaker: Mohamed
      text: Lalu komputer membuat simulasi dan prediksi longsor?
      ar_eg: وبعدين الكمبيوتر بيعمل محاكاة وتوقع للانهيارات؟
      ar: ثم يصنع الحاسوب محاكاة وتنبّؤًا بالانهيارات؟
      en: And then the computer simulates and predicts landslides?
    - speaker: Pak Hendra
      text: Betul. Mekanismenya mudah, tapi rekayasanya sulit.
      ar_eg: مظبوط. الآلية سهلة، بس الهندسة بتاعتها صعبة.
      ar: صحيح. الآلية سهلة، لكنّ الهندسة صعبة.
      en: Exactly. The mechanism is easy, but the engineering is hard.
    - speaker: Mohamed
      text: Saya akan memakai bahasa yang rasional dan jelas.
      ar_eg: هستخدم لغة عقلانية وواضحة.
      ar: سأستعمل لغة عقلانية وواضحة.
      en: I'll use clear, rational language.
