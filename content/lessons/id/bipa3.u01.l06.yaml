  - id: e03
    type: listen
    text: Bu Endah sudah melahirkan. Putranya sehat.
    question:
      ar_eg: خلّفت إيه؟
      ar: ماذا أنجبت؟
      en: What did she have?
    options: [بنت, ولد, توأم]
    answer: 1
    meaning:
      ar_eg: مدام إنده ولدت. ابنها بصحة كويسة.
      ar: أنجبت السيدة إنده. ابنها بصحة جيدة.
      en: Bu Endah has given birth. Her son is healthy.
    words: [melahirkan, putra]
  - id: e04
    type: fill_blank
    sentence: Kakek saya ___ delapan puluh tahun.
    meaning:
      ar_eg: جدي ___ تمانين سنة.
      ar: جدي ___ ثمانين عامًا.
      en: My grandfather is ___ eighty.
    options: [hamil, berumur, putri]
    answers: [berumur]
    words: [berumur, hamil, putri]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: يعني إيه hamil؟
      ar: ما معنى hamil؟
      en: What does hamil mean?
    options: [حامل, متجوّزة, عيّانة]
    answer: 0
    explain:
      ar_eg: hamil = حامل، وبعد كده melahirkan = تولد.
      ar: hamil = حامل، ثم melahirkan = تلد.
      en: hamil = pregnant; then melahirkan = give birth.
    words: [hamil, melahirkan]
  - id: e06
    type: fill_blank
    sentence: Mas Rizal ___ seorang guru dari Mataram.
    meaning:
      ar_eg: مستر رزال ___ مدرّسة من ماتارام.
      ar: ___ مستر رزال معلمةً من ماترام.
      en: Mas Rizal ___ a teacher from Mataram.
    options: [menikahi, bersyukur, kehidupan]
    answers: [menikahi]
    words: [menikahi, bersyukur, kehidupan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: بنحمد ربنا على حياتنا.
      ar: نشكر الله على حياتنا.
      en: We are thankful for our life.
    answer: Kami bersyukur atas kehidupan kami.
    distractors: [putra, hamil]
    words: [bersyukur, kehidupan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Putri mereka tinggal di Mataram.
    answers_meaning:
      ar_eg: [بنتهم ساكنة في ماتارام, بنتهم عايشة في ماتارام]
      ar: [تسكن ابنتهم في ماترام, ابنتهما تعيش في ماترام]
      en: [Their daughter lives in Mataram, Their daughter is living in Mataram]
    words: [putri]
  - id: e09
    type: speaking
    text: Selamat atas kelahiran putra Anda. Semoga sehat selalu.
    meaning:
      ar_eg: مبروك على المولود. ربنا يخليهولك.
      ar: مبارك المولود. أتمنى له دوام الصحة.
      en: Congratulations on the birth of your son. Wishing him good health.
    words: [putra]
  - id: e10
    type: multiple_choice
    question: Bayi itu baru ___ dua bulan.
    options: [berumur, melahirkan, menikahi]
    answer: 0
    explain:
      ar_eg: 'berumur = عمره: البيبي عنده شهرين بس.'
      ar: 'berumur = يبلغ من العمر: عمر الطفل شهران فقط.'
      en: 'berumur = aged: the baby is only two months old.'
    words: [berumur, melahirkan, menikahi]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Mohamed, ada kabar baik! Istri saya hamil.
      ar_eg: يا محمد، عندي خبر حلو! مراتي حامل.
      ar: يا محمد، عندي خبر سار! زوجتي حامل.
      en: Mohamed, great news! My wife is pregnant.
    - speaker: Mohamed
      text: Alhamdulillah! Selamat, Mas! Kapan dia melahirkan?
      ar_eg: الحمد لله! مبروك! هتولد إمتى؟
      ar: الحمد لله! مبارك! متى موعد الولادة؟
      en: Alhamdulillah! Congratulations! When is the baby due?
    - speaker: Mas Rizal
      text: Bulan Maret. Kami bersyukur sekali.
      ar_eg: في مارس. إحنا حامدين ربنا جدًا.
      ar: في مارس. نحمد الله كثيرًا.
      en: In March. We're so thankful.
    - speaker: Mohamed
      text: Mau putra atau putri?
      ar_eg: عايزين ولد ولا بنت؟
      ar: أتريدان ابنًا أم ابنة؟
      en: Hoping for a son or a daughter?
    - speaker: Mas Rizal
      text: Kami mau bayinya sehat saja. Kehidupan kami akan sangat sibuk!
      ar_eg: إحنا عايزين البيبي يبقى بصحته وبس. حياتنا هتبقى مشغولة أوي!
      ar: نريد فقط أن يكون الطفل بصحة جيدة. ستصبح حياتنا مشغولة جدًا!
      en: We just want a healthy baby. Life's going to get very busy!
