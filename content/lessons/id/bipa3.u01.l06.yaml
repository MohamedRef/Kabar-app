schema: kabar.lesson/v1
id: bipa3.u01.l06
language: id
title: Hamil dan melahirkan
can_do:
  ar_eg: تبارك على حمل وولادة ومعاش، وتتكلم عن مراحل الحياة.
  ar: أن تهنّئ بالحمل والولادة والتقاعد، وتتحدث عن مراحل الحياة.
  en: Congratulate people on a pregnancy, a birth or retirement, and talk about stages of life.
slides:
  - title: Kabar baik
    body:
      ar_eg: |
        hamil = حامل. melahirkan = تولد (الأم بتولد). putra = ابن، putri = بنت (كلمتين مؤدبين أكتر من anak laki-laki و anak perempuan).
        menikahi = يتجوز (حد): Dia menikahi teman kuliahnya.
        berumur = عمره (Dia berumur 60 tahun = عنده ٦٠ سنة). bersyukur = يحمد ربنا. kehidupan = الحياة (حياة الواحد).
      ar: |
        hamil = حامل. melahirkan = تلد. putra = ابن، putri = ابنة (أكثر تهذيبًا من anak laki-laki و anak perempuan).
        menikahi = يتزوّج (فلانًا): Dia menikahi teman kuliahnya.
        berumur = يبلغ من العمر (Dia berumur 60 tahun = عمره ٦٠ عامًا). bersyukur = يشكر الله. kehidupan = الحياة (المعيشة).
      en: |
        hamil = pregnant. melahirkan = give birth. putra = son, putri = daughter (more polite than anak laki-laki / perempuan).
        menikahi = marry (someone): Dia menikahi teman kuliahnya.
        berumur = aged (Dia berumur 60 tahun = he is 60). bersyukur = be thankful (to God). kehidupan = life.
    examples:
      - text: Istri Pak Irwan sedang hamil.
        ar_eg: مرات أستاذ إيروان حامل.
        ar: زوجة الأستاذ إيروان حامل.
        en: Pak Irwan's wife is pregnant.
      - text: Kakak saya melahirkan seorang putri kemarin.
        ar_eg: أختي ولدت بنت امبارح.
        ar: أنجبت أختي ابنة أمس.
        en: My sister gave birth to a daughter yesterday.
      - text: Kami bersyukur, ibu dan bayinya sehat.
        ar_eg: الحمد لله، الأم والبيبي بخير.
        ar: نحمد الله، الأم والطفل بصحة جيدة.
        en: 'We''re thankful: mother and baby are well.'
