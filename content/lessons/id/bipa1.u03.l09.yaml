    ar: "قد، بالفعل؛ في الكلام: udah"
    en: "already; in speech: udah"
  - word: belum
    pos: adverb
    ar_eg: لسه مش
    ar: لم … بعد
    en: not yet
  - word: lucu
    pos: adjective
    ar_eg: دمه خفيف، لطيف
    ar: لطيف، ظريف
    en: cute, funny
