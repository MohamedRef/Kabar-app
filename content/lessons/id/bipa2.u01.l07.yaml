schema: kabar.lesson/v1
id: bipa2.u01.l07
language: id
title: Modern atau tradisional?
can_do:
  ar_eg: 'توصف الحاجات: حديثة ولا تقليدية، فخمة، فريدة، مميزة، أصلية ولا أنتيكة.'
  ar: 'أن تصف الأشياء: حديثة أو تقليدية، فاخرة، فريدة، مميّزة، أصلية أو أثرية.'
  en: Describe things as modern or traditional, luxurious, unique, special, genuine or antique.
slides:
  - title: Asli dan istimewa
    body:
      ar_eg: |
        modern ↔ tradisional: Gamelan musik tradisional.
        mewah = فخم، غالي. unik = فريد ومختلف. sempurna = كامل، مثالي.
        كلمتين أصلهم عربي: asli = أصلي (من «أصل») وistimewa = مميز (من «امتياز»).
        antik = أنتيكة، قديم وليه قيمة.
      ar: |
        modern ↔ tradisional: Gamelan musik tradisional.
        mewah = فاخر. unik = فريد. sempurna = كامل، مثالي.
        وكلمتان أصلهما عربي: asli = أصلي (من «أصل») وistimewa = مميّز (من «امتياز»).
        antik = أثري، قديم ذو قيمة.
      en: |
        modern ↔ tradisional: Gamelan musik tradisional.
        mewah = luxurious. unik = unique. sempurna = perfect.
        Two Arabic loans: asli = genuine, original (أصل) and istimewa = special (امتياز).
        antik = antique.
    examples:
      - text: Gamelan adalah musik tradisional dari Jawa dan Bali.
        ar_eg: الجاميلان مزيكا تقليدية من جاوة وبالي.
        ar: الجاميلان موسيقى تقليدية من جاوة وبالي.
        en: Gamelan is traditional music from Java and Bali.
      - text: Biola ini antik dan asli dari Italia.
        ar_eg: الكمنجة دي أنتيكة وأصلية من إيطاليا.
        ar: هذا الكمان أثري وأصلي من إيطاليا.
        en: This violin is antique and genuinely Italian.
      - text: Hotel itu mewah dan modern.
        ar_eg: الأوتيل ده فخم وحديث.
        ar: ذلك الفندق فاخر وحديث.
        en: That hotel is luxurious and modern.
