schema: kabar.lesson/v1
id: bipa2.u01.l07
language: id
title: Mengenal gamelan Bali
can_do:
  ar_eg: تقرا نص قصير عن الجاميلان وتفهم مين أكبر ومين أخف ومعمول من إيه.
  ar: أن تقرأ نصًا قصيرًا عن الغاميلان وتفهم المقارنات بين آلاته ومادة صنعها.
  en: Read a short text about gamelan and follow its comparisons.
slides:
  - title: Mengenal gamelan Bali
    body:
      ar_eg: |
        ده نص قصير من ورقة مدرسة الموسيقى في أوبود. اقراه بالراحة، وركّز على المقارنات: lebih … daripada و paling.
        فيه كلمتين جداد للخامات: logam (معدن) و kayu (خشب). «Gendang dari kayu» يعني الطبلة معمولة من خشب.
      ar: |
        هذا نص قصير من نشرة مدرسة الموسيقى في أوبود. اقرأه بهدوء، وانتبه إلى المقارنات: lebih … daripada و paling.
        فيه كلمتان جديدتان للمواد: logam (معدن) و kayu (خشب). «Gendang dari kayu» أي أن الطبل مصنوع من الخشب.
      en: |
        A short text from an Ubud music school leaflet. Read it slowly and watch the comparisons: lebih … daripada and paling.
        Two new material words: logam (metal) and kayu (wood). "Gendang dari kayu" = the drum is made of wood.
    examples:
      - text: Gamelan Bali lebih cepat dan lebih keras daripada gamelan Jawa.
        ar_eg: الجاميلان البالي أسرع وصوته أعلى من الجاميلان الجاوي.
        ar: الغاميلان البالي أسرع وأعلى صوتًا من الغاميلان الجاوي.
        en: Balinese gamelan is faster and louder than Javanese gamelan.
      - text: Banyak alat musik gamelan dari logam, tapi gendang dari kayu.
        ar_eg: آلات كتير في الجاميلان معمولة من معدن، بس الطبلة من خشب.
        ar: كثير من آلات الغاميلان مصنوعة من المعدن، لكن الطبل من الخشب.
        en: Many gamelan instruments are made of metal, but the drum is made of wood.
      - text: Gong paling besar dan paling berat. Suling dari bambu dan paling ringan.
        ar_eg: الجونج أكبر وأتقل واحد. الناي من البامبو وهو أخف واحد.
        ar: الغونغ هو الأكبر والأثقل. الناي من الخيزران وهو الأخف.
        en: The gong is the biggest and the heaviest. The flute is made of bamboo and is the lightest.
exercises:
  - id: e01
    type: listen
    text: Banyak alat musik gamelan dari logam.
    options:
      - Banyak alat musik gamelan dari logam.
      - Banyak alat musik gamelan dari kayu.
      - Semua alat musik gamelan dari logam.
    answer: 0
    meaning:
      ar_eg: آلات كتير في الجاميلان معمولة من معدن.
      ar: كثير من آلات الغاميلان مصنوعة من المعدن.
      en: Many gamelan instruments are made of metal.
    words: [logam]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: حسب النص، أنهي جاميلان أسرع؟
      ar: بحسب النص، أيّ غاميلان أسرع؟
      en: According to the text, which gamelan is faster?
    options: [Gamelan Jawa lebih cepat., Gamelan Bali lebih cepat.]
    answer: 1
    words: [lebih, cepat]
    explain:
      ar_eg: "النص بيقول: Gamelan Bali lebih cepat dan lebih keras daripada gamelan Jawa، يعني البالي أسرع وأعلى."
      ar: "يقول النص: Gamelan Bali lebih cepat dan lebih keras daripada gamelan Jawa، أي أن البالي أسرع وأعلى صوتًا."
      en: "The text says Gamelan Bali lebih cepat dan lebih keras daripada gamelan Jawa: Balinese is faster and louder."
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: حسب النص، الـ gendang معمول من إيه؟
      ar: بحسب النص، مِمَّ يُصنع الـ gendang؟
      en: According to the text, what is the gendang made of?
    options: [logam, bambu, kayu]
    answer: 2
    words: [kayu, gendang]
    explain:
      ar_eg: النص بيقول «gendang dari kayu»، يعني من خشب. آلات الجاميلان التانية أغلبها logam (معدن).
      ar: يقول النص «gendang dari kayu» أي من الخشب، أما أغلب آلات الغاميلان الأخرى فمن logam (معدن).
      en: "The text says \"gendang dari kayu\": wood. Most other gamelan instruments are logam (metal)."
  - id: e04
    type: listen
    text: Gong paling besar dan paling berat. Suling dari bambu dan paling ringan.
    question:
      ar_eg: أنهي آلة أخف واحدة؟
      ar: أيّ آلة هي الأخف؟
      en: Which instrument is the lightest?
    options: [suling, gong, gendang]
    answer: 0
    meaning:
      ar_eg: الجونج أكبر وأتقل واحد. الناي من البامبو وهو أخف واحد.
      ar: الغونغ هو الأكبر والأثقل. الناي من الخيزران وهو الأخف.
      en: The gong is the biggest and the heaviest. The flute is made of bamboo and is the lightest.
    words: [paling, ringan, suling]
  - id: e05
    type: match_pairs
    pairs:
      - text: logam
        ar_eg: معدن
        ar: معدن
        en: metal
      - text: kayu
        ar_eg: خشب
        ar: خشب
        en: wood
      - text: bambu
        ar_eg: بامبو، خيزران
        ar: خيزران
        en: bamboo
      - text: berat
        ar_eg: تقيل
        ar: ثقيل
        en: heavy
      - text: ringan
        ar_eg: خفيف
        ar: خفيف
        en: light (not heavy)
      - text: dengan
        ar_eg: مع / بـ
        ar: مع / بـ
        en: with
    words: [logam, kayu, bambu, berat, ringan, dengan]
  - id: e06
    type: fill_blank
    sentence: Gendang ini dari ___, bukan dari logam.
    meaning:
      ar_eg: الطبلة دي معمولة من خشب، مش من معدن.
      ar: هذا الطبل مصنوع من الخشب، لا من المعدن.
      en: This drum is made of wood, not metal.
    options: [kayu, bambu, gong]
    answers: [kayu]
    explain:
      ar_eg: النص قال إن الـ gendang من kayu.
      ar: ذكر النص أن الـ gendang من kayu.
      en: The text says the gendang is made of kayu (wood).
    words: [kayu]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الجاميلان البالي أسرع من الجاميلان الجاوي.
      ar: الغاميلان البالي أسرع من الغاميلان الجاوي.
      en: Balinese gamelan is faster than Javanese gamelan.
    answer: Gamelan Bali lebih cepat daripada gamelan Jawa.
    distractors: [paling, dengan]
    words: [lebih, daripada, cepat]
    explain:
      ar_eg: "مقارنة بين حاجتين: lebih + صفة + daripada. paling للأفضل من الكل، وdengan مش بتيجي هنا."
      ar: "مقارنة بين شيئين: lebih + صفة + daripada. أما paling فللتفضيل المطلق، وdengan لا موضع لها."
      en: "Two things compared: lebih + adjective + daripada. paling is for \"the most\"; dengan doesn't fit."
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الجونج معمول من معدن وتقيل جدًا.
      ar: الغونغ مصنوع من المعدن وثقيل جدًا.
      en: The gong is made of metal and is very heavy.
    answers:
      - Gong dari logam dan sangat berat.
      - Gong dari logam dan sangat berat
      - Gong dari logam dan berat sekali.
      - Gong dari logam dan berat sekali
      - Gong itu dari logam dan sangat berat.
      - Gong itu dari logam dan berat sekali.
      - Gongnya dari logam dan sangat berat.
      - Gongnya dari logam dan berat sekali.
      - Gong terbuat dari logam dan sangat berat.
      - Gong terbuat dari logam dan berat sekali.
      - Gong dari logam dan berat banget.
    words: [logam, berat]
  - id: e09
    type: dictation
    text: Saya bermain gamelan dengan teman.
    meaning:
      ar_eg: أنا بعزف جاميلان مع صاحبي.
      ar: أعزف الغاميلان مع صديقي.
      en: I play gamelan with a friend.
    words: [bermain, dengan, teman]
  - id: e10
    type: fill_blank
    sentence: Orang Bali bermain gamelan ___ cepat.
    meaning:
      ar_eg: أهل بالي بيعزفوا الجاميلان بسرعة.
      ar: يعزف أهل بالي الغاميلان بسرعة.
      en: Balinese people play gamelan quickly.
    options: [dengan, daripada, paling]
    answers: [dengan]
    explain:
      ar_eg: dengan + صفة = بالطريقة دي، فـ dengan cepat = بسرعة.
      ar: dengan + صفة تعني «بهذه الطريقة»، فـ dengan cepat = بسرعة.
      en: dengan + adjective describes how, so dengan cepat = quickly.
    words: [dengan, cepat]
dialogue:
  title: Di sekolah musik, Ubud
  lines:
    - speaker: Mohamed
      text: Ni Luh, gendang ini dari logam?
      ar_eg: يا ني لوه، الطبلة دي من معدن؟
      ar: يا ني لوه، هل هذا الطبل من المعدن؟
      en: Ni Luh, is this drum made of metal?
    - speaker: Ni Luh
      text: Bukan, gendang dari kayu. Gong dari logam.
      ar_eg: لأ، الطبلة من خشب. الجونج هو اللي من معدن.
      ar: لا، الطبل من الخشب. أما الغونغ فمن المعدن.
      en: No, the drum is made of wood. The gong is made of metal.
    - speaker: Mohamed
      text: Wah, gongnya besar sekali! Berat, ya?
      ar_eg: ياه، الجونج كبير أوي! تقيل، صح؟
      ar: يا له من غونغ كبير! إنه ثقيل، أليس كذلك؟
      en: Wow, the gong is so big! It's heavy, isn't it?
    - speaker: Ni Luh
      text: Ya, gong paling berat. Suling paling ringan.
      ar_eg: أيوه، الجونج أتقل واحد. والناي أخف واحد.
      ar: نعم، الغونغ هو الأثقل. والناي هو الأخف.
      en: Yes, the gong is the heaviest. The flute is the lightest.
    - speaker: Mohamed
      text: Gamelan Bali lebih cepat daripada gamelan Jawa, ya?
      ar_eg: الجاميلان البالي أسرع من الجاوي، صح؟
      ar: الغاميلان البالي أسرع من الجاوي، أليس كذلك؟
      en: Balinese gamelan is faster than Javanese gamelan, right?
    - speaker: Ni Luh
      text: Betul! Malam ini ada gamelan di pura. Mau menonton?
      ar_eg: مظبوط! النهارده بالليل فيه جاميلان في المعبد. تيجي تتفرج؟
      ar: صحيح! الليلة يوجد عزف غاميلان في المعبد. أتريد أن تشاهد؟
      en: Right! There's gamelan at the temple tonight. Do you want to watch?
new_words:
  - word: logam
    pos: noun
    ar_eg: معدن
    ar: معدن
    en: metal
  - word: kayu
    pos: noun
    ar_eg: خشب
    ar: خشب
    en: wood
  - word: cepat
    pos: adjective
    ar_eg: سريع / بسرعة
    ar: سريع
    en: fast, quick
  - word: dengan
    pos: preposition
    ar_eg: مع / بـ (dengan cepat = بسرعة)
    ar: مع / بـ (dengan cepat = بسرعة)
    en: with; in a … way (dengan cepat = quickly)
review:
  status: draft
  verified: false
