schema: kabar.lesson/v1
id: bipa3.u06.l03
language: id
title: Secepatnya, sebaiknya
can_do:
  ar_eg: تطلب حل لمشكلة بأدب (secepatnya، mohon maaf sebelumnya).
  ar: أن تطلب حلًّا لمشكلة بلباقة (secepatnya، mohon maaf sebelumnya).
  en: Ask politely for a problem to be fixed (secepatnya, mohon maaf sebelumnya).
slides:
  - title: se- + sifat + -nya
    body:
      ar_eg: |
        se- + كلمة + -nya بتعمل ظرف (حال):
        cepat → secepatnya = في أسرع وقت
        baik → sebaiknya = الأحسن إن…
        benar → sebenarnya = الحقيقة إن… / في الواقع
      ar: |
        se- مع الكلمة و-nya تصوغ ظرفًا:
        cepat → secepatnya = في أسرع وقت
        baik → sebaiknya = الأفضل أن…
        benar → sebenarnya = في الحقيقة
      en: |
        se- + word + -nya makes an adverb:
        cepat → secepatnya = as soon as possible
        baik → sebaiknya = it's best to, you'd better
        benar → sebenarnya = actually, in fact
    grammar: id.prefix.se
    examples:
      - text: Sebaiknya Bapak pindah ke kamar lain.
        ar_eg: الأحسن حضرتك تنقل لأوضة تانية.
        ar: الأفضل أن تنتقل إلى غرفة أخرى يا سيدي.
        en: You'd better move to another room, sir.
      - text: Sebenarnya, saya sudah ke resepsionis kemarin.
        ar_eg: الحقيقة إني رحت الاستقبال امبارح.
        ar: في الحقيقة، ذهبتُ إلى الاستقبال أمس.
        en: Actually, I already went to reception yesterday.
  - title: Mohon maaf sebelumnya
    body:
      ar_eg: |
        sebelum (قبل) + -nya = sebelumnya (قبلها / مقدمًا).
        الإندونيسيين بيبدأوا الشكوى باعتذار: Mohon maaf sebelumnya = آسف مقدمًا. بيلطّف الكلام جدًا.
        وبعدين الطلب: memperbaiki = يصلّح، mengembalikan uang = يرجّع الفلوس.
      ar: |
        sebelum (قبل) مع -nya = sebelumnya (مسبقًا).
        يبدأ الإندونيسيون الشكوى باعتذار: Mohon maaf sebelumnya = أعتذر مسبقًا، فيلطّف الكلام.
        ثم يأتي الطلب: memperbaiki = يُصلح، mengembalikan uang = يردّ المال.
      en: |
        sebelum (before) + -nya = sebelumnya (beforehand).
        Indonesians open a complaint with an apology: Mohon maaf sebelumnya = sorry in advance. It softens everything.
        Then the request: memperbaiki = to repair, mengembalikan uang = to give money back.
    grammar: id.prefix.se
    examples:
      - text: Mohon maaf sebelumnya, AC di kamar saya rusak.
        ar_eg: آسف مقدمًا، التكييف في أوضتي بايظ.
        ar: أعتذر مسبقًا، المكيّف في غرفتي معطّل.
        en: Sorry in advance, but the AC in my room is broken.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: secepatnya
        ar_eg: في أسرع وقت
        ar: في أسرع وقت
        en: as soon as possible
      - text: sebaiknya
        ar_eg: الأحسن إن…
        ar: الأفضل أن…
        en: it's best to
      - text: sebenarnya
        ar_eg: الحقيقة إن…
        ar: في الحقيقة
        en: actually
      - text: sebelumnya
        ar_eg: مقدمًا / قبلها
        ar: مسبقًا
        en: beforehand
      - text: memperbaiki
        ar_eg: يصلّح
        ar: يُصلح
        en: to repair
      - text: mengembalikan
        ar_eg: يرجّع
        ar: يُعيد / يردّ
        en: to give back
    words: [secepatnya, sebaiknya, sebenarnya, sebelumnya, memperbaiki, mengembalikan]
  - id: e02
    type: multiple_choice
    question: ___ Bapak pindah ke kamar lain. Kamar itu lebih tenang.
    options: [Sebenarnya, Sebelumnya, Sebaiknya]
    answer: 2
    explain:
      ar_eg: ده اقتراح، يعني «الأحسن»، فبنقول sebaiknya.
      ar: هذا اقتراح بمعنى «الأفضل»، فنقول sebaiknya.
      en: It's a suggestion ("you'd better"), so sebaiknya.
    words: [sebaiknya]
  - id: e03
    type: listen
    text: Sebenarnya, AC-nya masih rusak.
    options:
      - Sebenarnya, AC-nya masih rusak.
      - Sebaiknya, AC-nya masih rusak.
      - Sebenarnya, AC-nya sudah bersih.
    answer: 0
    meaning:
      ar_eg: الحقيقة إن التكييف لسه بايظ.
      ar: في الحقيقة، المكيّف ما زال معطّلًا.
      en: Actually, the AC is still broken.
    words: [sebenarnya]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تقول «آسف مقدمًا» قبل ما تشتكي. تقول إيه؟
      ar: تريد أن تقول «أعتذر مسبقًا» قبل الشكوى. ماذا تقول؟
      en: You want to say "sorry in advance" before you complain. What do you say?
    options:
      - Mohon maaf, saya terlambat.
      - Mohon maaf sebelumnya.
      - Sebenarnya, saya minta maaf.
    answer: 1
    explain:
      ar_eg: sebelumnya = قبلها / مقدمًا. بتتقال قبل الشكوى عشان تلطّفها.
      ar: sebelumnya = مسبقًا، وتُقال قبل الشكوى لتلطيفها.
      en: sebelumnya = beforehand. You say it before the complaint to soften it.
    words: [sebelumnya]
  - id: e05
    type: fill_blank
    sentence: Petugas hotel sedang ___ AC di kamar saya.
    meaning:
      ar_eg: موظف الفندق بيصلّح التكييف في أوضتي دلوقتي.
      ar: موظف الفندق يُصلح المكيّف في غرفتي الآن.
      en: The hotel staff member is repairing the AC in my room.
    options: [mengembalikan, memperbaiki, secepatnya]
    answers: [memperbaiki]
    words: [memperbaiki]
  - id: e06
    type: build_sentence
    source:
      ar_eg: بطلب من الفندق يرجّعلي فلوسي.
      ar: أطلب من الفندق أن يردّ مالي.
      en: I'm asking the hotel to give me my money back.
    answer: Saya minta hotel mengembalikan uang saya.
    distractors: [memperbaiki, sebaiknya]
    words: [mengembalikan]
  - id: e07
    type: fill_blank
    sentence: ___, saya sudah ke resepsionis kemarin, tapi AC-nya masih rusak.
    meaning:
      ar_eg: الحقيقة إني رحت الاستقبال امبارح، بس التكييف لسه بايظ.
      ar: في الحقيقة ذهبتُ إلى الاستقبال أمس، لكن المكيّف ما زال معطّلًا.
      en: Actually, I already went to reception yesterday, but the AC is still broken.
    options: [Sebaiknya, Sebenarnya, Secepatnya]
    answers: [Sebenarnya]
    words: [sebenarnya]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الأحسن الفندق يصلّح التكييف في أسرع وقت.
      ar: الأفضل أن يُصلح الفندق المكيّف في أسرع وقت.
      en: It's best for the hotel to repair the AC as soon as possible.
    answers:
      - Sebaiknya hotel memperbaiki AC-nya secepatnya.
      - Sebaiknya hotel memperbaiki AC-nya secepatnya
      - Sebaiknya hotel memperbaiki AC secepatnya.
      - Sebaiknya hotel memperbaiki AC secepatnya
      - Sebaiknya hotel secepatnya memperbaiki AC-nya.
      - Sebaiknya hotel secepatnya memperbaiki AC-nya
      - Sebaiknya hotel secepatnya memperbaiki AC.
      - Sebaiknya hotel secepatnya memperbaiki AC
      - Sebaiknya, hotel memperbaiki AC-nya secepatnya.
      - Sebaiknya, hotel memperbaiki AC secepatnya.
    words: [sebaiknya, memperbaiki, secepatnya]
  - id: e09
    type: speaking
    text: Mohon maaf sebelumnya, saya minta hotel mengembalikan uang saya secepatnya.
    meaning:
      ar_eg: آسف مقدمًا، بطلب من الفندق يرجّعلي فلوسي في أسرع وقت.
      ar: أعتذر مسبقًا، أطلب من الفندق أن يردّ مالي في أسرع وقت.
      en: Sorry in advance, but I'm asking the hotel to refund my money as soon as possible.
    words: [sebelumnya, mengembalikan, secepatnya]
dialogue:
  title: Masih rusak
  lines:
    - speaker: Mohamed
      text: Mohon maaf sebelumnya, Mbak. Sebenarnya, AC di kamar saya masih rusak.
      ar_eg: آسف مقدمًا يا آنسة. الحقيقة إن التكييف في أوضتي لسه بايظ.
      ar: أعتذر مسبقًا يا آنسة. في الحقيقة، المكيّف في غرفتي ما زال معطّلًا.
      en: Sorry in advance. Actually, the AC in my room is still broken.
    - speaker: Resepsionis
      text: Maaf sekali, Pak. Petugas kami akan memperbaikinya secepatnya.
      ar_eg: آسفين جدًا يا فندم. الموظف بتاعنا هيصلّحه في أسرع وقت.
      ar: نعتذر جدًا يا سيدي. سيُصلحه موظفنا في أسرع وقت.
      en: We're very sorry, sir. Our staff will repair it as soon as possible.
    - speaker: Mohamed
      text: Kalau tidak bisa, saya minta hotel mengembalikan uang saya.
      ar_eg: ولو مش هينفع، بطلب إن الفندق يرجّعلي فلوسي.
      ar: وإن لم يكن ذلك ممكنًا، أطلب أن يردّ الفندق مالي.
      en: If that's not possible, I'd like the hotel to give me my money back.
    - speaker: Resepsionis
      text: Sebaiknya Bapak pindah ke kamar 15 dulu. Kamarnya lebih tenang.
      ar_eg: الأحسن حضرتك تنقل أوضة 15 دلوقتي. أهدى بكتير.
      ar: الأفضل أن تنتقل إلى الغرفة 15 الآن يا سيدي، فهي أهدأ.
      en: You'd better move to room 15 for now, sir. It's quieter.
