schema: kabar.lesson/v1
id: bipa5.u08.l03
language: id
title: Survei dan data
can_do:
  ar_eg: تقرا نتايج استطلاع رأي وتقول الأرقام بالنسب والكسور.
  ar: أن تقرأ نتائج استطلاع رأي وتعبّر عن الأرقام بالنسب والكسور.
  en: Read opinion-poll results and say the numbers in percentages and fractions.
slides:
  - title: Angka dalam survei
    body:
      ar_eg: |
        في الاستطلاعات هتقابل:
        - persen (%) : 60 persen responden = 60% من المشاركين
        - separuh / setengah = النص، sepertiga = التلت، seperempat = الربع
        - mayoritas = الأغلبية، minoritas = الأقلية
        - responden = اللي ردّوا على الاستطلاع
        ولطّف زي ما اتعلمت: Hasil ini tampaknya menunjukkan bahwa … = النتيجة دي باين إنها بتوضّح إن …
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: cuma = hanya، terus = lalu، gitu = begitu.
      ar: |
        ستقابل في الاستطلاعات:
        - persen (%) : 60 persen responden = 60% من المشاركين
        - separuh / setengah = النصف، sepertiga = الثلث، seperempat = الربع
        - mayoritas = الأغلبية، minoritas = الأقلّية
        - responden = المستجيبون
        ولطّف كما تعلّمت: Hasil ini tampaknya menunjukkan bahwa … = يبدو أنّ هذه النتيجة تُظهر أنّ …
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: cuma = hanya، terus = lalu، gitu = begitu.
      en: |
        In polls you'll meet:
        - persen (%) : 60 persen responden = 60% of respondents
        - separuh / setengah = half, sepertiga = a third, seperempat = a quarter
        - mayoritas = majority, minoritas = minority
        - responden = respondents
        And hedge as you learned: Hasil ini tampaknya menunjukkan bahwa … = These results seem to show that …
        The dialogue uses street forms; the formal ones are beside them: cuma = hanya, terus = lalu, gitu = begitu.
    examples:
      - text: Sepertiga responden membaca berita setiap hari.
        ar_eg: تلت المشاركين بيقروا الأخبار كل يوم.
        ar: ثلث المستجيبين يقرؤون الأخبار يوميًّا.
        en: A third of respondents read the news every day.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: responden
        ar_eg: المشاركين في الاستطلاع
        ar: المستجيبون
        en: respondents
      - text: mayoritas
        ar_eg: الأغلبية
        ar: الأغلبية
        en: majority
      - text: separuh
        ar_eg: النص
        ar: النصف
        en: half
      - text: sepertiga
        ar_eg: التلت
        ar: الثلث
        en: a third
      - text: hasil
        ar_eg: نتيجة
        ar: نتيجة
        en: result
    words: [responden, mayoritas, separuh, sepertiga, hasil]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: 50% يعني إيه بالإندونيسي؟
      ar: كيف تقول 50% بالإندونيسية بكلمة؟
      en: How do you say 50% as a word?
    options: [sepertiga, separuh, seperempat]
    answer: 1
    words: [separuh]
    explain:
      ar_eg: ٥٠٪ = النص = separuh. sepertiga = التلت، وseperempat = الربع.
      ar: ٥٠٪ = النصف = separuh. أما sepertiga فالثلث، وseperempat الربع.
      en: "50% is half: separuh. sepertiga is a third and seperempat a quarter."
  - id: e03
    type: fill_blank
    sentence: ___ responden setuju dengan kebijakan baru itu.
    meaning:
      ar_eg: أغلبية المشاركين موافقين على السياسة الجديدة.
      ar: توافق أغلبية المستجيبين على تلك السياسة الجديدة.
      en: The majority of respondents agree with the new policy.
    options: [Mayoritas, Minoritas, Hasil]
    answers: [Mayoritas]
    words: [mayoritas, responden]
    explain:
      ar_eg: «الأغلبية» = Mayoritas. Minoritas = الأقلية (عكسها)، وHasil = نتيجة.
      ar: «الأغلبية» = Mayoritas. أما Minoritas فالأقلّية، وHasil النتيجة.
      en: "\"The majority\" is mayoritas. minoritas is the minority, and hasil a result."
  - id: e04
    type: listen
    text: Hasil survei menunjukkan bahwa sepertiga warga belanja daring. Sisanya masih lebih suka pergi ke pasar atau toko.
    question:
      ar_eg: الأغلبية بتشتري إزاي؟
      ar: كيف تتسوّق الأغلبية؟
      en: How do most residents shop?
    options:
      - Kebanyakan warga belanja daring.
      - Separuh warga belanja daring, separuh lagi di pasar.
      - Kebanyakan warga masih belanja langsung di pasar atau toko.
    answer: 2
    meaning:
      ar_eg: نتيجة الاستطلاع بتوضّح إن تلت الناس بيشتروا أونلاين. الباقي لسه بيفضّلوا يروحوا السوق أو المحل.
      ar: تُظهر نتيجة الاستطلاع أنّ ثلث السكّان يتسوّقون إلكترونيًّا، أما البقية فما زالوا يفضّلون السوق أو المتجر.
      en: The survey shows a third of residents shop online. The rest still prefer going to the market or a shop.
    explain:
      ar_eg: sepertiga = التلت بس أونلاين، وsisanya = الباقي (التلتين) لسه في السوق، يعني الأغلبية.
      ar: sepertiga = الثلث فقط إلكترونيًّا، وsisanya = البقية (الثلثان) في السوق، أي الأغلبية.
      en: sepertiga = only a third online; sisanya = the rest (two thirds) still go to markets, the majority.
    words: [hasil, sepertiga]
  - id: e05
    type: build_sentence
    source:
      ar_eg: نص المشاركين بيستخدموا المحفظة الإلكترونية.
      ar: نصف المستجيبين يستعملون المحفظة الرقمية.
      en: Half of the respondents use an e-wallet.
    answer: Separuh responden memakai dompet digital.
    distractors: [sepertiga, mayoritas]
    words: [separuh, responden]
    explain:
      ar_eg: «نص» = Separuh. sepertiga = تلت، وmayoritas = أغلبية (أكتر من النص).
      ar: «النصف» = Separuh. أما sepertiga فالثلث، وmayoritas الأغلبية.
      en: "\"Half\" is separuh. sepertiga is a third, and mayoritas means more than half."
  - id: e06
    type: translate
    direction: from_target
    source_text: Hasil ini tampaknya menunjukkan bahwa mayoritas warga puas, walaupun sampelnya belum besar.
    answers_meaning:
      ar_eg:
        - النتيجة دي باين إنها بتوضّح إن أغلبية الناس راضيين، مع إن العينة لسه مش كبيرة.
        - يبدو إن النتيجة دي بتقول إن أغلب السكان مبسوطين، رغم إن العينة لسه صغيرة.
      ar:
        - يبدو أنّ هذه النتيجة تُظهر رضا أغلبية السكّان، وإن كانت العيّنة غير كبيرة بعد.
        - تشير هذه النتيجة على ما يبدو إلى أنّ أغلب السكّان راضون، رغم أنّ العيّنة ما زالت صغيرة.
      en:
        - These results seem to show that most residents are satisfied, although the sample isn't large yet.
        - It seems these results show the majority are happy, even though the sample is still small.
    explain:
      ar_eg: tampaknya بتليّن الحكم، وwalaupun = مع إن، بتجيب التحفظ.
      ar: tampaknya تليّن الحكم، وwalaupun = وإن، وتأتي بالتحفّظ.
      en: tampaknya softens the claim; walaupun = although, adding the caveat.
    words: [hasil, mayoritas]
  - id: e07
    type: dictation
    text: Sepertiga responden tidak menjawab pertanyaan itu.
    meaning:
      ar_eg: تلت المشاركين ماردّوش على السؤال ده.
      ar: لم يُجب ثلث المستجيبين عن ذلك السؤال.
      en: A third of respondents didn't answer that question.
    words: [sepertiga, responden]
  - id: e08
    type: speaking
    text: Hasil survei ini menarik, tetapi respondennya hanya seratus orang.
    meaning:
      ar_eg: نتيجة الاستطلاع ده مثيرة، بس المشاركين مية واحد بس.
      ar: نتيجة هذا الاستطلاع لافتة، لكنّ المستجيبين مئة شخص فقط.
      en: This survey's result is interesting, but there were only a hundred respondents.
    words: [hasil, responden]
dialogue:
  title: Membaca hasil survei
  lines:
    - speaker: Rina
      text: Mohamed, lihat deh. Mayoritas anak muda baca berita di TikTok!
      ar_eg: يا محمد، بص ده. أغلبية الشباب بيقروا الأخبار على تيك توك!
      ar: يا محمد، انظر. أغلبية الشباب يقرؤون الأخبار على تيك توك!
      en: Mohamed, look at this. Most young people read the news on TikTok!
    - speaker: Mohamed
      text: Respondennya berapa?
      ar_eg: المشاركين كام واحد؟
      ar: كم عدد المستجيبين؟
      en: How many respondents were there?
    - speaker: Rina
      text: Cuma dua ratus orang, terus separuhnya dari Jakarta.
      ar_eg: ميتين واحد بس، ونصهم من جاكرتا.
      ar: مئتان فقط، ونصفهم من جاكرتا.
      en: Only two hundred, and half of them from Jakarta.
    - speaker: Mohamed
      text: Kalau gitu, hasilnya barangkali kurang mewakili seluruh Indonesia, dong.
      ar_eg: يبقى النتيجة يمكن ماتمثّلش إندونيسيا كلها قوي.
      ar: إذن ربّما لا تمثّل النتيجة إندونيسيا كلّها تمامًا.
      en: In that case, the result perhaps doesn't quite represent all of Indonesia.
