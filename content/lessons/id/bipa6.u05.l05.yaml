schema: kabar.lesson/v1
id: bipa6.u05.l05
language: id
title: Siap siaga bencana
can_do:
  ar_eg: تفهم تعليمات الطوارئ وتشرح تعمل إيه لو جه إنذار تسونامي.
  ar: أن تفهم تعليمات الطوارئ وتشرح ما تفعله عند إنذار التسونامي.
  en: Follow emergency instructions and explain what to do in a tsunami warning.
slides:
  - title: Tahu jalan sebelum bencana
    body:
      ar_eg: |
        بعد ٢٠٠٤، آتشيه اتعلمت إن الاستعداد بينجّي الأرواح. الكلمات دي هتلاقيها على اللافتات:
        - kesiapsiagaan = الاستعداد للطوارئ (من siap siaga = جاهز ومنتبه)
        - peringatan dini = إنذار مبكر
        - sirene = صفارة إنذار
        - jalur evakuasi = طريق الإخلاء، عليه أسهم
        - titik kumpul = نقطة التجمع
        في بندا آتشيه فيه مباني عالية مخصوص للهروب من التسونامي، بيسموها gedung evakuasi.
      ar: |
        تعلّمت آتشيه بعد ٢٠٠٤ أنّ الاستعداد ينقذ الأرواح. ستجد هذه الكلمات على اللافتات:
        - kesiapsiagaan = الجاهزية للطوارئ (من siap siaga = مستعدّ متيقّظ)
        - peringatan dini = إنذار مبكّر
        - sirene = صفّارة إنذار
        - jalur evakuasi = مسار الإخلاء، وعليه أسهم
        - titik kumpul = نقطة التجمّع
        وفي باندا آتشيه مبانٍ عالية مخصّصة للنجاة من التسونامي تُسمّى gedung evakuasi.
      en: |
        After 2004, Aceh learned that being prepared saves lives. You'll see these words on signs:
        - kesiapsiagaan = preparedness (from siap siaga = ready and alert)
        - peringatan dini = early warning
        - sirene = siren
        - jalur evakuasi = evacuation route, marked with arrows
        - titik kumpul = assembly point
        Banda Aceh has tall buildings built for escaping tsunamis, called gedung evakuasi.
    examples:
      - text: Kalau sirene berbunyi, ikuti jalur evakuasi ke titik kumpul.
        ar_eg: لو صفارة الإنذار اشتغلت، امشي في طريق الإخلاء لحد نقطة التجمع.
        ar: إذا دوّت صفّارة الإنذار فاتّبع مسار الإخلاء إلى نقطة التجمّع.
        en: If the siren sounds, follow the evacuation route to the assembly point.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kesiapsiagaan
        ar_eg: الاستعداد للطوارئ
        ar: الجاهزية
        en: preparedness
      - text: peringatan dini
        ar_eg: إنذار مبكر
        ar: إنذار مبكّر
        en: early warning
      - text: sirene
        ar_eg: صفارة إنذار
        ar: صفّارة إنذار
        en: siren
      - text: jalur evakuasi
        ar_eg: طريق الإخلاء
        ar: مسار الإخلاء
        en: evacuation route
      - text: titik kumpul
        ar_eg: نقطة التجمع
        ar: نقطة التجمّع
        en: assembly point
    words: [kesiapsiagaan, peringatan dini, sirene, jalur evakuasi, titik kumpul]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: سمعت الـ sirene. تعمل إيه الأول؟
      ar: سمعت الـ sirene. ماذا تفعل أوّلًا؟
      en: You hear the sirene. What do you do first?
    options:
      - تروح البحر تتفرج.
      - تمشي في طريق الإخلاء.
      - تكمل نوم.
    answer: 1
    words: [sirene, jalur evakuasi]
  - id: e03
    type: listen
    text: Sistem peringatan dini mengirim pesan ke ponsel warga dalam beberapa menit.
    question:
      ar_eg: نظام الإنذار المبكر بيعمل إيه؟
      ar: ماذا يفعل نظام الإنذار المبكّر؟
      en: What does the early-warning system do?
    options:
      - بيبني بيوت جديدة.
      - بيقفل المدارس.
      - بيبعت رسايل لموبايلات الناس.
    answer: 2
    words: [peringatan dini]
  - id: e04
    type: fill_blank
    sentence: Setelah keluar dari gedung, semua karyawan berkumpul di ___.
    meaning:
      ar_eg: بعد ما خرجوا من المبنى، كل الموظفين اتجمعوا في نقطة التجمع.
      ar: بعد الخروج من المبنى، تجمّع الموظّفون كلّهم في نقطة التجمّع.
      en: After leaving the building, all the staff gathered at the assembly point.
    options: [titik kumpul, sirene, peringatan dini]
    answers: [titik kumpul]
    words: [titik kumpul]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «kesiapsiagaan» جاية من أنهي كلمتين؟
      ar: من أيّ كلمتين جاءت «kesiapsiagaan»؟
      en: Which two words does "kesiapsiagaan" come from?
    options:
      - siap + siaga
      - siapa + saja
      - sia + sia
    answer: 0
    explain:
      ar_eg: siap = جاهز، siaga = منتبه. ke-…-an بتعملها اسم.
      ar: siap = مستعدّ، siaga = متيقّظ، وke-…-an تجعلها اسمًا.
      en: siap = ready, siaga = alert; ke-…-an turns them into a noun.
    words: [kesiapsiagaan]
  - id: e06
    type: build_sentence
    source:
      ar_eg: المدرسة بتعمل تدريب على الاستعداد للطوارئ كل سنة.
      ar: تُجري المدرسة تدريبًا على الجاهزية كلّ سنة.
      en: The school holds a preparedness drill every year.
    answer: Sekolah mengadakan latihan kesiapsiagaan setiap tahun.
    distractors: [sirene, kumpul]
    words: [kesiapsiagaan]
  - id: e07
    type: translate
    direction: from_target
    source_text: Jangan menunggu sirene. Kalau gempa kuat, langsung ikuti jalur evakuasi.
    answers_meaning:
      ar_eg:
        - ماتستناش صفارة الإنذار. لو الزلزال قوي، امشي في طريق الإخلاء على طول.
        - ماتستناش الصفارة. لو الهزة جامدة، اتبع طريق الإخلاء فورًا.
      ar:
        - لا تنتظر صفّارة الإنذار؛ إن كان الزلزال قويًّا فاتّبع مسار الإخلاء فورًا.
        - لا تنتظر الصفّارة، وإذا اشتدّ الزلزال فاسلك مسار الإخلاء مباشرة.
      en:
        - Don't wait for the siren. If the quake is strong, follow the evacuation route at once.
        - Don't wait for the siren; in a strong quake, take the evacuation route straight away.
    words: [sirene, jalur evakuasi]
  - id: e08
    type: speaking
    text: Di mana titik kumpul terdekat dari hotel ini?
    meaning:
      ar_eg: فين أقرب نقطة تجمع من الفندق ده؟
      ar: أين أقرب نقطة تجمّع من هذا الفندق؟
      en: Where's the nearest assembly point to this hotel?
    words: [titik kumpul]
  - id: e09
    type: dictation
    text: Peringatan dini memberi warga waktu untuk menyelamatkan diri.
    meaning:
      ar_eg: الإنذار المبكر بيدي الناس وقت ينجّوا نفسهم.
      ar: يمنح الإنذار المبكّر السكّانَ وقتًا لينجوا بأنفسهم.
      en: Early warning gives residents time to save themselves.
    words: [peringatan dini]
  - id: e10
    type: fill_blank
    sentence: Ikuti tanda panah di ___ menuju gedung yang tinggi.
    meaning:
      ar_eg: امشي ورا الأسهم اللي في طريق الإخلاء لحد المبنى العالي.
      ar: اتّبع الأسهم على مسار الإخلاء نحو المبنى العالي.
      en: Follow the arrows along the evacuation route to the tall building.
    options: [jalur evakuasi, titik kumpul, kesiapsiagaan]
    answers: [jalur evakuasi]
    words: [jalur evakuasi]
dialogue:
  title: Latihan di sekolah
  lines:
    - speaker: Kak Rahmah
      text: Hari ini ada latihan kesiapsiagaan di sekolah adik saya.
      ar_eg: النهارده فيه تدريب طوارئ في مدرسة أخويا الصغير.
      ar: اليوم تدريب على الجاهزية في مدرسة أخي الصغير.
      en: There's a preparedness drill at my little brother's school today.
    - speaker: Mohamed
      text: Apa yang dilakukan anak-anak kalau sirene berbunyi?
      ar_eg: الأطفال بيعملوا إيه لما الصفارة تضرب؟
      ar: ماذا يفعل الأطفال حين تدوّي الصفّارة؟
      en: What do the children do when the siren sounds?
    - speaker: Kak Rahmah
      text: Mereka berjalan cepat lewat jalur evakuasi ke titik kumpul di lapangan.
      ar_eg: بيمشوا بسرعة في طريق الإخلاء لحد نقطة التجمع في الملعب.
      ar: يمشون بسرعة في مسار الإخلاء إلى نقطة التجمّع في الملعب.
      en: They walk quickly along the evacuation route to the assembly point on the field.
    - speaker: Mohamed
      text: Bagus. Peringatan dini tidak cukup kalau orang tidak tahu jalannya.
      ar_eg: حلو. الإنذار المبكر مش كفاية لو الناس مش عارفة الطريق.
      ar: أحسنتم، فالإنذار المبكّر لا يكفي إن لم يعرف الناس الطريق.
      en: Good. An early warning isn't enough if people don't know the way.
