schema: kabar.lesson/v1
id: bipa6.u05.l11
language: id
title: Bangkit bersama
can_do:
  ar_eg: توصف إزاي مجتمع رجع وقف على رجليه بعد كارثة.
  ar: أن تصف كيف نهض مجتمع من جديد بعد كارثة.
  en: Describe how a community got back on its feet after a disaster.
slides:
  - title: Kapal di tengah kota
    body:
      ar_eg: |
        اقرا (مكتوب للدرس):
        Gelombang tsunami menyeret sebuah kapal pembangkit listrik beberapa kilometer ke tengah kota. Kini kapal PLTD Apung itu menjadi tempat mengenang. Aceh bangkit dengan gotong royong. Bantuan datang dari banyak negara, dan pada tahun 2005 perjanjian damai ditandatangani di Helsinki. Dari bencana lahirlah harapan baru.
        - bangkit = يقوم / ينهض، gotong royong = تعاون الكل في الشغل
        - bantuan = مساعدة، harapan = أمل
        - في الشارع: kebawa = terbawa (اتشال / اتجرف)، susah = sulit (صعب)، udah = sudah (خلاص / بالفعل)، emang = memang (فعلًا)، tapi = tetapi (بس / لكن).
      ar: |
        اقرأ (نصّ مكتوب للدرس):
        Gelombang tsunami menyeret sebuah kapal pembangkit listrik beberapa kilometer ke tengah kota. Kini kapal PLTD Apung itu menjadi tempat mengenang. Aceh bangkit dengan gotong royong. Bantuan datang dari banyak negara, dan pada tahun 2005 perjanjian damai ditandatangani di Helsinki. Dari bencana lahirlah harapan baru.
        - bangkit = ينهض، gotong royong = العمل الجماعي التطوّعي
        - bantuan = مساعدة، harapan = أمل
        - في كلام الشارع: kebawa = terbawa (انجرف)، susah = sulit (صعب)، udah = sudah (قد / بالفعل)، emang = memang (حقًّا)، tapi = tetapi (لكن).
      en: |
        Read (written for the lesson):
        Gelombang tsunami menyeret sebuah kapal pembangkit listrik beberapa kilometer ke tengah kota. Kini kapal PLTD Apung itu menjadi tempat mengenang. Aceh bangkit dengan gotong royong. Bantuan datang dari banyak negara, dan pada tahun 2005 perjanjian damai ditandatangani di Helsinki. Dari bencana lahirlah harapan baru.
        - bangkit = to rise again, gotong royong = working together as a community
        - bantuan = aid, help, harapan = hope
        - On the street: kebawa = terbawa (carried along), susah = sulit (hard), udah = sudah (already), emang = memang (indeed), tapi = tetapi (but).
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bangkit
        ar_eg: ينهض / يقوم من تاني
        ar: ينهض
        en: to rise again
      - text: gotong royong
        ar_eg: تعاون الكل في الشغل
        ar: العمل الجماعي التطوّعي
        en: working together as a community
      - text: bantuan
        ar_eg: مساعدة
        ar: مساعدة
        en: aid, help
      - text: harapan
        ar_eg: أمل
        ar: أمل
        en: hope
    words: [bangkit, gotong royong, bantuan, harapan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي حصل سنة 2005 حسب النص؟
      ar: ماذا حدث عام 2005 بحسب النص؟
      en: What happened in 2005, according to the text?
    options:
      - التسونامي ضرب آتشيه.
      - المركب اتنقل للبحر.
      - اتفاقية سلام اتمضت في هلسنكي.
    answer: 2
    words: [harapan]
    explain:
      ar_eg: سنة 2005 اتمضت اتفاقية السلام في هلسنكي. التسونامي كان 2004، والمركب ماتنقلش للبحر.
      ar: في 2005 وُقّع اتفاق السلام في هلسنكي؛ أمّا التسونامي ففي 2004، والسفينة لم تُنقل إلى البحر.
      en: In 2005 the peace deal was signed in Helsinki. The tsunami was in 2004, and the ship wasn't moved to sea.
  - id: e03
    type: fill_blank
    sentence: Warga membersihkan masjid secara ___ setiap Jumat.
    meaning:
      ar_eg: الأهالي بينضّفوا الجامع مع بعض كل جمعة.
      ar: ينظّف الأهالي المسجد معًا كلّ جمعة.
      en: Residents clean the mosque together every Friday.
    options: [gotong royong, bantuan, harapan]
    answers: [gotong royong]
    words: [gotong royong]
    explain:
      ar_eg: «مع بعض» = secara gotong royong. bantuan = مساعدة وharapan = أمل، ومش طريقة شغل.
      ar: «معًا تعاونًا» secara gotong royong؛ أمّا bantuan (مساعدة) وharapan (أمل) فلا تصفان طريقة العمل.
      en: "\"Together\" is secara gotong royong. bantuan (aid) and harapan (hope) don't describe how the work is done."
  - id: e04
    type: listen
    text: Bantuan dari luar negeri mulai tiba beberapa hari setelah bencana.
    question:
      ar_eg: المساعدة من برّه وصلت إمتى؟
      ar: متى وصلت المساعدة من الخارج؟
      en: When did foreign aid arrive?
    options:
      - بعد الكارثة بكام يوم.
      - قبل الكارثة.
      - بعد تلات سنين.
    answer: 0
    words: [bantuan, bencana]
  - id: e05
    type: build_sentence
    source:
      ar_eg: آتشيه قامت من تاني بالتعاون.
      ar: نهضت آتشيه من جديد بالتعاون.
      en: Aceh rose again through working together.
    answer: Aceh bangkit kembali dengan gotong royong.
    distractors: [bantuan, harapan]
    words: [bangkit, gotong royong]
    explain:
      ar_eg: «قامت تاني» = bangkit kembali و«بالتعاون» = dengan gotong royong. bantuan وharapan زيادة.
      ar: «نهضت من جديد» bangkit kembali و«بالتعاون» dengan gotong royong؛ أمّا bantuan وharapan فزائدتان.
      en: "\"Rose again\" is bangkit kembali and \"through working together\" is dengan gotong royong. bantuan and harapan aren't needed."
  - id: e06
    type: translate
    direction: from_target
    source_text: Anak-anak muda Aceh membawa harapan baru bagi kota ini.
    answers_meaning:
      ar_eg:
        - شباب آتشيه جايبين أمل جديد للمدينة دي.
        - شباب آتشيه بيدّوا المدينة دي أمل جديد.
      ar:
        - يحمل شباب آتشيه أملًا جديدًا لهذه المدينة.
        - جاء شباب آتشيه بأمل جديد لهذه المدينة.
      en:
        - Aceh's young people bring new hope to this city.
        - The youth of Aceh are bringing this city new hope.
    words: [harapan]
  - id: e07
    type: speaking
    text: Setelah bencana, kita harus bangkit bersama.
    meaning:
      ar_eg: بعد الكارثة، لازم نقوم كلنا مع بعض.
      ar: بعد الكارثة علينا أن ننهض معًا.
      en: After a disaster, we must rise again together.
    words: [bangkit]
  - id: e08
    type: dictation
    text: Terima kasih atas bantuan dan doa dari seluruh dunia.
    meaning:
      ar_eg: شكرًا على المساعدة والدعا من الدنيا كلها.
      ar: شكرًا على المساعدة والدعاء من العالم كلّه.
      en: Thank you for the help and prayers from all over the world.
    words: [bantuan]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة أنسب كآخر جملة في نص عن إعادة البناء؟
      ar: أيّ جملة أنسب لختام نصّ عن إعادة الإعمار؟
      en: Which sentence best ends a text about rebuilding?
    options:
      - Semua rumah hancur.
      - Dari reruntuhan, tumbuhlah harapan dan kota yang bangkit kembali.
      - Bantuan tidak pernah datang.
    answer: 1
    words: [harapan, bangkit]
    explain:
      ar_eg: نص عن إعادة البنا يقفل بالأمل والمدينة اللي قامت. التانيين سلبيين وعكس رسالة النص.
      ar: يُختم نصّ إعادة الإعمار بالأمل ونهوض المدينة؛ والآخران سلبيّان يناقضان رسالته.
      en: A rebuilding text ends with hope and a city rising again. The other two are negative and contradict it.
  - id: e10
    type: match_pairs
    pairs:
      - text: kepanikan
        ar_eg: هلع، ذعر
        ar: هلع، ذعر
        en: panic
      - text: dievakuasi
        ar_eg: اتجلوا لمكان آمن
        ar: أُجلي
        en: to be evacuated
      - text: roboh
        ar_eg: اتهد، وقع
        ar: انهار، تهدّم
        en: to collapse
      - text: serpihan
        ar_eg: شظايا، حتت صغيرة
        ar: شظايا
        en: fragments, shards
      - text: longsor
        ar_eg: انهيار أرضي
        ar: انهيار أرضي
        en: landslide
    words: [kepanikan, dievakuasi, roboh, serpihan, longsor]
dialogue:
  title: Di atas kapal PLTD Apung
  lines:
    - speaker: Mohamed
      text: Kapal sebesar ini sampai ke sini? Aku hampir nggak percaya.
      ar_eg: مركب بالحجم ده وصل لحد هنا؟ مش قادر أصدّق.
      ar: سفينة بهذا الحجم وصلت إلى هنا؟ لا أكاد أصدّق.
      en: A ship this big got all the way here? I can hardly believe it.
    - speaker: Kak Rahmah
      text: Kota ini dulu hancur. Sekarang lihat, sekolah dan pasar udah dibangun lagi.
      ar_eg: المدينة دي كانت اتدمّرت. بص دلوقتي، المدارس والسوق اتبنوا تاني.
      ar: تهدّمت هذه المدينة يومًا. انظر الآن، أعيد بناء المدارس والسوق.
      en: This city was destroyed. Look now, the schools and the market have been rebuilt.
    - speaker: Mohamed
      text: Apa rahasianya, Kak?
      ar_eg: إيه السر يا كاك؟
      ar: ما السرّ؟
      en: What's the secret, Kak?
    - speaker: Kak Rahmah
      text: Bantuan emang penting, tapi yang utama gotong royong dan iman.
      ar_eg: المساعدة مهمة طبعًا، بس الأهم التعاون والإيمان.
      ar: المساعدة مهمّة حقًّا، لكنّ الأهمّ التعاون والإيمان.
      en: Aid matters, of course, but what counts most is working together, and faith.
