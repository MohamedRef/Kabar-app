schema: kabar.lesson/v1
id: bipa2.u08.l02
language: id
title: Ketika dan sambil
can_do:
  ar_eg: تربط حاجتين بيحصلوا في نفس الوقت.
  ar: أن تربط بين حدثين يقعان في الوقت نفسه.
  en: Link simultaneous events.
slides:
  - title: Ketika, waktu, saat = لما
    body:
      ar_eg: |
        ketika وwaktu وsaat معناهم «لما»:
        - ketika: أرسمي شوية، بتلاقيها في الكتابة والحكايات.
        - waktu: العادية في الكلام، وأصلها من العربي «وقت».
        - saat: «في اللحظة اللي…».
        حطها قبل الجملة الأولى، وبعدها فاصلة والجملة التانية.
      ar: |
        ketika وwaktu وsaat بمعنى «عندما»:
        - ketika: أكثر رسمية، وتكثر في الكتابة والسرد.
        - waktu: الأشيع في الكلام، وأصلها العربية «وقت».
        - saat: في اللحظة التي…
        وتأتي قبل الجملة الأولى ثم فاصلة ثم الجملة الرئيسية.
      en: |
        ketika, waktu and saat all mean "when":
        - ketika: a little more formal, common in writing and stories.
        - waktu: the everyday one; it comes from Arabic «وقت».
        - saat: "at the moment when…".
        Put it before the first clause, then a comma and the main clause.
    grammar: id.conjunction.time
    examples:
      - text: Ketika kami sampai, hujan mulai turun.
        ar_eg: لما وصلنا، المطر بدأ ينزل.
        ar: عندما وصلنا بدأ المطر يهطل.
        en: When we arrived, it began to rain.
      - text: Waktu kecil, saya tinggal di Kairo.
        ar_eg: وأنا صغير كنت عايش في القاهرة.
        ar: عندما كنت صغيرًا عشت في القاهرة.
        en: When I was little, I lived in Cairo.
  - title: Sambil = وأنا بـ…
    body:
      ar_eg: |
        sambil = نفس الشخص بيعمل حاجتين مع بعض. زي الحال عندنا بالظبط: «بسمع مزيكا وأنا راكب الأتوبيس».
        الترتيب: الفاعل + فعل + sambil + فعل تاني.
      ar: |
        sambil لفاعل واحد يجمع بين فعلين في وقت واحد، كالجملة الحالية في العربية: «أستمع إلى الموسيقى وأنا في الحافلة».
        الترتيب: الفاعل + فعل + sambil + فعل آخر.
      en: |
        sambil = one person doing two things at once — just like an Arabic ḥāl clause: «بسمع مزيكا وأنا راكب».
        Order: subject + verb + sambil + second verb.
    grammar: id.conjunction.time
    examples:
      - text: Saya mendengarkan musik sambil naik bus.
        ar_eg: بسمع مزيكا وأنا راكب الأتوبيس.
        ar: أستمع إلى الموسيقى وأنا أركب الحافلة.
        en: I listen to music while riding the bus.
      - text: Pak sopir menyetir sambil bernyanyi.
        ar_eg: الأسطى بيسوق وهو بيغني.
        ar: السائق يقود وهو يغنّي.
        en: The driver drives while singing.
  - title: Sambil atau ketika?
    body:
      ar_eg: |
        sambil لنفس الشخص بس. لو شخصين مختلفين بيعملوا حاجتين، استخدم ketika (أو waktu).
        ❌ Saya membaca sambil adik saya tidur.
        ✅ Saya membaca ketika adik saya tidur.
      ar: |
        sambil لفاعل واحد فقط، فإن اختلف الفاعلان فاستعمل ketika أو waktu.
        ❌ Saya membaca sambil adik saya tidur.
        ✅ Saya membaca ketika adik saya tidur.
      en: |
        sambil needs the same person. With two different people, use ketika (or waktu).
        ❌ Saya membaca sambil adik saya tidur.
        ✅ Saya membaca ketika adik saya tidur.
    grammar: id.conjunction.time
    examples:
      - text: Saya membaca ketika adik saya tidur.
        ar_eg: كنت بقرا لما أخويا الصغير كان نايم.
        ar: كنت أقرأ عندما كان أخي الصغير نائمًا.
        en: I was reading while my little brother slept.
  - title: Selama = طول ما
    body:
      ar_eg: |
        إنت عارف selama من «selama dua minggu» (لمدة أسبوعين). قبل مكان أو حدث معناها «طول ما»: Selama di bus = طول ما أنا في الأتوبيس.
      ar: |
        عرفتَ selama في «selama dua minggu» (لمدة أسبوعين)، وقبل مكان أو حدث تعني «طوال ما»: Selama di bus = طوال وجودي في الحافلة.
      en: |
        You know selama from "selama dua minggu" (for two weeks). Before a place or event it means "all the while": Selama di bus = the whole time on the bus.
    grammar: id.conjunction.time
    examples:
      - text: Selama di bus, saya tidur.
        ar_eg: طول ما أنا في الأتوبيس كنت نايم.
        ar: نمت طوال وجودي في الحافلة.
        en: I slept the whole time on the bus.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ketika
        ar_eg: لما
        ar: عندما
        en: when
      - text: sambil
        ar_eg: وهو بيعمل… (نفس الشخص)
        ar: وهو يفعل… (الفاعل نفسه)
        en: while (same person)
      - text: selama
        ar_eg: طول ما
        ar: طوال
        en: all the while, during
      - text: sopir
        ar_eg: سوّاق
        ar: سائق
        en: driver
    words: [ketika, sambil, selama, sopir]
  - id: e02
    type: fill_blank
    sentence: Saya minum kopi ___ membaca koran.
    meaning:
      ar_eg: بشرب قهوة وأنا بقرا الجرنال.
      ar: أشرب القهوة وأنا أقرأ الجريدة.
      en: I drink coffee while reading the newspaper.
    options: ["akhirnya", "pertama", "sambil"]
    answers: [sambil]
    words: [sambil]
  - id: e03
    type: multiple_choice
    question: Ibu memasak ___ ayah membaca koran.
    question_meaning:
      ar_eg: ماما بتطبخ لما بابا بيقرا الجرنال. (شخصين مختلفين)
      ar: الأم تطبخ بينما يقرأ الأب الجريدة. (فاعلان مختلفان)
      en: Mum cooks while Dad reads the newspaper. (two different people)
    options: ["ketika", "sambil"]
    answer: 0
    explain:
      ar_eg: هنا شخصين مختلفين (ibu وayah)، يبقى ketika. sambil لنفس الشخص بس.
      ar: الفاعلان مختلفان (ibu وayah)، فتُستعمل ketika، لأن sambil لفاعل واحد.
      en: Two different people (ibu, ayah), so ketika; sambil is for one person only.
    words: [ketika, sambil]
  - id: e04
    type: listen
    text: Ketika kami sampai, hujan mulai turun.
    options: ["Setelah kami sampai, hujan mulai turun.", "Sebelum kami sampai, hujan mulai turun.", "Ketika kami sampai, hujan mulai turun."]
    answer: 2
    words: [ketika]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ الجملتين صحيحة؟
      en: Which sentence is correct?
    options: ["Saya membaca ketika adik saya tidur.", "Saya membaca sambil adik saya tidur."]
    answer: 0
    explain:
      ar_eg: أنا بقرا وأخويا هو اللي نايم، يعني شخصين، فلازم ketika.
      ar: القارئ غير النائم، فالفاعلان مختلفان ويلزم ketika.
      en: The reader and the sleeper are different people, so ketika.
    words: [ketika, sambil]
  - id: e06
    type: fill_blank
    sentence: ___ kecil, saya tinggal di Kairo.
    meaning:
      ar_eg: وأنا صغير كنت عايش في القاهرة.
      ar: عندما كنت صغيرًا عشت في القاهرة.
      en: When I was little, I lived in Cairo.
    options: ["Waktu", "Sambil", "Akhirnya"]
    answers: [Waktu]
    explain:
      ar_eg: waktu = لما (ومن العربي «وقت»). sambil محتاجة فعلين لنفس الشخص في نفس الجملة.
      ar: waktu = عندما (من «وقت»)، أما sambil فتربط فعلين لفاعل واحد.
      en: waktu = when (← Arabic «وقت»); sambil links two actions of one person.
    words: [waktu]
  - id: e07
    type: fill_blank
    sentence: Jangan main HP ___ menyetir!
    meaning:
      ar_eg: ماتلعبش في الموبايل وإنت سايق!
      ar: لا تستعمل الهاتف وأنت تقود!
      en: Don't use your phone while driving!
    options: ["pertama", "akhirnya", "sambil"]
    answers: [sambil]
    words: [sambil, menyetir]
  - id: e08
    type: build_sentence
    source:
      ar_eg: بسمع مزيكا وأنا راكب الأتوبيس.
      ar: أستمع إلى الموسيقى وأنا أركب الحافلة.
      en: I listen to music while riding the bus.
    answer: Saya mendengarkan musik sambil naik bus.
    distractors: [ketika, kami]
    words: [sambil, mendengarkan]
  - id: e09
    type: build_sentence
    source:
      ar_eg: لما كنت في بيدوجول، المطر نزل.
      ar: عندما كنت في بيدوغول هطل المطر.
      en: When I was in Bedugul, it rained.
    answer: Ketika saya di Bedugul, hujan turun.
    distractors: [sambil, ke]
    words: [ketika, hujan]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ديماس بياكل وهو بيتفرج على التليفزيون.
      ar: يأكل ديماس وهو يشاهد التلفاز.
      en: Dimas eats while watching TV.
    answers:
      - Dimas makan sambil menonton TV.
      - Dimas makan sambil menonton TV
      - Dimas makan sambil nonton TV.
      - Dimas makan sambil nonton TV
      - Dimas makan sambil menonton televisi.
    explain:
      ar_eg: نفس الشخص (Dimas) بيعمل حاجتين، يبقى sambil. nonton هي الشكل العامي لـ menonton.
      ar: الفاعل واحد (Dimas) فتُستعمل sambil، وnonton صيغة عامية لـ menonton.
      en: One person (Dimas) doing two things, so sambil; nonton is the casual form of menonton.
    words: [sambil, menonton]
  - id: e11
    type: translate
    direction: from_target
    source_text: Selama di bus, saya tidur.
    answers_meaning:
      ar_eg: ["طول ما أنا في الأتوبيس كنت نايم.", "نمت طول ما أنا في الأتوبيس", "نمت طول الطريق في الأتوبيس"]
      ar: ["نمت طوال وجودي في الحافلة.", "طوال الوقت في الحافلة كنت نائمًا", "نمت طوال الرحلة في الحافلة"]
      en: ["I slept the whole time on the bus.", "While on the bus, I slept.", "I slept all the way on the bus"]
    words: [selama]
  - id: e12
    type: dictation
    text: Pak sopir menyetir sambil bernyanyi.
    meaning:
      ar_eg: الأسطى بيسوق وهو بيغني.
      ar: السائق يقود وهو يغنّي.
      en: The driver drives while singing.
    words: [sopir, menyetir, sambil]
  - id: e13
    type: speaking
    text: Saya melihat pemandangan sambil naik bus ke Bedugul.
    meaning:
      ar_eg: بتفرج على المنظر وأنا راكب الأتوبيس لبيدوجول.
      ar: أشاهد المناظر وأنا في الحافلة إلى بيدوغول.
      en: I look at the scenery while riding the bus to Bedugul.
    words: [pemandangan, sambil]
dialogue:
  title: Di bus ke Bedugul
  lines:
    - speaker: Ni Luh
      text: Mohamed, kamu sudah makan?
      ar_eg: يا محمد، أكلت؟
      ar: يا محمد، هل أكلت؟
      en: Mohamed, have you eaten?
    - speaker: Mohamed
      text: Sudah. Saya makan roti sambil menunggu bus di terminal.
      ar_eg: أيوه. أكلت عيش وأنا مستني الأتوبيس في الموقف.
      ar: نعم، أكلت خبزًا وأنا أنتظر الحافلة في المحطة.
      en: Yes. I ate some bread while waiting for the bus at the terminal.
    - speaker: Ni Luh
      text: Ketika saya datang, kamu sedang apa?
      ar_eg: لما أنا جيت، كنت بتعمل إيه؟
      ar: عندما وصلتُ، ماذا كنت تفعل؟
      en: When I arrived, what were you doing?
    - speaker: Mohamed
      text: Saya mendengarkan musik sambil melihat pemandangan.
      ar_eg: كنت بسمع مزيكا وأنا بتفرج على المنظر.
      ar: كنت أستمع إلى الموسيقى وأنا أتأمل المناظر.
      en: I was listening to music while looking at the scenery.
    - speaker: Ni Luh
      text: Selama di bus, saya mau tidur. Boleh?
      ar_eg: طول ما إحنا في الأتوبيس عايزة أنام. ينفع؟
      ar: أريد أن أنام طوال الطريق في الحافلة. هل يجوز؟
      en: I want to sleep for the whole bus ride. Is that OK?
    - speaker: Mohamed
      text: Boleh! Ketika kita sampai, saya panggil kamu.
      ar_eg: طبعًا! لما نوصل هنادي عليكي.
      ar: بالطبع! عندما نصل سأناديكِ.
      en: Sure! When we arrive, I'll call you.
new_words:
  - word: ketika
    pos: conjunction
    ar_eg: لما
    ar: عندما
    en: when
  - word: saat
    pos: conjunction
    ar_eg: لما، في اللحظة اللي
    ar: عندما، في اللحظة التي
    en: when, at the moment
  - word: sambil
    pos: conjunction
    ar_eg: وهو بيعمل… (نفس الشخص)
    ar: في أثناء (لفاعل واحد)
    en: while (same person)
  - word: menyetir
    pos: verb
    ar_eg: يسوق (عربية)
    ar: يقود (سيارة)
    en: to drive
  - word: sopir
    pos: noun
    ar_eg: سوّاق
    ar: سائق
    en: driver
  - word: pemandangan
    pos: noun
    ar_eg: منظر
    ar: منظر طبيعي
    en: scenery, view
