schema: kabar.lesson/v1
id: bipa1.u02.l05
language: id
title: Mas, Mbak, Kak, Dik
can_do:
  ar_eg: تنادي الأصغر بـ Mas وMbak وKak وDik وتطلب حاجة.
  ar: أن تخاطب الأصغر بـ Mas وMbak وKak وDik وتطلب شيئًا.
  en: Address younger people with Mas, Mbak, Kak and Dik and ask for things.
slides:
  - title: Mas, Mbak, Kak, Dik
    body:
      ar_eg: |
        - Mas: لشاب في سنك أو أكبر شوية (جرسون، سواق، بيّاع).
        - Mbak: لبنت / ست شابة في سنك.
        الاتنين أصلهم جاوي، وبيتقالوا في جاوة كلها.
        - Kak: «أخ / أخت كبيرة»، للراجل والست، منتشرة في المحلات والأونلاين.
        - Dik: لحد أصغر منك.
      ar: |
        - Mas: للشاب في مثل سنك أو أكبر قليلًا (نادل، سائق، بائع).
        - Mbak: للشابة في مثل سنك.
        وكلتاهما جاوية الأصل، وتُستعمل في جاوة كلها.
        - Kak: «الأخ / الأخت الأكبر»، للجنسين، شائعة في المتاجر وعلى الإنترنت.
        - Dik: لمن هو أصغر منك.
      en: |
        - Mas: a young man around your age or a bit older (waiter, driver, shop assistant).
        - Mbak: a young woman around your age.
        Both are Javanese in origin and used all over Java.
        - Kak: "older sibling", for either gender — very common in shops and online.
        - Dik: someone younger than you.
    grammar: id.address.terms
    examples:
      - text: Mbak, minta teh, ya.
        ar_eg: لو سمحتي، شاي.
        ar: من فضلكِ، شايًا.
        en: Miss, some tea, please.
      - text: Terima kasih, Kak!
        ar_eg: شكرًا! (لبيّاع / بيّاعة)
        ar: شكرًا! (للبائع أو البائعة)
        en: Thanks! (to a shop assistant)
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Mas
        ar_eg: لشاب في سنك
        ar: للشاب في مثل سنك
        en: young man
      - text: Mbak
        ar_eg: لبنت في سنك
        ar: للشابة في مثل سنك
        en: young woman
      - text: Kak
        ar_eg: لحد أكبر منك شوية (ولد أو بنت)
        ar: لمن هو أكبر منك قليلًا (ذكرًا أو أنثى)
        en: someone a bit older (either gender)
      - text: Dik
        ar_eg: لحد أصغر منك
        ar: لمن هو أصغر منك
        en: someone younger
      - text: teh
        ar_eg: شاي
        ar: شاي
        en: tea
      - text: air putih
        ar_eg: مية سادة
        ar: ماء عادي
        en: plain water
    words: [Mas, Mbak, Kak, Dik, teh, air putih]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الجرسون شاب حوالي ٢٥ سنة. تناديه بإيه؟
      ar: النادل شاب في نحو الخامسة والعشرين. بماذا تناديه؟
      en: The waiter is a young man of about 25. What do you call him?
    options: [Mas, Kak, Mbak]
    answer: 0
    explain:
      ar_eg: Mas لشاب في سنك، Mbak لبنت، وKak لحد أكبر منك شوية (وشائعة في جاكرتا).
      ar: Mas للشاب في سنك، وMbak للشابة، وKak لمن يكبرك قليلًا (وتشيع في جاكرتا).
      en: Mas for a young man your age, Mbak for a young woman, Kak for someone a bit older (common in Jakarta).
    words: [Mas]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الكاشير بنت في سنك. تقولها «شكرًا» إزاي؟
      ar: أمينة الصندوق شابة في مثل سنك. كيف تشكرها؟
      en: The cashier is a young woman your age. How do you thank her?
    options: ['Terima kasih, Bapak!', 'Terima kasih, Mbak!', 'Terima kasih, Mas!']
    answer: 1
    words: [Mbak]
  - id: e04
    type: listen
    text: Mbak, minta teh, ya.
    options: ['Mas, minta kopi, ya.', 'Mbak, minta teh, ya.', 'Dik, minta air putih, ya.']
    answer: 1
    words: [Mbak, minta, teh]
  - id: e05
    type: fill_blank
    sentence: Dik, minta ___, ya.
    meaning:
      ar_eg: (لولد صغير بيشتغل في الوارونج) يا شاطر، مية سادة لو سمحت.
      ar: (لفتى صغير يعمل في الوارونغ) يا بني، ماءً عاديًّا من فضلك.
      en: (to a young boy at the warung) Water, please.
    options: [air putih, kopi, Mbak]
    answers: [air putih]
    words: [Dik, minta, air putih]
  - id: e06
    type: build_sentence
    source:
      ar_eg: لو سمحتي (لبنت شابة)، شاي.
      ar: من فضلكِ (لشابة)، شايًا.
      en: Miss, some tea, please.
    answer: Mbak, minta teh, ya.
    distractors: [Mas, kopi]
    explain:
      ar_eg: «ya» في الآخر بتخلي الطلب ألطف، زي «لو سمحت».
      ar: «ya» في آخر الطلب تلطّفه، كقولنا «من فضلك».
      en: '"ya" at the end softens a request, like "please".'
    words: [Mbak, minta, teh]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: شكرًا! (لبيّاعة في محل)
      ar: شكرًا! (لبائعة في متجر)
      en: Thanks! (to a shop assistant, using Kak)
    answers: ['Terima kasih, Kak!', 'Terima kasih, Kak', Terima kasih Kak, 'Makasih, Kak!', 'Makasih, Kak']
    words: [Kak, terima kasih]
  - id: e08
    type: translate
    direction: from_target
    source_text: Mas, minta kopi, ya.
    answers_meaning:
      ar_eg: [لو سمحت، قهوة., لو سمحت، واحد قهوة, يا كابتن، قهوة لو سمحت]
      ar: [من فضلك، قهوة., قهوة من فضلك]
      en: ['Coffee, please.', 'Excuse me, a coffee, please', 'A coffee, please']
    words: [Mas, minta, kopi]
dialogue:
  title: Siang di warung Menteng
  lines:
    - speaker: Mas Taufik
      text: Selamat siang, Pak! Bapak mau apa?
      ar_eg: نهارك سعيد يا أستاذ! حضرتك عايز إيه؟
      ar: طاب نهارك يا سيدي! ماذا تريد؟
      en: Good afternoon, sir! What would you like?
    - speaker: Mohamed
      text: Siang, Mas. Saya mau kopi, ya.
      ar_eg: نهارك سعيد. أنا عايز قهوة لو سمحت.
      ar: طاب نهارك. أريد قهوة من فضلك.
      en: Afternoon. I'd like a coffee, please.
    - speaker: Mas Taufik
      text: Baik. Dan Bapak?
      ar_eg: حاضر. وحضرتك؟
      ar: حسنًا. وأنت يا سيدي؟
      en: Sure. And you, sir?
    - speaker: Pak Irwan
      text: Teh, Mas. Terima kasih.
      ar_eg: شاي لو سمحت. شكرًا.
      ar: شايًا من فضلك. شكرًا.
      en: Tea, please. Thank you.
    - speaker: Mohamed
      text: Mbak, minta air putih, ya.
      ar_eg: لو سمحتي، ميّة.
      ar: من فضلكِ، ماءً.
      en: Miss, some water, please.
    - speaker: Mbak Wulan
      text: Baik, Pak!
      ar_eg: حاضر يا أستاذ!
      ar: حسنًا يا سيدي!
      en: Sure, sir!
