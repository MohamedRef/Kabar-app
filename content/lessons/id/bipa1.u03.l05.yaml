schema: kabar.lesson/v1
id: bipa1.u03.l05
language: id
title: Anak-anak
can_do:
  ar_eg: تعد الناس والحاجات وتعمل الجمع.
  ar: أن تعدّ الأشخاص والأشياء وتصوغ الجمع.
  en: Count people and things and make plurals.
slides:
  - title: Dua anak, banyak orang
    body:
      ar_eg: |
        الاستثناء الوحيد: العدد والكمية بييجوا قبل الاسم، زي «تلات كتب».
        - dua anak = عيلين، tiga adik = تلات إخوات صغيرين
        - banyak orang = ناس كتير، semua keluarga saya = عيلتي كلها
        (الأرقام كلها جاية في الوحدة الجاية.)
      ar: |
        الاستثناء الوحيد: العدد والكمية يسبقان الاسم، كقولنا «ثلاثة كتب».
        - dua anak = طفلان، tiga adik = ثلاثة إخوة أصغر
        - banyak orang = ناس كثيرون، semua keluarga saya = عائلتي كلها
        (الأعداد كاملة في الوحدة القادمة.)
      en: |
        The one exception: numbers and quantities go before the noun, like Arabic «ثلاثة كتب».
        - dua anak = two children, tiga adik = three younger siblings
        - banyak orang = many people, semua keluarga saya = all my family
        (The full number system comes next unit.)
    grammar: id.noun-phrase.order
    examples:
      - text: Saya punya dua adik.
        ar_eg: عندي اتنين إخوات أصغر مني.
        ar: لديّ أخوان أصغر مني.
        en: I have two younger siblings.
      - text: Banyak orang di Cikini.
        ar_eg: فيه ناس كتير في تشيكيني.
        ar: في تشيكيني ناس كثيرون.
        en: There are many people in Cikini.
  - title: Anak-anak
    body:
      ar_eg: |
        مافيش جمع تكسير ولا سالم! الاسم لوحده ممكن يبقى واحد أو كتير. ولو عايز تأكد إنهم كتير، كرّر الكلمة بشَرطة: anak-anak = العيال، buku-buku = كتب.
        بس عمرك ما تكرر بعد عدد أو banyak / semua: dua anak مش dua anak-anak.
        وفي الشات بيكتبوها برقم ٢: anak2.
      ar: |
        لا جمع تكسير ولا جمع سالم! الاسم المفرد قد يدل على الواحد أو الكثير، وللتأكيد على الكثرة يُكرَّر بشرطة: anak-anak = الأطفال، buku-buku = كتب.
        ولا يُكرَّر بعد عدد أو بعد banyak / semua: dua anak لا dua anak-anak.
        وفي المحادثات يُكتب التكرار بالرقم ٢: anak2.
      en: |
        No broken or sound plurals! A bare noun can be one or many. To stress "many", repeat it with a hyphen: anak-anak = children, buku-buku = books.
        Never repeat after a number or banyak / semua: dua anak, not dua anak-anak.
        In chats the repeat is written with a 2: anak2.
    grammar: id.reduplication.plural
    examples:
      - text: Anak-anak bermain di taman.
        ar_eg: العيال بيلعبوا في الجنينة.
        ar: الأطفال يلعبون في الحديقة.
        en: The children are playing in the park.
      - text: Buku-buku itu punya Rina.
        ar_eg: الكتب دي بتاعة رينا.
        ar: تلك الكتب لرينا.
        en: Those books are Rina's.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: banyak
        ar_eg: كتير
        ar: كثير
        en: many, a lot
      - text: semua
        ar_eg: كل (الكل)
        ar: كلّ، جميع
        en: all
      - text: dua
        ar_eg: اتنين
        ar: اثنان
        en: two
      - text: tiga
        ar_eg: تلاتة
        ar: ثلاثة
        en: three
      - text: bermain
        ar_eg: يلعب
        ar: يلعب
        en: to play
      - text: taman
        ar_eg: جنينة
        ar: حديقة
        en: park, garden
    words: [banyak, semua, dua, tiga, bermain, taman]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «عيلين» (اتنين أطفال)؟
      ar: كيف تقول «طفلان»؟
      en: How do you say "two children"?
    options: [dua anak, dua anak-anak, anak dua]
    answer: 0
    explain:
      ar_eg: العدد قبل الاسم، ومن غير تكرار لأن العدد بيوضّح إنهم أكتر من واحد.
      ar: العدد قبل الاسم، ولا تكرار لأن العدد يدل على الكثرة.
      en: The number goes first, and no repetition — the number already shows plurality.
    words: [dua, anak]
  - id: e03
    type: listen
    text: Anak-anak bermain di taman.
    options: [Anak saya bermain di taman., Anak-anak bermain di taman., Dua anak bermain di taman.]
    answer: 1
    words: [anak, bermain, taman]
  - id: e04
    type: fill_blank
    sentence: Saya punya ___ adik.
    meaning:
      ar_eg: عندي إخوات صغيرين كتير.
      ar: لديّ إخوة أصغر كثيرون.
      en: I have many younger siblings.
    options: [banyak, besar, yang]
    answers: [banyak]
    words: [banyak, punya]
  - id: e05
    type: fill_blank
    sentence: Buku-___ itu punya Rina.
    meaning:
      ar_eg: الكتب دي بتاعة رينا.
      ar: تلك الكتب لرينا.
      en: Those books are Rina's.
    answers: [buku]
    explain:
      ar_eg: الجمع بالتكرار، يعني buku-buku.
      ar: الجمع بالتكرار، أي buku-buku.
      en: Plural by repetition, so it's buku-buku.
    words: [buku]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: عندي اتنين إخوات أصغر مني.
      ar: لديّ أخوان أصغر مني.
      en: I have two younger siblings.
    answers: [Saya punya dua adik., Saya punya dua adik, Aku punya dua adik., Aku punya dua adik, Saya punya dua orang adik.]
    words: [punya, dua, adik]
  - id: e07
    type: fill_blank
    sentence: ___ anak bermain di taman.
    meaning:
      ar_eg: كل العيال بيلعبوا في الجنينة.
      ar: كل الأطفال يلعبون في الحديقة.
      en: All the children are playing in the park.
    options: [Semua, Buku, Yang]
    answers: [Semua]
    explain:
      ar_eg: "semua = كل، وبعدها الاسم من غير تكرار: semua anak."
      ar: "semua = كلّ، ويليها الاسم بلا تكرار: semua anak."
      en: "semua = all, followed by the noun without repetition: semua anak."
    words: [semua, anak, bermain, taman]
  - id: e08
    type: speaking
    text: Tiga anak bermain di taman.
    meaning:
      ar_eg: تلات عيال بيلعبوا في الجنينة.
      ar: ثلاثة أطفال يلعبون في الحديقة.
      en: Three children are playing in the park.
    words: [tiga, anak, bermain, taman]
  - id: e09
    type: listen
    text: Semua anak di rumah.
    options: ['Semua anak di rumah.', 'Tiga anak di rumah.', 'Banyak anak di rumah.']
    answer: 0
    meaning:
      ar_eg: كل العيال في البيت.
      ar: كل الأطفال في البيت.
      en: All the children are at home.
    words: [semua, tiga, banyak]
  - id: e10
    type: listen
    text: Anak-anak bermain di taman.
    options: ['Dua anak bermain di taman.', 'Anak-anak bermain di taman.', 'Anak-anak di rumah.']
    answer: 1
    meaning:
      ar_eg: العيال بيلعبوا في الجنينة.
      ar: الأطفال يلعبون في الحديقة.
      en: The children are playing in the park.
    words: [anak-anak, bermain, taman]
dialogue:
  title: Keluarga besar Rina
  lines:
    - speaker: Mohamed
      text: Rina, kakakmu yang mana?
      ar_eg: يا رينا، أنهي واحدة أختك الكبيرة؟
      ar: يا رينا، أيّهم أختك الكبرى؟
      en: Rina, which one is your older sister?
    - speaker: Rina
      text: Kakakku yang tinggi itu. Namanya Ayu.
      ar_eg: أختي الكبيرة الطويلة دي. اسمها أيو.
      ar: أختي الكبرى الطويلة تلك. اسمها أيو.
      en: My older sister is the tall one there. Her name is Ayu.
    - speaker: Mohamed
      text: Dan anak-anak itu?
      ar_eg: والعيال دول؟
      ar: وأولئك الأطفال؟
      en: And those children?
    - speaker: Rina
      text: Itu anak-anak Kak Ayu. Dia punya dua anak.
      ar_eg: دول عيال أيو. عندها عيلين.
      ar: أولئك أطفال أيو، فلديها طفلان.
      en: Those are Ayu's children. She has two kids.
    - speaker: Mohamed
      text: Keluargamu besar!
      ar_eg: عيلتك كبيرة!
      ar: عائلتك كبيرة!
      en: Your family is big!
    - speaker: Rina
      text: Ya, keluarga kami besar, tapi rumah kami kecil!
      ar_eg: أيوه، عيلتنا كبيرة، بس بيتنا صغيّر!
      ar: نعم، عائلتنا كبيرة، لكن بيتنا صغير!
      en: Yes, our family is big, but our house is small!
