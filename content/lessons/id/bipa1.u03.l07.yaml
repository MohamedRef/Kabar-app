schema: kabar.lesson/v1
id: bipa1.u03.l07
language: id
title: Om, Tante, Mama, Papa
can_do:
  ar_eg: تنادي قرايبك والكبار زي ما الإندونيسيين بيعملوا، وتتكلم عن حبيب أو توأم.
  ar: أن تنادي الأقارب والكبار كما يفعل الإندونيسيون، وتتحدث عن الخطيب والتوأم.
  en: Address relatives and older people the way Indonesians do; talk about partners and twins.
slides:
  - title: Om dan Tante
    body:
      ar_eg: |
        في المدن العيال بيقولوا Mama وPapa (زي ما إحنا بنقول ماما وبابا).
        om = عمو أو خالو، وtante = طنط. وبيتقالوا كمان لأي حد كبير صاحب أهلك، زي عندنا بالظبط.
        pacar = الحبيب أو الحبيبة قبل الجواز. وsayang = حبيبي، وكمان فعل «يحب»: Papa sayang Mama.
        kembar = توأم، وremaja = مراهق (من حوالي ١٣ لـ ١٩ سنة).
      ar: |
        في المدن يقول الأطفال Mama وPapa.
        om = العمّ أو الخال، وtante = العمّة أو الخالة، وتُقالان أيضًا لكل كبير من معارف الأهل، كما عندنا.
        pacar = الحبيب أو الحبيبة قبل الزواج. وsayang = حبيبي، وهي أيضًا فعل «يحبّ»: Papa sayang Mama.
        kembar = توأم، وremaja = المراهق (من الثالثة عشرة تقريبًا إلى التاسعة عشرة).
      en: |
        In cities children say Mama and Papa.
        om = uncle and tante = aunt, and children use them for any older friend of the family too.
        pacar = boyfriend or girlfriend. sayang = darling, and also the verb "love": Papa sayang Mama.
        kembar = twins, and remaja = a teenager.
    examples:
      - text: Om Hadi dan Tante Wati adik Mama.
        ar_eg: عمو هادي وطنط واتي إخوات ماما الصغيرين.
        ar: العمّ هادي والعمّة ساري أخوا أمّي الأصغران.
        en: Uncle Hadi and Aunt Wati are Mum's younger siblings.
      - text: Anak-anak Tante Wati kembar.
        ar_eg: ولاد طنط واتي توأم.
        ar: أبناء الخالة واتي توأم.
        en: Aunt Wati's children are twins.
      - text: Mama, ini Fajar, pacar saya.
        ar_eg: يا ماما، دا فجر، حبيبي.
        ar: يا أمّي، هذا فجر، خطيبي.
        en: Mum, this is Fajar, my boyfriend.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pacar
        ar_eg: حبيب / حبيبة
        ar: حبيب / حبيبة
        en: boyfriend / girlfriend
      - text: sayang
        ar_eg: حبيبي؛ يحب
        ar: عزيزي؛ يحبّ
        en: darling; to love
      - text: mama
        ar_eg: ماما
        ar: أمّي
        en: mum
      - text: papa
        ar_eg: بابا
        ar: أبي
        en: dad
    words: [pacar, sayang, mama, papa]
  - id: e02
