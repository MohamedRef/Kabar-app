    words: [om, tante, kembar, remaja]
  - id: e03
    type: listen
    text: Mama, ini Fajar, pacar saya.
    question:
      ar_eg: البنت بتعرّف مامتها على مين؟
      ar: بمن تعرّف الفتاة أمّها؟
      en: Who is the girl introducing to her mum?
    options: [حبيبها, ابن عمها, أخوها]
    answer: 0
    meaning:
      ar_eg: يا ماما، دا فجر، حبيبي.
      ar: يا أمّي، هذا فجر، خطيبي.
      en: Mum, this is Fajar, my boyfriend.
    words: [mama, pacar]
  - id: e04
    type: fill_blank
    sentence: Om Hadi adik Papa, dan Tante Wati adik ___.
    meaning:
      ar_eg: عمو هادي أخو بابا الصغير، وطنط واتي أخت ___ الصغيرة.
      ar: العمّ هادي أخو أبي الأصغر، والخالة واتي أخت ___ الصغرى.
      en: Uncle Hadi is Dad's younger brother, and Aunt Wati is ___'s younger sister.
    options: [Mama, pacar, remaja]
    answers: [Mama]
    words: [om, papa, tante, mama]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ولدين اتولدوا في نفس اليوم لنفس الأم. هم…؟
      ar: ولدان وُلدا في اليوم نفسه لأمّ واحدة. هما…؟
      en: Two boys born on the same day to the same mother. They're…?
    options: [kembar, remaja, sepupu]
    answer: 0
    explain:
      ar_eg: kembar = توأم. remaja = مراهق، وsepupu = ابن عم أو خال.
      ar: kembar توأم، وremaja مراهق، وsepupu ابن عمّ أو خال.
      en: kembar = twins; remaja = teenager; sepupu = cousin.
    words: [kembar, remaja]
  - id: e06
    type: build_sentence
    source:
      ar_eg: ولاد طنط واتي توأم.
      ar: أبناء الخالة واتي توأم.
      en: Aunt Wati's children are twins.
    answer: Anak-anak Tante Wati kembar.
    distractors: [pacar, Om]
    words: [tante, kembar]
  - id: e07
    type: fill_blank
    sentence: Fajar ___, dan Sinta anak kecil.
    meaning:
      ar_eg: فجر ___، وسينتا لسه عيلة صغيرة.
      ar: فجر ___، أما سينتا فما زالت طفلة صغيرة.
      en: Fajar is a ___, and Sinta is still a little child.
    options: [remaja, papa, om]
    answers: [remaja]
    words: [remaja]
  - id: e08
    type: translate
    direction: from_target
    source_text: Selamat pagi, sayang!
    answers_meaning:
      ar_eg: [صباح الخير يا حبيبي, صباح الخير يا حبيبتي, صباح الخير يا روحي]
      ar: [صباح الخير يا عزيزي, صباح الخير يا عزيزتي, صباح الخير يا حبيبي, صباح الخير يا حبيبتي]
      en: ['Good morning, dear', 'Good morning, darling', 'Good morning, sweetheart', 'Good morning, love']
    words: [sayang]
  - id: e09
    type: speaking
    text: Papa sayang Mama.
    meaning:
      ar_eg: بابا بيحب ماما.
      ar: أبي يحبّ أمّي.
      en: Dad loves Mum.
    words: [papa, sayang, mama]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: بتكلم أخت مامتك. تناديها إزاي؟
      ar: تكلّم أخت أمك. كيف تناديها؟
      en: You're talking to your mum's sister. What do you call her?
    options: [Tante, Om, Pacar]
    answer: 0
    explain:
      ar_eg: tante للست، وom للراجل، وpacar يعني حبيب.
      ar: tante للمرأة وom للرجل، أما pacar فالحبيب.
      en: tante for a woman, om for a man; pacar is a boyfriend or girlfriend.
    words: [tante, om, pacar]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, ini Tante Wati dan Om Hadi.
      ar_eg: يا محمد، دي طنط واتي ودا عمو هادي.
      ar: يا محمد، هذه الخالة واتي وهذا العمّ هادي.
      en: Mohamed, this is Aunt Wati and Uncle Hadi.
    - speaker: Mohamed
      text: Selamat sore, Tante! Selamat sore, Om!
      ar_eg: مساء الخير يا طنط! مساء الخير يا عمو!
      ar: مساء الخير يا خالة! مساء الخير يا عمّ!
      en: Good afternoon, Aunt! Good afternoon, Uncle!
    - speaker: Tante Wati
      text: Sore! Kamu dari Mesir, ya?
      ar_eg: مساء النور! إنت من مصر، صح؟
      ar: مساء النور! أنت من مصر، أليس كذلك؟
      en: Afternoon! You're from Egypt, right?
    - speaker: Mohamed
      text: Ya, Tante. Ini anak-anak Tante?
      ar_eg: أيوه يا طنط. دول ولادك؟
      ar: نعم يا خالة. هؤلاء أولادك؟
      en: Yes, Aunt. Are these your children?
    - speaker: Tante Wati
      text: Ya, ini Dika dan Doni. Mereka kembar.
      ar_eg: أيوه، دا ديكا ودا دوني. هم توأم.
      ar: نعم، هذا ديكا وهذا دوني، وهما توأم.
      en: Yes, this is Dika and Doni. They're twins.
    - speaker: Om Hadi
      text: Mereka remaja!
      ar_eg: دول مراهقين!
      ar: إنهما مراهقان!
      en: They're teenagers!
