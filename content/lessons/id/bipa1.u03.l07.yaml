schema: kabar.lesson/v1
id: bipa1.u03.l07
language: id
title: Nenek, kakek, sepupu
can_do:
  ar_eg: 'تتكلم عن عيلتك الكبيرة: الجد والجدة والعم والخال وولادهم.'
  ar: 'أن تتحدث عن عائلتك الكبيرة: الجدّين والأعمام والأخوال وأبنائهم.'
  en: 'Talk about your extended family: grandparents, uncles, aunts and cousins.'
slides:
  - title: Keluarga besar
    body:
      ar_eg: |
        nenek = جدة، kakek = جد. وولاد ولادهم: cucu (حفيد أو حفيدة).
        paman = عم أو خال، bibi = عمة أو خالة. الإندونيسي مش بيفرّق بين ناحية الأب وناحية الأم: الاتنين paman والاتنين bibi.
        ولادهم كلهم sepupu (ابن أو بنت عم أو خال)، من غير فرق برضه.
        saudara = أخ أو أخت (ومرات قريب بشكل عام). وbayi = بيبي لسه صغير.
      ar: |
        nenek = جدّة، وkakek = جدّ، وأولاد أولادهما: cucu (حفيد أو حفيدة).
        paman = عمّ أو خال، وbibi = عمّة أو خالة. لا تفرّق الإندونيسية بين جهة الأب وجهة الأم، فكلاهما paman وكلتاهما bibi.
        وأبناؤهم جميعًا sepupu (ابن العم أو الخال وأمثاله) دون تفريق كذلك.
        saudara = أخ أو أخت (وقد تعني القريب عمومًا)، وbayi = الرضيع.
      en: |
        nenek = grandmother, kakek = grandfather, and their grandchildren are cucu.
        paman = uncle and bibi = aunt, on either side: Indonesian doesn't split the father's side from the mother's.
        Their children are all sepupu (cousins), again with no split.
        saudara = brother or sister (sometimes any relative), and bayi = a baby.
    examples:
      - text: Ini nenek dan kakek saya.
        ar_eg: دي جدتي ودا جدي.
        ar: هذه جدّتي وهذا جدّي.
        en: These are my grandmother and grandfather.
      - text: Paman saya punya tiga anak. Mereka sepupu saya.
        ar_eg: عمي عنده ٣ عيال. دول ولاد عمي.
        ar: لعمّي ثلاثة أبناء، هم أبناء عمّي.
        en: My uncle has three children. They're my cousins.
      - text: Bayi itu cucu Bu Yanti.
        ar_eg: البيبي ده حفيد مدام يانتي.
        ar: ذلك الرضيع حفيد السيدة يانتي.
        en: That baby is Mrs Yanti's grandchild.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nenek
        ar_eg: جدة
        ar: جدّة
        en: grandmother
      - text: kakek
        ar_eg: جد
        ar: جدّ
        en: grandfather
      - text: paman
        ar_eg: عم / خال
        ar: عمّ / خال
        en: uncle
      - text: bibi
        ar_eg: عمة / خالة
        ar: عمّة / خالة
        en: aunt
    words: [nenek, kakek, paman, bibi]
  - id: e02
    type: match_pairs
    pairs:
      - text: sepupu
        ar_eg: ابن العم / الخال
        ar: ابن العم / الخال
        en: cousin
      - text: cucu
        ar_eg: حفيد
        ar: حفيد
        en: grandchild
      - text: bayi
        ar_eg: بيبي
        ar: رضيع
        en: baby
      - text: saudara
        ar_eg: أخ / أخت
        ar: أخ / أخت
        en: sibling
    words: [sepupu, cucu, bayi, saudara]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أبو مامتك تقوله إيه بالإندونيسي؟
      ar: بماذا تسمّي أبا أمك بالإندونيسية؟
      en: What do you call your mother's father in Indonesian?
    options: [kakek, paman, cucu]
    answer: 0
    explain:
      ar_eg: kakek = الجد من أي ناحية. paman = عم أو خال، وcucu = حفيد.
      ar: kakek هو الجدّ من أي جهة، وpaman عمّ أو خال، وcucu حفيد.
      en: kakek is a grandfather on either side; paman is an uncle and cucu a grandchild.
    words: [kakek, paman, cucu]
  - id: e04
    type: listen
    text: Bibi saya punya bayi kecil.
    question:
      ar_eg: مين اللي عندها بيبي؟
      ar: مَن عندها رضيع؟
      en: Who has a baby?
    options: [خالتي (أو عمتي), جدتي, بنت عمي]
    answer: 0
    meaning:
      ar_eg: خالتي (أو عمتي) عندها بيبي صغير.
      ar: لخالتي (أو عمّتي) رضيع صغير.
      en: My aunt has a little baby.
    words: [bibi, bayi]
  - id: e05
    type: fill_blank
    sentence: Anak paman saya adalah ___ saya.
    meaning:
      ar_eg: ابن عمي يبقى ___ بتاعي.
      ar: ابن عمّي هو ___ ـي.
      en: My uncle's child is my ___.
    options: [sepupu, cucu, kakek]
    answers: [sepupu]
    words: [paman, sepupu]
  - id: e06
    type: fill_blank
    sentence: Nenek saya punya tiga ___.
    meaning:
      ar_eg: جدتي عندها ٣ أحفاد.
      ar: لجدّتي ثلاثة أحفاد.
      en: My grandmother has three grandchildren.
    options: [cucu, kakek, bibi]
    answers: [cucu]
    words: [nenek, cucu]
  - id: e07
    type: build_sentence
    source:
      ar_eg: جدي وجدتي ساكنين في جاكرتا.
      ar: يسكن جدّي وجدّتي في جاكرتا.
      en: My grandfather and grandmother live in Jakarta.
    answer: Kakek dan nenek saya tinggal di Jakarta.
    distractors: [paman, bayi]
    words: [kakek, nenek]
  - id: e08
    type: translate
    direction: from_target
    source_text: Tono dan Tuti saudara.
    answers_meaning:
      ar_eg: [تونو وتوتي إخوات, تونو وتوتي أخ وأخت]
      ar: [تونو وتوتي أخوان, تونو وتوتي أخ وأخت, تونو وتوتي شقيقان]
      en: [Tono and Tuti are siblings, Tono and Tuti are brother and sister]
    words: [saudara]
  - id: e09
    type: speaking
    text: Dewi bayi bibi saya. Dia sepupu saya.
    meaning:
      ar_eg: ديوي بيبي خالتي. هي بنت خالتي.
      ar: ديوي رضيعة خالتي، فهي ابنة خالتي.
      en: Dewi is my aunt's baby. She's my cousin.
    words: [bayi, bibi, sepupu]
  - id: e10
    type: multiple_choice
    question: Ayah Tono adalah ayah Tuti juga. Tono dan Tuti …
    options: [saudara, sepupu, cucu]
    answer: 0
    explain:
      ar_eg: 'ليهم نفس الأب، يبقوا إخوات: saudara.'
      ar: 'لهما الأب نفسه، فهما أخوان: saudara.'
      en: 'Same father, so they''re siblings: saudara.'
    words: [saudara, sepupu, cucu]
dialogue:
  lines:
    - speaker: Rina
      text: Ini foto keluarga saya.
      ar_eg: دي صورة عيلتي.
      ar: هذه صورة عائلتي.
      en: This is my family photo.
    - speaker: Mohamed
      text: Siapa ini, Rina? Nenek kamu?
      ar_eg: مين دي يا رينا؟ جدتك؟
      ar: من هذه يا رينا؟ جدّتك؟
      en: Who's this, Rina? Your grandmother?
    - speaker: Rina
      text: Ya, ini nenek dan kakek saya.
      ar_eg: أيوه، دي جدتي ودا جدي.
      ar: نعم، هذه جدّتي وهذا جدّي.
      en: Yes, these are my grandmother and grandfather.
    - speaker: Mohamed
      text: Dan bayi kecil ini siapa?
      ar_eg: والبيبي الصغير ده مين؟
      ar: ومن هذا الرضيع الصغير؟
      en: And who's this little baby?
    - speaker: Rina
      text: Itu anak paman saya. Dia sepupu saya.
      ar_eg: ده ابن عمي (sepupu).
      ar: ذاك ابن عمّي.
      en: That's my uncle's child. He's my cousin.
    - speaker: Mohamed
      text: Lucu! Nenek kamu punya banyak cucu, ya?
      ar_eg: عسول! جدتك عندها أحفاد كتير، صح؟
      ar: ما ألطفه! لجدّتك أحفاد كثيرون، أليس كذلك؟
      en: Cute! Your grandmother has lots of grandchildren, right?
