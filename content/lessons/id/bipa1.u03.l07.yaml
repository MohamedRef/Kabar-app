        ar: عمّ / خال
        en: uncle
      - text: tante
        ar_eg: طنط
        ar: عمّة / خالة
        en: aunt
      - text: kembar
        ar_eg: توأم
        ar: توأم
        en: twins
      - text: remaja
        ar_eg: مراهق
        ar: مراهق
