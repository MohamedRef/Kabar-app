schema: kabar.lesson/v1
id: bipa6.u03.l09
language: id
title: Harta dan kenangan
can_do:
  ar_eg: تتكلم عن الورث والوصية والحداد، وتقارن بين المينانج والباتاك.
  ar: أن تتحدث عن الإرث والوصية والحداد، وتقارن بين المينانغ والباتاك.
  en: Talk about inheritance, a will and mourning, and compare Minang and Batak custom.
slides:
  - title: Waris dan wasiat
    body:
      ar_eg: |
        waris = ورث (ahli waris = الورثة؛ من وارث). wasiat = وصية (من وصية).
        berkabung = في حداد. dikenang = بيتفتكر، بيتذكر بالخير (من kenang).
        dusun = قرية صغيرة، نجع. peternak = مربّي مواشي (peternak sapi).
        marga = اسم العيلة عند الباتاك، بييجي من الأب. etnis = عِرق، جماعة إثنية.
        - في الشارع: aku / -ku = saya (أنا)، kebalik = terbalik (بالعكس).
      ar: |
        waris = إرث (ahli waris = الورثة؛ من وارث). wasiat = وصية.
        berkabung = يحدّ، في حداد. dikenang = يُذكَر (بالخير) (من kenang).
        dusun = قرية صغيرة، نجع. peternak = مربّي الماشية (peternak sapi).
        marga = اسم العشيرة عند الباتاك، ينتقل من الأب. etnis = عِرق، جماعة إثنية.
        - في كلام الشارع: aku / -ku = saya (أنا)، kebalik = terbalik (معكوس).
      en: |
        waris = inheritance (ahli waris = heirs; from Arabic وارث). wasiat = will, testament (Arabic وصية).
        berkabung = to be in mourning. dikenang = to be remembered (from kenang).
        dusun = hamlet. peternak = livestock farmer (peternak sapi).
        marga = Batak clan name, passed from the father. etnis = ethnic group.
        - On the street: aku / -ku = saya (I), kebalik = terbalik (the other way round).
    examples:
      - text: Sebelum meninggal, kakek menulis wasiat.
        ar_eg: قبل ما جدي يموت، كتب وصية.
        ar: كتب الجد وصيته قبل وفاته.
        en: Before he died, grandfather wrote a will.
      - text: Seluruh dusun berkabung selama tiga hari.
        ar_eg: النجع كله كان في حداد تلات أيام.
        ar: حدّت القرية كلها ثلاثة أيام.
        en: The whole hamlet mourned for three days.
      - text: Orang Batak mewarisi marga dari ayah.
        ar_eg: الباتاك بيورثوا اسم العشيرة من الأب.
        ar: يرث الباتاك اسم العشيرة عن الأب.
        en: Batak people inherit their marga from their father.
