  - id: e03
    type: listen
    text: Pak Amir dikenang sebagai peternak yang jujur.
    question:
      ar_eg: الناس فاكرة أمير إزاي؟
      ar: كيف يتذكّر الناس أمير؟
      en: How is Pak Amir remembered?
    options: [بيتفتكر بالخير, اتنسى, اتسجن]
    answer: 0
    meaning:
      ar_eg: الحاج أمير بيتفتكر إنه مربّي مواشي أمين.
      ar: يُذكر السيد أمير مربّيًا للماشية أمينًا.
      en: Pak Amir is remembered as an honest cattle farmer.
    words: [dikenang, peternak]
  - id: e04
    type: fill_blank
    sentence: Rumah gadang itu harta pusaka; tidak dibagi menurut hukum ___ Islam.
    meaning:
      ar_eg: الرومة جادانج دي إرث عيلة؛ ما بتتقسمش بقانون ___ الإسلامي.
      ar: تلك الرومة غادانغ إرث عائلي؛ لا تُقسَّم وفق أحكام ___ الإسلامية.
      en: That rumah gadang is clan heritage; it isn't divided under Islamic ___ law.
    options: [waris, wasiat, etnis]
    answers: [waris]
    words: [waris, wasiat, etnis]
    explain:
      ar_eg: قانون الميراث = hukum waris. wasiat = وصية وetnis = عِرق، ومش اسم القانون.
      ar: أحكام الإرث hukum waris؛ أمّا wasiat فوصيّة، وetnis عرق، ولا يُسمّى بهما القانون.
      en: Inheritance law is hukum waris. wasiat is a will, and etnis an ethnic group.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الورقة اللي حد بيكتب فيها هيعمل إيه بأملاكه بعد موته؟
      ar: ما الوثيقة التي يكتب فيها المرء ما يُفعل بأملاكه بعد موته؟
      en: The document saying what to do with your property after you die?
    options: [marga, wasiat, dusun]
    answer: 1
    explain:
      ar_eg: wasiat = وصية، من العربي.
      ar: wasiat = وصية، من العربية.
      en: wasiat = will, from Arabic وصية.
    words: [wasiat, marga, dusun]
  - id: e06
    type: fill_blank
    sentence: Simatupang, Siregar, dan Nasution adalah nama ___ Batak.
    meaning:
      ar_eg: سيماتوبانج وسيريجار وناسوتيون أسامي ___ باتاك.
      ar: سيماتوبانغ وسيريغار وناسوتيون أسماء ___ باتاكية.
      en: Simatupang, Siregar and Nasution are Batak ___ names.
    options: [marga, peternak, dusun]
    answers: [marga]
    words: [marga, peternak, dusun]
    explain:
      ar_eg: "سيماتوبانج وسيريجار أسامي عشاير باتاك: marga. peternak = مربّي مواشي وdusun = قرية."
      ar: سيماتوبانغ وسيريغار أسماء عشائر باتاك marga؛ أمّا peternak فمربّي ماشية، وdusun قرية.
      en: Simatupang and Siregar are Batak clan names, marga. peternak is a herder, and dusun a hamlet.
  - id: e07
    type: multiple_choice
    question: 'Medan adalah kota banyak ___: Batak, Melayu, Jawa, Tionghoa, dan India.'
    options: [wasiat, berkabung, etnis]
    answer: 2
    explain:
      ar_eg: etnis = جماعة إثنية، عِرق.
      ar: etnis = جماعة إثنية.
      en: etnis = ethnic group.
    words: [etnis, wasiat, berkabung]
  - id: e08
    type: build_sentence
    source:
      ar_eg: القرية كلها كانت في حداد على موت الشيخ.
      ar: حدّت القرية كلها على وفاة الشيخ.
      en: The whole village mourned the elder's death.
    answer: Seluruh dusun berkabung atas kematian tetua adat.
    distractors: [marga, waris]
    words: [dusun, berkabung]
    explain:
      ar_eg: «القرية» = dusun و«حزنت على» = berkabung atas. marga وwaris مش في المعنى.
      ar: «القرية» dusun و«حزنت على» berkabung atas؛ أمّا marga وwaris فليستا في المعنى.
      en: "\"The village\" is dusun and \"mourned\" is berkabung atas. marga and waris aren't in the meaning."
  - id: e09
    type: translate
    direction: from_target
    source_text: Peternak itu dikenang oleh seluruh dusun.
    answers_meaning:
      ar_eg: [النجع كله فاكر مربّي المواشي ده, مربّي المواشي ده كل القرية بتفتكره]
      ar: [تتذكّر القرية كلها ذلك المربّي, يذكر أهل القرية جميعًا ذلك المربّي]
      en: [The whole hamlet remembers that farmer, That cattle farmer is remembered by the whole hamlet]
    words: [peternak, dikenang, dusun]
  - id: e10
    type: speaking
    text: Keluarga yang berkabung membaca wasiat ayahnya di depan semua ahli waris.
    meaning:
      ar_eg: العيلة اللي في الحداد قرت وصية أبوهم قدام كل الورثة.
      ar: قرأت الأسرة الحادّة وصية أبيها أمام جميع الورثة.
      en: The mourning family read their father's will before all the heirs.
    words: [berkabung, wasiat, waris]
dialogue:
  lines:
    - speaker: Mohamed
      text: Kalau orang Minang meninggal, siapa ahli warisnya?
      ar_eg: لما حد مينانج يموت، مين الورثة؟
      ar: إذا مات أحد المينانغ فمن ورثته؟
      en: When a Minang person dies, who are the heirs?
    - speaker: Uda Rafi
      text: Harta yang dia cari sendiri ikut aturan waris Islam. Harta pusaka tetap di garis ibu.
      ar_eg: الأملاك اللي كسبها بنفسه بتمشي على قواعد الورث الإسلامي. وإرث العيلة بيفضل في خط الأم.
      ar: ما كسبه بنفسه يتبع قواعد الإرث الإسلامي، ويبقى الإرث العائلي في خط الأم.
      en: What he earned himself follows the rules of Islamic inheritance. Clan heritage stays in the mother's line.
    - speaker: Mohamed
      text: Kata teman Batakku, marga turun dari ayah. Kebalik!
      ar_eg: صاحبي الباتاك قال إن اسم العشيرة بييجي من الأب. بالعكس!
      ar: قال صديقي الباتاكي إن اسم العشيرة يأتي من الأب. العكس تمامًا!
      en: My Batak friend says the marga comes from the father. The opposite!
    - speaker: Uda Rafi
      text: Betul. Sumatra punya banyak etnis, banyak tatanan.
      ar_eg: مظبوط. سومطرة فيها عِرقيات كتير وأنظمة كتير.
      ar: صحيح. في سومطرة جماعات إثنية كثيرة وأنظمة كثيرة.
      en: Right. Sumatra has many ethnic groups, many systems.
    - speaker: Mohamed
      text: Dan semuanya mau dikenang dengan baik.
      ar_eg: وكلهم عايزين الناس تفتكرهم بالخير.
      ar: وكلهم يريدون أن يُذكَروا بخير.
      en: And all of them want to be remembered well.
