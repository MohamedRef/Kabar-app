schema: kabar.lesson/v1
id: bipa7.u06.l09
language: id
title: Keamanan siber
can_do:
  ar_eg: تحمي حساباتك وبياناتك وتتصرّف لو حصل تنمّر أو تسريب.
  ar: أن تحمي حساباتك وبياناتك وتتصرّف عند التنمّر أو التسرّب.
  en: Protect your accounts and data and respond to bullying or a leak.
slides:
  - title: Melindungi diri di internet
    body:
      ar_eg: |
        keamanan siber = الأمن السيبراني.
        pengelabuan (phishing) = رسالة بتقلّد بنك أو شركة علشان تاخد باسوردك.
        rekayasa sosial = الخداع النفسي: «أنا من خدمة العملا، ابعتلي الكود».
        autentikasi dua faktor = تحقّق بخطوتين، أأمن.
        kebocoran data = تسريب بيانات. قانون Pelindungan Data Pribadi (2022) بيتكلّم عن pelindungan data.
        doksing = نشر عنوانك وبياناتك علشان يأذوك. perundungan siber = التنمّر الإلكتروني.
        - في الكلام: gitu = begitu، kalo = kalau، soal = tentang، biar = supaya.
        - kok = استغراب (إزاي؟ ليه كده؟). كلمات صغيرة بتدّي الجملة إحساس، ومن غيرها الجملة صح برضه.
      ar: |
        keamanan siber = الأمن السيبراني.
        pengelabuan (phishing) = رسالة تقلّد مصرفًا أو شركة لتسرق كلمة مرورك.
        rekayasa sosial = الخداع النفسي: «أنا من خدمة العملاء، أرسل إليّ الرمز».
        autentikasi dua faktor = المصادقة الثنائية، وهي أكثر أمانًا.
        kebocoran data = تسرّب البيانات. ويتناول قانون Pelindungan Data Pribadi (2022) مسألة pelindungan data.
        doksing = نشر عنوانك وبياناتك لإيذائك. perundungan siber = التنمّر الإلكتروني.
        - في الكلام اليومي: gitu = begitu، kalo = kalau، soal = tentang، biar = supaya.
        - kok = تعجّب (كيف؟ لماذا هكذا؟). أدوات صغيرة تلوّن الجملة، والجملة صحيحة بدونها.
      en: |
        keamanan siber = cybersecurity.
        pengelabuan (phishing) = a message imitating a bank or company to steal your password.
        rekayasa sosial = social engineering: "I'm from customer service, send me the code."
        autentikasi dua faktor = two-factor authentication, much safer.
        kebocoran data = a data leak. The 2022 Personal Data Protection law covers pelindungan data.
        doksing = publishing your address and details to harm you. perundungan siber = cyberbullying.
        - In speech: gitu = begitu, kalo = kalau, soal = tentang, biar = supaya.
        - kok = surprise (how come?). Small particles that add feeling; the sentence is correct without them.
    examples:
      - text: Pesan itu adalah pengelabuan yang meniru bank.
        ar_eg: الرسالة دي تصيّد بيقلّد البنك.
        ar: تلك الرسالة تصيّد احتيالي يقلّد المصرف.
        en: That message is phishing that imitates a bank.
      - text: Aktifkan autentikasi dua faktor di semua akunmu.
        ar_eg: شغّل التحقّق بخطوتين على كل حساباتك.
        ar: فعّل المصادقة الثنائية في كلّ حساباتك.
        en: Turn on two-factor authentication on all your accounts.
      - text: Korban perundungan siber perlu dukungan, bukan disalahkan.
        ar_eg: ضحية التنمّر الإلكتروني محتاج دعم، مش لوم.
        ar: يحتاج ضحيّة التنمّر الإلكتروني إلى الدعم لا اللوم.
        en: Cyberbullying victims need support, not blame.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: keamanan siber
        ar_eg: الأمن السيبراني
        ar: الأمن السيبراني
        en: cybersecurity
      - text: pengelabuan
        ar_eg: تصيّد احتيالي (فيشينج)
        ar: التصيّد الاحتيالي
        en: phishing, deception
      - text: rekayasa sosial
        ar_eg: هندسة اجتماعية (خداع الناس)
        ar: الهندسة الاجتماعية
        en: social engineering
      - text: autentikasi
        ar_eg: تحقّق من الهوية
        ar: المصادقة
        en: authentication
    words: [keamanan siber, pengelabuan, rekayasa sosial, autentikasi]
  - id: e02
    type: match_pairs
    pairs:
      - text: kebocoran data
        ar_eg: تسريب بيانات
        ar: تسرّب البيانات
        en: data leak
      - text: pelindungan data
        ar_eg: حماية البيانات
        ar: حماية البيانات
        en: data protection
      - text: doksing
        ar_eg: نشر بيانات حد الشخصية علشان يأذوه
        ar: كشف البيانات الشخصية للإيذاء
        en: doxxing
      - text: perundungan siber
        ar_eg: تنمّر إلكتروني
        ar: التنمّر الإلكتروني
        en: cyberbullying
    words: [kebocoran data, pelindungan data, doksing, perundungan siber]
  - id: e03
    type: listen
    text: Setelah kebocoran data, jutaan nomor telepon dijual di internet.
    question:
      ar_eg: حصل إيه قبل ما الأرقام تتباع؟
      ar: ماذا حدث قبل بيع الأرقام؟
      en: What happened before the numbers were sold?
    options: [تسريب بيانات, تحقّق بخطوتين, تنمّر]
    answer: 0
    meaning:
      ar_eg: بعد تسريب البيانات، ملايين أرقام التليفون اتباعت على الإنترنت.
      ar: بعد تسرّب البيانات بيعت ملايين أرقام الهواتف على الإنترنت.
      en: After the data leak, millions of phone numbers were sold online.
    words: [kebocoran data]
  - id: e04
    type: fill_blank
    sentence: 'Penipu itu memakai ___: dia pura-pura menjadi petugas bank.'
    meaning:
      ar_eg: 'النصّاب ده استعمل ___: عمل نفسه موظّف بنك.'
      ar: استعمل المحتال ___ فتظاهر بأنه موظّف مصرف.
      en: 'The scammer used ___: he pretended to be a bank officer.'
    options: [rekayasa sosial, pelindungan data, keamanan siber]
    answers: [rekayasa sosial]
    words: [rekayasa sosial, pelindungan data, keamanan siber]
    explain:
      ar_eg: "rekayasa sosial = الهندسة الاجتماعية: النصّاب بيمثّل إنه موظف بنك علشان ياخد بياناتك. التانيين أسماء حماية."
      ar: rekayasa sosial = الهندسة الاجتماعية، كانتحال صفة موظف بنك.
      en: Pretending to be a bank officer is rekayasa sosial (social engineering).
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «doksing» يعني إيه؟
      ar: ما «doksing»؟
      en: What is 'doksing'?
    options: [Mengunduh film., Menyebarkan alamat dan data pribadi orang lain untuk menyakitinya., Mengganti kata sandi.]
    answer: 1
    explain:
      ar_eg: doksing = نشر بيانات حد علشان يأذوه.
      ar: doksing = نشر بيانات شخص لإيذائه.
      en: doksing = exposing someone's details to harm them.
    words: [doksing]
  - id: e06
    type: fill_blank
    sentence: Kode OTP adalah bagian dari ___.
    meaning:
      ar_eg: كود الـ OTP جزء من ___.
      ar: رمز OTP جزء من ___.
      en: An OTP code is part of ___.
    options: [autentikasi, doksing, pengelabuan]
    answers: [autentikasi]
    words: [autentikasi, doksing, pengelabuan]
    explain:
      ar_eg: كود OTP جزء من autentikasi = التحقق من الهوية. doksing = نشر بيانات حد وpengelabuan = تصيّد.
      ar: رمز OTP جزء من autentikasi أي التحقق من الهوية.
      en: An OTP is part of autentikasi.
  - id: e07
    type: build_sentence
    source:
      ar_eg: قانون حماية البيانات اتطلّع سنة 2022.
      ar: صدر قانون حماية البيانات عام 2022.
      en: The data protection law was passed in 2022.
    answer: Undang-undang pelindungan data disahkan tahun 2022.
    distractors: [kebocoran data, doksing]
    words: [pelindungan data]
    explain:
      ar_eg: Undang-undang pelindungan data (قانون حماية البيانات) + disahkan (اتصدّق عليه) + tahun 2022. kebocoran data وdoksing زيادة.
      ar: Undang-undang pelindungan data disahkan tahun 2022. kebocoran data وdoksing زائدتان.
      en: Undang-undang pelindungan data + disahkan + tahun 2022. The other two are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Jangan klik tautan pengelabuan, sekalipun pesannya tampak resmi.
    answers_meaning:
      ar_eg: [ما تدوسش على لينك التصيّد حتى لو الرسالة باينة رسمية, ما تفتحش لينكات الفيشينج حتى لو الرسالة شكلها رسمي]
      ar: [لا تنقر رابط التصيّد حتى لو بدت الرسالة رسمية, لا تفتح روابط التصيّد الاحتيالي وإن بدت الرسالة رسمية]
      en: ['Don''t click a phishing link, even if the message looks official', 'Never open phishing links, however official the message seems']
    words: [pengelabuan]
  - id: e09
    type: speaking
    text: Kebocoran data dan perundungan siber adalah masalah keamanan siber.
    meaning:
      ar_eg: تسريب البيانات والتنمّر الإلكتروني مشاكل أمن سيبراني.
      ar: تسرّب البيانات والتنمّر الإلكتروني من مشكلات الأمن السيبراني.
      en: Data leaks and cyberbullying are cybersecurity problems.
    words: [kebocoran data, perundungan siber, keamanan siber]
  - id: e10
    type: multiple_choice
    question: Teman sekelas diejek setiap hari di grup daring. Ini disebut ...
    options: [autentikasi, pelindungan data, perundungan siber]
    answer: 2
    explain:
      ar_eg: السخرية من حد كل يوم أونلاين = تنمّر إلكتروني.
      ar: السخرية اليومية من شخص على الإنترنت = تنمّر إلكتروني.
      en: Daily online mocking = cyberbullying.
    words: [perundungan siber, autentikasi, pelindungan data, doksing, rekayasa sosial, keamanan siber]
dialogue:
  lines:
    - speaker: Kaka Yohana
      text: Mohamed, ada pesan dari "bank" yang minta kode OTP-ku.
      ar_eg: يا محمد، جتلي رسالة من «البنك» بيطلبوا كود الـ OTP بتاعي.
      ar: يا محمد، وصلتني رسالة من «المصرف» تطلب رمز OTP.
      en: Mohamed, there's a message from 'the bank' asking for my OTP code.
    - speaker: Mohamed
      text: Jangan kirim, Kaka! Itu pengelabuan.
      ar_eg: ما تبعتيش يا كاكا! ده تصيّد.
      ar: لا ترسليه يا كاكا! هذا تصيّد احتيالي.
      en: Don't send it, Kaka! That's phishing.
    - speaker: Kaka Yohana
      text: Mereka tahu nama lengkapku. Kok bisa?
      ar_eg: عارفين اسمي بالكامل. إزاي؟
      ar: يعرفون اسمي الكامل، فكيف ذلك؟
      en: They know my full name. How?
    - speaker: Mohamed
      text: Mungkin dari kebocoran data. Itu rekayasa sosial biar Kaka percaya.
      ar_eg: يمكن من تسريب بيانات. دي هندسة اجتماعية علشان تصدّقي.
      ar: ربما من تسرّب بيانات، وهذه هندسة اجتماعية لتصدّقيهم.
      en: Maybe from a data leak. It's social engineering so you'll believe them.
    - speaker: Kaka Yohana
      text: Kalo gitu, ini bisa jadi topik siaran kita soal keamanan siber.
      ar_eg: يبقى ده ممكن يبقى موضوع حلقتنا عن الأمن السيبراني.
      ar: إذن قد يصلح هذا موضوعًا لحلقتنا عن الأمن السيبراني.
      en: Then this could be our show's topic on cybersecurity.
