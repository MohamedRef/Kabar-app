dialogue:
  title: Sore di Pantai Pink
  lines:
    - speaker: Mohamed
      text: Lihat deh, anak-anak berlari-larian di Pantai Pink!
      ar_eg: بص، العيال بيجروا هنا وهناك على البينك بيتش!
      ar: انظر، الأطفال يتراكضون على الشاطئ الوردي!
      en: Look, the children are running about on Pink Beach!
    - speaker: Mas Rizal
      text: Iya. Nanti malam aku mau cerita tentang Si Kancil buat mereka.
      ar_eg: أيوه. بالليل هحكيلهم حدوتة الكانتشيل.
      ar: نعم. سأحكي لهم الليلة حكاية الكانتشيل.
      en: Yes. Tonight I'm going to tell them about Si Kancil.
    - speaker: Mohamed
      text: Si Kancil? Siapa tuh?
      ar_eg: الكانتشيل؟ مين ده؟
      ar: الكانتشيل؟ من هو؟
      en: Si Kancil? Who's that?
    - speaker: Mas Rizal
      text: Kancil itu kecil, tapi cerdik. Dia lebih pinter daripada buaya!
      ar_eg: الكانتشيل صغير، بس مكّار. أذكى من التمساح!
      ar: الكانتشيل صغير لكنه ذكي محتال، وهو أذكى من التمساح!
      en: The mouse deer is small but cunning. He's smarter than the crocodile!
