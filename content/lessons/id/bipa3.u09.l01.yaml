        en: to chase each other
      - text: berbondong-bondong
        ar_eg: أفواج / بالكوم
        ar: أفواجًا
        en: in droves
      - text: kancil
        ar_eg: فار الغزال (غزال صغير)
        ar: فأر الغزال (غزال صغير)
        en: mouse deer
      - text: buaya
        ar_eg: تمساح
        ar: تمساح
        en: crocodile
      - text: cerdik
        ar_eg: مكّار / ذكي
        ar: ذكيّ محتال
        en: clever, cunning
    words: [berlari-larian, berkejar-kejaran, berbondong-bondong, kancil, buaya, cerdik]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «بيجروا هنا وهناك»؟
      ar: أيّ كلمة تعني «يتراكضون هنا وهناك»؟
      en: Which word means "running about here and there"?
    options: [berlari, berlari-larian, berlarian-larian]
    answer: 1
    explain:
      ar_eg: الجذر lari بيتكرر، و -an مرة واحدة في الآخر.
      ar: يُكرَّر الجذر lari وتأتي -an مرة واحدة في الآخر.
      en: The root lari doubles, and -an comes once at the end.
    words: [berlari-larian]
