schema: kabar.lesson/v1
id: bipa3.u09.l01
language: id
title: Berlari-larian
can_do:
  ar_eg: تفهم وتستعمل ber- مع التكرار لحركة كتير (berlari-larian، berbondong-bondong).
  ar: أن تفهم ber- مع التكرار للحركة الكثيرة وتستعملها (berlari-larian، berbondong-bondong).
  en: Use ber- with doubling for lots of movement (berlari-larian, berbondong-bondong).
slides:
  - title: ber- + lari-lari + -an
    body:
      ar_eg: |
        انت عارف berlarian من المستوى التاني (بيجروا كتير). في الحواديت هتلاقي الشكل الأقوى:
        ber- + الجذر مكرر + -an = ناس كتير بيعملوا الحاجة هنا وهناك، أو ورا بعض:
        berlari-larian = بيجروا في كل حتة، berkejar-kejaran = بيجروا ورا بعض.
        الجذر هو اللي بيتكرر، و -an مرة واحدة في الآخر.
      ar: |
        تعرف berlarian من المستوى الثاني. وفي الحكايات يكثر الشكل الأقوى:
        ber- + الجذر مكررًا + -an = كثيرون يفعلون الشيء هنا وهناك أو يطارد بعضهم بعضًا:
        berlari-larian = يتراكضون في كل مكان، berkejar-kejaran = يتطاردون.
        يُكرَّر الجذر وتأتي -an مرة واحدة في الآخر.
      en: |
        You know berlarian from BIPA 2. Folk tales love the stronger form:
        ber- + doubled root + -an = many doing it all over, or after each other:
        berlari-larian = run about everywhere, berkejar-kejaran = chase each other.
        The root doubles; -an comes once, at the end.
    grammar: id.reduplication.ber-an
    examples:
      - text: Anak-anak berlari-larian di pantai.
        ar_eg: العيال بيجروا هنا وهناك على الشط.
        ar: يتراكض الأطفال على الشاطئ.
        en: The children are running about on the beach.
      - text: Dua anak berkejar-kejaran di Pantai Pink.
        ar_eg: عيلين بيجروا ورا بعض على البينك بيتش.
        ar: يتطارد طفلان على الشاطئ الوردي.
        en: Two children are chasing each other on Pink Beach.
  - title: Berbondong-bondong
    body:
      ar_eg: |
        berbondong-bondong = جايين أفواج / بالكوم.
        وفي الحواديت الإندونيسية أشهر بطل هو Si Kancil: غزال صغير (فار الغزال) cerdik، يعني مكّار وذكي. زي ما عندنا جحا بيضحك على الناس بذكاه!
      ar: |
        berbondong-bondong = أفواجًا / جماعاتٍ.
        وأشهر أبطال الحكايات الإندونيسية Si Kancil، غزال صغير (فأر الغزال) cerdik أي ذكي محتال، يغلب الأقوياء بحيلته.
      en: |
        berbondong-bondong = in droves, in crowds.
        The best-known folk-tale hero is Si Kancil, a tiny mouse deer who is cerdik (clever, cunning) and beats the strong with his wits.
    grammar: id.reduplication.ber-an
    examples:
      - text: Buaya-buaya datang berbondong-bondong.
        ar_eg: التماسيح جت أفواج.
        ar: جاءت التماسيح أفواجًا.
        en: The crocodiles came in droves.
      - text: Kancil yang cerdik ingin menyeberang sungai.
        ar_eg: الكانتشيل المكّار عايز يعدّي النهر.
        ar: يريد الكانتشيل الذكي أن يعبر النهر.
        en: The clever mouse deer wants to cross the river.
