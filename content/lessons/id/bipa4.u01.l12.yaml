  - id: e10
    type: speaking
    text: Saya berpendapat bahwa perawat adalah profesi terpenting. Dengan demikian, kita harus menghargai mereka.
    meaning:
      ar_eg: أنا شايف إن التمريض أهم مهنة. وبكده، لازم نقدّرهم.
      ar: أرى أن التمريض أهم مهنة، وبذلك يجب أن نقدّر الممرضين.
      en: I believe nursing is the most important profession. Thus, we must value nurses.
    words: [berpendapat, dengan demikian, perawat]
dialogue:
  title: Perjalanan ke Bulukumba
  lines:
    - speaker: Mas Rizal
      text: Mohamed, kalau tinggal di Makassar, kamu mau kerja jadi apa?
      ar_eg: يا محمد، لو عشت في ماكاسار، تحب تشتغل إيه؟
      ar: يا محمد، لو عشتَ في ماكاسار، فبأيّ عمل تحب أن تعمل؟
      en: Mohamed, if you lived in Makassar, what would you like to work as?
    - speaker: Mohamed
      text: Aku mau jadi guru bahasa Arab. Menurutku profesi itu penting banget.
      ar_eg: نفسي أبقى مدرس عربي. أنا شايف إن المهنة دي مهمة جدًا.
      ar: أريد أن أصبح معلمًا للغة العربية، فأنا أرى أنها مهنة مهمة جدًا.
      en: I'd like to be an Arabic teacher. I believe it's a very important profession.
    - speaker: Mas Rizal
      text: Emang kerjanya nggak susah?
      ar_eg: مش الشغلانة دي صعبة؟
      ar: أليس عملًا صعبًا؟
      en: Isn't that hard work?
    - speaker: Mohamed
      text: Susah sih. Profesi itu perlu keahlian dan kesabaran. Kadang guru juga harus lembur.
      ar_eg: فعلًا. المهنة دي محتاجة خبرة وصبر. وساعات المدرس بيشتغل وقت زيادة.
      ar: صحيح، فهي تحتاج إلى الخبرة والصبر، وأحيانًا يعمل المعلم ساعات إضافية.
      en: True. It requires skill and patience, and teachers sometimes work overtime too.
    - speaker: Mas Rizal
      text: Kalau gitu, kamu cocok banget. Kesabaranmu luar biasa!
      ar_eg: يبقى إنت أكيد مناسب ليها. صبرك خرافي!
      ar: إذن فأنت مناسب لها حتمًا، فصبرك مدهش!
      en: Then you'd be perfect for it. Your patience is amazing!
souvenir:
  id: bipa4.u01.souvenir
  title: Kapal Pinisi
  note:
    ar_eg: البينيسي مراكب خشب عملاقة بشراعين، وبحّارة البوجيس والماكاسار لفّوا بيها جزر الأرخبيل كله. لحد النهارده النجارين في بولوكومبا بيبنوها بإيديهم من غير رسم على ورق، والصنعة دي بتتورث من الأب للابن. اليونسكو سجّلت فن بناء البينيسي تراث ثقافي غير مادي للإنسانية، وهي فعلًا خبرة (keahlian) تستاهل الاحترام.
    ar: البينيسي سفن خشبية ضخمة ذات صاريين، جاب بها بحّارة البوغيس والماكاسار جزر الأرخبيل. وما زال نجارو بولوكومبا يبنونها بأيديهم دون مخططات ورقية، ويتوارثون الصنعة جيلًا بعد جيل. وقد أدرجت اليونسكو فن بنائها في قائمة التراث الثقافي غير المادي للإنسانية، فهي خبرة (keahlian) جديرة بالاحترام.
    en: The pinisi is a great two-masted wooden schooner; Bugis and Makassar sailors sailed them all across the archipelago. In Bulukumba, carpenters still build them by hand without paper plans, passing the craft from father to son. UNESCO lists the art of pinisi boatbuilding as Intangible Cultural Heritage — keahlian worth honouring.
