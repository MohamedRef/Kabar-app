  - id: e02
    type: multiple_choice
    question: Maaf, tasmu ___ ke rumah saya.
    question_meaning:
      ar_eg: "شنطة زميلك اتشالت معاك البيت بالغلط. تقوله: «آسف، شنطتك … لبيتي.»"
      ar: "حملتَ حقيبة زميلك إلى بيتك خطأً. تقول: «آسف، حقيبتك … إلى بيتي.»"
      en: Your colleague's bag went home with you by mistake. You say, "Sorry, your bag … to my house."
    options: ["tertinggal", "terbawa", "kesiangan"]
    answer: 1
    explain:
      ar_eg: terbawa ke = اتشالت لمكان بالغلط. tertinggal di = فضلت في مكان.
      ar: terbawa ke = حُملت إلى مكان خطأً، وtertinggal di = بقيت في مكان.
      en: terbawa ke = carried somewhere by mistake; tertinggal di = left somewhere.
    words: [terbawa]
  - id: e03
    type: fill_blank
    sentence: AC di kelas rusak. Kampus memanggil seorang ___.
    meaning:
      ar_eg: التكييف في الفصل بايظ. الجامعة نادت ___.
      ar: المكيّف في الصف معطّل. استدعت الجامعة ___.
      en: The classroom AC is broken. The campus called a ___.
    options: [teknisi, dosen, kru]
    answers: [teknisi]
    words: [teknisi, dosen, kru]
  - id: e04
    type: listen
    text: Saya bangun kesiangan, jadi ketinggalan pesawat.
    options: ["Saya bangun kesiangan, jadi kehujanan di pesawat.", "Saya bangun kesiangan, jadi ketinggalan pesawat.", "Saya tertidur di kantor, jadi ketinggalan pesawat."]
    answer: 1
    meaning:
      ar_eg: صحيت متأخر، فالطيارة فاتتني.
      ar: تأخرت في النوم ففاتتني الطائرة.
      en: I overslept, so I missed the plane.
