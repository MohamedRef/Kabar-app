    direction: to_target
    source_meaning:
      ar_eg: الشغلانة دي محتاجة خبرة وأمانة.
      ar: يتطلب هذا العمل خبرة وأمانة.
      en: This job requires expertise and honesty.
    answers:
      - Pekerjaan ini membutuhkan keahlian dan kejujuran.
      - Pekerjaan ini membutuhkan keahlian dan kejujuran
      - Pekerjaan ini memerlukan keahlian dan kejujuran.
      - Profesi ini membutuhkan keahlian dan kejujuran.
      - Profesi ini memerlukan keahlian dan kejujuran.
      - Pekerjaan ini membutuhkan kejujuran dan keahlian.
      - Pekerjaan ini butuh keahlian dan kejujuran.
