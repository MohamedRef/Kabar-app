schema: kabar.lesson/v1
id: bipa4.u01.l12
language: id
title: Ulangan Unit 1
can_do:
  ar_eg: "تتكلم عن مهنة: صفاتها، مشاكلها، وليه تختارها."
  ar: "أن تعرض مهنة: صفاتها ومتاعبها وسبب اختيارها."
  en: Present a career.
slides:
  - title: ter- atau ke-…-an?
    body:
      ar_eg: |
        فكّرة سريعة قبل المراجعة:
        ter- = حصل من غير قصد (tertidur، terbawa) أو حالة (terletak، terbuat dari، tertutup).
        ke-…-an بعد الشخص = حاجة وحشة حصلتله (kehujanan، kesiangan، kecopetan).
        ke-…-an كاسم = معنى مجرد (kesabaran، keahlian، keselamatan).
      ar: |
        تذكير سريع قبل المراجعة:
        ter- = حدث دون قصد (tertidur، terbawa) أو حالة (terletak، terbuat dari، tertutup).
        ke-…-an بعد الشخص = أصابه أمر مكروه (kehujanan، kesiangan، kecopetan).
        ke-…-an اسمًا = معنى مجرد (kesabaran، keahlian، keselamatan).
      en: |
        Quick reminder before the review:
        ter- = happened by accident (tertidur, terbawa) or a state (terletak, terbuat dari, tertutup).
        ke-…-an after a person = something unpleasant happened (kehujanan, kesiangan, kecopetan).
        ke-…-an as a noun = an abstract idea (kesabaran, keahlian, keselamatan).
    grammar: id.prefix.ter
    examples:
      - text: Saya tertidur, lalu ketinggalan bus.
        ar_eg: النوم غلبني، والأتوبيس فاتني.
        ar: غلبني النوم ففاتتني الحافلة.
        en: I dozed off and then missed the bus.
      - text: Profesi perawat membutuhkan kesabaran.
        ar_eg: مهنة التمريض محتاجة صبر.
        ar: تحتاج مهنة التمريض إلى الصبر.
        en: Nursing requires patience.
