  - word: gaji
    pos: noun
    ar_eg: مرتب
    ar: راتب
    en: salary
  - word: lulus
    pos: verb
    ar_eg: يتخرّج / ينجح
    ar: يتخرّج، ينجح
    en: to graduate, to pass
  - word: pasti
    pos: adverb
    ar_eg: أكيد، لازم
    ar: حتمًا، بالتأكيد
    en: certainly, surely
  - word: butuh
