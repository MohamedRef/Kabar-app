schema: kabar.lesson/v1
id: bipa5.u01.l02
language: id
title: Kalimat majemuk bertingkat
can_do:
  ar_eg: تبني جمل طويلة فيها جملة رئيسية وجملة تابعة، زي جواب التقديم.
  ar: أن تبني جملًا مركّبة من جملة رئيسية وأخرى تابعة، كما في رسالة التقديم.
  en: Build sentences with a main and a subordinate clause, as in a cover letter.
slides:
  - title: Induk dan anak kalimat
    grammar: id.sentence.complex
    body:
      ar_eg: |
        الجملة الطويلة الرسمية فيها حتتين:
        - induk kalimat = الجملة الرئيسية، تقف لوحدها: Saya melamar posisi ini.
        - anak kalimat = الجملة التابعة، بتبدأ بأداة ومتقفش لوحدها: karena saya punya pengalaman.
        أهم الأدوات:
        - السبب: karena، sebab
        - الوقت: ketika، setelah، sejak
        - الشرط: jika، apabila
        - الغرض: agar، supaya
        - النتيجة: sehingga
        - المحتوى: bahwa (= إنّ / أنّ)
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: aja = saja، nyari = mencari، udah = sudah، gede = besar، aku = saya، ngelamar = melamar، banget = sekali.
      ar: |
        للجملة المركّبة الرسمية جزءان:
        - induk kalimat = الجملة الرئيسية، وتستقلّ بنفسها: Saya melamar posisi ini.
        - anak kalimat = الجملة التابعة، وتبدأ بأداة ولا تستقلّ: karena saya punya pengalaman.
        أهم الأدوات:
        - السبب: karena، sebab
        - الزمن: ketika، setelah، sejak
        - الشرط: jika، apabila
        - الغرض: agar، supaya
        - النتيجة: sehingga
        - المضمون: bahwa (= أنّ)
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: aja = saja، nyari = mencari، udah = sudah، gede = besar، aku = saya، ngelamar = melamar، banget = sekali.
      en: |
        A long formal sentence has two parts:
        - induk kalimat = the main clause, which stands alone: Saya melamar posisi ini.
        - anak kalimat = the subordinate clause, which starts with a linker and can't stand alone: karena saya punya pengalaman.
        Key linkers:
        - cause: karena, sebab
        - time: ketika, setelah, sejak
        - condition: jika, apabila
        - purpose: agar, supaya
        - result: sehingga
        - content: bahwa (= that)
        The dialogue uses street forms; the formal ones are beside them: aja = saja, nyari = mencari, udah = sudah, gede = besar, aku = saya, ngelamar = melamar, banget = sekali.
    examples:
      - text: Saya melamar posisi ini karena saya punya pengalaman di bidang pemasaran.
        ar_eg: بقدّم على الوظيفة دي عشان عندي خبرة في التسويق.
        ar: أتقدّم لهذه الوظيفة لأنّ لديّ خبرة في مجال التسويق.
        en: I am applying for this position because I have experience in marketing.
      - text: Perusahaan menulis bahwa syarat utamanya adalah bahasa Inggris.
        ar_eg: الشركة كاتبة إن الشرط الأساسي هو الإنجليزي.
        ar: كتبت الشركة أنّ الشرط الأساسي هو الإنجليزية.
        en: The company wrote that the main requirement is English.
  - title: Koma atau tidak?
    body:
      ar_eg: |
        قاعدة الفاصلة بسيطة:
        - الرئيسية الأول ← من غير فاصلة: Saya pindah ke Balikpapan setelah saya lulus.
        - التابعة الأول ← فاصلة قبل الرئيسية: Setelah saya lulus, saya pindah ke Balikpapan.
        وخد بالك: ماتبدأش بـ «Karena …» وتسكت. «Karena gajinya bagus.» لوحدها ناقصة في الكتابة الرسمية.
        وsyarat (شرط) وkeahlian (من ahli ← أهل) كلمتين هتلاقيهم في كل إعلان وظيفة.
      ar: |
        قاعدة الفاصلة بسيطة:
        - الرئيسية أولًا ← بلا فاصلة: Saya pindah ke Balikpapan setelah saya lulus.
        - التابعة أولًا ← فاصلة قبل الرئيسية: Setelah saya lulus, saya pindah ke Balikpapan.
        ولا تقف عند «Karena …» وحدها، فـ «Karena gajinya bagus.» جملة ناقصة في الكتابة الرسمية.
        وكلمتا syarat (شرط) وkeahlian (من ahli ← أهل) تتكرّران في كل إعلان وظيفة.
      en: |
        The comma rule is simple:
        - Main clause first, no comma: Saya pindah ke Balikpapan setelah saya lulus.
        - Subordinate clause first, comma before the main clause: Setelah saya lulus, saya pindah ke Balikpapan.
        And don't stop at "Karena …": "Karena gajinya bagus." alone is a fragment in formal writing.
        syarat (from شرط) and keahlian (from ahli ← أهل) appear in every job ad.
    examples:
      - text: Jika gajinya sesuai, saya siap mulai bulan depan.
        ar_eg: لو المرتب مناسب، أنا جاهز أبدأ الشهر الجاي.
        ar: إن كان الراتب مناسبًا فأنا مستعدّ للبدء الشهر المقبل.
        en: If the salary is right, I'm ready to start next month.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pengalaman
        ar_eg: خبرة
        ar: خبرة
        en: experience
      - text: syarat
        ar_eg: شرط
        ar: شرط
        en: requirement
      - text: keahlian
        ar_eg: مهارة / تخصص
        ar: مهارة، خبرة متخصّصة
        en: expertise, skill
      - text: gaji
        ar_eg: مرتب
        ar: راتب
        en: salary
      - text: lulus
        ar_eg: يتخرّج / ينجح
        ar: يتخرّج، ينجح
        en: to graduate, to pass
    words: [pengalaman, syarat, keahlian, gaji, lulus]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها الفاصلة صح؟
      ar: في أيّ جملة وُضعت الفاصلة صحيحة؟
      en: Which sentence has the comma right?
    options:
      - Saya pindah ke Balikpapan, setelah saya lulus.
      - Setelah saya lulus, saya pindah ke Balikpapan.
      - Setelah lulus saya, pindah ke Balikpapan.
    answer: 1
    explain:
      ar_eg: التابعة (Setelah saya lulus) جت الأول، فالفاصلة بعدها.
      ar: جاءت التابعة (Setelah saya lulus) أولًا، فالفاصلة بعدها.
      en: The subordinate clause comes first, so the comma follows it.
    words: [lulus]
  - id: e03
    type: fill_blank
    sentence: Saya butuh kursus bahasa Inggris ___ memenuhi syarat perusahaan.
    meaning:
      ar_eg: محتاج كورس إنجليزي عشان أستوفي شروط الشركة.
      ar: أحتاج إلى دورة إنجليزية لكي أستوفي شروط الشركة.
      en: I need an English course in order to meet the company's requirements.
    options: [agar, sehingga, sejak]
    answers: [agar]
    explain:
      ar_eg: ده غرض (عشان)، فالأداة agar. sehingga نتيجة، وsejak «من ساعة».
      ar: هذا غرض، فالأداة agar؛ أما sehingga فللنتيجة وsejak للزمن.
      en: This is purpose, so agar; sehingga is result and sejak means since.
    words: [syarat, butuh]
  - id: e04
    type: listen
    text: Gajinya kecil, sehingga dia pasti butuh pekerjaan lain.
    options:
      - Gajinya besar, sehingga dia pasti tidak pindah.
      - Gajinya kecil, sehingga dia pasti butuh pekerjaan lain.
      - Gajinya kecil, tetapi dia tidak butuh pekerjaan lain.
    answer: 1
    words: [gaji, pasti, butuh]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا بقدّم لأن عندي خبرة خمس سنين.
      ar: أتقدّم لأنّ لديّ خبرة خمس سنوات.
      en: I'm applying because I have five years of experience.
    answer: Saya melamar karena saya punya pengalaman lima tahun.
    distractors: [sehingga, bahwa]
    words: [pengalaman]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: keahlian جاية من ahli، وahli جاية من أنهي كلمة عربي؟
      ar: keahlian من ahli، فمن أيّ كلمة عربية جاءت ahli؟
      en: keahlian comes from ahli; which Arabic word is ahli from?
    options: [أهل, علم, حال]
    answer: 0
    explain:
      ar_eg: ahli من «أهل» (زي «أهل الخبرة»)، يعني خبير. keahlian = الخبرة والمهارة.
      ar: ahli من «أهل» كما في «أهل الخبرة» أي الخبير، وkeahlian هي المهارة.
      en: ahli is from «أهل» (as in "people of expertise"), an expert; keahlian is expertise.
    words: [keahlian]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لو عندك المهارة دي، المرتب أكيد هيبقى أكبر.
      ar: إن كانت لديك هذه المهارة فسيكون الراتب حتمًا أكبر.
      en: If you have this skill, the salary will surely be bigger.
    answers:
      - Jika Anda punya keahlian ini, gajinya pasti lebih besar.
      - Jika Anda memiliki keahlian ini, gajinya pasti lebih besar.
      - Apabila Anda punya keahlian ini, gajinya pasti lebih besar.
      - Apabila Anda memiliki keahlian ini, gajinya pasti lebih besar.
      - Kalau Anda punya keahlian ini, gajinya pasti lebih besar.
    explain:
      ar_eg: الشرط الأول ← jika / apabila وبعدها فاصلة.
      ar: الشرط أولًا ← jika أو apabila ثم فاصلة.
      en: Condition first, so jika / apabila, then a comma.
    words: [keahlian, gaji, pasti]
  - id: e08
    type: speaking
    text: Setelah saya lulus, saya bekerja di bagian pemasaran selama lima tahun.
    meaning:
      ar_eg: بعد ما اتخرّجت، اشتغلت في التسويق خمس سنين.
      ar: بعد تخرّجي عملت في مجال التسويق خمس سنوات.
      en: After I graduated, I worked in marketing for five years.
    words: [lulus, pengalaman, bagian]
  - id: e09
    type: multiple_choice
    question: "Iklan itu menyebutkan bahwa ___ utamanya adalah pengalaman dua tahun di bagian keuangan."
    question_meaning:
      ar_eg: كمّل الجملة. «الإعلان بيقول إن … الأساسي خبرة سنتين في قسم الحسابات.»
      ar: أكمل الجملة. «يذكر الإعلان أنّ … الأساسي خبرة سنتين في القسم المالي.»
      en: Complete the sentence. "The ad says that the main … is two years' experience in the finance department."
    options: [gaji, lulus, syarat]
    answer: 2
    words: [syarat, pengalaman, bagian]
  - id: e10
    type: match_pairs
    pairs:
      - text: pasti
        ar_eg: أكيد
        ar: حتمًا
        en: surely
      - text: butuh
        ar_eg: محتاج
        ar: يحتاج
        en: to need
      - text: bagian
        ar_eg: جزء، قسم
        ar: جزء، قسم
        en: part, department
      - text: gaji
        ar_eg: مرتب
        ar: راتب
        en: salary
    words: [pasti, butuh, bagian, gaji]
dialogue:
  title: Lowongan di perusahaan minyak
  lines:
    - speaker: Mohamed
      text: Mas Rizal, syarat lowongan ini apa aja, sih?
      ar_eg: يا ريزال، إيه شروط الوظيفة دي؟
      ar: يا ريزال، ما شروط هذه الوظيفة؟
      en: Mas Rizal, what are the requirements for this vacancy?
    - speaker: Mas Rizal
      text: Mereka nyari orang yang udah punya pengalaman, karena proyeknya gede.
      ar_eg: هما بيدوّروا على حد عنده خبرة، عشان المشروع كبير.
      ar: يبحثون عن شخص ذي خبرة، لأن المشروع كبير.
      en: They're looking for someone with experience, because the project is big.
    - speaker: Mohamed
      text: Kalau keahlian bahasa Arab dihitung, aku mau ngelamar.
      ar_eg: لو مهارة العربي محسوبة، أنا عايز أقدّم.
      ar: إن كانت مهارة العربية تُحتسب فأنا أريد التقدّم.
      en: If Arabic skills count, I want to apply.
    - speaker: Mas Rizal
      text: Pasti dihitung, dong! Klien mereka banyak yang dari Timur Tengah, jadi bahasa Arab penting banget.
      ar_eg: أكيد محسوبة! عملاء كتير عندهم من الشرق الأوسط، فالعربي مهم.
      ar: بالتأكيد! كثير من عملائهم من الشرق الأوسط، ولذلك فالعربية مهمة.
      en: Of course it counts! Many of their clients are from the Middle East, so Arabic matters.
