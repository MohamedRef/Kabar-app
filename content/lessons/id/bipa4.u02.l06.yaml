schema: kabar.lesson/v1
id: bipa4.u02.l06
language: id
title: Warga protes
can_do:
  ar_eg: تحكي عن احتجاج سكان على قرار وتطالب الجهة المسؤولة بحل.
  ar: أن تروي احتجاج السكان على قرار وتطالب الجهة المختصة بحلّ.
  en: Report residents protesting a decision and urge the authorities to act.
slides:
  - title: Pasar akan ditutup?
    body:
      ar_eg: |
        protes = احتجاج أو يحتج، menentang = يعارض بقوة، mendesak = يضغط ويلح (mendesak pemerintah = يضغط على الحكومة).
        pihak berwenang = الجهة المسؤولة، permohonan = طلب رسمي، ditolak = اترفض.
        tegas = حازم وواضح، prihatin = قلقان ومتأثر (saya prihatin = أنا قلقان على الموضوع).
      ar: |
        protes = احتجاج أو يحتج، menentang = يعارض بشدة، mendesak = يلحّ ويضغط (mendesak pemerintah = يضغط على الحكومة).
        pihak berwenang = الجهة المختصة، permohonan = طلب رسمي، ditolak = رُفض.
        tegas = حازم وصريح، prihatin = قلق ومهموم (saya prihatin = يقلقني الأمر).
      en: |
        protes = protest, to protest; menentang = to oppose; mendesak = to urge, press (mendesak pemerintah).
        pihak berwenang = the authorities; permohonan = formal request, application; ditolak = rejected.
        tegas = firm, clear; prihatin = concerned, worried (saya prihatin = I'm concerned).
    examples:
      - text: Warga protes karena pasar akan ditutup.
        ar_eg: السكان بيحتجوا عشان السوق هيتقفل.
        ar: يحتج السكان لأن السوق سيُغلق.
        en: Residents are protesting because the market will be closed.
      - text: Permohonan kami ditolak oleh kantor kota.
        ar_eg: طلبنا اترفض من مكتب المدينة.
        ar: رُفض طلبنا من مكتب المدينة.
        en: Our request was rejected by the city office.
      - text: Kami mendesak pihak berwenang bertindak tegas.
        ar_eg: إحنا بنضغط على المسؤولين ياخدوا موقف حازم.
        ar: نحثّ الجهات المختصة على التصرف بحزم.
        en: We urge the authorities to act firmly.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: protes
        ar_eg: احتجاج
        ar: احتجاج
        en: protest
      - text: menentang
        ar_eg: يعارض
        ar: يعارض
        en: to oppose
      - text: mendesak
        ar_eg: يضغط ويلح
        ar: يلحّ
        en: to urge
      - text: berwenang
        ar_eg: مسؤول، صاحب سلطة
        ar: مختص، ذو سلطة
        en: in authority
    words: [protes, menentang, mendesak, berwenang]
  - id: e02
    type: match_pairs
    pairs:
      - text: permohonan
        ar_eg: طلب رسمي
        ar: طلب رسمي
        en: formal request
      - text: ditolak
        ar_eg: اترفض
        ar: رُفض
        en: rejected
      - text: tegas
        ar_eg: حازم
        ar: حازم
        en: firm
      - text: prihatin
        ar_eg: قلقان
        ar: قلق
        en: concerned
    words: [permohonan, ditolak, tegas, prihatin]
  - id: e03
    type: listen
    text: Permohonan izin pedagang ditolak lagi.
    question:
      ar_eg: حصل إيه للطلب؟
      ar: ماذا حدث للطلب؟
      en: What happened to the request?
    options: [اترفض, اتقبل, اتأجل]
    answer: 0
    meaning:
      ar_eg: طلب ترخيص التجار اترفض تاني.
      ar: رُفض طلب تصريح التجار مجددًا.
      en: The traders' permit request was rejected again.
    words: [permohonan, ditolak]
  - id: e04
    type: fill_blank
    sentence: Ratusan warga datang untuk ___ di depan kantor kota.
    meaning:
      ar_eg: مئات من السكان جم عشان ___ قدام مكتب المدينة.
      ar: جاء مئات السكان ليـ ___ أمام مكتب المدينة.
      en: Hundreds of residents came to ___ in front of the city office.
    options: [protes, prihatin, tegas]
    answers: [protes]
    words: [protes, prihatin, tegas]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين الجهة اللي في إيدها القرار؟
      ar: من الجهة التي بيدها القرار؟
      en: Who has the power to decide?
    options: [warga yang protes, pihak berwenang, pedagang pasar]
    answer: 1
    explain:
      ar_eg: pihak berwenang = الجهة المسؤولة اللي ليها سلطة.
      ar: pihak berwenang = الجهة المختصة ذات السلطة.
      en: pihak berwenang = the authorities.
    words: [protes, berwenang]
  - id: e06
    type: fill_blank
    sentence: Banyak orang ___ rencana itu karena merusak taman kota.
    meaning:
      ar_eg: ناس كتير ___ الخطة دي عشان بتبوّظ جنينة المدينة.
      ar: كثيرون ___ تلك الخطة لأنها تدمّر حديقة المدينة.
      en: Many people ___ the plan because it ruins the city park.
    options: [menentang, mendesak, permohonan]
    answers: [menentang]
    words: [menentang, mendesak, permohonan]
  - id: e07
    type: multiple_choice
    question: Kami ___ dengan nasib para pedagang kecil.
    options: [tegas, ditolak, prihatin]
    answer: 2
    explain:
      ar_eg: prihatin dengan = قلقان ومتأثر عشان حاجة.
      ar: prihatin dengan = قلق ومهموم بشأن أمر.
      en: prihatin dengan = concerned about.
    words: [tegas, ditolak, prihatin]
  - id: e08
    type: build_sentence
    source:
      ar_eg: السكان بيضغطوا على الحكومة تاخد موقف حازم.
      ar: يضغط السكان على الحكومة لتتخذ موقفًا حازمًا.
      en: Residents urge the government to be firm.
    answer: Warga mendesak pemerintah bersikap tegas.
    distractors: [menentang, prihatin]
    words: [mendesak, tegas, menentang, prihatin]
  - id: e09
    type: translate
    direction: from_target
    source_text: Pihak berwenang tidak menerima permohonan warga.
    answers_meaning:
      ar_eg: [المسؤولين رفضوا طلب السكان, الجهة المسؤولة رفضت طلب الأهالي]
      ar: [رفضت الجهات المختصة طلب السكان, رفض المسؤولون طلب الأهالي]
      en: ['The authorities rejected the residents'' request', 'The authorities turned down the residents'' application']
    words: [berwenang, permohonan]
  - id: e10
    type: speaking
    text: Saya prihatin dan menentang keputusan ini.
    meaning:
      ar_eg: أنا قلقان ومعترض على القرار ده.
      ar: أنا قلق وأعارض هذا القرار.
      en: I'm concerned and I oppose this decision.
    words: [prihatin, menentang, ditolak, berwenang]
dialogue:
  lines:
    - speaker: Pak Amir
      text: Mohamed, kamu lihat ramai-ramai di depan pasar tadi pagi?
      ar_eg: يا محمد، شفت الزحمة اللي قدام السوق الصبح؟
      ar: يا محمد، هل رأيت التجمّع أمام السوق صباح اليوم؟
      en: Mohamed, did you see the crowd in front of the market this morning?
    - speaker: Mohamed
      text: Lihat, Pak. Mereka protes, ya?
      ar_eg: شفت يا أستاذ. كانوا بيحتجوا، صح؟
      ar: رأيته يا سيدي. كانوا يحتجّون، أليس كذلك؟
      en: I did, sir. They were protesting, right?
    - speaker: Pak Amir
      text: Ya. Pedagang menentang rencana penutupan pasar. Permohonan mereka ditolak.
      ar_eg: أيوه. التجار معترضين على خطة قفل السوق. وطلبهم اترفض.
      ar: نعم. يعارض التجار خطة إغلاق السوق، وقد رُفض طلبهم.
      en: Yes. The traders oppose the plan to close the market. Their request was rejected.
    - speaker: Mohamed
      text: Kasihan. Saya prihatin dengan mereka.
      ar_eg: يا حرام. أنا زعلان عليهم.
      ar: مساكين. أنا قلق عليهم.
      en: Poor things. I feel for them.
    - speaker: Pak Amir
      text: Saya akan menulis surat pembaca dan mendesak pihak berwenang bersikap tegas.
      ar_eg: أنا هكتب رسالة للجرنال وأضغط على المسؤولين ياخدوا موقف واضح.
      ar: سأكتب رسالة إلى الصحيفة وأحثّ الجهات المختصة على موقف حازم.
      en: I'll write a letter to the editor and urge the authorities to take a firm stand.
