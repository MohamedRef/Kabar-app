schema: kabar.lesson/v1
id: bipa5.u07.l02
language: id
title: Soto Banjar
can_do:
  ar_eg: تقرا مقال ثقافي عن أكلة وتفهم الأكلة دي اتأثرت بإيه.
  ar: أن تقرأ مقالة ثقافية عن طبق وتفهم مصادر تأثّره.
  en: Read a cultural essay about a dish and see what shaped it.
slides:
  - title: Membaca esai budaya
    body:
      ar_eg: |
        اقرا الفقرة دي:
        Soto Banjar adalah sup ayam bening yang harum. Cara memakai rempahnya, seperti kayu manis, cengkih, dan kapulaga, dipengaruhi oleh pedagang Arab dan India. Sementara itu, perkedel dan bihunnya menunjukkan pengaruh Belanda dan Tionghoa. Satu mangkuk soto ini menceritakan sejarah perdagangan di Banjarmasin.
        الكلمة المهمة pengaruh = تأثير. وخد بالك إن الأكلة بتحكي (menceritakan) التاريخ.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: kayak = seperti، gara-gara = karena، udah = sudah، banget = sekali.
      ar: |
        اقرأ هذه الفقرة:
        Soto Banjar adalah sup ayam bening yang harum. Cara memakai rempahnya, seperti kayu manis, cengkih, dan kapulaga, dipengaruhi oleh pedagang Arab dan India. Sementara itu, perkedel dan bihunnya menunjukkan pengaruh Belanda dan Tionghoa. Satu mangkuk soto ini menceritakan sejarah perdagangan di Banjarmasin.
        والكلمة المهمّة pengaruh = تأثير، ولاحظ أنّ الطبق «يروي» (menceritakan) التاريخ.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: kayak = seperti، gara-gara = karena، udah = sudah، banget = sekali.
      en: |
        Read this paragraph:
        Soto Banjar adalah sup ayam bening yang harum. Cara memakai rempahnya, seperti kayu manis, cengkih, dan kapulaga, dipengaruhi oleh pedagang Arab dan India. Sementara itu, perkedel dan bihunnya menunjukkan pengaruh Belanda dan Tionghoa. Satu mangkuk soto ini menceritakan sejarah perdagangan di Banjarmasin.
        The key word is pengaruh = influence. Note that the dish "tells" (menceritakan) history.
        The dialogue uses street forms; the formal ones are beside them: kayak = seperti, gara-gara = karena, udah = sudah, banget = sekali.
    examples:
      - text: Cara memakai rempahnya dipengaruhi oleh pedagang Arab dan India.
        ar_eg: طريقة استخدام البهارات فيها اتأثرت بالتجار العرب والهنود.
        ar: تأثّرت طريقة استعمال توابلها بالتجّار العرب والهنود.
        en: The way it uses spices was shaped by Arab and Indian traders.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rempah
        ar_eg: بهارات
        ar: توابل
        en: spices
      - text: pengaruh
        ar_eg: تأثير
        ar: تأثير
        en: influence
      - text: harum
        ar_eg: ريحته حلوة
        ar: عطِر
        en: fragrant
      - text: kayu manis
        ar_eg: قرفة
        ar: قرفة
        en: cinnamon
      - text: pedagang
        ar_eg: تاجر
        ar: تاجر
        en: trader
    words: [rempah, pengaruh, harum, kayu manis, pedagang]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: حسب المقال، طريقة استخدام البهارات اتأثرت بمين؟
      ar: بحسب المقالة، بمَن تأثّرت طريقة استعمال التوابل؟
      en: According to the essay, who shaped the way the spices are used?
    options:
      - Pedagang Belanda.
      - Pedagang Tionghoa.
      - Pedagang Arab dan India.
    answer: 2
    words: [rempah, pedagang]
    explain:
      ar_eg: المقال بيقول التجار العرب والهنود هما اللي أثّروا على البهارات. الهولنديين والصينيين أثّروا على البيركيديل والشعرية.
      ar: تذكر المقالة أنّ التجّار العرب والهنود أثّروا في التوابل، أما الهولنديون والصينيون فأثّروا في البيركيديل والشعيرية.
      en: The essay credits Arab and Indian traders for the spices. Dutch and Chinese influence shows in the perkedel and noodles.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: البيركيديل والشعرية بيوروا إيه؟
      ar: علامَ تدلّ البيركيديل والشعيرية؟
      en: What do the perkedel and noodles show?
    options:
      - Pengaruh Belanda dan Tionghoa dalam masakan Banjar.
      - Pengaruh pedagang Arab pada rempah.
      - Soto Banjar berasal dari Jepang.
    answer: 0
    words: [pengaruh]
    explain:
      ar_eg: البيركيديل هولندي والشعرية صيني. العرب والهنود للبهارات، والياباني مااتذكرش.
      ar: البيركيديل هولندي الأصل والشعيرية صينية، أما العرب والهنود فللتوابل، ولم يُذكر اليابانيون.
      en: Perkedel is Dutch and noodles Chinese. Arabs and Indians are behind the spices, and Japan isn't mentioned.
  - id: e04
    type: fill_blank
    sentence: Masakan Banjar mendapat ___ dari banyak budaya.
    meaning:
      ar_eg: أكل البانجار خد تأثير من ثقافات كتير.
      ar: تأثّر مطبخ البانجار بثقافات كثيرة.
      en: Banjar cooking took influence from many cultures.
    options: [pengaruh, rempah, harum]
    answers: [pengaruh]
    words: [pengaruh]
    explain:
      ar_eg: «خد تأثير» = mendapat pengaruh. rempah = بهارات وharum = ريحته حلوة، ومش «يتاخد من ثقافات».
      ar: «تأثّر» = mendapat pengaruh. أما rempah فالتوابل، وharum «عطِر».
      en: "\"Took influence\" is mendapat pengaruh. rempah (spices) and harum (fragrant) don't fit."
  - id: e05
    type: listen
    text: Supnya harum karena ada kayu manis dan cengkih. Rempah itu dulu dibawa oleh pedagang dari luar, bukan ditanam di Banjarmasin.
    question:
      ar_eg: نفهم إيه عن البهارات دي؟
      ar: ماذا نفهم عن هذه التوابل؟
      en: What do we learn about these spices?
    options:
      - Rempah itu ditanam oleh petani Banjarmasin.
      - Rempah itu datang ke Banjarmasin lewat perdagangan.
      - Rempah itu membuat supnya manis seperti gula.
    answer: 1
    meaning:
      ar_eg: ريحة الشوربة حلوة عشان فيها قرفة وقرنفل. البهارات دي زمان جابها تجار من برا، ماكانتش بتتزرع في بانجارماسين.
      ar: الحساء عطِر لأنّ فيه قرفة وقرنفلًا، وهذه التوابل جلبها قديمًا تجّار من الخارج ولم تُزرع في بانجارماسين.
      en: The soup is fragrant because of cinnamon and cloves. Traders brought these spices from outside; they weren't grown in Banjarmasin.
    explain:
      ar_eg: dibawa oleh pedagang dari luar = جابها تجار من برا، يعني جت بالتجارة (perdagangan). bukan ditanam = ماكانتش بتتزرع هناك.
      ar: dibawa oleh pedagang dari luar = جلبها تجّار من الخارج أي عبر التجارة (perdagangan)، وbukan ditanam = لم تُزرع هناك.
      en: dibawa oleh pedagang dari luar = brought by traders from outside, so via trade (perdagangan); bukan ditanam = not grown there.
    words: [harum, kayu manis]
  - id: e06
    type: translate
    direction: from_target
    source_text: Pedagang Arab membawa resep baru ke Banjarmasin, sehingga cara orang memasak sup ikut berubah.
    answers_meaning:
      ar_eg:
        - التجار العرب جابوا وصفات جديدة لبانجارماسين، فطريقة الناس في طبخ الشوربة اتغيرت هي كمان.
        - تجار عرب جابوا وصفات أكل جديدة لبانجارماسين، لدرجة إن طريقة طبخ الشوربة اتغيرت.
      ar:
        - جلب التجّار العرب وصفات جديدة إلى بانجارماسين، فتغيّرت طريقة الناس في طهي الحساء أيضًا.
        - حمل تجّار عرب وصفات طعام جديدة إلى بانجارماسين، حتى تبدّلت طريقة طبخ الحساء.
      en:
        - Arab traders brought new recipes to Banjarmasin, so the way people cooked soup changed too.
        - Arab merchants carried new recipes to Banjarmasin, with the result that soup-making changed as well.
    explain:
      ar_eg: sehingga = فـ / لدرجة إن، بتجيب النتيجة. ikut berubah = اتغيّر هو كمان.
      ar: sehingga = حتى إنّ، وتأتي بالنتيجة. ikut berubah = تغيّر هو أيضًا.
      en: sehingga = so that, bringing the result; ikut berubah = changed along with it.
    words: [pedagang, rempah]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الشوربة دي ريحتها حلوة قوي.
      ar: هذا الحساء عطِر جدًّا.
      en: This soup is very fragrant.
    answer: Sup ini sangat harum.
    distractors: [rempah, pengaruh]
    words: [harum]
    explain:
      ar_eg: «ريحتها حلوة» = harum. rempah = بهارات وpengaruh = تأثير، وهما أسماء مش صفة.
      ar: «عطِر» = harum. أما rempah فالتوابل، وpengaruh التأثير، وهما اسمان.
      en: "\"Fragrant\" is harum. rempah and pengaruh are nouns."
  - id: e08
    type: speaking
    text: Saya suka soto Banjar karena ada kayu manisnya, seperti masakan Mesir.
    meaning:
      ar_eg: أنا بحب سوتو بانجار عشان فيها قرفة، زي الأكل المصري.
      ar: أحبّ سوتو بانجار لأنّ فيها قرفة كالطبخ المصري.
      en: I like soto Banjar because it has cinnamon, like Egyptian cooking.
    words: [kayu manis]
dialogue:
  title: Sarapan soto
  lines:
    - speaker: Rina
      text: Ini soto Banjar. Coba cium, deh. Harum, kan?
      ar_eg: دي سوتو بانجار. شمّ كده، ريحتها حلوة، مش كده؟
      ar: هذه سوتو بانجار. شمّها، عطِرة أليس كذلك؟
      en: This is soto Banjar. Smell it, fragrant, right?
    - speaker: Mohamed
      text: Wah, ada kayu manis! Rasanya kayak di rumah nenekku.
      ar_eg: يا سلام، فيها قرفة! طعمها زي بيت تيتا.
      ar: يا سلام، فيها قرفة! طعمها كبيت جدّتي.
      en: Oh, there's cinnamon! It tastes like my grandmother's house.
    - speaker: Rina
      text: Mungkin gara-gara pengaruh pedagang Arab dulu.
      ar_eg: يمكن عشان تأثير التجار العرب زمان.
      ar: ربّما بسبب تأثير التجّار العرب قديمًا.
      en: Maybe because of the influence of Arab traders long ago.
    - speaker: Mohamed
      text: Jadi resep ini udah jalan jauh banget, ya, dari Timur Tengah sampai ke sini.
      ar_eg: يعني الوصفة دي مشيت مشوار طويل، من الشرق الأوسط لحد هنا.
      ar: إذن قطعت هذه الوصفة طريقًا طويلًا من الشرق الأوسط إلى هنا.
      en: So this recipe travelled far, from the Middle East all the way here.
