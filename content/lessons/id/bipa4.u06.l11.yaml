schema: kabar.lesson/v1
id: bipa4.u06.l11
language: id
title: Poster Budaya Kaili
can_do:
  ar_eg: تقرا بوستر مهرجان وتعرف فيه إيه وفين ومين يقدر يحضر.
  ar: أن تقرأ ملصق مهرجان وتعرف ما فيه وأين يقام ومن يمكنه الحضور.
  en: Read a festival poster and find out what's on, where, and who can come.
slides:
  - title: Poster festival
    body:
      ar_eg: |
        البوستر ده متعلّق في كل فنادق بالو. اقراه وخد بالك من الكلمات اللي بتيجي مع بعض:
        mengadakan festival، menarik wisatawan، melestarikan warisan.
      ar: |
        هذا الملصق معلّق في كل فنادق بالو. اقرأه ولاحظ الكلمات المتلازمة:
        mengadakan festival، menarik wisatawan، melestarikan warisan.
      en: |
        This poster hangs in every hotel in Palu. Read it and notice the word partners:
        mengadakan festival, menarik wisatawan, melestarikan warisan.
    examples:
      - text: Festival Budaya Kaili kembali hadir! Panitia mengadakan pertunjukan tari dan musik Kaili di pantai Teluk Palu.
        ar_eg: مهرجان الثقافة الكايلية راجع تاني! اللجنة المنظمة عاملة عروض رقص ومزيكا كايلي على شط خليج بالو.
        ar: مهرجان الثقافة الكايلية يعود من جديد! تقيم اللجنة المنظمة عروض رقص وموسيقى كايلي على شاطئ خليج بالو.
        en: The Kaili Culture Festival is back! The committee is holding Kaili dance and music performances on the Palu Bay beach.
      - text: Festival ini terbuka untuk umum dan gratis. Wisatawan dapat mencoba makanan khas Kaili, seperti kaledo.
        ar_eg: المهرجان مفتوح للكل وببلاش. السياح يقدروا يدوقوا أكل كايلي المشهور، زي الكاليدو.
        ar: المهرجان مفتوح للجميع ومجاني، ويمكن للسياح تذوّق أطعمة كايلي المميزة مثل الكاليدو.
        en: The festival is open to the public and free. Tourists can try Kaili specialities such as kaledo.
      - text: Mari bersama-sama melestarikan warisan budaya Kaili!
        ar_eg: يلّا نحافظ كلنا مع بعض على تراث كايلي الثقافي!
        ar: هلمّوا نحافظ معًا على التراث الثقافي لشعب كايلي!
        en: Let's preserve Kaili cultural heritage together!
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: العروض هتبقى فين؟
      ar: أين تُقام العروض؟
      en: Where are the performances held?
    options: [Di pantai Teluk Palu, Di Lembah Bada, Di hotel baru]
    answer: 0
    words: [pertunjukan]
    explain:
      ar_eg: الإعلان بيقول إن العروض على شط خليج بالو (pantai Teluk Palu)، مش في وادي بادا ولا في الفندق.
      ar: يقول الإعلان إن العروض على شاطئ خليج بالو (pantai Teluk Palu)، لا في وادي بادا ولا في الفندق.
      en: The poster says the shows are on the Palu Bay beach (pantai Teluk Palu), not in Bada Valley or a hotel.
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح عن المهرجان؟
      ar: أيّ جملة صحيحة عن المهرجان؟
      en: Which sentence about the festival is true?
    options:
      - Festival ini hanya untuk warga Palu.
      - Festival ini gratis dan terbuka untuk umum.
      - Festival ini hanya ada pertunjukan musik.
    answer: 1
    explain:
      ar_eg: المهرجان gratis وterbuka untuk umum = ببلاش ومفتوح للكل. مش لأهل بالو بس، وفيه رقص مش مزيكا بس.
      ar: المهرجان gratis وterbuka untuk umum = مجاني ومفتوح للجميع، لا لأهل بالو وحدهم، وفيه رقص لا موسيقى فقط.
      en: "The festival is gratis and terbuka untuk umum: free and open to all, not just Palu residents, and it has dance as well as music."
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الكاليدو ده إيه؟
      ar: ما الكاليدو؟
      en: What is kaledo?
    options: [Tarian Kaili, Pantai di Palu, Makanan khas Kaili]
    answer: 2
    explain:
      ar_eg: الإعلان بيقول إن kaledo من makanan khas Kaili = أكل كايلي المشهور، مش رقصة ولا شط.
      ar: يقول الإعلان إن kaledo من makanan khas Kaili = طعام كايلي المميز، لا رقصة ولا شاطئ.
      en: The poster lists kaledo as makanan khas Kaili, a Kaili speciality dish, not a dance or a beach.
  - id: e04
    type: listen
    text: Panitia mengadakan pertunjukan tari dan musik Kaili.
    options:
      - Panitia melestarikan pertunjukan tari dan musik Kaili.
      - Panitia mengadakan pertunjukan tari dan lagu Kaili.
      - Panitia mengadakan pertunjukan tari dan musik Kaili.
    answer: 2
    meaning:
      ar_eg: اللجنة المنظمة عاملة عروض رقص ومزيكا كايلي.
      ar: تقيم اللجنة المنظمة عروض رقص وموسيقى كايلي.
      en: The committee is holding Kaili dance and music performances.
    words: [panitia, mengadakan, pertunjukan]
  - id: e05
    type: match_pairs
    pairs:
      - text: mengadakan
        ar_eg: ينظّم / يقيم
        ar: يقيم / ينظّم
        en: hold, organise
      - text: panitia
        ar_eg: اللجنة المنظمة
        ar: اللجنة المنظمة
        en: organising committee
      - text: pertunjukan
        ar_eg: عرض
        ar: عرض
        en: performance
      - text: melestarikan
        ar_eg: يحافظ على
        ar: يحافظ على / يصون
        en: preserve
      - text: terbuka untuk umum
        ar_eg: مفتوح للكل
        ar: مفتوح للعموم
        en: open to the public
    words: [mengadakan, panitia, pertunjukan, melestarikan]
  - id: e06
    type: fill_blank
    sentence: Festival ini ___ banyak wisatawan ke Palu.
    meaning:
      ar_eg: المهرجان ده بيجذب سياح كتير لبالو.
      ar: يجذب هذا المهرجان كثيرًا من السياح إلى بالو.
      en: This festival attracts many tourists to Palu.
    options: [meningkatkan, menarik, melestarikan]
    answers: [menarik]
    explain:
      ar_eg: menarik wisatawan = يجذب السياح (كلمتين بيمشوا مع بعض). meningkatkan بتيجي مع pendapatan، وmelestarikan مع warisan.
      ar: menarik wisatawan = يجذب السياح (تلازم لفظي)، أما meningkatkan فتأتي مع pendapatan، وmelestarikan مع warisan.
      en: menarik wisatawan = attract tourists (a fixed pair); meningkatkan goes with pendapatan, melestarikan with warisan.
    words: [menarik, wisatawan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المهرجان ده مفتوح للكل وببلاش.
      ar: هذا المهرجان مفتوح للجميع ومجاني.
      en: This festival is open to the public and free.
    answers:
      - Festival ini terbuka untuk umum dan gratis.
      - Festival ini gratis dan terbuka untuk umum.
      - Festival ini terbuka untuk umum dan tidak dipungut biaya.
      - Festival itu terbuka untuk umum dan gratis.
      - Festival ini terbuka buat umum dan gratis.
      - Festival ini gratis dan terbuka buat umum.
  - id: e08
    type: build_sentence
    source:
      ar_eg: يلّا نحافظ مع بعض على تراث كايلي الثقافي!
      ar: هلمّوا نحافظ معًا على التراث الثقافي لكايلي!
      en: Let's preserve Kaili cultural heritage together!
    answer: Mari bersama-sama melestarikan warisan budaya Kaili!
    alternatives:
      - Mari melestarikan warisan budaya Kaili bersama-sama!
    distractors: [mengadakan, menarik]
    words: [melestarikan, warisan]
    explain:
      ar_eg: melestarikan = يحافظ على، وwarisan budaya = ميراث ثقافي. mengadakan = يقيم، وmenarik = يجذب، ومش في الجملة.
      ar: melestarikan = يحافظ على، وwarisan budaya = الإرث الثقافي. أما mengadakan فيقيم، وmenarik يجذب، وليسا في الجملة.
      en: melestarikan means preserve, and warisan budaya is cultural heritage. mengadakan (hold) and menarik (attract) aren't in the sentence.
dialogue:
  title: Poster di hotel
  lines:
    - speaker: Mohamed
      text: Bu Ratna, saya lihat poster Festival Budaya Kaili di hotel. Festivalnya gratis, ya?
      ar_eg: يا طنط Ratna، شفت بوستر مهرجان الثقافة الكايلية في الفندق. المهرجان ببلاش، صح؟
      ar: يا سيدة Ratna، رأيت ملصق مهرجان الثقافة الكايلية في الفندق. المهرجان مجاني، أليس كذلك؟
      en: Bu Ratna, I saw the Kaili Culture Festival poster at the hotel. The festival's free, isn't it?
    - speaker: Bu Ratna
      text: Betul, semua orang boleh datang. Panitia ingin semua warga ikut.
      ar_eg: مظبوط، أي حد يقدر ييجي. اللجنة عايزة كل الناس تشارك.
      ar: صحيح، يحق للجميع الحضور. واللجنة تريد أن يشارك كل السكان.
      en: That's right, anyone can come. The committee wants all residents to join.
    - speaker: Mohamed
      text: Di poster ada kaledo juga. Itu apa, Bu?
      ar_eg: في البوستر مكتوب كاليدو كمان. ده إيه يا طنط؟
      ar: في الملصق ذُكر الكاليدو أيضًا. ما هو يا سيدتي؟
      en: The poster mentions kaledo too. What's that, Bu?
    - speaker: Bu Ratna
      text: Sup kaki sapi dari Palu. Enak sekali kalau hujan deras!
      ar_eg: شوربة كوارع بقري من بالو. حلوة أوي والمطر جامد!
      ar: حساء أكارع بقر من بالو، لذيذ جدًا حين يشتد المطر!
      en: A beef-leg soup from Palu. Delicious when it's pouring with rain!
    - speaker: Mohamed
      text: Wah, saya mau coba!
      ar_eg: الله! أكيد هدوقها!
      ar: رائع، سأتذوّقه حتمًا!
      en: Wow, I'll definitely try it!
