schema: kabar.lesson/v1
id: bipa5.u09.l09
language: id
title: Jembatan Arab
can_do:
  ar_eg: تشرح بالإندونيسي إزاي الكلمات العربي اتغيّرت لما دخلت الإندونيسي.
  ar: أن تشرح بالإندونيسية كيف تغيّرت الكلمات العربية حين دخلت الإندونيسية.
  en: Explain in Indonesian how Arabic words changed on their way into Indonesian.
slides:
  - title: Bunyi yang berubah
    grammar: id.register.formal-informal
    body:
      ar_eg: |
        إنت عارف الجسر العربي، دلوقتي اشرحه بالإندونيسي:
        - Bunyi "f" berubah menjadi "p". = فكر → pikir
        - Bunyi "q" berubah menjadi "k". = وقت → waktu، قلب → kalbu
        - Bunyi "ض" berubah menjadi "d" atau "l". = رضا → rida / rela
        - Bunyi "ع" sering hilang atau menjadi "k". = علم → ilmu، معنى → makna
        وخد بالك من الأصحاب المزيّفين: ahli = خبير (مش أهل)، kalimat = جملة (مش كلمة).
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: jelasin = menjelaskan، temen-temen = teman-teman، cepet = cepat، soalnya = karena، udah = sudah، pinter = pintar.
      ar: |
        تعرف الجسر العربي، فاشرحه الآن بالإندونيسية:
        - Bunyi "f" berubah menjadi "p". = فكر → pikir
        - Bunyi "q" berubah menjadi "k". = وقت → waktu، قلب → kalbu
        - Bunyi "ض" berubah menjadi "d" atau "l". = رضا → rida / rela
        - Bunyi "ع" sering hilang atau menjadi "k". = علم → ilmu، معنى → makna
        واحذر الأصدقاء المزيّفين: ahli = خبير (لا أهل)، kalimat = جملة (لا كلمة).
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: jelasin = menjelaskan، temen-temen = teman-teman، cepet = cepat، soalnya = karena، udah = sudah، pinter = pintar.
      en: |
        You know the Arabic Bridge; now explain it in Indonesian:
        - Bunyi "f" berubah menjadi "p". = fikr → pikir
        - Bunyi "q" berubah menjadi "k". = waqt → waktu, qalb → kalbu
        - Bunyi "ḍ" berubah menjadi "d" atau "l". = riḍā → rida / rela
        - Bunyi "ʿ" sering hilang atau menjadi "k". = ʿilm → ilmu, maʿnā → makna
        Watch the false friends: ahli = expert (not "family"), kalimat = sentence (not "word").
        The dialogue uses street forms; the formal ones are beside them: jelasin = menjelaskan, temen-temen = teman-teman, cepet = cepat, soalnya = karena, udah = sudah, pinter = pintar.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bunyi
        ar_eg: صوت
        ar: صوت
        en: sound
      - text: berubah
        ar_eg: يتغيّر
        ar: يتغيّر
        en: to change
      - text: mirip
        ar_eg: شبه
        ar: يشبه
        en: similar
      - text: lafal
        ar_eg: نطق
        ar: لفظ
        en: pronunciation
      - text: ahli
        ar_eg: خبير
        ar: خبير
        en: expert
    words: [bunyi, berubah, mirip, lafal, ahli]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «فكر» بقت إيه في الإندونيسي؟
      ar: ماذا صارت «فكر» في الإندونيسية؟
      en: What did Arabic "fikr" become in Indonesian?
    options: [pikir, fikir, bikir]
    answer: 0
    words: [bunyi, berubah]
    explain:
      ar_eg: «ف» بقت p، فـ «فكر» = pikir. fikir بتتكتب بالمعنى القديم بس مش القياسي، وbikir مش كلمة.
      ar: صارت «ف» p، فأصبحت «فكر» pikir. أما fikir فليست الصيغة القياسية، وbikir ليست كلمة.
      en: Arabic f became p, so fikr is pikir. fikir isn't the standard form, and bikir isn't a word.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «Dia ahli sejarah» معناها إيه؟
      ar: ما معنى «Dia ahli sejarah»؟
      en: What does "Dia ahli sejarah" mean?
    options:
      - Dia berasal dari keluarga zaman dulu.
      - Dia orang yang sangat menguasai ilmu sejarah.
      - Dia tidak suka sejarah.
    answer: 1
    words: [ahli]
    explain:
      ar_eg: ahli = خبير (من «أهل» بمعنى أهل الاختصاص). مش «عيلة» قديمة، ومش بيكره التاريخ.
      ar: ahli = خبير (من «أهل» بمعنى أهل الاختصاص)، لا «عائلة» قديمة ولا كارهٌ للتاريخ.
      en: ahli means expert (from Arabic ahl, as in specialists), not "family" from old times.
  - id: e04
    type: fill_blank
    sentence: Kata "waktu" sangat ___ dengan kata Arab "وقت".
    meaning:
      ar_eg: كلمة waktu شبه قوي الكلمة العربي «وقت».
      ar: كلمة waktu شديدة الشبه بالكلمة العربية «وقت».
      en: The word "waktu" is very similar to the Arabic word "waqt".
    options: [mirip, ahli, lafal]
    answers: [mirip]
    words: [mirip]
    explain:
      ar_eg: «شبه» = mirip dengan. ahli = خبير وlafal = نطق، مايجوش قبل dengan هنا.
      ar: «يشبه» = mirip dengan. أما ahli فالخبير، وlafal النطق.
      en: "\"Similar to\" is mirip dengan. ahli (expert) and lafal (pronunciation) don't fit."
  - id: e05
    type: listen
    text: Lafal orang Mesir dan orang Indonesia berbeda, tetapi katanya mirip. Misalnya, orang Mesir bilang "fikr", dan orang Indonesia bilang "pikir".
    question:
      ar_eg: إيه اللي مختلف بين المصريين والإندونيسيين؟
      ar: ما المختلف بين المصريين والإندونيسيين؟
      en: What differs between Egyptians and Indonesians?
    options:
      - Katanya sama sekali berbeda.
      - Artinya selalu berubah.
      - Cara mengucapkannya berbeda, walaupun katanya mirip.
    answer: 2
    meaning:
      ar_eg: نطق المصريين والإندونيسيين مختلف، بس الكلمات شبه بعض. مثلًا، المصري بيقول «فِكر»، والإندونيسي بيقول «pikir».
      ar: نطق المصريين والإندونيسيين مختلف، لكنّ الكلمات متشابهة؛ فالمصري يقول «فِكر» والإندونيسي يقول «pikir».
      en: Egyptian and Indonesian pronunciation differ, but the words are similar. For example, Egyptians say "fikr" and Indonesians say "pikir".
    explain:
      ar_eg: lafal berbeda = النطق مختلف، وkatanya mirip = الكلمات شبه بعض، والمثال fikr → pikir (الفاء بقت p).
      ar: lafal berbeda = النطق مختلف، وkatanya mirip = الكلمات متشابهة، والمثال fikr ← pikir (الفاء صارت p).
      en: "lafal berbeda = pronunciation differs; katanya mirip = the words are alike: fikr → pikir (f became p)."
    words: [lafal, mirip]
  - id: e06
    type: build_sentence
    source:
      ar_eg: صوت «ق» اتغيّر وبقى «k».
      ar: تغيّر صوت «ق» فصار «k».
      en: The sound "q" changed into "k".
    answer: Bunyi "q" berubah menjadi "k".
    distractors: [mirip, lafal]
    words: [bunyi, berubah]
    explain:
      ar_eg: «اتغيّر وبقى» = berubah menjadi. mirip = شبه وlafal = نطق، مش في الجملة.
      ar: «تغيّر فصار» = berubah menjadi. أما mirip فـ«يشبه»، وlafal النطق.
      en: "\"Changed into\" is berubah menjadi. mirip and lafal aren't in it."
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: نطقي لسه بيتغيّر كل يوم.
      ar: ما زال نطقي يتغيّر كلّ يوم.
      en: My pronunciation is still changing every day.
    answers:
      - Lafal saya masih berubah setiap hari.
      - Lafal saya masih terus berubah setiap hari.
      - Setiap hari lafal saya masih berubah.
      - Lafalku masih berubah setiap hari.
    words: [lafal, berubah]
  - id: e08
    type: speaking
    text: Kata "kalimat" mirip dengan bahasa Arab, tetapi maknanya berbeda.
    meaning:
      ar_eg: كلمة kalimat شبه العربي، بس معناها مختلف.
      ar: كلمة kalimat تشبه العربية، لكنّ معناها مختلف.
      en: The word "kalimat" looks like Arabic, but its meaning is different.
    words: [mirip]
  - id: e09
    type: dictation
    text: Ahli bahasa itu menjelaskan bunyi bahasa Arab, karena banyak bunyi itu tidak ada dalam bahasa Indonesia.
    meaning:
      ar_eg: خبير اللغة ده شرح أصوات العربي، عشان أصوات كتير منها مش موجودة في الإندونيسي.
      ar: شرح ذلك الخبير اللغوي أصوات العربية، لأنّ كثيرًا منها غير موجود في الإندونيسية.
      en: That language expert explained the sounds of Arabic, because many of them don't exist in Indonesian.
    words: [ahli, bunyi]
dialogue:
  title: Presentasi di kelas Mas Rizal
  lines:
    - speaker: Mas Rizal
      text: Mohamed, coba jelasin Jembatan Arab ke temen-temen.
      ar_eg: يا محمد، اتفضل اشرح الجسر العربي لزمايلك.
      ar: يا محمد، تفضّل اشرح الجسر العربي للزملاء.
      en: Mohamed, please explain the Arabic Bridge to everyone.
    - speaker: Mohamed
      text: Banyak kata Indonesia mirip bahasa Arab, tapi bunyinya berubah. Misalnya, "fikr" jadi "pikir".
      ar_eg: كلمات إندونيسي كتير شبه العربي، بس صوتها اتغيّر. مثلًا «فكر» بقت pikir.
      ar: كثير من الكلمات الإندونيسية يشبه العربية، لكنّ أصواتها تغيّرت؛ فـ«فكر» صارت pikir.
      en: Many Indonesian words resemble Arabic, but the sounds changed. For example, "fikr" became "pikir".
    - speaker: Rina
      text: Jadi kamu cepet belajar soalnya udah kenal kosakatanya?
      ar_eg: يعني إنت بتتعلم بسرعة علشان المفردات مألوفة ليك؟
      ar: إذن تتعلّم بسرعة لأنّ المفردات مألوفة لك؟
      en: So you learn fast because the vocabulary is familiar?
    - speaker: Mohamed
      text: Iya, tapi hati-hati! "Ahli" di sini bukan keluarga, tapi orang yang pinter.
      ar_eg: مظبوط، بس خلّي بالك! ahli هنا مش العيلة، دي معناها الشاطر الخبير.
      ar: صحيح، لكن انتبهوا! ahli هنا لا تعني الأهل، بل الخبير الحاذق.
      en: Right, but careful! "Ahli" here isn't family; it means someone skilled.
