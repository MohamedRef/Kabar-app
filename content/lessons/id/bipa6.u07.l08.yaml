schema: kabar.lesson/v1
id: bipa6.u07.l08
language: id
title: Urusan izin tinggal
can_do:
  ar_eg: تخلّص إجراءات تجديد الإقامة في مكتب الهجرة وتفهم الشروط والإلغاء والاسترداد.
  ar: أن تنهي إجراءات تجديد الإقامة في مكتب الهجرة وتفهم الشروط والإلغاء والاسترداد.
  en: Renew your stay permit at immigration and understand conditions, cancellation and refunds.
slides:
  - title: Di kantor imigrasi
    body:
      ar_eg: |
        لغة المكاتب الحكومية مليانة كلمات بـ pe-an و di-:
        imigrasi = الهجرة والجوازات (kantor imigrasi). perpanjangan = تجديد، مدّ (من panjang). registrasi = تسجيل.
        pembatalan = إلغاء (من batal ← باطل). pengembalian = استرجاع، رد (pengembalian dana = استرداد الفلوس).
        diwajibkan = مطلوب إجباري (من wajib ← واجب). bersyarat = مشروط (من syarat ← شرط). diberlakukan = بيتطبّق، بقى ساري (من berlaku).
      ar: |
        لغة الدوائر الحكومية مليئة بصيغ pe-an و di-:
        imigrasi = الهجرة والجوازات (kantor imigrasi). perpanjangan = تجديد، تمديد (من panjang). registrasi = تسجيل.
        pembatalan = إلغاء (من batal ← باطل). pengembalian = إرجاع، ردّ (pengembalian dana = استرداد المال).
        diwajibkan = يُلزَم به (من wajib ← واجب). bersyarat = مشروط (من syarat ← شرط). diberlakukan = يُطبَّق، يسري (من berlaku).
      en: |
        Government-office language is full of pe-an and di- forms:
        imigrasi = immigration (kantor imigrasi). perpanjangan = extension, renewal (from panjang). registrasi = registration.
        pembatalan = cancellation (from batal ← Arabic باطل). pengembalian = return, refund (pengembalian dana).
        diwajibkan = to be required (from wajib ← واجب). bersyarat = conditional (from syarat ← شرط). diberlakukan = to be put into effect (from berlaku).
    examples:
      - text: Perpanjangan izin tinggal dilakukan di kantor imigrasi.
        ar_eg: تجديد الإقامة بيتعمل في مكتب الهجرة.
        ar: يتمّ تجديد الإقامة في مكتب الهجرة.
        en: Stay-permit extensions are done at the immigration office.
      - text: Pemohon diwajibkan membawa paspor asli.
        ar_eg: المتقدم لازم يجيب الباسبور الأصلي.
        ar: يُلزَم المتقدّم بإحضار جواز السفر الأصلي.
        en: Applicants are required to bring their original passport.
      - text: Aturan baru diberlakukan mulai bulan depan.
        ar_eg: القانون الجديد هيتطبّق من الشهر الجاي.
        ar: تسري القاعدة الجديدة ابتداءً من الشهر القادم.
        en: The new rule takes effect next month.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: imigrasi
        ar_eg: الهجرة والجوازات
        ar: الهجرة
        en: immigration
      - text: perpanjangan
        ar_eg: تجديد
        ar: تمديد
        en: extension
      - text: registrasi
        ar_eg: تسجيل
        ar: تسجيل
        en: registration
      - text: pembatalan
        ar_eg: إلغاء
        ar: إلغاء
        en: cancellation
    words: [imigrasi, perpanjangan, registrasi, pembatalan]
  - id: e02
    type: match_pairs
    pairs:
      - text: pengembalian
        ar_eg: استرجاع
        ar: إرجاع
        en: return, refund
      - text: diwajibkan
        ar_eg: مطلوب إجباري
        ar: يُلزَم به
        en: to be required
      - text: bersyarat
        ar_eg: مشروط
        ar: مشروط
        en: conditional
      - text: diberlakukan
        ar_eg: بيتطبّق
        ar: يُطبَّق
        en: to take effect
    words: [pengembalian, diwajibkan, bersyarat, diberlakukan]
  - id: e03
    type: listen
    text: Registrasi online dibuka sampai tanggal tiga puluh.
    question:
      ar_eg: إيه اللي مفتوح لحد يوم تلاتين؟
      ar: ما الذي يبقى مفتوحًا حتى الثلاثين؟
      en: What's open until the thirtieth?
    options: [التسجيل, الإلغاء, الاسترجاع]
    answer: 0
    meaning:
      ar_eg: التسجيل أونلاين مفتوح لحد يوم تلاتين.
      ar: التسجيل الإلكتروني مفتوح حتى يوم الثلاثين.
      en: Online registration is open until the thirtieth.
    words: [registrasi]
  - id: e04
    type: fill_blank
    sentence: Kalau penerbangan dibatalkan, Anda berhak atas ___ dana.
    meaning:
      ar_eg: لو الرحلة اتلغت، من حقك ___ الفلوس.
      ar: إن أُلغيت الرحلة فلك الحق في ___ المال.
      en: If the flight is cancelled, you're entitled to a ___.
    options: [pengembalian, perpanjangan, imigrasi]
    answers: [pengembalian]
    words: [pengembalian, perpanjangan, imigrasi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: لو قالولك 'ممكن، بس بشرط'، يبقى الموافقة…
      ar: إن قيل لك 'ممكن، ولكن بشرط'، فالموافقة…
      en: If you're told 'yes, but on a condition', the approval is…
    options: [diberlakukan, bersyarat, diwajibkan]
    answer: 1
    explain:
      ar_eg: bersyarat = مشروط، من syarat (شرط).
      ar: bersyarat = مشروط، من syarat (شرط).
      en: bersyarat = conditional, from syarat (Arabic شرط).
    words: [bersyarat, diberlakukan, diwajibkan]
  - id: e06
    type: fill_blank
    sentence: Semua penumpang ___ memakai sabuk pengaman.
    meaning:
      ar_eg: كل الركاب ___ يلبسوا حزام الأمان.
      ar: ___ جميع الركّاب بربط حزام الأمان.
      en: All passengers are ___ to wear a seat belt.
    options: [diwajibkan, bersyarat, registrasi]
    answers: [diwajibkan]
    words: [diwajibkan, bersyarat, registrasi]
  - id: e07
    type: multiple_choice
    question: Biaya ___ tiket adalah dua puluh persen.
    options: [imigrasi, pengembalian, pembatalan]
    answer: 2
    explain:
      ar_eg: رسوم الإلغاء = biaya pembatalan، من batal (باطل).
      ar: رسوم الإلغاء = biaya pembatalan، من batal (باطل).
      en: Cancellation fee = biaya pembatalan, from batal (Arabic باطل).
    words: [pembatalan, imigrasi, pengembalian]
  - id: e08
    type: build_sentence
    source:
      ar_eg: قانون المرور الجديد بيتطبّق من النهارده.
      ar: يسري قانون المرور الجديد ابتداءً من اليوم.
      en: The new traffic rule takes effect from today.
    answer: Aturan lalu lintas baru diberlakukan mulai hari ini.
    distractors: [diwajibkan, pembatalan]
    words: [diberlakukan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Saya datang ke kantor imigrasi untuk perpanjangan izin tinggal.
    answers_meaning:
      ar_eg: [جيت مكتب الهجرة عشان أجدد الإقامة, أنا جاي الجوازات عشان تجديد الإقامة]
      ar: [جئت إلى مكتب الهجرة لتجديد الإقامة]
      en: [I came to the immigration office to extend my stay permit, 'I''m at immigration to renew my residence permit']
    words: [imigrasi, perpanjangan]
  - id: e10
    type: speaking
    text: Pembatalan registrasi bisa dilakukan secara online.
    meaning:
      ar_eg: إلغاء التسجيل ممكن يتعمل أونلاين.
      ar: يمكن إلغاء التسجيل إلكترونيًا.
      en: Registration can be cancelled online.
    words: [pembatalan, registrasi]
dialogue:
  lines:
    - speaker: Petugas imigrasi
      text: Selamat pagi. Ada yang bisa dibantu?
      ar_eg: صباح الخير. أقدر أساعدك في إيه؟
      ar: صباح الخير. كيف أخدمك؟
      en: Good morning. How can I help?
    - speaker: Mohamed
      text: Saya mau perpanjangan izin tinggal. Apa saja syaratnya?
      ar_eg: عايز أجدد الإقامة. إيه الشروط؟
      ar: أريد تمديد الإقامة. ما الشروط؟
      en: I'd like to extend my stay permit. What are the requirements?
    - speaker: Petugas imigrasi
      text: Bapak diwajibkan membawa paspor asli dan surat sponsor. Registrasinya online dulu.
      ar_eg: لازم تجيب الباسبور الأصلي وجواب الكفيل. والتسجيل أونلاين الأول.
      ar: يلزمك إحضار جواز السفر الأصلي وخطاب الكفيل. والتسجيل إلكتروني أولًا.
      en: You're required to bring your original passport and a sponsor letter. Register online first.
    - speaker: Mohamed
      text: Kalau permohonan saya ditolak, ada pengembalian biaya?
      ar_eg: ولو طلبي اترفض، فيه استرجاع للرسوم؟
      ar: وإن رُفض طلبي، هل تُستردّ الرسوم؟
      en: If my application is refused, is there a refund?
    - speaker: Petugas imigrasi
      text: Tidak ada, Pak. Aturan itu diberlakukan sejak tahun lalu.
      ar_eg: لأ يا فندم. القاعدة دي متطبقة من السنة اللي فاتت.
      ar: لا يا سيدي. هذه القاعدة سارية منذ العام الماضي.
      en: No, sir. That rule has applied since last year.
