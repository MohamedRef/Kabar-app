schema: kabar.lesson/v1
id: bipa7.u03.l08
language: id
title: Selendang bidadari
can_do:
  ar_eg: تحكي حكاية جاكا تاروب وتستعمل كلام التحوّل والمصايب.
  ar: أن تروي حكاية جاكا تاروب مستعملًا ألفاظ التحوّل والمصائب.
  en: Retell the Jaka Tarub tale using words for transformation and calamity.
slides:
  - title: Jaka Tarub
    body:
      ar_eg: |
        حكاية جاكا تاروب: سبع حوريات نزلوا من kahyangan (دار الآلهة) يستحمّوا في بحيرة.
        جاكا خبّى selendang (الشال) بتاع نواتج ولان، فما قدرتش ترجع واتجوّزته.
        في حكايات تانية: حيوان menjelma (يتحوّل) لإنسان، والـ jelmaan = المخلوق المتحوّل.
        titisan = روح حد عظيم رجعت في جسم جديد. sayembara = مسابقة علنية، وغالبًا الجايزة إيد الأميرة.
        kualat = يتصاب بسوء علشان قلّ أدبه مع الكبار. petaka = مصيبة.
        - في الكلام: terus = lalu، buat = untuk، ceritain = ceritakan.
      ar: |
        حكاية جاكا تاروب: نزلت سبع حوريات من kahyangan (مسكن الآلهة) للاستحمام في بحيرة.
        خبّأ جاكا selendang (وشاح) نواغ وولان، فلم تستطع العودة وتزوّجته.
        وفي حكايات أخرى: حيوان menjelma (يتحوّل) إلى إنسان، والـ jelmaan هو الكائن المتحوّل.
        titisan = روح عظيم تعود في جسد جديد. sayembara = مسابقة علنية، جائزتها غالبًا يد الأميرة.
        kualat = أصابه سوء لعدم احترامه الكبار. petaka = مصيبة.
        - في الكلام اليومي: terus = lalu، buat = untuk، ceritain = ceritakan.
      en: |
        The tale of Jaka Tarub: seven nymphs come down from kahyangan (the heavens) to bathe in a lake.
        Jaka hides Nawang Wulan's selendang (scarf), so she can't fly back and marries him.
        In other tales an animal menjelma (turns into) a human; the jelmaan is the transformed creature.
        titisan = the soul of a great figure reborn in a new body. sayembara = a public contest, often for a princess's hand.
        kualat = struck by misfortune for disrespecting elders. petaka = calamity.
        - In speech: terus = lalu, buat = untuk, ceritain = ceritakan.
    examples:
      - text: Jaka Tarub menyembunyikan selendang bidadari itu.
        ar_eg: جاكا تاروب خبّى الشال بتاع الحورية.
        ar: خبّأ جاكا تاروب وشاح تلك الحورية.
        en: Jaka Tarub hid the nymph's scarf.
      - text: Ular itu menjelma menjadi seorang putri.
        ar_eg: التعبان ده اتحوّل لأميرة.
        ar: تحوّل ذلك الثعبان إلى أميرة.
        en: The snake turned into a princess.
      - text: Raja mengadakan sayembara untuk mencari menantu.
        ar_eg: الملك عمل مسابقة علشان يلاقي جوز لبنته.
        ar: أقام الملك مسابقة ليختار زوجًا لابنته.
        en: The king held a contest to find a son-in-law.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: menjelma
        ar_eg: يتحوّل / يتجسّد في صورة تانية
        ar: يتحوّل، يتجسّد
        en: to turn into, take the form of
      - text: jelmaan
        ar_eg: صورة متجسّدة / اللي اتحوّل
        ar: تجسيد، صورة متحوّلة
        en: incarnation, creature in disguise
      - text: titisan
        ar_eg: تجسّد روح حد تاني
        ar: تناسخ روح، تجسيد
        en: reincarnation (of a figure)
      - text: kahyangan
        ar_eg: دار الآلهة في السما
        ar: مسكن الآلهة في السماء
        en: the heavens, abode of the gods
    words: [menjelma, jelmaan, titisan, kahyangan]
  - id: e02
    type: match_pairs
    pairs:
      - text: selendang
        ar_eg: طرحة / شال طويل
        ar: وشاح، شال طويل
        en: long scarf, sash
      - text: sayembara
        ar_eg: مسابقة علنية بجايزة (زي إيد الأميرة)
        ar: مسابقة علنية بجائزة
        en: public contest (often for a princess's hand)
      - text: kualat
        ar_eg: منحوس علشان ما احترمش الكبار
        ar: مصاب بسوء العاقبة لعدم الاحترام
        en: cursed for disrespect
      - text: petaka
        ar_eg: مصيبة
        ar: مصيبة، كارثة
        en: calamity, disaster
    words: [selendang, sayembara, kualat, petaka]
  - id: e03
    type: listen
    text: Jangan melawan orang tua, nanti kualat!
    question:
      ar_eg: هيحصل إيه لو عاند الكبار؟
      ar: ماذا يحدث إن عصى الكبار؟
      en: What happens if you defy your elders?
    options: [هيتصاب بسوء, هيتحوّل, هيكسب المسابقة]
    answer: 0
    meaning:
      ar_eg: ما تعاندش الكبار، لحسن يجيلك نحس!
      ar: لا تعصِ والديك، وإلا أصابك سوء العاقبة!
      en: Don't defy your parents, or you'll be cursed!
    words: [kualat]
  - id: e04
    type: fill_blank
    sentence: Bidadari itu tidak bisa pulang ke ___ tanpa selendangnya.
    meaning:
      ar_eg: الحورية ما قدرتش ترجع لـ ___ من غير الشال بتاعها.
      ar: لم تستطع الحورية العودة إلى ___ دون وشاحها.
      en: The nymph couldn't go back to ___ without her scarf.
    options: [kahyangan, sayembara, petaka]
    answers: [kahyangan]
    words: [kahyangan, sayembara, petaka, selendang]
    explain:
      ar_eg: kahyangan = سما الآلهة اللي الحورية جاية منها. sayembara = مسابقة، وpetaka = مصيبة.
      ar: kahyangan = سماء الآلهة موطن الحورية. أما sayembara فمسابقة وpetaka مصيبة.
      en: kahyangan is the heavenly home. sayembara is a contest, petaka a calamity.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «titisan» معناها إيه؟
      ar: ما معنى «titisan»؟
      en: What does 'titisan' mean?
    options: [Hadiah dalam lomba., Jiwa tokoh besar yang lahir lagi dalam tubuh baru., Kain panjang.]
    answer: 1
    explain:
      ar_eg: titisan = روح رجعت في جسم جديد.
      ar: titisan = روح عادت في جسد جديد.
      en: titisan = a soul reborn in a new body.
    words: [titisan, selendang]
  - id: e06
    type: fill_blank
    sentence: Rusa emas itu ternyata ___ raksasa.
    meaning:
      ar_eg: الغزالة الدهب دي طلعت ___ عملاق.
      ar: تبيّن أنّ الغزال الذهبيّ ___ عملاق.
      en: The golden deer turned out to be a ___ of a giant.
    options: [jelmaan, titisan, kualat]
    answers: [jelmaan]
    words: [jelmaan, titisan, kualat]
    explain:
      ar_eg: "jelmaan = عفريت/كائن اتحوّل لشكل تاني: الغزال كان عملاق متحوّل. titisan = تجسّد روح، وkualat = لعنة جزاء."
      ar: "jelmaan = كائن متحوّل: كان الغزال عملاقًا متنكرًا. أما titisan فتجسّد روح وkualat لعنة العقاب."
      en: jelmaan = something transformed. titisan is a reincarnation, kualat a curse.
  - id: e07
    type: build_sentence
    source:
      ar_eg: الأمير اتحوّل لعصفور أبيض.
      ar: تحوّل الأمير إلى طائر أبيض.
      en: The prince turned into a white bird.
    answer: Pangeran itu menjelma menjadi burung putih.
    distractors: [jelmaan, sayembara]
    words: [menjelma]
    explain:
      ar_eg: menjelma menjadi = اتحوّل لـ. jelmaan هي الاسم مش الفعل، وsayembara مسابقة.
      ar: menjelma menjadi = تحوّل إلى. أما jelmaan فاسم وsayembara مسابقة.
      en: menjelma menjadi = turned into. jelmaan is the noun.
  - id: e08
    type: translate
    direction: from_target
    source_text: Kucing hitam itu ternyata jelmaan bidadari dari kahyangan.
    answers_meaning:
      ar_eg: [القطة السودا دي طلعت حورية من السما متحوّلة, القطة السودا طلعت في الحقيقة حورية من دار الآلهة]
      ar: [تبيّن أنّ القطّة السوداء حوريّة من السماء متحوّلة, كانت القطّة السوداء في الحقيقة حوريّة من مسكن الآلهة في صورة أخرى]
      en: [The black cat turned out to be a nymph from the heavens in disguise, That black cat was really a heavenly nymph in another form]
    words: [jelmaan, kahyangan]
  - id: e09
    type: speaking
    text: Siapa pun yang menang sayembara boleh menikahi sang putri.
    meaning:
      ar_eg: أي حد يكسب المسابقة يقدر يتجوّز الأميرة.
      ar: من يفز بالمسابقة يحقّ له الزواج بالأميرة.
      en: Whoever wins the contest may marry the princess.
    words: [sayembara]
  - id: e10
    type: multiple_choice
    question: Mengapa Nawang Wulan tidak bisa terbang lagi?
    options: [Karena ia kualat., Karena ia kalah sayembara., Karena selendangnya disembunyikan.]
    answer: 2
    explain:
      ar_eg: جاكا خبّى الشال، فما قدرتش تطير.
      ar: خبّأ جاكا الوشاح فعجزت عن الطيران.
      en: Jaka hid the scarf, so she couldn't fly.
    words: [selendang, kualat, sayembara, menjelma, petaka]
dialogue:
  lines:
    - speaker: Mama Ruth
      text: Ceritain satu cerita dari Jawa buat anak-anak, Mohamed.
      ar_eg: احكي للعيال حكاية من جاوة يا محمد.
      ar: احكِ للأطفال قصة من جاوة يا محمد.
      en: Tell the children a story from Java, Mohamed.
    - speaker: Mohamed
      text: Baik. Dulu, tujuh bidadari turun dari kahyangan untuk mandi di danau.
      ar_eg: حاضر. زمان، سبع حوريات نزلوا من السما يستحمّوا في بحيرة.
      ar: حسنًا. قديمًا نزلت سبع حوريات من السماء للاستحمام في بحيرة.
      en: OK. Long ago, seven nymphs came down from the heavens to bathe in a lake.
    - speaker: Mama Ruth
      text: Terus? Ada yang menjelma jadi burung?
      ar_eg: وبعدين؟ حد اتحوّل لعصفور؟
      ar: ثمّ؟ هل تحوّل أحد إلى طائر؟
      en: And then? Does someone turn into a bird?
    - speaker: Mohamed
      text: Bukan. Seorang laki-laki muda mengambil selendang salah satu bidadari.
      ar_eg: لأ. شاب خد الطرحة بتاعة واحدة من الحوريات.
      ar: لا. أخذ شاب وشاح إحدى الحوريات.
      en: No. A young man took one nymph's scarf.
    - speaker: Mama Ruth
      text: Wah, itu nggak baik. Pasti nanti ada petaka.
      ar_eg: لأ، ده مش كويس. أكيد هتحصل مصيبة.
      ar: هذا ليس حسنًا. لا بد أن تحلّ مصيبة.
      en: That's not right. Surely a calamity will follow.
    - speaker: Mohamed
      text: Betul, Mama. Tunggu bagian akhirnya, ya.
      ar_eg: مظبوط يا ماما. استني الآخر.
      ar: صحيح يا أمّي، انتظري النهاية.
      en: Right, Mama. Wait for the ending.
