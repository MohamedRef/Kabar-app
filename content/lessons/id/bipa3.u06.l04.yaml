schema: kabar.lesson/v1
id: bipa3.u06.l04
language: id
title: Dengan hormat
can_do:
  ar_eg: تكتب أول وآخر إيميل أو جواب رسمي.
  ar: أن تكتب افتتاحية رسالة أو بريد رسمي وخاتمته.
  en: Open and close a formal letter or email.
slides:
  - title: Pembukaan surat
    body:
      ar_eg: |
        الجواب الرسمي بيبدأ كده:
        1) Yth. = Yang terhormat (المحترم / السيد) + اللقب: Yth. Manajer Hotel …
        2) Perihal: = الموضوع.
        3) Dengan hormat, = جملة افتتاح ثابتة، زي «تحية طيبة وبعد».
        وhormat (احترام) جاية من العربي «حُرمة».
      ar: |
        تبدأ الرسالة الرسمية هكذا:
        1) Yth. = Yang terhormat (المحترم) مع اللقب: Yth. Manajer Hotel …
        2) Perihal: = الموضوع.
        3) Dengan hormat, = افتتاحية ثابتة تشبه «تحية طيبة وبعد».
        وكلمة hormat (احترام) من العربية «حُرمة».
      en: |
        A formal letter starts like this:
        1) Yth. = Yang terhormat (Dear / The respected) + title: Yth. Manajer Hotel …
        2) Perihal: = Subject / Re.
        3) Dengan hormat, = a fixed opening line, like "Dear Sir or Madam".
        hormat (respect) comes from Arabic «حُرمة».
    examples:
      - text: Yth. Manajer Hotel Mandalika Indah
        ar_eg: السيد مدير فندق مانداليكا إنداه المحترم
        ar: السيد مدير فندق مانداليكا إنداه المحترم
        en: Dear Manager of Hotel Mandalika Indah
      - text: "Perihal: Keluhan tentang kamar 12"
        ar_eg: "الموضوع: شكوى بخصوص أوضة 12"
        ar: "الموضوع: شكوى بشأن الغرفة 12"
        en: "Subject: Complaint about room 12"
  - title: Isi dan penutup
    body:
      ar_eg: |
        في النص: Saya ingin menyampaikan keluhan tentang … = حابب أقدّم شكوى بخصوص…
        وفي الآخر جملتين ثابتين: شكر، وبعدين Hormat saya, (المخلص) واسمك.
      ar: |
        في المتن: Saya ingin menyampaikan keluhan tentang … = أودّ تقديم شكوى بشأن…
        وفي الختام عبارتان ثابتتان: الشكر، ثم Hormat saya, (المخلص) والاسم.
      en: |
        In the body: Saya ingin menyampaikan keluhan tentang … = I would like to make a complaint about …
        Two fixed lines close it: a thank-you, then Hormat saya, (Yours sincerely) and your name.
    examples:
      - text: Saya ingin menyampaikan keluhan tentang kamar saya.
        ar_eg: حابب أقدّم شكوى بخصوص أوضتي.
        ar: أودّ تقديم شكوى بشأن غرفتي.
        en: I would like to make a complaint about my room.
      - text: Atas perhatian Bapak, saya ucapkan terima kasih.
        ar_eg: شكرًا لاهتمام حضرتك.
        ar: أشكركم على اهتمامكم.
        en: Thank you for your attention.
      - text: Hormat saya, Mohamed
        ar_eg: المخلص، محمد
        ar: المخلص، محمد
        en: Yours sincerely, Mohamed
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Yth. (yang terhormat)
        ar_eg: المحترم / السيد (في أول الجواب)
        ar: المحترم (في صدر الرسالة)
        en: Dear (formal address)
      - text: Dengan hormat,
        ar_eg: تحية طيبة وبعد
        ar: تحية طيبة وبعد
        en: Dear Sir or Madam (opening line)
      - text: Hormat saya,
        ar_eg: المخلص
        ar: المخلص
        en: Yours sincerely
      - text: perihal
        ar_eg: الموضوع
        ar: الموضوع
        en: subject, re
      - text: keluhan
        ar_eg: شكوى
        ar: شكوى
        en: complaint
      - text: menyampaikan
        ar_eg: يقدّم / يوصّل (كلام أو رسالة)
        ar: يُبلغ / يقدّم
        en: to convey, to put forward
    words: [yang terhormat, hormat, perihal, keluhan, menyampaikan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بعد «Yth. Manajer Hotel …» بتبدأ الجواب بإيه؟
      ar: بعد «Yth. Manajer Hotel …» بمَ تبدأ الرسالة؟
      en: After "Yth. Manajer Hotel …", how do you open the letter?
    options: [Hormat saya, Dengan hormat, Perihal]
    answer: 1
    explain:
      ar_eg: Dengan hormat في الأول، وHormat saya في الآخر قبل اسمك.
      ar: Dengan hormat في البداية، وHormat saya في الختام قبل الاسم.
      en: Dengan hormat opens the letter; Hormat saya closes it before your name.
    words: [hormat]
  - id: e03
    type: listen
    text: Dengan hormat, saya ingin menyampaikan keluhan.
    options:
      - Dengan hormat, saya ingin menyampaikan terima kasih.
      - Hormat saya, saya ingin menyampaikan keluhan.
      - Dengan hormat, saya ingin menyampaikan keluhan.
    answer: 2
    meaning:
      ar_eg: تحية طيبة وبعد، حابب أقدّم شكوى.
      ar: تحية طيبة وبعد، أودّ تقديم شكوى.
      en: Dear Sir or Madam, I would like to make a complaint.
    words: [hormat, menyampaikan, keluhan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي سطر هو «الموضوع» في جواب شكوى؟
      ar: أيّ سطر هو «الموضوع» في رسالة شكوى؟
      en: Which line is the subject line of a complaint letter?
    options:
      - "Perihal: Keluhan tentang kamar 12"
      - Hormat saya, Mohamed
      - Dengan hormat, Mohamed
    answer: 0
    words: [perihal, keluhan]
  - id: e05
    type: fill_blank
    sentence: ___ Manajer Hotel Mandalika Indah
    meaning:
      ar_eg: السيد مدير فندق مانداليكا إنداه المحترم
      ar: السيد مدير فندق مانداليكا إنداه المحترم
      en: Dear Manager of Hotel Mandalika Indah
    options: ["Yth.", Perihal, Hormat saya]
    answers: ["Yth."]
    explain:
      ar_eg: Yth. اختصار Yang terhormat، وبتيجي قبل اسم أو لقب اللي بتكتبله.
      ar: Yth. اختصار Yang terhormat، وتأتي قبل اسم المرسَل إليه أو لقبه.
      en: Yth. is short for Yang terhormat and goes before the addressee's name or title.
    words: [yang terhormat]
  - id: e06
    type: build_sentence
    source:
      ar_eg: حابب أقدّم شكوى بخصوص التكييف في أوضة 12.
      ar: أودّ تقديم شكوى بشأن المكيّف في الغرفة 12.
      en: I would like to make a complaint about the AC in room 12.
    answer: Saya ingin menyampaikan keluhan tentang AC di kamar 12.
    distractors: [hormat, perihal]
    words: [menyampaikan, keluhan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "الموضوع: شكوى بخصوص المية السخنة"
      ar: "الموضوع: شكوى بشأن الماء الساخن"
      en: "Subject: Complaint about the hot water"
    answers:
      - "Perihal: Keluhan tentang air panas"
      - "Perihal: keluhan tentang air panas"
      - "Perihal: Keluhan tentang air panas."
      - "Perihal: Keluhan mengenai air panas"
      - "Perihal: Keluhan soal air panas"
      - "Perihal: Keluhan air panas"
      - Perihal Keluhan tentang air panas
    words: [perihal, keluhan]
  - id: e08
    type: speaking
    text: Yang terhormat Ibu Manajer, saya ingin menyampaikan keluhan.
    meaning:
      ar_eg: حضرة المديرة المحترمة، حابب أقدّم شكوى.
      ar: حضرة المديرة المحترمة، أودّ تقديم شكوى.
      en: Dear Madam Manager, I would like to make a complaint.
    words: [yang terhormat, menyampaikan, keluhan]
dialogue:
  title: Menulis email keluhan
  lines:
    - speaker: Mohamed
      text: Mas Rizal, saya mau menulis email keluhan ke hotel. Mulainya bagaimana?
      ar_eg: يا ماس ريزال، عايز أكتب إيميل شكوى للفندق. أبدأ إزاي؟
      ar: يا ماس ريزال، أريد أن أكتب بريد شكوى إلى الفندق. كيف أبدأ؟
      en: Mas Rizal, I want to write a complaint email to the hotel. How do I start?
    - speaker: Mas Rizal
      text: Tulis “Yth. Manajer Hotel”, lalu “Dengan hormat”.
      ar_eg: اكتب «Yth. Manajer Hotel»، وبعدين «Dengan hormat».
      ar: اكتب «Yth. Manajer Hotel»، ثم «Dengan hormat».
      en: Write "Yth. Manajer Hotel", then "Dengan hormat".
    - speaker: Mohamed
      text: Perihalnya “Keluhan tentang kamar 12”, ya?
      ar_eg: والموضوع «شكوى بخصوص أوضة 12»، صح؟
      ar: والموضوع «شكوى بشأن الغرفة 12»، أليس كذلك؟
      en: And the subject is "Complaint about room 12", right?
    - speaker: Mas Rizal
      text: Betul. Di akhir, tulis terima kasih, lalu “Hormat saya” dan nama Anda.
      ar_eg: مظبوط. وفي الآخر اكتب شكرًا، وبعدين «Hormat saya» واسمك.
      ar: صحيح. وفي الختام اكتب الشكر، ثم «Hormat saya» واسمك.
      en: Right. At the end, write a thank-you, then "Hormat saya" and your name.
