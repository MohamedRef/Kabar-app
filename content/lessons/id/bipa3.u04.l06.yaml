schema: kabar.lesson/v1
id: bipa3.u04.l06
language: id
title: Label makanan
can_do:
  ar_eg: 'تقرا ورقة المكونات: إيه اللي جوه، صافي ولا لأ، مواد كيماوية وسموم، ورجيم.'
  ar: 'أن تقرأ ملصق المكوّنات: ما يحتويه، هل هو نقي، المواد الكيميائية والسموم، والحمية.'
  en: 'Read a food label: what''s inside, whether it''s pure, chemicals and poisons, and diets.'
slides:
  - title: Apa bahannya?
    body:
      ar_eg: |
        bahan = مكوّن، خامة (bahan makanan = مكونات الأكل). kimia = كيميا (bahan kimia = مواد كيماوية).
        berisi = فيه، جواه: Kotak ini berisi cokelat. murni = صافي، خالص (madu murni = عسل صافي).
        racun = سم. cokelat = شوكولاتة (وبتتكتب كمان coklat). kering = ناشف (buah kering = فاكهة مجففة). diet = رجيم.
      ar: |
        bahan = مكوّن، مادة (bahan makanan = مكوّنات الطعام). kimia = كيمياء (bahan kimia = مواد كيميائية).
        berisi = يحتوي على: Kotak ini berisi cokelat. murni = نقيّ، خالص (madu murni = عسل نقي).
        racun = سمّ. cokelat = شوكولاتة (وتُكتب أيضًا coklat). kering = جاف (buah kering = فاكهة مجففة). diet = حمية.
      en: |
        bahan = ingredient, material (bahan makanan = food ingredients). kimia = chemistry (bahan kimia = chemicals).
        berisi = contain, be filled with: Kotak ini berisi cokelat. murni = pure (madu murni = pure honey).
        racun = poison. cokelat = chocolate (also spelt coklat). kering = dry, dried (buah kering = dried fruit). diet = diet.
    examples:
      - text: Kue ini memakai bahan alami, tidak pakai bahan kimia.
        ar_eg: الكيكة دي معمولة من مكونات طبيعية، من غير كيماويات.
        ar: تُصنع هذه الكعكة من مكوّنات طبيعية بلا مواد كيميائية.
        en: This cake uses natural ingredients, no chemicals.
      - text: Botol ini berisi madu murni dari Sumbawa.
        ar_eg: الإزازة دي فيها عسل صافي من سومباوا.
        ar: تحتوي هذه الزجاجة على عسل نقي من سومباوا.
        en: This bottle holds pure honey from Sumbawa.
      - text: Jangan makan jamur itu! Ada racunnya.
        ar_eg: ما تاكلش عيش الغراب ده! فيه سم.
        ar: لا تأكل ذلك الفطر! فيه سمّ.
        en: Don't eat that mushroom! It's poisonous.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bahan
        ar_eg: مكوّن
        ar: مكوّن
        en: ingredient
      - text: kimia
        ar_eg: كيميا
        ar: كيمياء
        en: chemistry
      - text: berisi
        ar_eg: فيه، جواه
        ar: يحتوي على
        en: contain
      - text: cokelat / coklat
        ar_eg: شوكولاتة
        ar: شوكولاتة
        en: chocolate
    words: [bahan, kimia, berisi, cokelat / coklat]
  - id: e02
    type: match_pairs
    pairs:
      - text: racun
        ar_eg: سم
        ar: سمّ
        en: poison
      - text: murni
        ar_eg: صافي
        ar: نقيّ
        en: pure
      - text: kering
        ar_eg: ناشف
        ar: جاف
        en: dry
      - text: diet
        ar_eg: رجيم
        ar: حمية
        en: diet
    words: [racun, murni, kering, diet]
  - id: e03
    type: listen
    text: Hati-hati, botol itu berisi racun tikus!
    question:
      ar_eg: في الإزازة إيه؟
      ar: ماذا في الزجاجة؟
      en: What's in the bottle?
    options: [عصير, سم فيران, زيت]
    answer: 1
    meaning:
      ar_eg: خلّي بالك، الإزازة دي فيها سم فيران!
      ar: احذر، تلك الزجاجة فيها سمّ فئران!
      en: Careful, that bottle has rat poison in it!
    words: [berisi, racun]
  - id: e04
    type: fill_blank
    sentence: Saya sedang ___. Saya tidak makan gula dan nasi.
    meaning:
      ar_eg: أنا عامل ___. مش باكل سكر ولا رز.
      ar: أنا أتبع ___. لا آكل السكر ولا الأرز.
      en: I'm on a ___. I don't eat sugar or rice.
    options: [diet, kimia, murni]
    answers: [diet]
    words: [diet, kimia, murni]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حاجة حلوة بنية من الكاكاو؟
      ar: حلوى بنية من الكاكاو؟
      en: Something sweet and brown made from cocoa?
    options: [racun, cokelat, bahan]
    answer: 1
    explain:
      ar_eg: cokelat (أو coklat) = شوكولاتة.
      ar: cokelat (أو coklat) = شوكولاتة.
      en: cokelat (or coklat) = chocolate.
    words: [cokelat / coklat, racun, bahan]
  - id: e06
    type: fill_blank
    sentence: Madu ini ___, tidak dicampur gula.
    meaning:
      ar_eg: العسل ده ___، مش مخلوط بسكر.
      ar: هذا العسل ___، غير مخلوط بالسكر.
      en: This honey is ___, not mixed with sugar.
    options: [kering, murni, berisi]
    answers: [murni]
    words: [murni, kering, berisi]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الأكل ده مافيهوش مواد كيماوية.
      ar: هذا الطعام خالٍ من المواد الكيميائية.
      en: This food has no chemicals in it.
    answer: Makanan ini tidak memakai bahan kimia.
    distractors: [racun, diet]
    words: [bahan, kimia]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kotak ini berisi buah kering dan cokelat.
    answers_meaning:
      ar_eg: [العلبة دي فيها فاكهة مجففة وشوكولاتة, جوه العلبة دي فاكهة ناشفة وشوكولاتة]
      ar: [تحتوي هذه العلبة على فاكهة مجففة وشوكولاتة]
      en: [This box contains dried fruit and chocolate, This box has dried fruit and chocolate in it]
    words: [berisi, kering, cokelat / coklat]
  - id: e09
    type: speaking
    text: Gula yang terlalu banyak adalah racun untuk tubuh.
    meaning:
      ar_eg: السكر الكتير سم للجسم.
      ar: السكر الكثير سمّ للجسد.
      en: Too much sugar is poison for the body.
    words: [racun]
  - id: e10
    type: multiple_choice
    question: Musim hujan sudah lewat. Sekarang tanahnya ___.
    options: [murni, diet, kering]
    answer: 2
    explain:
      ar_eg: kering = ناشف، جاف.
      ar: kering = جاف.
      en: kering = dry.
    words: [kering, murni, diet]
dialogue:
  lines:
    - speaker: Penjual
      text: Mau coba cokelat stroberi dari Sembalun, Mas?
      ar_eg: تحب تجرب شوكولاتة بالفراولة من سمبالون؟
      ar: أتحب أن تجرّب شوكولاتة الفراولة من سمبالون؟
      en: Want to try strawberry chocolate from Sembalun?
    - speaker: Mohamed
      text: Boleh. Apa bahannya?
      ar_eg: ماشي. مكوناتها إيه؟
      ar: حسنًا. ما مكوّناتها؟
      en: Sure. What's in it?
    - speaker: Penjual
      text: Cokelat, gula dan stroberi dari kebun. Tidak pakai bahan kimia.
      ar_eg: شوكولاتة وسكر وفراولة من الجنينة. من غير كيماويات.
      ar: شوكولاتة وسكر وفراولة من البستان. بلا مواد كيميائية.
      en: Chocolate, sugar and strawberries from the farm. No chemicals.
    - speaker: Mohamed
      text: Kotak yang kecil itu berisi apa?
      ar_eg: العلبة الصغيرة دي فيها إيه؟
      ar: ماذا في تلك العلبة الصغيرة؟
      en: What's in that little box?
    - speaker: Penjual
      text: Stroberi kering dengan madu murni. Bagus untuk yang sedang diet.
      ar_eg: فراولة مجففة بعسل صافي. حلوة للي عامل رجيم.
      ar: فراولة مجففة بعسل نقي. مناسبة لمن يتبع حمية.
      en: Dried strawberries with pure honey. Good if you're on a diet.
