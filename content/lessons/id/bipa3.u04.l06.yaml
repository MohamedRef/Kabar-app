schema: kabar.lesson/v1
id: bipa3.u04.l06
language: id
title: Label makanan
can_do:
  ar_eg: 'تقرا ورقة المكونات: فول سوداني، شوكولاتة، فريش ولا ناشف، كيماويات ورجيم.'
  ar: 'أن تقرأ ملصق المكوّنات: فول سوداني، شوكولاتة، طازج أو مجفف، مواد كيميائية وحمية.'
  en: 'Read a food label: peanuts, chocolate, fresh or dried, chemicals and diets.'
slides:
  - title: Apa bahannya?
    body:
      ar_eg: |
        bahan = مكوّن، خامة (bahan makanan = مكونات الأكل). kimia = كيميا (bahan kimia = مواد كيماوية).
        kacang = فول سوداني أو بقوليات، cokelat = شوكولاتة (وبتتكتب كمان coklat). anggur = عنب.
        segar = فريش، طازة. kering = ناشف (buah kering = فاكهة مجففة). diet = رجيم.
      ar: |
        bahan = مكوّن، مادة (bahan makanan = مكوّنات الطعام). kimia = كيمياء (bahan kimia = مواد كيميائية).
        kacang = فول سوداني أو بقول، cokelat = شوكولاتة (وتُكتب أيضًا coklat). anggur = عنب.
        segar = طازج. kering = جاف (buah kering = فاكهة مجففة). diet = حمية.
      en: |
        bahan = ingredient, material (bahan makanan = food ingredients). kimia = chemistry (bahan kimia = chemicals).
        kacang = peanuts, beans, cokelat = chocolate (also spelt coklat). anggur = grapes.
        segar = fresh. kering = dry, dried (buah kering = dried fruit). diet = diet.
    examples:
      - text: Kue ini memakai bahan alami, tidak pakai bahan kimia.
        ar_eg: الكيكة دي معمولة من مكونات طبيعية، من غير كيماويات.
        ar: تُصنع هذه الكعكة من مكوّنات طبيعية بلا مواد كيميائية.
        en: This cake uses natural ingredients, no chemicals.
      - text: Saya alergi kacang.
        ar_eg: عندي حساسية من الفول السوداني.
        ar: لديّ حساسية من الفول السوداني.
        en: I'm allergic to peanuts.
      - text: Anggur segar lebih enak daripada anggur kering.
        ar_eg: العنب الفريش أحلى من الزبيب.
        ar: العنب الطازج ألذّ من الزبيب.
        en: Fresh grapes taste better than raisins.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bahan
        ar_eg: مكوّن
        ar: مكوّن
        en: ingredient
      - text: kimia
        ar_eg: كيميا
        ar: كيمياء
        en: chemistry
      - text: kacang
        ar_eg: فول سوداني
        ar: فول سوداني
        en: peanuts
      - text: cokelat / coklat
        ar_eg: شوكولاتة
        ar: شوكولاتة
        en: chocolate
    words: [bahan, kimia, kacang, cokelat / coklat]
  - id: e02
    type: match_pairs
    pairs:
      - text: anggur
        ar_eg: عنب
        ar: عنب
        en: grapes
      - text: segar
        ar_eg: فريش
        ar: طازج
        en: fresh
      - text: kering
        ar_eg: ناشف
        ar: جاف
        en: dry
      - text: diet
        ar_eg: رجيم
        ar: حمية
        en: diet
    words: [anggur, segar, kering, diet]
  - id: e03
    type: listen
    text: Maaf, saya tidak bisa makan ini. Saya alergi kacang.
    question:
      ar_eg: عنده حساسية من إيه؟
      ar: مِمّ لديه حساسية؟
      en: What is he allergic to?
    options: [فول سوداني, لبن, سمك]
    answer: 0
    meaning:
      ar_eg: آسف، مش هقدر آكل ده. عندي حساسية من الفول السوداني.
      ar: عذرًا، لا أستطيع أكل هذا. لديّ حساسية من الفول السوداني.
      en: Sorry, I can't eat this. I'm allergic to peanuts.
    words: [kacang]
  - id: e04
    type: fill_blank
    sentence: Saya sedang ___. Saya tidak makan gula dan nasi.
    meaning:
      ar_eg: أنا عامل ___. مش باكل سكر ولا رز.
      ar: أنا أتبع ___. لا آكل السكر ولا الأرز.
      en: I'm on a ___. I don't eat sugar or rice.
    options: [diet, kimia, anggur]
    answers: [diet]
    words: [diet, kimia, anggur]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حاجة حلوة بنية من الكاكاو؟
      ar: حلوى بنية من الكاكاو؟
      en: Something sweet and brown made from cocoa?
    options: [kacang, cokelat, bahan]
    answer: 1
    explain:
      ar_eg: cokelat (أو coklat) = شوكولاتة.
      ar: cokelat (أو coklat) = شوكولاتة.
      en: cokelat (or coklat) = chocolate.
    words: [cokelat / coklat, kacang, bahan]
  - id: e06
    type: fill_blank
    sentence: Sayur ini baru dari kebun. Masih ___!
    meaning:
      ar_eg: الخضار ده لسه جاي من الجنينة. لسه ___!
      ar: هذه الخضار وصلت للتو من البستان. ما زالت ___!
      en: These vegetables just came from the garden. Still ___!
    options: [kering, segar, diet]
    answers: [segar]
    words: [segar, kering, diet]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الأكل ده مافيهوش مواد كيماوية.
      ar: هذا الطعام خالٍ من المواد الكيميائية.
      en: This food has no chemicals in it.
    answer: Makanan ini tidak memakai bahan kimia.
    distractors: [anggur, kacang]
    words: [bahan, kimia]
  - id: e08
    type: translate
    direction: from_target
    source_text: Di Sembalun ada anggur dan stroberi segar.
    answers_meaning:
      ar_eg: [في سمبالون فيه عنب وفراولة فريش, في سمبالون فيه عنب وفراولة طازة]
      ar: [في سمبالون عنب وفراولة طازجة]
      en: [In Sembalun there are fresh grapes and strawberries, Sembalun has fresh grapes and strawberries]
    words: [anggur, segar]
  - id: e09
    type: speaking
    text: Saya mau cokelat dengan kacang.
    meaning:
      ar_eg: عايز شوكولاتة بالفول السوداني.
      ar: أريد شوكولاتة بالفول السوداني.
      en: I'd like chocolate with peanuts.
    words: [cokelat / coklat, kacang]
  - id: e10
    type: multiple_choice
    question: Musim hujan sudah lewat. Sekarang tanahnya ___.
    options: [segar, diet, kering]
    answer: 2
    explain:
      ar_eg: kering = ناشف، جاف.
      ar: kering = جاف.
      en: kering = dry.
    words: [kering, segar, diet, bahan, kimia]
dialogue:
  lines:
    - speaker: Penjual
      text: Mau coba cokelat stroberi dari Sembalun, Mas?
      ar_eg: تحب تجرب شوكولاتة بالفراولة من سمبالون؟
      ar: أتحب أن تجرّب شوكولاتة الفراولة من سمبالون؟
      en: Want to try strawberry chocolate from Sembalun?
    - speaker: Mohamed
      text: Boleh. Apa bahannya? Ada kacang?
      ar_eg: ماشي. مكوناتها إيه؟ فيها فول سوداني؟
      ar: حسنًا. ما مكوّناتها؟ هل فيها فول سوداني؟
      en: Sure. What's in it? Any peanuts?
    - speaker: Penjual
      text: Tidak ada. Isinya cokelat, gula dan stroberi segar dari kebun.
      ar_eg: لأ. شوكولاتة وسكر وفراولة فريش من الجنينة بس.
      ar: لا. فقط شوكولاتة وسكر وفراولة طازجة من البستان.
      en: None. Just chocolate, sugar and fresh strawberries from the farm.
    - speaker: Mohamed
      text: Tidak pakai bahan kimia?
      ar_eg: من غير كيماويات؟
      ar: بلا مواد كيميائية؟
      en: No chemicals?
    - speaker: Penjual
      text: Betul. Ada juga stroberi kering untuk yang sedang diet.
      ar_eg: صح. وفيه كمان فراولة مجففة للي عامل رجيم.
      ar: صحيح. وعندنا فراولة مجففة لمن يتبع حمية.
      en: Right. There are dried strawberries too, for people on a diet.
