schema: kabar.lesson/v1
id: bipa2.u01.l03
language: id
title: Cukup mahal, terlalu keras
can_do:
  ar_eg: تقول «شوية» و«كفاية» و«زيادة عن اللزوم» قبل الصفة.
  ar: أن تُدرّج الصفات (قليلًا، إلى حد ما، أكثر من اللازم).
  en: Grade adjectives.
slides:
  - title: Agak, cukup, terlalu
    body:
      ar_eg: |
        سلّم صغير للصفة، وكله قبل الصفة:
        - agak = شوية: agak mahal = غالي شوية
        - cukup = إلى حد كبير / كفاية: cukup mahal = غالي برضه
        - sangat / … sekali = جدًا (عارفينها من BIPA 1)
        - terlalu = زيادة عن اللزوم: terlalu mahal = غالي زيادة
        في الشارع بيقولوا:
        - gimana = bagaimana (إزاي، عامل إيه)
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
      ar: |
        سُلّم صغير للصفة، وكل كلماته تسبقها:
        - agak = قليلًا / نوعًا ما: agak mahal
        - cukup = إلى حد كبير / بما يكفي: cukup mahal
        - sangat / … sekali = جدًا (من BIPA 1)
        - terlalu = أكثر من اللازم: terlalu mahal
        في كلام الشارع:
        - gimana = bagaimana (كيف)
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
      en: |
        A little ladder; all of these go before the adjective:
        - agak = a bit, rather: agak mahal
        - cukup = quite, fairly; enough: cukup mahal
        - sangat / … sekali = very (from BIPA 1)
        - terlalu = too: terlalu mahal
        On the street:
        - gimana = bagaimana (how)
        - banget = sekali (very), after the adjective just like sekali
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
    grammar: id.adverb.degree
    examples:
      - text: Rumah Ni Luh agak jauh.
        ar_eg: بيت ني لوه بعيد شوية.
        ar: بيت ني لوه بعيد قليلًا.
        en: Ni Luh's house is a bit far.
      - text: Gamelan ini cukup mahal, tapi bagus.
        ar_eg: الجاميلان ده غالي شوية بس حلو.
        ar: هذا الغاميلان غالٍ نسبيًا لكنه جيد.
        en: This gamelan is fairly pricey, but good.
  - title: Terlalu ≠ sekali
    body:
      ar_eg: |
        terlalu زي «زيادة» عندنا: معناها فيه مشكلة.
        Terlalu pedas = حراق زيادة (مش هقدر آكله).
        عايز تمدح؟ قول enak sekali أو sangat enak، مش terlalu enak.
      ar: |
        terlalu تعني الإفراط المذموم، كقولنا «زيادة عن اللزوم».
        Terlalu pedas = حارّ أكثر من اللازم.
        وللمدح قل enak sekali أو sangat enak، لا terlalu enak.
      en: |
        terlalu is like Egyptian «زيادة»: it signals a problem.
        Terlalu pedas = too spicy (I can't eat it).
        To praise, say enak sekali or sangat enak, not terlalu enak.
    grammar: id.adverb.degree
    examples:
      - text: Suaranya terlalu keras.
        ar_eg: الصوت عالي زيادة.
        ar: الصوت عالٍ أكثر من اللازم.
        en: The sound is too loud.
      - text: Nasi gorengnya enak sekali!
        ar_eg: الرز المقلي حلو أوي!
        ar: الأرز المقلي لذيذ جدًا!
        en: The fried rice is really delicious!
  - title: Kurang garam
    body:
      ar_eg: |
        kurang (من الدرس الأولاني) = مش … كفاية / ناقص:
        Kurang garam = ناقص ملح. Suaranya kurang keras = الصوت مش عالي كفاية.
        وCukup! لوحدها = كفاية!
      ar: |
        kurang (من الدرس الأول) = غير كافٍ / ناقص:
        Kurang garam = ينقصه ملح. Suaranya kurang keras = الصوت ليس عاليًا بما يكفي.
        وCukup! وحدها = كفى!
      en: |
        kurang (from lesson 1) = not … enough, lacking:
        Kurang garam = needs salt. Suaranya kurang keras = It's not loud enough.
        Cukup! on its own = Enough!
    grammar: id.adverb.degree
    examples:
      - text: Sayurnya kurang garam.
        ar_eg: الخضار ناقصه ملح.
        ar: الخضار ينقصها الملح.
        en: The vegetables need more salt.
      - text: Cukup, terima kasih!
        ar_eg: كفاية، شكرًا!
        ar: هذا يكفي، شكرًا!
        en: That's enough, thank you!
  - title: Lumayan!
    body:
      ar_eg: |
        lumayan = مش بطال / معقول. رد مشهور جدًا:
        Enak? — Lumayan! = حلو؟ — مش بطال!
        وممكن قبل الصفة: lumayan jauh = بعيد حبتين.
      ar: |
        lumayan = لا بأس به، وهو ردّ شائع جدًا:
        Enak؟ — Lumayan! = لذيذ؟ — لا بأس!
        ويأتي قبل الصفة: lumayan jauh = بعيد إلى حد ما.
      en: |
        lumayan = not bad, pretty OK. A very common reply:
        Enak? — Lumayan! = Tasty? — Not bad!
        It can go before an adjective too: lumayan jauh = fairly far.
    grammar: id.adverb.degree
    examples:
      - text: Bagaimana suaranya? — Lumayan.
        ar_eg: صوتها عامل إزاي؟ — مش بطال.
        ar: كيف صوتها؟ — لا بأس به.
        en: How does it sound? — Not bad.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: cukup
        ar_eg: كفاية، لحد ما
        ar: كافٍ، إلى حدّ ما
        en: enough, fairly
      - text: terlalu
        ar_eg: زيادة عن اللزوم
        ar: أكثر من اللازم
        en: too
      - text: lumayan
        ar_eg: مش بطال
        ar: لا بأس به
        en: not bad, fairly
      - text: pelan
        ar_eg: واطي، بطيء
        ar: منخفض، بطيء
        en: soft, slow
      - text: biola
        ar_eg: كمان
        ar: كمان
        en: violin
      - text: garam
        ar_eg: ملح
        ar: ملح
        en: salt
    words: [cukup, terlalu, lumayan, pelan, biola, garam]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: البياع قال السعر وإنت مش هتقدر تدفع كده أبدًا. تقول إيه؟
      ar: ذكر البائع ثمنًا لا تستطيع دفعه أبدًا. ماذا تقول؟
      en: The seller names a price you simply can't pay. What do you say?
    options: [Lumayan mahal., 'Mahal sekali, bagus!', Terlalu mahal!]
    answer: 2
    explain:
      ar_eg: terlalu = زيادة عن اللزوم، يعني مش هتشتري.
      ar: terlalu تعني الإفراط، أي أنك لن تشتري.
      en: terlalu = too much, so it's a problem.
    words: [terlalu, mahal, lumayan]
  - id: e03
    type: listen
    text: Suara biolanya terlalu pelan.
    options: ['Suara biolanya terlalu pelan.', 'Suara biolanya terlalu keras.', 'Suara biolanya cukup keras.']
    answer: 0
    meaning:
      ar_eg: صوت الكمان واطي بزيادة.
      ar: صوت الكمان منخفض أكثر من اللازم.
      en: The violin is far too quiet.
    words: [biola, pelan, terlalu, cukup]
  - id: e04
    type: fill_blank
    sentence: Sayurnya ___ garam.
    meaning:
      ar_eg: الخضار ناقصه ملح.
      ar: الخضار ينقصها الملح.
      en: The vegetables need more salt.
    options: [kurang, terlalu, cukup]
    answers: [kurang]
    words: [kurang, garam]
  - id: e05
    type: fill_blank
    sentence: Suaranya terlalu ___. Saya tidak bisa mendengar.
    meaning:
      ar_eg: الصوت واطي أوي. مش قادر أسمع.
      ar: الصوت منخفض جدًا. لا أستطيع أن أسمع.
      en: It's too quiet. I can't hear.
    options: [pelan, garam, biola]
    answers: [pelan]
    words: [pelan, terlalu]
  - id: e06
    type: speaking
    text: Biola ini lumayan, tapi suaranya terlalu pelan.
    meaning:
      ar_eg: الكمان ده مش بطال، بس صوته واطي بزيادة.
      ar: هذا الكمان لا بأس به، لكن صوته منخفض جدًا.
      en: This violin isn't bad, but it's too quiet.
    words: [biola, lumayan, pelan, terlalu]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «السمك ناقصه ملح»؟
      ar: كيف تقول «السمك ينقصه الملح»؟
      en: How do you say "The fish needs more salt"?
    options: ['Ikannya kurang garam.', 'Ikannya cukup garam.', 'Ikannya garam kurang.']
    answer: 0
    words: [garam, cukup]
dialogue:
  title: Biola tua Ni Luh
  lines:
    - speaker: Ni Luh
      text: Gimana suara biolaku?
      ar_eg: صوت الكمنجة بتاعتي عامل إزاي؟
      ar: كيف صوت كماني؟
      en: How does my violin sound?
    - speaker: Mohamed
      text: Lumayan! Tapi agak pelan.
      ar_eg: مش بطال! بس واطي شوية.
      ar: لا بأس! لكنه منخفض قليلًا.
      en: Not bad! But a bit quiet.
    - speaker: Ni Luh
      text: Kalau sekarang?
      ar_eg: وكده؟
      ar: وماذا عن الآن؟
      en: And now?
    - speaker: Mohamed
      text: Wah, sekarang terlalu keras!
      ar_eg: يا ساتر، كده عالي زيادة!
      ar: يا إلهي، الآن صار عاليًا أكثر من اللازم!
      en: Whoa, now it's too loud!
    - speaker: Ni Luh
      text: Biola ini cukup tua, tapi suaranya masih bagus.
      ar_eg: الكمنجة دي قديمة شوية، بس صوتها لسه حلو.
      ar: هذا الكمان قديم نوعًا ما، لكن صوته ما زال جيدًا.
      en: This violin is fairly old, but it still sounds good.
    - speaker: Mohamed
      text: Betul, suaranya indah banget.
      ar_eg: صح، صوتها جميل أوي.
      ar: صحيح، صوته جميل جدًا.
      en: True, it sounds really beautiful.
