schema: kabar.lesson/v1
id: bipa3.u09.l07
language: id
title: Juha dari Mesir
can_do:
  ar_eg: تحكي حدوتة مصرية (جحا والحمار) بالإندونيسي.
  ar: أن تروي حكاية مصرية (جحا وابنه والحمار) بالإندونيسية.
  en: Tell an Egyptian tale (Juha, his son and the donkey) in Indonesian.
slides:
  - title: Dongeng dari Mesir
    body:
      ar_eg: |
        دلوقتي دورك تحكي! استعمل القالب: Pada zaman dahulu, hiduplah … ← Suatu hari … ← Akhirnya … ← Amanat.
        في إندونيسيا بيحكوا حواديت شبه حواديت جحا عن Nasruddin Hoja (نصر الدين خوجة) وAbu Nawas (أبو نواس)، أبطال الذكاء والضحك.
        كلمات الحدوتة: keledai (حمار)، menunggang (يركب حيوان)، menuntun (يشد / يقود بإيده)، menertawakan (يضحك على).
      ar: |
        حان دورك لتحكي! استعمل القالب: Pada zaman dahulu, hiduplah … ← Suatu hari … ← Akhirnya … ← Amanat.
        وفي إندونيسيا تُروى حكايات شبيهة بحكايات جحا عن Nasruddin Hoja (نصر الدين خوجة) وAbu Nawas (أبو نواس)، أبطال الفطنة والطرافة.
        مفردات الحكاية: keledai (حمار)، menunggang (يركب دابة)، menuntun (يقود بيده)، menertawakan (يضحك من).
      en: |
        Now it's your turn to tell one! Use the frame: Pada zaman dahulu, hiduplah … → Suatu hari … → Akhirnya … → Amanat.
        In Indonesia, tales like Juha's are told about Nasruddin Hoja and Abu Nawas, the heroes of clever, funny stories.
        Story words: keledai (donkey), menunggang (to ride an animal), menuntun (to lead by hand), menertawakan (to laugh at).
    examples:
      - text: Pada zaman dahulu, hiduplah seorang laki-laki bernama Juha.
        ar_eg: كان يا ما كان، كان فيه راجل اسمه جحا.
        ar: كان يا ما كان، عاش رجلٌ اسمه جحا.
        en: Once upon a time there lived a man called Juha.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: keledai
        ar_eg: حمار
        ar: حمار
        en: donkey
      - text: menunggang
        ar_eg: يركب (حمار / حصان)
        ar: يركب (دابة)
        en: to ride (an animal)
      - text: menuntun
        ar_eg: يشد / يقود بإيده
        ar: يقود باليد
        en: to lead (by the hand or rein)
      - text: menertawakan
        ar_eg: يضحك على
        ar: يضحك من / يسخر من
        en: to laugh at
      - text: amanat
        ar_eg: العبرة
        ar: العبرة
        en: moral
    words: [keledai, menunggang, menuntun, menertawakan, amanat]
  - id: e02
    type: multiple_choice
    question: Juha ___ keledai, dan anaknya berjalan kaki.
    options: [menuntun, menunggang, menenun]
    answer: 1
    explain:
      ar_eg: جحا راكب والولد ماشي، فـ menunggang (يركب).
      ar: جحا راكب والولد ماشٍ، فالفعل menunggang (يركب).
      en: Juha rides while his son walks, so menunggang (ride).
    words: [menunggang, keledai]
  - id: e03
    type: listen
    text: Orang-orang di pasar menertawakan Juha.
    options:
      - Orang-orang di pasar menertawakan Juha.
      - Orang-orang di pasar menunggu Juha.
      - Anak-anak di pasar menertawakan Juha.
    answer: 0
    meaning:
      ar_eg: الناس في السوق ضحكوا على جحا.
      ar: ضحك الناس في السوق من جحا.
      en: The people at the market laughed at Juha.
    words: [menertawakan]
  - id: e04
    type: fill_blank
    sentence: Mereka berjalan kaki dan ___ keledainya.
    meaning:
      ar_eg: مشيوا على رجليهم وشدّوا الحمار وراهم.
      ar: مشوا على أقدامهم وقادوا حمارهم.
      en: They walked and led their donkey.
    options: [menunggang, menertawakan, menuntun]
    answers: [menuntun]
    words: [menuntun, keledai]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه عبرة حدوتة جحا والحمار؟
      ar: ما عبرة حكاية جحا وابنه والحمار؟
      en: What's the moral of the story of Juha and the donkey?
    options:
      - Keledai lebih pintar daripada orang.
      - Jangan pergi ke pasar.
      - Kita tidak bisa menyenangkan semua orang.
    answer: 2
    explain:
      ar_eg: menyenangkan هنا فعل = يرضي / يفرّح. «رضا الناس غاية لا تُدرك».
      ar: menyenangkan هنا فعل بمعنى يُرضي، و«رضا الناس غاية لا تُدرك».
      en: Here menyenangkan is a verb, "to please". You can't please everyone.
    words: [amanat]
  - id: e06
    type: build_sentence
    source:
      ar_eg: في يوم من الأيام، جحا وابنه راحوا السوق.
      ar: وفي يوم من الأيام ذهب جحا وابنه إلى السوق.
      en: One day, Juha and his son went to the market.
    answer: Suatu hari, Juha dan anaknya pergi ke pasar.
    distractors: [hiduplah, keledai]
    words: [suatu hari]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الناس ضحكوا على جحا وحماره.
      ar: ضحك الناس من جحا وحماره.
      en: The people laughed at Juha and his donkey.
    answers:
      - Orang-orang menertawakan Juha dan keledainya.
      - Orang-orang menertawakan Juha dan keledainya
      - Orang menertawakan Juha dan keledainya.
      - Orang menertawakan Juha dan keledainya
      - Orang-orang itu menertawakan Juha dan keledainya.
      - Semua orang menertawakan Juha dan keledainya.
      - Orang-orang menertawakan Juha dan keledai itu.
      - Juha dan keledainya ditertawakan orang-orang.
      - Juha dan keledainya ditertawakan oleh orang-orang.
    words: [menertawakan, keledai]
  - id: e08
    type: dictation
    text: Akhirnya, mereka berdua menuntun keledai itu.
    meaning:
      ar_eg: وفي الآخر، الاتنين شدّوا الحمار ومشيوا.
      ar: وفي النهاية قاد الاثنان ذلك الحمار.
      en: In the end, the two of them led the donkey.
    words: [menuntun, keledai]
  - id: e09
    type: speaking
    text: Juha dan anaknya menunggang keledai berdua.
    meaning:
      ar_eg: جحا وابنه ركبوا الحمار هم الاتنين.
      ar: ركب جحا وابنه الحمار معًا.
      en: Juha and his son both rode the donkey.
    words: [menunggang, keledai]
dialogue:
  title: Juha dan keledainya
  lines:
    - speaker: Mohamed
      text: Mas, di Mesir ada dongeng tentang Juha. Mau dengar?
      ar_eg: يا ماس، في مصر فيه حدوتة عن جحا. تحب تسمعها؟
      ar: يا ماس، في مصر حكاية عن جحا. أتحب أن تسمعها؟
      en: Mas, in Egypt there's a tale about Juha. Want to hear it?
    - speaker: Mas Rizal
      text: Mau! Di Indonesia kami punya cerita Abu Nawas.
      ar_eg: أكيد! إحنا في إندونيسيا عندنا حواديت أبو نواس.
      ar: بالتأكيد! لدينا في إندونيسيا حكايات أبي نواس.
      en: Yes please! In Indonesia we have the Abu Nawas stories.
    - speaker: Mohamed
      text: Suatu hari, Juha menunggang keledai, dan anaknya berjalan kaki. Orang-orang bilang, “Kasihan anaknya!”
      ar_eg: 'في يوم من الأيام، جحا ركب الحمار وابنه ماشي. الناس قالوا: «يا حرام على الولد!»'
      ar: 'في يوم من الأيام ركب جحا الحمار ومشى ابنه، فقال الناس: «مسكين الولد!»'
      en: One day, Juha rode the donkey and his son walked. People said, "Poor boy!"
    - speaker: Mohamed
      text: Lalu mereka berdua menunggang keledai. Orang-orang bilang, “Kasihan keledainya!”
      ar_eg: 'بعدين ركبوا الحمار هم الاتنين. الناس قالوا: «يا حرام على الحمار!»'
      ar: 'ثم ركبا الحمار معًا، فقال الناس: «مسكين الحمار!»'
      en: Then they both rode the donkey. People said, "Poor donkey!"
    - speaker: Mohamed
      text: Akhirnya, mereka berdua menuntun keledai itu. Orang-orang menertawakan mereka!
      ar_eg: وفي الآخر الاتنين مشيوا وشدّوا الحمار. والناس ضحكوا عليهم!
      ar: وفي النهاية قادا الحمار ماشيَين، فضحك الناس منهما!
      en: In the end, they both walked, leading the donkey. People laughed at them!
    - speaker: Mas Rizal
      text: Ha-ha! Amanatnya, kita tidak bisa menyenangkan semua orang.
      ar_eg: هههه! العبرة إننا مش هنقدر نرضي كل الناس.
      ar: ها ها! والعبرة أننا لا نستطيع إرضاء جميع الناس.
      en: Ha ha! The moral is, you can't please everyone.
