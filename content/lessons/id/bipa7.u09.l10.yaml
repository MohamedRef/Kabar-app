schema: kabar.lesson/v1
id: bipa7.u09.l10
language: id
title: Mengajar di daerah 3T
can_do:
  ar_eg: تتكلّم عن التعليم في المناطق البعيدة وعن المساواة والصور النمطية.
  ar: أن تتحدّث عن التعليم في المناطق النائية وعن المساواة والصور النمطية.
  en: Talk about schooling in remote regions, equality and stereotypes.
slides:
  - title: Sekolah di ujung negeri
    body:
      ar_eg: |
        daerah 3T = terdepan (الواجهة)، terluar (الأبعد)، tertinggal (المحرومة).
        فيها مدارس كتير بيشتغل فيها guru honorer: مدرّس بعقد مؤقّت ومرتّبه قليل جدًا.
        angka melek huruf (نسبة اللي بيعرفوا يقروا) في بعض مناطق بابوا الجبلية لسه أقل من المتوسّط، وفيه كبار لسه buta huruf (أمّيين).
        kesetaraan = المساواة: كل طفل ليه نفس الحق في التعليم.
        المدرّسين الجداد لازم يسيبوا stereotip (الصور النمطية) ويتعاملوا بـ empati (تعاطف).
        - في الكلام: gimana = bagaimana.
      ar: |
        daerah 3T = terdepan (الواجهة) وterluar (الأبعد) وtertinggal (الأقلّ نموًّا).
        وفي مدارس كثيرة فيها يعمل guru honorer: معلّم متعاقد مؤقّتًا براتب زهيد جدًّا.
        وما زال angka melek huruf (معدّل الإلمام بالقراءة) في بعض مرتفعات بابوا دون المتوسّط، وبعض الكبار buta huruf (أمّيّون).
        kesetaraan = المساواة: لكلّ طفل الحقّ نفسه في التعليم.
        وعلى المعلّمين الجدد أن يتركوا stereotip (الصور النمطية) ويتعاملوا بـ empati (التعاطف).
        - في الكلام اليومي: gimana = bagaimana.
      en: |
        daerah 3T = terdepan (frontier), terluar (outermost), tertinggal (underdeveloped).
        Many schools there rely on a guru honorer: a contract teacher on a very low wage.
        The angka melek huruf (literacy rate) in some Papuan highland areas is still below average, and some adults are buta huruf (illiterate).
        kesetaraan = equality: every child has the same right to schooling.
        New teachers must drop stereotip (stereotypes) and work with empati (empathy).
        - In speech: gimana = bagaimana.
    examples:
      - text: Pulau itu termasuk wilayah terluar Indonesia.
        ar_eg: الجزيرة دي من أبعد مناطق إندونيسيا.
        ar: تلك الجزيرة من أبعد أطراف إندونيسيا.
        en: That island is one of Indonesia's outermost areas.
      - text: Guru honorer itu digaji sangat kecil.
        ar_eg: المدرّس المؤقّت ده مرتّبه صغيّر جدًا.
        ar: يتقاضى ذلك المعلّم المتعاقد أجرًا زهيدًا جدًّا.
        en: That contract teacher is paid very little.
      - text: Stereotip tentang orang Papua harus dilawan.
        ar_eg: الصور النمطية عن أهل بابوا لازم تتحارب.
        ar: يجب مواجهة الصور النمطية عن أهل بابوا.
        en: Stereotypes about Papuans must be challenged.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: daerah 3T
        ar_eg: المناطق الحدودية والنائية والمحرومة
        ar: المناطق الحدودية والنائية والأقلّ نموًّا
        en: frontier, outermost and underdeveloped regions
      - text: terluar
        ar_eg: الأبعد (على الحدود)
        ar: الأبعد، الواقع على الأطراف
        en: outermost
      - text: guru honorer
        ar_eg: مدرّس بعقد مؤقّت ومرتّب قليل
        ar: معلّم متعاقد مؤقّت
        en: contract (non-civil-servant) teacher
      - text: buta huruf
        ar_eg: أمّي (ما بيعرفش يقرا)
        ar: أمّيّ
        en: illiterate
    words: [daerah 3T, terluar, guru honorer, buta huruf]
  - id: e02
    type: match_pairs
    pairs:
      - text: angka melek huruf
        ar_eg: نسبة اللي بيعرفوا يقروا
        ar: معدّل الإلمام بالقراءة والكتابة
        en: literacy rate
      - text: kesetaraan
        ar_eg: مساواة
        ar: المساواة
        en: equality
      - text: stereotip
        ar_eg: صورة نمطية
        ar: صورة نمطية
        en: stereotype
      - text: empati
        ar_eg: تعاطف / إنك تحسّ بغيرك
        ar: التعاطف
        en: empathy
    words: [angka melek huruf, kesetaraan, stereotip, empati]
  - id: e03
    type: listen
    text: Angka melek huruf di kabupaten itu naik setelah ada sekolah malam.
    question:
      ar_eg: إيه اللي زاد؟
      ar: ما الذي ارتفع؟
      en: What went up?
    options: [نسبة اللي بيعرفوا يقروا, المساواة, المدرّسين المؤقّتين]
    answer: 0
    meaning:
      ar_eg: نسبة اللي بيعرفوا يقروا في المركز ده زادت بعد ما فتحوا مدرسة ليلية.
      ar: ارتفع معدّل الإلمام بالقراءة في تلك المقاطعة بعد افتتاح مدرسة ليلية.
      en: The literacy rate in that regency rose after a night school opened.
    words: [angka melek huruf]
  - id: e04
    type: fill_blank
    sentence: Nenek saya ___, jadi cucunya membacakan surat untuknya.
    meaning:
      ar_eg: جدّتي ___، فحفيدها بيقرالها الجوابات.
      ar: جدّتي ___، فيقرأ لها حفيدها الرسائل.
      en: My grandmother is ___, so her grandson reads her letters to her.
    options: [buta huruf, terluar, kesetaraan]
    answers: [buta huruf]
    words: [buta huruf, terluar, kesetaraan]
    explain:
      ar_eg: جدتي buta huruf = مابتعرفش تقرا، علشان كده حفيدها بيقرالها. terluar = أبعد نقطة وkesetaraan = مساواة.
      ar: جدتي buta huruf أي أمّية لا تقرأ. terluar الأبعد وkesetaraan مساواة.
      en: Someone who can't read is buta huruf.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «daerah 3T» يعني إيه؟
      ar: ما «daerah 3T»؟
      en: What is a 'daerah 3T'?
    options: [Kota besar dengan tiga terminal., 'Daerah terdepan, terluar, dan tertinggal.', Tiga provinsi di Jawa.]
    answer: 1
    explain:
      ar_eg: 3T = الواجهة والأبعد والمحرومة.
      ar: 3T = الحدودية والأبعد والأقلّ نموًّا.
      en: 3T = frontier, outermost, underdeveloped.
    words: [daerah 3T, terluar]
  - id: e06
    type: fill_blank
    sentence: Guru yang baik mengajar dengan ___, bukan dengan marah.
    meaning:
      ar_eg: المدرّس الكويس بيعلّم بـ ___، مش بالزعيق.
      ar: المعلّم الجيّد يعلّم بـ ___ لا بالغضب.
      en: A good teacher teaches with ___, not anger.
    options: [empati, stereotip, guru honorer]
    answers: [empati]
    words: [empati, stereotip, guru honorer]
    explain:
      ar_eg: المدرس الكويس بيعلّم بـ empati = تعاطف، مش بزعيق. stereotip = صورة نمطية وguru honorer = مدرس بعقد.
      ar: المعلم الجيد يعلّم بـ empati أي تعاطف. stereotip صورة نمطية.
      en: A good teacher uses empati, not anger.
  - id: e07
    type: build_sentence
    source:
      ar_eg: كل طفل ليه حق متساوي في التعليم.
      ar: لكلّ طفل حقّ متساوٍ في التعليم.
      en: Every child has an equal right to education.
    answer: Setiap anak berhak atas kesetaraan pendidikan.
    distractors: [empati, stereotip]
    words: [kesetaraan]
    explain:
      ar_eg: Setiap anak (كل طفل) + berhak atas (له الحق في) + kesetaraan pendidikan (المساواة في التعليم). empati وstereotip زيادة.
      ar: Setiap anak berhak atas kesetaraan pendidikan. empati وstereotip زائدتان.
      en: Setiap anak + berhak atas + kesetaraan pendidikan. empati and stereotip are extra.
  - id: e08
    type: translate
    direction: from_target
    source_text: Banyak guru honorer di daerah 3T mengajar tiga kelas sekaligus.
    answers_meaning:
      ar_eg: [مدرّسين مؤقّتين كتير في المناطق النائية بيدرّسوا تلات فصول مرة واحدة, كتير من المدرّسين المتعاقدين في المناطق البعيدة بيدرّسوا تلات فصول في نفس الوقت]
      ar: [يدرّس كثير من المعلّمين المتعاقدين في المناطق النائية ثلاثة صفوف معًا, كثير من معلّمي العقود في مناطق 3T يدرّسون ثلاثة فصول في آن]
      en: [Many contract teachers in 3T regions teach three classes at once, 'In remote 3T areas, many contract teachers handle three classes at the same time']
    words: [guru honorer, daerah 3T]
  - id: e09
    type: speaking
    text: Empati lebih kuat daripada stereotip.
    meaning:
      ar_eg: التعاطف أقوى من الصور النمطية.
      ar: التعاطف أقوى من الصورة النمطية.
      en: Empathy is stronger than stereotypes.
    words: [empati, stereotip]
  - id: e10
    type: multiple_choice
    question: Apa arti "kesetaraan pendidikan"?
    options: [Anak di daerah terluar mendapat kesempatan yang sama dengan anak di kota., Semua guru honorer pindah ke Jakarta., Hanya anak kota boleh sekolah.]
    answer: 0
    explain:
      ar_eg: المساواة = طفل القرية البعيدة زي طفل المدينة.
      ar: المساواة = لطفل الأطراف فرصة طفل المدينة نفسها.
      en: Equality = the remote child gets the city child's chances.
    words: [kesetaraan, terluar, guru honorer, buta huruf, angka melek huruf, stereotip]
dialogue:
  lines:
    - speaker: Kak Yosua
      text: Mohamed, kakak saya guru honorer di Pegunungan Arfak.
      ar_eg: يا محمد، أختي مدرّسة مؤقّتة في جبال أرفاك.
      ar: يا محمد، أختي معلّمة متعاقدة في جبال أرفاك.
      en: Mohamed, my sister is a contract teacher in the Arfak Mountains.
    - speaker: Mohamed
      text: Itu termasuk daerah 3T, kan? Sekolahnya gimana?
      ar_eg: دي من المناطق النائية، صح؟ المدرسة عاملة إزاي؟
      ar: هذه من مناطق 3T، أليس كذلك؟ كيف مدرستها؟
      en: That's a 3T region, isn't it? What's the school like?
    - speaker: Kak Yosua
      text: Satu ruang, tiga kelas. Beberapa orang tua murid masih buta huruf.
      ar_eg: أوضة واحدة وتلات فصول. وكام واحد من أهالي التلاميذ لسه أمّيين.
      ar: غرفة واحدة وثلاثة صفوف، وبعض أولياء الأمور ما زالوا أمّيّين.
      en: One room, three classes. Some parents are still illiterate.
    - speaker: Mohamed
      text: Dia pasti punya empati yang besar.
      ar_eg: أكيد عندها تعاطف كبير.
      ar: لا بدّ أنها شديدة التعاطف.
      en: She must have great empathy.
    - speaker: Kak Yosua
      text: Ya. Dia bilang, kesetaraan bukan slogan. Anak Arfak juga berhak bermimpi.
      ar_eg: أيوه. بتقول إن المساواة مش شعار. عيال أرفاك كمان من حقّهم يحلموا.
      ar: نعم، تقول إنّ المساواة ليست شعارًا، فلأطفال أرفاك أيضًا حقّ الحلم.
      en: Yes. She says equality isn't a slogan. Arfak kids have the right to dream too.
