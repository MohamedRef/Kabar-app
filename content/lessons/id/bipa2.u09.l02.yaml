schema: kabar.lesson/v1
id: bipa2.u09.l02
language: id
title: Yg, gk, udh, bgt
can_do:
  ar_eg: تفك اختصارات الشات الإندونيسي وتقراها بسرعة.
  ar: أن تفهم الاختصارات المستعملة في المحادثات الإندونيسية.
  en: Decode chat spelling.
slides:
  - title: Tanpa huruf vokal
    body:
      ar_eg: |
        الإندونيسيين بيشيلوا الحروف المتحركة في الشات:
        yg = yang، dgn = dengan، dr = dari، utk = untuk، krn = karena، tp = tapi، jd = jadi، sy = saya، km = kamu، blm = belum، smp = sampai.
        زي «الفرانكو» عندنا لما بنكتب msh بدل «مش».
      ar: |
        يحذف الإندونيسيون الحروف الصائتة في المحادثات:
        yg = yang، dgn = dengan، dr = dari، utk = untuk، krn = karena، tp = tapi، jd = jadi، sy = saya، km = kamu، blm = belum، smp = sampai.
        وهو يشبه ما يُعرف بـ«الفرانكو أراب» عندنا.
      en: |
        Indonesian chats drop the vowels:
        yg = yang, dgn = dengan, dr = dari, utk = untuk, krn = karena, tp = tapi, jd = jadi, sy = saya, km = kamu, blm = belum, smp = sampai.
        Just like Egyptian "Franco" texting (msh for «مش»).
    grammar: id.chat.abbreviations
    examples:
      - text: sy blm smp, tp udh dekat
        ar_eg: لسه ماوصلتش، بس قربت.
        ar: لم أصل بعد، لكني اقتربت.
        en: I haven't arrived yet, but I'm close.
  - title: Gk, udh, bgt, aja
    body:
      ar_eg: |
        الشات بيكتب الكلام العامي زي ما بيتقال:
        - gk / ga / gak = nggak = tidak (لأ / مش).
        - udh / udah = sudah.
        - bgt = banget (أوي).
        - aja = saja (بس).
        - gmn = gimana = bagaimana، knp = kenapa، brp = berapa.
        - gk papa = nggak apa-apa (ولا يهمك).
      ar: |
        تكتب المحادثات الكلام العامي كما يُنطق:
        - gk / ga / gak = nggak = tidak.
        - udh / udah = sudah.
        - bgt = banget (جدًا).
        - aja = saja (فقط).
        - gmn = bagaimana، knp = kenapa، brp = berapa.
        - gk papa = لا بأس.
      en: |
        Chats spell casual speech as it sounds:
        - gk / ga / gak = nggak = tidak (not).
        - udh / udah = sudah.
        - bgt = banget (really, so).
        - aja = saja (just).
        - gmn = gimana = bagaimana, knp = kenapa, brp = berapa.
        - gk papa = nggak apa-apa (no problem).
    grammar: id.chat.abbreviations
    examples:
      - text: gk papa kok, santai aja
        ar_eg: ولا يهمك، روّق كده.
        ar: لا بأس، استرخِ.
        en: It's fine, relax.
  - title: Hati2, otw, wkwk
    body:
      ar_eg: |
        - الرقم 2 = تكرار: hati2 = hati-hati (خلي بالك)، lumba2 = lumba-lumba.
        - إنجليزي: otw = on the way (في السكة)، btw.
        - الضحك: wkwk / wkwkwk = «هههه».
      ar: |
        - الرقم 2 للتكرار: hati2 = hati-hati (انتبه)، lumba2 = lumba-lumba.
        - اختصارات إنجليزية: otw = في الطريق، btw.
        - الضحك: wkwk = «هههه».
      en: |
        - The digit 2 = repeat: hati2 = hati-hati (be careful), lumba2 = lumba-lumba.
        - English: otw = on the way, btw.
        - Laughing: wkwk / wkwkwk = "haha".
    grammar: id.chat.abbreviations
    examples:
      - text: udh smp blm? aku otw nih
        ar_eg: وصلت ولا لسه؟ أنا في السكة أهو.
        ar: هل وصلت؟ أنا في الطريق.
        en: Have you arrived yet? I'm on my way.
      - text: hati2 di jln ya
        ar_eg: خلي بالك في الطريق.
        ar: انتبه في الطريق.
        en: Be careful on the road, OK?
  - title: Hanya untuk teman
    body:
      ar_eg: |
        الكتابة دي للصحاب والجروبات بس. لأستاذك أو في إيميل رسمي اكتب الكلمات كاملة.
        والـ Reader بتاع Kabar بيفك الاختصارات دي لوحده، بس لما تقراها بنفسك هتفهم الشات أسرع بكتير.
      ar: |
        هذه الكتابة للأصدقاء والمجموعات فقط، أما مع المعلم أو في الرسائل الرسمية فاكتب الكلمات كاملة.
        وقارئ Kabar يفك هذه الاختصارات آليًا، لكن قراءتها بنفسك تجعلك أسرع في فهم المحادثات.
      en: |
        This spelling is for friends and group chats only. To your teacher or in a formal email, write words in full.
        Kabar's Reader decodes these automatically — but reading them yourself makes chats much faster.
    grammar: id.chat.abbreviations
    examples:
      - text: Selamat pagi, Pak. Saya sudah sampai di Lovina.
        ar_eg: صباح الخير يا أستاذ. أنا وصلت لوفينا.
        ar: صباح الخير يا أستاذ. وصلت إلى لوفينا.
        en: Good morning, sir. I've arrived in Lovina.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: yg
        ar_eg: yang (اللي)
        ar: yang (الذي)
        en: yang (who / which)
      - text: gk
        ar_eg: nggak (لأ / مش)
        ar: tidak (لا)
        en: nggak (not)
      - text: udh
        ar_eg: sudah (خلاص / بالفعل)
        ar: sudah (قد / بالفعل)
        en: sudah (already)
      - text: bgt
        ar_eg: banget (أوي)
        ar: banget (جدًا)
        en: banget (really, so)
      - text: otw
        ar_eg: في السكة
        ar: في الطريق
        en: on the way
      - text: makasih
        ar_eg: ميرسي
        ar: شكرًا
        en: thanks
    words: [yg, gk, udh, bgt, otw, makasih]
  - id: e02
    type: multiple_choice
    question: gk papa kok, santai aja
    question_meaning:
      ar_eg: إيه الكتابة الكاملة؟
      ar: ما الكتابة الكاملة؟
      en: Which is the full spelling?
    options: ['Sudah apa-apa kok, santai saja.', 'Nggak apa-apa kok, sama saja.', 'Nggak apa-apa kok, santai saja.']
    answer: 2
    explain:
      ar_eg: gk = nggak، papa = apa-apa (في الكلام)، aja = saja.
      ar: gk = nggak، وpapa = apa-apa، وaja = saja.
      en: gk = nggak, papa = apa-apa (spoken), aja = saja.
    words: [nggak, saja]
  - id: e03
    type: fill_blank
    sentence: pantai yg ini bagus ___!
    meaning:
      ar_eg: (شات) البحر ده حلو أوي!
      ar: (محادثة) الشاطئ جميل جدًا!
      en: (chat) This beach is really nice!
    options: [dr, yg, bgt]
    answers: [bgt]
    words: [bgt, yg]
  - id: e04
    type: build_sentence
    source:
      ar_eg: (شات) وصلت ولا لسه؟ أنا في السكة أهو.
      ar: (محادثة) هل وصلت؟ أنا في الطريق.
      en: (chat) Have you arrived yet? I'm on my way.
    answer: udh smp blm? aku otw nih wkwk
    distractors: [yg, bgt]
    words: [sudah, sampai, belum, otw, wkwk]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: هتبعت رسالة لبك إروان (المدرس). أنهي واحدة مناسبة؟
      ar: سترسل رسالة إلى الأستاذ إروان. أيّها مناسبة؟
      en: You're texting Pak Irwan, your teacher. Which message fits?
    options: ['Selamat pagi, Pak. Saya sudah sampai di Lovina.', 'pagi pak, sy udh smp lovina wkwk']
    answer: 0
    explain:
      ar_eg: الاختصارات وwkwk للصحاب بس. مع المدرس اكتب كامل وبأدب.
      ar: الاختصارات وwkwk للأصدقاء، ومع المعلم تُكتب الكلمات كاملة.
      en: Abbreviations and wkwk are for friends; write in full to a teacher.
    words: [wkwk]
  - id: e06
    type: speaking
    text: Makasih, ya! Tunggu aja, aku otw.
    meaning:
      ar_eg: ميرسي! استنى بس، أنا في السكة.
      ar: شكرًا! انتظر فقط، أنا في الطريق.
      en: Thanks! Just wait, I'm on my way.
    words: [makasih, aja, otw]
  - id: e07
    type: multiple_choice
    question: makasih bgt ya, aku otw wkwk
    question_meaning:
      ar_eg: إيه الكتابة الكاملة للرسالة دي؟
      ar: ما الصيغة الكاملة لهذه الرسالة؟
      en: Which is the full form of this message?
    options: ['Terima kasih banyak, ya, aku sedang di jalan, haha.', 'Terima kasih, ya, aku sudah sampai, haha.', 'Tidak apa-apa, aku di jalan, haha.']
    answer: 0
    explain:
      ar_eg: makasih = terima kasih، وotw = on the way (في السكة)، وwkwk = ضحك.
      ar: makasih = terima kasih، وotw = في الطريق، وwkwk = ضحك.
      en: makasih = terima kasih, otw = on the way, wkwk = laughter.
    words: [makasih, bgt, otw, wkwk]
  - id: e08
    type: multiple_choice
    question: gk papa, aku aja yg bawa makanan wkwk
    question_meaning:
      ar_eg: إيه الكتابة الكاملة للرسالة دي؟
      ar: ما الصيغة الكاملة لهذه الرسالة؟
      en: Which is the full form of this message?
    options: ['Nggak apa-apa, aku saja yang bawa makanan, haha.', 'Nggak apa-apa, aku sudah bawa makanan, haha.', 'Nggak apa-apa, aku tidak bawa makanan, haha.']
    answer: 0
    explain:
      ar_eg: gk = nggak، وaja = saja، وyg = yang. يعني «ولا يهمك، أنا اللي هجيب الأكل».
      ar: gk = nggak، وaja = saja، وyg = yang، أي «لا بأس، أنا من سيحضر الطعام».
      en: gk = nggak, aja = saja, yg = yang. So "It's fine, I'll be the one bringing food."
    words: [gk, aja, yg, wkwk]
dialogue:
  title: Chat dengan Raka
  lines:
    - speaker: Raka
      text: Mohamed, udh smp Lovina?
      ar_eg: يا محمد، وصلت لوفينا؟
      ar: يا محمد، هل وصلت إلى لوفينا؟
      en: Mohamed, have you reached Lovina?
    - speaker: Mohamed
      text: udh! hotelnya bagus bgt, dekat pantai
      ar_eg: أيوه! الفندق حلو أوي، جنب البحر.
      ar: نعم! الفندق جميل جدًا وقريب من الشاطئ.
      en: Yes! The hotel's really nice, near the beach.
    - speaker: Raka
      text: wkwk mantap. besok mau lihat lumba2?
      ar_eg: هههه جامد. بكرة هتروح تشوف الدلافين؟
      ar: هههه رائع. هل ستذهب غدًا لرؤية الدلافين؟
      en: Haha awesome. Going to see the dolphins tomorrow?
    - speaker: Mohamed
      text: iya, tp harus bangun jam 5 pagi
      ar_eg: أيوه، بس لازم أصحى الساعة ٥ الصبح.
      ar: نعم، لكن عليّ أن أستيقظ في الخامسة صباحًا.
      en: Yes, but I have to get up at 5 a.m.
    - speaker: Raka
      text: gk papa, lumba2nya cuma ada pagi2
      ar_eg: ولا يهمك، الدلافين بتظهر الصبح بدري بس.
      ar: لا بأس، فالدلافين لا تظهر إلا في الصباح الباكر.
      en: No problem, the dolphins only show up early in the morning.
    - speaker: Mohamed
      text: ok, makasih yaa
      ar_eg: ماشي، شكرًا.
      ar: حسنًا، شكرًا.
      en: OK, thanks!
new_words:
  - word: yg
    pos: particle
    ar_eg: اختصار yang (اللي)
    ar: اختصار yang (الذي)
    en: chat form of yang
  - word: gk
    pos: adverb
    ar_eg: اختصار nggak (لأ / مش)
    ar: اختصار nggak (لا)
    en: chat form of nggak (not)
  - word: udh
    pos: adverb
    ar_eg: اختصار sudah
    ar: اختصار sudah
    en: chat form of sudah (already)
  - word: bgt
    pos: adverb
    ar_eg: اختصار banget (أوي)
    ar: اختصار banget (جدًا)
    en: chat form of banget (really)
  - word: aja / saja
    pos: adverb
    ar_eg: saja في الكلام العامي (بس)
    ar: saja في العامية (فقط)
    en: casual saja (just)
  - word: otw
    pos: phrase
    ar_eg: في السكة (on the way)
    ar: في الطريق (on the way)
    en: on the way
  - word: wkwk
    pos: interjection
    ar_eg: هههه
    ar: ضحك (هههه)
    en: haha
  - word: makasih
    pos: interjection
    ar_eg: شكرًا (عامية من terima kasih)
    ar: شكرًا (عامية terima kasih)
    en: thanks (casual terima kasih)
review:
  status: draft
  verified: false
