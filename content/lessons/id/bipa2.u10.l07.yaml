  - id: e03
    type: listen
    text: Tolong! Ada orang pingsan! Telepon ambulans!
    question:
      ar_eg: إيه اللي حصل؟
      ar: ماذا حدث؟
      en: What happened?
    options: [حد أغمى عليه, حد اتخانق, حريقة]
    answer: 0
    meaning:
      ar_eg: الحقوني! فيه حد أغمى عليه! اتصلوا بالإسعاف!
      ar: النجدة! شخص مغمى عليه! اتصلوا بالإسعاف!
      en: Help! Someone's fainted! Call an ambulance!
    words: [pingsan, ambulans]
  - id: e04
    type: fill_blank
    sentence: Badannya panas? Coba pakai ___.
    meaning:
      ar_eg: جسمه سخن؟ جرّب الـ ___.
      ar: هل حرارته مرتفعة؟ جرّب ___.
      en: Is he hot? Try the ___.
    options: [termometer, perban, infus]
    answers: [termometer]
    words: [termometer, perban, infus]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عربية المستشفى اللي ليها سرينة اسمها إيه؟
      ar: ما اسم سيارة المستشفى ذات الصفّارة؟
      en: What's the hospital vehicle with a siren?
    options: [ambulans, operasi, kondisi]
    answer: 0
    explain:
      ar_eg: ambulans = إسعاف.
      ar: ambulans = إسعاف.
      en: ambulans = ambulance.
    words: [ambulans, operasi, kondisi]
  - id: e06
    type: fill_blank
    sentence: Sesudah ___, pasien harus istirahat seminggu.
    meaning:
      ar_eg: بعد الـ ___، المريض لازم يرتاح أسبوع.
      ar: بعد ___ يجب أن يرتاح المريض أسبوعًا.
      en: After the ___, the patient must rest for a week.
    options: [operasi, muntah, perban]
    answers: [operasi]
    words: [operasi, muntah, perban]
  - id: e07
    type: build_sentence
    source:
      ar_eg: حالته كويسة النهارده.
      ar: حاله جيّدة اليوم.
      en: His condition is good today.
    answer: Kondisinya baik hari ini.
    distractors: [pingsan, sakit]
    words: [kondisi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Anak itu muntah lalu pingsan.
    answers_meaning:
      ar_eg: [الولد ده رجّع وبعدين أغمى عليه, العيل رجّع وبعدها أغمى عليه]
      ar: [تقيّأ ذلك الطفل ثم أُغمي عليه]
      en: [That child was sick and then fainted, 'The child vomited, then fainted']
    words: [muntah, pingsan]
  - id: e09
    type: speaking
    text: Pasien itu pakai infus dan perban.
    meaning:
      ar_eg: المريض ده متعلق له محلول وعليه شاش.
      ar: ذلك المريض على محلول وعليه ضمادة.
      en: That patient has a drip and a bandage.
    words: [infus, perban]
  - id: e10
    type: multiple_choice
    question: Ada luka di tangan. Pakai ___.
    options: [perban, termometer, ambulans]
    answer: 0
    explain:
      ar_eg: 'الجرح محتاج شاش: perban.'
      ar: 'الجرح يحتاج ضمادة: perban.'
      en: 'A cut needs a bandage: perban.'
    words: [perban, termometer, ambulans]
dialogue:
  lines:
    - speaker: Mohamed
      text: Bu, bagaimana kondisi teman saya?
      ar_eg: يا مدام، حالة صاحبي عاملة إيه؟
      ar: يا سيدتي، كيف حال صديقي؟
      en: Excuse me, how is my friend doing?
    - speaker: Perawat
      text: Sudah lebih baik. Kemarin dia muntah dan pingsan.
      ar_eg: أحسن دلوقتي. امبارح كان بيرجّع وأغمى عليه.
      ar: صار أفضل. أمس تقيّأ وأُغمي عليه.
      en: Better now. Yesterday he vomited and fainted.
    - speaker: Mohamed
      text: Perlu operasi?
      ar_eg: محتاج عملية؟
      ar: هل يحتاج إلى عملية؟
      en: Does he need an operation?
    - speaker: Perawat
      text: Tidak perlu. Sekarang dia pakai infus saja.
      ar_eg: لأ. دلوقتي عليه محلول بس.
      ar: لا. الآن عليه محلول وريدي فقط.
      en: No. He's just on a drip now.
    - speaker: Mohamed
      text: Baik. Boleh saya masuk?
      ar_eg: تمام. ممكن أدخل؟
      ar: حسنًا. هل يمكنني الدخول؟
      en: OK. May I go in?
    - speaker: Perawat
      text: Boleh, tapi jangan lama, ya.
      ar_eg: ممكن، بس ما تطوّلش.
      ar: نعم، لكن لا تُطل.
      en: Yes, but don't stay long.
