schema: kabar.lesson/v1
id: bipa2.u10.l07
language: id
title: Ambulans dan operasi
can_do:
  ar_eg: 'تتصرف في طوارئ: حد أغمى عليه أو بيرجّع، تطلب الإسعاف، وتسأل عن حالة مريض بعد عملية.'
  ar: 'أن تتصرّف في الطوارئ: شخص أُغمي عليه أو يتقيّأ، تطلب الإسعاف، وتسأل عن حال مريض بعد عملية.'
  en: 'Handle an emergency: someone faints or is sick, call an ambulance, and ask how a patient is after an operation.'
slides:
  - title: Di rumah sakit
    body:
      ar_eg: |
        muntah = يرجّع (يتقيأ)، pingsan = يغمى عليه. ambulans = عربية إسعاف.
        operasi = عملية جراحية. infus = محلول في الوريد، perban = شاش ورباط. termometer = ترمومتر.
        kondisi = الحالة: Bagaimana kondisinya?
      ar: |
        muntah = يتقيّأ، pingsan = يُغمى عليه. ambulans = سيارة إسعاف.
        operasi = عملية جراحية. infus = محلول وريدي، perban = ضمادة. termometer = ميزان حرارة.
        kondisi = الحالة: Bagaimana kondisinya?
      en: |
        muntah = vomit, pingsan = faint. ambulans = ambulance.
        operasi = operation, surgery. infus = drip, perban = bandage. termometer = thermometer.
        kondisi = condition: Bagaimana kondisinya?
    examples:
      - text: Ada orang pingsan! Telepon ambulans!
        ar_eg: فيه حد أغمى عليه! اتصل بالإسعاف!
        ar: هناك شخص مغمى عليه! اتصل بالإسعاف!
        en: Someone's fainted! Call an ambulance!
      - text: Sesudah operasi, kondisinya baik.
        ar_eg: بعد العملية، حالته كويسة.
        ar: بعد العملية حاله جيّدة.
        en: After the operation, his condition is good.
      - text: Pasien itu pakai infus.
        ar_eg: المريض ده متعلق له محلول.
        ar: ذلك المريض على محلول وريدي.
        en: That patient is on a drip.
