schema: kabar.lesson/v1
id: bipa2.u07.l05
language: id
title: Berdiri! Lompat!
can_do:
  ar_eg: تدّي تعليمات رياضة وتمشي عليها.
  ar: أن تعطي تعليمات التمارين وتتبعها.
  en: Give and follow exercise instructions.
slides:
  - title: Berdiri! Lompat!
    body:
      ar_eg: |
        - أفعال ber- بتفضل زي ما هي: Berdiri! = قوم اقف! Berhenti! = اقف (بطّل)! Berlari di tempat! = اجري في مكانك!
        - الكلمات اللي من غير بادئة كمان: Duduk! = اقعد! Lompat! = نُط!
        وفي التمارين بيعدّوا: Lompat tiga kali! = نُط تلات مرات!
        في الشارع بيقولوا:
        - kayak gini = seperti ini (كده، زي كده)
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
      ar: |
        - أفعال ber- تبقى كما هي: Berdiri! = قِف! Berhenti! = توقّف! Berlari di tempat! = اركض في مكانك!
        - والأفعال المجردة أيضًا: Duduk! = اجلس! Lompat! = اقفز!
        ويكثر العدّ في التمارين: Lompat tiga kali! = اقفز ثلاث مرات!
        في كلام الشارع:
        - kayak gini = seperti ini (هكذا، مثل هذا)
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
      en: |
        - ber- verbs keep ber-: Berdiri! = Stand up! Berhenti! = Stop! Berlari di tempat! = Run on the spot!
        - Bare roots stay too: Duduk! = Sit! Lompat! = Jump!
        Workouts count a lot: Lompat tiga kali! = Jump three times!
        On the street:
        - kayak gini = seperti ini (like this)
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
    grammar: id.imperative.basic
    examples:
      - text: Berdiri, lalu lompat tiga kali.
        ar_eg: قوم اقف، وبعدين نُط تلات مرات.
        ar: قِف ثم اقفز ثلاث مرات.
        en: Stand up, then jump three times.
  - title: Turunkan tangan, ayo!
    body:
      ar_eg: |
        - زي masukkan في الوصفات، turunkan = نزّل (الحاجة): Turunkan tangan = نزّل إيدك.
        - عشان تشجّع: Ayo! = يلا!، Coba lagi! = جرّب تاني!
        - ولطيفة شوية: Duduklah = اتفضل اقعد.
      ar: |
        - كما في masukkan، فإن turunkan = أنزِل (الشيء): Turunkan tangan = أنزِل يدك.
        - وللتشجيع: Ayo! = هيّا!، Coba lagi! = حاول مرة أخرى!
        - وللتلطيف: Duduklah = تفضّل بالجلوس.
      en: |
        - Like masukkan in recipes, turunkan = lower (something): Turunkan tangan = Lower your hands.
        - To encourage: Ayo! = Come on!, Coba lagi! = Try again!
        - Gentler: Duduklah = Do sit down.
    grammar: id.imperative.basic
    examples:
      - text: Turunkan tangan dan buang napas.
        ar_eg: نزّل إيدك وطلّع النفس.
        ar: أنزِل يديك وأخرِج النفس.
        en: Lower your arms and breathe out.
      - text: Ayo, coba lagi!
        ar_eg: يلا، جرّب تاني!
        ar: هيّا، حاول مرة أخرى!
        en: Come on, try again!
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: المدرّب عايز الناس يقوموا يقفوا. يقول إيه؟
      ar: يريد المدرّب أن يقف الجميع. ماذا يقول؟
      en: The coach wants everyone to stand up. What does he say?
    options: [Lihat!, Berdiri!, Mendiri!]
    answer: 1
    explain:
      ar_eg: أفعال ber- بتفضل زي ما هي في الأمر.
      ar: أفعال ber- تحتفظ بسابقتها في الأمر.
      en: ber- verbs keep ber- in commands.
    words: [berdiri]
  - id: e02
    type: fill_blank
    sentence: ___ tangan kiri, lalu turunkan.
    meaning:
      ar_eg: ارفع إيدك الشمال، وبعدين نزّلها.
      ar: ارفع يدك اليسرى ثم أنزِلها.
      en: Raise your left hand, then lower it.
    options: [Berangkat, Mengangkat, Angkat]
    answers: [Angkat]
    words: [angkat, turunkan]
  - id: e03
    type: fill_blank
    sentence: Jangan takut. Sekarang ___ dan berlari di tempat.
    meaning:
      ar_eg: ماتخافش. دلوقتي قوم اقف واجري في مكانك.
      ar: لا تخف. الآن قف واركض في مكانك.
      en: Don't be afraid. Now stand up and run on the spot.
    options: [mendiri, berdiri, duduk]
    answers: [berdiri]
    words: [berdiri, takut, tempat]
  - id: e04
    type: build_sentence
    source:
      ar_eg: قوم اقف، وبعدين نُط في مكانك تلات مرات.
      ar: قف، ثم اقفز في مكانك ثلاث مرات.
      en: Stand up, then jump on the spot three times.
    answer: Berdiri, lalu lompat di tempat tiga kali.
    distractors: [duduk, melompat]
    words: [berdiri, lompat, tempat]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: نزّل إيدك وطلّع النفس.
      ar: أنزِل يديك وأخرِج النفس.
      en: Lower your arms and breathe out.
    answers: [Turunkan tangan dan buang napas., Turunkan tangan dan buang napas, Turunkan tanganmu dan buang napas., 'Turunkan tangan, lalu buang napas.', Turunkan tangan lalu buang napas., 'Turunkan tanganmu, lalu buang napas.', 'Turunkan tangan, buang napas.']
    words: [turunkan, buang napas]
  - id: e06
    type: translate
    direction: from_target
    source_text: Putar bahu ke depan sepuluh kali.
    answers_meaning:
      ar_eg: [لِف كتافك لقدّام عشر مرات., لِف كتفك لقدام عشر مرات]
      ar: [أدِر كتفيك إلى الأمام عشر مرات., أدِر كتفك للأمام عشر مرات]
      en: [Roll your shoulders forward ten times., Rotate your shoulders forwards ten times]
    words: [putar, bahu]
  - id: e07
    type: speaking
    text: Lihat ke depan, lalu lompat di tempat. Jangan takut!
    meaning:
      ar_eg: بُص قدامك، وبعدين نُط في مكانك. ماتخافش!
      ar: انظر إلى الأمام، ثم اقفز في مكانك. لا تخف!
      en: Look ahead, then jump on the spot. Don't be afraid!
    words: [lihat, lompat, tempat, takut]
  - id: e08
    type: listen
    text: Putar kepala, lalu lompat.
    options: ['Putar kepala, lalu lompat.', 'Lihat kepala, lalu lompat.', 'Putar kepala, lalu berdiri.']
    answer: 0
    meaning:
      ar_eg: لِف راسك، وبعدين نُط.
      ar: أدِر رأسك، ثم اقفز.
      en: Turn your head, then jump.
    words: [putar, lompat, lihat, berdiri]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «نُط»؟
      ar: أيّ كلمة تعني «اقفز»؟
      en: Which word means "jump"?
    options: [putar, turunkan, lompat]
    answer: 2
    words: [lompat, putar, turunkan]
  - id: e10
    type: fill_blank
    sentence: Jangan ___! Kamu bisa!
    meaning:
      ar_eg: ماتخافش! أكيد هتقدر.
      ar: لا تخف! ستستطيع بالتأكيد.
      en: Don't be afraid! You can do it.
    options: [takut, lompat, lihat]
    answers: [takut]
    words: [takut]
dialogue:
  title: Senam pagi di Kuta
  lines:
    - speaker: Mas Rizal
      text: Selamat pagi, semua! Ayo, berdiri. Angkat tangan kanan, lalu tarik napas.
      ar_eg: صباح الخير يا جماعة! يلا، قوموا اقفوا. ارفعوا إيدكم اليمين، وبعدين خدوا نفس.
      ar: صباح الخير جميعًا! هيّا قِفوا. ارفعوا أيديكم اليمنى ثم خذوا نفسًا.
      en: Good morning, everyone! Come on, stand up. Raise your right hand, then breathe in.
    - speaker: Mohamed
      text: Kayak gini, Mas?
      ar_eg: كده يا ماس؟
      ar: هكذا يا ماس؟
      en: Like this, Mas?
    - speaker: Mas Rizal
      text: Ya, bagus! Sekarang turunkan tangan dan buang napas.
      ar_eg: أيوه، برافو! دلوقتي نزّل إيدك وطلّع النفس.
      ar: نعم، أحسنت! الآن أنزِل يدك وأخرِج النفس.
      en: Yes, good! Now lower your arm and breathe out.
    - speaker: Rina
      text: Mas, lututku sakit.
      ar_eg: يا ماس، ركبتي بتوجعني.
      ar: يا ماس، ركبتي تؤلمني.
      en: Mas, my knee hurts.
    - speaker: Mas Rizal
      text: Oh, berhenti dulu, Rina. Duduklah dan minum air.
      ar_eg: أوه، بطّلي شوية يا رينا. اتفضلي اقعدي واشربي مية.
      ar: أوه، توقّفي قليلًا يا رينا. تفضّلي اجلسي واشربي ماءً.
      en: Oh, stop for now, Rina. Do sit down and drink some water.
    - speaker: Mohamed
      text: Ayo, Rina! Besok coba lagi!
      ar_eg: يلا يا رينا! بكرة جرّبي تاني!
      ar: هيّا يا رينا! حاولي مرة أخرى غدًا!
      en: Come on, Rina! Try again tomorrow!
new_words:
  - word: turunkan
    pos: verb
    ar_eg: نزّل
    ar: أنزِل
    en: lower (it)
  - word: putar
    pos: verb
    ar_eg: لِف (memutar = يلف)
    ar: أدِر (memutar = يُدير)
    en: turn, rotate
  - word: lompat
    pos: verb
    ar_eg: نُط
    ar: اقفز
    en: jump
  - word: berdiri
    pos: verb
    ar_eg: يقف (على رجليه)
    ar: يقف
    en: to stand
  - word: tempat
    pos: noun
    ar_eg: مكان (di tempat = في مكانك)
    ar: مكان (di tempat = في المكان نفسه)
    en: place (di tempat = on the spot)
  - word: lihat
    pos: verb
    ar_eg: بُص / شوف (أمر)
    ar: انظر (أمر)
    en: look! see (command form of melihat)
  - word: takut
    pos: adjective
    ar_eg: خايف (jangan takut = ماتخافش)
    ar: خائف (jangan takut = لا تخف)
    en: afraid (jangan takut = don't be afraid)
