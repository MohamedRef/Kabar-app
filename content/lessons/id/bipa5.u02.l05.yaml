schema: kabar.lesson/v1
id: bipa5.u02.l05
language: id
title: Dampak dan manfaat
can_do:
  ar_eg: 'توزن مكسب وخسارة مشروع كبير: مين بيستفيد ومين بيدفع التمن.'
  ar: 'أن توازن بين مكاسب مشروع كبير وخسائره: من يستفيد ومن يدفع الثمن.'
  en: Weigh the gains and costs of a big project, who benefits and who pays.
slides:
  - title: Siapa untung, siapa rugi?
    body:
      ar_eg: |
        النقاش حوالين العاصمة الجديدة فيه طرفين:
        - pemerataan (pembangunan) = توزيع التنمية بالعدل، مش كله في جاوة
        - pendatang = الناس الجاية من برا (من جاوة مثلًا) / warga setempat = أهل المنطقة
        - menggusur = يطرد الناس من بيوتهم أو أرضهم عشان مشروع، وdigusur = يتطرد
        - ganti rugi = تعويض عن أرض أو خسارة
        manfaat = فايدة، وdampak = أثر (ممكن يبقى كويس أو وحش).
      ar: |
        للجدل حول العاصمة الجديدة طرفان:
        - pemerataan (pembangunan) = توزيع التنمية بعدل، لا حصرها في جاوة
        - pendatang = القادمون من الخارج (من جاوة مثلًا) / warga setempat = أهل المنطقة
        - menggusur = يُخلي الناس من بيوتهم أو أراضيهم لصالح مشروع، وdigusur = يُخلى
        - ganti rugi = تعويض عن أرض أو خسارة
        وmanfaat = فائدة، وdampak = أثر قد يكون حسنًا أو سيئًا.
      en: |
        The new-capital debate has two sides:
        - pemerataan (pembangunan) = spreading development fairly, not all on Java
        - pendatang = newcomers (from Java, say) / warga setempat = local residents
        - menggusur = to clear people off their homes or land for a project; digusur = to be evicted
        - ganti rugi = compensation for land or loss
        manfaat = benefit; dampak = impact, good or bad.
    examples:
      - text: Ada manfaatnya, tetapi warga setempat khawatir akan digusur.
        ar_eg: ليه فايدة، بس أهل المنطقة خايفين يتطردوا من أرضهم.
        ar: له فوائد، لكنّ أهل المنطقة يخشون أن يُخلَوا من أراضيهم.
        en: It has benefits, but local people worry they'll be evicted.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pemerataan
        ar_eg: توزيع بالعدل
        ar: توزيع عادل
        en: fair distribution
      - text: pendatang
        ar_eg: ناس جاية من برا
        ar: وافد
        en: newcomer
      - text: warga setempat
        ar_eg: أهل المنطقة
        ar: السكّان المحليون
        en: local residents
      - text: ganti rugi
        ar_eg: تعويض
        ar: تعويض
        en: compensation
      - text: menggusur
        ar_eg: يطرد الناس من أرضهم
        ar: يُخلي قسرًا
        en: to evict, to clear
    words: [pemerataan, pendatang, warga setempat, ganti rugi, menggusur]
  - id: e02
    type: listen
    text: Pemindahan ibu kota diharapkan membawa pemerataan pembangunan ke luar Jawa.
    question:
      ar_eg: نقل العاصمة المفروض يجيب إيه؟
      ar: ماذا يُرجى أن يحقّق نقل العاصمة؟
      en: What is moving the capital supposed to bring?
    options:
      - ضرايب أقل.
      - تنمية موزعة برا جاوة.
      - نقل كل سكان جاوة.
    answer: 1
    words: [pemerataan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «Warga setempat khawatir mereka akan digusur.» معناها إيه؟
      ar: ما معنى «Warga setempat khawatir mereka akan digusur.»؟
      en: What does "Warga setempat khawatir mereka akan digusur." mean?
    options:
      - الناس الجاية من برا عايزة تمشي.
      - أهل المنطقة فرحانين بالبيوت الجديدة.
      - أهل المنطقة خايفين يتطردوا من أرضهم.
    answer: 2
    explain:
      ar_eg: digusur هي المبني للمجهول من menggusur، يعني يتطرد من مكانه عشان مشروع.
      ar: digusur مبني للمجهول من menggusur، أي أن يُخلى من مكانه لصالح مشروع.
      en: digusur is the passive of menggusur, to be cleared off your land for a project.
    words: [warga setempat, menggusur]
  - id: e04
    type: fill_blank
    sentence: Pemerintah harus memberi ___ yang adil kepada pemilik tanah.
    meaning:
      ar_eg: الحكومة لازم تدي تعويض عادل لأصحاب الأرض.
      ar: على الحكومة أن تمنح ملّاك الأراضي تعويضًا عادلًا.
      en: The government must give landowners fair compensation.
    options: [ganti rugi, pendatang, pemerataan]
    answers: [ganti rugi]
    words: [ganti rugi]
  - id: e05
    type: build_sentence
    source:
      ar_eg: ناس كتير جاية من جاوة بتدور على شغل هنا.
      ar: كثير من الوافدين من جاوة يبحثون عن عمل هنا.
      en: Many newcomers from Java are looking for work here.
    answer: Banyak pendatang dari Jawa mencari pekerjaan di sini.
    distractors: [setempat, menggusur]
    words: [pendatang]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مينفعش نطرد أهل المنطقة من أرضهم.
      ar: لا يجوز أن نُخلي السكّان المحليين من أراضيهم.
      en: We must not evict the local residents from their land.
    answers:
      - Kita tidak boleh menggusur warga setempat dari tanah mereka.
      - Kita tidak boleh menggusur warga setempat dari tanahnya.
      - Kami tidak boleh menggusur warga setempat dari tanah mereka.
      - Warga setempat tidak boleh digusur dari tanah mereka.
    words: [menggusur, warga setempat]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة فايدة (manfaat) للمشروع؟
      ar: أيّها فائدة (manfaat) للمشروع؟
      en: Which one is a benefit (manfaat) of the project?
    options:
      - Lapangan kerja baru untuk warga setempat.
      - Hutan ditebang untuk jalan.
      - Harga tanah terlalu mahal untuk warga setempat.
    answer: 0
    words: [warga setempat]
  - id: e08
    type: speaking
    text: Pemerataan pembangunan itu penting untuk hidup warga, tetapi ganti rugi juga harus adil.
    meaning:
      ar_eg: توزيع التنمية مهم لحياة الناس، بس التعويض كمان لازم يبقى عادل.
      ar: توزيع التنمية مهمّ لحياة السكان، لكنّ التعويض أيضًا يجب أن يكون عادلًا.
      en: Spreading development matters for people's lives, but compensation must be fair too.
    words: [pemerataan, ganti rugi, hidup]
  - id: e09
    type: dictation
    text: Pendatang dan warga setempat harus hidup rukun.
    meaning:
      ar_eg: الناس الجاية وأهل المنطقة لازم يعيشوا مع بعض في سلام.
      ar: على الوافدين والسكّان المحليين أن يعيشوا في وئام.
      en: Newcomers and locals must live in harmony.
    words: [pendatang, warga setempat, hidup]
  - id: e10
    type: fill_blank
    sentence: Pemerintah berjanji tidak akan ___ kampung nelayan itu. Warga sudah lama hidup di sana.
    meaning:
      ar_eg: الحكومة وعدت إنها مش هتطرد أهل قرية الصيادين دي. الناس عايشين هناك من زمان.
      ar: وعدت الحكومة بألّا تُخلي قرية الصيّادين تلك، فالسكان يعيشون هناك منذ زمن.
      en: The government promised not to clear that fishing village. People have lived there a long time.
    options: [menggusur, pemerataan, pendatang]
    answers: [menggusur]
    words: [menggusur, hidup]
dialogue:
  title: Di warung Bu Wati
  lines:
    - speaker: Mohamed
      text: Bu, bagaimana pendapat Ibu tentang ibu kota baru?
      ar_eg: يا حاجة، إيه رأيك في العاصمة الجديدة؟
      ar: يا سيدتي، ما رأيك في العاصمة الجديدة؟
      en: Ma'am, what do you think about the new capital?
    - speaker: Bu Wati
      text: Warung saya lebih ramai karena banyak pendatang. Itu manfaatnya.
      ar_eg: المحل بتاعي زحمته زادت عشان ناس كتير جت من برا. دي الفايدة.
      ar: صار دكّاني أكثر رواجًا لكثرة الوافدين، وهذه فائدته.
      en: My stall is busier because of all the newcomers. That's the upside.
    - speaker: Mohamed
      text: Lalu apa dampak negatifnya untuk warga setempat?
      ar_eg: طب إيه الأثر الوحش على أهل المنطقة؟
      ar: وما أثره السلبي على أهل المنطقة؟
      en: And what's the downside for local people?
    - speaker: Bu Wati
      text: Tetangga saya digusur. Ganti ruginya belum dibayar sampai sekarang.
      ar_eg: جيراني اتطردوا من أرضهم، والتعويض لسه ماتدفعش لحد دلوقتي.
      ar: أُخلي جيراني من أرضهم، ولم يُدفع تعويضهم حتى الآن.
      en: My neighbours were evicted. Their compensation still hasn't been paid.
