schema: kabar.lesson/v1
id: bipa3.u04.l04
language: id
title: Menaikkan, menyenangkan
can_do:
  ar_eg: تستعمل أفعال -kan من أفعال الحركة (naik → menaikkan) ومن المشاعر (bosan → membosankan).
  ar: أن تستعمل أفعال -kan المشتقة من أفعال الحركة (naik → menaikkan) ومن المشاعر (bosan → membosankan).
  en: Use -kan verbs from movement and feelings.
slides:
  - title: naik → menaikkan
    grammar: id.confix.men-kan.causative
    body:
      ar_eg: |
        فعل لازم + -kan = تخلّي حاجة تعمله:
        naik (يطلع) → menaikkan (يرفع / يعلّي)، turun (ينزل) → menurunkan (ينزّل)، mati (يموت / يطفي) → mematikan (يطفي حاجة).
        زي «نزل → نزّل» في العربي.
        وخلي بالك من الإملا: الجذر لو آخره k + -kan = kk: menaikkan.
      ar: |
        الفعل اللازم + -kan = جعل الشيء يفعل ذلك:
        naik (يصعد) → menaikkan (يرفع)، turun (ينزل) → menurunkan (يُنزِل / يخفّض)، mati (يموت / ينطفئ) → mematikan (يُطفئ).
        كقولنا في العربية: نزل → أنزل.
        وانتبه للإملاء: إذا انتهى الجذر بـk ثم -kan صارت kk: menaikkan.
      en: |
        Intransitive verb + -kan = make something do it:
        naik (go up) → menaikkan (raise), turun (go down) → menurunkan (lower), mati (die / go off) → mematikan (switch off).
        Like Arabic نزل → أنزل.
        Spelling: a root ending in k plus -kan gives kk: menaikkan.
    examples:
      - text: Terlalu banyak garam bisa menaikkan tekanan darah.
        ar_eg: الملح الكتير ممكن يعلّي الضغط.
        ar: الإكثار من الملح قد يرفع ضغط الدم.
        en: Too much salt can raise your blood pressure.
      - text: Jalan kaki bisa menurunkan tekanan darah.
        ar_eg: المشي ممكن ينزّل الضغط.
        ar: المشي قد يخفّض ضغط الدم.
        en: Walking can lower blood pressure.
  - title: menyenangkan, membosankan
    grammar: id.confix.men-kan.causative
    body:
      ar_eg: |
        شعور + -kan = حاجة بتعمل الشعور ده فيك:
        senang (مبسوط) → menyenangkan (ممتع، بيبسط)، bosan (زهقان) → membosankan (مملّ، بيزهّق).
      ar: |
        الشعور + -kan = شيء يبعث فيك ذلك الشعور:
        senang (مسرور) → menyenangkan (ممتع)، bosan (ضَجِر) → membosankan (مملّ).
      en: |
        Feeling + -kan = something that causes that feeling:
        senang (happy) → menyenangkan (fun, pleasant), bosan (bored) → membosankan (boring).
    examples:
      - text: Makanan yang sama setiap hari membosankan.
        ar_eg: نفس الأكل كل يوم بيزهّق.
        ar: الطعام نفسه كل يوم مملّ.
        en: The same food every day is boring.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: menaikkan
        ar_eg: يعلّي، يرفع
        ar: يرفع
        en: to raise
      - text: menurunkan
        ar_eg: ينزّل، يقلّل
        ar: يخفّض
        en: to lower
      - text: tekanan darah
        ar_eg: الضغط (ضغط الدم)
        ar: ضغط الدم
        en: blood pressure
      - text: kebiasaan
        ar_eg: عادة
        ar: عادة
        en: habit
      - text: membosankan
        ar_eg: مملّ، بيزهّق
        ar: مملّ
        en: boring
      - text: mematikan
        ar_eg: يطفي
        ar: يُطفئ
        en: to switch off
    words: [menaikkan, menurunkan, tekanan darah, kebiasaan, membosankan, mematikan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «يرفع» (السعر أو الضغط) بتتكتب إزاي؟
      ar: كيف تُكتب «يرفع» (السعر أو الضغط)؟
      en: How do you spell "to raise" (prices, blood pressure)?
    options: [menaikkan, menaikan, menaiki]
    answer: 0
    explain:
      ar_eg: "naik + -kan = kk. و menaiki فعل تاني خالص: يركب / يطلع على."
      ar: naik + -kan = kk، أما menaiki ففعل آخر بمعنى يركب / يصعد.
      en: naik + -kan gives kk. menaiki is a different verb, "to ride / climb onto".
    words: [menaikkan]
  - id: e03
    type: listen
    text: Terlalu banyak garam bisa menaikkan tekanan darah.
    options: ["Terlalu banyak garam bisa menurunkan tekanan darah.", "Terlalu banyak gula bisa menaikkan tekanan darah.", "Terlalu banyak garam bisa menaikkan tekanan darah."]
    answer: 2
    meaning:
      ar_eg: الملح الكتير ممكن يعلّي الضغط.
      ar: الإكثار من الملح قد يرفع ضغط الدم.
      en: Too much salt can raise your blood pressure.
    words: [menaikkan, tekanan darah]
  - id: e04
    type: multiple_choice
    question: Saya tidak suka makanan yang sama setiap hari. ___!
    options: [Menyenangkan, Membosankan, Menurunkan]
    answer: 1
    words: [membosankan]
  - id: e05
    type: fill_blank
    sentence: Olahraga bisa ___ tekanan darah.
    meaning:
      ar_eg: الرياضة ممكن تنزّل الضغط.
      ar: الرياضة قد تخفّض ضغط الدم.
      en: Exercise can lower blood pressure.
    options: [membosankan, menurunkan, mematikan]
    answers: [menurunkan]
    words: [menurunkan, tekanan darah]
  - id: e06
