      ar_eg: ماتنساش تطفي التلفزيون قبل ما تنام.
      ar: لا تنسَ أن تطفئ التلفاز قبل النوم.
      en: Don't forget to switch off the TV before you sleep.
    options: [menaikkan, mematikan, membersihkan]
