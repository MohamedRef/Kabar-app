      ar_eg: العادات الصحية بتنزّل الضغط.
      ar: العادات الصحية تخفّض ضغط الدم.
      en: Healthy habits lower blood pressure.
    answer: Kebiasaan sehat menurunkan tekanan darah.
    distractors: [turun, menaikan]
    words: [kebiasaan, menurunkan, tekanan darah]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أكل نفس الأكل كل يوم بيزهّق.
      ar: تناول الطعام نفسه كل يوم مملّ.
      en: Eating the same food every day is boring.
    answers:
      - Makan makanan yang sama setiap hari membosankan.
      - Makan makanan yang sama setiap hari membosankan
      - Makan makanan yang sama tiap hari membosankan.
      - Makan makanan yang sama setiap hari itu membosankan.
      - Makan makanan yang sama setiap hari sangat membosankan.
      - Makan yang sama setiap hari membosankan.
    words: [membosankan]
  - id: e09
    type: speaking
    text: Saya mematikan HP jam sembilan malam. Itu kebiasaan baru saya.
    meaning:
      ar_eg: بطفي الموبايل الساعة تسعة بالليل. دي عادتي الجديدة.
      ar: أطفئ الهاتف في التاسعة مساءً؛ تلك عادتي الجديدة.
      en: I switch off my phone at nine p.m. That's my new habit.
    words: [mematikan, kebiasaan]
dialogue:
  title: Jalan kaki ke kebun stroberi
  lines:
    - speaker: Mas Rizal
      text: Mohamed, ayo kita memetik stroberi di kebun Bu Rohani!
      ar_eg: يا محمد، يلا نقطف فراولة من جنينة مدام روحاني!
      ar: يا محمد، هيا نقطف الفراولة من بستان السيدة روحاني!
      en: Mohamed, let's go and pick strawberries in Bu Rohani's garden!
    - speaker: Mohamed
      text: Ayo! Tunggu, saya mematikan HP dulu.
      ar_eg: يلا! استنى، هطفي الموبايل الأول.
      ar: هيا! انتظر، سأطفئ الهاتف أولًا.
      en: Let's go! Wait, I'll switch off my phone first.
    - speaker: Mas Rizal
      text: Itu kebiasaan baik! Di kota kamu jarang jalan kaki, kan?
      ar_eg: دي عادة حلوة! في المدينة نادرًا لما بتمشي، صح؟
      ar: هذه عادة جيدة! نادرًا ما تمشي في المدينة، أليس كذلك؟
      en: That's a good habit! In the city you rarely walk, right?
    - speaker: Mohamed
      text: Betul. Kata dokter, tekanan darah saya agak tinggi.
      ar_eg: صح. الدكتور بيقول إن ضغطي عالي شوية.
      ar: صحيح. يقول الطبيب إنّ ضغط دمي مرتفع قليلًا.
      en: True. The doctor says my blood pressure is a bit high.
    - speaker: Mas Rizal
      text: Jalan kaki bisa menurunkan tekanan darah. Dan memetik stroberi sangat menyenangkan!
      ar_eg: المشي ممكن ينزّل الضغط. وقطف الفراولة ممتع جدًا!
      ar: المشي قد يخفّض ضغط الدم، وقطف الفراولة ممتع جدًا!
      en: Walking can lower blood pressure. And picking strawberries is great fun!
