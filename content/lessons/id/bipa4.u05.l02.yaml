schema: kabar.lesson/v1
id: bipa4.u05.l02
language: id
title: Lomba tujuh belasan
can_do:
  ar_eg: توصف مسابقات عيد الاستقلال في الحي.
  ar: أن تصف مسابقات عيد الاستقلال في الحيّ.
  en: Describe Independence Day games.
slides:
  - title: Lomba tujuh belasan
    body:
      ar_eg: |
        يوم ١٧ أغسطس كل حتة بتعمل مسابقات (lomba):
        panjat pinang = طلوع عمود مدهون عشان توصل للهدايا اللي فوق
        balap karung = سباق الشوال (تجري جوه شوال)
        lomba makan kerupuk = مسابقة أكل الكروبوك المتعلق في خيط
        وأفعال -i هنا: mengikuti lomba = يشارك في المسابقة، menyemangati peserta = يشجّع المتسابقين.
      ar: |
        في السابع عشر من أغسطس يقيم كل حيّ مسابقات (lomba):
        panjat pinang = تسلّق عمود مدهون لبلوغ الجوائز في أعلاه
        balap karung = سباق الأكياس
        lomba makan kerupuk = مسابقة أكل الكروبوك المعلّق بخيط
        ومن أفعال -i هنا: mengikuti lomba = يشارك في المسابقة، menyemangati peserta = يشجّع المتسابقين.
      en: |
        On 17 August every neighbourhood holds games (lomba):
        panjat pinang = climbing a greased pole to reach the prizes at the top
        balap karung = sack race
        lomba makan kerupuk = eating crackers hanging on a string
        -i verbs here: mengikuti lomba = take part in a game, menyemangati peserta = cheer on the participants.
    grammar: id.confix.men-i
    examples:
      - text: Anak-anak mengikuti lomba balap karung.
        ar_eg: العيال بيشاركوا في سباق الشوال.
        ar: يشارك الأطفال في سباق الأكياس.
        en: The children take part in the sack race.
      - text: Warga menyemangati peserta panjat pinang.
        ar_eg: السكان بيشجعوا اللي بيطلعوا العمود.
        ar: يشجّع السكان المتسابقين في تسلق العمود.
        en: Residents cheer on the pole climbers.
  - title: Hadiah dan suasana meriah
    body:
      ar_eg: |
        hadiah (جايزة / هدية) جاية من العربي «هدية» على طول.
        وmeriah = مبهج وزحمة فرح، أحسن كلمة توصف بيها الاحتفال.
      ar: |
        hadiah (الجائزة / الهدية) مأخوذة مباشرة من العربية «هدية».
        وmeriah = بهيج صاخب بالفرح، وهي أنسب وصف للاحتفال.
      en: |
        hadiah (prize, gift) comes straight from Arabic «هدية».
        meriah = festive, lively — the word for a good celebration.
    examples:
      - text: Suasana lomba sangat meriah.
        ar_eg: جو المسابقات مبهج جدًا.
        ar: أجواء المسابقات بهيجة جدًا.
        en: The atmosphere at the games is very festive.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: panjat pinang
        ar_eg: طلوع العمود المدهون
        ar: تسلّق العمود المدهون
        en: greased-pole climbing
      - text: balap karung
        ar_eg: سباق الشوال
        ar: سباق الأكياس
        en: sack race
      - text: menyemangati
        ar_eg: يشجّع
        ar: يشجّع
        en: cheer on
      - text: meriah
        ar_eg: مبهج / زحمة فرح
        ar: بهيج
        en: festive, lively
      - text: hadiah
        ar_eg: جايزة / هدية
        ar: جائزة / هدية
        en: prize, gift
      - text: peserta
        ar_eg: متسابق / مشارك
        ar: مشارك
        en: participant
    words: [panjat pinang, balap karung, menyemangati, meriah, hadiah, peserta]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: في أنهي مسابقة الناس بتجري جوه شوال؟
      ar: في أيّ مسابقة يجري الناس داخل أكياس؟
      en: In which game do people race inside sacks?
    options: ["panjat pinang", "balap karung", "lomba makan kerupuk"]
    answer: 1
    words: [balap karung, panjat pinang, lomba]
  - id: e03
    type: listen
    text: Warga menyemangati peserta panjat pinang.
    options: ["Warga menyemangati peserta panjat pinang.", "Warga mengikuti lomba panjat pinang.", "Warga menyemangati peserta balap karung."]
    answer: 0
    meaning:
      ar_eg: السكان بيشجعوا اللي بيطلعوا العمود المدهون.
      ar: يشجّع السكان المتسابقين في تسلق العمود.
      en: Residents cheer on the pole climbers.
    words: [menyemangati, peserta, panjat pinang, lomba]
  - id: e04
    type: multiple_choice
    question: Suasana lomba tujuh belasan selalu ___.
    question_meaning:
      ar_eg: جو مسابقات ١٧ أغسطس دايمًا …
      ar: أجواء مسابقات السابع عشر من أغسطس دائمًا …
      en: The atmosphere at the 17 August games is always …
    options: ["hadiah", "peserta", "meriah"]
    answer: 2
    words: [meriah, lomba]
  - id: e05
    type: fill_blank
    sentence: Pemenang lomba mendapat ___ sepeda.
    meaning:
      ar_eg: الفايز في المسابقة بياخد عجلة جايزة.
      ar: ينال الفائز في المسابقة دراجة جائزةً.
      en: The winner gets a bicycle as a prize.
    options: [hadiah, peserta, karung]
    answers: [hadiah]
    words: [hadiah, lomba]
  - id: e06
    type: build_sentence
    source:
      ar_eg: السكان بيشجعوا المتسابقين.
      ar: يشجّع السكان المتسابقين.
      en: The residents cheer on the participants.
    answer: Warga menyemangati para peserta lomba.
    distractors: [semangat, ke]
    words: [menyemangati, peserta, lomba]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أخويا الصغير شارك في سباق الشوال.
      ar: شارك أخي الصغير في سباق الأكياس.
      en: My little brother took part in the sack race.
    answers:
      - Adik saya mengikuti lomba balap karung.
      - Adik saya mengikuti lomba balap karung
      - Adik saya ikut lomba balap karung.
      - Adik saya mengikuti balap karung.
      - Adik laki-laki saya mengikuti lomba balap karung.
      - Adikku mengikuti lomba balap karung.
      - Adik saya ikut balap karung.
    words: [balap karung, lomba]
  - id: e08
    type: speaking
    text: Suasananya meriah sekali! Hadiah panjat pinang ada di atas tiang.
    meaning:
      ar_eg: الجو مبهج جدًا! جوايز العمود المدهون فوق خالص.
      ar: الأجواء بهيجة جدًا! جوائز تسلق العمود في أعلاه.
      en: It's so festive! The pole-climbing prizes are at the top of the pole.
    words: [meriah, hadiah, panjat pinang]
dialogue:
  title: Lomba di kampung
  lines:
    - speaker: Andi Tenri
      text: Mohamed, ayo ikut lomba balap karung!
      ar_eg: يلا يا محمد، شارك في سباق الشوال!
      ar: هيا يا محمد، شارك في سباق الأكياس!
      en: Come on, Mohamed, join the sack race!
    - speaker: Mohamed
      text: Saya? Saya belum pernah! Saya menyemangati saja, ya.
      ar_eg: أنا؟ عمري ما عملتها! أنا هشجع بس.
      ar: أنا؟ لم أجربه قط! سأكتفي بالتشجيع.
      en: Me? I've never done it! I'll just cheer.
    - speaker: Andi Tenri
      text: Tidak apa-apa. Semua peserta pasti jatuh, ha-ha!
      ar_eg: مش مشكلة. كل المتسابقين أكيد بيقعوا، هههه!
      ar: لا بأس، فكل المتسابقين يسقطون حتمًا!
      en: That's fine. Everyone falls over anyway, ha ha!
    - speaker: Mohamed
      text: Lihat, itu panjat pinang! Hadiahnya banyak sekali.
      ar_eg: بص، ده العمود المدهون! الجوايز كتير أوي.
      ar: انظر، هذا عمود التسلق! جوائزه كثيرة جدًا.
      en: Look, there's the greased pole! So many prizes.
    - speaker: Andi Tenri
      text: Iya. Suasana tujuh belasan memang selalu meriah.
      ar_eg: أيوه. جو ١٧ أغسطس دايمًا مبهج فعلًا.
      ar: نعم، أجواء السابع عشر من أغسطس بهيجة دائمًا.
      en: Yes. The 17 August atmosphere is always festive.
