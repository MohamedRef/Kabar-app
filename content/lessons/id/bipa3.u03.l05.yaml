        ar_eg: شخصية
        ar: شخصية
        en: character
      - text: peran
        ar_eg: دور
        ar: دور
        en: role
    words: [aktor, artis, karakter, peran]
  - id: e02
    type: match_pairs
    pairs:
      - text: adegan
        ar_eg: مشهد
        ar: مشهد
        en: scene
      - text: tampil
        ar_eg: يطلع (على المسرح)
        ar: يظهر، يؤدي
        en: appear, perform
      - text: penampilan
        ar_eg: أداء، طلّة
        ar: أداء، مظهر
