    en: flood; flooded
  - word: deras
    pos: adjective
    ar_eg: جامد / غزير (مطر، مية)
    ar: غزير / سريع الجريان
    en: heavy (rain), fast-flowing
  - word: meluap
    pos: verb
    ar_eg: يفيض
    ar: يفيض
    en: to overflow
  - word: tahan
    pos: adjective
    ar_eg: يستحمل / مقاوم (tahan gempa = مقاوم للزلازل)
    ar: صامد / مقاوم (tahan gempa = مقاوم للزلازل)
    en: able to withstand, -proof (tahan gempa = earthquake-proof)
  - word: basah
