    ar_eg: مبلول
    ar: مبتلّ
    en: wet
  - word: agar
    pos: conjunction
    ar_eg: عشان / لكي (رسمي، زي supaya)
    ar: لكي (رسمية، مثل supaya)
    en: so that (formal supaya)
