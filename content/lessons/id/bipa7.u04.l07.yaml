language: id
title: Rumpun Austronesia
can_do:
  ar_eg: تشرح إزاي الإندونيسي قريب للغات تانية، وإزاي الملايو بقت لغة مشتركة.
  ar: أن تشرح قرابة الإندونيسية للغات أخرى وكيف صارت الملايوية لغة مشتركة.
  en: Explain how Indonesian is related to other languages and how Malay became a lingua franca.
slides:
  - title: Satu keluarga besar
    body:
      ar_eg: |
        الإندونيسي من rumpun bahasa Austronesia، عيلة لغات منتشرة من تايوان لمدغشقر وجزر الهادي.
        الأجداد عدّوا البحر بمراكب ليها cadik (عارضة بتوازن المركب).
        اللغات دي serumpun، يعني berkerabat (قرايب). بس لغات كتير في بابوا مش من العيلة دي.
        الملايو كانت lingua franca في الموانئ: التجّار بيتكلّموها مهما كانت لغتهم.
        pijin = لغة مبسّطة للتجارة ومش لغة أم لحد. لما الولاد يتربّوا عليها تبقى kreol.
        بعض العلماء بيوصفوا ملايو أمبون كده.
        - في الكلام: terus = lalu.
      ar: |
        الإندونيسية من rumpun bahasa Austronesia، أسرة لغوية تمتدّ من تايوان إلى مدغشقر وجزر المحيط الهادئ.
        عبر الأسلاف البحر بقوارب ذات cadik (ذراع توازن).
        هذه اللغات serumpun، أي berkerabat (بينها قرابة)، لكنّ لغات كثيرة في بابوا ليست من هذه الأسرة.
        كانت الملايوية lingua franca في الموانئ يتكلّمها التجّار أيًّا كانت لغتهم.
        pijin = لغة تجارية مبسّطة ليست لغة أمّ لأحد، فإذا نشأ عليها الأطفال صارت kreol.
        ويصف بعض العلماء ملايوية أمبون بذلك.
        - في الكلام اليومي: terus = lalu.
      en: |
        Indonesian belongs to the Austronesian rumpun bahasa (language family), spread from Taiwan to Madagascar and the Pacific.
        The ancestors crossed the sea in boats with a cadik (outrigger).
        These languages are serumpun: they berkerabat (are related). But many languages in Papua are not in this family.
        Malay was the lingua franca of the ports: traders used it whatever their own language.
        pijin = a simplified trade language nobody's mother tongue; when children grow up with it, it becomes a kreol.
        Some scholars describe Ambonese Malay this way.
        - In speech: terus = lalu.
    examples:
      - text: Bahasa Malagasi termasuk rumpun bahasa Austronesia.
        ar_eg: لغة مدغشقر من عيلة اللغات الأسترونيزية.
        ar: تنتمي اللغة الملغاشية إلى الأسرة الأسترونيزية.
        en: Malagasy belongs to the Austronesian family.
      - text: Bahasa Indonesia dan bahasa Tagalog berkerabat.
        ar_eg: الإندونيسي والتاجالوج قرايب.
        ar: بين الإندونيسية والتاغالوغية قرابة.
        en: Indonesian and Tagalog are related.
      - text: Bahasa Melayu dulu menjadi lingua franca di pelabuhan.
        ar_eg: الملايو زمان كانت اللغة المشتركة في الموانئ.
        ar: كانت الملايوية قديمًا اللغة المشتركة في الموانئ.
        en: Malay used to be the lingua franca of the ports.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rumpun bahasa
        ar_eg: عيلة لغات
        ar: أسرة لغوية
        en: language family
      - text: Austronesia
        ar_eg: الأسترونيزية (عيلة لغات)
        ar: الأسترونيزية
        en: Austronesian
      - text: serumpun
        ar_eg: من نفس العيلة / قرايب
        ar: من الأسرة نفسها
        en: of the same family, kindred
      - text: berkerabat
        ar_eg: قرايب لبعض / ليهم أصل واحد
        ar: تربطه قرابة
        en: to be related
    words: [rumpun bahasa, Austronesia, serumpun, berkerabat]
  - id: e02
    type: match_pairs
    pairs:
      - text: cadik
        ar_eg: عارضة جنب المركب (بتوازنه)
        ar: ذراع التوازن في القارب
        en: outrigger
      - text: lingua franca
        ar_eg: لغة مشتركة بين ناس مختلفين
        ar: لغة مشتركة
        en: lingua franca
      - text: kreol
        ar_eg: كريول (لغة اتولدت من خلط وبقت لغة أم)
        ar: لغة كريولية
        en: creole
      - text: pijin
        ar_eg: بيدجن (لغة مبسّطة للتجارة)
        ar: لغة هجين مبسّطة
        en: pidgin
    words: [cadik, lingua franca, kreol, pijin]
  - id: e03
    type: listen
    text: Perahu bercadik bisa berlayar jauh tanpa terbalik.
    question:
      ar_eg: إيه اللي بيخلّي المركب ما يتقلبش؟
      ar: ما الذي يمنع القارب من الانقلاب؟
      en: What keeps the boat from capsizing?
    options: [العارضة اللي بتوازن المركب, لغة التجّار, عيلة اللغات]
    answer: 0
    meaning:
      ar_eg: المركب اللي ليه عارضة يقدر يسافر بعيد من غير ما يتقلب.
      ar: يستطيع القارب ذو ذراع التوازن الإبحار بعيدًا دون أن ينقلب.
      en: An outrigger boat can sail far without capsizing.
    words: [cadik]
  - id: e04
    type: fill_blank
    sentence: Bahasa Melayu dan bahasa Jawa ___ karena berasal dari rumpun yang sama.
    meaning:
      ar_eg: الملايو والجاوي ___ علشان من نفس العيلة.
      ar: الملايوية والجاوية ___ لأنهما من الأسرة نفسها.
      en: Malay and Javanese ___ because they come from the same family.
    options: [berkerabat, pijin, cadik]
    answers: [berkerabat]
    words: [berkerabat, pijin, cadik]
    explain:
      ar_eg: berkerabat = قرايب (من نفس العيلة اللغوية). pijin = لغة هجين بسيطة، وcadik = عوامة المركب.
      ar: berkerabat = متقاربتان من أسرة واحدة. أما pijin فلغة مبسطة وcadik مِجذاف التوازن.
      en: berkerabat = related. pijin is a pidgin, cadik a boat outrigger.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الفرق بين «pijin» و«kreol» إيه؟
      ar: ما الفرق بين «pijin» و«kreol»؟
      en: What's the difference between 'pijin' and 'kreol'?
    options: [Kreol tidak punya kosakata., 'Pijin bukan bahasa ibu siapa pun, kreol sudah menjadi bahasa ibu.', Pijin hanya untuk menulis.]
    answer: 1
    explain:
      ar_eg: pijin لغة تجارة؛ لما العيال يتربّوا عليها تبقى kreol.
      ar: pijin لغة تجارة، فإن نشأ عليها الأطفال صارت kreol.
      en: A pidgin is for trade; once children grow up with it, it's a creole.
    words: [pijin, kreol]
  - id: e06
    type: fill_blank
    sentence: Di pasar Sorong, bahasa Indonesia menjadi ___ bagi semua suku.
    meaning:
      ar_eg: في سوق سورونج، الإندونيسي بقى ___ لكل القبايل.
      ar: في سوق سورونغ صارت الإندونيسية ___ لكلّ القبائل.
      en: At Sorong market, Indonesian is the ___ for every group.
    options: [lingua franca, rumpun bahasa, kreol]
    answers: [lingua franca]
    words: [lingua franca, rumpun bahasa, kreol]
    explain:
      ar_eg: lingua franca = لغة مشتركة بين ناس لغاتهم مختلفة. rumpun bahasa = عيلة لغوية، وkreol = لغة كريول.
      ar: lingua franca = لغة تواصل مشتركة. أما rumpun bahasa فأسرة لغوية وkreol لغة مولّدة.
      en: lingua franca = common trade language.
  - id: e07
    type: build_sentence
    source:
      ar_eg: شعوب الملايو كلها من أصل واحد.
      ar: شعوب الملايو كلّها من أرومة واحدة.
      en: The Malay peoples are all of one stock.
    answer: Bangsa-bangsa Melayu itu serumpun.
    distractors: [berkerabat, pijin]
    words: [serumpun]
    explain:
      ar_eg: serumpun = من نفس الأصل. berkerabat معناها قريب بس مش في الجملة، وpijin لغة هجين.
      ar: serumpun = من أصل واحد.
      en: serumpun = of one stock.
  - id: e08
    type: translate
    direction: from_target
    source_text: Banyak bahasa di Papua tidak termasuk rumpun Austronesia.
    answers_meaning:
      ar_eg: [لغات كتير في بابوا مش من العيلة الأسترونيزية, كتير من لغات بابوا مش أسترونيزية]
      ar: [لا تنتمي لغات كثيرة في بابوا إلى الأسرة الأسترونيزية, كثير من لغات بابوا ليست أسترونيزية]
      en: [Many languages in Papua are not Austronesian, 'Many Papuan languages don''t belong to the Austronesian family']
    words: [Austronesia, rumpun bahasa]
  - id: e09
    type: speaking
    text: Bahasa Indonesia dan bahasa Tagalog serumpun dan berkerabat.
    meaning:
      ar_eg: الإندونيسي والتاجالوج من نفس العيلة وقرايب.
      ar: الإندونيسية والتاغالوغية من أسرة واحدة وبينهما قرابة.
      en: Indonesian and Tagalog are of one family and related.
    words: [serumpun, berkerabat]
  - id: e10
    type: multiple_choice
    question: Bahasa apa yang dipakai pedagang dari banyak pulau untuk berdagang?
    options: [Bahasa rahasia keluarga., Bahasa ibu yang berbeda-beda., 'Lingua franca, misalnya bahasa Melayu.']
    answer: 2
    explain:
      ar_eg: التجّار بيستعملوا لغة مشتركة زي الملايو.
      ar: يستعمل التجّار لغة مشتركة كالملايوية.
      en: Traders use a common language such as Malay.
    words: [lingua franca, pijin, kreol, Austronesia, cadik]
dialogue:
  lines:
    - speaker: Om Nus
      text: Mohamed, ko tahu bahasa Biak dan bahasa Tagalog berkerabat?
      ar_eg: يا محمد، إنت عارف إن لغة بياك والتاجالوج قرايب؟
      ar: يا محمد، أتعلم أنّ لغة بياك والتاغالوغية بينهما قرابة؟
      en: Mohamed, did you know Biak and Tagalog are related?
    - speaker: Mohamed
      text: Ya, Om. Keduanya rumpun Austronesia, kan?
      ar_eg: أيوه يا عمّو. الاتنين أسترونيزي، صح؟
      ar: نعم يا عمّ، كلتاهما أسترونيزية، أليس كذلك؟
      en: Yes, Om. Both are Austronesian, right?
    - speaker: Om Nus
      text: Betul. Nenek moyang kitong berlayar dengan perahu bercadik.
      ar_eg: مظبوط. أجدادنا سافروا بمراكب ليها عارضة.
      ar: صحيح، أبحر أجدادنا بقوارب ذات أذرع توازن.
      en: Right. Our ancestors sailed in outrigger boats.
    - speaker: Mohamed
      text: Terus bahasa Melayu Papua itu kreol atau bukan?
      ar_eg: طب الملايو البابوي ده كريول ولا لأ؟
      ar: وهل الملايوية البابوية كريولية أم لا؟
      en: So is Papuan Malay a creole or not?
    - speaker: Om Nus
      text: Ahli masih berdebat. Yang pasti, di pasar dia jadi lingua franca.
      ar_eg: العلماء لسه بيتناقشوا. اللي أكيد إنها في السوق بقت اللغة المشتركة.
      ar: ما زال العلماء يتجادلون، لكنها في السوق لغة مشتركة بلا شكّ.
      en: Experts still argue. What's certain is that at the market it's the lingua franca.
