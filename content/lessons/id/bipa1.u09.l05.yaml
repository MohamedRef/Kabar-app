schema: kabar.lesson/v1
id: bipa1.u09.l05
language: id
title: Lurus, lalu belok kiri
can_do:
  ar_eg: توصف الطريق خطوة بخطوة.
  ar: أن تصف الطريق خطوة خطوة.
  en: Give step-by-step directions.
slides:
  - title: Jalan lurus, belok kiri
    body:
      ar_eg: |
        كلمات الطريق:
        - jalan lurus = امشي دغري (jalan = يمشي، وكمان «شارع»)
        - belok kiri / belok kanan = خش شمال / يمين
        - di lampu merah = عند الإشارة (حرفيًا «النور الأحمر»)
        - di perempatan = عند التقاطع (مكان ما أربع طرق بيتقابلوا)
        الفعل لوحده كفاية عشان تدّي تعليمات: Belok kanan! = خش يمين!
      ar: |
        مفردات الطريق:
        - jalan lurus = امشِ مستقيمًا (jalan = يمشي، وتعني أيضًا «شارع»)
        - belok kiri / belok kanan = انعطف يسارًا / يمينًا
        - di lampu merah = عند إشارة المرور (حرفيًا «الضوء الأحمر»)
        - di perempatan = عند التقاطع
        ويكفي الفعل وحده للإرشاد: Belok kanan! = انعطف يمينًا!
      en: |
        Direction words:
        - jalan lurus = go straight (jalan = to walk; also "street")
        - belok kiri / belok kanan = turn left / right
        - di lampu merah = at the traffic light (literally "red light")
        - di perempatan = at the crossroads
        The bare verb is enough for an instruction: Belok kanan! = Turn right!
    grammar: id.conjunction.basic
    examples:
      - text: Jalan lurus, lalu belok kiri di masjid.
        ar_eg: امشي دغري وبعدين خش شمال عند الجامع.
        ar: امشِ مستقيمًا ثم انعطف يسارًا عند المسجد.
        en: Go straight, then turn left at the mosque.
  - title: Lalu, kemudian
    body:
      ar_eg: |
        lalu وkemudian = «وبعدين». بيربطوا الخطوات بالترتيب، وده أهم حاجة في الاتجاهات:
        Jalan lurus, lalu belok kanan, kemudian belok kiri di lampu merah.
        kemudian أرسمي شوية، وlalu أكتر في الكلام.
      ar: |
        lalu وkemudian = «ثم»، وتربطان الخطوات بالترتيب، وهذا لبّ الإرشاد:
        Jalan lurus, lalu belok kanan, kemudian belok kiri di lampu merah.
        وkemudian أكثر رسمية، وlalu أكثر شيوعًا في الكلام.
      en: |
        lalu and kemudian = "then". They chain the steps in order — the heart of directions:
        Jalan lurus, lalu belok kanan, kemudian belok kiri di lampu merah.
        kemudian is a bit more formal; lalu is more common in speech.
    grammar: id.conjunction.basic
    examples:
      - text: Belok kanan di perempatan, kemudian jalan lurus.
        ar_eg: خش يمين عند التقاطع، وبعدين امشي دغري.
        ar: انعطف يمينًا عند التقاطع، ثم امشِ مستقيمًا.
        en: Turn right at the crossroads, then go straight.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jalan lurus
        ar_eg: امشي دغري
        ar: امشِ مستقيمًا
        en: go straight
      - text: belok kiri
        ar_eg: خش شمال
        ar: انعطف يسارًا
        en: turn left
      - text: lampu merah
        ar_eg: إشارة المرور
        ar: إشارة المرور
        en: traffic light
      - text: perempatan
        ar_eg: تقاطع
        ar: تقاطع
        en: crossroads
    words: [lurus, belok, lampu merah, perempatan]
  - id: e02
    type: listen
    text: Belok kanan di lampu merah.
    options: [Belok kiri di lampu merah., Belok kanan di lampu merah., Jalan lurus di lampu merah.]
    answer: 1
    words: [belok, kanan, lampu merah]
  - id: e03
    type: fill_blank
    sentence: Jalan lurus, ___ belok kiri di masjid.
    meaning:
      ar_eg: امشي دغري، وبعدين خش شمال عند الجامع.
      ar: امشِ مستقيمًا، ثم انعطف يسارًا عند المسجد.
      en: Go straight, then turn left at the mosque.
    options: [lalu, jadi, atau]
    answers: [lalu]
    words: [lalu, lurus, belok]
  - id: e04
    type: build_sentence
    source:
      ar_eg: خش يمين عند التقاطع، وبعدين امشي دغري.
      ar: انعطف يمينًا عند التقاطع، ثم امشِ مستقيمًا.
      en: Turn right at the crossroads, then go straight.
    answer: Belok kanan di perempatan, lalu jalan lurus.
    alternatives: [Belok kanan di perempatan lalu jalan lurus.]
    distractors: [kiri, atau]
    words: [belok, perempatan, lalu, lurus]
  - id: e05
    type: multiple_choice
    question: Jalan lurus, lalu belok kiri.
    question_meaning:
      ar_eg: نفس المعنى، بس بكلمة تانية بدل lalu؟
      ar: المعنى نفسه بكلمة أخرى بدل lalu؟
      en: Same meaning, with another word instead of lalu?
    options: ['Jalan lurus, kemudian belok kiri.', 'Jalan lurus, sebelum belok kiri.', 'Jalan lurus, atau belok kiri.']
    answer: 0
    explain:
      ar_eg: kemudian = lalu (وبعدين)، بس أرسمى شوية.
      ar: kemudian = lalu (ثم)، وهي أكثر رسمية.
      en: kemudian = lalu (then), a little more formal.
    words: [kemudian]
  - id: e06
    type: dictation
    text: Saya naik bus, kemudian jalan kaki.
    meaning:
      ar_eg: بركب الأتوبيس، وبعدين بمشي.
      ar: أركب الحافلة ثم أمشي.
      en: I take the bus, then walk.
    words: [naik, bus, kemudian, jalan kaki]
  - id: e07
    type: speaking
    text: Jalan lurus, kemudian belok kiri di lampu merah. Monas di sebelah kanan.
    meaning:
      ar_eg: امشي على طول، وبعدين لف شمال عند الإشارة. مونَس على اليمين.
      ar: امشِ مستقيمًا ثم انعطف يسارًا عند الإشارة. مونَس على اليمين.
      en: Go straight, then turn left at the lights. Monas is on the right.
    words: [lurus, kemudian, belok, lampu merah]
  - id: e08
    type: listen
    text: Saya jalan kaki ke perempatan.
    options: ['Saya jalan kaki ke perempatan.', 'Saya naik bus ke perempatan.', 'Saya belok kiri di perempatan.']
    answer: 0
    meaning:
      ar_eg: أنا ماشي على رجلي لحد التقاطع.
      ar: أمشي إلى التقاطع.
      en: I'm walking to the crossroads.
    words: [jalan kaki, perempatan, naik, bus]
  - id: e09
    type: fill_blank
    sentence: Saya tidak ___ bus. Saya jalan kaki.
    meaning:
      ar_eg: أنا مش راكب أتوبيس. أنا ماشي.
      ar: لا أركب الحافلة. أمشي.
      en: I'm not taking the bus. I'm walking.
    options: [naik, belok, lurus]
    answers: [naik]
    words: [naik, bus, jalan kaki]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, kamu naik bus ke kantor?
      ar_eg: محمد، بتركب أتوبيس للشغل؟
      ar: محمد، هل تركب الحافلة إلى المكتب؟
      en: Mohamed, do you take the bus to the office?
    - speaker: Mohamed
      text: Tidak, saya jalan kaki. Dekat!
      ar_eg: لأ، بروح مشي. قريب!
      ar: لا، أمشي. إنه قريب!
      en: No, I walk. It's close!
    - speaker: Rina
      text: Dari rumahmu belok kiri di lampu merah?
      ar_eg: من بيتك بتلف شمال عند الإشارة؟
      ar: من بيتك تنعطف يسارًا عند الإشارة؟
      en: From your house you turn left at the traffic light?
    - speaker: Mohamed
      text: Ya, lalu jalan lurus. Kemudian belok kanan di perempatan.
      ar_eg: أيوه، وبعدين على طول. وبعد كده يمين عند التقاطع.
      ar: نعم، ثم مباشرةً. بعد ذلك يمينًا عند التقاطع.
      en: Yes, then straight on. Then right at the crossroads.
