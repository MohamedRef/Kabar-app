  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الثوران حصل على تلات مراحل.
      ar: حدث الثوران على ثلاث مراحل.
      en: The eruption happened in three stages.
    answers:
      - Letusan itu terjadi dalam tiga tahap.
      - Letusan itu terjadi dalam tiga tahapan.
      - Letusannya terjadi dalam tiga tahap.
    words: [letusan, tahap]
  - id: e08
    type: speaking
    text: Proses letusan dimulai ketika magma naik ke permukaan.
    meaning:
      ar_eg: عملية الثوران بتبدأ لما الماجما تطلع للسطح.
      ar: تبدأ عملية الثوران حين تصعد الصهارة إلى السطح.
      en: The eruption process begins when magma rises to the surface.
    words: [proses, letusan, magma]
  - id: e09
    type: dictation
    text: Abu vulkanik bisa mengganggu penerbangan.
    meaning:
      ar_eg: الرماد البركاني ممكن يعطّل الطيران.
      ar: قد يعطّل الرماد البركاني الرحلات الجوّية.
      en: Volcanic ash can disrupt flights.
    words: [abu vulkanik]
  - id: e10
    type: translate
    direction: from_target
    source_text: Setiap tahap dalam proses ini penting.
    answers_meaning:
      ar_eg:
        - كل مرحلة في العملية دي مهمة.
        - كل خطوة في العملية دي ليها أهمية.
      ar:
        - كلّ مرحلة في هذه العملية مهمّة.
        - لكلّ مرحلة من هذه العملية أهمّيتها.
      en:
        - Every stage in this process matters.
        - Each stage of this process is important.
    words: [tahap, proses]
dialogue:
  title: Tulisan untuk blog
  lines:
    - speaker: Mohamed
      text: Bu, saya menulis penjelasan tentang Gunung Kaba untuk blog saya.
      ar_eg: يا دكتورة، أنا بكتب شرح عن جبل كابا للبلوج بتاعي.
      ar: أكتب شرحًا عن جبل كابا لمدوّنتي.
      en: I'm writing an explainer about Mount Kaba for my blog.
    - speaker: Bu Laila
      text: Bagus. Mulai dengan pernyataan umum, lalu tulis prosesnya dari awal sampai akhir.
      ar_eg: حلو. ابدأ بجملة عامة، وبعدين اكتب العملية من الأول للآخر.
      ar: أحسنت. ابدأ بعبارة عامة، ثمّ اكتب العملية من أوّلها إلى آخرها.
      en: Good. Start with a general statement, then write the process from start to finish.
    - speaker: Mohamed
      text: Pertama magma naik, kemudian tekanan bertambah, akhirnya terjadi letusan.
      ar_eg: الأول الماجما بتطلع، بعدين الضغط بيزيد، وفي الآخر بيحصل الثوران.
      ar: أوّلًا تصعد الصهارة، ثمّ يزداد الضغط، وأخيرًا يحدث الثوران.
      en: First the magma rises, then the pressure builds, and finally there's an eruption.
    - speaker: Bu Laila
      text: Rapi sekali. Tambahkan satu kalimat tentang abu vulkanik dan bahayanya.
      ar_eg: مترتّب جدًا. زوّد جملة عن الرماد البركاني وخطره.
      ar: مرتّب جدًّا. أضف جملة عن الرماد البركاني وخطره.
      en: Very neat. Add one sentence about volcanic ash and its dangers.
