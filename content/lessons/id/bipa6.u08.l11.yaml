    words: [letusan, magma, tahap, abu vulkanik, proses]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه أول مرحلة في المثال؟
      ar: ما أوّل مرحلة في المثال؟
      en: What is the first stage in the example?
    options:
      - اللافا بتسيل.
      - الماجما بتطلع لفوق.
      - الرماد بيطير.
    answer: 1
    words: [magma]
  - id: e03
    type: fill_blank
    sentence: ___ dari letusan itu menutupi atap rumah.
    meaning:
      ar_eg: الرماد البركاني من الثوران ده غطّى سقف البيوت.
      ar: غطّى الرماد البركاني الناتج عن الثوران أسقف البيوت.
      en: Volcanic ash from the eruption covered the roofs.
    options: [Abu vulkanik, Tahap, Proses]
    answers: [Abu vulkanik]
    words: [abu vulkanik, letusan]
  - id: e04
    type: listen
    text: Proses ini bisa terjadi selama berminggu-minggu.
    question:
      ar_eg: العملية دي ممكن تاخد قد إيه؟
      ar: كم قد تستغرق هذه العملية؟
      en: How long can this process take?
    options:
      - أسابيع.
      - دقيقة.
      - قرون.
    answer: 0
    words: [proses]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الأول، الماجما بتطلع من جوّه الأرض.
      ar: أوّلًا، تصعد الصهارة من باطن الأرض.
      en: First, magma rises from inside the earth.
    answer: Pertama, magma naik dari dalam bumi.
    distractors: [tahap, letusan]
    words: [magma]
  - id: e06
    type: match_pairs
    pairs:
      - text: asteroid
        ar_eg: كويكب
        ar: كويكب
