schema: kabar.lesson/v1
id: bipa6.u08.l11
language: id
title: Menulis penjelasan
can_do:
  ar_eg: تكتب نص علمي قصير بيشرح عملية خطوة بخطوة.
  ar: أن تكتب نصًّا علميًّا قصيرًا يشرح عملية خطوة بخطوة.
  en: Write a short science explainer that walks through a process.
slides:
  - title: Teks eksplanasi
    grammar: id.sentence.complex
    body:
      ar_eg: |
        النص الشارح (teks eksplanasi) ليه 3 أجزاء:
        1. جملة عامة: Gunung Kaba di Bengkulu adalah gunung api aktif.
        2. الـ proses (العملية) tahap demi tahap (خطوة بخطوة): Pertama, … Kemudian, … Akhirnya, …
        3. خاتمة: أثر أو نصيحة.
        مثال (مكتوب للدرس): Pertama, magma naik dari dalam bumi. Kemudian, tekanan gas bertambah. Akhirnya, terjadi letusan, dan abu vulkanik terbang ke udara.
      ar: |
        للنصّ الشارح (teks eksplanasi) ثلاثة أجزاء:
        1. جملة عامّة: Gunung Kaba di Bengkulu adalah gunung api aktif.
        2. الـ proses (العملية) tahap demi tahap (مرحلةً مرحلة): Pertama, … Kemudian, … Akhirnya, …
        3. خاتمة: أثر أو نصيحة.
        مثال (مكتوب للدرس): Pertama, magma naik dari dalam bumi. Kemudian, tekanan gas bertambah. Akhirnya, terjadi letusan, dan abu vulkanik terbang ke udara.
      en: |
        An explainer (teks eksplanasi) has three parts:
        1. A general statement: Gunung Kaba di Bengkulu adalah gunung api aktif.
        2. The proses (process) tahap demi tahap (stage by stage): Pertama, … Kemudian, … Akhirnya, …
        3. A close: an effect or a piece of advice.
        Example (written for the lesson): Pertama, magma naik dari dalam bumi. Kemudian, tekanan gas bertambah. Akhirnya, terjadi letusan, dan abu vulkanik terbang ke udara.
