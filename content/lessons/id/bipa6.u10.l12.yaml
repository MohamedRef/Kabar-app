schema: kabar.lesson/v1
id: bipa6.u10.l12
language: id
title: Umpan balik teman
can_do:
  ar_eg: تدي زميلك رأي مفيد ولطيف في مقاله، وتاخد رأيه في مقالك.
  ar: أن تقدّم لزميلك ملاحظات مفيدة لطيفة على مقاله، وتتلقّى ملاحظاته على مقالك.
  en: Give a classmate useful, kind feedback on their essay, and take theirs on yours.
slides:
  - title: Roti lapis
    body:
      ar_eg: |
        الـ umpan balik (الفيدباك) الكويس زي الساندوتش:
        1. حاجة حلوة: Tesismu jelas sekali.
        2. masukan (اقتراح للتحسين): Mungkin paragraf ketiga bisa lebih pendek.
        3. تشجيع: Secara keseluruhan, esaimu meyakinkan.
        ولما تاخد فيدباك: قول Terima kasih atas masukannya. ماتدافعش على طول.
        - في الشارع: banget = sekali (أوي)، aku / -ku = saya (أنا)، kepanjangan = terlalu panjang (طويل أوي)، makasih = terima kasih (شكرًا)، tapi = tetapi (بس / لكن)، bener = benar (صح)، ngebantu = membantu (يساعد).
      ar: |
        الـ umpan balik (التغذية الراجعة) الجيّدة كالشطيرة:
        ١. أمر حسن: Tesismu jelas sekali.
        ٢. masukan (اقتراح للتحسين): Mungkin paragraf ketiga bisa lebih pendek.
        ٣. تشجيع: Secara keseluruhan, esaimu meyakinkan.
        وحين تتلقّاها قل: Terima kasih atas masukannya. ولا تسارع إلى الدفاع.
        - في كلام الشارع: banget = sekali (جدًّا)، aku / -ku = saya (أنا)، kepanjangan = terlalu panjang (طويل أكثر من اللازم)، makasih = terima kasih (شكرًا)، tapi = tetapi (لكن)، bener = benar (صحيح)، ngebantu = membantu (يساعد).
      en: |
        Good umpan balik (feedback) is like a sandwich:
        1. Something good: Tesismu jelas sekali.
        2. A masukan (suggestion): Mungkin paragraf ketiga bisa lebih pendek.
        3. Encouragement: Secara keseluruhan, esaimu meyakinkan.
        When you receive it, say: Terima kasih atas masukannya. Don't rush to defend yourself.
        - On the street: banget = sekali (very), aku / -ku = saya (I), kepanjangan = terlalu panjang (too long), makasih = terima kasih (thanks), tapi = tetapi (but), bener = benar (right), ngebantu = membantu (to help).
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة masukan لطيفة؟
      ar: أيّ جملة masukan لطيفة؟
      en: Which sentence is a kind masukan?
    options:
      - Esaimu jelek.
      - Mungkin kalimat ini bisa lebih pendek.
      - Saya tidak mau membacanya.
    answer: 1
    words: [masukan]
    explain:
      ar_eg: الاقتراح اللطيف بيبدأ بـ Mungkin ويقترح تحسين. «Esaimu jelek» جارحة، والتالتة رفض.
      ar: الاقتراح اللطيف يبدأ بـ Mungkin ويقترح تحسينًا؛ أمّا «Esaimu jelek» فجارحة، والثالثة رفض.
      en: Kind input starts with Mungkin and suggests a fix. "Esaimu jelek" is hurtful, and the third refuses.
  - id: e02
    type: listen
    text: Terima kasih atas umpan baliknya. Saya akan merevisi paragraf kedua.
    question:
      ar_eg: هيعمل إيه بعد الفيدباك؟
      ar: ماذا سيفعل بعد الملاحظات؟
      en: What will he do after the feedback?
    options:
      - هيمسح المقال.
      - هيزعل من صاحبه.
      - هيعدّل الفقرة التانية.
    answer: 2
    words: [umpan balik, revisi]
  - id: e03
    type: fill_blank
    sentence: Dosen memberi ___ tertulis di setiap draf.
    meaning:
      ar_eg: الدكتور بيدي فيدباك مكتوب على كل مسودة.
      ar: يقدّم الأستاذ ملاحظات مكتوبة على كلّ مسوّدة.
      en: The lecturer gives written feedback on every draft.
    options: [umpan balik, salah ketik, kerangka]
    answers: [umpan balik]
    words: [umpan balik, draf]
    explain:
      ar_eg: الدكتور بيدّي ملاحظات مكتوبة umpan balik. salah ketik = غلطة وkerangka = هيكل.
      ar: يقدّم المحاضر ملاحظات مكتوبة umpan balik؛ أمّا salah ketik فخطأ طباعي، وkerangka مخطّط.
      en: The lecturer gives written umpan balik, feedback. salah ketik is a typo, and kerangka an outline.
  - id: e04
    type: build_sentence
    source:
      ar_eg: شكرًا على اقتراحك.
      ar: شكرًا على اقتراحك.
      en: Thank you for your suggestion.
    answer: Terima kasih atas masukannya.
    distractors: [umpan, balik]
    words: [masukan]
    explain:
      ar_eg: «شكرًا على اقتراحك» = Terima kasih atas masukannya. umpan وbalik لوحدهم مش في الجملة.
      ar: «شكرًا على اقتراحك» Terima kasih atas masukannya؛ أمّا umpan وbalik منفردتين فليستا في الجملة.
      en: "\"Thanks for your suggestion\" is Terima kasih atas masukannya. umpan and balik alone aren't used."
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الأطروحة بتاعتك واضحة جدًا، بس المصدر ده مش موثوق.
      ar: أطروحتك واضحة جدًّا، لكنّ هذا المصدر غير موثوق.
      en: Your thesis is very clear, but this source isn't trustworthy.
    answers:
      - Tesismu jelas sekali, tetapi sumber ini tidak terpercaya.
      - Tesismu sangat jelas, tetapi sumber ini tidak terpercaya.
      - Tesismu jelas sekali, tapi sumber ini tidak terpercaya.
      - Tesis kamu sangat jelas, tetapi sumber ini tidak terpercaya.
      - Tesismu jelas sekali, tapi sumber ini nggak terpercaya.
      - Tesismu sangat jelas, tapi sumber ini nggak terpercaya.
      - Tesis kamu sangat jelas, tapi sumber ini nggak terpercaya.
    words: [tesis, terpercaya]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: الفيدباك «الساندوتش» بيبدأ بإيه؟
      ar: بمَ تبدأ ملاحظات «الشطيرة»؟
      en: How does "sandwich" feedback start?
    options:
      - بحاجة حلوة في المقال.
      - بأكبر غلطة.
      - بالدرجة.
    answer: 0
    words: [umpan balik]
    explain:
      ar_eg: الفيدباك «الساندويتش» بيبدأ بحاجة حلوة، وبعدين النقد، وبعدين حاجة حلوة تاني. مش بالغلط ولا بالدرجة.
      ar: تبدأ ملاحظات «الشطيرة» بإيجابية ثمّ النقد ثمّ إيجابية أخرى، لا بالخطأ ولا بالدرجة.
      en: Sandwich feedback opens with a positive, then the critique, then another positive. Not the worst error or the grade.
  - id: e07
    type: speaking
    text: Secara keseluruhan, esaimu meyakinkan. Masukan saya hanya satu.
    meaning:
      ar_eg: في المجمل، مقالك مقنع. عندي اقتراح واحد بس.
      ar: إجمالًا، مقالك مقنع، ولديّ اقتراح واحد فقط.
      en: Overall, your essay is convincing. I have just one suggestion.
    words: [masukan, meyakinkan]
  - id: e08
    type: dictation
    text: Umpan balik dari teman membantu saya menemukan kelemahan esai.
    meaning:
      ar_eg: فيدباك صحابي ساعدني ألاقي نقط الضعف في المقال.
      ar: ساعدتني ملاحظات زملائي في اكتشاف مواطن ضعف المقال.
      en: Feedback from friends helped me find the essay's weaknesses.
    words: [umpan balik, kelemahan]
  - id: e09
    type: fill_blank
    sentence: Jangan langsung membela diri. Dengarkan dulu ___ teman-temanmu.
    meaning:
      ar_eg: ماتدافعش عن نفسك على طول. اسمع اقتراحات صحابك الأول.
      ar: لا تسارع إلى الدفاع عن نفسك، واستمع أوّلًا إلى اقتراحات زملائك.
      en: Don't get defensive right away. Listen to your friends' suggestions first.
    options: [masukan, plagiarisme, situs]
    answers: [masukan]
    words: [masukan]
    explain:
      ar_eg: اسمع اقتراحات صحابك masukan. plagiarisme = سرقة أدبية وsitus = موقع.
      ar: استمع إلى اقتراحات أصدقائك masukan؛ أمّا plagiarisme فسرقة أدبية، وsitus موقع.
      en: Listen to your friends' masukan, suggestions. plagiarisme is plagiarism, and situs a website.
  - id: e10
    type: speaking
    text: Kerangkamu bagus. Mungkin urutan butir kedua dan ketiga bisa ditukar.
    meaning:
      ar_eg: الهيكل بتاعك حلو. يمكن ترتيب النقطة التانية والتالتة يتبدّل.
      ar: هيكلك جيّد، وربّما يمكن تبديل ترتيب النقطتين الثانية والثالثة.
      en: Your outline is good. Maybe points two and three could swap places.
    words: [kerangka, urutan, butir]
dialogue:
  title: Tukar esai
  lines:
    - speaker: Rani
      text: Mohamed, kamu baca esaiku, aku baca esaimu, ya.
      ar_eg: يا محمد، إنت تقرا مقالي، وأنا أقرا مقالك.
      ar: يا محمد، اقرأ مقالتي وأقرأ مقالتك.
      en: Mohamed, you read my essay and I'll read yours.
    - speaker: Mohamed
      text: Oke. Tesismu jelas banget. Masukanku, paragraf nomor tiga terlalu panjang.
      ar_eg: تمام. أطروحتك واضحة جدًا. اقتراحي إن الفقرة التالتة طويلة أوي.
      ar: حسنًا. أطروحتك واضحة جدًّا، واقتراحي أنّ الفقرة الثالثة طويلة جدًّا.
      en: 'Okay. Your thesis is very clear. My suggestion: the third paragraph is too long.'
    - speaker: Rani
      text: Makasih masukannya. Esaimu meyakinkan, tapi satu sumbernya anonim.
      ar_eg: شكرًا على الاقتراح. مقالك مقنع، بس فيه مصدر من غير اسم.
      ar: شكرًا على اقتراحك. مقالك مقنع، لكنّ أحد مصادره مجهول.
      en: Thanks for the suggestion. Your essay's convincing, but one source is anonymous.
    - speaker: Mohamed
      text: Bener. Aku ganti pakai jurnal ilmiah. Umpan balik kamu ngebantu banget.
      ar_eg: صح. هبدّله بمجلة علمية. الفيدباك بتاعك مفيد جدًا.
      ar: صحيح، سأستبدله بمجلّة علمية. ملاحظاتك مفيدة جدًّا.
      en: True. I'll swap it for a journal article. Your feedback really helps.
new_words:
  - word: umpan balik
    pos: noun
    ar_eg: فيدباك / رأي
    ar: تغذية راجعة، ملاحظات
    en: feedback
  - word: masukan
    pos: noun
    ar_eg: اقتراح للتحسين
    ar: اقتراح، ملاحظة
    en: input, suggestion
review:
  status: draft
  verified: false
