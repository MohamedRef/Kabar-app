schema: kabar.lesson/v1
id: bipa6.u01.l09
language: id
title: Ayah dan anak
can_do:
  ar_eg: 'تقرا مشهد بين أب وابنه وتفهم اللي ماتقالش: التعب والخذلان والدفا.'
  ar: 'أن تقرأ مشهدًا بين أب وابنه وتفهم ما لم يُقل: التعب والخيبة والدفء.'
  en: 'Read a father-and-son scene and catch what goes unsaid: weariness, disappointment, warmth.'
slides:
  - title: Ayah dan anak
    body:
      ar_eg: |
        مشهد: أب بيسهر في الشغل عشان لقمة العيش، وابنه الصغير مستنيه.
        nafkah = لقمة العيش، المصروف اللي بيصرفه على البيت (mencari nafkah). begadang = يسهر لحد الصبح.
        letih = هلكان. kekecewaan = خذلان، خيبة أمل (من kecewa). kehangatan = دفا (من hangat).
        lugu = على نياته، ساذج. riang = فرحان ومبسوط. tersadar = فاق، خد باله فجأة.
        - في الشارع: nyambut = menyambut (يستقبل)، sama = dengan / oleh (مع / من)، terus = lalu (وبعدين)، nanya = bertanya (يسأل).
      ar: |
        مشهد: أب يسهر في العمل طلبًا للرزق، وابنه الصغير ينتظره.
        nafkah = الرزق، النفقة على البيت (mencari nafkah). begadang = يسهر حتى الصباح.
        letih = مُنهَك. kekecewaan = خيبة أمل (من kecewa). kehangatan = دفء (من hangat).
        lugu = ساذج، بريء. riang = مرِح، مبتهج. tersadar = أفاق، انتبه فجأة.
        - في كلام الشارع: nyambut = menyambut (يستقبل)، sama = dengan / oleh (مع / مِن قِبَل)، terus = lalu (ثمّ)، nanya = bertanya (يسأل).
      en: |
        Scene: a father works late nights to earn a living; his little son waits for him.
        nafkah = livelihood, support for the family (mencari nafkah). begadang = to stay up all night.
        letih = weary. kekecewaan = disappointment (from kecewa). kehangatan = warmth (from hangat).
        lugu = naive, innocent. riang = cheerful. tersadar = to suddenly realise.
        - On the street: nyambut = menyambut (to welcome), sama = dengan / oleh (with, by), terus = lalu (then), nanya = bertanya (to ask).
    examples:
      - text: Ayahnya begadang setiap malam untuk mencari nafkah.
        ar_eg: أبوه بيسهر كل ليلة عشان لقمة العيش.
        ar: يسهر أبوه كل ليلة طلبًا للرزق.
        en: His father stays up every night to earn a living.
      - text: Anak yang lugu itu menyambutnya dengan riang.
        ar_eg: العيل اللي على نياته ده استقبله فرحان.
        ar: استقبله الطفل البريء مرحًا.
        en: The innocent child greeted him cheerfully.
      - text: Dia tersadar bahwa anaknya sudah besar.
        ar_eg: خد باله فجأة إن ابنه كبر.
        ar: انتبه فجأة إلى أن ابنه قد كبر.
        en: He suddenly realised his son had grown up.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nafkah
        ar_eg: لقمة العيش
        ar: الرزق، النفقة
        en: livelihood
      - text: begadang
        ar_eg: يسهر للصبح
        ar: يسهر
        en: to stay up all night
      - text: letih
        ar_eg: هلكان
        ar: منهك
        en: weary
      - text: kekecewaan
        ar_eg: خذلان
        ar: خيبة أمل
        en: disappointment
    words: [nafkah, begadang, letih, kekecewaan]
  - id: e02
    type: match_pairs
    pairs:
      - text: kehangatan
        ar_eg: دفا
        ar: دفء
        en: warmth
      - text: lugu
        ar_eg: على نياته
        ar: ساذج، بريء
        en: naive
      - text: riang
        ar_eg: فرحان
        ar: مرِح
        en: cheerful
      - text: tersadar
        ar_eg: خد باله فجأة
        ar: انتبه فجأة
        en: to suddenly realise
    words: [kehangatan, lugu, riang, tersadar]
  - id: e03
    type: listen
    text: Setelah bekerja enam belas jam, dia letih sekali.
    question:
      ar_eg: كان حاسس بإيه؟
      ar: بماذا كان يشعر؟
      en: How did he feel?
    options: [هلكان, فرحان, على نياته]
    answer: 0
    meaning:
      ar_eg: بعد ما اشتغل ستاشر ساعة، كان هلكان خالص.
      ar: بعد العمل ست عشرة ساعة كان منهكًا جدًا.
      en: After working sixteen hours, he was worn out.
    words: [letih]
  - id: e04
    type: fill_blank
    sentence: Ayahnya bekerja keras untuk mencari ___ bagi keluarganya.
    meaning:
      ar_eg: أبوه بيشتغل جامد عشان يجيب ___ للعيلة.
      ar: يعمل أبوه بجدّ طلبًا لـ ___ أسرته.
      en: His father works hard to earn a ___ for his family.
    options: [nafkah, kehangatan, kekecewaan]
    answers: [nafkah]
    words: [nafkah, kehangatan, kekecewaan]
    explain:
      ar_eg: mencari nafkah = يكسب عيشه. kehangatan = دفا وkekecewaan = خيبة أمل، ومش بيتكسبوا بالشغل.
      ar: mencari nafkah كسب الرزق؛ أمّا kehangatan (الدفء) وkekecewaan (الخيبة) فلا تُكسبان بالعمل.
      en: mencari nafkah is earning a living. kehangatan (warmth) and kekecewaan (disappointment) aren't earned by working.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: تحس بإيه لما حد تثق فيه يخلف وعده؟
      ar: بماذا تشعر حين يخلف وعدَه شخصٌ تثق به؟
      en: What do you feel when someone you trust breaks a promise?
    options: [kehangatan, kekecewaan, nafkah]
    answer: 1
    explain:
      ar_eg: kekecewaan = خيبة الأمل، من kecewa.
      ar: kekecewaan = خيبة الأمل، من kecewa.
      en: kekecewaan = disappointment, from kecewa.
    words: [kekecewaan, kehangatan, nafkah]
  - id: e06
    type: fill_blank
    sentence: Anak itu masih ___; dia percaya semua cerita ayahnya.
    meaning:
      ar_eg: العيل ده لسه ___؛ مصدّق كل حكايات أبوه.
      ar: ما زال الطفل ___؛ يصدّق كل حكايات أبيه.
      en: The child is still ___; he believes all his father's stories.
    options: [lugu, letih, begadang]
    answers: [lugu]
    words: [lugu, letih, begadang]
    explain:
      ar_eg: اللي بيصدّق كل حاجة lugu (بريء/ساذج). letih = تعبان وbegadang = سهران، ومالهمش علاقة بالتصديق.
      ar: من يصدّق كلّ شيء lugu (بريء ساذج)؛ أمّا letih (متعب) وbegadang (يسهر) فلا علاقة لهما بالتصديق.
      en: A child who believes everything is lugu, innocent. letih (tired) and begadang (staying up) have nothing to do with belief.
  - id: e07
    type: multiple_choice
    question: Pelukan anaknya memberi ___ yang sudah lama hilang.
    options: [begadang, tersadar, kehangatan]
    answer: 2
    explain:
      ar_eg: 'حضن ابنه إداه دفا كان ضايع منه: kehangatan.'
      ar: 'منحه عناق ابنه دفئًا فقده منذ زمن: kehangatan.'
      en: 'His son''s hug gave him a long-lost warmth: kehangatan.'
    words: [kehangatan, begadang, tersadar]
  - id: e08
    type: build_sentence
    source:
      ar_eg: سهر لحد الصبح عشان يخلّص الشغل.
      ar: سهر حتى الصباح لينهي العمل.
      en: He stayed up till morning to finish the work.
    answer: Dia begadang sampai pagi untuk menyelesaikan pekerjaan.
    distractors: [riang, lugu]
    words: [begadang]
    explain:
      ar_eg: «سهر لحد الصبح» = begadang sampai pagi. riang = فرحان وlugu = بريء، ومش في المعنى.
      ar: «سهر حتّى الصباح» هي begadang sampai pagi؛ أمّا riang (مرح) وlugu (بريء) فليسا في المعنى.
      en: "\"Stayed up till morning\" is begadang sampai pagi. riang (cheerful) and lugu (innocent) aren't in the meaning."
  - id: e09
    type: translate
    direction: from_target
    source_text: 'Ayahnya tersadar: anaknya tidak lagi riang.'
    answers_meaning:
      ar_eg: ['أبوه خد باله: ابنه ما بقاش فرحان', الأب انتبه إن ابنه مش مبسوط زي زمان]
      ar: ['انتبه أبوه: لم يعد ابنه مرحًا', أدرك الأب أن ابنه لم يعد مبتهجًا]
      en: [His father realised his son was no longer cheerful, 'The father suddenly saw that his son wasn''t happy any more']
    words: [tersadar, riang]
  - id: e10
    type: speaking
    text: Anak yang lugu itu menyambut ayahnya dengan riang.
    meaning:
      ar_eg: العيل اللي على نياته ده استقبل أبوه فرحان.
      ar: استقبل الطفل البريء أباه مرحًا.
      en: The innocent child greeted his father cheerfully.
    words: [lugu, riang]
dialogue:
  lines:
    - speaker: Bang Togar
      text: 'Bagian favoritku: ayahnya pulang letih, anaknya nyambut dengan riang.'
      ar_eg: 'الحتة اللي بحبها: الأب راجع هلكان، والابن مستقبله فرحان.'
      ar: 'مقطعي المفضّل: يعود الأب منهكًا، فيستقبله الابن مرحًا.'
      en: 'My favourite part: the father comes home weary, the son greets him cheerfully.'
    - speaker: Mohamed
      text: Ayahnya begadang di kantor. Ada kekecewaan sama kerjaannya, kan?
      ar_eg: الأب بيسهر في المكتب. فيه خذلان من شغله، صح؟
      ar: يسهر الأب في المكتب. ثمة خيبة من عمله، أليس كذلك؟
      en: The father works late nights at the office. He's disappointed with his job, right?
    - speaker: Bang Togar
      text: Betul. Tapi dia bertahan demi nafkah keluarga.
      ar_eg: مظبوط. بس مستحمل عشان لقمة عيش العيلة.
      ar: صحيح. لكنه يصمد من أجل رزق الأسرة.
      en: Right. But he hangs on to support the family.
    - speaker: Mohamed
      text: Terus anaknya yang lugu nanya, 'Ayah capek?' Dan ayahnya tersadar.
      ar_eg: 'وبعدين الابن اللي على نياته يسأل: ''بابا تعبان؟'' والأب ياخد باله.'
      ar: 'ثم يسأل الابن البريء: ''أبي، أأنت متعب؟'' فيفيق الأب.'
      en: Then the innocent son asks, 'Tired, Dad?' And the father wakes up to it.
    - speaker: Bang Togar
      text: Iya. Cerpen ini selesai dengan kehangatan, bukan jawaban.
      ar_eg: أيوه. القصة دي بتخلص بدفا، مش بإجابة.
      ar: نعم. تنتهي هذه القصة بالدفء، لا بالجواب.
      en: Yes. The story ends with warmth, not an answer.
