language: id
title: Hikayat
can_do:
  ar_eg: تتعرّف على الحكاية الملايوية القديمة (hikayat) وتلاقي جدورها العربية.
  ar: أن تتعرّف على الحكاية الملايوية القديمة (hikayat) وتتبيّن جذورها العربية.
  en: Recognise the classic Malay hikayat and find its Arabic roots.
slides:
  - title: Dari "حكاية" ke "hikayat"
    body:
      ar_eg: |
        الـ hikayat نثر ملايوي قديم، والكلمة نفسها جاية من العربي «حكاية».
        - الأبطال ملوك وأمرا، وفيها petualangan (مغامرات) وسحر وجنّ.
        - البطل ساعات pengembara (رحّالة / بيلفّ البلاد).
        - حكايات كتير جات عن طريق الـ terjemahan (الترجمة) من العربي والفارسي، زي Hikayat Amir Hamzah.
        - فيه كمان حكايات ملايوية أصلية، زي Hikayat Hang Tuah.
        الحكاية بتبدأ بكلمات قديمة زي Sebermula (في البداية) وHatta (وبعدين).
      ar: |
        الـ hikayat نثر ملايويّ قديم، والكلمة نفسها من العربية «حكاية».
        - أبطالها ملوك وأمراء، وفيها petualangan (مغامرات) وسحر وجنّ.
        - وقد يكون البطل pengembara (رحّالة يجوب البلاد).
        - ووصل كثير منها عبر الـ terjemahan (الترجمة) من العربية والفارسية، مثل Hikayat Amir Hamzah.
        - ومنها حكايات ملايوية أصيلة، مثل Hikayat Hang Tuah.
        وتبدأ بألفاظ قديمة مثل Sebermula (بادئ ذي بدء) وHatta (ثمّ).
      en: |
        A hikayat is classic Malay prose, and the word itself comes from Arabic «حكاية» (story).
        - Its heroes are kings and princes, with petualangan (adventures), magic and jinn.
        - The hero is sometimes a pengembara (wanderer).
        - Many came by terjemahan (translation) from Arabic and Persian, like Hikayat Amir Hamzah.
        - Others are home-grown Malay, like Hikayat Hang Tuah.
        They open with old words like Sebermula (in the beginning) and Hatta (then).
    examples:
      - text: Hatta, pengembara itu tiba di sebuah negeri yang jauh.
        ar_eg: وبعدين الرحّالة ده وصل لبلد بعيدة.
        ar: ثمّ بلغ ذلك الرحّالة بلدًا بعيدًا.
        en: Then the wanderer arrived in a faraway land.
