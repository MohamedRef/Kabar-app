  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ الجملتين صحيحة؟
      en: Which sentence is correct?
    options: ["Saya punya sakit kepala.", "Saya sakit kepala."]
    answer: 1
    explain:
      ar_eg: مش محتاج punya. sakit kepala لوحدها معناها «عندي صداع».
      ar: لا حاجة إلى punya، فـ sakit kepala تكفي.
      en: No punya needed; sakit kepala says it all.
    words: [sakit]
  - id: e04
    type: listen
    text: Perut saya sakit sejak tadi malam.
    options: ["Perut saya sakit sejak tadi malam.", "Gigi saya sakit sejak tadi malam.", "Kepala saya sakit sejak tadi malam."]
    answer: 0
    words: [perut]
  - id: e05
    type: fill_blank
    sentence: Dok, gigi saya ___.
    meaning:
      ar_eg: يا دكتور، سناني بتوجعني.
      ar: يا دكتور، أسناني تؤلمني.
      en: Doctor, my tooth hurts.
    options: ["sehat", "sejuk", "sakit"]
    answers: [sakit]
    words: [gigi, sakit]
  - id: e06
    type: fill_blank
    sentence: Saya merasa ___.
    meaning:
      ar_eg: حاسس بدوخة.
      ar: أشعر بالدوار.
      en: I feel dizzy.
    options: ["mual", "lemas", "pusing"]
    answers: [pusing]
    words: [merasa, pusing]
  - id: e07
    type: multiple_choice
    question: Sakit apa, Pak?
    question_meaning:
      ar_eg: الدكتور بيسألك. أنهي رد مناسب؟
      ar: يسألك الطبيب. أيّ جواب يناسب؟
      en: The doctor asks you. Which answer fits?
    options: ["Sejak kemarin.", "Saya demam dan batuk.", "Saya dari Mesir."]
    answer: 1
    words: [demam, batuk]
  - id: e08
    type: multiple_choice
    question: Sudah berapa lama?
    question_meaning:
      ar_eg: الدكتور بيسأل بقالك قد إيه. ترد بإيه؟
      ar: يسأل الطبيب منذ متى. بماذا تجيب؟
      en: The doctor asks how long. Your answer?
    options: ["Kepala saya, Dok.", "Sejak kemarin, Dok.", "Saya sehat, Dok."]
    answer: 1
    words: [sejak]
  - id: e09
    type: build_sentence
    source:
      ar_eg: بطني بتوجعني.
      ar: بطني يؤلمني.
      en: My stomach hurts.
    answer: Perut saya sakit.
    distractors: [kepala, punya]
    words: [perut, sakit]
  - id: e10
    type: build_sentence
    source:
      ar_eg: عندي صداع من امبارح.
      ar: عندي صداع منذ أمس.
      en: I've had a headache since yesterday.
    answer: Saya sakit kepala sejak kemarin.
    alternatives:
      - Kepala saya sakit sejak kemarin.
      - Sejak kemarin saya sakit kepala.
      - Sejak kemarin kepala saya sakit.
    distractors: [punya, selama]
    explain:
      ar_eg: sejak = من (نقطة بداية). selama = لمدة، ومش مناسبة هنا.
      ar: sejak = منذ، أما selama فمعناها لمدة.
      en: sejak = since (a starting point); selama = for (a length of time).
    words: [sakit, kepala, sejak]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا سخن. (عندي سخونية)
      ar: عندي حمّى.
      en: I have a fever.
    answers:
      - Saya demam.
      - Saya demam
      - Aku demam.
      - Aku demam
      - Saya sedang demam.
      - Saya sakit demam.
    words: [demam]
  - id: e12
    type: translate
    direction: from_target
    source_text: Kepala saya pusing dan badan saya lemas.
    answers_meaning:
      ar_eg: ["راسي دايخة وجسمي هبطان.", "أنا دايخ وجسمي تعبان", "حاسس بدوخة وهبوط"]
      ar: ["أشعر بالدوار والوهن.", "رأسي يدور وجسمي واهن"]
      en: ["I feel dizzy and weak.", "My head is spinning and my body feels weak."]
    words: [pusing, badan, lemas]
  - id: e13
    type: dictation
    text: Saya sakit tenggorokan.
    meaning:
      ar_eg: عندي التهاب في الزور.
      ar: عندي التهاب في الحلق.
      en: I have a sore throat.
    words: [tenggorokan]
  - id: e14
    type: speaking
    text: Dok, saya demam dan sakit kepala sejak kemarin.
    meaning:
      ar_eg: يا دكتور، عندي سخونية وصداع من امبارح.
      ar: يا دكتور، عندي حمّى وصداع منذ أمس.
      en: Doctor, I've had a fever and a headache since yesterday.
    words: [demam, sakit kepala, sejak]
dialogue:
  title: Setelah berenang di Amed
  lines:
    - speaker: Ni Luh
      text: Mohamed, kamu kenapa? Sakit?
      ar_eg: يا محمد، مالك؟ إنت عيان؟
      ar: يا محمد، ما بك؟ هل أنت مريض؟
      en: Mohamed, what's wrong? Are you ill?
    - speaker: Mohamed
      text: Iya. Kepala saya sakit dan saya merasa pusing.
      ar_eg: أيوه. راسي بتوجعني وحاسس بدوخة.
      ar: نعم. رأسي يؤلمني وأشعر بالدوار.
      en: Yes. My head hurts and I feel dizzy.
    - speaker: Ni Luh
      text: Aduh! Sejak kapan?
      ar_eg: يا خبر! من إمتى؟
      ar: يا للأسف! منذ متى؟
      en: Oh no! Since when?
    - speaker: Mohamed
      text: Sejak tadi pagi. Mungkin saya terlalu lama berenang di laut.
      ar_eg: من الصبح. يمكن عشان عمت في البحر وقت طويل أوي.
      ar: منذ الصباح. ربما سبحت في البحر وقتًا طويلًا جدًا.
      en: Since this morning. Maybe I swam in the sea too long.
    - speaker: Ni Luh
      text: Kamu demam?
      ar_eg: عندك سخونية؟
      ar: هل عندك حمّى؟
      en: Do you have a fever?
    - speaker: Mohamed
      text: Tidak, cuma lemas. Mungkin masuk angin.
      ar_eg: لأ، جسمي هبطان بس. يمكن واخد برد.
      ar: لا، أشعر بالوهن فقط. ربما هي نزلة برد.
      en: No, just weak. Maybe it's a chill.
