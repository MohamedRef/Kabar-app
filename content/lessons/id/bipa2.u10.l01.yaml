schema: kabar.lesson/v1
id: bipa2.u10.l01
language: id
title: Kepala saya sakit
can_do:
  ar_eg: تقول إيه اللي بيوجعك وحاسس بإيه.
  ar: أن تصف أعراضك وما يؤلمك.
  en: Describe symptoms.
slides:
  - title: Saya sakit kepala
    body:
      ar_eg: |
        sakit = عيان أو بيوجع:
        - Saya sakit = أنا عيان.
        - sakit + جزء من الجسم = وجع: sakit kepala = صداع، sakit perut = مغص / وجع بطن، sakit gigi = وجع سنان، sakit tenggorokan = التهاب زور.
        مش محتاج punya (عندي): «Saya punya sakit kepala» غلط.
      ar: |
        sakit = مريض أو يؤلم:
        - Saya sakit = أنا مريض.
        - sakit + عضو = ألم فيه: sakit kepala = صداع، sakit perut = ألم البطن، sakit gigi = ألم الأسنان، sakit tenggorokan = التهاب الحلق.
        ولا حاجة إلى punya، فقول «Saya punya sakit kepala» خطأ.
      en: |
        sakit = ill or hurting:
        - Saya sakit = I'm ill.
        - sakit + body part = an ache: sakit kepala (headache), sakit perut (stomach ache), sakit gigi (toothache), sakit tenggorokan (sore throat).
        No punya ("have"): "Saya punya sakit kepala" is wrong.
    grammar: id.pattern.sakit
    examples:
      - text: Saya sakit kepala.
        ar_eg: عندي صداع.
        ar: عندي صداع.
        en: I have a headache.
      - text: Dok, saya sakit perut sejak tadi malam.
        ar_eg: يا دكتور، عندي مغص من امبارح بالليل.
        ar: يا دكتور، أشعر بألم في بطني منذ الليلة الماضية.
        en: Doctor, I've had a stomach ache since last night.
  - title: Kepala saya sakit
    body:
      ar_eg: |
        ممكن كمان تقلب الترتيب: الجزء + saya + sakit. ده بالظبط زي «راسي بتوجعني» عندنا!
        Perut saya sakit = بطني بتوجعني.
      ar: |
        ويمكن عكس الترتيب: العضو + saya + sakit، تمامًا كقولنا «رأسي يؤلمني».
        Perut saya sakit = بطني يؤلمني.
      en: |
        You can also flip it: body part + saya + sakit — exactly like Arabic «راسي بتوجعني».
        Perut saya sakit = My stomach hurts.
    grammar: id.pattern.sakit
    examples:
      - text: Kepala saya sakit.
        ar_eg: راسي بتوجعني.
        ar: رأسي يؤلمني.
        en: My head hurts.
      - text: Gigi saya sakit.
        ar_eg: سناني بتوجعني.
        ar: أسناني تؤلمني.
        en: My tooth hurts.
  - title: Merasa pusing, mual, lemas
    body:
      ar_eg: |
        merasa = حاسس: Saya merasa pusing = حاسس بدوخة، mual = نفسي غامّة، lemas = جسمي هبطان.
        أمراض شائعة: demam = سخونية، batuk = كحة، pilek = رشح، masuk angin = برد (حرفيًا «دخل فيه هوا»، فكرة شعبية إندونيسية).
        ومن غير merasa كمان صح: Saya demam = أنا سخن.
      ar: |
        merasa = يشعر: Saya merasa pusing = أشعر بدوار، mual = غثيان، lemas = وهن.
        أمراض شائعة: demam = حمّى، batuk = سعال، pilek = زكام، masuk angin = نزلة برد (حرفيًا «دخلته الريح»، مفهوم شعبي).
        ويصح بلا merasa: Saya demam = عندي حمّى.
      en: |
        merasa = feel: Saya merasa pusing (dizzy), mual (nauseous), lemas (weak).
        Common ailments: demam (fever), batuk (cough), pilek (runny nose), masuk angin (a chill — literally "wind got in", a folk notion).
        Without merasa is fine too: Saya demam = I have a fever.
    grammar: id.pattern.sakit
    examples:
      - text: Kepala saya pusing dan badan saya lemas.
        ar_eg: راسي دايخة وجسمي هبطان.
        ar: أشعر بالدوار والوهن.
        en: I feel dizzy and weak.
      - text: Kamu sakit apa? — Cuma masuk angin.
        ar_eg: عندك إيه؟ — شوية برد بس.
        ar: ما بك؟ — مجرد نزلة برد.
        en: What's wrong? — Just a chill.
  - title: Sehat = صحة
    body:
      ar_eg: |
        sehat (سليم / بصحة كويسة) جاية من العربي «صحة». عكسها sakit.
        عند الدكتور هيسألك:
        - Sakit apa? = عندك إيه؟
        - Sudah berapa lama? = بقالك قد إيه؟ — Sejak kemarin = من امبارح.
      ar: |
        sehat (سليم معافى) من العربية «صحة»، وضدها sakit.
        وسيسألك الطبيب:
        - Sakit apa؟ = ما بك؟
        - Sudah berapa lama؟ = منذ متى؟ — Sejak kemarin = منذ أمس.
      en: |
        sehat (healthy) comes from Arabic «صحة»; its opposite is sakit.
        The doctor will ask:
        - Sakit apa? = What's wrong?
        - Sudah berapa lama? = How long has it been? — Sejak kemarin = Since yesterday.
    grammar: id.pattern.sakit
    examples:
      - text: Sekarang saya sudah sehat.
        ar_eg: دلوقتي أنا بقيت كويس.
        ar: الآن صرت معافى.
        en: Now I'm healthy again.
