schema: kabar.lesson/v1
id: bipa2.u10.l01
language: id
title: Saya sakit perut
can_do:
  ar_eg: تقول بيوجعك فين.
  ar: أن تقول أين يؤلمك.
  en: Say where it hurts.
slides:
  - title: Saya sakit kepala
    body:
      ar_eg: |
        sakit = عيان أو بيوجع:
        - Saya sakit = أنا عيان.
        - sakit + جزء من الجسم = وجع: sakit kepala = صداع، sakit perut = مغص / وجع بطن، sakit gigi = وجع سنان، sakit tenggorokan = التهاب زور.
        مش محتاج punya (عندي): «Saya punya sakit kepala» غلط.
      ar: |
        sakit = مريض أو يؤلم:
        - Saya sakit = أنا مريض.
        - sakit + عضو = ألم فيه: sakit kepala = صداع، sakit perut = ألم البطن، sakit gigi = ألم الأسنان، sakit tenggorokan = التهاب الحلق.
        ولا حاجة إلى punya، فقول «Saya punya sakit kepala» خطأ.
      en: |
        sakit = ill or hurting:
        - Saya sakit = I'm ill.
        - sakit + body part = an ache: sakit kepala (headache), sakit perut (stomach ache), sakit gigi (toothache), sakit tenggorokan (sore throat).
        No punya ("have"): "Saya punya sakit kepala" is wrong.
    grammar: id.pattern.sakit
    examples:
      - text: Saya sakit kepala.
        ar_eg: عندي صداع.
        ar: عندي صداع.
        en: I have a headache.
      - text: Dok, saya sakit perut sejak tadi malam.
        ar_eg: يا دكتور، عندي مغص من امبارح بالليل.
        ar: يا دكتور، أشعر بألم في بطني منذ الليلة الماضية.
        en: Doctor, I've had a stomach ache since last night.
  - title: Kepala saya sakit
    body:
      ar_eg: |
        ممكن كمان تقلب الترتيب: الجزء + saya + sakit. ده بالظبط زي «راسي بتوجعني» عندنا!
        Perut saya sakit = بطني بتوجعني.
      ar: |
        ويمكن عكس الترتيب: العضو + saya + sakit، تمامًا كقولنا «رأسي يؤلمني».
        Perut saya sakit = بطني يؤلمني.
      en: |
        You can also flip it: body part + saya + sakit — exactly like Arabic «راسي بتوجعني».
        Perut saya sakit = My stomach hurts.
    grammar: id.pattern.sakit
    examples:
      - text: Kepala saya sakit.
        ar_eg: راسي بتوجعني.
        ar: رأسي يؤلمني.
        en: My head hurts.
      - text: Gigi saya sakit.
        ar_eg: سناني بتوجعني.
        ar: أسناني تؤلمني.
        en: My tooth hurts.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sakit kepala
        ar_eg: صداع
        ar: صداع
        en: headache
      - text: sakit perut
        ar_eg: مغص، وجع بطن
        ar: ألم البطن
        en: stomach ache
      - text: sakit gigi
        ar_eg: وجع سنان
        ar: ألم الأسنان
        en: toothache
      - text: sakit tenggorokan
        ar_eg: التهاب زور
        ar: التهاب الحلق
        en: sore throat
    words: [kepala, perut, gigi, tenggorokan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ الجملتين صحيحة؟
      en: Which sentence is correct?
    options: [Saya punya sakit kepala., Saya sakit kepala.]
    answer: 1
    explain:
      ar_eg: مش محتاج punya. sakit kepala لوحدها معناها «عندي صداع».
      ar: لا حاجة إلى punya، فـ sakit kepala تكفي.
      en: No punya needed; sakit kepala says it all.
    words: [sakit]
  - id: e03
    type: listen
    text: Perut saya sakit sejak tadi malam.
    options: [Perut saya sakit sejak tadi malam., Gigi saya sakit sejak tadi malam., Tenggorokan saya sakit sejak tadi malam.]
    answer: 0
    words: [perut, gigi, tenggorokan]
  - id: e04
    type: fill_blank
    sentence: Dok, gigi saya ___.
    meaning:
      ar_eg: يا دكتور، سناني بتوجعني.
      ar: يا دكتور، أسناني تؤلمني.
      en: Doctor, my tooth hurts.
    options: [sehat, sejuk, sakit]
    answers: [sakit]
    words: [gigi, sakit]
    explain:
      ar_eg: sakit = بيوجع/عيّان. sehat = بصحة كويسة (عكسها)، وsejuk = هوا منعش.
      ar: sakit = يؤلم. أما sehat فعكسها وsejuk «منعش».
      en: sakit = hurts. sehat (healthy) is its opposite, sejuk is cool air.
  - id: e05
    type: build_sentence
    source:
      ar_eg: بطني بتوجعني.
      ar: بطني يؤلمني.
      en: My stomach hurts.
    answer: Perut saya sakit.
    alternatives: [Saya sakit perut.]
    distractors: [kepala, punya]
    words: [perut, sakit]
    explain:
      ar_eg: "الجزء + saya + sakit = الحتة دي بتوجعني: Perut saya sakit. kepala = راس، وده جزء تاني."
      ar: "العضو + saya + sakit: Perut saya sakit. أما kepala فرأس، عضو آخر."
      en: "Body part + saya + sakit: Perut saya sakit. kepala (head) is a different part."
  - id: e06
    type: build_sentence
    source:
      ar_eg: عندي صداع من امبارح.
      ar: عندي صداع منذ أمس.
      en: I've had a headache since yesterday.
    answer: Saya sakit kepala sejak kemarin.
    alternatives: [Kepala saya sakit sejak kemarin., Sejak kemarin saya sakit kepala., Sejak kemarin kepala saya sakit.]
    distractors: [punya, selama]
    explain:
      ar_eg: sejak = من (نقطة بداية). selama = لمدة، ومش مناسبة هنا.
      ar: sejak = منذ، أما selama فمعناها لمدة.
      en: sejak = since (a starting point); selama = for (a length of time).
    words: [sakit, kepala, sejak]
  - id: e07
    type: dictation
    text: Saya sakit tenggorokan.
    meaning:
      ar_eg: عندي التهاب في الزور.
      ar: عندي التهاب في الحلق.
      en: I have a sore throat.
    words: [tenggorokan]
  - id: e08
    type: fill_blank
    sentence: Saya ___ sakit kepala, Dok. Perut saya tidak sakit.
    meaning:
      ar_eg: عندي صداع بس يا دكتور. بطني مش بتوجعني.
      ar: عندي صداع فقط يا دكتور. بطني لا يؤلمني.
      en: I just have a headache, doctor. My stomach doesn't hurt.
    options: [cuma, juga, sejak]
    answers: [cuma]
    explain:
      ar_eg: cuma = بس. juga = كمان، وده عكس المعنى هنا.
      ar: cuma = فقط، أما juga فـ«أيضًا»، وهي عكس المعنى هنا.
      en: cuma = just, only; juga = also, the opposite of what's meant here.
    words: [cuma, kepala, perut, sakit]
  - id: e09
    type: listen
    text: Saya cuma sakit tenggorokan.
    options: [Saya cuma sakit tenggorokan., Saya juga sakit tenggorokan., Saya sakit tenggorokan sejak kemarin.]
    answer: 0
    meaning:
      ar_eg: عندي التهاب زور بس.
      ar: عندي التهاب في الحلق فقط.
      en: I just have a sore throat.
    words: [cuma, tenggorokan]
  - id: e10
    type: speaking
    text: Cuma sakit gigi, Dok.
    meaning:
      ar_eg: وجع سنان بس يا دكتور.
      ar: ألم أسنان فقط يا دكتور.
      en: Just a toothache, doctor.
    words: [cuma, gigi, sakit]
dialogue:
  lines:
    - speaker: Dokter
      text: Selamat pagi. Sakit apa, Pak?
      ar_eg: صباح الخير. عندك إيه يا أستاذ؟
      ar: صباح الخير. ممّ تشكو يا سيدي؟
      en: Good morning. What's the matter, sir?
    - speaker: Mohamed
      text: Saya sakit perut, Dok.
      ar_eg: بطني بتوجعني يا دكتور.
      ar: بطني يؤلمني يا دكتور.
      en: I have a stomach ache, doctor.
    - speaker: Dokter
      text: Sejak kapan?
      ar_eg: من إمتى؟
      ar: منذ متى؟
      en: Since when?
    - speaker: Mohamed
      text: Sejak tadi malam. Gigi saya juga sakit.
      ar_eg: من امبارح بالليل. وسناني كمان بتوجعني.
      ar: منذ الليلة الماضية. وأسناني تؤلمني أيضًا.
      en: Since last night. My teeth hurt too.
