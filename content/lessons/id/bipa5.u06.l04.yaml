      ar: لتعزف على السابي، عليك أن تنقر أوتارها.
      en: To play the sape, you have to pluck its strings.
    options: [memetik, meniup, memukul]
    answers: [memetik]
    words: [memetik, dawai]
dialogue:
  title: Musik di kafe Palangka Raya
  lines:
    - speaker: Rina
      text: Dengerin deh, Mohamed. Itu suara sape, alat musik Dayak.
      ar_eg: اسمع يا محمد. ده صوت السابي، آلة الداياك.
      ar: اسمع يا محمد، هذا صوت السابي، آلة الدّاياك الموسيقية.
      en: Listen, Mohamed. That's a sape, a Dayak instrument.
    - speaker: Mohamed
      text: Merdu banget! Suaranya mirip oud, tapi lebih lembut.
      ar_eg: صوتها حلو أوي! شبه العود، بس أنعم.
      ar: ما أعذبه! يشبه صوت العود، لكنه ألين.
      en: So sweet! It sounds like an oud, but softer.
    - speaker: Rina
      text: Pemusik itu cuma memetik tiga dawai, tapi iramanya kaya banget.
      ar_eg: العازف بينقر على تلات أوتار بس، والإيقاع غني.
      ar: لا ينقر العازف إلا ثلاثة أوتار، ومع ذلك إيقاعها غنيّ.
      en: He plucks only three strings, yet the rhythm is rich.
    - speaker: Mohamed
      text: Aku pengin belajar sape. Siapa tahu aku bisa mainin lagu Mesir pakai sape!
      ar_eg: نفسي أتعلم السابي. يمكن أعزف عليها أغنية مصري!
      ar: أودّ أن أتعلّم السابي، فلعلّي أعزف عليها أغنية مصرية!
      en: I want to learn the sape. Maybe I can play an Egyptian song on it!
