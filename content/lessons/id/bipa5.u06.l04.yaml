schema: kabar.lesson/v1
id: bipa5.u06.l04
language: id
title: Musik sape
can_do:
  ar_eg: توصف آلة موسيقية وصوتها وإيقاعها، زي السابي عند الداياك.
  ar: أن تصف آلة موسيقية وصوتها وإيقاعها، كآلة السابي عند الدّاياك.
  en: Describe a musical instrument, its sound and rhythm, such as the Dayak sape.
slides:
  - title: Sape, gitar dari Kalimantan
    body:
      ar_eg: |
        السابي (sape) آلة داياكية بتتنحت من جذع شجرة واحد، وشبه العود والجيتار.
        - alat musik = آلة موسيقية
        - dawai = وتر، والسابي ليها من ٢ لـ ٤ أوتار
        - memetik = ينقر / يعزف بالصوابع على الوتر (petik = نقر)
        - irama = إيقاع
        - merdu = صوته حلو وعذب: suara yang merdu
        زمان كانت بتتعزف في الطقوس، ودلوقتي بتسمعها في الحفلات والكافيهات كمان.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: dengerin = dengarkan، banget = sekali، cuma = hanya، aku = saya، pengin = ingin، mainin = memainkan.
      ar: |
        السابي (sape) آلة داياكية تُنحت من جذع شجرة واحد، وتشبه العود والغيتار.
        - alat musik = آلة موسيقية
        - dawai = وتر، وللسابي من وترين إلى أربعة
        - memetik = ينقر الوتر بالأصابع (petik = نقر)
        - irama = إيقاع
        - merdu = عذب الصوت: suara yang merdu
        كانت قديمًا تُعزف في الطقوس، وتُسمع اليوم في الحفلات والمقاهي أيضًا.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: dengerin = dengarkan، banget = sekali، cuma = hanya، aku = saya، pengin = ingin، mainin = memainkan.
      en: |
        The sape is a Dayak instrument carved from a single log, a cousin of the oud and the guitar.
        - alat musik = musical instrument
        - dawai = string; a sape has two to four
        - memetik = to pluck (petik = pluck)
        - irama = rhythm
        - merdu = sweet-sounding: suara yang merdu
        It was once played in rituals; today you hear it at concerts and in cafés too.
        The dialogue uses street forms; the formal ones are beside them: dengerin = dengarkan, banget = sekali, cuma = hanya, aku = saya, pengin = ingin, mainin = memainkan.
    examples:
      - text: Suara sape yang merdu mengiringi tari enggang.
        ar_eg: صوت السابي العذب بيصاحب رقصة أبو قرن.
        ar: يرافق صوتُ السابي العذب رقصةَ طائر أبي قرن.
        en: The sweet sound of the sape accompanies the hornbill dance.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: alat musik
        ar_eg: آلة موسيقية
        ar: آلة موسيقية
        en: musical instrument
      - text: dawai
        ar_eg: وتر
        ar: وتر
        en: string
      - text: memetik
        ar_eg: ينقر على الوتر
        ar: ينقر الوتر
        en: to pluck
      - text: irama
        ar_eg: إيقاع
        ar: إيقاع
        en: rhythm
      - text: merdu
        ar_eg: صوته حلو
        ar: عذب الصوت
        en: melodious
    words: [alat musik, dawai, memetik, irama, merdu]
  - id: e02
    type: listen
    text: Sape adalah alat musik Dayak yang dipetik, seperti gitar. Dulu sape hanya dimainkan dalam upacara, tetapi sekarang kita bisa mendengarnya di kafe.
    question:
      ar_eg: إيه اللي اتغيّر في السابي؟
      ar: ما الذي تغيّر في السابي؟
      en: What has changed about the sape?
    options:
      - Sape sekarang ditiup, bukan dipetik.
      - Sape sekarang juga dimainkan di tempat umum, tidak hanya dalam upacara.
      - Sape sekarang tidak dimainkan lagi.
    answer: 1
    meaning:
      ar_eg: السابي آلة موسيقية داياكية بيتنقر عليها زي الجيتار. زمان كانت بتتعزف في الطقوس بس، لكن دلوقتي ممكن نسمعها في الكافيهات.
      ar: السابي آلة داياكية تُعزف بالنقر كالغيتار. كانت قديمًا تُعزف في الطقوس فقط، أما اليوم فنسمعها في المقاهي.
      en: The sape is a plucked Dayak instrument, like a guitar. It used to be played only in rituals, but now we can hear it in cafés.
    explain:
      ar_eg: dulu hanya dalam upacara = زمان في الطقوس بس، وsekarang di kafe = دلوقتي في الكافيه كمان. لسه dipetik (بتتنقر).
      ar: dulu hanya dalam upacara = قديمًا في الطقوس فقط، وsekarang di kafe = الآن في المقاهي أيضًا، وما زالت dipetik (تُنقر).
      en: dulu hanya dalam upacara = once only in rituals; sekarang di kafe = now in cafés too. It's still dipetik (plucked).
    words: [alat musik, memetik, sape]
  - id: e03
    type: fill_blank
    sentence: Sape biasanya punya dua sampai empat ___.
    meaning:
      ar_eg: السابي عادةً ليها من ٢ لـ ٤ أوتار.
      ar: للسابي عادةً من وترين إلى أربعة.
      en: A sape usually has two to four strings.
    options: [dawai, irama, merdu]
    answers: [dawai]
    words: [dawai, sape]
    explain:
      ar_eg: «أوتار» = dawai. irama = إيقاع وmerdu = عذب الصوت، ومايتعدّوش.
      ar: «الأوتار» = dawai. أما irama فالإيقاع، وmerdu «عذب»، ولا يُعدّان.
      en: "\"Strings\" is dawai. irama (rhythm) and merdu (sweet-sounding) can't be counted."
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: «Suara sape sangat merdu.» معناها إيه؟
      ar: ما معنى «Suara sape sangat merdu.»؟
      en: What does "Suara sape sangat merdu." mean?
    options:
      - Suara sape keras dan mengganggu.
      - Suara sape sangat enak didengar.
      - Sape tidak punya suara.
    answer: 1
    words: [merdu]
    explain:
      ar_eg: merdu = حلو وعذب، يعني enak didengar (حلو في السمع). مش عالي ومزعج، والسابي ليها صوت.
      ar: merdu = عذب، أي enak didengar (طيّب السماع)، لا عالٍ مزعج، وللسابي صوت.
      en: merdu means sweet-sounding, enak didengar (nice to hear), not loud and grating; the sape does make sound.
  - id: e05
    type: build_sentence
    source:
      ar_eg: إيقاعها بطيء وهادي.
      ar: إيقاعها بطيء وهادئ.
      en: Its rhythm is slow and calm.
    answer: Iramanya pelan dan tenang.
    distractors: [dawai, memetik]
    words: [irama]
    explain:
      ar_eg: «إيقاعها» = Iramanya. dawai = وتر وmemetik = ينقر، مش في الجملة.
      ar: «إيقاعها» = Iramanya. أما dawai فالوتر، وmemetik «ينقر».
      en: "\"Its rhythm\" is Iramanya. dawai (string) and memetik (pluck) aren't in it."
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: العود آلة موسيقية عربية.
      ar: العود آلة موسيقية عربية.
      en: The oud is an Arab musical instrument.
    answers:
      - Oud adalah alat musik Arab.
      - Oud merupakan alat musik Arab.
      - Oud itu alat musik Arab.
      - Oud adalah alat musik dari Arab.
    words: [alat musik]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «Penari bergerak mengikuti ___ sape.» (الراقصين بيتحركوا على إيقاع السابي) تحط إيه؟
      ar: ماذا تضع في «Penari bergerak mengikuti ___ sape.» (يتحرّك الراقصون على إيقاع السابي)؟
      en: Which fits "Penari bergerak mengikuti ___ sape." (dancers move to the sape's rhythm)?
    options: [irama, dawai, bulu]
    answer: 0
    words: [irama]
    explain:
      ar_eg: بيتحركوا على «الإيقاع» = irama. dawai = وتر وbulu = ريش، محدش بيرقص عليهم.
      ar: يتحرّكون على irama (الإيقاع). أما dawai فالوتر، وbulu الريش.
      en: Dancers follow the irama (rhythm). dawai (string) and bulu (feather) aren't followed.
  - id: e08
    type: speaking
    text: Pemusik itu memetik dawai sape dengan lembut.
    meaning:
      ar_eg: العازف بينقر أوتار السابي بنعومة.
      ar: ينقر العازف أوتار السابي برفق.
      en: The musician plucks the sape's strings gently.
    words: [memetik, dawai, sape]
  - id: e09
    type: dictation
    text: Suara sape yang merdu mengiringi tari enggang, sehingga semua penonton diam dan mendengarkan.
    meaning:
      ar_eg: صوت السابي العذب بيصاحب رقصة أبو قرن، فالجمهور كله سكت وبيسمع.
      ar: يرافق صوت السابي العذب رقصة طائر أبي قرن، حتى يصمت الجمهور كلّه ويُصغي.
      en: The sweet sound of the sape accompanies the hornbill dance, so the whole audience falls silent and listens.
    words: [merdu]
  - id: e10
    type: fill_blank
    sentence: Untuk bermain sape, kita harus ___ dawainya.
    meaning:
      ar_eg: عشان تعزف سابي، لازم تنقر الأوتار.
      ar: لتعزف على السابي، عليك أن تنقر أوتارها.
      en: To play the sape, you have to pluck its strings.
    options: [memetik, meniup, memukul]
    answers: [memetik]
    words: [memetik, dawai, sape]
    explain:
      ar_eg: الأوتار «بتتنقر» = memetik. meniup = ينفخ (للناي)، وmemukul = يخبط (للطبلة).
      ar: الأوتار تُنقر = memetik. أما meniup فـ«ينفخ» للناي، وmemukul «يضرب» للطبل.
      en: "Strings are plucked: memetik. meniup (blow) is for flutes and memukul (strike) for drums."
dialogue:
  title: Musik di kafe Palangka Raya
  lines:
    - speaker: Rina
      text: Dengerin deh, Mohamed. Itu suara sape, alat musik Dayak.
      ar_eg: اسمع يا محمد. ده صوت السابي، آلة الداياك.
      ar: اسمع يا محمد، هذا صوت السابي، آلة الدّاياك الموسيقية.
      en: Listen, Mohamed. That's a sape, a Dayak instrument.
    - speaker: Mohamed
      text: Merdu banget! Suaranya mirip oud, tapi lebih lembut.
      ar_eg: صوتها حلو أوي! شبه العود، بس أنعم.
      ar: ما أعذبه! يشبه صوت العود، لكنه ألين.
      en: So sweet! It sounds like an oud, but softer.
    - speaker: Rina
      text: Pemusik itu cuma memetik tiga dawai, tapi iramanya kaya banget.
      ar_eg: العازف بينقر على تلات أوتار بس، والإيقاع غني.
      ar: لا ينقر العازف إلا ثلاثة أوتار، ومع ذلك إيقاعها غنيّ.
      en: He plucks only three strings, yet the rhythm is rich.
    - speaker: Mohamed
      text: Aku pengin belajar sape. Siapa tahu aku bisa mainin lagu Mesir pakai sape!
      ar_eg: نفسي أتعلم السابي. يمكن أعزف عليها أغنية مصري!
      ar: أودّ أن أتعلّم السابي، فلعلّي أعزف عليها أغنية مصرية!
      en: I want to learn the sape. Maybe I can play an Egyptian song on it!
