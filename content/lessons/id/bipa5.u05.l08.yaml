  - id: e03
    type: listen
    text: Gawat! Asapnya masuk ke sekolah.
    question:
      ar_eg: الموقف عامل إزاي؟
      ar: كيف الوضع؟
      en: How serious is it?
    options: [خطير, حلو, عادي]
    answer: 0
    meaning:
      ar_eg: يا نهار! الدخان دخل المدرسة.
      ar: يا للكارثة! دخل الدخان المدرسة.
      en: This is bad! The smoke has got into the school.
    words: [gawat]
  - id: e04
    type: fill_blank
    sentence: Listrik ___ dua jam karena badai.
    meaning:
      ar_eg: النور ___ ساعتين بسبب العاصفة.
      ar: ___ت الكهرباء ساعتين بسبب العاصفة.
      en: The power was ___ for two hours because of the storm.
    options: [padam, musnah, karbon]
    answers: [padam]
    words: [padam, musnah, karbon]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الفحم الصغير الأحمر اللي فاضل بعد ما النار تهدى اسمه إيه؟
      ar: ما اسم الفحم الأحمر الذي يبقى بعد خمود النار؟
      en: What are the glowing bits left after a fire dies down?
    options: [atmosfer, musibah, bara]
    answer: 2
    explain:
      ar_eg: bara = جمر.
      ar: bara = جمر.
      en: bara = embers.
    words: [atmosfer, musibah, bara]
  - id: e06
    type: fill_blank
    sentence: Banjir besar itu adalah ___ bagi ribuan keluarga.
    meaning:
      ar_eg: الفيضان الكبير ده كان ___ لآلاف العيلات.
      ar: كان ذلك الفيضان الكبير ___ لآلاف الأسر.
      en: That big flood was a ___ for thousands of families.
    options: [musibah, bara, macan]
    answers: [musibah]
    words: [musibah, bara, macan]
  - id: e07
    type: multiple_choice
    question: Jika tidak dilindungi, spesies ini akan ___.
    options: [gawat, musnah, padam]
    answer: 1
    explain:
      ar_eg: musnah = ينقرض، يختفي خالص.
      ar: musnah = يفنى، ينقرض.
      en: musnah = to be wiped out.
    words: [gawat, musnah, padam]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الخث بيطلّع كربون في الغلاف الجوي.
      ar: يطلق الخث الكربون في الغلاف الجوي.
      en: Peat releases carbon into the atmosphere.
    answer: Gambut melepaskan karbon ke atmosfer.
    distractors: [bara, musibah]
    words: [karbon, atmosfer]
  - id: e09
    type: translate
    direction: from_target
    source_text: Macan dahan bisa musnah kalau hutannya terbakar.
    answers_meaning:
      ar_eg: [النمر الملطخ ممكن ينقرض لو الغابة اتحرقت, لو الغابة ولعت، النمر الملطخ ممكن يختفي]
      ar: [قد ينقرض النمر الملطّخ إن احترقت الغابة, يمكن أن يفنى النمر الملطّخ إذا احترقت غابته]
      en: [The clouded leopard could die out if the forest burns, Clouded leopards could be wiped out if the forest burns]
    words: [macan, musnah]
  - id: e10
    type: speaking
    text: Gawat, apinya belum padam!
    meaning:
      ar_eg: يا نهار، النار لسه ما طفيتش!
      ar: يا للخطر، لم تنطفئ النار بعد!
      en: This is bad, the fire still isn't out!
    words: [gawat, padam]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, penerbanganmu ke Palangka Raya dibatalin? Gara-gara kabut asap?
      ar_eg: يا محمد، طيارتك لبالانكا رايا اتلغت؟ فيه شبورة دخان؟
      ar: يا محمد، أُلغيت رحلتك إلى بالانكا رايا؟ هل هناك ضباب دخاني؟
      en: Mohamed, was your flight to Palangka Raya cancelled? Is there haze?
    - speaker: Mohamed
      text: Iya. Katanya lahan gambut terbakar lagi. Sekolah-sekolah pada tutup.
      ar_eg: أيوه. بيقولوا أراضي الخث ولعت تاني. والمدارس قفلت.
      ar: نعم. يقولون إن أراضي الخث احترقت ثانية، وأُغلقت المدارس.
      en: Yes. They say the peatland is burning again. Schools are closed.
    - speaker: Rina
      text: Gawat. Api gambut susah dipadamin soalnya baranya di bawah tanah.
      ar_eg: دي حاجة خطيرة. نار الخث صعب تتطفي عشان الجمر تحت الأرض.
      ar: هذا خطير. يصعب إطفاء نار الخث لأن جمرها تحت الأرض.
      en: That's serious. Peat fires are hard to put out because the embers are underground.
    - speaker: Mohamed
      text: Terus asapnya bawa banyak karbon ke atmosfer, kan?
      ar_eg: والدخان بيطلّع كربون كتير في الجو، صح؟
      ar: ويحمل الدخان كثيرًا من الكربون إلى الغلاف الجوي، أليس كذلك؟
      en: And the smoke puts a lot of carbon into the atmosphere, right?
    - speaker: Rina
      text: Iya. Ini musibah buat manusia sama hewan. Orangutan sama macan dahan bisa musnah.
      ar_eg: مظبوط. دي مصيبة للبني آدمين والحيوانات. إنسان الغاب والنمر الملطخ ممكن ينقرضوا.
      ar: صحيح. إنها كارثة للبشر والحيوان، وقد ينقرض إنسان الغاب والنمر الملطّخ.
      en: Right. It's a disaster for people and animals. Orangutans and clouded leopards could die out.
