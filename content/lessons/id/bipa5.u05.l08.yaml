schema: kabar.lesson/v1
id: bipa5.u05.l08
language: id
title: Api di lahan gambut
can_do:
  ar_eg: 'تشرح حرايق أراضي الخث: الجمر تحت الأرض والإطفا، الكربون والغلاف الجوي، الكارثة والحالة الخطيرة، وحيوانات بتنقرض.'
  ar: 'أن تشرح حرائق أراضي الخث: الجمر تحت الأرض والإطفاء، والكربون والغلاف الجوي، والكارثة والوضع الخطير، والحيوانات المهدّدة بالانقراض.'
  en: 'Explain peat fires: embers underground and putting them out, carbon and the atmosphere, disaster and danger, and animals dying out.'
slides:
  - title: Kabut asap
    body:
      ar_eg: |
        bara = جمر: api gambut tetap menyala sebagai bara di bawah tanah.
        padam = يطفي، ينطفي (listrik padam = النور قطع)، والمتعدي memadamkan = يطفّي.
        karbon = كربون، atmosfer = الغلاف الجوي.
        musibah = مصيبة، كارثة، gawat = خطير، حالة حرجة: Gawat! = يا نهار!
        musnah = يتمحي، ينقرض: macan dahan bisa musnah = النمر الملطخ ممكن ينقرض.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: dibatalin = dibatalkan، gara-gara = karena، dipadamin = dipadamkan، soalnya = karena، terus = lalu، buat = untuk.
      ar: |
        bara = جمر: تبقى نار الخث جمرًا تحت الأرض.
        padam = ينطفئ (listrik padam = انقطعت الكهرباء)، والمتعدّي memadamkan = يُطفئ.
        karbon = كربون، atmosfer = الغلاف الجوي.
        musibah = مصيبة، كارثة، gawat = خطير، حرج: Gawat! = يا للكارثة!
        musnah = يفنى، ينقرض: macan dahan bisa musnah = قد ينقرض النمر الملطّخ.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: dibatalin = dibatalkan، gara-gara = karena، dipadamin = dipadamkan، soalnya = karena، terus = lalu، buat = untuk.
      en: |
        bara = embers: a peat fire keeps burning as embers underground.
        padam = to go out (listrik padam = power cut); memadamkan = to put out.
        karbon = carbon, atmosfer = atmosphere.
        musibah = disaster, calamity, gawat = critical, serious: Gawat! = this is bad!
        musnah = to be wiped out: macan dahan bisa musnah = the clouded leopard could die out.
        The dialogue uses street forms; the formal ones are beside them: dibatalin = dibatalkan, gara-gara = karena, dipadamin = dipadamkan, soalnya = karena, terus = lalu, buat = untuk.
    examples:
      - text: Api di permukaan sudah padam, tetapi bara masih menyala di bawah tanah.
        ar_eg: النار اللي فوق اتطفت، بس الجمر لسه والع تحت الأرض.
        ar: انطفأت النار على السطح، لكن الجمر ما زال مشتعلًا تحت الأرض.
        en: The fire on the surface is out, but embers still burn underground.
      - text: Gambut yang terbakar melepaskan banyak karbon ke atmosfer.
        ar_eg: الخث اللي بيتحرق بيطلّع كربون كتير في الجو.
        ar: يطلق الخث المحترق كثيرًا من الكربون في الغلاف الجوي.
        en: Burning peat releases a lot of carbon into the atmosphere.
      - text: Kalau hutan habis, macan dahan bisa musnah.
        ar_eg: لو الغابة خلصت، النمر الملطخ ممكن ينقرض.
        ar: إن زالت الغابة فقد ينقرض النمر الملطّخ.
        en: If the forest is gone, the clouded leopard could be wiped out.
