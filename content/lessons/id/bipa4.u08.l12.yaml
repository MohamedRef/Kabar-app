schema: kabar.lesson/v1
id: bipa4.u08.l12
language: id
title: Nelayan dan ikan ajaib
can_do:
  ar_eg: تسمع آخر حكاية وتفهم الحبكة والعبرة.
  ar: أن تستمع إلى نهاية حكاية وتفهم حبكتها وعبرتها.
  en: Listen to the end of a tale and follow its plot and moral.
slides:
  - title: Akhir cerita
    body:
      ar_eg: |
        فاكر الصياد العجوز والسمكة السحرية؟ Mas Rizal بيحكي آخر الحكاية. اسمع الأول.
        دوّر على المشكلة (konflik) والعبرة (amanat).
      ar: |
        أتذكر الصياد العجوز والسمكة السحرية؟ يروي Mas Rizal نهاية الحكاية. استمع أولًا.
        ابحث عن العقدة (konflik) والعبرة (amanat).
      en: |
        Remember the old fisherman and the magic fish? Mas Rizal tells the end of the story. Listen first.
        Look for the conflict (konflik) and the moral (amanat).
    examples:
      - text: Ikan ajaib itu berkata, 'Aku akan memberimu emas, tetapi jangan ceritakan rahasia ini kepada siapa pun.'
        ar_eg: "السمكة السحرية قالت: «هديك دهب، بس ما تحكيش السر ده لأي حد.»"
        ar: "قالت السمكة السحرية: «سأعطيك ذهبًا، لكن لا تخبر أحدًا بهذا السر.»"
        en: The magic fish said, 'I will give you gold, but don't tell this secret to anyone.'
      - text: Nelayan tua itu menjadi kaya. Tetapi suatu malam, dia menceritakan rahasia itu kepada tetangganya.
        ar_eg: الصياد العجوز بقى غني. بس في ليلة من الليالي، حكى السر لجاره.
        ar: صار الصياد العجوز غنيًا، لكنه في إحدى الليالي أخبر جاره بالسر.
        en: The old fisherman became rich. But one night he told the secret to his neighbour.
      - text: Keesokan harinya, semua emasnya hilang. Nelayan itu sangat menyesal karena dia melanggar janjinya.
        ar_eg: تاني يوم، الدهب كله اختفى. والصياد ندم جدًا عشان خلف وعده.
        ar: في اليوم التالي اختفى ذهبه كله، فندم الصياد ندمًا شديدًا لأنه نقض وعده.
        en: The next day, all his gold was gone. The fisherman deeply regretted breaking his promise.
exercises:
  - id: e01
    type: listen
    text: Aku akan memberimu emas, tetapi jangan ceritakan rahasia ini kepada siapa pun.
    question:
      ar_eg: السمكة وعدت الصياد بإيه؟
      ar: بمَ وعدت السمكة الصياد؟
      en: What did the fish promise the fisherman?
    options: [Emas, Perahu baru, Banyak ikan]
    answer: 0
    meaning:
      ar_eg: هديك دهب، بس ما تحكيش السر ده لأي حد.
      ar: سأعطيك ذهبًا، لكن لا تخبر أحدًا بهذا السر.
      en: I will give you gold, but don't tell this secret to anyone.
    words: [ajaib, rahasia]
  - id: e02
    type: listen
    text: Suatu malam, dia menceritakan rahasia itu kepada tetangganya.
    question:
      ar_eg: الصياد حكى السر لمين؟
      ar: لمن أفشى الصياد السر؟
      en: Who did the fisherman tell the secret to?
    options: [Kepada kepala desa, Kepada tetangganya, Kepada anaknya]
    answer: 1
    meaning:
      ar_eg: في ليلة من الليالي، حكى السر لجاره.
      ar: في إحدى الليالي أخبر جاره بالسر.
      en: One night he told the secret to his neighbour.
    words: [suatu, rahasia]
  - id: e03
    type: listen
    text: Keesokan harinya, semua emasnya hilang.
    question:
      ar_eg: إيه اللي حصل تاني يوم؟
      ar: ماذا حدث في اليوم التالي؟
      en: What happened the next day?
    options:
      - Ikan ajaib itu kembali.
      - Dia menjadi lebih kaya.
      - Semua emasnya hilang.
    answer: 2
    meaning:
      ar_eg: تاني يوم، الدهب كله اختفى.
      ar: في اليوم التالي اختفى ذهبه كله.
      en: The next day, all his gold was gone.
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إيه عبرة الحكاية؟
      ar: ما عبرة الحكاية؟
      en: What is the moral of the story?
    options:
      - Jangan melanggar janji.
      - Jangan memancing di laut.
      - Jangan menolong tetangga.
    answer: 0
    words: [amanat, melanggar]
    explain:
      ar_eg: "العبرة: jangan melanggar janji = ماتخلفش وعدك. القصة مش عن الصيد ولا عن إنك ماتساعدش جارك."
      ar: "العبرة: jangan melanggar janji = لا تنقض وعدك، فالقصة ليست عن الصيد ولا عن ترك مساعدة الجار."
      en: The moral is jangan melanggar janji, don't break a promise. It isn't about fishing or refusing to help neighbours.
  - id: e05
    type: match_pairs
    pairs:
      - text: ajaib
        ar_eg: سحري / عجيب
        ar: سحري / عجيب
        en: magical
      - text: melanggar
        ar_eg: يخالف / يخلف (وعد)
        ar: ينقض / يخالف
        en: break (a promise, a rule)
      - text: menyesal
        ar_eg: يندم
        ar: يندم
        en: regret
      - text: amanat
        ar_eg: العبرة
        ar: العبرة / المغزى
        en: moral message
      - text: nelayan
        ar_eg: صياد سمك
        ar: صيّاد سمك
        en: fisherman
    words: [ajaib, melanggar, menyesal, amanat, nelayan]
  - id: e06
    type: dictation
    text: Nelayan itu sangat menyesal.
    meaning:
      ar_eg: الصياد ده ندم جدًا.
      ar: ندم ذلك الصياد ندمًا شديدًا.
      en: The fisherman deeply regretted it.
    words: [menyesal, nelayan]
  - id: e07
    type: fill_blank
    sentence: Nelayan itu menyesal karena dia ___ janjinya.
    meaning:
      ar_eg: الصياد ندم عشان خلف وعده.
      ar: ندم الصياد لأنه نقض وعده.
      en: The fisherman regretted it because he broke his promise.
    options: [menuntun, menertawakan, melanggar]
    answers: [melanggar]
    words: [melanggar]
    explain:
      ar_eg: melanggar janji = خلف الوعد. menuntun = يشد ويمشّي، وmenertawakan = يضحك على.
      ar: melanggar janji = نقض الوعد. أما menuntun فيقود، وmenertawakan يضحك على.
      en: melanggar janji means break a promise. menuntun is to lead, and menertawakan is to laugh at.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الصياد حكى السر لجاره.
      ar: أخبر الصياد جاره بالسر.
      en: The fisherman told the secret to his neighbour.
    answers:
      - Nelayan itu menceritakan rahasia itu kepada tetangganya.
      - Nelayan itu menceritakan rahasia itu pada tetangganya.
      - Nelayan itu menceritakan rahasianya kepada tetangganya.
      - Nelayan itu menceritakan rahasia itu kepada tetangga.
      - Nelayan menceritakan rahasia itu kepada tetangganya.
      - Nelayan itu menceritakan rahasia kepada tetangganya.
    words: [nelayan, rahasia]
  - id: e09
    type: multiple_choice
    question: Suatu hari, nelayan itu menangkap ikan ajaib.
    question_meaning:
      ar_eg: ده حصل إمتى؟
      ar: متى حدث ذلك؟
      en: When did this happen?
    options: ['Pada satu hari, dulu.', 'Setiap hari.', 'Kemarin pagi.']
    answer: 0
    explain:
      ar_eg: suatu hari = في يوم من الأيام، أول الحواديت.
      ar: suatu hari = ذات يوم، بداية الحكايات.
      en: suatu hari = one day, the classic story opener.
    words: [suatu, ajaib]
  - id: e10
    type: fill_blank
    sentence: ___ malam, dia bercerita kepada tetangganya.
    meaning:
      ar_eg: في ليلة، حكى لجاره.
      ar: ذات ليلة حكى لجاره.
      en: One night, he told his neighbour.
    options: [Suatu, Setiap, Semua]
    answers: [Suatu]
    words: [suatu]
    explain:
      ar_eg: suatu malam = في ليلة من الليالي، مرة واحدة. setiap = كل، وsemua = كل الـ، ومش لحدث حصل مرة.
      ar: suatu malam = ذات ليلة، أي مرة واحدة. أما setiap فكل، وsemua جميع، ولا تناسبان حدثًا وقع مرة.
      en: suatu malam means "one night", a single time. setiap (every) and semua (all) don't fit a one-off event.
dialogue:
  title: Cerita yang sedih
  lines:
    - speaker: Mohamed
      text: Mas, akhir cerita nelayan itu sedih banget.
      ar_eg: يا Mas، آخر حكاية الصياد حزين جدًا.
      ar: يا Mas، نهاية حكاية الصياد حزينة جدًا.
      en: Mas, the end of the fisherman's story is so sad.
    - speaker: Mas Rizal
      text: Iya. Dia melanggar janjinya ke ikan ajaib.
      ar_eg: أيوه. خلف وعده للسمكة السحرية.
      ar: نعم، فقد نقض وعده للسمكة السحرية.
      en: Yes. He broke his promise to the magic fish.
    - speaker: Mohamed
      text: Kalau aku jadi nelayan itu, aku nggak bakal cerita ke siapa pun.
      ar_eg: لو كنت مكان الصياد ده، ماكنتش هحكي لأي حد.
      ar: لو كنت مكان ذلك الصياد لما أخبرت أحدًا.
      en: If I were that fisherman, I wouldn't tell anyone.
    - speaker: Mas Rizal
      text: Ha-ha, itu kan cuma kata-kata! Menyimpan rahasia itu berat.
      ar_eg: هههه، ده كلام وبس! شيل السر صعب.
      ar: هذا مجرد كلام! حفظ السر صعب.
      en: Ha ha, those are just words! Keeping a secret is hard.
    - speaker: Mohamed
      text: Bener juga. Amanatnya, jangan melanggar janji.
      ar_eg: "عندك حق. العبرة: ما تخلفش وعدك."
      ar: "معك حق. العبرة: لا تنقض وعدك."
      en: True enough. The moral is, don't break a promise.
new_words:
  - word: suatu
    pos: determiner
    ar_eg: في يوم / في مرة (suatu hari = في يوم من الأيام)
    ar: ذات (suatu hari = ذات يوم)
    en: one, a certain (suatu hari = one day)
  - word: rahasia
    pos: noun
    ar_eg: سر
    ar: سرّ
    en: secret
