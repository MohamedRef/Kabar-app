schema: kabar.lesson/v1
id: bipa5.u10.l07
language: id
title: Membaca grafik penjualan
can_do:
  ar_eg: 'توصف رسم بياني: الحجم والمقارنة، الأكتر والأقل، الاتجاه العام، ومتناسب مع، ونطاق، وبتستند لمصدر.'
  ar: 'أن تصف رسمًا بيانيًا: الحجم والمقارنة، والأكثر والأدنى، والاتجاه العام، والتناسب، والنطاق، والإحالة إلى المصادر.'
  en: 'Describe a chart: volume and comparison, the most and the lowest, the overall trend, proportionality, radius, and citing sources.'
slides:
  - title: Bahasa data
    body:
      ar_eg: |
        volume = حجم، كمية (volume penjualan = حجم المبيعات)، perbandingan = مقارنة، نسبة.
        terbanyak = الأكتر، terendah = الأقل، الأوطى.
        kecenderungan = اتجاه عام، ميل: kecenderungannya naik = الاتجاه طالع.
        sebanding = متناسب، يستاهل (sebanding dengan = متناسب مع)، radius = نطاق، نصف قطر (radius 5 km).
        mengacu pada = بيستند لـ، بيشير لـ: Data ini mengacu pada laporan BPS.
      ar: |
        volume = حجم، كمية (volume penjualan = حجم المبيعات)، perbandingan = مقارنة، نسبة.
        terbanyak = الأكثر، terendah = الأدنى.
        kecenderungan = اتجاه عام، ميل: kecenderungannya naik = الاتجاه صاعد.
        sebanding = متناسب، يوازي (sebanding dengan = متناسب مع)، radius = نطاق، نصف قطر (radius 5 km).
        mengacu pada = يستند إلى، يشير إلى: Data ini mengacu pada laporan BPS.
      en: |
        volume = volume (volume penjualan = sales volume), perbandingan = comparison, ratio.
        terbanyak = the most, terendah = the lowest.
        kecenderungan = tendency, trend: kecenderungannya naik = the trend is upward.
        sebanding = proportional, worth it (sebanding dengan = in proportion to), radius = radius (radius 5 km).
        mengacu pada = to refer to, be based on: Data ini mengacu pada laporan BPS.
    examples:
      - text: Volume penjualan terbanyak terjadi pada bulan Desember.
        ar_eg: أكبر حجم مبيعات كان في شهر ديسمبر.
        ar: سُجّل أعلى حجم مبيعات في شهر ديسمبر.
        en: The highest sales volume was in December.
      - text: Kecenderungan harga naik sejak awal tahun.
        ar_eg: الأسعار ماشية في اتجاه طالع من أول السنة.
        ar: يتّجه السعر إلى الارتفاع منذ بداية العام.
        en: Prices have trended upward since the start of the year.
      - text: Angka ini mengacu pada survei di radius lima kilometer.
        ar_eg: الرقم ده مبني على استطلاع في نطاق خمسة كيلو.
        ar: يستند هذا الرقم إلى مسح في نطاق خمسة كيلومترات.
        en: This figure is based on a survey within a five-kilometre radius.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: volume
        ar_eg: حجم، كمية
        ar: حجم
        en: volume
      - text: perbandingan
        ar_eg: مقارنة
        ar: مقارنة
        en: comparison
      - text: terbanyak
        ar_eg: الأكتر
        ar: الأكثر
        en: the most
      - text: terendah
        ar_eg: الأقل
        ar: الأدنى
        en: the lowest
    words: [volume, perbandingan, terbanyak, terendah]
  - id: e02
    type: match_pairs
    pairs:
      - text: kecenderungan
        ar_eg: اتجاه عام
        ar: اتجاه عام
        en: trend
      - text: sebanding
        ar_eg: متناسب
        ar: متناسب
        en: proportional
      - text: radius
        ar_eg: نطاق
        ar: نطاق، نصف قطر
        en: radius
      - text: mengacu
        ar_eg: بيستند لـ
        ar: يستند إلى
        en: to refer to
    words: [kecenderungan, sebanding, radius, mengacu]
  - id: e03
    type: listen
    text: Penjualan terendah terjadi pada bulan Februari.
    question:
      ar_eg: أقل مبيعات كانت إمتى؟
      ar: متى كانت أدنى المبيعات؟
      en: When were sales lowest?
    options: [فبراير, ديسمبر, مايو]
    answer: 0
    meaning:
      ar_eg: أقل مبيعات كانت في شهر فبراير.
      ar: سُجّلت أدنى المبيعات في فبراير.
      en: The lowest sales were in February.
    words: [terendah]
  - id: e04
    type: fill_blank
    sentence: Data dalam laporan ini ___ pada sensus tahun 2020.
    meaning:
      ar_eg: الداتا في التقرير ده ___ على تعداد سنة ألفين وعشرين.
      ar: تـ___ بيانات هذا التقرير إلى تعداد عام 2020.
      en: The data in this report ___ to the 2020 census.
    options: [mengacu, sebanding, volume]
    answers: [mengacu]
    words: [mengacu, sebanding, volume]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الخط في الجراف بيطلع من سنين. ده اسمه إيه؟
      ar: الخط في الرسم البياني يصعد منذ سنوات. ماذا نسمّي ذلك؟
      en: The line on the chart has been rising for years. What is that called?
    options: [radius, kecenderungan, terbanyak]
    answer: 1
    explain:
      ar_eg: kecenderungan naik = اتجاه طالع.
      ar: kecenderungan naik = اتجاه صاعد.
      en: kecenderungan naik = upward trend.
    words: [radius, kecenderungan, terbanyak]
  - id: e06
    type: fill_blank
    sentence: Gajinya tidak ___ dengan kerja kerasnya.
    meaning:
      ar_eg: مرتبه مش ___ مع تعبه.
      ar: راتبه لا يـ___ مع جهده.
      en: His pay isn't ___ to how hard he works.
    options: [sebanding, terendah, perbandingan]
    answers: [sebanding]
    words: [sebanding, terendah, perbandingan]
  - id: e07
    type: multiple_choice
    question: Ojek ini hanya melayani pesanan dalam ___ tiga kilometer.
    options: [volume, perbandingan, radius]
    answer: 2
    explain:
      ar_eg: radius = نطاق.
      ar: radius = نطاق، نصف قطر.
      en: radius = radius.
    words: [volume, perbandingan, radius]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المقارنة دي بتوري فرق كبير.
      ar: تُظهر هذه المقارنة فرقًا كبيرًا.
      en: This comparison shows a big difference.
    answer: Perbandingan ini menunjukkan perbedaan besar.
    distractors: [volume, radius]
    words: [perbandingan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Volume penjualan terbanyak terjadi pada bulan Desember.
    answers_meaning:
      ar_eg: [أكبر حجم مبيعات كان في ديسمبر, أكتر مبيعات كانت في شهر ديسمبر]
      ar: [سُجّل أعلى حجم مبيعات في ديسمبر, كان أكبر حجم للمبيعات في شهر ديسمبر]
      en: [The highest sales volume was in December, Sales volume peaked in December]
    words: [volume, terbanyak]
  - id: e10
    type: speaking
    text: Kecenderungannya naik, dan datanya mengacu pada survei toko.
    meaning:
      ar_eg: الاتجاه طالع، والداتا مبنية على استطلاع للمحلات.
      ar: الاتجاه صاعد، والبيانات تستند إلى مسح للمتاجر.
      en: The trend is upward, and the data is based on a shop survey.
    words: [kecenderungan, mengacu]
dialogue:
  lines:
    - speaker: Rina
      text: Grafik ini menunjukkan penjualan kopi kita selama satu tahun.
      ar_eg: الجراف ده بيوري مبيعات القهوة بتاعتنا على مدار سنة.
      ar: يُظهر هذا الرسم البياني مبيعات قهوتنا خلال عام.
      en: This chart shows our coffee sales over a year.
    - speaker: Mohamed
      text: Volume terbanyak di bulan Desember, ya? Mungkin karena liburan.
      ar_eg: أكبر حجم في ديسمبر؟ يمكن عشان الإجازات.
      ar: أعلى حجم في ديسمبر، صحيح؟ ربما بسبب العطلات.
      en: The highest volume is in December, right? Maybe because of the holidays.
    - speaker: Rina
      text: Betul. Yang terendah bulan puasa. Tapi kecenderungannya tetap naik.
      ar_eg: مظبوط. والأقل في رمضان. بس الاتجاه العام برضه طالع.
      ar: صحيح. والأدنى في رمضان، لكن الاتجاه العام يبقى صاعدًا.
      en: Right. The lowest is Ramadan. But the overall trend is still upward.
    - speaker: Mohamed
      text: Data pelanggannya mengacu pada survei apa?
      ar_eg: داتا العملا دي مبنية على أنهي استطلاع؟
      ar: إلى أي مسح تستند بيانات العملاء؟
      en: Which survey is the customer data based on?
    - speaker: Rina
      text: Survei toko dalam radius sepuluh kilometer dari kantor.
      ar_eg: استطلاع للمحلات في نطاق عشرة كيلو من المكتب.
      ar: مسح للمتاجر في نطاق عشرة كيلومترات من المكتب.
      en: A survey of shops within ten kilometres of the office.
    - speaker: Mohamed
      text: Kalau begitu, perbandingan dengan kota lain belum adil.
      ar_eg: يبقى المقارنة مع مدن تانية لسه مش عادلة.
      ar: إذن ليست المقارنة مع المدن الأخرى عادلة بعد.
      en: Then comparing with other cities isn't fair yet.
