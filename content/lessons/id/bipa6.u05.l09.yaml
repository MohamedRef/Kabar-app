schema: kabar.lesson/v1
id: bipa6.u05.l09
language: id
title: Setelah gelombang
can_do:
  ar_eg: تقرا شهادة ناجي من التسونامي وتتكلم عن الإخلاء والحطام والمساعدة من العالم كله.
  ar: أن تقرأ شهادة ناجٍ من التسونامي وتتحدث عن الإخلاء والحطام ومساعدة العالم.
  en: Read a tsunami survivor's account and talk about evacuation, debris and help from around the world.
slides:
  - title: Kesaksian
    body:
      ar_eg: |
        شهادة (مكتوبة للدرس) عن 26 ديسمبر 2004:
        kepanikan = هلع، ذعر (من panik). dievakuasi = اتنقلوا لمكان آمن، اتجلوا.
        roboh = وقع، اتهد (rumah roboh). puing = أنقاض، ردم. serpihan = شظايا، حتت صغيرة (serpihan kaca).
        tergeletak = مرمي على الأرض. longsor = انهيار أرضي، انزلاق تربة (tanah longsor).
        sedunia = العالم كله (bantuan dari seluruh dunia = bantuan sedunia).
      ar: |
        شهادة (مكتوبة للدرس) عن 26 ديسمبر 2004:
        kepanikan = هلع، ذعر (من panik). dievakuasi = أُجلُوا إلى مكان آمن.
        roboh = انهار، تهدّم (rumah roboh). puing = أنقاض، ركام. serpihan = شظايا، قطع صغيرة (serpihan kaca).
        tergeletak = ملقى على الأرض. longsor = انهيار أرضي (tanah longsor).
        sedunia = العالم كله (أي من كل أنحاء العالم).
      en: |
        A testimony (written for the lesson) about 26 December 2004:
        kepanikan = panic (from panik). dievakuasi = to be evacuated.
        roboh = to collapse (rumah roboh). puing = rubble, ruins. serpihan = fragments, shards (serpihan kaca).
        tergeletak = lying (on the ground). longsor = landslide (tanah longsor).
        sedunia = worldwide, all over the world.
    examples:
      - text: Setelah gempa, kepanikan terjadi di mana-mana.
        ar_eg: بعد الزلزال، الهلع كان في كل حتة.
        ar: بعد الزلزال عمّ الهلع في كل مكان.
        en: After the quake, there was panic everywhere.
      - text: Ribuan rumah roboh; jalan penuh puing.
        ar_eg: آلاف البيوت اتهدت؛ والشوارع مليانة ردم.
        ar: انهارت آلاف البيوت؛ وامتلأت الطرق بالأنقاض.
        en: Thousands of houses collapsed; the roads were full of rubble.
      - text: Bantuan datang dari relawan sedunia.
        ar_eg: المساعدة جت من متطوعين من العالم كله.
        ar: جاءت المساعدة من متطوعين من أنحاء العالم.
        en: Help came from volunteers worldwide.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kepanikan
        ar_eg: هلع
        ar: هلع، ذعر
        en: panic
      - text: dievakuasi
        ar_eg: اتجلوا
        ar: أُجلُوا
        en: to be evacuated
      - text: roboh
        ar_eg: اتهد
        ar: انهار
        en: to collapse
      - text: puing
        ar_eg: ردم، أنقاض
        ar: أنقاض
        en: rubble
    words: [kepanikan, dievakuasi, roboh, puing]
  - id: e02
    type: match_pairs
    pairs:
      - text: serpihan
        ar_eg: شظايا
        ar: شظايا
        en: fragments
      - text: tergeletak
        ar_eg: مرمي على الأرض
        ar: ملقى
        en: lying
      - text: longsor
        ar_eg: انهيار أرضي
        ar: انهيار أرضي
        en: landslide
      - text: sedunia
        ar_eg: العالم كله
        ar: العالم كله
        en: worldwide
    words: [serpihan, tergeletak, longsor, sedunia]
  - id: e03
    type: listen
    text: Warga desa dievakuasi ke masjid sebelum air naik.
    question:
      ar_eg: حصل إيه لأهل القرية؟
      ar: ماذا حدث لأهل القرية؟
      en: What happened to the villagers?
    options: [اتنقلوا للجامع, رجعوا بيوتهم, ناموا في الشارع]
    answer: 0
    meaning:
      ar_eg: أهل القرية اتنقلوا للجامع قبل ما الميه تعلى.
      ar: أُجلي أهل القرية إلى المسجد قبل ارتفاع الماء.
      en: The villagers were evacuated to the mosque before the water rose.
    words: [dievakuasi]
  - id: e04
    type: fill_blank
    sentence: Hujan deras tiga hari membuat tanah ___ di bukit itu.
    meaning:
      ar_eg: المطر الجامد تلات أيام عمل ___ على التل ده.
      ar: سبّب المطر الغزير ثلاثة أيام ___ على ذلك التل.
      en: Three days of heavy rain caused a ___ on that hill.
    options: [longsor, puing, sedunia]
    answers: [longsor]
    words: [longsor, puing, sedunia]
    explain:
      ar_eg: "المطر خلّى الأرض تنهار: longsor (انهيار أرضي). puing = ركام وsedunia = العالم كله."
      ar: جعل المطر التربة تنهار longsor؛ أمّا puing فأنقاض، وsedunia العالم كلّه.
      en: The rain caused a landslide, longsor. puing is rubble, and sedunia worldwide.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الناس بتحس بإيه لما تسمع صفارة إنذار فجأة؟
      ar: ماذا يصيب الناس حين يسمعون صفّارة إنذار فجأة؟
      en: What grips people when a siren sounds suddenly?
    options: [serpihan, kepanikan, longsor]
    answer: 1
    explain:
      ar_eg: kepanikan = هلع، من panik.
      ar: kepanikan = هلع، من panik.
      en: kepanikan = panic, from panik.
    words: [kepanikan, serpihan, longsor]
  - id: e06
    type: fill_blank
    sentence: Hati-hati! Ada ___ kaca di lantai.
    meaning:
      ar_eg: خلي بالك! فيه ___ إزاز على الأرض.
      ar: انتبه! هناك ___ زجاج على الأرض.
      en: Careful! There are glass ___ on the floor.
    options: [serpihan, kepanikan, roboh]
    answers: [serpihan]
    words: [serpihan, kepanikan, roboh]
    explain:
      ar_eg: «شظايا إزاز» = serpihan kaca. kepanikan = ذعر وroboh = اتهدّ، ومش حاجة على الأرض.
      ar: «شظايا زجاج» serpihan kaca؛ أمّا kepanikan فذعر، وroboh انهار.
      en: "\"Glass shards\" is serpihan kaca. kepanikan is panic, and roboh means collapsed."
  - id: e07
    type: multiple_choice
    question: Masjid Baiturrahman tidak ___ saat tsunami 2004.
    options: [tergeletak, dievakuasi, roboh]
    answer: 2
    explain:
      ar_eg: 'الجامع ما اتهدّش: tidak roboh. وفعلًا جامع بيت الرحمن صمد في تسونامي 2004.'
      ar: 'لم ينهَر المسجد: tidak roboh. وقد صمد مسجد بيت الرحمن في تسونامي 2004.'
      en: 'The mosque didn''t collapse: tidak roboh. Baiturrahman did survive the 2004 tsunami.'
    words: [roboh, tergeletak, dievakuasi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المركب فضل مرمي فوق سطح بيت.
      ar: ظلّ القارب ملقى فوق سطح بيت.
      en: The boat lay on top of a house roof.
    answer: Perahu itu tergeletak di atas atap rumah.
    distractors: [puing, roboh]
    words: [tergeletak]
    explain:
      ar_eg: «مرمي/مستقر» = tergeletak و«فوق سقف» = di atas atap. puing وroboh مش في المعنى.
      ar: «مطروح» tergeletak و«فوق سقف» di atas atap؛ أمّا puing وroboh فليستا في المعنى.
      en: "\"Lay\" is tergeletak and \"on top of a roof\" is di atas atap. puing and roboh aren't in the meaning."
  - id: e09
    type: translate
    direction: from_target
    source_text: Relawan sedunia membersihkan puing selama berbulan-bulan.
    answers_meaning:
      ar_eg: [متطوعين من العالم كله شالوا الردم شهور, متطوعين من كل حتة في العالم نضّفوا الأنقاض شهور]
      ar: [أزال متطوعون من أنحاء العالم الأنقاض شهورًا]
      en: [Volunteers from around the world cleared the rubble for months, Worldwide volunteers cleaned up the debris for months]
    words: [sedunia, puing]
  - id: e10
    type: speaking
    text: Jangan panik. Kepanikan membuat kita lupa jalan evakuasi.
    meaning:
      ar_eg: ما تتخضّش. الهلع بيخلينا ننسى طريق الإخلاء.
      ar: لا تذعر. الهلع ينسينا طريق الإخلاء.
      en: Don't panic. Panic makes us forget the evacuation route.
    words: [kepanikan]
dialogue:
  lines:
    - speaker: Kak Rahmah
      text: Pagi itu, setelah gempa, air laut tiba-tiba surut. Lalu datang kepanikan.
      ar_eg: الصبح ده، بعد الزلزال، البحر انسحب فجأة. وبعدين جه الهلع.
      ar: ذلك الصباح، بعد الزلزال، انحسر البحر فجأة. ثم جاء الهلع.
      en: That morning, after the quake, the sea suddenly drew back. Then came panic.
    - speaker: Mohamed
      text: Keluarga Kakak dievakuasi ke mana?
      ar_eg: عيلتك اتنقلت فين؟
      ar: إلى أين أُجليت أسرتك؟
      en: Where was your family evacuated to?
    - speaker: Kak Rahmah
      text: Ke Masjid Baiturrahman. Rumah kami roboh, tapi masjid itu tetap berdiri.
      ar_eg: لجامع بيت الرحمن. بيتنا اتهد، بس الجامع فضل واقف.
      ar: إلى مسجد بيت الرحمن. انهار بيتنا، لكن المسجد ظلّ قائمًا.
      en: To Baiturrahman Mosque. Our house collapsed, but the mosque stood.
    - speaker: Mohamed
      text: Saya pernah melihat foto kapal yang tergeletak di atas rumah.
      ar_eg: أنا شفت صورة مركب مرمي فوق بيت.
      ar: رأيت صورة سفينة ملقاة فوق بيت.
      en: I once saw a photo of a ship lying on top of a house.
    - speaker: Kak Rahmah
      text: Itu di Lampulo. Dari puing itu, kami bangkit dengan bantuan sedunia.
      ar_eg: ده في لامبولو. ومن الردم ده، قمنا تاني بمساعدة العالم كله.
      ar: ذلك في لامبولو. ومن تلك الأنقاض نهضنا بمساعدة العالم كله.
      en: That's in Lampulo. From that rubble, we rose again with help from the whole world.
