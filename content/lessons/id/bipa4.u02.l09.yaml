schema: kabar.lesson/v1
id: bipa4.u02.l09
language: id
title: Surat dari warga Maros
can_do:
  ar_eg: تقرا رسالة قارئ منشورة في الجرنال وتفهم المشكلة والطلب.
  ar: أن تقرأ رسالة قارئ منشورة في صحيفة وتفهم المشكلة والطلب.
  en: Read a published reader's letter and pick out the problem and the request.
slides:
  - title: Surat pembaca di koran
    body:
      ar_eg: |
        دي رسالة Bu Hasnah اللي اتنشرت في جرنال Kabar Sulawesi.
        دوّر على ٣ حاجات: المشكلة، الناس عملوا إيه، وبيطلبوا إيه.
      ar: |
        هذه رسالة Bu Hasnah التي نُشرت في صحيفة Kabar Sulawesi.
        ابحث عن ثلاثة أمور: المشكلة، وما فعله السكان، وما يطلبونه.
      en: |
        This is Bu Hasnah's letter, printed in the Kabar Sulawesi newspaper.
        Look for three things: the problem, what residents did, and what they ask for.
    examples:
      - text: Yth. Redaksi Kabar Sulawesi, saya warga Desa Salenrang, Maros. Saluran air di depan sekolah kami tersumbat oleh sampah dan dedaunan.
        ar_eg: حضرات هيئة تحرير Kabar Sulawesi، أنا من سكان قرية سالنرانج في ماروس. مجرى المية اللي قدام مدرستنا مسدود بالزبالة وورق الشجر.
        ar: السادة هيئة تحرير Kabar Sulawesi المحترمون، أنا من سكان قرية سالنرانج في ماروس. قناة الصرف أمام مدرستنا مسدودة بالقمامة وأوراق الشجر.
        en: Dear Editors of Kabar Sulawesi, I am a resident of Salenrang village, Maros. The drain in front of our school is blocked by rubbish and leaves.
      - text: Setiap hujan, jalan di depan sekolah banjir. Warga sudah kerja bakti, tetapi saluran itu cepat tersumbat lagi.
        ar_eg: كل ما تمطر، الشارع اللي قدام المدرسة بيغرق. الأهالي عملوا يوم شغل جماعي، بس المجرى بيتسد تاني بسرعة.
        ar: كلما أمطرت غمرت المياه الطريق أمام المدرسة. وقد قام السكان بعمل تطوعي جماعي، لكن القناة تُسدّ مجددًا بسرعة.
        en: Every time it rains, the road in front of the school floods. Residents have done a community clean-up, but the drain soon gets blocked again.
      - text: Kami mohon pemerintah daerah segera memperbaiki saluran air ini sebaik-baiknya.
        ar_eg: بنرجو من الحكومة المحلية تصلّح مجرى المية ده فورًا وعلى أحسن وجه.
        ar: نرجو من الحكومة المحلية إصلاح قناة الصرف هذه فورًا وعلى أفضل وجه.
        en: We ask the local government to repair this drain right away, and as well as possible.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: إيه المشكلة اللي في الرسالة؟
      ar: ما المشكلة المذكورة في الرسالة؟
      en: What problem is the letter about?
    options:
      - Jalan desa berlubang.
      - Saluran air di depan sekolah tersumbat.
      - Truk tambang terlalu bising.
    answer: 1
    words: [tersumbat]
    explain:
      ar_eg: الجواب عن قناية المية اللي قدام المدرسة واللي اتسدّت (tersumbat). الطريق المحفّر والتراكات المزعجة مشاكل تانية من الوحدة.
      ar: الرسالة عن قناة الماء أمام المدرسة وقد انسدّت (tersumbat). أما الطريق المحفّر والشاحنات المزعجة فمشكلات أخرى في الوحدة.
      en: The letter is about the blocked (tersumbat) drain outside the school. The potholed road and noisy trucks are other problems from this unit.
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الأهالي عملوا إيه قبل كده؟
      ar: ماذا فعل السكان من قبل؟
      en: What have the residents already done?
    options:
      - Melapor ke kepala desa.
      - Pindah ke kota.
      - Kerja bakti.
    answer: 2
    explain:
      ar_eg: «Warga sudah kerja bakti» = الأهالي نضّفوا مع بعض، بس المشكلة رجعت.
      ar: «Warga sudah kerja bakti» أي نظّف السكان معًا، لكن المشكلة عادت.
      en: "“Warga sudah kerja bakti”: residents cleaned up together, but the problem came back."
    words: [kerja bakti]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الرسالة مبعوتة لمين؟
      ar: إلى من وُجّهت الرسالة؟
      en: Who is the letter addressed to?
    options:
      - Redaksi Kabar Sulawesi
      - Kepala sekolah
      - Warga Desa Salenrang
    answer: 0
    explain:
      ar_eg: «Yth. Redaksi …» في الأول = الرسالة لهيئة تحرير الجرنال.
      ar: «Yth. Redaksi …» في البداية يعني أن الرسالة موجّهة إلى هيئة التحرير.
      en: “Yth. Redaksi …” at the top means it's addressed to the editors.
    words: [redaksi]
  - id: e04
    type: match_pairs
    pairs:
      - text: tersumbat
        ar_eg: مسدود
        ar: مسدود
        en: blocked, clogged
      - text: dedaunan
        ar_eg: ورق الشجر
        ar: أوراق الشجر
        en: leaves, foliage
      - text: kerja bakti
        ar_eg: يوم شغل جماعي تطوعي
        ar: عمل تطوعي جماعي
        en: community work day
      - text: redaksi
        ar_eg: هيئة التحرير
        ar: هيئة التحرير
        en: the editors
      - text: sebaik-baiknya
        ar_eg: على أحسن وجه
        ar: على أفضل وجه
        en: as well as possible
    words: [tersumbat, dedaunan, kerja bakti, redaksi, sebaik-baiknya]
  - id: e05
    type: listen
    text: Warga sudah kerja bakti, tetapi saluran itu cepat tersumbat lagi.
    options:
      - Warga sudah kerja bakti, tetapi saluran itu cepat diperbaiki lagi.
      - Warga sudah bolak-balik, tetapi saluran itu cepat tersumbat lagi.
      - Warga sudah kerja bakti, tetapi saluran itu cepat tersumbat lagi.
    answer: 2
    meaning:
      ar_eg: الأهالي عملوا يوم شغل جماعي، بس المجرى بيتسد تاني بسرعة.
      ar: قام السكان بعمل تطوعي جماعي، لكن القناة تُسدّ مجددًا بسرعة.
      en: Residents have done a community clean-up, but the drain soon gets blocked again.
    words: [kerja bakti, tersumbat]
  - id: e06
    type: fill_blank
    sentence: Kami mohon pemerintah daerah ___ memperbaiki saluran air ini.
    meaning:
      ar_eg: بنرجو من الحكومة المحلية تصلّح مجرى المية ده فورًا.
      ar: نرجو من الحكومة المحلية إصلاح قناة الصرف هذه فورًا.
      en: We ask the local government to repair this drain right away.
    options: [bolak-balik, segera, tolong-menolong]
    answers: [segera]
    words: [segera]
    explain:
      ar_eg: segera = فورًا، وبتيجي قبل الفعل memperbaiki. bolak-balik = رايح جاي، وtolong-menolong = يساعدوا بعض.
      ar: segera = فورًا، وتأتي قبل الفعل memperbaiki. أما bolak-balik فذهابًا وإيابًا، وtolong-menolong يتعاونون.
      en: segera means right away and comes before memperbaiki. bolak-balik is back and forth, and tolong-menolong is helping one another.
  - id: e07
    type: build_sentence
    source:
      ar_eg: مجرى المية اللي قدام المدرسة مسدود بالزبالة.
      ar: قناة الصرف أمام المدرسة مسدودة بالقمامة.
      en: The drain in front of the school is blocked by rubbish.
    answer: Saluran air di depan sekolah tersumbat oleh sampah.
    distractors: [pepohonan, bolak-balik]
    words: [tersumbat]
    explain:
      ar_eg: tersumbat oleh = مسدود بـ، والزبالة هي اللي سدّت القناية. pepohonan = شجر، وbolak-balik = رايح جاي.
      ar: tersumbat oleh = مسدود بـ، والقمامة هي ما سدّه. أما pepohonan فالأشجار، وbolak-balik ذهابًا وإيابًا.
      en: tersumbat oleh means blocked by; the rubbish blocked the drain. pepohonan are trees, and bolak-balik is back and forth.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كل ما تمطر، الشارع اللي قدام المدرسة بيغرق.
      ar: كلما أمطرت غمرت المياه الطريق أمام المدرسة.
      en: Every time it rains, the road in front of the school floods.
    answers:
      - Setiap hujan, jalan di depan sekolah banjir.
      - Setiap kali hujan, jalan di depan sekolah banjir.
      - Setiap turun hujan, jalan di depan sekolah banjir.
      - Setiap hujan, jalan di depan sekolah kebanjiran.
      - Kalau hujan, jalan di depan sekolah selalu banjir.
      - Jalan di depan sekolah banjir setiap hujan.
      - Jalan di depan sekolah banjir setiap kali hujan.
