dialogue:
  title: Surat Bu Hasnah di koran
  lines:
    - speaker: Pak Amir
      text: Mohamed, lihat! Surat Bu Hasnah masuk koran Kabar Sulawesi hari ini.
      ar_eg: يا Mohamed، بص! رسالة Bu Hasnah في جرنال Kabar Sulawesi النهارده.
      ar: يا Mohamed، انظر! رسالة Bu Hasnah منشورة في صحيفة Kabar Sulawesi اليوم.
      en: Mohamed, look! Bu Hasnah's letter is in Kabar Sulawesi today.
    - speaker: Mohamed
      text: Wah, cepet banget! Isinya soal saluran air di depan sekolah, kan?
      ar_eg: ياه، بسرعة كده! هي عن مجرى المية اللي قدام المدرسة، صح؟
      ar: يا للسرعة! موضوعها قناة الصرف أمام المدرسة، أليس كذلك؟
      en: Wow, that was quick! It's about the drain in front of the school, right?
    - speaker: Pak Amir
      text: Betul. Semoga pemerintah daerah segera memberi tanggapan.
      ar_eg: مظبوط. يا رب الحكومة المحلية ترد بسرعة.
      ar: صحيح. نرجو أن تردّ الحكومة المحلية قريبًا.
      en: Right. Let's hope the local government responds soon.
    - speaker: Mohamed
      text: Kalau belum ada tanggapan, kita kerja bakti lagi aja, Pak.
      ar_eg: ولو مفيش رد، نعمل يوم شغل جماعي تاني وخلاص يا أستاذ.
      ar: وإن لم يأتِ ردّ، فلنقم بعمل تطوعي جماعي مرة أخرى يا سيدي.
      en: If there's no response yet, we'll just do another clean-up day, sir.
    - speaker: Pak Amir
      text: Ha-ha, iya. Di sini warga emang selalu tolong-menolong.
      ar_eg: هههه، أيوه. إحنا هنا فعلًا عايشين بنساعد بعض.
      ar: نعم. فنحن هنا نعيش متعاونين حقًّا.
      en: Ha ha, yes. Here we really do live helping one another.
