    type: match_pairs
    pairs:
      - text: rincian
        ar_eg: تفاصيل
        ar: تفاصيل
        en: details
      - text: menentang
        ar_eg: يعارض
        ar: يعارض
        en: to oppose
      - text: prihatin
        ar_eg: زعلان / قلقان على
        ar: قلِق / متأسّف
        en: concerned
      - text: pujian
        ar_eg: مدح
        ar: مديح
        en: praise
