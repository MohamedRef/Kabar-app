schema: kabar.lesson/v1
id: bipa7.u10.l09
language: id
title: Kerja lapangan
can_do:
  ar_eg: تخطّط لبحث ميداني وتشرح إزاي هتتأكّد إن بياناتك سليمة.
  ar: أن تخطّط لبحث ميداني وتشرح كيف ستتحقّق من سلامة بياناتك.
  en: Plan fieldwork and explain how you'll make sure your data is sound.
slides:
  - title: Turun ke lapangan
    body:
      ar_eg: |
        قبل kerja lapangan (الشغل الميداني) لازم موافقة komite etik (لجنة الأخلاقيات).
        etnografi = تعيش وسط المجتمع وتلاحظ. كل يوم بتكتب catatan lapangan (ملاحظات ميدانية).
        wawancara mendalam = مقابلة متعمّقة، ساعة أو أكتر مع شخص واحد.
        triangulasi = تقارن مصادر مختلفة: المقابلة والملاحظة والوثائق.
        validitas = بياناتك بتقيس فعلًا اللي عايز تقيسه؟ reliabilitas = لو كرّرت القياس، هتطلع نفس النتيجة؟
      ar: |
        قبل kerja lapangan (العمل الميداني) لا بدّ من موافقة komite etik (لجنة الأخلاقيات).
        etnografi = أن تعيش وسط المجتمع وتلاحظ، وتكتب كلّ يوم catatan lapangan (مذكّرات ميدانية).
        wawancara mendalam = مقابلة معمّقة لساعة أو أكثر مع شخص واحد.
        triangulasi = المقارنة بين مصادر مختلفة: المقابلة والملاحظة والوثائق.
        validitas = هل تقيس بياناتك فعلًا ما تريد قياسه؟ reliabilitas = إن كرّرت القياس، هل تخرج النتيجة نفسها؟
      en: |
        Before kerja lapangan (fieldwork) you need approval from the komite etik (ethics committee).
        etnografi = living in a community and observing. Every day you write catatan lapangan (field notes).
        wawancara mendalam = an in-depth interview, an hour or more with one person.
        triangulasi = comparing different sources: interviews, observation, documents.
        validitas = does your data measure what you mean to measure? reliabilitas = repeat the measurement: same result?
    examples:
      - text: Kerja lapangan saya di Kampung Arborek berlangsung dua bulan.
        ar_eg: شغلي الميداني في قرية أربوريك استمرّ شهرين.
        ar: استمرّ عملي الميداني في قرية أربوريك شهرين.
        en: My fieldwork in Arborek village lasted two months.
      - text: Setiap malam dia menulis catatan lapangan.
        ar_eg: كل ليلة بيكتب ملاحظاته الميدانية.
        ar: يكتب مذكّراته الميدانية كلّ ليلة.
        en: Every night he writes his field notes.
      - text: Triangulasi meningkatkan validitas data.
        ar_eg: التثليث بيزوّد صدق البيانات.
        ar: يرفع التثليث صدق البيانات.
        en: Triangulation increases data validity.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kerja lapangan
        ar_eg: شغل ميداني
        ar: العمل الميداني
        en: fieldwork
      - text: catatan lapangan
        ar_eg: ملاحظات ميدانية
        ar: مذكّرات ميدانية
        en: field notes
      - text: etnografi
        ar_eg: إثنوغرافيا (دراسة مجتمع من جوّه)
        ar: الإثنوغرافيا
        en: ethnography
      - text: wawancara mendalam
        ar_eg: مقابلة متعمّقة
        ar: مقابلة معمّقة
        en: in-depth interview
    words: [kerja lapangan, catatan lapangan, etnografi, wawancara mendalam]
  - id: e02
    type: match_pairs
    pairs:
      - text: triangulasi
        ar_eg: تثليث (مقارنة أكتر من مصدر)
        ar: التثليث المنهجي
        en: triangulation
      - text: validitas
        ar_eg: صدق (البيانات بتقيس اللي المفروض تقيسه)
        ar: الصدق
        en: validity
      - text: reliabilitas
        ar_eg: ثبات (النتيجة بتتكرّر)
        ar: الثبات
        en: reliability
      - text: komite etik
        ar_eg: لجنة أخلاقيات
        ar: لجنة الأخلاقيات
        en: ethics committee
    words: [triangulasi, validitas, reliabilitas, komite etik]
  - id: e03
    type: listen
    text: Komite etik meminta kami memakai nama samaran untuk semua informan.
    question:
      ar_eg: مين طلب الأسامي المستعارة؟
      ar: مَن طلب الأسماء المستعارة؟
      en: Who asked for pseudonyms?
    options: [لجنة الأخلاقيات, الشغل الميداني, الملاحظات]
    answer: 0
    meaning:
      ar_eg: لجنة الأخلاقيات طلبت مننا نستعمل أسامي مستعارة لكل اللي بنقابلهم.
      ar: طلبت لجنة الأخلاقيات استعمال أسماء مستعارة لكلّ المخبرين.
      en: The ethics committee asked us to use pseudonyms for all informants.
    words: [komite etik]
  - id: e04
    type: fill_blank
    sentence: Dia tinggal setahun di desa itu untuk penelitian ___.
    meaning:
      ar_eg: عاشت سنة في القرية دي علشان بحث ___.
      ar: عاشت عامًا في تلك القرية لبحث ___.
      en: She lived a year in that village for an ___ study.
    options: [etnografi, reliabilitas, komite etik]
    answers: [etnografi]
    words: [etnografi, reliabilitas, komite etik]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «reliabilitas» معناها إيه؟
      ar: ما «reliabilitas»؟
      en: What is 'reliabilitas'?
    options: [Hasil yang sama jika pengukuran diulang., Jumlah halaman laporan., Izin dari kepala desa.]
    answer: 0
    explain:
      ar_eg: الثبات = لو كرّرت القياس تطلع نفس النتيجة.
      ar: الثبات = النتيجة نفسها عند تكرار القياس.
      en: Reliability = same result when you repeat the measurement.
    words: [reliabilitas, validitas]
  - id: e06
    type: fill_blank
    sentence: Kami membandingkan wawancara, observasi, dan dokumen. Itu namanya ___.
    meaning:
      ar_eg: قارنّا المقابلات والملاحظة والوثائق. ده اسمه ___.
      ar: قارنّا المقابلات والملاحظة والوثائق، وهذا يسمّى ___.
      en: We compared interviews, observation and documents. That's ___.
    options: [triangulasi, catatan lapangan, kerja lapangan]
    answers: [triangulasi]
    words: [triangulasi, catatan lapangan, kerja lapangan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: المقابلة المتعمّقة دي خدت ساعتين.
      ar: استغرقت هذه المقابلة المعمّقة ساعتين.
      en: This in-depth interview took two hours.
    answer: Wawancara mendalam ini berlangsung dua jam.
    distractors: [triangulasi, etnografi]
    words: [wawancara mendalam]
  - id: e08
    type: translate
    direction: from_target
    source_text: Catatan lapangan membantu peneliti mengingat detail kecil.
    answers_meaning:
      ar_eg: [الملاحظات الميدانية بتساعد الباحث يفتكر التفاصيل الصغيّرة, الباحث بيفتكر التفاصيل الصغيّرة بفضل ملاحظاته الميدانية]
      ar: [تساعد المذكّرات الميدانية الباحث على تذكّر التفاصيل الصغيرة, تعين الملاحظات الميدانية الباحث على استحضار الدقائق]
      en: [Field notes help researchers remember small details, Field notes help the researcher recall little details]
    words: [catatan lapangan]
  - id: e09
    type: speaking
    text: Sebelum kerja lapangan, kami menunggu izin komite etik.
    meaning:
      ar_eg: قبل الشغل الميداني، بنستنّى موافقة لجنة الأخلاقيات.
      ar: قبل العمل الميداني ننتظر موافقة لجنة الأخلاقيات.
      en: Before fieldwork, we're waiting for ethics committee approval.
    words: [kerja lapangan, komite etik]
  - id: e10
    type: multiple_choice
    question: Apa yang paling meningkatkan validitas temuan etnografi?
    options: [Menulis laporan lebih cepat., Triangulasi dan wawancara mendalam dengan banyak informan., Tidak menulis catatan lapangan.]
    answer: 1
    explain:
      ar_eg: التثليث والمقابلات المتعمّقة بيقوّوا صدق النتايج.
      ar: يقوّي التثليث والمقابلات المعمّقة صدق النتائج.
      en: Triangulation and in-depth interviews strengthen validity.
    words: [validitas, triangulasi, wawancara mendalam, catatan lapangan, etnografi, reliabilitas]
dialogue:
  lines:
    - speaker: Pak Elias
      text: Kapan kamu mulai kerja lapangan di Arborek?
      ar_eg: هتبدأ الشغل الميداني في أربوريك إمتى؟
      ar: متى تبدأ عملك الميداني في أربوريك؟
      en: When do you start fieldwork in Arborek?
    - speaker: Mohamed
      text: Setelah izin komite etik keluar, Pak. Mungkin bulan depan.
      ar_eg: بعد ما موافقة لجنة الأخلاقيات تطلع يا دكتور. يمكن الشهر الجاي.
      ar: بعد صدور موافقة لجنة الأخلاقيات يا دكتور، ربما الشهر المقبل.
      en: After the ethics committee approves, sir. Maybe next month.
    - speaker: Pak Elias
      text: Rencanamu wawancara mendalam saja?
      ar_eg: خطّتك مقابلات متعمّقة بس؟
      ar: أتقتصر خطّتك على المقابلات المعمّقة؟
      en: Is your plan only in-depth interviews?
    - speaker: Mohamed
      text: Tidak. Saya juga observasi dan mengumpulkan dokumen kampung untuk triangulasi.
      ar_eg: لأ. كمان هلاحظ وأجمع وثائق القرية علشان التثليث.
      ar: لا، سأراقب أيضًا وأجمع وثائق القرية للتثليث.
      en: No. I'll also observe and collect village documents for triangulation.
    - speaker: Pak Elias
      text: Bagus. Tulis catatan lapangan setiap malam, sebelum kamu lupa.
      ar_eg: حلو. اكتب ملاحظاتك الميدانية كل ليلة قبل ما تنسى.
      ar: جيّد، واكتب مذكّراتك الميدانية كلّ ليلة قبل أن تنسى.
      en: Good. Write field notes every night, before you forget.
