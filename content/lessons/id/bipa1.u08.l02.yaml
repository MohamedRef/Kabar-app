schema: kabar.lesson/v1
id: bipa1.u08.l02
language: id
title: Rambutnya panjang
can_do:
  ar_eg: توصف شكل حد.
  ar: أن تصف مظهر أحدهم.
  en: Describe how someone looks.
slides:
  - title: Tinggi, rambutnya panjang
    body:
      ar_eg: |
        للشكل:
        - tinggi (طويل) ↔ pendek (قصير)
        - cantik (حلوة، للبنات) / ganteng (وسيم، للولاد)
        - rambut = شعر. وrambutnya = شعره / شعرها: Rambutnya panjang = شعرها طويل.
        خلي بالك: pendek بتنفع للناس وللشعر: rambutnya pendek = شعره قصير.
      ar: |
        للمظهر:
        - tinggi (طويل) ↔ pendek (قصير)
        - cantik (جميلة) / ganteng (وسيم)
        - rambut = شَعر، وrambutnya = شعره / شعرها: Rambutnya panjang = شعرها طويل.
        وpendek تُقال للقامة وللشعر معًا.
      en: |
        For looks:
        - tinggi (tall) ↔ pendek (short)
        - cantik (pretty) / ganteng (handsome)
        - rambut = hair; rambutnya = his / her hair: Rambutnya panjang = Her hair is long.
        pendek works for people and for hair: rambutnya pendek = his hair is short.
    examples:
      - text: Ni Luh cantik. Rambutnya panjang.
        ar_eg: ني لوه حلوة. شعرها طويل.
        ar: ني لوه جميلة، وشعرها طويل.
        en: Ni Luh is pretty. Her hair is long.
      - text: Raka tinggi dan ganteng.
        ar_eg: راكا طويل ووسيم.
        ar: راكا طويل ووسيم.
        en: Raka is tall and handsome.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tinggi
        ar_eg: طويل
        ar: طويل القامة
        en: tall
      - text: rambut
        ar_eg: شعر
        ar: شَعر
        en: hair
      - text: panjang
        ar_eg: طويل (شعر، طريق)
        ar: طويل (للأشياء)
        en: long
      - text: cantik
        ar_eg: حلوة
        ar: جميلة
        en: pretty
    words: [tinggi, rambut, panjang, cantik]
  - id: e02
    type: listen
    text: Rambutnya panjang.
    options: [Rambutnya panjang., Dia tinggi., Rambutnya pendek.]
    answer: 0
    words: [rambut, panjang]
  - id: e03
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: رينا طويلة وشعرها طويل.
      ar: رينا طويلة وشعرها طويل.
      en: Rina is tall and her hair is long.
    answers: [Rina tinggi dan rambutnya panjang., Rina tinggi dan rambutnya panjang, 'Rina tinggi, rambutnya panjang.', 'Rina tinggi, rambutnya panjang']
    explain:
      ar_eg: للقامة tinggi، وللشعر panjang. الاتنين بالعربي «طويل»، بس بالإندونيسي كلمتين.
      ar: tinggi للقامة وpanjang للشعر، وكلاهما «طويل» بالعربية.
      en: tinggi is for height, panjang for length — both are "long/tall" in Arabic.
    words: [tinggi, rambut, panjang]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إيه عكس panjang؟
      ar: ما عكس panjang؟
      en: What is the opposite of panjang?
    options: [tinggi, cantik, pendek]
    answer: 2
    explain:
      ar_eg: pendek = قصير، للشعر وللناس كمان.
      ar: pendek = قصير، للشعر وللأشخاص.
      en: Pendek = short, for hair and for people.
    words: [panjang, pendek]
  - id: e05
    type: fill_blank
    sentence: Raka tinggi dan ___.
    meaning:
      ar_eg: راكا طويل ووسيم.
      ar: راكا طويل ووسيم.
      en: Raka is tall and handsome.
    options: [ganteng, rambut, agak]
    answers: [ganteng]
    words: [ganteng]
  - id: e06
    type: dictation
    text: Rambutnya agak pendek.
    meaning:
      ar_eg: شعره قصير شوية.
      ar: شعره قصير بعض الشيء.
      en: His hair is a bit short.
    words: [rambut, agak, pendek]
  - id: e07
    type: speaking
    text: Ni Luh cantik. Rambutnya panjang.
    meaning:
      ar_eg: ني لوه حلوة. شعرها طويل.
      ar: ني لوه جميلة. شعرها طويل.
      en: Ni Luh is pretty. Her hair is long.
    words: [cantik, rambut, panjang]
  - id: e08
    type: listen
    text: Raka agak tinggi dan ganteng.
    options: ['Raka agak tinggi dan ganteng.', 'Raka agak pendek dan ganteng.', 'Raka tinggi dan cantik.']
    answer: 0
    meaning:
      ar_eg: راكا طويل شوية ووسيم.
      ar: راكا طويل قليلًا ووسيم.
      en: Raka is fairly tall and handsome.
    words: [agak, ganteng]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «شعرها طويل شوية»؟
      ar: كيف تقول «شعرها طويل قليلًا»؟
      en: How do you say "Her hair is fairly long"?
    options: ['Rambutnya agak panjang.', 'Rambutnya panjang agak.', 'Agak rambutnya panjang.']
    answer: 0
    explain:
      ar_eg: agak بتيجي قبل الصفة على طول.
      ar: تأتي agak قبل الصفة مباشرة.
      en: agak goes right before the adjective.
    words: [agak, rambut, panjang]
  - id: e10
    type: speaking
    text: Kakak saya ganteng, dan istrinya cantik.
    meaning:
      ar_eg: أخويا الكبير وسيم، ومراته حلوة.
      ar: أخي الأكبر وسيم، وزوجته جميلة.
      en: My older brother is handsome, and his wife is pretty.
    words: [ganteng, cantik]
dialogue:
  lines:
    - speaker: Mohamed
      text: Raka, adikmu tinggi?
      ar_eg: راكا، أخوك الصغير طويل؟
      ar: راكا، هل أخوك الأصغر طويل؟
      en: Raka, is your younger brother tall?
    - speaker: Raka
      text: Nggak, dia agak pendek. Tapi dia ganteng!
      ar_eg: لأ، هو قصير شوية. بس وسيم!
      ar: لا، هو قصير بعض الشيء. لكنه وسيم!
      en: No, he's a bit short. But he's handsome!
    - speaker: Mohamed
      text: Rambutnya panjang?
      ar_eg: شعره طويل؟
      ar: هل شعره طويل؟
      en: Is his hair long?
    - speaker: Raka
      text: Ya, rambutnya agak panjang.
      ar_eg: أيوه، شعره طويل شوية.
      ar: نعم، شعره طويل بعض الشيء.
      en: Yes, his hair is a bit long.
