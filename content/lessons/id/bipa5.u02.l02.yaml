schema: kabar.lesson/v1
id: bipa5.u02.l02
language: id
title: Selain itu, dengan demikian
can_do:
  ar_eg: تربط حججك ببعض بـ Selain itu وDi sisi lain وDengan demikian.
  ar: أن تربط حججك بأدوات مثل Selain itu وDi sisi lain وDengan demikian.
  en: Link your arguments with Selain itu, Di sisi lain and Dengan demikian.
slides:
  - title: Menambah dan membandingkan
    grammar: id.argument.connectors
    body:
      ar_eg: |
        المقال أو النقاش المنظم محتاج أدوات ربط في أول الجملة، وبعدها فاصلة:
        - Selain itu, = وكمان / علاوة على كده (بتضيف نقطة).
        - Di satu sisi, … Di sisi lain, … = من ناحية … ومن ناحية تانية …
        - Misalnya, = مثلًا.
        زي «علاوة على ذلك» و«من ناحية أخرى» في العربي بالظبط.
      ar: |
        تحتاج المقالة أو النقاش المنظَّم إلى أدوات ربط في صدر الجملة تليها فاصلة:
        - Selain itu, = علاوة على ذلك (لإضافة نقطة).
        - Di satu sisi, … Di sisi lain, … = من ناحية … ومن ناحية أخرى …
        - Misalnya, = مثلًا.
        وهي تقابل «علاوة على ذلك» و«من ناحية أخرى» في العربية.
      en: |
        An organised essay or debate needs connectors at the start of a sentence, followed by a comma:
        - Selain itu, = Besides that / Moreover (adds a point).
        - Di satu sisi, … Di sisi lain, … = On the one hand … on the other …
        - Misalnya, = For example.
    examples:
      - text: Di satu sisi, ibu kota baru lebih aman. Di sisi lain, biayanya sangat besar.
        ar_eg: من ناحية، العاصمة الجديدة أأمن. ومن ناحية تانية، تكلفتها كبيرة جدًا.
        ar: من ناحية، العاصمة الجديدة أكثر أمانًا. ومن ناحية أخرى، تكلفتها باهظة.
        en: On the one hand, the new capital is safer. On the other, it costs a great deal.
  - title: Menyimpulkan
    grammar: id.argument.connectors
    body:
      ar_eg: |
        وفي الآخر بتستنتج:
        - Dengan demikian, = وبكده / وبالتالي (رسمي قوي، للمقالات).
        - Oleh karena itu, = عشان كده.
        - Jadi, = يعني / فـ (أخف، للكلام).
        في المقال استخدم Dengan demikian؛ في الكلام العادي Jadi كفاية.
      ar: |
        وفي الختام تستنتج:
        - Dengan demikian, = وبذلك / وبالتالي (رسمية جدًّا، للمقالات).
        - Oleh karena itu, = لذلك.
        - Jadi, = إذن (أخفّ، للكلام).
        استعمل Dengan demikian في المقالة، وتكفي Jadi في الحديث اليومي.
      en: |
        Then you conclude:
        - Dengan demikian, = Thus / Therefore (very formal, for essays).
        - Oleh karena itu, = That's why.
        - Jadi, = So (lighter, for speech).
        Use Dengan demikian in writing; Jadi is enough in conversation.
    examples:
      - text: Jakarta semakin padat. Dengan demikian, pemindahan ibu kota perlu direncanakan dengan baik.
        ar_eg: جاكرتا بتزحم أكتر. وبالتالي نقل العاصمة لازم يتخطط كويس.
        ar: تزداد جاكرتا اكتظاظًا، وبالتالي يجب التخطيط الجيّد لنقل العاصمة.
        en: Jakarta is getting more crowded. Thus, moving the capital must be well planned.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: selain itu
        ar_eg: علاوة على كده
        ar: علاوة على ذلك
        en: moreover
      - text: di sisi lain
        ar_eg: من ناحية تانية
        ar: من ناحية أخرى
        en: on the other hand
      - text: dengan demikian
        ar_eg: وبالتالي
        ar: وبالتالي
        en: thus
      - text: padat
        ar_eg: مزدحم / مكتظ
        ar: مكتظّ
        en: crowded, dense
      - text: pemindahan
        ar_eg: نقل
        ar: نقل
        en: relocation, moving
    words: [selain itu, di sisi lain, dengan demikian, padat, pemindahan]
  - id: e02
    type: multiple_choice
    question: "Ibu kota baru lebih aman dari banjir. ___, lahannya masih luas."
    question_meaning:
      ar_eg: «العاصمة الجديدة أأمن من الفيضانات. …، والأرض لسه واسعة.» إيه اللي يكمّلها؟
      ar: «العاصمة الجديدة أكثر أمانًا من الفيضانات. …، وما زالت أرضها واسعة.» ماذا يكمّلها؟
      en: What completes "The new capital is safer from floods. …, there is still plenty of land."?
    options: [Dengan demikian, Selain itu, Di sisi lain]
    answer: 1
    explain:
      ar_eg: الجملة التانية بتضيف ميزة تانية، فدي Selain itu.
      ar: الجملة الثانية تضيف ميزة أخرى، فالأداة Selain itu.
      en: The second sentence adds another advantage, so Selain itu.
    words: [selain itu]
  - id: e03
    type: fill_blank
    sentence: Di satu sisi, proyek ini membuka lapangan kerja. ___, hutan di sekitarnya terancam.
    meaning:
      ar_eg: من ناحية، المشروع ده بيفتح فرص شغل. ومن ناحية تانية، الغابة اللي حواليه في خطر.
      ar: من ناحية، يفتح المشروع فرص عمل، ومن ناحية أخرى تتهدّد الغابة المحيطة به.
      en: On the one hand, this project creates jobs. On the other, the forest around it is under threat.
    options: [Di sisi lain, Selain itu, Misalnya]
    answers: [Di sisi lain]
    explain:
      ar_eg: Di satu sisi محتاجة أختها Di sisi lain.
      ar: Di satu sisi تستدعي Di sisi lain.
      en: Di satu sisi pairs with Di sisi lain.
    words: [di sisi lain]
  - id: e04
    type: listen
    text: Jakarta sudah terlalu padat. Dengan demikian, pemindahan ibu kota masuk akal.
    question:
      ar_eg: المتكلم بيستنتج إيه؟
      ar: ماذا يستنتج المتكلّم؟
      en: What does the speaker conclude?
    options:
      - إن جاكرتا فاضية.
      - إن العاصمة لازم تفضل في جاكرتا.
      - إن نقل العاصمة منطقي عشان جاكرتا زحمة قوي.
    answer: 2
    words: [padat, dengan demikian, pemindahan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: علاوة على كده، نقل العاصمة بيقلل الزحمة في جاكرتا.
      ar: علاوة على ذلك، يخفّف نقل العاصمة الازدحام في جاكرتا.
      en: Moreover, moving the capital reduces congestion in Jakarta.
    answer: Selain itu, pemindahan ibu kota mengurangi kemacetan di Jakarta.
    distractors: [dengan demikian, sisi]
    words: [selain itu, pemindahan]
  - id: e06
    type: translate
    direction: from_target
    source_text: Di sisi lain, biaya pemindahan ibu kota sangat besar.
    answers_meaning:
      ar_eg:
        - ومن ناحية تانية، تكلفة نقل العاصمة كبيرة جدًا.
        - من ناحية تانية، تكلفة نقل العاصمة كبيرة قوي.
      ar:
        - ومن ناحية أخرى، تكلفة نقل العاصمة كبيرة جدًّا.
        - من ناحية أخرى، تكلفة نقل العاصمة باهظة.
      en:
        - On the other hand, the cost of moving the capital is very high.
        - On the other hand, moving the capital is very expensive.
    words: [di sisi lain, pemindahan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: إنت بتكتب مقال رسمي وعايز تستنتج. تبدأ بإيه؟
      ar: تكتب مقالة رسمية وتريد أن تستنتج. بمَ تبدأ؟
      en: You are writing a formal essay and want to conclude. How do you start?
    options: [Dengan demikian, Misalnya, Selain itu]
    answer: 0
    explain:
      ar_eg: Dengan demikian هي أداة الاستنتاج الرسمية.
      ar: Dengan demikian أداة الاستنتاج الرسمية.
      en: Dengan demikian is the formal concluding connector.
    words: [dengan demikian]
  - id: e08
    type: speaking
    text: Di satu sisi, kota ini padat. Di sisi lain, kota ini penuh peluang.
    meaning:
      ar_eg: من ناحية، المدينة دي زحمة. ومن ناحية تانية، مليانة فرص.
      ar: من ناحية، المدينة مكتظّة، ومن ناحية أخرى، مليئة بالفرص.
      en: On the one hand, this city is crowded. On the other, it is full of opportunities.
    words: [padat, di sisi lain]
  - id: e09
    type: multiple_choice
    question: "___ ibu kota ke Kalimantan dilakukan secara bertahap."
    question_meaning:
      ar_eg: كمّل الجملة. «… العاصمة لكاليمانتان بيتم على مراحل.»
      ar: أكمل الجملة. «يجري … العاصمة إلى كاليمانتان على مراحل.»
      en: Complete the sentence. "The … of the capital to Kalimantan is happening in stages."
    options: [Padat, Pemindahan, Selain itu]
    answer: 1
    words: [pemindahan]
dialogue:
  title: Diskusi di kampus Balikpapan
  lines:
    - speaker: Rina
      text: Menurut saya, ibu kota baru itu ide bagus. Jakarta sudah terlalu padat.
      ar_eg: في رأيي العاصمة الجديدة فكرة كويسة. جاكرتا زحمة زيادة عن اللزوم.
      ar: في رأيي العاصمة الجديدة فكرة جيّدة، فجاكرتا مكتظّة جدًّا.
      en: In my view, the new capital is a good idea. Jakarta is already too crowded.
    - speaker: Mohamed
      text: Setuju. Selain itu, Kalimantan lebih aman dari gempa.
      ar_eg: موافق. وكمان كاليمانتان أأمن من الزلازل.
      ar: أوافق. وعلاوة على ذلك، كاليمانتان أكثر أمانًا من الزلازل.
      en: Agreed. Moreover, Kalimantan is safer from earthquakes.
    - speaker: Mas Rizal
      text: Di sisi lain, pemindahan ini mahal dan bisa merusak hutan.
      ar_eg: من ناحية تانية، النقل ده غالي وممكن يبوّظ الغابة.
      ar: ومن ناحية أخرى، هذا النقل مكلف وقد يضرّ بالغابة.
      en: On the other hand, this move is expensive and could damage the forest.
    - speaker: Rina
      text: Dengan demikian, rencananya harus hati-hati, ya.
      ar_eg: يبقى لازم الخطة تكون بحذر بقى.
      ar: وبالتالي يجب أن تكون الخطة حذرة.
      en: So the plan has to be careful, then.
