schema: kabar.lesson/v1
id: bipa1.u05.l03
language: id
title: Bagaimana liburanmu?
can_do:
  ar_eg: تسأل الحاجة عاملة إزاي، وتستأذن بأدب.
  ar: أن تسأل عن حال الأشياء، وأن تستأذن بأدب.
  en: Ask how things are; ask permission politely.
slides:
  - title: Bagaimana …?
    body:
      ar_eg: |
        bagaimana = «عامل إيه / عاملة إزاي». بتسأل بيها عن حال حاجة أو تجربة:
        - Bagaimana liburanmu? = الأجازة كانت عاملة إزاي؟
        - Bagaimana cuacanya? = الجو عامل إيه؟
        ردود سهلة: Bagus! (حلوة)، Seru! (ممتعة)، Cerah (الجو صحو)، Panas (حر)، Hujan (بتمطر).
        خلي بالك: Apa kabar? للناس، وbagaimana للحاجات والتجارب.
      ar: |
        bagaimana = «كيف». يُسأل بها عن حال شيء أو تجربة:
        - Bagaimana liburanmu? = كيف كانت عطلتك؟
        - Bagaimana cuacanya? = كيف الطقس؟
        ومن الأجوبة: Bagus! (جيدة)، Seru! (ممتعة)، Cerah (صحو)، Panas (حار)، Hujan (ممطر).
        وApa kabar? للأشخاص، أما الأشياء والتجارب فبـ bagaimana.
      en: |
        bagaimana = "how". Use it to ask how a thing or an experience is:
        - Bagaimana liburanmu? = How was your holiday?
        - Bagaimana cuacanya? = How's the weather?
        Easy replies: Bagus! (good), Seru! (fun), Cerah (sunny), Panas (hot), Hujan (raining).
        Apa kabar? is for people; for things and experiences use bagaimana.
    grammar: id.question.bagaimana
    examples:
      - text: Bagaimana liburanmu? — Seru!
        ar_eg: الأجازة كانت عاملة إزاي؟ — تحفة!
        ar: كيف كانت عطلتك؟ — ممتعة!
        en: How was your holiday? — Fun!
      - text: Bagaimana cuacanya? — Cerah dan panas.
        ar_eg: الجو عامل إيه؟ — صحو وحر.
        ar: كيف الطقس؟ — صحو وحار.
        en: How's the weather? — Sunny and hot.
  - title: Gimana? Bagaimana kalau…?
    body:
      ar_eg: |
        في الكلام العادي والشات بيقولوا gimana (وبيكتبوها gmn).
        وBagaimana kalau …? = «إيه رأيك لو …؟» بالحرف، عشان تقترح حاجة.
        ومعلومة للعربي: musim (فصل) جاية من «موسم»: musim hujan = موسم المطر.
      ar: |
        في العامية والمحادثات يُقال gimana (وتُكتب gmn).
        وBagaimana kalau …؟ = «ما رأيك لو …؟» للاقتراح.
        وكلمة musim (الفصل) من العربية «موسم»: musim hujan = موسم المطر.
      en: |
        Casual speech and chats say gimana (written gmn).
        Bagaimana kalau …? = «إيه رأيك لو …؟» — "How about …?" for suggestions.
        Bridge: musim (season) comes from Arabic «موسم»: musim hujan = rainy season.
    grammar: id.question.bagaimana
    examples:
      - text: Bagaimana kalau kita ke pantai besok?
        ar_eg: إيه رأيك نروح البحر بكرة؟
        ar: ما رأيك أن نذهب إلى الشاطئ غدًا؟
        en: How about going to the beach tomorrow?
      - text: Gimana, seru?
        ar_eg: ها، كانت حلوة؟
        ar: ما رأيك، أكانت ممتعة؟
        en: So, was it fun? (casual)
  - title: Permisi dan maaf
    body:
      ar_eg: |
        - permisi = «لو سمحت / عن إذنك»: لما تنادي حد غريب، أو تعدّي من قدامه، أو تستأذن تمشي.
        - maaf = «آسف» (من العربي «عفو / معافاة»)، للاعتذار. وكمان قبل سؤال محرج: Maaf, boleh tanya? = معلش، ممكن أسأل؟
        - Terima kasih (banyak)! = شكرًا (جزيلًا)! والرد: Sama-sama = العفو.
      ar: |
        - permisi = «عن إذنك / من فضلك»: لنداء غريب، أو للمرور أمام أحد، أو للاستئذان بالانصراف.
        - maaf = «عذرًا» (من العربية «عفو»)، للاعتذار، وقبل السؤال المحرج: Maaf, boleh tanya? = عذرًا، أيمكنني أن أسأل؟
        - Terima kasih (banyak)! = شكرًا (جزيلًا)! وجوابها Sama-sama = عفوًا.
      en: |
        - permisi = "excuse me": to call a stranger, to pass in front of someone, or to take your leave.
        - maaf = "sorry" (from Arabic «عفو»), to apologise — and to soften an awkward question: Maaf, boleh tanya? = Sorry, may I ask?
        - Terima kasih (banyak)! = Thank you (very much)! Reply: Sama-sama = You're welcome.
    grammar: id.politeness.phrases
    examples:
      - text: Permisi, Pak.
        ar_eg: عن إذنك يا أستاذ.
        ar: عن إذنك يا سيدي.
        en: Excuse me, sir.
      - text: Maaf, saya terlambat.
        ar_eg: آسف إني اتأخرت.
        ar: عذرًا على التأخير.
        en: Sorry, I'm late.
  - title: Boleh …? — Silakan!
    body:
      ar_eg: |
        Boleh + فعل؟ = «ممكن …؟» عشان تستأذن:
        - Boleh saya duduk? = ممكن أقعد؟
        - Boleh saya foto? = ممكن أصوّر؟
        الرد بالموافقة: Boleh! أو Silakan = اتفضل.
        وBoleh! لوحدها كمان معناها «ماشي، موافق» لما حد يقترح حاجة.
      ar: |
        Boleh + فعل؟ = «هل يمكنني …؟» للاستئذان:
        - Boleh saya duduk? = هل يمكنني الجلوس؟
        - Boleh saya foto? = هل يمكنني التصوير؟
        والجواب بالموافقة: Boleh! أو Silakan = تفضل.
        وتأتي Boleh! وحدها بمعنى «موافق» جوابًا عن اقتراح.
      en: |
        Boleh + verb? = "May I …?" to ask permission:
        - Boleh saya duduk? = May I sit down?
        - Boleh saya foto? = May I take a photo?
        Say yes with Boleh! or Silakan = Go ahead / Please do.
        Boleh! on its own also means "Sure!" when someone suggests something.
    grammar: id.politeness.phrases
    examples:
      - text: Boleh saya foto? — Silakan.
        ar_eg: ممكن أصوّر؟ — اتفضل.
        ar: هل يمكنني التصوير؟ — تفضل.
        en: May I take a photo? — Go ahead.
      - text: Terima kasih banyak! — Sama-sama.
        ar_eg: شكرًا جدًا! — العفو.
        ar: شكرًا جزيلًا! — عفوًا.
        en: Thanks a lot! — You're welcome.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bagaimana
        ar_eg: إزاي / عامل إيه
        ar: كيف
        en: how
      - text: permisi
        ar_eg: عن إذنك / لو سمحت
        ar: عن إذنك
        en: excuse me
      - text: silakan
        ar_eg: اتفضل
        ar: تفضّل
        en: go ahead, please do
      - text: cuaca
        ar_eg: الجو
        ar: الطقس
        en: weather
      - text: hujan
        ar_eg: مطر
        ar: مطر
        en: rain
    words: [bagaimana, permisi, silakan, cuaca, hujan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تسأل صاحبك الأجازة كانت عاملة إزاي.
      ar: تريد أن تسأل صديقك كيف كانت عطلته.
      en: You want to ask your friend how their holiday was.
    options: ["Siapa liburanmu?", "Apa kabar liburanmu?", "Bagaimana liburanmu?"]
    answer: 2
    explain:
      ar_eg: Apa kabar للناس، والأجازة تجربة، يبقى bagaimana.
      ar: Apa kabar للأشخاص، والعطلة تجربة فيُسأل عنها بـ bagaimana.
      en: Apa kabar is for people; a holiday is an experience, so bagaimana.
    words: [bagaimana, liburan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: راجل كبير قاعد وإنت لازم تعدّي من قدامه. تقول إيه؟
      ar: رجل مسن جالس وعليك أن تمر أمامه. ماذا تقول؟
      en: An older man is sitting and you need to pass in front of him. What do you say?
    options: ["Permisi, Pak.", "Sama-sama, Pak.", "Silakan, Pak."]
    answer: 0
    explain:
      ar_eg: permisi هي «عن إذنك» لما تعدّي من قدام حد.
      ar: permisi تعني «عن إذنك» عند المرور أمام أحد.
      en: permisi is "excuse me" when passing in front of someone.
    words: [permisi]
  - id: e04
    type: multiple_choice
    question: Terima kasih banyak!
    question_meaning:
      ar_eg: حد قالك «شكرًا جدًا!». ترد بإيه؟
      ar: قال لك أحدهم «شكرًا جزيلًا!». بماذا تردّ؟
      en: Someone says "Thanks a lot!". How do you reply?
    options: ["Sama-sama.", "Boleh.", "Permisi."]
    answer: 0
    words: [sama-sama]
  - id: e05
