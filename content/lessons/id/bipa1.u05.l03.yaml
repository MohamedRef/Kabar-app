schema: kabar.lesson/v1
id: bipa1.u05.l03
language: id
title: Bagaimana liburanmu?
can_do:
  ar_eg: تسأل الحاجة عاملة إزاي وتتكلم عن الجو.
  ar: أن تسأل كيف الأحوال وتتحدث عن الطقس.
  en: Ask how things are and talk about the weather.
slides:
  - title: Bagaimana …?
    body:
      ar_eg: |
        bagaimana = «عامل إيه / عاملة إزاي». بتسأل بيها عن حال حاجة أو تجربة:
        - Bagaimana liburanmu? = الأجازة كانت عاملة إزاي؟
        - Bagaimana cuacanya? = الجو عامل إيه؟
        ردود سهلة: Bagus! (حلوة)، Seru! (ممتعة)، Cerah (الجو صحو)، Panas (حر)، Hujan (بتمطر).
        خلي بالك: Apa kabar? للناس، وbagaimana للحاجات والتجارب.
      ar: |
        bagaimana = «كيف». يُسأل بها عن حال شيء أو تجربة:
        - Bagaimana liburanmu? = كيف كانت عطلتك؟
        - Bagaimana cuacanya? = كيف الطقس؟
        ومن الأجوبة: Bagus! (جيدة)، Seru! (ممتعة)، Cerah (صحو)، Panas (حار)، Hujan (ممطر).
        وApa kabar? للأشخاص، أما الأشياء والتجارب فبـ bagaimana.
      en: |
        bagaimana = "how". Use it to ask how a thing or an experience is:
        - Bagaimana liburanmu? = How was your holiday?
        - Bagaimana cuacanya? = How's the weather?
        Easy replies: Bagus! (good), Seru! (fun), Cerah (sunny), Panas (hot), Hujan (raining).
        Apa kabar? is for people; for things and experiences use bagaimana.
    grammar: id.question.bagaimana
    examples:
      - text: Bagaimana liburanmu? — Seru!
        ar_eg: الأجازة كانت عاملة إزاي؟ — تحفة!
        ar: كيف كانت عطلتك؟ — ممتعة!
        en: How was your holiday? — Fun!
      - text: Bagaimana cuacanya? — Cerah dan panas.
        ar_eg: الجو عامل إيه؟ — صحو وحر.
        ar: كيف الطقس؟ — صحو وحار.
        en: How's the weather? — Sunny and hot.
  - title: Gimana? Bagaimana kalau…?
    body:
      ar_eg: |
        في الكلام العادي والشات بيقولوا gimana (وبيكتبوها gmn).
        وBagaimana kalau …? = «إيه رأيك لو …؟» بالحرف، عشان تقترح حاجة.
        ومعلومة للعربي: musim (فصل) جاية من «موسم»: musim hujan = موسم المطر.
      ar: |
        في العامية والمحادثات يُقال gimana (وتُكتب gmn).
        وBagaimana kalau …؟ = «ما رأيك لو …؟» للاقتراح.
        وكلمة musim (الفصل) من العربية «موسم»: musim hujan = موسم المطر.
      en: |
        Casual speech and chats say gimana (written gmn).
        Bagaimana kalau …? = «إيه رأيك لو …؟» — "How about …?" for suggestions.
        Bridge: musim (season) comes from Arabic «موسم»: musim hujan = rainy season.
    grammar: id.question.bagaimana
    examples:
      - text: Bagaimana kalau kita ke pantai besok?
        ar_eg: إيه رأيك نروح البحر بكرة؟
        ar: ما رأيك أن نذهب إلى الشاطئ غدًا؟
        en: How about going to the beach tomorrow?
      - text: Gimana, seru?
        ar_eg: ها، كانت حلوة؟
        ar: ما رأيك، أكانت ممتعة؟
        en: So, was it fun? (casual)
