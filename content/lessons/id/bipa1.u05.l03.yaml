dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, gimana cuaca di Jakarta?
      ar_eg: محمد، الجو في جاكرتا عامل إزاي؟
      ar: محمد، كيف الطقس في جاكرتا؟
      en: Mohamed, how's the weather in Jakarta?
    - speaker: Mohamed
      text: Panas! Tapi malam ini hujan.
      ar_eg: حر! بس الليلة دي بتمطر.
      ar: حار! لكنها تمطر الليلة.
      en: Hot! But it's raining tonight.
    - speaker: Ni Luh
      text: Di Bali hari ini cerah.
      ar_eg: في بالي النهارده الجو صافي.
      ar: في بالي اليوم الجو صافٍ.
      en: In Bali it's sunny today.
    - speaker: Mohamed
      text: Bagaimana kalau aku liburan di Bali?
      ar_eg: إيه رأيك أقضي الإجازة في بالي؟
      ar: ما رأيك أن أقضي العطلة في بالي؟
      en: How about I spend my holiday in Bali?
