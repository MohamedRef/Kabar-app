schema: kabar.lesson/v1
id: bipa5.u01.l05
language: id
title: Budaya kantor
can_do:
  ar_eg: تفهم آداب المكتب الإندونيسي وتتكلم عنها بأدب.
  ar: أن تفهم آداب المكتب الإندونيسي وتتحدّث عنها بلباقة.
  en: Understand Indonesian office etiquette and talk about it politely.
slides:
  - title: Sungkan dan basa-basi
    body:
      ar_eg: |
        في المكتب الإندونيسي فيه حاجات مش مكتوبة:
        - sungkan = إحساس بالكسوف والاحترام بيخليك ماتقولش «لأ» للكبير على طول. الموظف sungkan يرفض طلب المدير.
        - basa-basi = كلام المجاملة قبل الشغل: Sudah makan, Pak? Bagaimana kabar keluarga?
        - atasan = المدير، وbawahan = اللي تحت إيدك.
        - masa percobaan = فترة التجربة، غالبًا ٣ شهور.
        - jam karet = «ساعة أستيك»: المواعيد اللي بتتمط. الناس بتهزر بيها، بس في الشغل الرسمي ماتعملهاش!
      ar: |
        في المكتب الإندونيسي أعراف غير مكتوبة:
        - sungkan = شعور بالحرج والتوقير يمنعك من قول «لا» صراحةً لمن هو أكبر منك. فالموظف sungkan أن يرفض طلب رئيسه.
        - basa-basi = كلام المجاملة قبل العمل: Sudah makan, Pak? Bagaimana kabar keluarga?
        - atasan = الرئيس، وbawahan = المرؤوس.
        - masa percobaan = فترة التجربة، وهي غالبًا ثلاثة أشهر.
        - jam karet = «الساعة المطاطية»: مواعيد تتمدّد. يمزح بها الناس، لكن تجنّبها في العمل الرسمي.
      en: |
        Indonesian offices have unwritten rules:
        - sungkan = a feeling of deference and awkwardness that stops you saying a flat "no" to someone senior. An employee is sungkan to refuse the boss.
        - basa-basi = polite small talk before business: Sudah makan, Pak? Bagaimana kabar keluarga?
        - atasan = superior; bawahan = subordinate.
        - masa percobaan = probation, usually three months.
        - jam karet = "rubber time": schedules that stretch. People joke about it, but avoid it at formal work.
    examples:
      - text: Dia sungkan menolak karena yang meminta atasannya.
        ar_eg: اتكسف يرفض عشان اللي طالب هو مديره.
        ar: استحيا أن يرفض لأنّ صاحب الطلب رئيسه.
        en: He felt unable to refuse because it was his boss asking.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sungkan
        ar_eg: مكسوف من باب الاحترام
        ar: محرج توقيرًا
        en: reluctant out of deference
      - text: basa-basi
        ar_eg: كلام مجاملة
        ar: كلام مجاملة
        en: small talk
      - text: bawahan
        ar_eg: موظف تحت إيدك
        ar: مرؤوس
        en: subordinate
      - text: masa percobaan
        ar_eg: فترة تجربة
        ar: فترة التجربة
        en: probation
      - text: jam karet
        ar_eg: مواعيد مطاطة
        ar: مواعيد مطاطية
        en: rubber time
    words: [sungkan, basa-basi, bawahan, masa percobaan, jam karet]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Saya sungkan menolak permintaan atasan.» معناها إيه؟
      ar: ما معنى «Saya sungkan menolak permintaan atasan.»؟
      en: What does "Saya sungkan menolak permintaan atasan." mean?
    options:
      - أنا زعلان من طلب المدير.
      - مكسوف أرفض طلب المدير.
      - المدير رفض طلبي.
    answer: 1
    explain:
      ar_eg: sungkan مش خوف ولا زعل، ده إحساس بالاحترام بيصعّب عليك الرفض.
      ar: sungkan ليس خوفًا ولا غضبًا، بل توقير يجعل الرفض صعبًا.
      en: sungkan isn't fear or anger; it's deference that makes refusing hard.
    words: [sungkan]
  - id: e03
    type: listen
    text: Masa percobaan Anda tiga bulan. Setelah itu kontrak Anda bisa diperpanjang.
    question:
      ar_eg: فترة التجربة قد إيه؟
      ar: كم مدّة فترة التجربة؟
      en: How long is the probation?
    options:
      - شهر واحد.
      - سنة.
      - ٣ شهور.
    answer: 2
    words: [masa percobaan]
  - id: e04
    type: fill_blank
    sentence: Rapat mulai tepat pukul sembilan, jadi jangan pakai ___.
    meaning:
      ar_eg: الاجتماع هيبدأ تسعة بالظبط، فبلاش مواعيد مطاطة.
      ar: يبدأ الاجتماع في التاسعة تمامًا، فلا تتأخّر.
      en: The meeting starts at nine sharp, so no rubber time.
    options: [jam karet, basa-basi, bawahan]
    answers: [jam karet]
    words: [jam karet]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة تعتبر basa-basi؟
      ar: أيّ جملة تُعدّ basa-basi؟
      en: Which sentence is basa-basi?
    options:
      - Sudah makan, Pak?
      - Laporan Anda salah.
      - Gaji saya berapa?
    answer: 0
    explain:
      ar_eg: «أكلت يا أستاذ؟» مش سؤال عن الأكل بجد، دي مجاملة قبل الكلام.
      ar: «هل أكلت يا أستاذ؟» ليس سؤالًا حقيقيًا عن الطعام، بل مجاملة تسبق الحديث.
      en: '"Have you eaten, sir?" is not really about food; it is a friendly opener.'
    words: [basa-basi]
  - id: e06
    type: build_sentence
    source:
      ar_eg: بتكسف أنادي مديري باسمه بس.
      ar: أستحيي أن أنادي رئيسي باسمه وحده.
      en: I feel awkward calling my boss by his name alone.
    answer: Saya sungkan memanggil atasan hanya dengan namanya.
    distractors: [bawahan, gue]
    words: [sungkan]
  - id: e07
    type: translate
    direction: from_target
    source_text: Atasan yang baik mendengarkan bawahannya.
    answers_meaning:
      ar_eg:
        - المدير الكويس بيسمع للي تحت إيده.
        - المدير الشاطر بيسمع لموظفينه.
      ar:
        - الرئيس الجيّد يُصغي إلى مرؤوسيه.
        - المدير الصالح يستمع إلى موظّفيه.
      en:
        - A good boss listens to his staff.
        - A good superior listens to their subordinates.
    words: [bawahan]
  - id: e08
    type: speaking
    text: Selama masa percobaan, saya tidak pernah pakai jam karet.
    meaning:
      ar_eg: طول فترة التجربة عمري ما اتأخرت.
      ar: طوال فترة التجربة لم أتأخّر قطّ.
      en: Throughout my probation I never ran on rubber time.
    words: [masa percobaan, jam karet]
  - id: e09
    type: dictation
    text: Basa-basi itu penting sebelum rapat dimulai.
    meaning:
      ar_eg: كلام المجاملة مهم قبل ما الاجتماع يبدأ.
      ar: كلام المجاملة مهمّ قبل بدء الاجتماع.
      en: Small talk matters before a meeting starts.
    words: [basa-basi]
  - id: e10
    type: fill_blank
    sentence: Pak Hendra punya sepuluh ___ di bagian keuangan.
    meaning:
      ar_eg: الأستاذ هندرا عنده عشرة موظفين تحت إيده في قسم الحسابات.
      ar: لدى الأستاذ هندرا عشرة مرؤوسين في قسم المالية.
      en: Pak Hendra has ten people under him in the finance department.
    options: [bawahan, atasan, sungkan]
    answers: [bawahan]
    words: [bawahan]
dialogue:
  title: Mas Rizal menjelaskan
  lines:
    - speaker: Mohamed
      text: Mas, kenapa rekan kerja selalu bertanya "sudah makan?" sebelum rapat?
      ar_eg: يا ريزال، ليه الزملا دايمًا بيسألوا «أكلت؟» قبل الاجتماع؟
      ar: يا ريزال، لماذا يسأل الزملاء دائمًا «هل أكلت؟» قبل الاجتماع؟
      en: Mas, why do colleagues always ask "have you eaten?" before a meeting?
    - speaker: Mas Rizal
      text: Itu basa-basi. Mereka tidak benar-benar menawarkan makanan.
      ar_eg: دي مجاملة. هم مش بيعزموك على أكل بجد.
      ar: هذه مجاملة، فهم لا يعرضون عليك طعامًا حقًا.
      en: That's small talk. They aren't really offering you food.
    - speaker: Mohamed
      text: Lalu kenapa bawahan Pak Hendra tidak pernah bilang "tidak"?
      ar_eg: طب ليه الموظفين اللي تحت الأستاذ هندرا عمرهم ما بيقولوا «لأ»؟
      ar: ولماذا لا يقول مرؤوسو الأستاذ هندرا «لا» أبدًا؟
      en: Then why do Pak Hendra's staff never say "no"?
    - speaker: Mas Rizal
      text: Mereka sungkan. Mereka bilang "akan saya usahakan" saja.
      ar_eg: مكسوفين منه. بيقولوا «هحاول» وخلاص.
      ar: يمنعهم التوقير، فيكتفون بقول «سأحاول».
      en: They feel sungkan. They just say "I'll try my best".
