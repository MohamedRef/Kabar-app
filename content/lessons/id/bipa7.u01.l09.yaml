schema: kabar.lesson/v1
id: bipa7.u01.l09
language: id
title: Perusahaan rintisan
can_do:
  ar_eg: 'تحكي عن شركة ناشئة عملها شباب: الفكرة، النموذج الأولي والتمويل.'
  ar: 'أن تتحدّث عن شركة ناشئة أسّسها شباب: الفكرة والنموذج الأوّلي والتمويل.'
  en: 'Talk about a youth start-up: the idea, the prototype and the funding.'
slides:
  - title: Dari ide ke usaha
    body:
      ar_eg: |
        perusahaan rintisan = startup (بالإندونيسي الرسمي). penggagas = صاحب الفكرة.
        inkubator = حاضنة بتساعد المشاريع الصغيرة. purwarupa = النموذج الأولي (prototype).
        modal ventura = فلوس مستثمرين بيراهنوا على شركة جديدة.
        wirausahawan = رائد أعمال، وkewirausahaan = ريادة الأعمال (بادئة ke-…-an بتعمل اسم معنى).
        hak cipta = حق المؤلّف: الكود والتصميم ملك اللي عملهم.
      ar: |
        perusahaan rintisan = الشركة الناشئة (المقابل الرسمي لـ startup). penggagas = صاحب الفكرة.
        inkubator = حاضنة تساعد المشاريع الصغيرة. purwarupa = النموذج الأوّلي.
        modal ventura = أموال مستثمرين يراهنون على شركة جديدة.
        wirausahawan = رائد أعمال، وkewirausahaan = ريادة الأعمال (اللاصقة ke-…-an تصوغ اسم معنى).
        hak cipta = حقّ المؤلّف: الشيفرة والتصميم ملك صانعيهما.
      en: |
        perusahaan rintisan = start-up (the official Indonesian term). penggagas = the person behind the idea.
        inkubator = an incubator that helps small ventures. purwarupa = prototype.
        modal ventura = venture capital: investors betting on a new company.
        wirausahawan = entrepreneur; kewirausahaan = entrepreneurship (ke-…-an makes an abstract noun).
        hak cipta = copyright: the code and design belong to their makers.
    examples:
      - text: Penggagas aplikasi ini masih kuliah.
        ar_eg: صاحب فكرة الأبلكيشن ده لسه في الجامعة.
        ar: صاحب فكرة هذا التطبيق ما زال طالبًا جامعيًا.
        en: The person behind this app is still at university.
      - text: Purwarupanya dibuat di inkubator kampus.
        ar_eg: النموذج الأولي اتعمل في حاضنة الجامعة.
        ar: صُنع النموذج الأوّلي في حاضنة الجامعة.
        en: The prototype was built in the campus incubator.
      - text: Perusahaan rintisan itu mendapat modal ventura.
        ar_eg: الشركة الناشئة دي خدت تمويل من رأس مال مخاطر.
        ar: حصلت تلك الشركة الناشئة على رأس مال جريء.
        en: That start-up got venture capital.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rintisan
        ar_eg: شركة ناشئة / حاجة لسه بتتأسّس
        ar: مشروع ناشئ
        en: start-up, pioneering venture
      - text: penggagas
        ar_eg: صاحب الفكرة / المبادر
        ar: صاحب الفكرة، المبادِر
        en: initiator, originator of an idea
      - text: inkubator
        ar_eg: حاضنة أعمال
        ar: حاضنة أعمال
        en: (business) incubator
      - text: purwarupa
        ar_eg: نموذج أولي / بروتوتايب
        ar: نموذج أوّلي
        en: prototype
    words: [rintisan, penggagas, inkubator, purwarupa]
  - id: e02
    type: match_pairs
    pairs:
      - text: modal ventura
        ar_eg: رأس مال مخاطر
        ar: رأس المال الجريء
        en: venture capital
      - text: wirausahawan
        ar_eg: رائد أعمال
        ar: رائد أعمال
        en: entrepreneur
      - text: kewirausahaan
        ar_eg: ريادة الأعمال
        ar: ريادة الأعمال
        en: entrepreneurship
      - text: hak cipta
        ar_eg: حقوق الملكية / حق المؤلّف
        ar: حقّ المؤلّف
        en: copyright
    words: [modal ventura, wirausahawan, kewirausahaan, hak cipta]
  - id: e03
    type: listen
    text: Kami masih menguji purwarupa alat ini di pasar ikan.
    question:
      ar_eg: بيجرّبوا إيه في السوق؟
      ar: ماذا يختبرون في السوق؟
      en: What are they testing at the market?
    options: [النموذج الأولي, حق المؤلّف, الحاضنة]
    answer: 0
    meaning:
      ar_eg: لسه بنجرّب النموذج الأولي للجهاز ده في سوق السمك.
      ar: ما زلنا نختبر النموذج الأوّلي لهذا الجهاز في سوق السمك.
      en: We're still testing this device's prototype at the fish market.
    words: [purwarupa]
  - id: e04
    type: fill_blank
    sentence: Desain ini dilindungi ___, jadi jangan disalin.
    meaning:
      ar_eg: التصميم ده محمي بـ ___، فما تنسخوش.
      ar: هذا التصميم محميّ بـ ___ فلا تنسخه.
      en: This design is protected by ___, so don't copy it.
    options: [hak cipta, inkubator, rintisan]
    answers: [hak cipta]
    words: [hak cipta, inkubator, rintisan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين «penggagas»؟
      ar: مَن «penggagas»؟
      en: Who is the 'penggagas'?
    options: [Orang yang pertama punya ide dan memulainya., Orang yang membeli produk., Orang yang menulis berita.]
    answer: 0
    explain:
      ar_eg: penggagas = اللي جت له الفكرة وبدأها.
      ar: penggagas = من خطرت له الفكرة وبدأها.
      en: penggagas = the one who had the idea and started it.
    words: [penggagas]
  - id: e06
    type: fill_blank
    sentence: Kampus kami membuka mata kuliah ___ untuk semua jurusan.
    meaning:
      ar_eg: جامعتنا فتحت مادة ___ لكل الأقسام.
      ar: افتتحت جامعتنا مقرّر ___ لكلّ التخصّصات.
      en: Our university opened a course in ___ for every department.
    options: [kewirausahaan, wirausahawan, modal ventura]
    answers: [kewirausahaan]
    words: [kewirausahaan, wirausahawan, modal ventura]
  - id: e07
    type: build_sentence
    source:
      ar_eg: هو رائد أعمال شاب من سورونج.
      ar: إنه رائد أعمال شابّ من سورونغ.
      en: He's a young entrepreneur from Sorong.
    answer: Dia wirausahawan muda dari Sorong.
    distractors: [kewirausahaan, penggagas]
    words: [wirausahawan]
  - id: e08
    type: translate
    direction: from_target
    source_text: Inkubator itu membantu perusahaan rintisan mencari modal ventura.
    answers_meaning:
      ar_eg: [الحاضنة دي بتساعد الشركات الناشئة تلاقي رأس مال مخاطر, حاضنة الأعمال دي بتساعد الستارت أبس تدوّر على تمويل مستثمرين]
      ar: [تساعد تلك الحاضنة الشركات الناشئة على إيجاد رأس مال جريء, تعين الحاضنة الشركات الناشئة في البحث عن رأس المال المخاطر]
      en: [That incubator helps start-ups find venture capital, The incubator helps start-ups look for venture capital]
    words: [inkubator, rintisan, modal ventura]
  - id: e09
    type: speaking
    text: Penggagasnya mengajar kewirausahaan kepada wirausahawan muda.
    meaning:
      ar_eg: صاحب الفكرة بيدرّس ريادة الأعمال لرواد أعمال صغيرين.
      ar: يدرّس صاحب الفكرة ريادة الأعمال لروّاد أعمال شباب.
      en: Its founder teaches entrepreneurship to young entrepreneurs.
    words: [penggagas, kewirausahaan, wirausahawan]
  - id: e10
    type: multiple_choice
    question: Investor memberi modal ventura kepada siapa?
    options: [Kepada nelayan yang menabung., Kepada perusahaan rintisan yang punya purwarupa bagus., Kepada pemilik hak cipta lagu lama.]
    answer: 1
    explain:
      ar_eg: رأس المال المخاطر بيروح لشركات ناشئة واعدة.
      ar: يذهب رأس المال الجريء إلى شركات ناشئة واعدة.
      en: Venture capital goes to promising start-ups.
    words: [modal ventura, rintisan, purwarupa, hak cipta]
dialogue:
  lines:
    - speaker: Kaka Yohana
      text: Hari ini kita wawancara Steven, penggagas aplikasi Ikan Segar.
      ar_eg: النهارده هنعمل مقابلة مع ستيفن، صاحب فكرة أبلكيشن «إيكان سيجار».
      ar: سنحاور اليوم ستيفن، صاحب فكرة تطبيق «إيكان سيغار».
      en: Today we're interviewing Steven, who came up with the Ikan Segar app.
    - speaker: Mohamed
      text: Perusahaan rintisannya baru satu tahun, kan?
      ar_eg: شركته الناشئة عمرها سنة بس، صح؟
      ar: عمر شركته الناشئة سنة واحدة، أليس كذلك؟
      en: His start-up is only a year old, right?
    - speaker: Kaka Yohana
      text: Ya. Purwarupanya dibuat di inkubator kampus di Manokwari.
      ar_eg: أيوه. النموذج الأولي اتعمل في حاضنة الجامعة في مانوكواري.
      ar: نعم، وصُنع النموذج الأوّلي في حاضنة الجامعة في مانوكواري.
      en: Yes. The prototype was built in the campus incubator in Manokwari.
    - speaker: Mohamed
      text: Apakah dia sudah dapat modal ventura?
      ar_eg: خد تمويل من مستثمرين خلاص؟
      ar: هل حصل على رأس مال جريء؟
      en: Has he got venture capital yet?
    - speaker: Kaka Yohana
      text: Belum. Dia mau hak cipta kodenya aman dulu.
      ar_eg: لسه. عايز يأمّن حقوق الكود بتاعه الأول.
      ar: ليس بعد، فهو يريد أن يحمي حقّ المؤلّف لشيفرته أولًا.
      en: Not yet. He wants the copyright on his code secured first.
    - speaker: Mohamed
      text: Wirausahawan yang hati-hati. Saya suka itu.
      ar_eg: رائد أعمال حريص. عاجبني ده.
      ar: رائد أعمال حذر، يعجبني ذلك.
      en: A careful entrepreneur. I like that.
