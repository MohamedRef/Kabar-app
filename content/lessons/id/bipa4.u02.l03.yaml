schema: kabar.lesson/v1
id: bipa4.u02.l03
language: id
title: Sebaik-baiknya
can_do:
  ar_eg: تطلب إن حاجة تتعمل بأسرع وأحسن شكل ممكن.
  ar: أن تطلب إنجاز أمر بأسرع ما يمكن وعلى أحسن وجه.
  en: Ask for action as soon and as well as possible.
slides:
  - title: se- + ulang + -nya
    body:
      ar_eg: |
        se- + صفة متكررة + -nya = «على قد ما يمكن»، وبتيجي كتير في الطلبات الرسمية:
        baik → sebaik-baiknya = على أحسن وجه
        cepat → secepat-cepatnya = بأسرع ما يمكن
        وsegera = حالًا / فورًا. والطلب المؤدب يبدأ بـ Mohon …
      ar: |
        se- + الصفة مكررة + -nya = «بأقصى ما يمكن»، وتكثر في الطلبات الرسمية:
        baik → sebaik-baiknya = على أحسن وجه
        cepat → secepat-cepatnya = بأسرع ما يمكن
        وsegera = فورًا، ويبدأ الطلب المهذب بـ Mohon …
      en: |
        se- + doubled adjective + -nya = "as … as possible", common in formal requests:
        baik → sebaik-baiknya = as well as possible
        cepat → secepat-cepatnya = as quickly as possible
        segera = immediately. A polite request starts with Mohon …
    grammar: id.reduplication.advanced
    examples:
      - text: Kami mohon jalan ini diperbaiki sebaik-baiknya.
        ar_eg: بنطلب إن الطريق ده يتصلح على أحسن وجه.
        ar: نرجو إصلاح هذا الطريق على أحسن وجه.
        en: We ask that this road be repaired as well as possible.
      - text: Mohon pemerintah daerah segera memperbaiki jalan ini.
        ar_eg: نرجو إن الحكومة المحلية تصلح الطريق ده حالًا.
        ar: نرجو من الحكومة المحلية إصلاح هذا الطريق فورًا.
        en: We ask the local government to repair this road immediately.
  - title: Sebaik-baiknya / sebaik mungkin
    body:
      ar_eg: |
        فيه طريقتين، اختار واحدة بس:
        sebaik-baiknya (بالتكرار) أو sebaik mungkin (من غير تكرار).
        غلط تقول sebaik-baik mungkin.
      ar: |
        طريقتان، اختر إحداهما:
        sebaik-baiknya (بالتكرار) أو sebaik mungkin (بلا تكرار).
        ولا يصح الخلط: sebaik-baik mungkin.
      en: |
        Two ways — pick one:
        sebaik-baiknya (doubled) or sebaik mungkin (not doubled).
        Don't mix them: sebaik-baik mungkin is wrong.
    grammar: id.reduplication.advanced
    examples:
      - text: Kami menunggu tanggapan dari pemerintah daerah.
        ar_eg: إحنا مستنيين رد من الحكومة المحلية.
        ar: ننتظر ردًّا من الحكومة المحلية.
        en: We are waiting for a response from the local government.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sebaik-baiknya
        ar_eg: على أحسن وجه
        ar: على أحسن وجه
        en: as well as possible
      - text: secepat-cepatnya
        ar_eg: بأسرع ما يمكن
        ar: بأسرع ما يمكن
        en: as quickly as possible
      - text: segera
        ar_eg: حالًا / فورًا
        ar: فورًا
        en: immediately
      - text: tanggapan
        ar_eg: رد / استجابة
        ar: ردّ / استجابة
        en: response
      - text: pemerintah daerah
        ar_eg: الحكومة المحلية
        ar: الحكومة المحلية
        en: local government
      - text: memperbaiki
        ar_eg: يصلّح
        ar: يُصلح
        en: repair
    words: [sebaik-baiknya, secepat-cepatnya, segera, tanggapan, pemerintah daerah, memperbaiki]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي صيغة صح بمعنى «على أحسن وجه»؟
      ar: أيّ صيغة صحيحة بمعنى «على أحسن وجه»؟
      en: Which form correctly means "as well as possible"?
    options: ["sebaik-baik mungkin", "sebaik-baiknya", "paling baik-baiknya"]
    answer: 1
    explain:
      ar_eg: إما sebaik-baiknya وإما sebaik mungkin، من غير خلط.
      ar: إما sebaik-baiknya وإما sebaik mungkin، دون خلط.
      en: Either sebaik-baiknya or sebaik mungkin — don't mix them.
    words: [sebaik-baiknya]
  - id: e03
    type: listen
    text: Kami menunggu tanggapan dari pemerintah daerah.
    options: ["Kami menunggu tanggapan dari pemerintah daerah.", "Kami menunggu perbaikan dari pemerintah daerah.", "Kami menulis tanggapan untuk pemerintah daerah."]
    answer: 0
    meaning:
      ar_eg: إحنا مستنيين رد من الحكومة المحلية.
      ar: ننتظر ردًّا من الحكومة المحلية.
      en: We are waiting for a response from the local government.
    words: [tanggapan, pemerintah daerah]
  - id: e04
    type: multiple_choice
    question: Jalannya berbahaya. Tolong perbaiki ___!
    question_meaning:
      ar_eg: الطريق خطر. صلّحوه …!
      ar: الطريق خطير. أصلحوه …!
      en: The road is dangerous. Please repair it …!
    options: ["sebaik-baik", "secepat-cepatnya mungkin", "secepat-cepatnya"]
    answer: 2
    words: [secepat-cepatnya]
  - id: e05
    type: fill_blank
    sentence: Mohon jalan ini ___ diperbaiki.
    meaning:
      ar_eg: نرجو إن الطريق ده يتصلح حالًا.
      ar: نرجو أن يُصلَح هذا الطريق فورًا.
      en: Please have this road repaired immediately.
    options: [segera, tanggapan, sebaik]
    answers: [segera]
    words: [segera]
  - id: e06
    type: build_sentence
    source:
      ar_eg: بنطلب من الحكومة المحلية تصلح الطريق ده على أحسن وجه.
      ar: نرجو من الحكومة المحلية أن تُصلح هذا الطريق على أحسن وجه.
      en: We ask the local government to repair this road as well as possible.
    answer: Kami mohon pemerintah daerah memperbaiki jalan ini sebaik-baiknya.
    distractors: [secepat, mungkin]
    words: [pemerintah daerah, memperbaiki, sebaik-baiknya]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الحكومة المحلية لازم تصلح الكوبري ده حالًا.
      ar: يجب على الحكومة المحلية أن تُصلح ذلك الجسر فورًا.
      en: The local government must repair that bridge immediately.
    answers:
      - Pemerintah daerah harus segera memperbaiki jembatan itu.
      - Pemerintah daerah harus segera memperbaiki jembatan itu
      - Pemerintah daerah harus memperbaiki jembatan itu segera.
      - Pemerintah daerah harus segera memperbaiki jembatannya.
      - Pemerintah daerah harus segera memperbaiki jembatan tersebut.
      - Pemerintah daerah harus segera memperbaiki jembatan ini.
    words: [pemerintah daerah, segera, memperbaiki]
  - id: e08
    type: speaking
    text: Sampai sekarang belum ada tanggapan. Mohon jalan ini diperbaiki secepat-cepatnya.
    meaning:
      ar_eg: لحد دلوقتي مفيش رد. نرجو إن الطريق ده يتصلح بأسرع ما يمكن.
      ar: لا ردّ حتى الآن. نرجو إصلاح هذا الطريق بأسرع ما يمكن.
      en: There's still no response. Please have this road repaired as quickly as possible.
    words: [tanggapan, secepat-cepatnya]
dialogue:
  title: Rapat warga
  lines:
    - speaker: Bu Hasnah
      text: Sudah tiga bulan jalan ini rusak. Harus diperbaiki secepat-cepatnya!
      ar_eg: بقالها تلات شهور الطريق ده بايظ. لازم يتصلح بأسرع ما يمكن!
      ar: مضت ثلاثة أشهر والطريق معطّل، ويجب إصلاحه بأسرع ما يمكن!
      en: This road has been broken for three months. It must be repaired as quickly as possible!
    - speaker: Pak Amir
      text: Warga sudah melapor ke pemerintah daerah, tapi belum ada tanggapan.
      ar_eg: السكان بلّغوا الحكومة المحلية، بس لسه مفيش رد.
      ar: أبلغ السكان الحكومة المحلية، لكن لا ردّ حتى الآن.
      en: Residents have reported it to the local government, but there's no response yet.
    - speaker: Mohamed
      text: Bagaimana kalau kita menulis surat pembaca di koran?
      ar_eg: إيه رأيكم نكتب رسالة قرّاء في الجرنال؟
      ar: ما رأيكم أن نكتب رسالة إلى بريد القرّاء في الصحيفة؟
      en: How about we write a letter to the editor in the newspaper?
    - speaker: Pak Amir
      text: Ide bagus! Kita minta pemerintah daerah segera memperbaiki jalan ini.
      ar_eg: فكرة حلوة! نطلب من الحكومة المحلية تصلح الطريق ده حالًا.
      ar: فكرة جيدة! نطلب من الحكومة المحلية إصلاح هذا الطريق فورًا.
      en: Good idea! We'll ask the local government to repair this road immediately.
    - speaker: Bu Hasnah
      text: Dan sebaik-baiknya, supaya tidak cepat rusak lagi.
      ar_eg: وعلى أحسن وجه، عشان ما يبوظش تاني بسرعة.
      ar: وعلى أحسن وجه، كي لا يتلف سريعًا مرة أخرى.
      en: And as well as possible, so it doesn't break again soon.
