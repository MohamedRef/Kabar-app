schema: kabar.lesson/v1
id: bipa2.u02.l06
language: id
title: Film di pengadilan
can_do:
  ar_eg: 'تحكي عن فيلم في محكمة: المحامي والقاضي والقضية، مين عادل ومين بيكدب.'
  ar: 'أن تحكي عن فيلم في محكمة: المحامي والقاضي والقضية، من العادل ومن يكذب.'
  en: 'Talk about a courtroom film: the lawyer, the judge and the case, who is fair and who is lying.'
slides:
  - title: Di pengadilan
    body:
      ar_eg: |
        pengadilan = محكمة، من adil = عادل (من العربي «عادل»، جذر ع د ل). hakim = قاضي (من «حاكم»)، pengacara = محامي.
        kasus = قضية. bohong = يكدب، كدب. tentara = جندي أو الجيش.
        aktor = ممثل. وjadi في الأفلام = بيعمل دور: Aktor itu jadi pengacara.
      ar: |
        pengadilan = محكمة، من adil = عادل (من العربية «عادل»، الجذر ع د ل). hakim = قاضٍ (من «حاكم»)، pengacara = محامٍ.
        kasus = قضية. bohong = يكذب، كذب. tentara = جندي أو الجيش.
        aktor = ممثّل. وjadi في الأفلام = يؤدّي دور: Aktor itu jadi pengacara.
      en: |
        pengadilan = court, from adil = fair, just (Arabic عادل, root ع د ل). hakim = judge (Arabic حاكم), pengacara = lawyer.
        kasus = case. bohong = lie, to lie. tentara = soldier, army.
        aktor = actor. In films, jadi = play the part of: Aktor itu jadi pengacara.
    examples:
      - text: Hakim di pengadilan itu adil.
        ar_eg: القاضي في المحكمة دي عادل.
        ar: القاضي في تلك المحكمة عادل.
        en: The judge at that court is fair.
      - text: Aktor itu jadi pengacara di film baru.
        ar_eg: الممثل ده بيعمل دور محامي في فيلم جديد.
        ar: يؤدّي ذلك الممثّل دور محامٍ في فيلم جديد.
        en: That actor plays a lawyer in a new film.
      - text: Tentara itu tidak bohong.
        ar_eg: العسكري ده مش بيكدب.
        ar: ذلك الجندي لا يكذب.
        en: That soldier isn't lying.
