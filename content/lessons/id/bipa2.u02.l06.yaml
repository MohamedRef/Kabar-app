  - id: e03
    type: listen
    text: Pengacara itu bekerja di pengadilan.
    question:
      ar_eg: المحامي بيشتغل فين؟
      ar: أين يعمل المحامي؟
      en: Where does the lawyer work?
    options: [في المحكمة, في المستشفى, في المصنع]
    answer: 0
    meaning:
      ar_eg: المحامي ده بيشتغل في المحكمة.
      ar: يعمل ذلك المحامي في المحكمة.
      en: That lawyer works at the court.
    words: [pengacara, pengadilan]
  - id: e04
    type: fill_blank
    sentence: Hakim itu baik dan ___.
    meaning:
      ar_eg: القاضي ده كويس و___.
      ar: ذلك القاضي طيّب و___.
      en: That judge is kind and ___.
    options: [adil, bohong, tentara]
    answers: [adil]
    words: [adil, bohong, tentara]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيحكم في القضية في المحكمة؟
      ar: مَن يحكم في القضية في المحكمة؟
      en: Who decides the case in court?
    options: [hakim, pengacara, aktor]
    answer: 0
    explain:
      ar_eg: hakim = قاضي (زي «حاكم»). pengacara محامي، وaktor ممثل.
      ar: hakim قاضٍ (من «حاكم»)، أما pengacara فمحامٍ وaktor ممثّل.
      en: hakim = judge; pengacara is a lawyer and aktor an actor.
    words: [hakim, pengacara, aktor]
  - id: e06
    type: fill_blank
    sentence: Dia tidak jujur. Dia ___.
    meaning:
      ar_eg: هو مش أمين. هو ___.
      ar: إنه ليس صادقًا، إنه ___.
      en: He isn't honest. He ___.
    options: [bohong, adil, kasus]
    answers: [bohong]
    words: [bohong, adil, kasus]
  - id: e07
    type: build_sentence
    source:
      ar_eg: المحامي قاعد قدام القاضي.
      ar: المحامي جالس أمام القاضي.
      en: The lawyer is sitting in front of the judge.
    answer: Pengacara itu duduk di depan hakim.
    distractors: [aktor, kasus]
    words: [pengacara, hakim]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ada kasus besar di pengadilan hari ini.
    answers_meaning:
      ar_eg: [فيه قضية كبيرة في المحكمة النهارده, النهارده فيه قضية كبيرة في المحكمة]
      ar: [هناك قضية كبيرة في المحكمة اليوم, في المحكمة اليوم قضية كبيرة]
      en: ['There''s a big case at the court today', 'Today there''s a big case in court']
    words: [kasus, pengadilan]
  - id: e09
    type: speaking
    text: Aktor itu terkenal. Di film ini dia jadi tentara.
    meaning:
      ar_eg: الممثل ده مشهور. في الفيلم ده بيعمل دور عسكري.
      ar: ذلك الممثّل مشهور، ويؤدّي في هذا الفيلم دور جندي.
      en: That actor is famous. In this film he plays a soldier.
    words: [aktor, tentara]
  - id: e10
    type: multiple_choice
    question: Dia bermain di film. Dia ___.
    options: [aktor, pengacara, tentara]
    answer: 0
    explain:
      ar_eg: اللي بيمثل في الأفلام aktor.
      ar: من يمثّل في الأفلام aktor.
      en: Someone who acts in films is an aktor.
    words: [aktor, tentara]
dialogue:
  lines:
    - speaker: Raka
      text: Rina, film apa ini?
      ar_eg: يا رينا، فيلم إيه ده؟
      ar: يا رينا، ما هذا الفيلم؟
      en: Rina, what film is this?
    - speaker: Rina
      text: Film ini di pengadilan. Ada kasus besar.
      ar_eg: الفيلم ده في محكمة. فيه قضية كبيرة.
      ar: يدور هذا الفيلم في محكمة، وفيه قضية كبيرة.
      en: This film is set in a court. There's a big case.
    - speaker: Raka
      text: Siapa pria itu? Dia tentara?
      ar_eg: مين الراجل ده؟ عسكري؟
      ar: من ذلك الرجل؟ أهو جندي؟
      en: Who's that man? Is he a soldier?
    - speaker: Rina
      text: Ya. Dia tidak bohong! Pengacaranya pintar.
      ar_eg: أيوه. ومش بيكدب! والمحامي بتاعه شاطر.
      ar: نعم، وهو لا يكذب! ومحاميه ذكي.
      en: Yes. He isn't lying! His lawyer is clever.
    - speaker: Raka
      text: Dan hakimnya?
      ar_eg: والقاضي؟
      ar: والقاضي؟
      en: And the judge?
    - speaker: Rina
      text: Hakimnya adil. Dan aktor itu terkenal sekali!
      ar_eg: القاضي عادل. والممثل ده مشهور جدًا!
      ar: القاضي عادل، وذلك الممثّل مشهور جدًا!
      en: The judge is fair. And that actor is really famous!
