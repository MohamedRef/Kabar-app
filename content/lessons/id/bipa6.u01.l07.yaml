schema: kabar.lesson/v1
id: bipa6.u01.l07
language: id
title: Surat dari rantau
can_do:
  ar_eg: تقرا مشهد جواب من الغربة وتفهم الحنين والرحيل اللي ورا الكلام.
  ar: أن تقرأ مشهد رسالة من الغربة وتفهم الحنين والرحيل وراء الكلمات.
  en: Read a scene about a letter from abroad and catch the longing and departure behind it.
slides:
  - title: Surat dari rantau
    body:
      ar_eg: |
        مشهد: أم في سيبولجا بتقرا جواب من ابنها اللي مسافر بقاله سنين.
        kepergian = رحيل (من pergi). kerinduan = حنين، شوق (من rindu). berkelana = يلف البلاد من غير وجهة.
        gemetar = بيترعش. menghela napas = يتنهد. tangisan = عياط (من tangis).
        hampa = فاضي من جوه. haru = متأثر لحد الدموع.
        الكاتب مش هيقول "كانت حزينة": هيوريك إيدها اللي بتترعش.
        - في الشارع: banget = sekali (أوي)، nangis = menangis (يعيّط)، nggak = tidak (لأ / مش)، aja = saja (بس / وخلاص)، kerasa = terasa (محسوس)، udah = sudah (خلاص / بالفعل).
      ar: |
        مشهد: أمّ في سيبولغا تقرأ رسالة من ابنها المغترب منذ سنين.
        kepergian = رحيل (من pergi). kerinduan = حنين وشوق (من rindu). berkelana = يجوب البلاد بلا وجهة.
        gemetar = يرتجف. menghela napas = يتنهّد. tangisan = بكاء (من tangis).
        hampa = خاوٍ من الداخل. haru = متأثر حتى الدموع.
        لن يقول الكاتب "كانت حزينة"، بل سيريك يدها المرتجفة.
        - في كلام الشارع: banget = sekali (جدًّا)، nangis = menangis (يبكي)، nggak = tidak (لا / ليس)، aja = saja (فقط)، kerasa = terasa (محسوس)، udah = sudah (قد / بالفعل).
      en: |
        Scene: a mother in Sibolga reads a letter from her son, away for years.
        kepergian = departure (from pergi). kerinduan = longing (from rindu). berkelana = to wander far.
        gemetar = to tremble. menghela napas = to sigh. tangisan = crying (from tangis).
        hampa = empty inside, hollow. haru = moved to tears.
        The writer won't say "she was sad"; he shows her trembling hand.
        - On the street: banget = sekali (very), nangis = menangis (to cry), nggak = tidak (no, not), aja = saja (just, only), kerasa = terasa (felt), udah = sudah (already).
    examples:
      - text: Tangannya gemetar ketika membuka surat itu.
        ar_eg: إيدها كانت بتترعش وهي بتفتح الجواب.
        ar: ارتجفت يدها وهي تفتح الرسالة.
        en: Her hand trembled as she opened the letter.
      - text: Sejak kepergian anaknya, rumah itu terasa hampa.
        ar_eg: من ساعة رحيل ابنها، البيت بقى فاضي من جوه.
        ar: منذ رحيل ابنها صار البيت خاويًا.
        en: Since her son left, the house has felt empty.
      - text: Dia menghela napas, penuh kerinduan.
        ar_eg: اتنهدت، مليانة حنين.
        ar: تنهّدت مليئةً بالحنين.
        en: She sighed, full of longing.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kepergian
        ar_eg: رحيل
        ar: رحيل
        en: departure
      - text: kerinduan
        ar_eg: حنين
        ar: حنين، شوق
        en: longing
      - text: berkelana
        ar_eg: يلف البلاد
        ar: يجوب البلاد
        en: to wander far
      - text: gemetar
        ar_eg: بيترعش
        ar: يرتجف
        en: to tremble
    words: [kepergian, kerinduan, berkelana, gemetar]
  - id: e02
    type: match_pairs
    pairs:
      - text: menghela
        ar_eg: يتنهد (menghela napas)
        ar: يتنهّد (menghela napas)
        en: to heave (a sigh)
      - text: tangisan
        ar_eg: عياط
        ar: بكاء
        en: crying
      - text: hampa
        ar_eg: فاضي من جوه
        ar: خاوٍ
        en: empty, hollow
      - text: haru
        ar_eg: متأثر
        ar: متأثر
        en: moved
    words: [menghela, tangisan, hampa, haru]
  - id: e03
    type: listen
    text: Dari kamar sebelah terdengar tangisan seorang ibu.
    question:
      ar_eg: سامعين إيه من الأوضة اللي جنب؟
      ar: ماذا يُسمع من الغرفة المجاورة؟
      en: What can be heard from the next room?
    options: [عياط, ضحك, غُنا]
    answer: 0
    meaning:
      ar_eg: من الأوضة اللي جنبنا كان فيه صوت عياط ست.
      ar: سُمع من الغرفة المجاورة بكاء أمّ.
      en: From the next room came a mother's crying.
    words: [tangisan]
  - id: e04
    type: fill_blank
    sentence: Sejak muda dia ___ dari kota ke kota tanpa tujuan.
    meaning:
      ar_eg: من وهو صغير بيـ ___ من بلد لبلد من غير هدف.
      ar: منذ شبابه وهو ___ من مدينة إلى مدينة بلا غاية.
      en: Since his youth he has ___ from town to town without aim.
    options: [berkelana, gemetar, menghela]
    answers: [berkelana]
    words: [berkelana, gemetar, menghela]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الكلمة اللي معناها الشوق لحد أو لمكان بعيد؟
      ar: ما الكلمة التي تعني الشوق إلى شخص أو مكان بعيد؟
      en: Which word means longing for a distant person or place?
    options: [kepergian, kerinduan, tangisan]
    answer: 1
    explain:
      ar_eg: kerinduan = حنين، من rindu.
      ar: kerinduan = حنين، من rindu.
      en: kerinduan = longing, from rindu.
    words: [kerinduan, kepergian, tangisan]
  - id: e06
    type: fill_blank
    sentence: Air matanya jatuh; dia ___ mendengar suara anaknya di telepon.
    meaning:
      ar_eg: دموعها نزلت؛ ___ لما سمعت صوت ابنها في التليفون.
      ar: سالت دموعها؛ ___ حين سمعت صوت ابنها في الهاتف.
      en: Her tears fell; she was ___ to hear her son's voice on the phone.
    options: [haru, hampa, gemetar]
    answers: [haru]
    words: [haru, hampa, gemetar]
  - id: e07
    type: multiple_choice
    question: Rumah besar itu sepi; hidupnya terasa ___.
    options: [haru, berkelana, hampa]
    answer: 2
    explain:
      ar_eg: بيت كبير فاضي وحياة من غير معنى = hampa.
      ar: بيت كبير خالٍ وحياة بلا معنى = hampa.
      en: A big empty house, a life without meaning = hampa.
    words: [hampa, haru, berkelana]
  - id: e08
    type: build_sentence
    source:
      ar_eg: اتنهدت تنهيدة طويلة وقريت الجواب تاني.
      ar: تنهّدت طويلًا وقرأت الرسالة مرة أخرى.
      en: She sighed deeply and read the letter again.
    answer: Dia menghela napas panjang dan membaca surat itu lagi.
    distractors: [gemetar, tangisan]
    words: [menghela]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kepergian anaknya meninggalkan kerinduan yang panjang.
    answers_meaning:
      ar_eg: [رحيل ابنها ساب حنين طويل, رحيل ابنها خلّاها مشتاقة لمدة طويلة]
      ar: [ترك رحيل ابنها حنينًا طويلًا, خلّف رحيل ابنها شوقًا طويلًا]
      en: ['Her son''s departure left a long longing', 'Her son''s leaving left her longing for a long time']
    words: [kepergian, kerinduan]
  - id: e10
    type: speaking
    text: Tangannya gemetar, lalu dia menghela napas.
    meaning:
      ar_eg: إيدها اترعشت، وبعدين اتنهدت.
      ar: ارتجفت يدها ثم تنهّدت.
      en: Her hand trembled, then she sighed.
    words: [gemetar, menghela]
dialogue:
  lines:
    - speaker: Bang Togar
      text: Cerpen ini pendek banget, tapi aku hampir nangis.
      ar_eg: القصة دي قصيرة أوي، بس أنا كنت هعيط.
      ar: هذه القصة قصيرة جدًا، لكنني كدت أبكي.
      en: This story is so short, but I almost cried.
    - speaker: Mohamed
      text: Ibunya nggak pernah bilang kalau dia sedih. Tangannya aja yang gemetar.
      ar_eg: أمه عمرها ما قالت إنها زعلانة. إيدها بس اللي بتترعش.
      ar: لم تقل الأم قط إنها حزينة. يدها فقط ترتجف.
      en: The mother never says she's sad. Only her hand trembles.
    - speaker: Bang Togar
      text: Dan tiap malam dia menghela napas di depan jendela.
      ar_eg: وكل ليلة بتتنهد قدام الشباك.
      ar: وكل ليلة تتنهّد أمام النافذة.
      en: And every night she sighs at the window.
    - speaker: Mohamed
      text: Anaknya berkelana sepuluh tahun. Kerinduannya kerasa di setiap kalimat.
      ar_eg: ابنها بيلف البلاد بقاله عشر سنين. الحنين باين في كل جملة.
      ar: يجوب ابنها البلاد منذ عشر سنين. الحنين محسوس في كل جملة.
      en: Her son has wandered for ten years. The longing is in every sentence.
    - speaker: Bang Togar
      text: 'Itulah orang Batak: kepergian udah biasa, tapi tetap berat.'
      ar_eg: 'هو ده الباتاك: الرحيل عادي عندنا، بس برضه تقيل.'
      ar: 'هكذا الباتاك: الرحيل مألوف، لكنه يبقى ثقيلًا.'
      en: 'That''s us Batak: leaving is normal, but it''s still heavy.'
