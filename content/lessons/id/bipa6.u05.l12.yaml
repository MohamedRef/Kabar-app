schema: kabar.lesson/v1
id: bipa6.u05.l12
language: id
title: Sambutan peringatan
can_do:
  ar_eg: تقول كلمة قصيرة ومحترمة في ذكرى التسونامي، فيها حزن وأمل.
  ar: أن تُلقي كلمة قصيرة لائقة في ذكرى التسونامي تجمع الحزن والأمل.
  en: Give a short, respectful speech at the tsunami memorial, with grief and hope.
slides:
  - title: Dua puluh enam Desember
    body:
      ar_eg: |
        كل سنة يوم ٢٦ ديسمبر، آتشيه بتفتكر التسونامي. كلمة الذكرى ليها ترتيب:
        - تحية: Assalamualaikum warahmatullahi wabarakatuh, dan salam sejahtera bagi kita semua.
        - mengheningkan cipta = دقيقة صمت: Mari kita mengheningkan cipta sejenak.
        - افتكر الـ almarhum والـ korban.
        - penyintas = الناجي (اللي عدّى بالكارثة وعاش). اشكرهم واشكر الـ relawan.
        - اختم بأمل: Mari kita bangkit bersama.
        - في الشارع: kasih = memberi (يدّي)، aku / -ku = saya (أنا)، terus = lalu (وبعدين)، gitu = begitu (كده)، udah = sudah (خلاص / بالفعل).
      ar: |
        تستذكر آتشيه التسونامي في ٢٦ ديسمبر من كلّ عام، ولكلمة الذكرى ترتيب:
        - التحية: Assalamualaikum warahmatullahi wabarakatuh, dan salam sejahtera bagi kita semua.
        - mengheningkan cipta = الوقوف دقيقة صمت: Mari kita mengheningkan cipta sejenak.
        - تذكّر الـ almarhum والـ korban.
        - penyintas = الناجي من الكارثة؛ فاشكر الناجين والـ relawan.
        - واختم بالأمل: Mari kita bangkit bersama.
        - في كلام الشارع: kasih = memberi (يعطي)، aku / -ku = saya (أنا)، terus = lalu (ثمّ)، gitu = begitu (هكذا)، udah = sudah (قد / بالفعل).
      en: |
        Every 26 December, Aceh remembers the tsunami. A memorial speech has an order:
        - Greeting: Assalamualaikum warahmatullahi wabarakatuh, dan salam sejahtera bagi kita semua.
        - mengheningkan cipta = a moment of silence: Mari kita mengheningkan cipta sejenak.
        - Remember the almarhum and the korban.
        - penyintas = survivor. Thank the survivors and the relawan.
        - Close with hope: Mari kita bangkit bersama.
        - On the street: kasih = memberi (to give), aku / -ku = saya (I), terus = lalu (then), gitu = begitu (like that), udah = sudah (already).
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الكلمة بتبدأ بـ «salam sejahtera» بعد «Assalamualaikum»؟
      ar: لماذا تأتي «salam sejahtera» بعد «Assalamualaikum»؟
      en: Why does the speech add "salam sejahtera" after "Assalamualaikum"?
    options:
      - عشان الكلمة تطول.
      - عشان تحيي الحاضرين من كل الأديان.
      - عشان دي تحية الصبح بس.
    answer: 1
    words: [salam sejahtera]
  - id: e02
    type: listen
    text: Mari kita mengheningkan cipta sejenak untuk para korban.
    question:
      ar_eg: المتكلم بيطلب إيه؟
      ar: ماذا يطلب المتكلّم؟
      en: What is the speaker asking for?
    options:
      - تصقيف.
      - غنوة.
      - لحظة صمت للضحايا.
    answer: 2
    words: [mengheningkan cipta, korban]
  - id: e03
    type: fill_blank
    sentence: Para ___ tsunami bercerita tentang hari yang tidak terlupakan itu.
    meaning:
      ar_eg: الناجين من التسونامي حكوا عن اليوم اللي مايتنسيش ده.
      ar: روى الناجون من التسونامي ذلك اليوم الذي لا يُنسى.
      en: The tsunami survivors told of that unforgettable day.
    options: [penyintas, relawan, almarhum]
    answers: [penyintas]
    words: [penyintas]
  - id: e04
    type: build_sentence
    source:
      ar_eg: يلا نقوم مع بعض.
      ar: هيّا ننهض معًا.
      en: Let us rise together.
    answer: Mari kita bangkit bersama.
    distractors: [hening, korban]
    words: [bangkit]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بنشكر كل المتطوعين اللي ساعدوا آتشيه.
      ar: نشكر جميع المتطوّعين الذين ساعدوا آتشيه.
      en: We thank all the volunteers who helped Aceh.
    answers:
      - Kami mengucapkan terima kasih kepada semua relawan yang membantu Aceh.
      - Kami berterima kasih kepada semua relawan yang membantu Aceh.
      - Terima kasih kepada semua relawan yang telah membantu Aceh.
      - Terima kasih kepada semua relawan yang membantu Aceh.
    words: [relawan]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: «penyintas» يعني مين؟
      ar: من «penyintas»؟
      en: Who is a "penyintas"?
    options:
      - اللي نجى من كارثة.
      - اللي مات في الكارثة.
      - اللي كتب عن الكارثة.
    answer: 0
    words: [penyintas]
  - id: e07
    type: speaking
    text: Kita mengenang almarhum dan almarhumah dengan doa, bukan hanya dengan tangisan.
    meaning:
      ar_eg: إحنا بنفتكر اللي ماتوا بالدعا، مش بالدموع بس.
      ar: نتذكّر الراحلين والراحلات بالدعاء، لا بالدموع وحدها.
      en: We remember the departed with prayer, not only with tears.
    words: [mengenang, almarhum]
  - id: e08
    type: dictation
    text: Para hadirin diminta berdiri untuk mengheningkan cipta.
    meaning:
      ar_eg: الحاضرين اتطلب منهم يقفوا دقيقة صمت.
      ar: طُلب من الحاضرين الوقوف دقيقة صمت.
      en: The audience was asked to stand for a moment of silence.
    words: [mengheningkan cipta]
  - id: e09
    type: fill_blank
    sentence: Dua puluh tahun kemudian, para penyintas sudah ___ dan membangun kembali kota mereka.
    meaning:
      ar_eg: بعد عشرين سنة، الناجين قاموا تاني وبنوا مدينتهم من جديد.
      ar: بعد عشرين عامًا نهض الناجون وأعادوا بناء مدينتهم.
      en: Twenty years on, the survivors have risen and rebuilt their city.
    options: [bangkit, berlutut, surut]
    answers: [bangkit]
    words: [bangkit, penyintas]
  - id: e10
    type: speaking
    text: Salam sejahtera bagi kita semua. Mari kita mengheningkan cipta sejenak.
    meaning:
      ar_eg: السلام علينا كلنا. يلا نقف دقيقة صمت.
      ar: السلام علينا جميعًا. لنقف دقيقة صمت.
      en: Peace be upon us all. Let us observe a moment of silence.
    words: [salam sejahtera, mengheningkan cipta]
dialogue:
  title: Latihan sambutan
  lines:
    - speaker: Kak Rahmah
      text: Mohamed, kamu diminta kasih sambutan singkat sebagai relawan dari luar negeri.
      ar_eg: يا محمد، طلبوا منك تقول كلمة قصيرة كمتطوع من برّه.
      ar: يا محمد، طُلب منك أن تُلقي كلمة قصيرة متطوّعًا من الخارج.
      en: Mohamed, you've been asked to give a short speech as a volunteer from abroad.
    - speaker: Mohamed
      text: Aku mulai dengan salam, terus kita mengheningkan cipta. Gitu?
      ar_eg: أبدأ بالتحية، وبعدين دقيقة صمت. كده؟
      ar: أبدأ بالتحية، ثم نقف دقيقة صمت. أهكذا؟
      en: I start with the greeting, then we have a moment of silence. Like that?
    - speaker: Kak Rahmah
      text: Iya. Terus sebut para penyintas. Banyak dari mereka akan hadir.
      ar_eg: أيوه. وبعدين اذكر الناجين. كتير منهم هيبقوا موجودين.
      ar: نعم، ثم اذكر الناجين، فكثير منهم سيحضرون.
      en: Yes. Then mention the survivors. Many of them will be there.
    - speaker: Mohamed
      text: Dan aku tutup dengan harapan. Aceh udah bangkit, dan akan terus bangkit.
      ar_eg: وأختم بالأمل. آتشيه قامت، وهتفضل تقوم.
      ar: 'وأختم بالأمل: لقد نهضت آتشيه، وستواصل النهوض.'
      en: And I'll close with hope. Aceh has risen, and will keep rising.
new_words:
  - word: mengheningkan cipta
    pos: phrase
    ar_eg: دقيقة صمت
    ar: الوقوف دقيقة صمت
    en: to observe a moment of silence
  - word: penyintas
    pos: noun
    ar_eg: الناجي
    ar: الناجي
    en: survivor
