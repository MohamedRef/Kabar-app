schema: kabar.lesson/v1
id: bipa7.u06.l05
language: id
title: Jejak digital
can_do:
  ar_eg: تحمي بياناتك أونلاين وتكتشف اللينك المشبوه قبل ما تدوس عليه.
  ar: أن تحمي بياناتك على الإنترنت وتكشف الرابط المريب قبل فتحه.
  en: Protect your data online and spot a suspicious link before you tap it.
slides:
  - title: Jangan klik dulu!
    body:
      ar_eg: |
        كل حاجة بتنزلها أونلاين بتسيب jejak digital (أثر رقمي) صعب يتمسح.
        - data pribadi = بياناتك الشخصية: رقم البطاقة، العنوان، التليفون
        - peretas = هاكر: حد بيحاول يسرق حسابك
        - tautan = لينك / رابط
        - mencurigakan = مشبوه / يخوّف
        رسالة زي «Selamat! Anda menang hadiah. Klik tautan ini» غالبًا من peretas.
        القاعدة: ماتديش حد كود الـ OTP، ولا حتى لو قال إنه من البنك.
        إندونيسيا عندها قانون لحماية البيانات الشخصية من سنة ٢٠٢٢ (UU PDP).
        - في الكلام: nggak = tidak.
      ar: |
        كلّ ما تنشره على الإنترنت يترك jejak digital (أثرًا رقميًّا) يصعب محوه.
        - data pribadi = بياناتك الشخصية: رقم الهوية والعنوان والهاتف
        - peretas = مخترق (هاكر) يحاول سرقة حسابك
        - tautan = رابط
        - mencurigakan = مريب
        ورسالة مثل «Selamat! Anda menang hadiah. Klik tautan ini» غالبًا من peretas.
        والقاعدة: لا تعطِ أحدًا رمز OTP، ولو زعم أنّه من المصرف.
        ولإندونيسيا قانون لحماية البيانات الشخصية منذ ٢٠٢٢ (UU PDP).
        - في الكلام اليومي: nggak = tidak.
      en: |
        Everything you post online leaves a jejak digital (digital footprint) that's hard to erase.
        - data pribadi = personal data: ID number, address, phone
        - peretas = hacker, someone trying to steal your account
        - tautan = link
        - mencurigakan = suspicious
        A message like "Selamat! Anda menang hadiah. Klik tautan ini" is usually from a peretas.
        The rule: never give anyone your OTP code, even if they say they're from the bank.
        Indonesia has had a personal data protection law since 2022 (UU PDP).
        - In speech: nggak = tidak.
    examples:
      - text: Tautan itu mencurigakan. Alamatnya bukan situs resmi bank.
        ar_eg: اللينك ده مشبوه. عنوانه مش موقع البنك الرسمي.
        ar: هذا الرابط مريب، فعنوانه ليس موقع المصرف الرسميّ.
        en: That link is suspicious. Its address isn't the bank's official site.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jejak digital
        ar_eg: أثر رقمي
        ar: أثر رقميّ
        en: digital footprint
      - text: data pribadi
        ar_eg: بيانات شخصية
        ar: بيانات شخصية
        en: personal data
      - text: peretas
        ar_eg: هاكر
        ar: مخترق
        en: hacker
      - text: tautan
        ar_eg: لينك
        ar: رابط
        en: link
      - text: mencurigakan
        ar_eg: مشبوه
        ar: مريب
        en: suspicious
    words: [jejak digital, data pribadi, peretas, tautan, mencurigakan]
  - id: e02
    type: listen
    text: Jangan pernah memberikan kode OTP kepada siapa pun, termasuk orang yang mengaku dari bank.
    question:
      ar_eg: النصيحة إيه؟
      ar: ما النصيحة؟
      en: What's the advice?
    options:
      - ابعت الكود للبنك بس.
      - غيّر تليفونك كل شهر.
      - ماتديش كود الـ OTP لأي حد خالص.
    answer: 2
    words: [data pribadi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: جاتلك رسالة «كسبت جايزة! دوس على اللينك». تعمل إيه؟
      ar: وصلتك رسالة «ربحت جائزة! اضغط الرابط». ماذا تفعل؟
      en: You get "You won a prize! Tap the link". What do you do?
    options:
      - مادوسش عليه، اللينك ده مشبوه.
      - أدوس بسرعة قبل ما الجايزة تخلص.
      - أبعته لكل صحابي.
    answer: 0
    words: [tautan, mencurigakan]
  - id: e04
    type: fill_blank
    sentence: Seorang ___ mencuri kata sandi dan masuk ke akun Instagram saya.
    meaning:
      ar_eg: هاكر سرق الباسوورد ودخل على حسابي في إنستجرام.
      ar: سرق مخترق كلمة المرور ودخل حسابي على إنستغرام.
      en: A hacker stole my password and got into my Instagram account.
    options: [peretas, pemengaruh, pengikut]
    answers: [peretas]
    words: [peretas, kata sandi]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الأثر الرقمي صعب يتمسح.
      ar: يصعب محو الأثر الرقميّ.
      en: A digital footprint is hard to erase.
    answer: Jejak digital sulit dihapus.
    distractors: [tautan, peretas]
    words: [jejak digital]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي حاجة من دول data pribadi؟
      ar: أيّ ممّا يلي من الـ data pribadi؟
      en: Which of these is data pribadi?
    options:
      - لون السما النهارده.
      - رقم بطاقتك وعنوان بيتك.
      - اسم عاصمة إندونيسيا.
    answer: 1
    words: [data pribadi]
  - id: e07
    type: translate
    direction: from_target
    source_text: Foto yang kamu unggah hari ini menjadi jejak digital untuk bertahun-tahun.
    answers_meaning:
      ar_eg:
        - الصورة اللي بتنزّلها النهارده بتبقى أثر رقمي لسنين.
        - الصورة اللي تحطّها النهارده هتفضل أثر رقمي سنين قدّام.
      ar:
        - تصبح الصورة التي تنشرها اليوم أثرًا رقميًّا لسنوات.
        - الصورة التي ترفعها اليوم تبقى أثرًا رقميًّا سنين طويلة.
      en:
        - The photo you post today becomes a digital footprint for years.
        - A photo you upload today stays as a digital footprint for years.
    words: [jejak digital]
  - id: e08
    type: speaking
    text: Pesan ini mencurigakan. Tautannya aneh dan pengirimnya tidak saya kenal.
    meaning:
      ar_eg: الرسالة دي مشبوهة. اللينك غريب وأنا مش عارف اللي باعتها.
      ar: هذه الرسالة مريبة، فرابطها غريب ومرسلها مجهول لديّ.
      en: This message is suspicious. The link is strange and I don't know the sender.
    words: [mencurigakan, tautan, pesan]
  - id: e09
    type: dictation
    text: Peretas sering mencari data pribadi lewat tautan palsu.
    meaning:
      ar_eg: الهاكرز كتير بيدوّروا على البيانات الشخصية عن طريق لينكات مزيّفة.
      ar: كثيرًا ما يبحث المخترقون عن البيانات الشخصية عبر روابط مزيّفة.
      en: Hackers often fish for personal data through fake links.
    words: [peretas, data pribadi, tautan]
  - id: e10
    type: fill_blank
    sentence: Nomor pengirimnya dari luar negeri. Itu sangat ___.
    meaning:
      ar_eg: رقم الراسل من برّه البلد. ده مشبوه جدًا.
      ar: رقم المرسل من خارج البلاد، وهذا مريب جدًّا.
      en: The sender's number is from abroad. That's very suspicious.
    options: [mencurigakan, lestari, ringkas]
    answers: [mencurigakan]
    words: [mencurigakan]
dialogue:
  title: Hadiah sepeda motor
  lines:
    - speaker: Mohamed
      text: Kak Selvi, aku dapat pesan. Katanya aku menang sepeda motor! Tinggal klik tautan.
      ar_eg: يا كاك سيلفي، جاتلي رسالة. بيقولوا إني كسبت موتوسيكل! بس أدوس على اللينك.
      ar: يا كاك سيلفي، وصلتني رسالة تقول إنّي ربحت درّاجة نارية! ما عليّ إلا فتح الرابط.
      en: Kak Selvi, I got a message. It says I won a motorbike! I just have to tap the link.
    - speaker: Kak Selvi
      text: Tunggu! Itu mencurigakan. Kamu nggak pernah ikut undian, kan?
      ar_eg: استنّى! ده مشبوه. إنت عمرك ما دخلت سحب، صح؟
      ar: انتظر! هذا مريب. لم تشترك في أيّ سحب، أليس كذلك؟
      en: Wait! That's suspicious. You never entered a draw, did you?
    - speaker: Mohamed
      text: Nggak pernah. Mereka juga minta nomor KTP dan kode OTP-ku.
      ar_eg: خالص. وكمان طالبين رقم بطاقتي وكود الـ OTP.
      ar: أبدًا، ويطلبون أيضًا رقم هويّتي ورمز OTP.
      en: Never. They're also asking for my ID number and OTP code.
    - speaker: Kak Selvi
      text: Itu cara peretas mencuri data pribadi. Hapus pesannya dan blokir nomornya.
      ar_eg: دي طريقة الهاكرز علشان يسرقوا البيانات الشخصية. امسح الرسالة واعمل بلوك للرقم.
      ar: تلك حيلة المخترقين لسرقة البيانات الشخصية، فاحذف الرسالة واحظر الرقم.
      en: That's how hackers steal personal data. Delete the message and block the number.
