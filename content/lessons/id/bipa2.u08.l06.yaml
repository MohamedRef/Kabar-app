schema: kabar.lesson/v1
id: bipa2.u08.l06
language: id
title: Pesan suara dari Raka
can_do:
  ar_eg: تسمع رسالة صوتية فيها طريق الرحلة وتفهم تركب إيه وبعدين إيه.
  ar: أن تفهم رسالة صوتية تشرح طريق الرحلة بالترتيب.
  en: Follow travel directions in a voice message.
slides:
  - title: Pesan suara dari Raka
    body:
      ar_eg: |
        راكا بعتلك رسالة صوتية (pesan suara) عشان تيجي له بِدوجول بكرة. المرة دي اسمع الأول من غير ما تقرا.
        ركّز على كلمات الترتيب: pertama، lalu، ketika. وفيه كلمتين جداد: dingin (برد) و jaket (جاكت)، عشان بدوجول فوق الجبل وجوّها ساقع.
        في الشارع بيقولوا:
        - udah = sudah (خلاص، بقى)
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
        - aku و-ku = saya (أنا، ـي) مع الأصحاب واللي في سنك؛ مع الكبار والغُرب saya
      ar: |
        أرسل لك راكا رسالة صوتية (pesan suara) لتلحق به في بِدوغول غدًا. هذه المرة استمع أولًا دون قراءة.
        انتبه إلى كلمات الترتيب: pertama، lalu، ketika. وهناك كلمتان جديدتان: dingin (بارد) و jaket (سترة)، لأن بدوغول في الجبال وجوّها بارد.
        في كلام الشارع:
        - udah = sudah (قد، بالفعل)
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
        - aku و-ku = saya (أنا، ـي) مع الأصدقاء والأقران؛ ومع الكبار والغرباء saya
      en: |
        Raka sent you a voice message (pesan suara) so you can meet him in Bedugul tomorrow. This time, listen first, without reading.
        Listen for the order words: pertama, lalu, ketika. Two new words: dingin (cold) and jaket (jacket) — Bedugul is up in the mountains and it's cool there.
        On the street:
        - udah = sudah (already)
        - banget = sekali (very), after the adjective just like sekali
        - aku / -ku = saya (I, my) with friends and people your age; saya with elders and strangers
exercises:
  - id: e01
    type: listen
    text: Pertama, kamu naik angkot ke terminal.
    question:
      ar_eg: محمد يروح المحطة (terminal) بإيه؟
      ar: بماذا يذهب محمد إلى المحطة (terminal)؟
      en: How does Mohamed get to the bus terminal?
    options: [naik ojek, naik angkot, naik bus]
    answer: 1
    meaning:
      ar_eg: الأول، اركب ميكروباص لحد موقف الأتوبيسات.
      ar: أولًا، اركب الحافلة الصغيرة إلى محطة الحافلات.
      en: First, take an angkot to the bus terminal.
    words: [pertama, angkot, terminal]
  - id: e02
    type: listen
    text: Lalu, kamu naik bus ke Bedugul. Busnya bolak-balik dari Denpasar ke Bedugul.
    question:
      ar_eg: الأتوبيس رايح جاي بين أنهي مكانين؟
      ar: بين أيّ مكانين تذهب الحافلة وتعود؟
      en: Between which two places does the bus go back and forth?
    options: [Denpasar dan Bedugul, Sanur dan Bedugul, Denpasar dan Ubud]
    answer: 0
    meaning:
      ar_eg: بعدين اركب الأتوبيس لبدوجول. الأتوبيس رايح جاي من دنباسار لبدوجول.
      ar: ثم اركب الحافلة إلى بدوغول. الحافلة تذهب وتعود بين دنباسار وبدوغول.
      en: Then take the bus to Bedugul. The bus goes back and forth between Denpasar and Bedugul.
    words: [lalu, bolak-balik]
  - id: e03
    type: listen
    text: Ketika kamu sampai di Bedugul, aku tunggu di dekat danau.
    question:
      ar_eg: راكا هيستنّى فين؟
      ar: أين سينتظر راكا؟
      en: Where will Raka wait?
    options: [di terminal, di dekat danau, di hotel]
    answer: 1
    meaning:
      ar_eg: لما توصل بدوجول، هستناك جنب البحيرة.
      ar: عندما تصل إلى بدوغول، سأنتظرك قرب البحيرة.
      en: When you get to Bedugul, I'll wait near the lake.
    words: [ketika, danau, tunggu]
  - id: e04
    type: listen
    text: Jangan lupa bawa jaket, ya! Kata berita, di Bedugul dingin.
    question:
      ar_eg: محمد لازم ياخد معاه إيه؟
      ar: ماذا يجب أن يأخذ محمد معه؟
      en: What should Mohamed bring?
    options: [payung, helm, jaket]
    answer: 2
    meaning:
      ar_eg: ما تنساش تجيب جاكت! الأخبار بتقول بدوجول برد.
      ar: لا تنسَ أن تحضر سترة! تقول الأخبار إن الجو بارد في بدوغول.
      en: Don't forget to bring a jacket! The news says it's cold in Bedugul.
    words: [jaket, dingin, berita, jangan, lupa]
  - id: e05
    type: match_pairs
    pairs:
      - text: dingin
        ar_eg: برد، ساقع
        ar: بارد
        en: cold
      - text: jaket
        ar_eg: جاكت
        ar: سترة
        en: jacket
      - text: bolak-balik
        ar_eg: رايح جاي
        ar: ذهابًا وإيابًا
        en: back and forth
      - text: danau
        ar_eg: بحيرة
        ar: بحيرة
        en: lake
      - text: terminal
        ar_eg: موقف أتوبيسات
        ar: محطة حافلات
        en: bus terminal
    words: [dingin, jaket, bolak-balik, danau, terminal]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: حسب الرسالة، محمد هيركب إيه بالترتيب؟
      ar: بحسب الرسالة، ماذا سيركب محمد بالترتيب؟
      en: According to the message, what will Mohamed take, in order?
    options:
      - "Pertama angkot, lalu bus."
      - "Pertama bus, lalu angkot."
      - "Pertama ojek, lalu bus."
    answer: 0
    words: [pertama, lalu]
    explain:
      ar_eg: الرسالة بتقول «Pertama, kamu naik angkot ke terminal» وبعدين الأتوبيس لبدوجول.
      ar: تقول الرسالة «Pertama, kamu naik angkot ke terminal» ثم الحافلة إلى بدوغول.
      en: The message says "Pertama, kamu naik angkot ke terminal", then the bus to Bedugul.
  - id: e07
    type: fill_blank
    sentence: Di Bedugul ___ sekali, jadi saya pakai jaket.
    meaning:
      ar_eg: في بدوجول برد أوي، فأنا لابس جاكت.
      ar: الجو بارد جدًا في بدوغول، لذلك ألبس سترة.
      en: It's very cold in Bedugul, so I'm wearing a jacket.
    answers: [dingin]
    words: [dingin, jaket]
    explain:
      ar_eg: dingin = برد، وعشان كده الجاكت.
      ar: dingin = بارد، ولذلك السترة.
      en: dingin = cold, hence the jacket.
  - id: e08
    type: build_sentence
    source:
      ar_eg: الأخبار بتقول بدوجول برد أوي.
      ar: تقول الأخبار إن بدوغول باردة جدًا.
      en: The news says Bedugul is very cold.
    answer: Kata berita, Bedugul dingin sekali.
    distractors: [sambil, ketika]
    words: [berita, dingin]
    explain:
      ar_eg: kata berita = على حسب الأخبار (زي kata Rina). sambil = وأنا بـ…، وketika = لما.
      ar: kata berita = بحسب الأخبار (مثل kata Rina). أما sambil فـ«في أثناء» وketika «عندما».
      en: kata berita = according to the news (like kata Rina). sambil is "while", ketika "when".
  - id: e09
    type: dictation
    text: Kata berita, besok hujan di Bedugul.
    meaning:
      ar_eg: الأخبار بتقول بكرة هتمطر في بدوجول.
      ar: تقول الأخبار إنها ستمطر غدًا في بدوغول.
      en: The news says it'll rain in Bedugul tomorrow.
    words: [berita]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ما تنساش تجيب جاكت!
      ar: لا تنسَ أن تحضر سترة!
      en: Don't forget to bring a jacket!
    answers:
      - Jangan lupa bawa jaket!
      - Jangan lupa bawa jaket
      - Jangan lupa bawa jaket.
      - Jangan lupa bawa jaket, ya!
      - Jangan lupa bawa jaket, ya.
      - Jangan lupa membawa jaket!
      - Jangan lupa membawa jaket
      - Jangan lupa membawa jaket.
      - Jangan lupa membawa jaket, ya!
    words: [jaket, jangan, lupa]
dialogue:
  title: Telepon dari terminal
  lines:
    - speaker: Mohamed
      text: Halo, Raka! Aku udah di terminal.
      ar_eg: ألو يا راكا! أنا وصلت الموقف.
      ar: مرحبًا يا راكا! أنا الآن في المحطة.
      en: Hi, Raka! I'm at the terminal now.
    - speaker: Raka
      text: Bagus! Sekarang naik bus ke Bedugul, ya.
      ar_eg: حلو! دلوقتي اركب الأتوبيس لبدوجول.
      ar: جيد! الآن اركب الحافلة إلى بدوغول.
      en: Great! Now take the bus to Bedugul.
    - speaker: Mohamed
      text: Di sini banyak bus. Yang mana?
      ar_eg: هنا فيه أتوبيسات كتير. أنهي واحد؟
      ar: هنا حافلات كثيرة. أيّها؟
      en: There are lots of buses here. Which one?
    - speaker: Raka
      text: Yang biru, di sebelah loket.
      ar_eg: الأزرق، اللي جنب الشباك بتاع التذاكر.
      ar: الزرقاء، التي بجانب شباك التذاكر.
      en: The blue one, next to the ticket window.
    - speaker: Mohamed
      text: Oke. Aku juga udah bawa jaket.
      ar_eg: تمام. وأنا كمان جبت الجاكت.
      ar: حسنًا. وقد أحضرت السترة أيضًا.
      en: OK. And I've brought a jacket too.
    - speaker: Raka
      text: Bagus! Di sini dingin banget. Sampai nanti!
      ar_eg: حلو! هنا برد أوي. أشوفك بعدين!
      ar: جيد! الجو هنا بارد جدًا. إلى اللقاء!
      en: Good! It's really cold here. See you soon!
