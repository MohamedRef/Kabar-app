schema: kabar.lesson/v1
id: bipa3.u01.l03
language: id
title: Kepada dan untuk
can_do:
  ar_eg: تقول التهنئة رايحة لمين، معمولة عشان مين، وبتتكلم عن إيه.
  ar: أن تقول لمن تُوجَّه التهنئة، ولأجل مَن، وعمّا تتحدث.
  en: Say who a wish is for and what it is about.
slides:
  - title: ke atau kepada? untuk!
    grammar: id.preposition.extended
    body:
      ar_eg: |
        ke للمكان (ke Mataram)، و kepada للبني آدم: mengucapkan selamat kepada Pak Irwan = يقول التهنئة لأستاذ إروان.
        untuk = عشان / لـ، للهدية أو الغرض: Kartu ini untuk Bu Yanti = الكارت ده لمدام يانتي.
        العربي عنده «لـ» واحدة للاتنين. اسأل نفسك: حاجة رايحة لحد؟ kepada. معمولة عشانه؟ untuk.
      ar: |
        ke للمكان (ke Mataram)، وkepada للأشخاص: mengucapkan selamat kepada Pak Irwan = يهنّئ الأستاذ إروان.
        untuk = لأجل / لـ، للهدية أو الغاية: Kartu ini untuk Bu Yanti = هذه البطاقة للسيدة يانتي.
        اللام العربية تؤدي المعنيين؛ فاسأل: هل يتجه الشيء إلى شخص (kepada) أم يُصنع لأجله (untuk)؟
      en: |
        ke is for places (ke Mataram); kepada is for people: mengucapkan selamat kepada Pak Irwan = to congratulate Pak Irwan.
        untuk = for (a gift or a purpose): Kartu ini untuk Bu Yanti = This card is for Bu Yanti.
        Arabic لـ covers both. Ask: is something directed to someone (kepada) or done for them (untuk)?
    examples:
      - text: Saya mengucapkan selamat Lebaran kepada Pak Irwan.
        ar_eg: بقول لأستاذ إروان كل سنة وانت طيب.
        ar: أهنّئ الأستاذ إروان بالعيد.
        en: I wish Pak Irwan a happy Eid.
      - text: Kartu ucapan ini untuk Bu Yanti.
        ar_eg: كارت التهنئة ده لمدام يانتي.
        ar: بطاقة التهنئة هذه للسيدة يانتي.
        en: This greeting card is for Bu Yanti.
  - title: bagi dan tentang
    grammar: id.preposition.extended
    body:
      ar_eg: |
        bagi = بالنسبة لـ / لـ، أرسم شوية من untuk: Bagi saya … = بالنسبة لي …
        tentang = عن (الموضوع)، مش dari: bercerita tentang Lebaran = يحكي عن العيد.
        وكلمة umat من العربي «أمة»: umat Islam = المسلمين.
      ar: |
        bagi = بالنسبة إلى / لـ، وهي أرسم قليلًا من untuk: Bagi saya … = بالنسبة إليّ …
        tentang = عن (الموضوع)، لا dari: bercerita tentang Lebaran = يتحدث عن العيد.
        وكلمة umat من العربية «أمّة»: umat Islam = المسلمون.
      en: |
        bagi = for / as for, a bit more formal than untuk: Bagi saya … = For me …
        tentang = about (a topic), not dari: bercerita tentang Lebaran = to talk about Eid.
        umat comes from Arabic «أمة»: umat Islam = the Muslim community.
    examples:
      - text: Bagi umat Islam, Lebaran adalah hari besar.
        ar_eg: بالنسبة للمسلمين، العيد يوم كبير.
        ar: العيد عند المسلمين يوم عظيم.
        en: For Muslims, Eid is a great day.
      - text: Rina bercerita tentang Lebaran di Lombok.
        ar_eg: رينا بتحكي عن العيد في لومبوك.
        ar: تتحدث رينا عن العيد في لومبوك.
        en: Rina talks about Eid in Lombok.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kepada
        ar_eg: لـ / إلى (لشخص)
        ar: إلى (شخص)
        en: to (a person)
      - text: bagi
        ar_eg: بالنسبة لـ
        ar: بالنسبة إلى
        en: for, as for
      - text: tentang
        ar_eg: عن
        ar: عن
        en: about
      - text: mengucapkan
        ar_eg: يقول (تهنئة / شكر)
        ar: يقدّم (تهنئة / شكرًا)
        en: to express (wishes, thanks)
      - text: umat
        ar_eg: أمة، جماعة المؤمنين
        ar: أمّة
        en: community (of believers)
      - text: ucapan
        ar_eg: تهنئة، كلام
        ar: تهنئة، عبارة
        en: greeting, words of wishes
    words: [kepada, bagi, tentang, mengucapkan, umat, ucapan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: "أنهي جملة صح في الكتابة: «ببعت كارت لمدام يانتي»؟"
      ar: "أيّ جملة صحيحة في الكتابة: «أرسل بطاقة إلى السيدة يانتي»؟"
      en: 'Which is right in writing: "I send a card to Bu Yanti"?'
    options: ["Saya mengirim kartu ke Bu Yanti.", "Saya mengirim kartu kepada Bu Yanti.", "Saya mengirim kartu tentang Bu Yanti."]
    answer: 1
    explain:
      ar_eg: للناس في الكتابة kepada. ke بتتقال في الكلام بس، و tentang = عن.
      ar: للأشخاص في الكتابة kepada؛ وke عامّية، وtentang = عن.
      en: For people, writing uses kepada; ke + person is casual only, and tentang means "about".
    words: [kepada]
  - id: e03
    type: listen
    text: Bagi umat Islam, Lebaran adalah hari besar.
    options: ["Bagi umat Islam, Lebaran adalah hari baru.", "Bagi umat Islam, Lebaran adalah hari besar.", "Bagi orang Islam, Lebaran adalah hari libur."]
    answer: 1
    meaning:
      ar_eg: بالنسبة للمسلمين، العيد يوم كبير.
      ar: العيد عند المسلمين يوم عظيم.
      en: For Muslims, Eid is a great day.
    words: [bagi, umat]
  - id: e04
    type: fill_blank
    sentence: Pak Irwan bercerita ___ Pulau Lombok.
    meaning:
      ar_eg: أستاذ إروان بيحكي عن جزيرة لومبوك.
      ar: يتحدث الأستاذ إروان عن جزيرة لومبوك.
      en: Pak Irwan talks about the island of Lombok.
    options: [kepada, tentang, untuk]
    answers: [tentang]
    words: [tentang]
    explain:
      ar_eg: «يحكي عن» = bercerita tentang. kepada لحد بتكلمه، وuntuk = عشان / لـ.
      ar: «يتحدث عن» bercerita tentang. أما kepada فلمن تخاطبه، وuntuk للغرض أو المستفيد.
      en: "\"Talk about\" is bercerita tentang. kepada is for the person you address, untuk for whom something is meant."
  - id: e05
    type: fill_blank
    sentence: Ini kartu ___ Lebaran dari kami.
    meaning:
      ar_eg: ده كارت تهنئة بالعيد مننا.
      ar: هذه بطاقة تهنئة بالعيد منّا.
      en: This is an Eid greeting card from us.
    options: [umat, ucapan, tentang]
    answers: [ucapan]
    words: [ucapan]
    explain:
      ar_eg: كارت تهنئة = kartu ucapan. umat = أمّة / جماعة، وtentang = عن.
      ar: بطاقة التهنئة kartu ucapan. أما umat فالأمّة، وtentang بمعنى «عن».
      en: A greeting card is kartu ucapan. umat means a religious community, tentang means about.
  - id: e06
    type: build_sentence
    source:
      ar_eg: رينا بعتت كارت تهنئة لأستاذ إروان.
      ar: أرسلت رينا بطاقة تهنئة إلى الأستاذ إروان.
      en: Rina sent a greeting card to Pak Irwan.
    answer: Rina mengirim kartu ucapan kepada Pak Irwan.
    distractors: [tentang, bagi]
    words: [ucapan, kepada]
    explain:
      ar_eg: "بنبعت kepada حد، فالجملة: mengirim kartu ucapan kepada Pak Irwan. tentang = عن، وbagi = بالنسبة لـ."
      ar: "نرسل kepada شخص: mengirim kartu ucapan kepada Pak Irwan. أما tentang فـ«عن»، وbagi «بالنسبة إلى»."
      en: "You send something kepada someone: mengirim kartu ucapan kepada Pak Irwan. tentang means about, bagi means for / to (someone's view)."
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بالنسبة للمسلمين، العيد يوم كبير.
      ar: العيد عند المسلمين يوم عظيم.
      en: For Muslims, Eid is a great day.
    answers:
      - Bagi umat Islam, Lebaran adalah hari besar.
      - Bagi umat Islam, Lebaran adalah hari besar
      - Bagi umat Islam, Lebaran hari besar.
      - Bagi umat Islam, Idulfitri adalah hari besar.
      - Bagi umat Islam, Idulfitri hari besar.
      - Lebaran adalah hari besar bagi umat Islam.
      - Idulfitri adalah hari besar bagi umat Islam.
      - Bagi umat Muslim, Lebaran adalah hari besar.
      - Bagi orang Islam, Lebaran adalah hari besar.
    words: [bagi, umat]
  - id: e08
    type: multiple_choice
    question: Saya ___ terima kasih kepada Ibu dan Bapak.
    options: [tentang, mengucapkan, ucapan]
    answer: 1
    explain:
      ar_eg: "محتاجين فعل هنا: mengucapkan terima kasih = يقول شكرًا. ucapan اسم."
      ar: "نحتاج إلى فعل: mengucapkan terima kasih = يقدّم الشكر، أما ucapan فاسم."
      en: "A verb is needed: mengucapkan terima kasih = to say thank you; ucapan is a noun."
    words: [mengucapkan]
  - id: e09
    type: dictation
    text: Buku ini bercerita tentang Mataram.
    meaning:
      ar_eg: الكتاب ده بيحكي عن ماتارام.
      ar: يتحدث هذا الكتاب عن ماتارام.
      en: This book is about Mataram.
    words: [tentang]
  - id: e10
    type: speaking
    text: Kami mengucapkan selamat kepada Rina.
    meaning:
      ar_eg: بنقول لرينا مبروك.
      ar: نهنّئ رينا.
      en: We congratulate Rina.
    words: [mengucapkan, kepada]
dialogue:
  title: Kartu untuk Pak Irwan
  lines:
    - speaker: Mohamed
      text: Rina, aku mau kirim kartu ucapan buat Pak Irwan.
      ar_eg: يا رينا، عايز أبعت كارت تهنئة لأستاذ إروان.
      ar: يا رينا، أريد أن أرسل بطاقة تهنئة إلى الأستاذ إروان.
      en: Rina, I want to send a greeting card to Pak Irwan.
    - speaker: Rina
      text: Bagus! Kartu Lebaran, ya? Di kartunya tulis "Kepada Pak Irwan", lho.
      ar_eg: حلو! كارت عيد، صح؟ اكتب على الكارت «Kepada Pak Irwan» (إلى الأستاذ إروان).
      ar: جميل! بطاقة عيد، أليس كذلك؟ اكتب على البطاقة «Kepada Pak Irwan» (إلى الأستاذ إروان).
      en: Great! An Eid card, right? On the card, write "Kepada Pak Irwan" (To Pak Irwan).
    - speaker: Mohamed
      text: Iya. Kartu ini untuk Pak Irwan dan keluarga. Aku juga nulis tentang Lombok.
      ar_eg: أيوه. الكارت ده لأستاذ إروان وعيلته. وكتبت كمان عن لومبوك.
      ar: نعم، هذه البطاقة للأستاذ إروان وأسرته، وكتبتُ فيها عن لومبوك أيضًا.
      en: Yes. This card is for Pak Irwan and his family. I also wrote about Lombok.
    - speaker: Rina
      text: Pak Irwan bakal seneng banget. Bagi guru, kartu dari murid itu hadiah yang indah.
      ar_eg: أستاذ إروان أكيد هيفرح. بالنسبة للمدرّس، كارت من تلميذه هدية حلوة.
      ar: سيفرح الأستاذ إروان بالتأكيد؛ فالبطاقة من التلميذ هدية جميلة عند المعلّم.
      en: Pak Irwan will surely be happy. For a teacher, a card from a student is a lovely gift.
new_words:
  - word: kepada
    pos: preposition
    ar_eg: لـ / إلى (لشخص)
    ar: إلى (للأشخاص)
    en: to (a person)
  - word: bagi
    pos: preposition
    ar_eg: بالنسبة لـ، لـ (أرسم)
    ar: بالنسبة إلى، لـ
    en: for, as for (more formal)
  - word: tentang
    pos: preposition
    ar_eg: عن
    ar: عن
    en: about
  - word: mengucapkan
    pos: verb
    ar_eg: يقول (تهنئة، شكر)
    ar: يقدّم (تهنئة أو شكرًا)
    en: to express, to say (wishes, thanks)
  - word: umat
    pos: noun
    ar_eg: أمة، جماعة المؤمنين
    ar: أمّة
    en: community of believers
    arabic: أمة
  - word: ucapan
    pos: noun
    ar_eg: تهنئة، كلام (kartu ucapan = كارت تهنئة)
    ar: تهنئة، عبارة (kartu ucapan = بطاقة تهنئة)
    en: greeting, wishes (kartu ucapan = greeting card)
