schema: kabar.lesson/v1
id: bipa6.u08.l05
language: id
title: Tukik di pantai
can_do:
  ar_eg: تقرا مقال علمي بسيط عن السلاحف البحرية وإزاي بيحموها.
  ar: أن تقرأ مقالًا علميًّا مبسّطًا عن السلاحف البحرية وطرق حمايتها.
  en: Read a simple science piece about sea turtles and how they're protected.
slides:
  - title: Pasir yang hangat
    body:
      ar_eg: |
        في إندونيسيا ٦ من ٧ أنواع الـ penyu (السلاحف البحرية) اللي في العالم.
        - sarang = عش: السلحفاة بتحفر sarang في الرملة وتحط البيض
        - tukik = السلحفاة الصغيرة اللي لسه طالعة من البيضة
        - suhu pasir = حرارة الرملة. حاجة غريبة: الرملة الدافية بتطلّع إناث (betina) أكتر.
        - penangkaran = مكان حماية وتربية الحيوانات
        - konservasi = الحفاظ على الطبيعة
        - dilepasliarkan = يترجع للطبيعة: الـ tukik بيتربوا في الـ penangkaran وبعدين dilepasliarkan في البحر.
      ar: |
        في إندونيسيا ستّة من أنواع الـ penyu (السلاحف البحرية) السبعة في العالم.
        - sarang = عشّ: تحفر السلحفاة sarang في الرمل وتضع بيضها
        - tukik = صغير السلحفاة الخارج لتوّه من البيضة
        - suhu pasir = حرارة الرمل؛ والغريب أنّ الرمل الدافئ يُخرج إناثًا (betina) أكثر.
        - penangkaran = مركز لحماية الحيوانات وتربيتها
        - konservasi = صون الطبيعة
        - dilepasliarkan = يُطلق في البرّية: تُربّى الـ tukik في الـ penangkaran ثم dilepasliarkan في البحر.
      en: |
        Indonesia has six of the world's seven species of penyu (sea turtle).
        - sarang = nest: the turtle digs a sarang in the sand and lays her eggs
        - tukik = a hatchling, a baby turtle just out of the egg
        - suhu pasir = sand temperature. Oddly, warmer sand produces more females (betina).
        - penangkaran = a breeding and protection centre
        - konservasi = conservation
        - dilepasliarkan = released into the wild: tukik are raised in a penangkaran and then dilepasliarkan into the sea.
    examples:
      - text: Setiap sore, relawan di penangkaran melepasliarkan tukik ke laut.
        ar_eg: كل عصرية، المتطوعين في مركز الحماية بيرجّعوا السلاحف الصغيرة للبحر.
        ar: يُطلق المتطوّعون في مركز الحماية كلّ مساء صغار السلاحف إلى البحر.
        en: Every evening, volunteers at the centre release hatchlings into the sea.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tukik
        ar_eg: سلحفاة صغيرة
        ar: صغير السلحفاة
        en: hatchling
      - text: sarang
        ar_eg: عش
        ar: عشّ
        en: nest
      - text: penangkaran
        ar_eg: مركز حماية
        ar: مركز حماية وتربية
        en: breeding centre
      - text: konservasi
        ar_eg: الحفاظ على الطبيعة
        ar: صون الطبيعة
        en: conservation
      - text: dilepasliarkan
        ar_eg: يترجع للطبيعة
        ar: يُطلق في البرّية
        en: released into the wild
    words: [tukik, sarang, penangkaran, konservasi, dilepasliarkan]
  - id: e02
    type: listen
    text: Penyu betina naik ke pantai pada malam hari untuk membuat sarang.
    question:
      ar_eg: السلحفاة بتطلع الشط إمتى وليه؟
      ar: متى تصعد السلحفاة إلى الشاطئ ولماذا؟
      en: When and why does the turtle come up the beach?
    options:
      - الصبح، عشان تاكل.
      - بالليل، عشان تعمل عش.
      - الضهر، عشان تنام.
    answer: 1
    words: [sarang]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الرملة الدافية بتعمل إيه في البيض؟
      ar: ماذا يفعل الرمل الدافئ بالبيض؟
      en: What does warm sand do to the eggs?
    options:
      - بيكسّره.
      - بيخلّيه يطلع ذكور بس.
      - بيطلّع إناث أكتر.
    answer: 2
    explain:
      ar_eg: 'suhu pasir بتحدد نوع الـ tukik: الدفا = betina أكتر.'
      ar: يحدّد suhu pasir جنس الـ tukik، فالدفء يعني betina أكثر.
      en: suhu pasir decides the hatchling's sex; warmth means more betina.
    words: [suhu pasir, tukik]
  - id: e04
    type: fill_blank
    sentence: Telur penyu dipindahkan ke ___ supaya tidak dicuri orang.
    meaning:
      ar_eg: بيض السلاحف بيتنقل لمركز الحماية عشان محدش يسرقه.
      ar: يُنقل بيض السلاحف إلى مركز الحماية كي لا يُسرق.
      en: The turtle eggs are moved to the breeding centre so no one steals them.
    options: [penangkaran, sarang, konservasi]
    answers: [penangkaran]
    words: [penangkaran]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «tukik» يعني إيه؟
      ar: ما «tukik»؟
      en: What is a "tukik"?
    options:
      - سلحفاة صغيرة لسه طالعة من البيضة.
      - نوع سمك.
      - مركب صيد.
    answer: 0
    words: [tukik]
  - id: e06
    type: build_sentence
    source:
      ar_eg: السلاحف الصغيرة اترجعت للبحر النهارده الصبح.
      ar: أُطلقت صغار السلاحف إلى البحر صباح اليوم.
      en: The hatchlings were released into the sea this morning.
    answer: Tukik itu dilepasliarkan ke laut tadi pagi.
    distractors: [sarang, penangkaran]
    words: [tukik, dilepasliarkan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الحفاظ على السلاحف البحرية مهم للبحر.
      ar: صون السلاحف البحرية مهمّ للبحر.
      en: Sea turtle conservation matters for the ocean.
    answers:
      - Konservasi penyu penting untuk laut.
      - Konservasi penyu penting bagi laut.
      - Konservasi penyu sangat penting untuk laut.
    words: [konservasi]
  - id: e08
    type: speaking
    text: Jangan menginjak sarang penyu di pantai ini.
    meaning:
      ar_eg: ماتدوسش على أعشاش السلاحف في الشط ده.
      ar: لا تطأ أعشاش السلاحف على هذا الشاطئ.
      en: Don't step on the turtle nests on this beach.
    words: [sarang]
  - id: e09
    type: dictation
    text: Program konservasi ini sudah melepasliarkan ribuan tukik.
    meaning:
      ar_eg: برنامج الحماية ده رجّع آلاف السلاحف الصغيرة للبحر.
      ar: أطلق برنامج الصون هذا آلاف صغار السلاحف.
      en: This conservation programme has released thousands of hatchlings.
    words: [konservasi, tukik]
  - id: e10
    type: fill_blank
    sentence: Setelah enam minggu di penangkaran, tukik ___ ke laut.
    meaning:
      ar_eg: بعد ست أسابيع في مركز الحماية، السلاحف الصغيرة بتترجع للبحر.
      ar: بعد ستّة أسابيع في مركز الحماية تُطلق الصغار إلى البحر.
      en: After six weeks at the centre, the hatchlings are released into the sea.
    options: [dilepasliarkan, dikumpulkan, diterbitkan]
    answers: [dilepasliarkan]
    words: [dilepasliarkan, penangkaran]
dialogue:
  title: Malam di pantai Pangumbahan
  lines:
    - speaker: Bu Laila
      text: Ssst, Aisyah. Itu penyu betina sedang membuat sarang.
      ar_eg: هس يا عايشة. دي سلحفاة بتعمل عش.
      ar: صه يا عائشة، تلك سلحفاة تحفر عشّها.
      en: Shh, Aisyah. That's a female turtle making her nest.
    - speaker: Aisyah
      text: Wah, besar sekali! Berapa telurnya, Bu?
      ar_eg: واو، كبيرة أوي! بتحط كام بيضة يا ماما؟
      ar: رائع، كم هي كبيرة! كم بيضة تضع يا أمّي؟
      en: Wow, she's huge! How many eggs does she lay?
    - speaker: Bu Laila
      text: Bisa lebih dari seratus. Petugas konservasi akan membawanya ke penangkaran.
      ar_eg: ممكن أكتر من مية. موظفين الحماية هياخدوه لمركز الحماية.
      ar: قد تتجاوز المئة، وسينقلها موظّفو الصون إلى مركز الحماية.
      en: Over a hundred, maybe. The conservation staff will take them to the centre.
    - speaker: Mohamed
      text: Dan nanti tukiknya dilepasliarkan di pantai yang sama, kan?
      ar_eg: وبعدين السلاحف الصغيرة هتترجع لنفس الشط، صح؟
      ar: ثم تُطلق الصغار على الشاطئ نفسه، أليس كذلك؟
      en: And later the hatchlings are released on this same beach, right?
