schema: kabar.lesson/v1
id: bipa3.u06.l06
language: id
title: AC tidak berfungsi
can_do:
  ar_eg: 'تشتكي إن جهاز مش شغال: الزرار، السلك، الإشارة، وتطلب يغيّروه.'
  ar: 'أن تشتكي من جهاز معطّل: الزر والسلك والإشارة، وتطلب تبديله.'
  en: 'Report that a device isn''t working: the button, the cable, the signal, and ask for a replacement.'
slides:
  - title: Ada yang rusak
    body:
      ar_eg: |
        berfungsi = شغال (بيأدي وظيفته): AC-nya tidak berfungsi = التكييف مش شغال.
        peralatan = عدّة، أدوات (peralatan dapur = أدوات المطبخ). perangkat = جهاز.
        tombol = زرار. kabel = سلك، كابل. sinyal = إشارة (شبكة الموبايل).
        otomatis = أوتوماتيك. mengganti = يغيّر، يبدّل.
      ar: |
        berfungsi = يعمل (يؤدي وظيفته): AC-nya tidak berfungsi = المكيّف لا يعمل.
        peralatan = معدّات، أدوات (peralatan dapur = أدوات المطبخ). perangkat = جهاز.
        tombol = زر. kabel = سلك، كابل. sinyal = إشارة.
        otomatis = تلقائي، آلي. mengganti = يستبدل، يغيّر.
      en: |
        berfungsi = work, function: AC-nya tidak berfungsi = the air con isn't working.
        peralatan = equipment, tools (peralatan dapur = kitchen utensils). perangkat = device.
        tombol = button. kabel = cable, wire. sinyal = signal.
        otomatis = automatic. mengganti = replace, change.
    examples:
      - text: AC di kamar saya tidak berfungsi.
        ar_eg: التكييف في أوضتي مش شغال.
        ar: المكيّف في غرفتي لا يعمل.
        en: The air con in my room isn't working.
      - text: Saya sudah menekan tombolnya, tapi AC-nya masih mati.
        ar_eg: دوست على الزرار، بس التكييف لسه مطفي.
        ar: ضغطت على الزر لكن المكيّف ما زال مطفأً.
        en: I've pressed the button, but the air con is still off.
      - text: Tolong ganti kabelnya. Kabel ini rusak.
        ar_eg: لو سمحت غيّر السلك. السلك ده بايظ.
        ar: من فضلك استبدل السلك. هذا السلك معطّل.
        en: Please replace the cable. This one is broken.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: berfungsi
        ar_eg: شغال
        ar: يعمل
        en: work, function
      - text: peralatan
        ar_eg: عدّة، أدوات
        ar: معدّات
        en: equipment
      - text: perangkat
        ar_eg: جهاز
        ar: جهاز
        en: device
      - text: tombol
        ar_eg: زرار
        ar: زر
        en: button
    words: [berfungsi, peralatan, perangkat, tombol]
  - id: e02
    type: match_pairs
    pairs:
      - text: kabel
        ar_eg: سلك
        ar: سلك
        en: cable
      - text: sinyal
        ar_eg: إشارة
        ar: إشارة
        en: signal
      - text: otomatis
        ar_eg: أوتوماتيك
        ar: تلقائي
        en: automatic
      - text: mengganti
        ar_eg: يغيّر
        ar: يستبدل
        en: replace
    words: [kabel, sinyal, otomatis, mengganti]
  - id: e03
    type: listen
    text: Di kamar ini tidak ada sinyal. Saya tidak bisa menelepon.
    question:
      ar_eg: إيه المشكلة؟
      ar: ما المشكلة؟
      en: What's the problem?
    options: [مافيش مية, مافيش شبكة, مافيش نور]
    answer: 1
    meaning:
      ar_eg: الأوضة دي مافيهاش شبكة. مش قادر أتصل.
      ar: لا توجد إشارة في هذه الغرفة. لا أستطيع الاتصال.
      en: There's no signal in this room. I can't make calls.
    words: [sinyal]
  - id: e04
    type: fill_blank
    sentence: Pintu ini ___. Kita tidak perlu menekan tombol.
    meaning:
      ar_eg: الباب ده ___. مش محتاجين ندوس على زرار.
      ar: هذا الباب ___. لا نحتاج إلى ضغط زر.
      en: This door is ___. We don't need to press a button.
    options: [otomatis, kabel, tombol]
    answers: [otomatis]
    words: [otomatis, kabel, tombol]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الحاجة اللي بتدوس عليها عشان تشغّل جهاز؟
      ar: ما الشيء الذي تضغطه لتشغيل جهاز؟
      en: What do you press to switch a device on?
    options: [tombol, sinyal, peralatan]
    answer: 0
    explain:
      ar_eg: tombol = زرار.
      ar: tombol = زر.
      en: tombol = button.
    words: [tombol, sinyal, peralatan]
  - id: e06
    type: fill_blank
    sentence: Teknisi membawa ___ untuk memperbaiki AC.
    meaning:
      ar_eg: الفني جاب ___ عشان يصلّح التكييف.
      ar: أحضر الفنيّ ___ لإصلاح المكيّف.
      en: The technician brought ___ to fix the air con.
    options: [perangkat, peralatan, kabel]
    answers: [peralatan]
    words: [peralatan, perangkat, kabel]
  - id: e07
    type: build_sentence
    source:
      ar_eg: لو سمحت غيّر اللمبة دي.
      ar: من فضلك استبدل هذا المصباح.
      en: Please change this light bulb.
    answer: Tolong mengganti lampu ini.
    distractors: [otomatis, sinyal]
    words: [mengganti]
  - id: e08
    type: translate
    direction: from_target
    source_text: Semua perangkat di kamar ini berfungsi dengan baik.
    answers_meaning:
      ar_eg: [كل الأجهزة في الأوضة دي شغالة كويس, كل الأجهزة في الأوضة شغالة تمام]
      ar: [كل الأجهزة في هذه الغرفة تعمل جيدًا]
      en: [All the devices in this room work well, Every device in this room works fine]
    words: [perangkat, berfungsi]
  - id: e09
    type: speaking
    text: Televisinya tidak berfungsi. Kabelnya rusak.
    meaning:
      ar_eg: التلفزيون مش شغال. السلك بايظ.
      ar: التلفاز لا يعمل. السلك معطّل.
      en: The TV isn't working. The cable's broken.
    words: [berfungsi, kabel]
  - id: e10
    type: multiple_choice
    question: Petugas sudah mengganti lampu. Kunci kamar saya juga rusak. Bisa ___?
    options: [sinyal, otomatis, diganti]
    answer: 2
    explain:
      ar_eg: diganti = يتغيّر (من mengganti).
      ar: diganti = يُستبدل (من mengganti).
      en: diganti = be replaced (from mengganti).
    words: [sinyal, otomatis, mengganti]
dialogue:
  lines:
    - speaker: Mohamed
      text: Selamat malam. Maaf, AC di kamar 204 tidak berfungsi.
      ar_eg: مساء الخير. معلش، التكييف في أوضة ٢٠٤ مش شغال.
      ar: مساء الخير. عذرًا، المكيّف في الغرفة ٢٠٤ لا يعمل.
      en: Good evening. Sorry, the air con in room 204 isn't working.
    - speaker: Resepsionis
      text: Sudah tekan tombol yang hijau, Pak?
      ar_eg: دوست على الزرار الأخضر يا فندم؟
      ar: هل ضغطت الزر الأخضر يا سيدي؟
      en: Did you press the green button, sir?
    - speaker: Mohamed
      text: Sudah. Mesinnya jalan, tapi udaranya masih panas.
      ar_eg: أيوه. الموتور بيعمل صوت، بس الهوا لسه سخن.
      ar: نعم. المحرّك يصدر صوتًا لكن الهواء ما زال ساخنًا.
      en: Yes. The machine makes a noise, but the air's still hot.
    - speaker: Resepsionis
      text: Mohon maaf. Teknisi kami akan melihat kabelnya.
      ar_eg: إحنا آسفين جدًا. الفني بتاعنا هيكشف على السلك.
      ar: نعتذر. سيفحص الفنيّ السلك.
      en: We're very sorry. Our technician will check the wiring.
    - speaker: Mohamed
      text: Kalau tidak bisa diperbaiki, saya minta ganti kamar.
      ar_eg: لو مش هيتصلّح، عايز أغيّر الأوضة.
      ar: إن لم يمكن إصلاحه فأطلب تغيير الغرفة.
      en: If it can't be fixed, I'd like to change rooms.
