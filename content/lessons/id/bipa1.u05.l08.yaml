schema: kabar.lesson/v1
id: bipa1.u05.l08
language: id
title: Monyet di Ubud
can_do:
  ar_eg: تسمّي الحيوانات اللي هتشوفها في الإجازة، وتفهم يافطة «خطر».
  ar: أن تسمّي الحيوانات التي تراها في العطلة، وتفهم لافتة «خطر».
  en: Name the animals you meet on holiday and understand a danger sign.
slides:
  - title: Binatang
    body:
      ar_eg: |
        binatang = حيوان. kuda = حصان (جزيرة سومبا مشهورة بالخيل)، sapi = بقرة، ayam = فرخة (sate ayam!)، monyet = قرد، ular = تعبان.
        terbang = يطير: burung terbang (الطير بيطير).
        bahaya = خطر. على اليافطات: «Bahaya!».
        في أوبود في بالي فيه غابة قرود. القرود هناك عسل، بس بتخطف الشنط والنضارات!
      ar: |
        binatang = حيوان. kuda = حصان (وجزيرة سومبا مشهورة بالخيل)، sapi = بقرة، ayam = دجاجة (sate ayam!)، monyet = قرد، ular = أفعى.
        terbang = يطير: burung terbang (الطائر يطير).
        bahaya = خطر، وعلى اللافتات: «Bahaya!».
        في أوبود ببالي غابة قرود؛ قرودها لطيفة لكنها تخطف الحقائب والنظّارات!
      en: |
        binatang = animal. kuda = horse (Sumba island is famous for them), sapi = cow, ayam = chicken (sate ayam!), monyet = monkey, ular = snake.
        terbang = fly: burung terbang (birds fly).
        bahaya = danger; signs say "Bahaya!".
        Ubud in Bali has a monkey forest. The monkeys are cute, but they grab bags and glasses!
    examples:
      - text: Di Ubud ada banyak monyet.
        ar_eg: في أوبود فيه قرود كتير.
        ar: في أوبود قرود كثيرة.
        en: There are lots of monkeys in Ubud.
      - text: Burung terbang di langit.
        ar_eg: العصافير بتطير في السما.
        ar: الطيور تطير في السماء.
        en: Birds fly in the sky.
      - text: Bahaya! Ada ular.
        ar_eg: خطر! فيه تعابين.
        ar: خطر! هناك أفعى.
        en: Danger! There's a snake.
