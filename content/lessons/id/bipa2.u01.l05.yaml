schema: kabar.lesson/v1
id: bipa2.u01.l05
language: id
title: Hotel atau rumah tradisional?
can_do:
  ar_eg: 'تختار مكان تنام فيه: حديث ولا تقليدي، فخم، الأوضة واسعة ولا ضيقة، والحيطة رفيعة، وتقول مميز أو مثالي.'
  ar: 'أن تختار مكانًا للمبيت: حديث أو تقليدي، فاخر، الغرفة واسعة أو ضيّقة، والجدار رقيق، وتقول مميّز أو مثالي.'
  en: 'Choose where to stay: modern or traditional, luxurious, a spacious or cramped room, thin walls, and say special or perfect.'
slides:
  - title: Hotel yang mewah
    body:
      ar_eg: |
        modern ↔ tradisional. mewah = فخم، غالي.
        luas = واسع (في المساحة)، وعكسه sempit = ضيق. tipis = رفيع، عكس tebal: Dindingnya tipis.
        istimewa = مميز (من «امتياز»)، sempurna = كامل، مثالي.
        في الشارع بيقولوا:
        - iya = ya (أيوه)
        - lho كلمة صغيرة بتدّي الجملة إحساس (زي «على فكرة!»)، ومن غيرها الجملة صح برضه
      ar: |
        modern ↔ tradisional. mewah = فاخر.
        luas = واسع المساحة، وضدّه sempit = ضيّق. tipis = رقيق، ضدّ tebal: Dindingnya tipis.
        istimewa = مميّز (من «امتياز»)، sempurna = كامل، مثالي.
        في كلام الشارع:
        - iya = ya (نعم)
        - lho أداة صغيرة تلوّن الجملة (مثل «انتبه!»)، والجملة صحيحة بدونها
      en: |
        modern ↔ tradisional. mewah = luxurious.
        luas = spacious; its opposite is sempit, cramped. tipis = thin, the opposite of tebal: Dindingnya tipis.
        istimewa = special (from Arabic امتياز), sempurna = perfect.
        On the street:
        - iya = ya (yes)
        - lho is a small particle that adds feeling (like "you know!"); the sentence is correct without it
    examples:
      - text: Hotel itu mewah dan modern.
        ar_eg: الأوتيل ده فخم وحديث.
        ar: ذلك الفندق فاخر وحديث.
        en: That hotel is luxurious and modern.
      - text: Kamarnya luas, tapi kamar mandinya sempit.
        ar_eg: الأوضة واسعة، بس الحمام ضيق.
        ar: الغرفة واسعة، لكن الحمّام ضيّق.
        en: The room is spacious, but the bathroom is cramped.
      - text: Rumah tradisional ini istimewa.
        ar_eg: البيت التقليدي ده مميز.
        ar: هذا البيت التقليدي مميّز.
        en: This traditional house is special.
exercises:
  - id: e01
    type: match_pairs
    pairs:
