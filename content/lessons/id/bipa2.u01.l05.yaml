  - id: e03
    type: listen
    text: Kamarnya luas, tapi kamar mandinya sempit.
    question:
      ar_eg: الأوضة شكلها إيه؟
      ar: كيف الغرفة؟
      en: What's the room like?
    options: [واسعة, ضيقة, غالية]
    answer: 0
    meaning:
      ar_eg: الأوضة واسعة، بس الحمام ضيق.
      ar: الغرفة واسعة، لكن الحمّام ضيّق.
      en: The room is spacious, but the bathroom is cramped.
    words: [luas, sempit]
  - id: e04
    type: fill_blank
    sentence: 'Hotel itu ___ sekali: ada kolam renang dan restoran mahal.'
    meaning:
      ar_eg: 'الأوتيل ده ___ أوي: فيه حمام سباحة ومطعم غالي.'
      ar: 'ذلك الفندق ___ جدًا: فيه مسبح ومطعم غالٍ.'
      en: 'That hotel is so ___: it has a pool and an expensive restaurant.'
    options: [mewah, tipis, tradisional]
    answers: [mewah]
    words: [mewah, tipis, tradisional]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه عكس tradisional؟
      ar: ما ضدّ tradisional؟
      en: What's the opposite of tradisional?
    options: [modern, istimewa, sempurna]
    answer: 0
    explain:
      ar_eg: tradisional = تقليدي، وعكسها modern = حديث.
      ar: tradisional تقليدي، وضدّها modern حديث.
      en: tradisional ↔ modern.
    words: [modern, tradisional, istimewa, sempurna]
  - id: e06
    type: fill_blank
    sentence: Dindingnya ___, tidak tebal.
    meaning:
      ar_eg: الحيطة ___، مش تخينة.
      ar: الجدار ___، ليس سميكًا.
      en: The wall is ___, not thick.
    options: [tipis, luas, modern]
    answers: [tipis]
    words: [tipis, luas, modern]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الأوضة دي واسعة ومريحة.
      ar: هذه الغرفة واسعة ومريحة.
      en: This room is spacious and comfortable.
    answer: Kamar ini luas dan nyaman.
    distractors: [sempit, mewah]
    words: [luas]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kue ini istimewa. Sempurna!
    answers_meaning:
      ar_eg: [الكيكة دي مميزة. ممتازة!, الكيكة دي مميزة. مظبوطة!]
      ar: [هذه الكعكة مميّزة. مثالية!, هذه الكعكة مميّزة. رائعة!]
      en: [This cake is special. Perfect!, 'This cake is special. It''s perfect!']
    words: [istimewa, sempurna]
  - id: e09
    type: speaking
    text: Rumah tradisional ini sempit, tapi istimewa.
    meaning:
      ar_eg: البيت التقليدي ده ضيق، بس مميز.
      ar: هذا البيت التقليدي ضيّق لكنه مميّز.
      en: This traditional house is cramped, but special.
    words: [tradisional, sempit, istimewa]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: حاجة مافيهاش ولا غلطة. هي…؟
      ar: شيء لا عيب فيه إطلاقًا. هو…؟
      en: Something without a single flaw. It's…?
    options: [sempurna, sempit, mewah]
    answer: 0
    explain:
      ar_eg: sempurna = مثالي. sempit ضيق، وmewah فخم.
      ar: sempurna مثالي، أما sempit فضيّق وmewah فاخر.
      en: sempurna = perfect; sempit is cramped and mewah luxurious.
    words: [sempurna, sempit, mewah]
dialogue:
  lines:
    - speaker: Ni Luh
      text: Mohamed, mau tidur di hotel atau di rumah tradisional?
      ar_eg: يا محمد، عايز تنام في أوتيل ولا في بيت تقليدي؟
      ar: يا محمد، أتريد النوم في فندق أم في بيت تقليدي؟
      en: Mohamed, do you want to sleep at a hotel or in a traditional house?
    - speaker: Mohamed
      text: Hotelnya modern dan mewah, tapi mahal.
      ar_eg: الأوتيل حديث وفخم، بس غالي.
      ar: الفندق حديث وفاخر، لكنه غالٍ.
      en: The hotel is modern and luxurious, but expensive.
    - speaker: Ni Luh
      text: Rumah tradisional ini lebih murah. Kamarnya luas.
      ar_eg: البيت التقليدي ده أرخص. والأوضة واسعة.
      ar: هذا البيت التقليدي أرخص، وغرفته واسعة.
      en: This traditional house is cheaper. The room is spacious.
    - speaker: Mohamed
      text: Tapi dindingnya tipis dan kamar mandinya sempit.
      ar_eg: بس الحيطة رفيعة والحمام ضيق.
      ar: لكن جداره رقيق وحمّامه ضيّق.
      en: But the walls are thin and the bathroom is cramped.
    - speaker: Ni Luh
      text: Iya, tapi malam ini ada gamelan yang istimewa di pura, lho!
      ar_eg: أيوه، بس الليلة فيه جاميلان مميز في المعبد!
      ar: نعم، لكن الليلة عرض جاميلان مميّز في المعبد!
      en: Yes, but tonight there's a special gamelan at the temple!
    - speaker: Mohamed
      text: Sempurna! Kita tidur di sini aja.
      ar_eg: تمام كده! هننام هنا.
      ar: ممتاز! سننام هنا.
      en: Perfect! We'll sleep here.
