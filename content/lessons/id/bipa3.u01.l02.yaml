schema: kabar.lesson/v1
id: bipa3.u01.l02
language: id
title: Mohon maaf lahir dan batin
can_do:
  ar_eg: تقول تهنئة العيد وترد عليها زي الإندونيسيين.
  ar: أن تقول تهنئة العيد وتردّ عليها كما يفعل الإندونيسيون.
  en: Give and answer Eid greetings.
slides:
  - title: Selamat Idulfitri!
    body:
      ar_eg: |
        عيد الفطر = Idulfitri (من العربي «عيد الفطر») في الرسمي، و Lebaran في الكلام العادي.
        التهنئة الثابتة: Selamat Idulfitri, mohon maaf lahir dan batin.
        يعني «كل سنة وانت طيب، وسامحني على أي غلط، في الظاهر وفي الباطن». lahir من «ظاهر» و batin من «باطن».
        الناس في العيد بتسامح بعض: saling memaafkan.
      ar: |
        عيد الفطر هو Idulfitri (من العربية) في الأسلوب الرسمي، وLebaran في الحديث اليومي.
        التهنئة الثابتة: Selamat Idulfitri, mohon maaf lahir dan batin.
        أي «عيد مبارك، وسامحني على كل خطأ ظاهرًا وباطنًا». فـlahir من «ظاهر» وbatin من «باطن».
        وفي العيد يتسامح الناس: saling memaafkan.
      en: |
        Eid al-Fitr is Idulfitri (from Arabic «عيد الفطر») in formal speech and Lebaran in everyday talk.
        The set greeting: Selamat Idulfitri, mohon maaf lahir dan batin.
        It means "Happy Eid, and please forgive my wrongs, outward and inward". lahir is from Arabic «ظاهر», batin from «باطن».
        At Eid people forgive each other: saling memaafkan.
    examples:
      - text: Selamat Idulfitri! Mohon maaf lahir dan batin.
        ar_eg: كل سنة وانت طيب! سامحني على أي حاجة.
        ar: عيد مبارك! سامحني ظاهرًا وباطنًا.
        en: Happy Eid! Please forgive my wrongs, outward and inward.
      - text: Sama-sama, saya juga mohon maaf lahir dan batin.
        ar_eg: وانت طيب، وانا كمان بطلب منك السماح.
        ar: وأنت بخير، وأنا أيضًا أطلب منك المسامحة.
        en: Same to you; please forgive me too.
  - title: Semoga … di hari Lebaran
    grammar: id.hope.semoga
    body:
      ar_eg: |
        في العيد الدعوات بتبدأ بـ semoga، زي ما اتعلمت:
        Semoga tahun depan kita bisa mudik lagi = يا رب السنة الجاية نعرف نسافر البلد تاني.
        mudik = السفر للبلد (مسقط الراس) قبل العيد، وده أكبر سفر في إندونيسيا كل سنة.
        وكتير من الناس بيقولوا بالعربي: Taqabbalallahu minna wa minkum = تقبّل الله منا ومنكم.
      ar: |
        أدعية العيد تبدأ بـsemoga كما تعلمت:
        Semoga tahun depan kita bisa mudik lagi = عسى أن نعود إلى قريتنا في العام القادم.
        mudik هو السفر إلى البلدة الأصلية قبل العيد، وهو أكبر موسم سفر في إندونيسيا.
        ويقول كثيرون بالعربية: Taqabbalallahu minna wa minkum = تقبّل الله منا ومنكم.
      en: |
        Eid wishes start with semoga, as you learned:
        Semoga tahun depan kita bisa mudik lagi = May we go home again next year.
        mudik = travelling back to your home town before Eid, Indonesia's biggest yearly journey.
        Many people also say it in Arabic: Taqabbalallahu minna wa minkum (تقبّل الله منا ومنكم).
    examples:
      - text: Semoga tahun depan kita bisa mudik lagi.
        ar_eg: يا رب السنة الجاية نعرف نروح البلد تاني.
        ar: عسى أن نعود إلى البلدة في العام القادم.
        en: May we be able to go home again next year.
      - text: Selamat Lebaran! Ayo makan ketupat.
        ar_eg: كل سنة وانت طيب! يلا ناكل كتوبات.
        ar: عيد مبارك! هيا نأكل الكتوبات.
        en: Happy Eid! Let's eat ketupat.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Idulfitri
        ar_eg: عيد الفطر (رسمي)
        ar: عيد الفطر
        en: Eid al-Fitr (formal)
      - text: Lebaran
        ar_eg: العيد (في الكلام العادي)
        ar: العيد (في الحديث اليومي)
        en: Eid (everyday word)
      - text: lahir dan batin
        ar_eg: في الظاهر والباطن
        ar: ظاهرًا وباطنًا
        en: outward and inward
      - text: ketupat
        ar_eg: كتوبات (رز في سبت من ورق جوز الهند)
        ar: الكتوبات (أرز في سلة من سعف جوز الهند)
        en: ketupat (rice cake in woven coconut leaves)
      - text: mudik
        ar_eg: يسافر البلد قبل العيد
        ar: السفر إلى البلدة قبل العيد
        en: go back to your home town for Eid
      - text: saling memaafkan
        ar_eg: يسامحوا بعض
        ar: يتسامحون
        en: forgive each other
    words: [Idulfitri, Lebaran, lahir dan batin, ketupat, mudik, saling memaafkan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: صباح العيد جارك قالك «Selamat Idulfitri, mohon maaf lahir dan batin». ترد تقول إيه؟
      ar: صباح العيد قال لك جارك «Selamat Idulfitri, mohon maaf lahir dan batin». بمَ تردّ؟
      en: 'On Eid morning your neighbour says "Selamat Idulfitri, mohon maaf lahir dan batin". What do you answer?'
    options: ["Sama-sama, mohon maaf lahir dan batin juga.", "Selamat wisuda juga!", "Semoga cepat sembuh."]
    answer: 0
    explain:
      ar_eg: الرد الطبيعي إنك تطلب السماح انت كمان. wisuda للتخرّج و cepat sembuh للعيان.
      ar: الردّ المعتاد أن تطلب المسامحة أنت أيضًا؛ أما wisuda فللتخرّج وcepat sembuh للمريض.
      en: The natural reply is to ask forgiveness too; wisuda is for graduation and cepat sembuh for someone ill.
    words: [lahir dan batin]
  - id: e03
    type: listen
    text: Selamat Lebaran! Ayo makan ketupat.
    options: ["Selamat Idulfitri! Ayo beli ketupat.", "Selamat Lebaran! Ayo makan ketupat.", "Selamat Lebaran! Ayo makan sate."]
    answer: 1
    meaning:
      ar_eg: كل سنة وانت طيب! يلا ناكل كتوبات.
      ar: عيد مبارك! هيا نأكل الكتوبات.
      en: Happy Eid! Let's eat ketupat.
    words: [Lebaran, ketupat]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: قبل العيد ديماس بيسافر سورابايا عشان يقضي العيد مع أهله. اسم ده إيه؟
      ar: قبل العيد يسافر ديماس إلى سورابايا ليقضي العيد مع أهله. ما اسم ذلك؟
      en: Before Eid, Dimas travels to Surabaya to spend it with his family. What is this called?
    options: [ketupat, wisuda, mudik]
    answer: 2
    words: [mudik]
  - id: e05
    type: fill_blank
    sentence: Selamat ___, mohon maaf lahir dan batin.
    meaning:
      ar_eg: عيد فطر سعيد، وسامحني على أي غلط.
      ar: عيد فطر مبارك، وسامحني ظاهرًا وباطنًا.
      en: Happy Eid al-Fitr; please forgive my wrongs, outward and inward.
    options: [wisuda, Idulfitri, menikah]
    answers: [Idulfitri]
    words: [Idulfitri, lahir dan batin]
  - id: e06
    type: build_sentence
    source:
      ar_eg: في العيد بنسامح بعض.
      ar: في العيد يسامح بعضنا بعضًا.
      en: At Eid we forgive each other.
    answer: Saat Lebaran kita saling memaafkan.
    alternatives: ["Kita saling memaafkan saat Lebaran."]
    distractors: [mudik, maaf]
    words: [Lebaran, saling memaafkan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: يا رب السنة الجاية نعرف نروح البلد تاني.
      ar: عسى أن نعود إلى البلدة في العام القادم.
      en: May we be able to go home for Eid again next year.
    answers:
      - Semoga tahun depan kita bisa mudik lagi.
      - Semoga tahun depan kita bisa mudik lagi
      - Semoga kita bisa mudik lagi tahun depan.
      - Semoga kita bisa mudik lagi tahun depan
      - Mudah-mudahan tahun depan kita bisa mudik lagi.
      - Mudah-mudahan kita bisa mudik lagi tahun depan.
      - Semoga tahun depan kami bisa mudik lagi.
      - Semoga kami bisa mudik lagi tahun depan.
    words: [mudik]
  - id: e08
    type: speaking
    text: Selamat Idulfitri! Mohon maaf lahir dan batin.
    meaning:
      ar_eg: كل سنة وانت طيب! سامحني على أي حاجة.
      ar: عيد مبارك! سامحني ظاهرًا وباطنًا.
      en: Happy Eid! Please forgive my wrongs, outward and inward.
    words: [Idulfitri, lahir dan batin]
  - id: e09
    type: dictation
    text: Kami makan ketupat dan saling memaafkan.
    meaning:
      ar_eg: بناكل كتوبات ونسامح بعض.
      ar: نأكل الكتوبات ويسامح بعضنا بعضًا.
      en: We eat ketupat and forgive each other.
    words: [ketupat, saling memaafkan]
dialogue:
  title: Pagi Lebaran di rumah Bu Sari
  lines:
    - speaker: Bu Sari
      text: Selamat Idulfitri, Mohamed! Mohon maaf lahir dan batin, ya.
      ar_eg: كل سنة وانت طيب يا محمد! سامحني على أي حاجة.
      ar: عيد مبارك يا محمد! سامحني ظاهرًا وباطنًا.
      en: Happy Eid, Mohamed! Please forgive my wrongs, outward and inward.
    - speaker: Mohamed
      text: Sama-sama, Bu. Saya juga mohon maaf lahir dan batin.
      ar_eg: وانتي طيبة يا مدام. وانا كمان بطلب السماح.
      ar: وأنتِ بخير يا سيدتي، وأنا أيضًا أطلب المسامحة.
      en: Same to you, Bu. Please forgive me too.
    - speaker: Bu Sari
      text: Ayo, makan ketupat dulu! Dimas tidak datang, dia mudik ke Surabaya.
      ar_eg: يلا، كُل كتوبات الأول! ديماس مش جاي، سافر البلد في سورابايا.
      ar: هيا، كُل الكتوبات أولًا! ديماس لن يأتي، فقد سافر إلى بلدته سورابايا.
      en: Come on, have some ketupat first! Dimas isn't coming; he went home to Surabaya.
    - speaker: Mohamed
      text: Enak sekali, Bu! Semoga tahun depan saya bisa Lebaran di Lombok lagi.
      ar_eg: حلو أوي يا مدام! يا رب السنة الجاية أقضي العيد في لومبوك تاني.
      ar: لذيذ جدًا يا سيدتي! عسى أن أقضي العيد في لومبوك العام القادم أيضًا.
      en: Delicious, Bu! I hope I can spend Eid in Lombok again next year.
    - speaker: Bu Sari
      text: Amin! Taqabbalallahu minna wa minkum.
      ar_eg: آمين! تقبّل الله منا ومنكم.
      ar: آمين! تقبّل الله منا ومنكم.
      en: Amen! May God accept it from us and from you.
