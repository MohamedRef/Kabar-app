schema: kabar.lesson/v1
id: bipa5.u05.l09
language: id
title: Gugatan hutan adat
can_do:
  ar_eg: 'تتابع قضية حقوق غابات قبلية في المحكمة: الدعوى والجلسة والشهادة والمحامي والحكم والعقوبة والرفض، وأرض الأجداد.'
  ar: 'أن تتابع قضية حقوق الغابات العرفية في المحكمة: الدعوى والجلسة والشهادة والمحامي والحكم والعقوبة والرفض، وأرض الأجداد.'
  en: 'Follow a customary-forest court case: the lawsuit, hearing, testimony, defender, verdict, sanctions and rejection, and ancestral land.'
slides:
  - title: Hutan adat di pengadilan
    body:
      ar_eg: |
        gugatan = دعوى قضائية، persidangan = جلسة محكمة (المحاكمة)، kesaksian = شهادة.
        pembela = محامي الدفاع أو المدافع (pembela lingkungan = مدافع عن البيئة).
        putusan = حكم، قرار المحكمة، sanksi = عقوبة، جزاء، penolakan = رفض.
        nenek moyang = الأجداد، الأسلاف: tanah nenek moyang = أرض الأجداد.
        وقائع حقيقية: سنة 2013 المحكمة الدستورية حكمت إن الغابة العرفية (hutan adat) مش ملك الدولة.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: rame = ramai، banget = sekali، gimana = bagaimana، bakal = akan.
      ar: |
        gugatan = دعوى قضائية، persidangan = جلسة المحكمة، المحاكمة، kesaksian = شهادة.
        pembela = محامي الدفاع، مدافع (pembela lingkungan = مدافع عن البيئة).
        putusan = حكم المحكمة، sanksi = عقوبة، جزاء، penolakan = رفض.
        nenek moyang = الأجداد، الأسلاف: tanah nenek moyang = أرض الأجداد.
        حقيقة: في 2013 قضت المحكمة الدستورية بأن الغابات العرفية (hutan adat) ليست غابات الدولة.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: rame = ramai، banget = sekali، gimana = bagaimana، bakal = akan.
      en: |
        gugatan = lawsuit, persidangan = trial, court hearing, kesaksian = testimony.
        pembela = defender, defence lawyer (pembela lingkungan = environmental defender).
        putusan = ruling, verdict, sanksi = sanction, penalty, penolakan = rejection, refusal.
        nenek moyang = ancestors: tanah nenek moyang = ancestral land.
        Fact: in 2013 the Constitutional Court ruled that customary forest (hutan adat) is not state forest.
        The dialogue uses street forms; the formal ones are beside them: rame = ramai, banget = sekali, gimana = bagaimana, bakal = akan.
    examples:
      - text: Warga desa mengajukan gugatan terhadap perusahaan sawit.
        ar_eg: أهالي القرية رفعوا دعوى على شركة النخيل.
        ar: رفع سكان القرية دعوى ضد شركة النخيل.
        en: The villagers filed a lawsuit against the palm-oil company.
      - text: Dalam persidangan, kepala adat memberi kesaksian tentang tanah nenek moyang.
        ar_eg: في الجلسة، شيخ القبيلة شهد عن أرض الأجداد.
        ar: في المحاكمة أدلى زعيم العشيرة بشهادته عن أرض الأجداد.
        en: At the trial, the customary chief testified about ancestral land.
      - text: 'Putusan hakim: perusahaan menerima sanksi.'
        ar_eg: 'حكم القاضي: الشركة اتعاقبت.'
        ar: 'حكم القاضي: تُعاقَب الشركة.'
        en: 'The judge''s ruling: the company is sanctioned.'
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gugatan
        ar_eg: دعوى
        ar: دعوى قضائية
        en: lawsuit
      - text: persidangan
        ar_eg: جلسة محكمة
        ar: محاكمة
        en: trial
      - text: kesaksian
        ar_eg: شهادة
        ar: شهادة
        en: testimony
      - text: pembela
        ar_eg: محامي الدفاع
        ar: مدافع
        en: defender
    words: [gugatan, persidangan, kesaksian, pembela]
  - id: e02
    type: match_pairs
    pairs:
      - text: putusan
        ar_eg: حكم
        ar: حكم المحكمة
        en: ruling
      - text: sanksi
        ar_eg: عقوبة
        ar: عقوبة، جزاء
        en: sanction
      - text: penolakan
        ar_eg: رفض
        ar: رفض
        en: rejection
      - text: moyang
        ar_eg: جد (nenek moyang = الأجداد)
        ar: جدّ (nenek moyang = الأسلاف)
        en: ancestor (nenek moyang)
    words: [putusan, sanksi, penolakan, moyang]
  - id: e03
    type: listen
    text: Persidangan ditunda sampai minggu depan.
    question:
      ar_eg: الجلسة اتأجلت لإمتى؟
      ar: إلى متى أُجّلت الجلسة؟
      en: Until when was the hearing postponed?
    options: [للأسبوع الجاي, لبكرة, لآخر السنة]
    answer: 0
    meaning:
      ar_eg: الجلسة اتأجلت للأسبوع الجاي.
      ar: أُجّلت الجلسة إلى الأسبوع القادم.
      en: The hearing has been postponed to next week.
    words: [persidangan]
  - id: e04
    type: fill_blank
    sentence: Perusahaan yang membakar hutan harus menerima ___ berat.
    meaning:
      ar_eg: الشركة اللي بتحرق الغابة لازم تاخد ___ تقيلة.
      ar: يجب أن تنال الشركة التي تحرق الغابة ___ شديدة.
      en: A company that burns forest must face heavy ___.
    options: [sanksi, kesaksian, moyang]
    answers: [sanksi]
    words: [sanksi, kesaksian, moyang]
    explain:
      ar_eg: الشركة بتاخد sanksi (عقوبة). kesaksian = شهادة وmoyang = جدود، مش عقاب.
      ar: تنال الشركة sanksi (عقوبة). أما kesaksian فالشهادة، وmoyang الأجداد.
      en: The company faces sanksi (sanctions). kesaksian (testimony) and moyang (ancestors) aren't punishments.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: القاضي قال كلمته الأخيرة في القضية. ده اسمه إيه؟
      ar: قال القاضي كلمته الأخيرة في القضية. ما اسم ذلك؟
      en: The judge gave his final word on the case. What is it called?
    options: [gugatan, putusan, pembela]
    answer: 1
    explain:
      ar_eg: putusan = حكم.
      ar: putusan = حكم.
      en: putusan = ruling, verdict.
    words: [gugatan, putusan, pembela]
  - id: e06
    type: fill_blank
    sentence: Hutan ini adalah warisan nenek ___ kami.
    meaning:
      ar_eg: الغابة دي ورث من ___ نا.
      ar: هذه الغابة إرث ___ نا.
      en: This forest is our ___' inheritance.
    options: [moyang, penolakan, persidangan]
    answers: [moyang]
    words: [moyang, penolakan, persidangan]
    explain:
      ar_eg: nenek moyang = الجدود. penolakan = رفض وpersidangan = محاكمة، ومايجوش بعد nenek.
      ar: nenek moyang = الأجداد. أما penolakan فالرفض، وpersidangan المحاكمة، ولا يأتيان بعد nenek.
      en: nenek moyang means ancestors. penolakan (rejection) and persidangan (trial) don't follow nenek.
  - id: e07
    type: multiple_choice
    question: Warga menyatakan ___ terhadap rencana tambang di tanah adat.
    options: [kesaksian, sanksi, penolakan]
    answer: 2
    explain:
      ar_eg: penolakan = رفض.
      ar: penolakan = رفض.
      en: penolakan = rejection.
    words: [kesaksian, sanksi, penolakan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: محامي الدفاع سمع شهادة شيخ القبيلة.
      ar: استمع محامي الدفاع إلى شهادة زعيم العشيرة.
      en: The defence lawyer heard the customary chief's testimony.
    answer: Pembela mendengarkan kesaksian kepala adat.
    distractors: [putusan, gugatan]
    words: [pembela, kesaksian]
    explain:
      ar_eg: «محامي الدفاع» = Pembela و«شهادة» = kesaksian. putusan = حكم وgugatan = دعوى، مش اللي سمعه.
      ar: «محامي الدفاع» = Pembela و«الشهادة» = kesaksian. أما putusan فالحكم، وgugatan الدعوى.
      en: "\"Defence lawyer\" is pembela and \"testimony\" kesaksian. putusan (verdict) and gugatan (lawsuit) aren't what he heard."
  - id: e09
    type: translate
    direction: from_target
    source_text: Warga desa mengajukan gugatan terhadap perusahaan itu.
    answers_meaning:
      ar_eg: [أهالي القرية رفعوا دعوى على الشركة دي, ناس القرية رفعوا قضية على الشركة]
      ar: [رفع سكان القرية دعوى ضد تلك الشركة, أقام أهل القرية دعوى على الشركة]
      en: [The villagers filed a lawsuit against that company, The villagers sued the company]
    words: [gugatan]
  - id: e10
    type: speaking
    text: Putusan hakim keluar setelah tiga bulan persidangan.
    meaning:
      ar_eg: حكم القاضي طلع بعد تلات شهور من الجلسات.
      ar: صدر حكم القاضي بعد ثلاثة أشهر من المحاكمة.
      en: The judge's ruling came after three months of hearings.
    words: [putusan, persidangan]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, kok rame banget di depan pengadilan?
      ar_eg: يا ماس، ليه فيه زحمة كده قدام المحكمة؟
      ar: يا أخي، لماذا هذا الزحام أمام المحكمة؟
      en: Why is it so busy outside the court?
    - speaker: Mas Rizal
      text: Hari ini ada persidangan gugatan warga Dayak lawan perusahaan kayu.
      ar_eg: النهارده جلسة دعوى أهالي الداياك ضد شركة خشب.
      ar: اليوم جلسة دعوى سكان الداياك ضد شركة أخشاب.
      en: Today is the hearing of the Dayak villagers' suit against a logging company.
    - speaker: Mohamed
      text: Tuntutan mereka apa?
      ar_eg: هم طالبين إيه؟
      ar: ما مطالبهم؟
      en: What are they demanding?
    - speaker: Mas Rizal
      text: Pengakuan atas hutan nenek moyang mereka. Pembelanya bawa kesaksian dari tiga kepala adat.
      ar_eg: الاعتراف بغابة أجدادهم. المحامي بتاعهم جايب شهادة تلات شيوخ قبايل.
      ar: الاعتراف بغابة أجدادهم. وقد جاء محاميهم بشهادات ثلاثة زعماء عشائر.
      en: Recognition of their ancestral forest. Their lawyer has testimony from three customary chiefs.
    - speaker: Mohamed
      text: Kalau putusannya penolakan, gimana?
      ar_eg: ولو الحكم كان رفض؟
      ar: وإن جاء الحكم بالرفض؟
      en: And if the ruling is a rejection?
    - speaker: Mas Rizal
      text: Mereka bakal banding. Tapi kalau menang, perusahaannya bisa kena sanksi.
      ar_eg: هيستأنفوا. بس لو كسبوا، الشركة ممكن تتعاقب.
      ar: سيستأنفون. لكن إن ربحوا فقد تُعاقب الشركة.
      en: They'll appeal. But if they win, the company could be sanctioned.
