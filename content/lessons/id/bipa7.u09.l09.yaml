  - id: e03
    type: listen
    text: Banyak korban konflik masih menunggu bantuan rumah.
    question:
      ar_eg: مين اللي لسه مستني مساعدة؟
      ar: مَن ما زال ينتظر المساعدة؟
      en: Who is still waiting for aid?
    options: [ضحايا الصراع, الوسطاء, زعماء العرف]
    answer: 0
    meaning:
      ar_eg: ضحايا صراع كتير لسه مستنيين مساعدة في السكن.
      ar: ما زال كثير من ضحايا النزاع ينتظرون المساعدة في السكن.
      en: Many conflict victims are still waiting for housing aid.
    words: [korban konflik]
  - id: e04
    type: fill_blank
    sentence: Seorang ___ harus netral dan dipercaya kedua pihak.
    meaning:
      ar_eg: الـ ___ لازم يبقى محايد والطرفين يثقوا فيه.
      ar: يجب أن يكون ___ محايدًا موثوقًا لدى الطرفين.
      en: A ___ must be neutral and trusted by both sides.
    options: [mediator, hukum adat, rekonsiliasi]
    answers: [mediator]
    words: [mediator, hukum adat, rekonsiliasi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «panas pela» إيه؟
      ar: ما «panas pela»؟
      en: What is 'panas pela'?
    options: [Makanan pedas dari Ambon., Upacara untuk memperbarui ikatan pela antarnegeri., Konflik antardesa.]
    answer: 1
    explain:
      ar_eg: ده طقس تجديد حلف البيلا.
      ar: هو طقس تجديد حلف «بيلا».
      en: It's the ceremony renewing the pela bond.
    words: [panas pela, sumpah adat]
  - id: e06
    type: fill_blank
    sentence: Sengketa tanah itu diselesaikan dengan ___, bukan di pengadilan.
    meaning:
      ar_eg: خناقة الأرض دي اتحلّت بـ ___، مش في المحكمة.
      ar: حُلّ نزاع الأرض بـ ___ لا في المحكمة.
      en: That land dispute was settled by ___, not in court.
    options: [hukum adat, korban konflik, juru damai]
    answers: [hukum adat]
    words: [hukum adat, korban konflik, juru damai]
  - id: e07
    type: build_sentence
    source:
      ar_eg: المصالحة بتاخد وقت طويل.
      ar: تحتاج المصالحة إلى وقت طويل.
      en: Reconciliation takes a long time.
    answer: Rekonsiliasi membutuhkan waktu yang lama.
    distractors: [mediasi, mediator]
    words: [rekonsiliasi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Sumpah adat leluhur melarang dua negeri itu saling menyakiti.
    answers_meaning:
      ar_eg: [اليمين العرفي بتاع الأجداد بيمنع القريتين يأذوا بعض, يمين الأجداد العرفي بيحرّم على القريتين الأذى]
      ar: [يحرّم القسم العرفي للأجداد على القريتين أن تؤذي إحداهما الأخرى, يمنع قسم الأسلاف العرفي القريتين من التآذي]
      en: ['The ancestors'' customary oath forbids the two villages to harm each other', An ancestral oath bars the two villages from hurting one another]
    words: [sumpah adat]
  - id: e09
    type: speaking
    text: Mediasi para juru damai menghentikan kekerasan.
    meaning:
      ar_eg: وساطة صنّاع السلام وقّفت العنف.
      ar: أوقفت وساطة صنّاع السلام العنف.
      en: The peacemakers' mediation stopped the violence.
    words: [mediasi, juru damai]
  - id: e10
    type: multiple_choice
    question: Apa yang terjadi setelah kekerasan berhenti?
    options: [Panas pela dilarang., Semua mediator pergi., Proses rekonsiliasi dan pemulihan korban konflik.]
    answer: 2
    explain:
      ar_eg: بعد العنف بتبدأ المصالحة ومساعدة الضحايا.
      ar: بعد العنف تبدأ المصالحة ورعاية الضحايا.
      en: After the violence comes reconciliation and care for victims.
    words: [rekonsiliasi, korban konflik, panas pela, mediator, mediasi, juru damai, sumpah adat]
dialogue:
  lines:
    - speaker: Pak Daeng
      text: Waktu konflik di Ambon, saya jadi relawan di posko pengungsian.
      ar_eg: وقت الصراع في أمبون، كنت متطوّع في مخيّم النازحين.
      ar: في أثناء نزاع أمبون كنت متطوّعًا في مركز النازحين.
      en: During the Ambon conflict, I volunteered at a displacement shelter.
    - speaker: Mohamed
      text: Siapa yang menjadi juru damai saat itu, Pak?
      ar_eg: مين اللي كانوا صنّاع السلام وقتها يا أستاذ؟
      ar: من كانوا صنّاع السلام حينها يا أستاذ؟
      en: Who were the peacemakers then, sir?
    - speaker: Pak Daeng
      text: Banyak. Ibu-ibu dari dua pihak, pemuda, juga tokoh adat yang memimpin mediasi.
      ar_eg: كتير. ستّات من الطرفين، وشباب، وكمان كبار العرف اللي قادوا الوساطة.
      ar: 'كثيرون: نساء من الجانبين وشباب وزعماء عرفيّون قادوا الوساطة.'
      en: Many. Women from both sides, young people, and customary leaders who led the mediation.
    - speaker: Mohamed
      text: Apakah hukum adat membantu rekonsiliasi?
      ar_eg: القانون العرفي ساعد في المصالحة؟
      ar: هل ساعد القانون العرفي على المصالحة؟
      en: Did customary law help the reconciliation?
    - speaker: Pak Daeng
      text: 'Sangat. Orang ingat sumpah adat leluhur: kita basudara.'
      ar_eg: 'جدًا. الناس افتكروا يمين الأجداد: إحنا إخوات.'
      ar: 'كثيرًا، فقد تذكّر الناس قسم الأجداد: نحن إخوة.'
      en: 'Very much. People remembered the ancestors'' oath: we are siblings.'
