schema: kabar.lesson/v1
id: bipa7.u09.l09
language: id
title: Pidato persatuan
can_do:
  ar_eg: تلقي خطبة قصيّرة عن الوحدة في مهرجان، بافتتاح وختام رسمي.
  ar: أن تلقي خطبة قصيرة عن الوحدة في مهرجان، بافتتاح وختام رسميَّين.
  en: Give a short unity speech at a festival, with a formal opening and close.
slides:
  - title: Saudara-saudara sebangsa dan setanah air
    body:
      ar_eg: |
        أشهر افتتاح لخطبة وطنية:
        «Saudara-saudara sebangsa dan setanah air…»
        - sebangsa = من نفس الأمّة
        - setanah air = من نفس الوطن (tanah air = الأرض والمية = الوطن)
        شكل الخطبة القصيّرة:
        1. Yang saya hormati… (التحية)
        2. فكرة واحدة + مثال: pela gandong، أو جامع وكنيسة جنب بعض.
        3. الختام بالشعار: Bhinneka Tunggal Ika! Berbeda-beda, tetapi tetap satu.
      ar: |
        أشهر مطلع للخطبة الوطنية:
        «Saudara-saudara sebangsa dan setanah air…»
        - sebangsa = من الأمّة نفسها
        - setanah air = من الوطن نفسه (tanah air = الأرض والماء = الوطن)
        هيكل الخطبة القصيرة:
        ١. Yang saya hormati… (التحية)
        ٢. فكرة واحدة ومثال: pela gandong، أو مسجد وكنيسة متجاوران.
        ٣. الختام بالشعار: Bhinneka Tunggal Ika! Berbeda-beda, tetapi tetap satu.
      en: |
        The most famous opening of a national speech:
        "Saudara-saudara sebangsa dan setanah air…"
        - sebangsa = of the same nation
        - setanah air = of the same homeland (tanah air = land and water = homeland)
        A short speech:
        1. Yang saya hormati… (greeting)
        2. One idea plus an example: pela gandong, or a mosque and church side by side.
        3. Close with the motto: Bhinneka Tunggal Ika! Berbeda-beda, tetapi tetap satu.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: «tanah air» حرفيًا يعني إيه؟
      ar: ما المعنى الحرفيّ لـ «tanah air»؟
      en: What does "tanah air" literally mean?
    options:
      - الأرض والمية.
      - السما والبحر.
      - البيت والشارع.
    answer: 0
    explain:
      ar_eg: tanah = أرض، air = مية. بلد جزر، فالوطن أرض وبحر مع بعض.
      ar: tanah = أرض، وair = ماء. فهي بلاد جزر، والوطن فيها برّ وبحر معًا.
      en: tanah = land, air = water. An island nation's homeland is land and sea together.
    words: [setanah air]
  - id: e02
    type: listen
    text: Saudara-saudara sebangsa dan setanah air, malam ini kita berkumpul sebagai satu keluarga.
    question:
      ar_eg: المتكلّم بيقول إيه للناس؟
      ar: ماذا يقول المتكلّم للحاضرين؟
      en: What is the speaker telling people?
    options:
      - إن المهرجان اتلغى.
      - إنهم متجمّعين النهارده كعيلة واحدة.
      - إن الأكل خلص.
    answer: 1
    words: [sebangsa, setanah air]
  - id: e03
    type: fill_blank
    sentence: Kita semua bersaudara karena kita ___ dan setanah air.
    meaning:
      ar_eg: كلنا إخوات علشان إحنا من نفس الأمّة ونفس الوطن.
      ar: كلّنا إخوة لأنّنا من أمّة واحدة ووطن واحد.
      en: We're all kin because we share one nation and one homeland.
    options: [sebangsa, terpencil, nontunai]
    answers: [sebangsa]
    words: [sebangsa]
  - id: e04
    type: build_sentence
    source:
      ar_eg: مختلفين، بس واحد.
      ar: مختلفون، لكنّنا واحد.
      en: Different, yet one.
    answer: Berbeda-beda, tetapi tetap satu.
    distractors: [sebangsa, tanah]
    words: [Bhinneka Tunggal Ika]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أحسن مثال تحطّه في خطبة عن الوحدة إيه؟
      ar: ما أفضل مثال في خطبة عن الوحدة؟
      en: What's the best example for a unity speech?
    options:
      - سعر الرز في السوق.
      - نتيجة ماتش كورة.
      - قرية مسيحية بتساعد قرية مسلمة تبني جامع.
    answer: 2
    words: [pela gandong, kerukunan]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: يا إخواني من نفس الوطن، شكرًا إنكم جيتوا.
      ar: أيّها الإخوة أبناء الوطن الواحد، شكرًا على حضوركم.
      en: Fellow citizens of one homeland, thank you for coming.
    answers:
      - Saudara-saudara setanah air, terima kasih sudah datang.
      - Saudara-saudara sebangsa dan setanah air, terima kasih sudah datang.
      - Saudara-saudara setanah air, terima kasih atas kehadirannya.
      - Saudara-saudara sebangsa dan setanah air, terima kasih atas kehadiran Anda.
    words: [setanah air]
  - id: e07
    type: speaking
    text: Yang saya hormati Bapak Kepala Kampung, dan saudara-saudara sebangsa dan setanah air.
    meaning:
      ar_eg: حضرة رئيس القرية المحترم، ويا إخواني من نفس الأمّة والوطن.
      ar: حضرةَ رئيس القرية المحترم، أيّها الإخوة أبناء الأمّة والوطن.
      en: Respected village head, and fellow citizens of one nation and one homeland.
    words: [yang saya hormati, sebangsa, setanah air]
  - id: e08
    type: dictation
    text: Kita sebangsa, walaupun bahasa ibu kita berbeda.
    meaning:
      ar_eg: إحنا أمّة واحدة، حتى لو لغاتنا الأم مختلفة.
      ar: نحن أمّة واحدة وإن اختلفت لغاتنا الأمّ.
      en: We are one nation, even though our mother tongues differ.
    words: [sebangsa]
  - id: e09
    type: speaking
    text: Bhinneka Tunggal Ika! Kita sebangsa dan setanah air. Terima kasih.
    meaning:
      ar_eg: الوحدة في التنوّع! إحنا أمّة واحدة ووطن واحد. شكرًا.
      ar: الوحدة في التنوّع! نحن أمّة واحدة ووطن واحد. شكرًا.
      en: Unity in diversity! We are one nation, one homeland. Thank you.
    words: [Bhinneka Tunggal Ika, sebangsa]
dialogue:
  title: Lima menit di panggung
  lines:
    - speaker: Kak Yosua
      text: Panitia festival minta kamu pidato lima menit tentang persatuan. Bisa?
      ar_eg: لجنة المهرجان عايزاك تلقي خطبة خمس دقايق عن الوحدة. تقدر؟
      ar: تطلب لجنة المهرجان أن تلقي خطبة من خمس دقائق عن الوحدة. أتستطيع؟
      en: The festival committee wants you to give a five-minute speech on unity. Can you?
    - speaker: Mohamed
      text: Bisa. Saya buka dengan "Saudara-saudara sebangsa dan setanah air".
      ar_eg: أقدر. هبدأ بـ «يا إخواني من نفس الأمّة والوطن».
      ar: نعم، وسأستهلّ بـ«أيّها الإخوة أبناء الأمّة والوطن».
      en: Yes. I'll open with "Saudara-saudara sebangsa dan setanah air".
    - speaker: Kak Yosua
      text: Bagus. Tapi kamu bukan orang Indonesia. Apa tidak aneh?
      ar_eg: حلو. بس إنت مش إندونيسي. مش غريبة شوية؟
      ar: جيّد، لكنّك لست إندونيسيًّا. أليس ذلك غريبًا؟
      en: Good. But you're not Indonesian. Isn't that a bit odd?
    - speaker: Mohamed
      text: Kalau begitu saya bilang, "Saudara-saudara yang saya cintai". Lalu saya cerita tentang pela gandong.
      ar_eg: يبقى هقول «يا إخواني اللي بحبّهم». وبعدين هحكي عن البيلا جاندونج.
      ar: إذن سأقول «أيّها الإخوة الأحبّة»، ثمّ أحكي عن البيلا غاندونغ.
      en: Then I'll say, "My dear brothers and sisters". Then I'll tell them about pela gandong.
