schema: kabar.lesson/v1
id: bipa7.u09.l09
language: id
title: Juru damai dari Maluku
can_do:
  ar_eg: تحكي إزاي مجتمع اتصالح بعد صراع، بالقانون وبالعرف.
  ar: أن تروي كيف تصالح مجتمع بعد نزاع، بالقانون والعرف.
  en: Tell how a community reconciled after conflict, through law and custom.
slides:
  - title: Setelah konflik
    body:
      ar_eg: |
        بين 1999 و2002 حصل صراع مؤلم في مالوكو، وآلاف من korban konflik.
        juru damai = صنّاع السلام: ستّات وشباب وزعماء دين. mediasi = الوساطة، وmediator = الوسيط.
        اتفاق مالينو التاني (2002) ساعد في وقف العنف، وبعده بدأت rekonsiliasi (المصالحة).
        العرف كمان ساعد: hukum adat (القانون العرفي) وsumpah adat (اليمين العرفي) القديم بين القرى.
        panas pela = طقس تجديد حلف الـ pela بين قرية مسلمة وقرية مسيحية.
      ar: |
        بين 1999 و2002 وقع نزاع مؤلم في مالوكو، وسقط آلاف من korban konflik.
        juru damai = صنّاع السلام: نساء وشباب وزعماء دينيون. mediasi = الوساطة، وmediator = الوسيط.
        ساعد اتفاق مالينو الثاني (2002) على وقف العنف، ثمّ بدأت rekonsiliasi (المصالحة).
        وأسهم العرف كذلك: hukum adat (القانون العرفي) وsumpah adat (القسم العرفي) القديم بين القرى.
        panas pela = طقس تجديد حلف الـ pela بين قرية مسلمة وقرية مسيحية.
      en: |
        From 1999 to 2002 Maluku suffered a painful conflict, with thousands of korban konflik (victims).
        juru damai = peacemakers: women, youth and religious leaders. mediasi = mediation; a mediator mediates.
        The Malino II agreement (2002) helped stop the violence, and rekonsiliasi (reconciliation) began.
        Custom helped too: hukum adat (customary law) and the old sumpah adat (customary oath) between villages.
        panas pela = the ceremony renewing the pela alliance between a Muslim and a Christian village.
    examples:
      - text: Ibu-ibu itu menjadi juru damai di kampung mereka.
        ar_eg: الستّات دول بقوا صنّاع سلام في قريتهم.
        ar: صارت تلك النساء صانعات سلام في قريتهنّ.
        en: Those women became peacemakers in their village.
      - text: Mediasi berlangsung selama tiga hari.
        ar_eg: الوساطة استمرّت تلات أيام.
        ar: استمرّت الوساطة ثلاثة أيّام.
        en: The mediation lasted three days.
      - text: Upacara panas pela memperkuat ikatan dua negeri.
        ar_eg: طقس تجديد البيلا بيقوّي الرابط بين القريتين.
        ar: يقوّي طقس «بانس بيلا» الرابطة بين القريتين.
        en: The panas pela ceremony strengthens the bond between two villages.
