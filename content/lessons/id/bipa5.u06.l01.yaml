schema: kabar.lesson/v1
id: bipa5.u06.l01
language: id
title: Memperbaiki, mempertunjukkan
can_do:
  ar_eg: تستخدم أفعال memper- عشان تقول «يزوّد» أو تتكلم عن العروض الفنية.
  ar: أن تستعمل أفعال memper- للتكثير وللحديث عن العروض الفنّية.
  en: Use memper- verbs to say "make more" and to talk about performances.
slides:
  - title: memper- + kata sifat
    grammar: id.prefix.memper
    body:
      ar_eg: |
        memper- + صفة = «يخلّي الحاجة أكتر»:
        - luas (واسع) → memperluas = يوسّع أكتر
        - kuat (قوي) → memperkuat = يقوّي
        - panjang (طويل) → memperpanjang = يطوّل / يمدّد
        والمجهول diper-: Visanya diperpanjang. = الفيزا اتمدّت.
      ar: |
        memper- مع الصفة = «جعله أكثر»:
        - luas (واسع) → memperluas = وسّعه أكثر
        - kuat (قويّ) → memperkuat = قوّاه
        - panjang (طويل) → memperpanjang = مدّده
        والمجهول diper-: Visanya diperpanjang. = مُدّدت التأشيرة.
      en: |
        memper- + adjective = "make more X":
        - luas (wide) → memperluas = widen further
        - kuat (strong) → memperkuat = strengthen
        - panjang (long) → memperpanjang = extend
        Passive diper-: Visanya diperpanjang. = The visa was extended.
  - title: memper-…-kan dan memper-…-i
    grammar: id.prefix.memper
    body:
      ar_eg: |
        فيه أفعال memper- ثابتة، احفظها ككلمة:
        - mempertunjukkan = يعرض (عرض فني)، ومنه pertunjukan = عرض
        - memperkenalkan = يعرّف (حد بحد أو بحاجة)
        - memperbaiki = يصلّح
        - mempelajari = يدرس بعمق (per- بقت pel- هنا)
      ar: |
        وثمّة أفعال ثابتة تُحفظ كما هي:
        - mempertunjukkan = يعرض عرضًا فنّيًّا، ومنها pertunjukan = عرض
        - memperkenalkan = يعرّف بـ
        - memperbaiki = يُصلح
        - mempelajari = يدرس بعمق (صارت per- هنا pel-)
      en: |
        Some memper- verbs are fixed; learn them as words:
        - mempertunjukkan = to perform, to stage; pertunjukan = a performance
        - memperkenalkan = to introduce
        - memperbaiki = to repair
        - mempelajari = to study in depth (per- becomes pel-)
    examples:
      - text: Para penari mempertunjukkan tari enggang di depan tamu.
        ar_eg: الراقصين قدّموا رقصة طائر أبو قرن قدام الضيوف.
        ar: قدّم الراقصون رقصة طائر أبي قرن أمام الضيوف.
        en: The dancers performed the hornbill dance in front of the guests.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: memperkuat
        ar_eg: يقوّي
        ar: يقوّي
        en: to strengthen
      - text: mempertunjukkan
        ar_eg: يعرض (عرض فني)
        ar: يعرض عرضًا فنّيًّا
        en: to perform, to stage
      - text: memperkenalkan
        ar_eg: يعرّف بـ
        ar: يعرّف بـ
        en: to introduce
      - text: memperbaiki
        ar_eg: يصلّح
        ar: يُصلح
        en: to repair
      - text: pertunjukan
        ar_eg: عرض
        ar: عرض
        en: performance
    words: [memperkuat, mempertunjukkan, memperkenalkan, memperbaiki, pertunjukan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «الفرقة بتقدّم عرض رقص» تتقال إزاي؟
      ar: كيف تقول «تقدّم الفرقة عرض رقص»؟
      en: How do you say "The troupe performs a dance"?
    options:
      - Sanggar itu memperbaiki tarian.
      - Sanggar itu memperkuat tarian.
      - Sanggar itu mempertunjukkan tarian.
    answer: 2
    words: [mempertunjukkan]
  - id: e03
    type: fill_blank
    sentence: Mas Rizal ___ saya kepada kepala sanggar.
    meaning:
      ar_eg: ريزال عرّفني على مدير الفرقة.
      ar: عرّفني ريزال إلى رئيس الفرقة.
      en: Mas Rizal introduced me to the head of the studio.
    options: [memperkenalkan, mempertunjukkan, memperbaiki]
    answers: [memperkenalkan]
    words: [memperkenalkan]
  - id: e04
    type: listen
    text: Pertunjukan tari Dayak dimulai jam tujuh malam.
    question:
      ar_eg: إمتى العرض؟
      ar: متى يبدأ العرض؟
      en: When does the show start?
    options:
      - الساعة سبعة الصبح.
      - الساعة سبعة بالليل.
      - الساعة تسعة بالليل.
    answer: 1
    words: [pertunjukan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الراقصين بيقدّموا رقصة طائر أبو قرن.
      ar: يقدّم الراقصون رقصة طائر أبي قرن.
      en: The dancers perform the hornbill dance.
    answer: Para penari mempertunjukkan tari enggang.
    distractors: [memperbaiki, pertunjukan]
    words: [mempertunjukkan]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الحكومة عايزة تقوّي الثقافة المحلية.
      ar: تريد الحكومة تقوية الثقافة المحلّية.
      en: The government wants to strengthen local culture.
    answers:
      - Pemerintah ingin memperkuat budaya lokal.
      - Pemerintah ingin memperkuat budaya daerah.
      - Pemerintah mau memperkuat budaya lokal.
      - Pemerintah ingin memperkuat kebudayaan lokal.
    words: [memperkuat]
  - id: e07
    type: multiple_choice
    question: "Kostum penari yang rusak sudah ___."
    question_meaning:
      ar_eg: كمّل الجملة. «لبس الراقصة اللي كان بايظ … خلاص.»
      ar: أكمل الجملة. «زيّ الراقصة التالف قد … .»
      en: Complete the sentence. "The dancer's damaged costume has been …."
    options: [diperbaiki, dipertunjukkan, diperkenalkan]
    answer: 0
    explain:
      ar_eg: diper- هو المجهول، وmemperbaiki = يصلّح.
      ar: diper- للمجهول، وmemperbaiki = يُصلح.
      en: diper- is the passive; memperbaiki = repair.
    words: [memperbaiki]
  - id: e08
    type: speaking
    text: Pertunjukan malam ini memperkenalkan budaya Dayak kepada turis.
    meaning:
      ar_eg: عرض الليلة دي بيعرّف السياح بثقافة الداياك.
      ar: يعرّف عرض الليلة السيّاح بثقافة الداياك.
      en: Tonight's show introduces tourists to Dayak culture.
    words: [pertunjukan, memperkenalkan]
  - id: e09
    type: dictation
    text: Kami perlu memperkuat dan memperbaiki panggung ini.
    meaning:
      ar_eg: محتاجين نقوّي ونصلّح المسرح ده.
      ar: نحتاج إلى تقوية هذا المسرح وإصلاحه.
      en: We need to strengthen and repair this stage.
    words: [memperkuat, memperbaiki]
dialogue:
  title: Di sanggar tari Palangka Raya
  lines:
    - speaker: Mas Rizal
      text: Mohamed, saya ingin memperkenalkan kamu kepada Bu Lestari. Beliau melatih penari di sini.
      ar_eg: يا محمد، عايز أعرّفك على الأستاذة ليستاري. هي بتدرّب الراقصين هنا.
      ar: يا محمد، أودّ أن أعرّفك إلى الأستاذة ليستاري، فهي تدرّب الراقصين هنا.
      en: Mohamed, I'd like to introduce you to Bu Lestari. She trains the dancers here.
    - speaker: Bu Lestari
      text: Selamat datang. Malam ini kami mempertunjukkan tari enggang.
      ar_eg: أهلًا بيك. الليلة دي هنقدّم رقصة طائر أبو قرن.
      ar: مرحبًا بك. نقدّم الليلة رقصة طائر أبي قرن.
      en: Welcome. Tonight we're performing the hornbill dance.
    - speaker: Mohamed
      text: Apa tujuan sanggar ini, Bu?
      ar_eg: إيه هدف الفرقة دي يا أستاذة؟
      ar: ما هدف هذه الفرقة يا أستاذة؟
      en: What is this studio's aim, ma'am?
    - speaker: Bu Lestari
      text: Kami ingin memperkuat budaya Dayak supaya anak muda tetap mengenalnya.
      ar_eg: عايزين نقوّي ثقافة الداياك عشان الشباب يفضلوا عارفينها.
      ar: نريد تقوية ثقافة الداياك ليبقى الشباب على معرفة بها.
      en: We want to strengthen Dayak culture so young people keep knowing it.
