    answer: 2
    explain:
      ar_eg: jijik = قرفان.
      ar: jijik = مشمئزّ.
      en: jijik = grossed out.
    words: [kenyang, traktir, jijik]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الكابوريا والمحار طازة النهارده.
      ar: السلطعون والمحار طازجان اليوم.
      en: The crab and clams are fresh today.
    answer: Kepiting dan kerang hari ini segar.
    distractors: [mentega, mertua]
    words: [kepiting, kerang, mentega]
  - id: e09
    type: translate
    direction: from_target
    source_text: Malam ini saya traktir, ya!
    answers_meaning:
      ar_eg: [الليلة أنا اللي عازم!, الليلة على حسابي!]
      ar: [الحساب عليّ الليلة!, أنا أدعوكم الليلة!]
      en: ['Tonight it''s on me!', 'Tonight I''m paying!']
    words: [traktir]
  - id: e10
    type: speaking
    text: Mertua saya memasak kepiting dan kerang untuk buka puasa.
    meaning:
      ar_eg: حماتي طبخت كابوريا ومحار للفطار.
      ar: طبخت حماتي سلطعونًا ومحارًا للإفطار.
      en: My mother-in-law cooked crab and clams for iftar.
    words: [mertua, kepiting, kerang, puasa]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, buka puasa nanti di rumah mertuaku. Kamu ikut, ya!
      ar_eg: يا محمد، الفطار النهارده عند حماتي. تعالى معانا!
      ar: يا محمد، الإفطار اليوم في بيت حماتي. تعالَ معنا!
      en: Mohamed, iftar tonight is at my in-laws'. Come along!
    - speaker: Mohamed
      text: Makasih. Mereka masak apa?
      ar_eg: شكرًا. هيطبخوا إيه؟
      ar: شكرًا. ماذا يطبخون؟
      en: Thanks. What are they cooking?
    - speaker: Rina
      text: Kepiting saus mentega sama sup kerang. Ibu mertuaku jago masak, lho.
      ar_eg: كابوريا بصوص الزبدة وشوربة محار. حماتي شاطرة في الطبخ.
      ar: سلطعون بصلصة الزبدة وحساء محار. حماتي ماهرة في الطبخ.
      en: Crab in butter sauce and clam soup. My mother-in-law is a great cook.
    - speaker: Mohamed
      text: Waduh, aku agak jijik sama kerang... tapi kalau kepiting aku suka.
      ar_eg: يا خبر، أنا بقرف شوية من المحار... بس بحب الكابوريا.
      ar: يا إلهي، أشمئزّ قليلًا من المحار... لكني أحبّ السلطعون.
      en: Uh-oh, clams gross me out a bit... but I love crab.
    - speaker: Rina
      text: Nggak apa-apa. Yang penting nanti kamu kenyang.
      ar_eg: مش مشكلة. المهم تشبع.
      ar: لا بأس. المهم أن تشبع.
      en: No problem. What matters is you leave full.
    - speaker: Mohamed
      text: Kalau gitu, besok aku yang traktir es kelapa muda, deh!
      ar_eg: يبقى بكرة أنا اللي هعزم على جوز الهند الساقع!
      ar: إذن غدًا أدعوكم أنا على عصير جوز الهند البارد!
      en: Then tomorrow the young-coconut ice is on me!
