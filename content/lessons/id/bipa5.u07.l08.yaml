        ar_eg: يعزم على حسابه
        ar: يدعو على حسابه
        en: to treat
      - text: kenyang
        ar_eg: شبعان
        ar: شبعان
        en: full
    words: [puasa, mertua, traktir, kenyang]
  - id: e02
    type: match_pairs
    pairs:
      - text: jijik
        ar_eg: قرفان، مقرف
        ar: مشمئزّ
        en: disgusted
      - text: kepiting
        ar_eg: كابوريا
        ar: سلطعون
        en: crab
      - text: kerang
        ar_eg: محار
        ar: محار
        en: clam
      - text: mentega
        ar_eg: زبدة
        ar: زبدة
        en: butter
    words: [jijik, kepiting, kerang, mentega]
  - id: e03
    type: listen
    text: Saya puasa, jadi saya makan setelah azan magrib. Biasanya saya minum teh manis dulu, lalu salat, dan baru makan nasi.
    question:
      ar_eg: بيعمل إيه الأول لما يفطر؟
      ar: ماذا يفعل أولًا عند الإفطار؟
      en: What does he do first when he breaks the fast?
    options:
      - Dia langsung makan nasi.
      - Dia salat dulu sebelum minum.
      - Dia minum teh manis dulu.
    answer: 2
    meaning:
      ar_eg: أنا صايم، فهاكل بعد أدان المغرب. عادةً بشرب شاي بسكر الأول، وبعدين أصلي، وبعدها بس آكل رز.
      ar: أنا صائم، فسآكل بعد أذان المغرب. عادةً أشرب شايًا محلًّى أولًا، ثم أصلّي، وبعدها آكل الأرز.
      en: I'm fasting, so I eat after the maghrib call. Usually I drink sweet tea first, then pray, and only then eat rice.
    explain:
      ar_eg: minum teh manis dulu = يشرب شاي الأول، lalu salat = وبعدين يصلي، dan baru makan nasi = وبعدها ياكل.
      ar: minum teh manis dulu = يشرب الشاي أولًا، ثم lalu salat = يصلّي، ثم baru makan nasi = يأكل.
      en: minum teh manis dulu = sweet tea first; lalu salat = then prays; baru makan nasi = only then rice.
    words: [puasa]
  - id: e04
    type: fill_blank
    sentence: Sudah tiga piring! Saya ___ sekali.
    meaning:
      ar_eg: تلات أطباق! أنا ___ خالص.
      ar: ثلاثة صحون! أنا ___ تمامًا.
      en: Three plates already! I'm so ___.
    options: [kenyang, jijik, mertua]
    answers: [kenyang]
    words: [kenyang, jijik, mertua]
    explain:
      ar_eg: تلات أطباق فأنا kenyang (شبعان). jijik = قرفان وmertua = حما/حماة.
      ar: ثلاثة صحون فأنا kenyang (شبعان). أما jijik فـ«مشمئزّ»، وmertua الحمو أو الحماة.
      en: Three plates means kenyang (full). jijik (disgusted) and mertua (in-law) don't fit.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مرات أخوك؟ لأ. أبو مراتك أو أمها. اسمهم إيه؟
      ar: زوجة أخيك؟ لا. والد زوجتك أو أمها. ما اسمهما؟
      en: 'Not your sister-in-law: your wife''s father or mother. What are they?'
    options: [kerang, mertua, traktir]
    answer: 1
    explain:
      ar_eg: mertua = حما أو حماة.
      ar: mertua = الحمو أو الحماة.
      en: mertua = parent-in-law.
    words: [kerang, mertua, traktir]
  - id: e06
    type: fill_blank
    sentence: Roti ini enak dengan ___ dan madu.
    meaning:
      ar_eg: العيش ده حلو بالـ ___ والعسل.
      ar: هذا الخبز لذيذ مع ___ والعسل.
      en: This bread is good with ___ and honey.
    options: [mentega, puasa, kepiting]
    answers: [mentega]
    words: [mentega, puasa, kepiting]
    explain:
      ar_eg: العيش بالـ mentega (زبدة) والعسل. puasa = صيام وkepiting = كابوريا، مش بتتدهن.
      ar: الخبز مع mentega (الزبدة) والعسل. أما puasa فالصيام، وkepiting السلطعون.
      en: Bread with mentega (butter) and honey. puasa (fasting) and kepiting (crab) don't go on bread.
  - id: e07
    type: multiple_choice
    question: Ada ulat di dalam sayur ini! Saya ___.
    options: [kenyang, traktir, jijik]
    answer: 2
    explain:
      ar_eg: jijik = قرفان.
      ar: jijik = مشمئزّ.
      en: jijik = grossed out.
    words: [kenyang, traktir, jijik]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الكابوريا والمحار طازة النهارده.
      ar: السلطعون والمحار طازجان اليوم.
      en: The crab and clams are fresh today.
    answer: Kepiting dan kerang hari ini segar.
    distractors: [mentega, mertua]
    words: [kepiting, kerang, mentega]
    explain:
      ar_eg: «الكابوريا» = Kepiting و«المحار» = kerang. mentega = زبدة وmertua = حما، مش في الجملة.
      ar: «السلطعون» = Kepiting و«المحار» = kerang. أما mentega فالزبدة، وmertua الحمو.
      en: "\"Crab\" is kepiting and \"clams\" kerang. mentega and mertua aren't in it."
  - id: e09
    type: translate
    direction: from_target
    source_text: Malam ini saya traktir, ya, karena kemarin kalian sudah membayar makan siang saya!
    answers_meaning:
      ar_eg: [الليلة أنا اللي عازم، عشان إنتو امبارح دفعتوا الغدا بتاعي!, الليلة على حسابي، لأنكم امبارح حاسبتوا على غدايا!]
      ar: [الحساب عليّ الليلة، لأنّكم دفعتم ثمن غدائي أمس!, أنا أدعوكم الليلة، فقد دفعتم غدائي البارحة!]
      en: ['Tonight it''s on me, because you paid for my lunch yesterday!', 'Tonight I''m paying, since you covered my lunch yesterday!']
    explain:
      ar_eg: karena = عشان، بتجيب سبب العزومة.
      ar: karena = لأنّ، وتأتي بسبب الدعوة.
      en: karena = because, giving the reason for the treat.
    words: [traktir]
  - id: e10
    type: speaking
    text: Mertua saya memasak kepiting dan kerang untuk buka puasa.
    meaning:
      ar_eg: حماتي طبخت كابوريا ومحار للفطار.
      ar: طبخت حماتي سلطعونًا ومحارًا للإفطار.
      en: My mother-in-law cooked crab and clams for iftar.
    words: [mertua, kepiting, kerang, puasa]
dialogue:
  lines:
    - speaker: Rina
      text: Mohamed, buka puasa nanti di rumah mertuaku. Kamu ikut, ya!
      ar_eg: يا محمد، الفطار النهارده عند حماتي. تعالى معانا!
      ar: يا محمد، الإفطار اليوم في بيت حماتي. تعالَ معنا!
      en: Mohamed, iftar tonight is at my in-laws'. Come along!
    - speaker: Mohamed
      text: Makasih. Mereka masak apa?
      ar_eg: شكرًا. هيطبخوا إيه؟
      ar: شكرًا. ماذا يطبخون؟
      en: Thanks. What are they cooking?
    - speaker: Rina
      text: Kepiting saus mentega sama sup kerang. Ibu mertuaku jago masak, lho.
      ar_eg: كابوريا بصوص الزبدة وشوربة محار. حماتي شاطرة في الطبخ.
      ar: سلطعون بصلصة الزبدة وحساء محار. حماتي ماهرة في الطبخ.
      en: Crab in butter sauce and clam soup. My mother-in-law is a great cook.
    - speaker: Mohamed
      text: Waduh, aku agak jijik sama kerang... tapi kalau kepiting aku suka.
      ar_eg: يا خبر، أنا بقرف شوية من المحار... بس بحب الكابوريا.
      ar: يا إلهي، أشمئزّ قليلًا من المحار... لكني أحبّ السلطعون.
      en: Uh-oh, clams gross me out a bit... but I love crab.
    - speaker: Rina
      text: Nggak apa-apa. Yang penting nanti kamu kenyang.
      ar_eg: مش مشكلة. المهم تشبع.
      ar: لا بأس. المهم أن تشبع.
      en: No problem. What matters is you leave full.
    - speaker: Mohamed
      text: Kalau gitu, besok aku yang traktir es kelapa muda, deh!
      ar_eg: يبقى بكرة أنا اللي هعزم على جوز الهند الساقع!
      ar: إذن غدًا أدعوكم أنا على عصير جوز الهند البارد!
      en: Then tomorrow the young-coconut ice is on me!
