schema: kabar.lesson/v1
id: bipa5.u07.l08
language: id
title: Buka puasa di rumah mertua
can_do:
  ar_eg: 'تحكي عن فطار رمضان عند أهل مراتك: الصيام والعزومة والشبع، والكابوريا والمحار والزبدة، وحاجة تقرف.'
  ar: 'أن تروي إفطار رمضان عند أصهارك: الصيام والدعوة والشبع، والسلطعون والمحار والزبدة، وما يثير الاشمئزاز.'
  en: 'Describe iftar at your in-laws'': fasting, being treated, feeling full, crab, clams and butter, and something gross.'
slides:
  - title: Tamu di bulan Ramadan
    body:
      ar_eg: |
        puasa = صيام: berbuka puasa = يفطر، bulan puasa = رمضان.
        mertua = حما أو حماة، أهل الزوج أو الزوجة. traktir = يعزم على حسابه: Saya traktir! = أنا اللي هدفع!
        kenyang = شبعان (عكس lapar). jijik = يقرف، مقرف: Saya jijik = أنا قرفان.
        kepiting = كابوريا، kerang = محار، جندوفلي، mentega = زبدة (والصلصة saus mentega).
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: makasih = terima kasih، aku = saya، nggak = tidak، gitu = begitu.
      ar: |
        puasa = صيام: berbuka puasa = يُفطر، bulan puasa = رمضان.
        mertua = الحمو أو الحماة، والدا الزوج أو الزوجة. traktir = يدعو على حسابه: Saya traktir! = الحساب عليّ!
        kenyang = شبعان (عكس lapar). jijik = يشمئزّ، مقزّز: Saya jijik = أشعر بالاشمئزاز.
        kepiting = سلطعون، kerang = محار، mentega = زبدة (saus mentega = صلصة الزبدة).
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: makasih = terima kasih، aku = saya، nggak = tidak، gitu = begitu.
      en: |
        puasa = fasting: berbuka puasa = to break the fast, bulan puasa = Ramadan.
        mertua = parent-in-law. traktir = to treat someone (pay): Saya traktir! = it's on me!
        kenyang = full (opposite of lapar). jijik = disgusted, gross: Saya jijik = I'm grossed out.
        kepiting = crab, kerang = clam, shellfish, mentega = butter (saus mentega = butter sauce).
        The dialogue uses street forms; the formal ones are beside them: makasih = terima kasih, aku = saya, nggak = tidak, gitu = begitu.
    examples:
      - text: Mertua saya memasak kepiting saus mentega untuk berbuka puasa.
        ar_eg: حماتي طبخت كابوريا بصوص الزبدة للفطار.
        ar: طبخت حماتي سلطعونًا بصلصة الزبدة للإفطار.
        en: My mother-in-law cooked crab in butter sauce for iftar.
      - text: Terima kasih, saya sudah kenyang sekali.
        ar_eg: شكرًا، أنا شبعت خالص.
        ar: شكرًا، لقد شبعت تمامًا.
        en: Thank you, I'm completely full.
      - text: Malam ini saya traktir semua orang!
        ar_eg: الليلة أنا عازم الكل على حسابي!
        ar: الحساب عليّ للجميع الليلة!
        en: Tonight it's on me for everyone!
