schema: kabar.lesson/v1
id: bipa7.u04.l11
language: id
title: Peta dialek
can_do:
  ar_eg: تكتب تقرير قصير عن لهجة، فين بتتقال وإيه اللي بيميّزها.
  ar: أن تكتب تقريرًا قصيرًا عن لهجة، أين تُتكلّم وما يميّزها.
  en: Write a short report on a dialect, where it is spoken and what marks it out.
slides:
  - title: Kerangka laporan dialek
    grammar: id.register.context
    body:
      ar_eg: |
        تقرير اللهجة بيمشي كده:
        1. الـ sebaran (الانتشار): Dialek Betawi tersebar di Jakarta dan sekitarnya.
        2. الـ penanda (العلامات): Penanda utamanya adalah akhiran -in dan kata ganti gue / lu.
        3. إزاي تـ membedakan (تفرّق): Kita bisa membedakannya dari dialek Medan lewat kata ganti dan partikelnya.
        4. خاتمة: Dialek ini makin populer lewat film dan media sosial.
        الـ kata ganti = الضمير.
        - في الكلام: aja = saja، tambahin = tambahkan.
        - deh = ماشي / خلاص (قرار أو تشجيع). كلمات صغيرة بتدّي الجملة إحساس، ومن غيرها الجملة صح برضه.
      ar: |
        يسير تقرير اللهجة هكذا:
        1. الـ sebaran (الانتشار): Dialek Betawi tersebar di Jakarta dan sekitarnya.
        2. الـ penanda (العلامات): Penanda utamanya adalah akhiran -in dan kata ganti gue / lu.
        3. كيف تـ membedakan (تميّز): Kita bisa membedakannya dari dialek Medan lewat kata ganti dan partikelnya.
        4. الخاتمة: Dialek ini makin populer lewat film dan media sosial.
        والـ kata ganti = الضمير.
        - في الكلام اليومي: aja = saja، tambahin = tambahkan.
        - deh = حسنًا إذن (قرار أو حثّ). أدوات صغيرة تلوّن الجملة، والجملة صحيحة بدونها.
      en: |
        A dialect report runs like this:
        1. Sebaran (spread): Dialek Betawi tersebar di Jakarta dan sekitarnya.
        2. Penanda (markers): Penanda utamanya adalah akhiran -in dan kata ganti gue / lu.
        3. How to membedakan (tell apart): Kita bisa membedakannya dari dialek Medan lewat kata ganti dan partikelnya.
        4. Wrap-up: Dialek ini makin populer lewat film dan media sosial.
        kata ganti = pronoun.
        - In speech: aja = saja, tambahin = tambahkan.
        - deh = okay then (deciding, nudging). Small particles that add feeling; the sentence is correct without them.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sebaran
        ar_eg: انتشار / توزيع
        ar: انتشار
        en: spread, distribution
      - text: kata ganti
        ar_eg: ضمير
        ar: ضمير
        en: pronoun
      - text: membedakan
        ar_eg: يفرّق بين
        ar: يميّز بين
        en: to tell apart, to distinguish
      - text: penanda
        ar_eg: علامة
        ar: علامة / مؤشّر
        en: marker
    words: [sebaran, kata ganti, membedakan, penanda]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحد علامة على لهجة بيتاوي (جاكرتا)؟
      ar: أيّها علامة على لهجة بيتاوي (جاكرتا)؟
      en: Which is a marker of the Betawi (Jakarta) dialect?
    options:
      - Akhiran -in, seperti bacain.
      - Kata ganti kitong.
      - Kata bah.
    answer: 0
    words: [penanda]
    explain:
      ar_eg: علامة (penanda) لهجة بيتاوي اللاحقة -in زي bacain = bacakan. kitong بابوي وbah ميدان.
      ar: علامة لهجة بيتاوي اللاحقة -in مثل bacain، أمّا kitong فبابويّة وbah من ميدان.
      en: 'Betawi marker: -in as in bacain. kitong is Papuan, bah is Medan.'
  - id: e03
    type: fill_blank
    sentence: Peta ini menunjukkan ___ dialek Melayu di Indonesia timur.
    meaning:
      ar_eg: الخريطة دي بتوضّح انتشار لهجات الملايو في شرق إندونيسيا.
      ar: تبيّن هذه الخريطة انتشار لهجات الملايوية في شرق إندونيسيا.
      en: This map shows the spread of Malay dialects in eastern Indonesia.
    options: [sebaran, penanda, kata ganti]
    answers: [sebaran]
    words: [sebaran]
    explain:
      ar_eg: sebaran = انتشار/توزيع على الخريطة. penanda = علامة، وkata ganti = ضمير.
      ar: sebaran = الانتشار الجغرافي. أما penanda فعلامة وkata ganti ضمير.
      en: sebaran = spread. penanda is a marker, kata ganti a pronoun.
  - id: e04
    type: listen
    text: Kata ganti adalah cara paling mudah untuk membedakan dialek. Orang Papua bilang sa, orang Ambon bilang beta, dan orang Jakarta bilang gue. Jadi, dengarkan dulu kata ganti pembicara.
    question:
      ar_eg: إيه أسهل طريقة تفرّق بيها اللهجات؟
      ar: ما أسهل طريقة للتمييز بين اللهجات؟
      en: What's the easiest way to tell dialects apart?
    options:
      - Nama-nama orang.
      - Kata ganti, misalnya sa, beta, dan gue.
      - Angka-angka.
    answer: 1
    words: [kata ganti, membedakan]
    explain:
      ar_eg: 'kata ganti = الضماير: sa في بابوا وbeta في أمبون وgue في جاكرتا. مش الأسامي ولا الأرقام.'
      ar: 'kata ganti = الضمائر: sa في بابوا وbeta في أمبون وgue في جاكرتا، لا الأسماء ولا الأرقام.'
      en: 'Pronouns: sa (Papua), beta (Ambon), gue (Jakarta).'
  - id: e05
    type: build_sentence
    source:
      ar_eg: الضمير sa علامة على ملايو بابوا.
      ar: الضمير sa علامة على ملايو بابوا.
      en: The pronoun sa is a marker of Papuan Malay.
    answer: Kata ganti sa adalah penanda Melayu Papua.
    distractors: [sebaran, membedakan]
    words: [kata ganti, penanda]
    explain:
      ar_eg: Kata ganti sa adalah penanda = الضمير sa علامة لملايو بابوا. sebaran وmembedakan مش في الجملة.
      ar: الضمير sa علامة (penanda) على ملايوية بابوا.
      en: sa is a penanda (marker) of Papuan Malay.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي يتكتب في جزء «sebaran» من التقرير؟
      ar: ماذا يُكتب في جزء «sebaran» من التقرير؟
      en: What goes in the "sebaran" part of the report?
    options:
      - Pendapat Anda tentang dialek itu.
      - Daftar kata.
      - Tempat-tempat dialek itu dipakai.
    answer: 2
    words: [sebaran]
    explain:
      ar_eg: 'sebaran = الانتشار: الأماكن اللي اللهجة بتتقال فيها. الرأي وقايمة الكلمات أجزاء تانية.'
      ar: 'sebaran = الانتشار: أماكن استعمال اللهجة، أمّا الرأي وقائمة الكلمات فأجزاء أخرى.'
      en: sebaran = where the dialect is spoken.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا لسه مش قادر أفرّق بين اللهجتين دول.
      ar: لا أستطيع بعدُ أن أميّز بين هاتين اللهجتين.
      en: I can't tell these two dialects apart yet.
    answers:
      - Saya belum bisa membedakan kedua dialek ini.
      - Saya belum bisa membedakan dua dialek ini.
      - Aku belum bisa membedakan kedua dialek ini.
      - Saya masih belum bisa membedakan kedua dialek ini.
    words: [membedakan]
  - id: e08
    type: speaking
    text: Penanda utama dialek ini adalah kata ganti dan partikelnya.
    meaning:
      ar_eg: العلامة الأساسية للهجة دي هي الضماير والأدوات الصغيرة.
      ar: العلامة الأساسية لهذه اللهجة ضمائرها وأدواتها.
      en: This dialect's main markers are its pronouns and particles.
    words: [penanda, kata ganti]
  - id: e09
    type: dictation
    text: Sebaran dialek Betawi meluas lewat televisi.
    meaning:
      ar_eg: انتشار لهجة بيتاوي اتّسع عن طريق التلفزيون.
      ar: اتّسع انتشار لهجة بيتاوي عبر التلفاز.
      en: The Betawi dialect spread further through television.
    words: [sebaran]
  - id: e10
    type: translate
    direction: from_target
    source_text: Dengan penanda yang jelas, kita mudah membedakan asal pembicara, tetapi kita tetap harus menebak dengan sopan.
    answers_meaning:
      ar_eg:
        - بعلامات واضحة، بنقدر نعرف المتكلم أصله منين بسهولة، بس لازم برضه نخمّن بأدب.
        - لو العلامات واضحة، سهل نفرّق المتكلم جاي منين، لكن لازم نخمّن بذوق.
      ar:
        - بالعلامات الواضحة يسهل أن نميّز أصل المتكلّم، لكن علينا أن نخمّن بأدب.
        - تُسهّل العلامات الواضحة معرفة أصل المتكلّم، غير أنّ التخمين يجب أن يكون مهذّبًا.
      en:
        - With clear markers, we can easily tell where a speaker is from, but we still have to guess politely.
        - Clear markers make it easy to tell a speaker's origin, but we must still guess politely.
    words: [penanda, membedakan]
    explain:
      ar_eg: 'tetapi بتعارض: سهل نعرف، بس الأدب (sopan) لازم.'
      ar: 'tetapi للاستدراك: المعرفة سهلة لكنّ الأدب واجب.'
      en: 'tetapi: easy to tell, but politeness still matters.'
dialogue:
  title: Peta di dinding radio
  lines:
    - speaker: Kaka Yohana
      text: Laporanmu bagus. Tapi tambahin sebarannya, di mana aja dialek itu dipakai.
      ar_eg: تقريرك حلو. بس ضيف الانتشار، اللهجة دي بتتقال في أنهي أماكن.
      ar: تقريرك جيّد، لكن أضف انتشارها، أين تُستعمل تلك اللهجة.
      en: Your report is good. But add the spread, all the places the dialect is used.
    - speaker: Mohamed
      text: Baik. Dari Sorong sampai Jayapura, lalu ke pegunungan.
      ar_eg: ماشي. من سورونج لحد جايابورا، وبعدين للجبال.
      ar: حسنًا. من سورونغ حتّى جايابورا، ثمّ إلى الجبال.
      en: Right. From Sorong to Jayapura, then up into the mountains.
    - speaker: Kaka Yohana
      text: Dan bagaimana pendengar bisa membedakannya dari dialek Ambon?
      ar_eg: والمستمعين يقدروا يفرّقوها إزاي عن لهجة أمبون؟
      ar: وكيف يميّزها المستمعون من لهجة أمبون؟
      en: And how can listeners tell it apart from the Ambon dialect?
    - speaker: Mohamed
      text: Itu aku belum tahu. Aku tanya Om Nus dulu, deh.
      ar_eg: ده لسه مش عارفه. هسأل عمّ نوس الأول.
      ar: لا أعرف ذلك بعد، سأسأل العمّ نوس أوّلًا.
      en: That I don't know yet. I'll ask Om Nus first.
