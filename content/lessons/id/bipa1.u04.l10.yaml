schema: kabar.lesson/v1
id: bipa1.u04.l10
language: id
title: Hari Senin, tanggal satu
can_do:
  ar_eg: تقول تاريخ كامل بالشهور من يوليو لديسمبر.
  ar: أن تذكر تاريخًا كاملًا بالأشهر من يوليو إلى ديسمبر.
  en: Say full dates with the months from July to December.
slides:
  - title: Juli sampai Desember
    body:
      ar_eg: |
        باقي الشهور قريبة من الإنجليزي: Juli، Agustus، September، Oktober، November، Desember.
        والتاريخ الكامل بيمشي كده: hari + اليوم، tanggal + الرقم + الشهر.
        «tujuh belas Agustus» تاريخ مهم: عيد استقلال إندونيسيا.
      ar: |
        بقية الأشهر قريبة من الإنجليزية: Juli، Agustus، September، Oktober، November، Desember.
        والتاريخ الكامل هكذا: hari + اليوم، tanggal + العدد + الشهر.
        و«tujuh belas Agustus» تاريخ مهم: عيد استقلال إندونيسيا.
      en: |
        The other months are close to English: Juli, Agustus, September, Oktober, November, Desember.
        A full date goes: hari + day, tanggal + number + month.
        "tujuh belas Agustus" is a big date: Indonesia's Independence Day.
    grammar: id.time.calendar
    examples:
      - text: Hari Senin, tanggal satu Juli.
        ar_eg: يوم الاتنين، ١ يوليو.
        ar: يوم الاثنين، الأول من يوليو.
        en: Monday, 1 July.
      - text: Tanggal tujuh belas Agustus.
        ar_eg: ١٧ أغسطس.
        ar: السابع عشر من أغسطس.
        en: 17 August.
