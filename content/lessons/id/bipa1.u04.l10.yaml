dialogue:
  title: Kapan ulang tahunmu?
  lines:
    - speaker: Rina
      text: Mohamed, kapan ulang tahunmu?
      ar_eg: يا محمد، عيد ميلادك إمتى؟
      ar: يا محمد، متى عيد ميلادك؟
      en: Mohamed, when is your birthday?
    - speaker: Mohamed
      text: Tanggal dua belas Maret. Dan kamu?
      ar_eg: يوم ١٢ مارس. وإنتي؟
      ar: في ١٢ مارس. وأنتِ؟
      en: On 12 March. And you?
    - speaker: Rina
      text: Tanggal dua puluh lima Oktober. Hari Sabtu ini!
      ar_eg: يوم ٢٥ أكتوبر. السبت ده!
      ar: في ٢٥ أكتوبر، يوم السبت هذا!
      en: On 25 October. This Saturday!
    - speaker: Mohamed
      text: Sabtu ini? Selamat ulang tahun, Rina!
      ar_eg: السبت ده؟ كل سنة وإنتي طيبة يا رينا!
      ar: السبت هذا؟ عيد ميلاد سعيد يا رينا!
      en: This Saturday? Happy birthday, Rina!
    - speaker: Rina
      text: Terima kasih! Hari Jumat kita ke Tanah Abang, ya?
      ar_eg: شكرًا! يوم الجمعة نروح تانا أبانج سوا، ماشي؟
      ar: شكرًا! يوم الجمعة نذهب إلى تانا أبانغ، اتفقنا؟
      en: Thanks! On Friday let's go to Tanah Abang, OK?
    - speaker: Mohamed
      text: Ya! Hari Jumat, jam sepuluh pagi.
      ar_eg: ماشي! يوم الجمعة، الساعة عشرة الصبح.
      ar: حسنًا! يوم الجمعة في العاشرة صباحًا.
      en: Yes! Friday, at ten a.m.
