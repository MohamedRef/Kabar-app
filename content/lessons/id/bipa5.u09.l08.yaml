schema: kabar.lesson/v1
id: bipa5.u09.l08
language: id
title: Pontianak yang majemuk
can_do:
  ar_eg: 'تتكلم عن مدينة متعددة الثقافات: الأخوة واللمة والصحوبية، الإنسانية، الصين والهندوس، اللغة الغالبة، والجواز بين العيلات.'
  ar: 'أن تتحدث عن مدينة متعدّدة الثقافات: الأخوّة والتآلف والصداقة، والإنسانية، والصين والهندوس، واللغة الغالبة، والمصاهرة.'
  en: 'Talk about a plural city: brotherhood, togetherness, friendship, humanity, China and Hindus, the dominant language and in-laws.'
slides:
  - title: Kota di garis khatulistiwa
    body:
      ar_eg: |
        persaudaraan = أخوة، kebersamaan = لمّة، روح الجماعة، pertemanan = صحوبية، صداقة.
        manusiawi = إنساني (perlakuan yang manusiawi = معاملة إنسانية).
        Tiongkok = الصين (البلد)، والإندونيسيين من أصل صيني اسمهم Tionghoa.
        Hindu = هندوسي: كلمات سنسكريتية كتير دخلت الملايو أيام الممالك الهندوسية.
        dominan = غالب، مسيطر، menantu = جوز البنت أو مرات الابن.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: aku = saya، denger = mendengar، nggak = tidak، udah = sudah، kayak = seperti، gitu = begitu، banget = sekali.
      ar: |
        persaudaraan = أخوّة، kebersamaan = تآلف، روح الجماعة، pertemanan = صداقة.
        manusiawi = إنساني (perlakuan yang manusiawi = معاملة إنسانية).
        Tiongkok = الصين (البلد)، والإندونيسيون من أصل صيني يسمّون Tionghoa.
        Hindu = هندوسي: دخلت كلمات سنسكريتية كثيرة الملايوية في عهد الممالك الهندوسية.
        dominan = غالب، مهيمن، menantu = الصهر أو الكنّة.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: aku = saya، denger = mendengar، nggak = tidak، udah = sudah، kayak = seperti، gitu = begitu، banget = sekali.
      en: |
        persaudaraan = brotherhood, kinship, kebersamaan = togetherness, pertemanan = friendship.
        manusiawi = humane (perlakuan yang manusiawi = humane treatment).
        Tiongkok = China (the country); Indonesians of Chinese descent are Tionghoa.
        Hindu = Hindu: many Sanskrit words entered Malay in the Hindu kingdoms' era.
        dominan = dominant, menantu = son- or daughter-in-law.
        The dialogue uses street forms; the formal ones are beside them: aku = saya, denger = mendengar, nggak = tidak, udah = sudah, kayak = seperti, gitu = begitu, banget = sekali.
    examples:
      - text: Di Pontianak, bahasa Melayu dominan, tapi bahasa Tiochiu juga sering terdengar.
        ar_eg: في بونتياناك الملايو هي الغالبة، بس التيوتشيو بتتسمع كتير كمان.
        ar: في بونتياناك تغلب الملايوية، لكن التيوتشيو تُسمع كثيرًا أيضًا.
        en: In Pontianak Malay dominates, but Teochew is often heard too.
      - text: Kata "bahasa" berasal dari bahasa Sanskerta, zaman kerajaan Hindu.
        ar_eg: كلمة bahasa أصلها سنسكريتي، من أيام الممالك الهندوسية.
        ar: كلمة bahasa سنسكريتية الأصل من عهد الممالك الهندوسية.
        en: The word "bahasa" comes from Sanskrit, from the Hindu kingdoms' era.
      - text: Menantu Pak Liong orang Dayak; keluarganya merayakan kebersamaan.
        ar_eg: جوز بنت أستاذ ليونج داياك؛ والعيلة بتحتفل باللمّة.
        ar: صهر السيد ليونغ من الداياك؛ وتحتفي العائلة بالتآلف.
        en: Pak Liong's son-in-law is Dayak; the family celebrates togetherness.
