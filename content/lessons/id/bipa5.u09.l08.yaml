  - id: e03
    type: listen
    text: Pertemanan kami sudah dua puluh tahun.
    question:
      ar_eg: الصحوبية بقالها قد إيه؟
      ar: منذ متى الصداقة؟
      en: How long has the friendship lasted?
    options: [عشرين سنة, سنتين, عشر شهور]
    answer: 0
    meaning:
      ar_eg: صحوبيتنا بقالها عشرين سنة.
      ar: صداقتنا مستمرة منذ عشرين عامًا.
      en: Our friendship goes back twenty years.
    words: [pertemanan]
  - id: e04
    type: fill_blank
    sentence: Pengungsi harus diperlakukan secara ___.
    meaning:
      ar_eg: اللاجئين لازم يتعاملوا معاملة ___.
      ar: يجب معاملة اللاجئين معاملة ___.
      en: Refugees must be treated ___ly.
    options: [manusiawi, dominan, persaudaraan]
    answers: [manusiawi]
    words: [manusiawi, dominan, persaudaraan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: جوز بنتك تقوله إيه بالإندونيسي؟
      ar: كيف تسمّي زوج ابنتك بالإندونيسية؟
      en: What do you call your daughter's husband in Indonesian?
    options: [kebersamaan, Tiongkok, menantu]
    answer: 2
    explain:
      ar_eg: menantu = جوز البنت أو مرات الابن.
      ar: menantu = الصهر أو الكنّة.
      en: menantu = son- or daughter-in-law.
    words: [kebersamaan, tiongkok, menantu]
  - id: e06
    type: fill_blank
    sentence: Banyak kata Sanskerta masuk ke bahasa Melayu pada zaman kerajaan ___.
    meaning:
      ar_eg: كلمات سنسكريتية كتير دخلت الملايو أيام الممالك ال___.
      ar: دخلت كلمات سنسكريتية كثيرة الملايوية في عهد الممالك ال___.
      en: Many Sanskrit words entered Malay in the era of the ___ kingdoms.
    options: [Hindu, Tiongkok, manusiawi]
    answers: [Hindu]
    words: [hindu, tiongkok, manusiawi]
  - id: e07
    type: multiple_choice
    question: Lebaran dan Imlek di Pontianak adalah waktu ___ semua warga.
    options: [dominan, kebersamaan, pertemanan]
    answer: 1
    explain:
      ar_eg: kebersamaan = لمّة، روح الجماعة.
      ar: kebersamaan = تآلف، روح الجماعة.
      en: kebersamaan = togetherness.
    words: [dominan, kebersamaan, pertemanan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الأخوة أهم من الفرق بينّا.
      ar: الأخوّة أهمّ من اختلافاتنا.
      en: Brotherhood matters more than our differences.
    answer: Persaudaraan lebih penting daripada perbedaan kita.
    distractors: [menantu, Hindu]
    words: [persaudaraan, menantu, hindu]
  - id: e09
    type: translate
    direction: from_target
    source_text: Di kota ini, bahasa Melayu paling dominan.
    answers_meaning:
      ar_eg: [في المدينة دي، الملايو هي الأكتر انتشارًا, الملايو هي الغالبة في المدينة دي]
      ar: [الملايوية هي الأكثر هيمنة في هذه المدينة, تغلب الملايوية في هذه المدينة]
      en: [In this city Malay is the most dominant, Malay dominates in this city]
    words: [dominan]
  - id: e10
    type: speaking
    text: Leluhur keluarga Pak Liong datang dari Tiongkok selatan.
    meaning:
      ar_eg: أجداد عيلة أستاذ ليونج جم من جنوب الصين.
      ar: جاء أسلاف عائلة السيد ليونغ من جنوب الصين.
      en: Pak Liong's family's ancestors came from southern China.
    words: [tiongkok]
dialogue:
  lines:
    - speaker: Mas Rizal
      text: Selamat datang di Pontianak, kota di garis khatulistiwa.
      ar_eg: أهلًا بيك في بونتياناك، المدينة اللي على خط الاستوا.
      ar: أهلًا بك في بونتياناك، مدينة خط الاستواء.
      en: Welcome to Pontianak, the city on the equator.
    - speaker: Mohamed
      text: Tadi di pasar aku denger banyak bahasa.
      ar_eg: سمعت لغات كتير في السوق من شوية.
      ar: سمعت لغات كثيرة في السوق قبل قليل.
      en: I heard lots of languages at the market just now.
    - speaker: Mas Rizal
      text: Iya. Melayu dominan, tapi ada juga bahasa Dayak sama bahasa Tionghoa yang leluhurnya dari Tiongkok selatan.
      ar_eg: أيوه. الملايو هي الغالبة، بس فيه كمان لغات الداياك ولغات الصينيين اللي أجدادهم من جنوب الصين.
      ar: نعم. تغلب الملايوية، لكن هناك أيضًا لغات الداياك ولغات التيونغهوا الذين جاء أسلافهم من جنوب الصين.
      en: Yes. Malay dominates, but there are Dayak languages and the languages of Chinese Indonesians whose ancestors came from southern China.
    - speaker: Mohamed
      text: Mereka hidup damai nggak?
      ar_eg: عايشين مع بعض في سلام؟
      ar: هل يعيشون في سلام؟
      en: Do they live in peace?
    - speaker: Mas Rizal
      text: Sebagian besar, iya. Pertemanan sama pernikahan campur udah biasa. Menantu tetanggaku orang Dayak.
      ar_eg: غالبًا أيوه. الصحوبية والجواز المختلط عادي. جوز بنت جارنا داياك.
      ar: غالبًا نعم. الصداقة والزواج المختلط أمر عادي، وصهر جاري من الداياك.
      en: Mostly, yes. Friendship and mixed marriage are normal. My neighbour's son-in-law is Dayak.
    - speaker: Mohamed
      text: Persaudaraan kayak gitu manusiawi banget.
      ar_eg: الأخوة دي حاجة إنسانية جدًا.
      ar: أخوّة كهذه إنسانية للغاية.
      en: That kind of brotherhood is deeply humane.
