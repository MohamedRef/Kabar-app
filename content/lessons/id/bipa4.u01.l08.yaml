schema: kabar.lesson/v1
id: bipa4.u01.l08
language: id
title: Karir keluarga Andi
can_do:
  ar_eg: 'تحكي عن شغل أفراد العيلة: مين اترقّى ومين اترفد ومين ساب شغله.'
  ar: 'أن تحكي عن مهن أفراد العائلة: من رُقّي ومن فُصل ومن ترك عمله.'
  en: 'Tell how family members'' careers went: who was promoted, fired or changed jobs.'
slides:
  - title: Dari buruh sampai dosen
    body:
      ar_eg: |
        buruh = عامل (في مصنع أو ميناء)، dosen = دكتور في الجامعة، mengundurkan diri = يستقيل، يسيب الشغل بمزاجه.
        pembantu = الشغالة أو المساعد في البيت، pengurus = عضو مجلس إدارة (جمعية، نادي، مسجد).
        karir = المسيرة المهنية، penilaian = تقييم، dipecat = اترفد.
      ar: |
        buruh = عامل (في مصنع أو ميناء)، dosen = أستاذ جامعي، mengundurkan diri = يستقيل.
        pembantu = مساعد في المنزل، pengurus = عضو الهيئة الإدارية (جمعية، نادٍ، مسجد).
        karir = المسيرة المهنية، penilaian = تقييم، dipecat = فُصل من العمل.
      en: |
        buruh = labourer (in a factory or port), dosen = university lecturer, mengundurkan diri = to resign.
        pembantu = household helper, assistant; pengurus = committee or board member (association, club, mosque).
        karir = career, penilaian = assessment, dipecat = to be fired.
    examples:
      - text: Kakek saya dulu buruh pelabuhan.
        ar_eg: جدي كان عامل في الميناء زمان.
        ar: كان جدّي عاملًا في الميناء.
        en: My grandfather used to be a port labourer.
      - text: Dia dipecat, lalu memulai karir baru.
        ar_eg: اترفد، وبعدين بدأ مسيرة جديدة.
        ar: فُصل من عمله، ثم بدأ مسيرة مهنية جديدة.
        en: He was fired, then started a new career.
      - text: Paman saya pemadam kebakaran di Makassar.
        ar_eg: خالي مطافي في ماكاسار.
        ar: خالي رجل إطفاء في ماكاسار.
        en: My uncle is a firefighter in Makassar.
