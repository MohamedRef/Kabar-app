  - id: e03
    type: listen
    text: Bu Lina mengundurkan diri karena mau pindah ke Jakarta.
    question:
      ar_eg: بو لينا عملت إيه؟
      ar: ماذا فعلت السيدة لينا؟
      en: What did Bu Lina do?
    options: [استقالت, اترفدت, اترقّت]
    answer: 0
    meaning:
      ar_eg: بو لينا استقالت عشان عايزة تنقل جاكرتا.
      ar: استقالت السيدة لينا لأنها تريد الانتقال إلى جاكرتا.
      en: Bu Lina resigned because she wants to move to Jakarta.
    words: [mengundurkan diri]
  - id: e04
    type: fill_blank
    sentence: Para ___ di pelabuhan bekerja dari pagi sampai malam.
    meaning:
      ar_eg: ___ في الميناء بيشتغلوا من الصبح لبالليل.
      ar: يعمل ___ في الميناء من الصباح حتى الليل.
      en: The ___ at the port work from morning till night.
    options: [buruh, dosen, pengurus]
    answers: [buruh]
    words: [buruh, dosen, pengurus]
  - id: e05
    type: multiple_choice
    question: Kenapa dia ___? Karena dia mencuri uang kantor.
    question_meaning:
      ar_eg: ليه ___؟ عشان سرق فلوس المكتب.
      ar: لماذا ___؟ لأنه سرق مال المكتب.
      en: Why was he ___? Because he stole office money.
    options: [karir, dipecat, pembantu]
    answer: 1
    explain:
      ar_eg: dipecat = اترفد من الشغل.
      ar: dipecat = فُصل من العمل.
      en: dipecat = fired.
    words: [karir, dipecat, pembantu]
  - id: e06
    type: fill_blank
    sentence: Para ___ masjid rapat setiap bulan.
    meaning:
      ar_eg: ___ المسجد بيعملوا اجتماع كل شهر.
      ar: يعقد ___ المسجد اجتماعًا كل شهر.
      en: The mosque's ___ hold a meeting every month.
    options: [pengurus, mengundurkan diri, penilaian]
    answers: [pengurus]
    words: [pengurus, mengundurkan diri, penilaian]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيدرّس في الجامعة؟
      ar: من يدرّس في الجامعة؟
      en: Who teaches at a university?
    options: [buruh, pembantu, dosen]
    answer: 2
    explain:
      ar_eg: dosen = دكتور جامعة.
      ar: dosen = أستاذ جامعي.
      en: dosen = university lecturer.
    words: [buruh, pembantu, dosen]
  - id: e08
    type: build_sentence
    source:
      ar_eg: تقييم الأداء بيحصل كل ست شهور.
      ar: يُجرى تقييم الأداء كل ستة أشهر.
      en: The performance review happens every six months.
    answer: Penilaian kinerja dilakukan setiap enam bulan.
    distractors: [karir, dipecat]
    words: [penilaian, karir, dipecat]
  - id: e09
    type: translate
    direction: from_target
    source_text: Ibu saya dulu pembantu, sekarang dosen.
    answers_meaning:
      ar_eg: [أمي كانت شغالة زمان، ودلوقتي دكتورة في الجامعة, أمي كانت بتشتغل في البيوت، ودلوقتي بتدرّس في الجامعة]
      ar: [كانت أمي مساعدة منزلية، والآن هي أستاذة جامعية, عملت أمي في المنازل سابقًا، وهي الآن أستاذة في الجامعة]
      en: ['My mother used to be a household helper; now she''s a lecturer', My mum was a domestic helper and is now a university lecturer]
    words: [pembantu, dosen]
  - id: e10
    type: speaking
    text: Karir paman saya dimulai dari buruh.
    meaning:
      ar_eg: مسيرة خالي بدأت وهو عامل.
      ar: بدأت مسيرة خالي المهنية عاملًا.
      en: My uncle's career started as a labourer.
    words: [karir, buruh, penilaian, mengundurkan diri]
dialogue:
  lines:
    - speaker: Andi
      text: Keluarga saya lucu, Mohamed. Kakek saya dulu buruh, sekarang ayah saya dosen.
      ar_eg: عيلتي غريبة يا محمد. جدي كان عامل، ودلوقتي أبويا دكتور في الجامعة.
      ar: عائلتي طريفة يا محمد. كان جدّي عاملًا، والآن أبي أستاذ جامعي.
      en: My family's funny, Mohamed. My grandpa was a labourer, now my dad's a lecturer.
    - speaker: Mohamed
      text: Hebat! Kalau pamanmu?
      ar_eg: جامد! وخالك؟
      ar: رائع! وخالك؟
      en: Great! And your uncle?
    - speaker: Andi
      text: Dia dipecat dari bank, lalu jadi pemadam kebakaran. Karirnya sekarang bagus.
      ar_eg: اترفد من البنك، وبعدين بقى مطافي. ومسيرته دلوقتي كويسة.
      ar: فُصل من البنك ثم أصبح رجل إطفاء. ومسيرته الآن جيدة.
      en: He got fired from the bank, then became a firefighter. His career's going well now.
    - speaker: Mohamed
      text: Dan ibumu masih pengurus masjid?
      ar_eg: وأمك لسه في مجلس إدارة المسجد؟
      ar: وهل ما زالت أمك عضوًا في إدارة المسجد؟
      en: And is your mum still on the mosque committee?
    - speaker: Andi
      text: Masih. Penilaian orang-orang tentang dia selalu baik.
      ar_eg: لسه. وكلام الناس عنها دايمًا حلو.
      ar: نعم. وتقييم الناس لها دائمًا جيد.
      en: Yes. People always speak well of her.
