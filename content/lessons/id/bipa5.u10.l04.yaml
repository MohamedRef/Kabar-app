    ar_eg: شريحة عرض / عرض على الشاشة
    ar: شريحة، عرض مرئي
    en: slide, screening
  - word: poin penting
    pos: noun
    ar_eg: نقطة مهمة
    ar: نقطة مهمّة
    en: key point
  - word: mencolok
    pos: adjective
    ar_eg: لافت / صارخ
    ar: لافت، فاقع
    en: striking, glaring
  - word: menarik perhatian
    pos: phrase
