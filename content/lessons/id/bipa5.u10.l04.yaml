schema: kabar.lesson/v1
id: bipa5.u10.l04
language: id
title: Alat bantu presentasi
can_do:
  ar_eg: تجهّز شرايح عرض واضحة وتتكلم عنها بالإندونيسي.
  ar: أن تُعدّ شرائح عرض واضحة وتتحدّث عنها بالإندونيسية.
  en: Prepare clear slides and talk about them in Indonesian.
slides:
  - title: Tayangan yang jelas
    body:
      ar_eg: |
        قبل أي عرض، جهّز الوسائل المساعدة:
        - alat bantu = وسيلة مساعدة: صور، رسوم بيانية، فيديو
        - tayangan = شريحة / اللي بيظهر على الشاشة (من tayang = يتعرض)
        - poin penting = النقط المهمة: ٣ لـ ٥ في الشريحة كفاية
        - mencolok = لافت / صارخ. اللون الصارخ ممكن يشد العين، وممكن يتعب الجمهور.
        - menarik perhatian = يشد الانتباه
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: bosen = bosan، aku = saya، aja = saja، terus = lalu، pake = pakai.
      ar: |
        قبل أيّ عرض، أعِدّ الوسائل المساعدة:
        - alat bantu = وسيلة مساعدة: صور ورسوم بيانية وفيديو
        - tayangan = الشريحة، ما يُعرض على الشاشة (من tayang = يُعرض)
        - poin penting = النقاط المهمّة: من ثلاث إلى خمس في الشريحة تكفي
        - mencolok = لافت، فاقع؛ قد يجذب اللون الفاقع العين وقد يُتعب الجمهور.
        - menarik perhatian = يجذب الانتباه
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: bosen = bosan، aku = saya، aja = saja، terus = lalu، pake = pakai.
      en: |
        Before any talk, prepare your visual aids:
        - alat bantu = aid: photos, charts, video
        - tayangan = slide, what's shown on screen (from tayang = to be shown)
        - poin penting = key points: three to five per slide is plenty
        - mencolok = striking, glaring; a loud colour can catch the eye or tire the audience
        - menarik perhatian = to catch attention
        The dialogue uses street forms; the formal ones are beside them: bosen = bosan, aku = saya, aja = saja, terus = lalu, pake = pakai.
    examples:
      - text: Foto Cap Go Meh di tayangan pertama langsung menarik perhatian hadirin.
        ar_eg: صورة كاب جو مي في أول شريحة شدّت انتباه الحاضرين على طول.
        ar: جذبت صورة كاب غو مي في الشريحة الأولى انتباه الحاضرين فورًا.
        en: The Cap Go Meh photo on the first slide caught the audience's attention at once.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: alat bantu
        ar_eg: وسيلة مساعدة
        ar: وسيلة مساعدة
        en: (visual) aid
      - text: tayangan
        ar_eg: شريحة عرض
        ar: شريحة عرض
        en: slide, display
      - text: poin penting
        ar_eg: نقطة مهمة
        ar: نقطة مهمّة
        en: key point
      - text: mencolok
        ar_eg: لافت / صارخ
        ar: لافت، فاقع
        en: striking, glaring
      - text: menarik perhatian
        ar_eg: يشد الانتباه
        ar: يجذب الانتباه
        en: to catch attention
    words: [alat bantu, tayangan, poin penting, mencolok, menarik perhatian]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «Tulis poin penting saja di tayangan.» معناها إيه؟
      ar: ما معنى «Tulis poin penting saja di tayangan.»؟
      en: What does "Tulis poin penting saja di tayangan." mean?
    options:
      - اكتب كل حاجة على الشريحة.
      - اكتب النقط المهمة بس على الشريحة.
      - ماتكتبش أي حاجة على الشريحة.
    answer: 1
    words: [poin penting, tayangan]
    explain:
      ar_eg: poin penting saja = النقط المهمة بس. مش كل حاجة، ومش ولا حاجة.
      ar: poin penting saja = النقاط المهمّة فقط، لا كلّ شيء ولا لا شيء.
      en: Only the key points, not everything and not nothing.
  - id: e03
    type: listen
    text: Warna merah ini terlalu mencolok, jadi saya memakai warna biru.
    question:
      ar_eg: ليه غيّر اللون؟
      ar: لماذا غيّر اللون؟
      en: Why did he change the colour?
    options:
      - عشان الأزرق أرخص.
      - عشان المدير بيحب الأحمر.
      - عشان الأحمر صارخ زيادة.
    answer: 2
    words: [mencolok]
  - id: e04
    type: fill_blank
    sentence: Mulailah dengan foto Cap Go Meh untuk ___ hadirin.
    meaning:
      ar_eg: ابدأ بصورة كاب جو مي عشان تشد انتباه الحاضرين.
      ar: ابدأ بصورة كاب غو مي لتجذب انتباه الحاضرين.
      en: Start with a Cap Go Meh photo to catch the audience's attention.
    options: [menarik perhatian, poin penting, alat bantu]
    answers: [menarik perhatian]
    words: [menarik perhatian, hadirin]
    explain:
      ar_eg: «تشد الانتباه» = menarik perhatian. poin penting = نقط مهمة وalat bantu = وسائل مساعدة، مش فعل.
      ar: «تجذب الانتباه» = menarik perhatian. أما poin penting فالنقاط المهمّة، وalat bantu الوسائل المساعدة.
      en: "\"Catch attention\" is menarik perhatian. poin penting and alat bantu aren't actions."
  - id: e05
    type: build_sentence
    source:
      ar_eg: الوسائل المساعدة بتخلي العرض أوضح.
      ar: تجعل الوسائل المساعدة العرض أوضح.
      en: Visual aids make a presentation clearer.
    answer: Alat bantu membuat presentasi lebih jelas.
    distractors: [mencolok, tayangan]
    words: [alat bantu, presentasi]
    explain:
      ar_eg: «الوسائل المساعدة» = Alat bantu. mencolok = لافت وtayangan = شريحة، مش الفاعل هنا.
      ar: «الوسائل المساعدة» = Alat bantu. أما mencolok فـ«لافت»، وtayangan الشريحة.
      en: "\"Visual aids\" is alat bantu. mencolok (striking) and tayangan (slide) aren't the subject."
  - id: e06
    type: translate
    direction: from_target
    source_text: Jangan menulis terlalu banyak teks di satu tayangan.
    answers_meaning:
      ar_eg:
        - ماتكتبش كلام كتير أوي في شريحة واحدة.
        - بلاش تحشر نص كتير في نفس الشريحة.
      ar:
        - لا تكتب نصًّا كثيرًا في شريحة واحدة.
        - تجنّب كتابة نصوص كثيرة في الشريحة الواحدة.
      en:
        - Don't write too much text on one slide.
        - Avoid cramming a lot of text onto a single slide.
    words: [tayangan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة alat bantu؟
      ar: أيّها alat bantu؟
      en: Which one is an alat bantu?
    options:
      - Grafik dan foto.
      - Jam tangan pembicara.
      - Kursi hadirin.
    answer: 0
    words: [alat bantu, grafik]
    explain:
      ar_eg: alat bantu = رسوم وصور بتساعد العرض. ساعة المتكلم وكراسي الحاضرين مش وسائل عرض.
      ar: alat bantu رسوم وصور تعين العرض، لا ساعة المتحدّث ولا مقاعد الحاضرين.
      en: Visual aids are charts and photos, not the speaker's watch or the chairs.
  - id: e08
    type: speaking
    text: Ada tiga poin penting yang ingin saya sampaikan hari ini.
    meaning:
      ar_eg: فيه تلات نقط مهمة عايز أقولها النهارده.
      ar: ثمّة ثلاث نقاط مهمّة أودّ عرضها اليوم.
      en: There are three key points I want to make today.
    words: [poin penting]
  - id: e09
    type: dictation
    text: Grafik yang sederhana lebih menarik perhatian daripada tabel panjang.
    meaning:
      ar_eg: الرسم البياني البسيط بيشد الانتباه أكتر من الجدول الطويل.
      ar: الرسم البياني البسيط أجذب للانتباه من الجدول الطويل.
      en: A simple chart catches attention better than a long table.
    words: [menarik perhatian, grafik]
  - id: e10
    type: fill_blank
    sentence: Judul di tayangan harus besar dan ___ supaya mudah dibaca.
    meaning:
      ar_eg: العنوان في الشريحة لازم يبقى كبير ولافت عشان يتقري بسهولة.
      ar: يجب أن يكون العنوان في الشريحة كبيرًا لافتًا ليُقرأ بسهولة.
      en: The slide title should be big and striking so it's easy to read.
    options: [mencolok, poin penting, alat bantu]
    answers: [mencolok]
    words: [mencolok, tayangan]
    explain:
      ar_eg: العنوان «كبير ولافت» = mencolok. poin penting وalat bantu أسماء مش صفة للعنوان.
      ar: العنوان «كبير لافت» = mencolok. أما poin penting وalat bantu فاسمان لا صفة.
      en: A big, striking title is mencolok. poin penting and alat bantu are nouns.
dialogue:
  title: Menyiapkan tayangan
  lines:
    - speaker: Rina
      text: Mohamed, tayanganmu kok penuh teks? Hadirin bisa bosen, lho.
      ar_eg: يا محمد، الشرايح بتاعتك مليانة كلام. الحاضرين هيزهقوا.
      ar: يا محمد، شرائحك مليئة بالنصوص، وسيملّ الحاضرون.
      en: Mohamed, your slides are full of text. The audience will get bored.
    - speaker: Mohamed
      text: Jadi aku tulis poin penting aja? Terus alat bantunya apa?
      ar_eg: يعني أكتب النقط المهمة بس؟ وبعدين أستخدم وسايل مساعدة إيه؟
      ar: أأكتب النقاط المهمّة فقط إذن؟ وما الوسائل المساعدة؟
      en: So I write only the key points? Then what aids do I use?
    - speaker: Rina
      text: Pake foto Cap Go Meh di Singkawang aja. Itu pasti menarik perhatian.
      ar_eg: استخدم صور كاب جو مي في سينجكاوانج. دي أكيد هتشد الانتباه.
      ar: استعمل صور كاب غو مي في سينغكاوانغ، فهي ستجذب الانتباه حتمًا.
      en: Use photos of Cap Go Meh in Singkawang. That will definitely catch attention.
    - speaker: Mohamed
      text: Ide bagus. Tapi warna latarnya jangan terlalu mencolok, ya.
      ar_eg: فكرة حلوة. بس لون الخلفية مايبقاش صارخ أوي.
      ar: فكرة جيّدة، لكن لا ينبغي أن يكون لون الخلفية فاقعًا جدًا.
      en: Good idea. But the background colour shouldn't be too loud.
new_words:
  - word: alat bantu
    pos: noun
