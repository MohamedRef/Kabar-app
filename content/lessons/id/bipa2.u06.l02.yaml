  - id: e13
    type: dictation
    text: Mohon tunggu sebentar.
    meaning:
      ar_eg: برجاء الانتظار شوية.
      ar: يُرجى الانتظار قليلًا.
      en: Please wait a moment.
    words: [mohon, tunggu, sebentar]
  - id: e14
    type: speaking
    text: Tolong tutup pintunya, ya.
    meaning:
      ar_eg: لو سمحت اقفل الباب.
      ar: أغلق الباب من فضلك.
      en: Please close the door.
    words: [tolong, tutup]
dialogue:
  title: Tamu di Sanur
  lines:
    - speaker: Mohamed
      text: Permisi, Bu Sari.
      ar_eg: عن إذنك يا مدام ساري.
      ar: عن إذنكِ يا سيدة ساري.
      en: Excuse me, Bu Sari.
    - speaker: Bu Sari
      text: Oh, Pak Mohamed! Silakan masuk. Silakan duduk.
      ar_eg: أوه، أستاذ محمد! اتفضل ادخل. اتفضل اقعد.
      ar: أهلًا يا سيد محمد! تفضّل بالدخول، تفضّل بالجلوس.
      en: Oh, Mr Mohamed! Please come in. Please sit down.
    - speaker: Mohamed
      text: Terima kasih, Bu. Boleh minta air putih? Hari ini panas sekali.
      ar_eg: شكرًا يا مدام. ممكن شوية مية؟ النهارده حر قوي.
      ar: شكرًا يا سيدتي. هل لي بقليل من الماء؟ الجو حارّ جدًّا اليوم.
      en: Thank you, ma'am. Could I have some water? It's very hot today.
    - speaker: Bu Sari
      text: Boleh. Ini airnya. Silakan minum.
      ar_eg: طبعًا. اتفضل المية. اتفضل اشرب.
      ar: بالطبع، هذا هو الماء. تفضّل اشرب.
      en: Sure. Here's the water. Please, have a drink.
    - speaker: Mohamed
      text: Bu, tolong bantu saya. Saya mencari kos di Sanur.
      ar_eg: يا مدام، لو سمحتي ساعديني. أنا بدوّر على سكن في سانور.
      ar: يا سيدتي، ساعديني من فضلك، فأنا أبحث عن سكن في سانور.
      en: Ma'am, please help me. I'm looking for a room to rent in Sanur.
    - speaker: Bu Sari
      text: Tentu, Pak. Mohon tunggu sebentar, ya.
      ar_eg: أكيد يا أستاذ. استنى شوية لو سمحت.
      ar: بالتأكيد يا سيدي. انتظر قليلًا من فضلك.
      en: Of course, sir. Please wait a moment.
