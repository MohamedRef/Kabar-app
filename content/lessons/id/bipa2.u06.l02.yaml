    ar_eg: لو سمحت (اعملّي)؛ لوحدها = إلحقوني!
    ar: من فضلك (افعل لي)؛ وحدها = النجدة!
    en: please (asking a favour); alone = Help!
  - word: silakan
    pos: particle
    ar_eg: اتفضل
    ar: تفضّل
    en: please (go ahead)
  - word: minta
    pos: verb
    ar_eg: يطلب حاجة
    ar: يطلب شيئًا
    en: to ask for
  - word: mohon
    pos: verb
    ar_eg: برجاء (رسمي)
    ar: يُرجى (رسمي)
    en: kindly, request (formal)
  - word: bantu
    pos: verb
    ar_eg: ساعد (membantu = يساعد)
    ar: ساعِد (membantu = يساعد)
    en: help (membantu = to help)
  - word: tutup
    pos: verb
    ar_eg: اقفل / مقفول
    ar: أغلِق / مغلق
    en: close; closed
  - word: tunggu
    pos: verb
    ar_eg: استنى (menunggu = يستنى)
    ar: انتظِر (menunggu = ينتظر)
    en: wait (menunggu = to wait)
  - word: sebentar
    pos: adverb
    ar_eg: شوية، لحظة
    ar: قليلًا، لحظة
    en: a moment
  - word: air putih
    pos: noun
    ar_eg: مية (للشرب)
    ar: ماء الشرب
    en: drinking water
  - word: tentu
    pos: adverb
    ar_eg: أكيد، طبعًا
    ar: بالتأكيد
    en: of course
