  - id: e12
    type: translate
    direction: from_target
    source_text: Silakan makan, Pak Mohamed.
    answers_meaning:
      ar_eg: ["اتفضل كُل يا أستاذ محمد.", "اتفضل يا أستاذ محمد، كُل", "بالهنا والشفا يا أستاذ محمد"]
      ar: ["تفضّل بالأكل يا سيد محمد.", "تفضّل كُل يا سيد محمد"]
      en: ["Please eat, Mr Mohamed.", "Please help yourself, Mr Mohamed", "Go ahead and eat, Mr Mohamed"]
