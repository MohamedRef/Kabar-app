schema: kabar.lesson/v1
id: bipa2.u06.l02
language: id
title: Tolong dan silakan
can_do:
  ar_eg: تطلب حاجة بأدب وتعزم على حد.
  ar: أن تطلب بأدب وتعرض على غيرك.
  en: Make polite requests and offers.
slides:
  - title: Tolong ≠ silakan
    body:
      ar_eg: |
        الاتنين بيتترجموا «please»، بس معناهم عكس بعض:
        - tolong + فعل = لو سمحت اعملّي الحاجة دي (إنت بتطلب خدمة): Tolong tutup pintunya = لو سمحت اقفل الباب.
        - silakan + فعل = اتفضل اعمل (إنت بتعزم أو بتسمح): Silakan masuk = اتفضل ادخل.
        silakan هي «اتفضل» بتاعتنا بالظبط.
        في الشارع بيقولوا:
        - banget = sekali (أوي)، وبتيجي بعد الصفة زيها
      ar: |
        كلتاهما تُترجم «please» لكن معناهما متعاكس:
        - tolong + فعل = افعل لي هذا من فضلك (طلب خدمة): Tolong tutup pintunya = أغلق الباب من فضلك.
        - silakan + فعل = تفضّل افعل (دعوة أو إذن): Silakan masuk = تفضّل بالدخول.
        فـ silakan تقابل «تفضّل» تمامًا.
        في كلام الشارع:
        - banget = sekali (جدًّا)، وتأتي بعد الصفة مثلها
      en: |
        Both translate as "please", but they point in opposite directions:
        - tolong + verb = please do this for me (asking a favour): Tolong tutup pintunya = Please close the door.
        - silakan + verb = please go ahead (offering / permitting): Silakan masuk = Please come in.
        silakan is exactly Arabic «اتفضل».
        On the street:
        - banget = sekali (very), after the adjective just like sekali
    grammar: id.request.tolong-silakan
    examples:
      - text: Tolong bantu saya, Pak.
        ar_eg: لو سمحت ساعدني يا أستاذ.
        ar: ساعدني من فضلك يا سيدي.
        en: Please help me, sir.
      - text: Silakan duduk, Bu.
        ar_eg: اتفضلي اقعدي يا مدام.
        ar: تفضّلي بالجلوس يا سيدتي.
        en: Please have a seat, ma'am.
  - title: Minta…, boleh minta…?
    body:
      ar_eg: |
        لما تطلب حاجة (مش خدمة):
        - minta + الحاجة = عايز … لو سمحت: Minta air putih, Mbak = مية لو سمحتي.
        - Boleh minta …? = ممكن آخد …؟ (أأدب شوية): Boleh minta nomor teleponnya? = ممكن رقم تليفونك؟
        وفي المحلات «Saya mau …» طبيعية جدًّا برضه.
      ar: |
        لطلب شيء (لا خدمة):
        - minta + الشيء = أريد … من فضلك: Minta air putih, Mbak = ماءً من فضلكِ.
        - Boleh minta …? = هل لي بـ…؟ (أكثر تهذيبًا): Boleh minta nomor teleponnya?
        وفي المتاجر تصلح «Saya mau …» أيضًا.
      en: |
        To ask for a thing (not a favour):
        - minta + thing = … please: Minta air putih, Mbak = Some water, please.
        - Boleh minta …? = Could I have …? (a bit more polite): Boleh minta nomor teleponnya?
        In shops "Saya mau …" is perfectly natural too.
    grammar: id.request.tolong-silakan
    examples:
      - text: Mbak, minta segelas teh manis.
        ar_eg: كوباية شاي بسكر لو سمحتي.
        ar: كوب شاي حلو من فضلكِ.
        en: A glass of sweet tea, please.
      - text: Boleh minta air putih, Bu?
        ar_eg: ممكن شوية مية يا مدام؟
        ar: هل لي بقليل من الماء يا سيدتي؟
        en: Could I have some water, ma'am?
  - title: Mohon tunggu sebentar
    body:
      ar_eg: |
        - mohon = برجاء، رسمية، هتشوفها في المكاتب واليافطات والإعلانات: Mohon tunggu sebentar = برجاء الانتظار شوية.
        - Tolong! لوحدها = إلحقوني!
        وخلّي بالك من الغلطة المشهورة: لما تعزم ضيف يدخل ماتقولش «Tolong masuk» ✗، قول «Silakan masuk» ✓.
      ar: |
        - mohon = يُرجى، رسمية، تراها في المكاتب واللافتات: Mohon tunggu sebentar = يُرجى الانتظار قليلًا.
        - وTolong! وحدها = النجدة!
        وانتبه للخطأ الشائع: لدعوة الضيف إلى الدخول لا تقل «Tolong masuk» ✗ بل «Silakan masuk» ✓.
      en: |
        - mohon = kindly, formal; you'll see it in offices, on signs and in announcements: Mohon tunggu sebentar = Please wait a moment.
        - Tolong! on its own = Help!
        Classic mistake: to invite a guest in, don't say "Tolong masuk" ✗, say "Silakan masuk" ✓.
    grammar: id.request.tolong-silakan
    examples:
      - text: Mohon tunggu sebentar.
        ar_eg: برجاء الانتظار شوية.
        ar: يُرجى الانتظار قليلًا.
        en: Please wait a moment.
      - text: Mohon isi formulir ini.
        ar_eg: برجاء ملء الاستمارة دي.
        ar: يُرجى تعبئة هذه الاستمارة.
        en: Please fill in this form.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tolong
        ar_eg: لو سمحت (اعملّي)
        ar: من فضلك
        en: please (a favour)
      - text: bantu
        ar_eg: ساعد
        ar: ساعِد
        en: help
      - text: tunggu
        ar_eg: استنى
        ar: انتظِر
        en: wait
      - text: sebentar
        ar_eg: لحظة
        ar: لحظة
        en: a moment
      - text: tentu
        ar_eg: أكيد، طبعًا
        ar: بالتأكيد
        en: of course
    words: [tolong, bantu, tunggu, sebentar, tentu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: ضيف خبّط على الباب وعايز تقوله «اتفضل ادخل». تقول إيه؟
      ar: طرق ضيف الباب وتريد أن تقول له «تفضّل بالدخول». ماذا تقول؟
      en: A guest knocks and you want to say "please come in". What do you say?
    options: [Silakan masuk., Minta masuk., Tolong masuk.]
    answer: 0
    explain:
      ar_eg: العزومة = silakan. tolong لما تطلب منه خدمة.
      ar: الدعوة بـ silakan، وtolong لطلب الخدمة.
      en: Inviting = silakan; tolong asks a favour.
    words: [silakan]
  - id: e03
    type: listen
    text: Boleh minta air putih?
    options: ['Boleh minta air putih?', Tolong minum air putih., 'Boleh minta teh manis?']
    answer: 0
    words: [minta, air putih]
  - id: e04
    type: fill_blank
    sentence: Bisa bantu saya? — ___ bisa!
    meaning:
      ar_eg: ممكن تساعدني؟ — أكيد!
      ar: هل يمكنك مساعدتي؟ — بالتأكيد!
      en: Can you help me? — Of course!
    options: [Tentu, Tunggu, Tolong]
    answers: [Tentu]
    words: [bantu, tentu]
  - id: e05
    type: build_sentence
    source:
      ar_eg: استنى شوية، أنا هساعدك.
      ar: انتظر قليلًا، سأساعدك.
      en: Wait a moment, I'll help.
    answer: Tunggu sebentar, ya. Saya bantu.
    distractors: [tolong, silakan]
    words: [tunggu, sebentar, bantu]
  - id: e06
    type: dictation
    text: Mohon tunggu sebentar.
    meaning:
      ar_eg: برجاء الانتظار شوية.
      ar: يُرجى الانتظار قليلًا.
      en: Please wait a moment.
    words: [mohon, tunggu, sebentar]
  - id: e07
    type: speaking
    text: Tentu! Tunggu sebentar, ya.
    meaning:
      ar_eg: أكيد! استنى لحظة.
      ar: بالتأكيد! انتظر لحظة.
      en: Of course! Just a moment.
    words: [tentu, tunggu, sebentar]
dialogue:
  title: Tamu di Sanur
  lines:
    - speaker: Mohamed
      text: Permisi, Bu Yanti.
      ar_eg: عن إذنك يا مدام يانتي.
      ar: عن إذنكِ يا سيدة يانتي.
      en: Excuse me, Bu Yanti.
    - speaker: Bu Yanti
      text: Oh, Pak Mohamed! Silakan masuk. Silakan duduk.
      ar_eg: أوه، أستاذ محمد! اتفضل ادخل. اتفضل اقعد.
      ar: أهلًا يا سيد محمد! تفضّل بالدخول، تفضّل بالجلوس.
      en: Oh, Mr Mohamed! Please come in. Please sit down.
    - speaker: Mohamed
      text: Terima kasih, Bu. Boleh minta air putih? Hari ini panas banget.
      ar_eg: شكرًا يا مدام. ممكن شوية مية؟ النهارده حر قوي.
      ar: شكرًا يا سيدتي. هل لي بقليل من الماء؟ الجو حارّ جدًّا اليوم.
      en: Thank you, ma'am. Could I have some water? It's very hot today.
    - speaker: Bu Yanti
      text: Boleh. Ini airnya. Silakan minum.
      ar_eg: طبعًا. اتفضل المية. اتفضل اشرب.
      ar: بالطبع، هذا هو الماء. تفضّل اشرب.
      en: Sure. Here's the water. Please, have a drink.
    - speaker: Mohamed
      text: Bu, tolong bantu saya. Saya mencari kos di Sanur.
      ar_eg: يا مدام، لو سمحتي ساعديني. أنا بدوّر على سكن في سانور.
      ar: يا سيدتي، ساعديني من فضلك، فأنا أبحث عن سكن في سانور.
      en: Ma'am, please help me. I'm looking for a room to rent in Sanur.
    - speaker: Bu Yanti
      text: Tentu, Pak. Mohon tunggu sebentar, ya.
      ar_eg: أكيد يا أستاذ. استنى شوية لو سمحت.
      ar: بالتأكيد يا سيدي. انتظر قليلًا من فضلك.
      en: Of course, sir. Please wait a moment.
new_words:
  - word: tolong
    pos: particle
    ar_eg: لو سمحت (اعملّي)؛ لوحدها = إلحقوني!
    ar: من فضلك (افعل لي)؛ وحدها = النجدة!
    en: please (asking a favour); alone = Help!
  - word: bantu
    pos: verb
    ar_eg: ساعد (membantu = يساعد)
    ar: ساعِد (membantu = يساعد)
    en: help (membantu = to help)
  - word: tunggu
    pos: verb
    ar_eg: استنى (menunggu = يستنى)
    ar: انتظِر (menunggu = ينتظر)
    en: wait (menunggu = to wait)
  - word: sebentar
    pos: adverb
    ar_eg: شوية، لحظة
    ar: قليلًا، لحظة
    en: a moment
  - word: tentu
    pos: adverb
    ar_eg: أكيد، طبعًا
    ar: بالتأكيد
    en: of course
