    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لو سمحت ساعدني يا أستاذ.
      ar: ساعدني من فضلك يا سيدي.
      en: Please help me, sir.
    answers:
      - Tolong bantu saya, Pak.
      - Tolong bantu saya, Pak
      - Tolong bantu saya, Pak!
      - Pak, tolong bantu saya.
      - Pak, tolong bantu saya
