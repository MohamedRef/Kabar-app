schema: kabar.lesson/v1
id: bipa5.u04.l02
language: id
title: Pesantren dan Al-Azhar
can_do:
  ar_eg: تقارن بين مؤسستين تعليميتين، زي المعهد الديني والأزهر.
  ar: أن تقارن بين مؤسستين تعليميّتين كالمعهد الديني والأزهر.
  en: Compare two institutions, such as a pesantren and Al-Azhar.
slides:
  - title: Membandingkan
    body:
      ar_eg: |
        عشان تقارن بأسلوب رسمي:
        - Persamaannya adalah … = وجه الشبه …
        - Perbedaannya adalah … = الفرق …
        - Sementara itu, … = في الوقت نفسه / أما …
        - Keduanya … = الاتنين …
        وكلمات كتير هنا أصلها عربي: madrasah ← مدرسة، ilmu ← علم، kitab ← كتاب.
        وفي الحوار هتسمع كلام الشارع، وجنبه الرسمي: gede = besar، terus = lalu، udah = sudah.
      ar: |
        لتقارن بأسلوب رسمي:
        - Persamaannya adalah … = وجه الشبه …
        - Perbedaannya adalah … = الفرق …
        - Sementara itu, … = أمّا … / في حين …
        - Keduanya … = كلاهما …
        وكثير من الكلمات هنا عربي الأصل: madrasah ← مدرسة، ilmu ← علم، kitab ← كتاب.
        وفي الحوار لغة الشارع، وبجانبها الصيغة الرسمية: gede = besar، terus = lalu، udah = sudah.
      en: |
        To compare formally:
        - Persamaannya adalah … = The similarity is …
        - Perbedaannya adalah … = The difference is …
        - Sementara itu, … = Meanwhile / whereas …
        - Keduanya … = Both …
        Many words here come from Arabic: madrasah ← madrasa, ilmu ← ʿilm, kitab ← kitāb.
        The dialogue uses street forms; the formal ones are beside them: gede = besar, terus = lalu, udah = sudah.
    examples:
      - text: Keduanya mengajarkan ilmu agama. Sementara itu, Al-Azhar juga punya fakultas kedokteran.
        ar_eg: الاتنين بيعلّموا علوم الدين. أما الأزهر فعنده كمان كلية طب.
        ar: كلاهما يعلّم علوم الدين، أمّا الأزهر فله كلّية طبّ أيضًا.
        en: Both teach religious knowledge. Al-Azhar, meanwhile, also has a medical faculty.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: persamaan
        ar_eg: شبه / نقطة مشتركة
        ar: وجه شبه
        en: similarity
      - text: perbedaan
        ar_eg: فرق
        ar: فرق، اختلاف
        en: difference
      - text: keduanya
        ar_eg: الاتنين
        ar: كلاهما
        en: both
      - text: ilmu
        ar_eg: علم
        ar: علم
        en: knowledge, science
      - text: madrasah
        ar_eg: مدرسة (إسلامية)
        ar: مدرسة (إسلامية)
        en: Islamic school
    words: [persamaan, perbedaan, keduanya, ilmu, madrasah]
  - id: e02
    type: multiple_choice
    question: "Pesantren dan Al-Azhar sama-sama mengajarkan kitab. Itu ___ keduanya."
    question_meaning:
      ar_eg: «المعهد والأزهر الاتنين بيدرّسوا كتب التراث. ده … بينهم.» إيه الكلمة؟
      ar: «كلاهما يدرّس كتب التراث. هذا … بينهما.» ما الكلمة؟
      en: Which word completes "Both teach the classical books. That is a … between them."?
    options: [perbedaan, persamaan, sementara]
    answer: 1
    words: [persamaan, keduanya]
    explain:
      ar_eg: الاتنين بيعملوا نفس الحاجة، يعني persamaan (تشابه). perbedaan عكسها (فرق)، وsementara = «في حين».
      ar: كلاهما يفعل الشيء نفسه، فهذا persamaan (تشابه). أما perbedaan فعكسه (فرق)، وsementara «في حين».
      en: Both do the same thing, so it's a persamaan (similarity). perbedaan is the opposite, and sementara means "while".
  - id: e03
    type: fill_blank
    sentence: ___ utamanya adalah ukuran. Al-Azhar adalah universitas besar.
    meaning:
      ar_eg: الفرق الأساسي هو الحجم. الأزهر جامعة كبيرة.
      ar: الفرق الرئيسي هو الحجم، فالأزهر جامعة كبيرة.
      en: The main difference is size. Al-Azhar is a big university.
    options: [Perbedaan, Persamaan, Keduanya]
    answers: [Perbedaan]
    words: [perbedaan]
    explain:
      ar_eg: «الفرق الأساسي» = Perbedaan utamanya. Persamaan = تشابه (عكسها)، وKeduanya = الاتنين، ومايتوصفوش بالحجم.
      ar: «الفرق الرئيسي» = Perbedaan utamanya. أما Persamaan فالتشابه (عكسه)، وKeduanya «كلاهما».
      en: "\"The main difference\" is Perbedaan utamanya. Persamaan is the opposite (similarity), and Keduanya means \"both\"."
  - id: e04
    type: listen
    text: Di madrasah, siswa belajar ilmu agama dan ilmu umum.
    question:
      ar_eg: الطلاب بيدرسوا إيه في المدرسة الإسلامية؟
      ar: ماذا يدرس الطلّاب في المدرسة الإسلامية؟
      en: What do pupils study at the madrasah?
    options:
      - علوم الدين بس.
      - علوم عامة بس.
      - علوم الدين والعلوم العامة.
    answer: 2
    words: [madrasah, ilmu]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الاتنين بيدرّسوا علوم الدين.
      ar: كلاهما يعلّم علوم الدين.
      en: Both teach religious knowledge.
    answer: Keduanya mengajarkan ilmu agama.
    distractors: [perbedaan, sementara]
    words: [keduanya, ilmu]
    explain:
      ar_eg: «الاتنين» = Keduanya. perbedaan = فرق وsementara = في حين، ومش في الجملة.
      ar: «كلاهما» = Keduanya. أما perbedaan فالفرق، وsementara «في حين»، وليسا في الجملة.
      en: "\"Both\" is Keduanya. perbedaan (difference) and sementara (while) aren't in the sentence."
  - id: e06
    type: translate
    direction: from_target
    source_text: Perbedaannya, santri tinggal di pesantren, sementara mahasiswa Al-Azhar tinggal di kota.
    answers_meaning:
      ar_eg:
        - الفرق إن طلاب المعهد ساكنين في المعهد، أما طلاب الأزهر ساكنين في المدينة.
        - الفرق إن طالب المعهد عايش في المعهد، وطالب الأزهر عايش في المدينة.
      ar:
        - الفرق أنّ طلّاب المعهد يقيمون فيه، في حين يقيم طلّاب الأزهر في المدينة.
        - الفرق أنّ طالب المعهد يسكن المعهد، أمّا طالب الأزهر فيسكن المدينة.
      en:
        - The difference is that santri live in the pesantren, while Al-Azhar students live in the city.
        - The difference is that pesantren students board there, whereas Al-Azhar students live in town.
    words: [perbedaan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة مش جاية من العربي؟
      ar: أيّ كلمة ليست عربية الأصل؟
      en: Which word does not come from Arabic?
    options: [pesantren, ilmu, madrasah]
    answer: 0
    explain:
      ar_eg: pesantren من pe-santri-an، وsantri أصلها هندي قديم. الباقي عربي.
      ar: pesantren من pe-santri-an، وأصل santri هندي قديم، أمّا الباقيتان فعربيّتان.
      en: pesantren is pe-santri-an, and santri is of old Indic origin; the other two are Arabic.
    words: [ilmu, madrasah]
  - id: e08
    type: speaking
    text: Persamaannya, keduanya punya sejarah yang panjang.
    meaning:
      ar_eg: وجه الشبه إن الاتنين ليهم تاريخ طويل.
      ar: وجه الشبه أنّ لكليهما تاريخًا طويلًا.
      en: The similarity is that both have a long history.
    words: [persamaan, keduanya]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: «الفرق» بالإندونيسي إيه؟
      ar: ما معنى «الفرق» بالإندونيسية؟
      en: What is "the difference" in Indonesian?
    options: [persamaan, perbedaan, keduanya]
    answer: 1
    words: [perbedaan]
    explain:
      ar_eg: «الفرق» = perbedaan (per-an من beda). persamaan = التشابه، وkeduanya = الاتنين.
      ar: «الفرق» = perbedaan (per-an من beda). أما persamaan فالتشابه، وkeduanya «كلاهما».
      en: "\"The difference\" is perbedaan (per-an from beda). persamaan is \"similarity\" and keduanya \"both\"."
dialogue:
  title: Di pesantren Tenggarong
  lines:
    - speaker: Rina
      text: Mohamed, perbedaan pesantren ini sama Al-Azhar apa, sih?
      ar_eg: يا محمد، إيه الفرق بين المعهد ده والأزهر؟
      ar: يا محمد، ما الفرق بين هذا المعهد والأزهر؟
      en: Mohamed, what's the difference between this pesantren and Al-Azhar?
    - speaker: Mohamed
      text: Al-Azhar jauh lebih gede. Di sana ada kuliah kedokteran juga.
      ar_eg: الأزهر أكبر بكتير. وفيه كمان دراسة طب.
      ar: الأزهر أكبر بكثير، وفيه دراسة الطبّ أيضًا.
      en: Al-Azhar is much bigger. You can even study medicine there.
    - speaker: Rina
      text: Terus persamaannya?
      ar_eg: طب ووجه الشبه؟
      ar: وما وجه الشبه؟
      en: And the similarity?
    - speaker: Mohamed
      text: Keduanya mengajar ilmu Islam, terus keduanya udah tua banget.
      ar_eg: الاتنين بيدرّسوا العلوم الإسلامية، والاتنين قدام أوي.
      ar: كلاهما يدرّس العلوم الإسلامية، وكلاهما قديم جدًّا.
      en: Both teach Islamic knowledge, and both are very old.
