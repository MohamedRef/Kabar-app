schema: kabar.lesson/v1
id: bipa6.u03.l06
language: id
title: Silat dan randai
can_do:
  ar_eg: 'توصف عرض الرانداي المينانجي: قتال وغنا وحكاية في دايرة.'
  ar: 'أن تصف عرض الرانداي المينانغي: قتال وغناء وحكاية في دائرة.'
  en: Describe a Minang randai show, with martial arts, song and story in a circle.
slides:
  - title: Teater di tengah lingkaran
    body:
      ar_eg: |
        زمان، الشباب المينانجي كانوا بيبيتوا في الـ surau ويتعلموا الدين والـ silat مع بعض.
        - silat = فن قتال تقليدي (بالمينانجي silek)
        - pesilat = اللي بيلعب silat
        - randai = مسرح شعبي مينانجي: حركات silat + dendang + حكاية
        - lingkaran = دايرة. اللاعيبة بيلفوا في دايرة والحكاية بتتمثل في النص.
        - dendang = غنوة شعبية بتتغنى في العرض
        - في الشارع: kayak = seperti (زي)، terus = lalu (وبعدين)، banget = sekali (أوي).
        - yuk كلمة صغيرة بتدّي الجملة إحساس (دعوة لطيفة: يلا)، ومن غيرها الجملة صح برضه.
      ar: |
        كان شباب المينانغ قديمًا يبيتون في الـ surau، يتعلّمون الدين والـ silat معًا.
        - silat = فنّ قتال تقليدي (بالمينانغية silek)
        - pesilat = لاعب الـ silat
        - randai = مسرح شعبي مينانغي: حركات silat مع dendang وحكاية
        - lingkaran = دائرة؛ يدور المؤدّون في دائرة وتُمثَّل الحكاية في وسطها.
        - dendang = أغنية شعبية تُغنّى في العرض
        - في كلام الشارع: kayak = seperti (مثل)، terus = lalu (ثمّ)، banget = sekali (جدًّا).
        - yuk أداة صغيرة تلوّن الجملة (دعوة لطيفة)، والجملة صحيحة بدونها.
      en: |
        Young Minang men once slept at the surau, learning religion and silat together.
        - silat = traditional martial art (silek in Minang)
        - pesilat = silat fighter
        - randai = Minang folk theatre: silat moves, dendang and a story
        - lingkaran = circle. Performers move in a circle while the story is acted in the middle.
        - dendang = a folk song sung during the show
        - On the street: kayak = seperti (like), terus = lalu (then), banget = sekali (very).
        - yuk is a small particle that adds feeling (a friendly 'let's'); the sentence is correct without it.
    examples:
      - text: Para pesilat bergerak dalam lingkaran sambil menyanyikan dendang.
        ar_eg: لاعيبة السيلات بيتحركوا في دايرة وهما بيغنوا.
        ar: يتحرّك لاعبو السيلات في دائرة وهم يغنّون.
        en: The silat fighters move in a circle as they sing.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: silat
        ar_eg: فن قتال تقليدي
        ar: فنّ قتال تقليدي
        en: traditional martial art
      - text: pesilat
        ar_eg: لعيب سيلات
        ar: لاعب سيلات
        en: silat fighter
      - text: randai
        ar_eg: مسرح شعبي مينانجي
        ar: مسرح شعبي مينانغي
        en: Minang folk theatre
      - text: lingkaran
        ar_eg: دايرة
        ar: دائرة
        en: circle
      - text: dendang
        ar_eg: غنوة شعبية
        ar: أغنية شعبية
        en: folk song
    words: [silat, pesilat, randai, lingkaran, dendang]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الـ randai فيه إيه؟
      ar: ممّ يتكوّن الـ randai؟
      en: What does a randai combine?
    options:
      - مزيكا غربية بس.
      - حركات silat وغنا وحكاية.
      - رقص من غير كلام.
    answer: 1
    words: [randai, silat]
  - id: e03
    type: listen
    text: Dulu anak laki-laki belajar mengaji dan silat di surau.
    question:
      ar_eg: الولاد زمان كانوا بيتعلموا إيه في الـ surau؟
      ar: ماذا كان الصبيان يتعلّمون قديمًا في الـ surau؟
      en: What did boys once learn at the surau?
    options:
      - الحساب والطبخ.
      - الزراعة والصيد.
      - القرآن والسيلات.
    answer: 2
    words: [silat]
  - id: e04
    type: fill_blank
    sentence: Penonton duduk mengelilingi ___ para pemain randai.
    meaning:
      ar_eg: الجمهور قاعد حوالين دايرة لاعيبة الرانداي.
      ar: يجلس الجمهور حول دائرة مؤدّي الرانداي.
      en: The audience sits around the circle of randai players.
    options: [lingkaran, dendang, kenduri]
    answers: [lingkaran]
    words: [lingkaran, randai]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «pesilat» يعني مين؟
      ar: من «pesilat»؟
      en: Who is a "pesilat"?
    options:
      - اللي بيلعب silat.
      - اللي بيبيع silat.
      - اللي بيكتب عن silat.
    answer: 0
    explain:
      ar_eg: pe- + silat = اللي بيعمل الحاجة، زي pelari (عدّاء).
      ar: pe- + silat = فاعل الشيء، مثل pelari (عدّاء).
      en: pe- + silat = the one who does it, like pelari (runner).
    words: [pesilat]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الغنوة الشعبية بتحكي قصة حب حزينة.
      ar: تروي الأغنية الشعبية قصّة حبّ حزينة.
      en: The folk song tells a sad love story.
    answer: Dendang itu menceritakan kisah yang sedih.
    distractors: [lingkaran, pesilat]
    words: [dendang]
  - id: e07
    type: translate
    direction: from_target
    source_text: Randai biasanya dipentaskan pada malam hari di lapangan kampung.
    answers_meaning:
      ar_eg:
        - الرانداي عادةً بيتعرض بالليل في ساحة البلد.
        - عرض الرانداي غالبًا بيبقى بالليل في ميدان القرية.
      ar:
        - يُعرض الرانداي عادةً ليلًا في ساحة القرية.
        - غالبًا ما يُقدَّم الرانداي ليلًا في ميدان البلدة.
      en:
        - Randai is usually performed at night on the village field.
        - A randai is mostly staged at night in the village square.
    words: [randai]
  - id: e08
    type: speaking
    text: Pesilat itu bergerak pelan, lalu tiba-tiba melompat.
    meaning:
      ar_eg: لعيب السيلات اتحرك بالراحة، وبعدين فجأة نط.
      ar: تحرّك لاعب السيلات ببطء ثم قفز فجأة.
      en: The fighter moved slowly, then suddenly leapt.
    words: [pesilat]
  - id: e09
    type: dictation
    text: Silat bukan hanya bela diri, tetapi juga seni dan adat.
    meaning:
      ar_eg: السيلات مش بس دفاع عن النفس، ده كمان فن وعادة.
      ar: ليس السيلات دفاعًا عن النفس فحسب، بل هو فنّ وعُرف أيضًا.
      en: Silat isn't only self-defence; it's also art and custom.
    words: [silat]
  - id: e10
    type: fill_blank
    sentence: Suara ___ terdengar dari tengah lingkaran.
    meaning:
      ar_eg: صوت الغنوة الشعبية كان طالع من نص الدايرة.
      ar: كان صوت الأغنية الشعبية يُسمع من وسط الدائرة.
      en: The sound of a folk song came from the middle of the circle.
    options: [dendang, pesilat, penghulu]
    answers: [dendang]
    words: [dendang, lingkaran]
dialogue:
  title: Malam randai
  lines:
    - speaker: Uni Lisa
      text: Mohamed, malam ini ada randai di lapangan. Yuk, nonton!
      ar_eg: يا محمد، الليلة فيه رانداي في الساحة. يلا نتفرج!
      ar: يا محمد، الليلة عرض رانداي في الساحة. هيّا نشاهده!
      en: Mohamed, there's a randai on the field tonight. Let's go watch!
    - speaker: Mohamed
      text: Randai itu kayak teater? Atau kayak silat?
      ar_eg: الرانداي ده زي المسرح؟ ولا زي السيلات؟
      ar: هل الرانداي مسرح أم سيلات؟
      en: Is randai like theatre? Or like silat?
    - speaker: Uni Lisa
      text: Dua-duanya. Para pesilat menari dalam lingkaran, terus ada dendang juga.
      ar_eg: الاتنين. لاعيبة السيلات بيرقصوا في دايرة، وكمان فيه غنا.
      ar: كلاهما؛ يرقص لاعبو السيلات في دائرة، ويرافقهم الغناء.
      en: Both. The fighters dance in a circle, and there's singing too.
    - speaker: Mohamed
      text: Seru banget! Di Mesir kami punya tahtib, tarian pakai tongkat.
      ar_eg: حلو أوي! إحنا في مصر عندنا التحطيب، رقصة بالعصاية.
      ar: رائع! لدينا في مصر التحطيب، رقصة بالعصا.
      en: How fun! In Egypt we have tahtib, a stick dance.
