schema: kabar.lesson/v1
id: bipa6.u09.l07
language: id
title: Modal untuk cabang baru
can_do:
  ar_eg: 'تتفاوض على تمويل فرع جديد لمطعم: الاستثمار والشراكة والتسوية وسداد الدين.'
  ar: 'أن تتفاوض على تمويل فرع جديد لمطعم: الاستثمار والشراكة والتسوية وسداد الدين.'
  en: 'Negotiate funding for a new restaurant branch: investment, partnership, compromise, paying off debt.'
slides:
  - title: Rapat pendanaan
    body:
      ar_eg: |
        أودا فضلي عايز يفتح فرع لمطعم الرندانج بتاعه في القاهرة:
        pendanaan = تمويل (من dana). berinvestasi = يستثمر (من investasi). kemitraan = شراكة (من mitra).
        direksi = مجلس الإدارة، الإدارة العليا. kuartal = ربع سنة (kuartal pertama).
        berunding = يتفاوض، يتشاور (من runding). kompromi = حل وسط، تسوية. melunasi = يسدّ الدين كله (من lunas).
      ar: |
        يريد أودا فضلي فتح فرع لمطعم الرندانغ في القاهرة:
        pendanaan = تمويل (من dana). berinvestasi = يستثمر (من investasi). kemitraan = شراكة (من mitra).
        direksi = مجلس الإدارة. kuartal = ربع سنة (kuartal pertama).
        berunding = يتفاوض (من runding). kompromi = حلّ وسط، تسوية. melunasi = يسدّد الدين كاملًا (من lunas).
      en: |
        Uda Fadli wants to open a branch of his rendang restaurant in Cairo:
        pendanaan = funding (from dana). berinvestasi = to invest (from investasi). kemitraan = partnership (from mitra).
        direksi = board of directors. kuartal = quarter (kuartal pertama).
        berunding = to negotiate, confer (from runding). kompromi = compromise. melunasi = to pay off in full (from lunas).
    examples:
      - text: Kami mencari pendanaan untuk cabang di Kairo.
        ar_eg: بندور على تمويل للفرع اللي في القاهرة.
        ar: نبحث عن تمويل لفرع في القاهرة.
        en: We're looking for funding for a Cairo branch.
      - text: Direksi akan berunding minggu depan.
        ar_eg: مجلس الإدارة هيتفاوض الأسبوع الجاي.
        ar: سيتشاور مجلس الإدارة الأسبوع القادم.
        en: The board will confer next week.
      - text: Kami melunasi pinjaman pada kuartal ketiga.
        ar_eg: سدّينا القرض كله في الربع التالت.
        ar: سدّدنا القرض كاملًا في الربع الثالث.
        en: We paid off the loan in the third quarter.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pendanaan
        ar_eg: تمويل
        ar: تمويل
        en: funding
      - text: berinvestasi
        ar_eg: يستثمر
        ar: يستثمر
        en: to invest
      - text: kemitraan
        ar_eg: شراكة
        ar: شراكة
        en: partnership
      - text: direksi
        ar_eg: مجلس الإدارة
        ar: مجلس الإدارة
        en: board of directors
    words: [pendanaan, berinvestasi, kemitraan, direksi]
  - id: e02
    type: match_pairs
    pairs:
      - text: kuartal
        ar_eg: ربع سنة
        ar: ربع سنة
        en: quarter
      - text: berunding
        ar_eg: يتفاوض
        ar: يتفاوض
        en: to negotiate
      - text: kompromi
        ar_eg: حل وسط
        ar: حلّ وسط
        en: compromise
      - text: melunasi
        ar_eg: يسدّ الدين
        ar: يسدّد
        en: to pay off
    words: [kuartal, berunding, kompromi, melunasi]
  - id: e03
    type: listen
    text: Kabar baik untuk investor kita. Penjualan kuartal pertama naik dua puluh persen. Karena itu, kami siap membuka cabang baru tahun ini.
    question:
      ar_eg: المبيعات زادت إمتى، والنتيجة إيه؟
      ar: متى زادت المبيعات، وما النتيجة؟
      en: When did sales rise, and what follows?
    options:
      - Pada kuartal pertama, jadi mereka siap membuka cabang baru.
      - Sepanjang tahun, jadi mereka menutup cabang.
      - Bulan ini, jadi mereka mencari pemasok baru.
    answer: 0
    meaning:
      ar_eg: أخبار حلوة للمستثمرين. مبيعات الربع الأول زادت عشرين في المية. علشان كده إحنا جاهزين نفتح فرع جديد السنة دي.
      ar: "أخبار سارّة لمستثمرينا: ارتفعت مبيعات الربع الأوّل عشرين في المئة، ولذلك نحن مستعدّون لافتتاح فرع جديد هذا العام."
      en: Good news for our investors. First-quarter sales rose twenty per cent. So we're ready to open a new branch this year.
    explain:
      ar_eg: kuartal pertama = الربع الأول، وkarena itu = علشان كده هيفتحوا فرع جديد. مش السنة كلها ولا الشهر ده.
      ar: kuartal pertama = الربع الأوّل، وkarena itu = لذلك سيفتحون فرعًا جديدًا؛ لا العام كلّه ولا هذا الشهر.
      en: First quarter, and karena itu = so they're ready to open a new branch. Not the whole year or this month.
    words: [kuartal]
  - id: e04
    type: fill_blank
    sentence: Kedua pihak tidak setuju, jadi mereka mencari ___.
    meaning:
      ar_eg: الطرفين مش متفقين، فبيدوروا على ___.
      ar: لم يتفق الطرفان، فبحثا عن ___.
      en: The two sides disagree, so they look for a ___.
    options: [kompromi, kuartal, direksi]
    answers: [kompromi]
    words: [kompromi, kuartal, direksi]
    explain:
      ar_eg: لما الطرفين مختلفين يدوروا على حل وسط kompromi. kuartal = ربع سنة، وdireksi = مجلس الإدارة.
      ar: عند الخلاف يُبحث عن حلّ وسط kompromi؛ أمّا kuartal فربع سنة، وdireksi مجلس الإدارة.
      en: When sides disagree, they seek a kompromi. kuartal is a quarter, and direksi the board.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: لما تحط فلوسك في مشروع عشان تكسب، بتعمل إيه؟
      ar: حين تضع مالك في مشروع لتربح، ماذا تفعل؟
      en: Putting your money into a project to earn — what's that?
    options: [berunding, berinvestasi, melunasi]
    answer: 1
    explain:
      ar_eg: berinvestasi = يستثمر.
      ar: berinvestasi = يستثمر.
      en: berinvestasi = to invest.
    words: [berinvestasi, berunding, melunasi]
  - id: e06
    type: fill_blank
    sentence: Saya harus ___ utang ini sebelum akhir tahun.
    meaning:
      ar_eg: لازم ___ الدين ده قبل آخر السنة.
      ar: عليّ أن ___ هذا الدين قبل نهاية العام.
      en: I must ___ this debt before the end of the year.
    options: [melunasi, kemitraan, pendanaan]
    answers: [melunasi]
    words: [melunasi, kemitraan, pendanaan]
    explain:
      ar_eg: "harus + فعل: melunasi utang (يسدّ الدين). kemitraan = شراكة وpendanaan = تمويل، أسماء."
      ar: harus يتلوها فعل melunasi (يسدّد)؛ أمّا kemitraan (شراكة) وpendanaan (تمويل) فاسمان.
      en: "harus takes a verb: melunasi, pay off. kemitraan (partnership) and pendanaan (funding) are nouns."
  - id: e07
    type: multiple_choice
    question: Keputusan besar perusahaan diambil oleh ___.
    options: [kompromi, kuartal, direksi]
    answer: 2
    explain:
      ar_eg: 'القرارات الكبيرة بياخدها مجلس الإدارة: direksi.'
      ar: 'يتخذ القرارات الكبرى مجلسُ الإدارة: direksi.'
      en: 'Big decisions are made by the board: direksi.'
    words: [direksi, kompromi, kuartal]
  - id: e08
    type: build_sentence
    source:
      ar_eg: هنتفاوض بالراحة على السعر.
      ar: سنتفاوض على السعر بهدوء.
      en: We'll negotiate the price calmly.
    answer: Kita akan berunding tentang harga dengan tenang.
    distractors: [melunasi, kemitraan]
    words: [berunding]
    explain:
      ar_eg: «هنتفاوض» = akan berunding و«بهدوء» = dengan tenang. melunasi وkemitraan زيادة.
      ar: «سنتفاوض» akan berunding و«بهدوء» dengan tenang؛ أمّا melunasi وkemitraan فزائدتان.
      en: "\"We'll negotiate\" is akan berunding and \"calmly\" is dengan tenang. melunasi and kemitraan aren't needed."
  - id: e09
    type: translate
    direction: from_target
    source_text: Kemitraan ini membuka pendanaan untuk cabang baru, sehingga kami tidak perlu meminjam uang dari bank.
    answers_meaning:
      ar_eg:
        - الشراكة دي بتفتح تمويل للفرع الجديد، فمش محتاجين نستلف فلوس من البنك.
        - الشراكة دي هتجيب تمويل للفرع الجديد، علشان كده مش هنقترض من البنك.
      ar:
        - تفتح هذه الشراكة تمويلًا للفرع الجديد، فلا نحتاج إلى الاقتراض من البنك.
      en:
        - This partnership opens up funding for a new branch, so we don't need to borrow from the bank.
        - The partnership brings funding for the new branch, which means no bank loan is needed.
    explain:
      ar_eg: "sehingga بتجيب النتيجة: مش محتاجين قرض."
      ar: "sehingga تأتي بالنتيجة: لا حاجة إلى قرض."
      en: "sehingga brings the result: no loan needed."
    words: [kemitraan, pendanaan]
  - id: e10
    type: speaking
    text: Kami siap berinvestasi kalau ada kompromi tentang keuntungan.
    meaning:
      ar_eg: إحنا مستعدين نستثمر لو فيه حل وسط في المكسب.
      ar: نحن مستعدون للاستثمار إن وُجد حلّ وسط بشأن الأرباح.
      en: We're ready to invest if there's a compromise on profits.
    words: [berinvestasi, kompromi]
dialogue:
  lines:
    - speaker: Uda Fadli
      text: Mohamed, saya mau buka cabang di Kairo. Tapi butuh pendanaan.
      ar_eg: يا محمد، عايز أفتح فرع في القاهرة. بس محتاج تمويل.
      ar: يا محمد، أريد فتح فرع في القاهرة، لكني أحتاج تمويلًا.
      en: Mohamed, I want to open a branch in Cairo. But I need funding.
    - speaker: Mohamed
      text: Teman saya di Kairo mau berinvestasi. Mungkin kemitraan?
      ar_eg: صاحبي في القاهرة عايز يستثمر. يمكن شراكة؟
      ar: صديقي في القاهرة يريد الاستثمار. ربما شراكة؟
      en: A friend in Cairo wants to invest. A partnership, maybe?
    - speaker: Uda Fadli
      text: Boleh. Tapi direksi kami harus berunding dulu.
      ar_eg: ماشي. بس مجلس إدارتنا لازم يتشاور الأول.
      ar: ممكن. لكن على مجلس إدارتنا أن يتشاور أولًا.
      en: Possibly. But our board has to confer first.
    - speaker: Mohamed
      text: Dia minta lima puluh persen. Bisa?
      ar_eg: هو عايز خمسين في المية. ينفع؟
      ar: يطلب خمسين في المئة. ممكن؟
      en: He's asking for fifty per cent. Possible?
    - speaker: Uda Fadli
      text: 'Itu terlalu banyak. Kompromi: tiga puluh persen, dan kami melunasi utang lama dulu pada kuartal ini.'
      ar_eg: 'ده كتير. حل وسط: تلاتين في المية، وإحنا نسدّ الدين القديم الأول الربع ده.'
      ar: 'هذا كثير. حلّ وسط: ثلاثون في المئة، ونسدّد الدين القديم أولًا هذا الربع.'
      en: 'That''s too much. Compromise: thirty per cent, and we pay off the old debt first this quarter.'
