schema: kabar.lesson/v1
id: bipa6.u10.l05
language: id
title: Menyunting tulisan
can_do:
  ar_eg: تراجع مسودة مقالك وتصلّح الأخطاء قبل ما تسلّمه.
  ar: أن تراجع مسوّدة مقالك وتصحّح أخطاءها قبل التسليم.
  en: Edit your essay draft and fix its mistakes before handing it in.
slides:
  - title: Draf pertama bukan yang terakhir
    body:
      ar_eg: |
        محدش بيكتب مقال كويس من أول مرة.
        - draf = مسودة: draf pertama = أول مسودة
        - membaca ulang = يقرا تاني بتركيز
        - menyunting = يحرّر / يعدّل النص (ومنها penyunting = محرر)
        - salah ketik = غلطة كتابة، حرف غلط: «pemerinth» بدل «pemerintah»
        - revisi = مراجعة وتعديل كبير: تغيير ترتيب أو إضافة أفكار
        نصيحة: اقرا النص بصوت عالي. ودنك هتلقط الجمل الطويلة أوي.
      ar: |
        لا أحد يكتب مقالًا جيّدًا من المرّة الأولى.
        - draf = مسوّدة: draf pertama = المسوّدة الأولى
        - membaca ulang = يعيد القراءة بتركيز
        - menyunting = يحرّر النصّ ويعدّله (ومنها penyunting = محرّر)
        - salah ketik = خطأ طباعي: «pemerinth» بدل «pemerintah»
        - revisi = مراجعة وتعديل جوهري: تغيير الترتيب أو إضافة أفكار
        ونصيحة: اقرأ النصّ بصوت عالٍ، فأذنك ستلتقط الجمل الطويلة جدًّا.
      en: |
        Nobody writes a good essay on the first try.
        - draf = draft: draf pertama = first draft
        - membaca ulang = to reread carefully
        - menyunting = to edit a text (hence penyunting = editor)
        - salah ketik = typo: «pemerinth» instead of «pemerintah»
        - revisi = revision, a bigger change: reordering or adding ideas
        Tip: read the text aloud. Your ear will catch sentences that run too long.
    examples:
      - text: Setelah membaca ulang draf pertama, saya menemukan lima salah ketik.
        ar_eg: بعد ما قريت أول مسودة تاني، لقيت خمس غلطات كتابة.
        ar: بعد إعادة قراءة المسوّدة الأولى وجدت خمسة أخطاء طباعية.
        en: After rereading the first draft, I found five typos.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: draf
        ar_eg: مسودة
        ar: مسوّدة
        en: draft
      - text: membaca ulang
        ar_eg: يقرا تاني
        ar: يعيد القراءة
        en: to reread
      - text: menyunting
        ar_eg: يحرّر النص
        ar: يحرّر
        en: to edit
      - text: salah ketik
        ar_eg: غلطة كتابة
        ar: خطأ طباعي
        en: typo
      - text: revisi
        ar_eg: تعديل كبير
        ar: مراجعة
        en: revision
    words: [draf, membaca ulang, menyunting, salah ketik, revisi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «pemerinth» بدل «pemerintah». ده إيه؟
      ar: «pemerinth» بدل «pemerintah». ما هذا؟
      en: «pemerinth» instead of «pemerintah». What is this?
    options: [revisi, salah ketik, kerangka]
    answer: 1
    words: [salah ketik]
  - id: e03
    type: listen
    text: Dosen meminta revisi besar karena urutan paragrafnya tidak logis.
    question:
      ar_eg: الدكتور طلب تعديل كبير ليه؟
      ar: لماذا طلب الأستاذ مراجعة كبيرة؟
      en: Why did the lecturer ask for a big revision?
    options:
      - عشان فيه غلطات كتابة كتير.
      - عشان المقال قصير.
      - عشان ترتيب الفقرات مش منطقي.
    answer: 2
    words: [revisi, urutan]
  - id: e04
    type: fill_blank
    sentence: Rani membantu saya ___ esai ini sebelum dikumpulkan.
    meaning:
      ar_eg: راني ساعدتني أحرّر المقال ده قبل ما أسلّمه.
      ar: ساعدتني راني في تحرير هذا المقال قبل تسليمه.
      en: Rani helped me edit this essay before it was handed in.
    options: [menyunting, membentak, menyahut]
    answers: [menyunting]
    words: [menyunting]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الفرق بين تصليح salah ketik وrevisi؟
      ar: ما الفرق بين تصحيح salah ketik والـ revisi؟
      en: What's the difference between fixing a salah ketik and a revisi?
    options:
      - الـ revisi تغيير أكبر في الأفكار أو الترتيب.
      - مافيش فرق.
      - الـ revisi للحروف بس.
    answer: 0
    words: [revisi, salah ketik]
  - id: e06
    type: build_sentence
    source:
      ar_eg: اقرا المسودة تاني بصوت عالي.
      ar: أعد قراءة المسوّدة بصوت عالٍ.
      en: Reread the draft aloud.
    answer: Bacalah ulang draf itu dengan suara keras.
    distractors: [revisi, menyunting]
    words: [membaca ulang, draf]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: دي المسودة التانية بتاعة مقالي.
      ar: هذه المسوّدة الثانية لمقالي.
      en: This is the second draft of my essay.
    answers:
      - Ini draf kedua esai saya.
      - Ini adalah draf kedua esai saya.
      - Ini draf kedua dari esai saya.
    words: [draf]
  - id: e08
    type: speaking
    text: Saya sudah membaca ulang tiga kali, tetapi masih ada salah ketik.
    meaning:
      ar_eg: قريته تاني تلات مرات، بس لسه فيه غلطات كتابة.
      ar: أعدت قراءته ثلاث مرّات، وما زالت فيه أخطاء طباعية.
      en: I've reread it three times, but there are still typos.
    words: [membaca ulang, salah ketik]
  - id: e09
    type: dictation
    text: Penyunting koran menyunting berita itu dalam sepuluh menit.
    meaning:
      ar_eg: محرر الجرنال حرّر الخبر ده في عشر دقايق.
      ar: حرّر محرّر الصحيفة ذلك الخبر في عشر دقائق.
      en: The newspaper editor edited that story in ten minutes.
    words: [menyunting]
  - id: e10
    type: fill_blank
    sentence: Setelah ___, esai saya menjadi lebih pendek dan lebih jelas.
    meaning:
      ar_eg: بعد التعديل، مقالي بقى أقصر وأوضح.
      ar: بعد المراجعة صار مقالي أقصر وأوضح.
      en: After revision, my essay became shorter and clearer.
    options: [revisi, draf, salah ketik]
    answers: [revisi]
    words: [revisi]
dialogue:
  title: Tinta merah
  lines:
    - speaker: Rani
      text: Mohamed, aku sudah membaca drafmu. Banyak tinta merah, ya!
      ar_eg: يا محمد، قريت مسودتك. فيها حبر أحمر كتير!
      ar: يا محمد، قرأت مسوّدتك، وفيها حبر أحمر كثير!
      en: Mohamed, I've read your draft. Lots of red ink!
    - speaker: Mohamed
      text: Aduh. Salah ketik, atau masalah yang lebih besar?
      ar_eg: يا ساتر. غلطات كتابة ولا مشكلة أكبر؟
      ar: يا إلهي! أخطاء طباعية أم مشكلة أكبر؟
      en: Oh no. Typos, or something bigger?
    - speaker: Rani
      text: Dua-duanya. Paragraf kedua perlu revisi, kalimatnya terlalu panjang.
      ar_eg: الاتنين. الفقرة التانية محتاجة تعديل، جملها طويلة أوي.
      ar: كلاهما؛ الفقرة الثانية تحتاج إلى مراجعة، فجملها طويلة جدًّا.
      en: Both. The second paragraph needs revising; its sentences are too long.
    - speaker: Mohamed
      text: Terima kasih. Malam ini saya sunting lagi, lalu saya baca ulang dengan suara keras.
      ar_eg: شكرًا. الليلة هعدّله تاني، وبعدين أقراه بصوت عالي.
      ar: شكرًا، سأحرّره الليلة مجدّدًا ثم أعيد قراءته بصوت عالٍ.
      en: Thanks. Tonight I'll edit it again, then reread it aloud.
