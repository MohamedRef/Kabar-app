schema: kabar.lesson/v1
id: bipa1.u09.l03
language: id
title: Depan, belakang, samping
can_do:
  ar_eg: تقول قدام وورا وجنب وبين، وتسمّي أوض البيت.
  ar: أن تقول أمام وخلف وبجانب وبين، وتسمي غرف البيت.
  en: Say in front of, behind, next to and between, and name the rooms.
slides:
  - title: Depan, belakang, samping
    body:
      ar_eg: |
        - di depan = قدّام
        - di belakang = ورا
        - di samping / di sebelah = جنب
        - di antara … dan … = بين … و…
        وkursi جاية من العربي «كرسي»، سهلة!
      ar: |
        - di depan = أمام
        - di belakang = خلف
        - di samping / di sebelah = بجانب
        - di antara … dan … = بين … و…
        وkursi من العربية «كرسي».
      en: |
        - di depan = in front of
        - di belakang = behind
        - di samping / di sebelah = next to
        - di antara … dan … = between … and …
        And kursi comes from Arabic «كرسي» (chair).
    grammar: id.location.words
    examples:
      - text: Tasnya di samping kursi.
        ar_eg: الشنطة جنب الكرسي.
        ar: الحقيبة بجانب الكرسي.
        en: The bag is next to the chair.
      - text: Kamar saya di antara dapur dan kamar mandi.
        ar_eg: أوضتي بين المطبخ والحمّام.
        ar: غرفتي بين المطبخ والحمّام.
        en: My room is between the kitchen and the bathroom.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: di atas
        ar_eg: فوق
        ar: فوق
        en: on, above
      - text: di bawah
        ar_eg: تحت
        ar: تحت
        en: under
      - text: di depan
        ar_eg: قدّام
        ar: أمام
        en: in front of
      - text: di belakang
        ar_eg: ورا
        ar: خلف
        en: behind
      - text: di dalam
        ar_eg: جوه
        ar: داخل
        en: inside
    words: [atas, bawah, depan, belakang, dalam]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الجنينة بين البيت والجامع. أنهي جملة صح؟
      ar: الحديقة بين البيت والمسجد. أيّ جملة صحيحة؟
      en: The park is between the house and the mosque. Which sentence is right?
    options: [Tamannya di dalam rumah dan masjid., Tamannya di antara rumah dan masjid., Tamannya di belakang rumah dan masjid.]
    answer: 1
    explain:
      ar_eg: «بين … و…» = di antara … dan ….
      ar: «بين … و…» = di antara … dan ….
      en: between … and … = di antara … dan ….
    words: [antara]
  - id: e03
    type: fill_blank
    sentence: Mohamed di ___ rumah, di depan pintu.
    meaning:
      ar_eg: محمد بره البيت، قدّام الباب.
      ar: محمد خارج البيت، أمام الباب.
      en: Mohamed is outside the house, in front of the door.
    options: [bawah, dalam, luar]
    answers: [luar]
    explain:
      ar_eg: قدّام الباب يعني بره البيت، luar.
      ar: 'أمام الباب يعني خارج البيت: luar.'
      en: 'In front of the door means outside: luar.'
    words: [luar, depan, pintu]
  - id: e04
    type: build_sentence
    source:
      ar_eg: أوضتي جنب المطبخ.
      ar: غرفتي بجانب المطبخ.
      en: My room is next to the kitchen.
    answer: Kamar saya di samping dapur.
    distractors: [atas, dari]
    words: [kamar, samping, dapur]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الشنطة جوه الأوضة.
      ar: الحقيبة داخل الغرفة.
      en: The bag is inside the room.
    answers: [Tasnya di dalam kamar., Tasnya di dalam kamar, Tas di dalam kamar., Tasnya di kamar., Tasnya ada di dalam kamar.]
    explain:
      ar_eg: di dalam = جوه. وdi kamar لوحدها كمان مقبولة.
      ar: di dalam = داخل، وتُقبل di kamar وحدها أيضًا.
      en: di dalam = inside; plain di kamar is fine too.
    words: [dalam, tas, kamar]
  - id: e06
    type: dictation
    text: Kursinya di depan meja.
    meaning:
      ar_eg: الكرسي قدّام الترابيزة.
      ar: الكرسي أمام الطاولة.
      en: The chair is in front of the table.
    words: [kursi, depan, meja]
dialogue:
  title: Tiket ke Monas
  lines:
    - speaker: Mohamed
      text: Bu Sari, tiket Monas saya di mana, ya?
      ar_eg: يا طنط ساري، تذكرة موناس بتاعتي فين يا ترى؟
      ar: يا سيدة ساري، أين تذكرتي لموناس يا ترى؟
      en: Bu Sari, where's my Monas ticket, I wonder?
    - speaker: Bu Sari
      text: Di atas meja?
      ar_eg: على الترابيزة؟
      ar: على الطاولة؟
      en: On the table?
    - speaker: Mohamed
      text: Tidak ada, Bu. Di bawah meja juga tidak ada.
      ar_eg: مش موجودة يا طنط. وتحت الترابيزة كمان مفيش.
      ar: ليست هناك يا سيدتي، ولا تحت الطاولة.
      en: It's not there, ma'am. Not under the table either.
    - speaker: Bu Sari
      text: Tasmu di mana? Coba lihat di dalam tas.
      ar_eg: شنطتك فين؟ جرّب تبص جوه الشنطة.
      ar: أين حقيبتك؟ حاول أن تنظر داخل الحقيبة.
      en: Where's your bag? Try looking inside the bag.
    - speaker: Mohamed
      text: Tasnya di samping kursi… Ah, ini dia tiketnya! Terima kasih, Bu.
      ar_eg: الشنطة جنب الكرسي… آه، أهي التذكرة! شكرًا يا طنط.
      ar: الحقيبة بجانب الكرسي… آه، ها هي التذكرة! شكرًا يا سيدتي.
      en: The bag's next to the chair… Ah, here's the ticket! Thank you, ma'am.
