schema: kabar.lesson/v1
id: bipa1.u09.l03
language: id
title: Lurus, lalu belok kiri
can_do:
  ar_eg: توصف الطريق خطوة بخطوة.
  ar: أن تصف الطريق خطوة خطوة.
  en: Give step-by-step directions.
slides:
  - title: Jalan lurus, belok kiri
    body:
      ar_eg: |
        كلمات الطريق:
        - jalan lurus = امشي دغري (jalan = يمشي، وكمان «شارع»)
        - belok kiri / belok kanan = خش شمال / يمين
        - di lampu merah = عند الإشارة (حرفيًا «النور الأحمر»)
        - di perempatan = عند التقاطع (مكان ما أربع طرق بيتقابلوا)
        الفعل لوحده كفاية عشان تدّي تعليمات: Belok kanan! = خش يمين!
      ar: |
        مفردات الطريق:
        - jalan lurus = امشِ مستقيمًا (jalan = يمشي، وتعني أيضًا «شارع»)
        - belok kiri / belok kanan = انعطف يسارًا / يمينًا
        - di lampu merah = عند إشارة المرور (حرفيًا «الضوء الأحمر»)
        - di perempatan = عند التقاطع
        ويكفي الفعل وحده للإرشاد: Belok kanan! = انعطف يمينًا!
      en: |
        Direction words:
        - jalan lurus = go straight (jalan = to walk; also "street")
        - belok kiri / belok kanan = turn left / right
        - di lampu merah = at the traffic light (literally "red light")
        - di perempatan = at the crossroads
        The bare verb is enough for an instruction: Belok kanan! = Turn right!
    grammar: id.conjunction.basic
    examples:
      - text: Jalan lurus, lalu belok kiri di masjid.
        ar_eg: امشي دغري وبعدين خش شمال عند الجامع.
        ar: امشِ مستقيمًا ثم انعطف يسارًا عند المسجد.
        en: Go straight, then turn left at the mosque.
  - title: Lalu, kemudian
    body:
      ar_eg: |
        lalu وkemudian = «وبعدين». بيربطوا الخطوات بالترتيب، وده أهم حاجة في الاتجاهات:
        Jalan lurus, lalu belok kanan, kemudian belok kiri di lampu merah.
        kemudian أرسمي شوية، وlalu أكتر في الكلام.
      ar: |
        lalu وkemudian = «ثم»، وتربطان الخطوات بالترتيب، وهذا لبّ الإرشاد:
        Jalan lurus, lalu belok kanan, kemudian belok kiri di lampu merah.
        وkemudian أكثر رسمية، وlalu أكثر شيوعًا في الكلام.
      en: |
        lalu and kemudian = "then". They chain the steps in order — the heart of directions:
        Jalan lurus, lalu belok kanan, kemudian belok kiri di lampu merah.
        kemudian is a bit more formal; lalu is more common in speech.
    grammar: id.conjunction.basic
    examples:
      - text: Belok kanan di perempatan, kemudian jalan lurus.
        ar_eg: خش يمين عند التقاطع، وبعدين امشي دغري.
        ar: انعطف يمينًا عند التقاطع، ثم امشِ مستقيمًا.
        en: Turn right at the crossroads, then go straight.
  - title: Dan, atau, tetapi
    body:
      ar_eg: |
        - dan = و: Monas dan Masjid Istiqlal = موناس وجامع الاستقلال.
        - atau = أو، وفي السؤال «ولا»: Naik bus atau jalan kaki? = تركب أتوبيس ولا تمشي؟
        - tetapi (في الكلام tapi) = بس / لكن: Dekat, tetapi panas = قريب، بس الجو حر.
        للاختيار استخدم atau، مش dan.
      ar: |
        - dan = و: Monas dan Masjid Istiqlal.
        - atau = أو، وفي السؤال «أم»: Naik bus atau jalan kaki؟ = أتركب الحافلة أم تمشي؟
        - tetapi (وفي العامية tapi) = لكن: Dekat, tetapi panas = قريب لكن الجو حار.
        وللتخيير atau لا dan.
      en: |
        - dan = and: Monas dan Masjid Istiqlal.
        - atau = or (also in questions): Naik bus atau jalan kaki? = Bus or on foot?
        - tetapi (casual tapi) = but: Dekat, tetapi panas = It's close, but hot.
        For a choice use atau, not dan.
    grammar: id.conjunction.basic
    examples:
      - text: Mau kopi atau teh?
        ar_eg: تشرب قهوة ولا شاي؟
        ar: أتريد قهوة أم شايًا؟
        en: Would you like coffee or tea?
  - title: Jadi = فـ / عشان كده
    body:
      ar_eg: |
        jadi = «فـ / عشان كده»، بتقول النتيجة:
        Monas jauh, jadi kita naik bus = موناس بعيد، فهنركب أتوبيس.
        وفي الشات: dn = dan، atw = atau، tp = tapi، jd = jadi.
      ar: |
        jadi = «لذلك / فـ» للنتيجة:
        Monas jauh, jadi kita naik bus = موناس بعيد، لذا سنركب الحافلة.
        وفي المحادثات: dn، atw، tp، jd.
      en: |
        jadi = so, for a result:
        Monas jauh, jadi kita naik bus = Monas is far, so we'll take the bus.
        Chat spelling: dn, atw, tp, jd.
    grammar: id.conjunction.basic
    examples:
      - text: Saya lapar, jadi saya makan dulu.
        ar_eg: أنا جعان، فهاكل الأول.
        ar: أنا جائع، لذا سآكل أولًا.
        en: I'm hungry, so I'll eat first.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jalan lurus
        ar_eg: امشي دغري
        ar: امشِ مستقيمًا
        en: go straight
      - text: belok kiri
        ar_eg: خش شمال
        ar: انعطف يسارًا
        en: turn left
      - text: lampu merah
        ar_eg: إشارة المرور
        ar: إشارة المرور
        en: traffic light
      - text: perempatan
        ar_eg: تقاطع
        ar: تقاطع
        en: crossroads
    words: [lurus, belok, lampu merah, perempatan]
  - id: e02
    type: match_pairs
    pairs:
      - text: dan
        ar_eg: و
        ar: و
        en: and
      - text: atau
        ar_eg: أو / ولا
        ar: أو / أم
        en: or
      - text: tetapi
        ar_eg: بس، لكن
        ar: لكن
        en: but
      - text: lalu
        ar_eg: وبعدين
        ar: ثم
        en: then
      - text: jadi
        ar_eg: فـ، عشان كده
        ar: لذلك
        en: so
    words: [dan, atau, tetapi, lalu, jadi]
  - id: e03
    type: multiple_choice
    question: Mau naik bus ___ jalan kaki?
    options: ["atau", "jadi", "dan"]
    answer: 0
    explain:
      ar_eg: ده اختيار، يبقى atau (ولا).
      ar: هذا تخيير، فالأداة atau.
      en: It's a choice, so atau.
    words: [atau, jalan kaki]
  - id: e04
    type: multiple_choice
    question: Monas jauh, ___ kita naik bus.
    options: ["jadi", "atau", "tetapi"]
    answer: 0
    explain:
      ar_eg: ركوب الأتوبيس نتيجة إن المكان بعيد، يبقى jadi.
      ar: ركوب الحافلة نتيجة بُعد المكان، فالأداة jadi.
      en: Taking the bus is the result of it being far → jadi.
    words: [jadi, jauh]
  - id: e05
    type: multiple_choice
    question: Museumnya dekat, ___ hari ini tutup.
    question_meaning:
      ar_eg: المتحف قريب، بس النهارده مقفول.
      ar: المتحف قريب، لكنه مغلق اليوم.
      en: The museum is close, but it's closed today.
    options: ["tetapi", "lalu", "dan"]
    answer: 0
    explain:
      ar_eg: فيه عكس في المعنى (قريب بس مقفول)، يبقى tetapi.
      ar: بين الجملتين استدراك، فالأداة tetapi.
      en: The second part contrasts with the first → tetapi.
    words: [tetapi, tutup]
  - id: e06
    type: listen
    text: Belok kanan di lampu merah.
    options: ["Belok kiri di lampu merah.", "Belok kanan di lampu merah.", "Jalan lurus di lampu merah."]
    answer: 1
    words: [belok, kanan, lampu merah]
  - id: e07
