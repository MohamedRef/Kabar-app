schema: kabar.lesson/v1
id: bipa6.u03.l01
language: id
title: Peribahasa
can_do:
  ar_eg: تفهم أمثال إندونيسية مشهورة وتعرف تقابلها بأمثالنا.
  ar: أن تفهم أمثالًا إندونيسية شهيرة وتقابلها بأمثالنا.
  en: Understand well-known Indonesian proverbs and match them to Arabic ones.
slides:
  - title: Kata orang tua-tua
    grammar: id.proverb
    body:
      ar_eg: |
        الـ peribahasa (الأمثال) كلامها ثابت وقديم شوية (tak = tidak، bagai = زي). بتبدأ بـ «Seperti kata pepatah, …» (زي ما بيقول المثل):
        - Di mana bumi dipijak, di situ langit dijunjung. = الأرض اللي بتدوس عليها، احترم سماها. زي «يا غريب كن أديب».
        - Nasi sudah menjadi bubur. = الرز بقى عصيدة: اللي حصل حصل. زي «سبق السيف العذل».
        - Air beriak tanda tak dalam. = المية اللي بتموّج مش عميقة: اللي بيتكلم كتير فاضي. زي «الطبل الفاضي صوته عالي».
        - Bagai pinang dibelah dua. = زي جوزة الفوفل اتقسمت نصين: لايقين على بعض.
        - في الشارع: ngomong = berbicara (يتكلّم)، aku / -ku = saya (أنا).
      ar: |
        الـ peribahasa (الأمثال) ثابتة اللفظ وفيها قِدم (tak = tidak، bagai = مثل). وتُقدَّم بـ «Seperti kata pepatah, …» (كما يقول المثل):
        - Di mana bumi dipijak, di situ langit dijunjung. = احترم سماء الأرض التي تطؤها، كقولنا «يا غريب كن أديبًا».
        - Nasi sudah menjadi bubur. = صار الأرزّ عصيدة، أي «سبق السيف العذل».
        - Air beriak tanda tak dalam. = الماء المتموّج ليس عميقًا، أي «الطبل الأجوف عالي الصوت».
        - Bagai pinang dibelah dua. = كجوزة الفوفل شُطرت نصفين، أي متشابهان متلائمان.
        - في كلام الشارع: ngomong = berbicara (يتكلّم)، aku / -ku = saya (أنا).
      en: |
        peribahasa (proverbs) have fixed, slightly old wording (tak = tidak, bagai = like). Introduce them with "Seperti kata pepatah, …" (as the saying goes):
        - Di mana bumi dipijak, di situ langit dijunjung. = Honour the sky of the land you stand on: when in Rome.
        - Nasi sudah menjadi bubur. = The rice has turned to porridge: what's done is done.
        - Air beriak tanda tak dalam. = Rippling water isn't deep: empty vessels make the most noise.
        - Bagai pinang dibelah dua. = Like an areca nut split in two: a perfect match.
        - On the street: ngomong = berbicara (to talk), aku / -ku = saya (I).
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: peribahasa
        ar_eg: أمثال
        ar: أمثال
        en: proverb
      - text: pepatah
        ar_eg: مثل / حكمة
        ar: مثل سائر
        en: saying, adage
      - text: bagai
        ar_eg: زي / كأنه
        ar: مثل
        en: like, as
      - text: menjunjung
        ar_eg: يرفع ويحترم
        ar: يُجلّ
        en: to uphold, to honour
      - text: bubur
        ar_eg: عصيدة
        ar: عصيدة
        en: porridge
    words: [peribahasa, pepatah, bagai, menjunjung, bubur]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي مثل إندونيسي بيقابل «يا غريب كن أديب»؟
      ar: أيّ مثل إندونيسي يقابل «يا غريب كن أديبًا»؟
      en: Which Indonesian proverb matches "when in Rome, do as the Romans do"?
    options:
      - Nasi sudah menjadi bubur.
      - Di mana bumi dipijak, di situ langit dijunjung.
      - Bagai pinang dibelah dua.
    answer: 1
    words: [menjunjung, peribahasa]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إمتى تقول «Nasi sudah menjadi bubur»؟
      ar: متى تقول «Nasi sudah menjadi bubur»؟
      en: When do you say "Nasi sudah menjadi bubur"?
    options:
      - لما الأكل يبقى حلو.
      - لما تكون جعان.
      - لما الغلط يحصل ومفيش رجوع.
    answer: 2
    words: [bubur, pepatah]
  - id: e04
    type: fill_blank
    sentence: Mereka berdua mirip sekali, ___ pinang dibelah dua.
    meaning:
      ar_eg: الاتنين شبه بعض قوي، زي فلقة جوزة الفوفل.
      ar: يتشابهان كثيرًا، كجوزة فوفل شُطرت نصفين.
      en: The two of them look so alike, like an areca nut split in two.
    options: [bagai, bubur, pepatah]
    answers: [bagai]
    words: [bagai]
  - id: e05
    type: listen
    text: Seperti kata pepatah, air beriak tanda tak dalam.
    question:
      ar_eg: المثل ده بيتقال على مين؟
      ar: على مَن يُقال هذا المثل؟
      en: Who is this proverb said about?
    options:
      - اللي بيتكلم كتير ومعندوش حاجة.
      - اللي بيعوم كويس.
      - اللي ساكت وفاهم.
    answer: 0
    words: [pepatah, tak, peribahasa]
  - id: e06
    type: build_sentence
    source:
      ar_eg: لازم نحترم عادات المكان اللي إحنا فيه.
      ar: علينا أن نُجلّ عادات المكان الذي نحن فيه.
      en: We must honour the customs of the place we're in.
    answer: Kita harus menjunjung kebiasaan tempat kita tinggal.
    distractors: [bagai, bubur]
    words: [menjunjung]
  - id: e07
    type: translate
    direction: from_target
    source_text: Tak usah menyesal, nasi sudah menjadi bubur.
    answers_meaning:
      ar_eg:
        - ماتفضلش ندمان، اللي حصل حصل.
        - كفاية ندم، سبق السيف العذل.
      ar:
        - لا تظلّ نادمًا، فقد سبق السيف العذل.
        - كفاك ندمًا، ما حدث قد حدث.
      en:
        - Stop regretting it; what's done is done.
        - Don't keep regretting; the rice is already porridge.
    words: [bubur, tak]
  - id: e08
    type: speaking
    text: Seperti kata pepatah, di mana bumi dipijak, di situ langit dijunjung.
    meaning:
      ar_eg: زي ما بيقول المثل، يا غريب كن أديب.
      ar: كما يقول المثل، يا غريب كن أديبًا.
      en: As the saying goes, when in Rome, do as the Romans do.
    words: [pepatah, menjunjung]
  - id: e09
    type: dictation
    text: Air beriak tanda tak dalam.
    meaning:
      ar_eg: المية اللي بتعمل موج مش عميقة (اللي بيتكلم كتير معندوش حاجة).
      ar: الماء المتموّج ليس عميقًا (كثير الكلام قليل العلم).
      en: Rippling water isn't deep (big talk, little substance).
    words: [tak, pepatah]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: في «bagai pinang dibelah dua»، bagai معناها إيه؟
      ar: ما معنى bagai في «bagai pinang dibelah dua»؟
      en: In "bagai pinang dibelah dua", what does bagai mean?
    options: [تحت, بعد, زي]
    answer: 2
    words: [bagai]
dialogue:
  title: Di Jam Gadang
  lines:
    - speaker: Uda Rafi
      text: Selamat datang di Bukittinggi, Mohamed. Di sini orang suka ngomong pakai peribahasa.
      ar_eg: أهلًا بيك في بوكيتينجي يا محمد. هنا الناس بتحب تتكلم بالأمثال.
      ar: مرحبًا بك في بوكيتينغي يا محمد. يحبّ الناس هنا الكلام بالأمثال.
      en: Welcome to Bukittinggi, Mohamed. People here love to talk in proverbs.
    - speaker: Mohamed
      text: Aku tahu satu, Uda. Di mana bumi dipijak, di situ langit dijunjung.
      ar_eg: أنا عارف واحد يا أودا. يا غريب كن أديب.
      ar: أعرف واحدًا. يا غريب كن أديبًا.
      en: I know one, Uda. When in Rome, do as the Romans do.
    - speaker: Uda Rafi
      text: Bagus! Jadi nanti di rumah gadang, kamu harus ikut adat Minang, ya.
      ar_eg: حلو! يبقى في البيت الكبير بعدين، لازم تمشي على عادات المينانج.
      ar: جميل! إذن عليك في الرومة غادانغ أن تتّبع عادات المينانغ.
      en: Good! So at the rumah gadang later, you'll follow Minang custom.
    - speaker: Mohamed
      text: Pasti. Di Mesir kami bilang, "Ya gharib, kun adib."
      ar_eg: أكيد. في مصر بنقول «يا غريب كن أديب».
      ar: بالتأكيد. نقول في مصر «يا غريب كن أديبًا».
      en: Of course. In Egypt we say, "Stranger, be courteous."
