schema: kabar.lesson/v1
id: bipa2.u02.l01
language: id
title: Penulis, pelukis, penari
can_do:
  ar_eg: تسمّي الناس بشغلهم بـ peN-.
  ar: أن تسمي الناس بحسب عملهم بـ peN-.
  en: Name people by what they do with peN-.
slides:
  - title: peN- = فاعل
    body:
      ar_eg: |
        فاكر meN- (membaca، menulis)؟ لو غيّرت me لـ pe هتاخد «الشخص اللي بيعمل كده»، زي وزن «فاعل» عندنا:
        menulis (بيكتب) → penulis (كاتب)
        membaca (بيقرا) → pembaca (قارئ)
        melukis (بيرسم) → pelukis (رسّام)
      ar: |
        أتذكر meN- (membaca، menulis)؟ إذا أبدلت me بـ pe حصلت على «من يقوم بالفعل»، كوزن «فاعل» في العربية:
        menulis → penulis (كاتب)
        membaca → pembaca (قارئ)
        melukis → pelukis (رسّام)
      en: |
        Remember meN- (membaca, menulis)? Swap me for pe and you get "the person who does it" — like the Arabic فاعل pattern:
        menulis (writes) → penulis (writer)
        membaca (reads) → pembaca (reader)
        melukis (paints) → pelukis (painter)
    grammar: id.prefix.peng.agent
    examples:
      - text: Penulis buku ini orang Bali.
        ar_eg: كاتب الكتاب ده من بالي.
        ar: مؤلف هذا الكتاب من بالي.
        en: The author of this book is Balinese.
      - text: Pelukis itu tinggal di Ubud.
        ar_eg: الرسام ده ساكن في أوبود.
        ar: ذلك الرسام يسكن في أوبود.
        en: That painter lives in Ubud.
  - title: Sama seperti meN-
    body:
      ar_eg: |
        نفس تغييرات الأصوات بتاعة meN- بالظبط:
        - pe- قبل l, r, m, n, ny: lukis → pelukis، nyanyi → penyanyi (مغني)
        - pem- قبل b, p (p بتقع): baca → pembaca، pandu → pemandu (مرشد)
        - pen- قبل t, d, c, j (t بتقع): tulis → penulis، tari → penari (راقص)، jual → penjual (بيّاع)
        - peng- قبل k, g, h وحروف العلة (k بتقع): kunjung → pengunjung (زائر)
      ar: |
        التغيرات الصوتية نفسها التي في meN-:
        - pe- قبل l, r, m, n, ny: pelukis، penyanyi (مغنٍّ)
        - pem- قبل b, p (وتسقط p): pembaca، pemandu (مرشد)
        - pen- قبل t, d, c, j (وتسقط t): penulis، penari (راقص)، penjual (بائع)
        - peng- قبل k, g, h وأحرف العلة (وتسقط k): pengunjung (زائر)
      en: |
        Exactly the same sound changes as meN-:
        - pe- before l, r, m, n, ny: pelukis, penyanyi (singer)
        - pem- before b, p (p drops): pembaca, pemandu (guide)
        - pen- before t, d, c, j (t drops): penulis, penari (dancer), penjual (seller)
        - peng- before k, g, h and vowels (k drops): pengunjung (visitor)
    grammar: id.prefix.peng.agent
    examples:
      - text: Mas Rizal pemandu wisata di Ubud.
        ar_eg: ماس ريزال مرشد سياحي في أوبود.
        ar: ماس ريزال مرشد سياحي في أوبود.
        en: Mas Rizal is a tour guide in Ubud.
      - text: Penari itu cantik sekali.
        ar_eg: الراقصة دي حلوة أوي.
        ar: تلك الراقصة جميلة جدًا.
        en: That dancer is very beautiful.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: penulis
        ar_eg: كاتب
        ar: كاتب
        en: writer
      - text: pelukis
        ar_eg: رسّام
        ar: رسّام
        en: painter
      - text: penari
        ar_eg: راقص
        ar: راقص
        en: dancer
      - text: pedagang
        ar_eg: تاجر
        ar: تاجر
        en: trader
      - text: petani
        ar_eg: فلاح
        ar: مزارع
        en: farmer
    words: [penulis, pelukis, penari, pedagang, petani]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: membaca = بيقرا. القارئ اسمه إيه؟
      ar: membaca = يقرأ. ما اسم القارئ؟
      en: membaca = to read. What is a reader?
    options: [pebaca, penbaca, pembaca]
    answer: 2
    words: [pembaca]
  - id: e03
    type: fill_blank
    sentence: Orang yang menulis buku adalah ___.
    meaning:
      ar_eg: الشخص اللي بيكتب كتب اسمه كاتب.
      ar: من يكتب الكتب يُسمّى كاتبًا.
      en: A person who writes books is a writer.
    options: [petulis, menulis, penulis]
    answers: [penulis]
    explain:
      ar_eg: 'زي menulis: t بتقع وتبقى pen-.'
      ar: 'كما في menulis: تسقط t وتصير pen-.'
      en: As in menulis, t drops and it becomes pen-.
    words: [penulis]
  - id: e04
    type: fill_blank
    sentence: Orang yang melukis adalah ___.
    meaning:
      ar_eg: (اكتب الكلمة) الشخص اللي بيرسم اسمه رسّام.
      ar: (اكتب الكلمة) من يرسم يُسمّى رسّامًا.
      en: (Type the word.) A person who paints is a painter.
    answers: [pelukis]
    words: [pelukis]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هي مغنية.
      ar: هي مغنّية.
      en: She is a singer.
    answers: [Dia penyanyi., Dia penyanyi, Dia seorang penyanyi., Dia adalah penyanyi., Ia penyanyi.]
    words: [penyanyi]
  - id: e06
    type: dictation
    text: Pelukis itu tinggal di Ubud.
    meaning:
      ar_eg: الرسام ده ساكن في أوبود.
      ar: ذلك الرسام يسكن في أوبود.
      en: That painter lives in Ubud.
    words: [pelukis]
  - id: e07
    type: speaking
    text: Kakak saya penari, dan adik saya pelukis.
    meaning:
      ar_eg: أختي الكبيرة راقصة، وأخويا الصغير رسام.
      ar: أختي الكبرى راقصة، وأخي الأصغر رسّام.
      en: My older sister is a dancer, and my younger brother is a painter.
    words: [penari, pelukis]
dialogue:
  lines:
    - speaker: Mohamed
      text: Rina, siapa penulis buku ini?
      ar_eg: رينا، مين كاتب الكتاب ده؟
      ar: رينا، من كاتب هذا الكتاب؟
      en: Rina, who's the author of this book?
    - speaker: Rina
      text: Penulisnya orang Bali. Dia juga pelukis.
      ar_eg: الكاتب من بالي. وهو رسام كمان.
      ar: الكاتب من بالي. وهو رسام أيضًا.
      en: The author is Balinese. He's a painter too.
    - speaker: Mohamed
      text: Wah! Lukisannya bagus?
      ar_eg: الله! لوحاته حلوة؟
      ar: رائع! هل لوحاته جميلة؟
      en: Wow! Are his paintings good?
    - speaker: Rina
      text: Bagus sekali. Istrinya penari terkenal.
      ar_eg: حلوة قوي. ومراته راقصة مشهورة.
      ar: جميلة جدًّا. وزوجته راقصة مشهورة.
      en: Very good. His wife is a famous dancer.
