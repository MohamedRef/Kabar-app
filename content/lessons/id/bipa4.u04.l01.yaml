schema: kabar.lesson/v1
id: bipa4.u04.l01
language: id
title: Akibatnya, oleh karena itu
can_do:
  ar_eg: تربط السبب بالنتيجة في خبر (ونتيجة لكده، عشان كده).
  ar: أن تربط السبب بالنتيجة في الخبر.
  en: Link causes and effects.
slides:
  - title: Akibatnya, / Oleh karena itu,
    body:
      ar_eg: |
        إنت عارف sehingga جوه نفس الجملة. في الأخبار بنبدأ جملة جديدة بالنتيجة، وبعدها فاصلة:
        Akibatnya, = ونتيجة لكده (غالبًا حاجة وحشة)
        Oleh karena itu, = عشان كده / لذلك
        وakibat جاية من العربي «عاقبة»!
      ar: |
        عرفتَ sehingga داخل الجملة الواحدة. وفي الأخبار تبدأ النتيجة جملة جديدة تليها فاصلة:
        Akibatnya, = ونتيجةً لذلك (غالبًا لأمر سلبي)
        Oleh karena itu, = لذلك
        وakibat مأخوذة من العربية «عاقبة».
      en: |
        You know sehingga inside one sentence. News style often starts a new sentence with the effect, followed by a comma:
        Akibatnya, = as a result (usually something bad)
        Oleh karena itu, = therefore
        akibat comes from Arabic «عاقبة» (consequence)!
    grammar: id.conjunction.cause-effect
    examples:
      - text: Hujan deras turun semalaman. Akibatnya, puluhan rumah terendam.
        ar_eg: مطر جامد نزل طول الليل. ونتيجة لكده، عشرات البيوت غرقت.
        ar: هطلت أمطار غزيرة طوال الليل، ونتيجةً لذلك غمرت المياه عشرات البيوت.
        en: Heavy rain fell all night. As a result, dozens of houses were submerged.
      - text: Air sungai terus naik. Oleh karena itu, warga harus mengungsi.
        ar_eg: مية النهر بتعلى على طول. عشان كده، السكان لازم يتنقلوا لمكان أمان.
        ar: يواصل منسوب النهر الارتفاع، لذلك يجب على السكان النزوح.
        en: The river keeps rising. Therefore, residents must evacuate.
  - title: Sehingga di tengah, bukan di awal
    body:
      ar_eg: |
        sehingga ما تبدأش جملة: Jalan banjir sehingga sekolah libur. ✔
        لو بدأت جملة جديدة، استعمل Akibatnya, أو Oleh karena itu,
      ar: |
        لا يُبتدأ بـsehingga: Jalan banjir sehingga sekolah libur. ✔
        وفي أول جملة جديدة استعمل Akibatnya, أو Oleh karena itu,
      en: |
        sehingga can't start a sentence: Jalan banjir sehingga sekolah libur. ✔
        To start a new sentence, use Akibatnya, or Oleh karena itu,
    grammar: id.conjunction.cause-effect
    examples:
      - text: Tanggul sungai rusak. Akibatnya, pasar terendam.
        ar_eg: جسر النهر باظ. ونتيجة لكده، السوق غرق.
        ar: تضرر سد النهر، ونتيجةً لذلك غُمر السوق.
        en: The river levee broke. As a result, the market was flooded.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: akibatnya
        ar_eg: ونتيجة لكده
        ar: ونتيجةً لذلك
        en: as a result
      - text: oleh karena itu
        ar_eg: عشان كده / لذلك
        ar: لذلك
        en: therefore
      - text: terendam
        ar_eg: غرقان في المية
        ar: مغمور بالماء
        en: submerged, flooded
      - text: mengungsi
        ar_eg: ينزح / يتنقل لمكان أمان
        ar: ينزح
        en: evacuate, take refuge
      - text: tanggul
        ar_eg: جسر / سد على النهر
        ar: سدّ / حاجز ترابي
        en: levee, embankment
      - text: deras
        ar_eg: جامد / غزير (مطر، تيار)
        ar: غزير / جارف
        en: heavy, torrential
    words: [akibatnya, oleh karena itu, terendam, mengungsi, tanggul, deras]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which is correct?
    options: ["Jalan banjir. Sehingga sekolah libur.", "Jalan banjir. Akibatnya, sekolah libur.", "Sekolah libur. Akibatnya, jalan banjir."]
    answer: 1
    explain:
      ar_eg: sehingga ما تبدأش جملة. Akibatnya بتبدأ جملة جديدة وبعدها فاصلة، والنتيجة تيجي بعدها مش السبب.
      ar: لا يُبتدأ بـsehingga، وAkibatnya تبدأ جملة جديدة تليها فاصلة، ويأتي بعدها الأثر لا السبب.
      en: sehingga can't start a sentence; Akibatnya starts a new one, followed by a comma, and the effect comes after it, not the cause.
    words: [akibatnya]
  - id: e03
    type: listen
    text: Hujan deras turun semalaman. Akibatnya, puluhan rumah terendam.
    options: ["Hujan deras turun semalaman. Oleh karena itu, puluhan rumah terendam.", "Hujan deras turun seminggu. Akibatnya, puluhan rumah terendam.", "Hujan deras turun semalaman. Akibatnya, puluhan rumah terendam."]
    answer: 2
    meaning:
      ar_eg: مطر جامد نزل طول الليل. ونتيجة لكده، عشرات البيوت غرقت.
      ar: هطلت أمطار غزيرة طوال الليل، ونتيجةً لذلك غُمرت عشرات البيوت.
      en: Heavy rain fell all night. As a result, dozens of houses were submerged.
    words: [deras, akibatnya, terendam]
  - id: e04
    type: multiple_choice
    question: Air sungai terus naik. ___, warga harus mengungsi.
    question_meaning:
      ar_eg: مية النهر بتعلى على طول. …، السكان لازم ينزحوا.
      ar: يواصل منسوب النهر الارتفاع. …، يجب أن ينزح السكان.
      en: The river keeps rising. …, residents must evacuate.
    options: ["Oleh karena itu", "Sehingga", "Karena"]
    answer: 0
    explain:
      ar_eg: جملة جديدة فيها نتيجة = Oleh karena itu. Karena للسبب مش للنتيجة.
      ar: النتيجة في جملة جديدة = Oleh karena itu، وKarena للسبب لا للنتيجة.
      en: A result in a new sentence = Oleh karena itu; Karena introduces a cause, not a result.
    words: [oleh karena itu, mengungsi]
  - id: e05
    type: fill_blank
    sentence: Pemerintah daerah membangun ___ baru di tepi sungai.
    meaning:
      ar_eg: الحكومة المحلية بتبني سد جديد على شط النهر.
      ar: تبني الحكومة المحلية سدًّا ترابيًا جديدًا على ضفة النهر.
      en: The local government is building a new levee on the riverbank.
    options: [tanggul, akibatnya, terendam]
    answers: [tanggul]
    words: [tanggul]
  - id: e06
    type: build_sentence
    source:
      ar_eg: عشان كده، السكان لازم ينزحوا.
      ar: لذلك يجب أن ينزح السكان.
      en: Therefore, the residents must evacuate.
    answer: Oleh karena itu, warga harus mengungsi.
    distractors: [sehingga, akibat]
    words: [oleh karena itu, mengungsi]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: المطر نزل جامد. ونتيجة لكده، بيوت كتير غرقت.
      ar: هطل المطر بغزارة، ونتيجةً لذلك غُمرت بيوت كثيرة.
      en: The rain was heavy. As a result, many houses were submerged.
    answers:
      - Hujan turun dengan deras. Akibatnya, banyak rumah terendam.
      - Hujannya deras. Akibatnya, banyak rumah terendam.
      - Hujan sangat deras. Akibatnya, banyak rumah terendam.
      - Hujan turun deras. Akibatnya, banyak rumah terendam.
      - Hujan deras turun. Akibatnya, banyak rumah terendam.
      - Hujan turun dengan deras. Akibatnya, banyak rumah terendam air.
      - Hujan turun dengan deras sehingga banyak rumah terendam.
    words: [deras, akibatnya, terendam]
  - id: e08
    type: speaking
    text: Tanggul di dekat pasar rusak. Oleh karena itu, pemerintah harus segera memperbaikinya.
    meaning:
      ar_eg: السد اللي جنب السوق باظ. عشان كده، الحكومة لازم تصلحه حالًا.
      ar: تضرر السد قرب السوق، لذلك يجب على الحكومة إصلاحه فورًا.
      en: The levee near the market is damaged. Therefore, the government must repair it immediately.
    words: [tanggul, oleh karena itu]
dialogue:
  title: Di ruang redaksi Parepare
  lines:
    - speaker: Kak Nirmala
      text: Mohamed, ada berita banjir dari pinggir kota.
      ar_eg: يا محمد، فيه خبر عن فيضان من أطراف المدينة.
      ar: يا محمد، وصل خبر عن فيضان في أطراف المدينة.
      en: Mohamed, there's news of a flood on the edge of town.
    - speaker: Mohamed
      text: Apa yang terjadi, Kak?
      ar_eg: إيه اللي حصل؟
      ar: ماذا حدث؟
      en: What happened?
    - speaker: Kak Nirmala
      text: Hujan deras turun semalaman, dan tanggul sungai rusak.
      ar_eg: مطر جامد نزل طول الليل، وسد النهر باظ.
      ar: هطلت أمطار غزيرة طوال الليل، وتضرر سد النهر.
      en: Heavy rain fell all night, and the river levee broke.
    - speaker: Mohamed
      text: Akibatnya, rumah-rumah terendam?
      ar_eg: ونتيجة لكده، البيوت غرقت؟
      ar: ونتيجةً لذلك غُمرت البيوت؟
      en: And as a result, houses were flooded?
    - speaker: Kak Nirmala
      text: Ya, puluhan rumah. Oleh karena itu, warga mengungsi ke masjid.
      ar_eg: أيوه، عشرات البيوت. عشان كده، الناس نزحوا للجامع.
      ar: نعم، عشرات البيوت، لذلك نزح السكان إلى المسجد.
      en: Yes, dozens. Therefore, residents took refuge in the mosque.
