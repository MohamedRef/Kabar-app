        en: rice field (ngoko)
      - text: sabin
        ar_eg: غيط رز (كراما)
        ar: حقل أرز (كراما)
        en: rice field (krama)
      - text: lepen
        ar_eg: نهر (كراما)
        ar: نهر (كراما)
        en: river (krama)
      - text: petani
        ar_eg: فلاح
        ar: فلاح
        en: farmer
    words: [sawah, sabin, lepen, petani]
  - id: e02
    type: match_pairs
    pairs:
