    words: [godhong, jawah, petani, sawah]
dialogue:
  lines:
    - speaker: Pak Wiryo
      text: Mas Mohamed, menika sabin kula.
      ar_eg: يا أستاذ محمد، ده غيطي.
      ar: يا محمد، هذا حقلي.
      en: Mohamed, this is my rice field.
    - speaker: Mohamed
      text: Wah, sae sanget! Panjenengan petani, Pak?
      ar_eg: الله، حلو أوي! حضرتك فلاح يا عم؟
      ar: ما أجمله! هل أنت فلاح يا سيدي؟
      en: Wow, how lovely! Are you a farmer, sir?
    - speaker: Pak Wiryo
      text: Inggih. Saben enjing kula dhateng sabin, lajeng dhateng lepen.
      ar_eg: أيوه. كل يوم الصبح بروح الغيط، وبعدين النهر.
      ar: نعم. كل صباح أذهب إلى الحقل ثم إلى النهر.
      en: Yes. Every morning I go to the field, then to the river.
    - speaker: Mohamed
      text: Pak, jawah!
      ar_eg: يا عم، بتمطر!
      ar: يا سيدي، إنها تمطر!
      en: Sir, it's raining!
    - speaker: Pak Wiryo
      text: Mboten menapa-menapa. Mlampah alon-alon kemawon, marginipun lunyu.
      ar_eg: ولا يهمك. امشي على مهلك بس، الطريق بيزحلق.
      ar: لا بأس. امشِ ببطء فقط، فالطريق زلق.
      en: No problem. Just walk slowly; the path is slippery.
    - speaker: Mohamed
      text: Alon-alon waton kelakon, Pak!
      ar_eg: على مهلنا، المهم نوصل يا عم!
      ar: ببطء، المهمّ أن نصل يا سيدي!
      en: Slowly, as long as we get there, sir!
