schema: kabar.lesson/v1
id: j3.u04.l05
language: jv
title: Mlampah ing sabin
can_do:
  ar_eg: 'تتمشّى في الغيطان مع فلاح: الغيط والترعة والورق والمطر بالكراما، و«على مهلك».'
  ar: 'أن تتنزّه في الحقول مع فلاح: الحقل والنهر والأوراق والمطر بالكراما، و«على مهلك».'
  en: 'Walk through the rice fields with a farmer: field, river, leaf and rain in krama, and "slowly".'
slides:
  - title: Sabin, lepen, jawah
    body:
      ar_eg: |
        في القرية:
        - sawah ← sabin = غيط رز، kali ← lepen = نهر، ترعة
        - godhong ← ron = ورقة شجر، udan ← jawah = مطر
        petani = فلاح، nandur = يزرع، watu = حجر. alon-alon = على مهلك، بالراحة.
        مثل جاوي مشهور: «Alon-alon waton kelakon» = على مهلك، المهم الحاجة تخلص.
      ar: |
        في القرية:
        - sawah ← sabin = حقل الأرز، kali ← lepen = نهر
        - godhong ← ron = ورقة شجر، udan ← jawah = مطر
        petani = فلاح، nandur = يزرع، watu = حجر. alon-alon = ببطء، على مهل.
        مثل جاوي مشهور: «Alon-alon waton kelakon» = ببطء، المهمّ أن يتمّ الأمر.
      en: |
        In the village:
        - sawah → sabin = rice field, kali → lepen = river
        - godhong → ron = leaf, udan → jawah = rain
        petani = farmer, nandur = plant, watu = stone. alon-alon = slowly, carefully.
        A famous Javanese saying: "Alon-alon waton kelakon" = slowly, as long as it gets done.
    examples:
      - text: Petani wonten sabin.
        ar_eg: الفلاح في الغيط.
        ar: الفلاح في الحقل.
        en: The farmer is in the rice field.
      - text: Jawah, mangga mlampah alon-alon.
        ar_eg: بتمطر، امشي على مهلك.
        ar: إنها تمطر، امشِ ببطء.
        en: It's raining; please walk slowly.
      - text: Alon-alon waton kelakon.
        ar_eg: على مهلك، المهم توصل.
        ar: ببطء، المهمّ أن يتمّ الأمر.
        en: Slowly, as long as it gets done.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nandur
        ar_eg: يزرع
        ar: يزرع
        en: plant
      - text: sabin
        ar_eg: غيط رز (كراما)
        ar: حقل أرز (كراما)
        en: rice field (krama)
      - text: lepen
        ar_eg: نهر (كراما)
        ar: نهر (كراما)
        en: river (krama)
      - text: petani
        ar_eg: فلاح
        ar: فلاح
        en: farmer
    words: [nandur, sabin, lepen, petani]
  - id: e02
    type: match_pairs
    pairs:
      - text: watu
        ar_eg: حجر
        ar: حجر
        en: stone
      - text: ron
        ar_eg: ورقة شجر (كراما)
        ar: ورقة شجر (كراما)
        en: leaf (krama)
      - text: jawah
        ar_eg: مطر (كراما)
        ar: مطر (كراما)
        en: rain (krama)
      - text: alon-alon
        ar_eg: على مهلك
        ar: ببطء
        en: slowly
    words: [watu, ron, jawah, alon-alon]
  - id: e03
    type: listen
    text: Jawah, mangga mlampah alon-alon.
    question:
      ar_eg: بيقولّه إيه؟
      ar: ماذا يقول له؟
      en: What does he tell him?
    options: [الجو حر، اجري, بتمطر، امشي على مهلك, الطريق فاضي، يلا]
    answer: 1
    meaning:
      ar_eg: بتمطر، امشي على مهلك.
      ar: إنها تمطر، امشِ ببطء.
      en: It's raining; please walk slowly.
    words: [jawah, alon-alon]
  - id: e04
    type: fill_blank
    sentence: Saben enjing Pak Wiryo ___ ing sabin.
    meaning:
      ar_eg: كل يوم الصبح عم ويريو ___ في الغيط.
      ar: كل صباح ___ العم ويريو في الحقل.
      en: Every morning Pak Wiryo ___ in the rice field.
    options: [nandur, ron, jawah]
    answers: [nandur]
    words: [nandur, ron, jawah, sabin]
    explain:
      ar_eg: nandur = يزرع، والفلاح بيزرع في الغيط. ron = ورقة شجر، وjawah = مطر.
      ar: nandur تعني يزرع، والفلاح يزرع في الحقل. أما ron فورقة شجر، وjawah مطر.
      en: nandur is "plant", what a farmer does in the field. ron is "leaf", and jawah is "rain".
  - id: e05
    type: multiple_choice
    question: Udan (ngoko) → ___ (krama)
    options: [watu, jawah, sabin]
    answer: 1
    explain:
      ar_eg: udan ← jawah = مطر.
      ar: udan ← jawah = مطر.
      en: udan → jawah = rain.
    words: [jawah, watu, sabin]
  - id: e06
    type: fill_blank
    sentence: Ing krama, godhong dados ___.
    meaning:
      ar_eg: بالكراما godhong بتبقى ___.
      ar: في الكراما تصبح godhong ___.
      en: In krama, godhong becomes ___.
    options: [ron, lepen, watu]
    answers: [ron]
    words: [ron, godhong, lepen, watu]
    explain:
      ar_eg: godhong = ورقة شجر، والكراما ron. lepen = نهر، وwatu = حجر.
      ar: godhong تعني ورقة الشجر، ونظيرها في الكراما ron. أما lepen فنهر، وwatu حجر.
      en: godhong is "leaf", and its krama is ron. lepen is "river", and watu is "stone".
  - id: e07
    type: build_sentence
    source:
      ar_eg: الفلاح بيزرع في الغيط.
      ar: يزرع الفلاح في الحقل.
      en: The farmer is planting in the rice field.
    answer: Petani nandur ing sabin.
    distractors: [lepen, ron]
    words: [petani, nandur, sabin]
    explain:
      ar_eg: nandur = يزرع، وing sabin = في الغيط. lepen = نهر، وron = ورقة شجر.
      ar: nandur تعني يزرع، وing sabin في الحقل. أما lepen فنهر، وron ورقة شجر.
      en: nandur is "plant", ing sabin "in the rice field". lepen is "river", and ron is "leaf".
  - id: e08
    type: translate
    direction: from_target
    source_text: Lare-lare dolanan ing pinggir lepen.
    answers_meaning:
      ar_eg: [العيال بيلعبوا على جنب النهر, العيال بيلعبوا جنب الترعة]
      ar: [الأطفال يلعبون على ضفة النهر]
      en: [The children are playing by the river, Kids are playing on the riverbank]
    words: [lepen]
  - id: e09
    type: speaking
    text: Alon-alon waton kelakon.
    meaning:
      ar_eg: على مهلك، المهم توصل.
      ar: ببطء، المهمّ أن يتمّ الأمر.
      en: Slowly, as long as it gets done.
    words: [alon-alon]
  - id: e10
    type: multiple_choice
    question: Wedhus mangan ___ ing pinggir sawah.
    options: [jawah, godhong, petani]
    answer: 1
    explain:
      ar_eg: godhong = ورق الشجر (وبالكراما ron).
      ar: godhong = أوراق الشجر (وبالكراما ron).
      en: godhong = leaves (krama ron).
    words: [godhong, jawah, petani, sawah]
dialogue:
  lines:
    - speaker: Pak Wiryo
      text: "Mas Mohamed, niki sabin kula."
      ar_eg: "يا أستاذ محمد، ده غيطي."
      ar: "يا محمد، هذا حقلي."
      en: "Mohamed, this is my rice field."
    - speaker: Mohamed
      text: Wah, sae sanget! Panjenengan petani, Pak?
      ar_eg: الله، حلو أوي! حضرتك فلاح يا عم؟
      ar: ما أجمله! هل أنت فلاح يا سيدي؟
      en: Wow, how lovely! Are you a farmer, sir?
    - speaker: Pak Wiryo
      text: "Inggih. Saben enjing kula dhateng sabin kaliyan lepen."
      ar_eg: "أيوه. كل يوم الصبح بروح الغيط والنهر."
      ar: "نعم. كل صباح أذهب إلى الحقل والنهر."
      en: "Yes. Every morning I go to the field and the river."
    - speaker: Mohamed
      text: Pak, jawah!
      ar_eg: يا عم، بتمطر!
      ar: يا سيدي، إنها تمطر!
      en: Sir, it's raining!
    - speaker: Pak Wiryo
      text: "Mboten napa-napa. Alon-alon mawon, margine teles."
      ar_eg: "ولا يهمك. على مهلك بس، الطريق مبلول."
      ar: "لا بأس. على مهلك فقط، الطريق مبلول."
      en: "No problem. Just go slowly; the path's wet."
    - speaker: Mohamed
      text: "Inggih, Pak, alon-alon mawon!"
      ar_eg: "حاضر يا أستاذ، على مهلنا!"
      ar: "حسنًا يا سيدي، على مهلنا!"
      en: "All right, sir, nice and slow!"
new_words:
  - word: nandur
    pos: verb
    ar_eg: يزرع
    ar: يزرع
    en: plant (= menanam)
  - word: sabin
    pos: noun
    ar_eg: غيط رز (sawah ← sabin)، كراما
    ar: حقل أرز (sawah ← sabin)، كراما
    en: rice field (ngoko sawah), krama
  - word: lepen
    pos: noun
    ar_eg: نهر، ترعة (kali ← lepen)، كراما
    ar: نهر (kali ← lepen)، كراما
    en: river (ngoko kali, Indonesian sungai), krama
  - word: petani
    pos: noun
    ar_eg: فلاح
    ar: فلاح
    en: farmer (= petani)
  - word: watu
    pos: noun
    ar_eg: حجر
    ar: حجر
    en: stone (= batu)
  - word: ron
    pos: noun
    ar_eg: ورقة شجر (godhong ← ron)، كراما
    ar: ورقة شجر (godhong ← ron)، كراما
    en: leaf (ngoko godhong, Indonesian daun), krama
  - word: jawah
    pos: noun
    ar_eg: مطر (udan ← jawah)، كراما
    ar: مطر (udan ← jawah)، كراما
    en: rain (ngoko udan, Indonesian hujan), krama
  - word: alon-alon
    pos: adverb
    ar_eg: على مهلك، بالراحة
    ar: ببطء، على مهل
    en: slowly, carefully (= pelan-pelan)
review:
