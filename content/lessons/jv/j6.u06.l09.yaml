schema: kabar.lesson/v1
id: j6.u06.l09
language: jv
title: Aturan ing masjid
can_do:
  ar_eg: تقرا قواعد الجامع بالبيجون، وتعرف الكلمات العربية اللي فيها.
  ar: أن تقرأ قواعد المسجد بالبيجون وتتعرّف الألفاظ العربية فيها.
  en: Read mosque rules in Pegon and spot the Arabic loanwords.
slides:
  - title: Papan aturan
    body:
      ar_eg: |
        على حيطة جامع البيسانترين فيه لوحة قواعد بالبيجون.
        الكلمات العربية (صلاة، وضوء، مسجد) بتفضل بكتابتها العربية. والكلمات الجاوي بتتكتب بالحروف مع الحركات كحروف: سادوروڠي = sadurunge، ڎيسيك = dhisik.
        كلمة جديدة: sadurunge = قبل.
      ar: |
        على جدار مسجد البيسانترين لوح قواعد بالبيجون.
        تبقى الألفاظ العربية (صلاة، وضوء، مسجد) بكتابتها العربية، وتُكتب الكلمات الجاوية بالحروف مع الحركات حروفًا: سادوروڠي = sadurunge، ڎيسيك = dhisik.
        كلمة جديدة: sadurunge = قبل.
      en: |
        On the wall of the pesantren mosque there's a board of rules in Pegon.
        Arabic words (صلاة, وضوء, مسجد) keep their Arabic spelling. Javanese words have their vowels written as letters: سادوروڠي = sadurunge, ڎيسيك = dhisik.
        New word: sadurunge = before.
    grammar: jv.pegon.basics
    examples:
      - text: سادوروڠي صلاة، وضوء ڎيسيك. (Sadurunge salat, wudhu dhisik.)
        ar_eg: قبل الصلاة، اتوضّى الأول.
        ar: قبل الصلاة، توضّأ أولًا.
        en: Before prayer, do wudhu first.
      - text: اجا رامي ايڠ مسجد. (Aja rame ing masjid.)
        ar_eg: ماتعملش دوشة في الجامع.
        ar: لا تُحدث ضجيجًا في المسجد.
        en: Don't be noisy in the mosque.
      - text: سانڎال ديچوڤوت ايڠ نجابا. (Sandhal dicopot ing njaba.)
        ar_eg: الصندل يتقلع برّه.
        ar: يُخلع الصندل في الخارج.
        en: Sandals come off outside.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: تعمل إيه قبل الصلاة؟
      ar: ماذا تفعل قبل الصلاة؟
      en: What do you do before prayer?
    options: [wudhu, mangan, turu]
    answer: 0
    words: [sadurunge]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: تقلع الصندل فين؟
      ar: أين تخلع الصندل؟
      en: Where do the sandals come off?
    options: [ing mburi, ing njero, ing njaba]
    answer: 2
    explain:
      ar_eg: ايڠ نجابا = ing njaba (برّه).
      ar: ايڠ نجابا = ing njaba (في الخارج).
      en: ايڠ نجابا = ing njaba (outside).
  - id: e03
    type: listen
    text: Aja rame ing masjid.
    question:
      ar_eg: سمعت أنهي قاعدة؟
      ar: أي قاعدة سمعت؟
      en: Which rule did you hear?
    options: [سادوروڠي صلاة، وضوء ڎيسيك, اجا رامي ايڠ مسجد, سانڎال ديچوڤوت ايڠ نجابا]
    answer: 1
    meaning:
      ar_eg: ماتعملش دوشة في الجامع.
      ar: لا تُحدث ضجيجًا في المسجد.
      en: Don't be noisy in the mosque.
  - id: e04
    type: match_pairs
    pairs:
      - text: سادوروڠي
        ar_eg: sadurunge — قبل
        ar: sadurunge — قبل
        en: sadurunge — before
      - text: ڎيسيك
        ar_eg: dhisik — الأول
        ar: dhisik — أولًا
        en: dhisik — first
      - text: نجابا
        ar_eg: njaba — برّه
        ar: njaba — الخارج
        en: njaba — outside
      - text: رامي
        ar_eg: rame — دوشة
        ar: rame — ضجيج
        en: rame — noisy
    words: [sadurunge, ڎ]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة في اللوحة مكتوبة بالعربي زي ما هي؟
      ar: أي كلمة في اللوح مكتوبة بالعربية كما هي؟
      en: Which word on the board keeps its Arabic spelling?
    options: [سادوروڠي, وضوء, ڎيسيك]
    answer: 1
    explain:
      ar_eg: wudhu كلمة عربية، فبتتكتب وضوء زي العربي. سادوروڠي وڎيسيك كلمات جاوي.
      ar: wudhu لفظ عربي فيُكتب وضوء كالعربية، أما سادوروڠي وڎيسيك فجاويتان.
      en: wudhu is an Arabic word, so it's written وضوء as in Arabic. سادوروڠي and ڎيسيك are Javanese.
    words: [pegon]
  - id: e06
    type: fill_blank
    sentence: سادوروڠي = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: قبل)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: قبل)"
      en: Type the reading in Latin letters. (It means "before".)
    answers: [sadurunge]
    words: [sadurunge, ڠ]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: سادوروڠي صلاة، وضوء ڎيسيك"
      ar: "اكتب بالحروف اللاتينية: سادوروڠي صلاة، وضوء ڎيسيك"
      en: "Write in Latin letters: سادوروڠي صلاة، وضوء ڎيسيك"
    answers: ["Sadurunge salat, wudhu dhisik.", sadurunge salat wudhu dhisik, sadurunge sholat wudhu dhisik]
    words: [sadurunge, ڎ]
  - id: e08
    type: build_sentence
    source:
      ar_eg: قبل ما تصلي في الجامع، اقلع الصندل.
      ar: قبل الصلاة في المسجد، اخلع الصندل.
      en: Before praying in the mosque, take off your sandals.
    answer: Sadurunge sholat ing masjid, sandhal dicopot.
    distractors: [njaba]
    words: [sadurunge]
  - id: e09
    type: speaking
    text: Sadurunge salat, wudhu dhisik.
    meaning:
      ar_eg: قبل الصلاة، اتوضّى الأول.
      ar: قبل الصلاة، توضّأ أولًا.
      en: Before prayer, do wudhu first.
    words: [sadurunge]
dialogue:
  title: Sadurunge Asar
  lines:
    - speaker: Ali
      text: Mas, sadurunge Asar, ayo wudhu dhisik.
      ar_eg: يا محمد، قبل العصر، يلا نتوضّى الأول.
      ar: يا محمد، قبل العصر، هيا نتوضّأ أولًا.
      en: Mas, before Asr, let's do wudhu first.
    - speaker: Mohamed
      text: Iya. Aku wis maca aturan ing tembok.
      ar_eg: ماشي. أنا قريت القواعد اللي على الحيطة.
      ar: حسنًا. قرأتُ القواعد على الجدار.
      en: OK. I've read the rules on the wall.
    - speaker: Ali
      text: Kabeh nganggo Pegon. Isa maca?
      ar_eg: كلها بالبيجون. عرفت تقراها؟
      ar: كلها بالبيجون. هل استطعت قراءتها؟
      en: It's all in Pegon. Could you read it?
    - speaker: Mohamed
      text: Isa. Sandhal dicopot ing njaba, ta?
      ar_eg: أيوه. الصندل يتقلع برّه، صح؟
      ar: نعم. يُخلع الصندل في الخارج، أليس كذلك؟
      en: Yes. Sandals off outside, right?
