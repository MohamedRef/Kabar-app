schema: kabar.lesson/v1
id: j6.u06.l09
language: jv
title: Jadwal pesantren
can_do:
  ar_eg: تقرا جدول البيسانترين مكتوب بالبيجون.
  ar: أن تقرأ جدول البيسانترين مكتوبًا بالبيجون.
  en: Read a pesantren timetable written in Pegon.
slides:
  - title: Papan ing pesantren
    body:
      ar_eg: |
        على باب البيسانترين في Plered فيه لوحة بالبيجون. افتكر: a = ا، وi أو é = ي، وu أو o = و.
        sore = سوري (o بـ و، وé بـ ي) · guru = ڮورو (ڮ = g) · kanggo = كاڠڮو (ڠ = ng).
        كلمة جديدة: santri = طالب في البيسانترين.
      ar: |
        على باب البيسانترين في Plered لوح بالبيجون. تذكّر: a = ا، وi أو é = ي، وu أو o = و.
        sore = سوري (o بـ و، وé بـ ي) · guru = ڮورو (ڮ = g) · kanggo = كاڠڮو (ڠ = ng).
        كلمة جديدة: santri = طالب في البيسانترين.
      en: |
        On the pesantren door in Plered there's a board in Pegon. Remember: a = ا, i or é = ي, u or o = و.
        sore = سوري (o with و, é with ي) · guru = ڮورو (ڮ = g) · kanggo = كاڠڮو (ڠ = ng).
        New word: santri = a pesantren student.
    grammar: jv.pegon.basics
    examples:
      - text: "ڠاجي كتاب: سوري (ngaji kitab: sore)"
        ar_eg: "دراسة الكتب: العصر"
        ar: "دراسة الكتب: عصرًا"
        en: "Kitab study: afternoons"
      - text: "ڮورو: ڮوس حنيف (guru: Gus Hanif)"
        ar_eg: "المدرّس: Gus Hanif"
        ar: "المعلّم: Gus Hanif"
        en: "Teacher: Gus Hanif"
      - text: كاڠڮو ساكابيهي سانتري (kanggo sakabehe santri)
        ar_eg: لكل الطلبة
        ar: لجميع الطلاب
        en: for all students
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: اللوحة عن أنهي نشاط؟
      ar: عن أي نشاط يتحدث اللوح؟
      en: Which activity is the board about?
    options: [ngaji kitab, kerja bakti, pengajian ing pasar]
    answer: 0
    words: [ڠ]
    explain:
      ar_eg: "اللوحة: ڠاجي كتاب = ngaji kitab."
      ar: "اللوحة: ڠاجي كتاب = ngaji kitab."
      en: "The board says ڠاجي كتاب: ngaji kitab."
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الدرس إمتى؟
      ar: متى الدرس؟
      en: When is the class?
    options: [esuk, sore, bengi]
    answer: 1
    explain:
      ar_eg: "سوري = sore: س + و (o) + ر + ي (é)."
      ar: "سوري = sore: س + و (o) + ر + ي (é)."
      en: "سوري = sore: س + و (o) + ر + ي (é)."
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: مين المدرّس؟
      ar: من المعلّم؟
      en: Who teaches?
    options: [Pak Harjo, Gus Hanif, Bu Dewi]
    answer: 1
    explain:
      ar_eg: ڮوس حنيف = Gus Hanif. الاسم العربي حنيف بيفضل بكتابته العربية.
      ar: ڮوس حنيف = Gus Hanif، ويبقى الاسم العربي حنيف بكتابته العربية.
      en: ڮوس حنيف = Gus Hanif. The Arabic name حنيف keeps its Arabic spelling.
    words: [ڮ]
  - id: e04
    type: listen
    text: Kanggo sakabehe santri.
    question:
      ar_eg: الدرس لمين؟
      ar: لمن الدرس؟
      en: Who is the class for?
    options: [كاڠڮو ساكابيهي سانتري, كاڠڮو ڮورو, كاڠڮو بوچاه]
    answer: 0
    meaning:
      ar_eg: لكل الطلبة.
      ar: لجميع الطلاب.
      en: For all students.
    words: [santri]
  - id: e05
    type: match_pairs
    pairs:
      - text: سوري
        ar_eg: sore — العصر
        ar: sore — العصر
        en: sore — afternoon
      - text: ڮورو
        ar_eg: guru — مدرّس
        ar: guru — معلّم
        en: guru — teacher
      - text: سانتري
        ar_eg: santri — طالب بيسانترين
        ar: santri — طالب البيسانترين
        en: santri — pesantren student
      - text: كاڠڮو
        ar_eg: kanggo — لـ / عشان
        ar: kanggo — لِـ / من أجل
        en: kanggo — for
    words: [santri, ڮ, ڠ]
  - id: e06
    type: fill_blank
    sentence: ڮورو = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: مدرّس)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: معلّم)"
      en: Type the reading in Latin letters. (It means "teacher".)
    answers: [guru]
    words: [ڮ]
    explain:
      ar_eg: ڮ (كاف بتلات نقط) = ga، فـ ڮورو = guru.
      ar: ڮ (كاف بثلاث نقاط) = ga، فـ ڮورو = guru.
      en: ڮ (kaf with three dots) is ga, so ڮورو is guru.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: كاڠڮو ساكابيهي سانتري"
      ar: "اكتب بالحروف اللاتينية: كاڠڮو ساكابيهي سانتري"
      en: "Write in Latin letters: كاڠڮو ساكابيهي سانتري"
    answers: [kanggo sakabehe santri]
    explain:
      ar_eg: كاڠڮو = kanggo (ڠ ثم ڮ)، ساكابيهي = sakabehe (é بـ ي)، سانتري = santri.
      ar: كاڠڮو = kanggo (ڠ ثم ڮ)، ساكابيهي = sakabehe (é بـ ي)، سانتري = santri.
      en: كاڠڮو = kanggo (ڠ then ڮ), ساكابيهي = sakabehe (é as ي), سانتري = santri.
    words: [santri, ڠ, ڮ]
  - id: e08
    type: build_sentence
    source:
      ar_eg: "اكتب بالبيجون: ngaji kitab sore"
      ar: "اكتب بالبيجون: ngaji kitab sore"
      en: "Build in Pegon: ngaji kitab sore"
    answer: ڠاجي كتاب سوري
    distractors: [ساڤا]
    words: [ڠ, kitab]
    explain:
      ar_eg: ngaji kitab sore = ڠاجي كتاب سوري. ساڤا = sapa، ومش فيها.
      ar: ngaji kitab sore = ڠاجي كتاب سوري. أما ساڤا فـ sapa، وليست فيها.
      en: ngaji kitab sore is ڠاجي كتاب سوري. ساڤا is sapa, not in it.
  - id: e09
    type: speaking
    text: Saben sore santri-santri ngaji kitab.
    meaning:
      ar_eg: كل يوم العصر الطلبة بيدرسوا الكتب.
      ar: كل عصر يدرس الطلاب الكتب.
      en: Every afternoon the students study the kitab.
    words: [santri]
dialogue:
  title: Ing lawang pesantren
  lines:
    - speaker: Gus Hanif
      text: Mas Mohamed, sampun maos papan menika?
      ar_eg: يا محمد، قريت اللوحة دي؟
      ar: يا محمد، هل قرأت هذا اللوح؟
      en: Mohamed, have you read this board?
    - speaker: Mohamed
      text: Sampun, Gus. Ngaji kitab saben sore, kangge sedaya santri.
      ar_eg: قريتها يا Gus. درس الكتب كل يوم العصر، لكل الطلبة.
      ar: نعم يا Gus. دراسة الكتب كل عصر، لجميع الطلاب.
      en: Yes, Gus. Kitab study every afternoon, for all the students.
    - speaker: Gus Hanif
      text: Leres. Panjenengan kersa tumut?
      ar_eg: مظبوط. تحب تحضر معانا؟
      ar: صحيح. أتحب أن تشاركنا؟
      en: Right. Would you like to join?
    - speaker: Mohamed
      text: Kersa sanget, Gus!
      ar_eg: أحب جدًا يا Gus!
      ar: أحبّ ذلك كثيرًا يا Gus!
      en: I'd love to, Gus!
new_words:
  - word: santri
    pos: noun
    ar_eg: طالب في البيسانترين
    ar: طالب البيسانترين
    en: pesantren student = santri
review:
  status: draft
  verified: false
