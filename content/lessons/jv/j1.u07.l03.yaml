dialogue:
  title: Nang Pasar Atom
  lines:
    - speaker: Mohamed
      text: Cak, klambi iki regané pira?
      ar_eg: يا معلم، القميص ده بكام؟
      ar: يا أخي، بكم هذا القميص؟
      en: Cak, how much is this shirt?
    - speaker: Cak Man
      text: Satus ewu, Mas.
      ar_eg: مية ألف يا أستاذ.
      ar: مئة ألف يا أخي.
      en: A hundred thousand, Mas.
    - speaker: Mohamed
      text: Satus ewu? Larang! Oleh kurang?
      ar_eg: مية ألف؟ غالي! ينفع تنزّل؟
      ar: مئة ألف؟ غالٍ! هل تخفض السعر؟
      en: A hundred thousand? Expensive! Can you go lower?
    - speaker: Cak Man
      text: Wolung puluh ewu, ya.
      ar_eg: تمانين ألف، ماشي؟
      ar: ثمانون ألفًا، اتفقنا؟
      en: Eighty thousand, OK?
    - speaker: Mohamed
      text: Pitung puluh ewu, Cak?
      ar_eg: سبعين ألف يا معلم؟
      ar: سبعون ألفًا يا أخي؟
      en: Seventy thousand, Cak?
    - speaker: Cak Man
      text: Ya wis, oleh. Murah iki, Mas!
      ar_eg: خلاص، ماشي. ده رخيص يا أستاذ!
      ar: حسنًا، موافق. هذا رخيص يا أخي!
      en: Alright, deal. That's cheap, Mas!
new_words:
  - word: puluh
    pos: number
    ar_eg: 'عشرات: rong puluh = 20'
    ar: 'العشرات: rong puluh = 20'
    en: 'tens: rong puluh = 20'
  - word: atus
    pos: number
    ar_eg: مية؛ satus = 100
    ar: مئة؛ satus = 100
    en: hundred; satus = 100
  - word: ewu
    pos: number
    ar_eg: ألف (ribu)؛ sewu = 1000
    ar: ألف (ribu)؛ sewu = 1000
    en: thousand (ribu); sewu = 1,000
  - word: juta
    pos: number
    ar_eg: مليون (juta)؛ sejuta = مليون
    ar: مليون (juta)؛ sejuta = مليون
    en: million (juta); sejuta = 1,000,000
  - word: murah
    pos: adjective
    ar_eg: رخيص (murah)
    ar: رخيص (murah)
    en: cheap (murah)
  - word: oleh kurang?
    pos: phrase
    ar_eg: ينفع تنزّل؟ (Boleh kurang?)
    ar: هل تخفض السعر؟ (Boleh kurang?)
    en: can you go lower? (Boleh kurang?)
  - word: dhuwit
    pos: noun
    ar_eg: فلوس (uang)
    ar: نقود (uang)
    en: money (uang)
