schema: kabar.lesson/v1
id: j1.u07.l03
language: jv
title: Rong ewu, satus
can_do:
  ar_eg: تقول الأسعار بالآلاف وتفاصل بأدب.
  ar: أن تذكر الأسعار بالآلاف وتساوم بأدب.
  en: Say prices in thousands and haggle politely.
slides:
  - title: Rong ewu, telung ewu
    body:
      ar_eg: |
        الحتة المهمة للأسعار: لما الرقم ييجي قبل **ewu** (ألف)، **atus** (مية)، **puluh** (عشرات) أو **juta** (مليون)، بياخد «شكل وصل»:
        - 1 → se- · 2 → rong · 3 → telung · 4 → patang · 5 → limang
        - 6 → nem · 7 → pitung · 8 → wolung · 9 → sangang
        rong ewu = 2000، limang ewu = 5000، rong puluh = 20.
        زي المصري بالظبط: بنقول «تلاتة» بس «تلات آلاف»، و«اتنين» بس «ألفين».
        (50 و60 ليهم كلمات خاصة، هنتعلمها في J2.)
      ar: |
        وهذا مفتاح الأسعار: إذا جاء العدد قبل **ewu** (ألف) أو **atus** (مئة) أو **puluh** (عشرات) أو **juta** (مليون) اتخذ «صورة وصل»:
        - 1 → se- · 2 → rong · 3 → telung · 4 → patang · 5 → limang
        - 6 → nem · 7 → pitung · 8 → wolung · 9 → sangang
        rong ewu = 2000، limang ewu = 5000، rong puluh = 20.
        كما في العامية: «تلاتة» لكن «تلات آلاف».
        (وللخمسين والستين ألفاظ خاصة تأتي في J2.)
      en: |
        The price trick: before **ewu** (thousand), **atus** (hundred), **puluh** (tens) or **juta** (million), a number takes a linking form:
        - 1 → se- · 2 → rong · 3 → telung · 4 → patang · 5 → limang
        - 6 → nem · 7 → pitung · 8 → wolung · 9 → sangang
        rong ewu = 2,000, limang ewu = 5,000, rong puluh = 20.
        Just like Egyptian «تلاتة» but «تلات آلاف».
        (50 and 60 have special words, coming in J2.)
    grammar: jv.number.ngoko
    examples:
      - text: Regané pira? — Telung ewu.
        ar_eg: بكام؟ — تلات آلاف.
        ar: بكم؟ — ثلاثة آلاف.
        en: How much? — Three thousand.
      - text: Limang ewu.
        ar_eg: خمس آلاف.
        ar: خمسة آلاف.
        en: Five thousand.
  - title: Satus, sewu, sejuta
    body:
      ar_eg: |
        الـ «واحد» قبل الأرقام الكبيرة بيبقى se-، زي seribu في الإندونيسي:
        - satus = 100 · sewu = 1000 · sejuta = مليون
        - sepuluh ewu = 10.000 · rong puluh ewu = 20.000 · satus ewu = 100.000 · rong juta = 2 مليون
        يعني مش «siji ewu» ولا «loro ewu»: sewu وrong ewu.
      ar: |
        يصير «واحد» قبل الأعداد الكبيرة se-، كما في seribu الإندونيسية:
        - satus = 100 · sewu = 1000 · sejuta = مليون
        - sepuluh ewu = 10.000 · rong puluh ewu = 20.000 · satus ewu = 100.000 · rong juta = مليونان
        فلا يقال «siji ewu» ولا «loro ewu»، بل sewu وrong ewu.
      en: |
        "One" before big numbers is se-, like Indonesian seribu:
        - satus = 100 · sewu = 1,000 · sejuta = 1,000,000
        - sepuluh ewu = 10,000 · rong puluh ewu = 20,000 · satus ewu = 100,000 · rong juta = 2 million
        So never "siji ewu" or "loro ewu": sewu and rong ewu.
    grammar: jv.number.ngoko
    examples:
      - text: Satus ewu? Larang!
        ar_eg: مية ألف؟ غالي!
        ar: مئة ألف؟ غالٍ!
        en: A hundred thousand? That's expensive!
      - text: Sewu, rong ewu, telung ewu.
        ar_eg: ألف، ألفين، تلات آلاف.
        ar: ألف، ألفان، ثلاثة آلاف.
        en: One thousand, two thousand, three thousand.
  - title: Larang, murah, oleh kurang?
    body:
      ar_eg: |
        كلمات الفصال:
        - **larang** = mahal = غالي · **murah** = murah = رخيص (نفس الإندونيسي).
        - **Oleh kurang?** = Boleh kurang? = ينفع تنزّل شوية؟
        - **dhuwit** = uang = فلوس.
        قولها بابتسامة. في السوق الجاوي الفصال لعبة حلوة، مش خناقة.
      ar: |
        ألفاظ المساومة:
        - **larang** = mahal = غالٍ · **murah** = murah = رخيص (كالإندونيسية).
        - **Oleh kurang?** = Boleh kurang? = هل تخفّض السعر قليلًا؟
        - **dhuwit** = uang = نقود.
        قلها مبتسمًا؛ فالمساومة في السوق الجاوي لعبة لطيفة لا شجار.
      en: |
        Haggling words:
        - **larang** = mahal = expensive · **murah** = murah = cheap (same as Indonesian).
        - **Oleh kurang?** = Boleh kurang? = Can you go a bit lower?
        - **dhuwit** = uang = money.
        Say it with a smile: haggling in a Javanese market is a friendly game, not a fight.
    grammar: jv.number.ngoko
    examples:
      - text: Oleh kurang? Rong ewu, ya.
        ar_eg: ينفع تنزّل؟ ألفين، ماشي؟
        ar: هل تخفض السعر؟ ألفان، اتفقنا؟
        en: Can you go lower? Two thousand, OK?
      - text: Murah, Cak!
        ar_eg: رخيص يا معلم!
        ar: رخيص يا أخي!
        en: That's cheap, brother!
exercises:
  - id: e01
    type: multiple_choice
    question: rong ewu
    question_meaning:
      ar_eg: كام؟
      ar: كم؟
      en: How much is it?
    options: ['200', '20.000', '2.000']
    answer: 2
    explain:
      ar_eg: rong = 2 (شكل الوصل)، ewu = ألف.
      ar: rong = 2 (صورة الوصل)، وewu = ألف.
      en: rong = 2 (linking form), ewu = thousand.
    words: [rong, ewu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول ٢٠٠٠ صح؟
      ar: كيف تقول ٢٠٠٠ بصورة صحيحة؟
      en: Which is the correct way to say 2,000?
    options: [rong ewu, loro ewu, siji ewu]
    answer: 0
    explain:
      ar_eg: 'قبل ewu الرقم بياخد شكل الوصل: loro → rong.'
      ar: 'قبل ewu تُستعمل صورة الوصل: loro → rong.'
      en: 'Before ewu use the linking form: loro → rong.'
    words: [rong, ewu]
  - id: e03
    type: listen
    text: Telung ewu.
    options: [Telung atus., Patang ewu., Telung ewu.]
    answer: 2
    words: [telung, ewu]
  - id: e04
    type: fill_blank
    sentence: ___ ewu.
    meaning:
      ar_eg: خمس آلاف (5000).
      ar: خمسة آلاف (5000).
      en: Five thousand (5,000).
    answers: [Limang, limang]
    explain:
      ar_eg: lima قبل ewu بتبقى limang.
      ar: تصير lima قبل ewu ‏limang.
      en: lima becomes limang before ewu.
    words: [limang, ewu]
  - id: e05
    type: fill_blank
    sentence: Satus ewu? ___!
    meaning:
      ar_eg: مية ألف؟ غالي!
      ar: مئة ألف؟ غالٍ!
      en: A hundred thousand? That's expensive!
    options: [Apik, Murah, Larang]
    answers: [Larang]
    words: [larang]
  - id: e06
    type: build_sentence
    source:
      ar_eg: بكام؟ — تلات آلاف.
      ar: بكم؟ — ثلاثة آلاف.
      en: How much? — Three thousand.
    answer: Regané pira? Telung ewu.
    distractors: [telu, loro]
    explain:
      ar_eg: telu قبل ewu بتبقى telung.
      ar: تصير telu قبل ewu ‏telung.
      en: telu becomes telung before ewu.
    words: [rega, pira, telung, ewu]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ينفع تنزّل؟ عشرة آلاف، ماشي؟
      ar: هل تخفض السعر؟ عشرة آلاف، اتفقنا؟
      en: Can you go lower? Ten thousand, OK?
    answers: ['Oleh kurang? Sepuluh ewu, ya.', 'Oleh kurang? Sepuluh ewu, ya', 'Oleh kurang? Sepuluh ewu ya.', 'Oleh kurang? Sepuluh ewu ya', 'Oleh kurang? Sepuluh ewu ya?', 'Oleh kurang? Sepuluh ewu.', 'Oleh kurang? Sepuluh ewu', 'Oleh kurang, Cak? Sepuluh ewu, ya.', 'Oleh kurang, Cak? Sepuluh ewu, ya', 'Oleh kurang Cak? Sepuluh ewu ya.', 'Oleh kurang Cak? Sepuluh ewu ya', 'Oleh kurang, Mas? Sepuluh ewu, ya.', 'Oleh kurang, Mas? Sepuluh ewu, ya', 'Oleh kurang Mas? Sepuluh ewu ya.', 'Oleh kurang Mas? Sepuluh ewu ya']
    words: [oleh kurang, sepuluh, ewu]
  - id: e08
    type: speaking
    text: Regané pira? Oleh kurang?
    meaning:
      ar_eg: بكام؟ ينفع تنزّل؟
      ar: بكم؟ هل تخفض السعر؟
      en: How much? Can you go lower?
