schema: kabar.lesson/v1
id: j1.u07.l03
language: jv
title: Rong ewu, satus
can_do:
  ar_eg: تقول الأسعار بالآلاف وتفاصل بأدب.
  ar: أن تذكر الأسعار بالآلاف وتساوم بأدب.
  en: Say prices in thousands and haggle politely.
slides:
  - title: Rong ewu, telung ewu
    body:
      ar_eg: |
        الحتة المهمة للأسعار: لما الرقم ييجي قبل **ewu** (ألف)، **atus** (مية)، **puluh** (عشرات) أو **juta** (مليون)، بياخد «شكل وصل»:
        - 1 → se- · 2 → rong · 3 → telung · 4 → patang · 5 → limang
        - 6 → nem · 7 → pitung · 8 → wolung · 9 → sangang
        rong ewu = 2000، limang ewu = 5000، rong puluh = 20.
        زي المصري بالظبط: بنقول «تلاتة» بس «تلات آلاف»، و«اتنين» بس «ألفين».
        (50 و60 ليهم كلمات خاصة، هنتعلمها في J2.)
      ar: |
        وهذا مفتاح الأسعار: إذا جاء العدد قبل **ewu** (ألف) أو **atus** (مئة) أو **puluh** (عشرات) أو **juta** (مليون) اتخذ «صورة وصل»:
        - 1 → se- · 2 → rong · 3 → telung · 4 → patang · 5 → limang
        - 6 → nem · 7 → pitung · 8 → wolung · 9 → sangang
        rong ewu = 2000، limang ewu = 5000، rong puluh = 20.
        كما في العامية: «تلاتة» لكن «تلات آلاف».
        (وللخمسين والستين ألفاظ خاصة تأتي في J2.)
      en: |
        The price trick: before **ewu** (thousand), **atus** (hundred), **puluh** (tens) or **juta** (million), a number takes a linking form:
        - 1 → se- · 2 → rong · 3 → telung · 4 → patang · 5 → limang
        - 6 → nem · 7 → pitung · 8 → wolung · 9 → sangang
        rong ewu = 2,000, limang ewu = 5,000, rong puluh = 20.
        Just like Egyptian «تلاتة» but «تلات آلاف».
        (50 and 60 have special words, coming in J2.)
    grammar: jv.number.ngoko
    examples:
      - text: Regane pira? — Telung ewu.
        ar_eg: بكام؟ — تلات آلاف.
        ar: بكم؟ — ثلاثة آلاف.
        en: How much? — Three thousand.
      - text: Limang ewu.
        ar_eg: خمس آلاف.
        ar: خمسة آلاف.
        en: Five thousand.
  - title: Satus, sewu, sejuta
    body:
      ar_eg: |
        الـ «واحد» قبل الأرقام الكبيرة بيبقى se-، زي seribu في الإندونيسي:
        - satus = 100 · sewu = 1000 · sejuta = مليون
        - sepuluh ewu = 10.000 · rong puluh ewu = 20.000 · satus ewu = 100.000 · rong juta = 2 مليون
        يعني مش «siji ewu» ولا «loro ewu»: sewu وrong ewu.
      ar: |
        يصير «واحد» قبل الأعداد الكبيرة se-، كما في seribu الإندونيسية:
        - satus = 100 · sewu = 1000 · sejuta = مليون
        - sepuluh ewu = 10.000 · rong puluh ewu = 20.000 · satus ewu = 100.000 · rong juta = مليونان
        فلا يقال «siji ewu» ولا «loro ewu»، بل sewu وrong ewu.
      en: |
        "One" before big numbers is se-, like Indonesian seribu:
        - satus = 100 · sewu = 1,000 · sejuta = 1,000,000
        - sepuluh ewu = 10,000 · rong puluh ewu = 20,000 · satus ewu = 100,000 · rong juta = 2 million
        So never "siji ewu" or "loro ewu": sewu and rong ewu.
    grammar: jv.number.ngoko
    examples:
      - text: Satus ewu? Larang!
        ar_eg: مية ألف؟ غالي!
        ar: مئة ألف؟ غالٍ!
        en: A hundred thousand? That's expensive!
      - text: Sewu, rong ewu, telung ewu.
        ar_eg: ألف، ألفين، تلات آلاف.
        ar: ألف، ألفان، ثلاثة آلاف.
        en: One thousand, two thousand, three thousand.
  - title: Larang, murah, oleh kurang?
    body:
      ar_eg: |
        كلمات الفصال:
        - **larang** = mahal = غالي · **murah** = murah = رخيص (نفس الإندونيسي).
        - **Oleh kurang?** = Boleh kurang? = ينفع تنزّل شوية؟
        - **dhuwit** = uang = فلوس.
        قولها بابتسامة. في السوق الجاوي الفصال لعبة حلوة، مش خناقة.
      ar: |
        ألفاظ المساومة:
        - **larang** = mahal = غالٍ · **murah** = murah = رخيص (كالإندونيسية).
        - **Oleh kurang?** = Boleh kurang? = هل تخفّض السعر قليلًا؟
        - **dhuwit** = uang = نقود.
        قلها مبتسمًا؛ فالمساومة في السوق الجاوي لعبة لطيفة لا شجار.
      en: |
        Haggling words:
        - **larang** = mahal = expensive · **murah** = murah = cheap (same as Indonesian).
        - **Oleh kurang?** = Boleh kurang? = Can you go a bit lower?
        - **dhuwit** = uang = money.
        Say it with a smile: haggling in a Javanese market is a friendly game, not a fight.
    grammar: jv.number.ngoko
    examples:
      - text: Oleh kurang? Rong ewu, ya.
        ar_eg: ينفع تنزّل؟ ألفين، ماشي؟
        ar: هل تخفض السعر؟ ألفان، اتفقنا؟
        en: Can you go lower? Two thousand, OK?
      - text: Murah, Mas!
        ar_eg: رخيص يا معلم!
        ar: رخيص يا أخي!
        en: That's cheap, brother!
exercises:
  - id: e01
    type: multiple_choice
    question: rong ewu
    question_meaning:
      ar_eg: كام؟
      ar: كم؟
      en: How much is it?
    options: ['200', '20.000', '2.000']
    answer: 2
    explain:
      ar_eg: rong = 2 (شكل الوصل)، ewu = ألف.
      ar: rong = 2 (صورة الوصل)، وewu = ألف.
      en: rong = 2 (linking form), ewu = thousand.
    words: [rong, ewu]
  - id: e02
    type: multiple_choice
    question: rong puluh ewu
    question_meaning:
      ar_eg: كام؟
      ar: كم؟
      en: How much?
    options: ['20.000', '2.000', '200.000']
    answer: 0
    explain:
      ar_eg: rong = 2، puluh = عشرات، ewu = ألف. يعني 20 × 1000.
      ar: rong = 2، وpuluh = عشرات، وewu = ألف، أي 20 × 1000.
      en: rong = 2, puluh = tens, ewu = thousand, so 20 × 1,000.
    words: [rong, puluh, ewu]
  - id: e03
    type: listen
    text: Telung ewu.
    options: [Telung atus., Telung juta., Telung ewu.]
    answer: 2
    words: [telung, ewu, atus, juta]
  - id: e04
    type: fill_blank
    sentence: Dhuwitku ___ ewu.
    meaning:
      ar_eg: معايا خمس آلاف (5000).
      ar: معي خمسة آلاف (5000).
      en: I've got five thousand (5,000).
    answers: [limang, Limang]
    explain:
      ar_eg: lima قبل ewu بتبقى limang. وdhuwitku = فلوسي.
      ar: تصير lima قبل ewu ‏limang، وdhuwitku = نقودي.
      en: lima becomes limang before ewu; dhuwitku = my money.
    words: [dhuwit, limang, ewu]
  - id: e05
    type: fill_blank
    sentence: Sepuluh ewu? ___! Aku tuku.
    meaning:
      ar_eg: عشرة آلاف؟ رخيص! هشتري.
      ar: عشرة آلاف؟ رخيص! سأشتري.
      en: Ten thousand? That's cheap! I'll buy it.
    options: [Larang, Murah, Apik]
    answers: [Murah]
    words: [murah, tuku]
  - id: e06
    type: build_sentence
    source:
      ar_eg: بكام؟ — تلتمية ألف. ينفع تنزّل؟
      ar: بكم؟ — ثلاثمئة ألف. هل تخفض السعر؟
      en: How much? — Three hundred thousand. Can you go lower?
    answer: Regane pira? Telung atus ewu. Oleh kurang?
    distractors: [telu, loro]
    explain:
      ar_eg: telu قبل ewu بتبقى telung.
      ar: تصير telu قبل ewu ‏telung.
      en: telu becomes telung before ewu.
    words: [rega, pira, telung, atus, ewu, oleh kurang]
  - id: e07
    type: match_pairs
    pairs:
      - text: puluh
        ar_eg: عشرات
        ar: عشرات
        en: tens
      - text: atus
        ar_eg: مية
        ar: مئة
        en: hundred
      - text: ewu
        ar_eg: ألف
        ar: ألف
        en: thousand
      - text: juta
        ar_eg: مليون
        ar: مليون
        en: million
      - text: murah
        ar_eg: رخيص
        ar: رخيص
        en: cheap
      - text: dhuwit
        ar_eg: فلوس
        ar: نقود
        en: money
    words: [puluh, atus, ewu, juta, murah, dhuwit]
  - id: e08
    type: speaking
    text: Dhuwitku rong puluh ewu. Oleh kurang?
    meaning:
      ar_eg: معايا عشرين ألف. ينفع تنزّل؟
      ar: معي عشرون ألفًا. هل تخفض السعر؟
      en: I've got twenty thousand. Can you go lower?
    words: [dhuwit, rong, puluh, ewu, oleh kurang]
  - id: e09
    type: multiple_choice
    question: Sejuta? Oleh kurang?
    question_meaning:
      ar_eg: إنت بتفاصل. معنى كلامك إيه بالإندونيسي؟
      ar: أنت تساوم. ما معنى كلامك بالإندونيسية؟
      en: You're haggling. What are you saying in Indonesian?
    options: ['Sejuta? Boleh kurang?', 'Sejuta? Boleh pinjam?', 'Sejuta? Ada yang murah?']
    answer: 0
    explain:
      ar_eg: oleh kurang = boleh kurang = ينفع تنزّل؟ وsejuta = مليون.
      ar: oleh kurang = boleh kurang، وsejuta = مليون.
      en: oleh kurang = boleh kurang; sejuta = one million.
    words: [juta, oleh kurang, murah]
dialogue:
  title: Neng Pasar Klithikan
  lines:
    - speaker: Mohamed
      text: Mas, klambi iki regane pira?
      ar_eg: يا معلم، القميص ده بكام؟
      ar: يا أخي، بكم هذا القميص؟
      en: Mas, how much is this shirt?
    - speaker: Mas Man
      text: Satus ewu, Mas.
      ar_eg: مية ألف يا أستاذ.
      ar: مئة ألف يا أخي.
      en: A hundred thousand, Mas.
    - speaker: Mohamed
      text: Satus ewu? Larang! Oleh kurang?
      ar_eg: مية ألف؟ غالي! ينفع تنزّل؟
      ar: مئة ألف؟ غالٍ! هل تخفض السعر؟
      en: A hundred thousand? Expensive! Can you go lower?
    - speaker: Mas Man
      text: Wolung puluh ewu, ya.
      ar_eg: تمانين ألف، ماشي؟
      ar: ثمانون ألفًا، اتفقنا؟
      en: Eighty thousand, OK?
    - speaker: Mohamed
      text: Pitung puluh ewu, Mas?
      ar_eg: سبعين ألف يا معلم؟
      ar: سبعون ألفًا يا أخي؟
      en: Seventy thousand, Mas?
    - speaker: Mas Man
      text: Ya wis, oleh. Murah iki, Mas!
      ar_eg: خلاص، ماشي. ده رخيص يا أستاذ!
      ar: حسنًا، موافق. هذا رخيص يا أخي!
      en: Alright, deal. That's cheap, Mas!
new_words:
  - word: puluh
    pos: number
    ar_eg: 'عشرات: rong puluh = 20'
    ar: 'العشرات: rong puluh = 20'
    en: 'tens: rong puluh = 20'
  - word: atus
    pos: number
    ar_eg: مية؛ satus = 100
    ar: مئة؛ satus = 100
    en: hundred; satus = 100
  - word: ewu
    pos: number
    ar_eg: ألف (ribu)؛ sewu = 1000
    ar: ألف (ribu)؛ sewu = 1000
    en: thousand (ribu); sewu = 1,000
  - word: juta
    pos: number
    ar_eg: مليون (juta)؛ sejuta = مليون
    ar: مليون (juta)؛ sejuta = مليون
    en: million (juta); sejuta = 1,000,000
  - word: murah
    pos: adjective
    ar_eg: رخيص (murah)
    ar: رخيص (murah)
    en: cheap (murah)
  - word: oleh kurang?
    pos: phrase
    ar_eg: ينفع تنزّل؟ (Boleh kurang?)
    ar: هل تخفض السعر؟ (Boleh kurang?)
    en: can you go lower? (Boleh kurang?)
  - word: dhuwit
    pos: noun
    ar_eg: فلوس (uang)
    ar: نقود (uang)
    en: money (uang)
