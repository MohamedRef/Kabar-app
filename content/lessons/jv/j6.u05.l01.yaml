    pos: noun
    ar_eg: حروف «كبيرة» للتكريم (أسماء وألقاب المحترمين)
    ar: حروف معظَّمة (لأسماء المحترمين وألقابهم)
    en: honorific capitals (for names and titles of respected people)
  - word: ꦓ
    pos: letter
    ar_eg: ga murda — زي ꦒ بس للتكريم
    ar: ga murda — كـ ꦒ للتعظيم
    en: ga murda — reads like ꦒ, used for honour
  - word: ꦯ
    pos: letter
    ar_eg: sa murda — زي ꦱ بس للتكريم
    ar: sa murda — كـ ꦱ للتعظيم
    en: sa murda — reads like ꦱ, used for honour
  - word: ꦦ
    pos: letter
    ar_eg: pa murda — زي ꦥ بس للتكريم
    ar: pa murda — كـ ꦥ للتعظيم
    en: pa murda — reads like ꦥ, used for honour
