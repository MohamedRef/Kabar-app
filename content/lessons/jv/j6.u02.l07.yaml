  - id: e10
    type: speaking
    text: Pujangga nulis kidung ing lontar.
    meaning:
      ar_eg: الشاعر كتب أنشودة على ورق النخل.
      ar: كتب الشاعر نشيدًا على سعف اللونتار.
      en: The poet wrote a song on palm leaves.
    words: [pujangga, kidung, lontar]
dialogue:
  lines:
    - speaker: Pak Slamet
      text: Mas, menika lontar saking jaman rumiyin.
      ar_eg: يا محمد، ده ورق نخل من زمان.
      ar: هذا سعف لونتار من الزمن القديم.
      en: Look, this is a palm-leaf manuscript from long ago.
    - speaker: Mohamed
      text: Aksaranipun alit sanget! Menapa ditulis mawi mangsi?
      ar_eg: الحروف صغيرة أوي! مكتوبة بحبر؟
      ar: الحروف صغيرة جدًا! أكُتبت بالحبر؟
      en: The letters are tiny! Was it written in ink?
    - speaker: Pak Slamet
      text: Mboten. Dipunukir mawi peso alit, lajeng dipunolesi angus.
      ar_eg: لأ. اتحفرت بسكينة صغيرة، وبعدين اتدهنت بالهباب.
      ar: لا. حُفرت بسكين صغيرة ثم طُليت بالسخام.
      en: No. It was scratched with a small knife, then rubbed with soot.
    - speaker: Mohamed
      text: Serat menika anggitanipun sinten?
      ar_eg: الكتاب ده تأليف مين؟
      ar: من مؤلف هذا الكتاب؟
      en: Who wrote this book?
    - speaker: Pak Slamet
      text: Ranggawarsita, pujangga ingkang kesohor.
      ar_eg: رانجاوارسيتا، الشاعر المشهور.
      ar: رانغاوارسيتا، الشاعر المشهور.
      en: Ranggawarsita, the famous court poet.
    - speaker: Mohamed
      text: Kula badhe nyerat cathetan. Kawruhipun kathah sanget.
      ar_eg: هكتب ملاحظات. العلم اللي فيه كتير أوي.
      ar: سأكتب ملاحظات، ففيه علم كثير.
      en: I'll take notes. There's so much knowledge here.
