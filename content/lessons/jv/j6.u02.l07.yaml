      ar_eg: المخطوطات القديمة كانت بتتكتب على ورق نخل اسمه …
      ar: كانت المخطوطات القديمة تُكتب على سعف يسمّى …
      en: Old manuscripts were written on palm leaves called …
    options: [kidung, lontar, wacan]
    answer: 1
    explain:
      ar_eg: lontar = ورق نخل اللونتار.
      ar: lontar = سعف نخيل اللونتار.
      en: lontar = palm leaves used for writing.
    words: [kidung, lontar, wacan]
  - id: e06
    type: fill_blank
