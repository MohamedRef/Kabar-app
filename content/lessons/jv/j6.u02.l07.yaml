    question:
      ar_eg: الكتاب ده عامل إزاي؟
      ar: كيف هذا الكتاب؟
      en: What is this book like?
    options: [كتاب قديم مكتوب بحبر إسود, كتاب جديد مطبوع, ورقة نخل فاضية]
    answer: 0
    meaning:
      ar_eg: الكتاب القديم ده مكتوب بحبر إسود.
      ar: كُتب هذا الكتاب القديم بحبر أسود.
      en: This old book is written in black ink.
    words: [serat, mangsi]
