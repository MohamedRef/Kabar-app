schema: kabar.lesson/v1
id: j6.u02.l07
language: jv
title: Lontar lan mangsi
can_do:
  ar_eg: 'تتفرج على مخطوطات قديمة في المتحف: ورق النخل، والحبر، والشاعر، والأغاني، والعلم اللي فيها.'
  ar: 'أن تشاهد مخطوطات قديمة في المتحف: سعف النخيل والحبر والشاعر والأناشيد والمعرفة.'
  en: 'Look at old manuscripts in a museum: palm leaves, ink, the court poet, songs and the knowledge inside.'
slides:
  - title: Naskah lawas
    body:
      ar_eg: |
        زمان كانوا بيكتبوا على lontar (ورق نخل اللونتار) أو على ورق بـ mangsi (حبر).
        serat = كتاب أدبي قديم أو جواب رسمي، pujangga = شاعر القصر، kidung = أنشودة قديمة.
        kawruh = علم ومعرفة، wacan = نص للقراية، cathetan = ملاحظة متكتبة.
      ar: |
        قديمًا كانوا يكتبون على lontar (سعف نخيل اللونتار) أو على الورق بـ mangsi (حبر).
        serat = كتاب أدبي قديم أو رسالة رسمية، pujangga = شاعر البلاط، kidung = نشيد قديم.
        kawruh = علم ومعرفة، wacan = نص للقراءة، cathetan = ملاحظة مكتوبة.
      en: |
        People once wrote on lontar (palm leaves) or on paper with mangsi (ink).
        serat = classic literary book or formal letter, pujangga = court poet, kidung = old hymn, song.
        kawruh = knowledge, wacan = reading text, cathetan = note.
    examples:
      - text: Biyen wong nulis aksara Jawa ing lontar.
        ar_eg: زمان الناس كانوا بيكتبوا الحروف الجاوية على ورق النخل.
        ar: قديمًا كان الناس يكتبون الحروف الجاوية على سعف اللونتار.
        en: People once wrote Javanese script on palm leaves.
      - text: Ranggawarsita iku pujangga kesohor saka Surakarta.
        ar_eg: رانجاوارسيتا شاعر قصر مشهور من سوراكارتا.
        ar: رانغاوارسيتا شاعر بلاط مشهور من سوراكارتا.
        en: Ranggawarsita is a famous court poet from Surakarta.
      - text: Serat iki isine kidung lan kawruh.
        ar_eg: الكتاب ده فيه أناشيد وعلم.
        ar: يحوي هذا الكتاب أناشيد ومعرفة.
        en: This book holds songs and knowledge.
