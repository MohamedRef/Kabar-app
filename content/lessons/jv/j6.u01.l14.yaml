schema: kabar.lesson/v1
id: j6.u01.l14
language: jv
title: Buku bocah
can_do:
  ar_eg: تقرا أول صفحة من كتاب أطفال بالخط الجاوي.
  ar: أن تقرأ الصفحة الأولى من كتاب أطفال بالخط الجاوي.
  en: Read the first page of a children's book in aksara Jawa.
slides:
  - title: Buku kanggo bocah
    body:
      ar_eg: |
        محمد اشترى من السوق كتاب صغير للعيال اللي بيتعلموا الخط الجاوي. أول صفحة فيها تلات جمل قصيرة بحروف بس، من غير أي علامات.
        كل جملة اسم وفعل: مين بيعمل إيه؟ اقسم الحروف لكلمتين.
      ar: |
        اشترى محمد من السوق كتابًا صغيرًا للأطفال الذين يتعلمون الخط الجاوي. في الصفحة الأولى ثلاث جمل قصيرة بحروف مجرّدة بلا علامات.
        كل جملة اسم وفعل: من يفعل ماذا؟ قسّم الحروف إلى كلمتين.
      en: |
        Mohamed bought a little book at the market for children learning aksara Jawa. The first page has three short sentences in bare letters, with no marks at all.
        Each sentence is a name and a verb: who does what? Split the letters into two words.
    grammar: jv.aksara.nglegena
    examples:
      - text: ꦗꦏꦗꦒ (Jaka jaga.)
        ar_eg: جاكا بيحرس.
        ar: جاكا يحرس.
        en: Jaka keeps watch.
      - text: ꦩꦪꦩꦕ (Maya maca.)
        ar_eg: مايا بتقرا.
        ar: مايا تقرأ.
        en: Maya is reading.
      - text: ꦫꦏꦭꦫ (Raka lara.)
        ar_eg: راكا عيان.
        ar: راكا مريض.
        en: Raka is ill.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: في الصفحة، مين بيقرا؟
      ar: في الصفحة، من يقرأ؟
      en: On the page, who is reading?
    options: [Maya, Jaka, Raka]
    answer: 0
    explain:
      ar_eg: ꦩꦪꦩꦕ = Maya maca (مايا بتقرا).
      ar: ꦩꦪꦩꦕ = Maya maca (مايا تقرأ).
      en: ꦩꦪꦩꦕ = Maya maca.
    words: [ꦩ, ꦕ]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مين العيان؟
      ar: من المريض؟
      en: Who is ill?
    options: [Jaka, Raka, Maya]
    answer: 1
    explain:
      ar_eg: ꦫꦏꦭꦫ = Raka lara، وlara = عيان (بتتنطق loro).
      ar: ꦫꦏꦭꦫ = Raka lara، وlara = مريض (تُنطق loro).
      en: ꦫꦏꦭꦫ = Raka lara; lara = ill (said loro).
    words: [ꦭ, ꦫ]
  - id: e03
    type: listen
    text: Jaka jaga.
    question:
      ar_eg: جاكا بيعمل إيه؟
      ar: ماذا يفعل جاكا؟
      en: What is Jaka doing?
    options: ["ꦗꦒ", "ꦩꦕ", "ꦭꦫ"]
    answer: 0
    meaning:
      ar_eg: جاكا بيحرس.
      ar: جاكا يحرس.
      en: Jaka keeps watch.
    words: [ꦗ, ꦒ]
  - id: e04
    type: match_pairs
    pairs:
      - text: ꦗꦒ
        ar_eg: jaga — يحرس
        ar: jaga — يحرس
        en: jaga — keep watch
      - text: ꦩꦕ
        ar_eg: maca — يقرا
        ar: maca — يقرأ
        en: maca — read
      - text: ꦭꦫ
        ar_eg: lara — عيان
        ar: lara — مريض
        en: lara — ill
      - text: ꦲꦤ
        ar_eg: ana — فيه / موجود
        ar: ana — يوجد
        en: ana — there is
    words: [ꦗ, ꦩ, ꦭ, ꦲ]
  - id: e05
    type: fill_blank
    sentence: Maya ___.
    meaning:
      ar_eg: مايا بتقرا.
      ar: مايا تقرأ.
      en: Maya is reading.
    options: [jaga, maca, lara]
    answers: [maca]
  - id: e06
    type: dictation
    text: Jaka jaga, Maya maca.
    meaning:
      ar_eg: جاكا بيحرس، ومايا بتقرا.
      ar: جاكا يحرس، ومايا تقرأ.
      en: Jaka keeps watch, Maya reads.
  - id: e07
    type: build_sentence
    source:
      ar_eg: "اكتب «Raka lara» (راكا عيان) حرف حرف."
      ar: "اكتب «Raka lara» (راكا مريض) حرفًا حرفًا."
      en: "Write «Raka lara» (Raka is ill) letter by letter."
    answer: ꦫ ꦏ ꦭ ꦫ
    distractors: ["ꦩ"]
    words: [ꦫ, ꦏ, ꦭ]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦩꦪꦩꦕ"
      ar: "اكتب بالحروف اللاتينية: ꦩꦪꦩꦕ"
      en: "Write in Latin letters: ꦩꦪꦩꦕ"
    answers: ["Maya maca.", maya maca, mayamaca]
    words: [ꦩ, ꦪ, ꦕ]
  - id: e09
    type: speaking
    text: Jaka jaga. Maya maca. Raka lara.
    meaning:
      ar_eg: جاكا بيحرس. مايا بتقرا. راكا عيان.
      ar: جاكا يحرس. مايا تقرأ. راكا مريض.
      en: Jaka keeps watch. Maya is reading. Raka is ill.
dialogue:
  title: Tuku buku
  lines:
    - speaker: Mohamed
      text: Bu, buku menika pinten?
      ar_eg: يا مدام، الكتاب ده بكام؟
      ar: يا سيدتي، بكم هذا الكتاب؟
      en: Ma'am, how much is this book?
    - speaker: Bakul
      text: Sedasa ewu, Mas. Kangge lare ingkang sinau aksara Jawa.
      ar_eg: بعشرة آلاف. ده للعيال اللي بيتعلموا الخط الجاوي.
      ar: بعشرة آلاف. إنه للأطفال الذين يتعلمون الخط الجاوي.
      en: Ten thousand. It's for children learning aksara Jawa.
    - speaker: Mohamed
      text: Kula tumbas setunggal. Kula nggih saweg sinau.
      ar_eg: هاخد واحد. أنا كمان لسه بتعلّم.
      ar: سأشتري واحدًا. أنا أيضًا ما زلت أتعلّم.
      en: I'll buy one. I'm learning too.
    - speaker: Bakul
      text: Wah, sae lho! Mangga, Mas.
      ar_eg: يا سلام، حلو! اتفضل.
      ar: رائع! تفضّل.
      en: Oh, lovely! Here you are.
review:
  status: draft
  verified: false
