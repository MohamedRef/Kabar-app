schema: kabar.lesson/v1
id: j3.u01.l01
language: jv
title: Ngoko lan krama
can_do:
  ar_eg: تفرّق بين النغوكو والكراما وتستعمل كل واحدة مع الشخص الصح.
  ar: أن تميّز النغوكو من الكراما وتستعمل كلًّا منهما مع الشخص المناسب.
  en: Tell ngoko from krama and use each with the right person.
slides:
  - title: Unggah-ungguh
    body:
      ar_eg: |
        أهلًا بيك في يوجيا! هنا قلب الجاوي المؤدب. الجاويين عندهم «آداب كلام» اسمها unggah-ungguh: إنت بتختار المستوى حسب اللي قدامك.
        عندنا في المصري بنقول «إنت» لصاحبك و«حضرتك» لحد بتحترمه و«سيادتك» لحد مقامه عالي:
        - ngoko ≈ «إنت»
        - krama ≈ «حضرتك»
        - krama inggil ≈ «سيادتك»
        بس فيه فرق كبير: إحنا بنغيّر الضمير بس، والجاوي بيغيّر كلمات كتير في الجملة كلها.
      ar: |
        مرحبًا بك في يوجيا، قلب الجاوية المهذبة. للجاويين آداب كلام تسمى unggah-ungguh، فتختار المستوى بحسب المخاطَب.
        وفي العربية نقول «أنت» للصديق و«حضرتك» لمن نوقّره و«سيادتك» لصاحب المقام:
        - ngoko ≈ «أنت»
        - krama ≈ «حضرتك»
        - krama inggil ≈ «سيادتك»
        والفرق أننا نغيّر الضمير وحده، أما الجاوية فتغيّر كثيرًا من ألفاظ الجملة.
      en: |
        Welcome to Jogja, the heartland of refined Javanese. Javanese has speech etiquette called unggah-ungguh: you choose a level for the person in front of you.
        In Egyptian Arabic we say «إنت» to a friend, «حضرتك» to someone we respect and «سيادتك» to someone of high standing:
        - ngoko ≈ «إنت»
        - krama ≈ «حضرتك»
        - krama inggil ≈ «سيادتك»
        The big difference: we only swap the pronoun, Javanese swaps many words in the sentence.
    grammar: jv.speechlevel.overview
    examples:
      - text: Kowe wis mangan?
        ar_eg: كلت؟ (ngoko، لصاحبك)
        ar: هل أكلت؟ (ngoko، للصديق)
        en: Have you eaten? (ngoko, to a friend)
      - text: Sampeyan sampun nedha?
        ar_eg: حضرتك كلت؟ (krama، لبياع مثلًا)
        ar: هل أكلتَ؟ (krama، للبائع مثلًا)
        en: Have you eaten? (krama, e.g. to a seller)
      - text: Panjenengan sampun dhahar?
        ar_eg: سيادتك اتفضلت أكلت؟ (krama inggil، لجدة صاحبك)
        ar: هل تفضلتم بالأكل؟ (krama inggil، لجدة الصديق)
        en: Have you eaten? (krama inggil, to a friend's grandmother)
  - title: Ngoko — basa sing wis kok ngerti
    body:
      ar_eg: |
        ngoko هو كل اللي اتعلمته في J1 وJ2: aku، kowe، wis، mangan… بتستخدمه مع صحابك، مع اللي أصغر منك، ومع العيلة القريبة.
        زي الإندونيسي aku / kamu بالظبط: كلام الصحاب.
      ar: |
        الـ ngoko هو كل ما تعلمته في J1 وJ2: aku وkowe وwis وmangan… ويُستعمل مع الأصدقاء ومن هو أصغر والأهل المقربين.
        وهو كالإندونيسية aku / kamu: لغة الأصدقاء.
      en: |
        Ngoko is everything you learned in J1 and J2: aku, kowe, wis, mangan… You use it with friends, with younger people and with close family.
        It's like Indonesian aku / kamu: friends' talk.
    grammar: jv.speechlevel.overview
    examples:
      - text: Aku wis mangan.
        ar_eg: أنا كلت.
        ar: أكلتُ.
        en: I've eaten.
      - text: Wis mangan durung, cah?
        ar_eg: كلت ولا لسه يا صاحبي؟ (ngoko الشارع)
        ar: هل أكلتَ أم بعد يا صاحبي؟ (ngoko الشارع)
        en: Eaten yet, mate? (street ngoko)
  - title: Krama — basa kanggo ngajeni
    body:
      ar_eg: |
        krama للناس اللي مش صحابك أو أكبر منك: البياعة في السوق، حد غريب، حد أكبر منك.
        وهنا الكلمات نفسها بتتغير، مش الضمير بس:
        - kowe ← sampeyan (Anda)
        - wis ← sampun (sudah)
        - mangan ← nedha (makan)
        في الشات هتلاقي sampeyan من غير علامة، وsampun بتتكتب كتير mpun.
        في الشارع: ra = ora (لأ). «Wis mangan durung?» = Kowe wis mangan apa durung? (كلت ولا لسه؟). ومع البياعة بنشيل الضمير: «Sampun nedha, Bu?». وأدوات الكلام: lho (على فكرة!)، to (مش كده؟)، ya (ماشي؟)، و je بتاعة يوجيا (بجد، يعني) — je لسه unverified.
      ar: |
        الـ krama لغير الأصدقاء ولمن هو أكبر: البائعة في السوق، والغريب، والأكبر سنًا.
        وهنا تتغير الألفاظ نفسها لا الضمير وحده:
        - kowe ← sampeyan (Anda)
        - wis ← sampun (sudah)
        - mangan ← nedha (makan)
        وفي الدردشة تُكتب sampeyan بلا علامة، وكثيرًا ما تُكتب sampun هكذا: mpun.
        في الشارع: ra = ora (لا). «Wis mangan durung?» = Kowe wis mangan apa durung? (أأكلت أم بعد؟). ومع البائعة يُحذف الضمير: «Sampun nedha, Bu?». ومن أدوات الكلام: lho (للتنبيه)، to (أليس كذلك؟)، ya (حسنًا؟)، وje اليوجياوية (حقًّا) — وje ما زالت unverified.
      en: |
        Krama is for people who aren't your friends or who are older: a market seller, a stranger, an older person.
        Here the words themselves change, not just the pronoun:
        - kowe → sampeyan (Anda)
        - wis → sampun (sudah)
        - mangan → nedha (makan)
        In chats you'll see sampeyan without the accent, and sampun is often typed mpun.
        On the street: ra = ora (no, not). «Wis mangan durung?» = Kowe wis mangan apa durung? (eaten yet?). With a seller people drop the pronoun: «Sampun nedha, Bu?». Particles: lho (you know!), to (right?), ya (OK?), and Jogja's je (really, see) — je is still unverified.
    grammar: jv.speechlevel.overview
    examples:
      - text: Sampeyan sampun nedha, Bu?
        ar_eg: حضرتك كلتي يا مدام؟
        ar: هل أكلتِ يا سيدتي؟
        en: Have you eaten, ma'am?
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: بتكلم صاحبك Mas Dimas. تستخدم أنهي مستوى؟
      ar: تكلّم صديقك Mas Dimas. أيّ مستوى تستعمل؟
      en: You're talking to your friend Mas Dimas. Which level?
    options: [krama inggil, krama, ngoko]
    answer: 2
    explain:
      ar_eg: مع الصحاب ngoko، زي «إنت» بالظبط.
      ar: مع الأصدقاء يُستعمل ngoko، مثل «أنت».
      en: With friends you use ngoko, just like «إنت».
    words: [ngoko]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بتشتري من Bu Siti، بياعة في السوق أكبر منك ومش تعرفها كويس. أنهي مستوى؟
      ar: تشتري من Bu Siti، بائعة في السوق أكبر منك ولا تعرفها جيدًا. أيّ مستوى؟
      en: You're buying from Bu Siti, an older market seller you don't know well. Which level?
    options: [krama andhap, krama, ngoko]
    answer: 1
    explain:
      ar_eg: البياع أو الغريب بياخد krama (≈ حضرتك). krama andhap مش مستوى لوحده، دي كلمات تواضع عن نفسك.
      ar: البائع والغريب لهما krama (≈ حضرتك)، أما krama andhap فألفاظ تواضع عن النفس لا مستوى مستقل.
      en: Sellers and strangers get krama (≈ حضرتك). Krama andhap isn't a separate level; it's humble words about yourself.
    words: [krama]
  - id: e03
    type: listen
    text: Sampeyan sampun nedha?
    options: ['Kowe wis mangan?', 'Sampeyan sampun nedha?', 'Panjenengan sampun dhahar?']
    answer: 1
    words: [sampeyan, sampun, nedha]
  - id: e04
    type: fill_blank
    sentence: Kowe wis ___?
    meaning:
      ar_eg: كلت؟ (لصاحبك)
      ar: هل أكلت؟ (للصديق)
      en: Have you eaten? (to a friend)
    options: [nedha, mangan, dhahar]
    answers: [mangan]
    explain:
      ar_eg: 'kowe وwis كلمات ngoko، يبقى الفعل كمان ngoko: mangan. ماينفعش تخلط المستويات.'
      ar: 'kowe وwis من الـ ngoko فيكون الفعل ngoko أيضًا: mangan.'
      en: 'kowe and wis are ngoko, so the verb is ngoko too: mangan. Keep one level per sentence.'
    words: [mangan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: حضرتك كلت؟ (لبياع)
      ar: هل أكلتَ؟ (لبائع)
      en: Have you eaten? (to a seller)
    answer: Sampeyan sampun nedha?
    distractors: [wis, mangan]
    words: [sampeyan, sampun, nedha]
  - id: e06
    type: translate
    direction: from_target
    source_text: Kula sampun nedha.
    answers_meaning:
      ar_eg: [أنا كلت., أنا كلت, كلت]
      ar: [قد أكلتُ., أكلتُ, لقد أكلت]
      en: [I've eaten., I have eaten, I already ate]
    words: [kula, sampun, nedha]
  - id: e07
    type: match_pairs
    pairs:
      - text: unggah-ungguh
        ar_eg: آداب الكلام
        ar: آداب الكلام
        en: speech etiquette
      - text: ngoko
        ar_eg: المستوى العادي (≈ إنت)
        ar: المستوى العادي
        en: plain level
      - text: krama
        ar_eg: المستوى المؤدب (≈ حضرتك)
        ar: المستوى المهذّب
        en: polite level
      - text: kula
        ar_eg: أنا (krama)
        ar: أنا (krama)
        en: I (krama)
      - text: sampun
        ar_eg: خلاص (krama)
        ar: قد (krama)
        en: already (krama)
      - text: nedha
        ar_eg: ياكل (krama)
        ar: يأكل (krama)
        en: eat (krama)
    words: [unggah-ungguh, ngoko, krama, kula, sampun, nedha]
  - id: e08
    type: listen
    text: Kula sinau unggah-ungguh.
    options: [Kula sinau unggah-ungguh., Kula sinau basa Jawa., Aku sinau unggah-ungguh.]
    answer: 0
    meaning:
      ar_eg: أنا بتعلم آداب الكلام.
      ar: أتعلّم آداب الكلام.
      en: I'm learning speech etiquette.
    words: [kula, unggah-ungguh, sinau]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «آداب الكلام» (إنك تختار المستوى المناسب)؟
      ar: أيّ كلمة تعني «آداب الكلام» (اختيار المستوى المناسب)؟
      en: Which word means "speech etiquette" (choosing the right level)?
    options: [unggah-ungguh, krama, kula]
    answer: 0
    words: [unggah-ungguh, krama, kula]
dialogue:
  title: Tekan Lempuyangan
  lines:
    - speaker: Mas Dimas
      text: "Wis tekan, Mohamed! Iki Lempuyangan, lho."
      ar_eg: "وصلنا يا محمد! دي Lempuyangan أهي."
      ar: "وصلنا يا محمد! هذه Lempuyangan."
      en: "We're here, Mohamed! This is Lempuyangan, see."
    - speaker: Mohamed
      text: "Mas, aku pengin sinau krama."
      ar_eg: "يا ديماس، أنا نفسي أتعلم الكراما."
      ar: "يا ديماس، أودّ أن أتعلّم الكراما."
      en: "Dimas, I really want to learn krama."
    - speaker: Mas Dimas
      text: "Apik! Karo kancamu ngoko wae: «Wis mangan durung?»"
      ar_eg: "حلو! مع صاحبك نغوكو وبس: «Wis mangan durung?» (كلت ولا لسه؟)"
      ar: "رائع! مع صديقك بالنغوكو فقط: «Wis mangan durung?» (أأكلت أم بعد؟)"
      en: "Great! With a friend, just ngoko: «Wis mangan durung?» (Eaten yet?)"
    - speaker: Mas Dimas
      text: "Karo bakul: «Sampun nedha, Bu?»"
      ar_eg: "مع البياعة: «Sampun nedha, Bu?» (كلتي يا حاجة؟)"
      ar: "مع البائعة: «Sampun nedha, Bu?» (هل أكلتِ يا سيدتي؟)"
      en: "With a seller: «Sampun nedha, Bu?» (Eaten yet, ma'am?)"
new_words:
  - word: unggah-ungguh
    pos: noun
    ar_eg: آداب الكلام (اختيار المستوى)
    ar: آداب الكلام (اختيار المستوى)
    en: speech etiquette (choosing the level)
  - word: ngoko
    pos: noun
    ar_eg: المستوى العادي بين الصحاب (≈ إنت)
    ar: المستوى العادي بين الأقران (≈ أنت)
    en: the plain level among friends (≈ إنت)
  - word: krama
    pos: noun
    ar_eg: المستوى المؤدب (≈ حضرتك)
    ar: المستوى المهذب (≈ حضرتك)
    en: the polite level (≈ حضرتك)
  - word: sampun
    pos: adverb
    ar_eg: خلاص / قد (krama لـ wis، chat mpun) = sudah
    ar: قد (krama لـ wis) = sudah
    en: already (krama for wis; chat mpun) = sudah
  - word: nedha
    pos: verb
    ar_eg: ياكل (krama لـ mangan)
    ar: يأكل (krama لـ mangan)
    en: eat (krama for mangan)
  - word: kula
    pos: pronoun
    ar_eg: أنا (krama، chat kulo) = saya
    ar: أنا (krama) = saya
    en: I (krama; chat kulo) = saya
