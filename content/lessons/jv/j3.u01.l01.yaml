schema: kabar.lesson/v1
id: j3.u01.l01
language: jv
title: Ngoko, krama, krama inggil
can_do:
  ar_eg: تعرف أسماء مستويات الكلام في الجاوي وإمتى تستخدم كل واحد.
  ar: أن تعرف أسماء مستويات الكلام في الجاوية ومتى يُستعمل كلٌّ منها.
  en: Name the Javanese speech levels and when each is used.
slides:
  - title: Unggah-ungguh
    body:
      ar_eg: |
        أهلًا بيك في سولو! هنا قلب الجاوي المؤدب. الجاويين عندهم «آداب كلام» اسمها unggah-ungguh: إنت بتختار المستوى حسب اللي قدامك.
        عندنا في المصري بنقول «إنت» لصاحبك و«حضرتك» لحد بتحترمه و«سيادتك» لحد مقامه عالي:
        - ngoko ≈ «إنت»
        - krama ≈ «حضرتك»
        - krama inggil ≈ «سيادتك»
        بس فيه فرق كبير: إحنا بنغيّر الضمير بس، والجاوي بيغيّر كلمات كتير في الجملة كلها.
      ar: |
        مرحبًا بك في سولو، قلب الجاوية المهذبة. للجاويين آداب كلام تسمى unggah-ungguh، فتختار المستوى بحسب المخاطَب.
        وفي العربية نقول «أنت» للصديق و«حضرتك» لمن نوقّره و«سيادتك» لصاحب المقام:
        - ngoko ≈ «أنت»
        - krama ≈ «حضرتك»
        - krama inggil ≈ «سيادتك»
        والفرق أننا نغيّر الضمير وحده، أما الجاوية فتغيّر كثيرًا من ألفاظ الجملة.
      en: |
        Welcome to Solo, the heartland of refined Javanese. Javanese has speech etiquette called unggah-ungguh: you choose a level for the person in front of you.
        In Egyptian Arabic we say «إنت» to a friend, «حضرتك» to someone we respect and «سيادتك» to someone of high standing:
        - ngoko ≈ «إنت»
        - krama ≈ «حضرتك»
        - krama inggil ≈ «سيادتك»
        The big difference: we only swap the pronoun, Javanese swaps many words in the sentence.
    grammar: jv.speechlevel.overview
    examples:
      - text: Kowé wis mangan?
        ar_eg: كلت؟ (ngoko، لصاحبك)
        ar: هل أكلت؟ (ngoko، للصديق)
        en: Have you eaten? (ngoko, to a friend)
      - text: Sampéyan sampun nedha?
        ar_eg: حضرتك كلت؟ (krama، لبياع مثلًا)
        ar: هل أكلتَ؟ (krama، للبائع مثلًا)
        en: Have you eaten? (krama, e.g. to a seller)
      - text: Panjenengan sampun dhahar?
        ar_eg: سيادتك اتفضلت أكلت؟ (krama inggil، لجدة صاحبك)
        ar: هل تفضلتم بالأكل؟ (krama inggil، لجدة الصديق)
        en: Have you eaten? (krama inggil, to a friend's grandmother)
  - title: Ngoko — basa sing wis kok ngerti
    body:
      ar_eg: |
        ngoko هو كل اللي اتعلمته في J1 وJ2: aku، kowé، wis، mangan… بتستخدمه مع صحابك، مع اللي أصغر منك، ومع العيلة القريبة.
        زي الإندونيسي aku / kamu بالظبط: كلام الصحاب.
      ar: |
        الـ ngoko هو كل ما تعلمته في J1 وJ2: aku وkowé وwis وmangan… ويُستعمل مع الأصدقاء ومن هو أصغر والأهل المقربين.
        وهو كالإندونيسية aku / kamu: لغة الأصدقاء.
      en: |
        Ngoko is everything you learned in J1 and J2: aku, kowé, wis, mangan… You use it with friends, with younger people and with close family.
        It's like Indonesian aku / kamu: friends' talk.
    grammar: jv.speechlevel.overview
    examples:
      - text: Aku wis mangan.
        ar_eg: أنا كلت.
        ar: أكلتُ.
        en: I've eaten.
      - text: Koen wis mangan ta, rek?
        ar_eg: كلت ولا لأ يا صاحبي؟ (ngoko بطعم سورابايا)
        ar: أكلتَ، أليس كذلك يا صاحبي؟ (ngoko بلهجة سورابايا)
        en: You've eaten, right, mate? (ngoko, Surabaya Arek flavour)
  - title: Krama — basa kanggo ngajèni
    body:
      ar_eg: |
        krama للناس اللي مش صحابك أو أكبر منك: البياعة في السوق، حد غريب، حد أكبر منك.
        وهنا الكلمات نفسها بتتغير، مش الضمير بس:
        - kowé ← sampéyan (Anda)
        - wis ← sampun (sudah)
        - mangan ← nedha (makan)
        في الشات هتلاقي sampeyan من غير علامة، وsampun بتتكتب كتير mpun.
      ar: |
        الـ krama لغير الأصدقاء ولمن هو أكبر: البائعة في السوق، والغريب، والأكبر سنًا.
        وهنا تتغير الألفاظ نفسها لا الضمير وحده:
        - kowé ← sampéyan (Anda)
        - wis ← sampun (sudah)
        - mangan ← nedha (makan)
        وفي الدردشة تُكتب sampeyan بلا علامة، وكثيرًا ما تُكتب sampun هكذا: mpun.
      en: |
        Krama is for people who aren't your friends or who are older: a market seller, a stranger, an older person.
        Here the words themselves change, not just the pronoun:
        - kowé → sampéyan (Anda)
        - wis → sampun (sudah)
        - mangan → nedha (makan)
        In chats you'll see sampeyan without the accent, and sampun is often typed mpun.
    grammar: jv.speechlevel.overview
    examples:
      - text: Sampéyan sampun nedha, Bu?
        ar_eg: حضرتك كلتي يا مدام؟
        ar: هل أكلتِ يا سيدتي؟
        en: Have you eaten, ma'am?
  - title: Krama inggil lan krama andhap
    body:
      ar_eg: |
        فيه كمان طبقتين صغيرين من الكلمات:
        - krama inggil: كلمات «بترفع» الشخص اللي بتحترمه، وبتتقال عن أفعاله هو بس: dhahar (ياكل)، tindak (يروح)، وpanjenengan (سيادتك).
        - krama andhap: كلمات «بتنزّل» نفسك قدامه بتواضع: sowan (أزورك)، matur (أقولك)، nyuwun (أطلب منك).
        القاعدة الدهبية: عمرك ما تقول krama inggil عن نفسك. «Kula sampun dhahar» زي ما تقول «أنا سيادتي اتفضلت أكلت». لا، قول «Kula sampun nedha».
      ar: |
        وهناك طبقتان صغيرتان من الألفاظ:
        - krama inggil: ألفاظ ترفع المخاطَب المعظَّم، وتُقال عن أفعاله هو فقط: dhahar (يأكل)، tindak (يذهب)، وpanjenengan (سيادتك).
        - krama andhap: ألفاظ يتواضع بها المتكلم أمامه: sowan (أزور)، matur (أقول)، nyuwun (أطلب).
        والقاعدة الذهبية: لا تستعمل krama inggil عن نفسك أبدًا؛ فلا تقل «Kula sampun dhahar» بل «Kula sampun nedha».
      en: |
        There are two more small layers of words:
        - krama inggil: words that raise the person you honour, used only for their actions: dhahar (eat), tindak (go), and panjenengan (you).
        - krama andhap: words that humbly lower yourself toward them: sowan (visit), matur (tell), nyuwun (ask for).
        Golden rule: never use krama inggil about yourself. "Kula sampun dhahar" sounds like "I have graciously dined". Say "Kula sampun nedha".
    grammar: jv.speechlevel.overview
    examples:
      - text: Panjenengan sampun dhahar, Mbah?
        ar_eg: حضرتك أكلتي يا تيتة؟
        ar: هل تفضلتِ بالأكل يا جدتي؟
        en: Have you eaten, Grandma?
      - text: Kula sampun nedha.
        ar_eg: أنا كلت. (krama عادية عن نفسك)
        ar: قد أكلتُ. (krama عادية عن النفس)
        en: I've eaten. (plain krama about yourself)
  - title: Sapa karo sapa?
    body:
      ar_eg: |
        تختار إزاي؟
        - صاحبك (زي Mas Dimas) أو حد أصغر منك: ngoko.
        - البياعة (زي Bu Siti) أو حد غريب: krama.
        - جدة صاحبك أو المدرس: krama + krama inggil.
        وفي البيت: الأهل بيكلموا العيال ngoko، والعيال بيردوا krama.
        ولو مش متأكد خالص؟ الإندونيسي المؤدب (saya / Bapak / Ibu) مقبول مع أي حد، وجاويين كتير بيعملوا كده.
      ar: |
        كيف تختار؟
        - صديقك (مثل Mas Dimas) أو من هو أصغر: ngoko.
        - البائعة (مثل Bu Siti) أو الغريب: krama.
        - جدة صديقك أو المعلم: krama مع krama inggil.
        وفي البيت يخاطب الآباءُ الأبناءَ بالـ ngoko ويجيبهم الأبناء بالـ krama.
        وعند الشك فالإندونيسية المهذبة (saya / Bapak / Ibu) مقبولة مع الجميع.
      en: |
        How do you choose?
        - Your friend (like Mas Dimas) or someone younger: ngoko.
        - A seller (like Bu Siti) or a stranger: krama.
        - Your friend's grandmother or a teacher: krama + krama inggil.
        At home, parents speak ngoko to children and children answer in krama.
        Really unsure? Polite Indonesian (saya / Bapak / Ibu) is fine with anyone, and many Javanese do just that.
    grammar: jv.speechlevel.overview
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ngoko
        ar_eg: زي «إنت» — للصحاب
        ar: كـ«أنت» — للأصدقاء
        en: like «إنت» — for friends
      - text: krama
        ar_eg: زي «حضرتك» — للغريب والبياع
        ar: كـ«حضرتك» — للغريب والبائع
        en: like «حضرتك» — for strangers and sellers
      - text: krama inggil
        ar_eg: زي «سيادتك» — بترفع التاني
        ar: كـ«سيادتك» — ترفع المخاطَب
        en: like «سيادتك» — raises the other person
      - text: krama andhap
        ar_eg: كلمات بتتواضع بيها إنت
        ar: ألفاظ يتواضع بها المتكلم
        en: humble words for yourself
    words: [ngoko, krama, krama inggil, krama andhap]
  - id: e02
    type: match_pairs
    pairs:
      - text: mangan
        ar_eg: ياكل (ngoko)
        ar: يأكل (ngoko)
        en: eat (ngoko)
      - text: nedha
        ar_eg: ياكل (krama)
        ar: يأكل (krama)
        en: eat (krama)
      - text: dhahar
        ar_eg: ياكل (krama inggil، للمحترم بس)
        ar: يأكل (krama inggil، للمعظَّم فقط)
        en: eat (krama inggil, only for the honoured person)
      - text: sampun
        ar_eg: خلاص / قد (krama لـ wis)
        ar: قد / انتهى (krama لـ wis)
        en: already (krama for wis)
    words: [mangan, nedha, dhahar, sampun]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: بتكلم صاحبك Mas Dimas. تستخدم أنهي مستوى؟
      ar: تكلّم صديقك Mas Dimas. أيّ مستوى تستعمل؟
      en: You're talking to your friend Mas Dimas. Which level?
    options: ["krama inggil", "krama", "ngoko"]
    answer: 2
    explain:
      ar_eg: مع الصحاب ngoko، زي «إنت» بالظبط.
      ar: مع الأصدقاء يُستعمل ngoko، مثل «أنت».
      en: With friends you use ngoko, just like «إنت».
    words: [ngoko]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: بتشتري من Bu Siti، بياعة في السوق أكبر منك ومش تعرفها كويس. أنهي مستوى؟
      ar: تشتري من Bu Siti، بائعة في السوق أكبر منك ولا تعرفها جيدًا. أيّ مستوى؟
      en: You're buying from Bu Siti, an older market seller you don't know well. Which level?
    options: ["krama andhap", "krama", "ngoko"]
    answer: 1
    explain:
      ar_eg: البياع أو الغريب بياخد krama (≈ حضرتك). krama andhap مش مستوى لوحده، دي كلمات تواضع عن نفسك.
      ar: البائع والغريب لهما krama (≈ حضرتك)، أما krama andhap فألفاظ تواضع عن النفس لا مستوى مستقل.
      en: Sellers and strangers get krama (≈ حضرتك). Krama andhap isn't a separate level; it's humble words about yourself.
    words: [krama]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: جدة صاحبك بتسألك لو كلت. إنت كلت. تقول إيه؟
      ar: سألتك جدة صديقك هل أكلت، وقد أكلت. ماذا تقول؟
      en: Your friend's grandmother asks if you've eaten. You have. What do you say?
    options: ["Kula sampun dhahar.", "Aku wis dhahar.", "Kula sampun nedha."]
    answer: 2
    explain:
      ar_eg: dhahar كلمة تعظيم للتاني بس. عن نفسك قول nedha (krama عادية).
      ar: dhahar للتعظيم فلا تُقال عن النفس، وتقول عن نفسك nedha.
      en: dhahar honours the other person only; about yourself use plain krama nedha.
    words: [nedha, dhahar, kula]
  - id: e06
    type: listen
    text: Sampéyan sampun nedha?
    options: ["Kowé wis mangan?", "Sampéyan sampun nedha?", "Panjenengan sampun dhahar?"]
    answer: 1
    words: [sampéyan, sampun, nedha]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: قابلت جدة صاحبك. تسألها «كلتي؟» إزاي؟
      ar: قابلت جدة صديقك. كيف تسألها «هل أكلتِ؟»
      en: You meet your friend's grandmother. How do you ask "Have you eaten?"
    options: ["Sampéyan sampun nedha, Mbah?", "Kowé wis mangan, Mbah?", "Panjenengan sampun dhahar, Mbah?"]
    answer: 2
    explain:
      ar_eg: "الجدة محتاجة krama + krama inggil: panjenengan وdhahar."
      ar: "الجدة تُخاطب بالـ krama مع krama inggil: panjenengan وdhahar."
      en: "A grandmother gets krama plus krama inggil: panjenengan and dhahar."
    words: [panjenengan, dhahar]
  - id: e08
    type: fill_blank
    sentence: Kowé wis ___?
    meaning:
      ar_eg: كلت؟ (لصاحبك)
      ar: هل أكلت؟ (للصديق)
      en: Have you eaten? (to a friend)
    options: ["nedha", "mangan", "dhahar"]
    answers: [mangan]
    explain:
      ar_eg: "kowé وwis كلمات ngoko، يبقى الفعل كمان ngoko: mangan. ماينفعش تخلط المستويات."
      ar: "kowé وwis من الـ ngoko فيكون الفعل ngoko أيضًا: mangan."
      en: "kowé and wis are ngoko, so the verb is ngoko too: mangan. Keep one level per sentence."
    words: [mangan]
  - id: e09
    type: fill_blank
    sentence: Panjenengan sampun ___, Mbah?
    meaning:
      ar_eg: حضرتك أكلتي يا تيتة؟
      ar: هل تفضلتِ بالأكل يا جدتي؟
      en: Have you eaten, Grandma?
    options: ["nedha", "dhahar", "mangan"]
    answers: [dhahar]
    explain:
      ar_eg: "panjenengan معناها إنك بترفع الجدة، فالفعل بتاعها krama inggil: dhahar."
      ar: "panjenengan ترفع الجدة، ففعلها من krama inggil: dhahar."
      en: "panjenengan honours Grandma, so her action takes krama inggil: dhahar."
    words: [dhahar, panjenengan]
  - id: e10
    type: build_sentence
    source:
      ar_eg: حضرتك كلت؟ (لبياع)
      ar: هل أكلتَ؟ (لبائع)
      en: Have you eaten? (to a seller)
    answer: Sampéyan sampun nedha?
    distractors: [wis, mangan]
    words: [sampéyan, sampun, nedha]
  - id: e11
    type: translate
    direction: from_target
    source_text: Kula sampun nedha.
    answers_meaning:
      ar_eg: ["أنا كلت.", "أنا كلت", "كلت"]
      ar: ["قد أكلتُ.", "أكلتُ", "لقد أكلت"]
      en: ["I've eaten.", "I have eaten", "I already ate"]
    words: [kula, sampun, nedha]
  - id: e12
    type: speaking
    text: Panjenengan sampun dhahar, Mbah?
    meaning:
      ar_eg: حضرتك أكلتي يا تيتة؟
      ar: هل تفضلتِ بالأكل يا جدتي؟
      en: Have you eaten, Grandma?
    words: [panjenengan, sampun, dhahar]
dialogue:
  title: Tekan Solo Balapan
  lines:
    - speaker: Mas Dimas
      text: Mohamed, iki Solo Balapan!
      ar_eg: محمد، دي محطة سولو بالابان!
      ar: يا محمد، هذه محطة سولو بالابان!
      en: Mohamed, this is Solo Balapan!
    - speaker: Mohamed
      text: Mas, aku arep sinau krama.
      ar_eg: يا دِيماس، أنا عايز أتعلم الكراما.
      ar: يا ديماس، أريد أن أتعلم الكراما.
      en: Dimas, I want to learn krama.
    - speaker: Mas Dimas
      text: "Apik! Karo kancamu: «Kowé wis mangan?»"
      ar_eg: "حلو! مع صاحبك: «Kowé wis mangan?»"
      ar: "جميل! مع صديقك: «Kowé wis mangan?»"
      en: "Great! With your friend: «Kowé wis mangan?»"
    - speaker: Mas Dimas
      text: "Karo bakul: «Sampéyan sampun nedha?»"
      ar_eg: "مع البياع: «Sampéyan sampun nedha?»"
      ar: "مع البائع: «Sampéyan sampun nedha?»"
      en: "With a seller: «Sampéyan sampun nedha?»"
    - speaker: Mohamed
      text: Karo mbahmu?
      ar_eg: ومع جدتك؟
      ar: ومع جدتك؟
      en: And with your grandmother?
    - speaker: Mas Dimas
      text: "«Panjenengan sampun dhahar, Mbah?» Aja «kowé», ya!"
      ar_eg: "«Panjenengan sampun dhahar, Mbah?» وإوعى تقول «kowé»!"
      ar: "«Panjenengan sampun dhahar, Mbah?» وإياك أن تقول «kowé»!"
      en: "«Panjenengan sampun dhahar, Mbah?» And no «kowé», OK!"
new_words:
  - word: unggah-ungguh
    pos: noun
    ar_eg: آداب الكلام (اختيار المستوى)
    ar: آداب الكلام (اختيار المستوى)
    en: speech etiquette (choosing the level)
  - word: ngoko
    pos: noun
    ar_eg: المستوى العادي بين الصحاب (≈ إنت)
    ar: المستوى العادي بين الأقران (≈ أنت)
    en: the plain level among friends (≈ إنت)
  - word: krama
    pos: noun
    ar_eg: المستوى المؤدب (≈ حضرتك)
    ar: المستوى المهذب (≈ حضرتك)
    en: the polite level (≈ حضرتك)
  - word: krama inggil
    pos: noun
    ar_eg: كلمات بترفع الشخص المحترم (≈ سيادتك)
    ar: ألفاظ ترفع المعظَّم (≈ سيادتك)
    en: honorific words that raise the other person (≈ سيادتك)
  - word: krama andhap
    pos: noun
    ar_eg: كلمات تواضع عن نفسك
    ar: ألفاظ تواضع عن النفس
    en: humble words about yourself
  - word: sampéyan
    pos: pronoun
    ar_eg: حضرتك (krama، chat sampeyan) = Anda
    ar: حضرتك (krama) = Anda
    en: you (krama, everyday polite; chat sampeyan) = Anda
  - word: panjenengan
    pos: pronoun
    ar_eg: سيادتك (krama inggil)
    ar: سيادتك (krama inggil)
    en: you (krama inggil, honorific)
  - word: sampun
    pos: adverb
    ar_eg: خلاص / قد (krama لـ wis، chat mpun) = sudah
    ar: قد (krama لـ wis) = sudah
    en: already (krama for wis; chat mpun) = sudah
  - word: nedha
    pos: verb
    ar_eg: ياكل (krama لـ mangan)
    ar: يأكل (krama لـ mangan)
    en: eat (krama for mangan)
  - word: dhahar
    pos: verb
    ar_eg: ياكل (krama inggil، للمحترم بس)
    ar: يأكل (krama inggil، للمعظَّم فقط)
    en: eat (krama inggil, only about the honoured person)
  - word: kula
    pos: pronoun
    ar_eg: أنا (krama، chat kulo) = saya
    ar: أنا (krama) = saya
    en: I (krama; chat kulo) = saya
  - word: bakul
    pos: noun
    ar_eg: بياع / بياعة
    ar: بائع / بائعة
    en: seller, vendor
