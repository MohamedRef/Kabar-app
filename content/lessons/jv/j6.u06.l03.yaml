schema: kabar.lesson/v1
id: j6.u06.l03
language: jv
title: Ing pondok
can_do:
  ar_eg: 'تفهم الحياة في المعهد الديني: طرق التدريس، والمعنى المعلّق تحت الكلام العربي، والسكن.'
  ar: 'أن تفهم الحياة في المعهد الديني: طرق التدريس، والمعنى المعلّق تحت النص العربي، والسكن.'
  en: 'Follow life at a pesantren: the teaching methods, the hanging gloss under Arabic text, and the dormitory.'
slides:
  - title: Sorogan lan bandongan
    body:
      ar_eg: |
        pondok = المعهد الديني (pondok pesantren)، asrama = السكن اللي بينام فيه الطلاب، pengasuh = شيخ المعهد والمسؤول عنه.
        sorogan = الطالب بيقرا الكتاب لوحده قدام الشيخ. bandongan = الشيخ بيقرا والطلاب كلهم بيسمعوا ويكتبوا.
        makna = معنى، gandul = متعلّق: makna gandul = المعنى المكتوب بالبيغون مايل تحت كل كلمة عربي.
        tasbih = سبحة (ومن العربي «تسبيح»).
      ar: |
        pondok = المعهد الديني (pondok pesantren)، asrama = سكن الطلاب، pengasuh = شيخ المعهد والقائم عليه.
        sorogan = يقرأ الطالب الكتاب منفردًا أمام الشيخ. bandongan = يقرأ الشيخ ويستمع الطلاب جميعًا ويكتبون.
        makna = معنى، gandul = معلّق: makna gandul = المعنى المكتوب بالبيغون مائلًا تحت كل كلمة عربية.
        tasbih = مسبحة (من «تسبيح»).
      en: |
        pondok = Islamic boarding school (pondok pesantren), asrama = dormitory, pengasuh = the kyai who heads the pesantren.
        sorogan = a student reads the book alone before the teacher. bandongan = the teacher reads while many students listen and write.
        makna = meaning, gandul = hanging: makna gandul = the Pegon gloss written slanting under each Arabic word.
        tasbih = prayer beads (from Arabic تسبيح).
    examples:
      - text: Santri turu ing asrama pondok.
        ar_eg: الطلاب بيناموا في سكن المعهد.
        ar: ينام الطلاب في سكن المعهد.
        en: The students sleep in the pesantren dormitory.
      - text: Ing bandongan, santri nulis makna gandul.
        ar_eg: في البندونغان، الطلاب بيكتبوا المعنى المعلّق.
        ar: في البندونغان يكتب الطلاب المعنى المعلّق.
        en: In bandongan, students write the hanging gloss.
      - text: Pengasuh pondok maca kitab.
        ar_eg: شيخ المعهد بيقرا الكتاب.
        ar: يقرأ شيخ المعهد الكتاب.
        en: The head of the pesantren reads the book.
