dialogue:
  lines:
    - speaker: Gus Hanif
      text: Sugeng rawuh ing pondok kula, Mas Mohamed.
      ar_eg: أهلًا بيك في معهدنا يا محمد.
      ar: مرحبًا بك في معهدنا يا محمد.
      en: Welcome to our pesantren, Mohamed.
    - speaker: Mohamed
      text: Matur nuwun, Gus. Santri-santri sami wonten pundi?
      ar_eg: شكرًا يا شيخ. الطلاب فين؟
      ar: شكرًا يا شيخ. أين الطلاب؟
      en: Thank you, Gus. Where are the students?
    - speaker: Gus Hanif
      text: Sakmenika wonten bandongan. Bapak kula, pengasuh pondok, maos kitab.
      ar_eg: دلوقتي فيه درس جماعي. أبويا، شيخ المعهد، بيقرا الكتاب.
      ar: الآن درس جماعي. أبي، شيخ المعهد، يقرأ الكتاب.
      en: There's a bandongan now. My father, the head of the pesantren, is reading the book.
    - speaker: Mohamed
      text: Santri nyerat menapa ing kitabipun?
      ar_eg: الطلاب بيكتبوا إيه في كتبهم؟
      ar: ماذا يكتب الطلاب في كتبهم؟
      en: What do the students write in their books?
    - speaker: Gus Hanif
      text: Makna gandul, mawi Pegon. Enjing-enjing wonten sorogan.
      ar_eg: المعنى المعلّق بالبيغون. والصبح بدري فيه قراية فردية.
      ar: المعنى المعلّق بالبيغون. وفي الصباح الباكر قراءة فردية.
      en: The hanging gloss, in Pegon. Early in the morning there's sorogan.
    - speaker: Mohamed
      text: Sae sanget. Kula kepengin nyobi!
      ar_eg: حلو أوي. نفسي أجرب!
      ar: رائع. أودّ أن أجرّب!
      en: Wonderful. I'd love to try!
