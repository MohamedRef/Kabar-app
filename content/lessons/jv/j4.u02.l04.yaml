schema: kabar.lesson/v1
id: j4.u02.l04
language: jv
title: Simbah gerah
can_do:
  ar_eg: تسأل عن حد كبير عيان، وتقول إيه اللي واجعه، وتدعيله بالشفا.
  ar: أن تسأل عن كبير مريض، وتقول ما يؤلمه، وتدعو له بالعافية.
  en: Ask after an elder who is unwell, say what hurts, and wish them well.
slides:
  - title: Padharan, jaja, talingan
    body:
      ar_eg: |
        لما الكبير عيان، أعضاء جسمه برضه ليها كلمات krama inggil:
        - padharan = بطن (لـ weteng)، jaja = صدر (لـ dhadha)، talingan = ودن (لـ kuping).
          «Simbah gerah padharanipun» = بطن تيتة واجعاها.
        - jamu = مشروب أعشاب جاوي تقليدي، زي الحلبة والينسون عندنا.
        - mugi = ياريت، إن شاء الله (كراما)، wilujeng = بخير وسليم (كراما لـ slamet): «Mugi Simbah wilujeng.»
        - pandonga = دعاء (كراما): «Pandonga kula kagem Simbah» = دعايا لتيتة.
        - lega = ارتاح واطمّن.
      ar: |
        حين يمرض الكبير تكون لأعضاء جسده كلمات krama inggil أيضًا:
        - padharan = بطن (لـ weteng)، jaja = صدر (لـ dhadha)، talingan = أذن (لـ kuping).
          «Simbah gerah padharanipun» = تؤلم الجدّةَ بطنُها.
        - jamu = شراب أعشاب جاوي تقليدي، كالحلبة واليانسون عندنا.
        - mugi = عسى، إن شاء الله (كراما)، wilujeng = سالم بخير (كراما لـ slamet): «Mugi Simbah wilujeng.»
        - pandonga = دعاء (كراما): «Pandonga kula kagem Simbah» = دعائي للجدّة.
        - lega = مرتاح مطمئنّ.
      en: |
        An elder's body also has krama inggil words when they're unwell:
        - padharan = stomach (for weteng), jaja = chest (for dhadha), talingan = ear (for kuping).
          "Simbah gerah padharanipun" = Grandma has a stomach ache.
        - jamu = traditional Javanese herbal drink, like our fenugreek or aniseed tea.
        - mugi = may, hopefully (krama), wilujeng = safe and well (krama for slamet): "Mugi Simbah wilujeng."
        - pandonga = prayer, good wishes (krama): "Pandonga kula kagem Simbah" = my prayers are with Grandma.
        - lega = relieved.
    examples:
      - text: Simbah gerah padharanipun.
        ar_eg: تيتة بطنها واجعاها.
        ar: تؤلم الجدّةَ بطنُها.
        en: Grandma has a stomach ache.
      - text: Mugi Simbah wilujeng, nggih.
        ar_eg: ياريت تيتة تبقى بخير.
        ar: عسى أن تكون الجدّة بخير.
        en: I hope Grandma will be well.
      - text: Kula lega, Simbah sampun dhahar.
        ar_eg: أنا ارتحت، تيتة أكلت.
        ar: اطمأننتُ، فقد أكلت الجدّة.
        en: I'm relieved, Grandma has eaten.
