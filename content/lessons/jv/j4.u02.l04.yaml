  - id: e03
    type: listen
    text: Simbah gerah jajanipun.
    question:
      ar_eg: تيتة مالها؟
      ar: ما بال الجدّة؟
      en: What's wrong with Grandma?
    options: [صدر تيتة واجعها, ودن تيتة واجعاها, تيتة بخير]
    answer: 0
    meaning:
      ar_eg: تيتة صدرها واجعها.
      ar: يؤلم الجدّةَ صدرُها.
      en: Grandma has chest pain.
    words: [jaja]
  - id: e04
    type: fill_blank
    sentence: Simbah gerah ___, mboten kersa dhahar.
    meaning:
      ar_eg: تيتة ___ واجعاها، مش عايزة تاكل.
      ar: الجدّة يؤلمها ___ ولا تريد أن تأكل.
      en: Grandma's ___ hurts; she doesn't want to eat.
    options: [padharanipun, talinganipun, pandonganipun]
    answers: [padharanipun]
    words: [padharan, talingan, pandonga]
    explain:
      ar_eg: "مش عايزة تاكل، يبقى بطنها اللي بتوجعها: padharanipun. talinga ودن، وpandonga دعاء."
      ar: "لا تريد أن تأكل، فالألم في بطنها: padharanipun، أما talinga فأذن، وpandonga دعاء."
      en: "She won't eat, so it's her stomach: padharanipun. talinga is an ear, pandonga a prayer."
  - id: e05
    type: multiple_choice
    question: Simbah mboten saged midhanget. ___ Simbah gerah.
    question_meaning:
      ar_eg: تيتة مش قادرة تسمع. ___ تيتة واجعاها.
      ar: الجدّة لا تستطيع السمع. ___ الجدّة تؤلمها.
      en: Grandma can't hear. Grandma's ___ hurts.
    options: [Padharanipun, Talinganipun, Jajanipun]
    answer: 1
    explain:
      ar_eg: talingan = ودن، عشان كده مش سامعة.
      ar: talingan = أذن، ولذا لا تسمع.
      en: talingan = ear, which is why she can't hear.
    words: [talingan, padharan, jaja]
  - id: e06
    type: fill_blank
    sentence: ___ Simbah wilujeng.
    meaning:
      ar_eg: ___ تيتة تبقى بخير.
      ar: ___ تكون الجدّة بخير.
      en: ___ Grandma be well.
    options: [Mugi, Lega, Jamu]
    answers: [Mugi]
    words: [mugi, lega, jamu, wilujeng]
    explain:
      ar_eg: Mugi = يا رب، ربنا يخلّي. lega يعني مرتاح، وjamu مشروب أعشاب.
      ar: Mugi = عسى، أتمنّى أن. أما lega فمعناه مرتاح، وjamu شراب أعشاب.
      en: Mugi = may, I hope. lega means "relieved", jamu is a herbal drink.
  - id: e07
    type: build_sentence
    source:
      ar_eg: ده جامو لتيتة.
      ar: هذا الجامو للجدّة.
      en: This jamu is for Grandma.
    answer: Jamu menika kagem Simbah.
    distractors: [pandonga, jaja]
    words: [jamu]
    explain:
      ar_eg: الجملة عن الـ jamu، مشروب الأعشاب. pandonga دعاء، وjaja صدر الكبير.
      ar: الجملة عن الـ jamu، شراب الأعشاب، أما pandonga فدعاء، وjaja صدر الكبير.
      en: The sentence is about jamu, the herbal drink. pandonga is a prayer, jaja an elder's chest.
  - id: e08
    type: translate
    direction: from_target
    source_text: Pandonga kula kagem Simbah.
    answers_meaning:
      ar_eg: [دعايا لتيتة, بدعيلك يا تيتة]
      ar: [دعائي للجدّة, أدعو للجدّة]
      en: [My prayers are with Grandma, My prayers for Grandma]
    words: [pandonga]
  - id: e09
    type: speaking
    text: Kula lega, Simbah sampun wilujeng.
    meaning:
      ar_eg: ارتحت، تيتة بقت بخير.
      ar: اطمأننتُ، فالجدّة بخير الآن.
      en: I'm relieved, Grandma is well now.
    words: [lega, wilujeng]
  - id: e10
    type: multiple_choice
    question: 'Dhokter: «Simbah sampun wilujeng.» Mohamed ___.'
    question_meaning:
      ar_eg: 'الدكتور: «تيتة بقت بخير». محمد ___.'
      ar: 'الطبيب: «الجدّة بخير». محمد ___.'
      en: 'Doctor: ''Grandma is well now.'' Mohamed feels ___.'
    options: [lega, gerah, mugi]
    answer: 0
    explain:
      ar_eg: lega = ارتاح واطمّن.
      ar: lega = اطمأنّ وارتاح.
      en: lega = relieved.
    words: [lega, mugi, wilujeng]
dialogue:
  lines:
    - speaker: Mohamed
      text: Bu, Simbah wonten pundi?
      ar_eg: يا هانم، تيتة فين؟
      ar: يا سيدتي، أين الجدّة؟
      en: Ma'am, where's Grandma?
    - speaker: Bu Harsono
      text: Simbah saweg sare, Mas. Simbah gerah padharanipun.
      ar_eg: تيتة نايمة يا ماس. بطنها واجعاها.
      ar: الجدّة نائمة يا ماس، تؤلمها بطنها.
      en: Grandma's asleep, Mas. She has a stomach ache.
    - speaker: Mohamed
      text: Ngapunten, Bu. Simbah sampun ngunjuk jamu?
      ar_eg: سلامتها يا هانم. شربت جامو؟
      ar: سلامتها يا سيدتي. هل شربت الجامو؟
      en: I'm sorry, ma'am. Has she had some jamu?
    - speaker: Bu Harsono
      text: Sampun, Mas. Sakmenika Simbah sampun wilujeng.
      ar_eg: أيوه يا ماس. ودلوقتي بقت بخير.
      ar: نعم يا ماس، وهي الآن بخير.
      en: Yes, Mas. She's well now.
    - speaker: Mohamed
      text: Alhamdulillah, kula lega. Pandonga kula kagem Simbah.
      ar_eg: الحمد لله، ارتحت. دعايا ليها.
      ar: الحمد لله، اطمأننت. دعائي لها.
      en: Thank God, I'm relieved. My prayers are with her.
    - speaker: Bu Harsono
      text: Matur nuwun, Mas. Mugi Simbah enggal saged dhahar.
      ar_eg: شكرًا يا ماس. ياريت تقدر تاكل قريب.
      ar: شكرًا يا ماس. عسى أن تتمكّن من الأكل قريبًا.
      en: Thank you, Mas. I hope she can eat again soon.
