schema: kabar.lesson/v1
id: j4.u04.l03
language: jv
title: Basa awak
can_do:
  ar_eg: تمشّي الحركة مع الكلام.
  ar: أن توافق بين الإيماءة والكلام.
  en: Match gestures to speech.
slides:
  - title: Tangan tengen
    body:
      ar_eg: |
        الأدب الجاوي كلام + حركة، وكتير منه زي أدبنا:
        - الإيد اليمين (tangan tengen) دايمًا: تدّي وتاخد وتسلّم (salaman) بيها. الشمال (kiwa) لأ.
        - لو بتشاور على حاجة أو مكان: اقفل إيدك وشاور بالصباع الكبير (الإبهام، jempol)، مش بالسبابة. السبابة قليلة ذوق عندهم.
        tengen وkiwa عرفت أصلهم من nengen وngiwa في J1. وsalaman من العربي «سلام»، وngangge = nganggo (يستخدم) بالكراما.
        - lho وto كلمات صغيرة بتدّي الجملة إحساس، ومن غيرها الجملة صح برضه.
      ar: |
        الأدب الجاوي قول وفعل، وكثير منه كآدابنا:
        - اليد اليمنى (tangan tengen) دائمًا: للعطاء والأخذ والمصافحة (salaman)، لا اليسرى (kiwa).
        - وإذا أشرتَ إلى شيء أو مكان فاقبض يدك وأشر بالإبهام (jempol) لا بالسبابة؛ فالإشارة بالسبابة غير مهذبة عندهم.
        وقد عرفتَ أصل tengen وkiwa من nengen وngiwa في J1. وsalaman من العربية «سلام»، وngangge = nganggo (يستعمل) بالكراما.
        - lho وto أدوات صغيرة تلوّن الجملة، والجملة صحيحة بدونها.
      en: |
        Javanese courtesy is words plus gestures, and much of it matches Egyptian manners:
        - Always the right hand (tangan tengen): give, take and shake hands (salaman) with it. Not the left (kiwa).
        - Pointing at a thing or a place: close your hand and point with your thumb (jempol), not your index finger, which is rude there.
        You know tengen and kiwa from nengen and ngiwa in J1. salaman comes from Arabic «سلام», and ngangge is the krama of nganggo (use).
        - lho and to are small particles that add feeling; the sentence is correct without them.
    grammar: jv.etiquette.phrases
    examples:
      - text: Salaman ngangge tangan tengen.
        ar_eg: سلّم بالإيد اليمين.
        ar: صافِح باليد اليمنى.
        en: Shake hands with your right hand.
      - text: Sampun ngangge tangan kiwa.
        ar_eg: ماتستخدمش الإيد الشمال.
        ar: لا تستعمل اليد اليسرى.
        en: Don't use your left hand.
  - title: Nuwun sewu, ndherek langkung
    body:
      ar_eg: |
        لو لازم تعدّي قدام ناس كبار قاعدين: وطّي جسمك شوية، ومدّ إيدك اليمين لتحت قدامك، وقول: «Nuwun sewu, ndherek langkung» = لا مؤاخذة، بعد إذنكم أعدّي.
        nuwun sewu هي الشكل القصير لـ nyuwun sewu اللي عرفتها. وlangkung = يعدّي (كراما لـ liwat)، وndherek عرفتها: «أمشي معاكم».
        والناس هيردوا: «Mangga, mangga.»
      ar: |
        إذا اضطررت إلى المرور أمام كبار جالسين: انحنِ قليلًا، ومدّ يدك اليمنى إلى أسفل أمامك، وقل: «Nuwun sewu, ndherek langkung» = عفوًا، بعد إذنكم أمرّ.
        وnuwun sewu صيغة مختصرة من nyuwun sewu، وlangkung = يمرّ (كراما لـ liwat)، وndherek عرفتها.
        ويجيبونك: «Mangga, mangga.»
      en: |
        If you have to pass in front of seated elders: stoop a little, lower your right hand in front of you, and say "Nuwun sewu, ndherek langkung" = excuse me, may I pass.
        nuwun sewu is the short form of the nyuwun sewu you know; langkung = pass (krama for liwat), and you know ndherek.
        People answer: "Mangga, mangga."
    grammar: jv.etiquette.phrases
    examples:
      - text: Nuwun sewu, ndherek langkung.
        ar_eg: لا مؤاخذة، بعد إذنكم أعدّي.
        ar: عفوًا، بعد إذنكم أمرّ.
        en: Excuse me, may I pass?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ndherek langkung
        ar_eg: بعد إذنكم أعدّي
        ar: بعد إذنكم أمرّ
        en: excuse me, may I pass
      - text: tengen
        ar_eg: يمين
        ar: يمين
        en: right (side)
      - text: kiwa
        ar_eg: شمال
        ar: يسار
        en: left (side)
      - text: salaman
        ar_eg: يسلّم باليد
        ar: يصافح
        en: shake hands
    words: [ndherek langkung, tengen, kiwa, salaman]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: لازم تعدّي قدام ضيوف Pak Harsono وهم قاعدين. تقول إيه وإنت موطّي؟
      ar: عليك أن تمرّ أمام ضيوف Pak Harsono وهم جالسون. ماذا تقول وأنت منحنٍ؟
      en: You need to pass in front of Pak Harsono's seated guests. What do you say as you stoop?
    options: ['Nuwun sewu, ndherek langkung.', 'Kula nuwun!', 'Sugeng tindak.']
    answer: 0
    explain:
      ar_eg: "Kula nuwun على الباب، وSugeng tindak للي ماشي. للعدّية: ndherek langkung."
      ar: Kula nuwun عند الباب، وSugeng tindak لمن ينصرف، وللمرور ndherek langkung.
      en: "Kula nuwun is for the door and Sugeng tindak for someone leaving. For passing: ndherek langkung."
    words: [ndherek langkung]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: بتاخد كوباية شاي من Bu Ningsih. تاخدها بأنهي إيد؟
      ar: تأخذ كوب شاي من Bu Ningsih. بأي يد تأخذه؟
      en: You take a glass of tea from Bu Ningsih. Which hand do you use?
    options: [tangan kiwa, tangan tengen]
    answer: 1
    explain:
      ar_eg: اليمين دايمًا (tengen)، زي أدبنا بالظبط.
      ar: اليمنى دائمًا (tengen)، كآدابنا.
      en: Always the right (tengen), just like at home.
    words: [tengen, kiwa]
  - id: e04
    type: listen
    text: Salaman ngangge tangan tengen.
    options: ['Salaman ngangge tangan kiwa.', 'Mangga lenggah, Mas.', 'Salaman ngangge tangan tengen.']
    answer: 2
    meaning:
      ar_eg: سلّم بالإيد اليمين.
      ar: صافِح باليد اليمنى.
      en: Shake hands with your right hand.
    words: [salaman, tengen]
  - id: e05
    type: fill_blank
    sentence: Sampun ngangge tangan ___.
    meaning:
      ar_eg: ماتستخدمش الإيد الشمال.
      ar: لا تستعمل اليد اليسرى.
      en: Don't use your left hand.
    options: [kiwa, tengen, salaman]
    answers: [kiwa]
    words: [kiwa]
    explain:
      ar_eg: "Sampun = ما تعملش، والإيد اللي مش مؤدّبة هي الشمال: kiwa. tengen اليمين المؤدّبة، وsalaman السلام بالإيد."
      ar: "Sampun = لا تفعل، واليد غير المهذّبة هي اليسرى: kiwa، أما tengen فاليمنى المهذّبة، وsalaman المصافحة."
      en: "Sampun = don't, and the impolite hand is the left: kiwa. tengen is the polite right, salaman a handshake."
  - id: e06
    type: fill_blank
    sentence: Nuwun sewu, ndherek ___.
    meaning:
      ar_eg: لا مؤاخذة، بعد إذنكم أعدّي.
      ar: عفوًا، بعد إذنكم أمرّ.
      en: Excuse me, may I pass?
    options: [langkung, rawuh, sowan]
    answers: [langkung]
    words: [ndherek langkung]
    explain:
      ar_eg: ndherek langkung = بعد إذنك أعدّي. rawuh لوصول الكبير، وsowan للزيارة.
      ar: ndherek langkung = بعد إذنك أمرّ، أما rawuh فلقدوم الكبير، وsowan للزيارة.
      en: ndherek langkung = may I pass. rawuh is an elder arriving, sowan a visit.
  - id: e07
    type: build_sentence
    source:
      ar_eg: سلّم بالإيد اليمين.
      ar: صافِح باليد اليمنى.
      en: Shake hands with your right hand.
    answer: Salaman ngangge tangan tengen.
    distractors: [kiwa, mlebet]
    words: [salaman, tengen]
    explain:
      ar_eg: "السلام بالإيد اليمين: tengen. kiwa الشمال، وmlebet يعني يدخل."
      ar: "المصافحة باليمنى: tengen، أما kiwa فاليسرى، وmlebet معناه يدخل."
      en: "Shake with the right hand: tengen. kiwa is left, mlebet means \"enter\"."
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (وإنت معدّي قدام ناس كبار قاعدين) لا مؤاخذة، بعد إذنكم أعدّي.
      ar: (وأنت تمرّ أمام كبار جالسين) عفوًا، بعد إذنكم أمرّ.
      en: (passing seated elders) Excuse me, may I pass?
    answers: ['Nuwun sewu, ndherek langkung.', 'Nyuwun sewu, ndherek langkung.', 'Ndherek langkung.', 'Nuwun sewu, ndherek langkung, Pak.', 'Nuwun sewu, ndherek langkung, Bu.', 'Nyuwun sewu, ndherek langkung, Pak.', 'Nyuwun sewu, ndherek langkung, Bu.']
    words: [ndherek langkung]
  - id: e09
    type: speaking
    text: Nuwun sewu, Bu, ndherek langkung.
    meaning:
      ar_eg: لا مؤاخذة يا هانم، بعد إذنك أعدّي.
      ar: عفوًا يا سيدتي، بعد إذنكِ أمرّ.
      en: Excuse me, ma'am, may I pass?
    words: [ndherek langkung]
dialogue:
  title: Tamu-tamu ing pendhapa
  lines:
    - speaker: Mohamed
      text: Nuwun sewu, ndherek langkung.
      ar_eg: لا مؤاخذة، بعد إذنكم أعدّي.
      ar: عفوًا، بعد إذنكم أمرّ.
      en: Excuse me, may I pass?
    - speaker: Pak Marto
      text: Mangga, Mas, mangga.
      ar_eg: اتفضل يا ابني، اتفضل.
      ar: تفضّل يا بني، تفضّل.
      en: Go ahead, go ahead.
    - speaker: Mas Dimas
      text: Apik, Mohamed! Kowe wis ngerti unggah-ungguh.
      ar_eg: برافو يا محمد! إنت بقيت فاهم الأصول.
      ar: أحسنت يا محمد! صرت تعرف آداب الكلام.
      en: Nice one, Mohamed! You've got the etiquette down.
    - speaker: Mohamed
      text: Iya, Mas. Salaman uga nganggo sing tengen, to?
      ar_eg: آه يا دِيماس. والسلام بالإيد كمان باليمين، صح؟
      ar: نعم يا ديماس. والمصافحة أيضًا باليمنى، أليس كذلك؟
      en: Yes. And handshakes are with the right one too, right?
    - speaker: Mas Dimas
      text: Bener! Aja sing kiwa, lho.
      ar_eg: مظبوط! مش بالشمال.
      ar: صحيح! لا باليسرى.
      en: Right! Never the left.
new_words:
  - word: ndherek langkung
    pos: phrase
    ar_eg: بعد إذنكم أعدّي (وإنت معدّي قدام ناس قاعدين)
    ar: بعد إذنكم أمرّ (عند المرور أمام الجالسين)
    en: excuse me, may I pass (when passing seated people) = numpang lewat
  - word: tengen
    pos: noun
    ar_eg: يمين (tangan tengen = الإيد اليمين)
    ar: يمين (tangan tengen = اليد اليمنى)
    en: right side (tangan tengen = right hand) = kanan
  - word: kiwa
    pos: noun
    ar_eg: شمال (tangan kiwa = الإيد الشمال)
    ar: يسار (tangan kiwa = اليد اليسرى)
    en: left side (tangan kiwa = left hand) = kiri
  - word: salaman
    pos: verb
    ar_eg: يسلّم باليد
    ar: يصافح
    en: shake hands = bersalaman
    arabic: سلام
    bridge: salam
