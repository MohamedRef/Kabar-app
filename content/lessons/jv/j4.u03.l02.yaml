schema: kabar.lesson/v1
id: j4.u03.l02
language: jv
title: Nyuwun pirsa
can_do:
  ar_eg: تطلب حاجة وتسأل سؤال بتواضع.
  ar: أن تطلب شيئًا وتسأل سؤالًا بتواضع.
  en: Ask for things and ask questions humbly.
slides:
  - title: Njaluk → nyuwun
    body:
      ar_eg: |
        - يطلب: njaluk (نغوكو) → nyuwun (كراما وتواضع). بالإندونيسي: minta. «Kula nyuwun teh setunggal» = عايز شاي واحد لو سمحت.
        - يسأل بتواضع: nyuwun pirsa، حرفيًا «أطلب أعرف». دي أحلى بداية لأي سؤال لحد كبير: «Nyuwun pirsa, Pak, …» = بعد إذنك يا أستاذ، …
        - والكبير لما يطلب أو يشتري أو ياخد: mundhut (krama inggil). «Bapak badhe mundhut menapa?» = حضرتك عايز تشتري / تاخد إيه؟
        يعني إنت nyuwun، وهو mundhut. وإنت tumbas، وهو mundhut.
      ar: |
        - يطلب: njaluk (نغوكو) → nyuwun (كراما وتواضع)، وبالإندونيسية minta: «Kula nyuwun teh setunggal».
        - يسأل بتواضع: nyuwun pirsa، أي «أطلب أن أعلم»، وهي أفضل مفتتح لسؤال الكبير: «Nyuwun pirsa, Pak, …».
        - وإذا طلب الكبير أو اشترى أو أخذ: mundhut (krama inggil): «Bapak badhe mundhut menapa?».
        فأنت nyuwun وهو mundhut، وأنت tumbas وهو mundhut.
      en: |
        - ask for: njaluk (ngoko) → nyuwun (krama, humble). Indonesian: minta. "Kula nyuwun teh setunggal" = One tea, please.
        - ask a question humbly: nyuwun pirsa, lit. "I request to know". The golden opener for any question to an elder: "Nyuwun pirsa, Pak, …".
        - When the elder asks for, buys or takes something: mundhut (krama inggil). "Bapak badhe mundhut menapa?" = What would you like, sir?
        So you nyuwun, they mundhut; you tumbas, they mundhut.
    grammar: jv.krama-andhap
    examples:
      - text: Nyuwun pirsa, Pak, Taman Sari wonten pundi?
        ar_eg: بعد إذنك يا أستاذ، تامان ساري فين؟
        ar: لو سمحت يا سيدي، أين تامان ساري؟
        en: Excuse me, sir, may I ask where Taman Sari is?
      - text: Bapak badhe mundhut menapa?
        ar_eg: حضرتك عايز تاخد إيه يا أستاذ؟
        ar: ماذا تودّ أن تأخذ يا سيدي؟
        en: What would you like, sir?
  - title: Nyuwun pamit
    body:
      ar_eg: |
        وإنت ماشي من عند حد كبير: «Kula nyuwun pamit rumiyin» = أستأذن أنا. ودي أحسن بكتير من «kula wangsul» لوحدها.
        وكمان هتسمع «Nyuwun tulung» = لو سمحت ساعدني.
      ar: |
        وعند الانصراف من عند الكبير: «Kula nyuwun pamit rumiyin» = أستأذنكم في الانصراف، وهي أليق من «kula wangsul» وحدها.
        وستسمع أيضًا «Nyuwun tulung» = أرجو المساعدة.
      en: |
        Leaving an elder's company: "Kula nyuwun pamit rumiyin" = please excuse me, I'll be going. Much nicer than a bare "kula wangsul".
        You'll also hear "Nyuwun tulung" = please help me.
    grammar: jv.krama-andhap
    examples:
      - text: Kula nyuwun pamit rumiyin, Pak.
        ar_eg: أستأذن أنا يا أستاذ.
        ar: أستأذنكم في الانصراف يا سيدي.
        en: Please excuse me, I'll be going, sir.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nyuwun
        ar_eg: أطلب (بتواضع)
        ar: أطلب (بتواضع)
        en: ask for (humbly)
      - text: nyuwun pirsa
        ar_eg: بعد إذنك أسأل
        ar: أستأذن في السؤال
        en: may I ask
      - text: mundhut
        ar_eg: الكبير يطلب / يشتري / ياخد
        ar: يطلب الكبير / يشتري / يأخذ
        en: (the elder) asks for, buys, takes
      - text: nyuwun pamit
        ar_eg: أستأذن أمشي
        ar: أستأذن في الانصراف
        en: ask leave to go
    words: [nyuwun, nyuwun pirsa, mundhut, nyuwun pamit]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تسأل راجل كبير تامان ساري فين. أنهي بداية أحسن؟
      ar: تريد أن تسأل رجلًا كبيرًا عن مكان تامان ساري. أي بداية أفضل؟
      en: You want to ask an old man where Taman Sari is. Which is the best way?
    options: ['Nyuwun pirsa, Pak, Taman Sari wonten pundi?', 'Pak, Taman Sari ngendi?', 'Bapak ndangu, Taman Sari wonten pundi?']
    answer: 0
    explain:
      ar_eg: nyuwun pirsa هي البداية المتواضعة. ndangu لسؤال الكبير هو، مش سؤالك إنت.
      ar: nyuwun pirsa هي المفتتح المتواضع، وndangu لسؤال الكبير لا لسؤالك.
      en: nyuwun pirsa is the humble opener. ndangu is the elder asking, not you.
    words: [nyuwun pirsa]
  - id: e03
    type: listen
    text: Bapak badhe mundhut menapa?
    options: ['Bapak badhe tumbas menapa?', 'Bapak badhe mundhut menapa?', 'Bapak badhe dhahar menapa?']
    answer: 1
    meaning:
      ar_eg: حضرتك عايز تاخد إيه يا أستاذ؟
      ar: ماذا تودّ أن تأخذ يا سيدي؟
      en: What would you like, sir?
    words: [mundhut]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: خلصت زيارتك عند Pak Sastro. تستأذن إزاي؟
      ar: انتهت زيارتك عند Pak Sastro. كيف تستأذن؟
      en: Your visit to Pak Sastro is over. How do you take your leave?
    options: ['Kula kondur rumiyin, Pak.', 'Aku mulih sik, Pak.', 'Kula nyuwun pamit rumiyin, Pak.']
    answer: 2
    explain:
      ar_eg: nyuwun pamit = أستأذن. kondur تكريم للتاني، وaku mulih sik نغوكو.
      ar: nyuwun pamit = أستأذن، وkondur للآخر، وaku mulih sik نغوكو.
      en: nyuwun pamit = I ask leave. kondur honours others; aku mulih sik is ngoko.
    words: [nyuwun pamit]
  - id: e05
    type: fill_blank
    sentence: Kula ___ teh setunggal, Bu.
    meaning:
      ar_eg: عايز شاي واحد لو سمحتي يا حاجة.
      ar: أريد شايًا واحدًا من فضلكِ يا سيدتي.
      en: One tea, please, ma'am.
    options: [nyuwun, mundhut, kersa]
    answers: [nyuwun]
    explain:
      ar_eg: "إنت اللي بتطلب: nyuwun. mundhut وkersa للكبير."
      ar: "الطالب أنت: nyuwun، وmundhut وkersa للكبير."
      en: "You're the one asking: nyuwun. mundhut and kersa are for the elder."
    words: [nyuwun]
  - id: e06
    type: fill_blank
    sentence: Ibu badhe ___ batik menika?
    meaning:
      ar_eg: حضرتك عايزة تاخدي الباتيك ده يا هانم؟ (بتكريم)
      ar: هل تودّين أخذ هذا الباتيك يا سيدتي؟ (بتوقير)
      en: Would you like to take this batik, ma'am? (honouring her)
    options: [tumbas, mundhut, nyuwun]
    answers: [mundhut]
    explain:
      ar_eg: لما الكبيرة هي اللي بتشتري، الفعل يترفع لـ mundhut. tumbas كراما عادية، وnyuwun ليك إنت.
      ar: الشراء شراء الكبيرة فيُرفع إلى mundhut، وtumbas كراما عادية، وnyuwun لك.
      en: She's the one buying, so the verb rises to mundhut. tumbas is plain krama; nyuwun is for you.
    words: [mundhut]
  - id: e07
    type: build_sentence
    source:
      ar_eg: بعد إذنك يا أستاذ، تامان ساري فين؟
      ar: لو سمحت يا سيدي، أين تامان ساري؟
      en: Excuse me, sir, may I ask where Taman Sari is?
    answer: Nyuwun pirsa, Pak, Taman Sari wonten pundi?
    distractors: [ndangu, ngendi]
    words: [nyuwun pirsa]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Bu Harsono) أستأذن أنا يا هانم.
      ar: (إلى Bu Harsono) أستأذنكِ في الانصراف يا سيدتي.
      en: (to Bu Harsono) Please excuse me, I'll be going, ma'am.
    answers: ['Kula nyuwun pamit rumiyin, Bu.', 'Nyuwun pamit rumiyin, Bu.', 'Bu, kula nyuwun pamit rumiyin.', 'Kula nyuwun pamit, Bu.', 'Nyuwun pamit, Bu.']
    words: [nyuwun pamit]
  - id: e09
    type: speaking
    text: Kula nyuwun karcis setunggal, Pak.
    meaning:
      ar_eg: عايز تذكرة واحدة لو سمحت يا أستاذ.
      ar: أريد تذكرة واحدة من فضلك يا سيدي.
      en: One ticket, please, sir.
    words: [nyuwun]
dialogue:
  title: Takon dalan dhateng Taman Sari
  lines:
    - speaker: Mohamed
      text: Nyuwun pirsa, Pak, Taman Sari wonten pundi?
      ar_eg: بعد إذنك يا أستاذ، تامان ساري فين؟
      ar: لو سمحت يا سيدي، أين تامان ساري؟
      en: Excuse me, sir, may I ask where Taman Sari is?
    - speaker: Pak Sastro
      text: Caket, Mas. Mlampah kemawon saged.
      ar_eg: قريبة يا ابني. تقدر تروح مشي.
      ar: قريبة يا بني. يمكنك الذهاب مشيًا.
      en: It's near. You can walk there.
    - speaker: Mohamed
      text: Matur nuwun sanget, Pak. Kula nyuwun pamit rumiyin.
      ar_eg: متشكر أوي يا أستاذ. أستأذن أنا.
      ar: شكرًا جزيلًا يا سيدي. أستأذنكم.
      en: Thank you very much, sir. Please excuse me.
    - speaker: Pak Sastro
      text: Inggih, Mas. Sugeng tindak.
      ar_eg: اتفضل يا ابني. توصل بالسلامة.
      ar: تفضّل يا بني. في أمان الله.
      en: Of course. Safe journey.
