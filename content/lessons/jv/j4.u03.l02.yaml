    en: ask for, request (krama, humble; ngoko njaluk) = minta
  - word: nyuwun pirsa
    pos: phrase
    ar_eg: بعد إذنك أسأل (krama andhap)
    ar: أستأذن في السؤال (krama andhap)
    en: may I ask, excuse me (krama andhap) = numpang tanya
  - word: mundhut
    pos: verb
    ar_eg: الكبير يطلب / يشتري / ياخد (krama inggil)
    ar: يطلب الكبير / يشتري / يأخذ (krama inggil)
    en: ask for, buy, take (of the elder; krama inggil) = minta, membeli, mengambil
  - word: nyuwun pamit
    pos: phrase
    ar_eg: أستأذن أمشي (krama andhap)
    ar: أستأذن في الانصراف (krama andhap)
    en: ask leave to go, say goodbye (krama andhap) = mohon pamit
