schema: kabar.lesson/v1
id: j5.u06.l04
language: jv
title: Tembang para wali
can_do:
  ar_eg: 'تقارن أغنية قديمة من أيام الأولياء بأغنية حب كامبورساري: مين عملها، وجوها، ومعناها.'
  ar: 'أن تقارن أغنية قديمة من عهد الأولياء بأغنية حب من الكامبورساري: من ألّفها وجوّها ومعناها.'
  en: 'Compare an old song from the saints'' era with a campursari love song: who made it, its mood and its meaning.'
slides:
  - title: Tembang lawas, tembang anyar
    body:
      ar_eg: |
        wali = ولي (زي العربي)، sunan = لقب الأولياء التسعة في جاوة: Sunan Kalijaga. بيقولوا إن Lir-ilir من تأليفه.
        swasana = جو المكان أو الأغنية. katresnan = الحب، tulus = صادق من القلب.
        في أغاني الكامبورساري: atiku ajur = قلبي اتكسر، aku lila = أنا راضي وسايبه يمشي. sanadyan = مع إن.
      ar: |
        wali = وليّ (من العربية)، sunan = لقب الأولياء التسعة في جاوة: Sunan Kalijaga، وتنسب إليه الرواية Lir-ilir.
        swasana = جوّ المكان أو الأغنية. katresnan = الحب، tulus = صادق مخلص.
        وفي أغاني الكامبورساري: atiku ajur = تحطّم قلبي، aku lila = أنا راضٍ وأتركه يرحل. sanadyan = مع أنّ.
      en: |
        wali = saint (from Arabic), sunan = title of Java's nine saints: Sunan Kalijaga, who tradition says made Lir-ilir.
        swasana = mood, atmosphere. katresnan = love, tulus = sincere.
        In campursari: atiku ajur = my heart is shattered, aku lila = I accept it and let go. sanadyan = although.
    examples:
      - text: Miturut crita, Lir-ilir iku tembang saka Sunan Kalijaga.
        ar_eg: بيقولوا إن لير إلير من تأليف سونان كاليجاجا.
        ar: تقول الرواية إن لير إلير من تأليف سونان كاليجاغا.
        en: Tradition says Lir-ilir was made by Sunan Kalijaga.
      - text: Swasana tembang iki seneng.
        ar_eg: جو الأغنية دي مبهج.
        ar: جوّ هذه الأغنية مبهج.
        en: This song has a happy mood.
      - text: Sanadyan atine ajur, dheweke lila.
        ar_eg: مع إن قلبه مكسور، هو راضي.
        ar: مع أن قلبه محطّم فإنه راضٍ.
        en: Although his heart is broken, he lets go.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sunan
        ar_eg: سونان (لقب ولي)
        ar: سونان (لقب وليّ)
        en: sunan (saint's title)
      - text: wali
        ar_eg: ولي
        ar: وليّ
        en: saint
      - text: swasana
        ar_eg: جو
        ar: جوّ
        en: mood, atmosphere
      - text: katresnan
        ar_eg: حب
        ar: حب
        en: love
    words: [sunan, wali, swasana, katresnan]
  - id: e02
    type: match_pairs
    pairs:
      - text: lila
        ar_eg: راضي، سايبه يمشي
        ar: راضٍ، يترك
        en: accept, let go
      - text: ajur
        ar_eg: متكسر
        ar: محطّم
        en: shattered
      - text: sanadyan
        ar_eg: مع إن
        ar: مع أنّ
        en: although
      - text: tulus
        ar_eg: صادق
        ar: صادق مخلص
        en: sincere
    words: [lila, ajur, sanadyan, tulus]
  - id: e03
    type: listen
    text: Atiku ajur, nanging aku lila.
    question:
      ar_eg: حاسس بإيه؟
      ar: بماذا يشعر؟
      en: How does he feel?
    options: [قلبه مكسور بس راضي, فرحان ومستني, زعلان ومش مسامح]
    answer: 0
    meaning:
      ar_eg: قلبي مكسور، بس أنا راضي.
      ar: قلبي محطّم لكنني راضٍ.
      en: My heart is broken, but I let go.
    words: [ajur, lila]
  - id: e04
    type: fill_blank
    sentence: ___ adoh, aku arep teka.
    meaning:
      ar_eg: ___ بعيد، هاجي.
      ar: ___ المكان بعيد، سآتي.
      en: ___ it's far, I'll come.
    options: [Sanadyan, Swasana, Tulus]
    answers: [Sanadyan]
    words: [sanadyan, swasana, tulus]
  - id: e05
    type: multiple_choice
    question: Sunan Kalijaga iku sawijining ___.
    options: [swasana, wali, katresnan]
    answer: 1
    explain:
      ar_eg: 'سونان كاليجاجا واحد من الأولياء التسعة: wali.'
      ar: 'سونان كاليجاغا أحد الأولياء التسعة: wali.'
      en: 'Sunan Kalijaga is one of the nine saints: wali.'
    words: [swasana, wali, katresnan]
  - id: e06
    type: fill_blank
    sentence: ___ ing konser iku rame lan seneng.
    meaning:
      ar_eg: ___ الحفلة كان دوشة ومبهج.
      ar: كان ___ الحفل صاخبًا ومبهجًا.
      en: The ___ at the concert was lively and happy.
    options: [Swasana, Katresnan, Ajur]
    answers: [Swasana]
    words: [swasana, katresnan, ajur]
  - id: e07
    type: multiple_choice
    question: Ibu tresna marang anake kanthi ___.
    options: [sunan, lila, tulus]
    answer: 2
    explain:
      ar_eg: tulus = صادق من القلب، من غير مقابل.
      ar: tulus = حبّ صادق بلا مقابل.
      en: tulus = sincere, wanting nothing back.
    words: [sunan, lila, tulus]
  - id: e08
    type: build_sentence
    source:
      ar_eg: حبي ليك صادق.
      ar: حبّي لك صادق.
      en: My love for you is sincere.
    answer: Katresnanku marang kowe tulus.
    distractors: [ajur, wali]
    words: [katresnan, tulus]
  - id: e09
    type: translate
    direction: from_target
    source_text: Miturut crita, Lir-ilir iku tembang saka Sunan Kalijaga, salah siji wali.
    answers_meaning:
      ar_eg: [بيقولوا إن لير إلير عملها سونان كاليجاجا، واحد من الأولياء, على حسب الحكاية، لير إلير من تأليف سونان كاليجاجا، وهو ولي]
      ar: [تقول الرواية إن لير إلير من تأليف سونان كاليجاغا، أحد الأولياء, بحسب الرواية ألّف لير إلير سونان كاليجاغا وهو أحد الأولياء]
      en: ['According to tradition, Lir-ilir was made by Sunan Kalijaga, one of the saints', 'Tradition says Sunan Kalijaga, one of the saints, made Lir-ilir']
    words: [sunan, wali]
  - id: e10
    type: speaking
    text: Sanadyan atiku ajur, aku lila.
    meaning:
      ar_eg: مع إن قلبي مكسور، أنا راضي.
      ar: مع أن قلبي محطّم فإنني راضٍ.
      en: Although my heart is broken, I let go.
    words: [sanadyan, ajur, lila]
dialogue:
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, kowe ngerti sapa sing nggawe Lir-ilir?
      ar_eg: يا محمد، تعرف مين اللي عمل لير إلير؟
      ar: يا محمد، أتعرف من ألّف لير إلير؟
      en: Mohamed, do you know who made Lir-ilir?
    - speaker: Mohamed
      text: Durung ngerti, Mbak. Sapa ta?
      ar_eg: لأ، لسه ماعرفش يا آيو. مين يعني؟
      ar: لا أعرف بعد. مَن إذن؟
      en: Not yet, Mbak. Who, then?
    - speaker: Mbak Ayu
      text: Miturut crita, Sunan Kalijaga, salah siji wali ing Jawa.
      ar_eg: بيقولوا سونان كاليجاجا، واحد من أولياء جاوة.
      ar: تقول الرواية إنه سونان كاليجاغا، أحد أولياء جاوة.
      en: Tradition says Sunan Kalijaga, one of Java's saints.
    - speaker: Mohamed
      text: Swasanane beda banget karo campursari sing sedhih kae.
      ar_eg: جوها مختلف خالص عن الكامبورساري الحزين بتاع امبارح.
      ar: جوّها مختلف تمامًا عن أغنية الكامبورساري الحزينة تلك.
      en: Its mood is so different from that sad campursari song.
    - speaker: Mbak Ayu
      text: 'Iya. Campursari akeh critane katresnan: ambyar, nanging lila.'
      ar_eg: 'أيوه. الكامبورساري كله حكايات حب: قلب مكسور، بس راضي.'
      ar: 'نعم. في الكامبورساري قصص حب كثيرة: قلب محطّم لكنه راضٍ.'
      en: 'Yes. Campursari is full of love stories: a broken heart, but letting go.'
    - speaker: Mohamed
      text: Sanadyan sedhih, tembange tulus.
      ar_eg: مع إنها حزينة، الأغاني صادقة.
      ar: ومع أنها حزينة فالأغاني صادقة.
      en: Sad as they are, the songs are sincere.
