schema: kabar.lesson/v1
id: j3.u01.l03
language: jv
title: Kowe wis mangan?
can_do:
  ar_eg: تقارن نفس الجملة في المستويات التلاتة.
  ar: أن تقارن الجملة نفسها في المستويات الثلاثة.
  en: Compare one sentence across the speech levels.
slides:
  - title: Siji ukara, telung tingkat
    body:
      ar_eg: |
        في الجاوي «كلت؟» سؤال أدب زي «إزيك» عندنا. وده أحسن مثال يوريك إزاي المستويات بتغيّر الكلمات. بص كلمة كلمة:
        - kowe ← sampeyan ← panjenengan (إنت ← حضرتك ← سيادتك)
        - wis ← sampun ← sampun (sudah)
        - mangan ← nedha ← dhahar (makan)
        في الإندونيسي الجملة واحدة تقريبًا: Kamu sudah makan? / Bapak sudah makan? — الضمير بس اللي بيتغير. في الجاوي الفعل نفسه بيتغير.
      ar: |
        سؤال «هل أكلت؟» في الجاوية من آداب التحية، وهو خير مثال على تغيّر الألفاظ بين المستويات. انظر كلمة كلمة:
        - kowe ← sampeyan ← panjenengan (أنت ← حضرتك ← سيادتك)
        - wis ← sampun ← sampun (sudah)
        - mangan ← nedha ← dhahar (makan)
        وفي الإندونيسية تبقى الجملة تقريبًا كما هي: Kamu sudah makan? / Bapak sudah makan? ويتغير الضمير وحده، أما في الجاوية فيتغير الفعل نفسه.
      en: |
        "Have you eaten?" is a friendly greeting in Javanese, and the best example of how levels swap words. Look word by word:
        - kowe → sampeyan → panjenengan (إنت → حضرتك → سيادتك)
        - wis → sampun → sampun (sudah)
        - mangan → nedha → dhahar (makan)
        In Indonesian the sentence barely changes: Kamu sudah makan? / Bapak sudah makan? — only the pronoun moves. In Javanese the verb itself changes.
    grammar: jv.speechlevel.overview
    examples:
      - text: Kowe wis mangan?
        ar_eg: كلت؟ (ngoko)
        ar: هل أكلت؟ (ngoko)
        en: Have you eaten? (ngoko)
      - text: Sampeyan sampun nedha?
        ar_eg: حضرتك كلت؟ (krama)
        ar: هل أكلتَ؟ (krama)
        en: Have you eaten? (krama)
      - text: Panjenengan sampun dhahar?
        ar_eg: سيادتك اتفضلت أكلت؟ (krama inggil)
        ar: هل تفضلتم بالأكل؟ (krama inggil)
        en: Have you eaten? (krama inggil)
  - title: Wis mangan durung, cah?
    body:
      ar_eg: |
        في شوارع يوجيا الصحاب بيقولوا لبعض cah (من bocah = ولد): «يا جدع / يا صاحبي». دي ngoko الشارع، أبسط حاجة.
        وفي الشات هتلاقي: wes mangan durung? (كلت ولا لسه؟).
      ar: |
        في شوارع يوجيا ينادي الأصدقاء بعضهم بـ cah (من bocah = ولد) بمعنى «يا صاحبي». وهذه ngoko الشارع في أبسط صورها.
        وفي الدردشة: wes mangan durung? (أأكلت أم بعد؟).
      en: |
        On Jogja's streets friends call each other cah (from bocah, kid): "mate". This is street ngoko at its simplest.
        In chats you'll see: wes mangan durung? (eaten yet or not?).
    grammar: jv.speechlevel.overview
    examples:
      - text: Wis mangan durung, cah?
        ar_eg: كلت ولا لسه يا صاحبي؟ (ngoko الشارع)
        ar: هل أكلتَ أم بعد يا صاحبي؟ (ngoko الشارع)
        en: Eaten yet, mate? (street ngoko)
  - title: Inggih lan dereng
    body:
      ar_eg: |
        لو حد سألك بالكراما، رد بالكراما:
        - iya ← inggih (ya) = أيوه
        - wis ← sampun (sudah) = آه، خلاص
        - durung ← dereng (belum) = لسه.
        - aku ← kula (saya) = أنا. في الشات kulo.
        ولصاحبك ردّ عادي: «Wis.» أو «Durung.»
      ar: |
        إذا سُئلت بالكراما فأجب بالكراما:
        - iya ← inggih (ya) = نعم
        - wis ← sampun (sudah) = نعم، قد فعلت
        - durung ← dereng (belum) = ليس بعد
        - aku ← kula (saya) = أنا، وفي الدردشة kulo
        ومع الصديق: «Wis.» أو «Durung.»
      en: |
        If someone asks you in krama, answer in krama:
        - iya → inggih (ya) = yes
        - wis → sampun (sudah) = yes, already
        - durung → dereng (belum) = not yet
        - aku → kula (saya) = I; chat kulo
        To a friend just say "Wis." or "Durung."
    grammar: jv.speechlevel.overview
    examples:
      - text: Inggih, kula sampun nedha.
        ar_eg: أيوه، أنا كلت.
        ar: نعم، قد أكلتُ.
        en: Yes, I've eaten.
      - text: Dereng, Bu.
        ar_eg: لسه يا مدام.
        ar: ليس بعد يا سيدتي.
        en: Not yet, ma'am.
  - title: Dhahar mung kanggo liyan
    body:
      ar_eg: |
        خد بالك: لما بتتكلم عن نفسك، عمرك ما تستخدم dhahar أو panjenengan. دول للشخص اللي بتحترمه بس.
        السؤال للجدة: «Panjenengan sampun dhahar?» — والرد عن نفسك: «Kula sampun nedha.»
        زي ما مش هتقول عن نفسك «أنا سيادتي».
      ar: |
        تنبّه: لا تستعمل dhahar ولا panjenengan عن نفسك أبدًا، فهما للمعظَّم فقط.
        تسأل الجدة: «Panjenengan sampun dhahar?» وتجيب عن نفسك: «Kula sampun nedha.»
        كما لا تقول عن نفسك «أنا سيادتي».
      en: |
        Careful: never use dhahar or panjenengan about yourself. They're only for the person you honour.
        You ask Grandma: "Panjenengan sampun dhahar?" — and answer about yourself: "Kula sampun nedha."
        Just as you'd never call yourself «سيادتي».
    grammar: jv.speechlevel.overview
    examples:
      - text: Mbah, panjenengan sampun dhahar?
        ar_eg: يا تيتة، حضرتك أكلتي؟
        ar: يا جدتي، هل تفضلتِ بالأكل؟
        en: Grandma, have you eaten?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kowe
        ar_eg: بالكراما sampeyan
        ar: بالكراما sampeyan
        en: in krama → sampeyan
      - text: wis
        ar_eg: بالكراما sampun
        ar: بالكراما sampun
        en: in krama → sampun
      - text: mangan
        ar_eg: بالكراما nedha
        ar: بالكراما nedha
        en: in krama → nedha
      - text: iya
        ar_eg: بالكراما inggih
        ar: بالكراما inggih
        en: in krama → inggih
      - text: durung
        ar_eg: بالكراما dereng
        ar: بالكراما dereng
        en: in krama → dereng
      - text: silakan
        ar_eg: بالكراما mangga
        ar: بالكراما mangga
        en: in krama → mangga
    words: [sampeyan, sampun, nedha, inggih, dereng, mangga]
  - id: e02
    type: multiple_choice
    question: Wis mangan durung, cah?
    question_meaning:
      ar_eg: الجملة دي في أنهي مستوى؟
      ar: في أيّ مستوى هذه الجملة؟
      en: Which level is this sentence?
    options: [krama, krama inggil, ngoko]
    answer: 2
    explain:
      ar_eg: wis وmangan وdurung وcah كلها ngoko.
      ar: wis وmangan وdurung وcah كلها من الـ ngoko.
      en: wis, mangan, durung and cah are all ngoko.
    words: [wis, mangan, durung]
  - id: e03
    type: listen
    text: Dereng, Bu.
    options: ['Sampun, Bu.', 'Dereng, Bu.', 'Durung, Bu.']
    answer: 1
    words: [dereng]
  - id: e04
    type: fill_blank
    sentence: Sampeyan ___ nedha?
    meaning:
      ar_eg: حضرتك كلت؟
      ar: هل أكلتَ؟
      en: Have you eaten?
    options: [sampun, wis, durung]
    answers: [sampun]
    explain:
      ar_eg: 'sampeyan وnedha كراما، فـ«خلاص» كمان كراما: sampun.'
      ar: sampeyan وnedha من الكراما، فتكون sampun لا wis.
      en: sampeyan and nedha are krama, so "already" is krama too — sampun.
    words: [sampun]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أيوه، أنا كلت. (بالكراما)
      ar: نعم، قد أكلتُ. (بالكراما)
      en: Yes, I've eaten. (krama)
    answer: Inggih, kula sampun nedha.
    distractors: [dhahar, aku]
    words: [inggih, kula, sampun, nedha]
  - id: e06
    type: speaking
    text: Inggih, mangga, Bu. Kula dereng nedha.
    meaning:
      ar_eg: أيوه، اتفضلي يا مدام. أنا لسه ماكلتش.
      ar: نعم، تفضّلي يا سيدتي. أنا لم آكل بعد.
      en: Yes, please go ahead, ma'am. I haven't eaten yet.
    words: [inggih, mangga, kula, dereng, nedha]
  - id: e07
    type: multiple_choice
    question: Mangga, Mas.
    question_meaning:
      ar_eg: معناها إيه بالإندونيسي؟
      ar: ما معناها بالإندونيسية؟
      en: What does it mean in Indonesian?
    options: ['Silakan, Mas.', 'Sudah, Mas.', 'Belum, Mas.']
    answer: 0
    explain:
      ar_eg: mangga بالكراما = silakan = اتفضل.
      ar: mangga بالكراما = silakan = تفضّل.
      en: mangga (krama) = silakan = please, go ahead.
    words: [mangga]
dialogue:
  title: Warung cedhak stasiun
  lines:
    - speaker: Bu Siti
      text: "Mas, sampun nedha?"
      ar_eg: "يا أستاذ، كلت؟"
      ar: "يا أخي، هل أكلتَ؟"
      en: "Eaten yet, young man?"
    - speaker: Mohamed
      text: Dereng, Bu.
      ar_eg: لسه يا مدام.
      ar: ليس بعد يا سيدتي.
      en: Not yet, ma'am.
    - speaker: Bu Siti
      text: "Mangga, Mas, pinarak!"
      ar_eg: "اتفضل يا أستاذ، اقعد!"
      ar: "تفضّل يا أخي، اجلس!"
      en: "Come on, sit yourself down!"
    - speaker: Mohamed
      text: Matur nuwun, Bu.
      ar_eg: شكرًا يا مدام.
      ar: شكرًا يا سيدتي.
      en: Thank you, ma'am.
    - speaker: Mas Dimas
      text: "Piye, wis mangan durung?"
      ar_eg: "ها، كلت ولا لسه؟"
      ar: "إذن، هل أكلتَ أم بعد؟"
      en: "So, eaten yet?"
    - speaker: Mohamed
      text: "Uwis, Mas! Enak tenan, je."
      ar_eg: "أيوه يا ديماس! حلو بجد."
      ar: "نعم يا ديماس! لذيذ حقًّا."
      en: "Yep! Really tasty."
new_words:
  - word: inggih
    pos: interjection
    ar_eg: أيوه (krama لـ iya؛ بتتقال nggih) = ya
    ar: نعم (krama لـ iya؛ تُنطق nggih) = ya
    en: yes (krama for iya; spoken nggih) = ya
  - word: dereng
    pos: adverb
    ar_eg: لسه / لم بعد (krama لـ durung) = belum
    ar: ليس بعد (krama لـ durung) = belum
    en: not yet (krama for durung) = belum
  - word: mangga
    pos: interjection
    ar_eg: اتفضل (krama، chat monggo) = silakan (≠ إندونيسي mangga = مانجا)
    ar: تفضّل (krama) = silakan (≠ الإندونيسية mangga = مانجو)
    en: please, go ahead (krama; chat monggo) = silakan (≠ Indonesian mangga "mango")
    false_friend: mangga
review:
