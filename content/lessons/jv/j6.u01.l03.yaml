schema: kabar.lesson/v1
id: j6.u01.l03
language: jv
title: Pa dha ja ya nya
can_do:
  ar_eg: تقرا وتكتب الحروف من 11 لـ 15.
  ar: أن تقرأ الحروف من الحادي عشر إلى الخامس عشر وتكتبها.
  en: Read and write letters 11 to 15.
slides:
  - title: Pa dha ja ya nya
    body:
      ar_eg: |
        ꦥ pa (بَ، الـ p) · ꦝ dha (دَ تقيلة) · ꦗ ja · ꦪ ya (يَ) · ꦚ nya (نيَ).
        خلي بالك من ꦗ: دي «ج» الفصحى (زي j في jam)، مش الجيم المصري. الجيم المصري (g) ليها حرف تاني هييجي الدرس الجاي.
        ودلوقتي تقدر تكتب سؤالين مهمين: ꦲꦥ apa (إيه؟) وꦱꦥ sapa (مين؟).
      ar: |
        ꦥ pa (بَ) · ꦝ dha (دال ثقيلة) · ꦗ ja · ꦪ ya (يَ) · ꦚ nya (نيَ).
        انتبه إلى ꦗ: هي الجيم الفصيحة (كـ j في jam)، لا الجيم المصرية؛ فلـ g حرف آخر في الدرس القادم.
        وتستطيع الآن كتابة سؤالين مهمين: ꦲꦥ apa (ماذا؟) وꦱꦥ sapa (من؟).
      en: |
        ꦥ pa · ꦝ dha (heavy d) · ꦗ ja · ꦪ ya · ꦚ nya.
        Careful with ꦗ: it's the j of "jam" (Fusha ج), not the Egyptian ج. Egyptian ج (g) has its own letter in the next lesson.
        Now you can write two key questions: ꦲꦥ apa (what?) and ꦱꦥ sapa (who?).
    grammar: jv.aksara.nglegena
    examples:
      - text: ꦲꦥ (apa)
        ar_eg: إيه؟
        ar: ماذا؟
        en: what?
      - text: ꦱꦥ (sapa)
        ar_eg: مين؟
        ar: من؟
        en: who?
  - title: Da lan dha
    body:
      ar_eg: |
        فاكر الفرق بين d الخفيفة وdh التقيلة في الإملا؟ هنا كل واحدة ليها حرف: ꦢ da وꦝ dha. يعني dhadha (صدر) = ꦝꦝ، مش ꦢꦢ.
        والسطر التالت من القصيدة: «Padha jayanya» = كانوا قد بعض في القوة.
      ar: |
        تذكر الفرق بين d الخفيفة وdh الثقيلة في الإملاء؟ لكل منهما هنا حرف: ꦢ da وꦝ dha، فـ dhadha (صدر) = ꦝꦝ لا ꦢꦢ.
        والسطر الثالث من القصيدة: «Padha jayanya» = وتكافآ قوة.
      en: |
        Remember light d versus heavy dh from the spelling unit? Here each has its own letter: ꦢ da and ꦝ dha. So dhadha (chest) = ꦝꦝ, not ꦢꦢ.
        The poem's third line: "Padha jayanya" = they were equally strong.
    grammar: jv.aksara.nglegena
    examples:
      - text: ꦝꦝ (dhadha)
        ar_eg: صدر — ꦝ مرتين
        ar: صدر — ꦝ مرتين
        en: chest — ꦝ twice
      - text: ꦥꦝꦗꦪꦚ (padha jayanya)
        ar_eg: كانوا قد بعض في القوة
        ar: وتكافآ قوة
        en: they were equally strong
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ꦥ
        ar_eg: pa (بَ)
        ar: pa (بَ)
        en: pa
      - text: ꦝ
        ar_eg: dha (دَ تقيلة)
        ar: dha (دال ثقيلة)
        en: dha (heavy d)
      - text: ꦗ
        ar_eg: ja (جَ الفصحى)
        ar: ja (الجيم الفصيحة)
        en: ja (as in jam)
      - text: ꦪ
        ar_eg: ya (يَ)
        ar: ya (يَ)
        en: ya
      - text: ꦚ
        ar_eg: nya (نيَ)
        ar: nya (نيَ)
        en: nya
    words: [ꦥ, ꦝ, ꦗ, ꦪ, ꦚ]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تكتب dhadha (صدر)؟
      ar: كيف تكتب dhadha (صدر)؟
      en: How do you write dhadha (chest)?
    options: ["ꦢꦢ", "ꦝꦝ", "ꦢꦝ"]
    answer: 1
    explain:
      ar_eg: dh التقيلة = ꦝ. ꦢ دي d الخفيفة.
      ar: dh الثقيلة = ꦝ، وꦢ هي d الخفيفة.
      en: Heavy dh = ꦝ. ꦢ is the light d.
    words: [ꦝ]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الحرف ده بيتقري إزاي؟ ꦚ
      ar: كيف يُقرأ هذا الحرف؟ ꦚ
      en: How do you read this letter? ꦚ
    options: [nya, ya, na]
    answer: 0
    words: [ꦚ]
    explain:
      ar_eg: ꦚ = nya. ya = ꦪ وna = ꦤ.
      ar: ꦚ تُقرأ nya. أما ya فهي ꦪ وna هي ꦤ.
      en: ꦚ is nya. ya is ꦪ and na is ꦤ.
  - id: e04
    type: listen
    text: sapa
    question:
      ar_eg: سمعت أنهي كلمة؟
      ar: أي كلمة سمعت؟
      en: Which word did you hear?
    options: ["ꦲꦥ", "ꦱꦥ", "ꦥꦥ"]
    answer: 1
    meaning:
      ar_eg: مين؟
      ar: من؟
      en: who?
    words: [ꦥ]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: ꦗ بتتقري إزاي؟
      ar: كيف تُقرأ ꦗ؟
      en: How is ꦗ read?
    options: [ga, ya, ja]
    answer: 2
    explain:
      ar_eg: ꦗ = ja زي «ج» الفصحى أو j في jam. الجيم المصرية (ga) حرف تاني.
      ar: ꦗ = ja كالجيم الفصيحة، أما ga (الجيم المصرية) فحرف آخر.
      en: ꦗ = ja, as in "jam". Egyptian ج (ga) is a different letter.
    words: [ꦗ]
  - id: e06
    type: fill_blank
    sentence: ꦲꦥ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: إيه؟)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: ماذا؟)"
      en: Type the reading in Latin letters. (It means "what?".)
    answers: [apa]
    words: [ꦥ]
    explain:
      ar_eg: ꦲ = ha، وفي أول الكلمة بتتقري a. ꦥ = pa، فـ ꦲꦥ = apa (إيه؟).
      ar: ꦲ تُقرأ ha، وفي أول الكلمة تُقرأ a. وꦥ تُقرأ pa، فـ ꦲꦥ = apa (ماذا؟).
      en: ꦲ is ha, read a at the start of a word, and ꦥ is pa, so ꦲꦥ is apa ("what?").
  - id: e07
    type: build_sentence
    source:
      ar_eg: "رتّب الحروف دي بالترتيب: pa dha ja ya nya."
      ar: "رتّب هذه الحروف: pa dha ja ya nya."
      en: "Put these letters in order: pa dha ja ya nya."
    answer: ꦥ ꦝ ꦗ ꦪ ꦚ
    distractors: ["ꦢ"]
    words: [ꦥ, ꦝ, ꦗ, ꦪ, ꦚ]
    explain:
      ar_eg: "السطر التالت: pa ꦥ، dha ꦝ، ja ꦗ، ya ꦪ، nya ꦚ. ꦢ هو da مش dha."
      ar: "السطر الثالث: pa ꦥ، dha ꦝ، ja ꦗ، ya ꦪ، nya ꦚ. أما ꦢ فهي da لا dha."
      en: "Row three: pa ꦥ, dha ꦝ, ja ꦗ, ya ꦪ, nya ꦚ. ꦢ is da, not dha."
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦥꦝꦗꦪꦚ"
      ar: "اكتب بالحروف اللاتينية: ꦥꦝꦗꦪꦚ"
      en: "Write in Latin letters: ꦥꦝꦗꦪꦚ"
    answers: [padha jayanya, padhajayanya, pa dha ja ya nya]
    words: [ꦥ, ꦝ, ꦗ, ꦪ, ꦚ]
  - id: e09
    type: speaking
    text: Hana caraka, data sawala, padha jayanya.
    meaning:
      ar_eg: كان فيه رسولين، اتخانقوا، وكانوا قد بعض في القوة.
      ar: كان هناك رسولان، فتنازعا، وتكافآ قوة.
      en: There were two messengers; they quarrelled; they were equally strong.
dialogue:
  title: Da apa dha?
  lines:
    - speaker: Mohamed
      text: Mas, aksara iki apa? Da?
      ar_eg: يا ديماس، الحرف ده إيه؟ da؟
      ar: يا ديماس، ما هذا الحرف؟ da؟
      en: Mas, what's this letter? Da?
    - speaker: Dimas
      text: Dudu. Iku dha, kaya ing dhadha.
      ar_eg: لأ. دي dha، زي اللي في dhadha.
      ar: لا، هذه dha كالتي في dhadha.
      en: No. That's dha, as in dhadha.
    - speaker: Mohamed
      text: Oh, aku ngerti. Da lan dha beda.
      ar_eg: آه، فهمت. da وdha مختلفين.
      ar: آه، فهمت. da وdha مختلفتان.
      en: Oh, I see. Da and dha are different.
    - speaker: Dimas
      text: Bener! Saiki kowe isa nulis apa lan sapa, lho.
      ar_eg: صح! دلوقتي تقدر تكتب apa وsapa.
      ar: صحيح! تستطيع الآن كتابة apa وsapa.
      en: Right! Now you can write apa and sapa.
new_words:
  - word: ꦥ
    pos: letter
    ar_eg: الحرف pa (بَ)
    ar: الحرف pa (بَ)
    en: the letter pa
  - word: ꦝ
    pos: letter
    ar_eg: الحرف dha (دَ التقيلة)
    ar: الحرف dha (الدال الثقيلة)
    en: the letter dha (heavy, retroflex d)
  - word: ꦗ
    pos: letter
    ar_eg: الحرف ja (جَ الفصحى، مش المصري)
    ar: الحرف ja (الجيم الفصيحة)
    en: the letter ja (as in jam)
  - word: ꦪ
    pos: letter
    ar_eg: الحرف ya (يَ)
    ar: الحرف ya (يَ)
    en: the letter ya
  - word: ꦚ
    pos: letter
    ar_eg: الحرف nya (نيَ)
    ar: الحرف nya (نيَ)
    en: the letter nya
