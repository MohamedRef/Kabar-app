    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (شات لصاحبك) استنى شوية، أنا في الطريق.
      ar: (دردشة مع صديق) اصبر قليلًا، أنا في الطريق.
      en: (chat to a friend) Hang on, I'm on my way.
    answers:
      - Sabar ya, aku lagi OTW.
      - Sabar ya, aku OTW.
      - Sabar, aku lagi OTW.
      - Sabar ya, lagi OTW.
      - Sabar ya, aku lagi neng dalan.
      - Sabar ya, aku isih neng dalan.
    words: [sabar, OTW]
  - id: e11
    type: speaking
    text: Akunmu wis tak follow.
    meaning:
      ar_eg: تابعت أكونتك خلاص.
      ar: تابعتُ حسابك.
      en: I've followed your account.
    words: [akun]
dialogue:
  title: Postingane Mohamed
  lines:
    - speaker: Mohamed
      text: Mas, iki postinganku. Sepur lawas neng Ambarawa apik bgt!
      ar_eg: "يا بايو، ده البوست بتاعي: القطر القديم في أمباراوا حلو أوي!"
      ar: "يا بايو، هذا منشوري: القطار القديم في أمباراوا رائع جدًا!"
      en: Bayu, here's my post. The old train in Ambarawa is really great!
    - speaker: Mas Bayu
      text: Wah, campur kode! Saiki kowe kaya wong Jawa asli.
      ar_eg: يا سلام، خلط لغات! دلوقتي إنت زي الجاوي الأصلي.
      ar: رائع، خلط لغوي! صرت الآن كالجاوي الأصيل.
      en: Wow, code-mixing! Now you're like a real Javanese.
    - speaker: Mohamed
      text: Nanging karo simbahmu, aku nganggo krama.
      ar_eg: بس مع جدّك بتكلم كراما.
      ar: لكني أكلّم جدّك بالكراما.
      en: But with your grandpa, I use krama.
    - speaker: Mas Bayu
      text: Pinter. Akunmu wis tak follow.
      ar_eg: شاطر. تابعت أكونتك خلاص.
      ar: أحسنت. تابعتُ حسابك.
      en: Clever. I've followed your account.
    - speaker: Mohamed
      text: Suwun, Mas!
      ar_eg: متشكر يا بايو!
      ar: شكرًا يا بايو!
      en: Thanks, Bayu!
souvenir:
  id: j5.u04.souvenir
  title: Museum Kereta Api Ambarawa
  note:
    ar_eg: |
      محطة أمباراوا القديمة بقت متحف للقطارات: قاطرات بخار هولندية متصفّفة جنب بعض، وفيه قطر بخار سياحي بيطلع في الجبل على خط مسنّن (rack railway)، ودي حاجة نادرة في الدنيا. ولو دوّرت على أمباراوا في تيك توك هتلاقي بوستات كتير مخلوطة جاوي وإندونيسي وإنجليزي، والـ Reader في Kabar بيعلّم لغة كل كلمة.
    ar: |
      صارت محطة أمباراوا القديمة متحفًا للقطارات: قاطرات بخارية هولندية مصفوفة جنبًا إلى جنب، وقطار بخاري سياحي يصعد الجبل على سكة مسنّنة، وهو أمر نادر في العالم. وإن بحثت عن أمباراوا في تيك توك وجدت منشورات كثيرة تمزج الجاوية بالإندونيسية والإنجليزية، والقارئ (Reader) في Kabar يوسم لغة كل كلمة.
    en: |
      Ambarawa's old station is now a railway museum: Dutch-era steam locomotives lined up side by side, and a tourist steam train that climbs into the hills on a rack railway, a rare thing in the world. Search Ambarawa on TikTok and you'll find plenty of posts mixing Javanese, Indonesian and English; Kabar's Reader tags each word's language.
