schema: kabar.lesson/v1
id: j5.u04.l09
language: jv
title: Ulangan J5.4
can_do:
  ar_eg: تشرح بوست مخلوط.
  ar: أن تشرح منشورًا ممزوجًا.
  en: Explain a mixed post.
slides:
  - title: Telung langkah
    body:
      ar_eg: |
        عشان تشرح أي بوست مخلوط:
        1. لاقي الهيكل الجاوي: wis، tak، neng، sing، durung، ya، -ne.
        2. علّم الباقي: إندونيسي (udh، blm، bgt، gpp) ولا إنجليزي (share، OTW، like)؟ وافصل البادئات: di- + share، tak + follow.
        3. رجّع إملا الشات: ojo → aja، iso → isa.
        وافتكر: الخلط للصحاب، والكراما للكبار من غير إنجليزي.
      ar: |
        لشرح أي منشور ممزوج:
        1. جد الهيكل الجاوي: wis، وtak، وneng، وsing، وdurung، وya، و-ne.
        2. صنّف البقية: إندونيسية (udh، bgt، blm، gpp) أم إنجليزية (share، OTW، like)؟ وافصل السوابق: di- + share، وtak + follow.
        3. ردّ إملاء الدردشة: ojo ← aja، وiso ← isa.
        وتذكّر: الخلط للأصدقاء، والكراما للكبار بلا إنجليزية.
      en: |
        To explain any mixed post:
        1. Find the Javanese frame: wis, tak, neng, sing, durung, ya, -ne.
        2. Tag the rest: Indonesian (udh, blm, bgt, gpp) or English (share, OTW, like)? Split the affixes: di- + share, tak + follow.
        3. Restore chat spelling: ojo → aja, iso → isa.
        And remember: mixing is for friends; krama with elders, no English.
    grammar: jv.codemix
    examples:
      - text: Guys, videone udh tak upload, ojo lali like yo!
        ar_eg: يا جماعة، رفعت الفيديو خلاص، ماتنسوش اللايك!
        ar: يا جماعة، رفعتُ الفيديو، لا تنسوا الإعجاب!
        en: Guys, I've uploaded the video, don't forget to like it!
      - text: HP-ne lowbat, mengko tak kabari neng grup.
        ar_eg: الموبايل فاصل شحن، هبلّغكم على الجروب بعدين.
        ar: بطارية الهاتف ضعيفة، سأخبركم في المجموعة لاحقًا.
        en: My phone's battery is low; I'll let you know in the group later.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: udh
        ar_eg: خلاص (sudah)
        ar: قد (sudah)
        en: already (sudah)
      - text: blm
        ar_eg: لسه (belum)
        ar: لم بعد (belum)
        en: not yet (belum)
      - text: bgt
        ar_eg: أوي (banget)
        ar: جدًا (banget)
        en: really (banget)
      - text: gpp
        ar_eg: مفيش مشكلة (gak papa)
        ar: لا بأس (gak papa)
        en: no problem (gak papa)
      - text: OTW
        ar_eg: في الطريق
        ar: في الطريق
        en: on the way
      - text: min
        ar_eg: الأدمن
        ar: مشرف الصفحة
        en: admin
    words: [udh, blm, bgt, gpp, OTW, min]
  - id: e02
    type: multiple_choice
    question: Guys, videone udh tak upload, ojo lali like yo!
    question_meaning:
      ar_eg: أنهي كلمة هنا من الهيكل الجاوي؟
      ar: أي كلمة هنا من الهيكل الجاوي؟
      en: Which word here belongs to the Javanese frame?
    options: [upload, tak, guys]
    answer: 1
    explain:
      ar_eg: tak (أنا عملت) جاوي. upload وguys إنجليزي.
      ar: tak (فعلتُ) جاوية، وupload وguys إنجليزيتان.
      en: tak (I did) is Javanese; upload and guys are English.
    words: [udh]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إنت متأخر ولازم تبعت رسالة لراجل كبير. أنهي واحدة؟
      ar: أنت متأخر وتراسل رجلًا كبيرًا في السن. أيّ رسالة؟
      en: You're running late and messaging an older man. Which message?
    options: ['Nuwun sewu, Pak, kula OTW, sorry telat.', 'Nuwun sewu, Pak, kula taksih wonten margi.']
    answer: 1
    explain:
      ar_eg: مع الكبار كراما من غير إنجليزي شات. OTW وsorry للصحاب.
      ar: مع الكبار كراما بلا إنجليزية دارجة، وOTW وsorry للأصدقاء.
      en: With elders, krama without chat English; OTW and sorry are for friends.
    words: [OTW]
  - id: e04
    type: listen
    text: Sabar ya, aku lagi OTW.
    options: ['Sabar ya, aku lagi OTW.', 'Sabar ya, aku wis tekan.', 'Sorry ya, aku lagi lowbat.']
    answer: 0
    meaning:
      ar_eg: استنى شوية، أنا في الطريق.
      ar: اصبر قليلًا، أنا في الطريق.
      en: Hang on, I'm on my way.
    words: [sabar, OTW]
  - id: e05
    type: listen
    text: HP-ne lowbat, mengko tak kabari neng grup.
    question:
      ar_eg: هيبلّغهم فين؟
      ar: أين سيخبرهم؟
      en: Where will he let them know?
    options: [neng omah, neng kampus, neng grup]
    answer: 2
    meaning:
      ar_eg: الموبايل فاصل شحن، هبلّغكم على الجروب بعدين.
      ar: بطارية الهاتف ضعيفة، سأخبركم في المجموعة لاحقًا.
      en: My phone's battery is low; I'll let you know in the group later.
    words: [lowbat, kabari, grup]
  - id: e06
    type: fill_blank
    sentence: Videone apik ___, ojo lali like.
    meaning:
      ar_eg: الفيديو حلو أوي، ماتنساش اللايك.
      ar: الفيديو رائع جدًا، لا تنسَ الإعجاب.
      en: The video is really good, don't forget to like it.
    options: [blm, gpp, bgt]
    answers: [bgt]
    words: [bgt]
  - id: e07
    type: fill_blank
    sentence: ___, mengko tak kirim.
    meaning:
      ar_eg: مفيش مشكلة، هبعتها بعدين.
      ar: لا بأس، سأرسلها لاحقًا.
      en: No problem, I'll send it later.
    options: [Gpp, Min, Bgt]
    answers: [Gpp]
    words: [gpp]
  - id: e08
    type: build_sentence
    source:
      ar_eg: شيّرته على الجروب يا جماعة.
      ar: شاركتُه في المجموعة يا جماعة.
      en: I've shared it in the group, guys.
    answer: Wis tak share neng grup, guys.
    distractors: [dishare, sing]
    words: [grup]
  - id: e09
    type: translate
    direction: from_target
    source_text: Durung sempet, sorry banget.
    answers_meaning:
      ar_eg:
        - لسه ملحقتش، سوري جدًا.
        - لسه ملحقتش، آسف جدًا.
        - ملحقتش لسه، سوري أوي.
        - لسه ملقيتش وقت، سوري جدًا.
        - لسه ملحقتش، أنا آسف جدًا.
      ar:
        - لم تسنح لي الفرصة بعد، آسف جدًا.
        - لم أجد وقتًا بعد، آسف جدًا.
        - لم أتمكن بعد، آسف جدًا.
      en:
        - Haven't had the chance yet, really sorry.
        - I haven't had the chance yet, really sorry.
        - Haven't had time yet, really sorry.
        - I haven't had time yet, so sorry.
        - Haven't had the chance yet, so sorry.
    words: [sempet]
