schema: kabar.lesson/v1
id: j1.u04.l01
language: jv
title: Tak tuku, dituku
can_do:
  ar_eg: تستخدم tak- وdi- مع الأفعال.
  ar: أن تستعمل tak- وdi- مع الأفعال.
  en: Use tak- and di- on verbs.
slides:
  - title: Kubeli → tak tuku
    body:
      ar_eg: |
        فاكر في الإندونيسي kubeli (أنا اشتريته) وkaubeli (إنت اشتريته) وdibeli (اتشرى)؟ الجاوي عنده نفس الفكرة:
        - ku- → tak: tak tuku = kubeli (tuku = beli)
        - kau- → kok: kok tuku = kaubeli
        - di- → di-: dituku = dibeli
        وزي العربي «أشتري»: «أنا» داخلة في الفعل نفسه، زي الألف في «أشتري».
      ar: |
        تذكّر في الإندونيسية kubeli (اشتريتُه) وkaubeli (اشتريتَه) وdibeli (اشتُري)، وللجاوية الفكرة نفسها:
        - ku- → tak: tak tuku = kubeli (tuku = beli)
        - kau- → kok: kok tuku = kaubeli
        - di- → di-: dituku = dibeli
        وهي كحرف المضارعة في «أشتري»: يدل على الفاعل وهو جزء من الفعل.
      en: |
        Remember Indonesian kubeli (I buy it), kaubeli (you buy it), dibeli (it's bought)? Javanese has the same idea:
        - ku- → tak: tak tuku = kubeli (tuku = beli)
        - kau- → kok: kok tuku = kaubeli
        - di- → di-: dituku = dibeli
        Like Arabic «أشتري», the "I" is built into the verb.
    grammar: jv.proclitic.tak-kok-di
    examples:
      - text: Tak tuku, Pak.
        ar_eg: هاخده يا حاج. (هشتريه)
        ar: سأشتريه يا سيدي.
        en: I'll buy it, sir.
  - title: Sek tak lapor pusat
    body:
      ar_eg: |
        أهم استخدام لـ tak في الشات والكلام: «خليني / هعمل دلوقتي حالًا»:
        - Sek, tak lapor pusat = استنى، هبلّغ الإدارة.
        - Tak tunggu, ya = هستناك، ماشي؟
        - Tak terke = هوصّلك.
        ⚠️ tak هنا مش «tak» الإندونيسي (= tidak)! النفي بالجاوي ora / gak. tak الجاوي = «أنا هـ».
      ar: |
        أشهر استعمال لـ tak في الكلام والدردشة العزم: «دعني / سأفعل الآن»:
        - Sek, tak lapor pusat = انتظر، سأبلغ المركز.
        - Tak tunggu, ya = سأنتظرك، اتفقنا؟
        - Tak terke = سأوصلك.
        ⚠️ وليست tak هنا «tak» الإندونيسية (= tidak)، فالنفي الجاوي ora / gak، وtak الجاوية = «سأ…».
      en: |
        tak's star role in chats and speech is "let me / I'll (right now)":
        - Sek, tak lapor pusat = Hold on, I'll report to HQ.
        - Tak tunggu, ya = I'll wait for you, OK?
        - Tak terke = I'll take you (there).
        ⚠️ This is NOT Indonesian tak (= tidak)! Javanese "not" is ora / gak. Javanese tak = "I'll".
    grammar: jv.proclitic.tak-kok-di
    examples:
      - text: Sek, tak lapor pusat.
        ar_eg: استنى، هبلّغ الإدارة.
        ar: انتظر، سأبلغ المركز.
        en: Hold on, I'll report to HQ.
      - text: Tak tunggu, ya.
        ar_eg: هستناك، ماشي؟
        ar: سأنتظرك، اتفقنا؟
        en: I'll wait for you, OK?
  - title: Dituku, diwaca
    body:
      ar_eg: |
        di- = المبني للمجهول، بالظبط زي الإندونيسي:
        - dituku = dibeli (اتشرى)
        - Kurmane wis dituku Mohamed = Kurmanya sudah dibeli Mohamed = محمد اشترى البلح خلاص.
        مهم: بعد tak وdi الفعل بيرجع لأصله. maca (يقرا) أصلها waca: tak waca، diwaca — زي الإندونيسي kubaca مش kumembaca. (القاعدة دي هتتشرح كويس في J2.)
      ar: |
        di- للمبني للمجهول كالإندونيسية تمامًا:
        - dituku = dibeli (اشتُري)
        - Kurmane wis dituku Mohamed = Kurmanya sudah dibeli Mohamed = اشترى محمد التمر.
        ومهم: بعد tak وdi يعود الفعل إلى جذره، فـ maca (يقرأ) جذرها waca: tak waca، diwaca، كما تقول الإندونيسية kubaca لا kumembaca (وتُفصّل القاعدة في J2).
      en: |
        di- is the passive, exactly as in Indonesian:
        - dituku = dibeli (bought)
        - Kurmane wis dituku Mohamed = Kurmanya sudah dibeli Mohamed = Mohamed has bought the dates.
        Key point: after tak and di the verb goes back to its base. maca (read) has the base waca: tak waca, diwaca — as Indonesian says kubaca, not kumembaca. (The full rule comes in J2.)
    grammar: jv.proclitic.tak-kok-di
    examples:
      - text: Bukune wis tak waca.
        ar_eg: الكتاب قريته خلاص.
        ar: قد قرأتُ الكتاب.
        en: I've read the book.
      - text: HP-ne arep dituku sapa?
        ar_eg: الموبايل مين هيشتريه؟
        ar: من سيشتري الهاتف؟
        en: Who's going to buy the phone?
  - title: Kok waca
    body:
      ar_eg: |
        kok- = «إنت» عملتها (kau-): Layange wis kok waca? = الجواب قريته؟ (layang = surat)
        في الكلام اليومي بتتسمع أقل؛ الناس كتير بتقول «Kowé wis maca layange?».
        وخلي بالك: kok كمان كلمة تانية معناها «إزاي كده؟! / ليه؟» — دي في الدرس الجاي.
        الكتابة: القاموس بيلزقهم (takwaca، kokwaca، diwaca)، والشات غالبًا بيكتب tak منفصلة.
      ar: |
        kok- = فاعل المخاطب (kau-): Layange wis kok waca? = هل قرأتَ الرسالة؟ (layang = surat)
        وهي أقل شيوعًا في الكلام اليومي، فكثيرًا ما يقال «Kowé wis maca layange?».
        ولـ kok معنى آخر للتعجب «لماذا هكذا؟!» يأتي في الدرس القادم.
        وتكتبها المعاجم موصولة (takwaca، kokwaca، diwaca)، وفي الدردشة كثيرًا ما تُفصل tak.
      en: |
        kok- = "by you" (kau-): Layange wis kok waca? = Have you read the letter? (layang = surat)
        It's less common in everyday speech; people often say "Kowé wis maca layange?".
        Careful: kok is also a different word meaning "how come?!" — that's next lesson.
        Spelling: dictionaries join them (takwaca, kokwaca, diwaca); chats usually write tak apart.
    grammar: jv.proclitic.tak-kok-di
    examples:
      - text: Layange wis kok waca?
        ar_eg: الجواب قريته؟
        ar: هل قرأتَ الرسالة؟
        en: Have you read the letter?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tuku
        ar_eg: يشتري (beli)
        ar: يشتري (beli)
        en: buy (beli)
      - text: lapor
        ar_eg: يبلّغ (lapor)
        ar: يُبلغ (lapor)
        en: report (lapor)
      - text: takon
        ar_eg: يسأل (tanya)
        ar: يسأل (tanya)
        en: ask (tanya)
      - text: tunggu
        ar_eg: يستنى (tunggu)
        ar: ينتظر (tunggu)
        en: wait (tunggu)
      - text: ngomong
        ar_eg: يتكلم / يقول (bicara)
        ar: يتكلم / يقول (bicara)
        en: speak, say (bicara)
    words: [tuku, lapor, takon, tunggu, ngomong]
  - id: e02
    type: multiple_choice
    question: Sek, tak lapor pusat.
    question_meaning:
      ar_eg: tak هنا معناها إيه؟
      ar: ما معنى tak هنا؟
      en: What does tak mean here?
    options: ["by you", "I'll (by me)", "not (tidak)"]
    answer: 1
    explain:
      ar_eg: tak الجاوي = «أنا هـ»، مش tak الإندونيسي (tidak).
      ar: tak الجاوية = «سأ…»، لا tak الإندونيسية (tidak).
      en: Javanese tak = "I'll", not Indonesian tak (tidak).
    words: [lapor]
  - id: e03
    type: multiple_choice
    question: dituku
    question_meaning:
      ar_eg: معناها إيه بالإندونيسي؟
      ar: ما معناها بالإندونيسية؟
      en: What is it in Indonesian?
    options: ["dibeli", "kubeli", "membeli"]
    answer: 0
    explain:
      ar_eg: di + tuku = di + beli = dibeli (اتشرى).
      ar: di + tuku = dibeli (اشتُري).
      en: di + tuku = dibeli.
    words: [tuku]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «Bukunya sudah kubaca» بالجاوي؟
      ar: كيف تقول «Bukunya sudah kubaca» بالجاوية؟
      en: How do you say "Bukunya sudah kubaca" in Javanese?
    options: ["Bukune wis diwaca aku.", "Bukune wis tak maca.", "Bukune wis tak waca."]
    answer: 2
    explain:
      ar_eg: بعد tak الفعل بيرجع لأصله، فـ waca مش maca — زي kubaca مش kumembaca.
      ar: بعد tak يعود الفعل إلى جذره، فـ waca لا maca، كما تقول kubaca لا kumembaca.
      en: After tak the verb is in its base form — waca, not maca — like kubaca, not kumembaca.
    words: [maca]
  - id: e05
    type: listen
    text: Tak tunggu, ya.
    options: ["Ditunggu, ya.", "Tak tuku, ya.", "Tak tunggu, ya."]
    answer: 2
    words: [tunggu]
  - id: e06
    type: fill_blank
    sentence: Kurmane wis ___ Mohamed.
    meaning:
      ar_eg: البلح محمد اشتراه خلاص. (Kurmanya sudah dibeli Mohamed.)
      ar: اشترى محمد التمر. (Kurmanya sudah dibeli Mohamed.)
      en: Mohamed has bought the dates. (Kurmanya sudah dibeli Mohamed.)
    options: ["kok tuku", "dituku", "tuku"]
    answers: [dituku]
    explain:
      ar_eg: |-
        الفاعل اسم (Mohamed) بعد الفعل، يبقى di-: dituku Mohamed = dibeli Mohamed.
      ar: |-
        الفاعل اسم ظاهر بعد الفعل، فيُستعمل di-: dituku Mohamed = dibeli Mohamed.
      en: |-
        The doer is a name after the verb, so use di-: dituku Mohamed = dibeli Mohamed.
    words: [tuku]
  - id: e07
    type: fill_blank
    sentence: Sek, ___ lapor pusat.
    meaning:
      ar_eg: استنى، هبلّغ الإدارة.
      ar: انتظر، سأبلغ المركز.
      en: Hold on, I'll report to HQ.
    options: ["tak", "kok", "di"]
    answers: [tak]
    words: [lapor]
  - id: e08
    type: build_sentence
    source:
      ar_eg: استنى، هبلّغ الإدارة.
      ar: انتظر، سأبلغ المركز.
      en: Hold on, I'll report to HQ.
    answer: Sek, tak lapor pusat.
    distractors: [tidak, kok]
    words: [sek, lapor]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هشتريه يا حاج.
      ar: سأشتريه يا سيدي.
      en: I'll buy it, sir.
    answers:
      - Tak tuku, Pak.
      - Tak tuku, Pak
      - Tak tuku Pak
      - Taktuku, Pak.
      - Taktuku, Pak
      - Taktuku Pak
    explain:
      ar_eg: tak + tuku = kubeli. وممكن تكتبها منفصلة أو ملزوقة (taktuku).
      ar: tak + tuku = kubeli، وتُكتب منفصلة أو موصولة (taktuku).
      en: tak + tuku = kubeli; written apart or joined (taktuku).
    words: [tuku]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: هستناك، ماشي؟
      ar: سأنتظرك، اتفقنا؟
      en: I'll wait for you, OK?
    answers:
      - Tak tunggu, ya.
      - Tak tunggu, ya
      - Tak tunggu ya
      - Tak tunggu yo
      - Taktunggu, ya.
      - Taktunggu ya
      - Tak tunggu.
      - Tak tunggu
    words: [tunggu]
  - id: e11
    type: translate
    direction: from_target
    source_text: HP-ne arep dituku sapa?
    answers_meaning:
      ar_eg: ["الموبايل مين هيشتريه؟", "مين هيشتري الموبايل؟", "مين هيشتري التليفون؟"]
      ar: ["من سيشتري الهاتف؟", "مَن سيشتري الجوال؟"]
      en: ["Who's going to buy the phone?", "Who will buy the phone?", "Who is buying the phone?"]
    explain:
      ar_eg: حرفيًا «الموبايل هيتشرى من مين؟». arep = هـ، dituku = يتشرى، sapa = مين.
      ar: حرفيًا «سيُشترى الهاتف ممّن؟»، arep = سوف، وdituku = يُشترى، وsapa = مَن.
      en: Literally "the phone will be bought by whom?" — arep = will, dituku = bought, sapa = who.
    words: [tuku, sapa]
  - id: e12
    type: dictation
    text: Sek, tak lapor pusat.
    meaning:
      ar_eg: استنى، هبلّغ الإدارة.
      ar: انتظر، سأبلغ المركز.
      en: Hold on, I'll report to HQ.
    words: [sek, lapor]
  - id: e13
    type: speaking
    text: Iya, tak tuku, Pak. Matur nuwun.
    meaning:
      ar_eg: أيوه، هاخده يا حاج. شكرًا.
      ar: نعم، سأشتريه يا سيدي. شكرًا.
      en: Yes, I'll buy it, sir. Thank you.
    words: [tuku]
dialogue:
  title: Kurma nang Ampel
  lines:
    - speaker: Cak Heru
      text: Mohamed, kowé arep tuku apa?
      ar_eg: يا محمد، عايز تشتري إيه؟
      ar: يا محمد، ماذا تريد أن تشتري؟
      en: Mohamed, what are you going to buy?
    - speaker: Mohamed
      text: Aku arep tuku kurma.
      ar_eg: عايز أشتري بلح.
      ar: أريد أن أشتري تمرًا.
      en: I'm going to buy dates.
    - speaker: Pak Hasan
      text: Kurma Ajwa, Mas? Apik lho.
      ar_eg: بلح عجوة يا ابني؟ حلو أوي على فكرة.
      ar: تمر عجوة يا بنيّ؟ إنه جيد جدًا.
      en: Ajwa dates? They're really good.
    - speaker: Mohamed
      text: Iya, tak tuku, Pak.
      ar_eg: أيوه، هاخده يا حاج.
      ar: نعم، سأشتريه يا سيدي.
      en: Yes, I'll take them, sir.
    - speaker: Pak Hasan
      text: Matur nuwun. Sek, tak bungkus.
      ar_eg: شكرًا. استنى، هلفّهولك.
      ar: شكرًا. انتظر، سأغلّفه لك.
      en: Thank you. Hold on, I'll wrap them.
    - speaker: Cak Heru
      text: Wah, kurmane wis dituku Mohamed!
      ar_eg: واو، محمد اشترى البلح خلاص!
      ar: رائع، اشترى محمد التمر!
      en: Wow, Mohamed's bought the dates!
