schema: kabar.lesson/v1
id: j6.u04.l10
language: jv
title: Ing angkringan
can_do:
  ar_eg: تسمع أسعار في عربية أكل في الشارع وتقرا المنيو بالخط الجاوي.
  ar: أن تسمع أسعارًا عند عربة طعام شعبية وتقرأ قائمتها بالخط الجاوي.
  en: Catch prices at a street food cart and read its menu in aksara Jawa.
slides:
  - title: Angkringan
    body:
      ar_eg: |
        بالليل في يوجيا هتلاقي angkringan: عربية خشب عليها أكل رخيص، والناس قاعدين حواليها بيتكلموا. أشهر حاجة sega kucing: لفّة رز صغيرة قد «أكلة قطة».
        البيّاع بيقول الأسعار بصوت عالي، فاسمع الأول. وعلى العربية المنيو بالخط الجاوي.
        بص على usus وjahe: ꦲ شايلة الـ u بعد sate، وꦲ في jahe حرف ha عادي.
      ar: |
        ليلًا في يوجياكرتا تجد angkringan: عربة خشبية عليها طعام رخيص يجتمع حولها الناس للحديث. أشهر ما فيها sega kucing: لفافة أرز صغيرة بحجم «وجبة قطة».
        يعلن البائع الأسعار بصوت عالٍ، فاستمع أولًا. وعلى العربة قائمة بالخط الجاوي.
        لاحظ usus وjahe: ꦲ تحمل الـ u بعد sate، وꦲ في jahe حرف ha عادي.
      en: |
        At night in Yogya you'll find the angkringan: a wooden cart of cheap food with people sitting around it chatting. The star is sega kucing, a tiny rice parcel, "cat-sized".
        The seller calls out prices, so listen first. The menu on the cart is in aksara Jawa.
        Look at usus and jahe: ꦲ carries the u after sate, and in jahe ꦲ is an ordinary ha.
    grammar: jv.aksara.pasangan
    examples:
      - text: ꦱꦼꦒꦏꦸꦕꦶꦁ · ꦱꦠꦺꦲꦸꦱꦸꦱ꧀ (sega kucing · sate usus)
        ar_eg: لفّة رز صغيرة · أسياخ مُمبار فراخ
        ar: لفافة أرز صغيرة · أسياخ أمعاء دجاج
        en: tiny rice parcel · chicken-intestine satay
      - text: ꦮꦼꦢꦁꦗꦲꦺ · ꦏꦺꦴꦥꦶꦗꦺꦴꦱ꧀ (wedang jahe · kopi jos)
        ar_eg: مشروب جنزبيل سخن · قهوة بالفحم (من يوجيا)
        ar: شراب زنجبيل ساخن · قهوة بالفحم (من يوجياكرتا)
        en: hot ginger drink · charcoal coffee (a Yogya speciality)
      - text: ꦱꦼꦒꦏꦸꦕꦶꦁꦠꦼꦭꦸꦁꦲꦺꦮꦸ꧉ (Sega kucing telung ewu.)
        ar_eg: لفّة الرز بتلات آلاف.
        ar: لفافة الأرز بثلاثة آلاف.
        en: Sega kucing, three thousand.
exercises:
  - id: e01
    type: listen
    text: Sega kucing telung ewu.
    question:
      ar_eg: الـ sega kucing بكام؟
      ar: بكم الـ sega kucing؟
      en: How much is a sega kucing?
    options: ["2.000", "3.000", "5.000"]
    answer: 1
    meaning:
      ar_eg: لفّة الرز بتلات آلاف.
      ar: لفافة الأرز بثلاثة آلاف.
      en: Sega kucing, three thousand.
    words: [sega kucing]
  - id: e02
    type: listen
    text: Wedang jahe limang ewu.
    question:
      ar_eg: مشروب الجنزبيل بكام؟
      ar: بكم شراب الزنجبيل؟
      en: How much is the ginger drink?
    options: ["5.000", "15.000", "4.000"]
    answer: 0
    meaning:
      ar_eg: الجنزبيل بخمس آلاف.
      ar: شراب الزنجبيل بخمسة آلاف.
      en: Ginger drink, five thousand.
  - id: e03
    type: listen
    text: Sate usus rong ewu.
    question:
      ar_eg: سمعت سعر أنهي حاجة؟
      ar: سعر أي شيء سمعت؟
      en: Which item's price did you hear?
    options: ["ꦱꦠꦺꦲꦸꦱꦸꦱ꧀", "ꦱꦼꦒꦏꦸꦕꦶꦁ", "ꦏꦺꦴꦥꦶꦗꦺꦴꦱ꧀"]
    answer: 0
    meaning:
      ar_eg: سيخ المُمبار بألفين.
      ar: سيخ الأمعاء بألفين.
      en: Intestine satay, two thousand.
  - id: e04
    type: match_pairs
    pairs:
      - text: ꦲꦁꦏꦿꦶꦔꦤ꧀
        ar_eg: angkringan — عربية أكل شعبي بالليل
        ar: angkringan — عربة طعام شعبي ليلية
        en: angkringan — night-time street food cart
      - text: ꦱꦼꦒꦏꦸꦕꦶꦁ
        ar_eg: sega kucing — لفّة رز صغيرة
        ar: sega kucing — لفافة أرز صغيرة
        en: sega kucing — tiny rice parcel
      - text: ꦮꦼꦢꦁꦗꦲꦺ
        ar_eg: wedang jahe — جنزبيل سخن
        ar: wedang jahe — شراب زنجبيل ساخن
        en: wedang jahe — hot ginger drink
      - text: ꦱꦠꦺꦲꦸꦱꦸꦱ꧀
        ar_eg: sate usus — مُمبار مشوي
        ar: sate usus — أمعاء مشوية
        en: sate usus — intestine satay
    words: [angkringan, sega kucing]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "إزاي بتتكتب angkringan؟"
      ar: "كيف تُكتب angkringan؟"
      en: How is angkringan written?
    options: ["ꦲꦁꦏꦿꦶꦔꦤ꧀", "ꦲꦁꦏꦫꦶꦔꦤ꧀", "ꦲꦁꦫꦶꦔꦤ꧀"]
    answer: 0
    explain:
      ar_eg: ang (cecak) + kri (ꦏ عليها cakra وwulu) + ngan (pangkon في الآخر).
      ar: ang (cecak) + kri (ꦏ عليها cakra وwulu) + ngan (pangkon في الآخر).
      en: ang (cecak) + kri (ꦏ with cakra and wulu) + ngan (pangkon at the end).
    words: [angkringan, cakra]
  - id: e06
    type: fill_blank
    sentence: ꦏꦺꦴꦥꦶꦗꦺꦴꦱ꧀ = ___
    meaning:
      ar_eg: اكتب القراية بالحروف اللاتينية.
      ar: اكتب القراءة بالحروف اللاتينية.
      en: Type the reading in Latin letters.
    answers: [kopi jos, kopi joss]
  - id: e07
    type: fill_blank
    sentence: Ing ___ ana sega kucing lan wedang jahe.
    meaning:
      ar_eg: في عربية الأكل الشعبي فيه لفّات رز صغيرة ومشروب جنزبيل.
      ar: في عربة الطعام الشعبي لفافات أرز صغيرة وشراب زنجبيل.
      en: At the street food cart there's sega kucing and ginger drink.
    options: [angkringan, gang, masjid]
    answers: [angkringan]
    words: [angkringan, sega kucing]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦱꦼꦒꦏꦸꦕꦶꦁꦠꦼꦭꦸꦁꦲꦺꦮꦸ꧉"
      ar: "اكتب بالحروف اللاتينية: ꦱꦼꦒꦏꦸꦕꦶꦁꦠꦼꦭꦸꦁꦲꦺꦮꦸ꧉"
      en: "Write in Latin letters: ꦱꦼꦒꦏꦸꦕꦶꦁꦠꦼꦭꦸꦁꦲꦺꦮꦸ꧉"
    answers: ["Sega kucing telung ewu.", sega kucing telung ewu, "sega kucing 3.000"]
    words: [sega kucing]
  - id: e09
    type: speaking
    text: Sega kucing loro lan wedang jahe siji, Pak.
    meaning:
      ar_eg: اتنين لفّة رز وواحد جنزبيل يا عم.
      ar: لفافتا أرز وشراب زنجبيل واحد يا عم.
      en: Two sega kucing and one ginger drink, please.
    words: [sega kucing]
dialogue:
  title: Bengi ing angkringan
  lines:
    - speaker: Pak Angkringan
      text: Mangga, Mas. Badhe ngunjuk menapa?
      ar_eg: اتفضل يا أستاذ. تحب تشرب إيه؟
      ar: تفضّل. ماذا تحب أن تشرب؟
      en: Come in. What would you like to drink?
    - speaker: Mohamed
      text: Wedang jahe setunggal, Pak. Lan sega kucing kalih.
      ar_eg: واحد جنزبيل يا عم، واتنين لفّة رز.
      ar: شراب زنجبيل واحد يا عم، ولفافتا أرز.
      en: One ginger drink, please. And two sega kucing.
    - speaker: Pak Angkringan
      text: Sedaya sewelas ewu, Mas.
      ar_eg: الكل بحداشر ألف.
      ar: المجموع أحد عشر ألفًا.
      en: Eleven thousand altogether.
    - speaker: Mohamed
      text: Mangga, Pak. Kok murah sanget!
      ar_eg: اتفضل يا عم. رخيص قوي!
      ar: تفضّل يا عم. رخيص جدًّا!
      en: Here you are. That's so cheap!
