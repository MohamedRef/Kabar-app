schema: kabar.lesson/v1
id: j2.u02.l02
language: jv
title: Enak tenan!
can_do:
  ar_eg: تتكلم عن طعم الأكل والشرب.
  ar: أن تتحدث عن طعم الطعام والشراب.
  en: Talk about taste.
slides:
  - title: Pedhes, legi, asin
    body:
      ar_eg: |
        كلمات الطعم في الجاوي غير الإندونيسي، إلا enak وasin:
        - enak = enak (حلو / طعمه حلو)
        - pedhes = pedas (حرّاق) — في الشات pedes
        - legi = manis (مسكّر)
        - asin = asin (مالح)
        - kecut = asam (حامض)
        - pait = pahit (مُرّ)
        - anyep = hambar (ماسخ، من غير طعم)
        والصفة بتيجي بعد الاسم زي الإندونيسي: teh legi = شاي مسكّر.
      ar: |
        ألفاظ الطعم الجاوية تختلف عن الإندونيسية، إلا enak وasin:
        - enak = enak (لذيذ)
        - pedhes = pedas (حارّ) — وفي الدردشة pedes
        - legi = manis (حلو)
        - asin = asin (مالح)
        - kecut = asam (حامض)
        - pait = pahit (مُرّ)
        - anyep = hambar (بلا طعم)
        وتأتي الصفة بعد الاسم كالإندونيسية: teh legi = شاي حلو.
      en: |
        Javanese taste words differ from Indonesian, except enak and asin:
        - enak = enak (tasty)
        - pedhes = pedas (spicy) — chat: pedes
        - legi = manis (sweet)
        - asin = asin (salty)
        - kecut = asam (sour)
        - pait = pahit (bitter)
        - anyep = hambar (bland)
        The adjective follows the noun, as in Indonesian: teh legi = sweet tea.
    examples:
      - text: Sambelé pedhes.
        ar_eg: الصوص حرّاق.
        ar: الصلصة حارّة.
        en: The chilli sauce is spicy.
      - text: Tehé legi.
        ar_eg: الشاي مسكّر.
        ar: الشاي حلو.
        en: The tea is sweet.
  - title: Enak tenan, rada asin
    body:
      ar_eg: |
        عشان توصف الطعم بالظبط:
        - tenan = bener / sungguh: Enak tenan! = حلو بجد!
        - banget = sangat (الإندونيسي العامي أخدها من الجاوي): pedhes banget = حرّاق أوي
        - rada = agak (شوية) وبتيجي قبل الصفة: rada asin = مالح شوية
        - kurang = kurang (ناقص): kurang legi = عايز سكر
        tenan وbanget بعد الصفة، rada وkurang قبلها. هنتعمق في الكلمات دي في J2.6.
      ar: |
        لوصف الطعم بدقة:
        - tenan = sungguh: Enak tenan! = لذيذ حقًا!
        - banget = sangat (أخذتها العامية الإندونيسية من الجاوية): pedhes banget = حارّ جدًا
        - rada = agak (قليلًا) قبل الصفة: rada asin = مالح قليلًا
        - kurang = kurang (ناقص): kurang legi = ينقصه سكر
        تأتي tenan وbanget بعد الصفة، وrada وkurang قبلها، ونتوسع فيها في J2.6.
      en: |
        To describe taste precisely:
        - tenan = sungguh: Enak tenan! = Really tasty!
        - banget = sangat (casual Indonesian borrowed it from Javanese): pedhes banget = very spicy
        - rada = agak (a bit), before the adjective: rada asin = a bit salty
        - kurang = kurang (not enough): kurang legi = needs more sugar
        tenan and banget follow the adjective; rada and kurang go before it. More in J2.6.
    examples:
      - text: Pecelé enak tenan!
        ar_eg: البيتشل حلو بجد!
        ar: البيتشل لذيذ حقًا!
        en: The pecel is really tasty!
      - text: Sotoné rada asin.
        ar_eg: الشوربة مالحة شوية.
        ar: الحساء مالح قليلًا.
        en: The soto is a bit salty.
      - text: Kopiné kurang legi.
        ar_eg: القهوة عايزة سكر.
        ar: القهوة ينقصها سكر.
        en: The coffee isn't sweet enough.
  - title: Sega, tempé, teh anget
    body:
      ar_eg: |
        في عربية البيتشل هتسمع:
        - sega = nasi (رز) — بتتنطق «سِيجو»، وفي الشات sego (زي pira / piro)
        - tempé وrempeyek (peyek): تيمبيه وبسكوت فول سوداني مقرمش
        - endhog = telur (بيض)
        - teh anget = teh hangat (شاي دافي)، es teh = شاي بتلج
        - banyu putih = air putih (مية)
        وعشان تسأل عن الطعم: Rasané piyé? = طعمه عامل إزاي؟ أو بسؤال أقصر: Pedhes ora? = حرّاق ولا لأ؟
      ar: |
        عند بائع البيتشل ستسمع:
        - sega = nasi (أرز) — يُنطق «سِغو»، ويُكتب في الدردشة sego (مثل pira / piro)
        - tempé وrempeyek (peyek): التمبيه ورقائق الفول السوداني المقرمشة
        - endhog = telur (بيض)
        - teh anget = teh hangat (شاي دافئ)، وes teh = شاي مثلّج
        - banyu putih = air putih (ماء)
        وللسؤال عن الطعم: Rasané piyé? = ما طعمه؟ أو باختصار: Pedhes ora? = أهو حارّ أم لا؟
      en: |
        At a pecel stall you'll hear:
        - sega = nasi (rice) — said "sego", chat sego (like pira / piro)
        - tempé and rempeyek (peyek): tempeh and crispy peanut crackers
        - endhog = telur (egg)
        - teh anget = teh hangat (warm tea), es teh = iced tea
        - banyu putih = air putih (drinking water)
        To ask about taste: Rasané piyé? = How does it taste? Or short: Pedhes ora? = Is it spicy?
    examples:
      - text: Rasané piyé?
        ar_eg: طعمه عامل إزاي؟
        ar: ما طعمه؟
        en: How does it taste?
      - text: Iki pedhes ora?
        ar_eg: ده حرّاق؟
        ar: أهذا حارّ؟
        en: Is this spicy?
      - text: Teh anget siji, Bu.
        ar_eg: واحد شاي دافي يا طنط.
        ar: شاي دافئ واحد يا سيدتي.
        en: One warm tea, ma'am.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pedhes
        ar_eg: حرّاق
        ar: حارّ
        en: spicy
      - text: legi
        ar_eg: مسكّر
        ar: حلو المذاق
        en: sweet
      - text: asin
        ar_eg: مالح
        ar: مالح
        en: salty
      - text: kecut
        ar_eg: حامض
        ar: حامض
        en: sour
      - text: pait
        ar_eg: مُرّ
        ar: مُرّ
        en: bitter
    words: [pedhes, legi, asin, kecut, pait]
  - id: e02
    type: multiple_choice
    question: Gula rasané …
    question_meaning:
      ar_eg: السكر طعمه …
      ar: السكر طعمه …
      en: Sugar tastes …
    options: ["asin", "legi", "pait"]
    answer: 1
    words: [legi, gula]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة جاوي = pedas الإندونيسي؟
      ar: أي كلمة جاوية تقابل pedas الإندونيسية؟
      en: Which Javanese word means Indonesian pedas?
    options: ["legi", "anyep", "pedhes"]
    answer: 2
    explain:
      ar_eg: pedhes = pedas. وanyep = ماسخ، وlegi = مسكّر.
      ar: pedhes = pedas، وanyep = بلا طعم، وlegi = حلو.
      en: pedhes = pedas; anyep = bland; legi = sweet.
    words: [pedhes, anyep]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الشاي عايز سكر. تقول إيه؟
      ar: الشاي ينقصه سكر. ماذا تقول؟
      en: The tea needs more sugar. What do you say?
    options: ["Tehé kurang asin.", "Tehé kurang legi.", "Tehé legi banget."]
    answer: 1
    explain:
      ar_eg: kurang legi = ناقصه سكر. kurang asin = ناقصه ملح.
      ar: kurang legi = ينقصه سكر، وkurang asin = ينقصه ملح.
      en: kurang legi = not sweet enough; kurang asin = not salty enough.
    words: [kurang, legi]
  - id: e05
    type: listen
    text: Enak tenan!
    options: ["Ora enak.", "Enak ora?", "Enak tenan!"]
    answer: 2
    words: [enak, tenan]
  - id: e06
    type: fill_blank
    sentence: Pecelé enak ___!
    meaning:
      ar_eg: البيتشل حلو بجد!
      ar: البيتشل لذيذ حقًا!
      en: The pecel is really tasty!
    options: ["rada", "kurang", "tenan"]
    answers: [tenan]
    explain:
      ar_eg: tenan بتيجي بعد الصفة. rada وkurang بييجوا قبلها.
      ar: تأتي tenan بعد الصفة، أما rada وkurang فقبلها.
      en: tenan follows the adjective; rada and kurang go before it.
    words: [tenan, enak]
  - id: e07
    type: fill_blank
    sentence: Sambelé ___ banget.
    meaning:
      ar_eg: الصوص حرّاق أوي.
      ar: الصلصة حارّة جدًا.
      en: The chilli sauce is very spicy.
    answers:
      - pedhes
      - pedes
    explain:
      ar_eg: pedhes بالـ dh في الإملا الرسمي، والشات بيكتبها pedes.
      ar: تُكتب pedhes بـ dh رسميًا، وpedes في الدردشة.
      en: Standard spelling is pedhes with dh; chats write pedes.
    words: [pedhes, banget]
  - id: e08
    type: build_sentence
    source:
      ar_eg: رز البيتشل حلو بجد.
      ar: أرز البيتشل لذيذ حقًا.
      en: The pecel rice is really tasty.
    answer: Sega pecelé enak tenan.
    distractors: [legi, rada]
    words: [sega, pecel, enak, tenan]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الشاي مسكّر شوية.
      ar: الشاي حلو قليلًا.
      en: The tea is a bit sweet.
    answers:
      - Tehé rada legi.
      - Tehé rada legi
      - Tehe rada legi.
      - Tehe rada legi
    words: [rada, legi]
  - id: e10
    type: translate
    direction: from_target
    source_text: Iki pedhes ora?
    answers_meaning:
      ar_eg: ["ده حرّاق؟", "ده حراق ولا لأ؟", "هو ده حراق؟"]
      ar: ["هل هذا حارّ؟", "أهذا حار أم لا؟"]
      en: ["Is this spicy?", "Is this spicy or not?"]
    explain:
      ar_eg: X ora? = X ولا لأ؟ طريقة سهلة تعمل بيها سؤال.
      ar: X ora? = أهو X أم لا؟ طريقة سهلة للسؤال.
      en: X ora? = X or not? An easy way to ask a yes/no question.
    words: [pedhes, ora]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مية بس.
      ar: ماءً فقط.
      en: Just plain water.
    answers:
      - Banyu putih wae.
      - Banyu putih wae
    words: [banyu putih, wae]
  - id: e12
    type: dictation
    text: Sambel pecel rada pedhes.
    meaning:
      ar_eg: صوص البيتشل حرّاق شوية.
      ar: صلصة البيتشل حارّة قليلًا.
      en: The pecel sauce is a bit spicy.
    words: [sambel, rada, pedhes]
  - id: e13
    type: speaking
    text: Enak tenan, Bu!
    meaning:
      ar_eg: حلو بجد يا طنط!
      ar: لذيذ حقًا يا سيدتي!
      en: Really tasty, ma'am!
    words: [enak, tenan]
dialogue:
  title: Neng warung pecel
  lines:
    - speaker: Bu Darmi
      text: Piyé, Mas? Pecelé enak ora?
      ar_eg: إيه رأيك يا أستاذ؟ البيتشل حلو؟
      ar: ما رأيك يا أخي؟ هل البيتشل لذيذ؟
      en: So, Mas? Is the pecel good?
    - speaker: Mohamed
      text: Enak tenan, Bu! Sambelé rada pedhes.
      ar_eg: حلو بجد يا طنط! الصوص حرّاق شوية.
      ar: لذيذ حقًا يا سيدتي! الصلصة حارّة قليلًا.
      en: Really tasty, ma'am! The sauce is a bit spicy.
    - speaker: Bu Darmi
      text: Ngombé apa, Mas? Teh anget?
      ar_eg: تشرب إيه؟ شاي دافي؟
      ar: ماذا تشرب؟ شايًا دافئًا؟
      en: What will you drink? Warm tea?
    - speaker: Mohamed
      text: Es teh legi wae, Bu.
      ar_eg: شاي بتلج مسكّر بس يا طنط.
      ar: شايًا مثلّجًا حلوًا فقط يا سيدتي.
      en: Just a sweet iced tea, ma'am.
    - speaker: Sari
      text: Aku banyu putih wae, Bu.
      ar_eg: وأنا مية بس يا طنط.
      ar: وأنا ماءً فقط يا سيدتي.
      en: Just water for me, ma'am.
