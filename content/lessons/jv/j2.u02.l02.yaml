schema: kabar.lesson/v1
id: j2.u02.l02
language: jv
title: Pedhes, legi, asin
can_do:
  ar_eg: تقول طعم الأكل عامل إزاي.
  ar: أن تصف طعم الطعام.
  en: Say how food tastes.
slides:
  - title: Pedhes, legi, asin
    body:
      ar_eg: |
        كلمات الطعم في الجاوي غير الإندونيسي، إلا enak وasin:
        - enak = enak (حلو / طعمه حلو)
        - pedhes = pedas (حرّاق) — في الشات pedes
        - legi = manis (مسكّر)
        - asin = asin (مالح)
        - kecut = asam (حامض)
        - pait = pahit (مُرّ)
        - anyep = hambar (ماسخ، من غير طعم)
        والصفة بتيجي بعد الاسم زي الإندونيسي: teh legi = شاي مسكّر.
      ar: |
        ألفاظ الطعم الجاوية تختلف عن الإندونيسية، إلا enak وasin:
        - enak = enak (لذيذ)
        - pedhes = pedas (حارّ) — وفي الدردشة pedes
        - legi = manis (حلو)
        - asin = asin (مالح)
        - kecut = asam (حامض)
        - pait = pahit (مُرّ)
        - anyep = hambar (بلا طعم)
        وتأتي الصفة بعد الاسم كالإندونيسية: teh legi = شاي حلو.
      en: |
        Javanese taste words differ from Indonesian, except enak and asin:
        - enak = enak (tasty)
        - pedhes = pedas (spicy) — chat: pedes
        - legi = manis (sweet)
        - asin = asin (salty)
        - kecut = asam (sour)
        - pait = pahit (bitter)
        - anyep = hambar (bland)
        The adjective follows the noun, as in Indonesian: teh legi = sweet tea.
    examples:
      - text: Sambele pedhes.
        ar_eg: الصوص حرّاق.
        ar: الصلصة حارّة.
        en: The chilli sauce is spicy.
      - text: Tehe legi.
        ar_eg: الشاي مسكّر.
        ar: الشاي حلو.
        en: The tea is sweet.
  - title: Enak tenan, rada asin
    body:
      ar_eg: |
        عشان توصف الطعم بالظبط:
        - tenan = bener / sungguh: Enak tenan! = حلو بجد!
        - banget = sangat (الإندونيسي العامي أخدها من الجاوي): pedhes banget = حرّاق أوي
        - rada = agak (شوية) وبتيجي قبل الصفة: rada asin = مالح شوية
        - kurang = kurang (ناقص): kurang legi = عايز سكر
        tenan وbanget بعد الصفة، rada وkurang قبلها. هنتعمق في الكلمات دي في J2.6.
      ar: |
        لوصف الطعم بدقة:
        - tenan = sungguh: Enak tenan! = لذيذ حقًا!
        - banget = sangat (أخذتها العامية الإندونيسية من الجاوية): pedhes banget = حارّ جدًا
        - rada = agak (قليلًا) قبل الصفة: rada asin = مالح قليلًا
        - kurang = kurang (ناقص): kurang legi = ينقصه سكر
        تأتي tenan وbanget بعد الصفة، وrada وkurang قبلها، ونتوسع فيها في J2.6.
      en: |
        To describe taste precisely:
        - tenan = sungguh: Enak tenan! = Really tasty!
        - banget = sangat (casual Indonesian borrowed it from Javanese): pedhes banget = very spicy
        - rada = agak (a bit), before the adjective: rada asin = a bit salty
        - kurang = kurang (not enough): kurang legi = needs more sugar
        tenan and banget follow the adjective; rada and kurang go before it. More in J2.6.
    examples:
      - text: Pecele enak tenan!
        ar_eg: البيتشل حلو بجد!
        ar: البيتشل لذيذ حقًا!
        en: The pecel is really tasty!
      - text: Sotone rada asin.
        ar_eg: الشوربة مالحة شوية.
        ar: الحساء مالح قليلًا.
        en: The soto is a bit salty.
      - text: Kopine kurang legi.
        ar_eg: القهوة عايزة سكر.
        ar: القهوة ينقصها سكر.
        en: The coffee isn't sweet enough.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pedhes
        ar_eg: حرّاق
        ar: حارّ
        en: spicy
      - text: legi
        ar_eg: مسكّر
        ar: حلو المذاق
        en: sweet
      - text: asin
        ar_eg: مالح
        ar: مالح
        en: salty
      - text: kecut
        ar_eg: حامض
        ar: حامض
        en: sour
      - text: pait
        ar_eg: مُرّ
        ar: مُرّ
        en: bitter
    words: [pedhes, legi, asin, kecut, pait]
  - id: e02
    type: multiple_choice
    question: Gula rasane …
    question_meaning:
      ar_eg: السكر طعمه …
      ar: السكر طعمه …
      en: Sugar tastes …
    options: [asin, legi, pait]
    answer: 1
    words: [legi, gula]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة جاوي = pedas الإندونيسي؟
      ar: أي كلمة جاوية تقابل pedas الإندونيسية؟
      en: Which Javanese word means Indonesian pedas?
    options: [legi, anyep, pedhes]
    answer: 2
    explain:
      ar_eg: pedhes = pedas. وanyep = ماسخ، وlegi = مسكّر.
      ar: pedhes = pedas، وanyep = بلا طعم، وlegi = حلو.
      en: pedhes = pedas; anyep = bland; legi = sweet.
    words: [pedhes, anyep]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الشاي عايز سكر. تقول إيه؟
      ar: الشاي ينقصه سكر. ماذا تقول؟
      en: The tea needs more sugar. What do you say?
    options: [Tehe kurang asin., Tehe kurang legi., Tehe legi banget.]
    answer: 1
    explain:
      ar_eg: kurang legi = ناقصه سكر. kurang asin = ناقصه ملح.
      ar: kurang legi = ينقصه سكر، وkurang asin = ينقصه ملح.
      en: kurang legi = not sweet enough; kurang asin = not salty enough.
    words: [kurang, legi]
  - id: e05
    type: fill_blank
    sentence: Pecele enak ___!
    meaning:
      ar_eg: البيتشل حلو بجد!
      ar: البيتشل لذيذ حقًا!
      en: The pecel is really tasty!
    options: [rada, kurang, tenan]
    answers: [tenan]
    explain:
      ar_eg: tenan بتيجي بعد الصفة. rada وkurang بييجوا قبلها.
      ar: تأتي tenan بعد الصفة، أما rada وkurang فقبلها.
      en: tenan follows the adjective; rada and kurang go before it.
    words: [tenan, enak]
  - id: e06
    type: fill_blank
    sentence: Sambele ___ banget.
    meaning:
      ar_eg: الصوص حرّاق أوي.
      ar: الصلصة حارّة جدًا.
      en: The chilli sauce is very spicy.
    answers: [pedhes, pedes]
    explain:
      ar_eg: pedhes بالـ dh في الإملا الرسمي، والشات بيكتبها pedes.
      ar: تُكتب pedhes بـ dh رسميًا، وpedes في الدردشة.
      en: Standard spelling is pedhes with dh; chats write pedes.
    words: [pedhes, banget]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الشاي مسكّر شوية.
      ar: الشاي حلو قليلًا.
      en: The tea is a bit sweet.
    answers: ["Tehe rada legi.", Tehe rada legi]
    words: [rada, legi]
  - id: e08
    type: dictation
    text: Sambel pecel rada pedhes.
    meaning:
      ar_eg: صوص البيتشل حرّاق شوية.
      ar: صلصة البيتشل حارّة قليلًا.
      en: The pecel sauce is a bit spicy.
    words: [sambel, rada, pedhes]
  - id: e09
    type: speaking
    text: Enak tenan, Bu!
    meaning:
      ar_eg: حلو بجد يا طنط!
      ar: لذيذ حقًا يا سيدتي!
      en: Really tasty, ma'am!
    words: [enak, tenan]
dialogue:
  lines:
    - speaker: Sari
      text: Mohamed, sambele piye?
      ar_eg: محمد، الصلصة عاملة إيه؟
      ar: محمد، كيف الصلصة؟
      en: Mohamed, how's the sambal?
    - speaker: Mohamed
      text: Pedhes tenan!
      ar_eg: حراقة قوي!
      ar: حارّة جدًّا!
      en: Really spicy!
    - speaker: Sari
      text: Tehe legi ora?
      ar_eg: الشاي مسكّر؟
      ar: هل الشاي حلو؟
      en: Is the tea sweet?
    - speaker: Mohamed
      text: Rada legi. Enak!
      ar_eg: مسكّر شوية. حلو!
      ar: حلو قليلًا. لذيذ!
      en: A bit sweet. Tasty!
