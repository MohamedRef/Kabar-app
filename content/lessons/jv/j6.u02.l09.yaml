schema: kabar.lesson/v1
id: j6.u02.l09
language: jv
title: Jadwal ngaji
can_do:
  ar_eg: تقرا جدول حلقة القرآن على لوحة الجامع.
  ar: أن تقرأ جدول حلقة القرآن على لوح المسجد.
  en: Read the Qur'an class timetable on the mosque board.
slides:
  - title: Papan ing masjid
    body:
      ar_eg: |
        على باب Masjid Gedhe Mataram فيه لوحة صغيرة بالخط الجاوي: مواعيد حلقة القرآن للعيال.
        هتلاقي كل علامات الحركات اللي اتعلمتها: wulu وsuku وtaling وpepet وtaling tarung، وكمان ꦉ (pa cerek) في Rebo.
      ar: |
        على باب Masjid Gedhe Mataram لوح صغير بالخط الجاوي: مواعيد حلقة القرآن للأطفال.
        ستجد فيه كل علامات الحركات التي تعلمتها: wulu وsuku وtaling وpepet وtaling tarung، وكذلك ꦉ (pa cerek) في Rebo.
      en: |
        On the door of Masjid Gedhe Mataram there's a small board in aksara Jawa: the children's Qur'an class times.
        You'll find every vowel mark you've learned: wulu, suku, taling, pepet, taling tarung, and ꦉ (pa cerek) in Rebo.
    grammar: jv.aksara.sandhangan-swara
    examples:
      - text: ꦔꦗꦶꦱꦺꦴꦫꦺ (ngaji sore)
        ar_eg: حلقة القرآن العصر
        ar: حلقة القرآن عصرًا
        en: Qur'an class in the afternoon
      - text: ꦱꦼꦭꦱ · ꦉꦧꦺꦴ · ꦱꦼꦠꦸ (Selasa · Rebo · Setu)
        ar_eg: التلات · الأربع · السبت
        ar: الثلاثاء · الأربعاء · السبت
        en: Tuesday · Wednesday · Saturday
      - text: "ꦒꦸꦫꦸꦧꦸꦢꦺꦮꦶ (guru: Bu Dewi)"
        ar_eg: "المدرّسة: Bu Dewi"
        ar: "المعلّمة: Bu Dewi"
        en: "teacher: Bu Dewi"
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب اللوحة، الحلقة أنهي أيام؟
      ar: بحسب اللوح، في أي أيام الحلقة؟
      en: According to the board, on which days is the class?
    options: ["Senin, Rebo, Setu", "Selasa, Rebo, Setu", "Selasa, Kemis, Setu"]
    answer: 1
    words: [pepet, taling tarung]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الحلقة إمتى في اليوم؟
      ar: في أي وقت من اليوم الحلقة؟
      en: At what time of day is the class?
    options: [esuk, sore, bengi]
    answer: 1
    explain:
      ar_eg: "ꦱꦺꦴꦫꦺ = sore (بعد الضهر / العصر): taling tarung على ꦱ وtaling قبل ꦫ."
      ar: "ꦱꦺꦴꦫꦺ = sore (العصر): taling tarung على ꦱ وtaling قبل ꦫ."
      en: "ꦱꦺꦴꦫꦺ = sore (afternoon): taling tarung on ꦱ, taling before ꦫ."
    words: [taling tarung, taling]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بتدرّس؟
      ar: من المعلّمة؟
      en: Who teaches?
    options: [Bu Wiji, Bu Maya, Bu Dewi]
    answer: 2
    words: [taling, wulu]
  - id: e04
    type: listen
    text: Rebo
    question:
      ar_eg: سمعت يوم من أيام الحلقة. بيتكتب إزاي؟
      ar: سمعت يومًا من أيام الحلقة. كيف يُكتب؟
      en: You heard one of the class days. How is it written?
    options: ["ꦫꦧꦺꦴ", "ꦉꦧꦺꦴ", "ꦉꦧꦸ"]
    answer: 1
    explain:
      ar_eg: rê بتتكتب بحرفها الخاص ꦉ (pa cerek)، وبعدها bo بـ taling tarung.
      ar: تُكتب rê بحرفها الخاص ꦉ (pa cerek)، ثم bo بـ taling tarung.
      en: rê has its own letter ꦉ (pa cerek), then bo with taling tarung.
    meaning:
      ar_eg: الأربع
      ar: الأربعاء
      en: Wednesday
    words: [pa cerek, taling tarung]
  - id: e05
    type: match_pairs
    pairs:
      - text: ꦱꦼꦭꦱ
        ar_eg: Selasa — التلات
        ar: Selasa — الثلاثاء
        en: Selasa — Tuesday
      - text: ꦉꦧꦺꦴ
        ar_eg: Rebo — الأربع
        ar: Rebo — الأربعاء
        en: Rebo — Wednesday
      - text: ꦱꦼꦠꦸ
        ar_eg: Setu — السبت
        ar: Setu — السبت
        en: Setu — Saturday
      - text: ꦱꦺꦴꦫꦺ
        ar_eg: sore — العصر / بعد الضهر
        ar: sore — العصر
        en: sore — afternoon
    words: [pepet, pa cerek, taling tarung]
  - id: e06
    type: fill_blank
    sentence: ꦱꦼꦠꦸ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: السبت)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: السبت)"
      en: Type the reading in Latin letters. (It means "Saturday".)
    answers: [Setu]
    explain:
      ar_eg: ꦱꦼ = se بـ pepet فوق ꦱ، وꦠꦸ = tu بـ suku تحت ꦠ.
      ar: ꦱꦼ = se بـ pepet فوق ꦱ، وꦠꦸ = tu بـ suku تحت ꦠ.
      en: ꦱꦼ = se with pepet above ꦱ, ꦠꦸ = tu with suku below ꦠ.
    words: [pepet, suku]
  - id: e07
    type: build_sentence
    source:
      ar_eg: "اكتب «ngaji sore» مقطع مقطع."
      ar: "اكتب «ngaji sore» مقطعًا مقطعًا."
      en: Build "ngaji sore", syllable by syllable.
    answer: ꦔ ꦗꦶ ꦱꦺꦴ ꦫꦺ
    distractors: ["ꦱꦼ"]
    words: [wulu, taling tarung, taling]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦒꦸꦫꦸꦧꦸꦢꦺꦮꦶ"
      ar: "اكتب بالحروف اللاتينية: ꦒꦸꦫꦸꦧꦸꦢꦺꦮꦶ"
      en: "Write in Latin letters: ꦒꦸꦫꦸꦧꦸꦢꦺꦮꦶ"
    answers: [guru Bu Dewi, "guru: Bu Dewi", gurubudewi]
    words: [suku, taling, wulu]
  - id: e09
    type: speaking
    text: Ngaji sore, Selasa, Rebo lan Setu.
    meaning:
      ar_eg: حلقة القرآن العصر، يوم التلات والأربع والسبت.
      ar: حلقة القرآن عصرًا، أيام الثلاثاء والأربعاء والسبت.
      en: Qur'an class in the afternoon, on Tuesday, Wednesday and Saturday.
dialogue:
  title: Ing lawang masjid
  lines:
    - speaker: Mohamed
      text: Mas, papan iki jadwal ngaji, ta?
      ar_eg: يا ديماس، اللوحة دي جدول الحلقة، مش كده؟
      ar: يا ديماس، هذا اللوح جدول الحلقة، أليس كذلك؟
      en: Mas, this board is the Qur'an class timetable, isn't it?
    - speaker: Dimas
      text: Iya. Coba wacanen dinane.
      ar_eg: أيوه. جرّب اقرا الأيام.
      ar: نعم. جرّب أن تقرأ الأيام.
      en: Yes. Try reading the days.
    - speaker: Mohamed
      text: Selasa, Rebo lan Setu. Kabeh sore.
      ar_eg: التلات والأربع والسبت. كلهم العصر.
      ar: الثلاثاء والأربعاء والسبت. كلها عصرًا.
      en: Tuesday, Wednesday and Saturday. All in the afternoon.
    - speaker: Dimas
      text: Bener. Gurune Bu Dewi.
      ar_eg: صح. والمدرّسة Bu Dewi.
      ar: صحيح. والمعلّمة Bu Dewi.
      en: Right. The teacher is Bu Dewi.
    - speaker: Mohamed
      text: Aku arep melu ngaji Setu sore!
      ar_eg: أنا عايز أحضر الحلقة السبت العصر!
      ar: أريد أن أحضر الحلقة يوم السبت عصرًا!
      en: I want to join the class on Saturday afternoon!
review:
  status: draft
  verified: false
