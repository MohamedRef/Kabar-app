schema: kabar.lesson/v1
id: j4.u05.l13
language: jv
title: Ulangan J4.5
can_do:
  ar_eg: تختار بين ngoko alus وkrama alus.
  ar: أن تختار بين ngoko alus وkrama alus.
  en: Pick ngoko alus vs krama alus.
slides:
  - title: Papat undha-usuk
    body:
      ar_eg: |
        «رايح فين؟» بأربع درجات:
        ngoko lugu (صاحبك): Kowe arep lunga menyang ngendi?
        ngoko alus (قريب وأكبر: أختك الكبيرة، صاحب أكبر): Panjenengan / Mas arep tindak menyang ngendi?
        krama lugu (بياع، غريب في سنّك): Sampeyan badhe kesah dhateng pundi?
        krama alus (الكبار، المدرسين): Panjenengan badhe tindak dhateng pundi?
        السؤال اللي تسأله لنفسك: هو قريب مني؟ وهو أكبر مني؟
      ar: |
        «إلى أين تذهب؟» بأربع درجات:
        ngoko lugu (الصديق): Kowe arep lunga menyang ngendi?
        ngoko alus (القريب الأكبر): Panjenengan / Mas arep tindak menyang ngendi?
        krama lugu (البائع، النظير الغريب): Sampeyan badhe kesah dhateng pundi?
        krama alus (الكبار، المعلمون): Panjenengan badhe tindak dhateng pundi?
        واسأل نفسك: هل هو قريب مني؟ وهل هو أكبر مني؟
      en: |
        "Where are you going?" at four steps:
        ngoko lugu (a friend): Kowe arep lunga menyang ngendi?
        ngoko alus (close and senior: older sister, older friend): Panjenengan / Mas arep tindak menyang ngendi?
        krama lugu (a seller, a stranger your age): Sampeyan badhe kesah dhateng pundi?
        krama alus (elders, teachers): Panjenengan badhe tindak dhateng pundi?
        Ask yourself two things: are they close to me? Are they older than me?
    grammar: jv.speechlevel.mixed
    examples:
      - text: Mbak wis dhahar? — Pak, panjenengan sampun dhahar?
        ar_eg: أكلتي يا أبلة؟ (ngoko alus) — حضرتك أكلت يا أستاذ؟ (krama alus)
        ar: هل أكلتِ يا أختي؟ (ngoko alus) — هل تفضّلت بالأكل يا سيدي؟ (krama alus)
        en: Have you eaten, sis? (ngoko alus) — Have you eaten, sir? (krama alus)
