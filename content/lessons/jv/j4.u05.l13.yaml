dialogue:
  title: Ing ngarep Masjid Syuhada
  lines:
    - speaker: Mohamed
      text: Mbak Ratri, panjenengan arep tindak menyang ngendi?
      ar_eg: يا أبلة راتري، حضرتك رايحة فين؟
      ar: يا راتري، إلى أين تذهبين؟
      en: Ratri, where are you going?
    - speaker: Mbak Ratri
      text: Menyang Masjid Syuhada, Mohamed. Kowe?
      ar_eg: على مسجد الشهدا يا محمد. وإنت؟
      ar: إلى مسجد الشهداء يا محمد. وأنت؟
      en: To the Syuhada Mosque, Mohamed. You?
    - speaker: Mohamed
      text: Aku uga, Mbak. Lho, iku Pak Bambang.
      ar_eg: وأنا كمان. الله، ده الدكتور بامبانج.
      ar: وأنا أيضًا. انظري، هذا الأستاذ بامبانغ.
      en: Me too. Oh, there's Pak Bambang.
    - speaker: Mohamed
      text: Sugeng siang, Pak. Panjenengan badhe tindak dhateng masjid ugi?
      ar_eg: مساء الخير يا أستاذ. حضرتك رايح المسجد كمان؟
      ar: طاب يومك يا سيدي. هل تتوجّه إلى المسجد أيضًا؟
      en: Good afternoon, sir. Are you going to the mosque too?
    - speaker: Pak Bambang
      text: Inggih, Mas. Mangga.
      ar_eg: أيوه يا ابني. يلا بينا.
      ar: نعم يا بني. تفضّل.
      en: Yes. After you.
    - speaker: Mbak Ratri
      text: Kramamu apik tenan, Mohamed!
      ar_eg: الكراما بتاعتك حلوة بجد يا محمد!
      ar: كراماك جميلة حقًا يا محمد!
      en: Your krama is really good, Mohamed!
souvenir:
  id: j4.u05.souvenir
  title: Kotabaru
  note:
    ar_eg: |
      كوتابارو حي اتبنى أيام الهولنديين بشوارع واسعة وفيلات وجناين، وفي نصه مسجد الشهدا (Masjid Syuhada)، اتبنى أوائل الخمسينات تخليدًا لشهداء الاستقلال — وsyuhada هي «شهداء» العربي بالظبط. في البيوت هنا هتسمع ngoko alus كل يوم: الأخ الصغير بيقول لأخته الكبيرة «Mbak wis dhahar?»، إطار بيتي ودافي وجواه احترام.
    ar: |
      كوتابارو حيّ بُني في العهد الهولندي بشوارع واسعة وفيلات وحدائق، وفي وسطه مسجد الشهداء (Masjid Syuhada) الذي بُني أوائل الخمسينيات تخليدًا لشهداء الاستقلال، وsyuhada هي «شهداء» العربية بعينها. وفي بيوته تسمع ngoko alus كل يوم: يقول الأخ الأصغر لأخته الكبرى «Mbak wis dhahar?»، إطار بيتيّ دافئ في داخله احترام.
    en: |
      Kotabaru is a Dutch-era quarter of wide streets, villas and gardens, and at its heart stands the Syuhada Mosque, built in the early 1950s to honour those who died for independence. Syuhada is Arabic «شهداء», martyrs. In the homes here you'll hear ngoko alus every day: a younger brother asking his older sister "Mbak wis dhahar?", a warm, familiar frame with respect inside.
