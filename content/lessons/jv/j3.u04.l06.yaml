schema: kabar.lesson/v1
id: j3.u04.l06
language: jv
title: Numpak andong
can_do:
  ar_eg: 'تركب أندونج في جوجا: الاتجاهات بالكراما، قريب، تحت، تطلب تيجي معاهم، وتقول إنك نسيت حاجة.'
  ar: 'أن تركب عربة الأندونج في جوكجاكرتا: الجهات بالكراما، قريب، تحت، تطلب مرافقتهم، وتقول إنك نسيت شيئًا.'
  en: 'Ride an andong in Jogja: compass directions in krama, near, under, ask to come along, and say you left something behind.'
slides:
  - title: Ler, wetan, kilen
    body:
      ar_eg: |
        andong = عربية حنطور بحصان، مشهورة في مالويورو وحوالين الكراتون.
        الاتجاهات بالكراما: lor ← ler = شمال، kulon ← kilen = غرب، wetan = شرق (زي ما هي).
        cedhak ← celak = قريب. ngisor ← ngandhap = تحت.
        melu ← tumut = ييجي معاك، يشارك: «Kula tumut, nggih?» = أجي معاكم؟
        kari ← kantun = اتنسى، فضل ورا: «Tas kula kantun!» = نسيت شنطتي!
      ar: |
        andong = عربة يجرّها حصان، مشهورة في شارع ماليوبورو وحول القصر (الكراتون).
        الجهات بالكراما: lor ← ler = شمال، kulon ← kilen = غرب، wetan = شرق (كما هي).
        cedhak ← celak = قريب. ngisor ← ngandhap = تحت.
        melu ← tumut = يرافق، يشارك: «Kula tumut, nggih?» = هل أرافقكم؟
        kari ← kantun = تُرك، بقي خلفًا: «Tas kula kantun!» = نسيتُ حقيبتي!
      en: |
        andong = a horse-drawn carriage, famous on Malioboro and round the Kraton.
        Directions in krama: lor → ler = north, kulon → kilen = west, wetan = east (unchanged).
        cedhak → celak = near. ngisor → ngandhap = under, below.
        melu → tumut = come along, join: "Kula tumut, nggih?" = may I come along?
        kari → kantun = left behind: "Tas kula kantun!" = I've left my bag behind!
    examples:
      - text: Pura Pakualaman ing wetan, celak.
        ar_eg: قصر باكوالامان ناحية الشرق، قريب.
        ar: قصر باكوالامان في الشرق، قريب.
        en: Pura Pakualaman is to the east, nearby.
      - text: Tugu ing ler, Taman Sari ing kilen Kraton.
        ar_eg: التوجو في الشمال، وتامان ساري غرب الكراتون.
        ar: التوغو في الشمال، وتامان ساري غرب القصر.
        en: The Tugu is to the north, Taman Sari west of the Kraton.
      - text: Pak, tas kula kantun ing ngandhap kursi!
        ar_eg: يا أسطى، شنطتي اتنسيت تحت الكرسي!
        ar: يا سيدي، نسيتُ حقيبتي تحت المقعد!
        en: Sir, I left my bag under the seat!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: andong
        ar_eg: حنطور بحصان
        ar: عربة يجرّها حصان
        en: horse-drawn carriage
      - text: ler
        ar_eg: شمال (كراما)
        ar: شمال (كراما)
        en: north (krama)
      - text: wetan
        ar_eg: شرق
        ar: شرق
        en: east
      - text: kilen
        ar_eg: غرب (كراما)
        ar: غرب (كراما)
        en: west (krama)
    words: [andong, ler, wetan, kilen]
  - id: e02
    type: match_pairs
    pairs:
      - text: celak
        ar_eg: قريب (كراما)
        ar: قريب (كراما)
        en: near (krama)
      - text: ngandhap
        ar_eg: تحت (كراما)
        ar: تحت (كراما)
        en: under, below (krama)
      - text: tumut
        ar_eg: ييجي معاك (كراما)
        ar: يرافق (كراما)
        en: come along, join (krama)
      - text: kantun
        ar_eg: اتنسى، فضل ورا (كراما)
        ar: تُرك خلفًا (كراما)
        en: left behind (krama)
    words: [celak, ngandhap, tumut, kantun]
  - id: e03
    type: listen
    text: Taman Sari ing kilen Kraton.
    question:
      ar_eg: تامان ساري فين؟
      ar: أين تامان ساري؟
      en: Where is Taman Sari?
    options: [تامان ساري غرب الكراتون, تامان ساري شرق الكراتون, تامان ساري شمال الكراتون]
    answer: 0
    meaning:
      ar_eg: تامان ساري غرب الكراتون.
      ar: تامان ساري غرب القصر.
      en: Taman Sari is west of the Kraton.
    words: [kilen, wetan, ler]
  - id: e04
    type: fill_blank
    sentence: Pak, kula ___, nggih? Kula ugi badhe dhateng Kraton.
    meaning:
      ar_eg: يا أسطى، ___، ماشي؟ أنا كمان رايح الكراتون.
      ar: يا سيدي، ___، حسنًا؟ أنا أيضًا ذاهب إلى القصر.
      en: Sir, may I ___? I'm going to the Kraton too.
    options: [tumut, kantun, celak]
    answers: [tumut]
    words: [tumut, kantun, celak]
  - id: e05
    type: multiple_choice
    question: lor (ngoko) → ___ (krama)
    options: [ler, kilen, wetan]
    answer: 0
    explain:
      ar_eg: 'lor بالنغوكو، ler بالكراما: شمال. kilen = غرب، wetan = شرق.'
      ar: 'lor بالنغوكو وler بالكراما: شمال. kilen = غرب، wetan = شرق.'
      en: 'lor is ngoko, ler is krama: north. kilen = west, wetan = east.'
    words: [ler, kilen, wetan]
  - id: e06
    type: fill_blank
    sentence: Tasipun ing ___ kursi, Mas.
    meaning:
      ar_eg: الشنطة ___ الكرسي يا أستاذ.
      ar: الحقيبة ___ المقعد يا أخي.
      en: The bag is ___ the seat.
    options: [ngandhap, wetan, andong]
    answers: [ngandhap]
    words: [ngandhap, wetan, andong]
  - id: e07
    type: build_sentence
    source:
      ar_eg: نسيت شنطتي في الحنطور.
      ar: نسيتُ حقيبتي في العربة.
      en: I left my bag in the andong.
    answer: Tas kula kantun ing andong
    distractors: [tumut, ler]
    words: [kantun, andong]
  - id: e08
    type: translate
    direction: from_target
    source_text: Pura Pakualaman ing wetan, celak sanget.
    answers_meaning:
      ar_eg: [قصر باكوالامان ناحية الشرق، قريب أوي, باكوالامان في الشرق وقريب خالص]
      ar: [قصر باكوالامان في الشرق، قريب جدًا]
      en: ['Pura Pakualaman is to the east, very near', Pakualaman Palace is east and very close]
    words: [wetan, celak]
  - id: e09
    type: speaking
    text: Andongipun ing ler, celak Tugu.
    meaning:
      ar_eg: الحنطور ناحية الشمال، جنب التوجو.
      ar: العربة في الشمال، قرب التوغو.
      en: The andong is to the north, near the Tugu.
    words: [andong, ler, celak]
  - id: e10
    type: multiple_choice
    question: kari (ngoko) → ___ (krama)
    options: [tumut, kantun, ngandhap]
    answer: 1
    explain:
      ar_eg: 'kari بالنغوكو، kantun بالكراما: اتنسى وفضل ورا. tumut = ييجي معاك، ngandhap = تحت.'
      ar: 'kari بالنغوكو وkantun بالكراما: تُرك خلفًا. tumut = يرافق، ngandhap = تحت.'
      en: 'kari is ngoko, kantun is krama: left behind. tumut = come along, ngandhap = under.'
    words: [kantun, tumut, ngandhap, kilen]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, andongipun kosong? Dhateng Pura Pakualaman pinten?
      ar_eg: يا أسطى، الحنطور فاضي؟ لباكوالامان بكام؟
      ar: يا سيدي، هل العربة فارغة؟ كم الأجرة إلى باكوالامان؟
      en: Sir, is the andong free? How much to Pura Pakualaman?
    - speaker: Kusir
      text: Kosong, Mas. Pakualaman ing wetan, celak. Seket ewu mawon.
      ar_eg: فاضي يا أستاذ. باكوالامان شرق، قريبة. خمسين ألف بس.
      ar: فارغة يا أخي. باكوالامان في الشرق، قريبة. خمسون ألفًا فقط.
      en: It's free, mate. Pakualaman's east, close by. Just fifty thousand.
    - speaker: Mas Dimas
      text: Aku melu ya, Med!
      ar_eg: أنا جاي معاك يا مِد!
      ar: سآتي معك يا مِد!
      en: I'm coming too, Med!
    - speaker: Mohamed
      text: Pak, kanca kula tumut, nggih?
      ar_eg: يا أسطى، صاحبي جاي معانا، ماشي؟
      ar: يا سيدي، صديقي سيرافقنا، حسنًا؟
      en: Sir, my friend's coming along, OK?
    - speaker: Kusir
      text: Mangga. Tasipun dipunselehaken ing ngandhap kursi.
      ar_eg: اتفضلوا. حطّوا الشنط تحت الكرسي.
      ar: تفضّلا. ضعا الحقائب تحت المقعد.
      en: Go ahead. Put your bags under the seat.
    - speaker: Mohamed
      text: Waduh, payung kula kantun ing warung!
      ar_eg: يا خبر، الشمسية بتاعتي اتنسيت في الوارونج!
      ar: يا للمصيبة، نسيتُ مظلّتي في المطعم!
      en: Oh no, I've left my umbrella at the warung!
