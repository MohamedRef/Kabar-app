language: jv
title: Ulangan J6.3
can_do:
  ar_eg: تقرا وتبني جملة قصيرة.
  ar: أن تقرأ جملة قصيرة وتركّبها.
  en: Read and build a short sentence.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: cecak
        ar_eg: ng في آخر المقطع
        ar: ng في آخر المقطع
        en: closing ng
      - text: layar
        ar_eg: r في آخر المقطع
        ar: r في آخر المقطع
        en: closing r
      - text: wignyan
        ar_eg: h في آخر المقطع
        ar: h في آخر المقطع
        en: closing h
      - text: pangkon
        ar_eg: أي حرف ساكن تاني، قبل الوقف
        ar: سائر السواكن، عند الوقف
        en: any other consonant, before a pause
      - text: nglayat
        ar_eg: يروح العزا
        ar: يقدّم العزاء
        en: pay condolences
      - text: kijing
        ar_eg: غطا القبر
        ar: غطاء القبر
        en: grave cover
    words: [cecak, layar, wignyan, pangkon, nglayat, kijing]
  - id: e02
    type: match_pairs
    pairs:
