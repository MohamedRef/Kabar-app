schema: kabar.lesson/v1
id: j6.u04.l12
language: jv
title: Kenalan karo Bimo
can_do:
  ar_eg: تقرا تعريف شخصي قصير بالخط الجاوي وتكتب جملة عن نفسك.
  ar: أن تقرأ تعريفًا شخصيًّا قصيرًا بالخط الجاوي وتكتب جملة عن نفسك.
  en: Read a short self-introduction in aksara Jawa and write a line about yourself.
slides:
  - title: Profil Bimo
    body:
      ar_eg: |
        Mas Bimo، صاحب ديماس من Jagalan، كتب تعريف عن نفسه بالخط الجاوي لمجموعة الحتة.
        كلمتين جداد: tukang = صنايعي، وperak = فضة. tukang perak = صايغ فضة، شغلانة كوتاغيدي المشهورة.
        بص على الـ pasangan: anak loro (k + la)، lan wadon (n + wa).
      ar: |
        كتب Mas Bimo، صديق ديماس من Jagalan، تعريفًا بنفسه بالخط الجاوي لمجموعة الحيّ.
        كلمتان جديدتان: tukang = حِرَفيّ، وperak = فضة؛ tukang perak = صائغ فضة، حرفة كوتاغيدي الشهيرة.
        لاحظ الـ pasangan: anak loro (k + la)، lan wadon (n + wa).
      en: |
        Mas Bimo, Dimas's friend from Jagalan, wrote a self-introduction in aksara Jawa for the neighbourhood group.
        Two new words: tukang = craftsman, perak = silver. tukang perak = silversmith, Kotagede's famous trade.
        Spot the pasangan: anak loro (k + la), lan wadon (n + wa).
    grammar: jv.aksara.pasangan
    examples:
      - text: ꦗꦼꦤꦼꦁꦏꦸꦧꦶꦩꦺꦴ꧉ꦲꦏꦸꦠꦸꦏꦁꦥꦼꦫꦏ꧀꧉ (Jenengku Bimo. Aku tukang perak.)
        ar_eg: اسمي بيمو. أنا صايغ فضة.
        ar: اسمي بيمو. أنا صائغ فضة.
        en: My name is Bimo. I'm a silversmith.
      - text: ꦲꦺꦴꦩꦃꦏꦸꦲꦶꦁꦗꦒꦭꦤ꧀꧉ (Omahku ing Jagalan.)
        ar_eg: بيتي في Jagalan.
        ar: بيتي في Jagalan.
        en: My house is in Jagalan.
      - text: ꦲꦏꦸꦢꦸꦮꦺꦲꦤꦏ꧀ꦭꦺꦴꦫꦺꦴ꧈ꦭꦤꦁꦭꦤ꧀ꦮꦢꦺꦴꦤ꧀꧉ (Aku duwe anak loro, lanang lan wadon.)
        ar_eg: عندي عيلين، ولد وبنت.
        ar: لديّ طفلان، ولد وبنت.
        en: I have two children, a boy and a girl.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: Bimo بيشتغل إيه؟
      ar: ما عمل Bimo؟
      en: What does Bimo do?
    options: [guru, tukang perak, bakul]
    answer: 1
    words: [tukang, perak]
    explain:
      ar_eg: "بيمو بيقول: Aku tukang perak، يعني صايغ فضة."
      ar: "يقول بيمو: Aku tukang perak، أي صائغ فضة."
      en: "Bimo says Aku tukang perak: a silversmith."
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: Bimo ساكن فين؟
      ar: أين يسكن Bimo؟
      en: Where does Bimo live?
    options: [ing Imogiri, ing Plered, ing Jagalan]
    answer: 2
    explain:
      ar_eg: "بيمو بيقول: Omahku ing Jagalan."
      ar: "يقول بيمو: Omahku ing Jagalan."
      en: Bimo says Omahku ing Jagalan.
  - id: e03
    type: listen
    text: Aku duwe anak loro, lanang lan wadon.
    question:
      ar_eg: Bimo عنده كام عيل؟
      ar: كم طفلًا لدى Bimo؟
      en: How many children does Bimo have?
    options: [siji, loro, telu]
    answer: 1
    meaning:
      ar_eg: عندي عيلين، ولد وبنت.
      ar: لديّ طفلان، ولد وبنت.
      en: I have two children, a boy and a girl.
    words: [pasangan]
  - id: e04
    type: match_pairs
    pairs:
      - text: ꦠꦸꦏꦁ
        ar_eg: tukang — صنايعي
        ar: tukang — حِرَفيّ
        en: tukang — craftsman
      - text: ꦥꦼꦫꦏ꧀
        ar_eg: perak — فضة
        ar: perak — فضة
        en: perak — silver
      - text: ꦲꦺꦴꦩꦃꦏꦸ
        ar_eg: omahku — بيتي
        ar: omahku — بيتي
        en: omahku — my house
      - text: ꦗꦼꦤꦼꦁꦏꦸ
        ar_eg: jenengku — اسمي
        ar: jenengku — اسمي
        en: jenengku — my name
    words: [tukang, perak]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "في ꦲꦤꦏ꧀ꦭꦺꦴꦫꦺꦴ، الـ la مكتوبة إزاي؟"
      ar: "في ꦲꦤꦏ꧀ꦭꦺꦴꦫꦺꦴ، كيف كُتبت la؟"
      en: "In ꦲꦤꦏ꧀ꦭꦺꦴꦫꦺꦴ, how is the l of loro written?"
    options: [pasangan la, cecak, layar]
    answer: 0
    explain:
      ar_eg: الـ k في anak مالهاش حركة وبعدها l على طول، فالـ l بتتكتب pasangan تحت ꦏ.
      ar: الـ k في anak ساكنة وتليها l مباشرة، فتُكتب l pasangan تحت ꦏ.
      en: The k of anak is vowel-less right before l, so l is a pasangan under ꦏ.
    words: [pasangan]
  - id: e06
    type: fill_blank
    sentence: Aku tukang ___. Aku nggawe cincin.
    meaning:
      ar_eg: أنا صايغ فضة. بعمل خواتم.
      ar: أنا صائغ فضة. أصنع خواتم.
      en: I'm a silversmith. I make rings.
    options: [perak, pacul, gang]
    answers: [perak]
    words: [perak, tukang]
    explain:
      ar_eg: tukang perak = صايغ فضة، وهو اللي بيعمل خواتم. pacul = فاس وgang = حارة.
      ar: tukang perak صائغ الفضة الذي يصنع الخواتم. أما pacul فمعول وgang زقاق.
      en: tukang perak is a silversmith, who makes rings. pacul is a hoe and gang is an alley.
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦲꦺꦴꦩꦃꦏꦸꦲꦶꦁꦗꦒꦭꦤ꧀꧉"
      ar: "اكتب بالحروف اللاتينية: ꦲꦺꦴꦩꦃꦏꦸꦲꦶꦁꦗꦒꦭꦤ꧀꧉"
      en: "Write in Latin letters: ꦲꦺꦴꦩꦃꦏꦸꦲꦶꦁꦗꦒꦭꦤ꧀꧉"
    answers: ["Omahku ing Jagalan.", omahku ing jagalan]
    explain:
      ar_eg: omah بتخلص بـ wignyan، فـ ku بتتكتب عادي من غير pasangan.
      ar: تنتهي omah بـ wignyan، فتُكتب ku عادية بلا pasangan.
      en: omah ends with wignyan, so ku is written normally, with no pasangan.
  - id: e08
    type: build_sentence
    source:
      ar_eg: "اكتب عن نفسك: «Aku saka Mesir.» (أنا من مصر) مقطع مقطع."
      ar: "اكتب عن نفسك: «Aku saka Mesir.» (أنا من مصر) مقطعًا مقطعًا."
      en: "Write about yourself — «Aku saka Mesir.» (I'm from Egypt) — syllable by syllable."
    answer: ꦲ ꦏꦸ ꦱ ꦏ ꦩꦼ ꦱꦶꦂ
    distractors: ["ꦱꦶ"]
    explain:
      ar_eg: "Mesir آخرها r: ꦱꦶꦂ بالـ layar. ꦱꦶ لوحدها = si من غير r."
      ar: Mesir تنتهي بـ r فتُكتب ꦱꦶꦂ بالـ layar؛ أما ꦱꦶ وحدها فـ si.
      en: Mesir ends in r, so ꦱꦶꦂ with layar. ꦱꦶ alone is si.
  - id: e09
    type: speaking
    text: Jenengku Mohamed. Aku saka Mesir.
    meaning:
      ar_eg: اسمي محمد. أنا من مصر.
      ar: اسمي محمد. أنا من مصر.
      en: My name is Mohamed. I'm from Egypt.
dialogue:
  title: Ing bengkel perak
  lines:
    - speaker: Mohamed
      text: Mas Bimo, aku wis maca profilmu.
      ar_eg: يا Bimo، قريت التعريف بتاعك.
      ar: يا Bimo، قرأتُ تعريفك.
      en: Mas Bimo, I've read your profile.
    - speaker: Mas Bimo
      text: Wah, nganggo aksara Jawa! Isa maca kabeh?
      ar_eg: يا سلام، بالخط الجاوي! عرفت تقراه كله؟
      ar: رائع، بالخط الجاوي! أقرأته كله؟
      en: Wow, in aksara Jawa! Could you read all of it?
    - speaker: Mohamed
      text: Isa. Kowe tukang perak, duwe anak loro.
      ar_eg: أيوه. إنت صايغ فضة، وعندك عيلين.
      ar: نعم. أنت صائغ فضة ولديك طفلان.
      en: Yes. You're a silversmith with two children.
    - speaker: Mas Bimo
      text: Bener! Ayo ta, tak duduhi bengkelku.
      ar_eg: مظبوط! تعالى أفرّجك على ورشتي.
      ar: صحيح! تعالَ أُريك ورشتي.
      en: Right! Come, I'll show you my workshop.
new_words:
  - word: tukang
    pos: noun
    ar_eg: صنايعي / حِرَفي
    ar: حِرَفيّ / صانع
    en: craftsman, tradesman = tukang
    same_as_id: true
  - word: perak
    pos: noun
    ar_eg: فضة؛ tukang perak = صايغ فضة
    ar: فضة؛ tukang perak = صائغ فضة
    en: silver; tukang perak = silversmith = perak
review:
  status: draft
  verified: false
