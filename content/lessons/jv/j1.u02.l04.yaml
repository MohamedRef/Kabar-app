schema: kabar.lesson/v1
id: j1.u02.l04
language: jv
title: Ulangan J1.2
can_do:
  ar_eg: تعرّف بنفسك وترجّع السؤال للتاني.
  ar: أن تعرّف بنفسك وتسأل محدّثك بالمثل.
  en: Introduce yourself and ask back.
slides:
  - title: Takon lan njawab
    body:
      ar_eg: |
        مراجعة الوحدة:
        - أدوات السؤال: apa (opo)، sapa (sopo)، ngendi / endi، kapan، piye، pira (piro)، ngapa. وفي Arek: yok opo، lapo.
        - السؤال في الآخر زي المصري: Jenengmu sapa? · Omahmu ngendi? · Regane pira?
        - التعريف: Jenengku … · Aku wong Mesir · Aku saka Kairo · Aku guru / mahasiswa · Aku sinau basa Jawa.
        - وترجّع السؤال: «Kowé?» أو «Jenengmu sapa?» أو مع حد أكبر «Mas / Mbak?».
      ar: |
        مراجعة الوحدة:
        - أدوات الاستفهام: apa (opo)، sapa (sopo)، ngendi / endi، kapan، piye، pira (piro)، ngapa، وفي Arek: yok opo وlapo.
        - الأداة في آخر الجملة كالعامية: Jenengmu sapa? · Omahmu ngendi? · Regane pira?
        - التعريف بالنفس: Jenengku … · Aku wong Mesir · Aku saka Kairo · Aku guru / mahasiswa · Aku sinau basa Jawa.
        - وردّ السؤال: «Kowé?» أو «Jenengmu sapa?» أو مع الأكبر «Mas / Mbak?».
      en: |
        Unit review:
        - Question words: apa (opo), sapa (sopo), ngendi / endi, kapan, piye, pira (piro), ngapa; Arek yok opo, lapo.
        - Question word last, as in Egyptian: Jenengmu sapa? · Omahmu ngendi? · Regane pira?
        - Introducing yourself: Jenengku … · Aku wong Mesir · Aku saka Kairo · Aku guru / mahasiswa · Aku sinau basa Jawa.
        - Ask back: "Kowé?", "Jenengmu sapa?", or to someone older "Mas / Mbak?".
    grammar: jv.sentence.basic
    examples:
      - text: Jenengku Mohamed. Jenengmu sapa?
        ar_eg: اسمي محمد. وإنت اسمك إيه؟
        ar: اسمي محمد. وما اسمك؟
        en: My name is Mohamed. What's yours?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sapa
        ar_eg: مين
        ar: مَن
        en: who
      - text: ngendi
        ar_eg: فين
        ar: أين
        en: where
      - text: kapan
        ar_eg: إمتى
        ar: متى
        en: when
      - text: piye
        ar_eg: إزاي
        ar: كيف
        en: how
      - text: pira
        ar_eg: كام / بكام
        ar: كم / بكم
        en: how much
    words: [sapa, ngendi, kapan, piye, pira]
  - id: e02
    type: match_pairs
    pairs:
      - text: opo
        ar_eg: إيه = apa (شات)
        ar: apa (دردشة)
        en: apa (chat)
      - text: sopo
        ar_eg: مين = sapa (شات)
        ar: sapa (دردشة)
        en: sapa (chat)
      - text: piro
        ar_eg: كام = pira (شات)
        ar: pira (دردشة)
        en: pira (chat)
      - text: yok opo
        ar_eg: إزاي = piye (Arek)
        ar: كيف = piye (Arek)
        en: piye (Arek)
      - text: lapo
        ar_eg: ليه = ngapa (Arek)
        ar: لماذا = ngapa (Arek)
        en: ngapa (Arek)
    words: [apa, sapa, pira, yok opo, lapo]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تسأل البيّاع عن السعر. تقول إيه؟
      ar: تريد أن تسأل البائع عن الثمن. ماذا تقول؟
      en: You want to ask the seller the price. What do you say?
    options: ["Regane pira?", "Regane ngendi?", "Regane sapa?"]
    answer: 0
    words: [rega, pira]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة جاوي من غير غلط؟
      ar: أيّ جملة جاوية بلا خطأ؟
      en: Which Javanese sentence has no mistake?
    options: ["Saya wong Mesir.", "Aku wong Mesir.", "Aku iku wong Mesir."]
    answer: 1
    explain:
      ar_eg: saya إندونيسي، وiku مش «يكون». الصح Aku wong Mesir.
      ar: saya إندونيسية، وiku ليست فعل كون، والصواب Aku wong Mesir.
      en: saya is Indonesian and iku isn't "is". Correct = Aku wong Mesir.
    words: [aku, wong]
  - id: e05
    type: multiple_choice
    question: Kowé mahasiswa?
    question_meaning:
      ar_eg: إنت مدرس مش طالب. ترد إزاي؟
      ar: أنت معلم لا طالب. بمَ تجيب؟
      en: You're a teacher, not a student. How do you answer?
    options: ["Iya, aku guru.", "Ora, aku mahasiswa.", "Ora, aku guru."]
    answer: 2
    words: [ora, guru]
  - id: e06
    type: listen
    text: Mas wong ngendi?
    options: ["Mas sinau apa?", "Omahmu ngendi?", "Mas wong ngendi?"]
    answer: 2
    words: [wong, ngendi]
  - id: e07
    type: listen
    text: Aku sinau basa Jawa.
    options: ["Aku saka Jawa.", "Aku sinau basa Jawa.", "Aku guru basa Jawa."]
    answer: 1
    words: [sinau, basa]
  - id: e08
    type: fill_blank
    sentence: Kowé saka ___?
    meaning:
      ar_eg: إنت منين؟
      ar: من أين أنت؟
      en: Where are you from?
    options: ["sapa", "kapan", "ngendi"]
    answers: [ngendi]
    words: [saka, ngendi]
  - id: e09
    type: fill_blank
    sentence: Omah___ gedhe.
    meaning:
      ar_eg: بيتي كبير.
      ar: بيتي كبير.
      en: My house is big.
    options: ["ku", "mu"]
    answers: [ku]
    words: [omah, gedhe]
  - id: e10
    type: build_sentence
    source:
      ar_eg: اسمي محمد. اسمك إيه؟
      ar: اسمي محمد. ما اسمك؟
      en: My name is Mohamed. What's your name?
    answer: Jenengku Mohamed. Jenengmu sapa?
    distractors: [pira, saya]
    words: [jeneng, sapa]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا مصري. وإنت؟
      ar: أنا مصري. وأنت؟
      en: I'm Egyptian. And you?
    answers:
      - Aku wong Mesir. Kowé?
      - Aku wong Mesir. Kowe?
      - Aku wong Mesir, kowé?
      - Aku wong Mesir, kowe?
      - Aku wong Mesir. Kowé piye?
      - Aku wong Mesir. Kowe piye?
      - Aku wong Mesir. Kowé wong ngendi?
      - Aku wong Mesir. Kowe wong ngendi?
      - Aku wong Mesir. Koen?
    words: [wong, kowé]
  - id: e12
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا بتعلم جاوي.
      ar: أنا أتعلّم الجاوية.
      en: I'm learning Javanese.
    answers: ["Aku sinau basa Jawa.", "Aku sinau basa Jawa", "Aku sinau boso Jowo."]
    explain:
      ar_eg: في الشات هتلاقيها «boso Jowo» عشان الـ a بتتنطق o.
      ar: وفي الدردشة تُكتب «boso Jowo» لأن a تُنطق o.
      en: Chats write "boso Jowo", because the a's are said as o.
    words: [sinau, basa]
  - id: e13
    type: translate
    direction: from_target
    source_text: Regane pira, Cak?
    answers_meaning:
      ar_eg: ["بكام يا معلم؟", "بكام ده يا معلم؟", "بكام يا كابتن؟", "السعر كام يا معلم؟"]
      ar: ["بكم يا أخي؟", "كم الثمن يا أخي؟", "بكم هذا يا أخي؟"]
      en: ["How much is it, brother?", "How much, brother?", "What's the price, brother?", "How much is it, mate?"]
    words: [rega, pira, cak]
  - id: e14
    type: dictation
    text: Jenengmu sapa?
    meaning:
      ar_eg: اسمك إيه؟
      ar: ما اسمك؟
      en: What's your name?
    words: [jeneng, sapa]
  - id: e15
    type: speaking
    text: Jenengku Mohamed. Aku saka Kairo. Kowé saka ngendi?
    meaning:
      ar_eg: اسمي محمد. أنا من القاهرة. وإنت منين؟
      ar: اسمي محمد. أنا من القاهرة. ومن أين أنت؟
      en: My name is Mohamed. I'm from Cairo. Where are you from?
    words: [jeneng, saka, ngendi]
dialogue:
  title: Nunggu sepur
  lines:
    - speaker: Mbak Sinta
      text: Mas, sugeng enjing.
      ar_eg: صباح الخير يا أستاذ.
      ar: صباح الخير يا أخي.
      en: Good morning.
    - speaker: Mohamed
      text: Sugeng enjing, Mbak. Jenengku Mohamed. Jenengmu sapa?
      ar_eg: صباح النور يا آنسة. اسمي محمد. اسمك إيه؟
      ar: صباح النور يا آنسة. اسمي محمد. ما اسمك؟
      en: Good morning. My name is Mohamed. What's your name?
    - speaker: Mbak Sinta
      text: Sinta. Mas wong ngendi?
      ar_eg: سينتا. وحضرتك منين؟
      ar: سينتا. ومن أين أنت؟
      en: Sinta. Where are you from?
    - speaker: Mohamed
      text: Aku wong Mesir. Mbak wong Suroboyo?
      ar_eg: أنا مصري. وإنتِ من سورابايا؟
      ar: أنا مصري. وهل أنتِ من سورابايا؟
      en: I'm Egyptian. Are you from Surabaya?
    - speaker: Mbak Sinta
      text: Ora, aku saka Malang. Aku mahasiswa.
      ar_eg: لأ، أنا من مالانج. أنا طالبة.
      ar: لا، أنا من مالانغ. وأنا طالبة جامعية.
      en: No, I'm from Malang. I'm a student.
    - speaker: Mohamed
      text: Apik! Aku sinau basa Jawa.
      ar_eg: حلو! أنا بتعلم جاوي.
      ar: جميل! أنا أتعلّم الجاوية.
      en: Nice! I'm learning Javanese.
souvenir:
  id: j1.u02.souvenir
  title: Stasiun Gubeng
  note:
    ar_eg: |-
      محطة Gubeng من أكبر محطات القطر في سورابايا، ومنها القطارات بتطلع لباقي جاوة — وده بالظبط خط رحلتك في Kabar. وإنت مستني القطر، الجاوي بيبدأ الكلام بأداة سؤال: «Piye kabare?»، و«Regane pira?» عند الكشك. لو حفظت piye وpira، تقدر تفتح أي دردشة على الرصيف.
    ar: |-
      محطة Gubeng من أكبر محطات القطار في سورابايا، ومنها تنطلق القطارات إلى سائر جاوة، وهو خط رحلتك في Kabar. وعلى الرصيف يبدأ الجاوي الحديث بأداة استفهام: «Piye kabare?» و«Regane pira?» عند الكشك. فإذا حفظت piye وpira فتحت أي حديث على الرصيف.
    en: |-
      Gubeng is one of Surabaya's big train stations, where trains leave for the rest of Java — exactly the line your Kabar journey follows. While you wait on the platform, Javanese small talk opens with a question word: "Piye kabare?", and "Regane pira?" at the snack kiosk. Learn piye and pira and you can start a chat with anyone on the platform.
review:
