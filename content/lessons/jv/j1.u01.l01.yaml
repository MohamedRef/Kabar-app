schema: kabar.lesson/v1
id: j1.u01.l01
language: jv
title: Sugeng enjing
can_do:
  ar_eg: تسلّم على الناس بالجاوي في أي وقت من اليوم.
  ar: أن تُحيّي الناس بالجاوية في أي وقت من اليوم.
  en: Greet at any time of day in Javanese.
slides:
  - title: Sugeng enjing = Selamat pagi
    body:
      ar_eg: |
        أهلًا بيك في سورابايا، أول محطة في خط الجاوي! وإنت عارف الإندونيسي، فنص الشغل خلصان.
        في الجاوي، selamat الإندونيسية بتبقى sugeng في التحيات المؤدبة:
        - Selamat pagi → Sugeng enjing (صباح الخير)
        - Selamat siang → Sugeng siang (نهارك سعيد)
        - Selamat sore → Sugeng sonten (مساء الخير، العصر)
        - Selamat malam → Sugeng dalu (مساء الخير / تصبح على خير)
        دي تحيات **krama** (الجاوي المؤدب، ≈ «حضرتك»)، فبتنفع مع أي حد: الكبير، البيّاع، أم صاحبك. زي «صباح الخير يا فندم».
      ar: |
        مرحبًا بك في سورابايا، أولى محطات خط الجاوية! وأنت تعرف الإندونيسية، فنصف الطريق مقطوع.
        تصير selamat الإندونيسية في التحيات المهذبة sugeng:
        - Selamat pagi → Sugeng enjing (صباح الخير)
        - Selamat siang → Sugeng siang (طاب نهارك)
        - Selamat sore → Sugeng sonten (مساء الخير، وقت العصر)
        - Selamat malam → Sugeng dalu (مساء الخير / تصبح على خير)
        وهي تحيات من مستوى **krama** (المستوى المهذب، ≈ «حضرتك»)، فتصلح مع الجميع: الكبير والبائع ووالدة صديقك.
      en: |
        Welcome to Surabaya, the first stop on the Javanese line! You already know Indonesian, so half the work is done.
        In polite greetings, Indonesian selamat becomes sugeng:
        - Selamat pagi → Sugeng enjing (good morning)
        - Selamat siang → Sugeng siang (good day)
        - Selamat sore → Sugeng sonten (good afternoon)
        - Selamat malam → Sugeng dalu (good evening / good night)
        These are **krama** greetings (polite Javanese, ≈ «حضرتك»), so they're safe with anyone: an older person, a seller, your friend's mother.
    examples:
      - text: Sugeng enjing, Bu!
        ar_eg: صباح الخير يا مدام! (krama)
        ar: صباح الخير يا سيدتي! (krama)
        en: Good morning, ma'am! (krama)
      - text: Sugeng dalu, Pak.
        ar_eg: مساء الخير / تصبح على خير يا حاج. (krama)
        ar: مساء الخير / تصبح على خير يا سيدي. (krama)
        en: Good evening / good night, sir. (krama)
  - title: Esuk, awan, sore, bengi
    body:
      ar_eg: |
        الجاوي بيبدّل كلمات كاملة حسب إنت بتكلم مين، مش الضمير بس. حتى أوقات اليوم ليها كلمتين:
        - pagi: esuk (ngoko، بين الصحاب) · enjing (krama، مؤدب)
        - siang: awan (ngoko) · siang (krama)
        - sore: sore (ngoko) · sonten (krama)
        - malam: bengi (ngoko) · dalu (krama)
        ngoko ≈ «إنت»، krama ≈ «حضرتك». عشان كده التحية المؤدبة sugeng enjing فيها enjing مش esuk.
        وبين الصحاب في سورابايا الناس غالبًا مابتقولش sugeng خالص: بيسألوا «Piye kabare?» على طول، أو بيقولوا «Pagi!» بالإندونيسي.
      ar: |
        تبدّل الجاوية ألفاظًا كاملة بحسب المخاطَب، لا الضمير وحده، حتى أوقات اليوم لها لفظان:
        - pagi: esuk (ngoko، بين الأقران) · enjing (krama، مهذب)
        - siang: awan (ngoko) · siang (krama)
        - sore: sore (ngoko) · sonten (krama)
        - malam: bengi (ngoko) · dalu (krama)
        فالـ ngoko ≈ «أنت» والـ krama ≈ «حضرتك»، ولذلك تأتي التحية المهذبة sugeng enjing بلفظ enjing لا esuk.
        أما بين الأصدقاء في سورابايا فقلّما يقال sugeng، بل يُسأل مباشرة «Piye kabare?» أو يقال «Pagi!» بالإندونيسية.
      en: |
        Javanese swaps whole words depending on who you're talking to, not just pronouns. Even the times of day come in pairs:
        - pagi: esuk (ngoko, between friends) · enjing (krama, polite)
        - siang: awan (ngoko) · siang (krama)
        - sore: sore (ngoko) · sonten (krama)
        - malam: bengi (ngoko) · dalu (krama)
        ngoko ≈ «إنت», krama ≈ «حضرتك». That's why the polite greeting is sugeng enjing, not "sugeng esuk".
        Between friends in Surabaya people rarely say sugeng at all: they jump straight to "Piye kabare?" or say Indonesian "Pagi!".
    examples:
      - text: esuk / enjing
        ar_eg: الصبح (ngoko / krama)
        ar: الصباح (ngoko / krama)
        en: morning (ngoko / krama)
      - text: bengi / dalu
        ar_eg: بالليل (ngoko / krama)
        ar: الليل (ngoko / krama)
        en: night (ngoko / krama)
  - title: Piye kabare?
    body:
      ar_eg: |
        piye = bagaimana (إزاي)، وkabare = kabarnya. يعني «Piye kabare?» = «Apa kabar?» = إزيك؟ أخبارك إيه؟
        وkabar هي نفسها «خبر» العربية — عدّت من العربي للإندونيسي وللجاوي كمان.
        الـ -e في آخر kabare زي -nya في الإندونيسي.
        والرد بالـ ngoko: «Apik» (كويس = baik)، أو «Alhamdulillah, apik».
        وفي سورابايا (لهجة Arek) هتسمع كمان: «Yok opo kabare, rek?» = أخباركم إيه يا جدعان؟
      ar: |
        piye = bagaimana (كيف)، وkabare = kabarnya، فـ«Piye kabare?» = «Apa kabar?» = كيف حالك؟
        وkabar هي «خبر» العربية، انتقلت إلى الإندونيسية والجاوية معًا.
        واللاحقة -e في kabare تقابل -nya الإندونيسية.
        والجواب بالـ ngoko: «Apik» (بخير = baik)، أو «Alhamdulillah, apik».
        وفي سورابايا (لهجة Arek) يقال أيضًا: «Yok opo kabare, rek?» = كيف حالكم يا جماعة؟
      en: |
        piye = bagaimana (how), kabare = kabarnya. So "Piye kabare?" = "Apa kabar?" = How are you?
        kabar is Arabic «خبر» (news) — it travelled into Indonesian and Javanese alike.
        The -e on kabare works like Indonesian -nya.
        The ngoko answer: "Apik" (good = baik), or "Alhamdulillah, apik".
        In Surabaya (Arek dialect) you'll also hear "Yok opo kabare, rek?" = How's it going, guys?
    examples:
      - text: Piye kabare? — Apik.
        ar_eg: إزيك؟ — كويس.
        ar: كيف حالك؟ — بخير.
        en: How are you? — Good.
      - text: Yok opo kabare, rek?
        ar_eg: أخباركم إيه يا جدعان؟ (Arek، سورابايا)
        ar: كيف حالكم يا جماعة؟ (Arek، سورابايا)
        en: How's it going, guys? (Arek, Surabaya)
  - title: Matur nuwun, suwun, padha-padha
    body:
      ar_eg: |
        «شكرًا» ليها شكلين:
        - Matur nuwun = Terima kasih، المؤدبة (krama). قولها لأي حد أكبر منك أو مش عارفه.
        - Suwun = المختصرة، للصحاب (زي «ميرسي»). «Suwun, rek!» = شكرًا يا جماعة!
        والرد «العفو»: Padha-padha (ngoko) = Sama-sama، وبالـ krama: Sami-sami. في الشات بتتكتب podo-podo.
        وفي الوداع: «Ati-ati, ya!» = خلي بالك من نفسك / توصل بالسلامة (Hati-hati, ya!).
      ar: |
        للشكر صيغتان:
        - Matur nuwun = Terima kasih، وهي المهذبة (krama)، تقال للأكبر سنًّا وللغريب.
        - Suwun = المختصرة للأصدقاء: «Suwun, rek!» = شكرًا يا جماعة!
        والجواب «عفوًا»: Padha-padha (ngoko) = Sama-sama، وبالـ krama: Sami-sami، وتُكتب في الدردشة podo-podo.
        وعند الوداع: «Ati-ati, ya!» = انتبه لنفسك / في أمان الله (Hati-hati, ya!).
      en: |
        "Thank you" has two shapes:
        - Matur nuwun = Terima kasih, the polite one (krama). Use it with anyone older or anyone you don't know.
        - Suwun = the short one for friends (like "thanks"). "Suwun, rek!" = Thanks, guys!
        "You're welcome": Padha-padha (ngoko) = Sama-sama; krama: Sami-sami. Chats type it podo-podo.
        Saying goodbye: "Ati-ati, ya!" = Take care / safe trip (Hati-hati, ya!).
    examples:
      - text: Matur nuwun, Bu. — Sami-sami.
        ar_eg: شكرًا يا مدام. — العفو. (krama)
        ar: شكرًا يا سيدتي. — عفوًا. (krama)
        en: Thank you, ma'am. — You're welcome. (krama)
      - text: Suwun! — Padha-padha.
        ar_eg: ميرسي! — العفو. (ngoko)
        ar: شكرًا! — عفوًا. (ngoko)
        en: Thanks! — You're welcome. (ngoko)
      - text: Ati-ati, ya!
        ar_eg: خلي بالك من نفسك!
        ar: انتبه لنفسك!
        en: Take care!
