schema: kabar.lesson/v1
id: j1.u01.l01
language: jv
title: Sugeng enjing
can_do:
  ar_eg: تسلّم بأدب في أي وقت في اليوم.
  ar: أن تحيّي بأدب في أي وقت من اليوم.
  en: Greet politely at any time of day.
slides:
  - title: Sugeng enjing = Selamat pagi
    body:
      ar_eg: |
        أهلًا بيك في يوجيا (Jogja)، أول محطة في خط الجاوي! وإنت عارف الإندونيسي، فنص الشغل خلصان.
        في الجاوي، selamat الإندونيسية بتبقى sugeng في التحيات المؤدبة:
        - Selamat pagi → Sugeng enjing (صباح الخير)
        - Selamat siang → Sugeng siang (نهارك سعيد)
        - Selamat sore → Sugeng sonten (مساء الخير، العصر)
        - Selamat malam → Sugeng dalu (مساء الخير / تصبح على خير)
        دي تحيات **krama** (الجاوي المؤدب، ≈ «حضرتك»)، فبتنفع مع أي حد: الكبير، البيّاع، أم صاحبك. زي «صباح الخير يا فندم».
      ar: |
        مرحبًا بك في يوجياكرتا (Jogja)، أولى محطات خط الجاوية! وأنت تعرف الإندونيسية، فنصف الطريق مقطوع.
        تصير selamat الإندونيسية في التحيات المهذبة sugeng:
        - Selamat pagi → Sugeng enjing (صباح الخير)
        - Selamat siang → Sugeng siang (طاب نهارك)
        - Selamat sore → Sugeng sonten (مساء الخير، وقت العصر)
        - Selamat malam → Sugeng dalu (مساء الخير / تصبح على خير)
        وهي تحيات من مستوى **krama** (المستوى المهذب، ≈ «حضرتك»)، فتصلح مع الجميع: الكبير والبائع ووالدة صديقك.
      en: |
        Welcome to Yogyakarta (Jogja), the first stop on the Javanese line! You already know Indonesian, so half the work is done.
        In polite greetings, Indonesian selamat becomes sugeng:
        - Selamat pagi → Sugeng enjing (good morning)
        - Selamat siang → Sugeng siang (good day)
        - Selamat sore → Sugeng sonten (good afternoon)
        - Selamat malam → Sugeng dalu (good evening / good night)
        These are **krama** greetings (polite Javanese, ≈ «حضرتك»), so they're safe with anyone: an older person, a seller, your friend's mother.
    examples:
      - text: Sugeng enjing, Bu!
        ar_eg: صباح الخير يا مدام! (krama)
        ar: صباح الخير يا سيدتي! (krama)
        en: Good morning, ma'am! (krama)
      - text: Sugeng dalu, Pak.
        ar_eg: مساء الخير / تصبح على خير يا حاج. (krama)
        ar: مساء الخير / تصبح على خير يا سيدي. (krama)
        en: Good evening / good night, sir. (krama)
  - title: Esuk, awan, sore, bengi
    body:
      ar_eg: |
        الجاوي بيبدّل كلمات كاملة حسب إنت بتكلم مين، مش الضمير بس. حتى أوقات اليوم ليها كلمتين: ngoko بين الصحاب (زي «إنت»)، وkrama للمؤدب (زي «حضرتك»).
        عشان كده التحية المؤدبة sugeng enjing فيها enjing مش esuk.
        وبين الصحاب في يوجيا الناس غالبًا مابتقولش sugeng خالص: بيسألوا «Piye kabare?» أو «Piye, cah?» على طول، أو بيقولوا «Pagi!» بالإندونيسي.
      ar: |
        تبدّل الجاوية ألفاظًا كاملة بحسب المخاطَب، لا الضمير وحده، حتى أوقات اليوم لها لفظان: ngoko بين الأقران (كـ«أنت»)، وkrama للتأدب (كـ«حضرتك»).
        ولذلك تأتي التحية المهذبة sugeng enjing بلفظ enjing لا esuk.
        أما بين الأصدقاء في يوجيا فقلّما يقال sugeng، بل يُسأل مباشرة «Piye kabare?» أو «Piye, cah?» أو يقال «Pagi!» بالإندونيسية.
      en: |
        Javanese swaps whole words depending on who you're talking to, not just pronouns. Even the times of day come in pairs: ngoko between friends (like «إنت»), krama when being polite (like «حضرتك»).
        That's why the polite greeting is sugeng enjing, not "sugeng esuk".
        Between friends in Jogja people rarely say sugeng at all: they jump straight to "Piye kabare?" or "Piye, cah?", or say Indonesian "Pagi!".
    table:
      head: [Indonesia, ngoko, krama]
      rows:
        - cells: [pagi, esuk, enjing]
          ar_eg: الصبح
          ar: الصباح
          en: morning
        - cells: [siang, awan, siang]
          ar_eg: الضهر
          ar: الظهيرة
          en: midday
        - cells: [sore, sore, sonten]
          ar_eg: العصر / بعد الضهر
          ar: العصر
          en: afternoon
        - cells: [malam, bengi, dalu]
          ar_eg: بالليل
          ar: الليل
          en: night
    examples:
      - text: esuk / enjing
        ar_eg: الصبح (ngoko / krama)
        ar: الصباح (ngoko / krama)
        en: morning (ngoko / krama)
      - text: bengi / dalu
        ar_eg: بالليل (ngoko / krama)
        ar: الليل (ngoko / krama)
        en: night (ngoko / krama)
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Sugeng enjing
        ar_eg: صباح الخير
        ar: صباح الخير
        en: Good morning
      - text: Sugeng siang
        ar_eg: نهارك سعيد (الضهر)
        ar: طاب نهارك (الظهيرة)
        en: Good day (midday)
      - text: Sugeng sonten
        ar_eg: مساء الخير (العصر)
        ar: مساء الخير (العصر)
        en: Good afternoon
      - text: Sugeng dalu
        ar_eg: مساء الخير بالليل / تصبح على خير
        ar: مساء الخير ليلًا / تصبح على خير
        en: Good evening / good night
    words: [sugeng enjing, sugeng siang, sugeng sonten, sugeng dalu]
  - id: e02
    type: match_pairs
    pairs:
      - text: esuk
        ar_eg: الصبح (ngoko)
        ar: الصباح (ngoko)
        en: morning (ngoko)
      - text: awan
        ar_eg: الضهر (ngoko)
        ar: الظهيرة (ngoko)
        en: midday (ngoko)
      - text: bengi
        ar_eg: بالليل (ngoko)
        ar: الليل (ngoko)
        en: night (ngoko)
      - text: enjing
        ar_eg: الصبح (krama)
        ar: الصباح (krama)
        en: morning (krama)
    words: [esuk, awan, bengi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الساعة ٨ الصبح، وقابلت مامة Mas Heru. تقولها إيه؟
      ar: الساعة الثامنة صباحًا، وقابلتَ والدة Mas Heru. ماذا تقول لها؟
      en: It's 8 a.m. and you meet Mas Heru's mother. What do you say?
    options: ['Sugeng enjing, Bu!', 'Sugeng dalu, Bu!', 'Sugeng sonten, Bu!']
    answer: 0
    explain:
      ar_eg: ٨ الصبح يعني enjing (= pagi). وsugeng مؤدبة، مناسبة لحد أكبر منك.
      ar: الثامنة صباحًا وقت enjing (= pagi)، وsugeng مهذبة تناسب الأكبر سنًّا.
      en: 8 a.m. is enjing (= pagi), and sugeng is polite — right for an older person.
    words: [sugeng enjing]
  - id: e04
    type: fill_blank
    sentence: Sugeng ___, Pakdhe!
    meaning:
      ar_eg: (الساعة ٩ بالليل) مساء الخير يا عمو!
      ar: (الساعة التاسعة ليلًا) مساء الخير يا عمّ!
      en: (9 p.m.) Good evening, uncle!
    options: [enjing, sonten, dalu, siang]
    answers: [dalu]
    explain:
      ar_eg: بالليل = malam = dalu في الـ krama. (bengi هي كلمة الـ ngoko، ومابتيجيش بعد sugeng.)
      ar: الليل = malam = dalu في الـ krama، أما bengi فلفظ ngoko لا يأتي بعد sugeng.
      en: Night = malam = dalu in krama. (bengi is the ngoko word and doesn't go with sugeng.)
    words: [sugeng dalu]
  - id: e05
    type: dictation
    text: Sugeng enjing
    meaning:
      ar_eg: صباح الخير
      ar: صباح الخير
      en: Good morning
    words: [sugeng enjing]
  - id: e06
    type: speaking
    text: Sugeng sonten, Bu!
    meaning:
      ar_eg: مساء الخير يا مدام!
      ar: مساء الخير يا سيدتي!
      en: Good afternoon, ma'am!
    words: [sugeng sonten]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة ngoko معناها «الصبح»؟
      ar: أيّ كلمة ngoko تعني «الصباح»؟
      en: Which ngoko word means "morning"?
    options: [esuk, awan, bengi]
    answer: 0
    explain:
      ar_eg: esuk = الصبح، awan = الضهر، bengi = بالليل.
      ar: esuk = الصباح، وawan = الظهر، وbengi = الليل.
      en: esuk = morning, awan = midday, bengi = night.
    words: [esuk, awan, bengi]
  - id: e08
    type: listen
    text: Sugeng siang, Mas!
    options: ['Sugeng siang, Mas!', 'Sugeng sonten, Mas!', 'Sugeng enjing, Mas!']
    answer: 0
    meaning:
      ar_eg: نهارك سعيد يا كابتن!
      ar: نهارك سعيد يا أخي!
      en: Good day, Mas!
    words: [sugeng siang, sugeng sonten, sugeng enjing]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: الساعة ١٢ الضهر وقابلت جار كبير في السن. تقوله إيه؟
      ar: الساعة الثانية عشرة ظهرًا وقابلت جارًا كبيرًا. ماذا تقول له؟
      en: It's 12 noon and you meet an older neighbour. What do you say?
    options: ['Sugeng siang, Pak!', 'Sugeng dalu, Pak!', 'Sugeng enjing, Pak!']
    answer: 0
    words: [sugeng siang]
  - id: e10
    type: listen
    text: Esuk, awan, bengi.
    options: ['Esuk, awan, bengi.', 'Awan, esuk, bengi.', 'Bengi, awan, esuk.']
    answer: 0
    meaning:
      ar_eg: الصبح، الضهر، بالليل.
      ar: الصباح، الظهر، الليل.
      en: Morning, midday, night.
    words: [esuk, awan, bengi]
dialogue:
  lines:
    - speaker: Mohamed
      text: Sugeng enjing, Bu Yani!
      ar_eg: صباح الخير يا مدام ياني!
      ar: صباح الخير يا سيدة ياني!
      en: Good morning, Bu Yani!
    - speaker: Bu Yani
      text: Sugeng enjing, Mas Mohamed.
      ar_eg: صباح النور يا محمد.
      ar: صباح النور يا محمد.
      en: Good morning, Mohamed.
    - speaker: Pakdhe Darmo
      text: Sugeng enjing!
      ar_eg: صباح الخير!
      ar: صباح الخير!
      en: Good morning!
    - speaker: Mohamed
      text: Sugeng enjing, Pak.
      ar_eg: صباح الخير يا عمو.
      ar: صباح الخير يا عمّ.
      en: Good morning, sir.
new_words:
  - word: sugeng enjing
    pos: phrase
    ar_eg: صباح الخير (krama، مؤدبة)
    ar: صباح الخير (krama، مهذبة)
    en: good morning (krama, polite)
  - word: sugeng siang
    pos: phrase
    ar_eg: نهارك سعيد (krama)
    ar: طاب نهارك (krama)
    en: good day, around midday (krama)
  - word: sugeng sonten
    pos: phrase
    ar_eg: مساء الخير، العصر (krama)
    ar: مساء الخير، وقت العصر (krama)
    en: good afternoon (krama)
  - word: sugeng dalu
    pos: phrase
    ar_eg: مساء الخير بالليل / تصبح على خير (krama)
    ar: مساء الخير ليلًا / تصبح على خير (krama)
    en: good evening / good night (krama)
  - word: esuk
    pos: noun
    ar_eg: الصبح (ngoko؛ krama enjing)
    ar: الصباح (ngoko؛ وبالـ krama enjing)
    en: morning (ngoko; krama enjing)
  - word: awan
    pos: noun
    ar_eg: الضهر (ngoko؛ krama siang) (≠ إندونيسي awan = سحابة)
    ar: الظهيرة (ngoko؛ وبالـ krama siang) (≠ الإندونيسية awan = سحابة)
    en: midday, daytime (ngoko; krama siang) (≠ Indonesian awan "cloud")
    false_friend: awan
  - word: bengi
    pos: noun
    ar_eg: بالليل (ngoko؛ krama dalu)
    ar: الليل (ngoko؛ وبالـ krama dalu)
    en: night (ngoko; krama dalu)
