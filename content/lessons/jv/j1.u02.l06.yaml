schema: kabar.lesson/v1
id: j1.u02.l06
language: jv
title: Kanggo sapa?
can_do:
  ar_eg: تقول القهوة دي لمين، ومع مين إنت، وفين، وتسأل «فين؟» زي الشات.
  ar: أن تقول لمن هذه القهوة، ومع من أنت وأين، وتسأل «أين؟» كما في الدردشة.
  en: Say who something is for, who you're with and where, and ask "where?" the chat way.
slides:
  - title: Neng, karo, kuwi
    body:
      ar_eg: |
        - **neng** = لـ / في (ke / di): Aku neng omah = أنا في البيت. وفي الشات بتتكتب ng.
        - **karo** = مع (sama / dengan): neng omah karo kanca = في البيت مع صاحبي.
        - **kuwi** = ده / داك (itu)، وiki = ده اللي جنبك. في الكتابة والكلام الرسمي **iku**.
        - **ndi** = فين / أنهي، مختصر endi في الكلام والشات: Kopiku ndi? = فين قهوتي؟
      ar: |
        - **neng** = إلى / في (ke / di): Aku neng omah = أنا في البيت. وتُكتب في الدردشة ng.
        - **karo** = مع (sama / dengan): neng omah karo kanca = في البيت مع صديقي.
        - **kuwi** = ذاك (itu)، وiki للقريب. وفي الكتابة والمقام الرسمي **iku**.
        - **ndi** = أين / أيّ، مختصر endi في الكلام والدردشة: Kopiku ndi? = أين قهوتي؟
      en: |
        - **neng** = to, at (ke / di): Aku neng omah = I'm at home. Chats write ng.
        - **karo** = with (sama / dengan): neng omah karo kanca = at home with a friend.
        - **kuwi** = that (itu); iki is the one near you. In writing and formal speech: **iku**.
        - **ndi** = where / which, short for endi in speech and chat: Kopiku ndi? = Where's my coffee?
    examples:
      - text: Aku neng omah karo kanca.
        ar_eg: أنا في البيت مع صاحبي.
        ar: أنا في البيت مع صديقي.
        en: I'm at home with a friend.
  - title: Kanggo, gawe, nganggo
    body:
      ar_eg: |
        - **kanggo** = لـ / عشان (untuk): Iki kanggo kowe = ده عشانك.
        - **gawe** = يعمل / يحضّر (buat): gawe kopi = يعمل قهوة.
        - **nganggo** = بـ / بيستعمل / لابس (pakai): nganggo basa Jawa = بالجاوي.
        - **liya** = تاني / غير (lain): wong liya = حد غريب، ناس تانية.
      ar: |
        - **kanggo** = لِـ / من أجل (untuk): Iki kanggo kowe = هذا لك.
        - **gawe** = يصنع / يُعِدّ (buat): gawe kopi = يُعِدّ القهوة.
        - **nganggo** = بـ / يستعمل / يلبس (pakai): nganggo basa Jawa = بالجاوية.
        - **liya** = آخر / غير (lain): wong liya = شخص غريب، الآخرون.
      en: |
        - **kanggo** = for (untuk): Iki kanggo kowe = This is for you.
        - **gawe** = make (buat): gawe kopi = make coffee.
        - **nganggo** = with, using, wearing (pakai): nganggo basa Jawa = in Javanese.
        - **liya** = other (lain): wong liya = someone else, other people.
    examples:
      - text: Kopi iki kanggo sapa?
        ar_eg: القهوة دي لمين؟
        ar: لمن هذه القهوة؟
        en: Who's this coffee for?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: neng
        ar_eg: لـ / في
        ar: إلى / في
        en: to, at
      - text: karo
        ar_eg: مع
        ar: مع
        en: with
      - text: kuwi / iku
        ar_eg: ده / داك
        ar: ذاك
        en: that
      - text: kanggo
        ar_eg: عشان / لـ
        ar: لِـ
        en: for
    words: [neng, karo, kuwi / iku, kanggo]
  - id: e02
    type: match_pairs
    pairs:
      - text: gawe
        ar_eg: يعمل
        ar: يصنع
        en: make
      - text: nganggo
        ar_eg: بـ / بيستعمل
        ar: يستعمل
        en: using, with
      - text: liya
        ar_eg: تاني / غير
        ar: آخر
        en: other
      - text: ndi
        ar_eg: فين؟
        ar: أين؟
        en: where?
    words: [gawe, nganggo, liya, ndi]
  - id: e03
    type: listen
    text: Aku neng omah karo kanca.
    question:
      ar_eg: هو فين ومع مين؟
      ar: أين هو ومع من؟
      en: Where is he, and with whom?
    options: [في البيت مع صاحبه, في القهوة لوحده, في البيت لوحده]
    answer: 0
    meaning:
      ar_eg: أنا في البيت مع صاحبي.
      ar: أنا في البيت مع صديقي.
      en: I'm at home with a friend.
    words: [neng, karo]
  - id: e04
    type: fill_blank
    sentence: Kopi iki ___ kowe, Mas.
    meaning:
      ar_eg: القهوة دي ___ ـك يا ماس.
      ar: هذه القهوة ___ ـك يا أخي.
      en: This coffee is ___ you, Mas.
    options: [kanggo, karo, ndi]
    answers: [kanggo]
    words: [kanggo, karo, ndi]
  - id: e05
    type: fill_blank
    sentence: Kowe ___ kopi, Mas?
    meaning:
      ar_eg: إنت بـ ___ قهوة يا ماس؟
      ar: هل ___ القهوة يا أخي؟
      en: Are you ___ coffee, Mas?
    options: [gawe, nganggo, liya]
    answers: [gawe]
    words: [gawe, nganggo, liya]
  - id: e06
    type: multiple_choice
    question: Wong kuwi sapa?
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [الراجل ده مين؟, الراجل ده منين؟, الراجل ده فين؟]
    answer: 0
    explain:
      ar_eg: kuwi = itu (ده / داك)، وsapa = مين.
      ar: kuwi = itu (ذاك)، وsapa = من.
      en: kuwi = itu (that), sapa = who.
    words: [kuwi / iku]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «حد غريب، ناس تانية» بالجاوي؟
      ar: كيف تقول «شخص آخر، الآخرون» بالجاوية؟
      en: '"Someone else, other people" in Javanese?'
    options: [wong liya, wong iki, wong kuwi]
    answer: 0
    explain:
      ar_eg: liya = lain (تاني / غير). wong iki = الشخص ده، وwong kuwi = الشخص داك.
      ar: liya = lain (آخر). أما wong iki فهذا الشخص، وwong kuwi ذاك الشخص.
      en: liya = lain (other). wong iki = this person, wong kuwi = that person.
    words: [liya, iki, kuwi / iku]
  - id: e08
    type: build_sentence
    source:
      ar_eg: بكلم صحابي بالجاوي.
      ar: أتكلم الجاوية مع أصدقائي.
      en: I use Javanese with my friends.
    answer: Aku nganggo basa Jawa karo kanca.
    distractors: [kanggo, neng]
    words: [nganggo, karo]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kowe gawe apa? Kanggo sapa?
    answers_meaning:
      ar_eg: [بتعمل إيه؟ عشان مين؟, إنت بتعمل إيه؟ لمين؟]
      ar: [ماذا تصنع؟ ولمن؟, ماذا تُعِدّ؟ ومن أجل من؟]
      en: ['What are you making? Who for?', 'What are you making, and for whom?']
    words: [gawe, kanggo]
  - id: e10
    type: speaking
    text: Ndi wong liya? Ayo neng omah.
    meaning:
      ar_eg: فين الباقيين؟ يلا على البيت.
      ar: أين الآخرون؟ هيّا إلى البيت.
      en: Where are the others? Let's go home.
    words: [ndi, liya, neng]
dialogue:
  lines:
    - speaker: Mas Heru
      text: Mas, kopi iki kanggo sapa?
      ar_eg: يا ماس، القهوة دي لمين؟
      ar: يا أخي، لمن هذه القهوة؟
      en: Mas, who's this coffee for?
    - speaker: Mohamed
      text: Kanggo kancaku, Mas. Dheweke isih neng Stasiun Tugu.
      ar_eg: لصاحبي يا ماس. لسه في محطة توجو.
      ar: لصديقي يا أخي. ما زال في محطة توغو.
      en: For my friend, Mas. He's still at Tugu station.
    - speaker: Mas Heru
      text: Kancamu wong ngendi?
      ar_eg: صاحبك منين؟
      ar: من أين صديقك؟
      en: Where's your friend from?
    - speaker: Mohamed
      text: Wong Kairo. Dheweke sinau basa Jawa karo aku.
      ar_eg: من القاهرة. بيتعلم جاوي معايا.
      ar: من القاهرة. يتعلم الجاوية معي.
      en: From Cairo. He's learning Javanese with me.
    - speaker: Mas Heru
      text: Apik! Tak gawekke siji maneh, ya?
      ar_eg: حلو! أعملك واحدة كمان؟
      ar: رائع! أُعِدّ لك واحدة أخرى؟
      en: Nice! Shall I make one more?
    - speaker: Mohamed
      text: Nggih, Mas. Sing kuwi kanggo aku, hehe.
      ar_eg: أيوه يا ماس. اللي هناك دي ليا، هههه.
      ar: نعم يا أخي. تلك لي، هه.
      en: Yes, Mas. That one's for me, hehe.
new_words:
  - word: neng
    pos: preposition
    ar_eg: لـ / في (= ke / di)؛ في الشات ng
    ar: إلى / في (= ke / di)؛ وفي الدردشة ng
    en: to, at (= ke / di); chat ng
  - word: karo
    pos: preposition
    ar_eg: مع (= dengan / sama)
    ar: مع (= dengan / sama)
    en: with (= dengan / sama)
  - word: kuwi / iku
    pos: pronoun
    ar_eg: ده / داك (= itu)؛ iku في الكتابة والكلام الرسمي
    ar: ذاك (= itu)؛ وiku في الكتابة والمقام الرسمي
    en: that (= itu); iku in writing and formal speech
  - word: kanggo
    pos: preposition
    ar_eg: لـ، عشان (= untuk)
    ar: لِـ، من أجل (= untuk)
    en: for (= untuk)
  - word: gawe
    pos: verb
    ar_eg: يعمل / يحضّر (= buat)
    ar: يصنع / يُعِدّ (= buat)
    en: to make (= buat)
  - word: nganggo
    pos: preposition
    ar_eg: بـ / بيستعمل / لابس (= pakai)
    ar: بـ / يستعمل / يلبس (= pakai)
    en: with, using, wearing (= pakai)
  - word: liya
    pos: adjective
    ar_eg: تاني / غير (= lain)
    ar: آخر / غير (= lain)
    en: other (= lain)
  - word: ndi
    pos: pronoun
    ar_eg: فين / أنهي؟ (مختصر endi)
    ar: أين / أيّ؟ (مختصر endi)
    en: where, which? (short for endi)
