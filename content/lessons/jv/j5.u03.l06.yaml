        ar: حوار
        en: dialogue
    words: [nyathet, pocapan, wanda, pacelathon]
  - id: e02
    type: match_pairs
    pairs:
      - text: mbenerake
        ar_eg: يصحّح
        ar: يصحّح
        en: correct
