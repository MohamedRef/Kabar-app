schema: kabar.lesson/v1
id: j5.u03.l06
language: jv
title: Minimal Pairs
can_do:
  ar_eg: تعدّي جولة سماع.
  ar: أن تجتاز جولة استماع.
  en: Pass a listening round.
slides:
  - title: Rungokna!
    body:
      ar_eg: |
        جولة سماع قبل اللعبة. افتكر: d وt زي د وت بتوعنا، وdh وth اللسان راجع لورا.
        وكلمة من العربي: hawa = الجو (هواء)، hawane adhem = الجو ساقع. adhem بـ dh، والإندونيسي بيكتبها adem.
      ar: |
        جولة استماع قبل اللعبة. تذكّر: d وt كالدال والتاء، وفي dh وth يرتدّ اللسان إلى الخلف.
        وكلمة عربية الأصل: hawa = الجو (هواء)، وhawane adhem = الجو بارد. adhem بـ dh، وتكتبها الإندونيسية adem.
      en: |
        A listening round before the game. Remember: d and t are Arabic د and ت; for dh and th the tongue pulls back.
        And a word from Arabic: hawa = weather, air («هواء»); hawane adhem = the weather is cold. adhem has dh; Indonesian writes adem.
    grammar: jv.orthography
    examples:
      - text: Hawane adhem banget.
        ar_eg: الجو ساقع أوي.
        ar: الجو بارد جدًا.
        en: The weather is really cold.
      - text: Wedi lan wedhi iku bedha.
        ar_eg: wedi وwedhi مختلفين.
        ar: wedi وwedhi مختلفتان.
        en: Wedi and wedhi are different.
      - text: Sesuk aku mesthi teka.
        ar_eg: بكرة أكيد هاجي.
        ar: سآتي غدًا بالتأكيد.
        en: I'll definitely come tomorrow.
exercises:
  - id: e01
    type: listen
    text: Hawane adhem banget.
    options: ['Hawane adem banget.', 'Hawane adhem banget.']
    answer: 1
    meaning:
      ar_eg: الجو ساقع أوي.
      ar: الجو بارد جدًا.
      en: The weather is really cold.
    words: [hawa, adhem]
  - id: e02
    type: listen
    text: Wedi lan wedhi iku bedha.
    options: ['Wedi lan wedhi iku bedha.', 'Wedi lan wedi iku beda.']
    answer: 0
    meaning:
      ar_eg: wedi وwedhi مختلفين.
      ar: wedi وwedhi مختلفتان.
      en: Wedi and wedhi are different.
    words: [bedha]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي بتتكتب «مختلف» بالجاوي؟
      ar: كيف تُكتب «مختلف» بالجاوية؟
      en: How is "different" spelled in Javanese?
    options: [beda, bedha]
    answer: 1
    explain:
      ar_eg: beda إندونيسي. الجاوي bedha بـ dh.
      ar: beda إندونيسية، والجاوية bedha بـ dh.
      en: beda is Indonesian; Javanese bedha has dh.
    words: [bedha]
  - id: e04
    type: fill_blank
    sentence: Sesuk aku ___ teka.
    meaning:
      ar_eg: بكرة أكيد هاجي.
      ar: سآتي غدًا بالتأكيد.
      en: I'll definitely come tomorrow.
    options: [mesti, mesthi]
    answers: [mesthi]
    explain:
      ar_eg: الإملا الجاوي mesthi بـ th. الشات ساعات بيكتب mesti.
      ar: الإملاء الجاوي mesthi بـ th، وقد تكتبها الدردشة mesti.
      en: Javanese spelling is mesthi, with th; chats sometimes write mesti.
    words: [mesthi]
  - id: e05
    type: fill_blank
    sentence: Hawane ___ banget.
    meaning:
      ar_eg: الجو ساقع أوي.
      ar: الجو بارد جدًا.
      en: The weather is really cold.
    answers: [adhem]
    words: [adhem, hawa]
  - id: e06
    type: dictation
    text: Sesuk aku mesthi teka.
    meaning:
      ar_eg: بكرة أكيد هاجي.
      ar: سآتي غدًا بالتأكيد.
      en: I'll definitely come tomorrow.
    words: [mesthi]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بالجاوي) الجو في ماديون مش ساقع.
      ar: (بالجاوية) الجو في ماديون ليس باردًا.
      en: (in Javanese) The weather in Madiun isn't cold.
    answers:
      - Hawane ing Madiun ora adhem.
      - Hawa ing Madiun ora adhem.
      - Hawane neng Madiun ora adhem.
      - Ing Madiun hawane ora adhem.
      - Neng Madiun hawane ora adhem.
      - Hawane Madiun ora adhem.
    words: [hawa, adhem]
  - id: e08
    type: build_sentence
    source:
      ar_eg: wedi وwedhi مختلفين.
      ar: wedi وwedhi مختلفتان.
      en: Wedi and wedhi are different.
    answer: Wedi lan wedhi iku bedha.
    distractors: [beda, wedhine]
    words: [bedha, wedhi]
  - id: e09
    type: speaking
    text: Hawane adhem, nanging aku mesthi teka.
    meaning:
      ar_eg: الجو ساقع، بس أكيد هاجي.
      ar: الجو بارد، لكني سآتي بالتأكيد.
      en: It's cold, but I'll definitely come.
    words: [hawa, adhem, mesthi]
dialogue:
  title: Dolanan Minimal Pairs
  lines:
    - speaker: Mbak Ayu
      text: Ayo dolanan Minimal Pairs! Rungokna, wedhi.
      ar_eg: يلا نلعب Minimal Pairs! اسمع، wedhi.
      ar: هيا نلعب Minimal Pairs! استمع، wedhi.
      en: Let's play Minimal Pairs! Listen, wedhi.
    - speaker: Mohamed
      text: Wedhi, pasir!
      ar_eg: wedhi، يعني رملة!
      ar: wedhi، أي رمل!
      en: Wedhi, sand!
    - speaker: Mbak Ayu
      text: Bener. Saiki, adhem.
      ar_eg: صح. دلوقتي، adhem.
      ar: صحيح. والآن، adhem.
      en: Right. Now, adhem.
    - speaker: Mohamed
      text: Adhem, karo dh. Hawane adhem!
      ar_eg: adhem، بـ dh. الجو ساقع!
      ar: adhem، بـ dh. الجو بارد!
      en: Adhem, with dh. The weather's cold!
    - speaker: Mbak Ayu
      text: Pinter! Kowe mesthi menang, lho.
      ar_eg: شاطر! إنت أكيد هتكسب.
      ar: أحسنت! ستفوز بالتأكيد.
      en: Clever! You'll definitely win.
new_words:
  - word: hawa
    pos: noun
    ar_eg: الجو (من «هواء»)
    ar: الجو (من «هواء»)
    en: weather, air = hawa, udara
    arabic: هواء
  - word: adhem
    pos: adjective
    ar_eg: ساقع / بارد
    ar: بارد
    en: cold, cool = dingin, adem
  - word: bedha
    pos: adjective
    ar_eg: مختلف
    ar: مختلف
    en: different = beda
  - word: mesthi
    pos: adverb
    ar_eg: أكيد / لازم
    ar: بالتأكيد / لا بدّ
    en: surely, definitely = pasti
game: mp.adem-adhem
review:
  status: draft
  verified: false
