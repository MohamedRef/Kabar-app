  - id: e03
    type: listen
    text: 'Pocapane ''sego'', wandane loro: se lan go.'
    question:
      ar_eg: الكلمة بتتنطق إزاي؟
      ar: كيف تُنطق الكلمة؟
      en: How is the word pronounced?
    options: [النطق sego وفيها مقطعين, النطق sega وفيها تلات مقاطع, الكلمة مش بتتنطق]
    answer: 0
    meaning:
      ar_eg: 'النطق sego، وفيها مقطعين: se وgo.'
      ar: 'النطق sego، وفيها مقطعان: se وgo.'
      en: 'It''s pronounced ''sego'', with two syllables: se and go.'
    words: [pocapan, wanda]
  - id: e04
    type: fill_blank
    sentence: Aku ___ tembung-tembung anyar ing buku.
    meaning:
      ar_eg: أنا ___ الكلمات الجديدة في الكشكول.
      ar: أنا ___ الكلمات الجديدة في الدفتر.
      en: I ___ the new words in my notebook.
    options: [nyathet, mbenerake, luput]
    answers: [nyathet]
    words: [nyathet, mbenerake, luput]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «مقطع صوتي» زي se في sega؟
      ar: أي كلمة تعني «مقطعًا صوتيًا» مثل se في sega؟
      en: Which word means 'syllable', like se in sega?
    options: [wanda, tandha, tuladha]
    answer: 0
    explain:
      ar_eg: wanda = مقطع. tandha = علامة، وtuladha = مثال.
      ar: wanda = مقطع صوتي؛ tandha = علامة، وtuladha = مثال.
      en: wanda = syllable; tandha = mark, tuladha = example.
    words: [wanda, tandha, tuladha]
  - id: e06
    type: fill_blank
    sentence: Gurune ___ tulisan sing luput.
    meaning:
      ar_eg: المدرّس ___ الكتابة اللي فيها غلط.
      ar: المعلّم ___ الكتابة الخاطئة.
      en: The teacher ___ the wrong spelling.
    options: [mbenerake, nyathet, pocapan]
    answers: [mbenerake]
    words: [mbenerake, nyathet, pocapan]
  - id: e07
    type: multiple_choice
    question: '''Pira'' iku ___ tembung sing ditulis a, diwaca o.'
    options: [tuladha, pacelathon, luput]
    answer: 0
    explain:
      ar_eg: 'pira بتتكتب a وتتقري o، فهي مثال: tuladha.'
      ar: 'تُكتب pira بالألف وتُقرأ o، فهي مثال: tuladha.'
      en: 'pira is written a and read o, so it''s an example: tuladha.'
    words: [tuladha, pacelathon, luput]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الحوار ده مش طويل.
      ar: هذا الحوار ليس طويلًا.
      en: This dialogue isn't long.
    answer: Pacelathon iki ora dawa.
    distractors: [wanda, tandha]
    words: [pacelathon]
  - id: e09
    type: translate
    direction: from_target
    source_text: Tulisanmu luput, aku menehi tandha abang.
    answers_meaning:
      ar_eg: [كتابتك فيها غلط، حطيتلك علامة حمرا, كتابتك غلط، فعلّمت عليها بالأحمر]
      ar: [كتابتك خاطئة، فوضعت علامة حمراء, في كتابتك خطأ، فوضعت عليه علامة حمراء]
      en: ['Your spelling is wrong, I put a red mark', 'Your writing is wrong, so I gave it a red mark']
    words: [luput, tandha]
  - id: e10
    type: speaking
    text: Aku nyathet pocapan lan tuladhane.
    meaning:
      ar_eg: أنا بدوّن النطق والأمثلة.
      ar: أدوّن النطق والأمثلة.
      en: I note down the pronunciation and the examples.
    words: [nyathet, pocapan, tuladha]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mbak, aku nulis 'sego' ing chat. Luput, ya?
      ar_eg: يا مبك، أنا كتبت sego في الشات. غلط؟
      ar: يا مبك، كتبتُ sego في المحادثة. هل هذا خطأ؟
      en: Mbak, I wrote 'sego' in the chat. Is that wrong?
    - speaker: Mbak Ayu
      text: Ora luput kok. Nanging tulisan bakune 'sega', pocapane wae sing 'sego'.
      ar_eg: مش غلط خالص. بس الكتابة الرسمية sega، النطق بس هو اللي sego.
      ar: ليس خطأ. لكن الكتابة المعيارية sega، والنطق وحده sego.
      en: It's not wrong. But the standard spelling is 'sega'; only the pronunciation is 'sego'.
    - speaker: Mohamed
      text: Oh. Sik, tak cathet dhisik.
      ar_eg: آه. استني، أكتبها الأول.
      ar: آه. لحظة، أدوّنها أولًا.
      en: Oh. Hang on, let me note that down.
    - speaker: Mbak Ayu
      text: 'Iki tuladha liyane: ''pira'', diwaca ''piro''.'
      ar_eg: 'ده مثال تاني: pira، بتتقري piro.'
      ar: 'هذا مثال آخر: pira، وتُقرأ piro.'
      en: 'Here''s another example: ''pira'', read ''piro''.'
    - speaker: Mohamed
      text: Wah, mbenerake tulisanku ki abot, ya Mbak.
      ar_eg: يا ساتر، تصليح كتابتي ده شغل تقيل يا مبك.
      ar: تصحيح كتابتي مهمة ثقيلة يا مبك.
      en: Wow, correcting my writing is hard work, Mbak.
    - speaker: Mbak Ayu
      text: Ora apa-apa, aku seneng. Tak wenehi tandha abang wae, ya.
      ar_eg: ولا يهمك، أنا مبسوطة. هحطلك علامة حمرا وخلاص.
      ar: لا بأس، يسعدني ذلك. سأضع علامة حمراء فقط.
      en: No problem, I enjoy it. I'll just give it a red mark.
