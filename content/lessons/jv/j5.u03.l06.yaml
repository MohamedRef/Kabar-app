schema: kabar.lesson/v1
id: j5.u03.l06
language: jv
title: Nyathet pocapan
can_do:
  ar_eg: 'تتكلم عن الكتابة والنطق: تقسم كلمة لمقاطع، وتدّي مثال، وتصلّح غلطة.'
  ar: 'أن تتحدث عن الكتابة والنطق: تقسيم الكلمة إلى مقاطع، وإعطاء مثال، وتصحيح خطأ.'
  en: 'Talk about spelling and sound: split a word into syllables, give an example and fix a mistake.'
slides:
  - title: Tulisan lan pocapan
    body:
      ar_eg: |
        pocapan = النطق، wanda = مقطع (sega فيها wanda اتنين: se-ga). tuladha = مثال.
        nyathet = يكتب نوت، يدوّن. tandha = علامة. mbenerake = يصحّح.
        luput = غلط، مش مظبوط. pacelathon = حوار، كلام بين اتنين.
      ar: |
        pocapan = النطق، wanda = مقطع صوتي (في sega مقطعان: se-ga). tuladha = مثال.
        nyathet = يدوّن. tandha = علامة. mbenerake = يصحّح.
        luput = خاطئ. pacelathon = حوار.
      en: |
        pocapan = pronunciation, wanda = syllable (sega has two: se-ga). tuladha = example.
        nyathet = note down. tandha = mark, sign. mbenerake = correct.
        luput = wrong, mistaken. pacelathon = dialogue, conversation.
    examples:
      - text: Tembung 'sega' ditulis a, nanging pocapane 'sego'.
        ar_eg: كلمة sega بتتكتب بـ a، بس نطقها sego.
        ar: تُكتب كلمة sega بالألف a، لكن نطقها sego.
        en: The word 'sega' is written with a, but pronounced 'sego'.
      - text: 'Tembung ''sega'' duwe wanda loro: se lan ga.'
        ar_eg: 'كلمة sega فيها مقطعين: se وga.'
        ar: 'في كلمة sega مقطعان: se وga.'
        en: 'The word ''sega'' has two syllables: se and ga.'
      - text: Mbak Ayu mbenerake tulisane Mohamed sing luput.
        ar_eg: مبك أيو صحّحت كتابة محمد اللي فيها غلط.
        ar: صحّحت مبك أيو كتابة محمد الخاطئة.
        en: Mbak Ayu corrects Mohamed's mistaken spelling.
