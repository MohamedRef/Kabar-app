        en: Wednesday
      - text: Kemis
        ar_eg: الخميس
        ar: الخميس
        en: Thursday
      - text: Jemuwah
        ar_eg: الجمعة
        ar: الجمعة
        en: Friday
      - text: Setu
        ar_eg: السبت
        ar: السبت
        en: Saturday
    words: [Senen, Rebo, Kemis, Jemuwah, Setu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي يوم جاوي جاي من «الأربعاء»؟
      ar: أيّ يوم جاوي أصله «الأربعاء»؟
      en: Which Javanese day comes from Arabic «الأربعاء»?
    options: [Rebo, Minggu, Selasa]
    answer: 0
    words: [Rebo]
  - id: e03
    type: fill_blank
    sentence: Wingi Rebo, dina iki ___.
    meaning:
      ar_eg: امبارح كان الأربع، والنهارده الخميس.
      ar: أمس كان الأربعاء، واليوم الخميس.
      en: Yesterday was Wednesday; today is Thursday.
    answers: [Kemis, kemis]
    words: [Kemis, wingi, dina iki]
  - id: e04
    type: build_sentence
    source:
      ar_eg: النهارده إيه؟
      ar: أيّ يوم اليوم؟
      en: What day is it today?
    answer: Dina iki dina apa?
    distractors: [jam, pira]
    words: [dina, iki, apa]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: النهارده الجمعة.
      ar: اليوم الجمعة.
      en: Today is Friday.
    answers: [Dina iki Jemuwah., Dina iki Jemuwah, Dina iki dina Jemuwah., Dina iki dina Jemuwah, Dina iki Jemuah., Dina iki Jemuah, Saiki Jemuwah., Saiki Jemuwah, Saiki dina Jemuwah., Saiki dina Jemuwah]
    words: [dina iki, Jemuwah]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بكرة السبت.
      ar: غدًا السبت.
      en: Tomorrow is Saturday.
    answers: ["Sesuk Setu.", Sesuk Setu, "Sesuk dina Setu.", Sesuk dina Setu]
    words: [sesuk, Setu]
  - id: e07
    type: listen
    text: Senen, Selasa, Rebo, Kemis.
    options: ['Senen, Selasa, Rebo, Kemis.', 'Selasa, Rebo, Kemis, Jemuwah.', 'Kemis, Jemuwah, Setu, Minggu.']
    answer: 0
    meaning:
      ar_eg: الاتنين، التلات، الأربع، الخميس.
      ar: الاثنين، الثلاثاء، الأربعاء، الخميس.
      en: Monday, Tuesday, Wednesday, Thursday.
    words: [Senen, Selasa, Rebo, Kemis, Jemuwah, Setu, Minggu / Ahad]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي يوم معناه «الحد»؟
      ar: أيّ يوم يعني «الأحد»؟
      en: Which day is Sunday?
    options: [Minggu, Selasa, Senen]
    answer: 0
    explain:
      ar_eg: Minggu (أو Ahad من العربي) = الحد. Senen = الاتنين، Selasa = التلات.
      ar: Minggu (أو Ahad من العربية) = الأحد، وSenen = الاثنين، وSelasa = الثلاثاء.
      en: Minggu (or Ahad, from Arabic) = Sunday; Senen = Monday, Selasa = Tuesday.
    words: [Minggu / Ahad, Selasa, Senen]
  - id: e09
    type: fill_blank
    sentence: Dina iki Senen, sesuk ___.
    meaning:
      ar_eg: النهارده الاتنين، وبكرة التلات.
      ar: اليوم الاثنين، وغدًا الثلاثاء.
      en: Today is Monday, tomorrow is Tuesday.
    answers: [Selasa, selasa]
    words: [dina, Senen, sesuk, Selasa]
  - id: e10
    type: speaking
    text: Minggu aku neng omah, Senen aku sinau.
    meaning:
      ar_eg: يوم الحد بكون في البيت، ويوم الاتنين بذاكر.
      ar: يوم الأحد أكون في البيت، ويوم الاثنين أدرس.
      en: On Sunday I'm at home, on Monday I study.
    words: [Minggu / Ahad, Senen, sinau]
dialogue:
  lines:
    - speaker: Mohamed
      text: Sari, dina iki dina apa?
      ar_eg: ساري، النهارده إيه؟
      ar: ساري، ما اليوم؟
      en: Sari, what day is it today?
    - speaker: Sari
      text: Dina iki Rebo.
      ar_eg: النهارده الأربع.
      ar: اليوم الأربعاء.
      en: Today is Wednesday.
    - speaker: Mohamed
      text: Dadi sesuk Kemis, to?
      ar_eg: يعني بكرة الخميس، صح؟
      ar: إذن غدًا الخميس، أليس كذلك؟
      en: So tomorrow is Thursday, right?
    - speaker: Sari
      text: Iya. Jemuwah aku neng pasar.
      ar_eg: آه. يوم الجمعة أنا رايحة السوق.
      ar: نعم. يوم الجمعة أذهب إلى السوق.
      en: Yes. On Friday I'm going to the market.
