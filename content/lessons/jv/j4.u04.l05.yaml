dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, wingi aku nuding Simbah nganggo driji.
      ar_eg: يا ماس، امبارح شاورت على تيتة بصباعي.
      ar: يا ماس، أشرتُ أمس إلى الجدّة بإصبعي.
      en: Mas, yesterday I pointed at Grandma with my finger.
    - speaker: Mas Dimas
      text: Waduh! Ra ilok, Mohamed. Nganggo jempol wae.
      ar_eg: يا خبر! عيب يا محمد. شاور بصباعك الكبير.
      ar: يا للهول! لا يليق يا محمد، أشر بالإبهام.
      en: Oh dear! That's not done, Mohamed. Use your thumb.
    - speaker: Mohamed
      text: Iya, Mas. Yen liwat ing ngarepe Simbah?
      ar_eg: حاضر يا ماس. ولو عدّيت قدام تيتة؟
      ar: حسنًا يا ماس. وإن مررتُ أمام الجدّة؟
      en: Right, Mas. And if I pass in front of Grandma?
    - speaker: Mas Dimas
      text: Mbungkuk sithik, terus matur «nuwun sewu».
      ar_eg: وطّي ضهرك شوية وقول «nuwun sewu».
      ar: انحنِ قليلًا وقل «nuwun sewu».
      en: Stoop a little, and say 'nuwun sewu'.
    - speaker: Mohamed
      text: Lan yen lungguh ing pendhapa?
      ar_eg: ولو قعدت في البندوبو؟
      ar: وإن جلستُ في البندوبو؟
      en: And if I sit in the pendhapa?
    - speaker: Mas Dimas
      text: Sila, kaya ing masjid.
      ar_eg: اقعد تربيعة، زي في الجامع.
      ar: اجلس متربّعًا كما في المسجد.
      en: Sit cross-legged, like at the mosque.
