schema: kabar.lesson/v1
id: j4.u04.l05
language: jv
title: Ora ilok nuding
can_do:
  ar_eg: 'تعرف إيه اللي عيب في الحركات: التشاور والمرور قدام الكبار والقعدة.'
  ar: 'أن تعرف ما يُعدّ عيبًا في الحركات: الإشارة والمرور أمام الكبار والجلوس.'
  en: 'Know which gestures are improper: pointing, passing in front of elders, and how to sit.'
slides:
  - title: Nuding nganggo jempol
    body:
      ar_eg: |
        - ora ilok = مايصحّش، عيب (حاجة الكبار بيقولوا إنها قلة أدب أو فال وحش): «Ora ilok nuding wong tuwa.»
        - saru = عيب وخادش، كلام أو لبس مش لايق.
        - nuding = يشاور على حد أو حاجة. الجاوي المؤدّب بيشاور بالـ jempol (الإبهام) وإيده مقفولة، مش بالسبّابة.
        - mbungkuk = يوطّي ضهره شوية لما يعدّي قدام الكبار. ndhingkluk = يوطّي راسه (أدب أو كسوف).
        - sila = قعدة التربيعة على الأرض، زي قعدتنا على الحصيرة.
        - ngasoraken dhiri = يتواضع ويخلّي نفسه أقل (asor = واطي).
        - في الشارع: ra = ora (لأ / مش).
      ar: |
        - ora ilok = لا يليق، عيب (ما يعدّه الكبار سوء أدب أو نذير شؤم): «Ora ilok nuding wong tuwa.»
        - saru = معيب خادش: كلام أو لباس غير لائق.
        - nuding = يشير إلى أحد أو شيء. والجاوي المؤدّب يشير بالإبهام jempol ويده مضمومة، لا بالسبّابة.
        - mbungkuk = ينحني بظهره قليلًا حين يمرّ أمام الكبار. ndhingkluk = يحني رأسه (أدبًا أو حياءً).
        - sila = جلسة التربّع على الأرض، كجلستنا على الحصير.
        - ngasoraken dhiri = يتواضع ويضع نفسه دون غيره (asor = منخفض).
        - في كلام الشارع: ra = ora (لا / ليس).
      en: |
        - ora ilok = improper, not done (what elders call bad manners or bad luck): "Ora ilok nuding wong tuwa."
        - saru = indecent, unseemly: words or clothes that aren't appropriate.
        - nuding = point at someone or something. Polite Javanese point with the jempol (thumb), hand closed, not the index finger.
        - mbungkuk = stoop a little when passing in front of elders. ndhingkluk = bow your head (out of respect or shyness).
        - sila = sit cross-legged on the floor, as we do on a mat.
        - ngasoraken dhiri = humble yourself, put yourself lower (asor = low).
        - On the street: ra = ora (no, not).
    examples:
      - text: Ora ilok nuding wong tuwa.
        ar_eg: عيب تشاور على الكبير.
        ar: لا يليق أن تشير إلى الكبير.
        en: It's improper to point at an elder.
      - text: Yen nuding, nganggo jempol.
        ar_eg: لو هتشاور، شاور بصباعك الكبير.
        ar: إن أشرتَ فبالإبهام.
        en: If you point, use your thumb.
      - text: Mohamed mbungkuk yen liwat ing ngarepe Simbah.
        ar_eg: محمد بيوطّي ضهره لما يعدّي قدام تيتة.
        ar: ينحني محمد حين يمرّ أمام الجدّة.
        en: Mohamed stoops when he passes in front of Grandma.
