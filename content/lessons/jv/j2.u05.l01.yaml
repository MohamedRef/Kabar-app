    type: fill_blank
    sentence: Tulung ___ gula, ya.
    meaning:
      ar_eg: والنبي هاتلي سكر.
      ar: من فضلك اشترِ لي سكرًا.
      en: Could you buy me some sugar?
    options: ["mangana", "enteni", "tukokna"]
    answers: [tukokna]
    words: [tukokna, tulung]
  - id: e08
    type: fill_blank
    sentence: Aja ___, ya!
    meaning:
      ar_eg: ماتنساش، ماشي!
      ar: لا تنسَ!
      en: Don't forget, OK!
    answers:
      - lali
    words: [aja, lali]
  - id: e09
    type: build_sentence
