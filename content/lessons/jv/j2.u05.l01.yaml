schema: kabar.lesson/v1
id: j2.u05.l01
language: jv
title: Mangana! Panganen!
can_do:
  ar_eg: تقول لصاحبك ياكل أو يقرا أو يصحى، وتقول «ما تعملش».
  ar: أن تطلب من صديقك أن يأكل أو يقرأ أو يستيقظ، وأن تنهاه.
  en: Tell a friend to eat, read or wake up, and say don't.
slides:
  - title: Mangana! — من غير مفعول
    body:
      ar_eg: |
        في الإندونيسي بتقول «Makan!» أو «Makanlah!». الجاوي عنده نهايات للأمر، وكل نهاية ليها شغل.
        الأولى: -a لما مفيش مفعول:
        - mangan → Mangana! = كُل!
        - adus → Adusa! = استحمى!
        وفي الكلام العادي جدًا الناس كتير بتقول الفعل لوحده: Ayo mangan! = يلا ناكل.
      ar: |
        تقول الإندونيسية «Makan!» أو «Makanlah!»، وللجاوية نهايات للأمر لكل منها وظيفة.
        الأولى: -a حين لا يوجد مفعول:
        - mangan → Mangana! = كُل!
        - adus → Adusa! = اغتسل!
        وفي الكلام العفوي جدًا يُكتفى بالفعل: Ayo mangan! = هيا نأكل.
      en: |
        Indonesian says "Makan!" or "Makanlah!". Javanese has command endings, each with its own job.
        First: -a when there's no object:
        - mangan → Mangana! = Eat!
        - adus → Adusa! = Have a bath!
        Very casual speech often just uses the verb: Ayo mangan! = Let's eat.
    grammar: jv.imperative.ngoko
    examples:
      - text: Mangana sik, ya.
        ar_eg: كُل الأول، ماشي؟
        ar: كُل أولًا، حسنًا؟
        en: Eat first, OK?
  - title: Panganen! Wacanen! — مع مفعول
    body:
      ar_eg: |
        لما يكون فيه مفعول (حاجة معينة)، -en بتدخل على الأصل (مش على فعل N-):
        - pangan → Panganen! = كُله! (الأكل ده)
        - waca → Wacanen! = اقراه!
        فاكر إن maca أصلها waca؟ هنا الأصل بيرجع تاني، زي مع di- وtak-.
      ar: |
        إذا وُجد مفعول محدد دخلت -en على الجذر لا على فعل N-:
        - pangan → Panganen! = كُلْه!
        - waca → Wacanen! = اقرأه!
        تذكّر أن أصل maca هو waca؛ يعود الجذر هنا كما يعود مع di- وtak-.
      en: |
        When there's an object (a specific thing), -en goes on the base, not on the N- verb:
        - pangan → Panganen! = Eat it!
        - waca → Wacanen! = Read it!
        Remember maca comes from waca? The base comes back here, just as with di- and tak-.
    grammar: jv.imperative.ngoko
    examples:
      - text: Wacanen bukune!
        ar_eg: اقرا الكتاب!
        ar: اقرأ الكتاب!
        en: Read the book!
  - title: Aja lali! — النهي
    body:
      ar_eg: |
        «ماتعملش» = aja + الفعل، زي jangan:
        - Aja lali! = ماتنساش! (lali = lupa)
        خلي بالك: النهي بـ aja، مش ora. ora = tidak.
        وبتتنطق «ojo»، وكده بتتكتب في الشات كمان.
      ar: |
        النهي = aja + الفعل، مثل jangan:
        - Aja lali! = لا تنسَ! (lali = lupa)
        وتنبه: النهي بـ aja لا بـ ora، فـ ora = tidak.
        وتُنطق «ojo»، وهكذا تُكتب في الدردشة أيضًا.
      en: |
        "Don't" = aja + verb, like jangan:
        - Aja lali! = Don't forget! (lali = lupa)
        Careful: "don't" is aja, not ora. ora = tidak.
        It's said "ojo", and chats spell it that way too.
    grammar: jv.imperative.ngoko
    examples:
      - text: Aja lali, ya!
        ar_eg: ماتنساش، ماشي!
        ar: لا تنسَ!
        en: Don't forget, OK!
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: «كُل!» (من غير مفعول). أنهي صح؟
      ar: «كُل!» (بلا مفعول). أيّها الصحيح؟
      en: '"Eat!" (no object). Which is right?'
    options: [Mangana!, Panganen!, Manganen!]
    answer: 0
    explain:
      ar_eg: 'من غير مفعول: الفعل + -a. وPanganen = كُله (مع مفعول).'
      ar: 'بلا مفعول: الفعل + -a، أما Panganen فمع المفعول.'
      en: 'No object: verb + -a. Panganen = eat it (with an object).'
    words: [mangana]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «اقرا الكتاب!» أنهي صح؟
      ar: «اقرأ الكتاب!» أيّها الصحيح؟
      en: '"Read the book!" Which is right?'
    options: [Aja maca bukune!, Wacanen bukune!, Mangan bukune!]
    answer: 1
    explain:
      ar_eg: 'مع مفعول: الأصل waca + -en = wacanen.'
      ar: 'مع المفعول: الجذر waca + -en = wacanen.'
      en: 'With an object: base waca + -en = wacanen.'
    words: [wacanen]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «ماتنساش!» أنهي صح؟
      ar: «لا تنسَ!» أيّها الصحيح؟
      en: '"Don''t forget!" Which is right?'
    options: [Dudu lali!, Aja lali!, Ora lali!]
    answer: 1
    explain:
      ar_eg: النهي بـ aja (jangan). ora = tidak، وdudu = bukan.
      ar: النهي بـ aja (jangan)، وora = tidak، وdudu = bukan.
      en: '"Don''t" is aja (jangan); ora = tidak, dudu = bukan.'
    words: [aja, lali]
  - id: e04
    type: fill_blank
    sentence: Aja ___, ya!
    meaning:
      ar_eg: ماتنساش، ماشي!
      ar: لا تنسَ!
      en: Don't forget, OK!
    answers: [lali]
    words: [aja, lali]
  - id: e05
    type: match_pairs
    pairs:
      - text: mangana
        ar_eg: كُل!
        ar: كُلْ!
        en: eat!
      - text: adusa
        ar_eg: استحمى!
        ar: استحمّ!
        en: take a bath!
      - text: panganen
        ar_eg: كُله!
        ar: كُلْه!
        en: eat it!
      - text: wacanen
        ar_eg: اقراه!
        ar: اقرأه!
        en: read it!
      - text: aja
        ar_eg: ماتـ… (نهي)
        ar: لا تـ… (نهي)
        en: don't…
      - text: tangi
        ar_eg: يصحى
        ar: يستيقظ
        en: wake up
    words: [mangana, adusa, panganen, wacanen, aja, tangi]
  - id: e06
    type: listen
    text: Mangana sik, ya.
    options: ['Mangana sik, ya.', 'Adusa sik, ya.', 'Panganen sik, ya.']
    answer: 0
    words: [mangana]
  - id: e07
    type: speaking
    text: Aja lali, ya!
    meaning:
      ar_eg: ما تنساش!
      ar: لا تنسَ!
      en: Don't forget!
    words: [aja, lali]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي فعل معناه «يصحى من النوم»؟
      ar: أيّ فعل يعني «يستيقظ»؟
      en: Which verb means "wake up"?
    options: [tangi, turu, adusa]
    answer: 0
    explain:
      ar_eg: tangi = يصحى، turu = ينام، adusa = استحمى!
      ar: tangi = يستيقظ، وturu = ينام، وadusa = استحمّ!
      en: tangi = wake up, turu = sleep, adusa = take a bath!
    words: [tangi, turu, adusa]
  - id: e09
    type: fill_blank
    sentence: Wis jam pitu. Ayo ___, Nduk!
    meaning:
      ar_eg: الساعة بقت سبعة. يلا اصحي يا بنتي!
      ar: صارت الساعة السابعة. هيّا استيقظي يا ابنتي!
      en: It's already seven. Come on, wake up, dear!
    options: [tangi, lali, turu]
    answers: [tangi]
    words: [tangi]
  - id: e10
    type: listen
    text: Wacanen bukune, terus adusa.
    options: ['Wacanen bukune, terus adusa.', 'Panganen segane, terus adusa.', 'Wacanen bukune, terus mangana.']
    answer: 0
    meaning:
      ar_eg: اقرا الكتاب، وبعدين استحمى.
      ar: اقرأ الكتاب، ثم استحمّ.
      en: Read the book, then take a bath.
    words: [wacanen, adusa, panganen, mangana]
dialogue:
  lines:
    - speaker: Bu Rahayu
      text: Mohamed, mangana sik!
      ar_eg: محمد، كُل الأول!
      ar: محمد، كُل أولًا!
      en: Mohamed, eat first!
    - speaker: Mohamed
      text: Mengko, Bu. Aku lagi maca.
      ar_eg: بعدين يا مدام. أنا بقرا.
      ar: لاحقًا يا سيدتي. أنا أقرأ.
      en: Later, ma'am. I'm reading.
    - speaker: Bu Rahayu
      text: Wacanen mengko. Panganen sotone!
      ar_eg: اقراه بعدين. كُل الشوربة!
      ar: اقرأه لاحقًا. كُل الحساء!
      en: Read it later. Eat the soto!
    - speaker: Mohamed
      text: Iya, Bu. Matur nuwun!
      ar_eg: حاضر يا مدام. متشكر!
      ar: حسنًا يا سيدتي. شكرًا!
      en: OK, ma'am. Thank you!
