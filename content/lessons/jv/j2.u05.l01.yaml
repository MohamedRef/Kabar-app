schema: kabar.lesson/v1
id: j2.u05.l01
language: jv
title: Mangana! Tukokna!
can_do:
  ar_eg: تدّي أوامر بالنغوكو (مع صحابك واللي أصغر منك).
  ar: أن تُصدر أوامر بالنغوكو (للأصدقاء ومن هم أصغر منك).
  en: Give ngoko commands.
slides:
  - title: Mangana! — من غير مفعول
    body:
      ar_eg: |
        في الإندونيسي بتقول «Makan!» أو «Makanlah!». الجاوي عنده نهايات للأمر، وكل نهاية ليها شغل.
        الأولى: -a لما مفيش مفعول:
        - mangan → Mangana! = كُل!
        - adus → Adusa! = استحمى!
        وفي الكلام العادي جدًا الناس كتير بتقول الفعل لوحده: Ayo mangan! = يلا ناكل.
      ar: |
        تقول الإندونيسية «Makan!» أو «Makanlah!»، وللجاوية نهايات للأمر لكل منها وظيفة.
        الأولى: -a حين لا يوجد مفعول:
        - mangan → Mangana! = كُل!
        - adus → Adusa! = اغتسل!
        وفي الكلام العفوي جدًا يُكتفى بالفعل: Ayo mangan! = هيا نأكل.
      en: |
        Indonesian says "Makan!" or "Makanlah!". Javanese has command endings, each with its own job.
        First: -a when there's no object:
        - mangan → Mangana! = Eat!
        - adus → Adusa! = Have a bath!
        Very casual speech often just uses the verb: Ayo mangan! = Let's eat.
    grammar: jv.imperative.ngoko
    examples:
      - text: Mangana sik, ya.
        ar_eg: كُل الأول، ماشي؟
        ar: كُل أولًا، حسنًا؟
        en: Eat first, OK?
  - title: Panganen! Wacanen! — مع مفعول
    body:
      ar_eg: |
        لما يكون فيه مفعول (حاجة معينة)، -en بتدخل على الأصل (مش على فعل N-):
        - pangan → Panganen! = كُله! (الأكل ده)
        - waca → Wacanen! = اقراه!
        فاكر إن maca أصلها waca؟ هنا الأصل بيرجع تاني، زي مع di- وtak-.
      ar: |
        إذا وُجد مفعول محدد دخلت -en على الجذر لا على فعل N-:
        - pangan → Panganen! = كُلْه!
        - waca → Wacanen! = اقرأه!
        تذكّر أن أصل maca هو waca؛ يعود الجذر هنا كما يعود مع di- وtak-.
      en: |
        When there's an object (a specific thing), -en goes on the base, not on the N- verb:
        - pangan → Panganen! = Eat it!
        - waca → Wacanen! = Read it!
        Remember maca comes from waca? The base comes back here, just as with di- and tak-.
    grammar: jv.imperative.ngoko
    examples:
      - text: Wacanen bukuné!
        ar_eg: اقرا الكتاب!
        ar: اقرأ الكتاب!
        en: Read the book!
  - title: Tukokna! Enteni!
    body:
      ar_eg: |
        - أفعال -aké / -ké (اللي اتعلمناها في J1: tukokké) بتاخد -na في الأمر: Tukokna! = اشتريهولي (belikan). Jupukna! = هاته (ambilkan). في سورابايا -no: Tukokno!
        - أفعال -i بتفضل زي ما هي: Enteni aku! = استناني! (tunggu aku) · Rewangi aku! = ساعدني! (bantu aku)
      ar: |
        - أفعال -aké / -ké (من J1: tukokké) تأخذ -na في الأمر: Tukokna! = اشترِه لي (belikan)، Jupukna! = ناولني إياه (ambilkan)، وفي سورابايا -no: Tukokno!
        - أفعال -i تبقى كما هي: Enteni aku! = انتظرني! (tunggu aku) · Rewangi aku! = ساعدني! (bantu aku)
      en: |
        - -aké / -ké verbs (from J1: tukokké) take -na as commands: Tukokna! = Buy it (for me)! (belikan). Jupukna! = Fetch it! (ambilkan). Surabaya: -no: Tukokno!
        - -i verbs stay as they are: Enteni aku! = Wait for me! (tunggu aku) · Rewangi aku! = Help me! (bantu aku)
    grammar: jv.imperative.ngoko
    examples:
      - text: Tulung tukokna gula, ya.
        ar_eg: والنبي هاتلي سكر.
        ar: من فضلك اشترِ لي سكرًا.
        en: Could you buy (me) some sugar?
      - text: Enteni aku neng stasiun.
        ar_eg: استناني في المحطة.
        ar: انتظرني في المحطة.
        en: Wait for me at the station.
  - title: Aja lali! — النهي
    body:
      ar_eg: |
        «ماتعملش» = aja + الفعل، زي jangan:
        - Aja lali! = ماتنساش! (lali = lupa)
        خلي بالك: النهي بـ aja، مش ora. ora = tidak.
        في الشات بتتكتب ojo، وفي سورابايا ojok.
      ar: |
        النهي = aja + الفعل، مثل jangan:
        - Aja lali! = لا تنسَ! (lali = lupa)
        وتنبه: النهي بـ aja لا بـ ora، فـ ora = tidak.
        وتُكتب في الدردشة ojo، وفي سورابايا ojok.
      en: |
        "Don't" = aja + verb, like jangan:
        - Aja lali! = Don't forget! (lali = lupa)
        Careful: "don't" is aja, not ora. ora = tidak.
        Chats write ojo; Surabaya says ojok.
    grammar: jv.imperative.ngoko
    examples:
      - text: Aja lali, ya!
        ar_eg: ماتنساش، ماشي!
        ar: لا تنسَ!
        en: Don't forget, OK!
  - title: Ya, to, tulung, sik
    body:
      ar_eg: |
        أهم حاجة في الأدب: الأمر الجاوي من غير تليين بيبان ناشف جدًا. ليّنه:
        - ya أو to في الآخر: Enteni aku, ya.
        - tulung (tolong) في الأول: Tulung jupukna, ya. = هاته والنبي.
        - sik (dulu): Mangana sik.
        - mbok (اقتراح لطيف، وسط جاوة): Mbok mangan sik. = ما تاكل الأول.
        زي «والنبي» و«لو سمحت» عندنا. ومع الكبار مش هتستخدم الأوامر دي خالص — الطلب بالكراما في J3.
      ar: |
        الأهم في الأدب: الأمر الجاوي المجرد يبدو جافًا جدًا، فلطّفه:
        - ya أو to آخرًا: Enteni aku, ya.
        - tulung (tolong) أولًا: Tulung jupukna, ya. = ناولني إياه من فضلك.
        - sik (dulu): Mangana sik.
        - mbok (اقتراح لطيف في وسط جاوة): Mbok mangan sik. = لِمَ لا تأكل أولًا؟
        كقولنا «من فضلك» و«لو سمحت». ولا تُخاطَب بها الكبار، فالطلب بالكراما في J3.
      en: |
        Most important — manners: a bare Javanese command sounds very harsh. Soften it:
        - ya or to at the end: Enteni aku, ya.
        - tulung (tolong) at the start: Tulung jupukna, ya. = Could you grab it for me?
        - sik (dulu): Mangana sik.
        - mbok (gentle push, Central Java): Mbok mangan sik. = Why don't you eat first?
        Like Egyptian «والنبي» or «لو سمحت». With elders you won't use these at all — polite krama requests come in J3.
    grammar: jv.imperative.ngoko
    examples:
      - text: Tulung jupukna, ya.
        ar_eg: هاته والنبي.
        ar: ناولني إياه من فضلك.
        en: Could you grab it for me?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Mangana!
        ar_eg: كُل!
        ar: كُل!
        en: Eat!
      - text: Panganen!
        ar_eg: كُله!
        ar: كُلْه!
        en: Eat it!
      - text: Tukokna!
        ar_eg: اشتريهولي!
        ar: اشترِه لي!
        en: Buy it for me!
      - text: Enteni aku!
        ar_eg: استناني!
        ar: انتظرني!
        en: Wait for me!
      - text: Aja lali!
        ar_eg: ماتنساش!
        ar: لا تنسَ!
        en: Don't forget!
    words: [mangana, panganen, tukokna, enteni, aja]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «كُل!» (من غير مفعول). أنهي صح؟
      ar: «كُل!» (بلا مفعول). أيّها الصحيح؟
      en: "\"Eat!\" (no object). Which is right?"
    options: ["Mangana!", "Panganen!", "Manganen!"]
    answer: 0
    explain:
      ar_eg: "من غير مفعول: الفعل + -a. وPanganen = كُله (مع مفعول)."
      ar: "بلا مفعول: الفعل + -a، أما Panganen فمع المفعول."
      en: "No object: verb + -a. Panganen = eat it (with an object)."
    words: [mangana]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: «اقرا الكتاب!» أنهي صح؟
      ar: «اقرأ الكتاب!» أيّها الصحيح؟
      en: "\"Read the book!\" Which is right?"
    options: ["Aja maca bukuné!", "Wacanen bukuné!", "Mangan bukuné!"]
    answer: 1
    explain:
      ar_eg: "مع مفعول: الأصل waca + -en = wacanen."
      ar: "مع المفعول: الجذر waca + -en = wacanen."
      en: "With an object: base waca + -en = wacanen."
    words: [wacanen]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: «ماتنساش!» أنهي صح؟
      ar: «لا تنسَ!» أيّها الصحيح؟
      en: "\"Don't forget!\" Which is right?"
    options: ["Dudu lali!", "Aja lali!", "Ora lali!"]
    answer: 1
    explain:
      ar_eg: النهي بـ aja (jangan). ora = tidak، وdudu = bukan.
      ar: النهي بـ aja (jangan)، وora = tidak، وdudu = bukan.
      en: "\"Don't\" is aja (jangan); ora = tidak, dudu = bukan."
    words: [aja, lali]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز صاحبك يجيبلك حاجة. أنهي جملة ألطف؟
      ar: تريد من صديقك أن يناولك شيئًا. أي جملة ألطف؟
      en: You want your friend to grab something for you. Which is the friendliest?
    options: ["Jupuk!", "Tulung jupukna, ya.", "Jupukna!"]
    answer: 1
    explain:
      ar_eg: tulung في الأول وya في الآخر بيليّنوا الأمر.
      ar: تُليّن tulung في البداية وya في النهاية الأمرَ.
      en: tulung at the start and ya at the end soften the command.
    words: [tulung, jupukna]
  - id: e06
    type: listen
    text: Enteni aku neng stasiun.
    options: ["Enteni aku neng stasiun.", "Enteni aku neng pasar.", "Tukokna aku neng stasiun."]
    answer: 0
    words: [enteni, stasiun]
