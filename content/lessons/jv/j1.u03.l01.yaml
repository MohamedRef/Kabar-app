schema: kabar.lesson/v1
id: j1.u03.l01
language: jv
title: Wis, durung, lagi, arep
can_do:
  ar_eg: توضّح الحاجة حصلت إمتى (خلاص، لسه، دلوقتي، هتحصل).
  ar: أن تبيّن متى يقع الحدث (تمّ، لم يتمّ بعد، يجري الآن، سيقع).
  en: Show when things happen.
slides:
  - title: Wis lan durung
    body:
      ar_eg: |
        إنت عارف الفكرة من الإندونيسي: الفعل مابيتغيرش، وبنحط كلمة صغيرة قبله. هنا الكلمات بس اللي جديدة:
        - wis = sudah (خلاص): Aku wis mangan = Saya sudah makan = كلت خلاص. (mangan = makan)
          في سورابايا (Arek) والشات: wes، ws.
        - durung = belum (لسه ماحصلش): Aku durung mangan = لسه ماكلتش.
        ولما حد يسألك «Wis …?» والإجابة لأ، قول «Durung» مش «Ora» — زي belum في الإندونيسي، «لسه» ألطف وأدق من «لأ».
      ar: |
        الفكرة معروفة من الإندونيسية: الفعل لا يتغير، وتسبقه كلمة صغيرة، والجديد هو الألفاظ:
        - wis = sudah (قد / تمّ): Aku wis mangan = Saya sudah makan = قد أكلت (mangan = makan).
          وفي سورابايا (Arek) والدردشة: wes، ws.
        - durung = belum (لم … بعد): Aku durung mangan = لم آكل بعد.
        وإذا سُئلت «Wis …?» والجواب بالنفي فقل «Durung» لا «Ora»، كما في belum الإندونيسية.
      en: |
        You know the idea from Indonesian: the verb never changes; a small word goes before it. Only the words are new:
        - wis = sudah (already): Aku wis mangan = Saya sudah makan = I've eaten. (mangan = makan)
          Surabaya (Arek) and chats: wes, ws.
        - durung = belum (not yet): Aku durung mangan = I haven't eaten yet.
        When someone asks "Wis …?" and the answer is no, say "Durung", not "Ora" — just like belum.
    grammar: jv.aspect.wis-durung-lagi-arep
    examples:
      - text: Kowé wis mangan? — Durung.
        ar_eg: كلت؟ — لسه.
        ar: هل أكلت؟ — ليس بعد.
        en: Have you eaten? — Not yet.
      - text: Wes mangan, rek?
        ar_eg: كلت يا صاحبي؟ (Arek)
        ar: هل أكلت يا صاح؟ (Arek)
        en: Eaten yet, mate? (Arek)
  - title: Lagi lan isih
    body:
      ar_eg: |
        - lagi = sedang (بيعمل دلوقتي): Aku lagi maca buku = بقرا كتاب دلوقتي. (maca = membaca)
          ونفس الكلمة lagi موجودة في الإندونيسي العامي («Aku lagi makan»)!
        - isih = masih (لسه مستمر): Dheweke isih turu = لسه نايم. (turu = tidur)
        خلي بالك: «لسه» المصري ليها معنيين — «لسه ماكلتش» = durung، و«لسه نايم» = isih.
      ar: |
        - lagi = sedang (يفعل الآن): Aku lagi maca buku = أقرأ كتابًا الآن (maca = membaca).
          وlagi نفسها مستعملة في الإندونيسية العامية («Aku lagi makan»).
        - isih = masih (ما زال): Dheweke isih turu = ما زال نائمًا (turu = tidur).
        وانتبه: «لسه» في العامية المصرية لها معنيان؛ «لسه ماكلتش» = durung، و«لسه نايم» = isih.
      en: |
        - lagi = sedang (in the middle of): Aku lagi maca buku = I'm reading a book. (maca = membaca)
          Casual Indonesian uses lagi the same way ("Aku lagi makan")!
        - isih = masih (still): Dheweke isih turu = He's still asleep. (turu = tidur)
        Careful: Egyptian «لسه» covers both — «لسه ماكلتش» = durung, «لسه نايم» = isih.
    grammar: jv.aspect.wis-durung-lagi-arep
    examples:
      - text: Aku lagi maca buku.
        ar_eg: أنا بقرا كتاب دلوقتي.
        ar: أنا أقرأ كتابًا الآن.
        en: I'm reading a book.
      - text: Dheweke isih turu.
        ar_eg: لسه نايم / نايمة.
        ar: ما زال نائمًا.
        en: He / She is still asleep.
  - title: Arep (arp, kate)
    body:
      ar_eg: |
        - arep = akan / mau (هـ / ناوي): Aku arep mangan = هاكل / ناوي آكل.
        - في الشات: arp (الحروف المتحركة بتقع).
        - في سورابايا (Arek): kate. «Kate nang endi, rek?» = رايح فين يا صاحبي؟ (nang = ke)
        وزي الإندونيسي: كل الكلمات دي قبل الفعل. «Aku mangan wis» غلط، الصح «Aku wis mangan».
      ar: |
        - arep = akan / mau (سوف / ينوي): Aku arep mangan = سآكل.
        - وفي الدردشة: arp (تسقط الصوائت).
        - وفي سورابايا (Arek): kate: «Kate nang endi, rek?» = إلى أين يا صاح؟ (nang = ke)
        وكلها تسبق الفعل كالإندونيسية، فـ«Aku mangan wis» خطأ والصواب «Aku wis mangan».
      en: |
        - arep = akan / mau (going to): Aku arep mangan = I'm going to eat.
        - In chats: arp (the vowels drop).
        - Surabaya (Arek): kate. "Kate nang endi, rek?" = Where are you off to, mate? (nang = ke)
        As in Indonesian, all of these go before the verb: not "Aku mangan wis" but "Aku wis mangan".
    grammar: jv.aspect.wis-durung-lagi-arep
    examples:
      - text: Aku arep turu.
        ar_eg: أنا هنام.
        ar: سأنام.
        en: I'm going to sleep.
      - text: Kate nang endi, rek?
        ar_eg: رايح فين يا صاحبي؟ (Arek)
        ar: إلى أين أنت ذاهب يا صاح؟ (Arek)
        en: Where are you off to, mate? (Arek)
  - title: Wis ya!
    body:
      ar_eg: |
        بونص: wis لوحدها معناها كمان «خلاص / كفاية / يلا سلام».
        «Wis ya!» = خلاص بقى، سلام! — بتقفل بيها الشات أو المكالمة.
        وWis tekan? = وصلت؟ (tekan = sampai). سؤال هتسمعه كل ما تسافر. (وsepur = kereta = القطر)
      ar: |
        وتأتي wis وحدها بمعنى «انتهى / كفى / إلى اللقاء»:
        «Wis ya!» = حسنًا، إلى اللقاء! وبها تُختم الدردشة أو المكالمة.
        وWis tekan? = هل وصلت؟ (tekan = sampai)، وستسمعها كلما سافرت (وsepur = kereta = القطار).
      en: |
        Bonus: wis on its own also means "that's it / enough / bye".
        "Wis ya!" = OK, that's it, bye! — how you close a chat or a call.
        And "Wis tekan?" = Have you arrived? (tekan = sampai). You'll get it every time you travel. (sepur = kereta, train)
    grammar: jv.aspect.wis-durung-lagi-arep
    examples:
      - text: Wis tekan? — Durung, isih nang sepur.
        ar_eg: وصلت؟ — لسه، لسه في القطر.
        ar: هل وصلت؟ — ليس بعد، ما زلت في القطار.
        en: Arrived yet? — Not yet, still on the train.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wis
        ar_eg: خلاص (sudah)
        ar: قد / تمّ (sudah)
        en: already (sudah)
      - text: durung
        ar_eg: لسه ماحصلش (belum)
        ar: لم … بعد (belum)
        en: not yet (belum)
      - text: lagi
        ar_eg: بيعمل دلوقتي (sedang)
        ar: يفعل الآن (sedang)
        en: in the middle of (sedang)
      - text: arep
        ar_eg: هـ / ناوي (akan)
        ar: سوف (akan)
        en: going to (akan)
      - text: isih
        ar_eg: لسه مستمر (masih)
        ar: ما زال (masih)
        en: still (masih)
    words: [wis, durung, lagi, arep, isih]
  - id: e02
    type: match_pairs
    pairs:
      - text: mangan
        ar_eg: ياكل (makan)
        ar: يأكل (makan)
        en: eat (makan)
      - text: turu
        ar_eg: ينام (tidur)
        ar: ينام (tidur)
        en: sleep (tidur)
      - text: maca
        ar_eg: يقرا (membaca)
        ar: يقرأ (membaca)
        en: read (membaca)
      - text: tekan
        ar_eg: يوصل (sampai)
        ar: يصل (sampai)
        en: arrive (sampai)
    words: [mangan, turu, maca, tekan]
  - id: e03
    type: multiple_choice
    question: Kowé wis mangan?
    question_meaning:
      ar_eg: لسه ماكلتش. ترد بإيه؟
      ar: لم تأكل بعد. بمَ تجيب؟
      en: You haven't eaten yet. What do you answer?
    options: ["Wis.", "Durung.", "Lagi."]
    answer: 1
    explain:
      ar_eg: durung = belum = لسه. ده الرد الطبيعي على «Wis …?».
      ar: durung = belum، وهو الجواب الطبيعي عن «Wis …?».
      en: durung = belum — the natural answer to "Wis …?".
    words: [durung]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح؟
      ar: أيّ جملة صحيحة؟
      en: Which sentence is correct?
    options: ["Aku mangan wis.", "Aku wis mangan.", "Wis aku mangan."]
    answer: 1
    explain:
      ar_eg: wis قبل الفعل، زي sudah في «Saya sudah makan».
      ar: wis تسبق الفعل كـ sudah في «Saya sudah makan».
      en: wis goes before the verb, like sudah in "Saya sudah makan".
    words: [wis, mangan]
  - id: e05
    type: multiple_choice
    question: arp turu
    question_meaning:
      ar_eg: صاحبك بعت الرسالة دي بالليل. معناها إيه؟
      ar: أرسل صديقك هذه الرسالة ليلًا. ما معناها؟
      en: Your friend sends this at night. What does it mean?
    options: ["I'm going to sleep.", "I've already slept.", "I'm still asleep."]
    answer: 0
    explain:
      ar_eg: arp = arep (هـ)، turu = نوم. يعني «هنام».
      ar: arp = arep (سوف)، وturu = ينام، أي «سأنام».
      en: arp = arep (going to), turu = sleep.
    words: [arep, turu]
  - id: e06
    type: listen
    text: Aku lagi maca buku.
    options: ["Aku wis maca buku.", "Aku lagi maca buku.", "Aku arep maca buku."]
    answer: 1
    words: [lagi, maca]
  - id: e07
    type: fill_blank
    sentence: Dheweke ___ turu.
    meaning:
      ar_eg: لسه نايم (من بدري ولسه).
      ar: ما زال نائمًا.
      en: He's still asleep.
    options: ["arep", "durung", "isih"]
    answers: [isih]
    explain:
      ar_eg: «لسه» بمعنى مستمر = isih (masih). durung = لسه ماحصلش.
      ar: «ما زال» = isih (masih)، أما durung فـ«لم … بعد».
      en: still = isih (masih); durung is "not yet".
    words: [isih, turu]
  - id: e08
    type: fill_blank
    sentence: Aku ___ mangan.
    meaning:
      ar_eg: أنا هاكل (دلوقتي حالًا).
      ar: سآكل الآن.
      en: I'm going to eat.
    options: ["wis", "durung", "arep"]
    answers: [arep]
    words: [arep, mangan]
  - id: e09
    type: build_sentence
    source:
      ar_eg: أنا كلت خلاص.
      ar: قد أكلت.
      en: I've already eaten.
    answer: Aku wis mangan.
    distractors: [sudah, durung]
    words: [wis, mangan]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لسه ماكلتش.
      ar: لم آكل بعد.
      en: I haven't eaten yet.
    answers:
      - Aku durung mangan.
      - Aku durung mangan
      - Durung mangan.
      - Durung mangan
    words: [durung, mangan]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا بقرا كتاب دلوقتي.
      ar: أنا أقرأ كتابًا الآن.
      en: I'm reading a book.
    answers:
      - Aku lagi maca buku.
      - Aku lagi maca buku
      - Aku lagi moco buku.
      - Aku lagi moco buku
    explain:
      ar_eg: lagi = sedang، maca = membaca. وفي الشات moco.
      ar: lagi = sedang، وmaca = membaca، وفي الدردشة moco.
      en: lagi = sedang, maca = membaca (chat moco).
    words: [lagi, maca]
  - id: e12
    type: translate
    direction: from_target
    source_text: Wes tekan, rek?
    answers_meaning:
      ar_eg: ["وصلت يا صاحبي؟", "وصلت ولا لسه يا صاحبي؟", "وصلتوا يا جدعان؟", "وصلت يا جدع؟"]
      ar: ["هل وصلت يا صاح؟", "هل وصلتم يا جماعة؟", "أوصلت يا صديقي؟"]
      en: ["Have you arrived, mate?", "Arrived yet, mate?", "Are you there yet, mate?", "Have you arrived, guys?"]
    explain:
      ar_eg: wes = wis بتاعة سورابايا، tekan = يوصل.
      ar: wes = wis في سورابايا، وtekan = يصل.
      en: wes is Surabaya's wis; tekan = arrive.
    words: [wis, tekan]
  - id: e13
    type: dictation
    text: Aku durung mangan.
    meaning:
      ar_eg: لسه ماكلتش.
      ar: لم آكل بعد.
      en: I haven't eaten yet.
    words: [durung, mangan]
  - id: e14
    type: speaking
    text: Kowé wis mangan? — Durung.
    meaning:
      ar_eg: كلت؟ — لسه.
      ar: هل أكلت؟ — ليس بعد.
      en: Have you eaten? — Not yet.
    words: [wis, durung, mangan]
dialogue:
  title: Bengi nang Tunjungan
  lines:
    - speaker: Mbak Rara
      text: Mohamed, kowé wis mangan?
      ar_eg: محمد، كلت؟
      ar: محمد، هل أكلت؟
      en: Mohamed, have you eaten?
    - speaker: Mohamed
      text: Durung, Mbak. Aku lagi maca buku.
      ar_eg: لسه يا رارا. أنا بقرا كتاب.
      ar: ليس بعد. أنا أقرأ كتابًا.
      en: Not yet. I'm reading a book.
    - speaker: Cak Heru
      text: Ayo mangan, rek! Aku arep mangan sate.
      ar_eg: يلا ناكل يا جدعان! أنا هاكل ساتيه.
      ar: هيا نأكل يا جماعة! سآكل الساتيه.
      en: Let's eat, guys! I'm going to have satay.
    - speaker: Mohamed
      text: Ayo! Mbak Rara wis mangan?
      ar_eg: يلا! وإنتِ يا رارا كلتي؟
      ar: هيا! وهل أكلتِ يا رارا؟
      en: Let's go! Have you eaten, Rara?
    - speaker: Mbak Rara
      text: Wis. Aku arep turu. Wis ya!
      ar_eg: أيوه كلت. أنا هنام. يلا سلام!
      ar: نعم أكلت. سأنام الآن. إلى اللقاء!
      en: Yes. I'm going to sleep. Bye!
new_words:
  - word: wis
    pos: adverb
    ar_eg: خلاص، بالفعل (= sudah؛ Arek / شات wes، ws)
    ar: قد، تمّ (= sudah؛ وفي Arek والدردشة wes، ws)
    en: already (= sudah; Arek / chat wes, ws)
  - word: durung
    pos: adverb
    ar_eg: لسه ماحصلش (= belum)
    ar: لم … بعد (= belum)
    en: not yet (= belum)
  - word: lagi
    pos: adverb
    ar_eg: بيعمل دلوقتي (= sedang)
    ar: يفعل الآن (= sedang)
    en: in the middle of, -ing (= sedang)
  - word: arep
    pos: adverb
    ar_eg: هـ / ناوي (= akan / mau؛ شات arp، Arek kate)
    ar: سوف / ينوي (= akan / mau؛ دردشة arp، وArek kate)
    en: going to, want to (= akan / mau; chat arp, Arek kate)
  - word: isih
    pos: adverb
    ar_eg: لسه مستمر (= masih)
    ar: ما زال (= masih)
    en: still (= masih)
  - word: mangan
    pos: verb
    ar_eg: ياكل (= makan)
    ar: يأكل (= makan)
    en: to eat (= makan)
  - word: turu
    pos: verb
    ar_eg: ينام (= tidur)
    ar: ينام (= tidur)
    en: to sleep (= tidur)
  - word: maca
    pos: verb
    ar_eg: يقرا (= membaca؛ شات moco)
    ar: يقرأ (= membaca؛ دردشة moco)
    en: to read (= membaca; chat moco)
  - word: tekan
    pos: verb
    ar_eg: يوصل (= sampai)
    ar: يصل (= sampai)
    en: to arrive (= sampai)
