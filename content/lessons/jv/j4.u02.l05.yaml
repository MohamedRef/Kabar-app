      ar_eg: تيتة ___ في الصورة.
      ar: الجدّة ___ في الصورة.
      en: Grandma is ___ in the photo.
    options: [sesarengan, mesem, rikma]
    answer: 1
    explain:
      ar_eg: mesem = بتبتسم.
      ar: mesem = تبتسم.
      en: mesem = smiling.
    words: [mesem, sesarengan, rikma]
  - id: e06
    type: fill_blank
    sentence: ___ Simbah sampun pethak.
    meaning:
      ar_eg: ___ تيتة بقى أبيض.
      ar: ___ الجدّة صار أبيض.
      en: Grandma's ___ has gone white.
    options: [Rikmanipun, Pasuryanipun, Wajanipun]
    answers: [Rikmanipun]
    words: [rikma, pasuryan, waja]
  - id: e07
    type: build_sentence
    source:
