        ar: بسكاب (سترة رجالية)
        en: beskap (men's jacket)
      - text: blangkon
        ar_eg: بلانكون (غطا راس)
        ar: بلانكون (غطاء رأس)
        en: blangkon (headcloth)
      - text: sesarengan
        ar_eg: سوا، مع بعض
        ar: معًا
        en: together
