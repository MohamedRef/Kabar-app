  - id: e09
    type: speaking
    text: Bapak ngagem beskap, Simbah mesem.
    meaning:
      ar_eg: الأستاذ لابس بسكاب، وتيتة بتبتسم.
      ar: يرتدي الوالد البسكاب والجدّة تبتسم.
      en: Father is wearing a beskap, and Grandma is smiling.
    words: [beskap, mesem]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: عايز توصف شعر الأستاذ بأدب. تقول إيه؟
      ar: تريد أن تصف شعر الأستاذ بأدب. ماذا تقول؟
      en: You want to describe the gentleman's hair politely. What do you say?
    options: [Rambute Bapak cemeng., Rikma kula cemeng., Rikmanipun Bapak cemeng.]
    answer: 2
    explain:
      ar_eg: 'للكبير: rikma مع -ipun. rikma kula غلط، وrambute نغوكو.'
      ar: 'للكبير: rikma مع -ipun. أما rikma kula فخطأ، وrambute نغوكو.'
      en: 'For the elder: rikma with -ipun. ''Rikma kula'' is wrong, and rambute is ngoko.'
    words: [rikma, waja]
dialogue:
  lines:
    - speaker: Bu Harsono
      text: Mas Mohamed, mangga foto sesarengan!
      ar_eg: يا ماس محمد، تعالى نتصور سوا!
      ar: يا ماس محمد، تعالَ نلتقط صورة معًا!
      en: Mohamed, come and take a photo with us!
    - speaker: Mohamed
      text: Inggih, Bu. Bapak sampun ngagem beskap lan blangkon?
      ar_eg: حاضر يا هانم. الأستاذ لبس البسكاب والبلانكون؟
      ar: حاضر يا سيدتي. هل لبس الوالد البسكاب والبلانكون؟
      en: Yes, ma'am. Is Father wearing his beskap and blangkon?
    - speaker: Bu Harsono
      text: Sampun. Kula ngangge kebaya.
      ar_eg: أيوه. وأنا لابسة كبايا.
      ar: نعم. وأنا أرتدي الكبايا.
      en: He is. And I'm wearing a kebaya.
    - speaker: Mohamed
      text: Mbah, mesem, nggih!
      ar_eg: تيتة، ابتسمي!
      ar: يا جدّتي، ابتسمي!
      en: Grandma, smile!
    - speaker: Mbah Putri
      text: Untu kula sampun mboten wonten, Nak!
      ar_eg: أنا ما عنديش سنان خلاص يا ابني!
      ar: لم يبقَ لي أسنان يا بنيّ!
      en: I've no teeth left, dear!
    - speaker: Mohamed
      text: Mboten menapa-menapa, Mbah. Pasuryanipun Simbah sae sanget.
      ar_eg: مش مهم يا تيتة. وش حضرتك حلو أوي.
      ar: لا بأس يا جدّتي. وجهكِ جميل جدًّا.
      en: That's all right, Grandma. You look lovely.
