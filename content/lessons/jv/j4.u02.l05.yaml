        ar_eg: وش (للكبير)
        ar: وجه (للكبير)
        en: face (elder)
      - text: rikma
        ar_eg: شعر (للكبير)
        ar: شعر (للكبير)
        en: hair (elder)
      - text: waja
        ar_eg: سنان (للكبير)
        ar: أسنان (للكبير)
        en: teeth (elder)
      - text: mesem
        ar_eg: يبتسم
        ar: يبتسم
