schema: kabar.lesson/v1
id: j4.u02.l05
language: jv
title: Mesem, Mbah!
can_do:
  ar_eg: تصوّر العيلة بلبسها الجاوي، وتمدح وش وشعر حد كبير بأدب.
  ar: أن تصوّر العائلة بلباسها الجاوي، وتمدح وجه كبير وشعره بأدب.
  en: Take a family photo in Javanese dress, and compliment an elder's face and hair politely.
slides:
  - title: Pasuryan, rikma, waja
    body:
      ar_eg: |
        - pasuryan = وش (krama inggil لـ rai)، rikma = شعر (لـ rambut)، waja = سنان (لـ untu).
          الكبير عن نفسه بيقول الكلمة العادية: «Untu kula...». krama inggil دايمًا للتاني.
        - mesem = يبتسم: «Mesem, Mbah!» = ابتسمي يا تيتة!
        - اللبس الجاوي: kebaya = بلوزة الستات التقليدية، beskap = جاكتة الرجالة الرسمية، blangkon = غطا الراس الجاوي من الباتيك.
        - sesarengan = سوا، مع بعض (كراما): «Mangga foto sesarengan!»
      ar: |
        - pasuryan = وجه (krama inggil لـ rai)، rikma = شعر (لـ rambut)، waja = أسنان (لـ untu).
          والكبير يقول عن نفسه الكلمة العادية: «Untu kula...»، فـ krama inggil للآخر دائمًا.
        - mesem = يبتسم: «Mesem, Mbah!» = ابتسمي يا جدّتي!
        - اللباس الجاوي: kebaya = بلوزة النساء التقليدية، beskap = سترة الرجال الرسمية، blangkon = غطاء الرأس الجاوي من الباتيك.
        - sesarengan = معًا (كراما): «Mangga foto sesarengan!»
      en: |
        - pasuryan = face (krama inggil for rai), rikma = hair (for rambut), waja = teeth (for untu).
          An elder uses the plain word about themselves: "Untu kula...". Krama inggil is always for the other person.
        - mesem = smile: "Mesem, Mbah!" = smile, Grandma!
        - Javanese dress: kebaya = women's traditional blouse, beskap = men's formal jacket, blangkon = Javanese batik headcloth.
        - sesarengan = together (krama): "Mangga foto sesarengan!"
    examples:
      - text: Mangga foto sesarengan!
        ar_eg: يلا نتصور كلنا سوا!
        ar: هيّا نلتقط صورة معًا!
        en: Let's all take a photo together!
      - text: Rikmanipun Simbah sampun pethak.
        ar_eg: شعر تيتة بقى أبيض.
        ar: شاب شعر الجدّة.
        en: Grandma's hair has gone white.
      - text: Bapak ngagem beskap lan blangkon.
        ar_eg: الأستاذ لابس بسكاب وبلانكون.
        ar: يرتدي الوالد البسكاب والبلانكون.
        en: Father is wearing a beskap and a blangkon.
exercises:
