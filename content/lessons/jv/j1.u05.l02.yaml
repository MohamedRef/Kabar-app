schema: kabar.lesson/v1
id: j1.u05.l02
language: jv
title: Mau, mengko, nganti
can_do:
  ar_eg: 'تتفق مع صحابك على مشوار للبحر: إمتى نطلع، ولحد إمتى نقعد.'
  ar: 'أن تتفق مع أصدقائك على رحلة إلى البحر: متى تنطلقون وإلى متى تبقون.'
  en: 'Plan a beach trip with friends: when you leave and how long you stay.'
slides:
  - title: Mengko neng pantai
    body:
      ar_eg: |
        كلام الوقت اللي هتسمعه كل يوم في يوجيا:
        - mau = من شوية (مش «عايز»!): Mau aku wis mangan = كلت من شوية.
        - mengko = بعدين / كمان شوية: Mengko bengi = بالليل كده.
        - nganti = لحد: nganti bengi = لحد بالليل.
        - yen = لو / لما: Yen ombake gedhe, ora usah adus = لو الموج عالي، بلاش نستحمى.
        ومعاهم: pantai = شط، ombak = موج، motor = موتوسيكل، nongkrong = نقعد نرغي مع الصحاب.
      ar: |
        ألفاظ الوقت اليومية في يوجيا:
        - mau = منذ قليل (لا «يريد»!): Mau aku wis mangan = أكلت قبل قليل.
        - mengko = لاحقًا / بعد قليل: Mengko bengi = الليلة.
        - nganti = حتى: nganti bengi = حتى الليل.
        - yen = إذا / عندما: Yen ombake gedhe, ora usah adus = إن كان الموج عاليًا فلا تسبح.
        ومعها: pantai = شاطئ، ombak = موج، motor = دراجة نارية، nongkrong = الجلوس والسمر مع الأصحاب.
      en: |
        Time words you'll hear every day in Jogja:
        - mau = a moment ago (not "want"!): Mau aku wis mangan = I ate just now.
        - mengko = later, in a bit: Mengko bengi = tonight.
        - nganti = until: nganti bengi = until night.
        - yen = if, when: Yen ombake gedhe, ora usah adus = If the waves are big, don't swim.
        Plus: pantai = beach, ombak = wave, motor = motorbike, nongkrong = hang out and chat.
    grammar: jv.time.expressions
    examples:
      - text: Mengko awan ayo neng pantai numpak motor!
        ar_eg: كمان شوية الضهر يلا على الشط بالموتوسيكل!
        ar: لاحقًا ظهرًا هيا إلى الشاطئ بالدراجة النارية!
        en: Later at noon let's ride to the beach!
      - text: Mau aku wis tuku bensin.
        ar_eg: أنا جبت بنزين من شوية.
        ar: اشتريت الوقود قبل قليل.
        en: I already got petrol just now.
      - text: Yen ora udan, nongkrong nganti bengi.
        ar_eg: لو مافيش مطر، نقعد نرغي لحد بالليل.
        ar: إن لم تمطر نسهر حتى الليل.
        en: If it doesn't rain, we'll hang out till night.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mau
        ar_eg: من شوية
        ar: قبل قليل
        en: a moment ago
      - text: mengko
        ar_eg: بعدين
        ar: لاحقًا
        en: later
      - text: nganti
        ar_eg: لحد
        ar: حتى
        en: until
      - text: yen
        ar_eg: لو / لما
        ar: إذا
        en: if, when
    words: [mau, mengko, nganti, yen]
  - id: e02
    type: match_pairs
    pairs:
      - text: pantai
        ar_eg: شط
        ar: شاطئ
        en: beach
      - text: ombak
        ar_eg: موج
        ar: موج
        en: waves
      - text: motor
        ar_eg: موتوسيكل
        ar: دراجة نارية
        en: motorbike
      - text: nongkrong
        ar_eg: يقعد يرغي
        ar: يسمر مع الأصحاب
        en: hang out
    words: [pantai, ombak, motor, nongkrong]
  - id: e03
    type: listen
    text: Mengko neng pantai numpak motor, ya.
    question:
      ar_eg: هيروحوا فين وإزاي؟
      ar: إلى أين سيذهبون وكيف؟
      en: Where are they going, and how?
    options: [على الشط بالموتوسيكل بعدين, على البيت بالقطر, على السوق دلوقتي]
    answer: 0
    meaning:
      ar_eg: بعدين نروح الشط بالموتوسيكل، ماشي؟
      ar: لاحقًا نذهب إلى الشاطئ بالدراجة النارية، حسنًا؟
      en: Later we'll ride to the beach, OK?
    words: [mengko, pantai, motor]
  - id: e04
    type: fill_blank
    sentence: Aku neng pantai ___ bengi.
    meaning:
      ar_eg: أنا في الشط لحد بالليل.
      ar: أنا على الشاطئ حتى الليل.
      en: I'm at the beach until night.
    options: [nganti, mau, yen]
    answers: [nganti]
    words: [nganti, mau, yen, pantai]
    explain:
      ar_eg: nganti bengi = لحد بالليل. mau = من شوية، وyen = لو.
      ar: nganti bengi = حتى الليل؛ أما mau فقبل قليل، وyen إذا.
      en: nganti bengi = until night. mau = a while ago, yen = if.
  - id: e05
    type: multiple_choice
    question: Mau aku wis mangan.
    question_meaning:
      ar_eg: 'Tembung kembar: صاحبك قالك كده. يقصد إيه؟'
      ar: 'Tembung kembar: قالها صديقك. ماذا يقصد؟'
      en: 'Tembung kembar: your friend says this. What does he mean?'
    options: [كلت من شوية, عايز آكل, هاكل بعدين]
    answer: 0
    explain:
      ar_eg: mau هنا = من شوية (tadi)، مش «عايز». و«عايز» = arep / pengin.
      ar: mau هنا = منذ قليل (tadi) لا «يريد»، والإرادة arep / pengin.
      en: mau here = a moment ago (tadi), not Indonesian mau "want"; in Javanese "want" is arep or pengin.
    words: [mau, mengko]
  - id: e06
    type: fill_blank
    sentence: ___ ombake gedhe, ora usah adus.
    meaning:
      ar_eg: لو الموج عالي، ماتستحماش.
      ar: إن كان الموج عاليًا فلا تسبح.
      en: If the waves are big, don't swim.
    options: [Yen, Mau, Nganti]
    answers: [Yen]
    words: [yen, ombak, nganti]
    explain:
      ar_eg: "yen = لو، بتبدأ الشرط: لو الموج عالي متنزلش. mau = من شوية، وnganti = لحد."
      ar: "yen = إذا، تبدأ الشرط: إذا كان الموج عاليًا فلا تسبح؛ أما mau فقبل قليل، وnganti حتى."
      en: yen = if, opening the condition. mau = a while ago, nganti = until.
  - id: e07
    type: build_sentence
    source:
      ar_eg: يلا نقعد نرغي على الشط.
      ar: هيا نسمر على الشاطئ.
      en: Let's hang out at the beach.
    answer: Ayo nongkrong neng pantai.
    distractors: [motor, mau]
    words: [nongkrong, pantai]
    explain:
      ar_eg: ayo nongkrong = يلا نقعد / نروّق، وneng pantai = على البحر. motor = موتوسيكل، وmau = من شوية، ومش في المعنى.
      ar: ayo nongkrong = هيا نجلس ونستمتع، وneng pantai = على الشاطئ؛ أما motor فدراجة نارية، وmau قبل قليل، وليسا في المعنى.
      en: ayo nongkrong = let's hang out, neng pantai = at the beach. motor and mau aren't in the meaning.
  - id: e08
    type: translate
    direction: from_target
    source_text: Yen ombake gedhe, nongkrong wae neng pasir.
    answers_meaning:
      ar_eg: [لو الموج عالي، نقعد نرغي على الرملة وخلاص, لما الموج يبقى عالي، نقعد على الرمل وبس]
      ar: [إن كان الموج عاليًا فلنجلس على الرمل فحسب, إذا علا الموج نجلس على الرمل لا غير]
      en: ['If the waves are big, we''ll just hang out on the sand', 'When the waves are high, just sit on the sand']
    words: [yen, ombak, nongkrong]
  - id: e09
    type: speaking
    text: Mengko aku neng pantai numpak motor.
    meaning:
      ar_eg: بعدين هروح الشط بالموتوسيكل.
      ar: لاحقًا أذهب إلى الشاطئ بالدراجة النارية.
      en: Later I'm riding to the beach.
    words: [mengko, pantai, motor]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «موج»؟
      ar: أيّ كلمة تعني «موج»؟
      en: Which word means "waves"?
    options: [ombak, motor, pantai]
    answer: 0
    explain:
      ar_eg: ombak = موج، وombake gedhe = الموج عالي.
      ar: ombak = موج، وombake gedhe = الموج عالٍ.
      en: ombak = waves; ombake gedhe = the waves are big.
    words: [ombak, motor, pantai]
dialogue:
  lines:
    - speaker: Mas Heru
      text: Cah, mengko awan neng Parangtritis, piye?
      ar_eg: يا جماعة، بعدين الضهر نروح باراندجتريتيس، إيه رأيكم؟
      ar: يا رفاق، ما رأيكم أن نذهب ظهرًا إلى باراندجتريتيس؟
      en: Guys, how about Parangtritis this afternoon?
    - speaker: Mohamed
      text: Ayo! Numpak motor?
      ar_eg: يلا! بالموتوسيكل؟
      ar: هيا! بالدراجة النارية؟
      en: Let's go! By motorbike?
    - speaker: Mas Heru
      text: Iya. Mau aku wis tuku bensin.
      ar_eg: أيوه. أنا جبت بنزين من شوية.
      ar: نعم. اشتريت الوقود قبل قليل.
      en: Yes. I got petrol just now.
    - speaker: Mohamed
      text: Apik. Neng pantai nganti bengi?
      ar_eg: حلو. هنقعد على الشط لحد بالليل؟
      ar: جميل. نبقى على الشاطئ حتى الليل؟
      en: Great. At the beach till night?
    - speaker: Mas Heru
      text: Yen ora udan, nongkrong nganti bengi!
      ar_eg: لو مانزلتش مطر، نقعد نرغي لحد بالليل!
      ar: إن لم تمطر نسهر حتى الليل!
      en: If it doesn't rain, we hang out till night!
new_words:
  - word: mau
    pos: adverb
    ar_eg: من شوية (= tadi) (≠ إندونيسي mau = عايز)
    ar: قبل قليل (= tadi) (≠ الإندونيسية mau = يريد)
    en: a moment ago (= tadi) (≠ Indonesian mau "want")
    false_friend: mau
  - word: mengko
    pos: adverb
    ar_eg: بعدين، كمان شوية (= nanti)
    ar: لاحقًا (= nanti)
    en: later (= nanti)
  - word: nganti
    pos: conjunction
    ar_eg: لحد (= sampai)
    ar: حتى (= sampai)
    en: until (= sampai)
  - word: yen
    pos: conjunction
    ar_eg: لو، لما (= kalau)
    ar: إذا (= kalau)
    en: if, when (= kalau)
  - word: pantai
    pos: noun
    ar_eg: شط، بلاج
    ar: شاطئ
    en: beach
  - word: ombak
    pos: noun
    ar_eg: موج
    ar: موج
    en: wave(s)
  - word: motor
    pos: noun
    ar_eg: موتوسيكل
    ar: دراجة نارية
    en: motorbike
  - word: nongkrong
    pos: verb
    ar_eg: يقعد يرغي مع الصحاب
    ar: يسمر مع الأصحاب
    en: to hang out
