schema: kabar.lesson/v1
id: j1.u05.l02
language: jv
title: Koen lan awakmu
can_do:
  ar_eg: تتعرّف على كلمات لهجة سورابايا (Arek).
  ar: أن تتعرّف على ألفاظ لهجة سورابايا (Arek).
  en: Recognise Arek forms.
slides:
  - title: Arek Suroboyo
    body:
      ar_eg: |
        سورابايا بتتكلم جاوي شرق جاوة اسمه **Arek** (من arek = ولد / ابن البلد؛ Arek Suroboyo = ولاد سورابايا). كلام سريع، مباشر، ومن غير كلفة.
        زي الفرق بين لهجة إسكندرية أو الصعيد ولهجة القاهرة: نفس اللغة، بس كام كلمة مختلفة.
        أول كلمة: **koen** (في الشات kon) أو **awakmu** = kowe (إنت) = kamu.
        وجملة الـ SPEC المشهورة: «Koen wis mangan ta, rek?» = كلت ولا إيه يا صاحبي؟ وبالنغوكو العادي: «Kowe wis mangan to?»
      ar: |
        تتكلم سورابايا جاوية شرق جاوة المسماة **Arek** (من arek = الولد / ابن البلد؛ Arek Suroboyo = أبناء سورابايا)، وهي سريعة مباشرة بلا تكلّف.
        كالفرق بين لهجة الإسكندرية أو الصعيد ولهجة القاهرة: لغة واحدة وبعض الألفاظ مختلفة.
        أولها **koen** (في الدردشة kon) أو **awakmu** = kowe (أنت) = kamu.
        والجملة المشهورة: «Koen wis mangan ta, rek?» = هل أكلتَ يا صاح؟ وبالنغوكو القياسي: «Kowe wis mangan to?»
      en: |
        Surabaya speaks East Javanese called **Arek** (from arek = kid / local guy; Arek Suroboyo = Surabaya folks). Fast, direct, no fuss.
        Think Alexandrian or Saidi versus Cairene Arabic: same language, a handful of different words.
        First word: **koen** (chat: kon) or **awakmu** = kowe (you) = kamu.
        The famous line: "Koen wis mangan ta, rek?" = You've eaten, right, mate? In standard ngoko: "Kowe wis mangan to?"
    grammar: jv.dialect.arek
    examples:
      - text: Koen wis mangan ta, rek?
        ar_eg: كلت ولا إيه يا صاحبي؟ (Arek)
        ar: هل أكلتَ يا صاح؟ (Arek)
        en: You've eaten, right, mate? (Arek)
      - text: Kowe wis mangan to?
        ar_eg: إنت كلت، مش كده؟ (النغوكو العادي)
        ar: لقد أكلت، أليس كذلك؟ (النغوكو القياسي)
        en: You've eaten, right? (standard ngoko)
  - title: gak, onok, kate, wes
    body:
      ar_eg: |
        كل كلمة Arek ليها «توأم» في النغوكو العادي (ماتارامان: سولو ويوجيا):
        - gak = ora (مش) — من الدرس اللي فات.
        - **onok** = ana (فيه) = ada. gak onok = ora ana = مفيش.
        - **kate** = arep (هـ / ناوي) = mau / akan. Kate nang endi? = رايح فين؟
        - wes = wis (خلاص) = sudah.
        - **teko** = saka (من) = dari: Aku teko Mesir = أنا من مصر. (teko معناها كمان «جه»، والسياق بيفرّق.)
      ar: |
        لكل لفظ Arek نظير في النغوكو القياسي (ماتارامان: سولو ويوجيا):
        - gak = ora (لا / ليس)، من الدرس السابق.
        - **onok** = ana (يوجد) = ada، وgak onok = ora ana = لا يوجد.
        - **kate** = arep (سوف / ينوي) = mau / akan: Kate nang endi? = إلى أين؟
        - wes = wis (قد / انتهى) = sudah.
        - **teko** = saka (من) = dari: Aku teko Mesir = أنا من مصر. (وتأتي teko أيضًا بمعنى «جاء»، والسياق يفرّق.)
      en: |
        Every Arek word has a standard ngoko twin (Mataraman: Solo, Yogya):
        - gak = ora (not), from last lesson.
        - **onok** = ana (there is) = ada. gak onok = ora ana = there isn't.
        - **kate** = arep (going to) = mau / akan. Kate nang endi? = Where are you off to?
        - wes = wis (already) = sudah.
        - **teko** = saka (from) = dari: Aku teko Mesir = I'm from Egypt. (teko also means "come"; context decides.)
    grammar: jv.dialect.arek
    examples:
      - text: Gak onok, rek.
        ar_eg: 'مفيش يا جماعة. (Arek) — العادي: Ora ana.'
        ar: 'لا يوجد يا جماعة. (Arek) — القياسي: Ora ana.'
        en: 'There isn''t any, guys. (Arek) — standard: Ora ana.'
      - text: Kate nang endi, Cak?
        ar_eg: 'رايح فين يا معلم؟ (Arek) — العادي: Arep neng ngendi, Mas?'
        ar: 'إلى أين يا أخي؟ (Arek) — القياسي: Arep neng ngendi, Mas?'
        en: 'Where are you off to, brother? (Arek) — standard: Arep neng ngendi, Mas?'
  - title: Yok opo? Lapo?
    body:
      ar_eg: |
        كلمتين سؤال بتوع سورابايا:
        - **yok opo** (في الشات yaopo) = piye = bagaimana = إزاي. Yok opo kabare? = أخبارك إيه؟
        - **lapo** = ngapa = kenapa / ngapain = ليه / بتعمل إيه. Lapo koen? = مالك؟ / بتعمل إيه؟
        وافتكر إن Arek بتنطق a في آخر الكلمة o وبتكتبها كده: opo = apa، sopo = sapa، piro = pira.
      ar: |
        أداتا استفهام من سورابايا:
        - **yok opo** (في الدردشة yaopo) = piye = bagaimana = كيف: Yok opo kabare? = كيف حالك؟
        - **lapo** = ngapa = kenapa / ngapain = لماذا / ماذا تفعل: Lapo koen? = ما بك؟ / ماذا تفعل؟
        وتذكّر أن الألف الأخيرة تُنطق o وتُكتب كذلك: opo = apa، sopo = sapa، piro = pira.
      en: |
        Two Surabaya question words:
        - **yok opo** (chat: yaopo) = piye = bagaimana = how. Yok opo kabare? = How are you?
        - **lapo** = ngapa = kenapa / ngapain = why / what are you doing. Lapo koen? = What's up with you? / What are you doing?
        Remember final a is said and typed o: opo = apa, sopo = sapa, piro = pira.
    grammar: jv.dialect.arek
    examples:
      - text: Yok opo kabare?
        ar_eg: 'أخبارك إيه؟ (Arek) — العادي: Piye kabare?'
        ar: 'كيف حالك؟ (Arek) — القياسي: Piye kabare?'
        en: 'How are you? (Arek) — standard: Piye kabare?'
      - text: Lapo koen gak mangan?
        ar_eg: 'مابتاكلش ليه؟ (Arek) — العادي: Ngapa kowe ora mangan?'
        ar: 'لماذا لا تأكل؟ (Arek) — القياسي: Ngapa kowe ora mangan?'
        en: 'Why aren''t you eating? (Arek) — standard: Ngapa kowe ora mangan?'
  - title: ae, ta, rek, cak, ning · Koen, kowe, sampeyan
    body:
      ar_eg: |
        والبهارات اللي بتعرّفك إن اللي قدامك من سورابايا:
        - **ae** = wae = saja = بس: Teh ae = شاي بس.
        - **ta** = to = kan? = مش كده؟ (في آخر الجملة).
        - **rek** = يا جماعة / يا صاحبي، **cak** = mas، **ning** = mbak.
        علامة سريعة: ta وae ⇐ سورابايا. to وwae ⇐ وسط جاوة.
        koen للصحاب بس، زي «إنت» مع واحد من سنك. مع حد أكبر منك، حتى في سورابايا، بيقولوا **sampeyan** (حضرتك العادية) أو Pak / Bu.
        والجاوي بيغيّر كلمات كاملة، مش الضمير بس. بص «إنت كلت؟» بتلات مستويات:
        - ngoko (≈ إنت): Kowe wis mangan?
        - krama (≈ حضرتك): Sampeyan sampun nedha?
        - krama inggil (≈ سيادتك): Panjenengan sampun dhahar?
        مش مطلوب تحفظ الاتنين التانيين دلوقتي؛ هنتعلمهم في سولو (J3). المهم تعرف إن koen مش لأي حد.
      ar: |
        وهذه «توابل» تكشف أن المتكلم من سورابايا:
        - **ae** = wae = saja = فقط: Teh ae = شاي فقط.
        - **ta** = to = kan? = أليس كذلك؟ في آخر الجملة.
        - **rek** = يا جماعة / يا صاح، و**cak** = mas، و**ning** = mbak.
        علامة سريعة: ta وae ⇐ سورابايا، وto وwae ⇐ وسط جاوة.
        koen للأقران فقط، كـ«أنت» مع من في سنك. ومع الأكبر يقال حتى في سورابايا **sampeyan** (حضرتك) أو Pak / Bu.
        والجاوية تبدّل ألفاظًا كاملة لا الضمير وحده. انظر «هل أكلت؟» في ثلاثة مستويات:
        - ngoko (≈ أنت): Kowe wis mangan?
        - krama (≈ حضرتك): Sampeyan sampun nedha?
        - krama inggil (≈ سيادتك): Panjenengan sampun dhahar?
        لا يلزم حفظ الأخيرتين الآن، فسنتعلمهما في سولو (J3)؛ المهم أن koen ليست لكل أحد.
      en: |
        And the spices that tell you someone is from Surabaya:
        - **ae** = wae = saja = just: Teh ae = Just tea.
        - **ta** = to = kan? = right? (at the end).
        - **rek** = guys / mate, **cak** = mas, **ning** = mbak.
        Quick tell: ta and ae ⇒ Surabaya; to and wae ⇒ Central Java.
        koen is for friends only, like a casual "you" with people your age. With anyone older, even in Surabaya, people say **sampeyan** (polite everyday you) or Pak / Bu.
        Javanese swaps whole words, not just the pronoun. Here's "Have you eaten?" at three levels:
        - ngoko (≈ إنت): Kowe wis mangan?
        - krama (≈ حضرتك): Sampeyan sampun nedha?
        - krama inggil (≈ سيادتك): Panjenengan sampun dhahar?
        No need to learn the last two yet; they come in Solo (J3). Just know koen isn't for everyone.
    grammar: jv.dialect.arek
    examples:
      - text: Ayo, rek!
        ar_eg: يلا يا جماعة!
        ar: هيا يا جماعة!
        en: Come on, guys!
      - text: Kopi ae, Ning.
        ar_eg: قهوة بس يا آنسة. (Arek)
        ar: قهوة فقط يا آنسة. (Arek)
        en: Just coffee, Ning. (Arek)
      - text: Sampeyan wis mangan, Pak?
        ar_eg: حضرتك كلت يا حاج؟ (سورابايا، مؤدب في الكلام اليومي)
        ar: هل أكلتَ يا سيدي؟ (سورابايا، مهذب يومي)
        en: Have you eaten, sir? (Surabaya, everyday polite)
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: koen
        ar_eg: إنت (= kowe)
        ar: أنت (= kowe)
        en: you (= kowe)
      - text: gak
        ar_eg: مش (= ora)
        ar: لا / ليس (= ora)
        en: not (= ora)
      - text: onok
        ar_eg: فيه (= ana)
        ar: يوجد (= ana)
        en: there is (= ana)
      - text: kate
        ar_eg: هـ / ناوي (= arep)
        ar: سوف (= arep)
        en: going to (= arep)
      - text: yok opo
        ar_eg: إزاي (= piye)
        ar: كيف (= piye)
        en: how (= piye)
    words: [koen, gak, onok, kate, yok opo]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: قابلت جد صاحبك في سورابايا. تقوله «إنت» إزاي؟
      ar: قابلت جدّ صديقك في سورابايا. بأيّ لفظ تخاطبه؟
      en: You meet your friend's grandfather in Surabaya. Which "you" fits?
    options: [koen, sampeyan, awakmu]
    answer: 1
    explain:
      ar_eg: koen وawakmu للصحاب بس. للكبير sampeyan (أو Pak / Mbah).
      ar: koen وawakmu للأقران، وللكبير sampeyan.
      en: koen and awakmu are for friends; an older person gets sampeyan.
    words: [sampeyan, koen, awakmu]
  - id: e03
    type: listen
    text: Yok opo kabare?
    options: ['Yok opo kabare?', 'Piye kabare?', 'Lapo koen?']
    answer: 0
    words: [yok opo, kabar]
  - id: e04
    type: fill_blank
    sentence: ___ kabare, rek?
    meaning:
      ar_eg: أخباركم إيه يا جماعة؟ (Arek)
      ar: كيف حالكم يا جماعة؟ (Arek)
      en: How are you, guys? (Arek)
    options: [Lapo, Yok opo, Kate]
    answers: [Yok opo]
    explain:
      ar_eg: yok opo = piye (إزاي). lapo = ليه، kate = هـ.
      ar: yok opo = piye (كيف)، أما lapo فلماذا، وkate سوف.
      en: yok opo = piye (how). lapo = why, kate = going to.
    words: [yok opo]
  - id: e05
    type: build_sentence
    source:
      ar_eg: رايح فين يا معلم؟ (Arek)
      ar: إلى أين يا أخي؟ (Arek)
      en: Where are you off to, brother? (Arek)
    answer: Kate nang endi, Cak?
    distractors: [sapa, onok]
    words: [kate, nang, endi, cak]
  - id: e06
    type: speaking
    text: Yok opo kabare, rek?
    meaning:
      ar_eg: أخباركم إيه يا جماعة؟
      ar: كيف حالكم يا جماعة؟
      en: How are you, guys?
    words: [yok opo, rek]
dialogue:
  title: Nang Kenjeran
  lines:
    - speaker: Cak Heru
      text: Yok opo kabare, Mohamed?
      ar_eg: أخبارك إيه يا محمد؟
      ar: كيف حالك يا محمد؟
      en: How are you, Mohamed?
    - speaker: Mohamed
      text: Apik, Cak. Koen kate nang endi?
      ar_eg: كويس يا معلم. إنت رايح فين؟
      ar: بخير يا أخي. إلى أين أنت ذاهب؟
      en: Good, Cak. Where are you off to?
    - speaker: Cak Heru
      text: Nang warung. Koen wis mangan ta, rek?
      ar_eg: على المحل. إنت كلت ولا إيه يا صاحبي؟
      ar: إلى المطعم الصغير. هل أكلتَ يا صاح؟
      en: To the warung. You've eaten, right, mate?
    - speaker: Mohamed
      text: Durung, Cak.
      ar_eg: لسه يا معلم.
      ar: ليس بعد يا أخي.
      en: Not yet, Cak.
    - speaker: Cak Heru
      text: Lho, lapo durung? Ayo, rek!
      ar_eg: إيه ده، لسه ليه؟ يلا يا صاحبي!
      ar: ماذا؟ لماذا لم تأكل بعد؟ هيا يا صاح!
      en: What? Why not yet? Come on, mate!
new_words:
  - word: awakmu
    pos: pronoun
    ar_eg: إنت (Arek، = kowe)
    ar: أنت (Arek، = kowe)
    en: you (Arek, = kowe)
  - word: onok
    pos: verb
    ar_eg: فيه (Arek، = ana / ada)
    ar: يوجد (Arek، = ana / ada)
    en: there is (Arek, = ana / ada)
  - word: kate
    pos: adverb
    ar_eg: هـ / ناوي (Arek، = arep)
    ar: سوف / ينوي (Arek، = arep)
    en: going to (Arek, = arep)
  - word: teko
    pos: preposition
    ar_eg: من (Arek، = saka / dari)؛ وكمان «جه»
    ar: من (Arek، = saka / dari)؛ وتأتي بمعنى «جاء» أيضًا
    en: from (Arek, = saka / dari); also "come"
  - word: sampeyan
    pos: pronoun
    ar_eg: حضرتك (مؤدب في الكلام اليومي، للكبار والغُرب)
    ar: حضرتك (مهذب يومي، للكبار والغرباء)
    en: you (polite everyday, for elders and strangers)
