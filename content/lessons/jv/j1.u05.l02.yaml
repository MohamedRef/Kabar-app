  - id: e02
    type: multiple_choice
    question: Koen wis mangan ta, rek?
    question_meaning:
      ar_eg: أنهي جملة هي نفس المعنى بالنغوكو العادي؟
      ar: أيّ جملة تؤدي المعنى نفسه بالنغوكو القياسي؟
      en: Which sentence says the same in standard ngoko?
    options: ["Kowé durung mangan to?", "Kowé wis mangan to?", "Aku wis mangan to?"]
    answer: 1
    explain:
      ar_eg: koen = kowé، وta = to. وwis فضلت زي ما هي.
      ar: koen = kowé، وta = to، وwis كما هي.
      en: koen = kowé and ta = to; wis stays.
    words: [koen, ta]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: قابلت جد صاحبك في سورابايا. تقوله «إنت» إزاي؟
      ar: قابلت جدّ صديقك في سورابايا. بأيّ لفظ تخاطبه؟
      en: You meet your friend's grandfather in Surabaya. Which "you" fits?
    options: ["koen", "sampéyan", "awakmu"]
    answer: 1
    explain:
      ar_eg: koen وawakmu للصحاب بس. للكبير sampéyan (أو Pak / Mbah).
      ar: koen وawakmu للأقران، وللكبير sampéyan.
      en: koen and awakmu are for friends; an older person gets sampéyan.
    words: [sampéyan, koen, awakmu]
