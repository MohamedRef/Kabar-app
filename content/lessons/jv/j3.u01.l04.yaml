  - id: e03
    type: listen
    text: Sedherek kula tiyang Kairo.
    question:
      ar_eg: مين اللي من القاهرة؟
      ar: من هم أهل القاهرة؟
      en: Who is from Cairo?
    options: [جيراني, قرايبي, تلامذتي]
    answer: 1
    meaning:
      ar_eg: قرايبي من القاهرة.
      ar: أقاربي من القاهرة.
      en: My relatives are from Cairo.
    words: [sedherek]
  - id: e04
    type: fill_blank
    sentence: Kula ___ sanget saged pinanggih panjenengan.
    meaning:
      ar_eg: أنا ___ أوي إني قابلت حضرتك.
      ar: أنا ___ جدًا بلقائك.
      en: I'm so ___ to meet you.
    options: [bungah, ajrih, kuwatir]
    answers: [bungah]
    words: [bungah, ajrih, kuwatir, pinanggih]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيتعلّم في المدرسة؟
      ar: من يتعلّم في المدرسة؟
      en: Who learns at school?
    options: [tanggi, sedherek, murid]
    answer: 2
    explain:
      ar_eg: murid = تلميذ.
      ar: murid = تلميذ.
      en: murid = pupil.
    words: [tanggi, sedherek, murid]
  - id: e06
    type: fill_blank
    sentence: Lare menika ___ kaliyan dokter.
    meaning:
      ar_eg: العيل ده ___ من الدكتور.
      ar: هذا الطفل ___ من الطبيب.
      en: This child is ___ of the doctor.
    options: [ajrih, bungah, murid]
    answers: [ajrih]
    words: [ajrih, lare, bungah]
  - id: e07
    type: build_sentence
    source:
      ar_eg: عيال جاري تلامذة.
      ar: أطفال جاري تلاميذ.
      en: My neighbour's children are pupils.
    answer: Lare-lare tanggi kula murid.
    distractors: [sedherek, ajrih]
    words: [lare, tanggi, murid]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ibu kuwatir, lare dereng dhateng.
    answers_meaning:
      ar_eg: [الأم قلقانة، العيل لسه ما جاش, ماما قلقانة عشان العيل لسه ما وصلش]
      ar: [الأم قلقة، فالطفل لم يأتِ بعد, الأم قلقة لأن الطفل لم يصل بعد]
      en: ['Mum is worried, the child hasn''t come yet', 'The mother is worried; the child hasn''t arrived yet']
    words: [kuwatir, lare]
  - id: e09
    type: speaking
    text: Bungah sanget saged pinanggih, Pak.
    meaning:
      ar_eg: مبسوط أوي إني قابلتك يا عم.
      ar: سعيد جدًا بلقائك يا سيدي.
      en: So glad to meet you, sir.
    words: [bungah, pinanggih]
  - id: e10
    type: multiple_choice
    question: Wingi kula ___ tanggi kula ing peken.
    options: [sedherek, ajrih, pinanggih]
    answer: 2
    explain:
      ar_eg: pinanggih = يقابل بالكراما (ketemu في الـ ngoko).
      ar: pinanggih = يلتقي بالكراما (ketemu في الـ ngoko).
      en: pinanggih = meet in krama (ngoko ketemu).
    words: [pinanggih, tanggi, sedherek, ajrih]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, iki tanggaku, Bu Parmi.
      ar_eg: يا محمد، دي جارتنا، طنط بارمي.
      ar: يا محمد، هذه جارتي، السيدة بارمي.
      en: Mohamed, this is my neighbour, Bu Parmi.
    - speaker: Mohamed
      text: "Sugeng siang, Bu. Bungah sanget saged pinanggih."
      ar_eg: "نهارك سعيد يا طنط. مبسوط أوي إني قابلتك."
      ar: "طاب نهارك يا سيدتي. سعيد جدًا بلقائك."
      en: "Good afternoon, ma'am. So glad to meet you."
    - speaker: Bu Parmi
      text: "Monggo pinarak, Mas. Niki lare-lare kula."
      ar_eg: "اتفضل اقعد يا أستاذ. دول عيالي."
      ar: "تفضّل اجلس. هؤلاء أطفالي."
      en: "Come in and sit, Mas. These are my kids."
    - speaker: Mohamed
      text: Lare-lare taksih murid, Bu?
      ar_eg: العيال لسه تلامذة يا طنط؟
      ar: هل الأطفال ما زالوا تلاميذ؟
      en: Are the children still at school?
    - speaker: Bu Parmi
      text: "Nggih. Sing alit taksih ajrih, lho."
      ar_eg: "أيوه. الصغير لسه خايف شوية."
      ar: "نعم. الصغير ما زال خائفًا قليلًا."
      en: "Yes. The little one's still a bit scared, see."
    - speaker: Mohamed
      text: Mboten menapa-menapa. Kula ugi kuwatir, basa Jawi kula dereng sae.
      ar_eg: ولا يهمك. أنا كمان قلقان، الجاوي بتاعي لسه مش كويس.
      ar: لا بأس. أنا أيضًا قلق، فجاويتي ليست جيدة بعد.
      en: 'That''s fine. I''m worried too: my Javanese isn''t good yet.'
new_words:
  - word: tanggi
    pos: noun
    ar_eg: جار (tangga ← tanggi)، كراما
    ar: جار (tangga ← tanggi)، كراما
    en: neighbour (ngoko tangga, Indonesian tetangga), krama
  - word: lare
    pos: noun
    ar_eg: عيل، طفل (bocah ← lare)، كراما
    ar: طفل (bocah ← lare)، كراما
    en: child (ngoko bocah, Indonesian anak), krama
  - word: sedherek
    pos: noun
    ar_eg: قريب، أخ أو أخت (sedulur ← sedherek)، كراما
    ar: قريب، أخ أو أخت (sedulur ← sedherek)، كراما
    en: relative, sibling (ngoko sedulur, Indonesian saudara), krama
  - word: pinanggih
    pos: verb
    ar_eg: يقابل (ketemu ← pinanggih)، كراما
    ar: يلتقي (ketemu ← pinanggih)، كراما
    en: meet (ngoko ketemu, Indonesian bertemu), krama
  - word: bungah
    pos: adjective
    ar_eg: مبسوط، فرحان
    ar: سعيد، فرِح
    en: glad, happy (= senang)
  - word: kuwatir
    pos: adjective
    ar_eg: قلقان
    ar: قلق
    en: worried (= khawatir)
  - word: murid
    pos: noun
    ar_eg: تلميذ
    ar: تلميذ
    en: pupil, student (= murid)
  - word: ajrih
    pos: adjective
    ar_eg: خايف (wedi ← ajrih)، كراما
    ar: خائف (wedi ← ajrih)، كراما
    en: afraid (ngoko wedi, Indonesian takut), krama
