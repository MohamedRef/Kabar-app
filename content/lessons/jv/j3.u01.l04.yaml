schema: kabar.lesson/v1
id: j3.u01.l04
language: jv
title: Kula nuwun, Mbah
can_do:
  ar_eg: 'توصل بيت تيتة صاحبك: تستأذن على الباب، تفهم «أهلًا بيك» و«يا ابني»، وتقول لسه وتقدر، وتاكل تمبيه.'
  ar: 'أن تصل إلى بيت جدّة صديقك: تستأذن عند الباب، وتفهم «أهلًا بك» و«يا بنيّ»، وتقول ما زال ويستطيع، وتأكل التمبيه.'
  en: 'Arrive at a friend''s grandmother''s house: call at the door, understand "welcome" and "dear", say still and can, and eat tempe.'
slides:
  - title: Ing ngajeng kori
    body:
      ar_eg: |
        kula nuwun = بتقولها على باب أي بيت قبل ما تدخل (زي «يا أهل الدار»). الرد: «Mangga!» = اتفضل.
        sugeng rawuh = أهلًا بيك، نوّرت.
        nak = يا ابني / يا بنتي: الكبار بينادوا بيها الصغيرين (من anak).
        isih ← taksih = لسه. isa ← saged = يقدر.
        iki ← niki = ده (كراما الشارع؛ الرسمي menika). wong ← tiyang = شخص، ناس.
        tempe = تمبيه، أشهر أكلة في جاوة.
      ar: |
        kula nuwun = تقال عند باب أي بيت قبل الدخول (مثل «يا أهل الدار»). والرد: «Mangga!» = تفضّل.
        sugeng rawuh = أهلًا بك، مرحبًا.
        nak = يا بنيّ / يا بنيّتي: ينادي بها الكبار الصغار (من anak).
        isih ← taksih = ما زال. isa ← saged = يستطيع.
        iki ← niki = هذا (كراما الكلام؛ والرسمية menika). wong ← tiyang = شخص، ناس.
        tempe = التمبيه، أشهر أكلة في جاوة.
      en: |
        kula nuwun = what you call at anyone's door before going in. The answer: "Mangga!" = come in.
        sugeng rawuh = welcome.
        nak = dear (to a younger person): how elders address you (from anak).
        isih → taksih = still. isa → saged = can, be able.
        iki → niki = this (spoken krama; formal menika). wong → tiyang = person, people.
        tempe = tempe, Java's best-known food.
    examples:
      - text: Kula nuwun! — Mangga, Nak. Sugeng rawuh!
        ar_eg: يا أهل البيت! — اتفضل يا ابني. أهلًا بيك!
        ar: هل من أحد؟ — تفضّل يا بنيّ. أهلًا بك!
        en: Hello, anyone home? — Come in, dear. Welcome!
      - text: Kula taksih sinau, dereng saged krama.
        ar_eg: أنا لسه بتعلّم، لسه مش عارف كراما.
        ar: ما زلت أتعلّم، ولا أستطيع الكراما بعد.
        en: I'm still learning, I can't do krama yet.
      - text: Niki tempe goreng, Nak.
        ar_eg: ده تمبيه مقلي يا ابني.
        ar: هذا تمبيه مقلي يا بنيّ.
        en: Here's some fried tempe, dear.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kula nuwun
        ar_eg: يا أهل البيت (على الباب)
        ar: هل من أحد؟ (عند الباب)
        en: hello, anyone home? (at the door)
      - text: sugeng rawuh
        ar_eg: أهلًا بيك
        ar: أهلًا بك
        en: welcome
      - text: nak
        ar_eg: يا ابني / يا بنتي
        ar: يا بنيّ / يا بنيّتي
        en: dear (to a younger person)
      - text: taksih
        ar_eg: لسه (كراما)
        ar: ما زال (كراما)
        en: still (krama)
    words: [kula nuwun, sugeng rawuh, nak, taksih]
  - id: e02
    type: match_pairs
    pairs:
      - text: saged
        ar_eg: يقدر (كراما)
        ar: يستطيع (كراما)
        en: can (krama)
      - text: niki
        ar_eg: ده (كراما)
        ar: هذا (كراما)
        en: this (krama)
      - text: tiyang
        ar_eg: شخص، ناس (كراما)
        ar: شخص، ناس (كراما)
        en: person, people (krama)
      - text: tempe
        ar_eg: تمبيه
        ar: تمبيه
        en: tempe
    words: [saged, niki, tiyang, tempe]
  - id: e03
    type: listen
    text: Kula nuwun!
    question:
      ar_eg: محمد بيعمل إيه؟
      ar: ماذا يفعل محمد؟
      en: What is Mohamed doing?
    options: [بيستأذن على الباب, بيقول مع السلامة, بيشكر حد]
    answer: 0
    meaning:
      ar_eg: يا أهل البيت!
      ar: هل من أحد في البيت؟
      en: Hello, anyone home?
    words: [kula nuwun, sugeng rawuh]
  - id: e04
    type: fill_blank
    sentence: Kula ___ sinau krama, Mbah.
    meaning:
      ar_eg: أنا ___ بتعلّم كراما يا تيتة.
      ar: أنا ___ أتعلّم الكراما يا جدّة.
      en: I'm ___ learning krama, Grandma.
    options: [taksih, saged, niki]
    answers: [taksih]
    words: [taksih, saged, niki]
    explain:
      ar_eg: taksih = لسه، زي «لسه بتعلّم». saged = يقدر، وniki = ده.
      ar: taksih تعني ما زال، كما في «ما زلت أتعلّم». أما saged فيستطيع، وniki هذا.
      en: taksih is "still", as in "still learning". saged is "can", and niki is "this".
  - id: e05
    type: multiple_choice
    question: isa (ngoko) → ___ (krama)
    options: [saged, taksih, tiyang]
    answer: 0
    explain:
      ar_eg: 'isa بالنغوكو، saged بالكراما: يقدر. taksih = لسه، tiyang = شخص.'
      ar: 'isa بالنغوكو وsaged بالكراما: يستطيع. taksih = ما زال، tiyang = شخص.'
      en: 'isa is ngoko, saged is krama: can. taksih = still, tiyang = person.'
    words: [saged, taksih, tiyang]
  - id: e06
    type: fill_blank
    sentence: Mangga, Nak. ___!
    meaning:
      ar_eg: اتفضل يا ابني. ___!
      ar: تفضّل يا بنيّ. ___!
      en: Come in, dear. ___!
    options: [Sugeng rawuh, Kula nuwun, Matur nuwun]
    answers: [Sugeng rawuh]
    words: [sugeng rawuh, kula nuwun, nak]
    explain:
      ar_eg: صاحب البيت بيرد بـ Sugeng rawuh = أهلًا بيك. Kula nuwun بيقولها الضيف على الباب، وMatur nuwun = شكرًا.
      ar: صاحب البيت يرد بـ Sugeng rawuh أي أهلًا بك. أما Kula nuwun فيقولها الضيف عند الباب، وMatur nuwun تعني شكرًا.
      en: The host answers Sugeng rawuh, "welcome". Kula nuwun is what the guest calls at the door, and Matur nuwun is "thank you".
  - id: e07
    type: build_sentence
    source:
      ar_eg: ده تمبيه مقلي يا ابني.
      ar: هذا تمبيه مقلي يا بنيّ.
      en: Here's some fried tempe, dear.
    answer: Niki tempe goreng, Nak
    distractors: [tiyang, saged]
    words: [niki, tempe, nak]
    explain:
      ar_eg: niki = ده، وnak في الآخر = يا ابني. tiyang = شخص وsaged = يقدر، ومش في الجملة.
      ar: niki تعني هذا، وnak في الآخر يا بنيّ. أما tiyang فشخص وsaged يستطيع، وليستا في الجملة.
      en: niki is "this", and nak at the end is "dear". tiyang (person) and saged (can) aren't in the sentence.
  - id: e08
    type: translate
    direction: from_target
    source_text: Mbah Putri tiyang Jogja.
    answers_meaning:
      ar_eg: [تيتة بوتري من جوجا, تيتة بوتري جوجاوية]
      ar: [الجدّة بوتري من جوكجاكرتا, الجدّة بوتري من أهل جوكجاكرتا]
      en: [Mbah Putri is from Jogja, Mbah Putri is a Jogja person]
    words: [tiyang]
  - id: e09
    type: speaking
    text: Kula dereng saged krama.
    meaning:
      ar_eg: أنا لسه مش عارف أتكلم كراما.
      ar: لا أستطيع الكراما بعد.
      en: I can't speak krama yet.
    words: [saged]
  - id: e10
    type: multiple_choice
    question: wong (ngoko) → ___ (krama)
    options: [tiyang, niki, tempe]
    answer: 0
    explain:
      ar_eg: 'wong بالنغوكو، tiyang بالكراما: شخص، ناس. niki = ده.'
      ar: 'wong بالنغوكو وtiyang بالكراما: شخص، ناس. niki = هذا.'
      en: 'wong is ngoko, tiyang is krama: person. niki = this.'
    words: [tiyang, niki, tempe, nak]
dialogue:
  lines:
    - speaker: Mohamed
      text: Kula nuwun!
      ar_eg: يا أهل البيت!
      ar: هل من أحد؟
      en: Hello, anyone home?
    - speaker: Mbah Putri
      text: Mangga, Nak. Sugeng rawuh!
      ar_eg: اتفضل يا ابني. أهلًا بيك!
      ar: تفضّل يا بنيّ. أهلًا بك!
      en: Come in, dear. Welcome!
    - speaker: Mohamed
      text: Matur nuwun, Mbah. Kula Mohamed, kancanipun Dimas.
      ar_eg: متشكر يا تيتة. أنا محمد، صاحب ديماس.
      ar: شكرًا يا جدّة. أنا محمد، صديق ديماس.
      en: Thank you, Grandma. I'm Mohamed, Dimas's friend.
    - speaker: Mbah Putri
      text: Oh, niki Nak Mohamed. Sampun nedha, Nak?
      ar_eg: آه، ده محمد. كلت يا ابني؟
      ar: آه، هذا محمد. هل أكلت يا بنيّ؟
      en: Oh, so this is Mohamed. Have you eaten, dear?
    - speaker: Mohamed
      text: Dereng, Mbah. Kula taksih sinau krama, dereng saged.
      ar_eg: لسه يا تيتة. أنا لسه بتعلّم كراما، لسه مش عارف.
      ar: ليس بعد يا جدّة. ما زلت أتعلّم الكراما، ولا أستطيع بعد.
      en: Not yet, Grandma. I'm still learning krama, I can't do it yet.
    - speaker: Mbah Putri
      text: Nggih, Nak. Mangga, niki tempe goreng.
      ar_eg: ماشي يا ابني. اتفضل، ده تمبيه مقلي.
      ar: حسنًا يا بنيّ. تفضّل، هذا تمبيه مقلي.
      en: All right, dear. Here, have some fried tempe.
