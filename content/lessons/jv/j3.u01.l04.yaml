        ar: طفل (كراما)
        en: child (krama)
      - text: sedherek
        ar_eg: قريب (كراما)
        ar: قريب (كراما)
        en: relative (krama)
      - text: pinanggih
        ar_eg: يقابل (كراما)
        ar: يلتقي (كراما)
        en: meet (krama)
    words: [tanggi, lare, sedherek, pinanggih]
  - id: e02
