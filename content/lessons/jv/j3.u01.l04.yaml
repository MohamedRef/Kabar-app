schema: kabar.lesson/v1
id: j3.u01.l04
language: jv
title: Respect Meter
can_do:
  ar_eg: تختار المستوى المناسب في خمس مواقف (محاكي الأدب، نسخة خفيفة).
  ar: أن تختار المستوى المناسب في خمسة مواقف (محاكي الأدب، نسخة مبسطة).
  en: Pick a level for five situations (Unggah-Ungguh Simulator, lite).
slides:
  - title: Respect Meter
    body:
      ar_eg: |
        النهارده هتلف في سولو وتقابل خمس ناس. قبل ما تتكلم، بص على «عدّاد الاحترام»:
        - صاحبك أو حد أصغر منك ← ngoko: Kowé wis mangan?
        - بياع أو حد غريب ← krama: Sampéyan sampun nedha?
        - جدة صاحبك أو المدرس ← krama inggil: Panjenengan sampun dhahar?
        وعن نفسك دايمًا krama عادية: Kula sampun nedha.
      ar: |
        ستتجول اليوم في سولو وتلقى خمسة أشخاص. قبل الكلام انظر إلى «مقياس الاحترام»:
        - الصديق أو الأصغر ← ngoko: Kowé wis mangan?
        - البائع أو الغريب ← krama: Sampéyan sampun nedha?
        - جدة الصديق أو المعلم ← krama inggil: Panjenengan sampun dhahar?
        وعن نفسك دائمًا krama عادية: Kula sampun nedha.
      en: |
        Today you walk around Solo and meet five people. Before you speak, check the Respect Meter:
        - a friend or someone younger → ngoko: Kowé wis mangan?
        - a seller or a stranger → krama: Sampéyan sampun nedha?
        - a friend's grandmother or a teacher → krama inggil: Panjenengan sampun dhahar?
        About yourself, always plain krama: Kula sampun nedha.
    grammar: jv.speechlevel.overview
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: 'الموقف ١: صاحبك Mas Dimas مستنيك في المحطة. تسأله «كلت؟» إزاي؟'
      ar: 'الموقف ١: صديقك Mas Dimas ينتظرك في المحطة. كيف تسأله «هل أكلت؟»'
      en: 'Situation 1: your friend Mas Dimas is waiting at the station. How do you ask "Have you eaten?"'
    options: ['Sampéyan sampun nedha, Mas?', 'Panjenengan sampun dhahar, Mas?', 'Kowé wis mangan, Mas?']
    answer: 2
    explain:
      ar_eg: 'Dimas صاحبك: ngoko. الكراما مع صاحبك هتبان بعيدة وباردة.'
      ar: Dimas صديقك فتكلمه بالـ ngoko، والكراما مع الصديق تبدو جافة بعيدة.
      en: Dimas is your friend, so ngoko. Krama with a friend sounds distant.
    words: [kowé, wis, mangan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: 'الموقف ٢: Bu Siti، بياعة في كشك جنب المحطة. أنهي مستوى؟'
      ar: 'الموقف ٢: Bu Siti، بائعة في كشك قرب المحطة. أيّ مستوى؟'
      en: 'Situation 2: Bu Siti, a seller at a stall by the station. Which level?'
    options: [krama, ngoko, krama andhap]
    answer: 0
    explain:
      ar_eg: 'البياع ياخد krama: sampéyan، sampun، nedha.'
      ar: 'البائع يُخاطب بالـ krama: sampéyan وsampun وnedha.'
      en: A seller gets krama — sampéyan, sampun, nedha.
    words: [krama]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: 'الموقف ٣: جدة Dimas فتحتلك باب البيت. أنهي مستوى؟'
      ar: 'الموقف ٣: جدة Dimas فتحت لك باب البيت. أيّ مستوى؟'
      en: 'Situation 3: Dimas''s grandmother opens the door for you. Which level?'
    options: [krama inggil, ngoko, krama]
    answer: 0
    explain:
      ar_eg: 'جدة صاحبك: krama + krama inggil (panjenengan، dhahar).'
      ar: 'جدة الصديق: krama مع krama inggil (panjenengan وdhahar).'
      en: A friend's grandmother gets krama plus krama inggil (panjenengan, dhahar).
    words: [krama inggil]
  - id: e04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: حضرتك كلتي يا مدام؟ (لـ Bu Siti البياعة)
      ar: هل أكلتِ يا سيدتي؟ (لـ Bu Siti البائعة)
      en: Have you eaten, ma'am? (to Bu Siti, the seller)
    answers: ['Sampéyan sampun nedha, Bu?', 'Sampeyan sampun nedha, Bu?', 'Sampéyan sampun nedha, Bu', 'Sampeyan sampun nedha, Bu', 'Bu, sampéyan sampun nedha?', 'Bu, sampeyan sampun nedha?', 'Bu, sampéyan sampun nedha', 'Bu, sampeyan sampun nedha', 'Sampéyan sampun nedha, Bu Siti?', 'Sampeyan sampun nedha, Bu Siti?', 'Sampéyan sampun nedha, Bu Siti', 'Sampeyan sampun nedha, Bu Siti', 'Bu Siti, sampéyan sampun nedha?', 'Bu Siti, sampeyan sampun nedha?', 'Bu Siti, sampéyan sampun nedha', 'Bu Siti, sampeyan sampun nedha', 'Sampéyan sampun nedha?', 'Sampeyan sampun nedha?', Sampéyan sampun nedha, Sampeyan sampun nedha, 'Panjenengan sampun dhahar, Bu?', 'Panjenengan sampun dhahar, Bu', 'Bu, panjenengan sampun dhahar?', 'Bu, panjenengan sampun dhahar']
    explain:
      ar_eg: 'للبياعة krama: Sampéyan sampun nedha. ولو قلت panjenengan + dhahar ده أدب زيادة ومقبول برضه.'
      ar: 'للبائعة krama: Sampéyan sampun nedha، والـ panjenengan مع dhahar أدب زائد مقبول.'
      en: For a seller, krama — Sampéyan sampun nedha. Panjenengan + dhahar is extra polite and also fine.
    words: [sampéyan, sampun, nedha]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: حضرتك كلتي يا أبلة؟ (لمُدرّستك Bu Guru)
      ar: هل أكلتِ يا أستاذة؟ (لمعلمتك Bu Guru)
      en: Have you eaten, ma'am? (to your teacher, Bu Guru)
    answers: ['Panjenengan sampun dhahar, Bu?', 'Panjenengan sampun dhahar, Bu', 'Bu, panjenengan sampun dhahar?', 'Bu, panjenengan sampun dhahar', 'Panjenengan sampun dhahar, Bu Guru?', 'Panjenengan sampun dhahar, Bu Guru', 'Bu Guru, panjenengan sampun dhahar?', 'Bu Guru, panjenengan sampun dhahar', 'Panjenengan sampun dhahar?', Panjenengan sampun dhahar]
    explain:
      ar_eg: المدرس بياخد panjenengan + dhahar.
      ar: المعلم يُخاطب بـ panjenengan مع dhahar.
      en: A teacher gets panjenengan + dhahar.
    words: [panjenengan, sampun, dhahar]
  - id: e06
    type: build_sentence
    source:
      ar_eg: كلت يا حبيبي؟ (لأخو Dimas الصغير)
      ar: هل أكلت يا صغيري؟ (لأخي Dimas الصغير)
      en: Have you eaten, little one? (to Dimas's little brother)
    answer: Kowé wis mangan, Dhik?
    distractors: [sampun, nedha]
    words: [kowé, wis, mangan, dhik]
  - id: e07
    type: fill_blank
    sentence: Inggih, kula sampun ___, Mbah.
    meaning:
      ar_eg: أيوه يا تيتة، أنا كلت.
      ar: نعم يا جدتي، قد أكلتُ.
      en: Yes, Grandma, I've eaten.
    answers: [nedha]
    explain:
      ar_eg: إنت بتتكلم عن نفسك، يبقى nedha مش dhahar.
      ar: تتكلم عن نفسك فتقول nedha لا dhahar.
      en: You're talking about yourself, so nedha, not dhahar.
    words: [nedha]
  - id: e08
    type: translate
    direction: from_target
    source_text: Mbah, panjenengan sampun dhahar?
    answers_meaning:
      ar_eg: [يا تيتة، حضرتك أكلتي؟, يا تيتة، أكلتي؟, يا جدو، حضرتك أكلت؟, يا جدو، أكلت؟]
      ar: [يا جدتي، هل تفضلتِ بالأكل؟, يا جدتي، هل أكلتِ؟, يا جدي، هل أكلت؟]
      en: ['Grandma, have you eaten?', 'Grandpa, have you eaten?', 'Have you eaten, Grandma?', 'Have you eaten, Grandpa?']
    explain:
      ar_eg: Mbah ممكن تبقى جد أو جدة، فالترجمتين صح.
      ar: Mbah تصلح للجد والجدة، فالترجمتان صحيحتان.
      en: Mbah can be a grandmother or a grandfather, so both translations work.
    words: [mbah, panjenengan, dhahar]
  - id: e09
    type: dictation
    text: Sampun, Mbah.
    meaning:
      ar_eg: آه يا تيتة، خلاص (كلت).
      ar: نعم يا جدتي، قد فعلت.
      en: Yes, Grandma, I have.
    words: [sampun]
  - id: e10
    type: speaking
    text: Sampéyan sampun nedha, Bu?
    meaning:
      ar_eg: حضرتك كلتي يا مدام؟
      ar: هل أكلتِ يا سيدتي؟
      en: Have you eaten, ma'am?
    words: [sampéyan, sampun, nedha]
dialogue:
  title: Saka stasiun nang omahé Mbah
  lines:
    - speaker: Mas Dimas
      text: Ayo, Mohamed, nang omahé mbahku!
      ar_eg: يلا يا محمد، على بيت جدتي!
      ar: هيا يا محمد، إلى بيت جدتي!
      en: Come on, Mohamed, to my grandma's house!
    - speaker: Bu Siti
      text: Mas, mangga, soto!
      ar_eg: اتفضل يا أستاذ، شوربة سوتو!
      ar: تفضّل يا أخي، حساء سوتو!
      en: Please, young man — soto!
    - speaker: Mohamed
      text: Sampun, Bu. Matur nuwun.
      ar_eg: كلت خلاص يا مدام. شكرًا.
      ar: قد أكلتُ يا سيدتي. شكرًا.
      en: I've already eaten, ma'am. Thank you.
    - speaker: Mbah Putri
      text: Le, Dimas! Kowé wis mangan?
      ar_eg: يا ابني يا دِيماس! كلت؟
      ar: يا بنيّ يا ديماس! هل أكلت؟
      en: Dimas, my boy! Have you eaten?
    - speaker: Mas Dimas
      text: Sampun, Mbah. Panjenengan sampun dhahar?
      ar_eg: آه يا تيتة. وحضرتك أكلتي؟
      ar: نعم يا جدتي. وهل تفضلتِ أنتِ بالأكل؟
      en: Yes, Grandma. Have you eaten?
    - speaker: Mohamed
      text: Sugeng enjing, Mbah.
      ar_eg: صباح الخير يا تيتة.
      ar: صباح الخير يا جدتي.
      en: Good morning, Grandma.
