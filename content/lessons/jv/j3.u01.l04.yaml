schema: kabar.lesson/v1
id: j3.u01.l04
language: jv
title: Pinanggih tanggi
can_do:
  ar_eg: تتعرّف على جارك وعياله بالكراما، وتقول إنك مبسوط إنك قابلته.
  ar: أن تتعرّف إلى جارك وأطفاله بالكراما، وتقول إنك سعيد بلقائه.
  en: Meet a neighbour and their children in krama, and say you're glad to meet them.
slides:
  - title: Tanggi, lare, sedherek
    body:
      ar_eg: |
        في الكراما كلمات كتير من الحياة اليومية بتتغيّر:
        - tangga ← tanggi = جار
        - bocah ← lare = عيل، طفل
        - sedulur ← sedherek = قريب، أخ أو أخت
        - ketemu ← pinanggih = يقابل
        - wedi ← ajrih = خايف
        وفيه كلمات بتفضل زي ما هي: bungah = مبسوط، kuwatir = قلقان، murid = تلميذ.
      ar: |
        في الكراما تتغيّر كلمات يومية كثيرة:
        - tangga ← tanggi = جار
        - bocah ← lare = طفل
        - sedulur ← sedherek = قريب، أخ أو أخت
        - ketemu ← pinanggih = يلتقي
        - wedi ← ajrih = خائف
        وتبقى كلمات أخرى كما هي: bungah = سعيد، kuwatir = قلق، murid = تلميذ.
      en: |
        In krama, many everyday words change:
        - tangga → tanggi = neighbour
        - bocah → lare = child
        - sedulur → sedherek = relative, sibling
        - ketemu → pinanggih = meet
        - wedi → ajrih = afraid
        Others stay the same: bungah = glad, kuwatir = worried, murid = pupil.
    examples:
      - text: Bungah sanget saged pinanggih panjenengan.
        ar_eg: مبسوط أوي إني قابلت حضرتك.
        ar: سعيد جدًا بلقائك.
        en: So glad to meet you.
      - text: Lare-lare tanggi kula taksih murid.
        ar_eg: عيال جاري لسه تلامذة.
        ar: أطفال جاري ما زالوا تلاميذ.
        en: My neighbour's children are still pupils.
      - text: Lare menika taksih ajrih.
        ar_eg: العيل ده لسه خايف.
        ar: هذا الطفل ما زال خائفًا.
        en: This child is still scared.
