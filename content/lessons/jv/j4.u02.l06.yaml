    options: [nyuguhi, gelas, rai]
    answer: 0
    explain:
      ar_eg: nyuguhi = يضيّف ويقدّم أكل وشرب.
      ar: nyuguhi = يضيّف ويقدّم الطعام والشراب.
      en: nyuguhi = serve guests food and drink.
    words: [nyuguhi, gelas, rai]
dialogue:
  lines:
    - speaker: Bu Harsono
      text: Mas, dhayoh sampun rawuh. Kula badhe nyuguhi unjukan.
      ar_eg: يا ماس، الضيوف وصلوا. هضيّفهم بمشروب.
      ar: يا ماس، وصل الضيوف. سأقدّم لهم الشراب.
      en: Mas, the guests are here. I'll serve them drinks.
    - speaker: Mohamed
      text: Kula biyantu, Bu. Gelasipun wonten pundi?
      ar_eg: أساعدك يا هانم. الكوبايات فين؟
      ar: سأساعدكِ يا سيدتي. أين الأكواب؟
      en: Let me help, ma'am. Where are the glasses?
    - speaker: Bu Harsono
      text: Wonten pawon. Pasugatanipun ugi.
      ar_eg: في المطبخ. والضيافة كمان.
      ar: في المطبخ، والضيافة أيضًا.
      en: In the kitchen. The refreshments too.
    - speaker: Mas Dimas
      text: Mohamed, delengen bayine Mbak Ratri! Irunge cilik banget.
      ar_eg: يا محمد، بص على بيبي مباك راتري! مناخيره صغيرة أوي.
      ar: يا محمد، انظر إلى مولود مباك راتري! أنفه صغير جدًّا.
      en: Mohamed, look at Mbak Ratri's baby! His nose is so tiny.
    - speaker: Mohamed
      text: Iya, Mas. Raine mirip Mbak Ratri.
      ar_eg: آه يا ماس. وشه شبه مباك راتري.
      ar: نعم يا ماس، وجهه يشبه مباك راتري.
      en: Yes, Mas. His face looks like Mbak Ratri's.
