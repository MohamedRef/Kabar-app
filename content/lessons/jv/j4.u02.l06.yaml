id: j4.u02.l06
language: jv
title: Dhayoh tilik bayi
can_do:
  ar_eg: تستقبل ضيوف جايين يشوفوا بيبي، تضيّفهم، وتوصف البيبي بالكلمات العادية.
  ar: أن تستقبل ضيوفًا جاؤوا لرؤية مولود، وتضيّفهم، وتصف المولود بالكلمات العادية.
  en: Welcome guests who come to see a new baby, serve them, and describe the baby in plain words.
slides:
  - title: 'Bayi: rai, irung, kuping'
    body:
      ar_eg: |
        البيبي والعيال الصغيرين بناخد معاهم الكلمات العادية، مش krama inggil:
        - rai = وش، irung = مناخير، kuping = ودن. «Irunge bayi lucu banget.»
          للكبير بنقول pasuryan وtalingan.
        - dhayoh = ضيف (نغوكو؛ بالكراما tamu). nyuguhi = يضيّف، يقدّم أكل وشرب للضيوف.
        - unjukan = مشروب (krama inggil، من ngunjuk)، pasugatan = الضيافة اللي بتتحط قدام الضيف، gelas = كوباية.
          «Mangga, unjukanipun» = اتفضل مشروبك.
      ar: |
        للمولود والأطفال الصغار الكلمات العادية لا krama inggil:
        - rai = وجه، irung = أنف، kuping = أذن. «Irunge bayi lucu banget.»
          وللكبير نقول pasuryan وtalingan.
        - dhayoh = ضيف (نغوكو، وبالكراما tamu). nyuguhi = يضيّف، يقدّم الطعام والشراب للضيوف.
        - unjukan = شراب (krama inggil، من ngunjuk)، pasugatan = ما يُقدَّم للضيف من ضيافة، gelas = كوب.
          «Mangga, unjukanipun» = تفضّل شرابك.
      en: |
        Babies and small children get plain words, not krama inggil:
        - rai = face, irung = nose, kuping = ear. "Irunge bayi lucu banget."
          For an elder you'd say pasuryan and talingan.
        - dhayoh = guest (ngoko; krama tamu). nyuguhi = serve guests food and drink.
        - unjukan = drink (krama inggil, from ngunjuk), pasugatan = refreshments set out for guests, gelas = glass.
          "Mangga, unjukanipun" = here's your drink.
    examples:
      - text: Irunge bayi lucu banget.
        ar_eg: مناخير البيبي تجنن.
        ar: أنف المولود لطيف جدًّا.
        en: The baby's nose is so cute.
      - text: Bu Harsono nyuguhi dhayoh.
        ar_eg: بو هارسونو بتضيّف الضيوف.
        ar: تضيّف بو هارسونو الضيوف.
        en: Bu Harsono is serving the guests.
      - text: Mangga, unjukanipun, Bu.
        ar_eg: اتفضلي المشروب يا هانم.
        ar: تفضّلي شرابك يا سيدتي.
        en: Here's your drink, ma'am.
