    answer: 1
    explain:
      ar_eg: للبيبي الكلمة العادية irung، مش grana. وkuping = ودن.
      ar: للمولود الكلمة العادية irung لا grana، وkuping = أذن.
      en: For a baby, the plain irung, not grana. kuping = ear.
