schema: kabar.lesson/v1
id: j3.u03.l11
language: jv
title: Ulangan J3.3
can_do:
  ar_eg: تترجم جمل ngoko لكراما.
  ar: أن تحوّل جمل الـ ngoko إلى الكراما.
  en: Translate ngoko lines into krama.
slides:
  - title: Ngoko → krama
    body:
      ar_eg: |
        المراجعة دي كلها تحويل: تاخد جملة ngoko وتلبّسها بدلة الكراما. اعمل كده بالترتيب:
        ١. الضماير: aku ← kula، kowe ← sampeyan / panjenengan، dheweke ← piyambakipun.
        ٢. الكلمات الصغيرة: wis ← sampun، durung ← dereng، arep ← badhe، isih ← taksih، ora ← mboten، ana ← wonten، iya ← inggih، iki ← menika.
        ٣. حروف الجر: saka ← saking، neng ← dhateng، karo ← kaliyan، uga ← ugi.
        ٤. الكلمات اللي اتعلمتها: mangan ← nedha، ngerti ← ngertos، pasar ← peken، jeneng ← nami، omah ← griya.
      ar: |
        هذه المراجعة كلها تحويل: تأخذ جملة ngoko وتلبسها ثوب الكراما بالترتيب:
        ١. الضمائر: aku ← kula، kowe ← sampeyan / panjenengan، dheweke ← piyambakipun.
        ٢. الألفاظ الصغيرة: wis ← sampun، durung ← dereng، arep ← badhe، isih ← taksih، ora ← mboten، ana ← wonten، iya ← inggih، iki ← menika.
        ٣. حروف الجر: saka ← saking، neng ← dhateng، karo ← kaliyan، uga ← ugi.
        ٤. ما تعلمته من الأسماء والأفعال: mangan ← nedha، ngerti ← ngertos، pasar ← peken، jeneng ← nami، omah ← griya.
      en: |
        This review is all conversion: take a ngoko line and dress it in krama. Go in order:
        1. Pronouns: aku → kula, kowe → sampeyan / panjenengan, dheweke → piyambakipun.
        2. Small words: wis → sampun, durung → dereng, arep → badhe, isih → taksih, ora → mboten, ana → wonten, iya → inggih, iki → menika.
        3. Prepositions: saka → saking, neng → dhateng, karo → kaliyan, uga → ugi.
        4. Words you've learned: mangan → nedha, ngerti → ngertos, pasar → peken, jeneng → nami, omah → griya.
    grammar: jv.krama.function-words
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wis
        ar_eg: بالكراما sampun
        ar: بالكراما sampun
        en: in krama → sampun
      - text: durung
        ar_eg: بالكراما dereng
        ar: بالكراما dereng
        en: in krama → dereng
      - text: arep
        ar_eg: بالكراما badhe
        ar: بالكراما badhe
        en: in krama → badhe
      - text: isih
        ar_eg: بالكراما taksih
        ar: بالكراما taksih
        en: in krama → taksih
    words: [sampun, dereng, badhe, taksih]
  - id: e02
    type: match_pairs
    pairs:
      - text: ora
        ar_eg: بالكراما mboten
        ar: بالكراما mboten
        en: in krama → mboten
      - text: ana
        ar_eg: بالكراما wonten
        ar: بالكراما wonten
        en: in krama → wonten
      - text: saka
        ar_eg: بالكراما saking
        ar: بالكراما saking
        en: in krama → saking
      - text: neng
        ar_eg: بالكراما dhateng
        ar: بالكراما dhateng
        en: in krama → dhateng
      - text: karo
        ar_eg: بالكراما kaliyan
        ar: بالكراما kaliyan
        en: in krama → kaliyan
    words: [mboten, wonten, saking, dhateng, kaliyan]
  - id: e03
    type: multiple_choice
    question: Aku ora ngerti.
    question_meaning:
      ar_eg: أنهي نسخة كراما صح؟
      ar: أيّ نسخة كراما صحيحة؟
      en: Which krama version is right?
    options: [Aku mboten ngerti., Kula ora ngertos., Kula mboten ngertos.]
    answer: 2
    explain:
      ar_eg: 'لازم التلات كلمات يتبدلوا: aku ← kula، ora ← mboten، ngerti ← ngertos.'
      ar: 'تُبدّل الألفاظ الثلاثة: aku ← kula، وora ← mboten، وngerti ← ngertos.'
      en: All three swap — aku → kula, ora → mboten, ngerti → ngertos.
    words: [kula, mboten, ngertos]
  - id: e04
    type: multiple_choice
    question: Dheweke durung mangan.
    question_meaning:
      ar_eg: أنهي نسخة كراما صح؟ (بتتكلم بأدب عن Bu Siti)
      ar: أيّ نسخة كراما صحيحة؟ (تتحدث بأدب عن Bu Siti)
      en: Which krama version is right? (speaking politely about Bu Siti)
    options: [Piyambakipun sampun nedha., Dheweke dereng nedha., Piyambakipun dereng nedha.]
    answer: 2
    explain:
      ar_eg: dheweke ← piyambakipun، durung ← dereng (مش sampun، دي «خلاص»)، mangan ← nedha.
      ar: dheweke ← piyambakipun، وdurung ← dereng (لا sampun فمعناها «قد»)، وmangan ← nedha.
      en: dheweke → piyambakipun, durung → dereng (not sampun, which means "already"), mangan → nedha.
    words: [piyambakipun, dereng, nedha]
  - id: e05
    type: listen
    text: Kula taksih sinau krama.
    options: [Aku isih sinau krama., Kula dereng sinau krama., Kula taksih sinau krama.]
    answer: 2
    words: [taksih]
  - id: e06
    type: fill_blank
    sentence: Bu Siti ___? — Mboten wonten.
    meaning:
      ar_eg: Bu Siti موجودة؟ — لأ، مش موجودة.
      ar: هل Bu Siti موجودة؟ — لا، ليست موجودة.
      en: Is Bu Siti in? — No, she isn't.
    options: [sampun, wonten, ana]
    answers: [wonten]
    words: [wonten]
    explain:
      ar_eg: "السؤال بالكراما: wonten = موجودة. ana نفس المعنى نغوكو، وsampun = خلاص."
      ar: "السؤال بالكراما: wonten أي موجودة. أما ana فبالمعنى نفسه نغوكو، وsampun قد."
      en: In krama the question is wonten, "is she in". ana is the ngoko, and sampun is "already".
  - id: e07
    type: build_sentence
    source:
      ar_eg: Aku arep neng pasar karo Mas Dimas. ← بالكراما
      ar: Aku arep neng pasar karo Mas Dimas. ← بالكراما
      en: Aku arep neng pasar karo Mas Dimas. → in krama
    answer: Kula badhe dhateng peken kaliyan Mas Dimas.
    distractors: [arep, karo, neng]
    words: [kula, badhe, dhateng, peken, kaliyan]
    explain:
      ar_eg: arep ← badhe، neng ← dhateng، karo ← kaliyan، وpasar ← peken. arep وkaro وneng نغوكو.
      ar: arep ← badhe، وneng ← dhateng، وkaro ← kaliyan، وpasar ← peken. أما arep وkaro وneng فنغوكو.
      en: arep → badhe, neng → dhateng, karo → kaliyan, pasar → peken. arep, karo and neng are ngoko.
  - id: e08
    type: fill_blank
    sentence: Krama langkung ___ tinimbang ngoko.
    meaning:
      ar_eg: الكراما ___ من الـ ngoko.
      ar: الكراما ___ من الـ ngoko.
      en: Krama is ___ than ngoko.
    options: [awrat, gampil, sami]
    answers: [awrat]
    words: [awrat, gampil, sami, langkung]
    explain:
      ar_eg: "langkung … tinimbang = أكتر من، والكراما أصعب: awrat. gampil = سهل ودي عكس الجملة، وsami = زي بعض."
      ar: "langkung … tinimbang تعني أكثر من، والكراما أصعب: awrat. أما gampil فسهل وهو عكس المعنى، وsami متساوٍ."
      en: "langkung … tinimbang is \"more … than\", and krama is harder: awrat. gampil (easy) is the opposite, and sami is \"the same\"."
  - id: e09
    type: multiple_choice
    question: Ngenteni (ngoko) → ___ (krama)
    options: [mbekta, nengga, malih]
    answer: 1
    explain:
      ar_eg: ngenteni ← nengga = يستنى. mbekta = يجيب معاه، malih = تاني.
      ar: ngenteni ← nengga = ينتظر. mbekta = يُحضر، malih = مرة أخرى.
      en: ngenteni → nengga = wait for. mbekta = bring, malih = again.
    words: [nengga, mbekta, malih]
  - id: e10
    type: match_pairs
    pairs:
      - text: menawi
        ar_eg: لو (كراما)
        ar: إن، لو (كراما)
        en: if (krama)
      - text: kedah
        ar_eg: لازم (كراما)
        ar: يجب (كراما)
        en: must (krama)
      - text: alit
        ar_eg: صغير (كراما)
        ar: صغير (كراما)
        en: small (krama)
      - text: kathah
        ar_eg: كتير (كراما)
        ar: كثير (كراما)
        en: many (krama)
      - text: sumerep
        ar_eg: يشوف، يعرف (كراما)
        ar: يرى، يعرف (كراما)
        en: see, know (krama)
      - text: benjing
        ar_eg: بكرة (كراما)
        ar: غدًا (كراما)
        en: tomorrow (krama)
    words: [menawi, kedah, alit, kathah, sumerep, benjing]
  - id: e11
    type: speaking
    text: Inggih, kula sampun nedha. Matur nuwun.
    meaning:
      ar_eg: أيوه، أنا كلت. شكرًا.
      ar: نعم، قد أكلتُ. شكرًا.
      en: Yes, I've eaten. Thank you.
    words: [inggih, sampun, nedha]
  - id: e12
    type: match_pairs
    pairs:
      - text: amargi
        ar_eg: عشان (كراما)
        ar: لأنّ (كراما)
        en: because (krama)
      - text: ananging
        ar_eg: بس، لكن (كراما)
        ar: لكنّ (كراما)
        en: but (krama)
      - text: sanes
        ar_eg: مش (قبل اسم)
        ar: ليس (قبل اسم)
        en: not (before a noun)
      - text: bokmenawi
        ar_eg: يمكن
        ar: ربما
        en: maybe, perhaps
      - text: kinten
        ar_eg: يظن
        ar: يظنّ
        en: think, guess
      - text: pitados
        ar_eg: يصدّق
        ar: يصدّق
        en: believe
    words: [amargi, ananging, sanes, bokmenawi, kinten, pitados]
dialogue:
  title: Pamit saka Kauman
  lines:
    - speaker: Mas Dimas
      text: "Mohamed, wis mangan durung?"
      ar_eg: "يا محمد، كلت ولا لسه؟"
      ar: "يا محمد، هل أكلت؟"
      en: "Mohamed, eaten yet?"
    - speaker: Mohamed
      text: Durung, Mas. Ayo mangan!
      ar_eg: لسه يا دِيماس. يلا ناكل!
      ar: ليس بعد يا ديماس. هيا نأكل!
      en: Not yet, Dimas. Let's eat!
    - speaker: Pak Harjo
      text: "Mas Mohamed, badhe nedha?"
      ar_eg: "يا أستاذ محمد، ناوي تاكل؟"
      ar: "يا محمد، هل ستأكل؟"
      en: "Mohamed, going to eat?"
    - speaker: Mohamed
      text: Inggih, Pak. Kula badhe nedha kaliyan Mas Dimas.
      ar_eg: أيوه يا عم. أنا رايح آكل مع دِيماس.
      ar: نعم يا سيدي. سأذهب لآكل مع ديماس.
      en: Yes, sir. I'm going to eat with Dimas.
    - speaker: Pak Harjo
      text: "Nggih, mangga, Mas."
      ar_eg: "طيب، اتفضل يا أستاذ."
      ar: "حسنًا، تفضّل."
      en: "All right, off you go."
    - speaker: Mohamed
      text: Matur nuwun, Pak.
      ar_eg: شكرًا يا عم.
      ar: شكرًا يا سيدي.
      en: Thank you, sir.
souvenir:
  id: j3.u03.souvenir
  title: Kampung Kauman
  note:
    ar_eg: كاومان جنب الجامع الكبير في يوجيا، Masjid Gedhe (masjid، من الكلمة العربية «مسجد»). زمان كانت حي الناس اللي بيخدموا في الجامع، واتعمل فيها باتيك كتير في البيوت القديمة، وفيها أسس أحمد دحلان جمعية المحمدية سنة ١٩١٢. ادخل أي محل وقول «Nyuwun sewu, wonten batik?» وهتلاقي ابتسامة مستنياك.
    ar: تقع كاومان بجوار المسجد الكبير في يوجيا، Masjid Gedhe (masjid، من العربية «مسجد»). وكانت قديمًا حيّ القائمين على شؤون المسجد، وصُنع الباتيك طويلًا في بيوتها العتيقة، وفيها أسس أحمد دحلان جمعية المحمدية سنة ١٩١٢. ادخل أي متجر وقل «Nyuwun sewu, wonten batik?» تجد ابتسامة في انتظارك.
    en: Kauman sits next to Jogja's Grand Mosque, the Masjid Gedhe (masjid, from Arabic «مسجد»). It was once the quarter of the mosque's religious officials, batik was long made in its old houses, and in 1912 Ahmad Dahlan founded Muhammadiyah here. Step into any shop, say "Nyuwun sewu, wonten batik?", and a smile will be waiting.
