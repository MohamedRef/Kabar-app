id: j4.u04.l02
language: jv
title: Ngapunten, sampun repot-repot
can_do:
  ar_eg: تعتذر، وتقبل أو ترفض الأكل بأدب.
  ar: أن تعتذر، وتقبل الطعام أو تعتذر عنه بأدب.
  en: Apologise, and accept or decline food politely.
slides:
  - title: Nyuwun pangapunten
    body:
      ar_eg: |
        «آسف» بالجاوي المؤدب:
        - Nyuwun pangapunten = أنا آسف جدًا / سامحني (رسمية، حرفيًا «أطلب السماح»).
        - Ngapunten = آسف / لا مؤاخذة (أقصر، للكلام اليومي).
        بالإندونيسي: maaf. وnyuwun هنا هي نفس nyuwun بتاعة «أطلب» اللي عرفتها.
      ar: |
        «آسف» بالجاوية المهذبة:
        - Nyuwun pangapunten = أرجو المعذرة (رسمية، حرفيًا «أطلب العفو»).
        - Ngapunten = عفوًا / آسف (أقصر، للكلام اليومي).
        وبالإندونيسية maaf، وnyuwun هي «أطلب» التي عرفتها.
      en: |
        "Sorry" in polite Javanese:
        - Nyuwun pangapunten = I'm very sorry / please forgive me (formal, lit. "I ask forgiveness").
        - Ngapunten = sorry, excuse me (shorter, everyday).
        Indonesian: maaf. The nyuwun is the same "ask for" you already know.
    grammar: jv.etiquette.phrases
    examples:
      - text: Nyuwun pangapunten, Pak.
        ar_eg: أنا آسف جدًا يا أستاذ.
        ar: أرجو المعذرة يا سيدي.
        en: I'm very sorry, sir.
      - text: Ngapunten, kula mboten ngertos.
        ar_eg: لا مؤاخذة، أنا مش فاهم.
        ar: عفوًا، لا أفهم.
        en: Sorry, I don't understand.
  - title: Sampun repot-repot
    body:
      ar_eg: |
        المضيف الجاوي هيجيبلك أكل وشرب كتير. فيه عبارتين ثابتين:
        - قبل ما يتعب: «Sampun repot-repot, Bu» = ماتتعبيش نفسك. sampun في أول الطلب هنا معناها «ماتعملش» (زي aja)، مش «خلاص».
        - بعد ما تشبع: «Sampun cekap, matur nuwun» = كفاية كده، متشكر. cekap = cukup.
        زي «ماتتعبش نفسك» و«كده كتير والله» عندنا.
      ar: |
        سيقدّم لك المضيف الجاوي طعامًا وشرابًا كثيرًا، وللموقف عبارتان ثابتتان:
        - قبل أن يتكلّف: «Sampun repot-repot, Bu» = لا تتكلّفي. وsampun في أول الطلب هنا بمعنى «لا تفعل» (كـ aja) لا «قد».
        - بعد الشبع: «Sampun cekap, matur nuwun» = يكفي، شكرًا. وcekap = cukup.
        كقولنا «لا تتعب نفسك» و«كفاية كده والله».
      en: |
        A Javanese host will bring lots of food and drink. Two set phrases:
        - Before they go to trouble: "Sampun repot-repot, Bu" = please don't go to any trouble. sampun at the start of a request means "don't" (like aja), not "already".
        - When you've had enough: "Sampun cekap, matur nuwun" = that's plenty, thank you. cekap = cukup.
        Just like «ماتتعبش نفسك» and «كده كتير والله».
    grammar: jv.etiquette.phrases
    examples:
      - text: Sampun repot-repot, Bu.
        ar_eg: ماتتعبيش نفسك يا هانم.
        ar: لا تتكلّفي يا سيدتي.
        en: Please don't go to any trouble, ma'am.
      - text: Sampun cekap, matur nuwun.
        ar_eg: كفاية كده، متشكر.
        ar: يكفي، شكرًا.
        en: That's plenty, thank you.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nyuwun pangapunten
        ar_eg: أنا آسف جدًا (رسمي)
        ar: أرجو المعذرة (رسمي)
        en: I'm very sorry (formal)
      - text: ngapunten
        ar_eg: آسف / لا مؤاخذة
        ar: عفوًا / آسف
        en: sorry, excuse me
      - text: sampun repot-repot
        ar_eg: ماتتعبش نفسك
        ar: لا تتكلّف
        en: please don't go to any trouble
      - text: cekap
        ar_eg: كفاية
        ar: يكفي
        en: enough
      - text: sami-sami
        ar_eg: العفو
        ar: العفو
        en: you're welcome
    words: [nyuwun pangapunten, ngapunten, sampun repot-repot, cekap]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: خبطت في راجل كبير من غير قصد. تقول إيه؟
      ar: اصطدمتَ برجل كبير دون قصد. ماذا تقول؟
      en: You bump into an old man by accident. What do you say?
    options: ['Nyuwun pangapunten, Pak.', 'Matur nuwun, Pak.', 'Sami-sami, Pak.']
    answer: 0
    words: [nyuwun pangapunten]
    explain:
      ar_eg: "خبطت فيه، يبقى تعتذر: Nyuwun pangapunten. Matur nuwun شكرًا، وSami-sami العفو."
      ar: "اصطدمت به فتعتذر: Nyuwun pangapunten، أما Matur nuwun فشكر، وSami-sami ردّ على الشكر."
      en: "You bumped into him, so apologise: Nyuwun pangapunten. Matur nuwun is thanks, Sami-sami answers thanks."
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: Bu Ningsih داخلة المطبخ تطبخلك. تقولها بأدب ماتتعبش نفسها إزاي؟
      ar: تدخل Bu Ningsih المطبخ لتطبخ لك. كيف تقول لها بأدب ألا تتكلّف؟
      en: Bu Ningsih heads to the kitchen to cook for you. How do you politely ask her not to go to any trouble?
    options: ['Sampun cekap, Bu.', 'Sampun repot-repot, Bu.', 'Ngatos-atos, Bu.']
    answer: 1
    explain:
      ar_eg: "قبل ما تتعب: Sampun repot-repot. Sampun cekap بتتقال بعد ما تاكل وتشبع."
      ar: "قبل أن تتكلّف: Sampun repot-repot، أما Sampun cekap فبعد الأكل والشبع."
      en: "Before she goes to the trouble: Sampun repot-repot. Sampun cekap is for after you've eaten your fill."
    words: [sampun repot-repot, cekap]
  - id: e04
    type: listen
    text: Ngapunten, kula mboten ngertos.
    options: ['Ngapunten, kula mboten nedha.', 'Matur nuwun, kula sampun ngertos.', 'Ngapunten, kula mboten ngertos.']
    answer: 2
    meaning:
      ar_eg: لا مؤاخذة، أنا مش فاهم.
      ar: عفوًا، لا أفهم.
      en: Sorry, I don't understand.
    words: [ngapunten]
  - id: e05
    type: fill_blank
    sentence: Sampun ___, matur nuwun.
    meaning:
      ar_eg: (بعد الأكل) كفاية كده، متشكر.
      ar: (بعد الأكل) يكفي، شكرًا.
      en: (after eating) That's plenty, thank you.
    options: [cekap, repot-repot, sae]
    answers: [cekap]
    words: [cekap]
    explain:
      ar_eg: "بعد الأكل: Sampun cekap = كده كفاية. Sampun repot-repot قبل ما يتعبوا نفسهم، وsae يعني كويس."
      ar: "بعد الأكل: Sampun cekap = هذا يكفي، أما Sampun repot-repot فقبل أن يتكلّفوا، وsae معناها جيّد."
      en: "After eating: Sampun cekap = that's enough. Sampun repot-repot is said before they go to trouble, sae means \"good\"."
  - id: e06
    type: fill_blank
    sentence: Nyuwun ___, Bu.
    meaning:
      ar_eg: أنا آسف جدًا يا هانم.
      ar: أرجو المعذرة يا سيدتي.
      en: I'm very sorry, ma'am.
    options: [pangapunten, pamit, pirsa]
    answers: [pangapunten]
    explain:
      ar_eg: nyuwun pangapunten = أطلب السماح. nyuwun pamit = أستأذن أمشي، وnyuwun pirsa = بعد إذنك أسأل.
      ar: nyuwun pangapunten = أطلب العفو، وnyuwun pamit = أستأذن في الانصراف، وnyuwun pirsa = أستأذن في السؤال.
      en: nyuwun pangapunten = I ask forgiveness. nyuwun pamit = I ask leave to go; nyuwun pirsa = may I ask.
    words: [nyuwun pangapunten]
  - id: e07
    type: build_sentence
    source:
      ar_eg: ماتتعبيش نفسك يا هانم.
      ar: لا تتكلّفي يا سيدتي.
      en: Please don't go to any trouble, ma'am.
    answer: Sampun repot-repot, Bu.
    distractors: [aja, cekap]
    words: [sampun repot-repot]
    explain:
      ar_eg: Sampun repot-repot = ما تتعبيش نفسك. aja نغوكو مش للكبيرة، وcekap يعني كفاية.
      ar: Sampun repot-repot = لا تتكلّفي، أما aja فنغوكو لا تليق بالكبيرة، وcekap معناها يكفي.
      en: Sampun repot-repot = please don't trouble yourself. aja is ngoko, not for an elder, and cekap means "enough".
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لا مؤاخذة، أنا مش فاهم.
      ar: عفوًا، لا أفهم.
      en: Sorry, I don't understand.
    answers: ['Ngapunten, kula mboten ngertos.', 'Nyuwun pangapunten, kula mboten ngertos.', 'Ngapunten, kula dereng ngertos.', 'Nyuwun sewu, kula mboten ngertos.']
    words: [ngapunten]
  - id: e09
    type: speaking
    text: Sampun cekap, Bu. Matur nuwun sanget.
    meaning:
      ar_eg: كفاية كده يا هانم. متشكر أوي.
      ar: يكفي يا سيدتي. شكرًا جزيلًا.
      en: That's plenty, ma'am. Thank you very much.
    words: [cekap]
dialogue:
  title: Teh ing Kampung Taman
  lines:
    - speaker: Bu Ningsih
      text: Mas, kula damelaken teh rumiyin.
      ar_eg: يا ابني، هعملك شاي الأول.
      ar: يا بني، سأعدّ لك الشاي أولًا.
      en: Let me make you some tea first.
    - speaker: Mohamed
      text: Sampun repot-repot, Bu.
      ar_eg: ماتتعبيش نفسك يا هانم.
      ar: لا تتكلّفي يا سيدتي.
      en: Please don't go to any trouble, ma'am.
    - speaker: Bu Ningsih
      text: Mboten repot, Mas. Mangga diunjuk.
      ar_eg: مفيش تعب ولا حاجة يا ابني. اتفضل اشرب.
      ar: لا تكلّف في ذلك يا بني. تفضّل بالشرب.
      en: It's no trouble at all. Please, have a drink.
    - speaker: Mohamed
      text: Matur nuwun sanget, Bu. Tehipun sae sanget.
      ar_eg: متشكر أوي يا هانم. الشاي حلو أوي.
      ar: شكرًا جزيلًا يا سيدتي. الشاي طيب جدًا.
      en: Thank you very much, ma'am. The tea is lovely.
    - speaker: Bu Ningsih
      text: Sami-sami, Mas.
      ar_eg: العفو يا ابني.
      ar: العفو يا بني.
      en: You're welcome.
