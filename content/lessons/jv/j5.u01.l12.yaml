schema: kabar.lesson/v1
id: j5.u01.l12
language: jv
title: Ulangan J5.1
can_do:
  ar_eg: تقرا مقالة جديدة.
  ar: أن تقرأ مقالة جديدة.
  en: Read a new article.
slides:
  - title: Artikel anyar, Kudus
    body:
      ar_eg: |
        مقالة جديدة عن مدينة تانية. استخدم الهيكل اللي اتعلمته: iku / yaiku (تعريف وتفصيل)، ana ing / ing (فين)، kang (وصف)، minangka (بصفته)، kalebu (من ضمن)، sawijining (واحد من).
        ولو قريتها بصوت عالي لصاحبك، رجّع ing لـ neng وkang لـ sing.
      ar: |
        مقالة جديدة عن مدينة أخرى. استعمل الهيكل الذي تعلمته: iku / yaiku (التعريف والتفصيل)، وana ing / ing (المكان)، وkang (الوصف)، وminangka (بوصفه)، وkalebu (من ضمن)، وsawijining (أحد).
        وإن حكيتها لصديقك فردّ ing إلى neng وkang إلى sing.
      en: |
        A new article about another city. Use the skeleton you've learned: iku / yaiku (definition and details), ana ing / ing (where), kang (description), minangka (as), kalebu (among), sawijining (one of).
        If you retell it to a friend, turn ing back into neng and kang into sing.
    grammar: jv.reading.written-style
    examples:
      - text: Kudus iku sawijining kutha ing Provinsi Jawa Tengah, ora adoh saka Demak.
        ar_eg: كودوس مدينة من مدن محافظة جاوة الوسطى، مش بعيدة عن ديماك.
        ar: كودوس إحدى مدن إقليم جاوة الوسطى، غير بعيدة عن ديماك.
        en: Kudus is a city in Central Java Province, not far from Demak.
      - text: Ing Kudus ana menara lawas kang misuwur, yaiku Menara Kudus.
        ar_eg: في كودوس منارة قديمة مشهورة، هي منارة كودوس.
        ar: في كودوس منارة قديمة مشهورة، هي منارة كودوس.
        en: In Kudus there is a famous old minaret, the Menara Kudus.
      - text: Menara Kudus kalebu papan kang misuwur ing Jawa Tengah.
        ar_eg: منارة كودوس من الأماكن المشهورة في جاوة الوسطى.
        ar: منارة كودوس من الأماكن المشهورة في جاوة الوسطى.
        en: The Menara Kudus is among the famous places of Central Java.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: iku
        ar_eg: هو / هي (= adalah، في الكتابة)
        ar: هو / هي (= adalah، في الكتابة)
        en: is (= adalah, in writing)
      - text: yaiku
        ar_eg: ألا وهو (= yaitu)
        ar: أي (= yaitu)
        en: namely (= yaitu)
      - text: ana ing
        ar_eg: موجود في (= terletak di)
        ar: يقع في (= terletak di)
        en: is located in (= terletak di)
      - text: kang
        ar_eg: اللي (= yang)
        ar: الذي (= yang)
        en: which, who (= yang)
      - text: minangka
        ar_eg: بصفته (= sebagai)
        ar: بوصفه (= sebagai)
        en: as (= sebagai)
      - text: kalebu
        ar_eg: من ضمن (= termasuk)
        ar: من ضمن (= termasuk)
        en: is among (= termasuk)
    words: [yaiku, ana ing, kang, minangka, kalebu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة بأسلوب المقالة؟
      ar: أي جملة بأسلوب المقالة؟
      en: Which sentence is in article style?
    options: ['Menara Kudus iku papan sing misuwur neng Jawa Tengah.', 'Menara Kudus iku papan sing misuwur ing Jawa Tengah.', 'Menara Kudus iku papan kang misuwur ing Jawa Tengah.']
    answer: 2
    explain:
      ar_eg: kang وing للكتابة، sing وneng للكلام.
      ar: kang وing للكتابة، وsing وneng للكلام.
      en: kang and ing are written; sing, neng is spoken.
    words: [kang, misuwur]
  - id: e03
    type: listen
    text: Kudus iku sawijining kutha ing Provinsi Jawa Tengah, ora adoh saka Demak.
    question:
      ar_eg: كودوس في أنهي محافظة؟
      ar: في أي إقليم تقع كودوس؟
      en: Which province is Kudus in?
    options: [Jawa Timur, Jawa Tengah, Jawa Barat]
    answer: 1
    meaning:
      ar_eg: كودوس مدينة من مدن محافظة جاوة الوسطى، مش بعيدة عن ديماك.
      ar: كودوس إحدى مدن إقليم جاوة الوسطى، غير بعيدة عن ديماك.
      en: Kudus is a city in Central Java Province, not far from Demak.
    words: [sawijining, provinsi]
  - id: e04
    type: match_pairs
    pairs:
      - text: kawasan
        ar_eg: منطقة
        ar: منطقة
        en: area
      - text: wit-witan
        ar_eg: شجر
        ar: أشجار
        en: trees
      - text: riwayat
        ar_eg: تاريخ، سيرة
        ar: تاريخ، سيرة
        en: history
      - text: atusan
        ar_eg: مئات
        ar: مئات
        en: hundreds
      - text: dumunung
        ar_eg: بيقع
        ar: يقع
        en: be located
      - text: kondhang
        ar_eg: مشهور
        ar: مشهور
        en: famous
    words: [kawasan, wit-witan, riwayat, atusan, dumunung, kondhang]
  - id: e05
    type: fill_blank
    sentence: Kudus ___ sawijining kutha ing Jawa Tengah.
    meaning:
      ar_eg: كودوس مدينة من مدن جاوة الوسطى.
      ar: كودوس إحدى مدن جاوة الوسطى.
      en: Kudus is a city in Central Java.
    options: [kang, iku, saka]
    answers: [iku]
    explain:
      ar_eg: iku هنا بتعرّف كودوس، زي adalah.
      ar: iku هنا تعرّف كودوس كـ adalah.
      en: iku defines Kudus here, like adalah.
    words: [sawijining]
  - id: e06
    type: fill_blank
    sentence: Madiun misuwur ___ Kutha Pendekar.
    meaning:
      ar_eg: ماديون مشهورة بإنها «مدينة المقاتلين».
      ar: تشتهر ماديون بوصفها «مدينة المقاتلين».
      en: Madiun is famous as the Kutha Pendekar.
    options: [minangka, kalebu, yaiku]
    answers: [minangka]
    words: [minangka, misuwur]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (بأسلوب المقالة) منارة كودوس من الأماكن المشهورة في جاوة الوسطى.
      ar: (بأسلوب المقالة) منارة كودوس من الأماكن المشهورة في جاوة الوسطى.
      en: (article style) The Menara Kudus is among the famous places of Central Java.
    answer: Menara Kudus kalebu papan kang misuwur ing Jawa Tengah.
    distractors: [neng, minangka]
    words: [kalebu, papan, kang]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بأسلوب المقالة) القاهرة هي عاصمة مصر.
      ar: (بأسلوب المقالة) القاهرة عاصمة مصر.
      en: (article style) Cairo is the capital of Egypt.
    answers:
      - Kairo iku ibukutha Mesir.
      - Kairo ibukutha Mesir.
      - Ibukutha Mesir yaiku Kairo.
      - Ibukutha Mesir iku Kairo.
      - Kairo iku ibukutha negara Mesir.
    words: [ibukutha]
  - id: e09
    type: fill_blank
    sentence: Ing pegunungan iku akeh ___ lan tumbuhan.
    meaning:
      ar_eg: في المنطقة الجبلية دي فيه ___ ونباتات كتير.
      ar: في تلك المنطقة الجبلية ___ ونباتات كثيرة.
      en: Those highlands have a lot of ___ and plants.
    options: [satwa, abad, tugu]
    answers: [satwa]
    words: [satwa, abad, tugu, tumbuhan, pegunungan]
  - id: e10
    type: dictation
    text: Pacitan ana ing pesisir kidul pulo Jawa.
    meaning:
      ar_eg: باتشيتان على الساحل الجنوبي لجزيرة جاوة.
      ar: تقع باتشيتان على الساحل الجنوبي لجزيرة جاوة.
      en: Pacitan lies on the south coast of the island of Java.
    words: [ana ing, pesisir, kidul, pulo]
  - id: e11
    type: speaking
    text: Ing Kudus ana menara lawas kang misuwur, yaiku Menara Kudus.
    meaning:
      ar_eg: في كودوس منارة قديمة مشهورة، هي منارة كودوس.
      ar: في كودوس منارة قديمة مشهورة، هي منارة كودوس.
      en: In Kudus there is a famous old minaret, the Menara Kudus.
    words: [yaiku, lawas, misuwur]
dialogue:
  title: Artikel kanggo ing sepur
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, wacanen artikel iki ing sepur. Iki artikel Kudus.
      ar_eg: يا محمد، اقرا المقالة دي في القطر. دي مقالة عن كودوس.
      ar: يا محمد، اقرأ هذه المقالة في القطار. إنها مقالة عن كودوس.
      en: Mohamed, read this article on the train. It's an article about Kudus.
    - speaker: Mohamed
      text: Kudus iku sawijining kutha ing Jawa Tengah. Gampang, kok!
      ar_eg: كودوس مدينة من مدن جاوة الوسطى. سهلة!
      ar: كودوس إحدى مدن جاوة الوسطى. سهل!
      en: Kudus is a city in Central Java. Easy!
    - speaker: Mbak Ayu
      text: Kudus misuwur minangka apa?
      ar_eg: كودوس مشهورة بإيه؟
      ar: بمَ تشتهر كودوس؟
      en: What is Kudus famous as?
    - speaker: Mohamed
      text: Ana menara lawas kang misuwur, yaiku Menara Kudus.
      ar_eg: فيها منارة قديمة مشهورة، هي منارة كودوس.
      ar: فيها منارة قديمة مشهورة، هي منارة كودوس.
      en: It has a famous old minaret, the Menara Kudus.
    - speaker: Mbak Ayu
      text: Pinter! Saiki kowe bisa maca Wikipedia basa Jawa.
      ar_eg: شاطر! دلوقتي تقدر تقرا ويكيبيديا الجاوية.
      ar: أحسنت! صار بإمكانك الآن قراءة ويكيبيديا الجاوية.
      en: Clever! Now you can read Javanese Wikipedia.
souvenir:
  id: j5.u01.souvenir
  title: Jalan Pahlawan Madiun
  note:
    ar_eg: |
      شارع باهلاوان في ماديون كان أيام الهولنديين اسمه Residentslaan، وكان حتة من «طريق البريد الكبير» اللي بيعدّي جاوة كلها. النهارده بقى Pahlawan Street Center: رصيف واسع للمشي فيه نسخ صغيرة من برج إيفل وتمثال الحرية والكعبة، والدخول ببلاش. وعلى فكرة، ويكيبيديا الجاوية مكتوبة أغلبها بالنغوكو بكلمات ربط رسمية، ومجانية، يعني كنز قراية حقيقي ليك كل يوم.
    ar: |
      كان شارع باهلاوان في ماديون يُسمّى أيام الهولنديين Residentslaan، وهو جزء من «طريق البريد الكبير» العابر لجاوة. وصار اليوم Pahlawan Street Center: ممشى واسع فيه نماذج مصغّرة لبرج إيفل وتمثال الحرية والكعبة، والدخول مجاني. وويكيبيديا الجاوية مكتوبة في معظمها بالنغوكو مع أدوات ربط رسمية، وهي مجانية، فهي كنز قراءة حقيقي لك كل يوم.
    en: |
      Madiun's Jalan Pahlawan was the Dutch-era Residentslaan, part of the Great Post Road across Java. Today it is the Pahlawan Street Center: a wide promenade with small replicas of the Eiffel Tower, the Statue of Liberty and the Ka'bah, free to visit. And Javanese Wikipedia, written mostly in ngoko with formal connectors, is free: a real reading treasure for you, every day.
