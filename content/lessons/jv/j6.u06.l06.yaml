schema: kabar.lesson/v1
id: j6.u06.l06
language: jv
title: Mondhok ing Plered
can_do:
  ar_eg: 'تتكلم مع طالب في معهد عن حياته: الحفظ والتسميع، الأحلام، والفلوس اللي بتيجي من البيت والديون.'
  ar: 'أن تتحدث مع طالب في معهد عن حياته: الحفظ والتسميع والأحلام والنقود التي تصله من البيت والديون.'
  en: 'Talk with a pesantren student about his life: memorising and reciting, dreams, money from home and debts.'
slides:
  - title: Urip ing pondok
    body:
      ar_eg: |
        mondhok = يعيش ويدرس في معهد (بوندوك). lalaran = يسمّعوا الدرس بصوت عالي مع بعض عشان يحفظوه.
        apal = حافظ (apal Quran = حافظ القرآن). tansah = دايمًا. ngimpi = يحلم.
        kiriman = الحاجة (أو الفلوس) اللي بتتبعت من البيت. ngutang = يستلف، ياخد بالشكك. nyaur = يسدّ الدين.
      ar: |
        mondhok = يقيم ويدرس في معهد داخلي. lalaran = ترديد الدرس جماعيًا بصوت عالٍ للحفظ.
        apal = حافظ. tansah = دائمًا. ngimpi = يحلم.
        kiriman = ما يُرسَل (من مال أو غيره) من البيت. ngutang = يستدين. nyaur = يسدّد الدين.
      en: |
        mondhok = live and study at a pesantren. lalaran = recite a lesson aloud together to memorise it.
        apal = know by heart. tansah = always. ngimpi = dream.
        kiriman = something (often money) sent from home. ngutang = borrow, buy on credit. nyaur = pay back a debt.
    examples:
      - text: Ali mondhok ing Plered wiwit SMP.
        ar_eg: علي بيدرس في معهد في بليريد من أيام الإعدادي.
        ar: يقيم علي في معهد ببليريد منذ المرحلة الإعدادية.
        en: Ali has boarded at a pesantren in Plered since junior high.
      - text: Saben bengi para santri lalaran nganti apal.
        ar_eg: كل ليلة الطلبة بيسمّعوا مع بعض لحد ما يحفظوا.
        ar: كل ليلة يردّد الطلاب الدرس معًا حتى يحفظوه.
        en: Every night the students recite together until they know it by heart.
      - text: Yen kiriman durung teka, Ali ngutang ing warung, banjur nyaur.
        ar_eg: لو الفلوس من البيت لسه ماوصلتش، علي بياخد بالشكك من الدكان، وبعدين يسدّ.
        ar: إن لم تصل النقود من البيت، يستدين علي من الدكان ثم يسدّد.
        en: If the money from home hasn't come, Ali buys on credit at the stall, then pays it back.
