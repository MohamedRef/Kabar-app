  - id: e03
    type: listen
    text: Kirimane wis teka, Ali arep nyaur utange.
    question:
      ar_eg: علي هيعمل إيه؟
      ar: ماذا سيفعل علي؟
      en: What will Ali do?
    options: [الفلوس اللي اتبعتت وصلت، وعلي هيسدّ دينه, علي ضاع منه الفلوس, علي عايز يستلف تاني]
    answer: 0
    meaning:
      ar_eg: الفلوس اللي اتبعتت وصلت، وعلي هيسدّ دينه.
      ar: وصلت النقود المرسلة، وسيسدّد علي دينه.
      en: The money from home has arrived, so Ali will pay off his debt.
    words: [kiriman, nyaur]
  - id: e04
    type: fill_blank
    sentence: Santri ___ ing pondok, ora mulih saben dina.
    meaning:
      ar_eg: الطالب ___ في المعهد، ومش بيروّح كل يوم.
      ar: الطالب ___ في المعهد ولا يعود إلى بيته يوميًا.
      en: Students ___ at the pesantren; they don't go home every day.
    options: [mondhok, ngimpi, nyaur]
    answers: [mondhok]
    words: [mondhok, ngimpi, nyaur]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: لما الطلبة بيرددوا الدرس بصوت عالي مع بعض عشان يحفظوه، ده اسمه …
      ar: حين يردّد الطلاب الدرس جماعيًا بصوت عالٍ ليحفظوه، يسمّى ذلك …
      en: When students recite a lesson aloud together to memorise it, that's …
    options: [lalaran, kiriman, ngutang]
    answer: 0
    explain:
      ar_eg: lalaran = التسميع الجماعي. kiriman = اللي بيتبعت من البيت، وngutang = يستلف.
      ar: lalaran = الترديد الجماعي؛ kiriman = ما يُرسل من البيت، وngutang = يستدين.
      en: lalaran = group recitation; kiriman = money from home, ngutang = borrow.
    words: [lalaran, kiriman, ngutang]
  - id: e06
    type: fill_blank
    sentence: Aku wis ___ surat Al-Fatihah.
    meaning:
      ar_eg: أنا ___ سورة الفاتحة.
      ar: أنا ___ سورة الفاتحة.
      en: I know Surat Al-Fatihah ___.
    options: [apal, tansah, mondhok]
    answers: [apal]
    words: [apal, tansah, mondhok]
  - id: e07
    type: multiple_choice
    question: Wingi bengi aku ___ ketemu ibu ing Mesir.
    options: [ngutang, ngimpi, apal]
    answer: 1
    explain:
      ar_eg: 'اللي بيحصل في النوم حلم: ngimpi = يحلم.'
      ar: 'ما يحدث في النوم حلم: ngimpi = يحلم.'
      en: 'What happens in your sleep is a dream: ngimpi = dream.'
    words: [ngutang, ngimpi, apal]
  - id: e08
    type: build_sentence
    source:
      ar_eg: كل ليلة الطلبة بيسمّعوا مع بعض.
      ar: كل ليلة يردّد الطلاب معًا.
      en: Every night the students recite together.
    answer: Saben bengi santri lalaran bareng.
    distractors: [kiriman, apal]
    words: [lalaran]
  - id: e09
    type: translate
    direction: from_target
    source_text: Aja ngutang yen ora bisa nyaur.
    answers_meaning:
      ar_eg: [ماتستلفش لو مش هتقدر تسدّ, ماتاخدش دين لو مش قادر ترجّعه]
      ar: [لا تستدن إن لم تستطع السداد, لا تقترض إذا لم تقدر على الوفاء]
      en: ['Don''t borrow if you can''t pay it back', 'Don''t go into debt if you can''t repay it']
    words: [ngutang, nyaur]
  - id: e10
    type: speaking
    text: Aku tansah ngimpi mondhok ing Jawa.
    meaning:
      ar_eg: أنا دايمًا بحلم أدرس في معهد في جاوة.
      ar: أحلم دائمًا بالإقامة في معهد في جاوة.
      en: I always dream of studying at a pesantren in Java.
    words: [tansah, ngimpi, mondhok]
dialogue:
  lines:
    - speaker: Mohamed
      text: Ali, kowe wis suwe mondhok ing kene?
      ar_eg: يا علي، بقالك كتير في المعهد هنا؟
      ar: يا علي، هل أنت هنا في المعهد منذ زمن؟
      en: Ali, have you been at this pesantren long?
    - speaker: Ali
      text: Wis telung taun, Mas. Saben bengi lalaran nganti apal.
      ar_eg: تلات سنين يا ماس. كل ليلة بنسمّع لحد ما نحفظ.
      ar: ثلاث سنوات يا ماس. كل ليلة نردّد حتى نحفظ.
      en: Three years, Mas. Every night we recite until we know it by heart.
    - speaker: Mohamed
      text: Abot ora? Kowe kangen omah ta?
      ar_eg: صعب؟ وحشك البيت؟
      ar: هل هو صعب؟ أتشتاق إلى البيت؟
      en: Is it hard? Do you miss home?
    - speaker: Ali
      text: Kangen, lho. Kadhang aku ngimpi mulih. Nanging ibu tansah ngirim donga.
      ar_eg: وحشني أوي. ساعات بحلم إني روّحت. بس ماما دايمًا بتبعتلي دعا.
      ar: أشتاق كثيرًا. أحيانًا أحلم بالعودة. لكن أمي تبعث بدعائها دائمًا.
      en: I do. Sometimes I dream of going home. But Mum always sends her prayers.
    - speaker: Mohamed
      text: Yen kiriman telat, piye?
      ar_eg: ولو الفلوس من البيت اتأخرت؟
      ar: وإن تأخرت النقود من البيت؟
      en: And if the money from home is late?
    - speaker: Ali
      text: Ngutang sik ing warung, mengko nyaur. Bu warunge apikan kok.
      ar_eg: باخد بالشكك من الدكان، وبعدين أسدّ. صاحبة الدكان طيبة.
      ar: أستدين من الدكان أولًا ثم أسدّد. صاحبة الدكان طيبة.
      en: I buy on credit at the stall first and pay later. The lady who runs it is kind.
