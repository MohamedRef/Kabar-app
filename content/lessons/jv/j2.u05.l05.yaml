schema: kabar.lesson/v1
id: j2.u05.l05
language: jv
title: Mriyang lan watuk
can_do:
  ar_eg: 'تقول إنك تعبان: سخن وبتكح وجسمك متكسّر، وتاخد الدوا وتنام بدري.'
  ar: 'أن تقول إنك متعب: محموم وتسعل وجسمك متعب، وتأخذ الدواء وتنام مبكّرًا.'
  en: 'Say you''re unwell: feverish, coughing and aching, take medicine and get to bed.'
slides:
  - title: Aku mriyang
    body:
      ar_eg: |
        mriyang = سخن (عنده حمى)، watuk = كحة، بيكح.
        awak = جسم: Awakku pegel = جسمي متكسّر. pegel = عضلاته واجعاه من التعب.
        weteng = بطن: Wetengku luwe = بطني جعانة.
        obat = دوا: Ngombe obat = ياخد الدوا (حرفيًا «يشرب»).
        kuwat = قوي. ndang = يلا بسرعة: Ndang turu! = يلا نام!
      ar: |
        mriyang = محموم، watuk = سعال، يسعل.
        awak = جسم: Awakku pegel = جسمي متعب. pegel = متشنّج من التعب.
        weteng = بطن: Wetengku luwe = بطني جائعة.
        obat = دواء: Ngombe obat = يتناول الدواء (حرفيًّا «يشرب»).
        kuwat = قويّ. ndang = هيّا بسرعة: Ndang turu! = هيّا نَم!
      en: |
        mriyang = feverish, watuk = cough.
        awak = body: Awakku pegel = My body aches. pegel = stiff and sore from tiredness.
        weteng = belly: Wetengku luwe = My tummy's hungry.
        obat = medicine: Ngombe obat = take medicine (literally "drink").
        kuwat = strong. ndang = hurry up: Ndang turu! = Off to bed!
    examples:
      - text: Aku mriyang lan watuk.
        ar_eg: أنا سخن وبكح.
        ar: أنا محموم وأسعل.
        en: I've got a fever and a cough.
      - text: Awakku pegel kabeh.
        ar_eg: جسمي كله متكسّر.
        ar: جسمي كلّه متعب.
        en: I ache all over.
      - text: Ndang turu, Le!
        ar_eg: يلا نام يا ابني!
        ar: هيّا نَم يا بنيّ!
        en: Off to bed, son!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: weteng
        ar_eg: بطن
        ar: بطن
        en: belly
      - text: awak
        ar_eg: جسم
        ar: جسم
        en: body
      - text: pegel
        ar_eg: متكسّر
        ar: متعب
        en: sore, aching
      - text: obat
        ar_eg: دوا
        ar: دواء
        en: medicine
    words: [weteng, awak, pegel, obat]
  - id: e02
    type: match_pairs
    pairs:
      - text: mriyang
        ar_eg: سخن (حمى)
        ar: محموم
        en: feverish
      - text: watuk
        ar_eg: كحة
        ar: سعال
        en: cough
      - text: kuwat
        ar_eg: قوي
        ar: قويّ
        en: strong
      - text: ndang
        ar_eg: يلا بسرعة
        ar: هيّا بسرعة
        en: hurry up
    words: [mriyang, watuk, kuwat, ndang]
  - id: e03
    type: listen
    text: Aku mriyang lan watuk.
    question:
      ar_eg: ماله؟
      ar: ما به؟
      en: What's wrong with him?
    options: [عندي سخونية وكحة, بطني جعانة, أنا قوي]
    answer: 0
    meaning:
      ar_eg: أنا سخن وبكح.
      ar: أنا محموم وأسعل.
      en: I've got a fever and a cough.
    words: [mriyang, watuk]
  - id: e04
    type: fill_blank
    sentence: Awakku ___ kabeh, aku kesel.
    meaning:
      ar_eg: جسمي ___ خالص، أنا تعبان.
      ar: جسمي ___ كلّه، أنا متعب.
      en: My body is ___ all over, I'm tired.
    options: [pegel, kuwat, ndang]
    answers: [pegel]
    words: [pegel, awak, kuwat, ndang]
    explain:
      ar_eg: pegel = مكسّر / متعب العضلات، وده مع kesel. kuwat = قوي (العكس)، وndang = بسرعة.
      ar: pegel = متعب العضلات، ويوافق kesel؛ أما kuwat فقوي (العكس)، وndang أسرِع.
      en: pegel = aching, matching kesel (tired). kuwat = strong (the opposite), ndang = hurry.
  - id: e05
    type: multiple_choice
    question: Ndang turu, Le!
    question_meaning:
      ar_eg: مامته بتقول إيه؟
      ar: ماذا تقول أمّه؟
      en: What is his mum saying?
    options: [نام بسرعة يا ابني!, نام براحتك!, ما تنامش!]
    answer: 0
    explain:
      ar_eg: ndang = يلا بسرعة.
      ar: ndang = هيّا بسرعة.
      en: ndang = hurry up, quickly.
    words: [ndang]
  - id: e06
    type: fill_blank
    sentence: Ngombe ___ dhisik, terus turu.
    meaning:
      ar_eg: خد ___ الأول، وبعدين نام.
      ar: تناوَل ___ أوّلًا ثم نَم.
      en: Take your ___ first, then sleep.
    options: [obat, weteng, watuk]
    answers: [obat]
    words: [obat, weteng, watuk]
    explain:
      ar_eg: ngombe obat = ياخد الدوا (بالجاوي «يشرب» الدوا). weteng = بطن، وwatuk = كحة، ومينفعش يتشربوا.
      ar: ngombe obat = يتناول الدواء (حرفيًّا يشربه)؛ أما weteng فبطن، وwatuk سعال، ولا يُشربان.
      en: ngombe obat = take medicine (literally drink it). weteng = tummy, watuk = cough; you can't drink those.
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «جدّتي لسه قوية» بالجاوي؟
      ar: كيف تقول «جدّتي ما زالت قويّة» بالجاوية؟
      en: '"Grandma is still strong" in Javanese?'
    options: [Simbah isih kuwat., Simbah isih pegel., Simbah isih mriyang.]
    answer: 0
    explain:
      ar_eg: kuwat = قوي. pegel = متكسّر، mriyang = سخن.
      ar: kuwat = قويّ. أمّا pegel فمتعب، وmriyang فمحموم.
      en: kuwat = strong. pegel = aching, mriyang = feverish.
    words: [kuwat, pegel, mriyang]
  - id: e08
    type: build_sentence
    source:
      ar_eg: بطني جعانة، يلا ناكل!
      ar: بطني جائعة، هيّا نأكل!
      en: My tummy's hungry, let's eat!
    answer: Wetengku luwe, ayo mangan!
    distractors: [awak, obat]
    words: [weteng, awak, obat]
    explain:
      ar_eg: wetengku luwe = بطني جعانة، وayo mangan = يلا ناكل. awak = جسم، وobat = دوا، ومش في المعنى.
      ar: wetengku luwe = بطني جائعة، وayo mangan = هيا نأكل؛ أما awak فجسم، وobat دواء، وليسا في المعنى.
      en: wetengku luwe = my tummy's hungry, ayo mangan = let's eat. awak (body) and obat (medicine) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Awake Bayu kuwat lan sehat.
    answers_meaning:
      ar_eg: [جسم بايو قوي وبصحة كويسة, بايو جسمه قوي وصحته كويسة]
      ar: [جسم بايو قويّ وصحيح, بايو قويّ البنية وبصحّة جيّدة]
      en: ['Bayu''s body is strong and healthy', Bayu is strong and healthy]
    words: [awak, kuwat]
  - id: e10
    type: speaking
    text: Aku watuk. Ndang ngombe obat!
    meaning:
      ar_eg: أنا بكح. يلا آخد الدوا بسرعة!
      ar: أنا أسعل. هيّا أتناول الدواء بسرعة!
      en: I'm coughing. Quick, take the medicine!
    words: [watuk, ndang, obat]
dialogue:
  lines:
    - speaker: Sari
      text: Mohamed, kok meneng wae? Mriyang?
      ar_eg: يا محمد، ساكت ليه؟ سخنان؟
      ar: يا محمد، لماذا أنت صامت؟ هل عندك حمّى؟
      en: Mohamed, why so quiet? Got a fever?
    - speaker: Mohamed
      text: Aku mriyang lan watuk, Sari. Awakku pegel kabeh.
      ar_eg: أنا سخن وبكح يا ساري. جسمي كله متكسّر.
      ar: أنا محموم وأسعل يا ساري. جسمي كلّه متعب.
      en: I've a fever and a cough, Sari. I ache all over.
    - speaker: Sari
      text: Wis ngombe obat durung? Ibu duwe obat watuk lho.
      ar_eg: خدت دوا؟ ماما عندها دوا كحة.
      ar: هل تناولت دواء؟ عند أمّي دواء للسعال.
      en: Have you taken anything? Mum has cough medicine.
    - speaker: Mohamed
      text: Durung. Wetengku ya luwe, aku durung mangan.
      ar_eg: لسه. وبطني كمان جعانة، ما كلتش.
      ar: ليس بعد. وبطني جائعة أيضًا، لم آكل.
      en: Not yet. And my tummy's hungry, I haven't eaten.
    - speaker: Sari
      text: Mangan sega anget sik, ngombe obat, terus ndang turu!
      ar_eg: كُل رز دافي الأول، وخد الدوا، وبعدين نام على طول!
      ar: كُل أرزًّا دافئًا أوّلًا، وتناول الدواء، ثم نَم بسرعة!
      en: Eat some warm rice first, take the medicine, then off to bed!
