schema: kabar.lesson/v1
id: j4.u05.l01
language: jv
title: Ngoko alus
can_do:
  ar_eg: تبني نغوكو مهذّبة.
  ar: أن تبني نغوكو مهذّبة.
  en: Build polite ngoko.
slides:
  - title: Ngoko lugu, ngoko alus
    body:
      ar_eg: |
        في J3 الـ ngoko والـ krama كانوا صندوقين منفصلين. في الحقيقة الناس بتخلط، والخلطة ليها قواعد:
        - ngoko lugu (نغوكو سادة): كله نغوكو، للصحاب والأصغر. «Kowe arep lunga menyang ngendi?»
        - ngoko alus (نغوكو مهذبة): الكلمات الصغيرة نغوكو (wis، arep، ora، menyang، ngendi)، بس كل حاجة تخص الشخص اللي بتحترمه تبقى krama inggil: panjenengan أو اللقب (Mas، Mbak)، وأفعاله (tindak، dhahar، sare). «Panjenengan arep tindak menyang ngendi?»
        ngoko alus للناس القريبين منك بس أكبر: الأخ الكبير (kakang) أو الأخت الكبيرة (mbakyu)، وفي بيوت كتير الزوج أو الزوجة، وزميل أكبر صاحبك. زي ما تكلّم أخوك الكبير بالمصري العادي وتقوله «حضرتك» من وقت للتاني.
        - في الشارع: neng = menyang / ing (لـ، في)، sik = dhisik (الأول، استنى).
      ar: |
        عاملنا في J3 الـ ngoko والـ krama كصندوقين منفصلين، والناس في الحقيقة يمزجونهما بقواعد:
        - ngoko lugu (نغوكو خالصة): للأصدقاء ومن هو أصغر: «Kowe arep lunga menyang ngendi?»
        - ngoko alus (نغوكو مهذبة): ألفاظ الربط نغوكو (wis، arep، ora، menyang، ngendi)، وما يخص المعظَّم krama inggil: panjenengan أو اللقب (Mas، Mbak)، وأفعاله (tindak، dhahar، sare): «Panjenengan arep tindak menyang ngendi?»
        وهي لمن هو قريب وأكبر: الأخ الأكبر (kakang) والأخت الكبرى (mbakyu)، والزوج في كثير من البيوت، والزميل الأقدم الصديق؛ كأن تخاطب أخاك الأكبر بالعامية مع «حضرتك».
        - في كلام الشارع: neng = menyang / ing (إلى، في)، sik = dhisik (أوّلًا، لحظة).
      en: |
        In J3 ngoko and krama were two separate boxes. In real life people mix them, and the mix has rules:
        - ngoko lugu (plain ngoko): all ngoko, for friends and younger people. "Kowe arep lunga menyang ngendi?"
        - ngoko alus (polite ngoko): the little words stay ngoko (wis, arep, ora, menyang, ngendi), but anything about the person you honour becomes krama inggil: panjenengan or a title (Mas, Mbak), their actions (tindak, dhahar, sare). "Panjenengan arep tindak menyang ngendi?"
        It's for people who are close but senior: an older brother (kakang) or sister (mbakyu), a spouse in many homes, a senior colleague who's a friend. Like chatting to your older brother in everyday Egyptian Arabic but slipping in «حضرتك».
        - On the street: neng = menyang / ing (to, at), sik = dhisik (first, wait a bit).
    grammar: jv.speechlevel.mixed
    examples:
      - text: Kowe arep lunga menyang ngendi?
        ar_eg: رايح فين؟ (ngoko lugu، لصاحبك)
        ar: إلى أين تذهب؟ (ngoko lugu، للصديق)
        en: Where are you going? (ngoko lugu, to a friend)
      - text: Panjenengan arep tindak menyang ngendi?
        ar_eg: حضرتك رايح فين؟ (ngoko alus، لأخوك الكبير)
        ar: إلى أين تذهب؟ (ngoko alus، للأخ الأكبر)
        en: Where are you going? (ngoko alus, to an older brother)
  - title: Aku wis mangan, Mbak wis dhahar?
    body:
      ar_eg: |
        القاعدة الدهبية ما بتتغيرش: حاجتك إنت عادية. في ngoko alus بتغيّر بس الكلمات اللي بتشاور على الشخص المحترم.
        «Aku wis mangan. Mbak wis dhahar durung?» = أنا أكلت. وإنتي أكلتي ولا لسه؟
        aku وmangan ليك، وMbak وdhahar ليها.
      ar: |
        القاعدة الذهبية باقية: أفعالك عادية، وفي ngoko alus تبدّل فقط ما يشير إلى المعظَّم.
        «Aku wis mangan. Mbak wis dhahar durung?» = أكلتُ، وأنتِ هل أكلتِ؟
        فـ aku وmangan لك، وMbak وdhahar لها.
      en: |
        The golden rule stays: your own actions are plain. In ngoko alus you only swap the words that point at the person you honour.
        "Aku wis mangan. Mbak wis dhahar durung?" = I've eaten. Have you eaten yet?
        aku and mangan are yours; Mbak and dhahar are hers.
    grammar: jv.speechlevel.mixed
    examples:
      - text: Aku wis mangan. Mbak wis dhahar durung?
        ar_eg: أنا أكلت. وإنتي أكلتي ولا لسه؟ (لأختك الكبيرة)
        ar: أكلتُ، وأنتِ هل أكلتِ؟ (للأخت الكبرى)
        en: I've eaten. Have you eaten yet? (to an older sister)
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ngoko lugu
        ar_eg: نغوكو سادة (للصحاب)
        ar: نغوكو خالصة (للأصدقاء)
        en: plain ngoko (friends)
      - text: ngoko alus
        ar_eg: نغوكو + krama inggil للشخص (قريب بس أكبر)
        ar: نغوكو + krama inggil للمعظَّم (قريب وأكبر)
        en: ngoko + krama inggil for the person (close but senior)
      - text: krama
        ar_eg: الكلام المؤدب مع الغريب والبياع
        ar: الكلام المهذب مع الغريب والبائع
        en: the polite level for strangers and sellers
      - text: kakang
        ar_eg: الأخ الكبير
        ar: الأخ الأكبر
        en: older brother
    words: [ngoko lugu, ngoko alus, kakang]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة ngoko alus؟
      ar: أي جملة من ngoko alus؟
      en: Which sentence is ngoko alus?
    options: ['Kowe arep lunga menyang ngendi?', 'Panjenengan arep tindak menyang ngendi?', 'Sampeyan badhe kesah dhateng pundi?']
    answer: 1
    explain:
      ar_eg: هيكل نغوكو (arep، menyang، ngendi) + panjenengan وtindak للشخص. الأولى ngoko lugu، والتالتة كراما.
      ar: إطار نغوكو (arep، menyang، ngendi) مع panjenengan وtindak، والأولى ngoko lugu، والثالثة كراما.
      en: A ngoko frame (arep, menyang, ngendi) plus panjenengan and tindak. The first is ngoko lugu; the third is krama.
    words: [ngoko alus, ngoko lugu, tindak]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: مع مين غالبًا تتكلم ngoko alus؟
      ar: مع من تتكلم ngoko alus غالبًا؟
      en: Who typically gets ngoko alus?
    options: [kanca sing luwih enom, bakul ing peken, kakang]
    answer: 2
    explain:
      ar_eg: "الأخ الكبير قريب منك بس أكبر: ngoko alus. الصاحب الأصغر ngoko lugu، والبياع كراما."
      ar: الأخ الأكبر قريب وأكبر فله ngoko alus، والصديق الأصغر ngoko lugu، والبائع كراما.
      en: "An older brother is close but senior: ngoko alus. A younger friend gets ngoko lugu; a seller gets krama."
    words: [kakang, ngoko alus]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: Mas Dimas بيكلّم صاحبه محمد. أنهي مستوى؟
      ar: يكلّم Mas Dimas صديقه محمدًا. أي مستوى؟
      en: Mas Dimas is talking to his friend Mohamed. Which level?
    options: [ngoko lugu, ngoko alus, krama]
    answer: 0
    words: [ngoko lugu]
  - id: e05
    type: listen
    text: Mbak wis dhahar durung?
    options: ['Mbak wis mangan durung?', 'Mbak sampun dhahar?', 'Mbak wis dhahar durung?']
    answer: 2
    meaning:
      ar_eg: إنتي أكلتي ولا لسه؟ (ngoko alus)
      ar: هل أكلتِ؟ (ngoko alus)
      en: Have you eaten yet? (ngoko alus)
    words: [dhahar]
  - id: e06
    type: fill_blank
    sentence: Aku wis mangan. Mbak wis ___ durung?
    meaning:
      ar_eg: أنا أكلت. وإنتي أكلتي ولا لسه؟ (ngoko alus)
      ar: أكلتُ، وأنتِ هل أكلتِ؟ (ngoko alus)
      en: I've eaten. Have you eaten yet? (ngoko alus)
    options: [mangan, dhahar, nedha]
    answers: [dhahar]
    explain:
      ar_eg: أكلها هي، يبقى krama inggil (dhahar) حتى جوه جملة نغوكو.
      ar: أكلها هي فيكون dhahar ولو في جملة نغوكو.
      en: It's her eating, so krama inggil (dhahar), even inside a ngoko sentence.
    words: [ngoko alus, dhahar]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (ngoko alus، لأختك الكبيرة) إنتي رايحة فين؟
      ar: (ngoko alus، للأخت الكبرى) إلى أين تذهبين؟
      en: (ngoko alus, to your older sister) Where are you going?
    answer: Mbak arep tindak menyang ngendi?
    distractors: [badhe, lunga]
    words: [tindak, ngoko alus]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (ngoko alus، لأختك الكبيرة) أنا أكلت. وإنتي أكلتي؟
      ar: (ngoko alus، للأخت الكبرى) أكلتُ. وهل أكلتِ؟
      en: (ngoko alus, to your older sister) I've eaten. Have you eaten?
    answers: ['Aku wis mangan. Mbak wis dhahar?', 'Aku wis mangan. Mbak wis dhahar durung?', 'Aku wis mangan, Mbak wis dhahar?', 'Aku wis mangan. Panjenengan wis dhahar?', 'Aku wis mangan. Panjenengan wis dhahar durung?']
    explain:
      ar_eg: aku وmangan ليك (عاديين)، وMbak / panjenengan وdhahar ليها.
      ar: aku وmangan لك، وMbak / panjenengan وdhahar لها.
      en: aku and mangan are yours (plain); Mbak / panjenengan and dhahar are hers.
    words: [ngoko alus, dhahar]
  - id: e09
    type: speaking
    text: Kakangku wis kondur saka Kairo.
    meaning:
      ar_eg: "أخويا الكبير رجع من القاهرة. (ngoko alus: الرجوع بتاعه kondur)"
      ar: "عاد أخي الأكبر من القاهرة. (ngoko alus: رجوعه kondur)"
      en: "My older brother is back from Cairo. (ngoko alus: his return is kondur)"
    words: [kakang, ngoko alus]
dialogue:
  title: Ing omahe Mas Dimas
  lines:
    - speaker: Mas Dimas
      text: Mbak, panjenengan arep tindak menyang ngendi?
      ar_eg: يا أبلة، حضرتك رايحة فين؟
      ar: يا أختي، إلى أين تذهبين؟
      en: Sis, where are you going?
    - speaker: Mbak Ratri
      text: Neng Kotabaru, Dim. Kowe wis mangan?
      ar_eg: على كوتابارو يا دِيم. إنت أكلت؟
      ar: إلى كوتابارو يا ديم. هل أكلت؟
      en: To Kotabaru, Dim. Have you eaten?
    - speaker: Mas Dimas
      text: Wis, Mbak. Mbak wis dhahar durung?
      ar_eg: أكلت يا أبلة. وإنتي أكلتي ولا لسه؟
      ar: أكلتُ يا أختي. وأنتِ هل أكلتِ؟
      en: Yes. Have you eaten yet?
    - speaker: Mbak Ratri
      text: Durung. Mengko wae, sik.
      ar_eg: لسه. بعدين.
      ar: ليس بعد. لاحقًا.
      en: Not yet. Later.
    - speaker: Mohamed
      text: Mas, kok «panjenengan» karo mbakyumu?
      ar_eg: يا دِيماس، إزاي بتقول «panjenengan» لأختك؟
      ar: يا ديماس، لماذا تقول «panjenengan» لأختك؟
      en: Dimas, how come you say «panjenengan» to your sister?
    - speaker: Mas Dimas
      text: Iku ngoko alus, Mohamed. Mbakku luwih tuwa.
      ar_eg: دي ngoko alus يا محمد. أختي أكبر مني.
      ar: هذه ngoko alus يا محمد. أختي أكبر مني.
      en: That's ngoko alus, Mohamed. My sister is older.
new_words:
  - word: ngoko lugu
    pos: noun
    ar_eg: نغوكو سادة (كلها نغوكو، للصحاب والأصغر)
    ar: نغوكو خالصة (للأصدقاء ومن هو أصغر)
    en: plain ngoko (all ngoko, for friends and younger people)
  - word: ngoko alus
    pos: noun
    ar_eg: نغوكو مهذّبة (نغوكو + krama inggil للشخص المحترم)
    ar: نغوكو مهذّبة (نغوكو + krama inggil للمعظَّم)
    en: polite ngoko (ngoko + krama inggil for the honoured person)
  - word: kakang
    pos: noun
    ar_eg: الأخ الكبير (نغوكو؛ وفي الكلام Kang أو Mas)
    ar: الأخ الأكبر (نغوكو؛ ويُنادى Kang أو Mas)
    en: older brother (ngoko; addressed as Kang or Mas) = kakak laki-laki
