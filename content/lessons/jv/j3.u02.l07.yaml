schema: kabar.lesson/v1
id: j3.u02.l07
language: jv
title: Ngajeng lan wingking
can_do:
  ar_eg: 'تلفّ في بيت كبير في السن: هنا وهناك، جوّه وبرّه، قدّام وورا، وتقول إن المكان هادي وإنك كسلان.'
  ar: 'أن تتجوّل في بيت شخص مسنّ: هنا وهناك، داخل وخارج، أمام وخلف، وتقول إن المكان هادئ وإنك كسول.'
  en: 'Find your way round an elder''s house: here and there, inside and outside, front and back, and say it''s quiet or you''re lazy.'
slides:
  - title: Ing griya Mbah
    body:
      ar_eg: |
        ngene/kene ← ngriki = هنا. mrana ← mrika = لهناك (رايح لهناك).
        njero ← lebet = جوّه. njaba ← jawi = برّه. (Jawi كمان يعني «جاوة» بالكراما: tiyang Jawi = جاوي.)
        ngarep ← ngajeng = قدّام. mburi ← wingking = ورا: الحمّام والمطبخ دايمًا «ing wingking».
        sepi ← sepen = هادي، فاضي من الناس. kesed = كسلان (نغوكو).
      ar: |
        kene ← ngriki = هنا. mrana ← mrika = إلى هناك.
        njero ← lebet = داخل. njaba ← jawi = خارج. (Jawi تعني أيضًا «جاوة» بالكراما: tiyang Jawi = جاويّ.)
        ngarep ← ngajeng = أمام. mburi ← wingking = خلف: الحمّام والمطبخ دائمًا «ing wingking».
        sepi ← sepen = هادئ، خالٍ من الناس. kesed = كسول (نغوكو).
      en: |
        kene → ngriki = here. mrana → mrika = (to) over there.
        njero → lebet = inside. njaba → jawi = outside. (Jawi is also krama for Java: tiyang Jawi = a Javanese person.)
        ngarep → ngajeng = front. mburi → wingking = back: the bathroom and kitchen are always "ing wingking".
        sepi → sepen = quiet, empty of people. kesed = lazy (ngoko).
    examples:
      - text: Mangga mlebet, ing lebet langkung kepenak.
        ar_eg: اتفضل ادخل، جوّه أريح.
        ar: تفضّل بالدخول، في الداخل أريح.
        en: Please come in, it's more comfortable inside.
      - text: Kamar mandi ing wingking, Nak.
        ar_eg: الحمّام ورا يا ابني.
        ar: الحمّام في الخلف يا بنيّ.
        en: The bathroom is at the back, dear.
      - text: Aku kesed adus, Mas.
        ar_eg: أنا كسلان أستحمّى يا عم.
        ar: أنا كسول عن الاستحمام يا أخي.
        en: I can't be bothered to shower, mate.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ngriki
        ar_eg: هنا (كراما)
        ar: هنا (كراما)
        en: here (krama)
      - text: mrika
        ar_eg: لهناك (كراما)
        ar: إلى هناك (كراما)
        en: (to) over there (krama)
      - text: lebet
        ar_eg: جوّه (كراما)
        ar: داخل (كراما)
        en: inside (krama)
      - text: jawi
        ar_eg: برّه (كراما)
        ar: خارج (كراما)
        en: outside (krama)
    words: [ngriki, mrika, lebet, jawi]
  - id: e02
    type: match_pairs
    pairs:
      - text: ngajeng
        ar_eg: قدّام (كراما)
        ar: أمام (كراما)
        en: front (krama)
      - text: wingking
        ar_eg: ورا (كراما)
        ar: خلف (كراما)
        en: back, behind (krama)
      - text: sepen
        ar_eg: هادي، مفيش ناس (كراما)
        ar: هادئ، خالٍ (كراما)
        en: quiet, deserted (krama)
      - text: kesed
        ar_eg: كسلان
        ar: كسول
        en: lazy
    words: [ngajeng, wingking, sepen, kesed]
  - id: e03
    type: listen
    text: Sandalipun dipunpasang ing jawi, Nak.
    question:
      ar_eg: الشبشب يتحط فين؟
      ar: أين يوضع الشبشب؟
      en: Where do the sandals go?
    options: [الشبشب يتحط برّه, الشبشب يتحط جوّه, الشبشب يتحط ورا]
    answer: 0
    meaning:
      ar_eg: الشبشب يتحط برّه يا ابني.
      ar: يُترك الشبشب في الخارج يا بنيّ.
      en: Leave your sandals outside, dear.
    words: [jawi, lebet, wingking]
  - id: e04
    type: fill_blank
    sentence: Pawon ing ___, celak kamar mandi.
    meaning:
      ar_eg: المطبخ ___، جنب الحمّام.
      ar: المطبخ في ___، قرب الحمّام.
      en: The kitchen is at the ___, near the bathroom.
    options: [wingking, ngajeng, ngriki]
    answers: [wingking]
    words: [wingking, ngajeng, ngriki]
  - id: e05
    type: multiple_choice
    question: njero (ngoko) → ___ (krama)
    options: [jawi, lebet, sepen]
    answer: 1
    explain:
      ar_eg: 'njero بالنغوكو، lebet بالكراما: جوّه. jawi = برّه.'
      ar: 'njero بالنغوكو وlebet بالكراما: داخل. jawi = خارج.'
      en: 'njero is ngoko, lebet is krama: inside. jawi = outside.'
    words: [lebet, jawi, sepen]
  - id: e06
    type: fill_blank
    sentence: Griyanipun Mbah ___ sanget, namung Mbah lan kucing.
    meaning:
      ar_eg: بيت جدّتي ___ أوي، جدّتي والقطة بس.
      ar: بيت الجدّة ___ جدًا، لا يوجد إلا الجدّة والقطّة.
      en: Grandma's house is very ___, just her and the cat.
    options: [sepen, kesed, mrika]
    answers: [sepen]
    words: [sepen, kesed, mrika]
  - id: e07
    type: build_sentence
    source:
      ar_eg: اتفضل هنا يا ابني.
      ar: تفضّل هنا يا بنيّ.
      en: Please, over here, dear.
    answer: Mangga ing ngriki, Nak
    distractors: [mrika, jawi]
    words: [ngriki, mrika]
  - id: e08
    type: translate
    direction: from_target
    source_text: Mohamed kesed, dereng adus.
    answers_meaning:
      ar_eg: [محمد كسلان، لسه ما استحمّاش, محمد كسلان ولسه ما خدش دش]
      ar: [محمد كسول، لم يستحمّ بعد]
      en: ['Mohamed is lazy, he hasn''t showered yet', 'Mohamed is being lazy and hasn''t showered yet']
    words: [kesed]
  - id: e09
    type: speaking
    text: Mangga mrika, ing ngajeng langkung padhang.
    meaning:
      ar_eg: اتفضل لهناك، قدّام أنوَر.
      ar: تفضّل إلى هناك، في الأمام أكثر إضاءة.
      en: Go on over there, it's brighter at the front.
    words: [mrika, ngajeng]
  - id: e10
    type: multiple_choice
    question: mburi (ngoko) → ___ (krama)
    options: [ngajeng, wingking, ngriki]
    answer: 1
    explain:
      ar_eg: 'mburi بالنغوكو، wingking بالكراما: ورا. ngajeng = قدّام.'
      ar: 'mburi بالنغوكو وwingking بالكراما: خلف. ngajeng = أمام.'
      en: 'mburi is ngoko, wingking is krama: back. ngajeng = front.'
    words: [wingking, ngajeng, ngriki, kesed]
dialogue:
  lines:
    - speaker: Mbah Putri
      text: Mangga, Nak, ing ngriki mawon. Ing lebet langkung kepenak.
      ar_eg: اتفضل يا ابني، هنا أحسن. جوّه أريح.
      ar: تفضّل يا بنيّ، هنا أفضل. في الداخل أريح.
      en: Come, dear, right here. It's more comfortable inside.
    - speaker: Mohamed
      text: Matur nuwun, Mbah. Sandal kula ing jawi, nggih?
      ar_eg: متشكر يا جدّتي. الشبشب بتاعي برّه، صح؟
      ar: شكرًا يا جدّتي. شبشبي في الخارج، أليس كذلك؟
      en: Thank you, Grandma. My sandals stay outside, right?
    - speaker: Mbah Putri
      text: Nggih. Kamar mandi lan pawon ing wingking.
      ar_eg: أيوه. الحمّام ورا، والمطبخ كمان.
      ar: نعم. الحمّام في الخلف، والمطبخ أيضًا.
      en: Yes. The bathroom's at the back, and so is the kitchen.
    - speaker: Mas Dimas
      text: Med, adus dhisik kana. Aja kesed!
      ar_eg: يا مِد، روح استحمّى الأول. ما تكسلش!
      ar: يا مِد، اذهب واستحمّ أولًا. لا تتكاسل!
      en: Med, go and shower first. Don't be lazy!
    - speaker: Mohamed
      text: Iya, iya. Griyanipun Mbah sepen nggih, kepenak.
      ar_eg: حاضر، حاضر. بيت جدّتك هادي، مريح.
      ar: حسنًا، حسنًا. بيت جدّتك هادئ ومريح.
      en: OK, OK. Grandma's house is quiet, isn't it? So nice.
    - speaker: Mbah Putri
      text: Mangga mrika, Nak. Teh angetipun ing ngajeng.
      ar_eg: اتفضل لهناك يا ابني. قدّام فيه شاي سخن.
      ar: تفضّل إلى هناك يا بنيّ. في الأمام شاي ساخن.
      en: Go on over, dear. There's warm tea at the front.
new_words:
  - word: ngriki
    pos: adverb
    ar_eg: هنا (كراما من kene)
    ar: هنا (كراما من kene)
    en: here, krama (ngoko kene, Indonesian sini)
  - word: mrika
    pos: adverb
    ar_eg: لهناك (كراما من mrana)
    ar: إلى هناك (كراما من mrana)
    en: (to) over there, krama (ngoko mrana, Indonesian ke sana)
  - word: lebet
    pos: noun
    ar_eg: جوّه (كراما من njero)
    ar: داخل (كراما من njero)
    en: inside, krama (ngoko njero, Indonesian dalam)
  - word: jawi
    pos: noun
    ar_eg: 'برّه (كراما من njaba)؛ كمان: جاوة'
    ar: 'خارج (كراما من njaba)؛ وأيضًا: جاوة'
    en: outside, krama (ngoko njaba, Indonesian luar); also krama for Java
  - word: ngajeng
    pos: noun
    ar_eg: قدّام (كراما من ngarep)
    ar: أمام (كراما من ngarep)
    en: front, krama (ngoko ngarep, Indonesian depan)
  - word: wingking
    pos: noun
    ar_eg: ورا (كراما من mburi)
    ar: خلف (كراما من mburi)
    en: back, behind, krama (ngoko mburi, Indonesian belakang)
  - word: sepen
    pos: adjective
    ar_eg: هادي، مفيش ناس (كراما من sepi)
    ar: هادئ، خالٍ (كراما من sepi)
    en: quiet, deserted, krama (ngoko sepi)
  - word: kesed
    pos: adjective
    ar_eg: كسلان
    ar: كسول
    en: lazy (= malas)
