dialogue:
  title: Warung cedhak stasiun
  lines:
    - speaker: Bu Siti
      text: Mas, sampéyan sampun nedha?
      ar_eg: يا أستاذ، حضرتك كلت؟
      ar: يا أخي، هل أكلتَ؟
      en: Have you eaten, young man?
    - speaker: Mohamed
      text: Dèrèng, Bu.
      ar_eg: لسه يا مدام.
      ar: ليس بعد يا سيدتي.
      en: Not yet, ma'am.
    - speaker: Bu Siti
      text: Mangga, Mas!
      ar_eg: اتفضل يا أستاذ!
      ar: تفضّل يا أخي!
      en: Please, go ahead!
    - speaker: Mohamed
      text: Matur nuwun, Bu.
      ar_eg: شكرًا يا مدام.
      ar: شكرًا يا سيدتي.
      en: Thank you, ma'am.
    - speaker: Mas Dimas
      text: Piyé, Mohamed, wis mangan?
      ar_eg: إيه يا محمد، كلت؟
      ar: ها يا محمد، أكلت؟
      en: So, Mohamed, have you eaten?
    - speaker: Mohamed
      text: Wis, Mas! Enak tenan.
      ar_eg: آه يا دِيماس! حلو أوي.
      ar: نعم يا ديماس! لذيذ جدًا.
      en: Yes, Dimas! Really tasty.
new_words:
  - word: inggih
    pos: interjection
    ar_eg: أيوه (krama لـ iya) = ya
    ar: نعم (krama لـ iya) = ya
    en: yes (krama for iya) = ya
  - word: dèrèng
    pos: adverb
    ar_eg: لسه / لم بعد (krama لـ durung، chat dereng) = belum
    ar: ليس بعد (krama لـ durung) = belum
    en: not yet (krama for durung; chat dereng) = belum
  - word: mangga
    pos: interjection
    ar_eg: اتفضل (krama، chat monggo) = silakan
    ar: تفضّل (krama) = silakan
    en: please, go ahead (krama; chat monggo) = silakan
