    explain:
      ar_eg: "wis وmangan ngoko، وده صاحبك: kowé."
      ar: "wis وmangan من الـ ngoko والمخاطَب صديقك: kowé."
      en: wis and mangan are ngoko, and he's your friend — kowé.
    words: [kowé]
