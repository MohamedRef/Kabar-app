schema: kabar.lesson/v1
id: j3.u01.l02
language: jv
title: Kowé wis mangan?
can_do:
  ar_eg: تقارن نفس الجملة في المستويات التلاتة.
  ar: أن تقارن الجملة نفسها في المستويات الثلاثة.
  en: Compare one sentence across the speech levels.
slides:
  - title: Siji ukara, telung tingkat
    body:
      ar_eg: |
        في الجاوي «كلت؟» سؤال أدب زي «إزيك» عندنا. وده أحسن مثال يوريك إزاي المستويات بتغيّر الكلمات. بص كلمة كلمة:
        - kowé ← sampéyan ← panjenengan (إنت ← حضرتك ← سيادتك)
        - wis ← sampun ← sampun (sudah)
        - mangan ← nedha ← dhahar (makan)
        في الإندونيسي الجملة واحدة تقريبًا: Kamu sudah makan? / Bapak sudah makan? — الضمير بس اللي بيتغير. في الجاوي الفعل نفسه بيتغير.
      ar: |
        سؤال «هل أكلت؟» في الجاوية من آداب التحية، وهو خير مثال على تغيّر الألفاظ بين المستويات. انظر كلمة كلمة:
        - kowé ← sampéyan ← panjenengan (أنت ← حضرتك ← سيادتك)
        - wis ← sampun ← sampun (sudah)
        - mangan ← nedha ← dhahar (makan)
        وفي الإندونيسية تبقى الجملة تقريبًا كما هي: Kamu sudah makan? / Bapak sudah makan? ويتغير الضمير وحده، أما في الجاوية فيتغير الفعل نفسه.
      en: |
        "Have you eaten?" is a friendly greeting in Javanese, and the best example of how levels swap words. Look word by word:
        - kowé → sampéyan → panjenengan (إنت → حضرتك → سيادتك)
        - wis → sampun → sampun (sudah)
        - mangan → nedha → dhahar (makan)
        In Indonesian the sentence barely changes: Kamu sudah makan? / Bapak sudah makan? — only the pronoun moves. In Javanese the verb itself changes.
    grammar: jv.speechlevel.overview
    examples:
      - text: Kowé wis mangan?
        ar_eg: كلت؟ (ngoko — chat Kowe wis mangan?)
        ar: هل أكلت؟ (ngoko)
        en: Have you eaten? (ngoko — chat Kowe wis mangan?)
      - text: Sampéyan sampun nedha?
        ar_eg: حضرتك كلت؟ (krama)
        ar: هل أكلتَ؟ (krama)
        en: Have you eaten? (krama)
      - text: Panjenengan sampun dhahar?
        ar_eg: سيادتك اتفضلت أكلت؟ (krama inggil)
        ar: هل تفضلتم بالأكل؟ (krama inggil)
        en: Have you eaten? (krama inggil)
  - title: Koen wis mangan ta, rek?
    body:
      ar_eg: |
        فاكر سورابايا؟ هناك بيقولوا koen بدل kowé، وrek يعني «يا جدع / يا صاحبي». دي برضه ngoko، بس بنكهة Arek.
        وفي الشات هتلاقي: wes mangan durung? (كلت ولا لسه؟).
      ar: |
        أتذكر سورابايا؟ هناك يقولون koen بدل kowé، وrek بمعنى «يا صاحبي». وهذه أيضًا ngoko لكن بلهجة Arek.
        وفي الدردشة: wes mangan durung? (أأكلت أم بعد؟).
      en: |
        Remember Surabaya? There they say koen for kowé, and rek means "mate". This is still ngoko, just Arek-flavoured.
        In chats you'll see: wes mangan durung? (eaten yet or not?).
    grammar: jv.speechlevel.overview
    examples:
      - text: Koen wis mangan ta, rek?
        ar_eg: كلت ولا لأ يا صاحبي؟ (ngoko، Arek)
        ar: أكلتَ، أليس كذلك يا صاحبي؟ (ngoko، Arek)
        en: You've eaten, right, mate? (ngoko, Arek)
  - title: Inggih lan dèrèng
    body:
      ar_eg: |
        لو حد سألك بالكراما، رد بالكراما:
        - iya ← inggih (ya) = أيوه
        - wis ← sampun (sudah) = آه، خلاص
        - durung ← dèrèng (belum) = لسه. في الشات dereng.
        - aku ← kula (saya) = أنا. في الشات kulo.
        ولصاحبك ردّ عادي: «Wis.» أو «Durung.»
      ar: |
        إذا سُئلت بالكراما فأجب بالكراما:
        - iya ← inggih (ya) = نعم
        - wis ← sampun (sudah) = نعم، قد فعلت
        - durung ← dèrèng (belum) = ليس بعد، وفي الدردشة dereng
        - aku ← kula (saya) = أنا، وفي الدردشة kulo
        ومع الصديق: «Wis.» أو «Durung.»
      en: |
        If someone asks you in krama, answer in krama:
        - iya → inggih (ya) = yes
        - wis → sampun (sudah) = yes, already
        - durung → dèrèng (belum) = not yet; chat dereng
        - aku → kula (saya) = I; chat kulo
        To a friend just say "Wis." or "Durung."
    grammar: jv.speechlevel.overview
    examples:
      - text: Inggih, kula sampun nedha.
        ar_eg: أيوه، أنا كلت.
        ar: نعم، قد أكلتُ.
        en: Yes, I've eaten.
      - text: Dèrèng, Bu.
        ar_eg: لسه يا مدام.
        ar: ليس بعد يا سيدتي.
        en: Not yet, ma'am.
  - title: Dhahar mung kanggo liyan
    body:
      ar_eg: |
        خد بالك: لما بتتكلم عن نفسك، عمرك ما تستخدم dhahar أو panjenengan. دول للشخص اللي بتحترمه بس.
        السؤال للجدة: «Panjenengan sampun dhahar?» — والرد عن نفسك: «Kula sampun nedha.»
        زي ما مش هتقول عن نفسك «أنا سيادتي».
      ar: |
        تنبّه: لا تستعمل dhahar ولا panjenengan عن نفسك أبدًا، فهما للمعظَّم فقط.
        تسأل الجدة: «Panjenengan sampun dhahar?» وتجيب عن نفسك: «Kula sampun nedha.»
        كما لا تقول عن نفسك «أنا سيادتي».
      en: |
        Careful: never use dhahar or panjenengan about yourself. They're only for the person you honour.
        You ask Grandma: "Panjenengan sampun dhahar?" — and answer about yourself: "Kula sampun nedha."
        Just as you'd never call yourself «سيادتي».
    grammar: jv.speechlevel.overview
    examples:
      - text: Mbah, panjenengan sampun dhahar?
        ar_eg: يا تيتة، حضرتك أكلتي؟
        ar: يا جدتي، هل تفضلتِ بالأكل؟
        en: Grandma, have you eaten?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kowé
        ar_eg: بالكراما sampéyan
        ar: بالكراما sampéyan
        en: in krama → sampéyan
      - text: wis
        ar_eg: بالكراما sampun
        ar: بالكراما sampun
        en: in krama → sampun
      - text: mangan
        ar_eg: بالكراما nedha
        ar: بالكراما nedha
        en: in krama → nedha
      - text: iya
        ar_eg: بالكراما inggih
        ar: بالكراما inggih
        en: in krama → inggih
      - text: durung
        ar_eg: بالكراما dèrèng
        ar: بالكراما dèrèng
        en: in krama → dèrèng
    words: [sampéyan, sampun, nedha, inggih, dèrèng]
  - id: e02
    type: multiple_choice
    question: Koen wis mangan ta, rek?
    question_meaning:
      ar_eg: الجملة دي في أنهي مستوى؟
      ar: في أيّ مستوى هذه الجملة؟
      en: Which level is this sentence?
    options: ["krama", "krama inggil", "ngoko"]
    answer: 2
    explain:
      ar_eg: koen وwis وmangan وrek كلها ngoko (بنكهة سورابايا).
      ar: koen وwis وmangan وrek كلها من الـ ngoko بلهجة سورابايا.
      en: koen, wis, mangan and rek are all ngoko (Surabaya flavour).
    words: [koen, rek]
  - id: e03
    type: multiple_choice
    question: Sampéyan sampun nedha?
    question_meaning:
      ar_eg: Bu Siti سألتك كده، وإنت كلت. ترد إزاي؟
      ar: سألتك Bu Siti هكذا وقد أكلت. بمَ تجيب؟
      en: Bu Siti asks you this, and you have eaten. How do you answer?
    options: ["Iya, aku wis dhahar.", "Inggih, kula sampun dhahar.", "Inggih, kula sampun nedha."]
    answer: 2
    explain:
      ar_eg: "عن نفسك krama عادية: kula + nedha. dhahar للتاني بس."
      ar: "عن نفسك krama عادية: kula مع nedha، وdhahar للمخاطَب المعظَّم."
      en: About yourself use plain krama, kula + nedha; dhahar is only for others.
    words: [inggih, kula, nedha]
  - id: e04
    type: listen
    text: Dèrèng, Bu.
    options: ["Sampun, Bu.", "Dèrèng, Bu.", "Durung, Bu."]
    answer: 1
    words: [dèrèng]
  - id: e05
    type: fill_blank
    sentence: Sampéyan ___ nedha?
    meaning:
      ar_eg: حضرتك كلت؟
      ar: هل أكلتَ؟
      en: Have you eaten?
    options: ["sampun", "wis", "durung"]
    answers: [sampun]
    explain:
      ar_eg: "sampéyan وnedha كراما، فـ«خلاص» كمان كراما: sampun."
      ar: sampéyan وnedha من الكراما، فتكون sampun لا wis.
      en: sampéyan and nedha are krama, so "already" is krama too — sampun.
    words: [sampun]
  - id: e06
    type: fill_blank
    sentence: ___ wis mangan, Mas?
    meaning:
      ar_eg: كلت يا صاحبي؟ (لصاحبك Dimas)
      ar: هل أكلت يا أخي؟ (لصديقك Dimas)
      en: Have you eaten, mate? (to your friend Dimas)
