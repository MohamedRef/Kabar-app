schema: kabar.lesson/v1
id: j3.u01.l06
language: jv
title: Badhe tumbas kalih
can_do:
  ar_eg: 'تشتري باكبيا من كشك المحطة بالكراما: تقول عايز تشتري، اتنين وخمسة، فلوس، عشان مين ورايح فين.'
  ar: 'أن تشتري الباكبيا من كشك المحطة بالكراما: تقول تريد أن تشتري، اثنان وخمسة، المال، لمن وإلى أين.'
  en: 'Buy bakpia at the station kiosk in krama: say you''d like to buy, two and five, money, who it''s for and where you''re going.'
slides:
  - title: Ing kios stasiun
    body:
      ar_eg: |
        arep ← badhe = هـ، عايز: «Kula badhe tumbas» = عايز أشتري.
        tuku ← tumbas = يشتري. dhuwit ← arta = فلوس.
        loro ← kalih = اتنين. lima ← gangsal = خمسة.
        kanggo ← kangge = عشان، لـ: «kangge Ibu» = لماما.
        menyang/neng ← dhateng = لـ، رايح على: «dhateng Kauman» = لكاومان. في الشارع: teng.
      ar: |
        arep ← badhe = سوف، يريد: «Kula badhe tumbas» = أريد أن أشتري.
        tuku ← tumbas = يشتري. dhuwit ← arta = مال.
        loro ← kalih = اثنان. lima ← gangsal = خمسة.
        kanggo ← kangge = لِـ، من أجل: «kangge Ibu» = لأمي.
        menyang/neng ← dhateng = إلى: «dhateng Kauman» = إلى كاومان. وفي الشارع: teng.
      en: |
        arep → badhe = will, want to: "Kula badhe tumbas" = I'd like to buy.
        tuku → tumbas = buy. dhuwit → arta = money.
        loro → kalih = two. lima → gangsal = five.
        kanggo → kangge = for: "kangge Ibu" = for Mum.
        menyang/neng → dhateng = to: "dhateng Kauman" = to Kauman. On the street: teng.
    examples:
      - text: Kula badhe tumbas bakpia kalih kotak.
        ar_eg: عايز أشتري علبتين باكبيا.
        ar: أريد أن أشتري علبتين من الباكبيا.
        en: I'd like to buy two boxes of bakpia.
      - text: Setunggal kangge Mbah, setunggal kangge kula.
        ar_eg: واحدة لتيتة وواحدة ليّا.
        ar: واحدة للجدّة وواحدة لي.
        en: One for Grandma, one for me.
      - text: Kula badhe dhateng Kauman.
        ar_eg: أنا رايح كاومان.
        ar: سأذهب إلى كاومان.
        en: I'm going to Kauman.
