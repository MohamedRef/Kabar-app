  - id: e03
    type: listen
    text: Kula badhe tumbas bakpia kalih kotak.
    question:
      ar_eg: محمد عايز كام علبة؟
      ar: كم علبة يريد محمد؟
      en: How many boxes does Mohamed want?
    options: [عايز علبتين باكبيا, عايز خمس علب باكبيا, عايز أبيع باكبيا]
    answer: 0
    meaning:
      ar_eg: عايز أشتري علبتين باكبيا.
      ar: أريد أن أشتري علبتين من الباكبيا.
      en: I'd like to buy two boxes of bakpia.
    words: [badhe, tumbas, kalih, gangsal]
  - id: e04
    type: fill_blank
    sentence: Bakpia punika ___ Mbah Putri.
    meaning:
      ar_eg: الباكبيا دي ___ تيتة بوتري.
      ar: هذه الباكبيا ___ الجدّة بوتري.
      en: This bakpia is ___ Mbah Putri.
    options: [kangge, dhateng, arta]
    answers: [kangge]
    words: [kangge, dhateng, arta]
  - id: e05
    type: multiple_choice
    question: lima (ngoko) → ___ (krama)
    options: [kalih, gangsal, badhe]
    answer: 1
    explain:
      ar_eg: 'lima بالنغوكو، gangsal بالكراما: خمسة. kalih = اتنين.'
      ar: 'lima بالنغوكو وgangsal بالكراما: خمسة. kalih = اثنان.'
      en: 'lima is ngoko, gangsal is krama: five. kalih = two.'
    words: [gangsal, kalih, badhe]
  - id: e06
    type: fill_blank
    sentence: Nyuwun sewu, Bu, ___ kula kirang.
    meaning:
      ar_eg: معلش يا ست، ___ي مش مكفّية.
      ar: عفوًا يا سيدتي، ___ي لا يكفي.
      en: Sorry, ma'am, I haven't got enough ___.
    options: [arta, tumbas, kangge]
    answers: [arta]
    words: [arta, tumbas, kangge]
  - id: e07
    type: build_sentence
    source:
      ar_eg: أنا رايح كاومان.
      ar: سأذهب إلى كاومان.
      en: I'm going to Kauman.
    answer: Kula badhe dhateng Kauman
    distractors: [tumbas, kalih]
    words: [badhe, dhateng]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kula tumbas gangsal kangge kanca-kanca.
    answers_meaning:
      ar_eg: [أنا هشتري خمسة لصحابي, بشتري خمسة لأصحابي]
      ar: [أشتري خمسة لأصدقائي, سأشتري خمسة لأصدقائي]
      en: ['I''m buying five for my friends', 'I''ll buy five for my friends']
    words: [tumbas, gangsal, kangge]
  - id: e09
    type: speaking
    text: Kula badhe dhateng peken, tumbas kalih.
    meaning:
      ar_eg: أنا رايح السوق، هشتري اتنين.
      ar: سأذهب إلى السوق لأشتري اثنين.
      en: I'm off to the market to buy two.
    words: [badhe, dhateng, kalih]
  - id: e10
    type: multiple_choice
    question: dhuwit (ngoko) → ___ (krama)
    options: [arta, dhateng, kalih]
    answer: 0
    explain:
      ar_eg: 'dhuwit بالنغوكو، arta بالكراما: فلوس. dhateng = لـ.'
      ar: 'dhuwit بالنغوكو وarta بالكراما: مال. dhateng = إلى.'
      en: 'dhuwit is ngoko, arta is krama: money. dhateng = to.'
    words: [arta, dhateng, kalih]
dialogue:
  lines:
    - speaker: Penjual
      text: Monggo, Mas. Badhe tumbas napa?
      ar_eg: اتفضل يا أستاذ. عايز تشتري إيه؟
      ar: تفضّل يا أخي. ماذا تريد أن تشتري؟
      en: Come on over, mate. What would you like?
    - speaker: Mohamed
      text: "Bakpia kalih kotak, Bu. Kangge Mbah Putri."
      ar_eg: "علبتين باكبيا يا ست. لتيتة بوتري."
      ar: "علبتان من الباكبيا يا سيدتي. للجدّة بوتري."
      en: "Two boxes of bakpia, ma'am. They're for Mbah Putri."
    - speaker: Penjual
      text: Nggih. Kalih kotak, sewidak ewu.
      ar_eg: ماشي. علبتين بستين ألف.
      ar: حسنًا. علبتان بستين ألفًا.
      en: Sure. Two boxes, sixty thousand.
    - speaker: Mohamed
      text: "Waduh, arta kula seket gangsal."
      ar_eg: "يا خبر، معايا خمسة وخمسين."
      ar: "يا للمصيبة، معي خمسة وخمسون."
      en: "Oh dear, I've got fifty-five."
    - speaker: Penjual
      text: "Mpun, seket gangsal. Badhe teng pundi, Mas?"
      ar_eg: "خلاص، خمسة وخمسين. رايح فين يا أستاذ؟"
      ar: "حسنًا، خمسة وخمسون. إلى أين أنت ذاهب يا أخي؟"
      en: "Go on, fifty-five. Where are you off to?"
    - speaker: Mohamed
      text: Dhateng Kauman, Bu. Matur nuwun sanget!
      ar_eg: رايح كاومان يا ست. متشكر جدًا!
      ar: إلى كاومان يا سيدتي. شكرًا جزيلًا!
      en: To Kauman, ma'am. Thanks so much!
new_words:
  - word: badhe
    pos: particle
    ar_eg: هـ، عايز (كراما من arep)
    ar: سوف، يريد (كراما من arep)
    en: will, want to, krama (ngoko arep, Indonesian akan/mau)
  - word: tumbas
    pos: verb
    ar_eg: يشتري (كراما من tuku)
    ar: يشتري (كراما من tuku)
    en: buy, krama (ngoko tuku, Indonesian beli)
  - word: arta
    pos: noun
    ar_eg: فلوس (كراما من dhuwit)
    ar: مال (كراما من dhuwit)
    en: money, krama (ngoko dhuwit, Indonesian uang)
  - word: dhateng
    pos: preposition
    ar_eg: لـ، رايح على (كراما من menyang/neng؛ في الشارع teng)
    ar: إلى (كراما من menyang/neng؛ وفي الشارع teng)
    en: to, krama (ngoko menyang/neng, street teng, Indonesian ke)
  - word: kalih
    pos: number
    ar_eg: اتنين (كراما من loro)
    ar: اثنان (كراما من loro)
    en: two, krama (ngoko loro, Indonesian dua)
  - word: gangsal
    pos: number
    ar_eg: خمسة (كراما من lima)
    ar: خمسة (كراما من lima)
    en: five, krama (ngoko lima, Indonesian lima)
  - word: kangge
    pos: preposition
    ar_eg: عشان، لـ (كراما من kanggo)
    ar: لِـ، من أجل (كراما من kanggo)
    en: for, krama (ngoko kanggo, Indonesian untuk)
