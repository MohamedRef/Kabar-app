schema: kabar.lesson/v1
id: j5.u03.l04
language: jv
title: Teges lan huruf
can_do:
  ar_eg: تسأل عن معنى كلمة ونطقها، وتطلب حد يعيد، وتقول «مش عارف».
  ar: أن تسأل عن معنى كلمة ونطقها، وتطلب الإعادة، وتقول «لا أعرف».
  en: Ask what a word means and how to say it, ask someone to repeat, and say 'dunno'.
slides:
  - title: Takon tegese
    body:
      ar_eg: |
        teges = معنى: Apa tegese …? = يعني إيه …؟ huruf = حرف (زي العربي).
        pitakonan = سؤال، mbaleni = يعيد (Tulung dibaleni = عيدها لو سمحت)، pener = صح، مظبوط.
        nyebut = ينطق أو يذكر، niru = يقلّد. embuh = «مش عارف»، بس دي نغوكو ناشفة: مع الكبار قول «mboten ngertos».
      ar: |
        teges = معنى: Apa tegese …? = ما معنى …؟ huruf = حرف (من العربية).
        pitakonan = سؤال، mbaleni = يعيد (Tulung dibaleni = أعدها من فضلك)، pener = صحيح، مضبوط.
        nyebut = ينطق أو يذكر، niru = يقلّد. embuh = «لا أدري»، لكنها نغوكو جافة؛ مع الكبار قل «mboten ngertos».
      en: |
        teges = meaning: Apa tegese …? = What does … mean? huruf = letter (from Arabic).
        pitakonan = question, mbaleni = repeat (Tulung dibaleni = please say it again), pener = correct, right.
        nyebut = say, pronounce, mention; niru = imitate. embuh = "dunno", blunt ngoko: with elders say "mboten ngertos".
    examples:
      - text: Apa tegese 'kliru'?
        ar_eg: يعني إيه kliru؟
        ar: ما معنى kliru؟
        en: What does 'kliru' mean?
      - text: Huruf dh lan d iku beda.
        ar_eg: حرف dh وحرف d مختلفين.
        ar: الحرفان dh وd مختلفان.
        en: The letters dh and d are different.
      - text: Tulung dibaleni, alon-alon.
        ar_eg: عيدها لو سمحت، بالراحة.
        ar: أعدها من فضلك، ببطء.
        en: Please say it again, slowly.
exercises:
