  - id: e03
    type: listen
    text: 'Aku duwe pitakonan: apa tegese ''embuh''?'
    question:
      ar_eg: بيعمل إيه؟
      ar: ماذا يفعل؟
      en: What is he doing?
    options: [بيسأل عن معنى كلمة, بيقول إنه فاهم, بيطلب يكتب حرف]
    answer: 0
    meaning:
      ar_eg: 'عندي سؤال: يعني إيه embuh؟'
      ar: 'عندي سؤال: ما معنى embuh؟'
      en: 'I have a question: what does ''embuh'' mean?'
    words: [pitakonan, teges, embuh]
  - id: e04
    type: fill_blank
    sentence: Tulisanmu wis ___, ora ana sing kliru.
    meaning:
      ar_eg: كتابتك ___، مفيش غلط.
      ar: كتابتك ___، لا خطأ فيها.
      en: Your writing is ___; nothing is wrong.
    options: [pener, embuh, huruf]
    answers: [pener]
    words: [pener, embuh, huruf]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حد سألك حاجة مش عارفها، بين الصحاب. تقول إيه؟
      ar: سألك صديق عن شيء لا تعرفه. ماذا تقول؟
      en: 'A friend asks you something you don''t know. You say:'
    options: [Pener., Embuh., Baleni.]
    answer: 1
    explain:
      ar_eg: Embuh = مش عارف. مع الكبار قول mboten ngertos.
      ar: Embuh = لا أدري، ومع الكبار قل mboten ngertos.
      en: Embuh = dunno; with elders say mboten ngertos.
    words: [pener, embuh, mbaleni]
  - id: e06
    type: fill_blank
    sentence: Bocah iku ___ cara mlakune bapake.
    meaning:
      ar_eg: الواد ده ___ مشية أبوه.
      ar: ذلك الطفل ___ مشية أبيه.
      en: That child ___ the way his father walks.
    options: [niru, nyebut, huruf]
    answers: [niru]
    words: [niru, nyebut, huruf]
  - id: e07
    type: multiple_choice
    question: Aku durung bisa ___ 'dhuwit'.
    options: [nyebut, pener, huruf]
    answer: 0
    explain:
      ar_eg: 'nyebut = ينطق: لسه مش عارف أنطق dhuwit.'
      ar: 'nyebut = ينطق: لا أستطيع نطق dhuwit بعد.'
      en: 'nyebut = pronounce: I can''t say dhuwit yet.'
    words: [nyebut, pener, huruf]
  - id: e08
    type: build_sentence
    source:
      ar_eg: عندي سؤال يا ميباك.
      ar: عندي سؤال يا أختي.
      en: I have a question, Mbak.
    answer: Aku duwe pitakonan, Mbak.
    distractors: [teges, huruf]
    words: [pitakonan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Tulung dibaleni, aku durung ngerti tegese.
    answers_meaning:
      ar_eg: [عيدها لو سمحت، لسه مش فاهم معناها, ممكن تعيد؟ لسه مافهمتش المعنى]
      ar: [أعدها من فضلك، لم أفهم معناها بعد, من فضلك أعد، لم أفهم المعنى بعد]
      en: ['Please repeat it, I don''t understand the meaning yet', 'Say it again please, I don''t get what it means yet']
    words: [mbaleni, teges]
  - id: e10
    type: speaking
    text: Aku niru Mbak Ayu nyebut 'dhuwit'.
    meaning:
      ar_eg: أنا بقلّد ميباك أيو وهي بتنطق dhuwit.
      ar: أقلّد مباك أيو في نطق dhuwit.
      en: I copy Mbak Ayu saying 'dhuwit'.
    words: [niru, nyebut]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mbak Ayu, aku duwe pitakonan.
      ar_eg: ميباك أيو، عندي سؤال.
      ar: يا مباك أيو، عندي سؤال.
      en: Mbak Ayu, I have a question.
    - speaker: Mbak Ayu
      text: Iya, piye?
      ar_eg: أيوه، إيه؟
      ar: نعم، ما هو؟
      en: Sure, what?
    - speaker: Mohamed
      text: Apa tegese 'embuh'? Kancaku kerep ngomong ngono.
      ar_eg: يعني إيه embuh؟ صاحبي بيقولها كتير.
      ar: ما معنى embuh؟ صديقي يقولها كثيرًا.
      en: What does 'embuh' mean? My friend says it a lot.
    - speaker: Mbak Ayu
      text: Tegese 'ora ngerti'. Nanging aja niru karo wong tuwa, ora sopan.
      ar_eg: معناها «مش عارف». بس ماتقلدهاش مع الكبار، مش مؤدبة.
      ar: معناها «لا أعرف»، لكن لا تقلّدها مع الكبار، فليست مهذبة.
      en: It means 'don't know'. But don't copy it with older people; it's not polite.
    - speaker: Mohamed
      text: Dadi karo Mbah aku matur 'mboten ngertos'?
      ar_eg: يعني مع الجدة أقول mboten ngertos؟
      ar: إذن أقول للجدة mboten ngertos؟
      en: So with Grandma I say 'mboten ngertos'?
    - speaker: Mbak Ayu
      text: Pener! Coba baleni sepisan maneh.
      ar_eg: صح! جرّب تعيدها مرة كمان.
      ar: صحيح! جرّب أن تعيدها مرة أخرى.
      en: Correct! Try saying it once more.
