    text: Hana caraka, data sawala, padha jayanya, maga bathanga.
    meaning:
      ar_eg: كان فيه رسولين، اتخانقوا، كانوا قد بعض في القوة، والاتنين ماتوا.
      ar: كان هناك رسولان، فتنازعا، وتكافآ قوة، فهلكا معًا.
      en: There were two messengers; they quarrelled; they were equally strong; and both died.
