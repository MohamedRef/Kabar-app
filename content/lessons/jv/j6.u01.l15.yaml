    words: [jagang, cepuri, wringin]
dialogue:
  title: Ing omahe Pak Slamet
  lines:
    - speaker: Pak Slamet
      text: Sugeng rawuh, Mas. Menika perak saking Kotagedhe.
      ar_eg: أهلًا بيك يا ابني. ده فضة من كوتاغيدي.
      ar: مرحبًا بك يا بني. هذه فضة من كوتاغيدي.
      en: Welcome, Mohamed. This is silver from Kotagede.
    - speaker: Mohamed
      text: Sae sanget, Pak. Wonten aksara Jawanipun!
      ar_eg: حلوة قوي يا عمّو. وعليها حروف جاوية!
      ar: جميلة جدًا يا سيدي. وعليها حروف جاوية!
      en: It's beautiful, sir. It has aksara Jawa on it!
    - speaker: Pak Slamet
      text: Inggih. Menika hana caraka, crita Aji Saka.
      ar_eg: أيوه. دي «هانا تشاراكا»، حكاية Aji Saka.
      ar: نعم. هذه «هانا تشاراكا»، حكاية Aji Saka.
      en: Yes. It's hana caraka, the story of Aji Saka.
    - speaker: Mohamed
      text: Kula sampun saged maos kalih dasa aksara, Pak.
      ar_eg: أنا بقيت أعرف أقرا العشرين حرف يا عمّو.
      ar: صرت أستطيع قراءة الحروف العشرين يا سيدي.
      en: I can read all twenty letters now, sir.
    - speaker: Pak Slamet
      text: Wah, sae sanget, Mas!
      ar_eg: يا سلام، برافو عليك!
      ar: رائع جدًا يا بني!
      en: Wow, excellent, Mohamed!
souvenir:
  id: j6.u01.souvenir
  title: Perak Kotagedhe
  note:
    ar_eg: |
      كوتاغيدي كانت عاصمة مملكة ماتارام، ومن أجيال وهي بلد صنّاع الفضة: في الورش الصغيرة هتلاقي بروشات وخواتم مشغولة بخيوط فضة رفيعة. وأحيانًا هتلاقي على الفضة حروف «ها نا تشا را كا» — قصيدة الخدّامين المخلصين بتوع Aji Saka، اللي دلوقتي بقيت تقراها بنفسك.
    ar: |
      كانت كوتاغيدي عاصمة مملكة ماتارام، وهي منذ أجيال مدينة صاغة الفضة: في ورشها الصغيرة دبابيس وخواتم من خيوط الفضة الدقيقة. وقد تجد على الفضة حروف «ها نا تشا را كا»، قصيدة خادمَي Aji Saka الوفيّين، وصرت تقرؤها بنفسك.
    en: |
      Kotagede was the capital of the Mataram kingdom, and for generations it has been a town of silversmiths: its small workshops turn fine silver thread into brooches and rings. Sometimes the silver carries "ha na ca ra ka" — the poem of Aji Saka's two loyal servants, which you can now read yourself.
