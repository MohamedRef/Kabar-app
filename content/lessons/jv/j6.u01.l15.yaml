id: j6.u01.l15
language: jv
title: Ulangan J6.1
can_do:
  ar_eg: تقرا الحروف العشرين كلها وتحكي حكايتها.
  ar: أن تقرأ الحروف العشرين كلها وتروي حكايتها.
  en: Read all 20 letters and tell their story.
slides:
  - title: Crita Aji Saka
    body:
      ar_eg: |
        الحكاية: الملك Aji Saka ساب خدّامه Sembada يحرس الخنجر بتاعه (keris)، وقاله: «ماتديهوش لحد غيري». بعدين بعت خدّامه التاني Dora يجيبه. الاتنين كانوا مخلصين، فاتخانقوا لحد ما الاتنين ماتوا. وAji Saka عمل الحروف عشان يفتكرهم:
        Hana caraka (كان فيه رسولين) · data sawala (اتخانقوا) · padha jayanya (كانوا قد بعض) · maga bathanga (والاتنين ماتوا).
        ꦲꦤꦕꦫꦏ · ꦢꦠꦱꦮꦭ · ꦥꦝꦗꦪꦚ · ꦩꦒꦧꦛꦔ
      ar: |
        الحكاية: ترك الملك Aji Saka خادمه Sembada يحرس خنجره (keris) وأوصاه ألّا يسلّمه لغيره، ثم أرسل خادمه الآخر Dora ليأتي به. وكان كلاهما وفيًّا، فتقاتلا حتى هلكا، فوضع Aji Saka الحروف تخليدًا لهما:
        Hana caraka (كان رسولان) · data sawala (فتنازعا) · padha jayanya (وتكافآ) · maga bathanga (فهلكا معًا).
        ꦲꦤꦕꦫꦏ · ꦢꦠꦱꦮꦭ · ꦥꦝꦗꦪꦚ · ꦩꦒꦧꦛꦔ
      en: |
        The story: King Aji Saka left his servant Sembada guarding his keris (dagger) and told him to give it to no one but himself. Later he sent his other servant, Dora, to fetch it. Both were loyal, so they fought until both died, and Aji Saka made the letters in their memory:
        Hana caraka (there were two messengers) · data sawala (they quarrelled) · padha jayanya (equally strong) · maga bathanga (and both died).
        ꦲꦤꦕꦫꦏ · ꦢꦠꦱꦮꦭ · ꦥꦝꦗꦪꦚ · ꦩꦒꦧꦛꦔ
    grammar: jv.aksara.nglegena
    examples:
      - text: ꦱꦥ (sapa)
        ar_eg: مين؟
        ar: من؟
        en: who?
      - text: ꦝꦝ (dhadha)
        ar_eg: صدر
        ar: صدر
        en: chest
