    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦱꦥꦗꦒ"
      ar: "اكتب بالحروف اللاتينية: ꦱꦥꦗꦒ"
      en: "Write in Latin letters: ꦱꦥꦗꦒ"
    answers: ["Sapa jaga?", sapa jaga, sapajaga]
    explain:
      ar_eg: sapa jaga = مين بيحرس؟ — زي Sembada اللي كان بيحرس الخنجر.
      ar: sapa jaga = من يحرس؟ كـ Sembada حارس الخنجر.
      en: sapa jaga = who's keeping watch? Like Sembada guarding the keris.
    words: [ꦱ, ꦥ, ꦗ, ꦒ]
  - id: e11
