schema: kabar.lesson/v1
id: j6.u02.l05
language: jv
title: Jumat ing masjid
can_do:
  ar_eg: 'تحكي عن صلاة الجمعة: الوضوء من البير، والخطبة، والمصلين، والنصيحة.'
  ar: 'أن تحكي عن صلاة الجمعة: الوضوء من البئر والخطبة والمصلّين والنصيحة.'
  en: 'Talk about Friday prayers: wudhu at the well, the sermon, the congregation and the advice.'
slides:
  - title: Dina Jumat
    body:
      ar_eg: |
        كلمات عربية كتير: jamaah = المصلين (جماعة)، khutbah = خطبة، wudhu = وضوء، sujud = سجود، tobat = توبة.
        kurmat = احترام (من «حُرمة»)، pitutur = نصيحة (كلمة جاوية أدبية).
        sumur = بير. في القرى القديمة الناس بتتوضى من البير.
      ar: |
        كلمات عربية كثيرة: jamaah = جماعة المصلّين، khutbah = خطبة، wudhu = وضوء، sujud = سجود، tobat = توبة.
        kurmat = احترام (من «حُرمة»)، pitutur = نصيحة (كلمة جاوية أدبية).
        sumur = بئر. وفي القرى القديمة يتوضأ الناس من البئر.
      en: |
        Many Arabic words: jamaah = congregation, khutbah = sermon, wudhu = ablution, sujud = prostration, tobat = repentance.
        kurmat = respect (from Arabic hurma), pitutur = advice (a literary Javanese word).
        sumur = well. In old villages people do wudhu at the well.
    examples:
      - text: Ing desa, wong-wong wudhu ing sumur.
        ar_eg: في القرية الناس بتتوضى من البير.
        ar: في القرية يتوضأ الناس عند البئر.
        en: In the village, people do wudhu at the well.
      - text: Khutbah Jumat isine pitutur sing apik.
        ar_eg: خطبة الجمعة فيها نصايح حلوة.
        ar: خطبة الجمعة فيها نصيحة طيبة.
        en: The Friday sermon is full of good advice.
      - text: Jamaah sujud bebarengan.
        ar_eg: المصلين بيسجدوا مع بعض.
        ar: يسجد المصلّون معًا.
        en: The congregation prostrate together.
exercises:
  - id: e01
    type: match_pairs
