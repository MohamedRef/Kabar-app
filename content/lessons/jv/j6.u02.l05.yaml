    words: [pitutur, sumur, kurmat, tobat]
  - id: e03
    type: listen
    text: Jamaah ngrungokake khutbah kanthi meneng.
    question:
      ar_eg: المصلين بيعملوا إيه؟
      ar: ماذا يفعل المصلّون؟
      en: What is the congregation doing?
    options: [المصلين بيسمعوا الخطبة ساكتين, المصلين بيتوضوا, الإمام ساجد]
    answer: 0
    meaning:
      ar_eg: المصلين بيسمعوا الخطبة وهما ساكتين.
      ar: يستمع المصلّون إلى الخطبة صامتين.
      en: The congregation listen to the sermon in silence.
    words: [jamaah, khutbah]
  - id: e04
    type: fill_blank
    sentence: Sadurunge salat, kudu ___ dhisik.
    meaning:
      ar_eg: قبل الصلاة لازم ___ الأول.
      ar: قبل الصلاة يجب ___ أولًا.
      en: Before prayer you must do ___ first.
    options: [wudhu, sumur, tobat]
    answers: [wudhu]
    words: [wudhu, sumur, tobat]
    explain:
      ar_eg: قبل الصلاة لازم wudhu. sumur = بير وtobat = توبة.
      ar: قبل الصلاة يجب الـ wudhu. أما sumur فبئر وtobat توبة.
      en: Before prayer you do wudhu. sumur is a well and tobat is repentance.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: البيوت القديمة في القرية بتاخد المية منين؟
      ar: من أين تأخذ البيوت القديمة في القرية الماء؟
      en: Where do old village houses get water from?
    options: [jamaah, sumur, khutbah]
    answer: 1
    explain:
      ar_eg: sumur = بير.
      ar: sumur = بئر.
      en: sumur = a well.
    words: [jamaah, sumur, khutbah]
  - id: e06
    type: fill_blank
    sentence: Wong sing salah kudu ___ marang Gusti Allah.
    meaning:
      ar_eg: اللي غلط لازم ___ لربنا.
      ar: على المخطئ أن ___ إلى الله.
      en: Someone who has done wrong should ___ to God.
    options: [tobat, sujud, wudhu]
    answers: [tobat]
    words: [tobat, sujud, wudhu]
    explain:
      ar_eg: tobat marang Gusti Allah = يتوب لربنا. sujud = سجود وwudhu = وضوء، ومش بييجوا مع «اللي غلط».
      ar: tobat marang Gusti Allah تعني يتوب إلى الله. أما sujud فسجود وwudhu وضوء.
      en: tobat marang Gusti Allah is "repent to God". sujud is prostration and wudhu is ablution.
  - id: e07
    type: multiple_choice
    question: Bocah kudu ___ marang wong tuwa.
    options: [wudhu, pitutur, kurmat]
    answer: 2
    explain:
      ar_eg: 'kurmat = احترام: الصغير يحترم الكبير.'
      ar: 'kurmat = احترام: يحترم الصغير الكبير.'
      en: 'kurmat = respect: children respect their elders.'
    words: [wudhu, pitutur, kurmat]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الخطبة دي فيها نصيحة حلوة.
      ar: في هذه الخطبة نصيحة طيبة.
      en: This sermon has good advice.
    answer: Khutbah iki isine pitutur apik.
    distractors: [sumur, tobat]
    words: [khutbah, pitutur]
    explain:
      ar_eg: pitutur apik = نصيحة حلوة. sumur = بير وtobat = توبة، ومش في المعنى.
      ar: pitutur apik تعني نصيحة طيبة. أما sumur (بئر) وtobat (توبة) فليستا في المعنى.
      en: pitutur apik is "good advice". sumur (well) and tobat (repentance) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Kabeh jamaah sujud bebarengan.
    answers_meaning:
      ar_eg: [كل المصلين سجدوا مع بعض, المصلين كلهم بيسجدوا سوا]
      ar: [سجد المصلّون جميعًا معًا, يسجد جميع المصلّين معًا]
      en: [The whole congregation prostrate together, All the worshippers prostrate together]
    words: [jamaah, sujud]
  - id: e10
    type: speaking
    text: Pitutur saka simbah kudu dikurmati.
    meaning:
      ar_eg: نصيحة الجدة لازم تتحترم.
      ar: يجب احترام نصيحة الجدّة.
      en: Grandma's advice must be respected.
    words: [pitutur, kurmat]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, ayo menyang masjid. Dina iki Jumat.
      ar_eg: يا محمد، يلا على الجامع. النهارده الجمعة.
      ar: يا محمد، هيا إلى المسجد. اليوم الجمعة.
      en: Mohamed, let's go to the mosque. It's Friday.
    - speaker: Mohamed
      text: Sik, aku wudhu dhisik ing sumur.
      ar_eg: ثانية، هتوضى الأول من البير.
      ar: لحظة، سأتوضأ أولًا عند البئر.
      en: One sec, I'll do wudhu at the well first.
    - speaker: Mas Dimas
      text: Jamaahe wis akeh. Khutbahe arep diwiwiti.
      ar_eg: المصلين كتير. الخطبة هتبدأ.
      ar: المصلّون كثيرون. الخطبة على وشك أن تبدأ.
      en: There's a big congregation. The sermon's about to start.
    - speaker: Mohamed
      text: Khutbah dina iki bab apa?
      ar_eg: خطبة النهارده عن إيه؟
      ar: عمّ خطبة اليوم؟
      en: What's today's sermon about?
    - speaker: Mas Dimas
      text: Bab tobat lan kurmat marang wong tuwa.
      ar_eg: عن التوبة واحترام الأهل.
      ar: عن التوبة واحترام الوالدين.
      en: About repentance and respecting your parents.
    - speaker: Mohamed
      text: Pitutur sing apik banget.
      ar_eg: نصيحة حلوة أوي.
      ar: نصيحة طيبة جدًا.
      en: Really good advice.
