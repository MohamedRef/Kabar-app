schema: kabar.lesson/v1
id: j5.u01.l02
language: jv
title: Ing lan kang
can_do:
  ar_eg: تقرا الحاجة فين وأنهي واحدة، بأسلوب الكتابة.
  ar: أن تقرأ أين يقع الشيء وأيّها هو، بأسلوب الكتابة.
  en: Read where things are and which ones, in written style.
slides:
  - title: Neng → ing
    body:
      ar_eg: |
        في الكلام بتقول neng (في). في المقالة الكلمة دي بتتحول لـ ing.
        وana ing = «موجود في / بيقع في» (terletak di). دي أكتر جملة هتقابلها في أي مقالة عن مكان.
      ar: |
        في الكلام تقول neng (في)، وفي المقالة تصير ing.
        وana ing = «يقع في» (terletak di)، وهي أكثر عبارة ستلقاها في مقالات الأماكن.
      en: |
        In speech you say neng (in, at). In an article it becomes ing.
        And ana ing = "is located in" (terletak di), the phrase you'll meet most in any article about a place.
    grammar: jv.reading.written-style
    examples:
      - text: Pacitan ana ing pesisir kidul pulo Jawa.
        ar_eg: باتشيتان على الساحل الجنوبي لجزيرة جاوة.
        ar: تقع باتشيتان على الساحل الجنوبي لجزيرة جاوة.
        en: Pacitan lies on the south coast of Java.
      - text: Alun-alun ana ing tengah kutha Madiun.
        ar_eg: الألون ألون (الميدان الكبير) في وسط مدينة ماديون.
        ar: يقع الألون ألون (الميدان الكبير) في وسط مدينة ماديون.
        en: The alun-alun (town square) is in the middle of Madiun.
  - title: Sing → kang
    body:
      ar_eg: |
        sing (اللي) في الكلام بتبقى kang في الكتابة. نفس yang الإندونيسي ونفس «الذي» عندنا.
        ولما الكراما بتتكتب بتشوف ingkang، وده اتعلمناه في J3.
      ar: |
        sing (الذي) في الكلام تصير kang في الكتابة، مثل yang الإندونيسية و«الذي» العربية.
        وفي الكراما المكتوبة ingkang، وقد عرفناها في J3.
      en: |
        Spoken sing (which, who) becomes kang in writing: Indonesian yang, Arabic «الذي».
        Written krama has ingkang, which you met in J3.
    grammar: jv.reading.written-style
    examples:
      - text: Stasiun Madiun iku stasiun sepur kang lawas.
        ar_eg: محطة ماديون محطة قطر قديمة.
        ar: محطة ماديون محطة قطارات قديمة.
        en: Madiun Station is an old railway station.
      - text: Jalan Pahlawan iku papan kang misuwur ing Madiun.
        ar_eg: شارع باهلاوان مكان مشهور في ماديون.
        ar: شارع باهلاوان مكان مشهور في ماديون.
        en: Jalan Pahlawan is a famous place in Madiun.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kang
        ar_eg: اللي (= sing، yang)
        ar: الذي (= sing، yang)
        en: which, who (= sing, yang)
      - text: lawas
        ar_eg: قديم
        ar: قديم
        en: old (of things)
      - text: sepur
        ar_eg: قطر
        ar: قطار
        en: train
      - text: misuwur
        ar_eg: مشهور
        ar: مشهور
        en: famous
      - text: papan
        ar_eg: مكان
        ar: مكان
        en: place
    words: [kang, lawas, sepur, misuwur, papan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة بأسلوب المقالة؟
      ar: أي جملة بأسلوب المقالة؟
      en: Which sentence is in article style?
    options: ['Pacitan neng pesisir kidul.', 'Pacitan ana ing pesisir kidul.', 'Pacitan ana neng pesisir kidul.']
    answer: 1
    explain:
      ar_eg: neng للكلام. المقالة بتكتب ana ing.
      ar: neng للكلام، والمقالة تكتب ana ing.
      en: neng is spoken; an article writes ana ing.
    words: [ana ing]
  - id: e03
    type: multiple_choice
    question: Stasiun Madiun iku stasiun sepur kang lawas.
    question_meaning:
      ar_eg: kang هنا تساوي أنهي كلمة إندونيسي؟
      ar: kang هنا تساوي أي كلمة إندونيسية؟
      en: Which Indonesian word is kang here?
    options: [yang, dari, oleh]
    answer: 0
    words: [kang, sepur, lawas]
    explain:
      ar_eg: kang في الأسلوب الأدبي = yang بالإندونيسي، بتوصل الاسم بوصفه. dari = من وoleh = بواسطة.
      ar: kang في الأسلوب الأدبي تقابل yang الإندونيسية، تربط الاسم بصفته. أما dari فتعني من وoleh بواسطة.
      en: Literary kang is Indonesian yang, linking a noun to its description. dari is "from" and oleh is "by".
  - id: e04
    type: listen
    text: Jalan Pahlawan iku papan kang misuwur ing Madiun.
    options:
      - Jalan Pahlawan iku papan kang lawas ing Madiun.
      - Jalan Pahlawan iku dalan kang misuwur ing Jawa.
      - Jalan Pahlawan iku papan kang misuwur ing Madiun.
    answer: 2
    meaning:
      ar_eg: شارع باهلاوان مكان مشهور في ماديون.
      ar: شارع باهلاوان مكان مشهور في ماديون.
      en: Jalan Pahlawan is a famous place in Madiun.
    words: [papan, misuwur, kang]
  - id: e05
    type: fill_blank
    sentence: Alun-alun ___ tengah kutha Madiun.
    meaning:
      ar_eg: الألون ألون في وسط مدينة ماديون.
      ar: يقع الألون ألون في وسط مدينة ماديون.
      en: The alun-alun is in the middle of Madiun.
    options: [kang, ana ing, saka]
    answers: [ana ing]
    words: [ana ing]
    explain:
      ar_eg: ana ing = موجود في، للمكان. kang = اللي، وsaka = من، ومش مكان.
      ar: ana ing تعني «يوجد في» للمكان. أما kang فاسم موصول وsaka تعني من.
      en: ana ing means "is in", for location. kang is "which/that" and saka is "from".
  - id: e06
    type: fill_blank
    sentence: Madiun ___ amarga pecele.
    meaning:
      ar_eg: ماديون مشهورة بسبب البيتشيل بتاعها.
      ar: ماديون مشهورة ببيتشيلها.
      en: Madiun is famous for its pecel.
    options: [lawas, sepur, misuwur]
    answers: [misuwur]
    explain:
      ar_eg: pecel = خضار مسلوقة بصوص الفول السوداني الحراق، أشهر أكلة في ماديون.
      ar: pecel خضار مسلوقة بصلصة الفول السوداني الحارة، أشهر أطعمة ماديون.
      en: pecel = blanched vegetables with spicy peanut sauce, Madiun's famous dish.
    words: [misuwur]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (بأسلوب المقالة) القطر القديم موجود في محطة ماديون.
      ar: (بأسلوب المقالة) القطار القديم في محطة ماديون.
      en: (article style) The old train is at Madiun Station.
    answer: Sepur kang lawas ana ing Stasiun Madiun.
    distractors: [neng, saka]
    words: [sepur, kang, lawas, ana ing]
    explain:
      ar_eg: بأسلوب المقالة بنقول ana ing. neng هي الكلام العامي لـ «في»، وsaka = من.
      ar: في أسلوب المقالة نقول ana ing؛ أما neng فعامية، وsaka تعني من.
      en: Article style uses ana ing. neng is the casual "at", and saka means "from".
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بأسلوب المقالة) شارع باهلاوان مكان قديم في ماديون.
      ar: (بأسلوب المقالة) شارع باهلاوان مكان قديم في ماديون.
      en: (article style) Jalan Pahlawan is an old place in Madiun.
    answers:
      - Jalan Pahlawan iku papan kang lawas ing Madiun.
      - Jalan Pahlawan iku papan lawas ing Madiun.
      - Jalan Pahlawan papan kang lawas ing Madiun.
      - Jalan Pahlawan iku papan kang lawas ana ing Madiun.
      - Jalan Pahlawan iku papan lawas ana ing Madiun.
    words: [papan, lawas]
  - id: e09
    type: translate
    direction: from_target
    source_text: Stasiun Madiun iku stasiun sepur kang lawas lan misuwur.
    answers_meaning:
      ar_eg:
        - محطة ماديون محطة قطر قديمة ومشهورة.
        - محطة ماديون محطة قطارات قديمة ومشهورة.
        - محطة ماديون هي محطة قطر قديمة ومشهورة.
        - محطة ماديون محطة قطر قديمة وشهيرة.
      ar:
        - محطة ماديون محطة قطارات قديمة ومشهورة.
        - محطة ماديون محطة قطارات قديمة وشهيرة.
        - محطة ماديون هي محطة قطارات قديمة ومشهورة.
        - محطة ماديون محطة قطار قديمة ومشهورة.
      en:
        - Madiun Station is an old and famous railway station.
        - Madiun Station is an old, famous railway station.
        - Madiun Station is an old and famous train station.
        - Madiun Station is an old, famous train station.
        - Madiun Station is a railway station that is old and famous.
    words: [sepur, lawas, misuwur, kang]
dialogue:
  title: Ing Jalan Pahlawan
  lines:
    - speaker: Mohamed
      text: Jalan Pahlawan iku papan kang misuwur ing Madiun.
      ar_eg: (بيقرا) شارع باهلاوان مكان مشهور في ماديون.
      ar: (يقرأ) شارع باهلاوان مكان مشهور في ماديون.
      en: (reading) Jalan Pahlawan is a famous place in Madiun.
    - speaker: Mbak Ayu
      text: Iya. Nek ngomong, aku ngomong "papan sing misuwur neng Madiun".
      ar_eg: آه. لما بتكلم، بقول «papan sing misuwur neng Madiun».
      ar: نعم. وحين أتكلم أقول «papan sing misuwur neng Madiun».
      en: Yes. When I talk, I say "papan sing misuwur neng Madiun".
    - speaker: Mohamed
      text: Oh, kang iku sing, ing iku neng.
      ar_eg: آه، kang هي sing، وing هي neng.
      ar: آه، kang هي sing، وing هي neng.
      en: Oh, kang is sing, and ing is neng.
    - speaker: Mbak Ayu
      text: Bener! Gedhong-gedhong neng kene lawas banget.
      ar_eg: صح! المباني هنا قديمة أوي.
      ar: صحيح! المباني هنا قديمة جدًا.
      en: Right! The buildings here are really old.
    - speaker: Mohamed
      text: Aku seneng banget papan sing lawas, lho.
      ar_eg: أنا بحب الأماكن القديمة.
      ar: أحب الأماكن القديمة.
      en: I love old places.
new_words:
  - word: kang
    pos: pronoun
    ar_eg: اللي (في الكتابة، = sing)
    ar: الذي (في الكتابة، = sing)
    en: which, who (written; spoken sing) = yang
  - word: ana ing
    pos: phrase
    ar_eg: موجود في / بيقع في (في الكتابة)
    ar: يقع في (في الكتابة)
    en: is located in (written) = terletak di
  - word: sepur
    pos: noun
    ar_eg: قطر
    ar: قطار
    en: train = kereta api
  - word: misuwur
    pos: adjective
    ar_eg: مشهور
    ar: مشهور
    en: famous = terkenal
  - word: papan
    pos: noun
    ar_eg: مكان
    ar: مكان
    en: place = tempat
review:
