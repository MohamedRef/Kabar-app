    words: [maos, nyerat, ndhawuhi]
dialogue:
  title: Dalu-dalu dhateng Tugu
  lines:
    - speaker: Mohamed
      text: Pak, panjenengan badhe tindak pundi?
      ar_eg: يا أستاذ، حضرتك رايح فين؟
      ar: يا سيدي، إلى أين تذهب؟
      en: Sir, where are you going?
    - speaker: Pak Harsono
      text: Kula badhe kesah dhateng Tugu, Mas.
      ar_eg: أنا رايح التوغو يا ابني.
      ar: أنا ذاهب إلى التوغو يا بني.
      en: I'm going to the Tugu.
    - speaker: Mohamed
      text: Kula ugi, Pak. Simbah kersa tindak ugi?
      ar_eg: وأنا كمان يا أستاذ. وتيتة تحب تيجي هي كمان؟
      ar: وأنا أيضًا يا سيدي. هل تودّ الجدة أن تذهب أيضًا؟
      en: Me too, sir. Would Grandma like to come too?
    - speaker: Pak Harsono
      text: Mboten, Mas. Simbah saweg sare.
      ar_eg: لا يا ابني. تيتة نايمة.
      ar: لا يا بني. الجدة نائمة.
      en: No. Grandma's asleep.
    - speaker: Mohamed
      text: Inggih. Mangga, Pak, panjenengan rumiyin.
      ar_eg: ماشي. اتفضل يا أستاذ، حضرتك الأول.
      ar: حسنًا. تفضّل يا سيدي، أنت أولًا.
      en: All right. After you, sir.
    - speaker: Pak Harsono
      text: Matur nuwun, Mas.
      ar_eg: شكرًا يا ابني.
      ar: شكرًا يا بني.
      en: Thank you.
souvenir:
  id: j4.u01.souvenir
  title: Tugu Pal Putih
  note:
    ar_eg: |
      التوغو هو العمود الأبيض في نص تقاطع يوجياكارتا، وبيتقال إنه واقف على خط وهمي واحد بيربط جبل ميرابي بقصر السلطان وبالبحر الجنوبي. والخط ده («المحور الكوني» ليوجيا) دخل قايمة التراث العالمي لليونسكو سنة ٢٠٢٣. وإنت واقف قدامه افتكر درس الوحدة: «Bapak tindak» آه، «kula tindak» لأ — التكريم دايمًا للتاني.
    ar: |
      التوغو عمود أبيض في وسط تقاطع يوغياكارتا، ويقال إنه يقع على خط متخيَّل واحد يصل جبل ميرابي بقصر السلطان وبالبحر الجنوبي. وقد أُدرج هذا المحور («المحور الكوني» ليوغياكارتا) في قائمة التراث العالمي لليونسكو سنة ٢٠٢٣. وأنت أمامه تذكّر درس الوحدة: «Bapak tindak» نعم، و«kula tindak» لا؛ فالتوقير للآخر دائمًا.
    en: |
      The Tugu is the white pillar in the middle of Yogyakarta's crossroads, said to stand on one imaginary line linking Mount Merapi, the Sultan's palace and the southern sea. That line, Yogyakarta's "Cosmological Axis", became a UNESCO World Heritage Site in 2023. Standing in front of it, remember the unit's lesson: "Bapak tindak", yes; "kula tindak", no. Honour always goes to the other person.
