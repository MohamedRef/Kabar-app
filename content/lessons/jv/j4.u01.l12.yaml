  - id: e11
    type: multiple_choice
    question: Nyuwun pangapunten, Pak, kula ___ nami panjenengan.
    question_meaning:
      ar_eg: متأسف يا أستاذ، أنا ___ اسم حضرتك.
      ar: أعتذر يا سيدي، لقد ___ اسمك.
      en: I'm sorry, sir, I've ___ your name.
    options: [kesupen, supe, eling]
    answer: 1
    explain:
      ar_eg: عن نفسك supe، وkesupen للكبير بس.
      ar: عن نفسك supe، أما kesupen فللكبير فقط.
      en: 'About yourself: supe. kesupen is only for the elder.'
