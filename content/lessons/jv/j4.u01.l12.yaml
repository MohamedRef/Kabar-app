schema: kabar.lesson/v1
id: j4.u01.l12
language: jv
title: Ulangan J4.1
can_do:
  ar_eg: تكرّم التاني من غير ما تكرّم نفسك.
  ar: أن توقّر غيرك دون أن توقّر نفسك.
  en: Honour without self-honouring.
slides:
  - title: Kangge panjenengan, kangge kula
    body:
      ar_eg: |
        الوحدة كلها في جدول واحد. الكبير ← إنت:
        dhahar ← nedha · ngunjuk ← nginum · kersa ← purun · tindak ← kesah · sare ← tilem · kondur ← wangsul · rawuh ← dhateng · lenggah ← linggih · ngendika ← sanjang · mirsani ← ningali.
        وsiram للكبير، وإنت adus.
        حتى الكبير لما يتكلم عن نفسه بيقول kesah وnedha. krama inggil دايمًا للتاني.
      ar: |
        الوحدة كلها في جدول واحد، الكبير ← أنت:
        dhahar ← nedha · ngunjuk ← nginum · kersa ← purun · tindak ← kesah · sare ← tilem · kondur ← wangsul · rawuh ← dhateng · lenggah ← linggih · ngendika ← sanjang · mirsani ← ningali.
        وsiram للكبير وadus لك.
        وحتى الكبير يقول عن نفسه kesah وnedha؛ فـ krama inggil للآخر دائمًا.
      en: |
        The whole unit in one table, elder ← you:
        dhahar ← nedha · ngunjuk ← nginum · kersa ← purun · tindak ← kesah · sare ← tilem · kondur ← wangsul · rawuh ← dhateng · lenggah ← linggih · ngendika ← sanjang · mirsani ← ningali.
        siram for the elder, adus for you.
        Even the elder says kesah and nedha about himself: krama inggil is always for the other person.
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Kula sampun nedha. Panjenengan sampun dhahar, Pak?
        ar_eg: أنا أكلت. وحضرتك أكلت يا أستاذ؟
        ar: لقد أكلتُ. وهل تفضّلتَ بالأكل يا سيدي؟
        en: I've eaten. Have you eaten, sir?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dhahar
        ar_eg: nedha بتاعة الكبير (ياكل)
        ar: nedha للكبير (يأكل)
        en: the elder's nedha (eat)
      - text: kondur
        ar_eg: wangsul بتاعة الكبير (يرجع البيت)
        ar: wangsul للكبير (يعود)
        en: the elder's wangsul (go home)
      - text: sare
        ar_eg: tilem بتاعة الكبير (ينام)
        ar: tilem للكبير (ينام)
        en: the elder's tilem (sleep)
      - text: mirsani
        ar_eg: ningali بتاعة الكبير (يشوف)
        ar: ningali للكبير (يرى)
        en: the elder's ningali (see)
    words: [dhahar, kondur, sare, mirsani]
  - id: e02
    type: listen
    text: Bapak ngendika, Simbah sampun dhahar.
    options: ['Bapak ngendika, Simbah sampun dhahar.', 'Bapak sanjang, Simbah sampun nedha.', 'Bapak ngendika, Simbah saweg sare.']
    answer: 0
    meaning:
      ar_eg: بابا قال إن تيتة أكلت.
      ar: قال الوالد إن الجدة قد أكلت.
      en: Father said Grandma has eaten.
    words: [ngendika, dhahar]
  - id: e03
    type: listen
    text: Panjenengan kersa ngunjuk kopi, Pak?
    options: ['Panjenengan purun nginum kopi, Pak?', 'Panjenengan kersa ngunjuk kopi, Pak?', 'Panjenengan kersa dhahar, Pak?']
    answer: 1
    meaning:
      ar_eg: حضرتك تحب تشرب قهوة يا أستاذ؟
      ar: هل تودّ شرب القهوة يا سيدي؟
      en: Would you like some coffee, sir?
    words: [kersa, ngunjuk]
  - id: e04
    type: fill_blank
    sentence: Kula sampun ___, Bu. Matur nuwun.
    meaning:
      ar_eg: أنا أكلت يا هانم. شكرًا.
      ar: لقد أكلتُ يا سيدتي. شكرًا.
      en: I've eaten, ma'am. Thank you.
    options: [dhahar, nedha, mangan]
    answers: [nedha]
    words: [nedha]
  - id: e05
    type: fill_blank
    sentence: Simbah ___, Mas Dimas sampun wangsul?
    meaning:
      ar_eg: "تيتة بتسأل: دِيماس رجع؟"
      ar: "سألت الجدة: هل عاد ديماس؟"
      en: Grandma is asking whether Dimas is back.
    options: [taken, ndangu, sanjang]
    answers: [ndangu]
    explain:
      ar_eg: السؤال سؤال تيتة، يبقى ndangu. ودِيماس أصغر منها، فهي بتقول عنه wangsul عادي.
      ar: السؤال سؤال الجدة فيكون ndangu، وديماس أصغر منها فتقول عنه wangsul.
      en: It's Grandma asking, so ndangu. Dimas is younger than her, so she says plain wangsul about him.
    words: [ndangu, wangsul]
  - id: e06
    type: build_sentence
    source:
      ar_eg: بابا بيتفرج على التلفزيون.
      ar: الوالد يشاهد التلفاز.
      en: Father is watching TV.
    answer: Bapak saweg mirsani TV.
    distractors: [ningali, lagi]
    words: [saweg, mirsani]
  - id: e07
    type: speaking
    text: Kula badhe wangsul rumiyin. Sugeng tindak, Pak.
    meaning:
