    words: [kluwak, tampah, nyicil, dagangan]
  - id: e03
    type: listen
    text: Rawon ireng iku saka kluwak.
    question:
      ar_eg: الراوون لونه منين؟
      ar: من أين لون الراوون؟
      en: Where does rawon's colour come from?
    options: [الراوون أسود من الكلواك, الراوون أحمر من الشطة, الراوون أبيض من جوز الهند]
    answer: 0
    meaning:
      ar_eg: سواد الراوون جاي من الكلواك.
      ar: سواد الراوون من الكلواك.
      en: Rawon's black colour comes from kluwak.
    words: [kluwak]
  - id: e04
    type: fill_blank
    sentence: Bakul nimbang trasi nganggo ___.
    meaning:
      ar_eg: البيّاع بيوزن التراسي بالـ___.
      ar: يزن البائع التراسي بـ___.
      en: The vendor weighs the shrimp paste on the ___.
    options: [timbangan, tenggok, tampah]
    answers: [timbangan]
    words: [tenggok, tampah]
    explain:
      ar_eg: timbangan = ميزان. tenggok = قفّة وtampah = طبق خوص، ومش بيوزنوا.
      ar: timbangan ميزان. أما tenggok فقفّة وtampah صينية خوص، ولا يُوزن بهما.
      en: timbangan is a scale. tenggok is a basket and tampah a winnowing tray; you can't weigh with them.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة هي «جوز الشمع»؟
      ar: أيّها «جوز الشمع»؟
      en: Which one is the candlenut?
    options: [kemiri, kluwak, trasi]
    answer: 0
    explain:
      ar_eg: kemiri = جوز الشمع؛ kluwak = البذرة السودا.
      ar: kemiri = جوز الشمع؛ kluwak = البذرة السوداء.
      en: kemiri = candlenut; kluwak = the black nut.
    words: [kemiri, kluwak, trasi]
  - id: e06
    type: fill_blank
    sentence: Mbok bakul nggendhong ___ isi sayur.
    meaning:
      ar_eg: البيّاعة شايلة ___ مليانة خضار.
      ar: تحمل البائعة ___ مملوءة خضارًا.
      en: The market woman carries a ___ full of vegetables.
    options: [tenggok, nyicil, kemiri]
    answers: [tenggok]
    words: [tenggok, nyicil, kemiri]
    explain:
      ar_eg: tenggok = قفّة بتتشال على الضهر. nyicil = يقسّط وkemiri = بندق الكميري.
      ar: tenggok قفّة تُحمل على الظهر. أما nyicil فالتقسيط وkemiri جوز الكميري.
      en: tenggok is a basket carried on the back. nyicil is paying in instalments and kemiri is candlenut.
  - id: e07
    type: multiple_choice
    question: Dhuwite durung ana, mula Mas Dimas tuku motor karo ___.
    options: [dagangan, tampah, nyicil]
    answer: 2
    explain:
      ar_eg: nyicil = يقسّط.
      ar: nyicil = يقسّط.
      en: nyicil = pay in instalments.
    words: [dagangan, tampah, nyicil]
  - id: e08
    type: build_sentence
    source:
      ar_eg: بضاعتها في السلة.
      ar: بضاعتها في السلة.
      en: Her goods are in the basket.
    answer: Dagangane ana ing kranjang.
    distractors: [trasi, tenggok]
    words: [dagangan, kranjang]
    explain:
      ar_eg: kranjang = سبت. trasi = معجون جمبري وtenggok = قفّة تانية، ومش في المعنى.
      ar: kranjang سلّة. أما trasi (معجون روبيان) وtenggok (قفّة) فليستا في المعنى.
      en: kranjang is a basket. trasi (shrimp paste) and tenggok (another basket) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Aku tuku trasi lan kemiri.
    answers_meaning:
      ar_eg: [أنا بشتري تراسي وجوز شمع, اشتريت معجون جمبري وجوز شمع]
      ar: [أشتري معجون الروبيان وجوز الشمع, اشتريت معجون روبيان وجوز شمع]
      en: ['I''m buying shrimp paste and candlenuts', I bought shrimp paste and candlenuts]
    words: [trasi, kemiri]
  - id: e10
    type: speaking
    text: Kranjangku isi kluwak lan trasi.
    meaning:
      ar_eg: سلتي فيها كلواك وتراسي.
      ar: في سلتي كلواك ومعجون روبيان.
      en: My basket has kluwak and shrimp paste.
    words: [kranjang, kluwak, trasi]
dialogue:
  lines:
    - speaker: Mohamed
      text: Bu, kula badhe tumbas bumbu rawon.
      ar_eg: يا حاجة، عايز أشتري توابل راوون.
      ar: يا سيدتي، أريد شراء توابل الراوون.
      en: Ma'am, I'd like to buy rawon spices.
    - speaker: Bakul
      text: Nggih, Mas. Kluwak, kemiri, trasi?
      ar_eg: حاضر يا أستاذ. كلواك وكميري وتراسي؟
      ar: حسنًا. كلواك وكميري وتراسي؟
      en: Sure. Kluwak, candlenuts, shrimp paste?
    - speaker: Mohamed
      text: Leres. Menika cathetanipun, ngangge Pegon.
      ar_eg: مظبوط. دي الورقة، بالبيغون.
      ar: صحيح. هذه قائمتي، بحروف البيغون.
      en: Right. Here's my list, in Pegon.
    - speaker: Bakul
      text: Wah, pinter! Sekedhap nggih.
      ar_eg: ما شاء الله، شاطر! ثانية واحدة.
      ar: ما شاء الله، ذكي! لحظة من فضلك.
      en: Oh, clever! One moment, please.
    - speaker: Mohamed
      text: Kluwakipun seprapat kilo, nggih.
      ar_eg: ربع كيلو كلواك لو سمحتي.
      ar: ربع كيلو من الكلواك من فضلك.
      en: A quarter kilo of kluwak, please.
    - speaker: Bakul
      text: Nggih. Kula lebetaken kranjang panjenengan, Mas.
      ar_eg: حاضر. هحطهم في سلتك.
      ar: حسنًا. أضعها في سلّتك.
      en: Sure. I'll put them in your basket.
