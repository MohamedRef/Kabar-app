schema: kabar.lesson/v1
id: j6.u06.l04
language: jv
title: Kranjang blanja
can_do:
  ar_eg: 'تشتري توابل الراوون من السوق: الكلواك والكميري والتراسي، بالميزان والقفة.'
  ar: 'أن تشتري توابل الراوون من السوق: الكلواك والكميري والتراسي، بالميزان والسلة.'
  en: 'Buy rawon spices at the market: kluwak, candlenuts and shrimp paste, with scales and baskets.'
slides:
  - title: Bumbu rawon
    body:
      ar_eg: |
        الراوون شوربة لحمة سودا من جاوة الشرقية، ولونها الأسود جاي من kluwak (بذرة سودا).
        kemiri = جوز الشمع (بندق بيتطحن في التوابل)، trasi = معجون الجمبري.
        kranjang = سلة، tenggok = قفة من البامبو بتشيلها البيّاعة على ضهرها.
        tampah = طبق خوص مدوّر بيعرضوا عليه البضاعة، dagangan = البضاعة، nyicil = يقسّط (يدفع على أقساط). والـ timbangan (الميزان) عارفه من J3.
      ar: |
        الراوون حساء لحم أسود من جاوة الشرقية، ولونه الأسود من kluwak (بذرة سوداء).
        kemiri = جوز الشمع (يُطحن مع التوابل)، trasi = معجون الروبيان.
        kranjang = سلة، tenggok = قفة من الخيزران تحملها البائعة على ظهرها.
        tampah = طبق مستدير من الخوص تُعرض عليه البضاعة، dagangan = البضاعة، nyicil = يقسّط. والـ timbangan (الميزان) تعرفه من J3.
      en: |
        Rawon is a black beef soup from East Java; its black colour comes from kluwak (a black nut).
        kemiri = candlenut (ground into spice pastes), trasi = shrimp paste.
        kranjang = basket, tenggok = bamboo basket a market woman carries on her back.
        tampah = a round woven bamboo tray for laying out goods, dagangan = goods for sale, nyicil = pay in instalments. You know timbangan (scales) from J3.
    examples:
      - text: Rawon ireng iku saka kluwak.
        ar_eg: سواد الراوون من الكلواك.
        ar: سواد الراوون من الكلواك.
        en: Rawon's black colour comes from kluwak.
      - text: Mbok bakul nggendhong tenggok.
        ar_eg: البيّاعة شايلة القفة على ضهرها.
        ar: تحمل البائعة القفة على ظهرها.
        en: The market woman carries a bamboo basket on her back.
      - text: Bakul nimbang trasi nganggo timbangan.
        ar_eg: البيّاع بيوزن التراسي بالميزان.
        ar: يزن البائع معجون الروبيان بالميزان.
        en: The vendor weighs the shrimp paste on the scales.
exercises:
  - id: e01
    type: match_pairs
    pairs:
