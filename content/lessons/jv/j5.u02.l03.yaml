schema: kabar.lesson/v1
id: j5.u02.l03
language: jv
title: Musibah ing dalan
can_do:
  ar_eg: 'تفهم خبر حادثة: إيه اللي حصل، مين ساعد، والشرطة قالت إيه.'
  ar: 'أن تفهم خبر حادث: ماذا حدث ومن ساعد وماذا قالت الشرطة.'
  en: 'Follow a news item about an accident: what happened, who helped and what the police said.'
slides:
  - title: Warta kacilakaan
    body:
      ar_eg: |
        musibah = مصيبة أو كارثة (زي العربي)، kacilakaan = حادثة، pitulungan = مساعدة أو نجدة، semaput = أُغمي عليه.
        keterangan = إفادة أو معلومة: miturut keterangan polisi = بحسب إفادة الشرطة.
        mudik = السفر للبلد في العيد، rombongan = مجموعة أو فوج، ngati-ati = يخلّي باله.
      ar: |
        musibah = مصيبة أو كارثة (من العربية)، kacilakaan = حادث، pitulungan = مساعدة أو نجدة، semaput = يُغمى عليه.
        keterangan = إفادة أو معلومة: miturut keterangan polisi = بحسب إفادة الشرطة.
        mudik = السفر إلى البلدة في العيد، rombongan = جماعة أو فوج، ngati-ati = يحترس.
      en: |
        musibah = disaster (from Arabic), kacilakaan = accident, pitulungan = help, aid, semaput = faint, pass out.
        keterangan = statement, information: miturut keterangan polisi = according to the police.
        mudik = travel home for Lebaran, rombongan = group, party, ngati-ati = be careful.
    examples:
      - text: Ana kacilakaan ing dalan tol Madiun.
        ar_eg: حصلت حادثة على الطريق السريع في ماديون.
        ar: وقع حادث على الطريق السريع في ماديون.
        en: There was an accident on the Madiun toll road.
      - text: Sopir bis semaput, banjur oleh pitulungan saka warga.
        ar_eg: سواق الأتوبيس أغمى عليه، والأهالي ساعدوه.
        ar: أُغمي على سائق الحافلة، فأغاثه السكان.
        en: The bus driver passed out, then got help from residents.
      - text: Miturut keterangan polisi, kabeh penumpang slamet.
        ar_eg: بحسب كلام الشرطة، كل الركاب سليمين.
        ar: بحسب إفادة الشرطة، نجا جميع الركاب.
        en: According to the police, all passengers are safe.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: musibah
        ar_eg: مصيبة
        ar: كارثة، مصيبة
        en: disaster
      - text: kacilakaan
        ar_eg: حادثة
        ar: حادث
        en: accident
      - text: pitulungan
        ar_eg: مساعدة
        ar: نجدة، مساعدة
        en: help, aid
      - text: semaput
        ar_eg: أغمى عليه
        ar: أُغمي عليه
        en: pass out
    words: [musibah, kacilakaan, pitulungan, semaput]
  - id: e02
    type: match_pairs
    pairs:
      - text: ngati-ati
        ar_eg: يخلي باله
        ar: يحترس
        en: be careful
      - text: keterangan
        ar_eg: إفادة
        ar: إفادة، معلومة
        en: statement
      - text: mudik
        ar_eg: يسافر البلد في العيد
        ar: يعود إلى بلدته في العيد
        en: go home for Lebaran
      - text: rombongan
        ar_eg: مجموعة
        ar: فوج
        en: group
    words: [ngati-ati, keterangan, mudik, rombongan]
  - id: e03
    type: listen
    text: Rombongan saka Jakarta mudik menyang Madiun.
    question:
      ar_eg: مين اللي جاي؟
      ar: من القادم؟
      en: Who is coming?
    options: [مجموعة مسافرة بلدها في العيد, عيلة رايحة الشغل, سياح أجانب]
    answer: 0
    meaning:
      ar_eg: مجموعة من جاكرتا مسافرة بلدها ماديون في العيد.
      ar: فوج من جاكرتا يعود إلى ماديون في العيد.
      en: A group from Jakarta is going home to Madiun for Lebaran.
    words: [rombongan, mudik]
  - id: e04
    type: fill_blank
    sentence: Ana ___ ing dalan tol esuk iki.
    meaning:
      ar_eg: حصلت ___ على الطريق السريع الصبح ده.
      ar: وقع ___ على الطريق السريع هذا الصباح.
      en: There was an ___ on the toll road this morning.
    options: [kacilakaan, keterangan, rombongan]
    answers: [kacilakaan]
    words: [kacilakaan, keterangan, rombongan]
    explain:
      ar_eg: kacilakaan = حادثة. keterangan = تصريح ورombongan = مجموعة.
      ar: kacilakaan تعني حادث. أما keterangan فإفادة وrombongan جماعة.
      en: kacilakaan is an accident. keterangan is a statement and rombongan is a group.
  - id: e05
    type: multiple_choice
    question: Wong iku tiba lan meneng wae, ora tangi. Dheweke ___.
    options: [mudik, semaput, musibah]
    answer: 1
    explain:
      ar_eg: 'وقع ومش بيصحى = أغمى عليه: semaput.'
      ar: 'سقط ولم يستفق = أُغمي عليه: semaput.'
      en: 'He fell and doesn''t wake: he passed out, semaput.'
    words: [mudik, semaput, musibah]
  - id: e06
    type: fill_blank
    sentence: Dalane lunyu, ___ ya!
    meaning:
      ar_eg: الطريق بيزحلق، ___!
      ar: الطريق زلق، ___!
      en: 'The road is slippery: ___!'
    options: [ngati-ati, semaput, mudik]
    answers: [ngati-ati]
    words: [ngati-ati, semaput, mudik]
    explain:
      ar_eg: ngati-ati = خد بالك. semaput = أغمى عليه وmudik = سافر بلده.
      ar: ngati-ati تعني احترس. أما semaput فأُغمي عليه وmudik العودة إلى البلد.
      en: ngati-ati means "be careful". semaput is "faint" and mudik is going home for the holiday.
  - id: e07
    type: multiple_choice
    question: Banjir gedhe ing desa iku sawijining ___.
    options: [rombongan, pitulungan, musibah]
    answer: 2
    explain:
      ar_eg: 'الفيضان الكبير مصيبة: musibah.'
      ar: 'الفيضان الكبير كارثة: musibah.'
      en: 'A big flood is a disaster: musibah.'
    words: [rombongan, pitulungan, musibah]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الأهالي ساعدوا السواق.
      ar: قدّم السكان المساعدة للسائق.
      en: Residents gave help to the driver.
    answer: Warga menehi pitulungan marang sopir.
    distractors: [musibah, mudik]
    words: [pitulungan]
    explain:
      ar_eg: menehi pitulungan marang = ساعد / قدّم مساعدة لـ. musibah = مصيبة وmudik = سفر للبلد، ومش في المعنى.
      ar: menehi pitulungan marang = قدّم العون لـ. أما musibah (مصيبة) وmudik (العودة للبلد) فليستا في المعنى.
      en: menehi pitulungan marang is "gave help to". musibah (disaster) and mudik (going home) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Miturut keterangan polisi, kacilakaan iku ora gedhe.
    answers_meaning:
      ar_eg: [بحسب كلام الشرطة، الحادثة مكانتش كبيرة, الشرطة قالت إن الحادثة مش كبيرة]
      ar: [بحسب إفادة الشرطة، لم يكن الحادث كبيرًا, قالت الشرطة إن الحادث لم يكن كبيرًا]
      en: ['According to the police, the accident wasn''t serious', The police said the accident was not big]
    words: [keterangan, kacilakaan]
  - id: e10
    type: speaking
    text: Yen mudik, ngati-ati ing dalan.
    meaning:
      ar_eg: لما تسافر البلد في العيد، خلي بالك على الطريق.
      ar: إذا سافرت إلى بلدتك في العيد فاحترس في الطريق.
      en: When you go home for Lebaran, take care on the road.
    words: [mudik, ngati-ati]
dialogue:
  lines:
    - speaker: Mbak Ayu
      text: 'Mohamed, ana warta: kacilakaan ing dalan tol Madiun.'
      ar_eg: 'يا محمد، فيه خبر: حادثة على الطريق السريع في ماديون.'
      ar: 'يا محمد، هناك خبر: حادث على الطريق السريع في ماديون.'
      en: 'Mohamed, there''s news: an accident on the Madiun toll road.'
    - speaker: Mohamed
      text: Waduh! Kabeh slamet?
      ar_eg: يا ساتر! الكل سليم؟
      ar: يا للهول! هل نجا الجميع؟
      en: Oh no! Is everyone safe?
    - speaker: Mbak Ayu
      text: Miturut keterangan polisi, slamet. Sopire mung semaput sedhela.
      ar_eg: بحسب كلام الشرطة، أيوه. السواق بس أغمى عليه شوية.
      ar: بحسب إفادة الشرطة نعم. أُغمي على السائق قليلًا فقط.
      en: According to the police, yes. The driver only passed out for a moment.
    - speaker: Mohamed
      text: Sapa sing menehi pitulungan?
      ar_eg: مين اللي ساعد؟
      ar: من قدّم المساعدة؟
      en: Who helped?
    - speaker: Mbak Ayu
      text: Rombongan mudik sing liwat ing kono.
      ar_eg: مجموعة مسافرين للعيد كانوا معديين هناك.
      ar: فوج من المسافرين للعيد كانوا يمرّون هناك.
      en: A group going home for Lebaran who were passing by.
    - speaker: Mohamed
      text: Alhamdulillah. Musibah bisa ana kapan wae, perlu ngati-ati.
      ar_eg: الحمد لله. المصايب ممكن تحصل في أي وقت، لازم ناخد بالنا.
      ar: الحمد لله. قد تقع المصيبة في أي وقت، يجب الحذر.
      en: Thank God. Disaster can happen any time; we must be careful.
