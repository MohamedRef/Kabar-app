dialogue:
  title: Warta ing warung
  lines:
    - speaker: Mohamed
      text: Pak, wonten warta menapa ing koran?
      ar_eg: يا عمّو، فيه أخبار إيه في الجرنال؟
      ar: يا سيدي، ما الأخبار في الجريدة؟
      en: Sir, what news is in the paper?
    - speaker: Pak Harjo
      text: Dalan ing Kutha Lama kebanjiran rob wingi sore.
      ar_eg: الشارع في كوتا لاما غرق من مية البحر امبارح العصر.
      ar: غمر المدُّ الشارعَ في كوتا لاما عصر أمس.
      en: The road in Kota Lama was flooded by the tide yesterday afternoon.
    - speaker: Mohamed
      text: Rob menika menapa, Pak?
      ar_eg: يعني إيه rob يا عمّو؟
      ar: ما الـ rob يا سيدي؟
      en: What's rob, sir?
    - speaker: Pak Harjo
      text: Banyu segara sing munggah menyang dalan. Ing Semarang kerep.
      ar_eg: مية البحر اللي بتطلع على الشوارع. بتحصل كتير في سيمارانج.
      ar: ماء البحر حين يصعد إلى الشوارع، ويكثر في سيمارانج.
      en: Seawater that comes up onto the streets. It happens a lot in Semarang.
    - speaker: Mohamed
      text: Oh, kula ngertos. Matur nuwun, Pak.
      ar_eg: آه، فهمت. متشكر يا عمّو.
      ar: آه، فهمت. شكرًا يا سيدي.
      en: Oh, I see. Thank you, sir.
