schema: kabar.lesson/v1
id: j5.u02.l03
language: jv
title: Warta cekak
can_do:
  ar_eg: تقرا خبر قصير.
  ar: أن تقرأ خبرًا قصيرًا.
  en: Read a short news item.
slides:
  - title: Rob ing Semarang
    body:
      ar_eg: |
        خبر قصير من جرنال سيمارانج. اسأل نفسك تلات أسئلة: حصل إيه؟ مين عمل؟ إمتى؟
        rob = لما مية البحر تطلع على الشوارع وقت المد العالي، وده بيحصل كتير في سيمارانج. kebanjiran = غرقت مية (ke-…-an = حاجة حصلتلها). diresiki = اتنضّفت (resik = نضيف).
      ar: |
        خبر قصير من جريدة في سيمارانج. اسأل نفسك ثلاثة أسئلة: ماذا حدث؟ من فعل؟ متى؟
        rob = طغيان ماء البحر على الشوارع عند المدّ العالي، وهو كثير في سيمارانج. وkebanjiran = غمرته المياه (ke-…-an لما أصاب الشيء)، وdiresiki = نُظِّف (resik = نظيف).
      en: |
        A short news item from a Semarang paper. Ask three questions: what happened? who did it? when?
        rob = seawater spilling onto the streets at high tide, common in Semarang. kebanjiran = got flooded (ke-…-an = something happened to it). diresiki = was cleaned (resik = clean).
    grammar: jv.passive.written
    examples:
      - text: Dalan ing Kutha Lama kebanjiran rob wingi sore.
        ar_eg: الشارع في كوتا لاما غرق من مية البحر امبارح العصر.
        ar: غمر ماءُ المدّ الشارعَ في كوتا لاما عصر أمس.
        en: The road in Kota Lama was flooded by the tide yesterday afternoon.
      - text: Esuk iki, dalan kasebut wis diresiki dening warga.
        ar_eg: الصبح ده، الأهالي نضّفوا الشارع المذكور خلاص.
        ar: وفي صباح اليوم نظّف الأهالي الشارع المذكور.
        en: This morning, the said road was cleaned up by the residents.
      - text: Rob kerep teka ing pesisir lor.
        ar_eg: المد العالي بييجي كتير على الساحل الشمالي.
        ar: يأتي المدّ العالي كثيرًا على الساحل الشمالي.
        en: Tidal floods often come to the north coast.
