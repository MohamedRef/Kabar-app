schema: kabar.lesson/v1
id: j1.u06.l01
language: jv
title: Nang, neng, saka
can_do:
  ar_eg: تقول لـ وفي ومن، وتقول هنا وهناك.
  ar: أن تقول إلى وفي ومن، وتقول هنا وهناك.
  en: Say to, at and from, and say here and there.
slides:
  - title: nang / neng = ke + di
    body:
      ar_eg: |
        وصلنا وونوكرومو، جنوب سورابايا! في الإندونيسي فيه ke (لـ) وdi (في). الجاوي بيستعمل كلمة واحدة للاتنين: **nang** (أكتر في سورابايا) أو **neng** (أكتر في سولو ويوجيا).
        - Aku arep nang pasar = Saya mau ke pasar = رايح السوق.
        - Aku nang pasar = Saya di pasar = أنا في السوق.
        السياق هو اللي بيفرّق، زي المصري بالظبط لما بنقول «أنا في السوق» و«رايح السوق».
      ar: |
        وصلنا إلى وونوكرومو جنوب سورابايا! في الإندونيسية ke (إلى) وdi (في)، أما الجاوية فتستعمل لفظًا واحدًا لهما: **nang** (أشيع في سورابايا) أو **neng** (أشيع في سولو ويوجيا).
        - Aku arep nang pasar = Saya mau ke pasar = سأذهب إلى السوق.
        - Aku nang pasar = Saya di pasar = أنا في السوق.
        والسياق هو الذي يفرّق.
      en: |
        We've reached Wonokromo, south Surabaya! Indonesian has ke (to) and di (at). Javanese uses one word for both: **nang** (more Surabaya) or **neng** (more Solo / Yogya).
        - Aku arep nang pasar = Saya mau ke pasar = I'm going to the market.
        - Aku nang pasar = Saya di pasar = I'm at the market.
        Context decides.
    grammar: jv.preposition.place
    examples:
      - text: Aku arep nang Wonokromo.
        ar_eg: أنا رايح وونوكرومو.
        ar: سأذهب إلى وونوكرومو.
        en: I'm going to Wonokromo.
      - text: Mas Dimas neng omah.
        ar_eg: ديماس في البيت.
        ar: ديماس في البيت.
        en: Mas Dimas is at home.
  - title: ng prabowo?
    body:
      ar_eg: |
        في الشات nang / neng بتتكتب **ng** بس. فلما تشوف «ng prabowo?» اقراها nang Prabowo? = لبرابوو؟ (رايح لبرابوو؟)
        وفيه كمان كلمتين أرسمي شوية:
        - **menyang** = ke، في كلام متأني أكتر: Aku menyang pasar.
        - **ing** = di، في الكتابة واليافطات والكلام الرسمي: ing Suroboyo = في سورابايا.
      ar: |
        تُكتب nang / neng في الدردشة **ng** فقط، فـ«ng prabowo?» تُقرأ nang Prabowo? = إلى برابوو؟
        وهناك لفظان أكثر رسمية:
        - **menyang** = ke في الكلام المتأني: Aku menyang pasar.
        - **ing** = di في الكتابة واللافتات والمقام الرسمي: ing Suroboyo = في سورابايا.
      en: |
        Chats shrink nang / neng to just **ng**. So "ng prabowo?" reads nang Prabowo? = To Prabowo?
        Two more careful words:
        - **menyang** = ke, in more careful speech: Aku menyang pasar.
        - **ing** = di, in writing, signs and formal speech: ing Suroboyo = in Surabaya.
    grammar: jv.preposition.place
    examples:
      - text: ng prabowo?
        ar_eg: لبرابوو؟ (شات)
        ar: إلى برابوو؟ (دردشة)
        en: To Prabowo? (chat)
      - text: Aku ng pasar.
        ar_eg: أنا في السوق. (شات)
        ar: أنا في السوق. (دردشة)
        en: I'm at the market. (chat)
  - title: saka = dari (Arek teko)
    body:
      ar_eg: |
        **saka** = dari = من. إنت عارفها من «Aku saka Kairo». وفي سورابايا بيقولوا **teko**.
        - Kowe saka ngendi? = Kamu dari mana? = إنت منين؟
        - Teko endi, Cak? = منين يا معلم؟ (Arek)
        وخلي بالك: nang (لـ) وsaka (من) عكس بعض، ماتحطهمش مع بعض.
      ar: |
        **saka** = dari = من، وتعرفها من «Aku saka Kairo»، وفي سورابايا **teko**.
        - Kowe saka ngendi? = Kamu dari mana? = من أين أنت؟
        - Teko endi, Cak? = من أين يا أخي؟ (Arek)
        وانتبه: nang (إلى) وsaka (من) متقابلتان فلا تجتمعان.
      en: |
        **saka** = dari = from. You know it from "Aku saka Kairo". Surabaya says **teko**.
        - Kowe saka ngendi? = Kamu dari mana? = Where are you from?
        - Teko endi, Cak? = Where from, brother? (Arek)
        Careful: nang (to) and saka (from) are opposites; never stack them.
    grammar: jv.preposition.place
    examples:
      - text: Kowe saka ngendi?
        ar_eg: إنت منين؟
        ar: من أين أنت؟
        en: Where are you from?
      - text: Aku saka Mesir.
        ar_eg: أنا من مصر.
        ar: أنا من مصر.
        en: I'm from Egypt.
  - title: kene, kono, kana
    body:
      ar_eg: |
        الإندونيسي عنده sini / situ / sana، والجاوي:
        - **kene** = sini = هنا (جنبي).
        - **kono** = situ = هناك، قريب منك إنت.
        - **kana** = sana = هناك بعيد عننا الاتنين.
        ومعاهم nang: nang kene = هنا / لهنا، nang kana = هناك.
      ar: |
        تقابل sini / situ / sana في الجاوية:
        - **kene** = sini = هنا (عند المتكلم).
        - **kono** = situ = هناك، قرب المخاطب.
        - **kana** = sana = هنالك، بعيدًا عنهما.
        ومع nang: nang kene = هنا / إلى هنا، nang kana = هناك.
      en: |
        Indonesian sini / situ / sana become:
        - **kene** = sini = here (by me).
        - **kono** = situ = there, near you.
        - **kana** = sana = over there, far from both of us.
        With nang: nang kene = (to) here, nang kana = (to) over there.
    grammar: jv.preposition.place
    examples:
      - text: Aku nang kene, Cak!
        ar_eg: أنا هنا يا معلم!
        ar: أنا هنا يا أخي!
        en: I'm here, Cak!
      - text: Pasare nang kana.
        ar_eg: السوق هناك (بعيد).
        ar: السوق هناك بعيدًا.
        en: The market is over there.
exercises:
  - id: e01
    type: multiple_choice
    question: Aku saka Mesir.
    question_meaning:
      ar_eg: أنهي جملة إندونيسي معناها كده؟
      ar: أيّ جملة إندونيسية تقابلها؟
      en: Which Indonesian sentence matches?
    options: [Saya di Mesir., Saya ke Mesir., Saya dari Mesir.]
    answer: 2
    explain:
      ar_eg: saka = dari (من).
      ar: saka = dari (من).
      en: saka = dari (from).
    words: [saka]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك Cak Heru في آخر الملعب، بعيد عنكم إنتم الاتنين. تقول «Cak Heru هناك» إزاي؟
      ar: صديقك Cak Heru في آخر الملعب بعيدًا عنكما. كيف تقول «Cak Heru هناك»؟
      en: Your friend Cak Heru is at the far end of the field, far from both of you. How do you say "Cak Heru is over there"?
    options: [Cak Heru nang kene., Cak Heru nang kana., Cak Heru nang kono.]
    answer: 1
    explain:
      ar_eg: kana = بعيد عن الاتنين (sana). kono = قريب منك (situ). kene = هنا.
      ar: kana للبعيد عنكما (sana)، وkono للقريب من المخاطب (situ)، وkene هنا.
      en: kana = far from both (sana); kono = near you (situ); kene = here.
    words: [kana, kono, kene, nang / neng]
  - id: e03
    type: fill_blank
    sentence: Aku ___ kene, Cak!
    meaning:
      ar_eg: أنا هنا يا معلم!
      ar: أنا هنا يا أخي!
      en: I'm here, Cak!
    options: [nang, saka, iki]
    answers: [nang]
    explain:
      ar_eg: nang هنا بمعنى di (في). «Aku saka kene» تبقى «أنا من هنا»، معنى تاني.
      ar: nang هنا بمعنى di، أما «Aku saka kene» فمعناها «أنا من هنا».
      en: nang here means di. "Aku saka kene" would mean "I'm from here".
    words: [nang / neng, kene]
  - id: e04
    type: listen
    text: Aku arep menyang Wonokromo.
    options: ['Aku arep menyang Wonokromo.', 'Aku arep nang kono.', 'Aku isih ing kene.']
    answer: 0
    meaning:
      ar_eg: أنا رايح وونوكرومو.
      ar: سأذهب إلى ونوكرومو.
      en: I'm going to Wonokromo.
    words: [arep, menyang, nang / neng, kono, ing, kene]
  - id: e05
    type: match_pairs
    pairs:
      - text: menyang
        ar_eg: لـ (= ke، متأنية)
        ar: إلى (= ke)
        en: to (= ke, careful speech)
      - text: ing
        ar_eg: في (= di، رسمي)
        ar: في (= di، رسمي)
        en: in, at (= di, formal)
      - text: kene
        ar_eg: هنا (= sini)
        ar: هنا (= sini)
        en: here (= sini)
      - text: kono
        ar_eg: هناك قريب منك (= situ)
        ar: هناك قربك (= situ)
        en: there, near you (= situ)
      - text: kana
        ar_eg: هناك بعيد (= sana)
        ar: هناك بعيدًا (= sana)
        en: over there (= sana)
      - text: saka
        ar_eg: من (= dari)
        ar: مِن (= dari)
        en: from (= dari)
    words: [menyang, ing, kene, kono, kana, saka]
  - id: e06
    type: speaking
    text: Aku arep menyang Wonokromo.
    meaning:
      ar_eg: أنا رايح وونوكرومو.
      ar: سأذهب إلى ونوكرومو.
      en: I'm going to Wonokromo.
    words: [arep, menyang]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «في» وبتلاقيها في اللافتات والكلام الرسمي؟
      ar: أيّ كلمة تعني «في» وتظهر في اللافتات والكلام الرسمي؟
      en: Which word means "in / at" and appears on signs and in formal speech?
    options: [ing, kana, kono]
    answer: 0
    explain:
      ar_eg: ing = di بس رسمية. kana وkono معناهم «هناك».
      ar: ing = di لكنها رسمية، أما kana وkono فتعنيان «هناك».
      en: ing = di, but formal; kana and kono both mean "there".
    words: [ing, kana, kono]
dialogue:
  lines:
    - speaker: Mohamed
      text: Cak, kowe nang ngendi?
      ar_eg: يا كاك، إنت فين؟
      ar: يا كاك، أين أنت؟
      en: Cak, where are you?
    - speaker: Cak Heru
      text: Aku nang kene, nang pasar!
      ar_eg: أنا هنا، في السوق!
      ar: أنا هنا، في السوق!
      en: I'm here, at the market!
    - speaker: Mohamed
      text: Mas Yudha neng omah?
      ar_eg: يودا في البيت؟
      ar: هل يودا في البيت؟
      en: Is Yudha at home?
    - speaker: Cak Heru
      text: Yudha nang kana, nang stasiun.
      ar_eg: يودا هناك، في المحطة.
      ar: يودا هناك، في المحطة.
      en: Yudha is over there, at the station.
new_words:
  - word: nang / neng
    pos: preposition
    ar_eg: لـ / في (= ke / di)؛ nang أكتر في سورابايا، neng في سولو ويوجيا؛ في الشات ng
    ar: إلى / في (= ke / di)؛ nang أشيع في سورابايا وneng في سولو ويوجيا؛ وفي الدردشة ng
    en: to / at (= ke / di); nang more Surabaya, neng more Solo / Yogya; chat ng
  - word: menyang
    pos: preposition
    ar_eg: لـ (= ke)، في كلام متأني
    ar: إلى (= ke) في الكلام المتأني
    en: to (= ke), careful speech
  - word: ing
    pos: preposition
    ar_eg: في (= di)، رسمي ومكتوب
    ar: في (= di)، رسمي ومكتوب
    en: in, at (= di), formal / written
  - word: kene
    pos: adverb
    ar_eg: هنا (= sini)
    ar: هنا (= sini)
    en: here (= sini)
  - word: kono
    pos: adverb
    ar_eg: هناك، قريب منك (= situ)
    ar: هناك قرب المخاطب (= situ)
    en: there, near you (= situ)
  - word: kana
    pos: adverb
    ar_eg: هناك بعيد (= sana)
    ar: هنالك بعيدًا (= sana)
    en: over there (= sana)
review:
  status: draft
  verified: false
