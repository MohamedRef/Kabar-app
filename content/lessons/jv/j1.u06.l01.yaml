schema: kabar.lesson/v1
id: j1.u06.l01
language: jv
title: Neng, saka, mrene
can_do:
  ar_eg: تقول لـ وفي ومن، وتقول هنا وهناك.
  ar: أن تقول إلى وفي ومن، وتقول هنا وهناك.
  en: Say to, at and from, and say here and there.
slides:
  - title: neng = ke + di
    body:
      ar_eg: |
        وصلنا Prawirotaman، حي جنوب يوجيا مليان هوستلات وكافيهات! إنت عارف **neng** من J1.3، والنهارده هنستعملها في المشاوير:
        - Aku arep neng pasar = Saya mau ke pasar = رايح السوق.
        - Aku neng pasar = Saya di pasar = أنا في السوق.
        السياق هو اللي بيفرّق، زي المصري بالظبط: «أنا في السوق» و«رايح السوق».
        وممكن تسمع nang من ناس جايين من شرق جاوة، بس في يوجيا وماديون قول neng.
      ar: |
        وصلنا إلى Prawirotaman، حيّ في جنوب يوجيا مليء بالنُّزُل والمقاهي! تعرف **neng** من J1.3، واليوم نستعملها في التنقل:
        - Aku arep neng pasar = Saya mau ke pasar = سأذهب إلى السوق.
        - Aku neng pasar = Saya di pasar = أنا في السوق.
        والسياق هو الذي يفرّق.
        وقد تسمع nang من أهل شرق جاوة، أما في يوجيا وماديون فقل neng.
      en: |
        We've reached Prawirotaman, a south Jogja neighbourhood full of guesthouses and cafés! You know **neng** from J1.3; today we use it for getting around:
        - Aku arep neng pasar = Saya mau ke pasar = I'm going to the market.
        - Aku neng pasar = Saya di pasar = I'm at the market.
        Context decides, just like Egyptian Arabic.
        You may hear nang from East Javanese visitors, but in Jogja and Madiun say neng.
    grammar: jv.preposition.place
    examples:
      - text: Aku arep neng Prawirotaman.
        ar_eg: أنا رايح براويروتامان.
        ar: سأذهب إلى براويروتامان.
        en: I'm going to Prawirotaman.
      - text: Mas Dimas neng omah.
        ar_eg: ديماس في البيت.
        ar: ديماس في البيت.
        en: Mas Dimas is at home.
  - title: ng prabowo?
    body:
      ar_eg: |
        في الشات neng بتتكتب **ng** بس. فلما تشوف «ng prabowo?» اقراها neng Prabowo? = لبرابوو؟ (رايح لبرابوو؟)
        وفيه كمان كلمتين أرسمي شوية:
        - **menyang** = ke، في كلام متأني أكتر: Aku menyang pasar.
        - **ing** = di، في الكتابة واليافطات والكلام الرسمي: ing Yogyakarta = في يوجياكرتا.
        ولما تنادي حد: **mrene** = تعالى هنا، و**mrana** = روح هناك.
      ar: |
        تُكتب neng في الدردشة **ng** فقط، فـ«ng prabowo?» تُقرأ neng Prabowo? = إلى برابوو؟
        وهناك لفظان أكثر رسمية:
        - **menyang** = ke في الكلام المتأني: Aku menyang pasar.
        - **ing** = di في الكتابة واللافتات والمقام الرسمي: ing Yogyakarta = في يوجياكرتا.
        وللنداء: **mrene** = تعالَ إلى هنا، و**mrana** = اذهب إلى هناك.
      en: |
        Chats shrink neng to just **ng**. So "ng prabowo?" reads neng Prabowo? = To Prabowo?
        Two more careful words:
        - **menyang** = ke, in more careful speech: Aku menyang pasar.
        - **ing** = di, in writing, signs and formal speech: ing Yogyakarta = in Yogyakarta.
        And when calling someone: **mrene** = come here, **mrana** = go over there.
    grammar: jv.preposition.place
    examples:
      - text: ng prabowo?
        ar_eg: لبرابوو؟ (شات)
        ar: إلى برابوو؟ (دردشة)
        en: To Prabowo? (chat)
      - text: Mrene, cah!
        ar_eg: تعالوا هنا يا جماعة!
        ar: تعالوا إلى هنا يا رفاق!
        en: Come here, guys!
  - title: kene, kono, kana
    body:
      ar_eg: |
        الإندونيسي عنده sini / situ / sana، والجاوي:
        - **kene** = sini = هنا (جنبي).
        - **kono** = situ = هناك، قريب منك إنت.
        - **kana** = sana = هناك بعيد عننا الاتنين.
        ومعاهم neng: neng kene = هنا / لهنا، neng kana = هناك.
      ar: |
        تقابل sini / situ / sana في الجاوية:
        - **kene** = sini = هنا (عند المتكلم).
        - **kono** = situ = هناك، قرب المخاطب.
        - **kana** = sana = هنالك، بعيدًا عنهما.
        ومع neng: neng kene = هنا / إلى هنا، neng kana = هناك.
      en: |
        Indonesian sini / situ / sana become:
        - **kene** = sini = here (by me).
        - **kono** = situ = there, near you.
        - **kana** = sana = over there, far from both of us.
        With neng: neng kene = (to) here, neng kana = (to) over there.
    grammar: jv.preposition.place
    examples:
      - text: Aku neng kene, Mas!
        ar_eg: أنا هنا يا معلم!
        ar: أنا هنا يا أخي!
        en: I'm here, Mas!
      - text: Pasare neng kana.
        ar_eg: السوق هناك (بعيد).
        ar: السوق هناك بعيدًا.
        en: The market is over there.
exercises:
  - id: e01
    type: multiple_choice
    question: Aku saka Mesir.
    question_meaning:
      ar_eg: أنهي جملة إندونيسي معناها كده؟
      ar: أيّ جملة إندونيسية تقابلها؟
      en: Which Indonesian sentence matches?
    options: [Saya di Mesir., Saya ke Mesir., Saya dari Mesir.]
    answer: 2
    explain:
      ar_eg: saka = dari (من).
      ar: saka = dari (من).
      en: saka = dari (from).
    words: [saka]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك Mas Heru في آخر الملعب، بعيد عنكم إنتم الاتنين. تقول «Mas Heru هناك» إزاي؟
      ar: صديقك Mas Heru في آخر الملعب بعيدًا عنكما. كيف تقول «Mas Heru هناك»؟
      en: Your friend Mas Heru is at the far end of the field, far from both of you. How do you say "Mas Heru is over there"?
    options: [Mas Heru neng kene., Mas Heru neng kana., Mas Heru neng kono.]
    answer: 1
    explain:
      ar_eg: kana = بعيد عن الاتنين (sana). kono = قريب منك (situ). kene = هنا.
      ar: kana للبعيد عنكما (sana)، وkono للقريب من المخاطب (situ)، وkene هنا.
      en: kana = far from both (sana); kono = near you (situ); kene = here.
    words: [kana, kono, kene, neng]
  - id: e03
    type: fill_blank
    sentence: Aku ___ kene, Mas!
    meaning:
      ar_eg: أنا هنا يا معلم!
      ar: أنا هنا يا أخي!
      en: I'm here, Mas!
    options: [neng, saka, iki]
    answers: [neng]
    explain:
      ar_eg: neng هنا بمعنى di (في). «Aku saka kene» تبقى «أنا من هنا»، معنى تاني.
      ar: neng هنا بمعنى di، أما «Aku saka kene» فمعناها «أنا من هنا».
      en: neng here means di. "Aku saka kene" would mean "I'm from here".
    words: [neng, kene]
  - id: e04
    type: listen
    text: Aku arep menyang Prawirotaman.
    options: ['Aku arep menyang Prawirotaman.', 'Aku arep neng kono.', 'Aku isih ing kene.']
    answer: 0
    meaning:
      ar_eg: أنا رايح براويروتامان.
      ar: سأذهب إلى ونوكرومو.
      en: I'm going to Prawirotaman.
    words: [arep, menyang, neng, kono, ing, kene]
  - id: e05
    type: match_pairs
    pairs:
      - text: menyang
        ar_eg: لـ (= ke، متأنية)
        ar: إلى (= ke)
        en: to (= ke, careful speech)
      - text: ing
        ar_eg: في (= di، رسمي)
        ar: في (= di، رسمي)
        en: in, at (= di, formal)
      - text: kene
        ar_eg: هنا (= sini)
        ar: هنا (= sini)
        en: here (= sini)
      - text: kono
        ar_eg: هناك قريب منك (= situ)
        ar: هناك قربك (= situ)
        en: there, near you (= situ)
      - text: kana
        ar_eg: هناك بعيد (= sana)
        ar: هناك بعيدًا (= sana)
        en: over there (= sana)
      - text: saka
        ar_eg: من (= dari)
        ar: مِن (= dari)
        en: from (= dari)
    words: [menyang, ing, kene, kono, kana, saka]
  - id: e06
    type: speaking
    text: Aku arep menyang Prawirotaman.
    meaning:
      ar_eg: أنا رايح براويروتامان.
      ar: سأذهب إلى ونوكرومو.
      en: I'm going to Prawirotaman.
    words: [arep, menyang]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «في» وبتلاقيها في اللافتات والكلام الرسمي؟
      ar: أيّ كلمة تعني «في» وتظهر في اللافتات والكلام الرسمي؟
      en: Which word means "in / at" and appears on signs and in formal speech?
    options: [ing, kana, kono]
    answer: 0
    explain:
      ar_eg: ing = di بس رسمية. kana وkono معناهم «هناك».
      ar: ing = di لكنها رسمية، أما kana وkono فتعنيان «هناك».
      en: ing = di, but formal; kana and kono both mean "there".
    words: [ing, kana, kono]
  - id: e08
    type: multiple_choice
    question: Mrene, cah!
    question_meaning:
      ar_eg: Mas Heru نادى عليكم كده. يقصد إيه؟
      ar: ناداكم Mas Heru هكذا. ماذا يقصد؟
      en: Mas Heru calls this out to you. What does he mean?
    options: [تعالوا هنا, روحوا هناك, استنوا]
    answer: 0
    explain:
      ar_eg: mrene = لهنا (ke sini)، وmrana = لهناك (ke sana).
      ar: mrene = إلى هنا (ke sini)، وmrana = إلى هناك (ke sana).
      en: mrene = (to) here (ke sini); mrana = (to) over there (ke sana).
    words: [mrene, mrana]
  - id: e09
    type: fill_blank
    sentence: ___, Mas! Aku neng kene.
    meaning:
      ar_eg: تعالى هنا يا كابتن! أنا هنا.
      ar: تعالَ إلى هنا يا أخي! أنا هنا.
      en: Come here, Mas! I'm here.
    options: [Mrene, Mrana, Saka]
    answers: [Mrene]
    explain:
      ar_eg: هو هنا، فبيقولك «تعالى» بكلمة mrene.
      ar: هو هنا، فيدعوك إليه بكلمة mrene.
      en: 'He''s here, so he calls you over with mrene.'
    words: [mrene, mrana, kene]
  - id: e10
    type: listen
    text: Pasare neng kana, mrana wae.
    options: ['Pasare neng kana, mrana wae.', 'Pasare neng kene, mrene wae.', 'Pasare neng kono.']
    answer: 0
    meaning:
      ar_eg: السوق هناك، روح هناك وخلاص.
      ar: السوق هناك، اذهب إلى هناك فحسب.
      en: The market is over there, just head that way.
    words: [mrana, mrene, kana]
dialogue:
  title: Neng ngendi?
  lines:
    - speaker: Mohamed
      text: Mas, kowe neng ngendi?
      ar_eg: يا كاك، إنت فين؟
      ar: يا كاك، أين أنت؟
      en: Mas, where are you?
    - speaker: Mas Heru
      text: Aku neng kene, neng pasar!
      ar_eg: أنا هنا، في السوق!
      ar: أنا هنا، في السوق!
      en: I'm here, at the market!
    - speaker: Mohamed
      text: Mas Yudha neng omah?
      ar_eg: يودا في البيت؟
      ar: هل يودا في البيت؟
      en: Is Yudha at home?
    - speaker: Mas Heru
      text: Yudha neng kana, neng stasiun.
      ar_eg: يودا هناك، في المحطة.
      ar: يودا هناك، في المحطة.
      en: Yudha is over there, at the station.
new_words:
  - word: menyang
    pos: preposition
    ar_eg: لـ (= ke)، في كلام متأني
    ar: إلى (= ke) في الكلام المتأني
    en: to (= ke), careful speech
  - word: kono
    pos: adverb
    ar_eg: هناك، قريب منك (= situ)
    ar: هناك قرب المخاطب (= situ)
    en: there, near you (= situ)
  - word: kana
    pos: adverb
    ar_eg: هناك بعيد (= sana)
    ar: هنالك بعيدًا (= sana)
    en: over there (= sana)
  - word: mrene
    pos: adverb
    ar_eg: لهنا، تعالى هنا (= ke sini)
    ar: إلى هنا (= ke sini)
    en: (to) here, come here (= ke sini)
  - word: mrana
    pos: adverb
    ar_eg: لهناك، روح هناك (= ke sana)
    ar: إلى هناك (= ke sana)
    en: (to) over there (= ke sana)
