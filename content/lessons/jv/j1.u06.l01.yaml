dialogue:
  title: Nang stasiun Wonokromo
  lines:
    - speaker: Mohamed
      text: Cak, kowé arep nang ngendi?
      ar_eg: يا معلم، إنت رايح فين؟
      ar: يا أخي، إلى أين أنت ذاهب؟
      en: Cak, where are you going?
    - speaker: Cak Heru
      text: Aku kate nang pasar. Koen?
      ar_eg: أنا رايح السوق. وإنت؟
      ar: أنا ذاهب إلى السوق. وأنت؟
      en: I'm going to the market. You?
    - speaker: Mohamed
      text: Aku arep nang kebun binatang. Nang ngendi?
      ar_eg: أنا رايح جنينة الحيوانات. هي فين؟
      ar: سأذهب إلى حديقة الحيوان. أين هي؟
      en: I'm going to the zoo. Where is it?
    - speaker: Cak Heru
      text: Saka kene lurus wae, terus nengen.
      ar_eg: من هنا على طول، وبعدين يمين.
      ar: من هنا امشِ مباشرة ثم انعطف يمينًا.
      en: From here go straight, then turn right.
    - speaker: Mohamed
      text: Matur nuwun, Cak!
      ar_eg: شكرًا يا معلم!
      ar: شكرًا يا أخي!
      en: Thanks, Cak!
new_words:
  - word: nang / neng
    pos: preposition
    ar_eg: لـ / في (= ke / di)؛ nang أكتر في سورابايا، neng في سولو ويوجيا؛ في الشات ng
    ar: إلى / في (= ke / di)؛ nang أشيع في سورابايا وneng في سولو ويوجيا؛ وفي الدردشة ng
    en: to / at (= ke / di); nang more Surabaya, neng more Solo / Yogya; chat ng
  - word: menyang
    pos: preposition
    ar_eg: لـ (= ke)، في كلام متأني
    ar: إلى (= ke) في الكلام المتأني
    en: to (= ke), careful speech
  - word: ing
    pos: preposition
    ar_eg: في (= di)، رسمي ومكتوب
    ar: في (= di)، رسمي ومكتوب
    en: in, at (= di), formal / written
  - word: kene
    pos: adverb
    ar_eg: هنا (= sini)
    ar: هنا (= sini)
    en: here (= sini)
  - word: kono
    pos: adverb
    ar_eg: هناك، قريب منك (= situ)
    ar: هناك قرب المخاطب (= situ)
    en: there, near you (= situ)
  - word: kana
    pos: adverb
    ar_eg: هناك بعيد (= sana)
    ar: هنالك بعيدًا (= sana)
    en: over there (= sana)
  - word: ngarep
    pos: preposition
    ar_eg: قدام (= depan)
    ar: أمام (= depan)
    en: in front of (= depan)
  - word: mburi
    pos: preposition
    ar_eg: ورا (= belakang)
    ar: خلف (= belakang)
    en: behind (= belakang)
  - word: jejeré
    pos: preposition
    ar_eg: جنب (= sebelah)
    ar: بجانب (= sebelah)
    en: next to (= sebelah)
  - word: ngiwa
    pos: verb
    ar_eg: يخش شمال (= belok kiri)
    ar: ينعطف يسارًا (= belok kiri)
    en: turn left (= belok kiri)
  - word: nengen
    pos: verb
    ar_eg: يخش يمين (= belok kanan)
    ar: ينعطف يمينًا (= belok kanan)
    en: turn right (= belok kanan)
  - word: lurus
    pos: adverb
    ar_eg: على طول (= lurus)
    ar: إلى الأمام مباشرة (= lurus)
    en: straight on (= lurus)
  - word: terus
    pos: conjunction
    ar_eg: وبعدين (= lalu)
    ar: ثم (= lalu)
    en: then (= lalu)
  - word: kebun binatang
    pos: noun
    ar_eg: جنينة الحيوانات (نفس الكلمة الإندونيسية)
    ar: حديقة الحيوان (اللفظ الإندونيسي نفسه)
    en: zoo (same as Indonesian)
