    type: match_pairs
    pairs:
      - text: saka
        ar_eg: من (= dari)
        ar: من (= dari)
        en: from (= dari)
      - text: kene
        ar_eg: هنا (= sini)
        ar: هنا (= sini)
        en: here (= sini)
      - text: kana
        ar_eg: هناك بعيد (= sana)
        ar: هنالك (= sana)
        en: over there (= sana)
      - text: ngarep
        ar_eg: قدام (= depan)
        ar: أمام (= depan)
        en: in front (= depan)
      - text: mburi
        ar_eg: ورا (= belakang)
        ar: خلف (= belakang)
        en: behind (= belakang)
    words: [saka, kene, kana, ngarep, mburi]
  - id: e02
    type: multiple_choice
    question: Aku saka Mesir.
    question_meaning:
      ar_eg: أنهي جملة إندونيسي معناها كده؟
      ar: أيّ جملة إندونيسية تقابلها؟
      en: Which Indonesian sentence matches?
    options: ["Saya di Mesir.", "Saya ke Mesir.", "Saya dari Mesir."]
    answer: 2
    explain:
      ar_eg: saka = dari (من).
      ar: saka = dari (من).
      en: saka = dari (from).
    words: [saka]
  - id: e03
    type: multiple_choice
    question: ng prabowo?
    question_meaning:
      ar_eg: ng في الشات ده اختصار لإيه؟
      ar: ما أصل ng في هذه الدردشة؟
      en: What does ng stand for in this chat?
    options: ["ngendi", "nang", "ngarep"]
    answer: 1
    explain:
      ar_eg: ng = nang / neng (لـ / في). «ng prabowo?» = لبرابوو؟
      ar: ng = nang / neng، فـ«ng prabowo?» = إلى برابوو؟
      en: ng = nang / neng. "ng prabowo?" = To Prabowo?
    words: [nang]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك Cak Heru في آخر الملعب، بعيد عنكم إنتم الاتنين. تقول «Cak Heru هناك» إزاي؟
      ar: صديقك Cak Heru في آخر الملعب بعيدًا عنكما. كيف تقول «Cak Heru هناك»؟
      en: Your friend Cak Heru is at the far end of the field, far from both of you. How do you say "Cak Heru is over there"?
    options: ["Cak Heru nang kene.", "Cak Heru nang kana.", "Cak Heru nang kono."]
    answer: 1
    explain:
      ar_eg: kana = بعيد عن الاتنين (sana). kono = قريب منك (situ). kene = هنا.
      ar: kana للبعيد عنكما (sana)، وkono للقريب من المخاطب (situ)، وkene هنا.
      en: kana = far from both (sana); kono = near you (situ); kene = here.
    words: [kana, kono, kene]
  - id: e05
    type: listen
    text: Warungé nang jejeré masjid.
    options: ["Warungé nang ngarep masjid.", "Warungé nang mburi masjid.", "Warungé nang jejeré masjid."]
    answer: 2
    words: [jejeré, nang]
  - id: e06
    type: fill_blank
    sentence: Aku ___ kene, Cak!
    meaning:
      ar_eg: أنا هنا يا معلم!
      ar: أنا هنا يا أخي!
      en: I'm here, Cak!
    options: ["nang", "saka", "iki"]
    answers: ["nang"]
    explain:
      ar_eg: nang هنا بمعنى di (في). «Aku saka kene» تبقى «أنا من هنا»، معنى تاني.
      ar: nang هنا بمعنى di، أما «Aku saka kene» فمعناها «أنا من هنا».
      en: nang here means di. "Aku saka kene" would mean "I'm from here".
    words: [nang, kene]
  - id: e07
    type: fill_blank
    sentence: Kowé ___ ngendi?
    meaning:
      ar_eg: إنت منين؟
      ar: من أين أنت؟
      en: Where are you from?
    options: ["nang", "kene", "saka"]
    answers: ["saka"]
    explain:
      ar_eg: «منين» = saka ngendi. «Kowé nang ngendi?» يبقى «إنت فين؟».
      ar: «من أين» = saka ngendi، أما «Kowé nang ngendi?» فمعناها «أين أنت؟».
      en: 'Where from = saka ngendi. "Kowé nang ngendi?" means "Where are you?"'
    words: [saka, ngendi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: على طول، وبعدين شمال.
      ar: امشِ مباشرة ثم انعطف يسارًا.
      en: Go straight, then turn left.
    answer: Lurus wae, terus ngiwa.
    distractors: ["nengen", "saka"]
    words: [lurus, terus, ngiwa]
