      ar: ["الكشك أمام المحطة", "المحل أمام المحطة", "المطعم أمام المحطة"]
      en: ["The stall is in front of the station", "The warung is in front of the station", "The stall is in front of the station.", "The shop is in front of the station"]
    words: [ngarep, nang]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: خش يمين، وبعدين على طول.
      ar: انعطف يمينًا ثم امشِ مباشرة.
      en: Turn right, then go straight.
    answers: ["Nengen, terus lurus.", "Nengen, terus lurus", "Nengen terus lurus.", "Nengen terus lurus", "Nengen, terus lurus wae.", "Nengen, terus lurus wae", "Nengen terus lurus wae.", "Nengen terus lurus wae"]
    words: [nengen, terus, lurus]
  - id: e12
    type: dictation
    text: Aku saka Mesir.
    meaning:
      ar_eg: أنا من مصر.
      ar: أنا من مصر.
