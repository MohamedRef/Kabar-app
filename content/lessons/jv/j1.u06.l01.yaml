    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا رايح وونوكرومو.
      ar: سأذهب إلى وونوكرومو.
      en: I'm going to Wonokromo.
    answers: ["Aku arep nang Wonokromo.", "Aku arep nang Wonokromo", "Aku arep neng Wonokromo.", "Aku arep neng Wonokromo", "Aku arep menyang Wonokromo.", "Aku arep menyang Wonokromo", "Aku kate nang Wonokromo.", "Aku kate nang Wonokromo", "Aku arep ng Wonokromo.", "Aku arep ng Wonokromo", "Aku arp ng Wonokromo.", "Aku arp ng Wonokromo"]
    words: [arep, nang]
  - id: e10
