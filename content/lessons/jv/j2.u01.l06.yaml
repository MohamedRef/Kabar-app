schema: kabar.lesson/v1
id: j2.u01.l06
language: jv
title: Momong ponakan
can_do:
  ar_eg: 'تتكلم عن العيلة في البيت: مين بيراعي العيل، ومين بيشيل البيبي، ومين بيتخانق.'
  ar: 'أن تتحدث عن العائلة في البيت: من يرعى الطفل ومن يحمل الرضيع ومن يتشاجر.'
  en: 'Talk about family life at home: who minds the kids, who carries the baby, who''s squabbling.'
slides:
  - title: Neng omahe Pak Budi
    body:
      ar_eg: |
        - **kangmas** = أخويا الكبير، باحترام وحب (kakak laki-laki). ولما بنختصر بنقول Mas.
        - **wedok** = بنت / ست (perempuan): anak wedok = بنت (ابنة).
        - **momong** = يراعي عيل (mengasuh) · **nggendhong** = يشيل البيبي على جنبه أو في شال (menggendong).
        - **rewel** = نكدي وبيزن، للعيل (rewel) · **ngelus** = يطبطب ويمسح بإيده (mengelus).
        - **padu** = يتخانق (bertengkar) · **ngopeni** = يرعى ويهتم بحاجة أو حد (merawat).
      ar: |
        - **kangmas** = الأخ الأكبر، باحترام ومودة (kakak laki-laki)، ويُختصر Mas.
        - **wedok** = أنثى / امرأة (perempuan): anak wedok = ابنة.
        - **momong** = يرعى طفلًا (mengasuh) · **nggendhong** = يحمل الرضيع على جنبه أو في وشاح (menggendong).
        - **rewel** = كثير البكاء والتذمّر، للطفل (rewel) · **ngelus** = يربّت ويمسح بيده (mengelus).
        - **padu** = يتشاجر (bertengkar) · **ngopeni** = يرعى ويعتني (merawat).
      en: |
        - **kangmas** = older brother, said with respect and affection (kakak laki-laki); shortened to Mas.
        - **wedok** = female, girl, woman (perempuan): anak wedok = daughter.
        - **momong** = mind a child (mengasuh) · **nggendhong** = carry a baby on the hip or in a sling (menggendong).
        - **rewel** = fussy, whiny, of a child (rewel) · **ngelus** = stroke, pat gently (mengelus).
        - **padu** = quarrel (bertengkar) · **ngopeni** = look after, take care of (merawat).
    examples:
      - text: Sari lagi momong ponakane.
        ar_eg: ساري بتراعي بنت أختها.
        ar: ساري ترعى ابنة أختها.
        en: Sari is minding her niece.
      - text: Bayine rewel, Ibu nggendhong bayine.
        ar_eg: البيبي بيزن، وماما شايلاه.
        ar: الرضيع يبكي، والأم تحمله.
        en: The baby's fussy; Mum is carrying her.
      - text: Aja padu, cah!
        ar_eg: ماتتخانقوش يا ولاد!
        ar: لا تتشاجروا يا أولاد!
        en: Don't fight, you two!
