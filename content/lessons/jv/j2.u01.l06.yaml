  - id: e03
    type: listen
    text: Bayine rewel. Ibu nggendhong bayine.
    question:
      ar_eg: البيبي عامل إيه؟
      ar: ما حال الرضيع؟
      en: How's the baby?
    options: [البيبي بيزن، وماما شايلاه, البيبي نايم, البيبي بيضحك]
    answer: 0
    meaning:
      ar_eg: البيبي بيزن. وماما شايلاه.
      ar: الرضيع يبكي. والأم تحمله.
      en: The baby's fussy. Mum is carrying her.
    words: [rewel, nggendhong]
  - id: e04
    type: fill_blank
    sentence: Mbak Sari lagi ___ ponakane neng omah.
    meaning:
      ar_eg: ساري بـ ___ بنت أختها في البيت.
      ar: ساري ___ ابنة أختها في البيت.
      en: Sari is ___ her niece at home.
    options: [momong, padu, ngelus]
    answers: [momong]
    words: [momong, padu, ngelus]
  - id: e05
    type: fill_blank
    sentence: Aja ___ terus karo adhimu!
    meaning:
      ar_eg: ماتـ ___ ـش على طول مع أخوك الصغير!
      ar: لا ___ دائمًا مع أخيك الصغير!
      en: Don't keep ___ with your little brother!
    options: [padu, ngopeni, nggendhong]
    answers: [padu]
    words: [padu, ngopeni, nggendhong]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: «بنتي» بالجاوي؟
      ar: كيف تقول «ابنتي» بالجاوية؟
      en: '"My daughter" in Javanese?'
    options: [anakku wedok, kangmasku, bojoku]
    answer: 0
    explain:
      ar_eg: anak wedok = بنت (ابنة). kangmas = أخ كبير، وbojo = جوز / مرات.
      ar: anak wedok = ابنة، أما kangmas فالأخ الأكبر وbojo الزوج أو الزوجة.
      en: anak wedok = daughter. kangmas = older brother, bojo = spouse.
    words: [wedok, kangmas]
  - id: e07
    type: multiple_choice
    question: Simbah ngopeni pitik neng mburi omah.
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [جدتي بتربي فراخ ورا البيت, جدتي بتطبخ فراخ, جدتي بتبيع فراخ]
    answer: 0
    explain:
      ar_eg: ngopeni = merawat (يرعى ويربي).
      ar: ngopeni = merawat (يرعى).
      en: ngopeni = merawat (looks after, keeps).
    words: [ngopeni]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أخويا الكبير شايل البيبي.
      ar: أخي الأكبر يحمل الرضيع.
      en: My older brother is carrying the baby.
    answer: Kangmasku nggendhong bayi.
    distractors: [padu, rewel]
    words: [kangmas, nggendhong]
  - id: e09
    type: translate
    direction: from_target
    source_text: Ibu ngelus bocah sing rewel.
    answers_meaning:
      ar_eg: [ماما بتطبطب على العيل النكدي, الأم بتهدّي العيل اللي بيزن]
      ar: [تربّت الأم على الطفل المتذمّر, الأم تمسح على الطفل الباكي]
      en: [Mum strokes the fussy child, Mother is soothing the whiny kid]
    words: [ngelus, rewel]
  - id: e10
    type: speaking
    text: Anak wedok iki pinter momong adhine.
    meaning:
      ar_eg: البنت دي شاطرة في مراعاة أخوها الصغير.
      ar: هذه البنت ماهرة في رعاية أخيها الصغير.
      en: This girl is good at minding her little brother.
    words: [wedok, momong]
dialogue:
  lines:
    - speaker: Bu Rahayu
      text: Sari, ponakanmu rewel terus. Kowe sing nggendhong, ya.
      ar_eg: يا ساري، بنت أختك عمّالة تزنّ. شيليها إنتِ.
      ar: يا ساري، ابنة أختك لا تكفّ عن البكاء. احمليها أنتِ.
      en: Sari, your niece keeps fussing. You carry her, OK?
    - speaker: Sari
      text: Nggih, Bu. Cup, cup… aja nangis, Nduk.
      ar_eg: حاضر يا ماما. خلاص، خلاص… ماتعيطيش يا حبيبتي.
      ar: حاضر يا أمي. هُس، هُس… لا تبكي يا صغيرتي.
      en: Yes, Mum. Shh, shh… don't cry, sweetie.
    - speaker: Mohamed
      text: Sari pinter momong, ya.
      ar_eg: ساري شاطرة في مراعاة العيال.
      ar: ساري ماهرة في رعاية الأطفال.
      en: Sari's good with kids.
    - speaker: Sari
      text: Iya to. Kangmasku malah ra isa, hehe.
      ar_eg: طبعًا. أخويا الكبير مايعرفش خالص، هههه.
      ar: طبعًا. أخي الأكبر لا يجيد ذلك أبدًا، هه.
      en: Of course. My big brother can't do it at all, hehe.
    - speaker: Bu Rahayu
      text: Wis, aja padu. Kangmasmu sing ngopeni simbah.
      ar_eg: خلاص، بلاش خناق. أخوكِ الكبير هو اللي بيراعي جدتك.
      ar: كفى، لا شجار. أخوكِ الأكبر هو من يرعى الجدة.
      en: Enough, no squabbling. Your big brother is the one who looks after Grandma.
