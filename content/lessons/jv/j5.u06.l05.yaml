  - id: e03
    type: multiple_choice
    question: Nalika kowe lunga, atiku lara.
    question_meaning:
      ar_eg: nalika هنا معناها إيه بالإندونيسي؟
      ar: ما معنى nalika هنا بالإندونيسية؟
      en: What is nalika here in Indonesian?
    options: [ketika, kalau, sesudah]
    answer: 0
    words: [nalika, ati]
  - id: e04
    type: listen
    text: Cah angon, cah angon, penekna blimbing kuwi.
    options: ['Cah angon, cah angon, jupuken blimbing kuwi.', 'Cah cilik, cah cilik, penekna blimbing kuwi.', 'Cah angon, cah angon, penekna blimbing kuwi.']
    answer: 2
    meaning:
      ar_eg: يا راعي، يا راعي، اطلع شجرة الـ blimbing دي.
      ar: أيها الراعي، أيها الراعي، تسلّق شجرة الـ blimbing تلك.
      en: Shepherd boy, shepherd boy, climb that starfruit tree.
