  - id: e05
    type: listen
    text: Biyen kowe janji ora bakal lunga, nanging pungkasane kowe lunga.
    question:
      ar_eg: الشخص ده وفى بوعده؟
      ar: هل وفى هذا الشخص بوعده؟
      en: Did the person keep the promise?
    options: [iya, ora]
    answer: 1
    meaning:
      ar_eg: زمان إنت وعدت إنك مش هتمشي، بس في الآخر مشيت.
      ar: وعدتَ قديمًا بألّا ترحل، لكنك رحلت في النهاية.
      en: Back then you promised you'd never leave, but in the end you left.
    words: [janji, pungkasane]
  - id: e06
    type: fill_blank
    sentence: Ngelmu iku kalakone ___ laku.
    meaning:
      ar_eg: العلم بيتنال بالعمل.
      ar: العلم يُنال بالعمل.
      en: Knowledge is attained through practice.
    options: [wus, kanthi, kang]
    answers: [kanthi]
    words: [kanthi, ngelmu, laku]
  - id: e07
    type: fill_blank
    sentence: Aku ___ kowe.
    meaning:
