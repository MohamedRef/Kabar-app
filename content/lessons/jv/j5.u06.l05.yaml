id: j5.u06.l05
language: jv
title: Ulangan J5.6
can_do:
  ar_eg: تشرح معنى أغنية.
  ar: أن تشرح معنى أغنية.
  en: Explain a song's meaning.
slides:
  - title: Tembang lawas, tembang anyar
    body:
      ar_eg: |
        الأغاني القديمة (Lir-ilir، macapat) لغتها كتابة قديمة: wus = wis، iku بتعرّف، kanthi = بـ، وكلمات زي ngelmu (علم).
        الأغاني الجديدة (campursari) نغوكو عادي، بس بتحكي حكاية بأدوات الـ cerkak: biyen، nalika، sawise، pungkasane.
        ولما تشرح: critane، tegese، piwulange.
      ar: |
        لغة الأغاني القديمة (Lir-ilir والـ macapat) كتابية عتيقة: wus = wis، وiku للتعريف، وkanthi = بـ، وألفاظ مثل ngelmu (علم).
        أما الأغاني الحديثة (campursari) فبنغوكو عادية، لكنها تحكي حكاية بأدوات الـ cerkak: biyen، وnalika، وsawise، وpungkasane.
        وحين تشرح: critane، وtegese، وpiwulange.
      en: |
        Old songs (Lir-ilir, macapat) use old written language: wus = wis, iku defines, kanthi = by means of, and words like ngelmu (from «علم»).
        New songs (campursari) use plain ngoko, but tell a story with cerkak connectors: biyen, nalika, sawise, pungkasane.
        And to explain one: critane, tegese, piwulange.
    grammar: jv.narrative.connectors
    examples:
      - text: Lir-ilir, lir-ilir, tandure wus sumilir.
        ar_eg: اصحى، اصحى، الزرع ابتدا يتمايل.
        ar: انهض، انهض، فقد أخذ الزرع يتمايل.
        en: Wake up, wake up, the young plants are already stirring.
      - text: Nalika kowe lunga, atiku ambyar.
        ar_eg: لما مشيت، قلبي اتكسر حتت.
        ar: حين رحلتَ تحطّم قلبي.
        en: When you left, my heart was shattered.
exercises:
  - id: e01
    type: match_pairs
