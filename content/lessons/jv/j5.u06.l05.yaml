  - id: e10
    type: translate
    direction: from_target
    source_text: Miturut crita, tembang Lir-ilir kaanggit dening Sunan Kalijaga.
    answers_meaning:
      ar_eg:
        - بيقولوا إن أغنية Lir-ilir ألّفها سونان كاليجاغا.
        - حسب الحكاية، أغنية Lir-ilir ألّفها سونان كاليجاغا.
        - على حسب الرواية، Lir-ilir ألّفها سونان كاليجاغا.
        - حسب الرواية، أغنية Lir-ilir اتألّفت على إيد سونان كاليجاغا.
      ar:
        - تقول الرواية إن أغنية Lir-ilir من تأليف سونان كاليجاغا.
        - بحسب الرواية، ألّف سونان كاليجاغا أغنية Lir-ilir.
        - يُروى أن أغنية Lir-ilir من تأليف سونان كاليجاغا.
      en:
        - According to tradition, the song Lir-ilir was composed by Sunan Kalijaga.
        - According to the story, the song Lir-ilir was composed by Sunan Kalijaga.
        - According to tradition, Lir-ilir was composed by Sunan Kalijaga.
        - Tradition says the song Lir-ilir was composed by Sunan Kalijaga.
        - According to the story, Lir-ilir was written by Sunan Kalijaga.
    words: [tembang]
  - id: e11
    type: speaking
    text: Piwulange, ngelmu kudu dilakoni.
    meaning:
      ar_eg: الحكمة إن العلم لازم يتعمل بيه.
      ar: والعبرة أن العلم يجب أن يُعمل به.
      en: The lesson is that knowledge must be practised.
    words: [piwulang, ngelmu]
dialogue:
  title: Pamit saka Demak
  lines:
    - speaker: Pak Ahmad
      text: Mas, Wali Sanga mulang Islam nganggo tembang.
      ar_eg: يا ابني، الأولياء التسعة علّموا الإسلام بالأغاني.
      ar: يا بني، علّم الأولياء التسعة الإسلام بالأغاني.
      en: Young man, the Wali Sanga taught Islam through songs.
    - speaker: Mohamed
      text: Kados Lir-ilir, nggih, Pak?
      ar_eg: زي Lir-ilir، صح يا عمّو؟
      ar: مثل Lir-ilir، أليس كذلك يا سيدي؟
      en: Like Lir-ilir, right, sir?
    - speaker: Pak Ahmad
      text: Iya. Nganti saiki tembang iku isih ditembangake.
      ar_eg: آه. ولحد النهارده الأغنية دي لسه بتتغنّى.
      ar: نعم. وما تزال هذه الأغنية تُغنّى حتى اليوم.
      en: Yes. To this day that song is still sung.
    - speaker: Mohamed
      text: Sakmenika kula saged maos tembang, cerkak, lan warta basa Jawi.
      ar_eg: دلوقتي أنا بعرف أقرا أغاني وقصص وأخبار بالجاوي.
      ar: صرت الآن أقرأ الأغاني والقصص والأخبار بالجاوية.
      en: Now I can read songs, stories and news in Javanese.
    - speaker: Pak Ahmad
      text: Alhamdulillah. Sugeng tindak, Mas!
      ar_eg: الحمد لله. مع السلامة يا ابني!
      ar: الحمد لله. في أمان الله يا بني!
      en: Alhamdulillah. Safe travels, young man!
souvenir:
  id: j5.u06.souvenir
  title: Masjid Agung Demak
  note:
    ar_eg: |
      جامع دماك الكبير من أقدم جوامع جاوة، من القرن الخمستاشر، وسقفه طبقات فوق بعض على الطريقة الجاوية مش قبة. والحكاية بتقول إن الأولياء التسعة بنوه مع بعض، وإن سونان كاليجاغا عمل واحد من أعمدته من نشارة خشب متجمّعة (saka tatal). والأولياء دول علّموا الإسلام بالـ tembang، و«Lir-ilir» لسه بيتغنّى لحد النهارده، وإنت دلوقتي تقدر تقراه.
    ar: |
      مسجد دماك الكبير من أقدم مساجد جاوة، يعود إلى القرن الخامس عشر، وسقفه طبقات متراكبة على الطراز الجاوي لا قبة. وتروي الحكاية أن الأولياء التسعة بنوه معًا، وأن سونان كاليجاغا صنع أحد أعمدته من رقائق خشب مجمّعة (saka tatal). وقد علّم هؤلاء الأولياء الإسلام بالـ tembang، وما تزال «Lir-ilir» تُغنّى إلى اليوم، وصرت قادرًا على قراءتها.
    en: |
      Demak's Great Mosque is one of Java's oldest, from the 15th century, with a tiered Javanese roof instead of a dome. Legend says the Wali Sanga built it together, and that Sunan Kalijaga made one of its pillars from bound wood shavings (saka tatal). These saints taught Islam through tembang, and "Lir-ilir" is still sung today; now you can read it.
