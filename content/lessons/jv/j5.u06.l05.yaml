schema: kabar.lesson/v1
id: j5.u06.l05
language: jv
title: Pentas campursari
can_do:
  ar_eg: 'ترتب لحفلة كامبورساري: الدعوة، والطابور، والمطر، ورأيك في الفنانين.'
  ar: 'أن ترتّب لحضور حفل كامبورساري: الدعوة والطابور والمطر ورأيك في الفنانين.'
  en: 'Go to a campursari show: the invitation, the queue, the rain and what you thought of the performers.'
slides:
  - title: Nonton pentas
    body:
      ar_eg: |
        undangan = دعوة، ngantre = يقف في الطابور، deres = غزير (udan deres = مطر جامد).
        seniman = فنان، penari = راقص أو راقصة، istimewa = مميز (زي «استثنائي»).
        mutu = جودة: mutune apik = جودته حلوة. sukur = الحمد لله، أو شكر لربنا.
      ar: |
        undangan = دعوة، ngantre = يصطفّ في طابور، deres = غزير (udan deres = مطر غزير).
        seniman = فنان، penari = راقص أو راقصة، istimewa = مميّز.
        mutu = جودة: mutune apik = جودته عالية. sukur = الحمد لله، شكر لله.
      en: |
        undangan = invitation, ngantre = queue, deres = heavy (udan deres = heavy rain).
        seniman = artist, penari = dancer, istimewa = special.
        mutu = quality: mutune apik = good quality. sukur = thank God, gratitude.
    examples:
      - text: Penari lan seniman campursari pentas ing Semarang.
        ar_eg: راقصين وفنانين كامبورساري بيعرضوا في سيمارانج.
        ar: يقدّم راقصون وفنانو الكامبورساري عرضًا في سيمارانغ.
        en: Campursari dancers and artists are performing in Semarang.
      - text: Udane deres, nanging wong-wong isih ngantre.
        ar_eg: المطر جامد، بس الناس لسه واقفين في الطابور.
        ar: المطر غزير، لكن الناس ما زالوا في الطابور.
        en: The rain is heavy, but people are still queuing.
      - text: Sukur, aku oleh undangan!
        ar_eg: الحمد لله، جالي دعوة!
        ar: الحمد لله، حصلت على دعوة!
        en: Thank God, I got an invitation!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: penari
        ar_eg: راقص
        ar: راقص
        en: dancer
      - text: seniman
        ar_eg: فنان
        ar: فنان
        en: artist
      - text: istimewa
        ar_eg: مميز
        ar: مميّز
        en: special
      - text: undangan
        ar_eg: دعوة
        ar: دعوة
        en: invitation
    words: [penari, seniman, istimewa, undangan]
  - id: e02
    type: match_pairs
    pairs:
      - text: ngantre
        ar_eg: يقف في الطابور
        ar: يصطفّ
        en: queue
      - text: sukur
        ar_eg: الحمد لله
        ar: الحمد لله
        en: thank God
      - text: deres
        ar_eg: جامد (مطر)
        ar: غزير
        en: heavy (rain)
      - text: mutu
        ar_eg: جودة
        ar: جودة
        en: quality
    words: [ngantre, sukur, deres, mutu]
  - id: e03
    type: listen
    text: Udane deres, nanging wong-wong isih ngantre.
    question:
      ar_eg: إيه اللي بيحصل؟
      ar: ماذا يحدث؟
      en: What's happening?
    options: [المطر جامد والناس لسه في الطابور, الجو حلو والحفلة اتلغت, المطر وقف]
    answer: 0
    meaning:
      ar_eg: المطر جامد، بس الناس لسه واقفين في الطابور.
      ar: المطر غزير لكن الناس ما زالوا في الطابور.
      en: The rain's heavy, but people are still queuing.
    words: [deres, ngantre]
  - id: e04
    type: fill_blank
    sentence: Aku oleh ___ saka Mbak Ayu kanggo nonton pentas.
    meaning:
      ar_eg: خدت ___ من ميباك أيو عشان أتفرج على العرض.
      ar: حصلت على ___ من مباك أيو لمشاهدة العرض.
      en: I got an ___ from Mbak Ayu to see the show.
    options: [undangan, mutu, penari]
    answers: [undangan]
    words: [undangan, mutu, penari]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الشخص اللي بيرقص على المسرح اسمه …
      ar: من يرقص على المسرح يسمّى …
      en: Someone who dances on stage is a …
    options: [sukur, penari, mutu]
    answer: 1
    explain:
      ar_eg: penari = راقص. mutu = جودة.
      ar: penari = راقص، وmutu = جودة.
      en: penari = dancer; mutu = quality.
    words: [sukur, penari, mutu]
  - id: e06
    type: fill_blank
    sentence: Wong-wong ___ dawa ing ngarep lawang.
    meaning:
      ar_eg: الناس ___ طابور طويل قدام الباب.
      ar: ___ الناس في طابور طويل أمام الباب.
      en: People ___ in a long line at the door.
    options: [ngantre, deres, istimewa]
    answers: [ngantre]
    words: [ngantre, deres, istimewa]
  - id: e07
    type: multiple_choice
    question: Bengi iki ___ banget, ana tamu saka Mesir!
    options: [deres, seniman, istimewa]
    answer: 2
    explain:
      ar_eg: 'istimewa = مميز: الليلة مميزة.'
      ar: 'istimewa = مميّزة: الليلة مميّزة.'
      en: 'istimewa = special: tonight is special.'
    words: [deres, seniman, istimewa]
  - id: e08
    type: build_sentence
    source:
      ar_eg: جودة العرض ده حلوة أوي.
      ar: جودة هذا العرض عالية جدًا.
      en: The quality of this show is very good.
    answer: Mutu pentas iki apik banget.
    distractors: [penari, deres]
    words: [mutu]
  - id: e09
    type: translate
    direction: from_target
    source_text: Sukur, aku oleh undangan.
    answers_meaning:
      ar_eg: [الحمد لله، جالي دعوة, الحمد لله خدت دعوة]
      ar: [الحمد لله، حصلت على دعوة, الحمد لله، تلقّيت دعوة]
      en: ['Thank God, I got an invitation', 'Thankfully, I got an invite']
    words: [sukur, undangan]
  - id: e10
    type: speaking
    text: Seniman lan penari iki istimewa banget.
    meaning:
      ar_eg: الفنانين والراقصين دول مميزين جدًا.
      ar: هؤلاء الفنانون والراقصون مميّزون جدًا.
      en: These artists and dancers are really special.
    words: [seniman, penari, istimewa]
dialogue:
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, aku duwe undangan loro kanggo pentas campursari.
      ar_eg: يا محمد، معايا دعوتين لحفلة كامبورساري.
      ar: يا محمد، لديّ دعوتان لحفل كامبورساري.
      en: Mohamed, I've got two invitations to a campursari show.
    - speaker: Mohamed
      text: Wah, sukur! Kapan?
      ar_eg: الله، الحمد لله! إمتى؟
      ar: رائع، الحمد لله! متى؟
      en: Great, thank God! When?
    - speaker: Mbak Ayu
      text: Malem Minggu ing Taman Budaya Raden Saleh.
      ar_eg: ليلة الحد في تامان بودايا رادن صالح.
      ar: مساء السبت في تامان بودايا رادن صالح.
      en: Saturday night at Taman Budaya Raden Saleh.
    - speaker: Mohamed
      text: Mesthi akeh wong ngantre, ya?
      ar_eg: أكيد ناس كتير هتقف في الطابور، صح؟
      ar: لا بد أن كثيرين سيصطفّون، أليس كذلك؟
      en: Lots of people will be queuing, surely?
    - speaker: Mbak Ayu
      text: Mesthi. Senimane apik, penarine uga istimewa.
      ar_eg: أكيد. الفنانين حلوين، والراقصين كمان مميزين.
      ar: بالتأكيد. الفنانون ممتازون، والراقصون أيضًا مميّزون.
      en: Of course. The artists are good, and the dancers are special too.
    - speaker: Mohamed
      text: Muga-muga ora udan deres!
      ar_eg: يا رب ماتمطرش جامد!
      ar: عسى ألا تمطر بغزارة!
      en: Let's hope it doesn't pour!
