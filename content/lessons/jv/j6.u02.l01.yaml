    pos: noun
    ar_eg: علامة بتتحط على الحرف (زي التشكيل)
    ar: علامة تُضاف إلى الحرف (كالتشكيل)
    en: a mark added to a letter (like harakat)
  - word: wulu
    pos: noun
    ar_eg: "علامة i: دايرة فوق الحرف"
    ar: "علامة i: دائرة فوق الحرف"
    en: the i mark, a circle above the letter
  - word: suku
    pos: noun
    ar_eg: "علامة u: خطّاف تحت الحرف"
    ar: "علامة u: خطّاف تحت الحرف"
    en: the u mark, a hook below the letter
  - word: ngaji
    pos: verb
    ar_eg: يقرا قرآن / يدرس دين
    ar: يقرأ القرآن / يتعلّم الدين
    en: recite the Qur'an / study religion = mengaji
