    answers: ['Kurma Ajwa isih ana?', Kurma Ajwa isih ana, 'Kurma Ajwa isih ana, Mas?', 'Mas, kurma Ajwa isih ana?', 'Isih ana kurma Ajwa?', 'Kurma Ajwa isih onok?', 'Kurma Ajwane isih ana?']
