    answers_meaning:
      ar_eg: [استنى، هبلّغ الإدارة., استنى، هبلغ الإدارة, استنى هسأل الإدارة, لحظة، هبلّغ الفرع الرئيسي, استنى، هبلغ المركز]
      ar: [انتظر، سأبلغ المركز., انتظر، سأبلغ الإدارة, لحظة، سأبلغ المركز الرئيسي]
