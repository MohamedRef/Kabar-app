schema: kabar.lesson/v1
id: j1.u04.l03
language: jv
title: Sedhela, durung rampung
can_do:
  ar_eg: تقول إن الشغل لسه ما خلصش، إنك مشغول، وإن الحاجة سهلة ولا صعبة.
  ar: أن تقول إنّ العمل لم ينتهِ، وإنّك مشغول، وإنّ الأمر سهل أو صعب.
  en: Say the work isn't finished, that you're busy, and whether something is easy or hard.
slides:
  - title: Gawean
    body:
      ar_eg: |
        sedhela = لحظة: Sedhela, Mas! = لحظة يا ماس!
        gawean = شغل، مهمة: Gaweanku durung rampung = شغلي لسه ما خلصش.
        rampung = خلص. repot = مشغول ومتلبّك.
        gampang = سهل، angel = صعب.
        butuh = محتاج: Aku butuh kopi. perlu = لازم: Ora perlu takon = مش لازم تسأل.
      ar: |
        sedhela = لحظة: Sedhela, Mas! = لحظة يا أخي!
        gawean = عمل، مهمّة: Gaweanku durung rampung = لم ينتهِ عملي بعد.
        rampung = انتهى. repot = مشغول ومرتبك.
        gampang = سهل، angel = صعب.
        butuh = يحتاج: Aku butuh kopi. perlu = يلزم: Ora perlu takon = لا داعي للسؤال.
      en: |
        sedhela = a moment: Sedhela, Mas! = Just a moment, Mas!
        gawean = work, task: Gaweanku durung rampung = My work isn't finished yet.
        rampung = finished. repot = busy, swamped.
        gampang = easy, angel = hard.
        butuh = need: Aku butuh kopi. perlu = necessary: Ora perlu takon = No need to ask.
    examples:
      - text: Sedhela, Mas, tak lapor pusat.
        ar_eg: لحظة يا ماس، هبلّغ المركز.
        ar: لحظة يا أخي، سأبلغ المركز.
        en: Just a moment, Mas, I'll report to head office.
      - text: Gaweanku durung rampung.
        ar_eg: شغلي لسه ما خلصش.
        ar: لم ينتهِ عملي بعد.
        en: My work isn't finished yet.
      - text: Basa Jawa angel? Ora, gampang!
        ar_eg: الجاوي صعب؟ لأ، سهل!
        ar: هل الجاوية صعبة؟ لا، سهلة!
        en: Is Javanese hard? No, it's easy!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sedhela
        ar_eg: لحظة
        ar: لحظة
        en: a moment
      - text: rampung
        ar_eg: خلص
        ar: انتهى
        en: finished
      - text: gawean
        ar_eg: شغل، مهمة
        ar: عمل، مهمّة
        en: work, task
      - text: repot
        ar_eg: مشغول ومتلبّك
        ar: مشغول
        en: busy, swamped
    words: [sedhela, rampung, gawean, repot]
  - id: e02
    type: match_pairs
    pairs:
      - text: gampang
        ar_eg: سهل
        ar: سهل
        en: easy
      - text: angel
        ar_eg: صعب
        ar: صعب
        en: hard
      - text: butuh
        ar_eg: محتاج
        ar: يحتاج
        en: need
      - text: perlu
        ar_eg: لازم
        ar: ضروري
        en: necessary
    words: [gampang, angel, butuh, perlu]
  - id: e03
    type: listen
    text: Sedhela, Mas, tak lapor pusat.
    options: ['Sedhela, Mas, tak lapor pusat.', 'Sedhela, Mas, tak takon pusat.', 'Gampang, Mas, tak lapor pusat.']
    answer: 0
    meaning:
      ar_eg: لحظة يا ماس، هبلّغ المركز.
      ar: لحظة يا أخي، سأبلغ المركز.
      en: Just a moment, Mas, I'll report to head office.
    words: [sedhela, gampang]
  - id: e04
    type: fill_blank
    sentence: Gaweanku durung ___.
    meaning:
      ar_eg: شغلي لسه ما ___.
      ar: لم ___ عملي بعد.
      en: My work isn't ___ yet.
    options: [rampung, angel, perlu]
    answers: [rampung]
    words: [rampung, gawean, angel, perlu]
  - id: e05
    type: multiple_choice
    question: Basa Jawa gampang ta?
    question_meaning:
      ar_eg: بيسأل عن إيه؟
      ar: عمّ يسأل؟
      en: What is he asking?
    options: [هل الجاوي سهل؟, هل الجاوي صعب؟, هل الجاوي غالي؟]
    answer: 0
    explain:
      ar_eg: gampang = سهل، وعكسها angel = صعب.
      ar: gampang = سهل، وعكسها angel = صعب.
      en: gampang = easy; the opposite is angel = hard.
    words: [gampang, angel]
  - id: e06
    type: fill_blank
    sentence: Aku lagi ___, sedhela ya.
    meaning:
      ar_eg: أنا ___ دلوقتي، لحظة.
      ar: أنا ___ الآن، لحظة من فضلك.
      en: I'm ___ right now, one moment.
    options: [repot, gampang, butuh]
    answers: [repot]
    words: [repot, sedhela, gampang, butuh]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «مش لازم تسأل» بالجاوي؟
      ar: كيف تقول «لا داعي للسؤال» بالجاوية؟
      en: '"No need to ask" in Javanese?'
    options: [Ora perlu takon., Ora angel takon., Wis rampung takon.]
    answer: 0
    explain:
      ar_eg: perlu = لازم، فـOra perlu = مش لازم.
      ar: perlu = ضروري، فـOra perlu = لا داعي.
      en: perlu = necessary, so Ora perlu = no need.
    words: [perlu, angel, rampung]
  - id: e08
    type: build_sentence
    source:
      ar_eg: محتاج قهوة، الشغل صعب.
      ar: أحتاج قهوة، فالعمل صعب.
      en: I need coffee, the work is hard.
    answer: Aku butuh kopi, gaweane angel.
    distractors: [gampang, sedhela]
    words: [butuh, gawean, angel]
  - id: e09
    type: translate
    direction: from_target
    source_text: Gaweanku wis rampung, aku mulih.
    answers_meaning:
      ar_eg: [شغلي خلص، أنا مروّح, خلّصت شغلي وهروّح]
      ar: [انتهى عملي، سأعود إلى البيت, أنهيت عملي وسأعود إلى البيت]
      en: ['My work is done, I''m going home', 'I''ve finished my work, I''m heading home']
    words: [gawean, rampung]
  - id: e10
    type: speaking
    text: Repot? Ora, gampang kok!
    meaning:
      ar_eg: مشغول؟ لأ، دي سهلة!
      ar: مشغول؟ لا، الأمر سهل!
      en: Busy? No, it's easy!
    words: [repot, gampang]
dialogue:
  lines:
    - speaker: Mas Heru
      text: Cah, ayo ngopi! Gaweanmu wis rampung?
      ar_eg: يا جدع، يلا نشرب قهوة! شغلك خلص؟
      ar: يا صاحبي، هيّا نشرب القهوة! هل انتهى عملك؟
      en: Mate, let's grab a coffee! Is your work done?
    - speaker: Mohamed
      text: Durung, Mas. Aku repot, sedhela ya.
      ar_eg: لسه يا ماس. أنا مشغول، لحظة.
      ar: ليس بعد يا ماس. أنا مشغول، لحظة.
      en: Not yet, Mas. I'm swamped, one moment.
    - speaker: Mas Heru
      text: Angel ta? Butuh tulung?
      ar_eg: صعب؟ محتاج مساعدة؟
      ar: هل هو صعب؟ تحتاج مساعدة؟
      en: Is it hard? Need a hand?
    - speaker: Mohamed
      text: Ora perlu, Mas. Gampang kok.
      ar_eg: مش لازم يا ماس. سهلة.
      ar: لا داعي يا ماس. الأمر سهل.
      en: No need, Mas. It's easy.
    - speaker: Mas Heru
      text: Ya wis, tak tunggu neng warung.
      ar_eg: خلاص، هستناك في القهوة.
      ar: حسنًا، سأنتظرك في المقهى.
      en: All right, I'll wait for you at the stall.
